# =============================================================================
# task_2916 — Esports Organization Player Contracts & Team Operations
# Scaffold seed tables (§1.0–§1.7).
# §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml, §1.9 in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2916. Esports Organization Player Contracts & Team Operations (professional
  esports organization): player scouting, tryout and contract negotiation with
  salary, prize split and streaming obligations, league participation
  requirements including roster locks, minimum salary rules and player
  association terms, minor player protections with guardian consent, education
  requirements and work hour limits, team house or facility operations with
  practice schedules, coaching staff and performance support, sponsorship
  obligations distributed across players with content deliverables and
  exclusivity conflicts, prize money distribution with organization and player
  splits and tax withholding, roster changes with transfer fees, buyouts and
  free agency windows, player wellness programs and burnout monitoring

domain_name: "esports-org-operations"

# All resource collections are top-level (flat/graph topology); nested paths are
# used only for reverse-reachability reads and nested creation.
api_prefix: "/"

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # Player, Organization, SponsorshipDeal and PlayerContract form a
  # many-to-many web: DeliverableAssignment is a deal x contract junction,
  # PrizeAllocation is a distribution x contract junction, PracticeBlock holds
  # a participant membership list of Player ids, and ContractOffer is
  # self-referential through supersedes_offer_id.

  state_machine_shape: cyclic
  # ContractOffer cycles SENT -> COUNTERED -> SENT across negotiation rounds;
  # DeliverableAssignment cycles SUBMITTED -> REJECTED -> SUBMITTED;
  # PlayerContract carries two independent dimensions
  # (contract_status x obligation_status); RosterMove branches
  # PENDING -> {APPROVED, REJECTED} and then EXECUTED -> REVERSED;
  # SponsorshipDeal auto-transitions to FULFILLED from child approval counts.

  relationship_patterns:
    - one_to_many          # Organization -> TeamHouse, PlayerContract, RosterMove
    - many_to_many         # DeliverableAssignment (deal x contract), PrizeAllocation
    - self_referential     # ContractOffer.supersedes_offer_id -> ContractOffer.id
    - cross_aggregate      # PracticeBlock (ops aggregate) reads PlayerContract (contract aggregate)

  role_model: segregation_of_duties
  # LeagueAdmin may both calculate and approve a PrizeDistribution, but the
  # approving X-User-ID must differ from the calculating X-User-ID.
  # GeneralManager requests roster moves, LeagueAdmin approves them, and the
  # GeneralManager executes only after approval.

  consistency_model: immediate
  difficulty_level: expert

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: League
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: League display name
        constraints: "1-120 chars"
      - name: season_start_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant the season opens
      - name: season_end_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant the season closes; must be > season_start_at
      - name: roster_lock_at
        type: datetime
        source: input
        description: >-
          ISO 8601 UTC instant from which roster-changing operations are frozen;
          the lock is active when current_utc >= roster_lock_at
      - name: transfer_window_open_at
        type: datetime
        source: input
        description: Inclusive start of the transfer window
      - name: transfer_window_close_at
        type: datetime
        source: input
        description: Exclusive end of the transfer window; must be > transfer_window_open_at
      - name: minimum_salary_cents
        type: integer
        source: input
        default: 3600000
        description: League minimum annual base salary in cents
        constraints: ">= 0"
      - name: min_roster_size
        type: integer
        source: input
        default: 1
        description: Minimum count of ACTIVE PlayerContracts an Organization must keep
        constraints: ">= 0"
      - name: max_roster_size
        type: integer
        source: input
        default: 7
        description: Maximum count of ACTIVE PlayerContracts an Organization may hold
        constraints: ">= min_roster_size"
      - name: offer_response_window_hours
        type: integer
        source: input
        default: 72
        description: Hours a SENT ContractOffer stays answerable before it expires
        constraints: ">= 1"
      - name: max_negotiation_rounds
        type: integer
        source: input
        default: 3
        description: Maximum ContractOffer.round_number reachable through counter/revise cycling
        constraints: ">= 1"
      - name: player_association_levy_bp
        type: integer
        source: input
        default: 250
        description: Player-association levy in basis points, taken off gross prize money first
        constraints: "0-10000"
      - name: association_min_prize_split_bp
        type: integer
        source: input
        default: 4000
        description: Player-association floor for PlayerContract.prize_split_player_pct_bp
        constraints: "0-10000"
      - name: association_max_streaming_hours_per_week
        type: integer
        source: input
        default: 20
        description: Player-association ceiling for contracted weekly streaming hours
        constraints: ">= 0"
      - name: minor_max_weekly_minutes
        type: integer
        source: input
        default: 1200
        description: Statutory weekly work-minute ceiling for players with is_minor == true
        constraints: ">= 0"
      - name: adult_max_weekly_minutes
        type: integer
        source: input
        default: 2700
        description: Weekly work-minute ceiling for players with is_minor == false
        constraints: ">= 0"
      - name: education_reserved_minutes
        type: integer
        source: input
        default: 600
        description: >-
          Weekly minutes reserved for schooling, subtracted from a minor's cap when
          education_enrollment_status == ENROLLED_FULL_TIME
        constraints: ">= 0"
      - name: minor_age_threshold_years
        type: integer
        source: input
        default: 18
        description: Age in whole years below which a Player is a minor
        constraints: "1-25"
      - name: free_agency_cooldown_days
        type: integer
        source: input
        default: 14
        description: >-
          Days after a RELEASE/TRANSFER_OUT execution during which the releasing
          Organization may not offer the same Player a new contract
        constraints: ">= 0"
      - name: tryout_required_before_offer
        type: boolean
        source: input
        default: false
        description: >-
          When true, ContractOffer creation requires the Player to be in
          TRYOUT_COMPLETED; when false PROSPECT and FREE_AGENT are also accepted
      - name: roster_lock_active
        type: boolean
        source: computed
        description: "true when current_utc >= roster_lock_at (see calculations.league_window_state)"

  - name: Organization
    parent: null
    common_fields: true
    fields:
      - name: league_id
        type: string
        source: input
        description: "FK -> League.id; the league this organization competes in"
      - name: name
        type: string
        source: input
        description: Organization display name
        constraints: "1-120 chars"
      - name: tax_jurisdiction_code
        type: string
        source: input
        description: Withholding jurisdiction of the paying organization
        constraints: "2-8 chars, uppercase"
      - name: annual_salary_budget_cents
        type: integer
        source: input
        description: Hard salary budget in cents for the season
        constraints: ">= 0"
      - name: org_prize_share_bp
        type: integer
        source: input
        default: 3500
        description: Organization's share of distributable prize money in basis points
        constraints: "0-10000"
      - name: committed_salary_cents
        type: integer
        source: computed
        default: 0
        description: >-
          Sum of PlayerContract.provisional_cap_charge_cents over contracts of this
          organization whose contract_status IN {ACTIVE, SUSPENDED}
      - name: uncommitted_salary_cents
        type: integer
        source: computed
        description: "annual_salary_budget_cents - committed_salary_cents"
      - name: active_roster_count
        type: integer
        source: computed
        default: 0
        description: Count of PlayerContracts of this organization with contract_status == ACTIVE
      - name: prize_payable_cents
        type: integer
        source: computed
        default: 0
        description: >-
          Sum of PrizeDistribution.org_share_cents over this organization's
          distributions whose distribution_status IN {CALCULATED, APPROVED}
      - name: wellness_flag_count
        type: integer
        source: computed
        default: 0
        description: >-
          Count of obligation_status transitions into BREACH recorded across this
          organization's contracts (monotonically increasing)

  - name: Player
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Player legal name
        constraints: "1-120 chars"
      - name: birth_date
        type: string
        source: input
        description: "Date of birth, YYYY-MM-DD"
      - name: region_code
        type: string
        source: input
        description: Competitive region the player was scouted in
        constraints: "2-8 chars, uppercase"
      - name: association_member
        type: boolean
        source: input
        default: false
        description: >-
          true when the player is a player-association member; association terms
          (prize-split floor, streaming ceiling) are enforced only for members
      - name: player_status
        type: enum
        source: computed
        default: PROSPECT
        description: Scouting/roster lifecycle state
        constraints: "PROSPECT | TRYOUT_INVITED | TRYOUT_COMPLETED | SIGNED | FREE_AGENT"
      - name: current_organization_id
        type: string
        source: computed
        default: null
        description: >-
          FK -> Organization.id; set when a PlayerContract for this player becomes
          ACTIVE, cleared when it leaves ACTIVE/SUSPENDED
      - name: age_years
        type: integer
        source: computed
        description: >-
          Whole years between birth_date and current_utc (see
          calculations.player_minor_status)
      - name: is_minor
        type: boolean
        source: computed
        description: "true when age_years < League.minor_age_threshold_years"
      - name: guardian_consent_status
        type: enum
        source: computed
        default: NOT_REQUIRED
        description: >-
          NOT_REQUIRED for adults; REQUIRED at creation for a player whose age_years <
          League.minor_age_threshold_years; GRANTED after POST /players/{id}/guardian-consent
        constraints: "NOT_REQUIRED | REQUIRED | GRANTED"
      - name: guardian_name
        type: string
        source: input
        default: null
        description: Guardian legal name, recorded at scouting or at consent time
      - name: guardian_email
        type: string
        source: input
        default: null
        description: Guardian contact email
      - name: guardian_weekly_cap_minutes
        type: integer
        source: input
        default: null
        description: >-
          Guardian-imposed weekly work-minute ceiling; combined with the league
          minor ceiling by calculations.weekly_hour_cap
        constraints: ">= 0"
      - name: education_enrollment_status
        type: enum
        source: input
        default: NOT_ENROLLED
        description: Schooling status declared on the guardian consent record
        constraints: "NOT_ENROLLED | ENROLLED_PART_TIME | ENROLLED_FULL_TIME"
      - name: free_agency_window_ends_at
        type: datetime
        source: computed
        default: null
        description: >-
          current_utc + League.free_agency_cooldown_days, stamped when a RELEASE or
          TRANSFER_OUT RosterMove executes; blocks re-signing by the releasing org
      - name: last_release_organization_id
        type: string
        source: computed
        default: null
        description: >-
          FK -> Organization.id; the organization whose RosterMove released this
          player most recently (paired with free_agency_window_ends_at)
      - name: scouted_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the Scout that created the record

  - name: ContractOffer
    parent: null
    common_fields: true
    fields:
      - name: organization_id
        type: string
        source: input
        description: "FK -> Organization.id; the offering organization"
      - name: player_id
        type: string
        source: input
        description: "FK -> Player.id; the player being offered terms"
      - name: supersedes_offer_id
        type: string
        source: input
        default: null
        description: >-
          FK -> ContractOffer.id; when present, that offer is driven to SUPERSEDED
          by this creation (self-referential negotiation chain)
      - name: offer_status
        type: enum
        source: computed
        default: SENT
        description: Negotiation state
        constraints: "SENT | COUNTERED | ACCEPTED | DECLINED | EXPIRED | SUPERSEDED"
      - name: round_number
        type: integer
        source: computed
        default: 1
        description: >-
          Negotiation round; incremented by POST /contract-offers/{id}/revise, capped
          by League.max_negotiation_rounds
      - name: base_salary_cents
        type: integer
        source: input
        description: Annual base salary in cents currently on the table
        constraints: ">= 0"
      - name: term_months
        type: integer
        source: input
        description: Contract term in months (a month is 30 days for date arithmetic)
        constraints: "1-60"
      - name: prize_split_player_pct_bp
        type: integer
        source: input
        description: Player's prize-split weight in basis points
        constraints: "0-10000"
      - name: streaming_hours_per_week
        type: integer
        source: input
        description: Contracted streaming obligation in hours per week
        constraints: "0-80"
      - name: signing_bonus_cents
        type: integer
        source: input
        default: 0
        description: One-off signing bonus in cents, charged to the cap in full
        constraints: ">= 0"
      - name: buyout_multiplier_bp
        type: integer
        source: input
        default: 5000
        description: Multiplier in basis points applied to remaining salary when buying the contract out
        constraints: "0-30000"
      - name: tax_residency_code
        type: string
        source: input
        description: Player's tax residency for prize withholding
        constraints: "2-8 chars, uppercase"
      - name: counter_base_salary_cents
        type: integer
        source: input
        default: null
        description: Salary proposed by the agent on the most recent counter
      - name: counter_prize_split_player_pct_bp
        type: integer
        source: input
        default: null
        description: Prize-split weight proposed by the agent on the most recent counter
      - name: counter_streaming_hours_per_week
        type: integer
        source: input
        default: null
        description: Streaming hours proposed by the agent on the most recent counter
      - name: counter_note
        type: string
        source: input
        default: null
        description: Free-text note attached to the most recent counter
      - name: decline_note
        type: string
        source: input
        default: null
        description: Free-text note attached to a decline
      - name: sent_at
        type: datetime
        source: computed
        description: >-
          current_utc at creation, refreshed on every revise; the expiry clock restarts
          from this instant
      - name: expires_at
        type: datetime
        source: computed
        description: "sent_at + League.offer_response_window_hours hours"

  - name: PlayerContract
    parent: null
    common_fields: true
    fields:
      - name: offer_id
        type: string
        source: computed
        description: "FK -> ContractOffer.id; the accepted offer this contract materialised from"
      - name: player_id
        type: string
        source: computed
        description: "FK -> Player.id"
      - name: organization_id
        type: string
        source: computed
        description: "FK -> Organization.id"
      - name: contract_status
        type: enum
        source: computed
        default: ACTIVE
        description: "Employment dimension; evolves independently of obligation_status"
        constraints: "ACTIVE | SUSPENDED | TERMINATED"
      - name: obligation_status
        type: enum
        source: computed
        default: COMPLIANT
        description: >-
          Wellness/obligation dimension; escalation-only (COMPLIANT -> WARNED -> BREACH),
          never auto-de-escalated
        constraints: "COMPLIANT | WARNED | BREACH"
      - name: base_salary_cents
        type: integer
        source: computed
        description: Copied from the accepted offer's base_salary_cents (frozen)
      - name: term_months
        type: integer
        source: computed
        description: Copied from the accepted offer's term_months (frozen)
      - name: signing_bonus_cents
        type: integer
        source: computed
        description: Copied from the accepted offer's signing_bonus_cents (frozen)
      - name: prize_split_player_pct_bp
        type: integer
        source: computed
        description: Copied from the accepted offer (frozen); prize-allocation weight
      - name: streaming_hours_per_week
        type: integer
        source: computed
        description: Copied from the accepted offer (frozen); streaming obligation
      - name: buyout_multiplier_bp
        type: integer
        source: computed
        description: Copied from the accepted offer (frozen)
      - name: tax_residency_code
        type: string
        source: computed
        description: Copied from the accepted offer (frozen); drives withholding rate selection
      - name: effective_at
        type: datetime
        source: input
        description: >-
          Contract start instant; defaults to current_utc at acceptance when the
          accept payload omits it
      - name: ends_at
        type: datetime
        source: computed
        description: "effective_at + term_months * 30 days"
      - name: provisional_cap_charge_cents
        type: integer
        source: computed
        description: >-
          PRORATED_REMAINING_TERM variant of calculations.salary_cap_charge, frozen at
          acceptance; the only value Organization.committed_salary_cents ever moves by
      - name: final_cap_charge_cents
        type: integer
        source: computed
        description: >-
          FULL_SEASON_EQUIVALENT variant of calculations.salary_cap_charge, recomputed on
          read; used by league approval of roster moves
      - name: season_practice_minutes
        type: integer
        source: computed
        default: 0
        description: Cumulative minutes of HELD PracticeBlocks this player attended since effective_at
      - name: last_self_reported_load
        type: integer
        source: input
        default: 0
        description: Most recent self-reported load from a wellness report
        constraints: "0-10"
      - name: reported_streaming_minutes_7d
        type: integer
        source: input
        default: 0
        description: Streaming minutes reported for the trailing 7 days
        constraints: ">= 0"
      - name: burnout_score
        type: integer
        source: computed
        default: 0
        description: >-
          ROLLING_7DAY variant of calculations.burnout_score, refreshed by wellness
          reports and by practice-block completion
        constraints: "0-100"
      - name: wellness_hold_until
        type: datetime
        source: computed
        default: null
        description: >-
          current_utc + 7 days, stamped when obligation_status enters BREACH; blocks
          new practice blocks for this player
      - name: suspension_reason
        type: string
        source: input
        default: null
        description: Reason recorded by the league when the contract is suspended
      - name: signed_by_user_id
        type: string
        source: system
        description: Opaque/entity X-User-ID that accepted the offer

  - name: TeamHouse
    parent: Organization
    common_fields: true
    fields:
      - name: organization_id
        type: string
        source: computed
        description: "FK -> Organization.id; taken from the nested creation path"
      - name: name
        type: string
        source: input
        description: Facility name
        constraints: "1-120 chars"
      - name: timezone
        type: string
        source: input
        description: IANA timezone label of the facility (metadata only; all instants are UTC)
      - name: turnaround_buffer_minutes
        type: integer
        source: input
        default: 60
        description: >-
          Minutes of mandatory turnaround padded around every block on this facility
          (see calculations.facility_slot_conflict)
        constraints: "0-720"
      - name: concurrent_seat_capacity
        type: integer
        source: input
        default: 10
        description: Maximum participants a single block on this facility may hold
        constraints: ">= 1"

  - name: PracticeBlock
    parent: null
    common_fields: true
    fields:
      - name: organization_id
        type: string
        source: input
        description: "FK -> Organization.id; owning organization"
      - name: team_house_id
        type: string
        source: input
        description: "FK -> TeamHouse.id; occupied facility"
      - name: block_type
        type: enum
        source: input
        description: Purpose of the block
        constraints: "SCRIM | REVIEW | INDIVIDUAL | TRYOUT"
      - name: starts_at
        type: datetime
        source: input
        description: Inclusive start instant of the occupation interval
      - name: ends_at
        type: datetime
        source: input
        description: Exclusive end instant of the occupation interval; must be > starts_at
      - name: duration_minutes
        type: integer
        source: computed
        description: "Whole minutes between starts_at and ends_at (ends_at - starts_at)"
      - name: participant_player_ids
        type: array
        source: input
        description: >-
          Array of Player.id values attending this block; every element must resolve to
          a Player, and each element is counted against that player's weekly cap
        constraints: "1..TeamHouse.concurrent_seat_capacity elements, no duplicates"
      - name: coach_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the CoachingStaff member that created the block
      - name: block_status
        type: enum
        source: computed
        default: SCHEDULED
        description: Block lifecycle
        constraints: "SCHEDULED | HELD | CANCELLED"
      - name: cancel_reason
        type: enum
        source: input
        default: null
        description: >-
          Why the block was cancelled; WELLNESS_HOLD and CONTRACT_SUSPENDED are only ever
          written by cascades, never accepted from a client
        constraints: "COACH_CANCELLED | WELLNESS_HOLD | CONTRACT_SUSPENDED"
      - name: coach_note
        type: string
        source: input
        default: null
        description: Free-text note recorded at completion

  - name: SponsorshipDeal
    parent: null
    common_fields: true
    fields:
      - name: organization_id
        type: string
        source: input
        description: "FK -> Organization.id; the org that signed the sponsor"
      - name: sponsor_name
        type: string
        source: input
        description: Sponsor brand name
        constraints: "1-120 chars"
      - name: exclusivity_category
        type: enum
        source: input
        description: >-
          Product category this deal claims exclusively; two ACTIVE deals in the same
          category may not both hold live deliverables on one contract
        constraints: "ENERGY_DRINK | PERIPHERALS | APPAREL | BETTING | CRYPTO"
      - name: total_fee_cents
        type: integer
        source: input
        description: Total sponsorship fee in cents
        constraints: ">= 0"
      - name: deliverable_count_required
        type: integer
        source: input
        description: Number of deliverables the org must place across its roster
        constraints: ">= 1"
      - name: starts_at
        type: datetime
        source: input
        description: Deal coverage start instant
      - name: ends_at
        type: datetime
        source: input
        description: Deal coverage end instant; must be > starts_at
      - name: deal_status
        type: enum
        source: computed
        default: DRAFT
        description: >-
          Deal lifecycle; FULFILLED is reached by bubble-up when approved_count ==
          deliverable_count_required and reverts to ACTIVE when a cascade voids an approved row
        constraints: "DRAFT | ACTIVE | FULFILLED"
      - name: assigned_count
        type: integer
        source: computed
        default: 0
        description: >-
          Count of this deal's DeliverableAssignments whose assignment_status IN
          {ASSIGNED, SUBMITTED, APPROVED, REJECTED} (VOIDED rows excluded)
      - name: approved_count
        type: integer
        source: computed
        default: 0
        description: Count of this deal's DeliverableAssignments with assignment_status == APPROVED
      - name: minor_permitted
        type: boolean
        source: computed
        description: >-
          false when exclusivity_category IN {BETTING, CRYPTO, ENERGY_DRINK}; minors may
          not receive deliverables from a deal with minor_permitted == false

  - name: DeliverableAssignment
    parent: SponsorshipDeal
    common_fields: true
    fields:
      - name: sponsorship_deal_id
        type: string
        source: computed
        description: "FK -> SponsorshipDeal.id; taken from the nested creation path"
      - name: contract_id
        type: string
        source: input
        description: "FK -> PlayerContract.id; the contract carrying the obligation"
      - name: deliverable_type
        type: enum
        source: input
        description: Content format owed
        constraints: "STREAM_SEGMENT | SOCIAL_POST | APPEARANCE | VOD_FEATURE"
      - name: due_at
        type: datetime
        source: input
        description: Deadline instant for submission
      - name: fee_share_cents
        type: integer
        source: computed
        description: >-
          floor(SponsorshipDeal.total_fee_cents / SponsorshipDeal.deliverable_count_required)
          frozen at assignment time
      - name: assignment_status
        type: enum
        source: computed
        default: ASSIGNED
        description: Deliverable lifecycle; SUBMITTED -> REJECTED -> SUBMITTED may cycle
        constraints: "ASSIGNED | SUBMITTED | APPROVED | REJECTED | VOIDED"
      - name: rejection_count
        type: integer
        source: computed
        default: 0
        description: Number of times this deliverable has been reviewed with decision REJECT
      - name: submission_note
        type: string
        source: input
        default: null
        description: Note attached to the most recent submission
      - name: review_note
        type: string
        source: input
        default: null
        description: Note attached to the most recent review

  - name: PrizeDistribution
    parent: null
    common_fields: true
    fields:
      - name: organization_id
        type: string
        source: input
        description: "FK -> Organization.id; the org that won the prize"
      - name: league_id
        type: string
        source: input
        description: "FK -> League.id; the league whose association levy applies"
      - name: tournament_name
        type: string
        source: input
        description: Tournament label
        constraints: "1-120 chars"
      - name: placement
        type: integer
        source: input
        description: Finishing placement (1 = first)
        constraints: ">= 1"
      - name: gross_prize_cents
        type: integer
        source: input
        description: Gross prize money awarded, in cents
        constraints: ">= 0"
      - name: tournament_end_at
        type: datetime
        source: input
        description: >-
          Instant the tournament ended; only contracts effective at or before this
          instant are eligible for allocation
      - name: distribution_status
        type: enum
        source: computed
        default: DRAFT
        description: Distribution lifecycle
        constraints: "DRAFT | CALCULATED | APPROVED | VOIDED"
      - name: association_levy_cents
        type: integer
        source: computed
        default: 0
        description: "round_half_up(gross_prize_cents * League.player_association_levy_bp / 10000)"
      - name: org_share_cents
        type: integer
        source: computed
        default: 0
        description: "round_half_up((gross_prize_cents - association_levy_cents) * Organization.org_prize_share_bp / 10000)"
      - name: allocated_cents
        type: integer
        source: computed
        default: 0
        description: Sum of gross_share_cents over this distribution's non-VOIDED allocations
      - name: unallocated_cents
        type: integer
        source: computed
        description: "gross_prize_cents - association_levy_cents - org_share_cents - allocated_cents"
      - name: withholding_total_cents
        type: integer
        source: computed
        default: 0
        description: Sum of withholding_cents over this distribution's non-VOIDED allocations
      - name: escrow_total_cents
        type: integer
        source: computed
        default: 0
        description: Sum of escrow_holdback_cents over this distribution's non-VOIDED allocations
      - name: calculated_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID that ran the calculation (segregation-of-duties anchor)
      - name: approved_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID that approved the distribution; must differ from calculated_by_user_id
      - name: void_reason
        type: string
        source: input
        default: null
        description: Reason recorded when the distribution is voided

  - name: PrizeAllocation
    parent: PrizeDistribution
    common_fields: true
    fields:
      - name: prize_distribution_id
        type: string
        source: computed
        description: "FK -> PrizeDistribution.id"
      - name: contract_id
        type: string
        source: computed
        description: "FK -> PlayerContract.id; the eligible contract this row pays"
      - name: weight_bp
        type: integer
        source: computed
        description: Copy of PlayerContract.prize_split_player_pct_bp at calculation time
      - name: gross_share_cents
        type: integer
        source: computed
        description: >-
          Player-pool share after per-row floor plus (for exactly one row) the
          remainder assignment; see calculations.prize_allocation
      - name: withholding_rate_bp
        type: integer
        source: computed
        description: >-
          1500 when PlayerContract.tax_residency_code == Organization.tax_jurisdiction_code,
          otherwise 3000
      - name: withholding_cents
        type: integer
        source: computed
        description: "round_half_up(gross_share_cents * withholding_rate_bp / 10000)"
      - name: escrow_holdback_cents
        type: integer
        source: computed
        default: 0
        description: >-
          round_half_up(gross_share_cents * 1000 / 10000) when the paid player is a minor,
          otherwise 0 (minor trust holdback)
      - name: net_cents
        type: integer
        source: computed
        description: "gross_share_cents - withholding_cents - escrow_holdback_cents"
      - name: allocation_status
        type: enum
        source: computed
        default: CALCULATED
        description: Allocation lifecycle, driven by the parent distribution
        constraints: "CALCULATED | APPROVED | VOIDED"

  - name: RosterMove
    parent: null
    common_fields: true
    fields:
      - name: organization_id
        type: string
        source: input
        description: "FK -> Organization.id; the org requesting the move"
      - name: player_id
        type: string
        source: input
        description: "FK -> Player.id; the player being moved"
      - name: contract_id
        type: string
        source: input
        default: null
        description: >-
          FK -> PlayerContract.id; required for every move_type — for RELEASE and TRANSFER_OUT it names the
          contract being ended, and for SIGN it names the already-accepted contract the league signs off on
          (the contract whose FULL_SEASON_EQUIVALENT charge the APPROVE decision re-tests)
      - name: transfer_to_organization_id
        type: string
        source: input
        default: null
        description: >-
          FK -> Organization.id; required for TRANSFER_OUT, forbidden for other move types
      - name: move_type
        type: enum
        source: input
        description: Kind of roster change
        constraints: "SIGN | RELEASE | TRANSFER_OUT"
      - name: move_status
        type: enum
        source: computed
        default: PENDING
        description: Approval/execution lifecycle
        constraints: "PENDING | APPROVED | REJECTED | EXECUTED | REVERSED"
      - name: gross_transfer_fee_cents
        type: integer
        source: input
        default: 0
        description: Fee the receiving organization pays; only meaningful for TRANSFER_OUT
        constraints: ">= 0"
      - name: buyout_credit_cents
        type: integer
        source: computed
        default: 0
        description: Remaining-salary buyout owed to the player, per calculations.transfer_settlement
      - name: commission_tier_bp
        type: integer
        source: computed
        default: 0
        description: Agent commission tier in basis points, selected from (gross_transfer_fee_cents - buyout_credit_cents)
      - name: agent_commission_cents
        type: integer
        source: computed
        default: 0
        description: "round_half_up((gross_transfer_fee_cents - buyout_credit_cents) * commission_tier_bp / 10000)"
      - name: net_to_org_cents
        type: integer
        source: computed
        default: 0
        description: "gross_transfer_fee_cents - agent_commission_cents - buyout_credit_cents"
      - name: released_cap_cents
        type: integer
        source: computed
        default: 0
        description: >-
          PlayerContract.provisional_cap_charge_cents released from
          Organization.committed_salary_cents at execution; re-committed byte-for-byte on reversal
      - name: effective_at
        type: datetime
        source: input
        description: Instant the move takes effect; defaults to current_utc at creation
      - name: requested_by_user_id
        type: string
        source: system
        description: X-User-ID of the GeneralManager that created the move
      - name: approved_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the LeagueAdmin that approved the move
      - name: decision_note
        type: string
        source: input
        default: null
        description: Note recorded by the LeagueAdmin on the approve/reject decision
      - name: reversal_reason
        type: string
        source: input
        default: null
        description: Reason recorded when an executed move is reversed

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---- Player: cyclic (SIGNED -> FREE_AGENT -> TRYOUT_INVITED -> SIGNED) -----
  - entity: Player
    initial_state: PROSPECT
    terminal_states: []
    note: >-
      Cyclic by design: a released player re-enters the scouting funnel. No terminal
      state exists; player_status is only ever moved by the transitions below.
    transitions:
      - from: PROSPECT
        to: TRYOUT_INVITED
        trigger: "POST /practice-blocks with block_type == TRYOUT listing this player in participant_player_ids"
        actor: CoachingStaff
        preconditions:
          - "player_status IN {PROSPECT, FREE_AGENT}"
          - "calculations.weekly_hour_cap is satisfied for this player (see validations priority 9)"
        side_effects:
          - "player_status := TRYOUT_INVITED"
          - "Player.updated_at refreshed; Player.version += 1"
      - from: FREE_AGENT
        to: TRYOUT_INVITED
        trigger: "POST /practice-blocks with block_type == TRYOUT listing this player in participant_player_ids"
        actor: CoachingStaff
        preconditions:
          - "player_status == FREE_AGENT"
        side_effects:
          - "player_status := TRYOUT_INVITED"
        note: "Closes the cycle SIGNED -> FREE_AGENT -> TRYOUT_INVITED -> SIGNED."
      - from: TRYOUT_INVITED
        to: TRYOUT_COMPLETED
        trigger: "POST /practice-blocks/{id}/complete on a block_type == TRYOUT block"
        actor: CoachingStaff
        preconditions:
          - "block_status == SCHEDULED"
          - "current_utc >= PracticeBlock.ends_at"
        side_effects:
          - "player_status := TRYOUT_COMPLETED for every participant whose player_status == TRYOUT_INVITED"
      - from: TRYOUT_COMPLETED
        to: SIGNED
        trigger: "POST /contract-offers/{id}/accept"
        actor: PlayerAgent
        preconditions:
          - "the created PlayerContract has contract_status == ACTIVE"
        side_effects:
          - "player_status := SIGNED"
          - "current_organization_id := ContractOffer.organization_id"
          - "free_agency_window_ends_at := null; last_release_organization_id := null"
          - "Player.version += 1 (link 2 of the acceptance cascade)"
      - from: PROSPECT
        to: SIGNED
        trigger: "POST /contract-offers/{id}/accept"
        actor: PlayerAgent
        preconditions:
          - "League.tryout_required_before_offer == false (otherwise the offer could not have been created)"
        side_effects:
          - "player_status := SIGNED; current_organization_id := ContractOffer.organization_id"
      - from: FREE_AGENT
        to: SIGNED
        trigger: "POST /contract-offers/{id}/accept"
        actor: PlayerAgent
        preconditions:
          - "current_utc >= free_agency_window_ends_at OR ContractOffer.organization_id != last_release_organization_id"
        side_effects:
          - "player_status := SIGNED; current_organization_id := ContractOffer.organization_id"
          - "free_agency_window_ends_at := null; last_release_organization_id := null"
      - from: SIGNED
        to: FREE_AGENT
        trigger: "POST /roster-moves/{id}/execute for move_type IN {RELEASE, TRANSFER_OUT}"
        actor: GeneralManager
        preconditions:
          - "RosterMove.move_status == APPROVED"
          - "PlayerContract.contract_status IN {ACTIVE, SUSPENDED}"
        side_effects:
          - "player_status := FREE_AGENT; current_organization_id := null"
          - "free_agency_window_ends_at := current_utc + League.free_agency_cooldown_days days"
          - "last_release_organization_id := RosterMove.organization_id"
      - from: FREE_AGENT
        to: SIGNED
        trigger: "POST /roster-moves/{id}/reverse"
        actor: LeagueAdmin
        preconditions:
          - "RosterMove.move_status == EXECUTED"
        side_effects:
          - "player_status := SIGNED; current_organization_id := RosterMove.organization_id"
          - "free_agency_window_ends_at := null; last_release_organization_id := null"
        note: "Compensating transition; pairs with SIGNED -> FREE_AGENT above."

  # ---- ContractOffer: cyclic negotiation rounds ------------------------------
  - entity: ContractOffer
    initial_state: SENT
    terminal_states: [ACCEPTED, DECLINED, EXPIRED, SUPERSEDED]
    note: >-
      SENT -> COUNTERED -> SENT is a true cycle; round_number increments on each
      revise and is capped by League.max_negotiation_rounds.
    transitions:
      - from: SENT
        to: COUNTERED
        trigger: "POST /contract-offers/{id}/counter"
        actor: PlayerAgent
        preconditions:
          - "offer_status == SENT"
          - "current_utc < expires_at (lazy expiry has not fired)"
          - "X-User-ID == ContractOffer.player_id"
        side_effects:
          - "offer_status := COUNTERED"
          - "counter_base_salary_cents / counter_prize_split_player_pct_bp / counter_streaming_hours_per_week / counter_note recorded"
      - from: COUNTERED
        to: SENT
        trigger: "POST /contract-offers/{id}/revise"
        actor: GeneralManager
        preconditions:
          - "offer_status == COUNTERED"
          - "round_number < League.max_negotiation_rounds"
          - "revised base_salary_cents >= League.minimum_salary_cents"
        side_effects:
          - "offer_status := SENT; round_number += 1"
          - "base_salary_cents / prize_split_player_pct_bp / streaming_hours_per_week overwritten with the revised terms"
          - "sent_at := current_utc; expires_at := sent_at + League.offer_response_window_hours hours"
          - "counter_* fields cleared to null"
        note: "Closes the negotiation cycle; the expiry clock restarts from the new sent_at."
      - from: SENT
        to: ACCEPTED
        trigger: "POST /contract-offers/{id}/accept"
        actor: PlayerAgent
        preconditions:
          - "offer_status == SENT"
          - "current_utc < expires_at"
          - "X-User-ID == ContractOffer.player_id"
          - "Player.is_minor == false OR Player.guardian_consent_status == GRANTED"
          - "League.roster_lock_active == false"
          - "Organization.uncommitted_salary_cents >= the new contract's provisional_cap_charge_cents"
        side_effects:
          - "offer_status := ACCEPTED"
          - "CASCADE link 1: a PlayerContract is created with contract_status ACTIVE, obligation_status COMPLIANT, terms frozen from this offer, provisional_cap_charge_cents := calculations.salary_cap_charge variant PRORATED_REMAINING_TERM"
          - "CASCADE link 2: because that contract exists, Player.player_status := SIGNED and Player.current_organization_id := organization_id"
          - "CASCADE link 3: because the player is now SIGNED under this contract, Organization.committed_salary_cents += PlayerContract.provisional_cap_charge_cents, Organization.uncommitted_salary_cents recomputed, Organization.active_roster_count += 1"
          - "CASCADE link 4: because the player is now SIGNED, every OTHER ContractOffer for this player_id with offer_status IN {SENT, COUNTERED} moves to SUPERSEDED"
      - from: SENT
        to: DECLINED
        trigger: "POST /contract-offers/{id}/decline"
        actor: PlayerAgent
        preconditions:
          - "offer_status == SENT"
          - "X-User-ID == ContractOffer.player_id"
        side_effects:
          - "offer_status := DECLINED; decline_note recorded"
      - from: COUNTERED
        to: DECLINED
        trigger: "POST /contract-offers/{id}/decline"
        actor: PlayerAgent
        preconditions:
          - "offer_status == COUNTERED"
        side_effects:
          - "offer_status := DECLINED; decline_note recorded"
      - from: SENT
        to: EXPIRED
        trigger: "system — lazy expiry evaluated at the start of any operation that reads or mutates this offer"
        actor: system
        preconditions:
          - "current_utc >= expires_at"
          - "offer_status == SENT"
        side_effects:
          - "offer_status := EXPIRED before the requested operation is evaluated, so the operation sees EXPIRED"
      - from: COUNTERED
        to: EXPIRED
        trigger: "system — lazy expiry evaluated at the start of any operation that reads or mutates this offer"
        actor: system
        preconditions:
          - "current_utc >= expires_at"
          - "offer_status == COUNTERED"
        side_effects:
          - "offer_status := EXPIRED"
      - from: SENT
        to: SUPERSEDED
        trigger: "POST /contract-offers with supersedes_offer_id == this offer's id, or acceptance of a sibling offer for the same player"
        actor: GeneralManager
        preconditions:
          - "offer_status IN {SENT, COUNTERED}"
        side_effects:
          - "offer_status := SUPERSEDED"
      - from: COUNTERED
        to: SUPERSEDED
        trigger: "POST /contract-offers with supersedes_offer_id == this offer's id, or acceptance of a sibling offer for the same player"
        actor: GeneralManager
        preconditions:
          - "offer_status IN {SENT, COUNTERED}"
        side_effects:
          - "offer_status := SUPERSEDED"

  # ---- PlayerContract dimension A: contract_status ---------------------------
  - entity: PlayerContract
    dimension: contract_status
    initial_state: ACTIVE
    terminal_states: []
    note: >-
      Parallel dimension A. contract_status and obligation_status (dimension B below)
      evolve on the same row independently: suspending a contract never changes
      obligation_status, and a burnout escalation never changes contract_status.
      TERMINATED is exited only by the compensating roster-move reversal.
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /contracts/{id}/suspend"
        actor: LeagueAdmin
        preconditions:
          - "contract_status == ACTIVE"
        side_effects:
          - "contract_status := SUSPENDED; suspension_reason recorded"
          - "obligation_status is left untouched (independent dimension)"
          - "Organization.active_roster_count -= 1; Organization.committed_salary_cents is NOT released (SUSPENDED still counts against the cap)"
          - "every PracticeBlock with block_status == SCHEDULED and starts_at > current_utc whose participant_player_ids contains this contract's player_id is CANCELLED with cancel_reason := CONTRACT_SUSPENDED"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /roster-moves/{id}/execute for move_type IN {RELEASE, TRANSFER_OUT}"
        actor: GeneralManager
        preconditions:
          - "RosterMove.move_status == APPROVED"
          - "RosterMove.contract_id == this contract's id"
        side_effects:
          - "contract_status := TERMINATED"
          - "CASCADE link 2: because the contract is TERMINATED, Player.player_status := FREE_AGENT and free_agency_window_ends_at is stamped"
          - "CASCADE link 3: because the contract left {ACTIVE, SUSPENDED}, Organization.committed_salary_cents -= provisional_cap_charge_cents (recorded as RosterMove.released_cap_cents) and active_roster_count -= 1"
          - "CASCADE link 4: because the contract is TERMINATED, every DeliverableAssignment with contract_id == this contract and assignment_status IN {ASSIGNED, SUBMITTED, APPROVED, REJECTED} moves to VOIDED, which decrements SponsorshipDeal.assigned_count/approved_count and reverts a FULFILLED deal to ACTIVE"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /roster-moves/{id}/execute for move_type IN {RELEASE, TRANSFER_OUT}"
        actor: GeneralManager
        preconditions:
          - "RosterMove.move_status == APPROVED"
        side_effects:
          - "contract_status := TERMINATED"
          - "same cascade as ACTIVE -> TERMINATED, except active_roster_count is not decremented again"
      - from: TERMINATED
        to: ACTIVE
        trigger: "POST /roster-moves/{id}/reverse"
        actor: LeagueAdmin
        preconditions:
          - "RosterMove.move_status == EXECUTED"
          - "Organization.uncommitted_salary_cents >= RosterMove.released_cap_cents"
        side_effects:
          - "contract_status := ACTIVE"
          - "Organization.committed_salary_cents += RosterMove.released_cap_cents (byte-for-byte restoration); active_roster_count += 1"
          - "Player.player_status := SIGNED; free_agency_window_ends_at := null"
          - "VOIDED DeliverableAssignments are NOT resurrected (documented asymmetry; only the salary quantity is conserved)"

  # ---- PlayerContract dimension B: obligation_status -------------------------
  - entity: PlayerContract
    dimension: obligation_status
    initial_state: COMPLIANT
    terminal_states: [BREACH]
    note: >-
      Parallel dimension B, escalation-only. Every transition is system-triggered by
      calculations.burnout_score (ROLLING_7DAY variant) being refreshed, which happens
      on POST /contracts/{id}/wellness-report and on POST /practice-blocks/{id}/complete.
    transitions:
      - from: COMPLIANT
        to: WARNED
        trigger: "system — burnout_score refresh yields BURNOUT_WARN_THRESHOLD <= score < BURNOUT_BREACH_THRESHOLD"
        actor: system
        preconditions:
          - "obligation_status == COMPLIANT"
          - "burnout_score >= 70 AND burnout_score < 85"
        side_effects:
          - "obligation_status := WARNED"
          - "every PracticeBlock with block_status == SCHEDULED and starts_at > current_utc containing this player is CANCELLED with cancel_reason := WELLNESS_HOLD"
      - from: COMPLIANT
        to: BREACH
        trigger: "system — burnout_score refresh yields score >= BURNOUT_BREACH_THRESHOLD"
        actor: system
        preconditions:
          - "obligation_status == COMPLIANT"
          - "burnout_score >= 85"
        side_effects:
          - "obligation_status := BREACH"
          - "wellness_hold_until := current_utc + 7 days"
          - "Organization.wellness_flag_count += 1"
          - "every future SCHEDULED PracticeBlock containing this player is CANCELLED with cancel_reason := WELLNESS_HOLD"
      - from: WARNED
        to: BREACH
        trigger: "system — burnout_score refresh yields score >= BURNOUT_BREACH_THRESHOLD"
        actor: system
        preconditions:
          - "obligation_status == WARNED"
          - "burnout_score >= 85"
        side_effects:
          - "obligation_status := BREACH; wellness_hold_until := current_utc + 7 days; Organization.wellness_flag_count += 1"

  # ---- PracticeBlock ---------------------------------------------------------
  - entity: PracticeBlock
    initial_state: SCHEDULED
    terminal_states: [HELD, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /practice-blocks/{id}/complete"
        actor: CoachingStaff
        preconditions:
          - "block_status == SCHEDULED"
          - "current_utc >= ends_at"
        side_effects:
          - "block_status := HELD; coach_note recorded"
          - "CASCADE link 1: for every participant with an ACTIVE PlayerContract, PlayerContract.season_practice_minutes += duration_minutes"
          - "CASCADE link 2: because season_practice_minutes and the 7-day HELD window changed, PlayerContract.burnout_score is recomputed (ROLLING_7DAY variant)"
          - "CASCADE link 3: because burnout_score crossed a threshold, obligation_status escalates COMPLIANT -> WARNED (>= 70) or -> BREACH (>= 85)"
          - "CASCADE link 4: because obligation_status left COMPLIANT, every future SCHEDULED PracticeBlock containing that player is CANCELLED with cancel_reason := WELLNESS_HOLD"
          - "participants with player_status == TRYOUT_INVITED move to TRYOUT_COMPLETED when block_type == TRYOUT"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /practice-blocks/{id}/cancel"
        actor: CoachingStaff
        preconditions:
          - "block_status == SCHEDULED"
        side_effects:
          - "block_status := CANCELLED; cancel_reason := COACH_CANCELLED (default when omitted)"
          - "the block stops occupying its facility interval and stops counting against participants' weekly caps"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system — cascade from PlayerContract obligation_status leaving COMPLIANT"
        actor: system
        preconditions:
          - "block_status == SCHEDULED AND starts_at > current_utc"
          - "participant_player_ids contains the escalating contract's player_id"
        side_effects:
          - "block_status := CANCELLED; cancel_reason := WELLNESS_HOLD"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system — cascade from PlayerContract contract_status ACTIVE -> SUSPENDED"
        actor: system
        preconditions:
          - "block_status == SCHEDULED AND starts_at > current_utc"
          - "participant_player_ids contains the suspended contract's player_id"
        side_effects:
          - "block_status := CANCELLED; cancel_reason := CONTRACT_SUSPENDED"

  # ---- SponsorshipDeal: compound (state derived from child counts) ------------
  - entity: SponsorshipDeal
    initial_state: DRAFT
    terminal_states: []
    note: >-
      Compound: ACTIVE <-> FULFILLED is driven purely by approved_count vs
      deliverable_count_required, so the deal can bubble up and then revert.
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /sponsorship-deals/{id}/activate"
        actor: SponsorshipManager
        preconditions:
          - "deal_status == DRAFT"
          - "X-User-ID == SponsorshipDeal.organization_id"
        side_effects:
          - "deal_status := ACTIVE; SponsorshipDeal.version += 1"
      - from: ACTIVE
        to: FULFILLED
        trigger: "system — bubble-up after POST /deliverable-assignments/{id}/review with decision APPROVE"
        actor: system
        preconditions:
          - "approved_count == deliverable_count_required after the review is applied"
        side_effects:
          - "deal_status := FULFILLED"
      - from: FULFILLED
        to: ACTIVE
        trigger: "system — bubble-up after a DeliverableAssignment is VOIDED by a contract-termination cascade"
        actor: system
        preconditions:
          - "approved_count < deliverable_count_required after the void is applied"
        side_effects:
          - "deal_status := ACTIVE"

  # ---- DeliverableAssignment: cyclic review loop ------------------------------
  - entity: DeliverableAssignment
    initial_state: ASSIGNED
    terminal_states: [VOIDED]
    note: "SUBMITTED -> REJECTED -> SUBMITTED is a true cycle bounded only by rejection_count bookkeeping."
    transitions:
      - from: ASSIGNED
        to: SUBMITTED
        trigger: "POST /deliverable-assignments/{id}/submit"
        actor: PlayerAgent
        preconditions:
          - "assignment_status == ASSIGNED"
          - "X-User-ID == PlayerContract.player_id of the assignment's contract_id"
          - "PlayerContract.contract_status == ACTIVE"
        side_effects:
          - "assignment_status := SUBMITTED; submission_note recorded"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /deliverable-assignments/{id}/submit"
        actor: PlayerAgent
        preconditions:
          - "assignment_status == REJECTED"
          - "PlayerContract.contract_status == ACTIVE"
        side_effects:
          - "assignment_status := SUBMITTED; submission_note overwritten"
        note: "Closes the review cycle; rejection_count is preserved across the loop."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /deliverable-assignments/{id}/review with decision == APPROVE"
        actor: SponsorshipManager
        preconditions:
          - "assignment_status == SUBMITTED"
          - "X-User-ID == SponsorshipDeal.organization_id"
        side_effects:
          - "assignment_status := APPROVED; review_note recorded"
          - "SponsorshipDeal.approved_count += 1, and the deal bubbles ACTIVE -> FULFILLED when approved_count == deliverable_count_required"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /deliverable-assignments/{id}/review with decision == REJECT"
        actor: SponsorshipManager
        preconditions:
          - "assignment_status == SUBMITTED"
        side_effects:
          - "assignment_status := REJECTED; rejection_count += 1; review_note recorded"
      - from: ASSIGNED
        to: VOIDED
        trigger: "system — cascade from PlayerContract -> TERMINATED"
        actor: system
        preconditions:
          - "assignment_status IN {ASSIGNED, SUBMITTED, APPROVED, REJECTED}"
        side_effects:
          - "assignment_status := VOIDED; SponsorshipDeal.assigned_count -= 1"
      - from: APPROVED
        to: VOIDED
        trigger: "system — cascade from PlayerContract -> TERMINATED"
        actor: system
        preconditions:
          - "assignment_status == APPROVED"
        side_effects:
          - "assignment_status := VOIDED; SponsorshipDeal.assigned_count -= 1; approved_count -= 1; a FULFILLED deal reverts to ACTIVE"

  # ---- PrizeDistribution -----------------------------------------------------
  - entity: PrizeDistribution
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: CALCULATED
        trigger: "POST /prize-distributions/{id}/calculate"
        actor: FinanceOfficer
        preconditions:
          - "distribution_status == DRAFT"
          - "at least one eligible PlayerContract exists (see calculations.prize_allocation input_set)"
        side_effects:
          - "distribution_status := CALCULATED; calculated_by_user_id := X-User-ID"
          - "association_levy_cents, org_share_cents, allocated_cents, unallocated_cents, withholding_total_cents, escrow_total_cents written"
          - "one PrizeAllocation row per eligible contract is created with allocation_status CALCULATED"
          - "Organization.prize_payable_cents += org_share_cents"
      - from: CALCULATED
        to: APPROVED
        trigger: "POST /prize-distributions/{id}/approve"
        actor: LeagueAdmin
        preconditions:
          - "distribution_status == CALCULATED"
          - "X-User-ID != calculated_by_user_id (segregation of duties)"
        side_effects:
          - "distribution_status := APPROVED; approved_by_user_id := X-User-ID"
          - "every child PrizeAllocation moves allocation_status CALCULATED -> APPROVED"
      - from: CALCULATED
        to: VOIDED
        trigger: "POST /prize-distributions/{id}/void"
        actor: FinanceOfficer
        preconditions:
          - "distribution_status IN {CALCULATED, APPROVED}"
        side_effects:
          - "distribution_status := VOIDED; void_reason recorded"
          - "every child PrizeAllocation moves to allocation_status VOIDED"
          - "allocated_cents := 0, withholding_total_cents := 0, escrow_total_cents := 0, org_share_cents := 0, association_levy_cents := 0, unallocated_cents := gross_prize_cents"
          - "Organization.prize_payable_cents -= the org_share_cents that the calculation had added (exact restoration)"
      - from: APPROVED
        to: VOIDED
        trigger: "POST /prize-distributions/{id}/void"
        actor: FinanceOfficer
        preconditions:
          - "distribution_status == APPROVED"
        side_effects:
          - "identical to CALCULATED -> VOIDED"

  # ---- RosterMove: branching fork with divergent side-effect sets -------------
  - entity: RosterMove
    initial_state: PENDING
    terminal_states: [REJECTED, REVERSED]
    note: >-
      Branching: PENDING forks on POST /roster-moves/{id}/decision into APPROVED
      (which unlocks execution and enforces the FULL_SEASON_EQUIVALENT cap variant) or
      REJECTED (terminal, zero side effects beyond the note).
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /roster-moves/{id}/decision with decision == APPROVE"
        actor: LeagueAdmin
        preconditions:
          - "move_status == PENDING"
          - "League.roster_lock_active == false"
          - "for move_type == SIGN: Organization.committed_salary_cents evaluated with the FULL_SEASON_EQUIVALENT variant stays within annual_salary_budget_cents"
        side_effects:
          - "move_status := APPROVED; approved_by_user_id := X-User-ID; decision_note recorded"
      - from: PENDING
        to: REJECTED
        trigger: "POST /roster-moves/{id}/decision with decision == REJECT"
        actor: LeagueAdmin
        preconditions:
          - "move_status == PENDING"
        side_effects:
          - "move_status := REJECTED; approved_by_user_id := X-User-ID; decision_note recorded"
          - "no contract, player, budget or deliverable is touched (divergent branch)"
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /roster-moves/{id}/execute"
        actor: GeneralManager
        preconditions:
          - "move_status == APPROVED"
          - "X-User-ID == RosterMove.organization_id"
          - "for TRANSFER_OUT: League.transfer_window_open_at <= current_utc < League.transfer_window_close_at"
          - "for RELEASE/TRANSFER_OUT: Organization.active_roster_count - 1 >= League.min_roster_size"
          - "for TRANSFER_OUT: calculations.transfer_settlement yields net_to_org_cents >= 0"
        side_effects:
          - "move_status := EXECUTED"
          - "buyout_credit_cents, commission_tier_bp, agent_commission_cents, net_to_org_cents written from calculations.transfer_settlement"
          - "released_cap_cents := PlayerContract.provisional_cap_charge_cents"
          - "CASCADE link 1: PlayerContract.contract_status := TERMINATED"
          - "CASCADE link 2: because the contract terminated, Player.player_status := FREE_AGENT and free_agency_window_ends_at := current_utc + League.free_agency_cooldown_days days"
          - "CASCADE link 3: because the contract left {ACTIVE, SUSPENDED}, Organization.committed_salary_cents -= released_cap_cents and active_roster_count -= 1"
          - "CASCADE link 4: because the contract terminated, its live DeliverableAssignments move to VOIDED and their SponsorshipDeal counters drop (a FULFILLED deal reverts to ACTIVE)"
          - "for move_type == SIGN none of the four cascade links fire and no money field is written: the move is the league's record of a signing that POST /contract-offers/{id}/accept already performed, so move_status := EXECUTED is its only effect (buyout_credit_cents, commission_tier_bp, agent_commission_cents, net_to_org_cents and released_cap_cents all stay 0) and the contract stays ACTIVE"
      - from: EXECUTED
        to: REVERSED
        trigger: "POST /roster-moves/{id}/reverse"
        actor: LeagueAdmin
        preconditions:
          - "move_status == EXECUTED"
          - "Organization.uncommitted_salary_cents >= released_cap_cents"
        side_effects:
          - "move_status := REVERSED; reversal_reason recorded"
          - "PlayerContract.contract_status := ACTIVE; Player.player_status := SIGNED; current_organization_id := organization_id; free_agency_window_ends_at := null"
          - "Organization.committed_salary_cents += released_cap_cents; active_roster_count += 1"
          - "COMPENSATING INVARIANT: annual_salary_budget_cents == committed_salary_cents + uncommitted_salary_cents holds, and committed_salary_cents equals its pre-execute value exactly"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's version — the only mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: deliverable-create-stale-deal
    parent_entity: SponsorshipDeal
    write_endpoint: "POST /sponsorship-deals/{id}/deliverables"
    occ_field: "expected_deal_version"
    description: |
      Placing a deliverable on a SponsorshipDeal whose version has advanced since the
      client last read it is rejected. Deliverable placement is additive — a second
      placement against the same deal is legitimate product behaviour and would
      succeed on its own — so the only way to detect that the client was working from
      a stale view of assigned_count / deal_status is the version check.
    error_id: ERR_DEAL_VERSION_STALE
    http_status: 412
  - rule_id: roster-move-create-stale-org
    parent_entity: Organization
    write_endpoint: "POST /roster-moves"
    occ_field: "expected_organization_version"
    description: |
      Filing a RosterMove against an Organization whose version has advanced since the
      client last read it is rejected. Filing moves is additive — a second PENDING move
      for a different player is legitimate — so a stale committed_salary_cents /
      active_roster_count view can only be caught by the version check.
    error_id: ERR_ORGANIZATION_VERSION_STALE
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: league_window_state
    trigger: >-
      Evaluated at the start of every operation that touches a League-governed entity
      (offer create/counter/revise/accept/decline, roster-move create/decision/execute).
    algorithm: threshold
    formula: |
      roster_lock_active        = (current_utc >= League.roster_lock_at)
      transfer_window_open      = (League.transfer_window_open_at <= current_utc
                                   AND current_utc < League.transfer_window_close_at)
      offer_expired(offer)      = (current_utc >= offer.expires_at)
      offer.expires_at          = offer.sent_at + League.offer_response_window_hours hours
      free_agency_cooldown_hit(player, org) =
            player.free_agency_window_ends_at IS NOT NULL
        AND current_utc < player.free_agency_window_ends_at
        AND org.id == player.last_release_organization_id
    input_set: >-
      The League reached from the entity under operation: Organization.league_id for
      organization-scoped writes, ContractOffer.organization_id -> Organization.league_id
      for offers, PlayerContract.organization_id -> Organization.league_id for contracts.
    constants:
      HOUR_SECONDS: 3600
      DAY_SECONDS: 86400
    precision: >-
      Whole-second instant comparison on ISO 8601 UTC values with three fractional digits.
      roster_lock and offer expiry use >= (the boundary instant is already locked/expired);
      the transfer window is half-open [open, close).
    variants: []

  - name: player_minor_status
    trigger: "Recomputed on every read or write that touches a Player, a ContractOffer or a PlayerContract"
    algorithm: threshold
    formula: |
      age_years = whole_years_between(Player.birth_date, current_utc)
                = floor((current_utc_date - birth_date) / 1 year, counting an anniversary
                        on the exact date as reached)
      is_minor  = (age_years < League.minor_age_threshold_years)
      guardian_consent_status =
          NOT_REQUIRED                              when is_minor == false
          REQUIRED                                  when is_minor == true and no consent recorded
          GRANTED                                   when POST /players/{id}/guardian-consent succeeded
    input_set: >-
      birth_date plus the logical clock; the League used for the threshold is the league of
      Player.current_organization_id when set, otherwise the league of the Organization named
      in the request under evaluation.
    constants:
      DEFAULT_MINOR_AGE_THRESHOLD_YEARS: 18
    precision: "Whole years; a player turning 18 exactly on current_utc's calendar date is NOT a minor"
    variants: []

  - name: salary_cap_charge
    trigger: >-
      PRORATED_REMAINING_TERM runs inside POST /contract-offers/{id}/accept and is frozen onto
      PlayerContract.provisional_cap_charge_cents; FULL_SEASON_EQUIVALENT is recomputed on
      GET /contracts/{id}/obligation-summary and inside POST /roster-moves/{id}/decision.
    algorithm: forward_looking
    formula: |
      remaining_season_days = floor((League.season_end_at - contract.effective_at) / 1 day)
      # variant PRORATED_REMAINING_TERM (provisional, frozen at acceptance)
      provisional_cap_charge_cents =
          round_half_up(base_salary_cents * remaining_season_days / SEASON_DAYS)
          + signing_bonus_cents
      # variant FULL_SEASON_EQUIVALENT (final, recomputed on read)
      final_cap_charge_cents = base_salary_cents + signing_bonus_cents
    input_set: >-
      One PlayerContract (or the contract about to be created from a ContractOffer). Aggregate
      forms sum over contracts of one Organization with contract_status IN {ACTIVE, SUSPENDED};
      TERMINATED contracts are excluded from both variants.
    constants:
      SEASON_DAYS: 365
    precision: "Integer cents, round_half_up on the proration product before the bonus is added"
    variants:
      - name: PRORATED_REMAINING_TERM
        when: "Acceptance-time cap gate (validations priority 13 on POST /contract-offers/{id}/accept) and Organization.committed_salary_cents bookkeeping"
        difference: >-
          Charges only the fraction of the annual salary that falls inside the remaining season
          (remaining_season_days / 365), so a mid-season signing consumes less budget.
      - name: FULL_SEASON_EQUIVALENT
        when: "League approval of a SIGN roster move (POST /roster-moves/{id}/decision) and obligation-summary reads"
        difference: >-
          Charges the whole annual salary regardless of signing date. For any contract whose
          effective_at is after season_start_at the two variants differ, so a signing that
          passes the acceptance gate can still be refused by league approval.

  - name: org_salary_commitment
    trigger: >-
      Recomputed whenever a PlayerContract enters or leaves {ACTIVE, SUSPENDED}: offer accept,
      contract suspend, roster-move execute, roster-move reverse.
    algorithm: aggregation
    formula: |
      committed_salary_cents = SUM(c.provisional_cap_charge_cents
                                   FOR c IN PlayerContract
                                   WHERE c.organization_id == org.id
                                     AND c.contract_status IN {ACTIVE, SUSPENDED})
      uncommitted_salary_cents = annual_salary_budget_cents - committed_salary_cents
      active_roster_count      = COUNT(c WHERE c.organization_id == org.id
                                          AND c.contract_status == ACTIVE)
      # CONSERVED QUANTITY (compensating-action invariant)
      INVARIANT_SALARY: annual_salary_budget_cents
                        == committed_salary_cents + uncommitted_salary_cents
    input_set: >-
      All PlayerContracts of one Organization, filtered to contract_status IN {ACTIVE, SUSPENDED};
      the frozen provisional_cap_charge_cents is used (never recomputed), which is what makes
      execute/reverse exactly reversible.
    constants: {}
    precision: "Integer cents; no rounding occurs because only frozen integers are summed"
    variants: []

  - name: weekly_hour_cap
    trigger: "POST /practice-blocks (before insertion) and GET /contracts/{id}/obligation-summary"
    algorithm: threshold
    formula: |
      week_start(t)  = the most recent Monday 00:00:00Z at or before t
      week_window(t) = [week_start(t), week_start(t) + 7 days)          # half-open
      # a block is attributed to the week that contains its starts_at, whole duration
      scheduled_minutes(player, t) =
          SUM(b.duration_minutes FOR b IN PracticeBlock
              WHERE player IN b.participant_player_ids
                AND b.block_status IN {SCHEDULED, HELD}
                AND b.starts_at IN week_window(t))
      streaming_minutes(player) =
          contract.streaming_hours_per_week * 60   when player.is_minor == true
                                                    AND the player owns a PlayerContract with
                                                    contract_status IN {ACTIVE, SUSPENDED}
          0                                        when player.is_minor == false
          0                                        when the player owns no PlayerContract with
                                                    contract_status IN {ACTIVE, SUSPENDED}
      cap_minutes(player) =
          if player.is_minor == false:
              League.adult_max_weekly_minutes
          else:
              min(League.minor_max_weekly_minutes,
                  COALESCE(player.guardian_weekly_cap_minutes, League.minor_max_weekly_minutes))
              - (League.education_reserved_minutes
                 if player.education_enrollment_status == ENROLLED_FULL_TIME else 0)
      committed_minutes(player, t) = scheduled_minutes(player, t) + streaming_minutes(player)
      VIOLATION when committed_minutes(player, t) > cap_minutes(player)
    input_set: >-
      PracticeBlocks of every organization (a player's cap is global, not per-org) whose
      block_status IN {SCHEDULED, HELD} and whose starts_at falls in the same week window as the
      candidate block's starts_at; CANCELLED blocks are excluded. The candidate block is included.
    constants:
      WEEK_DAYS: 7
      MINUTES_PER_HOUR: 60
    precision: >-
      Whole minutes; the comparison is strictly greater-than, so committed_minutes exactly equal
      to cap_minutes is allowed.
    variants: []

  - name: burnout_score
    trigger: >-
      ROLLING_7DAY runs on POST /contracts/{id}/wellness-report and on
      POST /practice-blocks/{id}/complete, writing PlayerContract.burnout_score;
      SEASON_CUMULATIVE is computed only for GET /contracts/{id}/obligation-summary.
    algorithm: weighted_scoring
    formula: |
      cap            = calculations.weekly_hour_cap -> cap_minutes(player)
      stream_commit  = contract.streaming_hours_per_week * 60
      # variant ROLLING_7DAY
      practice_window_minutes =
          SUM(b.duration_minutes FOR b IN PracticeBlock
              WHERE contract.player_id IN b.participant_player_ids
                AND b.block_status == HELD
                AND b.starts_at IN (current_utc - 7 days, current_utc])      # half-open, left-exclusive
      # variant SEASON_CUMULATIVE
      weeks_elapsed  = max(1, ceil(floor((current_utc - contract.effective_at)/1 day) / 7))
      season_avg_minutes = round_half_up(contract.season_practice_minutes / weeks_elapsed)
      score(practice_minutes) = round_half_up(
            100 * ( WEIGHT_PRACTICE * min(1, practice_minutes / cap)
                  + WEIGHT_LOAD     * (contract.last_self_reported_load / 10)
                  + WEIGHT_STREAM   * (min(1, contract.reported_streaming_minutes_7d / stream_commit)
                                       if stream_commit > 0 else 0) ) )
      burnout_score        = score(practice_window_minutes)     # ROLLING_7DAY
      season_burnout_score = score(season_avg_minutes)          # SEASON_CUMULATIVE
    input_set: >-
      HELD PracticeBlocks only (SCHEDULED and CANCELLED blocks never feed the score) for the
      rolling variant; contract.season_practice_minutes (which only HELD completions increment)
      for the cumulative variant. Both variants read the same last_self_reported_load and
      reported_streaming_minutes_7d.
    constants:
      WEIGHT_PRACTICE: 0.50
      WEIGHT_LOAD: 0.30
      WEIGHT_STREAM: 0.20
      BURNOUT_WARN_THRESHOLD: 70
      BURNOUT_BREACH_THRESHOLD: 85
      WELLNESS_HOLD_DAYS: 7
      ROLLING_WINDOW_DAYS: 7
    precision: >-
      The weighted sum is carried at full precision and round_half_up is applied exactly once,
      to the 0-100 scaled value; escalation compares the rounded integer with >= .
    variants:
      - name: ROLLING_7DAY
        when: "Wellness reports and practice-block completion; persisted as PlayerContract.burnout_score and used for obligation escalation"
        difference: >-
          Counts only HELD block minutes whose starts_at is inside the trailing 7-day window, so
          the score decays purely by the clock moving forward.
      - name: SEASON_CUMULATIVE
        when: "Reported as season_burnout_score by GET /contracts/{id}/obligation-summary"
        difference: >-
          Divides the whole season's practice minutes by the number of elapsed weeks, so old
          workload keeps weighing on the score after the rolling window has emptied. For any
          clock more than 7 days past the last completed block the two variants disagree.

  - name: prize_allocation
    trigger: "POST /prize-distributions/{id}/calculate (writes PrizeAllocation rows and freezes the distribution)"
    algorithm: waterfall_allocation
    formula: |
      # STEP ORDER IS NORMATIVE. Each step consumes the previous step's output.
      # step 1 - league levy off the gross
      association_levy_cents          = round_half_up(gross_prize_cents * League.player_association_levy_bp / 10000)
      distributable_cents = gross_prize_cents - association_levy_cents
      # step 2 - organization share off the distributable remainder
      org_share_cents     = round_half_up(distributable_cents * org.org_prize_share_bp / 10000)
      player_pool_cents   = distributable_cents - org_share_cents
      # step 3 - per-player weights from the eligible contracts
      eligible = [c IN PlayerContract WHERE c.organization_id == dist.organization_id
                                        AND c.contract_status == ACTIVE
                                        AND c.effective_at <= dist.tournament_end_at]
      weight(c)     = c.prize_split_player_pct_bp
      weight_total  = SUM(weight(c) FOR c IN eligible)
      # step 4 - floor every row, then hand the whole remainder to ONE row
      gross_share_floor(c) = floor(player_pool_cents * weight(c) / weight_total)
      remainder_cents      = player_pool_cents - SUM(gross_share_floor(c) FOR c IN eligible)
      remainder_row        = the eligible contract with the largest gross_share_floor;
                             ties broken by created_at ASC of the PlayerContract
      gross_share_cents(c) = gross_share_floor(c) + (remainder_cents if c == remainder_row else 0)
      # step 5 - per-row deductions, computed from the row's OWN gross_share_cents
      withholding_bp(c)      = NONRESIDENT_WITHHOLDING_BP when c.tax_residency_code != org.tax_jurisdiction_code
                               else RESIDENT_WITHHOLDING_BP
      withholding_cents(c)   = round_half_up(gross_share_cents(c) * withholding_bp(c) / 10000)
      escrow_cents(c)        = round_half_up(gross_share_cents(c) * MINOR_ESCROW_BP / 10000)
                               when player_minor_status(c.player_id).is_minor else 0
      net_payout_cents(c)    = gross_share_cents(c) - withholding_cents(c) - escrow_cents(c)
      # step 6 - freeze
      allocated_cents = SUM(gross_share_cents(c) FOR c IN eligible)     # == player_pool_cents
    input_set: >-
      Only PlayerContracts of the distributing Organization with contract_status == ACTIVE and
      effective_at <= PrizeDistribution.tournament_end_at. SUSPENDED and TERMINATED contracts and
      contracts signed after the event are excluded, which changes weight_total and therefore
      every other row's share.
    constants:
      BP_DENOMINATOR: 10000
      RESIDENT_WITHHOLDING_BP: 1500
      NONRESIDENT_WITHHOLDING_BP: 3000
      MINOR_ESCROW_BP: 1000
    precision: >-
      Integer cents throughout. Levy, org share, withholding and escrow use round_half_up; the
      per-row prize share uses floor and the single leftover remainder is added to the largest
      row, so no cent is created or destroyed. Deductions are never computed off the pre-remainder
      floor value.
    variants: []

  - name: prize_ledger_conservation
    trigger: "Recomputed on POST /prize-distributions/{id}/calculate, /approve and /void"
    algorithm: aggregation
    formula: |
      allocated_cents   = SUM(a.gross_share_cents FOR a IN PrizeAllocation
                              WHERE a.prize_distribution_id == dist.id)
      unallocated_cents = gross_prize_cents - association_levy_cents - org_share_cents - allocated_cents
      # CONSERVED QUANTITY (compensating-action invariant)
      INVARIANT_PRIZE: gross_prize_cents
                       == association_levy_cents + org_share_cents + allocated_cents + unallocated_cents
      # /void is the compensating action: every allocation moves to VOIDED, allocated_cents returns to 0
      # and unallocated_cents returns to the full gross, restoring the DRAFT-time ledger exactly.
    input_set: "All PrizeAllocation rows of one PrizeDistribution; no filtering by state"
    constants: {}
    precision: "Integer cents; the invariant is exact equality and must hold after every transition"
    variants: []

  - name: transfer_settlement
    trigger: "POST /roster-moves/{id}/execute when move_type == TRANSFER_OUT"
    algorithm: tiered_pricing
    formula: |
      # EVALUATION ORDER IS NORMATIVE - each line may only read lines above it.
      # 1. remaining term, from the contract's own frozen end instant
      remaining_days          = max(0, floor((contract.ends_at - current_utc) / 1 day))
      remaining_term_months   = ceil(remaining_days / MONTH_DAYS)
      # 2. monthly rate, from the base salary only (never from the cap charge)
      monthly_salary_cents    = round_half_up(contract.base_salary_cents / MONTHS_PER_YEAR)
      # 3. buyout credit owed to the outgoing player
      buyout_credit_cents     = round_half_up(monthly_salary_cents * remaining_term_months
                                              * contract.buyout_multiplier_bp / BP_DENOMINATOR)
      # 4. gross settlement retained by the releasing organization
      gross_settlement_cents  = move.gross_transfer_fee_cents - buyout_credit_cents
      # 5. agent commission tier - keyed on the GROSS SETTLEMENT, before commission is subtracted
      commission_tier_bp      = COMMISSION_TIER_LOW_BP
                                  when gross_settlement_cents < COMMISSION_TIER_BREAKPOINT_CENTS
                                else COMMISSION_TIER_HIGH_BP
      agent_commission_cents  = round_half_up(gross_settlement_cents * commission_tier_bp
                                              / BP_DENOMINATOR)
      # 6. net to the releasing organization
      net_to_org_cents        = gross_settlement_cents - agent_commission_cents
      REJECT with ERR_NEGATIVE_SETTLEMENT when net_to_org_cents < 0
      # 7. cap relief, taken from the FROZEN charge so that /reverse restores it exactly
      released_cap_cents      = contract.provisional_cap_charge_cents
    input_set: >-
      One RosterMove of move_type TRANSFER_OUT plus the PlayerContract named by its contract_id
      (contract_status must be ACTIVE or SUSPENDED at execute time). SIGN moves run no settlement
      and RELEASE moves run only step 7, so their money fields stay 0.
    constants:
      MONTH_DAYS: 30
      MONTHS_PER_YEAR: 12
      BP_DENOMINATOR: 10000
      COMMISSION_TIER_BREAKPOINT_CENTS: 5000000
      COMMISSION_TIER_LOW_BP: 500
      COMMISSION_TIER_HIGH_BP: 300
    precision: >-
      Integer cents; round_half_up at each numbered step, and the tier is selected from
      gross_settlement_cents. Selecting the tier from net_to_org_cents, or from the raw
      gross_transfer_fee_cents, changes the result for any settlement near the
      5,000,000-cent breakpoint; subtracting the commission before the buyout credit changes it
      for every input.
    variants: []

  - name: facility_slot_conflict
    trigger: "POST /practice-blocks"
    algorithm: interval_merge
    formula: |
      candidate_padded = [candidate.starts_at - house.turnaround_buffer_minutes minutes,
                          candidate.ends_at   + house.turnaround_buffer_minutes minutes)
      existing_raw     = [b.starts_at, b.ends_at)   for every SCHEDULED or HELD block of the house
      CONFLICT when candidate_padded.start < existing_raw.end
                AND existing_raw.start     < candidate_padded.end
    input_set: >-
      PracticeBlocks of the same team_house_id with block_status IN {SCHEDULED, HELD}; CANCELLED
      blocks free their slot. Only the candidate is padded - padding both sides would double-count
      the buffer.
    constants:
      DEFAULT_TURNAROUND_BUFFER_MINUTES: 60
    precision: >-
      Half-open intervals at whole-minute resolution. A block starting exactly
      turnaround_buffer_minutes after another block ends is allowed; one minute earlier conflicts.
    variants: []

  - name: participant_double_booking
    trigger: "POST /practice-blocks, evaluated once per entry in participant_player_ids"
    algorithm: interval_merge
    formula: |
      CONFLICT when candidate.starts_at < existing.ends_at
                AND existing.starts_at  < candidate.ends_at
      # no buffer padding: the buffer is a property of the room, not of the player
    input_set: >-
      Every PracticeBlock with block_status IN {SCHEDULED, HELD} that lists the same player in
      participant_player_ids, across all team houses and all organizations.
    constants: {}
    precision: >-
      Exact half-open comparison. Back-to-back blocks (candidate.starts_at == existing.ends_at)
      are allowed for a player even when the same pair of blocks would violate the room buffer.
    variants: []

  - name: facility_capacity
    trigger: "POST /practice-blocks"
    algorithm: threshold
    formula: |
      seats_needed = COUNT(candidate.participant_player_ids)
      VIOLATION when seats_needed > house.concurrent_seat_capacity
    input_set: "The candidate block plus the TeamHouse named by its team_house_id"
    constants: {}
    precision: "Whole seats; seats_needed exactly equal to concurrent_seat_capacity is allowed"
    variants: []

  - name: deliverable_fee_share
    trigger: "POST /sponsorship-deals/{id}/deliverables and POST /deliverable-assignments/{id}/review"
    algorithm: aggregation
    formula: |
      assigned_count      = COUNT(d FOR d IN DeliverableAssignment
                                  WHERE d.sponsorship_deal_id == deal.id
                                    AND d.assignment_status != VOIDED)
      per_item_fee_cents  = floor(deal.total_fee_cents / deal.deliverable_count_required)
      approved_count      = COUNT(d WHERE d.sponsorship_deal_id == deal.id
                                     AND d.assignment_status == APPROVED)
      earned_fee_cents    = per_item_fee_cents * approved_count
                            + (deal.total_fee_cents
                               - per_item_fee_cents * deal.deliverable_count_required)
                              when approved_count == deal.deliverable_count_required else 0
      fulfilled           = (approved_count >= deal.deliverable_count_required)
      QUOTA VIOLATION when assigned_count would exceed deal.deliverable_count_required
    input_set: >-
      DeliverableAssignments of one SponsorshipDeal; VOIDED rows are excluded from the quota and
      from approved_count, so voiding a rejected item frees a quota slot.
    constants: {}
    precision: >-
      Integer cents; the floor rounding residue is paid out only with the final approval, so the
      deal's earned fee equals total_fee_cents exactly once it is FULFILLED.
    variants: []

  - name: exclusivity_conflict
    trigger: "POST /sponsorship-deals/{id}/deliverables and POST /sponsorship-deals/{id}/activate"
    algorithm: threshold
    formula: |
      CONFLICT when EXISTS other IN SponsorshipDeal
                    WHERE other.id                != deal.id
                      AND other.deal_status       IN {ACTIVE, FULFILLED}
                      AND other.exclusivity_category == deal.exclusivity_category
                      AND other.organization_id   == deal.organization_id
                      AND other.starts_at < deal.ends_at AND deal.starts_at < other.ends_at
                      AND EXISTS a IN DeliverableAssignment
                          WHERE a.sponsorship_deal_id == other.id
                            AND a.assignment_status   != VOIDED
                            AND a.contract_id          == candidate.contract_id
    input_set: >-
      SponsorshipDeals of the same Organization in {ACTIVE, FULFILLED} whose date range overlaps
      and whose exclusivity_category matches, joined to their non-VOIDED deliverables. DRAFT deals
      never conflict, which is why activation re-runs the check.
    constants: {}
    precision: >-
      Case-sensitive exact match on exclusivity_category; half-open overlap on the deal date ranges.
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (evaluated in ascending priority order;
#      the FIRST violated rule determines the response and no later rule runs)
# =============================================================================
validations:

  # --- priority 1: authentication -------------------------------------------
  - priority: 1
    category: auth
    check: "X-User-Id and X-User-Role headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  # --- priority 2: authorization --------------------------------------------
  - priority: 2
    category: auth
    check: "X-User-Role is a recognised role name AND appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  # --- priority 3: path existence (left to right) ---------------------------
  - priority: 3
    category: existence
    check: "Every {id} segment resolves, checked left to right; the leftmost unresolved segment wins"
    error_id: ERR_LEAGUE_NOT_FOUND
    http_status: 404
    applies_to: "GET|PATCH /leagues/{id}, GET /leagues/{id}/organizations"
  - priority: 3
    category: existence
    check: "Organization in the path exists"
    error_id: ERR_ORGANIZATION_NOT_FOUND
    http_status: 404
    applies_to: "GET|PATCH /organizations/{id}, GET /organizations/{id}/roster, GET /organizations/{id}/team-houses, GET /organizations/{id}/sponsorship-deals, GET /organizations/{id}/cap-summary, POST /organizations/{id}/team-houses"
  - priority: 3
    category: existence
    check: "Player in the path exists"
    error_id: ERR_PLAYER_NOT_FOUND
    http_status: 404
    applies_to: "GET|PATCH /players/{id}, POST /players/{id}/guardian-consent"
  - priority: 3
    category: existence
    check: "ContractOffer in the path exists"
    error_id: ERR_OFFER_NOT_FOUND
    http_status: 404
    applies_to: "GET /contract-offers/{id}, POST /contract-offers/{id}/counter, POST /contract-offers/{id}/revise, POST /contract-offers/{id}/accept, POST /contract-offers/{id}/decline"
  - priority: 3
    category: existence
    check: "PlayerContract in the path exists"
    error_id: ERR_CONTRACT_NOT_FOUND
    http_status: 404
    applies_to: "GET /contracts/{id}, GET /contracts/{id}/obligation-summary, GET /contracts/{id}/prize-allocations, POST /contracts/{id}/suspend, POST /contracts/{id}/wellness-report"
  - priority: 3
    category: existence
    check: "TeamHouse in the path exists"
    error_id: ERR_TEAM_HOUSE_NOT_FOUND
    http_status: 404
    applies_to: "GET|PATCH /team-houses/{id}"
  - priority: 3
    category: existence
    check: "PracticeBlock in the path exists"
    error_id: ERR_PRACTICE_BLOCK_NOT_FOUND
    http_status: 404
    applies_to: "GET /practice-blocks/{id}, POST /practice-blocks/{id}/complete, POST /practice-blocks/{id}/cancel"
  - priority: 3
    category: existence
    check: "SponsorshipDeal in the path exists"
    error_id: ERR_DEAL_NOT_FOUND
    http_status: 404
    applies_to: "GET /sponsorship-deals/{id}, POST /sponsorship-deals/{id}/activate, POST|GET /sponsorship-deals/{id}/deliverables"
  - priority: 3
    category: existence
    check: "DeliverableAssignment in the path exists"
    error_id: ERR_DELIVERABLE_NOT_FOUND
    http_status: 404
    applies_to: "GET /deliverable-assignments/{id}, POST /deliverable-assignments/{id}/submit, POST /deliverable-assignments/{id}/review"
  - priority: 3
    category: existence
    check: "PrizeDistribution in the path exists"
    error_id: ERR_DISTRIBUTION_NOT_FOUND
    http_status: 404
    applies_to: "GET /prize-distributions/{id}, GET /prize-distributions/{id}/allocations, POST /prize-distributions/{id}/calculate, POST /prize-distributions/{id}/approve, POST /prize-distributions/{id}/void"
  - priority: 3
    category: existence
    check: "RosterMove in the path exists"
    error_id: ERR_ROSTER_MOVE_NOT_FOUND
    http_status: 404
    applies_to: "GET /roster-moves/{id}, POST /roster-moves/{id}/decision, POST /roster-moves/{id}/execute, POST /roster-moves/{id}/reverse"

  # --- priority 4: resource ownership for entity-backed roles ---------------
  - priority: 4
    category: auth
    check: >-
      An entity_backed caller may only touch resources of the entity its X-User-Id maps to:
      GeneralManager and SponsorshipManager and OpsManager to their own Organization,
      PlayerAgent and GuardianRepresentative to their own Player (directly, or through the
      ContractOffer / PlayerContract / DeliverableAssignment that names that player).
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all endpoints whose target resource resolves to an Organization or a Player"

  # --- priority 5: request shape --------------------------------------------
  - priority: 5
    category: business_constraint
    check: >-
      Required body fields present; enums within their declared value set; integers within their
      declared range; basis-point fields in 0..10000; starts_at < ends_at on PracticeBlock and
      SponsorshipDeal; participant_player_ids non-empty with no duplicate entries;
      manual cancel supplies cancel_reason == COACH_CANCELLED; decision is APPROVE or REJECT;
      pagination limit in 1..100 and offset >= 0.
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  # --- priority 6: body / query foreign keys --------------------------------
  - priority: 6
    category: existence
    check: "league_id in the body resolves to a League"
    error_id: ERR_LEAGUE_NOT_FOUND
    http_status: 404
    applies_to: "POST /organizations, POST /prize-distributions"
  - priority: 6
    category: existence
    check: "organization_id / transfer_to_organization_id in the body resolve to Organizations"
    error_id: ERR_ORGANIZATION_NOT_FOUND
    http_status: 404
    applies_to: "POST /contract-offers, POST /practice-blocks, POST /sponsorship-deals, POST /prize-distributions, POST /roster-moves"
  - priority: 6
    category: existence
    check: "player_id in the body resolves to a Player"
    error_id: ERR_PLAYER_NOT_FOUND
    http_status: 404
    applies_to: "POST /contract-offers, POST /practice-blocks (each entry of participant_player_ids), POST /roster-moves"
  - priority: 6
    category: existence
    check: "contract_id in the body resolves to a PlayerContract"
    error_id: ERR_CONTRACT_NOT_FOUND
    http_status: 404
    applies_to: "POST /sponsorship-deals/{id}/deliverables, POST /roster-moves"
  - priority: 6
    category: existence
    check: "team_house_id in the body resolves to a TeamHouse"
    error_id: ERR_TEAM_HOUSE_NOT_FOUND
    http_status: 404
    applies_to: "POST /practice-blocks"
  - priority: 6
    category: existence
    check: "supersedes_offer_id in the body resolves to a ContractOffer for the same player and organization"
    error_id: ERR_OFFER_NOT_FOUND
    http_status: 404
    applies_to: "POST /contract-offers"

  # --- priority 7: optimistic concurrency ----------------------------------
  - priority: 7
    category: state
    check: "expected_deal_version equals the SponsorshipDeal's current version"
    error_id: ERR_DEAL_VERSION_STALE
    http_status: 412
    applies_to: "POST /sponsorship-deals/{id}/deliverables"
  - priority: 7
    category: state
    check: "expected_organization_version equals the Organization's current version"
    error_id: ERR_ORGANIZATION_VERSION_STALE
    http_status: 412
    applies_to: "POST /roster-moves"

  # --- priority 8: state preconditions --------------------------------------
  - priority: 8
    category: state
    check: >-
      Lazy expiry runs first: if current_utc >= offer.expires_at the offer is moved to EXPIRED and
      the operation is refused. Reported even when the offer would also fail a later check.
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /contract-offers/{id}/counter, POST /contract-offers/{id}/revise, POST /contract-offers/{id}/accept, POST /contract-offers/{id}/decline"
  - priority: 8
    category: state
    check: >-
      offer_status is SENT for /accept and /counter, COUNTERED for /revise, and SENT or COUNTERED
      for /decline; ACCEPTED, DECLINED, EXPIRED and SUPERSEDED offers accept no further action
    error_id: ERR_OFFER_NOT_OPEN
    http_status: 409
    applies_to: "POST /contract-offers/{id}/counter, POST /contract-offers/{id}/revise, POST /contract-offers/{id}/accept, POST /contract-offers/{id}/decline"
  - priority: 8
    category: state
    check: "offer.round_number < League.max_negotiation_rounds before a counter is recorded"
    error_id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /contract-offers/{id}/counter"
  - priority: 8
    category: state
    check: "The player has no PlayerContract with contract_status ACTIVE or SUSPENDED"
    error_id: ERR_PLAYER_ALREADY_SIGNED
    http_status: 409
    applies_to: "POST /contract-offers/{id}/accept"
  - priority: 8
    category: state
    check: >-
      contract_status is ACTIVE (SUSPENDED and TERMINATED contracts take no new obligations).
      On POST /practice-blocks the check is evaluated per participant and only for participants
      that own at least one PlayerContract with contract_status IN {ACTIVE, SUSPENDED, TERMINATED}:
      such a participant must own an ACTIVE one. A participant that owns no PlayerContract at all —
      a PROSPECT or FREE_AGENT invited to a block — is admitted, which is what makes TRYOUT blocks
      for unsigned players possible.
    error_id: ERR_CONTRACT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /contracts/{id}/suspend, POST /contracts/{id}/wellness-report, POST /sponsorship-deals/{id}/deliverables, POST /practice-blocks"
  - priority: 8
    category: state
    check: "block_status is SCHEDULED"
    error_id: ERR_BLOCK_NOT_SCHEDULED
    http_status: 409
    applies_to: "POST /practice-blocks/{id}/complete, POST /practice-blocks/{id}/cancel"
  - priority: 8
    category: state
    check: "deal_status is DRAFT for /activate and ACTIVE for deliverable placement"
    error_id: ERR_DEAL_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /sponsorship-deals/{id}/activate, POST /sponsorship-deals/{id}/deliverables"
  - priority: 8
    category: state
    check: "assignment_status is ASSIGNED or REJECTED for /submit, and SUBMITTED for /review"
    error_id: ERR_ASSIGNMENT_NOT_SUBMITTED
    http_status: 409
    applies_to: "POST /deliverable-assignments/{id}/submit, POST /deliverable-assignments/{id}/review"
  - priority: 8
    category: state
    check: "distribution_status is DRAFT"
    error_id: ERR_DISTRIBUTION_NOT_DRAFT
    http_status: 409
    applies_to: "POST /prize-distributions/{id}/calculate"
  - priority: 8
    category: state
    check: "distribution_status is CALCULATED for /approve, and CALCULATED or APPROVED for /void"
    error_id: ERR_DISTRIBUTION_NOT_CALCULATED
    http_status: 409
    applies_to: "POST /prize-distributions/{id}/approve, POST /prize-distributions/{id}/void"
  - priority: 8
    category: state
    check: "move_status is PENDING"
    error_id: ERR_MOVE_NOT_PENDING
    http_status: 409
    applies_to: "POST /roster-moves/{id}/decision"
  - priority: 8
    category: state
    check: "move_status is APPROVED"
    error_id: ERR_MOVE_NOT_APPROVED
    http_status: 409
    applies_to: "POST /roster-moves/{id}/execute"
  - priority: 8
    category: state
    check: "move_status is EXECUTED"
    error_id: ERR_MOVE_NOT_EXECUTED
    http_status: 409
    applies_to: "POST /roster-moves/{id}/reverse"
  - priority: 8
    category: state
    check: "move_type is RELEASE or TRANSFER_OUT; an executed SIGN move has no compensating reversal"
    error_id: ERR_MOVE_NOT_REVERSIBLE
    http_status: 422
    applies_to: "POST /roster-moves/{id}/reverse"

  # --- priority 9: minor protection, education and wellness safety ----------
  - priority: 9
    category: business_safety
    check: >-
      A player with is_minor == true must have guardian_consent_status == GRANTED before an offer
      may be accepted for that player, before the player may be listed on a PracticeBlock, and
      before a deliverable may be assigned to that player's contract
    error_id: ERR_GUARDIAN_CONSENT_REQUIRED
    http_status: 422
    applies_to: "POST /contract-offers/{id}/accept, POST /practice-blocks, POST /sponsorship-deals/{id}/deliverables"
  - priority: 9
    category: business_safety
    check: >-
      A deal whose exclusivity_category is BETTING or CRYPTO may not carry a deliverable for a
      minor player's contract, regardless of guardian consent
    error_id: ERR_MINOR_CATEGORY_FORBIDDEN
    http_status: 422
    applies_to: "POST /sponsorship-deals/{id}/deliverables"
  - priority: 9
    category: business_safety
    check: >-
      For a minor with education_enrollment_status == ENROLLED_FULL_TIME the weekly cap is reduced
      by League.education_reserved_minutes before any block is admitted; a block that consumes the
      reserved education minutes is refused. Tie-break inside priority 9: this error is reported
      only when the education reserve is decisive — that is, committed_minutes > cap_minutes holds
      with the reserve applied but the identical request would pass if
      League.education_reserved_minutes were 0. When the request would fail even without the
      reserve, the plain ERR_WEEKLY_HOUR_CAP_EXCEEDED below is reported instead
    error_id: ERR_EDUCATION_HOURS_RESERVED
    http_status: 422
    applies_to: "POST /practice-blocks"
  - priority: 9
    category: business_safety
    check: >-
      calculations.weekly_hour_cap: scheduled minutes in the candidate block's ISO week plus the
      contract's committed streaming minutes must not exceed the player's cap_minutes
    error_id: ERR_WEEKLY_HOUR_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /practice-blocks"
  - priority: 9
    category: business_safety
    check: "current_utc >= contract.wellness_hold_until for every participant with an ACTIVE contract"
    error_id: ERR_WELLNESS_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST /practice-blocks"
  - priority: 9
    category: business_safety
    check: "obligation_status is not BREACH; a breached contract accepts no new sponsorship deliverables"
    error_id: ERR_OBLIGATION_BREACH_BLOCKS_ASSIGNMENT
    http_status: 422
    applies_to: "POST /sponsorship-deals/{id}/deliverables"

  # --- priority 10: league calendar / temporal windows ----------------------
  - priority: 10
    category: business_temporal
    check: >-
      calculations.league_window_state.roster_lock_active must be false: once current_utc reaches
      League.roster_lock_at no offer may be accepted and no SIGN roster move may be filed
    error_id: ERR_ROSTER_LOCK_ACTIVE
    http_status: 422
    applies_to: "POST /contract-offers/{id}/accept, POST /roster-moves (move_type SIGN)"
  - priority: 10
    category: business_temporal
    check: >-
      calculations.league_window_state.transfer_window_open must be true for a TRANSFER_OUT move,
      evaluated on the half-open interval [transfer_window_open_at, transfer_window_close_at)
    error_id: ERR_TRANSFER_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /roster-moves (move_type TRANSFER_OUT)"
  - priority: 10
    category: business_temporal
    check: >-
      A released player may not be re-signed by the releasing organization until
      current_utc >= player.free_agency_window_ends_at; other organizations are unaffected
    error_id: ERR_FREE_AGENCY_COOLDOWN
    http_status: 422
    applies_to: "POST /contract-offers/{id}/accept"
  - priority: 10
    category: business_temporal
    check: "League.season_start_at <= effective_at < League.season_end_at"
    error_id: ERR_EFFECTIVE_AT_OUTSIDE_SEASON
    http_status: 422
    applies_to: "POST /contract-offers/{id}/accept"
  - priority: 10
    category: business_temporal
    check: "deal.starts_at <= due_at < deal.ends_at"
    error_id: ERR_DELIVERABLE_DUE_OUTSIDE_DEAL
    http_status: 422
    applies_to: "POST /sponsorship-deals/{id}/deliverables"
  - priority: 10
    category: business_temporal
    check: >-
      current_utc >= PracticeBlock.ends_at — a block may only be marked HELD once its interval
      has finished; the boundary instant itself is enough (>=). Cancellation is unaffected, so a
      coach can still cancel a block that has not started
    error_id: ERR_BLOCK_NOT_FINISHED
    http_status: 409
    applies_to: "POST /practice-blocks/{id}/complete"

  # --- priority 11: facility and quota constraints --------------------------
  - priority: 11
    category: business_constraint
    check: >-
      calculations.facility_slot_conflict: the candidate interval padded by the house's
      turnaround_buffer_minutes on both sides must not overlap a SCHEDULED or HELD block of the
      same team house
    error_id: ERR_FACILITY_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /practice-blocks"
  - priority: 11
    category: business_constraint
    check: >-
      calculations.participant_double_booking: no participant may already hold a SCHEDULED or HELD
      block that overlaps the candidate interval, in any house of any organization
    error_id: ERR_PLAYER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /practice-blocks"
  - priority: 11
    category: business_constraint
    check: "COUNT(participant_player_ids) <= TeamHouse.concurrent_seat_capacity"
    error_id: ERR_FACILITY_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /practice-blocks"
  - priority: 11
    category: business_constraint
    check: "deal.assigned_count < deal.deliverable_count_required (VOIDED assignments free a slot)"
    error_id: ERR_DELIVERABLE_QUOTA_EXCEEDED
    http_status: 422
    applies_to: "POST /sponsorship-deals/{id}/deliverables"
  - priority: 11
    category: business_constraint
    check: >-
      When League.tryout_required_before_offer is true the player's player_status must be
      TRYOUT_COMPLETED at acceptance time
    error_id: ERR_TRYOUT_REQUIRED
    http_status: 422
    applies_to: "POST /contract-offers/{id}/accept"
  - priority: 11
    category: business_constraint
    check: "Organization.active_roster_count < League.max_roster_size"
    error_id: ERR_ROSTER_SIZE_EXCEEDED
    http_status: 422
    applies_to: "POST /contract-offers/{id}/accept"
  - priority: 11
    category: business_constraint
    check: >-
      Executing a RELEASE or TRANSFER_OUT must leave Organization.active_roster_count >=
      League.min_roster_size
    error_id: ERR_ROSTER_SIZE_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /roster-moves/{id}/execute"

  # --- priority 12: referential / duty-segregation --------------------------
  - priority: 12
    category: business_referential
    check: >-
      calculations.exclusivity_conflict: the player's contract may not already carry a non-VOIDED
      deliverable from another ACTIVE or FULFILLED deal of the same organization with the same
      exclusivity_category and an overlapping date range
    error_id: ERR_EXCLUSIVITY_CONFLICT
    http_status: 409
    applies_to: "POST /sponsorship-deals/{id}/deliverables, POST /sponsorship-deals/{id}/activate"
  - priority: 12
    category: business_referential
    check: >-
      The X-User-Id that produced a figure may not sign it off: the calculating FinanceOfficer may
      not approve the same PrizeDistribution, and the GeneralManager recorded in
      RosterMove.requested_by_user_id may not be the X-User-Id that decides it
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /prize-distributions/{id}/approve, POST /roster-moves/{id}/decision"

  # --- priority 13: fiscal / association terms ------------------------------
  - priority: 13
    category: business_fiscal
    check: "base_salary_cents (as revised or countered) >= League.minimum_salary_cents"
    error_id: ERR_BELOW_MINIMUM_SALARY
    http_status: 422
    applies_to: "POST /contract-offers, POST /contract-offers/{id}/counter, POST /contract-offers/{id}/revise, POST /contract-offers/{id}/accept"
  - priority: 13
    category: business_fiscal
    check: >-
      For an association_member player, prize_split_player_pct_bp >=
      League.association_min_prize_split_bp
    error_id: ERR_PRIZE_SPLIT_BELOW_ASSOCIATION_MIN
    http_status: 422
    applies_to: "POST /contract-offers, POST /contract-offers/{id}/revise, POST /contract-offers/{id}/accept"
  - priority: 13
    category: business_fiscal
    check: >-
      For an association_member player, streaming_hours_per_week <=
      League.association_max_streaming_hours_per_week
    error_id: ERR_STREAMING_HOURS_EXCEED_ASSOCIATION_MAX
    http_status: 422
    applies_to: "POST /contract-offers, POST /contract-offers/{id}/revise, POST /contract-offers/{id}/accept"
  - priority: 13
    category: business_fiscal
    check: >-
      calculations.salary_cap_charge: at acceptance the PRORATED_REMAINING_TERM charge must fit in
      Organization.uncommitted_salary_cents. At the APPROVE decision of a SIGN roster move the
      stricter FULL_SEASON_EQUIVALENT variant is applied to the move's contract_id: the
      organization's committed_salary_cents with that contract's provisional_cap_charge_cents
      replaced by its final_cap_charge_cents must not exceed
      Organization.annual_salary_budget_cents. A contract whose prorated charge was affordable at
      acceptance can therefore fail this check at SIGN approval
    error_id: ERR_SALARY_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /contract-offers/{id}/accept, POST /roster-moves/{id}/decision"
  - priority: 13
    category: business_fiscal
    check: "calculations.transfer_settlement: net_to_org_cents must not be negative"
    error_id: ERR_NEGATIVE_SETTLEMENT
    http_status: 422
    applies_to: "POST /roster-moves/{id}/execute"
  - priority: 13
    category: business_fiscal
    check: >-
      At least one PlayerContract satisfies the prize_allocation input_set (ACTIVE and
      effective_at <= tournament_end_at); otherwise there is nothing to divide
    error_id: ERR_NO_ELIGIBLE_CONTRACTS
    http_status: 422
    applies_to: "POST /prize-distributions/{id}/calculate"

