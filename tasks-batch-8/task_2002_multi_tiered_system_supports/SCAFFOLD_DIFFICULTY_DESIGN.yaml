            - "After 4th NON_RESPONSIVE probe (weeks=4 >= min=4) auto-referral created with status 'PENDING_CONSENT'"
            - "Boundary is inclusive on the >= side: exactly 4 qualifies; 3 does not"

  # ---------------------------------------------------------------------------
  # Rule 7: cross_entity_state_dependency — different entity pairs
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: plan_pause_requires_student_tier_unchanged
        grounds:
          - state_machines.StudentPlan.ACTIVE_to_PAUSED
        distinguishing_aspect: |
          StudentPlan's ACTIVE→PAUSED transition is guarded by Student.current_tier ==
          StudentPlan.tier_at_start (entity pair Plan→Student). If a ratified movement has
          already changed the student's tier, pause is rejected.
        test_recipe:
          setup:
            - "Plan P ACTIVE for student B, tier_at_start=TIER_2"
            - "A subsequent ratified TierMovement has changed Student.current_tier to TIER_3 — which cascaded P to EXIT_MOVED, but for this test we use a separate plan P2 created BEFORE the movement and also cascade-exited. Instead we craft the case where pause is attempted on an already-EXIT_MOVED plan (plan state terminal) to exercise the guard."
