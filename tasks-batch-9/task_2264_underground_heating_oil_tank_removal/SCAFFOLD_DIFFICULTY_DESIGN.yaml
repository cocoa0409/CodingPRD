  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: crew_symmetric_buffer_rejects_gap_below_ninety_minutes
        grounds:
          - validations[priority=65]
          - errors[ERR_CREW_BOOKING_CONFLICT]
          - entities.Crew.fields.mobilization_buffer_minutes
          - entities.DecommissionWorkOrder.fields.scheduled_start_at
        distinguishing_aspect: |
          Pairwise interval semantics on the Crew resource: raw bookings are half-open [start, end) but each
          is padded by the crew's 90-minute mobilization buffer on BOTH ends, so a second booking starting
          2026-08-06T22:00:00Z (a 60-minute gap after the 21:00:00Z end) collides, while the same booking
          moved to 22:30:00Z (a gap of exactly 90 minutes) is accepted.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T08:00:00Z."
            - "One Crew with mobilization_buffer_minutes 90."
            - "Project A holding a SCHEDULED work order on that crew for 2026-08-06T13:00:00Z to 2026-08-06T21:00:00Z."
            - "Project B on a second Property, with no work order yet and no sweep survey (so its recommended_method is null and every booking must carry method_override_reason)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { street_address: "101 Anvil Street", state_code: "NJ", county_code: "ESX", homeowner_name: "Cira Boyle", homeowner_email: "cira@example.com", insurance_carrier_code: "CARR-NJ-18" }
              as: ProjectCoordinator
              captures: { prop_a_id: $.data.id }
            - call: "POST /tank-projects"
              payload: { property_id: "${prop_a_id}", baseline_scope_cubic_yards: 8.0, excavation_limit_cubic_yards: 40.0 }
              as: ProjectCoordinator
              captures: { proj_a_id: $.data.id }
            - call: "POST /tank-projects/${proj_a_id}/sweep-survey"
              payload: { survey_method: "GPR", tanks_detected_count: 1, tank_capacity_gallons: 550, tank_depth_to_top_inches: 60, tank_distance_to_foundation_inches: 90, tank_under_structure: false, tank_material: "STEEL" }
              as: FieldTechnician
            - call: "POST /crews"
              payload: { crew_name: "Crew Quebec", cert_level: "TANK_TECH_II", mobilization_buffer_minutes: 90 }
              as: ProjectCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /work-orders"
              payload: { tank_project_id: "${proj_a_id}", crew_id: "${crew_id}", method: "REMOVAL", scheduled_start_at: "2026-08-06T13:00:00Z", scheduled_end_at: "2026-08-06T21:00:00Z" }
              as: ProjectCoordinator
              captures: { wo_a_id: $.data.id }
            - call: "POST /properties"
              payload: { street_address: "103 Anvil Street", state_code: "NJ", county_code: "ESX", homeowner_name: "Dov Marchetti", homeowner_email: "dov@example.com", insurance_carrier_code: "CARR-NJ-19" }
              as: ProjectCoordinator
              captures: { prop_b_id: $.data.id }
            - call: "POST /tank-projects"
              payload: { property_id: "${prop_b_id}", baseline_scope_cubic_yards: 8.0, excavation_limit_cubic_yards: 40.0 }
              as: ProjectCoordinator
              captures: { proj_b_id: $.data.id }
          trigger:
            - call: "POST /work-orders"
              payload: { tank_project_id: "${proj_b_id}", crew_id: "${crew_id}", method: "REMOVAL", scheduled_start_at: "2026-08-06T22:00:00Z", scheduled_end_at: "2026-08-07T02:00:00Z", method_override_reason: "second site sequenced onto the same night crew" }
              as: ProjectCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /work-orders"
              payload: { tank_project_id: "${proj_b_id}", crew_id: "${crew_id}", method: "REMOVAL", scheduled_start_at: "2026-08-06T22:30:00Z", scheduled_end_at: "2026-08-07T02:30:00Z", method_override_reason: "second site sequenced onto the same night crew" }
              as: ProjectCoordinator
              captures: { wo_b_id: $.data.id, wo_b_field: $.data.field_status }
          assert:
            - "${err} == ERR_CREW_BOOKING_CONFLICT"
            - "HTTP status of the 22:00:00Z attempt == 409"
            - "${wo_b_field} == SCHEDULED"
            - "DecommissionWorkOrder.${wo_b_id}.scheduled_start_at == 2026-08-06T22:30:00Z"
            - "DecommissionWorkOrder.${wo_a_id}.field_status == SCHEDULED"
            - "GET /work-orders?crew_id=${crew_id} returns total_count == 2"

      - name: laboratory_aggregate_capacity_uses_closed_analysis_window
        grounds:
          - validations[priority=66]
          - errors[ERR_LAB_CAPACITY_EXCEEDED]
          - entities.Laboratory.fields.max_concurrent_analyses
          - entities.Laboratory.fields.committed_turnaround_hours
          - state_machines.SoilSample.IN_TRANSIT_to_AT_LAB
        distinguishing_aspect: |
          Aggregate-capacity interval semantics on the Laboratory resource, geometrically different from the
          crew's pairwise buffered check: each AT_LAB sample occupies the CLOSED window
          [received_at, received_at + 72 h] and admission requires the count of windows containing the receive
          instant to be strictly below 2, so a third RECEIVE at exactly 2026-08-09T13:00:00Z is refused and
          the same RECEIVE one second later succeeds.
        test_recipe:
          setup:
