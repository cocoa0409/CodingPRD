          - calculations.request_page_ledger
          - entities.RecordSegment.fields.sensitivity_status
          - entities.RecordSegment.fields.redaction_status
          - state_machines.RecordSegment.APPLIED_to_APPROVED
        distinguishing_aspect: >
          A third calculation domain — the segment ledger, not money and not
          lateness: over one 80-page retrieved set the GROSS_RETRIEVED variant
          reports 80 while the NET_RELEASED variant reports 57, because 18 pages
          are WITHHELD and 5 approved redacted pages are removed, and the two
          variants are persisted side by side on the same Request.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; CA fee rule; facility; patient; ATTORNEY requester on an authorization that authorizes BEHAVIORAL_HEALTH but not HIV."
            - "Third-party request accepted into COMPILATION with three segments: GENERAL_MEDICAL 40 pages, BEHAVIORAL_HEALTH 22 pages, HIV 18 pages."
            - "Sensitive review INCLUDEs the behavioral-health segment with redaction required and WITHHOLDs the HIV segment; the analyst applies 5 redacted pages."
