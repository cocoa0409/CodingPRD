              as_user_id: "${c_int}"
              captures: { h_k2: $.data.id }
            - call: "POST /behavioral-health/holds/${h_k2}/certify"
              payload: { certification_note: "Independent certification." }
              as: AttendingPsychiatrist
              as_user_id: "${c_psb}"
            - call: "POST /behavioral-health/petitions"
              payload: { hold_id: "${h_k2}", requested_hold_type: "EXTENSION_14D", petition_grounds: "Continued danger to self." }
              as: AttendingPsychiatrist
              as_user_id: "${c_psa}"
              captures: { pet_k2: $.data.id }
            - call: "POST /behavioral-health/hearings"
              payload: { petition_id: "${pet_k1}", advocate_clinician_id: "${c_adv}", scheduled_start_at: "2026-09-04T10:00:00Z", duration_minutes: 60 }
              as: PatientRightsAdvocate
              as_user_id: "${c_adv}"
              captures: { hr_k1: $.data.id }
            - call: "POST /behavioral-health/hearings"
              payload: { petition_id: "${pet_k2}", advocate_clinician_id: "${c_adv}", scheduled_start_at: "2026-09-04T11:30:00Z", duration_minutes: 30 }
              as: PatientRightsAdvocate
              as_user_id: "${c_adv}"
              captures: { hr_k2: $.data.id }
            - call: "GET /behavioral-health/clinicians/${c_adv}"
              payload: {}
              as: PatientRightsAdvocate
              as_user_id: "${c_adv}"
              captures: { adv_v1: $.data.version }
          trigger:
            - call: "POST /behavioral-health/petitions/${pet_k1}/withdraw"
              payload: { withdraw_reason: "Treatment team no longer seeks an extension." }
              as: PatientRightsAdvocate
              as_user_id: "${c_adv}"
          assert:
            - "before the withdrawal Clinician.${c_adv}.booked_docket_minutes == 90"
            - "HoldPetition.${pet_k1}.status == \"WITHDRAWN\" and HoldPetition.${pet_k2}.status == \"HEARING_SCHEDULED\""
            - "CourtHearing.${hr_k1}.status == \"VACATED\" and CourtHearing.${hr_k2}.status == \"SCHEDULED\" (only the withdrawn petition's hearing is vacated)"
            - "after the withdrawal Clinician.${c_adv}.booked_docket_minutes == 30 (exactly H1's 60 minutes returned, not a reset to 0)"
            - "Clinician.${c_adv}.version == ${adv_v1} + 1"
            - "HoldOrder.${h_k1}.status == \"ACTIVE\" and Patient.${p_k1}.active_hold_count == 1 (withdrawing the petition does not close the hold)"
            - "GET /behavioral-health/hearings?advocate_clinician_id=${c_adv}&status=SCHEDULED returns total_count == 1"

