        distinguishing_aspect: "Variant SELECTION, not merely divergence: the same batch carries provisional_accepted_tons 16.880 (book yield 88.00 - 1.8*2.00 = 84.40 on 20.000 tons) and final_accepted_tons 18.000 (20.000 charged less the weighed 2.000-ton reject). A run drawing 17.500 tons sits strictly between the two, so priority 67 must consult available_tons from the FINAL variant and let the start through; an implementation that gates on the provisional projection returns 409 ERR_INSUFFICIENT_PULP. After the draw the provisional figure must still read 16.880 — nothing reconciles the variants."
