              as: Commissioner
              as_user_id: "u_com_1"
          assert:
            - "Central's ballot returns HTTP 409 with error.error_id == ERR_MEMBER_NOT_ELIGIBLE_TO_VOTE, since Member.${m_c_id}.voting_weight_bps == 0 while PETITIONED"
            - "North's second ballot returns HTTP 409 with error.error_id == ERR_DUPLICATE_BALLOT and does not flip the existing CAST ballot's choice to AGAINST"
            - "MembershipAction.${ma_id}.cast_weight_bps == 10000, .for_weight_bps == 10000, .against_weight_bps == 0 and .version is still ${ma_v2}"
