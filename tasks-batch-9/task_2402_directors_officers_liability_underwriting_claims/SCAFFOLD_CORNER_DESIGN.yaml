          assert:
            - "the accept response itself is 201 and already carries data.policy_number == \"DO-000001\", data.coverage_status == \"INCEPTED\", data.premium_status == \"INVOICED\", data.submission_id == ${sub_id} and data.quote_id == ${quote_id}"
            - "the same response carries data.gross_premium_usd == 236468.57 (the quoted gross times 1 + an agreed impact sum of 0.00) and data.premium_due_date == \"2026-08-31T00:00:00Z\" == the bind instant plus 30 days"
            - "the same response already carries the derived ledger: shared_aggregate_limit_usd 10000000, aggregate_remaining_usd 10000000.00, total_eroded_usd 0.00, retention_usd 250000, erp_days 90, program_target_limit_usd 20000000, placed_limit_usd 0.00, tower_posture \"INCOMPLETE\", tower_sealed false, open_claim_count 0, return_premium_usd 0, runoff_premium_usd 0 and version 1"
