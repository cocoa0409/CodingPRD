      - name: rollup_counts_only_legs_in_the_pinned_license_status_set
        claim_type: input_set_filtering
        grounds:
          - calculations.asset_clearance_rollup
          - state_machines.Asset.transitions.IN_NEGOTIATION_to_PARTIALLY_CLEARED
          - state_machines.Asset.transitions.PARTIALLY_CLEARED_to_CLEARED
          - entities.Asset.fields.rights_basis
        distinguishing_aspect: "covered_legs is drawn ONLY from licences in {EXECUTED, ACTIVE, EXPIRING}: a DRAFT MASTER licence leaves the MUSIC asset IN_NEGOTIATION with rights_basis UNDETERMINED, executing it yields PARTIALLY_CLEARED, and only the second leg's execution makes covered_legs a superset of the required pair."
        test_recipe:
          setup: ["A production in CLEARANCE with one 60-second MUSIC asset and two archives (label and publisher) each holding one ACTIVE rate card at base 10000."]
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Two Legs", delivery_deadline_date: "2027-06-30" }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
