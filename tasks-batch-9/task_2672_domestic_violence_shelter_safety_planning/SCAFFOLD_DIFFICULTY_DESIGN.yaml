          Error-category pair state (priority 56, ERR_SCREENING_NOT_APPROVED) versus business_fiscal
          (priority 90, ERR_UNIT_CAPACITY_EXCEEDED): a WAITLISTED request aimed at an already-full stay window
          violates both, and the 409 body must carry ERR_SCREENING_NOT_APPROVED; the control call proves
