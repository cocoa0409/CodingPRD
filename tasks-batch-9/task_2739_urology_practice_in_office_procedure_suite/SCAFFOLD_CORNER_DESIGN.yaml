            - "the eight calls addressing a non-existent id answer 403 and not 404, because priority 3 precedes the resource-existence checks at priority 8"
            - "the case is still schedule_status \"DRAFT\" with clearance_status \"PENDING_PREP\"; the room is still version ${room_v} with occupied_block_count 0; GET /urology/providers has total_count == 6; the logical clock is still 2026-09-14T07:00:00Z"

