              payload: { symbol: "GLIST2" }
              as: LabDirector
            - call: "POST /lab/genes"
              payload: { symbol: "GLIST3" }
              as: LabDirector
          trigger:
            - call: "GET /lab/genes?limit=2&offset=0"
              payload: {}
              as: LabIntake
          assert:
            - "response total_count == 3"
            - "response has_more == true"
            - "length of response data == 2"

