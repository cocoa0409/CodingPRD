  # =====================================================================
  # Section: validations
  # =====================================================================
  - section: validations
    instances:
      - name: missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds:
          - 'validations[priority=1]'
          - 'errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]'
        distinguishing_aspect: "Missing X-User-Role/X-User-ID fails at priority 1 before any role/existence check."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - { call: "GET /hotline/cases", captures: { err_id: "$.data.error_id" } }
          assert:
            - "err_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (http 400)"

      - name: existence_before_state_on_screen
        claim_type: priority_ordering
        grounds:
          - 'validations[priority=5]'
          - 'errors[ERR_NOT_FOUND]'
        distinguishing_aspect: "Screening a non-existent assignment returns 404 before any state check is evaluated."
        test_recipe:
          setup: ["officer staff"]
          setup_api_calls:
            - { call: "POST /hotline/staff-members", payload: { display_name: "Olivia Officer", email: "officer@corp.example", department: "Ethics", capabilities: [OFFICER], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_off: $.data.id } }
          trigger:
            - { call: "POST /hotline/assignments/11111111-1111-1111-1111-111111111111/screen", payload: { outcome: CLEAR }, as: ComplianceOfficer, as_user_id: "${s_off}", captures: { err_id: "$.data.error_id" } }
          assert:
            - "err_id == ERR_NOT_FOUND (existence priority 5 beats state priority 8)"

      - name: occ_assignment_propose_stale_version_returns_412
        claim_type: violation_to_error
        grounds:
          - 'concurrency_rules[assignment-propose-stale-case]'
          - 'validations[priority=7]'
          - 'errors[ERR_STALE_VERSION]'
        distinguishing_aspect: "Second assignment proposal carrying the pre-supersede case version is rejected 412 while a fresh version succeeds."
        test_recipe:
          setup: ["intake + inv staff; case TRIAGED at version 2"]
          setup_api_calls:
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ingrid Intake", email: "intake@corp.example", department: "Ethics", capabilities: [INTAKE], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_int: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ian Vest", email: "investigator@corp.example", department: "Ops", capabilities: [INVESTIGATION], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_inv: $.data.id } }
            - { call: "POST /hotline/cases", payload: { channel: WEB_PORTAL, category: FRAUD, description: "Allegation of expense fraud in Q2", region: NORTH, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-oc", captures: { c1: $.data.id } }
            - { call: "POST /hotline/cases/${c1}/triage", payload: { confirmed_category: FRAUD, subject_seniority: STAFF, financial_exposure_band: NONE, reporter_vulnerability: NONE, triage_decision: PROCEED }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { c1_v: $.data.version } }
            - { call: "POST /hotline/cases/${c1}/assignments", payload: { expected_case_version: "${c1_v}" }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { a1: $.data.id } }
          trigger:
