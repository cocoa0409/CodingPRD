        claim_type: cross_entity_validation
        grounds: [state_machines.DesignJob.QUOTED_to_CONVERTED, "errors[ERR_QUOTE_STALE]"]
        distinguishing_aspect: "A design job quoted under line L1 cannot convert once L1 was superseded (SUNSETTING); revising and re-quoting under the ACTIVE L2 restores convertibility and the order prices under L2."
        test_recipe:
          setup: ["RETAIL account [ST-1]; program ACTIVE with L1 (F1 10000); design job driven to QUOTED (quoted_total 10000, quoted_line_id L1); then program superseded to L2 (F1 11000)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /cabinet/accounts"
              payload: { name: "Retail R10", channel: RETAIL, pricing_class: STANDARD, lead_time_class: STANDARD, credit_limit_cents: 100000000, store_codes: ["ST-1"] }
