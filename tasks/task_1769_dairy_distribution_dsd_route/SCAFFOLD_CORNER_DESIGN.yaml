  # ===========================================================================
  - section: errors
    instances:
      - name: error_envelope_shape
        claim_type: violation_to_error
        grounds: ["response_envelope", "errors[ERR_STORE_NOT_FOUND]"]
        distinguishing_aspect: "Error responses carry response_type \"error\" with data.error_id and data.message plus meta.api_request_id; success responses carry meta.api_request_id/api_request_timestamp and response_type object|array."
        test_recipe:
          setup: ["One distributor exists"]
          setup_api_calls:
            - call: "POST /dairy/distributors"
              payload: { name: "Dairy Dist EA", license_number: "LIC-EA-1" }
