            - call: "POST /complaint-office/complaints/${c11_id}/quality-reviews"
              payload: { window_start_at: "2026-08-08T00:00:00Z", window_end_at: "2026-08-14T00:00:00Z" }
              as: QAReviewer
              as_user_id: "user_qa_6"
              captures: { qr11b_id: $.data.id }
          trigger:
            - call: "POST /complaint-office/complaints/${c11_id}/resolve"
              payload: {}
              as: CaseHandler
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_QA_PASS_REQUIRED"
            - "Complaint.${c11_id}.status == RESPONSE_QA (unchanged)"
            - "QualityReview.${qr11a_id}.outcome == FAIL"
            - "QualityReview.${qr11b_id}.status == OPEN"

      - name: complaint_withdraw_gated_by_referral_state
        grounds:
          - state_machines.Complaint.INTAKE_to_WITHDRAWN
          - state_machines.RegulatoryReferral
          - validations[priority=17]
          - errors[ERR_REFERRAL_OPEN]
        distinguishing_aspect: |
          Pair Complaint -> RegulatoryReferral (different pair): withdraw is
          rejected while the complaint's referral is OPEN or
          REOPENED_BY_REGULATOR, but succeeds once the referral reaches
          CLOSED_BY_REGULATOR — the complaint's valid transitions depend on
          the child referral's state.
        test_recipe:
          setup:
            - "Portal complaint (INTAKE) with auto-created referral OPEN; first withdraw attempt must fail"
            - "Referral then submitted and closed; second withdraw attempt must succeed"
          setup_api_calls:
            - call: "POST /complaint-office/products"
              payload: { product_code: "GW-CHK", display_name: "Gateway Checking" }
              as: ComplaintManager
            - call: "POST /complaint-office/channels"
              payload: { channel_code: "CFPB_PORTAL", display_name: "CFPB Portal", is_regulator_portal: true }
              as: ComplaintManager
            - call: "POST /complaint-office/taxonomy-categories"
              payload: { category_code: "SVC.ACCT_ACCESS" }
              as: ComplaintManager
            - call: "POST /complaint-office/complaints"
              payload: { complainant_ref: "CUST-1101", channel_code: "CFPB_PORTAL", product_code: "GW-CHK", category_code: "SVC.ACCT_ACCESS", narrative: "Account lockout", portal_ref: "CFPB-GW-1" }
              as: IntakeSpecialist
              captures: { c12_id: $.data.id }
            - call: "GET /complaint-office/complaints/${c12_id}/referrals"
              payload: {}
              as: CaseHandler
              captures: { ref12_id: $.data.0.id }
            - call: "POST /complaint-office/referrals/${ref12_id}/submit_response"
              payload: { response_text: "Response filed." }
              as: CaseHandler
            - call: "POST /complaint-office/referrals/${ref12_id}/close"
              payload: {}
              as: ComplaintManager
          trigger:
            - call: "POST /complaint-office/complaints/${c12_id}/withdraw"
              payload: {}
              as: CaseHandler
          assert:
            - "Complaint.${c12_id}.status == WITHDRAWN"
            - "Complaint.${c12_id}.retention_purge_at != null"
            - "RegulatoryReferral.${ref12_id}.status == CLOSED_BY_REGULATOR (unchanged by withdraw)"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: qa_review_window_half_open_touching_endpoints_allowed
        grounds:
          - validations[priority=13]
          - entities.QualityReview.fields.window_start_at
          - entities.QualityReview.fields.window_end_at
        distinguishing_aspect: |
          Half-open [start, end) semantics on the QualityReview resource: a
          reviewer holding OPEN review [08-01, 08-10) may immediately claim
          [08-10, 08-20) — the shared endpoint 08-10 is NOT an overlap —
          while [08-05, 08-12) IS rejected; adjacency is allowed under
          half-open semantics.
        test_recipe:
          setup:
            - "Reviewer user_qa_7 holds an OPEN review on complaint A with window [2026-08-01, 2026-08-10)"
            - "Complaint B in RESPONSE_QA ready for review"
          setup_api_calls:
            - call: "POST /complaint-office/products"
              payload: { product_code: "HO-PROD", display_name: "Half Open Product" }
              as: ComplaintManager
            - call: "POST /complaint-office/channels"
              payload: { channel_code: "WEB", display_name: "Web" }
              as: ComplaintManager
            - call: "POST /complaint-office/taxonomy-categories"
              payload: { category_code: "GEN.SERVICE" }
              as: ComplaintManager
            - call: "POST /complaint-office/complaints"
              payload: { complainant_ref: "CUST-1201", channel_code: "WEB", product_code: "HO-PROD", category_code: "GEN.SERVICE", narrative: "A" }
              as: IntakeSpecialist
              captures: { ca13_id: $.data.id }
            - call: "POST /complaint-office/complaints"
              payload: { complainant_ref: "CUST-1202", channel_code: "WEB", product_code: "HO-PROD", category_code: "GEN.SERVICE", narrative: "B" }
              as: IntakeSpecialist
              captures: { cb13_id: $.data.id }
            - call: "POST /complaint-office/complaints/${ca13_id}/quality-reviews"
              payload: { window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-08-10T00:00:00Z" }
              as: QAReviewer
              as_user_id: "user_qa_7"
              captures: { qr13a_id: $.data.id }
          trigger:
            - call: "POST /complaint-office/complaints/${cb13_id}/quality-reviews"
              payload: { window_start_at: "2026-08-10T00:00:00Z", window_end_at: "2026-08-20T00:00:00Z" }
              as: QAReviewer
              as_user_id: "user_qa_7"
              captures: { qr13b_id: $.data.id }
          assert:
            - "QualityReview.${qr13b_id}.status == OPEN (created — touching endpoints allowed)"
            - "A further create with window [2026-08-05T00:00:00Z, 2026-08-12T00:00:00Z) for user_qa_7 fails with ERR_REVIEW_WINDOW_OVERLAP"

      - name: trend_snapshot_closed_interval_shared_boundary_is_overlap
        grounds:
          - validations[priority=14]
          - entities.TrendSnapshot.fields.period_start_at
          - entities.TrendSnapshot.fields.period_end_at
        distinguishing_aspect: |
          CLOSED-interval semantics on the TrendSnapshot resource — the
          opposite geometric treatment from instance 1: two snapshots for the
          same product sharing exactly one boundary date DO overlap, so
          [2026-08-01, 2026-08-31] followed by [2026-08-31, 2026-09-30] is
          rejected with ERR_SNAPSHOT_WINDOW_OVERLAP; only strictly disjoint
          windows (end < next start) are accepted.
        test_recipe:
          setup:
            - "Product with an existing snapshot covering [2026-07-01T00:00:00Z, 2026-08-01T00:00:00Z] (closed)"
          setup_api_calls:
            - call: "POST /complaint-office/products"
              payload: { product_code: "CI-PROD", display_name: "Closed Interval Product" }
              as: ComplaintManager
              captures: { p14_id: $.data.id }
            - call: "POST /complaint-office/products/${p14_id}/trend-snapshots"
              payload: { period_start_at: "2026-07-01T00:00:00Z", period_end_at: "2026-08-01T00:00:00Z" }
              as: ComplaintManager
              captures: { snap14a_id: $.data.id }
          trigger:
            - call: "POST /complaint-office/products/${p14_id}/trend-snapshots"
              payload: { period_start_at: "2026-08-01T00:00:00Z", period_end_at: "2026-08-31T23:59:59Z" }
              as: ComplaintManager
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_SNAPSHOT_WINDOW_OVERLAP"
            - "Product ${p14_id} still has exactly 1 TrendSnapshot"
            - "A create with window [2026-08-02T00:00:00Z, 2026-08-31T23:59:59Z] succeeds (strictly after the closed end 2026-08-01T00:00:00Z)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: approve_then_reverse_restores_approved_restitution_ledger
        grounds:
          - state_machines.RemediationDecision.PENDING_APPROVAL_to_APPROVED
          - state_machines.RemediationDecision.APPROVED_to_REVERSED
          - entities.Complaint.fields.approved_restitution_cents
        distinguishing_aspect: |
          Conserved quantity: Complaint.approved_restitution_cents. The
          forward APPROVE adds restitution_amount_cents; the compensating
          REVERSE subtracts exactly the same amount, so approve-then-reverse
          returns the ledger to its pre-approval value with zero drift.
          Invariant: approved_restitution_cents == sum over decisions in
          {APPROVED, PAID} at every point in the chain.
        test_recipe:
          setup:
            - "Complaint INVESTIGATING with approved_restitution_cents == 0"
            - "One PENDING_APPROVAL decision with restitution_amount_cents == 15000 (single line, no bps rate)"
            - "Approver is a different user than the drafter"
          setup_api_calls:
            - call: "POST /complaint-office/products"
              payload: { product_code: "LEDG-PROD", display_name: "Ledger Product" }
              as: ComplaintManager
            - call: "POST /complaint-office/channels"
              payload: { channel_code: "WEB", display_name: "Web" }
              as: ComplaintManager
            - call: "POST /complaint-office/taxonomy-categories"
              payload: { category_code: "FEES.OD" }
              as: ComplaintManager
            - call: "POST /complaint-office/complaints"
              payload: { complainant_ref: "CUST-1301", channel_code: "WEB", product_code: "LEDG-PROD", category_code: "FEES.OD", narrative: "OD fees" }
              as: IntakeSpecialist
              captures: { c15_id: $.data.id }
            - call: "POST /complaint-office/complaints/${c15_id}/triage"
              payload: {}
              as: CaseHandler
            - call: "POST /complaint-office/complaints/${c15_id}/start_investigation"
              payload: {}
              as: CaseHandler
            - call: "GET /complaint-office/complaints/${c15_id}"
              payload: {}
              as: CaseHandler
              captures: { c15_v: $.data.version }
            - call: "POST /complaint-office/complaints/${c15_id}/remediation_decisions"
              payload: { decision_type: "RESTITUTION", line_items: [ { label: "od-fee", amount_cents: 15000 } ], expected_complaint_version: "${c15_v}" }
              as: CaseHandler
              as_user_id: "user_handler_1"
              captures: { dec15_id: $.data.id }
            - call: "POST /complaint-office/remediation-decisions/${dec15_id}/submit"
              payload: {}
              as: CaseHandler
              as_user_id: "user_handler_1"
          trigger:
            - call: "POST /complaint-office/remediation-decisions/${dec15_id}/approve"
              payload: {}
              as: RemediationApprover
              as_user_id: "user_approver_1"
            - call: "POST /complaint-office/remediation-decisions/${dec15_id}/reverse"
              payload: {}
              as: RemediationApprover
              as_user_id: "user_approver_1"
            - call: "GET /complaint-office/complaints/${c15_id}"
              payload: {}
              as: CaseHandler
          assert:
            - "RemediationDecision.${dec15_id}.status == REVERSED"
            - "Complaint.${c15_id}.approved_restitution_cents == 0"
            - "Complaint.${c15_id}.paid_restitution_cents == 0"
            - "IntakeEvent stream contains REMEDIATION_APPROVED then REMEDIATION_REVERSED for complaint ${c15_id}"

      - name: publish_then_supersede_preserves_single_active_template_invariant
        grounds:
          - state_machines.ResponseTemplate.DRAFT_to_ACTIVE
          - entities.ResponseTemplate.fields.status
        distinguishing_aspect: |
          Different conserved quantity: the count of ACTIVE templates per
          (channel_code, category_code) pair. Publishing template B while
          template A is ACTIVE auto-retires A in the same call, so
          count(ACTIVE per pair) stays == 1 across the publish/supersede
          pair — the compensating action (auto-retire) fires inside the
          forward action and the invariant holds before and after.
        test_recipe:
          setup:
            - "Template A for pair (WEB, GEN.SERVICE) is ACTIVE"
            - "Template B for the same pair is DRAFT"
          setup_api_calls:
            - call: "POST /complaint-office/channels"
              payload: { channel_code: "WEB", display_name: "Web" }
              as: ComplaintManager
            - call: "POST /complaint-office/taxonomy-categories"
              payload: { category_code: "GEN.SERVICE" }
              as: ComplaintManager
            - call: "POST /complaint-office/response-templates"
              payload: { template_key: "GEN-SVC-A", channel_code: "WEB", category_code: "GEN.SERVICE", body: "Template A body" }
              as: ComplaintManager
              captures: { tplA_id: $.data.id }
            - call: "POST /complaint-office/response-templates/${tplA_id}/publish"
              payload: {}
              as: ComplaintManager
            - call: "POST /complaint-office/response-templates"
              payload: { template_key: "GEN-SVC-B", channel_code: "WEB", category_code: "GEN.SERVICE", body: "Template B body" }
              as: ComplaintManager
              captures: { tplB_id: $.data.id }
          trigger:
            - call: "POST /complaint-office/response-templates/${tplB_id}/publish"
              payload: {}
              as: ComplaintManager
          assert:
            - "ResponseTemplate.${tplB_id}.status == ACTIVE"
            - "ResponseTemplate.${tplA_id}.status == RETIRED"
            - "count(ResponseTemplate with channel_code == WEB and category_code == GEN.SERVICE and status == ACTIVE) == 1"
