          difficulty_instance: resource_temporal_overlap / coverage_half_open_interval_allows_adjacency_but_rejects_intersection
          rationale: "Both the accepted adjacency and the rejected intersection are asserted by the named §1.8 instance."

      - name: error_contract_window_conflict_rejection
        claim_type: temporal_validation
        grounds: ["validations[priority=52]", "errors[ERR_CONTRACT_WINDOW_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / contract_closed_interval_requires_one_clear_day_so_adjacency_conflicts
          rationale: "The rejected adjacency and the accepted one-clear-day gap are asserted by the named §1.8 instance."

  # ===========================================================================
  - section: endpoints
    instances:
      - name: claim_event_log_is_returned_oldest_first_after_intake_adjudicate_and_finalize
        claim_type: computed_read
        grounds: ["entities.AdjudicationEvent.fields.event_type", "endpoints[GET /adjudication/claims/{id}/events]"]
        distinguishing_aspect: "After intake, one adjudication pass and finalize, GET /adjudication/claims/{id}/events returns exactly three rows in the order INTAKE, ADJUDICATE, FINALIZE with pass_number 0, 1 and 1."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; plan EP-1 (deductible 0, coinsurance 0), IN_NETWORK provider, fee schedule rate 73721 = 40000, member with an open-ended PRIMARY coverage from 2026-01-01."
            - "Claim CLM-EP-1 has been intaken, adjudicated once and finalized."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "EP-1", name: "Endpoint Plan One", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/providers"
              payload: { npi: "4000000001", name: "EP1 Clinic", network_status: "IN_NETWORK" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "73721", allowed_amount_cents: 40000, effective_date: "2026-01-01" }
              as: NetworkManager
            - call: "POST /adjudication/members"
              payload: { member_number: "M-EP-1", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /adjudication/members/${mem_id}/coverages"
              payload: { effective_date: "2026-01-01", cob_order: "PRIMARY" }
              as: PlanAdmin
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-EP-1", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "73721", units: 1, billed_amount_cents: 60000, service_date: "2026-02-10" }] }
              as: ClaimsIntake
              captures: { c_id: $.data.id }
            - call: "POST /adjudication/claims/${c_id}/adjudicate"
              payload: {}
              as: ClaimsExaminer
            - call: "POST /adjudication/claims/${c_id}/finalize"
              payload: {}
              as: ClaimsExaminer
          trigger:
            - call: "GET /adjudication/claims/${c_id}/events"
              payload: {}
              as: ClaimsExaminer
          assert:
            - "total_count == 3"
            - "The rows appear in the order INTAKE, ADJUDICATE, FINALIZE"
            - "The INTAKE row has pass_number == 0 and to_status == RECEIVED"
            - "The ADJUDICATE row has pass_number == 1, from_status == RECEIVED and to_status == ADJUDICATED"
            - "The FINALIZE row has from_status == ADJUDICATED and to_status == FINALIZED"
            - "GET /adjudication/claims/${c_id}/events?event_type=FINALIZE returns total_count == 1"

      - name: logical_clock_defaults_to_2026_08_01_before_any_set_call
        claim_type: action_endpoint
        grounds: ["endpoints[POST /adjudication/_clock/set_current_utc]", "entities.Claim.fields.received_at"]
        distinguishing_aspect: "With no POST /adjudication/_clock/set_current_utc call anywhere in the setup, an intaken claim stamps received_at == 2026-08-01T00:00:00.000Z rather than real wall-clock time."
