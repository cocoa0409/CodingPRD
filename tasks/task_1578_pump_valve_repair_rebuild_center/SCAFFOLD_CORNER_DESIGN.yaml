        grounds: [complexity_profile]
        excluded_because:
          difficulty_instance: "dual_variant_calc / test_verdict_per_point_vs_weighted_avg_variant"
          rationale: "Both variant pairs produce expected divergent results in §1.8."

      - name: rate_threshold_layer_excluded_stub
        claim_type: rate_threshold_triggers
        grounds: [complexity_profile, calculations.window_posture]
        excluded_because:
          difficulty_instance: "transitive_cascade / quote_approval_capacity_posture_cascade"
          rationale: "Posture flip at the 80% threshold asserted there; the below/above one-hour boundary is in corner instance window_posture_surge_threshold_boundary."

