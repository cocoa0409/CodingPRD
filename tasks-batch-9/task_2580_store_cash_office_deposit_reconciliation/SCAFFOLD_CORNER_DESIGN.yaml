scaffold_corner_design:
  - section: entities
    instances:
      - name: store_creation_returns_full_entity_and_response_envelope
        claim_type: creation
        grounds:
          - entities.Store
          - endpoints["POST /cash-ops/stores"]
          - response_envelope
        distinguishing_aspect: >
          A store created with every policy field supplied returns 201 with response_type "object",
          a meta block carrying api_request_id and api_request_timestamp, and a data object echoing
          all fourteen policy fields plus id / created_at / updated_at / version == 1.
        test_recipe:
          setup:
            - "Empty database; logical clock at its startup default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: TreasuryAnalyst
          trigger:
            - call: "POST /cash-ops/stores"
              payload: { store_code: "S-1901", name: "Store 1901", region_code: "WEST", safe_time_delay_minutes: 7, safe_open_window_minutes: 12, dual_control_required: true, pickup_buffer_minutes: 45, max_daily_pickups: 3, single_event_variance_threshold_cents: 3000, rolling_variance_threshold_cents: 12000, rolling_window_days: 45, theft_escalation_threshold_cents: 60000, provisional_credit_cap_cents: 400000, seasonal_profile: "HOLIDAY" }
              as: TreasuryAnalyst
              as_user_id: "U-TREAS-1"
              captures: { store_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "response_type == \"object\" and meta.api_request_id and meta.api_request_timestamp are both present and non-empty"
            - "data.store_code == \"S-1901\", data.name == \"Store 1901\", data.region_code == \"WEST\""
            - "data.safe_time_delay_minutes == 7, data.safe_open_window_minutes == 12, data.dual_control_required == true, data.pickup_buffer_minutes == 45, data.max_daily_pickups == 3"
            - "data.single_event_variance_threshold_cents == 3000, data.rolling_variance_threshold_cents == 12000, data.rolling_window_days == 45, data.theft_escalation_threshold_cents == 60000, data.provisional_credit_cap_cents == 400000, data.seasonal_profile == \"HOLIDAY\""
            - "data.id is a non-empty string, data.version == 1, data.created_at == \"2026-08-03T08:00:00Z\" and data.updated_at == \"2026-08-03T08:00:00Z\""

      - name: store_policy_defaults_applied_when_omitted
        claim_type: defaults
        grounds:
          - entities.Store.fields.safe_time_delay_minutes
          - entities.Store.fields.safe_open_window_minutes
          - entities.Store.fields.dual_control_required
          - entities.Store.fields.pickup_buffer_minutes
          - entities.Store.fields.max_daily_pickups
          - entities.Store.fields.single_event_variance_threshold_cents
          - entities.Store.fields.rolling_variance_threshold_cents
          - entities.Store.fields.rolling_window_days
          - entities.Store.fields.theft_escalation_threshold_cents
          - entities.Store.fields.provisional_credit_cap_cents
          - entities.Store.fields.seasonal_profile
          - endpoints["POST /cash-ops/stores"]
        distinguishing_aspect: >
          A store created with only store_code, name and region_code receives all eleven declared
          policy defaults verbatim (5, 10, true, 30, 2, 2500, 10000, 30, 50000, 500000, BASELINE) —
          no field is left null and none is silently zeroed.
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: TreasuryAnalyst
          trigger:
            - call: "POST /cash-ops/stores"
              payload: { store_code: "S-1902", name: "Store 1902", region_code: "EAST" }
              as: TreasuryAnalyst
              as_user_id: "U-TREAS-1"
          assert:
            - "data.safe_time_delay_minutes == 5"
            - "data.safe_open_window_minutes == 10"
            - "data.dual_control_required == true"
            - "data.pickup_buffer_minutes == 30"
            - "data.max_daily_pickups == 2"
            - "data.single_event_variance_threshold_cents == 2500"
            - "data.rolling_variance_threshold_cents == 10000"
            - "data.rolling_window_days == 30"
            - "data.theft_escalation_threshold_cents == 50000"
            - "data.provisional_credit_cap_cents == 500000"
            - "data.seasonal_profile == \"BASELINE\""

      - name: store_read_returns_stored_policy_fields
        claim_type: retrieval
        grounds:
          - entities.Store
          - endpoints["GET /cash-ops/stores/{id}"]
        distinguishing_aspect: >
          GET /cash-ops/stores/{id} returns the same policy row that POST stored — theft_escalation_threshold_cents
          75000 and seasonal_profile BACK_TO_SCHOOL survive the round trip with version still 1.
        test_recipe:
          setup:
            - "Store S-1903 registered with theft_escalation_threshold_cents 75000 and seasonal_profile BACK_TO_SCHOOL"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/stores"
              payload: { store_code: "S-1903", name: "Store 1903", region_code: "WEST", theft_escalation_threshold_cents: 75000, seasonal_profile: "BACK_TO_SCHOOL" }
              as: TreasuryAnalyst
              as_user_id: "U-TREAS-1"
              captures: { store_id: $.data.id }
          trigger:
            - call: "GET /cash-ops/stores/${store_id}"
              payload: {}
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
          assert:
            - "HTTP status is 200 and response_type == \"object\""
            - "data.id == ${store_id}, data.store_code == \"S-1903\", data.theft_escalation_threshold_cents == 75000, data.seasonal_profile == \"BACK_TO_SCHOOL\""
            - "data.version == 1 — a read performs no write"

      - name: cashier_listing_filters_by_store_id
        claim_type: listing
        grounds:
          - entities.Cashier.fields.store_id
          - endpoints["GET /cash-ops/cashiers"]
          - response_envelope.pagination_fields
        distinguishing_aspect: >
          With two cashiers at store S-1904 and one at S-1905, GET /cash-ops/cashiers filtered by the
          S-1904 id returns exactly those two rows with total_count == 2 and has_more == false, and the
          S-1905 cashier E-300 is absent.
        test_recipe:
          setup:
            - "Stores S-1904 and S-1905; cashiers E-100 and E-200 at S-1904, cashier E-300 at S-1905"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/stores"
              payload: { store_code: "S-1904", name: "Store 1904", region_code: "WEST" }
              as: TreasuryAnalyst
              as_user_id: "U-TREAS-1"
              captures: { store_a_id: $.data.id }
            - call: "POST /cash-ops/stores"
              payload: { store_code: "S-1905", name: "Store 1905", region_code: "EAST" }
              as: TreasuryAnalyst
              as_user_id: "U-TREAS-1"
              captures: { store_b_id: $.data.id }
            - call: "POST /cash-ops/cashiers"
              payload: { store_id: "${store_a_id}", employee_code: "E-100", display_name: "Cashier 100" }
              as: StoreManager
              as_user_id: "U-MGR-1"
              captures: { cashier_a1_id: $.data.id }
            - call: "POST /cash-ops/cashiers"
              payload: { store_id: "${store_a_id}", employee_code: "E-200", display_name: "Cashier 200" }
              as: StoreManager
              as_user_id: "U-MGR-1"
              captures: { cashier_a2_id: $.data.id }
            - call: "POST /cash-ops/cashiers"
              payload: { store_id: "${store_b_id}", employee_code: "E-300", display_name: "Cashier 300" }
              as: StoreManager
              as_user_id: "U-MGR-1"
              captures: { cashier_b1_id: $.data.id }
          trigger:
            - call: "GET /cash-ops/cashiers"
              payload: { store_id: "${store_a_id}" }
              as: StoreManager
              as_user_id: "U-MGR-1"
          assert:
            - "HTTP status is 200 and response_type == \"array\""
            - "total_count == 2, has_more == false, limit == 10, offset == 0"
            - "the returned ids are exactly {${cashier_a1_id}, ${cashier_a2_id}} and ${cashier_b1_id} is absent"
            - "every returned row has till_eligibility == \"ELIGIBLE\" and coaching_state == \"NONE\""

      - name: cashier_creation_missing_display_name_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Cashier.fields.display_name
          - endpoints["POST /cash-ops/cashiers"]
          - validations[priority=25]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: >
          display_name has source input with no default, so omitting it returns 400 ERR_INVALID_REQUEST
          and no Cashier row is created for employee_code E-400.
        test_recipe:
          setup:
            - "Store S-1906 registered, no cashiers yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/stores"
              payload: { store_code: "S-1906", name: "Store 1906", region_code: "WEST" }
              as: TreasuryAnalyst
              as_user_id: "U-TREAS-1"
              captures: { store_id: $.data.id }
          trigger:
            - call: "POST /cash-ops/cashiers"
              payload: { store_id: "${store_id}", employee_code: "E-400" }
              as: StoreManager
              as_user_id: "U-MGR-1"
              captures: { err: $.data.error_id }
            - call: "GET /cash-ops/cashiers"
              payload: { store_id: "${store_id}" }
              as: StoreManager
              as_user_id: "U-MGR-1"
          assert:
            - "the create call returns HTTP 400 with response_type == \"error\" and data.error_id == \"ERR_INVALID_REQUEST\""
            - "the follow-up list returns total_count == 0 — no partial Cashier row was persisted"

      - name: store_creation_invalid_seasonal_profile_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Store.fields.seasonal_profile
          - calculations.change_order_denomination_plan.constants.SEASONAL_MULTIPLIER
          - validations[priority=25]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: >
          seasonal_profile accepts only BASELINE, BACK_TO_SCHOOL and HOLIDAY — the three keys of
          SEASONAL_MULTIPLIER — so seasonal_profile "SUMMER_RUSH" returns 400 ERR_INVALID_REQUEST
          rather than being stored and later multiplying by an undefined factor.
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: TreasuryAnalyst
          trigger:
            - call: "POST /cash-ops/stores"
              payload: { store_code: "S-1907", name: "Store 1907", region_code: "WEST", seasonal_profile: "SUMMER_RUSH" }
              as: TreasuryAnalyst
              as_user_id: "U-TREAS-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 400 and data.error_id == \"ERR_INVALID_REQUEST\""
            - "no Store with store_code \"S-1907\" exists afterwards"

      - name: safe_transaction_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.SafeTransaction
          - entities.SafeTransaction.fields.effective_amount_cents
          - endpoints["GET /cash-ops/safe-transactions"]
          - endpoints["GET /cash-ops/safe-transactions/{id}"]
        distinguishing_aspect: >
          SafeTransaction is declared common_fields false: the ledger exposes only read endpoints, and
          the two rows produced by commissioning the safe and issuing a starting bank carry
          effective_amount_cents +500000 and -20000 with no version field on either row.
        test_recipe:
          setup:
            - "Store S-1908 with a MANUAL safe SAFE-A opened at 500000; cashier E-100 assigned register 1 on the 2026-08-03 journal with a 20000 starting bank"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/stores"
              payload: { store_code: "S-1908", name: "Store 1908", region_code: "WEST" }
              as: TreasuryAnalyst
              as_user_id: "U-TREAS-1"
              captures: { store_id: $.data.id }
            - call: "POST /cash-ops/safes"
              payload: { store_id: "${store_id}", safe_code: "SAFE-A", safe_type: "MANUAL", opening_balance_cents: 500000 }
              as: TreasuryAnalyst
              as_user_id: "U-TREAS-1"
              captures: { safe_id: $.data.id }
            - call: "POST /cash-ops/cashiers"
              payload: { store_id: "${store_id}", employee_code: "E-100", display_name: "Cashier 100" }
              as: StoreManager
              as_user_id: "U-MGR-1"
              captures: { cashier_id: $.data.id }
            - call: "POST /cash-ops/sales-journals"
              payload: { store_id: "${store_id}", business_date: "2026-08-03" }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
              captures: { journal_id: $.data.id }
            - call: "POST /cash-ops/till-sessions"
              payload: { sales_journal_id: "${journal_id}", cashier_id: "${cashier_id}", safe_id: "${safe_id}", register_number: 1, shift_start_at: "2026-08-03T09:00:00Z", shift_end_at: "2026-08-03T17:00:00Z", starting_bank_cents: 20000 }
              as: StoreManager
              as_user_id: "U-MGR-1"
              captures: { session_id: $.data.id }
          trigger:
            - call: "GET /cash-ops/safe-transactions"
              payload: { safe_id: "${safe_id}" }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
              captures: { txn_0_id: "$.data[0].id" }
            - call: "GET /cash-ops/safe-transactions/${txn_0_id}"
              payload: {}
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
          assert:
            - "the list returns total_count == 2: one row with txn_type == \"OPENING_BALANCE\", declared_amount_cents == 500000, verified_amount_cents == null, effective_amount_cents == 500000, and one with txn_type == \"STARTING_BANK_ISSUE\", declared_amount_cents == 20000, effective_amount_cents == -20000"
            - "the STARTING_BANK_ISSUE row has till_session_id == ${session_id}, deposit_id == null, change_order_id == null, actor_user_id == \"U-MGR-1\" and occurred_at == \"2026-08-03T08:00:00Z\""
            - "neither returned row carries a version field, and §1.5 declares no POST, PUT, PATCH or DELETE on /cash-ops/safe-transactions"
            - "Safe.${safe_id}.balance_cents == 480000"

      - name: till_session_not_found_returns_404
        claim_type: not_found
        grounds:
          - endpoints["GET /cash-ops/till-sessions/{id}"]
          - validations[priority=30]
          - errors[ERR_TILL_SESSION_NOT_FOUND]
        distinguishing_aspect: >
          A syntactically valid but unknown UUID on GET /cash-ops/till-sessions/{id} returns 404 with
          error_id ERR_TILL_SESSION_NOT_FOUND — not an empty 200 body and not the generic
          ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "Empty database — no till sessions exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: TreasuryAnalyst
          trigger:
            - call: "GET /cash-ops/till-sessions/11111111-1111-1111-1111-111111111111"
              payload: {}
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404, response_type == \"error\", data.error_id == \"ERR_TILL_SESSION_NOT_FOUND\""

      - name: deposit_creation_with_unknown_safe_id_returns_safe_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Deposit.fields.safe_id
          - endpoints["POST /cash-ops/deposits"]
          - validations[priority=35]
          - errors[ERR_SAFE_NOT_FOUND]
        distinguishing_aspect: >
          A body FK that does not resolve is rejected at priority 35 with ERR_SAFE_NOT_FOUND (404)
          before the priority-68 OCC check can fire, even though expected_safe_version carries the
          version of a real, different safe.
        test_recipe:
          setup:
            - "Store S-1909 with MANUAL safe SAFE-A (500000) UNLOCKED at 08:10Z and journal 2026-08-03 open"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/stores"
              payload: { store_code: "S-1909", name: "Store 1909", region_code: "WEST" }
              as: TreasuryAnalyst
              as_user_id: "U-TREAS-1"
              captures: { store_id: $.data.id }
            - call: "POST /cash-ops/safes"
              payload: { store_id: "${store_id}", safe_code: "SAFE-A", safe_type: "MANUAL", opening_balance_cents: 500000 }
              as: TreasuryAnalyst
              as_user_id: "U-TREAS-1"
              captures: { safe_id: $.data.id }
            - call: "POST /cash-ops/sales-journals"
              payload: { store_id: "${store_id}", business_date: "2026-08-03" }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
              captures: { journal_id: $.data.id }
            - call: "POST /cash-ops/safes/${safe_id}/open-requests"
              payload: { reason: "Deposit preparation" }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:10:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/safes/${safe_id}/open"
              payload: {}
              as: CashOfficeClerk
              as_user_id: "U-CLERK-2"
            - call: "GET /cash-ops/safes/${safe_id}"
              payload: {}
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
              captures: { safe_v: $.data.version }
          trigger:
            - call: "POST /cash-ops/deposits"
              payload: { safe_id: "22222222-2222-2222-2222-222222222222", sales_journal_id: "${journal_id}", business_date: "2026-08-03", counted_lines: [{ denomination_cents: 2000, quantity: 50 }], expected_safe_version: "${safe_v}" }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404 and data.error_id == \"ERR_SAFE_NOT_FOUND\" — not ERR_SAFE_VERSION_STALE"
            - "GET /cash-ops/deposits?safe_id=${safe_id} returns total_count == 0"
            - "Safe.${safe_id}.balance_cents == 500000 and Safe.${safe_id}.version is unchanged from ${safe_v}"

      - name: card_settlement_with_unknown_sales_journal_returns_not_found
        claim_type: flat
        grounds:
          - complexity_profile.entity_topology
          - entities.CardSettlement.fields.sales_journal_id
          - endpoints["POST /cash-ops/card-settlements"]
          - validations[priority=35]
          - errors[ERR_SALES_JOURNAL_NOT_FOUND]
        distinguishing_aspect: >
          The topology is flat, so cross-aggregate integrity is enforced on the body FK rather than by
          URL nesting: a CardSettlement whose sales_journal_id does not resolve returns 404
          ERR_SALES_JOURNAL_NOT_FOUND and no settlement row is created.
        test_recipe:
          setup:
            - "Store S-1910 exists; no sales journal with the id used in the trigger"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/stores"
              payload: { store_code: "S-1910", name: "Store 1910", region_code: "WEST" }
              as: TreasuryAnalyst
              as_user_id: "U-TREAS-1"
              captures: { store_id: $.data.id }
          trigger:
            - call: "POST /cash-ops/card-settlements"
              payload: { sales_journal_id: "33333333-3333-3333-3333-333333333333", card_network: "VISA_MC", gross_card_sales_cents: 50000, txn_count: 20, monthly_volume_cents: 1000000, funded_amount_cents: 48510 }
              as: TreasuryAnalyst
              as_user_id: "U-TREAS-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404 and data.error_id == \"ERR_SALES_JOURNAL_NOT_FOUND\""
            - "GET /cash-ops/card-settlements?sales_journal_id=33333333-3333-3333-3333-333333333333 returns total_count == 0"

      - name: change_order_client_supplied_total_planned_cents_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.ChangeOrder.fields.total_planned_cents
          - entities.ChangeOrder.fields.forecast_demand_cents
          - entities.ChangeOrder.fields.planned_lines
          - calculations.change_order_denomination_plan
          - endpoints["POST /cash-ops/change-orders"]
        distinguishing_aspect: >
          total_planned_cents is source computed: a client that posts total_planned_cents 99 alongside
          a BASELINE 80000 x 7 day order still gets forecast_demand_cents 560000 and
          total_planned_cents 613000 from the DENOM_MIX walk.
        test_recipe:
          setup:
            - "Store S-1911 with the default seasonal_profile BASELINE"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/stores"
              payload: { store_code: "S-1911", name: "Store 1911", region_code: "WEST" }
              as: TreasuryAnalyst
              as_user_id: "U-TREAS-1"
              captures: { store_id: $.data.id }
          trigger:
            - call: "POST /cash-ops/change-orders"
              payload: { store_id: "${store_id}", target_week_start: "2026-08-10", days_covered: 7, baseline_daily_cash_demand_cents: 80000, total_planned_cents: 99 }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
          assert:
            - "HTTP status is 201 and data.total_planned_cents == 613000 — the supplied 99 is ignored"
            - "data.forecast_demand_cents == 560000 and data.applied_seasonal_profile == \"BASELINE\""
            - "data.status == \"DRAFT\", data.approved_by_user_id == null, data.received_amount_cents == null"

  - section: state_machines
    instances:
      - name: till_session_initial_state_is_active
        claim_type: initial_state
        grounds:
          - state_machines.TillSession.initial_state
          - state_machines.TillSession.null_to_ACTIVE
          - endpoints["POST /cash-ops/till-sessions"]
        distinguishing_aspect: >
          A freshly assigned till starts in status ACTIVE with every count and variance field null,
          recount_count 0, dropped_declared_cents 0 and forced_close false — the blind-count and
          reconcile fields are not pre-populated at assignment.
        test_recipe:
          setup:
            - "Store S-1912 with MANUAL safe SAFE-A (500000), cashier E-100 and journal 2026-08-03"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/stores"
              payload: { store_code: "S-1912", name: "Store 1912", region_code: "WEST" }
              as: TreasuryAnalyst
              as_user_id: "U-TREAS-1"
              captures: { store_id: $.data.id }
            - call: "POST /cash-ops/safes"
              payload: { store_id: "${store_id}", safe_code: "SAFE-A", safe_type: "MANUAL", opening_balance_cents: 500000 }
              as: TreasuryAnalyst
              as_user_id: "U-TREAS-1"
              captures: { safe_id: $.data.id }
            - call: "POST /cash-ops/cashiers"
