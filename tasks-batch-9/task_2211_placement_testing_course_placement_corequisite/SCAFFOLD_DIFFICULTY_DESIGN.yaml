              captures: { so_v: $.data.version }
          trigger:
            - call: "POST /placement-determinations"
              payload: { student_id: "${sn}", subject_area: "MATH", expected_student_version: "${sn_v}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { n_base: $.data.base_confidence_score, n_pen: $.data.staleness_penalty, n_conf: $.data.confidence_score, n_days: $.data.validity_days, n_exp: $.data.expires_at, n_ev: $.data.evidence_state, n_measure: $.data.measure_type_used, n_src: $.data.source_attempt_id }
            - call: "POST /placement-determinations"
              payload: { student_id: "${so}", subject_area: "MATH", expected_student_version: "${so_v}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { o_base: $.data.base_confidence_score, o_pen: $.data.staleness_penalty, o_conf: $.data.confidence_score, o_days: $.data.validity_days, o_exp: $.data.expires_at, o_ev: $.data.evidence_state, o_measure: $.data.measure_type_used, o_src: $.data.source_attempt_id }
          assert:
            - "${scaled_n} == 1000 and ${scaled_o} == 1000 — round(160 * 6.25, 0) clamped at MAX_SCALED_SCORE"
            - "BELOW THE BOUNDARY: ${n_base} == 69.9, ${n_pen} == 0.0, ${n_conf} == 69.9, ${n_days} == 180, ${n_exp} == \"2027-01-28T00:00:00Z\", ${n_ev} == \"UNVERIFIED\""
            - "AT THE BOUNDARY: ${o_base} == 70.0, ${o_pen} == 0.0, ${o_conf} == 70.0, ${o_days} == 365, ${o_exp} == \"2027-08-01T00:00:00Z\", ${o_ev} == \"VERIFIED\""
            - "${n_ev} != ${o_ev} — a 0.01 GPA step flips evidence_state, proving CONFIDENCE_VERIFY_MIN is INCLUSIVE"
            - "${n_days} != ${o_days} — the same step flips the validity tier, proving VALIDITY_TIER_MID_MIN is INCLUSIVE"
            - "${n_measure} == \"TRANSCRIPT_GPA\" and ${n_src} == null and ${o_measure} == \"TRANSCRIPT_GPA\" and ${o_src} == null — the test component enters the SCORE but not the selector, because no TEST_SCORE rule is ACTIVE"
            - "an implementation using round-half-even on 25.875 gets 25.88 as well, but one that sums first and rounds once, or one that rounds to 2 dp with banker's rounding at the 0.5 cent, drifts SN to 70.0 and loses the boundary"

      - name: retake_gate_instant_equal_to_session_start_is_allowed
        metric: "max(next_eligible_at) against TestAdministration.starts_at at second granularity, INCLUSIVE upper bound"
        endpoint: "POST /test-attempts"
        grounds:
          - calculations.retake_eligibility_window
          - validations[priority=20].ERR_RETAKE_WAITING_PERIOD
        distinguishing_aspect: |
          A different metric on a different endpoint: an instant-versus-instant
          comparison whose inclusivity is worth exactly one second. The gate lands
          on 2026-08-15T00:00:00Z; a session starting one second earlier is
          rejected and a session starting exactly at the gate is accepted. The
          comparison is against starts_at, NOT against the logical clock, so an
          implementation that asks "has the waiting period elapsed yet?" accepts
          nothing at all here, since the clock is still 2026-08-01.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z and NEVER advanced — the gate is compared to starts_at, not to the clock."
            - "Session B1: room T01, proctor-1, 2026-08-01T00:00:00Z-02:00:00Z, seat_capacity 5, OPEN."
            - "Student SP with no transcript; one attempt in B1 scored raw_score 100 at the clock, giving attempt_ordinal 1 and next_eligible_at = scored_at + WAITING_PERIOD_DAYS_TIER_1 (14) = 2026-08-15T00:00:00Z."
            - "Session B2: room T02, proctor-2, 2026-08-14T23:59:59Z-2026-08-15T01:59:59Z, seat_capacity 5, left SCHEDULED — one second BELOW the gate."
            - "Session B3: room T03, proctor-3, 2026-08-15T00:00:00Z-02:00:00Z, seat_capacity 5, left SCHEDULED — EXACTLY at the gate."
            - "Distinct rooms and distinct proctors keep validations priority 17 and 19 out of the way; SP has 2 remaining MATH attempts, so priority 23 does not participate."
          setup_api_calls:
            - call: "POST /test-administrations"
              payload: { room_code: "T01", subject_area: "MATH", proctor_user_id: "proctor-1", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-01T02:00:00Z", seat_capacity: 5 }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { b1: $.data.id }
            - call: "POST /test-administrations/${b1}/status"
              payload: { target_status: "OPEN" }
              as: Proctor
              as_user_id: "proctor-1"
            - call: "POST /students"
              payload: { student_number: "SP", full_name: "Student P", race_ethnicity_code: "AIAN" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { sp: $.data.id }
            - call: "POST /test-attempts"
              payload: { student_id: "${sp}", administration_id: "${b1}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { att1: $.data.id }
            - call: "POST /test-attempts/${att1}/check-in"
              payload: {}
              as: Proctor
              as_user_id: "proctor-1"
            - call: "POST /test-attempts/${att1}/score"
              payload: { raw_score: 100 }
              as: Proctor
              as_user_id: "proctor-1"
              captures: { scored_at: $.data.scored_at, ord1: $.data.attempt_ordinal, gate: $.data.next_eligible_at }
            - call: "POST /test-administrations"
              payload: { room_code: "T02", subject_area: "MATH", proctor_user_id: "proctor-2", starts_at: "2026-08-14T23:59:59Z", ends_at: "2026-08-15T01:59:59Z", seat_capacity: 5 }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { b2: $.data.id, b2_status: $.data.status }
            - call: "POST /test-administrations"
              payload: { room_code: "T03", subject_area: "MATH", proctor_user_id: "proctor-3", starts_at: "2026-08-15T00:00:00Z", ends_at: "2026-08-15T02:00:00Z", seat_capacity: 5 }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { b3: $.data.id, b3_status: $.data.status }
          trigger:
            - call: "POST /test-attempts"
              payload: { student_id: "${sp}", administration_id: "${b2}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { err_one_second_short: $.data.error_id }
            - call: "POST /test-attempts"
              payload: { student_id: "${sp}", administration_id: "${b3}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { att2: $.data.id, att2_state: $.data.state, att2_ord: $.data.attempt_ordinal, att2_subj: $.data.subject_area }
            - call: "GET /test-administrations/${b2}"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { b2_booked: $.data.seats_booked }
            - call: "GET /test-administrations/${b3}"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { b3_booked: $.data.seats_booked, b3_minutes: $.data.duration_minutes }
          assert:
            - "${scored_at} == \"2026-08-01T00:00:00Z\" and ${ord1} == 1 and ${gate} == \"2026-08-15T00:00:00Z\" (setup)"
            - "${b2_status} == \"SCHEDULED\" and ${b3_status} == \"SCHEDULED\" — neither session is disqualified by state, so priority 20 is the only rule in play"
            - "ONE SECOND BELOW: ${err_one_second_short} == \"ERR_RETAKE_WAITING_PERIOD\" with HTTP 422"
            - "EXACTLY AT: ${att2_state} == \"BOOKED\", ${att2_ord} == 2, ${att2_subj} == \"MATH\" — gate == starts_at is ALLOWED"
            - "${b2_booked} == 0 and ${b3_booked} == 1 — the rejected booking left no seat hold on B2"
            - "${b3_minutes} == 120 — duration_minutes is derived from the session window, not supplied"
            - "the clock never leaves 2026-08-01T00:00:00Z, so an implementation comparing the gate to the clock rejects BOTH calls and fails the boundary"

      - name: override_expiry_cascade_fires_at_the_expiry_instant_inclusive
        metric: "PrerequisiteOverride.expires_at against the NEW logical clock value, INCLUSIVE (expires_at <= new clock)"
        endpoint: "POST /_clock/set_current_utc"
        grounds:
          - state_machines.PrerequisiteOverride.ISSUED_to_EXPIRED
          - calculations.prerequisite_satisfaction_closure
          - entities.Registration.fields.prerequisite_status
        distinguishing_aspect: |
          A third metric on a third endpoint: the boundary is evaluated by a clock
          advance rather than by a business call, and it is worth one second on two
          overrides that differ only in expires_at. Advancing to 2026-08-10T00:00:00Z
          must expire the override whose expires_at EQUALS that instant and leave
          the one expiring a second later ISSUED — and the expiry must propagate,
          re-deriving the PENDING registration's prerequisite_status from OVERRIDDEN
          to UNMET while its sibling stays OVERRIDDEN. A CONSUMED override is exempt
          from the sweep entirely, so a redeemed grant survives its own expiry date.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z."
            - "Courses READ-050 (ENGLISH, units 3.0) and MATH-050 (MATH, level_rank 50, units 5.0); ACTIVE BLOCKING PREREQUISITE MATH-050 -> READ-050 with min_grade C."
            - "One ACTIVE PlacementRule TRANSCRIPT_GPA -> MATH-050 (min_hs_gpa 2.0, V1)."
            - "Students SX, SY, SZ: hs_gpa 2.50 VERIFIED, transcript_recorded_at 2025-06-01T00:00:00Z, each with a determination placing MATH-050."
            - "Section sec050 of MATH-050, seat_capacity 5, OPEN."
            - "Override OX for SX with expires_at 2026-08-10T00:00:00Z (AT the boundary); override OY for SY with expires_at 2026-08-10T00:00:01Z (one second ABOVE); override OZ for SZ with expires_at 2026-08-10T00:00:00Z, identical to OX."
            - "SX and SY each hold a PENDING registration presenting their override, so prerequisite_status is OVERRIDDEN on both. SZ CONFIRMS, so OZ is already CONSUMED when the clock moves."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
