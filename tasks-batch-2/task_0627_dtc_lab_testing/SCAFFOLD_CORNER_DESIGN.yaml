              as_user_id: "${pdr}"
              captures: { ldr1: '$.data.id' }
            - call: "POST /catalog/cart-lines"
              payload: { cart_id: "${cartdr}", test_offering_id: "${off_dr}" }
              as: Patient
              as_user_id: "${pdr}"
              captures: { ldr2: '$.data.id' }
          trigger:
            - call: "DELETE /catalog/cart-lines/${ldr2}"
