  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: interest_cap_exact_boundary
        grounds:
          - calculations.interest_match_accrual
          - entities.InterestMatchConfig.fields.monthly_cap_cents
          - entities.InterestAccrual.fields.matched_cents
        distinguishing_aspect: |
          Numeric-threshold metric on the accrue endpoint: raw interest is 986 cents. With
          monthly_cap_cents=986 the match is uncapped (986); with monthly_cap_cents=985 it clamps to 985.
          Tests the cap boundary (cap == raw passes through; cap == raw-1 clamps).
        test_recipe:
          setup:
            - "Child SAVE jar 120000; InterestMatchConfig ENABLED 1000 bps WHOLE_PERIOD, monthly_cap_cents=985."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /families"
              payload: { family_name: "Lambda" }
              as: Parent
              as_user_id: "parent-11"
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/deposit"
              payload: { amount_cents: 200000 }
              as: Parent
              as_user_id: "parent-11"
            - call: "POST /families/${fam_id}/child-accounts"
              payload: { display_name: "Lia", birthdate: "2014-01-01" }
              as: Parent
              as_user_id: "parent-11"
              captures: { child_id: $.data.id }
            - call: "GET /child-accounts/${child_id}/jars"
              payload: { jar_type: "SAVE" }
              as: Parent
              as_user_id: "parent-11"
              captures: { save_jar_id: "$.data[0].id" }
            - call: "POST /child-accounts/${child_id}/fund-jar"
              payload: { jar_type: "SAVE", amount_cents: 120000 }
              as: Parent
              as_user_id: "parent-11"
            - call: "GET /child-accounts/${child_id}/interest-match-config"
              payload: {}
              as: Parent
              as_user_id: "parent-11"
              captures: { cfg_id: "$.data[0].id" }
            - call: "PUT /interest-match-configs/${cfg_id}"
              payload: { annual_rate_bps: 1000, monthly_cap_cents: 985, accrual_method: "WHOLE_PERIOD" }
              as: Parent
              as_user_id: "parent-11"
          trigger:
            - call: "POST /interest-match-configs/${cfg_id}/accrue"
              payload: { period_days: 30 }
              as: Parent
              as_user_id: "parent-11"
              captures: { accr_id: $.data.id }
          assert:
            - "InterestAccrual.${accr_id}.matched_cents == 985"
            - "Jar.${save_jar_id}.balance_cents == 120985"

      - name: control_limit_cap_exact_equality_passes
        grounds:
          - calculations.card_control_limit_check
          - validations[priority=16]
          - entities.Transaction.fields.amount_cents
        distinguishing_aspect: |
          Collection/cumulative metric on the authorizations endpoint (different metric and endpoint than the
          interest cap): with a 5000 LIMIT and 3000 already PENDING, an authorization of exactly 2000 makes the
          cumulative 5000 == cap and SUCCEEDS (boundary uses '>' not '>='); a 2001 authorization would be rejected.
        test_recipe:
          setup:
            - "Child SPEND jar 20000; active LIMIT control on STORE 'GAMESTORE' capped 5000; one PENDING 3000 txn at that store."
          setup_api_calls:
            - call: "POST /families"
              payload: { family_name: "Mu" }
              as: Parent
              as_user_id: "parent-12"
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/deposit"
              payload: { amount_cents: 50000 }
              as: Parent
              as_user_id: "parent-12"
            - call: "POST /families/${fam_id}/child-accounts"
              payload: { display_name: "Moe", birthdate: "2015-01-01" }
              as: Parent
              as_user_id: "parent-12"
              captures: { child_id: $.data.id }
            - call: "GET /child-accounts/${child_id}/debit-cards"
              payload: {}
              as: Parent
              as_user_id: "parent-12"
              captures: { card_id: "$.data[0].id", card_v0: "$.data[0].version" }
            - call: "POST /debit-cards/${card_id}/controls"
              payload: { control_kind: "STORE", match_value: "GAMESTORE", rule: "LIMIT", per_period_cap_cents: 5000, expected_debit_card_version: "${card_v0}" }
              as: Parent
              as_user_id: "parent-12"
            - call: "POST /child-accounts/${child_id}/fund-jar"
              payload: { jar_type: "SPEND", amount_cents: 20000 }
              as: Parent
              as_user_id: "parent-12"
            - call: "POST /debit-cards/${card_id}/authorizations"
              payload: { merchant_id: "GAMESTORE", category: "GAMING", amount_cents: 3000 }
              as: Child
              as_user_id: "${child_id}"
          trigger:
            - call: "POST /debit-cards/${card_id}/authorizations"
              payload: { merchant_id: "GAMESTORE", category: "GAMING", amount_cents: 2000 }
              as: Child
              as_user_id: "${child_id}"
              captures: { txn2_id: $.data.id }
          assert:
            - "Transaction.${txn2_id}.status == PENDING"
            - "DebitCard.${card_id}.held_cents == 5000"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: chore_approve_requires_family_active
        grounds:
          - state_machines.ChoreCompletion.PENDING_REVIEW_to_PAID
          - entities.Family.fields.status
          - validations[priority=12]
        distinguishing_aspect: |
          Entity pair ChoreCompletion -> Family: a ChoreCompletion may only transition PENDING_REVIEW -> PAID
          when its child's Family.status == ACTIVE. With the family SUSPENDED (funding sufficient) the
          approve is rejected ERR_FAMILY_SUSPENDED; after reactivate it succeeds and pays.
        test_recipe:
          setup:
            - "Family funded 10000 but SUSPENDED; child has a PENDING_REVIEW completion worth 1500."
          setup_api_calls:
            - call: "POST /families"
              payload: { family_name: "Nu" }
              as: Parent
              as_user_id: "parent-13"
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/deposit"
              payload: { amount_cents: 10000 }
              as: Parent
              as_user_id: "parent-13"
            - call: "POST /families/${fam_id}/child-accounts"
              payload: { display_name: "Ned", birthdate: "2015-01-01" }
              as: Parent
              as_user_id: "parent-13"
              captures: { child_id: $.data.id }
            - call: "POST /child-accounts/${child_id}/chores"
              payload: { title: "Sweep", reward_cents: 1500 }
              as: Parent
              as_user_id: "parent-13"
              captures: { chore_id: $.data.id }
            - call: "POST /chores/${chore_id}/submit"
              payload: {}
              as: Child
              as_user_id: "${child_id}"
              captures: { comp_id: $.data.id }
            - call: "POST /families/${fam_id}/suspend"
              payload: {}
              as: Parent
              as_user_id: "parent-13"
          trigger:
            - call: "POST /chore-completions/${comp_id}/approve"
              payload: {}
              as: Parent
              as_user_id: "parent-13"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FAMILY_SUSPENDED"
            - "ChoreCompletion.${comp_id}.status == PENDING_REVIEW"
            - "Family.${fam_id}.funding_balance_cents == 10000"

      - name: authorization_requires_card_unlocked
        grounds:
          - state_machines.Transaction.none_to_PENDING
          - entities.DebitCard.fields.lock_state
          - validations[priority=14]
        distinguishing_aspect: |
          Entity pair Transaction -> DebitCard (different pair than ChoreCompletion->Family): an
          authorization (Transaction creation) is blocked when DebitCard.lock_state == LOCKED even with a
          fully funded jar; returns ERR_CARD_LOCKED and creates no PENDING transaction.
        test_recipe:
          setup:
            - "Child SPEND jar holds 8000 (available 8000); card LOCKED."
          setup_api_calls:
            - call: "POST /families"
              payload: { family_name: "Xi" }
              as: Parent
              as_user_id: "parent-14"
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/deposit"
              payload: { amount_cents: 20000 }
              as: Parent
              as_user_id: "parent-14"
            - call: "POST /families/${fam_id}/child-accounts"
              payload: { display_name: "Oli", birthdate: "2015-01-01" }
              as: Parent
              as_user_id: "parent-14"
              captures: { child_id: $.data.id }
            - call: "GET /child-accounts/${child_id}/debit-cards"
              payload: {}
              as: Parent
              as_user_id: "parent-14"
              captures: { card_id: "$.data[0].id", card_v0: "$.data[0].version" }
            - call: "POST /debit-cards/${card_id}/lock"
              payload: { expected_debit_card_version: "${card_v0}" }
              as: Parent
              as_user_id: "parent-14"
            - call: "POST /child-accounts/${child_id}/fund-jar"
              payload: { jar_type: "SPEND", amount_cents: 8000 }
              as: Parent
              as_user_id: "parent-14"
          trigger:
            - call: "POST /debit-cards/${card_id}/authorizations"
              payload: { merchant_id: "M2", category: "FOOD", amount_cents: 3000 }
              as: Child
              as_user_id: "${child_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CARD_LOCKED"
            - "DebitCard.${card_id}.held_cents == 0"
            - "DebitCard.${card_id}.available_cents == 8000"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: interest_accrual_half_open_back_cover_rejected
        grounds:
          - calculations.temporal_window_overlap
          - validations[priority=19]
          - entities.InterestAccrual.fields.accrued_at
          - entities.InterestAccrual.fields.period_start_at
        distinguishing_aspect: |
          Half-open interval semantics on the InterestMatchConfig resource: a first accrual at
          2026-02-01 covers (2026-01-02, 2026-02-01]. A second accrual at 2026-02-20 with period_days=30
          would cover from 2026-01-21, back-dating into the prior window (2026-01-21 < 2026-02-01) and is
          rejected ERR_ACCRUAL_PERIOD_OVERLAP. Adjacency (start == prior end) would have passed.
        test_recipe:
          setup:
            - "Child SAVE jar 120000; config ENABLED 1000 bps WHOLE_PERIOD cap 0; one prior accrual posted at 2026-02-01 with period_days=30."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /families"
              payload: { family_name: "Omicron" }
              as: Parent
              as_user_id: "parent-15"
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/deposit"
              payload: { amount_cents: 200000 }
              as: Parent
              as_user_id: "parent-15"
            - call: "POST /families/${fam_id}/child-accounts"
              payload: { display_name: "Pam", birthdate: "2014-01-01" }
              as: Parent
              as_user_id: "parent-15"
              captures: { child_id: $.data.id }
            - call: "POST /child-accounts/${child_id}/fund-jar"
              payload: { jar_type: "SAVE", amount_cents: 120000 }
              as: Parent
              as_user_id: "parent-15"
            - call: "GET /child-accounts/${child_id}/interest-match-config"
              payload: {}
              as: Parent
              as_user_id: "parent-15"
              captures: { cfg_id: "$.data[0].id" }
            - call: "PUT /interest-match-configs/${cfg_id}"
              payload: { annual_rate_bps: 1000, monthly_cap_cents: 0, accrual_method: "WHOLE_PERIOD" }
              as: Parent
              as_user_id: "parent-15"
            - call: "POST /interest-match-configs/${cfg_id}/accrue"
              payload: { period_days: 30 }
              as: Parent
              as_user_id: "parent-15"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-20T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /interest-match-configs/${cfg_id}/accrue"
              payload: { period_days: 30 }
              as: Parent
              as_user_id: "parent-15"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ACCRUAL_PERIOD_OVERLAP"
            - "HTTP status == 409"

      - name: allowance_schedule_closed_buffer_conflict_rejected
        grounds:
          - calculations.temporal_window_overlap
          - validations[priority=18]
          - entities.AllowanceSchedule.fields.next_run_at
          - entities.AllowanceSchedule.fields.payout_jar_type
        distinguishing_aspect: |
          Closed-buffer interval semantics on the ChildAccount resource (different geometry and resource than
          the accrual half-open rule): one ACTIVE SPEND schedule has next_run_at 2026-03-10. A second SPEND
          schedule with next_run_at 2026-03-15 is within the 7-day MIN_SCHEDULE_GAP_DAYS buffer (gap 5 < 7)
          and is rejected ERR_SCHEDULE_WINDOW_CONFLICT; a 2026-03-17 schedule (gap 7) would pass.
        test_recipe:
          setup:
            - "Child has one ACTIVE SPEND allowance schedule with next_run_at 2026-03-10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /families"
              payload: { family_name: "Pi" }
              as: Parent
              as_user_id: "parent-16"
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/child-accounts"
              payload: { display_name: "Rae", birthdate: "2015-01-01" }
              as: Parent
              as_user_id: "parent-16"
              captures: { child_id: $.data.id }
            - call: "POST /child-accounts/${child_id}/allowance-schedules"
              payload: { amount_cents: 1000, payout_jar_type: "SPEND", cadence_days: 30, next_run_at: "2026-03-10T00:00:00Z" }
              as: Parent
              as_user_id: "parent-16"
          trigger:
            - call: "POST /child-accounts/${child_id}/allowance-schedules"
              payload: { amount_cents: 500, payout_jar_type: "SPEND", cadence_days: 30, next_run_at: "2026-03-15T00:00:00Z" }
              as: Parent
              as_user_id: "parent-16"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SCHEDULE_WINDOW_CONFLICT"
            - "HTTP status == 409"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: reverse_restores_spend_jar_and_held
        grounds:
          - calculations.reversal_conservation
          - state_machines.Transaction.PENDING_to_REVERSED
          - entities.Jar.fields.balance_cents
          - entities.DebitCard.fields.held_cents
        distinguishing_aspect: |
          Conserved quantity #1 — (SPEND Jar.balance_cents, DebitCard.held_cents): authorizing 3000 then
          reversing it must leave SPEND jar at the pre-authorization 5000 and held_cents back at 0; the
          forward+compensation pair leaves both quantities exactly unchanged (no drift).
        test_recipe:
          setup:
            - "Child SPEND jar 5000; one PENDING authorization for 3000 (held 3000)."
          setup_api_calls:
            - call: "POST /families"
              payload: { family_name: "Rho" }
              as: Parent
              as_user_id: "parent-17"
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/deposit"
              payload: { amount_cents: 20000 }
              as: Parent
              as_user_id: "parent-17"
            - call: "POST /families/${fam_id}/child-accounts"
              payload: { display_name: "Sue", birthdate: "2015-01-01" }
              as: Parent
              as_user_id: "parent-17"
              captures: { child_id: $.data.id }
            - call: "GET /child-accounts/${child_id}/debit-cards"
              payload: {}
              as: Parent
              as_user_id: "parent-17"
              captures: { card_id: "$.data[0].id" }
            - call: "GET /child-accounts/${child_id}/jars"
              payload: { jar_type: "SPEND" }
              as: Parent
              as_user_id: "parent-17"
              captures: { spend_jar_id: "$.data[0].id" }
            - call: "POST /child-accounts/${child_id}/fund-jar"
              payload: { jar_type: "SPEND", amount_cents: 5000 }
              as: Parent
              as_user_id: "parent-17"
            - call: "POST /debit-cards/${card_id}/authorizations"
              payload: { merchant_id: "M5", category: "FOOD", amount_cents: 3000 }
              as: Child
              as_user_id: "${child_id}"
              captures: { txn_id: $.data.id }
          trigger:
            - call: "POST /transactions/${txn_id}/reverse"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Transaction.${txn_id}.status == REVERSED"
            - "Jar.${spend_jar_id}.balance_cents == 5000"
            - "DebitCard.${card_id}.held_cents == 0"
            - "DebitCard.${card_id}.available_cents == 5000"

      - name: allowance_run_conserves_family_wallet_plus_jars
        grounds:
          - calculations.allowance_funding_conservation
          - state_machines.AllowanceSchedule.ACTIVE_to_ACTIVE
          - entities.Family.fields.funding_balance_cents
          - entities.Jar.fields.balance_cents
        distinguishing_aspect: |
          Conserved quantity #2 — (Family.funding_balance_cents + sum of child jar balances): an EXECUTED
          allowance run moves 2500 from funding to the SPEND jar. funding 10000 -> 7500, SPEND jar 0 -> 2500;
          the sum (funding + jars) is 10000 before and 10000 after — money is moved, never created.
        test_recipe:
          setup:
            - "Family funded 10000; child with one ACTIVE SPEND schedule amount 2500 due now (next_run_at 2026-03-01)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /families"
              payload: { family_name: "Sigma" }
              as: Parent
              as_user_id: "parent-18"
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/deposit"
              payload: { amount_cents: 10000 }
              as: Parent
              as_user_id: "parent-18"
            - call: "POST /families/${fam_id}/child-accounts"
              payload: { display_name: "Tom", birthdate: "2015-01-01" }
              as: Parent
              as_user_id: "parent-18"
              captures: { child_id: $.data.id }
            - call: "GET /child-accounts/${child_id}/jars"
              payload: { jar_type: "SPEND" }
              as: Parent
              as_user_id: "parent-18"
              captures: { spend_jar_id: "$.data[0].id" }
            - call: "POST /child-accounts/${child_id}/allowance-schedules"
              payload: { amount_cents: 2500, payout_jar_type: "SPEND", cadence_days: 7, next_run_at: "2026-03-01T00:00:00Z" }
              as: Parent
              as_user_id: "parent-18"
          trigger:
            - call: "POST /_scheduler/run-due-allowances"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Family.${fam_id}.funding_balance_cents == 7500"
            - "Jar.${spend_jar_id}.balance_cents == 2500"
