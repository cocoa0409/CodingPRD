          - roles.TransporterAgent.shared_operations
          - roles.TSDFAgent.shared_operations
        distinguishing_aspect: "Entity-backed agent roles share read access: a TransporterAgent can GET manifests (200) despite holding no write permission outside sign-transporter."
        test_recipe:
          setup: ["Site exists"]
          setup_api_calls:
            - { call: "POST /hazwaste/generator-sites", payload: { name: "Site A", epa_id_number: "EPA-SITE-A" }, as: EHSManager, captures: { site_id: "$.data.id" } }
          trigger:
            - { call: "GET /hazwaste/manifests", as: TransporterAgent, as_user_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2" }
            - { call: "GET /hazwaste/generator-sites/${site_id}", as: TSDFAgent, as_user_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2" }
          assert:
            - "Both reads return 200 (manifests list total_count == 0; site read returns the site)"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: occ_stream_characterize_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[stream-characterize-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Characterize is a supersede guarded by WasteStream.version: replaying with the pre-supersede version fails 412; the fresh version succeeds."
        test_recipe:
          setup: ["Site with a DRAFT stream (version 1)"]
          setup_api_calls:
            - { call: "POST /hazwaste/generator-sites", payload: { name: "Site A", epa_id_number: "EPA-SITE-A" }, as: EHSManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-streams", payload: { site_id: "${site_id}", name: "spent solvent", waste_codes: ["D001"], physical_state: "LIQUID" }, as: WasteCoordinator, captures: { stream_id: "$.data.id", stream_v1: "$.data.version" } }
          trigger:
            - { call: "POST /hazwaste/waste-streams/${stream_id}/characterize", payload: { is_hazardous: true, waste_codes: ["D001"], ldr_treatment_standard: "TLV-01", flash_point_c: 21.5, expected_waste_stream_version: "${stream_v1}" }, as: WasteCoordinator }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/characterize", payload: { is_hazardous: true, waste_codes: ["D001", "F003"], ldr_treatment_standard: "TLV-09", flash_point_c: 25.0, expected_waste_stream_version: "${stream_v1}" }, as: WasteCoordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "First characterize succeeds (version 1 -> 2, status CHARACTERIZED)"
            - "Second characterize replaying the stale version: err == ERR_STALE_VERSION and HTTP status == 412"
            - "WasteStream.${stream_id}.characterization_version == 1 (the rejected write changed nothing)"

      - name: occ_partner_update_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[partner-update-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "PUT on WastePartner is OCC-guarded: after a successful update advances the version, replaying the stale expected version fails 412."
        test_recipe:
          setup: ["PENDING TSDF registered (version 1)"]
          setup_api_calls:
            - { call: "POST /hazwaste/waste-partners", payload: { partner_type: "TSDF", name: "DispCo", epa_id_number: "EPA-TS-1", permitted_waste_codes: ["D001"] }, as: ComplianceAuditor, as_user_id: "aud-1", captures: { tsdf_id: "$.data.id", tsdf_v1: "$.data.version" } }
          trigger:
            - { call: "PUT /hazwaste/waste-partners/${tsdf_id}", payload: { expected_waste_partner_version: "${tsdf_v1}", permitted_waste_codes: ["D001", "F003"] }, as: ComplianceAuditor, as_user_id: "aud-1" }
            - { call: "PUT /hazwaste/waste-partners/${tsdf_id}", payload: { expected_waste_partner_version: "${tsdf_v1}", permitted_waste_codes: ["D002"] }, as: ComplianceAuditor, as_user_id: "aud-1", captures: { err: "$.data.error_id" } }
          assert:
            - "First PUT succeeds: version 1 -> 2, permitted_waste_codes == [D001, F003]"
            - "Second PUT with the stale version: err == ERR_STALE_VERSION (412); permitted_waste_codes remain [D001, F003]"

      - name: cascading_side_effects_corner
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Container.null_to_IN_CENTRAL_ACCUMULATION
        excluded_because:
          difficulty_instance: container_create_category_flip_report_recompute
          rationale: "The 3-hop create -> month total -> category -> report-fee chain is asserted end-to-end in §1.8."

      - name: ops_run_checkpoint_corner
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.manifest_return_window
          - calculations.monthly_generated_kg
        excluded_because:
          difficulty_instance: clock_sweep_exception_blocks_new_manifest
          rationale: "Clock-sweep exception transition and month rollover are asserted by the §1.8 sweep cascade and the month_rollover_resets_totals corner."

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: writes_visible_immediately
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - entities.Container
        distinguishing_aspect: "Immediate consistency: the create response and a following GET expose the same computed fields (deadline, flags) with no reconciliation lag."
        test_recipe:
          setup: ["Site with ACTIVE stream and central area"]
          setup_api_calls:
            - { call: "POST /hazwaste/generator-sites", payload: { name: "Site A", epa_id_number: "EPA-SITE-A" }, as: EHSManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-streams", payload: { site_id: "${site_id}", name: "spent solvent", waste_codes: ["D001"], physical_state: "LIQUID" }, as: WasteCoordinator, captures: { stream_id: "$.data.id", stream_v: "$.data.version" } }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/characterize", payload: { is_hazardous: true, waste_codes: ["D001"], ldr_treatment_standard: "TLV-01", flash_point_c: 21.5, expected_waste_stream_version: "${stream_v}" }, as: WasteCoordinator }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/activate", as: EHSManager }
            - { call: "POST /hazwaste/accumulation-areas", payload: { site_id: "${site_id}", name: "Central A", area_type: "CENTRAL_90DAY" }, as: WasteCoordinator, captures: { area_id: "$.data.id" } }
          trigger:
            - { call: "POST /hazwaste/containers", payload: { waste_stream_id: "${stream_id}", accumulation_area_id: "${area_id}", quantity_gallons: 10, quantity_kg: 50.0 }, as: WasteCoordinator, captures: { cont_id: "$.data.id", dl: "$.data.accumulation_deadline_at" } }
            - { call: "GET /hazwaste/containers/${cont_id}", as: EHSManager }
          assert:
            - "Create response already carries accumulation_deadline_at == 2027-01-28T00:00:00Z (dl capture)"
            - "Immediate GET returns identical deadline_days == 180 and accumulation_deadline_at == dl"
            - "GET /hazwaste/generator-sites/${site_id} already shows current_month_generated_kg == 50.0"
