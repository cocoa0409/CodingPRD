            - call: "POST /enrollments/${enr_id}/care-team/activate"
              payload: {}
              as: CareCoordinator
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: EngagementSpecialist
            - call: "POST /urgent-episodes"
              payload: { enrollment_id: "${enr_id}", trigger_source: "MEMBER_CALL" }
              as: CareCoordinator
              captures: { ep_a: $.data.id, ep_a_deadline: $.data.sla_deadline }
            # Set clock to exactly sla_deadline (2026-09-02T00:00:00Z)
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /urgent-episodes/${ep_a}/dispatch"
              payload: {}
              as: CareCoordinator
              captures: { ep_a_status: $.data.status }
            # Now create a fresh episode EP_B and dispatch it 1s past its sla_deadline
            - call: "POST /urgent-episodes"
              payload: { enrollment_id: "${enr_id}", trigger_source: "PCP_ALERT" }
              as: CareCoordinator
              captures: { ep_b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-03T00:00:01Z" }
              as: PlatformAdmin
            - call: "POST /_clock/advance_hours"
              payload: { by_hours: 1 }
              as: PlatformAdmin
            - call: "POST /urgent-episodes/${ep_b}/dispatch"
              payload: {}
              as: CareCoordinator
              captures: { error_id_b: $.data.error_id }
          assert:
            - "EP_A dispatch at exactly sla_deadline succeeds — status == DISPATCHED"
            - "EP_B dispatch 1s past sla_deadline returns 409 and error_id_b == ERR_SLA_ALREADY_LAPSED"
            - "the SLA interval uses CLOSED upper bound; the visit overlap uses HALF-OPEN — different semantics on different resources"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across DIFFERENT conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: visit_cancel_then_reschedule_conserves_active_daily_visit_count
        grounds:
          - state_machines.Visit.transitions.SCHEDULED_to_CANCELLED
          - state_machines.Visit.transitions.CANCELLED_to_SCHEDULED
          - entities.Clinician.fields.active_daily_visit_count
        distinguishing_aspect: |
          Conserved quantity: Clinician.active_daily_visit_count. A cancel
          paired with its compensating reschedule MUST leave the count
          unchanged from before the cancel. Sequence: SCHEDULED (count=1)
          → cancel (count=0) → reschedule (count=1). End state MUST equal
          the pre-cancel state. Drift in this conserved quantity is the
          failure mode.
        test_recipe:
          setup:
            - "Standard ACTIVE enrollment; clinician NP1 (max 10)."
            - "One SCHEDULED visit V; NP1.active_daily_visit_count == 1."
          setup_api_calls:
            - call: "POST /care-programs"
              payload: { program_code: "LMRK-TX", display_name: "Landmark TX", service_geography_zips: ["75201"], urgent_response_sla_hours: 24 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /payer-contracts"
              payload: { care_program_id: "${prog_id}", payer_name: "PlanA", contract_effective_date: "2026-01-01T00:00:00Z", contract_expiration_date: "2027-12-31T23:59:59Z", payment_model: "CAPITATED", pmpm_rate_cents: 500000, quality_withhold_pct: 0.10, min_performance_threshold: 0.80 }
              as: ContractAdministrator
              captures: { contract_id: $.data.id }
            - call: "POST /pcp-providers"
              payload: { care_program_id: "${prog_id}", npi: "1234567890", full_name: "Dr. Patel", practice_name: "DFM", notification_opt_in: true }
              as: PlatformAdmin
              captures: { pcp_id: $.data.id }
            - call: "POST /clinicians"
              payload: { care_program_id: "${prog_id}", full_name: "Nancy NP", discipline: "NP", home_zip: "75201", max_daily_visits: 10, urgent_response_qualified: false }
              as: PlatformAdmin
              captures: { np_id: $.data.id }
            - call: "POST /members"
              payload: { care_program_id: "${prog_id}", payer_contract_id: "${contract_id}", member_external_id: "M-001", full_name: "Member X", date_of_birth: "1950-01-01T00:00:00Z", address_zip: "75201", pcp_provider_id: "${pcp_id}", chronic_condition_codes: ["CHF"], prior_ed_visits_12mo: 1, prior_inpatient_admits_12mo: 1 }
              as: PlatformAdmin
              captures: { member_id: $.data.id, member_v: $.data.version }
            - call: "POST /members/${member_id}/enrollments"
              payload: { outreach_channel: "PHONE", expected_member_version: "${member_v}" }
              as: EngagementSpecialist
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/begin-outreach"
              payload: {}
              as: EngagementSpecialist
            - call: "POST /enrollments/${enr_id}/record-consent"
              payload: { consent_document_id: "DOC-1" }
              as: EngagementSpecialist
            - call: "PUT /enrollments/${enr_id}/care-team"
              payload: { primary_np_id: "${np_id}" }
              as: CareCoordinator
            - call: "POST /enrollments/${enr_id}/care-team/activate"
              payload: {}
              as: CareCoordinator
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: EngagementSpecialist
            - call: "POST /visits"
              payload: { enrollment_id: "${enr_id}", visit_type: "ROUTINE_FOLLOWUP", scheduled_start: "2026-09-02T09:00:00Z", scheduled_end: "2026-09-02T10:00:00Z" }
              as: CareCoordinator
              captures: { v_id: $.data.id, v_clin: $.data.clinician_id }
            - call: "GET /clinicians/${v_clin}"
              payload: {}
              as: CareCoordinator
              captures: { count_pre_cancel: $.data.active_daily_visit_count }
          trigger:
            - call: "POST /visits/${v_id}/cancel"
              payload: { cancellation_reason: "MEMBER_REQUEST" }
              as: CareCoordinator
              captures: { v_after_cancel: $.data.version }
            - call: "GET /clinicians/${v_clin}"
              payload: {}
              as: CareCoordinator
              captures: { count_post_cancel: $.data.active_daily_visit_count }
            - call: "POST /visits/${v_id}/reschedule"
              payload: { scheduled_start: "2026-09-03T09:00:00Z", scheduled_end: "2026-09-03T10:00:00Z", expected_visit_version: "${v_after_cancel}" }
              as: CareCoordinator
            - call: "GET /clinicians/${v_clin}"
              payload: {}
              as: CareCoordinator
              captures: { count_post_reschedule: $.data.active_daily_visit_count }
          assert:
            - "Clinician count before cancel == 1"
            - "Clinician count after cancel == 0 (forward action subtracts)"
            - "Clinician count after reschedule == 1 (compensating action restores)"
            - "count_post_reschedule == count_pre_cancel (CONSERVED QUANTITY: no drift)"

      - name: performance_measurement_visit_counters_conserve_under_cancel_reschedule_cycle
        grounds:
          - state_machines.Visit.transitions.SCHEDULED_to_CANCELLED
          - state_machines.Visit.transitions.CANCELLED_to_SCHEDULED
          - entities.PerformanceMeasurement.fields.visits_cancelled
          - entities.PerformanceMeasurement.fields.visits_completed
          - calculations.composite_performance_score
        distinguishing_aspect: |
          Conserved quantity: the SUM of visit lifecycle counters
          (visits_completed + visits_no_show + visits_cancelled) on a
          PerformanceMeasurement row MUST equal the number of distinct
          Visit rows in terminal states for that member+period. A cancel
          (+1 cancelled) followed by reschedule (-1 cancelled) conserves the
          total: the visit moves OUT of cancelled, not into completed. Drift
          would show as visits_cancelled == 1 after a successful reschedule.
          Distinct conserved quantity from the clinician count above.
        test_recipe:
          setup:
            - "Standard ACTIVE enrollment; one SCHEDULED visit V."
          setup_api_calls:
            - call: "POST /care-programs"
              payload: { program_code: "LMRK-TX", display_name: "Landmark TX", service_geography_zips: ["75201"], urgent_response_sla_hours: 24 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /payer-contracts"
              payload: { care_program_id: "${prog_id}", payer_name: "PlanA", contract_effective_date: "2026-01-01T00:00:00Z", contract_expiration_date: "2027-12-31T23:59:59Z", payment_model: "CAPITATED", pmpm_rate_cents: 500000, quality_withhold_pct: 0.10, min_performance_threshold: 0.80 }
              as: ContractAdministrator
              captures: { contract_id: $.data.id }
            - call: "POST /pcp-providers"
              payload: { care_program_id: "${prog_id}", npi: "1234567890", full_name: "Dr. Patel", practice_name: "DFM", notification_opt_in: true }
              as: PlatformAdmin
              captures: { pcp_id: $.data.id }
            - call: "POST /clinicians"
              payload: { care_program_id: "${prog_id}", full_name: "Nancy NP", discipline: "NP", home_zip: "75201", max_daily_visits: 10, urgent_response_qualified: false }
              as: PlatformAdmin
              captures: { np_id: $.data.id }
            - call: "POST /members"
              payload: { care_program_id: "${prog_id}", payer_contract_id: "${contract_id}", member_external_id: "M-001", full_name: "Member X", date_of_birth: "1950-01-01T00:00:00Z", address_zip: "75201", pcp_provider_id: "${pcp_id}", chronic_condition_codes: ["CHF"], prior_ed_visits_12mo: 1, prior_inpatient_admits_12mo: 1 }
              as: PlatformAdmin
              captures: { member_id: $.data.id, member_v: $.data.version }
            - call: "POST /members/${member_id}/enrollments"
              payload: { outreach_channel: "PHONE", expected_member_version: "${member_v}" }
              as: EngagementSpecialist
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/begin-outreach"
              payload: {}
              as: EngagementSpecialist
            - call: "POST /enrollments/${enr_id}/record-consent"
              payload: { consent_document_id: "DOC-1" }
              as: EngagementSpecialist
            - call: "PUT /enrollments/${enr_id}/care-team"
              payload: { primary_np_id: "${np_id}" }
              as: CareCoordinator
            - call: "POST /enrollments/${enr_id}/care-team/activate"
              payload: {}
              as: CareCoordinator
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: EngagementSpecialist
            - call: "POST /visits"
              payload: { enrollment_id: "${enr_id}", visit_type: "ROUTINE_FOLLOWUP", scheduled_start: "2026-09-02T09:00:00Z", scheduled_end: "2026-09-02T10:00:00Z" }
              as: CareCoordinator
              captures: { v_id: $.data.id, v_clin: $.data.clinician_id }
          trigger:
            - call: "POST /visits/${v_id}/cancel"
              payload: { cancellation_reason: "MEMBER_REQUEST" }
              as: CareCoordinator
              captures: { v_after_cancel: $.data.version }
            - call: "GET /performance-measurements"
              payload: { member_id: "${member_id}", period_index: 0 }
              as: PerformanceAnalyst
              captures: { cx_after_cancel: "$data[0].visits_cancelled" }
            - call: "POST /visits/${v_id}/reschedule"
              payload: { scheduled_start: "2026-09-03T09:00:00Z", scheduled_end: "2026-09-03T10:00:00Z", expected_visit_version: "${v_after_cancel}" }
              as: CareCoordinator
            - call: "GET /performance-measurements"
              payload: { member_id: "${member_id}", period_index: 0 }
              as: PerformanceAnalyst
              captures: { cx_after_reschedule: "$data[0].visits_cancelled", comp_after_reschedule: "$data[0].visits_completed", ns_after_reschedule: "$data[0].visits_no_show" }
          assert:
            - "after cancel: visits_cancelled == 1 (forward action)"
            - "after reschedule: visits_cancelled == 0 (compensating action restores)"
            - "visits_completed == 0 and visits_no_show == 0 across the cycle"
            - "the SUM visits_completed + visits_no_show + visits_cancelled is 0 at the end — the visit returned to SCHEDULED and is not yet terminal"
            - "no drift: cx_after_reschedule == 0 (not 1, which would indicate the cancel counter never unwound)"
