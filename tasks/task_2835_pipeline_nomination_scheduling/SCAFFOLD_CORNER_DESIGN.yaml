            - "BatchTicket.${bt3_id}.sequence_position == 3 and BatchTicket.${bt3_id}.injection_window_start == 2026-09-03T00:00:00.000Z"

      - name: linefill_adjustment_credits_the_segment_not_terminal_inventory
        claim_type: Cross-reference link
        grounds:
          - endpoints[POST /pipeline/terminals/{id}/inventory-adjustments]
          - entities.PipelineSegment.fields.linefill_bbl
          - entities.Terminal.fields.inventory_bbl
        distinguishing_aspect: |
          A LINEFILL adjustment is booked against the referenced segment, not the terminal's own tank:
          the segment's linefill_bbl rises to 20000 while the terminal's inventory_bbl stays 0, and the
          terminal's version still increments to 2 so the next adjustment must quote the new value. A
          following INVENTORY adjustment then proves the other side: inventory_bbl becomes 100000 with
          linefill_bbl unchanged.
        test_recipe:
          setup:
            - "Terminal HOU is at version 1 with zero inventory and segment HOU-NAS starts with linefill_bbl 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TerminalOperator
            - call: "POST /pipeline/terminals"
              payload: { terminal_code: "HOU", name: "Houston Origin", role_kind: "ORIGIN", shell_capacity_bbl: 500000, min_operating_inventory_bbl: 10000, injection_bays: 2 }
              as: TariffAdministrator
              captures: { org_id: "$.data.id", org_v0: "$.data.version" }
            - call: "POST /pipeline/terminals"
              payload: { terminal_code: "NAS", name: "Nashville Delivery", role_kind: "DESTINATION", shell_capacity_bbl: 400000, min_operating_inventory_bbl: 5000 }
              as: TariffAdministrator
              captures: { dst_id: "$.data.id" }
            - call: "POST /pipeline/product-grades"
              payload: { grade_code: "ULSD", name: "Ultra Low Sulfur Diesel", sequence_rank: 3, max_sulfur_ppm: 15, max_rvp_psi: 12 }
              as: TariffAdministrator
              captures: { ulsd_id: "$.data.id" }
            - call: "POST /pipeline/segments"
              payload: { segment_code: "HOU-NAS", origin_terminal_id: "${org_id}", destination_terminal_id: "${dst_id}", linefill_grade_id: "${ulsd_id}", capacity_bbl_per_cycle: 101000, transmix_reserve_bbl: 1000, transmix_cut_bbl: 250, min_tender_bbl: 6000, linefill_requirement_bbl: 20000, proration_policy: "HISTORY_WEIGHTED" }
              as: TariffAdministrator
              captures: { seg_id: "$.data.id" }
          trigger:
            - call: "POST /pipeline/terminals/${org_id}/inventory-adjustments"
              payload: { expected_terminal_version: "${org_v0}", adjustment_kind: "LINEFILL", adjustment_bbl: 20000, reason: "initial linefill of HOU-NAS", segment_id: "${seg_id}" }
              as: TerminalOperator
              captures: { org_v1: "$.data.version", inv: "$.data.inventory_bbl" }
            - call: "POST /pipeline/terminals/${org_id}/inventory-adjustments"
              payload: { expected_terminal_version: "${org_v1}", adjustment_kind: "INVENTORY", adjustment_bbl: 100000, reason: "refinery receipt", segment_id: "${seg_id}" }
              as: TerminalOperator
              captures: { org_v2: "$.data.version" }
          assert:
            - "HTTP 200 on both adjustments"
            - "after the LINEFILL adjustment: PipelineSegment.${seg_id}.linefill_bbl == 20000, Terminal.${org_id}.inventory_bbl == 0, Terminal.${org_id}.version == 2"
            - "after the INVENTORY adjustment: Terminal.${org_id}.inventory_bbl == 100000, Terminal.${org_id}.version == 3"
            - "PipelineSegment.${seg_id}.linefill_bbl is still 20000 and PipelineSegment.${seg_id}.operational_status == OPERATIONAL"

      - name: inject_before_publication_rejected
        claim_type: Conditional action
        grounds:
          - endpoints[POST /pipeline/batch-tickets/{id}/inject]
          - validations[ERR_CYCLE_INVALID_STATE]
        distinguishing_aspect: |
          A built schedule is not yet a binding one: the ticket exists and is PLANNED, but with the
          cycle still SCHEDULED the injection is refused with 409 ERR_CYCLE_INVALID_STATE — barrels
          only move against a published schedule, and nothing about the ticket, the terminal or the
          shipper's exposure changes.
        test_recipe:
          setup:
            - "Cycle 2026-09 is SCHEDULED (schedule built, never published) with ALPHA's PLANNED 30000 bbl ticket and HOU holding 100000 bbl."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TariffAdministrator
            - call: "POST /pipeline/terminals"
              payload: { terminal_code: "HOU", name: "Houston Origin", role_kind: "ORIGIN", shell_capacity_bbl: 500000, min_operating_inventory_bbl: 10000, injection_bays: 2 }
              as: TariffAdministrator
              captures: { org_id: "$.data.id", org_v0: "$.data.version" }
            - call: "POST /pipeline/terminals"
              payload: { terminal_code: "NAS", name: "Nashville Delivery", role_kind: "DESTINATION", shell_capacity_bbl: 400000, min_operating_inventory_bbl: 5000 }
              as: TariffAdministrator
              captures: { dst_id: "$.data.id" }
            - call: "POST /pipeline/product-grades"
