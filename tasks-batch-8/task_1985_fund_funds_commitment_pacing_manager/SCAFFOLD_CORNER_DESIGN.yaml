              as: OperationsAnalyst
              as_user_id: "${ops}"
            - call: "POST /fof/programs/${prog}/open"
              payload: {}
              as: CIO
            - call: "POST /fof/programs/${prog}/pacing-plans"
              payload: { plan_label: "A", horizon_years: 2, start_vintage_year: 2026, target_strategy_mix: [{ strategy: "BUYOUT", weight: 1.0 }] }
              as: Analyst
              as_user_id: "${ana}"
              captures: { planA: $.data.id }
            - call: "POST /fof/programs/${prog}/pacing-plans/${planA}/approve"
              payload: {}
              as: CIO
            - call: "POST /fof/programs/${prog}/pacing-plans"
              payload: { plan_label: "B", horizon_years: 2, start_vintage_year: 2027, target_strategy_mix: [{ strategy: "VENTURE", weight: 1.0 }] }
              as: Analyst
