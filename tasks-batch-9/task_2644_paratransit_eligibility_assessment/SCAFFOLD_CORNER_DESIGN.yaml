              as_user_id: "co-1"
            - call: "POST /trip-events"
              payload: { applicant_id: "${rider_id}", trip_date: "2026-07-18", event_type: "NO_SHOW" }
              as: ConductOfficer
              as_user_id: "co-1"
            - call: "GET /applicants/${rider_id}"
              payload: {}
              as: ConductOfficer
              captures: { v0: $.data.version, pts0: $.data.no_show_points_event_basis }
          trigger:
            - call: "POST /trip-events"
              payload: { applicant_id: "${rider_id}", trip_date: "2026-07-25", event_type: "COMPLETED" }
              as: ConductOfficer
              as_user_id: "co-1"
            - call: "POST /applicants/${rider_id}/suspension-proceedings"
              payload: { expected_applicant_version: "${v0}", review_window_end_date: "2026-08-31", grounds_note: "written before the last event landed" }
              as: ConductOfficer
              as_user_id: "co-1"
              captures: { stale_err: $.data.error_id }
            - call: "GET /applicants/${rider_id}"
              payload: {}
              as: ConductOfficer
              captures: { v1: $.data.version, pts1: $.data.no_show_points_event_basis, sched1: $.data.scheduled_trip_count_90d }
            - call: "POST /applicants/${rider_id}/suspension-proceedings"
              payload: { expected_applicant_version: "${v1}", review_window_end_date: "2026-08-31", grounds_note: "first proposal" }
              as: ConductOfficer
              as_user_id: "co-1"
              captures: { proc_1: $.data.id, proc_1_origin: $.data.origin, proc_1_points: $.data.points_at_proposal }
            - call: "POST /applicants/${rider_id}/suspension-proceedings"
              payload: { expected_applicant_version: "${v1}", review_window_end_date: "2026-09-15", grounds_note: "replay of the consumed version" }
              as: ConductOfficer
              as_user_id: "co-1"
              captures: { consumed_err: $.data.error_id }
            - call: "GET /applicants/${rider_id}"
              payload: {}
              as: ConductOfficer
              captures: { v2: $.data.version }
            - call: "POST /applicants/${rider_id}/suspension-proceedings"
              payload: { expected_applicant_version: "${v2}", review_window_end_date: "2026-09-15", grounds_note: "second proposal supersedes the first" }
              as: ConductOfficer
              as_user_id: "co-2"
              captures: { proc_2: $.data.id, proc_2_status: $.data.status }
            - call: "GET /applicants/${rider_id}/suspension-proceedings"
              payload: { status: "VOID" }
