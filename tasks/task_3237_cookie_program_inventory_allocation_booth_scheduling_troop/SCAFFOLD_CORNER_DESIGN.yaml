              payload: { name: "Depot 1", address: "1 Depot Way", capacity_units: 10000, expected_season_version: "${s_v1}" }
              as: CouncilAdmin
              captures: { site1: $.data.id }
          trigger:
            - call: "POST /cookie-program/seasons/${s_id}/sites"
              payload: { name: "Depot 2", address: "2 Depot Way", capacity_units: 5000, expected_season_version: "${s_v1}" }
              as: CouncilAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION (s_v1 is stale after the first site creation bumped the season version)"

      - name: occ_site_create_current_version_succeeds
        claim_type: stale_version_conflict
        grounds:
          - 'concurrency_rules[site-approve-stale-season]'
        distinguishing_aspect: "The same create with the up-to-date version succeeds — OCC passes and the version advances again."
        test_recipe:
          setup: ["Season DRAFT; current version re-read after first site creation"]
          setup_api_calls:
            - call: "POST /cookie-program/seasons"
              payload: { code: "COOKIE-2902", name: "S2902", ordering_opens_at: "2027-01-01T00:00:00Z", ordering_closes_at: "2027-02-01T00:00:00Z" }
              as: CouncilAdmin
              captures: { s_id: $.data.id, s_v1: $.data.version }
            - call: "POST /cookie-program/seasons/${s_id}/sites"
              payload: { name: "Depot 1", address: "1 Depot Way", capacity_units: 10000, expected_season_version: "${s_v1}" }
              as: CouncilAdmin
              captures: { site1: $.data.id }
            - call: "GET /cookie-program/seasons/${s_id}"
              payload: {}
              as: CouncilAdmin
              captures: { s_v2: $.data.version }
          trigger:
            - call: "POST /cookie-program/seasons/${s_id}/sites"
              payload: { name: "Depot 2", address: "2 Depot Way", capacity_units: 5000, expected_season_version: "${s_v2}" }
              as: CouncilAdmin
              captures: { site2: $.data.id }
          assert:
            - "site2 created (201) — current version accepted"
            - "CookieSeason.${s_id}.version == s_v2 + 1 after the create"

