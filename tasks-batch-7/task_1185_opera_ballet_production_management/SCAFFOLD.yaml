# =============================================================================
# Task 1185: Opera & Ballet Production Management — scaffold seed tables
# =============================================================================

scenario: |
  generate task hard than expert level! 1185. Opera & Ballet Production Management (opera/ballet company): production build (sets/costumes) & co-production sharing, casting & understudy/cover assignment, rehearsal room scheduling & call sheets, orchestra/chorus/dancer contracts & rest rules, stage crew calls & load-in for repertory rotation, surtitle preparation & technical rehearsals, performance run inventory & pricing, rental of production to other companies

domain_name: opera-ballet-production-management
api_prefix: /opera

# =============================================================================
# §0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (16 entities, flat topology)
# =============================================================================
entities:
  - name: PartnerCompany
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Partner company legal name" }
      - { name: partner_kind, type: enum, source: input, description: "CO_PRODUCER | RENTER — a company may not act as both" }
      - { name: standing, type: enum, source: system, description: "GOOD | WATCH | BARRED; initial GOOD; changed via transition endpoint", default: "GOOD" }

  - name: Production
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Production title (e.g. Swan Lake)" }
      - { name: work_type, type: enum, source: input, description: "OPERA | BALLET" }
      - { name: build_budget_cents, type: integer, source: input, description: "Total build budget for sets/costumes, must be > 0" }
      - { name: default_surtitle_language, type: string, source: input, description: "ISO language code of the house surtitle track that gates tech readiness" }
      - { name: build_cost_balance_cents, type: integer, source: computed, description: "build_budget_cents minus committed build cost (see build_cost_balance calc); initialized to build_budget_cents" }
      - { name: season_revenue_cents, type: integer, source: computed, description: "Sum of realized_revenue_cents over Performances with lifecycle_status != CANCELLED" }
      - { name: status, type: enum, source: system, description: "DESIGN | BUILD | REHEARSAL | IN_REPERTORY | ARCHIVED" }

  - name: BuildItem
    parent: null
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, description: "FK -> Production.id; owning production" }
      - { name: item_kind, type: enum, source: input, description: "SET | COSTUME | PROP" }
      - { name: name, type: string, source: input, description: "Item name (e.g. Act II palace flat)" }
      - { name: quoted_cost_cents, type: integer, source: input, description: "Quoted cost at order time, must be > 0" }
      - { name: actual_cost_cents, type: integer, source: input, description: "Actual cost, required input when transitioning to BUILT" }
      - { name: status, type: enum, source: system, description: "ORDERED | BUILT | DELIVERED | IN_USE | CANCELLED" }

  - name: CoProductionShare
    parent: null
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, description: "FK -> Production.id" }
      - { name: company_id, type: string, source: input, description: "FK -> PartnerCompany.id; company must have partner_kind == CO_PRODUCER" }
      - { name: share_percentage, type: number, source: input, description: "Cost/revenue share percentage; 0 < p <= 100" }
      - { name: cost_split_method, type: enum, source: input, description: "GROSS_COST | NET_REVENUE_SHARE — selects settlement variant" }
      - { name: accrued_revenue_share_cents, type: integer, source: computed, description: "For RATIFIED NET_REVENUE_SHARE shares: round_half_up(share_percentage/100 * production.season_revenue_cents); recomputed on every season_revenue change; 0 otherwise" }
      - { name: settlement_cents, type: integer, source: computed, description: "Computed at settle per cost_split_method; null until SETTLED" }
      - { name: status, type: enum, source: system, description: "PROPOSED | RATIFIED | DISPUTED | SETTLED" }

  - name: Artist
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Artist full name" }
      - { name: discipline, type: enum, source: input, description: "PRINCIPAL_DANCER | CORPS_DANCER | SOPRANO | TENOR | CHORUS | ORCHESTRA" }
      - { name: union_code, type: enum, source: input, description: "AGMA | AFM | EQUITY — determines applicable rest/overtime rule family" }

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, description: "FK -> Production.id" }
      - { name: artist_id, type: string, source: input, description: "FK -> Artist.id" }
      - { name: engagement_type, type: enum, source: input, description: "PRINCIPAL | COVER | CHORUS | ORCHESTRA" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Base hourly rate, must be > 0" }
      - { name: weekly_hours_cap, type: integer, source: input, description: "Regular weekly hours before overtime tiers; must be > 0" }
      - { name: rest_floor_hours, type: integer, source: input, description: "Minimum rest hours between committed calls; default 12", default: 12 }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the creating ContractsOfficer; read by the waiver segregation-of-duties check" }
      - { name: status, type: enum, source: system, description: "DRAFT | OFFERED | SIGNED | ACTIVE | CLOSED | DECLINED | TERMINATED" }

  - name: Role
    parent: null
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, description: "FK -> Production.id" }
      - { name: role_name, type: string, source: input, description: "Dramatic role name (e.g. Odette/Odile)" }
      - { name: voice_type, type: enum, source: input, description: "SOPRANO | MEZZO | TENOR | BARITONE | BASS | DANCER_M | DANCER_F | NON_SINGING" }
      - { name: is_title_role, type: boolean, source: input, description: "Whether this is the title role", default: false }
      - { name: casting_status, type: enum, source: computed, description: "UNFILLED | PRINCIPAL_SET | FULLY_CAST; derived from CONFIRMED CastAssignments (see casting_completeness calc)" }

  - name: CastAssignment
    parent: null
    common_fields: true
    fields:
      - { name: production_id, type: string, source: computed, description: "FK -> Production.id; copied from the Role at creation" }
      - { name: role_id, type: string, source: input, description: "FK -> Role.id" }
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; contract must belong to the same production" }
      - { name: slot, type: enum, source: input, description: "PRINCIPAL | COVER_1 | COVER_2" }
      - { name: covers_assignment_id, type: string, source: input, description: "FK -> CastAssignment.id; required iff slot != PRINCIPAL; must reference a PRINCIPAL assignment on the same role; self-referential cover chain" }
      - { name: status, type: enum, source: system, description: "PROPOSED | CONFIRMED | RELEASED | WITHDRAWN" }

  - name: RehearsalRoom
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Room name" }
      - { name: kind, type: enum, source: input, description: "STUDIO | STAGE | ORCHESTRA_PIT" }
      - { name: capacity, type: integer, source: input, description: "Max occupants, must be > 0" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Room hourly rate" }

  - name: RehearsalCall
    parent: null
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, description: "FK -> Production.id" }
      - { name: room_id, type: string, source: input, description: "FK -> RehearsalRoom.id" }
      - { name: call_type, type: enum, source: input, description: "BLOCKING | STAGING | ORCHESTRA_READ | DANCE_CALL | TECH | DRESS" }
      - { name: starts_at, type: datetime, source: input, description: "Call start (ISO 8601 UTC); half-open interval start" }
      - { name: ends_at, type: datetime, source: input, description: "Call end (ISO 8601 UTC); must be > starts_at" }
      - { name: required_headcount, type: integer, source: input, description: "Minimum confirmed participants for the call to be viable; default 1", default: 1 }
      - { name: confirmed_headcount, type: integer, source: computed, description: "Count of participants with status in {CONFIRMED, CHECKED_IN}; recomputed on every participant mutation" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | COMPLETED | CANCELLED" }

  - name: CallParticipant
    parent: null
    common_fields: true
    fields:
      - { name: call_id, type: string, source: input, description: "FK -> RehearsalCall.id" }
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; contract must be ACTIVE" }
      - { name: waive_rest_floor, type: boolean, source: input, description: "If true and the rest-floor check fails, participant is created in WAIVER_PENDING instead of being rejected", default: false }
      - { name: status, type: enum, source: system, description: "INVITED | WAIVER_PENDING | CONFIRMED | CHECKED_IN | DECLINED | REMOVED" }

  - name: StageSlot
    parent: null
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, description: "FK -> Production.id" }
      - { name: slot_type, type: enum, source: input, description: "LOAD_IN | LOAD_OUT | TECH | PERFORMANCE_SLOT | DRESS_ON_STAGE" }
      - { name: starts_at, type: datetime, source: input, description: "Stage occupation start (the stage is a single shared resource across all productions)" }
      - { name: ends_at, type: datetime, source: input, description: "Stage occupation end; must be > starts_at" }
      - { name: status, type: enum, source: system, description: "PLANNED | LOCKED | DONE | CANCELLED" }

  - name: Performance
    parent: null
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, description: "FK -> Production.id; production must be REHEARSAL or IN_REPERTORY" }
      - { name: starts_at, type: datetime, source: input, description: "Curtain time (ISO 8601 UTC)" }
      - { name: ends_at, type: datetime, source: input, description: "Curtain down; must be > starts_at" }
      - { name: sections, type: array, source: input, description: "Creation-only array of {section, total_seats, base_price_cents}; one SeatInventory row is created per element; duplicate section within one request is rejected" }
      - { name: lifecycle_status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED" }
      - { name: sales_status, type: enum, source: system, description: "NOT_ON_SALE | ON_SALE | SALES_CLOSED — parallel state dimension 1" }
      - { name: readiness_status, type: enum, source: system, description: "AWAITING_TECH | TECH_READY | CLEARED_FOR_AUDIENCE — parallel state dimension 2" }
      - { name: realized_revenue_cents, type: integer, source: computed, description: "Sum of purchase totals charged against this performance's inventories; reset to 0 on cancel" }

  - name: SeatInventory
    parent: null
    common_fields: true
    fields:
      - { name: performance_id, type: string, source: computed, description: "FK -> Performance.id; set at creation from the parent performance" }
      - { name: section, type: enum, source: system, description: "STALLS | BALCONY | BOX | GALLERY; taken from the performance sections element" }
      - { name: total_seats, type: integer, source: system, description: "Total seats in this section; from creation input" }
      - { name: seats_held, type: integer, source: computed, description: "Seats currently held by box office; starts 0" }
      - { name: seats_sold, type: integer, source: computed, description: "Seats sold; starts 0" }
      - { name: base_price_cents, type: integer, source: system, description: "Base unit price; from creation input" }
      - { name: current_price_cents, type: integer, source: computed, description: "Demand-adjusted unit price per seat_price_cents calc; recomputed on create and after every purchase" }

  - name: SurtitleTrack
    parent: null
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, description: "FK -> Production.id" }
      - { name: language, type: string, source: input, description: "ISO language code of this surtitle track" }
      - { name: cue_count, type: integer, source: input, description: "Number of surtitle cues; must be > 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | TRANSLATED | CUES_LOCKED | LIVE" }

  - name: RentalOffer
    parent: null
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, description: "FK -> Production.id" }
      - { name: renter_company_id, type: string, source: input, description: "FK -> PartnerCompany.id; company must have partner_kind == RENTER" }
      - { name: window_start, type: datetime, source: input, description: "Rental window start (ISO 8601 UTC)" }
      - { name: window_end, type: datetime, source: input, description: "Rental window end; must be > window_start" }
      - { name: performances_count, type: integer, source: input, description: "Number of performances the renter will mount; must be > 0" }
      - { name: per_performance_fee_cents, type: integer, source: input, description: "Fee per performance; must be > 0; revised by /revise" }
      - { name: fee_base_cents, type: integer, source: computed, description: "performances_count * per_performance_fee_cents; computed at send and at revise" }
      - { name: surcharge_pct, type: integer, source: computed, description: "Large-rental surcharge percentage keyed on fee_base_cents tier (see rental_fee_cents calc)" }
      - { name: total_fee_cents, type: integer, source: computed, description: "fee_base_cents + round_half_up(fee_base_cents * surcharge_pct/100)" }
      - { name: countered_fee_cents, type: integer, source: input, description: "Renter's counter-offer total; set by /counter" }
      - { name: final_settlement_cents, type: integer, source: computed, description: "Set at settle: countered_fee_cents if negotiation_rounds > 0 else total_fee_cents" }
      - { name: negotiation_rounds, type: integer, source: system, description: "Starts 0; +1 per /revise; hard cap MAX_NEGOTIATION_ROUNDS (5) on /counter" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the creating ProductionManager; settle must be executed by a different user (segregation of duties)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SENT | COUNTERED | ACCEPTED | SETTLED | DECLINED | WITHDRAWN | SUPERSEDED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Production
    initial_state: DESIGN
    terminal_states: [ARCHIVED]
    transitions:
      - from: DESIGN
        to: BUILD
        trigger: "POST /opera/productions/{id}/transition {to_state: BUILD}"
        actor: ProductionManager
        preconditions: []
        side_effects: ["increments Production.version by 1"]
      - from: BUILD
        to: REHEARSAL
        trigger: "POST /opera/productions/{id}/transition {to_state: REHEARSAL}"
        actor: ProductionManager
        preconditions:
          - "Every BuildItem of this production with status != CANCELLED has status in {DELIVERED, IN_USE} (vacuously true when no build items exist) — else ERR_BUILD_ITEMS_NOT_DELIVERED"
        side_effects: ["increments Production.version by 1"]
      - from: REHEARSAL
        to: BUILD
        trigger: "POST /opera/productions/{id}/transition {to_state: BUILD}"
        actor: ProductionManager
        preconditions: []
        side_effects: ["increments Production.version by 1"]
        note: "Rework loop: REHEARSAL may revert to BUILD when sets/costumes need rework (cyclic machine)"
      - from: REHEARSAL
        to: IN_REPERTORY
        trigger: "POST /opera/productions/{id}/transition {to_state: IN_REPERTORY}"
        actor: ProductionManager
        preconditions:
          - "At least one Performance exists for this production — else ERR_NO_PERFORMANCES_SCHEDULED"
        side_effects: ["increments Production.version by 1"]
      - from: IN_REPERTORY
        to: ARCHIVED
        trigger: "POST /opera/productions/{id}/transition {to_state: ARCHIVED}"
        actor: ProductionManager
        preconditions:
          - "No RentalOffer of this production in {DRAFT, SENT, COUNTERED, ACCEPTED} AND no Performance with lifecycle_status == SCHEDULED — else ERR_PRODUCTION_HAS_OPEN_COMMITMENTS"
        side_effects: ["increments Production.version by 1"]

  - entity: BuildItem
    initial_state: ORDERED
    terminal_states: [IN_USE, CANCELLED]
    transitions:
      - from: ORDERED
        to: BUILT
        trigger: "POST /opera/build-items/{id}/transition {to_state: BUILT, actual_cost_cents}"
        actor: ProductionManager
        preconditions:
          - "actual_cost_cents must be provided and > 0 — else ERR_VALIDATION"
          - "Fiscal check: production.build_cost_balance_cents >= (actual_cost_cents - quoted_cost_cents) — else ERR_BUILD_BUDGET_EXCEEDED"
        side_effects:
          - "Recompute Production.build_cost_balance_cents (build_cost_balance calc)"
          - "increments Production.version by 1 (via cascade touch)"
      - from: BUILT
        to: ORDERED
        trigger: "POST /opera/build-items/{id}/transition {to_state: ORDERED}"
        actor: ProductionManager
        preconditions: []
        side_effects:
          - "Recompute Production.build_cost_balance_cents (rework releases the actual-cost delta back to quoted basis)"
        note: "Rework loop BUILT -> ORDERED (cyclic machine)"
      - from: BUILT
        to: DELIVERED
        trigger: "POST /opera/build-items/{id}/transition {to_state: DELIVERED}"
        actor: ProductionManager
        preconditions: []
        side_effects: []
      - from: DELIVERED
        to: IN_USE
        trigger: "POST /opera/build-items/{id}/transition {to_state: IN_USE}"
        actor: ProductionManager
        preconditions: []
        side_effects: []
      - from: ORDERED
        to: CANCELLED
        trigger: "POST /opera/build-items/{id}/transition {to_state: CANCELLED}"
        actor: ProductionManager
        preconditions: []
        side_effects:
          - "Recompute Production.build_cost_balance_cents (cancel releases the committed quoted cost — compensating invariant build_budget_conservation)"

  - entity: CoProductionShare
    initial_state: PROPOSED
    terminal_states: [SETTLED]
    transitions:
      - from: PROPOSED
        to: RATIFIED
        trigger: "POST /opera/co-production-shares/{id}/transition {to_state: RATIFIED}"
        actor: ProductionManager
        preconditions:
          - "Sum of share_percentage over this production's RATIFIED shares + this share <= 100 — else ERR_SHARE_PERCENT_OVERFLOW"
        side_effects:
          - "If cost_split_method == NET_REVENUE_SHARE: compute accrued_revenue_share_cents = round_half_up(share_percentage/100 * production.season_revenue_cents)"
      - from: RATIFIED
        to: DISPUTED
        trigger: "POST /opera/co-production-shares/{id}/transition {to_state: DISPUTED}"
        actor: ProductionManager
        preconditions: []
        side_effects: []
      - from: DISPUTED
        to: RATIFIED
        trigger: "POST /opera/co-production-shares/{id}/transition {to_state: RATIFIED}"
        actor: ProductionManager
        preconditions:
          - "Same share-percentage capacity check as PROPOSED -> RATIFIED"
        side_effects:
          - "Recompute accrued_revenue_share_cents (same formula as ratify)"
        note: "Dispute resolution loop RATIFIED -> DISPUTED -> RATIFIED (cyclic machine)"
      - from: RATIFIED
        to: SETTLED
        trigger: "POST /opera/co-production-shares/{id}/transition {to_state: SETTLED}"
        actor: ProductionManager
        preconditions: []
        side_effects:
          - "Compute settlement_cents per cost_split_method (coproduction_settlement_cents calc)"

  - entity: Contract
    initial_state: DRAFT
    terminal_states: [CLOSED, DECLINED, TERMINATED]
    transitions:
      - from: DRAFT
        to: OFFERED
        trigger: "POST /opera/contracts/{id}/transition {to_state: OFFERED}"
        actor: ContractsOfficer
        preconditions: []
        side_effects: []
      - from: OFFERED
        to: DRAFT
        trigger: "POST /opera/contracts/{id}/transition {to_state: DRAFT}"
        actor: ContractsOfficer
        preconditions: []
        side_effects: []
        note: "Recall-to-revise loop OFFERED -> DRAFT (cyclic machine)"
      - from: OFFERED
        to: SIGNED
        trigger: "POST /opera/contracts/{id}/transition {to_state: SIGNED}"
        actor: ContractsOfficer
        preconditions: []
        side_effects: []
      - from: OFFERED
        to: DECLINED
        trigger: "POST /opera/contracts/{id}/transition {to_state: DECLINED}"
        actor: ContractsOfficer
        preconditions: []
        side_effects: []
      - from: SIGNED
        to: ACTIVE
        trigger: "POST /opera/contracts/{id}/transition {to_state: ACTIVE}"
        actor: ContractsOfficer
        preconditions:
          - "Production.status must be in {BUILD, REHEARSAL, IN_REPERTORY} — else ERR_INVALID_STATE_TRANSITION"
        side_effects: []
      - from: SIGNED
        to: TERMINATED
        trigger: "POST /opera/contracts/{id}/transition {to_state: TERMINATED}"
        actor: ContractsOfficer
        preconditions: []
        side_effects:
          - "All CallParticipants of this contract in {INVITED, WAIVER_PENDING, CONFIRMED, CHECKED_IN} -> REMOVED; each removal recomputes its RehearsalCall.confirmed_headcount"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /opera/contracts/{id}/transition {to_state: TERMINATED}"
        actor: ContractsOfficer
        preconditions: []
        side_effects:
          - "Same participant cascade as SIGNED -> TERMINATED"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /opera/contracts/{id}/transition {to_state: CLOSED}"
        actor: ContractsOfficer
        preconditions:
          - "No CallParticipants of this contract in {INVITED, WAIVER_PENDING, CONFIRMED} on calls in {DRAFT, PUBLISHED} — else ERR_INVALID_STATE_TRANSITION"
        side_effects: []

  - entity: CastAssignment
    initial_state: PROPOSED
    terminal_states: [RELEASED, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /opera/cast-assignments/{id}/confirm"
        actor: CastingDirector
        preconditions:
          - "If slot == PRINCIPAL: no other CastAssignment on the same role with slot == PRINCIPAL and status == CONFIRMED — else ERR_ROLE_PRINCIPAL_TAKEN"
          - "If slot != PRINCIPAL: the assignment referenced by covers_assignment_id must have status == CONFIRMED — else ERR_COVER_LINK_INVALID"
          - "Contract.status == ACTIVE — else ERR_CONTRACT_NOT_ACTIVE"
        side_effects:
          - "Recompute Role.casting_status (casting_completeness calc)"
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /opera/cast-assignments/{id}/release"
        actor: CastingDirector
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /opera/cast-assignments/{id}/release"
        actor: CastingDirector
        preconditions: []
        side_effects:
          - "Cascade link 1 (promotion): if the released assignment had slot == PRINCIPAL, promote the cover: among CastAssignments with covers_assignment_id == released.id and status == CONFIRMED, pick lowest slot rank (COVER_1 before COVER_2), tie-break created_at ASC; set its slot = PRINCIPAL, covers_assignment_id = null (status stays CONFIRMED); all other CONFIRMED covers of the released principal are re-pointed to the promoted assignment (covers_assignment_id := promoted.id)"
          - "Cascade link 2 (derived field): the promotion (or the release, if no cover exists) triggers recompute of Role.casting_status"
          - "Cascade link 3 (headcount sync): none — casting changes do not touch rehearsal calls"

  - entity: RehearsalCall
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /opera/rehearsal-calls/{id}/transition {to_state: PUBLISHED}"
        actor: TechnicalDirector
        preconditions:
          - "Production.status == REHEARSAL — else ERR_PRODUCTION_NOT_IN_REHEARSAL"
          - "Room overlap re-check (room_overlap_check) against the room's non-terminal calls — else ERR_ROOM_TIME_CONFLICT"
        side_effects: []
      - from: PUBLISHED
        to: DRAFT
        trigger: "POST /opera/rehearsal-calls/{id}/transition {to_state: DRAFT}"
        actor: TechnicalDirector
        preconditions: []
        side_effects: []
        note: "Unpublish-for-reschedule loop PUBLISHED -> DRAFT (cyclic machine)"
      - from: PUBLISHED
        to: COMPLETED
        trigger: "POST /opera/rehearsal-calls/{id}/transition {to_state: COMPLETED}"
        actor: TechnicalDirector
        preconditions: []
        side_effects: []
        note: "COMPLETED calls enter the FINAL variant of artist_weekly_pay_cents"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /opera/rehearsal-calls/{id}/transition {to_state: CANCELLED}"
        actor: TechnicalDirector
        preconditions: []
        side_effects:
          - "All CallParticipants of this call in {INVITED, WAIVER_PENDING, CONFIRMED, CHECKED_IN} -> REMOVED"
      - from: PUBLISHED
        to: CANCELLED
        trigger: "POST /opera/rehearsal-calls/{id}/transition {to_state: CANCELLED}"
        actor: TechnicalDirector
        preconditions: []
        side_effects:
          - "All CallParticipants of this call in {INVITED, WAIVER_PENDING, CONFIRMED, CHECKED_IN} -> REMOVED"
          - "Each participant -> REMOVED mutation recomputes this call's confirmed_headcount (ends at 0)"

  - entity: CallParticipant
    initial_state: INVITED
    terminal_states: [DECLINED, REMOVED]
    transitions:
      - from: INVITED
        to: CONFIRMED
        trigger: "POST /opera/call-participants/{id}/transition {to_state: CONFIRMED}"
        actor: ContractsOfficer
        preconditions: []
        side_effects: ["Recompute RehearsalCall.confirmed_headcount (+1)"]
      - from: WAIVER_PENDING
        to: CONFIRMED
        trigger: "POST /opera/call-participants/{id}/approve-waiver"
        actor: ContractsOfficer
        preconditions:
          - "Segregation of duties: X-User-ID != contract.created_by_user_id — else ERR_SOD_SAME_USER_FORBIDDEN"
        side_effects: ["Recompute RehearsalCall.confirmed_headcount (+1)"]
      - from: INVITED
        to: DECLINED
        trigger: "POST /opera/call-participants/{id}/transition {to_state: DECLINED}"
        actor: ContractsOfficer
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /opera/call-participants/{id}/transition {to_state: CHECKED_IN}"
        actor: ContractsOfficer
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: REMOVED
        trigger: "POST /opera/call-participants/{id}/transition {to_state: REMOVED} or cascade from call cancel / contract terminate"
        actor: ContractsOfficer
        preconditions: []
        side_effects: ["Recompute RehearsalCall.confirmed_headcount (-1)"]

  - entity: StageSlot
    initial_state: PLANNED
    terminal_states: [DONE, CANCELLED]
    transitions:
      - from: PLANNED
        to: LOCKED
        trigger: "POST /opera/stage-slots/{id}/transition {to_state: LOCKED}"
        actor: TechnicalDirector
        preconditions: []
        side_effects: []
      - from: LOCKED
        to: DONE
        trigger: "POST /opera/stage-slots/{id}/transition {to_state: DONE}"
        actor: TechnicalDirector
        preconditions: []
        side_effects: []
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /opera/stage-slots/{id}/transition {to_state: CANCELLED}"
        actor: TechnicalDirector
        preconditions: []
        side_effects: []
      - from: LOCKED
        to: CANCELLED
        trigger: "POST /opera/stage-slots/{id}/transition {to_state: CANCELLED}"
        actor: TechnicalDirector
        preconditions: []
        side_effects: []

  - entity: Performance
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    note: "Parallel state dimensions: lifecycle_status (SCHEDULED|COMPLETED|CANCELLED) x sales_status (NOT_ON_SALE|ON_SALE|SALES_CLOSED) x readiness_status (AWAITING_TECH|TECH_READY|CLEARED_FOR_AUDIENCE) evolve independently on the same row."
    transitions:
      - from: "sales_status=NOT_ON_SALE"
        to: "sales_status=ON_SALE"
        trigger: "POST /opera/performances/{id}/open-sales"
        actor: BoxOfficeManager
        preconditions: ["lifecycle_status == SCHEDULED — else ERR_INVALID_STATE_TRANSITION"]
        side_effects: []
      - from: "sales_status=ON_SALE"
        to: "sales_status=NOT_ON_SALE"
        trigger: "POST /opera/performances/{id}/suspend-sales"
        actor: BoxOfficeManager
        preconditions: []
        side_effects: []
        note: "Sales suspension revert (non-linear: forward and back on the sales dimension)"
      - from: "sales_status=ON_SALE"
        to: "sales_status=SALES_CLOSED"
        trigger: "POST /opera/performances/{id}/close-sales"
        actor: BoxOfficeManager
        preconditions: []
        side_effects: []
      - from: "readiness_status=AWAITING_TECH"
        to: "readiness_status=TECH_READY"
        trigger: "POST /opera/performances/{id}/tech-ready"
        actor: TechnicalDirector
        preconditions:
          - "lifecycle_status == SCHEDULED — else ERR_INVALID_STATE_TRANSITION"
          - "Exists a StageSlot with production_id == performance.production_id, slot_type == TECH, status == DONE, ends_at <= performance.starts_at — else ERR_READINESS_GATE_BLOCKED"
          - "Exists a SurtitleTrack with production_id == performance.production_id, language == production.default_surtitle_language, status == LIVE — else ERR_READINESS_GATE_BLOCKED"
          - "Production.status in {REHEARSAL, IN_REPERTORY} — else ERR_READINESS_GATE_BLOCKED"
        side_effects: []
      - from: "readiness_status=TECH_READY"
        to: "readiness_status=CLEARED_FOR_AUDIENCE"
        trigger: "POST /opera/performances/{id}/clear"
        actor: TechnicalDirector
        preconditions: []
        side_effects: []
      - from: "lifecycle_status=SCHEDULED"
        to: "lifecycle_status=COMPLETED"
        trigger: "POST /opera/performances/{id}/complete"
        actor: BoxOfficeManager
        preconditions:
          - "Logical clock > ends_at — else ERR_PERFORMANCE_NOT_ENDED"
          - "readiness_status == CLEARED_FOR_AUDIENCE — else ERR_READINESS_GATE_BLOCKED"
        side_effects: []
      - from: "lifecycle_status=SCHEDULED"
        to: "lifecycle_status=CANCELLED"
        trigger: "POST /opera/performances/{id}/cancel"
        actor: ProductionManager
        preconditions: []
        side_effects:
          - "Cascade link 1: every SeatInventory of this performance -> seats_held = 0, seats_sold = 0, current_price_cents recomputed at sold_ratio 0; performance.realized_revenue_cents = 0"
          - "Cascade link 2: the inventory zeroing triggers recompute of Production.season_revenue_cents (performance now excluded)"
          - "Cascade link 3: the season_revenue change triggers recompute of accrued_revenue_share_cents on every RATIFIED NET_REVENUE_SHARE CoProductionShare of this production"

  - entity: SurtitleTrack
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: TRANSLATED
        trigger: "POST /opera/surtitle-tracks/{id}/transition {to_state: TRANSLATED}"
        actor: TechnicalDirector
        preconditions: []
        side_effects: []
      - from: TRANSLATED
        to: CUES_LOCKED
        trigger: "POST /opera/surtitle-tracks/{id}/transition {to_state: CUES_LOCKED}"
        actor: TechnicalDirector
        preconditions: []
        side_effects: []
      - from: CUES_LOCKED
        to: TRANSLATED
        trigger: "POST /opera/surtitle-tracks/{id}/transition {to_state: TRANSLATED}"
        actor: TechnicalDirector
        preconditions: []
        side_effects: []
        note: "Revision loop CUES_LOCKED -> TRANSLATED (cyclic machine)"
      - from: CUES_LOCKED
        to: LIVE
        trigger: "POST /opera/surtitle-tracks/{id}/transition {to_state: LIVE}"
        actor: TechnicalDirector
        preconditions: []
        side_effects: []

  - entity: RentalOffer
    initial_state: DRAFT
    terminal_states: [SETTLED, DECLINED, WITHDRAWN, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /opera/rental-offers/{id}/send"
        actor: ProductionManager
        preconditions: []
        side_effects:
          - "Compute fee_base_cents, surcharge_pct, total_fee_cents (rental_fee_cents calc)"
      - from: SENT
        to: COUNTERED
        trigger: "POST /opera/rental-offers/{id}/counter {countered_fee_cents}"
        actor: PartnerRepresentative
        preconditions:
          - "Ownership: X-User-ID == offer.renter_company_id — else ERR_RENTER_OWNERSHIP_MISMATCH"
          - "negotiation_rounds < MAX_NEGOTIATION_ROUNDS (5) — else ERR_NEGOTIATION_ROUND_LIMIT"
        side_effects: []
      - from: COUNTERED
        to: SENT
        trigger: "POST /opera/rental-offers/{id}/revise {per_performance_fee_cents}"
        actor: ProductionManager
        preconditions: []
        side_effects:
          - "negotiation_rounds += 1"
          - "Recompute fee_base_cents, surcharge_pct, total_fee_cents from the revised per_performance_fee_cents"
        note: "Negotiation cycle SENT -> COUNTERED -> SENT (cyclic machine)"
      - from: SENT
        to: ACCEPTED
        trigger: "POST /opera/rental-offers/{id}/accept"
        actor: PartnerRepresentative
        preconditions:
          - "Ownership: X-User-ID == offer.renter_company_id — else ERR_RENTER_OWNERSHIP_MISMATCH"
          - "PartnerCompany.standing == GOOD — else ERR_RENTER_STANDING_NOT_GOOD"
        side_effects: []
      - from: SENT
        to: DECLINED
        trigger: "POST /opera/rental-offers/{id}/decline"
        actor: PartnerRepresentative
        preconditions:
          - "Ownership: X-User-ID == offer.renter_company_id — else ERR_RENTER_OWNERSHIP_MISMATCH"
        side_effects: []
      - from: COUNTERED
        to: DECLINED
        trigger: "POST /opera/rental-offers/{id}/decline"
        actor: PartnerRepresentative
        preconditions:
          - "Ownership: X-User-ID == offer.renter_company_id — else ERR_RENTER_OWNERSHIP_MISMATCH"
        side_effects: []
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /opera/rental-offers/{id}/withdraw"
        actor: ProductionManager
        preconditions: []
        side_effects: []
      - from: SENT
        to: WITHDRAWN
        trigger: "POST /opera/rental-offers/{id}/withdraw"
        actor: ProductionManager
        preconditions: []
        side_effects: []
      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /opera/rental-offers/{id}/withdraw"
        actor: ProductionManager
        preconditions: []
        side_effects: []
      - from: SENT
        to: SUPERSEDED
        trigger: "system (automatic when a new RentalOffer for the same (production_id, renter_company_id) is created)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COUNTERED
        to: SUPERSEDED
        trigger: "system (automatic when a new RentalOffer for the same (production_id, renter_company_id) is created)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: SETTLED
        trigger: "POST /opera/rental-offers/{id}/settle"
        actor: ProductionManager
        preconditions:
          - "Logical clock >= offer.window_end — else ERR_OFFER_WINDOW_NOT_ENDED"
          - "Segregation of duties: X-User-ID != offer.created_by_user_id — else ERR_SOD_SAME_USER_FORBIDDEN"
        side_effects:
          - "final_settlement_cents = countered_fee_cents if negotiation_rounds > 0 else total_fee_cents"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version — true races only)
# =============================================================================
concurrency_rules:
  - rule_id: rental-offer-create-stale-production
    parent_entity: Production
    write_endpoint: "POST /opera/rental-offers"
    occ_field: expected_production_version
    description: |
      Creating a RentalOffer against a Production whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just created an offer for the same renter
      (which legitimately supersedes the prior SENT/COUNTERED offer under the
      RentalOffer state machine) or has otherwise advanced the production, so
      the current writer's view of the production is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: build_cost_balance
    trigger: "BuildItem create, transition to BUILT, rework to ORDERED, or cancel"
    algorithm: aggregation
    formula: |
      committed = sum over BuildItems of this production with status in {ORDERED, BUILT, DELIVERED, IN_USE}
                  of effective_cost, where effective_cost = actual_cost_cents if status in {BUILT, DELIVERED, IN_USE}
                  and actual_cost_cents is set, else quoted_cost_cents.
      Production.build_cost_balance_cents = build_budget_cents - committed.
      Conservation invariant (build_budget_conservation):
        build_cost_balance_cents + committed == build_budget_cents at all times;
        creating then cancelling an item restores the prior balance exactly.
    input_set: "BuildItems of the production with status in {ORDERED, BUILT, DELIVERED, IN_USE}; CANCELLED excluded"
    precision: "integer cents, exact"

  - name: coproduction_settlement_cents
    trigger: "CoProductionShare transition RATIFIED -> SETTLED"
    algorithm: tiered_pricing
    formula: |
      total_build_cents = sum of effective_cost over BuildItems with status in {DELIVERED, IN_USE}
                          (effective_cost = actual_cost_cents if set else quoted_cost_cents).
      cost_share = round_half_up(share_percentage/100 * total_build_cents).
      variant GROSS_COST:        settlement_cents = cost_share.
      variant NET_REVENUE_SHARE: settlement_cents = cost_share - accrued_revenue_share_cents
                                 where accrued_revenue_share_cents = round_half_up(share_percentage/100 * production.season_revenue_cents)
                                 evaluated at settle time (may go negative).
    input_set: "BuildItems in {DELIVERED, IN_USE}; Performances with lifecycle_status != CANCELLED for season_revenue"
    precision: "integer cents, round_half_up applied once at the final step"
    variants:
      - name: GROSS_COST
        when: "share.cost_split_method == GROSS_COST"
        difference: "Partner pays its share of build cost with no revenue offset"
      - name: NET_REVENUE_SHARE
        when: "share.cost_split_method == NET_REVENUE_SHARE"
        difference: "Build-cost share offset by the partner's accrued share of season revenue; identical inputs yield a strictly smaller (possibly negative) settlement"

  - name: artist_weekly_pay_cents
    trigger: "GET /opera/contracts/{id}/pay-quote"
    algorithm: forward_looking
    formula: |
      Week window W = [week_start 00:00:00Z, week_start + 7 days).
      Included calls: RehearsalCalls with a CallParticipant for this contract with participant
      status in {CONFIRMED, CHECKED_IN}, call.starts_at inside W, and call.status in the
      variant's inclusion set.
      hours = sum over included calls of (ends_at - starts_at) in whole and fractional hours.
      Pay applies overtime_tier_pay(hours, contract.weekly_hours_cap, contract.hourly_rate_cents, night_call_count)
      where night_call_count = number of included calls whose ends_at UTC time-of-day is in [23:00, 24:00).
      Rounding: no intermediate rounding; round_half_up to integer cents once at the end.
    input_set: "per variant below"
    precision: "integer cents, round_half_up at final step only"
    variants:
      - name: PROJECTED
        when: "mode=PROJECTED (forward-looking)"
        difference: "Includes calls with status in {PUBLISHED, COMPLETED} — scheduled-but-unplayed hours count"
      - name: FINAL
        when: "mode=FINAL (chronological actuals)"
        difference: "Includes only calls with status == COMPLETED — identical week data yields strictly lower pay when any PUBLISHED call exists"

  - name: overtime_tier_pay
    trigger: "invoked by artist_weekly_pay_cents"
    algorithm: tiered_pricing
    formula: |
      Inputs: total_hours H, cap C, hourly rate R, night_call_count N.
      regular_hours = min(H, C)
      ot1_hours     = min(max(H - C, 0), OT_TIER1_SPAN)
      ot2_hours     = max(H - C - OT_TIER1_SPAN, 0)
      pay = regular_hours*R + ot1_hours*R*OT1_MULT + ot2_hours*R*OT2_MULT + N*NIGHT_PREMIUM_CENTS
      (mode (a) combinatorial: 4 inputs, nested min/max, conditional night premium per call)
    constants:
      OT_TIER1_SPAN: 10
      OT1_MULT: 1.5
      OT2_MULT: 2.0
      NIGHT_PREMIUM_CENTS: 1500
    precision: "integer cents, round_half_up at final step only"

  - name: seat_price_cents
    trigger: "SeatInventory create, and after every purchase against the inventory (ratio change)"
    algorithm: tiered_pricing
    formula: |
      Nested rounding, ORDER PINNED (mode (b)):
        step 1: unit1 = round_half_up(base_price_cents * SECTION_MULT[section])
        step 2: sold_ratio = seats_sold / total_seats  (BEFORE the current purchase's seats are counted)
        step 3: demand_mult = 1.0 if sold_ratio < 0.5; 1.2 if 0.5 <= sold_ratio < 0.8; 1.5 if sold_ratio >= 0.8
        step 4: current_price_cents = round_half_up(unit1 * demand_mult)
      A single-rounding implementation round_half_up(base * section_mult * demand_mult) yields a
      different cent value for odd bases (e.g. base 10050 BALCONY at ratio 0.6: pinned 15076 vs naive 15075).
      Purchase total (mode (b) rounding also pinned):
        total = round_half_up(current_price_cents * quantity * (GROUP_DISCOUNT if quantity >= GROUP_MIN else 1.0))
    constants:
      SECTION_MULT: { STALLS: 1.0, BALCONY: 1.25, BOX: 1.6, GALLERY: 0.8 }
      GROUP_MIN: 10
      GROUP_DISCOUNT: 0.9
    precision: "integer cents, round_half_up at each pinned step"
    input_set: "single SeatInventory row"

  - name: rental_fee_cents
    trigger: "RentalOffer /send and /revise"
    algorithm: tiered_pricing
    formula: |
      Circular-looking dependency, EVALUATION ORDER PINNED (mode (c)):
        step 1: fee_base_cents = performances_count * per_performance_fee_cents
        step 2: surcharge_pct = 0 if fee_base_cents < LARGE_RENTAL_THRESHOLD_CENTS else LARGE_RENTAL_SURCHARGE_PCT
                (the tier keys on fee_base_cents ONLY — never on total_fee_cents)
        step 3: total_fee_cents = fee_base_cents + round_half_up(fee_base_cents * surcharge_pct/100)
      Keying the tier on the total would make the fee self-referential; the pinned order makes it well-defined.
    constants:
      LARGE_RENTAL_THRESHOLD_CENTS: 5000000
      LARGE_RENTAL_SURCHARGE_PCT: 8
    precision: "integer cents, round_half_up at step 3 only"

  - name: rest_floor_check
    trigger: "CallParticipant create"
    algorithm: threshold
    formula: |
      Let F = contract.rest_floor_hours * 3600 (seconds). For the new participant's call C, for every
      other RehearsalCall D such that the contract has a CallParticipant on D with status in
      {CONFIRMED, CHECKED_IN} and D.status in {PUBLISHED, COMPLETED}:
        rest_ok(D, C) = (C.starts_at - D.ends_at >= F) OR (D.starts_at - C.ends_at >= F)
      If any committed pair has NOT rest_ok -> rest violation.
      Boundary precision: a gap of exactly F seconds PASSES (>=, not >).
      If violation and waive_rest_floor == true -> create participant in WAIVER_PENDING;
      if violation and waive_rest_floor false/absent -> reject ERR_REST_FLOOR_VIOLATION.
    input_set: "the contract's committed participant calls (status CONFIRMED|CHECKED_IN on PUBLISHED|COMPLETED calls)"

  - name: room_overlap_check
    trigger: "RehearsalCall create and publish"
    algorithm: interval_merge
    formula: |
      Half-open interval semantics [starts_at, ends_at) on resource RehearsalRoom:
        two calls conflict iff A.starts_at < B.ends_at AND B.starts_at < A.ends_at.
      Back-to-back occupation (A.ends_at == B.starts_at) is ALLOWED.
      Blocking set: calls on the same room with status in {DRAFT, PUBLISHED}.
      Conflict -> ERR_ROOM_TIME_CONFLICT.

  - name: stage_changeover_check
    trigger: "StageSlot create"
    algorithm: interval_merge
    formula: |
      Buffered-adjacency semantics on the singleton STAGE resource (all productions share one stage).
      For the new slot S and every existing StageSlot T with status in {PLANNED, LOCKED, DONE}:
        required_gap_hours = RESET_BUFFER_HOURS if T.production_id == S.production_id
                             else CHANGEOVER_BUFFER_HOURS
        conflict iff (T.starts_at < S.ends_at + required_gap_hours) AND (S.starts_at < T.ends_at + required_gap_hours)
      Overlap is always a conflict (required_gap >= 2 > 0); adjacency is allowed only at gap >= buffer.
      Boundary precision: a gap of exactly the buffer PASSES (>=).
      Conflict -> ERR_STAGE_CHANGEOVER_CONFLICT.
      NOTE the deliberately different interval semantics vs room_overlap_check (strict half-open,
      zero buffer, per-room resource) — repertory rotation changeovers need buffered gaps.
    constants:
      RESET_BUFFER_HOURS: 2
      CHANGEOVER_BUFFER_HOURS: 6

  - name: casting_completeness
    trigger: "CastAssignment confirm, release, and the cover-promotion cascade"
    algorithm: aggregation
    formula: |
      Role.casting_status =
        FULLY_CAST     if exists CONFIRMED assignment with slot == PRINCIPAL AND exists >= 1 CONFIRMED assignment with slot in {COVER_1, COVER_2}
        PRINCIPAL_SET  if exists CONFIRMED assignment with slot == PRINCIPAL and no CONFIRMED cover
        UNFILLED       otherwise
    input_set: "CastAssignments of the role with status == CONFIRMED"
    precision: "n/a"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present; X-User-Role must be a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role must be permitted for this endpoint per the RBAC matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"
  - priority: 2.5
    category: auth
    check: "Entity-backed ownership: for PartnerRepresentative calls on a RentalOffer, X-User-ID must equal offer.renter_company_id"
    error_id: ERR_RENTER_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "POST /opera/rental-offers/{id}/counter, /accept, /decline"
  - priority: 3
    category: business_constraint
    check: "Request shape: required fields present; enums in range; integers positive where required; 0 < share_percentage <= 100"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all mutating endpoints"
  - priority: 3.5
    category: business_temporal
    check: "Time ranges: ends_at > starts_at; window_end > window_start"
    error_id: ERR_INVALID_TIME_RANGE
    http_status: 400
    applies_to: "POST /opera/rehearsal-calls, POST /opera/stage-slots, POST /opera/performances, POST /opera/rental-offers"
  - priority: 4
    category: existence
    check: "Path ids exist (left-to-right), then body FK ids in declared input order"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path or body ids"
  - priority: 5
    category: state
    check: "OCC: expected_production_version must equal Production.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /opera/rental-offers"
  - priority: 5.5
    category: state
    check: "Target entity state permits the requested transition/action (per-entity state machines; specific codes where declared)"
    error_id: "ERR_INVALID_STATE_TRANSITION | ERR_CALL_NOT_OPEN | ERR_CONTRACT_NOT_ACTIVE | ERR_OFFER_NOT_ACTIONABLE | ERR_SALES_NOT_OPEN | ERR_PRODUCTION_NOT_IN_REHEARSAL | ERR_PRODUCTION_NOT_IN_REPERTORY_PHASE | ERR_PERFORMANCE_NOT_ENDED | ERR_OFFER_WINDOW_NOT_ENDED | ERR_BUILD_ITEMS_NOT_DELIVERED | ERR_NO_PERFORMANCES_SCHEDULED | ERR_PRODUCTION_HAS_OPEN_COMMITMENTS | ERR_READINESS_GATE_BLOCKED"
    http_status: 409
    applies_to: "state transition and action endpoints"
  - priority: 6
    category: business_safety
    check: "Segregation of duties: waiver approver's X-User-ID != contract.created_by_user_id; settle caller's X-User-ID != offer.created_by_user_id"
    error_id: ERR_SOD_SAME_USER_FORBIDDEN
    http_status: 403
    applies_to: "POST /opera/call-participants/{id}/approve-waiver, POST /opera/rental-offers/{id}/settle"
  - priority: 7
    category: business_referential
    check: "Cross-reference integrity: cover assignments reference a PRINCIPAL on the same role (ERR_COVER_LINK_INVALID); contract.production_id == role.production_id (ERR_CROSS_PRODUCTION_REFERENCE); at most one non-terminal participant per (call, contract) (ERR_DUPLICATE_PARTICIPANT); partner kind matches usage (ERR_PARTNER_KIND_MISMATCH)"
    error_id: "ERR_COVER_LINK_INVALID | ERR_CROSS_PRODUCTION_REFERENCE | ERR_DUPLICATE_PARTICIPANT | ERR_PARTNER_KIND_MISMATCH"
    http_status: 422
    applies_to: "POST /opera/cast-assignments, POST /opera/call-participants, POST /opera/co-production-shares, POST /opera/rental-offers"
  - priority: 8
    category: business_temporal
    check: "Resource scheduling conflicts: room_overlap_check (ERR_ROOM_TIME_CONFLICT), stage_changeover_check (ERR_STAGE_CHANGEOVER_CONFLICT)"
    error_id: "ERR_ROOM_TIME_CONFLICT | ERR_STAGE_CHANGEOVER_CONFLICT"
    http_status: 409
    applies_to: "POST /opera/rehearsal-calls (+publish), POST /opera/stage-slots"
  - priority: 9
    category: business_safety
    check: "Union rest floor: rest_floor_check for the contract — unless waive_rest_floor=true (then WAIVER_PENDING)"
    error_id: ERR_REST_FLOOR_VIOLATION
    http_status: 422
    applies_to: "POST /opera/call-participants"
  - priority: 10
    category: business_constraint
    check: "Capacity/quota: seats available for hold/purchase (ERR_INSUFFICIENT_SEATS); single CONFIRMED principal per role (ERR_ROLE_PRINCIPAL_TAKEN); RATIFIED share percentage capacity <= 100 (ERR_SHARE_PERCENT_OVERFLOW); renter standing GOOD (ERR_RENTER_STANDING_NOT_GOOD); negotiation_rounds < 5 (ERR_NEGOTIATION_ROUND_LIMIT)"
    error_id: "ERR_INSUFFICIENT_SEATS | ERR_ROLE_PRINCIPAL_TAKEN | ERR_SHARE_PERCENT_OVERFLOW | ERR_RENTER_STANDING_NOT_GOOD | ERR_NEGOTIATION_ROUND_LIMIT"
    http_status: 409
    applies_to: "seat hold/release/purchase, cast confirm, share ratify, rental counter/accept"
  - priority: 11
    category: business_fiscal
    check: "Build budget: quoted_cost_cents <= production.build_cost_balance_cents at create; actual-vs-quoted delta <= balance at BUILT"
    error_id: ERR_BUILD_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /opera/build-items, POST /opera/build-items/{id}/transition {to_state: BUILT}"

