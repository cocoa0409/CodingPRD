          trigger:
            - call: "POST /cds/alerts/${al_id}/retire"
              payload: { retirement_rationale: "Two consecutive low-value windows" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
              captures: { reject_error: $.data.error_id }
            - call: "GET /cds/alerts/${al_id}"
              as: CommitteeChair
              as_user_id: "${chair_id}"
              captures: { life_after_reject: $.data.lifecycle_state, windowed_after_reject: $.data.windowed_fire_count, unwindowed_after_reject: $.data.unwindowed_fire_count }
            - call: "POST /cds/alerts/${al_id}/burden-windows/${w2_id}/reopen"
              payload: { reopen_reason: "One firing arrived late from the interface engine" }
              as: SystemAdmin
              captures: { w2_state_reopened: $.data.state, w2_index_reopened: $.data.burden_index, w2_reopen_count: $.data.reopen_count }
            - call: "POST /_events/alert-firings"
              payload: { alert_id: "${al_id}", fired_at_start: "2026-09-10T15:00:00Z", interval_seconds: 3600, fire_count: 1, override_count: 0, distinct_clinician_count: 1 }
              as: SystemAdmin
              captures: { batch3: $.data.created_event_count }
            - call: "POST /cds/alerts/${al_id}/burden-windows/${w2_id}/close"
              payload: { closure_reason: "MONITORING_PERIOD_ENDED" }
              as: SystemAdmin
              captures: { w2_fires_final: $.data.fire_count, w2_rate_final: $.data.override_rate, w2_index_final: $.data.burden_index }
            - call: "POST /cds/alerts/${al_id}/retire"
              payload: { retirement_rationale: "Two consecutive low-value windows, both now at the 40-firing floor" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
              captures: { life_final: $.data.lifecycle_state, retired_at: $.data.retired_at }
          assert:
            - "${batch1} == 40 and ${batch2} == 39 and ${batch2_last} == 2026-09-10T14:00:00Z (39 hourly firings from 2026-09-09T00:00:00Z all fall inside the half-open W2 interval)"
            - "${w1_state} == CLOSED and ${w1_reason} == SUPERSEDED_BY_NEW_WINDOW and ${w1_fires} == 40 and ${w1_rate} == 0.9000 and ${w1_index} == 72.00 — W1 clears all three criteria"
            - "${w2_fires} == 39, ${w2_overrides} == 36, ${w2_rate} == 0.9231 (round(36/39, 4)), ${w2_volume} == 0.7800, ${w2_index} == 72.00 (round(0.9231 * 1.0 * 0.7800 * 100, 2) == round(72.0018, 2)), ${w2_class} == LOW_VALUE"
            - "${reject_error} == ERR_RETIREMENT_CRITERIA_NOT_MET with HTTP 409: W2 satisfies override_rate 0.9231 >= 0.9000 and burden_index 72.00 >= 65.00 yet fails fire_count 39 >= 40 by exactly one firing, and the index gives no hint of it"
