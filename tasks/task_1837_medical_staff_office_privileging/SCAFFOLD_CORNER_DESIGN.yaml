        claim_type: optimistic_concurrency
        grounds: ['concurrency_rules[application-supersede-stale-member]', 'errors[ERR_STALE_VERSION]']
        distinguishing_aspect: "OCC on POST /mso/applications: a create carrying the member version observed before a prior successful application create (which bumped member.version) is rejected with ERR_STALE_VERSION (412); a retry with the fresh version succeeds."
        test_recipe:
          setup: ["Member created; version v0 captured; one application created (member.version advances); stale create attempted with v0"]
          setup_api_calls:
            - call: "POST /mso/members"
              payload: { full_name: "Dr. OCC", npdb_subject_id: "NPDB-OCC", primary_specialty_code: "CARD" }
              as: MedicalStaffCoordinator
              captures: { mocc_id: $.data.id, mocc_v0: $.data.version }
            - call: "POST /mso/applications"
              payload: { member_id: "${mocc_id}", application_kind: "INITIAL", expected_member_version: "${mocc_v0}" }
              as: MedicalStaffCoordinator
              captures: { aocc1_id: $.data.id }
          trigger:
            - call: "POST /mso/applications"
              payload: { member_id: "${mocc_id}", application_kind: "INITIAL", expected_member_version: "${mocc_v0}" }
              as: MedicalStaffCoordinator
              captures: { err: $.data.error_id }
            - call: "GET /mso/members/${mocc_id}"
              payload: {}
              as: MedicalStaffCoordinator
              captures: { mocc_v1: $.data.version }
            - call: "POST /mso/applications"
              payload: { member_id: "${mocc_id}", application_kind: "INITIAL", expected_member_version: "${mocc_v1}", supersedes_application_id: "${aocc1_id}" }
              as: MedicalStaffCoordinator
          assert:
            - "Stale create: error_id == ERR_STALE_VERSION (412)"
            - "Fresh create with current version + supersedes: succeeds (201)"
            - "member.version == mocc_v0 + 2 after both successful creates"

