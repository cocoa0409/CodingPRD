    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_IDENTITY_NOT_RECOGNIZED, ERR_AGREEMENT_NOT_FOUND, ERR_NOT_RESOURCE_OWNER, ERR_INVALID_REQUEST, ERR_AGREEMENT_NOT_EXECUTED, ERR_PAYMENT_EXCEEDS_BALANCE]
