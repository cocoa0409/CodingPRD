          assert:
            - "response status is 201"
            - "TitleTransfer.${xfer_id}.carried_brand_code == SALVAGE"
            - "TitleTransfer.${xfer_id}.odometer_flag == OK"
            - "TitleTransfer.${xfer_id}.status == RECORDED"
            - "TitleRecord.${title_id}.status == SUPERSEDED and is_current == false"
            - "TitleRecord.${succ_title_id}.brand_code == SALVAGE and brand_severity == 30"
            - "TitleRecord.${succ_title_id}.brand_history == [SALVAGE]"
            - "TitleRecord.${succ_title_id}.predecessor_title_id == ${title_id}"
            - "TitleRecord.${succ_title_id}.transfer_sequence == 1 and is_current == true"
            - "Vehicle.${veh_id}.last_odometer_miles == 68500 and fraud_hold == NONE"

      - name: odometer_rollback_on_transfer_flags_the_transfer_and_opens_an_auto_referral
        claim_type: chronological
        grounds:
          - calculations.odometer_continuity_replay
          - entities.TitleTransfer.fields.odometer_flag
          - state_machines.FraudReferral
          - endpoints[POST /v1/title-transfers]
        distinguishing_aspect: "The replay sorts events by effective timestamp and compares against the running maximum, so a 60000-mile conveyance behind a 68000-mile insurer reading is stamped ROLLBACK_SUSPECTED and auto-opens an ODOMETER FraudReferral with origin AUTO_CASCADE that puts the vehicle on hold."
        test_recipe:
          setup: ["a SEDAN whose insurer report recorded 68000 miles effective 2026-07-20 and whose ACTIVE SALVAGE title issued at 2026-08-01"]
          setup_api_calls:
            - call: "POST /v1/vehicles"
              payload: { vin: "1HGCM82633A007204", model_year: 2019, make: "Honda", model: "Accord", body_class: "SEDAN", registered_state_code: "NV" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { veh_id: $.data.id }
            - call: "POST /v1/damage-reports"
              payload: { vehicle_id: "${veh_id}", insurer_name: "Cascade Mutual", claim_number: "CM-92004", basis_code: "GROSS_ESTIMATE", acv_cents: 1000000, repair_estimate_cents: 800000, damage_type: "COLLISION", odometer_reading_miles: 68000, report_effective_at: "2026-07-20T00:00:00Z", total_loss_declared: true }
              as: InsurerAdjuster
              as_user_id: "adj-01"
              captures: { rep_id: $.data.id }
            - call: "POST /v1/title-records"
              payload: { vehicle_id: "${veh_id}", issuing_state_code: "NV", owner_name: "Ada Reyes", source_damage_report_id: "${rep_id}" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { title_id: $.data.id }
          trigger:
            - call: "POST /v1/title-transfers"
              payload: { from_title_id: "${title_id}", buyer_name: "Nolan Pryce", transfer_effective_at: "2026-08-05T00:00:00Z", odometer_reading_miles: 60000, sale_price_cents: 250000 }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { xfer_id: $.data.id }
          assert:
            - "response status is 201 (the conveyance is recorded, not refused)"
            - "TitleTransfer.${xfer_id}.odometer_flag == ROLLBACK_SUSPECTED"
            - "TitleTransfer.${xfer_id}.carried_brand_code == SALVAGE"
            - "GET /v1/fraud-referrals?vehicle_id=${veh_id} returns exactly 1 row"
            - "that FraudReferral has referral_type == ODOMETER, origin == AUTO_CASCADE and status == OPEN"
            - "Vehicle.${veh_id}.fraud_hold == UNDER_REFERRAL"

      - name: recordkeeping_score_with_no_documents_is_one_hundred
        claim_type: correct_result
        grounds:
          - calculations.rebuilder_recordkeeping_score
          - entities.Rebuilder.fields.recordkeeping_score_rolling
          - entities.Rebuilder.fields.recordkeeping_score_lifetime
        distinguishing_aspect: "The empty-input-set convention is 100.00, not 0.00: a rebuilder who has never filed a non-photo parts document reads recordkeeping_score_rolling 100.00 and recordkeeping_score_lifetime 100.00 on every GET."
        test_recipe:
          setup: ["a newly licensed rebuilder with no applications and no parts documents"]
          setup_api_calls:
            - call: "POST /v1/rebuilders"
              payload: { legal_name: "Sierra Rebuilders LLC", license_number: "RB-9205", license_expires_at: "2027-06-30T00:00:00Z", bond_amount_cents: 2500000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { rb_id: $.data.id }
          trigger:
            - call: "GET /v1/rebuilders/${rb_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-01"
          assert:
            - "response status is 200"
            - "Rebuilder.${rb_id}.recordkeeping_score_rolling == 100.00"
            - "Rebuilder.${rb_id}.recordkeeping_score_lifetime == 100.00"
            - "Rebuilder.${rb_id}.license_status == ACTIVE"

      - name: donor_surcharge_rounding_order_on_the_assessed_fee
        claim_type: precision
        grounds:
          - calculations.inspection_fee_assessment
        excluded_because:
          difficulty_instance: combinatorial_formula / donor_surcharge_rounds_each_line_before_summation
          rationale: "That §1.8 instance pins the per-line-then-sum rounding order with the 561-versus-562 discriminating literal."

      - name: expedite_tier_selection_on_the_total_program_charge
        claim_type: tiered_pricing
        grounds:
          - calculations.total_program_charge
        excluded_because:
          difficulty_instance: combinatorial_formula / expedite_tier_keyed_on_subtotal_not_on_running_total
          rationale: "Tier boundaries and the subtotal-versus-total keying are asserted there with literal expedite and total values."

      - name: adequacy_score_pass_threshold_boundary
        claim_type: precision
        grounds:
          - calculations.structural_adequacy_score
        excluded_because:
          difficulty_instance: boundary_precision_check / adequacy_score_exactly_seventy_passes_the_inspection
          rationale: "The >= 70.00 boundary, including the exactly-at-threshold case, is that instance's whole subject."

      - name: salvage_ratio_threshold_boundary_on_the_damage_report
        claim_type: threshold
        grounds:
          - calculations.damage_threshold_evaluation
        excluded_because:
          difficulty_instance: boundary_precision_check / damage_ratio_exactly_at_salvage_threshold_brands_but_one_ten_thousandth_below_does_not
          rationale: "The 0.7500 / 0.7499 pair at the SALVAGE_RATIO_THRESHOLD is asserted there at four-decimal precision."

      - name: recordkeeping_variant_divergence_rolling_versus_lifetime
        claim_type: variant_divergence
        grounds:
          - calculations.rebuilder_recordkeeping_score
        excluded_because:
          difficulty_instance: dual_variant_calc / recordkeeping_score_rolling_window_diverges_from_lifetime_cumulative
          rationale: "Both variants are computed over the same document set there, with the 100.00-versus-50.00 delta asserted as literals."

  # ===========================================================================
  - section: validations
    instances:
      - name: duplicate_vin_on_a_second_vehicle_create_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=45]
          - errors[ERR_DUPLICATE_NATURAL_KEY]
          - endpoints[POST /v1/vehicles]
        distinguishing_aspect: "Vehicle.vin is a declared natural key: a second create with the same 17-character VIN returns ERR_DUPLICATE_NATURAL_KEY (409) and leaves exactly one Vehicle row."
        test_recipe:
          setup: ["one vehicle already registered with vin 1HGCM82633A007301"]
          setup_api_calls:
            - call: "POST /v1/vehicles"
              payload: { vin: "1HGCM82633A007301", model_year: 2019, make: "Honda", model: "Accord", body_class: "SEDAN", registered_state_code: "NV" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { veh_id: $.data.id }
          trigger:
            - call: "POST /v1/vehicles"
              payload: { vin: "1HGCM82633A007301", model_year: 2021, make: "Toyota", model: "Camry", body_class: "SEDAN", registered_state_code: "AZ" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { err: $.data.error_id }
          assert:
            - "response status is 409 and error_id == ERR_DUPLICATE_NATURAL_KEY"
            - "Vehicle.${veh_id}.make == Honda and model_year == 2019 (the first row is untouched)"
            - "exactly one Vehicle row carries vin 1HGCM82633A007301"

      - name: rebuilder_cannot_open_an_application_naming_another_rebuilder
