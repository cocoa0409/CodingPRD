        as: ProgramCoordinator
        as_user_id: pc_carl
        captures:
          rep_oct: $.data.id
          oct_status: $.data.status
      assert:
      - ${aug_status} == DRAFT — the August report genuinely reserves [2026-08-01, 2026-09-01)
      - 'LEFT ADJACENCY ADMITTED: the September create returns 201 with ${sep_status} == DRAFT and ${sep_ps} == 2026-09-01T00:00:00Z, exactly equal to August''s period_end; a closed-interval reading would have rejected it'
      - 'SUPERSEDE side effect: ${aug_status2} == SUPERSEDED and ${aug_sup} == ${rep_sep}, while ${sep_sup} == null'
      - 'INTERIOR CONFLICT DETECTED: the [2026-09-15, 2026-10-15) create returns HTTP 409 with ${err_id} == ERR_REPORT_PERIOD_OVERLAP, because it intersects the still-DRAFT September interval — and NOT ERR_STALE_CENTER_VERSION, since ${cv3} was read immediately beforehand'
      - 'the SUPERSEDED August report does NOT contribute to that rejection: [2026-09-15, 2026-10-15) does not touch August at all, and August''s own interval is no longer reserved either'
      - after the rejection ${cv4} == ${cv3} (the failed create did not bump the centre version), CertificationReport.${rep_sep}.status is still DRAFT and its superseded_by_report_id is still null, and no fourth report row exists
      - 'RIGHT ADJACENCY ADMITTED: [2026-10-01, 2026-11-01) returns 201 with ${oct_status} == DRAFT, touching September''s period_end from the other side, and September in turn becomes SUPERSEDED with superseded_by_report_id == ${rep_oct}'
      - 'each successful create incremented the centre version exactly once: ${cv2} == ${cv1} + 1 and ${cv4} == ${cv2} + 1'
  - name: neurologist_cooldown_buffer_excludes_nine_minutes_and_admits_ten
    grounds:
