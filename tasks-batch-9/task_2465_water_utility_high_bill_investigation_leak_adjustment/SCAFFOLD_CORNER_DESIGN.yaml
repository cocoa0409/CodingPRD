            - "PaymentArrangement.${arr_id}.installment_cents == 2994 and final_installment_cents == 3005, and 2994 * 11 + 3005 == 35939 == 44939 - 9000"
            - "PaymentArrangement.${arr_id}.status == PROPOSED and reinstatement_count == 0"
            - "QUERY BY INVESTIGATION: total_count 1 returning ${arr_id}"
            - "QUERY BY BILL: total_count 1 returning ${arr_id}"
            - "QUERY BY ACCOUNT AND STATUS: total_count 1 returning ${arr_id}"
            - "ServiceAccount.${acct_id}.balance_cents == 60569 — a PROPOSED plan moves no money"

  # ===========================================================================
  # Guide section 6 — Errors (every declared error_id must be triggerable)
  # ===========================================================================
  - section: errors
    instances:

      - name: corner_error_unknown_path_ids_return_the_entity_specific_not_found_code
        claim_type: error_triggerable
        grounds:
          - errors[ERR_BILLING_PERIOD_NOT_FOUND]
          - errors[ERR_METER_TEST_REQUEST_NOT_FOUND]
          - errors[ERR_REPAIR_PROOF_NOT_FOUND]
          - errors[ERR_PAYMENT_ARRANGEMENT_NOT_FOUND]
          - errors[ERR_BOARD_APPEAL_NOT_FOUND]
          - validations[priority 4 path-parameter resolution]
        distinguishing_aspect: |
          Each collection owns its own 404 code, on reads and on action endpoints alike, and the path
          id is resolved at priority 4 — before any body validation. The action probes carry
          well-formed bodies precisely so that a 400 ERR_INVALID_REQUEST cannot mask the 404, which is
          what separates a correct priority ladder from one that validates the body first.
        test_recipe:
          setup:
            - "The clock is 2026-08-01T00:00:00Z and the store holds none of the referenced ids."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "GET /billing-periods/00000000-0000-4000-8000-000000000001"
              as: CustomerServiceRep
            - call: "GET /meter-test-requests/00000000-0000-4000-8000-000000000002"
              as: CustomerServiceRep
            - call: "GET /repair-proofs/00000000-0000-4000-8000-000000000003"
              as: CustomerServiceRep
            - call: "GET /payment-arrangements/00000000-0000-4000-8000-000000000004"
              as: CustomerServiceRep
            - call: "GET /board-appeals/00000000-0000-4000-8000-000000000005"
              as: CustomerServiceRep
            - call: "POST /meter-test-requests/00000000-0000-4000-8000-000000000002/record-bench-result"
              payload: { tested_at: "2026-08-01T10:00:00Z", low_flow_pct: 99.0, mid_flow_pct: 100.0, high_flow_pct: 100.5 }
              as: MeterTechnician
            - call: "POST /repair-proofs/00000000-0000-4000-8000-000000000003/verify"
              as: CustomerServiceRep
            - call: "POST /payment-arrangements/00000000-0000-4000-8000-000000000004/activate"
              as: CustomerServiceRep
            - call: "POST /board-appeals/00000000-0000-4000-8000-000000000005/schedule"
              payload: { hearing_date: "2026-09-01" }
              as: UtilityBoardClerk
          assert:
            - "GET /billing-periods/{unknown}: HTTP 404 with error_id ERR_BILLING_PERIOD_NOT_FOUND"
            - "GET /meter-test-requests/{unknown}: HTTP 404 with error_id ERR_METER_TEST_REQUEST_NOT_FOUND"
            - "GET /repair-proofs/{unknown}: HTTP 404 with error_id ERR_REPAIR_PROOF_NOT_FOUND"
            - "GET /payment-arrangements/{unknown}: HTTP 404 with error_id ERR_PAYMENT_ARRANGEMENT_NOT_FOUND"
            - "GET /board-appeals/{unknown}: HTTP 404 with error_id ERR_BOARD_APPEAL_NOT_FOUND"
            - "POST /meter-test-requests/{unknown}/record-bench-result: HTTP 404 ERR_METER_TEST_REQUEST_NOT_FOUND — not 409 ERR_INVALID_STATE_TRANSITION"
            - "POST /repair-proofs/{unknown}/verify: HTTP 404 ERR_REPAIR_PROOF_NOT_FOUND"
            - "POST /payment-arrangements/{unknown}/activate: HTTP 404 ERR_PAYMENT_ARRANGEMENT_NOT_FOUND"
            - "POST /board-appeals/{unknown}/schedule: HTTP 404 ERR_BOARD_APPEAL_NOT_FOUND — the well-formed hearing_date is never reached, so no 422 ERR_HEARING_NOTICE_TOO_SHORT is possible"
            - "Every response body carries exactly the error envelope fields error_id and message and no data payload"

      - name: corner_error_bill_generation_and_read_intake_guards_all_fire
        claim_type: error_triggerable
        grounds:
          - errors[ERR_BILLING_PERIOD_NOT_ENDED]
          - errors[ERR_DUPLICATE_BILL_FOR_PERIOD]
          - errors[ERR_READ_DATE_IN_FUTURE]
          - errors[ERR_NEGATIVE_CONSUMPTION]
        distinguishing_aspect: |
          Four intake guards that are easy to leave unimplemented all fire on the same fixture: a period
          whose end_date has not yet passed cannot be billed, a second live bill for the same meter and
          period is refused, a read dated after the logical clock is refused, and a register value below
          the latest live read is refused — except when read_type is CORRECTED, which is exactly how a
          downward correction is allowed to exist at all.
        test_recipe:
          setup:
            - "The clock is 2026-08-01T00:00:00Z; RS-STD-2026 exists."
            - "BillingPeriod 2025-06 (SUMMER, 2025-06-01..2025-06-30) has ended; BillingPeriod 2026-08 (SUMMER, 2026-08-01..2026-08-31) has not."
            - "ServiceAccount ACC-5006 has meter MTR-5F-1 with reads 100000 / 104000 and an ISSUED 5210-cent bill for 2025-06."
            - "ServiceAccount ACC-5007 has meter MTR-5G-1 with initial_register_value 100000 and a single read of 100000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /rate-schedules"
