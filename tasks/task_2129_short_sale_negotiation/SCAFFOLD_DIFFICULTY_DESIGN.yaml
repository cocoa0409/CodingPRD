  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: lien_state_check_beats_contribution_cap_check
        grounds:
          - validations[priority=40]
          - validations[priority=74]
          - errors[ERR_LIEN_NOT_ACTIONABLE]
          - errors[ERR_LIEN_CONTRIBUTION_EXCEEDS_CAP]
          - state_machines.JuniorLien.DEMAND_SENT_to_APPROVED
        distinguishing_aspect: |
          Error-category pair (state, business_fiscal): a single response
          violates both the state precondition (the lien is still IDENTIFIED, so
          APPROVE is not a declared transition) and the fiscal cap
          (contribution_cents 4200000 exceeds balance_cents 3500000); priority 40
          wins, so the response is ERR_LIEN_NOT_ACTIONABLE (409), never
          ERR_LIEN_CONTRIBUTION_EXCEEDS_CAP (422).
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z."
            - "One GSE ShortSaleCase."
            - "One JuniorLien at position 2 with balance_cents 3500000, still in IDENTIFIED (no demand has been sent), holder_user_id jlh-700."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-900"
            - call: "POST /short-sale/cases"
              payload: { property_address: "17 Basin Ct, Reno NV", investor_type: "GSE", unpaid_principal_balance_cents: 26800000, servicer_name: "Cascade Servicing" }
              as: Negotiator
              as_user_id: "neg-001"
              captures: { case_id: $.data.id }
            - call: "POST /short-sale/cases/${case_id}/junior-liens"
              payload: { lien_position: 2, holder_name: "Truckee Credit Union", holder_user_id: "jlh-700", balance_cents: 3500000 }
              as: Negotiator
              as_user_id: "neg-001"
              captures: { lien_id: $.data.id }
          trigger:
            - call: "POST /short-sale/junior-liens/${lien_id}/response"
              payload: { outcome: "APPROVE", contribution_cents: 4200000 }
              as: JuniorLienHolder
              as_user_id: "jlh-700"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response data.error_id == ERR_LIEN_NOT_ACTIONABLE"
            - "response data.error_id != ERR_LIEN_CONTRIBUTION_EXCEEDS_CAP"
            - "JuniorLien.${lien_id}.status == IDENTIFIED"
            - "JuniorLien.${lien_id}.approved_contribution_cents == 0"
            - "ShortSaleCase.${case_id}.junior_contribution_total_cents == 0"

      - name: junior_lien_unresolved_beats_net_below_minimum_on_issuance
        grounds:
          - validations[priority=63]
          - validations[priority=78]
          - errors[ERR_JUNIOR_LIEN_UNRESOLVED]
          - errors[ERR_NET_BELOW_MINIMUM]
          - calculations.minimum_acceptable_net
        distinguishing_aspect: |
          Error-category pair (business_referential, business_fiscal) - a
          different pair from the state/fiscal conflict above: the issuance both
          leaves a JuniorLien in NEGOTIATING and offers 20000000 against a
          minimum_acceptable_net_cents of 21426000; priority 63 wins, so the
          response is ERR_JUNIOR_LIEN_UNRESOLVED (422), never
          ERR_NET_BELOW_MINIMUM (422).
        test_recipe:
          setup:
            - "Logical clock at 2026-08-24T00:00:00Z."
            - "One GSE ShortSaleCase, UPB 26800000, package ACCEPTED, Listing since 2026-08-05."
