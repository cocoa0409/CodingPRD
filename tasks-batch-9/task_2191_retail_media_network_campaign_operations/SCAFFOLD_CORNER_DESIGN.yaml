          - state_machines.LineItem.SERVING_to_MANUAL_PAUSED
        distinguishing_aspect: "A slot-side maintenance switch is a cross-entity side effect on line items owned by a different aggregate: the SERVING line item flips to MANUAL_PAUSED with pause_reason MANUAL while the campaign — having no SERVING children left — rolls up to PAUSED."
        test_recipe:
          setup: ["Baseline chain through line item activation (slot OPEN with occupancy_count 1, LineItem SERVING)."]
          setup_api_calls:
            - *c_adv
            - *c_adv_sub
            - *c_adv_kyc
            - *c_plan
