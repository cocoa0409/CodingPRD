            - { call: "POST /mutual-aid/timesheets", payload: { crew_id: "${crew_id}", work_date: "2026-05-04", day_classification: "WORK", reported_work_minutes: 600 }, as: CrewSupervisor, as_user_id: "${crew_id}", captures: { ts1_id: "$.data.id" } }
