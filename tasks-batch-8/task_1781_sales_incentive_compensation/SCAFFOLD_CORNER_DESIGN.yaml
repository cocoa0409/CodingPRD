# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Sales Incentive Compensation Administration
# Flat curve [{attainment_floor_bps: 0, rate_bps: 1000}] (10%) is used wherever
# the curve shape is irrelevant; the canonical 3-tier curve (see difficulty
# file header) is used where attainment tiers matter.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: program_creation_defaults
        claim_type: defaults
        grounds: [entities.CompProgram.fields.current_period_index, entities.CompProgram.fields.accrued_balance_cents]
        distinguishing_aspect: "A new program starts with current_period_index == 1, accrued_balance_cents == 0, version == 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /programs", payload: { name: "Prog Zero" }, as: CompAdmin, captures: { pz_id: $.data.id, pz_period: $.data.current_period_index, pz_accr: $.data.accrued_balance_cents, pz_v: $.data.version } }
          assert:
            - "CompProgram.${pz_id}.current_period_index == 1"
            - "CompProgram.${pz_id}.accrued_balance_cents == 0"
            - "CompProgram.${pz_id}.version == 1"

      - name: plan_creation_defaults_and_creator_recording
        claim_type: defaults
        grounds: [entities.CompPlan.fields.attainment_mode, entities.CompPlan.fields.document_version, entities.CompPlan.fields.created_by_user_id]
        distinguishing_aspect: "Omitting optional plan inputs yields attainment_mode DIRECT_ONLY, rollup_rate_bps 0, payout_cap_cents null, document_version 1, status DRAFT; created_by_user_id records the creator's X-User-ID."
        test_recipe:
          setup: ["one program exists"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog PD" }, as: CompAdmin, captures: { ppd: $.data.id } }
          trigger:
            - { call: "POST /plans", payload: { program_id: "${ppd}", name: "Plan PD", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }] }, as: CompAdmin, as_user_id: "admin-1", captures: { plan_pd: $.data.id, pd_mode: $.data.attainment_mode, pd_roll: $.data.rollup_rate_bps, pd_cap: $.data.payout_cap_cents, pd_doc: $.data.document_version, pd_status: $.data.status, pd_creator: $.data.created_by_user_id } }
          assert:
            - "status == DRAFT, document_version == 1"
            - "attainment_mode == DIRECT_ONLY, rollup_rate_bps == 0, payout_cap_cents == null"
            - "created_by_user_id == 'admin-1'"

      - name: assignment_creation_defaults
        claim_type: defaults
        grounds: [entities.PlanAssignment.fields.draw_recoverable, entities.PlanAssignment.fields.acceptance_status]
        distinguishing_aspect: "Omitting draw/guarantee inputs yields draw_amount 0, draw_recoverable true, guarantee 0, acceptance OFFERED, status ACTIVE, draw_outstanding 0."
        test_recipe:
          setup: ["program with PUBLISHED plan; one rep"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog AD" }, as: CompAdmin, captures: { pad: $.data.id } }
            - { call: "POST /plans", payload: { program_id: "${pad}", name: "Plan AD", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }] }, as: CompAdmin, as_user_id: "admin-1", captures: { plan_ad: $.data.id } }
            - { call: "POST /plans/${plan_ad}/publish", payload: {}, as: CompAdmin, as_user_id: "admin-2" }
            - { call: "POST /reps", payload: { program_id: "${pad}", name: "Rep AD", employee_ref: "AD-R1" }, as: CompAdmin, captures: { rad: $.data.id } }
          trigger:
            - { call: "POST /assignments", payload: { program_id: "${pad}", rep_id: "${rad}", plan_id: "${plan_ad}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_ad: $.data.id, ad_draw: $.data.draw_amount_cents_per_period, ad_rec: $.data.draw_recoverable, ad_guar: $.data.guarantee_amount_cents_per_period, ad_acc: $.data.acceptance_status, ad_status: $.data.status, ad_out: $.data.draw_outstanding_cents } }
          assert:
            - "draw_amount_cents_per_period == 0, draw_recoverable == true, guarantee_amount_cents_per_period == 0"
            - "status == ACTIVE, acceptance_status == OFFERED, draw_outstanding_cents == 0, accepted_document_version == null"

      - name: credit_entry_computed_fields_on_post
        claim_type: computed_fields
        grounds: [entities.CreditEntry.fields.credit_amount_cents, entities.CreditEntry.fields.posted_period_index, entities.CreditEntry.fields.credit_type]
        distinguishing_aspect: "A single 10000-bps split yields exactly one DIRECT credit with credit_amount_cents == amount, status POSTED, posted_period_index == current period, parent_credit_id null — all system/computed, none client-settable."
        test_recipe:
          setup: ["program with PUBLISHED plan; rep with ACCEPTED assignment"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog CE" }, as: CompAdmin, captures: { pce: $.data.id } }
            - { call: "POST /plans", payload: { program_id: "${pce}", name: "Plan CE", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }] }, as: CompAdmin, as_user_id: "admin-1", captures: { plan_ce: $.data.id } }
            - { call: "POST /plans/${plan_ce}/publish", payload: {}, as: CompAdmin, as_user_id: "admin-2" }
            - { call: "POST /reps", payload: { program_id: "${pce}", name: "Rep CE", employee_ref: "CE-R1" }, as: CompAdmin, captures: { rce: $.data.id } }
            - { call: "POST /assignments", payload: { program_id: "${pce}", rep_id: "${rce}", plan_id: "${plan_ce}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_ce: $.data.id } }
            - { call: "POST /assignments/${asg_ce}/accept", payload: {}, as: Rep, as_user_id: "${rce}" }
          trigger:
            - { call: "POST /transactions", payload: { program_id: "${pce}", external_ref: "CE-T1", amount_cents: 200000, transaction_date: "2026-02-01", splits: [{ rep_id: "${rce}", split_bps: 10000 }] }, as: CompAnalyst, captures: { txn_ce: $.data.id } }
            - { call: "GET /credit-entries?transaction_id=${txn_ce}", as: CompAdmin, captures: { ce_amt: "$.data[0].credit_amount_cents", ce_status: "$.data[0].status", ce_type: "$.data[0].credit_type", ce_pp: "$.data[0].posted_period_index", ce_par: "$.data[0].parent_credit_id" } }
          assert:
            - "credit_amount_cents == 200000, credit_type == DIRECT, status == POSTED"
            - "posted_period_index == 1, parent_credit_id == null"

      - name: payroll_export_immutable_record
        claim_type: immutability
        grounds: [entities.PayrollExport]
        distinguishing_aspect: "PayrollExport has common_fields: false — the create response carries id and created_at but no version/updated_at, and no endpoint mutates it."
        test_recipe:
          setup: ["program with one APPROVED statement for period 1 (rep accepted, txn 200000, close, approve)"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog PE" }, as: CompAdmin, captures: { ppe: $.data.id, pv_pe: $.data.version } }
            - { call: "POST /plans", payload: { program_id: "${ppe}", name: "Plan PE", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }] }, as: CompAdmin, as_user_id: "admin-1", captures: { plan_pe: $.data.id } }
            - { call: "POST /plans/${plan_pe}/publish", payload: {}, as: CompAdmin, as_user_id: "admin-2" }
            - { call: "POST /reps", payload: { program_id: "${ppe}", name: "Rep PE", employee_ref: "PE-R1" }, as: CompAdmin, captures: { rpe: $.data.id } }
            - { call: "POST /assignments", payload: { program_id: "${ppe}", rep_id: "${rpe}", plan_id: "${plan_pe}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_pe: $.data.id } }
            - { call: "POST /assignments/${asg_pe}/accept", payload: {}, as: Rep, as_user_id: "${rpe}" }
            - { call: "POST /transactions", payload: { program_id: "${ppe}", external_ref: "PE-T1", amount_cents: 200000, transaction_date: "2026-02-01", splits: [{ rep_id: "${rpe}", split_bps: 10000 }] }, as: CompAnalyst }
            - { call: "POST /programs/${ppe}/close-period", payload: { expected_program_version: "${pv_pe}" }, as: CompAdmin }
            - { call: "GET /statements?assignment_id=${asg_pe}&period_index=1", as: CompAdmin, captures: { st_pe: "$.data[0].id" } }
            - { call: "POST /statements/${st_pe}/approve", payload: {}, as: CompManager }
          trigger:
            - { call: "POST /payroll-exports", payload: { program_id: "${ppe}", period_index: 1 }, as: CompAdmin, captures: { exp_pe: $.data.id, exp_total: $.data.total_cents, exp_count: $.data.statement_count } }
          assert:
            - "PayrollExport.${exp_pe}.total_cents == 20000 and statement_count == 1"
            - "response data contains id and created_at but NO version or updated_at keys (common_fields: false)"
            - "GET /programs/${ppe}/payroll-exports returns exactly this one export"

      - name: plan_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent plan id returns 404 ERR_NOT_FOUND in the error envelope."
        test_recipe:
          setup: ["one program exists (content irrelevant)"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog NF" }, as: CompAdmin }
          trigger:
            - { call: "GET /plans/00000000-0000-0000-0000-000000000000", as: CompAdmin, captures: { err_nf: $.data.error_id } }
          assert:
            - "HTTP 404 with error_id == ERR_NOT_FOUND"

      - name: rep_read_foreign_assignment_not_found
        claim_type: not_found
        grounds: ["validations[priority=3]", "roles.Rep"]
        distinguishing_aspect: "Ownership hiding: Rep B reading Rep A's assignment gets 404 ERR_NOT_FOUND (not 403) — foreign resources behave as absent for entity_backed Rep callers."
        test_recipe:
          setup: ["program with PUBLISHED plan; reps A and B; assignment owned by A"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog OH" }, as: CompAdmin, captures: { poh: $.data.id } }
            - { call: "POST /plans", payload: { program_id: "${poh}", name: "Plan OH", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }] }, as: CompAdmin, as_user_id: "admin-1", captures: { plan_oh: $.data.id } }
            - { call: "POST /plans/${plan_oh}/publish", payload: {}, as: CompAdmin, as_user_id: "admin-2" }
            - { call: "POST /reps", payload: { program_id: "${poh}", name: "Rep A", employee_ref: "OH-RA" }, as: CompAdmin, captures: { roha: $.data.id } }
            - { call: "POST /reps", payload: { program_id: "${poh}", name: "Rep B", employee_ref: "OH-RB" }, as: CompAdmin, captures: { rohb: $.data.id } }
            - { call: "POST /assignments", payload: { program_id: "${poh}", rep_id: "${roha}", plan_id: "${plan_oh}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_oh: $.data.id } }
          trigger:
            - { call: "GET /assignments/${asg_oh}", as: Rep, as_user_id: "${rohb}", captures: { err_oh: $.data.error_id } }
          assert:
            - "HTTP 404 with error_id == ERR_NOT_FOUND when Rep ${rohb} reads Rep ${roha}'s assignment"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: plan_revise_after_archive_rejected
        claim_type: terminal_lockdown
        grounds: ["state_machines.CompPlan", "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "ARCHIVED is terminal: revise on an archived plan fails with ERR_INVALID_STATE_TRANSITION even with the correct OCC version."
        test_recipe:
          setup: ["plan published then archived (no assignments)"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog TA" }, as: CompAdmin, captures: { pta: $.data.id } }
            - { call: "POST /plans", payload: { program_id: "${pta}", name: "Plan TA", effective_start_date: "2026-01-01", effective_end_date: "2026-06-30", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }] }, as: CompAdmin, as_user_id: "admin-1", captures: { plan_ta: $.data.id } }
            - { call: "POST /plans/${plan_ta}/publish", payload: {}, as: CompAdmin, as_user_id: "admin-2" }
            - { call: "POST /plans/${plan_ta}/archive", payload: {}, as: CompAdmin, captures: { plan_ta_v: $.data.version } }
          trigger:
            - { call: "POST /plans/${plan_ta}/revise", payload: { expected_plan_version: "${plan_ta_v}" }, as: CompAdmin, as_user_id: "admin-2", captures: { err_ta: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION, HTTP 409"
            - "CompPlan.${plan_ta}.status remains ARCHIVED, document_version still 1"

      - name: transaction_double_cancel_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.SalesTransaction.BOOKED_to_CANCELLED", "errors[ERR_TRANSACTION_ALREADY_CANCELLED]"]
        distinguishing_aspect: "Second cancel of a CANCELLED transaction fails with the domain error ERR_TRANSACTION_ALREADY_CANCELLED; the first cancel's reversals are not re-applied."
        test_recipe:
          setup: ["program, published plan, accepted rep, transaction 200000 booked and already cancelled once"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog DC" }, as: CompAdmin, captures: { pdc: $.data.id } }
            - { call: "POST /plans", payload: { program_id: "${pdc}", name: "Plan DC", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }] }, as: CompAdmin, as_user_id: "admin-1", captures: { plan_dc: $.data.id } }
            - { call: "POST /plans/${plan_dc}/publish", payload: {}, as: CompAdmin, as_user_id: "admin-2" }
            - { call: "POST /reps", payload: { program_id: "${pdc}", name: "Rep DC", employee_ref: "DC-R1" }, as: CompAdmin, captures: { rdc: $.data.id } }
            - { call: "POST /assignments", payload: { program_id: "${pdc}", rep_id: "${rdc}", plan_id: "${plan_dc}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_dc: $.data.id } }
            - { call: "POST /assignments/${asg_dc}/accept", payload: {}, as: Rep, as_user_id: "${rdc}" }
            - { call: "POST /transactions", payload: { program_id: "${pdc}", external_ref: "DC-T1", amount_cents: 200000, transaction_date: "2026-02-01", splits: [{ rep_id: "${rdc}", split_bps: 10000 }] }, as: CompAnalyst, captures: { txn_dc: $.data.id } }
            - { call: "POST /transactions/${txn_dc}/cancel", payload: {}, as: CompAnalyst }
          trigger:
            - { call: "POST /transactions/${txn_dc}/cancel", payload: {}, as: CompAnalyst, captures: { err_dc: $.data.error_id } }
          assert:
            - "error_id == ERR_TRANSACTION_ALREADY_CANCELLED, HTTP 409"
            - "PlanAssignment.${asg_dc}.current_period_earned_cents == 0 (reversal applied exactly once)"

      - name: statement_approve_after_export_rejected
        claim_type: terminal_lockdown
        grounds: ["state_machines.PayoutStatement.APPROVED_to_EXPORTED", "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "EXPORTED is terminal: approving an exported statement fails with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["statement for period 1 exported via payroll export"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog SX" }, as: CompAdmin, captures: { psx: $.data.id, pv_sx: $.data.version } }
            - { call: "POST /plans", payload: { program_id: "${psx}", name: "Plan SX", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }] }, as: CompAdmin, as_user_id: "admin-1", captures: { plan_sx: $.data.id } }
            - { call: "POST /plans/${plan_sx}/publish", payload: {}, as: CompAdmin, as_user_id: "admin-2" }
            - { call: "POST /reps", payload: { program_id: "${psx}", name: "Rep SX", employee_ref: "SX-R1" }, as: CompAdmin, captures: { rsx: $.data.id } }
            - { call: "POST /assignments", payload: { program_id: "${psx}", rep_id: "${rsx}", plan_id: "${plan_sx}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_sx: $.data.id } }
            - { call: "POST /assignments/${asg_sx}/accept", payload: {}, as: Rep, as_user_id: "${rsx}" }
            - { call: "POST /transactions", payload: { program_id: "${psx}", external_ref: "SX-T1", amount_cents: 200000, transaction_date: "2026-02-01", splits: [{ rep_id: "${rsx}", split_bps: 10000 }] }, as: CompAnalyst }
            - { call: "POST /programs/${psx}/close-period", payload: { expected_program_version: "${pv_sx}" }, as: CompAdmin }
            - { call: "GET /statements?assignment_id=${asg_sx}&period_index=1", as: CompAdmin, captures: { st_sx: "$.data[0].id" } }
            - { call: "POST /statements/${st_sx}/approve", payload: {}, as: CompManager }
            - { call: "POST /payroll-exports", payload: { program_id: "${psx}", period_index: 1 }, as: CompAdmin }
          trigger:
            - { call: "POST /statements/${st_sx}/approve", payload: {}, as: CompManager, captures: { err_sx: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION, HTTP 409; statement stays EXPORTED"

      - name: adjustment_approve_after_reject_rejected
        claim_type: terminal_lockdown
        grounds: ["state_machines.Adjustment.PENDING_APPROVAL_to_REJECTED", "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "REJECTED is terminal for adjustments: a later approve fails with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["accepted rep; manual adjustment created by analyst and rejected by manager"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog AR" }, as: CompAdmin, captures: { par: $.data.id } }
            - { call: "POST /plans", payload: { program_id: "${par}", name: "Plan AR", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }] }, as: CompAdmin, as_user_id: "admin-1", captures: { plan_ar: $.data.id } }
            - { call: "POST /plans/${plan_ar}/publish", payload: {}, as: CompAdmin, as_user_id: "admin-2" }
            - { call: "POST /reps", payload: { program_id: "${par}", name: "Rep AR", employee_ref: "AR-R1" }, as: CompAdmin, captures: { rar: $.data.id } }
            - { call: "POST /assignments", payload: { program_id: "${par}", rep_id: "${rar}", plan_id: "${plan_ar}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_ar: $.data.id } }
            - { call: "POST /adjustments", payload: { assignment_id: "${asg_ar}", amount_cents: 5000, reason: "correction" }, as: CompAnalyst, as_user_id: "ops-1", captures: { adj_ar: $.data.id } }
            - { call: "POST /adjustments/${adj_ar}/reject", payload: {}, as: CompManager }
          trigger:
            - { call: "POST /adjustments/${adj_ar}/approve", payload: {}, as: CompManager, captures: { err_ar: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION, HTTP 409; adjustment stays REJECTED"

      - name: assignment_terminate_reverses_pending_and_posted_credits
        claim_type: side_effect_execution
        grounds: [state_machines.PlanAssignment.terminate, state_machines.CreditEntry.PENDING_to_REVERSED]
        distinguishing_aspect: "Termination compensation: an OFFERED assignment's PENDING credit (50000) flips to REVERSED with no earned impact, while an ACCEPTED assignment's current-period POSTED credit (70000) flips to REVERSED and decrements current_period_earned_cents back to 0."
        test_recipe:
          setup:
            - "Program, published plan; rep A with assignment left OFFERED and a 50000 transaction (credit PENDING); rep B with ACCEPTED assignment and a 70000 transaction (credit POSTED, earned 70000)"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog TC" }, as: CompAdmin, captures: { ptc: $.data.id } }
            - { call: "POST /plans", payload: { program_id: "${ptc}", name: "Plan TC", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }] }, as: CompAdmin, as_user_id: "admin-1", captures: { plan_tc: $.data.id } }
            - { call: "POST /plans/${plan_tc}/publish", payload: {}, as: CompAdmin, as_user_id: "admin-2" }
            - { call: "POST /reps", payload: { program_id: "${ptc}", name: "Rep TCA", employee_ref: "TC-RA" }, as: CompAdmin, captures: { rtca: $.data.id } }
            - { call: "POST /reps", payload: { program_id: "${ptc}", name: "Rep TCB", employee_ref: "TC-RB" }, as: CompAdmin, captures: { rtcb: $.data.id } }
            - { call: "POST /assignments", payload: { program_id: "${ptc}", rep_id: "${rtca}", plan_id: "${plan_tc}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_tca: $.data.id } }
            - { call: "POST /assignments", payload: { program_id: "${ptc}", rep_id: "${rtcb}", plan_id: "${plan_tc}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_tcb: $.data.id } }
            - { call: "POST /assignments/${asg_tcb}/accept", payload: {}, as: Rep, as_user_id: "${rtcb}" }
            - { call: "POST /transactions", payload: { program_id: "${ptc}", external_ref: "TC-TA", amount_cents: 50000, transaction_date: "2026-02-01", splits: [{ rep_id: "${rtca}", split_bps: 10000 }] }, as: CompAnalyst, captures: { txn_tca: $.data.id } }
            - { call: "POST /transactions", payload: { program_id: "${ptc}", external_ref: "TC-TB", amount_cents: 70000, transaction_date: "2026-02-01", splits: [{ rep_id: "${rtcb}", split_bps: 10000 }] }, as: CompAnalyst, captures: { txn_tcb: $.data.id } }
          trigger:
            - { call: "POST /assignments/${asg_tca}/terminate", payload: {}, as: CompAdmin }
            - { call: "POST /assignments/${asg_tcb}/terminate", payload: {}, as: CompAdmin }
            - { call: "GET /credit-entries?transaction_id=${txn_tca}", as: CompAdmin, captures: { tca_cr: "$.data[0].status" } }
            - { call: "GET /credit-entries?transaction_id=${txn_tcb}", as: CompAdmin, captures: { tcb_cr: "$.data[0].status" } }
            - { call: "GET /assignments/${asg_tcb}", as: CompAdmin, captures: { tcb_earned: "$.data.current_period_earned_cents", tcb_status: "$.data.status" } }
          assert:
            - "rep A credit (was PENDING): status == REVERSED"
            - "rep B credit (was POSTED): status == REVERSED"
            - "PlanAssignment.${asg_tcb}.current_period_earned_cents == 0 (70000 reversed out) and status == TERMINATED"

      - name: decline_then_revise_reoffers_document
        claim_type: valid_transition
        grounds: [state_machines.PlanAssignment.DECLINED_to_OFFERED]
        distinguishing_aspect: "The revise cascade re-offers not only ACCEPTED but also DECLINED assignments: a declined assignment returns to OFFERED when a new document version is issued."
        test_recipe:
          setup: ["published plan; rep with assignment DECLINED"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog RO2" }, as: CompAdmin, captures: { pro2: $.data.id } }
            - { call: "POST /plans", payload: { program_id: "${pro2}", name: "Plan RO2", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }] }, as: CompAdmin, as_user_id: "admin-1", captures: { plan_ro2: $.data.id } }
            - { call: "POST /plans/${plan_ro2}/publish", payload: {}, as: CompAdmin, as_user_id: "admin-2", captures: { plan_ro2_v: $.data.version } }
            - { call: "POST /reps", payload: { program_id: "${pro2}", name: "Rep RO2", employee_ref: "RO2-R1" }, as: CompAdmin, captures: { rro2: $.data.id } }
            - { call: "POST /assignments", payload: { program_id: "${pro2}", rep_id: "${rro2}", plan_id: "${plan_ro2}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_ro2: $.data.id } }
            - { call: "POST /assignments/${asg_ro2}/decline", payload: {}, as: Rep, as_user_id: "${rro2}" }
          trigger:
            - { call: "POST /plans/${plan_ro2}/revise", payload: { expected_plan_version: "${plan_ro2_v}" }, as: CompAdmin, as_user_id: "admin-2" }
            - { call: "GET /assignments/${asg_ro2}", as: CompAdmin, captures: { ro2_acc: "$.data.acceptance_status" } }
          assert:
            - "PlanAssignment.${asg_ro2}.acceptance_status == OFFERED after revise (DECLINED -> OFFERED)"

      - name: dispute_withdraw_branch_has_no_adjustment
        claim_type: side_effect_execution
        grounds: [state_machines.Dispute.UNDER_REVIEW_to_WITHDRAWN]
        excluded_because:
          difficulty_instance: dispute_branching_fork_with_divergent_side_effects
          rationale: "The WITHDRAWN branch and its empty adjustment set are asserted in the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: curve_input_set_excludes_same_period_reversals
        claim_type: input_set_filtering
        grounds: [calculations.period_settlement, state_machines.CreditEntry.POSTED_to_REVERSED]
        distinguishing_aspect: "A credit POSTED and REVERSED within the same open period leaves no trace in the statement: earned_credits_cents == 0, no clawback adjustment is created (that path is only for LOCKED credits), gross == 0."
        test_recipe:
          setup: ["accepted rep; transaction 200000 POSTED in period 1 then cancelled while period 1 is still open"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog ISR" }, as: CompAdmin, captures: { pisr: $.data.id, pv_isr: $.data.version } }
            - { call: "POST /plans", payload: { program_id: "${pisr}", name: "Plan ISR", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }] }, as: CompAdmin, as_user_id: "admin-1", captures: { plan_isr: $.data.id } }
            - { call: "POST /plans/${plan_isr}/publish", payload: {}, as: CompAdmin, as_user_id: "admin-2" }
            - { call: "POST /reps", payload: { program_id: "${pisr}", name: "Rep ISR", employee_ref: "ISR-R1" }, as: CompAdmin, captures: { risr: $.data.id } }
            - { call: "POST /assignments", payload: { program_id: "${pisr}", rep_id: "${risr}", plan_id: "${plan_isr}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_isr: $.data.id } }
            - { call: "POST /assignments/${asg_isr}/accept", payload: {}, as: Rep, as_user_id: "${risr}" }
            - { call: "POST /transactions", payload: { program_id: "${pisr}", external_ref: "ISR-T1", amount_cents: 200000, transaction_date: "2026-02-01", splits: [{ rep_id: "${risr}", split_bps: 10000 }] }, as: CompAnalyst, captures: { txn_isr: $.data.id } }
            - { call: "POST /transactions/${txn_isr}/cancel", payload: {}, as: CompAnalyst }
          trigger:
            - { call: "POST /programs/${pisr}/close-period", payload: { expected_program_version: "${pv_isr}" }, as: CompAdmin }
            - { call: "GET /statements?assignment_id=${asg_isr}&period_index=1", as: CompAdmin, captures: { isr_earned: "$.data[0].earned_credits_cents", isr_adj: "$.data[0].adjustments_cents", isr_gross: "$.data[0].gross_payout_cents" } }
            - { call: "GET /adjustments?assignment_id=${asg_isr}", as: CompAdmin }
          assert:
            - "statement earned_credits_cents == 0 and adjustments_cents == 0 (no CLAWBACK row exists for same-period reversals)"
            - "gross_payout_cents == 0, attainment_bps == 0, net_payable_cents == 0"
            - "GET /adjustments?assignment_id=${asg_isr} returns an empty array"

      - name: split_negative_remainder_goes_to_lowest_index_on_tie
        claim_type: precision
        grounds: [calculations.split_credit_allocation]
        distinguishing_aspect: "99999 split 5000/5000 rounds each half-up to 50000 (sum 100000), so the remainder is -1; with tied split_bps the lowest array index absorbs it: 49999 / 50000. Complements the +1 remainder case in §1.8."
        test_recipe:
          setup: ["program, published plan, two manager-less reps with ACCEPTED assignments"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog NR" }, as: CompAdmin, captures: { pnr: $.data.id } }
            - { call: "POST /plans", payload: { program_id: "${pnr}", name: "Plan NR", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }] }, as: CompAdmin, as_user_id: "admin-1", captures: { plan_nr: $.data.id } }
            - { call: "POST /plans/${plan_nr}/publish", payload: {}, as: CompAdmin, as_user_id: "admin-2" }
            - { call: "POST /reps", payload: { program_id: "${pnr}", name: "NR Rep1", employee_ref: "NR-R1" }, as: CompAdmin, captures: { nr1: $.data.id } }
            - { call: "POST /reps", payload: { program_id: "${pnr}", name: "NR Rep2", employee_ref: "NR-R2" }, as: CompAdmin, captures: { nr2: $.data.id } }
            - { call: "POST /assignments", payload: { program_id: "${pnr}", rep_id: "${nr1}", plan_id: "${plan_nr}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_nr1: $.data.id } }
            - { call: "POST /assignments/${asg_nr1}/accept", payload: {}, as: Rep, as_user_id: "${nr1}" }
            - { call: "POST /assignments", payload: { program_id: "${pnr}", rep_id: "${nr2}", plan_id: "${plan_nr}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_nr2: $.data.id } }
            - { call: "POST /assignments/${asg_nr2}/accept", payload: {}, as: Rep, as_user_id: "${nr2}" }
          trigger:
            - { call: "POST /transactions", payload: { program_id: "${pnr}", external_ref: "NR-T1", amount_cents: 99999, transaction_date: "2026-02-01", splits: [{ rep_id: "${nr1}", split_bps: 5000 }, { rep_id: "${nr2}", split_bps: 5000 }] }, as: CompAnalyst, captures: { txn_nr: $.data.id } }
            - { call: "GET /credit-entries?transaction_id=${txn_nr}&rep_id=${nr1}", as: CompAdmin, captures: { nr1_amt: "$.data[0].credit_amount_cents" } }
            - { call: "GET /credit-entries?transaction_id=${txn_nr}&rep_id=${nr2}", as: CompAdmin, captures: { nr2_amt: "$.data[0].credit_amount_cents" } }
          assert:
            - "first split (tie, lowest index) absorbs -1: credit of ${nr1} == 49999"
            - "credit of ${nr2} == 50000"
            - "49999 + 50000 == 99999 == transaction amount"

      - name: rollup_pending_until_manager_accepts
        claim_type: input_set_filtering
        grounds: [calculations.rollup_credit_amount, state_machines.CreditEntry.PENDING_to_POSTED]
        distinguishing_aspect: "The rollup spawn requires only an ACTIVE manager assignment: with the manager OFFERED the rollup lands PENDING (posted_period_index null, earned unchanged); the manager's later accept posts it (posted_period_index == 1, earned += 100000)."
        test_recipe:
          setup: ["published plan rollup_rate_bps 5000; manager M with assignment left OFFERED; rep R (manager M) ACCEPTED; transaction 200000 to R"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog RP" }, as: CompAdmin, captures: { prp: $.data.id } }
            - { call: "POST /plans", payload: { program_id: "${prp}", name: "Plan RP", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }], rollup_rate_bps: 5000 }, as: CompAdmin, as_user_id: "admin-1", captures: { plan_rp: $.data.id } }
            - { call: "POST /plans/${plan_rp}/publish", payload: {}, as: CompAdmin, as_user_id: "admin-2" }
            - { call: "POST /reps", payload: { program_id: "${prp}", name: "Mgr RP", employee_ref: "RP-M1" }, as: CompAdmin, captures: { mrp: $.data.id } }
            - { call: "POST /reps", payload: { program_id: "${prp}", name: "Rep RP", employee_ref: "RP-R1", manager_id: "${mrp}" }, as: CompAdmin, captures: { rrp: $.data.id } }
            - { call: "POST /assignments", payload: { program_id: "${prp}", rep_id: "${mrp}", plan_id: "${plan_rp}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_mrp: $.data.id } }
            - { call: "POST /assignments", payload: { program_id: "${prp}", rep_id: "${rrp}", plan_id: "${plan_rp}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_rrp: $.data.id } }
            - { call: "POST /assignments/${asg_rrp}/accept", payload: {}, as: Rep, as_user_id: "${rrp}" }
          trigger:
            - { call: "POST /transactions", payload: { program_id: "${prp}", external_ref: "RP-T1", amount_cents: 200000, transaction_date: "2026-02-01", splits: [{ rep_id: "${rrp}", split_bps: 10000 }] }, as: CompAnalyst, captures: { txn_rp: $.data.id } }
            - { call: "GET /credit-entries?transaction_id=${txn_rp}&rep_id=${rrp}", as: CompAdmin, captures: { rp_direct: "$.data[0].id" } }
            - { call: "GET /credit-entries?parent_credit_id=${rp_direct}", as: CompAdmin, captures: { rp_roll_status1: "$.data[0].status", rp_roll_pp1: "$.data[0].posted_period_index" } }
            - { call: "GET /assignments/${asg_mrp}", as: CompAdmin, captures: { mrp_earned1: "$.data.current_period_earned_cents" } }
            - { call: "POST /assignments/${asg_mrp}/accept", payload: {}, as: Rep, as_user_id: "${mrp}" }
            - { call: "GET /credit-entries?parent_credit_id=${rp_direct}", as: CompAdmin, captures: { rp_roll_status2: "$.data[0].status", rp_roll_pp2: "$.data[0].posted_period_index" } }
            - { call: "GET /assignments/${asg_mrp}", as: CompAdmin, captures: { mrp_earned2: "$.data.current_period_earned_cents" } }
          assert:
            - "before manager accept: rollup status == PENDING, posted_period_index == null, manager earned == 0"
            - "after manager accept: rollup status == POSTED, posted_period_index == 1, manager earned == 100000"

      - name: guarantee_trueup_covers_zero_earnings
        claim_type: correct_result
        grounds: [calculations.period_settlement, entities.PayoutStatement.fields.guarantee_trueup_cents]
        distinguishing_aspect: "With earned_total 0, draw 0 and guarantee 120000, the statement pays pure guarantee: gross 0, draw_recovered 0, guarantee_trueup 120000, net_payable 120000, attainment 0."
        test_recipe:
          setup: ["accepted rep with guarantee_amount_cents_per_period 120000, no draw, no transactions"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog GT" }, as: CompAdmin, captures: { pgt: $.data.id, pv_gt: $.data.version } }
            - { call: "POST /plans", payload: { program_id: "${pgt}", name: "Plan GT", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }] }, as: CompAdmin, as_user_id: "admin-1", captures: { plan_gt: $.data.id } }
            - { call: "POST /plans/${plan_gt}/publish", payload: {}, as: CompAdmin, as_user_id: "admin-2" }
            - { call: "POST /reps", payload: { program_id: "${pgt}", name: "Rep GT", employee_ref: "GT-R1" }, as: CompAdmin, captures: { rgt: $.data.id } }
            - { call: "POST /assignments", payload: { program_id: "${pgt}", rep_id: "${rgt}", plan_id: "${plan_gt}", quota_cents: 1000000, guarantee_amount_cents_per_period: 120000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_gt: $.data.id } }
            - { call: "POST /assignments/${asg_gt}/accept", payload: {}, as: Rep, as_user_id: "${rgt}" }
          trigger:
            - { call: "POST /programs/${pgt}/close-period", payload: { expected_program_version: "${pv_gt}" }, as: CompAdmin }
            - { call: "GET /statements?assignment_id=${asg_gt}&period_index=1", as: CompAdmin, captures: { gt_gross: "$.data[0].gross_payout_cents", gt_true: "$.data[0].guarantee_trueup_cents", gt_net: "$.data[0].net_payable_cents" } }
          assert:
            - "gross_payout_cents == 0, draw_paid_cents == 0, draw_recovered_cents == 0"
            - "guarantee_trueup_cents == 120000, net_payable_cents == 120000, attainment_bps == 0"

      - name: negative_earnings_deficit_flows_to_draw_outstanding
        claim_type: correct_result
        grounds: [calculations.period_settlement, entities.PayoutStatement.fields.deficit_cents]
        distinguishing_aspect: "Clawed-back credit from a closed period produces earned_total -200000 in the next close: gross clamps to 0, deficit_cents == 200000, and (draw_recoverable default true) the deficit is added to draw_outstanding_cents."
        test_recipe:
          setup: ["accepted rep (no draw amount, draw_recoverable default true, no guarantee); transaction 200000 POSTED in period 1; period 1 closed (credit LOCKED); transaction cancelled in period 2 (CLAWBACK adjustment -200000)"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog DF" }, as: CompAdmin, captures: { pdf: $.data.id, pv_df: $.data.version } }
            - { call: "POST /plans", payload: { program_id: "${pdf}", name: "Plan DF", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }] }, as: CompAdmin, as_user_id: "admin-1", captures: { plan_df: $.data.id } }
            - { call: "POST /plans/${plan_df}/publish", payload: {}, as: CompAdmin, as_user_id: "admin-2" }
            - { call: "POST /reps", payload: { program_id: "${pdf}", name: "Rep DF", employee_ref: "DF-R1" }, as: CompAdmin, captures: { rdf: $.data.id } }
            - { call: "POST /assignments", payload: { program_id: "${pdf}", rep_id: "${rdf}", plan_id: "${plan_df}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_df: $.data.id } }
            - { call: "POST /assignments/${asg_df}/accept", payload: {}, as: Rep, as_user_id: "${rdf}" }
            - { call: "POST /transactions", payload: { program_id: "${pdf}", external_ref: "DF-T1", amount_cents: 200000, transaction_date: "2026-02-01", splits: [{ rep_id: "${rdf}", split_bps: 10000 }] }, as: CompAnalyst, captures: { txn_df: $.data.id } }
            - { call: "POST /programs/${pdf}/close-period", payload: { expected_program_version: "${pv_df}" }, as: CompAdmin, captures: { pv_df2: $.data.version } }
            - { call: "POST /transactions/${txn_df}/cancel", payload: {}, as: CompAnalyst }
          trigger:
            - { call: "POST /programs/${pdf}/close-period", payload: { expected_program_version: "${pv_df2}" }, as: CompAdmin }
            - { call: "GET /statements?assignment_id=${asg_df}&period_index=2", as: CompAdmin, captures: { df_earned: "$.data[0].earned_total_cents", df_gross: "$.data[0].gross_payout_cents", df_def: "$.data[0].deficit_cents", df_net: "$.data[0].net_payable_cents" } }
            - { call: "GET /assignments/${asg_df}", as: CompAdmin, captures: { df_out: "$.data.draw_outstanding_cents" } }
          assert:
            - "period-2 statement: earned_credits_cents == 0, adjustments_cents == -200000, earned_total_cents == -200000"
            - "attainment_bps == 0, gross_payout_cents == 0, deficit_cents == 200000, net_payable_cents == 0"
            - "PlanAssignment.${asg_df}.draw_outstanding_cents == 200000 (deficit added, recoverable)"

      - name: plan_effectiveness_aggregation
        claim_type: correct_result
        grounds: [calculations.plan_effectiveness]
        distinguishing_aspect: "Analytics computed read: two statements with attainment 10000 and 5000 yield statements_count 2, avg_attainment_bps floor(15000/2) == 7500, bucket boundary inclusive (10000 -> GTE_10000), total_payout 160000, total_earned 1500000."
        test_recipe:
          setup: ["canonical 3-tier plan; reps RA (txn 1000000) and RB (txn 500000), both ACCEPTED; period 1 closed"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog AN" }, as: CompAdmin, captures: { pan: $.data.id, pv_an: $.data.version } }
            - { call: "POST /plans", payload: { program_id: "${pan}", name: "Plan AN", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }, { attainment_floor_bps: 8000, rate_bps: 1500 }, { attainment_floor_bps: 10000, rate_bps: 2500 }] }, as: CompAdmin, as_user_id: "admin-1", captures: { plan_an: $.data.id } }
            - { call: "POST /plans/${plan_an}/publish", payload: {}, as: CompAdmin, as_user_id: "admin-2" }
            - { call: "POST /reps", payload: { program_id: "${pan}", name: "AN RepA", employee_ref: "AN-RA" }, as: CompAdmin, captures: { ran: $.data.id } }
            - { call: "POST /reps", payload: { program_id: "${pan}", name: "AN RepB", employee_ref: "AN-RB" }, as: CompAdmin, captures: { rbn: $.data.id } }
            - { call: "POST /assignments", payload: { program_id: "${pan}", rep_id: "${ran}", plan_id: "${plan_an}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_an1: $.data.id } }
            - { call: "POST /assignments/${asg_an1}/accept", payload: {}, as: Rep, as_user_id: "${ran}" }
            - { call: "POST /assignments", payload: { program_id: "${pan}", rep_id: "${rbn}", plan_id: "${plan_an}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_an2: $.data.id } }
            - { call: "POST /assignments/${asg_an2}/accept", payload: {}, as: Rep, as_user_id: "${rbn}" }
            - { call: "POST /transactions", payload: { program_id: "${pan}", external_ref: "AN-T1", amount_cents: 1000000, transaction_date: "2026-02-01", splits: [{ rep_id: "${ran}", split_bps: 10000 }] }, as: CompAnalyst }
            - { call: "POST /transactions", payload: { program_id: "${pan}", external_ref: "AN-T2", amount_cents: 500000, transaction_date: "2026-02-01", splits: [{ rep_id: "${rbn}", split_bps: 10000 }] }, as: CompAnalyst }
            - { call: "POST /programs/${pan}/close-period", payload: { expected_program_version: "${pv_an}" }, as: CompAdmin }
          trigger:
            - { call: "GET /plans/${plan_an}/effectiveness", as: CompAdmin, captures: { an_cnt: "$.data.statements_count", an_avg: "$.data.avg_attainment_bps", an_earned: "$.data.total_earned_cents", an_payout: "$.data.total_payout_cents", an_dist: "$.data.distribution" } }
          assert:
            - "assignments_count == 2, statements_count == 2"
            - "avg_attainment_bps == 7500 (floor((10000 + 5000) / 2))"
            - "distribution == {LT_8000: 1, B8000_10000: 0, GTE_10000: 1} (10000 falls in GTE_10000 — inclusive lower bound)"
            - "total_earned_cents == 1500000, total_payout_cents == 160000 (110000 + 50000)"

      - name: attainment_floor_at_boundary
        claim_type: precision
        grounds: [calculations.attainment_calculation]
        excluded_because:
          difficulty_instance: attainment_exactly_100pct_tier_boundary
          rationale: "floor() boundary behavior at 9999.9 bps and exactly 10000 bps is asserted by the named §1.8 instance."

      - name: curve_straddle_with_cap
        claim_type: correct_result
        grounds: [calculations.quota_to_payout_curve]
        excluded_because:
          difficulty_instance: curve_marginal_tier_straddle
          rationale: "Tier straddling and cap min() are asserted by the named §1.8 instance."

  # ===========================================================================
  - section: validations
    instances:
      - name: create_plan_missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-ID / X-User-Role headers fails priority-1 auth with 400 before any other check."
        test_recipe:
          setup: ["one program exists"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog AU" }, as: CompAdmin, captures: { pau: $.data.id } }
          trigger:
            - { call: "POST /plans", payload: { program_id: "${pau}", name: "Plan AU", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }] }, as: CompAdmin, captures: { err_au: $.data.error_id } }
          assert:
            - "when the auth headers are stripped: HTTP 400, error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: create_plan_missing_required_field_returns_400
        claim_type: required_fields
        grounds: ["entities.CompPlan.fields.curve_tiers", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required curve_tiers fails with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["one program exists"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog MR" }, as: CompAdmin, captures: { pmr: $.data.id } }
          trigger:
            - { call: "POST /plans", payload: { program_id: "${pmr}", name: "Plan MR", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31" }, as: CompAdmin, captures: { err_mr: $.data.error_id } }
          assert:
            - "HTTP 400, error_id == ERR_INVALID_REQUEST"

      - name: create_plan_invalid_enum_returns_400
        claim_type: type_constraints
        grounds: ["entities.CompPlan.fields.attainment_mode", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "attainment_mode outside {DIRECT_ONLY, INCLUDE_ROLLUP} is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["one program exists"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog IE" }, as: CompAdmin, captures: { pie: $.data.id } }
          trigger:
            - { call: "POST /plans", payload: { program_id: "${pie}", name: "Plan IE", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }], attainment_mode: "BOGUS" }, as: CompAdmin, captures: { err_ie: $.data.error_id } }
          assert:
            - "HTTP 400, error_id == ERR_INVALID_REQUEST"

      - name: assignment_quota_zero_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_QUOTA_INVALID]"]
        distinguishing_aspect: "quota_cents == 0 is rejected with ERR_QUOTA_INVALID (fiscal sanity), so attainment can never divide by zero."
        test_recipe:
          setup: ["program with published plan and one rep"]
          setup_api_calls:
