  - rule_id: combinatorial_formula
    instances:
      - name: invoice_face_rounds_per_line_then_sums
        grounds:
          - calculations.invoice_face_from_lines
          - entities.InvoiceLine.fields.line_tax_cents
          - entities.InvoiceLine.fields.line_total_cents
          - entities.Invoice.fields.face_amount_cents
          - validations[priority=18]
          - state_machines.ApprovedPayableFile.NEW_to_ACCEPTED
        distinguishing_aspect: |
          Mode (b) - nested rounding whose order is pinned: three lines of 33333 / 33333 / 33334
          cents at 875 bps round to 2917 tax each, so face_amount_cents is 108751; the forbidden
          sum-then-round order would produce 108750, and a file declaring 108750 is rejected with
          ERR_FILE_TOTALS_MISMATCH.
        test_recipe:
          setup:
            - "SELF_ONLY programme OPEN on a buyer with a 100000000-cent limit"
            - "One fully onboarded supplier"
            - "Logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /buyers"
              payload: { legal_name: "Rounding Order Corp", tax_id: "223334445", credit_limit_cents: 100000000 }
              as: PlatformOps
              captures: { buyer_id: "$.data.id" }
            - call: "POST /buyer-programs"
              payload: { buyer_id: "${buyer_id}", name: "Line Rounding Programme", program_type: "SUPPLIER_NAMED", max_acceptable_apr_bps: 1200 }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { program_id: "$.data.id" }
            - call: "POST /buyer-programs/${program_id}/open"
              payload: {}
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
            - call: "POST /suppliers"
              payload: { legal_name: "Tax Rate Supplier", tax_id_last4: "7788", remittance_email: "ap@trs.example" }
              as: PlatformOps
              captures: { supplier_id: "$.data.id" }
            - call: "POST /suppliers/${supplier_id}/onboarding/submit"
              payload: {}
              as: Supplier
              as_user_id: "${supplier_id}"
            - call: "POST /suppliers/${supplier_id}/bank-accounts"
              payload: { routing_number: "021000021", account_last4: "4321" }
              as: Supplier
              as_user_id: "${supplier_id}"
              captures: { bank_id: "$.data.id", md_code: "$.data.micro_deposit_code" }
            - call: "POST /bank-accounts/${bank_id}/micro-deposit/confirm"
              payload: { code: "${md_code}" }
              as: Supplier
              as_user_id: "${supplier_id}"
            - call: "POST /suppliers/${supplier_id}/idv/adjudicate"
              payload: { decision: "PASSED", identity_score: 88 }
              as: PlatformOps
          trigger:
            - call: "POST /payable-files"
              payload: { program_id: "${program_id}", filename: "AP-ROUND-OK.csv", declared_row_count: 1, declared_total_cents: 108751, rows: [ { invoice_number: "ROUND-1", approval_date: "2026-07-20T00:00:00Z", net_due_date: "2026-09-30T00:00:00Z", supplier_id: "${supplier_id}", lines: [ { line_no: 1, line_amount_cents: 33333, tax_rate_bps: 875 }, { line_no: 2, line_amount_cents: 33333, tax_rate_bps: 875 }, { line_no: 3, line_amount_cents: 33334, tax_rate_bps: 875 } ] } ] }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { ok_file_id: "$.data.id" }
            - call: "POST /payable-files"
              payload: { program_id: "${program_id}", filename: "AP-ROUND-BAD.csv", declared_row_count: 1, declared_total_cents: 108750, rows: [ { invoice_number: "ROUND-2", approval_date: "2026-07-20T00:00:00Z", net_due_date: "2026-09-30T00:00:00Z", supplier_id: "${supplier_id}", lines: [ { line_no: 1, line_amount_cents: 33333, tax_rate_bps: 875 }, { line_no: 2, line_amount_cents: 33333, tax_rate_bps: 875 }, { line_no: 3, line_amount_cents: 33334, tax_rate_bps: 875 } ] } ] }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { bad_error: "$.data.error_id" }
          assert:
            - "ApprovedPayableFile.${ok_file_id}.computed_total_cents == 108751 and ingest_status == ACCEPTED"
            - "GET /invoices?file_id=${ok_file_id} -> data[0].face_amount_cents == 108751"
            - "GET /invoices/{id}/lines for that invoice -> line_tax_cents == [2917, 2917, 2917] and line_total_cents == [36250, 36250, 36251] in line_no ASC order"
            - "${bad_error} == ERR_FILE_TOTALS_MISMATCH with HTTP 422 (declared 108750 is the sum-then-round total and is one cent short)"

      - name: funder_fee_tier_keyed_on_pre_fee_net_not_final_net
        grounds:
          - calculations.funder_fee
          - calculations.net_payment
          - calculations.early_payment_discount
          - calculations.accounting_classification_default
          - entities.Funder.fields.fee_spread_bps
          - entities.EarlyPayment.fields.funder_fee_cents
        distinguishing_aspect: |
          Mode (c) - a circular-looking dependency whose evaluation order is pinned: face 25661600
          at 1000 bps for 90 days gives discount 641540 and pre-fee net 25020060, which sits in the
          18 bps bracket and yields fee 45036 and net 24975024; keying the bracket on the final net
