scaffold_corner_design:

  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_account_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Account, endpoints]
        distinguishing_aspect: "POST /dna/accounts with email+full_name returns 201; id, created_at, version=1 system-minted; defaults data_residency=US, relative_finder_opt_in=false, pet_count=0, purge_pending=false."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /dna/accounts"
              payload: { email: "new@x.com", full_name: "New" }
              as: PlatformAdmin
              captures: { acc: $.data.id, v: $.data.version, dr: $.data.data_residency }
          assert:
            - "response code == 201"
            - "Account.${acc}.version == 1"
            - "Account.${acc}.data_residency == US (default)"
            - "Account.${acc}.relative_finder_opt_in == false (default)"
            - "Account.${acc}.pet_count == 0 and purge_pending == false"

      - name: get_account_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Account, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /dna/accounts/{id} with a random UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /dna/accounts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response code == 404"
            - "error_id == ERR_NOT_FOUND"

      - name: create_pet_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Pet, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /dna/pets omitting species (required, no default) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["An account exists."]
          setup_api_calls:
            - call: "POST /dna/accounts"
              payload: { email: "r1@x.com", full_name: "R1" }
              as: PlatformAdmin
              captures: { acc: $.data.id }
          trigger:
            - call: "POST /dna/pets"
              payload: { account_id: "${acc}", name: "NoSpecies", birth_year: 2020 }
              as: Account
              as_user_id: "${acc}"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 422"
            - "error_id == ERR_INVALID_REQUEST"

      - name: create_pet_invalid_enum_species_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Pet.fields.species, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /dna/pets with species=BIRD (not in {DOG, CAT}) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["An account exists."]
          setup_api_calls:
            - call: "POST /dna/accounts"
              payload: { email: "r2@x.com", full_name: "R2" }
              as: PlatformAdmin
              captures: { acc: $.data.id }
          trigger:
            - call: "POST /dna/pets"
              payload: { account_id: "${acc}", name: "Bird", species: "BIRD", birth_year: 2020 }
              as: Account
              as_user_id: "${acc}"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 422"
            - "error_id == ERR_INVALID_REQUEST"

      - name: pet_defaults_relative_finder_opt_in_false
        claim_type: Defaults
        grounds: [entities.Pet.fields.relative_finder_opt_in]
        distinguishing_aspect: "Omitting relative_finder_opt_in on POST /dna/pets yields default false and status REGISTERED."
        test_recipe:
          setup: ["An account exists."]
          setup_api_calls:
            - call: "POST /dna/accounts"
              payload: { email: "r3@x.com", full_name: "R3" }
              as: PlatformAdmin
              captures: { acc: $.data.id }
          trigger:
            - call: "POST /dna/pets"
              payload: { account_id: "${acc}", name: "Def", species: "DOG", birth_year: 2020 }
              as: Account
              as_user_id: "${acc}"
              captures: { pet: $.data.id }
          assert:
            - "Pet.${pet}.relative_finder_opt_in == false"
            - "Pet.${pet}.status == REGISTERED (initial)"
            - "Pet.${pet}.finalized_report_id == null"

      - name: kit_barcode_is_system_minted_unique
        claim_type: System Fields
        grounds: [entities.Kit.fields.barcode]
        distinguishing_aspect: "POST /dna/kits mints a server-generated barcode; two kits get distinct barcodes; client cannot set it."
        test_recipe:
          setup: ["An account exists."]
          setup_api_calls:
            - call: "POST /dna/accounts"
              payload: { email: "r4@x.com", full_name: "R4" }
              as: PlatformAdmin
              captures: { acc: $.data.id }
          trigger:
            - call: "POST /dna/kits"
              payload: { account_id: "${acc}", product_tier: "BREED" }
              as: Account
              as_user_id: "${acc}"
              captures: { k1: $.data.id, b1: $.data.barcode }
            - call: "POST /dna/kits"
              payload: { account_id: "${acc}", product_tier: "BREED" }
              as: Account
              as_user_id: "${acc}"
              captures: { k2: $.data.id, b2: $.data.barcode }
          assert:
            - "Kit.${k1}.barcode is non-null and Kit.${k2}.barcode is non-null"
            - "Kit.${k1}.barcode != Kit.${k2}.barcode"
            - "Kit.${k1}.status == ORDERED (initial)"

      - name: list_pets_paginated_envelope
        claim_type: Listing
        grounds: [entities.Pet, endpoints]
        distinguishing_aspect: "GET /dna/pets?account_id returns array envelope with total_count and has_more pagination fields."
        test_recipe:
          setup: ["An account with 2 pets."]
          setup_api_calls:
            - call: "POST /dna/accounts"
              payload: { email: "r5@x.com", full_name: "R5" }
              as: PlatformAdmin
              captures: { acc: $.data.id }
            - call: "POST /dna/pets"
              payload: { account_id: "${acc}", name: "L1", species: "DOG", birth_year: 2020 }
              as: Account
              as_user_id: "${acc}"
            - call: "POST /dna/pets"
              payload: { account_id: "${acc}", name: "L2", species: "CAT", birth_year: 2019 }
              as: Account
              as_user_id: "${acc}"
          trigger:
            - call: "GET /dna/pets?account_id=${acc}&limit=1&offset=0"
              payload: {}
              as: Account
              as_user_id: "${acc}"
          assert:
            - "response_type == array"
            - "meta.total_count == 2 and has_more == true (limit 1)"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: void_activated_kit_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Kit.ORDERED_to_VOIDED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Voiding a kit already ACTIVATED (not ORDERED) returns ERR_INVALID_STATE (409); no side effect fires."
        test_recipe:
          setup: ["A kit that has been ACTIVATED against a pet."]
          setup_api_calls:
            - call: "POST /dna/accounts"
              payload: { email: "s1@x.com", full_name: "S1" }
              as: PlatformAdmin
              captures: { acc: $.data.id }
            - call: "POST /dna/pets"
              payload: { account_id: "${acc}", name: "K", species: "DOG", birth_year: 2020 }
              as: Account
              as_user_id: "${acc}"
              captures: { pet: $.data.id }
            - call: "POST /dna/kits"
              payload: { account_id: "${acc}", product_tier: "BREED" }
              as: Account
              as_user_id: "${acc}"
              captures: { kit: $.data.id }
            - call: "POST /dna/kits/${kit}/activate"
              payload: { pet_id: "${pet}" }
              as: Account
              as_user_id: "${acc}"
          trigger:
            - call: "POST /dna/kits/${kit}/void"
              payload: {}
              as: Account
              as_user_id: "${acc}"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "error_id == ERR_INVALID_STATE"
            - "Kit.${kit}.status == ACTIVATED (unchanged)"

      - name: confirm_already_confirmed_match_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.RelativeMatch.ESTIMATED_to_CONFIRMED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Confirming a match already in CONFIRMED returns ERR_INVALID_STATE (409); relationship_pct not recomputed again."
        test_recipe:
          setup: ["A CONFIRMED relative match between two pets with FINALIZED reports."]
          setup_api_calls:
            - call: "POST /dna/accounts"
              payload: { email: "s2@x.com", full_name: "S2", relative_finder_opt_in: true }
              as: PlatformAdmin
              captures: { acc: $.data.id }
            - call: "POST /dna/pets"
              payload: { account_id: "${acc}", name: "P1", species: "DOG", birth_year: 2020, relative_finder_opt_in: true }
              as: Account
              as_user_id: "${acc}"
              captures: { p1: $.data.id }
            - call: "POST /dna/pets"
              payload: { account_id: "${acc}", name: "P2", species: "DOG", birth_year: 2019, relative_finder_opt_in: true }
              as: Account
              as_user_id: "${acc}"
              captures: { p2: $.data.id }
            - call: "POST /dna/kits"
              payload: { account_id: "${acc}", product_tier: "BREED" }
              as: Account
              as_user_id: "${acc}"
              captures: { k1: $.data.id }
            - call: "POST /dna/kits"
              payload: { account_id: "${acc}", product_tier: "BREED" }
              as: Account
              as_user_id: "${acc}"
              captures: { k2: $.data.id }
            - call: "POST /dna/kits/${k1}/activate"
              payload: { pet_id: "${p1}" }
              as: Account
              as_user_id: "${acc}"
            - call: "POST /dna/kits/${k2}/activate"
              payload: { pet_id: "${p2}" }
              as: Account
              as_user_id: "${acc}"
            - call: "POST /dna/samples"
              payload: { kit_id: "${k1}" }
              as: LabTechnician
              captures: { s1: $.data.id }
            - call: "POST /dna/samples"
              payload: { kit_id: "${k2}" }
              as: LabTechnician
              captures: { s2: $.data.id }
            - call: "POST /dna/samples/${s1}/genotyping-runs"
              payload: { call_rate: 0.99, het_rate: 0.35, contamination: 0.01, breed_segments: [ { breed: "LABRADOR", match_cm: 1000 } ] }
              as: LabTechnician
            - call: "POST /dna/samples/${s2}/genotyping-runs"
              payload: { call_rate: 0.99, het_rate: 0.35, contamination: 0.01, breed_segments: [ { breed: "POODLE", match_cm: 1000 } ] }
              as: LabTechnician
            - call: "GET /dna/reports?sample_id=${s1}"
              payload: {}
              as: LabTechnician
              captures: { r1: "$.data[0].id", r1v: "$.data[0].version" }
            - call: "GET /dna/reports?sample_id=${s2}"
              payload: {}
              as: LabTechnician
              captures: { r2: "$.data[0].id", r2v: "$.data[0].version" }
            - call: "POST /dna/reports/${r1}/finalize"
              payload: { expected_report_version: "${r1v}" }
              as: LabTechnician
            - call: "POST /dna/reports/${r2}/finalize"
              payload: { expected_report_version: "${r2v}" }
              as: LabTechnician
            - call: "POST /dna/relative-matches"
              payload: { pet_id: "${p1}", relative_pet_id: "${p2}", shared_cm: 1250 }
              as: LabTechnician
              captures: { m: $.data.id }
            - call: "POST /dna/relative-matches/${m}/confirm"
              payload: {}
              as: LabTechnician
          trigger:
            - call: "POST /dna/relative-matches/${m}/confirm"
              payload: {}
              as: LabTechnician
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "error_id == ERR_INVALID_STATE"
            - "RelativeMatch.${m}.relationship_pct == 49.00 (unchanged confirmed value)"

      - name: pet_optout_cascades_estimated_match_withdrawal
        claim_type: Side Effect Execution
        grounds: [state_machines.RelativeMatch.ESTIMATED_to_WITHDRAWN, endpoints]
        distinguishing_aspect: "PATCH /dna/pets/{id} setting relative_finder_opt_in=false auto-withdraws every ESTIMATED RelativeMatch referencing that pet."
        test_recipe:
          setup: ["Two opted-in pets with an ESTIMATED match between them."]
          setup_api_calls:
            - call: "POST /dna/accounts"
              payload: { email: "s3@x.com", full_name: "S3", relative_finder_opt_in: true }
              as: PlatformAdmin
              captures: { acc: $.data.id }
            - call: "POST /dna/pets"
              payload: { account_id: "${acc}", name: "P1", species: "DOG", birth_year: 2020, relative_finder_opt_in: true }
              as: Account
              as_user_id: "${acc}"
              captures: { p1: $.data.id }
            - call: "POST /dna/pets"
              payload: { account_id: "${acc}", name: "P2", species: "DOG", birth_year: 2019, relative_finder_opt_in: true }
              as: Account
              as_user_id: "${acc}"
              captures: { p2: $.data.id }
            - call: "POST /dna/relative-matches"
              payload: { pet_id: "${p1}", relative_pet_id: "${p2}", shared_cm: 625 }
              as: LabTechnician
              captures: { m: $.data.id }
          trigger:
            - call: "PATCH /dna/pets/${p1}"
              payload: { relative_finder_opt_in: false }
              as: Account
              as_user_id: "${acc}"
          assert:
            - "Pet.${p1}.relative_finder_opt_in == false"
            - "RelativeMatch.${m}.status == WITHDRAWN (cascaded)"

      - name: purge_finalize_cascades_pet_archival_and_match_withdrawal
        claim_type: Side Effect Execution
        grounds: [state_machines.DataRequest.PURGING_to_PURGED, state_machines.Pet.REGISTERED_to_ARCHIVED]
        distinguishing_aspect: "Executing purge-finalize archives all account pets, revokes their reports' ACTIVE share-links, withdraws their matches, and clears purge_pending."
        test_recipe:
          setup: ["Clock 2026-05-01; DELETE request advanced to PURGING after grace; account has 1 pet."]
          setup_api_calls:
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dna/accounts"
              payload: { email: "s4@x.com", full_name: "S4" }
              as: PlatformAdmin
              captures: { acc: $.data.id }
            - call: "POST /dna/pets"
              payload: { account_id: "${acc}", name: "Arch", species: "DOG", birth_year: 2020 }
              as: Account
              as_user_id: "${acc}"
              captures: { pet: $.data.id }
            - call: "POST /dna/data-requests"
              payload: { account_id: "${acc}", kind: "DELETE" }
              as: Account
              as_user_id: "${acc}"
              captures: { del: $.data.id }
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dna/data-requests/${del}/purge"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /dna/data-requests/${del}/purge-finalize"
              payload: {}
              as: PlatformAdmin
          assert:
            - "DataRequest.${del}.status == PURGED"
            - "Pet.${pet}.status == ARCHIVED"
            - "Account.${acc}.purge_pending == false and pet_count == 0"

      - name: expire_grace_subscription_before_term_returns_grace_not_elapsed
        claim_type: Precondition Enforcement
        grounds: [state_machines.Subscription.GRACE_to_CANCELLED, "errors[ERR_GRACE_NOT_ELAPSED]"]
        distinguishing_aspect: "Expiring a GRACE subscription before started_on+term_days returns ERR_GRACE_NOT_ELAPSED (409)."
        test_recipe:
          setup: ["Clock 2026-01-01; ACTIVE BASIC subscription cancelled into GRACE; clock at 2026-06-01 (< term end)."]
          setup_api_calls:
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dna/accounts"
              payload: { email: "s5@x.com", full_name: "S5" }
              as: PlatformAdmin
              captures: { acc: $.data.id }
            - call: "POST /dna/subscriptions"
              payload: { account_id: "${acc}", tier: "BASIC", annual_fee_cents: 9900 }
              as: Account
              as_user_id: "${acc}"
              captures: { sub: $.data.id }
            - call: "POST /dna/subscriptions/${sub}/cancel"
              payload: {}
              as: Account
              as_user_id: "${acc}"
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /dna/subscriptions/${sub}/expire"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "error_id == ERR_GRACE_NOT_ELAPSED"
            - "Subscription.${sub}.status == GRACE (unchanged)"

      - name: error_sample_pass_already_covered_by_difficulty
        claim_type: Valid Transition
        grounds: [state_machines.Sample.GENOTYPING_to_PASS]
        excluded_because:
          difficulty_instance: transitive_cascade / genotyping_pass_cascades_sample_then_kit_depth3
          rationale: "The PASS transition and its kit-consume cascade are asserted by the named §1.8 instance."

  # =========================================================================
  # Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: empty_breed_segments_yields_empty_composition
        claim_type: Correct Result
        grounds: [calculations.breed_ancestry_composition, entities.Report.fields.breed_composition]
        distinguishing_aspect: "A PASS genotyping run with no breed_segments produces a report whose breed_composition is the empty array []."
        test_recipe:
          setup: ["An ACTIVATED BREED kit with a RECEIVED sample."]
          setup_api_calls:
            - call: "POST /dna/accounts"
              payload: { email: "c1@x.com", full_name: "C1" }
              as: PlatformAdmin
              captures: { acc: $.data.id }
            - call: "POST /dna/pets"
              payload: { account_id: "${acc}", name: "E", species: "DOG", birth_year: 2020 }
              as: Account
              as_user_id: "${acc}"
              captures: { pet: $.data.id }
            - call: "POST /dna/kits"
              payload: { account_id: "${acc}", product_tier: "BREED" }
              as: Account
              as_user_id: "${acc}"
              captures: { kit: $.data.id }
            - call: "POST /dna/kits/${kit}/activate"
              payload: { pet_id: "${pet}" }
              as: Account
              as_user_id: "${acc}"
            - call: "POST /dna/samples"
              payload: { kit_id: "${kit}" }
              as: LabTechnician
              captures: { samp: $.data.id }
          trigger:
            - call: "POST /dna/samples/${samp}/genotyping-runs"
              payload: { call_rate: 0.99, het_rate: 0.35, contamination: 0.01 }
              as: LabTechnician
          assert:
            - "GET /dna/reports?sample_id=${samp} returns breed_composition == []"

      - name: qns_outcome_no_report_created
        claim_type: Input Set Filtering
        grounds: [calculations.genotyping_qc_score, state_machines.Sample.GENOTYPING_to_QNS]
        distinguishing_aspect: "A QNS run (call_rate 0.85, het 0.0, contamination 0.9 -> qc 54.00) leaves the sample QNS with no Report created."
        test_recipe:
          setup: ["An ACTIVATED BREED kit with a RECEIVED sample."]
          setup_api_calls:
            - call: "POST /dna/accounts"
              payload: { email: "c2@x.com", full_name: "C2" }
              as: PlatformAdmin
              captures: { acc: $.data.id }
            - call: "POST /dna/pets"
              payload: { account_id: "${acc}", name: "Qn", species: "DOG", birth_year: 2020 }
              as: Account
              as_user_id: "${acc}"
              captures: { pet: $.data.id }
            - call: "POST /dna/kits"
              payload: { account_id: "${acc}", product_tier: "BREED" }
              as: Account
              as_user_id: "${acc}"
              captures: { kit: $.data.id }
            - call: "POST /dna/kits/${kit}/activate"
              payload: { pet_id: "${pet}" }
              as: Account
              as_user_id: "${acc}"
            - call: "POST /dna/samples"
              payload: { kit_id: "${kit}" }
              as: LabTechnician
              captures: { samp: $.data.id }
          trigger:
            - call: "POST /dna/samples/${samp}/genotyping-runs"
              payload: { call_rate: 0.85, het_rate: 0.0, contamination: 0.9 }
              as: LabTechnician
              captures: { qc: $.data.qc_score, outc: $.data.outcome }
          assert:
            - "GenotypingRun.qc_score == 54.00 and outcome == QNS"
            - "Sample.${samp}.status == QNS"
            - "GET /dna/reports?sample_id=${samp} returns 0 reports"

      - name: genotyping_range_out_of_bounds_returns_invalid_range
        claim_type: Constants Applied
        grounds: ["validations[priority=13]", "errors[ERR_INVALID_RANGE]"]
        distinguishing_aspect: "POST genotyping-runs with call_rate 1.5 (> 1) returns ERR_INVALID_RANGE (422)."
        test_recipe:
          setup: ["An ACTIVATED BREED kit with a RECEIVED sample."]
          setup_api_calls:
            - call: "POST /dna/accounts"
              payload: { email: "c3@x.com", full_name: "C3" }
              as: PlatformAdmin
              captures: { acc: $.data.id }
            - call: "POST /dna/pets"
              payload: { account_id: "${acc}", name: "Rg", species: "DOG", birth_year: 2020 }
              as: Account
              as_user_id: "${acc}"
              captures: { pet: $.data.id }
            - call: "POST /dna/kits"
              payload: { account_id: "${acc}", product_tier: "BREED" }
              as: Account
              as_user_id: "${acc}"
              captures: { kit: $.data.id }
            - call: "POST /dna/kits/${kit}/activate"
              payload: { pet_id: "${pet}" }
              as: Account
              as_user_id: "${acc}"
            - call: "POST /dna/samples"
              payload: { kit_id: "${kit}" }
              as: LabTechnician
              captures: { samp: $.data.id }
          trigger:
            - call: "POST /dna/samples/${samp}/genotyping-runs"
              payload: { call_rate: 1.5, het_rate: 0.35, contamination: 0.01 }
              as: LabTechnician
              captures: { err: $.data.error_id }
          assert:
            - "response code == 422"
            - "error_id == ERR_INVALID_RANGE"

      - name: kinship_estimated_variant_already_covered
        claim_type: Variant Selection
        grounds: [calculations.relative_kinship_pct]
        excluded_because:
          difficulty_instance: dual_variant_calc / kinship_estimated_vs_confirmed_on_relative_match
          rationale: "Estimated-vs-confirmed kinship variant divergence is the core assertion of the named §1.8 instance."

  # =========================================================================
  # Validations
  # =========================================================================
  - section: validations
    instances:
      - name: confirm_relative_finder_not_opted_in_returns_error
        claim_type: Violation → Error
        grounds: ["validations[priority=7]", "errors[ERR_RELATIVE_FINDER_NOT_OPTED_IN]"]
        distinguishing_aspect: "Creating a relative-match where one pet has relative_finder_opt_in=false returns ERR_RELATIVE_FINDER_NOT_OPTED_IN (422)."
        test_recipe:
          setup: ["Account opted-in; pet1 opted-in; pet2 NOT opted-in."]
          setup_api_calls:
            - call: "POST /dna/accounts"
              payload: { email: "v1@x.com", full_name: "V1", relative_finder_opt_in: true }
              as: PlatformAdmin
              captures: { acc: $.data.id }
            - call: "POST /dna/pets"
