    claim_type: bubble_up
    grounds:
    - calculations.order_fulfillment_rollup
    - state_machines.DropshipOrder.fulfillment_status
    - state_machines.DropshipOrderLine.TRANSMITTED_to_CANCELLED_BY_VENDOR
    distinguishing_aspect: 'The parent''s fulfillment_status is re-derived from its children rather than set directly:
      with one SHIPPED line and one CANCELLED_BY_VENDOR line the open set becomes empty, so the order bubbles up
      to SHIPPED - not to PARTIALLY_SHIPPED and not to CANCELLED - because cancelled lines are excluded from the
      all-shipped test but do not by themselves cancel the order.'
    test_recipe:
