        payload:
          detention_minutes: 0
          delay_minutes: 0
        as: Pilot
        as_user_id: ${p1_id}
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_INVALID_STATE
      - GET /pilotage/invoices?assignment_id=a1_id returns an empty list (no invoice minted)
  - name: vessel_order_cancel_from_cancelled_returns_invalid_state
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.VesselOrder
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: 'CANCELLED is terminal: a second cancel by the owning agent fails ERR_INVALID_STATE.'
    test_recipe:
      setup:
      - MAIN_TARIFF active; O1 created and cancelled
      setup_api_calls:
      - call: POST /pilotage/tariff-schedules
        payload:
          effective_from: '2026-01-01T00:00:00Z'
          tiers:
          - min_gt_exclusive: 0
            max_gt_inclusive: 5000
            rate_cents_per_gt: 20
          draft_surcharge_threshold_dm: 100
          draft_surcharge_pct: 0.15
          detention_free_minutes: 30
          detention_rate_cents_per_minute: 200
          delay_rate_cents_per_minute: 150
        as: AssociationAdmin
      - call: POST /pilotage/vessel-orders
        payload:
          vessel_name: MV One
          gt: 8000
          draft_dm: 90
          order_type: ARRIVAL
          eta: '2026-08-10T00:00:00Z'
        as: VesselAgent
        as_user_id: agent-1
        captures:
          o1_id: $.data.id
      - call: POST /pilotage/vessel-orders/${o1_id}/cancel
        payload: {}
        as: VesselAgent
        as_user_id: agent-1
      trigger:
      - call: POST /pilotage/vessel-orders/${o1_id}/cancel
        payload: {}
        as: VesselAgent
        as_user_id: agent-1
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_INVALID_STATE
  - name: assignment_dispatch_response_initial_state
    claim_type: initial_state
    grounds:
    - state_machines.Assignment
    - entities.Assignment.fields.recall_count
    distinguishing_aspect: 'Freshly dispatched assignment: service_status ASSIGNED, billing_status UNBILLED, recall_count 0, version 1.'
    test_recipe:
      setup:
      - MAIN_TARIFF active; P1 endorsed cap 100000; boat BA; O1 BOOKED
      setup_api_calls:
