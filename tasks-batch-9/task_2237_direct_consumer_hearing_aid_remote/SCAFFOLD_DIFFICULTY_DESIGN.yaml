            as: PlatformAdmin
            as_user_id: "admin_1"
            captures: { pol: "$.data.id" }
          - call: "POST /providers"
            payload: { provider_type: "LICENSED_AUDIOLOGIST", npi: "1932105678", full_name: "Dr. Ben Ortiz", licensed_state_codes: ["CA"], daily_capacity_minutes: 480, buffer_minutes: 10 }
            as: PlatformAdmin
            as_user_id: "admin_1"
            captures: { aud: "$.data.id" }
          - call: "POST /patients"
            payload: { state_policy_id: "${pol}", email: "rc@example.com", full_name: "Rae Cobb", age_years: 64 }
            as: CareOpsAgent
            as_user_id: "ops_1"
            captures: { pat: "$.data.id" }
          - call: "POST /patients/${pat}/screening-sessions"
            payload: {}
            as: Patient
