              as: ArtisticDirector
              captures: { pl2_id: "$.data.id" }
            - call: "POST /placements/${pl1_id}/accept"
              payload: { instrument_loan_requested: false }
              as: Guardian
              as_user_id: "${m1_id}"
            - call: "GET /seat-assignments?member_id=${m1_id}&status=ACTIVE"
