  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_placement_requires_credit_account_active
        grounds:
          - validations[priority=16]
          - state_machines.CreditAccount.ACTIVE_to_FROZEN
          - state_machines.FraudFlag.OPEN_to_CONFIRMED
        distinguishing_aspect: |
          Order placement (entity Order) is gated on the state of a different
          entity pair (CreditAccount): once the retailer's account is FROZEN by
          the fraud cascade, a new order that satisfies every order-local rule is
          rejected with ERR_CREDIT_LIMIT_EXCEEDED.
        test_recipe:
          setup:
            - "a VERIFIED retailer with an ACTIVE credit account (limit 150000) and an ACTIVE brand"
            - "the retailer's account is then FROZEN via a confirmed STRAW_STOREFRONT flag"
          setup_api_calls:
            - call: "POST /wholesale/retailers"
              payload: { legal_name: "Frozen Retail", store_type: "ONLINE", address: "14 Ice Ave", lat: 52.0, lng: -117.0, storefront_proof_url: "https://proof/14", resale_certificate_no: "RC-14" }
