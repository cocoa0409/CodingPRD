  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (2 instances, different pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: approve_returned_disclosure_state_beats_posture
        grounds:
          - "validations[priority=6]"
          - "validations[priority=7]"
          - "errors[ERR_INVALID_STATE]"
          - "errors[ERR_POSTURE_DEFICIENT]"
        distinguishing_aspect: |
          Pair (state, business_safety): the disclosure is RETURNED (no
          APPROVED transition exists from RETURNED) AND its asset posture is
          DEFICIENT (zero measures). Priority 6 state must beat priority 7
          safety, so the error is ERR_INVALID_STATE, not ERR_POSTURE_DEFICIENT.
        test_recipe:
          setup:
            - "REGISTERED asset with NO measures (posture DEFICIENT); ACTIVE NDA; disclosure pushed to UNDER_REVIEW then RETURNED"
          setup_api_calls:
            - call: "POST /api/counterparties"
              payload: { legal_name: "Iota Labs", counterparty_type: "PARTNER" }
              as: IPCounsel
              captures: { cp_id: $.data.id }
            - call: "POST /api/ndas"
              payload: { counterparty_id: "${cp_id}", template_version: "t8", governing_law: "WA", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z", survival_months: 6, classification_ceiling: "CROWN_JEWEL" }
              as: IPCounsel
              captures: { nda_id: $.data.id }
            - call: "POST /api/ndas/${nda_id}/state"
              payload: { to_status: "SENT" }
              as: IPCounsel
            - call: "POST /api/ndas/${nda_id}/state"
              payload: { to_status: "EXECUTED" }
              as: CounterpartyRep
              as_user_id: "${cp_id}"
            - call: "POST /api/ndas/${nda_id}/state"
              payload: { to_status: "ACTIVE" }
              as: IPCounsel
            - call: "POST /api/assets"
              payload: { title: "Unprotected formula", description: "no measures yet", classification: "CONFIDENTIAL", owner_department: "RND", exposure_estimate_cents: 300000 }
              as: IPCounsel
              captures: { a_id: $.data.id }
            - call: "POST /api/assets/${a_id}/state"
              payload: { to_status: "REGISTERED" }
              as: IPCounsel
            - call: "POST /api/employees"
              payload: { full_name: "Nora Rnd", email: "nora@x.com", department: "RND", role_title: "Scientist", access_clearance: "STANDARD", hired_at: "2026-05-01T00:00:00Z" }
              as: HRPartner
              captures: { emp_id: $.data.id }
            - call: "POST /api/disclosures"
              payload: { asset_id: "${a_id}", nda_id: "${nda_id}", purpose: "Eval", marking_protocol: "STAMPED_CONFIDENTIAL", planned_disclosure_date: "2026-07-01T00:00:00Z" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { d_id: $.data.id }
            - call: "POST /api/disclosures/${d_id}/state"
              payload: { to_status: "SUBMITTED" }
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /api/disclosures/${d_id}/state"
              payload: { to_status: "UNDER_REVIEW" }
              as: IPCounsel
            - call: "POST /api/disclosures/${d_id}/state"
              payload: { to_status: "RETURNED" }
              as: IPCounsel
          trigger:
            - call: "POST /api/disclosures/${d_id}/state"
              payload: { to_status: "APPROVED" }
              as: IPCounsel
              as_user_id: "counsel_1"
              captures: { err: $.data.error_id }
        assert:
          - "err == ERR_INVALID_STATE (priority 6 state beats priority 7 business_safety ERR_POSTURE_DEFICIENT)"
          - "DisclosureRequest.${d_id}.status == RETURNED (no side effects fired)"

      - name: grant_create_clearance_beats_expiry
        grounds:
          - "validations[priority=7]"
          - "validations[priority=8]"
          - "errors[ERR_NEED_TO_KNOW_VIOLATION]"
          - "errors[ERR_EXPIRY_IN_PAST]"
        distinguishing_aspect: |
          Pair (business_safety, business_temporal): grant create against a
          CROWN_JEWEL asset by a STANDARD-clearance employee AND with
          expires_at in the past. Priority 7 safety must beat priority 8
          temporal, so the error is ERR_NEED_TO_KNOW_VIOLATION (403), not
          ERR_EXPIRY_IN_PAST (422).
        test_recipe:
          setup:
            - "ACTIVE employee with STANDARD clearance and completed training; REGISTERED CROWN_JEWEL asset"
          setup_api_calls:
            - call: "POST /api/employees"
              payload: { full_name: "Omar Temp", email: "omar@x.com", department: "OPS", role_title: "Temp", access_clearance: "STANDARD", hired_at: "2026-05-01T00:00:00Z" }
              as: HRPartner
              captures: { emp_id: $.data.id }
            - call: "GET /api/acknowledgments"
              payload: { employee_id: "${emp_id}", status: "PENDING" }
              as: HRPartner
              captures: { ack_id: "$.data[0].id" }
            - call: "POST /api/acknowledgments/${ack_id}/sign"
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /api/employees/${emp_id}/state"
              payload: { to_status: "ACTIVE" }
              as: HRPartner
            - call: "POST /api/assets"
              payload: { title: "Core optimizer", description: "solver internals", classification: "CROWN_JEWEL", owner_department: "AI", exposure_estimate_cents: 999999 }
              as: IPCounsel
              captures: { a_id: $.data.id }
            - call: "POST /api/assets/${a_id}/state"
              payload: { to_status: "REGISTERED" }
              as: IPCounsel
          trigger:
            - call: "POST /api/grants"
              payload: { employee_id: "${emp_id}", asset_id: "${a_id}", justification: "want access", expires_at: "2026-04-01T00:00:00Z" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { err: $.data.error_id }
        assert:
          - "err == ERR_NEED_TO_KNOW_VIOLATION (priority 7 safety beats priority 8 temporal ERR_EXPIRY_IN_PAST)"
          - "no AccessGrant row exists for employee ${emp_id} (request fully rejected)"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (2 instances, different metrics/endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: posture_threshold_exactly_70_strong
        grounds:
          - calculations.reasonable_measures_score
          - entities.SecretAsset.fields.protection_posture
        distinguishing_aspect: |
          Numeric threshold boundary: score_operational exactly 70 is STRONG
          (>= semantics); lapsing the 10-point POLICY measure drops it to 60
          which is ADEQUATE. Metric: weighted score; endpoint:
          POST /api/measures/{id}/state (VERIFY / LAPSED).
        test_recipe:
          setup:
            - "REGISTERED asset with TECHNICAL(25)+CONTRACTUAL(20)+PHYSICAL(15)+POLICY(10) all VERIFIED = exactly 70"
          setup_api_calls:
            - call: "POST /api/assets"
              payload: { title: "Boundary asset", description: "threshold probe", classification: "RESTRICTED", owner_department: "ENG", exposure_estimate_cents: 100000 }
              as: IPCounsel
              captures: { a_id: $.data.id }
            - call: "POST /api/assets/${a_id}/state"
              payload: { to_status: "REGISTERED" }
              as: IPCounsel
            - call: "POST /api/measures"
              payload: { asset_id: "${a_id}", measure_type: "TECHNICAL", title: "m1", evidence_uri: "s3://ev/1.pdf" }
              as: SecurityOfficer
              captures: { m_tech: $.data.id }
            - call: "POST /api/measures/${m_tech}/state"
              payload: { to_status: "IMPLEMENTED" }
              as: SecurityOfficer
              as_user_id: "sec_officer_1"
            - call: "POST /api/measures/${m_tech}/state"
              payload: { to_status: "VERIFIED" }
              as: IPCounsel
              as_user_id: "counsel_1"
            - call: "POST /api/measures"
              payload: { asset_id: "${a_id}", measure_type: "CONTRACTUAL", title: "m2", evidence_uri: "s3://ev/2.pdf" }
              as: SecurityOfficer
              captures: { m_con: $.data.id }
            - call: "POST /api/measures/${m_con}/state"
              payload: { to_status: "IMPLEMENTED" }
              as: SecurityOfficer
              as_user_id: "sec_officer_1"
            - call: "POST /api/measures/${m_con}/state"
              payload: { to_status: "VERIFIED" }
              as: IPCounsel
              as_user_id: "counsel_1"
            - call: "POST /api/measures"
              payload: { asset_id: "${a_id}", measure_type: "PHYSICAL", title: "m3", evidence_uri: "s3://ev/3.pdf" }
              as: SecurityOfficer
              captures: { m_phy: $.data.id }
            - call: "POST /api/measures/${m_phy}/state"
              payload: { to_status: "IMPLEMENTED" }
              as: SecurityOfficer
              as_user_id: "sec_officer_1"
            - call: "POST /api/measures/${m_phy}/state"
              payload: { to_status: "VERIFIED" }
              as: IPCounsel
              as_user_id: "counsel_1"
            - call: "POST /api/measures"
              payload: { asset_id: "${a_id}", measure_type: "POLICY", title: "m4", evidence_uri: "s3://ev/4.pdf" }
              as: SecurityOfficer
              captures: { m_pol: $.data.id }
            - call: "POST /api/measures/${m_pol}/state"
              payload: { to_status: "IMPLEMENTED" }
              as: SecurityOfficer
              as_user_id: "sec_officer_1"
            - call: "POST /api/measures/${m_pol}/state"
              payload: { to_status: "VERIFIED" }
              as: IPCounsel
              as_user_id: "counsel_1"
          trigger:
            - call: "GET /api/assets/${a_id}"
              as: IPCounsel
              captures: { posture_at_70: $.data.protection_posture, score_at_70: $.data.score_operational }
            - call: "POST /api/measures/${m_pol}/state"
              payload: { to_status: "LAPSED" }
              as: IPCounsel
            - call: "GET /api/assets/${a_id}"
              as: IPCounsel
        assert:
          - "score_at_70 == 70 and posture_at_70 == STRONG (>= 70 boundary inclusive)"
          - "after lapsing POLICY: score_operational == 60 and protection_posture == ADEQUATE (60 < 70)"

      - name: departure_requires_exactly_zero_active_grants
        grounds:
          - state_machines.Employee.NOTICE_to_DEPARTED
          - entities.SecretAsset.fields.active_grant_count
          - "errors[ERR_ACTIVE_GRANTS_REMAIN]"
        distinguishing_aspect: |
          Zero-count boundary: with exactly 1 PROVISIONED grant the DEPARTED
          transition fails with ERR_ACTIVE_GRANTS_REMAIN; after revoking that
          single grant (count == 0) the same transition succeeds. Metric:
          integer active-grant count; endpoint: POST /api/employees/{id}/state.
        test_recipe:
          setup:
            - "ACTIVE employee (ack signed, training completed) with one PROVISIONED grant; CERTIFIED exit interview; employee moved to NOTICE (voluntary)"
          setup_api_calls:
            - call: "POST /api/employees"
              payload: { full_name: "Paula Exiting", email: "paula@x.com", department: "FIN", role_title: "Controller", access_clearance: "STANDARD", hired_at: "2026-05-01T00:00:00Z" }
              as: HRPartner
              captures: { emp_id: $.data.id }
            - call: "GET /api/acknowledgments"
              payload: { employee_id: "${emp_id}", status: "PENDING" }
              as: HRPartner
              captures: { ack_id: "$.data[0].id" }
            - call: "POST /api/acknowledgments/${ack_id}/sign"
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /api/employees/${emp_id}/state"
              payload: { to_status: "ACTIVE" }
              as: HRPartner
            - call: "GET /api/training-assignments"
              payload: { employee_id: "${emp_id}", module: "BASIC_TS" }
              as: HRPartner
              captures: { tr_id: "$.data[0].id" }
            - call: "POST /api/training-assignments/${tr_id}/state"
              payload: { to_status: "COMPLETED" }
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /api/assets"
              payload: { title: "Payroll model", description: "comp bands", classification: "CONFIDENTIAL", owner_department: "FIN", exposure_estimate_cents: 120000 }
              as: IPCounsel
              captures: { a_id: $.data.id }
            - call: "POST /api/assets/${a_id}/state"
              payload: { to_status: "REGISTERED" }
              as: IPCounsel
            - call: "POST /api/grants"
              payload: { employee_id: "${emp_id}", asset_id: "${a_id}", justification: "audit season", expires_at: "2026-12-01T00:00:00Z" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { g_id: $.data.id }
            - call: "POST /api/grants/${g_id}/state"
              payload: { to_status: "APPROVED" }
              as: SecurityOfficer
              as_user_id: "sec_officer_1"
            - call: "POST /api/grants/${g_id}/state"
              payload: { to_status: "PROVISIONED" }
              as: SecurityOfficer
            - call: "POST /api/exit-interviews"
              payload: { employee_id: "${emp_id}", scheduled_start: "2026-05-10T10:00:00Z", scheduled_end: "2026-05-10T11:00:00Z" }
              as: HRPartner
              captures: { ei_id: $.data.id }
            - call: "POST /api/exit-interviews/${ei_id}/state"
              payload: { to_status: "CONDUCTED" }
              as: HRPartner
            - call: "PATCH /api/exit-interviews/${ei_id}"
              payload: { return_certification: true, obligations_reiterated: true }
              as: HRPartner
            - call: "POST /api/exit-interviews/${ei_id}/state"
              payload: { to_status: "CERTIFIED" }
              as: HRPartner
            - call: "POST /api/employees/${emp_id}/state"
              payload: { to_status: "NOTICE", departure_type: "VOLUNTARY" }
              as: HRPartner
          trigger:
            - call: "POST /api/employees/${emp_id}/state"
              payload: { to_status: "DEPARTED" }
              as: HRPartner
              captures: { err: $.data.error_id }
            - call: "POST /api/grants/${g_id}/state"
              payload: { to_status: "REVOKED" }
              as: SecurityOfficer
            - call: "POST /api/employees/${emp_id}/state"
              payload: { to_status: "DEPARTED" }
              as: HRPartner
        assert:
          - "err == ERR_ACTIVE_GRANTS_REMAIN (count 1 > 0 blocks departure)"
          - "after the single REVOKE (count == 0): Employee.${emp_id}.status == DEPARTED"
          - "SecretAsset.${a_id}.active_grant_count == 0"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (3 instances, different pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: disclosure_review_requires_active_nda
        grounds:
          - state_machines.DisclosureRequest.SUBMITTED_to_UNDER_REVIEW
          - "errors[ERR_NDA_NOT_ACTIVE]"
        distinguishing_aspect: |
          Pair DisclosureRequest -> NdaAgreement: UNDER_REVIEW is rejected with
          ERR_NDA_NOT_ACTIVE while the NDA is merely SENT; after the NDA is
          EXECUTED and ACTIVATED the same transition succeeds.
        test_recipe:
          setup:
            - "REGISTERED asset; NDA in SENT (not yet executed); submitted disclosure"
          setup_api_calls:
            - call: "POST /api/counterparties"
              payload: { legal_name: "Kappa Print", counterparty_type: "VENDOR" }
              as: IPCounsel
              captures: { cp_id: $.data.id }
            - call: "POST /api/ndas"
              payload: { counterparty_id: "${cp_id}", template_version: "t9", governing_law: "OR", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z", survival_months: 6, classification_ceiling: "CONFIDENTIAL" }
              as: IPCounsel
              captures: { nda_id: $.data.id }
            - call: "POST /api/ndas/${nda_id}/state"
              payload: { to_status: "SENT" }
              as: IPCounsel
            - call: "POST /api/assets"
              payload: { title: "Packaging dieline", description: "box spec", classification: "CONFIDENTIAL", owner_department: "MKT", exposure_estimate_cents: 40000 }
              as: IPCounsel
              captures: { a_id: $.data.id }
            - call: "POST /api/assets/${a_id}/state"
              payload: { to_status: "REGISTERED" }
              as: IPCounsel
            - call: "POST /api/employees"
              payload: { full_name: "Quinn Brand", email: "quinn@x.com", department: "MKT", role_title: "Designer", access_clearance: "STANDARD", hired_at: "2026-05-01T00:00:00Z" }
              as: HRPartner
              captures: { emp_id: $.data.id }
            - call: "POST /api/disclosures"
              payload: { asset_id: "${a_id}", nda_id: "${nda_id}", purpose: "Packaging print", marking_protocol: "STAMPED_CONFIDENTIAL", planned_disclosure_date: "2026-07-01T00:00:00Z" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { d_id: $.data.id }
            - call: "POST /api/disclosures/${d_id}/state"
              payload: { to_status: "SUBMITTED" }
              as: Employee
              as_user_id: "${emp_id}"
          trigger:
            - call: "POST /api/disclosures/${d_id}/state"
              payload: { to_status: "UNDER_REVIEW" }
              as: IPCounsel
              captures: { err: $.data.error_id }
            - call: "POST /api/ndas/${nda_id}/state"
              payload: { to_status: "EXECUTED" }
              as: CounterpartyRep
              as_user_id: "${cp_id}"
            - call: "POST /api/ndas/${nda_id}/state"
              payload: { to_status: "ACTIVE" }
              as: IPCounsel
            - call: "POST /api/disclosures/${d_id}/state"
              payload: { to_status: "UNDER_REVIEW" }
              as: IPCounsel
        assert:
          - "err == ERR_NDA_NOT_ACTIVE while NDA is SENT"
          - "after NDA ACTIVE: DisclosureRequest.${d_id}.status == UNDER_REVIEW"
          - "DisclosureRequest.${d_id}.pinned_nda_version == 2 (pin frozen at SUBMITTED while NDA was SENT; later EXECUTED/ACTIVE bumps do not rewrite the pin)"

      - name: employee_activation_requires_signed_current_ack
        grounds:
          - state_machines.Employee.PREBOARDING_to_ACTIVE
          - "errors[ERR_ACK_REQUIRED]"
        distinguishing_aspect: |
          Pair Employee -> Acknowledgment: PREBOARDING -> ACTIVE is rejected
          with ERR_ACK_REQUIRED while the employee's acknowledgment is PENDING;
          after the employee signs it (SIGNED on current policy v1) the same
          transition succeeds.
        test_recipe:
          setup:
            - "Employee created (auto PENDING ack at v1); nothing signed"
          setup_api_calls:
            - call: "POST /api/employees"
              payload: { full_name: "Rita Newbie", email: "rita@x.com", department: "ENG", role_title: "SDE", access_clearance: "STANDARD", hired_at: "2026-05-01T00:00:00Z" }
              as: HRPartner
              captures: { emp_id: $.data.id }
            - call: "GET /api/acknowledgments"
              payload: { employee_id: "${emp_id}", status: "PENDING" }
              as: HRPartner
              captures: { ack_id: "$.data[0].id" }
          trigger:
            - call: "POST /api/employees/${emp_id}/state"
              payload: { to_status: "ACTIVE" }
              as: HRPartner
              captures: { err: $.data.error_id }
            - call: "POST /api/acknowledgments/${ack_id}/sign"
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /api/employees/${emp_id}/state"
              payload: { to_status: "ACTIVE" }
              as: HRPartner
        assert:
          - "err == ERR_ACK_REQUIRED while ack PENDING"
          - "after signing: Employee.${emp_id}.status == ACTIVE"
          - "Acknowledgment.${ack_id}.status == SIGNED and policy_version == v1"

      - name: evidence_release_blocked_by_active_preservation
        grounds:
          - state_machines.EvidenceItem.SEALED_to_RELEASED
          - "errors[ERR_PRESERVATION_HOLD_ACTIVE]"
        distinguishing_aspect: |
          Pair EvidenceItem -> PreservationNotice: releasing a SEALED evidence
          item fails with ERR_PRESERVATION_HOLD_ACTIVE while an ACTIVE notice
          covers its review; after SeniorCounsel releases the notice the same
          release succeeds.
        test_recipe:
          setup:
            - "Forensic review (POLICY trigger) in IMAGING with one SEALED evidence item; ACTIVE preservation notice covering the review"
          setup_api_calls:
            - call: "POST /api/employees"
              payload: { full_name: "Sam Watched", email: "sam@x.com", department: "ENG", role_title: "SDE2", access_clearance: "STANDARD", hired_at: "2026-05-01T00:00:00Z" }
              as: HRPartner
              captures: { emp_id: $.data.id }
            - call: "GET /api/acknowledgments"
              payload: { employee_id: "${emp_id}", status: "PENDING" }
              as: HRPartner
              captures: { ack_id: "$.data[0].id" }
            - call: "POST /api/acknowledgments/${ack_id}/sign"
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /api/employees/${emp_id}/state"
              payload: { to_status: "ACTIVE" }
              as: HRPartner
            - call: "POST /api/forensic-reviews"
              payload: { employee_id: "${emp_id}", trigger_reason: "POLICY" }
              as: IPCounsel
              captures: { rev_id: $.data.id }
            - call: "POST /api/forensic-reviews/${rev_id}/state"
              payload: { to_status: "IMAGING" }
              as: SecurityOfficer
            - call: "POST /api/evidence-items"
              payload: { review_id: "${rev_id}", source: "ACCESS_LOG", sha256: "cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc", byte_size: 2048 }
              as: SecurityOfficer
              captures: { ev_id: $.data.id }
            - call: "POST /api/evidence-items/${ev_id}/state"
              payload: { to_status: "SEALED" }
              as: SecurityOfficer
            - call: "POST /api/preservation-notices"
              payload: { legal_matter_ref: "M-2026-001", review_ids: ["${rev_id}"] }
              as: IPCounsel
              captures: { pn_id: $.data.id }
            - call: "POST /api/preservation-notices/${pn_id}/state"
              payload: { to_status: "ISSUED" }
              as: IPCounsel
            - call: "POST /api/preservation-notices/${pn_id}/state"
              payload: { to_status: "ACTIVE" }
              as: IPCounsel
          trigger:
            - call: "POST /api/evidence-items/${ev_id}/state"
              payload: { to_status: "RELEASED" }
              as: IPCounsel
              captures: { err: $.data.error_id }
            - call: "POST /api/preservation-notices/${pn_id}/state"
              payload: { to_status: "RELEASED" }
              as: SeniorCounsel
              as_user_id: "senior_1"
            - call: "POST /api/evidence-items/${ev_id}/state"
              payload: { to_status: "RELEASED" }
              as: IPCounsel
        assert:
          - "err == ERR_PRESERVATION_HOLD_ACTIVE while notice ACTIVE"
          - "after notice RELEASED: EvidenceItem.${ev_id}.status == RELEASED"
          - "PreservationNotice.${pn_id}.status == RELEASED"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (2 instances, different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: nda_closed_interval_touch_conflicts
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_NDA_WINDOW_OVERLAP]"
          - entities.NdaAgreement.fields.supersedes_id
        distinguishing_aspect: |
          Closed-interval semantics on the Counterparty resource: two NDA
          windows that merely TOUCH at an endpoint ([2026-01-01,2026-12-31] vs
          [2026-12-31,2027-06-30]) conflict — adjacency is NOT allowed. The
          supersede carve-out: an amendment via /amendments may overlap the NDA
          it supersedes; activating it SUPERSEDES the old one.
        test_recipe:
          setup:
            - "Counterparty with one DRAFT NDA [2026-01-01, 2026-12-31]"
          setup_api_calls:
            - call: "POST /api/counterparties"
              payload: { legal_name: "Lambda Warehousing", counterparty_type: "VENDOR" }
              as: IPCounsel
              captures: { cp_id: $.data.id }
            - call: "POST /api/ndas"
              payload: { counterparty_id: "${cp_id}", template_version: "t10", governing_law: "NV", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2026-12-31T00:00:00Z", survival_months: 6, classification_ceiling: "INTERNAL" }
              as: IPCounsel
              captures: { nda1_id: $.data.id }
          trigger:
            - call: "POST /api/ndas"
              payload: { counterparty_id: "${cp_id}", template_version: "t10b", governing_law: "NV", effective_date: "2026-12-31T00:00:00Z", expiry_date: "2027-06-30T00:00:00Z", survival_months: 6, classification_ceiling: "INTERNAL" }
              as: IPCounsel
              captures: { err: $.data.error_id }
            - call: "POST /api/ndas/${nda1_id}/state"
              payload: { to_status: "SENT" }
              as: IPCounsel
            - call: "POST /api/ndas/${nda1_id}/state"
              payload: { to_status: "EXECUTED" }
              as: CounterpartyRep
              as_user_id: "${cp_id}"
            - call: "POST /api/ndas/${nda1_id}/state"
              payload: { to_status: "ACTIVE" }
              as: IPCounsel
            - call: "GET /api/ndas/${nda1_id}"
              as: IPCounsel
              captures: { nda1_v: $.data.version }
            - call: "POST /api/ndas/${nda1_id}/amendments"
              payload: { template_version: "t11", governing_law: "NV", effective_date: "2026-06-01T00:00:00Z", expiry_date: "2027-05-31T00:00:00Z", survival_months: 12, classification_ceiling: "CONFIDENTIAL", expected_superseded_nda_version: "${nda1_v}" }
              as: IPCounsel
              captures: { nda2_id: $.data.id }
            - call: "POST /api/ndas/${nda2_id}/state"
              payload: { to_status: "SENT" }
              as: IPCounsel
            - call: "POST /api/ndas/${nda2_id}/state"
              payload: { to_status: "EXECUTED" }
              as: CounterpartyRep
              as_user_id: "${cp_id}"
            - call: "POST /api/ndas/${nda2_id}/state"
              payload: { to_status: "ACTIVE" }
              as: IPCounsel
            - call: "GET /api/ndas/${nda1_id}"
              as: IPCounsel
        assert:
          - "err == ERR_NDA_WINDOW_OVERLAP for the endpoint-touching non-amendment create (closed intervals: shared endpoint counts as overlap)"
          - "amendment NdaAgreement.${nda2_id}.supersedes_id == ${nda1_id} and window overlap with its superseded NDA is allowed"
          - "after amendment activation: NdaAgreement.${nda1_id}.status == SUPERSEDED and ${nda2_id}.status == ACTIVE"

      - name: department_audit_seven_day_buffer
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_AUDIT_WINDOW_CONFLICT]"
        distinguishing_aspect: |
          Gap/buffer semantics on the department resource (different from the
          NDA closed-interval rule): a new clean-desk audit for the same
          department must leave >= 7 clear days after every non-terminal prior
          audit window. Start 2026-06-08 (6 days after the 06-02 window end)
          conflicts; start 2026-06-09 (exactly 7 days) is accepted.
        test_recipe:
          setup:
            - "One SCHEDULED audit for department PLANT with window [2026-06-01, 2026-06-02]"
          setup_api_calls:
            - call: "POST /api/clean-desk-audits"
              payload: { department: "PLANT", window_start: "2026-06-01T00:00:00Z", window_end: "2026-06-02T00:00:00Z" }
              as: SecurityOfficer
              captures: { aud1: $.data.id }
          trigger:
            - call: "POST /api/clean-desk-audits"
              payload: { department: "PLANT", window_start: "2026-06-08T00:00:00Z", window_end: "2026-06-09T00:00:00Z" }
              as: SecurityOfficer
              captures: { err: $.data.error_id }
            - call: "POST /api/clean-desk-audits"
              payload: { department: "PLANT", window_start: "2026-06-09T00:00:00Z", window_end: "2026-06-10T00:00:00Z" }
              as: SecurityOfficer
              captures: { aud2: $.data.id }
            - call: "POST /api/clean-desk-audits"
              payload: { department: "LAB", window_start: "2026-06-03T00:00:00Z", window_end: "2026-06-04T00:00:00Z" }
              as: SecurityOfficer
              captures: { aud3: $.data.id }
        assert:
          - "err == ERR_AUDIT_WINDOW_CONFLICT for the 6-day gap"
          - "CleanDeskAudit.${aud2} created (201) at exactly the 7-day boundary (buffer is inclusive-satisfying: gap >= 7 days)"
          - "CleanDeskAudit.${aud3} created (201): buffer is per-department, LAB unaffected by PLANT audits"

  # ===========================================================================
  # Rule 9 — compensating_invariant (2 instances, different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: grant_approve_revoke_count_conservation
        grounds:
          - calculations.active_grant_count
          - state_machines.AccessGrant.REQUESTED_to_APPROVED
          - state_machines.AccessGrant.PROVISIONED_to_REVOKED
        distinguishing_aspect: |
          Conserved quantity: SecretAsset.active_grant_count. Forward APPROVE
          (+1) paired with compensating REVOKE (-1) returns the count to its
          exact prior value; DENIED never touches it; SUSPEND/UNSUSPEND never
          change it. Sequence 0 -> 1 -> 1 -> 1 -> 0 with no drift.
        test_recipe:
          setup:
            - "ACTIVE employee (ack + training done); REGISTERED CONFIDENTIAL asset; one denied grant and one live grant in play"
          setup_api_calls:
            - call: "POST /api/employees"
              payload: { full_name: "Tess Guard", email: "tess@x.com", department: "OPS", role_title: "Guard", access_clearance: "STANDARD", hired_at: "2026-05-01T00:00:00Z" }
              as: HRPartner
              captures: { emp_id: $.data.id }
            - call: "GET /api/acknowledgments"
              payload: { employee_id: "${emp_id}", status: "PENDING" }
              as: HRPartner
              captures: { ack_id: "$.data[0].id" }
            - call: "POST /api/acknowledgments/${ack_id}/sign"
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /api/employees/${emp_id}/state"
              payload: { to_status: "ACTIVE" }
              as: HRPartner
            - call: "GET /api/training-assignments"
              payload: { employee_id: "${emp_id}", module: "BASIC_TS" }
              as: HRPartner
              captures: { tr_id: "$.data[0].id" }
            - call: "POST /api/training-assignments/${tr_id}/state"
              payload: { to_status: "COMPLETED" }
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /api/assets"
              payload: { title: "Gate rotation plan", description: "physical security", classification: "CONFIDENTIAL", owner_department: "OPS", exposure_estimate_cents: 50000 }
              as: IPCounsel
              captures: { a_id: $.data.id }
            - call: "POST /api/assets/${a_id}/state"
              payload: { to_status: "REGISTERED" }
              as: IPCounsel
            - call: "POST /api/grants"
              payload: { employee_id: "${emp_id}", asset_id: "${a_id}", justification: "round 1", expires_at: "2026-12-01T00:00:00Z" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { g_denied: $.data.id }
            - call: "POST /api/grants/${g_denied}/state"
              payload: { to_status: "DENIED" }
              as: SecurityOfficer
          trigger:
            - call: "GET /api/assets/${a_id}"
              as: IPCounsel
              captures: { c0: $.data.active_grant_count }
            - call: "POST /api/grants"
              payload: { employee_id: "${emp_id}", asset_id: "${a_id}", justification: "round 2", expires_at: "2026-12-01T00:00:00Z" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { g_live: $.data.id }
            - call: "POST /api/grants/${g_live}/state"
              payload: { to_status: "APPROVED" }
              as: SecurityOfficer
              as_user_id: "sec_officer_1"
            - call: "GET /api/assets/${a_id}"
              as: IPCounsel
              captures: { c1: $.data.active_grant_count }
            - call: "POST /api/grants/${g_live}/state"
              payload: { to_status: "PROVISIONED" }
              as: SecurityOfficer
            - call: "POST /api/grants/${g_live}/state"
              payload: { to_status: "SUSPENDED" }
              as: SecurityOfficer
            - call: "GET /api/assets/${a_id}"
              as: IPCounsel
              captures: { c2: $.data.active_grant_count }
            - call: "POST /api/grants/${g_live}/state"
              payload: { to_status: "REVOKED" }
              as: SecurityOfficer
            - call: "GET /api/assets/${a_id}"
              as: IPCounsel
              captures: { c3: $.data.active_grant_count }
        assert:
          - "c0 == 0 (DENIED grant never entered the active set)"
          - "c1 == 1 (APPROVED +1)"
          - "c2 == 1 (SUSPENDED still counted)"
          - "c3 == 0 == c0 (REVOKE compensates APPROVE exactly; no drift)"

      - name: obligation_bucket_total_conservation
        grounds:
          - calculations.nda_obligation_counts
          - state_machines.NdaObligation.PENDING_to_FULFILLED
          - state_machines.NdaObligation.PENDING_to_WAIVED
        distinguishing_aspect: |
          Conserved quantity: NdaAgreement.obligations_total_count. FULFILL and
          WAIVE move a row between buckets (open -> fulfilled / open -> waived)
          without ever changing total: after 1 fulfill + 1 waive + 1 escalate,
          total stays 3 and open + fulfilled + waived == total at every step.
        test_recipe:
          setup:
            - "DRAFT NDA with three PENDING obligations; one made OVERDUE via sweep then ESCALATED"
          setup_api_calls:
            - call: "POST /api/counterparties"
              payload: { legal_name: "Mu Analytics", counterparty_type: "CONSULTANT" }
              as: IPCounsel
              captures: { cp_id: $.data.id }
            - call: "POST /api/ndas"
              payload: { counterparty_id: "${cp_id}", template_version: "t12", governing_law: "CO", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z", survival_months: 6, classification_ceiling: "INTERNAL" }
              as: IPCounsel
              captures: { nda_id: $.data.id }
            - call: "POST /api/obligations"
              payload: { nda_id: "${nda_id}", obligation_type: "NON_DISCLOSURE" }
              as: IPCounsel
              captures: { ob1: $.data.id }
            - call: "POST /api/obligations"
              payload: { nda_id: "${nda_id}", obligation_type: "NON_USE" }
              as: IPCounsel
              captures: { ob2: $.data.id }
            - call: "POST /api/obligations"
              payload: { nda_id: "${nda_id}", obligation_type: "AUDIT_RIGHT", due_at: "2026-05-10T00:00:00Z" }
              as: IPCounsel
              captures: { ob3: $.data.id }
          trigger:
            - call: "POST /api/obligations/${ob1}/state"
              payload: { to_status: "FULFILLED" }
              as: CounterpartyRep
              as_user_id: "${cp_id}"
            - call: "GET /api/ndas/${nda_id}"
              as: IPCounsel
              captures: { t_after_fulfill: $.data.obligations_total_count, o_after_fulfill: $.data.obligations_open_count }
            - call: "POST /api/obligations/${ob2}/state"
              payload: { to_status: "WAIVED" }
              as: IPCounsel
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: IPCounsel
            - call: "POST /api/program/sweep"
              as: IPCounsel
            - call: "POST /api/obligations/${ob3}/state"
              payload: { to_status: "ESCALATED" }
              as: IPCounsel
            - call: "GET /api/ndas/${nda_id}"
              as: IPCounsel
        assert:
          - "t_after_fulfill == 3 and o_after_fulfill == 2 (fulfill moved one bucket, total conserved)"
          - "final: obligations_total_count == 3 (creation count never changes)"
          - "final: obligations_open_count == 1 (ESCALATED stays open), obligations_fulfilled_count == 1, obligations_waived_count == 1"
          - "invariant: 1 + 1 + 1 == 3 == obligations_total_count"
