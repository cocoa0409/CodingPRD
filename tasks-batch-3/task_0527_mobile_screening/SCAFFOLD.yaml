    side_effects: []
  - method: POST
    path: "/charges/{id}/adjudicate"
    description: "Adjudicate a charge (DRAFT -> ADJUDICATED); computes final responsibility"
    roles: [BillingClerk]
    code: 200
    input: ["expected_charge_version", "insurance_allowed_cents?"]
    output: Charge
    side_effects: ["compute final_patient_responsibility_cents", "increments Charge.version by 1"]
  - method: POST
    path: "/charges/{id}/settle"
    description: "Settle a charge (ADJUDICATED -> SETTLED); grant settled_cents updated"
    roles: [BillingClerk]
    code: 200
    input: ["expected_charge_version"]
    output: Charge
    side_effects: ["if grant-funded grant.settled_cents += grant_covered_cents", "increments Charge.version by 1"]
  - method: POST
    path: "/charges/{id}/void"
    description: "Void a charge (DRAFT|ADJUDICATED -> VOID); restores grant headroom"
    roles: [BillingClerk]
    code: 200
    input: []
    output: Charge
    side_effects: ["if grant-funded grant.committed_cents -= grant_covered_cents", "increments Charge.version by 1"]

  # ---- Reminder ----
  - method: POST
    path: "/reminders"
    description: "Create a reminder for an appointment"
    roles: [ProgramManager]
    code: 201
    input: [appointment_id, send_at_min, channel]
    output: Reminder
    side_effects: []
  - method: GET
    path: "/reminders"
    description: "List reminders, filterable by appointment_id (reverse-reachability for Reminder.appointment_id)"
    roles: [ProgramManager, ClinicalStaff]
    code: 200
    input: ["appointment_id?", "status?", "limit?", "offset?"]
    output: "Reminder[]"
    side_effects: []
  - method: GET
    path: "/reminders/{id}"
    description: "Get a reminder"
    roles: [ProgramManager, ClinicalStaff]
    code: 200
    input: []
    output: Reminder
    side_effects: []
  - method: POST
    path: "/reminders/{id}/send"
    description: "Send a reminder (PENDING -> SENT) when due and appointment active"
    roles: [ProgramManager]
    code: 200
    input: []
    output: Reminder
    side_effects: ["increments Reminder.version by 1"]
  - method: POST
    path: "/reminders/{id}/cancel"
    description: "Cancel a PENDING reminder (-> CANCELLED)"
    roles: [ProgramManager]
    code: 200
    input: []
    output: Reminder
    side_effects: ["increments Reminder.version by 1"]

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role unknown" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }
  # --- Not found ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Generic resource not found" }
  - { id: ERR_UNIT_NOT_FOUND, http: 404, condition: "MobileUnit not found" }
  - { id: ERR_STAFF_NOT_FOUND, http: 404, condition: "StaffMember not found" }
  - { id: ERR_SPONSOR_NOT_FOUND, http: 404, condition: "Sponsor not found" }
  - { id: ERR_GRANT_NOT_FOUND, http: 404, condition: "Grant not found" }
  - { id: ERR_EVENT_NOT_FOUND, http: 404, condition: "ScreeningEvent not found" }
  - { id: ERR_PARTICIPANT_NOT_FOUND, http: 404, condition: "Participant not found" }
  - { id: ERR_APPOINTMENT_NOT_FOUND, http: 404, condition: "Appointment not found" }
  - { id: ERR_REFERRAL_NOT_FOUND, http: 404, condition: "Referral not found" }
  - { id: ERR_CHARGE_NOT_FOUND, http: 404, condition: "Charge not found" }
  - { id: ERR_REMINDER_NOT_FOUND, http: 404, condition: "Reminder not found" }
  # --- Input validation ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/mistyped body field, out-of-range enum/number, window_end_min <= window_start_min, slot_duration_min < 1, daily_capacity < 1, missing insurance_member_id for INSURANCE, missing grant_id for GRANT" }
  # --- State ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state that permits this transition (includes terminal lockdown and idempotent re-fire)" }
  # --- Business ---
  - { id: ERR_CONSENT_REQUIRED, http: 409, condition: "Check-in attempted before consent recorded" }
  - { id: ERR_EVENT_NOT_PUBLISHED, http: 409, condition: "Appointment check-in attempted while parent event is not PUBLISHED" }
  - { id: ERR_EVENT_NOT_CLOSED, http: 409, condition: "No-show mark attempted before parent event is CLOSED" }
  - { id: ERR_OPEN_APPOINTMENTS_EXIST, http: 409, condition: "Close attempted while an appointment on the event is still SCHEDULED/CHECKED_IN/SCREENED/RESULT_READY" }
  - { id: ERR_NO_CREDENTIALED_STAFF, http: 409, condition: "Screen/deliver-result requires an ACTIVE credentialed staff member of the event modality (TECHNOLOGIST/PHLEBOTOMIST for screen; RADIOLOGIST for MAMMOGRAPHY result)" }
  - { id: ERR_REFERRAL_UNRESOLVED, http: 409, condition: "Closing an ABNORMAL appointment whose linked referral is not RESOLVED or LOST_TO_FOLLOWUP" }
  - { id: ERR_PARTICIPANT_BLOCKED, http: 409, condition: "Booking attempted for a BLOCKED participant" }
  - { id: ERR_SLOT_OUTSIDE_WINDOW, http: 422, condition: "Appointment slot interval not fully within the event window" }
  - { id: ERR_SLOT_OVERLAP, http: 409, condition: "Appointment slot half-open interval overlaps an existing non-cancelled appointment on the same event" }
  - { id: ERR_EVENT_FULL, http: 409, condition: "Event booked_count already at mobile_unit.daily_capacity" }
  - { id: ERR_GRANT_DEPLETED, http: 409, condition: "GRANT participant booking against a depleted grant (remaining_cents <= DEPLETION_FLOOR_CENTS)" }
  - { id: ERR_UNIT_UNAVAILABLE, http: 409, condition: "Publish attempted with a RETIRED mobile unit" }
  - { id: ERR_MODALITY_MISMATCH, http: 409, condition: "event.modality != mobile_unit.modality at publish" }
  - { id: ERR_UNIT_DAY_CONFLICT, http: 409, condition: "Publish would place the unit on a calendar day it already occupies (another PUBLISHED/CLOSED event, same unit + date)" }
  - { id: ERR_INVALID_ADJUDICATION, http: 422, condition: "INSURANCE adjudication missing insurance_allowed_cents or not in [0, list_price_cents]" }
  - { id: ERR_APPOINTMENT_NOT_ACTIVE, http: 409, condition: "Reminder send attempted while its appointment is not in {SCHEDULED, CHECKED_IN}" }
  - { id: ERR_REMINDER_NOT_DUE, http: 409, condition: "Reminder send attempted before its send_at_min on event_date (per logical clock)" }
  # --- Concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_charge_version does not match the charge's current version on adjudicate/settle" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: ProgramManager
    description: "Owns program setup, roster, sponsors/grants, events, participant lifecycle, reminders, and event-day operations (cancel/no-show)."
    identity: opaque
    exclusive_operations:
      - "POST /mobile-units, POST /mobile-units/{id}/retire"
      - "POST /staff, POST /staff/{id}/deactivate"
      - "POST /sponsors, POST /grants"
      - "POST /screening-events, POST /screening-events/{id}/publish, /close, /cancel"
      - "POST /participants/{id}/reinstate"
      - "POST /appointments/{id}/cancel, POST /appointments/{id}/mark-no-show"
      - "POST /reminders, POST /reminders/{id}/send, POST /reminders/{id}/cancel"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /participants (with ClinicalStaff)"
      - "POST /appointments (with ClinicalStaff)"
      - "POST /appointments/{id}/consent (with ClinicalStaff)"
      - "GET reads across events/appointments/participants/charges/grants/referrals/reminders"

  - name: ClinicalStaff
    description: "On-site clinical operations: registers participants, books, records consent, checks in, screens, delivers results, closes appointments."
    identity: opaque
    exclusive_operations:
      - "POST /appointments/{id}/check-in"
      - "POST /appointments/{id}/screen"
      - "POST /appointments/{id}/deliver-result"
      - "POST /appointments/{id}/close"
    shared_operations:
      - "POST /participants (with ProgramManager)"
      - "POST /appointments (with ProgramManager)"
      - "POST /appointments/{id}/consent (with ProgramManager)"
      - "GET reads across events/appointments/participants/staff/referrals/reminders/summary"

  - name: BillingClerk
    description: "Owns the billing lifecycle: adjudicate, settle, void charges."
    identity: opaque
    exclusive_operations:
      - "POST /charges/{id}/adjudicate"
      - "POST /charges/{id}/settle"
      - "POST /charges/{id}/void"
    shared_operations:
      - "GET reads across charges/grants/sponsors/events/appointments"

  - name: PatientNavigator
    description: "Owns abnormal-result navigation: contacts, schedules follow-up, resolves or marks referrals lost."
    identity: opaque
    exclusive_operations:
      - "POST /referrals/{id}/contact"
      - "POST /referrals/{id}/schedule-followup"
      - "POST /referrals/{id}/resolve"
      - "POST /referrals/{id}/mark-lost"
    shared_operations:
      - "GET reads across referrals/appointments/participants"

  - name: SponsorViewer
    description: "Read-only sponsor stakeholder: reads its own sponsor record, grants, events, and computed sponsor report. X-User-ID must equal the sponsor's viewer_user_id for report/sponsor reads."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /sponsors/{id}, GET /sponsors/{id}/report"
      - "GET /grants/{id}, GET /screening-events (filtered by sponsor_id)"
