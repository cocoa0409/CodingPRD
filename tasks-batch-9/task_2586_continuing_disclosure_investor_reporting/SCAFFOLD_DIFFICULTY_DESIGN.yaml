              captures: { filing2_status: "$.data.status" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: FinanceDirector
              as_user_id: "fd-1"
            - call: "POST /disclosure/calendar-sweeps"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { sweep_suspended: "$.data.suspended_engagement_count", sweep_missed: "$.data.missed_event_count" }
            - call: "GET /disclosure/dissemination-engagements/${eng_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { eng_status: "$.data.status", lapse: "$.data.monitoring_lapse_days" }
          trigger:
            - call: "POST /disclosure/filings/${filing1_id}/confirm"
              payload: { repository_receipt_id: "EMMA-CG-2026-0002" }
              as: DisseminationAgent
              as_user_id: "${eng_id}"
              captures: { err_a: "$.data.error_id" }
            - call: "POST /disclosure/filings/${filing2_id}/confirm"
              payload: { repository_receipt_id: "EMMA-CG-2026-0003" }
              as: DisseminationAgent
              as_user_id: "${eng_id}"
              captures: { err_b: "$.data.error_id" }
          assert:
            - "${notice_deadline} == \"2026-07-16\""
            - "${filing1_status} == CONFIRMED and ${filing2_status} == SUBMITTED before the clock moves"
            - "${lapse} == 50 and ${eng_status} == SUSPENDED and ${sweep_suspended} == 1"
            - "${sweep_missed} == 0 — the notice is FILING_IN_PROGRESS, which sweep step 3 does not touch"
            - "${err_a} == ERR_INVALID_STATE_TRANSITION with HTTP 409 — priority 8 wins even though priority 11 is also violated"
            - "${err_b} == ERR_ENGAGEMENT_NOT_ACTIVE with HTTP 409 — priority 11 fires alone once the status check passes"
            - "Filing.${filing1_id}.status is still CONFIRMED and its repository_receipt_id is still \"EMMA-CG-2026-0001\" — the rejected call wrote nothing"
            - "Filing.${filing2_id}.status is still SUBMITTED and its repository_receipt_id is still null"
            - "MaterialEventNotice.${notice_id}.status is still FILING_IN_PROGRESS"

      - name: duplicate_event_notice_at_priority_19_outranks_stale_occurrence_date_at_20
        grounds:
          - validations.priority_19_ERR_DUPLICATE_EVENT_NOTICE
          - validations.priority_20_ERR_OCCURRENCE_DATE_STALE
          - validations.priority_21_ERR_OCCURRENCE_DATE_IN_FUTURE
          - endpoints.POST_/disclosure/material-event-notices
        distinguishing_aspect: |
          A different priority pair on a different endpoint, and the two rules here carry
          DIFFERENT HTTP statuses (409 vs 422), so the pairing also pins the status mapping. One
          request violates both 19 and 20 and must return the 409; a sibling request that
          changes only event_type violates 20 alone and must return the 422. A third request
          proves priority 21 is a separate rule rather than a rename of 20.
        test_recipe:
          setup:
            - "One BondIssue with one Undertaking."
            - "At clock 2026-07-05 a MaterialEventNotice is opened for event_type UNSCHEDULED_DRAW_ON_RESERVE with occurrence_date 2026-07-01, and it is left in DETERMINATION_PENDING so it still counts for the duplicate check."
            - "The clock then moves to 2026-09-01, which puts 2026-07-01 sixty-two days in the past — well beyond EVENT_BACKDATE_MAX_DAYS = 30."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-05T00:00:00Z" }
              as: FinanceDirector
              as_user_id: "fd-1"
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "SEWERREV", series_designation: "2020A", security_type: "REVENUE", dated_date: "2020-04-01", final_maturity_date: "2050-04-01", original_par_amount_cents: 100000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue_id: "$.data.id" }
            - call: "POST /disclosure/undertakings"
              payload: { issue_id: "${issue_id}", fiscal_year_end_month_day: "12-31", filing_window_days: 210, timeliness_basis: "SUBMISSION_BASIS" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { und_id: "$.data.id" }
            - call: "POST /disclosure/material-event-notices"
              payload: { issue_id: "${issue_id}", event_type: "UNSCHEDULED_DRAW_ON_RESERVE", occurrence_date: "2026-07-01" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { n1_id: "$.data.id", n1_status: "$.data.status" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: FinanceDirector
              as_user_id: "fd-1"
          trigger:
            - call: "POST /disclosure/material-event-notices"
              payload: { issue_id: "${issue_id}", event_type: "UNSCHEDULED_DRAW_ON_RESERVE", occurrence_date: "2026-07-01" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { err_dup: "$.data.error_id" }
            - call: "POST /disclosure/material-event-notices"
              payload: { issue_id: "${issue_id}", event_type: "TRUSTEE_SUBSTITUTION", occurrence_date: "2026-07-01" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { err_stale: "$.data.error_id" }
            - call: "POST /disclosure/material-event-notices"
              payload: { issue_id: "${issue_id}", event_type: "TRUSTEE_SUBSTITUTION", occurrence_date: "2026-09-02" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { err_future: "$.data.error_id" }
            - call: "POST /disclosure/material-event-notices"
              payload: { issue_id: "${issue_id}", event_type: "TRUSTEE_SUBSTITUTION", occurrence_date: "2026-08-25" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { ok_id: "$.data.id", ok_deadline: "$.data.filing_deadline_date", ok_status: "$.data.status" }
          assert:
            - "${n1_status} == DETERMINATION_PENDING — a live status, so it participates in the duplicate check"
            - "${err_dup} == ERR_DUPLICATE_EVENT_NOTICE with HTTP 409 — priority 19 wins although priority 20 is equally violated by the 62-day-old occurrence_date"
            - "${err_stale} == ERR_OCCURRENCE_DATE_STALE with HTTP 422 — changing only event_type clears priority 19 and exposes priority 20"
            - "${err_future} == ERR_OCCURRENCE_DATE_IN_FUTURE with HTTP 422 — priority 21 is a distinct rule"
            - "${ok_status} == DETERMINATION_PENDING and ${ok_deadline} == \"2026-09-09\" (ten business days after 2026-08-25, with the 2026-09-07 market holiday skipped)"
            - "exactly two MaterialEventNotice rows exist on the issue: GET /disclosure/material-event-notices?issue_id=${issue_id} returns total_count 2"
            - "BondIssue.${issue_id}.open_material_event_count == 2 — the three refused requests created nothing"

  - rule_id: boundary_precision_check
    instances:

      - name: material_event_deadline_is_inclusive_on_the_tenth_business_day
        grounds:
          - calculations.material_event_filing_deadline
          - calculations.business_day_calendar
          - endpoints.POST_/disclosure/filings/{id}/confirm
          - state_machines.MaterialEventNotice.FILING_IN_PROGRESS_to_FILED_TIMELY
          - state_machines.MaterialEventNotice.FILING_IN_PROGRESS_to_FILED_LATE
        distinguishing_aspect: |
          Two notices with the IDENTICAL occurrence_date 2026-09-01 are filed one calendar day
          apart and land on opposite sides of the ten-business-day window, pinning three
          separate precision decisions at once: the window counts BUSINESS days (naive +10
          calendar days would give 2026-09-11), it skips the 2026-09-07 market holiday as well
          as two weekends, and the comparison is INCLUSIVE (<=), so filing exactly ON
          2026-09-16 is timely rather than one day late.
        test_recipe:
          setup:
            - "The logical clock starts at 2026-09-01T00:00:00Z."
            - "One OUTSTANDING BondIssue with a far-future maturity, one ACTIVE Undertaking, one ACTIVE DisseminationEngagement whose last_calendar_ack_date is 2026-09-01 so no monitoring lapse can interfere."
            - "Notice A (UNSCHEDULED_DRAW_ON_RESERVE) and notice B (TRUSTEE_SUBSTITUTION) both carry occurrence_date 2026-09-01; different event_types keep them clear of the duplicate rule. Both are determined MATERIAL and both have a DRAFT filing waiting."
            - "No calendar sweep is ever run, so nothing can move the notices to MISSED behind the test's back."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: FinanceDirector
              as_user_id: "fd-1"
            - call: "POST /disclosure/bond-issues"
