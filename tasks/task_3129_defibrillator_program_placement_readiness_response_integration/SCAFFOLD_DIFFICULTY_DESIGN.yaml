              captures: { cab: $.data.id }
            - call: "POST /api/devices"
              payload: { campus_id: "${campus_id}", device_model_id: "${dm }", serial_number: "SN-018" }
              as: ProgramManager
              captures: { dev: $.data.id, dv: $.data.version }
            - call: "POST /api/devices/${dev}/install"
              payload: { cabinet_id: "${cab}", expected_device_version: "${dv}" }
              as: ProgramManager
              captures: { dv1: $.data.version }
            - call: "POST /api/consumable-lots"
              payload: { campus_id: "${campus_id}", device_model_id: "${dm }", kind: "PAD", lot_code: "P18", manufacturer_expires_at: "2030-01-01T00:00:00Z", quantity_received: 5 }
              as: ProgramManager
              captures: { pl: $.data.id }
            - call: "POST /api/consumable-lots"
              payload: { campus_id: "${campus_id}", device_model_id: "${dm }", kind: "BATTERY", lot_code: "B18", manufacturer_expires_at: "2030-01-01T00:00:00Z", quantity_received: 5 }
              as: ProgramManager
              captures: { bl: $.data.id }
            - call: "POST /api/installs"
              payload: { device_id: "${dev}", consumable_lot_id: "${pl }", expected_device_version: "${dv1}" }
              as: ProgramManager
            - call: "GET /api/devices/${dev}"
              payload: {}
              as: ProgramManager
              captures: { dv2: $.data.version }
            - call: "POST /api/installs"
              payload: { device_id: "${dev}", consumable_lot_id: "${bl }", expected_device_version: "${dv2}" }
              as: ProgramManager
            - call: "POST /api/training-sessions"
              payload: { campus_id: "${campus_id}", instructor_id: "${md }", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-01T04:00:00Z", capacity: 5, certification_months_granted: 24 }
              as: ProgramManager
              captures: { ts: $.data.id }
            - call: "POST /api/training-sessions/${ts}/enroll"
              payload: { responder_id: "${resp}" }
              as: ProgramManager
            - call: "POST /api/training-sessions/${ts}/complete"
              payload: { attendee_ids: ["${resp}"] }
              as: ProgramManager
            - call: "POST /api/devices/${dev}/commission"
              payload: {}
              as: ProgramManager
            - call: "POST /api/cabinets/${cab}/open"
              payload: {}
              as: Anonymous
              captures: { ev: $.data.id }
            - call: "POST /api/emergency-events/${ev}/acknowledge"
              payload: {}
              as: Responder
              as_user_id: "${resp}"
            - call: "POST /api/emergency-events/${ev}/resolve"
              payload: { hospital_code: "H-18", patient_transported: true, pads_consumed: true }
              as: Responder
              as_user_id: "${resp}"
            - call: "GET /api/replenishment-orders"
              payload: { campus_id: "${campus_id}", emergency_event_id: "${ev }" }
              as: ProgramManager
              captures: { ro: "$.data[0].id" }
          trigger:
            - call: "POST /api/replenishment-orders/${ro}/receive"
              payload: { lot_code: "P18-new", manufacturer_expires_at: "2031-01-01T00:00:00Z" }
              as: ProgramManager
              captures: { new_lot: $.data.received_lot_id }
            - call: "GET /api/consumable-lots"
              payload: { campus_id: "${campus_id}", kind: "PAD" }
              as: ProgramManager
          assert:
            - "ReplenishmentOrder.${ro}.status == RECEIVED"
            - "ReplenishmentOrder.${ro}.quantity == 1"
            - "new ConsumableLot ${new_lot}.quantity_received == 1 (conserved: 1 pad consumed → 1 pad replenished)"
            - "sum of quantity_received across lots created by event ${ev} == 1"
