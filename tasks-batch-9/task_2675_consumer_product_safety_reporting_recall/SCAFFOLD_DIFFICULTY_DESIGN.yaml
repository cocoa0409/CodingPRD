# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
#
#   Task 2675 — Consumer Product Safety Reporting & Recall
#
#   Nine rule_id blocks, 20 instances. Every numeric literal in an `assert:`
#   line was produced by executing the matching §1.3 formula (Decimal,
#   ROUND_HALF_UP) against the inputs pinned in `setup_api_calls`, not estimated.
#
#   Two operator identities recur across the chains and matter to the
#   segregation-of-duties gates in §1.4 priority 7:
#     "co-1"  — the ComplianceOfficer who files (becomes Recall.submitted_by_user_id
#               and ProgressReport.prepared_by_user_id)
#     "dir-1" — the SafetyDirector who approves and accepts
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: pattern_risk_index_preliminary_versus_final_on_identical_incidents
        grounds:
          - calculations.hazard_pattern_risk_index
          - calculations.incident_severity_weight
          - entities.HazardPattern.fields.analysis_basis
          - entities.HazardPattern.fields.risk_index
          - entities.HazardPattern.fields.concentration_ratio
          - entities.HazardPattern.fields.severity_sum
          - entities.Incident.fields.injury_verified
        distinguishing_aspect: |
          This instance is the hazard_pattern_risk_index pair: PRELIMINARY drops
          unverified incidents from the inclusion set entirely while FINAL admits
          them at half weight, so the SAME four incidents yield risk_index 63.90
          under PRELIMINARY and 55.13 under FINAL — the extra unverified
          LACERATION report raises severity_sum from 42.60 to 44.10 but dilutes
          concentration_ratio from 1.0000 to 0.7500, and the dilution dominates.
        test_recipe:
          setup:
            - "logical clock at 2026-03-01T00:00:00Z"
            - "one ProductModel TOAST-X1 with units_distributed 100 (so exposure_per_10k floors at 1.0000) and units_registered 60"
            - "four CLASSIFIED incidents on that model, all with incident_date inside 2026-01-01..2026-02-28: HOSPITALIZATION/MEDICAL_EXAMINER/verified (30.00), MEDICAL_TREATMENT/RETAILER/verified (9.60), FIRST_AID/CONSUMER_HOTLINE/verified (3.00) all hazard_code BURN, plus FIRST_AID/WEB_FORM/UNVERIFIED hazard_code LACERATION (1.50)"
            - "one PRELIMINARY HazardPattern already analysed over that window"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /product-safety/product-models"
              payload: { model_code: "TOAST-X1", brand: "Hearthline", category: "KITCHEN_APPLIANCE", units_distributed: 100, units_registered: 60 }
              as: ProgramAdmin
              captures: { pm_id: $.data.id, pm_v1: $.data.version }
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "MEDICAL_EXAMINER", incident_date: "2026-01-12T00:00:00Z", narrative: "Base plate weld failed; second-degree burn, consumer hospitalised overnight." }
              as: IntakeSpecialist
              captures: { i1_id: $.data.id }
            - call: "POST /product-safety/incidents/${i1_id}/classify"
              payload: { injury_class: "HOSPITALIZATION", hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "RETAILER", incident_date: "2026-01-20T00:00:00Z", narrative: "Store return: unit overheated and scorched the counter; consumer treated at urgent care." }
              as: IntakeSpecialist
              captures: { i2_id: $.data.id }
            - call: "POST /product-safety/incidents/${i2_id}/classify"
              payload: { injury_class: "MEDICAL_TREATMENT", hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "CONSUMER_HOTLINE", incident_date: "2026-02-02T00:00:00Z", narrative: "Hotline report: minor burn to thumb, treated with first aid at home." }
              as: IntakeSpecialist
              captures: { i3_id: $.data.id }
            - call: "POST /product-safety/incidents/${i3_id}/classify"
              payload: { injury_class: "FIRST_AID", hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "WEB_FORM", incident_date: "2026-02-10T00:00:00Z", narrative: "Web form: cut finger on housing seam; no photographs supplied, injury unverified." }
              as: IntakeSpecialist
              captures: { i4_id: $.data.id }
            - call: "POST /product-safety/incidents/${i4_id}/classify"
              payload: { injury_class: "FIRST_AID", hazard_code: "LACERATION", injury_verified: false }
              as: IntakeSpecialist
            - call: "POST /product-safety/hazard-patterns"
              payload: { product_model_id: "${pm_id}", window_start: "2026-01-01T00:00:00Z", window_end: "2026-02-28T00:00:00Z", analysis_basis: "PRELIMINARY", expected_product_model_version: "${pm_v1}" }
              as: ComplianceOfficer
              captures: { hp_prelim_id: $.data.id }
            - call: "GET /product-safety/product-models/${pm_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { pm_v2: $.data.version }
          trigger:
            - call: "POST /product-safety/hazard-patterns"
              payload: { product_model_id: "${pm_id}", window_start: "2026-01-01T00:00:00Z", window_end: "2026-02-28T00:00:00Z", analysis_basis: "FINAL", expected_product_model_version: "${pm_v2}" }
              as: ComplianceOfficer
              captures: { hp_final_id: $.data.id }
          assert:
            - "Incident.${i1_id}.severity_weight == 30.00"
            - "Incident.${i2_id}.severity_weight == 9.60"
            - "Incident.${i3_id}.severity_weight == 3.00"
            - "Incident.${i4_id}.severity_weight == 1.50"
            - "HazardPattern.${hp_prelim_id}.incident_count == 3"
            - "HazardPattern.${hp_prelim_id}.severity_sum == 42.60"
            - "HazardPattern.${hp_prelim_id}.concentration_ratio == 1.0000"
            - "HazardPattern.${hp_prelim_id}.exposure_per_10k == 1.0000"
            - "HazardPattern.${hp_prelim_id}.risk_index == 63.90"
            - "HazardPattern.${hp_final_id}.incident_count == 4"
            - "HazardPattern.${hp_final_id}.severity_sum == 44.10"
            - "HazardPattern.${hp_final_id}.dominant_hazard_code == BURN"
            - "HazardPattern.${hp_final_id}.concentration_ratio == 0.7500"
            - "HazardPattern.${hp_final_id}.exposure_per_10k == 1.0000"
            - "HazardPattern.${hp_final_id}.risk_index == 55.13"
            - "HazardPattern.${hp_final_id}.pattern_confirmed == true"
            - "HazardPattern.${hp_prelim_id}.risk_index != HazardPattern.${hp_final_id}.risk_index (63.90 vs 55.13 on identical incident data)"
            - "HazardPattern.${hp_prelim_id} snapshot fields are unchanged by the FINAL analysis (incident_count still 3, severity_sum still 42.60)"

      - name: effectiveness_rate_units_basis_versus_participation_basis_same_ledger
        grounds:
          - calculations.recall_effectiveness_rate
          - entities.ProgressReport.fields.effectiveness_basis
          - entities.ProgressReport.fields.effectiveness_rate
          - entities.ProgressReport.fields.assessment
          - entities.Recall.fields.units_in_commerce
          - entities.ProductModel.fields.units_registered
        distinguishing_aspect: |
          This is a DIFFERENT calculation from the first instance — the
          recall_effectiveness_rate pair — and the divergence comes from swapping
          the DENOMINATOR, not the inclusion set: with units_corrected frozen at
          30, UNITS_BASIS divides by units_in_commerce 100 to give 30.00 while
          PARTICIPATION_BASIS divides by units_registered 60 to give 50.00.
        test_recipe:
          setup:
            - "the full recall workflow driven to plan_status MONITORING on a Recall with units_in_commerce 100 and participation_goal_pct 30.00, whose ProductModel has units_registered 60"
            - "one REFUND RemedyClaim for quantity 30 fulfilled at 2026-03-14T00:00:00Z, so Recall.units_corrected == 30 and units_outstanding == 70"
            - "logical clock advanced to 2026-05-14T00:00:00Z"
            - "one SUBMITTED UNITS_BASIS ProgressReport covering the closed period 2026-03-13..2026-04-12, and one DRAFT PARTICIPATION_BASIS report covering 2026-04-13..2026-05-13"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /product-safety/product-models"
              payload: { model_code: "TOAST-X1", brand: "Hearthline", category: "KITCHEN_APPLIANCE", units_distributed: 100, units_registered: 60 }
              as: ProgramAdmin
              captures: { pm_id: $.data.id, pm_v1: $.data.version }
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "MEDICAL_EXAMINER", incident_date: "2026-01-12T00:00:00Z", narrative: "Base plate weld failed; second-degree burn, consumer hospitalised overnight." }
              as: IntakeSpecialist
              captures: { i1_id: $.data.id }
            - call: "POST /product-safety/incidents/${i1_id}/classify"
              payload: { injury_class: "HOSPITALIZATION", hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "RETAILER", incident_date: "2026-01-20T00:00:00Z", narrative: "Store return: unit overheated and scorched the counter; consumer treated at urgent care." }
              as: IntakeSpecialist
              captures: { i2_id: $.data.id }
            - call: "POST /product-safety/incidents/${i2_id}/classify"
              payload: { injury_class: "MEDICAL_TREATMENT", hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "CONSUMER_HOTLINE", incident_date: "2026-02-02T00:00:00Z", narrative: "Hotline report: minor burn to thumb, treated with first aid at home." }
              as: IntakeSpecialist
              captures: { i3_id: $.data.id }
            - call: "POST /product-safety/incidents/${i3_id}/classify"
              payload: { injury_class: "FIRST_AID", hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
            - call: "POST /product-safety/hazard-patterns"
              payload: { product_model_id: "${pm_id}", window_start: "2026-01-01T00:00:00Z", window_end: "2026-02-28T00:00:00Z", analysis_basis: "PRELIMINARY", expected_product_model_version: "${pm_v1}" }
              as: ComplianceOfficer
              captures: { hp_id: $.data.id }
            - call: "POST /product-safety/hazard-patterns/${hp_id}/adjudicate"
              payload: { decision: "CONFIRMED" }
              as: ComplianceOfficer
            - call: "POST /product-safety/reportability-evaluations"
              payload: { hazard_pattern_id: "${hp_id}", standard_basis: "DEFECT" }
              as: ComplianceOfficer
              captures: { ev_id: $.data.id }
            - call: "POST /product-safety/reportability-evaluations/${ev_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /product-safety/reportability-evaluations/${ev_id}/determine"
              payload: { determination: "REPORTABLE", defect_score: 8, risk_score: 7, determination_note: "Base plate weld defect creates a foreseeable burn hazard in normal use." }
              as: ComplianceOfficer
            - call: "POST /product-safety/section-reports"
              payload: { reportability_evaluation_id: "${ev_id}", corrective_action_type: "REFUND", corrective_action_summary: "Full purchase-price refund plus a prepaid return label for every unit in commerce." }
              as: ComplianceOfficer
              captures: { sr_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-13T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /product-safety/section-reports/${sr_id}/submit"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /product-safety/section-reports/${sr_id}/review"
              payload: { decision: "ACCEPTED" }
              as: SafetyDirector
              as_user_id: "dir-1"
            - call: "POST /product-safety/recalls"
              payload: { section_report_id: "${sr_id}", remedy_options: ["REFUND", "REPAIR"], units_in_commerce: 100, participation_goal_pct: 30.00, correction_deadline_at: "2026-09-30T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rc_id: $.data.id }
            - call: "POST /product-safety/consumer-notices"
              payload: { recall_id: "${rc_id}", channel: "DIRECT_NOTICE", scheduled_for: "2026-03-14T00:00:00Z", reach_count: 60 }
              as: ComplianceOfficer
              captures: { cn_id: $.data.id }
            - call: "POST /product-safety/retailers"
              payload: { name: "MegaMart", channel_type: "BIG_BOX", store_count: 120 }
              as: ProgramAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /product-safety/retailer-notifications"
              payload: { recall_id: "${rc_id}", retailer_id: "${ret_id}" }
              as: ComplianceOfficer
              captures: { rn_id: $.data.id }
            - call: "POST /product-safety/recalls/${rc_id}/submit-plan"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /product-safety/recalls/${rc_id}/approve-plan"
              payload: {}
              as: SafetyDirector
              as_user_id: "dir-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-14T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /product-safety/consumer-notices/${cn_id}/release"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /product-safety/recalls/${rc_id}/begin-monitoring"
              payload: {}
              as: SafetyDirector
              as_user_id: "dir-1"
            - call: "POST /product-safety/remedy-claims"
              payload: { recall_id: "${rc_id}", consumer_ref: "CR-1001", remedy_type: "REFUND", quantity: 30, unit_price_cents: 4999, shipping_cents_per_unit: 899 }
              as: ComplianceOfficer
              captures: { cl_id: $.data.id }
            - call: "POST /product-safety/remedy-claims/${cl_id}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /product-safety/remedy-claims/${cl_id}/fulfill"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-14T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /product-safety/progress-reports"
              payload: { recall_id: "${rc_id}", period_start: "2026-03-13T00:00:00Z", period_end: "2026-04-12T00:00:00Z", effectiveness_basis: "UNITS_BASIS" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { pr1_id: $.data.id }
            - call: "POST /product-safety/progress-reports/${pr1_id}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /product-safety/progress-reports"
              payload: { recall_id: "${rc_id}", period_start: "2026-04-13T00:00:00Z", period_end: "2026-05-13T00:00:00Z", effectiveness_basis: "PARTICIPATION_BASIS" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { pr2_id: $.data.id }
          trigger:
            - call: "POST /product-safety/progress-reports/${pr2_id}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "RemedyClaim.${cl_id}.reimbursement_total_cents == 190200"
            - "Recall.${rc_id}.units_corrected == 30"
            - "Recall.${rc_id}.units_outstanding == 70"
            - "ProgressReport.${pr1_id}.effectiveness_basis == UNITS_BASIS"
            - "ProgressReport.${pr1_id}.effectiveness_rate == 30.00"
            - "ProgressReport.${pr1_id}.assessment == ON_TRACK"
            - "ProgressReport.${pr1_id}.units_corrected_in_period == 30"
            - "ProgressReport.${pr1_id}.cumulative_units_corrected == 30"
            - "ProgressReport.${pr2_id}.effectiveness_basis == PARTICIPATION_BASIS"
            - "ProgressReport.${pr2_id}.effectiveness_rate == 50.00"
            - "ProgressReport.${pr2_id}.assessment == ON_TRACK"
            - "ProgressReport.${pr2_id}.units_corrected_in_period == 0"
            - "ProgressReport.${pr2_id}.cumulative_units_corrected == 30"
            - "ProgressReport.${pr1_id}.effectiveness_rate != ProgressReport.${pr2_id}.effectiveness_rate (30.00 vs 50.00 from the identical units_corrected == 30)"
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: civil_penalty_assessment_violation_injury_lateness_matrix
        grounds:
          - calculations.civil_penalty_assessment
          - calculations.section_report_lateness
          - entities.CivilPenaltyCase.fields.assessed_penalty_cents
          - entities.CivilPenaltyCase.fields.violation_count
          - entities.CivilPenaltyCase.fields.available_cents
        distinguishing_aspect: |
          Mode (a) — MULTI-FACTOR MULTIPLICATIVE COMPOSITION. assessed_penalty_cents
          folds three independent factors that each come from a different entity:
          violation_count (4) from the case payload, the worst injury_class across
          the pattern's ESCALATED incidents (HOSPITALIZATION -> 1.25) from Incident,
          and days_late (2 -> 1.10) from SectionReport. 4 * 1000000 * 1.25 * 1.10 =
          5500000. Getting any one factor wrong, or applying the lateness multiplier
          additively rather than multiplicatively, yields a different number; the
          fixture is chosen so that no two of the three factors are interchangeable.
        test_recipe:
          setup:
            - "logical clock at 2026-03-01T00:00:00Z"
            - "TOAST-X1 with three verified BURN incidents whose worst injury_class is HOSPITALIZATION"
            - "a CONFIRMED HazardPattern, a REPORTABLE ReportabilityEvaluation with report_due_at 2026-03-11T00:00:00Z"
            - "a SectionReport submitted at 2026-03-13T00:00:00Z (days_late 2) and ACCEPTED by dir-1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /product-safety/product-models"
              payload: { model_code: "TOAST-X1", brand: "Hearthline", category: "KITCHEN_APPLIANCE", units_distributed: 100, units_registered: 60 }
              as: ProgramAdmin
              captures: { pm_id: $.data.id, pm_v1: $.data.version }
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "MEDICAL_EXAMINER", incident_date: "2026-01-12T00:00:00Z", narrative: "Base plate weld failed; second-degree burn, consumer hospitalised overnight." }
              as: IntakeSpecialist
              captures: { i1_id: $.data.id }
            - call: "POST /product-safety/incidents/${i1_id}/classify"
              payload: { injury_class: "HOSPITALIZATION", hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "RETAILER", incident_date: "2026-01-20T00:00:00Z", narrative: "Store return: unit overheated and scorched the counter; consumer treated at urgent care." }
              as: IntakeSpecialist
              captures: { i2_id: $.data.id }
            - call: "POST /product-safety/incidents/${i2_id}/classify"
              payload: { injury_class: "MEDICAL_TREATMENT", hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "CONSUMER_HOTLINE", incident_date: "2026-02-02T00:00:00Z", narrative: "Hotline report: minor burn to thumb, treated with first aid at home." }
              as: IntakeSpecialist
              captures: { i3_id: $.data.id }
            - call: "POST /product-safety/incidents/${i3_id}/classify"
              payload: { injury_class: "FIRST_AID", hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
            - call: "POST /product-safety/hazard-patterns"
              payload: { product_model_id: "${pm_id}", window_start: "2026-01-01T00:00:00Z", window_end: "2026-02-28T00:00:00Z", analysis_basis: "PRELIMINARY", expected_product_model_version: "${pm_v1}" }
              as: ComplianceOfficer
              captures: { hp_id: $.data.id }
            - call: "POST /product-safety/hazard-patterns/${hp_id}/adjudicate"
              payload: { decision: "CONFIRMED" }
              as: ComplianceOfficer
            - call: "POST /product-safety/reportability-evaluations"
              payload: { hazard_pattern_id: "${hp_id}", standard_basis: "DEFECT" }
              as: ComplianceOfficer
              captures: { ev_id: $.data.id }
            - call: "POST /product-safety/reportability-evaluations/${ev_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /product-safety/reportability-evaluations/${ev_id}/determine"
              payload: { determination: "REPORTABLE", defect_score: 8, risk_score: 7, determination_note: "Base plate weld defect creates a foreseeable burn hazard in normal use." }
              as: ComplianceOfficer
            - call: "POST /product-safety/section-reports"
              payload: { reportability_evaluation_id: "${ev_id}", corrective_action_type: "REFUND", corrective_action_summary: "Full purchase-price refund plus a prepaid return label for every unit in commerce." }
              as: ComplianceOfficer
              captures: { sr_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-13T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /product-safety/section-reports/${sr_id}/submit"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /product-safety/section-reports/${sr_id}/review"
              payload: { decision: "ACCEPTED" }
              as: SafetyDirector
              as_user_id: "dir-1"
          trigger:
            - call: "POST /product-safety/civil-penalty-cases"
              payload: { section_report_id: "${sr_id}", violation_count: 4 }
              as: PenaltyCounsel
              captures: { cs_id: $.data.id }
          assert:
            - "ReportabilityEvaluation.${ev_id}.report_due_at == 2026-03-11T00:00:00Z"
            - "SectionReport.${sr_id}.days_late == 2"
            - "SectionReport.${sr_id}.late_surcharge_cents == 500000"
            - "CivilPenaltyCase.${cs_id}.violation_count == 4"
            - "CivilPenaltyCase.${cs_id}.assessed_penalty_cents == 5500000"
            - "CivilPenaltyCase.${cs_id}.status == ASSESSMENT_OPEN"
            - "CivilPenaltyCase.${cs_id}.reserved_cents == 0"
            - "CivilPenaltyCase.${cs_id}.available_cents == 5500000"
            - "CivilPenaltyCase.${cs_id}.current_offer_round == 0 (no offer has consumed a round yet)"
            - "CivilPenaltyCase.${cs_id}.current_offer_cents == null"
            - "CivilPenaltyCase.${cs_id}.cooperation_bonus_applied == false"
            - "CivilPenaltyCase.${cs_id}.consent_agreement_total_cents == null"
            - "CivilPenaltyCase.${cs_id}.consent_agreement_preview_cents == 4675000"
            - "assessed_penalty_cents != 5000000 (the value an additive lateness adjustment would produce) and != 5400000 (the value a 1.20 injury multiplier would produce)"

      - name: remedy_reimbursement_per_unit_rounding_before_quantity_multiply
        grounds:
          - calculations.remedy_reimbursement_total
          - entities.RemedyClaim.fields.reimbursement_total_cents
          - entities.RemedyClaim.fields.quantity
          - entities.RemedyClaim.fields.unit_price_cents
          - entities.RemedyClaim.fields.shipping_cents_per_unit
        distinguishing_aspect: |
          Mode (b) — ORDER-OF-OPERATIONS / ROUNDING-POSITION SENSITIVITY, a
          different failure mode from the multiplicative matrix above. The handling
          fee is rounded PER UNIT and only then multiplied by quantity: a REFUND of
