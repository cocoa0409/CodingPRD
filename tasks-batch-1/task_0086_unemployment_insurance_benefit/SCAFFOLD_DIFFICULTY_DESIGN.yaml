              payload: {}
              as: Claimant
              as_user_id: "${clmt_id}"
            - call: "POST /ui/determinations"
              payload: { claim_id: "${claim_id}", determination_type: "MONETARY" }
              as: Adjudicator
            - call: "POST /ui/weekly-certifications"
              payload: { claim_id: "${claim_id}", week_ending_date: "2026-04-11", work_search_waived: true }
              as: Claimant
              as_user_id: "${clmt_id}"
          trigger:
            - call: "POST /ui/weekly-certifications"
              payload: { claim_id: "${claim_id}", week_ending_date: "2026-04-11", work_search_waived: true }
              as: Claimant
              as_user_id: "${clmt_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response error_id == ERR_DUPLICATE_RESOURCE"

      - name: work_search_contact_must_fall_within_week_interval
        grounds:
          - validations[priority=8]
          - entities.WorkSearchContact.fields.contact_date
          - errors[ERR_UNTIMELY]
        distinguishing_aspect: |
          Closed-interval containment semantics on a DIFFERENT resource
          (WeeklyCertification week window [Sunday .. week_ending_date]): a
          WorkSearchContact whose contact_date falls one day before the week's Sunday
          start is rejected ERR_UNTIMELY — interval containment, not point uniqueness.
        test_recipe:
          setup:
            - "Claim S MONETARILY_ELIGIBLE; a week ending 2026-04-11 (window Sun 2026-04-05 .. Sat 2026-04-11) filed PENDING."
          setup_api_calls:
            - call: "POST /ui/employers"
              payload: { legal_name: "Ov2 Co", state_account_number: "OV2-1", experience_rate: 0.03, reserve_opening_balance_cents: 100000000 }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /ui/claimants"
              payload: { full_name: "Ov Two", ssn_last4: "1616", date_of_birth: "1989-04-16" }
              as: ProgramAdmin
              captures: { clmt_id: $.data.id }
            - call: "POST /ui/wage-records"
              payload: { claimant_id: "${clmt_id}", employer_id: "${emp_id}", calendar_quarter: "2025-Q4", gross_wages_cents: 780000 }
              as: ProgramAdmin
            - call: "POST /ui/claims"
              payload: { claimant_id: "${clmt_id}", filed_date: "2026-04-05" }
              as: Claimant
              as_user_id: "${clmt_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /ui/claims/${claim_id}/submit"
              payload: {}
              as: Claimant
              as_user_id: "${clmt_id}"
            - call: "POST /ui/determinations"
              payload: { claim_id: "${claim_id}", determination_type: "MONETARY" }
              as: Adjudicator
            - call: "POST /ui/weekly-certifications"
              payload: { claim_id: "${claim_id}", week_ending_date: "2026-04-11" }
              as: Claimant
              as_user_id: "${clmt_id}"
              captures: { wc_id: $.data.id }
          trigger:
            - call: "POST /ui/weekly-certifications/${wc_id}/work-search-contacts"
              payload: { contact_type: "EMPLOYER_APPLICATION", contact_date: "2026-04-04", employer_id: "${emp_id}" }
              as: Claimant
              as_user_id: "${clmt_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "response error_id == ERR_UNTIMELY"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: charge_relieve_restores_employer_reserve_exactly
        grounds:
          - state_machines.EmployerCharge.POSTED_to_PROTESTED
          - state_machines.EmployerCharge.PROTESTED_to_RELIEVED
          - entities.Employer.fields.reserve_account_balance_cents
        distinguishing_aspect: |
          Conserved quantity = Employer.reserve_account_balance_cents. Forward action
          (pay -> POST charge debits 6389 from Emp X) paired with its compensation
          (protest -> relieve credits 6389 back) MUST leave the reserve at its
          pre-charge value 100000000 exactly, with no drift.
        test_recipe:
          setup:
            - "Claim D MONETARILY_ELIGIBLE; one week paid (payable 11500), Emp X charged 6389 (reserve now 99993611), the charge PROTESTED."
          setup_api_calls:
            - call: "POST /ui/employers"
              payload: { legal_name: "Emp X", state_account_number: "EX-3", experience_rate: 0.02, reserve_opening_balance_cents: 100000000 }
              as: ProgramAdmin
              captures: { emp_x: $.data.id }
            - call: "POST /ui/employers"
              payload: { legal_name: "Emp Y", state_account_number: "EY-3", experience_rate: 0.05, reserve_opening_balance_cents: 100000000 }
              as: ProgramAdmin
              captures: { emp_y: $.data.id }
            - call: "POST /ui/claimants"
              payload: { full_name: "Inv One", ssn_last4: "1717", date_of_birth: "1986-05-17" }
              as: ProgramAdmin
              captures: { clmt_id: $.data.id }
            - call: "POST /ui/wage-records"
              payload: { claimant_id: "${clmt_id}", employer_id: "${emp_x}", calendar_quarter: "2026-Q1", gross_wages_cents: 300000 }
              as: ProgramAdmin
            - call: "POST /ui/wage-records"
              payload: { claimant_id: "${clmt_id}", employer_id: "${emp_y}", calendar_quarter: "2025-Q4", gross_wages_cents: 130000 }
              as: ProgramAdmin
            - call: "POST /ui/wage-records"
              payload: { claimant_id: "${clmt_id}", employer_id: "${emp_y}", calendar_quarter: "2025-Q3", gross_wages_cents: 60000 }
              as: ProgramAdmin
            - call: "POST /ui/wage-records"
              payload: { claimant_id: "${clmt_id}", employer_id: "${emp_y}", calendar_quarter: "2025-Q2", gross_wages_cents: 50000 }
              as: ProgramAdmin
            - call: "POST /ui/claims"
              payload: { claimant_id: "${clmt_id}", filed_date: "2026-04-05" }
              as: Claimant
              as_user_id: "${clmt_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /ui/claims/${claim_id}/submit"
              payload: {}
              as: Claimant
              as_user_id: "${clmt_id}"
            - call: "POST /ui/determinations"
              payload: { claim_id: "${claim_id}", determination_type: "MONETARY" }
              as: Adjudicator
            - call: "POST /ui/weekly-certifications"
              payload: { claim_id: "${claim_id}", week_ending_date: "2026-04-11", reported_earnings_cents: 0, work_search_waived: true }
              as: Claimant
              as_user_id: "${clmt_id}"
              captures: { wc_id: $.data.id }
            - call: "POST /ui/weekly-certifications/${wc_id}/adjudicate"
              payload: { decision: "ELIGIBLE" }
              as: Adjudicator
            - call: "POST /ui/weekly-certifications/${wc_id}/pay"
              payload: {}
              as: BenefitPaymentOfficer
            - call: "GET /ui/employers/${emp_x}/charges"
              payload: {}
              as: Adjudicator
              captures: { charge_x: $.data.0.id }
            - call: "POST /ui/employer-charges/${charge_x}/protest"
              payload: {}
              as: Employer
              as_user_id: "${emp_x}"
          trigger:
            - call: "POST /ui/employer-charges/${charge_x}/relieve"
              payload: { relief_reason: "MISCONDUCT_DISCHARGE" }
              as: Adjudicator
          assert:
            - "EmployerCharge.${charge_x}.status == RELIEVED"
            - "Employer.${emp_x}.reserve_account_balance_cents == 100000000"
            - "Employer.${emp_x}.charge_protest_count == 0"

      - name: overpayment_offset_conserves_assessed_total
        grounds:
          - state_machines.Overpayment.ESTABLISHED_to_RECOVERING
          - state_machines.Overpayment.RECOVERING_to_SATISFIED
          - entities.Overpayment.fields.recovered_cents
          - entities.Overpayment.fields.total_assessed_cents
        distinguishing_aspect: |
          DIFFERENT conserved quantity: the invariant recovered_cents +
          outstanding_balance == total_assessed_cents (57500) across the FRAUD
          overpayment recovery sequence. Two CASH recoveries (50000 + 7500) drive
          recovered_cents to exactly total_assessed_cents with zero residual,
          conserving the assessed total (a monetary-debt quantity, not a reserve).
        test_recipe:
          setup:
            - "A FRAUD Overpayment (principal 50000, penalty 7500, total_assessed 57500) ESTABLISHED."
          setup_api_calls:
            - call: "POST /ui/employers"
              payload: { legal_name: "Inv2 Co", state_account_number: "IV2-1", experience_rate: 0.03, reserve_opening_balance_cents: 100000000 }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /ui/claimants"
              payload: { full_name: "Inv Two", ssn_last4: "1818", date_of_birth: "1984-06-18" }
              as: ProgramAdmin
              captures: { clmt_id: $.data.id }
            - call: "POST /ui/wage-records"
              payload: { claimant_id: "${clmt_id}", employer_id: "${emp_id}", calendar_quarter: "2025-Q1", gross_wages_cents: 5000 }
              as: ProgramAdmin
            - call: "POST /ui/claims"
              payload: { claimant_id: "${clmt_id}", filed_date: "2026-04-05" }
              as: Claimant
              as_user_id: "${clmt_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /ui/overpayments"
              payload: { claim_id: "${claim_id}", cause: "FRAUD", principal_cents: 50000 }
              as: Adjudicator
              captures: { op_id: $.data.id, op_v0: $.data.version }
            - call: "POST /ui/overpayments/${op_id}/recoveries"
              payload: { recovery_method: "CASH", amount_cents: 50000, expected_overpayment_version: "${op_v0}" }
              as: BenefitPaymentOfficer
            - call: "GET /ui/overpayments/${op_id}"
              payload: {}
              as: BenefitPaymentOfficer
              captures: { op_v1: $.data.version }
          trigger:
            - call: "POST /ui/overpayments/${op_id}/recoveries"
              payload: { recovery_method: "CASH", amount_cents: 7500, expected_overpayment_version: "${op_v1}" }
              as: BenefitPaymentOfficer
          assert:
            - "Overpayment.${op_id}.recovered_cents == 57500"
            - "Overpayment.${op_id}.total_assessed_cents == 57500"
            - "Overpayment.${op_id}.status == SATISFIED"
