# =============================================================================
# Task 1648 — Charitable Emergency Assistance Fund Administration
# =============================================================================

scenario: |
  Charitable Emergency Assistance Fund Administration (community assistance ministry): application intake & documentation (eviction notice/utility bill), eligibility criteria & maximum benefit per household/year, verification with landlord/utility & direct-to-vendor payment, funding source restriction & allocation across sources, waitlist & funds-exhausted communication, duplication-of-benefits check with other agencies, case notes & follow-up outcome, donor/grant reporting

domain_name: charitable-emergency-assistance
api_prefix: /assistance

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - ops_run_checkpoint
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (13 entities)
# =============================================================================
entities:
  - name: Household
    parent: null
    common_fields: true
    fields:
      - { name: head_of_household_name, type: string, source: input, description: "Name of the head of household" }
      - { name: address, type: string, source: input, description: "Household street address" }
      - { name: phone, type: string, source: input, description: "Contact phone" }
      - { name: household_size, type: integer, source: input, description: "Number of household members; must be >= 1" }
      - { name: annual_income_cents, type: integer, source: input, description: "Total annual household income in cents; must be >= 0" }

  - name: EligibilityPolicy
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Policy name" }
      - { name: max_annual_benefit_cents, type: integer, source: input, description: "Maximum total benefit per household per benefit year, cents; > 0" }
      - { name: rent_cap_cents, type: integer, source: input, description: "Per-household per-year cap for RENT category, cents; > 0" }
      - { name: utility_cap_cents, type: integer, source: input, description: "Per-household per-year cap for UTILITY category, cents; > 0" }
      - { name: income_limit_cents, type: integer, source: input, description: "Eligibility income ceiling; household annual_income_cents must be <= this; >= 0" }
      - { name: appeal_window_days, type: integer, source: input, default: 30, description: "Days after denial during which an appeal is accepted; > 0" }
      - { name: require_eviction_notice, type: boolean, source: input, default: true, description: "RENT applications require an EVICTION_NOTICE document" }
      - { name: require_lease_ledger, type: boolean, source: input, default: false, description: "RENT applications require a LEASE_LEDGER document" }
      - { name: require_utility_bill, type: boolean, source: input, default: true, description: "UTILITY applications require a UTILITY_BILL document" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | RETIRED; at most one ACTIVE at any time" }

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Landlord or utility company name" }
      - { name: vendor_type, type: enum, source: input, description: "LANDLORD | UTILITY" }
      - { name: contact_name, type: string, source: input, description: "Verification contact person", default: "" }
      - { name: phone, type: string, source: input, description: "Vendor phone", default: "" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }

  - name: AssistanceApplication
    parent: null
    common_fields: true
    fields:
      - { name: household_id, type: string, source: input, description: "FK -> Household.id; applying household" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; landlord/utility that will receive direct payment" }
      - { name: policy_id, type: string, source: system, description: "FK -> EligibilityPolicy.id; policy version pinned at submit (re-pinned at waitlist promotion)" }
      - { name: category, type: enum, source: input, description: "RENT | UTILITY" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Amount requested, cents; > 0" }
      - { name: service_month, type: string, source: input, description: "Calendar month the assistance covers, format YYYY-MM" }
      - { name: intake_caseworker_id, type: string, source: system, description: "X-User-ID of the creating Caseworker; segregation-of-duties anchor" }
      - { name: status, type: enum, source: system, description: "INTAKE | SUBMITTED | UNDER_VERIFICATION | VERIFICATION_FAILED | PENDING_DECISION | WAITLISTED | APPROVED | PAID | DENIED | WITHDRAWN | CLOSED" }
      - { name: active_award_id, type: string, source: system, description: "id of the non-VOIDED AssistanceAward once approved; empty until approval", default: "" }
      - { name: submitted_at, type: datetime, source: system, description: "Clock timestamp of submit; empty until submitted" }
      - { name: waitlisted_at, type: datetime, source: system, description: "Clock timestamp of entry into WAITLISTED; promotion ranking key" }
      - { name: denied_at, type: datetime, source: system, description: "Clock timestamp of denial" }
      - { name: denial_reason, type: enum, source: system, description: "INELIGIBLE_INCOME | CAP_EXHAUSTED | DUPLICATE_BENEFIT | VERIFICATION_FAILED | ELIGIBILITY_LAPSED | PROGRAM_DIRECTED; empty until denied" }
      - { name: closed_at, type: datetime, source: system, description: "Clock timestamp of closure" }

  - name: ApplicationDocument
    parent: null
    common_fields: false
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> AssistanceApplication.id; owning application" }
      - { name: doc_type, type: enum, source: input, description: "EVICTION_NOTICE | LEASE_LEDGER | UTILITY_BILL | ID_VERIFICATION" }
      - { name: file_reference, type: string, source: input, description: "Opaque storage reference for the uploaded file" }
      - { name: uploaded_by, type: string, source: system, description: "X-User-ID of uploader" }

  - name: VendorVerification
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> AssistanceApplication.id; verified application" }
      - { name: vendor_id, type: string, source: system, description: "FK -> Vendor.id; copied from application.vendor_id at creation" }
      - { name: verifier_id, type: string, source: system, description: "X-User-ID of the verifying Caseworker; must differ from application.intake_caseworker_id" }
      - { name: status, type: enum, source: system, description: "PENDING | PASSED | FAILED | SUPERSEDED" }
      - { name: confirmed_amount_cents, type: integer, source: input, description: "Amount the vendor confirms is owed; recorded at completion when outcome is PASSED; >= 0", default: 0 }
      - { name: outcome_notes, type: string, source: input, description: "Verifier notes recorded at completion", default: "" }
      - { name: completed_at, type: datetime, source: system, description: "Clock timestamp of completion" }

  - name: DuplicationCheck
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> AssistanceApplication.id; checked application" }
      - { name: agency_name, type: string, source: input, description: "External agency contacted for duplication-of-benefits check" }
      - { name: recorded_by, type: string, source: system, description: "X-User-ID of the Caseworker who opened the check" }
      - { name: status, type: enum, source: system, description: "PENDING | CLEARED | FLAGGED | SUPERSEDED" }
      - { name: resolution_notes, type: string, source: input, description: "Notes recorded at resolve/override", default: "" }
      - { name: override_justification, type: string, source: input, description: "ProgramManager justification when a FLAGGED check is overridden to CLEARED", default: "" }

  - name: AssistanceAward
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> AssistanceApplication.id; application this award pays out" }
      - { name: policy_id, type: string, source: system, description: "FK -> EligibilityPolicy.id; policy version pinned at approval" }
      - { name: awarded_amount_cents, type: integer, source: computed, description: "Approved amount per award_amount_determination; > 0" }
      - { name: benefit_year, type: integer, source: computed, description: "Calendar year of the logical clock at approval; drives per-year caps" }
      - { name: status, type: enum, source: system, description: "ACTIVE | PARTIALLY_DISBURSED | DISBURSED | VOIDED" }

  - name: FundingAllocation
    parent: null
    common_fields: true
    fields:
      - { name: award_id, type: string, source: system, description: "FK -> AssistanceAward.id; award this allocation funds" }
      - { name: funding_source_id, type: string, source: system, description: "FK -> FundingSource.id; source the funds are reserved from" }
      - { name: allocated_cents, type: integer, source: computed, description: "Amount reserved from the source for this award; >= 0" }
      - { name: consumed_cents, type: integer, source: computed, description: "Portion already paid out via CLEARED payments; >= 0, <= allocated_cents" }
      - { name: rank_order, type: integer, source: computed, description: "Waterfall rank of the source within this award (0 = first drawn); drives proration order" }
      - { name: status, type: enum, source: system, description: "RESERVED | CONSUMED | RELEASED" }

  - name: FundingSource
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Fund display name" }
      - { name: funder_name, type: string, source: input, description: "Donor or grantor organization; period-overlap scope key" }
      - { name: source_type, type: enum, source: input, description: "DONOR_UNRESTRICTED | GRANT_RESTRICTED | GOVERNMENT" }
      - { name: allowed_categories, type: array, source: input, description: "Subset of [RENT, UTILITY] this source may fund; non-empty" }
      - { name: period_start, type: datetime, source: input, description: "Funding period start (inclusive); ISO8601" }
      - { name: period_end, type: datetime, source: input, description: "Funding period end (exclusive); half-open interval [period_start, period_end)" }
      - { name: total_budget_cents, type: integer, source: input, description: "Total budget; deposits increase it; > 0" }
      - { name: max_per_household_cents, type: integer, source: input, description: "Per-household per-benefit-year draw cap from this source; > 0" }
      - { name: reserved_cents, type: integer, source: computed, description: "Sum of allocated_cents - consumed_cents over this source's RESERVED allocations" }
      - { name: committed_cents, type: integer, source: computed, description: "Sum of consumed_cents over this source's allocations (money actually paid out)" }
      - { name: available_cents, type: integer, source: computed, description: "total_budget_cents - committed_cents - reserved_cents" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXHAUSTED | CLOSED" }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: award_id, type: string, source: system, description: "FK -> AssistanceAward.id; award being paid" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; payee; must equal the application's vendor" }
      - { name: funding_source_id, type: string, source: input, description: "FK -> FundingSource.id; source drawn on; must hold a RESERVED allocation on this award" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount; > 0; <= allocation remainder" }
      - { name: payment_date, type: datetime, source: input, description: "Date the payment is issued; must fall inside the source's funding period" }
      - { name: status, type: enum, source: system, description: "ISSUED | CLEARED | FAILED | VOIDED" }
      - { name: issued_by, type: string, source: system, description: "X-User-ID of the FinanceOfficer who created the payment" }
      - { name: cleared_at, type: datetime, source: system, description: "Clock timestamp when the payment cleared" }

  - name: CaseNote
    parent: null
    common_fields: false
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> AssistanceApplication.id; case the note belongs to" }
      - { name: author_id, type: string, source: system, description: "X-User-ID of the authoring Caseworker" }
      - { name: note_type, type: enum, source: input, description: "GENERAL | FOLLOW_UP | DUPLICATION_CHECK | COMMUNICATION" }
      - { name: body, type: string, source: input, description: "Free-text note body; non-empty" }
      - { name: outcome, type: enum, source: input, description: "CRISIS_RESOLVED | PARTIAL_RELIEF | NO_CHANGE | LOST_CONTACT; required iff note_type == FOLLOW_UP", default: "" }
      - { name: occurred_at, type: datetime, source: input, description: "When the noted interaction occurred; defaults to the logical clock time" }

  - name: ReplenishmentRun
    parent: null
    common_fields: false
    fields:
      - { name: run_by, type: string, source: system, description: "X-User-ID of the ProgramManager who launched the run" }
      - { name: promoted_count, type: integer, source: computed, description: "Applications promoted WAITLISTED -> APPROVED in this run" }
      - { name: denied_count, type: integer, source: computed, description: "Applications denied (eligibility lapse) in this run" }
      - { name: remaining_waitlisted_count, type: integer, source: computed, description: "Applications still WAITLISTED after the run" }
      - { name: promoted_application_ids, type: array, source: computed, description: "ids of promoted applications, in promotion order" }
      - { name: denied_application_ids, type: array, source: computed, description: "ids of denied applications, in processing order" }

# =============================================================================
# 1.2 State Machine Table (9 machines)
# =============================================================================
state_machines:
  - entity: AssistanceApplication
    field: status
    initial_state: INTAKE
    terminal_states: [WITHDRAWN, CLOSED]
    transitions:
      - from: INTAKE
        to: SUBMITTED
        trigger: "POST /assistance/applications/{id}/submit"
        actor: Caseworker
        preconditions:
          - "An EligibilityPolicy with status ACTIVE exists (ERR_NO_ACTIVE_POLICY)"
          - "All documents required by that policy for the application's category are present: RENT requires EVICTION_NOTICE iff require_eviction_notice plus LEASE_LEDGER iff require_lease_ledger; UTILITY requires UTILITY_BILL iff require_utility_bill (ERR_DOCUMENTS_INCOMPLETE)"
          - "application.vendor.status == ACTIVE (ERR_VENDOR_SUSPENDED)"
        side_effects:
          - "policy_id pinned to the currently ACTIVE EligibilityPolicy.id"
          - "submitted_at set to logical clock"
          - "increments AssistanceApplication.version by 1"

      - from: SUBMITTED
        to: UNDER_VERIFICATION
        trigger: "POST /assistance/applications/{id}/verifications"
        actor: Caseworker
        preconditions:
          - "expected_application_version matches application.version (ERR_STALE_VERSION)"
          - "acting Caseworker X-User-ID != application.intake_caseworker_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "new VendorVerification created PENDING with verifier_id = acting X-User-ID and vendor_id = application.vendor_id"
          - "any existing PENDING VendorVerification of this application -> SUPERSEDED"
          - "increments AssistanceApplication.version by 1"

      - from: VERIFICATION_FAILED
        to: UNDER_VERIFICATION
        trigger: "POST /assistance/applications/{id}/verifications"
        actor: Caseworker
        preconditions:
          - "same as SUBMITTED -> UNDER_VERIFICATION"
        side_effects:
          - "same as SUBMITTED -> UNDER_VERIFICATION"

      - from: UNDER_VERIFICATION
        to: PENDING_DECISION
        trigger: "system (automatic when the application's PENDING VendorVerification completes with outcome PASSED)"
        actor: system
        preconditions:
          - "completing verification.status == PENDING and outcome == PASSED"
        side_effects:
          - "increments AssistanceApplication.version by 1"

      - from: UNDER_VERIFICATION
        to: VERIFICATION_FAILED
        trigger: "system (automatic when the application's PENDING VendorVerification completes with outcome FAILED)"
        actor: system
        preconditions:
          - "completing verification.status == PENDING and outcome == FAILED"
        side_effects:
          - "increments AssistanceApplication.version by 1"

      - from: PENDING_DECISION
        to: APPROVED
        trigger: "POST /assistance/applications/{id}/approve"
        actor: ProgramManager
        preconditions:
          - "acting ProgramManager X-User-ID != application.intake_caseworker_id and != verifier_id of the application's latest PASSED VendorVerification (ERR_SEGREGATION_OF_DUTIES)"
          - "at least one DuplicationCheck exists for the application (ERR_DUPLICATION_CHECK_REQUIRED)"
          - "no DuplicationCheck of the application is PENDING or FLAGGED (ERR_DUPLICATION_UNRESOLVED)"
          - "household.annual_income_cents <= pinned policy.income_limit_cents (ERR_INCOME_LIMIT_EXCEEDED)"
          - "household_year_to_date exposure for award.benefit_year < pinned policy.max_annual_benefit_cents (ERR_ANNUAL_CAP_EXCEEDED when remaining == 0)"
          - "category year-to-date exposure < pinned policy cap for the category (ERR_CATEGORY_CAP_EXCEEDED when remaining == 0)"
          - "computed award_amount_determination is fully allocatable by allocation_waterfall across compatible sources (ERR_FUNDS_EXHAUSTED otherwise; no partial award is created)"
        side_effects:
          - "AssistanceAward created ACTIVE with policy_id = application.policy_id, benefit_year = clock year, awarded_amount_cents per award_amount_determination"
          - "FundingAllocation rows created RESERVED per allocation_waterfall; each source.reserved_cents += take"
          - "each drained FundingSource with available_cents == 0 auto-transitions ACTIVE -> EXHAUSTED"
          - "application.active_award_id set; increments AssistanceApplication.version by 1"

      - from: PENDING_DECISION
        to: WAITLISTED
        trigger: "POST /assistance/applications/{id}/waitlist"
        actor: ProgramManager
        preconditions:
          - "same segregation, duplication, income, and cap preconditions as approve (funds availability is NOT checked)"
        side_effects:
          - "waitlisted_at set to logical clock"
          - "increments AssistanceApplication.version by 1"

      - from: PENDING_DECISION
        to: DENIED
        trigger: "POST /assistance/applications/{id}/deny"
        actor: ProgramManager
        preconditions:
          - "acting ProgramManager X-User-ID != application.intake_caseworker_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "denied_at set to logical clock; denial_reason set from request reason_code"
          - "increments AssistanceApplication.version by 1"

      - from: WAITLISTED
        to: APPROVED
        trigger: "system (replenishment run, POST /assistance/replenishment-runs)"
        actor: system
        preconditions:
          - "eligibility re-evaluated against the CURRENTLY ACTIVE EligibilityPolicy (income + caps) passes"
          - "computed award fully allocatable per allocation_waterfall against current source balances"
        side_effects:
          - "application.policy_id re-pinned to the currently ACTIVE policy"
          - "same award/allocation/source side effects as PENDING_DECISION -> APPROVED"
          - "increments AssistanceApplication.version by 1"

      - from: WAITLISTED
        to: DENIED
        trigger: "system (replenishment run eligibility lapse) or POST /assistance/applications/{id}/deny"
        actor: system
        preconditions:
          - "run path: eligibility re-evaluation against the currently ACTIVE policy fails (denial_reason = ELIGIBILITY_LAPSED)"
          - "manual path: same as PENDING_DECISION -> DENIED"
        side_effects:
          - "denied_at set; denial_reason set"
          - "increments AssistanceApplication.version by 1"

      - from: APPROVED
        to: PAID
        trigger: "system (automatic when the active AssistanceAward becomes DISBURSED)"
        actor: system
        preconditions:
          - "active award status == DISBURSED"
        side_effects:
          - "increments AssistanceApplication.version by 1"

      - from: APPROVED
        to: PENDING_DECISION
        trigger: "system (automatic when the active AssistanceAward is voided)"
        actor: system
        preconditions:
          - "award void preconditions hold (no ISSUED or CLEARED payments)"
        side_effects:
          - "application.active_award_id cleared to empty"
          - "increments AssistanceApplication.version by 1"

      - from: DENIED
        to: PENDING_DECISION
        trigger: "POST /assistance/applications/{id}/appeal"
        actor: Caseworker
        preconditions:
          - "logical clock <= denied_at + pinned policy.appeal_window_days (inclusive; ERR_APPEAL_WINDOW_CLOSED beyond)"
        side_effects:
          - "increments AssistanceApplication.version by 1"

      - from: INTAKE
        to: WITHDRAWN
        trigger: "POST /assistance/applications/{id}/withdraw"
        actor: Caseworker
        preconditions: []
        side_effects:
          - "increments AssistanceApplication.version by 1"

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /assistance/applications/{id}/withdraw"
        actor: Caseworker
        preconditions: []
        side_effects:
          - "increments AssistanceApplication.version by 1"

      - from: UNDER_VERIFICATION
        to: WITHDRAWN
        trigger: "POST /assistance/applications/{id}/withdraw"
        actor: Caseworker
        preconditions: []
        side_effects:
          - "any PENDING VendorVerification of this application -> SUPERSEDED"
          - "increments AssistanceApplication.version by 1"

      - from: VERIFICATION_FAILED
        to: WITHDRAWN
        trigger: "POST /assistance/applications/{id}/withdraw"
        actor: Caseworker
        preconditions: []
        side_effects:
          - "increments AssistanceApplication.version by 1"

      - from: PENDING_DECISION
        to: WITHDRAWN
        trigger: "POST /assistance/applications/{id}/withdraw"
        actor: Caseworker
        preconditions: []
        side_effects:
          - "increments AssistanceApplication.version by 1"

      - from: WAITLISTED
        to: WITHDRAWN
        trigger: "POST /assistance/applications/{id}/withdraw"
        actor: Caseworker
        preconditions: []
        side_effects:
          - "increments AssistanceApplication.version by 1"

      - from: PAID
        to: CLOSED
        trigger: "POST /assistance/applications/{id}/close"
        actor: Caseworker
        preconditions:
          - "at least one CaseNote with note_type == FOLLOW_UP exists for the application (ERR_FOLLOW_UP_REQUIRED)"
        side_effects:
          - "closed_at set to logical clock"
          - "increments AssistanceApplication.version by 1"

      - from: DENIED
        to: CLOSED
        trigger: "POST /assistance/applications/{id}/close"
        actor: Caseworker
        preconditions:
          - "at least one CaseNote with note_type == FOLLOW_UP exists for the application (ERR_FOLLOW_UP_REQUIRED)"
        side_effects:
          - "closed_at set to logical clock"
          - "increments AssistanceApplication.version by 1"

  - entity: VendorVerification
    field: status
    initial_state: PENDING
    terminal_states: [PASSED, FAILED, SUPERSEDED]
    transitions:
      - from: PENDING
        to: PASSED
        trigger: "POST /assistance/verifications/{id}/complete with outcome PASSED"
        actor: Caseworker
        preconditions:
          - "verification.status == PENDING (ERR_INVALID_VERIFICATION_STATE)"
          - "acting Caseworker X-User-ID != application.intake_caseworker_id (ERR_SEGREGATION_OF_DUTIES)"
          - "confirmed_amount_cents must be present and > 0 when outcome == PASSED (ERR_INVALID_REQUEST)"
        side_effects:
          - "completed_at set; confirmed_amount_cents recorded"
          - "application UNDER_VERIFICATION -> PENDING_DECISION"

      - from: PENDING
        to: FAILED
        trigger: "POST /assistance/verifications/{id}/complete with outcome FAILED"
        actor: Caseworker
        preconditions:
          - "verification.status == PENDING (ERR_INVALID_VERIFICATION_STATE)"
          - "acting Caseworker X-User-ID != application.intake_caseworker_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "completed_at set"
          - "application UNDER_VERIFICATION -> VERIFICATION_FAILED"

      - from: PENDING
        to: SUPERSEDED
        trigger: "system (a newer VendorVerification is created for the same application, or the application is withdrawn)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DuplicationCheck
    field: status
    initial_state: PENDING
    terminal_states: [CLEARED, SUPERSEDED]
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /assistance/duplication-checks/{id}/resolve with result CLEARED"
        actor: Caseworker
        preconditions:
          - "check.status == PENDING (ERR_INVALID_DUPLICATION_CHECK_STATE)"
        side_effects: ["resolution_notes recorded"]

      - from: PENDING
        to: FLAGGED
        trigger: "POST /assistance/duplication-checks/{id}/resolve with result FLAGGED"
        actor: Caseworker
        preconditions:
          - "check.status == PENDING (ERR_INVALID_DUPLICATION_CHECK_STATE)"
        side_effects: ["resolution_notes recorded"]

      - from: FLAGGED
        to: CLEARED
        trigger: "POST /assistance/duplication-checks/{id}/override"
        actor: ProgramManager
        preconditions:
          - "check.status == FLAGGED (ERR_INVALID_DUPLICATION_CHECK_STATE)"
        side_effects: ["override_justification recorded"]

      - from: PENDING
        to: SUPERSEDED
        trigger: "system (a newer DuplicationCheck is created for the same application)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AssistanceAward
    field: status
    initial_state: ACTIVE
    terminal_states: [DISBURSED, VOIDED]
    transitions:
      - from: ACTIVE
        to: PARTIALLY_DISBURSED
        trigger: "system (a Payment against this award becomes CLEARED and at least one RESERVED allocation remains unconsumed)"
        actor: system
        preconditions: []
        side_effects: ["increments AssistanceAward.version by 1"]

      - from: ACTIVE
        to: DISBURSED
        trigger: "system (a Payment becomes CLEARED and every RESERVED allocation of this award is fully consumed)"
        actor: system
        preconditions: []
        side_effects:
          - "increments AssistanceAward.version by 1"
          - "application APPROVED -> PAID"

      - from: PARTIALLY_DISBURSED
        to: DISBURSED
        trigger: "system (a Payment becomes CLEARED and every allocation of this award is fully consumed)"
        actor: system
        preconditions: []
        side_effects:
          - "increments AssistanceAward.version by 1"
          - "application APPROVED -> PAID"

      - from: ACTIVE
        to: VOIDED
        trigger: "POST /assistance/awards/{id}/void"
        actor: ProgramManager
        preconditions:
          - "award.status in {ACTIVE, PARTIALLY_DISBURSED} (ERR_INVALID_AWARD_STATE)"
          - "no Payment of this award is ISSUED (ERR_PAYMENTS_OUTSTANDING, checked first)"
          - "no Payment of this award is CLEARED (ERR_PAYMENTS_CLEARED, checked second)"
        side_effects:
          - "every RESERVED FundingAllocation of this award -> RELEASED"
          - "each affected source.reserved_cents -= allocation.allocated_cents - allocation.consumed_cents"
          - "each source whose available_cents rises above 0 auto-transitions EXHAUSTED -> ACTIVE"
          - "application APPROVED -> PENDING_DECISION; active_award_id cleared"
          - "increments AssistanceAward.version by 1"

      - from: PARTIALLY_DISBURSED
        to: VOIDED
        trigger: "POST /assistance/awards/{id}/void"
        actor: ProgramManager
        preconditions:
          - "award.status in {ACTIVE, PARTIALLY_DISBURSED} (ERR_INVALID_AWARD_STATE)"
          - "no Payment of this award is ISSUED (ERR_PAYMENTS_OUTSTANDING, checked first)"
          - "no Payment of this award is CLEARED (ERR_PAYMENTS_CLEARED, checked second) — a PARTIALLY_DISBURSED award always has a CLEARED payment, so this path deterministically fails with ERR_PAYMENTS_CLEARED"
        side_effects:
          - "same as ACTIVE -> VOIDED (reachable only in the impossible case of PARTIALLY_DISBURSED with no CLEARED payment)"

  - entity: FundingAllocation
    field: status
    initial_state: RESERVED
    terminal_states: [CONSUMED, RELEASED]
    transitions:
      - from: RESERVED
        to: CONSUMED
        trigger: "system (a Payment drawn on this allocation clears and consumed_cents reaches allocated_cents)"
        actor: system
        preconditions: []
        side_effects: ["increments FundingAllocation.version by 1"]

      - from: RESERVED
        to: RELEASED
        trigger: "system (award voided, or award adjustment reduces allocated_cents to 0)"
        actor: system
        preconditions: []
        side_effects: ["increments FundingAllocation.version by 1"]

  - entity: FundingSource
    field: status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (after any reservation or budget mutation leaving available_cents == 0)"
        actor: system
        preconditions: []
        side_effects: ["increments FundingSource.version by 1"]

      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system (deposit or allocation release raises available_cents above 0)"
        actor: system
        preconditions: []
        side_effects: ["increments FundingSource.version by 1"]

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /assistance/funding-sources/{id}/close"
        actor: ProgramManager
        preconditions:
          - "source.status in {ACTIVE, EXHAUSTED} (ERR_INVALID_SOURCE_STATE)"
          - "source.reserved_cents == 0 (ERR_RESERVED_FUNDS_OUTSTANDING)"
        side_effects: ["increments FundingSource.version by 1"]

      - from: EXHAUSTED
        to: CLOSED
        trigger: "POST /assistance/funding-sources/{id}/close"
        actor: ProgramManager
        preconditions:
          - "same as ACTIVE -> CLOSED (reserved_cents == 0 always holds while EXHAUSTED only if committed == budget)"
        side_effects: ["increments FundingSource.version by 1"]

  - entity: Payment
    field: status
    initial_state: ISSUED
    terminal_states: [CLEARED, VOIDED]
    transitions:
      - from: ISSUED
        to: CLEARED
        trigger: "POST /assistance/payments/{id}/clear"
        actor: FinanceOfficer
        preconditions:
          - "payment.status == ISSUED (ERR_INVALID_PAYMENT_STATE)"
        side_effects:
          - "allocation.consumed_cents += payment.amount_cents; if consumed_cents == allocated_cents the allocation -> CONSUMED"
          - "source.reserved_cents -= amount_cents; source.committed_cents += amount_cents"
          - "cleared_at set to logical clock"
          - "if every allocation of the award is CONSUMED: award -> DISBURSED, else award ACTIVE -> PARTIALLY_DISBURSED"
          - "increments Payment.version by 1"

      - from: ISSUED
        to: FAILED
        trigger: "POST /assistance/payments/{id}/fail"
        actor: FinanceOfficer
        preconditions:
          - "payment.status == ISSUED (ERR_INVALID_PAYMENT_STATE)"
        side_effects: ["increments Payment.version by 1"]

      - from: FAILED
        to: ISSUED
        trigger: "POST /assistance/payments/{id}/reissue"
        actor: FinanceOfficer
        preconditions:
          - "payment.status == FAILED (ERR_INVALID_PAYMENT_STATE)"
          - "amount_cents still <= allocation remainder (allocated_cents - consumed_cents - sum of other ISSUED payments on the same allocation) (ERR_PAYMENT_EXCEEDS_ALLOCATION)"
          - "payment_date still inside the source's [period_start, period_end) (ERR_SOURCE_PERIOD_CLOSED)"
        side_effects: ["increments Payment.version by 1"]

      - from: ISSUED
        to: VOIDED
        trigger: "POST /assistance/payments/{id}/void"
        actor: FinanceOfficer
        preconditions:
          - "payment.status in {ISSUED, FAILED} (ERR_INVALID_PAYMENT_STATE)"
        side_effects: ["increments Payment.version by 1"]

      - from: FAILED
        to: VOIDED
        trigger: "POST /assistance/payments/{id}/void"
        actor: FinanceOfficer
        preconditions:
          - "payment.status in {ISSUED, FAILED} (ERR_INVALID_PAYMENT_STATE)"
        side_effects: ["increments Payment.version by 1"]

  - entity: EligibilityPolicy
    field: status
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /assistance/policies/{id}/activate"
        actor: ProgramManager
        preconditions:
          - "policy.status == DRAFT (ERR_INVALID_POLICY_STATE)"
        side_effects:
          - "the previously ACTIVE EligibilityPolicy (if any) -> RETIRED"
          - "increments EligibilityPolicy.version by 1"

      - from: ACTIVE
        to: RETIRED
        trigger: "system (another EligibilityPolicy is activated)"
        actor: system
        preconditions: []
        side_effects: ["increments EligibilityPolicy.version by 1"]

  - entity: Vendor
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /assistance/vendors/{id}/suspend"
        actor: ProgramManager
        preconditions:
          - "vendor.status == ACTIVE (ERR_INVALID_STATE generic vendor state)"
        side_effects: ["increments Vendor.version by 1"]

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /assistance/vendors/{id}/reactivate"
        actor: ProgramManager
        preconditions:
          - "vendor.status == SUSPENDED (ERR_INVALID_STATE generic vendor state)"
        side_effects: ["increments Vendor.version by 1"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: verification-create-stale-application
    parent_entity: AssistanceApplication
    write_endpoint: "POST /assistance/applications/{id}/verifications"
    occ_field: expected_application_version
    description: |
      Creating a VendorVerification against an application whose version has
      advanced since the client last observed it is rejected. Creating a new
      verification legitimately supersedes any existing PENDING one, so a
      client holding a stale version would unknowingly supersede a verification
      it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: duplication-check-create-stale-application
    parent_entity: AssistanceApplication
    write_endpoint: "POST /assistance/applications/{id}/duplication-checks"
    occ_field: expected_application_version
    description: |
      Creating a DuplicationCheck against an application whose version has
      advanced since the client last observed it is rejected. A new check
      legitimately supersedes any existing PENDING one, so a stale client
      would unknowingly supersede a check it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: award-adjust-stale-award
    parent_entity: AssistanceAward
    write_endpoint: "POST /assistance/awards/{id}/adjust"
    occ_field: expected_award_version
    description: |
      Adjusting an award whose version has advanced since the client last
      observed it is rejected. An adjustment legitimately recomputes the
      pro-rata release across allocations, so a stale client would prorate
      against an awarded_amount_cents it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table (10 rules)
# =============================================================================
calculations:
  - name: household_benefit_usage
    trigger: "on approve/waitlist eligibility checks, on household benefit-summary read, recomputed whenever an award is created, adjusted, or voided"
    algorithm: aggregation
    formula: |
      award_set = { AssistanceAward a | a.application.household_id == household.id
                    AND a.status IN {ACTIVE, PARTIALLY_DISBURSED, DISBURSED}
                    AND a.benefit_year == <calendar year of logical clock> }
      ytd_exposure_cents = sum(a.awarded_amount_cents for a in award_set)
      category_ytd(c)     = sum(a.awarded_amount_cents for a in award_set where a.application.category == c)
      remaining_annual_cap_cents  = policy.max_annual_benefit_cents - ytd_exposure_cents
      remaining_rent_cap_cents    = policy.rent_cap_cents - category_ytd(RENT)
      remaining_utility_cap_cents = policy.utility_cap_cents - category_ytd(UTILITY)
    input_set: "Awards of the household with status IN {ACTIVE, PARTIALLY_DISBURSED, DISBURSED}; VOIDED awards excluded; benefit_year must equal the clock's current calendar year (window boundary: calendar-year inclusive)"
    constants: {}
    precision: "integer cents; no rounding"
    variants:
      - name: exposure_basis
        when: "eligibility gating at approval/waitlist/promotion time"
        difference: "counts full awarded_amount_cents of every non-VOIDED award, including approved-but-unpaid amounts"
      - name: committed_basis
        when: "donor/grant reporting (benefit-summary committed fields)"
        difference: "ytd_committed_cents counts only consumed_cents over the same award_set's allocations (money actually cleared); differs from exposure_basis whenever an award is approved but not fully paid"

  - name: award_amount_determination
    trigger: "on approve (PENDING_DECISION -> APPROVED) and on waitlist promotion"
    algorithm: threshold
    formula: |
      inputs: requested = application.requested_amount_cents
              confirmed = latest PASSED VendorVerification.confirmed_amount_cents
              rem_annual = remaining_annual_cap_cents (household_benefit_usage, exposure_basis)
              rem_cat    = category == RENT ? remaining_rent_cap_cents : remaining_utility_cap_cents
      award = min(requested, confirmed, rem_annual, rem_cat)
      if rem_annual == 0: raise ERR_ANNUAL_CAP_EXCEEDED
      elif rem_cat == 0: raise ERR_CATEGORY_CAP_EXCEEDED
      elif award == 0: raise ERR_INVALID_REQUEST (confirmed amount was 0)
    input_set: "the application, its latest PASSED verification, the pinned (approve) or currently ACTIVE (promotion) EligibilityPolicy, and the household's current-year award set"
    constants: {}
    precision: "integer cents; no rounding"
    variants: []

  - name: allocation_waterfall
    trigger: "runs inside every successful approve/promotion after award_amount_determination"
    algorithm: waterfall_allocation
    formula: |
      compatible(s) = s.status == ACTIVE
                      AND application.category IN s.allowed_categories
                      AND s.period_start <= clock < s.period_end
                      AND source_household_room(s) > 0 AND s.available_cents > 0
      source_household_room(s) = s.max_per_household_cents
                                 - sum over s's allocations a joined to awards w of this household
                                   with w.status != VOIDED and w.benefit_year == clock year
                                   of (a.allocated_cents)
      rank order: (1) len(s.allowed_categories) ASC (most restricted source first),
                  (2) s.period_end ASC (earliest-expiring first),
                  (3) s.created_at ASC
      remaining = award; for s in ranked compatible sources:
        take = min(remaining, s.available_cents, source_household_room(s))
        create FundingAllocation(award, s, allocated_cents=take, consumed_cents=0,
                                 rank_order=<position in ranked order>, status=RESERVED)
        s.reserved_cents += take; remaining -= take
        if s.available_cents == 0: s -> EXHAUSTED
      if remaining > 0 after the sweep: raise ERR_FUNDS_EXHAUSTED and create NOTHING (atomic: no award, no allocations, no balance changes)
    input_set: "FundingSources satisfying compatible(s); running accumulator commits each take before evaluating the next source"
    constants: {}
    precision: "integer cents; no rounding"
    variants: []

  - name: award_reduction_proration
    trigger: "POST /assistance/awards/{id}/adjust (award amount reduced by reduction_cents before any payment clears)"
    algorithm: waterfall_allocation
    formula: |
      Let allocs = award's RESERVED allocations ordered by rank_order ASC, n = len(allocs).
      For i in 0 .. n-2 (all but the LAST-ranked allocation):
        release_i = floor(allocs[i].allocated_cents * reduction_cents / award.awarded_amount_cents)
      release_{n-1} = reduction_cents - sum(release_0 .. release_{n-2})   # remainder pinned to the LAST-ranked allocation
      For each i: allocs[i].allocated_cents -= release_i
                  allocs[i].funding_source.reserved_cents -= release_i
                  if allocs[i].allocated_cents == 0: allocs[i] -> RELEASED
                  if source.available_cents > 0 and source.status == EXHAUSTED: source -> ACTIVE
      award.awarded_amount_cents -= reduction_cents
      NOTE: rounding order is pinned — per-allocation floor first, remainder to the last-ranked
      allocation. floor-then-remainder and remainder-first produce different per-source releases.
    input_set: "the award's RESERVED allocations in rank_order; requires no ISSUED or CLEARED payments on the award"
    constants: {}
    precision: "integer cents; floor for per-allocation releases, remainder absorbed by last-ranked allocation"
    variants: []

  - name: source_balance_reconciliation
    trigger: "recomputed after every mutation touching a FundingSource (approve, payment clear, award adjust, award void, deposit)"
    algorithm: aggregation
    formula: |
      reserved_cents  = sum(a.allocated_cents - a.consumed_cents for a in source's allocations with status == RESERVED)
      committed_cents = sum(a.consumed_cents for a in source's allocations with status IN {RESERVED, CONSUMED})
      available_cents = total_budget_cents - committed_cents - reserved_cents
      INVARIANT: committed_cents + reserved_cents + available_cents == total_budget_cents at all times
    input_set: "all FundingAllocations of the source regardless of status, except RELEASED allocations contribute only their consumed_cents to committed_cents"
    constants: {}
    precision: "integer cents; no rounding"
    variants: []

  - name: source_utilization_reporting
    trigger: "GET /assistance/funding-sources/{id}/report"
    algorithm: aggregation
    formula: |
      cash_utilization_pct       = committed_cents / total_budget_cents * 100
      encumbrance_utilization_pct = (committed_cents + reserved_cents) / total_budget_cents * 100
      rent_committed_cents    = sum of consumed_cents over allocations whose award's application.category == RENT
      utility_committed_cents = sum of consumed_cents over allocations whose award's application.category == UTILITY
      households_served = count of DISTINCT household_ids with >= 1 CLEARED payment drawn on this source
                          with cleared_at inside [period_start, period_end) (half-open: cleared_at == period_end is excluded)
    input_set: "source balances at read time; payments with status == CLEARED and cleared_at in the half-open funding period"
    constants: {}
    precision: "percentages: 1 decimal place, round_half_up; cents integer"
    variants:
      - name: cash_basis
        when: "money-actually-disbursed view for donor statements"
        difference: "numerator is committed_cents only"
      - name: encumbrance_basis
        when: "funds-allocated view for grant pipeline reporting"
        difference: "numerator is committed_cents + reserved_cents; strictly greater than cash_basis whenever any RESERVED allocation is not fully consumed"

  - name: income_eligibility_screen
    trigger: "approve, waitlist, and replenishment-run promotion re-evaluation"
    algorithm: threshold
    formula: |
      eligible = household.annual_income_cents <= policy.income_limit_cents
      Boundary is INCLUSIVE: income exactly equal to income_limit_cents is eligible;
      income_limit_cents + 1 is not (ERR_INCOME_LIMIT_EXCEEDED).
    input_set: "the household's current annual_income_cents and the applicable policy (pinned at approve; currently ACTIVE at promotion)"
    constants: {}
    precision: "integer cents comparison"
    variants: []

  - name: benefit_year_assignment
    trigger: "award creation (approve/promotion)"
    algorithm: forward_looking
    formula: |
      award.benefit_year = calendar year (UTC) of the logical clock at approval time.
      All per-year caps group awards by this stored integer, never recomputed from other dates.
    input_set: "logical clock year at approval"
    constants:
      CLOCK_DEFAULT: "2026-08-01T00:00:00Z"
    precision: "4-digit year"
    variants: []

  - name: waitlist_promotion_sweep
    trigger: "POST /assistance/replenishment-runs"
    algorithm: chronological
    formula: |
      candidates = applications with status == WAITLISTED
      processing order: waitlisted_at ASC, tie-break created_at ASC (never id)
      committed simulation per candidate, strictly in order:
        EVALUATION ORDER IS PINNED: a candidate's own reservation is NOT part of the
        availability it is checked against — availability is read BEFORE the candidate
        commits, then committed before the NEXT candidate is evaluated.
        (a) re-evaluate income + caps against the CURRENTLY ACTIVE policy
            (if none ACTIVE, the entire run fails with ERR_NO_ACTIVE_POLICY)
            -> failure: candidate WAITLISTED -> DENIED, denial_reason = ELIGIBILITY_LAPSED
        (b) compute award_amount_determination (uses candidate's pinned-at-submit data
            and latest PASSED verification)
        (c) attempt allocation_waterfall against CURRENT source balances
            -> insufficient: candidate REMAINS WAITLISTED; run CONTINUES to the next
               candidate (skip-and-continue, NOT stop-at-first-failure)
            -> sufficient: promote (WAITLISTED -> APPROVED, policy_id re-pinned,
               allocations committed)
      CONSERVATION: candidates_before == promoted_count + denied_count + remaining_waitlisted_count
    input_set: "all WAITLISTED applications at run start; snapshot ordered once; applications entering WAITLISTED mid-run are not included"
    constants: {}
    precision: "integer cents"
    variants: []

  - name: appeal_window_check
    trigger: "POST /assistance/applications/{id}/appeal"
    algorithm: threshold
    formula: |
      deadline = application.denied_at + policy.appeal_window_days (policy pinned on the application)
      allowed iff logical clock <= deadline (INCLUSIVE boundary: appeal exactly at deadline succeeds;
      one second past deadline -> ERR_APPEAL_WINDOW_CLOSED)
    input_set: "application.denied_at, pinned policy.appeal_window_days, logical clock"
    constants:
      DEFAULT_APPEAL_WINDOW_DAYS: 30
    precision: "second granularity"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "acting role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "request body well-formed: required fields present, enums valid, integer cents fields > 0 where declared, service_month matches YYYY-MM"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints"

  - priority: 4
    category: existence
    check: "path ids and body foreign keys reference existing resources, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with resource ids"

  - priority: 5
    category: state
    check: "expected_<parent>_version matches the parent's current version on OCC-guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /assistance/applications/{id}/verifications, POST /assistance/applications/{id}/duplication-checks, POST /assistance/awards/{id}/adjust"

  - priority: 6
    category: state
    check: "target resource is in a state from which the requested transition exists; vendor is ACTIVE where required; an ACTIVE policy exists where required"
    error_id: ERR_INVALID_APPLICATION_STATE
    http_status: 409
    applies_to: "application action endpoints (submit/approve/deny/waitlist/appeal/withdraw/close) — also ERR_INVALID_VERIFICATION_STATE (verification complete), ERR_INVALID_DUPLICATION_CHECK_STATE (resolve/override), ERR_INVALID_AWARD_STATE (adjust/void), ERR_INVALID_PAYMENT_STATE (clear/fail/reissue/void), ERR_INVALID_SOURCE_STATE (deposits/close on CLOSED), ERR_INVALID_POLICY_STATE (activate non-DRAFT), ERR_VENDOR_SUSPENDED (submit), ERR_NO_ACTIVE_POLICY (submit, replenishment run)"

  - priority: 7
    category: business_safety
    check: "segregation of duties (actor id != intake_caseworker_id; approver id != verifier_id) and duplication-of-benefits clearance (>= 1 check exists, none PENDING or FLAGGED)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "verification create/complete, approve, deny — also ERR_DUPLICATION_CHECK_REQUIRED and ERR_DUPLICATION_UNRESOLVED on approve/waitlist"

  - priority: 8
    category: business_referential
    check: "cross-referenced entities are compatible: vendor_type matches application category; payment.vendor_id == application.vendor_id; payment source holds a RESERVED allocation on the award"
    error_id: ERR_VENDOR_CATEGORY_MISMATCH
    http_status: 409
    applies_to: "application create (ERR_VENDOR_CATEGORY_MISMATCH), payment create (ERR_VENDOR_MISMATCH, ERR_NO_RESERVED_ALLOCATION)"

  - priority: 9
    category: business_temporal
    check: "time-window rules: payment_date inside [period_start, period_end); appeal inside inclusive window; new source period must not overlap a non-CLOSED same-funder source (half-open adjacency allowed)"
    error_id: ERR_SOURCE_PERIOD_CLOSED
    http_status: 409
    applies_to: "payment create/reissue (ERR_SOURCE_PERIOD_CLOSED), appeal (ERR_APPEAL_WINDOW_CLOSED), funding-source create (ERR_SOURCE_PERIOD_OVERLAP)"

  - priority: 10
    category: business_constraint
    check: "structural constraints: required documents present; (household, category, service_month) unique among non-terminal applications; payment fits allocation remainder; no outstanding/cleared payments block award void/adjust; reserved == 0 to close a source"
    error_id: ERR_DOCUMENTS_INCOMPLETE
    http_status: 409
    applies_to: "submit (ERR_DOCUMENTS_INCOMPLETE), application create (ERR_SERVICE_MONTH_CONFLICT), payment create/reissue (ERR_PAYMENT_EXCEEDS_ALLOCATION), award void/adjust (ERR_PAYMENTS_OUTSTANDING, ERR_PAYMENTS_CLEARED), source close (ERR_RESERVED_FUNDS_OUTSTANDING)"

  - priority: 11
    category: business_fiscal
    check: "money ceilings and pool solvency, checked last: income limit, annual household cap, category cap, full allocatability across compatible sources"
    error_id: ERR_INCOME_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "approve/waitlist/promotion (ERR_INCOME_LIMIT_EXCEEDED, ERR_ANNUAL_CAP_EXCEEDED, ERR_CATEGORY_CAP_EXCEEDED, ERR_FUNDS_EXHAUSTED)"

# =============================================================================
# 1.5 API Endpoint Table (59 endpoints)
# =============================================================================
endpoints:
  # --- Household ---
  - { method: POST, path: "/assistance/households", description: "Register a household", roles: [Caseworker], code: 201, input: [head_of_household_name, address, phone, household_size, annual_income_cents], output: Household, side_effects: ["version = 1"] }
  - { method: GET, path: "/assistance/households/{id}", description: "Fetch a household", roles: [Caseworker, ProgramManager, FinanceOfficer, Auditor], code: 200, input: [], output: Household, side_effects: [] }
  - { method: GET, path: "/assistance/households/{id}/benefit-summary", description: "Computed read: current benefit-year usage for this household (both variants)", roles: [Caseworker, ProgramManager, FinanceOfficer, Auditor], code: 200, input: [], output: "{ benefit_year: integer, ytd_exposure_cents: integer, ytd_committed_cents: integer, remaining_annual_cap_cents: integer, rent_ytd_cents: integer, utility_ytd_cents: integer, remaining_rent_cap_cents: integer, remaining_utility_cap_cents: integer }", side_effects: ["evaluates household_benefit_usage exposure_basis and committed_basis against the currently ACTIVE policy"] }

  # --- EligibilityPolicy ---
  - { method: POST, path: "/assistance/policies", description: "Create an EligibilityPolicy in DRAFT", roles: [ProgramManager], code: 201, input: [name, max_annual_benefit_cents, rent_cap_cents, utility_cap_cents, income_limit_cents, "appeal_window_days?", "require_eviction_notice?", "require_lease_ledger?", "require_utility_bill?"], output: EligibilityPolicy, side_effects: ["status = DRAFT"] }
  - { method: GET, path: "/assistance/policies/{id}", description: "Fetch a policy", roles: [Caseworker, ProgramManager, FinanceOfficer, Auditor], code: 200, input: [], output: EligibilityPolicy, side_effects: [] }
  - { method: GET, path: "/assistance/policies", description: "List policies", roles: [Caseworker, ProgramManager, FinanceOfficer, Auditor], code: 200, input: ["status?", "limit?", "offset?"], output: "EligibilityPolicy[]", side_effects: [] }
  - { method: POST, path: "/assistance/policies/{id}/activate", description: "Activate a DRAFT policy; supersedes the currently ACTIVE policy to RETIRED", roles: [ProgramManager], code: 200, input: [], output: EligibilityPolicy, side_effects: ["prior ACTIVE policy -> RETIRED", "increments EligibilityPolicy.version by 1"] }

  # --- Vendor ---
  - { method: POST, path: "/assistance/vendors", description: "Register a landlord/utility vendor", roles: [Caseworker, ProgramManager], code: 201, input: [name, vendor_type, "contact_name?", "phone?"], output: Vendor, side_effects: ["status = ACTIVE"] }
  - { method: GET, path: "/assistance/vendors/{id}", description: "Fetch a vendor", roles: [Caseworker, ProgramManager, FinanceOfficer, Auditor], code: 200, input: [], output: Vendor, side_effects: [] }
  - { method: POST, path: "/assistance/vendors/{id}/suspend", description: "Suspend a vendor (blocks new application submissions referencing it)", roles: [ProgramManager], code: 200, input: [], output: Vendor, side_effects: ["status -> SUSPENDED", "increments Vendor.version by 1"] }
  - { method: POST, path: "/assistance/vendors/{id}/reactivate", description: "Reactivate a suspended vendor", roles: [ProgramManager], code: 200, input: [], output: Vendor, side_effects: ["status -> ACTIVE", "increments Vendor.version by 1"] }

  # --- AssistanceApplication ---
  - { method: POST, path: "/assistance/applications", description: "Open an assistance application (status INTAKE); intake_caseworker_id = acting X-User-ID", roles: [Caseworker], code: 201, input: [household_id, vendor_id, category, requested_amount_cents, service_month], output: AssistanceApplication, side_effects: ["status = INTAKE", "checks ERR_VENDOR_CATEGORY_MISMATCH and ERR_SERVICE_MONTH_CONFLICT"] }
  - { method: GET, path: "/assistance/applications/{id}", description: "Fetch an application", roles: [Caseworker, ProgramManager, FinanceOfficer, Auditor], code: 200, input: [], output: AssistanceApplication, side_effects: [] }
  - { method: GET, path: "/assistance/applications", description: "List applications with filters", roles: [Caseworker, ProgramManager, FinanceOfficer, Auditor], code: 200, input: ["household_id?", "vendor_id?", "policy_id?", "status?", "category?", "limit?", "offset?"], output: "AssistanceApplication[]", side_effects: [] }
  - { method: POST, path: "/assistance/applications/{id}/documents", description: "Attach a document to an INTAKE application", roles: [Caseworker], code: 201, input: [doc_type, file_reference], output: ApplicationDocument, side_effects: ["uploaded_by = acting X-User-ID"] }
  - { method: POST, path: "/assistance/applications/{id}/submit", description: "Submit an INTAKE application; pins the ACTIVE policy", roles: [Caseworker], code: 200, input: [], output: AssistanceApplication, side_effects: ["INTAKE -> SUBMITTED per state machine"] }
  - { method: POST, path: "/assistance/applications/{id}/verifications", description: "Open a vendor verification (OCC-guarded; supersedes any PENDING verification)", roles: [Caseworker], code: 201, input: [expected_application_version], output: VendorVerification, side_effects: ["application SUBMITTED|VERIFICATION_FAILED -> UNDER_VERIFICATION", "existing PENDING verifications -> SUPERSEDED", "increments AssistanceApplication.version by 1"] }
  - { method: POST, path: "/assistance/applications/{id}/duplication-checks", description: "Open a duplication-of-benefits check with another agency (OCC-guarded; supersedes any PENDING check)", roles: [Caseworker], code: 201, input: [agency_name, expected_application_version], output: DuplicationCheck, side_effects: ["existing PENDING checks -> SUPERSEDED", "increments AssistanceApplication.version by 1"] }
  - { method: POST, path: "/assistance/applications/{id}/approve", description: "Approve a PENDING_DECISION application: computes award, runs allocation waterfall, reserves funds", roles: [ProgramManager], code: 200, input: [], output: AssistanceApplication, side_effects: ["creates AssistanceAward + FundingAllocations", "source balances and statuses updated", "active_award_id set", "increments AssistanceApplication.version by 1"] }
  - { method: POST, path: "/assistance/applications/{id}/deny", description: "Deny a PENDING_DECISION or WAITLISTED application", roles: [ProgramManager], code: 200, input: [reason_code], output: AssistanceApplication, side_effects: ["status -> DENIED", "denied_at/denial_reason set", "increments AssistanceApplication.version by 1"] }
  - { method: POST, path: "/assistance/applications/{id}/waitlist", description: "Move a PENDING_DECISION application to WAITLISTED (eligibility checked, funds not checked)", roles: [ProgramManager], code: 200, input: [], output: AssistanceApplication, side_effects: ["waitlisted_at set", "increments AssistanceApplication.version by 1"] }
  - { method: POST, path: "/assistance/applications/{id}/appeal", description: "Appeal a DENIED application within the pinned policy's appeal window", roles: [Caseworker], code: 200, input: [appeal_reason], output: AssistanceApplication, side_effects: ["DENIED -> PENDING_DECISION", "increments AssistanceApplication.version by 1"] }
  - { method: POST, path: "/assistance/applications/{id}/withdraw", description: "Withdraw a pre-approval application", roles: [Caseworker], code: 200, input: [], output: AssistanceApplication, side_effects: ["status -> WITHDRAWN", "PENDING verifications -> SUPERSEDED", "increments AssistanceApplication.version by 1"] }
  - { method: POST, path: "/assistance/applications/{id}/close", description: "Close a PAID or DENIED application after a follow-up outcome is recorded", roles: [Caseworker], code: 200, input: [], output: AssistanceApplication, side_effects: ["status -> CLOSED", "closed_at set", "increments AssistanceApplication.version by 1"] }
  - { method: POST, path: "/assistance/applications/{id}/case-notes", description: "Append a case note (immutable); FOLLOW_UP notes require outcome", roles: [Caseworker], code: 201, input: [note_type, body, "outcome?", "occurred_at?"], output: CaseNote, side_effects: ["author_id = acting X-User-ID"] }

  # --- ApplicationDocument ---
  - { method: GET, path: "/assistance/documents/{id}", description: "Fetch a document", roles: [Caseworker, ProgramManager, FinanceOfficer, Auditor], code: 200, input: [], output: ApplicationDocument, side_effects: [] }
  - { method: GET, path: "/assistance/documents", description: "List documents (filter by application)", roles: [Caseworker, ProgramManager, FinanceOfficer, Auditor], code: 200, input: ["application_id?", "limit?", "offset?"], output: "ApplicationDocument[]", side_effects: [] }

  # --- VendorVerification ---
  - { method: GET, path: "/assistance/verifications/{id}", description: "Fetch a verification", roles: [Caseworker, ProgramManager, FinanceOfficer, Auditor], code: 200, input: [], output: VendorVerification, side_effects: [] }
  - { method: GET, path: "/assistance/verifications", description: "List verifications (filter by application or vendor)", roles: [Caseworker, ProgramManager, FinanceOfficer, Auditor], code: 200, input: ["application_id?", "vendor_id?", "limit?", "offset?"], output: "VendorVerification[]", side_effects: [] }
  - { method: POST, path: "/assistance/verifications/{id}/complete", description: "Record the vendor verification outcome; drives the application state", roles: [Caseworker], code: 200, input: [outcome, "confirmed_amount_cents?", "outcome_notes?"], output: VendorVerification, side_effects: ["PENDING -> PASSED|FAILED", "application -> PENDING_DECISION|VERIFICATION_FAILED"] }

  # --- DuplicationCheck ---
  - { method: GET, path: "/assistance/duplication-checks/{id}", description: "Fetch a duplication check", roles: [Caseworker, ProgramManager, FinanceOfficer, Auditor], code: 200, input: [], output: DuplicationCheck, side_effects: [] }
  - { method: GET, path: "/assistance/duplication-checks", description: "List duplication checks (filter by application)", roles: [Caseworker, ProgramManager, FinanceOfficer, Auditor], code: 200, input: ["application_id?", "limit?", "offset?"], output: "DuplicationCheck[]", side_effects: [] }
  - { method: POST, path: "/assistance/duplication-checks/{id}/resolve", description: "Record the external agency's response", roles: [Caseworker], code: 200, input: [result, "resolution_notes?"], output: DuplicationCheck, side_effects: ["PENDING -> CLEARED|FLAGGED"] }
  - { method: POST, path: "/assistance/duplication-checks/{id}/override", description: "ProgramManager overrides a FLAGGED check to CLEARED with justification", roles: [ProgramManager], code: 200, input: [override_justification], output: DuplicationCheck, side_effects: ["FLAGGED -> CLEARED"] }

  # --- CaseNote ---
  - { method: GET, path: "/assistance/case-notes/{id}", description: "Fetch a case note", roles: [Caseworker, ProgramManager, FinanceOfficer, Auditor], code: 200, input: [], output: CaseNote, side_effects: [] }
  - { method: GET, path: "/assistance/case-notes", description: "List case notes (filter by application)", roles: [Caseworker, ProgramManager, FinanceOfficer, Auditor], code: 200, input: ["application_id?", "note_type?", "limit?", "offset?"], output: "CaseNote[]", side_effects: [] }

  # --- AssistanceAward ---
  - { method: GET, path: "/assistance/awards/{id}", description: "Fetch an award", roles: [Caseworker, ProgramManager, FinanceOfficer, Auditor], code: 200, input: [], output: AssistanceAward, side_effects: [] }
  - { method: GET, path: "/assistance/awards", description: "List awards (filter by application or pinned policy)", roles: [Caseworker, ProgramManager, FinanceOfficer, Auditor], code: 200, input: ["application_id?", "policy_id?", "status?", "limit?", "offset?"], output: "AssistanceAward[]", side_effects: [] }
  - { method: POST, path: "/assistance/awards/{id}/adjust", description: "Reduce an award before any payment clears (OCC-guarded); pro-rata release across allocations", roles: [ProgramManager], code: 200, input: [new_awarded_amount_cents, expected_award_version], output: AssistanceAward, side_effects: ["award_reduction_proration releases funds per allocation in rank_order", "source.reserved_cents decreased; EXHAUSTED sources may return to ACTIVE", "increments AssistanceAward.version by 1"] }
  - { method: POST, path: "/assistance/awards/{id}/void", description: "Void an award before any payment clears; releases all reservations and returns the application to PENDING_DECISION", roles: [ProgramManager], code: 200, input: [], output: AssistanceAward, side_effects: ["allocations -> RELEASED", "source balances recomputed", "application APPROVED -> PENDING_DECISION", "increments AssistanceAward.version by 1"] }
  - { method: POST, path: "/assistance/awards/{id}/payments", description: "Issue a direct-to-vendor payment against a RESERVED allocation", roles: [FinanceOfficer], code: 201, input: [vendor_id, funding_source_id, amount_cents, payment_date], output: Payment, side_effects: ["status = ISSUED", "issued_by = acting X-User-ID"] }

  # --- FundingAllocation ---
  - { method: GET, path: "/assistance/allocations/{id}", description: "Fetch an allocation", roles: [Caseworker, ProgramManager, FinanceOfficer, Auditor], code: 200, input: [], output: FundingAllocation, side_effects: [] }
  - { method: GET, path: "/assistance/allocations", description: "List allocations (filter by award or funding source)", roles: [Caseworker, ProgramManager, FinanceOfficer, Auditor], code: 200, input: ["award_id?", "funding_source_id?", "status?", "limit?", "offset?"], output: "FundingAllocation[]", side_effects: [] }

  # --- FundingSource ---
  - { method: POST, path: "/assistance/funding-sources", description: "Create a funding source (donor/grant/government pool)", roles: [ProgramManager], code: 201, input: [name, funder_name, source_type, allowed_categories, period_start, period_end, total_budget_cents, max_per_household_cents], output: FundingSource, side_effects: ["status = ACTIVE", "checks ERR_SOURCE_PERIOD_OVERLAP"] }
  - { method: GET, path: "/assistance/funding-sources/{id}", description: "Fetch a funding source with computed balances", roles: [Caseworker, ProgramManager, FinanceOfficer, Auditor], code: 200, input: [], output: FundingSource, side_effects: [] }
  - { method: GET, path: "/assistance/funding-sources", description: "List funding sources", roles: [Caseworker, ProgramManager, FinanceOfficer, Auditor], code: 200, input: ["status?", "limit?", "offset?"], output: "FundingSource[]", side_effects: [] }
  - { method: POST, path: "/assistance/funding-sources/{id}/deposits", description: "Deposit additional budget into a non-CLOSED source", roles: [ProgramManager], code: 200, input: [amount_cents], output: FundingSource, side_effects: ["total_budget_cents += amount_cents", "available_cents recomputed", "EXHAUSTED -> ACTIVE if available_cents > 0", "increments FundingSource.version by 1"] }
  - { method: POST, path: "/assistance/funding-sources/{id}/close", description: "Close a source to new allocations (requires reserved_cents == 0)", roles: [ProgramManager], code: 200, input: [], output: FundingSource, side_effects: ["status -> CLOSED", "increments FundingSource.version by 1"] }
  - { method: GET, path: "/assistance/funding-sources/{id}/report", description: "Donor/grant report: cash vs encumbrance utilization, per-category committed totals, households served", roles: [ProgramManager, Auditor], code: 200, input: [], output: "{ funding_source_id: string, committed_cents: integer, reserved_cents: integer, available_cents: integer, cash_utilization_pct: number, encumbrance_utilization_pct: number, rent_committed_cents: integer, utility_committed_cents: integer, households_served: integer, period_start: datetime, period_end: datetime }", side_effects: ["evaluates source_utilization_reporting"] }

  # --- Payment ---
  - { method: GET, path: "/assistance/payments/{id}", description: "Fetch a payment", roles: [Caseworker, ProgramManager, FinanceOfficer, Auditor], code: 200, input: [], output: Payment, side_effects: [] }
  - { method: GET, path: "/assistance/payments", description: "List payments (filter by award, vendor, or funding source)", roles: [Caseworker, ProgramManager, FinanceOfficer, Auditor], code: 200, input: ["award_id?", "vendor_id?", "funding_source_id?", "status?", "limit?", "offset?"], output: "Payment[]", side_effects: [] }
  - { method: POST, path: "/assistance/payments/{id}/clear", description: "Mark a payment cleared by the vendor; moves reserved funds to committed", roles: [FinanceOfficer], code: 200, input: [], output: Payment, side_effects: ["allocation.consumed_cents += amount", "source reserved->committed shift", "award/application bubble-up transitions", "increments Payment.version by 1"] }
  - { method: POST, path: "/assistance/payments/{id}/fail", description: "Mark a payment failed (e.g., check bounced)", roles: [FinanceOfficer], code: 200, input: [], output: Payment, side_effects: ["ISSUED -> FAILED", "increments Payment.version by 1"] }
  - { method: POST, path: "/assistance/payments/{id}/reissue", description: "Reissue a FAILED payment; re-validates remainder and period", roles: [FinanceOfficer], code: 200, input: [], output: Payment, side_effects: ["FAILED -> ISSUED", "increments Payment.version by 1"] }
  - { method: POST, path: "/assistance/payments/{id}/void", description: "Void an ISSUED or FAILED payment", roles: [FinanceOfficer], code: 200, input: [], output: Payment, side_effects: ["status -> VOIDED", "increments Payment.version by 1"] }

  # --- ReplenishmentRun ---
  - { method: POST, path: "/assistance/replenishment-runs", description: "Ops-run checkpoint: sweep the waitlist in priority order, promoting or denying per waitlist_promotion_sweep; skip-and-continue on funding shortfall", roles: [ProgramManager], code: 201, input: [], output: ReplenishmentRun, side_effects: ["per-candidate promotion or denial per waitlist_promotion_sweep"] }
  - { method: GET, path: "/assistance/replenishment-runs/{id}", description: "Fetch a run's recorded results", roles: [Caseworker, ProgramManager, FinanceOfficer, Auditor], code: 200, input: [], output: ReplenishmentRun, side_effects: [] }

  # --- Test-driving clock ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server's logical clock. Default at startup is exactly 2026-08-01T00:00:00Z and the clock never falls back to wall-clock time; all timestamps, benefit years, windows, and periods read this clock.", roles: [ProgramManager], code: 200, input: [to_iso8601], output: "{ current_utc: datetime }", side_effects: ["logical clock advanced"] }

# =============================================================================
# 1.6 Error Code Catalog (34 codes)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role is authenticated but not listed in the endpoint's roles" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum, non-positive cents field, malformed service_month, or outcome-conditional field missing (confirmed_amount_cents when outcome == PASSED)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body foreign key references a non-existent resource" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent entity's current version on an OCC-guarded write" }
  - { id: ERR_INVALID_APPLICATION_STATE, http: 409, condition: "Application is not in a state from which the requested transition exists" }
  - { id: ERR_INVALID_VERIFICATION_STATE, http: 409, condition: "Verification is not PENDING when completion is attempted" }
  - { id: ERR_INVALID_DUPLICATION_CHECK_STATE, http: 409, condition: "Resolve attempted on a non-PENDING check, or override attempted on a non-FLAGGED check" }
  - { id: ERR_INVALID_AWARD_STATE, http: 409, condition: "Adjust/void attempted on an award not in ACTIVE status" }
  - { id: ERR_INVALID_PAYMENT_STATE, http: 409, condition: "Payment transition attempted from a state where it does not exist (e.g., clear a FAILED payment, reissue an ISSUED one)" }
  - { id: ERR_INVALID_SOURCE_STATE, http: 409, condition: "Deposit or close attempted on a CLOSED funding source" }
  - { id: ERR_INVALID_POLICY_STATE, http: 409, condition: "Activate attempted on a policy not in DRAFT status" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Vendor suspend/reactivate attempted from a state where it does not exist" }
  - { id: ERR_VENDOR_SUSPENDED, http: 409, condition: "Submit attempted while the application's vendor is SUSPENDED" }
  - { id: ERR_NO_ACTIVE_POLICY, http: 409, condition: "Submit or replenishment run attempted while no EligibilityPolicy is ACTIVE" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Actor's X-User-ID equals the application's intake_caseworker_id (verification create/complete, deny) or equals intake_caseworker_id or the PASSED verification's verifier_id (approve)" }
  - { id: ERR_DUPLICATION_CHECK_REQUIRED, http: 409, condition: "Approve/waitlist attempted with zero DuplicationChecks recorded for the application" }
  - { id: ERR_DUPLICATION_UNRESOLVED, http: 409, condition: "Approve/waitlist attempted while any DuplicationCheck of the application is PENDING or FLAGGED" }
  - { id: ERR_VENDOR_CATEGORY_MISMATCH, http: 409, condition: "Application category RENT requires a LANDLORD vendor; UTILITY requires a UTILITY vendor" }
  - { id: ERR_VENDOR_MISMATCH, http: 409, condition: "Payment vendor_id differs from the application's vendor_id" }
  - { id: ERR_NO_RESERVED_ALLOCATION, http: 409, condition: "Payment's funding_source_id holds no RESERVED allocation on the payment's award" }
  - { id: ERR_SOURCE_PERIOD_CLOSED, http: 409, condition: "payment_date falls outside the source's half-open [period_start, period_end) at payment create or reissue" }
  - { id: ERR_APPEAL_WINDOW_CLOSED, http: 409, condition: "Appeal attempted after denied_at + pinned policy.appeal_window_days (boundary is inclusive)" }
  - { id: ERR_SOURCE_PERIOD_OVERLAP, http: 409, condition: "New funding source's half-open period overlaps another non-CLOSED source from the same funder_name; adjacency (end == start) is allowed" }
  - { id: ERR_DOCUMENTS_INCOMPLETE, http: 409, condition: "Submit attempted without every document type the ACTIVE policy requires for the application's category" }
  - { id: ERR_SERVICE_MONTH_CONFLICT, http: 409, condition: "Another application exists for the same household, category, and service_month in a status NOT IN {DENIED, WITHDRAWN, CLOSED}" }
  - { id: ERR_PAYMENT_EXCEEDS_ALLOCATION, http: 409, condition: "Payment amount exceeds the allocation remainder (allocated_cents - consumed_cents - sum of other ISSUED payments on the same allocation)" }
  - { id: ERR_PAYMENTS_OUTSTANDING, http: 409, condition: "Award void/adjust attempted while any of the award's payments is ISSUED" }
  - { id: ERR_PAYMENTS_CLEARED, http: 409, condition: "Award void/adjust attempted while any of the award's payments is CLEARED" }
  - { id: ERR_RESERVED_FUNDS_OUTSTANDING, http: 409, condition: "Funding-source close attempted while reserved_cents > 0" }
  - { id: ERR_INCOME_LIMIT_EXCEEDED, http: 409, condition: "household.annual_income_cents > applicable policy.income_limit_cents (inclusive boundary: equality is eligible)" }
  - { id: ERR_ANNUAL_CAP_EXCEEDED, http: 409, condition: "Household's remaining annual benefit-year cap is exactly 0 at approval time" }
  - { id: ERR_CATEGORY_CAP_EXCEEDED, http: 409, condition: "Household's remaining category cap (rent_cap_cents or utility_cap_cents) is exactly 0 at approval time" }
  - { id: ERR_FUNDS_EXHAUSTED, http: 402, condition: "Allocation waterfall cannot cover the full computed award from compatible sources; nothing is reserved (atomic)" }

# =============================================================================
# 1.7 RBAC Matrix (4 roles, all opaque operator identities)
# =============================================================================
roles:
  - name: Caseworker
    description: "Ministry caseworker: intake, documentation, verification, duplication checks, case notes, follow-up outcomes"
    identity: opaque
    exclusive_operations:
      - "POST /assistance/households"
      - "POST /assistance/applications and all its sub-resource writes (documents, submit, verifications, duplication-checks, appeal, withdraw, close, case-notes)"
      - "POST /assistance/verifications/{id}/complete"
      - "POST /assistance/duplication-checks/{id}/resolve"
    shared_operations:
      - "All GET read endpoints"
      - "POST /assistance/vendors (shared with ProgramManager)"

  - name: ProgramManager
    description: "Program manager: policy and funding-source administration, award decisions, adjustments, overrides, replenishment runs, clock control"
    identity: opaque
    exclusive_operations:
      - "POST /assistance/policies and /activate"
      - "POST /assistance/funding-sources, /deposits, /close"
      - "POST /assistance/applications/{id}/approve, /deny, /waitlist"
      - "POST /assistance/awards/{id}/adjust, /void"
      - "POST /assistance/duplication-checks/{id}/override"
      - "POST /assistance/vendors/{id}/suspend, /reactivate"
      - "POST /assistance/replenishment-runs"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET read endpoints"
      - "GET /assistance/funding-sources/{id}/report (shared with Auditor)"
      - "POST /assistance/vendors (shared with Caseworker)"

  - name: FinanceOfficer
    description: "Finance officer: direct-to-vendor payment lifecycle (issue, clear, fail, reissue, void)"
    identity: opaque
    exclusive_operations:
      - "POST /assistance/awards/{id}/payments"
      - "POST /assistance/payments/{id}/clear, /fail, /reissue, /void"
    shared_operations:
      - "All GET read endpoints"

  - name: Auditor
    description: "Read-only auditor: reviews records and pulls donor/grant reports; cannot mutate anything"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "All GET read endpoints"
      - "GET /assistance/funding-sources/{id}/report (shared with ProgramManager)"
