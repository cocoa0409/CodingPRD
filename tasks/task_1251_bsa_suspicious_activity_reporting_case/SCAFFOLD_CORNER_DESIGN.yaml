        claim_type: violation_to_error
        grounds: ["errors[ERR_ANALYST_AT_CAPACITY]", "validations[priority=14]", entities.Analyst.fields.capacity_max_cases]
        distinguishing_aspect: "Assignment of a second open case to an analyst with capacity_max_cases == 1 fails; the boundary is inclusive-at-capacity (assigned_open_cases < capacity required)."
        test_recipe:
          setup: ["Analyst an1 with capacity 1; case k1 already assigned to an1; case k2 OPEN"]
          setup_api_calls:
            - { call: "POST /analysts", payload: { full_name: "Ann Analyst", capacity_max_cases: 1 }, as: ComplianceAdmin, captures: { an1: $.data.id } }
            - { call: "POST /analysts", payload: { full_name: "Meg Manager", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { mg1: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "Carl Customer", country_code: "US", country_risk: "LOW" }, as: ComplianceAdmin, captures: { cu1: $.data.id } }
            - { call: "POST /cases", payload: { customer_id: "${cu1}" }, as: BSAManager, as_user_id: "${mg1}", captures: { k1: $.data.id } }
            - { call: "POST /cases/${k1}/assign", payload: { analyst_id: "${an1}" }, as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /cases", payload: { customer_id: "${cu1}" }, as: BSAManager, as_user_id: "${mg1}", captures: { k2: $.data.id } }
          trigger:
            - { call: "POST /cases/${k2}/assign", payload: { analyst_id: "${an1}" }, as: BSAManager, as_user_id: "${mg1}", captures: { err: $.data.error_id } }
          assert:
            - "409 ERR_ANALYST_AT_CAPACITY; Case.${k2} remains OPEN with assigned_analyst_id null"
            - "Analyst.${an1}.assigned_open_cases still == 1 (no partial mutation)"

      - name: prohibited_customer_account_open_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_CUSTOMER_PROHIBITED]", "validations[priority=9]", calculations.customer_risk_rating_recompute]
        distinguishing_aspect: "The business_safety risk gate: a HIGH-country-risk customer with 3 open LE inquiries (enhanced score 825 -> PROHIBITED) cannot open a new account."
        test_recipe:
          setup: ["Customer cu1 country_risk HIGH with 3 open LE inquiries (risk_score_enhanced 825, rating PROHIBITED)"]
