  # ===========================================================================
  - section: rbac
    instances:
      - name: group_sales_manager_cannot_publish_rate_decision
        claim_type: exclusive_op_denied
        grounds:
          - roles
          - "validations[priority=2]"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "GroupSalesManager calling the publish endpoint (RevenueManager-exclusive) -> ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["Property/RoomType/master BAR plan; InventoryDay; one DRAFT decision"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /properties"
              payload: { name: "RbacPub", total_rooms: 40 }
              as: RevenueManager
              captures: { pid: $.data.id }
            - call: "POST /room-types"
              payload: { property_id: "${pid}", code: "KING", name: "King", physical_rooms: 40 }
              as: RevenueManager
              captures: { rt: $.data.id }
            - call: "POST /rate-plans"
              payload: { room_type_id: "${rt}", rate_class: "BAR", is_master_bar: true, base_rate: 200, floor_rate: 100, ceiling_rate: 400 }
              as: RevenueManager
              captures: { rp: $.data.id, rpv: $.data.version }
            - call: "POST /inventory-days"
              payload: { room_type_id: "${rt}", stay_date: "2026-06-05T00:00:00Z", physical_capacity: 40, transient_sold_rooms: 5 }
              as: RevenueManager
            - call: "POST /rate-decisions"
              payload: { rate_plan_id: "${rp}", stay_date: "2026-06-05T00:00:00Z", requested_rate: 200 }
              as: RevenueManager
              captures: { dec: $.data.id }
          trigger:
            - call: "POST /rate-decisions/${dec}/publish"
              payload: { expected_rate_plan_version: "${rpv}" }
              as: GroupSalesManager
              captures: { err: $.data.error_id }
          assert:
            - "Response code 403; error_id == ERR_FORBIDDEN"

      - name: analyst_cannot_create_property
        claim_type: exclusive_op_denied
        grounds:
          - roles
          - "validations[priority=2]"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "Analyst (read-only) calling POST /properties -> ERR_FORBIDDEN (403)."
