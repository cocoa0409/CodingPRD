      - name: cancelled_policy_is_terminal_and_rejects_every_further_action
        claim_type: terminal_state_lockdown
        grounds:
          - validations[priority=8]
          - errors[ERR_INVALID_POLICY_STATE]
          - state_machines.LeaguePolicy.QUOTED_to_CANCELLED
          - entities.LeaguePolicy.fields.cancel_reason
        distinguishing_aspect: "CANCELLED is a declared terminal state, so neither bind nor activate nor run-off may fire afterwards; all three must return 409 ERR_INVALID_POLICY_STATE while status stays CANCELLED and cancel_reason survives. A server that treats CANCELLED as merely another intermediate state fails at least one of the three."
        test_recipe:
          setup: ["One league, one BASEBALL_U12 classification and one QUOTED policy that is then cancelled."]
          setup_api_calls:
            - call: "POST /leagues"
