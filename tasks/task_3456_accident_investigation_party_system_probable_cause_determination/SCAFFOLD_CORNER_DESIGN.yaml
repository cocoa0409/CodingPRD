  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_case_version_rejected_and_fresh_propose_supersedes
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[propose-stale-case-version]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "OCC on AccidentCase.version: after a successful proposal advances the case to version 2, a second proposal carrying the stale version 1 is rejected 412 ERR_STALE_VERSION; carrying the fresh version 2 succeeds and supersedes the first PROPOSED decision (exactly one PROPOSED survives)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one 60-point case with one PROPOSED decision (case at version 2)."
          setup_api_calls:
            - *c_clock
            - *c_case
            - *c_propose
          trigger:
            - call: "POST /accident-cases/${case_id}/launch-decisions"
              payload: { mode: "LIMITED", expected_accident_case_version: "${case_v}" }
              as: ManagingDirector
              as_user_id: "md-1"
              captures: { err_stale: $.data.error_id }
            - call: "POST /accident-cases/${case_id}/launch-decisions"
              payload: { mode: "LIMITED", expected_accident_case_version: "${case_v2}" }
              as: ManagingDirector
              as_user_id: "md-1"
          assert:
            - "the stale proposal returns 412 and err_stale == ERR_STALE_VERSION"
            - "the fresh proposal returns 201 and the case version becomes 3"
            - "GET /accident-cases/${case_id} shows launch_decisions of length 2: the original ${decision_id} SUPERSEDED and the new one PROPOSED — exactly one PROPOSED decision exists"

      - name: occ_stale_meeting_version_rejected_on_second_vote
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[vote-stale-meeting-version]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "OCC on BoardMeeting.version: two strictly sequential votes — the first succeeds and advances the meeting to version 2, the second carrying the pre-vote version 1 is rejected 412 ERR_STALE_VERSION; tally reflects exactly one ballot."
        test_recipe:
          setup:
            - "Base chain through ANALYSIS; meeting room-1 in session, no votes yet (version 1)."
          setup_api_calls:
            - *c_clock
            - *c_case
            - *c_propose
            - *c_adopt
            - *c_fetch_inv
            - *c_group
            - *c_adv_onscene
            - *c_org
            - *c_designation
            - *c_seat
            - *c_adv_factual
            - *c_report
            - *c_verify
            - *c_complete
            - *c_release
            - *c_adv_analysis
            - *c_mtg
            - *c_adv_board
            - *c_clock_session
          trigger:
            - call: "POST /board-meetings/${mtg_id}/votes"
              payload: { position: "ADOPT", expected_meeting_version: "${mtg_v}" }
              as: BoardMember
              as_user_id: "bm-1"
              captures: { mtg_v_after: $.data.version }
            - call: "POST /board-meetings/${mtg_id}/votes"
              payload: { position: "ADOPT", expected_meeting_version: "${mtg_v}" }
              as: BoardMember
              as_user_id: "bm-2"
              captures: { err_stale: $.data.error_id }
          assert:
            - "the first vote returns 200 and advances the meeting version"
            - "the second vote returns 412 and err_stale == ERR_STALE_VERSION (it carried the pre-vote version)"
            - "GET /board-meetings/${mtg_id} shows adopt_count == 1 and exactly one member_votes entry"

      - name: vote_before_window_start_rejected_until_clock_reaches_it
        claim_type: scheduled_actions
        grounds:
          - state_machines.BoardMeeting.SCHEDULED_to_IN_SESSION
          - errors.ERR_MEETING_NOT_IN_SESSION
        distinguishing_aspect: "Deferred action gating: a vote cast while the logical clock is before window_start_utc is rejected with ERR_MEETING_NOT_IN_SESSION; the identical vote succeeds once the clock reaches the window — no wall-clock waiting involved."
        test_recipe:
          setup:
            - "Base chain through ANALYSIS; meeting room-1 scheduled for 2026-09-02T09:00:00Z while the clock is 2026-09-01."
          setup_api_calls:
            - *c_clock
            - *c_case
            - *c_propose
            - *c_adopt
            - *c_fetch_inv
            - *c_group
            - *c_adv_onscene
            - *c_org
            - *c_designation
            - *c_seat
            - *c_adv_factual
            - *c_report
            - *c_verify
            - *c_complete
            - *c_release
            - *c_adv_analysis
            - *c_mtg
            - *c_adv_board
          trigger:
            - call: "POST /board-meetings/${mtg_id}/votes"
              payload: { position: "ADOPT", expected_meeting_version: "${mtg_v}" }
              as: BoardMember
              as_user_id: "bm-1"
              captures: { err_early: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T09:00:00Z" }
              as: BoardAdmin
            - call: "POST /board-meetings/${mtg_id}/votes"
              payload: { position: "ADOPT", expected_meeting_version: "${mtg_v}" }
              as: BoardMember
              as_user_id: "bm-1"
          assert:
            - "the early vote returns 409 and err_early == ERR_MEETING_NOT_IN_SESSION (the meeting is still effectively SCHEDULED)"
            - "after the clock reaches the window start, the identical vote returns 200 and adopt_count == 1"

      - name: seat_then_expel_conserves_group_seating
        claim_type: cascading_side_effects
        grounds:
          - calculations.seated_count
        excluded_because:
          difficulty_instance: compensating_invariant_seat_then_expel_conserves_seating
          rationale: "The seat/expel conservation of seated_count is asserted in the named §1.8 instance."

      - name: vote_cast_then_retract_conserves_tallies
        claim_type: optimistic_concurrency
        grounds:
          - entities.BoardMeeting.fields.adopt_count
        excluded_because:
          difficulty_instance: compensating_invariant_vote_cast_then_retract_conserves_tallies
          rationale: "The cast/retract tally conservation with version advancement is asserted in the named §1.8 instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: adopt_response_immediately_reflects_launched_case
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/accident-cases/{id}/launch-decisions/{decision_id}/adopt
        distinguishing_aspect: "Immediate consistency: the adopt response body itself carries the LAUNCHED status and incremented version, and a following GET /accident-cases/${case_id} returns the identical state — no reconciliation lag between the write response and the read."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one 60-point case with a PROPOSED FULL_GO_TEAM decision."
          setup_api_calls:
            - *c_clock
            - *c_case
            - *c_propose
          trigger:
            - call: "POST /accident-cases/${case_id}/launch-decisions/${decision_id}/adopt"
