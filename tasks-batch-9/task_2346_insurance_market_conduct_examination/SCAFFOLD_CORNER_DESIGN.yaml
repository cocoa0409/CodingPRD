        distinguishing_aspect: |
          The roster is supplied as an array of objects but three of its properties come back
          server-maintained: lead_state_code is elected by the selector, participant_count is the
          array length, and every participating_states[].allocated_cents starts at 0 even though the
          request never mentions allocation.
