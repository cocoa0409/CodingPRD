          setup:
            - "One SOURCED NBE item awarded to a QUALIFIED supplier, trailing_90d_units 50000, carrying one CRITICAL, one MAJOR and one MINOR complaint (5 + 2 + 1 = 8 weighted points) so the item sits at 160.00 ppm and PROBATION."
            - "The supplier has exactly one PROBATION item, which is one short of the CONDITIONAL cascade."
