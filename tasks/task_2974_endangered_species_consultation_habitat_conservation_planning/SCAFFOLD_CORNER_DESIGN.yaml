            - "that second report also carries take_consumed_units past reinitiation_trigger_units 3.60, so the exceedance cascade fires; the cascade itself is walked in the §1.8 instance take_exceedance_cascade_six_hops_from_report_to_compliance_score"

      - name: priority_conflict_permit_not_active_versus_take_limit
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: permit_not_active_beats_take_limit_exceeded
          rationale: >-
            Declared conflict pair 1 of 4 (priority 10 state vs priority 28
            business_fiscal on POST /incidental-take-permits/{id}/monitoring-reports)
            is jointly violated and adjudicated there; this section asserts each
            rule on its own instead.

      - name: priority_conflict_jeopardy_versus_mitigation_shortfall
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: jeopardy_unresolved_beats_mitigation_shortfall
          rationale: >-
            Declared conflict pair 2 of 4 (priority 16 business_safety vs priority
            27 business_fiscal on POST /habitat-conservation-plans/{id}/decision),
            including the JEOPARDY_WITH_RPA pass-through, is adjudicated there.

      - name: priority_conflict_period_outside_term_versus_period_overlap
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: period_outside_permit_term_beats_reporting_period_overlap
          rationale: >-
            Declared conflict pair 3 of 4 (priority 19 business_temporal vs
            priority 21 business_constraint) is adjudicated there with a single
            request that violates both.

      - name: priority_conflict_bank_ineligible_versus_insufficient_credits
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: bank_not_eligible_beats_insufficient_bank_credits
          rationale: >-
            Declared conflict pair 4 of 4 (priority 24 business_referential vs
            priority 25 business_fiscal) is adjudicated there; the two rules are
            asserted separately above.

      - name: survey_window_conflict_rule
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: survey_windows_on_a_habitat_unit_are_closed_intervals_with_a_buffer
          rationale: >-
            Priority 20 (ERR_SURVEY_WINDOW_CONFLICT) is the enforcement face of
            branch A of calculations.interval_conflict_detection, whose buffered
            closed-interval semantics and cross-action scope are walked there.

      - name: reporting_period_overlap_rule
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: reporting_periods_on_a_permit_are_half_open_and_may_be_adjacent
          rationale: >-
            Priority 21 (ERR_REPORTING_PERIOD_OVERLAP) is the enforcement face of
            branch B, including the REJECTED-report interval release, which is
            asserted there.

      - name: no_presence_determination_rule
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: empty_candidate_set_is_no_effect_not_an_error
          rationale: >-
            Priority 22's reachable clause — zero PresenceDetermination rows on
            POST /project-actions/{id}/effect-determination returning
            ERR_NO_PRESENCE_DETERMINATIONS while an all-absent set returns
            NO_EFFECT — is asserted there. Coverage note: the rule's other two
            applies_to entries are unreachable defensive redundancy, because a
            Consultation (and hence a plan) can only exist if the effect
            determination already found a non-empty candidate set, and the
            candidate set can never shrink.

  # ==========================================================================
  # From Table 5 (Endpoints)
  # Coverage note: the "bulk action" endpoint pattern has no instance here
  # because §1.5 declares no bulk or batch endpoint — every write acts on one
  # aggregate. The "computed read" pattern is exercised throughout the
  # calculations section, where each derived field is read back over GET.
  # ==========================================================================
  - section: endpoints
    instances:

      - name: paginated_lists_carry_total_count_has_more_and_bounded_limits
        claim_type: standard_crud
        grounds:
          - endpoints[GET /presence-determinations]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
          - validations[priority=7]
        distinguishing_aspect: >-
          Only two endpoints in the whole API paginate, and their envelope must
          report total_count over the WHOLE filtered set — not over the returned
          page — while has_more is a function of offset + returned rows against
          that total. The declared bounds are rejections, not clamps: limit 101
          is an error rather than a silent 100.
        test_recipe:
          setup:
            - "One action carries eleven DATABASE_QUERY / DETECTED presence determinations of 1.00 acre each, created in a pinned order; the first and eleventh are captured."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-10-01T00:00:00Z"}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
            - call: "POST /species"
              payload: {scientific_name: "Gopherus agassizii", common_name: "Desert tortoise", listing_status: "ENDANGERED", take_authorization_unit: "INDIVIDUALS", take_density_per_acre: 0.40, recovery_unit_population: 4000, survey_season_start_month: 4, survey_season_end_month: 7}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {species_e_id: "$.data.id"}
            - call: "POST /proponents"
              payload: {org_name: "Sunrise Logistics Park LLC", contact_email: "permits@sunrise-park.example", is_federal_agency: false}
              as: Anonymous
              captures: {proponent_id: "$.data.id"}
            - call: "POST /project-actions"
              payload: {proponent_id: "${proponent_id}", action_name: "Sunrise Park Phase I", action_type: "NON_FEDERAL", footprint_acres: 200.00, county_code: "06037", construction_start_date: "2027-01-01", construction_end_date: "2027-12-31"}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {action_id: "$.data.id"}
            - call: "POST /project-actions/${action_id}/presence-determinations"
              payload: {species_id: "${species_e_id}", method: "DATABASE_QUERY", detection_result: "DETECTED", habitat_overlap_acres: 1.00}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {pd_first_id: "$.data.id"}
            - call: "POST /project-actions/${action_id}/presence-determinations"
              payload: {species_id: "${species_e_id}", method: "DATABASE_QUERY", detection_result: "DETECTED", habitat_overlap_acres: 1.00}
              as: Proponent
              as_user_id: "${proponent_id}"
            - call: "POST /project-actions/${action_id}/presence-determinations"
              payload: {species_id: "${species_e_id}", method: "DATABASE_QUERY", detection_result: "DETECTED", habitat_overlap_acres: 1.00}
              as: Proponent
              as_user_id: "${proponent_id}"
            - call: "POST /project-actions/${action_id}/presence-determinations"
              payload: {species_id: "${species_e_id}", method: "DATABASE_QUERY", detection_result: "DETECTED", habitat_overlap_acres: 1.00}
              as: Proponent
              as_user_id: "${proponent_id}"
            - call: "POST /project-actions/${action_id}/presence-determinations"
              payload: {species_id: "${species_e_id}", method: "DATABASE_QUERY", detection_result: "DETECTED", habitat_overlap_acres: 1.00}
              as: Proponent
              as_user_id: "${proponent_id}"
            - call: "POST /project-actions/${action_id}/presence-determinations"
              payload: {species_id: "${species_e_id}", method: "DATABASE_QUERY", detection_result: "DETECTED", habitat_overlap_acres: 1.00}
              as: Proponent
              as_user_id: "${proponent_id}"
            - call: "POST /project-actions/${action_id}/presence-determinations"
              payload: {species_id: "${species_e_id}", method: "DATABASE_QUERY", detection_result: "DETECTED", habitat_overlap_acres: 1.00}
              as: Proponent
              as_user_id: "${proponent_id}"
            - call: "POST /project-actions/${action_id}/presence-determinations"
              payload: {species_id: "${species_e_id}", method: "DATABASE_QUERY", detection_result: "DETECTED", habitat_overlap_acres: 1.00}
              as: Proponent
              as_user_id: "${proponent_id}"
            - call: "POST /project-actions/${action_id}/presence-determinations"
              payload: {species_id: "${species_e_id}", method: "DATABASE_QUERY", detection_result: "DETECTED", habitat_overlap_acres: 1.00}
              as: Proponent
              as_user_id: "${proponent_id}"
            - call: "POST /project-actions/${action_id}/presence-determinations"
              payload: {species_id: "${species_e_id}", method: "DATABASE_QUERY", detection_result: "DETECTED", habitat_overlap_acres: 1.00}
              as: Proponent
              as_user_id: "${proponent_id}"
            - call: "POST /project-actions/${action_id}/presence-determinations"
              payload: {species_id: "${species_e_id}", method: "DATABASE_QUERY", detection_result: "DETECTED", habitat_overlap_acres: 1.00}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {pd_last_id: "$.data.id"}
          trigger:
            - call: "GET /presence-determinations"
              payload: {project_action_id: "${action_id}"}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {page1_first: "$.data[0].id", page1_tenth: "$.data[9].id"}
            - call: "GET /presence-determinations"
              payload: {project_action_id: "${action_id}", limit: 100}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {all_eleventh: "$.data[10].id"}
            - call: "GET /presence-determinations"
              payload: {project_action_id: "${action_id}", limit: 10, offset: 10}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {page2_first: "$.data[0].id"}
            - call: "GET /presence-determinations"
              payload: {limit: 0}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {e_limit_low: "$.data.error_id"}
            - call: "GET /presence-determinations"
              payload: {limit: 101}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {e_limit_high: "$.data.error_id"}
            - call: "GET /presence-determinations"
              payload: {offset: -1}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {e_offset: "$.data.error_id"}
          assert:
            - "the first trigger supplies no limit and returns exactly 10 rows — the §1.0 default — with pagination.total_count == 11 and pagination.has_more == true"
            - "${page1_first} == ${pd_first_id}: the page is ordered created_at ASC, so the oldest row leads"
            - "the second trigger returns all 11 rows with has_more == false and ${all_eleventh} == ${pd_last_id}"
            - "the third trigger returns 1 row with ${page2_first} == ${pd_last_id}, total_count still 11 and has_more == false: total_count is a property of the filtered set, not of the page"
            - "limit 0, limit 101 and offset -1 all return 400 with error_id 'ERR_INVALID_REQUEST' — the bounds are limit 1..100 and offset >= 0, and an out-of-range limit is never clamped"
            - "the same three bad parameters are refused on GET /project-actions too, since both paginated endpoints share the envelope"

      - name: sub_resource_lists_are_unpaginated_with_a_null_pagination_block
        claim_type: standard_crud
        grounds:
