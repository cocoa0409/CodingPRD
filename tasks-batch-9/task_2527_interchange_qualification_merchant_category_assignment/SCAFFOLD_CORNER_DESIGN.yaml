      - name: state_machine_terminal_lockdown_second_submit_on_finalized_batch_is_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.SettlementBatch.terminal_states
          - errors[ERR_INVALID_STATE]
          - validations[priority=7]
        distinguishing_aspect: "FINALIZED is terminal for SettlementBatch: a further submit returns ERR_INVALID_STATE 409 and finalized_at is not rewritten."
        test_recipe:
