              as: EmployerAdmin
              as_user_id: "${emp_id}"
              captures: { loc_a_id: $.data.id }
          trigger:
            - call: "POST /employer-locations/${loc_a_id}/server-assignments"
              payload: { alcohol_server_id: "00000000-0000-4000-8000-000000000abc", role_title: "Bartender" }
              as: EmployerAdmin
              as_user_id: "${emp_id}"
            - call: "POST /employer-locations/00000000-0000-4000-8000-000000000fff/server-assignments"
