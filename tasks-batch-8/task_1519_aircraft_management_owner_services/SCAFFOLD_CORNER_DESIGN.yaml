              payload: { aircraft_id: "${a_id}", trip_use: OWNER_USE, depart_icao: "KTEB", arrive_icao: "KPBI", departure_at: "2026-08-02T20:00:00Z", block_hours_est: 4.0 }
              as: FlightOpsManager
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /assignments"
              payload: { trip_id: "${t_id}", crew_member_id: "${c1_id}", duty_role: PIC, duty_start_at: "2026-08-02T20:00:00Z", duty_end_at: "2026-08-03T00:00:00Z" }
