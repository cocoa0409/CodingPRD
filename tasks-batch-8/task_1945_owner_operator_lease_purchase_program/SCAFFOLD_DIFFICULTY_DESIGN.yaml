          trigger:
            - { call: "POST /lease-program/settlement-statements/${st}/dispute", payload: {}, as: Driver, as_user_id: "${op}" }
            - { call: "POST /lease-program/settlement-statements/${st}/reissue", payload: { maintenance_deduction_override_cents: 25000, reason: "shop credit" }, as: SettlementClerk, captures: { st_re_net: $.data.net_pay_cents } }
            - { call: "POST /lease-program/settlement-statements/${st}/finalize", payload: {}, as: SettlementClerk, captures: { st_fin_maint: $.data.maintenance_deduction_cents, st_fin_net: $.data.net_pay_cents } }
          assert:
            - "after dispute: SettlementStatement.${st}.status == DISPUTED"
            - "after reissue: SettlementStatement.${st}.status == ISSUED (loop back)"
            - "after reissue: SettlementStatement.${st}.maintenance_deduction_cents == 25000 (override applied)"
            - "captured st_re_net == 48000  (250000 - 70000 - 22000 - 25000 - 20000 - 65000)"
            - "captured st_fin_maint == 0  (final basis: no COMPLETED OPERATOR work orders in W1)"
            - "captured st_fin_net == 73000 (250000 - 70000 - 22000 - 0 - 20000 - 65000)"
            - "final status FINALIZED"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
