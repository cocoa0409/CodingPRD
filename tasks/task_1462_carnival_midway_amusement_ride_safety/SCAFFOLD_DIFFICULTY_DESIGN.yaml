            - { call: "POST /midway/daily-checklists/${chk_id}/submit", payload: { items_passed: 5 }, as: RideOperator, as_user_id: "${op_id}", captures: { chk_v: "$.data.version" } }
            - { call: "POST /midway/daily-checklists/${chk_id}/countersign", payload: { expected_checklist_version: "${chk_v}" }, as: FairManager, as_user_id: "${sup_id}" }
            - { call: "POST /midway/operating-days/${day_id}/open-gates", payload: {}, as: FairManager, as_user_id: "${sup_id}" }
            - { call: "POST /midway/ticket-products", payload: { fair_id: "${fair_id}", name: "Credits", kind: "CREDIT_BUNDLE", base_price_cents: 100 }, as: FairManager, as_user_id: "${sup_id}", captures: { prod_id: "$.data.id" } }
            - { call: "POST /midway/ticket-sales", payload: { product_id: "${prod_id}", operating_day_id: "${day_id}", quantity: 1, holder_height_in: 60 }, as: TicketClerk, as_user_id: "${clerk_id}", captures: { g1: "$.data.id" } }
            - { call: "POST /midway/ticket-sales", payload: { product_id: "${prod_id}", operating_day_id: "${day_id}", quantity: 1, holder_height_in: 60 }, as: TicketClerk, as_user_id: "${clerk_id}", captures: { g2: "$.data.id" } }
            - { call: "POST /midway/ticket-sales", payload: { product_id: "${prod_id}", operating_day_id: "${day_id}", quantity: 1, holder_height_in: 60 }, as: TicketClerk, as_user_id: "${clerk_id}", captures: { g3: "$.data.id" } }
            - { call: "POST /midway/ride-redemptions", payload: { wristband_id: "${g1}", ride_id: "${ride_id}" }, as: RideOperator, as_user_id: "${op_id}", captures: { q1: "$.data.id", q1_pos: "$.data.queue_position" } }
            - { call: "POST /midway/ride-redemptions", payload: { wristband_id: "${g2}", ride_id: "${ride_id}" }, as: RideOperator, as_user_id: "${op_id}", captures: { q2: "$.data.id" } }
            - { call: "POST /midway/ride-redemptions", payload: { wristband_id: "${g3}", ride_id: "${ride_id}" }, as: RideOperator, as_user_id: "${op_id}", captures: { q3: "$.data.id" } }
            - { call: "POST /midway/ride-cycles", payload: { ride_id: "${ride_id}", operating_day_id: "${day_id}" }, as: RideOperator, as_user_id: "${op_id}", captures: { cyc: "$.data.id" } }
          trigger:
            - { call: "POST /midway/ride-cycles/${cyc}/load", payload: {}, as: RideOperator, as_user_id: "${op_id}", captures: { rc_after_load: "$.data.rider_count" } }
            - { call: "POST /midway/ride-redemptions/${q1}/void", payload: {}, as: RideOperator, as_user_id: "${op_id}" }
            - { call: "POST /midway/ride-cycles/${cyc}/dispatch", payload: {}, as: RideOperator, as_user_id: "${op_id}" }
            - { call: "POST /midway/ride-cycles/${cyc}/complete", payload: {}, as: RideOperator, as_user_id: "${op_id}" }
          assert:
            - "after load: RideCycle.${cyc}.rider_count == 2 — q1 (position 1) and q2 (position 2) REDEEMED, q3 (position 3) still QUEUED behind the capacity-2 cap"
            - "after voiding q1 (cycle still LOADING): rider_count == 1 and q1.status == VOIDED"
            - "invariant holds throughout: rider_count == count of REDEEMED redemptions with ride_cycle_id == ${cyc}"
            - "dispatch with rider_count 1 succeeds (>= 1); complete leaves cycles_since_inspection == 1 (< 5, no suspension)"
            - "q1's wristband: credits_redeemed == 0 and credits_remaining == 1 after the void refund"
