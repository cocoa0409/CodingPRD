              as: AccountManager
              as_user_id: "u_am_1"
              captures: { camp_id: $.data.id, camp_v: $.data.version }
            - *c_prod
            - call: "POST /rmn/line-items"
              payload: { campaign_id: "${camp_id}", placement_slot_id: "${slot_id}", bid_cents: 200, bid_type: "CPC", flight_start_at: "2026-08-01T00:00:00Z", flight_end_at: "2026-08-11T00:00:00Z", daily_budget_cents: 100, category_code: "FOOTWEAR", keyword_match_terms: ["red", "shoes"], expected_campaign_version: "${camp_v}" }
