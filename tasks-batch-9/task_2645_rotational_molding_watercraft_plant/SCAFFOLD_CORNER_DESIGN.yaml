              as_user_id: "admin-1"
            - call: "GET /product-models?size_class=COMPACT"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "GET /product-models?hull_type=KAYAK&size_class=COMPACT"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "GET /product-models?hull_type=KAYAK&size_class=TANDEM"
              payload: {}
