              as: Underwriter
              captures: { ap_status: $.data.status, ap_prem: $.data.premium_cents }
            - call: "POST /endorsements/${end_peak}/decision"
              payload: { decision: "APPROVE", decision_note: "again" }
              as: SeniorUnderwriter
              captures: { e_twice: $.data.error_id }
          assert:
            - "the first decision sets Endorsement.${end_peak}.status APPROVED with premium_cents 132000 (round_half_up(12000000 * 0.0110)) and requires_inspection false, so no COMPLETED inspection was needed"
            - "FarmPolicy.${pol_id} shows endorsement_premium_cents 132000, base_premium_cents 276000, total_premium_cents 401200 and cat_load_cents still 125200 — the catastrophe load is never re-derived on an endorsement"
            - "the ledger holds 3 rows: 144000, 125200 and ENDORSEMENT_ADD 132000 with reason_code ENDORSEMENT_APPROVAL at sequence_no 3, summing to 401200"
            - "the second decision returns HTTP 409 ERR_ENDORSEMENT_NOT_REQUESTED"
            - "after the rejection there is still exactly one ENDORSEMENT_ADD row, total_premium_cents is still 401200 and Endorsement.${end_peak}.version == 2"

      - name: corner_endorsement_reject_then_rescind_refused
        claim_type: valid_transition
        grounds: ["state_machines.Endorsement[REQUESTED->REJECTED]", "state_machines.Endorsement.terminal_states", "errors.ERR_ENDORSEMENT_NOT_APPROVED"]
        distinguishing_aspect: "REJECT is a terminal leaf that touches no money: premium_cents stays 0, no ledger row appears, FarmPolicy.version does not move, and the rescind route then refuses the row with ERR_ENDORSEMENT_NOT_APPROVED (409)."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, the ZN-1 pool trio, one policy rated to 269200, one REQUESTED PEAK_SEASON_INCREASE endorsement"
          setup_api_calls:
