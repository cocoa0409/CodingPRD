        grounds:
          - calculations.retroactive_unauthorized_billing
          - calculations.retroactive_unauthorized_billing.constants.UNAUTHORIZED_RATE_CENTS_PER_LOAD_UNIT
          - calculations.retroactive_unauthorized_billing.constants.UNAUTHORIZED_PENALTY_MULTIPLIER
        distinguishing_aspect: |
          An installation dated 2026-03-20 found by a 2026-08-01 audit spans 5 month boundaries but
          only 4 whole months (audit day 1 < install day 20), so months_billable is 4 and the charge
          is 4 * round(25*40) * 1.5 = 6000 cents — billing 5 months (7500) would over-charge the
          partial month.
