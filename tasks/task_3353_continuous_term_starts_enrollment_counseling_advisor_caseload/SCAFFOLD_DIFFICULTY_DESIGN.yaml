            - "second IN_REVIEW -> COMPLETED recomputes: capped_credits == 90 (cap floor(120*3/4)), remaining_credits == 24"
            - "after enrollment REGISTERED, COMPLETED -> IN_REVIEW -> ERR_INVALID_STATE"

      - name: enrollment_defer_cycle_gated_by_financial_hold
        grounds:
          - state_machines.Enrollment.DEFERRED_to_REGISTERED
          - state_machines.Enrollment.REGISTERED_to_DEFERRED
          - entities.Enrollment.fields.financial_hold
        distinguishing_aspect: |
          Non-linear on Enrollment (different entity than TCE): REGISTERED ->
          DEFERRED -> REGISTERED is a cycle, and the return edge is gated by the
          derived financial_hold dimension — with a PACKAGED package past census
          the loop-back is rejected ERR_FINANCIAL_HOLD, so the parallel
          status x financial_hold dimensions interact.
        test_recipe:
          setup:
            - "Enrolled E (REGISTERED) in term T (ENROLLMENT_OPEN); package PACKAGED with efc 0; clock moved past census_date so financial_hold == true"
          setup_api_calls:
            - call: "POST /api/programs"
