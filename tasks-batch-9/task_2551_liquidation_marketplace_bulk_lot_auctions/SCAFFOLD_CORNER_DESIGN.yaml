  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_expected_listing_version_rejects_the_proxy_bid_then_the_fresh_version_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.proxy-bid-supersede-stale-listing
          - errors[ERR_STALE_LISTING_VERSION]
          - validations[priority 8 -> ERR_STALE_LISTING_VERSION]
          - calculations.proxy_bid_resolution
        distinguishing_aspect: >
          The version the buyer read is invalidated by another buyer's live bid, so the proxy
          submission is refused with ERR_STALE_LISTING_VERSION (412) and creates no Bid row; the
          identical body replayed against the re-read version succeeds. The 412 also proves
          priority 8 runs ahead of the amount and credit checks - the stale request would have
          been perfectly fundable.
        test_recipe:
          setup:
            - "A 200-unit lot (declared retail 2000000) has an OPEN AUCTION listing with opening_bid_cents 1000000, bid_increment_cents 100000 and reserve_price_cents 1000000 over [2026-08-05T00:00:00Z, 2026-08-20T00:00:00Z)."
