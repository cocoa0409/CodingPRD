      - name: edit_results_batch_omitting_an_item_is_rejected_then_splits_item_outcomes
        claim_type: Bulk action
        grounds:
          - endpoints[POST /cancer-registry/submissions/{submissionId}/edit-results]
          - validations[priority 16 item_results batch membership]
          - calculations.submission_assessment
        distinguishing_aspect: |
          edit-results is all-or-nothing on COVERAGE but per-item on OUTCOME: a batch that names only
          one of two items is refused outright (no partial application), while a complete batch may
          accept one item and fail the other, driving the submission to EDITS_RETURNED with
          accepted_item_count 1 / failed_item_count 1 and a zero assessment (no late case, transmitted
          before the deadline).
        test_recipe:
          setup:
            - "One program, an author abstractor and a QA reviewer, two COMPLETED cases, one DRAFT submission for 2026-07-01..2026-07-31 carrying both cases, transmitted at the default clock."
