          setup:
            - "Clock 2026-09-01T00:00:00.000Z; GROUP_1 (requires 4000); journeyworkers Bea Nowak (9000 h) then Cal Rendon (8000 h) registered, so Bea holds position 1 and Cal position 2; Cal's registration is then removed VOLUNTARY."
