      - name: deliverability_partition_conserved_under_both_dedupe_modes
        grounds:
          - calculations.deliverability_partition_report
          - calculations.dedupe_screen
          - entities.MailingList.fields.mailable_count
          - entities.MailingList.fields.record_count
        distinguishing_aspect: |
          A third conserved quantity, PIECE COUNTS: automation + retail + unmailable + duplicate
          equals record_count (8) both after a HOUSEHOLD pass (5 + 1 + 1 + 1) and after an EXACT
          re-pass (6 + 1 + 1 + 0), so re-screening moves pieces between buckets without creating or
          destroying any.
        test_recipe:
          setup:
            - "An eight-record list: the Smith household pair, four further DPV 'Y' records, one DPV 'D' record and one DPV 'N' record."
            - "The list has been CASS-run."
