    roles: [MSHAAdmin]
    code: 201
    input: [period_start, period_end]
    output: InspectionCycle
    side_effects:
      - "cycle_index = 1 + count of existing cycles of the mine; status=OPEN; required_inspections = 1 (or 2 if mine.pov_status == POV_FINAL at creation)"
  - method: GET
    path: "/msha/inspection-cycles/{cycleId}"
    description: "Get an inspection cycle"
