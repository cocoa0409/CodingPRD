              as: ItemSpecialist
              as_user_id: "isp-author"
              captures: { item_id: "$.data.id" }
            - call: "POST /items/${item_id}/submit-for-review"
              payload: {"revision_note": "ready"}
              as: ItemSpecialist
              as_user_id: "isp-author"
            - call: "POST /items/${item_id}/review"
              payload: {"decision": "APPROVE"}
              as: ItemSpecialist
              as_user_id: "isp-rev-1"
            - call: "POST /items/${item_id}/review"
              payload: {"decision": "APPROVE"}
              as: ItemSpecialist
              as_user_id: "isp-rev-2"
            - call: "POST /items/${item_id}/response-batches"
              payload: {"is_pretest": true, "response_count": 40, "correct_count": 24, "upper_n": 10, "upper_correct": 9, "lower_n": 10, "lower_correct": 3}
              as: Psychometrician
              as_user_id: "psy-1"
            - call: "POST /forms"
              payload: {"program_id": "${prog_id}", "form_code": "CPX-F1", "item_ids": ["${item_id}"], "panelist_user_ids": ["psy-1"], "panel_method": "MODIFIED_ANGOFF"}
              as: Psychometrician
              as_user_id: "psy-1"
              captures: { form_id: "$.data.id" }
            - call: "POST /forms/${form_id}/panel-ratings"
              payload: {"panelist_user_id": "psy-1", "mean_expected_pass_rate": 0.6}
              as: Psychometrician
              as_user_id: "psy-1"
              captures: { form_v: "$.data.version" }
          trigger:
            - call: "POST /forms/${form_id}/adopt-cut-score"
              payload: {"expected_form_version": "${form_v}", "adoption_note": "self adoption attempt"}
              as: Psychometrician
              as_user_id: "psy-1"
              captures: { err_sod: "$.data.error_id" }
            - call: "POST /forms/${form_id}/adopt-cut-score"
              payload: {"expected_form_version": "${form_v}", "adoption_note": "independent adoption"}
              as: Psychometrician
              as_user_id: "psy-2"
          assert:
            - "trigger[0] responds 409 with ${err_sod} == ERR_SEGREGATION_OF_DUTIES because psy-1 appears in ExamForm.${form_id}.panelist_user_ids"
            - "after trigger[0] ExamForm.${form_id}.status stays ASSEMBLED, panel_status stays RATINGS_COMPLETE, raw_cut_score stays null and version == ${form_v}"
            - "trigger[1] responds 200 with ExamForm.${form_id}.status == CUT_SCORE_SET and panel_status == ADOPTED"
            - "ExamForm.${form_id}.mean_expected_pass_rate == 0.600000 and raw_cut_score == 0 (raw 1 clamped down to ceil_cut floor(0.90 * 1) == 0)"
            - "ExamForm.${form_id}.version == ${form_v} + 1 — only the accepted adoption bumped the form"
            - "trigger[1] is not refused ERR_PANEL_QUORUM_NOT_MET: one rating meets min_panelists 1 and 1 - 2*0 >= 1 survives trimming"
