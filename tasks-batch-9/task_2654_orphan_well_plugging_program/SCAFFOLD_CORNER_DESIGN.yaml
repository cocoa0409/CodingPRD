      - name: decision_on_a_draft_determination_is_rejected_as_invalid_transition
        claim_type: Invalid Transitions
        grounds:
          - state_machines.OrphanDetermination.transitions
          - validations[priority 40]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: |
          DRAFT has exactly two edges out (submit -> SUBMITTED and the supersede cascade), so a
          reviewer CONFIRM on a DRAFT determination is not an edge and returns
          ERR_INVALID_STATE_TRANSITION 409 - the well stays INACTIVE and no snapshot is written.
        test_recipe:
          setup:
            - "one DRAFT OrphanDetermination on a well whose status is INACTIVE; logical clock at its default"
          setup_api_calls:
            - call: "POST /operators"
              payload: { name: "Cottonwood Energy LLC", region_code: "WY", financial_assurance_tier: "INDIVIDUAL", bond_amount_cents: 5000000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { op_id: $.data.id }
