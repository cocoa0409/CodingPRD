            - call: "POST /legal-ops/matters/${m_id}/activate"
              payload: {}
              as: LegalOpsAnalyst
            - call: "POST /legal-ops/invoices"
              payload: { matter_id: "${m_id}", firm_id: "${firm_id}", fiscal_period_id: "${fp_id}", invoice_number: "I-1", amount_cents: 200000 }
              as: LegalOpsAnalyst
              as_user_id: "analyst-1"
              captures: { inv_id: $.data.id }
            - call: "POST /legal-ops/firms/${firm_id}/suspend"
              payload: {}
              as: LegalOpsManager
          trigger:
            - call: "POST /legal-ops/invoices/${inv_id}/approve"
