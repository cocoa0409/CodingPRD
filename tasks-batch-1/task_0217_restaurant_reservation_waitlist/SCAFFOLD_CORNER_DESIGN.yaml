          assert:
            - "HTTP 401; error_id == ERR_UNAUTHENTICATED"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_reservation_create_stale_table_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[reservation-create-stale-table]", entities.Table.fields.version, "errors[ERR_STALE_TABLE_VERSION]"]
        distinguishing_aspect: "CREATE-with-supersede on a freed slot: a first booking advances Table.version 1→2; a second create still carrying expected_table_version 1 is rejected with ERR_STALE_TABLE_VERSION (412)."
        test_recipe:
          setup: ["a table at version 1 with one reservation already created (version now 2)"]
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "Roc", timezone: "UTC", default_turn_time_minutes: 90, cleanup_buffer_minutes: 15 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /dining-areas"
              payload: { restaurant_id: "${rid}", name: "MAIN", kind: "STANDARD" }
              as: Manager
              captures: { area: $.data.id }
            - call: "POST /tables"
              payload: { dining_area_id: "${area}", label: "T1", min_party_size: 1, max_party_size: 8 }
              as: Manager
              captures: { tbl: $.data.id, tbl_v0: $.data.version }
            - call: "POST /service-periods"
              payload: { restaurant_id: "${rid}", name: "DINNER", start_local_time: "17:00", end_local_time: "23:00", slot_interval_minutes: 30, pacing_max_covers_per_slot: 30 }
              as: Manager
            - call: "POST /customers"
              payload: { full_name: "Oc", phone: "+15552220031" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: Manager
            - call: "POST /reservations"
              payload: { restaurant_id: "${rid}", customer_id: "${cust}", table_id: "${tbl}", expected_table_version: "${tbl_v0}", party_size: 2, reservation_start: "2026-06-15T20:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { res1: $.data.id }
          trigger:
            - call: "POST /reservations"
              payload: { restaurant_id: "${rid}", customer_id: "${cust}", table_id: "${tbl}", expected_table_version: "${tbl_v0}", party_size: 2, reservation_start: "2026-06-15T21:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412; error_id == ERR_STALE_TABLE_VERSION"

      - name: occ_private_dining_confirm_stale_area_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[private-dining-confirm-stale-area]", entities.DiningArea.fields.version, "errors[ERR_STALE_AREA_VERSION]"]
        distinguishing_aspect: "Buyout OCC on a different parent (DiningArea): a first confirm advances DiningArea.version 1→2; a second PROPOSED buyout confirmed with stale expected_dining_area_version 1 is rejected with ERR_STALE_AREA_VERSION (412)."
        test_recipe:
          setup: ["a PRIVATE area at version 1; two PROPOSED buyouts; the first confirmed (area version now 2)"]
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "Roca", timezone: "UTC" }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /dining-areas"
              payload: { restaurant_id: "${rid}", name: "PRIVATE_ROOM", kind: "PRIVATE" }
              as: Manager
              captures: { area: $.data.id, area_v0: $.data.version }
            - call: "POST /customers"
              payload: { full_name: "Oca", phone: "+15552220032" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /private-dining-events"
              payload: { restaurant_id: "${rid}", dining_area_id: "${area}", customer_id: "${cust}", party_size: 12, event_start: "2026-07-01T18:00:00Z", event_end: "2026-07-01T22:00:00Z", food_minimum_cents: 200000, deposit_pct: 0.25 }
              as: Manager
              captures: { pde1: $.data.id }
            - call: "POST /private-dining-events/${pde1}/propose"
              payload: {}
              as: Manager
            - call: "POST /private-dining-events"
              payload: { restaurant_id: "${rid}", dining_area_id: "${area}", customer_id: "${cust}", party_size: 10, event_start: "2026-07-02T18:00:00Z", event_end: "2026-07-02T22:00:00Z", food_minimum_cents: 150000, deposit_pct: 0.25 }
              as: Manager
              captures: { pde2: $.data.id }
            - call: "POST /private-dining-events/${pde2}/propose"
              payload: {}
              as: Manager
            - call: "POST /private-dining-events/${pde1}/confirm"
              payload: { expected_dining_area_version: "${area_v0}" }
              as: Manager
          trigger:
            - call: "POST /private-dining-events/${pde2}/confirm"
              payload: { expected_dining_area_version: "${area_v0}" }
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412; error_id == ERR_STALE_AREA_VERSION"

      - name: buyout_confirm_cascades_cancel_intersecting_reservations
        claim_type: cascading_side_effects
        grounds: [state_machines.PrivateDiningEvent.PROPOSED_to_CONFIRMED, entities.DiningArea.fields.status, entities.DepositHold.fields.status]
        distinguishing_aspect: "Confirming a buyout over [18:00,22:00] cancels a CONFIRMED reservation at 19:00 on a table in that area and releases its HELD deposit; the area becomes BOUGHT_OUT."
        test_recipe:
          setup: ["a PRIVATE area with a table; a party-6 CONFIRMED reservation at 19:00 with a HELD deposit; a PROPOSED buyout over [18:00,22:00]"]
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "Rcas", timezone: "UTC", per_seat_deposit_cents: 2500, deposit_required_party_threshold: 6, default_turn_time_minutes: 90, cleanup_buffer_minutes: 15 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /dining-areas"
              payload: { restaurant_id: "${rid}", name: "PRIVATE_ROOM", kind: "PRIVATE" }
              as: Manager
              captures: { area: $.data.id, area_v0: $.data.version }
            - call: "POST /tables"
              payload: { dining_area_id: "${area}", label: "P1", min_party_size: 1, max_party_size: 8 }
              as: Manager
              captures: { tbl: $.data.id, tbl_v0: $.data.version }
            - call: "POST /service-periods"
              payload: { restaurant_id: "${rid}", name: "DINNER", start_local_time: "17:00", end_local_time: "23:00", slot_interval_minutes: 30, pacing_max_covers_per_slot: 30 }
              as: Manager
            - call: "POST /customers"
              payload: { full_name: "Ca", phone: "+15552220033" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: Manager
            - call: "POST /reservations"
              payload: { restaurant_id: "${rid}", customer_id: "${cust}", table_id: "${tbl}", expected_table_version: "${tbl_v0}", party_size: 6, reservation_start: "2026-06-15T19:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { res: $.data.id }
            - call: "POST /reservations/${res}/deposit-holds"
              payload: { card_last4: "4242" }
              as: Customer
              as_user_id: "${cust}"
              captures: { hold: $.data.id }
            - call: "POST /reservations/${res}/confirm"
              payload: {}
              as: Host
            - call: "POST /private-dining-events"
              payload: { restaurant_id: "${rid}", dining_area_id: "${area}", customer_id: "${cust}", party_size: 8, event_start: "2026-06-15T18:00:00Z", event_end: "2026-06-15T22:00:00Z", food_minimum_cents: 200000, deposit_pct: 0.25 }
              as: Manager
              captures: { pde: $.data.id }
            - call: "POST /private-dining-events/${pde}/propose"
              payload: {}
              as: Manager
          trigger:
            - call: "POST /private-dining-events/${pde}/confirm"
              payload: { expected_dining_area_version: "${area_v0}" }
              as: Manager
          assert:
            - "PrivateDiningEvent.${pde}.status == CONFIRMED; DiningArea.${area}.status == BOUGHT_OUT"
            - "Reservation.${res}.status == CANCELLED; DepositHold.${hold}.status == RELEASED"

      - name: version_increments_on_every_table_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.Table.fields.version]
        distinguishing_aspect: "Table.version starts at 1 and increments by 1 on each mutation: create → 1, out-of-service → 2, return-to-service → 3."
        test_recipe:
          setup: ["one AVAILABLE table at version 1"]
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "Rver", timezone: "UTC" }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /dining-areas"
              payload: { restaurant_id: "${rid}", name: "MAIN", kind: "STANDARD" }
              as: Manager
              captures: { area: $.data.id }
            - call: "POST /tables"
              payload: { dining_area_id: "${area}", label: "T1", min_party_size: 1, max_party_size: 8 }
              as: Manager
              captures: { tbl: $.data.id }
            - call: "POST /tables/${tbl}/out-of-service"
              payload: {}
              as: Manager
          trigger:
            - call: "POST /tables/${tbl}/return-to-service"
              payload: {}
              as: Manager
          assert:
            - "Table.${tbl}.version == 3 and Table.${tbl}.status == AVAILABLE"

