            - { call: "POST /eqip/programs/${prog}/ranking-criteria", payload: { criterion_code: "SOIL_HEALTH", weight: 1.0, max_points: 40 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/ranking-criteria", payload: { criterion_code: "WATER_QUALITY", weight: 1.0, max_points: 40 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/ranking-criteria", payload: { criterion_code: "WILDLIFE", weight: 0.5, max_points: 20 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/open", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/applicants", payload: { legal_name: "X", hu_category: "NONE", parcel_ids: ["P-600"] }, as: ProgramAdmin, captures: { ax: $.data.id } }
            - { call: "POST /eqip/applicants", payload: { legal_name: "Y", hu_category: "NONE", parcel_ids: ["P-601"] }, as: ProgramAdmin, captures: { ay: $.data.id } }
            - { call: "POST /eqip/applications", payload: { program_id: "${prog}", applicant_id: "${ax}", parcel_id: "P-600", planned_practices: [ { practice_code: "FENCE", quantity: 1000 } ], self_reported_answers: { SOIL_HEALTH: 30, WATER_QUALITY: 10, WILDLIFE: 10 } }, as: Applicant, as_user_id: "${ax}", captures: { appx: $.data.id } }
            - { call: "POST /eqip/applications", payload: { program_id: "${prog}", applicant_id: "${ay}", parcel_id: "P-601", planned_practices: [ { practice_code: "WATERING_FACILITY", quantity: 1 } ], self_reported_answers: { SOIL_HEALTH: 30, WATER_QUALITY: 10, WILDLIFE: 10 } }, as: Applicant, as_user_id: "${ay}", captures: { appy: $.data.id } }
            - { call: "POST /eqip/applications/${appx}/submit", payload: {}, as: Applicant, as_user_id: "${ax}" }
            - { call: "POST /eqip/applications/${appy}/submit", payload: {}, as: Applicant, as_user_id: "${ay}" }
            - { call: "POST /eqip/applications/${appx}/screen", payload: { decision: "SCREENED_IN", verified_answers: { SOIL_HEALTH: 30, WATER_QUALITY: 10, WILDLIFE: 10 } }, as: ConservationPlanner, captures: { sx: $.data.ranking_score, ex: $.data.estimated_obligation_cents } }
