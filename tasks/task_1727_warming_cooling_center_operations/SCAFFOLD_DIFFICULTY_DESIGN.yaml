      - name: heat_index_exactly_at_threshold_and_exactly_sustained_qualifies
        grounds:
          - calculations.breach_run_evaluation
        distinguishing_aspect: |
          Boundary on the temperature/duration metric via POST evaluate: heat_index exactly ==
          threshold (100.0, inclusive >=) counts as a breach, and a run of exactly
          sustained_hours_required*60 == 60 minutes qualifies; 99.9 does not breach and a
          45-minute run does not qualify — both failing edges shown on a control episode.
        test_recipe:
          setup:
            - "ep1: COOLING threshold 100.0 sustained 1h with readings 100.0 exactly at 06:00 through 07:00 (run exactly 60)"
            - "ep2: identical policy but first reading 99.9 (no breach) then breaches 06:15-07:00 (run only 45)"
          setup_api_calls:
            - call: "POST /api/episodes"
              payload: { mode: "COOLING", threshold_f: 100.0, sustained_hours_required: 1, scheduled_end_at: "2026-08-12T00:00:00Z" }
              as: EOCManager
              captures: { ep1: $.data.id }
