  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_stale_version_on_enrollment_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[enrollment-create-stale-member]
        distinguishing_aspect: "POST /members/{id}/enrollments with expected_member_version that is stale (member version advanced by another enrollment creation) returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Member M with version 1; one enrollment created (version becomes 2)."]
          setup_api_calls:
            - call: "POST /care-programs"
              payload: { program_code: "LMRK-TX", display_name: "Landmark TX", service_geography_zips: ["75201"] }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
