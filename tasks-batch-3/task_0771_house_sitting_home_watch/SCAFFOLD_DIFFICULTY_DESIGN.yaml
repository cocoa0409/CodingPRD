              as: Coordinator
            - call: "POST /home-watch/bookings"
              payload: { property_id: "${prop_id}", booking_type: "RECURRING", frequency: "DAILY", start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-02T00:00:00Z", base_visit_rate_cents: 4000 }
              as: Coordinator
              captures: { bk_id: $.data.id }
            - call: "POST /home-watch/bookings/${bk_id}/submit"
              payload: {}
              as: Coordinator
            - call: "POST /home-watch/bookings/${bk_id}/assign"
              payload: { sitter_id: "${st_id}" }
