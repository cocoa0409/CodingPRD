              payload: { name: "Seq P2", trade_code: "033000", bid_due_at: "2026-08-11T14:00:00Z" }
              as: LeadEstimator
              captures: { pkg2: $.data.id }
            - call: "POST /invitations"
              payload: { bid_package_id: "${pkg1}", subcontractor_id: "${sub_s}" }
              as: LeadEstimator
            - call: "POST /invitations"
              payload: { bid_package_id: "${pkg2}", subcontractor_id: "${sub_s}" }
              as: LeadEstimator
            - call: "POST /bid-packages/${pkg1}/publish"
              as: LeadEstimator
            - call: "POST /bid-packages/${pkg2}/publish"
              as: LeadEstimator
          trigger:
            - call: "POST /addendums"
              payload: { bid_package_id: "${pkg1}", summary: "P1 Addendum 1" }
              as: LeadEstimator
              captures: { a1: $.data.id }
            - call: "POST /addendums"
              payload: { bid_package_id: "${pkg1}", summary: "P1 Addendum 2" }
              as: LeadEstimator
              captures: { a2: $.data.id }
            - call: "POST /addendums"
              payload: { bid_package_id: "${pkg2}", summary: "P2 Addendum 1" }
              as: LeadEstimator
              captures: { a3: $.data.id }
          assert:
            - "Addendum.${a1}.number == 1 and Addendum.${a2}.number == 2 (per-package sequence)"
            - "Addendum.${a3}.number == 1 (P2 has its own sequence)"
            - "BidPackage.${pkg1}.issued_addendum_count == 2; BidPackage.${pkg2}.issued_addendum_count == 1"

