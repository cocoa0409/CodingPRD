  # ===========================================================================
  # 8. CROSS-CUTTING COMPLEXITY LAYERS
  # complexity_layers: optimistic_concurrency, cascading_side_effects,
  # dual_variant_calculation, derived_field_reconciliation. Each declared layer
  # gets its own claim_type; the two §1.2.1 concurrency rules get one OCC
  # instance each, keyed to their own write_endpoint and occ_field.
  # ===========================================================================
  - section: complexity_layers
    instances:
      - name: a_stale_expected_allocation_cycle_version_is_refused_and_a_refreshed_one_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[allocation-line-create-stale-cycle]
          - errors[ERR_STALE_ALLOCATION_CYCLE_VERSION]
          - validations[priority=30]
        distinguishing_aspect: "The OCC token is the PARENT cycle's version, not the line's, so cutting one line invalidates the client's view for the next one even though nothing about the second line is wrong. Re-reading the cycle and resubmitting the identical body then works — which is exactly what distinguishes a stale-view rejection from a business-rule rejection."
        test_recipe:
          setup:
            - "Certified SKU PL-A (bag_sqft 88.0) with lot L1 of 120 bags == 10560.00 sqft AVAILABLE."
            - "Two SUBMITTED distributor orders of 4400.00 sqft each and one OPEN CONTRACT_FIRST cycle over [2026-08-01, 2026-08-31]; the cycle's version is captured BEFORE any line is cut."
