      - name: unauthenticated_request_for_a_missing_route_returns_401_and_not_404
        claim_type: Priority Ordering
        grounds:
          - validations[priority=1]
          - validations[priority=4]
        distinguishing_aspect: "The same GET violates the authentication rule at priority 1 and the path-existence rule at priority 4; priority 1 wins, so a blank X-User-Role against a non-existent id yields ERR_UNAUTHENTICATED (401), never ERR_ROUTE_NOT_FOUND."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "no Route with id 00000000-0000-4000-8000-000000000000 exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
          trigger:
            - call: "GET /routes/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ""
              as_user_id: "eng-alice"
              captures: { err: $.data.error_id }
            - call: "GET /routes/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RouteEngineer
              as_user_id: "eng-alice"
              captures: { err2: $.data.error_id }
          assert:
            - "the first trigger sends X-User-Role as the empty string \"\" (not whitespace) and returns ${err} == ERR_UNAUTHENTICATED with HTTP 401"
            - "the second trigger, identical but properly authenticated, returns ${err2} == ERR_ROUTE_NOT_FOUND with HTTP 404"
            - "the 401 body carries error_id and message inside the standard envelope, with meta.api_request_id present"

      - name: unauthorized_role_with_a_malformed_body_returns_403_and_not_400
        claim_type: Priority Ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - roles.NetworkRecordsAdmin.exclusive_operations
        distinguishing_aspect: "A RouteEngineer posting a MoratoriumWindow with ordinance_reference missing and an unknown field present breaks priority 2 and priority 3 at once; the 403 is returned and nothing is written."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "POST /moratorium-windows is exclusive to NetworkRecordsAdmin"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
          trigger:
            - call: "POST /moratorium-windows"
              payload: { municipality_code: "MUN-014", street_name: "Slate Road", resurfaced_on: "2026-08-30", starts_on: "2026-09-01", ends_on: "2026-10-31", moratorium_class: "FULL_RESTORATION", surprise_field: "unexpected" }
              as: RouteEngineer
              as_user_id: "eng-alice"
              captures: { err: $.data.error_id }
            - call: "POST /moratorium-windows"
              payload: { municipality_code: "MUN-014", street_name: "Slate Road", resurfaced_on: "2026-08-30", starts_on: "2026-09-01", ends_on: "2026-10-31", moratorium_class: "FULL_RESTORATION", surprise_field: "unexpected" }
              as: NetworkRecordsAdmin
              captures: { err2: $.data.error_id }
          assert:
            - "${err} == ERR_UNAUTHORIZED with HTTP 403, even though the body is also missing required ordinance_reference and carries an unknown key"
            - "${err2} == ERR_INVALID_REQUEST with HTTP 400 for the same body sent by the authorized role, which is what proves the ordering rather than a shape-blind handler"
            - "GET /moratorium-windows returns 0 rows after both triggers"

      - name: make_ready_and_budget_gates_both_violated
        claim_type: Priority conflict
        grounds:
          - validations[priority=14]
          - validations[priority=26]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / make_ready_safety_gate_precedes_budget_gate
          rationale: "The named §1.8 instance already violates both gates on one call and asserts that the safety error wins, then relieves each in turn."

      - name: permit_state_and_moratorium_gates_both_violated
        claim_type: Priority conflict
        grounds:
          - validations[priority=11]
          - validations[priority=15]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / permit_state_gate_precedes_moratorium_conflict_gate
          rationale: "The named §1.8 instance drives a permit into a state where both the state gate and the moratorium-conflict gate would fire and pins the state error."

