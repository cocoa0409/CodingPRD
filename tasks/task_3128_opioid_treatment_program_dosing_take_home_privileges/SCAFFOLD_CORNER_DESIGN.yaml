          trigger:
            - call: "POST /otp/inventory-transactions"
              payload: { lot_id: "${lot_id}", transaction_type: "RECEIPT", quantity_mg: 100.0 }
              as: ProgramAdministrator
              as_user_id: "operator-77"
              captures: { tx_receipt: $.data.id }
            - call: "POST /otp/inventory-transactions"
              payload: { lot_id: "${lot_id}", transaction_type: "DESTRUCTION", quantity_mg: -10.0, witness_staff_id: "operator-77" }
              as: ProgramAdministrator
              as_user_id: "operator-77"
              captures: { err_witness: $.data.error_id }
            - call: "POST /otp/inventory-transactions"
              payload: { lot_id: "${lot_id}", transaction_type: "DESTRUCTION", quantity_mg: -10.0, witness_staff_id: "staff-witness-77" }
              as: ProgramAdministrator
              as_user_id: "operator-77"
              captures: { tx_destroy: $.data.id }
          assert:
            - "the RECEIPT row is created with status RECORDED and no witness required"
            - "the first DESTRUCTION attempt returns 422 and err_witness == ERR_WITNESS_REQUIRED"
            - "the second DESTRUCTION attempt succeeds and InventoryTransaction.${tx_destroy}.witness_staff_id == \"staff-witness-77\""
            - "GET /otp/inventory-transactions?lot_id=${lot_id} returns exactly 2 rows"
            - "InventoryLot.${lot_id}.running_on_hand_mg == 590.0"

      - name: reissue_of_a_non_revoked_privilege_is_rejected
        claim_type: cross_reference_link
        grounds:
          - endpoints.POST_/otp/take-home-privileges
          - errors[ERR_REISSUE_SOURCE_NOT_REVOKED]
          - state_machines.TakeHomePrivilege.REVOKED_to_PENDING_REVIEW
        distinguishing_aspect: "The reissue link is only legal against a revoked source: reissued_from_privilege_id naming an APPROVED privilege is rejected at 409, and naming a nonexistent id is rejected at 404 instead."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, advanced to 2026-12-15. One CA program with quota 10 and a MedicalDirector, plus one ACTIVE patient whose privilege has been evaluated to APPROVED."
          setup_api_calls:
            - *c_clock
            - *c_prog
            - call: "POST /otp/programs/${prog_id}/carry-quota"
              payload: { allotted_carries: 10 }
              as: ProgramAdministrator
            - *c_phys
            - call: "POST /otp/users"
              payload: { program_id: "${prog_id}", full_name: "Miles Director", staff_role: "MEDICAL_DIRECTOR", license_number: "MD-2001" }
              as: ProgramAdministrator
              captures: { md_id: $.data.id }
            - call: "POST /otp/patients"
              payload: { program_id: "${prog_id}", full_name: "Dana Patient", date_of_birth: "1985-04-02", government_id_hash: "sha256:9f2c41aa", diagnosis_code: "F11_20", home_state_code: "CA", home_address: "12 River Rd", transportation_type: "PRIVATE_VEHICLE", one_way_travel_minutes: 15 }
              as: Physician
              as_user_id: "${phys_id}"
              captures: { pat_id: $.data.id }
            - call: "POST /otp/patients/${pat_id}/confirm-diagnosis"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
            - call: "POST /otp/dose-orders"
              payload: { patient_id: "${pat_id}", medication: "METHADONE", ordered_daily_mg: 90.0, split_dose_authorized: false }
              as: Physician
              as_user_id: "${phys_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /otp/dose-orders/${ord_id}/activate"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
            - call: "POST /otp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "PATCH /otp/patients/${pat_id}/treatment-phase"
              payload: { treatment_phase: "MAINTENANCE", reconciled_days: 1 }
              as: Physician
              as_user_id: "${phys_id}"
              captures: { pat_v1: $.data.version }
            - call: "POST /otp/take-home-privileges"
              payload: { patient_id: "${pat_id}", requested_carries: 1, carry_interval_days: 7, expected_patient_version: "${pat_v1}" }
              as: MedicalDirector
              as_user_id: "${md_id}"
              captures: { priv_id: $.data.id }
            - call: "POST /otp/take-home-privileges/${priv_id}/evaluate"
              payload: {}
              as: MedicalDirector
              as_user_id: "${md_id}"
            - call: "GET /otp/patients/${pat_id}"
              payload: {}
              as: MedicalDirector
              as_user_id: "${md_id}"
              captures: { pat_v2: $.data.version }
          trigger:
            - call: "POST /otp/take-home-privileges"
              payload: { patient_id: "${pat_id}", requested_carries: 1, carry_interval_days: 7, expected_patient_version: "${pat_v2}", reissued_from_privilege_id: "${priv_id}" }
              as: MedicalDirector
              as_user_id: "${md_id}"
              captures: { err_not_revoked: $.data.error_id }
            - call: "POST /otp/take-home-privileges"
              payload: { patient_id: "${pat_id}", requested_carries: 1, carry_interval_days: 7, expected_patient_version: "${pat_v2}", reissued_from_privilege_id: "00000000-0000-4000-8000-0000000000ff" }
              as: MedicalDirector
              as_user_id: "${md_id}"
              captures: { err_missing_src: $.data.error_id }
          assert:
            - "TakeHomePrivilege.${priv_id}.decision == APPROVED from the setup evaluate"
            - "the first reissue returns 409 and err_not_revoked == ERR_REISSUE_SOURCE_NOT_REVOKED"
            - "the second reissue returns 404 and err_missing_src == ERR_PRIVILEGE_NOT_FOUND"
            - "err_not_revoked != err_missing_src, so the referential check and the state check are distinct"
            - "GET /otp/take-home-privileges?patient_id=${pat_id} returns exactly 1 row"

  # ===========================================================================
  - section: errors
    instances:

      - name: err_dose_mass_mismatch_on_a_partial_dispense
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DOSE_MASS_MISMATCH]
          - validations[priority=15]
          - endpoints.POST_/otp/dose-dispenses/{doseId}/dispense
        distinguishing_aspect: "The mass-balance rule is an exact equality: a dispense adding up to 89.5 mg against a 90.0 mg order is rejected at 422 ERR_DOSE_MASS_MISMATCH, and the same call totalling exactly 90.0 mg is accepted with no inventory movement on the failed attempt."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One CA program with a lot, a Physician, a Nurse and one ACTIVE patient on a 90 mg order with one dose at NURSE_VERIFIED."
          setup_api_calls:
            - *c_clock
            - *c_prog
            - call: "POST /otp/inventory-lots"
              payload: { program_id: "${prog_id}", medication: "METHADONE", lot_number: "LOT-A1", expiration_date: "2027-06-30", quantity_received_mg: 50000.0, dose_potency_mg_per_unit: 1.0, reusable_for_take_home: true }
              as: ProgramAdministrator
              captures: { lot_id: $.data.id }
            - *c_phys
            - call: "POST /otp/users"
              payload: { program_id: "${prog_id}", full_name: "Nora Nurse", staff_role: "NURSE", license_number: "RN-1001" }
              as: ProgramAdministrator
              captures: { nurse_id: $.data.id }
            - call: "POST /otp/patients"
              payload: { program_id: "${prog_id}", full_name: "Dana Patient", date_of_birth: "1985-04-02", government_id_hash: "sha256:9f2c41aa", diagnosis_code: "F11_20", home_state_code: "CA", home_address: "12 River Rd", transportation_type: "PRIVATE_VEHICLE", one_way_travel_minutes: 20 }
              as: Physician
              as_user_id: "${phys_id}"
              captures: { pat_id: $.data.id }
            - call: "POST /otp/patients/${pat_id}/confirm-diagnosis"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
            - call: "POST /otp/dose-orders"
              payload: { patient_id: "${pat_id}", medication: "METHADONE", ordered_daily_mg: 90.0, split_dose_authorized: false }
              as: Physician
              as_user_id: "${phys_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /otp/dose-orders/${ord_id}/activate"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
            - call: "POST /otp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T06:30:00Z" }
              as: ProgramAdministrator
            - call: "POST /otp/dose-dispenses"
              payload: { dose_order_id: "${ord_id}", dose_date: "2026-09-02", scheduled_datetime: "2026-09-02T07:00:00Z", source_type: "OBSERVED_CLINIC", inventory_lot_id: "${lot_id}" }
              as: Nurse
              as_user_id: "${nurse_id}"
              captures: { dose_id: $.data.id }
            - call: "POST /otp/dose-dispenses/${dose_id}/check-in"
              payload: {}
              as: Nurse
              as_user_id: "${nurse_id}"
            - call: "POST /otp/dose-dispenses/${dose_id}/verify"
              payload: { identity_matched: true }
              as: Nurse
              as_user_id: "${nurse_id}"
          trigger:
            - call: "POST /otp/dose-dispenses/${dose_id}/dispense"
              payload: { dispensed_mg: 89.5, wasted_mg: 0.0, returned_mg: 0.0, inventory_lot_id: "${lot_id}" }
              as: Nurse
              as_user_id: "${nurse_id}"
              captures: { err_mass: $.data.error_id }
            - call: "POST /otp/dose-dispenses/${dose_id}/dispense"
              payload: { dispensed_mg: 90.0, wasted_mg: 0.0, returned_mg: 0.0, inventory_lot_id: "${lot_id}" }
              as: Nurse
              as_user_id: "${nurse_id}"
          assert:
            - "the first dispense returns 422 and err_mass == ERR_DOSE_MASS_MISMATCH"
            - "DoseDispense.${dose_id}.status == NURSE_VERIFIED after the failed attempt"
            - "InventoryLot.${lot_id}.running_on_hand_mg == 50000.0 after the failed attempt, so no movement was written"
            - "the second dispense returns 200 and DoseDispense.${dose_id}.status == DISPENSED"
            - "GET /otp/inventory-transactions?lot_id=${lot_id} returns exactly 1 row with quantity_mg == -90.0"

      - name: err_not_in_withdrawal_phase_on_completing_withdrawal_too_early
        claim_type: violation_to_error
        grounds:
          - errors[ERR_NOT_IN_WITHDRAWAL_PHASE]
          - state_machines.Patient.ACTIVE_to_COMPLETED_WITHDRAWAL
          - endpoints.POST_/otp/patients/{patientId}/complete-withdrawal
        distinguishing_aspect: "The withdrawal completion gate reads the phase dimension: an ACTIVE patient still in MAINTENANCE is rejected at 409 ERR_NOT_IN_WITHDRAWAL_PHASE, and the same call after the phase is moved to MEDICAL_WITHDRAWAL succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One CA program with a Physician, a MedicalDirector and one ACTIVE patient on a 90 mg order."
          setup_api_calls:
            - *c_clock
            - *c_prog
            - *c_phys
            - call: "POST /otp/users"
              payload: { program_id: "${prog_id}", full_name: "Miles Director", staff_role: "MEDICAL_DIRECTOR", license_number: "MD-2001" }
              as: ProgramAdministrator
              captures: { md_id: $.data.id }
            - call: "POST /otp/patients"
              payload: { program_id: "${prog_id}", full_name: "Dana Patient", date_of_birth: "1985-04-02", government_id_hash: "sha256:9f2c41aa", diagnosis_code: "F11_20", home_state_code: "CA", home_address: "12 River Rd", transportation_type: "PRIVATE_VEHICLE", one_way_travel_minutes: 20 }
              as: Physician
              as_user_id: "${phys_id}"
              captures: { pat_id: $.data.id }
            - call: "POST /otp/patients/${pat_id}/confirm-diagnosis"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
            - call: "POST /otp/dose-orders"
              payload: { patient_id: "${pat_id}", medication: "METHADONE", ordered_daily_mg: 90.0, split_dose_authorized: false }
              as: Physician
              as_user_id: "${phys_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /otp/dose-orders/${ord_id}/activate"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
          trigger:
            - call: "POST /otp/patients/${pat_id}/complete-withdrawal"
              payload: {}
              as: MedicalDirector
              as_user_id: "${md_id}"
              captures: { err_phase: $.data.error_id }
            - call: "PATCH /otp/patients/${pat_id}/treatment-phase"
              payload: { treatment_phase: "MEDICAL_WITHDRAWAL" }
              as: MedicalDirector
              as_user_id: "${md_id}"
            - call: "POST /otp/patients/${pat_id}/complete-withdrawal"
              payload: {}
              as: MedicalDirector
              as_user_id: "${md_id}"
          assert:
            - "the first attempt returns 409 and err_phase == ERR_NOT_IN_WITHDRAWAL_PHASE"
            - "Patient.${pat_id}.status == ACTIVE after the failed attempt"
            - "Patient.${pat_id}.treatment_phase == MEDICAL_WITHDRAWAL after the patch"
            - "the second attempt returns 200 and Patient.${pat_id}.status == COMPLETED_WITHDRAWAL"
            - "DoseOrder.${ord_id}.status == DISCONTINUED"

      - name: err_dual_enrollment_detected_blocks_a_second_admission
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DUAL_ENROLLMENT_DETECTED]
          - state_machines.Patient.PENDING_ADMISSION_to_ADMITTED
          - entities.Patient.fields.government_id_hash
        distinguishing_aspect: "The registry key is the pair of government_id_hash and date_of_birth: rebinding that pair to a tracker whose dual_enrollment_flag is true rejects the admission at 409 ERR_DUAL_ENROLLMENT_DETECTED while a different hash admits normally."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One CA program with a Physician and two registered PENDING_ADMISSION patients sharing the SAME government_id_hash and date_of_birth."
          setup_api_calls:
            - *c_clock
            - *c_prog
            - *c_phys
            - call: "POST /otp/patients"
              payload: { program_id: "${prog_id}", full_name: "Dana Patient", date_of_birth: "1985-04-02", government_id_hash: "sha256:dup00001", diagnosis_code: "F11_20", home_state_code: "CA", home_address: "12 River Rd", transportation_type: "PRIVATE_VEHICLE", one_way_travel_minutes: 20 }
              as: Physician
              as_user_id: "${phys_id}"
              captures: { pat_a: $.data.id }
            - call: "POST /otp/patients"
              payload: { program_id: "${prog_id}", full_name: "Dana P Patient", date_of_birth: "1985-04-02", government_id_hash: "sha256:dup00001", diagnosis_code: "F11_20", home_state_code: "CA", home_address: "12 River Rd", transportation_type: "PRIVATE_VEHICLE", one_way_travel_minutes: 20 }
              as: Physician
              as_user_id: "${phys_id}"
              captures: { pat_b: $.data.id }
            - call: "POST /otp/patients/${pat_a}/confirm-diagnosis"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
          trigger:
            - call: "POST /otp/patients/${pat_b}/confirm-diagnosis"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
              captures: { err_dual: $.data.error_id }
          assert:
            - "Patient.${pat_a}.status == ADMITTED and admission_datetime is not null"
            - "the second confirm returns 409 and err_dual == ERR_DUAL_ENROLLMENT_DETECTED"
            - "Patient.${pat_b}.status == PENDING_ADMISSION and diagnosis_confirmed == false"
            - "Patient.${pat_b}.admission_datetime is null"
            - "re-registering under a distinct government_id_hash then admits normally"
