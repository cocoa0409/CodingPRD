      - name: every_code_triggerable_rate_card_coverage_gap_blocks_both_statement_variants
        claim_type: every_code_triggerable
        grounds:
          - errors.ERR_TIER_COVERAGE_GAP
          - validations.priority_27_tier_coverage
          - calculations.billing_statement_charge.select_tier
