              captures: { committed: $.data.committed_screens_total }
            - call: "GET /event-cinema/booking-lines/${l1}"
              payload: {}
              as: PlatformOps
              captures: { a1: $.data.guarantee_applied_cents }
            - call: "GET /event-cinema/booking-lines/${l2}"
              payload: {}
              as: PlatformOps
              captures: { a2: $.data.guarantee_applied_cents }
            - call: "GET /event-cinema/booking-lines/${l3}"
              payload: {}
              as: PlatformOps
              captures: { a3: $.data.guarantee_applied_cents }
          assert:
            - "three lines of 40 screens each are committed — ${committed} == 120"
            - "the pro-rata floor gives each equal-forecast line 33 cents — ${a1} == 33 and ${a2} == 33 and ${a3} == 33"
            - "the single leftover cent goes to the earliest-created_at line, which is AUD-1 — ${a1} == 34"
            - "the parts sum exactly to the whole with no drift — 34 + 33 + 33 == 100 == Booking.${b_id}.guarantee_cents"
            - "two lines at 70 and 30 forecast would instead allocate 70 and 30 with no remainder, so the remainder rule is only exercised by the equal-forecast case"

      - name: encore_price_takes_the_max_of_two_discount_arms
        claim_type: Constants Applied
        grounds:
          - calculations.encore_price_derivation
          - entities.EncoreWindow.fields.derived_encore_price_cents
          - entities.EncoreWindow.fields.encore_ticket_price_cents
        distinguishing_aspect: "The encore price is a max() of a flat 500-cent cut and a 0.55 relative multiplier: at a 1500-cent standard price the absolute arm wins and the derived price is exactly 1000 cents."
        test_recipe:
          setup:
            - "Standard CA fixture with a booking confirmed at 60 screens; title standard price 1500 cents."
          setup_api_calls:
            - *k_clock
            - *k_dist
            - *k_circ_b
            - *k_acc_b
            - *k_th_ca
            - *k_title_a
            - *k_pub_a
            - *k_booking_draft
            - *k_line_60
            - call: "POST /event-cinema/bookings/${b_id}/submit"
              payload: { expected_booking_version: "${b_v2}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { b_v3: $.data.version }
            - call: "POST /event-cinema/bookings/${b_id}/approve"
              payload: { line_id: "${line_id}", expected_booking_version: "${b_v3}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { b_v4: $.data.version }
            - call: "POST /event-cinema/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /event-cinema/_ops/run-on-sale-sweep"
              payload: {}
              as: PlatformOps
            - call: "POST /event-cinema/bookings/${b_id}/confirm"
              payload: { expected_booking_version: "${b_v4}" }
              as: PlatformOps
              captures: { b_v5: $.data.version }
            - call: "GET /event-cinema/screenings"
              payload: { booking_id: "${b_id}", limit: 10, offset: 0 }
              as: PlatformOps
              captures: { scr_id: "$.data[0].id" }
            - call: "POST /event-cinema/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T21:30:00Z" }
              as: PlatformOps
            - call: "POST /event-cinema/screenings/${scr_id}/report"
              payload: { reported_attendance: 175, reported_outcome: "SCREENED" }
              as: Theater
              as_user_id: "${th_id}"
          trigger:
            - call: "POST /event-cinema/encore-windows"
              payload: { booking_id: "${b_id}", window_start_utc: "2026-12-10T00:00:00Z", window_end_utc: "2026-12-20T00:00:00Z", standard_ticket_price_cents: 1500, encore_ticket_price_cents: 1000, planned_screen_count: 25, expected_booking_version: "${b_v5}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { ew_id: $.data.id, derived: $.data.derived_encore_price_cents, ew_status: $.data.status, scr_count: $.data.encore_screening_count }
          assert:
            - "the absolute arm wins at this price — standard 1500 - 500 == 1000 against round_half_up(1500 * 0.55) == 825"
            - "the derived price is exactly 1000 — ${derived} == 1000"
            - "the window opens in DRAFT with no screenings attached — ${ew_status} == DRAFT and ${scr_count} == 0"
            - "an encore price at or above the standard price is refused — a resubmission with encore_ticket_price_cents 1500 yields ERR_ENCORE_WINDOW_INVALID"

      - name: delivery_lead_verification_rejects_a_late_package
        claim_type: Constants Applied
        grounds:
          - calculations.delivery_lead_verification
          - validations[priority=37]
          - errors[ERR_DELIVERY_LEAD_VIOLATION]
        distinguishing_aspect: "A FILE package carries a 24-hour lead and the lead is measured against the earliest scheduled screening start: a package scheduled 12 hours before the 2026-12-01T00:00:00Z showtime is verified, while 36 hours after it is refused."
        test_recipe:
          setup:
            - "Standard CA fixture; booking APPROVED with a screening at 2026-12-01T00:00:00Z; clock at 2026-11-01T00:00:00Z."
          setup_api_calls:
            - *k_clock
            - *k_dist
            - *k_circ_b
            - *k_acc_b
            - *k_th_ca
            - *k_title_a
            - *k_pub_a
            - *k_booking_draft
            - *k_line_60
            - call: "POST /event-cinema/bookings/${b_id}/submit"
              payload: { expected_booking_version: "${b_v2}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { b_v3: $.data.version }
            - call: "POST /event-cinema/bookings/${b_id}/approve"
              payload: { line_id: "${line_id}", expected_booking_version: "${b_v3}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { b_v4: $.data.version }
            - call: "POST /event-cinema/content-deliveries"
              payload: { booking_id: "${b_id}", delivery_method: "FILE", content_checksum: "sha256:11aa22bb", scheduled_delivery_utc: "2026-11-30T12:00:00Z", expected_booking_version: "${b_v4}" }
              as: PlatformOps
              captures: { cd_late_id: $.data.id }
            - call: "POST /event-cinema/content-deliveries/${cd_late_id}/mark-delivered"
              payload: { delivered_checksum: "sha256:11aa22bb" }
              as: PlatformOps
            - call: "POST /event-cinema/content-deliveries"
              payload: { booking_id: "${b_id}", delivery_method: "FILE", content_checksum: "sha256:33cc44dd", scheduled_delivery_utc: "2026-11-30T12:00:00Z", expected_booking_version: "${b_v4}" }
              as: PlatformOps
              captures: { cd_ok_id: $.data.id }
          trigger:
            - call: "POST /event-cinema/content-deliveries/${cd_late_id}/verify"
              payload: {}
              as: PlatformOps
              captures: { late_err: "$.data.error_id" }
            - call: "POST /event-cinema/content-deliveries/${cd_ok_id}/mark-delivered"
              payload: { delivered_checksum: "sha256:33cc44dd" }
              as: PlatformOps
            - call: "POST /event-cinema/content-deliveries/${cd_ok_id}/verify"
              payload: {}
              as: PlatformOps
              captures: { ok_status: $.data.status }
          assert:
            - "a package scheduled 12 hours before the showtime cannot satisfy a 24-hour FILE lead — ${late_err} == ERR_DELIVERY_LEAD_VIOLATION at 422"
            - "the same scheduled instant verifies once the delivery has actually landed — ${ok_status} == VERIFIED"
            - "the lead is method-specific: a SATELLITE package at the same instant carries a 48-hour lead and a live title adds a further 12 hours"

      - name: key_window_alignment_requires_both_inclusive_bounds
        claim_type: Precision
        grounds:
          - calculations.key_window_alignment
          - entities.EncryptionKey.fields.validity_state
          - state_machines.EncryptionKey.PENDING_to_ISSUED
        distinguishing_aspect: "validity_state is computed on INCLUSIVE bounds: a key opening exactly at the screening start and closing exactly at its end reads VALID at both endpoints, and reads NOT_YET_VALID one second before the opening bound."
        test_recipe:
          setup:
            - "Standard CA fixture; booking ON_SALE with one 120-minute screening 19:00-21:00Z on 2026-12-01 and a verified delivery; a key minted with exactly those endpoints."
          setup_api_calls:
            - *k_clock
            - *k_dist
            - *k_circ_b
            - *k_acc_b
            - *k_th_ca
            - *k_title_a
            - *k_pub_a
            - *k_booking_draft
            - *k_line_60
            - call: "POST /event-cinema/bookings/${b_id}/submit"
              payload: { expected_booking_version: "${b_v2}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { b_v3: $.data.version }
            - call: "POST /event-cinema/bookings/${b_id}/approve"
              payload: { line_id: "${line_id}", expected_booking_version: "${b_v3}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { b_v4: $.data.version }
            - call: "POST /event-cinema/content-deliveries"
              payload: { booking_id: "${b_id}", delivery_method: "FILE", content_checksum: "sha256:55ee66ff", scheduled_delivery_utc: "2026-11-25T00:00:00Z", expected_booking_version: "${b_v4}" }
              as: PlatformOps
              captures: { cd_id: $.data.id }
            - call: "POST /event-cinema/content-deliveries/${cd_id}/mark-delivered"
              payload: { delivered_checksum: "sha256:55ee66ff" }
              as: PlatformOps
            - call: "POST /event-cinema/content-deliveries/${cd_id}/verify"
              payload: {}
              as: PlatformOps
            - call: "POST /event-cinema/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /event-cinema/_ops/run-on-sale-sweep"
              payload: {}
              as: PlatformOps
            - call: "GET /event-cinema/screenings"
              payload: { booking_id: "${b_id}", limit: 10, offset: 0 }
              as: PlatformOps
              captures: { scr_id: "$.data[0].id" }
            - call: "POST /event-cinema/encryption-keys"
              payload: { screening_id: "${scr_id}", not_valid_before_utc: "2026-12-01T19:00:00Z", not_valid_after_utc: "2026-12-01T21:00:00Z" }
              as: PlatformOps
              captures: { key_id: $.data.id }
            - call: "POST /event-cinema/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T18:59:59Z" }
              as: PlatformOps
          trigger:
            - call: "GET /event-cinema/encryption-keys/${key_id}"
              payload: {}
              as: PlatformOps
              captures: { before_open: $.data.validity_state }
            - call: "POST /event-cinema/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T19:00:00Z" }
              as: PlatformOps
            - call: "GET /event-cinema/encryption-keys/${key_id}"
              payload: {}
              as: PlatformOps
              captures: { at_open: $.data.validity_state }
            - call: "POST /event-cinema/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T21:00:00Z" }
              as: PlatformOps
            - call: "GET /event-cinema/encryption-keys/${key_id}"
              payload: {}
              as: PlatformOps
              captures: { at_close: $.data.validity_state }
            - call: "POST /event-cinema/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T21:00:01Z" }
              as: PlatformOps
            - call: "GET /event-cinema/encryption-keys/${key_id}"
              payload: {}
              as: PlatformOps
              captures: { after_close: $.data.validity_state }
          assert:
            - "one second before the opening bound is not yet valid — ${before_open} == NOT_YET_VALID"
            - "exactly at the opening bound is VALID, because the left bound is inclusive — ${at_open} == VALID"
            - "exactly at the closing bound is still VALID, because the right bound is inclusive — ${at_close} == VALID"
            - "one second past the closing bound is EXPIRED — ${after_close} == EXPIRED"

  # ===========================================================================
  - section: validations
    instances:

      - name: missing_role_header_is_rejected_before_anything_else
        claim_type: Violation -> Error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
          - endpoints.POST_/bookings
        distinguishing_aspect: "The auth check runs ahead of every domain check: a create with a valid body but no X-User-Role is refused with 401 ERR_UNAUTHENTICATED rather than any 400 or 404."
        test_recipe:
          setup:
            - *k_clock
            - *k_dist
          setup_api_calls:
            - *k_clock
            - *k_dist
          trigger:
            - call: "POST /event-cinema/bookings"
              payload: { title_id: "3f1a7c22-0000-4000-8000-000000000001", circuit_id: "3f1a7c22-0000-4000-8000-000000000002", showtime_count: 1, showtime_plan: [{ index: 1, date_utc: "2026-12-01T00:00:00Z", start_minute_utc: 1140, auditorium: "AUD-1" }], on_sale_at: "2026-10-01T00:00:00Z", guarantee_cents: 1000000, revenue_share_pct: 0.40, min_screens: 1, pre_sale_threshold: 0 }
              as: Anonymous
              captures: { auth_err: "$.data.error_id" }
          assert:
            - "the response status is 401, not 400 or 404"
            - "the error is the auth one — ${auth_err} == ERR_UNAUTHENTICATED"
            - "the referenced title and circuit do not exist either, so the auth check demonstrably runs first"

      - name: a_role_outside_the_endpoint_allowlist_is_forbidden
        claim_type: Violation -> Error
        grounds:
          - validations[priority=2]
          - errors[ERR_FORBIDDEN]
          - roles
          - endpoints.POST_/distributors
        distinguishing_aspect: "Authorization is per-endpoint: an authenticated Theater attempting to register a distributor — an operation only PlatformOps may perform — is refused with 403 ERR_FORBIDDEN although the caller is a real role."
        test_recipe:
          setup:
            - *k_clock
            - *k_dist
            - *k_circ_b
            - *k_th_ca
          setup_api_calls:
            - *k_clock
            - *k_dist
            - *k_circ_b
            - *k_th_ca
          trigger:
            - call: "POST /event-cinema/distributors"
              payload: { distributor_name: "Rogue Licensor", contact_email: "x@y.example", settlement_currency: "USD", guarantee_floor_cents: 1000, ticket_price_default_cents: 1000 }
              as: Theater
              as_user_id: "${th_id}"
              captures: { forbid_err: "$.data.error_id" }
          assert:
            - "the response status is 403, not 401 — the caller is authenticated"
            - "the error is the authorization one — ${forbid_err} == ERR_FORBIDDEN"
            - "no distributor was created — GET /event-cinema/distributors still returns exactly 1 row"

      - name: an_unknown_title_in_the_body_is_reported_before_state_checks
        claim_type: Priority Ordering
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_TITLE_NOT_FOUND]
        distinguishing_aspect: "Existence outranks state: a booking-line create naming a non-existent theater is refused with 404 ERR_THEATER_NOT_FOUND, not with the 409 the booking's own status would otherwise raise."
        test_recipe:
          setup:
            - "Standard CA fixture; booking left DRAFT so its status is also unsuitable for the requested line creation."
          setup_api_calls:
            - *k_clock
            - *k_dist
            - *k_circ_b
            - *k_acc_b
            - *k_th_ca
            - *k_title_a
            - *k_pub_a
            - call: "POST /event-cinema/bookings"
              payload: { title_id: "${title_id}", circuit_id: "${circ_id}", showtime_count: 1, showtime_plan: [{ index: 1, date_utc: "2026-12-01T00:00:00Z", start_minute_utc: 1140, auditorium: "AUD-1" }], on_sale_at: "2026-10-01T00:00:00Z", guarantee_cents: 1000000, revenue_share_pct: 0.40, min_screens: 1, pre_sale_threshold: 0 }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { b_id: $.data.id, b_v1: $.data.version }
          trigger:
            - call: "POST /event-cinema/bookings/${b_id}/lines"
              payload: { theater_id: "3f1a7c22-0000-4000-8000-0000000000ff", committed_screens: 20, expected_attendance: 50, expected_booking_version: "${b_v1}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { nf_err: "$.data.error_id" }
          assert:
            - "the response status is 404"
            - "the existence check wins — ${nf_err} == ERR_THEATER_NOT_FOUND"
            - "no line was created — GET /event-cinema/bookings/${b_id}/lines returns 0 rows"

      - name: territory_gate_rejects_a_venue_outside_the_licensed_states
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=13]
          - errors[ERR_TERRITORY_UNLICENSED]
          - entities.Title.fields.territory_state_codes
        distinguishing_aspect: "Licensing is evaluated across entities: a line at a Nevada venue is refused when the title is licensed only for CA, with 422 ERR_TERRITORY_UNLICENSED."
        test_recipe:
          setup:
            - "Standard CA fixture, plus a second Nevada venue on the same circuit; title licensed only for [\"CA\"]."
          setup_api_calls:
            - *k_clock
            - *k_dist
            - *k_circ_b
            - *k_acc_b
            - *k_th_ca
            - call: "POST /event-cinema/theaters"
              payload: { circuit_id: "${circ_id}", theater_name: "Cedar Point Reno", city: "Reno", state_code: "NV", timezone: "America/Los_Angeles", seats_total: 150, screen_count: 3, showtime_buffer_minutes: 20 }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { th_nv: $.data.id }
            - *k_title_a
            - *k_pub_a
            - *k_booking_draft
          trigger:
            - call: "POST /event-cinema/bookings/${b_id}/lines"
              payload: { theater_id: "${th_nv}", committed_screens: 40, expected_attendance: 90, expected_booking_version: "${b_v1}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { terr_err: "$.data.error_id" }
            - call: "POST /event-cinema/bookings/${b_id}/lines"
              payload: { theater_id: "${th_id}", committed_screens: 40, expected_attendance: 90, expected_booking_version: "${b_v1}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { ca_line: $.data.exhibit_state }
          assert:
            - "the unlicensed state is refused with 422"
            - "the error names the licensing rule — ${terr_err} == ERR_TERRITORY_UNLICENSED"
            - "the licensed CA venue is accepted from the identical payload — ${ca_line} == PROPOSED"

      - name: rights_window_gate_rejects_a_showtime_after_expiry
        claim_type: Temporal validation
        grounds:
          - validations[priority=14]
          - errors[ERR_RIGHTS_WINDOW_VIOLATION]
          - entities.Title.fields.rights_end_utc
        distinguishing_aspect: "A booking whose showtime falls after the title's rights_end_utc is refused with 422 ERR_RIGHTS_WINDOW_VIOLATION even though the clock is still comfortably inside the window at creation time."
        test_recipe:
          setup:
            - *k_clock
            - *k_dist
            - *k_circ_b
            - *k_acc_b
            - call: "POST /event-cinema/titles"
              payload: { distributor_id: "${dist_id}", title_name: "Short Season Special", content_type: "SPECIAL", is_live: false, duration_minutes: 90, rights_start_utc: "2026-09-01T00:00:00Z", rights_end_utc: "2026-11-30T00:00:00Z", territory_state_codes: ["CA"], max_screen_commitment: 60, ticket_price_cents: 1500 }
              as: ProgrammingManager
              captures: { title_id: $.data.id }
            - call: "POST /event-cinema/titles/${title_id}/publish"
              payload: {}
              as: ProgrammingManager
          setup_api_calls:
            - *k_clock
            - *k_dist
            - *k_circ_b
            - *k_acc_b
            - call: "POST /event-cinema/titles"
              payload: { distributor_id: "${dist_id}", title_name: "Short Season Special", content_type: "SPECIAL", is_live: false, duration_minutes: 90, rights_start_utc: "2026-09-01T00:00:00Z", rights_end_utc: "2026-11-30T00:00:00Z", territory_state_codes: ["CA"], max_screen_commitment: 60, ticket_price_cents: 1500 }
              as: ProgrammingManager
              captures: { title_id: $.data.id }
            - call: "POST /event-cinema/titles/${title_id}/publish"
              payload: {}
              as: ProgrammingManager
          trigger:
            - call: "POST /event-cinema/bookings"
              payload: { title_id: "${title_id}", circuit_id: "${circ_id}", showtime_count: 1, showtime_plan: [{ index: 1, date_utc: "2026-12-15T00:00:00Z", start_minute_utc: 1140, auditorium: "AUD-1" }], on_sale_at: "2026-10-01T00:00:00Z", guarantee_cents: 1000000, revenue_share_pct: 0.40, min_screens: 1, pre_sale_threshold: 0 }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { rw_err: "$.data.error_id" }
            - call: "POST /event-cinema/bookings"
              payload: { title_id: "${title_id}", circuit_id: "${circ_id}", showtime_count: 1, showtime_plan: [{ index: 1, date_utc: "2026-11-20T00:00:00Z", start_minute_utc: 1140, auditorium: "AUD-1" }], on_sale_at: "2026-10-01T00:00:00Z", guarantee_cents: 1000000, revenue_share_pct: 0.40, min_screens: 1, pre_sale_threshold: 0 }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { ok_booking: $.data.status }
          assert:
            - "a showtime after the rights expiry is refused — ${rw_err} == ERR_RIGHTS_WINDOW_VIOLATION at 422"
            - "the clock is still inside the window at creation time, so this is a future-conflict check and not an expiry check"
            - "a showtime inside the window is accepted — ${ok_booking} == DRAFT"

      - name: screen_pool_exhaustion_rejects_the_second_commitment
        claim_type: Aggregate validation
        grounds:
          - validations[priority=20]
          - errors[ERR_SCREEN_POOL_EXHAUSTED]
          - entities.Circuit.fields.screen_pool_total
        distinguishing_aspect: "Each booking is individually legal, but together they exceed the circuit's 50-screen pool: the second approval is refused with 409 ERR_SCREEN_POOL_EXHAUSTED."
        test_recipe:
          setup:
            - "A circuit whose screen_pool_total is only 50, accredited; title max_screen_commitment 120 so the title is not the limiter."
          setup_api_calls:
            - *k_clock
            - *k_dist
            - call: "POST /event-cinema/circuits"
              payload: { circuit_name: "Bramble Micro Cinemas", circuit_code: "BRMB", credit_rating: "A", settlement_terms: "NET_30", screen_pool_total: 50, on_sale_lead_days_min: 21 }
              as: PlatformOps
              captures: { circ_id: $.data.id }
            - *k_acc_b
            - *k_th_ca
            - *k_title_a
            - *k_pub_a
            - call: "POST /event-cinema/bookings"
              payload: { title_id: "${title_id}", circuit_id: "${circ_id}", showtime_count: 1, showtime_plan: [{ index: 1, date_utc: "2026-12-01T00:00:00Z", start_minute_utc: 1140, auditorium: "AUD-1" }], on_sale_at: "2026-10-01T00:00:00Z", guarantee_cents: 1000000, revenue_share_pct: 0.40, min_screens: 1, pre_sale_threshold: 0 }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { b1: $.data.id, b1_v1: $.data.version }
            - call: "POST /event-cinema/bookings/${b1}/lines"
              payload: { theater_id: "${th_id}", committed_screens: 40, expected_attendance: 100, expected_booking_version: "${b1_v1}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { lb1: $.data.id, b1_v2: $.data.version }
