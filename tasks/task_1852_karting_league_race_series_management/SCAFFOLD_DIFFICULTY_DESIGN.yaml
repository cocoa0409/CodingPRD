      - name: drop_rounds_equal_completed_counts_zero
        grounds:
          - calculations.season_standings
          - entities.LeagueSeason.fields.drop_rounds
        distinguishing_aspect: |
          Metric = counted-round cardinality (empty-set edge), reached via
          GET /karting/seasons/{id}/standings (different metric and endpoint than
          the weight boundary): with drop_rounds == completed rounds, the counted
          set is empty and final_points == 0 while provisional_points stays 25.
        test_recipe:
          setup:
            - "Season drop_rounds=1; driver A wins the single COMPLETED event's MAIN (25 pts)"
          setup_api_calls:
            - { call: "POST /karting/seasons", payload: { name: "Drop Cup", year: 2026, drop_rounds: 1, points_scheme: [25, 22, 20], fastest_lap_bonus_points: 0 }, as: LeagueAdmin, captures: { s_id: $.data.id } }
