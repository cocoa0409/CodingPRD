  - rule_id: resource_temporal_overlap
    instances:
      - name: room_recurring_overlap_with_turnover_buffer
        grounds:
          - calculations.room_occupancy_overlap
          - validations[priority=13]
          - state_machines.Enrollment.PENDING_MATCH_to_ACTIVE
        distinguishing_aspect: |
          Room recurring semantics: two back-to-back Monday lessons that do NOT overlap on
          raw [start,end) (10:00-11:00 then 11:00-12:00) STILL collide because room
          turnover_buffer_min=10 expands the first to [600,670) which intersects [660,720),
          yielding ERR_ROOM_DOUBLE_BOOKED — buffer-expanded interval arithmetic.
        test_recipe:
          setup:
            - "One Room turnover_buffer_min=10; instructorA ACTIVE Monday 10:00-11:00 in the room; a second enrollment Monday 11:00-12:00 same room, DIFFERENT instructor (so instructor overlap does not fire first)"
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S" }
              as: StudioAdmin
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/families"
              payload: { household_name: "Ora" }
              as: StudioAdmin
              captures: { fid: $.data.id }
            - call: "POST /studios/${sid}/students"
              payload: { family_id: "${fid}", full_name: "O1" }
              as: StudioAdmin
              captures: { s1: $.data.id }
            - call: "POST /studios/${sid}/students"
              payload: { family_id: "${fid}", full_name: "O2" }
              as: StudioAdmin
              captures: { s2: $.data.id }
            - call: "POST /studios/${sid}/instructors"
              payload: { full_name: "InA", instruments: ["PIANO"], weekly_availability: [{ weekday: 0, start_min: 540, end_min: 780 }], hourly_rate_cents: 6000 }
              as: StudioAdmin
              captures: { inA: $.data.id }
            - call: "POST /studios/${sid}/instructors"
              payload: { full_name: "InB", instruments: ["PIANO"], weekly_availability: [{ weekday: 0, start_min: 540, end_min: 780 }], hourly_rate_cents: 6000 }
              as: StudioAdmin
              captures: { inB: $.data.id }
            - call: "POST /studios/${sid}/rooms"
              payload: { room_name: "R1", supported_instruments: ["PIANO"], turnover_buffer_min: 10 }
              as: StudioAdmin
              captures: { room: $.data.id }
            - call: "POST /studios/${sid}/enrollments"
              payload: { student_id: "${s1}", instructor_id: "${inA}", room_id: "${room}", instrument: "PIANO", weekday: 0, start_min: 600, duration_min: 60 }
              as: StudioAdmin
              captures: { eA: $.data.id, eAv: $.data.version }
            - call: "POST /studios/${sid}/enrollments/${eA}/activate"
              payload: { expected_enrollment_version: "${eAv}" }
              as: StudioAdmin
            - call: "POST /studios/${sid}/enrollments"
              payload: { student_id: "${s2}", instructor_id: "${inB}", room_id: "${room}", instrument: "PIANO", weekday: 0, start_min: 660, duration_min: 60 }
              as: StudioAdmin
              captures: { eB: $.data.id, eBv: $.data.version }
          trigger:
            - call: "POST /studios/${sid}/enrollments/${eB}/activate"
              payload: { expected_enrollment_version: "${eBv}" }
              as: StudioAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_ROOM_DOUBLE_BOOKED"

      - name: instrument_unit_closed_interval_touching_endpoints_collide
        grounds:
          - calculations.instrument_unit_overlap
          - validations[priority=14]
          - entities.InstrumentRental.fields.instrument_unit_code
        distinguishing_aspect: |
          Instrument-unit semantics differ: CLOSED interval, endpoint-inclusive. A second
          rental on the same unit starting at the exact instant the first ends
          (first [.., 2026-02-10T00:00:00Z], second [2026-02-10T00:00:00Z, ..]) collides
          with ERR_INSTRUMENT_UNIT_UNAVAILABLE, whereas the room rule treats touching as
          non-overlap (half-open).
        test_recipe:
          setup:
            - "One Family; a RESERVED rental on unit 'CELLO-7' window 2026-02-01..2026-02-10"
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S" }
              as: StudioAdmin
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/families"
              payload: { household_name: "Pat" }
              as: StudioAdmin
              captures: { fid: $.data.id }
            - call: "POST /studios/${sid}/instrument-rentals"
              payload: { family_id: "${fid}", instrument_unit_code: "CELLO-7", period_fee_cents: 5000, rental_start_utc: "2026-02-01T00:00:00.000Z", rental_end_utc: "2026-02-10T00:00:00.000Z" }
              as: StudioAdmin
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /studios/${sid}/instrument-rentals"
              payload: { family_id: "${fid}", instrument_unit_code: "CELLO-7", period_fee_cents: 5000, rental_start_utc: "2026-02-10T00:00:00.000Z", rental_end_utc: "2026-02-20T00:00:00.000Z" }
              as: StudioAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INSTRUMENT_UNIT_UNAVAILABLE"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: payment_then_refund_leaves_wallet_unchanged
        grounds:
          - calculations.family_wallet_balance
          - state_machines.Payment.SUCCEEDED_to_REFUNDED
          - state_machines.TuitionInvoice.FINALIZED_to_PAID
          - entities.Family.fields.wallet_balance_cents
        distinguishing_aspect: |
          Conserved quantity = Family.wallet_balance_cents. Wallet credited 50000, a WALLET
          payment of 24000 debits it to 26000 (invoice PAID), then refund credits it back
          to exactly 50000 — wallet_balance_cents == credited_total after the forward+
          compensating pair, zero drift.
        test_recipe:
          setup:
            - "Family wallet credited 50000; ACTIVE enrollment hourly 6000/60min -> monthly 24000; invoice FINALIZED for ended period 2026-01; clock 2026-02-01"
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S" }
              as: StudioAdmin
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/families"
              payload: { household_name: "Qui" }
              as: StudioAdmin
              captures: { fid: $.data.id }
            - call: "POST /studios/${sid}/families/${fid}/wallet/credits"
              payload: { amount_cents: 50000 }
              as: BillingClerk
            - call: "POST /studios/${sid}/students"
              payload: { family_id: "${fid}", full_name: "Q1" }
              as: StudioAdmin
              captures: { stu: $.data.id }
            - call: "POST /studios/${sid}/instructors"
              payload: { full_name: "Ms P", instruments: ["PIANO"], weekly_availability: [{ weekday: 0, start_min: 0, end_min: 1440 }], hourly_rate_cents: 6000 }
              as: StudioAdmin
              captures: { ins: $.data.id }
            - call: "POST /studios/${sid}/rooms"
              payload: { room_name: "R1", supported_instruments: ["PIANO"] }
              as: StudioAdmin
              captures: { room: $.data.id }
            - call: "POST /studios/${sid}/enrollments"
              payload: { student_id: "${stu}", instructor_id: "${ins}", room_id: "${room}", instrument: "PIANO", weekday: 0, start_min: 600, duration_min: 60 }
              as: StudioAdmin
              captures: { enr: $.data.id, enr_v: $.data.version }
            - call: "POST /studios/${sid}/enrollments/${enr}/activate"
              payload: { expected_enrollment_version: "${enr_v}" }
              as: StudioAdmin
            - call: "POST /studios/${sid}/lesson-occurrences"
              payload: { enrollment_id: "${enr}", scheduled_start_utc: "2026-01-05T10:00:00.000Z" }
              as: StudioAdmin
              captures: { o1: $.data.id }
            - call: "POST /studios/${sid}/lesson-occurrences"
              payload: { enrollment_id: "${enr}", scheduled_start_utc: "2026-01-12T10:00:00.000Z" }
              as: StudioAdmin
              captures: { o2: $.data.id }
            - call: "POST /studios/${sid}/lesson-occurrences"
              payload: { enrollment_id: "${enr}", scheduled_start_utc: "2026-01-19T10:00:00.000Z" }
              as: StudioAdmin
              captures: { o3: $.data.id }
            - call: "POST /studios/${sid}/lesson-occurrences"
              payload: { enrollment_id: "${enr}", scheduled_start_utc: "2026-01-26T10:00:00.000Z" }
              as: StudioAdmin
              captures: { o4: $.data.id }
            - call: "POST /studios/${sid}/invoices"
              payload: { enrollment_id: "${enr}", billing_period: "2026-01" }
              as: BillingClerk
              captures: { inv: $.data.id }
            - call: "POST /studios/${sid}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-27T00:00:00.000Z" }
              as: StudioAdmin
            - call: "POST /studios/${sid}/lesson-occurrences/${o1}/complete"
              payload: {}
              as: Instructor
            - call: "POST /studios/${sid}/lesson-occurrences/${o2}/complete"
              payload: {}
              as: Instructor
            - call: "POST /studios/${sid}/lesson-occurrences/${o3}/complete"
              payload: {}
              as: Instructor
            - call: "POST /studios/${sid}/lesson-occurrences/${o4}/complete"
              payload: {}
              as: Instructor
            - call: "POST /studios/${sid}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00.000Z" }
              as: StudioAdmin
            - call: "POST /studios/${sid}/invoices/${inv}/finalize"
              payload: {}
              as: BillingClerk
              captures: { due: $.data.amount_due_cents }
            - call: "POST /studios/${sid}/payments"
              payload: { invoice_id: "${inv}", method: "WALLET" }
              as: BillingClerk
              captures: { pay: $.data.id }
            - call: "GET /studios/${sid}/families/${fid}"
              payload: {}
              as: BillingClerk
              captures: { wallet_after_pay: $.data.wallet_balance_cents }
          trigger:
            - call: "POST /studios/${sid}/payments/${pay}/refund"
              payload: {}
              as: BillingClerk
            - call: "GET /studios/${sid}/families/${fid}"
              payload: {}
              as: BillingClerk
              captures: { wallet_after_refund: $.data.wallet_balance_cents }
          assert:
            - "Family.${fid}.wallet_balance_cents == 26000 before refund"
            - "Family.${fid}.wallet_balance_cents == 50000 after refund"
            - "Payment.${pay}.status == REFUNDED"

      - name: makeup_credit_mint_then_void_leaves_count_unchanged
        grounds:
          - calculations.outstanding_makeup_credit_count
          - state_machines.LessonOccurrence.SCHEDULED_to_MAKEUP_PENDING
          - state_machines.Enrollment.ACTIVE_to_CANCELLED
          - entities.MakeupCredit.fields.status
        distinguishing_aspect: |
          Conserved quantity = enrollment OUTSTANDING-makeup-credit count (a count, not
          money). request-makeup mints one OUTSTANDING credit (count 0 -> 1); cancelling
          the enrollment VOIDS it (count 1 -> 0) — the forward mint and its compensating
          void leave outstanding count back at 0, zero drift.
        test_recipe:
          setup:
            - "ACTIVE enrollment with one future SCHEDULED occurrence; request makeup mints one OUTSTANDING credit (count=1)"
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S" }
              as: StudioAdmin
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/families"
              payload: { household_name: "Rho" }
              as: StudioAdmin
              captures: { fid: $.data.id }
            - call: "POST /studios/${sid}/students"
              payload: { family_id: "${fid}", full_name: "R1" }
              as: StudioAdmin
              captures: { stu: $.data.id }
            - call: "POST /studios/${sid}/instructors"
              payload: { full_name: "Ms P", instruments: ["PIANO"], weekly_availability: [{ weekday: 0, start_min: 0, end_min: 1440 }], hourly_rate_cents: 6000 }
              as: StudioAdmin
              captures: { ins: $.data.id }
            - call: "POST /studios/${sid}/rooms"
              payload: { room_name: "R1", supported_instruments: ["PIANO"] }
              as: StudioAdmin
              captures: { room: $.data.id }
            - call: "POST /studios/${sid}/enrollments"
              payload: { student_id: "${stu}", instructor_id: "${ins}", room_id: "${room}", instrument: "PIANO", weekday: 0, start_min: 600, duration_min: 60 }
              as: StudioAdmin
              captures: { enr: $.data.id, enr_v: $.data.version }
            - call: "POST /studios/${sid}/enrollments/${enr}/activate"
              payload: { expected_enrollment_version: "${enr_v}" }
              as: StudioAdmin
            - call: "POST /studios/${sid}/lesson-occurrences"
              payload: { enrollment_id: "${enr}", scheduled_start_utc: "2026-01-26T10:00:00.000Z" }
              as: StudioAdmin
              captures: { occ: $.data.id }
            - call: "POST /studios/${sid}/lesson-occurrences/${occ}/request-makeup"
              payload: {}
              as: StudioAdmin
            - call: "GET /studios/${sid}/makeup-credits"
              payload: { enrollment_id: "${enr}" }
              as: StudioAdmin
              captures: { cr: $.data.0.id, cr_status: $.data.0.status }
          trigger:
            - call: "POST /studios/${sid}/enrollments/${enr}/cancel"
              payload: {}
              as: StudioAdmin
            - call: "GET /studios/${sid}/makeup-credits/${cr}"
              payload: {}
              as: StudioAdmin
              captures: { cr_after: $.data.status }
          assert:
            - "MakeupCredit.${cr}.status == OUTSTANDING before cancel"
            - "MakeupCredit.${cr}.status == VOIDED after cancel"
