              as: Conservator
              as_user_id: con-01
            - call: "POST /exhibit-projects/${proj}/advance-phase"
              payload: { to_phase: "DESIGN_DEV" }
              as: ProjectManager
              as_user_id: pm-01
            - call: "GET /exhibit-projects/${proj}"
              payload: {}
              as: ProjectManager
              as_user_id: pm-01
              captures: { pv2: $.data.version }
            - call: "POST /exhibit-projects/${proj}/design-packages"
              payload: { expected_project_version: "${pv2}", stage: "DESIGN_DEV", egress_clear_width_cm: 112, wheelchair_turning_radius_cm: 76, peak_visitors_per_hour: 180, circulation_area_sqm: 95.0 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { pkg2: $.data.id }
            - call: "POST /design-packages/${pkg2}/review-rounds"
              payload: { panel_roles: ["Curator", "Conservator", "ProjectManager"], decision_deadline_at: "2026-08-15T00:00:00Z" }
