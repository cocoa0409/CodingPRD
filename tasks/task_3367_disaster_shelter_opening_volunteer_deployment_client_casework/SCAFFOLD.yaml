    code: 201
    input: [full_name, home_region_id, qualified_role_codes]
    output: Volunteer
    side_effects: ["credential_status=PENDING, deployment_availability=UNAVAILABLE, rotation_days_used_ytd=0", "region_volunteer_counts recomputed for the home region"]
  - method: POST
    path: "/api/v1/volunteers/{id}/credential-refresh"
    description: "Refresh a volunteer's credentials and return them to ACTIVE / AVAILABLE"
    roles: [NationalHQAdmin, RegionalCoordinator]
    code: 200
    input: []
    output: Volunteer
    side_effects: ["credential_refreshed_at stamped from the logical clock; credential_expires_at = credential_refreshed_at + 30 days", "credential_status=ACTIVE, deployment_availability=AVAILABLE", "region_volunteer_counts recomputed for the home region", "increments Volunteer.version by 1"]
