      - name: allocation_score_multi_input_nonlinear_interaction
        grounds:
          - calculations.allocation_priority_score
          - entities.Allocation.fields.allocation_score
        distinguishing_aspect: |
          Mode (a) formula with >=3 inputs and non-linear interaction:
          allocation_score multiplies (velocity + VELOCITY_BASE) by a
          min()-capped demo_factor and a min()-capped income_factor; a club at
          exactly the member_base cap (200000) with a region at exactly the
          income cap (20000000) scores 19.5, while one unit below each cap
          scores 19.4999 — the caps interact multiplicatively, not additively.
        test_recipe:
          setup:
            - "Clock 2026-09-08T09:05:00Z; Region R_cap income exactly 20000000; Region R_under income 19999999"
            - "Club C_cap member_base exactly 200000 in R_cap; Club C_under member_base 199999 in R_under"
            - "REGULAR item ACTIVE, pallet_qty 480; zero purchases for both clubs (velocity 0)"
            - "Two pallets received 2026-09-08; run for 2026-09-08 OPEN"
          setup_api_calls:
            - call: "POST /wcd/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegionalOps
            - call: "POST /wcd/regions"
              payload: { name: "CapRegion", code: "CAPR", avg_member_income_cents: 20000000 }
              as: RegionalOps
              captures: { region_cap_id: $.data.id }
            - call: "POST /wcd/regions"
              payload: { name: "UnderRegion", code: "UNDR", avg_member_income_cents: 19999999 }
              as: RegionalOps
              captures: { region_under_id: $.data.id }
            - call: "POST /wcd/vendors"
              payload: { name: "Delta Wholesalers", vendor_code: "V400004" }
              as: RegionalOps
              captures: { vendor_id: $.data.id }
            - call: "POST /wcd/clubs"
              payload: { region_id: "${region_cap_id}", name: "Cap Club", club_number: 201, floor_slot_capacity: 40, member_base: 200000 }
              as: RegionalOps
              captures: { club_cap_id: $.data.id }
            - call: "POST /wcd/clubs"
              payload: { region_id: "${region_under_id}", name: "Under Club", club_number: 202, floor_slot_capacity: 40, member_base: 199999 }
              as: RegionalOps
              captures: { club_under_id: $.data.id }
            - call: "POST /wcd/depots"
              payload: { region_id: "${region_cap_id}", name: "Depot Cap", dock_count: 2, dock_hours_open: "09:00", dock_hours_close: "17:00", slot_length_minutes: 30 }
              as: DepotManager
              captures: { depot_id: $.data.id }
            - call: "POST /wcd/items"
              payload: { vendor_id: "${vendor_id}", sku: "4000001", description: "Water cases", case_pack_qty: 24, pallet_length_in: 40, pallet_width_in: 40, cases_per_layer: 5, max_layers: 4, item_type: "REGULAR" }
              as: CategoryManager
              captures: { item_id: $.data.id }
            - call: "POST /wcd/items/${item_id}/activate"
              payload: {}
              as: CategoryManager
            - call: "POST /wcd/appointments"
              payload: { depot_id: "${depot_id}", vendor_id: "${vendor_id}", delivery_date: "2026-09-08", start_time: "09:00", end_time: "09:30", pallet_count: 2 }
              as: VendorRep
              as_user_id: "${vendor_id}"
              captures: { appt_id: $.data.id }
