      - name: reject_approved_disbursement_conserves_escrow_total
        grounds:
          - state_machines.Disbursement.REQUESTED_to_APPROVED
          - state_machines.Disbursement.APPROVED_to_REJECTED
          - entities.EscrowAccount.fields.available_cents
        distinguishing_aspect: "Conserved quantity #1 = deposited_cents (total funds). Forward action (approve: reserved += 1000000, available -= 1000000) paired with compensating reject (reserved -= 1000000, available += 1000000) leaves deposited_cents == 6000000 and available_cents back to 6000000; deposited never changes."
