scaffold_difficulty_design:

  # =========================================================================
  # RULE 1 — dual_variant_calc
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: feed_session_reserved_forward_versus_metered_actual_settlement
        grounds:
          - calculations.feed_session_billing
          - entities.FeedSession.fields.reserved_units
          - entities.FeedSession.fields.metered_units
          - entities.FeedSession.fields.refunded_units
          - entities.DataLicensee.fields.available_units
          - state_machines.FeedSession.ACTIVE_to_TERMINATED
        distinguishing_aspect: |
          This instance lives in the licensee-billing domain (DataLicensee / FeedSession /
          LicenseUsageRecord) and the two variants differ in ceil GRANULARITY: RESERVED_FORWARD
          takes one ceil over the whole booked window (900 units) while METERED_ACTUAL ceils
          each usage record independently and sums (300 + 200 + 90 = 590 units), so the same
          session yields two different unit counts and a 310-unit reconciliation refund.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T12:00:00Z"
            - "Harbor Arena venue with one CERTIFIED installation, data_posture CERTIFIED, transport_capacity_mbps 100, min_achievable_latency_ms 200"
            - "Game between Harbor FC and Summit SC, collection_status LIVE, licensable_minutes 240 (league_reserve_minutes 36, net_allocatable_minutes 204)"
            - "GOLD DataLicensee with granted_units 5000 and available_units 5000"
            - "ACTIVE COMMERCIAL_LICENSE RightsWindow 18:00-21:00 US, max_latency_ms 400, allowed_scopes [POSITIONAL, EVENT] (180 allocated minutes)"
            - "ACTIVE REALTIME FeedSession booking 20 mbps from 18:00 to 18:30 at 250 ms (reserved_units 900, reserved_charge_cents 19800, available_units down to 4100)"
            - "three LicenseUsageRecords reported on the session, none of them an SLA breach"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:00:00Z" }
              as: LeagueDataOps
              as_user_id: "ops-01"
            - call: "POST /venues"
              payload: { name: "Harbor Arena", city: "Harbor", tracking_tech: "HYBRID", required_certified_installations: 1, transport_capacity_mbps: 100, min_achievable_latency_ms: 200 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { v_id: $.data.id }
            - call: "POST /installations"
              payload: { venue_id: "${v_id}", rig_label: "RIG-A", modality: "UWB_ANCHOR" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { i_id: $.data.id }
            - call: "POST /installations/${i_id}/calibration-runs"
              payload: { axis_rms_x_mm: 90.0, axis_rms_y_mm: 90.0, axis_rms_z_mm: 90.0, sample_count: 6000, reference_point_count: 16 }
              as: CalibrationEngineer
              as_user_id: "eng-01"
            - call: "POST /installations/${i_id}/certify"
              as: LeagueDataOps
              as_user_id: "ops-01"
            - call: "POST /clubs"
              payload: { name: "Harbor FC", market_code: "HBR" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { c_home: $.data.id }
            - call: "POST /clubs"
              payload: { name: "Summit SC", market_code: "SMT" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { c_away: $.data.id }
            - call: "POST /games"
              payload: { venue_id: "${v_id}", home_club_id: "${c_home}", away_club_id: "${c_away}", scheduled_start_utc: "2026-08-01T18:00:00Z", tracking_generation: "G1", licensable_minutes: 240 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { g_id: $.data.id }
            - call: "POST /games/${g_id}/open-collection"
              as: LeagueDataOps
              as_user_id: "ops-01"
            - call: "POST /licensees"
              payload: { name: "Northstar Data", licensee_class: "COMMERCIAL_LICENSEE", tier: "GOLD", granted_units: 5000, biometric_entitled: false }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { lic_id: $.data.id }
            - call: "POST /games/${g_id}/rights-windows"
              payload: { rights_class: "COMMERCIAL_LICENSE", holder_type: "LICENSEE", holder_id: "${lic_id}", territory: "US", window_start_utc: "2026-08-01T18:00:00Z", window_end_utc: "2026-08-01T21:00:00Z", max_latency_ms: 400, allowed_scopes: ["POSITIONAL", "EVENT"] }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { rw_id: $.data.id }
            - call: "POST /feed-sessions"
              payload: { game_id: "${g_id}", rights_window_id: "${rw_id}", delivery_mode: "REALTIME", bandwidth_mbps: 20, window_start_utc: "2026-08-01T18:00:00Z", window_end_utc: "2026-08-01T18:30:00Z", requested_latency_ms: 250, scope: ["POSITIONAL"] }
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { fs_id: $.data.id, res_units: $.data.reserved_units }
            - call: "POST /feed-sessions/${fs_id}/usage-records"
              payload: { sampled_at_utc: "2026-08-01T18:05:00Z", bandwidth_mbps: 20, duration_seconds: 600, latency_p95_ms: 300 }
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { u1: $.data.units_charged }
            - call: "POST /feed-sessions/${fs_id}/usage-records"
              payload: { sampled_at_utc: "2026-08-01T18:15:00Z", bandwidth_mbps: 20, duration_seconds: 400, latency_p95_ms: 320 }
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { u2: $.data.units_charged }
            - call: "POST /feed-sessions/${fs_id}/usage-records"
              payload: { sampled_at_utc: "2026-08-01T18:25:00Z", bandwidth_mbps: 18, duration_seconds: 200, latency_p95_ms: 280 }
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { u3: $.data.units_charged }
          trigger:
            - call: "POST /feed-sessions/${fs_id}/terminate"
              as: Licensee
              as_user_id: "${lic_id}"
          assert:
            - "FeedSession.${fs_id}.latency_multiplier == 1.50"
            - "FeedSession.${fs_id}.duration_minutes == 30"
            - "FeedSession.${fs_id}.reserved_units == 900"
            - "FeedSession.${fs_id}.reserved_charge_cents == 19800"
            - "${u1} == 300 and ${u2} == 200 and ${u3} == 90"
            - "FeedSession.${fs_id}.metered_units == 590"
            - "FeedSession.${fs_id}.settled_charge_cents == 12980"
            - "FeedSession.${fs_id}.refunded_units == 310"
            - "FeedSession.${fs_id}.status == TERMINATED and FeedSession.${fs_id}.halt_reason == CLIENT_REQUEST"
            - "DataLicensee.${lic_id}.reserved_units == 0"
            - "DataLicensee.${lic_id}.consumed_units == 590"
            - "DataLicensee.${lic_id}.available_units == 4410"
            - "DataLicensee.${lic_id}.settled_charge_cents == 12980"
            - "RightsWindow.${rw_id}.active_feed_session_count == 0"

      - name: normalization_raw_generation_versus_canonical_season_same_segments
        grounds:
          - calculations.normalized_tracking_metric
          - entities.NormalizationRun.fields.normalized_value
          - entities.NormalizationRun.fields.drift_correction_pct
          - entities.Game.fields.tracking_generation
        distinguishing_aspect: |
          This instance lives in the historical game-metric domain (NormalizationRun on a
          COLLECTED Game) and the two variants differ in ROUNDING ORDER plus drift application:
          RAW_GENERATION rounds each of the four scaled segments to 2dp and sums them (271.33
          with drift 0.0) while CANONICAL_SEASON sums at full precision, scales once and applies
          the -0.6% G1 drift before a single terminal rounding (269.70) - a 1.63 delta on
          byte-identical input.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T12:00:00Z"
            - "Harbor Arena venue with one CERTIFIED installation and data_posture CERTIFIED"
            - "Game on tracking_generation G1 whose collection_status is COLLECTED (opened then closed)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:00:00Z" }
              as: LeagueDataOps
              as_user_id: "ops-01"
            - call: "POST /venues"
              payload: { name: "Harbor Arena", city: "Harbor", tracking_tech: "HYBRID", required_certified_installations: 1, transport_capacity_mbps: 100, min_achievable_latency_ms: 200 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { v_id: $.data.id }
            - call: "POST /installations"
              payload: { venue_id: "${v_id}", rig_label: "RIG-A", modality: "UWB_ANCHOR" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { i_id: $.data.id }
            - call: "POST /installations/${i_id}/calibration-runs"
              payload: { axis_rms_x_mm: 90.0, axis_rms_y_mm: 90.0, axis_rms_z_mm: 90.0, sample_count: 6000, reference_point_count: 16 }
              as: CalibrationEngineer
              as_user_id: "eng-01"
            - call: "POST /installations/${i_id}/certify"
              as: LeagueDataOps
              as_user_id: "ops-01"
            - call: "POST /clubs"
              payload: { name: "Harbor FC", market_code: "HBR" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { c_home: $.data.id }
            - call: "POST /clubs"
              payload: { name: "Summit SC", market_code: "SMT" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { c_away: $.data.id }
            - call: "POST /games"
              payload: { venue_id: "${v_id}", home_club_id: "${c_home}", away_club_id: "${c_away}", scheduled_start_utc: "2026-08-01T18:00:00Z", tracking_generation: "G1", licensable_minutes: 240 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { g_id: $.data.id }
            - call: "POST /games/${g_id}/open-collection"
              as: LeagueDataOps
              as_user_id: "ops-01"
            - call: "POST /games/${g_id}/close-collection"
              as: LeagueDataOps
              as_user_id: "ops-01"
          trigger:
            - call: "POST /games/${g_id}/normalization-runs"
              payload: { basis: "RAW_GENERATION", metric_code: "TOTAL_DISTANCE_M", segment_values: [123.456, 78.912, 45.678, 12.345] }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { n_raw: $.data.id, raw_value: $.data.normalized_value }
            - call: "POST /games/${g_id}/normalization-runs"
              payload: { basis: "CANONICAL_SEASON", metric_code: "TOTAL_DISTANCE_M", segment_values: [123.456, 78.912, 45.678, 12.345] }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { n_canon: $.data.id, canon_value: $.data.normalized_value }
          assert:
            - "NormalizationRun.${n_raw}.normalized_value == 271.33"
            - "NormalizationRun.${n_raw}.scale_factor_applied == 1.042"
            - "NormalizationRun.${n_raw}.drift_correction_pct == 0.0"
            - "NormalizationRun.${n_canon}.normalized_value == 269.70"
            - "NormalizationRun.${n_canon}.scale_factor_applied == 1.042"
            - "NormalizationRun.${n_canon}.drift_correction_pct == -0.6"
            - "${raw_value} - ${canon_value} == 1.63"
            - "NormalizationRun.${n_raw}.source_generation == G1 and NormalizationRun.${n_canon}.source_generation == G1"
            - "NormalizationRun.${n_raw}.mapping_version == 'MAP-2026.1'"

  # =========================================================================
  # RULE 2 — combinatorial_formula
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: normalization_rounding_order_isolated_on_generation_g3
        grounds:
          - calculations.normalized_tracking_metric
          - entities.NormalizationRun.fields.normalized_value
          - entities.NormalizationRun.fields.scale_factor_applied
        distinguishing_aspect: |
          Mode (b) - order of operations. On a G3 game both scale (1.000) and drift (0.0%) are
          neutral, so the ONLY surviving difference between the two bases is where the rounding
          happens: four 10.005 segments round up per segment to 10.01 each and sum to 40.04 under
          RAW_GENERATION, while summing first gives 40.02 under CANONICAL_SEASON. A reordering
          of round and sum changes the answer by exactly 0.02.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T12:00:00Z"
            - "Harbor Arena venue with one CERTIFIED installation and data_posture CERTIFIED"
            - "Game on tracking_generation G3 whose collection_status is COLLECTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:00:00Z" }
              as: LeagueDataOps
              as_user_id: "ops-01"
            - call: "POST /venues"
              payload: { name: "Harbor Arena", city: "Harbor", tracking_tech: "OPTICAL", required_certified_installations: 1, transport_capacity_mbps: 100, min_achievable_latency_ms: 200 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { v_id: $.data.id }
            - call: "POST /installations"
              payload: { venue_id: "${v_id}", rig_label: "RIG-A", modality: "OPTICAL_CAMERA" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { i_id: $.data.id }
            - call: "POST /installations/${i_id}/calibration-runs"
              payload: { axis_rms_x_mm: 75.0, axis_rms_y_mm: 75.0, axis_rms_z_mm: 75.0, sample_count: 6000, reference_point_count: 16 }
              as: CalibrationEngineer
              as_user_id: "eng-01"
            - call: "POST /installations/${i_id}/certify"
              as: LeagueDataOps
              as_user_id: "ops-01"
            - call: "POST /clubs"
              payload: { name: "Harbor FC", market_code: "HBR" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { c_home: $.data.id }
            - call: "POST /clubs"
              payload: { name: "Summit SC", market_code: "SMT" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { c_away: $.data.id }
            - call: "POST /games"
              payload: { venue_id: "${v_id}", home_club_id: "${c_home}", away_club_id: "${c_away}", scheduled_start_utc: "2026-08-01T18:00:00Z", tracking_generation: "G3", licensable_minutes: 240 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { g_id: $.data.id }
            - call: "POST /games/${g_id}/open-collection"
              as: LeagueDataOps
              as_user_id: "ops-01"
            - call: "POST /games/${g_id}/close-collection"
              as: LeagueDataOps
              as_user_id: "ops-01"
          trigger:
            - call: "POST /games/${g_id}/normalization-runs"
              payload: { basis: "RAW_GENERATION", metric_code: "SPRINT_DISTANCE_M", segment_values: [10.005, 10.005, 10.005, 10.005] }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { g3_raw: $.data.id }
            - call: "POST /games/${g_id}/normalization-runs"
              payload: { basis: "CANONICAL_SEASON", metric_code: "SPRINT_DISTANCE_M", segment_values: [10.005, 10.005, 10.005, 10.005] }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { g3_canon: $.data.id }
          assert:
            - "NormalizationRun.${g3_raw}.normalized_value == 40.04"
            - "NormalizationRun.${g3_canon}.normalized_value == 40.02"
            - "NormalizationRun.${g3_raw}.scale_factor_applied == 1.000 and NormalizationRun.${g3_canon}.scale_factor_applied == 1.000"
            - "NormalizationRun.${g3_raw}.drift_correction_pct == 0.0 and NormalizationRun.${g3_canon}.drift_correction_pct == 0.0"
            - "the 0.02 gap is attributable to rounding order alone: identical scale, identical drift, identical segments"

      - name: league_reserve_computed_on_gross_licensable_minutes_not_net_pool
        grounds:
          - calculations.rights_allocation_ledger
          - entities.Game.fields.league_reserve_minutes
          - entities.Game.fields.net_allocatable_minutes
          - entities.Game.fields.remaining_allocatable_minutes
          - validations[priority=80]
        distinguishing_aspect: |
          Mode (c) - a self-referential-looking dependency pinned by evaluation order: the 15%
          league reserve is taken from the GROSS 240 licensable minutes (ceil(36.0) = 36, net =
          204), never from the net pool it creates (which would give 240 - ceil(204*0.15) = 209
          net). A 204-minute broadcast window therefore exactly exhausts the net pool while a
          36-minute LEAGUE_ARCHIVE window still fits, because the reserve is a disjoint pool.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T12:00:00Z"
            - "Harbor Arena venue registered (no installations needed - rights allocation does not depend on posture)"
            - "Game between Harbor FC and Summit SC with licensable_minutes 240, collection_status SCHEDULED, no rights windows yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:00:00Z" }
              as: LeagueDataOps
              as_user_id: "ops-01"
            - call: "POST /venues"
              payload: { name: "Harbor Arena", city: "Harbor", tracking_tech: "HYBRID", required_certified_installations: 1, transport_capacity_mbps: 100, min_achievable_latency_ms: 200 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { v_id: $.data.id }
            - call: "POST /clubs"
              payload: { name: "Harbor FC", market_code: "HBR" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { c_home: $.data.id }
            - call: "POST /clubs"
              payload: { name: "Summit SC", market_code: "SMT" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { c_away: $.data.id }
            - call: "POST /games"
              payload: { venue_id: "${v_id}", home_club_id: "${c_home}", away_club_id: "${c_away}", scheduled_start_utc: "2026-08-01T18:00:00Z", tracking_generation: "G1", licensable_minutes: 240 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /games/${g_id}/rights-windows"
              payload: { rights_class: "BROADCAST_LIVE", holder_type: "LEAGUE", territory: "US", window_start_utc: "2026-08-01T18:00:00Z", window_end_utc: "2026-08-01T21:24:00Z", max_latency_ms: 400, allowed_scopes: ["POSITIONAL", "EVENT"] }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { rw_full: $.data.id, alloc_full: $.data.allocated_minutes }
            - call: "POST /games/${g_id}/rights-windows"
              payload: { rights_class: "BROADCAST_LIVE", holder_type: "LEAGUE", territory: "US", window_start_utc: "2026-08-01T22:00:00Z", window_end_utc: "2026-08-01T22:01:00Z", max_latency_ms: 400, allowed_scopes: ["POSITIONAL"] }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { err_pool: $.data.error_id }
            - call: "POST /games/${g_id}/rights-windows"
              payload: { rights_class: "LEAGUE_ARCHIVE", holder_type: "LEAGUE", territory: "GLOBAL", window_start_utc: "2026-08-01T18:00:00Z", window_end_utc: "2026-08-01T18:36:00Z", max_latency_ms: 5000, allowed_scopes: ["POSITIONAL", "EVENT"] }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { rw_arch: $.data.id, alloc_arch: $.data.allocated_minutes }
          assert:
            - "Game.${g_id}.league_reserve_minutes == 36"
            - "Game.${g_id}.net_allocatable_minutes == 204"
            - "${alloc_full} == 204"
            - "Game.${g_id}.allocated_minutes_total == 204"
            - "Game.${g_id}.remaining_allocatable_minutes == 0"
            - "${err_pool} == ERR_ALLOCATION_POOL_EXHAUSTED with HTTP 409 (one further minute of non-archive rights does not fit)"
            - "${alloc_arch} == 36"
            - "Game.${g_id}.league_reserve_allocated_minutes == 36"
            - "Game.${g_id}.remaining_allocatable_minutes == 0 after the archive window (the reserve pool is disjoint from the net pool)"
            - "Game.${g_id}.allocated_minutes_total == 204 (LEAGUE_ARCHIVE minutes never enter the net total)"

  # =========================================================================
  # RULE 3 — non_linear_state_machine
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: game_collection_and_certification_dimensions_advance_independently
        grounds:
          - state_machines.Game.certification_status_PENDING_to_PROVISIONAL
          - state_machines.Game.collection_status_LIVE_to_COLLECTED
          - state_machines.Game.certification_status_PROVISIONAL_to_OFFICIAL
          - state_machines.Game.collection_status_COLLECTED_to_ARCHIVED
          - entities.Game.fields.certification_status
          - entities.Game.fields.collection_status
        distinguishing_aspect: |
          Non-linearity by PARALLEL DIMENSIONS on one row: accepting a tag moves
          certification_status PENDING -> PROVISIONAL while collection_status stays LIVE, and
          closing collection moves collection_status LIVE -> COLLECTED while certification_status
          stays PROVISIONAL; only the certify call couples them, driving certification to OFFICIAL
          and dragging collection COLLECTED -> ARCHIVED in the same request.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T12:00:00Z"
            - "Harbor Arena venue with one CERTIFIED installation and data_posture CERTIFIED"
            - "Game LIVE / PENDING with one home-club player registered"
            - "one EventTag on the game, ACCEPTED by a reviewer who is not its tagger, confidence 0.95"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:00:00Z" }
              as: LeagueDataOps
              as_user_id: "ops-01"
            - call: "POST /venues"
              payload: { name: "Harbor Arena", city: "Harbor", tracking_tech: "HYBRID", required_certified_installations: 1, transport_capacity_mbps: 100, min_achievable_latency_ms: 200 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { v_id: $.data.id }
            - call: "POST /installations"
              payload: { venue_id: "${v_id}", rig_label: "RIG-A", modality: "UWB_ANCHOR" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { i_id: $.data.id }
            - call: "POST /installations/${i_id}/calibration-runs"
              payload: { axis_rms_x_mm: 90.0, axis_rms_y_mm: 90.0, axis_rms_z_mm: 90.0, sample_count: 6000, reference_point_count: 16 }
              as: CalibrationEngineer
              as_user_id: "eng-01"
            - call: "POST /installations/${i_id}/certify"
              as: LeagueDataOps
              as_user_id: "ops-01"
            - call: "POST /clubs"
              payload: { name: "Harbor FC", market_code: "HBR" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { c_home: $.data.id }
            - call: "POST /clubs"
              payload: { name: "Summit SC", market_code: "SMT" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { c_away: $.data.id }
            - call: "POST /players"
              payload: { club_id: "${c_home}", full_name: "Ada Ruiz", jersey_number: 9 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { p1: $.data.id }
            - call: "POST /games"
              payload: { venue_id: "${v_id}", home_club_id: "${c_home}", away_club_id: "${c_away}", scheduled_start_utc: "2026-08-01T18:00:00Z", tracking_generation: "G1", licensable_minutes: 240 }
              as: LeagueDataOps
