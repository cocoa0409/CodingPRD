              payload: { care_plan_id: "${cp_k}", vendor_id: "${vnd}", expected_care_plan_version: "${cp_k_v}", authorizing_decision_id: "${dec_l}", coverage_start: "2026-09-07T08:00:00Z", coverage_end: "2026-09-07T16:00:00Z", concurrent_caregivers: 1, hourly_cost_cents: 4000 }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with data.error_id == \"ERR_ENTITY_RELATIONSHIP_INVALID\" — ${dec_l} is RATIFIED but its conference belongs to ${cli_l}, not ${cli_k}"
            - "GET /care/service-authorizations?care_plan_id=${cp_k} returns 0 rows"
            - "CarePlan.${cp_k}.version == ${cp_k_v} — the rejected creation did not bump the parent"
            - "ConferenceDecision.${dec_l}.status is still \"RATIFIED\""

  # ===========================================================================
  - section: state_machines
    instances:

      - name: crisis_episode_created_in_declared_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.CrisisEpisode.initial_state
          - entities.CrisisEpisode.fields.assigned_care_manager_id
          - calculations.client_risk_posture
        distinguishing_aspect: "A newly created CrisisEpisode starts in OPEN with opened_at stamped from the logical clock, readmission_count 0, and immediately drives the client's risk_posture to CRISIS."
        test_recipe:
          setup:
            - "CareManager Dana and Client Mabel; logical clock at 2026-08-22T13:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-22T13:00:00Z" }
              as: PracticeAdmin
            - call: "POST /care/care-managers"
              payload: { full_name: "Dana Reyes", credential: "CMC", hourly_rate_cents: 22500 }
              as: PracticeAdmin
              captures: { cm_dana: $.data.id }
            - call: "POST /care/clients"
              payload: { full_name: "Mabel Aitchison", residence_setting: "PRIVATE_HOME" }
              as: PracticeAdmin
              captures: { cli: $.data.id }
          trigger:
            - call: "POST /care/crisis-episodes"
              payload: { client_id: "${cli}", trigger_type: "HOSPITAL_ADMISSION", hospital_name: "St. Brigid Regional" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { ep: $.data.id, ep_status: $.data.status }
          assert:
            - "HTTP 201 with data.status == \"OPEN\" (declared initial_state)"
            - "data.opened_at == \"2026-08-22T13:00:00Z\", data.stabilized_at == null, data.discharge_at == null, data.closed_at == null"
            - "data.readmission_count == 0 and data.assigned_care_manager_id == ${cm_dana} (taken from X-User-ID, not the body)"
            - "Client.${cli}.risk_posture == \"CRISIS\" immediately after the create"

      - name: assessment_cannot_be_withdrawn_after_acceptance
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Assessment.terminal_states
          - validations[priority=40]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "ACCEPTED is a declared terminal state of the Assessment machine, so a WITHDRAWN request from ACCEPTED returns ERR_INVALID_STATE_TRANSITION (409) and leaves comprehensive_acuity and Client.acuity_score untouched."
        test_recipe:
          setup:
            - "CareManager Dana (author), supervisor Iris (reviewer), Client Nils."
            - "One Assessment with all six domain scores at 3, driven DRAFT -> SUBMITTED -> ACCEPTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-23T09:00:00Z" }
              as: PracticeAdmin
            - call: "POST /care/care-managers"
              payload: { full_name: "Dana Reyes", credential: "CMC", hourly_rate_cents: 22500 }
              as: PracticeAdmin
              captures: { cm_dana: $.data.id }
            - call: "POST /care/care-managers"
              payload: { full_name: "Iris Vance", credential: "CCM", hourly_rate_cents: 30000, is_supervisor: true }
              as: PracticeAdmin
              captures: { cm_iris: $.data.id }
            - call: "POST /care/clients"
              payload: { full_name: "Nils Ackerman", residence_setting: "ASSISTED_LIVING" }
              as: PracticeAdmin
              captures: { cli: $.data.id }
            - call: "POST /care/assessments"
              payload: { client_id: "${cli}", care_manager_id: "${cm_dana}", domain_scores: { adl: 3, cognition: 3, medical_complexity: 3, social_support: 3, safety: 3, finances: 3 } }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { asm: $.data.id }
            - call: "PATCH /care/assessments/${asm}/state"
              payload: { to_state: "SUBMITTED" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { screening: $.data.screening_acuity }
            - call: "PATCH /care/assessments/${asm}/state"
              payload: { to_state: "ACCEPTED" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
              captures: { asm_v: $.data.version, comp: $.data.comprehensive_acuity }
          trigger:
            - call: "PATCH /care/assessments/${asm}/state"
              payload: { to_state: "WITHDRAWN" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { err: $.data.error_id }
            - call: "PATCH /care/assessments/${asm}/state"
              payload: { to_state: "SUBMITTED" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { err_2: $.data.error_id }
          assert:
            - "Both calls return HTTP 409 with data.error_id == \"ERR_INVALID_STATE_TRANSITION\""
            - "Assessment.${asm}.status is still \"ACCEPTED\" and Assessment.${asm}.version == ${asm_v} (no version bump on a rejected transition)"
            - "Assessment.${asm}.screening_acuity == 60 and Assessment.${asm}.comprehensive_acuity == 60 (identical only because all six domains are equal)"
            - "Client.${cli}.acuity_score == 60 and Client.${cli}.risk_posture == \"ROUTINE\""

