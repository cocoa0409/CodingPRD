              as: AccessScheduler
              captures: { ref_a: $.data.id }
            - call: "POST /referrals"
              payload: { member_id: "${m2}", requesting_department_id: "${d1}", target_department_id: "${d1}", service_code: "PRIMARY_CARE", referral_type: "INTERNAL", authorization_exception: false, exception_reason: "SERVICE_UNAVAILABLE_IN_NETWORK", external_contract_count: 0, expected_member_version: "${m2_v}" }
              as: AccessScheduler
              captures: { ref_b: $.data.id }
          trigger:
            - call: "POST /referrals/${ref_a}/authorize"
              payload: {}
              as: UtilizationReviewer
            - call: "POST /referrals/${ref_b}/deny"
              payload: {}
              as: UtilizationReviewer
            - call: "POST /regions/${r1}/quality-metrics"
              payload: { metric_code: "QUALITY_COMPOSITE", period: "2026-09", target_value: 80, accountable_provider_id: "${p1}" }
              as: QualityReviewBoard
              captures: { qm1: $.data.id }
            - call: "PATCH /_outcome-targets/${qm1}"
              payload: { measured_value: 80, weighted_component_score: 80 }
