  - section: consistency_model
    instances:
      - name: immediate_consistency_on_estimate_create
        claim_type: immediate_visibility
        grounds: [complexity_profile]
        distinguishing_aspect: "The POST /estimates 201 response body itself carries every computed field (impressions, costs, tier, total) — no re-fetch or delay is needed to observe the calculation results."
        test_recipe:
          setup: ["Customer and stock exist"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "IC Cust", credit_limit_cents: 100000000 }, as: PlantManager, captures: { cust: $.data.id } }
            - { call: "POST /paper-stocks", payload: { name: "70U", grade: "UNCOATED", cost_per_sheet_cents: 5, reorder_threshold_sheets: 0, reorder_quantity_sheets: 20000 }, as: PurchasingManager, captures: { stock: $.data.id } }
          trigger:
            - { call: "POST /estimates", payload: { customer_id: "${cust}", job_name: "IC", quantity_ordered: 1000, press_type: "WEB", binding_method: "SADDLE_STITCH", fulfillment_type: "SHIP", signatures: [ { name: "A", pages: 8, up_count: 1, paper_stock_id: "${stock}", make_ready_cents: 50000, rate_per_thousand_cents: 30000 } ], press_spoilage_pct: 0, bindery_spoilage_pct: 0, due_date: "2026-08-20T00:00:00Z" }, as: Estimator, captures: { tot: $.data.total_price_cents, sub: $.data.subtotal_cents } }
          assert:
            - "Create response: subtotal_cents == 85000 and total_price_cents == 85000 in the SAME response (no read-after-write)"
            - "status == DRAFT and version == 1 in the create response"

