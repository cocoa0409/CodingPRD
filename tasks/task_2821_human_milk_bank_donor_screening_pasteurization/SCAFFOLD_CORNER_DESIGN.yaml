  # ==========================================================================
  - section: state_machines
    instances:

      - name: shipment_receive_quarantine_branch_credits_half_the_final_amount
        claim_type: valid_transition
        grounds:
          - state_machines.Shipment.IN_TRANSIT_to_QUARANTINED
          - calculations.shipment_reimbursement
          - entities.Shipment.fields.credited_reimbursement_cents
          - entities.Donor.fields.reimbursement_balance_cents
        distinguishing_aspect: "A cooler with a cold-enough peak temperature (-18.0 C) but a 40-minute excursion takes the QUARANTINED fork, not the ACCEPTED one: final_reimbursement_cents is 1416 while credited_reimbursement_cents is round_half_up(1416 * 0.5) = 708, and only 708 reaches the donor ledger."
        test_recipe:
          setup:
            - "Clock 2026-08-05T08:00:00Z; donor DNR-0001 is QUALIFIED, lives in zone Z3 and has reimbursement_balance_cents 0."
            - "Shipment TRK-0001 carries 2 containers with dry ice, so the provisional amount is (2600/2*1.15 + 275) * 2 = 3540."
          setup_api_calls:
            - { call: "POST /milk-bank/_clock/set_current_utc", payload: { current_utc: "2026-08-05T08:00:00Z" }, as: MilkBankAdmin, as_user_id: "u-admin-1" }
            - { call: "POST /milk-bank/donors", payload: { donor_code: "DNR-0001", full_name: "Ana Ruiz", email: "ana.ruiz@example.org", zone_code: "Z3" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { d1: "$.data.id" } }
            - { call: "POST /milk-bank/donors/${d1}/health-history", payload: { medication_flag_count: 2, travel_risk_flag: false, tobacco_use: false, alcohol_units_per_week: 3, months_postpartum: 15 }, as: IntakeCoordinator, as_user_id: "u-intake-1" }
            - { call: "POST /milk-bank/donors/${d1}/serology-panels", payload: { collected_on: "2026-07-20", hiv_result: "NON_REACTIVE", htlv_result: "NON_REACTIVE", hbv_result: "NON_REACTIVE", hcv_result: "NON_REACTIVE", syphilis_result: "NON_REACTIVE" }, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/donors/${d1}/physician-approvals", payload: { physician_npi: "1234567893", approved_on: "2026-07-15" }, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/donors/${d1}/qualify", payload: {}, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/shipments", payload: { donor_id: "${d1}", tracking_code: "TRK-0001", container_count: 2, uses_dry_ice: true, declared_volume_ml: 1600, shipped_on: "2026-08-02" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { s1: "$.data.id" } }
          trigger:
            - { call: "POST /milk-bank/shipments/${s1}/receive", payload: { excursion_minutes: 40, arrival_max_temp_celsius: -18.0, verified_volume_ml: 1600 }, as: IntakeCoordinator, as_user_id: "u-intake-1" }
          assert:
            - "Shipment.${s1}.status == QUARANTINED"
            - "Shipment.${s1}.estimated_reimbursement_cents == 3540"
            - "Shipment.${s1}.final_reimbursement_cents == 1416"
            - "Shipment.${s1}.credited_reimbursement_cents == 708"
            - "Shipment.${s1}.excursion_minutes == 40"
            - "Shipment.${s1}.arrival_max_temp_celsius == -18.0"
            - "Shipment.${s1}.received_by_user_id == u-intake-1"
            - "Donor.${d1}.reimbursement_balance_cents == 708"

      - name: quarantine_accept_disposition_tops_up_ledger_by_the_difference
        claim_type: ledger_sync
        grounds:
          - state_machines.Shipment.QUARANTINED_to_ACCEPTED
          - entities.Shipment.fields.credited_reimbursement_cents
          - entities.Donor.fields.reimbursement_balance_cents
          - endpoints[POST /milk-bank/shipments/{id}/disposition]
        distinguishing_aspect: "Releasing a quarantined cooler raises credited_reimbursement_cents from 708 to 1416 and credits the donor by the 708-cent difference only, so the ledger reconciles to 1416 rather than double-crediting to 2124."
        test_recipe:
          setup:
            - "Clock 2026-08-05T08:00:00Z; donor DNR-0001 (zone Z3) is QUALIFIED and shipment TRK-0001 sits QUARANTINED with final 1416 and credited 708 after a 40-minute excursion."
            - "The donor ledger already holds the 708-cent half credit."
          setup_api_calls:
