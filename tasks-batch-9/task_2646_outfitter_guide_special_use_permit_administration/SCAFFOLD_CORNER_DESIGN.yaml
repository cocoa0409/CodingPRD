      - name: prospectus_actions_are_each_gated_on_a_different_slice_of_the_lifecycle
        claim_type: conditional_action
        grounds:
          - endpoints.POST /osup/prospectuses/{id}/close-submissions
          - endpoints.POST /osup/prospectuses/{id}/award
          - endpoints.POST /osup/prospectuses/{id}/cancel
          - endpoints.POST /osup/prospectuses/{id}/responses
          - validations[ERR_PROSPECTUS_NOT_OPEN]
          - validations[ERR_NO_RESPONSIVE_APPLICATIONS]
        distinguishing_aspect: |
          Four actions on one entity share a single error id but three DIFFERENT admissible state sets
          (responses and close-submissions need OPEN, award needs EVALUATING, cancel accepts either),
          so an implementation that hangs one "is the prospectus open?" guard on the whole resource is
          wrong in both directions at once — it would reject a legitimate award from EVALUATING and
          accept a response into EVALUATING. Beyond the state gate the award carries a separate
          business-constraint gate, and the two rejected awards must leave the governing use area's
          version untouched, proving nothing was half-applied.
        test_recipe:
          setup:
            - "BRW-02 offers 200 allocatable days (300 total - 100 reserved) under a PUBLISHED NEED_EXISTS assessment"
            - "Alpine's application for 250 days routes PROSPECTUS at screening (250 > 200) and sits in PROSPECTUS_QUEUED"
            - "Alpine has exactly one guide, QUALIFIED, and prequalification_insurance_verified true"
            - "two solicitations exist on the area, P1 and P2, each offering 300 days with deadline 2027-03-31"
