  - rule_id: non_linear_state_machine
    instances:
      - name: article_funding_and_compliance_dimensions_advance_independently
        grounds:
          - state_machines.Article.DRAFT_to_ELIGIBILITY_CHECKED
          - state_machines.Article.PENDING_DEPOSIT_to_EMBARGOED
          - state_machines.Article.FUNDING_REQUESTED_to_FUNDED
          - state_machines.RepositoryDeposit.SUBMITTED_to_INGESTED
          - calculations.mandate_compliance_and_embargo
          - concurrency_rules[deposit-create-stale-article]
        distinguishing_aspect: |
          The Article carries two orthogonal dimensions on one row: an ingest that moves
          compliance_status PENDING_DEPOSIT -> EMBARGOED leaves funding_status at
          ELIGIBILITY_CHECKED, and a later approval that moves funding_status
          ELIGIBILITY_CHECKED -> FUNDING_REQUESTED -> FUNDED leaves compliance_status at
          EMBARGOED — neither transition reads or writes the other dimension's state.
        test_recipe:
          setup:
            - "logical clock at 2026-08-05T00:00:00Z"
            - "publisher with one FULLY_OA journal, list_apc_cents 300000, required_embargo_months 12"
            - "author with a non-null ORCID, ELIGIBLE_FACULTY, annual cap 500000"
            - "GOLD_OA funder: max_embargo_months 6, deposit_deadline_days 90, license_required CC_BY, apc_allowable true"
            - "ACTIVE grant 2026-01-01..2027-12-31"
            - "APC fund FY2027, budget 1000000, priority 1, per-article cap 300000, eligible for ELIGIBLE_FACULTY"
            - "article accepted 2026-08-05 referencing that grant; compliance_status PENDING_DEPOSIT, deposit_deadline_on 2026-11-03, embargo_until 2027-02-05"
