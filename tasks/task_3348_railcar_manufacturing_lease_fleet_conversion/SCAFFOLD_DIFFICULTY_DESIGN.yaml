# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 depth test index (9 difficulty rules)
scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: quote_variant_divergence_wheelset_lapse
    grounds:
    - calculations.order_price_quote
    - entities.ProductionOrder.fields.unit_price_cents
    - validations[priority=14]
    distinguishing_aspect: 'Two valid price interpretations of the same block of component data diverge:

      the DRAFT forecast variant lapses the wheelset and casting contract prices once

      the order is more than 120 days old, raising unit_price_cents from 8250000 to

      8667000, while the committed variant keeps the locked prices. This is the

      cost-accounting domain (a ProductionOrder metric), not a fleet metric.

      '
    test_recipe:
      setup:
      - A BOX-100 car type exists with a bills-of-materials of 4 wheelsets, 2 castings and 1 coating,
        each component in stock.
      - The logical clock is at the startup default 2026-09-01T00:00:00Z, so an order taken that day is
        zero days old.
      - A SOLD production order of 10 cars is quoted on 2026-09-01, then the clock advances 153 days to
        2027-02-01 and the same order is quoted again.
      setup_api_calls:
      - call: POST /api/v1/car-types
        payload:
          model_code: BOX-100
          car_class: BOXCAR
          build_hours: 40
          regulatory_life_years: 40
          line_count_family: BOX_LINE
        as: ProductionPlanner
        captures:
          ct_box_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: WS-100
          component_class: WHEELSET
          unit_cost_cents: 180000
          lead_time_days: 30
          on_hand_qty: 100
        as: SupplyChainCoordinator
        captures:
          comp_w_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: CT-100
          component_class: CASTING
          unit_cost_cents: 90000
          lead_time_days: 20
          on_hand_qty: 100
        as: SupplyChainCoordinator
        captures:
          comp_c_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: CK-100
          component_class: COATING
          unit_cost_cents: 40000
          lead_time_days: 70
          on_hand_qty: 100
        as: SupplyChainCoordinator
        captures:
          comp_k_id: $.data.id
      - call: POST /api/v1/car-type-component-requirements
        payload:
          car_type_id: ${ct_box_id}
          component_id: ${comp_w_id}
          qty_per_car: 4
        as: ProductionPlanner
      - call: POST /api/v1/car-type-component-requirements
        payload:
          car_type_id: ${ct_box_id}
          component_id: ${comp_c_id}
          qty_per_car: 2
        as: ProductionPlanner
      - call: POST /api/v1/car-type-component-requirements
        payload:
          car_type_id: ${ct_box_id}
          component_id: ${comp_k_id}
          qty_per_car: 1
        as: ProductionPlanner
      - call: POST /api/v1/lessees
        payload:
          legal_name: Variant Rail Co
          credit_tier: A
          utilization_threshold_pct: 80
          credit_ceiling_cents: 50000000
        as: LeaseAdministrator
        captures:
          lessee_id: $.data.id
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/v1/production-orders
        payload:
          car_type_id: ${ct_box_id}
          quantity: 10
          planned_shop_days: 400
          disposition: SOLD
          priority_rank: 1
          order_date: '2026-09-01'
          required_delivery_date: '2026-12-01'
          lessee_id: ${lessee_id}
        as: ProductionPlanner
        captures:
          po_same_day_id: $.data.id
          unit_price_same_day: $.data.unit_price_cents
      trigger:
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2027-02-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/v1/production-orders
        payload:
          car_type_id: ${ct_box_id}
          quantity: 10
          planned_shop_days: 400
          disposition: SOLD
          priority_rank: 2
          order_date: '2026-09-01'
          required_delivery_date: '2027-04-01'
          lessee_id: ${lessee_id}
        as: ProductionPlanner
        captures:
          po_lapsed_id: $.data.id
          unit_price_lapsed: $.data.unit_price_cents
      assert:
      - 'Same-day forecast quote: production_order ${po_same_day_id} has unit_price_cents == 8250000'
      - 'Lapsed forecast quote: production_order ${po_lapsed_id} has unit_price_cents == 8667000'
      - Difference == 417000 cents, caused solely by the wheelset and casting price lapses at the 120-day
        horizon (day 153 > 120 in the order_price_quote forecast variant)
  - name: capital_allocation_retained_vs_sold_basis
    grounds:
    - calculations.lease_fleet_capital_allocation
    - entities.LeaseContract.fields.capital_allocation_cents
    - state_machines.ProductionOrder.IN_PRODUCTION_to_COMPLETED
    distinguishing_aspect: 'Two valid capital treatments diverge on the same contract: the retained_basis

      variant loads 5480000 cents of fleet capital for the two retained cars, while the

      sold_basis variant posts none for the sold car — the contract''s

      capital_allocation_cents stays 5480000 rather than rising to 8220000. This is the

      fleet-capital domain (a LeaseContract metric), not a production-order price.

      '
    test_recipe:
      setup:
      - A BOX-100 car type with a 4-wheelset, 2-casting, 1-coating bills-of-materials; components in stock;
        a confirmed coating purchase order covering the delivery window.
      - A lessee and one ACTIVE full-service contract capped at 100 cars.
      - One RETAINED order of 2 cars and one SOLD order of 1 car, both on the same car type.
      setup_api_calls:
      - call: POST /api/v1/car-types
        payload:
          model_code: BOX-100
          car_class: BOXCAR
          build_hours: 40
          regulatory_life_years: 40
          line_count_family: BOX_LINE
        as: ProductionPlanner
        captures:
          ct_box_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: WS-100
          component_class: WHEELSET
          unit_cost_cents: 180000
          lead_time_days: 30
          on_hand_qty: 200
        as: SupplyChainCoordinator
        captures:
          comp_w_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: CT-100
          component_class: CASTING
          unit_cost_cents: 90000
          lead_time_days: 20
          on_hand_qty: 200
        as: SupplyChainCoordinator
        captures:
          comp_c_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: CK-100
          component_class: COATING
          unit_cost_cents: 40000
          lead_time_days: 70
          on_hand_qty: 200
        as: SupplyChainCoordinator
        captures:
          comp_k_id: $.data.id
      - call: POST /api/v1/car-type-component-requirements
        payload:
          car_type_id: ${ct_box_id}
          component_id: ${comp_w_id}
          qty_per_car: 4
        as: ProductionPlanner
      - call: POST /api/v1/car-type-component-requirements
        payload:
          car_type_id: ${ct_box_id}
          component_id: ${comp_c_id}
          qty_per_car: 2
        as: ProductionPlanner
      - call: POST /api/v1/car-type-component-requirements
        payload:
          car_type_id: ${ct_box_id}
          component_id: ${comp_k_id}
          qty_per_car: 1
        as: ProductionPlanner
      - call: POST /api/v1/component-purchase-orders
        payload:
          component_id: ${comp_k_id}
          qty_ordered: 200
          unit_cost_cents: 40000
          order_date: '2026-09-01'
          expected_receipt_date: '2026-10-15'
        as: SupplyChainCoordinator
        captures:
          cpo_k_id: $.data.id
      - call: POST /api/v1/component-purchase-orders/${cpo_k_id}/confirm
        as: SupplyChainCoordinator
      - call: POST /api/v1/lessees
        payload:
          legal_name: Basis Rail Co
          credit_tier: A
          utilization_threshold_pct: 80
          credit_ceiling_cents: 50000000
        as: LeaseAdministrator
        captures:
          lessee_id: $.data.id
      - call: POST /api/v1/lease-contracts
        payload:
          lessee_id: ${lessee_id}
          lease_type: FULL_SERVICE
          per_diem_rate_cents: 20000
          liability_bearer: LESSOR
          term_start_date: '2026-09-01'
          term_end_date: '2028-09-01'
          fleet_car_cap: 100
        as: LeaseAdministrator
        captures:
          lt_c_id: $.data.id
      - call: POST /api/v1/lease-contracts/${lt_c_id}/activate
        as: LeaseAdministrator
        captures:
          lt_c_v: $.data.version
      - call: POST /api/v1/production-orders
        payload:
          car_type_id: ${ct_box_id}
          quantity: 2
          planned_shop_days: 80
          disposition: RETAINED
          priority_rank: 1
          order_date: '2026-09-01'
          required_delivery_date: '2026-12-01'
          lessee_id: ${lessee_id}
        as: ProductionPlanner
        captures:
          po_ret_id: $.data.id
      - call: POST /api/v1/production-orders/${po_ret_id}/reserve-components
        as: ProductionPlanner
      - call: POST /api/v1/production-orders/${po_ret_id}/release
        payload:
          lease_contract_id: ${lt_c_id}
        as: ProductionPlanner
      - call: POST /api/v1/production-lines/BOX_LINE/changeover
        payload:
          production_order_id: ${po_ret_id}
          scheduled_start_date: '2026-09-05'
          scheduled_end_date: '2026-09-13'
        as: ProductionPlanner
      trigger:
      - call: POST /api/v1/production-orders/${po_ret_id}/complete
        payload:
          completed_qty: 2
          lessee_id: ${lessee_id}
          completion_date: '2026-09-13'
        as: ProductionPlanner
        captures:
          lt_c_after_retained: $.data.version
      - call: POST /api/v1/production-orders
        payload:
          car_type_id: ${ct_box_id}
          quantity: 1
          planned_shop_days: 40
          disposition: SOLD
          priority_rank: 2
          order_date: '2026-09-01'
          required_delivery_date: '2026-12-01'
          lessee_id: ${lessee_id}
        as: ProductionPlanner
        captures:
          po_sold_id: $.data.id
      - call: POST /api/v1/production-orders/${po_sold_id}/reserve-components
        as: ProductionPlanner
      - call: POST /api/v1/production-orders/${po_sold_id}/release
        as: ProductionPlanner
      - call: POST /api/v1/production-lines/BOX_LINE/changeover
        payload:
          production_order_id: ${po_sold_id}
          scheduled_start_date: '2026-09-14'
          scheduled_end_date: '2026-09-15'
        as: ProductionPlanner
      - call: POST /api/v1/production-orders/${po_sold_id}/complete
        payload:
          completed_qty: 1
          lessee_id: ${lessee_id}
          completion_date: '2026-09-15'
        as: ProductionPlanner
      - call: GET /api/v1/lease-contracts/${lt_c_id}
        as: LeaseAdministrator
        captures:
          lt_c_capital_after_both: $.data.capital_allocation_cents
      assert:
      - 'After the RETAINED order completes 2 cars: lease_contract ${lt_c_id} capital_allocation_cents
        == 5480000'
      - 'After the SOLD order completes 1 car: capital_allocation_cents is still 5480000, not 8220000
        — the sold_basis variant posts no fleet capital'
      - Lessee ${lessee_id} outstanding_balance_cents == 2740000, charged only for the sold car
- rule_id: combinatorial_formula
  instances:
  - name: order_quote_line_rounding_order_pinned
    grounds:
    - calculations.order_price_quote
    - calculations.component_allocation
    - entities.Component.fields.unit_cost_cents
    distinguishing_aspect: 'Mode (b): nested rounding where the order matters. Each bills-of-materials
      line is

      ceiled to the next whole dollar BEFORE summing (66000, 205000 and 65000), so the

      order itself carries a rounding residue; summing first and rounding once at the end

      would produce a different unit_price_cents. The scaffold pins per-line ceil then sum.

      '
    test_recipe:
      setup:
      - A car type whose three component unit costs each carry a non-zero cent residue inside a line total.
      - The order is quoted while still DRAFT so the forecast variant applies; the clock sits at the startup
        default so no lapse term fires.
      setup_api_calls:
      - call: POST /api/v1/car-types
        payload:
          model_code: GON-100
          car_class: GONDOLA
          build_hours: 40
          regulatory_life_years: 40
          line_count_family: GON_LINE
        as: ProductionPlanner
        captures:
          ct_gon_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: WS-200
          component_class: WHEELSET
          unit_cost_cents: 16500
          lead_time_days: 10
          on_hand_qty: 100
        as: SupplyChainCoordinator
        captures:
          comp_w2_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: CT-200
          component_class: CASTING
          unit_cost_cents: 51250
          lead_time_days: 10
          on_hand_qty: 100
        as: SupplyChainCoordinator
        captures:
          comp_c2_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: CK-200
          component_class: COATING
          unit_cost_cents: 32145
          lead_time_days: 10
          on_hand_qty: 100
        as: SupplyChainCoordinator
        captures:
          comp_k2_id: $.data.id
      - call: POST /api/v1/car-type-component-requirements
        payload:
          car_type_id: ${ct_gon_id}
          component_id: ${comp_w2_id}
          qty_per_car: 4
        as: ProductionPlanner
      - call: POST /api/v1/car-type-component-requirements
        payload:
          car_type_id: ${ct_gon_id}
          component_id: ${comp_c2_id}
          qty_per_car: 4
        as: ProductionPlanner
      - call: POST /api/v1/car-type-component-requirements
        payload:
          car_type_id: ${ct_gon_id}
          component_id: ${comp_k2_id}
          qty_per_car: 2
        as: ProductionPlanner
      - call: POST /api/v1/lessees
        payload:
          legal_name: Rounding Rail Co
          credit_tier: A
          utilization_threshold_pct: 80
          credit_ceiling_cents: 50000000
        as: LeaseAdministrator
        captures:
          lessee_id: $.data.id
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /api/v1/production-orders
        payload:
          car_type_id: ${ct_gon_id}
          quantity: 1
          planned_shop_days: 40
          disposition: SOLD
          priority_rank: 1
          order_date: '2026-09-01'
          required_delivery_date: '2026-12-01'
          lessee_id: ${lessee_id}
        as: ProductionPlanner
        captures:
          po_round_id: $.data.id
          unit_price_round: $.data.unit_price_cents
      assert:
      - 'Per-line ceiling before summing: line values are 66000 (wheelset 4 x 16500), 205000 (casting
        4 x 51250) and 65000 (coating 2 x 32145)'
      - unit_price_cents == 2181000 for production_order ${po_round_id}
      - Summing first and rounding once would give 2181000 only if the residue vanished; the pinned per-line
        ceil order is what makes the figure well-defined
  - name: fleet_reconciliation_circular_order_pinned
    grounds:
    - calculations.fleet_capital_reconciliation
    - calculations.sale_gain_loss
    - entities.PortfolioLedger.fields.committed_capital_cents
    - state_machines.ProductionOrder.DRAFT_to_COMPONENT_RESERVED
    distinguishing_aspect: 'Mode (c): a circular-looking dependency. committed_basis_cents reads

      PortfolioLedger.committed_capital_cents, a field that is itself written by the

      retained-order completes that created the cars; the scaffold pins the evaluation

      order (on_hand first then reserved in component_allocation; committed capital first

      then the disposal subtraction in fleet_capital_reconciliation) so the value is

      well-defined. Summing in the other order changes drift_cents.

      '
    test_recipe:
      setup:
      - A car type, two components and a bills-of-materials; a lessee and one ACTIVE contract.
      - One RETAINED order of 1 car, reserved, released and completed so the ledger's committed capital
        is written before the reconciliation is read.
      - The logical clock still reads the startup default 2026-09-01T00:00:00Z.
      setup_api_calls:
      - call: POST /api/v1/car-types
        payload:
          model_code: BOX-300
          car_class: BOXCAR
          build_hours: 40
          regulatory_life_years: 40
          line_count_family: BOX_LINE
        as: ProductionPlanner
        captures:
          ct_box3_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: WS-300
          component_class: WHEELSET
          unit_cost_cents: 180000
          lead_time_days: 10
          on_hand_qty: 100
        as: SupplyChainCoordinator
        captures:
          comp_w3_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: CT-300
          component_class: CASTING
          unit_cost_cents: 152500
          lead_time_days: 10
          on_hand_qty: 100
        as: SupplyChainCoordinator
        captures:
          comp_c3_id: $.data.id
      - call: POST /api/v1/car-type-component-requirements
        payload:
          car_type_id: ${ct_box3_id}
          component_id: ${comp_w3_id}
          qty_per_car: 4
        as: ProductionPlanner
      - call: POST /api/v1/car-type-component-requirements
        payload:
          car_type_id: ${ct_box3_id}
          component_id: ${comp_c3_id}
          qty_per_car: 2
        as: ProductionPlanner
      - call: POST /api/v1/lessees
        payload:
          legal_name: Ledger Rail Co
          credit_tier: A
          utilization_threshold_pct: 80
          credit_ceiling_cents: 50000000
        as: LeaseAdministrator
        captures:
          lessee_id: $.data.id
      - call: POST /api/v1/lease-contracts
        payload:
          lessee_id: ${lessee_id}
          lease_type: FULL_SERVICE
          per_diem_rate_cents: 20000
          liability_bearer: LESSOR
          term_start_date: '2026-09-01'
          term_end_date: '2028-09-01'
          fleet_car_cap: 100
        as: LeaseAdministrator
        captures:
          lt_c_id: $.data.id
      - call: POST /api/v1/lease-contracts/${lt_c_id}/activate
        as: LeaseAdministrator
        captures:
          lt_c_v: $.data.version
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/v1/production-orders
        payload:
          car_type_id: ${ct_box3_id}
          quantity: 1
          planned_shop_days: 40
          disposition: RETAINED
          priority_rank: 1
          order_date: '2026-09-01'
          required_delivery_date: '2026-12-01'
          lessee_id: ${lessee_id}
        as: ProductionPlanner
        captures:
          po_ret3_id: $.data.id
          quote_ret3: $.data.unit_price_cents
      - call: POST /api/v1/production-orders/${po_ret3_id}/reserve-components
        as: ProductionPlanner
      - call: POST /api/v1/production-orders/${po_ret3_id}/release
        payload:
          lease_contract_id: ${lt_c_id}
        as: ProductionPlanner
      - call: POST /api/v1/production-lines/BOX_LINE/changeover
        payload:
          production_order_id: ${po_ret3_id}
          scheduled_start_date: '2026-09-05'
          scheduled_end_date: '2026-09-06'
        as: ProductionPlanner
      - call: POST /api/v1/production-orders/${po_ret3_id}/complete
        payload:
          completed_qty: 1
          lessee_id: ${lessee_id}
          completion_date: '2026-09-06'
        as: ProductionPlanner
        captures:
          car_ret3_id: $.data.id
      trigger:
      - call: GET /api/v1/lease-fleet-cars/${car_ret3_id}
        as: LeaseAdministrator
        captures:
          car_ret3_status: $.data.status
          car_ret3_acq: $.data.acquisition_cost_cents
      - call: POST /api/v1/lease-fleet-sales
        payload:
          lease_fleet_car_id: ${car_ret3_id}
          lease_contract_id: ${lt_c_id}
          buyer_name: Ledger Buyer
          sale_price_cents: 2000000
          writeback_liability_cents: 0
          sale_date: '2026-09-06'
        as: PortfolioManager
        captures:
          sale3_id: $.data.id
          sale3_gain: $.data.gain_loss_cents
      - call: POST /api/v1/lease-fleet-sales/${sale3_id}/settle
        as: PortfolioManager
      - call: GET /api/v1/portfolio-ledger/reconciliation
        as: PlatformAdmin
        captures:
          recon_basis: $.data.oldest_basis_cents
          recon_nbv: $.data.newest_basis_cents
          recon_drift: $.data.drift_cents
      assert:
      - 'Committed capital was written first: unit_price_cents == 2015000 so PortfolioLedger.committed_capital_cents
        == 2015000'
      - Sale ${sale3_id} gain_loss_cents == -15000 (2000000 price minus 2015000 book with zero elapsed
        depreciation)
      - Reconciliation ${recon_basis} == 15000, ${recon_nbv} == 0, ${recon_drift} == 15000 — the pinned
        evaluation order keeps committed_basis_cents as capital minus proceeds
- rule_id: non_linear_state_machine
  instances:
  - name: car_assignment_suspend_reassign_fork
    grounds:
    - state_machines.CarAssignment.ACTIVE_to_SUSPENDED
    - state_machines.CarAssignment.SUSPENDED_to_ACTIVE
    - state_machines.CarAssignment.ACTIVE_to_REASSIGNED
    - state_machines.CarAssignment.REASSIGNED_to_ACTIVE
    - entities.CarAssignment.fields.status
    - entities.LeaseFleetCar.fields.status
    - calculations.assignment_per_diem_accrual
    - validations[priority=11]
    distinguishing_aspect: 'CarAssignment is non-linear by a branching fork at ACTIVE into two branches
      with

      divergent side-effect sets: the SUSPENDED branch pulls the parent LeaseFleetCar to

      HELD and rejoins ACTIVE through POST /car-assignments/{id}/resume without minting a

      row, while the REASSIGNED branch instead mints a replacement CarAssignment on a

      second car and leaves the source placement retired - a fork with two cycles, not a

      linear A->B->C pipeline.

      '
    test_recipe:
      setup:
      - Logical clock at 2026-06-01T00:00:00Z; a BOXCAR car type BOX-100 (build_hours 4) whose bill of
        materials is one WHEELSET and one CASTING row, both in stock, with no COATING row.
      - A lessee with utilization_threshold_pct 60 and credit_ceiling_cents 50000000, and an ACTIVE FULL_SERVICE
        contract with per_diem_rate_cents 45000, liability_bearer LESSOR and fleet_car_cap 3.
      - A RETAINED production order of 3 cars is component-reserved, released against that contract and
        completed on 2026-06-01, producing 3 HELD fleet cars that are interchangeable for this recipe.
      - All three cars are placed under the contract from 2026-06-01; the third placement is suspended
        so its car sits HELD with the same lease_contract_id and is a legal reassign target.
      - The clock is advanced to 2026-06-11 so the suspension of the first placement accrues exactly 10
        days.
      setup_api_calls:
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-06-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/v1/car-types
        payload:
          model_code: BOX-100
          car_class: BOXCAR
          build_hours: 4
          regulatory_life_years: 25
          line_count_family: BOX_LINE
        as: ProductionPlanner
        captures:
          ct_id: $.data.id
