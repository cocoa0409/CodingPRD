  # --- orders ---
  - method: POST
    path: /pharmacy/medication-orders
    description: "Create a medication order; supersedes the patient's prior open order for the same drug; OCC-guarded on PatientProfile.version"
    roles: [Prescriber]
    code: 201
    input: [patient_id, drug_product_id, route, ordered_dose_mg, frequency_per_day, expected_patient_version, "duration_days?"]
    output: MedicationOrder
    side_effects:
      - "supersede prior open same-drug order (verification -> SUPERSEDED + cascade)"
      - "increments PatientProfile.version by 1"
  - method: GET
    path: /pharmacy/medication-orders/{id}
    description: "Fetch one order"
    roles: [PharmacyAdmin, Prescriber, Pharmacist, PharmacyTechnician, Nurse, DiversionOfficer]
    code: 200
    input: []
    output: MedicationOrder
    side_effects: []
  - method: GET
    path: /pharmacy/medication-orders
    description: "List orders with filters"
    roles: [PharmacyAdmin, Prescriber, Pharmacist, PharmacyTechnician, Nurse, DiversionOfficer]
    code: 200
    input: ["patient_id?", "prescriber_staff_id?", "drug_product_id?", "verification_status?", "fulfillment_status?", "substituted_by_protocol_id?", "limit?", "offset?"]
    output: MedicationOrder[]
    side_effects: []
  - method: POST
    path: /pharmacy/medication-orders/{id}/verify
    description: "Pharmacist verification: allergy screen, renal adjustment, dose rounding"
    roles: [Pharmacist]
    code: 200
    input: ["expected_order_version?"]
    output: MedicationOrder
    side_effects: ["renal_dose_adjustment", "dose_rounding", "fulfillment NONE -> QUEUED (IV) | READY (non-IV)", "increments MedicationOrder.version by 1"]
  - method: POST
    path: /pharmacy/medication-orders/{id}/resume
    description: "Resume an ON_HOLD order back to VERIFIED"
    roles: [Pharmacist]
    code: 200
    input: ["expected_order_version?"]
    output: MedicationOrder
    side_effects: ["renal_dose_adjustment", "dose_rounding", "increments MedicationOrder.version by 1"]
  - method: POST
    path: /pharmacy/medication-orders/{id}/discontinue
    description: "Prescriber discontinues an order; cascades to preparations, batch, hood session"
    roles: [Prescriber]
    code: 200
    input: [reason]
    output: MedicationOrder
    side_effects: ["preparation cancellation cascade L1", "batch recompute/auto-cancel cascade L2", "hood session cancel cascade L3", "increments MedicationOrder.version by 1"]
  - method: POST
    path: /pharmacy/medication-orders/{id}/administer
    description: "Nurse marks a dispensed order administered"
    roles: [Nurse]
    code: 200
    input: []
    output: MedicationOrder
    side_effects: ["fulfillment DISPENSED -> ADMINISTERED", "increments MedicationOrder.version by 1"]
  - method: POST
    path: /pharmacy/medication-orders/{id}/interventions
    description: "Document a clinical intervention; optionally place order on hold"
    roles: [Pharmacist]
    code: 201
    input: [intervention_type, note, "placed_on_hold?"]
    output: ClinicalIntervention
    side_effects: ["when placed_on_hold: verification -> ON_HOLD"]
  - method: GET
    path: /pharmacy/medication-orders/{id}/interventions
    description: "List interventions of an order"
    roles: [PharmacyAdmin, Prescriber, Pharmacist, PharmacyTechnician, Nurse, DiversionOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: ClinicalIntervention[]
    side_effects: []
  - method: GET
