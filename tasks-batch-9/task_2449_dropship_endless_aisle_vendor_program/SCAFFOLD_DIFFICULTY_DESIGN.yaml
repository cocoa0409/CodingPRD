- rule_id: non_linear_state_machine
  instances:
  - name: line_backorder_retransmit_cycle_returns_to_transmitted_on_fallback_vendor
    grounds:
    - state_machines.DropshipOrderLine.TRANSMITTED_to_BACKORDERED
    - state_machines.DropshipOrderLine.BACKORDERED_to_TRANSMITTED
    - entities.DropshipOrderLine.fields.transmit_attempt_count
    - entities.DropshipItem.fields.fallback_item_id
    - calculations.retransmit_target_selection
    - calculations.line_cost_and_order_margin
    - endpoints[POST /dropship/order-lines/{id}/retransmit]
    distinguishing_aspect: 'Cyclic shape: the line re-enters a state it has already occupied. TRANSMITTED -> BACKORDERED
      -> TRANSMITTED is not a forward walk, and the second visit to TRANSMITTED is materially different from the
      first - transmit_attempt_count is 2, acknowledged_at has been cleared back to null, and the line now points
      at the fallback offer on a WHOLESALE vendor, so unit_cost_cents flips from 21249 to 17100 while unit_retail_cents
      stays 24999.'
    test_recipe:
      setup:
      - Vendor V2 is ACTIVE with cost_model WHOLESALE at 1000 bps discount, cadence 120 minutes, safety buffer 2,
        oversell grace 3, default_lead_time_days 5, and one ACTIVE coverage row US-WEST / GROUND with transit_days
        2, cutoff_hour_utc 20 and surcharge_cents 500.
      - Offer I1B on V2 carries sku SKU-CHAIR-1, unit_retail_cents 24999 and unit_wholesale_cost_cents 19000, so
        its unit_cost_cents is 17100; it is ACTIVE with a fresh feed of 30 on-hand (available_units 31 after the
        buffer of 2 and the grace of 3).
      - Vendor V1 is ACTIVE, COMMISSION at 1500 bps, and offer I1 on V1 carries the same sku with fallback_item_id
        pointing at I1B; I1 is ACTIVE with a fresh feed of 60 on-hand (available_units 55).
      - Order ORD-CYCLE-1 carries one line of 2 units on I1; it is transmitted at 2026-08-03T10:00:00Z so the line
        reaches TRANSMITTED for the first time with transmit_attempt_count 1.
      - V1 then acknowledges the line with ack_disposition BACKORDERED, moving it to BACKORDERED.
      setup_api_calls:
      - call: POST /dropship/_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
