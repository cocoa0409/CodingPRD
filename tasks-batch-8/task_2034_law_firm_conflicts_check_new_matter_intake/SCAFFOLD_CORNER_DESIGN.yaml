            - { call: "POST /intake/attorneys", payload: { full_name: "Oscar Other", bar_number: "BAR005", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { other: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${px}", responsible_attorney_id: "${ra}", practice_group: "LITIGATION", matter_title: "M0" }, as: IntakeSpecialist, captures: { m0: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${py}", responsible_attorney_id: "${ra}", practice_group: "LITIGATION", matter_title: "M1" }, as: IntakeSpecialist, captures: { m1: $.data.id } }
            - { call: "POST /intake/matters/${m1}/parties", payload: { party_id: "${px}", role_in_matter: "ADVERSE" }, as: IntakeSpecialist }
            - { call: "POST /intake/matters/${m1}/conflict-checks", payload: { search_variant: "STRICT" }, as: IntakeSpecialist, captures: { chk: $.data.id } }
            - { call: "GET /intake/conflict-hits?check_id=${chk}", as: IntakeSpecialist, captures: { h: "$.data[0].id" } }
          trigger:
            - { call: "POST /intake/conflict-hits/${h}/review", payload: { decision: "CONFIRMED" }, as: ResponsibleAttorney, as_user_id: "${other}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_NOT_RESPONSIBLE_ATTORNEY"]

      - name: c_sod_self_approval_rejected
        claim_type: segregation_of_duties
        grounds: ["validations[priority=7]", "errors[ERR_SOD_SELF_APPROVAL]", "roles[ConflictsPartner]"]
        distinguishing_aspect: "The same attorney person who requested the waiver cannot approve it even while wearing the ConflictsPartner role hat: APPROVE with X-User-ID == requested_by_attorney_id fails ERR_SOD_SELF_APPROVAL; a DIFFERENT partner succeeds."
        test_recipe:
          setup: ["Matter M1 with CONFIRMED hit H; waiver W is CONSENTED (sent by RA, consent recorded by client)"]
          setup_api_calls:
            - { call: "POST /intake/parties", payload: { legal_name: "Sod X Inc", party_type: "CORPORATION" }, as: FirmAdmin, captures: { px: $.data.id } }
            - { call: "POST /intake/parties", payload: { legal_name: "Sod Y Corp", party_type: "CORPORATION" }, as: FirmAdmin, captures: { py: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Rachel Attorney", bar_number: "BAR001", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { ra: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Pat Partner", bar_number: "BAR002", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { cp: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${px}", responsible_attorney_id: "${ra}", practice_group: "LITIGATION", matter_title: "M0" }, as: IntakeSpecialist, captures: { m0: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${py}", responsible_attorney_id: "${ra}", practice_group: "LITIGATION", matter_title: "M1" }, as: IntakeSpecialist, captures: { m1: $.data.id } }
            - { call: "POST /intake/matters/${m1}/parties", payload: { party_id: "${px}", role_in_matter: "ADVERSE" }, as: IntakeSpecialist }
            - { call: "POST /intake/matters/${m1}/conflict-checks", payload: { search_variant: "STRICT" }, as: IntakeSpecialist, captures: { chk: $.data.id } }
            - { call: "GET /intake/conflict-hits?check_id=${chk}", as: IntakeSpecialist, captures: { h: "$.data[0].id" } }
            - { call: "POST /intake/conflict-hits/${h}/review", payload: { decision: "CONFIRMED" }, as: ResponsibleAttorney, as_user_id: "${ra}" }
            - { call: "POST /intake/matters/${m1}/waiver-requests", payload: { conflict_hit_id: "${h}", proposed_terms: "t" }, as: ResponsibleAttorney, as_user_id: "${ra}", captures: { w: $.data.id } }
            - { call: "POST /intake/waiver-requests/${w}/transition", payload: { action: "SEND" }, as: ResponsibleAttorney, as_user_id: "${ra}" }
            - { call: "POST /intake/waiver-requests/${w}/transition", payload: { action: "RECORD_CONSENT", consent_document_ref: "doc-1" }, as: Client, as_user_id: "${py}", captures: { st_c: $.data.status } }
          trigger:
            - { call: "POST /intake/waiver-requests/${w}/transition", payload: { action: "APPROVE" }, as: ConflictsPartner, as_user_id: "${ra}", captures: { err: $.data.error_id } }
            - { call: "POST /intake/waiver-requests/${w}/transition", payload: { action: "APPROVE" }, as: ConflictsPartner, as_user_id: "${cp}", captures: { st_ok: $.data.status, ap_by: $.data.approved_by_attorney_id } }
          assert:
