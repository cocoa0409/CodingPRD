        grounds:
          - errors.ERR_JUDGE_NOT_FOUND
          - errors.ERR_CONTINUANCE_NOT_FOUND
          - errors.ERR_VENUE_MOTION_NOT_FOUND
          - errors.ERR_APPEAL_NOT_FOUND
          - errors.ERR_MOTION_NOT_FOUND
          - errors.ERR_NOTICE_NOT_FOUND
          - errors.ERR_DECISION_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "Existence (priority 3) precedes ownership and state: action endpoints addressed at unallocated ids answer their specific 404 — including body foreign keys (unknown judge on assign-judge, unknown decision on appeal filing)."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One court, one judge, one filed case."]
