  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: distribution_half_open_window_collides_but_touching_endpoints_do_not
        grounds:
          - calculations.distribution_effective_window
          - validations[priority=15]
          - entities.SponsorDistribution.fields.effective_until
          - errors[ERR_DISTRIBUTION_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics A: a HALF-OPEN [effective_from, effective_until)
          occupation of the (Sponsor, Model) resource with NO buffer, where
          adjacency is legal. A window starting 2026-05-01 collides with the
          existing 2026-01-01..2026-06-01 window, while one starting exactly on
          2026-06-01 — the excluded endpoint — is accepted.
        test_recipe:
          setup:
            - "ModelVersion v1 of Model CORE is PUBLISHED"
            - "One PENDING distribution to sponsor NRTH occupies 2026-01-01 inclusive to 2026-06-01 exclusive"
          setup_api_calls:
            - call: "POST /sma/securities"
              payload: { ticker: "ALFA", name: "Alfa Industrials", asset_class: "US_EQUITY", last_price_cents: 10000 }
