            - { call: "POST /referrals", payload: { participant_id: "${part_id}", court_case_number: "CR-D17", offense_class: "MISDEMEANOR", hours_ordered: 20, deadline_date: "2026-12-31T00:00:00Z", indigency_status: "NONE" }, as: CourtClerk, as_user_id: "clerk-1", captures: { ref_id: "$.data.id", ref_v: "$.data.version" } }
            - { call: "POST /fee-conversions", payload: { referral_id: "${ref_id}", hours_to_convert: 4, expected_referral_version: "${ref_v}" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { fee_id: "$.data.id" } }
          trigger:
            - { call: "POST /fee-conversions/${fee_id}/approve", payload: {}, as: ProgramCoordinator, as_user_id: "coord-1", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_SELF_APPROVAL"
            - "http status == 403"

  # ---------------------------------------------------------------- Endpoints
  - section: endpoints
    instances:
      - name: list_referrals_returns_pagination_envelope
        claim_type: Listing
        grounds: [endpoints]
        distinguishing_aspect: "GET /referrals returns an array with total_count and has_more in meta/pagination fields."
        test_recipe:
          setup: ["Two referrals for one participant."]
          setup_api_calls:
            - { call: "POST /participants", payload: { full_name: "Pat Doe", date_of_birth: "1990-01-01T00:00:00Z", contact_email: "pat@example.org" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { part_id: "$.data.id" } }
            - { call: "POST /referrals", payload: { participant_id: "${part_id}", court_case_number: "CR-D18", offense_class: "MISDEMEANOR", hours_ordered: 8, deadline_date: "2026-12-31T00:00:00Z", indigency_status: "NONE" }, as: CourtClerk, as_user_id: "clerk-1" }
            - { call: "POST /referrals", payload: { participant_id: "${part_id}", court_case_number: "CR-D19", offense_class: "FELONY", hours_ordered: 40, deadline_date: "2026-12-31T00:00:00Z", indigency_status: "PARTIAL" }, as: CourtClerk, as_user_id: "clerk-1" }
          trigger:
            - { call: "GET /referrals", payload: { participant_id: "${part_id}", limit: 10, offset: 0 }, as: ProgramCoordinator, as_user_id: "coord-1" }
          assert:
            - "response total_count == 2"
            - "response has_more == false"

      - name: pagination_invalid_limit_zero_rejected
        claim_type: Listing
        grounds: ['errors[ERR_PAGINATION_INVALID]']
        distinguishing_aspect: "GET /participants with limit 0 (below min 1) returns ERR_PAGINATION_INVALID (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /participants", payload: { limit: 0 }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_PAGINATION_INVALID"

      - name: filter_placements_by_referral_reverse_reachability
        claim_type: Cross-reference link
        grounds: [entities.Placement.fields.referral_id, endpoints]
        distinguishing_aspect: "GET /placements?referral_id={id} returns the placement children of a referral (FK reverse reachability)."
        test_recipe:
          setup: ["A referral with one placement."]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Green Park", agency_type: "NONPROFIT", address: "1 Main St", capacity_slots: 5 }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { site_id: "$.data.id" } }
            - { call: "POST /supervisors", payload: { site_id: "${site_id}", full_name: "Sam Sup", max_concurrent_participants: 5 }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { sup_id: "$.data.id" } }
            - { call: "POST /participants", payload: { full_name: "Pat Doe", date_of_birth: "1990-01-01T00:00:00Z", contact_email: "pat@example.org" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { part_id: "$.data.id" } }
            - { call: "POST /referrals", payload: { participant_id: "${part_id}", court_case_number: "CR-D20", offense_class: "MISDEMEANOR", hours_ordered: 20, deadline_date: "2026-12-31T00:00:00Z", indigency_status: "NONE" }, as: CourtClerk, as_user_id: "clerk-1", captures: { ref_id: "$.data.id" } }
            - { call: "POST /placements", payload: { referral_id: "${ref_id}", site_id: "${site_id}", supervisor_id: "${sup_id}" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { plc_id: "$.data.id" } }
          trigger:
            - { call: "GET /placements", payload: { referral_id: "${ref_id}" }, as: ProgramCoordinator, as_user_id: "coord-1" }
          assert:
            - "response total_count == 1"
            - "response data[0].id == ${plc_id}"

      - name: referral_summary_reports_hours_breakdown
        claim_type: Computed read
        grounds: [endpoints, entities.Referral.fields.hours_outstanding]
        distinguishing_aspect: "GET /referrals/{id}/summary reports hours_ordered, hours_completed, hours_converted, hours_outstanding, fees_settled_cents for reporting."
        test_recipe:
          setup: ["A fresh referral hours_ordered 12, nothing served."]
          setup_api_calls:
            - { call: "POST /participants", payload: { full_name: "Pat Doe", date_of_birth: "1990-01-01T00:00:00Z", contact_email: "pat@example.org" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { part_id: "$.data.id" } }
            - { call: "POST /referrals", payload: { participant_id: "${part_id}", court_case_number: "CR-D21", offense_class: "MISDEMEANOR", hours_ordered: 12, deadline_date: "2026-12-31T00:00:00Z", indigency_status: "NONE" }, as: CourtClerk, as_user_id: "clerk-1", captures: { ref_id: "$.data.id" } }
          trigger:
            - { call: "GET /referrals/${ref_id}/summary", payload: {}, as: CourtClerk, as_user_id: "clerk-1" }
          assert:
            - "response data.hours_ordered == 12"
            - "response data.hours_completed == 0"
            - "response data.hours_outstanding == 12"
            - "response data.status == ACTIVE"

  # ------------------------------------------------ Cross-Cutting: OCC layer
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_referral_version_on_fee_create_rejected
        claim_type: optimistic_concurrency
        grounds: ['concurrency_rules[fee-conversion-create-stale-referral]', 'errors[ERR_STALE_REFERRAL_VERSION]']
        distinguishing_aspect: "A second FeeConversion create carrying the pre-create referral version (already superseded by the first create) is rejected ERR_STALE_REFERRAL_VERSION (412)."
        test_recipe:
          setup: ["Referral at version 1; one fee conversion created (bumps version to 2); a second create reuses the stale version 1."]
          setup_api_calls:
            - { call: "POST /participants", payload: { full_name: "Pat Doe", date_of_birth: "1990-01-01T00:00:00Z", contact_email: "pat@example.org" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { part_id: "$.data.id" } }
            - { call: "POST /referrals", payload: { participant_id: "${part_id}", court_case_number: "CR-D22", offense_class: "MISDEMEANOR", hours_ordered: 20, deadline_date: "2026-12-31T00:00:00Z", indigency_status: "NONE" }, as: CourtClerk, as_user_id: "clerk-1", captures: { ref_id: "$.data.id", ref_v0: "$.data.version" } }
            - { call: "POST /fee-conversions", payload: { referral_id: "${ref_id}", hours_to_convert: 4, expected_referral_version: "${ref_v0}" }, as: Participant, as_user_id: "${part_id}", captures: { fee_a: "$.data.id" } }
          trigger:
            - { call: "POST /fee-conversions", payload: { referral_id: "${ref_id}", hours_to_convert: 6, expected_referral_version: "${ref_v0}" }, as: Participant, as_user_id: "${part_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_STALE_REFERRAL_VERSION"
            - "http status == 412"

      - name: occ_matching_referral_version_supersedes_prior
        claim_type: optimistic_concurrency
        grounds: ['concurrency_rules[fee-conversion-create-stale-referral]', 'state_machines.FeeConversion.REQUESTED_to_DENIED']
        distinguishing_aspect: "A second FeeConversion create carrying the current (post-first-create) referral version succeeds and supersedes the prior REQUESTED conversion (marked DENIED)."
        test_recipe:
          setup: ["Referral; first conversion created; referral re-read for its new version; second create with the fresh version."]
          setup_api_calls:
            - { call: "POST /participants", payload: { full_name: "Pat Doe", date_of_birth: "1990-01-01T00:00:00Z", contact_email: "pat@example.org" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { part_id: "$.data.id" } }
            - { call: "POST /referrals", payload: { participant_id: "${part_id}", court_case_number: "CR-D23", offense_class: "MISDEMEANOR", hours_ordered: 20, deadline_date: "2026-12-31T00:00:00Z", indigency_status: "NONE" }, as: CourtClerk, as_user_id: "clerk-1", captures: { ref_id: "$.data.id", ref_v0: "$.data.version" } }
            - { call: "POST /fee-conversions", payload: { referral_id: "${ref_id}", hours_to_convert: 4, expected_referral_version: "${ref_v0}" }, as: Participant, as_user_id: "${part_id}", captures: { fee_a: "$.data.id" } }
            - { call: "GET /referrals/${ref_id}", payload: {}, as: ProgramCoordinator, as_user_id: "coord-1", captures: { ref_v1: "$.data.version" } }
          trigger:
            - { call: "POST /fee-conversions", payload: { referral_id: "${ref_id}", hours_to_convert: 6, expected_referral_version: "${ref_v1}" }, as: Participant, as_user_id: "${part_id}", captures: { fee_b: "$.data.id" } }
          assert:
            - "http status == 201"
            - "FeeConversion.${fee_a}.status == DENIED"
            - "FeeConversion.${fee_b}.status == REQUESTED"

  # ----------------------------------------------- Excluded (covered by §1.8)
  - section: state_machines
    instances:
      - name: error_session_overlap_covered
        claim_type: Violation to Error
        grounds: ['errors[ERR_SESSION_OVERLAP]']
        excluded_because:
          difficulty_instance: resource_temporal_overlap / rto_participant_rest_buffer_violation
          rationale: "ERR_SESSION_OVERLAP is the asserted failure path of the participant rest-buffer difficulty instance."
      - name: error_site_capacity_exceeded_covered
        claim_type: Violation to Error
        grounds: ['errors[ERR_SITE_CAPACITY_EXCEEDED]']
        excluded_because:
          difficulty_instance: resource_temporal_overlap / rto_site_capacity_aggregate_overlap
          rationale: "ERR_SITE_CAPACITY_EXCEEDED is asserted by the site aggregate-capacity difficulty instance."
      - name: error_no_remaining_hours_covered
        claim_type: Violation to Error
        grounds: ['errors[ERR_NO_REMAINING_HOURS]']
        excluded_because:
          difficulty_instance: boundary_precision_check / bpc_fee_pay_zero_outstanding_rejected
          rationale: "ERR_NO_REMAINING_HOURS is asserted by the zero-outstanding boundary difficulty instance."
      - name: completion_cascade_certificate_covered
        claim_type: Bubble up
        grounds: [state_machines.Referral.ACTIVE_to_COMPLETED]
        excluded_because:
          difficulty_instance: transitive_cascade / tc_verify_completes_referral_issues_cert_completes_placement
          rationale: "Auto-completion, certificate issuance, and placement completion are asserted by the depth-4 cascade instance."
      - name: reportback_cascade_covered
        claim_type: Cascade down
        grounds: [state_machines.Placement.ACTIVE_to_SUSPENDED]
        excluded_because:
          difficulty_instance: transitive_cascade / tc_reportback_suspends_placement_cancels_scheduled_sessions
          rationale: "Suspension cascade and session cancellation are asserted by the report-back cascade instance."
