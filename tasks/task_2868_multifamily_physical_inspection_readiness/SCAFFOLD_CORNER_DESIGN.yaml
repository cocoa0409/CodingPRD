          rationale: "The tier boundary at 30 / 31 declared units is asserted on both sides by the named §1.8 instance."

      - name: corner_weighted_scoring_five_factor_product
        claim_type: weighted_scoring
        grounds:
          - calculations.deficiency_points_deducted
        excluded_because:
          difficulty_instance: combinatorial_formula / deficiency_points_five_factor_product_with_occupancy_branch_and_cap
          rationale: "Multiplier interaction, rounding order and the 40.00 cap are asserted by the named §1.8 instance."

      - name: corner_waterfall_allocation_remainder_walk
        claim_type: waterfall_allocation
        grounds:
          - calculations.capital_reserve_allocation
        excluded_because:
          difficulty_instance: combinatorial_formula / capital_reserve_allocation_floor_then_remainder_walk
          rationale: "Floor-then-remainder ordering and the per-item cents are asserted by the named §1.8 instance."

      - name: corner_constraint_propagation_posture_chain
        claim_type: constraint_propagation
        grounds:
          - calculations.property_readiness_posture
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_a_life_threatening_record_reaches_sweep_urgency_five_links
          rationale: "Propagation through deficiency, inspection, property, work order and sweep is asserted by the named §1.8 instance."

      - name: corner_variant_divergence_provisional_versus_final
        claim_type: variant_divergence
        grounds:
          - calculations.inspection_score.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / inspection_score_provisional_vs_final_diverge_on_unreplaced_refusal
          rationale: "Both variants and their delta on the same data are asserted by the named §1.8 instance."

      - name: corner_variant_selection_recurrence_basis
        claim_type: variant_selection
        grounds:
          - calculations.capital_need_recurrence_count.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / capital_recurrence_inspection_scoped_vs_calendar_scoped_diverge
          rationale: "Basis selection per request and the divergent recurrence counts are asserted by the named §1.8 instance."

      - name: corner_reconciliation_rescore_after_granted_appeal
        claim_type: reconciliation
        grounds:
          - calculations.inspection_score
          - entities.Inspection.fields.rescored_at
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_b_granted_technical_appeal_void_rewrites_score_and_posture
          rationale: "The rescore delta reaching Property.last_final_score is asserted by the named §1.8 instance."

  - section: validations
    instances:
      - name: finding_outside_the_planned_area_scope_returns_area_out_of_scope
        claim_type: violation_to_error
        grounds:
          - validations[priority=71]
          - errors[ERR_AREA_OUT_OF_SCOPE]
          - entities.SelfAssessmentSweep.fields.planned_area_scope
        distinguishing_aspect: |
          A UNIT_ONLY sweep admits only UNIT findings, so an INSIDE finding must fail with
          ERR_AREA_OUT_OF_SCOPE (422) even though the definition itself is INSIDE and therefore
          passes the priority-42 area-match rule. The two rules must not be conflated.
        test_recipe:
          setup:
            - "ADOPTED NSPIRE-2026 with LT_GAS and MOD_HANDRAIL (INSIDE)."
            - "Property Cedar Walk with unit 101 and an IN_PROGRESS sweep whose planned_area_scope is UNIT_ONLY."
          setup_api_calls:
            - call: "POST /inspection-standards"
              payload: { code: "NSPIRE-2026", name: "NSPIRE 2026", effective_date: "2026-01-01T00:00:00.000Z", unit_weight_pct: 50.00, inside_weight_pct: 30.00, outside_weight_pct: 20.00 }
              as: PlatformAdmin
              captures: { std_id: $.data.id }
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "LT_GAS", name: "Gas leak at range connection", inspectable_area: "UNIT", severity: "LIFE_THREATENING", base_point_value: 10.00, correction_deadline_hours: 24 }
              as: PlatformAdmin
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "MOD_HANDRAIL", name: "Loose stairwell handrail", inspectable_area: "INSIDE", severity: "MODERATE", base_point_value: 6.00, correction_deadline_hours: 720 }
              as: PlatformAdmin
              captures: { dd_mod: $.data.id }
            - call: "POST /inspection-standards/${std_id}/adopt"
              payload: { adopted_at: "2026-01-02T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Cedar Walk", total_unit_count: 1, capital_reserve_cents: 500000, owner_contact_email: "owner@cedar.example" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "101", bedroom_count: 1, occupancy_status: "OCCUPIED" }
              as: PlatformAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /self-assessment-sweeps"
              payload: { property_id: "${prop_id}", window_start: "2026-08-02T00:00:00.000Z", window_end: "2026-08-20T00:00:00.000Z", planned_area_scope: "UNIT_ONLY" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { sw_id: $.data.id }
            - call: "POST /self-assessment-sweeps/${sw_id}/start"
              payload: { started_at: "2026-08-02T08:00:00.000Z" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { sw_v1: $.data.version }
          trigger:
            - call: "POST /self-assessment-sweeps/${sw_id}/findings"
              payload: { expected_sweep_version: "${sw_v1}", defect_definition_id: "${dd_mod}", inspectable_area: "INSIDE", observed_at: "2026-08-03T09:00:00.000Z" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
          assert:
            - "the trigger returns HTTP 422 with error_id ERR_AREA_OUT_OF_SCOPE"
            - "SelfAssessmentSweep.${sw_id}.version == ${sw_v1}"
            - "SelfAssessmentSweep.${sw_id}.generated_work_order_count == 0"
            - "GET /deficiencies?sweep_id=${sw_id} has total_count == 0"

      - name: unit_area_finding_without_unit_id_returns_area_mismatch
        claim_type: conditional
        grounds:
          - validations[priority=42]
          - errors[ERR_AREA_MISMATCH]
        distinguishing_aspect: |
          The rule is conditional on the submitted area: unit_id is required exactly when
          inspectable_area == UNIT and forbidden otherwise, so a UNIT finding with no unit_id must
          fail with ERR_AREA_MISMATCH (422) rather than being silently attributed to the property.
        test_recipe:
          setup:
            - "ADOPTED NSPIRE-2026 with LT_GAS and SEV_WINDOW (UNIT)."
            - "Property Cedar Walk with unit 101 and an IN_PROGRESS ALL_AREAS sweep."
          setup_api_calls:
            - call: "POST /inspection-standards"
              payload: { code: "NSPIRE-2026", name: "NSPIRE 2026", effective_date: "2026-01-01T00:00:00.000Z", unit_weight_pct: 50.00, inside_weight_pct: 30.00, outside_weight_pct: 20.00 }
