              as: ComplianceManager
              captures: { yr: $.data.id }
          trigger:
            - call: "POST /rfs/retirement-batches"
              payload: { obligation_year_id: "${yr}", category: "ADVANCED", d_code: "D6", rin_qty: 10 }
              as: ComplianceManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger error_id == ERR_D_CODE_NOT_ELIGIBLE"

      - name: state_priority_beats_fiscal_pair
        claim_type: priority_ordering
        grounds: ["validations[priority=8]", "validations[priority=12]"]
        distinguishing_aspect: "Covered by difficulty instance batch_resubmit_state_beats_carryover_fiscal."
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / batch_resubmit_state_beats_carryover_fiscal
          rationale: "Dual-failure state-vs-fiscal ordering asserted there."

      - name: safety_priority_beats_temporal_pair
        claim_type: priority_ordering
        grounds: ["validations[priority=9]", "validations[priority=11]"]
        distinguishing_aspect: "Covered by difficulty instance verify_safety_beats_temporal_window."
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / verify_safety_beats_temporal_window
          rationale: "Dual-failure safety-vs-temporal ordering asserted there."

      - name: annual_quarter_end_date_forbidden
        claim_type: conditional_validation
        grounds: ["validations[priority=5]", entities.ComplianceReport.fields.quarter_end_date]
        distinguishing_aspect: "Conditional field rule: quarter_end_date is REQUIRED for QUARTERLY and FORBIDDEN for ANNUAL reports."
        test_recipe:
          setup: ["account + year exist"]
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-VAL-5" }
              as: OpsAdmin
              captures: { acct: $.data.id }
            - call: "POST /rfs/obligation-years"
              payload: { account_id: "${acct}", year: 2026, projected_volume_gal: 1000, std_cellulosic_pct: 10.0, std_biomass_diesel_pct: 20.0, std_advanced_pct: 30.0, std_total_pct: 40.0 }
              as: ComplianceManager
              captures: { yr: $.data.id, yr_v: $.data.version }
          trigger:
            - call: "POST /rfs/compliance-reports"
              payload: { obligation_year_id: "${yr}", report_type: "ANNUAL", quarter_end_date: "2026-06-30T00:00:00Z", expected_obligation_year_version: "${yr_v}" }
              as: ComplianceManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger error_id == ERR_INVALID_REQUEST (quarter_end_date forbidden for ANNUAL)"

  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: position_and_exposure_computed_reads
        claim_type: computed_read
        grounds: ["endpoints[GET /rfs/compliance-accounts/{id}/position]", "endpoints[GET /rfs/compliance-accounts/{id}/exposure]"]
        distinguishing_aspect: "Covered by calculation corner instances position_input_set_filtering_by_status and exposure_mark_to_market_weighted_buckets which read these endpoints."
        excluded_because:
          difficulty_instance: combinatorial_formula / per_lot_generation_rounding_mode_b
          rationale: "Position read asserted in the rounding instance; exposure read asserted in the exposure corner instance (exposure_mark_to_market_weighted_buckets)."

      - name: report_create_supersedes_prior_draft
        claim_type: conditional_action
        grounds: ["endpoints[POST /rfs/compliance-reports]", state_machines.ComplianceReport.DRAFT_to_SUPERSEDED]
        distinguishing_aspect: "Create-with-supersede semantics: new same-type report succeeds with a fresh year version and flips the prior DRAFT to SUPERSEDED; blocked while a same-type SUBMITTED report exists."
        test_recipe:
          setup: ["account + year; QUARTERLY draft R1 created; second QUARTERLY draft R2 created with fresh version; third QUARTERLY create attempted while R2 still DRAFT but then R2 submitted and a fourth create attempted"]
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-EP-1" }
              as: OpsAdmin
              captures: { acct: $.data.id }
            - call: "POST /rfs/obligation-years"
              payload: { account_id: "${acct}", year: 2026, projected_volume_gal: 1000, std_cellulosic_pct: 10.0, std_biomass_diesel_pct: 20.0, std_advanced_pct: 30.0, std_total_pct: 40.0 }
              as: ComplianceManager
              captures: { yr: $.data.id, yr_v: $.data.version }
            - call: "POST /rfs/compliance-reports"
              payload: { obligation_year_id: "${yr}", report_type: "QUARTERLY", quarter_end_date: "2026-06-30T00:00:00Z", expected_obligation_year_version: "${yr_v}" }
              as: ComplianceManager
              captures: { r1: $.data.id }
            - call: "GET /rfs/obligation-years/${yr}"
              as: ComplianceManager
              captures: { yr_v2: $.data.version }
            - call: "POST /rfs/compliance-reports"
              payload: { obligation_year_id: "${yr}", report_type: "QUARTERLY", quarter_end_date: "2026-06-30T00:00:00Z", expected_obligation_year_version: "${yr_v2}" }
              as: ComplianceManager
              captures: { r2: $.data.id }
            - call: "POST /rfs/compliance-reports/${r2}/submit"
              as: ComplianceManager
            - call: "GET /rfs/obligation-years/${yr}"
              as: ComplianceManager
              captures: { yr_v3: $.data.version }
          trigger:
            - call: "POST /rfs/compliance-reports"
              payload: { obligation_year_id: "${yr}", report_type: "QUARTERLY", quarter_end_date: "2026-06-30T00:00:00Z", expected_obligation_year_version: "${yr_v3}" }
              as: ComplianceManager
              captures: { err: $.data.error_id }
          assert:
            - "ComplianceReport.${r1}.status == SUPERSEDED (supersede on second create)"
            - "ComplianceReport.${r2}.status == SUBMITTED"
            - "trigger error_id == ERR_INVALID_STATE (non-DRAFT same-type report blocks creation)"

      - name: late_quarterly_report_flagged
        claim_type: conditional_action
        grounds: ["endpoints[POST /rfs/compliance-reports/{id}/submit]", entities.ComplianceReport.fields.is_late]
        distinguishing_aspect: "Computed flag: quarterly report due 60 days after quarter end (2026-06-30 + 60d = 2026-08-29T00:00:00Z); submit at 2026-08-30 is allowed but is_late == true."
        test_recipe:
          setup: ["account + year; QUARTERLY draft for quarter end 2026-06-30; clock set to 2026-08-30T00:00:00Z"]
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-EP-2" }
              as: OpsAdmin
              captures: { acct: $.data.id }
            - call: "POST /rfs/obligation-years"
              payload: { account_id: "${acct}", year: 2026, projected_volume_gal: 1000, std_cellulosic_pct: 10.0, std_biomass_diesel_pct: 20.0, std_advanced_pct: 30.0, std_total_pct: 40.0 }
              as: ComplianceManager
              captures: { yr: $.data.id, yr_v: $.data.version }
            - call: "POST /rfs/compliance-reports"
              payload: { obligation_year_id: "${yr}", report_type: "QUARTERLY", quarter_end_date: "2026-06-30T00:00:00Z", expected_obligation_year_version: "${yr_v}" }
              as: ComplianceManager
              captures: { rep: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-30T00:00:00Z" }
              as: OpsAdmin
          trigger:
            - call: "POST /rfs/compliance-reports/${rep}/submit"
              as: ComplianceManager
          assert:
            - "ComplianceReport.${rep}.status == SUBMITTED"
            - "ComplianceReport.${rep}.due_date == 2026-08-29T00:00:00Z"
            - "ComplianceReport.${rep}.is_late == true"

      - name: batch_decide_fails_when_lot_expired_pending
        claim_type: conditional_action
        grounds: ["endpoints[POST /rfs/retirement-batches/{id}/decide]", "errors[ERR_INSUFFICIENT_RINS]"]
        distinguishing_aspect: "Aggregate guard at decide: a batch SUBMITTED while lots were healthy fails decide after the allocated lot expired (vintage sweep) because pending supply vanished."
        test_recipe:
          setup: ["year 2026; vintage-2025 lot (50 RINs, separated) allocated to a SUBMITTED batch; clock then jumps to 2028-04-01, past (2025+2)-03-31, so the lot EXPIRES while the batch is still SUBMITTED"]
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-EP-3" }
              as: OpsAdmin
              captures: { acct: $.data.id }
            - call: "POST /rfs/obligation-years"
              payload: { account_id: "${acct}", year: 2026, projected_volume_gal: 1000, std_cellulosic_pct: 10.0, std_biomass_diesel_pct: 20.0, std_advanced_pct: 30.0, std_total_pct: 40.0 }
              as: ComplianceManager
              captures: { yr: $.data.id }
            - call: "POST /rfs/rin-lots"
              payload: { account_id: "${acct}", d_code: "D6", vintage_year: 2025, gallon_qty: 50, equivalence_value: 1.0 }
              as: ComplianceManager
              captures: { lot: $.data.id }
            - call: "POST /rfs/rin-lots/${lot}/separations"
              payload: { blended_gallons: 50 }
              as: ComplianceManager
            - call: "POST /rfs/retirement-batches"
              payload: { obligation_year_id: "${yr}", category: "TOTAL_RENEWABLE", d_code: "D6", rin_qty: 50 }
              as: ComplianceManager
              captures: { b: $.data.id }
            - call: "POST /rfs/retirement-batches/${b}/submit"
              as: ComplianceManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-04-01T00:00:00Z" }
              as: OpsAdmin
          trigger:
            - call: "POST /rfs/retirement-batches/${b}/decide"
              payload: { decision: "ACCEPT" }
              as: OpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "RINLot.${lot}.status == EXPIRED (vintage sweep at clock advance)"
            - "trigger error_id == ERR_INSUFFICIENT_RINS (allocated lot no longer covers its pending allocation)"
            - "RetirementBatch.${b}.status == SUBMITTED (unchanged)"

      - name: verify_rejected_after_invalidation
        claim_type: conditional_action
        grounds: ["errors[ERR_INVALID_STATE]", state_machines.RINTrade.DELIVERED_to_INVALIDATED]
        distinguishing_aspect: "Terminal guard: verify on an INVALIDATED trade is rejected with ERR_INVALID_STATE because INVALIDATED is terminal for the transfer dimension."
        test_recipe:
          setup: ["account + APPROVED vendor; trade paid, delivered, then invalidated"]
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-EP-4" }
              as: OpsAdmin
              captures: { acct: $.data.id }
            - call: "POST /rfs/vendors"
              payload: { account_id: "${acct}", vendor_name: "GreenRIN LLC", qap_audited: true }
              as: Trader
              as_user_id: "tr-1"
              captures: { ven: $.data.id }
            - call: "POST /rfs/vendors/${ven}/diligence"
              payload: { outcome: "APPROVED" }
              as: ComplianceManager
            - call: "POST /rfs/rin-trades"
              payload: { account_id: "${acct}", vendor_id: "${ven}", d_code: "D6", vintage_year: 2026, rin_qty: 10, price_per_rin_cents: 100 }
              as: Trader
              as_user_id: "tr-1"
              captures: { trd: $.data.id }
            - call: "POST /rfs/rin-trades/${trd}/pay"
              as: Trader
              as_user_id: "tr-1"
            - call: "POST /rfs/rin-trades/${trd}/deliver"
              as: Trader
              as_user_id: "tr-1"
            - call: "POST /rfs/rin-trades/${trd}/invalidate"
              as: ComplianceManager
          trigger:
            - call: "POST /rfs/rin-trades/${trd}/verify"
              as: ComplianceManager
              as_user_id: "cm-1"
              captures: { err: $.data.error_id }
          assert:
            - "trigger error_id == ERR_INVALID_STATE (INVALIDATED is terminal)"
            - "RINTrade.${trd}.transfer_status == INVALIDATED"
  # ===========================================================================
  # Section: errors (triggerability for codes not exercised above)
  # ===========================================================================
  - section: errors
    instances:
      - name: error_separation_on_invalidated_lot
        claim_type: violation_to_error
        grounds: ["errors[ERR_RIN_INVALIDATED]", "validations[priority=9]"]
        distinguishing_aspect: "ERR_RIN_INVALIDATED is the separation endpoint's lot-status gate (priority 9 business_safety): a separation attempt on an INVALIDATED PURCHASED lot fails with ERR_RIN_INVALIDATED even though the fiscal check (attached_qty 0) would also fail — safety beats fiscal."
        test_recipe:
          setup: ["account + APPROVED vendor; trade paid, delivered (PURCHASED lot created), then invalidated so the lot is INVALIDATED"]
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-ERR-1" }
              as: OpsAdmin
              captures: { acct: $.data.id }
            - call: "POST /rfs/vendors"
              payload: { account_id: "${acct}", vendor_name: "GreenRIN LLC", qap_audited: true }
              as: Trader
              as_user_id: "tr-1"
              captures: { ven: $.data.id }
            - call: "POST /rfs/vendors/${ven}/diligence"
              payload: { outcome: "APPROVED" }
              as: ComplianceManager
            - call: "POST /rfs/rin-trades"
              payload: { account_id: "${acct}", vendor_id: "${ven}", d_code: "D6", vintage_year: 2026, rin_qty: 10, price_per_rin_cents: 100 }
              as: Trader
              as_user_id: "tr-1"
              captures: { trd: $.data.id }
            - call: "POST /rfs/rin-trades/${trd}/pay"
              as: Trader
              as_user_id: "tr-1"
            - call: "POST /rfs/rin-trades/${trd}/deliver"
              as: Trader
              as_user_id: "tr-1"
            - call: "GET /rfs/rin-lots"
              payload: { trade_id: "${trd}" }
              as: ComplianceManager
              captures: { lot: $.data.0.id }
            - call: "POST /rfs/rin-trades/${trd}/invalidate"
              as: ComplianceManager
          trigger:
            - call: "POST /rfs/rin-lots/${lot}/separations"
              payload: { blended_gallons: 1 }
              as: ComplianceManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger error_id == ERR_RIN_INVALIDATED (priority 9 lot-status gate beats priority 12 attached-qty fiscal check)"
            - "RINLot.${lot}.status == INVALIDATED"

      - name: error_catalog_full_coverage_note
        claim_type: violation_to_error
        grounds: [errors]
        distinguishing_aspect: "Every §1.6 error id is triggered by at least one §1.8 or §1.9 instance: UNAUTHENTICATED/FORBIDDEN/SEGREGATION (auth section + RBAC), NOT_FOUND (lot_get_not_found), INVALID_REQUEST (required/enum/monotone/uniqueness/conditional), REFERENCE_NOT_FOUND (body_fk), STALE_VERSION (OCC), INVALID_STATE (many), VENDOR_NOT_APPROVED (rule 7 + rule 5), RIN_INVALIDATED (this section), ATTEST_NOT_CLEAN (rule 7), D_CODE_NOT_ELIGIBLE (d_code_category_mismatch), ENGAGEMENT_WINDOW_OVERLAP + PRICE_WINDOW_OVERLAP (rule 8), INVALID_VINTAGE (invalid_vintage_year_window), DEADLINE_PASSED (retirement_deadline_exact_instant), VERIFICATION_WINDOW_EXPIRED (rule 5 instance setup), RETENTION_ACTIVE (rule 6), SEPARATION_EXCEEDS_ATTACHED (separation_boundary), INSUFFICIENT_RINS (two instances), CARRYOVER_CAP_EXCEEDED (rule 2/5/6), YEAR_NOT_FINALIZABLE (finalize precondition)."
        excluded_because:
          difficulty_instance: boundary_precision_check / carryover_cap_at_exactly_20_percent_allowed
          rationale: "Meta-coverage note only; every code is individually exercised by the cited instances."

