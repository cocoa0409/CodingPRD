  - rule_id: transitive_cascade
    instances:
      - name: fat_fail_voids_label_then_reverts_cleared_release_then_freezes_posture_then_blocks_reclear
        grounds:
          - state_machines.FactoryAcceptanceTest.IN_PROGRESS->FAILED
          - state_machines.ComplianceLabel.ISSUED->VOIDED
          - state_machines.ShipmentRelease.CLEARED->HELD
          - calculations.order_production_posture
          - validations[priority=39]
        distinguishing_aspect: |
          A single conclude-FAIL call propagates three hops that no endpoint can be aimed at directly
