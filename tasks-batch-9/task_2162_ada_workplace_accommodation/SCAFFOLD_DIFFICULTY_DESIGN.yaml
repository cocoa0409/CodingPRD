  - rule_id: compensating_invariant
    instances:

      - name: doc_budget_restored_by_withdrawing_issued_round
        grounds:
          - calculations.documentation_budget
          - state_machines.MedicalDocumentationRequest.ISSUED_to_WITHDRAWN
          - entities.AccommodationRequest.fields.medical_doc_request_count
          - entities.AccommodationRequest.fields.documentation_budget_remaining
        distinguishing_aspect: |
          The conserved quantity is a DISCRETE QUOTA: medical_doc_request_count
          plus documentation_budget_remaining must equal
          medical_doc_request_limit at every observation, and issuing then
          withdrawing a round returns both terms to their pre-issue values
          (0 and 2) with zero drift; the sibling instance conserves a monetary
          ledger instead.
