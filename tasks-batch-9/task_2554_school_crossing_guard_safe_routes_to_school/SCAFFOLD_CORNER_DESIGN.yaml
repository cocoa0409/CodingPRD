              as: CrossingSupervisor
              as_user_id: "sup-1"
              captures: { abs1_id: $.data.id }
            - call: "POST /srts/absence-reports"
              payload: { post_assignment_id: "${asg1_id}", absence_date: "2026-09-15", reason: "UNEXCUSED", note: "No-show, no notice." }
              as: CrossingSupervisor
              as_user_id: "sup-1"
              captures: { abs2_id: $.data.id }
          trigger:
            - call: "GET /srts/guards/${g1_id}"
              payload: {}
              as: CrossingSupervisor
              as_user_id: "sup-1"
