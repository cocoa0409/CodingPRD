            - call: "POST /retorts"
              payload: { label: "RT-VD", max_load_lbs: 300 }
              as: CrematoryAdmin
              captures: { retort_id: $.data.id }
            - call: "POST /petowners"
              payload: { full_name: "Owner VD", email: "ownervd@x.com", phone: "555-0018" }
              as: CrematoryOperator
