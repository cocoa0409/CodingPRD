              as: ProductionScheduler
              captures: { v4_job_status: "$.data.status" }
          assert:
            - "${v4_readiness} == FAILED and ${v4_flag} == false"
            - "HTTP 201 with ${v4_run_status} == PLANNED and ${v4_job_status} == SCHEDULED — the priority-55 gate is skipped entirely for opted-out clients"
            - "GET /bureau/dr-sites/${v4_site_id} still reads readiness_status FAILED after the successful schedule: scheduling does not repair or touch the site"
            - "PrintRun.${v4_run_id}.press_line_id == ${v4_line_id} with selection_mode EXPLICIT"

      - name: empty_file_is_rejected_and_its_control_check_still_fails_on_state_first
        claim_type: cascading_validation
        grounds: [validations.ERR_FILE_EMPTY, validations.ERR_FILE_INVALID_STATE]
        distinguishing_aspect: "The emptiness check at priority 54 runs only inside validate-format, so a rejected empty file leaves the row in RECEIVED and a follow-up control-check fails on the priority-21 state gate rather than on emptiness."
        test_recipe:
          setup:
            - "Client CL-V5 with a DELIMITED DataFile declaring 1 record and 5000 cents, but no StatementRecord attached yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/clients"
              payload: { client_code: "CL-V5", name: "Empty Intake Escrow", dr_readiness_required: false }
              as: BureauAdmin
              captures: { v5_client_id: "$.data.id" }
            - call: "POST /bureau/data-files"
              payload: { client_id: "${v5_client_id}", file_name: "v5.csv", format_spec_code: "DELIMITED", declared_record_count: 1, declared_control_total_cents: 5000 }
              as: ClientLiaison
              captures: { v5_file_id: "$.data.id", v5_initial_status: "$.data.status" }
          trigger:
            - call: "POST /bureau/data-files/${v5_file_id}/validate-format"
              payload: {}
              as: CompositionOperator
              captures: { v5_empty_error: "$.data.error_id" }
            - call: "POST /bureau/data-files/${v5_file_id}/control-check"
              payload: {}
              as: CompositionOperator
              captures: { v5_state_error: "$.data.error_id" }
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${v5_file_id}", account_ref: "ABC2501", sequence_no: 1, statement_amount_cents: 5000, address_line1: "3000 Refill Road", city: "Atlanta", region_code: "GA", postal_code: "30301", postal_code_plus4: "3001" }
              as: ClientLiaison
            - call: "POST /bureau/data-files/${v5_file_id}/validate-format"
              payload: {}
              as: CompositionOperator
              captures: { v5_second_status: "$.data.status", v5_second_errors: "$.data.format_error_count" }
          assert:
            - "${v5_initial_status} == RECEIVED with format_error_count 0 and actual_record_count 0"
            - "HTTP 422 with ${v5_empty_error} == ERR_FILE_EMPTY — the format pass never ran, so format_error_count stays 0 rather than being set from an empty scan"
            - "HTTP 409 with ${v5_state_error} == ERR_FILE_INVALID_STATE: control-check demands FORMAT_VALIDATED, and that priority-21 gate is reached before any emptiness reasoning"
            - "After one record is attached the same validate-format returns HTTP 200 with ${v5_second_status} == FORMAT_VALIDATED and ${v5_second_errors} == 0"

      - name: amendment_that_moves_no_declared_figure_is_rejected
        claim_type: violation_to_error
        grounds: [validations.ERR_AMENDMENT_NO_CHANGE, state_machines.DataFile.HELD_VARIANCE_to_RECEIVED]
        distinguishing_aspect: "An amendment must actually move declared_record_count or declared_control_total_cents: resubmitting both stored values verbatim is rejected, while changing only the total is accepted and returns the file to RECEIVED."
        test_recipe:
          setup:
            - "Client CL-V6 with the default control_total_tolerance_bp 5."
            - "A DELIMITED file declaring 1 record and 10000 cents whose single record actually carries 10500 cents, so the control check yields variance_bp 500 and parks the file in HELD_VARIANCE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/clients"
              payload: { client_code: "CL-V6", name: "Amendment Assurance", dr_readiness_required: false }
              as: BureauAdmin
              captures: { v6_client_id: "$.data.id", v6_tolerance: "$.data.control_total_tolerance_bp" }
            - call: "POST /bureau/data-files"
              payload: { client_id: "${v6_client_id}", file_name: "v6.csv", format_spec_code: "DELIMITED", declared_record_count: 1, declared_control_total_cents: 10000 }
              as: ClientLiaison
              captures: { v6_file_id: "$.data.id" }
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${v6_file_id}", account_ref: "ABC2601", sequence_no: 1, statement_amount_cents: 10500, address_line1: "3100 Variance Vista", city: "Atlanta", region_code: "GA", postal_code: "30301", postal_code_plus4: "3101" }
              as: ClientLiaison
            - call: "POST /bureau/data-files/${v6_file_id}/validate-format"
              payload: {}
              as: CompositionOperator
            - call: "POST /bureau/data-files/${v6_file_id}/control-check"
              payload: {}
              as: CompositionOperator
              captures: { v6_hold_status: "$.data.status", v6_variance_bp: "$.data.control_total_variance_bp" }
          trigger:
            - call: "POST /bureau/data-files/${v6_file_id}/amend-control-totals"
              payload: { declared_record_count: 1, declared_control_total_cents: 10000 }
              as: ClientLiaison
              captures: { v6_error: "$.data.error_id" }
            - call: "POST /bureau/data-files/${v6_file_id}/amend-control-totals"
              payload: { declared_control_total_cents: 10500 }
              as: ClientLiaison
              captures: { v6_after_status: "$.data.status", v6_after_total: "$.data.declared_control_total_cents", v6_amendments: "$.data.amendment_count" }
          assert:
            - "${v6_tolerance} == 5, ${v6_hold_status} == HELD_VARIANCE and ${v6_variance_bp} == 500 == round_half_up(500 * 10000 / 10000)"
            - "HTTP 422 with ${v6_error} == ERR_AMENDMENT_NO_CHANGE for the verbatim resubmission, and amendment_count is still 0"
            - "HTTP 200 for the real amendment with ${v6_after_status} == RECEIVED, ${v6_after_total} == 10500 and ${v6_amendments} == 1 — an omitted declared_record_count keeps its stored value and does not count as a change on its own"
            - "The reset also clears the hold evidence: control_total_variance_bp and record_count_variance return to 0 and the file must be re-validated from RECEIVED"

      - name: duplicate_client_code_is_rejected_and_a_malformed_payload_outranks_it
        claim_type: priority_ordering
        grounds: [validations.ERR_DUPLICATE_CODE, errors.ERR_VALIDATION]
        distinguishing_aspect: "Shape validation at priority 5 runs before the uniqueness probe at priority 14, so a request that is both malformed and duplicated reports ERR_VALIDATION, while a well-formed duplicate reports ERR_DUPLICATE_CODE."
        test_recipe:
          setup:
            - "Client CL-V7 already exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/clients"
              payload: { client_code: "CL-V7", name: "First Registrant Bank", dr_readiness_required: false }
              as: BureauAdmin
              captures: { v7_client_id: "$.data.id" }
          trigger:
            - call: "POST /bureau/clients"
              payload: { client_code: "CL-V7", name: "Second Registrant Bank" }
              as: BureauAdmin
              captures: { v7_duplicate_error: "$.data.error_id" }
            - call: "POST /bureau/clients"
              payload: { client_code: "CL-V7" }
              as: BureauAdmin
              captures: { v7_shape_error: "$.data.error_id" }
            - call: "GET /bureau/clients?limit=100"
              payload: {}
              as: BureauAdmin
              captures: { v7_total: "$.data[0].client_code" }
          assert:
            - "HTTP 409 with ${v7_duplicate_error} == ERR_DUPLICATE_CODE for the well-formed duplicate"
            - "HTTP 422 with ${v7_shape_error} == ERR_VALIDATION when name is also missing — the duplicate code is never reported, proving shape precedes uniqueness"
            - "${v7_total} == CL-V7 and the listing's total_count == 1: neither rejected request created a row"

      - name: template_requiring_an_unknown_insert_code_is_rejected
        claim_type: violation_to_error
        grounds: [validations.ERR_INSERT_CODE_UNKNOWN]
        distinguishing_aspect: "Insert codes are resolved against the InsertStock catalogue at template creation, so a rule-triggered code that matches no stock row is rejected even though the unconditional code resolves fine."
        test_recipe:
          setup:
            - "Insert stock INS-V8 exists and is ACTIVE; no stock carries the code INS-GHOST."
            - "Client CL-V8 exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/insert-stocks"
              payload: { insert_code: "INS-V8", description: "State disclosure", jurisdiction_code: "GA", effective_from: "2026-01-01T00:00:00Z", sheets_per_insert: 1, received_count: 25 }
              as: BureauAdmin
              captures: { v8_insert_id: "$.data.id" }
            - call: "POST /bureau/clients"
              payload: { client_code: "CL-V8", name: "Unknown Insert Insurance", dr_readiness_required: false }
              as: BureauAdmin
              captures: { v8_client_id: "$.data.id" }
          trigger:
            - call: "POST /bureau/composition-templates"
              payload: { client_id: "${v8_client_id}", template_code: "T-V8-BAD", version_no: 1, duplex_required: false, sheets_per_document: 1, color_pages_per_document: 0, mail_class_preference: "FIRST_CLASS", required_insert_codes: ["INS-V8"], variable_content_rules: [{ rule_code: "R1", threshold_amount_cents: 1000, add_sheets: 0, required_insert_code: "INS-GHOST" }] }
              as: BureauAdmin
              captures: { v8_error: "$.data.error_id" }
            - call: "POST /bureau/composition-templates"
              payload: { client_id: "${v8_client_id}", template_code: "T-V8-GOOD", version_no: 1, duplex_required: false, sheets_per_document: 1, color_pages_per_document: 0, mail_class_preference: "FIRST_CLASS", required_insert_codes: ["INS-V8"], variable_content_rules: [{ rule_code: "R1", threshold_amount_cents: 1000, add_sheets: 0, required_insert_code: "INS-V8" }] }
              as: BureauAdmin
              captures: { v8_template_id: "$.data.id", v8_template_status: "$.data.status" }
          assert:
            - "HTTP 422 with ${v8_error} == ERR_INSERT_CODE_UNKNOWN — the rule-triggered code is checked, not just required_insert_codes"
            - "HTTP 201 with ${v8_template_status} == DRAFT for the version whose codes all resolve"
            - "GET /bureau/clients/${v8_client_id}/composition-templates returns total_count == 1, so the rejected template left no row"
            - "InsertStock.${v8_insert_id}.on_hand_count is still 25: template creation reserves nothing"

      - name: insert_stock_outside_its_effective_window_is_rejected_at_composition
        claim_type: conditional_validation
        grounds: [validations.ERR_INSERT_NOT_EFFECTIVE, entities.InsertStock.fields.effective_to]
        distinguishing_aspect: "Effectiveness is evaluated against the composition clock with a half-open window, so a template whose insert expired on 2026-07-01 composes only after the clock is moved back inside the window."
        test_recipe:
          setup:
            - "Insert stock INS-V9 effective from 2026-01-01T00:00:00Z to 2026-07-01T00:00:00Z, ACTIVE, sheets_per_insert 1, received 25."
            - "Client CL-V9 with ACTIVE template T-V9 requiring INS-V9; an ACCEPTED one-record file."
            - "The clock stands at 2026-08-01T00:00:00Z, one month past the insert's effective_to."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/insert-stocks"
              payload: { insert_code: "INS-V9", description: "Expired regulatory notice", jurisdiction_code: "US", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-07-01T00:00:00Z", sheets_per_insert: 1, received_count: 25 }
              as: BureauAdmin
              captures: { v9_insert_id: "$.data.id" }
            - call: "POST /bureau/clients"
              payload: { client_code: "CL-V9", name: "Expired Insert Indemnity", dr_readiness_required: false }
              as: BureauAdmin
              captures: { v9_client_id: "$.data.id" }
            - call: "POST /bureau/composition-templates"
              payload: { client_id: "${v9_client_id}", template_code: "T-V9", version_no: 1, duplex_required: false, sheets_per_document: 1, color_pages_per_document: 0, mail_class_preference: "FIRST_CLASS", required_insert_codes: ["INS-V9"], variable_content_rules: [] }
              as: BureauAdmin
              captures: { v9_template_id: "$.data.id" }
            - call: "POST /bureau/composition-templates/${v9_template_id}/activate"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/data-files"
              payload: { client_id: "${v9_client_id}", file_name: "v9.csv", format_spec_code: "DELIMITED", declared_record_count: 1, declared_control_total_cents: 5000 }
              as: ClientLiaison
              captures: { v9_file_id: "$.data.id" }
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${v9_file_id}", account_ref: "ABC2701", sequence_no: 1, statement_amount_cents: 5000, address_line1: "3200 Expiry Esplanade", city: "Atlanta", region_code: "GA", postal_code: "30301", postal_code_plus4: "3201" }
              as: ClientLiaison
            - call: "POST /bureau/data-files/${v9_file_id}/validate-format"
              payload: {}
              as: CompositionOperator
            - call: "POST /bureau/data-files/${v9_file_id}/control-check"
              payload: {}
              as: CompositionOperator
          trigger:
            - call: "POST /bureau/composition-jobs"
              payload: { data_file_id: "${v9_file_id}", template_id: "${v9_template_id}", rush_requested: false }
              as: CompositionOperator
              captures: { v9_error: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-30T23:59:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/composition-jobs"
              payload: { data_file_id: "${v9_file_id}", template_id: "${v9_template_id}", rush_requested: false }
              as: CompositionOperator
              as_user_id: "op-1"
              captures: { v9_job_id: "$.data.id", v9_job_status: "$.data.status", v9_insert_sheets: "$.data.insert_sheet_total" }
          assert:
            - "HTTP 422 with ${v9_error} == ERR_INSERT_NOT_EFFECTIVE while the clock reads 2026-08-01, even though the code resolves and the stock is ACTIVE"
            - "HTTP 201 once the clock sits inside the window: ${v9_job_status} == COMPOSED and ${v9_insert_sheets} == 1"
            - "InsertStock.${v9_insert_id}.reserved_count == 1 and on_hand_count == 24 only after the accepted composition — the rejected attempt reserved nothing"
            - "effective_to is exclusive: a clock of exactly 2026-07-01T00:00:00Z would already be outside the window"

      - name: business_priority_pairs_are_covered_by_the_difficulty_design
        claim_type: priority_conflict
        grounds: [validations.ERR_STALE_CLIENT_VERSION, validations.ERR_POSTAGE_ESCROW_INSUFFICIENT]
        excluded_because:
          difficulty_instance: stale_client_version_outranks_postage_escrow_shortfall
          rationale: "That instance stages both violations on one seal call and shows the 412 winning, then repairs only the version to expose the 402, which is the full priority-conflict pair for these two rules."

      - name: aggregate_tray_capacity_validation_is_covered_by_the_difficulty_design
        claim_type: aggregate_validation
        grounds: [validations.ERR_INDUCTION_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: entry_facility_induction_windows_are_half_open_with_aggregate_tray_capacity
          rationale: "That instance manifests two batches that are each individually within tray_capacity_per_window and shows the third overflowing the aggregate, which is the aggregate-validation claim for this facility limit."

      - name: press_window_overlap_validation_is_covered_by_the_difficulty_design
        claim_type: temporal_validation
        grounds: [validations.ERR_PRESS_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: press_line_windows_use_closed_intervals_with_a_changeover_buffer
          rationale: "That instance probes an abutting window, a window inside the changeover buffer and the first legal start, covering the temporal conflict detection for scheduling."

  - section: endpoints
    instances:

      - name: paperless_sync_confirms_only_pending_rows_and_ignores_the_rest
        claim_type: bulk_action
        grounds: [endpoints.POST_clients_id_paperless_sync, calculations.paperless_suppression_resolution]
        distinguishing_aspect: "The sync is a skip-not-fail bulk action: one PENDING row is confirmed, an already REVOKED row and an account_ref that matches no row are both ignored, and the whole call still returns 200 with a single epoch increment."
        test_recipe:
          setup:
            - "Client CL-E1 with two enrollments: ABC3001 left PENDING and ABC3002 revoked back to REVOKED before the sync."
            - "The account_ref ABC9999 has no enrollment row at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/clients"
              payload: { client_code: "CL-E1", name: "Skip Not Fail Savings", dr_readiness_required: false }
              as: BureauAdmin
              captures: { e1_client_id: "$.data.id", e1_version0: "$.data.version" }
            - call: "POST /bureau/paperless-enrollments"
              payload: { client_id: "${e1_client_id}", account_ref: "ABC3001", channel: "EMAIL" }
              as: ClientLiaison
              captures: { e1_pending_id: "$.data.id" }
            - call: "POST /bureau/paperless-enrollments"
              payload: { client_id: "${e1_client_id}", account_ref: "ABC3002", channel: "PORTAL" }
              as: ClientLiaison
              captures: { e1_revoked_id: "$.data.id" }
            - call: "POST /bureau/paperless-enrollments/${e1_revoked_id}/revoke"
              payload: {}
              as: ClientLiaison
              captures: { e1_revoked_status: "$.data.status" }
          trigger:
            - call: "POST /bureau/clients/${e1_client_id}/paperless-sync"
              payload: { confirm_pending_account_refs: ["ABC3001", "ABC3002", "ABC9999"] }
              as: ClientLiaison
              captures: { e1_epoch: "$.data.paperless_sync_epoch", e1_version1: "$.data.version" }
            - call: "GET /bureau/paperless-enrollments/${e1_pending_id}"
              payload: {}
              as: ClientLiaison
              captures: { e1_confirmed_status: "$.data.status", e1_confirmed_epoch: "$.data.enrolled_epoch", e1_suppression: "$.data.suppression_effective" }
            - call: "GET /bureau/paperless-enrollments/${e1_revoked_id}"
              payload: {}
              as: ClientLiaison
              captures: { e1_after_revoked_status: "$.data.status", e1_after_revoked_epoch: "$.data.enrolled_epoch" }
          assert:
            - "${e1_revoked_status} == REVOKED before the sync"
            - "HTTP 200 with ${e1_epoch} == 1 and ${e1_version1} == ${e1_version0} + 1 — one epoch bump for the whole batch, not one per named ref"
            - "${e1_confirmed_status} == ENROLLED with ${e1_confirmed_epoch} == 1 and ${e1_suppression} == true"
            - "${e1_after_revoked_status} == REVOKED with ${e1_after_revoked_epoch} null: only PENDING rows are eligible, and the REVOKED row was neither resurrected nor errored"
            - "The unknown ABC9999 produced no row and no error: GET /bureau/clients/${e1_client_id}/paperless-enrollments returns total_count == 2"

      - name: integrity_summary_reads_the_reconciled_counters_without_writing
        claim_type: computed_read
        grounds: [endpoints.GET_composition_jobs_id_integrity_summary, calculations.one_to_one_integrity_reconciliation]
        distinguishing_aspect: "The summary is a side-effect-free read of counters written by reconcile-integrity: it reports zeros before reconciliation, the reconciled values afterwards, and two consecutive reads leave version untouched."
        test_recipe:
          setup:
            - "Client CL-E2 (dr_readiness_required false), ACTIVE template T-E2 (FIRST_CLASS, sheets_per_document 1), press line PL-E2 (600 sheets/hour, capacity 2000)."
            - "A one-record file composed, presorted, scheduled at 2026-08-05T09:00:00Z, started, scanned cleanly at PRINT, INSERT and INDUCT, and completed at 10:00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
