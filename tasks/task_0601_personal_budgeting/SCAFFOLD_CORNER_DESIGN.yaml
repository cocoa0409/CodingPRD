  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_posture_after_post
        claim_type: immediate
        grounds: [entities.Household.fields.posture, calculations.envelope_accounting]
        distinguishing_aspect: "Posture flips to OVERSPENT in the same transaction-post request's downstream household read — no lag (immediate consistency)."
        test_recipe:
          setup: ["Household OPEN period; category Food allocated 1000; PENDING outflow -3000 categorized to Food"]
          setup_api_calls:
            - call: "POST /households"
              payload: { name: "Acme", owner_email: "o@x.com", owner_display_name: "Owner" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /households/${hh_id}/budget-periods"
              payload: { month: "2026-01", income_expected_cents: 1000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { period_id: $.data.id }
            - call: "POST /households/${hh_id}/budget-periods/${period_id}/categories"
              payload: { name: "Food", allocated_cents: 1000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { cat_id: $.data.id }
            - call: "POST /households/${hh_id}/accounts"
              payload: { institution_name: "Bank", account_type: "DEPOSITORY", opening_balance_cents: 50000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/transactions"
              payload: { amount_cents: -3000, merchant_name: "Mart", budget_category_id: "${cat_id}" }
              as: PlatformAdmin
              captures: { txn_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acc_id}/transactions/${txn_id}/post"
              payload: {}
              as: PlatformAdmin
            - call: "GET /households/${hh_id}"
              payload: {}
              as: HouseholdOwner
              as_user_id: "${owner_id}"
          assert:
            - "Household.${hh_id}.posture == OVERSPENT"
            - "BudgetCategory.${cat_id}.envelope_state == OVER"
