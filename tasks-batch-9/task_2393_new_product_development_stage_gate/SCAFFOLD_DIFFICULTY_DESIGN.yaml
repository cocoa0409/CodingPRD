              as: InnovationLead
              captures: { bcs_id: $.data.id }
            - call: "POST /business-cases/${bcs_id}/forecast-lines"
              payload: { channel: "GROCERY", store_count: 2400, base_velocity_units_per_store_week: 1.20, promo_weeks: 4, promo_lift_pct: 30.00, list_price_usd: 5.7500 }
              as: InnovationLead
            - call: "POST /innovation-projects/${ps_id}/gate-reviews"
              payload: { gate_id: "${g2s_id}", scheduled_at: "2026-08-04T09:00:00Z" }
