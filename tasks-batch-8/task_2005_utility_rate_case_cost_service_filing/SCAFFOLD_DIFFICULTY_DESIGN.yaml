            - "Hop 3: RateCase.${rc}.overdue_data_request_count == 0"
            - "Follow-on: POST /api/v1/rate-cases/${rc}/advance-to-hearing now succeeds (guard reopened by the cascade)"

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_guard_beats_fiscal_rr_mismatch
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - errors[ERR_ENTRIES_NOT_LOCKED]
          - errors[ERR_RR_MISMATCH]
        distinguishing_aspect: |
          Category pair = state (p6) vs business_fiscal (p11). One request
          violates both: an entry is merely SUBMITTED (not LOCKED) AND the
          filed proposed RR (1,897,500,000) mismatches the computed as-filed
          figure (0 cost of service because nothing is LOCKED + 180,000,000
          return on RB1 = 180,000,000) by far more than the 100-cent
          tolerance. Priority 6 wins: ERR_ENTRIES_NOT_LOCKED.
        test_recipe:
          setup:
            - "Case DRAFT with E1 SUBMITTED (deliberately not LOCKED), RB1 SUBMITTED; proposed RR input 1,897,500,000 vs computable 180,000,000"
          setup_api_calls:
            - { call: "POST /api/v1/rate-cases", payload: { case_number: "UR-2026-104", utility_name: "Cascade Power & Light", test_year_start: "2025-01-01T00:00:00Z", test_year_end: "2025-12-31T00:00:00Z", return_on_rate_base_bp: 750, proposed_revenue_requirement_cents: 1897500000, allocation_method: "COINCIDENT_PEAK" }, as: UtilityFiler, captures: { rc: $.data.id } }
            - { call: "POST /api/v1/test-year-entries", payload: { rate_case_id: "${rc}", account_code: "900", category: "O_AND_M", booked_amount_cents: 1000000000 }, as: UtilityFiler, captures: { e1: $.data.id } }
            - { call: "POST /api/v1/test-year-entries/${e1}/submit", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/rate-base-items", payload: { rate_case_id: "${rc}", label: "Generation plant", plant_in_service_cents: 3000000000, accumulated_depreciation_cents: 500000000, working_capital_cents: 100000000, accumulated_deferred_taxes_cents: 200000000 }, as: UtilityFiler, captures: { rb1: $.data.id } }
            - { call: "POST /api/v1/rate-base-items/${rb1}/submit", payload: {}, as: UtilityFiler }
          trigger:
            - { call: "POST /api/v1/rate-cases/${rc}/submit-filing", payload: {}, as: UtilityFiler, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_ENTRIES_NOT_LOCKED (state priority 6), NOT ERR_RR_MISMATCH (fiscal priority 11) although both conditions hold"
            - "RateCase.${rc}.status == DRAFT (unchanged)"

      - name: temporal_window_beats_cross_case_reference
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_DISCOVERY_WINDOW_CLOSED]
          - errors[ERR_ADJUSTMENT_NOT_IN_CASE]
        distinguishing_aspect: |
          Category pair = business_temporal (p8) vs business_referential (p9)
          — different from state-vs-fiscal above. One data-request create
          violates both: the clock (2026-11-30) is past the case's
          discovery_close_at (2026-11-29T00:00:00Z) AND referenced_adjustment_id
          points at an adjustment belonging to a DIFFERENT case. Priority 8
          wins: ERR_DISCOVERY_WINDOW_CLOSED.
        test_recipe:
          setup:
            - "Case 1 fully filed to DISCOVERY at default clock (close 2026-11-29T00:00:00Z); case 2 (DRAFT) holding its own entry and adjustment A_other; clock advanced to 2026-11-30"
          setup_api_calls:
            - { call: "POST /api/v1/rate-cases", payload: { case_number: "UR-2026-104", utility_name: "Cascade Power & Light", test_year_start: "2025-01-01T00:00:00Z", test_year_end: "2025-12-31T00:00:00Z", return_on_rate_base_bp: 750, proposed_revenue_requirement_cents: 1897500000, allocation_method: "COINCIDENT_PEAK" }, as: UtilityFiler, captures: { rc1: $.data.id } }
            - { call: "POST /api/v1/test-year-entries", payload: { rate_case_id: "${rc1}", account_code: "900", category: "O_AND_M", booked_amount_cents: 1000000000 }, as: UtilityFiler, captures: { e1: $.data.id } }
            - { call: "POST /api/v1/test-year-entries", payload: { rate_case_id: "${rc1}", account_code: "901", category: "DEPRECIATION", booked_amount_cents: 400000000 }, as: UtilityFiler, captures: { e2: $.data.id } }
            - { call: "POST /api/v1/test-year-entries", payload: { rate_case_id: "${rc1}", account_code: "902", category: "TAXES", booked_amount_cents: 200000000 }, as: UtilityFiler, captures: { e3: $.data.id } }
            - { call: "POST /api/v1/adjustments", payload: { rate_case_id: "${rc1}", test_year_entry_id: "${e1}", amount_cents: 50000000, reason: "Annualize pension cost" }, as: UtilityFiler, as_user_id: "uf_alice", captures: { a1: $.data.id } }
            - { call: "POST /api/v1/adjustments/${a1}/verify", payload: {}, as: UtilityFiler, as_user_id: "uf_bob" }
            - { call: "POST /api/v1/test-year-entries/${e1}/submit", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/test-year-entries/${e1}/lock", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/test-year-entries/${e2}/submit", payload: {}, as: UtilityFiler }
