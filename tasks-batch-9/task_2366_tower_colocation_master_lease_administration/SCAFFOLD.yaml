scenario: |
  2366. Tower Colocation & Master Lease Administration (communications tower company): tower asset inventory with structural capacity, available elevation and ground space, colocation application with equipment specifications, structural analysis and modification cost quotation, master lease agreement with site-level amendments, rent escalators and term structure, amendment processing for equipment swaps and additions with expedited review commitments, ground lease management with landlord payments, renewals and buyout opportunities, structural modification project management with cost sharing among tenants, tenant equipment audits detecting unauthorized installations with retroactive billing, decommissioning, tenant departure and site restoration obligations

domain_name: tower-colocation-master-lease
api_prefix: /tower-colo

complexity_profile:
  difficulty_level: beyond_expert
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: graph
  # Tenant x Tower is many-to-many through SiteAmendment; CostShare is a
  # ModificationProject x Tenant junction; SiteAmendment.supersedes_amendment_id
  # is self-referential (equipment-swap chains). No single ownership tree.

  state_machine_shape: parallel
  # SiteAmendment carries two independent axes (execution_status x billing_status)
  # on one row; ColocationApplication is cyclic
  # (UNDER_STRUCTURAL_REVIEW <-> MODIFICATION_REQUIRED, UNDER_STRUCTURAL_REVIEW <-> CAPACITY_HOLD);
  # ModificationProject is fork-join (COST_ALLOCATED -> {FUNDED, STALLED} -> ...).

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The StructuralEngineer who authored the analysis or proposed the project
  # cannot certify that project's completion.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Tower
    parent: null
    common_fields: true
    fields:
      - name: site_name
        type: string
        source: input
        description: human-readable tower site name
        constraints: "1..120 chars, non-blank"
      - name: structure_type
        type: enum
        source: input
        description: structural family of the tower
        constraints: "one of {MONOPOLE, SELF_SUPPORT, GUYED}"
      - name: rated_capacity_load_units
        type: number
        source: input
        description: total structural capacity of the tower expressed in load units
        constraints: "> 0"
      - name: min_colocation_elevation_ft
        type: number
        source: input
        description: lowest elevation at which colocation equipment may be mounted
        constraints: ">= 0"
      - name: max_elevation_ft
        type: number
        source: input
        description: highest usable elevation on the structure
        constraints: "> min_colocation_elevation_ft"
      - name: ground_space_total_sqft
        type: number
        source: input
        description: total leasable compound ground space at the site
        constraints: "> 0"
      - name: baseline_reserved_load_units
        type: number
        source: input
        default: 0
        description: load units consumed by the anchor/owner equipment that predates any SiteAmendment
        constraints: ">= 0 and < rated_capacity_load_units"
      - name: baseline_reserved_ground_sqft
        type: number
        source: input
        default: 0
        description: ground space consumed by anchor/owner equipment
        constraints: ">= 0 and < ground_space_total_sqft"
      - name: reserved_load_units
        type: number
        source: computed
        description: "baseline_reserved_load_units + sum of SiteAmendment.reserved_load_units over amendments on this tower with execution_status IN {EXECUTED, TERMINATION_NOTICED} (calculations.tower_capacity_reconciliation)"
      - name: reserved_load_pct
        type: number
        source: computed
        description: "round_half_up(100 * reserved_load_units / rated_capacity_load_units, 3)"
      - name: reserved_ground_space_sqft
        type: number
        source: computed
        description: "baseline_reserved_ground_sqft + sum of SiteAmendment.ground_space_sqft over amendments on this tower with execution_status IN {EXECUTED, TERMINATION_NOTICED}"
      - name: available_ground_space_sqft
        type: number
        source: computed
        description: "ground_space_total_sqft - reserved_ground_space_sqft"
      - name: capacity_posture
        type: enum
        source: computed
        description: "derived gate over all child operations (calculations.tower_capacity_posture)"
        constraints: "one of {OPEN, RESTRICTED, FROZEN}"
      - name: open_review_count
        type: integer
        source: computed
        description: "count of ColocationApplication rows on this tower with status == UNDER_STRUCTURAL_REVIEW"
      - name: occupied_elevation_bands
        type: array
        source: computed
        description: "array of { amendment_id, bottom_ft, top_ft, tenant_id } for amendments on this tower with execution_status IN {EXECUTED, TERMINATION_NOTICED}, ordered by bottom_ft ASC then created_at ASC"

  - name: Landlord
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: landlord legal entity name
        constraints: "1..160 chars, non-blank"
      - name: remit_contact_email
        type: string
        source: input
        description: remittance contact address
        constraints: "must contain '@'"
      - name: w9_on_file
        type: boolean
        source: input
        default: false
        description: whether tax documentation is on file; gates landlord payment creation

  - name: GroundLease
    parent: Tower
    common_fields: true
    fields:
      - name: tower_id
        type: string
        source: input
        description: "FK -> Tower.id; the site this ground lease sits under"
      - name: landlord_id
        type: string
        source: input
        description: "FK -> Landlord.id; the payee for this lease"
      - name: base_monthly_rent_cents
        type: integer
        source: input
        description: monthly ground rent at the current escalation baseline
        constraints: "> 0"
      - name: escalator_pct
        type: number
        source: input
        description: simple (non-compound) annual escalation percentage applied to base_monthly_rent_cents
        constraints: ">= 0 and <= 25"
      - name: commencement_date
        type: datetime
        source: input
        description: current escalation baseline date (anniversaries counted from here)
      - name: term_end_date
        type: datetime
        source: input
        description: last day of the current lease term
        constraints: "> commencement_date"
      - name: renewal_option_count
        type: integer
        source: input
        description: number of renewal options granted by the lease
        constraints: ">= 0"
      - name: renewal_term_years
        type: integer
        source: input
        description: length in years added to term_end_date by each exercised renewal
        constraints: ">= 1"
      - name: buyout_price_cents
        type: integer
        source: input
        description: negotiated price to buy out the landlord's interest; 0 means no buyout right
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: lease lifecycle state
        constraints: "one of {ACTIVE, RENEWAL_NEGOTIATION, EXPIRED, BOUGHT_OUT}"
      - name: renewals_exercised
        type: integer
        source: system
        default: 0
        description: how many renewal options have been consumed
      - name: current_monthly_rent_cents
        type: integer
        source: computed
        description: "escalated monthly rent at the logical clock (calculations.ground_lease_current_rent)"
      - name: paid_through_date
        type: datetime
        source: system
        default: null
        description: last day covered by an accepted LandlordPayment; null when no payment exists
      - name: buyout_paid_cents
        type: integer
        source: system
        default: 0
        description: cash paid to the landlord on buyout

  - name: LandlordPayment
    parent: GroundLease
    common_fields: false
    fields:
      - name: ground_lease_id
        type: string
        source: input
        description: "FK -> GroundLease.id; the lease being paid"
      - name: period_start_date
        type: datetime
        source: input
        description: first day of the covered period; MUST be the first calendar day of a month
      - name: period_end_date
        type: datetime
        source: input
        description: last day of the covered period; MUST be the last calendar day of a month
      - name: months_covered
        type: integer
        source: computed
        description: "count of whole calendar months in the inclusive-inclusive interval [period_start_date, period_end_date]"
      - name: amount_cents
        type: integer
        source: computed
        description: "sum over covered months of the escalated monthly rent evaluated at each month's first day (calculations.landlord_payment_amount)"

  - name: Tenant
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: carrier legal entity name
        constraints: "1..160 chars, non-blank"
      - name: carrier_code
        type: string
        source: input
        description: short carrier code used on invoices
        constraints: "3..12 uppercase alphanumeric chars, unique across Tenant"
      - name: outstanding_balance_cents
        type: integer
        source: computed
        default: 0
        description: "money owed by this tenant; increased by billed CostShare and billed AuditFinding, decreased by tenant payments, SLA credits and released restoration deposits; may go negative (credit balance)"
      - name: credit_status
        type: enum
        source: computed
        default: CURRENT
        description: "DELINQUENT when outstanding_balance_cents >= DELINQUENCY_THRESHOLD_CENTS, else CURRENT (calculations.tenant_credit_status)"
        constraints: "one of {CURRENT, DELINQUENT}"

  - name: MasterLeaseAgreement
    parent: Tenant
    common_fields: true
    fields:
      - name: tenant_id
        type: string
        source: input
        description: "FK -> Tenant.id; the carrier bound by this master lease"
      - name: base_monthly_rent_cents
        type: integer
        source: input
        description: default per-site monthly rent inherited by new SiteAmendment rows
        constraints: "> 0"
      - name: escalator_pct
        type: number
        source: input
        description: compound annual escalation percentage applied to site amendments under this master lease
        constraints: ">= 0 and <= 25"
      - name: initial_term_years
        type: integer
        source: input
        description: initial term length of the master lease
        constraints: ">= 1"
      - name: renewal_terms_count
        type: integer
        source: input
        description: number of renewal terms available under the master lease
        constraints: ">= 0"
      - name: expires_on
        type: datetime
        source: input
        description: last day the master lease is in force
      - name: expedited_review_days
        type: integer
        source: input
        default: null
        description: "contractual expedited structural-review commitment in days; null means no expedited commitment (STANDARD_REVIEW_DAYS applies)"
        constraints: "when present: >= 1 and <= 45"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: master lease lifecycle state
        constraints: "one of {DRAFT, ACTIVE, EXPIRED}"
      - name: application_privilege
        type: enum
        source: computed
        default: ENABLED
        description: "SUSPENDED while the tenant is DELINQUENT or the master lease is EXPIRED; gates application submission"
        constraints: "one of {ENABLED, SUSPENDED}"
      - name: executed_amendment_count
        type: integer
        source: computed
        description: "count of SiteAmendment rows under this master lease with execution_status == EXECUTED"

  - name: ColocationApplication
    parent: Tower
    common_fields: true
    fields:
      - name: tower_id
        type: string
        source: input
        description: "FK -> Tower.id; the site the tenant wants to colocate on"
      - name: master_lease_agreement_id
        type: string
        source: input
        description: "FK -> MasterLeaseAgreement.id; the master lease this application is filed under"
      - name: requested_elevation_bottom_ft
        type: number
        source: input
        description: bottom of the requested elevation band (inclusive)
        constraints: ">= 0"
      - name: requested_elevation_top_ft
        type: number
        source: input
        description: top of the requested elevation band (exclusive)
        constraints: "> requested_elevation_bottom_ft"
      - name: requested_ground_space_sqft
        type: number
        source: input
        description: compound ground space requested for cabinets and generators
        constraints: "> 0"
      - name: expedited_requested
        type: boolean
        source: input
        default: false
        description: whether the tenant invokes the master lease expedited-review commitment
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: application lifecycle state
        constraints: "one of {DRAFT, SUBMITTED, UNDER_STRUCTURAL_REVIEW, CAPACITY_HOLD, MODIFICATION_REQUIRED, ON_HOLD, APPROVED, AMENDMENT_ISSUED, REJECTED, WITHDRAWN}"
      - name: submitted_at
        type: datetime
        source: system
        default: null
        description: logical-clock instant of the most recent submit or promotion into UNDER_STRUCTURAL_REVIEW
      - name: review_deadline_at
        type: datetime
        source: computed
        default: null
        description: "structural-review SLA deadline (calculations.review_deadline)"
      - name: sla_breached
        type: boolean
        source: computed
        default: false
        description: "true when the first analysis issued after the latest review entry was issued strictly after review_deadline_at"
      - name: total_load_units
        type: number
        source: computed
        default: 0
        description: "sum of EquipmentLine.load_units over lines whose colocation_application_id is this application"
      - name: revision_count
        type: integer
        source: system
        default: 0
        description: number of times the tenant revised the application after a MODIFICATION_REQUIRED result

  - name: EquipmentLine
    parent: ColocationApplication
    common_fields: true
    fields:
      - name: colocation_application_id
        type: string
        source: input
        description: "FK -> ColocationApplication.id; the application this equipment line belongs to"
      - name: installed_amendment_id
        type: string
        source: system
        default: null
        description: "FK -> SiteAmendment.id; set when the line is carried onto an executed amendment, null while unbuilt"
      - name: equipment_type
        type: enum
        source: input
        description: category of the mounted appurtenance
        constraints: "one of {ANTENNA, RRU, TMA, DISH}"
      - name: model_code
        type: string
        source: input
        description: manufacturer model code
        constraints: "1..40 chars, non-blank"
      - name: quantity
        type: integer
        source: input
        description: number of identical units on this line
        constraints: ">= 1"
      - name: unit_weight_lbs
        type: number
        source: input
        description: dead weight of a single unit
        constraints: "> 0"
      - name: wind_area_sqft
        type: number
        source: input
        description: effective projected wind area of a single unit
        constraints: ">= 0"
      - name: mount_elevation_ft
        type: number
        source: input
        description: centerline mount elevation for this line
        constraints: ">= 0"
      - name: load_units
        type: number
        source: computed
        description: "structural load contributed by this line (calculations.equipment_line_load_units)"

  - name: StructuralAnalysis
    parent: ColocationApplication
    common_fields: true
    fields:
      - name: colocation_application_id
        type: string
        source: input
        description: "FK -> ColocationApplication.id; the application analysed"
      - name: variant
        type: enum
        source: input
        description: which inclusion set the engineer ran
        constraints: "one of {PRELIMINARY, DETAILED}"
      - name: included_load_units
        type: number
        source: computed
        description: "total load units entering the analysis (calculations.structural_loading_analysis)"
      - name: projected_loading_pct
        type: number
        source: computed
        description: "round_half_up(100 * included_load_units / tower.rated_capacity_load_units, 3)"
      - name: result
        type: enum
        source: computed
        description: "PASS / MODIFICATION_REQUIRED / CAPACITY_EXCEEDED per the pinned thresholds"
        constraints: "one of {PASS, MODIFICATION_REQUIRED, CAPACITY_EXCEEDED}"
      - name: status
        type: enum
        source: system
        default: ISSUED
        description: analysis document lifecycle state
        constraints: "one of {ISSUED, QUOTED, SUPERSEDED}"
      - name: modification_construction_cost_cents
        type: integer
        source: input
        default: null
        description: construction-only modification cost supplied when the quotation is issued
        constraints: "when present: > 0"
      - name: quoted_at
        type: datetime
        source: system
        default: null
        description: logical-clock instant the modification quotation was issued
      - name: engineer_user_id
        type: string
        source: system
        description: X-User-ID of the StructuralEngineer who created this analysis (segregation-of-duties input)
      - name: issued_at
        type: datetime
        source: system
        description: logical-clock instant the analysis was created

  - name: SiteAmendment
    parent: MasterLeaseAgreement
    common_fields: true
    fields:
      - name: master_lease_agreement_id
        type: string
        source: input
        description: "FK -> MasterLeaseAgreement.id; the master lease this amendment hangs off"
      - name: tower_id
        type: string
        source: input
        description: "FK -> Tower.id; the site being amended"
      - name: colocation_application_id
        type: string
        source: input
        description: "FK -> ColocationApplication.id; the APPROVED application this amendment papers"
      - name: supersedes_amendment_id
        type: string
        source: input
        default: null
        description: "FK -> SiteAmendment.id; set for equipment-swap amendments that replace an EXECUTED amendment of the same tenant on the same tower"
      - name: execution_status
        type: enum
        source: system
        default: DRAFT
        description: signature/occupancy axis of the amendment
        constraints: "one of {DRAFT, PENDING_SIGNATURE, EXECUTED, TERMINATION_NOTICED, TERMINATED, VOIDED}"
      - name: billing_status
        type: enum
        source: system
        default: NOT_BILLING
        description: revenue axis of the amendment, independent of execution_status between EXECUTED and TERMINATED
        constraints: "one of {NOT_BILLING, BILLING, SUSPENDED, CLOSED}"
      - name: base_monthly_rent_cents
        type: integer
        source: input
        description: site rent at the escalation baseline (defaults to the master lease value when omitted)
        constraints: "> 0"
      - name: escalator_pct
        type: number
        source: input
        description: compound annual escalator for this site (defaults to the master lease value when omitted)
        constraints: ">= 0 and <= 25"
      - name: effective_date
        type: datetime
        source: input
        description: escalation baseline and occupancy start date
      - name: term_end_date
        type: datetime
        source: input
        description: last day of the amendment term
        constraints: "> effective_date"
      - name: elevation_bottom_ft
        type: number
        source: computed
        description: "copied from the application's requested_elevation_bottom_ft at amendment creation (inclusive bound)"
      - name: elevation_top_ft
        type: number
        source: computed
        description: "copied from the application's requested_elevation_top_ft at amendment creation (exclusive bound)"
      - name: ground_space_sqft
        type: number
        source: computed
        description: "copied from the application's requested_ground_space_sqft at amendment creation"
      - name: reserved_load_units
        type: number
        source: computed
        description: "copied from the application's total_load_units at amendment creation; the quantity this amendment reserves on the tower once EXECUTED"
      - name: current_monthly_rent_cents
        type: integer
        source: computed
        description: "escalated site rent at the logical clock (calculations.amendment_rent_escalation)"
      - name: restoration_deposit_cents
        type: integer
        source: input
        default: 0
        description: site-restoration deposit charged to the tenant at execution and released on completed decommissioning
        constraints: ">= 0"
      - name: restoration_status
        type: enum
        source: system
        default: NOT_REQUIRED
        description: site restoration obligation state
        constraints: "one of {NOT_REQUIRED, PENDING, COMPLETE}"
      - name: notice_given_at
        type: datetime
        source: system
        default: null
        description: logical-clock instant the tenant gave termination notice
      - name: terminated_at
        type: datetime
        source: system
        default: null
        description: logical-clock instant decommissioning completed

  - name: ModificationProject
    parent: Tower
    common_fields: true
    fields:
      - name: tower_id
        type: string
        source: input
        description: "FK -> Tower.id; the structure being reinforced"
      - name: originating_analysis_id
        type: string
        source: input
        description: "FK -> StructuralAnalysis.id; the QUOTED analysis that justifies this project"
      - name: construction_window_start_date
        type: datetime
        source: input
        description: first day of the reserved construction window (inclusive)
      - name: construction_window_end_date
        type: datetime
        source: input
        description: last day of the reserved construction window (inclusive)
        constraints: ">= construction_window_start_date"
      - name: status
        type: enum
        source: system
        default: PROPOSED
        description: project lifecycle state
        constraints: "one of {PROPOSED, COST_ALLOCATED, FUNDED, STALLED, IN_CONSTRUCTION, CERTIFIED, CANCELLED}"
      - name: base_construction_cost_cents
        type: integer
        source: computed
        description: "copied from the originating analysis's modification_construction_cost_cents at project creation"
      - name: volume_discount_pct
        type: number
        source: computed
        description: "discount tier selected once from the pre-discount total (calculations.modification_project_total_cost)"
      - name: engineering_fee_cents
        type: integer
        source: computed
        description: "engineering management fee on the post-discount construction cost"
      - name: total_cost_cents
        type: integer
        source: computed
        description: "post-discount construction cost + engineering_fee_cents"
      - name: allocation_basis
        type: enum
        source: input
        default: PRO_RATA_LOAD
        description: how the total cost is divided among beneficiary tenants
        constraints: "one of {PRO_RATA_LOAD, EQUAL_SHARE}"
      - name: allocated_cents
        type: integer
        source: computed
        default: 0
        description: "sum of CostShare.share_cents over shares of this project with status IN {PENDING, ACCEPTED, BILLED}"
      - name: proposing_engineer_user_id
        type: string
        source: system
        description: X-User-ID of the StructuralEngineer who created the project (segregation-of-duties input)
      - name: certified_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the StructuralEngineer who certified completion
      - name: funded_at
        type: datetime
        source: system
        default: null
        description: logical-clock instant the last outstanding cost share was accepted

  - name: CostShare
    parent: ModificationProject
    common_fields: true
    fields:
      - name: modification_project_id
        type: string
        source: input
        description: "FK -> ModificationProject.id; the project being funded"
      - name: tenant_id
        type: string
        source: input
        description: "FK -> Tenant.id; the beneficiary carrier charged this share"
      - name: site_amendment_id
        type: string
        source: input
        default: null
        description: "FK -> SiteAmendment.id; the EXECUTED amendment that makes this tenant a beneficiary; null for the applicant tenant that has no amendment yet"
      - name: basis_load_units
        type: number
        source: computed
        description: "the tenant's load units used as the pro-rata weight (amendment reserved_load_units, or the applicant's ColocationApplication.total_load_units)"
      - name: basis_created_at
        type: datetime
        source: computed
        description: "created_at of the basis record (SiteAmendment or ColocationApplication); decides who absorbs the rounding remainder"
      - name: share_cents
        type: integer
        source: computed
        description: "this tenant's allocated portion of ModificationProject.total_cost_cents (calculations.modification_cost_share_allocation)"
      - name: status
        type: enum
        source: system
        default: PENDING
        description: cost share lifecycle state
        constraints: "one of {PENDING, ACCEPTED, DECLINED, BILLED, VOIDED}"
      - name: accepted_at
        type: datetime
        source: system
        default: null
        description: logical-clock instant the tenant accepted the share

  - name: EquipmentAudit
    parent: Tower
    common_fields: true
    fields:
      - name: tower_id
        type: string
        source: input
        description: "FK -> Tower.id; the site being audited"
      - name: audit_date
        type: datetime
        source: input
        description: as-of date of the physical inspection; retroactive billing is measured to this date
      - name: basis
        type: enum
        source: input
        description: retroactive billing basis for every finding on this audit
        constraints: "one of {INSTALL_DATE_BASIS, DISCOVERY_LIMITED}"
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: audit lifecycle state
        constraints: "one of {SCHEDULED, IN_PROGRESS, FINALIZED}"
      - name: finding_count
        type: integer
        source: computed
        default: 0
        description: "count of AuditFinding rows on this audit"
      - name: retroactive_billing_total_cents
        type: integer
        source: computed
        default: 0
        description: "sum of AuditFinding.retroactive_billing_cents over findings on this audit; 0 when the audit has no findings"
      - name: auditor_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceAuditor who scheduled the audit

  - name: AuditFinding
    parent: EquipmentAudit
    common_fields: true
    fields:
      - name: equipment_audit_id
        type: string
        source: input
        description: "FK -> EquipmentAudit.id; the audit that recorded this finding"
      - name: tenant_id
        type: string
        source: input
        description: "FK -> Tenant.id; the carrier owning the unauthorized installation"
      - name: site_amendment_id
        type: string
        source: input
        default: null
        description: "FK -> SiteAmendment.id; the tenant's EXECUTED amendment the unauthorized gear was found next to, null when the tenant has no amendment on the tower"
      - name: description
        type: string
        source: input
        description: what was found on the structure
        constraints: "1..240 chars, non-blank"
      - name: observed_load_units
        type: number
        source: input
        description: measured load units of the unauthorized installation
        constraints: "> 0"
      - name: installed_on_date
        type: datetime
        source: input
        description: best-evidence installation date of the unauthorized equipment
      - name: mount_elevation_ft
        type: number
        source: input
        description: elevation at which the unauthorized equipment was found
        constraints: ">= 0"
      - name: months_billable
        type: integer
        source: computed
        default: 0
        description: "billable whole months resolved at audit finalization (calculations.retroactive_unauthorized_billing)"
      - name: retroactive_billing_cents
        type: integer
        source: computed
        default: 0
        description: "retroactive charge for this finding, 0 until the audit is FINALIZED"
      - name: status
        type: enum
        source: system
        default: OPEN
        description: finding lifecycle state
        constraints: "one of {OPEN, BILLED}"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  # ColocationApplication — cyclic (review <-> modification, review <-> hold)
  # plus branching on submit and on analysis result.
  # ---------------------------------------------------------------------------
  - entity: ColocationApplication
    axis: status
    initial_state: DRAFT
    terminal_states: [REJECTED, WITHDRAWN, AMENDMENT_ISSUED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /tower-colo/colocation-applications/{id}/submit"
        actor: Tenant
        preconditions:
          - "acting X-User-ID == MasterLeaseAgreement.tenant_id of the application's master lease"
          - "at least one EquipmentLine exists with colocation_application_id == this application"
          - "MasterLeaseAgreement.status == ACTIVE"
          - "MasterLeaseAgreement.application_privilege == ENABLED"
          - "requested band lies inside [tower.min_colocation_elevation_ft, tower.max_elevation_ft]"
          - "Tenant.credit_status == CURRENT"
        side_effects:
          - "submitted_at := logical clock"
          - "total_load_units recomputed via calculations.equipment_line_load_units over the application's lines"
          - "review_deadline_at recomputed via calculations.review_deadline"
          - "immediately followed by the system branch transition SUBMITTED->UNDER_STRUCTURAL_REVIEW or SUBMITTED->CAPACITY_HOLD in the same request"
      - from: SUBMITTED
        to: UNDER_STRUCTURAL_REVIEW
        trigger: "system branch evaluated inside POST /tower-colo/colocation-applications/{id}/submit"
        actor: system
        preconditions:
          - "tower.capacity_posture == OPEN"
        side_effects:
          - "tower.open_review_count incremented by 1"
      - from: SUBMITTED
        to: CAPACITY_HOLD
        trigger: "system branch evaluated inside POST /tower-colo/colocation-applications/{id}/submit"
        actor: system
        preconditions:
          - "tower.capacity_posture IN {RESTRICTED, FROZEN}"
        side_effects:
          - "tower.open_review_count unchanged"
        note: "divergent branch: no review slot is consumed and no analysis may be created while held"
      - from: CAPACITY_HOLD
        to: UNDER_STRUCTURAL_REVIEW
        trigger: "system promotion cascade when tower.capacity_posture becomes OPEN (from POST /tower-colo/site-amendments/{id}/complete-decommission, POST /tower-colo/modification-projects/{id}/certify-completion, or POST /tower-colo/modification-projects/{id}/cancel)"
        actor: system
        preconditions:
          - "tower.capacity_posture == OPEN after the recomputation that caused this cascade"
          - "this application is the single promotion winner: among applications on the tower with status == CAPACITY_HOLD, ordered by created_at ASC, then requested_ground_space_sqft ASC, then requested_elevation_bottom_ft ASC, it ranks first"
        side_effects:
          - "submitted_at := logical clock"
          - "review_deadline_at recomputed via calculations.review_deadline"
          - "tower.open_review_count incremented by 1"
          - "every StructuralAnalysis of this application with status == ISSUED or QUOTED is set to SUPERSEDED (stale-reference invalidation)"
        note: "exactly one application is promoted per posture-clearing event; the rest stay in CAPACITY_HOLD"
      - from: UNDER_STRUCTURAL_REVIEW
        to: CAPACITY_HOLD
        trigger: "system cascade when tower.capacity_posture becomes FROZEN (from POST /tower-colo/_clock/set_current_utc ground-lease expiry sweep, or POST /tower-colo/modification-projects/{id}/allocate-cost-shares funding)"
        actor: system
        preconditions:
          - "tower.capacity_posture == FROZEN after the recomputation that caused this cascade"
        side_effects:
          - "tower.open_review_count decremented by 1"
        note: "closes the review <-> hold cycle; a FROZEN posture pushes every reviewing application back to hold"
      - from: UNDER_STRUCTURAL_REVIEW
        to: MODIFICATION_REQUIRED
        trigger: "system evaluation inside POST /tower-colo/structural-analyses when result == MODIFICATION_REQUIRED"
        actor: system
        preconditions:
          - "the analysis just created is the only non-SUPERSEDED analysis of this application"
        side_effects:
          - "tower.open_review_count decremented by 1"
          - "sla_breached recomputed from the analysis issued_at against review_deadline_at"
      - from: UNDER_STRUCTURAL_REVIEW
        to: REJECTED
        trigger: "system evaluation inside POST /tower-colo/structural-analyses when result == CAPACITY_EXCEEDED"
        actor: system
        preconditions:
          - "projected_loading_pct >= STRUCTURAL_CAPACITY_LIMIT_PCT"
        side_effects:
          - "tower.open_review_count decremented by 1"
      - from: MODIFICATION_REQUIRED
        to: UNDER_STRUCTURAL_REVIEW
        trigger: "POST /tower-colo/colocation-applications/{id}/revise"
        actor: Tenant
        preconditions:
          - "acting X-User-ID == MasterLeaseAgreement.tenant_id"
          - "at least one EquipmentLine still exists for this application"
          - "MasterLeaseAgreement.application_privilege == ENABLED"
          - "tower.capacity_posture == OPEN"
        side_effects:
          - "revision_count incremented by 1"
          - "total_load_units recomputed from the surviving EquipmentLine rows"
          - "submitted_at := logical clock and review_deadline_at recomputed"
          - "every StructuralAnalysis of this application with status IN {ISSUED, QUOTED} is set to SUPERSEDED"
          - "tower.open_review_count incremented by 1"
        note: "revision loop: the tenant may drop or add equipment lines and be re-analysed any number of times"
      - from: UNDER_STRUCTURAL_REVIEW
        to: APPROVED
        trigger: "POST /tower-colo/colocation-applications/{id}/approve"
        actor: PortfolioAdmin
        preconditions:
          - "the application's newest StructuralAnalysis with status IN {ISSUED, QUOTED} has result == PASS"
          - "tower.capacity_posture != FROZEN"
          - "Tenant.credit_status == CURRENT"
        side_effects:
          - "tower.open_review_count decremented by 1"
      - from: MODIFICATION_REQUIRED
        to: APPROVED
        trigger: "POST /tower-colo/colocation-applications/{id}/approve"
        actor: PortfolioAdmin
        preconditions:
          - "a ModificationProject with status == CERTIFIED exists whose originating_analysis_id is the newest non-SUPERSEDED StructuralAnalysis of this application"
          - "tower.capacity_posture != FROZEN"
          - "Tenant.credit_status == CURRENT"
        side_effects: []
        note: "the certified reinforcement replaces the PASS requirement"
      - from: MODIFICATION_REQUIRED
        to: REJECTED
        trigger: "POST /tower-colo/colocation-applications/{id}/reject"
        actor: PortfolioAdmin
        preconditions: []
        side_effects: []
      - from: UNDER_STRUCTURAL_REVIEW
        to: REJECTED
        trigger: "POST /tower-colo/colocation-applications/{id}/reject"
        actor: PortfolioAdmin
        preconditions: []
        side_effects:
          - "tower.open_review_count decremented by 1"
      - from: SUBMITTED
        to: ON_HOLD
        trigger: "system cascade when the tenant's MasterLeaseAgreement.application_privilege becomes SUSPENDED (from POST /tower-colo/equipment-audits/{id}/finalize, cost-share billing, or the POST /tower-colo/_clock/set_current_utc master-lease expiry sweep)"
        actor: system
        preconditions:
          - "MasterLeaseAgreement.application_privilege == SUSPENDED"
        side_effects: []
      - from: UNDER_STRUCTURAL_REVIEW
        to: ON_HOLD
        trigger: "system cascade when the tenant's MasterLeaseAgreement.application_privilege becomes SUSPENDED"
        actor: system
        preconditions:
          - "MasterLeaseAgreement.application_privilege == SUSPENDED"
        side_effects:
          - "tower.open_review_count decremented by 1"
      - from: ON_HOLD
        to: SUBMITTED
        trigger: "system cascade when the tenant's MasterLeaseAgreement.application_privilege returns to ENABLED (from POST /tower-colo/tenants/{id}/payments, POST /tower-colo/master-lease-agreements/{id}/reinstate, POST /tower-colo/site-amendments/{id}/complete-decommission deposit release, or POST /tower-colo/modification-projects/{id}/cancel share reversal)"
        actor: system
        preconditions:
          - "MasterLeaseAgreement.application_privilege == ENABLED"
          - "Tenant.credit_status == CURRENT"
        side_effects:
          - "submitted_at := logical clock and review_deadline_at recomputed"
        note: "the un-held application re-enters SUBMITTED and is re-branched by the tower posture on the tenant's next submit-equivalent action; it does NOT auto-enter review"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /tower-colo/colocation-applications/{id}/withdraw"
        actor: Tenant
        preconditions:
          - "acting X-User-ID == MasterLeaseAgreement.tenant_id"
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /tower-colo/colocation-applications/{id}/withdraw"
        actor: Tenant
        preconditions:
          - "acting X-User-ID == MasterLeaseAgreement.tenant_id"
        side_effects: []
      - from: UNDER_STRUCTURAL_REVIEW
        to: WITHDRAWN
        trigger: "POST /tower-colo/colocation-applications/{id}/withdraw"
        actor: Tenant
        preconditions:
          - "acting X-User-ID == MasterLeaseAgreement.tenant_id"
        side_effects:
          - "tower.open_review_count decremented by 1"
          - "every StructuralAnalysis of this application with status IN {ISSUED, QUOTED} is set to SUPERSEDED"
      - from: CAPACITY_HOLD
        to: WITHDRAWN
        trigger: "POST /tower-colo/colocation-applications/{id}/withdraw"
        actor: Tenant
        preconditions:
          - "acting X-User-ID == MasterLeaseAgreement.tenant_id"
        side_effects: []
      - from: MODIFICATION_REQUIRED
        to: WITHDRAWN
        trigger: "POST /tower-colo/colocation-applications/{id}/withdraw"
        actor: Tenant
        preconditions:
          - "acting X-User-ID == MasterLeaseAgreement.tenant_id"
        side_effects:
          - "every StructuralAnalysis of this application with status IN {ISSUED, QUOTED} is set to SUPERSEDED"
      - from: APPROVED
        to: AMENDMENT_ISSUED
        trigger: "POST /tower-colo/site-amendments"
        actor: PortfolioAdmin
        preconditions:
          - "no SiteAmendment already references this application"
        side_effects:
          - "a SiteAmendment is created in execution_status DRAFT / billing_status NOT_BILLING copying the application's band, ground space and total_load_units"

  # ---------------------------------------------------------------------------
  # SiteAmendment — axis 1 of 2: execution / occupancy
  # ---------------------------------------------------------------------------
  - entity: SiteAmendment
    axis: execution_status
    initial_state: DRAFT
    terminal_states: [TERMINATED, VOIDED]
    transitions:
      - from: DRAFT
        to: PENDING_SIGNATURE
        trigger: "POST /tower-colo/site-amendments/{id}/execute with signature_received == false"
        actor: PortfolioAdmin
        preconditions:
          - "GroundLease with tower_id == amendment.tower_id has status == ACTIVE"
        side_effects: []
        note: "an execute call that has not yet collected the tenant countersignature parks the amendment for signature without claiming capacity"
      - from: DRAFT
        to: EXECUTED
        trigger: "POST /tower-colo/site-amendments/{id}/execute with signature_received == true"
        actor: PortfolioAdmin
        preconditions:
          - "GroundLease with tower_id == amendment.tower_id has status == ACTIVE"
          - "amendment.term_end_date <= that GroundLease.term_end_date"
          - "tower.capacity_posture != FROZEN"
          - "no elevation-band conflict per validations[priority=18] against other EXECUTED amendments on the tower, excluding supersedes_amendment_id"
          - "tower.available_ground_space_sqft (excluding the superseded amendment's ground space) >= amendment.ground_space_sqft"
          - "round_half_up(100 * (tower.reserved_load_units - superseded_load + amendment.reserved_load_units) / tower.rated_capacity_load_units, 3) < STRUCTURAL_CAPACITY_LIMIT_PCT"
          - "Tenant.credit_status == CURRENT"
        side_effects:
          - "billing_status transitions NOT_BILLING->BILLING in the same request"
          - "restoration_status := PENDING when restoration_deposit_cents > 0, else NOT_REQUIRED"
          - "Tenant.outstanding_balance_cents increased by restoration_deposit_cents"
          - "every EquipmentLine of the amendment's application gets installed_amendment_id := this amendment id"
          - "when supersedes_amendment_id is set: that amendment moves EXECUTED->TERMINATED with restoration_status := COMPLETE and billing_status := CLOSED"
          - "tower.reserved_load_units, reserved_load_pct, reserved_ground_space_sqft, available_ground_space_sqft, occupied_elevation_bands and capacity_posture recomputed"
          - "MasterLeaseAgreement.executed_amendment_count recomputed"
          - "tower.version incremented by 1"
      - from: PENDING_SIGNATURE
        to: EXECUTED
        trigger: "POST /tower-colo/site-amendments/{id}/execute with signature_received == true"
        actor: PortfolioAdmin
        preconditions:
          - "same preconditions as DRAFT->EXECUTED, re-evaluated against current state"
        side_effects:
          - "identical to DRAFT->EXECUTED"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /tower-colo/site-amendments/{id}/void"
        actor: PortfolioAdmin
        preconditions: []
        side_effects:
          - "billing_status := CLOSED"
      - from: PENDING_SIGNATURE
        to: VOIDED
        trigger: "POST /tower-colo/site-amendments/{id}/void"
        actor: PortfolioAdmin
        preconditions: []
        side_effects:
          - "billing_status := CLOSED"
      - from: EXECUTED
        to: TERMINATION_NOTICED
        trigger: "POST /tower-colo/site-amendments/{id}/termination-notice"
        actor: Tenant
        preconditions:
          - "acting X-User-ID == MasterLeaseAgreement.tenant_id of the amendment's master lease"
          - "billing_status != CLOSED"
        side_effects:
          - "notice_given_at := logical clock"
          - "restoration_status := PENDING"
          - "capacity remains reserved on the tower until decommissioning completes"
      - from: TERMINATION_NOTICED
        to: TERMINATED
        trigger: "POST /tower-colo/site-amendments/{id}/complete-decommission"
        actor: PortfolioAdmin
        preconditions:
          - "restoration_status == PENDING"
          - "restoration_confirmed == true in the request body"
        side_effects:
          - "terminated_at := logical clock, restoration_status := COMPLETE, billing_status := CLOSED"
          - "CASCADE L1->L2: because the amendment terminated with restoration COMPLETE, Tenant.outstanding_balance_cents is decreased by restoration_deposit_cents (deposit release)"
          - "CASCADE L2->L3: because the balance dropped, Tenant.credit_status is recomputed and may flip DELINQUENT->CURRENT"
          - "CASCADE L3->L4: because credit_status became CURRENT, every MasterLeaseAgreement of that tenant with status == ACTIVE has application_privilege recomputed to ENABLED, and each of that master lease's applications in status ON_HOLD moves ON_HOLD->SUBMITTED"
          - "tower.reserved_load_units, reserved_ground_space_sqft, available_ground_space_sqft, occupied_elevation_bands, reserved_load_pct and capacity_posture recomputed (capacity release)"
          - "when the recomputation makes tower.capacity_posture == OPEN, the single promotion winner among the tower's CAPACITY_HOLD applications moves CAPACITY_HOLD->UNDER_STRUCTURAL_REVIEW"
          - "every EquipmentLine with installed_amendment_id == this amendment keeps the reference (historical record) but no longer contributes load"
          - "MasterLeaseAgreement.executed_amendment_count recomputed"
          - "tower.version incremented by 1"

  # ---------------------------------------------------------------------------
  # SiteAmendment — axis 2 of 2: billing (independent of execution between
  # EXECUTED and TERMINATED; cyclic BILLING <-> SUSPENDED)
  # ---------------------------------------------------------------------------
  - entity: SiteAmendment
    axis: billing_status
    initial_state: NOT_BILLING
    terminal_states: [CLOSED]
    transitions:
      - from: NOT_BILLING
        to: BILLING
        trigger: "system side effect of the execution axis reaching EXECUTED"
        actor: system
        preconditions:
          - "execution_status == EXECUTED"
        side_effects:
          - "current_monthly_rent_cents recomputed via calculations.amendment_rent_escalation"
      - from: BILLING
        to: SUSPENDED
        trigger: "POST /tower-colo/site-amendments/{id}/billing-status with to_status == SUSPENDED"
        actor: PortfolioAdmin
        preconditions:
          - "execution_status IN {EXECUTED, TERMINATION_NOTICED}"
        side_effects: []
        note: "billing may be suspended while occupancy continues — the two axes evolve independently"
      - from: SUSPENDED
        to: BILLING
        trigger: "POST /tower-colo/site-amendments/{id}/billing-status with to_status == BILLING"
        actor: PortfolioAdmin
        preconditions:
          - "execution_status IN {EXECUTED, TERMINATION_NOTICED}"
        side_effects:
          - "current_monthly_rent_cents recomputed via calculations.amendment_rent_escalation"
      - from: BILLING
        to: CLOSED
        trigger: "system side effect of the execution axis reaching TERMINATED, or POST /tower-colo/site-amendments/{id}/billing-status with to_status == CLOSED"
        actor: system
        preconditions:
          - "execution_status IN {TERMINATED, VOIDED} for the system path; execution_status == TERMINATION_NOTICED for the explicit path"
        side_effects: []
      - from: SUSPENDED
        to: CLOSED
        trigger: "system side effect of the execution axis reaching TERMINATED"
        actor: system
        preconditions:
          - "execution_status == TERMINATED"
        side_effects: []
      - from: NOT_BILLING
        to: CLOSED
        trigger: "system side effect of the execution axis reaching VOIDED"
        actor: system
        preconditions:
          - "execution_status == VOIDED"
        side_effects: []

  # ---------------------------------------------------------------------------
  # ModificationProject — fork/join: COST_ALLOCATED forks on cost-share replies
  # and joins into FUNDED (all accepted) or STALLED (any declined).
  # ---------------------------------------------------------------------------
  - entity: ModificationProject
    initial_state: PROPOSED
    terminal_states: [CERTIFIED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: COST_ALLOCATED
        trigger: "POST /tower-colo/modification-projects/{id}/allocate-cost-shares"
        actor: StructuralEngineer
        preconditions:
          - "originating StructuralAnalysis.status == QUOTED with modification_construction_cost_cents > 0"
          - "at least one beneficiary tenant resolves per validations[priority=32]"
          - "no other ModificationProject on the same tower with status IN {PROPOSED, COST_ALLOCATED, FUNDED, IN_CONSTRUCTION} has an intersecting construction window"
        side_effects:
          - "base_construction_cost_cents, volume_discount_pct, engineering_fee_cents and total_cost_cents computed via calculations.modification_project_total_cost"
          - "one CostShare per beneficiary tenant created in status PENDING via calculations.modification_cost_share_allocation"
          - "allocated_cents := total_cost_cents (invariant: sum of PENDING/ACCEPTED/BILLED share_cents == total_cost_cents)"
          - "tower.capacity_posture recomputed (unchanged by allocation alone)"
      - from: COST_ALLOCATED
        to: COST_ALLOCATED
        trigger: "POST /tower-colo/modification-projects/{id}/reallocate-cost-shares"
        actor: StructuralEngineer
        preconditions:
          - "expected_modification_project_version equals the project's current version"
          - "no CostShare of this project has status == BILLED"
        side_effects:
          - "every CostShare of this project with status IN {PENDING, ACCEPTED} is set to VOIDED"
          - "a fresh CostShare set is created in status PENDING under the requested allocation_basis"
          - "version incremented by 1"
        note: "self-loop: reallocation supersedes the prior allocation for the same project"
      - from: COST_ALLOCATED
        to: FUNDED
        trigger: "system join evaluated inside POST /tower-colo/cost-shares/{id}/accept"
        actor: system
        preconditions:
          - "every CostShare of this project with status != VOIDED has status == ACCEPTED"
        side_effects:
          - "funded_at := logical clock"
          - "every ACCEPTED CostShare moves ACCEPTED->BILLED and Tenant.outstanding_balance_cents increases by share_cents"
          - "each affected Tenant.credit_status recomputed; a flip to DELINQUENT sets application_privilege := SUSPENDED on that tenant's ACTIVE master leases and moves their SUBMITTED/UNDER_STRUCTURAL_REVIEW applications to ON_HOLD"
          - "tower.capacity_posture recomputed to FROZEN (a funded reinforcement blocks new occupancy)"
          - "every application on the tower with status == UNDER_STRUCTURAL_REVIEW moves UNDER_STRUCTURAL_REVIEW->CAPACITY_HOLD"
          - "tower.version incremented by 1"
      - from: COST_ALLOCATED
        to: STALLED
        trigger: "system join evaluated inside POST /tower-colo/cost-shares/{id}/decline"
        actor: system
        preconditions:
          - "at least one CostShare of this project has status == DECLINED"
        side_effects:
          - "every CostShare of this project with status == PENDING is set to VOIDED"
          - "ACCEPTED shares are left untouched and are NOT billed"
          - "tower.capacity_posture recomputed (no freeze — the divergent branch does not reserve the structure)"
        note: "divergent side-effect set versus the FUNDED branch: no billing, no freeze, no application push-back"
      - from: FUNDED
        to: IN_CONSTRUCTION
        trigger: "POST /tower-colo/modification-projects/{id}/start-construction"
        actor: StructuralEngineer
        preconditions:
          - "logical clock date >= construction_window_start_date"
        side_effects:
          - "tower.capacity_posture stays FROZEN"
      - from: IN_CONSTRUCTION
        to: CERTIFIED
        trigger: "POST /tower-colo/modification-projects/{id}/certify-completion"
        actor: StructuralEngineer
        preconditions:
          - "acting X-User-ID != proposing_engineer_user_id"
          - "acting X-User-ID != engineer_user_id of the originating StructuralAnalysis"
          - "every CostShare of this project with status != VOIDED has status == BILLED"
          - "added_capacity_load_units > 0 in the request body"
        side_effects:
          - "certified_by_user_id := acting X-User-ID"
          - "tower.rated_capacity_load_units increased by added_capacity_load_units"
          - "tower.reserved_load_pct, available_ground_space_sqft and capacity_posture recomputed (FROZEN lifted)"
          - "when the recomputation makes tower.capacity_posture == OPEN, the single promotion winner among the tower's CAPACITY_HOLD applications moves CAPACITY_HOLD->UNDER_STRUCTURAL_REVIEW"
          - "tower.version incremented by 1"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /tower-colo/modification-projects/{id}/cancel"
        actor: PortfolioAdmin
        preconditions: []
        side_effects:
          - "tower.capacity_posture recomputed"
      - from: COST_ALLOCATED
        to: CANCELLED
        trigger: "POST /tower-colo/modification-projects/{id}/cancel"
        actor: PortfolioAdmin
        preconditions: []
        side_effects:
          - "every CostShare with status IN {PENDING, ACCEPTED} is set to VOIDED"
          - "allocated_cents := 0"
          - "tower.capacity_posture recomputed"
      - from: STALLED
        to: CANCELLED
        trigger: "POST /tower-colo/modification-projects/{id}/cancel"
        actor: PortfolioAdmin
        preconditions: []
        side_effects:
          - "every CostShare with status IN {PENDING, ACCEPTED} is set to VOIDED"
          - "allocated_cents := 0"
          - "tower.capacity_posture recomputed"
      - from: FUNDED
        to: CANCELLED
        trigger: "POST /tower-colo/modification-projects/{id}/cancel"
        actor: PortfolioAdmin
        preconditions: []
        side_effects:
          - "COMPENSATION L1: every CostShare with status == BILLED is set to VOIDED and Tenant.outstanding_balance_cents is decreased by that share_cents (exact reversal of the FUNDED billing)"
          - "COMPENSATION L2: each affected Tenant.credit_status recomputed; a flip DELINQUENT->CURRENT restores application_privilege := ENABLED on that tenant's ACTIVE master leases and moves their ON_HOLD applications to SUBMITTED"
          - "allocated_cents := 0"
          - "tower.capacity_posture recomputed (FROZEN lifted because no funded project remains)"
          - "when the recomputation makes tower.capacity_posture == OPEN, the single promotion winner among the tower's CAPACITY_HOLD applications moves CAPACITY_HOLD->UNDER_STRUCTURAL_REVIEW"
          - "tower.version incremented by 1"

  # ---------------------------------------------------------------------------
  # CostShare
  # ---------------------------------------------------------------------------
  - entity: CostShare
    initial_state: PENDING
    terminal_states: [DECLINED, BILLED, VOIDED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /tower-colo/cost-shares/{id}/accept"
        actor: Tenant
        preconditions:
          - "acting X-User-ID == CostShare.tenant_id"
          - "ModificationProject.status == COST_ALLOCATED"
        side_effects:
          - "accepted_at := logical clock"
          - "when no non-VOIDED sibling share remains PENDING, the parent project joins COST_ALLOCATED->FUNDED"
      - from: PENDING
        to: DECLINED
        trigger: "POST /tower-colo/cost-shares/{id}/decline"
        actor: Tenant
        preconditions:
          - "acting X-User-ID == CostShare.tenant_id"
          - "ModificationProject.status == COST_ALLOCATED"
        side_effects:
          - "the parent project joins COST_ALLOCATED->STALLED"
      - from: ACCEPTED
        to: BILLED
        trigger: "system side effect of the parent project reaching FUNDED"
        actor: system
        preconditions:
          - "ModificationProject.status == FUNDED"
        side_effects:
          - "Tenant.outstanding_balance_cents increased by share_cents"
      - from: PENDING
        to: VOIDED
        trigger: "system side effect of project reallocation, STALLED join, or cancellation"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: VOIDED
        trigger: "system side effect of project reallocation or cancellation"
        actor: system
        preconditions: []
        side_effects: []
      - from: BILLED
        to: VOIDED
        trigger: "system side effect of POST /tower-colo/modification-projects/{id}/cancel from FUNDED"
        actor: system
        preconditions:
          - "ModificationProject.status == FUNDED at the time of cancellation"
        side_effects:
          - "Tenant.outstanding_balance_cents decreased by share_cents"

  # ---------------------------------------------------------------------------
  # GroundLease — cyclic renewal loop ACTIVE -> RENEWAL_NEGOTIATION -> ACTIVE
  # ---------------------------------------------------------------------------
  - entity: GroundLease
    initial_state: ACTIVE
    terminal_states: [EXPIRED, BOUGHT_OUT]
    transitions:
      - from: ACTIVE
        to: RENEWAL_NEGOTIATION
        trigger: "POST /tower-colo/ground-leases/{id}/open-renewal"
        actor: PortfolioAdmin
        preconditions:
          - "renewals_exercised < renewal_option_count"
          - "logical clock date >= term_end_date - RENEWAL_WINDOW_DAYS"
        side_effects: []
      - from: RENEWAL_NEGOTIATION
        to: ACTIVE
        trigger: "POST /tower-colo/ground-leases/{id}/renew"
        actor: PortfolioAdmin
        preconditions:
          - "renewals_exercised < renewal_option_count"
        side_effects:
          - "base_monthly_rent_cents := current_monthly_rent_cents evaluated at the old term_end_date (escalation baseline reset)"
          - "commencement_date := old term_end_date + 1 day"
          - "term_end_date := old term_end_date + renewal_term_years years"
          - "renewals_exercised incremented by 1"
          - "current_monthly_rent_cents recomputed from the reset baseline"
          - "tower.capacity_posture recomputed"
        note: "closes the renewal cycle; each pass consumes one option and resets the simple-escalation baseline"
      - from: ACTIVE
        to: BOUGHT_OUT
        trigger: "POST /tower-colo/ground-leases/{id}/buyout"
        actor: PortfolioAdmin
        preconditions:
          - "buyout_price_cents > 0"
        side_effects:
          - "buyout_paid_cents := buyout_price_cents"
          - "paid_through_date := term_end_date (no further landlord payments accrue)"
          - "tower.capacity_posture recomputed (a bought-out lease never freezes the tower)"
      - from: RENEWAL_NEGOTIATION
        to: BOUGHT_OUT
        trigger: "POST /tower-colo/ground-leases/{id}/buyout"
        actor: PortfolioAdmin
        preconditions:
          - "buyout_price_cents > 0"
        side_effects:
          - "buyout_paid_cents := buyout_price_cents"
          - "paid_through_date := term_end_date"
          - "tower.capacity_posture recomputed"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system expiry sweep inside POST /tower-colo/_clock/set_current_utc"
        actor: system
        preconditions:
          - "term_end_date < the new logical clock instant"
        side_effects:
          - "CASCADE L1->L2: because the lease expired, tower.capacity_posture is recomputed to FROZEN"
          - "CASCADE L2->L3: because the posture became FROZEN, every application on that tower with status == UNDER_STRUCTURAL_REVIEW moves UNDER_STRUCTURAL_REVIEW->CAPACITY_HOLD and tower.open_review_count drops to 0"
          - "tower.version incremented by 1"
      - from: RENEWAL_NEGOTIATION
        to: EXPIRED
        trigger: "system expiry sweep inside POST /tower-colo/_clock/set_current_utc"
        actor: system
        preconditions:
          - "term_end_date < the new logical clock instant"
        side_effects:
          - "identical cascade to ACTIVE->EXPIRED"

  # ---------------------------------------------------------------------------
  # MasterLeaseAgreement
  # ---------------------------------------------------------------------------
  - entity: MasterLeaseAgreement
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /tower-colo/master-lease-agreements/{id}/activate"
        actor: PortfolioAdmin
        preconditions:
          - "expires_on > the logical clock instant"
        side_effects:
          - "application_privilege recomputed (ENABLED when the tenant's credit_status == CURRENT)"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system expiry sweep inside POST /tower-colo/_clock/set_current_utc"
        actor: system
        preconditions:
          - "expires_on < the new logical clock instant"
        side_effects:
          - "application_privilege := SUSPENDED"
          - "every application under this master lease with status IN {SUBMITTED, UNDER_STRUCTURAL_REVIEW} moves to ON_HOLD"

  # ---------------------------------------------------------------------------
  # EquipmentAudit
  # ---------------------------------------------------------------------------
  - entity: EquipmentAudit
    initial_state: SCHEDULED
    terminal_states: [FINALIZED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /tower-colo/equipment-audits/{id}/start"
        actor: ComplianceAuditor
        preconditions:
          - "audit_date <= the logical clock instant"
        side_effects: []
      - from: IN_PROGRESS
        to: FINALIZED
        trigger: "POST /tower-colo/equipment-audits/{id}/finalize"
        actor: ComplianceAuditor
        preconditions: []
        side_effects:
          - "CASCADE L1: every AuditFinding with status == OPEN gets months_billable and retroactive_billing_cents computed via calculations.retroactive_unauthorized_billing and moves OPEN->BILLED; retroactive_billing_total_cents := sum over findings (0 when the audit has no findings)"
          - "CASCADE L1->L2: because the findings were billed, each affected Tenant.outstanding_balance_cents is increased by that tenant's finding total"
          - "CASCADE L2->L3: because the balance rose, Tenant.credit_status is recomputed and may flip CURRENT->DELINQUENT"
          - "CASCADE L3->L4: because credit_status became DELINQUENT, every MasterLeaseAgreement of that tenant with status == ACTIVE gets application_privilege := SUSPENDED, and each of those master leases' applications with status IN {SUBMITTED, UNDER_STRUCTURAL_REVIEW} moves to ON_HOLD (tower.open_review_count decremented for each leaving review)"

# =============================================================================
# 1.2.1 Concurrency Rules  (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: analysis-create-stale-tower
    parent_entity: Tower
    write_endpoint: "POST /tower-colo/structural-analyses"
    occ_field: "expected_tower_version"
    description: |
      Creating a StructuralAnalysis against a Tower whose version has advanced
      since the engineer last observed it is rejected with a stale-version
      error. A new analysis legitimately supersedes the prior analysis of the
      same application, so the write itself is always product-legal; the OCC
      check exists because the tower's structural picture (reserved load,
      posture, rated capacity) may have moved under the engineer's feet, which
      would silently change the analysis result.
    error_id: ERR_STALE_TOWER_VERSION
    http_status: 412
  - rule_id: cost-share-reallocate-stale-project
    parent_entity: ModificationProject
    write_endpoint: "POST /tower-colo/modification-projects/{id}/reallocate-cost-shares"
    occ_field: "expected_modification_project_version"
    description: |
      Reallocating cost shares against a ModificationProject whose version has
      advanced since the engineer last observed it is rejected with a stale-version
      error. Reallocation legitimately supersedes the previous allocation (all
      PENDING/ACCEPTED shares are voided and a fresh set is minted), so the
      operation is product-legal from COST_ALLOCATED; the OCC check exists because
      the beneficiary set and the total cost may have changed since the version the
      client read.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: equipment_line_load_units
    trigger: "on POST /tower-colo/colocation-applications/{id}/equipment-lines, on DELETE /tower-colo/equipment-lines/{id} (siblings unchanged, application total recomputed), and on every recomputation of ColocationApplication.total_load_units (submit, revise)"
    algorithm: tiered_pricing
    formula: |
      # elevation tier is selected by a strict conditional ladder on mount_elevation_ft
      if mount_elevation_ft < 100:        elev_mult = 1.00
      elif mount_elevation_ft < 200:      elev_mult = 1.25   # 100 <= e < 200
      else:                               elev_mult = 1.50   # e >= 200
      raw = (unit_weight_lbs + WIND_COEFF_LBS_PER_SQFT * wind_area_sqft) * quantity * elev_mult
      EquipmentLine.load_units = round_half_up(raw, 3)
      # application rollup: round each line to 3 decimals FIRST, then sum the rounded lines
      ColocationApplication.total_load_units = sum(round_half_up(line_raw, 3) for each line of the application)
    input_set: "every EquipmentLine row whose colocation_application_id == the application; deleted lines are excluded immediately"
    constants:
      WIND_COEFF_LBS_PER_SQFT: 30
      ELEV_TIER_1_LIMIT_FT: 100
      ELEV_TIER_2_LIMIT_FT: 200
      ELEV_MULT_TIER_1: 1.00
      ELEV_MULT_TIER_2: 1.25
      ELEV_MULT_TIER_3: 1.50
    precision: "3 decimal places, round_half_up, per line then summed (never sum-then-round)"

  - name: structural_loading_analysis
    trigger: "on POST /tower-colo/structural-analyses (writes included_load_units, projected_loading_pct, result)"
    algorithm: aggregation
    formula: |
      base = tower.reserved_load_units          # calculations.tower_capacity_reconciliation
      subject = application.total_load_units
      if variant == PRELIMINARY:
          pipeline = 0
      else:  # DETAILED
          pipeline = sum(other.total_load_units) over ColocationApplication rows `other` where
                       other.tower_id == tower.id AND other.id != application.id AND (
                         other.status IN {APPROVED, MODIFICATION_REQUIRED}
                         OR (other.status == AMENDMENT_ISSUED AND its SiteAmendment.execution_status IN {DRAFT, PENDING_SIGNATURE})
                       )
      included_load_units = base + subject + pipeline
      projected_loading_pct = round_half_up(100 * included_load_units / tower.rated_capacity_load_units, 3)
      if   projected_loading_pct <= STRUCTURAL_PASS_LIMIT_PCT:      result = PASS
      elif projected_loading_pct <  STRUCTURAL_CAPACITY_LIMIT_PCT:  result = MODIFICATION_REQUIRED
      else:                                                        result = CAPACITY_EXCEEDED
    input_set: "PRELIMINARY counts only load already standing on the structure (tower baseline + EXECUTED amendments) plus the subject application. DETAILED additionally counts reserved-but-unbuilt pipeline demand: other applications on the tower in status APPROVED or MODIFICATION_REQUIRED, and applications in AMENDMENT_ISSUED whose amendment has not been executed. Applications in DRAFT, SUBMITTED, UNDER_STRUCTURAL_REVIEW, CAPACITY_HOLD, ON_HOLD, REJECTED or WITHDRAWN are excluded from both variants."
    constants:
      STRUCTURAL_PASS_LIMIT_PCT: 95.0
      STRUCTURAL_CAPACITY_LIMIT_PCT: 100.0
    precision: "projected_loading_pct: 3 decimal places, round_half_up; thresholds compared on the ROUNDED value"
    variants:
      - name: PRELIMINARY
        when: "desktop screen requested by the engineer (variant == PRELIMINARY)"
        difference: "pipeline term is 0 — reserved-but-unbuilt demand from other tenants is invisible, so the same tower and the same equipment can pass"
      - name: DETAILED
        when: "full sealed analysis requested by the engineer (variant == DETAILED)"
        difference: "pipeline term adds every other application's total_load_units in APPROVED / MODIFICATION_REQUIRED / unexecuted-AMENDMENT_ISSUED status, which can push the identical subject application from PASS to MODIFICATION_REQUIRED or CAPACITY_EXCEEDED"

  - name: review_deadline
    trigger: "on ColocationApplication entering SUBMITTED (submit), UNDER_STRUCTURAL_REVIEW (promotion from CAPACITY_HOLD), or on revise; evaluated for breach on POST /tower-colo/structural-analyses"
    algorithm: threshold
    formula: |
      review_days = MLA.expedited_review_days if (application.expedited_requested == true AND MLA.expedited_review_days is not null)
                    else STANDARD_REVIEW_DAYS
      review_deadline_at = submitted_at + review_days * 24h
      # breach evaluated when the first analysis after the latest review entry is created:
      breach = (analysis.issued_at > review_deadline_at)      # strictly greater; equality is NOT a breach
      if breach AND application.sla_breached == false:
          application.sla_breached = true
          credit_cents = round_half_up(MLA.base_monthly_rent_cents * SLA_CREDIT_PCT)
          Tenant.outstanding_balance_cents -= credit_cents        # credit, may go negative
          Tenant.credit_status recomputed
    input_set: "the application's own submitted_at and its master lease's expedited commitment; only the FIRST analysis issued after the latest review entry can trigger the credit, and only once per application (sla_breached latch)"
    constants:
      STANDARD_REVIEW_DAYS: 45
      SLA_CREDIT_PCT: 0.25
    precision: "credit_cents: whole cents, round_half_up; deadline comparison on exact ISO instants"

  - name: amendment_rent_escalation
    trigger: "on SiteAmendment billing_status entering BILLING (from execution or un-suspension) and on every read of SiteAmendment.current_monthly_rent_cents"
    algorithm: chronological
    formula: |
      n = count of integers k >= 1 such that (effective_date + k years) <= logical_clock_instant
      r = base_monthly_rent_cents
      for i in 1..n:
          r = round_half_up(r * (1 + escalator_pct / 100))      # ROUND AT EVERY ANNIVERSARY
      cap = round_half_up(base_monthly_rent_cents * ESCALATION_CAP_MULTIPLE)
      current_monthly_rent_cents = min(r, cap)
    input_set: "the amendment's own baseline (base_monthly_rent_cents, escalator_pct, effective_date) and the logical clock; anniversaries land on the same month/day as effective_date"
    constants:
      ESCALATION_CAP_MULTIPLE: 1.50
    precision: |
      Whole cents, round_half_up, applied ONCE PER ANNIVERSARY on the running value.
      The compounding is therefore over already-rounded cents: the pinned order is
      "round then compound", NOT round_half_up(base * (1 + e)^n). For base 250000 at
      3.5% over 4 anniversaries the pinned order yields 286880 while the single-shot
      power form yields 286881 — the implementation MUST produce 286880.

  - name: ground_lease_current_rent
    trigger: "on every read of GroundLease.current_monthly_rent_cents, on POST /tower-colo/landlord-payments (per covered month), and on GroundLease RENEWAL_NEGOTIATION->ACTIVE (baseline reset)"
    algorithm: threshold
    formula: |
      def lease_rent_at(as_of):
          n = count of integers k >= 1 such that (commencement_date + k years) <= as_of
          return round_half_up(base_monthly_rent_cents * (1 + escalator_pct / 100 * n))   # SIMPLE, single rounding
      current_monthly_rent_cents = lease_rent_at(logical_clock_instant)
    input_set: "the lease's own baseline fields and the evaluation instant; renewal resets base_monthly_rent_cents and commencement_date, which restarts n at 0"
    constants: {}
    precision: "whole cents, round_half_up, exactly one rounding step (contrast with amendment_rent_escalation, which rounds per anniversary)"

  - name: landlord_payment_amount
    trigger: "on POST /tower-colo/landlord-payments"
    algorithm: aggregation
    formula: |
      months = the ordered list of calendar months fully contained in the inclusive-inclusive
               interval [period_start_date, period_end_date]
      months_covered = len(months)
      amount_cents = sum(lease_rent_at(first day of m) for m in months)   # round per month, then sum
    input_set: "every whole calendar month between period_start_date and period_end_date inclusive; the period must start on the first day of a month and end on the last day of a month (validations[priority=28])"
    constants: {}
    precision: "each month's rent rounded to whole cents by ground_lease_current_rent, then summed; never sum-then-round"

  - name: modification_project_total_cost
    trigger: "on POST /tower-colo/modification-projects/{id}/allocate-cost-shares and on POST /tower-colo/modification-projects/{id}/reallocate-cost-shares"
    algorithm: constraint_propagation
    formula: |
      # Circular-looking dependency: the engineering fee is a percentage of construction
      # cost, the volume discount tier is keyed on the TOTAL (construction + fee), and the
      # discount changes the construction cost that the fee is computed from. The
      # evaluation order below is PINNED and MUST NOT be iterated to a fixed point.
      1. base_construction_cents   = originating_analysis.modification_construction_cost_cents
      2. base_engineering_fee_cents = round_half_up(base_construction_cents * ENG_FEE_PCT)
      3. base_total_cents          = base_construction_cents + base_engineering_fee_cents
      4. volume_discount_pct       = 0.03  if base_total_cents >= DISCOUNT_TIER_2_CENTS
                                     0.015 if base_total_cents >= DISCOUNT_TIER_1_CENTS
                                     0     otherwise
         # the tier is selected ONCE from base_total_cents (step 3) and is NEVER re-derived
         # from the post-discount total
      5. final_construction_cents  = base_construction_cents - round_half_up(base_construction_cents * volume_discount_pct)
      6. engineering_fee_cents     = round_half_up(final_construction_cents * ENG_FEE_PCT)   # fee recomputed on the DISCOUNTED construction cost
      7. total_cost_cents          = final_construction_cents + engineering_fee_cents
      base_construction_cost_cents = base_construction_cents
    input_set: "only the originating StructuralAnalysis's quoted construction cost; no other project on the tower contributes"
    constants:
      ENG_FEE_PCT: 0.12
      DISCOUNT_TIER_1_CENTS: 10000000
      DISCOUNT_TIER_2_CENTS: 25000000
    precision: "whole cents, round_half_up at steps 2, 5 and 6 in exactly that order"

  - name: modification_cost_share_allocation
    trigger: "on POST /tower-colo/modification-projects/{id}/allocate-cost-shares and on POST /tower-colo/modification-projects/{id}/reallocate-cost-shares"
    algorithm: waterfall_allocation
    formula: |
      # beneficiary set (explicit, no adjectives):
      B = [ one entry per SiteAmendment a where a.tower_id == project.tower_id
              AND a.execution_status == EXECUTED,
              with basis_load_units = a.reserved_load_units,
                   basis_created_at = a.created_at,
                   tenant_id        = MasterLeaseAgreement(a.master_lease_agreement_id).tenant_id,
                   site_amendment_id = a.id ]
        + [ one entry for the originating analysis's application `app` when
              app.status IN {SUBMITTED, UNDER_STRUCTURAL_REVIEW, CAPACITY_HOLD, MODIFICATION_REQUIRED, APPROVED},
              with basis_load_units = app.total_load_units,
                   basis_created_at = app.created_at,
                   tenant_id        = MasterLeaseAgreement(app.master_lease_agreement_id).tenant_id,
                   site_amendment_id = null ]
      total_basis = sum(b.basis_load_units for b in B)
      if project.allocation_basis == PRO_RATA_LOAD:
          share(b) = floor(total_cost_cents * b.basis_load_units / total_basis)
      else:  # EQUAL_SHARE
          share(b) = floor(total_cost_cents / len(B))
      remainder = total_cost_cents - sum(share(b) for b in B)
      # the ENTIRE remainder goes to one beneficiary, ordered by:
      #   basis_created_at ASC, then Tenant.created_at ASC, then basis_load_units ASC
      share(winner) += remainder
      # INVARIANT: sum(CostShare.share_cents where status IN {PENDING, ACCEPTED, BILLED})
      #            == ModificationProject.total_cost_cents  at all times between
      #            allocation and cancellation
    input_set: "EXECUTED amendments on the project's tower plus the originating application when it is still live; VOIDED and DECLINED shares from a previous allocation are excluded from allocated_cents"
    constants: {}
    precision: "integer cents; floor per beneficiary, single remainder assignment (never distribute the remainder across beneficiaries)"

  - name: retroactive_unauthorized_billing
    trigger: "on POST /tower-colo/equipment-audits/{id}/finalize, for every AuditFinding with status == OPEN"
    algorithm: chronological
    formula: |
      months_gross = 12 * (audit_date.year - installed_on_date.year) + (audit_date.month - installed_on_date.month)
      if audit_date.day < installed_on_date.day:
          months_gross -= 1          # a partial month is never billed
      months_gross = max(months_gross, 0)
      months_billable = months_gross                                  if audit.basis == INSTALL_DATE_BASIS
                        else min(months_gross, RETRO_CAP_MONTHS)      # DISCOVERY_LIMITED
      monthly_rate_cents = round_half_up(UNAUTHORIZED_RATE_CENTS_PER_LOAD_UNIT * observed_load_units)
      retroactive_billing_cents = round_half_up(months_billable * monthly_rate_cents * UNAUTHORIZED_PENALTY_MULTIPLIER)
      EquipmentAudit.retroactive_billing_total_cents = sum over the audit's findings (0 when there are none)
    input_set: "only AuditFinding rows with status == OPEN on the audit being finalized; findings already BILLED are never re-billed"
    constants:
      RETRO_CAP_MONTHS: 24
      UNAUTHORIZED_RATE_CENTS_PER_LOAD_UNIT: 25
      UNAUTHORIZED_PENALTY_MULTIPLIER: 1.5
    precision: "whole cents, round_half_up on monthly_rate_cents then on the penalty product"
    variants:
      - name: INSTALL_DATE_BASIS
        when: "audit.basis == INSTALL_DATE_BASIS"
        difference: "bills every whole month back to installed_on_date with no cap — an installation 41 months old bills 41 months"
      - name: DISCOVERY_LIMITED
        when: "audit.basis == DISCOVERY_LIMITED"
        difference: "caps months_billable at RETRO_CAP_MONTHS (24), so the same finding on the same tenant bills a strictly smaller amount whenever months_gross > 24"

  - name: tenant_credit_status
    trigger: "on every mutation of Tenant.outstanding_balance_cents (cost-share billing, cost-share reversal, audit finalization, tenant payment, SLA credit, restoration deposit charge and release)"
    algorithm: threshold
    formula: |
      credit_status = DELINQUENT if outstanding_balance_cents >= DELINQUENCY_THRESHOLD_CENTS else CURRENT
      # on a CURRENT->DELINQUENT flip: every MasterLeaseAgreement of the tenant with
      #   status == ACTIVE gets application_privilege := SUSPENDED
      # on a DELINQUENT->CURRENT flip: those master leases get application_privilege := ENABLED
    input_set: "the tenant's own outstanding_balance_cents only"
    constants:
      DELINQUENCY_THRESHOLD_CENTS: 5000000
    precision: "integer cents; the comparison is >= (a balance of exactly 5000000 is DELINQUENT, 4999999 is CURRENT)"

  - name: tower_capacity_reconciliation
    trigger: "on SiteAmendment execution (DRAFT/PENDING_SIGNATURE->EXECUTED), on decommissioning (TERMINATION_NOTICED->TERMINATED), on ModificationProject IN_CONSTRUCTION->CERTIFIED (capacity added), and on GroundLease status changes"
    algorithm: aggregation
    formula: |
      A = [ SiteAmendment a : a.tower_id == tower.id AND a.execution_status IN {EXECUTED, TERMINATION_NOTICED} ]
      # a TERMINATION_NOTICED amendment still physically occupies the structure, so it
      # keeps holding load and ground space until decommissioning completes (TERMINATED)
      reserved_load_units        = tower.baseline_reserved_load_units + sum(a.reserved_load_units for a in A)
      reserved_ground_space_sqft = tower.baseline_reserved_ground_sqft + sum(a.ground_space_sqft   for a in A)
      available_ground_space_sqft = ground_space_total_sqft - reserved_ground_space_sqft
      reserved_load_pct          = round_half_up(100 * reserved_load_units / rated_capacity_load_units, 3)
      occupied_elevation_bands   = [ {amendment_id, bottom_ft, top_ft, tenant_id} for a in A ] ordered by bottom_ft ASC, then created_at ASC
      # CONSERVED QUANTITY (compensating-action invariant):
      #   reserved_load_units is a pure function of the EXECUTED set, so
      #   execute(X) followed by complete-decommission(X) restores
      #   reserved_load_units and reserved_ground_space_sqft to their exact
      #   pre-execution values with zero drift.
    input_set: "SiteAmendment rows on this tower with execution_status IN {EXECUTED, TERMINATION_NOTICED}; rows in DRAFT, PENDING_SIGNATURE, VOIDED or TERMINATED contribute nothing"
    constants: {}
    precision: "load units to 3 decimals, round_half_up; percentages to 3 decimals, round_half_up"
    note: "Capacity is released only when an amendment reaches TERMINATED; giving termination notice does not free load, ground space or the elevation band."

  - name: tower_capacity_posture
    trigger: "recomputed at the end of every request that mutates a SiteAmendment execution_status, a GroundLease status, a ModificationProject status, or Tower.rated_capacity_load_units"
    algorithm: constraint_propagation
    formula: |
      if exists GroundLease g: g.tower_id == tower.id AND g.status == EXPIRED:              posture = FROZEN
      elif exists ModificationProject p: p.tower_id == tower.id
             AND p.status IN {FUNDED, IN_CONSTRUCTION}:                                     posture = FROZEN
      elif reserved_load_pct > RESTRICTED_LOAD_PCT OR available_ground_space_sqft <= 0:      posture = RESTRICTED
      else:                                                                                 posture = OPEN
    input_set: "GroundLease rows and ModificationProject rows on this tower plus the tower's own recomputed derived fields; BOUGHT_OUT and RENEWAL_NEGOTIATION leases never freeze the tower"
    constants:
      RESTRICTED_LOAD_PCT: 90.0
    precision: "reserved_load_pct compared with strict > (exactly 90.000 is not RESTRICTED); available_ground_space_sqft compared with <= (exactly 0 IS RESTRICTED)"
    note: "OPEN admits new applications into review; RESTRICTED and FROZEN both divert submissions to CAPACITY_HOLD; FROZEN additionally blocks amendment execution and application approval"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority — lowest number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of {PortfolioAdmin, StructuralEngineer, ComplianceAuditor, Tenant, Landlord}"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's §1.5 roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "request body / query parameters parse, required fields present, enum members valid, numeric ranges and field-level constraints from §1.1 satisfied"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 4
    category: business_constraint
    check: "pagination parameters within bounds (1 <= limit <= 100, offset >= 0)"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"
  - priority: 5
    category: existence
    check: "path-templated resources exist, validated left to right"
    error_id: "ERR_TOWER_NOT_FOUND | ERR_GROUND_LEASE_NOT_FOUND | ERR_TENANT_NOT_FOUND | ERR_MLA_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_EQUIPMENT_LINE_NOT_FOUND | ERR_ANALYSIS_NOT_FOUND | ERR_AMENDMENT_NOT_FOUND | ERR_PROJECT_NOT_FOUND | ERR_COST_SHARE_NOT_FOUND | ERR_AUDIT_NOT_FOUND | ERR_FINDING_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 6
    category: existence
    check: "foreign keys supplied in the request body reference existing rows, validated in the order the fields are listed in §1.5 input"
    error_id: "ERR_TOWER_NOT_FOUND | ERR_LANDLORD_NOT_FOUND | ERR_TENANT_NOT_FOUND | ERR_MLA_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_ANALYSIS_NOT_FOUND | ERR_AMENDMENT_NOT_FOUND | ERR_GROUND_LEASE_NOT_FOUND"
    http_status: 404
    applies_to: "all POST endpoints carrying FK fields"
  - priority: 7
    category: auth
    check: "for entity_backed roles, X-User-ID resolves to an existing row of the backing entity (Tenant for role Tenant, Landlord for role Landlord)"
    error_id: ERR_IDENTITY_NOT_FOUND
    http_status: 403
    applies_to: "all endpoints whose roles include Tenant or Landlord"
  - priority: 8
    category: auth
    check: "role Tenant may only act on resources whose owning tenant equals X-User-ID (MasterLeaseAgreement.tenant_id for applications, equipment lines, amendments; CostShare.tenant_id for cost shares); role Landlord may only read GroundLease rows whose landlord_id equals X-User-ID"
    error_id: "ERR_TENANT_SCOPE_VIOLATION | ERR_LANDLORD_SCOPE_VIOLATION"
    http_status: 403
    applies_to: "POST /tower-colo/colocation-applications, POST /tower-colo/colocation-applications/{id}/equipment-lines, DELETE /tower-colo/equipment-lines/{id}, POST /tower-colo/colocation-applications/{id}/submit, POST /tower-colo/colocation-applications/{id}/revise, POST /tower-colo/colocation-applications/{id}/withdraw, POST /tower-colo/site-amendments/{id}/termination-notice, POST /tower-colo/cost-shares/{id}/accept, POST /tower-colo/cost-shares/{id}/decline, POST /tower-colo/tenants/{id}/payments, GET /tower-colo/ground-leases"
  - priority: 9
    category: state
    check: "optimistic-concurrency check: expected_tower_version equals Tower.version / expected_modification_project_version equals ModificationProject.version"
    error_id: "ERR_STALE_TOWER_VERSION | ERR_STALE_PROJECT_VERSION"
    http_status: 412
    applies_to: "POST /tower-colo/structural-analyses, POST /tower-colo/modification-projects/{id}/reallocate-cost-shares"
  - priority: 10
    category: state
    check: "the target resource is in a state from which the requested transition is declared in §1.2"
    error_id: "ERR_INVALID_APPLICATION_STATE | ERR_INVALID_AMENDMENT_STATE | ERR_INVALID_BILLING_STATE | ERR_INVALID_PROJECT_STATE | ERR_INVALID_LEASE_STATE | ERR_INVALID_AUDIT_STATE | ERR_INVALID_COST_SHARE_STATE | ERR_INVALID_ANALYSIS_STATE"
    http_status: 409
    applies_to: "all state-changing endpoints"
  - priority: 11
    category: state
    check: "the application's MasterLeaseAgreement.status == ACTIVE"
    error_id: ERR_MLA_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /tower-colo/colocation-applications/{id}/submit, POST /tower-colo/colocation-applications/{id}/revise"
  - priority: 12
    category: state
    check: "the application's MasterLeaseAgreement.application_privilege == ENABLED"
    error_id: ERR_MLA_PRIVILEGE_SUSPENDED
    http_status: 409
    applies_to: "POST /tower-colo/colocation-applications/{id}/submit, POST /tower-colo/colocation-applications/{id}/revise"
  - priority: 13
    category: state
    check: "a GroundLease with tower_id == the amendment's tower_id exists with status == ACTIVE"
    error_id: ERR_GROUND_LEASE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /tower-colo/site-amendments/{id}/execute"
  - priority: 14
    category: business_safety
    check: "tower.capacity_posture != FROZEN"
    error_id: ERR_TOWER_POSTURE_FROZEN
    http_status: 409
    applies_to: "POST /tower-colo/site-amendments/{id}/execute, POST /tower-colo/colocation-applications/{id}/approve, POST /tower-colo/colocation-applications/{id}/revise, POST /tower-colo/structural-analyses"
  - priority: 15
    category: business_safety
    check: "for amendment execution: the post-execution loading percentage, computed as round_half_up(100 * (tower.reserved_load_units - superseded_load + amendment.reserved_load_units) / tower.rated_capacity_load_units, 3), is strictly below STRUCTURAL_CAPACITY_LIMIT_PCT"
    error_id: ERR_STRUCTURAL_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /tower-colo/site-amendments/{id}/execute"
  - priority: 16
    category: business_safety
    check: "for amendment execution: the amendment's application has a non-SUPERSEDED StructuralAnalysis with result == PASS, or a CERTIFIED ModificationProject whose originating_analysis_id is that application's newest non-SUPERSEDED analysis"
    error_id: ERR_STRUCTURAL_CLEARANCE_MISSING
    http_status: 422
    applies_to: "POST /tower-colo/site-amendments/{id}/execute"
  - priority: 17
    category: business_safety
    check: "segregation of duties: the acting X-User-ID differs from ModificationProject.proposing_engineer_user_id and from the originating StructuralAnalysis.engineer_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /tower-colo/modification-projects/{id}/certify-completion"
  - priority: 18
    category: business_constraint
    check: "elevation-band conflict: for every other SiteAmendment b on the same tower with execution_status IN {EXECUTED, TERMINATION_NOTICED} and b.id != amendment.supersedes_amendment_id, the half-open bands must clear the buffer, i.e. (amendment.elevation_top_ft + ELEVATION_SEPARATION_BUFFER_FT <= b.elevation_bottom_ft) OR (b.elevation_top_ft + ELEVATION_SEPARATION_BUFFER_FT <= amendment.elevation_bottom_ft)"
    error_id: ERR_ELEVATION_BAND_CONFLICT
    http_status: 409
    applies_to: "POST /tower-colo/site-amendments/{id}/execute"
  - priority: 19
    category: business_constraint
    check: "the requested band satisfies tower.min_colocation_elevation_ft <= requested_elevation_bottom_ft AND requested_elevation_top_ft <= tower.max_elevation_ft"
    error_id: ERR_ELEVATION_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /tower-colo/colocation-applications/{id}/submit"
  - priority: 20
    category: business_constraint
    check: "the application has at least one EquipmentLine"
    error_id: ERR_NO_EQUIPMENT_LINES
    http_status: 422
    applies_to: "POST /tower-colo/colocation-applications/{id}/submit, POST /tower-colo/colocation-applications/{id}/revise"
  - priority: 21
    category: business_constraint
    check: "ground space: tower.available_ground_space_sqft plus the superseded amendment's ground_space_sqft (0 when supersedes_amendment_id is null) is >= amendment.ground_space_sqft"
    error_id: ERR_GROUND_SPACE_UNAVAILABLE
    http_status: 422
    applies_to: "POST /tower-colo/site-amendments/{id}/execute"
  - priority: 22
    category: business_constraint
    check: "construction-window conflict: no other ModificationProject on the same tower with status IN {PROPOSED, COST_ALLOCATED, FUNDED, IN_CONSTRUCTION} has a closed date interval [construction_window_start_date, construction_window_end_date] intersecting this project's window on any calendar day"
    error_id: ERR_CONSTRUCTION_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /tower-colo/modification-projects, POST /tower-colo/modification-projects/{id}/allocate-cost-shares"
  - priority: 23
    category: business_temporal
    check: "amendment.term_end_date <= the tower's ACTIVE GroundLease.term_end_date"
    error_id: ERR_TERM_EXCEEDS_GROUND_LEASE
    http_status: 422
    applies_to: "POST /tower-colo/site-amendments/{id}/execute"
  - priority: 24
    category: business_temporal
    check: "renewal window: logical clock date >= term_end_date - RENEWAL_WINDOW_DAYS (365)"
    error_id: ERR_RENEWAL_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /tower-colo/ground-leases/{id}/open-renewal"
  - priority: 25
    category: business_temporal
    check: "renewals_exercised < renewal_option_count"
    error_id: ERR_NO_RENEWAL_OPTIONS_REMAINING
    http_status: 422
    applies_to: "POST /tower-colo/ground-leases/{id}/open-renewal, POST /tower-colo/ground-leases/{id}/renew"
  - priority: 26
    category: business_temporal
    check: "landlord payment period does not re-cover paid ground: when paid_through_date is not null, period_start_date must be strictly after paid_through_date"
    error_id: ERR_PAYMENT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /tower-colo/landlord-payments"
  - priority: 27
    category: business_temporal
    check: "landlord payment period is contiguous: when paid_through_date is not null, period_start_date must equal paid_through_date + 1 day (no skipped month)"
    error_id: ERR_PAYMENT_PERIOD_GAP
    http_status: 422
    applies_to: "POST /tower-colo/landlord-payments"
  - priority: 28
    category: business_temporal
    check: "landlord payment period covers whole calendar months: period_start_date is the first day of a month and period_end_date is the last day of a month"
    error_id: ERR_PAYMENT_PERIOD_NOT_WHOLE_MONTHS
    http_status: 422
    applies_to: "POST /tower-colo/landlord-payments"
  - priority: 29
    category: business_temporal
    check: "audit_date <= the logical clock instant"
    error_id: ERR_AUDIT_DATE_IN_FUTURE
    http_status: 422
    applies_to: "POST /tower-colo/equipment-audits"
  - priority: 30
    category: business_temporal
    check: "finding installed_on_date <= the parent audit's audit_date"
    error_id: ERR_FINDING_DATE_AFTER_AUDIT
    http_status: 422
    applies_to: "POST /tower-colo/equipment-audits/{id}/findings"
  - priority: 31
    category: business_referential
    check: "supersedes_amendment_id, when supplied, references a SiteAmendment with execution_status == EXECUTED, the same tower_id, and the same master_lease_agreement_id as the new amendment"
    error_id: ERR_SUPERSEDE_TARGET_INVALID
    http_status: 422
    applies_to: "POST /tower-colo/site-amendments"
  - priority: 32
    category: business_referential
    check: "the beneficiary set resolved by calculations.modification_cost_share_allocation is non-empty and total_basis > 0"
    error_id: ERR_COST_SHARE_BENEFICIARY_INVALID
    http_status: 422
    applies_to: "POST /tower-colo/modification-projects/{id}/allocate-cost-shares, POST /tower-colo/modification-projects/{id}/reallocate-cost-shares"
  - priority: 33
    category: business_referential
    check: "the lease's Landlord has w9_on_file == true"
    error_id: ERR_LANDLORD_W9_MISSING
    http_status: 422
    applies_to: "POST /tower-colo/landlord-payments"
  - priority: 34
    category: business_fiscal
    check: "the acting/owning Tenant.credit_status == CURRENT"
    error_id: ERR_TENANT_DELINQUENT
    http_status: 402
    applies_to: "POST /tower-colo/colocation-applications/{id}/submit, POST /tower-colo/colocation-applications/{id}/approve, POST /tower-colo/site-amendments/{id}/execute"
  - priority: 35
    category: business_fiscal
    check: "buyout is available: buyout_price_cents > 0"
    error_id: ERR_BUYOUT_NOT_AVAILABLE
    http_status: 422
    applies_to: "POST /tower-colo/ground-leases/{id}/buyout"
  - priority: 36
    category: business_fiscal
    check: "tenant payment amount_cents > 0"
    error_id: ERR_INVALID_PAYMENT_AMOUNT
    http_status: 422
    applies_to: "POST /tower-colo/tenants/{id}/payments"
  - priority: 37
    category: business_fiscal
    check: "the originating StructuralAnalysis has status == QUOTED and modification_construction_cost_cents > 0"
    error_id: ERR_QUOTATION_MISSING
    http_status: 422
    applies_to: "POST /tower-colo/modification-projects, POST /tower-colo/modification-projects/{id}/allocate-cost-shares"
  - priority: 38
    category: business_temporal
    check: "the requested logical clock instant is strictly after the current logical clock instant"
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422
    applies_to: "POST /tower-colo/_clock/set_current_utc"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Tower inventory -------------------------------------------------------
  - method: POST
    path: "/tower-colo/towers"
    description: "Register a tower asset with its structural capacity, usable elevation range and compound ground space."
    roles: [PortfolioAdmin]
    code: 201
    input: [site_name, structure_type, rated_capacity_load_units, min_colocation_elevation_ft, max_elevation_ft, ground_space_total_sqft, "baseline_reserved_load_units?", "baseline_reserved_ground_sqft?"]
    output: Tower
    side_effects:
      - "reserved_load_units / reserved_ground_space_sqft seeded from the baseline inputs"
      - "reserved_load_pct, available_ground_space_sqft, occupied_elevation_bands (empty), open_review_count (0) computed"
      - "capacity_posture computed via calculations.tower_capacity_posture"
      - "version initialised to 1"
  - method: GET
    path: "/tower-colo/towers"
    description: "List towers with pagination and posture/structure filters."
    roles: [PortfolioAdmin, StructuralEngineer, ComplianceAuditor, Tenant, Landlord]
    code: 200
    input: ["capacity_posture?", "structure_type?", "limit?", "offset?"]
    output: Tower[]
    side_effects: []
  - method: GET
    path: "/tower-colo/towers/{id}"
    description: "Read one tower including all derived capacity fields and its current version (OCC input source)."
    roles: [PortfolioAdmin, StructuralEngineer, ComplianceAuditor, Tenant, Landlord]
    code: 200
    input: []
    output: Tower
    side_effects: []
  - method: GET
    path: "/tower-colo/towers/{id}/capacity-summary"
    description: "Computed read: current structural and ground-space occupancy of the tower, the occupied elevation bands and the posture gate."
    roles: [PortfolioAdmin, StructuralEngineer, ComplianceAuditor, Tenant]
    code: 200
    input: []
    output: "{ tower_id: string, rated_capacity_load_units: number, reserved_load_units: number, reserved_load_pct: number, available_ground_space_sqft: number, capacity_posture: string, open_review_count: integer, occupied_band_count: integer, capacity_hold_application_count: integer }"
    side_effects: []

  # --- Ground leases and landlord payments -----------------------------------
  - method: POST
    path: "/tower-colo/landlords"
    description: "Register a ground landlord (payee) with tax-documentation state."
    roles: [PortfolioAdmin]
    code: 201
    input: [legal_name, remit_contact_email, "w9_on_file?"]
    output: Landlord
    side_effects: []
  - method: POST
    path: "/tower-colo/ground-leases"
    description: "Create the ground lease under a tower, with simple annual escalation, renewal options and a buyout price."
    roles: [PortfolioAdmin]
    code: 201
    input: [tower_id, landlord_id, base_monthly_rent_cents, escalator_pct, commencement_date, term_end_date, renewal_option_count, renewal_term_years, buyout_price_cents]
    output: GroundLease
    side_effects:
      - "status := ACTIVE, renewals_exercised := 0, paid_through_date := null"
      - "current_monthly_rent_cents computed via calculations.ground_lease_current_rent"
      - "tower.capacity_posture recomputed and tower.version incremented by 1"
  - method: GET
    path: "/tower-colo/ground-leases"
    description: "List ground leases filtered by tower, landlord or status. Role Landlord sees only leases whose landlord_id equals X-User-ID."
    roles: [PortfolioAdmin, StructuralEngineer, Landlord]
    code: 200
    input: ["tower_id?", "landlord_id?", "status?", "limit?", "offset?"]
    output: GroundLease[]
    side_effects: []
  - method: GET
    path: "/tower-colo/ground-leases/{id}"
    description: "Read one ground lease including the escalated current monthly rent and paid_through_date."
    roles: [PortfolioAdmin, StructuralEngineer, Landlord]
    code: 200
    input: []
    output: GroundLease
    side_effects: []
  - method: POST
    path: "/tower-colo/ground-leases/{id}/open-renewal"
    description: "Open renewal negotiation on a ground lease inside the renewal window."
    roles: [PortfolioAdmin]
    code: 200
    input: []
    output: GroundLease
    side_effects:
      - "status ACTIVE->RENEWAL_NEGOTIATION"
  - method: POST
    path: "/tower-colo/ground-leases/{id}/renew"
    description: "Exercise one renewal option: extend the term, reset the escalation baseline and return the lease to ACTIVE."
    roles: [PortfolioAdmin]
    code: 200
    input: []
    output: GroundLease
    side_effects:
      - "base_monthly_rent_cents := current rent at the old term_end_date, commencement_date := old term_end_date + 1 day, term_end_date extended by renewal_term_years"
      - "renewals_exercised incremented by 1, status RENEWAL_NEGOTIATION->ACTIVE"
      - "current_monthly_rent_cents recomputed, tower.capacity_posture recomputed, tower.version incremented by 1"
  - method: POST
    path: "/tower-colo/ground-leases/{id}/buyout"
    description: "Buy out the landlord's interest at the negotiated price."
    roles: [PortfolioAdmin]
    code: 200
    input: []
    output: GroundLease
    side_effects:
      - "status -> BOUGHT_OUT, buyout_paid_cents := buyout_price_cents, paid_through_date := term_end_date"
      - "tower.capacity_posture recomputed and tower.version incremented by 1"
  - method: POST
    path: "/tower-colo/landlord-payments"
    description: "Record a landlord rent payment covering whole calendar months, contiguous with paid_through_date."
    roles: [PortfolioAdmin]
    code: 201
    input: [ground_lease_id, period_start_date, period_end_date]
    output: LandlordPayment
    side_effects:
      - "months_covered and amount_cents computed via calculations.landlord_payment_amount"
      - "GroundLease.paid_through_date := period_end_date"
  - method: GET
    path: "/tower-colo/ground-leases/{id}/landlord-payments"
    description: "List the payments recorded against one ground lease, ordered by period_start_date ASC."
    roles: [PortfolioAdmin, Landlord]
    code: 200
    input: ["limit?", "offset?"]
    output: LandlordPayment[]
    side_effects: []

  # --- Tenants and master lease agreements -----------------------------------
  - method: POST
    path: "/tower-colo/tenants"
    description: "Register a carrier tenant."
    roles: [PortfolioAdmin]
    code: 201
    input: [legal_name, carrier_code]
    output: Tenant
    side_effects:
      - "outstanding_balance_cents := 0, credit_status := CURRENT"
  - method: GET
    path: "/tower-colo/tenants/{id}"
    description: "Read one tenant including the receivable balance and credit status."
    roles: [PortfolioAdmin, StructuralEngineer, ComplianceAuditor, Tenant]
    code: 200
    input: []
    output: Tenant
    side_effects: []
  - method: POST
    path: "/tower-colo/tenants/{id}/payments"
    description: "Apply a cash payment against the tenant's receivable balance."
    roles: [PortfolioAdmin, Tenant]
    code: 200
    input: [amount_cents]
    output: Tenant
    side_effects:
      - "outstanding_balance_cents decreased by amount_cents"
      - "credit_status recomputed via calculations.tenant_credit_status"
      - "on a DELINQUENT->CURRENT flip: application_privilege := ENABLED on the tenant's ACTIVE master leases and their ON_HOLD applications move ON_HOLD->SUBMITTED"
  - method: POST
    path: "/tower-colo/master-lease-agreements"
    description: "Create a master lease agreement for a tenant, including the compound rent escalator and the expedited-review commitment."
    roles: [PortfolioAdmin]
    code: 201
    input: [tenant_id, base_monthly_rent_cents, escalator_pct, initial_term_years, renewal_terms_count, expires_on, "expedited_review_days?"]
    output: MasterLeaseAgreement
    side_effects:
      - "status := DRAFT, application_privilege := ENABLED, executed_amendment_count := 0"
  - method: POST
    path: "/tower-colo/master-lease-agreements/{id}/activate"
    description: "Activate a drafted master lease agreement so applications may be filed under it."
    roles: [PortfolioAdmin]
    code: 200
    input: []
    output: MasterLeaseAgreement
    side_effects:
      - "status DRAFT->ACTIVE"
      - "application_privilege recomputed from the tenant's credit_status"
  - method: POST
    path: "/tower-colo/master-lease-agreements/{id}/reinstate"
    description: "Lift an arrears suspension on a master lease once the tenant is no longer delinquent."
    roles: [PortfolioAdmin]
    code: 200
    input: []
    output: MasterLeaseAgreement
    side_effects:
      - "application_privilege := ENABLED (requires Tenant.credit_status == CURRENT and status == ACTIVE)"
      - "every application under this master lease with status == ON_HOLD moves ON_HOLD->SUBMITTED"
  - method: GET
    path: "/tower-colo/tenants/{id}/master-lease-agreements"
    description: "List the master lease agreements of one tenant."
    roles: [PortfolioAdmin, Tenant]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: MasterLeaseAgreement[]
    side_effects: []

  # --- Colocation applications and equipment ---------------------------------
  - method: POST
    path: "/tower-colo/colocation-applications"
    description: "Open a draft colocation application for a requested elevation band and ground-space footprint."
    roles: [Tenant]
    code: 201
    input: [tower_id, master_lease_agreement_id, requested_elevation_bottom_ft, requested_elevation_top_ft, requested_ground_space_sqft, "expedited_requested?"]
    output: ColocationApplication
    side_effects:
      - "status := DRAFT, total_load_units := 0, revision_count := 0, sla_breached := false"
  - method: GET
    path: "/tower-colo/colocation-applications"
    description: "List colocation applications filtered by tower, master lease or status."
    roles: [PortfolioAdmin, StructuralEngineer, ComplianceAuditor, Tenant]
    code: 200
    input: ["tower_id?", "master_lease_agreement_id?", "status?", "limit?", "offset?"]
    output: ColocationApplication[]
    side_effects: []
  - method: GET
    path: "/tower-colo/colocation-applications/{id}"
    description: "Read one colocation application including total_load_units, review_deadline_at and sla_breached."
    roles: [PortfolioAdmin, StructuralEngineer, ComplianceAuditor, Tenant]
    code: 200
    input: []
    output: ColocationApplication
    side_effects: []
  - method: POST
    path: "/tower-colo/colocation-applications/{id}/equipment-lines"
    description: "Add an equipment line (antenna, RRU, TMA or dish) with weight, wind area and mount elevation to an application."
    roles: [Tenant]
    code: 201
    input: [equipment_type, model_code, quantity, unit_weight_lbs, wind_area_sqft, mount_elevation_ft]
    output: EquipmentLine
    side_effects:
      - "load_units computed via calculations.equipment_line_load_units"
      - "ColocationApplication.total_load_units recomputed as the sum of its rounded lines"
  - method: GET
    path: "/tower-colo/equipment-lines"
    description: "List equipment lines by application or by the amendment they were installed under."
    roles: [PortfolioAdmin, StructuralEngineer, ComplianceAuditor, Tenant]
    code: 200
    input: ["colocation_application_id?", "installed_amendment_id?", "limit?", "offset?"]
    output: EquipmentLine[]
    side_effects: []
  - method: GET
    path: "/tower-colo/equipment-lines/{id}"
    description: "Read one equipment line including its computed load_units."
    roles: [PortfolioAdmin, StructuralEngineer, ComplianceAuditor, Tenant]
    code: 200
    input: []
    output: EquipmentLine
    side_effects: []
  - method: DELETE
    path: "/tower-colo/equipment-lines/{id}"
    description: "Remove an equipment line while the application is still editable (DRAFT or MODIFICATION_REQUIRED)."
    roles: [Tenant]
    code: 204
    input: []
    output: null
    side_effects:
      - "ColocationApplication.total_load_units recomputed from the surviving lines"
  - method: POST
    path: "/tower-colo/colocation-applications/{id}/submit"
    description: "Submit the application; the system immediately branches it into UNDER_STRUCTURAL_REVIEW or CAPACITY_HOLD based on the tower posture."
    roles: [Tenant]
    code: 200
    input: []
    output: ColocationApplication
    side_effects:
      - "submitted_at := logical clock, total_load_units recomputed, review_deadline_at computed via calculations.review_deadline"
      - "system branch SUBMITTED->UNDER_STRUCTURAL_REVIEW (posture OPEN, tower.open_review_count incremented) or SUBMITTED->CAPACITY_HOLD (posture RESTRICTED or FROZEN)"
  - method: POST
    path: "/tower-colo/colocation-applications/{id}/revise"
    description: "Re-submit a modification-required application after changing its equipment lines, re-entering structural review."
    roles: [Tenant]
    code: 200
    input: ["revision_note?"]
    output: ColocationApplication
    side_effects:
      - "status MODIFICATION_REQUIRED->UNDER_STRUCTURAL_REVIEW, revision_count incremented by 1"
      - "total_load_units recomputed, submitted_at and review_deadline_at re-stamped"
      - "every StructuralAnalysis of this application with status IN {ISSUED, QUOTED} set to SUPERSEDED"
      - "tower.open_review_count incremented by 1"
  - method: POST
    path: "/tower-colo/colocation-applications/{id}/approve"
    description: "Approve an application that cleared structural review, or whose required reinforcement has been certified."
    roles: [PortfolioAdmin]
    code: 200
    input: []
    output: ColocationApplication
    side_effects:
      - "status -> APPROVED; tower.open_review_count decremented when leaving UNDER_STRUCTURAL_REVIEW"
  - method: POST
    path: "/tower-colo/colocation-applications/{id}/reject"
    description: "Reject an application under review or in modification-required."
    roles: [PortfolioAdmin]
    code: 200
    input: [rejection_reason]
    output: ColocationApplication
    side_effects:
      - "status -> REJECTED; tower.open_review_count decremented when leaving UNDER_STRUCTURAL_REVIEW"
  - method: POST
    path: "/tower-colo/colocation-applications/{id}/withdraw"
    description: "Tenant withdraws its own application from any non-terminal state."
    roles: [Tenant]
    code: 200
    input: []
    output: ColocationApplication
    side_effects:
      - "status -> WITHDRAWN; open_review_count decremented and analyses SUPERSEDED when leaving review"

  # --- Structural analysis and quotation -------------------------------------
  - method: POST
    path: "/tower-colo/structural-analyses"
    description: "Run a structural analysis (PRELIMINARY desktop screen or DETAILED sealed analysis) against the tower's current picture. Guarded by OCC on the tower version."
    roles: [StructuralEngineer]
    code: 201
    input: [colocation_application_id, variant, expected_tower_version]
    output: StructuralAnalysis
    side_effects:
      - "included_load_units, projected_loading_pct and result computed via calculations.structural_loading_analysis"
      - "every earlier StructuralAnalysis of the same application with status IN {ISSUED, QUOTED} set to SUPERSEDED"
      - "engineer_user_id := acting X-User-ID, issued_at := logical clock"
      - "application branches UNDER_STRUCTURAL_REVIEW->MODIFICATION_REQUIRED (result MODIFICATION_REQUIRED) or UNDER_STRUCTURAL_REVIEW->REJECTED (result CAPACITY_EXCEEDED); a PASS leaves the application in UNDER_STRUCTURAL_REVIEW"
      - "sla_breached and the SLA rent credit evaluated via calculations.review_deadline"
      - "tower.version incremented by 1"
  - method: POST
    path: "/tower-colo/structural-analyses/{id}/quotation"
    description: "Issue the structural-modification cost quotation on an analysis that requires modification."
    roles: [StructuralEngineer]
    code: 200
    input: [modification_construction_cost_cents]
    output: StructuralAnalysis
    side_effects:
      - "status ISSUED->QUOTED, modification_construction_cost_cents stored, quoted_at := logical clock"
  - method: GET
    path: "/tower-colo/colocation-applications/{id}/structural-analyses"
    description: "List the analyses of one application, newest first (created_at DESC)."
    roles: [PortfolioAdmin, StructuralEngineer, Tenant]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: StructuralAnalysis[]
    side_effects: []

  # --- Site amendments -------------------------------------------------------
  - method: POST
    path: "/tower-colo/site-amendments"
    description: "Paper a site-level amendment under the master lease for an approved application; an equipment-swap amendment may supersede an executed amendment of the same tenant on the same tower."
    roles: [PortfolioAdmin]
    code: 201
    input: [master_lease_agreement_id, tower_id, colocation_application_id, effective_date, term_end_date, "base_monthly_rent_cents?", "escalator_pct?", "restoration_deposit_cents?", "supersedes_amendment_id?"]
    output: SiteAmendment
    side_effects:
      - "execution_status := DRAFT, billing_status := NOT_BILLING, restoration_status := NOT_REQUIRED"
      - "elevation_bottom_ft, elevation_top_ft, ground_space_sqft and reserved_load_units copied from the application"
      - "base_monthly_rent_cents and escalator_pct default to the master lease values when omitted"
      - "the application moves APPROVED->AMENDMENT_ISSUED"
  - method: GET
    path: "/tower-colo/site-amendments"
    description: "List site amendments filtered by master lease, tower, application, supersede target or either status axis."
    roles: [PortfolioAdmin, StructuralEngineer, ComplianceAuditor, Tenant]
    code: 200
    input: ["master_lease_agreement_id?", "tower_id?", "colocation_application_id?", "supersedes_amendment_id?", "execution_status?", "billing_status?", "limit?", "offset?"]
    output: SiteAmendment[]
    side_effects: []
  - method: GET
    path: "/tower-colo/site-amendments/{id}"
    description: "Read one site amendment including both status axes and the escalated current rent."
    roles: [PortfolioAdmin, StructuralEngineer, ComplianceAuditor, Tenant]
    code: 200
    input: []
    output: SiteAmendment
    side_effects: []
  - method: POST
    path: "/tower-colo/site-amendments/{id}/execute"
    description: "Execute the amendment. With signature_received false the amendment parks in PENDING_SIGNATURE; with true it claims capacity, the elevation band and ground space, and starts billing."
    roles: [PortfolioAdmin]
    code: 200
    input: [signature_received]
    output: SiteAmendment
    side_effects:
      - "execution_status -> PENDING_SIGNATURE or EXECUTED"
      - "on EXECUTED: billing_status NOT_BILLING->BILLING, restoration_status := PENDING when restoration_deposit_cents > 0, Tenant.outstanding_balance_cents increased by restoration_deposit_cents, credit_status recomputed"
      - "on EXECUTED: EquipmentLine.installed_amendment_id set for the application's lines"
      - "on EXECUTED with supersedes_amendment_id: the superseded amendment moves EXECUTED->TERMINATED with billing_status CLOSED and restoration_status COMPLETE"
      - "on EXECUTED: tower capacity fields recomputed via calculations.tower_capacity_reconciliation, capacity_posture recomputed, tower.version incremented by 1"
      - "MasterLeaseAgreement.executed_amendment_count recomputed"
  - method: POST
    path: "/tower-colo/site-amendments/{id}/void"
    description: "Void an amendment that has not been executed."
    roles: [PortfolioAdmin]
    code: 200
    input: []
    output: SiteAmendment
    side_effects:
      - "execution_status -> VOIDED, billing_status -> CLOSED"
  - method: POST
    path: "/tower-colo/site-amendments/{id}/billing-status"
    description: "Move the amendment's independent billing axis (suspend, resume or close billing) without touching occupancy."
    roles: [PortfolioAdmin]
    code: 200
    input: [to_status]
    output: SiteAmendment
    side_effects:
      - "billing_status transition per §1.2 billing axis"
      - "on BILLING: current_monthly_rent_cents recomputed via calculations.amendment_rent_escalation"
  - method: POST
    path: "/tower-colo/site-amendments/{id}/termination-notice"
    description: "Tenant gives notice of departure; capacity stays reserved and the restoration obligation opens."
    roles: [Tenant]
    code: 200
    input: []
    output: SiteAmendment
    side_effects:
      - "execution_status EXECUTED->TERMINATION_NOTICED, notice_given_at := logical clock, restoration_status := PENDING"
  - method: POST
    path: "/tower-colo/site-amendments/{id}/complete-decommission"
    description: "Close out decommissioning: confirm site restoration, release the deposit, free the tower capacity and promote any held application."
    roles: [PortfolioAdmin]
    code: 200
    input: [restoration_confirmed]
    output: SiteAmendment
    side_effects:
      - "execution_status TERMINATION_NOTICED->TERMINATED, restoration_status := COMPLETE, billing_status := CLOSED, terminated_at := logical clock"
      - "Tenant.outstanding_balance_cents decreased by restoration_deposit_cents; credit_status recomputed; a DELINQUENT->CURRENT flip re-enables the tenant's master leases and moves their ON_HOLD applications to SUBMITTED"
      - "tower capacity fields and capacity_posture recomputed; a posture that becomes OPEN promotes the single CAPACITY_HOLD winner into UNDER_STRUCTURAL_REVIEW and supersedes that application's stale analyses"
      - "tower.version incremented by 1"

  # --- Structural modification projects and cost sharing ---------------------
  - method: POST
    path: "/tower-colo/modification-projects"
    description: "Propose a structural modification project against a quoted analysis, reserving a construction window on the tower."
    roles: [StructuralEngineer]
    code: 201
    input: [tower_id, originating_analysis_id, construction_window_start_date, construction_window_end_date, "allocation_basis?"]
    output: ModificationProject
    side_effects:
      - "status := PROPOSED, proposing_engineer_user_id := acting X-User-ID, allocated_cents := 0"
      - "base_construction_cost_cents copied from the originating analysis"
  - method: GET
    path: "/tower-colo/modification-projects"
    description: "List modification projects by tower, originating analysis or status."
    roles: [PortfolioAdmin, StructuralEngineer, Tenant]
    code: 200
    input: ["tower_id?", "originating_analysis_id?", "status?", "limit?", "offset?"]
    output: ModificationProject[]
    side_effects: []
  - method: GET
    path: "/tower-colo/modification-projects/{id}"
    description: "Read one modification project including the pinned cost pipeline outputs and its version (OCC input source)."
    roles: [PortfolioAdmin, StructuralEngineer, Tenant]
    code: 200
    input: []
    output: ModificationProject
    side_effects: []
  - method: POST
    path: "/tower-colo/modification-projects/{id}/allocate-cost-shares"
    description: "Compute the project's total cost and split it among the beneficiary tenants, minting one PENDING CostShare each."
    roles: [StructuralEngineer]
    code: 200
    input: []
    output: ModificationProject
    side_effects:
      - "volume_discount_pct, engineering_fee_cents and total_cost_cents computed via calculations.modification_project_total_cost"
      - "one PENDING CostShare per beneficiary via calculations.modification_cost_share_allocation; allocated_cents := total_cost_cents"
      - "status PROPOSED->COST_ALLOCATED"
  - method: POST
    path: "/tower-colo/modification-projects/{id}/reallocate-cost-shares"
    description: "Supersede the current allocation with a fresh one under a different basis. Guarded by OCC on the project version."
    roles: [StructuralEngineer]
    code: 200
    input: [expected_modification_project_version, allocation_basis]
    output: ModificationProject
    side_effects:
      - "every CostShare with status IN {PENDING, ACCEPTED} set to VOIDED"
      - "allocation_basis updated and a fresh PENDING CostShare set minted; allocated_cents := total_cost_cents"
      - "version incremented by 1"
  - method: POST
    path: "/tower-colo/modification-projects/{id}/start-construction"
    description: "Start construction once the window has opened on the logical clock."
    roles: [StructuralEngineer]
    code: 200
    input: []
    output: ModificationProject
    side_effects:
      - "status FUNDED->IN_CONSTRUCTION; tower.capacity_posture stays FROZEN"
  - method: POST
    path: "/tower-colo/modification-projects/{id}/certify-completion"
    description: "Certify the reinforcement (segregated from the proposing and analysing engineers), adding structural capacity and lifting the freeze."
    roles: [StructuralEngineer]
    code: 200
    input: [added_capacity_load_units]
    output: ModificationProject
    side_effects:
      - "status IN_CONSTRUCTION->CERTIFIED, certified_by_user_id := acting X-User-ID"
      - "tower.rated_capacity_load_units increased by added_capacity_load_units; reserved_load_pct and capacity_posture recomputed"
      - "a posture that becomes OPEN promotes the single CAPACITY_HOLD winner into UNDER_STRUCTURAL_REVIEW"
      - "tower.version incremented by 1"
  - method: POST
    path: "/tower-colo/modification-projects/{id}/cancel"
    description: "Cancel the project, reversing any billed cost shares exactly and lifting the tower freeze."
    roles: [PortfolioAdmin]
    code: 200
    input: [cancellation_reason]
    output: ModificationProject
    side_effects:
      - "every CostShare with status IN {PENDING, ACCEPTED} set to VOIDED; every BILLED share set to VOIDED with Tenant.outstanding_balance_cents decreased by share_cents"
      - "each affected Tenant.credit_status recomputed; a DELINQUENT->CURRENT flip re-enables master leases and un-holds their applications"
      - "allocated_cents := 0, status -> CANCELLED"
      - "tower.capacity_posture recomputed; a posture that becomes OPEN promotes the single CAPACITY_HOLD winner"
      - "tower.version incremented by 1"
  - method: GET
    path: "/tower-colo/cost-shares"
    description: "List cost shares by project, tenant, amendment or status."
    roles: [PortfolioAdmin, StructuralEngineer, Tenant]
    code: 200
    input: ["modification_project_id?", "tenant_id?", "site_amendment_id?", "status?", "limit?", "offset?"]
    output: CostShare[]
    side_effects: []
  - method: GET
    path: "/tower-colo/cost-shares/{id}"
    description: "Read one cost share including its allocation basis and amount."
    roles: [PortfolioAdmin, StructuralEngineer, Tenant]
    code: 200
    input: []
    output: CostShare
    side_effects: []
  - method: POST
    path: "/tower-colo/cost-shares/{id}/accept"
    description: "Tenant accepts its share of the modification cost; the last acceptance funds the project."
    roles: [Tenant]
    code: 200
    input: []
    output: CostShare
    side_effects:
      - "status PENDING->ACCEPTED, accepted_at := logical clock"
      - "when no non-VOIDED sibling remains PENDING: project COST_ALLOCATED->FUNDED, all ACCEPTED shares -> BILLED, tenant balances increased, tower frozen, reviewing applications pushed to CAPACITY_HOLD, tower.version incremented by 1"
  - method: POST
    path: "/tower-colo/cost-shares/{id}/decline"
    description: "Tenant declines its share, stalling the project."
    roles: [Tenant]
    code: 200
    input: [decline_reason]
    output: CostShare
    side_effects:
      - "status PENDING->DECLINED; project COST_ALLOCATED->STALLED; sibling PENDING shares set to VOIDED; ACCEPTED shares left unbilled"

  # --- Tenant equipment audits ----------------------------------------------
  - method: POST
    path: "/tower-colo/equipment-audits"
    description: "Schedule a tenant equipment audit on a tower with the retroactive-billing basis fixed up front."
    roles: [ComplianceAuditor]
    code: 201
    input: [tower_id, audit_date, basis]
    output: EquipmentAudit
    side_effects:
      - "status := SCHEDULED, auditor_user_id := acting X-User-ID, finding_count := 0, retroactive_billing_total_cents := 0"
  - method: GET
    path: "/tower-colo/towers/{id}/equipment-audits"
    description: "List the audits recorded against one tower."
    roles: [PortfolioAdmin, ComplianceAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: EquipmentAudit[]
    side_effects: []
  - method: POST
    path: "/tower-colo/equipment-audits/{id}/start"
    description: "Start the audit walk-down."
    roles: [ComplianceAuditor]
    code: 200
    input: []
    output: EquipmentAudit
    side_effects:
      - "status SCHEDULED->IN_PROGRESS"
  - method: POST
    path: "/tower-colo/equipment-audits/{id}/findings"
    description: "Record an unauthorized installation found on the structure."
    roles: [ComplianceAuditor]
    code: 201
    input: [tenant_id, description, observed_load_units, installed_on_date, mount_elevation_ft, "site_amendment_id?"]
    output: AuditFinding
    side_effects:
      - "status := OPEN, months_billable := 0, retroactive_billing_cents := 0"
      - "EquipmentAudit.finding_count incremented by 1"
  - method: GET
    path: "/tower-colo/audit-findings"
    description: "List audit findings by audit, tenant, amendment or status."
    roles: [PortfolioAdmin, ComplianceAuditor, Tenant]
    code: 200
    input: ["equipment_audit_id?", "tenant_id?", "site_amendment_id?", "status?", "limit?", "offset?"]
    output: AuditFinding[]
    side_effects: []
  - method: GET
    path: "/tower-colo/audit-findings/{id}"
    description: "Read one audit finding including its retroactive billing outcome."
    roles: [PortfolioAdmin, ComplianceAuditor, Tenant]
    code: 200
    input: []
    output: AuditFinding
    side_effects: []
  - method: POST
    path: "/tower-colo/equipment-audits/{id}/finalize"
    description: "Finalize the audit: bill every open finding retroactively under the audit's basis and cascade the tenant delinquency consequences."
    roles: [ComplianceAuditor]
    code: 200
    input: []
    output: EquipmentAudit
    side_effects:
      - "status IN_PROGRESS->FINALIZED"
      - "every OPEN finding gets months_billable and retroactive_billing_cents via calculations.retroactive_unauthorized_billing and moves OPEN->BILLED"
      - "retroactive_billing_total_cents := sum over the audit's findings (0 when the audit has none)"
      - "each affected Tenant.outstanding_balance_cents increased and credit_status recomputed; a CURRENT->DELINQUENT flip suspends that tenant's ACTIVE master leases and moves their SUBMITTED / UNDER_STRUCTURAL_REVIEW applications to ON_HOLD"

  # --- Test-driving surface --------------------------------------------------
  - method: POST
    path: "/tower-colo/_clock/set_current_utc"
    description: "Set the server's logical clock. The clock starts at the fixed default 2026-08-01T00:00:00Z on a cold start and MUST NOT fall back to wall-clock time; every deadline, anniversary, expiry and window rule reads this clock. Advancing the clock runs the ground-lease and master-lease expiry sweeps."
    roles: [PortfolioAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, expired_ground_lease_count: integer, expired_master_lease_count: integer, frozen_tower_count: integer }"
    side_effects:
      - "every GroundLease with status IN {ACTIVE, RENEWAL_NEGOTIATION} and term_end_date < the new instant moves to EXPIRED, freezing its tower and pushing that tower's UNDER_STRUCTURAL_REVIEW applications to CAPACITY_HOLD"
      - "every MasterLeaseAgreement with status == ACTIVE and expires_on < the new instant moves to EXPIRED with application_privilege := SUSPENDED and its SUBMITTED / UNDER_STRUCTURAL_REVIEW applications moved to ON_HOLD"
      - "tower.version incremented by 1 for each tower whose posture was recomputed"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not a declared role"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, missing required field, invalid enum member, or a §1.1 field constraint violated"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100 or offset negative on a list endpoint"
  - id: ERR_TOWER_NOT_FOUND
    http: 404
    condition: "no Tower matches the path id or the tower_id in the body"
  - id: ERR_LANDLORD_NOT_FOUND
    http: 404
    condition: "no Landlord matches landlord_id"
  - id: ERR_GROUND_LEASE_NOT_FOUND
    http: 404
    condition: "no GroundLease matches the path id or ground_lease_id"
  - id: ERR_TENANT_NOT_FOUND
    http: 404
    condition: "no Tenant matches the path id or tenant_id"
  - id: ERR_MLA_NOT_FOUND
    http: 404
    condition: "no MasterLeaseAgreement matches the path id or master_lease_agreement_id"
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "no ColocationApplication matches the path id or colocation_application_id"
  - id: ERR_EQUIPMENT_LINE_NOT_FOUND
    http: 404
    condition: "no EquipmentLine matches the path id"
  - id: ERR_ANALYSIS_NOT_FOUND
    http: 404
    condition: "no StructuralAnalysis matches the path id or originating_analysis_id"
  - id: ERR_AMENDMENT_NOT_FOUND
    http: 404
    condition: "no SiteAmendment matches the path id, supersedes_amendment_id or site_amendment_id"
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "no ModificationProject matches the path id"
  - id: ERR_COST_SHARE_NOT_FOUND
    http: 404
    condition: "no CostShare matches the path id"
  - id: ERR_AUDIT_NOT_FOUND
    http: 404
    condition: "no EquipmentAudit matches the path id"
  - id: ERR_FINDING_NOT_FOUND
    http: 404
    condition: "no AuditFinding matches the path id"
  - id: ERR_IDENTITY_NOT_FOUND
    http: 403
    condition: "X-User-ID of an entity_backed role does not resolve to a row of the backing entity"
  - id: ERR_TENANT_SCOPE_VIOLATION
    http: 403
    condition: "role Tenant acts on a resource owned by a different tenant"
  - id: ERR_LANDLORD_SCOPE_VIOLATION
    http: 403
    condition: "role Landlord queries ground leases whose landlord_id is not its own X-User-ID"
  - id: ERR_STALE_TOWER_VERSION
    http: 412
    condition: "expected_tower_version does not equal the tower's current version"
  - id: ERR_STALE_PROJECT_VERSION
    http: 412
    condition: "expected_modification_project_version does not equal the project's current version"
  - id: ERR_INVALID_APPLICATION_STATE
    http: 409
    condition: "the requested application transition is not declared from the application's current status"
  - id: ERR_INVALID_AMENDMENT_STATE
    http: 409
    condition: "the requested execution-axis transition is not declared from the amendment's current execution_status"
  - id: ERR_INVALID_BILLING_STATE
    http: 409
    condition: "the requested billing-axis transition is not declared from the amendment's current billing_status"
  - id: ERR_INVALID_PROJECT_STATE
    http: 409
    condition: "the requested project transition is not declared from the project's current status"
  - id: ERR_INVALID_LEASE_STATE
    http: 409
    condition: "the requested ground-lease transition is not declared from the lease's current status"
  - id: ERR_INVALID_AUDIT_STATE
    http: 409
    condition: "the requested audit transition is not declared from the audit's current status"
  - id: ERR_INVALID_COST_SHARE_STATE
    http: 409
    condition: "the cost share is not PENDING when accepted or declined"
  - id: ERR_INVALID_ANALYSIS_STATE
    http: 409
    condition: "a quotation is requested on an analysis whose status is not ISSUED, or whose result is PASS"
  - id: ERR_MLA_NOT_ACTIVE
    http: 409
    condition: "the application's master lease agreement is not ACTIVE"
  - id: ERR_MLA_PRIVILEGE_SUSPENDED
    http: 409
    condition: "the master lease agreement's application_privilege is SUSPENDED"
  - id: ERR_GROUND_LEASE_NOT_ACTIVE
    http: 409
    condition: "the tower has no ACTIVE ground lease at amendment execution"
  - id: ERR_TOWER_POSTURE_FROZEN
    http: 409
    condition: "the tower's capacity_posture is FROZEN and the operation requires occupancy or approval"
  - id: ERR_STRUCTURAL_CAPACITY_EXCEEDED
    http: 422
    condition: "post-execution loading percentage is at or above STRUCTURAL_CAPACITY_LIMIT_PCT"
  - id: ERR_STRUCTURAL_CLEARANCE_MISSING
    http: 422
    condition: "the amendment's application has neither a PASS analysis nor a CERTIFIED reinforcement of its newest analysis"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the certifying engineer is the proposing engineer or the engineer who authored the originating analysis"
  - id: ERR_ELEVATION_BAND_CONFLICT
    http: 409
    condition: "the amendment's half-open elevation band does not clear ELEVATION_SEPARATION_BUFFER_FT against an occupied band"
  - id: ERR_ELEVATION_OUT_OF_RANGE
    http: 422
    condition: "the requested band falls outside the tower's usable elevation range"
  - id: ERR_GROUND_SPACE_UNAVAILABLE
    http: 422
    condition: "the amendment's ground_space_sqft exceeds the tower's available ground space"
  - id: ERR_NO_EQUIPMENT_LINES
    http: 422
    condition: "the application has no EquipmentLine at submit or revise"
  - id: ERR_CONSTRUCTION_WINDOW_CONFLICT
    http: 409
    condition: "another live project on the tower occupies an intersecting construction window"
  - id: ERR_TERM_EXCEEDS_GROUND_LEASE
    http: 422
    condition: "the amendment term ends after the tower's ACTIVE ground lease term"
  - id: ERR_RENEWAL_WINDOW_CLOSED
    http: 422
    condition: "renewal is opened more than RENEWAL_WINDOW_DAYS before the lease term end"
  - id: ERR_NO_RENEWAL_OPTIONS_REMAINING
    http: 422
    condition: "renewals_exercised has reached renewal_option_count"
  - id: ERR_PAYMENT_PERIOD_OVERLAP
    http: 409
    condition: "period_start_date is not strictly after the lease's paid_through_date"
  - id: ERR_PAYMENT_PERIOD_GAP
    http: 422
    condition: "period_start_date is later than paid_through_date + 1 day, skipping a month"
  - id: ERR_PAYMENT_PERIOD_NOT_WHOLE_MONTHS
    http: 422
    condition: "period_start_date is not a month's first day or period_end_date is not a month's last day"
  - id: ERR_AUDIT_DATE_IN_FUTURE
    http: 422
    condition: "audit_date is after the logical clock instant"
  - id: ERR_FINDING_DATE_AFTER_AUDIT
    http: 422
    condition: "installed_on_date is after the parent audit's audit_date"
  - id: ERR_SUPERSEDE_TARGET_INVALID
    http: 422
    condition: "supersedes_amendment_id is not an EXECUTED amendment of the same master lease on the same tower"
  - id: ERR_COST_SHARE_BENEFICIARY_INVALID
    http: 422
    condition: "the beneficiary set is empty or its total basis load is 0"
  - id: ERR_LANDLORD_W9_MISSING
    http: 422
    condition: "the lease's landlord has w9_on_file == false"
  - id: ERR_TENANT_DELINQUENT
    http: 402
    condition: "the acting or owning tenant's credit_status is DELINQUENT"
  - id: ERR_BUYOUT_NOT_AVAILABLE
    http: 422
    condition: "the lease's buyout_price_cents is 0"
  - id: ERR_INVALID_PAYMENT_AMOUNT
    http: 422
    condition: "amount_cents is not strictly positive"
  - id: ERR_QUOTATION_MISSING
    http: 422
    condition: "the originating analysis is not QUOTED with a positive construction cost"
  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 422
    condition: "the requested clock instant is not strictly after the current logical clock"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PortfolioAdmin
    description: "Tower company lease administrator: owns the asset inventory, ground leases, landlord payments, master lease agreements, application dispositions, amendments and project cancellation."
    identity: opaque
    exclusive_operations:
      - "POST /tower-colo/towers"
      - "POST /tower-colo/landlords"
      - "POST /tower-colo/ground-leases"
      - "POST /tower-colo/ground-leases/{id}/open-renewal"
      - "POST /tower-colo/ground-leases/{id}/renew"
      - "POST /tower-colo/ground-leases/{id}/buyout"
      - "POST /tower-colo/landlord-payments"
      - "POST /tower-colo/tenants"
      - "POST /tower-colo/master-lease-agreements"
      - "POST /tower-colo/master-lease-agreements/{id}/activate"
      - "POST /tower-colo/master-lease-agreements/{id}/reinstate"
      - "POST /tower-colo/colocation-applications/{id}/approve"
      - "POST /tower-colo/colocation-applications/{id}/reject"
      - "POST /tower-colo/site-amendments"
      - "POST /tower-colo/site-amendments/{id}/execute"
      - "POST /tower-colo/site-amendments/{id}/void"
      - "POST /tower-colo/site-amendments/{id}/billing-status"
      - "POST /tower-colo/site-amendments/{id}/complete-decommission"
      - "POST /tower-colo/modification-projects/{id}/cancel"
      - "POST /tower-colo/_clock/set_current_utc"
    shared_operations:
      - "POST /tower-colo/tenants/{id}/payments (shared with Tenant)"
      - "all GET endpoints except the Landlord-scoped payment list"
  - name: StructuralEngineer
    description: "Licensed engineer who runs structural analyses, issues modification quotations, proposes projects, allocates cost shares and certifies completion."
    identity: opaque
    exclusive_operations:
      - "POST /tower-colo/structural-analyses"
      - "POST /tower-colo/structural-analyses/{id}/quotation"
      - "POST /tower-colo/modification-projects"
      - "POST /tower-colo/modification-projects/{id}/allocate-cost-shares"
      - "POST /tower-colo/modification-projects/{id}/reallocate-cost-shares"
      - "POST /tower-colo/modification-projects/{id}/start-construction"
      - "POST /tower-colo/modification-projects/{id}/certify-completion"
    shared_operations:
      - "GET endpoints on towers, leases, applications, analyses, amendments, projects and cost shares"
    note: "segregation of duties: the X-User-ID that authored the originating analysis or proposed the project cannot be the X-User-ID that certifies completion"
  - name: ComplianceAuditor
    description: "Field compliance auditor who schedules and finalizes tenant equipment audits and records unauthorized installations."
    identity: opaque
    exclusive_operations:
      - "POST /tower-colo/equipment-audits"
      - "POST /tower-colo/equipment-audits/{id}/start"
      - "POST /tower-colo/equipment-audits/{id}/findings"
      - "POST /tower-colo/equipment-audits/{id}/finalize"
    shared_operations:
      - "GET endpoints on towers, applications, equipment lines, amendments, audits, findings and tenants"
  - name: Tenant
    description: "Carrier tenant that files colocation applications, edits its equipment schedule, responds to cost shares and gives notice of departure."
    identity: "entity_backed:Tenant"
    exclusive_operations:
      - "POST /tower-colo/colocation-applications"
      - "POST /tower-colo/colocation-applications/{id}/equipment-lines"
      - "DELETE /tower-colo/equipment-lines/{id}"
      - "POST /tower-colo/colocation-applications/{id}/submit"
      - "POST /tower-colo/colocation-applications/{id}/revise"
      - "POST /tower-colo/colocation-applications/{id}/withdraw"
      - "POST /tower-colo/site-amendments/{id}/termination-notice"
      - "POST /tower-colo/cost-shares/{id}/accept"
      - "POST /tower-colo/cost-shares/{id}/decline"
    shared_operations:
      - "POST /tower-colo/tenants/{id}/payments (shared with PortfolioAdmin)"
      - "GET endpoints on towers, applications, equipment lines, analyses, amendments, projects, cost shares and findings"
  - name: Landlord
    description: "Ground landlord that reads its own leases and the payments remitted against them."
    identity: "entity_backed:Landlord"
    exclusive_operations: []
    shared_operations:
      - "GET /tower-colo/towers"
      - "GET /tower-colo/towers/{id}"
      - "GET /tower-colo/ground-leases (scoped to landlord_id == X-User-ID)"
      - "GET /tower-colo/ground-leases/{id}"
      - "GET /tower-colo/ground-leases/{id}/landlord-payments"
