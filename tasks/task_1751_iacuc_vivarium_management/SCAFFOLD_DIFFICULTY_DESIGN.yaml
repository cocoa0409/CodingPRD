            - call: "POST /iacuc/cages"
              payload: { cage_barcode: "CAP-1", room_code: "VIV-401", species: "MOUSE", cage_kind: "STANDARD", capacity_adults: 5, protocol_id: "${proto_id}" }
              as: FacilityManager
