          ABANDON is issued from CLOSE_OPEN (not from PLANNING) and reaches four different child
          entities in one call, while the one child that is ALREADY terminal is provably left alone: the
          PENDING sub-certification becomes VOID, the WITHDRAWN sub-certification keeps status WITHDRAWN
          and keeps its version, the BLOCKED officer certification becomes VOID and the DRAFT document
