scaffold_difficulty_design:
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: royalty_accrual_gross_vs_net
        grounds:
          - calculations.royalty_accrual
          - state_machines.RoyaltyStatement.DRAFT_to_POSTED
          - entities.License.fields.royalty_basis
        distinguishing_aspect: "Same gross=22220, deduction=2220, rate=1500bps: GROSS license accrues 3333 cents while NET license accrues 3000 cents — dual-variant on the RoyaltyStatement/License financial domain (distinct entity domain from effective_date on the registration domain)."
        test_recipe:
          setup:
            - "Registered Work with single owner (A=10000 bps)"
            - "Two NON_EXCLUSIVE licenses on the work: one royalty_basis=GROSS, one NET, both rate 1500 bps"
            - "Each license has a DRAFT RoyaltyStatement with gross_revenue_cents=22220, deduction_cents=2220"
          setup_api_calls:
            - call: "POST /copyright/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T00:00:00Z" }
              as: Admin
            - call: "POST /copyright/works"
              payload: { title: "W", work_type: "LITERARY", year_of_creation: 2024, author_name: "A", owner_shares: [{ name: "A", share_bps: 10000 }] }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { w_id: $.data.id }
            - call: "POST /copyright/applications"
              payload: { work_id: "${w_id}", filing_basis: "STANDARD" }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { app_id: $.data.id }
            - call: "POST /copyright/applications/${app_id}/submit"
              payload: {}
              as: RightsHolder
              as_user_id: "rh_1"
            - call: "POST /copyright/applications/${app_id}/pay-fee"
              payload: { amount_cents: 6500 }
              as: RightsHolder
              as_user_id: "rh_1"
            - call: "POST /copyright/deposits"
              payload: { application_id: "${app_id}", deposit_type: "ELECTRONIC", copy_count: 1 }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { dep_id: $.data.id }
            - call: "POST /copyright/deposits/${dep_id}/accept"
              payload: {}
              as: Examiner
            - call: "POST /copyright/applications/${app_id}/begin-examination"
              payload: {}
              as: Examiner
            - call: "POST /copyright/applications/${app_id}/register"
              payload: {}
              as: Examiner
            - call: "POST /copyright/licenses"
              payload: { work_id: "${w_id}", licensee_name: "L", license_type: "NON_EXCLUSIVE", right_type: "REPRODUCTION", territory: "US", start_date: "2026-01-01T00:00:00Z", end_date: "2027-01-01T00:00:00Z", grant_date: "2026-01-01T00:00:00Z", royalty_rate_bps: 1500, royalty_basis: "GROSS" }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { lic_gross_id: $.data.id }
            - call: "POST /copyright/licenses"
              payload: { work_id: "${w_id}", licensee_name: "L2", license_type: "NON_EXCLUSIVE", right_type: "DISTRIBUTION", territory: "US", start_date: "2026-01-01T00:00:00Z", end_date: "2027-01-01T00:00:00Z", grant_date: "2026-01-01T00:00:00Z", royalty_rate_bps: 1500, royalty_basis: "NET" }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { lic_net_id: $.data.id }
            - call: "POST /copyright/royalty-statements"
              payload: { license_id: "${lic_gross_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z", gross_revenue_cents: 22220, deduction_cents: 2220 }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { rs_gross_id: $.data.id }
            - call: "POST /copyright/royalty-statements"
              payload: { license_id: "${lic_net_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z", gross_revenue_cents: 22220, deduction_cents: 2220 }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { rs_net_id: $.data.id }
          trigger:
            - call: "POST /copyright/royalty-statements/${rs_gross_id}/post"
              payload: {}
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { gross_accr: $.data.accrued_cents }
            - call: "POST /copyright/royalty-statements/${rs_net_id}/post"
              payload: {}
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { net_accr: $.data.accrued_cents }
          assert:
            - "RoyaltyStatement.${rs_gross_id}.accrued_cents == 3333"
            - "RoyaltyStatement.${rs_net_id}.accrued_cents == 3000"

      - name: effective_date_receipt_vs_decision
        grounds:
          - calculations.effective_date
          - state_machines.Application.UNDER_EXAMINATION_to_REGISTERED
          - entities.Certificate.fields.effective_date
          - entities.Certificate.fields.decision_date
        distinguishing_aspect: "Certificate.effective_date is the receipt-completion max(submitted, deposit-accepted, fee-paid)=2026-05-05, NOT the decision_date=2026-05-10 — dual-variant on the Certificate/registration domain (distinct from royalty accrual)."
        test_recipe:
          setup:
            - "Application submitted 2026-05-02, fee paid 2026-05-03, deposit accepted 2026-05-05, registered 2026-05-10"
          setup_api_calls:
            - call: "POST /copyright/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T00:00:00Z" }
              as: Admin
            - call: "POST /copyright/works"
              payload: { title: "W", work_type: "LITERARY", year_of_creation: 2024, author_name: "A", owner_shares: [{ name: "A", share_bps: 10000 }] }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { w_id: $.data.id }
            - call: "POST /copyright/applications"
              payload: { work_id: "${w_id}", filing_basis: "STANDARD" }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { app_id: $.data.id }
            - call: "POST /copyright/applications/${app_id}/submit"
              payload: {}
              as: RightsHolder
              as_user_id: "rh_1"
            - call: "POST /copyright/deposits"
              payload: { application_id: "${app_id}", deposit_type: "ELECTRONIC", copy_count: 1 }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { dep_id: $.data.id }
            - call: "POST /copyright/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-03T00:00:00Z" }
              as: Admin
            - call: "POST /copyright/applications/${app_id}/pay-fee"
              payload: { amount_cents: 6500 }
              as: RightsHolder
              as_user_id: "rh_1"
            - call: "POST /copyright/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T00:00:00Z" }
              as: Admin
            - call: "POST /copyright/deposits/${dep_id}/accept"
              payload: {}
              as: Examiner
            - call: "POST /copyright/applications/${app_id}/begin-examination"
              payload: {}
              as: Examiner
            - call: "POST /copyright/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: Admin
          trigger:
            - call: "POST /copyright/applications/${app_id}/register"
              payload: {}
              as: Examiner
            - call: "GET /copyright/certificates?application_id=${app_id}"
              payload: {}
              as: Examiner
              captures: { cert_id: "$.data[0].id" }
          assert:
            - "Certificate.${cert_id}.effective_date == 2026-05-05T00:00:00Z"
            - "Certificate.${cert_id}.decision_date == 2026-05-10T00:00:00Z"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: application_fee_multifactor
        grounds:
          - calculations.application_fee
          - state_machines.Application.DRAFT_to_SUBMITTED
          - entities.Application.fields.fee_due_cents
        distinguishing_aspect: "Mode (a): fee_due_cents nests three inputs non-linearly — STANDARD base 6500 + (claimant_count-1)*1500 + expedite 80000 = 89500 for claimant_count=3, is_expedited=true, published work."
        test_recipe:
          setup:
            - "Published Work; DRAFT application filing_basis=STANDARD, claimant_count=3, is_expedited=true"
          setup_api_calls:
            - call: "POST /copyright/works"
              payload: { title: "W", work_type: "LITERARY", year_of_creation: 2024, author_name: "A", owner_shares: [{ name: "A", share_bps: 10000 }], is_published: true, publication_date: "2025-01-01T00:00:00Z" }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { w_id: $.data.id }
            - call: "POST /copyright/applications"
              payload: { work_id: "${w_id}", filing_basis: "STANDARD", claimant_count: 3, is_expedited: true }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /copyright/applications/${app_id}/submit"
              payload: {}
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { fee: $.data.fee_due_cents }
          assert:
            - "Application.${app_id}.fee_due_cents == 89500"

      - name: royalty_distribution_round_then_allocate
        grounds:
          - calculations.royalty_distribution
          - state_machines.RoyaltyStatement.POSTED_to_DISTRIBUTED
          - entities.Work.fields.owner_shares
        distinguishing_aspect: "Mode (b): floor-per-owner then remainder waterfall (share DESC, index ASC) — accrued 3333 over shares A5000/B3000/C2000 yields A=1667,B=1000,C=666; naive round-then-sum would over-allocate. Distinct mode from application_fee (a)."
        test_recipe:
          setup:
            - "Registered Work with owner_shares A=5000,B=3000,C=2000"
            - "ACTIVE GROSS license rate 1500; POSTED statement gross=22220 (accrued 3333)"
          setup_api_calls:
            - call: "POST /copyright/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T00:00:00Z" }
              as: Admin
            - call: "POST /copyright/works"
              payload: { title: "W", work_type: "MUSICAL", year_of_creation: 2024, author_name: "A", owner_shares: [{ name: "A", share_bps: 5000 }, { name: "B", share_bps: 3000 }, { name: "C", share_bps: 2000 }] }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { w_id: $.data.id }
            - call: "POST /copyright/applications"
              payload: { work_id: "${w_id}", filing_basis: "STANDARD" }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { app_id: $.data.id }
            - call: "POST /copyright/applications/${app_id}/submit"
              payload: {}
              as: RightsHolder
              as_user_id: "rh_1"
            - call: "POST /copyright/applications/${app_id}/pay-fee"
              payload: { amount_cents: 6500 }
              as: RightsHolder
              as_user_id: "rh_1"
            - call: "POST /copyright/deposits"
              payload: { application_id: "${app_id}", deposit_type: "ELECTRONIC", copy_count: 1 }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { dep_id: $.data.id }
            - call: "POST /copyright/deposits/${dep_id}/accept"
              payload: {}
              as: Examiner
            - call: "POST /copyright/applications/${app_id}/begin-examination"
              payload: {}
              as: Examiner
            - call: "POST /copyright/applications/${app_id}/register"
              payload: {}
              as: Examiner
            - call: "POST /copyright/licenses"
              payload: { work_id: "${w_id}", licensee_name: "L", license_type: "NON_EXCLUSIVE", right_type: "REPRODUCTION", territory: "US", start_date: "2026-01-01T00:00:00Z", end_date: "2027-01-01T00:00:00Z", grant_date: "2026-01-01T00:00:00Z", royalty_rate_bps: 1500, royalty_basis: "GROSS" }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { lic_id: $.data.id }
            - call: "POST /copyright/royalty-statements"
              payload: { license_id: "${lic_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z", gross_revenue_cents: 22220 }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { rs_id: $.data.id }
            - call: "POST /copyright/royalty-statements/${rs_id}/post"
              payload: {}
              as: RightsHolder
              as_user_id: "rh_1"
          trigger:
            - call: "POST /copyright/royalty-statements/${rs_id}/distribute"
              payload: {}
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { dist_total: $.data.distributed_cents }
          assert:
            - "RoyaltyStatement.${rs_id}.distributed_cents == 3333"
            - "RoyaltyStatement.${rs_id}.distribution == [{name: A, amount_cents: 1667}, {name: B, amount_cents: 1000}, {name: C, amount_cents: 666}]"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: application_correspondence_cycle
        grounds:
          - state_machines.Application.UNDER_EXAMINATION_to_CORRESPONDENCE
          - state_machines.Application.CORRESPONDENCE_to_UNDER_EXAMINATION
          - entities.Application.fields.correspondence_rounds
        distinguishing_aspect: "Application cycles UNDER_EXAMINATION->CORRESPONDENCE->UNDER_EXAMINATION twice; correspondence_rounds==2 and status returns to UNDER_EXAMINATION — a true cycle on the Application entity (distinct entity from the DMCA branching machine)."
        test_recipe:
          setup:
            - "Application in UNDER_EXAMINATION (deposit accepted, fee paid)"
          setup_api_calls:
            - call: "POST /copyright/works"
              payload: { title: "W", work_type: "LITERARY", year_of_creation: 2024, author_name: "A", owner_shares: [{ name: "A", share_bps: 10000 }] }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { w_id: $.data.id }
            - call: "POST /copyright/applications"
              payload: { work_id: "${w_id}", filing_basis: "STANDARD" }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { app_id: $.data.id }
            - call: "POST /copyright/applications/${app_id}/submit"
              payload: {}
              as: RightsHolder
              as_user_id: "rh_1"
            - call: "POST /copyright/applications/${app_id}/pay-fee"
              payload: { amount_cents: 6500 }
              as: RightsHolder
              as_user_id: "rh_1"
            - call: "POST /copyright/deposits"
              payload: { application_id: "${app_id}", deposit_type: "ELECTRONIC", copy_count: 1 }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { dep_id: $.data.id }
            - call: "POST /copyright/deposits/${dep_id}/accept"
              payload: {}
              as: Examiner
            - call: "POST /copyright/applications/${app_id}/begin-examination"
              payload: {}
              as: Examiner
          trigger:
            - call: "POST /copyright/applications/${app_id}/issue-correspondence"
              payload: { issue_code: "CLAIM_UNCLEAR", message: "clarify" }
              as: Examiner
            - call: "POST /copyright/applications/${app_id}/respond-correspondence"
              payload: { message: "clarified" }
              as: RightsHolder
              as_user_id: "rh_1"
            - call: "POST /copyright/applications/${app_id}/issue-correspondence"
              payload: { issue_code: "OTHER", message: "again" }
              as: Examiner
            - call: "POST /copyright/applications/${app_id}/respond-correspondence"
              payload: { message: "answered" }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { st: $.data.status }
          assert:
            - "Application.${app_id}.status == UNDER_EXAMINATION"
            - "Application.${app_id}.correspondence_rounds == 2"
            - "Application.${app_id}.correspondence_open == false"

      - name: dmca_takedown_branching
        grounds:
          - state_machines.DmcaTakedown.EFFECTIVE_to_COUNTERED
          - state_machines.DmcaTakedown.COUNTERED_to_RESTORED
          - state_machines.DmcaTakedown.EFFECTIVE_to_WITHDRAWN
        distinguishing_aspect: "DmcaTakedown branches at EFFECTIVE into {COUNTERED, WITHDRAWN} with divergent side-effects, and COUNTERED->RESTORED cascades CounterNotice->COMPLETE — branching machine on DmcaTakedown (distinct entity from Application's cycle)."
        test_recipe:
          setup:
            - "Takedown EFFECTIVE at clock 2026-06-01; counter-notice filed -> COUNTERED"
          setup_api_calls:
            - call: "POST /copyright/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /copyright/works"
              payload: { title: "W", work_type: "VISUAL_ARTS", year_of_creation: 2024, author_name: "A", owner_shares: [{ name: "A", share_bps: 10000 }] }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { w_id: $.data.id }
            - call: "POST /copyright/dmca-takedowns"
              payload: { work_id: "${w_id}", complainant_name: "C", infringing_url: "http://x/1" }
              as: Complainant
              as_user_id: "cx_1"
              captures: { td_id: $.data.id }
            - call: "POST /copyright/dmca-takedowns/${td_id}/process"
              payload: {}
              as: Examiner
            - call: "POST /copyright/counter-notices"
              payload: { takedown_id: "${td_id}", subscriber_name: "S", statement: "not infringing" }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { cn_id: $.data.id }
            - call: "POST /copyright/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-12T00:00:00Z" }
              as: Admin
          trigger:
            - call: "POST /copyright/dmca-takedowns/${td_id}/restore"
              payload: {}
              as: Examiner
              captures: { st: $.data.status }
          assert:
            - "DmcaTakedown.${td_id}.status == RESTORED"
            - "CounterNotice.${cn_id}.status == COMPLETE"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: recordation_transfer_depth3
        grounds:
          - concurrency_rules[recordation-create-stale-work]
          - state_machines.License.ACTIVE_to_UNDER_REVIEW
          - state_machines.RoyaltyStatement.DRAFT_to_VOIDED
          - entities.Work.fields.current_owner_name
        distinguishing_aspect: "Depth-3 chain: recordation RECORDED -> Work.current_owner_name updated (link A) -> ACTIVE License -> UNDER_REVIEW (link B, caused by owner change) -> DRAFT RoyaltyStatement -> VOIDED (link C, caused by license review); trigger is recordation creation (distinct from the register trigger)."
        test_recipe:
          setup:
            - "Registered Work; ACTIVE NON_EXCLUSIVE license; DRAFT royalty statement under it"
          setup_api_calls:
            - call: "POST /copyright/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T00:00:00Z" }
              as: Admin
            - call: "POST /copyright/works"
              payload: { title: "W", work_type: "LITERARY", year_of_creation: 2024, author_name: "A", owner_shares: [{ name: "A", share_bps: 10000 }] }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { w_id: $.data.id }
            - call: "POST /copyright/applications"
              payload: { work_id: "${w_id}", filing_basis: "STANDARD" }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { app_id: $.data.id }
            - call: "POST /copyright/applications/${app_id}/submit"
              payload: {}
              as: RightsHolder
              as_user_id: "rh_1"
            - call: "POST /copyright/applications/${app_id}/pay-fee"
              payload: { amount_cents: 6500 }
              as: RightsHolder
              as_user_id: "rh_1"
            - call: "POST /copyright/deposits"
              payload: { application_id: "${app_id}", deposit_type: "ELECTRONIC", copy_count: 1 }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { dep_id: $.data.id }
            - call: "POST /copyright/deposits/${dep_id}/accept"
              payload: {}
              as: Examiner
            - call: "POST /copyright/applications/${app_id}/begin-examination"
              payload: {}
              as: Examiner
            - call: "POST /copyright/applications/${app_id}/register"
              payload: {}
              as: Examiner
            - call: "POST /copyright/licenses"
              payload: { work_id: "${w_id}", licensee_name: "L", license_type: "NON_EXCLUSIVE", right_type: "REPRODUCTION", territory: "US", start_date: "2026-01-01T00:00:00Z", end_date: "2027-01-01T00:00:00Z", grant_date: "2026-01-01T00:00:00Z", royalty_rate_bps: 1500, royalty_basis: "GROSS" }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { lic_id: $.data.id }
            - call: "POST /copyright/royalty-statements"
              payload: { license_id: "${lic_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z", gross_revenue_cents: 22220 }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { rs_id: $.data.id }
            - call: "GET /copyright/works/${w_id}"
              payload: {}
              as: Examiner
              captures: { w_v: $.data.version }
          trigger:
            - call: "POST /copyright/recordations"
              payload: { work_id: "${w_id}", transferor_name: "A", transferee_name: "New Owner", execution_date: "2026-05-02T00:00:00Z", expected_work_version: "${w_v}" }
              as: Examiner
              captures: { rec_id: $.data.id }
          assert:
            - "Work.${w_id}.current_owner_name == New Owner"
            - "License.${lic_id}.status == UNDER_REVIEW"
            - "RoyaltyStatement.${rs_id}.status == VOIDED"

      - name: registration_issue_depth2
        grounds:
          - state_machines.Application.UNDER_EXAMINATION_to_REGISTERED
          - state_machines.Work.PENDING_to_REGISTERED
          - entities.Certificate.fields.status
        distinguishing_aspect: "Depth-2 chain: register -> Certificate ISSUED created (link A) -> Work.registration_status REGISTERED (link B, caused by certificate issuance); trigger is application register (distinct from the recordation trigger)."
        test_recipe:
          setup:
            - "Application in UNDER_EXAMINATION"
          setup_api_calls:
            - call: "POST /copyright/works"
              payload: { title: "W", work_type: "LITERARY", year_of_creation: 2024, author_name: "A", owner_shares: [{ name: "A", share_bps: 10000 }] }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { w_id: $.data.id }
            - call: "POST /copyright/applications"
              payload: { work_id: "${w_id}", filing_basis: "STANDARD" }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { app_id: $.data.id }
            - call: "POST /copyright/applications/${app_id}/submit"
              payload: {}
              as: RightsHolder
              as_user_id: "rh_1"
            - call: "POST /copyright/applications/${app_id}/pay-fee"
              payload: { amount_cents: 6500 }
              as: RightsHolder
              as_user_id: "rh_1"
            - call: "POST /copyright/deposits"
              payload: { application_id: "${app_id}", deposit_type: "ELECTRONIC", copy_count: 1 }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { dep_id: $.data.id }
            - call: "POST /copyright/deposits/${dep_id}/accept"
              payload: {}
              as: Examiner
            - call: "POST /copyright/applications/${app_id}/begin-examination"
              payload: {}
              as: Examiner
          trigger:
            - call: "POST /copyright/applications/${app_id}/register"
              payload: {}
              as: Examiner
            - call: "GET /copyright/certificates?application_id=${app_id}"
              payload: {}
              as: Examiner
