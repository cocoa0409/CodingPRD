              as: Developer
              as_user_id: "${studio_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /development-agreements/${agreement_id}/activate"
              payload: {}
              as: PublisherFinance
              as_user_id: "${finance_id}"
            - call: "POST /milestone-builds"
              payload: { milestone_id: "${m1_id}", build_number: 1, feature_completeness_pct: 75.00, crash_free_sessions_pct: 96.00, content_completeness_pct: 60.00, known_blocker_count: 5, release_notes: "Alpha candidate 1" }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { b1_id: $.data.id }
            - call: "POST /publisher-reviews"
              payload: { build_id: "${b1_id}", verdict: "CONDITIONAL", review_window_start_at: "2026-08-01T09:00:00.000Z", review_window_end_at: "2026-08-01T13:00:00.000Z", conditions: [1], cure_days: 14, notes: "Second biome incomplete" }
