      - name: a_stale_day_plan_version_is_rejected_and_admission_resumes_on_the_refreshed_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[reservation-create-stale-day-plan]
          - validations[priority=18]
          - errors[ERR_STALE_DAY_PLAN_VERSION]
          - endpoints[POST /mountain-ops/access-reservations]
          - calculations.admission_allocation
        distinguishing_aspect: |
          The DayPlan version is moved by writes that have nothing to do with admission - opening a
          terrain area recomputes guest_capacity and therefore invalidates every outstanding token. The
          corner is that the token is ALSO consumed by a successful admission, so two parties cannot be
          admitted against one observed capacity figure: the second create on the same token is a 412 even
          though there is ample capacity left, which is exactly the double-spend the rule exists to
          prevent. Every rejection must leave admitted_guest_count and parking_stalls_used untouched.
        test_recipe:
          setup:
            - "A season OPERATING, lift L1 OPEN at 1800 pph, one READY area of 18.0 acres not yet opened, and a PUBLISHED_PARTIAL day plan with 500 parking stalls and no reservations."
