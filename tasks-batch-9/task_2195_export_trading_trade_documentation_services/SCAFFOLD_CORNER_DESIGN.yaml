            - "examined_status == \"COMPLIED\" and negotiable == 197375.00 — gross 200000.00 minus a negotiation fee of 250.00 minus a usance discount of 2375.00"
            - "the usance discount is round(200000.00 * 4.75 / 100 * 90 / 360, 2) on the 360-day basis with the day fraction unrounded before multiplication; the sight_negotiation variant on identical figures would return 199750.00, a divergence of exactly 2375.00"
