          rationale: "That instance certifies a report and then reads two members' notices in the same run, asserting the RATIO member's 80000 / 320000 split against the FLAT_FLOOR member's 93750 / 306250 split from the identical certified total - the ledger-side reconciliation of the variant switch."
      - name: percentages_round_half_up_onto_their_threshold
        claim_type: Precision
        grounds:
          - calculations.position_ballot_tally.precision
        excluded_because:
          difficulty_instance: boundary_precision_check / consensus_pct_rounds_up_onto_the_threshold_exactly
          rationale: "That instance contrasts a committee whose consensus_pct rounds to exactly 66.67 (accepted, CONSENSUS) with one whose threshold is 66.68 (refused, DISSENSUS) on identical ballots, pinning both the 2-decimal round_half_up rule and the inclusive >= comparison."
  - section: Validations
    instances:
      - name: requests_without_usable_identity_headers_unauthenticated
        claim_type: Violation -> Error
        grounds:
          - validations[priority=1].error_id
          - validations[priority=2].error_id
        distinguishing_aspect: "Priorities 1 and 2 run ahead of everything else: both a whitespace-only X-User-ID and a role string that is not one of the five declared roles produce 401 ERR_UNAUTHENTICATED, never 403 and never a 404 for the unknown resource id in the path."
        test_recipe:
          setup:
            - "One member exists so that the path id in the trigger is real and cannot itself explain a 404."
          setup_api_calls:
            - call: "POST /advocacy/members"
              payload: { legal_name: "Alpha Steel Co", membership_tier: "PREMIER", home_jurisdiction_code: "FEDERAL", home_district_code: "CA-12", annual_dues_cents: 400000, dues_year: 2026, restricted_class_size: 25 }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { m1_id: $.data.id }
          trigger:
            - call: "GET /advocacy/members/${m1_id}"
              payload: {}
              as: "(both X-User-ID and X-User-Role headers omitted entirely)"
              captures: { err_no_headers: $.data.error_id }
            - call: "GET /advocacy/members/${m1_id}"
              payload: {}
              as: AssociationAdmin
              as_user_id: ""
              captures: { err_blank_user: $.data.error_id }
            - call: "GET /advocacy/members/${m1_id}"
              payload: {}
              as: "Auditor"
              as_user_id: "aud-1"
              captures: { err_unknown_role: $.data.error_id }
          assert:
            - "Headers omitted: HTTP 401 with error_id ERR_UNAUTHENTICATED"
            - "X-User-ID sent as the empty string (a literal \"\", not a space): HTTP 401 ERR_UNAUTHENTICATED - priority 1 trims before testing emptiness"
            - "X-User-Role 'Auditor': HTTP 401 ERR_UNAUTHENTICATED from priority 2 (NOT 403 ERR_FORBIDDEN_ROLE, which only fires for a known role missing from the endpoint's roles list)"
            - "The member row is unchanged in all three cases"
      - name: member_delegate_reading_another_members_notice_forbidden
        claim_type: Violation -> Error
        grounds:
          - validations[priority=5].error_id
          - endpoints["GET /advocacy/members/{id}/deductibility-notice"]
        distinguishing_aspect: "MemberDelegate is entity_backed, so the role check at priority 3 passes and the scope check at priority 5 is what rejects the cross-member read with 403 ERR_MEMBER_SCOPE_VIOLATION; the very same call with X-User-ID equal to the path id succeeds."
        test_recipe:
          setup:
            - "Two members exist: Alpha and Beta."
          setup_api_calls:
            - call: "POST /advocacy/members"
              payload: { legal_name: "Alpha Steel Co", membership_tier: "PREMIER", home_jurisdiction_code: "FEDERAL", home_district_code: "CA-12", annual_dues_cents: 400000, dues_year: 2026, restricted_class_size: 25 }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { m1_id: $.data.id }
            - call: "POST /advocacy/members"
              payload: { legal_name: "Beta Foundry Co", membership_tier: "FULL", home_jurisdiction_code: "STATE_CA", home_district_code: "CA-12", annual_dues_cents: 400000, dues_year: 2026, restricted_class_size: 25 }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { m2_id: $.data.id }
          trigger:
