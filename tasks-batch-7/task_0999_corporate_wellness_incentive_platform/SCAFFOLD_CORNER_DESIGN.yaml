  # ============================================================ consistency_model
  - section: consistency_model
    instances:
      - name: cascade_visible_immediately_in_response
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, state_machines.ChallengeParticipation.JOINED_to_COMPLETED]
        excluded_because:
          difficulty_instance: activity_ingest_transitive_cascade
          rationale: "The full ingest cascade (ledger entry, balance recompute, participation completion, BONUS, completed_count) is asserted visible immediately after the single POST in the named §1.8 instance."

      - name: program_close_expires_provisional_entries
        claim_type: immediate_consistency
        grounds: [state_machines.WellnessProgram.ACTIVE_to_CLOSED, state_machines.PointsLedgerEntry.PROVISIONAL_to_EXPIRED]
        distinguishing_aspect: "Program close expires the un-finalized 100-point EARNED entry; both balances reconcile to 0 in the same close request's resulting state."
        test_recipe:
          setup: ["employer + ACTIVE program + employee + ACTIVE enrollment + one accepted 100000-step event (100 PROVISIONAL points, never finalized)"]
          setup_api_calls:
            - call: "POST /wellness/employers"
              payload: { name: "Acme", annual_self_only_premium_cents: 120000, tobacco_surcharge_cents: 50000, pmpm_fee_cents: 10000, coaching_session_fee_cents: 7500, k_anonymity_threshold: 5, kiosk_capacity: 2, invoice_approval_limit_cents: 5000 }
              as: PlatformAdmin
