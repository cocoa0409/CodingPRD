  # =========================================================================
  # §9 — Consistency model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_on_confirm
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model"]
        distinguishing_aspect: "Response to POST confirm immediately reflects status=CONFIRMED, venue.booked_dates includes show_date, and tour.projected_gross_cents incremented — no read-after-write lag."
        test_recipe:
          setup: ["Show in HOLD_PLACED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: TourManager
            - call: "POST /tours"
              payload: { tour_name: "T", artist_name: "A", window_start_date: "2026-07-01", window_end_date: "2026-09-01" }
              as: TourManager
              captures: { tid: $.data.id }
