  - rule_id: resource_temporal_overlap
    instances:
      - name: fee_schedule_closed_interval_shared_endpoint_overlap_rejected
        grounds:
          - validations[priority=9]
          - state_machines.FeeSchedule.DRAFT_to_ACTIVE
          - errors[ERR_FEE_SCHEDULE_OVERLAP]
        distinguishing_aspect: "Closed-closed interval semantics on FeeSchedule: activating FS2 [2026-06-30, 2026-12-31] while FS1 [2026-01-01, 2026-06-30] is ACTIVE is rejected because the shared endpoint 2026-06-30 counts as an overlap."
        test_recipe:
          setup:
            - "Practice with FS1 [2026-01-01,2026-06-30] ACTIVE (one line); FS2 [2026-06-30,2026-12-31] DRAFT with one line; clock 2026-06-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AccountManager
            - call: "POST /rcm/practices"
              payload: { name: "Xi Clinic", npi: "1111111124", tax_id: "22-3333346", billing_fee_pct: 0.06 }
              as: AccountManager
              captures: { prac_id: $.data.id, prac_v: $.data.version }
            - call: "POST /rcm/fee-schedules"
              payload: { practice_id: "${prac_id}", effective_date: "2026-01-01T00:00:00Z", end_date: "2026-06-30T00:00:00Z" }
              as: AccountManager
              captures: { fs1_id: $.data.id }
            - call: "POST /rcm/fee-schedules/${fs1_id}/lines"
              payload: { cpt_code: "99213", allowed_amount_cents: 10000 }
              as: AccountManager
            - call: "POST /rcm/fee-schedules/${fs1_id}/activate"
              payload: { expected_practice_version: "${prac_v}" }
              as: AccountManager
            - call: "GET /rcm/practices/${prac_id}"
              payload: {}
              as: AccountManager
              captures: { prac_v1: $.data.version }
            - call: "POST /rcm/fee-schedules"
              payload: { practice_id: "${prac_id}", effective_date: "2026-06-30T00:00:00Z", end_date: "2026-12-31T00:00:00Z" }
              as: AccountManager
              captures: { fs2_id: $.data.id }
            - call: "POST /rcm/fee-schedules/${fs2_id}/lines"
              payload: { cpt_code: "99213", allowed_amount_cents: 11000 }
              as: AccountManager
          trigger:
            - call: "POST /rcm/fee-schedules/${fs2_id}/activate"
              payload: { expected_practice_version: "${prac_v1}" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_FEE_SCHEDULE_OVERLAP"
            - "FeeSchedule.${fs2_id}.status == DRAFT"
