              as: EconomyDesigner
              as_user_id: "u_designer_1"
              captures: { zero_delta_err: $.data.error_id }
            - call: "POST /offers"
              payload: { season_id: "${season_id}", offer_type: "BUNDLE", sku: "EMPTY_WINDOW", price_tier: "T1", list_price_minor: 499, line_items: [{ sku: "COIN_PACK_B", base_price_minor: 499, declared_value_minor: 700, granted_currency_code: "SOFT_COIN", granted_amount_minor: 700 }], window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T00:00:00Z" }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
              captures: { window_err: $.data.error_id }
          assert:
            - "${enum_err} == ERR_INVALID_REQUEST with HTTP 400"
            - "${range_err} == ERR_INVALID_REQUEST with HTTP 400"
            - "${zero_delta_err} == ERR_INVALID_REQUEST with HTTP 400"
            - "${window_err} == ERR_INVALID_REQUEST with HTTP 400"
            - "no Player, Offer or BalanceChange row was created by any of the four calls"

      - name: corner_entity_immutability_ledger_append_only
        claim_type: Immutability
        grounds:
          - entities.EconomyLedgerEntry
          - entities.EconomyLedgerEntry.fields.reversal_of_entry_id
          - endpoints["GET /ledger-entries/{entry_id}"]
        distinguishing_aspect: |
          EconomyLedgerEntry declares common_fields false: it has no version field and no write
          endpoint of its own, so a rollback corrects the record by appending a second entry
          whose reversal_of_entry_id points at the first, leaving the original row byte-identical.
        test_recipe:
          setup:
            - "Season S7 LIVE; player p1 (NA) with a SOFT_COIN account."
            - "Episode 1 (soft_currency_grant_minor 1200) released at 2026-08-02T00:00:00Z, then rolled back at 2026-08-03T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /seasons"
              payload: { code: "S7", title: "Season 7 Tidebreak", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-10-30T00:00:00Z", planned_episode_count: 6, target_xp_total: 9000, pass_price_minor: 1000 }
              as: ContentProducer
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/status"
              payload: { to_status: "LIVE" }
              as: ContentProducer
            - call: "POST /players"
              payload: { handle: "tide_p1", region_code: "NA", active_season_id: "${season_id}" }
              as: LiveOpsCommander
              captures: { p1_id: $.data.id }
            - call: "POST /players/${p1_id}/currency-accounts"
              payload: { currency_code: "SOFT_COIN" }
              as: LiveOpsCommander
              captures: { p1_soft_id: $.data.id }
            - call: "POST /episodes"
              payload: { season_id: "${season_id}", sequence_no: 1, title: "E1 Tidefall", planned_release_at: "2026-08-02T00:00:00Z", xp_grant: 600, soft_currency_grant_minor: 1200 }
              as: ContentProducer
              captures: { ep1_id: $.data.id }
            - call: "POST /episodes/${ep1_id}/schedule"
              payload: {}
              as: ContentProducer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /episodes/${ep1_id}/release"
              payload: {}
              as: ContentProducer
            - call: "GET /ledger-entries"
              payload: { currency_account_id: "${p1_soft_id}", direction: "FAUCET" }
              as: LiveOpsCommander
              captures: { grant_entry_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /episodes/${ep1_id}/rollback"
              payload: { reason: "Bad grant table" }
              as: LiveOpsCommander
          trigger:
            - call: "GET /ledger-entries/${grant_entry_id}"
              payload: {}
              as: LiveOpsCommander
            - call: "GET /ledger-entries"
              payload: { reversal_of_entry_id: "${grant_entry_id}" }
              as: LiveOpsCommander
          assert:
            - "EconomyLedgerEntry.${grant_entry_id}.direction == FAUCET"
            - "EconomyLedgerEntry.${grant_entry_id}.amount_minor == 1200"
            - "EconomyLedgerEntry.${grant_entry_id}.source_kind == EPISODE_GRANT"
            - "EconomyLedgerEntry.${grant_entry_id}.occurred_at == 2026-08-02T00:00:00Z"
            - "EconomyLedgerEntry.${grant_entry_id}.reversal_of_entry_id == null"
            - "EconomyLedgerEntry.${grant_entry_id} exposes no version field"
            - "reversal list returns exactly 1 item with total_count 1"
            - "reversal list data[0].direction == SINK"
            - "reversal list data[0].amount_minor == 1200"
            - "reversal list data[0].source_kind == EPISODE_ROLLBACK_REVERSAL"
            - "reversal list data[0].occurred_at == 2026-08-03T00:00:00Z"

      - name: corner_entity_parent_relationship_and_fk_integrity
        claim_type: Foreign key references validated; cross-reference integrity
        grounds:
          - entities.Episode.fields.season_id
          - entities.LiveEvent.fields.capacity_cluster_id
          - validations[priority=4]
          - errors[ERR_SEASON_NOT_FOUND]
          - errors[ERR_CLUSTER_NOT_FOUND]
        distinguishing_aspect: |
          With the flat topology every parent link travels in the body, so an unresolvable
          body FK is a 404 keyed to the referenced entity (season_id -> ERR_SEASON_NOT_FOUND,
          capacity_cluster_id -> ERR_CLUSTER_NOT_FOUND) and the valid pair is readable back
          through both reverse-lookup routes.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; season S7 in PLANNED and cluster NA-1 ACTIVE both exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /seasons"
              payload: { code: "S7", title: "Season 7 Tidebreak", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-10-30T00:00:00Z", planned_episode_count: 6, target_xp_total: 9000, pass_price_minor: 1000 }
              as: ContentProducer
              captures: { season_id: $.data.id }
            - call: "POST /capacity-clusters"
              payload: { name: "NA-1", region_code: "NA", ccu_capacity: 10000 }
              as: LiveOpsCommander
              captures: { cluster_id: $.data.id }
          trigger:
            - call: "POST /episodes"
              payload: { season_id: "00000000-0000-0000-0000-0000000000aa", sequence_no: 1, title: "Orphan", planned_release_at: "2026-08-02T00:00:00Z", xp_grant: 600, soft_currency_grant_minor: 0 }
              as: ContentProducer
              captures: { bad_season_err: $.data.error_id }
            - call: "POST /live-events"
              payload: { season_id: "${season_id}", capacity_cluster_id: "00000000-0000-0000-0000-0000000000bb", code: "EVT_ORPHAN", window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-05T02:00:00Z", forecast_ccu: 1000 }
              as: ContentProducer
              captures: { bad_cluster_err: $.data.error_id }
            - call: "POST /live-events"
              payload: { season_id: "${season_id}", capacity_cluster_id: "${cluster_id}", code: "EVT_A", window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-05T02:00:00Z", forecast_ccu: 1000 }
              as: ContentProducer
              captures: { evt_a_id: $.data.id }
            - call: "GET /live-events"
              payload: { capacity_cluster_id: "${cluster_id}" }
              as: LiveOpsCommander
          assert:
            - "${bad_season_err} == ERR_SEASON_NOT_FOUND with HTTP 404"
            - "${bad_cluster_err} == ERR_CLUSTER_NOT_FOUND with HTTP 404"
            - "LiveEvent.${evt_a_id}.status == PLANNED"
            - "cluster-filtered list returns exactly 1 item with total_count 1"
            - "cluster-filtered list data[0].code == EVT_A"
            - "no Episode and no LiveEvent named EVT_ORPHAN exists after the two rejected calls"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: corner_sm_initial_states_across_machines
        claim_type: Initial State
        grounds:
          - state_machines.Season.initial_state
          - state_machines.Episode.initial_state
          - state_machines.LiveEvent.initial_state
          - state_machines.BalanceChange.initial_state
          - state_machines.MonitoringRun.initial_state
        distinguishing_aspect: |
          Every freshly created entity sits in its declared initial state in one sweep: Season
          PLANNED, Episode DRAFT, CapacityCluster ACTIVE, LiveEvent PLANNED, Offer DRAFT/OFFLINE,
          ProbabilityDisclosure DRAFT, BalanceChange DRAFT and MonitoringRun OPEN.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; nothing else exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LiveOpsCommander
          trigger:
            - call: "POST /seasons"
              payload: { code: "S7", title: "Season 7 Tidebreak", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-10-30T00:00:00Z", planned_episode_count: 6, target_xp_total: 9000, pass_price_minor: 1000 }
              as: ContentProducer
              captures: { season_id: $.data.id }
            - call: "POST /episodes"
              payload: { season_id: "${season_id}", sequence_no: 1, title: "E1 Tidefall", planned_release_at: "2026-08-02T00:00:00Z", xp_grant: 600, soft_currency_grant_minor: 1200 }
              as: ContentProducer
