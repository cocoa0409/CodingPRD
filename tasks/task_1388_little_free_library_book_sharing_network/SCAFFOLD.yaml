# =============================================================================
# PRD Benchmark Scaffold — Little Free Library & Book Sharing Network
# Difficulty calibration: harder-than-expert (dense cross-entity coupling,
# parallel state dimensions, posture-driven gating, OCC races, dual-variant
# calculations, sweep-driven epoch transitions, segregation of duties).
# =============================================================================

scenario: |
  Little Free Library & Book Sharing Network (Little Free Library steward network): steward registration & charter/map listing, book donation intake & distribution to boxes, box construction/installation & maintenance requests, content guidelines & community complaint handling, seasonal/weather damage repair, book drive coordination with schools, network map accuracy & inactive box removal, steward recognition & training

domain_name: little-free-library-network
api_prefix: /library-network

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: posture_driven_gating   # LibraryBox.listing_posture (derived from complaints, maintenance, inspections, activity) gates allocations, complaint intake, drive eligibility
  secondary_archetype: multi_party_negotiation  # BookDrive fork-join approval (SchoolLiaison x NetworkAdmin); Complaint steward-response window with segregation-of-duties adjudication
  complexity_layers:
    - optimistic_concurrency      # OCC on DonationBatch.version (run supersede) and Steward.version (profile patch)
    - cascading_side_effects      # complaint-upheld -> posture -> allocation cancellation -> item release; drive complete -> recognition event -> tier crossing
    - ops_run_checkpoint          # POST /library-network/map/sweeps advances epochs: staleness, suspensions, decommissions, window transitions, complaint expiry
    - selector_policy             # distribution-run box selection: eligibility filter + need_score ranking + created_at tie-break + empty-pool error
  entity_topology: flat            # peer entities joined by foreign keys; no nested ownership URLs
  state_machine_shape: parallel    # LibraryBox: charter_status x listing_posture; BookDrive: status x school_approval_status x network_approval_status; cyclic reopen loop on MaintenanceRequest
  relationship_patterns: [one_to_many, cross_aggregate, self_referential, polymorphic]
  role_model: segregation_of_duties  # complaint triager / responder / resolver / adjudicator must be distinct actors
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (13 entities)
# =============================================================================
entities:
  - name: Steward
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Steward's full name" }
      - { name: email, type: string, source: input, description: "Contact email; unique across all stewards regardless of status" }
      - { name: region_code, type: string, source: input, description: "Two-letter region code the steward operates in (e.g. OR, WA)" }
      - { name: status, type: enum, source: system, description: "APPLIED | ACTIVE | SUSPENDED | RETIRED", default: APPLIED }
      - { name: training_level, type: integer, source: computed, description: "Count of distinct TrainingModules with a PASSED TrainingCompletion for this steward", default: 0 }
      - { name: lifetime_points, type: integer, source: computed, description: "Sum of points_delta over ALL RecognitionEvents for this steward, floored at 0", default: 0 }
      - { name: rolling_points, type: integer, source: computed, description: "Sum of points_delta over RecognitionEvents with created_at in the CLOSED window [now-365d, now] per the logical clock, floored at 0", default: 0 }
      - { name: recognition_tier, type: enum, source: computed, description: "NONE | BRONZE | SILVER | GOLD | PLATINUM, derived from rolling_points at thresholds 100/300/600/1000 (inclusive)", default: NONE }
      - { name: strike_count, type: integer, source: computed, description: "Count of upheld Complaints (RESOLVED_UPHELD or ADJUDICATED_UPHELD) against boxes where steward_id == this steward", default: 0 }
      - { name: suspended_at, type: datetime, source: system, description: "Logical-clock timestamp of the most recent ACTIVE -> SUSPENDED transition; null when not suspended" }

  - name: TrainingModule
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique module code (ORIENTATION, SAFETY, CURATION, OUTREACH, FUNDRAISING)" }
      - { name: title, type: string, source: input, description: "Human-readable module title" }
      - { name: level, type: integer, source: input, description: "Difficulty level of the module (1 = introductory)" }
      - { name: prerequisite_module_id, type: string, source: input, description: "FK -> TrainingModule.id; optional. The module that must be PASSED before this module may be completed. The prerequisite graph MUST remain acyclic.", constraints: "nullable; must reference an existing TrainingModule; adding it must not create a cycle" }
      - { name: active, type: boolean, source: input, description: "Inactive modules cannot receive new completions", default: true }

  - name: TrainingCompletion
    parent: null
    common_fields: false
    fields:
      - { name: steward_id, type: string, source: input, description: "FK -> Steward.id; the steward who completed the module" }
      - { name: module_id, type: string, source: input, description: "FK -> TrainingModule.id; the completed module" }
      - { name: score, type: integer, source: input, description: "Assessment score 0..100; passed iff score >= 80", constraints: "integer in [0, 100]" }
      - { name: result, type: enum, source: computed, description: "PASSED if score >= 80 else FAILED" }

  - name: LibraryBox
    parent: null
    common_fields: true
    fields:
      - { name: steward_id, type: string, source: input, description: "FK -> Steward.id; the steward who owns and maintains this box" }
      - { name: name, type: string, source: input, description: "Public display name of the box" }
      - { name: latitude, type: number, source: input, description: "WGS84 latitude in [-90, 90]" }
      - { name: longitude, type: number, source: input, description: "WGS84 longitude in [-180, 180]" }
      - { name: capacity_books, type: integer, source: input, description: "Maximum number of books the box can hold; integer >= 1" }
      - { name: region_code, type: string, source: input, description: "Two-letter region code where the box is installed" }
      - { name: charter_number, type: string, source: system, description: "Charter identifier minted at the DRAFT -> CHARTERED transition as 'CH-' + zero-padded 6-digit sequence of count of previously chartered boxes + 1 (first charter is CH-000001); null while DRAFT" }
      - { name: charter_status, type: enum, source: system, description: "DRAFT | CHARTERED | ACTIVE | SUSPENDED | DECOMMISSIONED", default: DRAFT }
      - { name: listing_posture, type: enum, source: system, description: "UNLISTED | LISTED | FLAGGED | DELISTED; derived by calculation box_listing_posture; transitions executed only by system or sweep", default: UNLISTED }
      - { name: installed_at, type: datetime, source: system, description: "Logical-clock timestamp of CHARTERED -> ACTIVE; null before activation" }
      - { name: suspended_at, type: datetime, source: system, description: "Logical-clock timestamp of the most recent ACTIVE -> SUSPENDED transition (manual or sweep); null when not suspended" }
      - { name: last_activity_at, type: datetime, source: system, description: "max(installed_at, latest CONFIRMED InspectionRecord.created_at, latest RESOLVED MaintenanceRequest.resolved_at, latest Allocation -> PLACED transition time); maintained on every such event" }
      - { name: current_stock, type: integer, source: computed, description: "Count of Allocations with box_id == this box and status == PLACED; invariant-maintained", default: 0 }
      - { name: open_critical_maintenance_count, type: integer, source: computed, description: "Count of MaintenanceRequests for this box with severity CRITICAL and status in {TRIAGED, SCHEDULED}", default: 0 }
      - { name: open_high_maintenance_count, type: integer, source: computed, description: "Count of MaintenanceRequests for this box with severity HIGH and status in {TRIAGED, SCHEDULED}", default: 0 }
      - { name: upheld_complaints_90d, type: integer, source: computed, description: "Count of Complaints for this box with status in {RESOLVED_UPHELD, ADJUDICATED_UPHELD} and upheld_at in the CLOSED window [now-90d, now] per the logical clock", default: 0 }
      - { name: days_since_activity, type: integer, source: computed, description: "floor((now - last_activity_at) / 86400) using the logical clock; null while last_activity_at is null", default: null }

  - name: InspectionRecord
    parent: null
    common_fields: false
    fields:
      - { name: box_id, type: string, source: input, description: "FK -> LibraryBox.id; the inspected box" }
      - { name: inspector_user_id, type: string, source: system, description: "X-User-ID of the acting Moderator or NetworkAdmin" }
      - { name: result, type: enum, source: input, description: "CONFIRMED | NOT_FOUND | FAILED_CONDITION" }
      - { name: notes, type: string, source: input, description: "Optional free-text inspection notes", constraints: "nullable" }

  - name: MaintenanceRequest
    parent: null
    common_fields: true
    fields:
      - { name: box_id, type: string, source: input, description: "FK -> LibraryBox.id; the box needing repair" }
      - { name: category, type: enum, source: input, description: "WEATHER_DAMAGE | VANDALISM | WEAR | INSTALLATION_DEFECT" }
      - { name: description, type: string, source: input, description: "Free-text description of the damage or issue" }
      - { name: severity, type: enum, source: system, description: "LOW | MEDIUM | HIGH | CRITICAL; set at triage", constraints: "null until triaged" }
      - { name: status, type: enum, source: system, description: "REPORTED | SCHEDULED | RESOLVED | REOPENED | WONT_FIX", default: REPORTED }
      - { name: season_at_report, type: enum, source: computed, description: "WINTER (Dec,Jan,Feb) | SPRING (Mar,Apr,May) | SUMMER (Jun,Jul,Aug) | FALL (Sep,Oct,Nov), derived from the UTC month of created_at" }
      - { name: season_multiplier, type: number, source: computed, description: "2.0 for WINTER, 1.0 for SPRING/SUMMER/FALL" }
      - { name: sla_deadline_at, type: datetime, source: system, description: "triaged_at + BASE_SLA_HOURS(severity) * season_multiplier hours; set at triage" }
      - { name: triaged_at, type: datetime, source: system, description: "Logical-clock timestamp of the most recent transition into SCHEDULED" }
      - { name: scheduled_date, type: string, source: input, description: "Planned repair date (ISO date), must be >= current logical date at triage time" }
      - { name: resolved_at, type: datetime, source: system, description: "Logical-clock timestamp of the most recent transition into RESOLVED" }
      - { name: resolution_count, type: integer, source: system, description: "Number of times this request has entered RESOLVED (increments on every resolve, including after reopen)", default: 0 }
      - { name: reimbursement_cents, type: integer, source: computed, description: "Parts-and-labor reimbursement from calculation parts_reimbursement; per-line rounding then sum, capped at 15000; reset to null on reopen", constraints: "null until first resolution" }
      - { name: sla_breached, type: boolean, source: computed, description: "true iff resolved_at > sla_deadline_at at resolve time", default: false }

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - { name: box_id, type: string, source: input, description: "FK -> LibraryBox.id; the box whose content or condition is complained about" }
      - { name: category, type: enum, source: input, description: "INAPPROPRIATE_CONTENT | HATE_SPEECH | COMMERCIAL_SPAM | OTHER" }
      - { name: target_category, type: string, source: input, description: "Optional book category (FICTION, NONFICTION, CHILDREN, YOUNG_ADULT, REFERENCE); when the complaint is upheld, PLACED books of this category in the box are QUARANTINED", constraints: "nullable" }
      - { name: description, type: string, source: input, description: "Free-text complaint description" }
      - { name: evidence_url, type: string, source: input, description: "Optional evidence link", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "FILED | STEWARD_RESPONSE_PENDING | UNDER_REVIEW | RESOLVED_UPHELD | RESOLVED_DISMISSED | ESCALATED | ADJUDICATED_UPHELD | ADJUDICATED_DISMISSED", default: FILED }
      - { name: triaged_by_user_id, type: string, source: system, description: "X-User-ID recorded at FILED -> STEWARD_RESPONSE_PENDING; used for segregation of duties" }
      - { name: response_due_at, type: datetime, source: system, description: "triaged_at + 72 hours; steward response deadline" }
      - { name: response_text, type: string, source: input, description: "Steward's response, submitted via respond", constraints: "null until responded" }
      - { name: resolved_by_user_id, type: string, source: system, description: "X-User-ID of the resolver; must differ from triaged_by_user_id" }
      - { name: resolution_notes, type: string, source: input, description: "Resolver's notes", constraints: "nullable" }
      - { name: outcome, type: enum, source: system, description: "UPHELD | DISMISSED; null until resolved or adjudicated", constraints: "null until terminal decision" }
      - { name: upheld_at, type: datetime, source: system, description: "Logical-clock timestamp of the transition into an upheld terminal state (RESOLVED_UPHELD or ADJUDICATED_UPHELD); feeds upheld_complaints_90d", constraints: "null unless upheld" }

  - name: School
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "School name" }
      - { name: district_code, type: string, source: input, description: "School district identifier" }
      - { name: contact_email, type: string, source: input, description: "Liaison contact email; unique across schools" }
      - { name: region_code, type: string, source: input, description: "Two-letter region code" }
      - { name: restricted_categories, type: array, source: input, description: "Book categories (subset of FICTION, NONFICTION, CHILDREN, YOUNG_ADULT, REFERENCE) this school forbids in its book drives" }
      - { name: status, type: enum, source: system, description: "REGISTERED | ACTIVE | INACTIVE", default: REGISTERED }
      - { name: drives_completed_count, type: integer, source: computed, description: "Count of BookDrives for this school that reached COMPLETED", default: 0 }

  - name: BookDrive
    parent: null
    common_fields: true
    fields:
      - { name: school_id, type: string, source: input, description: "FK -> School.id; the partner school" }
      - { name: coordinator_steward_id, type: string, source: system, description: "FK -> Steward.id; the acting steward (X-User-ID of the creator)" }
      - { name: goal_books, type: integer, source: input, description: "Collection goal; integer >= 1" }
      - { name: starts_at, type: datetime, source: input, description: "Collection window start (inclusive); half-open interval [starts_at, ends_at)" }
      - { name: ends_at, type: datetime, source: input, description: "Collection window end (exclusive); must be strictly after starts_at" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | OPEN | COLLECTION_CLOSED | COMPLETED | CANCELLED | REJECTED", default: PROPOSED }
      - { name: school_approval_status, type: enum, source: system, description: "PENDING | APPROVED | REJECTED", default: PENDING }
      - { name: network_approval_status, type: enum, source: system, description: "PENDING | APPROVED | REJECTED", default: PENDING }
      - { name: collected_count, type: integer, source: computed, description: "Count of BookItems in the linked DonationBatch (all statuses)", default: 0 }
      - { name: accepted_count, type: integer, source: computed, description: "Count of BookItems in the linked DonationBatch with status in {AVAILABLE, ALLOCATED, DISPATCHED, PLACED} (excludes QUARANTINED and RECYCLED)", default: 0 }
      - { name: fulfillment_pct_gross, type: integer, source: computed, description: "floor(collected_count * 100 / goal_books); 0 while goal_books is 0 (impossible by validation)", default: 0 }
      - { name: fulfillment_pct_net, type: integer, source: computed, description: "floor(accepted_count * 100 / goal_books)", default: 0 }
      - { name: qualifies_for_bonus, type: boolean, source: computed, description: "fulfillment_pct_net >= 80", default: false }

  - name: DonationBatch
    parent: null
    common_fields: true
    fields:
      - { name: source_type, type: enum, source: input, description: "PUBLIC_DROP | STEWARD_TRANSFER | BOOK_DRIVE" }
      - { name: drive_id, type: string, source: system, description: "FK -> BookDrive.id; required iff source_type == BOOK_DRIVE (ERR_DRIVE_LINK_REQUIRED / ERR_DRIVE_LINK_FORBIDDEN)", constraints: "null unless source_type == BOOK_DRIVE" }
      - { name: region_code, type: string, source: input, description: "Region where the books were collected; used by need_score same-region bonus" }
      - { name: status, type: enum, source: system, description: "RECEIVED | SORTED | CLOSED", default: RECEIVED }
      - { name: item_count, type: integer, source: computed, description: "Total BookItems ever created in this batch (items are never hard-deleted)", default: 0 }
      - { name: graded_count, type: integer, source: computed, description: "Count of items with condition_grade != null", default: 0 }

  - name: BookItem
    parent: null
    common_fields: true
    fields:
      - { name: batch_id, type: string, source: input, description: "FK -> DonationBatch.id; the intake batch this book arrived in" }
      - { name: title, type: string, source: input, description: "Book title" }
      - { name: category, type: enum, source: input, description: "FICTION | NONFICTION | CHILDREN | YOUNG_ADULT | REFERENCE" }
      - { name: condition_grade, type: enum, source: input, description: "A | B | C; null means ungraded", constraints: "nullable; batch cannot complete sorting while any item is ungraded" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | ALLOCATED | DISPATCHED | PLACED | QUARANTINED | RECYCLED", default: AVAILABLE }
      - { name: box_id, type: string, source: system, description: "FK -> LibraryBox.id; the box the book is currently allocated to or placed in; set at run confirm, cleared when the allocation is cancelled", constraints: "null until allocated" }

  - name: DistributionRun
    parent: null
    common_fields: true
    fields:
      - { name: batch_id, type: string, source: input, description: "FK -> DonationBatch.id; the batch whose books are distributed" }
      - { name: status, type: enum, source: system, description: "DRAFT | CONFIRMED | DISPATCHED | COMPLETED | SUPERSEDED", default: DRAFT }
      - { name: plan_snapshot, type: array, source: computed, description: "Server-computed allocation plan: ordered array of {box_id, quantity, need_score} produced by selector_policy at creation; boxes ordered by need_score DESC, created_at ASC" }
      - { name: planned_item_count, type: integer, source: computed, description: "Sum of quantity over plan_snapshot", default: 0 }

  - name: Allocation
    parent: null
    common_fields: true
    fields:
      - { name: run_id, type: string, source: system, description: "FK -> DistributionRun.id; the run that created this allocation" }
      - { name: book_item_id, type: string, source: system, description: "FK -> BookItem.id; the allocated book" }
      - { name: box_id, type: string, source: system, description: "FK -> LibraryBox.id; the destination box" }
      - { name: status, type: enum, source: system, description: "RESERVED | DISPATCHED | PLACED | CANCELLED | REMOVED", default: RESERVED }
      - { name: placed_at, type: datetime, source: system, description: "Logical-clock timestamp of the DISPATCHED -> PLACED transition", constraints: "null until placed" }

  - name: RecognitionEvent
    parent: null
    common_fields: false
    fields:
      - { name: steward_id, type: string, source: system, description: "FK -> Steward.id; the steward earning or losing points" }
      - { name: event_type, type: enum, source: system, description: "MAINTENANCE_RESOLVED | ALLOCATION_PLACED | DRIVE_COMPLETED | COMPLAINT_UPHELD | TRAINING_PASSED" }
      - { name: points_delta, type: integer, source: system, description: "Signed points: +40 MAINTENANCE_RESOLVED, +5 ALLOCATION_PLACED, +150 DRIVE_COMPLETED (qualifying), +50 DRIVE_COMPLETED (non-qualifying), -60 COMPLAINT_UPHELD, +25 TRAINING_PASSED" }
      - { name: source_type, type: string, source: system, description: "Polymorphic source entity type (MAINTENANCE_REQUEST | ALLOCATION | BOOK_DRIVE | COMPLAINT | TRAINING_COMPLETION); paired with source_id. Not a strict FK: intentionally not parseable as `FK ->` because the target entity varies by source_type." }
      - { name: source_id, type: string, source: system, description: "Identifier of the source entity named by source_type (see source_type for the target entity per value)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Steward
    initial_state: APPLIED
    terminal_states: [RETIRED]
    transitions:
      - from: APPLIED
        to: ACTIVE
        trigger: "POST /library-network/stewards/{id}/activate"
        actor: NetworkAdmin
        preconditions:
          - "Steward.status == APPLIED (else ERR_INVALID_STATE)"
          - "At least one TrainingCompletion exists with steward_id == this steward, result == PASSED, and module code == ORIENTATION (else ERR_ORIENTATION_REQUIRED)"
        side_effects:
          - "increments Steward.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /library-network/stewards/{id}/suspend"
        actor: "Moderator | NetworkAdmin"
        preconditions:
          - "Steward.status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "sets suspended_at to current logical clock"
          - "increments Steward.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /library-network/stewards/{id}/reinstate"
        actor: NetworkAdmin
        preconditions:
          - "Steward.status == SUSPENDED (else ERR_INVALID_STATE)"
        side_effects:
          - "clears suspended_at to null"
          - "increments Steward.version by 1"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /library-network/stewards/{id}/retire"
        actor: "Steward (self) | NetworkAdmin"
        preconditions:
          - "Steward.status == ACTIVE (else ERR_INVALID_STATE)"
          - "Steward acting as self must have X-User-ID == steward id (else ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "increments Steward.version by 1"
      - from: SUSPENDED
        to: RETIRED
        trigger: "POST /library-network/stewards/{id}/retire"
        actor: "Steward (self) | NetworkAdmin"
        preconditions:
          - "Steward.status == SUSPENDED (else ERR_INVALID_STATE)"
        side_effects:
          - "increments Steward.version by 1"

  - entity: LibraryBox
    dimension: charter_status
    initial_state: DRAFT
    terminal_states: [DECOMMISSIONED]
    note: "Two parallel state dimensions evolve on this entity: charter_status (DRAFT|CHARTERED|ACTIVE|SUSPENDED|DECOMMISSIONED) and listing_posture (UNLISTED|LISTED|FLAGGED|DELISTED). charter_status transitions are listed below; listing_posture transitions are system-executed by calculation box_listing_posture."
    transitions:
      - from: DRAFT
        to: CHARTERED
        trigger: "POST /library-network/boxes/{id}/status with target_status == CHARTERED"
        actor: NetworkAdmin
        preconditions:
          - "LibraryBox.charter_status == DRAFT (else ERR_INVALID_STATE)"
          - "The owning Steward.status == ACTIVE (else ERR_STEWARD_NOT_ACTIVE)"
        side_effects:
          - "mints charter_number as 'CH-' + zero-padded 6-digit (count of previously chartered boxes + 1)"
          - "increments LibraryBox.version by 1"
      - from: CHARTERED
        to: ACTIVE
        trigger: "POST /library-network/boxes/{id}/status with target_status == ACTIVE"
        actor: NetworkAdmin
        preconditions:
          - "LibraryBox.charter_status == CHARTERED (else ERR_INVALID_STATE)"
          - "At least one InspectionRecord with box_id == this box and result == CONFIRMED exists (else ERR_INSPECTION_REQUIRED)"
          - "The owning Steward.status == ACTIVE (else ERR_STEWARD_NOT_ACTIVE)"
        side_effects:
          - "sets installed_at and last_activity_at to current logical clock"
          - "sets listing_posture to LISTED"
          - "increments LibraryBox.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /library-network/boxes/{id}/status with target_status == ACTIVE"
        actor: "Steward (owner) | NetworkAdmin"
        preconditions:
          - "LibraryBox.charter_status == SUSPENDED (else ERR_INVALID_STATE)"
          - "Steward actor must own the box (X-User-ID == box.steward_id, else ERR_FORBIDDEN_OWNERSHIP)"
          - "An InspectionRecord with result == CONFIRMED and created_at > suspended_at exists (else ERR_INSPECTION_REQUIRED)"
        side_effects:
          - "clears suspended_at to null"
          - "sets last_activity_at to current logical clock"
          - "recomputes listing_posture via box_listing_posture"
          - "increments LibraryBox.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /library-network/boxes/{id}/status with target_status == SUSPENDED (manual) or POST /library-network/map/sweeps (automatic, when days_since_activity >= 180)"
        actor: "NetworkAdmin | system"
        preconditions:
          - "LibraryBox.charter_status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "sets suspended_at to current logical clock"
          - "sets listing_posture to DELISTED"
          - "Recall cascade: in-flight Allocations (RESERVED, DISPATCHED) for this box become CANCELLED and their BookItems return to AVAILABLE with box_id cleared"
          - "increments LibraryBox.version by 1"
      - from: CHARTERED
        to: DECOMMISSIONED
        trigger: "POST /library-network/boxes/{id}/status with target_status == DECOMMISSIONED"
        actor: NetworkAdmin
        preconditions:
          - "LibraryBox.charter_status == CHARTERED (else ERR_INVALID_STATE)"
        side_effects:
          - "sets listing_posture to DELISTED"
          - "increments LibraryBox.version by 1"
      - from: ACTIVE
        to: DECOMMISSIONED
        trigger: "POST /library-network/boxes/{id}/status with target_status == DECOMMISSIONED"
        actor: NetworkAdmin
        preconditions:
          - "LibraryBox.charter_status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "Every Allocation with box_id == this box and status == RESERVED or DISPATCHED becomes CANCELLED, and its BookItem returns to AVAILABLE with box_id cleared to null"
          - "Every Allocation with box_id == this box and status == PLACED becomes REMOVED, and its BookItem becomes RECYCLED"
          - "sets current_stock to 0"
          - "sets listing_posture to DELISTED"
          - "increments LibraryBox.version by 1"
      - from: SUSPENDED
        to: DECOMMISSIONED
        trigger: "POST /library-network/boxes/{id}/status with target_status == DECOMMISSIONED (manual) or POST /library-network/map/sweeps (automatic, when now - suspended_at >= 30 days)"
        actor: "NetworkAdmin | system"
        preconditions:
          - "LibraryBox.charter_status == SUSPENDED (else ERR_INVALID_STATE)"
        side_effects:
          - "Same allocation/item cascade as ACTIVE -> DECOMMISSIONED"
          - "sets current_stock to 0"
          - "sets listing_posture to DELISTED"
          - "increments LibraryBox.version by 1"

  - entity: LibraryBox
    dimension: listing_posture
    note: "Second state machine on LibraryBox for the listing_posture dimension (the first machine above governs charter_status); states UNLISTED | LISTED | FLAGGED | DELISTED. All transitions are executed by the system whenever calculation box_listing_posture is recomputed (child mutations: complaint upheld, maintenance triage/resolve/reopen, inspection created, allocation placed, sweep epoch)."
    initial_state: UNLISTED
    terminal_states: []
    transitions:
      - from: UNLISTED
        to: LISTED
        trigger: "system (box activation sets LISTED directly)"
        actor: system
        preconditions:
          - "LibraryBox.charter_status == ACTIVE"
        side_effects: []
      - from: LISTED
        to: FLAGGED
        trigger: "system (box_listing_posture recompute)"
        actor: system
        preconditions:
          - "charter_status == ACTIVE and DELISTED conditions not met and (upheld_complaints_90d in {1, 2} or open_high_maintenance_count >= 1 or days_since_activity >= 120)"
        side_effects: []
      - from: LISTED
        to: DELISTED
        trigger: "system (box_listing_posture recompute)"
        actor: system
        preconditions:
          - "charter_status == ACTIVE and (open_critical_maintenance_count >= 1 or upheld_complaints_90d >= 3 or days_since_activity >= 180)"
        side_effects:
          - "Recall cascade: every Allocation with box_id == this box and status in {RESERVED, DISPATCHED} becomes CANCELLED, and each such BookItem returns to AVAILABLE with box_id cleared to null; run bubble-up checks fire"
          - "Every DistributionRun in DRAFT whose plan_snapshot contains this box will fail confirm with ERR_PLAN_STALE (enforced at confirm time, not by cascade)"
      - from: FLAGGED
        to: LISTED
        trigger: "system (box_listing_posture recompute)"
        actor: system
        preconditions:
          - "charter_status == ACTIVE and neither FLAGGED nor DELISTED conditions hold"
        side_effects: []
      - from: FLAGGED
        to: DELISTED
        trigger: "system (box_listing_posture recompute)"
        actor: system
        preconditions:
          - "charter_status == ACTIVE and any DELISTED condition holds"
        side_effects:
          - "Same recall cascade as LISTED -> DELISTED: in-flight Allocations (RESERVED, DISPATCHED) become CANCELLED and their BookItems return to AVAILABLE with box_id cleared"
      - from: DELISTED
        to: FLAGGED
        trigger: "system (box_listing_posture recompute)"
        actor: system
        preconditions:
          - "charter_status == ACTIVE and no DELISTED condition holds but at least one FLAGGED condition holds"
        side_effects: []
      - from: DELISTED
        to: LISTED
        trigger: "system (box_listing_posture recompute)"
        actor: system
        preconditions:
          - "charter_status == ACTIVE and neither DELISTED nor FLAGGED condition holds"
        side_effects: []
      - from: UNLISTED
        to: DELISTED
        trigger: "system (box decommission from CHARTERED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: MaintenanceRequest
    initial_state: REPORTED
    terminal_states: [WONT_FIX]
    transitions:
      - from: REPORTED
        to: SCHEDULED
        trigger: "POST /library-network/maintenance-requests/{id}/triage"
        actor: "Moderator | NetworkAdmin"
        preconditions:
          - "MaintenanceRequest.status == REPORTED or REOPENED (else ERR_INVALID_STATE)"
          - "severity input must be one of LOW | MEDIUM | HIGH | CRITICAL (else ERR_INVALID_REQUEST)"
          - "scheduled_date must be >= current logical date (else ERR_SCHEDULE_DATE_PAST)"
        side_effects:
          - "sets severity, triaged_at, scheduled_date"
          - "computes sla_deadline_at via repair_sla_deadline (seasonal multiplier)"
          - "recomputes box.open_critical_maintenance_count / open_high_maintenance_count and listing_posture via box_listing_posture"
          - "increments MaintenanceRequest.version by 1"
      - from: REOPENED
        to: SCHEDULED
        trigger: "POST /library-network/maintenance-requests/{id}/triage"
        actor: "Moderator | NetworkAdmin"
        preconditions:
          - "Same as REPORTED -> SCHEDULED"
        side_effects:
          - "Same as REPORTED -> SCHEDULED"
      - from: SCHEDULED
        to: RESOLVED
        trigger: "POST /library-network/maintenance-requests/{id}/resolve"
        actor: "Moderator | NetworkAdmin"
        preconditions:
          - "MaintenanceRequest.status == SCHEDULED (else ERR_INVALID_STATE)"
          - "Every parts line must have qty >= 1 and unit_cost_cents >= 0 (else ERR_INVALID_REQUEST)"
        side_effects:
          - "computes reimbursement_cents via parts_reimbursement (round per line, then sum, then add rounded labor, then cap at 15000)"
          - "computes sla_breached = (resolved_at > sla_deadline_at)"
          - "increments resolution_count by 1 and sets resolved_at"
          - "creates RecognitionEvent(MAINTENANCE_RESOLVED, +40) for the box's steward"
          - "sets box.last_activity_at to now and recomputes box listing_posture (open maintenance counts drop)"
          - "increments MaintenanceRequest.version by 1"
      - from: RESOLVED
        to: REOPENED
        trigger: "POST /library-network/maintenance-requests/{id}/reopen"
        actor: "Steward (box owner) | NetworkAdmin"
        preconditions:
          - "MaintenanceRequest.status == RESOLVED (else ERR_INVALID_STATE)"
          - "Steward actor must own the box (else ERR_FORBIDDEN_OWNERSHIP)"
          - "now - resolved_at < 14 days per the logical clock (else ERR_REOPEN_WINDOW_EXPIRED; boundary: at exactly 14 days the window is expired because the rule is strict <)"
        side_effects:
          - "resets reimbursement_cents to null (pending recompute at next resolve)"
          - "recomputes box.open_critical_maintenance_count / open_high_maintenance_count and listing_posture"
          - "increments MaintenanceRequest.version by 1"
      - from: REPORTED
        to: WONT_FIX
        trigger: "POST /library-network/maintenance-requests/{id}/resolve with outcome == WONT_FIX"
        actor: "Moderator | NetworkAdmin"
        preconditions:
          - "MaintenanceRequest.status == REPORTED or SCHEDULED (else ERR_INVALID_STATE)"
        side_effects:
          - "increments MaintenanceRequest.version by 1"
      - from: SCHEDULED
        to: WONT_FIX
        trigger: "POST /library-network/maintenance-requests/{id}/resolve with outcome == WONT_FIX"
        actor: "Moderator | NetworkAdmin"
        preconditions:
          - "MaintenanceRequest.status == REPORTED or SCHEDULED (else ERR_INVALID_STATE)"
        side_effects:
          - "recomputes box.open_critical_maintenance_count / open_high_maintenance_count and listing_posture"
          - "increments MaintenanceRequest.version by 1"

  - entity: Complaint
    initial_state: FILED
    terminal_states: [ADJUDICATED_UPHELD, ADJUDICATED_DISMISSED]
    note: "RESOLVED_UPHELD and RESOLVED_DISMISSED are NOT terminal: both may be escalated once to ESCALATED for network adjudication (steward appeal of an upheld ruling, or reporter-backed appeal of a dismissal)."
    transitions:
      - from: FILED
        to: STEWARD_RESPONSE_PENDING
        trigger: "POST /library-network/complaints/{id}/triage"
        actor: "Moderator | NetworkAdmin"
        preconditions:
          - "Complaint.status == FILED (else ERR_INVALID_STATE)"
        side_effects:
          - "records triaged_by_user_id from X-User-ID"
          - "sets response_due_at = now + 72 hours"
          - "increments Complaint.version by 1"
      - from: STEWARD_RESPONSE_PENDING
        to: UNDER_REVIEW
        trigger: "POST /library-network/complaints/{id}/respond (steward response) or POST /library-network/map/sweeps (automatic expiry when now >= response_due_at)"
        actor: "Steward (box owner) | system"
        preconditions:
          - "Complaint.status == STEWARD_RESPONSE_PENDING (else ERR_INVALID_STATE)"
          - "Steward actor must own the complained box (else ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "stores response_text when the steward responds; response_text stays null on sweep expiry"
          - "increments Complaint.version by 1"
      - from: UNDER_REVIEW
        to: RESOLVED_UPHELD
        trigger: "POST /library-network/complaints/{id}/resolve with outcome == UPHELD"
        actor: "Moderator | NetworkAdmin"
        preconditions:
          - "Complaint.status == UNDER_REVIEW (else ERR_INVALID_STATE)"
          - "X-User-ID != triaged_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "sets outcome UPHELD, resolved_by_user_id, upheld_at"
          - "creates RecognitionEvent(COMPLAINT_UPHELD, -60) for the box steward and recomputes strike_count (+1)"
          - "if target_category is set: every BookItem with box_id == complaint.box, category == target_category, status == PLACED becomes QUARANTINED"
          - "recomputes box.upheld_complaints_90d and listing_posture"
          - "increments Complaint.version by 1"
      - from: UNDER_REVIEW
        to: RESOLVED_DISMISSED
        trigger: "POST /library-network/complaints/{id}/resolve with outcome == DISMISSED"
        actor: "Moderator | NetworkAdmin"
        preconditions:
          - "Complaint.status == UNDER_REVIEW (else ERR_INVALID_STATE)"
          - "X-User-ID != triaged_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "sets outcome DISMISSED, resolved_by_user_id"
          - "increments Complaint.version by 1"
      - from: RESOLVED_DISMISSED
        to: ESCALATED
        trigger: "POST /library-network/complaints/{id}/escalate"
        actor: NetworkAdmin
        preconditions:
          - "Complaint.status in {RESOLVED_DISMISSED, RESOLVED_UPHELD} (else ERR_INVALID_STATE)"
        side_effects:
          - "increments Complaint.version by 1"
      - from: RESOLVED_UPHELD
        to: ESCALATED
        trigger: "POST /library-network/complaints/{id}/escalate (steward appeal of an upheld ruling)"
        actor: NetworkAdmin
        preconditions:
          - "Complaint.status in {RESOLVED_DISMISSED, RESOLVED_UPHELD} (else ERR_INVALID_STATE)"
        side_effects:
          - "While ESCALATED, the complaint is NOT counted in upheld_complaints_90d (only RESOLVED_UPHELD and ADJUDICATED_UPHELD count); box posture recomputes on entry to ESCALATED"
          - "increments Complaint.version by 1"
      - from: ESCALATED
        to: ADJUDICATED_UPHELD
        trigger: "POST /library-network/complaints/{id}/adjudicate with outcome == UPHELD"
        actor: NetworkAdmin
        preconditions:
          - "Complaint.status == ESCALATED (else ERR_INVALID_STATE)"
          - "X-User-ID != triaged_by_user_id and X-User-ID != resolved_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "sets outcome UPHELD, upheld_at"
          - "If the pre-escalation state was RESOLVED_UPHELD the upheld cascade already fired and MUST NOT fire twice (no second recognition event, no second quarantine); if it was RESOLVED_DISMISSED, applies the same upheld cascade as UNDER_REVIEW -> RESOLVED_UPHELD (recognition -60, strike +1 via status recount, quarantine, posture recompute)"
          - "increments Complaint.version by 1"
      - from: ESCALATED
        to: ADJUDICATED_DISMISSED
        trigger: "POST /library-network/complaints/{id}/adjudicate with outcome == DISMISSED"
        actor: NetworkAdmin
        preconditions:
          - "Complaint.status == ESCALATED (else ERR_INVALID_STATE)"
          - "X-User-ID != triaged_by_user_id and X-User-ID != resolved_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "sets outcome DISMISSED"
          - "Compensation when the pre-escalation state was RESOLVED_UPHELD: creates a compensating RecognitionEvent(COMPLAINT_UPHELD, +60) for the box steward; strike_count recomputes downward (complaint no longer in an upheld status); every BookItem quarantined by this complaint returns QUARANTINED -> PLACED keeping its box_id; upheld_complaints_90d recomputes and posture recalculates"
          - "increments Complaint.version by 1"

  - entity: School
    initial_state: REGISTERED
    terminal_states: []
    transitions:
      - from: REGISTERED
        to: ACTIVE
        trigger: "POST /library-network/schools/{id}/status with target_status == ACTIVE"
        actor: NetworkAdmin
        preconditions:
          - "School.status in {REGISTERED, INACTIVE} (else ERR_INVALID_STATE)"
        side_effects:
          - "increments School.version by 1"
      - from: INACTIVE
        to: ACTIVE
        trigger: "POST /library-network/schools/{id}/status with target_status == ACTIVE"
        actor: NetworkAdmin
        preconditions:
          - "School.status in {REGISTERED, INACTIVE} (else ERR_INVALID_STATE)"
        side_effects:
          - "increments School.version by 1"
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /library-network/schools/{id}/status with target_status == INACTIVE"
        actor: NetworkAdmin
        preconditions:
          - "School.status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "increments School.version by 1"

  - entity: BookDrive
    initial_state: PROPOSED
    terminal_states: [REJECTED, CANCELLED, COMPLETED]
    note: "Fork-join: status leaves PROPOSED only through the joint state of the two parallel approval dimensions school_approval_status x network_approval_status. Both APPROVED -> status APPROVED (join, creates linked batch); either REJECTED -> status REJECTED (fork to terminal)."
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /library-network/drives/{id}/school-decision with decision == APPROVE, or POST /library-network/drives/{id}/network-decision with decision == APPROVE (whichever completes the join)"
        actor: "SchoolLiaison | NetworkAdmin"
        preconditions:
          - "BookDrive.status == PROPOSED (else ERR_INVALID_STATE)"
          - "SchoolLiaison actor: X-User-ID == drive.school_id (else ERR_FORBIDDEN_OWNERSHIP)"
          - "After this decision, school_approval_status == APPROVED and network_approval_status == APPROVED (the join condition; otherwise the drive stays PROPOSED with one dimension APPROVED)"
        side_effects:
          - "creates the linked DonationBatch(source_type == BOOK_DRIVE, drive_id == this drive, region_code == school's region_code, status RECEIVED)"
          - "increments BookDrive.version by 1"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /library-network/drives/{id}/school-decision or network-decision with decision == REJECT"
        actor: "SchoolLiaison | NetworkAdmin"
        preconditions:
          - "BookDrive.status == PROPOSED (else ERR_INVALID_STATE)"
        side_effects:
          - "sets the deciding dimension to REJECTED"
          - "increments BookDrive.version by 1"
      - from: APPROVED
        to: OPEN
        trigger: "POST /library-network/map/sweeps (automatic when now >= starts_at)"
        actor: system
        preconditions:
          - "BookDrive.status == APPROVED and now >= starts_at"
        side_effects:
          - "increments BookDrive.version by 1"
      - from: OPEN
        to: COLLECTION_CLOSED
        trigger: "POST /library-network/drives/{id}/status with target_status == COLLECTION_CLOSED (manual) or POST /library-network/map/sweeps (automatic when now >= ends_at)"
        actor: "Steward (coordinator) | NetworkAdmin | system"
        preconditions:
          - "BookDrive.status == OPEN (else ERR_INVALID_STATE)"
          - "Steward actor must be the drive coordinator (else ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "increments BookDrive.version by 1"
      - from: COLLECTION_CLOSED
        to: COMPLETED
        trigger: "POST /library-network/drives/{id}/status with target_status == COMPLETED"
        actor: "Steward (coordinator) | NetworkAdmin"
        preconditions:
          - "BookDrive.status == COLLECTION_CLOSED (else ERR_INVALID_STATE)"
          - "Steward actor must be the drive coordinator (else ERR_FORBIDDEN_OWNERSHIP)"
          - "Linked DonationBatch has graded_count == item_count (else ERR_UNGRADED_ITEMS)"
        side_effects:
          - "recomputes collected_count, accepted_count, fulfillment_pct_gross, fulfillment_pct_net, qualifies_for_bonus"
          - "creates RecognitionEvent(DRIVE_COMPLETED, +150 if qualifies_for_bonus else +50) for coordinator_steward_id"
          - "increments school.drives_completed_count by 1"
          - "increments BookDrive.version by 1"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /library-network/drives/{id}/status with target_status == CANCELLED"
        actor: "Steward (coordinator) | NetworkAdmin"
        preconditions:
          - "BookDrive.status in {PROPOSED, APPROVED, OPEN} (else ERR_INVALID_STATE)"
          - "Steward actor must be the drive coordinator (else ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "increments BookDrive.version by 1"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /library-network/drives/{id}/status with target_status == CANCELLED"
        actor: "Steward (coordinator) | NetworkAdmin"
        preconditions:
          - "BookDrive.status in {PROPOSED, APPROVED, OPEN} (else ERR_INVALID_STATE)"
        side_effects:
          - "Linked DonationBatch becomes CLOSED and every BookItem in it with status AVAILABLE becomes RECYCLED"
          - "increments BookDrive.version by 1"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /library-network/drives/{id}/status with target_status == CANCELLED"
        actor: "Steward (coordinator) | NetworkAdmin"
        preconditions:
          - "BookDrive.status in {PROPOSED, APPROVED, OPEN} (else ERR_INVALID_STATE)"
        side_effects:
          - "Same linked-batch cascade as APPROVED -> CANCELLED"
          - "increments BookDrive.version by 1"

  - entity: DonationBatch
    initial_state: RECEIVED
    terminal_states: [CLOSED]
    transitions:
      - from: RECEIVED
        to: SORTED
        trigger: "POST /library-network/batches/{id}/sort-complete"
        actor: "HubCoordinator | NetworkAdmin"
        preconditions:
          - "DonationBatch.status == RECEIVED (else ERR_INVALID_STATE)"
          - "graded_count == item_count (else ERR_UNGRADED_ITEMS)"
        side_effects:
          - "increments DonationBatch.version by 1"
      - from: SORTED
        to: CLOSED
        trigger: "system (automatic bubble-up when every BookItem in the batch reaches a terminal status: PLACED or RECYCLED)"
        actor: system
        preconditions:
          - "All BookItems with batch_id == this batch have status in {PLACED, RECYCLED}"
        side_effects:
          - "increments DonationBatch.version by 1"
      - from: RECEIVED
        to: CLOSED
        trigger: "system (cascade from BookDrive APPROVED/OPEN -> CANCELLED)"
        actor: system
        preconditions: []
        side_effects:
          - "Every BookItem in this batch with status AVAILABLE becomes RECYCLED"
          - "increments DonationBatch.version by 1"

  - entity: BookItem
    initial_state: AVAILABLE
    terminal_states: [RECYCLED]
    transitions:
      - from: AVAILABLE
        to: ALLOCATED
        trigger: "system (during POST /library-network/distribution-runs/{id}/confirm)"
        actor: system
        preconditions: []
        side_effects:
          - "sets box_id to the planned box"
      - from: ALLOCATED
        to: DISPATCHED
        trigger: "system (during POST /library-network/distribution-runs/{id}/dispatch)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DISPATCHED
        to: PLACED
        trigger: "POST /library-network/allocations/{id}/receive"
        actor: "Steward (box owner) | NetworkAdmin"
        preconditions:
          - "Allocation.status == DISPATCHED (else ERR_INVALID_STATE)"
        side_effects:
          - "box.current_stock += 1; box.last_activity_at = now; creates RecognitionEvent(ALLOCATION_PLACED, +5) for the box steward; bubble-up: if every Allocation of the run is terminal (PLACED or CANCELLED), the run becomes COMPLETED"
      - from: ALLOCATED
        to: AVAILABLE
        trigger: "POST /library-network/allocations/{id}/cancel (compensating action)"
        actor: "HubCoordinator | NetworkAdmin"
        preconditions:
          - "Allocation.status in {RESERVED, DISPATCHED} (else ERR_INVALID_STATE)"
        side_effects:
          - "clears box_id to null"
      - from: DISPATCHED
        to: AVAILABLE
        trigger: "POST /library-network/allocations/{id}/cancel (compensating action)"
        actor: "HubCoordinator | NetworkAdmin"
        preconditions:
          - "Allocation.status in {RESERVED, DISPATCHED} (else ERR_INVALID_STATE)"
        side_effects:
          - "clears box_id to null"
      - from: PLACED
        to: QUARANTINED
        trigger: "system (cascade from Complaint resolve/adjudicate UPHELD with matching target_category)"
        actor: system
        preconditions: []
        side_effects:
          - "keeps box_id set (the book is physically still in the box, flagged); the PLACED Allocation is unchanged so box.current_stock is unaffected"
      - from: QUARANTINED
        to: PLACED
        trigger: "system (cascade: the complaint that quarantined this item is adjudicated DISMISSED after escalation)"
        actor: system
        preconditions: []
        side_effects:
          - "keeps box_id set; no stock change (the allocation never left PLACED)"
      - from: QUARANTINED
        to: RECYCLED
        trigger: "system (sweep: item still QUARANTINED 30 days after the upholding decision's upheld_at; or cascade from LibraryBox decommission)"
        actor: system
        preconditions:
          - "sweep path: now - complaint.upheld_at >= 30 days"
        side_effects:
          - "clears box_id to null; the item's PLACED Allocation becomes REMOVED and box.current_stock decrements by 1"
      - from: AVAILABLE
        to: RECYCLED
        trigger: "system (cascade from BookDrive cancellation closing the linked batch)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PLACED
        to: RECYCLED
        trigger: "system (cascade from LibraryBox decommission)"
        actor: system
        preconditions: []
        side_effects:
          - "clears box_id to null"

  - entity: DistributionRun
    initial_state: DRAFT
    terminal_states: [COMPLETED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /library-network/distribution-runs/{id}/confirm"
        actor: "HubCoordinator | NetworkAdmin"
        preconditions:
          - "DistributionRun.status == DRAFT (else ERR_INVALID_STATE)"
          - "Every box in plan_snapshot still satisfies: charter_status == ACTIVE and listing_posture == LISTED and (capacity_books - current_stock) >= planned quantity (else ERR_PLAN_STALE)"
          - "The batch still holds enough AVAILABLE graded items to cover planned_item_count (else ERR_PLAN_STALE)"
        side_effects:
          - "Creates one Allocation (status RESERVED) per planned item: boxes are consumed in plan_snapshot order (need_score DESC, box.created_at ASC); items are drawn from the batch's AVAILABLE graded pool in created_at ASC order"
          - "Each drawn BookItem becomes ALLOCATED with box_id set"
          - "increments DistributionRun.version by 1"
      - from: CONFIRMED
        to: DISPATCHED
        trigger: "POST /library-network/distribution-runs/{id}/dispatch"
        actor: "HubCoordinator | NetworkAdmin"
        preconditions:
          - "DistributionRun.status == CONFIRMED (else ERR_INVALID_STATE)"
        side_effects:
          - "Every Allocation with status RESERVED becomes DISPATCHED; every BookItem ALLOCATED becomes DISPATCHED"
          - "increments DistributionRun.version by 1"
      - from: DISPATCHED
        to: COMPLETED
        trigger: "system (bubble-up: last non-terminal Allocation reaches PLACED or CANCELLED)"
        actor: system
        preconditions:
          - "Every Allocation of the run has status in {PLACED, CANCELLED}"
        side_effects:
          - "increments DistributionRun.version by 1"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "system (bubble-up: all allocations CANCELLED before dispatch)"
        actor: system
        preconditions:
          - "Every Allocation of the run has status in {PLACED, CANCELLED}"
        side_effects:
          - "increments DistributionRun.version by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /library-network/batches/{id}/distribution-runs (creating a newer run for the same batch)"
        actor: system
        preconditions: []
        side_effects:
          - "increments DistributionRun.version by 1"

  - entity: Allocation
    initial_state: RESERVED
    terminal_states: [PLACED, CANCELLED, REMOVED]
    transitions:
      - from: RESERVED
        to: DISPATCHED
        trigger: "system (during run dispatch)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DISPATCHED
        to: PLACED
        trigger: "POST /library-network/allocations/{id}/receive"
        actor: "Steward (box owner) | NetworkAdmin"
        preconditions:
          - "Allocation.status == DISPATCHED (else ERR_INVALID_STATE)"
          - "Steward actor must own the destination box and that steward.status == ACTIVE (else ERR_FORBIDDEN_OWNERSHIP / ERR_STEWARD_NOT_ACTIVE)"
        side_effects:
          - "sets placed_at; BookItem -> PLACED; box.current_stock += 1; box.last_activity_at = now; RecognitionEvent(ALLOCATION_PLACED, +5) to box steward; run bubble-up check; box listing_posture recompute (days_since_activity resets)"
          - "increments Allocation.version by 1"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /library-network/allocations/{id}/cancel"
        actor: "HubCoordinator | NetworkAdmin"
        preconditions:
          - "Allocation.status in {RESERVED, DISPATCHED} (else ERR_INVALID_STATE)"
        side_effects:
          - "BookItem -> AVAILABLE, box_id cleared; run bubble-up check"
          - "increments Allocation.version by 1"
      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /library-network/allocations/{id}/cancel"
        actor: "HubCoordinator | NetworkAdmin"
        preconditions:
          - "Allocation.status in {RESERVED, DISPATCHED} (else ERR_INVALID_STATE)"
        side_effects:
          - "BookItem -> AVAILABLE, box_id cleared; run bubble-up check"
          - "increments Allocation.version by 1"
      - from: PLACED
        to: REMOVED
        trigger: "system (cascade from LibraryBox decommission, or from sweep recycling of the allocation's QUARANTINED BookItem)"
        actor: system
        preconditions: []
        side_effects:
          - "BookItem -> RECYCLED (from PLACED or QUARANTINED); box.current_stock -= 1"
          - "increments Allocation.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: distribution-run-create-stale-batch
    parent_entity: DonationBatch
    write_endpoint: "POST /library-network/batches/{id}/distribution-runs"
    occ_field: expected_batch_version
    description: |
      Creating a DistributionRun against a DonationBatch whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just created a run for the same batch
      (which legitimately supersedes the prior DRAFT run under the
      selector-policy contract) and the current writer's view of the batch is
      therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: steward-profile-patch-stale
    parent_entity: Steward
    write_endpoint: "PATCH /library-network/stewards/{id}"
    occ_field: expected_steward_version
    description: |
      Updating a Steward profile with an expected_steward_version that does
      not match the steward's current version is rejected. This captures the
      case where the client's view of the steward is stale because another
      write (profile patch, status transition, or cascaded recognition/level
      recompute) has already advanced the version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: box_listing_posture
    trigger: "Recomputed on: complaint resolve/adjudicate UPHELD, maintenance triage (REPORTED/REOPENED -> SCHEDULED), maintenance resolve, maintenance reopen, maintenance WONT_FIX, inspection created, allocation placed, box activation, box reactivation, and every map sweep"
    algorithm: threshold
    formula: |
      Let:
        crit = count of MaintenanceRequests with box_id == box.id, severity == CRITICAL, status in {SCHEDULED, REOPENED}
               (REPORTED requests have severity null and never count; RESOLVED and WONT_FIX never count)
        high = count of MaintenanceRequests with box_id == box.id, severity == HIGH, status in {SCHEDULED, REOPENED}
        upheld90 = count of Complaints with box_id == box.id, status in {RESOLVED_UPHELD, ADJUDICATED_UPHELD}, upheld_at in the CLOSED interval [now - 90 days, now]
        stale = days_since_activity (null treated as 0 for pre-activation boxes, which are UNLISTED anyway)
      Decision (evaluate in this exact precedence order):
        1. If charter_status in {DRAFT, CHARTERED}: posture = UNLISTED
        2. Elif charter_status in {SUSPENDED, DECOMMISSIONED}: posture = DELISTED
        3. Elif crit >= 1 or upheld90 >= 3 or stale >= 180: posture = DELISTED
        4. Elif upheld90 >= 1 or high >= 1 or stale >= 120: posture = FLAGGED
        5. Else: posture = LISTED
      The recomputation writes box.open_critical_maintenance_count = crit,
      box.open_high_maintenance_count = high, box.upheld_complaints_90d = upheld90,
      box.days_since_activity = stale, then applies the decision above.
    input_set: "MaintenanceRequests of the box (open states {SCHEDULED, REOPENED} only), Complaints of the box (upheld terminal states only, closed 90-day window on upheld_at), InspectionRecords (via last_activity_at), Allocation PLACED events (via last_activity_at)"
    constants:
      CRIT_DELIST_THRESHOLD: 1
      UPHELD_DELIST_THRESHOLD: 3
      UPHELD_FLAG_THRESHOLD: 1
      HIGH_FLAG_THRESHOLD: 1
      STALE_DELIST_DAYS: 180
      STALE_FLAG_DAYS: 120
      UPHELD_WINDOW_DAYS: 90
    precision: "integer counts; day arithmetic uses floor on second differences"

  - name: recognition_points
    trigger: "Computed deterministically from the RecognitionEvent log and the current logical clock on every steward read, whenever a RecognitionEvent is inserted for the steward (maintenance resolved, allocation placed, drive completed, complaint upheld, training passed), and whenever a map sweep advances the epoch (rolling window membership changes as time passes)"
    algorithm: aggregation
    formula: |
      lifetime_points = max(0, sum(points_delta over ALL RecognitionEvents with steward_id == steward.id))
      rolling_points  = max(0, sum(points_delta over RecognitionEvents with steward_id == steward.id
                                   and created_at in the CLOSED interval [now - 365 days, now]))
      Each variant floors independently at 0.
    input_set: "RecognitionEvents of the steward; the rolling variant filters by created_at against the logical clock; no status filter exists because RecognitionEvent is append-only and immutable"
    constants:
      WINDOW_DAYS: 365
      FLOOR: 0
    precision: "integer points"
    variants:
      - name: lifetime
        when: "Displayed as lifetime_points; used for nothing else"
        difference: "No time window: counts every event since steward registration"
      - name: rolling
        when: "Displayed as rolling_points; the ONLY input to recognition_tier and to the box-capacity limit"
        difference: "Counts only events with created_at >= now - 365 days; events ageing out of the window reduce rolling_points at sweep time even though lifetime_points is unchanged"

  - name: recognition_tier
    trigger: "Recomputed in the same pass as recognition_points"
    algorithm: threshold
    formula: |
      rolling = recognition_points (rolling variant, after floor)
      if rolling >= 1000: tier = PLATINUM
      elif rolling >= 600: tier = GOLD
      elif rolling >= 300: tier = SILVER
      elif rolling >= 100: tier = BRONZE
      else: tier = NONE
      Boundaries are INCLUSIVE (>=): exactly 100 is BRONZE, exactly 99 is NONE.
    input_set: "Steward.rolling_points"
    constants:
      BRONZE_MIN: 100
      SILVER_MIN: 300
      GOLD_MIN: 600
      PLATINUM_MIN: 1000
    precision: "integer comparison"

  - name: box_capacity_limit
    trigger: "Evaluated on POST /library-network/boxes"
    algorithm: threshold
    formula: |
      limit(tier) = NONE or BRONZE -> 1; SILVER -> 2; GOLD -> 3; PLATINUM -> 5
      current = count of LibraryBoxes with steward_id == steward.id and charter_status in {DRAFT, CHARTERED, ACTIVE, SUSPENDED}   -- DECOMMISSIONED boxes do not count
      Reject with ERR_BOX_LIMIT_REACHED when current >= limit(recognition_tier).
      Boundary is inclusive-of-limit: a steward at exactly the limit cannot create another box (current == limit rejects).
    input_set: "Boxes of the steward in non-terminal charter states"
    constants:
      LIMIT_NONE_BRONZE: 1
      LIMIT_SILVER: 2
      LIMIT_GOLD: 3
      LIMIT_PLATINUM: 5

  - name: need_score
    trigger: "Evaluated on POST /library-network/batches/{id}/distribution-runs to build DistributionRun.plan_snapshot"
    algorithm: weighted_scoring
    formula: |
      Eligible boxes E = { boxes b : b.charter_status == ACTIVE and b.listing_posture == LISTED
                           and (b.capacity_books - b.current_stock) > 0 }.
      For each b in E:
        capacity_remaining(b) = b.capacity_books - b.current_stock
        staleness(b) = min(b.days_since_activity, 60)        -- days_since_activity is never null for ACTIVE boxes (installed_at set)
        region_bonus(b) = 20 if b.region_code == batch.region_code else 0
        need_score(b) = min(capacity_remaining(b), 10) * 2 + staleness(b) + region_bonus(b)
      Ranking: sort by need_score DESC; ties broken by box.created_at ASC (earlier-created box first). Box ids MUST NOT participate in ranking.
      Allocation quantity per box, consumed in ranked order:
        qty(b) = min(capacity_remaining(b), 10, remaining_items)
      where remaining_items = (count of AVAILABLE BookItems in the batch with condition_grade != null) minus quantities already assigned to earlier-ranked boxes.
      A box is dropped from the plan when qty(b) == 0.
      If the plan is empty (E empty or no AVAILABLE graded items): reject ERR_NO_ELIGIBLE_BOXES.
    input_set: "All LibraryBoxes (filtered as above); the batch's AVAILABLE graded BookItems"
    constants:
      PER_BOX_QTY_CAP: 10
      STALENESS_CAP_DAYS: 60
      REGION_MATCH_BONUS: 20
      NEED_PER_BOOK: 2
    precision: "integer score"

  - name: parts_reimbursement
    trigger: "Evaluated on POST /library-network/maintenance-requests/{id}/resolve when outcome == RESOLVED"
    algorithm: aggregation
    formula: |
      parts_subtotal = sum over each parts line of round_half_up(qty * unit_cost_cents * 0.8)
        -- ROUNDING ORDER IS PINNED: round each line to whole cents FIRST (round_half_up), THEN sum the rounded lines.
        -- The alternative order (sum raw line products, then round once) yields different cents and is FORBIDDEN.
      labor = round_half_up(labor_hours * 500)
      reimbursement_cents = min(parts_subtotal + labor, 15000)
      parts defaults to [] and labor_hours defaults to 0 when omitted.
    input_set: "The resolve request's parts array and labor_hours"
    constants:
      PARTS_RATE: 0.8
      LABOR_RATE_CENTS_PER_HOUR: 500
      MAX_REIMBURSEMENT_CENTS: 15000
    precision: "whole cents; round_half_up per line before summation"

  - name: repair_sla_deadline
    trigger: "Evaluated on POST /library-network/maintenance-requests/{id}/triage"
    algorithm: threshold
    formula: |
      season = WINTER if month(created_at) in {12, 1, 2}; SPRING if in {3, 4, 5}; SUMMER if in {6, 7, 8}; FALL if in {9, 10, 11}  (UTC months of the logical clock)
      season_multiplier = 2.0 if season == WINTER else 1.0
      base_hours = {LOW: 336, MEDIUM: 168, HIGH: 72, CRITICAL: 24}[severity]
      sla_deadline_at = triaged_at + base_hours * season_multiplier hours
      At resolve time: sla_breached = (resolved_at > sla_deadline_at)  -- strict >; resolving exactly AT the deadline is NOT a breach
    input_set: "The maintenance request's created_at, severity, triaged_at"
    constants:
      SLA_LOW_HOURS: 336
      SLA_MEDIUM_HOURS: 168
      SLA_HIGH_HOURS: 72
      SLA_CRITICAL_HOURS: 24
      WINTER_MULTIPLIER: 2.0
      DEFAULT_MULTIPLIER: 1.0
    precision: "whole hours; timestamp arithmetic exact to the second"

  - name: drive_fulfillment
    trigger: "Recomputed on every item intake into the drive's linked batch, on quarantine/recycle of the batch's items, and at drive completion"
    algorithm: aggregation
    formula: |
      collected_count = count of ALL BookItems in the linked DonationBatch (any status)
      accepted_count  = count of BookItems in the linked batch with status in {AVAILABLE, ALLOCATED, DISPATCHED, PLACED}
      fulfillment_pct_gross = floor(collected_count * 100 / goal_books)
      fulfillment_pct_net   = floor(accepted_count * 100 / goal_books)
      qualifies_for_bonus = (fulfillment_pct_net >= 80)   -- inclusive boundary
    input_set: "BookItems of the drive's linked DonationBatch"
    constants:
      BONUS_THRESHOLD_PCT: 80
    precision: "integer percent, floor division"
    variants:
      - name: gross
        when: "Public map display and drive detail reads (fulfillment_pct_gross)"
        difference: "Counts every collected item including QUARANTINED and RECYCLED; a recycled item RAISES gross but not net"
      - name: net
        when: "Bonus qualification and the RecognitionEvent points_delta decision at drive completion (+150 vs +50)"
        difference: "Excludes QUARANTINED and RECYCLED items; identical inputs produce a strictly smaller-or-equal percentage"

  - name: training_level
    trigger: "Recomputed whenever a TrainingCompletion with result == PASSED is created for the steward"
    algorithm: aggregation
    formula: |
      training_level = count of DISTINCT module_id over TrainingCompletions with steward_id == steward.id and result == PASSED
      result = PASSED iff score >= 80 (inclusive boundary; 79 fails)
    input_set: "TrainingCompletions of the steward"
    constants:
      PASS_SCORE: 80
    precision: "integer"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers must be present; X-User-Role must be a declared role. Endpoints whose roles list includes Anonymous MAY be called without headers (treated as Anonymous). SchoolLiaison calls must present X-User-ID equal to an existing School.id (else ERR_UNAUTHENTICATED)."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The presented role must be listed in the endpoint's roles. Where a shared transition endpoint restricts specific transitions to a subset of its roles (POST /library-network/boxes/{id}/status: only NetworkAdmin may request CHARTERED, SUSPENDED, or DECOMMISSIONED targets; the Steward role may only request ACTIVE on an own, SUSPENDED box), a disallowed role/transition combination is rejected with ERR_UNAUTHORIZED_ROLE. Ownership: entity-backed roles must own the target resource — a Steward may only act on their own profile, boxes, drives (as coordinator), and their boxes' complaints/allocations/maintenance; a SchoolLiaison's X-User-ID must equal the drive's school_id. Violations are rejected with ERR_FORBIDDEN_OWNERSHIP."
    error_id: "ERR_UNAUTHORIZED_ROLE | ERR_FORBIDDEN_OWNERSHIP"
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path resource ids must exist, validated left-to-right; each segment's entity-specific not-found error is returned."
    error_id: "ERR_STEWARD_NOT_FOUND | ERR_BOX_NOT_FOUND | ERR_SCHOOL_NOT_FOUND | ERR_DRIVE_NOT_FOUND | ERR_BATCH_NOT_FOUND | ERR_RUN_NOT_FOUND | ERR_ALLOCATION_NOT_FOUND | ERR_MAINTENANCE_NOT_FOUND | ERR_COMPLAINT_NOT_FOUND | ERR_MODULE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 4
    category: business_referential
    check: "Body-referenced entities must exist and be linkable: drives.school_id; batches.drive_id (when source_type == BOOK_DRIVE, required; otherwise forbidden: ERR_DRIVE_LINK_FORBIDDEN); maintenance/complaints box_id; training-completions.module_id; modules.prerequisite_module_id; boxes.steward_id."
    error_id: "ERR_DRIVE_LINK_REQUIRED | ERR_DRIVE_LINK_FORBIDDEN | ERR_SCHOOL_NOT_FOUND | ERR_DRIVE_NOT_FOUND | ERR_BOX_NOT_FOUND | ERR_MODULE_NOT_FOUND | ERR_STEWARD_NOT_FOUND"
    http_status: 422
    applies_to: "POST endpoints with body FKs"

  - priority: 5
    category: state
    check: "Target entity must be in the exact from-state required by the transition (per §1.2 preconditions): steward transitions; box transitions; batch must be RECEIVED for item intake / SORTED for run creation; drive must be OPEN for item intake into its linked batch (ERR_DRIVE_NOT_OPEN); run DRAFT for confirm / CONFIRMED for dispatch; allocation DISPATCHED for receive; complaint states per triage/respond/resolve/escalate/adjudicate; maintenance states per triage/resolve/reopen."
    error_id: "ERR_INVALID_STATE | ERR_DRIVE_NOT_OPEN"
    http_status: 409
    applies_to: "all state-transition endpoints, POST /library-network/batches/{id}/items, POST /library-network/batches/{id}/distribution-runs"

  - priority: 6
    category: state
    check: "Cross-entity state gates: box create/charter/activate and allocation receive require the steward ACTIVE (ERR_STEWARD_NOT_ACTIVE); box activation/reactivation require a qualifying CONFIRMED inspection (ERR_INSPECTION_REQUIRED); steward activation requires a PASSED ORIENTATION completion (ERR_ORIENTATION_REQUIRED); drive-linked batch creation requires the drive status in {APPROVED, OPEN} (ERR_DRIVE_NOT_APPROVED); BOOK_DRIVE intake requires the school link consistent."
    error_id: "ERR_STEWARD_NOT_ACTIVE | ERR_INSPECTION_REQUIRED | ERR_ORIENTATION_REQUIRED | ERR_DRIVE_NOT_APPROVED"
    http_status: 409
    applies_to: "box/steward/allocation/batch endpoints as listed"

  - priority: 7
    category: business_safety
    check: "Content policy: items added to a BOOK_DRIVE-linked batch whose category is in the school's restricted_categories are rejected per item (ERR_CONTENT_POLICY_VIOLATION). Complaint segregation: resolver != triager; adjudicator != triager and != resolver (ERR_SEGREGATION_OF_DUTIES)."
    error_id: "ERR_CONTENT_POLICY_VIOLATION | ERR_SEGREGATION_OF_DUTIES"
    http_status: 422
    applies_to: "POST /library-network/batches/{id}/items; POST /library-network/complaints/{id}/resolve; POST /library-network/complaints/{id}/adjudicate"
    note: "ERR_SEGREGATION_OF_DUTIES is returned with http 403 (see errors table); the safety category outranks temporal and constraint checks regardless of status code."

  - priority: 8
    category: business_temporal
    check: "Temporal rules: drive-linked item intake requires now < drive.ends_at (ERR_DRIVE_WINDOW_CLOSED); drive creation requires starts_at < ends_at (ERR_DRIVE_WINDOW_INVALID) and no half-open overlap with another non-terminal drive of the same school (ERR_DRIVE_WINDOW_OVERLAP); maintenance triage requires scheduled_date >= current logical date (ERR_SCHEDULE_DATE_PAST); maintenance reopen requires now - resolved_at < 14 days (ERR_REOPEN_WINDOW_EXPIRED); a CONFIRMED inspection requires >= 30 days since the box's previous CONFIRMED inspection (ERR_INSPECTION_TOO_SOON)."
    error_id: "ERR_DRIVE_WINDOW_CLOSED | ERR_DRIVE_WINDOW_INVALID | ERR_DRIVE_WINDOW_OVERLAP | ERR_SCHEDULE_DATE_PAST | ERR_REOPEN_WINDOW_EXPIRED | ERR_INSPECTION_TOO_SOON"
    http_status: 422
    applies_to: "drives, maintenance, inspections, batch item intake"

  - priority: 9
    category: business_constraint
    check: "Constraint rules: box creation requires the steward below box_capacity_limit (ERR_BOX_LIMIT_REACHED); distribution-run creation requires a non-empty selector plan (ERR_NO_ELIGIBLE_BOXES); sort-complete and drive completion require all items graded (ERR_UNGRADED_ITEMS); a second PASSED completion for the same module is rejected (ERR_MODULE_ALREADY_PASSED); a completion whose module is inactive or whose prerequisite chain is not fully PASSED is rejected (ERR_MODULE_INACTIVE / ERR_PREREQUISITE_NOT_MET); a module prerequisite that would create a cycle is rejected (ERR_MODULE_CYCLE); emails unique per steward (ERR_EMAIL_TAKEN); complaint filing requires the box in charter_status ACTIVE or SUSPENDED (ERR_BOX_NOT_PUBLIC); run confirm re-validates the plan (ERR_PLAN_STALE)."
    error_id: "ERR_BOX_LIMIT_REACHED | ERR_NO_ELIGIBLE_BOXES | ERR_UNGRADED_ITEMS | ERR_MODULE_ALREADY_PASSED | ERR_MODULE_INACTIVE | ERR_PREREQUISITE_NOT_MET | ERR_MODULE_CYCLE | ERR_EMAIL_TAKEN | ERR_BOX_NOT_PUBLIC | ERR_PLAN_STALE"
    http_status: 422
    applies_to: "as listed per rule"

  - priority: 10
    category: business_constraint
    check: "OCC: expected_batch_version must equal the batch's current version (ERR_STALE_VERSION, 412); expected_steward_version must equal the steward's current version (ERR_STALE_VERSION, 412)."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /library-network/batches/{id}/distribution-runs; PATCH /library-network/stewards/{id}"

  - priority: 11
    category: business_constraint
    check: "Schema and field validation: required fields present (per §1.5 input lists), enum members valid, integers in range (score 0..100, capacity_books >= 1, goal_books >= 1, latitude/longitude in range, qty >= 1, unit_cost_cents >= 0, labor_hours >= 0)."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# =============================================================================
# §1.5 API Endpoint Table (66 endpoints)
# =============================================================================
endpoints:
  # --- Steward lifecycle ---
  - method: POST
    path: "/library-network/stewards"
    description: "Register a new steward (status APPLIED)"
    roles: [Anonymous, NetworkAdmin]
    code: 201
    input: [full_name, email, region_code]
    output: Steward
    side_effects: ["status APPLIED; computed counters initialized to 0"]

  - method: GET
    path: "/library-network/stewards/{id}"
    description: "Get a steward (includes computed recognition fields and version)"
    roles: [Steward, HubCoordinator, Moderator, NetworkAdmin]
    code: 200
    input: []
    output: Steward
    side_effects: []

  - method: GET
    path: "/library-network/stewards"
    description: "List stewards with pagination and filters"
    roles: [Steward, HubCoordinator, Moderator, NetworkAdmin]
    code: 200
    input: ["status?", "tier?", "region_code?", "limit?", "offset?"]
    output: "Steward[]"
    side_effects: []

  - method: PATCH
    path: "/library-network/stewards/{id}"
    description: "Update steward profile with optimistic concurrency"
    roles: [Steward, NetworkAdmin]
    code: 200
    input: ["full_name?", "region_code?", "expected_steward_version"]
    output: Steward
    side_effects: ["increments Steward.version by 1", "Steward actor must be the steward themself (ERR_FORBIDDEN_OWNERSHIP)"]

  - method: POST
    path: "/library-network/stewards/{id}/activate"
    description: "Activate an APPLIED steward (requires PASSED ORIENTATION)"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: Steward
    side_effects: ["status APPLIED -> ACTIVE; increments Steward.version by 1"]

  - method: POST
    path: "/library-network/stewards/{id}/suspend"
    description: "Suspend an ACTIVE steward"
    roles: [Moderator, NetworkAdmin]
    code: 200
    input: []
    output: Steward
    side_effects: ["status ACTIVE -> SUSPENDED; sets suspended_at; increments Steward.version by 1"]

  - method: POST
    path: "/library-network/stewards/{id}/reinstate"
    description: "Reinstate a SUSPENDED steward"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: Steward
    side_effects: ["status SUSPENDED -> ACTIVE; clears suspended_at; increments Steward.version by 1"]

  - method: POST
    path: "/library-network/stewards/{id}/retire"
    description: "Retire a steward (terminal)"
    roles: [Steward, NetworkAdmin]
    code: 200
    input: []
    output: Steward
    side_effects: ["status -> RETIRED; increments Steward.version by 1; Steward actor must be self (ERR_FORBIDDEN_OWNERSHIP)"]

  # --- Training ---
  - method: POST
    path: "/library-network/training-modules"
    description: "Create a training module; prerequisite graph must stay acyclic"
    roles: [NetworkAdmin]
    code: 201
    input: [code, title, level, "prerequisite_module_id?", "active?"]
    output: TrainingModule
    side_effects: []

  - method: GET
    path: "/library-network/training-modules"
    description: "List training modules (filter by prerequisite or active flag)"
    roles: [Steward, HubCoordinator, Moderator, NetworkAdmin]
    code: 200
    input: ["prerequisite_module_id?", "active?", "limit?", "offset?"]
    output: "TrainingModule[]"
    side_effects: []

  - method: GET
    path: "/library-network/training-modules/{id}"
    description: "Get a single training module"
    roles: [Steward, HubCoordinator, Moderator, NetworkAdmin]
    code: 200
    input: []
    output: TrainingModule
    side_effects: []

  - method: PATCH
    path: "/library-network/training-modules/{id}"
    description: "Update a module's prerequisite or active flag; the resulting prerequisite graph must remain acyclic (ERR_MODULE_CYCLE)"
    roles: [NetworkAdmin]
    code: 200
    input: ["prerequisite_module_id?", "active?"]
    output: TrainingModule
    side_effects: ["increments TrainingModule.version by 1"]

  - method: POST
    path: "/library-network/stewards/{id}/training-completions"
    description: "Record a module completion for a steward (score >= 80 passes)"
    roles: [Steward, NetworkAdmin]
    code: 201
    input: [module_id, score]
    output: TrainingCompletion
    side_effects: ["if PASSED: increments Steward.training_level by 1 (distinct modules only), creates RecognitionEvent(TRAINING_PASSED, +25), recomputes recognition points/tier", "Steward actor must be self (ERR_FORBIDDEN_OWNERSHIP)"]

  - method: GET
    path: "/library-network/training-completions"
    description: "List training completions (filtered by steward and/or module)"
    roles: [Steward, HubCoordinator, Moderator, NetworkAdmin]
    code: 200
    input: ["steward_id?", "module_id?", "result?", "limit?", "offset?"]
    output: "TrainingCompletion[]"
    side_effects: []

  - method: GET
    path: "/library-network/training-completions/{id}"
    description: "Get a single training completion record"
    roles: [Steward, HubCoordinator, Moderator, NetworkAdmin]
    code: 200
    input: []
    output: TrainingCompletion
    side_effects: []

  # --- Boxes ---
  - method: POST
    path: "/library-network/boxes"
    description: "Propose a new library box (DRAFT/UNLISTED)"
    roles: [Steward, NetworkAdmin]
    code: 201
    input: [steward_id, name, latitude, longitude, capacity_books, region_code]
    output: LibraryBox
    side_effects: ["enforces box_capacity_limit via recognition_tier", "Steward actor: steward_id must equal X-User-ID (ERR_FORBIDDEN_OWNERSHIP)"]

  - method: GET
    path: "/library-network/boxes/{id}"
    description: "Get a box (public map read; includes posture component counters)"
    roles: [Anonymous, Steward, HubCoordinator, Moderator, NetworkAdmin]
    code: 200
    input: []
    output: LibraryBox
    side_effects: []

  - method: GET
    path: "/library-network/boxes"
    description: "List boxes (public map listing) with filters"
    roles: [Anonymous, Steward, HubCoordinator, Moderator, NetworkAdmin]
    code: 200
    input: ["steward_id?", "charter_status?", "listing_posture?", "region_code?", "limit?", "offset?"]
    output: "LibraryBox[]"
    side_effects: []

  - method: POST
    path: "/library-network/boxes/{id}/status"
    description: "Charter status transition endpoint; target_status in {CHARTERED, ACTIVE, SUSPENDED, DECOMMISSIONED}"
    roles: [Steward, NetworkAdmin]
    code: 200
    input: [target_status]
    output: LibraryBox
    side_effects: ["per §1.2 LibraryBox machine: charter mints charter_number; activation sets installed_at/last_activity_at and posture LISTED; decommission cascades allocations/items; reactivation clears suspended_at", "increments LibraryBox.version by 1"]

  - method: POST
    path: "/library-network/boxes/{id}/inspections"
    description: "Record a box inspection (map accuracy); CONFIRMED refreshes activity, NOT_FOUND suspends the box, FAILED_CONDITION spawns a maintenance request"
    roles: [Moderator, NetworkAdmin]
    code: 201
    input: [result, "notes?"]
    output: InspectionRecord
    side_effects:
      - "precondition: box.charter_status in {CHARTERED, ACTIVE, SUSPENDED} (else ERR_INVALID_STATE) — a CHARTERED box needs its first CONFIRMED inspection here before activation"
      - "CONFIRMED: sets box.last_activity_at = now (subject to ERR_INSPECTION_TOO_SOON) and recomputes posture"
      - "NOT_FOUND: if charter_status == ACTIVE, box.charter_status ACTIVE -> SUSPENDED (suspended_at set) and posture DELISTED; if CHARTERED or SUSPENDED, the record is stored with no charter change"
      - "FAILED_CONDITION: creates MaintenanceRequest(box_id == this box, category WEAR, status REPORTED, severity null)"

  - method: GET
    path: "/library-network/boxes/{id}/inspections"
    description: "List inspection records for a box"
    roles: [Steward, HubCoordinator, Moderator, NetworkAdmin]
    code: 200
    input: ["result?", "limit?", "offset?"]
    output: "InspectionRecord[]"
    side_effects: []

  # --- Book items ---
  - method: GET
    path: "/library-network/book-items"
    description: "List book items filtered by batch, box, status, category; sorted by created_at ASC"
    roles: [Steward, HubCoordinator, Moderator, NetworkAdmin]
    code: 200
    input: ["batch_id?", "box_id?", "status?", "category?", "limit?", "offset?"]
    output: "BookItem[]"
    side_effects: []

  - method: GET
    path: "/library-network/book-items/{id}"
    description: "Get a single book item"
    roles: [Steward, HubCoordinator, Moderator, NetworkAdmin]
    code: 200
    input: []
    output: BookItem
    side_effects: []

  - method: PATCH
    path: "/library-network/book-items/{id}"
    description: "Grade an ungraded book item during sorting; only allowed while the item is AVAILABLE and its batch is still RECEIVED"
    roles: [HubCoordinator, NetworkAdmin]
    code: 200
    input: [condition_grade]
    output: BookItem
    side_effects: ["sets condition_grade; batch graded_count recomputes", "precondition: item status == AVAILABLE and batch status == RECEIVED (else ERR_INVALID_STATE)", "increments BookItem.version by 1"]

  # --- Maintenance ---
  - method: POST
    path: "/library-network/maintenance-requests"
    description: "Report box damage or wear (public); covers construction/installation defects on not-yet-active boxes"
    roles: [Anonymous, Steward, Moderator, NetworkAdmin]
    code: 201
    input: [box_id, category, description]
    output: MaintenanceRequest
    side_effects: ["status REPORTED; severity null; season_at_report and season_multiplier computed from logical clock", "precondition: box charter_status in {CHARTERED, ACTIVE, SUSPENDED} (else ERR_BOX_NOT_PUBLIC for DRAFT or DECOMMISSIONED boxes)"]

  - method: GET
    path: "/library-network/maintenance-requests/{id}"
    description: "Get a maintenance request (includes sla_deadline_at, reimbursement, sla_breached)"
    roles: [Steward, HubCoordinator, Moderator, NetworkAdmin]
    code: 200
    input: []
    output: MaintenanceRequest
    side_effects: []

  - method: GET
    path: "/library-network/maintenance-requests"
    description: "List maintenance requests with filters"
    roles: [Steward, HubCoordinator, Moderator, NetworkAdmin]
    code: 200
    input: ["box_id?", "status?", "severity?", "limit?", "offset?"]
    output: "MaintenanceRequest[]"
    side_effects: []

  - method: POST
    path: "/library-network/maintenance-requests/{id}/triage"
    description: "Triage a reported or reopened request: set severity and schedule; computes seasonal SLA"
    roles: [Moderator, NetworkAdmin]
    code: 200
    input: [severity, scheduled_date]
    output: MaintenanceRequest
    side_effects: ["REPORTED/REOPENED -> SCHEDULED; computes sla_deadline_at via repair_sla_deadline; recomputes box posture counters", "increments MaintenanceRequest.version by 1"]

  - method: POST
    path: "/library-network/maintenance-requests/{id}/resolve"
    description: "Resolve (compute reimbursement, recognition, breach flag) or mark WONT_FIX"
    roles: [Moderator, NetworkAdmin]
    code: 200
    input: [outcome, "parts?", "labor_hours?", "resolution_notes?"]
    output: MaintenanceRequest
    side_effects: ["outcome RESOLVED: SCHEDULED -> RESOLVED with parts_reimbursement, sla_breached, RecognitionEvent(+40), box activity refresh, posture recompute", "outcome WONT_FIX: REPORTED/SCHEDULED -> WONT_FIX", "increments MaintenanceRequest.version by 1"]

  - method: POST
    path: "/library-network/maintenance-requests/{id}/reopen"
    description: "Reopen a resolved request within 14 days (revision loop)"
    roles: [Steward, NetworkAdmin]
    code: 200
    input: []
    output: MaintenanceRequest
    side_effects: ["RESOLVED -> REOPENED; resets reimbursement_cents to null; posture recompute", "increments MaintenanceRequest.version by 1", "Steward actor must own the box (ERR_FORBIDDEN_OWNERSHIP)"]

  # --- Complaints ---
  - method: POST
    path: "/library-network/complaints"
    description: "File a community complaint about a box (public)"
    roles: [Anonymous, Steward, Moderator, NetworkAdmin]
    code: 201
    input: [box_id, category, description, "target_category?", "evidence_url?"]
    output: Complaint
    side_effects: ["status FILED; requires box charter_status in {ACTIVE, SUSPENDED} (ERR_BOX_NOT_PUBLIC)"]

  - method: GET
    path: "/library-network/complaints/{id}"
    description: "Get a complaint"
    roles: [Steward, HubCoordinator, Moderator, NetworkAdmin]
    code: 200
    input: []
    output: Complaint
    side_effects: []

  - method: GET
    path: "/library-network/complaints"
    description: "List complaints with filters"
    roles: [Steward, HubCoordinator, Moderator, NetworkAdmin]
    code: 200
    input: ["box_id?", "status?", "category?", "limit?", "offset?"]
    output: "Complaint[]"
    side_effects: []

  - method: POST
    path: "/library-network/complaints/{id}/triage"
    description: "Triage a filed complaint; starts the 72h steward response window"
    roles: [Moderator, NetworkAdmin]
    code: 200
    input: []
    output: Complaint
    side_effects: ["FILED -> STEWARD_RESPONSE_PENDING; records triaged_by_user_id; sets response_due_at = now + 72h", "increments Complaint.version by 1"]

  - method: POST
    path: "/library-network/complaints/{id}/respond"
    description: "Steward responds to a triaged complaint"
    roles: [Steward]
    code: 200
    input: [response_text]
    output: Complaint
    side_effects: ["STEWARD_RESPONSE_PENDING -> UNDER_REVIEW; stores response_text", "increments Complaint.version by 1", "actor must own the complained box (ERR_FORBIDDEN_OWNERSHIP)"]

  - method: POST
    path: "/library-network/complaints/{id}/resolve"
    description: "Resolve an UNDER_REVIEW complaint (UPHELD or DISMISSED); resolver must differ from triager"
    roles: [Moderator, NetworkAdmin]
    code: 200
    input: [outcome, "resolution_notes?"]
    output: Complaint
    side_effects: ["UNDER_REVIEW -> RESOLVED_UPHELD | RESOLVED_DISMISSED", "UPHELD: RecognitionEvent(-60), strike_count +1, target-category quarantine cascade, posture recompute", "increments Complaint.version by 1"]

  - method: POST
    path: "/library-network/complaints/{id}/escalate"
    description: "Escalate a dismissed complaint to network adjudication"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: Complaint
    side_effects: ["RESOLVED_DISMISSED -> ESCALATED", "increments Complaint.version by 1"]

  - method: POST
    path: "/library-network/complaints/{id}/adjudicate"
    description: "Final adjudication of an escalated complaint; adjudicator must differ from triager and resolver"
    roles: [NetworkAdmin]
    code: 200
    input: [outcome, "resolution_notes?"]
    output: Complaint
    side_effects: ["ESCALATED -> ADJUDICATED_UPHELD | ADJUDICATED_DISMISSED", "ADJUDICATED_UPHELD applies the same upheld cascade; ADJUDICATED_DISMISSED releases QUARANTINED items of the matching target_category back to AVAILABLE (box_id cleared)", "increments Complaint.version by 1"]

  # --- Schools ---
  - method: POST
    path: "/library-network/schools"
    description: "Register a partner school"
    roles: [NetworkAdmin]
    code: 201
    input: [name, district_code, contact_email, region_code, restricted_categories]
    output: School
    side_effects: ["status REGISTERED"]

  - method: GET
    path: "/library-network/schools"
    description: "List schools"
    roles: [Steward, SchoolLiaison, HubCoordinator, Moderator, NetworkAdmin]
    code: 200
    input: ["status?", "region_code?", "limit?", "offset?"]
    output: "School[]"
    side_effects: []

  - method: GET
    path: "/library-network/schools/{id}"
    description: "Get a single school (includes drives_completed_count)"
    roles: [Steward, SchoolLiaison, HubCoordinator, Moderator, NetworkAdmin]
    code: 200
    input: []
    output: School
    side_effects: []

  - method: POST
    path: "/library-network/schools/{id}/status"
    description: "School status transition (ACTIVE <-> INACTIVE lifecycle)"
    roles: [NetworkAdmin]
    code: 200
    input: [target_status]
    output: School
    side_effects: ["per §1.2 School machine", "increments School.version by 1"]

  # --- Book drives ---
  - method: POST
    path: "/library-network/drives"
    description: "Propose a book drive with a partner school (half-open window, no per-school overlap)"
    roles: [Steward]
    code: 201
    input: [school_id, goal_books, starts_at, ends_at]
    output: BookDrive
    side_effects: ["status PROPOSED; both approval dimensions PENDING; coordinator_steward_id = X-User-ID", "requires steward ACTIVE (ERR_STEWARD_NOT_ACTIVE) and school ACTIVE (ERR_SCHOOL_NOT_ACTIVE)"]

  - method: GET
    path: "/library-network/drives/{id}"
    description: "Get a book drive (includes approval dimensions and fulfillment metrics)"
    roles: [Steward, SchoolLiaison, HubCoordinator, Moderator, NetworkAdmin]
    code: 200
    input: []
    output: BookDrive
    side_effects: []

  - method: GET
    path: "/library-network/drives"
    description: "List book drives with filters"
    roles: [Steward, SchoolLiaison, HubCoordinator, Moderator, NetworkAdmin]
    code: 200
    input: ["school_id?", "coordinator_steward_id?", "status?", "limit?", "offset?"]
    output: "BookDrive[]"
    side_effects: []

  - method: POST
    path: "/library-network/drives/{id}/school-decision"
    description: "School liaison approves or rejects the drive"
    roles: [SchoolLiaison]
    code: 200
    input: [decision]
    output: BookDrive
    side_effects: ["school_approval_status PENDING -> APPROVED|REJECTED; join: if network also APPROVED, status -> APPROVED and the linked DonationBatch is created; REJECT -> status REJECTED", "increments BookDrive.version by 1", "X-User-ID must equal drive.school_id (ERR_FORBIDDEN_OWNERSHIP)"]

  - method: POST
    path: "/library-network/drives/{id}/network-decision"
    description: "Network admin approves or rejects the drive"
    roles: [NetworkAdmin]
    code: 200
    input: [decision]
    output: BookDrive
    side_effects: ["network_approval_status PENDING -> APPROVED|REJECTED; same join/reject logic as school-decision", "increments BookDrive.version by 1"]

  - method: POST
    path: "/library-network/drives/{id}/status"
    description: "Drive status transitions: COLLECTION_CLOSED (from OPEN), COMPLETED (from COLLECTION_CLOSED), CANCELLED (from PROPOSED/APPROVED/OPEN)"
    roles: [Steward, NetworkAdmin]
    code: 200
    input: [target_status]
    output: BookDrive
    side_effects: ["per §1.2 BookDrive machine; COMPLETED computes fulfillment variants and creates the DRIVE_COMPLETED recognition event (+150 or +50); CANCELLED from APPROVED/OPEN closes the linked batch and recycles AVAILABLE items", "increments BookDrive.version by 1", "Steward actor must be the coordinator (ERR_FORBIDDEN_OWNERSHIP)"]

  # --- Donation batches & distribution ---
  - method: POST
    path: "/library-network/batches"
    description: "Create a donation intake batch"
    roles: [HubCoordinator, NetworkAdmin]
    code: 201
    input: [source_type, "drive_id?", region_code]
    output: DonationBatch
    side_effects: ["status RECEIVED", "drive_id required iff source_type == BOOK_DRIVE and must reference a drive in {APPROVED, OPEN} (ERR_DRIVE_NOT_APPROVED); forbidden otherwise"]

  - method: GET
    path: "/library-network/batches/{id}"
    description: "Get a donation batch (includes version for OCC and item counters)"
    roles: [Steward, HubCoordinator, Moderator, NetworkAdmin]
    code: 200
    input: []
    output: DonationBatch
    side_effects: []

  - method: GET
    path: "/library-network/batches"
    description: "List donation batches with filters"
    roles: [Steward, HubCoordinator, Moderator, NetworkAdmin]
    code: 200
    input: ["drive_id?", "source_type?", "status?", "limit?", "offset?"]
    output: "DonationBatch[]"
    side_effects: []

  - method: POST
    path: "/library-network/batches/{id}/items"
    description: "Bulk intake of book items into a RECEIVED batch; per-item rejection for content policy / invalid data; best-effort semantics (valid items are created even when siblings reject). Items created in one call receive monotonically increasing created_at in array order so the distribution item draw (created_at ASC) is deterministic."
    roles: [HubCoordinator, NetworkAdmin]
    code: 200
    input: [items]
    output: "{ created_count: integer, created_item_ids: string[], rejected: array }"
    side_effects: ["creates BookItems (status AVAILABLE) for valid items", "drive-linked batches: per-item content policy check (ERR_CONTENT_POLICY_VIOLATION) and drive window check (ERR_DRIVE_WINDOW_CLOSED); batch-level: batch must be RECEIVED (ERR_INVALID_STATE) and drive OPEN (ERR_DRIVE_NOT_OPEN)", "rejected entries are { index, error_id }"]

  - method: POST
    path: "/library-network/batches/{id}/sort-complete"
    description: "Close sorting when every item is graded"
    roles: [HubCoordinator, NetworkAdmin]
    code: 200
    input: []
    output: DonationBatch
    side_effects: ["RECEIVED -> SORTED (ERR_UNGRADED_ITEMS when graded_count < item_count)", "increments DonationBatch.version by 1"]

  - method: POST
    path: "/library-network/batches/{id}/distribution-runs"
    description: "Create a distribution run for a SORTED batch; server computes plan_snapshot via need_score selector; supersedes any existing DRAFT run for the batch; OCC on the batch version"
    roles: [HubCoordinator, NetworkAdmin]
    code: 201
    input: [expected_batch_version]
    output: DistributionRun
    side_effects: ["batch must be SORTED (ERR_INVALID_STATE); computes plan_snapshot via need_score; existing DRAFT run for this batch -> SUPERSEDED; increments DonationBatch.version by 1", "ERR_NO_ELIGIBLE_BOXES when the plan is empty"]

  - method: GET
    path: "/library-network/distribution-runs/{id}"
    description: "Get a distribution run (includes plan_snapshot)"
    roles: [Steward, HubCoordinator, Moderator, NetworkAdmin]
    code: 200
    input: []
    output: DistributionRun
    side_effects: []

  - method: GET
    path: "/library-network/distribution-runs"
    description: "List distribution runs with filters"
    roles: [Steward, HubCoordinator, Moderator, NetworkAdmin]
    code: 200
    input: ["batch_id?", "status?", "limit?", "offset?"]
    output: "DistributionRun[]"
    side_effects: []

  - method: GET
    path: "/library-network/distribution-runs/{id}/allocations"
    description: "List allocations of a run, sorted by created_at ASC (creation order follows plan_snapshot order)"
    roles: [Steward, HubCoordinator, Moderator, NetworkAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Allocation[]"
    side_effects: []

  - method: POST
    path: "/library-network/distribution-runs/{id}/confirm"
    description: "Confirm a DRAFT run: re-validates the plan (ERR_PLAN_STALE) and materializes RESERVED allocations in snapshot order with items drawn created_at ASC; allocations receive monotonically increasing created_at in plan order"
    roles: [HubCoordinator, NetworkAdmin]
    code: 200
    input: []
    output: DistributionRun
    side_effects: ["DRAFT -> CONFIRMED; creates Allocations; BookItems -> ALLOCATED with box_id set", "increments DistributionRun.version by 1"]

  - method: POST
    path: "/library-network/distribution-runs/{id}/dispatch"
    description: "Dispatch a CONFIRMED run"
    roles: [HubCoordinator, NetworkAdmin]
    code: 200
    input: []
    output: DistributionRun
    side_effects: ["CONFIRMED -> DISPATCHED; Allocations RESERVED -> DISPATCHED; BookItems ALLOCATED -> DISPATCHED", "increments DistributionRun.version by 1"]

  # --- Allocations ---
  - method: GET
    path: "/library-network/allocations"
    description: "List allocations with filters"
    roles: [Steward, HubCoordinator, Moderator, NetworkAdmin]
    code: 200
    input: ["run_id?", "box_id?", "book_item_id?", "status?", "limit?", "offset?"]
    output: "Allocation[]"
    side_effects: []

  - method: GET
    path: "/library-network/allocations/{id}"
    description: "Get a single allocation"
    roles: [Steward, HubCoordinator, Moderator, NetworkAdmin]
    code: 200
    input: []
    output: Allocation
    side_effects: []

  - method: POST
    path: "/library-network/allocations/{id}/receive"
    description: "Box steward confirms placement of a dispatched book"
    roles: [Steward, NetworkAdmin]
    code: 200
    input: []
    output: Allocation
    side_effects: ["DISPATCHED -> PLACED; BookItem -> PLACED; box.current_stock += 1; box.last_activity_at = now; RecognitionEvent(ALLOCATION_PLACED, +5); run bubble-up to COMPLETED; posture recompute", "increments Allocation.version by 1"]

  - method: POST
    path: "/library-network/allocations/{id}/cancel"
    description: "Cancel a reserved/dispatched allocation (compensating action); also reachable implicitly via box decommission"
    roles: [HubCoordinator, NetworkAdmin]
    code: 200
    input: []
    output: Allocation
    side_effects: ["RESERVED|DISPATCHED -> CANCELLED; BookItem -> AVAILABLE with box_id cleared; run bubble-up check", "increments Allocation.version by 1"]

  # --- Recognition ---
  - method: GET
    path: "/library-network/stewards/{id}/recognition-events"
    description: "List the append-only recognition event log of a steward"
    roles: [Steward, Moderator, NetworkAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "RecognitionEvent[]"
    side_effects: []

  # --- Ops ---
  - method: POST
    path: "/library-network/map/sweeps"
    description: "Ops-run checkpoint: advances the network epoch. Expires complaint response windows (STEWARD_RESPONSE_PENDING -> UNDER_REVIEW when now >= response_due_at), opens APPROVED drives whose starts_at passed, closes OPEN drives whose ends_at passed, recomputes every box posture, suspends ACTIVE boxes with days_since_activity >= 180, decommissions boxes suspended >= 30 days, and recycles QUARANTINED items 30 days after the upholding decision. Idempotent: a second sweep without clock movement changes nothing."
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: "{ expired_response_count: integer, opened_drive_count: integer, closed_drive_count: integer, suspended_box_count: integer, decommissioned_box_count: integer, recycled_item_count: integer, posture_change_count: integer }"
    side_effects: ["all transitions per §1.2 system rows; every mutated entity increments version / refreshes updated_at"]

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: sets the logical clock. The server's default logical time at startup is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time; every created_at, window, deadline, and staleness computation reads this logical clock."
    roles: [NetworkAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["sets the logical clock used by all timestamp stamping and temporal calculations"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers on an endpoint that does not allow Anonymous; or SchoolLiaison X-User-ID not equal to an existing School.id" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not listed in the endpoint's roles" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Entity-backed role acting on a resource it does not own (steward self-service, box owner, drive coordinator, school liaison)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum member, or out-of-range value (score, capacity, coordinates, goal, qty, costs)" }
  - { id: ERR_STEWARD_NOT_FOUND, http: 404, condition: "No steward with the given id" }
  - { id: ERR_BOX_NOT_FOUND, http: 404, condition: "No box with the given id" }
  - { id: ERR_SCHOOL_NOT_FOUND, http: 404, condition: "No school with the given id" }
  - { id: ERR_DRIVE_NOT_FOUND, http: 404, condition: "No drive with the given id" }
  - { id: ERR_BATCH_NOT_FOUND, http: 404, condition: "No donation batch with the given id" }
  - { id: ERR_RUN_NOT_FOUND, http: 404, condition: "No distribution run with the given id" }
  - { id: ERR_ALLOCATION_NOT_FOUND, http: 404, condition: "No allocation with the given id" }
  - { id: ERR_MAINTENANCE_NOT_FOUND, http: 404, condition: "No maintenance request with the given id" }
  - { id: ERR_COMPLAINT_NOT_FOUND, http: 404, condition: "No complaint with the given id" }
  - { id: ERR_MODULE_NOT_FOUND, http: 404, condition: "No training module with the given id" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target entity not in the from-state required by the requested transition (generic state-precondition error)" }
  - { id: ERR_DRIVE_NOT_OPEN, http: 409, condition: "Item intake into a drive-linked batch while the drive status is not OPEN" }
  - { id: ERR_STEWARD_NOT_ACTIVE, http: 409, condition: "Operation requires the steward to be ACTIVE (box create/charter/activate, drive create, allocation receive)" }
  - { id: ERR_INSPECTION_REQUIRED, http: 409, condition: "Box activation or reactivation lacks a qualifying CONFIRMED inspection (for reactivation: one created after suspended_at)" }
  - { id: ERR_ORIENTATION_REQUIRED, http: 409, condition: "Steward activation requires a PASSED completion of the ORIENTATION module" }
  - { id: ERR_DRIVE_NOT_APPROVED, http: 409, condition: "A BOOK_DRIVE batch must link to a drive in status APPROVED or OPEN" }
  - { id: ERR_CONTENT_POLICY_VIOLATION, http: 422, condition: "Item category is in the drive school's restricted_categories (per-item rejection)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Complaint resolver equals triager, or adjudicator equals triager or resolver" }
  - { id: ERR_DRIVE_WINDOW_CLOSED, http: 422, condition: "Drive-linked item intake at or after drive.ends_at" }
  - { id: ERR_DRIVE_WINDOW_INVALID, http: 422, condition: "Drive starts_at >= ends_at" }
  - { id: ERR_DRIVE_WINDOW_OVERLAP, http: 422, condition: "Drive window overlaps another non-terminal drive of the same school under half-open [starts_at, ends_at) semantics; zero-gap adjacency is allowed" }
  - { id: ERR_SCHEDULE_DATE_PAST, http: 422, condition: "Maintenance scheduled_date before the current logical date" }
  - { id: ERR_REOPEN_WINDOW_EXPIRED, http: 422, condition: "Maintenance reopen at or after resolved_at + 14 days" }
  - { id: ERR_INSPECTION_TOO_SOON, http: 422, condition: "CONFIRMED inspection less than 30 days after the box's previous CONFIRMED inspection" }
  - { id: ERR_BOX_LIMIT_REACHED, http: 422, condition: "Steward already holds the maximum number of non-decommissioned boxes for their recognition tier" }
  - { id: ERR_NO_ELIGIBLE_BOXES, http: 422, condition: "Distribution selector produced an empty plan (no eligible boxes or no available graded items)" }
  - { id: ERR_PLAN_STALE, http: 409, condition: "Run confirm re-validation failed: a planned box lost eligibility/capacity or the batch lacks available graded items" }
  - { id: ERR_UNGRADED_ITEMS, http: 422, condition: "Sort-complete or drive completion while any batch item has condition_grade null" }
  - { id: ERR_MODULE_ALREADY_PASSED, http: 422, condition: "A PASSED completion already exists for this steward and module" }
  - { id: ERR_MODULE_INACTIVE, http: 422, condition: "Completion attempted against a module with active == false" }
  - { id: ERR_PREREQUISITE_NOT_MET, http: 422, condition: "The module's prerequisite module has no PASSED completion for this steward" }
  - { id: ERR_MODULE_CYCLE, http: 422, condition: "The given prerequisite_module_id would create a cycle in the module prerequisite graph" }
  - { id: ERR_EMAIL_TAKEN, http: 422, condition: "Another steward already uses this email" }
  - { id: ERR_BOX_NOT_PUBLIC, http: 422, condition: "Complaint or public maintenance report against a box whose charter_status is not ACTIVE or SUSPENDED" }
  - { id: ERR_DRIVE_LINK_REQUIRED, http: 422, condition: "source_type == BOOK_DRIVE but drive_id missing" }
  - { id: ERR_DRIVE_LINK_FORBIDDEN, http: 422, condition: "drive_id supplied while source_type != BOOK_DRIVE" }
  - { id: ERR_SCHOOL_NOT_ACTIVE, http: 422, condition: "Drive proposed for a school whose status is not ACTIVE" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated public caller: registers as steward, files complaints, reports maintenance, browses the public box map"
    identity: opaque
    exclusive_operations:
      - "POST /library-network/stewards (shared with NetworkAdmin)"
    shared_operations:
      - "POST /library-network/complaints"
      - "POST /library-network/maintenance-requests"
      - "GET /library-network/boxes and /library-network/boxes/{id}"

  - name: Steward
    description: "Registered library steward; owns boxes, coordinates drives, responds to complaints, completes training"
    identity: "entity_backed:Steward"
    exclusive_operations:
      - "POST /library-network/drives"
      - "POST /library-network/complaints/{id}/respond"
    shared_operations:
      - "POST /library-network/boxes (self as steward_id)"
      - "POST /library-network/boxes/{id}/status (reactivation of own box only)"
      - "POST /library-network/stewards/{id}/training-completions (self)"
      - "PATCH /library-network/stewards/{id} (self)"
      - "POST /library-network/stewards/{id}/retire (self)"
      - "POST /library-network/maintenance-requests/{id}/reopen (own box)"
      - "POST /library-network/drives/{id}/status (own drives)"
      - "POST /library-network/allocations/{id}/receive (own box)"
      - "reads: stewards, boxes, items, maintenance, complaints, drives, batches, runs, allocations, training, recognition-events (self)"

  - name: SchoolLiaison
    description: "School partner contact; approves or rejects book drives for their school"
    identity: "entity_backed:School"
    exclusive_operations:
      - "POST /library-network/drives/{id}/school-decision"
    shared_operations:
      - "reads: schools, drives"

  - name: HubCoordinator
    description: "Donation hub operator: intake, grading, sorting, and distribution of donated books"
    identity: opaque
    exclusive_operations:
      - "POST /library-network/batches"
      - "POST /library-network/batches/{id}/items"
      - "POST /library-network/batches/{id}/sort-complete"
      - "POST /library-network/batches/{id}/distribution-runs"
      - "POST /library-network/distribution-runs/{id}/confirm"
      - "POST /library-network/distribution-runs/{id}/dispatch"
      - "POST /library-network/allocations/{id}/cancel"
    shared_operations:
      - "reads: stewards, boxes, items, maintenance, complaints, drives, batches, runs, allocations, training"

  - name: Moderator
    description: "Community moderator: complaint triage/resolution, maintenance triage/resolution, inspections, steward suspension"
    identity: opaque
    exclusive_operations:
      - "POST /library-network/boxes/{id}/inspections"
      - "POST /library-network/stewards/{id}/suspend"
    shared_operations:
      - "POST /library-network/complaints/{id}/triage and /resolve (with NetworkAdmin; segregation of duties applies by X-User-ID)"
      - "POST /library-network/maintenance-requests/{id}/triage and /resolve (with NetworkAdmin)"
      - "POST /library-network/maintenance-requests (with Anonymous, Steward, NetworkAdmin)"
      - "reads: stewards, boxes, items, maintenance, complaints, drives, batches, runs, allocations, training, recognition-events"

  - name: NetworkAdmin
    description: "Network operator with full administrative surface; the only role for sweeps, clock, module management, chartering, school management, drive network-approval, complaint escalation/adjudication"
    identity: opaque
    exclusive_operations:
      - "POST /library-network/map/sweeps"
      - "POST /_clock/set_current_utc"
      - "POST /library-network/training-modules"
      - "POST /library-network/schools and /library-network/schools/{id}/status"
      - "POST /library-network/stewards/{id}/activate and /reinstate"
      - "POST /library-network/complaints/{id}/escalate and /adjudicate"
      - "POST /library-network/drives/{id}/network-decision"
      - "POST /library-network/boxes chartering/decommission (via /status)"
    shared_operations:
      - "every read endpoint"
      - "all Moderator and HubCoordinator shared operations"
      - "Steward operations where an admin acts on behalf (box create with explicit steward_id, retire, status transitions, allocation receive)"
