      - name: segregation_of_duties_and_referral_stage_gates
        claim_type: segregation_of_duties
        grounds:
          - validations[priority 8]
          - validations[priority 10]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_REFERRAL_NOT_WITH_AG]
          - roles[ElectionsExaminer]
          - state_machines.FraudReferral
        distinguishing_aspect: |
          Two independent separation rules share one code, and each is probed against the
          actor that is otherwise perfectly entitled: the examiner who opened a referral may
          not adjudicate it, and the examiner who tallied the deciding round may not sign the
          determination - while a second examiner and the administrator may. The referral's
          stage gate is probed on both sides of the adjudication: adjudicating while the
          referral is still OPENED and again after it has been adjudicated both yield
          ERR_REFERRAL_NOT_WITH_AG, so the code is not merely a synonym for "too early".
