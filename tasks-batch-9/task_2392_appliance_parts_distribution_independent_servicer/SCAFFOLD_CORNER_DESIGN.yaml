      - name: revoking_an_already_revoked_certification_cannot_repeat
        claim_type: idempotency
        grounds:
          - state_machines.TechnicianCertification.transitions.ACTIVE_to_REVOKED
          - errors[ERR_CERT_ALREADY_REVOKED]
          - validations[priority_19]
        distinguishing_aspect: "The second POST /technician-certifications/{id}/revoke returns HTTP 409 ERR_CERT_ALREADY_REVOKED and does NOT bump version a second time — the row stays at the version the first revoke produced."
        test_recipe:
          setup:
            - "GOLD tier; one ServicerAccount authorized for WHIRLPOOL."
            - "One ACTIVE TechnicianCertification (ADVANCED, WHIRLPOOL, 2026-01-01 -> 2027-01-01) revoked exactly once."
          setup_api_calls:
            - call: "POST /pricing-tiers"
              payload: { tier_code: "GOLD", name: "Gold Contract", discount_pct_electrical: 0.15, discount_pct_mechanical: 0.20, discount_pct_cosmetic: 0.25, discount_pct_sealed_system: 0.10, min_annual_volume_cents: 5000000 }
              as: PricingAdmin
              captures: { tier_gold_id: $.data.id }
            - call: "POST /servicer-accounts"
              payload: { business_name: "Ace Appliance Repair", oem_authorizations: ["WHIRLPOOL"], pricing_tier_id: "${tier_gold_id}", credit_terms: "NET_30", credit_limit_cents: 10000000, core_liability_limit_cents: 5000000 }
              as: CreditManager
              captures: { acct_s_id: $.data.id }
