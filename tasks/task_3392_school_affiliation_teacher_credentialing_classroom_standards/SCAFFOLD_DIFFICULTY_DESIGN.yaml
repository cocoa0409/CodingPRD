              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /society/self-studies"
              payload: { school_id: "${s_id}", narrative: "Cycle test narrative", expected_school_version: "${s_v}" }
              as: SchoolAdmin
              as_user_id: "${s_id}"
              captures: { ss_id: $.data.id }
            - call: "POST /society/self-studies/${ss_id}/submit"
              payload: {}
              as: SchoolAdmin
              as_user_id: "${s_id}"
            - call: "POST /society/self-studies/${ss_id}/review"
              payload: { outcome: "RETURNED_FOR_REVISION", notes: "Strengthen the materials section" }
              as: AccreditationReviewer
            - call: "POST /society/self-studies/${ss_id}/submit"
              payload: {}
              as: SchoolAdmin
              as_user_id: "${s_id}"
              captures: { resubmit_status: $.data.status }
            - call: "POST /society/self-studies/${ss_id}/review"
              payload: { outcome: "ACCEPTED" }
              as: AccreditationReviewer
          trigger:
            - call: "POST /society/self-studies/${ss_id}/submit"
              payload: {}
              as: SchoolAdmin
              as_user_id: "${s_id}"
              captures: { term_err: $.data.error_id }
            - call: "GET /society/schools/${s_id}"
              payload: {}
              as: SocietyAdmin
              captures: { s_pin: $.data.pinned_catalog_id }
          assert:
            - "the second submit (after RETURNED_FOR_REVISION) succeeded: resubmit_status == SUBMITTED"
            - "after ACCEPTED, School.${s_id}.pinned_catalog_id == ${cat_id} (version pinning on approval)"
            - "a further submit on the terminal ACCEPTED self-study is rejected: term_err == ERR_INVALID_STATE (http 409)"
