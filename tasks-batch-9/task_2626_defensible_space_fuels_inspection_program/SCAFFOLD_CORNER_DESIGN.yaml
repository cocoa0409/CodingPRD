              captures: { p1: "$.data.id" }
            - call: "POST /fire-district/inspections"
              payload: { parcel_id: "${p1}", cycle_id: "${cyc}", inspector_id: "${insp1}", inspection_type: "INITIAL", scheduled_start_utc: "2026-08-20T15:00:00Z", scheduled_end_utc: "2026-08-20T17:00:00Z", access_arrangement: "GATE_CODE" }
              as: ProgramAdmin
              captures: { ins1: "$.data.id" }
            - call: "POST /fire-district/inspections/${ins1}/notice"
              payload: { notice_method: "CERTIFIED_MAIL" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspections/${ins1}/access-denial"
              payload: { reason_code: "GATE_LOCKED" }
              as: Inspector
              as_user_id: "${insp1}"
              captures: { st1: "$.data.status", cnt1: "$.data.access_denial_count" }
            - call: "POST /fire-district/inspections/${ins1}/reschedule"
              payload: { scheduled_start_utc: "2026-09-10T15:00:00Z", scheduled_end_utc: "2026-09-10T17:00:00Z" }
              as: ProgramAdmin
              captures: { st2: "$.data.status", cnt2: "$.data.access_denial_count" }
            - call: "POST /fire-district/inspections/${ins1}/notice"
              payload: { notice_method: "CERTIFIED_MAIL" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspections/${ins1}/access-denial"
              payload: { reason_code: "GATE_LOCKED" }
              as: Inspector
              as_user_id: "${insp1}"
              captures: { st3: "$.data.status", cnt3: "$.data.access_denial_count" }
          trigger:
            - call: "POST /fire-district/inspections/${ins1}/access-denial"
              payload: { reason_code: "GATE_LOCKED" }
              as: Inspector
              as_user_id: "${insp1}"
              captures: { err: "$.data.error_id" }
          assert:
            - "${st1} == \"ACCESS_DENIED\" with ${cnt1} == 1; ${st2} == \"SCHEDULED\" with ${cnt2} == 1 — the reschedule does NOT reset the counter"
            - "${st3} == \"ABANDONED\" with ${cnt3} == 2: the second denial took the divergent branch of the same trigger"
            - "HTTP 409 on the trigger and ${err} == \"ERR_ACCESS_DENIAL_LIMIT_REACHED\""
            - "Inspection.${ins1}.access_denial_count is still 2 and status is still \"ABANDONED\""
            - "GET /fire-district/violation-notices with parcel_id ${p1} returns total_count == 1 — the refused denial created no second notice"
            - "That single notice has severity \"CRITICAL\" and notice_method \"CERTIFIED_MAIL\" from the ABANDONED side-effect set"

