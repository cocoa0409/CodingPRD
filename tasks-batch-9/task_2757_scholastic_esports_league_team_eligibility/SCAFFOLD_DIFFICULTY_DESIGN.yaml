        mode: b
        grounds:
          - calculations.team_entry_fee
          - conserved_quantity_invariants.district_subsidy_pool_conservation
          - entities.Team.fields.entry_fee_cents
          - entities.Team.fields.subsidy_granted_cents
          - entities.Team.fields.net_fee_due_cents
          - entities.District.fields.subsidy_pool_cents
          - state_machines.Team.DRAFT_to_REGISTERED
        distinguishing_aspect: |
          Mode (b): a bucketed waterfall whose line items are subsidised and rounded
          individually before summing. With the default base 12510 and two starter lines of
          3335 at subsidy_pct 0.25 the per-line subsidies are 3128 (12510*0.25 = 3127.50,
          round_half_up) + 834 + 834 = 4796, while the forbidden SUM_THEN_ROUND order gives
          round_half_up(19180*0.25) = 4795 — one cent less. The ledger debit against
          District.subsidy_pool_cents makes the off-by-one cent observable on a second
          entity, and this instance differs from its mode-(a) sibling by exercising bucket
          decomposition rather than a sequential multiplier ladder.
