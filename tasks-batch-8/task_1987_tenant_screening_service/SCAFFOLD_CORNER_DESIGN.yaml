  # ===========================================================================
  - section: errors
    instances:
      - name: missing_auth_header_returns_400
        claim_type: error_triggerable
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
        distinguishing_aspect: "Requests without the X-User-ID / X-User-Role headers fail at priority 1 with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any role, existence, or business check — even on a plain GET."
        test_recipe:
          setup: ["Database may contain data; irrelevant — the request never reaches resource logic. A landlord is created only to give the chain a concrete baseline."]
          setup_api_calls:
            - { call: "POST /api/landlords", payload: { name: "L Auth", contact_email: "lauth@x.com" }, as: ComplianceAdmin }
          trigger:
            - call: "GET /api/applications"
              payload: {}
              as: Anonymous
              captures: { err: "$.data.error_id" }
          assert:
            - "captured ${err} == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (http 400) — the test harness sends this call with NO X-User-ID / X-User-Role headers"

  # ===========================================================================
  - section: rbac
    instances:
      - name: screener_cannot_publish_criteria
        claim_type: role_permission_denial
        grounds:
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED_ROLE]
          - roles[Screener]
          - roles[Landlord]
        distinguishing_aspect: "Role denial at priority 2: criteria publish is a Landlord-exclusive operation, so a Screener carrying a perfectly valid payload (current expected_landlord_version) is rejected with ERR_UNAUTHORIZED_ROLE before the OCC check ever runs."
        test_recipe:
          setup: ["Landlord (version captured) with one DRAFT criteria"]
          setup_api_calls:
            - call: "POST /api/landlords"
              payload: { name: "L Rbac", contact_email: "lrbac@x.com" }
              as: ComplianceAdmin
              captures: { ll: "$.data.id", ll_v: "$.data.version" }
