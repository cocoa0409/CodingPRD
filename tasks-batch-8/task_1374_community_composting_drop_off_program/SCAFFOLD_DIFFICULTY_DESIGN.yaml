            - call: "POST /programs/${prog_id}/sites/${site_id}/drops"
              payload: { participant_id: "${part_id}", access_grant_id: "${grant_id}", material_category_id: "${mat_id}", gross_weight_kg: 10.00, contamination_kg: 0.00, occurred_at: "2026-08-01T10:00:00Z", expected_site_version: "${sv}" }
              as: Participant
