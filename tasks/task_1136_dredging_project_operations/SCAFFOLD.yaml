# =============================================================================
# Task 1136: Dredging Project Operations (Great Lakes Dredge style contractor)
# =============================================================================

scenario: |
  1136. Dredging Project Operations (Great Lakes Dredge style contractor): survey & pre-dredge hydrographic condition, dredge type selection & production estimate, permit conditions (window/turbidity/species) compliance, disposal site placement & capacity accounting, quantity measurement & payment (in-place vs scow), equipment downtime & weather standby, endangered-species monitoring & shutdown, post-dredge survey & acceptance

domain_name: dredging-project-operations
api_prefix: ""

# =============================================================================
# §0 Complexity Profile — difficulty_level EXPERT+ (user directive: exceed §0.4 Expert band)
# =============================================================================
complexity_profile:
  difficulty_level: expert_plus
  primary_archetype: ledger_reconciliation      # in-place survey vs scow measurement produce divergent payable quantities for the same material; reconciliation tolerance gates certification
  secondary_archetype: posture_driven_gating     # Project.compliance_posture (CLEAR/RESTRICTED/SUSPENDED) derived from permit window, turbidity readings, species sightings gates all dredge-event operations
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat                          # peer entities with FK references; no nested URL paths
  state_machine_shape: cyclic                    # Reach deficiency loop, DredgePlan revision loop, DredgeEvent shutdown/resume loop, DisposalSite FULL->OPEN, PaymentCertificate dispute loop + audit branch
  relationship_patterns: [one_to_many, cross_aggregate, self_referential]
  role_model: segregation_of_duties              # submitter of a measurement/claim/certificate can never be its approver (X-User-ID compared across roles)
  consistency_model: immediate
  entity_count: 13
  state_machine_count: 12
  calculation_count: 9
  endpoint_count: 64
  error_code_count: 31
  role_count: 5

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology: all parents null; FKs canonical)
# =============================================================================
entities:
  - name: Project
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Contract project name" }
      - { name: measurement_basis, type: enum, source: input, description: "IN_PLACE | SCOW — selects which quantity variant is payable on FINAL certificates (INTERIM certificates are always scow-derived)", constraints: "enum: IN_PLACE, SCOW" }
      - { name: base_rate_cents_per_cy, type: integer, source: input, description: "Contract base unit rate per cubic yard, cents", constraints: "> 0" }
      - { name: standby_rate_cents_per_hour, type: integer, source: input, description: "Contract standby rate per hour, cents", constraints: "> 0" }
      - { name: liquidated_damages_cents_per_day, type: integer, source: input, description: "LD rate per day of overrun past allowed_days_frozen", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "PLANNED | ACTIVE | CLOSED_OUT", constraints: "initial PLANNED" }
      - { name: compliance_posture, type: enum, source: computed, description: "CLEAR | RESTRICTED | SUSPENDED — derived per calculation compliance_posture from permits, sightings, readings, and logical clock" }
      - { name: allowed_days_frozen, type: integer, source: system, description: "Risk-adjusted duration snapshot of the APPROVED DredgePlan, frozen at project activation; null until activation. Breaks the settlement circularity (see final_settlement_total)." }
      - { name: total_certified_cents, type: integer, source: computed, default: 0, description: "Sum of total_amount_cents over CERTIFIED or PAID PaymentCertificates" }
      - { name: total_paid_cents, type: integer, source: computed, default: 0, description: "Sum of total_amount_cents over PAID PaymentCertificates" }
      - { name: outstanding_payable_cents, type: integer, source: computed, description: "= total_certified_cents - total_paid_cents (ledger invariant INV-2)" }

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; owning project" }
      - { name: permit_number, type: string, source: input, description: "Agency permit number" }
      - { name: window_start_utc, type: datetime, source: input, description: "Environmental window start; window is a CLOSED interval [window_start_utc, window_end_utc] — touching endpoints of two ISSUED permits on the same project conflict" }
      - { name: window_end_utc, type: datetime, source: input, description: "Environmental window end (inclusive)", constraints: "must be > window_start_utc" }
      - { name: turbidity_limit_ntu, type: integer, source: input, description: "Trailing-average NTU at or above which posture becomes RESTRICTED (>=)", constraints: "> 0" }
      - { name: turbidity_ceiling_ntu, type: integer, source: input, description: "Instantaneous NTU at or above which posture becomes SUSPENDED (>=)", constraints: "> turbidity_limit_ntu" }
      - { name: turbidity_averaging_hours, type: integer, source: input, description: "Trailing window length for turbidity average, hours", constraints: "> 0" }
      - { name: species_standdown_hours, type: integer, source: input, description: "Cooldown after a SpeciesSighting before it can be cleared (>=)", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ISSUED | EXPIRED — created ISSUED; system sets EXPIRED when logical clock advances past window_end_utc", constraints: "initial ISSUED" }

  - name: Reach
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; owning project" }
      - { name: name, type: string, source: input, description: "Reach name" }
      - { name: design_quantity_cy, type: integer, source: input, description: "Design in-place volume to remove, cubic yards", constraints: "> 0" }
      - { name: required_depth_ft, type: number, source: input, description: "Required post-dredge depth, feet; acceptance needs min_sounding_depth_ft >= required_depth_ft (equality passes)", constraints: "> 0" }
      - { name: allowable_overdepth_ft, type: number, source: input, description: "Allowable overdepth, feet", constraints: ">= 0" }
      - { name: overdepth_allowance_cy, type: integer, source: input, description: "Overdepth volume eligible for tier-3 payment, cubic yards", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "PENDING | PRE_SURVEYED | DREDGING | POST_SURVEY_SUBMITTED | ACCEPTED", constraints: "initial PENDING" }
      - { name: removed_in_place_cy, type: number, source: computed, default: 0, description: "= max(0, latest ACCEPTED PRE_DREDGE survey volume - latest ACCEPTED POST_DREDGE survey volume); 0 until a POST_DREDGE survey is ACCEPTED. Identity INV-S maintained across survey supersedes." }
      - { name: cumulative_certified_quantity_cy, type: number, source: computed, default: 0, description: "Sum of per-reach quantities on CERTIFIED/PAID certificates; waterfall cursor for quantity_payment tiers; decremented on certificate void" }

  - name: DredgePlant
    parent: null
    common_fields: true
    fields:
      - { name: contractor_ref, type: string, source: input, description: "Contractor's plant reference/tag" }
      - { name: plant_type, type: enum, source: input, description: "CUTTER_SUCTION | HOPPER | CLAMSHELL | BACKHOE", constraints: "enum: CUTTER_SUCTION, HOPPER, CLAMSHELL, BACKHOE" }
      - { name: rated_daily_production_cy, type: integer, source: input, description: "Rated gross production per calendar day, cy", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "REGISTERED | OUT_OF_SERVICE | RETIRED", constraints: "initial REGISTERED" }

  - name: DredgePlan
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; project this plan is for" }
      - { name: plant_id, type: string, source: input, description: "FK -> DredgePlant.id; selected dredge plant (dredge type selection)" }
      - { name: material_class, type: enum, source: input, description: "SAND | SILT | CLAY | GRAVEL | ROCK — material to be dredged; keys MATERIAL_FACTOR in production_estimate", constraints: "enum: SAND, SILT, CLAY, GRAVEL, ROCK" }
      - { name: planned_start_utc, type: datetime, source: input, description: "Planned assignment start; assignment interval is HALF-OPEN [planned_start_utc, planned_end_utc) — back-to-back plans touching at an endpoint do NOT conflict" }
      - { name: planned_end_utc, type: datetime, source: input, description: "Planned assignment end (exclusive)", constraints: "must be > planned_start_utc" }
      - { name: revision, type: integer, source: system, default: 1, description: "Increments on each resubmission after CHANGES_REQUESTED" }
      - { name: nominal_daily_production_cy, type: number, source: computed, description: "= rated_daily_production_cy x material_factor x depth_factor (production_estimate, NOMINAL variant)" }
      - { name: risk_adjusted_daily_production_cy, type: number, source: computed, description: "= nominal_daily_production_cy x (1 - WEATHER_ALLOWANCE_PCT) (RISK_ADJUSTED variant)" }
      - { name: nominal_duration_days, type: integer, source: computed, description: "= ceil(total design_quantity_cy of project reaches / nominal_daily_production_cy)" }
      - { name: risk_adjusted_duration_days, type: integer, source: computed, description: "= ceil(total design_quantity_cy / risk_adjusted_daily_production_cy)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | CHANGES_REQUESTED | APPROVED | SUPERSEDED", constraints: "initial DRAFT" }

  - name: Survey
    parent: null
    common_fields: true
    fields:
      - { name: reach_id, type: string, source: input, description: "FK -> Reach.id; surveyed reach" }
      - { name: kind, type: enum, source: input, description: "PRE_DREDGE | POST_DREDGE", constraints: "enum: PRE_DREDGE, POST_DREDGE" }
      - { name: measured_volume_cy, type: integer, source: input, description: "Hydrographic in-place volume above the required template, cy", constraints: ">= 0" }
      - { name: min_sounding_depth_ft, type: number, source: input, description: "Shallowest observed depth, feet; drives acceptance at POST_DREDGE acceptance", constraints: "> 0" }
      - { name: supersedes_survey_id, type: string, source: input, required: false, description: "FK -> Survey.id; self-referential re-survey chain — when this survey is ACCEPTED, the referenced earlier survey of the same reach+kind becomes SUPERSEDED" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the SurveyParty caller; segregation-of-duties anchor (acceptor must differ)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ACCEPTED | REJECTED | SUPERSEDED", constraints: "initial SUBMITTED" }

  - name: DredgeEvent
    parent: null
    common_fields: true
    fields:
      - { name: reach_id, type: string, source: input, description: "FK -> Reach.id; reach being dredged" }
      - { name: plant_id, type: string, source: input, description: "FK -> DredgePlant.id; working plant" }
      - { name: started_utc, type: datetime, source: input, description: "Work start; must fall inside the APPROVED plan's half-open window for this project+plant" }
      - { name: reduced_rate, type: boolean, source: input, default: false, description: "Mandatory true when created under RESTRICTED posture (half production attestation)" }
      - { name: ended_utc, type: datetime, source: system, description: "Set to logical now on completion" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SHUTDOWN | COMPLETED", constraints: "initial ACTIVE" }
      - { name: shutdown_reason, type: enum, source: system, description: "SPECIES | TURBIDITY | EQUIPMENT | WINDOW | null — recorded on auto-shutdown; WINDOW marks clock-driven window exits" }
      - { name: last_shutdown_at, type: datetime, source: system, description: "Logical timestamp of the most recent ACTIVE -> SHUTDOWN transition; null when not SHUTDOWN" }
      - { name: shutdown_accumulated_hours, type: number, source: computed, default: 0, description: "Hours spent in SHUTDOWN; incremented by (now - last_shutdown_at) at each resume/complete; feeds standby eligibility" }

  - name: DisposalSite
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Placement area name" }
      - { name: site_type, type: enum, source: input, description: "UPLAND_CONFINED | OPEN_WATER | BEACH_NOURISHMENT", constraints: "enum: UPLAND_CONFINED, OPEN_WATER, BEACH_NOURISHMENT" }
      - { name: capacity_cy, type: integer, source: input, description: "Total placement capacity, cy", constraints: "> 0" }
      - { name: bulking_factor, type: number, source: input, description: "Gross-to-in-situ bulking ratio for scow-derived measurement (e.g. 1.30)", constraints: "> 0" }
      - { name: used_cy, type: number, source: computed, default: 0, description: "Sum of witnessed_volume_cy over CONFIRMED (non-VOIDED) PlacementTickets" }
      - { name: remaining_cy, type: number, source: computed, description: "= capacity_cy - used_cy; confirm allowed iff used_cy + witnessed_volume_cy <= capacity_cy (exact fill allowed, then FULL)" }
      - { name: status, type: enum, source: system, description: "OPEN | FULL | CLOSED — OPEN->FULL automatic when remaining_cy hits 0; FULL->OPEN automatic when a void restores capacity", constraints: "initial OPEN" }

  - name: PlacementTicket
    parent: null
    common_fields: true
    fields:
      - { name: dredge_event_id, type: string, source: input, description: "FK -> DredgeEvent.id; event whose material was placed" }
      - { name: disposal_site_id, type: string, source: input, description: "FK -> DisposalSite.id; receiving site" }
      - { name: placed_utc, type: datetime, source: input, description: "Placement timestamp; must fall inside an ISSUED permit window of the event's project at confirm time (closed interval)" }
      - { name: declared_volume_cy, type: integer, source: input, description: "Contractor-declared scow volume, cy", constraints: "> 0" }
      - { name: witnessed_volume_cy, type: integer, source: input, description: "Site-operator witnessed volume, cy — required input of confirm; the measurement that debits capacity", constraints: "> 0" }
      - { name: reported_by_user_id, type: string, source: system, description: "X-User-ID of reporting ContractorOps caller; segregation anchor (confirmer must differ)" }
      - { name: in_situ_volume_cy, type: number, source: computed, description: "= round_half_up(witnessed_volume_cy / site.bulking_factor, 2), rounded PER TICKET at confirm — scow_derived_quantity sums these per-ticket rounded values" }
      - { name: status, type: enum, source: system, description: "REPORTED | CONFIRMED | REJECTED | VOIDED", constraints: "initial REPORTED" }

  - name: StandbyClaim
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; claiming project" }
      - { name: plant_id, type: string, source: input, description: "FK -> DredgePlant.id; idle plant" }
      - { name: period_start_utc, type: datetime, source: input, description: "Claim period start" }
      - { name: period_end_utc, type: datetime, source: input, description: "Claim period end", constraints: "> period_start_utc" }
      - { name: claimed_hours, type: number, source: input, description: "Claimed standby hours; must be <= plant shutdown_accumulated_hours on this project (aggregate check)", constraints: "> 0" }
      - { name: reason, type: enum, source: input, description: "WEATHER | SPECIES_SHUTDOWN | OWNER_DIRECTED | EQUIPMENT_BREAKDOWN", constraints: "enum: WEATHER, SPECIES_SHUTDOWN, OWNER_DIRECTED, EQUIPMENT_BREAKDOWN" }
      - { name: payable_hours, type: number, source: computed, description: "= max(0, claimed_hours - STANDBY_DEDUCTIBLE_HOURS); 0 for EQUIPMENT_BREAKDOWN" }
      - { name: payable_amount_cents, type: integer, source: computed, description: "= round_half_up(payable_hours x project.standby_rate_cents_per_hour x reason_multiplier, 0); multipliers WEATHER 1.0, OWNER_DIRECTED 1.0, SPECIES_SHUTDOWN 0.5, EQUIPMENT_BREAKDOWN 0" }
      - { name: claimed_by_user_id, type: string, source: system, description: "X-User-ID of claiming ContractorOps caller; segregation anchor (approver must differ)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | DENIED | SETTLED", constraints: "initial SUBMITTED" }

  - name: SpeciesSighting
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; affected project" }
      - { name: species_class, type: enum, source: input, description: "FISH | MAMMAL | REPTILE | BIRD", constraints: "enum: FISH, MAMMAL, REPTILE, BIRD" }
      - { name: observed_utc, type: datetime, source: input, description: "Observation timestamp; cooldown runs from here" }
      - { name: reported_by_user_id, type: string, source: system, description: "X-User-ID of reporting EnvironmentalMonitor" }
      - { name: cleared_at, type: datetime, source: system, description: "Set on clear" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CLEARED — clear requires logical now >= observed_utc + species_standdown_hours of the governing permit (equality allowed)", constraints: "initial ACTIVE" }

  - name: TurbidityReading
    parent: null
    common_fields: false
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; sampled project" }
      - { name: value_ntu, type: integer, source: input, description: "Turbidity sample, NTU", constraints: ">= 0" }
      - { name: taken_utc, type: datetime, source: input, description: "Sample timestamp; membership in the trailing window (now - averaging_hours, now] uses taken_utc; order ties break by created_at ASC" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of recording EnvironmentalMonitor" }

  - name: PaymentCertificate
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; billed project" }
      - { name: certificate_type, type: enum, source: input, description: "INTERIM | FINAL — INTERIM quantity is scow-derived; FINAL quantity follows project.measurement_basis and runs reconciliation", constraints: "enum: INTERIM, FINAL" }
      - { name: period_start_utc, type: datetime, source: input, description: "Billing period start (INTERIM scow sweep: placed_utc in [period_start_utc, period_end_utc] closed)" }
      - { name: period_end_utc, type: datetime, source: input, description: "Billing period end", constraints: "> period_start_utc" }
      - { name: reach_ids, type: array, source: input, description: "Reaches included; must all belong to project" }
      - { name: standby_claim_ids, type: array, source: input, required: false, description: "StandbyClaims to settle; each must be APPROVED, same project, not SETTLED", default: [] }
      - { name: quantity_cy, type: number, source: computed, description: "Sum over reach_ids of the variant quantity (scow per-ticket-rounded in_situ for INTERIM; survey-derived or scow-derived per measurement_basis for FINAL, all-time)" }
      - { name: quantity_amount_cents, type: integer, source: computed, description: "Tiered waterfall of quantity_cy over per-reach cumulative_certified_quantity_cy (see quantity_payment; per-tier rounding then sum)" }
      - { name: standby_amount_cents, type: integer, source: computed, default: 0, description: "Sum of payable_amount_cents over standby_claim_ids" }
      - { name: liquidated_damages_cents, type: integer, source: computed, default: 0, description: "FINAL only: ld_rate x max(0, ceil((period_end_utc - period_start_utc)/24h) - project.allowed_days_frozen); 0 on INTERIM" }
      - { name: reconciliation_delta_pct, type: number, source: computed, description: "FINAL only: |survey_derived_total - scow_derived_total| / survey_derived_total x 100 over reach_ids (0 when survey_derived_total == 0 and scow == 0); > RECON_TOLERANCE_PCT forces AUDIT_HOLD at submit" }
      - { name: survey_derived_total_cy, type: number, source: computed, description: "All-time survey-derived removed quantity over reach_ids (exposed for reconciliation)" }
      - { name: scow_derived_total_cy, type: number, source: computed, description: "Scow-derived quantity over reach_ids (period-bounded on INTERIM, all-time on FINAL)" }
      - { name: total_amount_cents, type: integer, source: computed, description: "= quantity_amount_cents + standby_amount_cents - liquidated_damages_cents (final_settlement_total pinned order)" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of submitting ContractorOps; segregation anchor (certifier must differ)" }
      - { name: override_note, type: string, source: input, required: false, description: "Required on certify from AUDIT_HOLD" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | AUDIT_HOLD | CERTIFIED | DISPUTED | PAID | VOIDED", constraints: "initial DRAFT" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Project
    initial_state: PLANNED
    terminal_states: [CLOSED_OUT]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "POST /projects/{id}/activate"
        actor: OwnerEngineer
        preconditions:
          - "At least one Reach exists for the project (else ERR_ACTIVATION_INCOMPLETE)"
          - "At least one ISSUED Permit exists (else ERR_ACTIVATION_INCOMPLETE)"
          - "At least one APPROVED DredgePlan exists (else ERR_ACTIVATION_INCOMPLETE)"
        side_effects:
          - "allowed_days_frozen := risk_adjusted_duration_days of the APPROVED DredgePlan with the latest approval (frozen snapshot; later supersedes do NOT re-freeze)"
          - "Project.version incremented"
      - from: ACTIVE
        to: CLOSED_OUT
        trigger: "POST /projects/{id}/close-out"
        actor: OwnerEngineer
        preconditions:
          - "Every Reach of the project is ACCEPTED (else ERR_CLOSEOUT_INCOMPLETE)"
          - "No DredgeEvent of the project in ACTIVE or SHUTDOWN (else ERR_CLOSEOUT_INCOMPLETE)"
          - "No PlacementTicket of the project in REPORTED (else ERR_CLOSEOUT_INCOMPLETE)"
          - "No StandbyClaim of the project in SUBMITTED or APPROVED (claims must be SETTLED or DENIED) (else ERR_CLOSEOUT_INCOMPLETE)"
          - "At least one PAID FINAL PaymentCertificate exists for the project (else ERR_CLOSEOUT_INCOMPLETE)"
        side_effects: ["Project.version incremented"]

  - entity: Permit
    initial_state: ISSUED
    terminal_states: [EXPIRED]
    transitions:
      - from: ISSUED
        to: EXPIRED
        trigger: "system (evaluated whenever the logical clock is set: ISSUED permit with now > window_end_utc expires)"
        actor: system
        preconditions: []
        side_effects:
          - "Recompute compliance_posture of the owning Project (permit no longer governs; typically SUSPENDED)"

  - entity: Reach
    initial_state: PENDING
    terminal_states: [ACCEPTED]
    transitions:
      - from: PENDING
        to: PRE_SURVEYED
        trigger: "system (first PRE_DREDGE Survey of the reach is ACCEPTED)"
        actor: system
        preconditions: []
        side_effects: ["removed_in_place_cy recomputed (stays 0 — no post-dredge survey yet)"]
      - from: PRE_SURVEYED
        to: DREDGING
        trigger: "POST /reaches/{id}/begin-dredging"
        actor: ContractorOps
        preconditions:
          - "Project.status == ACTIVE (else ERR_PROJECT_NOT_ACTIVE)"
          - "An APPROVED DredgePlan exists for the project (else ERR_PLAN_NOT_APPROVED)"
        side_effects: []
      - from: DREDGING
        to: POST_SURVEY_SUBMITTED
        trigger: "system (a POST_DREDGE Survey is created for the reach)"
        actor: system
        preconditions: []
        side_effects: []
      - from: POST_SURVEY_SUBMITTED
        to: ACCEPTED
        trigger: "system (the POST_DREDGE Survey is ACCEPTED and survey.min_sounding_depth_ft >= reach.required_depth_ft — equality passes)"
        actor: system
        preconditions: []
        side_effects:
          - "removed_in_place_cy := max(0, latest ACCEPTED PRE_DREDGE volume - this POST_DREDGE volume)"
      - from: POST_SURVEY_SUBMITTED
        to: DREDGING
        trigger: "system (the POST_DREDGE Survey is ACCEPTED with min_sounding_depth_ft < reach.required_depth_ft — deficiency: cyclic re-dredge loop; OR the POST_DREDGE Survey is REJECTED)"
        actor: system
        preconditions: []
        side_effects: ["Reach remains dredgable; a new POST_DREDGE survey may be created"]

  - entity: DredgePlant
    initial_state: REGISTERED
    terminal_states: [RETIRED]
    transitions:
      - from: REGISTERED
        to: OUT_OF_SERVICE
        trigger: "PATCH /plants/{id} with status=OUT_OF_SERVICE"
        actor: ContractorOps
        preconditions: []
        side_effects:
          - "Every ACTIVE DredgeEvent of this plant -> SHUTDOWN with shutdown_reason=EQUIPMENT, last_shutdown_at=now (cascade link 1)"
          - "Those events begin accruing shutdown_accumulated_hours (cascade link 2)"
      - from: OUT_OF_SERVICE
        to: REGISTERED
        trigger: "PATCH /plants/{id} with status=REGISTERED"
        actor: ContractorOps
        preconditions: []
        side_effects: ["Events SHUTDOWN with reason EQUIPMENT are NOT auto-resumed; each requires POST /dredge-events/{id}/resume"]
      - from: REGISTERED
        to: RETIRED
        trigger: "PATCH /plants/{id} with status=RETIRED"
        actor: ContractorOps
        preconditions: ["No DredgeEvent of this plant in ACTIVE or SHUTDOWN (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: OUT_OF_SERVICE
        to: RETIRED
        trigger: "PATCH /plants/{id} with status=RETIRED"
        actor: ContractorOps
        preconditions: ["No DredgeEvent of this plant in ACTIVE or SHUTDOWN (else ERR_INVALID_STATE)"]
        side_effects: []

  - entity: DredgePlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /dredge-plans/{id}/submit"
        actor: ContractorOps
        preconditions: []
        side_effects: []
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /dredge-plans/{id}/submit (revision cycle: revision += 1)"
        actor: ContractorOps
        preconditions: []
        side_effects:
          - "revision incremented"
          - "Estimate fields recomputed (nominal/risk-adjusted) in case reaches or plant changed"
      - from: SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /dredge-plans/{id}/request-changes"
        actor: OwnerEngineer
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /dredge-plans/{id}/approve (OCC: expected_project_version)"
        actor: OwnerEngineer
        preconditions:
          - "expected_project_version == Project.version (else ERR_STALE_PROJECT_VERSION, 412)"
          - "Project.status in {PLANNED, ACTIVE} (else ERR_INVALID_STATE)"
          - "DredgePlant.status == REGISTERED (else ERR_PLANT_UNAVAILABLE)"
          - "No half-open overlap with another APPROVED plan of the same plant: conflict iff planned_start < other_end AND other_start < planned_end (touching endpoints do NOT conflict) (else ERR_PLANT_ASSIGNMENT_OVERLAP)"
          - "Window feasibility: floor((planned_end_utc - planned_start_utc)/24h) >= risk_adjusted_duration_days (else ERR_PLAN_WINDOW_INFEASIBLE)"
          - "An ISSUED Permit exists for the project (else ERR_PLAN_NOT_APPROVED)"
        side_effects:
          - "Any currently APPROVED DredgePlan of the same project -> SUPERSEDED (create-with-supersede)"
          - "Project.version incremented (OCC observable)"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (another DredgePlan of the same project is APPROVED)"
        actor: system
        preconditions: []
        side_effects: ["DredgeEvent creation no longer accepts this plan's window"]

  - entity: Survey
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /surveys/{id}/accept (OCC: expected_reach_version; segregation: caller X-User-ID != survey.submitted_by_user_id)"
        actor: OwnerEngineer
        preconditions:
          - "expected_reach_version == Reach.version (else ERR_STALE_REACH_VERSION, 412)"
          - "caller != submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "If supersedes_survey_id set: that survey (same reach+kind, ACCEPTED) -> SUPERSEDED"
          - "PRE_DREDGE: reach PENDING -> PRE_SURVEYED; reach PRE_SURVEYED: prior ACCEPTED pre-dredge survey -> SUPERSEDED, reach stays PRE_SURVEYED, removed_in_place_cy recomputed"
          - "POST_DREDGE: reach -> ACCEPTED if min_sounding_depth_ft >= required_depth_ft else reach -> DREDGING; removed_in_place_cy recomputed against latest ACCEPTED pre-dredge survey"
          - "Reach.version incremented (OCC observable)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /surveys/{id}/reject (segregation: caller != submitted_by_user_id)"
        actor: OwnerEngineer
        preconditions: ["caller != submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["POST_DREDGE rejection: reach POST_SURVEY_SUBMITTED -> DREDGING"]
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system (a newer Survey of the same reach+kind naming this one (or any prior) via supersedes_survey_id is ACCEPTED)"
        actor: system
        preconditions: []
        side_effects: ["removed_in_place_cy recomputed for the reach (INV-S identity maintained)"]

  - entity: DredgeEvent
    initial_state: ACTIVE
    terminal_states: [COMPLETED]
    transitions:
      - from: ACTIVE
        to: SHUTDOWN
        trigger: "system (project posture flips to SUSPENDED via SpeciesSighting creation, ceiling turbidity reading, or clock-driven window exit; OR plant -> OUT_OF_SERVICE)"
        actor: system
        preconditions: []
        side_effects:
          - "shutdown_reason := SPECIES | TURBIDITY | EQUIPMENT | WINDOW per trigger"
          - "last_shutdown_at := now; shutdown accumulation begins (standby eligibility accrues)"
      - from: SHUTDOWN
        to: ACTIVE
        trigger: "POST /dredge-events/{id}/resume"
        actor: ContractorOps
        preconditions:
          - "Project.compliance_posture != SUSPENDED (else ERR_EVENT_NOT_RESUMABLE)"
          - "If shutdown_reason == EQUIPMENT: plant.status == REGISTERED (else ERR_EVENT_NOT_RESUMABLE)"
        side_effects:
          - "shutdown_accumulated_hours += (now - last_shutdown_at) in hours, round_half_up 2dp"
          - "shutdown_reason := null, last_shutdown_at := null"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /dredge-events/{id}/complete"
        actor: ContractorOps
        preconditions: []
        side_effects: ["ended_utc := now"]
      - from: SHUTDOWN
        to: COMPLETED
        trigger: "POST /dredge-events/{id}/complete (completing out of a shutdown)"
        actor: ContractorOps
        preconditions: []
        side_effects:
          - "shutdown_accumulated_hours += (now - last_shutdown_at), round_half_up 2dp"
          - "ended_utc := now"

  - entity: PlacementTicket
    initial_state: REPORTED
    terminal_states: [REJECTED, VOIDED]
    transitions:
      - from: REPORTED
        to: CONFIRMED
        trigger: "POST /placement-tickets/{id}/confirm (segregation: caller != reported_by_user_id)"
        actor: SiteOperator
        preconditions:
          - "caller != reported_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "placed_utc inside an ISSUED Permit closed window of the event's project (else ERR_PLACEMENT_OUT_OF_WINDOW)"
          - "site.used_cy + witnessed_volume_cy <= site.capacity_cy — exact fill allowed (else ERR_DISPOSAL_CAPACITY_EXCEEDED)"
        side_effects:
          - "in_situ_volume_cy := round_half_up(witnessed_volume_cy / site.bulking_factor, 2) (per-ticket rounding, pinned)"
          - "site.used_cy += witnessed_volume_cy (cascade link 1)"
          - "site.remaining_cy recomputed; if remaining_cy == 0 then site OPEN -> FULL (cascade link 2, caused by the used_cy mutation)"
      - from: REPORTED
        to: REJECTED
        trigger: "POST /placement-tickets/{id}/reject (segregation: caller != reported_by_user_id)"
        actor: SiteOperator
        preconditions: ["caller != reported_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["No capacity debit"]
      - from: CONFIRMED
        to: VOIDED
        trigger: "POST /placement-tickets/{id}/void"
        actor: SiteOperator
        preconditions: []
        side_effects:
          - "site.used_cy -= witnessed_volume_cy (compensation of the confirm)"
          - "site.remaining_cy recomputed; if site was FULL and remaining_cy > 0 then site FULL -> OPEN"
          - "INV-1 restored: used_cy + remaining_cy == capacity_cy unchanged net across confirm+void"

  - entity: DisposalSite
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: FULL
        trigger: "system (a PlacementTicket confirm drives remaining_cy to exactly 0)"
        actor: system
        preconditions: []
        side_effects: ["Subsequent ticket creation against this site rejected with ERR_DISPOSAL_SITE_NOT_OPEN"]
      - from: FULL
        to: OPEN
        trigger: "system (a PlacementTicket void raises remaining_cy above 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /disposal-sites/{id}/close"
        actor: OwnerEngineer
        preconditions: ["No PlacementTicket of this site in REPORTED (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: FULL
        to: CLOSED
        trigger: "POST /disposal-sites/{id}/close"
        actor: OwnerEngineer
        preconditions: ["No PlacementTicket of this site in REPORTED (else ERR_INVALID_STATE)"]
        side_effects: []

  - entity: StandbyClaim
    initial_state: SUBMITTED
    terminal_states: [DENIED, SETTLED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /standby-claims/{id}/approve (segregation: caller != claimed_by_user_id)"
        actor: OwnerEngineer
        preconditions:
          - "caller != claimed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "Claim period overlaps at least one ISSUED Permit closed window of the project (else ERR_CLAIM_PERIOD_OUTSIDE_WINDOW)"
          - "reason != EQUIPMENT_BREAKDOWN (else ERR_CLAIM_NOT_PAYABLE)"
        side_effects: ["payable_hours and payable_amount_cents frozen as computed at approval"]
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /standby-claims/{id}/deny (segregation: caller != claimed_by_user_id)"
        actor: OwnerEngineer
        preconditions: ["caller != claimed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: []
      - from: APPROVED
        to: SETTLED
        trigger: "system (a PaymentCertificate listing this claim in standby_claim_ids is CERTIFIED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SETTLED
        to: APPROVED
        trigger: "system (the settling PaymentCertificate is VOIDED — compensation)"
        actor: system
        preconditions: []
        side_effects: ["Claim becomes re-includable in a later certificate"]

  - entity: SpeciesSighting
    initial_state: ACTIVE
    terminal_states: [CLEARED]
    transitions:
      - from: ACTIVE
        to: CLEARED
        trigger: "POST /species-sightings/{id}/clear"
        actor: EnvironmentalMonitor
        preconditions:
          - "logical now >= observed_utc + species_standdown_hours of the governing ISSUED permit — equality allowed (else ERR_SPECIES_COOLDOWN_ACTIVE)"
        side_effects:
          - "Recompute project compliance_posture; when the last ACTIVE sighting clears, posture leaves SUSPENDED (unless turbidity/window still suspends)"
          - "Events are NOT auto-resumed — each SHUTDOWN event needs an explicit resume (asymmetry)"
    note: "Creation is the cascade origin: posture -> SUSPENDED -> ACTIVE events -> SHUTDOWN (reason SPECIES) -> standby hours accrue"

  - entity: PaymentCertificate
    initial_state: DRAFT
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /payment-certificates/{id}/submit — FINAL with reconciliation_delta_pct <= RECON_TOLERANCE_PCT, or any INTERIM"
        actor: ContractorOps
        preconditions:
          - "FINAL requires every reach in reach_ids ACCEPTED (else ERR_FINAL_ACCEPTANCE_INCOMPLETE)"
        side_effects:
          - "Computed snapshot frozen: quantity_cy, quantity_amount_cents, standby_amount_cents, liquidated_damages_cents, reconciliation_delta_pct, total_amount_cents"
      - from: DRAFT
        to: AUDIT_HOLD
        trigger: "system (same submit call, FINAL certificate whose reconciliation_delta_pct > RECON_TOLERANCE_PCT — automatic fork)"
        actor: system
        preconditions: []
        side_effects: ["Computed snapshot frozen as on the SUBMITTED path; certificate cannot be paid until override-certified"]
      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /payment-certificates/{id}/certify (segregation: caller != submitted_by_user_id)"
        actor: OwnerEngineer
        preconditions: ["caller != submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"]
        side_effects:
          - "Each reach.cumulative_certified_quantity_cy += its line quantity"
          - "Each listed StandbyClaim APPROVED -> SETTLED"
          - "project.total_certified_cents += total_amount_cents; outstanding_payable_cents recomputed"
      - from: AUDIT_HOLD
        to: CERTIFIED
        trigger: "POST /payment-certificates/{id}/certify with override_note (segregation: caller != submitted_by_user_id)"
        actor: OwnerEngineer
        preconditions:
          - "caller != submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "override_note present (else ERR_INVALID_REQUEST)"
        side_effects: ["Same certification side effects as SUBMITTED -> CERTIFIED"]
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /payment-certificates/{id}/dispute"
        actor: OwnerEngineer
        preconditions: []
        side_effects: ["Snapshot retained for reference; no ledger movement"]
      - from: DISPUTED
        to: DRAFT
        trigger: "POST /payment-certificates/{id}/revise (dispute revision loop)"
        actor: ContractorOps
        preconditions: []
        side_effects: ["Computed snapshot cleared; recomputed at next submit"]
      - from: CERTIFIED
        to: PAID
        trigger: "POST /payment-certificates/{id}/pay"
        actor: OwnerEngineer
        preconditions: []
        side_effects:
          - "project.total_paid_cents += total_amount_cents; outstanding_payable_cents recomputed"
      - from: CERTIFIED
        to: VOIDED
        trigger: "POST /payment-certificates/{id}/void (compensation of certification; PAID certificates cannot be voided)"
        actor: OwnerEngineer
        preconditions: []
        side_effects:
          - "project.total_certified_cents -= total_amount_cents (INV-2 restored: certify+void leaves total_certified_cents unchanged net)"
          - "Each reach.cumulative_certified_quantity_cy -= its line quantity (waterfall cursor restored)"
          - "Each listed StandbyClaim SETTLED -> APPROVED"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: plan-approve-stale-project
    parent_entity: Project
    write_endpoint: "POST /dredge-plans/{id}/approve"
    occ_field: "expected_project_version"
    description: |
      Approving a DredgePlan against a Project whose version has advanced since the
      client last observed it is rejected. Approving a plan legitimately supersedes
      the currently APPROVED plan, so a client holding a stale project view would
      otherwise supersede a plan it never saw; the stale-version check turns that
      into a deterministic 412.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
  - rule_id: survey-accept-stale-reach
    parent_entity: Reach
    write_endpoint: "POST /surveys/{id}/accept"
    occ_field: "expected_reach_version"
    description: |
      Accepting a Survey against a Reach whose version has advanced since the client
      last observed it is rejected. Acceptance of a same-kind survey legitimately
      supersedes the currently ACCEPTED survey of the reach, so a stale reach view
      would otherwise supersede a survey it never saw; the stale-version check turns
      that into a deterministic 412.
    error_id: ERR_STALE_REACH_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: compliance_posture
    trigger: "Recomputed on: permit creation/expiry, clock set, turbidity reading creation, species sighting creation/clear, and any event resume/complete that observes it"
    algorithm: threshold
    formula: |
      governing_permits = ISSUED Permits of project where window_start_utc <= now <= window_end_utc (CLOSED interval)
      if governing_permits is empty: posture = SUSPENDED          # includes "no ISSUED permit at all"
      else:
        P = the single governing permit (permits of a project never overlap, so at most one governs)
        if any SpeciesSighting of project has status == ACTIVE: posture = SUSPENDED
        else:
          W = TurbidityReadings of project with taken_utc in (now - P.turbidity_averaging_hours, now]  # half-open trailing window
          if any r in W has r.value_ntu >= P.turbidity_ceiling_ntu: posture = SUSPENDED   # equality suspends
          else if W non-empty and avg(value_ntu over W) >= P.turbidity_limit_ntu: posture = RESTRICTED  # equality restricts
          else: posture = CLEAR
      Precedence is fixed top-to-bottom as written. Window membership of readings uses taken_utc; average over empty set does NOT restrict.
    input_set: "Permits of project with status ISSUED; SpeciesSightings status ACTIVE; TurbidityReadings with taken_utc in trailing half-open window"
    constants:
      DEFAULT_LOGICAL_NOW: "2026-05-01T00:00:00Z"
    precision: "average carried at full precision; comparison is >= on the exact average"

  - name: production_estimate
    trigger: "DredgePlan creation and each resubmission"
    algorithm: tiered_pricing
    formula: |
      total_design_cy = sum(design_quantity_cy over all Reaches of the project at evaluation time)
      material_factor = MATERIAL_FACTOR[plan.material_class]        # DredgePlan input, pinned
      max_required_depth = max(required_depth_ft over project reaches)
      depth_factor = 1.00 if max_required_depth < 30; 0.85 if 30 <= max_required_depth < 50; 0.70 if >= 50
      nominal_daily = round_half_up(rated_daily_production_cy x material_factor x depth_factor, 2)
      risk_daily    = round_half_up(nominal_daily x (1 - WEATHER_ALLOWANCE_PCT), 2)
      nominal_duration_days      = ceil(total_design_cy / nominal_daily)
      risk_adjusted_duration_days = ceil(total_design_cy / risk_daily)
    input_set: "All Reaches of the project (any status); the plan's DredgePlant"
    constants:
      WEATHER_ALLOWANCE_PCT: 0.20
      MATERIAL_FACTOR: { SAND: 1.00, SILT: 0.85, CLAY: 0.70, GRAVEL: 0.55, ROCK: 0.35 }
    precision: "daily rates 2 decimal places round_half_up; durations integer ceiling"
    variants:
      - name: NOMINAL
        when: "bid/schedule view; also displayed at approval"
        difference: "no weather allowance: nominal_daily as above"
      - name: RISK_ADJUSTED
        when: "window-feasibility check at approval and allowed_days_frozen snapshot at activation"
        difference: "applies (1 - WEATHER_ALLOWANCE_PCT) derate; identical inputs yield a strictly smaller daily rate and a longer-or-equal duration"

  - name: scow_derived_quantity
    trigger: "PlacementTicket confirm (per-ticket term) and PaymentCertificate submit (aggregation)"
    algorithm: aggregation
    formula: |
      per ticket t: in_situ_t = round_half_up(t.witnessed_volume_cy / site(t).bulking_factor, 2)   # ROUND PER TICKET FIRST (pinned)
      certificate scow quantity = sum(in_situ_t over tickets in sweep)                            # THEN SUM
      INTERIM sweep: tickets with status CONFIRMED (not VOIDED), placed_utc in [period_start_utc, period_end_utc] (closed),
        whose DredgeEvent.reach_id is in reach_ids
      FINAL sweep: same but all-time (no period filter)
      PINNED ORDER: per-ticket rounding precedes summation; sum-then-divide is a spec violation.
    input_set: "PlacementTickets status CONFIRMED (excluding VOIDED), filtered by reach and (INTERIM only) placed_utc closed interval"
    precision: "2 decimal places, round_half_up, per ticket before summation"

  - name: survey_derived_quantity
    trigger: "POST_DREDGE Survey acceptance (per reach) and FINAL PaymentCertificate submit (aggregation)"
    algorithm: aggregation
    formula: |
      per reach r: removed_r = max(0, V_pre(r) - V_post(r)) where V_pre = measured_volume_cy of the latest ACCEPTED PRE_DREDGE
      survey of r and V_post = measured_volume_cy of the latest ACCEPTED POST_DREDGE survey of r; "latest" by accepted order
      (acceptance created_at ASC; superseded surveys excluded). removed_r == r.removed_in_place_cy (INV-S identity).
      certificate survey total = sum(removed_r over reach_ids)
    input_set: "ACCEPTED, non-SUPERSEDED surveys per reach, latest per kind"
    precision: "2 decimal places, round_half_up"

  - name: quantity_payment
    trigger: "PaymentCertificate submit (per reach line, then summed)"
    algorithm: waterfall_allocation
    formula: |
      For each reach r in reach_ids, in reach_ids order as given in the request:
        q = line quantity of r (variant per certificate_type / measurement_basis)
        C = r.cumulative_certified_quantity_cy (prior CERTIFIED/PAID certificates only)
        D = r.design_quantity_cy; A = r.overdepth_allowance_cy; base = project.base_rate_cents_per_cy
        tier1_cap = round_half_up(0.8 x D, 2); tier2_cap = D; tier3_cap = D + A
        fill tier1: q1 = clamp(q, 0, max(0, tier1_cap - C));            amount1 = round_half_up(q1 x base x 1.00, 0)
        then tier2: q2 = clamp(q - q1, 0, max(0, tier2_cap - C - q1));  amount2 = round_half_up(q2 x base x 0.90, 0)
        then tier3: q3 = clamp(q - q1 - q2, 0, max(0, tier3_cap - C - q1 - q2)); amount3 = round_half_up(q3 x base x 0.75, 0)
        remainder beyond tier3: unpaid (rate 0)
        line_amount_r = amount1 + amount2 + amount3     # per-tier rounding, THEN sum (pinned)
      quantity_amount_cents = sum(line_amount_r)
    input_set: "Reaches in reach_ids with their cumulative_certified_quantity_cy from CERTIFIED/PAID certificates"
    constants:
      TIER1_PCT: 0.8
      TIER2_RATE: 0.90
      TIER3_RATE: 0.75
    precision: "per-tier line amounts integer cents round_half_up; tier caps 2dp round_half_up"

  - name: standby_payable_amount
    trigger: "StandbyClaim creation (computed fields) and freeze at approval"
    algorithm: threshold
    formula: |
      multiplier = 1.0 if reason in {WEATHER, OWNER_DIRECTED}; 0.5 if SPECIES_SHUTDOWN; 0 if EQUIPMENT_BREAKDOWN
      payable_hours = 0 if multiplier == 0 else max(0, claimed_hours - STANDBY_DEDUCTIBLE_HOURS)   # deductible applies per claim
      payable_amount_cents = round_half_up(payable_hours x project.standby_rate_cents_per_hour x multiplier, 0)
      # >= 3 inputs with non-linear interaction: deductible threshold, reason-branched multiplier, hourly rate product
    input_set: "The claim and its project rate"
    constants:
      STANDBY_DEDUCTIBLE_HOURS: 4.0
    precision: "hours 2dp; amount integer cents round_half_up"

  - name: final_settlement_total
    trigger: "FINAL PaymentCertificate submit"
    algorithm: constraint_propagation
    formula: |
      # Circular-looking dependency pinned to a strict evaluation order:
      # (1) allowed_days := project.allowed_days_frozen — SNAPSHOT taken at activation; later plan approvals/supersedes NEVER re-freeze it
      # (2) actual_days := ceil((period_end_utc - period_start_utc) / 24h)
      # (3) liquidated_damages_cents := project.liquidated_damages_cents_per_day x max(0, actual_days - allowed_days)
      # (4) standby_amount_cents := sum(payable_amount_cents over listed APPROVED claims)
      # (5) quantity_amount_cents := quantity_payment waterfall result
      # (6) total_amount_cents := quantity_amount_cents + standby_amount_cents - liquidated_damages_cents
      # LDs do NOT feed back into allowed_days; standby does NOT extend allowed_days; the frozen snapshot breaks the circle.
    input_set: "The FINAL certificate, its project (frozen fields), listed claims"
    precision: "integer cents"

  - name: disposal_remaining_capacity
    trigger: "PlacementTicket confirm / void"
    algorithm: aggregation
    formula: |
      used_cy = sum(witnessed_volume_cy over PlacementTickets of site with status CONFIRMED)   # VOIDED excluded; REPORTED/REJECTED never debit
      remaining_cy = capacity_cy - used_cy
      confirm gate: allowed iff used_cy + witnessed_volume_cy <= capacity_cy                   # EXACT FILL ALLOWED (<=)
      on exact fill (remaining_cy == 0): site OPEN -> FULL
      INV-1 invariant: used_cy + remaining_cy == capacity_cy at all times
    input_set: "PlacementTickets of the site with status CONFIRMED"
    precision: "2 decimal places (used/remaining), comparison on exact values"

  - name: reach_removed_quantity
    trigger: "Any Survey acceptance or supersede affecting the reach"
    algorithm: aggregation
    formula: |
      reach.removed_in_place_cy = max(0, V_pre - V_post) if an ACCEPTED non-SUPERSEDED POST_DREDGE survey exists, else 0
      where V_pre / V_post are the latest ACCEPTED non-SUPERSEDED surveys per kind (acceptance created_at ASC).
      INV-S invariant: after every accept/supersede cascade, removed_in_place_cy equals this identity — re-survey corrections re-derive, never drift.
    input_set: "Surveys of the reach with status ACCEPTED (SUPERSEDED excluded)"
    precision: "2 decimal places"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is listed in the endpoint's roles (authorization)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path ids then body FK ids exist, validated left-to-right; cross-referenced entities must belong to the same project where the domain implies it (ticket->event->reach->project chain)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: business_constraint
    check: "OCC: expected_<parent>_version matches current parent version (only on endpoints declaring the field)"
    error_id: "ERR_STALE_PROJECT_VERSION | ERR_STALE_REACH_VERSION"
    http_status: 412
    applies_to: "POST /dredge-plans/{id}/approve, POST /surveys/{id}/accept"
  - priority: 5
    category: business_constraint
    check: "Request shape: required fields present, enum members valid, numeric constraints (> 0, >= 0), end > start ordering, array element resolvability"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 6
    category: state
    check: "Target entity is in a valid from-state for the transition (incl. terminal lockdown, ERR_PROJECT_NOT_ACTIVE, ERR_REACH_NOT_DREDGABLE, ERR_EVENT_NOT_COMPLETED, ERR_FINAL_ACCEPTANCE_INCOMPLETE, ERR_SURVEY_KIND_MISMATCH)"
    error_id: "ERR_INVALID_STATE | ERR_PROJECT_NOT_ACTIVE | ERR_REACH_NOT_DREDGABLE | ERR_EVENT_NOT_COMPLETED | ERR_FINAL_ACCEPTANCE_INCOMPLETE | ERR_SURVEY_KIND_MISMATCH"
    http_status: 409
    applies_to: "all state-transition and state-gated creation endpoints"
  - priority: 7
    category: business_safety
    check: "Posture gate: SUSPENDED blocks dredge-event creation (ERR_POSTURE_SUSPENDED); RESTRICTED requires reduced_rate=true (ERR_POSTURE_RESTRICTED); resume requires non-SUSPENDED (ERR_EVENT_NOT_RESUMABLE)"
    error_id: "ERR_POSTURE_SUSPENDED | ERR_POSTURE_RESTRICTED | ERR_EVENT_NOT_RESUMABLE"
    http_status: 409
    applies_to: "POST /dredge-events, POST /dredge-events/{id}/resume"
  - priority: 8
    category: business_safety
    check: "Segregation of duties: caller X-User-ID must differ from the recorded submitter/reporter/claimant id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /surveys/{id}/accept, POST /surveys/{id}/reject, POST /placement-tickets/{id}/confirm, POST /placement-tickets/{id}/reject, POST /standby-claims/{id}/approve, POST /standby-claims/{id}/deny, POST /payment-certificates/{id}/certify"
  - priority: 9
    category: business_temporal
    check: "Interval rules: permit window closed-overlap on create (ERR_PERMIT_WINDOW_OVERLAP); plant assignment half-open overlap at plan approve (ERR_PLANT_ASSIGNMENT_OVERLAP); placed_utc within ISSUED permit window at confirm (ERR_PLACEMENT_OUT_OF_WINDOW); claim period overlaps an ISSUED window (ERR_CLAIM_PERIOD_OUTSIDE_WINDOW); sighting cooldown elapsed (ERR_SPECIES_COOLDOWN_ACTIVE)"
    error_id: "ERR_PERMIT_WINDOW_OVERLAP | ERR_PLANT_ASSIGNMENT_OVERLAP | ERR_PLACEMENT_OUT_OF_WINDOW | ERR_CLAIM_PERIOD_OUTSIDE_WINDOW | ERR_SPECIES_COOLDOWN_ACTIVE"
    http_status: 409
    applies_to: "POST /permits, POST /dredge-plans/{id}/approve, POST /placement-tickets/{id}/confirm, POST /standby-claims/{id}/approve, POST /species-sightings/{id}/clear"
  - priority: 10
    category: business_constraint
    check: "Capacity/aggregate: disposal capacity at confirm (ERR_DISPOSAL_CAPACITY_EXCEEDED); plan window feasibility vs risk-adjusted estimate (ERR_PLAN_WINDOW_INFEASIBLE); claimed_hours <= plant shutdown accumulation on project (ERR_STANDBY_HOURS_EXCEED_SHUTDOWN)"
    error_id: "ERR_DISPOSAL_CAPACITY_EXCEEDED | ERR_PLAN_WINDOW_INFEASIBLE | ERR_STANDBY_HOURS_EXCEED_SHUTDOWN"
    http_status: 422
    applies_to: "POST /placement-tickets/{id}/confirm, POST /dredge-plans/{id}/approve, POST /standby-claims"
  - priority: 11
    category: business_referential
    check: "Referenced-entity state: plant REGISTERED at plan approve (ERR_PLANT_UNAVAILABLE); APPROVED plan exists and covers started_utc at event creation (ERR_PLAN_NOT_APPROVED); disposal site OPEN at ticket creation (ERR_DISPOSAL_SITE_NOT_OPEN)"
    error_id: "ERR_PLANT_UNAVAILABLE | ERR_PLAN_NOT_APPROVED | ERR_DISPOSAL_SITE_NOT_OPEN"
    http_status: 409
    applies_to: "POST /dredge-plans/{id}/approve, POST /dredge-events, POST /placement-tickets"
  - priority: 12
    category: business_fiscal
    check: "Payment rules last: EQUIPMENT_BREAKDOWN claims not payable (ERR_CLAIM_NOT_PAYABLE); certificate claim inclusion requires APPROVED (ERR_CLAIM_NOT_APPROVED)"
    error_id: "ERR_CLAIM_NOT_PAYABLE | ERR_CLAIM_NOT_APPROVED"
    http_status: 422
    applies_to: "POST /standby-claims/{id}/approve, POST /payment-certificates"

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table (flat: all collections top-level)
# =============================================================================
endpoints:
  # --- logical clock (test-driving endpoint; default time mandatory) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-05-01T00:00:00Z and the clock MUST NOT fall back to wall-clock time; setting the clock triggers permit expiry evaluation, posture recompute, and window-exit auto-shutdown of ACTIVE DredgeEvents. Monotonic: setting the clock backwards is ERR_INVALID_REQUEST."
    roles: [OwnerEngineer]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["ISSUED permits with now > window_end_utc -> EXPIRED", "compliance_posture recomputed per project", "ACTIVE DredgeEvents of projects whose posture became SUSPENDED by window exit -> SHUTDOWN with shutdown_reason=WINDOW"]
  # --- Project ---
  - method: POST
    path: "/projects"
    description: "Create a dredging project"
    roles: [OwnerEngineer]
    code: 201
    input: [name, measurement_basis, base_rate_cents_per_cy, standby_rate_cents_per_hour, liquidated_damages_cents_per_day]
    output: Project
    side_effects: ["status=PLANNED", "compliance_posture=SUSPENDED (no ISSUED permit)", "total_certified_cents=0, total_paid_cents=0"]
  - method: GET
    path: "/projects/{id}"
    description: "Get a project"
    roles: [OwnerEngineer, ContractorOps, SurveyParty, EnvironmentalMonitor, SiteOperator]
    code: 200
    input: []
    output: Project
    side_effects: []
  - method: GET
    path: "/projects"
    description: "List projects (paginated)"
    roles: [OwnerEngineer, ContractorOps, SurveyParty, EnvironmentalMonitor, SiteOperator]
    code: 200
    input: ["status?", "compliance_posture?"]
    output: Project[]
    side_effects: []
  - method: POST
    path: "/projects/{id}/activate"
    description: "Activate project (PLANNED -> ACTIVE); freezes allowed_days_frozen from the APPROVED plan"
    roles: [OwnerEngineer]
    code: 200
    input: []
    output: Project
    side_effects: ["allowed_days_frozen := risk_adjusted_duration_days of the APPROVED plan", "Project.version += 1"]
  - method: POST
    path: "/projects/{id}/close-out"
    description: "Close out project (ACTIVE -> CLOSED_OUT) with full child-state gates"
    roles: [OwnerEngineer]
    code: 200
    input: []
    output: Project
    side_effects: ["Project.version += 1"]

  # --- Permit ---
  - method: POST
    path: "/permits"
    description: "Issue an environmental permit (created directly in ISSUED); closed-interval window overlap with another ISSUED permit of the same project is rejected"
    roles: [OwnerEngineer]
    code: 201
    input: [project_id, permit_number, window_start_utc, window_end_utc, turbidity_limit_ntu, turbidity_ceiling_ntu, turbidity_averaging_hours, species_standdown_hours]
    output: Permit
    side_effects: ["status=ISSUED", "recompute project compliance_posture"]
  - method: GET
    path: "/permits/{id}"
    description: "Get a permit"
    roles: [OwnerEngineer, ContractorOps, SurveyParty, EnvironmentalMonitor, SiteOperator]
    code: 200
    input: []
    output: Permit
    side_effects: []
  - method: GET
    path: "/permits"
    description: "List permits (paginated); reverse-reachability for Permit.project_id"
    roles: [OwnerEngineer, ContractorOps, SurveyParty, EnvironmentalMonitor, SiteOperator]
    code: 200
    input: ["project_id?", "status?"]
    output: Permit[]
    side_effects: []

  # --- Reach ---
  - method: POST
    path: "/reaches"
    description: "Create a reach of a project"
    roles: [OwnerEngineer]
    code: 201
    input: [project_id, name, design_quantity_cy, required_depth_ft, allowable_overdepth_ft, overdepth_allowance_cy]
    output: Reach
    side_effects: ["status=PENDING", "removed_in_place_cy=0", "cumulative_certified_quantity_cy=0"]
  - method: GET
    path: "/reaches/{id}"
    description: "Get a reach"
    roles: [OwnerEngineer, ContractorOps, SurveyParty, EnvironmentalMonitor, SiteOperator]
    code: 200
    input: []
    output: Reach
    side_effects: []
  - method: GET
    path: "/reaches"
    description: "List reaches (paginated); reverse-reachability for Reach.project_id"
    roles: [OwnerEngineer, ContractorOps, SurveyParty, EnvironmentalMonitor, SiteOperator]
    code: 200
    input: ["project_id?", "status?"]
    output: Reach[]
    side_effects: []
  - method: POST
    path: "/reaches/{id}/begin-dredging"
    description: "Reach PRE_SURVEYED -> DREDGING; requires project ACTIVE and an APPROVED plan"
    roles: [ContractorOps]
    code: 200
    input: []
    output: Reach
    side_effects: ["Reach.version += 1"]

  # --- DredgePlant ---
  - method: POST
    path: "/plants"
    description: "Register a dredge plant"
    roles: [ContractorOps]
    code: 201
    input: [contractor_ref, plant_type, rated_daily_production_cy]
    output: DredgePlant
    side_effects: ["status=REGISTERED"]
  - method: GET
    path: "/plants/{id}"
    description: "Get a plant"
    roles: [OwnerEngineer, ContractorOps, SurveyParty, EnvironmentalMonitor, SiteOperator]
    code: 200
    input: []
    output: DredgePlant
    side_effects: []
  - method: GET
    path: "/plants"
    description: "List plants (paginated)"
    roles: [OwnerEngineer, ContractorOps, SurveyParty, EnvironmentalMonitor, SiteOperator]
    code: 200
    input: ["status?", "plant_type?"]
    output: DredgePlant[]
    side_effects: []
  - method: PATCH
    path: "/plants/{id}"
    description: "Set plant service status (REGISTERED | OUT_OF_SERVICE | RETIRED); OUT_OF_SERVICE cascades ACTIVE events to SHUTDOWN (reason EQUIPMENT)"
    roles: [ContractorOps]
    code: 200
    input: [status]
    output: DredgePlant
    side_effects: ["OUT_OF_SERVICE: ACTIVE DredgeEvents of plant -> SHUTDOWN (EQUIPMENT)", "REGISTERED: no auto-resume"]

  # --- DredgePlan ---
  - method: POST
    path: "/dredge-plans"
    description: "Create a dredge plan (dredge type selection + production estimate computed)"
    roles: [ContractorOps]
    code: 201
    input: [project_id, plant_id, material_class, planned_start_utc, planned_end_utc]
    output: DredgePlan
    side_effects: ["status=DRAFT, revision=1", "production_estimate computed (both variants)"]
  - method: GET
    path: "/dredge-plans/{id}"
    description: "Get a dredge plan"
    roles: [OwnerEngineer, ContractorOps, SurveyParty, EnvironmentalMonitor, SiteOperator]
    code: 200
    input: []
    output: DredgePlan
    side_effects: []
  - method: GET
    path: "/dredge-plans"
    description: "List dredge plans (paginated); reverse-reachability for project_id and plant_id"
    roles: [OwnerEngineer, ContractorOps, SurveyParty, EnvironmentalMonitor, SiteOperator]
    code: 200
    input: ["project_id?", "plant_id?", "status?"]
    output: DredgePlan[]
    side_effects: []
  - method: POST
    path: "/dredge-plans/{id}/submit"
    description: "Submit plan (DRAFT -> SUBMITTED, or CHANGES_REQUESTED -> SUBMITTED with revision += 1)"
    roles: [ContractorOps]
    code: 200
    input: []
    output: DredgePlan
    side_effects: ["on revision: estimates recomputed"]
  - method: POST
    path: "/dredge-plans/{id}/request-changes"
    description: "Owner requests changes (SUBMITTED -> CHANGES_REQUESTED)"
    roles: [OwnerEngineer]
    code: 200
    input: []
    output: DredgePlan
    side_effects: []
  - method: POST
    path: "/dredge-plans/{id}/approve"
    description: "Approve plan (SUBMITTED -> APPROVED); supersedes any APPROVED plan of the project; OCC on Project.version; checks plant availability, half-open assignment overlap, window feasibility"
    roles: [OwnerEngineer]
    code: 200
    input: [expected_project_version]
    output: DredgePlan
    side_effects: ["prior APPROVED plan of project -> SUPERSEDED", "Project.version += 1"]

  # --- Survey ---
  - method: POST
    path: "/surveys"
    description: "Submit a hydrographic survey; kind gate: PRE_DREDGE requires reach PENDING or PRE_SURVEYED, POST_DREDGE requires reach DREDGING (else ERR_SURVEY_KIND_MISMATCH); POST_DREDGE creation flips reach to POST_SURVEY_SUBMITTED"
    roles: [SurveyParty]
    code: 201
    input: [reach_id, kind, measured_volume_cy, min_sounding_depth_ft, "supersedes_survey_id?"]
    output: Survey
    side_effects: ["status=SUBMITTED", "submitted_by_user_id := X-User-ID", "POST_DREDGE: reach DREDGING -> POST_SURVEY_SUBMITTED"]
  - method: GET
    path: "/surveys/{id}"
    description: "Get a survey"
    roles: [OwnerEngineer, ContractorOps, SurveyParty, EnvironmentalMonitor, SiteOperator]
    code: 200
    input: []
    output: Survey
    side_effects: []
  - method: GET
    path: "/surveys"
    description: "List surveys (paginated); reverse-reachability for reach_id and the self-referential supersedes_survey_id"
    roles: [OwnerEngineer, ContractorOps, SurveyParty, EnvironmentalMonitor, SiteOperator]
    code: 200
    input: ["reach_id?", "kind?", "status?", "supersedes_survey_id?"]
    output: Survey[]
    side_effects: []
  - method: POST
    path: "/surveys/{id}/accept"
    description: "Accept survey (SUBMITTED -> ACCEPTED); OCC on Reach.version; segregation vs submitted_by_user_id; cascades reach state + removed_in_place_cy recompute + supersedes"
    roles: [OwnerEngineer]
    code: 200
    input: [expected_reach_version]
    output: Survey
    side_effects: ["superseded survey -> SUPERSEDED", "reach transition per kind/depth outcome", "Reach.version += 1"]
  - method: POST
    path: "/surveys/{id}/reject"
    description: "Reject survey (SUBMITTED -> REJECTED); segregation vs submitted_by_user_id; POST_DREDGE rejection returns reach to DREDGING"
    roles: [OwnerEngineer]
    code: 200
    input: []
    output: Survey
    side_effects: ["POST_DREDGE: reach POST_SURVEY_SUBMITTED -> DREDGING"]

  # --- DredgeEvent ---
  - method: POST
    path: "/dredge-events"
    description: "Open a dredge work event; gated by reach state, posture (SUSPENDED rejects, RESTRICTED requires reduced_rate=true), plant availability, and APPROVED plan window coverage of started_utc"
    roles: [ContractorOps]
    code: 201
    input: [reach_id, plant_id, started_utc, "reduced_rate?"]
    output: DredgeEvent
    side_effects: ["status=ACTIVE", "shutdown_accumulated_hours=0"]
  - method: GET
    path: "/dredge-events/{id}"
    description: "Get a dredge event"
    roles: [OwnerEngineer, ContractorOps, SurveyParty, EnvironmentalMonitor, SiteOperator]
    code: 200
    input: []
    output: DredgeEvent
    side_effects: []
  - method: GET
    path: "/dredge-events"
    description: "List dredge events (paginated); reverse-reachability for reach_id and plant_id"
    roles: [OwnerEngineer, ContractorOps, SurveyParty, EnvironmentalMonitor, SiteOperator]
    code: 200
    input: ["reach_id?", "plant_id?", "status?"]
    output: DredgeEvent[]
    side_effects: []
  - method: POST
    path: "/dredge-events/{id}/complete"
    description: "Complete event from ACTIVE or SHUTDOWN; accrues open shutdown interval into shutdown_accumulated_hours"
    roles: [ContractorOps]
    code: 200
    input: []
    output: DredgeEvent
    side_effects: ["ended_utc := now", "shutdown accrual settled"]
  - method: POST
    path: "/dredge-events/{id}/resume"
    description: "Resume a SHUTDOWN event; requires posture != SUSPENDED and (EQUIPMENT only) plant REGISTERED"
    roles: [ContractorOps]
    code: 200
    input: []
    output: DredgeEvent
    side_effects: ["shutdown_accumulated_hours += now - last_shutdown_at (round_half_up 2dp)"]

  # --- TurbidityReading ---
  - method: POST
    path: "/turbidity-readings"
    description: "Record a turbidity sample; triggers posture recompute; a reading >= ceiling suspends the project and auto-shuts ACTIVE events (reason TURBIDITY)"
    roles: [EnvironmentalMonitor]
    code: 201
    input: [project_id, value_ntu, taken_utc]
    output: TurbidityReading
    side_effects: ["posture recompute", "on SUSPENDED flip: ACTIVE events -> SHUTDOWN (TURBIDITY)"]
  - method: GET
    path: "/turbidity-readings/{id}"
    description: "Get a turbidity reading"
    roles: [OwnerEngineer, ContractorOps, SurveyParty, EnvironmentalMonitor, SiteOperator]
    code: 200
    input: []
    output: TurbidityReading
    side_effects: []
  - method: GET
    path: "/turbidity-readings"
    description: "List turbidity readings (paginated); reverse-reachability for project_id"
    roles: [OwnerEngineer, ContractorOps, SurveyParty, EnvironmentalMonitor, SiteOperator]
    code: 200
    input: ["project_id?"]
    output: TurbidityReading[]
    side_effects: []

  # --- SpeciesSighting ---
  - method: POST
    path: "/species-sightings"
    description: "Report an endangered-species sighting; posture -> SUSPENDED and ACTIVE events of the project -> SHUTDOWN (reason SPECIES)"
    roles: [EnvironmentalMonitor]
    code: 201
    input: [project_id, species_class, observed_utc]
    output: SpeciesSighting
    side_effects: ["status=ACTIVE", "posture recompute -> SUSPENDED", "ACTIVE events -> SHUTDOWN (SPECIES), last_shutdown_at := now"]
  - method: GET
    path: "/species-sightings/{id}"
    description: "Get a sighting"
    roles: [OwnerEngineer, ContractorOps, SurveyParty, EnvironmentalMonitor, SiteOperator]
    code: 200
    input: []
    output: SpeciesSighting
    side_effects: []
  - method: GET
    path: "/species-sightings"
    description: "List sightings (paginated); reverse-reachability for project_id"
    roles: [OwnerEngineer, ContractorOps, SurveyParty, EnvironmentalMonitor, SiteOperator]
    code: 200
    input: ["project_id?", "status?"]
    output: SpeciesSighting[]
    side_effects: []
  - method: POST
    path: "/species-sightings/{id}/clear"
    description: "Clear a sighting after the standdown cooldown (equality allowed); posture recomputed; events NOT auto-resumed"
    roles: [EnvironmentalMonitor]
    code: 200
    input: []
    output: SpeciesSighting
    side_effects: ["cleared_at := now", "posture recompute"]

  # --- DisposalSite ---
  - method: POST
    path: "/disposal-sites"
    description: "Create a disposal site with capacity and bulking factor"
    roles: [OwnerEngineer]
    code: 201
    input: [name, site_type, capacity_cy, bulking_factor]
    output: DisposalSite
    side_effects: ["status=OPEN", "used_cy=0, remaining_cy=capacity_cy"]
  - method: GET
    path: "/disposal-sites/{id}"
    description: "Get a disposal site"
    roles: [OwnerEngineer, ContractorOps, SurveyParty, EnvironmentalMonitor, SiteOperator]
    code: 200
    input: []
    output: DisposalSite
    side_effects: []
  - method: GET
    path: "/disposal-sites"
    description: "List disposal sites (paginated)"
    roles: [OwnerEngineer, ContractorOps, SurveyParty, EnvironmentalMonitor, SiteOperator]
    code: 200
    input: ["status?"]
    output: DisposalSite[]
    side_effects: []
  - method: POST
    path: "/disposal-sites/{id}/close"
    description: "Close a site (OPEN|FULL -> CLOSED); blocked while REPORTED tickets exist"
    roles: [OwnerEngineer]
    code: 200
    input: []
    output: DisposalSite
    side_effects: []

  # --- PlacementTicket ---
  - method: POST
    path: "/placement-tickets"
    description: "Report a scow placement; event must be COMPLETED and site OPEN"
    roles: [ContractorOps]
    code: 201
    input: [dredge_event_id, disposal_site_id, placed_utc, declared_volume_cy]
    output: PlacementTicket
    side_effects: ["status=REPORTED", "reported_by_user_id := X-User-ID"]
  - method: GET
    path: "/placement-tickets/{id}"
    description: "Get a placement ticket"
    roles: [OwnerEngineer, ContractorOps, SurveyParty, EnvironmentalMonitor, SiteOperator]
    code: 200
    input: []
    output: PlacementTicket
    side_effects: []
  - method: GET
    path: "/placement-tickets"
    description: "List placement tickets (paginated); reverse-reachability for dredge_event_id and disposal_site_id"
    roles: [OwnerEngineer, ContractorOps, SurveyParty, EnvironmentalMonitor, SiteOperator]
    code: 200
    input: ["dredge_event_id?", "disposal_site_id?", "status?"]
    output: PlacementTicket[]
    side_effects: []
  - method: POST
    path: "/placement-tickets/{id}/confirm"
    description: "Confirm a ticket with witnessed volume; segregation vs reporter; placement-window check; capacity gate (exact fill allowed); debits site capacity and may flip site to FULL"
    roles: [SiteOperator]
    code: 200
    input: [witnessed_volume_cy]
    output: PlacementTicket
    side_effects: ["in_situ_volume_cy computed (per-ticket rounding)", "site.used_cy += witnessed_volume_cy", "site -> FULL if remaining hits 0"]
  - method: POST
    path: "/placement-tickets/{id}/reject"
    description: "Reject a ticket; segregation vs reporter; no capacity debit"
    roles: [SiteOperator]
    code: 200
    input: []
    output: PlacementTicket
    side_effects: []
  - method: POST
    path: "/placement-tickets/{id}/void"
    description: "Void a CONFIRMED ticket; restores site capacity and may reopen a FULL site"
    roles: [SiteOperator]
    code: 200
    input: []
    output: PlacementTicket
    side_effects: ["site.used_cy -= witnessed_volume_cy", "site FULL -> OPEN if remaining > 0"]

  # --- StandbyClaim ---
  - method: POST
    path: "/standby-claims"
    description: "Claim standby for weather/shutdown/owner/equipment causes; claimed_hours must not exceed the plant's shutdown accumulation on the project"
    roles: [ContractorOps]
    code: 201
    input: [project_id, plant_id, period_start_utc, period_end_utc, claimed_hours, reason]
    output: StandbyClaim
    side_effects: ["status=SUBMITTED", "payable_hours/payable_amount_cents computed", "claimed_by_user_id := X-User-ID"]
  - method: GET
    path: "/standby-claims/{id}"
    description: "Get a standby claim"
    roles: [OwnerEngineer, ContractorOps, SurveyParty, EnvironmentalMonitor, SiteOperator]
    code: 200
    input: []
    output: StandbyClaim
    side_effects: []
  - method: GET
    path: "/standby-claims"
    description: "List standby claims (paginated); reverse-reachability for project_id and plant_id"
    roles: [OwnerEngineer, ContractorOps, SurveyParty, EnvironmentalMonitor, SiteOperator]
    code: 200
    input: ["project_id?", "plant_id?", "status?"]
    output: StandbyClaim[]
    side_effects: []
  - method: POST
    path: "/standby-claims/{id}/approve"
    description: "Approve a claim; segregation vs claimant; period must overlap an ISSUED window; EQUIPMENT_BREAKDOWN not payable"
    roles: [OwnerEngineer]
    code: 200
    input: []
    output: StandbyClaim
    side_effects: ["payable fields frozen"]
  - method: POST
    path: "/standby-claims/{id}/deny"
    description: "Deny a claim; segregation vs claimant"
    roles: [OwnerEngineer]
    code: 200
    input: []
    output: StandbyClaim
    side_effects: []

  # --- PaymentCertificate ---
  - method: POST
    path: "/payment-certificates"
    description: "Create a payment certificate (DRAFT); FINAL requires every listed reach ACCEPTED; listed claims must be APPROVED, same project, not SETTLED"
    roles: [ContractorOps]
    code: 201
    input: [project_id, certificate_type, period_start_utc, period_end_utc, reach_ids, "standby_claim_ids?"]
    output: PaymentCertificate
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/payment-certificates/{id}"
    description: "Get a payment certificate"
    roles: [OwnerEngineer, ContractorOps, SurveyParty, EnvironmentalMonitor, SiteOperator]
    code: 200
    input: []
    output: PaymentCertificate
    side_effects: []
  - method: GET
    path: "/payment-certificates"
    description: "List payment certificates (paginated); reverse-reachability for project_id"
    roles: [OwnerEngineer, ContractorOps, SurveyParty, EnvironmentalMonitor, SiteOperator]
    code: 200
    input: ["project_id?", "status?", "certificate_type?"]
    output: PaymentCertificate[]
    side_effects: []
  - method: POST
    path: "/payment-certificates/{id}/submit"
    description: "Submit certificate; computes and freezes all amounts; FINAL with reconciliation_delta_pct > 15% forks to AUDIT_HOLD"
    roles: [ContractorOps]
    code: 200
    input: []
    output: PaymentCertificate
    side_effects: ["computed snapshot frozen", "DRAFT -> SUBMITTED or AUDIT_HOLD"]
  - method: POST
    path: "/payment-certificates/{id}/certify"
    description: "Certify a SUBMITTED certificate, or an AUDIT_HOLD certificate with override_note; segregation vs submitter; moves ledger, settles claims, advances waterfall cursors"
    roles: [OwnerEngineer]
    code: 200
    input: ["override_note?"]
    output: PaymentCertificate
    side_effects: ["reach.cumulative_certified_quantity_cy += line quantity", "listed claims APPROVED -> SETTLED", "project.total_certified_cents += total_amount_cents"]
  - method: POST
    path: "/payment-certificates/{id}/dispute"
    description: "Dispute a SUBMITTED certificate"
    roles: [OwnerEngineer]
    code: 200
    input: []
    output: PaymentCertificate
    side_effects: []
  - method: POST
    path: "/payment-certificates/{id}/revise"
    description: "Return a DISPUTED certificate to DRAFT for recomputation"
    roles: [ContractorOps]
    code: 200
    input: []
    output: PaymentCertificate
    side_effects: ["computed snapshot cleared"]
  - method: POST
    path: "/payment-certificates/{id}/void"
    description: "Void a CERTIFIED (not PAID) certificate; full compensation of certification side effects"
    roles: [OwnerEngineer]
    code: 200
    input: []
    output: PaymentCertificate
    side_effects: ["project.total_certified_cents -= total_amount_cents", "reach cursors decremented", "claims SETTLED -> APPROVED"]
  - method: POST
    path: "/payment-certificates/{id}/pay"
    description: "Pay a CERTIFIED certificate"
    roles: [OwnerEngineer]
    code: 200
    input: []
    output: PaymentCertificate
    side_effects: ["project.total_paid_cents += total_amount_cents", "outstanding_payable_cents recomputed"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Authenticated role is not in the endpoint's allowed roles" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced id does not exist (path left-to-right, then body FKs), or cross-referenced entities belong to different projects" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, unknown enum member, non-positive quantity, end <= start, unresolvable array element, missing override_note on AUDIT_HOLD certify, clock set backwards" }
  - { id: ERR_STALE_PROJECT_VERSION, http: 412, condition: "expected_project_version != current Project.version on plan approve (OCC)" }
  - { id: ERR_STALE_REACH_VERSION, http: 412, condition: "expected_reach_version != current Reach.version on survey accept (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic wrong-from-state for the requested transition, incl. terminal-state lockdown and plant retire with open events" }
  - { id: ERR_PROJECT_NOT_ACTIVE, http: 409, condition: "Operation requires Project.status == ACTIVE (e.g., begin-dredging)" }
  - { id: ERR_ACTIVATION_INCOMPLETE, http: 409, condition: "Activate without at least one Reach, one ISSUED Permit, and one APPROVED DredgePlan" }
  - { id: ERR_CLOSEOUT_INCOMPLETE, http: 409, condition: "Close-out with any reach not ACCEPTED, open events, REPORTED tickets, unsettled claims, or no PAID FINAL certificate" }
  - { id: ERR_REACH_NOT_DREDGABLE, http: 409, condition: "Dredge-event creation against a reach not in DREDGING status" }
  - { id: ERR_POSTURE_SUSPENDED, http: 409, condition: "Dredge-event creation while project compliance_posture == SUSPENDED" }
  - { id: ERR_POSTURE_RESTRICTED, http: 409, condition: "Dredge-event creation under RESTRICTED posture without reduced_rate=true" }
  - { id: ERR_EVENT_NOT_RESUMABLE, http: 409, condition: "Resume while posture SUSPENDED, or EQUIPMENT shutdown while plant still OUT_OF_SERVICE" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Caller X-User-ID equals the recorded submitter/reporter/claimant id on an approval-style action" }
  - { id: ERR_PERMIT_WINDOW_OVERLAP, http: 409, condition: "New permit's CLOSED window intersects another ISSUED permit window of the same project; touching endpoints conflict" }
  - { id: ERR_PLANT_ASSIGNMENT_OVERLAP, http: 409, condition: "Plan approval would assign one plant to two APPROVED plans whose HALF-OPEN windows overlap; touching endpoints allowed" }
  - { id: ERR_PLANT_UNAVAILABLE, http: 409, condition: "Plan approval while the referenced plant is OUT_OF_SERVICE or RETIRED" }
  - { id: ERR_PLAN_NOT_APPROVED, http: 409, condition: "Event creation without an APPROVED plan for the project+plant whose half-open window covers started_utc; also plan approve with no ISSUED permit" }
  - { id: ERR_PLAN_WINDOW_INFEASIBLE, http: 422, condition: "floor((planned_end - planned_start)/24h) < risk_adjusted_duration_days at approval" }
  - { id: ERR_SURVEY_KIND_MISMATCH, http: 409, condition: "PRE_DREDGE survey on a reach not in {PENDING, PRE_SURVEYED}, or POST_DREDGE survey on a reach not in DREDGING" }
  - { id: ERR_FINAL_ACCEPTANCE_INCOMPLETE, http: 409, condition: "FINAL certificate submit while any listed reach is not ACCEPTED" }
  - { id: ERR_EVENT_NOT_COMPLETED, http: 409, condition: "Placement-ticket creation against a DredgeEvent not in COMPLETED" }
  - { id: ERR_DISPOSAL_SITE_NOT_OPEN, http: 409, condition: "Placement-ticket creation against a FULL or CLOSED site" }
  - { id: ERR_DISPOSAL_CAPACITY_EXCEEDED, http: 409, condition: "Confirm would drive used_cy + witnessed_volume_cy above capacity_cy (exact fill allowed)" }
  - { id: ERR_PLACEMENT_OUT_OF_WINDOW, http: 409, condition: "Confirm with placed_utc outside every ISSUED permit closed window of the event's project" }
  - { id: ERR_SPECIES_COOLDOWN_ACTIVE, http: 409, condition: "Clear before now >= observed_utc + species_standdown_hours (equality allowed)" }
  - { id: ERR_STANDBY_HOURS_EXCEED_SHUTDOWN, http: 422, condition: "claimed_hours exceeds the plant's total shutdown_accumulated_hours on the project" }
  - { id: ERR_CLAIM_PERIOD_OUTSIDE_WINDOW, http: 409, condition: "Claim approval with period not overlapping any ISSUED permit closed window" }
  - { id: ERR_CLAIM_NOT_PAYABLE, http: 422, condition: "Approval of an EQUIPMENT_BREAKDOWN claim (payable multiplier 0)" }
  - { id: ERR_CLAIM_NOT_APPROVED, http: 422, condition: "Certificate creation listing a claim not in APPROVED status, wrong project, or already SETTLED" }

# =============================================================================
# §1.7 RBAC Matrix — segregation_of_duties model; all identities opaque,
# SoD enforced by comparing X-User-ID against recorded *_by_user_id fields
# =============================================================================
roles:
  - name: OwnerEngineer
    description: "Agency/owner resident engineer: structures the contract (projects, permits, reaches, disposal sites), approves plans and surveys, certifies and pays certificates, adjudicates standby claims, operates the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /projects, POST /projects/{id}/activate, POST /projects/{id}/close-out"
      - "POST /permits"
      - "POST /reaches"
      - "POST /disposal-sites, POST /disposal-sites/{id}/close"
      - "POST /dredge-plans/{id}/approve, POST /dredge-plans/{id}/request-changes"
      - "POST /surveys/{id}/accept, POST /surveys/{id}/reject (never for a survey the same X-User-ID submitted)"
      - "POST /standby-claims/{id}/approve, POST /standby-claims/{id}/deny (never for a claim the same X-User-ID filed)"
      - "POST /payment-certificates/{id}/certify, /dispute, /void, /pay (certify never for a certificate the same X-User-ID submitted)"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
  - name: ContractorOps
    description: "Dredging contractor operations manager: registers plants, drafts and submits plans, runs dredge events, reports placement tickets, files standby claims and payment certificates"
    identity: opaque
    exclusive_operations:
      - "POST /plants, PATCH /plants/{id}"
      - "POST /dredge-plans, POST /dredge-plans/{id}/submit"
      - "POST /reaches/{id}/begin-dredging"
      - "POST /dredge-events, POST /dredge-events/{id}/complete, POST /dredge-events/{id}/resume"
      - "POST /placement-tickets"
      - "POST /standby-claims"
      - "POST /payment-certificates, POST /payment-certificates/{id}/submit, POST /payment-certificates/{id}/revise"
    shared_operations:
      - "All GET endpoints"
  - name: SurveyParty
    description: "Hydrographic survey party: submits pre- and post-dredge surveys; can never accept its own survey (SoD against OwnerEngineer action with same X-User-ID)"
    identity: opaque
    exclusive_operations:
      - "POST /surveys"
    shared_operations:
      - "All GET endpoints"
  - name: EnvironmentalMonitor
    description: "Environmental compliance monitor: records turbidity readings, reports and clears species sightings"
    identity: opaque
    exclusive_operations:
      - "POST /turbidity-readings"
      - "POST /species-sightings, POST /species-sightings/{id}/clear"
    shared_operations:
      - "All GET endpoints"
  - name: SiteOperator
    description: "Disposal-site operator: witnesses and confirms/rejects/voids placement tickets; can never confirm a ticket the same X-User-ID reported (SoD against ContractorOps)"
    identity: opaque
    exclusive_operations:
      - "POST /placement-tickets/{id}/confirm, POST /placement-tickets/{id}/reject, POST /placement-tickets/{id}/void"
    shared_operations:
      - "All GET endpoints"
