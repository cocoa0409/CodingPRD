          - entities.Steward.fields.open_finding_load
          - entities.Domain.fields.open_finding_weight
        distinguishing_aspect: |
          Planning charges the assignee's open_finding_load and must leave
          domain.open_finding_weight and the posture untouched, because the finding is still
          open; resolving must release both the load and the weight and re-derive the posture,
          while the finding keeps its severity_weight pinned at creation and its gap_pct is
