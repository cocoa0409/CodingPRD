# =============================================================================
# task_0075_stock_option — Scaffold Difficulty Design (§1.8)
# Test Targeting Index — cross-references §1.1–§1.7 against the 9 Difficulty
# Rules of §0.5. Every instance grounds in declared scaffold elements.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:

      - name: vested_qty_anniversary_vs_continuous
        grounds:
          - calculations.vested_quantity
          - entities.GrantBatch.fields.vesting_algorithm
          - entities.Grant.fields.vested_quantity
        distinguishing_aspect: |
          Operates on the Grant/GrantBatch entity domain. Same inputs (cliff=12, total=48,
          period=3, qty=1200) produce different vested counts mid-period under
          ANNIVERSARY_BATCH (step-function: 150 at cliff+3mo) vs CONTINUOUS_DAILY
          (linear: 100 at cliff+3mo) — proving the dual-variant.
        test_recipe:
          setup:
            - "POST /option-plans (jurisdiction_code=US, pool_total_options=10000) then /activate at clock t0"
            - "POST /option-plans/{planId}/grant-batches A with cliff_months=12, vesting_total_months=48, vesting_period_months=3, vesting_algorithm=ANNIVERSARY_BATCH, initial_price_per_option_cents=5000"
            - "POST /option-plans/{planId}/grant-batches B with identical fields except vesting_algorithm=CONTINUOUS_DAILY"
            - "POST /…/grant-batches/{A}/open and /…/grant-batches/{B}/open"
            - "Register Grantee, create Grant gA in batch A and gB in batch B, each with quantity=1200, grant_date_fair_value_cents=5000"
            - "Cycle each Grant DRAFT→BOARD_APPROVED→SHAREHOLDER_APPROVED→AGREEMENT_SIGNED→LIVE using three distinct X-User-IDs"
          trigger:
            - "POST /option-plans/{planId}/clock/advance by_seconds equivalent to +15 calendar months from gA.grant_date (and same advance applied to gB which shares the plan clock)"
            - "GET /grants/{gA.id} and GET /grants/{gB.id}"
          assert:
            - "gA.vested_quantity == 150 (ANNIVERSARY_BATCH at cliff+3mo)"
            - "gB.vested_quantity == 100 (CONTINUOUS_DAILY at cliff+3mo)"
            - "gA.vested_quantity != gB.vested_quantity"

      - name: withholding_tax_provisional_vs_final
        grounds:
          - calculations.withholding_tax
          - state_machines.ExerciseApplication.ELIGIBILITY_VERIFIED_to_TAX_WITHHELD
          - entities.TaxEventRecord.fields.withheld_amount_cents
        distinguishing_aspect: |
          Operates on the ExerciseApplication/TaxEventRecord entity domain (different
          domain from vested-qty's Grant domain). The PROVISIONAL_AT_VERIFY variant
          computes tax for grantee disclosure without persisting; the
          FINAL_AT_TAX_WITHHELD variant pins TaxEventRecord.withheld_amount_cents at
          the transition moment. A clock-advance crossing a tier boundary between the
          two calls produces different cent results — provisional shows lower
          slab-1-only withholding, final shows full tier crossing.
        test_recipe:
          setup:
            - "Plan in US jurisdiction, ACTIVE; Grantee with US tax_residency; Grant LIVE with pinned_price_version v1 at 5000c"
            - "Advance clock past cliff so Grant.vested_quantity >= 80; mock current_fair_value via POST /option-plans/{planId}/corporate-events RESTRUCTURING that nudges price (or set via test fixture if the calc reads from a server-state field)"
            - "ExerciseWindow w1 OPEN; ExerciseApplication app1 with requested_quantity=80, settlement_mode=CASH_SETTLEMENT created against w1"
          trigger:
            - "POST /exercise-applications/{app1.id}/verify — cascades to TAX_WITHHELD"
            - "GET /grants/{grantId}/tax-events?event_type=EXERCISE"
          assert:
            - "TaxEventRecord.taxable_amount_cents == 1200000 (= 15000c spread * 80 qty)"
            - "TaxEventRecord.withheld_amount_cents == 294000 (= 220000 from 22% slab on first 1,000,000c + 74000 from 37% slab on remaining 200,000c)"
            - "TaxEventRecord.event_type == 'EXERCISE'"
            - "TaxEventRecord.jurisdiction_code == 'US'"

  # ---------------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across different modes (a/b/c)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:

      - name: withholding_tax_tiered_three_inputs_mode_a
        grounds:
          - calculations.withholding_tax
          - entities.OptionPlan.fields.jurisdiction_code
          - entities.Grantee.fields.tax_residency
          - entities.TaxEventRecord.fields.event_type
        distinguishing_aspect: |
          MODE (a): formula has ≥3 inputs with non-linear interaction. The
          (jurisdiction_code × tax_residency × event_type × taxable_amount) lookup
          chooses a tier table, then tiered marginal rates apply with per-slab
          round_half_up before summing. UK/UK at 5,000,000c boundary crosses the
          20%→45% step exactly at the breakpoint. Result depends non-linearly on the
          interaction.
        test_recipe:
          setup:
            - "Plan in UK jurisdiction; Grantee with UK tax_residency"
            - "Grant LIVE with pinned price v1; current fair value such that EXERCISE spread × qty = exactly 5,000,000c"
          trigger:
            - "POST /grants/{grantId}/exercise-applications with settlement_mode=CASH_SETTLEMENT; verify → TAX_WITHHELD"
          assert:
            - "TaxEventRecord.taxable_amount_cents == 5000000"
            - "TaxEventRecord.withheld_amount_cents == 1000000 (= round_half_up(5000000 * 2000 / 10000) — entire amount lands in slab1 because the upper bound is exclusive at the 5,000,000c breakpoint)"

      - name: exercise_price_restructuring_rounding_order_mode_b
        grounds:
          - calculations.exercise_price_per_version
          - entities.ExercisePriceVersion.fields.price_per_option_cents
          - entities.CorporateEvent.fields.restructure_factor_bps
        distinguishing_aspect: |
          MODE (b): nested rounding where the operation order is pinned. The formula
          is multiply-first-divide-second-round-LAST: round_half_up(5000 * 8000 /
          10000) = 4000. Reversing to round-per-step (e.g., round(5000/10000)=1
          then *8000=8000) yields wildly different cents. The scaffold pins the
          order in calculations.exercise_price_per_version.note.
        test_recipe:
          setup:
            - "Plan ACTIVE; Batch B opened (v1 created INITIAL with price_per_option_cents=5000)"
          trigger:
            - "POST /option-plans/{planId}/corporate-events with event_type=RESTRUCTURING, restructure_factor_bps=8000"
            - "GET /grant-batches/{batchId}/exercise-price-versions"
          assert:
            - "v2.cause == 'RESTRUCTURING'"
            - "v2.price_per_option_cents == 4000"
            - "v2.parent_version_id == v1.id"
            - "v2.version_index == 2"

      - name: pool_reservation_circular_dependency_mode_c
        grounds:
          - calculations.pool_reservation_check
          - calculations.departure_forfeiture_settlement
          - entities.OptionPlan.fields.pool_reserved_options
          - entities.Grant.fields.forfeited_quantity
          - state_machines.Grant.LIVE_to_TERMINATED
        distinguishing_aspect: |
          MODE (c): circular-looking dependency with pinned evaluation order. At
          departure /settle, pool_reserved_options is a function of every Grant's
          (quantity - exercised - forfeited), but forfeited_quantity is itself being
          mutated mid-cascade. The scaffold pins the order: (1) compute
          vested_at_dep using clock=departed_ts, (2) mutate Grant.forfeited_quantity,
          (3) decrement plan.pool_reserved_options last — per
          departure_forfeiture_settlement.formula step list. Evaluating
          pool_reserved_options first (before forfeiture) gives a stale denominator.
        test_recipe:
          setup:
            - "Plan with pool_total_options=10000; one Grantee with one Grant of quantity=1200, exercised=30 already settled, pinned price 5000c"
            - "Clock advanced so vested_at_dep at departed_ts=cliff+3mo → 150"
            - "DepartureRecord DRAFT with departure_type=TERMINATION, leaver_class=GOOD_LEAVER"
          trigger:
            - "POST /grantees/{granteeId}/departure-records/{depId}/settle"
            - "GET /option-plans/{planId} and GET /grants/{grantId}"
          assert:
            - "Grant.forfeited_quantity == 1050 (= 1200 - 150 unvested forfeited; vested kept for GOOD_LEAVER)"
            - "OptionPlan.pool_reserved_options decreased by exactly 1050 (the forfeited portion) — i.e., pool_reserved_options reflects post-forfeiture state, not pre-forfeiture"
            - "Grant.outstanding_quantity == 1200 - 30 - 1050 == 120 (= the 120 vested-but-unexercised options still reserved)"

  # ---------------------------------------------------------------------------
  # Rule 3 — Non-linear state-machine shape on different entities
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:

      - name: grant_branching_sign_to_live_or_frozen
        grounds:
          - state_machines.Grant.AGREEMENT_SIGNED_to_LIVE
          - state_machines.Grant.AGREEMENT_SIGNED_to_FROZEN
          - state_machines.Grant.FROZEN_to_LIVE
        distinguishing_aspect: |
          BRANCHING with rejoin on Grant entity. SHAREHOLDER_APPROVED→AGREEMENT_SIGNED
          fork-joins into either LIVE (no blackout) or FROZEN (active blackout), and
          FROZEN auto-rejoins LIVE when /clock/advance crosses blackout_end_ts.
          Linear pipeline cannot model this — the path taken depends on a runtime
          CorporateEvent overlap predicate.
        test_recipe:
          setup:
            - "Plan ACTIVE; Batch opened; Grant g1 progressed to SHAREHOLDER_APPROVED; clock at t0"
            - "Create CorporateEvent EARNINGS_BLACKOUT with effective_ts=t0, blackout_end_ts=t0+7days"
          trigger:
            - "POST /grants/{g1.id}/sign-agreement (no require_live flag)"
            - "POST /option-plans/{planId}/clock/advance by_seconds=+8 days"
            - "GET /grants/{g1.id} after each step"
          assert:
            - "After /sign-agreement: g1.status == 'FROZEN' (blackout active routed to FROZEN branch)"
            - "After /clock/advance past blackout_end_ts: g1.status == 'LIVE' (auto-rejoin per FROZEN→LIVE)"

      - name: exercise_application_branching_share_vs_cash
        grounds:
          - state_machines.ExerciseApplication.ELIGIBILITY_VERIFIED_to_PAYMENT_RECEIVED
          - state_machines.ExerciseApplication.ELIGIBILITY_VERIFIED_to_TAX_WITHHELD
          - state_machines.ExerciseApplication.PAYMENT_RECEIVED_to_TAX_WITHHELD
        distinguishing_aspect: |
          BRANCHING on ExerciseApplication entity (different entity from Grant). From
          ELIGIBILITY_VERIFIED the next state is either PAYMENT_RECEIVED (for
          SHARE_ISSUANCE, requires /pay) or TAX_WITHHELD (for CASH_SETTLEMENT, auto-
          cascades). The two paths converge at TAX_WITHHELD with divergent side-
          effect sets (only SHARE_ISSUANCE pins payment_reference; only
          CASH_SETTLEMENT computes net_proceeds_cents).
        test_recipe:
          setup:
            - "Two Grants g_share and g_cash, both LIVE with vested_quantity >= 50, on the same OPEN window"
            - "Submit app_share (settlement_mode=SHARE_ISSUANCE, qty=50) and app_cash (settlement_mode=CASH_SETTLEMENT, qty=50)"
          trigger:
            - "POST /exercise-applications/{app_share.id}/verify, then /pay with payment_reference='BK-1', then /settle with share_registry_reference='SR-1'"
            - "POST /exercise-applications/{app_cash.id}/verify, then /settle with payment_reference='BK-2'"
          assert:
            - "app_share path observed states: SUBMITTED → ELIGIBILITY_VERIFIED → PAYMENT_RECEIVED → TAX_WITHHELD → SETTLED (4 transitions)"
            - "app_cash path observed states: SUBMITTED → ELIGIBILITY_VERIFIED → TAX_WITHHELD → SETTLED (3 transitions, no PAYMENT_RECEIVED)"
            - "app_share.net_proceeds_cents is null and share_registry_reference == 'SR-1'"
            - "app_cash.net_proceeds_cents == 250000 - app_cash.withholding_tax_cents and payment_reference == 'BK-2'"

  # ---------------------------------------------------------------------------
  # Rule 4 — Transitive cascade chains from different triggers
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:

      - name: departure_settle_terminate_reject_cascade_depth4
        grounds:
          - state_machines.DepartureRecord.DRAFT_to_SETTLED
          - state_machines.Grant.LIVE_to_TERMINATED
          - state_machines.ExerciseApplication.SUBMITTED_to_REJECTED
          - calculations.pool_reservation_check
          - entities.Grantee.fields.eligibility_status
        distinguishing_aspect: |
          Depth-4 chain originating from POST /…/departure-records/{depId}/settle:
          (1) DepartureRecord DRAFT→SETTLED mutates Grantee.eligibility_status to
          DEPARTED; (2) that mutation cascades into Grant LIVE/FROZEN→TERMINATED for
          every BAD_LEAVER grant of that grantee; (3) that mutation cascades into
          each non-terminal ExerciseApplication for those grants becoming REJECTED;
          (4) the REJECTED transition itself releases pool reservation via
          pool_reservation_check recalculation. Each hop is caused by the previous
          hop's mutation, not by /settle directly.
        test_recipe:
          setup:
            - "Plan, Grantee gtA, two Grants g1 (LIVE) and g2 (FROZEN due to blackout); both have an ExerciseApplication a1, a2 in SUBMITTED state"
            - "DepartureRecord d1 DRAFT with departure_type=TERMINATION, leaver_class=BAD_LEAVER"
            - "Before /settle: capture plan.pool_reserved_options == initial_reserved (= sum of g1.qty + g2.qty)"
          trigger:
            - "POST /grantees/{gtA.id}/departure-records/{d1.id}/settle"
          assert:
            - "Grantee.eligibility_status == 'DEPARTED' (hop 1)"
            - "Grant g1.status == 'TERMINATED' AND g2.status == 'TERMINATED' (hop 2, caused by hop 1)"
            - "ExerciseApplication a1.status == 'REJECTED' AND a2.status == 'REJECTED' (hop 3, caused by hop 2)"
            - "plan.pool_reserved_options decreased by (g1.outstanding_quantity_before + g2.outstanding_quantity_before) — exactly the sum of forfeited_quantity across the two grants (hop 4)"

      - name: corporate_event_split_price_version_proceeds_cascade_depth3
        grounds:
          - state_machines.ExercisePriceVersion
          - calculations.exercise_price_per_version
          - state_machines.ExerciseApplication.ELIGIBILITY_VERIFIED_to_TAX_WITHHELD
          - entities.ExerciseApplication.fields.gross_proceeds_cents
        distinguishing_aspect: |
          Depth-3 chain originating from POST /…/corporate-events (STOCK_SPLIT). The
          original action (/corporate-events POST) only emits a CorporateEvent row.
          (1) That CorporateEvent emission triggers ExercisePriceVersion creation
          per batch (exercise_price_per_version calc — caused by hop 0). (2) That
          new ExercisePriceVersion creation invalidates the gross_proceeds_cents
          stored on any in-flight ExerciseApplication whose pinned_price_version_id
          is still the parent — but per scaffold §1.4 priority-16 (ERR_STALE_PRICE_VERSION),
          a subsequent /verify on those apps rejects with the stale-price error
          (caused by hop 1's version-chain advance). Different trigger from Rule 4
          instance #1 (corporate event vs departure).
        test_recipe:
          setup:
            - "Plan ACTIVE; Batch B opened; v1 INITIAL price=5000c"
            - "Grant gX LIVE pinned to v1; ExerciseApplication app1 SUBMITTED with pinned_price_version_id=v1.id, qty=50"
          trigger:
            - "POST /option-plans/{planId}/corporate-events event_type=STOCK_SPLIT split_ratio_numerator=2 split_ratio_denominator=1 (creates v2 via cascade)"
            - "POST /exercise-applications/{app1.id}/verify"
          assert:
            - "Hop 1 result: v2 exists with cause='STOCK_SPLIT', price_per_option_cents == 2500, parent_version_id == v1.id"
            - "Hop 2 result: /verify response is HTTP 409 with data.error_id == 'ERR_STALE_PRICE_VERSION' (because at /verify the scaffold re-checks pinned_price_version_id against the batch's current TIP, which is now v2; app1.pinned_price_version_id == v1 ≠ tip v2, so the stale-version check fires per priority-16 validation)"
            - "app1.status remains 'SUBMITTED' (no transition because verify rejected)"

  # ---------------------------------------------------------------------------
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_vs_business_constraint_grant_not_live_before_vested_check
        grounds:
          - validations[priority=4]
          - validations[priority=12]
          - errors.ERR_GRANT_NOT_LIVE
          - errors.ERR_INSUFFICIENT_VESTED_QUANTITY
        distinguishing_aspect: |
          Pair: category=state (priority 4, ERR_GRANT_NOT_LIVE) vs
          category=business_constraint (priority 12, ERR_INSUFFICIENT_VESTED_QUANTITY).
          When both fail simultaneously (Grant is FROZEN AND requested_quantity
          exceeds vested) the state error wins because priority 4 < priority 12.
        test_recipe:
          setup:
            - "Plan ACTIVE; Grant g1 in FROZEN state (signed during active blackout); g1.vested_quantity == 0 (clock has not yet crossed cliff)"
            - "Open ExerciseWindow w1 (OPEN at current clock)"
          trigger:
            - "POST /grants/{g1.id}/exercise-applications with window_id=w1.id, requested_quantity=9999 (impossibly large), settlement_mode=SHARE_ISSUANCE"
          assert:
            - "HTTP 409"
            - "response.data.error_id == 'ERR_GRANT_NOT_LIVE' (state error wins over quantity error per priority order)"

      - name: business_safety_vs_business_fiscal_segregation_vs_pool
        grounds:
          - validations[priority=6]
          - validations[priority=14]
          - errors.ERR_SEGREGATION_OF_DUTIES_VIOLATION
          - errors.ERR_POOL_INSUFFICIENT
        distinguishing_aspect: |
          Pair: category=business_safety (priority 6, ERR_SEGREGATION_OF_DUTIES_VIOLATION)
          vs category=business_fiscal (priority 14, ERR_POOL_INSUFFICIENT). Different
          error-category pair from instance #1 (state/business_constraint). When the
          same X-User-ID who submitted the draft attempts /board-approve AND
          Grant.quantity exceeds pool_remaining_options, segregation-of-duties wins
          because priority 6 < priority 14.
        test_recipe:
          setup:
            - "Plan ACTIVE with pool_total_options=1000; Grantee gt1"
            - "User U1 (X-User-ID=U1, role=PlanAdministrator) creates Grant g_big with quantity=2000 (exceeds pool — would fail pool check)"
            - "User U1 then swaps role to BoardSecretary to attempt /board-approve"
          trigger:
            - "POST /grants/{g_big.id}/board-approve with X-User-ID=U1 X-User-Role=BoardSecretary"
          assert:
            - "HTTP 403"
            - "response.data.error_id == 'ERR_SEGREGATION_OF_DUTIES_VIOLATION' (priority 6 fires before pool-insufficient priority 14)"

  # ---------------------------------------------------------------------------
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:

      - name: pool_remaining_equality_boundary_at_board_approve
        grounds:
          - validations[priority=14]
          - calculations.pool_reservation_check
          - entities.OptionPlan.fields.pool_total_options
          - entities.OptionPlan.fields.pool_reserved_options
        distinguishing_aspect: |
          Numeric boundary on `<=` vs `<`. Tested via POST /grants/{grantId}/board-approve.
          With pool_total=10000 and one Grant of 6000 already board-approved,
          remaining=4000. Approving a Grant of exactly 4000 SUCCEEDS (uses `<=`);
          approving 4001 fails with ERR_POOL_INSUFFICIENT.
        test_recipe:
          setup:
            - "Plan ACTIVE pool_total_options=10000; Batch open; Grantee g1"
            - "Grant g_alpha created with quantity=6000, board-approved by U_board1 → pool_reserved_options=6000"
            - "Two more Grant drafts: g_exact quantity=4000, g_over quantity=4001 (both submitted by U_drafter)"
          trigger:
            - "POST /grants/{g_exact.id}/board-approve with X-User-ID=U_board2 (distinct from U_drafter and U_board1)"
            - "POST /grants/{g_over.id}/board-approve with X-User-ID=U_board2"
          assert:
            - "g_exact /board-approve returns HTTP 200; g_exact.status == 'BOARD_APPROVED'; plan.pool_reserved_options == 10000"
            - "g_over /board-approve returns HTTP 402 with data.error_id == 'ERR_POOL_INSUFFICIENT' (4001 > 4000)"

      - name: window_blackout_half_open_zero_overlap_boundary
        grounds:
          - validations[priority=8]
          - errors.ERR_BLACKOUT_OVERLAPS_WINDOW
          - entities.ExerciseWindow.fields.open_ts
          - entities.ExerciseWindow.fields.close_ts
          - entities.CorporateEvent.fields.effective_ts
          - entities.CorporateEvent.fields.blackout_end_ts
        distinguishing_aspect: |
          Different metric (datetime-interval geometry, not a numeric scalar) and
          different endpoint (POST /exercise-windows, not /board-approve). Half-open
          interval rule: window [open_ts, close_ts) ∩ blackout [effective_ts,
          blackout_end_ts) is non-empty iff overlap. The boundary case window.open_ts
          == blackout.blackout_end_ts (window starts exactly when blackout ends) is
          NOT overlap (empty set under half-open intersection) and MUST succeed.
        test_recipe:
          setup:
            - "Plan ACTIVE clock t0"
            - "POST /corporate-events EARNINGS_BLACKOUT effective_ts=t0+24h, blackout_end_ts=t0+48h"
          trigger:
            - "POST /option-plans/{planId}/exercise-windows label='touching' open_ts=t0+48h close_ts=t0+72h (touching boundary)"
            - "POST /option-plans/{planId}/exercise-windows label='overlap' open_ts=t0+47h close_ts=t0+72h (1-hour overlap)"
          assert:
            - "First window (touching) returns HTTP 201; ExerciseWindow created with status='SCHEDULED'"
            - "Second window (overlap) returns HTTP 409 with data.error_id == 'ERR_BLACKOUT_OVERLAPS_WINDOW'"

  # ---------------------------------------------------------------------------
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:

      - name: grant_signagreement_depends_on_grantee_eligibility
        grounds:
          - state_machines.Grant.SHAREHOLDER_APPROVED_to_AGREEMENT_SIGNED
          - entities.Grantee.fields.eligibility_status
          - validations[priority=9]
          - errors.ERR_GRANTEE_INELIGIBLE
        distinguishing_aspect: |
          Entity pair: Grant ↔ Grantee. Grant's SHAREHOLDER_APPROVED→AGREEMENT_SIGNED
          transition can only fire when Grantee.eligibility_status == ELIGIBLE.
          Setting the grantee to DEPARTED (via DepartureRecord /settle on a sibling
          grant chain) blocks the transition.
        test_recipe:
          setup:
            - "Plan ACTIVE; Grantee gt1 ELIGIBLE; Grant g1 progressed to SHAREHOLDER_APPROVED for gt1"
            - "Separately mark gt1 DEPARTED via DepartureRecord on a different unrelated Grant chain (or by direct fixture-style action — use the documented /settle path)"
          trigger:
            - "POST /grants/{g1.id}/sign-agreement (with X-User-ID == gt1.hr_employee_id)"
          assert:
            - "HTTP 403 with data.error_id == 'ERR_GRANTEE_INELIGIBLE'"
            - "g1.status remains 'SHAREHOLDER_APPROVED' (no transition)"

      - name: exerciseapplication_verify_depends_on_window_state
        grounds:
          - state_machines.ExerciseApplication.SUBMITTED_to_ELIGIBILITY_VERIFIED
          - state_machines.ExerciseWindow
          - entities.ExerciseWindow.fields.status
          - errors.ERR_WINDOW_NOT_OPEN
        distinguishing_aspect: |
          Different entity pair: ExerciseApplication ↔ ExerciseWindow (not Grant ↔
          Grantee). ExerciseApplication's SUBMITTED→ELIGIBILITY_VERIFIED can only
          fire when its window.status == OPEN. Advancing the plan clock past
          close_ts and running /windows/sweep flips the window to CLOSED, blocking
          /verify thereafter.
        test_recipe:
          setup:
            - "Plan ACTIVE; Grant g1 LIVE with vested>=50; ExerciseWindow w1 with open_ts=t0, close_ts=t0+10s; clock at t0+1s"
            - "POST /exercise-windows/sweep → w1 becomes OPEN"
            - "Submit ExerciseApplication app1 against w1 (status=SUBMITTED)"
          trigger:
            - "POST /option-plans/{planId}/clock/advance by_seconds=15 (now clock > close_ts)"
            - "POST /exercise-windows/sweep → w1 becomes CLOSED (and app1 auto-rejected per side-effect, BUT also test the path where app1 was already SUBMITTED before sweep — to capture the cross-entity check we test verify on a *new* submission)"
            - "Re-submit a second app2 against w1 — but submission itself should fail with ERR_NOT_IN_EXERCISE_WINDOW. Instead, retain app1 and test /verify after sweep: it should fail because window is no longer OPEN."
            - "POST /exercise-applications/{app1.id}/verify"
          assert:
            - "/verify returns HTTP 409 with data.error_id == 'ERR_WINDOW_NOT_OPEN' (or app1.status already became REJECTED by sweep cascade — in which case the verify call returns ERR_GRANT_NOT_LIVE-style state error per priority chain; test asserts the response specifically distinguishes the window-state dependency)"
            - "w1.status == 'CLOSED'"

  # ---------------------------------------------------------------------------
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:

      - name: exercise_window_vs_blackout_half_open_geometry
        grounds:
          - validations[priority=8]
          - errors.ERR_BLACKOUT_OVERLAPS_WINDOW
          - entities.ExerciseWindow
          - entities.CorporateEvent
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN intersection [a, b) ∩ [c, d) ≠ ∅. Touching
          endpoints (window.open_ts == blackout.blackout_end_ts) is NOT a collision.
          Sits on ExerciseWindow (with CorporateEvent as the colliding resource).
        test_recipe:
          setup:
            - "Plan ACTIVE; CorporateEvent EARNINGS_BLACKOUT effective_ts=t0, blackout_end_ts=t0+24h"
          trigger:
            - "POST /option-plans/{planId}/exercise-windows label='inside' open_ts=t0+10h close_ts=t0+20h (fully inside blackout)"
            - "POST /option-plans/{planId}/exercise-windows label='cross-end' open_ts=t0+20h close_ts=t0+30h (crosses end)"
            - "POST /option-plans/{planId}/exercise-windows label='cross-start' open_ts=t0-5h close_ts=t0+5h (crosses start)"
          assert:
            - "All three return HTTP 409 with data.error_id == 'ERR_BLACKOUT_OVERLAPS_WINDOW' (half-open overlap rejects every case where the half-open intersection is non-empty)"

      - name: grant_vesting_acceleration_must_reference_qualifying_event
        grounds:
          - validations[priority=7]
          - state_machines.VestingRecord
          - calculations.vested_quantity
          - entities.VestingRecord.fields.cause
          - entities.CorporateEvent.fields.event_type
          - errors.ERR_INVALID_TIME_INTERVAL
        distinguishing_aspect: |
          Different interval semantics — AGGREGATE-CAPACITY-style overlap on a
          single point-in-time event vs the half-open interval geometry of
          instance #1. Sits on a different resource entity (Grant /accelerate-vesting
          + VestingRecord, not ExerciseWindow). The CorporateEvent referenced by
          /accelerate-vesting must be one whose effective_ts ≤ plan.current_clock_ts
          AND event_type ∈ {CHANGE_OF_CONTROL, IPO}; a future-dated or wrong-typed
          event is rejected. Capacity semantics: a single Grant may have at most one
          ACCELERATION_CHANGE_OF_CONTROL VestingRecord and one ACCELERATION_IPO
          VestingRecord — a second acceleration of the same type collapses (idempotent
          duplicate forbidden by uniqueness on (grant_id, cause)).
        test_recipe:
          setup:
            - "Plan ACTIVE; Grant g1 LIVE; clock at t0; no CorporateEvent yet"
            - "POST /corporate-events CHANGE_OF_CONTROL effective_ts=t0+10s (future relative to current clock t0)"
          trigger:
            - "POST /grants/{g1.id}/accelerate-vesting corporate_event_id=ce1.id (future-dated event, before clock advance)"
            - "POST /option-plans/{planId}/clock/advance by_seconds=15"
            - "POST /grants/{g1.id}/accelerate-vesting corporate_event_id=ce1.id again (now in the past)"
            - "POST /grants/{g1.id}/accelerate-vesting corporate_event_id=ce1.id a second time (same event)"
          assert:
            - "First /accelerate-vesting returns HTTP 422 with data.error_id == 'ERR_INVALID_TIME_INTERVAL' (event in future)"
            - "Second /accelerate-vesting (after clock advance) returns HTTP 200; one new VestingRecord row with cause='ACCELERATION_CHANGE_OF_CONTROL'"
            - "Third /accelerate-vesting returns HTTP 422 with data.error_id == 'ERR_INVALID_TIME_INTERVAL' (duplicate acceleration of same cause on same grant)"

  # ---------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:

      - name: option_pool_conservation_invariant
        grounds:
          - calculations.pool_reservation_check
          - state_machines.Grant.LIVE_to_TERMINATED
          - entities.OptionPlan.fields.pool_total_options
          - entities.OptionPlan.fields.pool_reserved_options
          - entities.Grant.fields.quantity
          - entities.Grant.fields.exercised_quantity
          - entities.Grant.fields.forfeited_quantity
        distinguishing_aspect: |
          Conserved quantity: total options under accounting =
          plan.pool_total_options. Invariant pinned as:
            plan.pool_reserved_options
            + SUM(Grant.exercised_quantity over plan)
            + SUM(Grant.forfeited_quantity over plan)
            == SUM(Grant.quantity for Grants in {BOARD_APPROVED, SHAREHOLDER_APPROVED, AGREEMENT_SIGNED, LIVE, FROZEN, TERMINATED}) over plan
          AND
            plan.pool_reserved_options <= plan.pool_total_options
          A forward action (board-approve adds to reserved) paired with its compensator
          (departure /settle forfeits unvested → reserved decreases by exactly the
          forfeited delta) MUST leave the total identity unchanged.
        test_recipe:
          setup:
            - "Plan ACTIVE with pool_total_options=10000"
            - "Three Grants of 1200 each board-approved → pool_reserved_options = 3600; SUM(exercised)=0, SUM(forfeited)=0; SUM(approved_qty)=3600 ✓ identity holds"
            - "All three grants progressed to LIVE; one Grant exercises 50 options (settled) → pool_reserved_options decreases by 50 to 3550; SUM(exercised)=50; SUM(approved_qty)=3600 → 3550+50+0=3600 ✓"
          trigger:
            - "POST /grantees/{gt.id}/departure-records/{depId}/settle for the grantee owning all three grants, leaver_class=GOOD_LEAVER, at clock=cliff+3mo so vested_at_dep per grant = 150"
            - "GET /option-plans/{planId} and GET /grants for each grant"
          assert:
            - "After settle: SUM(forfeited_quantity over three grants) == 3 * (1200 - 150) - 50_from_the_exercised_grant_adjustment == 3 * 1050 = 3150 (each grant: 1200-150 unvested; the grant that exercised 50 had forfeited += (1200 - 150 - 50_no — forfeited uses (qty - vested - forfeited_so_far) = 1200-150-0 = 1050 still, BUT exercised options don't reduce unvested calc since exercised counted separately). Per the formula in §1.3 calculations.departure_forfeiture_settlement: unvested_per_grant = g.quantity - vested_at_dep - g.forfeited_quantity_prior = 1200 - 150 - 0 = 1050. So total forfeited = 3150."
            - "plan.pool_reserved_options == 3600 - 50 (exercised) - 3150 (forfeited) == 400"
            - "Identity: pool_reserved_options(400) + SUM(exercised)(50) + SUM(forfeited)(3150) == 3600 == SUM(Grant.quantity in non-DRAFT states)"

      - name: tax_event_withheld_audit_log_invariant
        grounds:
          - calculations.withholding_tax
          - entities.TaxEventRecord.fields.withheld_amount_cents
          - entities.AuditLogEntry
          - state_machines.ExerciseApplication.TAX_WITHHELD_to_SETTLED
          - state_machines.ExerciseApplication.ELIGIBILITY_VERIFIED_to_REJECTED
        distinguishing_aspect: |
          Different conserved quantity (cents of tax withheld + audit-log row count,
          NOT options). Invariant pinned as: across an ExerciseApplication's
          lifetime, the sum of TaxEventRecord.withheld_amount_cents emitted for that
          application minus the sum of compensating reversals (when the application
          is REJECTED after TAX_WITHHELD — actually rejection from
          ELIGIBILITY_VERIFIED, not TAX_WITHHELD, but if a TAX_WITHHELD app
          backslides via /reject, the compensating TaxEventRecord is emitted with
          event_type=EXERCISE and withheld_amount_cents=-original — net zero) MUST
          equal zero. Concretely: for any rejected-after-withhold flow the running
          sum of withheld_amount_cents per (grant_id, exercise_application_id) is
          zero, AND for every TAX_WITHHELD→SETTLED path the AuditLogEntry with
          action_code='EXERCISE_SETTLED' exists exactly once.
        test_recipe:
          setup:
            - "Plan ACTIVE; Grant LIVE; ExerciseApplication app1 walked SUBMITTED→ELIGIBILITY_VERIFIED→TAX_WITHHELD (CASH_SETTLEMENT); TaxEventRecord t1 pinned with withheld_amount_cents=33000"
          trigger:
            - "POST /exercise-applications/{app1.id}/settle with payment_reference='BK-1' (success path) → SETTLED"
            - "Separately replay the scenario with a second app2 also reaching TAX_WITHHELD, but then POST /exercise-applications/{app2.id}/reject (compensating action)"
            - "GET /grants/{grantId}/tax-events and GET /option-plans/{planId}/audit-log?target_id={app1.id} and ?target_id={app2.id}"
          assert:
            - "For app1: SUM(TaxEventRecord.withheld_amount_cents WHERE exercise_application_id=app1.id) == 33000 (single forward record, no compensator); AuditLogEntry rows with action_code='EXERCISE_SETTLED' count == 1; action_code='EXERCISE_REJECTED' count == 0"
            - "For app2: SUM(TaxEventRecord.withheld_amount_cents WHERE exercise_application_id=app2.id) == 0 (the rejection emits a compensating TaxEventRecord with withheld_amount_cents = -33000, restoring net zero); AuditLogEntry rows: action_code='EXERCISE_REJECTED' count == 1, 'EXERCISE_SETTLED' count == 0"
            - "Plan-wide: SUM(TaxEventRecord.withheld_amount_cents for event_type=EXERCISE) across rejected-app cohort == 0 (conservation)"
