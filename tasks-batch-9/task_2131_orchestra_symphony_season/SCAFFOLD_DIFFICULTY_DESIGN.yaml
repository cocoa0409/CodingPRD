            - call: "POST /orchestra/concerts"
              payload: { season_id: "${s1}", venue_id: "${v1}", title: "Opening Night", performance_start_utc: "2026-11-05T19:30:00Z", performance_end_utc: "2026-11-05T21:30:00Z", program_minutes: 105 }
              as: ArtisticAdmin
              captures: { c1: "$.data.id" }
            - call: "POST /orchestra/concerts/${c1}/program"
              payload: {}
              as: ArtisticAdmin
            - call: "POST /orchestra/seasons/${s1}/advance"
              payload: { target_status: "RENEWAL_WINDOW" }
              as: ArtisticAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ArtisticAdmin
            - call: "POST /orchestra/seasons/${s1}/advance"
              payload: { target_status: "SINGLE_ON_SALE" }
              as: ArtisticAdmin
            - call: "POST /orchestra/patrons"
              payload: { full_name: "Noel Vance", email: "noel@patron.test" }
              as: BoxOfficeAgent
              captures: { pN: "$.data.id" }
            - call: "GET /orchestra/concerts/${c1}"
              payload: {}
              as: BoxOfficeAgent
              captures: { c1_v: "$.data.version" }
            - call: "POST /orchestra/ticket-orders"
              payload: { concert_id: "${c1}", patron_id: "${pN}", seat_section_id: "${sec_orch}", seat_count: 30, expected_concert_version: "${c1_v}" }
              as: BoxOfficeAgent
              captures: { o1: "$.data.id" }
            - call: "POST /orchestra/seasons/${s1}/run-ops"
              payload: {}
              as: BoxOfficeAgent
          trigger:
            - call: "POST /orchestra/seasons/${s1}/run-ops"
              payload: {}
              as: BoxOfficeAgent
          assert:
            - "Season.${s1}.ops_run_index == 2"
            - "TicketOrder.${o1}.status == EXPIRED"
            - "TicketOrder.${o1}.amount_paid_cents == 0"
            - "Concert.${c1}.section_inventory[seat_section_id=${sec_orch}].held_count == 0"
            - "Concert.${c1}.section_inventory[seat_section_id=${sec_orch}].sold_count == 0"
            - "Concert.${c1}.section_inventory[seat_section_id=${sec_orch}].available_count == 100"
            - "Concert.${c1}.section_inventory[seat_section_id=${sec_orch}].fill_bp == 0"
            - "Concert.${c1}.seats_held_count == 0"

      - name: patron_cash_conservation_across_payment_and_refund
        grounds:
          - calculations.patron_cash_conservation
          - state_machines.TicketOrder.HELD_to_PAID
          - state_machines.TicketOrder.PAID_to_REFUNDED
          - entities.Patron.fields.lifetime_cash_in_cents
          - entities.Patron.fields.credit_balance_cents
        distinguishing_aspect: |
          Conserved quantity number two is MONEY, not seats: lifetime_cash_in_cents ==
          credit_balance_cents + sum of PAID order amounts must equal 16200 both after the
          cash payment (0 credit + 16200 paid) and after the compensating cancellation refund
          (16200 credit + 0 paid), with amount_paid_cents itself left untouched at 16200.
        test_recipe:
          setup:
            - "Season 2027 advanced to SINGLE_ON_SALE, ORCHESTRA section capacity 100"
            - "Patron Noel Vance bought 2 seats at the LOW-band unit price 8100 and paid the full 16200 in cash"
            - "lifetime_cash_in_cents is 16200 and credit_balance_cents is 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
