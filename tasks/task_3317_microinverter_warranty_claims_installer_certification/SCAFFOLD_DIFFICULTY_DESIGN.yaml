  - rule_id: compensating_invariant
    instances:
      - name: campaign_cancel_reactivate_restores_live_order_count
        grounds:
          - entities.ProactiveCampaign.fields.dispatched_count
          - entities.ProactiveCampaign.fields.canceled_count
          - state_machines.ReplacementOrder.CANCELED_to_PENDING_DISPATCH
        distinguishing_aspect: |
          Conserved quantity is the live dispatch count: canceling a three-order campaign then
          reactivating all three returns ProactiveCampaign.canceled_count to 0 and the live
          order count to 3, so dispatched_count minus canceled_count equals the live count at
          every step with zero drift.
