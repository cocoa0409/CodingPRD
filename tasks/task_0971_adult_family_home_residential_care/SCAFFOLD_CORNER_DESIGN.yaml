  # =========================================================================
  # Section: validations (§1.4 claims: priority ordering, satisfaction pass)
  # =========================================================================
  - section: validations
    instances:
      - name: unauthenticated_beats_not_found
        claim_type: priority_ordering
        grounds:
          - validations[priority=1]
          - validations[priority=3]
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "Pair auth vs existence (different from both §1.8 pairs): a CaregiverRole request with no X-User-ID on a non-existent resident id violates priority 1 and priority 3 simultaneously; ERR_UNAUTHENTICATED (401) must win over ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty database; request carries X-User-Role: CaregiverRole but no X-User-ID header (entity_backed role requires it)"
          setup_api_calls: []
          trigger:
            - call: "GET /api/residents/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: CaregiverRole
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_UNAUTHENTICATED with HTTP 401 (auth priority 1 beats existence priority 3)"

      - name: not_found_beats_state_on_admission_approve
        claim_type: priority_ordering
        grounds:
          - validations[priority=3]
          - validations[priority=5]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "Pair existence vs state: approving a non-existent admission id can never evaluate the PENDING from-state; ERR_NOT_FOUND (404, priority 3) is returned rather than ERR_INVALID_STATE (priority 5)."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /api/admissions/11111111-2222-3333-4444-555555555555/approve"
              payload: {}
              as: Provider
              as_user_id: "prov-2"
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_NOT_FOUND with HTTP 404 (existence priority 3 beats state priority 5)"

