          assert:
            - "HTTP status == 403"
            - "response data.error_id == ERR_ACCOUNT_SUSPENDED"
            - "response data.error_id != ERR_DEVICE_CAP_EXCEEDED"
            - "Household.${h_id}.entitled_device_count == 1"
            - "Household.${h_id}.account_status == SUSPENDED and Household.${h_id}.suspended_at == 2026-05-01T00:00:00.000Z"

