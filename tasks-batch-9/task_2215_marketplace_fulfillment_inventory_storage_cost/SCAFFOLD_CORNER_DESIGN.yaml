            - call: "POST /fulfillment/inbound-shipment-plans/${pb_id}/confirm"
              payload: {}
              as: SellerOperator
              as_user_id: "${s_id}"
            - call: "POST /fulfillment/inbound-shipment-plans/${pb_id}/ship"
              payload: {}
              as: SellerOperator
              as_user_id: "${s_id}"
            - call: "POST /fulfillment/inbound-shipment-plans/${pb_id}/receive"
              payload: { received_lines: [ { shipment_line_item_id: "${lib_id}", received_units: 18, unfulfillable_units: 0 } ] }
              as: FcOperator
              as_user_id: "${fc_id}"
            - call: "GET /fulfillment/inventory-lots"
              payload: { sku_listing_id: "${l1_id}", limit: 2, offset: 0 }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { lot1_id: "$.data[0].id", lot2_id: "$.data[1].id" }
            - call: "GET /fulfillment/inventory-lots/${lot2_id}"
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { lot2_v1: "$.data.version" }
          trigger:
            - call: "POST /fulfillment/inventory-lots/${lot1_id}/unfulfillable-classification"
              payload: { units: 10, disposition_reason: "CUSTOMER_DAMAGE" }
              as: FcOperator
              as_user_id: "${fc_id}"
              captures: { lot1_unfulfillable: "$.data.unfulfillable_units" }
            - call: "POST /fulfillment/removal-orders"
              payload: { inventory_lot_id: "${lot2_id}", removal_method: "RETURN_TO_SELLER", unit_pool: "FULFILLABLE", requested_units: 18, removal_window_start: "2026-09-01T00:00:00Z", removal_window_end: "2026-09-02T00:00:00Z", expected_inventory_lot_version: "${lot2_v1}" }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { r2_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MarketplaceAdmin
            - call: "POST /fulfillment/removal-orders/${r2_id}/complete"
              payload: {}
              as: FcOperator
              as_user_id: "${fc_id}"
              captures: { lot2_status: "$.data.status" }
            - call: "GET /fulfillment/sku-listings/${l1_id}"
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { lst_fulfillable: "$.data.fulfillable_units", lst_unfulfillable: "$.data.unfulfillable_units", lst_missing: "$.data.missing_units", lst_health: "$.data.inventory_health" }
          assert:
            - "${lot1_unfulfillable} == 10"
            - "${lot2_status} == COMPLETED"
            - "InventoryLot.${lot1_id}.fulfillable_units == 40"
            - "InventoryLot.${lot1_id}.unfulfillable_units == 10"
            - "InventoryLot.${lot1_id}.lot_status == ACTIVE"
            - "InventoryLot.${lot2_id}.fulfillable_units == 0"
            - "InventoryLot.${lot2_id}.units_removed == 18"
            - "InventoryLot.${lot2_id}.missing_units == 2"
            - "InventoryLot.${lot2_id}.lot_status == DEPLETED"
            - "${lst_fulfillable} == 40 (only the ACTIVE lot contributes)"
            - "${lst_unfulfillable} == 10"
            - "${lst_missing} == 2 (the DEPLETED lot still contributes to missing_units)"
            - "${lst_health} == HEALTHY"
            - "SkuListing.${l1_id}.listing_status == ACTIVE"
            - "SellerAccount.${s_id}.open_discrepancy_units == 2"

      - name: excluded_forecast_variant_pair_on_identical_inputs
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: velocity_forecast_seasonal_blend_diverges_from_trailing_window
          rationale: "§1.8 dual_variant_calc runs TRAILING_30 and SEASONAL_WEIGHTED on one listing with identical trailing inputs and asserts both recommended_replenishment_units, which is the full dual-variant probe."

      - name: excluded_four_link_cascade_from_a_single_write
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: partial_receipt_cascade_depth_four_shortfall_to_quota_downgrade
          rationale: "§1.8 cascade_depth already asserts all four links of the receipt cascade — lot pools, listing health, seller discrepancy ledger and quota re-scoring — from one receive call."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: receive_response_already_reflects_the_whole_cascade
        claim_type: immediate
        grounds:
          - consistency_model
          - endpoints[POST /fulfillment/inbound-shipment-plans/{id}/receive]
          - calculations.listing_health_recompute
        distinguishing_aspect: "The receive response body itself already carries the post-cascade plan counters, and reads issued immediately afterwards with no intervening write show the lot, listing, seller ledger and quota already updated — nothing is deferred to a later sweep or to the next billing run."
        test_recipe:
          setup:
            - "One IN_TRANSIT plan of 100 declared units; receipt will bring 80 units with 30 unfulfillable, leaving a 20-unit shortfall."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MarketplaceAdmin
            - call: "POST /fulfillment/sellers"
              payload: { legal_name: "Northwind Goods", storage_cubic_feet_entitlement: 1000.0000, unit_cost_cap_cents: 200000 }
              as: MarketplaceAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /fulfillment/fulfillment-centers"
              payload: { fc_code: "FC-A1", region_code: "US-WEST", prep_profile: "LABEL_ONLY", case_pack_min_units: 1, receiving_capacity_units_per_window: 100000, monthly_storage_rate_cents_per_cubic_foot: 87, ltsf_rate_cents_per_cubic_foot: 620 }
              as: MarketplaceAdmin
              captures: { fc_id: "$.data.id" }
            - call: "POST /fulfillment/sku-listings"
              payload: { seller_account_id: "${s_id}", sku: "SKU-ALPHA", unit_cubic_feet: 1.0000, unit_cost_cents: 1250 }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { l1_id: "$.data.id" }
            - call: "POST /fulfillment/sellers/${s_id}/restock-quotas"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z", base_capacity_units: 1000, sell_through_rate: 2.5000, excess_units_ratio: 0.0000, stranded_ratio: 0.0000, in_stock_rate: 1.0000 }
              as: MarketplaceAdmin
              captures: { q_id: "$.data.id" }
            - call: "GET /fulfillment/sellers/${s_id}"
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { sv1: "$.data.version" }
            - call: "POST /fulfillment/inbound-shipment-plans"
              payload: { seller_account_id: "${s_id}", destination_fc_id: "${fc_id}", appointment_window_start: "2026-08-01T00:00:00Z", appointment_window_end: "2026-08-02T00:00:00Z", expected_seller_account_version: "${sv1}" }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { p1_id: "$.data.id" }
            - call: "POST /fulfillment/inbound-shipment-plans/${p1_id}/line-items"
              payload: { sku_listing_id: "${l1_id}", units: 100, case_pack_units: 10, polybagged: true, label_type: "FNSKU" }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { li1_id: "$.data.id" }
            - call: "POST /fulfillment/inbound-shipment-plans/${p1_id}/confirm"
              payload: {}
              as: SellerOperator
              as_user_id: "${s_id}"
            - call: "POST /fulfillment/inbound-shipment-plans/${p1_id}/ship"
              payload: {}
              as: SellerOperator
              as_user_id: "${s_id}"
          trigger:
            - call: "POST /fulfillment/inbound-shipment-plans/${p1_id}/receive"
              payload: { received_lines: [ { shipment_line_item_id: "${li1_id}", received_units: 80, unfulfillable_units: 30 } ] }
              as: FcOperator
              as_user_id: "${fc_id}"
              captures: { resp_status: "$.data.status", resp_received: "$.data.received_units", resp_missing: "$.data.missing_units" }
            - call: "GET /fulfillment/sku-listings/${l1_id}"
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { lst_fulfillable: "$.data.fulfillable_units", lst_unfulfillable: "$.data.unfulfillable_units", lst_missing: "$.data.missing_units", lst_health: "$.data.inventory_health" }
            - call: "GET /fulfillment/sellers/${s_id}"
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { sel_discrepancy: "$.data.open_discrepancy_units" }
            - call: "GET /fulfillment/sellers/${s_id}/restock-quotas"
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { quota_first: "$.data[0].id" }
            - call: "GET /fulfillment/inventory-lots"
              payload: { sku_listing_id: "${l1_id}" }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { lot1_id: "$.data[0].id" }
          assert:
            - "the receive response itself already shows ${resp_status} == PARTIALLY_RECEIVED, ${resp_received} == 80 and ${resp_missing} == 20"
            - "the immediately following listing read shows ${lst_fulfillable} == 50, ${lst_unfulfillable} == 30, ${lst_missing} == 20 and ${lst_health} == HEALTHY with no retry or delay"
            - "${sel_discrepancy} == 20"
            - "${quota_first} == ${q_id} and that row already shows iprs_score == 1000, capacity_tier == TIER_ELEVATED and restock_limit_units == 3000"
            - "InventoryLot.${lot1_id}.reconciliation_status == DISCREPANCY_OPEN"
            - "InventoryLot.${lot1_id}.fulfillable_units == 50"
            - "InventoryLot.${lot1_id}.unfulfillable_units == 30"
            - "InventoryLot.${lot1_id}.missing_units == 20"
            - "SkuListing.${l1_id}.lot_ever_created == true"
            - "no second call is needed for any of these values to appear, and repeating the reads returns identical values"
