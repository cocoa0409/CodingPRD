  condition: Lead id does not exist
- id: ERR_ASSIGNMENT_NOT_FOUND
  http: 404
  condition: LeadAssignment id does not exist
- id: ERR_LIVE_CONNECTION_NOT_FOUND
  http: 404
  condition: LiveConnection id does not exist
- id: ERR_CREDIT_CLAIM_NOT_FOUND
  http: 404
  condition: CreditClaim id does not exist
- id: ERR_LISTING_NOT_FOUND
  http: 404
  condition: Listing id does not exist
- id: ERR_DISPUTE_NOT_FOUND
