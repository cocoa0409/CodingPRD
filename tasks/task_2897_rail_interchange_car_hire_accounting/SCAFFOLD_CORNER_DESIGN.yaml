      - name: fee_threshold_boundary_covered_by_difficulty_index
        claim_type: Value at threshold
        grounds:
          - calculations.clearinghouse_fee
          - global_constants.FEE_TIER_BREAK_CENTS
        distinguishing_aspect: "The threshold algorithm's boundary triple (below, at, above the break) is asserted by the difficulty index."
        excluded_because:
          difficulty_instance: clearinghouse_fee_steps_down_at_exactly_500000_cents_of_pre_fee_net
          rationale: "That instance drives pre_fee_net_cents to 499999 / 500000 / 500001 through real repair bills and shows the fee falling from 2500 to 1750 on the last cent, which is the whole threshold claim including the crossing behaviour."

      - name: per_diem_tier_boundary_covered_by_difficulty_index
        claim_type: Each tier boundary tested
        grounds:
          - calculations.hire_time_component
          - entities.CarType.fields.tier2_threshold_days
        distinguishing_aspect: "The tiered_pricing claims — marginal versus average rate and the ordering of free-time deduction against the day ceiling — are asserted by the difficulty index."
        excluded_because:
          difficulty_instance: hire_time_component_requires_free_time_subtraction_before_day_ceiling
          rationale: "That instance pins the 76.00-hour movement at 3 days / 7800 cents and shows the 4-day / 10900 answer that the wrong step order produces, covering the tier split and the ordering in one assertion set."

      - name: repair_variant_divergence_covered_by_difficulty_index
        claim_type: Variant Divergence
        grounds:
          - calculations.repair_responsibility_determination.variants
        distinguishing_aspect: "The same-data-different-answer claim for the two responsibility variants is asserted by the difficulty index."
        excluded_because:
          difficulty_instance: repair_responsibility_handling_line_vs_owner_rule_picks_different_road
          rationale: "That instance holds every field constant, flips defect_class, and shows responsible_road_id and total_cents both move — the delta between variants is exactly what it measures."

      - name: settlement_variant_reconciliation_covered_by_difficulty_index
        claim_type: Reconciliation
        grounds:
          - calculations.settlement_statement.variants
        distinguishing_aspect: "The delta applied to the ledger when the statement variant switches from AS_REPORTED to RECONCILED is asserted by the difficulty index."
        excluded_because:
          difficulty_instance: settlement_statement_as_reported_vs_reconciled_diverge_by_4676
          rationale: "That instance measures the 4676-cent switch delta on a 4700-cent dispute resolution — the non-obvious part being that the fee tier is re-evaluated on the new basis — which subsumes a plain reconciliation check."

  # ===========================================================================
  - section: validations
    instances:

      - name: missing_or_unknown_auth_headers_return_unauthenticated
        claim_type: Violation → Error
        grounds:
          - validations.priority_1_ERR_UNAUTHENTICATED
          - validations.priority_2_ERR_UNKNOWN_ROLE
          - validations.priority_4_ERR_ACTING_RAILROAD_UNKNOWN
          - roles
        distinguishing_aspect: "The three header failures are distinct and ordered: an absent or empty X-User-Role is 401 ERR_UNAUTHENTICATED; a well-formed but unlisted role name is 401 ERR_UNKNOWN_ROLE; and an entity_backed role whose X-User-ID names no Railroad is 403 ERR_ACTING_RAILROAD_UNKNOWN — checked before the {car_id} path lookup, so a bogus acting road on a bogus car still reports the header error, never ERR_CAR_NOT_FOUND."
        test_recipe:
          setup:
            - "Railroads BN and CX exist; car type XM and one CX-owned car exist so that a valid request would succeed."
          setup_api_calls:
            - call: "POST /car-hire/railroads"
              payload: { reporting_mark: "CX", name: "Coast Express Lines" }
              as: ClearinghouseAdmin
              captures: { cx_id: "$.data.id" }
            - call: "POST /car-hire/car-types"
              payload: { car_type_code: "XM", description: "Box car, plain door", time_component_mode: "PER_DIEM", free_time_hours: 4, per_diem_rate_cents: 2350, tier2_threshold_days: 2, tier2_per_diem_rate_cents: 3100, mileage_rate_millicents_per_mile: 2350, loaded_mileage_only: true }
              as: ClearinghouseAdmin
              captures: { xm_id: "$.data.id" }
            - call: "POST /car-hire/cars"
              payload: { car_mark: "CX 100001", car_type_id: "${xm_id}", owner_road_id: "${cx_id}", initial_handling_road_id: "${cx_id}" }
              as: FleetOwner
              as_user_id: "${cx_id}"
              captures: { car_id: "$.data.id" }
          trigger:
            - call: "GET /car-hire/cars/${car_id}"
              payload: {}
              as: ""
              note: "X-User-Role header omitted entirely (and, separately, sent as the empty string \"\" — never as whitespace, which is a different header)"
              captures: { err1: "$.data.error_id" }
            - call: "GET /car-hire/cars/${car_id}"
              payload: {}
              as: "YardMaster"
              note: "syntactically fine, but not one of the five roles in Table 1.7"
              captures: { err2: "$.data.error_id" }
            - call: "GET /car-hire/cars/44444444-4444-4444-8444-444444444444"
              payload: {}
              as: FleetOwner
              as_user_id: "55555555-5555-4555-8555-555555555555"
              note: "valid role, but X-User-ID resolves to no Railroad, and the path id is also unknown"
              captures: { err3: "$.data.error_id" }
          assert:
            - "err1 == ERR_UNAUTHENTICATED with HTTP 401"
            - "err2 == ERR_UNKNOWN_ROLE with HTTP 401"
            - "err3 == ERR_ACTING_RAILROAD_UNKNOWN with HTTP 403, NOT ERR_CAR_NOT_FOUND — priority 4 precedes the path lookup at priority 5"
            - "the same GET as FleetOwner with as_user_id ${cx_id} returns HTTP 200"

      - name: every_path_segment_probe_returns_not_found
        claim_type: Violation → Error
        grounds:
          - validations.priority_5_path_not_found
          - errors
        distinguishing_aspect: "Priority 5 names the entity that failed, one error id per entity, and the same unused UUID therefore produces thirteen different error ids across the thirteen by-id reads — a single generic ERR_NOT_FOUND would fail this."
        test_recipe:
          setup:
            - "An empty database is enough: ClearinghouseAdmin is an opaque role, so no X-User-ID is required and priority 4 cannot intervene. The probe UUID 66666666-6666-4666-8666-666666666666 is used for every path."
