scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — dual_variant_calc (>= 2; different entity domains)
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: grantor_vs_separate_taxpayer_trust_income_tax
        grounds:
          - calculations.trust_income_tax
          - entities.Trust.fields.is_grantor_trust
          - entities.TaxFiling.fields.tax_due_cents
          - state_machines.TaxFiling.DRAFT_to_FILED
        distinguishing_aspect: |
          Same taxable_income_snapshot_cents (2000000) produces tax_due_cents=543550 under the
          separate_taxpayer variant (is_grantor_trust=false) versus tax_due_cents=0 under the
          grantor_trust_passthrough variant — divergence on the TaxFiling/Trust tax domain.
        test_recipe:
          setup:
            - "Two non-skip beneficiaries are irrelevant; two trusts owned by one grantor: trust S (is_grantor_trust=false) and trust G (is_grantor_trust=true), both ACTIVE."
            - "Each trust has an OPEN account with a single INTEREST receipt of 2000000 cents (DNI=2000000) and a CONTRIBUTION of 1 cent to allow activation; no distributions so taxable_income=2000000."
            - "Both accounts are CLOSED; a DRAFT TaxFiling exists for each."
          setup_api_calls:
            - call: "POST /grantors"
              payload: { full_name: "G One", generation_level: 0 }
              as: TrustAdmin
              captures: { g_id: $.data.id }
            - call: "POST /trustees"
              payload: { full_name: "T A", is_corporate: true }
              as: TrustAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /trusts"
              payload: { name: "Separate Trust", grantor_id: "${g_id}", trust_type: "IRREVOCABLE", is_grantor_trust: false }
              as: TrustAdmin
              captures: { trust_s_id: $.data.id }
            - call: "POST /trusts/${trust_s_id}/trustee-appointments"
              payload: { trustee_id: "${t1_id}", term_start: "2025-01-01T00:00:00.000Z", term_end: "2030-01-01T00:00:00.000Z" }
              as: TrustAdmin
              captures: { app_s_id: $.data.id }
            - call: "POST /trusts/${trust_s_id}/accounts"
              payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00.000Z", period_end: "2026-01-01T00:00:00.000Z" }
              as: TrustAdmin
              captures: { acct_s_id: $.data.id }
            - call: "POST /accounts/${acct_s_id}/receipts"
              payload: { amount_cents: 1, receipt_kind: "CONTRIBUTION" }
              as: TrustAdmin
            - call: "POST /accounts/${acct_s_id}/receipts"
              payload: { amount_cents: 2000000, receipt_kind: "INTEREST" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_s_id}/fund"
              payload: {}
              as: TrustAdmin
            - call: "POST /trusts/${trust_s_id}/activate"
              payload: {}
              as: TrustAdmin
            - call: "POST /accounts/${acct_s_id}/close"
              payload: {}
              as: TrustAdmin
            - call: "POST /accounts/${acct_s_id}/filings"
              payload: {}
              as: TrustAdmin
              captures: { filing_s_id: $.data.id }
            - call: "POST /trusts"
              payload: { name: "Grantor Trust", grantor_id: "${g_id}", trust_type: "IRREVOCABLE", is_grantor_trust: true }
              as: TrustAdmin
              captures: { trust_g_id: $.data.id }
            - call: "POST /trusts/${trust_g_id}/trustee-appointments"
              payload: { trustee_id: "${t1_id}", term_start: "2025-01-01T00:00:00.000Z", term_end: "2030-01-01T00:00:00.000Z" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_g_id}/accounts"
              payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00.000Z", period_end: "2026-01-01T00:00:00.000Z" }
              as: TrustAdmin
              captures: { acct_g_id: $.data.id }
            - call: "POST /accounts/${acct_g_id}/receipts"
              payload: { amount_cents: 1, receipt_kind: "CONTRIBUTION" }
              as: TrustAdmin
            - call: "POST /accounts/${acct_g_id}/receipts"
              payload: { amount_cents: 2000000, receipt_kind: "INTEREST" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_g_id}/fund"
              payload: {}
              as: TrustAdmin
            - call: "POST /trusts/${trust_g_id}/activate"
              payload: {}
              as: TrustAdmin
            - call: "POST /accounts/${acct_g_id}/close"
              payload: {}
              as: TrustAdmin
            - call: "POST /accounts/${acct_g_id}/filings"
              payload: {}
              as: TrustAdmin
              captures: { filing_g_id: $.data.id }
          trigger:
            - call: "POST /filings/${filing_s_id}/file"
              payload: {}
              as: TrustAdmin
              captures: { tax_s: $.data.tax_due_cents }
            - call: "POST /filings/${filing_g_id}/file"
              payload: {}
              as: TrustAdmin
              captures: { tax_g: $.data.tax_due_cents }
          assert:
            - "TaxFiling.${filing_s_id}.tax_due_cents == 543550"
            - "TaxFiling.${filing_g_id}.tax_due_cents == 0"

      - name: capital_gain_to_principal_vs_income_allocation
        grounds:
          - calculations.principal_income_allocation
          - calculations.distributable_net_income
          - entities.Trust.fields.capital_gains_to_income
          - entities.Receipt.fields.ledger_side
        distinguishing_aspect: |
          An identical CAPITAL_GAIN receipt of 500000 cents yields ledger_side=PRINCIPAL and DNI=0
          under capital_gains_to_income=false, versus ledger_side=INCOME and DNI=500000 under
          capital_gains_to_income=true — divergence on the Receipt/TrustAccount accounting domain
          (distinct from Rule-1 instance 1's tax domain).
        test_recipe:
          setup:
            - "One ACTIVE trust with capital_gains_to_income=false and an OPEN account holding only a 500000-cent CAPITAL_GAIN receipt (plus a 1-cent CONTRIBUTION for activation)."
          setup_api_calls:
            - call: "POST /grantors"
              payload: { full_name: "G Two", generation_level: 0 }
              as: TrustAdmin
              captures: { g_id: $.data.id }
            - call: "POST /trustees"
              payload: { full_name: "T B" }
              as: TrustAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /trusts"
              payload: { name: "CapGain Trust", grantor_id: "${g_id}", trust_type: "IRREVOCABLE", capital_gains_to_income: false }
              as: TrustAdmin
              captures: { trust_id: $.data.id }
            - call: "POST /trusts/${trust_id}/trustee-appointments"
              payload: { trustee_id: "${t1_id}", term_start: "2025-01-01T00:00:00.000Z", term_end: "2030-01-01T00:00:00.000Z" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/accounts"
              payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00.000Z", period_end: "2026-01-01T00:00:00.000Z" }
              as: TrustAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/receipts"
              payload: { amount_cents: 1, receipt_kind: "CONTRIBUTION" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/fund"
              payload: {}
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/activate"
              payload: {}
              as: TrustAdmin
          trigger:
            - call: "POST /accounts/${acct_id}/receipts"
              payload: { amount_cents: 500000, receipt_kind: "CAPITAL_GAIN" }
              as: TrustAdmin
              captures: { cg_receipt_id: $.data.id, cg_side: $.data.ledger_side }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: TrustAdmin
              captures: { dni: $.data.dni_cents }
          assert:
            - "Receipt.${cg_receipt_id}.ledger_side == PRINCIPAL"
            - "TrustAccount.${acct_id}.dni_cents == 0"

  # =========================================================================
  # Rule 2 — combinatorial_formula (>= 2; different modes from {a,b,c})
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: compressed_bracket_tiered_tax_mode_a
        grounds:
          - calculations.trust_income_tax
          - entities.TaxFiling.fields.taxable_income_snapshot_cents
          - entities.TaxFiling.fields.tax_due_cents
          - state_machines.TaxFiling.DRAFT_to_FILED
        distinguishing_aspect: |
          Mode (a): a four-tier marginal-rate formula with three breakpoints (B1=310000, B2=1115000,
          B3=1520000) and conditional branches; taxable_income_snapshot_cents=2000000 straddles all
          four brackets, giving tax_due_cents=543550 (31000+193200+141750+177600).
        test_recipe:
          setup:
            - "Reuse the separate-taxpayer trust pattern: ACTIVE non-grantor trust, account CLOSED with taxable_income=2000000, DRAFT filing."
          setup_api_calls:
            - call: "POST /grantors"
              payload: { full_name: "G Tax", generation_level: 0 }
              as: TrustAdmin
              captures: { g_id: $.data.id }
            - call: "POST /trustees"
              payload: { full_name: "T Tax" }
              as: TrustAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /trusts"
              payload: { name: "Bracket Trust", grantor_id: "${g_id}", trust_type: "IRREVOCABLE", is_grantor_trust: false }
              as: TrustAdmin
              captures: { trust_id: $.data.id }
            - call: "POST /trusts/${trust_id}/trustee-appointments"
              payload: { trustee_id: "${t1_id}", term_start: "2025-01-01T00:00:00.000Z", term_end: "2030-01-01T00:00:00.000Z" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/accounts"
              payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00.000Z", period_end: "2026-01-01T00:00:00.000Z" }
              as: TrustAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/receipts"
              payload: { amount_cents: 1, receipt_kind: "CONTRIBUTION" }
              as: TrustAdmin
            - call: "POST /accounts/${acct_id}/receipts"
              payload: { amount_cents: 2000000, receipt_kind: "INTEREST" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/fund"
              payload: {}
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/activate"
              payload: {}
              as: TrustAdmin
            - call: "POST /accounts/${acct_id}/close"
              payload: {}
              as: TrustAdmin
            - call: "POST /accounts/${acct_id}/filings"
              payload: {}
              as: TrustAdmin
              captures: { filing_id: $.data.id }
          trigger:
            - call: "POST /filings/${filing_id}/file"
              payload: {}
              as: TrustAdmin
              captures: { tax: $.data.tax_due_cents }
          assert:
            - "TaxFiling.${filing_id}.tax_due_cents == 543550"

      - name: k1_character_residual_rounding_mode_b
        grounds:
          - calculations.k1_character_allocation
          - entities.K1.fields.ordinary_income_cents
          - entities.K1.fields.qualified_dividend_cents
          - state_machines.Distribution.APPROVED_to_PAID
        distinguishing_aspect: |
          Mode (b): per-beneficiary character lines are round_half_up independently, THEN the residual
          (+1 cent ordinary, -1 cent qualified) is reconciled to the largest-carried-share beneficiary
          with created_at ASC tie-break; the earliest of the two 0.4-share beneficiaries (A) absorbs
          both residuals, producing A.ordinary=30001, A.qualified=9999 — a different cent split than a
          truncate-and-drop pass.
        test_recipe:
          setup:
            - "ACTIVE non-grantor trust, capital_gains_to_income=false; account OPEN with income receipts INTEREST 60001 + DIVIDEND_ORDINARY 15000 + DIVIDEND_QUALIFIED 24999 => DNI=100000 (ord_pool=75001, qd_pool=24999)."
            - "Three non-skip beneficiaries A,B,C created in that order; MANDATORY distributions A=40000, B=40000, C=20000 all APPROVED then PAID => total carried=100000 == DNI, shares 0.4/0.4/0.2; trust has 5000000 principal contribution so corpus suffices."
          setup_api_calls:
            - call: "POST /grantors"
              payload: { full_name: "G K1", generation_level: 0 }
              as: TrustAdmin
              captures: { g_id: $.data.id }
            - call: "POST /trustees"
              payload: { full_name: "Proposer T" }
              as: TrustAdmin
              captures: { t_prop_id: $.data.id }
            - call: "POST /trustees"
              payload: { full_name: "Approver T" }
              as: TrustAdmin
              captures: { t_appr_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "Ben A", grantor_id: "${g_id}", generation_level: 1 }
              as: TrustAdmin
              captures: { ben_a_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "Ben B", grantor_id: "${g_id}", generation_level: 1 }
              as: TrustAdmin
              captures: { ben_b_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "Ben C", grantor_id: "${g_id}", generation_level: 1 }
              as: TrustAdmin
              captures: { ben_c_id: $.data.id }
            - call: "POST /trusts"
              payload: { name: "K1 Trust", grantor_id: "${g_id}", trust_type: "IRREVOCABLE", capital_gains_to_income: false }
              as: TrustAdmin
              captures: { trust_id: $.data.id }
            - call: "POST /trusts/${trust_id}/trustee-appointments"
              payload: { trustee_id: "${t_prop_id}", term_start: "2025-01-01T00:00:00.000Z", term_end: "2030-01-01T00:00:00.000Z" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/trustee-appointments"
              payload: { trustee_id: "${t_appr_id}", term_start: "2025-01-01T00:00:00.000Z", term_end: "2030-01-01T00:00:00.000Z" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/accounts"
              payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00.000Z", period_end: "2026-01-01T00:00:00.000Z" }
              as: TrustAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/receipts"
              payload: { amount_cents: 5000000, receipt_kind: "CONTRIBUTION" }
              as: TrustAdmin
            - call: "POST /accounts/${acct_id}/receipts"
              payload: { amount_cents: 60001, receipt_kind: "INTEREST" }
              as: TrustAdmin
            - call: "POST /accounts/${acct_id}/receipts"
              payload: { amount_cents: 15000, receipt_kind: "DIVIDEND_ORDINARY" }
              as: TrustAdmin
            - call: "POST /accounts/${acct_id}/receipts"
              payload: { amount_cents: 24999, receipt_kind: "DIVIDEND_QUALIFIED" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/fund"
              payload: {}
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/activate"
              payload: {}
              as: TrustAdmin
            - call: "POST /accounts/${acct_id}/distributions"
              payload: { beneficiary_id: "${ben_a_id}", amount_cents: 40000, distribution_kind: "MANDATORY", proposer_trustee_id: "${t_prop_id}" }
              as: Trustee
              as_user_id: "${t_prop_id}"
              captures: { dist_a_id: $.data.id }
            - call: "POST /accounts/${acct_id}/distributions"
              payload: { beneficiary_id: "${ben_b_id}", amount_cents: 40000, distribution_kind: "MANDATORY", proposer_trustee_id: "${t_prop_id}" }
              as: Trustee
              as_user_id: "${t_prop_id}"
              captures: { dist_b_id: $.data.id }
            - call: "POST /accounts/${acct_id}/distributions"
              payload: { beneficiary_id: "${ben_c_id}", amount_cents: 20000, distribution_kind: "MANDATORY", proposer_trustee_id: "${t_prop_id}" }
              as: Trustee
              as_user_id: "${t_prop_id}"
              captures: { dist_c_id: $.data.id }
            - call: "POST /distributions/${dist_a_id}/approve"
              payload: {}
              as: Trustee
              as_user_id: "${t_appr_id}"
            - call: "POST /distributions/${dist_b_id}/approve"
              payload: {}
              as: Trustee
              as_user_id: "${t_appr_id}"
            - call: "POST /distributions/${dist_c_id}/approve"
              payload: {}
              as: Trustee
              as_user_id: "${t_appr_id}"
            - call: "POST /distributions/${dist_a_id}/pay"
              payload: {}
              as: Trustee
              as_user_id: "${t_prop_id}"
            - call: "POST /distributions/${dist_b_id}/pay"
              payload: {}
              as: Trustee
              as_user_id: "${t_prop_id}"
          trigger:
            - call: "POST /distributions/${dist_c_id}/pay"
              payload: {}
              as: Trustee
              as_user_id: "${t_prop_id}"
            - call: "GET /accounts/${acct_id}/k1s?beneficiary_id=${ben_a_id}"
              payload: {}
              as: TrustAdmin
              captures: { a_ord: "$.data[0].ordinary_income_cents", a_qd: "$.data[0].qualified_dividend_cents" }
          assert:
            - "K1 for ben_a on acct has ordinary_income_cents == 30001"
            - "K1 for ben_a on acct has qualified_dividend_cents == 9999"
            - "K1 for ben_b on acct has ordinary_income_cents == 30000 and qualified_dividend_cents == 10000"
            - "K1 for ben_c on acct has ordinary_income_cents == 15000 and qualified_dividend_cents == 5000"

  # =========================================================================
  # Rule 3 — non_linear_state_machine (>= 2; different entities)
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: trust_amendment_cycle_active_loop
        grounds:
          - state_machines.Trust.ACTIVE_to_AMENDMENT_PENDING
          - state_machines.Trust.AMENDMENT_PENDING_to_ACTIVE
          - entities.Trust.fields.capital_gains_to_income
        distinguishing_aspect: |
          Trust traverses the cycle ACTIVE -> AMENDMENT_PENDING -> ACTIVE; on commit the staged
          capital_gains_to_income election flips false->true and the trust returns to ACTIVE,
          proving a non-linear (cyclic) shape on the Trust entity.
        test_recipe:
          setup:
            - "ACTIVE REVOCABLE trust with capital_gains_to_income=false."
          setup_api_calls:
            - call: "POST /grantors"
              payload: { full_name: "G Amend", generation_level: 0 }
              as: TrustAdmin
              captures: { g_id: $.data.id }
            - call: "POST /trustees"
              payload: { full_name: "T Amend" }
              as: TrustAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /trusts"
              payload: { name: "Revocable Trust", grantor_id: "${g_id}", trust_type: "REVOCABLE", capital_gains_to_income: false }
              as: TrustAdmin
              captures: { trust_id: $.data.id }
            - call: "POST /trusts/${trust_id}/trustee-appointments"
              payload: { trustee_id: "${t1_id}", term_start: "2025-01-01T00:00:00.000Z", term_end: "2030-01-01T00:00:00.000Z" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/accounts"
              payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00.000Z", period_end: "2026-01-01T00:00:00.000Z" }
              as: TrustAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/receipts"
              payload: { amount_cents: 1000000, receipt_kind: "CONTRIBUTION" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/fund"
              payload: {}
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/activate"
              payload: {}
              as: TrustAdmin
          trigger:
            - call: "POST /trusts/${trust_id}/amendments"
              payload: { set_capital_gains_to_income: true }
              as: Grantor
              as_user_id: "${g_id}"
              captures: { st_pending: $.data.status }
            - call: "POST /trusts/${trust_id}/amendments/commit"
              payload: {}
              as: Grantor
              as_user_id: "${g_id}"
              captures: { st_after: $.data.status, cgi_after: $.data.capital_gains_to_income }
          assert:
            - "After amendments, Trust.${trust_id}.status == AMENDMENT_PENDING"
            - "After commit, Trust.${trust_id}.status == ACTIVE"
            - "After commit, Trust.${trust_id}.capital_gains_to_income == true"

      - name: tax_filing_supersede_cycle
        grounds:
          - state_machines.TaxFiling.FILED_to_AMENDED
          - state_machines.TaxFiling.AMENDED_to_FILED
          - entities.TaxFiling.fields.supersedes_filing_id
          - entities.TaxFiling.fields.status
        distinguishing_aspect: |
          A different entity (TaxFiling) traverses FILED -> AMENDED -> FILED; on refile the original
          filing referenced by supersedes_filing_id flips to SUPERSEDED, exhibiting a non-linear cycle
          distinct from the Trust amendment cycle.
        test_recipe:
          setup:
            - "ACTIVE non-grantor trust, account CLOSED with taxable_income=2000000; an original TaxFiling F1 has been FILED; an amended DRAFT filing F2 references F1 via supersedes_filing_id."
            - "Note: filing F1 cascaded the account to FILED, which means F2 is created on an account already FILED — so F2 is created BEFORE filing F1 to stay on a CLOSED account. Order pinned below."
          setup_api_calls:
            - call: "POST /grantors"
              payload: { full_name: "G Refile", generation_level: 0 }
              as: TrustAdmin
              captures: { g_id: $.data.id }
            - call: "POST /trustees"
              payload: { full_name: "T Refile" }
              as: TrustAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /trusts"
              payload: { name: "Refile Trust", grantor_id: "${g_id}", trust_type: "IRREVOCABLE", is_grantor_trust: false }
              as: TrustAdmin
              captures: { trust_id: $.data.id }
            - call: "POST /trusts/${trust_id}/trustee-appointments"
              payload: { trustee_id: "${t1_id}", term_start: "2025-01-01T00:00:00.000Z", term_end: "2030-01-01T00:00:00.000Z" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/accounts"
              payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00.000Z", period_end: "2026-01-01T00:00:00.000Z" }
              as: TrustAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/receipts"
              payload: { amount_cents: 1, receipt_kind: "CONTRIBUTION" }
              as: TrustAdmin
            - call: "POST /accounts/${acct_id}/receipts"
              payload: { amount_cents: 2000000, receipt_kind: "INTEREST" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/fund"
              payload: {}
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/activate"
              payload: {}
              as: TrustAdmin
            - call: "POST /accounts/${acct_id}/close"
              payload: {}
              as: TrustAdmin
            - call: "POST /accounts/${acct_id}/filings"
              payload: {}
              as: TrustAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /accounts/${acct_id}/filings"
              payload: { supersedes_filing_id: "${f1_id}" }
              as: TrustAdmin
              captures: { f2_id: $.data.id }
            - call: "POST /filings/${f1_id}/file"
              payload: {}
              as: TrustAdmin
          trigger:
            - call: "POST /filings/${f2_id}/amend"
              payload: {}
              as: TrustAdmin
              captures: { f2_amended: $.data.status }
            - call: "POST /filings/${f2_id}/refile"
              payload: {}
              as: TrustAdmin
              captures: { f2_filed: $.data.status }
            - call: "GET /filings/${f1_id}"
              payload: {}
              as: TrustAdmin
              captures: { f1_status: $.data.status }
          assert:
            - "After amend, TaxFiling.${f2_id}.status == AMENDED"
            - "After refile, TaxFiling.${f2_id}.status == FILED"
            - "After refile, TaxFiling.${f1_id}.status == SUPERSEDED"

  # =========================================================================
  # Rule 4 — transitive_cascade (>= 2; depths >=3 and >=2; different triggers)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: pay_distribution_balance_dni_k1_chain_depth3
        grounds:
          - state_machines.Distribution.APPROVED_to_PAID
          - calculations.distribution_dni_carryout
          - calculations.k1_character_allocation
          - entities.TrustAccount.fields.dni_carried_out_cents
          - entities.K1.fields.total_carried_cents
        distinguishing_aspect: |
          Depth-3 chain triggered by Distribution PAID: (1) PAID debits Trust income/principal balances;
          (2) that balance mutation recomputes TrustAccount.dni_carried_out_cents (50000); (3) the
          carried-out change recomputes the beneficiary's K1.total_carried_cents (50000). Each link is
          caused by the prior link, not by the pay action directly.
        test_recipe:
          setup:
            - "ACTIVE non-grantor trust, capital_gains_to_income=false; account OPEN with DNI=100000 (INTEREST 100000); 5000000 principal contribution; one MANDATORY distribution of 50000 to non-skip Ben A, APPROVED (proposer t1, approver t2)."
          setup_api_calls:
            - call: "POST /grantors"
              payload: { full_name: "G Casc", generation_level: 0 }
              as: TrustAdmin
              captures: { g_id: $.data.id }
            - call: "POST /trustees"
              payload: { full_name: "Prop T" }
              as: TrustAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /trustees"
              payload: { full_name: "Appr T" }
              as: TrustAdmin
              captures: { t2_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "Ben A", grantor_id: "${g_id}", generation_level: 1 }
              as: TrustAdmin
              captures: { ben_a_id: $.data.id }
            - call: "POST /trusts"
              payload: { name: "Cascade Trust", grantor_id: "${g_id}", trust_type: "IRREVOCABLE", capital_gains_to_income: false }
              as: TrustAdmin
              captures: { trust_id: $.data.id }
            - call: "POST /trusts/${trust_id}/trustee-appointments"
              payload: { trustee_id: "${t1_id}", term_start: "2025-01-01T00:00:00.000Z", term_end: "2030-01-01T00:00:00.000Z" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/trustee-appointments"
              payload: { trustee_id: "${t2_id}", term_start: "2025-01-01T00:00:00.000Z", term_end: "2030-01-01T00:00:00.000Z" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/accounts"
              payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00.000Z", period_end: "2026-01-01T00:00:00.000Z" }
              as: TrustAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/receipts"
              payload: { amount_cents: 5000000, receipt_kind: "CONTRIBUTION" }
              as: TrustAdmin
            - call: "POST /accounts/${acct_id}/receipts"
              payload: { amount_cents: 100000, receipt_kind: "INTEREST" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/fund"
              payload: {}
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/activate"
              payload: {}
              as: TrustAdmin
            - call: "POST /accounts/${acct_id}/distributions"
              payload: { beneficiary_id: "${ben_a_id}", amount_cents: 50000, distribution_kind: "MANDATORY", proposer_trustee_id: "${t1_id}" }
              as: Trustee
              as_user_id: "${t1_id}"
              captures: { dist_id: $.data.id }
            - call: "POST /distributions/${dist_id}/approve"
              payload: {}
              as: Trustee
              as_user_id: "${t2_id}"
          trigger:
            - call: "POST /distributions/${dist_id}/pay"
              payload: {}
              as: Trustee
              as_user_id: "${t1_id}"
              captures: { carried: $.data.dni_carried_amount_cents }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: TrustAdmin
              captures: { acct_carried: $.data.dni_carried_out_cents }
            - call: "GET /accounts/${acct_id}/k1s?beneficiary_id=${ben_a_id}"
              payload: {}
              as: TrustAdmin
              captures: { k1_total: "$.data[0].total_carried_cents" }
          assert:
            - "Distribution.${dist_id}.dni_carried_amount_cents == 50000"
            - "TrustAccount.${acct_id}.dni_carried_out_cents == 50000"
            - "K1 for ben_a total_carried_cents == 50000"

      - name: file_tax_account_filed_tax_disbursement_depth2
        grounds:
          - state_machines.TaxFiling.DRAFT_to_FILED
          - state_machines.TrustAccount.CLOSED_to_FILED
          - entities.Disbursement.fields.is_system_generated
          - calculations.trust_income_tax
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (TaxFiling FILED): (1) filing FILED snapshots taxable
          income and cascades the owning TrustAccount CLOSED -> FILED; (2) the resulting tax_due_cents
          (543550) spawns a system Disbursement (is_system_generated=true, expense_kind=TAX_PAYMENT)
          debiting principal. Each link caused by the prior link.
        test_recipe:
          setup:
            - "ACTIVE non-grantor trust, account CLOSED with taxable_income=2000000 and 5000000 principal contribution; a DRAFT filing exists."
          setup_api_calls:
            - call: "POST /grantors"
              payload: { full_name: "G FileCasc", generation_level: 0 }
              as: TrustAdmin
              captures: { g_id: $.data.id }
            - call: "POST /trustees"
              payload: { full_name: "T FileCasc" }
              as: TrustAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /trusts"
              payload: { name: "FileCasc Trust", grantor_id: "${g_id}", trust_type: "IRREVOCABLE", is_grantor_trust: false }
              as: TrustAdmin
              captures: { trust_id: $.data.id }
            - call: "POST /trusts/${trust_id}/trustee-appointments"
              payload: { trustee_id: "${t1_id}", term_start: "2025-01-01T00:00:00.000Z", term_end: "2030-01-01T00:00:00.000Z" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/accounts"
              payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00.000Z", period_end: "2026-01-01T00:00:00.000Z" }
              as: TrustAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/receipts"
              payload: { amount_cents: 5000000, receipt_kind: "CONTRIBUTION" }
              as: TrustAdmin
            - call: "POST /accounts/${acct_id}/receipts"
              payload: { amount_cents: 2000000, receipt_kind: "INTEREST" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/fund"
              payload: {}
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/activate"
              payload: {}
              as: TrustAdmin
            - call: "POST /accounts/${acct_id}/close"
              payload: {}
              as: TrustAdmin
            - call: "POST /accounts/${acct_id}/filings"
              payload: {}
              as: TrustAdmin
              captures: { filing_id: $.data.id }
          trigger:
            - call: "POST /filings/${filing_id}/file"
              payload: {}
              as: TrustAdmin
              captures: { tax: $.data.tax_due_cents }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: TrustAdmin
              captures: { acct_status: $.data.status }
            - call: "GET /accounts/${acct_id}/disbursements"
              payload: {}
              as: TrustAdmin
          assert:
            - "TaxFiling.${filing_id}.tax_due_cents == 543550"
            - "TrustAccount.${acct_id}.status == FILED"
            - "A Disbursement exists on acct with is_system_generated == true, expense_kind == TAX_PAYMENT, amount_cents == 543550, ledger_side == PRINCIPAL"

  # =========================================================================
  # Rule 5 — priority_pair_validation_conflict (>= 2; different category pairs)
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_pay
        grounds:
          - validations[priority=5]
          - validations[priority=13]
          - state_machines.Distribution.APPROVED_to_PAID
        distinguishing_aspect: |
          Category pair state (priority 5, ERR_INVALID_STATE) vs business_fiscal (priority 13,
          ERR_INSUFFICIENT_CORPUS): a PROPOSED (not APPROVED) distribution whose amount also exceeds
          corpus is rejected with ERR_INVALID_STATE, because state precondition is checked before the
          fiscal check.
        test_recipe:
          setup:
            - "ACTIVE trust, account OPEN, income=0 principal=1 (1-cent contribution); one PROPOSED MANDATORY distribution of 999999 to Ben A (never approved)."
          setup_api_calls:
            - call: "POST /grantors"
              payload: { full_name: "G P5a", generation_level: 0 }
              as: TrustAdmin
              captures: { g_id: $.data.id }
            - call: "POST /trustees"
              payload: { full_name: "Prop T" }
              as: TrustAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "Ben A", grantor_id: "${g_id}", generation_level: 1 }
              as: TrustAdmin
              captures: { ben_a_id: $.data.id }
            - call: "POST /trusts"
              payload: { name: "P5a Trust", grantor_id: "${g_id}", trust_type: "IRREVOCABLE" }
              as: TrustAdmin
              captures: { trust_id: $.data.id }
            - call: "POST /trusts/${trust_id}/trustee-appointments"
              payload: { trustee_id: "${t1_id}", term_start: "2025-01-01T00:00:00.000Z", term_end: "2030-01-01T00:00:00.000Z" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/accounts"
              payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00.000Z", period_end: "2026-01-01T00:00:00.000Z" }
              as: TrustAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/receipts"
              payload: { amount_cents: 1, receipt_kind: "CONTRIBUTION" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/fund"
              payload: {}
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/activate"
              payload: {}
              as: TrustAdmin
            - call: "POST /accounts/${acct_id}/distributions"
              payload: { beneficiary_id: "${ben_a_id}", amount_cents: 999999, distribution_kind: "MANDATORY", proposer_trustee_id: "${t1_id}" }
              as: Trustee
              as_user_id: "${t1_id}"
              captures: { dist_id: $.data.id }
          trigger:
            - call: "POST /distributions/${dist_id}/pay"
              payload: {}
              as: Trustee
              as_user_id: "${t1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: irrevocable_safety_beats_temporal_overlap_is_moot_use_referential_vs_fiscal_on_gst
        grounds:
          - validations[priority=12]
          - validations[priority=14]
          - state_machines.GstExemptionAllocation.ALLOCATED_to_RELEASED
        distinguishing_aspect: |
          Category pair business_referential (priority 12, ERR_GRANTOR_MISMATCH) vs business_fiscal
          (priority 14, ERR_GST_EXEMPTION_EXCEEDED): an allocation that both names a grantor_id whose
          id mismatches the trust's grantor AND requests more than the pool returns ERR_GRANTOR_MISMATCH
          because the referential check precedes the fiscal check. A different category pair than
          instance 1's state-vs-fiscal.
        test_recipe:
          setup:
            - "Two grantors G1 (owns the trust) and G2 (small exemption pool = 100 cents). ACTIVE trust owned by G1 with 5000000 principal."
          setup_api_calls:
            - call: "POST /grantors"
              payload: { full_name: "G1 Owner", generation_level: 0 }
              as: TrustAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /grantors"
              payload: { full_name: "G2 Other", generation_level: 0, gst_exemption_total_cents: 100 }
              as: TrustAdmin
              captures: { g2_id: $.data.id }
            - call: "POST /trustees"
              payload: { full_name: "T P5b" }
              as: TrustAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /trusts"
              payload: { name: "P5b Trust", grantor_id: "${g1_id}", trust_type: "IRREVOCABLE" }
              as: TrustAdmin
              captures: { trust_id: $.data.id }
            - call: "POST /trusts/${trust_id}/trustee-appointments"
              payload: { trustee_id: "${t1_id}", term_start: "2025-01-01T00:00:00.000Z", term_end: "2030-01-01T00:00:00.000Z" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/accounts"
              payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00.000Z", period_end: "2026-01-01T00:00:00.000Z" }
              as: TrustAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/receipts"
              payload: { amount_cents: 5000000, receipt_kind: "CONTRIBUTION" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/fund"
              payload: {}
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/activate"
              payload: {}
              as: TrustAdmin
            - call: "GET /trusts/${trust_id}"
              payload: {}
              as: TrustAdmin
              captures: { tv: $.data.version }
          trigger:
            - call: "POST /trusts/${trust_id}/gst-exemption-allocations"
              payload: { grantor_id: "${g2_id}", amount_cents: 200000, expected_trust_version: "${tv}" }
              as: TrustAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_GRANTOR_MISMATCH"

  # =========================================================================
  # Rule 6 — boundary_precision_check (>= 2; different metrics, different endpoints)
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: dni_carryout_cap_at_exactly_dni
        grounds:
          - calculations.distribution_dni_carryout
          - entities.Distribution.fields.dni_carried_amount_cents
          - state_machines.Distribution.APPROVED_to_PAID
        distinguishing_aspect: |
          Numeric-threshold boundary on the DNI cap via POST /distributions/{id}/pay: with DNI=1000000,
          a PAID distribution of exactly 1000000 carries dni_carried_amount_cents=1000000 (min(amount,
          remaining_dni) at amount==DNI carries the full amount).
        test_recipe:
          setup:
            - "ACTIVE non-grantor trust, capital_gains_to_income=false; account OPEN DNI=1000000 (INTEREST 1000000) plus 5000000 principal; one MANDATORY distribution of 1000000 to Ben A, APPROVED."
          setup_api_calls:
            - call: "POST /grantors"
              payload: { full_name: "G B6a", generation_level: 0 }
              as: TrustAdmin
              captures: { g_id: $.data.id }
            - call: "POST /trustees"
              payload: { full_name: "Prop T" }
              as: TrustAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /trustees"
              payload: { full_name: "Appr T" }
              as: TrustAdmin
              captures: { t2_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "Ben A", grantor_id: "${g_id}", generation_level: 1 }
              as: TrustAdmin
              captures: { ben_a_id: $.data.id }
            - call: "POST /trusts"
              payload: { name: "B6a Trust", grantor_id: "${g_id}", trust_type: "IRREVOCABLE", capital_gains_to_income: false }
              as: TrustAdmin
              captures: { trust_id: $.data.id }
            - call: "POST /trusts/${trust_id}/trustee-appointments"
              payload: { trustee_id: "${t1_id}", term_start: "2025-01-01T00:00:00.000Z", term_end: "2030-01-01T00:00:00.000Z" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/trustee-appointments"
              payload: { trustee_id: "${t2_id}", term_start: "2025-01-01T00:00:00.000Z", term_end: "2030-01-01T00:00:00.000Z" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/accounts"
              payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00.000Z", period_end: "2026-01-01T00:00:00.000Z" }
              as: TrustAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/receipts"
              payload: { amount_cents: 5000000, receipt_kind: "CONTRIBUTION" }
              as: TrustAdmin
            - call: "POST /accounts/${acct_id}/receipts"
              payload: { amount_cents: 1000000, receipt_kind: "INTEREST" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/fund"
              payload: {}
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/activate"
              payload: {}
              as: TrustAdmin
            - call: "POST /accounts/${acct_id}/distributions"
              payload: { beneficiary_id: "${ben_a_id}", amount_cents: 1000000, distribution_kind: "MANDATORY", proposer_trustee_id: "${t1_id}" }
              as: Trustee
              as_user_id: "${t1_id}"
              captures: { dist_id: $.data.id }
            - call: "POST /distributions/${dist_id}/approve"
              payload: {}
              as: Trustee
              as_user_id: "${t2_id}"
          trigger:
            - call: "POST /distributions/${dist_id}/pay"
              payload: {}
              as: Trustee
              as_user_id: "${t1_id}"
              captures: { carried: $.data.dni_carried_amount_cents }
          assert:
            - "Distribution.${dist_id}.dni_carried_amount_cents == 1000000"

      - name: empty_skip_beneficiary_set_yields_zero_gst_events_on_terminate
        grounds:
          - state_machines.Trust.TERMINATING_to_TERMINATED
          - entities.GstEvent.fields.event_type
          - entities.Beneficiary.fields.is_skip_person
        distinguishing_aspect: |
          Empty-set boundary on a DIFFERENT endpoint (POST /trusts/{id}/terminate/finalize): a trust
          with zero skip-person beneficiaries produces zero TAXABLE_TERMINATION GstEvents — the
          finalize cascade over an empty skip set emits no events (count == 0).
        test_recipe:
          setup:
            - "Trust with only a generation_level=1 (non-skip) beneficiary; ACTIVE then TERMINATING with its single account already FILED."
          setup_api_calls:
            - call: "POST /grantors"
              payload: { full_name: "G B6b", generation_level: 0 }
              as: TrustAdmin
              captures: { g_id: $.data.id }
            - call: "POST /trustees"
              payload: { full_name: "T B6b" }
              as: TrustAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "Ben NonSkip", grantor_id: "${g_id}", generation_level: 1 }
