  - section: rbac
    instances:
      - name: roles_cannot_reach_each_others_exclusive_operations
        claim_type: exclusive_operations
        grounds:
          - roles[Underwriter]
          - roles[RiskManager]
          - roles[ClaimsAdjuster]
          - roles[ComplianceOfficer]
          - validations[priority=1]
          - validations[priority=2]
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: |
          Four roles each own a disjoint slice of the workflow, and the authentication and
          authorization rungs sit at priorities 1 and 2 — ABOVE path-resource resolution at
          priority 3. So a forbidden role pointed at an id that does not exist must still answer
          403, never 404, and a request with no role header at all must answer 401 even when
          everything else about it is valid. Shared reads stay open to all four roles.
        test_recipe:
          setup:
            - "One insured with one disclosure package and one DRAFT submission; nothing else. The id 00000000-0000-4000-8000-0000000000ff matches no record."
          setup_api_calls:
            - call: "POST /dno/insureds"
              payload: { legal_name: "Vantiq Bio Inc", sector_code: "BIOTECH", exchange_listing: "LISTED", market_cap_usd: 1800000000, fiscal_year_end: "12-31", entity_capacity_cap_usd: 25000000 }
