  - rule_id: transitive_cascade
    instances:

      - name: class_i_recall_cascade_reaches_work_order_priority_four_hops
        grounds:
          - state_machines.RecallNotice.DRAFT_to_PUBLISHED
          - state_machines.RecallNotice.PUBLISHED_to_MANDATORY_REMOVAL
          - state_machines.Device.ON_LOAN_to_DOWN
          - state_machines.LoanerAssignment.DEPLOYED_to_CANCELLED
          - entities.WorkOrder.fields.loaner_status
          - entities.WorkOrder.fields.priority
          - calculations.recall_match_scan
        distinguishing_aspect: |
          Depth-4 chain originating at POST /recall-notices/{id}/publish, each link caused by
          the previous one: publish creates the RecallMatch rows -> the CLASS_I auto-branch
          takes the matched POOL unit ON_LOAN -> DOWN -> that device state change cancels the
          DEPLOYED LoanerAssignment -> that cancellation flips the covered WorkOrder to
          loaner_status UNCOVERED and escalates its priority P3 -> P1 with sla_hours 72 -> 4.
        test_recipe:
          setup:
            - "A MEDIUM patient monitor downed by a ROUTINE work order that is parked in AWAITING_PARTS at priority P3."
            - "A second unit of the SAME model held in the loaner pool and currently ON_LOAN covering that work order."
