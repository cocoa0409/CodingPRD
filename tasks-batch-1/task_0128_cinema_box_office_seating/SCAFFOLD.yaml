# =============================================================================
# Cinema Box Office & Seating — Scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  128. Cinema Box Office & Seating: showtime scheduling, reserved seat map,
  dynamic/matinee pricing, concession combo, membership/loyalty, distributor
  sliding film-rental split, refund/exchange, group/private rental

domain_name: cinema-box-office-seating
api_prefix: ""

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation         # finite seat pool reserved/held/sold/released
  secondary_archetype: pricing_engine          # dynamic/matinee/peak pricing + sliding distributor split
  complexity_layers:
    - optimistic_concurrency                   # OCC on Showtime.version for seat sales (true CREATE-with-supersede race)
    - cascading_side_effects                   # cancel showtime -> void tickets -> refund payments -> revert loyalty -> release seats
    - dual_variant_calculation                 # ticket price provisional-at-hold vs final-at-sale; distributor split first-week vs sliding
    - rate_threshold_triggers                  # loyalty tier breakpoints; sliding-split week thresholds

  entity_topology: hybrid
  # Auditorium -> Showtime (hierarchical) plus flat cross-aggregate FKs
  # (Ticket -> Member, Ticket -> Seat, Payment -> Order, Settlement -> Film).

  state_machine_shape: branching
  # Order forks PAID -> {REFUNDED, EXCHANGED} with divergent side-effect sets;
  # Showtime fork-join across SCHEDULED -> {ON_SALE, CANCELLED}; Ticket has a
  # parallel hold/sale cycle.

  relationship_patterns:
    - one_to_many          # Auditorium has many Showtimes; Showtime has many Seats
    - cross_aggregate      # Ticket references Member, Seat, Order across aggregates
    - many_to_many         # Order <-> Showtime via Tickets; Showtime <-> Film

  role_model: peer_roles
  # BoxOfficeAgent sells/refunds; Member self-serves own tickets/loyalty;
  # Distributor reads own settlements; CinemaManager schedules + cancels +
  # configures pricing. Identity pinned per role in §1.7.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Auditorium
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: name, type: string, source: input, description: "Auditorium display name (e.g., 'Hall 1')" }
      - { name: seat_count, type: integer, source: input, description: "Total physical seats; defines the seat-map size", constraints: ">= 1" }
      - { name: turnaround_minutes, type: integer, source: input, description: "Cleaning/turnaround buffer enforced AFTER each showtime's end before the next may begin in this auditorium", default: 20, constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE — auditoriums are always active in this scaffold (no retire workflow)", default: ACTIVE, constraints: "ACTIVE" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: Film
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: title, type: string, source: input, description: "Film title" }
      - { name: runtime_minutes, type: integer, source: input, description: "Film runtime; showtime duration = runtime + trailer/clean pad", constraints: ">= 1" }
      - { name: distributor_id, type: string, source: input, description: "FK -> Distributor.id; the distributor entitled to the rental split" }
      - { name: release_date, type: datetime, source: input, description: "ISO8601 UTC date of theatrical release; week index of a showtime is computed relative to this" }
      - { name: split_schedule, type: array, source: input, description: "Ordered sliding-scale rental terms: array of {week_index, distributor_pct} where week_index is 0-based weeks since release_date; first matching descending-applicable term applies. Must include a week_index 0 entry." }
      - { name: status, type: enum, source: system, description: "BOOKING | RUNNING | ENDED", default: BOOKING, constraints: "BOOKING | RUNNING | ENDED" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: Distributor
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: name, type: string, source: input, description: "Distributor company name" }
      - { name: minimum_guarantee_cents, type: integer, source: input, description: "Floor the distributor is owed per settlement regardless of the sliding-pct computation; settlement distributor_share is max(sliding_share, this)", default: 0, constraints: ">= 0" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, 3 fractional digits" }

  - name: Showtime
    parent: Auditorium
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: auditorium_id, type: string, source: input, description: "FK -> Auditorium.id; the room this showtime occupies" }
      - { name: film_id, type: string, source: input, description: "FK -> Film.id; the film screened" }
      - { name: starts_at, type: datetime, source: input, description: "ISO8601 UTC start instant" }
      - { name: ends_at, type: datetime, source: computed, description: "starts_at + Film.runtime_minutes + TRAILER_PAD_MINUTES; half-open interval [starts_at, ends_at) for overlap math" }
      - { name: pricing_profile, type: enum, source: input, description: "STANDARD | MATINEE | PEAK — selects base multiplier; MATINEE only valid when starts_at local hour < MATINEE_CUTOFF_HOUR", constraints: "STANDARD | MATINEE | PEAK" }
      - { name: base_price_cents, type: integer, source: input, description: "Per-seat base fare before profile multiplier and seat-class surcharge", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ON_SALE | CANCELLED | CLOSED", default: SCHEDULED, constraints: "SCHEDULED | ON_SALE | CANCELLED | CLOSED" }
      - { name: rental_basis, type: enum, source: input, description: "BOX_OFFICE — split computed on gross ticket receipts for this showtime; RENTAL — private-rental flat fee, no per-seat split", default: BOX_OFFICE, constraints: "BOX_OFFICE | RENTAL" }
      - { name: private_rental_fee_cents, type: integer, source: input, description: "Flat fee charged for a private/group buyout; required and > 0 when rental_basis == RENTAL, else must be 0", default: 0, constraints: ">= 0" }
      - { name: seats_sold, type: integer, source: computed, description: "Count of Tickets on this showtime in SOLD state" }
      - { name: seats_held, type: integer, source: computed, description: "Count of Tickets on this showtime in HELD state (unexpired)" }
      - { name: gross_receipts_cents, type: integer, source: computed, description: "Sum of final_price_cents over SOLD non-refunded Tickets on this showtime" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1; incremented on seat hold/sale/release and status change" }

  - name: Seat
    parent: Showtime
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: showtime_id, type: string, source: system, description: "FK -> Showtime.id; the showtime whose seat map this row belongs to" }
      - { name: row_label, type: string, source: input, description: "Row letter, e.g. 'A'" }
      - { name: seat_number, type: integer, source: input, description: "Seat index within the row, 1-based", constraints: ">= 1" }
      - { name: seat_class, type: enum, source: input, description: "STANDARD | PREMIUM | ACCESSIBLE — drives surcharge", default: STANDARD, constraints: "STANDARD | PREMIUM | ACCESSIBLE" }
      - { name: occupancy, type: enum, source: computed, description: "FREE | HELD | SOLD — derived from the Ticket currently bound to this seat", default: FREE, constraints: "FREE | HELD | SOLD" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, 3 fractional digits" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: email, type: string, source: input, description: "Login/contact email; unique" }
      - { name: full_name, type: string, source: input, description: "Member name" }
      - { name: loyalty_points, type: integer, source: computed, description: "Lifetime accrued points (1 point per 100 cents of final_price_cents on SOLD tickets), reduced on refund", default: 0 }
      - { name: tier, type: enum, source: computed, description: "BRONZE | SILVER | GOLD — derived from loyalty_points via TIER_THRESHOLDS", default: BRONZE, constraints: "BRONZE | SILVER | GOLD" }
      - { name: wallet_credit_cents, type: integer, source: computed, description: "Refundable store credit balance; credited on WALLET refunds, debited when applied to an order", default: 0, constraints: ">= 0" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: ConcessionCombo
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: name, type: string, source: input, description: "Combo display name (e.g., 'Large Popcorn + 2 Drinks')" }
      - { name: price_cents, type: integer, source: input, description: "List price of the combo", constraints: ">= 0" }
      - { name: member_discount_pct, type: number, source: input, description: "Fraction (0..1) discount applied to combo price for SILVER+ members", default: 0, constraints: "0 <= x <= 1" }
      - { name: status, type: enum, source: system, description: "AVAILABLE — combos are config and stay available in this scaffold", default: AVAILABLE, constraints: "AVAILABLE" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: showtime_id, type: string, source: input, description: "FK -> Showtime.id; the showtime all tickets in this order belong to" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the purchasing member (nullable for walk-up agent sales is NOT allowed — every order has a member)" }
      - { name: seat_ids, type: array, source: input, description: "Array of Seat.id requested at order creation; each must be FREE on the showtime" }
      - { name: combo_ids, type: array, source: input, description: "Array of ConcessionCombo.id added to the order", default: [] }
      - { name: apply_wallet_credit, type: boolean, source: input, description: "When true, member's wallet_credit_cents is applied (capped at order total) at sale", default: false }
      - { name: status, type: enum, source: system, description: "HELD | PAID | EXCHANGED | REFUNDED | EXPIRED | CANCELLED", default: HELD, constraints: "HELD | PAID | EXCHANGED | REFUNDED | EXPIRED | CANCELLED" }
      - { name: tickets_subtotal_cents, type: integer, source: computed, description: "Sum of bound Tickets' final_price_cents" }
      - { name: combos_subtotal_cents, type: integer, source: computed, description: "Sum of combo prices after member discount" }
      - { name: wallet_applied_cents, type: integer, source: computed, description: "Wallet credit actually applied at sale", default: 0 }
      - { name: total_charged_cents, type: integer, source: computed, description: "tickets_subtotal + combos_subtotal - wallet_applied; the amount captured by Payment" }
      - { name: hold_expires_at, type: datetime, source: computed, description: "starts_at-of-creation + HOLD_TTL_MINUTES; HELD order auto-EXPIRES at/after this instant" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: Ticket
    parent: Order
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; the order this ticket belongs to" }
      - { name: showtime_id, type: string, source: system, description: "FK -> Showtime.id; denormalized from the order for split math" }
      - { name: seat_id, type: string, source: system, description: "FK -> Seat.id; the seat this ticket occupies" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; the holder, denormalized for loyalty accrual" }
      - { name: provisional_price_cents, type: integer, source: computed, description: "Price quoted at HOLD time using the showtime's pricing profile and seat-class surcharge at that instant" }
      - { name: final_price_cents, type: integer, source: computed, description: "Price locked at SALE time; may differ from provisional if profile/base changed between hold and sale" }
      - { name: state, type: enum, source: system, description: "HELD | SOLD | VOIDED — VOIDED on refund/exchange/showtime-cancel", default: HELD, constraints: "HELD | SOLD | VOIDED" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: Payment
    parent: Order
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; the order this payment captures" }
      - { name: amount_cents, type: integer, source: system, description: "Amount captured (== Order.total_charged_cents at sale)" }
      - { name: refunded_cents, type: integer, source: computed, description: "Amount refunded on this payment (0 while CAPTURED, == amount_cents once fully REFUNDED)", default: 0 }
      - { name: status, type: enum, source: system, description: "CAPTURED | REFUNDED — set REFUNDED in full on order refund/exchange", default: CAPTURED, constraints: "CAPTURED | REFUNDED" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: showtime_id, type: string, source: input, description: "FK -> Showtime.id; the closed showtime being settled" }
      - { name: film_id, type: string, source: system, description: "FK -> Film.id; denormalized at settlement time" }
      - { name: distributor_id, type: string, source: system, description: "FK -> Distributor.id; denormalized at settlement time" }
      - { name: gross_receipts_cents, type: integer, source: computed, description: "Snapshot of Showtime.gross_receipts_cents at close (BOX_OFFICE) or private_rental_fee_cents (RENTAL)" }
      - { name: applied_distributor_pct, type: number, source: computed, description: "The sliding-scale pct selected for the showtime's week index" }
      - { name: distributor_share_cents, type: integer, source: computed, description: "max(round(gross * applied_distributor_pct), Distributor.minimum_guarantee_cents) for BOX_OFFICE; fixed RENTAL_HOUSE_PCT of fee for RENTAL" }
      - { name: house_share_cents, type: integer, source: computed, description: "gross_receipts_cents - distributor_share_cents" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Showtime
    field: status
    initial_state: SCHEDULED
    terminal_states: [CANCELLED, CLOSED]
    transitions:
      - from: SCHEDULED
        to: ON_SALE
        trigger: "POST /showtimes/{id}/open"
        actor: CinemaManager
        preconditions:
          - "showtime.status == SCHEDULED"
          - "Film.status IN {BOOKING, RUNNING}"
          - "for RENTAL showtimes, private_rental_fee_cents > 0"
        side_effects:
          - "showtime.status = ON_SALE"
          - "if Film.status == BOOKING, set Film.status = RUNNING (bubble-up)"
          - "increments Showtime.version by 1"
      - from: ON_SALE
        to: CANCELLED
        trigger: "POST /showtimes/{id}/cancel"
        actor: CinemaManager
        preconditions:
          - "showtime.status == ON_SALE"
          - "expected_showtime_version matches showtime.version (OCC)"
        side_effects:
          - "showtime.status = CANCELLED"
          - "CASCADE depth-1: every PAID Order on this showtime -> REFUNDED (full); see Order REFUNDED transition for its own cascade"
          - "CASCADE: every HELD Order on this showtime -> CANCELLED, releasing its held seats"
          - "every Ticket on this showtime (HELD or SOLD) -> VOIDED"
          - "every Seat on this showtime -> FREE"
          - "increments Showtime.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /showtimes/{id}/cancel"
        actor: CinemaManager
        preconditions:
          - "showtime.status == SCHEDULED"
          - "expected_showtime_version matches showtime.version (OCC)"
        side_effects:
          - "showtime.status = CANCELLED"
          - "no orders exist yet; releases any pre-created seat map to FREE"
          - "increments Showtime.version by 1"
      - from: ON_SALE
        to: CLOSED
        trigger: "POST /showtimes/{id}/close"
        actor: CinemaManager
        preconditions:
          - "showtime.status == ON_SALE"
          - "current_utc >= showtime.ends_at"
          - "no Order on this showtime is still in HELD state"
        side_effects:
          - "showtime.status = CLOSED"
          - "creates exactly one Settlement for this showtime (computes distributor_share_cents, house_share_cents)"
          - "increments Showtime.version by 1"

  - entity: Order
    field: status
    initial_state: HELD
    terminal_states: [REFUNDED, EXPIRED, CANCELLED]
    transitions:
      - from: HELD
        to: PAID
        trigger: "POST /orders/{id}/pay"
        actor: BoxOfficeAgent
        preconditions:
          - "order.status == HELD"
          - "current_utc < order.hold_expires_at"
          - "showtime.status == ON_SALE"
          - "every Seat in order.seat_ids still HELD by THIS order"
        side_effects:
          - "locks each Ticket.final_price_cents (final-variant calc); sets each Ticket.state = SOLD"
          - "each Seat.occupancy = SOLD"
          - "computes Order.total_charged_cents; creates one Payment (status CAPTURED)"
          - "if apply_wallet_credit, debits Member.wallet_credit_cents by wallet_applied_cents"
          - "CASCADE depth-1: accrues Member.loyalty_points (+1 per 100 cents of tickets_subtotal); that points change re-derives Member.tier (depth-2)"
          - "increments Showtime.version by 1 (seats_sold/gross_receipts changed)"
      - from: HELD
        to: EXPIRED
        trigger: "system (current_utc >= order.hold_expires_at) evaluated on read/sweep, or POST /_clock/advance"
        actor: system
        preconditions:
          - "order.status == HELD"
          - "current_utc >= order.hold_expires_at"
        side_effects:
          - "order.status = EXPIRED"
          - "each Ticket.state = VOIDED"
          - "each Seat.occupancy = FREE (seats released back to pool)"
          - "increments Showtime.version by 1"
      - from: HELD
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: BoxOfficeAgent
        preconditions:
          - "order.status == HELD"
        side_effects:
          - "order.status = CANCELLED"
          - "each Ticket.state = VOIDED; each Seat.occupancy = FREE"
          - "increments Showtime.version by 1"
      - from: PAID
        to: REFUNDED
        trigger: "POST /orders/{id}/refund"
        actor: BoxOfficeAgent
        preconditions:
          - "order.status == PAID"
          - "showtime.status IN {ON_SALE, CANCELLED} and current_utc < showtime.starts_at (unless cascade from showtime cancel)"
        side_effects:
          - "order.status = REFUNDED"
          - "CASCADE depth-1: Payment.refunded_cents += refund_amount; Payment.status -> REFUNDED"
          - "CASCADE depth-2: refund_destination ORIGINAL returns to payer; WALLET credits Member.wallet_credit_cents by refund_amount (that credit is itself a Member mutation, depth-3)"
          - "each Ticket.state = VOIDED; each Seat.occupancy = FREE"
          - "reverses loyalty: Member.loyalty_points -= points originally accrued for this order; re-derive Member.tier"
          - "increments Showtime.version by 1"
      - from: PAID
        to: EXCHANGED
        trigger: "POST /orders/{id}/exchange"
        actor: BoxOfficeAgent
        preconditions:
          - "order.status == PAID"
          - "target showtime (new_showtime_id) is ON_SALE and current_utc < its starts_at"
          - "every new_seat_id is FREE on the target showtime"
        side_effects:
          - "order.status = EXCHANGED (terminal for this order)"
          - "old Tickets -> VOIDED; old Seats -> FREE"
          - "creates a NEW HELD Order on the target showtime with the new seats (a successor order)"
          - "price-difference settled: if new tickets_subtotal > old, the new order carries the delta due; if <, the difference is credited to Member.wallet_credit_cents"
          - "loyalty for the OLD order is reversed; the successor order accrues fresh loyalty only when it is paid"
          - "increments both showtimes' version by 1"

  - entity: Ticket
    field: state
    initial_state: HELD
    terminal_states: [VOIDED]
    transitions:
      - from: HELD
        to: SOLD
        trigger: "system side-effect of Order HELD->PAID"
        actor: system
        preconditions: ["parent Order transitioning HELD->PAID"]
        side_effects:
          - "ticket.final_price_cents locked"
          - "bound Seat.occupancy = SOLD"
      - from: HELD
        to: VOIDED
        trigger: "system side-effect of Order HELD->EXPIRED/CANCELLED or Showtime cancel"
        actor: system
        preconditions: ["parent Order leaving HELD without payment, or showtime cancelled"]
        side_effects: ["bound Seat.occupancy = FREE"]
      - from: SOLD
        to: VOIDED
        trigger: "system side-effect of Order PAID->REFUNDED/EXCHANGED or Showtime cancel"
        actor: system
        preconditions: ["parent Order leaving PAID, or showtime cancelled"]
        side_effects: ["bound Seat.occupancy = FREE"]

  - entity: Film
    field: status
    initial_state: BOOKING
    terminal_states: [ENDED]
    transitions:
      - from: BOOKING
        to: RUNNING
        trigger: "system side-effect of first Showtime HELD->ON_SALE for this film"
        actor: system
        preconditions: ["film.status == BOOKING"]
        side_effects: ["film.status = RUNNING"]
      - from: RUNNING
        to: ENDED
        trigger: "POST /films/{id}/end-run"
        actor: CinemaManager
        preconditions:
          - "film.status == RUNNING"
          - "no Showtime for this film is in SCHEDULED or ON_SALE state"
        side_effects: ["film.status = ENDED"]

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules — true CREATE-with-supersede races only (OCC)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: order-create-stale-showtime
    parent_entity: Showtime
    write_endpoint: "POST /showtimes/{id}/orders"
    occ_field: "expected_showtime_version"
    description: |
      Creating an Order (which places HELD tickets and reserves seats) against a
      Showtime whose version has advanced since the client last read it is
      rejected. This captures the case where another writer has just sold or held
      seats on the same showtime — legitimately advancing the showtime's seat
      counts and version — so the current writer's view of seat availability is
      stale. The reservation is refused before any seat is held.
    error_id: ERR_STALE_SHOWTIME_VERSION
    http_status: 412

  - rule_id: cancel-stale-showtime
    parent_entity: Showtime
    write_endpoint: "POST /showtimes/{id}/cancel"
    occ_field: "expected_showtime_version"
    description: |
      Cancelling a Showtime whose version has advanced since the client last
      observed it is rejected. A manager who decides to cancel based on a stale
      view (e.g., before a batch of sales landed) is forced to re-read and
      re-confirm, so the cancel's downstream refund cascade always acts on the
      current sales set.
    error_id: ERR_STALE_SHOWTIME_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: ticket_price_provisional
    trigger: "Order creation (HELD): each requested seat gets a provisional quote"
    algorithm: threshold
    formula: |
      profile_mult = PROFILE_MULT[showtime.pricing_profile]   # STANDARD 1.00, MATINEE 0.70, PEAK 1.30
      class_surcharge = CLASS_SURCHARGE[seat.seat_class]       # STANDARD 0, PREMIUM 400, ACCESSIBLE 0 (cents)
      base = showtime.base_price_cents
      provisional_price_cents = round_half_up(base * profile_mult) + class_surcharge
    input_set: "Per-seat at HELD time; uses the showtime profile/base AS OF order creation"
    constants:
      PROFILE_MULT: { STANDARD: 1.00, MATINEE: 0.70, PEAK: 1.30 }
      CLASS_SURCHARGE: { STANDARD: 0, PREMIUM: 400, ACCESSIBLE: 0 }
      MATINEE_CUTOFF_HOUR: 17          # MATINEE profile only valid when local start hour < 17 (treat starts_at as UTC local for tests)
      HOLD_TTL_MINUTES: 15             # a HELD order/ticket auto-expires HOLD_TTL_MINUTES after creation
      TRAILER_PAD_MINUTES: 15          # showtime ends_at = starts_at + Film.runtime_minutes + TRAILER_PAD_MINUTES
    precision: "2 decimal places at cents granularity, round_half_up; multiply then round, THEN add the integer surcharge"
    variants:
      - name: provisional
        when: "at HOLD time"
        difference: "Reads the showtime profile/base at the moment of order creation; stored on Ticket.provisional_price_cents"

  - name: ticket_price_final
    trigger: "Order HELD->PAID (pay): each ticket's final price locked"
    algorithm: threshold
    formula: |
      # Identical formula shape to provisional, but re-read from the showtime's
      # CURRENT profile/base at pay time, which may have been re-priced by the
      # manager between hold and pay.
      profile_mult = PROFILE_MULT[showtime.pricing_profile]
      class_surcharge = CLASS_SURCHARGE[seat.seat_class]
      final_price_cents = round_half_up(showtime.base_price_cents * profile_mult) + class_surcharge
    input_set: "Per-seat at PAY time; uses the showtime profile/base AS OF payment"
    constants:
      PROFILE_MULT: { STANDARD: 1.00, MATINEE: 0.70, PEAK: 1.30 }
      CLASS_SURCHARGE: { STANDARD: 0, PREMIUM: 400, ACCESSIBLE: 0 }
    precision: "2 decimal places at cents granularity, round_half_up"
    variants:
      - name: final
        when: "at PAY time"
        difference: "Re-reads the showtime's current profile/base, so final may differ from provisional if the manager re-priced between hold and pay; stored on Ticket.final_price_cents"

  - name: order_total
    trigger: "Order HELD->PAID (pay)"
    algorithm: aggregation
    formula: |
      # Evaluation order is PINNED:
      #   1. tickets_subtotal = sum over tickets of final_price_cents          (round per-ticket already done in ticket_price_final)
      #   2. for each combo: discounted = combo.price_cents - round_half_up(combo.price_cents * combo.member_discount_pct)
      #        member_discount applies ONLY when Member.tier IN {SILVER, GOLD}; BRONZE pays list price (discount = 0)
      #      combos_subtotal = sum of discounted combo prices
      #   3. gross_due = tickets_subtotal + combos_subtotal
      #   4. wallet_applied = min(Member.wallet_credit_cents, gross_due) if order.apply_wallet_credit else 0
      #   5. total_charged_cents = gross_due - wallet_applied
      input_set: "All SOLD tickets bound to the order plus all combo_ids on the order"
    constants: {}
    precision: "round_half_up per combo discount BEFORE summing (round-then-sum); never sum-then-round"
    variants:
      - name: bronze_no_discount
        when: "Member.tier == BRONZE"
        difference: "combo member_discount_pct ignored; combos charged at list price"
      - name: silver_gold_discount
        when: "Member.tier IN {SILVER, GOLD}"
        difference: "combo member_discount_pct applied per combo, rounded per combo before summing"

  - name: loyalty_accrual_and_tier
    trigger: "Order HELD->PAID accrues; PAID->REFUNDED/EXCHANGED reverses; tier re-derived after each change"
    algorithm: threshold
    formula: |
      # Accrual on pay: points_delta = floor(order.tickets_subtotal_cents / POINTS_PER_CENT_DIVISOR)
      #   (combos do NOT earn points; only ticket spend does)
      # Reversal on refund/exchange of that order: subtract the SAME points_delta that was accrued.
      # Tier derivation from the resulting lifetime balance (breakpoints, >= semantics):
      #   GOLD   if loyalty_points >= TIER_THRESHOLDS.GOLD
      #   SILVER if loyalty_points >= TIER_THRESHOLDS.SILVER
      #   else BRONZE
    input_set: "Per Member; points reflect net of accrued (SOLD) minus reversed (refunded/exchanged) orders"
    constants:
      POINTS_PER_CENT_DIVISOR: 100        # 1 point per 100 cents of ticket spend
      TIER_THRESHOLDS: { SILVER: 50, GOLD: 200 }
    precision: "floor on accrual; integer points; tier compare uses >= (boundary precision)"
    variants:
      - name: accrual
        when: "on pay"
        difference: "adds floor(tickets_subtotal/100) points"
      - name: reversal
        when: "on refund/exchange"
        difference: "subtracts the exact points accrued for that order; tier may demote"

  - name: distributor_sliding_split
    trigger: "Showtime ON_SALE->CLOSED (close): Settlement creation"
    algorithm: tiered_pricing
    formula: |
      # week_index = floor( (showtime.starts_at - Film.release_date) / 7 days ), min 0
      # Select applied_distributor_pct from Film.split_schedule: the entry with the
      # GREATEST week_index that is <= the showtime's week_index (sliding down over time).
      # Sliding share decreases as the film ages.
      if showtime.rental_basis == BOX_OFFICE:
        gross = showtime.gross_receipts_cents
        applied_distributor_pct = select_term(Film.split_schedule, week_index)
        sliding_share = round_half_up(gross * applied_distributor_pct)
        distributor_share_cents = max(sliding_share, Distributor.minimum_guarantee_cents)
        house_share_cents = gross - distributor_share_cents       # may be negative if MG exceeds gross
      else:  # RENTAL
        gross = showtime.private_rental_fee_cents
        applied_distributor_pct = RENTAL_HOUSE_DISTRIBUTOR_PCT     # fixed flat distributor cut on a rental
        distributor_share_cents = round_half_up(gross * RENTAL_HOUSE_DISTRIBUTOR_PCT)
        house_share_cents = gross - distributor_share_cents
    input_set: "Single closed showtime; gross = its receipts (box office) or flat fee (rental)"
    constants:
      RENTAL_HOUSE_DISTRIBUTOR_PCT: 0.10
    precision: "round_half_up on the share computation; MG comparison is on integer cents"
    variants:
      - name: first_window_sliding
        when: "BOX_OFFICE showtime, week_index resolves to an early high-pct term"
        difference: "High distributor pct (e.g. 0.70 in week 0); house keeps the remainder"
      - name: aged_sliding
        when: "BOX_OFFICE showtime, week_index resolves to a later low-pct term"
        difference: "Lower distributor pct (e.g. 0.35 in week 3+); distributor share may instead floor to minimum_guarantee_cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1,  category: auth,                check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role; POST /members is the only endpoint reachable by Anonymous", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all except POST /members" }
  - { priority: 2,  category: auth,                check: "Acting role permitted for this operation per §1.7", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3,  category: auth,                check: "entity_backed role acting on own resource (Member X-User-ID == resource.member_id; Distributor X-User-ID == settlement.distributor_id)", error_id: ERR_NOT_RESOURCE_OWNER, http_status: 403, applies_to: "member/distributor self-serve reads and member-initiated orders" }
  - { priority: 4,  category: existence,           check: "All path/body referenced resources exist (left-to-right)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all with path ids or FK body fields" }
  - { priority: 5,  category: state,               check: "Target resource in a valid state for this transition (state-machine from-state)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all transition endpoints" }
  - { priority: 6,  category: state,               check: "OCC: expected_showtime_version matches current Showtime.version", error_id: ERR_STALE_SHOWTIME_VERSION, http_status: 412, applies_to: "POST /showtimes/{id}/orders, POST /showtimes/{id}/cancel" }
  - { priority: 7,  category: business_temporal,   check: "MATINEE profile requires showtime local start hour < MATINEE_CUTOFF_HOUR", error_id: ERR_MATINEE_WINDOW_VIOLATION, http_status: 422, applies_to: "POST /auditoriums/{id}/showtimes" }
  - { priority: 8,  category: business_temporal,   check: "New showtime interval [starts_at, ends_at) plus turnaround_minutes must not overlap any non-CANCELLED showtime in the same auditorium", error_id: ERR_AUDITORIUM_DOUBLE_BOOKED, http_status: 409, applies_to: "POST /auditoriums/{id}/showtimes" }
  - { priority: 9,  category: business_constraint, check: "RENTAL showtime must have private_rental_fee_cents > 0; BOX_OFFICE must have it == 0", error_id: ERR_RENTAL_FEE_INVALID, http_status: 422, applies_to: "POST /auditoriums/{id}/showtimes" }
  - { priority: 10, category: business_referential,check: "Every requested seat_id belongs to the order's showtime", error_id: ERR_SEAT_NOT_ON_SHOWTIME, http_status: 422, applies_to: "POST /showtimes/{id}/orders, POST /orders/{id}/exchange" }
  - { priority: 11, category: business_constraint, check: "Each requested seat is FREE (not HELD/SOLD by another live order)", error_id: ERR_SEAT_UNAVAILABLE, http_status: 409, applies_to: "POST /showtimes/{id}/orders, POST /orders/{id}/exchange" }
  - { priority: 12, category: business_constraint, check: "At least one seat requested (seat_ids non-empty)", error_id: ERR_NO_SEATS_SELECTED, http_status: 422, applies_to: "POST /showtimes/{id}/orders, POST /orders/{id}/exchange" }
  - { priority: 13, category: business_temporal,   check: "The order's member must not already hold a live (HELD or PAID) order on a DIFFERENT showtime whose half-open interval [starts_at, ends_at) overlaps this showtime's interval — a member cannot be seated at two films at once. Pure half-open overlap, ZERO buffer (distinct from the auditorium check's turnaround buffer).", error_id: ERR_MEMBER_DOUBLE_BOOKED, http_status: 409, applies_to: "POST /showtimes/{id}/orders" }
  - { priority: 14, category: business_constraint, check: "RENTAL showtime cannot be sold per-seat; the whole house is bought via the rental flow only", error_id: ERR_RENTAL_NO_SEAT_SALES, http_status: 409, applies_to: "POST /showtimes/{id}/orders" }
  - { priority: 15, category: business_fiscal,     check: "Wallet credit applied cannot exceed member's wallet_credit_cents balance", error_id: ERR_INSUFFICIENT_WALLET_CREDIT, http_status: 422, applies_to: "POST /orders/{id}/pay" }
  - { priority: 16, category: business_temporal,   check: "Refund/exchange only allowed before showtime.starts_at (unless via showtime-cancel cascade)", error_id: ERR_PAST_SHOWTIME, http_status: 409, applies_to: "POST /orders/{id}/refund, POST /orders/{id}/exchange" }
  - { priority: 17, category: business_constraint, check: "split_schedule must contain a week_index 0 entry and all distributor_pct in [0,1]", error_id: ERR_INVALID_SPLIT_SCHEDULE, http_status: 422, applies_to: "POST /films" }
  - { priority: 18, category: business_constraint, check: "Close requires current_utc >= ends_at and no HELD order remaining", error_id: ERR_SHOWTIME_NOT_OVER, http_status: 409, applies_to: "POST /showtimes/{id}/close" }
  - { priority: 19, category: business_constraint, check: "Required body fields present and well-typed; enums in declared set", error_id: ERR_INVALID_REQUEST, http_status: 422, applies_to: "all writes" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Auditoriums ----
  - { method: POST, path: "/auditoriums", description: "Create an auditorium", roles: [CinemaManager], code: 201, input: [name, seat_count, "turnaround_minutes?"], output: Auditorium, side_effects: [] }
  - { method: GET,  path: "/auditoriums/{id}", description: "Get an auditorium", roles: [CinemaManager, BoxOfficeAgent], code: 200, input: [], output: Auditorium, side_effects: [] }
  - { method: GET,  path: "/auditoriums", description: "List auditoriums", roles: [CinemaManager, BoxOfficeAgent], code: 200, input: ["limit?", "offset?", "status?"], output: "Auditorium[]", side_effects: [] }

  # ---- Films & Distributors ----
  - { method: POST, path: "/distributors", description: "Create a distributor", roles: [CinemaManager], code: 201, input: [name, "minimum_guarantee_cents?"], output: Distributor, side_effects: [] }
  - { method: GET,  path: "/distributors/{id}", description: "Get a distributor", roles: [CinemaManager, Distributor], code: 200, input: [], output: Distributor, side_effects: [] }
  - { method: POST, path: "/films", description: "Create a film with its sliding split schedule", roles: [CinemaManager], code: 201, input: [title, runtime_minutes, distributor_id, release_date, split_schedule], output: Film, side_effects: ["validate split_schedule"] }
  - { method: GET,  path: "/films/{id}", description: "Get a film", roles: [CinemaManager, BoxOfficeAgent, Distributor], code: 200, input: [], output: Film, side_effects: [] }
  - { method: GET,  path: "/films", description: "List films, filterable by distributor", roles: [CinemaManager, Distributor], code: 200, input: ["limit?", "offset?", "distributor_id?", "status?"], output: "Film[]", side_effects: [] }
  - { method: POST, path: "/films/{id}/end-run", description: "End a film's run", roles: [CinemaManager], code: 200, input: [], output: Film, side_effects: ["Film.status RUNNING->ENDED"] }

  # ---- Showtimes (nested under auditorium) ----
  - { method: POST, path: "/auditoriums/{id}/showtimes", description: "Schedule a showtime in an auditorium; materializes the seat map", roles: [CinemaManager], code: 201, input: [film_id, starts_at, pricing_profile, base_price_cents, "rental_basis?", "private_rental_fee_cents?"], output: Showtime, side_effects: ["compute ends_at", "create Seat rows == auditorium.seat_count", "overlap+turnaround check"] }
  - { method: GET,  path: "/auditoriums/{id}/showtimes", description: "List showtimes in an auditorium (reverse-reachability for Showtime.auditorium_id)", roles: [CinemaManager, BoxOfficeAgent], code: 200, input: ["limit?", "offset?", "status?"], output: "Showtime[]", side_effects: [] }
  - { method: GET,  path: "/showtimes/{id}", description: "Get a showtime (computed counts reflect current seat state)", roles: [CinemaManager, BoxOfficeAgent, Member], code: 200, input: [], output: Showtime, side_effects: ["lazily EXPIRE any past-TTL HELD orders before computing counts"] }
  - { method: GET,  path: "/showtimes", description: "List showtimes filterable by film (reverse-reachability for Showtime.film_id)", roles: [CinemaManager, BoxOfficeAgent, Distributor], code: 200, input: ["limit?", "offset?", "film_id?", "status?"], output: "Showtime[]", side_effects: [] }
  - { method: POST, path: "/showtimes/{id}/open", description: "Put a scheduled showtime on sale", roles: [CinemaManager], code: 200, input: [], output: Showtime, side_effects: ["SCHEDULED->ON_SALE", "Film BOOKING->RUNNING bubble-up"] }
  - { method: PATCH, path: "/showtimes/{id}/pricing", description: "Re-price an ON_SALE/SCHEDULED showtime (profile and/or base); affects final price at pay time", roles: [CinemaManager], code: 200, input: ["pricing_profile?", "base_price_cents?"], output: Showtime, side_effects: ["update pricing_profile/base_price_cents", "increment version"] }
  - { method: POST, path: "/showtimes/{id}/cancel", description: "Cancel a showtime; cascades refunds and seat release", roles: [CinemaManager], code: 200, input: [expected_showtime_version], output: Showtime, side_effects: ["status->CANCELLED", "cascade refund PAID orders", "cancel HELD orders", "void tickets", "free seats", "increments Showtime.version by 1"] }
  - { method: POST, path: "/showtimes/{id}/close", description: "Close a finished showtime and settle the distributor split", roles: [CinemaManager], code: 200, input: [], output: Showtime, side_effects: ["status->CLOSED", "create Settlement"] }
  - { method: GET,  path: "/showtimes/{id}/seats", description: "Get the seat map for a showtime (reverse-reachability for Seat.showtime_id)", roles: [CinemaManager, BoxOfficeAgent, Member], code: 200, input: ["limit?", "offset?", "occupancy?"], output: "Seat[]", side_effects: [] }
  - { method: GET,  path: "/showtimes/{id}/orders", description: "List orders on a showtime (reverse-reachability for Order.showtime_id)", roles: [CinemaManager, BoxOfficeAgent], code: 200, input: ["limit?", "offset?", "status?"], output: "Order[]", side_effects: [] }
  - { method: GET,  path: "/showtimes/{id}/settlement", description: "Get the settlement created at close (reverse-reachability for Settlement.showtime_id)", roles: [CinemaManager, Distributor], code: 200, input: [], output: "Settlement[]", side_effects: [] }

  # ---- Members ----
  - { method: POST, path: "/members", description: "Register a member (no auth required)", roles: [Anonymous, CinemaManager, BoxOfficeAgent], code: 201, input: [email, full_name], output: Member, side_effects: [] }
  - { method: GET,  path: "/members/{id}", description: "Get a member (self or staff)", roles: [Member, CinemaManager, BoxOfficeAgent], code: 200, input: [], output: Member, side_effects: [] }

  # ---- Concession combos ----
  - { method: POST, path: "/combos", description: "Create a concession combo", roles: [CinemaManager], code: 201, input: [name, price_cents, "member_discount_pct?"], output: ConcessionCombo, side_effects: [] }
  - { method: GET,  path: "/combos/{id}", description: "Get a combo", roles: [CinemaManager, BoxOfficeAgent, Member], code: 200, input: [], output: ConcessionCombo, side_effects: [] }
  - { method: GET,  path: "/combos", description: "List combos", roles: [CinemaManager, BoxOfficeAgent, Member], code: 200, input: ["limit?", "offset?", "status?"], output: "ConcessionCombo[]", side_effects: [] }

  # ---- Orders / tickets / payments ----
  - { method: POST, path: "/showtimes/{id}/orders", description: "Create a HELD order on a showtime: reserve seats, place HELD tickets at provisional price", roles: [BoxOfficeAgent, Member], code: 201, input: [member_id, seat_ids, "combo_ids?", "apply_wallet_credit?", expected_showtime_version], output: Order, side_effects: ["create HELD Tickets at provisional price", "seats FREE->HELD", "set hold_expires_at", "increments Showtime.version by 1"] }
  - { method: GET,  path: "/orders/{id}", description: "Get an order (lazily expires if past TTL)", roles: [BoxOfficeAgent, Member, CinemaManager], code: 200, input: [], output: Order, side_effects: ["lazily EXPIRE if HELD and past hold_expires_at"] }
  - { method: GET,  path: "/orders", description: "List orders filterable by member (reverse-reachability for Order.member_id)", roles: [BoxOfficeAgent, Member, CinemaManager], code: 200, input: ["limit?", "offset?", "member_id?", "status?"], output: "Order[]", side_effects: [] }
  - { method: POST, path: "/orders/{id}/pay", description: "Pay a HELD order: lock final prices, capture payment, accrue loyalty", roles: [BoxOfficeAgent, Member], code: 200, input: [], output: Order, side_effects: ["lock final prices", "create Payment", "seats HELD->SOLD", "accrue loyalty + re-derive tier", "debit wallet if requested", "increments Showtime.version by 1"] }
  - { method: POST, path: "/orders/{id}/cancel", description: "Cancel a HELD order, releasing seats", roles: [BoxOfficeAgent, Member], code: 200, input: [], output: Order, side_effects: ["status->CANCELLED", "void tickets", "free seats", "increments Showtime.version by 1"] }
  - { method: POST, path: "/orders/{id}/refund", description: "Refund a PAID order", roles: [BoxOfficeAgent], code: 200, input: [refund_destination], output: Order, side_effects: ["status->REFUNDED", "Payment refunded", "wallet credit if WALLET", "reverse loyalty", "void tickets", "free seats", "increments Showtime.version by 1"] }
  - { method: POST, path: "/orders/{id}/exchange", description: "Exchange a PAID order's tickets to a new showtime/seats", roles: [BoxOfficeAgent], code: 200, input: [new_showtime_id, new_seat_ids], output: Order, side_effects: ["old order EXCHANGED", "old tickets VOIDED + seats FREE", "create successor HELD order on target", "price delta to wallet or due", "reverse old loyalty", "increment both showtimes' version"] }
  - { method: GET,  path: "/orders/{id}/tickets", description: "List tickets on an order (reverse-reachability for Ticket.order_id)", roles: [BoxOfficeAgent, Member, CinemaManager], code: 200, input: ["limit?", "offset?", "state?"], output: "Ticket[]", side_effects: [] }
  - { method: GET,  path: "/orders/{id}/payments", description: "List payments on an order (reverse-reachability for Payment.order_id)", roles: [BoxOfficeAgent, CinemaManager], code: 200, input: ["limit?", "offset?"], output: "Payment[]", side_effects: [] }

  # ---- reverse-reachability for cross-aggregate FKs ----
  - { method: GET,  path: "/tickets/{id}", description: "Get a single ticket", roles: [BoxOfficeAgent, Member, CinemaManager], code: 200, input: [], output: Ticket, side_effects: [] }
  - { method: GET,  path: "/tickets", description: "List tickets filterable by member, showtime, or seat (reverse-reachability for Ticket.member_id, Ticket.showtime_id, Ticket.seat_id)", roles: [BoxOfficeAgent, Member, CinemaManager], code: 200, input: ["limit?", "offset?", "member_id?", "showtime_id?", "seat_id?", "state?"], output: "Ticket[]", side_effects: [] }
  - { method: GET,  path: "/settlements/{id}", description: "Get a single settlement", roles: [CinemaManager, Distributor], code: 200, input: [], output: Settlement, side_effects: [] }
  - { method: GET,  path: "/settlements", description: "List settlements filterable by distributor, film, or showtime (reverse-reachability for Settlement.distributor_id, Settlement.film_id, Settlement.showtime_id)", roles: [CinemaManager, Distributor], code: 200, input: ["limit?", "offset?", "distributor_id?", "film_id?", "showtime_id?"], output: "Settlement[]", side_effects: [] }

  # ---- test-driving clock ----
  - { method: POST, path: "/_clock/advance", description: "Set the server's current UTC instant (test-driving); triggers lazy expiry sweep of past-TTL HELD orders", roles: [CinemaManager], code: 200, input: [to_iso8601], output: null, side_effects: ["set current_utc", "EXPIRE all HELD orders past their hold_expires_at"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED,           http: 401, condition: "Missing/unknown X-User-Role or missing X-User-ID on an authenticated endpoint" }
  - { id: ERR_FORBIDDEN_ROLE,            http: 403, condition: "Acting role not permitted for the operation per §1.7" }
  - { id: ERR_NOT_RESOURCE_OWNER,        http: 403, condition: "entity_backed role (Member/Distributor) acting on a resource it does not own" }
  - { id: ERR_NOT_FOUND,                 http: 404, condition: "Referenced auditorium/film/showtime/seat/order/member/combo/distributor/settlement does not exist" }
  - { id: ERR_INVALID_STATE,             http: 409, condition: "Target resource not in a valid state for the requested transition" }
  - { id: ERR_STALE_SHOWTIME_VERSION,    http: 412, condition: "expected_showtime_version does not match current Showtime.version (OCC)" }
  - { id: ERR_MATINEE_WINDOW_VIOLATION,  http: 422, condition: "MATINEE pricing_profile selected but showtime local start hour >= MATINEE_CUTOFF_HOUR" }
  - { id: ERR_AUDITORIUM_DOUBLE_BOOKED,  http: 409, condition: "New showtime interval (incl. turnaround buffer) overlaps an existing non-CANCELLED showtime in the same auditorium" }
  - { id: ERR_RENTAL_FEE_INVALID,        http: 422, condition: "RENTAL showtime without a positive fee, or BOX_OFFICE showtime with a non-zero fee" }
  - { id: ERR_SEAT_NOT_ON_SHOWTIME,      http: 422, condition: "A requested seat_id does not belong to the order's showtime" }
  - { id: ERR_SEAT_UNAVAILABLE,          http: 409, condition: "A requested seat is HELD or SOLD by another live order" }
  - { id: ERR_NO_SEATS_SELECTED,         http: 422, condition: "Order created/exchanged with an empty seat_ids array" }
  - { id: ERR_MEMBER_DOUBLE_BOOKED,      http: 409, condition: "Member already holds a live order on another showtime whose interval overlaps this one" }
  - { id: ERR_RENTAL_NO_SEAT_SALES,      http: 409, condition: "Per-seat order attempted on a RENTAL showtime" }
  - { id: ERR_INSUFFICIENT_WALLET_CREDIT,http: 422, condition: "apply_wallet_credit requested but wallet balance is zero/less than declared (defensive; server caps, this guards explicit over-claim)" }
  - { id: ERR_PAST_SHOWTIME,             http: 409, condition: "Refund/exchange attempted at/after the showtime's starts_at outside a cancel cascade" }
  - { id: ERR_INVALID_SPLIT_SCHEDULE,    http: 422, condition: "Film split_schedule missing a week_index 0 entry or a distributor_pct outside [0,1]" }
  - { id: ERR_SHOWTIME_NOT_OVER,         http: 409, condition: "Close attempted before ends_at or while a HELD order remains" }
  - { id: ERR_INVALID_REQUEST,           http: 422, condition: "Missing/malformed required field or out-of-set enum value" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CinemaManager
    description: "Operator who schedules showtimes, configures films/pricing/combos, cancels and closes/settles."
    identity: opaque
    exclusive_operations:
      - "POST /auditoriums"
      - "POST /distributors"
      - "POST /films"
      - "POST /films/{id}/end-run"
      - "POST /auditoriums/{id}/showtimes"
      - "POST /showtimes/{id}/open"
      - "PATCH /showtimes/{id}/pricing"
      - "POST /showtimes/{id}/cancel"
      - "POST /showtimes/{id}/close"
      - "POST /combos"
      - "POST /_clock/advance"
    shared_operations:
      - "GET reads across auditoriums, films, showtimes, seats, orders, tickets, payments, settlements, members, combos"

  - name: BoxOfficeAgent
    description: "Front-desk staff who create/pay/cancel orders, refund and exchange on behalf of members."
    identity: opaque
    exclusive_operations:
      - "POST /orders/{id}/refund"
      - "POST /orders/{id}/exchange"
    shared_operations:
      - "POST /showtimes/{id}/orders"
      - "POST /orders/{id}/pay"
      - "POST /orders/{id}/cancel"
      - "GET reads on showtimes, seats, orders, tickets, payments, members, combos"

  - name: Member
    description: "A registered customer who can self-serve: create/pay/cancel their own orders and read their own data."
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "POST /showtimes/{id}/orders (own member_id only)"
      - "POST /orders/{id}/pay (own order only)"
      - "POST /orders/{id}/cancel (own order only)"
      - "GET reads on own member, own orders, own tickets, showtimes, seats, combos"

  - name: Distributor
    description: "Film-rights holder who reads its own films, showtimes, and settlements (split visibility)."
    identity: "entity_backed:Distributor"
    exclusive_operations: []
    shared_operations:
      - "GET /distributors/{id} (self)"
      - "GET /films, GET /films/{id} (own films)"
      - "GET /showtimes (own films)"
      - "GET /settlements, GET /showtimes/{id}/settlement (own films)"

  - name: Anonymous
    description: "Unauthenticated caller; may only register as a new member."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /members"
