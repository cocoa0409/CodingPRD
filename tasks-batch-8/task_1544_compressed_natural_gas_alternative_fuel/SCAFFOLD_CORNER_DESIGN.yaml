      - name: claim_provisional_excludes_voided_sessions
        claim_type: input_set_filtering
        grounds: [calculations.tax_credit_claim_computation]
        distinguishing_aspect: "A completed-then-voided session is excluded from the provisional claim input set: eligible_gge_provisional is 0.000 and amount 0 even though the session was once COMPLETED."
        test_recipe:
