            - "after abate: close succeeds; MshaInspection.${insp}.status == CLOSED and closed_on == 2026-08-01"
            - "note: the non-S&S citation kept posture at RESTRICTED while ISSUED (an ISSUED citation exists), returning to OPERATING after abate"

      - name: muckpile_deplete_block_reopen_cycle
        claim_type: auto_transition
        grounds: [state_machines.Muckpile.OPEN_to_DEPLETED, state_machines.Muckpile.DEPLETED_to_OPEN, "errors[ERR_MUCKPILE_DEPLETED]"]
        distinguishing_aspect: "Auto-transition at the exact-zero boundary plus compensation: a run consuming exactly the remaining 3792.6 t auto-depletes the pile (run start then fails), and voiding that run auto-reopens it."
        test_recipe:
          setup: ["site OPERATING; fired shot (3792.6 t); certified belt scale; pile capacity 5000"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
