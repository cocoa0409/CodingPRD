  # =====================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: bay_overlap_with_turnover_buffer_adjacency
        grounds:
          - validations[priority=12]
          - entities.ServiceBay.fields.turnover_buffer_min
          - state_machines.InstallAppointment.SCHEDULED_to_RESCHEDULE_PENDING
          - errors[ERR_BAY_TIME_CONFLICT]
        distinguishing_aspect: |
          Interval semantics WITH buffer: appointment [10:00,11:00) booked into a bay with
          turnover_buffer_min=15 conflicts with an existing [09:00,10:00) appointment because the
          existing interval is extended to [09:00,10:15) by the buffer; the half-open intervals
          would otherwise be merely adjacent (gap=0) and allowed. -> ERR_BAY_TIME_CONFLICT.
        test_recipe:
          setup:
            - "A bay (turnover_buffer_min 15) with a SCHEDULED appointment 09:00-10:00; a second APPROVED order ready to book 10:00-11:00."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c15@x.com", full_name: "C Fifteen", phone: "555-0015" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", make: "TOYOTA", model: "CAMRY", model_year: 2022, oe_tire_size: "235/45R18", rim_diameter_in: 18, tpms_type: "DIRECT" }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
            - call: "POST /tire-models"
              payload: { brand: "MICHELIN", model_name: "PRIMACY", size_token: "235/45R18", load_index: 94, speed_rating: "V", unit_price_cents: 15000, mileage_warranty_miles: 60000, original_tread_32nds: 10, stock_qty: 20 }
              as: InventoryManager
              captures: { tm_id: $.data.id }
            - call: "POST /fitment-rules"
              payload: { vehicle_id: "${veh_id}", tire_model_id: "${tm_id}", fitment_grade: "OE_EXACT" }
              as: InventoryManager
            - call: "POST /service-bays"
              payload: { bay_name: "Bay-G", alignment_capable: false, turnover_buffer_min: 15 }
              as: InventoryManager
              captures: { bay_id: $.data.id, bay_v0: $.data.version }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}" }
              as: ServiceAdvisor
              captures: { wo1: $.data.id, wo1_v0: $.data.version }
            - call: "POST /work-orders/${wo1}/lines"
              payload: { line_type: "TIRE", tire_model_id: "${tm_id}", quantity: 4, road_hazard_opted: false, expected_work_order_version: "${wo1_v0}" }
              as: ServiceAdvisor
              captures: { wo1_v1: $.data.version }
            - call: "POST /work-orders/${wo1}/approve"
              payload: { expected_work_order_version: "${wo1_v1}" }
              as: ServiceAdvisor
            - call: "POST /appointments"
              payload: { work_order_id: "${wo1}", service_bay_id: "${bay_id}", scheduled_start: "2026-07-08T09:00:00.000Z", scheduled_end: "2026-07-08T10:00:00.000Z", expected_service_bay_version: "${bay_v0}" }
              as: ServiceAdvisor
              captures: { bay_v1: $.data.version }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}" }
              as: ServiceAdvisor
              captures: { wo2: $.data.id, wo2_v0: $.data.version }
            - call: "POST /work-orders/${wo2}/lines"
              payload: { line_type: "TIRE", tire_model_id: "${tm_id}", quantity: 4, road_hazard_opted: false, expected_work_order_version: "${wo2_v0}" }
              as: ServiceAdvisor
              captures: { wo2_v1: $.data.version }
            - call: "POST /work-orders/${wo2}/approve"
              payload: { expected_work_order_version: "${wo2_v1}" }
              as: ServiceAdvisor
          trigger:
            - call: "POST /appointments"
              payload: { work_order_id: "${wo2}", service_bay_id: "${bay_id}", scheduled_start: "2026-07-08T10:00:00.000Z", scheduled_end: "2026-07-08T11:00:00.000Z", expected_service_bay_version: "${bay_v1}" }
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_BAY_TIME_CONFLICT"

      - name: bay_half_open_adjacency_no_buffer_succeeds
        grounds:
          - validations[priority=12]
          - entities.ServiceBay.fields.turnover_buffer_min
          - state_machines.InstallAppointment.SCHEDULED_to_RESCHEDULE_PENDING
        distinguishing_aspect: |
          DIFFERENT interval semantics on a different bay: with turnover_buffer_min=0, half-open
          [start,end) intervals that are exactly adjacent (existing [09:00,10:00), new [10:00,11:00))
          do NOT overlap and the booking SUCCEEDS (201). Contrasts the buffered geometry above —
          proving the overlap arithmetic differs by buffer.
        test_recipe:
          setup:
            - "A bay with turnover_buffer_min 0 holding a SCHEDULED 09:00-10:00 appointment; a second APPROVED order booking exactly-adjacent 10:00-11:00."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c16@x.com", full_name: "C Sixteen", phone: "555-0016" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", make: "HYUNDAI", model: "TUCSON", model_year: 2022, oe_tire_size: "235/55R19", rim_diameter_in: 19, tpms_type: "DIRECT" }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
            - call: "POST /tire-models"
              payload: { brand: "KUMHO", model_name: "CRUGEN", size_token: "235/55R19", load_index: 101, speed_rating: "H", unit_price_cents: 13000, mileage_warranty_miles: 50000, original_tread_32nds: 10, stock_qty: 20 }
              as: InventoryManager
              captures: { tm_id: $.data.id }
            - call: "POST /fitment-rules"
              payload: { vehicle_id: "${veh_id}", tire_model_id: "${tm_id}", fitment_grade: "OE_EXACT" }
              as: InventoryManager
            - call: "POST /service-bays"
              payload: { bay_name: "Bay-H", alignment_capable: false, turnover_buffer_min: 0 }
              as: InventoryManager
              captures: { bay_id: $.data.id, bay_v0: $.data.version }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}" }
              as: ServiceAdvisor
              captures: { wo1: $.data.id, wo1_v0: $.data.version }
            - call: "POST /work-orders/${wo1}/lines"
              payload: { line_type: "TIRE", tire_model_id: "${tm_id}", quantity: 4, road_hazard_opted: false, expected_work_order_version: "${wo1_v0}" }
              as: ServiceAdvisor
              captures: { wo1_v1: $.data.version }
            - call: "POST /work-orders/${wo1}/approve"
              payload: { expected_work_order_version: "${wo1_v1}" }
              as: ServiceAdvisor
            - call: "POST /appointments"
              payload: { work_order_id: "${wo1}", service_bay_id: "${bay_id}", scheduled_start: "2026-07-09T09:00:00.000Z", scheduled_end: "2026-07-09T10:00:00.000Z", expected_service_bay_version: "${bay_v0}" }
              as: ServiceAdvisor
              captures: { bay_v1: $.data.version }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}" }
              as: ServiceAdvisor
              captures: { wo2: $.data.id, wo2_v0: $.data.version }
            - call: "POST /work-orders/${wo2}/lines"
              payload: { line_type: "TIRE", tire_model_id: "${tm_id}", quantity: 4, road_hazard_opted: false, expected_work_order_version: "${wo2_v0}" }
              as: ServiceAdvisor
              captures: { wo2_v1: $.data.version }
            - call: "POST /work-orders/${wo2}/approve"
              payload: { expected_work_order_version: "${wo2_v1}" }
              as: ServiceAdvisor
          trigger:
            - call: "POST /appointments"
              payload: { work_order_id: "${wo2}", service_bay_id: "${bay_id}", scheduled_start: "2026-07-09T10:00:00.000Z", scheduled_end: "2026-07-09T11:00:00.000Z", expected_service_bay_version: "${bay_v1}" }
              as: ServiceAdvisor
              captures: { appt2: $.data.id, st: $.data.status }
          assert:
            - "response.status == 201"
            - "InstallAppointment.${appt2}.status == SCHEDULED"

  # =====================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancel_restores_tire_stock_invariant
        grounds:
          - state_machines.WorkOrder.APPROVED_to_CANCELLED
          - state_machines.WorkOrder.DRAFT_to_APPROVED
          - entities.TireModel.fields.stock_qty
        distinguishing_aspect: |
          Conserved quantity = catalog inventory. Invariant: TireModel.stock_qty AFTER
          approve-then-cancel == stock_qty BEFORE approve. Approve debits qty (10 -> 6 for a qty-4
          line); cancel restocks the same qty back to 10. Pinned formula:
          stock_after_cancel == stock_before_approve.
        test_recipe:
          setup:
            - "A TireModel at stock_qty 10; an APPROVED WorkOrder with a qty-4 TIRE line (stock now 6)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c17@x.com", full_name: "C Seventeen", phone: "555-0017" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", make: "CHEVY", model: "MALIBU", model_year: 2020, oe_tire_size: "225/55R17", rim_diameter_in: 17, tpms_type: "DIRECT" }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
            - call: "POST /tire-models"
              payload: { brand: "COOPER", model_name: "CS5", size_token: "225/55R17", load_index: 97, speed_rating: "H", unit_price_cents: 11000, mileage_warranty_miles: 65000, original_tread_32nds: 11, stock_qty: 10 }
              as: InventoryManager
              captures: { tm_id: $.data.id }
            - call: "POST /fitment-rules"
              payload: { vehicle_id: "${veh_id}", tire_model_id: "${tm_id}", fitment_grade: "OE_EXACT" }
              as: InventoryManager
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}" }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id, wo_v0: $.data.version }
            - call: "POST /work-orders/${wo_id}/lines"
              payload: { line_type: "TIRE", tire_model_id: "${tm_id}", quantity: 4, road_hazard_opted: false, expected_work_order_version: "${wo_v0}" }
              as: ServiceAdvisor
              captures: { wo_v1: $.data.version }
            - call: "POST /work-orders/${wo_id}/approve"
              payload: { expected_work_order_version: "${wo_v1}" }
              as: ServiceAdvisor
              captures: { wo_v2: $.data.version }
          trigger:
            - call: "POST /work-orders/${wo_id}/cancel"
              payload: { expected_work_order_version: "${wo_v2}" }
              as: ServiceAdvisor
          assert:
            - "TireModel.${tm_id}.stock_qty == 10"
            - "WorkOrder.${wo_id}.fulfillment_status == CANCELLED"

      - name: cancel_restores_store_credit_invariant
        grounds:
          - state_machines.WorkOrder.APPROVED_to_CANCELLED
          - state_machines.WorkOrder.DRAFT_to_APPROVED
          - entities.Customer.fields.store_credit_cents
        distinguishing_aspect: |
          DIFFERENT conserved quantity = customer store credit. Invariant: Customer.store_credit_cents
          AFTER approve(applying 2500)-then-cancel == the balance BEFORE approve (2500). Approve
          debits the applied credit; cancel refunds the same amount. Pinned formula:
          credit_after_cancel == credit_before_approve.
        test_recipe:
          setup:
            - "A Customer holding 2500 store_credit (seeded via a PAID STORE_CREDIT mileage claim of 2500); an APPROVED order that applied 2500 store credit (balance now 0)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c18@x.com", full_name: "C Eighteen", phone: "555-0018" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", make: "TOYOTA", model: "COROLLA", model_year: 2021, oe_tire_size: "205/55R16", rim_diameter_in: 16, tpms_type: "DIRECT" }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
            - call: "POST /tire-models"
              payload: { brand: "MICHELIN", model_name: "DEFENDER", size_token: "205/55R16", load_index: 91, speed_rating: "H", unit_price_cents: 15000, mileage_warranty_miles: 30000, original_tread_32nds: 10, stock_qty: 20 }
              as: InventoryManager
              captures: { tm_id: $.data.id }
            - call: "POST /fitment-rules"
              payload: { vehicle_id: "${veh_id}", tire_model_id: "${tm_id}", fitment_grade: "OE_EXACT" }
              as: InventoryManager
            # seed 2500 store credit: claim with miles 25000/30000 => remaining 1/6 => per_tire round_half_up(15000/6=2500)=2500, qty 1 => 2500
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}" }
              as: ServiceAdvisor
              captures: { seed_wo: $.data.id, seed_v0: $.data.version }
            - call: "POST /work-orders/${seed_wo}/lines"
              payload: { line_type: "TIRE", tire_model_id: "${tm_id}", quantity: 1, road_hazard_opted: false, expected_work_order_version: "${seed_v0}" }
              as: ServiceAdvisor
              captures: { seed_line: $.data.id, seed_v1: $.data.version }
            - call: "POST /work-orders/${seed_wo}/approve"
              payload: { expected_work_order_version: "${seed_v1}" }
              as: ServiceAdvisor
            - call: "POST /mileage-claims"
              payload: { work_order_line_id: "${seed_line}", tire_model_id: "${tm_id}", measured_tread_32nds: 2, miles_driven: 25000, payout_method: "STORE_CREDIT", claim_quantity: 1 }
              as: ServiceAdvisor
              captures: { seed_claim: $.data.id }
            - call: "POST /mileage-claims/${seed_claim}/approve"
              payload: {}
              as: ServiceAdvisor
            - call: "POST /mileage-claims/${seed_claim}/pay"
              payload: {}
              as: ServiceAdvisor
            # now build order applying 2500 store credit
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", store_credit_applied_cents: 2500 }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id, wo_v0: $.data.version }
            - call: "POST /work-orders/${wo_id}/lines"
              payload: { line_type: "TIRE", tire_model_id: "${tm_id}", quantity: 4, road_hazard_opted: false, expected_work_order_version: "${wo_v0}" }
              as: ServiceAdvisor
              captures: { wo_v1: $.data.version }
            - call: "POST /work-orders/${wo_id}/approve"
              payload: { expected_work_order_version: "${wo_v1}" }
              as: ServiceAdvisor
              captures: { wo_v2: $.data.version }
          trigger:
            - call: "POST /work-orders/${wo_id}/cancel"
              payload: { expected_work_order_version: "${wo_v2}" }
              as: ServiceAdvisor
          assert:
            - "Customer.${cust_id}.store_credit_cents == 2500"
            - "WorkOrder.${wo_id}.fulfillment_status == CANCELLED"
            - "WorkOrder.${wo_id}.payment_status == UNPAID"
