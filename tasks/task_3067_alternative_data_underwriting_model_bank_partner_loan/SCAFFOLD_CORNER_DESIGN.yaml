  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "A request with no X-User-Role header is 401 ERR_UNAUTHENTICATED even on a read-only GET — priority 1 precedes existence, so an unknown id cannot mask it."
        test_recipe:
          setup:
            - "Logical clock at default. Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /platform/partners/00000000-0000-4000-8000-000000000033"
              payload: {}
              as: ""
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 401 and error_id == ERR_UNAUTHENTICATED"
            - "error_id != ERR_NOT_FOUND (auth precedes existence)"

      - name: no_active_model_blocks_submission
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors.ERR_NO_ACTIVE_MODEL
        distinguishing_aspect: "Submitting an application when the only model is DRAFT (never activated) is 409 ERR_NO_ACTIVE_MODEL; the applicant exists and the body is valid, so only the model-availability rule can fire."
        test_recipe:
          setup:
            - "Logical clock at default. One DRAFT model (not activated). One applicant."
          setup_api_calls:
            - call: "POST /platform/model-versions"
              payload: { model_code: "ADU-V-1", variables: [{ name: "bureau_score", weight: 1, min: 300, max: 850 }], calibration_note: "draft only", score_floor: 0, score_ceiling: 1000 }
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { m_id: $.data.id }
            - call: "POST /platform/applicants"
              payload: { full_name: "NoModel Ned", state_code: "TX", annual_income_cents: 12000000, monthly_debt_payments_cents: 200000, education_level: "BACHELOR", employment_status: "EMPLOYED", months_employed: 12, bank_account_avg_balance_cents: 500000, bank_account_nsf_count_90d: 0, monthly_net_cashflow_cents: 100000, bureau_score: 575 }
              as: PlatformAdmin
              as_user_id: "pad-one"
              captures: { ap_id: $.data.id }
          trigger:
            - call: "POST /platform/applications"
              payload: { applicant_id: "${ap_id}", channel: "DIRECT", requested_amount_cents: 5000000 }
              as: PlatformAdmin
              as_user_id: "pad-one"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_NO_ACTIVE_MODEL"
            - "GET /platform/applications?applicant_id=${ap_id} returns 0 rows"

      - name: referral_channel_requires_referral_partner_and_direct_forbids_it
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Channel/FK coupling: PARTNER_REFERRAL without referral_partner_id is 400 ERR_INVALID_REQUEST, and DIRECT with a referral_partner_id is also 400 ERR_INVALID_REQUEST — the same error id covers both directions of the constraint."
        test_recipe:
          setup:
            - "Logical clock at default. Model ACTIVE (bureau-only). One applicant; one ONBOARDING partner (existence satisfied)."
          setup_api_calls:
            - call: "POST /platform/model-versions"
              payload: { model_code: "ADU-V-2", variables: [{ name: "bureau_score", weight: 1, min: 300, max: 850 }], calibration_note: "channel", score_floor: 0, score_ceiling: 1000 }
              as: RiskOfficer
