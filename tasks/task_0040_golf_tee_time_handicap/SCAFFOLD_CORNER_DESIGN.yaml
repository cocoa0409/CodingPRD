  # =====================================================================
  - section: rbac
    instances:
      - name: golfer_cannot_create_course
        claim_type: exclusive_operations
        grounds: [roles, "errors[ERR_FORBIDDEN_ROLE]", "validations[priority=2]"]
        distinguishing_aspect: "A Golfer calling POST /golf/courses (ProShop-exclusive) -> 403 ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["One registered golfer."]
          setup_api_calls:
            - call: "POST /golf/golfers"
              payload: { full_name: "GA", membership_tier: "PUBLIC" }
              as: ProShop
              captures: { ga: $.data.id }
          trigger:
            - call: "POST /golf/courses"
              payload: { name: "Sneaky", course_rating: 70.0, slope_rating: 113, peak_fee_cents: 8000, offpeak_fee_cents: 5000 }
              as: Golfer
              as_user_id: "${ga}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_FORBIDDEN_ROLE"

