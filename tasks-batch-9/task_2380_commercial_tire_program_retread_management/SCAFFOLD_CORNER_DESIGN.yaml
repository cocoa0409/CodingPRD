          trigger:
            - call: "POST /service-locations"
              payload: { name: "Clash Location", location_code: "UQC", state_code: "KY", road_service_response_minutes_committed: 120, scrap_permit_number: "KY-SCRAP-4032", scrap_permit_expires_on: "2027-06-30" }
              as: DealerAdmin
              captures: { e1: $.data.error_id }
            - call: "POST /casings"
