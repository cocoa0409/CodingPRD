  - rule_id: transitive_cascade
    instances:

      - name: plan_approval_cascades_recall_to_notification_to_retailer_posture_depth3
        grounds:
          - state_machines.Recall.plan_status.side_effects.plan_approval_stop_sale
          - state_machines.RetailerNotification
          - entities.Recall.fields.stop_sale_effective_at
          - entities.Recall.fields.notification_status
          - entities.RetailerNotification.fields.ack_due_at
          - entities.Retailer.fields.open_stop_sale_count
          - entities.Retailer.fields.compliance_posture
        distinguishing_aspect: |
          Depth-3 cascade named plan_approval_stop_sale, fired by a single
          approve-plan call: (1) Recall.plan_status DRAFT->SUBMITTED->APPROVED sets
          stop_sale_effective_at and flips the independent notification_status
          dimension NOT_STARTED->IN_PROGRESS, (2) every PENDING RetailerNotification
          under that recall transitions to ISSUED and is stamped with
          issued_at + ack_due_at 72h out, (3) each affected Retailer's
          open_stop_sale_count is incremented and its compliance_posture is
          recomputed to STOP_SALE_ACTIVE. The third hop lands on an entity the
          approve-plan payload never names.
