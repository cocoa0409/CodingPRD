            - "Crew.${crew}.accrued_wage_cents == 0 and Picker.${pk}.total_clamshells_lifetime == 0"

      - name: picker_disputing_another_pickers_session_returns_not_session_owner
        claim_type: exclusive_operations
        grounds:
          - roles.Picker
          - validations[priority=21]
          - errors[ERR_NOT_SESSION_OWNER]
          - state_machines.PickSession.APPROVED_to_DISPUTED
        distinguishing_aspect: |
          Dispute is shared between Picker and CrewSupervisor, but a Picker-role
          caller is confined to their OWN session: picker B disputing picker A's
          APPROVED session is 403 ERR_NOT_SESSION_OWNER while picker A's own
