            - call: "POST /personnel"
              payload: { full_name: "Ola Beck", role_code: "WELDING_ENGINEER", stamp_initials: "OB" }
              as: ShopAdmin
              as_user_id: "${qc1_id}"
          assert:
            - "${e_de_is_qc} == ERR_IDENTITY_ROLE_MISMATCH with HTTP 403: the X-User-ID resolves to a QC_INSPECTOR while the header claims DesignEngineer"
            - "${e_qc_is_we} == ERR_IDENTITY_ROLE_MISMATCH: the mismatch is checked on writes regardless of how well-formed the body is"
            - "${e_read_mismatch} == ERR_IDENTITY_ROLE_MISMATCH: shared GET endpoints are gated too, so a mismatched pair cannot read"
            - "${e_user_id_not_personnel} == ERR_IDENTITY_ROLE_MISMATCH, not ERR_PERSONNEL_NOT_FOUND: an X-User-ID that resolves to no Personnel row at all is a mismatch, and the 403 is returned ahead of the priority-30 path-id family"
            - "${e_mismatch_beats_role} == ERR_IDENTITY_ROLE_MISMATCH rather than ERR_ROLE_NOT_PERMITTED, even though DesignEngineer may never open a job: priority 15 outranks priority 20"
            - "The carve-out holds: POST /personnel succeeds with HTTP 201 for Ola Beck even though X-User-ID names a QC_INSPECTOR, because priority 15 exempts POST /personnel and POST /_clock/set_current_utc"
            - "Nothing else was written: GET /personnel returns total_count == 5, GET /wps returns total_count == 0, GET /material-heats returns total_count == 0, GET /vessel-jobs returns total_count == 1 and VesselJob.${job_id}.version is still ${jv1}"

      - name: rbac_segregation_of_duties_bars_a_preparer_from_reviewing_their_own_sheet
        claim_type: Segregation of Duties
        grounds:
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - validations[priority=60]
          - complexity_profile.role_model
          - state_machines.DesignCalculation.transitions[SUBMITTED->APPROVED]
          - state_machines.DesignCalculation.transitions[SUBMITTED->REJECTED]
        distinguishing_aspect: "role_model is segregation_of_duties, so holding the right role is necessary but not sufficient: the preparer of a sheet is barred from both terminal reviews of that same sheet, the bar is keyed on X-User-ID rather than on the role, and a second DesignEngineer clears it immediately afterwards on the very same sheet."
        test_recipe:
          setup:
            - "Two DesignEngineer people exist, Dana Reyes (preparer) and Efrain Cole (independent reviewer), plus Quinn Park (QC_INSPECTOR) who has the wrong role entirely."
            - "Certificate CA-U-8939 is ACTIVE, job J-2885-C59 is open under it, and Dana has prepared and submitted the SHELL sheet, which therefore records prepared_by_personnel_id = Dana and status SUBMITTED."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "Dana Reyes", role_code: "DESIGN_ENGINEER", stamp_initials: "DR" }
              as: ShopAdmin
              captures: { de1_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Efrain Cole", role_code: "DESIGN_ENGINEER", stamp_initials: "EC" }
              as: ShopAdmin
              captures: { de2_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Quinn Park", role_code: "QC_INSPECTOR", stamp_initials: "QP" }
              as: ShopAdmin
              captures: { qc1_id: $.data.id }
            - call: "POST /certificates"
              payload: { cert_number: "CA-U-8939", scope_codes: ["U"], issued_on: "2026-01-01", expires_on: "2029-01-01" }
              as: ShopAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /vessel-jobs"
              payload: { certificate_id: "${cert_id}", job_number: "J-2885-C59", customer_name: "Northline Energy", vessel_type: "PRESSURE_VESSEL", design_code: "DIV1", mawp_psi: 350, design_temp_f: 650, mdmt_f: -20, inside_radius_in: 30, stress_ratio: 1.00 }
              as: ShopAdmin
              captures: { job_id: $.data.id, jv1: $.data.version }
            - call: "POST /vessel-jobs/${job_id}/design-calculations"
              payload: { expected_job_version: "${jv1}", component: "SHELL", rt_extent_declared: "FULL", allowable_stress_psi: 20000, corrosion_allowance_in: 0.0625, thickness_nominal_in: 0.8750 }
              as: DesignEngineer
              as_user_id: "${de1_id}"
              captures: { calc_id: $.data.id }
            - call: "POST /design-calculations/${calc_id}/submit"
              payload: {}
              as: DesignEngineer
              as_user_id: "${de1_id}"
          trigger:
            - call: "POST /design-calculations/${calc_id}/approve"
              payload: {}
              as: DesignEngineer
              as_user_id: "${de1_id}"
              captures: { e_self_approve: $.data.error_id }
            - call: "POST /design-calculations/${calc_id}/reject"
              payload: { reject_reason: "second thoughts about the corrosion allowance" }
              as: DesignEngineer
              as_user_id: "${de1_id}"
              captures: { e_self_reject: $.data.error_id }
            - call: "POST /design-calculations/${calc_id}/approve"
              payload: {}
              as: QCInspector
              as_user_id: "${qc1_id}"
              captures: { e_wrong_role: $.data.error_id }
            - call: "POST /design-calculations/${calc_id}/approve"
              payload: {}
              as: DesignEngineer
              as_user_id: "${de2_id}"
          assert:
            - "${e_self_approve} == ERR_SEGREGATION_OF_DUTIES with HTTP 409: the acting X-User-ID equals DesignCalculation.${calc_id}.prepared_by_personnel_id"
            - "${e_self_reject} == ERR_SEGREGATION_OF_DUTIES: the bar covers the reject branch as well, so the preparer cannot force the sheet out of SUBMITTED in either direction"
            - "${e_wrong_role} == ERR_ROLE_NOT_PERMITTED, not ERR_SEGREGATION_OF_DUTIES: priority 20 fires before priority 60, so a QCInspector never reaches the duties check"
            - "Both refusals are inert: DesignCalculation.${calc_id}.status is still SUBMITTED with reviewed_by_personnel_id null and reject_reason null after all three refusals"
            - "The independent review succeeds: HTTP 200, DesignCalculation.${calc_id}.status == APPROVED and reviewed_by_personnel_id == ${de2_id} while prepared_by_personnel_id is still ${de1_id}"
            - "The bar is keyed on the person, not the role: the successful approver holds exactly the same DesignEngineer role as the refused one"

  - section: cross_cutting_complexity_layers
    instances:

      - name: layer_optimistic_concurrency_guards_every_job_scoped_write
        claim_type: optimistic_concurrency
        grounds:
          - complexity_profile.complexity_layers[optimistic_concurrency]
          - concurrency_rules[design-calc-revision-stale-job]
          - errors[ERR_STALE_JOB_VERSION]
          - validations[priority=45]
          - endpoints[POST /vessel-jobs/{job_id}/design-calculations]
          - endpoints[POST /vessel-jobs/{job_id}/data-report]
        distinguishing_aspect: "The declared OCC rule guards the VesselJob version on both of its job-scoped writes, and the version advances on writes the client never made: preparing the SHELL sheet moves the job from 1 to 2, so a HEAD create still holding version 1 is refused with 412 while the same body with version 2 succeeds — and the refusal itself must not consume a version, otherwise the retry would fail too."
        test_recipe:
          setup:
            - "Certificate CA-U-8940 is ACTIVE and job J-2885-C60 (PRESSURE_VESSEL, MAWP 350 psi, R 30 in) is open under it at DRAFT with version 1."
            - "Dana Reyes is a registered DESIGN_ENGINEER and Quinn Park a registered QC_INSPECTOR; the client captures the job version once, before any write, and deliberately reuses that stale value."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "Dana Reyes", role_code: "DESIGN_ENGINEER", stamp_initials: "DR" }
              as: ShopAdmin
              captures: { de1_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Quinn Park", role_code: "QC_INSPECTOR", stamp_initials: "QP" }
              as: ShopAdmin
              captures: { qc1_id: $.data.id }
            - call: "POST /certificates"
              payload: { cert_number: "CA-U-8940", scope_codes: ["U"], issued_on: "2026-01-01", expires_on: "2029-01-01" }
              as: ShopAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /vessel-jobs"
              payload: { certificate_id: "${cert_id}", job_number: "J-2885-C60", customer_name: "Northline Energy", vessel_type: "PRESSURE_VESSEL", design_code: "DIV1", mawp_psi: 350, design_temp_f: 650, mdmt_f: -20, inside_radius_in: 30, stress_ratio: 1.00 }
              as: ShopAdmin
              captures: { job_id: $.data.id, jv1: $.data.version }
            - call: "POST /vessel-jobs/${job_id}/design-calculations"
              payload: { expected_job_version: "${jv1}", component: "SHELL", rt_extent_declared: "FULL", allowable_stress_psi: 20000, corrosion_allowance_in: 0.0625, thickness_nominal_in: 0.8750 }
              as: DesignEngineer
              as_user_id: "${de1_id}"
              captures: { shell_id: $.data.id }
          trigger:
            - call: "POST /vessel-jobs/${job_id}/design-calculations"
              payload: { expected_job_version: "${jv1}", component: "HEAD", rt_extent_declared: "FULL", allowable_stress_psi: 20000, corrosion_allowance_in: 0.0625, thickness_nominal_in: 0.8750 }
              as: DesignEngineer
              as_user_id: "${de1_id}"
              captures: { e_stale_create: $.data.error_id }
            - call: "POST /vessel-jobs/${job_id}/data-report"
              payload: { expected_job_version: "${jv1}", form_type: "U-1" }
              as: QCInspector
              as_user_id: "${qc1_id}"
              captures: { e_stale_report: $.data.error_id }
            - call: "GET /vessel-jobs/${job_id}"
              payload: {}
              as: ShopAdmin
              captures: { jv2: $.data.version }
            - call: "POST /vessel-jobs/${job_id}/design-calculations"
              payload: { expected_job_version: "${jv2}", component: "HEAD", rt_extent_declared: "FULL", allowable_stress_psi: 20000, corrosion_allowance_in: 0.0625, thickness_nominal_in: 0.8750 }
              as: DesignEngineer
              as_user_id: "${de1_id}"
              captures: { head_id: $.data.id }
            - call: "GET /vessel-jobs/${job_id}"
              payload: {}
              as: ShopAdmin
              captures: { jv3: $.data.version }
          assert:
            - "The setup write already advanced the guard: ${jv1} == 1 and ${jv2} == 2, because creating the SHELL sheet increments VesselJob.version by 1"
            - "${e_stale_create} == ERR_STALE_JOB_VERSION with HTTP 412: expected_job_version 1 no longer matches the job's version 2"
            - "${e_stale_report} == ERR_STALE_JOB_VERSION with HTTP 412 as well, so both endpoints declaring expected_job_version are guarded by the same rule and the same error id"
            - "A refused OCC write consumes nothing: after both 412s the job is still at version 2, still DESIGN_REVIEW-eligible at DRAFT, and GET /design-calculations?job_id=${job_id} returns total_count == 1 with only the SHELL sheet"
            - "The retry with the fresh version succeeds: HTTP 201, DesignCalculation.${head_id}.component == HEAD, revision == 1 and status == DRAFT"
            - "${jv3} == 3: every accepted job-scoped write increments the version exactly once, so the sequence is 1 -> 2 (SHELL) -> 2 (two refusals) -> 3 (HEAD)"
            - "GET /data-reports?job_id=${job_id} returns total_count == 0: the refused assembly created no DataReport row and did not void anything"

      - name: layer_optimistic_concurrency_on_certificate_renewals
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[certificate-renewal-stale]
          - errors[ERR_STALE_CERTIFICATE_VERSION]
          - endpoints[POST /certificates/{certificate_id}/renewals]
        excluded_because:
          difficulty_instance: cross_entity_certificate_renewal_gated_on_satisfactory_closed_audit
          rationale: "That §1.8 instance already closes an audit against the certificate (advancing its version through the posture cascade), replays the renewal with the pre-close expected_certificate_version to draw ERR_STALE_CERTIFICATE_VERSION 412, and then renews on the refreshed version — covering the second concurrency_rules entry end to end, including the assertion that the refused renewal leaves renewal_count and the finding counters untouched."

      - name: layer_cascading_side_effects_chain_ordering
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - endpoints[POST /shop-audits/{audit_id}/close]
          - endpoints[POST /nde-exams/{exam_id}/result]
        excluded_because:
          difficulty_instance: transitive_audit_close_suspends_certificate_and_freezes_signed_data_report
          rationale: "That §1.8 instance walks the longest declared chain in the scaffold — audit close feeds the certificate's finding counters, the counters re-derive status and stamping_authorized, and the loss of stamping authority freezes every AI_SIGNED DataReport under that certificate into STAMP_HOLD — and asserts each level plus the ordering sensitivity (the report must not be frozen until after the counters are applied). The four-level NDE reject chain is covered by transitive_nde_reject_propagates_exam_weld_ncr_job_and_data_report."

      - name: layer_dual_variant_calculation_both_variants_and_the_delta
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations.required_wall_thickness
          - calculations.test_pressure
        excluded_because:
          difficulty_instance: dual_variant_shell_thickness_circumferential_vs_longitudinal
          rationale: "That §1.8 instance computes both variants of required_wall_thickness on the same inputs, asserts the circumferential value, the longitudinal value, the governing_variant selection and the delta between them, and dual_variant_test_pressure_hydrostatic_vs_pneumatic does the same for the other dual-variant rule, so both declared variant families are already exercised on both branches."

      - name: layer_derived_field_reconciliation_after_create_update_and_source_removal
        claim_type: derived_field_reconciliation
        grounds:
          - complexity_profile.complexity_layers[derived_field_reconciliation]
          - calculations.material_balance
          - entities.MaterialHeat.fields[quantity_issued_lb]
          - entities.MaterialHeat.fields[quantity_remaining_lb]
        excluded_because:
          difficulty_instance: compensating_invariant_heat_mass_conserved_across_issue_scrap_reissue
          rationale: "That §1.8 instance is exactly the create/update/remove-source triple the layer calls for: it reconciles the heat's derived mass ledger after each issue, after the DEPLETED threshold is crossed, and after a part is scrapped and its mass returned (lifting the heat back to ACCEPTED), asserting quantity_issued_lb + quantity_remaining_lb == quantity_received_lb at every step. The nonconformance counter's reconciliation is covered by compensating_invariant_open_nonconformance_count_conserved_through_repair_cycle."

  - section: consistency_model
    instances:

      - name: consistency_immediate_cascade_is_visible_in_the_same_request_cycle
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /design-calculations/{calculation_id}/approve]
          - entities.VesselJob.fields[governing_joint_efficiency]
          - entities.VesselJob.fields[design_release_at]
          - calculations.joint_efficiency_resolution
        distinguishing_aspect: "The declared model is immediate, so the final approve must publish its whole cascade before it responds: no polling, no re-read delay, no eventual reconciliation. The read issued immediately after the approve — with no intervening write and no wait — already shows FAB_PLANNING, a non-null design_release_at and governing_joint_efficiency recomputed to the minimum over APPROVED sheets, and the two derived percentages seeded at their empty-set values."
        test_recipe:
          setup:
            - "Certificate CA-U-8941 is ACTIVE and job J-2885-C61 (PRESSURE_VESSEL, MAWP 350 psi, R 30 in, S 20000 psi, CA 0.0625 in) is open under it."
            - "Two DesignEngineer people exist: Dana Reyes prepares both sheets, Efrain Cole reviews them. The SHELL sheet declares FULL radiography (E 1.00, required 0.5931 in) and the HEAD sheet SPOT radiography (E 0.85, required 0.6879 in); both are offered at nominal 0.8750 in, so both clear their own requirement."
            - "The SHELL sheet is already APPROVED and the HEAD sheet is SUBMITTED, so the job sits at DESIGN_REVIEW with governing_joint_efficiency 1.00 and design_release_at still null — one approval short of release."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "Dana Reyes", role_code: "DESIGN_ENGINEER", stamp_initials: "DR" }
              as: ShopAdmin
              captures: { de1_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Efrain Cole", role_code: "DESIGN_ENGINEER", stamp_initials: "EC" }
              as: ShopAdmin
              captures: { de2_id: $.data.id }
            - call: "POST /certificates"
              payload: { cert_number: "CA-U-8941", scope_codes: ["U"], issued_on: "2026-01-01", expires_on: "2029-01-01" }
              as: ShopAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /vessel-jobs"
              payload: { certificate_id: "${cert_id}", job_number: "J-2885-C61", customer_name: "Northline Energy", vessel_type: "PRESSURE_VESSEL", design_code: "DIV1", mawp_psi: 350, design_temp_f: 650, mdmt_f: -20, inside_radius_in: 30, stress_ratio: 1.00 }
              as: ShopAdmin
              captures: { job_id: $.data.id, jv1: $.data.version }
            - call: "POST /vessel-jobs/${job_id}/design-calculations"
              payload: { expected_job_version: "${jv1}", component: "SHELL", rt_extent_declared: "FULL", allowable_stress_psi: 20000, corrosion_allowance_in: 0.0625, thickness_nominal_in: 0.8750 }
              as: DesignEngineer
              as_user_id: "${de1_id}"
              captures: { shell_id: $.data.id }
            - call: "GET /vessel-jobs/${job_id}"
              payload: {}
              as: ShopAdmin
              captures: { jv2: $.data.version }
            - call: "POST /vessel-jobs/${job_id}/design-calculations"
              payload: { expected_job_version: "${jv2}", component: "HEAD", rt_extent_declared: "SPOT", allowable_stress_psi: 20000, corrosion_allowance_in: 0.0625, thickness_nominal_in: 0.8750 }
              as: DesignEngineer
              as_user_id: "${de1_id}"
              captures: { head_id: $.data.id }
            - call: "POST /design-calculations/${shell_id}/submit"
              payload: {}
              as: DesignEngineer
              as_user_id: "${de1_id}"
            - call: "POST /design-calculations/${shell_id}/approve"
              payload: {}
              as: DesignEngineer
              as_user_id: "${de2_id}"
            - call: "POST /design-calculations/${head_id}/submit"
              payload: {}
              as: DesignEngineer
              as_user_id: "${de1_id}"
            - call: "GET /vessel-jobs/${job_id}"
              payload: {}
              as: ShopAdmin
              captures: { status_before: $.data.status, gje_before: $.data.governing_joint_efficiency, release_before: $.data.design_release_at }
          trigger:
            - call: "POST /design-calculations/${head_id}/approve"
              payload: {}
              as: DesignEngineer
              as_user_id: "${de2_id}"
              captures: { head_status_in_response: $.data.status, head_reviewer_in_response: $.data.reviewed_by_personnel_id }
            - call: "GET /vessel-jobs/${job_id}"
              payload: {}
              as: DesignEngineer
              as_user_id: "${de1_id}"
              captures: { status_after: $.data.status, gje_after: $.data.governing_joint_efficiency, release_after: $.data.design_release_at }
            - call: "GET /design-calculations"
              payload: { job_id: "${job_id}", status: "APPROVED", limit: 10, offset: 0 }
              as: ShopAdmin
              captures: { first_approved_component: "$.data[0].component" }
          assert:
            - "Before the trigger the cascade had not fired: ${status_before} == DESIGN_REVIEW, ${gje_before} == 1.00 (SHELL alone) and ${release_before} == null"
            - "The approve response itself is already final: HTTP 200, ${head_status_in_response} == APPROVED and ${head_reviewer_in_response} == ${de2_id} in the very same response body, not on a later read"
            - "${status_after} == FAB_PLANNING: the DESIGN_REVIEW -> FAB_PLANNING cascade is visible on the first read after the write, with no delay and no retry"
            - "${release_after} is non-null and equals the logical UTC instant of the approve, while ${release_before} was null: the system field is stamped inside the same request"
            - "${gje_after} == 0.85: governing_joint_efficiency is re-derived as min(1.00 SHELL, 0.85 HEAD) immediately, so the read never observes the stale 1.00"
            - "Both sheets are visible as APPROVED in the same cycle: GET /design-calculations?job_id=${job_id}&status=APPROVED returns total_count == 2 and ${first_approved_component} is SHELL or HEAD, with no PENDING or lagging row"
            - "The derived percentages are consistent at once: VesselJob.${job_id}.weld_completion_pct == 0.00 and nonconformance_open_count == 0 on that same read, because no joints or nonconformances exist yet"
            - "No eventual-consistency escape hatch is observable: a second identical GET returns byte-identical values, so nothing settled between the two reads"
