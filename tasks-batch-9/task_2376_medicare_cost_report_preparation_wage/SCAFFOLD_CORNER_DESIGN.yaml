          difficulty_instance: transitive_cascade / stepdown_completion_cascades_through_ucc_to_settlement_flag
          rationale: "That §1.8 instance walks all four declared side-effect links of QUEUED -> COMPLETED (cost centers, cost report totals, UccDataSet recompute, Settlement.recompute_required) with literal asserts on each."

      - name: cost_report_two_state_dimensions_move_independently
        claim_type: parallel
        grounds:
          - entities.CostReport.fields.status
          - entities.CostReport.fields.wage_data_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / cost_report_status_and_wage_data_status_evolve_independently
          rationale: "The parallel-shape claim (status stays FILED while wage_data_status walks VERIFIED -> UNDER_REVIEW -> REVISION_REQUESTED -> COLLECTED) is that instance's whole subject."

      - name: wage_index_submission_can_loop_back_into_review
        claim_type: cyclic
        grounds:
          - state_machines.WageIndexSubmission.ACCEPTED_to_UNDER_REVIEW
          - entities.WageIndexSubmission.fields.revision_number
        excluded_because:
          difficulty_instance: non_linear_state_machine / wage_index_submission_reenters_review_after_acceptance
          rationale: "The cycle ACCEPTED -> UNDER_REVIEW -> CHANGE_REQUESTED -> SUBMITTED -> UNDER_REVIEW -> ACCEPTED and its revision_number increments are asserted there."

      - name: file_transition_is_guarded_by_the_wage_submission_state
        claim_type: guarded transitions
        grounds:
          - state_machines.CostReport.DRAFT_to_FILED
          - errors[ERR_WAGE_SUBMISSION_NOT_ACCEPTED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / cost_report_cannot_be_filed_until_wage_submission_is_accepted
          rationale: "That instance is exactly the guarded-transition claim: DRAFT -> FILED only when the report's WageIndexSubmission is ACCEPTED."

      - name: rotation_void_reverses_every_original_side_effect
        claim_type: Compensation
        grounds:
          - state_machines.RotationAssignment.ACTIVE_to_VOID
          - entities.Resident.fields.assigned_fte_days
          - entities.CostReport.fields.unweighted_fte_days_total
        excluded_because:
          difficulty_instance: compensating_invariant / rotation_void_conserves_resident_fte_days
          rationale: "The compensation pattern (create then void returns all three FTE-day figures to their pre-create values with no 0.0001 drift) is asserted there."

      - name: audit_adjustment_resolution_adjusts_the_cost_report_aggregate
        claim_type: Cross-entity
        grounds:
          - state_machines.AuditAdjustment.ACCEPTED_BY_PROVIDER_to_INCORPORATED
          - entities.CostCenter.fields.adjustment_amount_cents
          - entities.CostReport.fields.allocation_status
        excluded_because:
          difficulty_instance: transitive_cascade / audit_adjustment_incorporation_cascades_to_stale_allocation
          rationale: "The cross-entity side-effect chain from AuditAdjustment resolution into WorkpaperEntry, CostCenter, StepdownRun, CostReport and Settlement is asserted link by link there."

  # =================================================================
  # From Table 3 (Calculations)
  # =================================================================
  - section: calculations
    instances:
      - name: stepdown_allocation_distributes_general_service_cost_by_square_feet
        claim_type: Correct Result
        grounds:
          - calculations.stepdown_allocation
          - entities.CostCenter.fields.allocated_in_cents
          - entities.CostCenter.fields.allocated_total_cost_cents
          - entities.CostReport.fields.cost_to_charge_ratio
        distinguishing_aspect: "With one GENERAL_SERVICE center holding 100000000 and one ROUTINE receiver at 3000 SQUARE_FEET, the SINGLE_APPORTIONMENT run emits exactly one pass-1 allocation line of 100000000, leaves residual_unallocated_cents 0 and drives total_allowable_cost_cents to 300000000 with cost_to_charge_ratio 0.750000."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "Provider 450123 with a DRAFT CostReport FY 2025-07-01..2026-06-30, total_charges_cents 400000000"
            - "cost center 00100 (GENERAL_SERVICE, SQUARE_FEET, stepdown_order 1, own statistics { SQUARE_FEET: 0 }) with direct cost 100000000"
            - "cost center 03000 (ROUTINE, statistics { SQUARE_FEET: 3000 }) with direct cost 200000000"
            - "unmapped_tb_total_cents == 0 and allocation_status == NOT_RUN"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { ccn: "450123", name: "Mercy General Hospital", cbsa_code: "19100", teaching_status: "TEACHING", fte_cap: 2.00, current_interim_rate_cents: 900000 }
              as: SystemAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /cost-reports"
              payload: { provider_id: "${provider_id}", fiscal_year_begin: "2025-07-01", fiscal_year_end: "2026-06-30", apportionment_method: "SINGLE_APPORTIONMENT", medicare_utilization_ratio: 0.4000, interim_payments_received_cents: 20000000, total_charges_cents: 400000000, medicare_discharges: 500 }
              as: SystemAdmin
              captures: { report_id: $.data.id }
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "00100", name: "Administrative and General", center_type: "GENERAL_SERVICE", allocation_basis: "SQUARE_FEET", stepdown_order: 1, statistics: { SQUARE_FEET: 0 } }
              as: ReimbursementAnalyst
              captures: { cc_ag: $.data.id }
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "03000", name: "Adults and Pediatrics", center_type: "ROUTINE", statistics: { SQUARE_FEET: 3000 } }
              as: ReimbursementAnalyst
              captures: { cc_routine: $.data.id }
            - call: "POST /cost-reports/${report_id}/trial-balance-lines"
              payload: { gl_account: "6000", description: "Administration salaries", amount_cents: 100000000, mapped_cost_center_id: "${cc_ag}" }
              as: ReimbursementAnalyst
            - call: "POST /cost-reports/${report_id}/trial-balance-lines"
              payload: { gl_account: "6200", description: "Nursing salaries", amount_cents: 200000000, mapped_cost_center_id: "${cc_routine}" }
              as: ReimbursementAnalyst
            - call: "GET /cost-reports/${report_id}"
              payload: {}
              as: ReimbursementAnalyst
              captures: { report_version_1: $.data.version }
          trigger:
            - call: "POST /cost-reports/${report_id}/stepdown-runs"
              payload: { expected_cost_report_version: "${report_version_1}", method: "SINGLE_APPORTIONMENT" }
              as: ReimbursementAnalyst
              captures: { run_id: $.data.id }
          assert:
            - "StepdownRun.${run_id}.status == COMPLETED"
            - "StepdownRun.${run_id}.method == SINGLE_APPORTIONMENT"
            - "StepdownRun.${run_id}.allocation_lines has length 1"
            - "StepdownRun.${run_id}.allocation_lines[0] == { pass: 1, from_cost_center_id: ${cc_ag}, to_cost_center_id: ${cc_routine}, amount_cents: 100000000 }"
            - "StepdownRun.${run_id}.total_allocated_cents == 100000000"
            - "StepdownRun.${run_id}.residual_unallocated_cents == 0"
            - "StepdownRun.${run_id}.failure_reason == null"
            - "StepdownRun.${run_id}.stale_reason == null"
            - "CostCenter.${cc_ag}.allocated_in_cents == 0"
            - "CostCenter.${cc_ag}.allocated_out_cents == 100000000"
            - "CostCenter.${cc_ag}.allocated_total_cost_cents == 0"
            - "CostCenter.${cc_routine}.allocated_in_cents == 100000000"
            - "CostCenter.${cc_routine}.allocated_out_cents == 0"
            - "CostCenter.${cc_routine}.allocated_total_cost_cents == 300000000"
            - "CostReport.${report_id}.total_allowable_cost_cents == 300000000"
            - "CostReport.${report_id}.cost_to_charge_ratio == 0.750000"
            - "CostReport.${report_id}.allocation_status == CURRENT"

      - name: unmapped_trial_balance_lines_are_excluded_from_direct_cost
        claim_type: Input Set Filtering
        grounds:
          - calculations.trial_balance_mapping_rollup
          - entities.TrialBalanceLine.fields.status
          - entities.CostReport.fields.unmapped_tb_total_cents
          - endpoints[GET /cost-reports/{id}/trial-balance-lines]
        distinguishing_aspect: "A TrialBalanceLine created without mapped_cost_center_id lands in status UNMAPPED and contributes 200000000 to unmapped_tb_total_cents while contributing 0 to every CostCenter.direct_cost_cents and to total_direct_cost_cents."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "Provider 450123 with a DRAFT CostReport FY 2025-07-01..2026-06-30"
            - "cost centers 00100 (GENERAL_SERVICE) and 03000 (ROUTINE); one mapped ledger line of 100000000 on 00100"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { ccn: "450123", name: "Mercy General Hospital", cbsa_code: "19100", teaching_status: "TEACHING", fte_cap: 2.00, current_interim_rate_cents: 900000 }
              as: SystemAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /cost-reports"
              payload: { provider_id: "${provider_id}", fiscal_year_begin: "2025-07-01", fiscal_year_end: "2026-06-30", apportionment_method: "SINGLE_APPORTIONMENT", medicare_utilization_ratio: 0.4000, interim_payments_received_cents: 20000000, total_charges_cents: 400000000, medicare_discharges: 500 }
              as: SystemAdmin
              captures: { report_id: $.data.id }
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "00100", name: "Administrative and General", center_type: "GENERAL_SERVICE", allocation_basis: "SQUARE_FEET", stepdown_order: 1, statistics: { SQUARE_FEET: 0 } }
              as: ReimbursementAnalyst
              captures: { cc_ag: $.data.id }
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "03000", name: "Adults and Pediatrics", center_type: "ROUTINE", statistics: { SQUARE_FEET: 3000 } }
              as: ReimbursementAnalyst
              captures: { cc_routine: $.data.id }
            - call: "POST /cost-reports/${report_id}/trial-balance-lines"
              payload: { gl_account: "6000", description: "Administration salaries", amount_cents: 100000000, mapped_cost_center_id: "${cc_ag}" }
              as: ReimbursementAnalyst
          trigger:
            - call: "POST /cost-reports/${report_id}/trial-balance-lines"
              payload: { gl_account: "6200", description: "Nursing salaries awaiting mapping", amount_cents: 200000000 }
              as: ReimbursementAnalyst
              captures: { tb_unmapped: $.data.id }
          assert:
            - "TrialBalanceLine.${tb_unmapped}.status == UNMAPPED"
            - "TrialBalanceLine.${tb_unmapped}.mapped_cost_center_id == null"
            - "CostCenter.${cc_ag}.direct_cost_cents == 100000000"
            - "CostCenter.${cc_routine}.direct_cost_cents == 0"
            - "CostReport.${report_id}.total_direct_cost_cents == 100000000"
            - "CostReport.${report_id}.unmapped_tb_total_cents == 200000000"
            - "GET /cost-reports/${report_id}/trial-balance-lines with status UNMAPPED returns total_count == 1"
            - "GET /cost-centers/${cc_routine}/trial-balance-lines returns total_count == 0"

      - name: wage_related_costs_are_capped_at_twenty_five_percent_of_salaries
        claim_type: Constants Applied
        grounds:
          - calculations.average_hourly_wage
          - entities.WageIndexSubmission.fields.allowed_wage_related_costs_cents
          - entities.WageIndexSubmission.fields.unadjusted_ahw_cents
        distinguishing_aspect: "With total_salaries_cents 5000000000 the WAGE_RELATED_COST_CAP_PCT 0.25 cap is 1250000000, so a claimed 1500000000 is trimmed to 1250000000 and unadjusted_ahw_cents becomes exactly 3125 rather than the 3250 an uncapped numerator would give."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "Provider 450123 with a DRAFT CostReport FY 2025-07-01..2026-06-30"
            - "a DRAFT WageIndexSubmission with total_salaries_cents 5000000000, total_paid_hours 2000000.00 and wage_related_costs_cents 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { ccn: "450123", name: "Mercy General Hospital", cbsa_code: "19100", teaching_status: "TEACHING", fte_cap: 2.00, current_interim_rate_cents: 900000 }
              as: SystemAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /cost-reports"
              payload: { provider_id: "${provider_id}", fiscal_year_begin: "2025-07-01", fiscal_year_end: "2026-06-30", apportionment_method: "SINGLE_APPORTIONMENT", medicare_utilization_ratio: 0.4000, interim_payments_received_cents: 20000000, total_charges_cents: 400000000, medicare_discharges: 500 }
              as: SystemAdmin
              captures: { report_id: $.data.id }
            - call: "POST /cost-reports/${report_id}/wage-index-submissions"
              payload: { total_salaries_cents: 5000000000, total_paid_hours: 2000000.00 }
              as: ReimbursementAnalyst
              captures: { wis_id: $.data.id }
          trigger:
            - call: "PATCH /wage-index-submissions/${wis_id}"
              payload: { wage_related_costs_cents: 1500000000 }
              as: ReimbursementAnalyst
          assert:
            - "WageIndexSubmission.${wis_id}.wage_related_costs_cents == 1500000000"
            - "WageIndexSubmission.${wis_id}.allowed_wage_related_costs_cents == 1250000000"
            - "WageIndexSubmission.${wis_id}.unadjusted_ahw_cents == 3125"
            - "WageIndexSubmission.${wis_id}.effective_ahw_cents == 3125"
            - "WageIndexSubmission.${wis_id}.occ_mix_adjusted_ahw_cents == null"
            - "WageIndexSubmission.${wis_id}.status == DRAFT"

      - name: category_hourly_wage_rounds_half_up_to_whole_cents
        claim_type: Precision
        grounds:
          - calculations.average_hourly_wage
          - entities.OccMixResponse.fields.category_ahw_cents
          - entities.WageIndexSubmission.fields.occ_mix_category_count
        distinguishing_aspect: "reported_salaries_cents 15001 over reported_hours 2.00 is exactly 7500.5 cents per hour, and round_half_up stores 7501 (not 7500); with only one staffed category occ_mix_adjusted_ahw_cents stays null and effective_ahw_cents falls back to the unadjusted 2500."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
