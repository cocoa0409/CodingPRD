  # ===========================================================================
  # Rule 5 - Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: draw_state_error_precedes_lender_cap_error
        grounds:
          - validations[priority=90]
          - validations[priority=200]
          - errors[ERR_DRAW_NOT_IN_DRAFT]
          - errors[ERR_DRAW_EXCEEDS_LENDER_CAP]
          - calculations.draw_cumulative_cap
        distinguishing_aspect: |
          Category pair = state (priority 90, ERR_DRAW_NOT_IN_DRAFT) versus business_fiscal
          (priority 200, ERR_DRAW_EXCEEDS_LENDER_CAP): the resubmitted draw violates two rules at once: it is in
