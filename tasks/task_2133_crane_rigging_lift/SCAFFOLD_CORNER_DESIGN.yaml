              as: Dispatcher
              captures: { plan_draft: $.data.id }
            - call: "POST /lift-plans"
              payload: { site_id: "${site_id}", job_reference: "JOB-SURVEYED", window_start: "2026-09-20T06:00:00Z", window_end: "2026-09-20T16:00:00Z", load_weight_lb: 60000 }
              as: Dispatcher
              captures: { plan_surveyed: $.data.id }
