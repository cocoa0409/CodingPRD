      - name: syndication_job_cycle_returns_to_queued_as_a_second_attempt
        claim_type: cyclic
        grounds:
          - state_machines.SyndicationJob.REJECTED_to_QUEUED
          - entities.SyndicationJob.fields.attempt_no
        excluded_because:
          difficulty_instance: syndication_job_cycles_rejected_back_to_queued_as_attempt_two
          rationale: "That difficulty instance already walks the whole QUEUED -> TRANSMITTED -> REJECTED -> QUEUED cycle and asserts attempt_no 2, the re-frozen service fee and the re-reserved slots; a corner-case duplicate would assert the same transition with the same fixture."

      - name: change_request_fork_join_pins_on_the_second_approval
        claim_type: compound
        grounds:
          - state_machines.ChangeRequest.shape
          - state_machines.ChangeRequest.IN_REVIEW_to_APPROVED
        excluded_because:
          difficulty_instance: change_request_fork_join_self_loop_then_join_pin
          rationale: "The fork, the self-loop on the first approval and the join that pins the revision are the exact subject of that difficulty instance, including the pin and pin_count assertions."

      - name: superseded_revision_conditionally_invalidates_only_queued_jobs
        claim_type: conditional_cascade
        grounds:
          - state_machines.ContentVersion.PINNED_to_SUPERSEDED
          - state_machines.SyndicationJob.QUEUED_to_INVALIDATED
        excluded_because:
          difficulty_instance: cr_join_supersedes_version_invalidates_queued_job_and_releases_feed_slots
          rationale: "That instance drives the join cascade and asserts that the QUEUED job is invalidated while a TRANSMITTED job is not, which is the conditional branch of the cascade."

      - name: cancelling_a_queued_job_restores_the_slot_ledger
        claim_type: compensation
        grounds:
          - state_machines.SyndicationJob.QUEUED_to_CANCELLED
          - calculations.feed_slot_reservation_ledger
        excluded_because:
          difficulty_instance: feed_slot_ledger_returns_to_zero_after_cancel_and_frees_full_capacity
          rationale: "The queue-then-cancel compensating pair and the proof that full capacity is bookable again afterwards are asserted there."

      - name: observation_ingest_bubbles_up_to_the_product_rollup
        claim_type: bubble_up
        grounds:
          - state_machines.RetailerListing.shelf_OK_to_shelf_OOS_WATCH
          - calculations.alert_rollup
        excluded_because:
          difficulty_instance: observation_ingest_cascades_projection_then_alerts_then_product_rollup
          rationale: "The three-hop bubble from one observation to the listing projection, the alert row and the Product open_alert_count/governance_flag rollup is asserted hop by hop there."

      - name: deployment_initial_state_is_guarded_by_the_retailer_flag
        claim_type: guarded_transitions
        grounds:
          - state_machines.EnhancedContentDeployment.initial_state
          - entities.Retailer.fields.enhanced_content_requires_approval
        excluded_because:
          difficulty_instance: deployment_initial_state_reads_the_retailers_approval_flag
          rationale: "That instance runs the identical creation request against both flag settings and asserts PENDING_RETAILER_APPROVAL versus immediate LIVE, which is the whole content of the guard."

  # ===========================================================================
  # From Table 3 (Calculations)
  # ===========================================================================
  - section: calculations
    instances:
      - name: optional_requirement_rows_are_excluded_from_numerator_and_denominator
        claim_type: input_set_filtering
        grounds:
          - calculations.listing_completeness_score.formula
          - calculations.listing_completeness_score.input_set
          - endpoints["GET /digital-shelf/retailer-listings/{id}/completeness"]
        distinguishing_aspect: "An OPTIONAL requirement whose attribute IS populated must not raise the score: dropping it from both N and D gives declared 66.67, whereas counting it (D 115, N 85) would give 73.91 and counting it in D only would give 52.17."
        test_recipe:
          setup:
            - "the taxonomy holds title (max_chars 200, base_weight 40.00), description (max_chars 500, base_weight 30.00) and color (max_chars 60, base_weight 25.00)"
            - "Retailer FilterMart (min_image_count 1) requires title REQUIRED, description RECOMMENDED and color OPTIONAL, so D == 40 + 30 + IMAGE_WEIGHT 20 == 90 and the OPTIONAL 25.00 is excluded"
            - "product SKU-F-1 has one DRAFT revision with title and color populated, description absent and image_count 1, listed on FilterMart with nothing pinned and no approved asset"
          setup_api_calls:
            - call: "POST /digital-shelf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/attribute-definitions"
              payload: { attribute_key: "title", data_type: "STRING", taxonomy_group: "CORE", max_chars: 200, base_weight: 40.00, is_global_required: true }
              as: ShelfAdmin
            - call: "POST /digital-shelf/attribute-definitions"
              payload: { attribute_key: "description", data_type: "STRING", taxonomy_group: "MARKETING", max_chars: 500, base_weight: 30.00 }
              as: ShelfAdmin
            - call: "POST /digital-shelf/attribute-definitions"
              payload: { attribute_key: "color", data_type: "STRING", taxonomy_group: "CORE", max_chars: 60, base_weight: 25.00 }
              as: ShelfAdmin
            - call: "POST /digital-shelf/retailers"
              payload: { name: "FilterMart", retailer_code: "RETF", min_image_count: 1 }
              as: ShelfAdmin
              captures: { rf_id: $.data.id }
            - call: "POST /digital-shelf/retailers/${rf_id}/requirements"
              payload: { attribute_key: "title", requirement_level: "REQUIRED" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/retailers/${rf_id}/requirements"
              payload: { attribute_key: "description", requirement_level: "RECOMMENDED" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/retailers/${rf_id}/requirements"
              payload: { attribute_key: "color", requirement_level: "OPTIONAL", weight_override: 25.00 }
              as: ShelfAdmin
            - call: "POST /digital-shelf/products"
              payload: { sku: "SKU-F-1", gtin: "00012345679025", category_code: "SMALL_APPLIANCE", brand_code: "BRHM" }
              as: ContentAuthor
              captures: { pf_id: $.data.id }
            - call: "POST /digital-shelf/retailer-listings"
              payload: { product_id: "${pf_id}", retailer_id: "${rf_id}" }
              as: ContentAuthor
              captures: { lf_id: $.data.id }
            - call: "POST /digital-shelf/content-versions"
              payload: { product_id: "${pf_id}", image_count: 1 }
              as: ContentAuthor
              captures: { vf_id: $.data.id }
            - call: "POST /digital-shelf/content-versions/${vf_id}/attribute-values"
              payload: { attribute_key: "title", value: "Bright Kitchen Blender 900W" }
              as: ContentAuthor
            - call: "POST /digital-shelf/content-versions/${vf_id}/attribute-values"
              payload: { attribute_key: "color", value: "Slate Grey" }
              as: ContentAuthor
          trigger:
            - call: "GET /digital-shelf/retailer-listings/${lf_id}/completeness"
              payload: {}
              as: ContentAuthor
              captures: { f_decl: $.data.declared_score, f_cert: $.data.certified_score, f_wtot: $.data.requirement_weight_total, f_img: $.data.declared_image_component }
          assert:
            - "HTTP 200"
            - "${f_wtot} == 70.00   # title 40.00 + description 30.00; the OPTIONAL color weight is not counted"
            - "${f_img} == 20.00    # IMAGE_WEIGHT * min(1, image_count 1 / min_image_count 1)"
            - "${f_decl} == 66.67   # 100 * (40 + 0 + 20) / 90"
            - "${f_cert} == 0.00    # nothing pinned"
            - "RetailerListing.${lf_id}.completeness_score_declared == 66.67"

      - name: certified_variant_withholds_credit_when_the_retailer_ceiling_is_tighter
        claim_type: weighted_scoring
        grounds:
          - calculations.listing_completeness_score.formula
          - entities.RetailerRequirement.fields.max_chars_override
          - validations[priority=40]
        distinguishing_aspect: "A 51-character description is legal at write time (global max_chars 500) yet earns no CERTIFIED credit against a retailer max_chars_override of 40, so certified lands on 66.67 while declared, which never applies the override, stays at 100.00."
        test_recipe:
          setup:
            - "the taxonomy holds title (max_chars 200, base_weight 40.00) and description (max_chars 500, base_weight 30.00)"
            - "Retailer OverrideMart (min_image_count 1) requires title REQUIRED with no override and description REQUIRED with max_chars_override 40, so D == 70 + IMAGE_WEIGHT 20 == 90"
            - "product SKU-O-1 has revision 1 carrying title (27 characters) and description (51 characters) with image_count 1, one APPROVED HERO_IMAGE asset, and that revision is PINNED on the OverrideMart listing through an APPROVED ChangeRequest"
          setup_api_calls:
            - call: "POST /digital-shelf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/attribute-definitions"
              payload: { attribute_key: "title", data_type: "STRING", taxonomy_group: "CORE", max_chars: 200, base_weight: 40.00, is_global_required: true }
              as: ShelfAdmin
            - call: "POST /digital-shelf/attribute-definitions"
              payload: { attribute_key: "description", data_type: "STRING", taxonomy_group: "MARKETING", max_chars: 500, base_weight: 30.00 }
              as: ShelfAdmin
            - call: "POST /digital-shelf/retailers"
              payload: { name: "OverrideMart", retailer_code: "RETO", min_image_count: 1 }
              as: ShelfAdmin
              captures: { ro_id: $.data.id }
            - call: "POST /digital-shelf/retailers/${ro_id}/requirements"
              payload: { attribute_key: "title", requirement_level: "REQUIRED" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/retailers/${ro_id}/requirements"
              payload: { attribute_key: "description", requirement_level: "REQUIRED", max_chars_override: 40 }
