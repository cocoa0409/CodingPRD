# Scaffold Difficulty Design (§1.8) — Test Targeting Index
# Domain: electric-motor-manufacturing (task_2935_electric_motor_manufacturing)
#
# Every instance grounds in elements already declared in SCAFFOLD.yaml §1.1-§1.7.
# Deleting this file leaves the scaffold's declared behaviour identical.
#
# Shared fixture vocabulary used by the chains below (all literals, never invented
# at test time):
#   logical clock default ......... 2026-08-01T00:00:00.000Z (server startup default)
#   design D1 ..................... WM-132M-7K5-IE3: 4-pole, 7.5 kW, 400 V, target IE3,
#                                   M330_35A, stack 180 mm, copper 12.0 kg, LAP, class F,
#                                   bore 135.400, gap 0.450 +/- 0.050, DIE_CAST_ALUMINUM,
#                                   34 bars, shaft 38.000 k6, GREASE_REGREASABLE, S1, IP55, B3
#                                   -> total_predicted_loss_w 479.7, predicted 93.99 (IE4),
#                                      guaranteed 93.09 (IE3)
#   design D3 ..................... WM-132S-7K5-IE3B: as D1 but M400_50A, stack 160 mm
#                                   -> per_unit_direct_cost_cents 125000 (band-boundary fixture)
#   user ids ...................... u_eng_1 / u_eng_2 (DesignEngineer), u_rev_1 (DesignReviewer),
#                                   u_plan_1 (ProductionPlanner), u_tech_1 / u_tech_2
#                                   (BuildTechnician), u_test_1 / u_test_2 (TestEngineer),
#                                   u_cert_1 (QualityCertifier), u_comp_1 (ComplianceOfficer)

scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: design_estimate_vs_guaranteed_class_divergence_on_release_gate
        grounds:
          - calculations.design_predicted_efficiency
          - entities.MotorDesign.fields.design_estimate_class
          - entities.MotorDesign.fields.predicted_class
          - state_machines.MotorDesign.IN_REVIEW_to_RELEASED
          - validations[priority=68]
          - errors[ERR_DESIGN_CLASS_SHORTFALL]
        distinguishing_aspect: |
          The two variants of design_predicted_efficiency run on the MotorDesign entity domain and
          land on DIFFERENT IE classes for byte-identical inputs: design_estimate classifies
          93.99 as IE4 while guaranteed_declared classifies 93.09 as IE3, and only the
          guaranteed variant gates release — so a design with target_efficiency_class IE4 is
          rejected even though its design_estimate_class is IE4.
        test_recipe:
          setup:
            - "Empty DB; logical clock at the 2026-08-01T00:00:00.000Z startup default."
            - "Two MotorDesign rows with identical physical parameters (D1 fixture), one targeting IE3 and one targeting IE4, both IN_REVIEW, both created by u_eng_1."
          setup_api_calls:
            - call: "POST /motor-designs"
              payload: { model_code: "WM-132M-7K5-IE3", frame_size: "132M", poles: 4, rated_output_kw: 7.5, rated_voltage_v: 400, target_efficiency_class: "IE3", lamination_grade: "M330_35A", lamination_stack_length_mm: 180, winding_copper_kg: 12.0, winding_type: "LAP", insulation_class: "F", stator_bore_id_mm: 135.400, design_air_gap_mm: 0.450, air_gap_tolerance_mm: 0.050, rotor_construction: "DIE_CAST_ALUMINUM", rotor_bar_count: 34, shaft_diameter_mm: 38.000, shaft_tolerance_class: "k6", bearing_spec_de: "6208-2Z", bearing_spec_nde: "6206-2Z", lubrication_spec: "GREASE_REGREASABLE", duty_type: "S1", enclosure: "IP55", mounting: "B3" }
              as: DesignEngineer
              as_user_id: "u_eng_1"
              captures: { d1_id: $.data.id }
            - call: "POST /motor-designs/${d1_id}/submit-review"
              payload: {}
              as: DesignEngineer
              as_user_id: "u_eng_1"
            - call: "POST /motor-designs"
              payload: { model_code: "WM-132M-7K5-IE4X", frame_size: "132M", poles: 4, rated_output_kw: 7.5, rated_voltage_v: 400, target_efficiency_class: "IE4", lamination_grade: "M330_35A", lamination_stack_length_mm: 180, winding_copper_kg: 12.0, winding_type: "LAP", insulation_class: "F", stator_bore_id_mm: 135.400, design_air_gap_mm: 0.450, air_gap_tolerance_mm: 0.050, rotor_construction: "DIE_CAST_ALUMINUM", rotor_bar_count: 34, shaft_diameter_mm: 38.000, shaft_tolerance_class: "k6", bearing_spec_de: "6208-2Z", bearing_spec_nde: "6206-2Z", lubrication_spec: "GREASE_REGREASABLE", duty_type: "S1", enclosure: "IP55", mounting: "B3" }
              as: DesignEngineer
              as_user_id: "u_eng_1"
              captures: { d1x_id: $.data.id }
            - call: "POST /motor-designs/${d1x_id}/submit-review"
              payload: {}
              as: DesignEngineer
              as_user_id: "u_eng_1"
          trigger:
            - call: "POST /motor-designs/${d1_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: DesignReviewer
              as_user_id: "u_rev_1"
              captures: { d1_v: $.data.version }
            - call: "POST /motor-designs/${d1x_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: DesignReviewer
              as_user_id: "u_rev_1"
              captures: { shortfall_error: $.data.error_id }
          assert:
            - "MotorDesign.${d1_id}.total_predicted_loss_w == 479.7"
            - "MotorDesign.${d1_id}.predicted_efficiency_pct == 93.99"
            - "MotorDesign.${d1_id}.guaranteed_efficiency_pct == 93.09"
            - "MotorDesign.${d1_id}.design_estimate_class == IE4"
            - "MotorDesign.${d1_id}.predicted_class == IE3"
            - "MotorDesign.${d1_id}.status == RELEASED"
            - "MotorDesign.${d1x_id}.design_estimate_class == IE4 and MotorDesign.${d1x_id}.predicted_class == IE3 (identical inputs, identical two variant results)"
            - "second trigger call returns HTTP 422 with ${shortfall_error} == ERR_DESIGN_CLASS_SHORTFALL"
            - "MotorDesign.${d1x_id}.status == IN_REVIEW (unchanged) and MotorDesign.${d1x_id}.released_at == null"

      - name: warranty_field_data_vs_teardown_adjudication_flip
        grounds:
          - calculations.warranty_misuse_index
          - calculations.warranty_credit_waterfall
          - entities.WarrantyClaim.fields.misuse_index
          - entities.WarrantyClaim.fields.adjudication
          - state_machines.WarrantyClaim.SUBMITTED_to_MISUSE_DETERMINED
          - state_machines.WarrantyClaim.DEFECT_CONFIRMED_to_UNDER_ANALYSIS
        distinguishing_aspect: |
          The two variants of warranty_misuse_index run on the WarrantyClaim entity domain — a
          different entity domain from the MotorDesign instance above — and cross the
          MISUSE_THRESHOLD in opposite directions on the SAME claim: FIELD_DATA yields 0.6460
          (MISUSE_DETERMINED, zero credit) while TEARDOWN with 90.0 % defect evidence yields
          0.4367 (DEFECT_CONFIRMED, credit 149922 cents).
        test_recipe:
          setup:
            - "Work order WO1 on design D1 with unit_count 12 (standard_cost_cents 2351712, unit_standard_cost_cents 195976), shipped at 2026-08-05T09:30:00.000Z."
            - "Logical clock advanced to 2027-02-05T00:00:00.000Z so service_age_months == 6 and pro_rata_factor == 0.9."
            - "One SUBMITTED WarrantyClaim with measured_load_pct 128.0, measured_ambient_c 55.0, measured_voltage_unbalance_pct 2.8, measured_starts_per_hour 10, claimed parts/labor/freight 140000/60000/20000 cents."
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Nordwind Antriebe", tier: "GOLD", jurisdiction: "EU", stocking_program_enrolled: true, committed_annual_units: 500, stock_buffer_units: 10 }
              as: PlantAdmin
              captures: { dist_id: $.data.id }
            - call: "POST /curing-ovens"
              payload: { oven_code: "OVEN-A", max_temp_c: 180.0, cooldown_buffer_minutes: 45 }
              as: PlantAdmin
              captures: { oven_a_id: $.data.id }
            - call: "POST /test-cells"
              payload: { cell_code: "DYNO-1", max_concurrent_kw: 20.0 }
              as: PlantAdmin
              captures: { cell_1_id: $.data.id }
            - call: "POST /regulatory-standards"
              payload: { standard_code: "EU-2019-1781-IE3-4P", jurisdiction: "EU", efficiency_class: "IE3", poles: 4, rated_output_kw_min: 5.5, rated_output_kw_max: 11.0, minimum_efficiency_pct: 89.60, effective_from: "2021-07-01" }
              as: PlantAdmin
              captures: { std_eu_ie3_id: $.data.id }
            - call: "POST /motor-designs"
              payload: { model_code: "WM-132M-7K5-IE3", frame_size: "132M", poles: 4, rated_output_kw: 7.5, rated_voltage_v: 400, target_efficiency_class: "IE3", lamination_grade: "M330_35A", lamination_stack_length_mm: 180, winding_copper_kg: 12.0, winding_type: "LAP", insulation_class: "F", stator_bore_id_mm: 135.400, design_air_gap_mm: 0.450, air_gap_tolerance_mm: 0.050, rotor_construction: "DIE_CAST_ALUMINUM", rotor_bar_count: 34, shaft_diameter_mm: 38.000, shaft_tolerance_class: "k6", bearing_spec_de: "6208-2Z", bearing_spec_nde: "6206-2Z", lubrication_spec: "GREASE_REGREASABLE", duty_type: "S1", enclosure: "IP55", mounting: "B3" }
              as: DesignEngineer
              as_user_id: "u_eng_1"
              captures: { d1_id: $.data.id }
            - call: "POST /motor-designs/${d1_id}/submit-review"
              payload: {}
              as: DesignEngineer
              as_user_id: "u_eng_1"
            - call: "POST /motor-designs/${d1_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: DesignReviewer
              as_user_id: "u_rev_1"
              captures: { d1_v: $.data.version }
            - call: "POST /customer-orders"
              payload: { distributor_id: "${dist_id}", design_id: "${d1_id}", order_type: "MADE_TO_ORDER", quantity: 12, requested_ship_date: "2026-12-01", jurisdiction: "EU" }
              as: ProductionPlanner
              as_user_id: "u_plan_1"
              captures: { o1_id: $.data.id }
            - call: "POST /customer-orders/${o1_id}/confirm"
              payload: {}
              as: ProductionPlanner
              as_user_id: "u_plan_1"
            - call: "POST /work-orders"
              payload: { order_id: "${o1_id}", design_id: "${d1_id}", unit_count: 12, expected_design_version: "${d1_v}" }
              as: ProductionPlanner
              as_user_id: "u_plan_1"
              captures: { wo1_id: $.data.id }
            - call: "POST /stator-builds"
              payload: { work_order_id: "${wo1_id}", insulation_system: "CLASS_F_POLYESTERIMIDE", slot_fill_pct: 82.00 }
              as: BuildTechnician
              as_user_id: "u_tech_1"
              captures: { sb1_id: $.data.id }
            - call: "POST /stator-builds/${sb1_id}/impregnate"
              payload: { oven_id: "${oven_a_id}", impregnation_window_start: "2026-08-03T08:00:00.000Z", impregnation_window_end: "2026-08-03T12:00:00.000Z", varnish_process: "VPI", varnish_cycles: 2, cure_temp_c: 165.0 }
              as: BuildTechnician
              as_user_id: "u_tech_1"
            - call: "POST /stator-builds/${sb1_id}/surge-test"
              payload: { surge_test_kv: 2.40 }
              as: TestEngineer
              as_user_id: "u_test_1"
            - call: "POST /stator-builds/${sb1_id}/disposition"
              payload: { disposition: "ACCEPTED" }
              as: TestEngineer
              as_user_id: "u_test_1"
            - call: "POST /rotor-builds"
              payload: { work_order_id: "${wo1_id}" }
              as: BuildTechnician
              as_user_id: "u_tech_1"
              captures: { rb1_id: $.data.id }
            - call: "POST /rotor-builds/${rb1_id}/form-cage"
              payload: { cage_method: "DIE_CAST", melt_temp_c: 700.0, die_preheat_c: 260.0 }
              as: BuildTechnician
              as_user_id: "u_tech_1"
            - call: "POST /rotor-builds/${rb1_id}/machine"
              payload: { measured_rotor_od_mm: 134.500, rotor_mass_kg: 18.6 }
              as: BuildTechnician
              as_user_id: "u_tech_1"
            - call: "POST /rotor-builds/${rb1_id}/balance-disposition"
              payload: { disposition: "ACCEPTED", balance_grade: "G2_5", initial_unbalance_g_mm: 820.0, residual_unbalance_g_mm: 240.0 }
              as: TestEngineer
              as_user_id: "u_test_1"
            - call: "POST /assembly-records"
              payload: { work_order_id: "${wo1_id}", stator_build_id: "${sb1_id}", rotor_build_id: "${rb1_id}", de_bearing_lot: "DE-2026-0455", nde_bearing_lot: "NDE-2026-0912", bearing_install_method: "INDUCTION_HEAT", shaft_measured_diameter_mm: 38.010, grease_fill_pct: 50.00 }
              as: BuildTechnician
              as_user_id: "u_tech_1"
            - call: "GET /work-orders/${wo1_id}"
              payload: {}
              as: ProductionPlanner
              as_user_id: "u_plan_1"
              captures: { wo1_v: $.data.version }
            - call: "POST /performance-tests"
              payload: { work_order_id: "${wo1_id}", test_cell_id: "${cell_1_id}", window_start: "2026-08-05T09:00:00.000Z", window_end: "2026-08-05T11:00:00.000Z", dyno_draw_kw: 12.0, test_method: "IEC_60034_2_1_SUMMATION", expected_work_order_version: "${wo1_v}" }
              as: TestEngineer
              as_user_id: "u_test_1"
              captures: { pt1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:30:00.000Z" }
              as: PlantAdmin
            - call: "POST /performance-tests/${pt1_id}/record"
              payload: { input_power_kw: 8.02, output_power_kw: 7.50, stator_loss_w: 210.0, rotor_loss_w: 95.0, core_loss_w: 128.0, friction_windage_w: 44.0, ambient_temp_c: 40.0 }
              as: TestEngineer
              as_user_id: "u_test_1"
            - call: "POST /nameplates"
              payload: { work_order_id: "${wo1_id}", performance_test_id: "${pt1_id}", jurisdiction: "EU" }
              as: QualityCertifier
              as_user_id: "u_cert_1"
              captures: { np1_id: $.data.id }
            - call: "POST /work-orders/${wo1_id}/ship"
              payload: {}
              as: ProductionPlanner
              as_user_id: "u_plan_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-05T00:00:00.000Z" }
              as: PlantAdmin
            - call: "POST /warranty-claims"
              payload: { work_order_id: "${wo1_id}", distributor_id: "${dist_id}", failure_mode: "WINDING_SHORT", operating_hours: 4200, measured_load_pct: 128.0, measured_ambient_c: 55.0, measured_voltage_unbalance_pct: 2.8, measured_starts_per_hour: 10, claimed_parts_cents: 140000, claimed_labor_cents: 60000, claimed_freight_cents: 20000 }
              as: ComplianceOfficer
              as_user_id: "u_comp_1"
              captures: { wc1_id: $.data.id }
          trigger:
            - call: "POST /warranty-claims/${wc1_id}/analyze"
              payload: { analysis_basis: "FIELD_DATA" }
              as: ComplianceOfficer
              as_user_id: "u_comp_1"
            - call: "POST /warranty-claims/${wc1_id}/dispute"
              payload: { dispute_reason: "Teardown ordered; field telemetry disputed." }
              as: Distributor
              as_user_id: "${dist_id}"
            - call: "POST /warranty-claims/${wc1_id}/analyze"
              payload: { analysis_basis: "TEARDOWN", teardown_defect_evidence_pct: 90.0 }
              as: ComplianceOfficer
              as_user_id: "u_comp_1"
          assert:
            - "after trigger 1: WarrantyClaim.${wc1_id}.misuse_index == 0.6460"
            - "after trigger 1: WarrantyClaim.${wc1_id}.adjudication == MISUSE_DETERMINED and status == MISUSE_DETERMINED"
            - "after trigger 1: WarrantyClaim.${wc1_id}.warranty_credit_cents == 0 and credit_posted == false"
            - "after trigger 2: WarrantyClaim.${wc1_id}.status == UNDER_ANALYSIS, dispute_round == 1, misuse_index == null, adjudication == null"
            - "after trigger 3: WarrantyClaim.${wc1_id}.misuse_index == 0.4367 (same four measured inputs, TEARDOWN variant)"
            - "after trigger 3: WarrantyClaim.${wc1_id}.adjudication == DEFECT_CONFIRMED and status == DEFECT_CONFIRMED"
            - "after trigger 3: WarrantyClaim.${wc1_id}.claim_unit_standard_cost_cents == 195976"
            - "after trigger 3: WarrantyClaim.${wc1_id}.warranty_credit_cents == 149922 and credit_posted == true"
            - "after trigger 3: Distributor.${dist_id}.warranty_credit_balance_cents == 149922"

      - name: test_summation_vs_direct_efficiency_divergence_at_40c
