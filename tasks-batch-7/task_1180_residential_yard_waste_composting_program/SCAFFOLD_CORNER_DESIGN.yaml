            - { call: "POST /facility-deliveries", payload: { facility_id: "${fac}", route_id: "${route_a}", delivery_date: "2026-06-16", window_start: "2026-06-16T09:00:00Z", window_end: "2026-06-16T10:00:00Z" }, as: RouteSupervisor, as_user_id: "sup_1", captures: { del2: $.data.id } }
