      - name: a_rescinded_assessment_rejects_a_new_payment_schedule_generation
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.LiabilityAssessment.transitions.ISSUED_to_RESCINDED"
          - "validations[priority=8]"
          - "errors[ERR_ASSESSMENT_RESCINDED]"
        distinguishing_aspect: |
          RESCINDED and DRAFT are both 'not ISSUED', but they must be distinguishable:
          a DRAFT can still be issued while a RESCINDED row is dead forever. The probe
          also proves the lifecycle guard at priority 8 runs before the priority-10 check
          that there is a conceded amount behind the declared source - the vacating award
          is not a REDUCE, so a server with the priorities inverted answers
          ERR_NO_REDUCTION_TO_APPLY.
        test_recipe:
          setup:
            - "The baseline assessment issued, reviewed, denied, arbitrated and VACATED, so lifecycle_status is RESCINDED."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Ironworkers District Pension Fund", industry: "GENERAL", allocation_method: "MODIFIED_PRESUMPTIVE", de_minimis_variant: "STATUTORY", interest_rate_bps: 700, mass_withdrawal_declared: false }
              as: FundAdministrator
              as_user_id: "fa-001"
