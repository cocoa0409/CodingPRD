          - state_machines.PayoutAward.CLAWED_BACK_to_VESTED
          - state_machines.RestatementEvent.RECOVERY_ORDERED_to_CLOSED
          - calculations.clawback_recoverable_amount
          - entities.RestatementEvent.fields.recovered_total_usd
        distinguishing_aspect: |
          The conserved quantity spans three entities rather than one row's fields:
          PayoutAward.realized_value_usd + RestatementEvent.recovered_total_usd is 2,340,000.00 before recovery,
          during recovery and after reversal. The reversal must also un-bubble the parent, walking
          RestatementEvent from the terminal-looking CLOSED back to RECOVERY_ORDERED, which is the opposite
          direction from every other transition in the scaffold. Unlike the mix round trip, the intermediate state
          here is a state-machine terminal reached by bubble-up, not a recomputed number.
        test_recipe:
          setup:
            - "The clawback fixture: MINI peer group APPROVED, PayProgram P1 COMMITTEE_APPROVED with ADJ_EPS (weight 60.00, 4/5/6 LINEAR) and COST_RATIO (weight 40.00, 0.70/0.65/0.60 STEP) both CERTIFIED at 5.50 and 0.63, giving certified_factor_pct 130.00."
            - "One ANNUAL_INCENTIVE award VESTED on settlement_date 2026-09-30T00:00:00Z with earned_amount_usd 2,340,000.00 and realized_value_usd 2,340,000.00."
            - "RestatementEvent E1 with lookback [2026-01-01T00:00:00Z, 2026-12-31T23:59:59Z] analyzed against a restated ADJ_EPS of 5.00, which restates M1's factor to 100.00, the award's factor to 100.00 and the restated amount to 1,800,000.00, so recoverable_amount_usd is 540,000.00."
            - "The event is RECOVERY_ORDERED, the sole determination is NOTICED and acknowledged by the CEO, and recovery has been executed, so the determination is RECOVERED and the event has bubbled up to CLOSED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CompConsultant
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Acme Industries Inc", ticker: "ACME", is_issuer: true, gics_sector: "TECH", revenue_usd: 10000000000, market_cap_usd: 20000000000, share_price_usd: 50.00, ceo_tdc_usd: 15000000 }
              as: CompConsultant
              captures: { acme_id: $.data.id }
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Bravo Corp", ticker: "BRVO", is_issuer: false, gics_sector: "TECH", revenue_usd: 8000000000, market_cap_usd: 16000000000, share_price_usd: 40.00, ceo_tdc_usd: 12000000 }
              as: CompConsultant
              captures: { bravo_id: $.data.id }
            - call: "POST /exec-comp/companies/${acme_id}/executives"
              payload: { full_name: "Dana Reyes", role_title: "CEO", is_neo: true, base_salary_usd: 1200000, sti_target_pct: 150.00 }
              as: CompConsultant
              captures: { ceo_id: $.data.id }
            - call: "POST /exec-comp/peer-groups"
              payload: { issuer_company_id: "${acme_id}", fiscal_year: 2026, benchmark_basis: "RAW_MEDIAN" }
              as: CompConsultant
              captures: { pg_id: $.data.id, pg_v0: $.data.version }
            - call: "POST /exec-comp/peer-groups/${pg_id}/members"
              payload: { peer_company_id: "${bravo_id}", inclusion_reason: "SIZE_MATCH", expected_peer_group_version: "${pg_v0}" }
              as: CompConsultant
            - call: "POST /exec-comp/peer-groups/${pg_id}/screen"
              payload: {}
              as: CompConsultant
            - call: "POST /exec-comp/peer-groups/${pg_id}/approve"
              payload: {}
              as: CompCommitteeChair
              as_user_id: "chair-001"
            - call: "POST /exec-comp/pay-programs"
              payload: { issuer_company_id: "${acme_id}", peer_group_id: "${pg_id}", ceo_executive_id: "${ceo_id}", fiscal_year: 2026, salary_pct: 15.00, sti_pct: 25.00, lti_pct: 60.00, lti_performance_share_pct: 60.00, sti_max_multiple: 2.0, tsr_percentile_rank: 30.00, meeting_date: "2027-05-12T00:00:00Z" }
              as: CompConsultant
              captures: { pp_id: $.data.id }
            - call: "POST /exec-comp/pay-programs/${pp_id}/incentive-metrics"
              payload: { metric_code: "ADJ_EPS", vehicle: "ANNUAL_INCENTIVE", direction: "HIGHER_IS_BETTER", weight_pct: 60.00, threshold_value: 4.00, target_value: 5.00, maximum_value: 6.00, threshold_payout_pct: 50.00, target_payout_pct: 100.00, maximum_payout_pct: 200.00, interpolation: "LINEAR" }
              as: CompConsultant
              captures: { m1_id: $.data.id }
            - call: "POST /exec-comp/pay-programs/${pp_id}/incentive-metrics"
              payload: { metric_code: "COST_RATIO", vehicle: "ANNUAL_INCENTIVE", direction: "LOWER_IS_BETTER", weight_pct: 40.00, threshold_value: 0.70, target_value: 0.65, maximum_value: 0.60, threshold_payout_pct: 50.00, target_payout_pct: 100.00, maximum_payout_pct: 200.00, interpolation: "STEP" }
              as: CompConsultant
              captures: { m2_id: $.data.id }
            - call: "POST /exec-comp/pay-programs/${pp_id}/approve"
              payload: {}
              as: CompCommitteeChair
              as_user_id: "chair-001"
            - call: "POST /exec-comp/pay-programs/${pp_id}/payout-awards"
              payload: { executive_id: "${ceo_id}", vehicle: "ANNUAL_INCENTIVE" }
              as: CompConsultant
              captures: { ai_award_id: $.data.id }
            - call: "POST /exec-comp/incentive-metrics/${m1_id}/results"
              payload: { as_reported_value: 5.50 }
              as: CompConsultant
            - call: "POST /exec-comp/incentive-metrics/${m2_id}/results"
              payload: { as_reported_value: 0.63 }
              as: CompConsultant
            - call: "POST /exec-comp/incentive-metrics/${m1_id}/certify-result"
              payload: {}
              as: CompCommitteeChair
              as_user_id: "chair-001"
            - call: "POST /exec-comp/incentive-metrics/${m2_id}/certify-result"
              payload: {}
              as: CompCommitteeChair
              as_user_id: "chair-001"
            - call: "POST /exec-comp/payout-awards/${ai_award_id}/settlement"
              payload: { disposition: "VEST", settlement_date: "2026-09-30T00:00:00Z" }
              as: CompConsultant
            - call: "POST /exec-comp/companies/${acme_id}/restatement-events"
              payload: { restatement_date: "2027-03-01T00:00:00Z", lookback_start: "2026-01-01T00:00:00Z", lookback_end: "2026-12-31T23:59:59Z", accounting_reason: "Revenue recognition error overstating adjusted EPS." }
              as: SecuritiesCounsel
              as_user_id: "counsel-001"
              captures: { rev_id: $.data.id }
            - call: "POST /exec-comp/restatement-events/${rev_id}/analyze"
              payload: { restated_metric_results: [ { incentive_metric_id: "${m1_id}", restated_achieved_value: 5.00 } ] }
              as: SecuritiesCounsel
              as_user_id: "counsel-001"
            - call: "GET /exec-comp/clawback-determinations"
              as: SecuritiesCounsel
              as_user_id: "counsel-001"
              captures: { det_id: "$.data[0].id" }
            - call: "POST /exec-comp/restatement-events/${rev_id}/order-recovery"
              payload: {}
              as: CompCommitteeChair
              as_user_id: "chair-001"
            - call: "POST /exec-comp/clawback-determinations/${det_id}/acknowledge"
              payload: {}
              as: NamedExecutiveOfficer
              as_user_id: "${ceo_id}"
            - call: "POST /exec-comp/clawback-determinations/${det_id}/recover"
              payload: {}
              as: CompCommitteeChair
              as_user_id: "chair-001"
          trigger:
            - call: "POST /exec-comp/clawback-determinations/${det_id}/reverse-recovery"
              payload: { reversal_reason: "The restatement was withdrawn after the auditor accepted the original revenue treatment." }
              as: CompCommitteeChair
              as_user_id: "chair-001"
          assert:
            - "invariant before recovery: PayoutAward.${ai_award_id}.realized_value_usd 2340000.00 + RestatementEvent.${rev_id}.recovered_total_usd 0.00 == 2340000.00"
            - "invariant during recovery: realized_value_usd 1800000.00 + recovered_total_usd 540000.00 == 2340000.00, with the award CLAWED_BACK, the determination RECOVERED and the event bubbled up to CLOSED"
            - "after the trigger: ClawbackDetermination.${det_id}.status == NOTICED with recovered_at null, while acknowledged_at and acknowledged_by_user_id are preserved"
            - "after the trigger: PayoutAward.${ai_award_id}.status == VESTED and realized_value_usd == 2340000.00 exactly, and realizable_value_usd == 2340000.00"
            - "after the trigger: RestatementEvent.${rev_id}.recovered_total_usd == 0.00 and status == RECOVERY_ORDERED — the un-bubble moved the parent out of CLOSED"
            - "after the trigger: RestatementEvent.${rev_id}.recoverable_total_usd is still 540000.00 and determination_count is still 1 — the reversal undoes the recovery, not the analysis"
            - "after the trigger: PayProgram.${pp_id}.realized_pay_total_usd == 2340000.00 and realizable_pay_total_usd == 2340000.00"
            - "IncentiveMetric.${m1_id}.status is still RESTATED with original_payout_factor_pct 150.00 and restated_payout_factor_pct 100.00 — reversing a recovery does not un-restate a metric"
            - "recovery can be executed a second time from NOTICED, and the invariant sum is 2340000.00 again afterwards"
