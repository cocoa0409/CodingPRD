          - state_machines.Ingredient.transitions.DRAFT_to_UNDER_REVIEW.preconditions
        distinguishing_aspect: |
          The supplier gate is checked on the INGREDIENT's own supplier at submission time, so
          a DRAFT ingredient in a perfectly legal state cannot enter review while its source is
