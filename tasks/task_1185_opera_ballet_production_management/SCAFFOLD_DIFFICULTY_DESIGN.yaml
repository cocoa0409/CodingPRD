# =============================================================================
# Task 1185: Opera & Ballet Production Management — §1.8 Scaffold Difficulty Design
# Test Targeting Index: 9 Difficulty Rules x >=2 instances, cross-referenced to
# SCAFFOLD.yaml §1.1–§1.7.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc: two dual-variant calculations on DIFFERENT
  # entity domains (CoProductionShare fiscal settlement vs Contract payroll)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: copro_settlement_gross_vs_net
        grounds:
          - calculations.coproduction_settlement_cents
          - entities.CoProductionShare.fields.cost_split_method
          - entities.CoProductionShare.fields.settlement_cents
        distinguishing_aspect: |
          Same production build data (total build 25,000,000 cents) and same season revenue
          (100,000 cents): the GROSS_COST share settles at 10,000,000 while the NET_REVENUE_SHARE
          share settles at 9,960,000 — variant selection is driven by CoProductionShare.cost_split_method
          in the fiscal-settlement entity domain.
        test_recipe:
          setup:
            - "Production with build budget 100,000,000 in REHEARSAL; two DELIVERED build items with actual costs 20,000,000 and 5,000,000 (total build 25,000,000)"
            - "Two RATIFIED 40% co-production shares: GrossCo (GROSS_COST) and NetCo (NET_REVENUE_SHARE)"
            - "One ON_SALE performance (STALLS 100 seats @ 20,000) with 5 seats purchased -> season_revenue 100,000; NetCo accrued 40,000"
          setup_api_calls:
            - call: "POST /opera/partner-companies"
              payload: { name: "GrossCo", partner_kind: "CO_PRODUCER" }
              as: PlatformAdmin
              captures: { co_g: $.data.id }
            - call: "POST /opera/partner-companies"
              payload: { name: "NetCo", partner_kind: "CO_PRODUCER" }
              as: PlatformAdmin
              captures: { co_n: $.data.id }
            - call: "POST /opera/productions"
              payload: { title: "Swan Lake", work_type: "BALLET", build_budget_cents: 100000000, default_surtitle_language: "en" }
              as: ProductionManager
              captures: { prod: $.data.id }
            - call: "POST /opera/build-items"
              payload: { production_id: "${prod}", item_kind: "SET", name: "Palace flat", quoted_cost_cents: 18000000 }
              as: ProductionManager
              captures: { bi1: $.data.id }
            - call: "POST /opera/build-items/${bi1}/transition"
              payload: { to_state: "BUILT", actual_cost_cents: 20000000 }
              as: ProductionManager
            - call: "POST /opera/build-items/${bi1}/transition"
              payload: { to_state: "DELIVERED" }
              as: ProductionManager
            - call: "POST /opera/build-items"
              payload: { production_id: "${prod}", item_kind: "COSTUME", name: "Tutus", quoted_cost_cents: 5000000 }
              as: ProductionManager
              captures: { bi2: $.data.id }
            - call: "POST /opera/build-items/${bi2}/transition"
              payload: { to_state: "BUILT", actual_cost_cents: 5000000 }
              as: ProductionManager
            - call: "POST /opera/build-items/${bi2}/transition"
              payload: { to_state: "DELIVERED" }
              as: ProductionManager
            - call: "POST /opera/co-production-shares"
              payload: { production_id: "${prod}", company_id: "${co_g}", share_percentage: 40, cost_split_method: "GROSS_COST" }
              as: ProductionManager
              captures: { sh_g: $.data.id }
            - call: "POST /opera/co-production-shares"
              payload: { production_id: "${prod}", company_id: "${co_n}", share_percentage: 40, cost_split_method: "NET_REVENUE_SHARE" }
              as: ProductionManager
              captures: { sh_n: $.data.id }
            - call: "POST /opera/co-production-shares/${sh_g}/transition"
              payload: { to_state: "RATIFIED" }
              as: ProductionManager
            - call: "POST /opera/co-production-shares/${sh_n}/transition"
              payload: { to_state: "RATIFIED" }
              as: ProductionManager
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "BUILD" }
              as: ProductionManager
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "REHEARSAL" }
              as: ProductionManager
            - call: "POST /opera/performances"
              payload: { production_id: "${prod}", starts_at: "2026-06-20T19:00:00Z", ends_at: "2026-06-20T22:00:00Z", sections: [ { section: "STALLS", total_seats: 100, base_price_cents: 20000 } ] }
              as: BoxOfficeManager
              captures: { perf: $.data.id }
            - call: "POST /opera/performances/${perf}/open-sales"
              payload: {}
              as: BoxOfficeManager
            - call: "GET /opera/performances/${perf}/seat-inventories"
              payload: {}
              as: Any
              captures: { inv1: "$.data[0].id" }
            - call: "POST /opera/seat-inventories/${inv1}/purchase"
              payload: { quantity: 5 }
              as: BoxOfficeManager
          trigger:
            - call: "POST /opera/co-production-shares/${sh_g}/transition"
              payload: { to_state: "SETTLED" }
              as: ProductionManager
            - call: "POST /opera/co-production-shares/${sh_n}/transition"
              payload: { to_state: "SETTLED" }
              as: ProductionManager
            - call: "GET /opera/co-production-shares/${sh_g}"
              payload: {}
              as: Any
              captures: { settle_g: $.data.settlement_cents }
            - call: "GET /opera/co-production-shares/${sh_n}"
              payload: {}
              as: Any
              captures: { settle_n: $.data.settlement_cents, accrued_n: $.data.accrued_revenue_share_cents }
          assert:
            - "CoProductionShare.${sh_g}.settlement_cents == 10000000  (round_half_up(0.40 * 25000000))"
            - "CoProductionShare.${sh_n}.settlement_cents == 9960000   (10000000 - round_half_up(0.40 * 100000))"
            - "CoProductionShare.${sh_n}.accrued_revenue_share_cents == 40000"
            - "settle_g != settle_n — identical production data, different variants"

      - name: artist_pay_projected_vs_final
        grounds:
          - calculations.artist_weekly_pay_cents
          - entities.Contract.fields.weekly_hours_cap
          - state_machines.RehearsalCall.PUBLISHED_to_COMPLETED
        distinguishing_aspect: |
          Same week (39 completed hours + 4 published hours): PROJECTED (includes PUBLISHED) pays
          409,500 cents over 43 hours while FINAL (COMPLETED only) pays 349,500 cents over 39 hours —
          variant divergence in the Contract payroll domain, a different entity domain than
          copro_settlement_gross_vs_net.
        test_recipe:
          setup:
            - "Production in REHEARSAL; room Studio 1; contract ACTIVE (hourly 8,000 cents, weekly cap 30h, rest floor 12h)"
            - "Week 2026-06-01: call A Mon 08:00-20:00 (12h) COMPLETED, call B Tue 08:00-20:00 (12h) COMPLETED, call C Wed 08:00-23:00 (15h, night premium) COMPLETED, call D Thu 11:00-15:00 (4h) PUBLISHED"
            - "The contract is a CONFIRMED participant on all four calls; consecutive gaps are exactly 12h so the rest floor passes"
          setup_api_calls:
            - call: "POST /opera/productions"
              payload: { title: "Giselle", work_type: "BALLET", build_budget_cents: 50000000, default_surtitle_language: "en" }
              as: ProductionManager
              captures: { prod: $.data.id }
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "BUILD" }
              as: ProductionManager
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "REHEARSAL" }
              as: ProductionManager
            - call: "POST /opera/rehearsal-rooms"
              payload: { name: "Studio 1", kind: "STUDIO", capacity: 40, hourly_rate_cents: 5000 }
              as: TechnicalDirector
              captures: { room: $.data.id }
            - call: "POST /opera/artists"
              payload: { full_name: "Anna Principal", discipline: "PRINCIPAL_DANCER", union_code: "AGMA" }
              as: ContractsOfficer
              captures: { artist: $.data.id }
            - call: "POST /opera/contracts"
              payload: { production_id: "${prod}", artist_id: "${artist}", engagement_type: "PRINCIPAL", hourly_rate_cents: 8000, weekly_hours_cap: 30 }
              as: ContractsOfficer
              captures: { ctr: $.data.id }
            - call: "POST /opera/contracts/${ctr}/transition"
              payload: { to_state: "OFFERED" }
              as: ContractsOfficer
            - call: "POST /opera/contracts/${ctr}/transition"
              payload: { to_state: "SIGNED" }
              as: ContractsOfficer
            - call: "POST /opera/contracts/${ctr}/transition"
              payload: { to_state: "ACTIVE" }
              as: ContractsOfficer
            - call: "POST /opera/rehearsal-calls"
              payload: { production_id: "${prod}", room_id: "${room}", call_type: "DANCE_CALL", starts_at: "2026-06-01T08:00:00Z", ends_at: "2026-06-01T20:00:00Z" }
              as: TechnicalDirector
              captures: { call_a: $.data.id }
            - call: "POST /opera/rehearsal-calls/${call_a}/transition"
              payload: { to_state: "PUBLISHED" }
              as: TechnicalDirector
            - call: "POST /opera/call-participants"
              payload: { call_id: "${call_a}", contract_id: "${ctr}" }
              as: ContractsOfficer
              captures: { pa_a: $.data.id }
            - call: "POST /opera/call-participants/${pa_a}/transition"
              payload: { to_state: "CONFIRMED" }
              as: ContractsOfficer
            - call: "POST /opera/rehearsal-calls/${call_a}/transition"
              payload: { to_state: "COMPLETED" }
              as: TechnicalDirector
            - call: "POST /opera/rehearsal-calls"
              payload: { production_id: "${prod}", room_id: "${room}", call_type: "DANCE_CALL", starts_at: "2026-06-02T08:00:00Z", ends_at: "2026-06-02T20:00:00Z" }
              as: TechnicalDirector
              captures: { call_b: $.data.id }
            - call: "POST /opera/rehearsal-calls/${call_b}/transition"
              payload: { to_state: "PUBLISHED" }
              as: TechnicalDirector
            - call: "POST /opera/call-participants"
              payload: { call_id: "${call_b}", contract_id: "${ctr}" }
              as: ContractsOfficer
              captures: { pa_b: $.data.id }
            - call: "POST /opera/call-participants/${pa_b}/transition"
              payload: { to_state: "CONFIRMED" }
              as: ContractsOfficer
            - call: "POST /opera/rehearsal-calls/${call_b}/transition"
              payload: { to_state: "COMPLETED" }
              as: TechnicalDirector
            - call: "POST /opera/rehearsal-calls"
              payload: { production_id: "${prod}", room_id: "${room}", call_type: "DRESS", starts_at: "2026-06-03T08:00:00Z", ends_at: "2026-06-03T23:00:00Z" }
              as: TechnicalDirector
              captures: { call_c: $.data.id }
            - call: "POST /opera/rehearsal-calls/${call_c}/transition"
              payload: { to_state: "PUBLISHED" }
              as: TechnicalDirector
            - call: "POST /opera/call-participants"
              payload: { call_id: "${call_c}", contract_id: "${ctr}" }
              as: ContractsOfficer
              captures: { pa_c: $.data.id }
            - call: "POST /opera/call-participants/${pa_c}/transition"
              payload: { to_state: "CONFIRMED" }
              as: ContractsOfficer
            - call: "POST /opera/rehearsal-calls/${call_c}/transition"
              payload: { to_state: "COMPLETED" }
              as: TechnicalDirector
            - call: "POST /opera/rehearsal-calls"
              payload: { production_id: "${prod}", room_id: "${room}", call_type: "BLOCKING", starts_at: "2026-06-04T11:00:00Z", ends_at: "2026-06-04T15:00:00Z" }
              as: TechnicalDirector
              captures: { call_d: $.data.id }
            - call: "POST /opera/rehearsal-calls/${call_d}/transition"
              payload: { to_state: "PUBLISHED" }
              as: TechnicalDirector
            - call: "POST /opera/call-participants"
              payload: { call_id: "${call_d}", contract_id: "${ctr}" }
              as: ContractsOfficer
              captures: { pa_d: $.data.id }
            - call: "POST /opera/call-participants/${pa_d}/transition"
              payload: { to_state: "CONFIRMED" }
              as: ContractsOfficer
          trigger:
            - call: "GET /opera/contracts/${ctr}/pay-quote?week_start=2026-06-01"
              payload: { week_start: "2026-06-01" }
              as: Any
              captures: { proj_hours: $.data.projected_hours, final_hours: $.data.final_hours, proj_pay: $.data.projected_pay_cents, final_pay: $.data.final_pay_cents }
          assert:
            - "pay-quote.projected_hours == 43  (39 completed + 4 published)"
            - "pay-quote.final_hours == 39"
            - "pay-quote.final_pay_cents == 349500  (30*8000 regular + 9*12000 OT1 + 1*1500 night)"
            - "pay-quote.projected_pay_cents == 409500  (30*8000 + 10*12000 OT1 + 3*16000 OT2 + 1500 night)"
            - "projected_pay_cents != final_pay_cents for identical contract and week"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula: three modes (a) nested min/max tiers,
  # (b) pinned nested rounding order, (c) pinned evaluation order for a
  # circular-looking fee dependency
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: overtime_tiered_pay_with_night_premium
        grounds:
          - calculations.overtime_tier_pay
          - calculations.artist_weekly_pay_cents
        distinguishing_aspect: |
          Mode (a): four inputs (hours 23, cap 10, rate 5,000, night_call_count 1) interact
          non-linearly through nested min/max tier boundaries plus a conditional per-call night
          premium — FINAL pay is exactly 156,500 cents.
        test_recipe:
          setup:
            - "Production in REHEARSAL; room; contract ACTIVE (hourly 5,000 cents, weekly cap 10h, rest floor 12h)"
            - "Week 2026-06-01: call E1 Mon 08:00-20:00 (12h) COMPLETED, call E2 Tue 12:00-23:00 (11h, ends 23:00 -> night premium) COMPLETED; contract CONFIRMED on both; gap E1->E2 is 16h"
          setup_api_calls:
            - call: "POST /opera/productions"
              payload: { title: "Otello", work_type: "OPERA", build_budget_cents: 80000000, default_surtitle_language: "en" }
              as: ProductionManager
              captures: { prod: $.data.id }
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "BUILD" }
              as: ProductionManager
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "REHEARSAL" }
              as: ProductionManager
            - call: "POST /opera/rehearsal-rooms"
              payload: { name: "Studio 2", kind: "STUDIO", capacity: 30, hourly_rate_cents: 4000 }
              as: TechnicalDirector
              captures: { room: $.data.id }
            - call: "POST /opera/artists"
              payload: { full_name: "Otello Tenor", discipline: "TENOR", union_code: "AGMA" }
              as: ContractsOfficer
              captures: { artist: $.data.id }
            - call: "POST /opera/contracts"
              payload: { production_id: "${prod}", artist_id: "${artist}", engagement_type: "PRINCIPAL", hourly_rate_cents: 5000, weekly_hours_cap: 10 }
              as: ContractsOfficer
              captures: { ctr: $.data.id }
            - call: "POST /opera/contracts/${ctr}/transition"
              payload: { to_state: "OFFERED" }
              as: ContractsOfficer
            - call: "POST /opera/contracts/${ctr}/transition"
              payload: { to_state: "SIGNED" }
              as: ContractsOfficer
            - call: "POST /opera/contracts/${ctr}/transition"
              payload: { to_state: "ACTIVE" }
              as: ContractsOfficer
            - call: "POST /opera/rehearsal-calls"
              payload: { production_id: "${prod}", room_id: "${room}", call_type: "STAGING", starts_at: "2026-06-01T08:00:00Z", ends_at: "2026-06-01T20:00:00Z" }
              as: TechnicalDirector
              captures: { call_e1: $.data.id }
            - call: "POST /opera/rehearsal-calls/${call_e1}/transition"
              payload: { to_state: "PUBLISHED" }
              as: TechnicalDirector
            - call: "POST /opera/call-participants"
              payload: { call_id: "${call_e1}", contract_id: "${ctr}" }
              as: ContractsOfficer
              captures: { pa_e1: $.data.id }
            - call: "POST /opera/call-participants/${pa_e1}/transition"
              payload: { to_state: "CONFIRMED" }
              as: ContractsOfficer
            - call: "POST /opera/rehearsal-calls/${call_e1}/transition"
              payload: { to_state: "COMPLETED" }
              as: TechnicalDirector
            - call: "POST /opera/rehearsal-calls"
              payload: { production_id: "${prod}", room_id: "${room}", call_type: "TECH", starts_at: "2026-06-02T12:00:00Z", ends_at: "2026-06-02T23:00:00Z" }
              as: TechnicalDirector
              captures: { call_e2: $.data.id }
            - call: "POST /opera/rehearsal-calls/${call_e2}/transition"
              payload: { to_state: "PUBLISHED" }
              as: TechnicalDirector
            - call: "POST /opera/call-participants"
              payload: { call_id: "${call_e2}", contract_id: "${ctr}" }
              as: ContractsOfficer
              captures: { pa_e2: $.data.id }
            - call: "POST /opera/call-participants/${pa_e2}/transition"
              payload: { to_state: "CONFIRMED" }
              as: ContractsOfficer
            - call: "POST /opera/rehearsal-calls/${call_e2}/transition"
              payload: { to_state: "COMPLETED" }
              as: TechnicalDirector
          trigger:
            - call: "GET /opera/contracts/${ctr}/pay-quote?week_start=2026-06-01&mode=FINAL"
              payload: { week_start: "2026-06-01", mode: "FINAL" }
              as: Any
              captures: { final_pay: $.data.final_pay_cents, final_hours: $.data.final_hours }
          assert:
            - "pay-quote.final_hours == 23"
            - "pay-quote.final_pay_cents == 156500  (10*5000 regular + 10*7500 OT1 + 3*10000 OT2 + 1500 night premium)"

      - name: seat_price_nested_rounding_order
        grounds:
          - calculations.seat_price_cents
          - entities.SeatInventory.fields.current_price_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — round(base*section_mult) FIRST, then
          round(unit1*demand_mult). Base 10,050 BALCONY at sold_ratio 0.6 yields 15,076 under the
          pinned order, versus 15,075 under single-rounding — a one-cent divergence the test pins.
        test_recipe:
          setup:
            - "Production in REHEARSAL; performance with a single BALCONY inventory of 10 seats at base 10,050 cents; 6 seats sold (sold_ratio 0.6)"
          setup_api_calls:
            - call: "POST /opera/productions"
              payload: { title: "Carmen", work_type: "OPERA", build_budget_cents: 60000000, default_surtitle_language: "en" }
              as: ProductionManager
              captures: { prod: $.data.id }
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "BUILD" }
              as: ProductionManager
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "REHEARSAL" }
              as: ProductionManager
            - call: "POST /opera/performances"
              payload: { production_id: "${prod}", starts_at: "2026-07-01T19:00:00Z", ends_at: "2026-07-01T22:00:00Z", sections: [ { section: "BALCONY", total_seats: 10, base_price_cents: 10050 } ] }
              as: BoxOfficeManager
              captures: { perf: $.data.id }
            - call: "POST /opera/performances/${perf}/open-sales"
              payload: {}
              as: BoxOfficeManager
            - call: "GET /opera/performances/${perf}/seat-inventories"
              payload: {}
              as: Any
              captures: { inv: "$.data[0].id" }
            - call: "POST /opera/seat-inventories/${inv}/purchase"
              payload: { quantity: 6 }
              as: BoxOfficeManager
          trigger:
            - call: "GET /opera/seat-inventories/${inv}/price-quote?quantity=10"
              payload: { quantity: 10 }
              as: Any
              captures: { unit: $.data.unit_price_cents, mult: $.data.demand_multiplier, grp: $.data.group_discount_applied, total: $.data.total_price_cents }
          assert:
            - "price-quote.unit_price_cents == 15076  (round_half_up(10050*1.25)=12563 then round_half_up(12563*1.2)=15076)"
            - "price-quote.demand_multiplier == 1.2   (sold_ratio 0.6 in [0.5, 0.8))"
            - "price-quote.group_discount_applied == true   (quantity 10 >= GROUP_MIN 10)"
            - "price-quote.total_price_cents == 135684  (round_half_up(15076*10*0.9))"
            - "Performance.${perf}.realized_revenue_cents == 75378  (6 * 12563 at ratio 0, no group discount)"

      - name: rental_fee_tier_keyed_on_base_not_total
        grounds:
          - calculations.rental_fee_cents
          - entities.RentalOffer.fields.total_fee_cents
          - entities.RentalOffer.fields.fee_base_cents
        distinguishing_aspect: |
          Mode (c): the surcharge tier keys on fee_base_cents ONLY (evaluation order pinned:
          base -> tier -> surcharge -> total). fee_base 4,900,000 is below the 5,000,000 threshold
          so total equals base exactly — a self-referential implementation that keyed the tier on
          the total would misbehave; the pinned order makes the value well-defined.
        test_recipe:
          setup:
            - "Renter company (standing GOOD); production in DESIGN (no mutations after create, so version stays as captured)"
          setup_api_calls:
            - call: "POST /opera/partner-companies"
              payload: { name: "TourCo", partner_kind: "RENTER" }
              as: PlatformAdmin
              captures: { renter: $.data.id }
            - call: "POST /opera/productions"
              payload: { title: "Nutcracker", work_type: "BALLET", build_budget_cents: 40000000, default_surtitle_language: "en" }
              as: ProductionManager
              captures: { prod: $.data.id, prod_v: $.data.version }
          trigger:
            - call: "POST /opera/rental-offers"
              payload: { production_id: "${prod}", renter_company_id: "${renter}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z", performances_count: 7, per_performance_fee_cents: 700000, expected_production_version: "${prod_v}" }
              as: ProductionManager
              captures: { offer: $.data.id }
            - call: "POST /opera/rental-offers/${offer}/send"
              payload: {}
              as: ProductionManager
              captures: { base: $.data.fee_base_cents, pct: $.data.surcharge_pct, total: $.data.total_fee_cents }
          assert:
            - "RentalOffer.${offer}.fee_base_cents == 4900000  (7 * 700000)"
            - "RentalOffer.${offer}.surcharge_pct == 0  (fee_base 4900000 < threshold 5000000)"
            - "RentalOffer.${offer}.total_fee_cents == 4900000  (tier keyed on base, not total)"
  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine: cyclic negotiation loop on RentalOffer,
  # parallel state dimensions on Performance (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: rental_offer_negotiation_cycle
        grounds:
          - state_machines.RentalOffer.SENT_to_COUNTERED
          - state_machines.RentalOffer.COUNTERED_to_SENT
          - entities.RentalOffer.fields.negotiation_rounds
        distinguishing_aspect: |
          Cyclic machine on RentalOffer: SENT -> COUNTERED -> SENT -> COUNTERED -> SENT is legal,
          negotiation_rounds increments only on revise (reaching 2), and each revise recomputes the
          fee schedule from the revised per-performance fee.
        test_recipe:
          setup:
            - "Renter company TourCo (GOOD); production (version captured); offer with 7 performances @ 700,000 created and SENT"
          setup_api_calls:
            - call: "POST /opera/partner-companies"
              payload: { name: "TourCo", partner_kind: "RENTER" }
              as: PlatformAdmin
              captures: { renter: $.data.id }
            - call: "POST /opera/productions"
              payload: { title: "Nutcracker", work_type: "BALLET", build_budget_cents: 40000000, default_surtitle_language: "en" }
              as: ProductionManager
              captures: { prod: $.data.id, prod_v: $.data.version }
            - call: "POST /opera/rental-offers"
              payload: { production_id: "${prod}", renter_company_id: "${renter}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z", performances_count: 7, per_performance_fee_cents: 700000, expected_production_version: "${prod_v}" }
              as: ProductionManager
              captures: { offer: $.data.id }
            - call: "POST /opera/rental-offers/${offer}/send"
              payload: {}
              as: ProductionManager
          trigger:
            - call: "POST /opera/rental-offers/${offer}/counter"
              payload: { countered_fee_cents: 4200000 }
              as: PartnerRepresentative
              as_user_id: ${renter}
            - call: "POST /opera/rental-offers/${offer}/revise"
              payload: { per_performance_fee_cents: 650000 }
              as: ProductionManager
            - call: "POST /opera/rental-offers/${offer}/counter"
              payload: { countered_fee_cents: 4300000 }
              as: PartnerRepresentative
              as_user_id: ${renter}
            - call: "POST /opera/rental-offers/${offer}/revise"
              payload: { per_performance_fee_cents: 650000 }
              as: ProductionManager
              captures: { rounds: $.data.negotiation_rounds, status: $.data.status, total: $.data.total_fee_cents }
          assert:
            - "RentalOffer.${offer}.status == SENT  (after two full SENT->COUNTERED->SENT loops)"
            - "RentalOffer.${offer}.negotiation_rounds == 2  (incremented by revise only)"
            - "RentalOffer.${offer}.total_fee_cents == 4550000  (7*650000 = 4550000 base, below threshold, no surcharge)"

      - name: performance_parallel_dims_independent
        grounds:
          - state_machines.Performance
          - entities.Performance.fields.sales_status
          - entities.Performance.fields.readiness_status
        distinguishing_aspect: |
          Parallel state dimensions on Performance: sales_status moves NOT_ON_SALE -> ON_SALE ->
          NOT_ON_SALE (revert) -> ON_SALE -> SALES_CLOSED while readiness_status independently moves
          AWAITING_TECH -> TECH_READY -> CLEARED_FOR_AUDIENCE; neither dimension's transitions reset
          or gate the other (tech-ready succeeds while ON_SALE; suspend-sales succeeds while TECH_READY).
        test_recipe:
          setup:
            - "Production in REHEARSAL; default-language surtitle track LIVE; TECH stage slot DONE before curtain; performance 2026-07-05 (STALLS 50 @ 15,000)"
          setup_api_calls:
            - call: "POST /opera/productions"
              payload: { title: "Carmen", work_type: "OPERA", build_budget_cents: 60000000, default_surtitle_language: "en" }
              as: ProductionManager
              captures: { prod: $.data.id }
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "BUILD" }
              as: ProductionManager
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "REHEARSAL" }
              as: ProductionManager
            - call: "POST /opera/surtitle-tracks"
              payload: { production_id: "${prod}", language: "en", cue_count: 400 }
              as: TechnicalDirector
              captures: { track: $.data.id }
            - call: "POST /opera/surtitle-tracks/${track}/transition"
              payload: { to_state: "TRANSLATED" }
              as: TechnicalDirector
            - call: "POST /opera/surtitle-tracks/${track}/transition"
              payload: { to_state: "CUES_LOCKED" }
              as: TechnicalDirector
            - call: "POST /opera/surtitle-tracks/${track}/transition"
              payload: { to_state: "LIVE" }
              as: TechnicalDirector
            - call: "POST /opera/stage-slots"
              payload: { production_id: "${prod}", slot_type: "TECH", starts_at: "2026-07-04T10:00:00Z", ends_at: "2026-07-04T14:00:00Z" }
              as: TechnicalDirector
              captures: { slot: $.data.id }
            - call: "POST /opera/stage-slots/${slot}/transition"
              payload: { to_state: "LOCKED" }
              as: TechnicalDirector
            - call: "POST /opera/stage-slots/${slot}/transition"
              payload: { to_state: "DONE" }
              as: TechnicalDirector
            - call: "POST /opera/performances"
              payload: { production_id: "${prod}", starts_at: "2026-07-05T19:00:00Z", ends_at: "2026-07-05T22:00:00Z", sections: [ { section: "STALLS", total_seats: 50, base_price_cents: 15000 } ] }
              as: BoxOfficeManager
              captures: { perf: $.data.id }
          trigger:
            - call: "POST /opera/performances/${perf}/open-sales"
              payload: {}
              as: BoxOfficeManager
            - call: "POST /opera/performances/${perf}/tech-ready"
              payload: {}
              as: TechnicalDirector
            - call: "POST /opera/performances/${perf}/suspend-sales"
              payload: {}
              as: BoxOfficeManager
            - call: "POST /opera/performances/${perf}/open-sales"
              payload: {}
              as: BoxOfficeManager
            - call: "POST /opera/performances/${perf}/close-sales"
              payload: {}
              as: BoxOfficeManager
            - call: "POST /opera/performances/${perf}/clear"
              payload: {}
              as: TechnicalDirector
              captures: { sales: $.data.sales_status, ready: $.data.readiness_status, life: $.data.lifecycle_status }
          assert:
            - "Performance.${perf}.sales_status == SALES_CLOSED"
            - "Performance.${perf}.readiness_status == CLEARED_FOR_AUDIENCE"
            - "Performance.${perf}.lifecycle_status == SCHEDULED"
            - "tech-ready succeeded while sales_status was ON_SALE and suspend-sales succeeded while readiness_status was TECH_READY (dimensions independent)"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade: depth-3 cascade from performance cancel;
  # depth-2 cascade from principal release (different triggers)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: performance_cancel_depth3_cascade
        grounds:
          - state_machines.Performance.lifecycle_status=SCHEDULED_to_lifecycle_status=CANCELLED
          - entities.Production.fields.season_revenue_cents
          - entities.CoProductionShare.fields.accrued_revenue_share_cents
        distinguishing_aspect: |
          Depth-3 chain from POST /opera/performances/{id}/cancel: (1) cancel zeroes the
          performance's SeatInventory rows (seats_sold/seats_held -> 0) and realized revenue;
          (2) the inventory zeroing triggers Production.season_revenue_cents recompute (100,000 -> 0);
          (3) the season_revenue change triggers the RATIFIED NET_REVENUE_SHARE share's
          accrued_revenue_share_cents recompute (40,000 -> 0). Each link is caused by the previous.
        test_recipe:
          setup:
            - "Production in REHEARSAL with a RATIFIED 40% NET_REVENUE_SHARE share (NetCo)"
            - "Performance STALLS 100 @ 20,000 ON_SALE with 5 seats sold: realized_revenue 100,000, season_revenue 100,000, accrued 40,000"
          setup_api_calls:
            - call: "POST /opera/partner-companies"
              payload: { name: "NetCo", partner_kind: "CO_PRODUCER" }
              as: PlatformAdmin
              captures: { co_n: $.data.id }
            - call: "POST /opera/productions"
              payload: { title: "Swan Lake", work_type: "BALLET", build_budget_cents: 100000000, default_surtitle_language: "en" }
              as: ProductionManager
              captures: { prod: $.data.id }
            - call: "POST /opera/co-production-shares"
              payload: { production_id: "${prod}", company_id: "${co_n}", share_percentage: 40, cost_split_method: "NET_REVENUE_SHARE" }
              as: ProductionManager
              captures: { sh_n: $.data.id }
            - call: "POST /opera/co-production-shares/${sh_n}/transition"
              payload: { to_state: "RATIFIED" }
              as: ProductionManager
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "BUILD" }
              as: ProductionManager
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "REHEARSAL" }
              as: ProductionManager
            - call: "POST /opera/performances"
              payload: { production_id: "${prod}", starts_at: "2026-06-20T19:00:00Z", ends_at: "2026-06-20T22:00:00Z", sections: [ { section: "STALLS", total_seats: 100, base_price_cents: 20000 } ] }
              as: BoxOfficeManager
              captures: { perf: $.data.id }
            - call: "POST /opera/performances/${perf}/open-sales"
              payload: {}
              as: BoxOfficeManager
            - call: "GET /opera/performances/${perf}/seat-inventories"
              payload: {}
              as: Any
              captures: { inv: "$.data[0].id" }
            - call: "POST /opera/seat-inventories/${inv}/purchase"
              payload: { quantity: 5 }
              as: BoxOfficeManager
          trigger:
            - call: "POST /opera/performances/${perf}/cancel"
              payload: {}
              as: ProductionManager
              captures: { life: $.data.lifecycle_status, rev: $.data.realized_revenue_cents }
            - call: "GET /opera/seat-inventories/${inv}"
              payload: {}
              as: Any
              captures: { sold: $.data.seats_sold, held: $.data.seats_held }
            - call: "GET /opera/productions/${prod}"
              payload: {}
              as: Any
              captures: { season: $.data.season_revenue_cents }
            - call: "GET /opera/co-production-shares/${sh_n}"
              payload: {}
              as: Any
              captures: { accrued: $.data.accrued_revenue_share_cents }
          assert:
            - "Performance.${perf}.lifecycle_status == CANCELLED"
            - "SeatInventory.${inv}.seats_sold == 0 and seats_held == 0  (cascade link 1)"
            - "Production.${prod}.season_revenue_cents == 0  (cascade link 2: 100000 -> 0)"
            - "CoProductionShare.${sh_n}.accrued_revenue_share_cents == 0  (cascade link 3: 40000 -> 0)"
            - "Performance.${perf}.realized_revenue_cents == 0  (refund on cancel)"

      - name: principal_release_cover_promotion_cascade
        grounds:
          - state_machines.CastAssignment.CONFIRMED_to_RELEASED
          - entities.Role.fields.casting_status
          - entities.CastAssignment.fields.covers_assignment_id
        distinguishing_aspect: |
          Depth-2 chain from POST /opera/cast-assignments/{id}/release on a CONFIRMED PRINCIPAL:
          (1) release triggers promotion of the COVER_1 cover (slot -> PRINCIPAL, covers_assignment_id
          -> null, status stays CONFIRMED); (2) the promotion triggers Role.casting_status recompute
          (FULLY_CAST -> PRINCIPAL_SET). Different trigger than the performance-cancel cascade.
        test_recipe:
          setup:
            - "Production in BUILD; role Odette; principal contract A ACTIVE and CONFIRMED as PRINCIPAL; cover contract B ACTIVE and CONFIRMED as COVER_1 linked to the principal"
            - "Role.casting_status == FULLY_CAST before release"
          setup_api_calls:
            - call: "POST /opera/productions"
              payload: { title: "Swan Lake", work_type: "BALLET", build_budget_cents: 100000000, default_surtitle_language: "en" }
              as: ProductionManager
              captures: { prod: $.data.id }
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "BUILD" }
              as: ProductionManager
            - call: "POST /opera/roles"
              payload: { production_id: "${prod}", role_name: "Odette/Odile", voice_type: "DANCER_F", is_title_role: true }
              as: CastingDirector
              captures: { role: $.data.id }
            - call: "POST /opera/artists"
              payload: { full_name: "Anna Principal", discipline: "PRINCIPAL_DANCER", union_code: "AGMA" }
              as: ContractsOfficer
              captures: { artist_a: $.data.id }
            - call: "POST /opera/contracts"
              payload: { production_id: "${prod}", artist_id: "${artist_a}", engagement_type: "PRINCIPAL", hourly_rate_cents: 8000, weekly_hours_cap: 30 }
              as: ContractsOfficer
              captures: { ctr_a: $.data.id }
            - call: "POST /opera/contracts/${ctr_a}/transition"
              payload: { to_state: "OFFERED" }
              as: ContractsOfficer
            - call: "POST /opera/contracts/${ctr_a}/transition"
              payload: { to_state: "SIGNED" }
              as: ContractsOfficer
            - call: "POST /opera/contracts/${ctr_a}/transition"
              payload: { to_state: "ACTIVE" }
              as: ContractsOfficer
            - call: "POST /opera/cast-assignments"
              payload: { role_id: "${role}", contract_id: "${ctr_a}", slot: "PRINCIPAL" }
              as: CastingDirector
              captures: { asg_p: $.data.id }
            - call: "POST /opera/cast-assignments/${asg_p}/confirm"
              payload: {}
              as: CastingDirector
            - call: "POST /opera/artists"
              payload: { full_name: "Bella Cover", discipline: "PRINCIPAL_DANCER", union_code: "AGMA" }
              as: ContractsOfficer
              captures: { artist_b: $.data.id }
            - call: "POST /opera/contracts"
              payload: { production_id: "${prod}", artist_id: "${artist_b}", engagement_type: "COVER", hourly_rate_cents: 6000, weekly_hours_cap: 25 }
              as: ContractsOfficer
              captures: { ctr_b: $.data.id }
            - call: "POST /opera/contracts/${ctr_b}/transition"
              payload: { to_state: "OFFERED" }
              as: ContractsOfficer
            - call: "POST /opera/contracts/${ctr_b}/transition"
              payload: { to_state: "SIGNED" }
              as: ContractsOfficer
            - call: "POST /opera/contracts/${ctr_b}/transition"
              payload: { to_state: "ACTIVE" }
              as: ContractsOfficer
            - call: "POST /opera/cast-assignments"
              payload: { role_id: "${role}", contract_id: "${ctr_b}", slot: "COVER_1", covers_assignment_id: "${asg_p}" }
              as: CastingDirector
              captures: { asg_c1: $.data.id }
            - call: "POST /opera/cast-assignments/${asg_c1}/confirm"
              payload: {}
              as: CastingDirector
          trigger:
            - call: "POST /opera/cast-assignments/${asg_p}/release"
              payload: {}
              as: CastingDirector
              captures: { rel_status: $.data.status }
            - call: "GET /opera/cast-assignments/${asg_c1}"
              payload: {}
              as: Any
              captures: { c1_slot: $.data.slot, c1_covers: $.data.covers_assignment_id, c1_status: $.data.status }
            - call: "GET /opera/roles/${role}"
              payload: {}
              as: Any
              captures: { casting: $.data.casting_status }
          assert:
            - "CastAssignment.${asg_p}.status == RELEASED"
            - "CastAssignment.${asg_c1}.slot == PRINCIPAL  (cascade link 1: auto-promotion)"
            - "CastAssignment.${asg_c1}.covers_assignment_id == null"
            - "CastAssignment.${asg_c1}.status == CONFIRMED  (promotion keeps confirmation)"
            - "Role.${role}.casting_status == PRINCIPAL_SET  (cascade link 2: FULLY_CAST -> PRINCIPAL_SET)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict: (state vs business_safety) and
  # (business_referential vs business_safety) — different category pairs
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: cancelled_call_state_beats_rest_violation
        grounds:
          - validations[priority=5.5]
          - validations[priority=9]
          - errors[ERR_CALL_NOT_OPEN]
          - errors[ERR_REST_FLOOR_VIOLATION]
        distinguishing_aspect: |
          Category pair (state vs business_safety): adding a participant to a CANCELLED call whose
          timing ALSO violates the contract's 12h rest floor must return ERR_CALL_NOT_OPEN
          (state, priority 5.5), not ERR_REST_FLOOR_VIOLATION (business_safety, priority 9).
        test_recipe:
          setup:
            - "Production in REHEARSAL; contract ACTIVE (rest floor 12h) CONFIRMED on call A (Mon 2026-06-01 08:00-20:00, PUBLISHED)"
            - "Call C Tue 2026-06-02 06:00-10:00 (10h gap -> rest violation pending) has been CANCELLED"
          setup_api_calls:
            - call: "POST /opera/productions"
              payload: { title: "Giselle", work_type: "BALLET", build_budget_cents: 50000000, default_surtitle_language: "en" }
              as: ProductionManager
              captures: { prod: $.data.id }
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "BUILD" }
              as: ProductionManager
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "REHEARSAL" }
              as: ProductionManager
            - call: "POST /opera/rehearsal-rooms"
              payload: { name: "Studio 1", kind: "STUDIO", capacity: 40, hourly_rate_cents: 5000 }
              as: TechnicalDirector
              captures: { room: $.data.id }
            - call: "POST /opera/artists"
              payload: { full_name: "Anna Principal", discipline: "PRINCIPAL_DANCER", union_code: "AGMA" }
              as: ContractsOfficer
              captures: { artist: $.data.id }
            - call: "POST /opera/contracts"
              payload: { production_id: "${prod}", artist_id: "${artist}", engagement_type: "PRINCIPAL", hourly_rate_cents: 8000, weekly_hours_cap: 30 }
              as: ContractsOfficer
              captures: { ctr: $.data.id }
            - call: "POST /opera/contracts/${ctr}/transition"
              payload: { to_state: "OFFERED" }
              as: ContractsOfficer
            - call: "POST /opera/contracts/${ctr}/transition"
              payload: { to_state: "SIGNED" }
              as: ContractsOfficer
            - call: "POST /opera/contracts/${ctr}/transition"
              payload: { to_state: "ACTIVE" }
              as: ContractsOfficer
            - call: "POST /opera/rehearsal-calls"
              payload: { production_id: "${prod}", room_id: "${room}", call_type: "DANCE_CALL", starts_at: "2026-06-01T08:00:00Z", ends_at: "2026-06-01T20:00:00Z" }
              as: TechnicalDirector
              captures: { call_a: $.data.id }
            - call: "POST /opera/rehearsal-calls/${call_a}/transition"
              payload: { to_state: "PUBLISHED" }
              as: TechnicalDirector
            - call: "POST /opera/call-participants"
              payload: { call_id: "${call_a}", contract_id: "${ctr}" }
              as: ContractsOfficer
              captures: { pa_a: $.data.id }
            - call: "POST /opera/call-participants/${pa_a}/transition"
              payload: { to_state: "CONFIRMED" }
              as: ContractsOfficer
            - call: "POST /opera/rehearsal-calls"
              payload: { production_id: "${prod}", room_id: "${room}", call_type: "BLOCKING", starts_at: "2026-06-02T06:00:00Z", ends_at: "2026-06-02T10:00:00Z" }
              as: TechnicalDirector
              captures: { call_c: $.data.id }
            - call: "POST /opera/rehearsal-calls/${call_c}/transition"
              payload: { to_state: "CANCELLED" }
              as: TechnicalDirector
          trigger:
            - call: "POST /opera/call-participants"
              payload: { call_id: "${call_c}", contract_id: "${ctr}" }
              as: ContractsOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CALL_NOT_OPEN  (state category, priority 5.5, beats ERR_REST_FLOOR_VIOLATION at priority 9)"
            - "HTTP status == 409"

      - name: duplicate_participant_referential_beats_rest_violation
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_DUPLICATE_PARTICIPANT]
          - errors[ERR_REST_FLOOR_VIOLATION]
        distinguishing_aspect: |
          Category pair (business_referential vs business_safety): adding the same contract twice
          to a rest-violating call must return ERR_DUPLICATE_PARTICIPANT (business_referential,
          priority 7), not ERR_REST_FLOOR_VIOLATION (business_safety, priority 9) — a different
          category pair than cancelled_call_state_beats_rest_violation.
        test_recipe:
          setup:
            - "Production in REHEARSAL; contract ACTIVE (rest floor 12h) CONFIRMED on call A (Mon 2026-06-01 08:00-20:00, PUBLISHED)"
            - "Call B Tue 2026-06-02 06:00-10:00 PUBLISHED (10h gap from A -> rest violation); contract already has a WAIVER_PENDING participant on B"
          setup_api_calls:
            - call: "POST /opera/productions"
              payload: { title: "Giselle", work_type: "BALLET", build_budget_cents: 50000000, default_surtitle_language: "en" }
              as: ProductionManager
              captures: { prod: $.data.id }
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "BUILD" }
              as: ProductionManager
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "REHEARSAL" }
              as: ProductionManager
            - call: "POST /opera/rehearsal-rooms"
              payload: { name: "Studio 1", kind: "STUDIO", capacity: 40, hourly_rate_cents: 5000 }
              as: TechnicalDirector
              captures: { room: $.data.id }
            - call: "POST /opera/artists"
              payload: { full_name: "Anna Principal", discipline: "PRINCIPAL_DANCER", union_code: "AGMA" }
              as: ContractsOfficer
              captures: { artist: $.data.id }
            - call: "POST /opera/contracts"
              payload: { production_id: "${prod}", artist_id: "${artist}", engagement_type: "PRINCIPAL", hourly_rate_cents: 8000, weekly_hours_cap: 30 }
              as: ContractsOfficer
              captures: { ctr: $.data.id }
            - call: "POST /opera/contracts/${ctr}/transition"
              payload: { to_state: "OFFERED" }
              as: ContractsOfficer
            - call: "POST /opera/contracts/${ctr}/transition"
              payload: { to_state: "SIGNED" }
              as: ContractsOfficer
            - call: "POST /opera/contracts/${ctr}/transition"
              payload: { to_state: "ACTIVE" }
              as: ContractsOfficer
            - call: "POST /opera/rehearsal-calls"
              payload: { production_id: "${prod}", room_id: "${room}", call_type: "DANCE_CALL", starts_at: "2026-06-01T08:00:00Z", ends_at: "2026-06-01T20:00:00Z" }
              as: TechnicalDirector
              captures: { call_a: $.data.id }
            - call: "POST /opera/rehearsal-calls/${call_a}/transition"
              payload: { to_state: "PUBLISHED" }
              as: TechnicalDirector
            - call: "POST /opera/call-participants"
              payload: { call_id: "${call_a}", contract_id: "${ctr}" }
              as: ContractsOfficer
              captures: { pa_a: $.data.id }
            - call: "POST /opera/call-participants/${pa_a}/transition"
              payload: { to_state: "CONFIRMED" }
              as: ContractsOfficer
            - call: "POST /opera/rehearsal-calls"
              payload: { production_id: "${prod}", room_id: "${room}", call_type: "BLOCKING", starts_at: "2026-06-02T06:00:00Z", ends_at: "2026-06-02T10:00:00Z" }
              as: TechnicalDirector
              captures: { call_b: $.data.id }
            - call: "POST /opera/rehearsal-calls/${call_b}/transition"
              payload: { to_state: "PUBLISHED" }
              as: TechnicalDirector
            - call: "POST /opera/call-participants"
              payload: { call_id: "${call_b}", contract_id: "${ctr}", waive_rest_floor: true }
              as: ContractsOfficer
              captures: { pa_b: $.data.id, pa_b_status: $.data.status }
          trigger:
            - call: "POST /opera/call-participants"
              payload: { call_id: "${call_b}", contract_id: "${ctr}" }
              as: ContractsOfficer
              captures: { err: $.data.error_id }
          assert:
            - "CallParticipant.${pa_b}.status == WAIVER_PENDING  (waive flag routed the rest violation)"
            - "error_id == ERR_DUPLICATE_PARTICIPANT  (referential category, priority 7, beats rest floor at priority 9)"
            - "HTTP status == 409"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check: rest-floor exact-hours equality (hours
  # metric, call-participants endpoint) vs exact seat-count exhaustion (seat
  # metric, purchase endpoint)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: rest_floor_exactly_twelve_hours
        grounds:
          - calculations.rest_floor_check
          - entities.Contract.fields.rest_floor_hours
          - errors[ERR_REST_FLOOR_VIOLATION]
        distinguishing_aspect: |
          Hours metric on POST /opera/call-participants: a gap of exactly 12 hours passes the
          rest floor (>=), while a gap of 11 hours is rejected with ERR_REST_FLOOR_VIOLATION —
          the boundary sits at exact equality.
        test_recipe:
          setup:
            - "Production in REHEARSAL; contract ACTIVE (rest_floor_hours 12, hourly 8,000, cap 30) CONFIRMED on call A (Mon 2026-06-01 08:00-20:00, PUBLISHED)"
            - "Call B Tue 2026-06-02 08:00-20:00 PUBLISHED in room1 (gap exactly 12h); call C Tue 2026-06-02 07:00-11:00 PUBLISHED in room2 (gap 11h from A -> rest violation; separate room so no room-overlap noise)"
          setup_api_calls:
            - call: "POST /opera/productions"
              payload: { title: "Giselle", work_type: "BALLET", build_budget_cents: 50000000, default_surtitle_language: "en" }
              as: ProductionManager
              captures: { prod: $.data.id }
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "BUILD" }
              as: ProductionManager
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "REHEARSAL" }
              as: ProductionManager
            - call: "POST /opera/rehearsal-rooms"
              payload: { name: "Studio 1", kind: "STUDIO", capacity: 40, hourly_rate_cents: 5000 }
              as: TechnicalDirector
              captures: { room: $.data.id }
            - call: "POST /opera/artists"
              payload: { full_name: "Anna Principal", discipline: "PRINCIPAL_DANCER", union_code: "AGMA" }
              as: ContractsOfficer
              captures: { artist: $.data.id }
            - call: "POST /opera/contracts"
              payload: { production_id: "${prod}", artist_id: "${artist}", engagement_type: "PRINCIPAL", hourly_rate_cents: 8000, weekly_hours_cap: 30, rest_floor_hours: 12 }
              as: ContractsOfficer
              captures: { ctr: $.data.id }
            - call: "POST /opera/contracts/${ctr}/transition"
              payload: { to_state: "OFFERED" }
              as: ContractsOfficer
            - call: "POST /opera/contracts/${ctr}/transition"
              payload: { to_state: "SIGNED" }
              as: ContractsOfficer
            - call: "POST /opera/contracts/${ctr}/transition"
              payload: { to_state: "ACTIVE" }
              as: ContractsOfficer
            - call: "POST /opera/rehearsal-calls"
              payload: { production_id: "${prod}", room_id: "${room}", call_type: "DANCE_CALL", starts_at: "2026-06-01T08:00:00Z", ends_at: "2026-06-01T20:00:00Z" }
              as: TechnicalDirector
              captures: { call_a: $.data.id }
            - call: "POST /opera/rehearsal-calls/${call_a}/transition"
              payload: { to_state: "PUBLISHED" }
              as: TechnicalDirector
            - call: "POST /opera/call-participants"
              payload: { call_id: "${call_a}", contract_id: "${ctr}" }
              as: ContractsOfficer
              captures: { pa_a: $.data.id }
            - call: "POST /opera/call-participants/${pa_a}/transition"
              payload: { to_state: "CONFIRMED" }
              as: ContractsOfficer
            - call: "POST /opera/rehearsal-calls"
              payload: { production_id: "${prod}", room_id: "${room}", call_type: "BLOCKING", starts_at: "2026-06-02T08:00:00Z", ends_at: "2026-06-02T20:00:00Z" }
              as: TechnicalDirector
              captures: { call_b: $.data.id }
            - call: "POST /opera/rehearsal-calls/${call_b}/transition"
              payload: { to_state: "PUBLISHED" }
              as: TechnicalDirector
            - call: "POST /opera/rehearsal-rooms"
              payload: { name: "Studio 2", kind: "STUDIO", capacity: 30, hourly_rate_cents: 4000 }
              as: TechnicalDirector
              captures: { room2: $.data.id }
            - call: "POST /opera/rehearsal-calls"
              payload: { production_id: "${prod}", room_id: "${room2}", call_type: "STAGING", starts_at: "2026-06-02T07:00:00Z", ends_at: "2026-06-02T11:00:00Z" }
              as: TechnicalDirector
              captures: { call_c: $.data.id }
            - call: "POST /opera/rehearsal-calls/${call_c}/transition"
              payload: { to_state: "PUBLISHED" }
              as: TechnicalDirector
          trigger:
            - call: "POST /opera/call-participants"
              payload: { call_id: "${call_b}", contract_id: "${ctr}" }
              as: ContractsOfficer
              captures: { pa_b: $.data.id, pa_b_status: $.data.status }
            - call: "POST /opera/call-participants"
              payload: { call_id: "${call_c}", contract_id: "${ctr}" }
              as: ContractsOfficer
              captures: { err: $.data.error_id }
          assert:
            - "CallParticipant.${pa_b}.status == INVITED  (gap exactly 12h passes: >=)"
            - "second trigger rejected with error_id == ERR_REST_FLOOR_VIOLATION  (gap 11h fails)"
            - "second trigger HTTP status == 422"

      - name: seat_purchase_exact_available_then_over
        grounds:
          - entities.SeatInventory.fields.seats_sold
          - errors[ERR_INSUFFICIENT_SEATS]
          - calculations.seat_price_cents
        distinguishing_aspect: |
          Seat-count metric on POST /opera/seat-inventories/{id}/purchase: purchasing exactly the
          available count (10 of 10) succeeds and leaves 0 available; the next purchase of even 1
          seat fails with ERR_INSUFFICIENT_SEATS — a zero-quantity boundary on a different metric
          and endpoint than rest_floor_exactly_twelve_hours.
        test_recipe:
          setup:
            - "Production in REHEARSAL; performance with STALLS 10 seats @ 10,000 cents, ON_SALE"
          setup_api_calls:
            - call: "POST /opera/productions"
              payload: { title: "Carmen", work_type: "OPERA", build_budget_cents: 60000000, default_surtitle_language: "en" }
              as: ProductionManager
              captures: { prod: $.data.id }
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "BUILD" }
              as: ProductionManager
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "REHEARSAL" }
              as: ProductionManager
            - call: "POST /opera/performances"
              payload: { production_id: "${prod}", starts_at: "2026-07-01T19:00:00Z", ends_at: "2026-07-01T22:00:00Z", sections: [ { section: "STALLS", total_seats: 10, base_price_cents: 10000 } ] }
              as: BoxOfficeManager
              captures: { perf: $.data.id }
            - call: "POST /opera/performances/${perf}/open-sales"
              payload: {}
              as: BoxOfficeManager
            - call: "GET /opera/performances/${perf}/seat-inventories"
              payload: {}
              as: Any
              captures: { inv: "$.data[0].id" }
          trigger:
            - call: "POST /opera/seat-inventories/${inv}/purchase"
              payload: { quantity: 10 }
              as: BoxOfficeManager
              captures: { sold: $.data.seats_sold }
            - call: "POST /opera/seat-inventories/${inv}/purchase"
              payload: { quantity: 1 }
              as: BoxOfficeManager
              captures: { err: $.data.error_id }
            - call: "GET /opera/performances/${perf}"
              payload: {}
              as: Any
              captures: { rev: $.data.realized_revenue_cents }
          assert:
            - "first purchase succeeds: SeatInventory.${inv}.seats_sold == 10  (quantity == available is allowed)"
            - "second purchase rejected with error_id == ERR_INSUFFICIENT_SEATS, HTTP 409  (0 available)"
            - "Performance.${perf}.realized_revenue_cents == 90000  (10 seats * 10000 * 0.9 group discount at quantity >= 10)"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency: Performance<-SurtitleTrack and
  # RentalOffer<-PartnerCompany (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: tech_ready_requires_surtitle_live
        grounds:
          - state_machines.Performance.readiness_status=AWAITING_TECH_to_readiness_status=TECH_READY
          - entities.SurtitleTrack.fields.status
          - errors[ERR_READINESS_GATE_BLOCKED]
        distinguishing_aspect: |
          Entity pair Performance x SurtitleTrack: tech-ready on the performance is gated on the
          production's default-language SurtitleTrack being LIVE — with the track at CUES_LOCKED the
          transition is rejected (ERR_READINESS_GATE_BLOCKED); after the track goes LIVE it succeeds.
        test_recipe:
          setup:
            - "Production in REHEARSAL (default surtitle language en); TECH stage slot DONE before curtain; surtitle track 'en' at CUES_LOCKED; performance 2026-07-05"
          setup_api_calls:
            - call: "POST /opera/productions"
              payload: { title: "Carmen", work_type: "OPERA", build_budget_cents: 60000000, default_surtitle_language: "en" }
              as: ProductionManager
              captures: { prod: $.data.id }
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "BUILD" }
              as: ProductionManager
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "REHEARSAL" }
              as: ProductionManager
            - call: "POST /opera/surtitle-tracks"
              payload: { production_id: "${prod}", language: "en", cue_count: 400 }
              as: TechnicalDirector
              captures: { track: $.data.id }
            - call: "POST /opera/surtitle-tracks/${track}/transition"
              payload: { to_state: "TRANSLATED" }
              as: TechnicalDirector
            - call: "POST /opera/surtitle-tracks/${track}/transition"
              payload: { to_state: "CUES_LOCKED" }
              as: TechnicalDirector
            - call: "POST /opera/stage-slots"
              payload: { production_id: "${prod}", slot_type: "TECH", starts_at: "2026-07-04T10:00:00Z", ends_at: "2026-07-04T14:00:00Z" }
              as: TechnicalDirector
              captures: { slot: $.data.id }
            - call: "POST /opera/stage-slots/${slot}/transition"
              payload: { to_state: "LOCKED" }
              as: TechnicalDirector
            - call: "POST /opera/stage-slots/${slot}/transition"
              payload: { to_state: "DONE" }
              as: TechnicalDirector
            - call: "POST /opera/performances"
              payload: { production_id: "${prod}", starts_at: "2026-07-05T19:00:00Z", ends_at: "2026-07-05T22:00:00Z", sections: [ { section: "STALLS", total_seats: 50, base_price_cents: 15000 } ] }
              as: BoxOfficeManager
              captures: { perf: $.data.id }
          trigger:
            - call: "POST /opera/performances/${perf}/tech-ready"
              payload: {}
              as: TechnicalDirector
              captures: { err: $.data.error_id }
            - call: "POST /opera/surtitle-tracks/${track}/transition"
              payload: { to_state: "LIVE" }
              as: TechnicalDirector
            - call: "POST /opera/performances/${perf}/tech-ready"
              payload: {}
              as: TechnicalDirector
              captures: { ready: $.data.readiness_status }
          assert:
            - "first tech-ready rejected with error_id == ERR_READINESS_GATE_BLOCKED  (surtitle track not LIVE)"
            - "after track -> LIVE, tech-ready succeeds: Performance.${perf}.readiness_status == TECH_READY"

      - name: rental_accept_requires_renter_good_standing
        grounds:
          - state_machines.RentalOffer.SENT_to_ACCEPTED
          - entities.PartnerCompany.fields.standing
          - errors[ERR_RENTER_STANDING_NOT_GOOD]
        distinguishing_aspect: |
          Entity pair RentalOffer x PartnerCompany: the renter's accept is gated on the company
          standing — at WATCH the accept is rejected (ERR_RENTER_STANDING_NOT_GOOD); restoring GOOD
          lets the same transition succeed. A different entity pair than Performance x SurtitleTrack.
        test_recipe:
          setup:
            - "Renter company TourCo (GOOD); production; offer created (version-safe) and SENT"
          setup_api_calls:
            - call: "POST /opera/partner-companies"
              payload: { name: "TourCo", partner_kind: "RENTER" }
              as: PlatformAdmin
              captures: { renter: $.data.id }
            - call: "POST /opera/productions"
              payload: { title: "Nutcracker", work_type: "BALLET", build_budget_cents: 40000000, default_surtitle_language: "en" }
              as: ProductionManager
              captures: { prod: $.data.id, prod_v: $.data.version }
            - call: "POST /opera/rental-offers"
              payload: { production_id: "${prod}", renter_company_id: "${renter}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z", performances_count: 7, per_performance_fee_cents: 700000, expected_production_version: "${prod_v}" }
              as: ProductionManager
              captures: { offer: $.data.id }
            - call: "POST /opera/rental-offers/${offer}/send"
              payload: {}
              as: ProductionManager
            - call: "POST /opera/partner-companies/${renter}/transition"
              payload: { to_state: "WATCH" }
              as: PlatformAdmin
          trigger:
            - call: "POST /opera/rental-offers/${offer}/accept"
              payload: {}
              as: PartnerRepresentative
              as_user_id: ${renter}
              captures: { err: $.data.error_id }
            - call: "POST /opera/partner-companies/${renter}/transition"
              payload: { to_state: "GOOD" }
              as: PlatformAdmin
            - call: "POST /opera/rental-offers/${offer}/accept"
              payload: {}
              as: PartnerRepresentative
              as_user_id: ${renter}
              captures: { status: $.data.status }
          assert:
            - "first accept rejected with error_id == ERR_RENTER_STANDING_NOT_GOOD  (standing WATCH)"
            - "after standing restored to GOOD, accept succeeds: RentalOffer.${offer}.status == ACCEPTED"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap: strict half-open overlap on
  # RehearsalRoom vs buffered-adjacency changeover on the singleton stage
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: room_half_open_back_to_back
        grounds:
          - calculations.room_overlap_check
          - entities.RehearsalCall.fields.room_id
          - errors[ERR_ROOM_TIME_CONFLICT]
        distinguishing_aspect: |
          RehearsalRoom resource, half-open [start, end) semantics with zero buffer: a call starting
          exactly when another ends (12:00 == 12:00) is allowed, while a 30-minute overlap is
          rejected with ERR_ROOM_TIME_CONFLICT.
        test_recipe:
          setup:
            - "Production in REHEARSAL; room Studio 1; call1 2026-06-08 09:00-12:00 exists (DRAFT counts as a blocker)"
          setup_api_calls:
            - call: "POST /opera/productions"
              payload: { title: "Giselle", work_type: "BALLET", build_budget_cents: 50000000, default_surtitle_language: "en" }
              as: ProductionManager
              captures: { prod: $.data.id }
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "BUILD" }
              as: ProductionManager
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "REHEARSAL" }
              as: ProductionManager
            - call: "POST /opera/rehearsal-rooms"
              payload: { name: "Studio 1", kind: "STUDIO", capacity: 40, hourly_rate_cents: 5000 }
              as: TechnicalDirector
              captures: { room: $.data.id }
            - call: "POST /opera/rehearsal-calls"
              payload: { production_id: "${prod}", room_id: "${room}", call_type: "DANCE_CALL", starts_at: "2026-06-08T09:00:00Z", ends_at: "2026-06-08T12:00:00Z" }
              as: TechnicalDirector
              captures: { call1: $.data.id }
          trigger:
            - call: "POST /opera/rehearsal-calls"
              payload: { production_id: "${prod}", room_id: "${room}", call_type: "BLOCKING", starts_at: "2026-06-08T12:00:00Z", ends_at: "2026-06-08T15:00:00Z" }
              as: TechnicalDirector
              captures: { call2: $.data.id }
            - call: "POST /opera/rehearsal-calls"
              payload: { production_id: "${prod}", room_id: "${room}", call_type: "STAGING", starts_at: "2026-06-08T11:30:00Z", ends_at: "2026-06-08T13:00:00Z" }
              as: TechnicalDirector
              captures: { err: $.data.error_id }
          assert:
            - "back-to-back call created: RehearsalCall.${call2} exists with status DRAFT  (ends_at == starts_at is not a conflict)"
            - "overlapping call rejected with error_id == ERR_ROOM_TIME_CONFLICT, HTTP 409"

      - name: stage_changeover_buffer_semantics
        grounds:
          - calculations.stage_changeover_check
          - entities.StageSlot.fields.slot_type
          - errors[ERR_STAGE_CHANGEOVER_CONFLICT]
        distinguishing_aspect: |
          Singleton STAGE resource with buffered-adjacency semantics (different from the room's
          strict half-open overlap): a cross-production gap of exactly 6h passes (>= CHANGEOVER_BUFFER_HOURS),
          while a same-production gap of 1h fails the 2h RESET_BUFFER_HOURS rule — two buffer tiers
          exercised through one endpoint.
        test_recipe:
          setup:
            - "Productions P1 and P2 exist; P1 has LOAD_OUT stage slot 2026-06-10 16:00-20:00 (PLANNED)"
          setup_api_calls:
            - call: "POST /opera/productions"
              payload: { title: "Swan Lake", work_type: "BALLET", build_budget_cents: 100000000, default_surtitle_language: "en" }
              as: ProductionManager
              captures: { prod1: $.data.id }
            - call: "POST /opera/productions"
              payload: { title: "Otello", work_type: "OPERA", build_budget_cents: 80000000, default_surtitle_language: "en" }
              as: ProductionManager
              captures: { prod2: $.data.id }
            - call: "POST /opera/stage-slots"
              payload: { production_id: "${prod1}", slot_type: "LOAD_OUT", starts_at: "2026-06-10T16:00:00Z", ends_at: "2026-06-10T20:00:00Z" }
              as: TechnicalDirector
              captures: { slot_out: $.data.id }
          trigger:
            - call: "POST /opera/stage-slots"
              payload: { production_id: "${prod2}", slot_type: "LOAD_IN", starts_at: "2026-06-11T02:00:00Z", ends_at: "2026-06-11T06:00:00Z" }
              as: TechnicalDirector
              captures: { slot_in: $.data.id }
            - call: "POST /opera/stage-slots"
              payload: { production_id: "${prod1}", slot_type: "TECH", starts_at: "2026-06-10T21:00:00Z", ends_at: "2026-06-10T23:00:00Z" }
              as: TechnicalDirector
              captures: { err: $.data.error_id }
          assert:
            - "cross-production LOAD_IN at exactly 6h gap created: StageSlot.${slot_in} exists  (>= CHANGEOVER_BUFFER_HOURS passes)"
            - "same-production TECH at 1h gap rejected with error_id == ERR_STAGE_CHANGEOVER_CONFLICT, HTTP 409  (< RESET_BUFFER_HOURS 2h)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant: seat-count conservation vs build-budget
  # conservation (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: seat_conservation_hold_release
        grounds:
          - entities.SeatInventory.fields.seats_held
          - entities.SeatInventory.fields.seats_sold
          - entities.SeatInventory.fields.total_seats
        distinguishing_aspect: |
          Conserved quantity: seat count. For every hold/release/purchase sequence,
          seats_held + seats_sold + seats_available == total_seats (20) exactly — forward and
          compensating actions leave the invariant unchanged.
        test_recipe:
          setup:
            - "Production in REHEARSAL; performance STALLS 20 @ 10,000, ON_SALE"
          setup_api_calls:
            - call: "POST /opera/productions"
              payload: { title: "Carmen", work_type: "OPERA", build_budget_cents: 60000000, default_surtitle_language: "en" }
              as: ProductionManager
              captures: { prod: $.data.id }
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "BUILD" }
              as: ProductionManager
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "REHEARSAL" }
              as: ProductionManager
            - call: "POST /opera/performances"
              payload: { production_id: "${prod}", starts_at: "2026-07-01T19:00:00Z", ends_at: "2026-07-01T22:00:00Z", sections: [ { section: "STALLS", total_seats: 20, base_price_cents: 10000 } ] }
              as: BoxOfficeManager
              captures: { perf: $.data.id }
            - call: "POST /opera/performances/${perf}/open-sales"
              payload: {}
              as: BoxOfficeManager
            - call: "GET /opera/performances/${perf}/seat-inventories"
              payload: {}
              as: Any
              captures: { inv: "$.data[0].id" }
          trigger:
            - call: "POST /opera/seat-inventories/${inv}/hold"
              payload: { quantity: 7 }
              as: BoxOfficeManager
            - call: "POST /opera/seat-inventories/${inv}/hold"
              payload: { quantity: 3 }
              as: BoxOfficeManager
            - call: "POST /opera/seat-inventories/${inv}/release"
              payload: { quantity: 4 }
              as: BoxOfficeManager
            - call: "POST /opera/seat-inventories/${inv}/purchase"
              payload: { quantity: 5 }
              as: BoxOfficeManager
              captures: { held: $.data.seats_held, sold: $.data.seats_sold, total: $.data.total_seats }
          assert:
            - "SeatInventory.${inv}.seats_held == 6  (7 + 3 - 4)"
            - "SeatInventory.${inv}.seats_sold == 5"
            - "SeatInventory.${inv}.seats_held + seats_sold + seats_available == 20  (6 + 5 + 9 == total_seats)"
            - "Performance.${perf}.realized_revenue_cents == 50000  (5 * 10000 at ratio 0, no group discount)"

      - name: build_budget_conservation_order_cancel
        grounds:
          - calculations.build_cost_balance
          - entities.Production.fields.build_cost_balance_cents
          - state_machines.BuildItem.ORDERED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: money. build_cost_balance_cents + committed_cost == build_budget_cents
          after every step: order commits 30,000,000 (balance 70,000,000), BUILT at actual 32,000,000
          (balance 68,000,000), and the compensating cancel restores the balance to exactly
          100,000,000 — no drift.
        test_recipe:
          setup:
            - "Production with build_budget_cents 100,000,000 (balance 100,000,000)"
          setup_api_calls:
            - call: "POST /opera/productions"
              payload: { title: "Swan Lake", work_type: "BALLET", build_budget_cents: 100000000, default_surtitle_language: "en" }
              as: ProductionManager
              captures: { prod: $.data.id }
          trigger:
            - call: "POST /opera/build-items"
              payload: { production_id: "${prod}", item_kind: "SET", name: "Palace flat", quoted_cost_cents: 30000000 }
              as: ProductionManager
              captures: { bi: $.data.id }
            - call: "GET /opera/productions/${prod}"
              payload: {}
              as: Any
              captures: { bal_after_order: $.data.build_cost_balance_cents }
            - call: "POST /opera/build-items/${bi}/transition"
              payload: { to_state: "BUILT", actual_cost_cents: 32000000 }
              as: ProductionManager
            - call: "GET /opera/productions/${prod}"
              payload: {}
              as: Any
              captures: { bal_after_built: $.data.build_cost_balance_cents }
            - call: "POST /opera/build-items/${bi}/transition"
              payload: { to_state: "CANCELLED" }
              as: ProductionManager
            - call: "GET /opera/productions/${prod}"
              payload: {}
              as: Any
              captures: { bal_after_cancel: $.data.build_cost_balance_cents }
          assert:
            - "balance after order == 70000000"
            - "balance after BUILT == 68000000  (actual 32000000 committed)"
            - "balance after cancel == 100000000  (compensating action restores the conserved quantity exactly)"
