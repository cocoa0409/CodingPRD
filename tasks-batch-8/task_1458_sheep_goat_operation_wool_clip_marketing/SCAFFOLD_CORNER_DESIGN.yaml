      - name: contract_counter_as_ranch_manager_forbidden
        claim_type: role_exclusive_denial
        grounds: [roles.GrazingClient, "endpoints.POST /api/grazing-contracts/{id}/counter", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Counter-offers are GrazingClient-exclusive; the ranch cannot counter its own proposal."
        test_recipe:
          setup: ["Flock (SHEEP, 800); contract PROPOSED"]
          setup_api_calls:
