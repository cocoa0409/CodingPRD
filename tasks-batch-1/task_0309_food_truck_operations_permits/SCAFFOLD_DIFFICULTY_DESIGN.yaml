      - name: bulk10_per_line_eligibility_conditional_branch
        grounds:
          - calculations.order_settled_total
          - state_machines.Order.OPEN_to_SETTLED
          - entities.Order.fields.discount_code
          - entities.OrderLine.fields.quantity
        distinguishing_aspect: "Mode (a) >=3-input conditional-branch formula: BULK10 eligibility is decided per line on (quantity >= BULK10_MIN_QTY=10), so a 12-unit line is discounted (10%) while a 5-unit line of the same item is not — settled_total_cents=3144 from raw lines 2388 and 995."
        test_recipe:
          setup:
            - "An OPEN, CAPTURED order under an ARRIVED booking with two lines of a 199-cent item (qty 12 eligible, qty 5 ineligible), discount BULK10 at settle, prepared_units >= 17, no tip."
