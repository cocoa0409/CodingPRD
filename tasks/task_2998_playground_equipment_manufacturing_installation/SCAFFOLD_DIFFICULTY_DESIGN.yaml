# SCAFFOLD_DIFFICULTY_DESIGN.yaml - task 2998 Playground Equipment Manufacturing & Installation
# Test-targeting index (SKILL.md §1.8). Every instance grounds in SCAFFOLD.yaml §1.1-§1.7.
# 9 rule_ids / 19 instances. Every numeric assert literal was computed by executing the
# relevant calculations[].formula against the pinned setup inputs.
scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: quote_provisional_vs_firm_diverge_on_same_placement_set
        grounds:
          - calculations.quote_pricing
          - entities.Quote.fields.subtotal_cents
          - entities.Quote.fields.total_cents
          - entities.Quote.fields.priced_unit_count
          - state_machines.Quote.ISSUED_to_EXPIRED
          - concurrency_rules[quote-create-stale-project]
        distinguishing_aspect: |
          Both variants see the identical three-placement VALIDATED input set, yet PROVISIONAL
          rounds each of the three uplifted lines before summing and FIRM sums the exact lines
          and rounds once, so PROVISIONAL.subtotal_cents is exactly 1 cent above FIRM's
          (333895 vs 333894) on byte-identical placement data.
        test_recipe:
          setup:
            - "PlaygroundStandard ASTM_F1487/2024 is ACTIVE."
            - "Three CERTIFIED ComponentModels: POST-STD-120 (10750 cents), DECK-TDL-122 (64350), SLIDE-HD-122 (215450)."
            - "DesignProject 'Maple Grove School' in CONSULTATION, budget 500000 cents, soil CLAY, one TODDLER_6_23M play area (0..2000 cm, ENGINEERED_WOOD_FIBER, depth 30 cm; required depth 28 cm)."
            - "Three placements, all VALIDATED, all on a non-default color so the 7% uplift applies: post x=200 qty=3, deck x=700 qty=1, slide x=1300 qty=1 attached to the deck."
            - "One ISSUED DesignRendering pinned to the ACTIVE standard. Logical clock at its 2026-08-01T00:00:00Z default."
