          rationale: "Both readiness variants and their numeric delta are asserted by the named §1.8 instance."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: patch_immediately_visible_in_same_and_subsequent_reads
        claim_type: immediate
        grounds:
          - endpoints.PATCH_/accreditation/institutions/{id}
          - complexity_profile.consistency_model
        distinguishing_aspect: "Immediate consistency: a successful PATCH returns the mutated row in its own response (state_code MO, version 2) and a subsequent GET observes the identical values with no reconciliation lag."
        test_recipe:
          setup:
            - "PROSPECTIVE institution with state_code IA at version 1."
          setup_api_calls:
            - *k_clock
            - *k_inst
          trigger:
            - call: "PATCH /accreditation/institutions/${inst_id}"
              payload: { expected_institution_version: "${inst_v}", state_code: "MO" }
              as: CommissionStaff
              captures: { patch_state: $.data.state_code, patch_v: $.data.version }
            - call: "GET /accreditation/institutions/${inst_id}"
              payload: {}
              as: CommissionStaff
              captures: { get_state: $.data.state_code, get_v: $.data.version }
          assert:
            - "patch_state == MO and patch_v == 2 in the PATCH response itself"
            - "get_state == MO and get_v == 2 on the subsequent read (no eventual-consistency window)"
