      - name: waiver_request_on_a_full_charge_unverified_encounter_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 18]
          - errors[ERR_WAIVER_NOT_ELIGIBLE]
          - endpoints[POST /encounters/{id}/waivers]
          - calculations.patient_charge_cents
        distinguishing_aspect: >-
          The inability-to-pay policy protects only the nominal fee: an encounter whose charge_basis
          is FULL_CHARGE_UNVERIFIED with patient_charge_cents 8000 (not the 2500 nominal fee) is
          refused with ERR_WAIVER_NOT_ELIGIBLE / 422 and no InabilityToPayWaiver row is created.
        test_recipe:
          setup:
            - "BOOT_CORE is executed"
            - "Patient 'Rue Marsh' (MRN-C03) has no IncomeVerification, so her SELF_PAY encounter for 8000 is charged the full gross"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_site
            - *c_svc
            - *c_chair
            - *c_fs
            - *c_t1
            - *c_t2
            - *c_hcv
            - *c_adopt
            - call: "POST /patients"
              payload: { mrn: "MRN-C03", full_name: "Rue Marsh", household_size: 1 }
              as: PatientServicesRep
              as_user_id: "psr-1"
              captures: { wp_id: $.data.id }
            - call: "POST /encounters"
              payload: { patient_id: "${wp_id}", service_site_id: "${csite_id}", service_definition_id: "${csvc_id}", encounter_date: "2026-05-01T00:00:00Z", payer_type: "SELF_PAY", gross_charge_cents: 8000 }
              as: BillingSpecialist
