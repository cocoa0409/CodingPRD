scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: refund_cash_vs_store_credit_diverge_on_return
        grounds:
          - calculations.return_settlement
          - state_machines.ReturnAuthorization.APPROVED_to_REFUNDED
          - entities.ReturnAuthorization.fields.settlement_cents
        distinguishing_aspect: |
          For identical returned lines, REFUND withholds the 15% restocking fee and pays 2437 cents to original
          payment, while STORE_CREDIT waives the fee AND adds a 5% bonus, paying 2968 cents as store credit — a
          strictly larger, different number on the same ReturnAuthorization entity.
        test_recipe:
          setup:
            - "A customer has a CAPTURED+DELIVERED order: line P1 (unit 2599, tax 875 bps, restock 1500 bps, window 30d) qty2, line P2 (unit 1499, tax 875 bps, window 30d) qty3; promo 0; grand_total 11042."
            - "Two sibling carts of the same shape are built so one is returned as cash and the other as store credit."
            - "Clock at 2026-06-10; both delivered 2026-06-05 so the window is open."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: StoreAdmin
            - call: "POST /customers"
              payload: { email: "dv@x.com", full_name: "DV" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /warehouses"
              payload: { code: "W1", name: "Main", fulfillment_priority: 1 }
              as: StoreAdmin
              captures: { wh_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P1", title: "P1", unit_price_cents: 2599, tax_rate_bps: 875, restocking_fee_bps: 1500, return_window_days: 30, final_sale: false }
              as: StoreAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P2", title: "P2", unit_price_cents: 1499, tax_rate_bps: 875, return_window_days: 30, final_sale: false }
              as: StoreAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /inventory"
              payload: { product_id: "${p1_id}", warehouse_id: "${wh_id}", on_hand_qty: 100 }
              as: StoreAdmin
            - call: "POST /inventory"
              payload: { product_id: "${p2_id}", warehouse_id: "${wh_id}", on_hand_qty: 100 }
              as: StoreAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", promo_flat_cents: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${p1_id}", qty: 2 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ol1_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${p2_id}", qty: 3 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /orders/${ord_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_v: $.data.version }
            - call: "POST /orders/${ord_id}/checkout"
              payload: { expected_order_version: "${ord_v}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${ord_id}/capture-payment"
              payload: {}
              as: StoreAdmin
            - call: "GET /order-lines/${ol1_id}/reservations"
              payload: {}
              as: StoreAdmin
              captures: { res1_id: "$.data[0].id" }
            - call: "POST /orders/${ord_id}/shipments"
              payload: { warehouse_id: "${wh_id}", lines: [{ reservation_id: "${res1_id}", qty: 2 }] }
              as: WarehouseOperator
              captures: { ship_id: $.data.id }
            - call: "POST /shipments/${ship_id}/ship"
              payload: {}
              as: WarehouseOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: StoreAdmin
            - call: "POST /shipments/${ship_id}/deliver"
              payload: {}
              as: WarehouseOperator
          trigger:
            - call: "POST /orders/${ord_id}/returns"
              payload: { reason: "NO_LONGER_WANTED", resolution: "REFUND", lines: [{ order_line_id: "${ol1_id}", return_qty: 1 }] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rma_cash_id: $.data.id, rma_cash_settle: $.data.settlement_cents }
            - call: "GET /returns/${rma_cash_id}"
              payload: {}
              as: StoreAdmin
              captures: { rma_v_cash: $.data.version }
            - call: "POST /returns/${rma_cash_id}/approve"
              payload: { expected_return_version: "${rma_v_cash}" }
              as: StoreAdmin
            - call: "POST /returns/${rma_cash_id}/settle"
              payload: {}
              as: StoreAdmin
              captures: { rma_cash_final: $.data.settlement_cents }
            - call: "POST /orders/${ord_id}/returns"
              payload: { reason: "NO_LONGER_WANTED", resolution: "STORE_CREDIT", lines: [{ order_line_id: "${ol1_id}", return_qty: 1 }] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rma_credit_id: $.data.id, rma_credit_settle: $.data.settlement_cents }
          assert:
            - "ReturnAuthorization.${rma_cash_id}.settlement_cents == 2437"
            - "ReturnAuthorization.${rma_cash_id}.restocking_fee_cents == 390"
            - "ReturnAuthorization.${rma_credit_id}.settlement_cents == 2968"
            - "ReturnAuthorization.${rma_credit_id}.restocking_fee_cents == 0"
            - "2968 > 2437  # store credit (fee waived + 5% bonus) strictly exceeds cash refund on identical lines"

      - name: customer_risk_lifetime_vs_trailing_window_diverge
        grounds:
          - calculations.customer_return_risk
          - entities.Customer.fields.return_risk_score
          - entities.Customer.fields.lifetime_refunded_cents
        distinguishing_aspect: |
          The same Customer scores return_risk_score 0.2207 over lifetime (2437 refunded / 11042 purchased) but a
          higher 1.0 over the trailing 90-day window when the only purchase counted in the window is excluded by date,
          so the two variants return different numbers on the Customer entity — a different domain from the RMA money calc.
        test_recipe:
          setup:
            - "Customer captured one order grand_total 11042 dated 2026-01-01 (outside a later 90-day window)."
            - "A 2437-cent cash refund settled at 2026-06-05 (inside the window)."
            - "Lifetime risk = 2437/11042 = 0.2207; window-from-2026-06-05 risk uses only window-dated rows."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: StoreAdmin
            - call: "POST /customers"
              payload: { email: "risk@x.com", full_name: "Risk" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /warehouses"
              payload: { code: "WR", name: "Main", fulfillment_priority: 1 }
              as: StoreAdmin
              captures: { wh_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "RP1", title: "RP1", unit_price_cents: 2599, tax_rate_bps: 875, restocking_fee_bps: 1500, return_window_days: 365, final_sale: false }
              as: StoreAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "RP2", title: "RP2", unit_price_cents: 1499, tax_rate_bps: 875, return_window_days: 365, final_sale: false }
              as: StoreAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /inventory"
              payload: { product_id: "${p1_id}", warehouse_id: "${wh_id}", on_hand_qty: 100 }
              as: StoreAdmin
            - call: "POST /inventory"
              payload: { product_id: "${p2_id}", warehouse_id: "${wh_id}", on_hand_qty: 100 }
              as: StoreAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", promo_flat_cents: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${p1_id}", qty: 2 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ol1_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${p2_id}", qty: 3 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /orders/${ord_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_v: $.data.version }
            - call: "POST /orders/${ord_id}/checkout"
              payload: { expected_order_version: "${ord_v}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${ord_id}/capture-payment"
              payload: {}
              as: StoreAdmin
            - call: "GET /order-lines/${ol1_id}/reservations"
              payload: {}
              as: StoreAdmin
              captures: { res1_id: "$.data[0].id" }
            - call: "POST /orders/${ord_id}/shipments"
              payload: { warehouse_id: "${wh_id}", lines: [{ reservation_id: "${res1_id}", qty: 2 }] }
              as: WarehouseOperator
              captures: { ship_id: $.data.id }
            - call: "POST /shipments/${ship_id}/ship"
              payload: {}
              as: WarehouseOperator
            - call: "POST /shipments/${ship_id}/deliver"
              payload: {}
              as: WarehouseOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: StoreAdmin
            - call: "POST /orders/${ord_id}/returns"
              payload: { reason: "NO_LONGER_WANTED", resolution: "REFUND", lines: [{ order_line_id: "${ol1_id}", return_qty: 1 }] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rma_id: $.data.id }
            - call: "GET /returns/${rma_id}"
              payload: {}
              as: StoreAdmin
              captures: { rma_v: $.data.version }
            - call: "POST /returns/${rma_id}/approve"
              payload: { expected_return_version: "${rma_v}" }
              as: StoreAdmin
            - call: "POST /returns/${rma_id}/settle"
              payload: {}
              as: StoreAdmin
          trigger:
            - call: "GET /customers/${cust_id}/risk"
              payload: {}
              as: StoreAdmin
              captures: { lifetime_score: $.data.return_risk_score }
            - call: "GET /customers/${cust_id}/risk?window_days=90"
              payload: { window_days: 90 }
              as: StoreAdmin
              captures: { window_score: $.data.return_risk_score }
          assert:
            - "Customer.${cust_id}.return_risk_score (lifetime) == 0.2207"
            - "GET /customers/${cust_id}/risk?window_days=90 return_risk_score == 0  # purchase dated 2026-01-01 falls outside the 90-day window from clock 2026-06-05, so windowed lifetime_purchased is 0 → score 0"
            - "lifetime_score != window_score"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: order_total_tiered_shipping_with_promo_and_per_line_tax_mode_a
        grounds:
          - calculations.order_totals
          - entities.Order.fields.grand_total_cents
          - entities.Order.fields.shipping_fee_cents
        distinguishing_aspect: |
          [mode a] grand_total depends non-linearly on 3+ inputs: discounted_subtotal selects a shipping tier via a
          branch (>=10000 free, >=5000 reduced, else standard), and promo_flat shifts discounted_subtotal across the
          5000 boundary — promo 200 drops 5100 to 4900, flipping shipping 499→999, yielding grand 6345 vs 6045.
        test_recipe:
          setup:
            - "Single-line cart: product unit 5100, tax 875 bps, qty1; promo_flat 200."
            - "Discounted subtotal = 4900 < 5000 → standard shipping 999; tax 446; grand 6345."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c2a@x.com", full_name: "C2A" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /warehouses"
              payload: { code: "W2A", name: "Main", fulfillment_priority: 1 }
              as: StoreAdmin
              captures: { wh_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "S2A", title: "S2A", unit_price_cents: 5100, tax_rate_bps: 875, return_window_days: 30, final_sale: false }
              as: StoreAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /inventory"
              payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", on_hand_qty: 50 }
              as: StoreAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", promo_flat_cents: 200 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${prod_id}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /orders/${ord_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_v: $.data.version }
          trigger:
            - call: "POST /orders/${ord_id}/checkout"
              payload: { expected_order_version: "${ord_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { grand: $.data.grand_total_cents }
          assert:
            - "Order.${ord_id}.subtotal_cents == 5100"
            - "Order.${ord_id}.discounted_subtotal_cents == 4900"
            - "Order.${ord_id}.tax_total_cents == 446"
            - "Order.${ord_id}.shipping_fee_cents == 999"
            - "Order.${ord_id}.grand_total_cents == 6345"

      - name: order_total_round_per_line_then_sum_tax_mode_b
        grounds:
          - calculations.order_totals
          - entities.OrderLine.fields.line_tax_cents
          - entities.Order.fields.tax_total_cents
        distinguishing_aspect: |
          [mode b] rounding order is load-bearing: two lines each subtotal 1000 at 875 bps round to 88 per line
          (sum 176), whereas summing first (2000*0.0875=175) gives 175 — the calc pins round-per-line-then-sum so
          tax_total is 176, not 175.
        test_recipe:
          setup:
            - "Two-line cart: product A unit 1000 tax 875 qty1; product B unit 1000 tax 875 qty1; promo 0."
            - "Per-line tax 88+88 = 176 (NOT 175 from sum-then-round); subtotal 2000 → standard ship 999; grand 3175."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c2b@x.com", full_name: "C2B" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /warehouses"
              payload: { code: "W2B", name: "Main", fulfillment_priority: 1 }
              as: StoreAdmin
              captures: { wh_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "A2B", title: "A2B", unit_price_cents: 1000, tax_rate_bps: 875, return_window_days: 30, final_sale: false }
              as: StoreAdmin
              captures: { pa_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "B2B", title: "B2B", unit_price_cents: 1000, tax_rate_bps: 875, return_window_days: 30, final_sale: false }
              as: StoreAdmin
              captures: { pb_id: $.data.id }
            - call: "POST /inventory"
              payload: { product_id: "${pa_id}", warehouse_id: "${wh_id}", on_hand_qty: 50 }
              as: StoreAdmin
            - call: "POST /inventory"
              payload: { product_id: "${pb_id}", warehouse_id: "${wh_id}", on_hand_qty: 50 }
              as: StoreAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", promo_flat_cents: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${pa_id}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ola_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${pb_id}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { olb_id: $.data.id }
            - call: "GET /orders/${ord_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_v: $.data.version }
          trigger:
            - call: "POST /orders/${ord_id}/checkout"
              payload: { expected_order_version: "${ord_v}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /order-lines/${ola_id}"
              payload: {}
              as: StoreAdmin
              captures: { la_tax: $.data.line_tax_cents }
          assert:
            - "OrderLine.${ola_id}.line_tax_cents == 88"
            - "OrderLine.${olb_id}.line_tax_cents == 88"
            - "Order.${ord_id}.tax_total_cents == 176  # round-per-line-then-sum; sum-then-round would be 175"
            - "Order.${ord_id}.grand_total_cents == 3175"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_parallel_payment_and_fulfillment_dimensions_evolve_independently
        grounds:
          - state_machines.Order.payment_status=AUTHORIZED_to_payment_status=CAPTURED
          - state_machines.Order.fulfillment_status=UNFULFILLED|BACKORDERED|PARTIALLY_SHIPPED_to_fulfillment_status=PARTIALLY_SHIPPED|SHIPPED
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: |
          Order carries two independent state axes: capture-payment advances payment_status CAPTURED while
          fulfillment_status stays UNFULFILLED, then shipping advances fulfillment_status to SHIPPED while
          payment_status remains CAPTURED — neither dimension forces the other.
        test_recipe:
          setup:
            - "Single-line order (product unit 3000, qty1, ample stock), checked out and captured but not yet shipped."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "par@x.com", full_name: "Par" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /warehouses"
              payload: { code: "WP", name: "Main", fulfillment_priority: 1 }
              as: StoreAdmin
              captures: { wh_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "PP", title: "PP", unit_price_cents: 3000, tax_rate_bps: 0, return_window_days: 30, final_sale: false }
              as: StoreAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /inventory"
              payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", on_hand_qty: 10 }
              as: StoreAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${prod_id}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ol_id: $.data.id }
            - call: "GET /orders/${ord_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_v: $.data.version }
            - call: "POST /orders/${ord_id}/checkout"
              payload: { expected_order_version: "${ord_v}" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${ord_id}/capture-payment"
              payload: {}
              as: StoreAdmin
              captures: { pay_after_capture: $.data.payment_status, fulfil_after_capture: $.data.fulfillment_status }
            - call: "GET /order-lines/${ol_id}/reservations"
              payload: {}
              as: StoreAdmin
              captures: { res_id: "$.data[0].id" }
            - call: "POST /orders/${ord_id}/shipments"
              payload: { warehouse_id: "${wh_id}", lines: [{ reservation_id: "${res_id}", qty: 1 }] }
              as: WarehouseOperator
              captures: { ship_id: $.data.id }
            - call: "POST /shipments/${ship_id}/ship"
              payload: {}
              as: WarehouseOperator
            - call: "GET /orders/${ord_id}"
              payload: {}
              as: StoreAdmin
              captures: { pay_after_ship: $.data.payment_status, fulfil_after_ship: $.data.fulfillment_status }
          assert:
            - "after capture: Order.${ord_id}.payment_status == CAPTURED and Order.${ord_id}.fulfillment_status == UNFULFILLED"
            - "after ship: Order.${ord_id}.payment_status == CAPTURED and Order.${ord_id}.fulfillment_status == SHIPPED"

      - name: return_authorization_branches_approved_into_refunded_vs_exchanged
        grounds:
          - state_machines.ReturnAuthorization.APPROVED_to_REFUNDED
          - state_machines.ReturnAuthorization.APPROVED_to_EXCHANGED
          - entities.ReturnAuthorization.fields.status
        distinguishing_aspect: |
          From APPROVED the RMA forks: settle on a REFUND-resolution RMA lands in REFUNDED with a Refund created,
          while settle on an EXCHANGE-resolution RMA lands in EXCHANGED with an exchange delta and no cash Refund —
          divergent terminal states and side-effect sets from the same APPROVED node on ReturnAuthorization.
        test_recipe:
          setup:
            - "Two CAPTURED+DELIVERED single-line orders for one customer (product unit 2000, qty1, window 30d, restock 0)."
            - "One RMA opened REFUND, the other EXCHANGE to a 2000-cent in-stock product (delta 0)."
            - "Clock 2026-06-10, delivered 2026-06-05."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: StoreAdmin
            - call: "POST /customers"
              payload: { email: "br@x.com", full_name: "Br" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /warehouses"
              payload: { code: "WB", name: "Main", fulfillment_priority: 1 }
              as: StoreAdmin
              captures: { wh_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "BR1", title: "BR1", unit_price_cents: 2000, tax_rate_bps: 0, restocking_fee_bps: 0, return_window_days: 30, final_sale: false }
              as: StoreAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "BR2", title: "BR2", unit_price_cents: 2000, tax_rate_bps: 0, return_window_days: 30, final_sale: false }
              as: StoreAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /inventory"
              payload: { product_id: "${p1_id}", warehouse_id: "${wh_id}", on_hand_qty: 50 }
              as: StoreAdmin
            - call: "POST /inventory"
              payload: { product_id: "${p2_id}", warehouse_id: "${wh_id}", on_hand_qty: 50 }
              as: StoreAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ordA_id: $.data.id }
            - call: "POST /orders/${ordA_id}/lines"
              payload: { product_id: "${p1_id}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { olA_id: $.data.id }
            - call: "GET /orders/${ordA_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ordA_v: $.data.version }
            - call: "POST /orders/${ordA_id}/checkout"
              payload: { expected_order_version: "${ordA_v}" }
              as: Customer
              as_user_id: "${cust_id}"
