              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { dm1_course_after: $.data.placed_course_id, dm1_base_after: $.data.base_confidence_score, dm1_v_after: $.data.version, dm1_state_after: $.data.placement_state }
            - call: "POST /placement-determinations"
              payload: { student_id: "${sm1}", subject_area: "MATH", expected_student_version: "${m_v}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { dm2: $.data.id, dm2_course: $.data.placed_course_id, dm2_rule: $.data.applied_rule_id, dm2_base: $.data.base_confidence_score, dm2_state: $.data.placement_state }
            - call: "GET /placement-determinations/${dm1}"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { dm1_final_state: $.data.placement_state, dm1_superseded_by: $.data.superseded_by_id }
            - call: "GET /students/${sm1}/determinations"
              payload: { subject_area: "MATH" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { hist_first: "$.data[0].id" }
          assert:
            - "${dm1_course} == \"${c_050}\" and ${dm1_rule} == \"${ra}\" and ${dm1_base} == 31.3 (setup) — 2.50 sits in RA's band because min_hs_gpa is inclusive and max_hs_gpa is exclusive; 2.50 / 4.0 * 100 == 62.5, 62.5 * 0.5 == 31.25, base rounds to 31.3"
            - "${m_gpa} == 3.50, ${m_status} == \"VERIFIED\", ${m_recorded} == \"2025-06-01T00:00:00Z\", ${m_el} == \"NOT_EL\", ${m_self} == null — only the supplied field changed; the four omitted fields were NOT nulled"
            - "${m_v} == ${sm1_v0} + 2 — the determination bumped the Student once and the measures update bumped it again"
            - "${dm1_course_after} == \"${c_050}\" and ${dm1_base_after} == 31.3 and ${dm1_v_after} == ${dm1_v} and ${dm1_state_after} == \"PROVISIONAL\" — the existing determination is NOT recomputed, re-placed or re-scored by the measures update"
            - "${dm2_course} == \"${c_100}\" and ${dm2_rule} == \"${rb}\" and ${dm2_base} == 43.8 — the NEW determination reflects the new measure; 3.50 / 4.0 * 100 == 87.5, 87.5 * 0.5 == 43.75, base rounds half-up to 43.8"
            - "${dm2_state} == \"PROVISIONAL\", ${dm1_final_state} == \"SUPERSEDED\" and ${dm1_superseded_by} == \"${dm2}\" — the supersede side effect back-fills the pointer on the OLD row"
            - "GET /students/${sm1}/determinations reports total_count 2 and ${hist_first} == \"${dm1}\" — the superseded row is retained in created_at ASC order, not deleted"

      - name: finalize_checks_the_evidence_axis_before_the_validity_window
        claim_type: Conditional action
        grounds: ["endpoints[POST /placement-determinations/{determination_id}/finalize]", "errors[ERR_EVIDENCE_NOT_VERIFIED]", "errors[ERR_PLACEMENT_EXPIRED]", calculations.placement_validity_window]
        distinguishing_aspect: |
          FINAL is gated on the OTHER axis plus a strict clock test, and the evidence
          gate is checked first: a determination that is both UNVERIFIED and expired
          answers ERR_EVIDENCE_NOT_VERIFIED. The window test is clock < expires_at, so
          the expiry instant itself already refuses. Note also that the evidence axis
          can be promoted manually even though the stored confidence_score is far below
          CONFIDENCE_VERIFY_MIN — the 70.0 threshold only decides the INITIAL state.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z."
            - "Course MATH-050 and one ACTIVE rule TRANSCRIPT_GPA -> MATH-050 (min_hs_gpa 2.0)."
            - "Students SF1, SF2 and SF3, all hs_gpa 2.50 VERIFIED with transcript_recorded_at 2025-06-01T00:00:00Z, each with one determination minted at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /courses"
              payload: { course_code: "MATH-050", title: "Pre-Algebra", subject_area: "MATH", level_rank: 50, units: 5.0, is_support_course: false, transfer_level: false }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_050: $.data.id }
            - call: "POST /placement-rules"
              payload: { subject_area: "MATH", measure_type: "TRANSCRIPT_GPA", target_course_id: "${c_050}", priority_rank: 10, min_hs_gpa: 2.0, effective_from: "2026-07-01T00:00:00Z", version_label: "V1" }
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { rule: $.data.id }
            - call: "POST /placement-rules/${rule}/activate"
              payload: {}
              as: AssessmentDirector
              as_user_id: "director-1"
            - call: "POST /students"
              payload: { student_number: "SF1", full_name: "Student F One", race_ethnicity_code: "WHITE", hs_gpa: 2.50, hs_transcript_status: "VERIFIED", transcript_recorded_at: "2025-06-01T00:00:00Z" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { sf1: $.data.id, sf1_v: $.data.version }
            - call: "POST /placement-determinations"
              payload: { student_id: "${sf1}", subject_area: "MATH", expected_student_version: "${sf1_v}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { df1: $.data.id, df1_ev: $.data.evidence_state, df1_conf: $.data.confidence_score, df1_pen: $.data.staleness_penalty, df1_days: $.data.validity_days, df1_exp: $.data.expires_at }
            - call: "POST /students"
              payload: { student_number: "SF2", full_name: "Student F Two", race_ethnicity_code: "ASIAN", hs_gpa: 2.50, hs_transcript_status: "VERIFIED", transcript_recorded_at: "2025-06-01T00:00:00Z" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { sf2: $.data.id, sf2_v: $.data.version }
            - call: "POST /placement-determinations"
              payload: { student_id: "${sf2}", subject_area: "MATH", expected_student_version: "${sf2_v}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { df2: $.data.id }
            - call: "POST /students"
              payload: { student_number: "SF3", full_name: "Student F Three", race_ethnicity_code: "MULTI", hs_gpa: 2.50, hs_transcript_status: "VERIFIED", transcript_recorded_at: "2025-06-01T00:00:00Z" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { sf3: $.data.id, sf3_v: $.data.version }
            - call: "POST /placement-determinations"
              payload: { student_id: "${sf3}", subject_area: "MATH", expected_student_version: "${sf3_v}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { df3: $.data.id }
          trigger:
            - call: "POST /placement-determinations/${df1}/finalize"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { err_unverified: $.data.error_id }
            - call: "GET /students/${sf1}"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { sf1_v_before: $.data.version }
            - call: "POST /placement-determinations/${df1}/evidence"
              payload: { target_evidence_state: "VERIFIED", note: "Official transcript on file." }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { df1_ev2: $.data.evidence_state, df1_pl2: $.data.placement_state, df1_conf2: $.data.confidence_score }
            - call: "POST /placement-determinations/${df1}/finalize"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { df1_pl3: $.data.placement_state, df1_ev3: $.data.evidence_state }
            - call: "GET /students/${sf1}"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { sf1_v_after: $.data.version }
            - call: "POST /placement-determinations/${df2}/evidence"
              payload: { target_evidence_state: "VERIFIED" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { df2_ev: $.data.evidence_state }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-28T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /placement-determinations/${df2}/finalize"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { err_expired: $.data.error_id }
            - call: "POST /placement-determinations/${df3}/finalize"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { err_both: $.data.error_id }
            - call: "GET /placement-determinations/${df2}"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { df2_pl: $.data.placement_state }
          assert:
            - "${df1_ev} == \"UNVERIFIED\", ${df1_conf} == 31.3, ${df1_pen} == 0.0, ${df1_days} == 180, ${df1_exp} == \"2027-01-28T00:00:00Z\" (setup) — base 31.3 is below VALIDITY_TIER_MID_MIN so validity_days is 180; staleness d == 606 days from 2025-06-01 to expires_at, under the 1095-day grace, so the penalty is 0.0; 31.3 < 70.0 leaves the evidence axis UNVERIFIED even though hs_transcript_status is VERIFIED"
            - "${err_unverified} == \"ERR_EVIDENCE_NOT_VERIFIED\" with HTTP 422 — FINAL is gated on the independent evidence axis"
            - "${df1_ev2} == \"VERIFIED\", ${df1_pl2} == \"PROVISIONAL\" and ${df1_conf2} == 31.3 — the manual promotion moves ONLY the evidence axis and does NOT rewrite confidence_score; the 70.0 threshold governed only the initial state"
            - "${df1_pl3} == \"FINAL\" and ${df1_ev3} == \"VERIFIED\" — the satisfaction leg, with clock 2026-08-01 strictly before expires_at"
            - "${sf1_v_after} == ${sf1_v_before} + 1 — finalize bumps the Student version, so any expected_student_version held across it is now stale"
            - "${df2_ev} == \"VERIFIED\" then ${err_expired} == \"ERR_PLACEMENT_EXPIRED\" with HTTP 422 at clock == expires_at exactly — the test is a strict less-than, so the expiry instant is already too late"
            - "${err_both} == \"ERR_EVIDENCE_NOT_VERIFIED\", NOT \"ERR_PLACEMENT_EXPIRED\" — df3 is BOTH unverified and expired, and the evidence gate is declared first"
            - "${df2_pl} == \"PROVISIONAL\" — neither refusal moved the placement axis"

      - name: unpairing_breaks_the_pair_but_keeps_it_re_pairable
        claim_type: Action endpoint
        grounds: ["endpoints[POST /sections/{section_id}/unpair]", state_machines.Section.pairing_state]
        excluded_because:
          difficulty_instance: non_linear_state_machine / section_pairing_paired_to_broken_to_paired_reentry
          rationale: "The named §1.8 instance walks PAIRED -> PAIR_BROKEN -> PAIRED and asserts linked_section_id retention, role_in_pair NONE and the available_seats variant switch on both halves."

      - name: pairing_links_two_sections_of_different_courses
        claim_type: Cross-reference link
        grounds: ["endpoints[POST /sections/{section_id}/pair]", "errors[ERR_COREQ_SECTION_MISMATCH]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / paired_section_meeting_blocks_may_be_exactly_adjacent
          rationale: "The named §1.8 instance pairs a primary with its support section, exercising both the successful link and the ordered refusals on the pair endpoint."

  # ===========================================================================
  # 6. From Table 6 (Errors)
  # ===========================================================================
  - section: Errors
    instances:

      - name: every_unknown_identifier_answers_its_own_typed_404_while_malformed_ones_answer_400
        claim_type: Triggerable
        grounds: ["errors[ERR_REQUISITE_NOT_FOUND]", "errors[ERR_RULE_NOT_FOUND]", "errors[ERR_ADMINISTRATION_NOT_FOUND]", "errors[ERR_ATTEMPT_NOT_FOUND]", "errors[ERR_DETERMINATION_NOT_FOUND]", "errors[ERR_APPEAL_NOT_FOUND]", "errors[ERR_SECTION_NOT_FOUND]", "errors[ERR_REGISTRATION_NOT_FOUND]", "errors[ERR_OVERRIDE_NOT_FOUND]", "errors[ERR_STUDY_NOT_FOUND]", "validations[priority=4]", "validations[priority=5]", "validations[priority=6]"]
        distinguishing_aspect: |
          Ten identifier families each have their OWN 404 code, and the code is chosen
          by the identifier's TYPE, not by the endpoint: an unknown override_id in the
          BODY of POST /registrations answers ERR_OVERRIDE_NOT_FOUND, and an unknown
          support_section_id answers ERR_SECTION_NOT_FOUND. A syntactically malformed
          identifier is a different story: priority 4 answers ERR_INVALID_REQUEST (400)
          before any lookup can run, so well-formed-but-absent and malformed inputs must
          not be collapsed into one branch.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
            - "Course MATH-050, ACTIVE rule TRANSCRIPT_GPA -> MATH-050, Section secN (room R790, capacity 5) OPEN, Student SN1."
            - "The probe UUID 99999999-8888-4777-8666-555555555555 is well-formed and belongs to no entity of any type."
          setup_api_calls:
            - call: "POST /courses"
              payload: { course_code: "MATH-050", title: "Pre-Algebra", subject_area: "MATH", level_rank: 50, units: 5.0, is_support_course: false, transfer_level: false }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_050: $.data.id }
            - call: "POST /sections"
              payload: { course_id: "${c_050}", term_code: "2026FA", room_code: "R790", meets_start_at: "2026-09-01T17:00:00Z", meets_end_at: "2026-09-01T18:00:00Z", seat_capacity: 5 }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { secn: $.data.id }
            - call: "POST /sections/${secn}/status"
              payload: { target_status: "OPEN" }
              as: Registrar
              as_user_id: "registrar-1"
            - call: "POST /students"
              payload: { student_number: "SN1", full_name: "Student N One", race_ethnicity_code: "UNKNOWN" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { sn1: $.data.id }
            - call: "GET /sections/${secn}"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { secn_v: $.data.version }
          trigger:
            - call: "GET /course-requisites/99999999-8888-4777-8666-555555555555"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { e_req: $.data.error_id }
            - call: "POST /placement-rules/99999999-8888-4777-8666-555555555555/activate"
              payload: {}
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { e_rule: $.data.error_id }
            - call: "GET /test-administrations/99999999-8888-4777-8666-555555555555"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { e_adm: $.data.error_id }
            - call: "POST /test-attempts/99999999-8888-4777-8666-555555555555/check-in"
              payload: {}
              as: Proctor
              as_user_id: "proctor-1"
              captures: { e_att: $.data.error_id }
            - call: "GET /placement-determinations/99999999-8888-4777-8666-555555555555"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { e_det: $.data.error_id }
            - call: "GET /placement-appeals/99999999-8888-4777-8666-555555555555"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { e_app: $.data.error_id }
            - call: "GET /sections/99999999-8888-4777-8666-555555555555"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { e_sec: $.data.error_id }
            - call: "POST /registrations/99999999-8888-4777-8666-555555555555/confirm"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { e_reg: $.data.error_id }
            - call: "GET /prerequisite-overrides/99999999-8888-4777-8666-555555555555"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { e_ovr: $.data.error_id }
            - call: "GET /validation-studies/99999999-8888-4777-8666-555555555555"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { e_std: $.data.error_id }
            - call: "POST /registrations"
              payload: { student_id: "${sn1}", section_id: "${secn}", override_id: "99999999-8888-4777-8666-555555555555", expected_section_version: "${secn_v}" }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { e_body_ovr: $.data.error_id }
            - call: "POST /sections/${secn}/pair"
              payload: { support_section_id: "99999999-8888-4777-8666-555555555555" }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { e_body_sec: $.data.error_id }
            - call: "POST /registrations"
              payload: { student_id: "${sn1}", section_id: "not-a-uuid", expected_section_version: "${secn_v}" }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { e_malformed: $.data.error_id }
            - call: "GET /sections/${secn}"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { secn_v_after: $.data.version, secn_held: $.data.seats_held }
          assert:
            - "${e_req} == \"ERR_REQUISITE_NOT_FOUND\", ${e_rule} == \"ERR_RULE_NOT_FOUND\", ${e_adm} == \"ERR_ADMINISTRATION_NOT_FOUND\", ${e_att} == \"ERR_ATTEMPT_NOT_FOUND\", ${e_det} == \"ERR_DETERMINATION_NOT_FOUND\" — all HTTP 404 at priority 5"
            - "${e_app} == \"ERR_APPEAL_NOT_FOUND\", ${e_sec} == \"ERR_SECTION_NOT_FOUND\", ${e_reg} == \"ERR_REGISTRATION_NOT_FOUND\", ${e_ovr} == \"ERR_OVERRIDE_NOT_FOUND\", ${e_std} == \"ERR_STUDY_NOT_FOUND\" — all HTTP 404 at priority 5"
            - "${e_body_ovr} == \"ERR_OVERRIDE_NOT_FOUND\" (HTTP 404, priority 6) — the SAME endpoint that would otherwise succeed answers the OVERRIDE-typed 404 for a body identifier, not a generic 400"
            - "${e_body_sec} == \"ERR_SECTION_NOT_FOUND\" (HTTP 404, priority 6) — support_section_id is a Section identifier, so it borrows the Section code even though the path id resolves"
            - "${e_malformed} == \"ERR_INVALID_REQUEST\" with HTTP 400, NOT a 404 — priority 4 shape validation runs before the priority 6 lookup"
            - "${secn_v_after} == ${secn_v} and ${secn_held} == 0 — none of the fourteen refusals held a seat or bumped the OCC parent"

      - name: uniqueness_is_scoped_to_the_active_triple_and_to_the_requisite_type
        claim_type: Triggerable
        grounds: ["errors[ERR_DUPLICATE_STUDENT_NUMBER]", "errors[ERR_DUPLICATE_COURSE_CODE]", "errors[ERR_DUPLICATE_REQUISITE]", "validations[priority=25]"]
        distinguishing_aspect: |
          The requisite key is the (course_id, requisite_course_id, requisite_type)
          triple restricted to ACTIVE rows, so the SAME course pair may carry both a
          PREREQUISITE and an ADVISORY edge, and retiring an edge frees the triple for
          re-creation. Implementations that key on the course pair alone, or that ignore
          status, get two of these three legs wrong.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
            - "Courses MATH-050 and MATH-100; Student SDUPX on file."
            - "One ACTIVE PREREQUISITE edge MATH-100 -> MATH-050 with min_grade C."
          setup_api_calls:
            - call: "POST /courses"
              payload: { course_code: "MATH-050", title: "Pre-Algebra", subject_area: "MATH", level_rank: 50, units: 5.0, is_support_course: false, transfer_level: false }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_050: $.data.id }
            - call: "POST /courses"
              payload: { course_code: "MATH-100", title: "College Algebra", subject_area: "MATH", level_rank: 100, units: 4.0, is_support_course: false, transfer_level: true }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_100: $.data.id }
            - call: "POST /course-requisites"
              payload: { course_id: "${c_100}", requisite_course_id: "${c_050}", requisite_type: "PREREQUISITE", min_grade: "C", enforcement: "BLOCKING" }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { req1: $.data.id, req1_status: $.data.status }
            - call: "POST /students"
              payload: { student_number: "SDUPX", full_name: "Student Dup X", race_ethnicity_code: "WHITE" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { sdx: $.data.id }
          trigger:
            - call: "POST /students"
              payload: { student_number: "SDUPX", full_name: "Impostor With The Same Number", race_ethnicity_code: "ASIAN" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { e_stu: $.data.error_id }
            - call: "POST /courses"
              payload: { course_code: "MATH-050", title: "Another Pre-Algebra", subject_area: "MATH", level_rank: 55, units: 3.0, is_support_course: false, transfer_level: false }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { e_crs: $.data.error_id }
            - call: "POST /course-requisites"
              payload: { course_id: "${c_100}", requisite_course_id: "${c_050}", requisite_type: "PREREQUISITE", min_grade: "B", enforcement: "BLOCKING" }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { e_req: $.data.error_id }
            - call: "POST /course-requisites"
              payload: { course_id: "${c_100}", requisite_course_id: "${c_050}", requisite_type: "ADVISORY", min_grade: "C", enforcement: "WARNING" }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { req2: $.data.id, req2_type: $.data.requisite_type }
            - call: "POST /course-requisites/${req1}/retire"
              payload: {}
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { req1_retired: $.data.status }
            - call: "POST /course-requisites"
              payload: { course_id: "${c_100}", requisite_course_id: "${c_050}", requisite_type: "PREREQUISITE", min_grade: "B", enforcement: "BLOCKING" }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { req3: $.data.id, req3_grade: $.data.min_grade }
            - call: "GET /course-requisites"
              payload: { course_id: "${c_100}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { first_edge_status: "$.data[0].status" }
          assert:
            - "${req1_status} == \"ACTIVE\" (setup)"
            - "${e_stu} == \"ERR_DUPLICATE_STUDENT_NUMBER\" with HTTP 409 at priority 25"
            - "${e_crs} == \"ERR_DUPLICATE_COURSE_CODE\" with HTTP 409 — a different title, level_rank and units do not make it a different course"
            - "${e_req} == \"ERR_DUPLICATE_REQUISITE\" with HTTP 409 — a different min_grade does not make it a different edge; min_grade is NOT part of the key"
            - "${req2_type} == \"ADVISORY\" — the SAME course pair is accepted under a different requisite_type, so the type IS part of the key"
            - "${req1_retired} == \"RETIRED\" and ${req3_grade} == \"B\" — after the retirement the PREREQUISITE triple is free again, so uniqueness is scoped to ACTIVE rows only"
            - "GET /course-requisites?course_id=${c_100} reports total_count 3 and ${first_edge_status} == \"RETIRED\" — the retired edge is retained in created_at ASC order alongside the two live ones"

      - name: rule_activation_gates_check_the_corequisite_wiring_before_the_measure_bounds
        claim_type: Triggerable
        grounds: ["errors[ERR_COREQ_COURSE_INVALID]", "errors[ERR_RULE_MEASURE_INCOMPLETE]", "errors[ERR_COREQ_PAIRING_REQUIRED]", "validations[priority=15]", "validations[priority=26]"]
