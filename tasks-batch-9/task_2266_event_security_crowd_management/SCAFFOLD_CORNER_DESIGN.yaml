      The second arm of priority 15 keys on a different stored actor field and a different pair of verbs, and critically it does NOT restrict SUBMIT — so the author may push their own review forward but may not return or finalise it. Getting to the refusal therefore requires the review to be authored by one user and submitted by another, which is the only configuration in which both arms are observable.
