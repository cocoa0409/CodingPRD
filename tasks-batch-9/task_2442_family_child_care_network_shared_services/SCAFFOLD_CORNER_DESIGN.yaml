        distinguishing_aspect: "Two meal lines for the same child_ref on the same served_on are each individually within the caps (1 breakfast + 1 lunch), but together they total 4 breakfast-plus-lunch meals against the cap of 2, so ERR_MEAL_CAP_EXCEEDED is returned at HTTP 422."
