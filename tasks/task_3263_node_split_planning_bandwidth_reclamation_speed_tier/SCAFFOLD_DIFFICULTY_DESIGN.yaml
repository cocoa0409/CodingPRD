              as: PlatformAdmin
              captures: { fa: $.data.id }
            - call: "POST /franchise-areas/${fa}/optical-nodes"
              payload: { node_code: "NE-R2", homes_passed: 200, downstream_spectrum_mhz: 96, upstream_config: "LEGACY" }
              as: NetworkPlanner
              captures: { on: $.data.id }
            - call: "POST /optical-nodes/${on}/spectrum-blocks"
              payload: { block_type: "LEGACY_VIDEO", mhz: 24 }
              as: CapacityEngineer
              captures: { v1: $.data.id }
            - call: "POST /optical-nodes/${on}/spectrum-blocks"
              payload: { block_type: "LEGACY_VIDEO", mhz: 24 }
              as: CapacityEngineer
            - call: "POST /optical-nodes/${on}/spectrum-blocks"
              payload: { block_type: "DATA", mhz: 48 }
              as: CapacityEngineer
            - call: "POST /optical-nodes/${on}/service-groups"
              payload: { sg_code: "SG-R2", homes_passed: 100, warn_threshold_pct: 70, critical_threshold_pct: 85, utilization_method: "PEAK_PCT95" }
              as: CapacityEngineer
              captures: { sg: $.data.id }
            - call: "POST /service-groups/${sg}/utilization-samples"
              payload: { measured_at: "2026-09-30T18:00:00Z", downstream_mbps: 350, upstream_mbps: 10 }
              as: PlatformAdmin
            - call: "GET /service-groups/${sg}"
              as: Any
              captures: { sg_v: $.data.version }
            - call: "POST /service-groups/${sg}/capacity-actions"
              payload: { action_type: "SPECTRUM_RECLAIM", target_block_ids: ["${v1}"], expected_service_group_version: "${sg_v}" }
              as: NetworkPlanner
              captures: { ca: $.data.id }
            - call: "POST /capacity-actions/${ca}/approve"
              as: CapacityEngineer
            - call: "POST /capacity-actions/${ca}/begin"
              as: CapacityEngineer
            - call: "POST /service-groups/${sg}/customer-premises"
              payload: { premise_ref: "P-R1", address: "3 Oak Ave" }
              as: ProvisioningAgent
              captures: { cp: $.data.id }
            - call: "POST /customer-premises/${cp}/equipment"
              payload: { model: "SB6183", docsis_version: "3.0", capability_class: "D30", max_downstream_mbps: 300, video_legacy: true }
              as: ProvisioningAgent
              captures: { cpe: $.data.id }
            - call: "POST /capacity-actions/${ca}/migration-waves"
              payload: { wave_code: "W1", window_start: "2026-10-01T00:00:00Z", window_end: "2026-10-02T00:00:00Z", target_cpe_ids: ["${cpe}"] }
              as: NetworkPlanner
              captures: { w1: $.data.id }
            - call: "POST /migration-waves/${w1}/execute"
              as: FieldOpsCoordinator
          trigger:
            - call: "POST /capacity-actions/${ca}/complete"
              as: CapacityEngineer
            - call: "GET /spectrum-blocks/${v1}"
              as: Any
            - call: "GET /service-groups/${sg}"
              as: Any
          assert:
            - "CapacityAction.${ca}.status == COMPLETED"
            - "SpectrumBlock.${v1}.status == DATA_ACTIVE and capacity_mbps == 152"
            - "ServiceGroup.${sg}.downstream_capacity_mbps == 456 (304 + 152)"
            - "ServiceGroup.${sg}.current_utilization_pct == 76.8 (350*100/456 round_half_up 1dp) and posture == ELEVATED — de-escalated from CRITICAL by the capacity increase, with no new sample ingested"
            - "posture reflects the recomputed capacity, not the pre-completion value"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: schedule_state_error_beats_window_conflict
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Category pair state vs business_temporal: scheduling a project still in
          PERMIT_REVIEW (never granted) with a window that also overlaps another
          scheduled project must return ERR_INVALID_STATE, not ERR_WINDOW_CONFLICT —
          the lifecycle check at priority 6 beats the temporal check at priority 8.
        test_recipe:
          setup:
            - "Two NODE_SPLIT actions on two service groups of one franchise area; project A granted and scheduled 2026-11-01..2026-11-10; project B still in PERMIT_REVIEW"
