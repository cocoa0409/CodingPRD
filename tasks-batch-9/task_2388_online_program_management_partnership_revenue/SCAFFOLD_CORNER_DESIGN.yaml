            - "RemittanceStatement.${st_tier_id}.share_gross_cents == 89599"
            - "RemittanceStatement.${st_tier_id}.marketing_recoupment_cents == 13439"
            - "RemittanceStatement.${st_tier_id}.subtotal_cents == 76160"
