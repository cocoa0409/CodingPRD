scenario: |
  Charitable Medical Debt Purchase & Account Abolishment (Undue Medical Debt): portfolio sourcing from hospitals, physician groups and debt buyers with account-level data files, eligibility screening against income and insolvency criteria to select accounts for abolishment, purchase pricing on bundled portfolios with contractual prohibition on collection, account abolishment and notification letters to individuals who did not apply for relief, credit bureau deletion requests for reported accounts and tax treatment of relieved amounts, donor campaign targeting where gifts are earmarked to a geography or hospital, hospital partnerships that combine abolishment with financial assistance policy improvements, impact reporting on households relieved and dollars abolished

domain_name: charitable-medical-debt-abolishment
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: SourceOrganization
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Seller organization legal name" }
      - { name: org_type, type: enum, source: input, description: "HOSPITAL | PHYSICIAN_GROUP | DEBT_BUYER", constraints: "immutable after creation" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state of the organization's principal office" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE }

  - name: EligibilityPolicy
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Policy label" }
      - { name: state_code, type: string, source: input, description: "Jurisdiction scope; two policies with the same state_code may not have overlapping ACTIVE windows" }
      - { name: fpl_multiplier, type: number, source: input, description: "Income cap multiplier applied to the Federal Poverty Level base table; must be > 0" }
      - { name: insolvency_qualifies, type: boolean, source: input, description: "If true, insolvent debtors qualify even above the income cap" }
      - { name: effective_from, type: string, source: input, description: "Window start date YYYY-MM-DD; half-open interval [effective_from, effective_to)" }
      - { name: effective_to, type: string, source: input, description: "Window end date YYYY-MM-DD (exclusive); must be after effective_from" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | RETIRED", default: DRAFT }

  - name: Portfolio
    parent: null
    common_fields: true
    fields:
      - { name: source_org_id, type: string, source: input, description: "FK -> SourceOrganization.id; seller of this portfolio" }
      - { name: label, type: string, source: input, description: "Human-readable portfolio label" }
      - { name: face_value_cents, type: integer, source: input, description: "Declared total face value of the bundled accounts" }
      - { name: asking_price_cents, type: integer, source: input, description: "Seller asking price" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | SCREENING | PRICED | CONTRACTED | SETTLED | ABOLISHING | CLOSED | CANCELLED", default: DRAFT }
      - { name: eligible_face_value_cents, type: integer, source: computed, description: "Sum of balance_cents over accounts with eligibility_status == ELIGIBLE; recomputed on screening execution" }
      - { name: eligible_account_count, type: integer, source: computed, description: "Count of accounts with eligibility_status == ELIGIBLE" }
      - { name: quoted_price_cents, type: integer, source: computed, description: "Price quote from portfolio_price_quote; null until first price-quote" }
      - { name: purchased_price_cents, type: integer, source: system, description: "Contract price paid at settlement; null until settled" }
      - { name: abolished_face_value_cents, type: integer, source: computed, description: "Sum of total_abolished_cents over FINALIZED abolishment batches" }

  - name: DebtAccount
    parent: null
    common_fields: true
    fields:
      - { name: portfolio_id, type: string, source: system, description: "FK -> Portfolio.id; owning portfolio (path-bound at import)" }
      - { name: external_ref, type: string, source: input, description: "Seller's account reference" }
      - { name: debtor_household_key, type: string, source: input, description: "Household dedupe key shared by accounts of the same household" }
      - { name: debtor_zip, type: string, source: input, description: "Debtor ZIP code" }
      - { name: debtor_state, type: string, source: input, description: "Debtor state code" }
      - { name: household_size, type: integer, source: input, description: "Household size; nullable; when present must be >= 1 (ERR_INVALID_HOUSEHOLD_DATA)" }
      - { name: annual_income_cents, type: integer, source: input, description: "Debtor annual household income; nullable (missing data routes to NEEDS_REVIEW or insolvency path)" }
      - { name: is_insolvent, type: boolean, source: input, description: "Whether debts exceed assets per seller attestation" }
      - { name: balance_cents, type: integer, source: input, description: "Outstanding balance at file cut; provisional relief value" }
      - { name: accrued_adjustment_cents, type: integer, source: input, description: "Post-cut balance adjustments (residual interest, reversals); may be negative", default: 0 }
      - { name: reported_to_bureau, type: boolean, source: input, description: "Whether the seller reported this account to a credit bureau" }
      - { name: bureau_name, type: enum, source: input, description: "EQUIFAX | EXPERIAN | TRANSUNION; required when reported_to_bureau is true, must be null otherwise" }
      - { name: mailing_address, type: string, source: input, description: "Debtor mailing address used for notification letters; nullable" }
      - { name: eligibility_status, type: enum, source: system, description: "UNSCREENED | ELIGIBLE | INELIGIBLE | NEEDS_REVIEW", default: UNSCREENED }
      - { name: lifecycle_status, type: enum, source: system, description: "AVAILABLE | PURCHASED | ABOLISHED | EXCLUDED", default: AVAILABLE }
      - { name: bureau_status, type: enum, source: system, description: "NOT_REPORTED | REPORTED | DELETION_REQUESTED | DELETED | DELETION_FAILED; initialized from reported_to_bureau" }
      - { name: abolished_amount_cents, type: integer, source: system, description: "Final relief value balance_cents + accrued_adjustment_cents recorded at abolishment; null until ABOLISHED" }
      - { name: abolished_at, type: datetime, source: system, description: "Logical-clock timestamp of abolishment; null until ABOLISHED" }
      - { name: abolished_batch_id, type: string, source: system, description: "FK -> AbolishmentBatch.id; batch that abolished this account; null until ABOLISHED" }

  - name: ScreeningRun
    parent: null
    common_fields: true
    fields:
      - { name: portfolio_id, type: string, source: system, description: "FK -> Portfolio.id; portfolio under screening (path-bound)" }
      - { name: policy_id, type: string, source: input, description: "FK -> EligibilityPolicy.id; policy applied to every account" }
      - { name: status, type: enum, source: system, description: "PENDING | COMPLETED | FAILED", default: PENDING }
      - { name: eligible_count, type: integer, source: computed, description: "Accounts computed ELIGIBLE at execute" }
      - { name: ineligible_count, type: integer, source: computed, description: "Accounts computed INELIGIBLE at execute" }
      - { name: needs_review_count, type: integer, source: computed, description: "Accounts computed NEEDS_REVIEW at execute" }
      - { name: executed_at, type: datetime, source: system, description: "Logical-clock timestamp of execution; null until COMPLETED" }

  - name: PurchaseContract
    parent: null
    common_fields: true
    fields:
      - { name: portfolio_id, type: string, source: system, description: "FK -> Portfolio.id; portfolio under contract (path-bound)" }
      - { name: contract_price_cents, type: integer, source: system, description: "Snapshot of Portfolio.quoted_price_cents at creation; version-pinned" }
      - { name: collection_prohibition, type: boolean, source: input, description: "Covenant: buyer may never attempt collection; must be true at execution" }
      - { name: no_resale, type: boolean, source: input, description: "Covenant: accounts may never be resold; must be true at execution" }
      - { name: status, type: enum, source: system, description: "DRAFT | EXECUTED | SETTLED | TERMINATED", default: DRAFT }
      - { name: executed_by, type: string, source: system, description: "X-User-ID of the ContractManager who executed; null until EXECUTED" }
      - { name: settled_by, type: string, source: system, description: "X-User-ID of the FinanceOfficer who settled; null until SETTLED" }
      - { name: terminated_reason, type: string, source: system, description: "Reason recorded at termination; null unless TERMINATED" }

  - name: DonorCampaign
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Campaign name" }
      - { name: earmark_type, type: enum, source: input, description: "GEOGRAPHY | HOSPITAL | GENERAL" }
      - { name: earmark_state_code, type: string, source: input, description: "Required iff earmark_type == GEOGRAPHY; null otherwise" }
      - { name: earmark_source_org_id, type: string, source: input, description: "FK -> SourceOrganization.id; required iff earmark_type == HOSPITAL; null otherwise" }
      - { name: goal_cents, type: integer, source: input, description: "Funding goal; campaign auto-transitions to FUNDED when raised_cents >= goal_cents" }
      - { name: raised_cents, type: integer, source: computed, description: "Sum of net_cents over RECEIVED donations", default: 0 }
      - { name: committed_cents, type: integer, source: computed, description: "Funds reserved by COMMITTED abolishment batches", default: 0 }
      - { name: spent_cents, type: integer, source: computed, description: "Funds converted to FINALIZED abolishment batches", default: 0 }
      - { name: status, type: enum, source: system, description: "OPEN | FUNDED | CLOSED", default: OPEN }

  - name: Donation
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: system, description: "FK -> DonorCampaign.id; receiving campaign (path-bound)" }
      - { name: donor_name, type: string, source: input, description: "Donor name" }
      - { name: donor_email, type: string, source: input, description: "Donor email" }
      - { name: gross_cents, type: integer, source: input, description: "Gross gift amount; must be > 0 (ERR_INVALID_AMOUNT)" }
      - { name: fee_cents, type: integer, source: computed, description: "Processing fee: round_half_up(gross_cents * FEE_PCT), rounded per donation before summing" }
      - { name: net_cents, type: integer, source: computed, description: "gross_cents - fee_cents" }
      - { name: status, type: enum, source: system, description: "PLEDGED | RECEIVED | REFUNDED", default: PLEDGED }

  - name: AbolishmentBatch
    parent: null
    common_fields: true
    fields:
      - { name: portfolio_id, type: string, source: system, description: "FK -> Portfolio.id; portfolio being abolished (path-bound)" }
      - { name: account_ids, type: array, source: input, description: "Account ids to abolish; every account must belong to the portfolio and be PURCHASED" }
      - { name: account_count, type: integer, source: computed, description: "Length of account_ids" }
      - { name: total_abolished_cents, type: integer, source: computed, description: "Sum over accounts of (balance_cents + accrued_adjustment_cents) — final relief value" }
      - { name: funding_allocations, type: array, source: computed, description: "Waterfall result at commit: [{campaign_id, amount_cents}] in draw order; empty until COMMITTED" }
      - { name: status, type: enum, source: system, description: "STAGING | COMMITTED | FINALIZED | REVERSED", default: STAGING }
      - { name: reversed_reason, type: string, source: system, description: "Reason recorded at reversal; null unless REVERSED" }

  - name: NotificationLetter
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> DebtAccount.id; abolished account notified" }
      - { name: batch_id, type: string, source: system, description: "FK -> AbolishmentBatch.id; batch that generated this letter" }
      - { name: channel, type: enum, source: system, description: "MAIL | EMAIL", default: MAIL }
      - { name: mailing_address, type: string, source: system, description: "Snapshot of the account mailing address; updated by requeue corrected_address" }
      - { name: status, type: enum, source: system, description: "QUEUED | SENT | DELIVERED | BOUNCED | UNDELIVERABLE | CANCELLED", default: QUEUED }
      - { name: attempt_count, type: integer, source: system, description: "Number of SENT -> BOUNCED cycles; >= MAX_LETTER_ATTEMPTS forces UNDELIVERABLE", default: 0 }
      - { name: sent_at, type: datetime, source: system, description: "Logical-clock timestamp of last send; null until first SENT" }

  - name: CreditDeletionRequest
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> DebtAccount.id; account whose tradeline must be deleted" }
      - { name: batch_id, type: string, source: system, description: "FK -> AbolishmentBatch.id; null for manually created requests" }
      - { name: bureau, type: enum, source: system, description: "EQUIFAX | EXPERIAN | TRANSUNION; copied from the account (or input at manual creation)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | REJECTED | ACKNOWLEDGED | FAILED | CANCELLED", default: DRAFT }
      - { name: resubmission_count, type: integer, source: system, description: "Number of resubmissions; reject at MAX_CDR_RESUBMISSIONS forces FAILED", default: 0 }
      - { name: rejection_reason, type: string, source: system, description: "Last bureau rejection reason; null until REJECTED" }

  - name: TaxReliefRecord
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> DebtAccount.id; abolished account under tax assessment" }
      - { name: relief_amount_cents, type: integer, source: system, description: "Snapshot of abolished_amount_cents at assessment creation" }
      - { name: insolvency_exclusion_cents, type: integer, source: input, description: "Amount excluded under insolvency (IRC 108); 0 <= exclusion <= relief_amount_cents" }
      - { name: reportable_amount_cents, type: integer, source: computed, description: "relief_amount_cents - insolvency_exclusion_cents" }
      - { name: status, type: enum, source: system, description: "PENDING | ASSESSED | EXEMPT | FILED | CANCELLED", default: PENDING }

  - name: HospitalPartnership
    parent: null
    common_fields: true
    fields:
      - { name: source_org_id, type: string, source: input, description: "FK -> SourceOrganization.id; must reference a HOSPITAL org (ERR_PARTNERSHIP_NOT_HOSPITAL)" }
      - { name: fap_baseline_score, type: integer, source: input, description: "Financial assistance policy score 0..100 at partnership start" }
      - { name: fap_target_score, type: integer, source: input, description: "Target FAP score 0..100; must be > fap_baseline_score" }
      - { name: fap_current_score, type: integer, source: computed, description: "Weighted milestone attainment: round_half_up(100 * sum(weight of MET) / sum(weight of non-WAIVED))" }
      - { name: status, type: enum, source: system, description: "PROPOSED | ACTIVE | SUSPENDED | COMPLETED", default: PROPOSED }

  - name: PartnershipMilestone
    parent: null
    common_fields: true
    fields:
      - { name: partnership_id, type: string, source: system, description: "FK -> HospitalPartnership.id; owning partnership (path-bound)" }
      - { name: code, type: string, source: input, description: "Milestone code; unique within partnership (ERR_DUPLICATE_MILESTONE_CODE)" }
      - { name: description, type: string, source: input, description: "FAP improvement description" }
      - { name: weight, type: integer, source: input, description: "Scoring weight; must be > 0" }
      - { name: due_date, type: string, source: input, description: "Due date YYYY-MM-DD" }
      - { name: status, type: enum, source: system, description: "PENDING | MET | MISSED | WAIVED", default: PENDING }

  - name: ImpactReport
    parent: null
    common_fields: true
    fields:
      - { name: scope, type: enum, source: input, description: "GLOBAL | GEOGRAPHY | HOSPITAL" }
      - { name: scope_state_code, type: string, source: input, description: "Required iff scope == GEOGRAPHY; matches DebtAccount.debtor_state" }
      - { name: scope_source_org_id, type: string, source: input, description: "FK -> SourceOrganization.id; required iff scope == HOSPITAL; matches the abolished account's portfolio seller" }
      - { name: period_start, type: string, source: input, description: "Period start YYYY-MM-DD; CLOSED interval [period_start, period_end] inclusive" }
      - { name: period_end, type: string, source: input, description: "Period end YYYY-MM-DD (inclusive); must be >= period_start" }
      - { name: counting_variant, type: enum, source: input, description: "PER_ACCOUNT | DEDUPED_HOUSEHOLD" }
      - { name: households_relieved, type: integer, source: computed, description: "PER_ACCOUNT: count of abolished accounts in scope; DEDUPED_HOUSEHOLD: count of distinct debtor_household_key" }
      - { name: dollars_abolished_cents, type: integer, source: computed, description: "Sum of abolished_amount_cents over in-scope accounts" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED", default: DRAFT }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: SourceOrganization
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/source-organizations/{id}/suspend"
        actor: PlatformAdmin
        preconditions:
          - "status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "Blocks portfolio submit for this org's portfolios (ERR_SOURCE_ORG_SUSPENDED)"
          - "Blocks HOSPITAL-earmarked campaign creation targeting this org (ERR_EARMARK_TARGET_SUSPENDED)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/source-organizations/{id}/reactivate"
        actor: PlatformAdmin
        preconditions:
          - "status == SUSPENDED (ERR_INVALID_STATE)"
        side_effects:
          - "Restores normal operations"

  - entity: EligibilityPolicy
    field: status
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/eligibility-policies/{id}/activate"
        actor: EligibilityOfficer
        preconditions:
          - "status == DRAFT (ERR_INVALID_STATE)"
          - "No other ACTIVE policy with same state_code whose half-open [effective_from, effective_to) window overlaps this one (ERR_POLICY_WINDOW_OVERLAP); adjacency (one's effective_to == other's effective_from) is allowed"
        side_effects:
          - "Policy becomes selectable for screening runs"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /api/eligibility-policies/{id}/retire"
        actor: EligibilityOfficer
        preconditions:
          - "status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "Policy no longer selectable for new screening runs (ERR_POLICY_NOT_ACTIVE)"

  - entity: Portfolio
    field: status
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/portfolios/{id}/submit"
        actor: PortfolioAnalyst
        preconditions:
          - "status == DRAFT (ERR_INVALID_STATE)"
          - "At least one account imported (ERR_BATCH_EMPTY)"
          - "SourceOrganization.status == ACTIVE (ERR_SOURCE_ORG_SUSPENDED)"
        side_effects:
          - "increments Portfolio.version by 1"
      - from: SUBMITTED
        to: SCREENING
        trigger: "POST /api/portfolios/{id}/screening-runs"
        actor: EligibilityOfficer
        preconditions:
          - "status IN {SUBMITTED, SCREENING, PRICED} (ERR_INVALID_STATE)"
          - "Policy status == ACTIVE (ERR_POLICY_NOT_ACTIVE)"
        side_effects:
          - "ScreeningRun created PENDING"
          - "increments Portfolio.version by 1"
      - from: SCREENING
        to: SCREENING
        trigger: "POST /api/portfolios/{id}/screening-runs (re-screen loop)"
        actor: EligibilityOfficer
        preconditions:
          - "status IN {SUBMITTED, SCREENING, PRICED}"
        side_effects:
          - "New ScreeningRun created PENDING; executing it re-derives every account eligibility_status"
          - "increments Portfolio.version by 1"
      - from: PRICED
        to: SCREENING
        trigger: "POST /api/portfolios/{id}/screening-runs (re-screen back-edge invalidates the quote)"
        actor: EligibilityOfficer
        preconditions:
          - "status IN {SUBMITTED, SCREENING, PRICED}"
        side_effects:
          - "ScreeningRun created PENDING; prior quote stays on Portfolio.quoted_price_cents until next price-quote"
          - "increments Portfolio.version by 1"
      - from: SCREENING
        to: PRICED
        trigger: "POST /api/portfolios/{id}/price-quote"
        actor: PortfolioAnalyst
        preconditions:
          - "status == SCREENING (ERR_INVALID_STATE)"
          - "At least one COMPLETED ScreeningRun exists for this portfolio AND zero accounts in {UNSCREENED, NEEDS_REVIEW} (ERR_SCREENING_INCOMPLETE)"
        side_effects:
          - "quoted_price_cents = portfolio_price_quote(eligible_face_value_cents, source org org_type)"
          - "increments Portfolio.version by 1"
      - from: PRICED
        to: PRICED
        trigger: "POST /api/portfolios/{id}/price-quote (re-price)"
        actor: PortfolioAnalyst
        preconditions:
          - "status == PRICED (ERR_INVALID_STATE)"
          - "Same screening-completeness preconditions as SCREENING -> PRICED (ERR_SCREENING_INCOMPLETE)"
        side_effects:
          - "quoted_price_cents recomputed; existing DRAFT contracts keep their snapshot (price-drift check at execution)"
          - "increments Portfolio.version by 1"
      - from: PRICED
        to: CONTRACTED
        trigger: "POST /api/contracts/{id}/execute"
        actor: ContractManager
        preconditions:
          - "Contract status == DRAFT; portfolio status == PRICED"
          - "Portfolio.quoted_price_cents == contract.contract_price_cents (ERR_PRICE_DRIFT)"
          - "collection_prohibition == true AND no_resale == true (ERR_COLLECTION_COVENANT_MISSING)"
        side_effects:
          - "contract.executed_by = X-User-ID"
          - "increments Portfolio.version by 1"
      - from: CONTRACTED
        to: SETTLED
        trigger: "POST /api/contracts/{id}/settle"
        actor: FinanceOfficer
        preconditions:
          - "Contract status == EXECUTED; portfolio status == CONTRACTED"
          - "X-User-ID != contract.executed_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "contract.settled_by = X-User-ID; portfolio.purchased_price_cents = contract.contract_price_cents"
          - "Every account with eligibility_status == ELIGIBLE: lifecycle_status -> PURCHASED"
          - "Every other account (INELIGIBLE | NEEDS_REVIEW | UNSCREENED): lifecycle_status -> EXCLUDED"
          - "increments Portfolio.version by 1"
      - from: CONTRACTED
        to: PRICED
        trigger: "POST /api/contracts/{id}/terminate (compensation)"
        actor: ContractManager
        preconditions:
          - "Contract status == EXECUTED"
        side_effects:
          - "Contract -> TERMINATED with terminated_reason"
          - "increments Portfolio.version by 1"
      - from: SETTLED
        to: ABOLISHING
        trigger: "POST /api/abolishment-batches/{id}/commit (first committed batch)"
        actor: FinanceOfficer
        preconditions:
          - "Batch status == STAGING; portfolio status IN {SETTLED, ABOLISHING}"
        side_effects:
          - "increments Portfolio.version by 1"
      - from: ABOLISHING
        to: CLOSED
        trigger: "system (automatic on batch finalize when no PURCHASED accounts remain and no batch is STAGING or COMMITTED)"
        actor: system
        preconditions:
          - "Every account lifecycle_status IN {ABOLISHED, EXCLUDED}"
          - "No AbolishmentBatch in {STAGING, COMMITTED}"
        side_effects:
          - "Portfolio is terminal; no further batches, screenings, or contracts"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/portfolios/{id}/cancel"
        actor: PortfolioAnalyst
        preconditions:
          - "status IN {DRAFT, SUBMITTED, SCREENING, PRICED} (ERR_INVALID_STATE)"
        side_effects:
          - "increments Portfolio.version by 1"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /api/portfolios/{id}/cancel"
        actor: PortfolioAnalyst
        preconditions:
          - "status IN {DRAFT, SUBMITTED, SCREENING, PRICED}"
        side_effects:
          - "increments Portfolio.version by 1"
      - from: SCREENING
        to: CANCELLED
        trigger: "POST /api/portfolios/{id}/cancel"
        actor: PortfolioAnalyst
        preconditions:
          - "status IN {DRAFT, SUBMITTED, SCREENING, PRICED}"
        side_effects:
          - "increments Portfolio.version by 1"
      - from: PRICED
        to: CANCELLED
        trigger: "POST /api/portfolios/{id}/cancel"
        actor: PortfolioAnalyst
        preconditions:
          - "status IN {DRAFT, SUBMITTED, SCREENING, PRICED}"
          - "No PurchaseContract exists for this portfolio in {DRAFT, EXECUTED} (ERR_INVALID_STATE)"
        side_effects:
          - "increments Portfolio.version by 1"

  - entity: DebtAccount
    field: eligibility_status
    initial_state: UNSCREENED
    terminal_states: []
    transitions:
      - from: UNSCREENED
        to: ELIGIBLE
        trigger: "POST /api/screening-runs/{id}/execute"
        actor: EligibilityOfficer
        preconditions:
          - "Run PENDING; policy ACTIVE; portfolio SCREENING"
        side_effects:
          - "Portfolio eligible_face_value_cents and eligible_account_count recomputed"
      - from: UNSCREENED
        to: INELIGIBLE
        trigger: "POST /api/screening-runs/{id}/execute"
        actor: EligibilityOfficer
        preconditions: []
        side_effects: []
      - from: UNSCREENED
        to: NEEDS_REVIEW
        trigger: "POST /api/screening-runs/{id}/execute"
        actor: EligibilityOfficer
        preconditions: []
        side_effects: []
      - from: NEEDS_REVIEW
        to: ELIGIBLE
        trigger: "POST /api/accounts/{id}/review {decision: ELIGIBLE}"
        actor: EligibilityOfficer
        preconditions:
          - "eligibility_status == NEEDS_REVIEW (ERR_INVALID_STATE)"
        side_effects:
          - "Portfolio eligible_face_value_cents and eligible_account_count recomputed"
      - from: NEEDS_REVIEW
        to: INELIGIBLE
        trigger: "POST /api/accounts/{id}/review {decision: INELIGIBLE}"
        actor: EligibilityOfficer
        preconditions:
          - "eligibility_status == NEEDS_REVIEW (ERR_INVALID_STATE)"
        side_effects: []
      - from: ELIGIBLE
        to: INELIGIBLE
        trigger: "POST /api/screening-runs/{id}/execute (re-screen cycle flips prior results)"
        actor: EligibilityOfficer
        preconditions: []
        side_effects:
          - "Portfolio eligible totals recomputed; any existing quote is stale (price-drift enforcement on contract execute)"
      - from: INELIGIBLE
        to: ELIGIBLE
        trigger: "POST /api/screening-runs/{id}/execute (re-screen cycle)"
        actor: EligibilityOfficer
        preconditions: []
        side_effects: []
      - from: ELIGIBLE
        to: NEEDS_REVIEW
        trigger: "POST /api/screening-runs/{id}/execute (re-screen cycle)"
        actor: EligibilityOfficer
        preconditions: []
        side_effects: []

  - entity: DebtAccount
    field: lifecycle_status
    initial_state: AVAILABLE
    terminal_states: [ABOLISHED, EXCLUDED]
    transitions:
      - from: AVAILABLE
        to: PURCHASED
        trigger: "POST /api/contracts/{id}/settle"
        actor: FinanceOfficer
        preconditions:
          - "eligibility_status == ELIGIBLE at settlement"
        side_effects:
          - "Account becomes purchasable input for abolishment batches"
      - from: AVAILABLE
        to: EXCLUDED
        trigger: "POST /api/contracts/{id}/settle"
        actor: FinanceOfficer
        preconditions:
          - "eligibility_status != ELIGIBLE at settlement"
        side_effects: []
      - from: PURCHASED
        to: ABOLISHED
        trigger: "POST /api/abolishment-batches/{id}/finalize"
        actor: FinanceOfficer
        preconditions:
          - "Account in the batch's account_ids; batch COMMITTED"
        side_effects:
          - "abolished_amount_cents = balance_cents + accrued_adjustment_cents; abolished_at = logical clock; abolished_batch_id set"
          - "Cascade link 2: a QUEUED NotificationLetter is created for the account"
          - "Cascade link 2: a PENDING TaxReliefRecord is created with relief_amount_cents = abolished_amount_cents"
          - "Cascade link 2: if bureau_status == REPORTED, a CreditDeletionRequest is created and auto-SUBMITTED"
          - "Cascade link 3: the auto-SUBMITTED CreditDeletionRequest flips bureau_status REPORTED -> DELETION_REQUESTED"
      - from: ABOLISHED
        to: PURCHASED
        trigger: "POST /api/abolishment-batches/{id}/reverse (compensation)"
        actor: FinanceOfficer
        preconditions:
          - "Batch FINALIZED and reversible (ERR_BATCH_IRREVERSIBLE if any letter SENT/DELIVERED/UNDELIVERABLE, any CDR ACKNOWLEDGED, or any tax record FILED/EXEMPT)"
        side_effects:
          - "abolished_amount_cents, abolished_at, abolished_batch_id cleared"
          - "Letters in {QUEUED, BOUNCED} -> CANCELLED"
          - "CDRs in {DRAFT, SUBMITTED, REJECTED} -> CANCELLED; bureau_status DELETION_REQUESTED -> REPORTED"
          - "Tax records in {PENDING, ASSESSED} -> CANCELLED"

  - entity: DebtAccount
    field: bureau_status
    initial_state: "NOT_REPORTED or REPORTED (from reported_to_bureau at import)"
    terminal_states: [DELETED, DELETION_FAILED]
    transitions:
      - from: REPORTED
        to: DELETION_REQUESTED
        trigger: "CreditDeletionRequest submission (manual POST /api/credit-deletion-requests/{id}/submit or auto-submit at batch finalize)"
        actor: ComplianceAuditor
        preconditions:
          - "lifecycle_status == ABOLISHED (ERR_ACCOUNT_NOT_ABOLISHED)"
          - "bureau_status == REPORTED (ERR_BUREAU_NOT_REPORTED)"
        side_effects: []
      - from: DELETION_REQUESTED
        to: DELETED
        trigger: "POST /api/credit-deletion-requests/{id}/acknowledge"
        actor: ComplianceAuditor
        preconditions:
          - "CDR status == SUBMITTED"
        side_effects: []
      - from: DELETION_REQUESTED
        to: REPORTED
        trigger: "POST /api/credit-deletion-requests/{id}/reject (rejection returns account to REPORTED so a resubmission cycle can start)"
        actor: ComplianceAuditor
        preconditions:
          - "CDR status == SUBMITTED; resubmission_count < MAX_CDR_RESUBMISSIONS"
        side_effects: []
      - from: DELETION_REQUESTED
        to: DELETION_FAILED
        trigger: "POST /api/credit-deletion-requests/{id}/reject when CDR resubmission_count == MAX_CDR_RESUBMISSIONS"
        actor: ComplianceAuditor
        preconditions:
          - "CDR status == SUBMITTED; resubmission_count == 2"
        side_effects:
          - "CDR -> FAILED (terminal)"

  - entity: ScreeningRun
    field: status
    initial_state: PENDING
    terminal_states: [COMPLETED, FAILED]
    transitions:
      - from: PENDING
        to: COMPLETED
        trigger: "POST /api/screening-runs/{id}/execute"
        actor: EligibilityOfficer
        preconditions:
          - "status == PENDING (ERR_INVALID_STATE)"
          - "Policy status == ACTIVE (ERR_POLICY_NOT_ACTIVE)"
          - "Portfolio status == SCREENING (ERR_INVALID_STATE)"
        side_effects:
          - "Every account in portfolio re-derived per eligibility_screening (re-screen cycle)"
          - "eligible_count / ineligible_count / needs_review_count recorded; executed_at set"
          - "Portfolio eligible_face_value_cents and eligible_account_count recomputed; increments Portfolio.version by 1"

  - entity: PurchaseContract
    field: status
    initial_state: DRAFT
    terminal_states: [SETTLED, TERMINATED]
    transitions:
      - from: DRAFT
        to: EXECUTED
        trigger: "POST /api/contracts/{id}/execute"
        actor: ContractManager
        preconditions:
          - "status == DRAFT (ERR_INVALID_STATE)"
          - "Portfolio status == PRICED (ERR_INVALID_STATE)"
          - "Portfolio.quoted_price_cents == contract_price_cents (ERR_PRICE_DRIFT)"
          - "collection_prohibition AND no_resale both true (ERR_COLLECTION_COVENANT_MISSING)"
        side_effects:
          - "executed_by = X-User-ID; Portfolio -> CONTRACTED"
      - from: EXECUTED
        to: SETTLED
        trigger: "POST /api/contracts/{id}/settle"
        actor: FinanceOfficer
        preconditions:
          - "status == EXECUTED (ERR_INVALID_STATE)"
          - "X-User-ID != executed_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "settled_by = X-User-ID; Portfolio -> SETTLED; accounts partitioned PURCHASED/EXCLUDED"
      - from: EXECUTED
        to: TERMINATED
        trigger: "POST /api/contracts/{id}/terminate"
        actor: ContractManager
        preconditions:
          - "status == EXECUTED (ERR_INVALID_STATE)"
        side_effects:
          - "Portfolio CONTRACTED -> PRICED"

  - entity: DonorCampaign
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: FUNDED
        trigger: "system (automatic when raised_cents >= goal_cents after a donation receive; equality triggers)"
        actor: system
        preconditions: []
        side_effects:
          - "Campaign remains open to donations and batch funding draws"
      - from: FUNDED
        to: OPEN
        trigger: "system (automatic when a refund drops raised_cents below goal_cents — cascade link 2 of the refund cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /api/donor-campaigns/{id}/close"
        actor: DonorRelationsOfficer
        preconditions:
          - "status IN {OPEN, FUNDED} (ERR_INVALID_STATE)"
        side_effects:
          - "New donations rejected (ERR_CAMPAIGN_CLOSED); campaign no longer drawable by the funding waterfall"
      - from: FUNDED
        to: CLOSED
        trigger: "POST /api/donor-campaigns/{id}/close"
        actor: DonorRelationsOfficer
        preconditions:
          - "status IN {OPEN, FUNDED}"
        side_effects: []

  - entity: Donation
    field: status
    initial_state: PLEDGED
    terminal_states: [REFUNDED]
    transitions:
      - from: PLEDGED
        to: RECEIVED
        trigger: "POST /api/donations/{id}/receive"
        actor: FinanceOfficer
        preconditions:
          - "status == PLEDGED (ERR_INVALID_STATE)"
        side_effects:
          - "Cascade link 1: campaign.raised_cents += net_cents"
          - "Cascade link 2: campaign OPEN -> FUNDED if raised_cents >= goal_cents"
      - from: RECEIVED
        to: REFUNDED
        trigger: "POST /api/donations/{id}/refund (compensating action)"
        actor: FinanceOfficer
        preconditions:
          - "status == RECEIVED (ERR_INVALID_STATE)"
        side_effects:
          - "Cascade link 1: campaign.raised_cents -= net_cents"
          - "Cascade link 2: campaign FUNDED -> OPEN if raised_cents < goal_cents"
          - "Invariant: campaign.raised_cents == sum(net_cents of RECEIVED donations)"

  - entity: AbolishmentBatch
    field: status
    initial_state: STAGING
    terminal_states: [FINALIZED, REVERSED]
    transitions:
      - from: STAGING
        to: COMMITTED
        trigger: "POST /api/abolishment-batches/{id}/commit"
        actor: FinanceOfficer
        preconditions:
          - "status == STAGING (ERR_INVALID_STATE)"
          - "Portfolio status IN {SETTLED, ABOLISHING} (ERR_PORTFOLIO_NOT_SETTLED)"
          - "funding_waterfall must cover total_abolished_cents (ERR_INSUFFICIENT_FUNDING)"
        side_effects:
          - "funding_allocations computed by funding_waterfall; each drawn campaign.committed_cents += allocation"
          - "Portfolio SETTLED -> ABOLISHING on first commit"
      - from: COMMITTED
        to: STAGING
        trigger: "POST /api/abolishment-batches/{id}/uncommit (compensation)"
        actor: FinanceOfficer
        preconditions:
          - "status == COMMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "Each drawn campaign.committed_cents -= allocation; funding_allocations cleared"
      - from: COMMITTED
        to: FINALIZED
        trigger: "POST /api/abolishment-batches/{id}/finalize"
        actor: FinanceOfficer
        preconditions:
          - "status == COMMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "Each account PURCHASED -> ABOLISHED with final relief value"
          - "Cascade: letters QUEUED, tax records PENDING, CDRs auto-SUBMITTED for REPORTED accounts (see DebtAccount.lifecycle)"
          - "Each drawn campaign: committed_cents -= allocation, spent_cents += allocation"
          - "Portfolio.abolished_face_value_cents += total_abolished_cents; auto-CLOSED when nothing left to abolish"
      - from: FINALIZED
        to: REVERSED
        trigger: "POST /api/abolishment-batches/{id}/reverse (compensating action)"
        actor: FinanceOfficer
        preconditions:
          - "status == FINALIZED (ERR_INVALID_STATE)"
          - "No letter in {SENT, DELIVERED, UNDELIVERABLE}, no CDR ACKNOWLEDGED, no tax record in {FILED, EXEMPT} (ERR_BATCH_IRREVERSIBLE)"
        side_effects:
          - "Accounts ABOLISHED -> PURCHASED; letters/CDRs/tax records cancelled (see DebtAccount.lifecycle)"
          - "Each drawn campaign: spent_cents -= allocation (funds return as raised but unspent)"
          - "Portfolio.abolished_face_value_cents -= total_abolished_cents"
          - "Invariant: portfolio.abolished_face_value_cents == sum(total_abolished_cents over FINALIZED batches)"

  - entity: NotificationLetter
    field: status
    initial_state: QUEUED
    terminal_states: [DELIVERED, UNDELIVERABLE, CANCELLED]
    transitions:
      - from: QUEUED
        to: SENT
        trigger: "POST /api/notification-letters/{id}/send"
        actor: DonorRelationsOfficer
        preconditions:
          - "status == QUEUED (ERR_INVALID_STATE)"
          - "Parent batch status == FINALIZED (ERR_INVALID_STATE)"
        side_effects:
          - "sent_at = logical clock"
      - from: SENT
        to: DELIVERED
        trigger: "POST /api/notification-letters/{id}/mark-delivered"
        actor: DonorRelationsOfficer
        preconditions:
          - "status == SENT (ERR_INVALID_STATE)"
        side_effects: []
      - from: SENT
        to: BOUNCED
        trigger: "POST /api/notification-letters/{id}/mark-bounced"
        actor: DonorRelationsOfficer
        preconditions:
          - "status == SENT (ERR_INVALID_STATE)"
          - "attempt_count + 1 < MAX_LETTER_ATTEMPTS (otherwise UNDELIVERABLE)"
        side_effects:
          - "attempt_count += 1"
      - from: SENT
        to: UNDELIVERABLE
        trigger: "POST /api/notification-letters/{id}/mark-bounced when attempt_count + 1 >= MAX_LETTER_ATTEMPTS (3)"
        actor: DonorRelationsOfficer
        preconditions:
          - "status == SENT"
        side_effects:
          - "attempt_count += 1 (== 3); terminal"
      - from: BOUNCED
        to: QUEUED
        trigger: "POST /api/notification-letters/{id}/requeue (bounce cycle)"
        actor: DonorRelationsOfficer
        preconditions:
          - "status == BOUNCED (ERR_INVALID_STATE)"
          - "attempt_count < MAX_LETTER_ATTEMPTS (ERR_DELIVERY_ATTEMPTS_EXHAUSTED)"
        side_effects:
          - "mailing_address replaced by corrected_address when provided"

  - entity: CreditDeletionRequest
    field: status
    initial_state: "DRAFT (manual) | SUBMITTED (auto-created at batch finalize)"
    terminal_states: [ACKNOWLEDGED, FAILED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/credit-deletion-requests/{id}/submit"
        actor: ComplianceAuditor
        preconditions:
          - "status == DRAFT (ERR_INVALID_STATE)"
          - "Account lifecycle_status == ABOLISHED (ERR_ACCOUNT_NOT_ABOLISHED)"
          - "Account bureau_status == REPORTED (ERR_BUREAU_NOT_REPORTED)"
        side_effects:
          - "Account bureau_status REPORTED -> DELETION_REQUESTED"
      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: "POST /api/credit-deletion-requests/{id}/acknowledge"
        actor: ComplianceAuditor
        preconditions:
          - "status == SUBMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "Account bureau_status DELETION_REQUESTED -> DELETED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/credit-deletion-requests/{id}/reject when resubmission_count < MAX_CDR_RESUBMISSIONS (2)"
        actor: ComplianceAuditor
        preconditions:
          - "status == SUBMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "rejection_reason recorded; account bureau_status DELETION_REQUESTED -> REPORTED"
      - from: SUBMITTED
        to: FAILED
        trigger: "POST /api/credit-deletion-requests/{id}/reject when resubmission_count == MAX_CDR_RESUBMISSIONS (2)"
        actor: ComplianceAuditor
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "Account bureau_status DELETION_REQUESTED -> DELETION_FAILED; terminal"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /api/credit-deletion-requests/{id}/resubmit (rejection cycle)"
        actor: ComplianceAuditor
        preconditions:
          - "status == REJECTED (ERR_INVALID_STATE)"
          - "resubmission_count < MAX_CDR_RESUBMISSIONS (ERR_RESUBMISSION_LIMIT)"
        side_effects:
          - "resubmission_count += 1; account bureau_status REPORTED -> DELETION_REQUESTED"

  - entity: TaxReliefRecord
    field: status
    initial_state: PENDING
    terminal_states: [FILED, EXEMPT, CANCELLED]
    transitions:
      - from: PENDING
        to: ASSESSED
        trigger: "POST /api/tax-relief-records/{id}/assess with insolvency_exclusion_cents < relief_amount_cents"
        actor: ComplianceAuditor
        preconditions:
          - "status == PENDING (ERR_INVALID_STATE)"
          - "0 <= insolvency_exclusion_cents <= relief_amount_cents (ERR_INVALID_AMOUNT)"
        side_effects:
          - "reportable_amount_cents = relief_amount_cents - insolvency_exclusion_cents (> 0)"
      - from: PENDING
        to: EXEMPT
        trigger: "POST /api/tax-relief-records/{id}/assess with insolvency_exclusion_cents == relief_amount_cents (full insolvency exclusion, no 1099-C reportable amount)"
        actor: ComplianceAuditor
        preconditions:
          - "status == PENDING"
        side_effects:
          - "reportable_amount_cents == 0; no filing required"
      - from: ASSESSED
        to: FILED
        trigger: "POST /api/tax-relief-records/{id}/file"
        actor: ComplianceAuditor
        preconditions:
          - "status == ASSESSED (ERR_INVALID_STATE)"
        side_effects: []

  - entity: HospitalPartnership
    field: status
    initial_state: PROPOSED
    terminal_states: [COMPLETED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /api/hospital-partnerships/{id}/activate"
        actor: DonorRelationsOfficer
        preconditions:
          - "status == PROPOSED (ERR_INVALID_STATE)"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/hospital-partnerships/{id}/suspend"
        actor: DonorRelationsOfficer
        preconditions:
          - "status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "Milestone transitions blocked while SUSPENDED (ERR_INVALID_STATE)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/hospital-partnerships/{id}/resume (suspension cycle)"
        actor: DonorRelationsOfficer
        preconditions:
          - "status == SUSPENDED (ERR_INVALID_STATE)"
        side_effects: []
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /api/hospital-partnerships/{id}/complete"
        actor: DonorRelationsOfficer
        preconditions:
          - "status == ACTIVE (ERR_INVALID_STATE)"
          - "Every milestone status IN {MET, MISSED, WAIVED} — all terminal (ERR_MILESTONE_NOT_TERMINAL)"
          - "fap_current_score >= fap_target_score (ERR_FAP_TARGET_NOT_MET; equality satisfies)"
        side_effects: []

  - entity: PartnershipMilestone
    field: status
    initial_state: PENDING
    terminal_states: [MET, WAIVED]
    transitions:
      - from: PENDING
        to: MET
        trigger: "POST /api/partnership-milestones/{id}/mark-met"
        actor: "HospitalPartner (own org only) | DonorRelationsOfficer"
        preconditions:
          - "status IN {PENDING, MISSED} (ERR_INVALID_STATE)"
          - "Partnership status == ACTIVE (ERR_INVALID_STATE)"
          - "HospitalPartner caller: partnership.source_org_id == X-User-ID (ERR_FORBIDDEN)"
        side_effects:
          - "Partnership fap_current_score recomputed"
      - from: MISSED
        to: MET
        trigger: "POST /api/partnership-milestones/{id}/mark-met (late completion)"
        actor: "HospitalPartner (own org only) | DonorRelationsOfficer"
        preconditions:
          - "status IN {PENDING, MISSED}"
        side_effects:
          - "Partnership fap_current_score recomputed"
      - from: PENDING
        to: MISSED
        trigger: "POST /api/partnership-milestones/{id}/mark-missed"
        actor: DonorRelationsOfficer
        preconditions:
          - "status == PENDING (ERR_INVALID_STATE)"
          - "Logical clock date > due_date (ERR_INVALID_STATE)"
        side_effects: []
      - from: PENDING
        to: WAIVED
        trigger: "POST /api/partnership-milestones/{id}/waive"
        actor: DonorRelationsOfficer
        preconditions:
          - "status IN {PENDING, MISSED} (ERR_INVALID_STATE)"
        side_effects:
          - "Excluded from fap_current_score denominator"
      - from: MISSED
        to: WAIVED
        trigger: "POST /api/partnership-milestones/{id}/waive"
        actor: DonorRelationsOfficer
        preconditions:
          - "status IN {PENDING, MISSED}"
        side_effects:
          - "Excluded from fap_current_score denominator"

  - entity: ImpactReport
    field: status
    initial_state: DRAFT
    terminal_states: [PUBLISHED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /api/impact-reports/{id}/publish"
        actor: "PlatformAdmin | ComplianceAuditor"
        preconditions:
          - "status == DRAFT (ERR_INVALID_STATE)"
          - "No other PUBLISHED report with same scope + scope key whose CLOSED [period_start, period_end] interval overlaps (ERR_REPORT_PERIOD_OVERLAP); sharing a boundary date IS an overlap"
        side_effects: []

# =============================================================================
# Table 2.1: Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: portfolio-contract-create-occ
    parent_entity: Portfolio
    write_endpoint: "POST /api/portfolios/{id}/contracts"
    occ_field: expected_portfolio_version
    description: |
      Creating a PurchaseContract against a Portfolio whose version has advanced
      since the client last observed it (e.g. a re-price recomputed the quote) is
      rejected as stale: the client would otherwise pin a contract to a quote it
      never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: portfolio-batch-create-occ
    parent_entity: Portfolio
    write_endpoint: "POST /api/portfolios/{id}/abolishment-batches"
    occ_field: expected_portfolio_version
    description: |
      Creating an AbolishmentBatch against a Portfolio whose version has advanced
      since the client last observed it (e.g. another batch's finalize changed the
      abolished totals, or a new batch consumed additional accounts) is rejected
      as stale: the client must re-read the portfolio before composing a batch.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: eligibility_screening
    trigger: "POST /api/screening-runs/{id}/execute"
    algorithm: threshold
    formula: |
      For each account in the run's portfolio (lifecycle_status == AVAILABLE, i.e. pre-settlement):
        cap = round_half_up((FPL_BASE_CENTS + (household_size - 1) * FPL_INCREMENT_CENTS) * policy.fpl_multiplier)
        if household_size is null or household_size < 1:
          eligibility_status = NEEDS_REVIEW                      # invalid household data cannot be scored
        elif annual_income_cents is null:
          if is_insolvent and policy.insolvency_qualifies: eligibility_status = ELIGIBLE
          else: eligibility_status = NEEDS_REVIEW
        elif annual_income_cents <= cap:                         # BOUNDARY: equality qualifies
          eligibility_status = ELIGIBLE
        elif is_insolvent and policy.insolvency_qualifies:
          eligibility_status = ELIGIBLE                          # insolvency override above cap
        else:
          eligibility_status = INELIGIBLE
      Run counts and portfolio eligible totals recomputed from the result set.
      Input set: ALL accounts of the portfolio regardless of current eligibility_status (re-screen resets).
    constants:
      FPL_BASE_CENTS: 1565000        # household size 1
      FPL_INCREMENT_CENTS: 556000    # each additional household member
    precision: "integer cents, round_half_up on the cap"
    variants:
      - name: income_test_path
        when: "annual_income_cents present and household_size >= 1"
        difference: "Eligibility decided purely by income <= cap; insolvency never consulted when income <= cap"
      - name: insolvency_override_path
        when: "income above cap or income missing"
        difference: "Same account is ELIGIBLE only when is_insolvent AND policy.insolvency_qualifies; a policy with insolvency_qualifies=false flips the identical account to INELIGIBLE / NEEDS_REVIEW"

  - name: portfolio_price_quote
    trigger: "POST /api/portfolios/{id}/price-quote"
    algorithm: tiered_pricing
    formula: |
      face = portfolio.eligible_face_value_cents            # ELIGIBLE accounts only
      tier1 = min(face, TIER1_LIMIT_CENTS) * TIER1_RATE
      tier2 = min(max(face - TIER1_LIMIT_CENTS, 0), TIER2_LIMIT_CENTS) * TIER2_RATE
      tier3 = max(face - TIER1_LIMIT_CENTS - TIER2_LIMIT_CENTS, 0) * TIER3_RATE
      raw = tier1 + tier2 + tier3
      quoted_price_cents = round_half_up(raw * ORG_FACTOR[source_org.org_type])
      Evaluation order pinned: tiers computed on face first, org factor applied to the tiered sum, single rounding at the end.
      Inputs: eligible_face_value_cents, org_type factor, tier schedule (3+ inputs, non-linear tier interaction).
    constants:
      TIER1_LIMIT_CENTS: 100000000
      TIER1_RATE: 0.025
      TIER2_LIMIT_CENTS: 400000000
      TIER2_RATE: 0.015
      TIER3_RATE: 0.008
      ORG_FACTOR: { HOSPITAL: 1.0, PHYSICIAN_GROUP: 0.9, DEBT_BUYER: 0.75 }
    precision: "integer cents, round_half_up, single rounding after org factor"

  - name: donation_netting
    trigger: "POST /api/donor-campaigns/{id}/donations (creation) and POST /api/donations/{id}/receive"
    algorithm: aggregation
    formula: |
      Per donation at creation:
        fee_cents = round_half_up(gross_cents * FEE_PCT)
        net_cents = gross_cents - fee_cents
      Campaign totals:
        raised_cents = sum(net_cents over RECEIVED donations)
      ROUNDING ORDER PINNED (mode b): fee is rounded PER DONATION, then nets are summed.
      The alternative sum-then-round (round_half_up(sum(gross) * FEE_PCT)) yields different cents
      and is forbidden. E.g. two donations of 3333: per-item nets 3236 + 3236 = 6472;
      sum-then-round would give 6666 - round(193.314) = 6473.
    constants:
      FEE_PCT: 0.029
    precision: "integer cents, round_half_up per donation"

  - name: funding_waterfall
    trigger: "POST /api/abolishment-batches/{id}/commit"
    algorithm: waterfall_allocation
    formula: |
      Candidate campaigns: status IN {OPEN, FUNDED} (CLOSED excluded), ordered:
        1. earmark_type == HOSPITAL and earmark_source_org_id == portfolio.source_org_id
        2. earmark_type == GEOGRAPHY and earmark_state_code == portfolio's source org state_code
        3. earmark_type == GENERAL
      Within a class, order by created_at ASC (chronological; id never used).
      Draw from each campaign min(remaining_need, campaign.raised_cents - campaign.committed_cents).
      Stop when remaining_need == 0. If the waterfall exhausts all candidates with
      remaining_need > 0: reject the whole commit with ERR_INSUFFICIENT_FUNDING (atomic, no partial reservation).
      On success: batch.funding_allocations = [{campaign_id, amount_cents}] in draw order;
      each campaign.committed_cents += allocation.
    precision: "integer cents"

  - name: relief_valuation
    trigger: "account selection into price quote (provisional) vs batch finalize (final)"
    algorithm: aggregation
    formula: |
      provisional_value(account) = balance_cents
      final_value(account) = balance_cents + accrued_adjustment_cents
      Quoting and funding exposure use provisional; abolishment records final.
      Portfolio.eligible_face_value_cents sums provisional values.
      AbolishmentBatch.total_abolished_cents sums final values.
      DebtAccount.abolished_amount_cents = final value, stamped at finalize.
    precision: "integer cents"
    variants:
      - name: provisional
        when: "screening, price quote, pre-purchase reporting"
        difference: "Excludes accrued_adjustment_cents; for an account with a non-zero adjustment the provisional value differs from the final abolished amount"
      - name: final
        when: "batch creation total and finalize abolished_amount_cents"
        difference: "Includes accrued_adjustment_cents (residual interest added or reversed after the data cut)"

  - name: impact_household_metrics
    trigger: "POST /api/impact-reports (computed at creation)"
    algorithm: aggregation
    formula: |
      In-scope accounts: lifecycle_status == ABOLISHED
        AND abolished_at date within CLOSED [period_start, period_end]
        AND (scope == GLOBAL
             OR (scope == GEOGRAPHY AND debtor_state == scope_state_code)
             OR (scope == HOSPITAL AND account's portfolio.source_org_id == scope_source_org_id))
      dollars_abolished_cents = sum(abolished_amount_cents) over in-scope accounts (same for both variants)
      PER_ACCOUNT:      households_relieved = count(in-scope accounts)
      DEDUPED_HOUSEHOLD: households_relieved = count(DISTINCT debtor_household_key over in-scope accounts)
    precision: "integer cents; counts are integers"
    variants:
      - name: per_account
        when: "counting_variant == PER_ACCOUNT"
        difference: "Three abolished accounts from two households report households_relieved == 3"
      - name: deduped_household
        when: "counting_variant == DEDUPED_HOUSEHOLD"
        difference: "The same three accounts report households_relieved == 2 (distinct household keys)"

  - name: fap_score
    trigger: "PartnershipMilestone transition to MET, MISSED->MET, or WAIVED"
    algorithm: weighted_scoring
    formula: |
      denom = sum(weight over milestones with status != WAIVED)
      fap_current_score = denom == 0 ? fap_baseline_score
                        : round_half_up(100 * sum(weight over MET milestones) / denom)
      WAIVED milestones are excluded from BOTH numerator and denominator.
    precision: "integer 0..100, round_half_up"

  - name: campaign_funding_threshold
    trigger: "donation receive / refund (after raised_cents recompute)"
    algorithm: threshold
    formula: |
      if campaign.raised_cents >= campaign.goal_cents and status == OPEN: status -> FUNDED
      if campaign.raised_cents <  campaign.goal_cents and status == FUNDED: status -> OPEN
      BOUNDARY: equality (raised == goal) IS funded.
    precision: "integer cents"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: request
    check: "Request well-formed; all required fields present and correctly typed; enum values valid"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role and X-User-ID headers present and role name recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all /api/* endpoints"
  - priority: 3
    category: auth
    check: "Role permitted for this endpoint; HospitalPartner X-User-ID must equal the partnership's source_org_id for milestone mark-met"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 4
    category: existence
    check: "Path segment entities exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 5
    category: existence
    check: "Body-referenced entities exist (source_org_id, policy_id, earmark_source_org_id, account_ids entries)"
    error_id: "ERR_SOURCE_ORG_NOT_FOUND | ERR_POLICY_NOT_FOUND | ERR_CAMPAIGN_NOT_FOUND | ERR_ACCOUNT_NOT_FOUND"
    http_status: 404
    applies_to: "creation endpoints with body FKs"
  - priority: 6
    category: state
    check: "Target entity in a legal source state for the transition (includes ERR_CAMPAIGN_CLOSED for donations to CLOSED campaigns)"
    error_id: "ERR_INVALID_STATE | ERR_CAMPAIGN_CLOSED"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: state
    check: "Cross-entity state gates: batch create/commit requires portfolio SETTLED|ABOLISHING; letter send requires batch FINALIZED; CDR submit requires account ABOLISHED and REPORTED; screening execute requires policy ACTIVE and portfolio SCREENING; portfolio submit requires source org ACTIVE; price-quote requires screening complete"
    error_id: "ERR_PORTFOLIO_NOT_SETTLED | ERR_ACCOUNT_NOT_ABOLISHED | ERR_BUREAU_NOT_REPORTED | ERR_POLICY_NOT_ACTIVE | ERR_SOURCE_ORG_SUSPENDED | ERR_SCREENING_INCOMPLETE"
    http_status: 409
    applies_to: "gated transition endpoints"
  - priority: 8
    category: business_safety
    check: "Charitable-compliance covenants: contract execute requires collection_prohibition == true AND no_resale == true; HOSPITAL-earmarked campaigns may not target a SUSPENDED org"
    error_id: "ERR_COLLECTION_COVENANT_MISSING | ERR_EARMARK_TARGET_SUSPENDED"
    http_status: 422
    applies_to: "POST /api/contracts/{id}/execute, POST /api/donor-campaigns"
  - priority: 9
    category: business_temporal
    check: "Policy activation windows (half-open) may not overlap within a state_code; PUBLISHED impact report periods (closed) may not overlap within a scope key"
    error_id: "ERR_POLICY_WINDOW_OVERLAP | ERR_REPORT_PERIOD_OVERLAP"
    http_status: 409
    applies_to: "POST /api/eligibility-policies/{id}/activate, POST /api/impact-reports/{id}/publish"
  - priority: 10
    category: business_referential
    check: "Referential fit: HOSPITAL earmark target must be org_type HOSPITAL; partnership org must be HOSPITAL; batch account_ids must belong to the path portfolio"
    error_id: "ERR_EARMARK_TARGET_NOT_HOSPITAL | ERR_PARTNERSHIP_NOT_HOSPITAL | ERR_BATCH_ACCOUNT_FOREIGN"
    http_status: 422
    applies_to: "POST /api/donor-campaigns, POST /api/hospital-partnerships, POST /api/portfolios/{id}/abolishment-batches"
  - priority: 11
    category: business_constraint
    check: "Domain constraints: contract price drift; segregation of duties on settle; household_size >= 1 when present; batch non-empty; letter attempt limit; CDR resubmission limit; milestone code uniqueness; partnership completion gates; batch reversibility"
    error_id: "ERR_PRICE_DRIFT | ERR_SEGREGATION_OF_DUTIES | ERR_INVALID_HOUSEHOLD_DATA | ERR_BATCH_EMPTY | ERR_DELIVERY_ATTEMPTS_EXHAUSTED | ERR_RESUBMISSION_LIMIT | ERR_DUPLICATE_MILESTONE_CODE | ERR_MILESTONE_NOT_TERMINAL | ERR_FAP_TARGET_NOT_MET | ERR_BATCH_IRREVERSIBLE"
    http_status: 409
    applies_to: "various"
  - priority: 12
    category: business_fiscal
    check: "Money checks last: gross_cents > 0; insolvency_exclusion within relief; waterfall covers batch total"
    error_id: "ERR_INVALID_AMOUNT | ERR_INSUFFICIENT_FUNDING"
    http_status: 402
    applies_to: "donations, tax assess, batch commit"
  - priority: 13
    category: concurrency
    check: "OCC: expected_portfolio_version must equal the portfolio's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/portfolios/{id}/contracts, POST /api/portfolios/{id}/abolishment-batches"

# =============================================================================
# Table 1.0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default (before any call) is exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["All subsequent server-stamped timestamps use this clock"]

  # --- SourceOrganization ---
  - method: POST
    path: "/api/source-organizations"
    description: "Register a seller organization (hospital, physician group, or debt buyer)"
    roles: [PlatformAdmin]
    code: 201
    input: [name, org_type, state_code, contact_email]
    output: SourceOrganization
    side_effects: ["status = ACTIVE, version = 1"]
  - method: GET
    path: "/api/source-organizations/{id}"
    description: "Get one source organization"
    roles: &all_roles [PlatformAdmin, PortfolioAnalyst, EligibilityOfficer, ContractManager, FinanceOfficer, DonorRelationsOfficer, ComplianceAuditor, HospitalPartner]
    code: 200
    input: []
    output: SourceOrganization
    side_effects: []
  - method: GET
    path: "/api/source-organizations"
    description: "List source organizations with filters and pagination"
    roles: *all_roles
    code: 200
    input: ["org_type?", "state_code?", "status?", "limit?", "offset?"]
    output: SourceOrganization[]
    side_effects: []
  - method: POST
    path: "/api/source-organizations/{id}/suspend"
    description: "Suspend an org; blocks portfolio submit and HOSPITAL earmark targeting"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: SourceOrganization
    side_effects: ["status -> SUSPENDED, increments version"]
  - method: POST
    path: "/api/source-organizations/{id}/reactivate"
    description: "Reactivate a suspended org"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: SourceOrganization
    side_effects: ["status -> ACTIVE, increments version"]

  # --- EligibilityPolicy ---
  - method: POST
    path: "/api/eligibility-policies"
    description: "Create an eligibility policy (income cap via FPL multiplier + insolvency rule)"
    roles: [EligibilityOfficer, PlatformAdmin]
    code: 201
    input: [name, state_code, fpl_multiplier, insolvency_qualifies, effective_from, effective_to]
    output: EligibilityPolicy
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/api/eligibility-policies/{id}"
    description: "Get one policy"
    roles: *all_roles
    code: 200
    input: []
    output: EligibilityPolicy
    side_effects: []
  - method: GET
    path: "/api/eligibility-policies"
    description: "List policies"
    roles: *all_roles
    code: 200
    input: ["state_code?", "status?", "limit?", "offset?"]
    output: EligibilityPolicy[]
    side_effects: []
  - method: POST
    path: "/api/eligibility-policies/{id}/activate"
    description: "Activate a policy; half-open window overlap within same state_code rejected"
    roles: [EligibilityOfficer]
    code: 200
    input: []
    output: EligibilityPolicy
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/api/eligibility-policies/{id}/retire"
    description: "Retire an active policy"
    roles: [EligibilityOfficer]
    code: 200
    input: []
    output: EligibilityPolicy
    side_effects: ["status -> RETIRED"]

  # --- Portfolio ---
  - method: POST
    path: "/api/portfolios"
    description: "Create a debt portfolio offered by a source organization"
    roles: [PortfolioAnalyst]
    code: 201
    input: [source_org_id, label, face_value_cents, asking_price_cents]
    output: Portfolio
    side_effects: ["status = DRAFT, computed totals = 0, quoted_price_cents = null"]
  - method: GET
    path: "/api/portfolios/{id}"
    description: "Get one portfolio"
    roles: *all_roles
    code: 200
    input: []
    output: Portfolio
    side_effects: []
  - method: GET
    path: "/api/portfolios"
    description: "List portfolios"
    roles: *all_roles
    code: 200
    input: ["source_org_id?", "status?", "limit?", "offset?"]
    output: Portfolio[]
    side_effects: []
  - method: POST
    path: "/api/portfolios/{id}/submit"
    description: "Submit a DRAFT portfolio (requires >= 1 imported account and ACTIVE source org)"
    roles: [PortfolioAnalyst]
    code: 200
    input: []
    output: Portfolio
    side_effects: ["status -> SUBMITTED, increments version"]
  - method: POST
    path: "/api/portfolios/{id}/cancel"
    description: "Cancel a pre-contract portfolio"
    roles: [PortfolioAnalyst]
    code: 200
    input: []
    output: Portfolio
    side_effects: ["status -> CANCELLED, increments version"]
  - method: POST
    path: "/api/portfolios/{id}/price-quote"
    description: "Compute/recompute the tiered purchase quote; SCREENING -> PRICED (or PRICED re-price)"
    roles: [PortfolioAnalyst]
    code: 200
    input: []
    output: Portfolio
    side_effects: ["quoted_price_cents = portfolio_price_quote(...)", "status -> PRICED", "increments version"]
  - method: POST
    path: "/api/portfolios/{id}/accounts"
    description: "Bulk-import the account-level data file into a DRAFT portfolio. Atomic: any invalid item rejects the whole import. Response array order matches request order."
    roles: [PortfolioAnalyst]
    code: 201
    input: [accounts]
    output: DebtAccount[]
    side_effects: ["Each account: eligibility UNSCREENED, lifecycle AVAILABLE, bureau_status from reported_to_bureau; ERR_INVALID_HOUSEHOLD_DATA for household_size < 1; ERR_INVALID_REQUEST when reported_to_bureau true but bureau_name null"]

  # --- DebtAccount ---
  - method: GET
    path: "/api/accounts/{id}"
    description: "Get one account"
    roles: *all_roles
    code: 200
    input: []
    output: DebtAccount
    side_effects: []
  - method: GET
    path: "/api/accounts"
    description: "List accounts with filters"
    roles: *all_roles
    code: 200
    input: ["portfolio_id?", "eligibility_status?", "lifecycle_status?", "bureau_status?", "abolished_batch_id?", "limit?", "offset?"]
    output: DebtAccount[]
    side_effects: []
  - method: POST
    path: "/api/accounts/{id}/review"
    description: "Resolve a NEEDS_REVIEW account to ELIGIBLE or INELIGIBLE"
    roles: [EligibilityOfficer]
    code: 200
    input: [decision]
    output: DebtAccount
    side_effects: ["eligibility_status -> decision", "portfolio eligible totals recomputed"]

  # --- ScreeningRun ---
  - method: POST
    path: "/api/portfolios/{id}/screening-runs"
    description: "Create a screening run against a policy; portfolio -> SCREENING (re-screen back-edge allowed from PRICED)"
    roles: [EligibilityOfficer]
    code: 201
    input: [policy_id]
    output: ScreeningRun
    side_effects: ["Run PENDING", "portfolio status -> SCREENING", "increments Portfolio.version by 1"]
  - method: GET
    path: "/api/screening-runs/{id}"
    description: "Get one screening run"
    roles: *all_roles
    code: 200
    input: []
    output: ScreeningRun
    side_effects: []
  - method: GET
    path: "/api/screening-runs"
    description: "List screening runs"
    roles: *all_roles
    code: 200
    input: ["portfolio_id?", "policy_id?", "status?", "limit?", "offset?"]
    output: ScreeningRun[]
    side_effects: []
  - method: POST
    path: "/api/screening-runs/{id}/execute"
    description: "Execute the run: re-derives every account's eligibility_status per the policy"
    roles: [EligibilityOfficer]
    code: 200
    input: []
    output: ScreeningRun
    side_effects: ["status -> COMPLETED", "counts recorded", "portfolio eligible totals recomputed", "increments Portfolio.version by 1"]

  # --- PurchaseContract ---
  - method: POST
    path: "/api/portfolios/{id}/contracts"
    description: "Create a purchase contract pinning the current quote (OCC on portfolio version)"
    roles: [ContractManager]
    code: 201
    input: [collection_prohibition, no_resale, expected_portfolio_version]
    output: PurchaseContract
    side_effects: ["status = DRAFT", "contract_price_cents = portfolio.quoted_price_cents snapshot", "increments Portfolio.version by 1"]
  - method: GET
    path: "/api/contracts/{id}"
    description: "Get one contract"
    roles: *all_roles
    code: 200
    input: []
    output: PurchaseContract
    side_effects: []
  - method: GET
    path: "/api/contracts"
    description: "List contracts"
    roles: *all_roles
    code: 200
    input: ["portfolio_id?", "status?", "limit?", "offset?"]
    output: PurchaseContract[]
    side_effects: []
  - method: POST
    path: "/api/contracts/{id}/execute"
    description: "Execute a DRAFT contract: covenant + price-drift checks; portfolio -> CONTRACTED"
    roles: [ContractManager]
    code: 200
    input: []
    output: PurchaseContract
    side_effects: ["status -> EXECUTED", "executed_by = X-User-ID", "portfolio -> CONTRACTED, increments version"]
  - method: POST
    path: "/api/contracts/{id}/settle"
    description: "Settle an EXECUTED contract (segregation of duties: settler != executor); portfolio -> SETTLED; accounts partitioned PURCHASED/EXCLUDED"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: PurchaseContract
    side_effects: ["status -> SETTLED", "settled_by = X-User-ID", "portfolio.purchased_price_cents set", "ELIGIBLE accounts -> PURCHASED, others -> EXCLUDED", "increments Portfolio.version by 1"]
  - method: POST
    path: "/api/contracts/{id}/terminate"
    description: "Terminate an EXECUTED contract; portfolio returns to PRICED"
    roles: [ContractManager]
    code: 200
    input: [reason]
    output: PurchaseContract
    side_effects: ["status -> TERMINATED", "portfolio CONTRACTED -> PRICED, increments version"]

  # --- DonorCampaign / Donation ---
  - method: POST
    path: "/api/donor-campaigns"
    description: "Create a donor campaign; earmark GEOGRAPHY requires earmark_state_code, HOSPITAL requires earmark_source_org_id of an ACTIVE HOSPITAL org"
    roles: [DonorRelationsOfficer]
    code: 201
    input: [name, earmark_type, goal_cents, "earmark_state_code?", "earmark_source_org_id?"]
    output: DonorCampaign
    side_effects: ["status = OPEN, raised/committed/spent = 0"]
  - method: GET
    path: "/api/donor-campaigns/{id}"
    description: "Get one campaign"
    roles: *all_roles
    code: 200
    input: []
    output: DonorCampaign
    side_effects: []
  - method: GET
    path: "/api/donor-campaigns"
    description: "List campaigns"
    roles: *all_roles
    code: 200
    input: ["earmark_type?", "earmark_source_org_id?", "status?", "limit?", "offset?"]
    output: DonorCampaign[]
    side_effects: []
  - method: POST
    path: "/api/donor-campaigns/{id}/close"
    description: "Close a campaign to new donations and waterfall draws"
    roles: [DonorRelationsOfficer]
    code: 200
    input: []
    output: DonorCampaign
    side_effects: ["status -> CLOSED"]
  - method: POST
    path: "/api/donor-campaigns/{id}/donations"
    description: "Record a pledged donation; fee and net computed per-donation (round-then-sum)"
    roles: [DonorRelationsOfficer]
    code: 201
    input: [donor_name, donor_email, gross_cents]
    output: Donation
    side_effects: ["status = PLEDGED", "fee_cents/net_cents computed", "ERR_CAMPAIGN_CLOSED when campaign CLOSED"]
  - method: GET
    path: "/api/donations/{id}"
    description: "Get one donation"
    roles: *all_roles
    code: 200
    input: []
    output: Donation
    side_effects: []
  - method: GET
    path: "/api/donations"
    description: "List donations"
    roles: *all_roles
    code: 200
    input: ["campaign_id?", "status?", "limit?", "offset?"]
    output: Donation[]
    side_effects: []
  - method: POST
    path: "/api/donations/{id}/receive"
    description: "Mark a pledge received; campaign raised += net; threshold may flip OPEN -> FUNDED"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: Donation
    side_effects: ["status -> RECEIVED", "campaign.raised_cents += net_cents", "campaign threshold re-evaluated"]
  - method: POST
    path: "/api/donations/{id}/refund"
    description: "Refund a received donation (compensating action); threshold may flip FUNDED -> OPEN"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: Donation
    side_effects: ["status -> REFUNDED", "campaign.raised_cents -= net_cents", "campaign threshold re-evaluated"]

  # --- AbolishmentBatch ---
  - method: POST
    path: "/api/portfolios/{id}/abolishment-batches"
    description: "Stage an abolishment batch over PURCHASED accounts (OCC on portfolio version)"
    roles: [FinanceOfficer]
    code: 201
    input: [account_ids, expected_portfolio_version]
    output: AbolishmentBatch
    side_effects: ["status = STAGING", "total_abolished_cents = sum(balance + accrued_adjustment)", "increments Portfolio.version by 1"]
  - method: GET
    path: "/api/abolishment-batches/{id}"
    description: "Get one batch"
    roles: *all_roles
    code: 200
    input: []
    output: AbolishmentBatch
    side_effects: []
  - method: GET
    path: "/api/abolishment-batches"
    description: "List batches"
    roles: *all_roles
    code: 200
    input: ["portfolio_id?", "status?", "limit?", "offset?"]
    output: AbolishmentBatch[]
    side_effects: []
  - method: POST
    path: "/api/abolishment-batches/{id}/commit"
    description: "Commit a staged batch; runs the funding waterfall atomically"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: AbolishmentBatch
    side_effects: ["status -> COMMITTED", "funding_allocations recorded", "campaign.committed_cents += allocation", "portfolio SETTLED -> ABOLISHING"]
  - method: POST
    path: "/api/abolishment-batches/{id}/uncommit"
    description: "Uncommit (compensating): releases campaign reservations, back to STAGING"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: AbolishmentBatch
    side_effects: ["status -> STAGING", "campaign reservations released", "funding_allocations cleared"]
  - method: POST
    path: "/api/abolishment-batches/{id}/finalize"
    description: "Finalize: abolishes accounts and cascades letters, CDRs, tax records"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: AbolishmentBatch
    side_effects: ["status -> FINALIZED", "accounts -> ABOLISHED with final relief value", "letters QUEUED + tax records PENDING + CDRs auto-SUBMITTED created", "campaign committed -> spent", "portfolio abolished totals updated; auto-CLOSE when nothing left"]
  - method: POST
    path: "/api/abolishment-batches/{id}/reverse"
    description: "Reverse a FINALIZED batch (compensating) when no irreversible artifacts exist"
    roles: [FinanceOfficer]
    code: 200
    input: [reason]
    output: AbolishmentBatch
    side_effects: ["status -> REVERSED", "accounts -> PURCHASED", "letters/CDRs/tax records CANCELLED", "campaign spent_cents -= allocation", "portfolio abolished totals restored"]

  # --- NotificationLetter ---
  - method: GET
    path: "/api/notification-letters/{id}"
    description: "Get one letter"
    roles: *all_roles
    code: 200
    input: []
    output: NotificationLetter
    side_effects: []
  - method: GET
    path: "/api/notification-letters"
    description: "List letters"
    roles: *all_roles
    code: 200
    input: ["account_id?", "batch_id?", "status?", "limit?", "offset?"]
    output: NotificationLetter[]
    side_effects: []
  - method: POST
    path: "/api/notification-letters/{id}/send"
    description: "Send a QUEUED letter (batch must be FINALIZED)"
    roles: [DonorRelationsOfficer]
    code: 200
    input: []
    output: NotificationLetter
    side_effects: ["status -> SENT", "sent_at set"]
  - method: POST
    path: "/api/notification-letters/{id}/mark-bounced"
    description: "Record a bounce; third bounce flips to UNDELIVERABLE"
    roles: [DonorRelationsOfficer]
    code: 200
    input: []
    output: NotificationLetter
    side_effects: ["attempt_count += 1", "status -> BOUNCED or UNDELIVERABLE at MAX_LETTER_ATTEMPTS"]
  - method: POST
    path: "/api/notification-letters/{id}/requeue"
    description: "Requeue a bounced letter, optionally with a corrected address (bounce cycle)"
    roles: [DonorRelationsOfficer]
    code: 200
    input: ["corrected_address?"]
    output: NotificationLetter
    side_effects: ["status -> QUEUED", "mailing_address updated when corrected_address provided"]
  - method: POST
    path: "/api/notification-letters/{id}/mark-delivered"
    description: "Mark a sent letter delivered"
    roles: [DonorRelationsOfficer]
    code: 200
    input: []
    output: NotificationLetter
    side_effects: ["status -> DELIVERED"]

  # --- CreditDeletionRequest ---
  - method: POST
    path: "/api/accounts/{id}/credit-deletion-requests"
    description: "Manually create a DRAFT CDR for an ABOLISHED account still REPORTED"
    roles: [ComplianceAuditor]
    code: 201
    input: [bureau]
    output: CreditDeletionRequest
    side_effects: ["status = DRAFT", "batch_id = null"]
  - method: GET
    path: "/api/credit-deletion-requests/{id}"
    description: "Get one CDR"
    roles: *all_roles
    code: 200
    input: []
    output: CreditDeletionRequest
    side_effects: []
  - method: GET
    path: "/api/credit-deletion-requests"
    description: "List CDRs"
    roles: *all_roles
    code: 200
    input: ["account_id?", "batch_id?", "status?", "limit?", "offset?"]
    output: CreditDeletionRequest[]
    side_effects: []
  - method: POST
    path: "/api/credit-deletion-requests/{id}/submit"
    description: "Submit a DRAFT CDR to the bureau"
    roles: [ComplianceAuditor]
    code: 200
    input: []
    output: CreditDeletionRequest
    side_effects: ["status -> SUBMITTED", "account bureau_status -> DELETION_REQUESTED"]
  - method: POST
    path: "/api/credit-deletion-requests/{id}/acknowledge"
    description: "Bureau acknowledged deletion"
    roles: [ComplianceAuditor]
    code: 200
    input: []
    output: CreditDeletionRequest
    side_effects: ["status -> ACKNOWLEDGED", "account bureau_status -> DELETED"]
  - method: POST
    path: "/api/credit-deletion-requests/{id}/reject"
    description: "Bureau rejected; at MAX_CDR_RESUBMISSIONS the CDR fails terminally"
    roles: [ComplianceAuditor]
    code: 200
    input: [rejection_reason]
    output: CreditDeletionRequest
    side_effects: ["status -> REJECTED or FAILED", "account bureau_status -> REPORTED or DELETION_FAILED"]
  - method: POST
    path: "/api/credit-deletion-requests/{id}/resubmit"
    description: "Resubmit a REJECTED CDR (rejection cycle, bounded by MAX_CDR_RESUBMISSIONS)"
    roles: [ComplianceAuditor]
    code: 200
    input: []
    output: CreditDeletionRequest
    side_effects: ["status -> SUBMITTED", "resubmission_count += 1", "account bureau_status -> DELETION_REQUESTED"]

  # --- TaxReliefRecord ---
  - method: GET
    path: "/api/tax-relief-records/{id}"
    description: "Get one tax relief record"
    roles: *all_roles
    code: 200
    input: []
    output: TaxReliefRecord
    side_effects: []
  - method: GET
    path: "/api/tax-relief-records"
    description: "List tax relief records"
    roles: *all_roles
    code: 200
    input: ["account_id?", "status?", "limit?", "offset?"]
    output: TaxReliefRecord[]
    side_effects: []
  - method: POST
    path: "/api/tax-relief-records/{id}/assess"
    description: "Assess tax treatment; full insolvency exclusion routes to EXEMPT"
    roles: [ComplianceAuditor]
    code: 200
    input: [insolvency_exclusion_cents]
    output: TaxReliefRecord
    side_effects: ["reportable_amount_cents computed", "status -> ASSESSED (reportable > 0) or EXEMPT (reportable == 0)"]
  - method: POST
    path: "/api/tax-relief-records/{id}/file"
    description: "File the 1099-C for an ASSESSED record"
    roles: [ComplianceAuditor]
    code: 200
    input: []
    output: TaxReliefRecord
    side_effects: ["status -> FILED"]

  # --- HospitalPartnership / PartnershipMilestone ---
  - method: POST
    path: "/api/hospital-partnerships"
    description: "Create a partnership with a HOSPITAL org combining abolishment with FAP improvements"
    roles: [DonorRelationsOfficer]
    code: 201
    input: [source_org_id, fap_baseline_score, fap_target_score]
    output: HospitalPartnership
    side_effects: ["status = PROPOSED", "fap_current_score = fap_baseline_score"]
  - method: GET
    path: "/api/hospital-partnerships/{id}"
    description: "Get one partnership"
    roles: *all_roles
    code: 200
    input: []
    output: HospitalPartnership
    side_effects: []
  - method: GET
    path: "/api/hospital-partnerships"
    description: "List partnerships"
    roles: *all_roles
    code: 200
    input: ["source_org_id?", "status?", "limit?", "offset?"]
    output: HospitalPartnership[]
    side_effects: []
  - method: POST
    path: "/api/hospital-partnerships/{id}/activate"
    description: "Activate a proposed partnership"
    roles: [DonorRelationsOfficer]
    code: 200
    input: []
    output: HospitalPartnership
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/api/hospital-partnerships/{id}/suspend"
    description: "Suspend an active partnership (blocks milestone transitions)"
    roles: [DonorRelationsOfficer]
    code: 200
    input: []
    output: HospitalPartnership
    side_effects: ["status -> SUSPENDED"]
  - method: POST
    path: "/api/hospital-partnerships/{id}/resume"
    description: "Resume a suspended partnership (suspension cycle)"
    roles: [DonorRelationsOfficer]
    code: 200
    input: []
    output: HospitalPartnership
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/api/hospital-partnerships/{id}/complete"
    description: "Complete when all milestones terminal and fap_current_score >= fap_target_score"
    roles: [DonorRelationsOfficer]
    code: 200
    input: []
    output: HospitalPartnership
    side_effects: ["status -> COMPLETED"]
  - method: POST
    path: "/api/hospital-partnerships/{id}/milestones"
    description: "Add a FAP improvement milestone; code unique within partnership"
    roles: [DonorRelationsOfficer, HospitalPartner]
    code: 201
    input: [code, description, weight, due_date]
    output: PartnershipMilestone
    side_effects: ["status = PENDING", "partnership fap_current_score recomputed"]
  - method: GET
    path: "/api/partnership-milestones/{id}"
    description: "Get one milestone"
    roles: *all_roles
    code: 200
    input: []
    output: PartnershipMilestone
    side_effects: []
  - method: GET
    path: "/api/partnership-milestones"
    description: "List milestones"
    roles: *all_roles
    code: 200
    input: ["partnership_id?", "status?", "limit?", "offset?"]
    output: PartnershipMilestone[]
    side_effects: []
  - method: POST
    path: "/api/partnership-milestones/{id}/mark-met"
    description: "Mark a milestone met (PENDING or MISSED); HospitalPartner must own the partnership's org"
    roles: [HospitalPartner, DonorRelationsOfficer]
    code: 200
    input: []
    output: PartnershipMilestone
    side_effects: ["status -> MET", "partnership fap_current_score recomputed"]
  - method: POST
    path: "/api/partnership-milestones/{id}/mark-missed"
    description: "Mark a PENDING milestone missed (logical clock must be past due_date)"
    roles: [DonorRelationsOfficer]
    code: 200
    input: []
    output: PartnershipMilestone
    side_effects: ["status -> MISSED"]
  - method: POST
    path: "/api/partnership-milestones/{id}/waive"
    description: "Waive a milestone; excluded from the FAP score denominator"
    roles: [DonorRelationsOfficer]
    code: 200
    input: []
    output: PartnershipMilestone
    side_effects: ["status -> WAIVED", "partnership fap_current_score recomputed"]

  # --- ImpactReport ---
  - method: POST
    path: "/api/impact-reports"
    description: "Create an impact report; households_relieved and dollars_abolished_cents computed at creation per counting_variant"
    roles: [PlatformAdmin, ComplianceAuditor]
    code: 201
    input: [scope, period_start, period_end, counting_variant, "scope_state_code?", "scope_source_org_id?"]
    output: ImpactReport
    side_effects: ["status = DRAFT", "computed fields populated"]
  - method: GET
    path: "/api/impact-reports/{id}"
    description: "Get one impact report"
    roles: *all_roles
    code: 200
    input: []
    output: ImpactReport
    side_effects: []
  - method: GET
    path: "/api/impact-reports"
    description: "List impact reports"
    roles: *all_roles
    code: 200
    input: ["scope?", "scope_source_org_id?", "status?", "limit?", "offset?"]
    output: ImpactReport[]
    side_effects: []
  - method: POST
    path: "/api/impact-reports/{id}/publish"
    description: "Publish a report; closed-interval period overlap within the same scope key is rejected"
    roles: [PlatformAdmin, ComplianceAuditor]
    code: 200
    input: []
    output: ImpactReport
    side_effects: ["status -> PUBLISHED"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request, missing required field, invalid enum, or invalid field value (e.g. reported_to_bureau true with null bureau_name)" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unrecognized X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the endpoint, or HospitalPartner acting on another org's milestone" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-segment entity does not exist" }
  - { id: ERR_SOURCE_ORG_NOT_FOUND, http: 404, condition: "Body-referenced source_org_id does not exist" }
  - { id: ERR_POLICY_NOT_FOUND, http: 404, condition: "Body-referenced policy_id does not exist" }
  - { id: ERR_CAMPAIGN_NOT_FOUND, http: 404, condition: "Body/path-referenced campaign does not exist" }
  - { id: ERR_ACCOUNT_NOT_FOUND, http: 404, condition: "account_ids entry does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a legal source state for the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_portfolio_version does not match the portfolio's current version (OCC)" }
  - { id: ERR_SOURCE_ORG_SUSPENDED, http: 409, condition: "Source org SUSPENDED blocks portfolio submit" }
  - { id: ERR_POLICY_NOT_ACTIVE, http: 409, condition: "Screening run create/execute requires an ACTIVE policy" }
  - { id: ERR_POLICY_WINDOW_OVERLAP, http: 409, condition: "ACTIVE policy half-open window overlaps another ACTIVE policy in the same state_code" }
  - { id: ERR_SCREENING_INCOMPLETE, http: 409, condition: "Price quote requires a COMPLETED run and zero UNSCREENED/NEEDS_REVIEW accounts" }
  - { id: ERR_PORTFOLIO_NOT_SETTLED, http: 409, condition: "Batch create/commit requires portfolio SETTLED or ABOLISHING" }
  - { id: ERR_ACCOUNT_NOT_PURCHASED, http: 409, condition: "Batch account_ids must all be lifecycle PURCHASED" }
  - { id: ERR_ACCOUNT_NOT_ABOLISHED, http: 409, condition: "Manual CDR creation requires an ABOLISHED account" }
  - { id: ERR_BATCH_EMPTY, http: 422, condition: "Batch account_ids empty, or portfolio submit with zero imported accounts" }
  - { id: ERR_BATCH_ACCOUNT_FOREIGN, http: 409, condition: "Batch account_ids include an account of a different portfolio" }
  - { id: ERR_BATCH_IRREVERSIBLE, http: 409, condition: "Reverse blocked: a letter SENT/DELIVERED/UNDELIVERABLE, a CDR ACKNOWLEDGED, or a tax record FILED/EXEMPT exists" }
  - { id: ERR_INSUFFICIENT_FUNDING, http: 402, condition: "Funding waterfall cannot cover total_abolished_cents; commit is atomic (no partial reservation)" }
  - { id: ERR_COLLECTION_COVENANT_MISSING, http: 422, condition: "Contract execute requires collection_prohibition == true AND no_resale == true" }
  - { id: ERR_PRICE_DRIFT, http: 409, condition: "Portfolio.quoted_price_cents no longer equals the contract's pinned contract_price_cents" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Contract settler X-User-ID must differ from executed_by" }
  - { id: ERR_CAMPAIGN_CLOSED, http: 409, condition: "Donations to a CLOSED campaign" }
  - { id: ERR_INVALID_AMOUNT, http: 422, condition: "gross_cents <= 0, or insolvency_exclusion_cents outside [0, relief_amount_cents]" }
  - { id: ERR_EARMARK_TARGET_NOT_HOSPITAL, http: 422, condition: "HOSPITAL-earmarked campaign references an org whose org_type is not HOSPITAL" }
  - { id: ERR_EARMARK_TARGET_SUSPENDED, http: 409, condition: "HOSPITAL-earmarked campaign references a SUSPENDED org" }
  - { id: ERR_REPORT_PERIOD_OVERLAP, http: 409, condition: "PUBLISHED report closed period overlaps another PUBLISHED report with the same scope key (shared boundary date counts)" }
  - { id: ERR_INVALID_HOUSEHOLD_DATA, http: 422, condition: "household_size present but < 1 at account import" }
  - { id: ERR_DELIVERY_ATTEMPTS_EXHAUSTED, http: 409, condition: "Requeue attempted when attempt_count >= MAX_LETTER_ATTEMPTS" }
  - { id: ERR_RESUBMISSION_LIMIT, http: 409, condition: "CDR resubmit attempted when resubmission_count >= MAX_CDR_RESUBMISSIONS (2)" }
  - { id: ERR_BUREAU_NOT_REPORTED, http: 409, condition: "CDR submit requires account bureau_status == REPORTED" }
  - { id: ERR_DUPLICATE_MILESTONE_CODE, http: 409, condition: "Milestone code already used within the partnership" }
  - { id: ERR_PARTNERSHIP_NOT_HOSPITAL, http: 422, condition: "Partnership source org must be org_type HOSPITAL" }
  - { id: ERR_MILESTONE_NOT_TERMINAL, http: 409, condition: "Partnership complete requires every milestone in {MET, MISSED, WAIVED}" }
  - { id: ERR_FAP_TARGET_NOT_MET, http: 409, condition: "Partnership complete requires fap_current_score >= fap_target_score" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; owns source-org registry, logical clock, and impact reports"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /api/source-organizations (+suspend/reactivate)"
    shared_operations:
      - "POST /api/eligibility-policies (with EligibilityOfficer)"
      - "POST /api/impact-reports, POST /api/impact-reports/{id}/publish (with ComplianceAuditor)"
      - "all GET endpoints"
  - name: PortfolioAnalyst
    description: "Sources portfolios and imports account data files"
    identity: opaque
    exclusive_operations:
      - "POST /api/portfolios (+submit/cancel/price-quote)"
      - "POST /api/portfolios/{id}/accounts"
    shared_operations: ["all GET endpoints"]
  - name: EligibilityOfficer
    description: "Owns eligibility policies, screening runs, and NEEDS_REVIEW resolution"
    identity: opaque
    exclusive_operations:
      - "POST /api/eligibility-policies/{id}/activate, /retire"
      - "POST /api/portfolios/{id}/screening-runs, POST /api/screening-runs/{id}/execute"
      - "POST /api/accounts/{id}/review"
    shared_operations:
      - "POST /api/eligibility-policies (with PlatformAdmin)"
      - "all GET endpoints"
  - name: ContractManager
    description: "Drafts and executes purchase contracts; may NOT settle them (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /api/portfolios/{id}/contracts"
      - "POST /api/contracts/{id}/execute, /terminate"
    shared_operations: ["all GET endpoints"]
  - name: FinanceOfficer
    description: "Moves money: settles contracts, receives/refunds donations, commits/finalizes/reverses abolishment batches"
    identity: opaque
    exclusive_operations:
      - "POST /api/contracts/{id}/settle"
      - "POST /api/donations/{id}/receive, /refund"
      - "POST /api/portfolios/{id}/abolishment-batches and batch commit/uncommit/finalize/reverse"
    shared_operations: ["all GET endpoints"]
  - name: DonorRelationsOfficer
    description: "Runs donor campaigns, partnerships, milestones, and beneficiary notification letters"
    identity: opaque
    exclusive_operations:
      - "POST /api/donor-campaigns (+close), POST /api/donor-campaigns/{id}/donations"
      - "POST /api/hospital-partnerships (+activate/suspend/resume/complete)"
      - "POST /api/partnership-milestones/{id}/mark-missed, /waive"
      - "letter send/mark-bounced/requeue/mark-delivered"
    shared_operations:
      - "POST /api/hospital-partnerships/{id}/milestones, POST /api/partnership-milestones/{id}/mark-met (with HospitalPartner)"
      - "all GET endpoints"
  - name: ComplianceAuditor
    description: "Owns credit bureau deletion lifecycle and tax relief assessment/filing"
    identity: opaque
    exclusive_operations:
      - "POST /api/accounts/{id}/credit-deletion-requests and CDR submit/acknowledge/reject/resubmit"
      - "POST /api/tax-relief-records/{id}/assess, /file"
    shared_operations:
      - "POST /api/impact-reports, POST /api/impact-reports/{id}/publish (with PlatformAdmin)"
      - "all GET endpoints"
  - name: HospitalPartner
    description: "Partner hospital contact; marks own partnership milestones met"
    identity: "entity_backed:SourceOrganization"
    exclusive_operations: []
    shared_operations:
      - "POST /api/hospital-partnerships/{id}/milestones, POST /api/partnership-milestones/{id}/mark-met (own org only, ERR_FORBIDDEN otherwise)"
      - "all GET endpoints"
