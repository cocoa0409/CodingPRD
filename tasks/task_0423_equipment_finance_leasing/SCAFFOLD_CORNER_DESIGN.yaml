# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over §1.1-§1.7 surface. Same setup_api_calls discipline as §1.8.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_lessor_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Lessor, endpoints]
        distinguishing_aspect: "POST /lessors with all required fields returns 201 and echoes legal_name, home_state_code, sales_tax_rate_bps; portfolio_value_cents initialized to 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /lessors"
              payload: { legal_name: "Sierra Leasing", home_state_code: "TX", sales_tax_rate_bps: 625, property_tax_rate_bps: 100 }
              as: FundingOfficer
              captures: { lessor_id: "$.data.id" }
          assert:
            - "HTTP status == 201"
            - "Lessor.${lessor_id}.legal_name == 'Sierra Leasing'"
            - "Lessor.${lessor_id}.portfolio_value_cents == 0"

      - name: create_credit_application_missing_required_field
        claim_type: Required Fields
        grounds: [entities.CreditApplication.fields.credit_score, "validations[priority=4]"]
        distinguishing_aspect: "POST credit-application omitting credit_score returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A Lessor exists"]
          setup_api_calls:
            - call: "POST /lessors"
              payload: { legal_name: "Tango Leasing", home_state_code: "TX", sales_tax_rate_bps: 625, property_tax_rate_bps: 100 }
              as: FundingOfficer
              captures: { lessor_id: "$.data.id" }
          trigger:
            - call: "POST /lessors/${lessor_id}/credit-applications"
              payload: { applicant_legal_name: "Cust", requested_amount_cents: 500000 }
              as: CreditAnalyst
              as_user_id: "analyst-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_REQUEST with HTTP 400"

      - name: get_lease_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Lease, "validations[priority=3]"]
        distinguishing_aspect: "GET a lease id that does not exist returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["A Lessor exists"]
          setup_api_calls:
            - call: "POST /lessors"
              payload: { legal_name: "Uniform Leasing", home_state_code: "TX", sales_tax_rate_bps: 625, property_tax_rate_bps: 100 }
              as: FundingOfficer
              captures: { lessor_id: "$.data.id" }
          trigger:
            - call: "GET /lessors/${lessor_id}/leases/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FundingOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_NOT_FOUND with HTTP 404"

      - name: lessee_computed_available_credit_on_mint
        claim_type: Computed Fields
        grounds: [entities.Lessee.fields.available_credit_cents, entities.Lessee.fields.committed_credit_cents]
        distinguishing_aspect: "A freshly minted Lessee has committed_credit_cents == 0 and available_credit_cents == approved_credit_cents (1000000), with no leases yet."
        test_recipe:
          setup: ["Approved application, approved_amount 1000000"]
          setup_api_calls:
            - call: "POST /lessors"
              payload: { legal_name: "Victor Leasing", home_state_code: "TX", sales_tax_rate_bps: 625, property_tax_rate_bps: 100 }
              as: FundingOfficer
              captures: { lessor_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/credit-applications"
              payload: { applicant_legal_name: "Cust", requested_amount_cents: 1000000, credit_score: 760 }
              as: CreditAnalyst
              as_user_id: "analyst-1"
              captures: { app_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/credit-applications/${app_id}/submit"
              payload: {}
              as: CreditAnalyst
              as_user_id: "analyst-1"
            - call: "POST /lessors/${lessor_id}/credit-applications/${app_id}/approve"
              payload: { approved_amount_cents: 1000000 }
              as: CreditAnalyst
              as_user_id: "analyst-2"
          trigger:
            - call: "GET /lessors/${lessor_id}/lessees?credit_application_id=${app_id}"
              payload: {}
              as: FundingOfficer
              captures: { lessee_id: "$.data[0].id" }
          assert:
            - "Lessee.${lessee_id}.committed_credit_cents == 0"
            - "Lessee.${lessee_id}.available_credit_cents == 1000000"
            - "Lessee.${lessee_id}.approved_credit_cents == 1000000"

      - name: credit_application_pricing_tier_prime_vs_near_prime
        claim_type: Computed Fields
        grounds: [calculations.pricing_tier, entities.CreditApplication.fields.pricing_tier]
        distinguishing_aspect: "pricing_tier computed at approval: credit_score 720 -> PRIME, 700 -> NEAR_PRIME (the >= 720 / >= 640 thresholds)."
        test_recipe:
          setup: ["Two submitted applications, scores 720 and 700"]
          setup_api_calls:
            - call: "POST /lessors"
              payload: { legal_name: "Whiskey Leasing", home_state_code: "TX", sales_tax_rate_bps: 625, property_tax_rate_bps: 100 }
              as: FundingOfficer
              captures: { lessor_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/credit-applications"
              payload: { applicant_legal_name: "P720", requested_amount_cents: 500000, credit_score: 720 }
              as: CreditAnalyst
              as_user_id: "analyst-1"
              captures: { app720_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/credit-applications/${app720_id}/submit"
              payload: {}
              as: CreditAnalyst
              as_user_id: "analyst-1"
            - call: "POST /lessors/${lessor_id}/credit-applications"
              payload: { applicant_legal_name: "N700", requested_amount_cents: 500000, credit_score: 700 }
              as: CreditAnalyst
              as_user_id: "analyst-1"
              captures: { app700_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/credit-applications/${app700_id}/submit"
              payload: {}
              as: CreditAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /lessors/${lessor_id}/credit-applications/${app720_id}/approve"
              payload: { approved_amount_cents: 500000 }
              as: CreditAnalyst
              as_user_id: "analyst-2"
            - call: "POST /lessors/${lessor_id}/credit-applications/${app700_id}/approve"
              payload: { approved_amount_cents: 500000 }
              as: CreditAnalyst
              as_user_id: "analyst-2"
          assert:
            - "CreditApplication.${app720_id}.pricing_tier == PRIME"
            - "CreditApplication.${app700_id}.pricing_tier == NEAR_PRIME"

      - name: lease_system_ids_ignore_client_input
        claim_type: System Fields
        grounds: [entities.Lease, entities.Lease.fields.lifecycle_status]
        distinguishing_aspect: "A created Lease starts lifecycle_status=ORIGINATION and funding_status=PENDING_FUNDING regardless of body; version starts at 1; server mints id."
        test_recipe:
          setup: ["Approved lessee + approved vendor"]
          setup_api_calls:
            - call: "POST /lessors"
              payload: { legal_name: "Xray Leasing", home_state_code: "TX", sales_tax_rate_bps: 625, property_tax_rate_bps: 100 }
              as: FundingOfficer
              captures: { lessor_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/vendors"
              payload: { name: "MachineCo", remit_account: "RA-1" }
              as: FundingOfficer
              captures: { vendor_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/vendors/${vendor_id}/approve"
              payload: {}
              as: FundingOfficer
            - call: "POST /lessors/${lessor_id}/credit-applications"
              payload: { applicant_legal_name: "Cust", requested_amount_cents: 1000000, credit_score: 760 }
              as: CreditAnalyst
              as_user_id: "analyst-1"
              captures: { app_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/credit-applications/${app_id}/submit"
              payload: {}
              as: CreditAnalyst
              as_user_id: "analyst-1"
            - call: "POST /lessors/${lessor_id}/credit-applications/${app_id}/approve"
              payload: { approved_amount_cents: 1000000 }
              as: CreditAnalyst
              as_user_id: "analyst-2"
            - call: "GET /lessors/${lessor_id}/lessees?credit_application_id=${app_id}"
              payload: {}
              as: FundingOfficer
              captures: { lessee_id: "$.data[0].id" }
          trigger:
            - call: "POST /lessors/${lessor_id}/lessees/${lessee_id}/leases"
              payload: { vendor_id: "${vendor_id}", lease_type: "FMV", equipment_cost_cents: 500000, term_months: 12, monthly_rate_factor_bps: 2000 }
              as: FundingOfficer
              captures: { lease_id: "$.data.id" }
          assert:
            - "Lease.${lease_id}.lifecycle_status == ORIGINATION"
            - "Lease.${lease_id}.funding_status == PENDING_FUNDING"
            - "Lease.${lease_id}.version == 1"

      - name: lease_advance_and_deposit_defaults_applied
        claim_type: Defaults
        grounds: [entities.Lease.fields.advance_payment_count, entities.Lease.fields.security_deposit_cents]
        distinguishing_aspect: "Omitting advance_payment_count and security_deposit_cents defaults both to 0, so financed_amount_cents == equipment_cost_cents (500000) after book."
        test_recipe:
          setup: ["Approved lessee + approved vendor; lease created without advance/deposit; one unit"]
          setup_api_calls:
            - call: "POST /lessors"
              payload: { legal_name: "Yankee Leasing", home_state_code: "TX", sales_tax_rate_bps: 625, property_tax_rate_bps: 100 }
              as: FundingOfficer
              captures: { lessor_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/vendors"
              payload: { name: "MachineCo", remit_account: "RA-1" }
              as: FundingOfficer
              captures: { vendor_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/vendors/${vendor_id}/approve"
              payload: {}
              as: FundingOfficer
            - call: "POST /lessors/${lessor_id}/credit-applications"
              payload: { applicant_legal_name: "Cust", requested_amount_cents: 1000000, credit_score: 760 }
              as: CreditAnalyst
              as_user_id: "analyst-1"
              captures: { app_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/credit-applications/${app_id}/submit"
              payload: {}
              as: CreditAnalyst
              as_user_id: "analyst-1"
            - call: "POST /lessors/${lessor_id}/credit-applications/${app_id}/approve"
              payload: { approved_amount_cents: 1000000 }
              as: CreditAnalyst
              as_user_id: "analyst-2"
            - call: "GET /lessors/${lessor_id}/lessees?credit_application_id=${app_id}"
              payload: {}
              as: FundingOfficer
              captures: { lessee_id: "$.data[0].id" }
            - call: "POST /lessors/${lessor_id}/lessees/${lessee_id}/leases"
              payload: { vendor_id: "${vendor_id}", lease_type: "FMV", equipment_cost_cents: 500000, term_months: 12, monthly_rate_factor_bps: 2000 }
              as: FundingOfficer
              captures: { lease_id: "$.data.id", lease_v: "$.data.version" }
            - call: "POST /lessors/${lessor_id}/leases/${lease_id}/equipment"
              payload: { serial_number: "Y-SN-1", description: "Press", original_cost_cents: 500000 }
              as: FundingOfficer
          trigger:
            - call: "POST /lessors/${lessor_id}/leases/${lease_id}/book"
              payload: { expected_lease_version: "${lease_v}" }
              as: FundingOfficer
          assert:
            - "Lease.${lease_id}.advance_payment_count == 0"
            - "Lease.${lease_id}.security_deposit_cents == 0"
            - "Lease.${lease_id}.financed_amount_cents == 500000"

      - name: invalid_lease_type_enum_rejected
        claim_type: Type Constraints
        grounds: [entities.Lease.fields.lease_type, "validations[priority=4]"]
        distinguishing_aspect: "Creating a lease with lease_type 'LEASE_TO_OWN' (not in {FMV, DOLLAR_OUT, TRAC}) returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Approved lessee + approved vendor"]
          setup_api_calls:
            - call: "POST /lessors"
              payload: { legal_name: "Zulu Leasing", home_state_code: "TX", sales_tax_rate_bps: 625, property_tax_rate_bps: 100 }
              as: FundingOfficer
              captures: { lessor_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/vendors"
              payload: { name: "MachineCo", remit_account: "RA-1" }
              as: FundingOfficer
              captures: { vendor_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/vendors/${vendor_id}/approve"
              payload: {}
              as: FundingOfficer
            - call: "POST /lessors/${lessor_id}/credit-applications"
              payload: { applicant_legal_name: "Cust", requested_amount_cents: 1000000, credit_score: 760 }
              as: CreditAnalyst
              as_user_id: "analyst-1"
              captures: { app_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/credit-applications/${app_id}/submit"
              payload: {}
              as: CreditAnalyst
              as_user_id: "analyst-1"
            - call: "POST /lessors/${lessor_id}/credit-applications/${app_id}/approve"
              payload: { approved_amount_cents: 1000000 }
              as: CreditAnalyst
              as_user_id: "analyst-2"
            - call: "GET /lessors/${lessor_id}/lessees?credit_application_id=${app_id}"
              payload: {}
              as: FundingOfficer
              captures: { lessee_id: "$.data[0].id" }
          trigger:
            - call: "POST /lessors/${lessor_id}/lessees/${lessee_id}/leases"
              payload: { vendor_id: "${vendor_id}", lease_type: "LEASE_TO_OWN", equipment_cost_cents: 500000, term_months: 12, monthly_rate_factor_bps: 2000 }
              as: FundingOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_REQUEST with HTTP 400"

      - name: list_vendors_pagination_envelope
        claim_type: Listing
        grounds: [entities.Vendor, endpoints]
        distinguishing_aspect: "GET /lessors/{id}/vendors returns an array envelope with pagination fields total_count and has_more."
        test_recipe:
          setup: ["One vendor created"]
          setup_api_calls:
            - call: "POST /lessors"
              payload: { legal_name: "Alpha2 Leasing", home_state_code: "TX", sales_tax_rate_bps: 625, property_tax_rate_bps: 100 }
              as: FundingOfficer
              captures: { lessor_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/vendors"
              payload: { name: "MachineCo", remit_account: "RA-1" }
              as: FundingOfficer
          trigger:
            - call: "GET /lessors/${lessor_id}/vendors"
              payload: {}
              as: FundingOfficer
          assert:
            - "response_type == array"
            - "meta total_count == 1"
            - "meta has_more == false"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: vendor_approve_from_approved_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Vendor.transitions.PENDING_to_APPROVED]
        distinguishing_aspect: "Approving an already-APPROVED vendor (no PENDING/SUSPENDED from-state) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["An APPROVED vendor"]
          setup_api_calls:
            - call: "POST /lessors"
              payload: { legal_name: "Bravo2 Leasing", home_state_code: "TX", sales_tax_rate_bps: 625, property_tax_rate_bps: 100 }
              as: FundingOfficer
              captures: { lessor_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/vendors"
              payload: { name: "MachineCo", remit_account: "RA-1" }
              as: FundingOfficer
              captures: { vendor_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/vendors/${vendor_id}/approve"
              payload: {}
              as: FundingOfficer
          trigger:
            - call: "POST /lessors/${lessor_id}/vendors/${vendor_id}/approve"
              payload: {}
              as: FundingOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_STATE with HTTP 409"

      - name: begin_end_of_term_before_term_complete
        claim_type: Precondition Enforcement
        grounds: [state_machines.Lease.transitions.ACTIVE_to_END_OF_TERM, "validations[priority=15]"]
        distinguishing_aspect: "begin-end-of-term on an ACTIVE lease with 0 paid installments (term not complete) returns ERR_TERM_NOT_COMPLETE."
        test_recipe:
          setup: ["ACTIVE FMV lease term 2, no installments paid"]
          setup_api_calls:
            - call: "POST /lessors"
              payload: { legal_name: "Charlie2 Leasing", home_state_code: "TX", sales_tax_rate_bps: 625, property_tax_rate_bps: 100 }
              as: FundingOfficer
              captures: { lessor_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/vendors"
              payload: { name: "MachineCo", remit_account: "RA-1" }
              as: FundingOfficer
              captures: { vendor_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/vendors/${vendor_id}/approve"
              payload: {}
              as: FundingOfficer
            - call: "POST /lessors/${lessor_id}/credit-applications"
              payload: { applicant_legal_name: "Cust", requested_amount_cents: 1000000, credit_score: 760 }
              as: CreditAnalyst
              as_user_id: "analyst-1"
              captures: { app_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/credit-applications/${app_id}/submit"
              payload: {}
              as: CreditAnalyst
              as_user_id: "analyst-1"
            - call: "POST /lessors/${lessor_id}/credit-applications/${app_id}/approve"
              payload: { approved_amount_cents: 1000000 }
              as: CreditAnalyst
              as_user_id: "analyst-2"
            - call: "GET /lessors/${lessor_id}/lessees?credit_application_id=${app_id}"
              payload: {}
              as: FundingOfficer
              captures: { lessee_id: "$.data[0].id" }
            - call: "POST /lessors/${lessor_id}/lessees/${lessee_id}/leases"
              payload: { vendor_id: "${vendor_id}", lease_type: "FMV", equipment_cost_cents: 500000, term_months: 2, monthly_rate_factor_bps: 2000 }
              as: FundingOfficer
              captures: { lease_id: "$.data.id", lease_v: "$.data.version" }
            - call: "POST /lessors/${lessor_id}/leases/${lease_id}/equipment"
              payload: { serial_number: "C-SN-1", description: "Press", original_cost_cents: 500000 }
              as: FundingOfficer
            - call: "POST /lessors/${lessor_id}/leases/${lease_id}/book"
              payload: { expected_lease_version: "${lease_v}" }
              as: FundingOfficer
            - call: "POST /lessors/${lessor_id}/leases/${lease_id}/fund"
              payload: {}
              as: FundingOfficer
          trigger:
            - call: "POST /lessors/${lessor_id}/leases/${lease_id}/begin-end-of-term"
              payload: {}
              as: Servicer
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_TERM_NOT_COMPLETE with HTTP 409"

      - name: equipment_dispose_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.EquipmentUnit.transitions.RETURNED_to_DISPOSED]
        distinguishing_aspect: "A DISPOSED unit is terminal; any further transition (e.g., list) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A unit taken RETURNED then DISPOSED on an end-of-term/returned lease"]
          setup_api_calls:
            - call: "POST /lessors"
              payload: { legal_name: "Delta2 Leasing", home_state_code: "TX", sales_tax_rate_bps: 625, property_tax_rate_bps: 100 }
              as: FundingOfficer
              captures: { lessor_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/vendors"
              payload: { name: "MachineCo", remit_account: "RA-1" }
              as: FundingOfficer
              captures: { vendor_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/vendors/${vendor_id}/approve"
              payload: {}
              as: FundingOfficer
            - call: "POST /lessors/${lessor_id}/credit-applications"
              payload: { applicant_legal_name: "Cust", requested_amount_cents: 1000000, credit_score: 760 }
              as: CreditAnalyst
              as_user_id: "analyst-1"
              captures: { app_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/credit-applications/${app_id}/submit"
              payload: {}
              as: CreditAnalyst
              as_user_id: "analyst-1"
            - call: "POST /lessors/${lessor_id}/credit-applications/${app_id}/approve"
              payload: { approved_amount_cents: 1000000 }
              as: CreditAnalyst
              as_user_id: "analyst-2"
            - call: "GET /lessors/${lessor_id}/lessees?credit_application_id=${app_id}"
              payload: {}
              as: FundingOfficer
              captures: { lessee_id: "$.data[0].id" }
            - call: "POST /lessors/${lessor_id}/lessees/${lessee_id}/leases"
              payload: { vendor_id: "${vendor_id}", lease_type: "FMV", equipment_cost_cents: 500000, term_months: 1, monthly_rate_factor_bps: 2000 }
              as: FundingOfficer
              captures: { lease_id: "$.data.id", lease_v: "$.data.version" }
            - call: "POST /lessors/${lessor_id}/leases/${lease_id}/equipment"
              payload: { serial_number: "D-SN-1", description: "Press", original_cost_cents: 500000 }
              as: FundingOfficer
              captures: { unit_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/leases/${lease_id}/book"
              payload: { expected_lease_version: "${lease_v}" }
              as: FundingOfficer
            - call: "POST /lessors/${lessor_id}/leases/${lease_id}/fund"
              payload: {}
              as: FundingOfficer
            - call: "GET /lessors/${lessor_id}/leases/${lease_id}/schedule-lines?status=SCHEDULED"
              payload: {}
              as: Servicer
              captures: { line_id: "$.data[0].id" }
            - call: "POST /lessors/${lessor_id}/leases/${lease_id}/invoices"
              payload: { schedule_line_id: "${line_id}" }
              as: Servicer
              captures: { inv_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/invoices/${inv_id}/payments"
              payload: { amount_cents: 106250 }
              as: Servicer
            - call: "POST /lessors/${lessor_id}/leases/${lease_id}/begin-end-of-term"
              payload: {}
              as: Servicer
            - call: "POST /lessors/${lessor_id}/leases/${lease_id}/eot-elections"
              payload: { election: "RETURN" }
              as: Servicer
              captures: { eot_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/leases/${lease_id}/eot-elections/${eot_id}/exercise"
              payload: {}
              as: Servicer
            - call: "POST /lessors/${lessor_id}/equipment/${unit_id}/return"
              payload: {}
              as: AssetManager
            - call: "POST /lessors/${lessor_id}/equipment/${unit_id}/dispose"
              payload: {}
              as: AssetManager
          trigger:
            - call: "POST /lessors/${lessor_id}/equipment/${unit_id}/list"
              payload: {}
              as: AssetManager
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_STATE with HTTP 409"
            - "EquipmentUnit.${unit_id}.status == DISPOSED"

      - name: renew_election_extends_schedule_and_term
        claim_type: Side Effect Execution
        grounds: [state_machines.EndOfTermElection.transitions.ELECTED_to_EXERCISED, entities.Lease.fields.term_months]
        distinguishing_aspect: "Exercising a RENEW election with renewal_months=6 appends 6 ScheduleLine rows and increases Lease.term_months from 1 to 7."
        test_recipe:
