  # ───────────────────────────────────────────────────────────────────────────
  # Rule 9 — compensating_invariant
  # Two invariants on DIFFERENT conserved quantities.
  #   (A) Conserved: AuthorizationGrant.units_consumed. Forward action: Visit
  #       SCHEDULED -> COMPLETED (consumes planned_units, then recomputes to
  #       actual billable_units). Compensating action: Visit cancellation
  #       SCHEDULED -> CANCELLED (removes the reservation). Invariant: after a
  #       SCHEDULE + immediate CANCEL pair, grant.units_consumed equals its
  #       pre-schedule value exactly.
  #   (B) Conserved: PlanOfCare.cumulative_billed_cents. Forward action: Visit
  #       FINALIZE (adds billed_cents). Compensating action: There is no Visit
  #       "un-finalize"; instead, a POC discharge cascade cancels future
  #       SCHEDULED visits but does NOT touch FINALIZED ones. Invariant: a POC
  #       discharge after several FINALIZE actions leaves cumulative_billed_cents
  #       unchanged (no FINALIZED visit is unbilled). The conserved quantity
  #       holds across the discharge cascade.
  # ───────────────────────────────────────────────────────────────────────────
  - rule_id: compensating_invariant
    instances:
      - name: grant_units_consumed_unchanged_after_schedule_then_cancel
        grounds:
          - calculations.units_consumed_running
          - state_machines.Visit.SCHEDULED_to_CANCELLED
          - entities.AuthorizationGrant.fields.units_consumed
        distinguishing_aspect: |
          Conserved quantity = AuthorizationGrant.units_consumed (an integer
          count of 15-minute units across SCHEDULED+COMPLETED+FINALIZED Visits).
          Forward action POST /visits creates a SCHEDULED Visit (planned_units
          reserved → units_consumed += planned_units). Compensating action POST
          /visits/{id}/cancel transitions SCHEDULED -> CANCELLED and recomputes
          units_consumed via units_consumed_running (excludes CANCELLED).
          Invariant: units_consumed_before == units_consumed_after.
        test_recipe:
          setup:
            - "ACTIVE COMMERCIAL POC + ACTIVE Grant (total_units_granted=20). Pre-existing SCHEDULED Visit with planned_minutes=30 → planned_units=2 → units_consumed=2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rehab/therapists"
              payload: { full_name: "T Comp A", npi_number: "1000000090", license_state: "CA", medicare_provider_enrolled: false }
              as: PlatformAdmin
              captures: { th_id: $.data.id }
            - call: "POST /rehab/patients"
              payload: { full_name: "Pat Comp A", date_of_birth: "1970-01-01", insurance_type: "COMMERCIAL", is_veteran: false }
              as: PlatformAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /rehab/plans-of-care"
              payload: { patient_id: "${pt_id}", primary_therapist_id: "${th_id}", diagnosis_icd10: "M54.5", certified_start_date: "2026-06-01", certified_end_date: "2026-07-31" }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { poc_id: $.data.id }
            - call: "POST /rehab/evaluations"
              payload: { plan_of_care_id: "${poc_id}", therapist_id: "${th_id}", evaluation_kind: "INITIAL", performed_on: "2026-06-01", functional_score: 40, minutes_spent: 30 }
              as: Therapist
              as_user_id: "${th_id}"
            - call: "POST /rehab/plans-of-care/${poc_id}/activate"
              payload: {}
              as: Therapist
              as_user_id: "${th_id}"
            - call: "POST /rehab/authorization-grants"
              payload: { plan_of_care_id: "${poc_id}", total_units_granted: 20, effective_from: "2026-06-01", effective_to: "2026-07-31" }
              as: CaseManager
              captures: { grant_id: $.data.id }
            - call: "POST /rehab/visits"
              payload: { authorization_grant_id: "${grant_id}", therapist_id: "${th_id}", scheduled_start_utc: "2026-06-05T10:00:00Z", scheduled_end_utc: "2026-06-05T10:30:00Z", planned_minutes: 30, cpt_code: "CPT_97110" }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { v_pre_id: $.data.id }
            - call: "GET /rehab/authorization-grants/${grant_id}"
              payload: {}
              as: BillingClerk
              captures: { uc_pre: $.data.units_consumed }
          trigger:
            - call: "POST /rehab/visits"
              payload: { authorization_grant_id: "${grant_id}", therapist_id: "${th_id}", scheduled_start_utc: "2026-06-06T10:00:00Z", scheduled_end_utc: "2026-06-06T10:30:00Z", planned_minutes: 30, cpt_code: "CPT_97110" }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { v_new_id: $.data.id }
            - call: "GET /rehab/authorization-grants/${grant_id}"
              payload: {}
              as: BillingClerk
              captures: { uc_mid: $.data.units_consumed }
            - call: "POST /rehab/visits/${v_new_id}/cancel"
              payload: {}
              as: PlatformAdmin
            - call: "GET /rehab/authorization-grants/${grant_id}"
              payload: {}
              as: BillingClerk
              captures: { uc_post: $.data.units_consumed }
          assert:
            - "AuthorizationGrant.${grant_id}.units_consumed before trigger == 2"
            - "AuthorizationGrant.${grant_id}.units_consumed mid trigger == 4"
            - "AuthorizationGrant.${grant_id}.units_consumed after trigger == 2"
            - "Conserved invariant holds: uc_pre == uc_post == 2"

