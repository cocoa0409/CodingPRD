# =============================================================================
# Task 1654: Long-Haul Trucking Carrier Operations (asset-based) — seed tables
# =============================================================================

scenario: |
  Long-Haul Trucking Carrier Operations (asset-based): load acceptance & lane
  profitability screen, driver assignment with hours-of-service & home-time rules,
  dispatch, check calls & ETA management, detention/accessorial capture & billing,
  empty miles & backhaul matching, fuel purchase optimization by state tax,
  driver pay (mile/percentage) settlement, safety/CSA score monitoring.

domain_name: long-haul-trucking
api_prefix: ""
list_ordering: "All list endpoints return items ordered by created_at ASC (server-stamped, three fractional digits); no business ordering uses id."

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation        # HOS hour pools (11h/14h/70h) competed for by trips; tractor single-assignment
  secondary_archetype: compliance_audit      # HOS event log, CSA-style safety scoring, SoD on payroll
  complexity_layers:
    - cascading_side_effects                 # check-call → trip → load → accessorial chains; suspension cascade
    - rate_threshold_triggers                # safety floor 60/70, detention free-minutes, guarantee minimum
    - derived_field_reconciliation           # margin, HOS clocks, safety score, tractor fuel/odometer
    - optimistic_concurrency                 # OCC on Driver/Trip/Settlement versions
  entity_topology: flat                      # peer entities with FK references, no URL nesting of aggregate roots
  state_machine_shape: branching             # branching + cycles (Settlement DRAFT loop, Accessorial dispute loop, Load INVOICED→DELIVERED revert) + parallel dims on Driver
  relationship_patterns:
    - one_to_many
    - cross_aggregate                        # Trip binds Driver+Tractor+Load; Invoice aggregates AccessorialCharge
  role_model: segregation_of_duties          # settlement approver must differ from creator
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Driver
    parent: null
    common_fields: true
    fields:
      - { name: cdl_number, type: string, source: input, description: "CDL number, unique across drivers" }
      - { name: full_name, type: string, source: input, description: "Driver full name" }
      - { name: home_terminal, type: string, source: input, description: "Home terminal code" }
      - { name: pay_model, type: enum, source: input, description: "MILEAGE | PERCENTAGE" }
      - { name: pay_rate_cents_per_mile, type: integer, source: input, description: "Cents per paid mile; required iff pay_model == MILEAGE", constraints: ">= 1 when present" }
      - { name: pay_percentage_bp, type: integer, source: input, description: "Basis points of pay base; required iff pay_model == PERCENTAGE", constraints: "1..10000 when present" }
      - { name: hired_at, type: datetime, source: input, description: "Hire timestamp" }
      - { name: last_home_at, type: datetime, source: input, description: "Last home-time start; updated by OFF_DUTY duty events with at_home=true" }
      - { name: employment_status, type: enum, source: system, description: "ACTIVE | SUSPENDED | TERMINATED", default: ACTIVE }
      - { name: duty_status, type: enum, source: computed, description: "OFF_DUTY | SLEEPER | DRIVING | ON_DUTY — mirrors latest DutyEvent.event_type; OFF_DUTY before any event" }
      - { name: safety_score, type: integer, source: computed, description: "CSA-style score 0..100, starts at 100; see driver_safety_score" , default: 100 }

  - name: Tractor
    parent: null
    common_fields: true
    fields:
      - { name: unit_number, type: string, source: input, description: "Fleet unit number, unique" }
      - { name: home_terminal, type: string, source: input, description: "Home terminal code" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | ASSIGNED | OUT_OF_SERVICE", default: AVAILABLE }
      - { name: odometer_miles, type: integer, source: input, description: "Odometer at registration; system-updated to DELIVERED check-call odometer at trip completion", constraints: ">= 0" }
      - { name: current_state_code, type: string, source: input, description: "State where tractor sits; system-updated at trip completion" }
      - { name: tank_capacity_gallons, type: integer, source: input, description: "Fuel tank capacity", constraints: ">= 1" }
      - { name: current_fuel_gallons, type: integer, source: input, description: "Fuel on board; += gallons on FuelPurchase; -= ceil(actual_miles/FLEET_MPG) floored at 0 on trip completion", constraints: ">= 0, <= tank_capacity_gallons" }

  - name: CustomerAccount
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer name" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CREDIT_HOLD", default: ACTIVE }

  - name: Lane
    parent: null
    common_fields: true
    fields:
      - { name: origin_state, type: string, source: input, description: "Origin state code" }
      - { name: destination_state, type: string, source: input, description: "Destination state code" }
      - { name: loaded_miles, type: integer, source: input, description: "Benchmark loaded miles for the lane", constraints: ">= 1" }
      - { name: rpm_floor_cents, type: integer, source: input, description: "Minimum acceptable all-in rate-per-mile (revenue / total miles incl. deadhead estimate)", constraints: ">= 0" }

  - name: StateFuelRate
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "2-letter state code, or US-NATIONAL for the national average row used by fuel_surcharge_calc" }
      - { name: tax_cents_per_gallon, type: integer, source: input, description: "State fuel tax cents per gallon", constraints: ">= 0" }
      - { name: avg_pump_price_cents, type: integer, source: input, description: "Average pump price cents per gallon", constraints: ">= 1" }
      - { name: effective_from, type: datetime, source: input, description: "Window start (inclusive, closed interval)" }
      - { name: effective_to, type: datetime, source: input, description: "Window end (inclusive, closed interval); omitted/null = open-ended" , constraints: "windows for the same state_code must not overlap under CLOSED semantics: new.effective_from <= existing.effective_to (or existing open) AND (new.effective_to null OR new.effective_to >= existing.effective_from) => ERR_FUEL_RATE_WINDOW_OVERLAP; touching endpoints conflict" }

  - name: Load
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> CustomerAccount.id; tendering customer" }
      - { name: lane_id, type: string, source: input, description: "FK -> Lane.id; lane benchmark for miles/RPM floor" }
      - { name: rate_cents, type: integer, source: input, description: "Linehaul rate", constraints: ">= 1" }
      - { name: weight_lbs, type: integer, source: input, description: "Shipment weight", constraints: ">= 1" }
      - { name: pickup_appt_at, type: datetime, source: input, description: "Pickup appointment (detention anchor)" }
      - { name: delivery_appt_at, type: datetime, source: input, description: "Delivery appointment; must be > pickup_appt_at" }
      - { name: status, type: enum, source: system, description: "TENDERED | SCREENED | ACCEPTED | ASSIGNED | DISPATCHED | IN_TRANSIT | DELIVERED | INVOICED | CLOSED | REJECTED | CANCELLED", default: TENDERED }
      - { name: fuel_surcharge_cents, type: integer, source: computed, description: "FSC computed at screen; recomputed (snapshot overwritten) at accept; see fuel_surcharge_calc" }
      - { name: projected_margin_cents, type: integer, source: computed, description: "Provisional margin variant computed at screen/accept; see lane_margin_screen" }
      - { name: projected_rpm_cents, type: integer, source: computed, description: "round_half_up((rate_cents + fuel_surcharge_cents) / (lane.loaded_miles + DEADHEAD_ESTIMATE_MILES))" }
      - { name: final_margin_cents, type: integer, source: computed, description: "Final margin variant computed at invoice issue; cleared (null) on invoice void" }
      - { name: total_accessorial_cents, type: integer, source: computed, description: "Sum of amount_cents over this load's AccessorialCharges with status == BILLED", default: 0 }
      - { name: cancellation_fee_cents, type: integer, source: computed, description: "Tiered cancellation fee; null until CANCELLED; see cancellation_fee_tiers" }
      - { name: reassignment_count, type: integer, source: system, description: "Increments each time a non-terminal trip of this load is cancelled", default: 0 }

  - name: Trip
    parent: null
    common_fields: true
    fields:
      - { name: load_id, type: string, source: input, description: "FK -> Load.id; load must be ACCEPTED" }
      - { name: driver_id, type: string, source: input, description: "FK -> Driver.id" }
      - { name: tractor_id, type: string, source: input, description: "FK -> Tractor.id" }
      - { name: planned_deadhead_miles, type: integer, source: input, description: "Planned empty miles to pickup", constraints: ">= 0" }
      - { name: planned_start_at, type: datetime, source: input, description: "Planned dispatch time; driver overlap window is the half-open interval [planned_start_at, load.delivery_appt_at)" }
      - { name: route_states, type: array, source: input, description: "Ordered [{state_code, miles}] traversed; may be empty; used by fuel_plan_selection and fuel-purchase route validation" }
      - { name: status, type: enum, source: system, description: "PLANNED | DISPATCHED | AT_PICKUP | IN_TRANSIT | AT_DELIVERY | COMPLETED | CANCELLED", default: PLANNED }
      - { name: start_odometer_miles, type: integer, source: system, description: "Tractor odometer snapshot taken at dispatch; null until DISPATCHED" }
      - { name: actual_miles, type: integer, source: computed, description: "DELIVERED check-call odometer - start_odometer_miles; null until COMPLETED" }
      - { name: pay_miles, type: integer, source: computed, description: "max(actual_miles, lane.loaded_miles + planned_deadhead_miles); null until COMPLETED" }
      - { name: provisional_pay_cents, type: integer, source: computed, description: "Provisional driver pay variant at creation; see driver_trip_pay" }
      - { name: final_pay_cents, type: integer, source: computed, description: "Final driver pay variant at completion; null until COMPLETED" }
      - { name: cancel_reason, type: enum, source: system, description: "SAFETY (system: driver suspend/terminate cascade) | REASSIGN (manual dispatcher cancel, default) | CUSTOMER (system: load cancel cascade); null unless CANCELLED" }
      - { name: completed_at, type: datetime, source: system, description: "Set to DELIVERED check-call occurred_at; null until COMPLETED" }

  - name: DutyEvent
    parent: null
    common_fields: false
    fields:
      - { name: driver_id, type: string, source: system, description: "FK -> Driver.id; from path" }
      - { name: trip_id, type: string, source: input, description: "FK -> Trip.id; optional link to the trip being worked" }
      - { name: event_type, type: enum, source: input, description: "OFF_DUTY | SLEEPER | DRIVING | ON_DUTY" }
      - { name: occurred_at, type: datetime, source: input, description: "Event time; must be <= logical now and strictly greater than the driver's previous event" }
      - { name: at_home, type: boolean, source: input, description: "Only meaningful with OFF_DUTY: sets driver.last_home_at = occurred_at", default: false }

  - name: CheckCall
    parent: null
    common_fields: false
    fields:
      - { name: trip_id, type: string, source: system, description: "FK -> Trip.id; from path" }
      - { name: kind, type: enum, source: input, description: "ARRIVED_PICKUP | DEPARTED_PICKUP | EN_ROUTE | ARRIVED_DELIVERY | DELIVERED" }
      - { name: occurred_at, type: datetime, source: input, description: "Reported time; <= logical now and >= previous check call on this trip" }
      - { name: state_code, type: string, source: input, description: "Reported state" }
      - { name: odometer_miles, type: integer, source: input, description: "Odometer; >= previous check call on this trip; first must be >= trip.start_odometer_miles" }

  - name: AccessorialCharge
    parent: null
    common_fields: true
    fields:
      - { name: load_id, type: string, source: system, description: "FK -> Load.id; from path" }
      - { name: trip_id, type: string, source: input, description: "FK -> Trip.id; optional; auto-created detention binds the completing trip" }
      - { name: type, type: enum, source: input, description: "DETENTION_PICKUP | DETENTION_DELIVERY | LAYOVER | LUMPER | STOP_OFF" }
      - { name: quantity, type: integer, source: input, description: "Minutes for DETENTION_*, days for LAYOVER, stop count for STOP_OFF, cents for LUMPER (receipt passthrough)", constraints: ">= 1" }
      - { name: amount_cents, type: integer, source: computed, description: "DETENTION_*: ceil(quantity/15)*1500; LAYOVER: quantity*30000; STOP_OFF: quantity*10000; LUMPER: quantity" }
      - { name: source, type: enum, source: system, description: "AUTO_DETENTION | MANUAL" }
      - { name: status, type: enum, source: system, description: "PENDING | SUBMITTED | APPROVED | DISPUTED | BILLED | REJECTED", default: PENDING }

  - name: FuelPurchase
    parent: null
    common_fields: true
    fields:
      - { name: trip_id, type: string, source: system, description: "FK -> Trip.id; from path" }
      - { name: driver_id, type: string, source: input, description: "FK -> Driver.id; must equal trip.driver_id; when X-User-Role == Driver must equal X-User-ID" }
      - { name: state_code, type: string, source: input, description: "Purchase state; must appear in trip.route_states" }
      - { name: gallons, type: integer, source: input, description: "Whole gallons purchased", constraints: ">= 1" }
      - { name: pump_price_cents, type: integer, source: input, description: "Pump price cents per gallon", constraints: ">= 1" }
      - { name: purchased_at, type: datetime, source: input, description: "Purchase time; <= logical now" }
      - { name: total_cost_cents, type: integer, source: computed, description: "gallons * pump_price_cents" }
      - { name: tax_paid_cents, type: integer, source: computed, description: "gallons * current StateFuelRate.tax_cents_per_gallon for state_code" }
      - { name: net_effective_price_cents, type: integer, source: computed, description: "pump_price_cents - tax_cents_per_gallon (IFTA-style tax equalization makes this the comparable price)" }

  - name: SafetyEvent
    parent: null
    common_fields: true
    fields:
      - { name: driver_id, type: string, source: system, description: "FK -> Driver.id; from path" }
      - { name: kind, type: enum, source: input, description: "INSPECTION_VIOLATION | CRASH_AT_FAULT for manual creation; HOS_VIOLATION is system-created only" }
      - { name: severity_points, type: integer, source: input, description: "Penalty points for manual events", constraints: "1..100" }
      - { name: occurred_at, type: datetime, source: input, description: "Event time used for decay windowing; <= logical now" }
      - { name: source, type: enum, source: system, description: "MANUAL | AUTO_HOS" }
      - { name: voided, type: boolean, source: system, description: "Set true by void; voided events excluded from driver_safety_score", default: false }

  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - { name: driver_id, type: string, source: input, description: "FK -> Driver.id" }
      - { name: period_start, type: datetime, source: input, description: "Period start (inclusive); half-open window" }
      - { name: period_end, type: datetime, source: input, description: "Period end (exclusive); must be > period_start" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_APPROVAL | APPROVED | PAID", default: DRAFT }
      - { name: trip_pay_cents, type: integer, source: computed, description: "Sum of final_pay_cents over trips with status COMPLETED and completed_at in [period_start, period_end)" }
      - { name: accessorial_share_cents, type: integer, source: computed, description: "Per-charge round_half_up(amount_cents * 2500/10000) summed over BILLED accessorials of those trips' loads; see settlement_gross_pay" }
      - { name: manual_adjustment_cents, type: integer, source: system, description: "Set by recalculate input; may be negative", default: 0 }
      - { name: guarantee_top_up_cents, type: integer, source: computed, description: "max(0, MIN_WEEKLY_CENTS - subtotal) when eligible; see settlement_gross_pay" }
      - { name: gross_pay_cents, type: integer, source: computed, description: "trip_pay_cents + accessorial_share_cents + manual_adjustment_cents + guarantee_top_up_cents" }
      - { name: created_by_id, type: string, source: system, description: "X-User-ID of the PayrollClerk who created the settlement" }
      - { name: approved_by_id, type: string, source: system, description: "X-User-ID of approver; must differ from created_by_id (SoD); null until APPROVED" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: load_id, type: string, source: system, description: "FK -> Load.id; from path; at most one non-VOID invoice per load" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | PAID | VOID", default: DRAFT }
      - { name: linehaul_cents, type: integer, source: computed, description: "Snapshot of load.rate_cents at creation" }
      - { name: fuel_surcharge_cents, type: integer, source: computed, description: "Snapshot of load.fuel_surcharge_cents at creation" }
      - { name: accessorial_total_cents, type: integer, source: computed, description: "Sum of amount_cents over accessorials flipped APPROVED -> BILLED at issue (0 until ISSUED)" }
      - { name: total_cents, type: integer, source: computed, description: "linehaul_cents + fuel_surcharge_cents + accessorial_total_cents" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Load
    initial_state: TENDERED
    terminal_states: [CLOSED, REJECTED, CANCELLED]
    transitions:
      - from: TENDERED
        to: SCREENED
        trigger: "POST /loads/{id}/screen"
        actor: LoadPlanner
        preconditions:
          - "Load in TENDERED (ERR_LOAD_NOT_TENDERED)"
          - "Current effective US-NATIONAL StateFuelRate exists (ERR_FUEL_RATE_UNAVAILABLE)"
        side_effects:
          - "Compute fuel_surcharge_cents (fuel_surcharge_calc)"
          - "Compute projected_margin_cents and projected_rpm_cents (lane_margin_screen, provisional variant)"

      - from: SCREENED
        to: ACCEPTED
        trigger: "POST /loads/{id}/accept"
        actor: LoadPlanner
        preconditions:
          - "Load in SCREENED (ERR_LOAD_NOT_SCREENED)"
          - "CustomerAccount.status == ACTIVE (ERR_CUSTOMER_CREDIT_HOLD)"
          - "Recomputed projected_margin_cents >= 0 AND projected_rpm_cents >= lane.rpm_floor_cents (ERR_MARGIN_BELOW_FLOOR)"
        side_effects:
          - "Recompute fuel_surcharge_cents and projected margin/rpm with the CURRENT US-NATIONAL rate (snapshot overwritten)"

      - from: TENDERED
        to: REJECTED
        trigger: "POST /loads/{id}/reject"
        actor: LoadPlanner
        preconditions:
          - "Load in TENDERED or SCREENED (ERR_LOAD_NOT_REJECTABLE)"
        side_effects: []

      - from: SCREENED
        to: REJECTED
        trigger: "POST /loads/{id}/reject"
        actor: LoadPlanner
        preconditions:
          - "Load in TENDERED or SCREENED (ERR_LOAD_NOT_REJECTABLE)"
        side_effects: []

      - from: ACCEPTED
        to: ASSIGNED
        trigger: "system (POST /trips creates a trip for this load)"
        actor: system
        preconditions: []
        side_effects:
          - "Load.version incremented (cascaded mutation)"

      - from: ASSIGNED
        to: DISPATCHED
        trigger: "system (POST /trips/{id}/dispatch)"
        actor: system
        preconditions: []
        side_effects: []

      - from: DISPATCHED
        to: IN_TRANSIT
        trigger: "system (DEPARTED_PICKUP check call on the trip)"
        actor: system
        preconditions: []
        side_effects: []

      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "system (DELIVERED check call on the trip)"
        actor: system
        preconditions: []
        side_effects:
          - "detention_billing evaluated for both legs; for each leg with billable_minutes > 0 an AUTO_DETENTION AccessorialCharge (PENDING) is created with quantity = billable_minutes and amount_cents = ceil(quantity/15)*1500"

      - from: DELIVERED
        to: INVOICED
        trigger: "system (POST /invoices/{id}/issue)"
        actor: system
        preconditions: []
        side_effects:
          - "Compute final_margin_cents (lane_margin_screen, final variant)"
          - "Recompute total_accessorial_cents (now includes newly BILLED charges)"

      - from: INVOICED
        to: DELIVERED
        trigger: "system (POST /invoices/{id}/void)"
        actor: system
        preconditions: []
        side_effects:
          - "final_margin_cents cleared to null"
          - "total_accessorial_cents recomputed (no BILLED charges remain)"

      - from: INVOICED
        to: CLOSED
        trigger: "system (POST /invoices/{id}/mark-paid)"
        actor: system
        preconditions: []
        side_effects: []

      - from: TENDERED
        to: CANCELLED
        trigger: "POST /loads/{id}/cancel"
        actor: LoadPlanner
        preconditions:
          - "Load in TENDERED, SCREENED, ACCEPTED, ASSIGNED, or DISPATCHED (ERR_LOAD_NOT_CANCELLABLE)"
        side_effects:
          - "cancellation_fee_cents = 0 (cancellation_fee_tiers)"

      - from: SCREENED
        to: CANCELLED
        trigger: "POST /loads/{id}/cancel"
        actor: LoadPlanner
        preconditions:
          - "Load in TENDERED, SCREENED, ACCEPTED, ASSIGNED, or DISPATCHED (ERR_LOAD_NOT_CANCELLABLE)"
        side_effects:
          - "cancellation_fee_cents = 0"

      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /loads/{id}/cancel"
        actor: LoadPlanner
        preconditions:
          - "Load in TENDERED, SCREENED, ACCEPTED, ASSIGNED, or DISPATCHED (ERR_LOAD_NOT_CANCELLABLE)"
        side_effects:
          - "cancellation_fee_cents = 15000"

      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /loads/{id}/cancel"
        actor: LoadPlanner
        preconditions:
          - "Load in TENDERED, SCREENED, ACCEPTED, ASSIGNED, or DISPATCHED (ERR_LOAD_NOT_CANCELLABLE)"
        side_effects:
          - "cancellation_fee_cents = max(25000, round_half_up(rate_cents * 0.10)) (TONU tier)"
          - "The non-terminal trip (PLANNED|DISPATCHED|AT_PICKUP) -> CANCELLED with cancel_reason CUSTOMER, which itself releases the tractor (ASSIGNED -> AVAILABLE)"

      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /loads/{id}/cancel"
        actor: LoadPlanner
        preconditions:
          - "Load in TENDERED, SCREENED, ACCEPTED, ASSIGNED, or DISPATCHED (ERR_LOAD_NOT_CANCELLABLE)"
        side_effects:
          - "cancellation_fee_cents = max(25000, round_half_up(rate_cents * 0.10)) (TONU tier)"
          - "The non-terminal trip -> CANCELLED with cancel_reason CUSTOMER; tractor released (ASSIGNED -> AVAILABLE)"

  - entity: Trip
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: DISPATCHED
        trigger: "POST /trips/{id}/dispatch"
        actor: Dispatcher
        preconditions:
          - "Trip in PLANNED (ERR_TRIP_NOT_PLANNED)"
          - "Load in ASSIGNED (ERR_LOAD_NOT_ASSIGNABLE)"
          - "Driver employment_status == ACTIVE (ERR_DRIVER_NOT_ACTIVE)"
        side_effects:
          - "start_odometer_miles = tractor.odometer_miles (snapshot)"
          - "Load ASSIGNED -> DISPATCHED"

      - from: DISPATCHED
        to: AT_PICKUP
        trigger: "system (ARRIVED_PICKUP check call)"
        actor: system
        preconditions: []
        side_effects: []

      - from: AT_PICKUP
        to: IN_TRANSIT
        trigger: "system (DEPARTED_PICKUP check call)"
        actor: system
        preconditions: []
        side_effects:
          - "Load DISPATCHED -> IN_TRANSIT"

      - from: IN_TRANSIT
        to: AT_DELIVERY
        trigger: "system (ARRIVED_DELIVERY check call)"
        actor: system
        preconditions: []
        side_effects: []

      - from: AT_DELIVERY
        to: COMPLETED
        trigger: "system (DELIVERED check call)"
        actor: system
        preconditions: []
        side_effects:
          - "completed_at = check call occurred_at; actual_miles = odometer - start_odometer_miles; pay_miles = max(actual_miles, lane.loaded_miles + planned_deadhead_miles)"
          - "Compute final_pay_cents (driver_trip_pay, final variant)"
          - "Tractor ASSIGNED -> AVAILABLE; tractor.odometer_miles = DELIVERED odometer; tractor.current_state_code = DELIVERED state_code; tractor.current_fuel_gallons = max(0, current_fuel_gallons - ceil(actual_miles / FLEET_MPG))"
          - "Load IN_TRANSIT -> DELIVERED, which triggers detention auto-creation (see Load machine)"

      - from: PLANNED
        to: CANCELLED
        trigger: "POST /trips/{id}/cancel, or system (driver suspended, load cancelled)"
        actor: "Dispatcher or system"
        preconditions:
          - "Trip in PLANNED, DISPATCHED, or AT_PICKUP (ERR_TRIP_NOT_CANCELLABLE)"
        side_effects:
          - "Load ASSIGNED|DISPATCHED -> ACCEPTED; load.reassignment_count += 1"
          - "Tractor ASSIGNED -> AVAILABLE"

      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /trips/{id}/cancel, or system (driver suspended, load cancelled)"
        actor: "Dispatcher or system"
        preconditions:
          - "Trip in PLANNED, DISPATCHED, or AT_PICKUP (ERR_TRIP_NOT_CANCELLABLE)"
        side_effects:
          - "Load DISPATCHED -> ACCEPTED; load.reassignment_count += 1"
          - "Tractor ASSIGNED -> AVAILABLE"

      - from: AT_PICKUP
        to: CANCELLED
        trigger: "POST /trips/{id}/cancel, or system (driver suspended, load cancelled)"
        actor: "Dispatcher or system"
        preconditions:
          - "Trip in PLANNED, DISPATCHED, or AT_PICKUP (ERR_TRIP_NOT_CANCELLABLE)"
        side_effects:
          - "Load DISPATCHED -> ACCEPTED; load.reassignment_count += 1"
          - "Tractor ASSIGNED -> AVAILABLE"

  - entity: Driver
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    note: "Parallel dimensions: employment_status (this machine) is independent of duty_status (derived projection of the DutyEvent stream; OFF_DUTY initially, mirrors latest event_type). Suspending a driver does not rewrite duty_status."
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /drivers/{id}/suspend"
        actor: SafetyOfficer
        preconditions:
          - "employment_status == ACTIVE (ERR_DRIVER_NOT_ACTIVE)"
        side_effects:
          - "Every non-terminal trip (PLANNED|DISPATCHED|AT_PICKUP) of this driver -> CANCELLED with cancel_reason SAFETY; each such cancellation cascades: Load -> ACCEPTED with reassignment_count += 1 and Tractor ASSIGNED -> AVAILABLE"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /drivers/{id}/reinstate"
        actor: SafetyOfficer
        preconditions:
          - "employment_status == SUSPENDED (ERR_DRIVER_NOT_SUSPENDED)"
        side_effects: []

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /drivers/{id}/terminate"
        actor: FleetAdmin
        preconditions:
          - "employment_status != TERMINATED (ERR_DRIVER_ALREADY_TERMINATED)"
        side_effects:
          - "Every non-terminal trip of this driver -> CANCELLED with cancel_reason SAFETY; per-trip cascade as in suspend"

      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /drivers/{id}/terminate"
        actor: FleetAdmin
        preconditions:
          - "employment_status != TERMINATED (ERR_DRIVER_ALREADY_TERMINATED)"
        side_effects:
          - "Every non-terminal trip of this driver -> CANCELLED with cancel_reason SAFETY; per-trip cascade as in suspend"

  - entity: Tractor
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: ASSIGNED
        trigger: "system (POST /trips referencing this tractor)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ASSIGNED
        to: AVAILABLE
        trigger: "system (trip COMPLETED or CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: AVAILABLE
        to: OUT_OF_SERVICE
        trigger: "POST /tractors/{id}/out-of-service"
        actor: FleetAdmin
        preconditions:
          - "status == AVAILABLE (ERR_TRACTOR_NOT_AVAILABLE)"
        side_effects: []

      - from: OUT_OF_SERVICE
        to: AVAILABLE
        trigger: "POST /tractors/{id}/return-to-service"
        actor: FleetAdmin
        preconditions:
          - "status == OUT_OF_SERVICE (ERR_TRACTOR_NOT_OUT_OF_SERVICE)"
        side_effects: []

  - entity: CustomerAccount
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: CREDIT_HOLD
        trigger: "POST /customers/{id}/credit-hold"
        actor: LoadPlanner
        preconditions:
          - "status == ACTIVE (ERR_CUSTOMER_INVALID_STATE)"
        side_effects: []

      - from: CREDIT_HOLD
        to: ACTIVE
        trigger: "POST /customers/{id}/release-credit-hold"
        actor: LoadPlanner
        preconditions:
          - "status == CREDIT_HOLD (ERR_CUSTOMER_INVALID_STATE)"
        side_effects: []

  - entity: AccessorialCharge
    initial_state: PENDING
    terminal_states: [REJECTED]
    transitions:
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /accessorials/{id}/submit"
        actor: "Dispatcher or Driver"
        preconditions:
          - "status in PENDING or DISPUTED (ERR_ACCESSORIAL_NOT_SUBMITTABLE)"
          - "When X-User-Role == Driver: some trip of the charge's load has driver_id == X-User-ID (ERR_DRIVER_MISMATCH)"
        side_effects: []

      - from: DISPUTED
        to: SUBMITTED
        trigger: "POST /accessorials/{id}/submit (resubmit cycle)"
        actor: "Dispatcher or Driver"
        preconditions:
          - "status in PENDING or DISPUTED (ERR_ACCESSORIAL_NOT_SUBMITTABLE)"
        side_effects: []

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /accessorials/{id}/approve"
        actor: LoadPlanner
        preconditions:
          - "status == SUBMITTED (ERR_ACCESSORIAL_NOT_APPROVABLE)"
        side_effects: []

      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /accessorials/{id}/dispute"
        actor: LoadPlanner
        preconditions:
          - "status == SUBMITTED (ERR_ACCESSORIAL_NOT_DISPUTABLE)"
        side_effects: []

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /accessorials/{id}/reject"
        actor: LoadPlanner
        preconditions:
          - "status in SUBMITTED or DISPUTED (ERR_ACCESSORIAL_NOT_REJECTABLE)"
        side_effects: []

      - from: DISPUTED
        to: REJECTED
        trigger: "POST /accessorials/{id}/reject"
        actor: LoadPlanner
        preconditions:
          - "status in SUBMITTED or DISPUTED (ERR_ACCESSORIAL_NOT_REJECTABLE)"
        side_effects: []

      - from: APPROVED
        to: BILLED
        trigger: "system (POST /invoices/{id}/issue on the charge's load)"
        actor: system
        preconditions: []
        side_effects:
          - "amount_cents included in invoice.accessorial_total_cents and load.total_accessorial_cents"

      - from: BILLED
        to: APPROVED
        trigger: "system (POST /invoices/{id}/void)"
        actor: system
        preconditions: []
        side_effects:
          - "amount_cents removed from load.total_accessorial_cents"

  - entity: Settlement
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /settlements/{id}/submit"
        actor: PayrollClerk
        preconditions:
          - "status == DRAFT (ERR_SETTLEMENT_NOT_DRAFT)"
        side_effects: []

      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /settlements/{id}/approve"
        actor: PayrollClerk
        preconditions:
          - "status == PENDING_APPROVAL (ERR_SETTLEMENT_NOT_PENDING_APPROVAL)"
          - "X-User-ID != created_by_id (ERR_SEGREGATION_OF_DUTY)"
        side_effects:
          - "approved_by_id = X-User-ID"

      - from: PENDING_APPROVAL
        to: DRAFT
        trigger: "POST /settlements/{id}/reject (rework cycle)"
        actor: PayrollClerk
        preconditions:
          - "status == PENDING_APPROVAL (ERR_SETTLEMENT_NOT_PENDING_APPROVAL)"
        side_effects: []

      - from: APPROVED
        to: PAID
        trigger: "POST /settlements/{id}/mark-paid"
        actor: PayrollClerk
        preconditions:
          - "status == APPROVED (ERR_SETTLEMENT_NOT_APPROVED)"
        side_effects: []

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /invoices/{id}/issue"
        actor: LoadPlanner
        preconditions:
          - "status == DRAFT (ERR_INVOICE_NOT_ISSUABLE)"
          - "Load in DELIVERED (ERR_INVOICE_NOT_ISSUABLE otherwise)"
          - "No accessorial of the load in PENDING, SUBMITTED, or DISPUTED (ERR_INVOICE_OPEN_ACCESSORIALS)"
        side_effects:
          - "All APPROVED accessorials of the load -> BILLED"
          - "accessorial_total_cents = sum of newly BILLED amounts; total_cents = linehaul + FSC + accessorial_total_cents"
          - "Load DELIVERED -> INVOICED (final_margin_cents computed)"

      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{id}/mark-paid"
        actor: LoadPlanner
        preconditions:
          - "status == ISSUED (ERR_INVOICE_NOT_PAYABLE)"
        side_effects:
          - "Load INVOICED -> CLOSED"

      - from: ISSUED
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: LoadPlanner
        preconditions:
          - "status == ISSUED (ERR_INVOICE_NOT_VOIDABLE)"
        side_effects:
          - "All BILLED accessorials of the load -> APPROVED"
          - "Load INVOICED -> DELIVERED (final_margin_cents cleared)"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: driver-patch-stale-version
    parent_entity: Driver
    write_endpoint: "PATCH /drivers/{id}"
    occ_field: "expected_driver_version"
    description: |
      Updating a Driver's pay/home-terminal config against a version the
      client no longer holds is rejected: another writer has mutated the
      Driver since the client's last read, so the client's edit is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: trip-replan-stale-version
    parent_entity: Trip
    write_endpoint: "PATCH /trips/{id}"
    occ_field: "expected_trip_version"
    description: |
      Replanning a PLANNED Trip (deadhead, start, route) against a stale
      Trip version is rejected: a prior write (including cascaded touches)
      has advanced Trip.version past the client's observed value.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: settlement-recalc-stale-version
    parent_entity: Settlement
    write_endpoint: "POST /settlements/{id}/recalculate"
    occ_field: "expected_settlement_version"
    description: |
      Recalculating a DRAFT Settlement (recomputing components and applying
      manual_adjustment_cents) against a stale Settlement version is rejected,
      so an adjustment is never applied on top of an unobserved recalculation.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: lane_margin_screen
    trigger: "POST /loads/{id}/screen and /accept (provisional variant); POST /invoices/{id}/issue (final variant)"
    algorithm: forward_looking
    formula: |
      Provisional (screen/accept):
        total_miles_est = lane.loaded_miles + DEADHEAD_ESTIMATE_MILES
        revenue_cents = load.rate_cents + fuel_surcharge_cents
        cost_cents = total_miles_est * VARIABLE_COST_CPM + driver_pay_estimate
        driver_pay_estimate: no driver is assigned yet, so use fleet-average pay
          FLEET_AVG_PAY_CPM * total_miles_est (62 * total_miles_est)
        projected_margin_cents = revenue_cents - cost_cents
        projected_rpm_cents = round_half_up(revenue_cents / total_miles_est)
      Final (invoice issue):
        revenue_cents = load.rate_cents + fuel_surcharge_cents + total_accessorial_cents(newly BILLED)
        actual_total_miles = trip.actual_miles of the COMPLETED trip
        cost_cents = actual_total_miles * VARIABLE_COST_CPM + trip.final_pay_cents
        final_margin_cents = revenue_cents - cost_cents
    input_set: "Provisional: the load + its lane + current US-NATIONAL fuel rate. Final: the COMPLETED trip and BILLED accessorials of this load only."
    constants:
      DEADHEAD_ESTIMATE_MILES: 100
      VARIABLE_COST_CPM: 145
      FLEET_AVG_PAY_CPM: 62
    precision: "integer cents; round_half_up only where shown"
    variants:
      - name: provisional
        when: "screen / accept"
        difference: "Estimated deadhead (100), fleet-average pay, excludes accessorials"
      - name: final
        when: "invoice issue"
        difference: "Actual miles and actual final driver pay, includes newly BILLED accessorials in revenue; produces a different number for identical tender data"

  - name: fuel_surcharge_calc
    trigger: "Load screen (and recomputed at accept with the then-current US-NATIONAL row)"
    algorithm: threshold
    formula: |
      diff = max(0, national.avg_pump_price_cents - FSC_BASELINE_CENTS)
      fsc_cents = round_half_up(lane.loaded_miles * diff / FLEET_MPG)
      (division exact rational; FLEET_MPG = 6.5, i.e. miles * diff * 2 / 13)
    input_set: "The single StateFuelRate row with state_code == US-NATIONAL whose effective window contains the logical now (missing -> ERR_FUEL_RATE_UNAVAILABLE)"
    constants:
      FSC_BASELINE_CENTS: 300
      FLEET_MPG: 6.5
    precision: "integer cents, round_half_up"

  - name: driver_trip_pay
    trigger: "POST /trips (provisional variant); DELIVERED check call completing the trip (final variant)"
    algorithm: forward_looking
    formula: |
      Provisional (at creation):
        MILEAGE:    provisional_pay_cents = (lane.loaded_miles + planned_deadhead_miles) * pay_rate_cents_per_mile
        PERCENTAGE: provisional_pay_cents = round_half_up(load.rate_cents * pay_percentage_bp / 10000)
      Final (at completion):
        MILEAGE:    pay_miles = max(actual_miles, lane.loaded_miles + planned_deadhead_miles)
                    final_pay_cents = pay_miles * pay_rate_cents_per_mile
        PERCENTAGE: final_pay_cents = round_half_up((load.rate_cents + load.fuel_surcharge_cents) * pay_percentage_bp / 10000)
    input_set: "The trip, its driver (pay_model + rate), its load and lane"
    precision: "integer cents, round_half_up for PERCENTAGE"
    variants:
      - name: provisional
        when: "trip creation"
        difference: "Planned miles (MILEAGE) and linehaul-only base (PERCENTAGE)"
      - name: final
        when: "trip completion"
        difference: "max(actual, planned) miles (MILEAGE); linehaul + FSC base (PERCENTAGE) — different result for identical trip data whenever actual > planned or FSC > 0"

  - name: hos_clock_projection
    trigger: "GET /drivers/{id}/hos-status; POST /trips feasibility; POST duty-event legality check"
    algorithm: projection
    formula: |
      Events = DutyEvents of the driver ordered by occurred_at ASC (insertion enforces monotonicity).
      Intervals: [e_i.occurred_at, e_{i+1}.occurred_at) typed by e_i.event_type; last interval ends at T (logical now).
      A "long-off run" is a maximal contiguous run of OFF_DUTY/SLEEPER intervals totalling >= LONG_OFF_MIN (600).
      drive_11h_remaining_minutes  = 660 - sum(DRIVING minutes after end of last long-off run); 660 if currently inside a long-off run.
      window_14h_remaining_minutes = 840 if currently inside a long-off run, else max(0, 840 - (T - end_of_last_long_off_run)).
      Restart run: contiguous OFF_DUTY/SLEEPER totalling >= RESTART_MIN (2040); resets the cycle accumulator at run end (exactly 34:00:00 qualifies, >=).
      cycle_start = max(T - 10080, end of last restart run <= T)
      cycle_70h_remaining_minutes = 4200 - sum(DRIVING+ON_DUTY minutes in [cycle_start, T])  (window start inclusive)
      break_blocked = (DRIVING minutes since end of last OFF/SLEEPER run of >= BREAK_MIN (30)) >= BREAK_DRIVE_MIN (480)
    input_set: "All DutyEvents of the driver (any trip link irrelevant)"
    constants:
      DRIVE_LIMIT_MIN: 660
      WINDOW_LIMIT_MIN: 840
      CYCLE_LIMIT_MIN: 4200
      CYCLE_WINDOW_MIN: 10080
      LONG_OFF_MIN: 600
      RESTART_MIN: 2040
      BREAK_MIN: 30
      BREAK_DRIVE_MIN: 480
    precision: "whole minutes"

  - name: hos_feasibility_check
    trigger: "POST /trips (and PATCH /trips replan)"
    algorithm: constraint_propagation
    formula: |
      required_drive_min = ceil((lane.loaded_miles + planned_deadhead_miles) * 60 / AVG_SPEED_MPH)
      Evaluate at T = logical now using hos_clock_projection:
      (1) drive_11h_remaining_minutes >= min(required_drive_min, 660)
      (2) cycle_70h_remaining_minutes >= required_drive_min
      (3) 660 * (1 + floor((load.delivery_appt_at - T) / 1440)) >= required_drive_min
      (4) required_drive_min + 600 * floor((required_drive_min - 1) / 660) <= (load.delivery_appt_at - T) in minutes
      Any clause false -> ERR_HOS_INSUFFICIENT.
      Home-time (separate error): floor((load.delivery_appt_at - driver.last_home_at) / 1440) <= MAX_DAYS_OUT (14)
      else ERR_HOME_TIME_EXCEEDED. Exactly 14 passes (<=).
    input_set: "Driver projection at T, lane miles, planned deadhead, delivery appointment, last_home_at"
    constants:
      AVG_SPEED_MPH: 50
      MAX_DAYS_OUT: 14
    precision: "whole minutes; ceil for required_drive_min"

  - name: detention_billing
    trigger: "DELIVERED check call (auto-materialization); manual claims reuse the amount formula"
    algorithm: threshold
    formula: |
      Pickup leg:  anchor_start = max(ARRIVED_PICKUP.occurred_at, load.pickup_appt_at)
                   billable_minutes = max(0, (DEPARTED_PICKUP.occurred_at - anchor_start) - FREE_MINUTES)
      Delivery leg: anchor_start = max(ARRIVED_DELIVERY.occurred_at, load.delivery_appt_at)
                   billable_minutes = max(0, (DELIVERED.occurred_at - anchor_start) - FREE_MINUTES)
      Exactly FREE_MINUTES elapsed -> 0 billable (no charge created). 1 minute over -> 1 increment.
      amount_cents = ceil(billable_minutes / DETENTION_INCREMENT_MIN) * DETENTION_INCREMENT_CENTS
      If a leg's arrival anchor is missing, that leg auto-creates nothing (manual claim path remains).
    input_set: "The completing trip's CheckCalls + the load's appointment times"
    constants:
      FREE_MINUTES: 120
      DETENTION_INCREMENT_MIN: 15
      DETENTION_INCREMENT_CENTS: 1500
    precision: "integer cents; ceil on increments"

  - name: fuel_purchase_costing
    trigger: "POST /trips/{id}/fuel-purchases"
    algorithm: aggregation
    formula: |
      rate = StateFuelRate row for state_code whose effective window contains logical now (missing -> ERR_FUEL_RATE_UNAVAILABLE)
      total_cost_cents = gallons * pump_price_cents
      tax_paid_cents = gallons * rate.tax_cents_per_gallon
      net_effective_price_cents = pump_price_cents - rate.tax_cents_per_gallon
      tractor.current_fuel_gallons += gallons (must not exceed tank_capacity_gallons -> ERR_TANK_CAPACITY_EXCEEDED)
    input_set: "The purchase + current StateFuelRate for its state_code"
    precision: "integer cents"

  - name: fuel_plan_selection
    trigger: "GET /trips/{id}/fuel-plan"
    algorithm: selector_ranking
    formula: |
      range_miles = floor(tractor.current_fuel_gallons * FLEET_MPG)
      cumulative_miles_to_enter(state k) = sum(route_states[i].miles for i < k)
      Eligible: route_states[k] where cumulative_miles_to_enter(k) <= range_miles
        AND a current StateFuelRate exists for that state_code.
      effective_price(state) = avg_pump_price_cents - tax_cents_per_gallon
      Ranking: effective_price ASC; tie -> tax_cents_per_gallon DESC; tie -> route order ASC.
      Empty route_states, or no eligible state -> ERR_FUEL_PLAN_INFEASIBLE.
    input_set: "trip.route_states, tractor.current_fuel_gallons, current StateFuelRate rows"
    constants:
      FLEET_MPG: 6.5
    precision: "integer cents/miles"

  - name: driver_safety_score
    trigger: "SafetyEvent create (manual or AUTO_HOS) and void; read on GET /drivers/{id} and POST /trips"
    algorithm: decay_function
    formula: |
      T = logical now. For each non-voided SafetyEvent of the driver:
        age_hours = T - occurred_at
        weight = 1.0 if age_hours <= 8760 (365 days, inclusive boundary)
                 else 0.5 if age_hours <= 17520 (730 days, inclusive)
                 else 0
      safety_score = max(0, 100 - sum(severity_points * weight))   (weights produce .5 -> round_half_up the sum before subtracting)
      Assignment gate: safety_score >= SAFETY_ASSIGNMENT_MIN (60) else ERR_DRIVER_SAFETY_BELOW_FLOOR. Exactly 60 passes (>=).
    input_set: "Non-voided SafetyEvents of the driver"
    constants:
      SAFETY_ASSIGNMENT_MIN: 60
      FULL_WEIGHT_HOURS: 8760
      HALF_WEIGHT_HOURS: 17520
    precision: "integer score; round_half_up on the penalty sum"

  - name: eta_projection
    trigger: "GET /trips/{id}/eta"
    algorithm: forward_looking
    formula: |
      remaining_miles = max(0, (lane.loaded_miles + trip.planned_deadhead_miles) - (last_check_call.odometer_miles - trip.start_odometer_miles))
        (if no check calls, remaining = loaded + deadhead and base = planned_start_at)
      drive_minutes = ceil(remaining_miles * 60 / AVG_SPEED_MPH)
      break_minutes = 30 * floor((drive_minutes - 1) / 480)      (0 when drive_minutes <= 480)
      rest_minutes  = 600 * floor((drive_minutes - 1) / 660)     (0 when drive_minutes <= 660)
      base = max(logical now, last check call occurred_at)
      eta_at = base + drive_minutes + break_minutes + rest_minutes
      late = eta_at > load.delivery_appt_at   (equal is NOT late)
    input_set: "Trip check calls, lane miles, delivery appointment, logical now"
    constants:
      AVG_SPEED_MPH: 50
    precision: "whole minutes"

  - name: backhaul_ranking
    trigger: "GET /dispatch/backhaul-candidates"
    algorithm: selector_ranking
    formula: |
      Eligible loads: status in {SCREENED, ACCEPTED} (ACCEPTED implies no non-terminal trip, since assignment moves to ASSIGNED).
      deadhead_est = 0 if lane.origin_state == tractor.current_state_code else INTERSTATE_DEADHEAD_MILES
      effective_rpm = round_half_up((rate_cents + fuel_surcharge_cents) / (lane.loaded_miles + deadhead_est))
        (loads still TENDERED are excluded; fuel_surcharge_cents is null until screened -> SCREENED/ACCEPTED always have it)
      Ranking: effective_rpm DESC; tie -> pickup_appt_at ASC; tie -> load.created_at ASC.
      If driver_id supplied, additionally exclude loads failing hos_feasibility_check for that driver.
      Empty candidate set -> 200 with empty array (no error).
    input_set: "Loads in SCREENED or ACCEPTED, the tractor, optionally a driver"
    constants:
      INTERSTATE_DEADHEAD_MILES: 250
    precision: "integer rpm, round_half_up"

  - name: cancellation_fee_tiers
    trigger: "POST /loads/{id}/cancel"
    algorithm: threshold
    formula: |
      TENDERED or SCREENED -> 0
      ACCEPTED -> 15000
      ASSIGNED or DISPATCHED (TONU) -> max(25000, round_half_up(rate_cents * 10 / 100))
      IN_TRANSIT or later -> ERR_LOAD_NOT_CANCELLABLE
    input_set: "The load being cancelled"
    precision: "integer cents, round_half_up on the percentage tier"

  - name: settlement_gross_pay
    trigger: "POST /settlements (initial compute) and POST /settlements/{id}/recalculate (recompute, DRAFT only)"
    algorithm: aggregation
    formula: |
      Trips in scope: status == COMPLETED and completed_at in [period_start, period_end) (half-open: a trip
        completing exactly at period_end belongs to the NEXT period).
      trip_pay_cents = sum(trip.final_pay_cents)  (per-trip values already rounded at completion)
      accessorial_share_cents = sum over BILLED AccessorialCharges of those trips' loads of
        round_half_up(amount_cents * DRIVER_ACCESSORIAL_SHARE_BP / 10000)   -- ROUNDED PER CHARGE, THEN SUMMED
        (pinned order: per-charge rounding first; summing then rounding is a different, non-conforming result)
      subtotal_cents = trip_pay_cents + accessorial_share_cents + manual_adjustment_cents
      Evaluation order pinned (circular-looking dependency resolved): subtotal_cents is computed FIRST and
        excludes the top-up; then guarantee_top_up_cents = max(0, MIN_WEEKLY_CENTS - subtotal_cents)
        when eligible (driver not TERMINATED and at least one COMPLETED trip in scope), else 0.
        subtotal exactly == MIN_WEEKLY_CENTS -> top-up 0 (>=, boundary).
      gross_pay_cents = subtotal_cents + guarantee_top_up_cents
    input_set: "Driver's COMPLETED trips in the half-open period; BILLED accessorials on those trips' loads; manual_adjustment_cents"
    constants:
      MIN_WEEKLY_CENTS: 120000
      DRIVER_ACCESSORIAL_SHARE_BP: 2500
    precision: "integer cents; per-charge round_half_up then sum"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role recognized"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.5 roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path resource IDs exist, validated left-to-right"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path IDs

  - priority: 4
    category: business_constraint
    check: "Body format: required fields present, enum membership valid, numeric ranges valid (>= minimums), datetime orderings (delivery > pickup, period_end > period_start), occurred_at not after logical now"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all write endpoints

  - priority: 5
    category: business_referential
    check: "Driver-identity match: when X-User-Role == Driver, X-User-ID must equal the acted-on driver (duty events), the trip's driver (check calls), the body's driver_id and trip.driver_id (fuel purchases), or a driver of the load's trips (accessorial create/submit)"
    error_id: ERR_DRIVER_MISMATCH
    http_status: 403
    applies_to: "Driver-scoped write endpoints"

  - priority: 6
    category: state
    check: "Target resource in a valid state for the requested transition (all ERR_*_NOT_* 409 state preconditions, including ERR_LOAD_NOT_ASSIGNABLE, ERR_TRACTOR_NOT_AVAILABLE, ERR_DRIVER_NOT_ACTIVE, ERR_TRIP_NOT_FUELABLE)"
    error_id: "varies (state errors)"
    http_status: 409
    applies_to: transition and create endpoints

  - priority: 7
    category: state
    check: "OCC: expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /drivers/{id}, PATCH /trips/{id}, POST /settlements/{id}/recalculate"

  - priority: 8
    category: business_safety
    check: "Safety/regulatory gates, in sub-order: (a) driver safety_score >= 60 (ERR_DRIVER_SAFETY_BELOW_FLOOR), (b) hos_feasibility_check clauses (ERR_HOS_INSUFFICIENT), (c) home-time <= 14 projected days (ERR_HOME_TIME_EXCEEDED)"
    error_id: "ERR_DRIVER_SAFETY_BELOW_FLOOR | ERR_HOS_INSUFFICIENT | ERR_HOME_TIME_EXCEEDED"
    http_status: 422
    applies_to: "POST /trips, PATCH /trips/{id}"

  - priority: 9
    category: business_temporal
    check: "Temporal ordering/overlap: driver trip windows [planned_start_at, delivery_appt_at) half-open overlap (ERR_TRIP_OVERLAP; adjacency allowed); check-call kind rank and monotonic occurred_at/odometer (ERR_CHECK_CALL_OUT_OF_ORDER); duty-event strict monotonic occurred_at (ERR_DUTY_EVENT_OUT_OF_ORDER); settlement period overlap per driver (ERR_SETTLEMENT_PERIOD_OVERLAP; half-open, adjacency allowed); StateFuelRate closed-window overlap per state (ERR_FUEL_RATE_WINDOW_OVERLAP; touching endpoints conflict)"
    error_id: "ERR_TRIP_OVERLAP | ERR_CHECK_CALL_OUT_OF_ORDER | ERR_DUTY_EVENT_OUT_OF_ORDER | ERR_SETTLEMENT_PERIOD_OVERLAP | ERR_FUEL_RATE_WINDOW_OVERLAP"
    http_status: 422
    applies_to: "POST /trips, PATCH /trips/{id}, POST check-calls, POST duty-events, POST /settlements, POST /state-fuel-rates"

  - priority: 10
    category: business_constraint
    check: "Constraint rules: pay config completeness for pay_model (ERR_PAY_CONFIG_INCOMPLETE); at most one non-REJECTED DETENTION_PICKUP (resp. DETENTION_DELIVERY) per load (ERR_DUPLICATE_ACCESSORIAL_TYPE); at most one non-VOID invoice per load (ERR_INVOICE_ALREADY_EXISTS); fuel purchase state on route (ERR_STATE_NOT_ON_ROUTE); tank capacity (ERR_TANK_CAPACITY_EXCEEDED); current fuel-rate row exists (ERR_FUEL_RATE_UNAVAILABLE); fuel plan feasible (ERR_FUEL_PLAN_INFEASIBLE)"
    error_id: "ERR_PAY_CONFIG_INCOMPLETE | ERR_DUPLICATE_ACCESSORIAL_TYPE | ERR_INVOICE_ALREADY_EXISTS | ERR_STATE_NOT_ON_ROUTE | ERR_TANK_CAPACITY_EXCEEDED | ERR_FUEL_RATE_UNAVAILABLE | ERR_FUEL_PLAN_INFEASIBLE"
    http_status: 422
    applies_to: "POST /drivers, POST /loads/{id}/accessorials, POST /loads/{id}/invoice, POST fuel-purchases, GET fuel-plan, POST /loads/{id}/screen"

  - priority: 11
    category: business_referential
    check: "Cross-entity aggregate gate: invoice issue requires no accessorial of the load in PENDING, SUBMITTED, or DISPUTED"
    error_id: ERR_INVOICE_OPEN_ACCESSORIALS
    http_status: 422
    applies_to: "POST /invoices/{id}/issue"

  - priority: 12
    category: business_fiscal
    check: "Fiscal gates, in sub-order: (a) CustomerAccount.status == ACTIVE (ERR_CUSTOMER_CREDIT_HOLD); (b) recomputed projected_margin_cents >= 0 and projected_rpm_cents >= lane.rpm_floor_cents (ERR_MARGIN_BELOW_FLOOR)"
    error_id: "ERR_CUSTOMER_CREDIT_HOLD | ERR_MARGIN_BELOW_FLOOR"
    http_status: 402
    applies_to: "POST /loads/{id}/accept"

