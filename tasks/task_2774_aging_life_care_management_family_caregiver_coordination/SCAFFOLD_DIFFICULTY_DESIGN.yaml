              captures: { cm_iris: $.data.id }
            - call: "POST /care/clients"
              payload: { full_name: "Cornelia Pike", residence_setting: "PRIVATE_HOME", retainer_floor_cents: 0, authorized_concurrent_caregivers: 2 }
              as: PracticeAdmin
              captures: { cli: $.data.id }
            - call: "POST /care/family-contacts"
              payload: { client_id: "${cli}", full_name: "Alice Pike", contact_role: "POA_HEALTHCARE", is_surrogate_decision_maker: true }
              as: PracticeAdmin
              captures: { fc_alice: $.data.id }
            - call: "POST /care/vendors"
              payload: { name: "Lakeside Legal", vendor_type: "LEGAL", has_referral_relationship: true, referral_fee_pct: 5 }
              as: PracticeAdmin
              captures: { vnd: $.data.id }
            - call: "POST /care/assessments"
              payload: { client_id: "${cli}", care_manager_id: "${cm_dana}", domain_scores: { adl: 1, cognition: 1, medical_complexity: 1, social_support: 1, safety: 1, finances: 1 } }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { asm: $.data.id }
            - call: "PATCH /care/assessments/${asm}/state"
              payload: { to_state: "SUBMITTED" }
              as: CareManager
              as_user_id: "${cm_dana}"
            - call: "PATCH /care/assessments/${asm}/state"
              payload: { to_state: "ACCEPTED" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
            - call: "GET /care/clients/${cli}"
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { cli_v1: $.data.version }
            - call: "POST /care/care-plans"
