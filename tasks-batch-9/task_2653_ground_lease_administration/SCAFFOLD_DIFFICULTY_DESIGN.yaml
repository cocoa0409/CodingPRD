          - calculations.cure_window_deadlines
          - endpoints.POST_/portfolio/default-notices/{id}/mortgagee-cure
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          The notice machine branches rather than advancing: from LESSEE_CURE_LAPSED there are three
          different exits (mortgagee ELECT, administration-run lapse, terminate), one endpoint
          (mortgagee-cure) drives two different transitions according to its action field, and terminate
          is refused from LESSEE_CURE_LAPSED precisely because an encumbering mortgage is still alive -
          the same call succeeds from MORTGAGEE_CURE_LAPSED. The two deadlines are 30 days apart because
          the widest cure_extension_days on the lease, not the first mortgage, sets the mortgagee window.
