            - call: "POST /fccn/subsidy-contracts"
              payload: { provider_id: "${p1}", agency_code: "CCDF-01", daily_rate_cents: 4500, contracted_slots: 1, authorized_amount_cents: 5000000, period_start_on: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
              captures: { c1: $.data.id }
            - call: "POST /fccn/enrollments"
              payload: { provider_id: "${p1}", child_ref: "CH-1", family_name: "Alvarez", days_per_week: 5, private_monthly_tuition_cents: 0, subsidy_certified: true, start_on: "2026-08-01T00:00:00Z" }
              as: Provider
              as_user_id: "${p1}"
              captures: { e1: $.data.id }
          trigger:
            - call: "POST /fccn/enrollments"
              payload: { provider_id: "${p1}", child_ref: "CH-2", family_name: "Brody", days_per_week: 5, private_monthly_tuition_cents: 90000, subsidy_certified: false, start_on: "2026-08-01T00:00:00Z" }
              as: Provider
              as_user_id: "${p1}"
              captures: { e2: $.data.id, sc2: $.data.slot_committed }
            - call: "POST /fccn/enrollments"
              payload: { provider_id: "${p1}", child_ref: "CH-3", family_name: "Cortez", days_per_week: 5, private_monthly_tuition_cents: 0, subsidy_certified: true, start_on: "2026-08-01T00:00:00Z" }
              as: Provider
              as_user_id: "${p1}"
              captures: { err: $.data.error_id }
          assert:
            - "the private CH-2 request returns 201 with ${sc2} == false"
            - "${err} == ERR_SUBSIDY_SLOTS_EXHAUSTED with HTTP 409 for the subsidy-certified CH-3"
            - "SubsidyContract.${c1}.committed_slots == 1 and available_slots == 0"
            - "GET /fccn/enrollments with provider_id ${p1} returns total_count == 2"

      - name: unknown_enrollment_in_claim_line_is_caught_before_the_coherence_check
        claim_type: Cascading validation
        grounds:
          - validations[priority=6]
          - validations[priority=14]
          - errors[ERR_ENROLLMENT_NOT_FOUND]
          - errors[ERR_CLAIM_LINE_ENROLLMENT_MISMATCH]
        distinguishing_aspect: "The priority-14 coherence check needs the line's Enrollment row to exist before it can compare providers, so an unknown enrollment_id must return ERR_ENROLLMENT_NOT_FOUND (404) from priority 6 and never ERR_CLAIM_LINE_ENROLLMENT_MISMATCH (422)."
        test_recipe:
          setup:
            - "Provider P1 ACTIVE with an ACTIVE SubsidyContract and one subsidy-certified enrollment CH-1."
          setup_api_calls:
            - call: "POST /fccn/providers/apply"
              payload: { legal_name: "Alvarez Family Child Care", county_tier: "STANDARD", license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z", capacity_slots: 6 }
              as: Anonymous
              captures: { p1: $.data.id }
            - call: "POST /fccn/providers/${p1}/license-verification"
              payload: { license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z" }
              as: NetworkAdmin
              captures: { pv1: $.data.version }
            - call: "POST /fccn/membership-agreements"
              payload: { provider_id: "${p1}", network_fee_pct: 6.0, shared_services: ["ENROLLMENT", "BILLING"], effective_on: "2026-08-01T00:00:00Z", expected_provider_version: "${pv1}" }
              as: NetworkAdmin
              captures: { ag1: $.data.id }
            - call: "POST /fccn/membership-agreements/${ag1}/execute"
              as: Provider
              as_user_id: "${p1}"
            - call: "POST /fccn/subsidy-contracts"
              payload: { provider_id: "${p1}", agency_code: "CCDF-01", daily_rate_cents: 4500, contracted_slots: 4, authorized_amount_cents: 5000000, period_start_on: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
              captures: { c1: $.data.id }
            - call: "POST /fccn/enrollments"
              payload: { provider_id: "${p1}", child_ref: "CH-1", family_name: "Alvarez", days_per_week: 5, private_monthly_tuition_cents: 0, subsidy_certified: true, start_on: "2026-08-01T00:00:00Z" }
              as: Provider
              as_user_id: "${p1}"
              captures: { e1: $.data.id }
            - call: "GET /fccn/subsidy-contracts/${c1}"
              as: NetworkAdmin
              captures: { cv: $.data.version }
          trigger:
            - call: "POST /fccn/subsidy-claims"
              payload: { contract_id: "${c1}", period_month: "2026-08", lines: [{ enrollment_id: "${e1}", attended_days: 20, absent_days: 0 }, { enrollment_id: "00000000-0000-4000-8000-000000000000", attended_days: 20, absent_days: 0 }], expected_contract_version: "${cv}" }
              as: Provider
              as_user_id: "${p1}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ENROLLMENT_NOT_FOUND with HTTP 404"
            - "${err} != ERR_CLAIM_LINE_ENROLLMENT_MISMATCH and the response is not HTTP 422"
            - "GET /fccn/subsidy-contracts/${c1}/claims returns total_count == 0"

      - name: priority_ordering_state_before_fiscal
        claim_type: Priority Ordering
        grounds:
          - validations[priority=9]
          - validations[priority=16]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / claim_submit_held_state_error_beats_authorization_exceeded_fiscal_error
          rationale: "The named §1.8 instance violates both rules on one request and asserts the priority-9 error."

      - name: priority_conflict_safety_before_temporal
        claim_type: Priority conflict
        grounds:
          - validations[priority=12]
          - validations[priority=13]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / assignment_clearance_safety_error_beats_interval_overlap_temporal_error
          rationale: "The named §1.8 instance violates priority 12 and 13 simultaneously and asserts the priority-12 error."

      - name: cross_entity_validation_on_referenced_contract_state
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=10]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / remittance_post_blocked_while_referenced_contract_suspended_for_quality
          rationale: "The named §1.8 instance tests both the invalid and the valid state of the referenced entity."

      - name: temporal_validation_of_buffered_assignment_windows
        claim_type: Temporal validation
        grounds:
          - validations[priority=13]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / substitute_half_open_window_with_thirty_minute_buffer_exact_gap_allowed
          rationale: "The named §1.8 instance asserts the buffered-overlap detection at and around its boundary."

  - section: Endpoints
    instances:
      - name: substitute_create_then_read_round_trip_preserves_every_stored_field
        claim_type: Standard CRUD
        grounds:
          - endpoints[POST /fccn/substitutes]
          - endpoints[GET /fccn/substitutes/{id}]
          - entities.Substitute
        distinguishing_aspect: "The row read back by GET /fccn/substitutes/{id} carries the same five input fields plus the system defaults pool_status AVAILABLE and assignment_count_completed 0, at version 1 with no mutation from the read."
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z. No other state required."
          setup_api_calls:
            - call: "POST /fccn/substitutes"
              payload: { full_name: "Ada Nkemelu", credential_level: "CDA", clearance_expires_on: "2026-12-31T00:00:00Z", hourly_rate_cents: 2500, service_county_tiers: ["HIGH_NEED", "STANDARD"] }
              as: NetworkAdmin
              captures: { s1: $.data.id, sv1: $.data.version }
          trigger:
            - call: "GET /fccn/substitutes/${s1}"
              as: NetworkAdmin
              captures: { name: $.data.full_name, lvl: $.data.credential_level, rate: $.data.hourly_rate_cents, ps: $.data.pool_status, cnt: $.data.assignment_count_completed, v: $.data.version }
          assert:
            - "the create response status is 201 and ${sv1} == 1"
            - "${name} == Ada Nkemelu, ${lvl} == CDA, ${rate} == 2500"
            - "Substitute.${s1}.service_county_tiers == [HIGH_NEED, STANDARD] and clearance_expires_on == 2026-12-31T00:00:00Z"
            - "${ps} == AVAILABLE and ${cnt} == 0 (system defaults)"
            - "${v} == 1 — a GET does not bump version"

      - name: provider_list_envelope_carries_data_and_pagination_keys_on_success
        claim_type: Standard CRUD
        grounds:
          - response_envelope.success
          - response_envelope.pagination_fields
          - endpoints[GET /fccn/providers]
        distinguishing_aspect: "The list envelope exposes exactly limit, offset, total_count and has_more alongside data, and an explicit limit=1 with two matching rows sets has_more true while total_count still reports 2 (not the page size)."
        test_recipe:
          setup:
            - "Two APPLICANT providers in county_tier STANDARD."
          setup_api_calls:
            - call: "POST /fccn/providers/apply"
              payload: { legal_name: "Alvarez Family Child Care", county_tier: "STANDARD", license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z", capacity_slots: 6 }
              as: Anonymous
              captures: { p1: $.data.id }
            - call: "POST /fccn/providers/apply"
              payload: { legal_name: "Brody Family Child Care", county_tier: "STANDARD", license_number: "FCC-1002", license_expires_on: "2027-06-30T00:00:00Z", capacity_slots: 6 }
              as: Anonymous
              captures: { p2: $.data.id }
          trigger:
            - call: "GET /fccn/providers"
              payload: { county_tier: "STANDARD", limit: 1, offset: 0 }
              as: NetworkAdmin
              captures: { first_row: "$.data[0].id" }
          assert:
            - "the envelope contains data, limit, offset, total_count and has_more"
            - "limit == 1, offset == 0, total_count == 2, has_more == true"
            - "data has exactly one element and ${first_row} == ${p1}"
            - "no error_id or message key is present on a success envelope"

      - name: group_purchase_order_commit_prices_every_line_in_one_call_and_a_bad_line_rejects_the_whole_order
        claim_type: Bulk action
        grounds:
          - endpoints[POST /fccn/group-purchase-orders]
          - endpoints[POST /fccn/group-purchase-orders/{id}/commit]
          - calculations.group_purchase_order_total
          - validations[priority=7]
        distinguishing_aspect: "One commit call prices all three lines at once (total_quantity 16, discount_pct 0.05, subtotal_cents 19944), and a second order whose third line omits quantity is rejected in full with ERR_INVALID_REQUEST — no partially-created order row and no partially-priced lines."
        test_recipe:
          setup:
            - "Provider P1 ACTIVE with the GROUP_PURCHASING shared service."
            - "One OPEN SUPPLIES order with lines 1000x5, 999x6 and 2000x5."
          setup_api_calls:
            - call: "POST /fccn/providers/apply"
              payload: { legal_name: "Alvarez Family Child Care", county_tier: "STANDARD", license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z", capacity_slots: 6 }
              as: Anonymous
              captures: { p1: $.data.id }
            - call: "POST /fccn/providers/${p1}/license-verification"
              payload: { license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z" }
              as: NetworkAdmin
              captures: { pv1: $.data.version }
            - call: "POST /fccn/membership-agreements"
              payload: { provider_id: "${p1}", network_fee_pct: 6.0, shared_services: ["GROUP_PURCHASING"], effective_on: "2026-08-01T00:00:00Z", expected_provider_version: "${pv1}" }
              as: NetworkAdmin
              captures: { ag1: $.data.id }
            - call: "POST /fccn/membership-agreements/${ag1}/execute"
              as: Provider
              as_user_id: "${p1}"
            - call: "POST /fccn/group-purchase-orders"
              payload: { provider_id: "${p1}", category: "SUPPLIES", lines: [{ sku: "WIPES-12", unit_price_cents: 1000, quantity: 5 }, { sku: "PAINT-SET", unit_price_cents: 999, quantity: 6 }, { sku: "COT-SHEET", unit_price_cents: 2000, quantity: 5 }] }
              as: Provider
              as_user_id: "${p1}"
              captures: { o1: $.data.id, st0: $.data.status, sub0: $.data.subtotal_cents }
          trigger:
            - call: "POST /fccn/group-purchase-orders/${o1}/commit"
              as: Provider
              as_user_id: "${p1}"
              captures: { st1: $.data.status, tq: $.data.total_quantity, dp: $.data.discount_pct, sub1: $.data.subtotal_cents, fee: $.data.insurance_admin_fee_cents, tot: $.data.total_cents }
            - call: "POST /fccn/group-purchase-orders"
              payload: { provider_id: "${p1}", category: "SUPPLIES", lines: [{ sku: "WIPES-12", unit_price_cents: 1000, quantity: 5 }, { sku: "PAINT-SET", unit_price_cents: 999, quantity: 6 }, { sku: "COT-SHEET", unit_price_cents: 2000 }] }
              as: Provider
              as_user_id: "${p1}"
              captures: { err: $.data.error_id }
          assert:
            - "${st0} == OPEN and ${sub0} == 0 before the commit"
            - "${st1} == COMMITTED, ${tq} == 16, ${dp} == 0.05"
            - "${sub1} == 19944 and ${fee} == 0 and ${tot} == 19944 — all three lines priced by the single call"
            - "${err} == ERR_INVALID_REQUEST with HTTP 400 for the order whose third line omits quantity"
            - "GET /fccn/providers/${p1}/group-purchase-orders returns total_count == 1 — the rejected order left no row"

      - name: assignment_requested_substitute_link_needs_both_rows_and_returns_substitute_not_found_when_absent
        claim_type: Cross-reference link
        grounds:
          - endpoints[POST /fccn/substitute-assignments]
          - validations[priority=6]
          - errors[ERR_SUBSTITUTE_NOT_FOUND]
          - entities.SubstituteAssignment.fields.substitute_id
        distinguishing_aspect: "A requested_substitute_id naming an existing Substitute links that exact row (substitute_id equals the requested id even though a cheaper substitute exists), while an unknown id returns ERR_SUBSTITUTE_NOT_FOUND at HTTP 404 and creates no assignment."
        test_recipe:
          setup:
            - "Provider P1 ACTIVE in county_tier STANDARD."
            - "Substitute S_CHEAP at 2000 and substitute S_PICK at 2600, both serving STANDARD."
          setup_api_calls:
            - call: "POST /fccn/providers/apply"
              payload: { legal_name: "Alvarez Family Child Care", county_tier: "STANDARD", license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z", capacity_slots: 6 }
              as: Anonymous
              captures: { p1: $.data.id }
            - call: "POST /fccn/providers/${p1}/license-verification"
              payload: { license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z" }
              as: NetworkAdmin
              captures: { pv1: $.data.version }
            - call: "POST /fccn/membership-agreements"
              payload: { provider_id: "${p1}", network_fee_pct: 6.0, shared_services: ["SUBSTITUTE_POOL"], effective_on: "2026-08-01T00:00:00Z", expected_provider_version: "${pv1}" }
              as: NetworkAdmin
              captures: { ag1: $.data.id }
            - call: "POST /fccn/membership-agreements/${ag1}/execute"
              as: Provider
              as_user_id: "${p1}"
            - call: "POST /fccn/substitutes"
              payload: { full_name: "Cheap Cheryl", credential_level: "NONE", clearance_expires_on: "2026-12-31T00:00:00Z", hourly_rate_cents: 2000, service_county_tiers: ["STANDARD"] }
              as: NetworkAdmin
              captures: { s_cheap: $.data.id }
            - call: "POST /fccn/substitutes"
              payload: { full_name: "Pick Petra", credential_level: "NONE", clearance_expires_on: "2026-12-31T00:00:00Z", hourly_rate_cents: 2600, service_county_tiers: ["STANDARD"] }
              as: NetworkAdmin
              captures: { s_pick: $.data.id }
          trigger:
            - call: "POST /fccn/substitute-assignments"
              payload: { provider_id: "${p1}", start_at: "2026-08-05T08:00:00Z", end_at: "2026-08-05T12:00:00Z", reason: "VACATION", min_credential_level: "NONE", requested_substitute_id: "${s_pick}" }
              as: Provider
              as_user_id: "${p1}"
              captures: { sa1: $.data.id, linked: $.data.substitute_id, sst: $.data.staffing_status }
            - call: "POST /fccn/substitute-assignments"
              payload: { provider_id: "${p1}", start_at: "2026-08-06T08:00:00Z", end_at: "2026-08-06T12:00:00Z", reason: "VACATION", min_credential_level: "NONE", requested_substitute_id: "00000000-0000-4000-8000-000000000000" }
              as: Provider
              as_user_id: "${p1}"
              captures: { err: $.data.error_id }
          assert:
            - "${linked} == ${s_pick} and ${linked} != ${s_cheap} — the explicit link beats the cheapest-first selector"
            - "${sst} == OFFERED"
            - "GET /fccn/substitutes/${s_pick}/assignments returns total_count == 1 and GET /fccn/substitutes/${s_cheap}/assignments returns total_count == 0"
            - "${err} == ERR_SUBSTITUTE_NOT_FOUND with HTTP 404"
            - "GET /fccn/providers/${p1}/substitute-assignments returns total_count == 1 — the unknown-link request created nothing"

      - name: action_endpoint_transition_with_preconditions_enforced
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /fccn/membership-agreements/{id}/counter]
          - endpoints[POST /fccn/membership-agreements/{id}/revise]
        excluded_because:
          difficulty_instance: non_linear_state_machine / membership_agreement_negotiation_cycle_bounded_at_three_rounds
          rationale: "The named §1.8 instance drives the counter/revise action endpoints repeatedly and asserts the precondition that stops round four."

      - name: computed_read_matches_the_declared_projection
        claim_type: Computed read
        grounds:
          - endpoints[GET /fccn/providers/{id}/revenue-model]
        excluded_because:
          difficulty_instance: boundary_precision_check / revenue_margin_sustainable_at_exact_fifteen_percent_boundary
          rationale: "The named §1.8 instance asserts every component of the revenue-model read against pre-computed literals."

      - name: conditional_action_allowed_only_when_the_target_qualifies
        claim_type: Conditional action
        grounds:
          - endpoints[POST /fccn/enrollments/{id}/transfer]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / enrollment_transfer_requires_receiving_provider_active_open_with_free_subsidy_slot
          rationale: "The named §1.8 instance tests the transfer action against both a qualifying and a non-qualifying receiving provider."

  - section: Errors
    instances:
      - name: reinstate_an_active_provider_returns_invalid_provider_state
        claim_type: Triggerable
        grounds:
          - errors[ERR_INVALID_PROVIDER_STATE]
          - state_machines.Provider.transitions.PROBATION_to_ACTIVE
          - endpoints[POST /fccn/providers/{id}/reinstate]
        distinguishing_aspect: "reinstate is declared only from PROBATION, so calling it on an ACTIVE provider returns ERR_INVALID_PROVIDER_STATE at HTTP 409 and leaves membership_status ACTIVE with version unchanged."
        test_recipe:
          setup:
            - "Provider P1 walked to ACTIVE and never escalated, so it has never been in PROBATION."
          setup_api_calls:
            - call: "POST /fccn/providers/apply"
              payload: { legal_name: "Alvarez Family Child Care", county_tier: "STANDARD", license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z", capacity_slots: 6 }
              as: Anonymous
              captures: { p1: $.data.id }
            - call: "POST /fccn/providers/${p1}/license-verification"
              payload: { license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z" }
              as: NetworkAdmin
              captures: { pv1: $.data.version }
            - call: "POST /fccn/membership-agreements"
              payload: { provider_id: "${p1}", network_fee_pct: 6.0, shared_services: ["ENROLLMENT"], effective_on: "2026-08-01T00:00:00Z", expected_provider_version: "${pv1}" }
              as: NetworkAdmin
              captures: { ag1: $.data.id }
            - call: "POST /fccn/membership-agreements/${ag1}/execute"
              as: Provider
              as_user_id: "${p1}"
            - call: "GET /fccn/providers/${p1}"
              as: NetworkAdmin
              captures: { vbefore: $.data.version, mbefore: $.data.membership_status }
          trigger:
            - call: "POST /fccn/providers/${p1}/reinstate"
              as: NetworkAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${mbefore} == ACTIVE"
            - "${err} == ERR_INVALID_PROVIDER_STATE with HTTP 409"
            - "Provider.${p1}.membership_status == ACTIVE and version == ${vbefore} (no write occurred)"

      - name: withdraw_an_already_withdrawn_enrollment_returns_invalid_enrollment_state
        claim_type: Triggerable
        grounds:
          - errors[ERR_INVALID_ENROLLMENT_STATE]
          - state_machines.Enrollment.terminal_states
          - endpoints[POST /fccn/enrollments/{id}/withdraw]
        distinguishing_aspect: "WITHDRAWN is terminal, so a second withdraw returns ERR_INVALID_ENROLLMENT_STATE at HTTP 409 and does not re-run the slot-release side effect (committed slot count stays at 0, not -1)."
        test_recipe:
          setup:
            - "Provider P1 ACTIVE with one private enrollment CH-1 already withdrawn."
          setup_api_calls:
            - call: "POST /fccn/providers/apply"
              payload: { legal_name: "Alvarez Family Child Care", county_tier: "STANDARD", license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z", capacity_slots: 6 }
              as: Anonymous
              captures: { p1: $.data.id }
            - call: "POST /fccn/providers/${p1}/license-verification"
              payload: { license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z" }
              as: NetworkAdmin
              captures: { pv1: $.data.version }
            - call: "POST /fccn/membership-agreements"
              payload: { provider_id: "${p1}", network_fee_pct: 6.0, shared_services: ["ENROLLMENT"], effective_on: "2026-08-01T00:00:00Z", expected_provider_version: "${pv1}" }
              as: NetworkAdmin
              captures: { ag1: $.data.id }
            - call: "POST /fccn/membership-agreements/${ag1}/execute"
              as: Provider
              as_user_id: "${p1}"
            - call: "POST /fccn/enrollments"
              payload: { provider_id: "${p1}", child_ref: "CH-1", family_name: "Alvarez", days_per_week: 5, private_monthly_tuition_cents: 90000, subsidy_certified: false, start_on: "2026-08-01T00:00:00Z" }
              as: Provider
              as_user_id: "${p1}"
              captures: { e1: $.data.id }
            - call: "POST /fccn/enrollments/${e1}/withdraw"
              payload: { exit_on: "2026-08-20T00:00:00Z" }
              as: Provider
              as_user_id: "${p1}"
              captures: { st1: $.data.status, v1: $.data.version }
          trigger:
            - call: "POST /fccn/enrollments/${e1}/withdraw"
              payload: { exit_on: "2026-08-25T00:00:00Z" }
              as: Provider
              as_user_id: "${p1}"
              captures: { err: $.data.error_id }
          assert:
            - "${st1} == WITHDRAWN"
            - "${err} == ERR_INVALID_ENROLLMENT_STATE with HTTP 409"
            - "Enrollment.${e1}.version == ${v1} and exit_on == 2026-08-20T00:00:00Z (the second exit_on is not stored)"
            - "Provider.${p1}.projected_monthly_revenue_cents == 0 — the release side effect ran exactly once"

      - name: reject_cap_on_an_open_review_returns_invalid_review_state
        claim_type: Triggerable
        grounds:
          - errors[ERR_INVALID_REVIEW_STATE]
          - state_machines.ComplianceReview.transitions.CAP_SUBMITTED_to_CAP_REJECTED
          - endpoints[POST /fccn/compliance-reviews/{id}/reject-cap]
        distinguishing_aspect: "reject-cap is declared only from CAP_SUBMITTED, so on an OPEN review it returns ERR_INVALID_REVIEW_STATE at HTTP 409 and leaves cap_rejection_count at 0."
        test_recipe:
          setup:
