scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: quote_vs_final_price_diverge_on_skipped_addon
        grounds:
          - calculations.quote_price
          - calculations.final_price
          - state_machines.Appointment.QUOTED_to_SCHEDULED
          - state_machines.Appointment.SCHEDULED_to_COMPLETED
          - entities.Appointment.fields.quoted_price_cents
          - entities.Appointment.fields.final_price_cents
        distinguishing_aspect: |
          Cost-accounting dual-variant on the Appointment entity: the forward-looking quote counts
          every requested add-on (DESHED 2000 + NAIL_TRIM 1000) so quoted_price_cents == 9000, while
          the chronological final counts only delivered add-ons (NAIL_TRIM skipped) so
          final_price_cents == 8000; same inputs, two algorithms, different cents.
        test_recipe:
          setup:
            - "Clock at 2026-06-10T08:00:00Z."
            - "ServiceTier FULL_GROOM base_price_cents=6000 duration_multiplier=1.50; Breed base_service_minutes=60 MEDIUM SMOOTH."
            - "AddOn DESHED price 2000 / 30min; AddOn NAIL_TRIM price 1000 / 10min."
            - "Customer in ZIP 90001; Pet weight 40 (not heavy), coat NORMAL, CALM, with a non-expired RABIES record."
            - "Van max_stops 5; RouteDay window 09:00-17:00 covering 90001."
            - "Appointment for the pet at FULL_GROOM with both add-ons attached, QUOTED then SCHEDULED at 09:30."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /service-tiers"
              payload: { code: "FULL_GROOM", base_price_cents: 6000, duration_multiplier: 1.50 }
              as: PlatformAdmin
              captures: { tier_full_id: $.data.id }
            - call: "POST /breeds"
              payload: { name: "Beagle", coat_type: "SMOOTH", size_class: "MEDIUM", base_service_minutes: 60 }
              as: PlatformAdmin
              captures: { breed_id: $.data.id }
            - call: "POST /add-ons"
              payload: { code: "DESHED", price_cents: 2000, duration_minutes: 30 }
              as: PlatformAdmin
              captures: { addon_deshed_id: $.data.id }
            - call: "POST /add-ons"
              payload: { code: "NAIL_TRIM", price_cents: 1000, duration_minutes: 10 }
              as: PlatformAdmin
              captures: { addon_nail_id: $.data.id }
            - call: "POST /groomers"
              payload: { email: "g1@x.com", full_name: "G One", skill_level: "SENIOR", handles_aggressive: true, status: "AVAILABLE" }
              as: PlatformAdmin
              captures: { groomer_id: $.data.id }
            - call: "POST /vans"
              payload: { label: "VAN-1", max_stops: 5, has_show_equipment: true }
              as: PlatformAdmin
              captures: { van_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c1@x.com", full_name: "C One", service_zip: "90001" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /pets"
              payload: { customer_id: "${cust_id}", breed_id: "${breed_id}", name: "Rex", weight_lbs: 40, coat_condition: "NORMAL", behavioral_flag: "CALM" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { pet_id: $.data.id }
            - call: "POST /pets/${pet_id}/vaccinations"
              payload: { vaccine_type: "RABIES", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /route-days"
              payload: { van_id: "${van_id}", service_date: "2026-06-10T00:00:00Z", window_start: "2026-06-10T09:00:00Z", window_end: "2026-06-10T17:00:00Z", coverage_zip: "90001" }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v0: $.data.version }
            - call: "POST /appointments"
              payload: { pet_id: "${pet_id}", service_tier_id: "${tier_full_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/add-ons"
              payload: { add_on_id: "${addon_deshed_id}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /appointments/${appt_id}/add-ons"
              payload: { add_on_id: "${addon_nail_id}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /appointments/${appt_id}/quote"
              payload: {}
              as: Dispatcher
              captures: { quoted: $.data.quoted_price_cents }
            - call: "POST /appointments/${appt_id}/schedule"
              payload: { route_day_id: "${rd_id}", slot_start: "2026-06-10T09:30:00Z", expected_route_day_version: "${rd_v0}" }
              as: Dispatcher
          trigger:
            - call: "POST /appointments/${appt_id}/complete"
              payload:
                skipped_add_on_ids:
                  - "${addon_nail_id}"
              as: Groomer
              as_user_id: "${groomer_id}"
              captures: { final: $.data.final_price_cents }
          assert:
            - "Appointment.${appt_id}.quoted_price_cents == 9000"
            - "Appointment.${appt_id}.final_price_cents == 8000"
            - "Appointment.${appt_id}.quoted_price_cents != Appointment.${appt_id}.final_price_cents"

      - name: no_show_fee_standard_vs_repeat_escalated
        grounds:
          - calculations.no_show_fee
          - state_machines.Appointment.SCHEDULED_to_NO_SHOW
          - entities.Customer.fields.no_show_strikes
          - entities.FeeCharge.fields.amount_cents
        distinguishing_aspect: |
          Customer-risk dual-variant (different entity domain than the Appointment cost variant):
          an identical SCHEDULED->NO_SHOW on a quoted_price_cents==6000 appointment yields the
          standard fee 3000 when the customer's prior no_show_strikes < 2, but the escalated fee
          4500 (adds REPEAT_PENALTY_CENTS 1500) when prior strikes >= 2 — divergence keyed on
          Customer state, not on the appointment.
        test_recipe:
          setup:
            - "Clock at 2026-06-10T10:00:00Z."
            - "A customer who has already accrued 2 no_show_strikes via two prior NO_SHOW appointments."
            - "A fresh FULL_GROOM appointment quoted at 6000, scheduled at a 09:30 slot whose time has passed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /service-tiers"
              payload: { code: "FULL_GROOM", base_price_cents: 6000, duration_multiplier: 1.00 }
              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /breeds"
              payload: { name: "Pug", coat_type: "SMOOTH", size_class: "SMALL", base_service_minutes: 60 }
              as: PlatformAdmin
              captures: { breed_id: $.data.id }
            - call: "POST /groomers"
              payload: { email: "g2@x.com", full_name: "G Two", skill_level: "SENIOR", handles_aggressive: true, status: "AVAILABLE" }
              as: PlatformAdmin
              captures: { groomer_id: $.data.id }
            - call: "POST /vans"
              payload: { label: "VAN-2", max_stops: 5 }
              as: PlatformAdmin
              captures: { van_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c2@x.com", full_name: "C Two", service_zip: "90002" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /pets"
              payload: { customer_id: "${cust_id}", breed_id: "${breed_id}", name: "Bo", weight_lbs: 20, coat_condition: "NORMAL", behavioral_flag: "CALM" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { pet_id: $.data.id }
            - call: "POST /pets/${pet_id}/vaccinations"
              payload: { vaccine_type: "RABIES", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /route-days"
              payload: { van_id: "${van_id}", service_date: "2026-06-10T00:00:00Z", window_start: "2026-06-10T09:00:00Z", window_end: "2026-06-10T17:00:00Z", coverage_zip: "90002" }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v0: $.data.version }
            - call: "POST /appointments"
              payload: { pet_id: "${pet_id}", service_tier_id: "${tier_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { appt1_id: $.data.id }
            - call: "POST /appointments/${appt1_id}/quote"
              payload: {}
              as: Dispatcher
            - call: "POST /appointments/${appt1_id}/schedule"
              payload: { route_day_id: "${rd_id}", slot_start: "2026-06-10T09:00:00Z", expected_route_day_version: "${rd_v0}" }
              as: Dispatcher
            - call: "POST /appointments/${appt1_id}/no-show"
              payload: {}
              as: Dispatcher
            - call: "POST /appointments"
              payload: { pet_id: "${pet_id}", service_tier_id: "${tier_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { appt2_id: $.data.id }
            - call: "POST /appointments/${appt2_id}/quote"
              payload: {}
              as: Dispatcher
            - call: "GET /route-days/${rd_id}"
              payload: {}
              as: Dispatcher
              captures: { rd_v1: $.data.version }
            - call: "POST /appointments/${appt2_id}/schedule"
              payload: { route_day_id: "${rd_id}", slot_start: "2026-06-10T11:00:00Z", expected_route_day_version: "${rd_v1}" }
              as: Dispatcher
            - call: "POST /appointments/${appt2_id}/no-show"
              payload: {}
              as: Dispatcher
            - call: "POST /appointments"
              payload: { pet_id: "${pet_id}", service_tier_id: "${tier_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { appt3_id: $.data.id }
            - call: "POST /appointments/${appt3_id}/quote"
              payload: {}
              as: Dispatcher
            - call: "GET /route-days/${rd_id}"
              payload: {}
              as: Dispatcher
              captures: { rd_v2: $.data.version }
            - call: "POST /appointments/${appt3_id}/schedule"
              payload: { route_day_id: "${rd_id}", slot_start: "2026-06-10T13:00:00Z", expected_route_day_version: "${rd_v2}" }
              as: Dispatcher
          trigger:
            - call: "POST /appointments/${appt3_id}/no-show"
              payload: {}
              as: Dispatcher
              captures: { appt3_v: $.data.version }
            - call: "GET /fee-charges"
              payload: { appointment_id: "${appt3_id}" }
              as: Dispatcher
          assert:
            - "The FeeCharge created for appointment ${appt3_id} has amount_cents == 4500 (escalated: 3000 + 1500 repeat penalty)."
            - "The FeeCharge created for the first NO_SHOW (appt1, strikes_before 0) had amount_cents == 3000 (standard)."
            - "Customer.${cust_id}.no_show_strikes == 3 after the third NO_SHOW."

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: duration_estimate_multifactor_nonlinear
        grounds:
          - calculations.duration_estimate
          - state_machines.Appointment.REQUESTED_to_QUOTED
          - entities.Appointment.fields.estimated_minutes
        distinguishing_aspect: |
          Mode (a): >=3 inputs with conditional branches and a single ceil — tier_minutes =
          ceil(60 * 1.50)=90, +HEAVY_SURCHARGE_MIN 20 (weight 70 > 60), +MATTED_DEMAT_MIN 25
          (coat MATTED), +addon 30 (DESHED) = estimated_minutes 165; the branches on weight and
          coat plus the ceil make the result non-linear in the inputs.
        test_recipe:
          setup:
            - "Clock 2026-06-11T08:00:00Z."
            - "FULL_GROOM tier mult 1.50; Breed base 60; Pet weight 70 (heavy), coat MATTED, CALM, RABIES valid; DESHED add-on 30min attached."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-11T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /service-tiers"
              payload: { code: "FULL_GROOM", base_price_cents: 6000, duration_multiplier: 1.50 }
              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /breeds"
              payload: { name: "Newf", coat_type: "DOUBLE", size_class: "GIANT", base_service_minutes: 60 }
              as: PlatformAdmin
              captures: { breed_id: $.data.id }
            - call: "POST /add-ons"
              payload: { code: "DESHED", price_cents: 2000, duration_minutes: 30 }
              as: PlatformAdmin
              captures: { addon_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c3@x.com", full_name: "C Three", service_zip: "90003" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /pets"
              payload: { customer_id: "${cust_id}", breed_id: "${breed_id}", name: "Moose", weight_lbs: 70, coat_condition: "MATTED", behavioral_flag: "CALM" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { pet_id: $.data.id }
            - call: "POST /pets/${pet_id}/vaccinations"
              payload: { vaccine_type: "RABIES", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /appointments"
              payload: { pet_id: "${pet_id}", service_tier_id: "${tier_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/add-ons"
              payload: { add_on_id: "${addon_id}" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /appointments/${appt_id}/quote"
              payload: {}
              as: Dispatcher
              captures: { mins: $.data.estimated_minutes }
          assert:
            - "Appointment.${appt_id}.estimated_minutes == 165"

      - name: quote_price_nested_rounding_order
        grounds:
          - calculations.quote_price
          - state_machines.Appointment.REQUESTED_to_QUOTED
          - entities.Appointment.fields.quoted_price_cents
          - entities.RecurringPlan.fields.discount_pct
        distinguishing_aspect: |
          Mode (b): nested-rounding order pinned — per-component loadings are rounded first
          (coat round(3000*0.30)=900, size round(3000*0.15)=450), summed into gross 4350; then the
          plan discount is rounded AFTER the gross is formed (round((4350+2000)*0.10)=round(635.0)=635),
          giving quoted_price_cents 5715. Rounding the discount per-line or before the add-on sum
          would yield a different cents value.
        test_recipe:
          setup:
            - "Clock 2026-06-11T08:00:00Z."
            - "BATH_ONLY tier base 3000 mult 1.0; Breed base 40; Pet weight 70 (heavy), coat MATTED, CALM, RABIES valid."
            - "DESHED add-on price 2000 attached; appointment generated from a RecurringPlan with discount_pct 0.10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-11T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /service-tiers"
              payload: { code: "BATH_ONLY", base_price_cents: 3000, duration_multiplier: 1.00 }
              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /breeds"
              payload: { name: "Husky", coat_type: "DOUBLE", size_class: "LARGE", base_service_minutes: 40 }
              as: PlatformAdmin
              captures: { breed_id: $.data.id }
            - call: "POST /add-ons"
              payload: { code: "DESHED", price_cents: 2000, duration_minutes: 30 }
              as: PlatformAdmin
              captures: { addon_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c4@x.com", full_name: "C Four", service_zip: "90004" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /pets"
              payload: { customer_id: "${cust_id}", breed_id: "${breed_id}", name: "Sky", weight_lbs: 70, coat_condition: "MATTED", behavioral_flag: "CALM" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { pet_id: $.data.id }
            - call: "POST /pets/${pet_id}/vaccinations"
              payload: { vaccine_type: "RABIES", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /recurring-plans"
              payload: { pet_id: "${pet_id}", service_tier_id: "${tier_id}", cadence_days: 28, discount_pct: 0.10 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /recurring-plans/${plan_id}/generate-appointment"
              payload: {}
              as: Dispatcher
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/add-ons"
              payload: { add_on_id: "${addon_id}" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /appointments/${appt_id}/quote"
              payload: {}
              as: Dispatcher
              captures: { quoted: $.data.quoted_price_cents }
          assert:
            - "Appointment.${appt_id}.quoted_price_cents == 5715"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: appointment_requote_loop_then_fork_cancel
        grounds:
          - state_machines.Appointment.QUOTED_to_QUOTED
          - state_machines.Appointment.QUOTED_to_CANCELLED
          - entities.Appointment.fields.quote_round
        distinguishing_aspect: |
          Non-linear shape on Appointment: QUOTED->QUOTED is a cyclic self-loop (quote_round
          increments each pass: 1 then 2) and QUOTED then forks to CANCELLED rather than SCHEDULED,
          proving the machine is not a linear pipeline.
        test_recipe:
          setup:
            - "Clock 2026-06-12T08:00:00Z; FULL_GROOM tier; pet with valid RABIES; appointment QUOTED once already."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-12T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /service-tiers"
              payload: { code: "FULL_GROOM", base_price_cents: 6000, duration_multiplier: 1.00 }
              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /breeds"
              payload: { name: "Lab", coat_type: "SMOOTH", size_class: "LARGE", base_service_minutes: 50 }
              as: PlatformAdmin
              captures: { breed_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c5@x.com", full_name: "C Five", service_zip: "90005" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /pets"
              payload: { customer_id: "${cust_id}", breed_id: "${breed_id}", name: "Duke", weight_lbs: 50, coat_condition: "NORMAL", behavioral_flag: "CALM" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { pet_id: $.data.id }
            - call: "POST /pets/${pet_id}/vaccinations"
              payload: { vaccine_type: "RABIES", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /appointments"
              payload: { pet_id: "${pet_id}", service_tier_id: "${tier_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/quote"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /appointments/${appt_id}/quote"
              payload: {}
              as: Dispatcher
              captures: { qr: $.data.quote_round }
            - call: "POST /appointments/${appt_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { st: $.data.status }
          assert:
            - "After the second quote, Appointment.${appt_id}.quote_round == 2."
            - "Appointment.${appt_id}.status == CANCELLED (forked off the QUOTED state, not via SCHEDULED)."

      - name: recurring_plan_pause_resume_cycle
        grounds:
          - state_machines.RecurringPlan.ACTIVE_to_PAUSED
          - state_machines.RecurringPlan.PAUSED_to_ACTIVE
          - state_machines.RecurringPlan.ACTIVE_to_ACTIVE
          - entities.RecurringPlan.fields.status
        distinguishing_aspect: |
          Non-linear shape on a different entity (RecurringPlan): ACTIVE->PAUSED->ACTIVE is a true
          revision cycle and ACTIVE->ACTIVE is a generating self-loop; the plan returns to a state it
          already occupied, which a linear machine cannot.
        test_recipe:
          setup:
            - "An ACTIVE RecurringPlan for a pet."
          setup_api_calls:
            - call: "POST /service-tiers"
              payload: { code: "FULL_GROOM", base_price_cents: 6000, duration_multiplier: 1.00 }
              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /breeds"
              payload: { name: "Corgi", coat_type: "DOUBLE", size_class: "SMALL", base_service_minutes: 45 }
              as: PlatformAdmin
              captures: { breed_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c6@x.com", full_name: "C Six", service_zip: "90006" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /pets"
              payload: { customer_id: "${cust_id}", breed_id: "${breed_id}", name: "Pip", weight_lbs: 25 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { pet_id: $.data.id }
            - call: "POST /recurring-plans"
              payload: { pet_id: "${pet_id}", service_tier_id: "${tier_id}", cadence_days: 28, discount_pct: 0.05 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /recurring-plans/${plan_id}/pause"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { st_paused: $.data.status }
            - call: "POST /recurring-plans/${plan_id}/resume"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { st_active: $.data.status }
            - call: "POST /recurring-plans/${plan_id}/generate-appointment"
              payload: {}
              as: Dispatcher
              captures: { gen_appt_id: $.data.id }
          assert:
            - "After pause, RecurringPlan.${plan_id}.status == PAUSED."
            - "After resume, RecurringPlan.${plan_id}.status == ACTIVE (returned to a prior state)."
            - "generate-appointment from ACTIVE creates an Appointment with recurring_plan_id == ${plan_id} in status REQUESTED."

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: no_show_cascade_fee_strike_suspend_depth3
        grounds:
          - state_machines.Appointment.SCHEDULED_to_NO_SHOW
          - calculations.no_show_fee
          - entities.FeeCharge.fields.amount_cents
          - entities.Customer.fields.no_show_strikes
          - entities.Customer.fields.account_status
          - entities.Customer.fields.outstanding_fee_cents
        distinguishing_aspect: |
