              as_user_id: "op-1"
          assert:
            - "HTTP status is 409"
            - "response.data.error_id == 'ERR_WIDTH_EXCEEDS_DECKLE'"
            - "GET /production-runs/${run_2} as MillPlanner reports run_status == 'RUNNING' and produced_tons == 0.000"
            - "GET /roll-sets?production_run_id=${run_2} as MillPlanner reports total_count == 0"

