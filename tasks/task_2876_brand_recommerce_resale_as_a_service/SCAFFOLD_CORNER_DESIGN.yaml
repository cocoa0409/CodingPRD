              payload: { code: "OUTLET-1", channel_type: "OUTLET", allowed_assortment: "BOTH", max_resale_price_ratio_bp: 5000, region_code: "US-CA" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { chan_b: "$.data.id" }
          trigger:
            - call: "GET /recommerce/channels/${chan_a}"
              as: MerchandisingManager
              as_user_id: "merch-001"
              captures: { r_code: "$.data.code", r_type: "$.data.channel_type", r_assort: "$.data.allowed_assortment", r_cap: "$.data.max_resale_price_ratio_bp", r_ver: "$.data.version" }
            - call: "GET /recommerce/channels/${chan_a}/markdown-campaigns"
