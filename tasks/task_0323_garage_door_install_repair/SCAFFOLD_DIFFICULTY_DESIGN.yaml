# =============================================================================
# task_0323_garage_door_install_repair — §1.8 Scaffold Difficulty Design
# Test Targeting Index — 9 rules x >=2 instances. EXPERT tier.
# Every grounds[] ref resolves in SCAFFOLD.yaml §1.1-§1.7.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dvc_quote_estimate_vs_job_final_diverge
        grounds:
          - calculations.quote_estimate_total
          - calculations.job_final_total
          - entities.Quote.fields.estimate_total_cents
          - entities.Job.fields.final_total_cents
          - state_machines.Job.dispatch_status.ON_SITE_to_COMPLETED
        distinguishing_aspect: |
          The estimate runs on the Quote (forward-looking over all lines incl. a separate
          LABOR line + service fee) while the final runs on the Job (consumed parts + the
          service fee folded in as labor, no separate LABOR line) — different entity domains,
          and for identical inputs estimate_total_cents=50900 but final_total_cents=35900.
        test_recipe:
          setup:
            - "A SERVICE_CALL quote with fee 8900, one PART line (spring qty 2 @10000, markup 0.35) and one LABOR line (60 min) is SENT, estimate 50900."
            - "Customer accepts -> Job created, one HELD reservation qty 2; tech consumes it, passes safety, completes."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ann Diver", email: "ann@x.com", service_address: "1 A St", time_zone: "America/Phoenix" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /technicians"
              payload: { display_name: "Tex", skill_level: "CERTIFIED", certified_for_install: true }
              as: ServiceManager
              captures: { tech_id: $.data.id }
            - call: "POST /parts"
              payload: { sku: "SPR-1", category: "SPRING", unit_price_cents: 10000, markup_pct: 0.35, on_hand_qty: 10 }
              as: ServiceManager
              captures: { spring_id: $.data.id }
            - call: "POST /quotes"
              payload: { customer_id: "${cust_id}", quote_type: "SERVICE_CALL", service_call_fee_cents: 8900 }
              as: ServiceManager
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/lines"
              payload: { item_kind: "PART", item_ref_id: "${spring_id}", qty: 2, unit_price_cents: 10000 }
              as: ServiceManager
            - call: "POST /quotes/${quote_id}/lines"
              payload: { item_kind: "LABOR", qty: 60 }
              as: ServiceManager
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: ServiceManager
            - call: "POST /quotes/${quote_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /jobs"
              payload: {}
              as: ServiceManager
              captures: { job_id: "$.data[0].id" }
            - call: "POST /jobs/${job_id}/schedule"
              payload: { technician_id: "${tech_id}", scheduled_start: "2026-07-01T17:00:00Z", scheduled_end: "2026-07-01T19:00:00Z" }
              as: Dispatcher
            - call: "POST /jobs/${job_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /jobs/${job_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "GET /part-reservations"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { resv_id: "$.data[0].id" }
            - call: "POST /part-reservations/${resv_id}/consume"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /jobs/${job_id}/safety-check"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /jobs/${job_id}/complete"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { final: $.data.final_total_cents }
          assert:
            - "Quote.${quote_id}.estimate_total_cents == 50900"
            - "Job.${job_id}.final_total_cents == 35900"
            - "Quote.${quote_id}.estimate_total_cents != Job.${job_id}.final_total_cents"

      - name: dvc_technician_callback_rate_provisional_vs_settled
        grounds:
          - calculations.technician_callback_rate
          - entities.Technician.fields.callback_rate_provisional
          - entities.Technician.fields.callback_rate_settled
          - state_machines.Callback.status.OPEN_to_SCHEDULED
        distinguishing_aspect: |
          Dual variant on the Technician domain (not Quote/Job cost): an OPEN callback counts
          as a fault in callback_rate_provisional (0.5 over 2 completed jobs) but not in
          callback_rate_settled (0.0) until it is RESOLVED with fault_confirmed.
        test_recipe:
          setup:
            - "A technician has 2 COMPLETED jobs and exactly 1 OPEN callback on one of them."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Bo Cust", email: "bo@x.com", service_address: "2 B St", time_zone: "America/Phoenix" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /technicians"
              payload: { display_name: "Cal", skill_level: "CERTIFIED", certified_for_install: true }
              as: ServiceManager
              captures: { tech_id: $.data.id }
            - call: "POST /quotes"
              payload: { customer_id: "${cust_id}", quote_type: "SERVICE_CALL", service_call_fee_cents: 5000 }
              as: ServiceManager
              captures: { q1_id: $.data.id }
            - call: "POST /quotes/${q1_id}/lines"
              payload: { item_kind: "LABOR", qty: 30 }
              as: ServiceManager
            - call: "POST /quotes/${q1_id}/send"
              payload: {}
              as: ServiceManager
            - call: "POST /quotes/${q1_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /jobs"
              payload: { quote_id: "${q1_id}" }
              as: ServiceManager
              captures: { j1_id: "$.data[0].id" }
            - call: "POST /jobs/${j1_id}/schedule"
              payload: { technician_id: "${tech_id}", scheduled_start: "2026-07-01T17:00:00Z", scheduled_end: "2026-07-01T18:00:00Z" }
              as: Dispatcher
            - call: "POST /jobs/${j1_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /jobs/${j1_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /jobs/${j1_id}/safety-check"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /jobs/${j1_id}/complete"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /quotes"
              payload: { customer_id: "${cust_id}", quote_type: "SERVICE_CALL", service_call_fee_cents: 5000 }
              as: ServiceManager
              captures: { q2_id: $.data.id }
            - call: "POST /quotes/${q2_id}/lines"
              payload: { item_kind: "LABOR", qty: 30 }
              as: ServiceManager
            - call: "POST /quotes/${q2_id}/send"
              payload: {}
              as: ServiceManager
            - call: "POST /quotes/${q2_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /jobs"
              payload: { quote_id: "${q2_id}" }
              as: ServiceManager
              captures: { j2_id: "$.data[0].id" }
            - call: "POST /jobs/${j2_id}/schedule"
              payload: { technician_id: "${tech_id}", scheduled_start: "2026-07-02T17:00:00Z", scheduled_end: "2026-07-02T18:00:00Z" }
              as: Dispatcher
            - call: "POST /jobs/${j2_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /jobs/${j2_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /jobs/${j2_id}/safety-check"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /jobs/${j2_id}/complete"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /callbacks"
              payload: { job_id: "${j1_id}", reason: "door reverses" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /technicians/${tech_id}"
              payload: {}
              as: ServiceManager
              captures: { prov: $.data.callback_rate_provisional, settled: $.data.callback_rate_settled }
          assert:
            - "Technician.${tech_id}.jobs_completed_count == 2"
            - "Technician.${tech_id}.callback_rate_provisional == 0.5"
            - "Technician.${tech_id}.callback_rate_settled == 0.0"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cf_emergency_surcharge_tier_and_cap
        grounds:
          - calculations.job_emergency_surcharge
          - calculations.job_final_total
          - entities.Job.fields.emergency_surcharge_cents
          - entities.Customer.fields.time_zone
        distinguishing_aspect: |
          MODE (a): >=3 inputs (is_emergency, time-of-day band in Customer tz, base) with
          non-linear band selection and a min/max clamp. INSTALL at 19:00 Phoenix (AFTER_HOURS,
          rate 0.25) on base 72000 yields surcharge 18000 and final_total 90000.
        test_recipe:
          setup:
            - "INSTALL quote (door 180min, one PANEL part) accepted; emergency job scheduled 19:00 Phoenix; one panel consumed; completed."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Em Night", email: "em@x.com", service_address: "3 C St", time_zone: "America/Phoenix" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /technicians"
              payload: { display_name: "Dan", skill_level: "MASTER", certified_for_install: true }
              as: ServiceManager
              captures: { tech_id: $.data.id }
            - call: "POST /door-models"
              payload: { sku: "DR-9", name: "Steel 9x7", width_in: 108, height_in: 84, list_price_cents: 120000, install_labor_minutes: 180, requires_lift: false }
              as: ServiceManager
              captures: { door_id: $.data.id }
            - call: "POST /parts"
              payload: { sku: "PNL-1", category: "PANEL", unit_price_cents: 20000, markup_pct: 0.35, on_hand_qty: 5 }
              as: ServiceManager
              captures: { panel_id: $.data.id }
            - call: "POST /quotes"
              payload: { customer_id: "${cust_id}", quote_type: "INSTALL", door_model_id: "${door_id}" }
              as: ServiceManager
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/lines"
              payload: { item_kind: "PART", item_ref_id: "${panel_id}", qty: 1, unit_price_cents: 20000 }
              as: ServiceManager
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: ServiceManager
            - call: "POST /quotes/${quote_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /jobs"
              payload: { quote_id: "${quote_id}" }
              as: ServiceManager
              captures: { job_id: "$.data[0].id" }
            - call: "POST /jobs/${job_id}/schedule"
              payload: { technician_id: "${tech_id}", scheduled_start: "2026-07-01T02:00:00Z", scheduled_end: "2026-07-01T04:00:00Z", is_emergency: true }
              as: Dispatcher
            - call: "POST /jobs/${job_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /jobs/${job_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "GET /part-reservations"
              payload: { job_id: "${job_id}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { resv_id: "$.data[0].id" }
            - call: "POST /part-reservations/${resv_id}/consume"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /jobs/${job_id}/safety-check"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /jobs/${job_id}/complete"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { sur: $.data.emergency_surcharge_cents, ft: $.data.final_total_cents }
          assert:
            - "Job.${job_id}.emergency_surcharge_cents == 18000"
            - "Job.${job_id}.final_total_cents == 90000"

      - name: cf_quote_line_round_then_sum_order
        grounds:
          - calculations.quote_estimate_total
          - entities.QuoteLine.fields.line_total_cents
          - entities.Quote.fields.estimate_total_cents
          - state_machines.Quote.status.DRAFT_to_SENT
        distinguishing_aspect: |
          MODE (b): nested-rounding order. Two PART lines each raw 449.55 round per line to 450
          (sum 900); summing raw first then rounding once would give 899. Scaffold pins per-line
          rounding, so estimate_total_cents == 900, never 899.
        test_recipe:
          setup:
            - "SERVICE_CALL quote, fee 0, two PART lines from a part priced 333 @ markup 0.35, qty 1 each, then SENT."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ro Und", email: "ro@x.com", service_address: "4 D St" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /parts"
              payload: { sku: "RLR-1", category: "ROLLER", unit_price_cents: 333, markup_pct: 0.35, on_hand_qty: 20 }
              as: ServiceManager
              captures: { roller_id: $.data.id }
            - call: "POST /quotes"
              payload: { customer_id: "${cust_id}", quote_type: "SERVICE_CALL", service_call_fee_cents: 0 }
              as: ServiceManager
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/lines"
              payload: { item_kind: "PART", item_ref_id: "${roller_id}", qty: 1, unit_price_cents: 333 }
              as: ServiceManager
              captures: { lineA_id: $.data.id }
            - call: "POST /quotes/${quote_id}/lines"
              payload: { item_kind: "PART", item_ref_id: "${roller_id}", qty: 1, unit_price_cents: 333 }
              as: ServiceManager
              captures: { lineB_id: $.data.id }
          trigger:
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: ServiceManager
              captures: { est: $.data.estimate_total_cents }
          assert:
            - "Quote.${quote_id}.estimate_total_cents == 900"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: nlsm_quote_cyclic_revise_loop
        grounds:
          - state_machines.Quote.status.SENT_to_SENT
          - entities.Quote.fields.revision
          - entities.Quote.fields.version
        distinguishing_aspect: |
          Cyclic self-loop on Quote: a SENT quote revised twice stays SENT with revision==3.
          Distinct entity (Quote) from the parallel-dimension machine (Job).
        test_recipe:
          setup:
            - "A SERVICE_CALL quote with one LABOR line is SENT (revision 1, version captured)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cy Loop", email: "cy@x.com", service_address: "5 E St" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /quotes"
              payload: { customer_id: "${cust_id}", quote_type: "SERVICE_CALL", service_call_fee_cents: 5000 }
              as: ServiceManager
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/lines"
              payload: { item_kind: "LABOR", qty: 30 }
              as: ServiceManager
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: ServiceManager
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /quotes/${quote_id}/revise"
              payload: { expected_quote_version: "${v1}" }
              as: ServiceManager
              captures: { v2: $.data.version }
            - call: "POST /quotes/${quote_id}/revise"
              payload: { expected_quote_version: "${v2}" }
              as: ServiceManager
          assert:
            - "Quote.${quote_id}.status == SENT"
            - "Quote.${quote_id}.revision == 3"

      - name: nlsm_job_parallel_dispatch_billing_dimensions
        grounds:
          - state_machines.Job.dispatch_status.ON_SITE_to_COMPLETED
          - state_machines.Job.billing_status.PENDING_to_INVOICED
          - entities.Job.fields.dispatch_status
          - entities.Job.fields.billing_status
        distinguishing_aspect: |
          Parallel independent dimensions on one entity (Job): dispatch_status advances to
          COMPLETED while billing_status remains PENDING until /invoice — the two axes evolve
          independently. Distinct entity from the cyclic Quote machine.
        test_recipe:
          setup:
            - "A SERVICE_CALL job completed (dispatch_status COMPLETED) but not yet invoiced (billing_status PENDING)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Pa Rallel", email: "pa@x.com", service_address: "6 F St", time_zone: "America/Phoenix" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /technicians"
              payload: { display_name: "Ed", skill_level: "CERTIFIED", certified_for_install: true }
              as: ServiceManager
              captures: { tech_id: $.data.id }
            - call: "POST /quotes"
              payload: { customer_id: "${cust_id}", quote_type: "SERVICE_CALL", service_call_fee_cents: 6000 }
              as: ServiceManager
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/lines"
              payload: { item_kind: "LABOR", qty: 30 }
              as: ServiceManager
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: ServiceManager
            - call: "POST /quotes/${quote_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /jobs"
              payload: { quote_id: "${quote_id}" }
              as: ServiceManager
              captures: { job_id: "$.data[0].id" }
            - call: "POST /jobs/${job_id}/schedule"
              payload: { technician_id: "${tech_id}", scheduled_start: "2026-07-01T17:00:00Z", scheduled_end: "2026-07-01T18:00:00Z" }
              as: Dispatcher
            - call: "POST /jobs/${job_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /jobs/${job_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /jobs/${job_id}/safety-check"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /jobs/${job_id}/complete"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ds: $.data.dispatch_status, bs: $.data.billing_status }
          assert:
            - "Job.${job_id}.dispatch_status == COMPLETED"
            - "Job.${job_id}.billing_status == PENDING"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: tc_quote_accept_job_reservation_part_depth3
        grounds:
          - state_machines.Quote.status.SENT_to_ACCEPTED
          - entities.Job.fields.dispatch_status
          - entities.PartReservation.fields.status
          - entities.Part.fields.reserved_qty
          - entities.Part.fields.available_qty
        distinguishing_aspect: |
          Depth-3 cascade from the SENT->ACCEPTED trigger: accept creates the Job (hop1); the
          Job creation creates a HELD PartReservation (hop2); the reservation creation increments
          Part.reserved_qty and recomputes available_qty (hop3). Each link is caused by the prior.
        test_recipe:
          setup:
            - "A SERVICE_CALL quote with one PART line (spring qty 2) is SENT; part starts on_hand 10, available 10."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ca Scade", email: "ca@x.com", service_address: "7 G St" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /parts"
              payload: { sku: "SPR-2", category: "SPRING", unit_price_cents: 10000, markup_pct: 0.35, on_hand_qty: 10 }
              as: ServiceManager
              captures: { spring_id: $.data.id }
            - call: "POST /quotes"
              payload: { customer_id: "${cust_id}", quote_type: "SERVICE_CALL", service_call_fee_cents: 5000 }
              as: ServiceManager
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/lines"
              payload: { item_kind: "PART", item_ref_id: "${spring_id}", qty: 2, unit_price_cents: 10000 }
              as: ServiceManager
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: ServiceManager
          trigger:
            - call: "POST /quotes/${quote_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /parts/${spring_id}"
              payload: {}
              as: ServiceManager
              captures: { rq: $.data.reserved_qty, aq: $.data.available_qty }
            - call: "GET /part-reservations"
              payload: { part_id: "${spring_id}" }
              as: ServiceManager
              captures: { resv_status: "$.data[0].status" }
          assert:
            - "Part.${spring_id}.reserved_qty == 2"
            - "Part.${spring_id}.available_qty == 8"
            - "PartReservation linked to spring is in status HELD"

      - name: tc_job_close_warranty_activate_customer_count_depth2
        grounds:
          - state_machines.Job.dispatch_status.COMPLETED_to_CLOSED
          - state_machines.WarrantyPlan.status.PENDING_to_ACTIVE
          - entities.WarrantyPlan.fields.status
          - entities.Customer.fields.active_warranty_count
        distinguishing_aspect: |
          Depth-2 cascade from the COMPLETED->CLOSED trigger (distinct from the accept trigger):
          close activates the PENDING WarrantyPlan (hop1), and warranty activation increments
          Customer.active_warranty_count (hop2).
        test_recipe:
          setup:
            - "A completed+paid SERVICE_CALL job with a PENDING WarrantyPlan; customer active_warranty_count 0."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Wa Rranty", email: "wa@x.com", service_address: "8 H St", time_zone: "America/Phoenix" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /technicians"
              payload: { display_name: "Fin", skill_level: "CERTIFIED", certified_for_install: true }
              as: ServiceManager
              captures: { tech_id: $.data.id }
            - call: "POST /quotes"
              payload: { customer_id: "${cust_id}", quote_type: "SERVICE_CALL", service_call_fee_cents: 6000 }
              as: ServiceManager
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/lines"
              payload: { item_kind: "LABOR", qty: 30 }
              as: ServiceManager
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: ServiceManager
            - call: "POST /quotes/${quote_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /jobs"
              payload: { quote_id: "${quote_id}" }
              as: ServiceManager
              captures: { job_id: "$.data[0].id" }
            - call: "POST /warranty-plans"
              payload: { job_id: "${job_id}", customer_id: "${cust_id}", tune_ups_included: 2 }
              as: ServiceManager
