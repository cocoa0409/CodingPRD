              as: AgencyOfficer
              captures: { p_tx_id: $.data.id }
            - call: "POST /flood-zone/properties"
              payload: { community_id: "${c_tx_id}", street_address: "902 Buffalo Bayou Dr", city: "Houston", postal_code: "77002", map_panel_number: "48201C0455L", latitude: 29.7604, longitude: -95.3698, geocode_method: "ROOFTOP", geocode_confidence_score: 0.94 }
              as: ProviderAnalyst
              captures: { pr_tx_id: $.data.id }
            - call: "POST /flood-zone/structures"
              payload: { property_id: "${pr_tx_id}", structure_label: "Main dwelling", occupancy_type: "SINGLE_FAMILY", foundation_type: "SLAB", replacement_cost_cents: 29000000, sfha_offset_ft: -8.0 }
              as: ProviderAnalyst
              captures: { st_tx_id: $.data.id }
          trigger:
            - call: "POST /flood-zone/elevation-certificates"
              payload: { structure_id: "${st_tx_id}", surveyor_license_number: "TX-RPLS-5512", survey_date: "2026-07-01T00:00:00Z", datum: "NGVD29", raw_lowest_floor_elevation_ft: 9.06, raw_lowest_adjacent_grade_ft: 8.94 }
