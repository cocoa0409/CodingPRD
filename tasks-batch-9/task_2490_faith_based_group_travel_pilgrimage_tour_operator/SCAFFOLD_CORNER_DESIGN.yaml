  - section: calculations
    instances:
      - name: air_deviation_origin_change_fee_reprices_invoice
        claim_type: correct_result
        grounds:
          - calculations.air_deviation_fee
          - calculations.pilgrim_invoice_total
        distinguishing_aspect: "An ORIGIN_CHANGE deviation 92 days out takes the normal multiplier, so deviation_fee_cents is exactly 12500 (not the late 18750) and the invoice re-runs to 589458 rather than staying at 577168."
        test_recipe:
          setup:
            - "Holy Land departure on 2026-11-01, OPEN_FOR_SALE, tier T1 587000 / deposit 50000."
            - "A CONFIRMED air block at 810000 so a deviation may be filed."
            - "One CONFIRMED traveler in a DOUBLE room; clock left at the default 2026-08-01, which is 92 days before departure and therefore outside the 30 day late window."
          setup_api_calls:
            - call: "POST /programs"
              payload:
                name: "Holy Land Pilgrimage"
                destination_country: "IL"
                faith_tradition: "CATHOLIC"
                duration_days: 10
                price_tiers:
                  - { tier_code: "T1", min_pax: 1, max_pax: 9, per_pax_price_cents: 587000, single_supplement_cents: 98000, deposit_cents: 50000 }
                cancellation_grid:
                  - { min_days_before: 60, penalty_bp: 3500 }
                  - { min_days_before: 0, penalty_bp: 10000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /departures"
              payload: { program_id: "${prog_id}", departure_date: "2026-11-01", return_date: "2026-11-11", min_pax: 1, max_pax: 40, deposit_due_date: "2026-08-15", final_payment_due_date: "2026-10-15", mobility_accessible_coach: true }
              as: ProgramManager
              captures: { dep_id: $.data.id }
            - call: "POST /departures/${dep_id}/open-sales"
              payload: {}
              as: ProgramManager
            - call: "POST /air-blocks"
              payload: { departure_id: "${dep_id}", carrier_code: "LY", seats_held: 20, name_change_deadline_utc: "2026-09-20T00:00:00Z", deposit_deadline_utc: "2026-08-25T00:00:00Z" }
              as: AirDeskAgent
              captures: { ab_id: $.data.id }
            - call: "POST /air-blocks/${ab_id}/negotiation-rounds"
              payload: { party: "CARRIER_OFFER", fare_cents: 810000 }
              as: AirDeskAgent
            - call: "POST /air-blocks/${ab_id}/confirm"
              payload: {}
              as: AirDeskAgent
            - call: "POST /pilgrims"
              payload: { departure_id: "${dep_id}", full_name: "Traveler A", date_of_birth: "1975-01-10", room_type_requested: "DOUBLE" }
