      - name: withhold_capacity_bumps_a_confirmed_booking_but_never_breaches_the_physical_ceiling
        claim_type: violation_to_error
        grounds:
          - validations[priority=32].ERR_WITHHELD_UNITS_EXCEEDED
          - validations[priority=32].ERR_SLOT_UNITS_EXCEED_CAPACITY
          - endpoints[POST /delivery-slots/{slotId}/withhold-capacity]
          - calculations.slot_capacity_ledger
        distinguishing_aspect: "The withhold guard is measured against total_capacity_units - withheld_units, NOT against available_units: withholding 2 more units on a 10-unit slot that already withholds 8 and has 2 confirmed units is legal and deliberately drives available_units to -2, which bumps the CONFIRMED booking back to DRAFT/PENDING_AUTH; only the next unit breaches the physical ceiling and returns ERR_WITHHELD_UNITS_EXCEEDED (422). The same ceiling then makes a 1-unit booking unsatisfiable and returns ERR_SLOT_UNITS_EXCEED_CAPACITY rather than waitlisting it."
        test_recipe:
          setup:
            - "Route R1 (base fee 599), AMBIENT zone A1, SKU AMB-1 at 700 cents with 100 units, and a far-future slot on R1 with total_capacity_units 10 and withheld_units 0."
            - "Order A (2 x AMB-1, subtotal 1400) holds a CONFIRMED 2-unit booking, so the order is SLOTTED / AUTHORIZED at 1999 cents. Order B (2 x AMB-1) has no booking yet and its version is captured."
          setup_api_calls:
            - call: "POST /delivery-routes"
              payload: { route_code: "R1", service_area_name: "North", van_capacity_totes: 40, base_delivery_fee_cents: 599, per_km_cost_cents: 150 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { route_id: $.data.id }
            - call: "POST /grid-zones"
              payload: { zone_code: "A1", temperature_zone: "AMBIENT", bot_count: 4 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { zone_amb: $.data.id }
            - call: "POST /inventory-skus"
              payload: { sku_code: "AMB-1", name: "Pasta", grid_zone_id: "${zone_amb}", temperature_zone: "AMBIENT", substitution_group_code: "DRY", is_catchweight: false, unit_price_cents: 700, physical_units: 100 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { sku_id: $.data.id }
            - call: "POST /delivery-slots"
              payload: { route_id: "${route_id}", window_start: "2026-08-05T10:00:00.000Z", window_end: "2026-08-05T12:00:00.000Z", total_capacity_units: 10, withheld_units: 0 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { slot_id: $.data.id }
            - call: "POST /customer-accounts"
              payload: { email: "a@example.com", full_name: "Ada Lane", loyalty_tier: "BASIC", home_route_id: "${route_id}" }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { cust_id: $.data.id }
            - call: "POST /customer-orders"
              payload: { stop_distance_km: 5 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_a: $.data.id }
            - call: "POST /customer-orders/${order_a}/lines"
              payload: { sku_id: "${sku_id}", ordered_qty: 2 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /customer-orders/${order_a}"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { va: $.data.version }
            - call: "POST /slot-bookings"
              payload: { delivery_slot_id: "${slot_id}", customer_order_id: "${order_a}", units: 2, expected_order_version: "${va}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { booking_a: $.data.id }
            - call: "POST /slot-bookings/${booking_a}/confirm"
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /customer-orders"
              payload: { stop_distance_km: 6 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_b: $.data.id }
            - call: "POST /customer-orders/${order_b}/lines"
              payload: { sku_id: "${sku_id}", ordered_qty: 2 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /customer-orders/${order_b}"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { vb: $.data.version }
          trigger:
            - call: "POST /delivery-slots/${slot_id}/withhold-capacity"
              payload: { units: 8 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
            - call: "POST /delivery-slots/${slot_id}/withhold-capacity"
              payload: { units: 2 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
            - call: "POST /delivery-slots/${slot_id}/withhold-capacity"
              payload: { units: 1 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { err_withhold: $.data.error_id }
            - call: "POST /slot-bookings"
              payload: { delivery_slot_id: "${slot_id}", customer_order_id: "${order_b}", units: 1, expected_order_version: "${vb}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err_booking: $.data.error_id }
          assert:
            - "after trigger 1 (HTTP 200): DeliverySlot.${slot_id}.withheld_units == 8, confirmed_units == 2, held_units == 0, available_units == 0, surge_multiplier == 1.35"
            - "after trigger 1 SlotBooking.${booking_a}.status is still CONFIRMED"
            - "after trigger 2 (HTTP 200): DeliverySlot.${slot_id}.withheld_units == 10, confirmed_units == 0, held_units == 0, available_units == 0, surge_multiplier == 1.00"
            - "after trigger 2 SlotBooking.${booking_a}.status == BUMPED"
            - "after trigger 2 CustomerOrder.${order_a}.fulfillment_status == DRAFT and billing_status == PENDING_AUTH"
            - "after trigger 2 CustomerOrder.${order_a}.authorized_amount_cents == null, delivery_fee_cents == null, loyalty_discount_cents == null, order_total_cents == null"
            - "after trigger 2 CustomerOrder.${order_a}.merchandise_subtotal_cents == 1400 (merchandise is untouched by the bump)"
            - "trigger 3 returns HTTP 422 and ${err_withhold} == ERR_WITHHELD_UNITS_EXCEEDED"
            - "after trigger 3 DeliverySlot.${slot_id}.withheld_units is still 10 (the rejected withhold changed nothing)"
            - "trigger 4 returns HTTP 422 and ${err_booking} == ERR_SLOT_UNITS_EXCEED_CAPACITY (not WAITLISTED)"
            - "GET /slot-bookings?customer_order_id=${order_b} returns total_count == 0"
            - "DeliverySlot.${slot_id}.total_capacity_units == 10 equals withheld_units + held_units + confirmed_units + available_units"

      - name: booking_exactly_at_the_minimum_order_and_capacity_ceiling_is_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=33].ERR_MINIMUM_ORDER_NOT_MET
          - validations[priority=32].ERR_SLOT_UNITS_EXCEED_CAPACITY
          - validations[priority=18].ERR_ROUTE_MISMATCH
          - global_constants.MINIMUM_ORDER_CENTS
        distinguishing_aspect: "Every fiscal and referential guard on POST /slot-bookings is a non-strict comparison, so the request that sits exactly on all three bounds succeeds: subtotal exactly 1000 == MINIMUM_ORDER_CENTS, units exactly 2 == total_capacity_units - withheld_units, and the slot's route exactly equal to the customer's home route. The booking is HELD (not WAITLISTED, because available_units was also exactly 2) and the fee is frozen at the pre-booking surge of 1.00 even though the booking itself pushes the slot to 1.35."
