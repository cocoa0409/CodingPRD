  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_seat_limit_priority
        grounds:
          - validations.priority_6_state
          - validations.priority_14_business_fiscal
        distinguishing_aspect: |
          Pair: state vs business_fiscal. A user-accept on an already-ACTIVE
          user AND a seat-limit-breaching plan must surface
          ERR_INVALID_STATE_TRANSITION (priority 6) not ERR_SEAT_LIMIT_REACHED
          (priority 14).
        test_recipe:
          setup:
            - "Plan SIMPLE_START max_seats=1. Company L has its PRIMARY_ADMIN already ACTIVE (occupied=1 = max_seats). A second user was invited but is still INVITED (would be a seat violation when accepting)."
          setup_api_calls:
            - *k_clock
            - *k_plan_simple
            - &k_company_l
              call: "POST /api/companies"
              payload: { legal_name: "Lambda Corp", admin_email: "l@l.example", home_country: "US", data_region: "US", plan_id: "${plan_simple_id}" }
              as: PlatformAdmin
              captures: { company_l_id: $.data.id }
            - &k_company_l_admin
              call: "POST /api/companies/${company_l_id}/users"
              payload: { company_id: "${company_l_id}", email: "admin@l.example", display_name: "L Admin", permission_level: "PRIMARY_ADMIN" }
              as: PlatformAdmin
              captures: { company_l_admin_id: $.data.id }
            - call: "POST /api/companies/${company_l_id}/users/${company_l_admin_id}/accept"
              payload: {}
              as: CompanyUser
              as_user_id: "${company_l_admin_id}"
          trigger:
            # Second accept on already-ACTIVE user violates state machine (priority 6);
            # if state passed, seat-limit would also fire (priority 14).
            # We expect state error to win.
            - call: "POST /api/companies/${company_l_id}/users/${company_l_admin_id}/accept"
              payload: {}
              as: CompanyUser
              as_user_id: "${company_l_admin_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 400"
            - "err_id == ERR_INVALID_STATE_TRANSITION (state priority 6 wins over business_fiscal priority 14)"
            - "err_id != ERR_SEAT_LIMIT_REACHED"

      - name: business_referential_vs_business_temporal_recon_overlap
        grounds:
          - validations.priority_10_business_referential
          - validations.priority_16_business_temporal
        distinguishing_aspect: |
          Pair: business_referential vs business_temporal. A reconciliation
          whose window overlaps an existing COMPLETED recon AND whose statement
          period is malformed (end < start) — referential overlap (priority 10)
          must surface before temporal ordering (priority 16). Different error
          category pair than instance 1.
        test_recipe:
          setup:
            - "Company M with ACTIVE BankConnection and a COMPLETED Reconciliation covering [2026-08-01, 2026-08-31]."
          setup_api_calls:
            - *k_clock
            - *k_plan_plus
            - &k_company_m
