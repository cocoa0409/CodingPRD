            - { call: "POST /placements", payload: { referral_id: "${ref_id}", site_id: "${site_id}", supervisor_id: "${sup_id}" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { plc_id: "$.data.id" } }
            - { call: "POST /work-sessions", payload: { placement_id: "${plc_id}", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T11:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { ws_id: "$.data.id" } }
          trigger:
            - { call: "POST /work-sessions/${ws_id}/check-in", payload: { check_in_at: "2026-06-10T09:00:00Z" }, as: SiteSupervisor, as_user_id: "${sup_id}", captures: { err: "$.data.error_id" } }
