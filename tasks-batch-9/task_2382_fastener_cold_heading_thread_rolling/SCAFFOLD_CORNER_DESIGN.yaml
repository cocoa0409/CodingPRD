              as_user_id: "qm-1"
            - call: "POST /certification-documents"
              payload: { production_lot_id: "${lot_id}", lot_test_id: "${test_id}", cert_serial: "CERT-OCC3", expected_production_lot_version: "${lot_v_read}" }
              as: QualityInspector
              as_user_id: "insp-1"
