            - "Proposal.${prop}.status remains DEPT_REVIEW"
      - name: proposer_self_approval_rejected
        claim_type: role_denial
        grounds:
          - validations[priority=8]
          - errors[ERR_SELF_APPROVAL_FORBIDDEN]
        distinguishing_aspect: "Segregation of duties: an actor whose X-User-ID equals the proposal's proposer_id cannot decide on it even in the correct Registrar role and stage."
