          assert:
            - "CoveragePlan.${plan_id}.required_observer_sea_days == 300 (ceil((1000 - min(0,400)) * 0.30))"
            - "SelectionNotice(${v1_id}).selection_score == 100.0000 (recency 50 + compliance 30 - penalty 0, then * 1.25 gear branch)"
            - "SelectionNotice(${v2_id}).selection_score == 80.0000 (identical inputs but gear_type LONGLINE != priority_gear TRAWL, no multiplier)"
            - "SelectionNotice(${v1_id}).rank == 1 and SelectionNotice(${v2_id}).rank == 2 (score DESC)"
            - "SelectionRun.${run_id}.vessels_selected == 2 and SelectionRun.${run_id}.selection_deficit_sea_days == 240 (max(0, 300 - 30*2))"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine: non-linear shapes on DIFFERENT entities.
  # Instance 1: HarassmentReport cycle UNDER_REVIEW->SUBSTANTIATED->APPEALED->
  # UNDER_REVIEW (appeal loop). Instance 2: Deployment revision loop
  # DEBRIEFING->DATA_REJECTED->DEBRIEFING plus the branching diamond
  # SCHEDULED->{SAFETY_HOLD,READY_TO_DEPLOY}->AT_SEA.
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: harassment_report_appeal_cycle_reenters_under_review
        grounds:
          - state_machines.HarassmentReport.FILED_to_UNDER_REVIEW
          - state_machines.HarassmentReport.UNDER_REVIEW_to_SUBSTANTIATED
          - state_machines.HarassmentReport.SUBSTANTIATED_to_APPEALED
          - state_machines.HarassmentReport.APPEALED_to_UNDER_REVIEW
          - state_machines.HarassmentReport.UNDER_REVIEW_to_DISMISSED
        distinguishing_aspect: |
          HarassmentReport is a CYCLIC machine: UNDER_REVIEW->SUBSTANTIATED->
          APPEALED->UNDER_REVIEW forms a loop (a report can be appealed and
          re-reviewed). After the appeal re-enters UNDER_REVIEW, a dismissal
          triggers the compensation branch (penalty_applied was true ->
          Vessel.selection_penalty_points -= 3). A linear pipeline could not
          re-enter UNDER_REVIEW — the cycle is structurally required.
        test_recipe:
          setup:
            - "Full deployment chain to AT_SEA: fishery F, operator OP, vessel V ACTIVE, observer OBS LEAD, plan published + selection run + notice accepted, deployment D scheduled 2026-09-10..2026-09-19, safety PASS, boarded"
            - "Clock advanced to 2026-09-12 so early termination computes actual_sea_days = 3"
            - "HarassmentReport H filed by OBS on D"
            - "H: FILED -> UNDER_REVIEW -> SUBSTANTIATED (vessel penalty +3 applied, D -> EARLY_TERMINATED) -> APPEALED (by OP) -> UNDER_REVIEW again"
          setup_api_calls:
            - call: "POST /observer-program/fisheries"
              payload: { code: "BSAI-HAR", name: "BSAI Harassment", region: "Bering Sea", coverage_target_pct: 0.30, priority_gear: "TRAWL" }
