            - "Two BAGGED orders of 5000 lb yeast each (total_cents 1526750 apiece), both submitted and allocated."
            - "Route R-BUF-01 for 2026-09-15 with vehicle_capacity_lb 24000 and service_buffer_minutes 30, already carrying order 1 on window 08:00-10:00 (planned_load_lb 5000, utilization_pct 20.83)."
