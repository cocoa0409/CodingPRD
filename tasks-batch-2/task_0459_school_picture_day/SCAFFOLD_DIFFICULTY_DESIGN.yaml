              as: SchoolCoordinator
              captures: { pkgB: $.data.id }
            - call: "POST /api/students"
              payload: { picture_day_session_id: "${sess}", full_name: "Kid Y", grade: "4", homeroom: "Q", guardian_user_id: "g1" }
              as: SchoolCoordinator
              captures: { s1: $.data.id }
