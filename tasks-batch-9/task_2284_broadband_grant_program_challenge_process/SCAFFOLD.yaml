scenario: |
  2284. Broadband Grant Program & Challenge Process (state broadband office): eligible location determination from
  national maps with unserved and underserved definitions, challenge process allowing providers and communities to
  contest location classifications with evidence standards, subgrantee application with technical, financial and
  managerial capability review, scoring criteria across cost per location, speed commitments, affordability and
  workforce plans, award allocation with matching requirements and extremely high cost location thresholds,
  environmental and historic preservation review before construction, milestone-based disbursement with build
  progress verification and location certification, deployment obligations with speed testing, service availability
  audits and clawback for noncompliance

domain_name: broadband-grant-challenge
api_prefix: /broadband

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Peer entities linked by explicit FK fields; every collection is a top-level path segment under
  # /broadband (no ownership nesting in write paths). Sub-resource GETs exist only as FK reverse-reachability
  # read channels, never as the identity of a resource.

  state_machine_shape: cyclic
  # Challenge runs negotiation rounds (UNDER_REVIEW -> REBUTTAL_OPEN -> UNDER_REVIEW) and a
  # DEFICIENT -> SUBMITTED resubmission loop; ComplianceAudit loops
  # CLAWBACK_NOTICE_ISSUED -> APPEALED -> CLAWBACK_NOTICE_ISSUED; Application loops
  # SCORED -> RESCORE_REQUIRED -> SCORED and SUBMITTED -> RETURNED_FOR_CURE -> SUBMITTED;
  # EligibleLocation carries two independent parallel axes (eligibility_state x service_state);
  # EnvironmentalReview is a branching fork with divergent side-effect sets per pathway.

  relationship_patterns:
    - one_to_many
    - many_to_many        # LocationClaim is the Application <-> EligibleLocation junction
    - cross_aggregate     # ComplianceAudit result mutates EligibleLocation.service_state and Subgrantee.capability_state

  role_model: segregation_of_duties
  # Three enforced separations, each on X-User-ID: (1) the analyst who triaged a Challenge may not
  # determine it; (2) the reviewer who determined a Subgrantee's capability may not score that
  # subgrantee's Application; (3) the operator who verified an Award's milestone may not open a
  # ComplianceAudit on that Award.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: GrantProgram
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Program round name.
      - name: fiscal_year
        type: integer
        source: input
        description: Appropriation fiscal year.
      - name: total_appropriation_cents
        type: integer
        source: input
        description: Total federal allocation available to obligate, in cents.
        constraints: "> 0"
      - name: min_match_pct
        type: number
        source: input
        description: Minimum non-federal match percentage an application must offer.
        default: 25.0
        constraints: "0 <= min_match_pct <= 100"
      - name: holdback_pct
        type: number
        source: input
        description: Percentage of obligation withheld until the final milestone is disbursed.
        default: 10.0
      - name: unserved_down_mbps_threshold
        type: number
        source: input
        description: Download speed strictly below which a location is UNSERVED.
        default: 25
      - name: unserved_up_mbps_threshold
        type: number
        source: input
        description: Upload speed strictly below which a location is UNSERVED.
        default: 3
      - name: served_down_mbps_threshold
        type: number
        source: input
        description: Download speed at or above which a location may be SERVED.
        default: 100
      - name: served_up_mbps_threshold
        type: number
        source: input
        description: Upload speed at or above which a location may be SERVED.
        default: 20
      - name: max_latency_ms
        type: integer
        source: input
        description: Latency strictly above which reported service is unreliable and the location is UNSERVED.
        default: 100
      - name: ehcl_threshold_cents
        type: integer
        source: input
        description: Extremely-high-cost-location threshold; a claim strictly above this is EHCL.
        default: 2500000
      - name: ehcl_waiver_enabled
        type: boolean
        source: input
        description: When true, EHCL claims are deferred out of the award at obligation time.
        default: true
      - name: challenge_window_start
        type: datetime
        source: input
        description: Inclusive start of the challenge window.
      - name: challenge_window_end
        type: datetime
        source: input
        description: Exclusive end of the challenge window (half-open [start, end)).
      - name: application_window_start
        type: datetime
        source: input
        description: Inclusive start of the subgrantee application window.
      - name: application_window_end
        type: datetime
        source: input
        description: Exclusive end of the application window (half-open [start, end)).
      - name: program_state
        type: enum
        source: system
        description: Program phase.
        default: DRAFT
        constraints: "DRAFT | CHALLENGE_OPEN | CHALLENGE_CLOSED | SCORING | ALLOCATION_CLOSED"
      - name: scoring_posture
        type: enum
        source: computed
        description: >-
          Derived gate over allocation writes. FROZEN when program_state IN {DRAFT, CHALLENGE_OPEN};
          RESTRICTED when program_state IN {CHALLENGE_CLOSED, SCORING} AND stale_score_sheet_count >= 1;
          OPEN otherwise. Recomputed by calculations.program_scoring_posture.
        default: FROZEN
        constraints: "OPEN | RESTRICTED | FROZEN"
      - name: stale_score_sheet_count
        type: integer
        source: computed
        description: Count of ScoreSheet rows for this program with score_state == STALE.
        default: 0
      - name: location_count_total
        type: integer
        source: computed
        description: Count of EligibleLocation rows with this program_id (all eligibility_state values).
        default: 0
      - name: uncommitted_balance_cents
        type: integer
        source: computed
        description: total_appropriation_cents - sum(OBLIGATION) + sum(DEOBLIGATION) + sum(CLAWBACK_RECOVERY) over LedgerEntry.
      - name: obligated_balance_cents
        type: integer
        source: computed
        description: sum(OBLIGATION) - sum(DEOBLIGATION) - sum(DISBURSEMENT) over LedgerEntry rows of this program's awards.
        default: 0
      - name: disbursed_balance_cents
        type: integer
        source: computed
        description: sum(DISBURSEMENT) - sum(CLAWBACK_RECOVERY) over LedgerEntry rows of this program's awards.
        default: 0

  - name: EligibleLocation
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> GrantProgram.id; the program whose eligible-location inventory holds this row.
      - name: address_id
        type: string
        source: input
        description: National-map broadband serviceable location identifier; unique per program_id.
      - name: reported_down_mbps
        type: number
        source: input
        description: Download speed reported on the national map.
      - name: reported_up_mbps
        type: number
        source: input
        description: Upload speed reported on the national map.
      - name: reported_latency_ms
        type: integer
        source: input
        description: Round-trip latency reported on the national map.
      - name: reported_technology
        type: enum
        source: input
        description: Reported access technology.
        constraints: "FIBER | CABLE | DSL | LICENSED_FIXED_WIRELESS | UNLICENSED_FIXED_WIRELESS | GEOSTATIONARY_SATELLITE | LEO_SATELLITE"
      - name: reporting_provider_user_id
        type: string
        source: input
        description: Opaque operator id of the provider that reported this service; the only Provider X-User-ID permitted to file rebuttal evidence on challenges against this location.
      - name: classification_status
        type: enum
        source: computed
        description: Eligibility class from calculations.location_classification (or from a sustained challenge).
        constraints: "SERVED | UNDERSERVED | UNSERVED"
      - name: classification_source
        type: enum
        source: computed
        description: Provenance of classification_status.
        default: NATIONAL_MAP
        constraints: "NATIONAL_MAP | CHALLENGE_DETERMINATION"
      - name: eligibility_state
        type: enum
        source: system
        description: Axis A of the parallel state machine (map/challenge/allocation lifecycle).
        default: MAPPED
        constraints: "MAPPED | CHALLENGED | AFFIRMED | RECLASSIFIED | AWARD_BOUND | DEFERRED_HIGH_COST"
      - name: service_state
        type: enum
        source: system
        description: Axis B of the parallel state machine (physical deployment lifecycle); evolves independently of eligibility_state.
        default: NOT_BUILT
        constraints: "NOT_BUILT | UNDER_CONSTRUCTION | SERVICE_AVAILABLE | CERTIFIED | AUDIT_FAILED"
      - name: awarded_award_id
        type: string
        source: computed
        description: FK -> Award.id; set when the location becomes AWARD_BOUND, cleared to null on award termination.
        default: null
      - name: challenge_count
        type: integer
        source: computed
        description: Count of Challenge rows with this location_id and challenge_state != WITHDRAWN.
        default: 0
      - name: certified_at
        type: datetime
        source: computed
        description: Logical-clock instant at which service_state became CERTIFIED; null while not certified.
        default: null

  - name: Challenge
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> GrantProgram.id; program whose challenge window governs this challenge.
      - name: location_id
        type: string
        source: input
        description: FK -> EligibleLocation.id; the location whose classification is contested.
      - name: challenger_type
        type: enum
        source: input
        description: Party class of the challenger; selects the evidence standard.
        constraints: "PROVIDER | COMMUNITY | LOCAL_GOVERNMENT | NONPROFIT"
      - name: asserted_classification
        type: enum
        source: input
        description: Classification the challenger asserts is correct.
        constraints: "SERVED | UNDERSERVED | UNSERVED"
      - name: rationale
        type: string
        source: input
        description: Narrative basis for the challenge.
      - name: submitter_user_id
        type: string
        source: system
        description: X-User-ID of the Challenger that filed this challenge; only this id may append CHALLENGE-side evidence or resubmit.
      - name: challenge_state
        type: enum
        source: system
        description: Challenge lifecycle state.
        default: SUBMITTED
        constraints: "SUBMITTED | REBUTTAL_OPEN | UNDER_REVIEW | SUSTAINED | REJECTED | DEFICIENT"
      - name: evidence_sufficiency_score
        type: number
        source: computed
        description: Sum of weighted_value over ChallengeEvidence rows with submitter_side == CHALLENGE and evidence_state == ACCEPTED.
        default: 0
      - name: rebuttal_strength_score
        type: number
        source: computed
        description: Sum of weighted_value over ChallengeEvidence rows with submitter_side == REBUTTAL and evidence_state == ACCEPTED.
        default: 0
      - name: required_sufficiency_threshold
        type: number
        source: computed
        description: 60.00 when challenger_type == PROVIDER, else 40.00.
      - name: distinct_evidence_type_count
        type: integer
        source: computed
        description: Count of distinct evidence_type values over ChallengeEvidence rows with submitter_side == CHALLENGE and evidence_state == ACCEPTED.
        default: 0
      - name: rebuttal_round
        type: integer
        source: system
        description: Number of rebuttal rounds opened; capped at MAX_REBUTTAL_ROUNDS.
        default: 0
      - name: rebuttal_deadline
        type: datetime
        source: computed
        description: Logical-clock instant at or after which the open rebuttal round may be closed; null before triage.
        default: null
      - name: resubmission_count
        type: integer
        source: system
        description: Number of DEFICIENT -> SUBMITTED resubmissions; capped at 1.
        default: 0
      - name: triaged_by_user_id
        type: string
        source: system
        description: X-User-ID of the EligibilityAnalyst that triaged this challenge; barred from determining it.
        default: null
      - name: determined_by_user_id
        type: string
        source: system
        description: X-User-ID of the EligibilityAnalyst that recorded the determination.
        default: null
      - name: outcome
        type: enum
        source: computed
        description: Terminal determination recorded by the determine transition; null before determination.
        default: null
        constraints: "SUSTAINED | REJECTED | DEFICIENT"

  - name: ChallengeEvidence
    parent: null
    common_fields: false
    fields:
      - name: challenge_id
        type: string
        source: input
        description: FK -> Challenge.id; the challenge this evidence item belongs to.
      - name: evidence_type
        type: enum
        source: input
        description: Evidence class; selects base_weight from calculations.challenge_evidence_sufficiency constants.
        constraints: "SPEED_TEST | SUBSCRIBER_BILL | SERVICE_DENIAL_LETTER | FIELD_SURVEY | PROVIDER_ATTESTATION | MAP_DATA_EXPORT | CONSTRUCTION_PERMIT_RECORD"
      - name: collected_at
        type: datetime
        source: input
        description: Instant the evidence was collected; drives recency_multiplier.
      - name: description
        type: string
        source: input
        description: Free-text description of the artifact.
      - name: submitter_side
        type: enum
        source: computed
        description: CHALLENGE when X-User-ID equals challenge.submitter_user_id, REBUTTAL for any other permitted caller; derived from identity, never from the caller's role.
        constraints: "CHALLENGE | REBUTTAL"
      - name: submitter_user_id
        type: string
        source: system
        description: X-User-ID of the caller that appended this item.
      - name: base_weight
        type: number
        source: computed
        description: EVIDENCE_WEIGHTS[evidence_type].
      - name: recency_multiplier
        type: number
        source: computed
        description: 1.0 when age_days <= 180, 0.5 when 181 <= age_days <= 365, 0 when age_days > 365, where age_days = floor((challenge.created_at - collected_at) / 86400s).
      - name: weighted_value
        type: number
        source: computed
        description: round_half_up(base_weight * recency_multiplier, 2).
      - name: evidence_state
        type: enum
        source: computed
        description: ACCEPTED when recency_multiplier > 0, STALE_EXCLUDED when recency_multiplier == 0.
        constraints: "ACCEPTED | STALE_EXCLUDED"

  - name: Subgrantee
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> GrantProgram.id; the program this applicant is registered under.
      - name: legal_name
        type: string
        source: input
        description: Legal entity name.
      - name: ein
        type: string
        source: input
        description: Employer identification number as reported by the applicant.
      - name: net_assets_cents
        type: integer
        source: input
        description: Unaudited net assets declared at registration; input to the INITIAL financial component.
      - name: requested_amount_cents
        type: integer
        source: input
        description: Grant amount the applicant declares it will request; denominator basis of the financial component.
        constraints: "> 0"
      - name: key_personnel_count
        type: integer
        source: input
        description: Declared count of key managerial personnel.
      - name: has_prior_federal_award
        type: boolean
        source: input
        description: Whether the applicant has administered a prior federal broadband award.
        default: false
      - name: audited_net_assets_cents
        type: integer
        source: system
        description: Audited restatement supplied with a remediation submission; input to the REMEDIATION financial component.
        default: null
      - name: withdrawn_personnel_count
        type: integer
        source: system
        description: Key personnel withdrawn as disclosed in the remediation submission.
        default: 0
      - name: technical_raw_score
        type: number
        source: system
        description: Raw technical capability score recorded by the reviewer at determination time.
        default: null
      - name: review_variant
        type: enum
        source: computed
        description: Which variant of calculations.subgrantee_capability_index applies to the pending determination.
        default: INITIAL
        constraints: "INITIAL | REMEDIATION"
      - name: technical_component
        type: number
        source: computed
        description: Technical sub-score, max 40.00.
        default: null
      - name: financial_component
        type: number
        source: computed
        description: Financial sub-score, max 35.00.
        default: null
      - name: managerial_component
        type: number
        source: computed
        description: Managerial sub-score, max 25.00.
        default: null
      - name: capability_index
        type: number
        source: computed
        description: technical_component + financial_component + managerial_component, 2dp.
        default: null
      - name: capability_state
        type: enum
        source: system
        description: Capability review lifecycle state.
        default: REGISTERED
        constraints: "REGISTERED | UNDER_CAPABILITY_REVIEW | QUALIFIED | REMEDIATION_REQUIRED | DISQUALIFIED | SUSPENDED"
      - name: capability_reviewer_user_id
        type: string
        source: system
        description: X-User-ID of the CapabilityReviewer that opened the review; barred from scoring this applicant's applications.
        default: null
      - name: remediation_count
        type: integer
        source: system
        description: Number of remediation submissions; capped at 1.
        default: 0
      - name: open_noncompliance_count
        type: integer
        source: computed
        description: Count of this applicant's awards with compliance_state == NONCOMPLIANT.
        default: 0

  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> GrantProgram.id; the program round applied to.
      - name: subgrantee_id
        type: string
        source: input
        description: FK -> Subgrantee.id; the applicant. Must equal X-User-ID when the caller role is Subgrantee.
      - name: match_offer_pct
        type: number
        source: input
        description: Non-federal match percentage offered.
      - name: committed_down_mbps
        type: number
        source: input
        description: Committed download speed at every awarded location.
      - name: committed_up_mbps
        type: number
        source: input
        description: Committed upload speed at every awarded location.
      - name: committed_latency_ms
        type: integer
        source: input
        description: Committed round-trip latency at every awarded location.
      - name: low_cost_plan_price_cents
        type: integer
        source: input
        description: Monthly price of the proposed low-cost service option.
      - name: participates_in_state_affordability_program
        type: boolean
        source: input
        description: Whether the applicant will honor the state affordability subsidy.
        default: false
      - name: has_dbe_plan
        type: boolean
        source: input
        description: Whether a disadvantaged-business-enterprise plan is attached.
        default: false
      - name: has_union_agreement
        type: boolean
        source: input
        description: Whether a project labor agreement is attached.
        default: false
      - name: local_hire_pct
        type: number
        source: input
        description: Percentage of construction hours committed to local hires.
        default: 0
      - name: proposed_construction_start
        type: datetime
        source: input
        description: Inclusive start of the proposed construction window.
      - name: proposed_construction_end
        type: datetime
        source: input
        description: Exclusive end of the proposed construction window (half-open [start, end)).
      - name: application_state
        type: enum
        source: system
        description: Application lifecycle state.
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | RETURNED_FOR_CURE | SCORED | RESCORE_REQUIRED | SELECTED | AWARDED | NOT_SELECTED"
      - name: claim_count
        type: integer
        source: computed
        description: Count of LocationClaim rows for this application with claim_state IN {CLAIMED_ELIGIBLE, CLAIMED_INELIGIBLE, AWARD_BOUND, EHCL_DEFERRED}.
        default: 0
      - name: confirmed_location_count
        type: integer
        source: computed
        description: Count of LocationClaim rows for this application with claim_state IN {CLAIMED_ELIGIBLE, AWARD_BOUND}.
        default: 0
      - name: total_project_cost_cents
        type: integer
        source: computed
        description: Sum of claimed_cost_cents over LocationClaim rows with claim_state IN {CLAIMED_ELIGIBLE, CLAIMED_INELIGIBLE, AWARD_BOUND, EHCL_DEFERRED}.
        default: 0
      - name: eligible_project_cost_cents
        type: integer
        source: computed
        description: Sum of claimed_cost_cents over LocationClaim rows with claim_state IN {CLAIMED_ELIGIBLE, AWARD_BOUND}.
        default: 0
      - name: preliminary_cost_per_location_cents
        type: integer
        source: computed
        description: PRELIMINARY variant of calculations.application_cost_per_location; stamped at submit.
        default: null
      - name: final_cost_per_location_cents
        type: integer
        source: computed
        description: FINAL variant of calculations.application_cost_per_location; stamped at submit and recomputed whenever a claim's claim_state changes.
        default: null
      - name: current_total_score
        type: number
        source: computed
        description: total_score of the ScoreSheet for this application with score_state == FINAL; null when none.
        default: null
      - name: returned_for_cure_count
        type: integer
        source: system
        description: Number of SUBMITTED -> RETURNED_FOR_CURE transitions; capped at 1.
        default: 0
      - name: rescore_required_reason
        type: string
        source: computed
        description: Reason string stamped when the application is driven to RESCORE_REQUIRED by a cascade.
        default: null

  - name: LocationClaim
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> Application.id; the application claiming the location.
      - name: location_id
        type: string
        source: input
        description: FK -> EligibleLocation.id; the claimed location.
      - name: claimed_cost_cents
        type: integer
        source: input
        description: Deployment cost the applicant attributes to this single location.
        constraints: "> 0"
      - name: claim_state
        type: enum
        source: system
        description: >-
          Claim lifecycle. Set at creation to CLAIMED_ELIGIBLE when
          location.classification_status IN {UNSERVED, UNDERSERVED}, else CLAIMED_INELIGIBLE.
        default: CLAIMED_INELIGIBLE
        constraints: "CLAIMED_ELIGIBLE | CLAIMED_INELIGIBLE | AWARD_BOUND | EHCL_DEFERRED | RELEASED"
      - name: is_ehcl
        type: boolean
        source: computed
        description: True when claimed_cost_cents > program.ehcl_threshold_cents (strict), evaluated at award obligation.
        default: false
      - name: match_share_cents
        type: integer
        source: computed
        description: Per-location match share, round_half_up(claimed_cost_cents * program.min_match_pct / 100, 0); stamped at award obligation.
        default: null

  - name: ScoreSheet
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> Application.id; the scored application.
      - name: scored_by_user_id
        type: string
        source: system
        description: X-User-ID of the ScoringOfficer that produced this sheet.
      - name: cost_points
        type: number
        source: computed
        description: Cost-per-location tier points, max 30.00.
      - name: speed_points
        type: number
        source: computed
        description: Speed-commitment points, max 30.00.
      - name: affordability_points
        type: number
        source: computed
        description: Affordability points, max 20.00.
      - name: workforce_points
        type: number
        source: computed
        description: Workforce-plan points, max 20.00.
      - name: capability_multiplier
        type: number
        source: computed
        description: 1.05 when subgrantee.capability_index >= 90.00, else 1.00.
      - name: total_score
        type: number
        source: computed
        description: calculations.application_total_score output, 2dp, capped at 100.00.
      - name: basis_final_cost_per_location_cents
        type: integer
        source: computed
        description: Snapshot of application.final_cost_per_location_cents at scoring time.
      - name: basis_confirmed_location_count
        type: integer
        source: computed
        description: Snapshot of application.confirmed_location_count at scoring time.
      - name: score_state
        type: enum
        source: system
        description: Sheet validity.
        default: FINAL
        constraints: "FINAL | STALE | SUPERSEDED"

  - name: Award
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> Application.id; the selected application being obligated.
      - name: award_state
        type: enum
        source: system
        description: Award lifecycle state.
        default: OBLIGATED
        constraints: "OBLIGATED | CONSTRUCTION_AUTHORIZED | IN_CONSTRUCTION | CLOSED | TERMINATED"
      - name: compliance_state
        type: enum
        source: system
        description: Deployment-obligation posture; gates milestone progression.
        default: COMPLIANT
        constraints: "COMPLIANT | NONCOMPLIANT | CURED"
      - name: confirmed_location_count
        type: integer
        source: computed
        description: Count of LocationClaim rows for the application with claim_state == AWARD_BOUND.
      - name: total_eligible_cost_cents
        type: integer
        source: computed
        description: Sum of claimed_cost_cents over AWARD_BOUND claims (post EHCL deferral).
      - name: match_requirement_cents
        type: integer
        source: computed
        description: calculations.award_match_requirement output (per-location rounding then sum).
      - name: obligation_amount_cents
        type: integer
        source: computed
        description: total_eligible_cost_cents - match_requirement_cents.
      - name: holdback_cap_cents
        type: integer
        source: computed
        description: round_half_up(obligation_amount_cents * (100 - program.holdback_pct) / 100, 0); cumulative cap before the final milestone.
      - name: final_per_location_cost_cents
        type: integer
        source: computed
        description: round_half_up(total_eligible_cost_cents / confirmed_location_count, 0), frozen at obligation.
      - name: ehcl_deferred_count
        type: integer
        source: computed
        description: Count of claims moved to EHCL_DEFERRED at obligation.
        default: 0
      - name: disbursed_to_date_cents
        type: integer
        source: computed
        description: Sum of DISBURSEMENT LedgerEntry amounts minus CLAWBACK_RECOVERY amounts for this award.
        default: 0
      - name: certified_location_count
        type: integer
        source: computed
        description: Count of this award's locations with service_state == CERTIFIED.
        default: 0
      - name: failed_location_count
        type: integer
        source: computed
        description: Count of this award's locations with service_state == AUDIT_FAILED.
        default: 0
      - name: last_verifier_user_id
        type: string
        source: system
        description: X-User-ID of the caller (AuditOfficer or ProgramAdmin) that most recently verified a milestone on this award; barred by priority 32(c) from calling record-result or verify-remediation on it.
        default: null
      - name: terminated_reason
        type: string
        source: system
        description: Reason stamped when award_state becomes TERMINATED.
        default: null

  - name: EnvironmentalReview
    parent: null
    common_fields: true
    fields:
      - name: award_id
        type: string
        source: input
        description: FK -> Award.id; the award whose construction this review gates.
      - name: ehp_state
        type: enum
        source: system
        description: Environmental and historic preservation review state.
        default: SCREENING
        constraints: "SCREENING | CATEGORICAL_EXCLUSION | EA_REQUIRED | MITIGATION_REQUIRED | CLEARED | BLOCKED"
      - name: pathway
        type: enum
        source: computed
        description: Most recent determination pathway recorded by the reviewer.
        default: null
        constraints: "CATEGORICAL_EXCLUSION | EA_REQUIRED | MITIGATION_PLAN_ACCEPTED | ADVERSE_EFFECT"
      - name: tribal_consultation_required
        type: boolean
        source: input
        description: Whether tribal consultation is in scope for this award footprint.
        default: false
      - name: shpo_consultation_required
        type: boolean
        source: input
        description: Whether State Historic Preservation Office consultation is in scope.
        default: false
      - name: mitigation_summary
        type: string
        source: system
        description: Mitigation commitments recorded with a MITIGATION_PLAN_ACCEPTED determination.
        default: null
      - name: cleared_by_user_id
        type: string
        source: system
        description: X-User-ID of the EnvironmentalReviewer that cleared the review.
        default: null
      - name: cleared_at
        type: datetime
        source: computed
        description: Logical-clock instant of clearance; null while ehp_state != CLEARED.
        default: null

  - name: Milestone
    parent: null
    common_fields: true
    fields:
      - name: award_id
        type: string
        source: input
        description: FK -> Award.id; the award this milestone draws against.
      - name: sequence_no
        type: integer
        source: input
        description: Ordinal position in the build plan; unique per award_id.
        constraints: ">= 1"
      - name: description
        type: string
        source: input
        description: Build-plan milestone description.
      - name: evidence_basis
        type: enum
        source: input
        description: Selects the calculations.milestone_disbursement_amount variant.
        constraints: "BUILD_PROGRESS | INVOICED_COST"
      - name: planned_location_ids
        type: array
        source: input
        description: EligibleLocation ids in this milestone's scope; each must be AWARD_BOUND on this award.
      - name: is_final
        type: boolean
        source: input
        description: When true, approval releases the holdback and closes the award.
        default: false
      - name: milestone_state
        type: enum
        source: system
        description: Milestone lifecycle state.
        default: PLANNED
        constraints: "PLANNED | EVIDENCE_SUBMITTED | APPROVED | REJECTED | HELD | DISBURSED | VOIDED"
      - name: built_location_ids
        type: array
        source: system
        description: Location ids the subgrantee asserts are built, as submitted with evidence.
        default: []
      - name: invoiced_cost_cents
        type: integer
        source: system
        description: Invoiced construction cost submitted with evidence; required when evidence_basis == INVOICED_COST.
        default: null
      - name: verified_location_count
        type: integer
        source: computed
        description: Count of location ids the verifier confirmed built.
        default: 0
      - name: payable_amount_cents
        type: integer
        source: computed
        description: calculations.milestone_disbursement_amount output, stamped at verification approval and zeroed when HELD.
        default: 0
      - name: verified_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProgramAdmin that verified build progress.
        default: null
      - name: resubmission_count
        type: integer
        source: system
        description: Number of REJECTED -> EVIDENCE_SUBMITTED resubmissions; capped at 2.
        default: 0
      - name: rejection_reason
        type: string
        source: system
        description: Reason stamped on rejection.
        default: null

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: award_id
        type: string
        source: input
        description: FK -> Award.id; the award whose fiscal movement this immutable entry records.
      - name: entry_type
        type: enum
        source: system
        description: Fiscal movement class.
        constraints: "OBLIGATION | DISBURSEMENT | DEOBLIGATION | CLAWBACK_RECOVERY"
      - name: amount_cents
        type: integer
        source: system
        description: Positive magnitude of the movement; sign semantics come from entry_type.
        constraints: "> 0"
      - name: source_reference
        type: string
        source: system
        description: Free-text handle of the triggering object (milestone sequence, audit window, termination reason).
      - name: program_uncommitted_after_cents
        type: integer
        source: system
        description: Snapshot of program.uncommitted_balance_cents immediately after this entry was appended.
      - name: memo
        type: string
        source: system
        description: Audit memo.

  - name: ComplianceAudit
    parent: null
    common_fields: true
    fields:
      - name: award_id
        type: string
        source: input
        description: FK -> Award.id; the award under deployment-obligation audit.
      - name: audit_type
        type: enum
        source: input
        description: Audit scope.
        constraints: "SPEED_TEST | SERVICE_AVAILABILITY | COMBINED"
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the field observation window (closed interval).
      - name: window_end
        type: datetime
        source: input
        description: Inclusive end of the field observation window (closed interval).
      - name: auditor_user_id
        type: string
        source: system
        description: X-User-ID of the AuditOfficer that scheduled this audit.
      - name: audit_state
        type: enum
        source: system
        description: Audit and clawback lifecycle state.
        default: SCHEDULED
        constraints: "SCHEDULED | PASSED | FAILED | REMEDIATED | CLAWBACK_NOTICE_ISSUED | APPEALED | CLAWBACK_SETTLED | CLAWBACK_WAIVED"
      - name: tested_location_count
        type: integer
        source: computed
        description: Count of per-location results submitted with the recorded result.
        default: 0
      - name: failed_location_ids
        type: array
        source: system
        description: Location ids whose measured performance missed the award's committed speeds or latency.
        default: []
      - name: failed_location_count
        type: integer
        source: computed
        description: Length of failed_location_ids.
        default: 0
      - name: noncompliant_share
        type: number
        source: computed
        description: failed_location_count / award.confirmed_location_count, 4dp.
        default: null
      - name: penalty_multiplier
        type: number
        source: computed
        description: Tiered multiplier from calculations.clawback_recovery_amount.
        default: null
      - name: recovery_amount_cents
        type: integer
        source: computed
        description: calculations.clawback_recovery_amount output, stamped when the clawback notice is issued.
        default: null
      - name: settled_amount_cents
        type: integer
        source: computed
        description: Amount actually recovered at resolution; equals recovery_amount_cents when SETTLED, 0 when WAIVED.
        default: null
      - name: appeal_count
        type: integer
        source: system
        description: Number of CLAWBACK_NOTICE_ISSUED -> APPEALED transitions; capped at 2.
        default: 0
      - name: notice_issued_by_user_id
        type: string
        source: system
        description: X-User-ID of the AuditOfficer that issued the most recent clawback notice.
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: GrantProgram
    state_field: program_state
    initial_state: DRAFT
    terminal_states: [ALLOCATION_CLOSED]
    transitions:
      - from: DRAFT
        to: CHALLENGE_OPEN
        trigger: "POST /broadband/programs/{id}/open-challenge-window"
        actor: ProgramAdmin
        preconditions:
          - "program_state == DRAFT"
          - "location_count_total >= 1"
          - "challenge_window_start <= clock.now < challenge_window_end"
        side_effects:
          - "scoring_posture recomputed by calculations.program_scoring_posture -> FROZEN (program_state == CHALLENGE_OPEN)"
      - from: CHALLENGE_OPEN
        to: CHALLENGE_CLOSED
        trigger: "POST /broadband/programs/{id}/close-challenge-window"
        actor: ProgramAdmin
        preconditions:
          - "program_state == CHALLENGE_OPEN"
          - "clock.now >= challenge_window_end"
          - "no Challenge with this program_id has challenge_state == SUBMITTED"
        side_effects:
          - "every Challenge with this program_id and challenge_state == REBUTTAL_OPEN is auto-advanced to UNDER_REVIEW (rebuttal_deadline is forced to clock.now)"
          - "every EligibleLocation with this program_id and eligibility_state == MAPPED moves to AFFIRMED (classification_source stays NATIONAL_MAP)"
          - "scoring_posture recomputed -> RESTRICTED when stale_score_sheet_count >= 1, else OPEN"
      - from: CHALLENGE_CLOSED
        to: SCORING
        trigger: "POST /broadband/programs/{id}/open-scoring"
        actor: ProgramAdmin
        preconditions:
          - "program_state == CHALLENGE_CLOSED"
          - "clock.now >= application_window_end"
          - "no Challenge with this program_id has challenge_state IN {SUBMITTED, REBUTTAL_OPEN}; a challenge left UNDER_REVIEW is allowed through, which is what makes a late determination cascade into scoring"
        side_effects:
          - "scoring_posture recomputed -> RESTRICTED when stale_score_sheet_count >= 1, else OPEN"
      - from: SCORING
        to: ALLOCATION_CLOSED
        trigger: "POST /broadband/programs/{id}/close-allocation"
        actor: ProgramAdmin
        preconditions:
          - "program_state == SCORING"
          - "no Application with this program_id has application_state == SELECTED"
        side_effects:
          - "every Application with this program_id and application_state IN {DRAFT, SUBMITTED, RETURNED_FOR_CURE, SCORED, RESCORE_REQUIRED} moves to NOT_SELECTED"
          - "each Application moved to NOT_SELECTED releases its LocationClaim rows: claim_state IN {CLAIMED_ELIGIBLE, CLAIMED_INELIGIBLE} -> RELEASED"
          - "scoring_posture recomputed -> FROZEN"

  - entity: EligibleLocation
    state_field: eligibility_state
    note: "Axis A of a parallel state machine on EligibleLocation; evolves independently of service_state."
    initial_state: MAPPED
    terminal_states: [DEFERRED_HIGH_COST]
    transitions:
      - from: MAPPED
        to: CHALLENGED
        trigger: "POST /broadband/challenges/{id}/triage"
        actor: EligibilityAnalyst
        preconditions:
          - "eligibility_state == MAPPED"
          - "challenge.challenge_state == SUBMITTED"
        side_effects:
          - "challenge_count += 1"
      - from: CHALLENGED
        to: RECLASSIFIED
        trigger: "POST /broadband/challenges/{id}/determine with outcome == SUSTAINED"
        actor: EligibilityAnalyst
        preconditions:
          - "eligibility_state == CHALLENGED"
          - "challenge.challenge_state == UNDER_REVIEW"
        side_effects:
          - "classification_status := challenge.asserted_classification; classification_source := CHALLENGE_DETERMINATION"
          - "hop 2 of the sustain cascade: because classification_status now IN {UNSERVED, UNDERSERVED}, every LocationClaim on this location with claim_state == CLAIMED_INELIGIBLE flips to CLAIMED_ELIGIBLE and its Application's confirmed_location_count, eligible_project_cost_cents and final_cost_per_location_cents are recomputed"
      - from: CHALLENGED
        to: AFFIRMED
        trigger: "POST /broadband/challenges/{id}/determine with outcome IN {REJECTED, DEFICIENT}"
        actor: EligibilityAnalyst
        preconditions:
          - "eligibility_state == CHALLENGED"
          - "challenge.challenge_state == UNDER_REVIEW"
        side_effects:
          - "classification_status and classification_source unchanged"
      - from: AFFIRMED
        to: CHALLENGED
        trigger: "POST /broadband/challenges/{id}/resubmit"
        actor: Challenger
        preconditions:
          - "eligibility_state == AFFIRMED"
          - "challenge.challenge_state == DEFICIENT"
        side_effects:
          - "challenge_count unchanged (the same challenge re-enters review)"
      - from: MAPPED
        to: AFFIRMED
        trigger: "system: GrantProgram CHALLENGE_OPEN -> CHALLENGE_CLOSED"
        actor: system
        preconditions:
          - "eligibility_state == MAPPED"
        side_effects: []
      - from: AFFIRMED
        to: AWARD_BOUND
        trigger: "POST /broadband/awards"
        actor: ProgramAdmin
        preconditions:
          - "eligibility_state == AFFIRMED"
          - "a LocationClaim on this location for the obligated application has claim_state == CLAIMED_ELIGIBLE"
          - "claimed_cost_cents <= program.ehcl_threshold_cents OR program.ehcl_waiver_enabled == false"
        side_effects:
          - "awarded_award_id := the created Award.id"
      - from: RECLASSIFIED
        to: AWARD_BOUND
        trigger: "POST /broadband/awards"
        actor: ProgramAdmin
        preconditions:
          - "eligibility_state == RECLASSIFIED"
          - "a LocationClaim on this location for the obligated application has claim_state == CLAIMED_ELIGIBLE"
          - "claimed_cost_cents <= program.ehcl_threshold_cents OR program.ehcl_waiver_enabled == false"
        side_effects:
          - "awarded_award_id := the created Award.id"
      - from: AFFIRMED
        to: DEFERRED_HIGH_COST
        trigger: "POST /broadband/awards with program.ehcl_waiver_enabled == true"
        actor: ProgramAdmin
        preconditions:
          - "eligibility_state == AFFIRMED"
          - "the claim's claimed_cost_cents > program.ehcl_threshold_cents (strict)"
        side_effects:
          - "the LocationClaim moves to EHCL_DEFERRED and is excluded from the award's cost and match basis"
      - from: AWARD_BOUND
        to: AFFIRMED
        trigger: "POST /broadband/awards/{id}/terminate"
        actor: ProgramAdmin
        preconditions:
          - "eligibility_state == AWARD_BOUND"
        side_effects:
          - "awarded_award_id := null (compensating revert: the location returns to the eligible pool)"

  - entity: EligibleLocation
    state_field: service_state
    note: "Axis B of the parallel state machine on EligibleLocation; a location can be AWARD_BOUND while still NOT_BUILT, and can reach CERTIFIED without its eligibility_state ever changing again."
    initial_state: NOT_BUILT
    terminal_states: []
    transitions:
      - from: NOT_BUILT
        to: UNDER_CONSTRUCTION
        trigger: "POST /broadband/awards/{id}/authorize-construction"
        actor: ProgramAdmin
        preconditions:
          - "service_state == NOT_BUILT"
          - "eligibility_state == AWARD_BOUND"
        side_effects: []
      - from: UNDER_CONSTRUCTION
        to: SERVICE_AVAILABLE
        trigger: "POST /broadband/awards/{id}/milestones/{milestoneId}/verify with outcome == APPROVED"
        actor: ProgramAdmin
        preconditions:
          - "service_state == UNDER_CONSTRUCTION"
          - "location id appears in the verifier-confirmed list"
        side_effects: []
      - from: SERVICE_AVAILABLE
        to: CERTIFIED
        trigger: "POST /broadband/awards/{id}/milestones/{milestoneId}/disburse"
        actor: ProgramAdmin
        preconditions:
          - "service_state == SERVICE_AVAILABLE"
          - "milestone_state == APPROVED"
        side_effects:
          - "certified_at := clock.now; award.certified_location_count recomputed"
      - from: SERVICE_AVAILABLE
        to: AUDIT_FAILED
        trigger: "POST /broadband/awards/{id}/compliance-audits/{auditId}/record-result with result == FAILED"
        actor: AuditOfficer
        preconditions:
          - "service_state == SERVICE_AVAILABLE"
          - "location id appears in failed_location_ids"
        side_effects:
          - "hop 1 of the audit cascade: award.compliance_state COMPLIANT -> NONCOMPLIANT and award.failed_location_count recomputed"
      - from: CERTIFIED
        to: AUDIT_FAILED
        trigger: "POST /broadband/awards/{id}/compliance-audits/{auditId}/record-result with result == FAILED"
        actor: AuditOfficer
        preconditions:
          - "service_state == CERTIFIED"
          - "location id appears in failed_location_ids"
        side_effects:
          - "certified_at := null; award.certified_location_count recomputed"
          - "hop 1 of the audit cascade: award.compliance_state COMPLIANT -> NONCOMPLIANT and award.failed_location_count recomputed"
      - from: AUDIT_FAILED
        to: SERVICE_AVAILABLE
        trigger: "POST /broadband/awards/{id}/compliance-audits/{auditId}/verify-remediation"
        actor: AuditOfficer
        preconditions:
          - "service_state == AUDIT_FAILED"
          - "audit.audit_state == FAILED"
        side_effects:
          - "award.compliance_state NONCOMPLIANT -> CURED; award.failed_location_count recomputed"

  - entity: Challenge
    state_field: challenge_state
    initial_state: SUBMITTED
    terminal_states: [SUSTAINED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: REBUTTAL_OPEN
        trigger: "POST /broadband/challenges/{id}/triage"
        actor: EligibilityAnalyst
        preconditions:
          - "challenge_state == SUBMITTED"
          - "program.program_state IN {CHALLENGE_OPEN, CHALLENGE_CLOSED, SCORING}"
          - "evidence_sufficiency_score >= required_sufficiency_threshold"
          - "challenger_type == PROVIDER implies at least one ACCEPTED CHALLENGE-side item of evidence_type IN {PROVIDER_ATTESTATION, MAP_DATA_EXPORT}"
          - "challenger_type IN {COMMUNITY, LOCAL_GOVERNMENT, NONPROFIT} implies distinct_evidence_type_count >= 2"
        side_effects:
          - "rebuttal_round := 1; rebuttal_deadline := clock.now + REBUTTAL_WINDOW_DAYS; triaged_by_user_id := X-User-ID"
          - "location.eligibility_state MAPPED -> CHALLENGED and location.challenge_count += 1"
      - from: REBUTTAL_OPEN
        to: UNDER_REVIEW
        trigger: "POST /broadband/challenges/{id}/close-rebuttal"
        actor: EligibilityAnalyst
        preconditions:
          - "challenge_state == REBUTTAL_OPEN"
          - "clock.now >= rebuttal_deadline OR rebuttal_strength_score > 0"
        side_effects:
          - "rebuttal_strength_score frozen for this round"
      - from: UNDER_REVIEW
        to: REBUTTAL_OPEN
        trigger: "POST /broadband/challenges/{id}/request-additional-evidence"
        actor: EligibilityAnalyst
        preconditions:
          - "challenge_state == UNDER_REVIEW"
          - "rebuttal_round < MAX_REBUTTAL_ROUNDS (2)"
          - "program.program_state IN {CHALLENGE_OPEN, CHALLENGE_CLOSED}"
        side_effects:
          - "rebuttal_round += 1; rebuttal_deadline := clock.now + REBUTTAL_WINDOW_DAYS"
        note: "Negotiation cycle: UNDER_REVIEW -> REBUTTAL_OPEN -> UNDER_REVIEW, at most twice."
      - from: UNDER_REVIEW
        to: SUSTAINED
        trigger: "POST /broadband/challenges/{id}/determine with outcome == SUSTAINED"
        actor: EligibilityAnalyst
        preconditions:
          - "challenge_state == UNDER_REVIEW"
          - "X-User-ID != triaged_by_user_id (segregation of duties)"
          - "evidence_sufficiency_score >= required_sufficiency_threshold"
          - "evidence_sufficiency_score > rebuttal_strength_score (strict)"
        side_effects:
          - "outcome := SUSTAINED; determined_by_user_id := X-User-ID"
          - "hop 1: location.classification_status := asserted_classification, location.classification_source := CHALLENGE_DETERMINATION, location.eligibility_state CHALLENGED -> RECLASSIFIED"
          - "hop 2 (caused by hop 1): every LocationClaim on that location with claim_state == CLAIMED_INELIGIBLE flips to CLAIMED_ELIGIBLE; the owning Application's confirmed_location_count += 1, eligible_project_cost_cents += claimed_cost_cents and final_cost_per_location_cents is recomputed"
          - "hop 3 (caused by hop 2): because that Application's confirmed_location_count changed, its ScoreSheet rows with score_state == FINAL move to STALE, the Application moves SCORED -> RESCORE_REQUIRED with rescore_required_reason := 'CHALLENGE_RECLASSIFICATION', and application.version increments"
          - "hop 4 (caused by hop 3): because program.stale_score_sheet_count became >= 1, program.scoring_posture OPEN -> RESTRICTED, which blocks POST /broadband/awards program-wide"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /broadband/challenges/{id}/determine with outcome == REJECTED"
        actor: EligibilityAnalyst
        preconditions:
          - "challenge_state == UNDER_REVIEW"
          - "X-User-ID != triaged_by_user_id (segregation of duties)"
        side_effects:
          - "outcome := REJECTED; determined_by_user_id := X-User-ID"
          - "location.eligibility_state CHALLENGED -> AFFIRMED; classification_status unchanged"
      - from: UNDER_REVIEW
        to: DEFICIENT
        trigger: "POST /broadband/challenges/{id}/determine with outcome == DEFICIENT"
        actor: EligibilityAnalyst
        preconditions:
          - "challenge_state == UNDER_REVIEW"
          - "X-User-ID != triaged_by_user_id (segregation of duties)"
          - "rebuttal_strength_score >= evidence_sufficiency_score (the rebuttal ties or prevails, so the challenge record is deficient)"
        side_effects:
          - "outcome := DEFICIENT; determined_by_user_id := X-User-ID"
          - "location.eligibility_state CHALLENGED -> AFFIRMED"
      - from: DEFICIENT
        to: SUBMITTED
        trigger: "POST /broadband/challenges/{id}/resubmit"
        actor: Challenger
        preconditions:
          - "challenge_state == DEFICIENT"
          - "X-User-ID == submitter_user_id"
          - "resubmission_count < MAX_CHALLENGE_RESUBMISSIONS (2)"
          - "program.program_state == CHALLENGE_OPEN AND clock.now < program.challenge_window_end"
        side_effects:
          - "resubmission_count += 1; rebuttal_round := 0; rebuttal_deadline := null; triaged_by_user_id := null; outcome := null"
          - "location.eligibility_state AFFIRMED -> CHALLENGED"
        note: "Resubmission cycle: DEFICIENT -> SUBMITTED, at most twice; the third resubmit is refused with ERR_RESUBMISSION_LIMIT_REACHED at priority 79."

  - entity: Subgrantee
    state_field: capability_state
    initial_state: REGISTERED
    terminal_states: [DISQUALIFIED]
    transitions:
      - from: REGISTERED
        to: UNDER_CAPABILITY_REVIEW
        trigger: "POST /broadband/subgrantees/{id}/begin-capability-review"
        actor: CapabilityReviewer
        preconditions:
          - "capability_state == REGISTERED"
          - "program.program_state IN {DRAFT, CHALLENGE_OPEN, CHALLENGE_CLOSED, SCORING}"
        side_effects:
          - "capability_reviewer_user_id := X-User-ID; review_variant := INITIAL"
      - from: UNDER_CAPABILITY_REVIEW
        to: QUALIFIED
        trigger: "POST /broadband/subgrantees/{id}/record-capability-determination"
        actor: CapabilityReviewer
        preconditions:
          - "capability_state == UNDER_CAPABILITY_REVIEW"
          - "X-User-ID == capability_reviewer_user_id"
          - "capability_index >= 70.00 AND technical_component >= 24.00 AND financial_component >= 17.50"
        side_effects:
          - "technical_raw_score, technical_component, financial_component, managerial_component and capability_index stamped by calculations.subgrantee_capability_index under review_variant"
      - from: UNDER_CAPABILITY_REVIEW
        to: REMEDIATION_REQUIRED
        trigger: "POST /broadband/subgrantees/{id}/record-capability-determination"
        actor: CapabilityReviewer
        preconditions:
          - "capability_state == UNDER_CAPABILITY_REVIEW"
          - "X-User-ID == capability_reviewer_user_id"
          - "review_variant == INITIAL"
          - "55.00 <= capability_index < 70.00, OR capability_index >= 70.00 with technical_component < 24.00 or financial_component < 17.50"
        side_effects:
          - "component scores and capability_index stamped"
      - from: UNDER_CAPABILITY_REVIEW
        to: DISQUALIFIED
        trigger: "POST /broadband/subgrantees/{id}/record-capability-determination"
        actor: CapabilityReviewer
        preconditions:
          - "capability_state == UNDER_CAPABILITY_REVIEW"
          - "X-User-ID == capability_reviewer_user_id"
          - "capability_index < 55.00, OR review_variant == REMEDIATION with capability_index < 70.00"
        side_effects:
          - "component scores and capability_index stamped"
          - "every Application of this subgrantee with application_state IN {DRAFT, SUBMITTED, RETURNED_FOR_CURE} moves to NOT_SELECTED"
      - from: REMEDIATION_REQUIRED
        to: UNDER_CAPABILITY_REVIEW
        trigger: "POST /broadband/subgrantees/{id}/submit-remediation"
        actor: Subgrantee
        preconditions:
          - "capability_state == REMEDIATION_REQUIRED"
          - "X-User-ID == this Subgrantee.id"
          - "remediation_count == 0"
        side_effects:
          - "remediation_count := 1; review_variant := REMEDIATION; audited_net_assets_cents and withdrawn_personnel_count stamped from the payload"
        note: "Remediation cycle: REMEDIATION_REQUIRED -> UNDER_CAPABILITY_REVIEW, at most once."
      - from: QUALIFIED
        to: SUSPENDED
        trigger: "system: ComplianceAudit result FAILED cascade, hop 3"
        actor: system
        preconditions:
          - "capability_state == QUALIFIED"
          - "at least one Milestone of the affected award moved to HELD in hop 2"
        side_effects:
          - "open_noncompliance_count += 1"
      - from: SUSPENDED
        to: QUALIFIED
        trigger: "POST /broadband/awards/{id}/compliance-audits/{auditId}/verify-remediation"
        actor: AuditOfficer
        preconditions:
          - "capability_state == SUSPENDED"
          - "open_noncompliance_count == 1 before this transition"
        side_effects:
          - "open_noncompliance_count -= 1"

  - entity: Application
    state_field: application_state
    initial_state: DRAFT
    terminal_states: [AWARDED, NOT_SELECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /broadband/applications/{id}/submit"
        actor: Subgrantee
        preconditions:
          - "application_state == DRAFT"
          - "X-User-ID == subgrantee_id"
          - "program.program_state IN {CHALLENGE_OPEN, CHALLENGE_CLOSED}"
          - "program.application_window_start <= clock.now < program.application_window_end"
          - "claim_count >= 1"
          - "match_offer_pct >= program.min_match_pct"
          - "committed_down_mbps >= program.served_down_mbps_threshold AND committed_up_mbps >= program.served_up_mbps_threshold"
        side_effects:
          - "preliminary_cost_per_location_cents and final_cost_per_location_cents stamped by calculations.application_cost_per_location (both variants)"
      - from: SUBMITTED
        to: RETURNED_FOR_CURE
        trigger: "POST /broadband/applications/{id}/return-for-cure"
        actor: ProgramAdmin
        preconditions:
          - "application_state == SUBMITTED"
          - "returned_for_cure_count == 0"
        side_effects:
          - "returned_for_cure_count := 1"
      - from: RETURNED_FOR_CURE
        to: SUBMITTED
        trigger: "POST /broadband/applications/{id}/submit"
        actor: Subgrantee
        preconditions:
          - "application_state == RETURNED_FOR_CURE"
          - "X-User-ID == subgrantee_id"
          - "program.application_window_start <= clock.now < program.application_window_end"
          - "claim_count >= 1"
          - "match_offer_pct >= program.min_match_pct"
        side_effects:
          - "preliminary_cost_per_location_cents and final_cost_per_location_cents recomputed"
        note: "Cure cycle: SUBMITTED -> RETURNED_FOR_CURE -> SUBMITTED, at most once."
      - from: SUBMITTED
        to: SCORED
        trigger: "POST /broadband/score-sheets"
        actor: ScoringOfficer
        preconditions:
          - "application_state == SUBMITTED"
          - "program.program_state == SCORING"
          - "subgrantee.capability_state == QUALIFIED"
          - "confirmed_location_count >= 1"
          - "X-User-ID != subgrantee.capability_reviewer_user_id (segregation of duties)"
        side_effects:
          - "a ScoreSheet with score_state == FINAL is created and current_total_score := its total_score"
          - "version increments by 1"
      - from: SCORED
        to: RESCORE_REQUIRED
        trigger: "system: Challenge SUSTAINED cascade, hop 3"
        actor: system
        preconditions:
          - "application_state == SCORED"
          - "confirmed_location_count changed in hop 2"
        side_effects:
          - "ScoreSheet rows with score_state == FINAL move to STALE; rescore_required_reason := 'CHALLENGE_RECLASSIFICATION'; version increments by 1"
      - from: RESCORE_REQUIRED
        to: SCORED
        trigger: "POST /broadband/score-sheets"
        actor: ScoringOfficer
        preconditions:
          - "application_state == RESCORE_REQUIRED"
          - "program.program_state == SCORING"
          - "subgrantee.capability_state == QUALIFIED"
          - "confirmed_location_count >= 1"
          - "X-User-ID != subgrantee.capability_reviewer_user_id (segregation of duties)"
        side_effects:
          - "the prior ScoreSheet with score_state == STALE moves to SUPERSEDED; a new ScoreSheet with score_state == FINAL is created"
          - "rescore_required_reason := null; current_total_score := the new total_score; version increments by 1"
        note: "Rescore cycle: SCORED -> RESCORE_REQUIRED -> SCORED, unbounded (a sustained challenge may recur per location)."
      - from: SCORED
        to: SELECTED
        trigger: "POST /broadband/applications/{id}/select"
        actor: ProgramAdmin
        preconditions:
          - "application_state == SCORED"
          - "program.program_state == SCORING"
          - "program.scoring_posture == OPEN"
        side_effects: []
      - from: SELECTED
        to: AWARDED
        trigger: "POST /broadband/awards"
        actor: ProgramAdmin
        preconditions:
          - "application_state == SELECTED"
        side_effects:
          - "LocationClaim rows with claim_state == CLAIMED_ELIGIBLE move to AWARD_BOUND (or EHCL_DEFERRED when deferred)"
      - from: SCORED
        to: NOT_SELECTED
        trigger: "system: GrantProgram SCORING -> ALLOCATION_CLOSED"
        actor: system
        preconditions:
          - "application_state == SCORED"
        side_effects:
          - "LocationClaim rows with claim_state IN {CLAIMED_ELIGIBLE, CLAIMED_INELIGIBLE} move to RELEASED"
      - from: AWARDED
        to: NOT_SELECTED
        trigger: "POST /broadband/awards/{id}/terminate"
        actor: ProgramAdmin
        preconditions:
          - "application_state == AWARDED"
        side_effects:
          - "hop 2 of the termination cascade: LocationClaim rows with claim_state == AWARD_BOUND move to RELEASED"

  - entity: Award
    state_field: award_state
    initial_state: OBLIGATED
    terminal_states: [CLOSED, TERMINATED]
    transitions:
      - from: OBLIGATED
        to: CONSTRUCTION_AUTHORIZED
        trigger: "POST /broadband/awards/{id}/authorize-construction"
        actor: ProgramAdmin
        preconditions:
          - "award_state == OBLIGATED"
          - "the EnvironmentalReview with this award_id has ehp_state == CLEARED"
        side_effects:
          - "every AWARD_BOUND location moves service_state NOT_BUILT -> UNDER_CONSTRUCTION"
      - from: CONSTRUCTION_AUTHORIZED
        to: IN_CONSTRUCTION
        trigger: "POST /broadband/awards/{id}/milestones/{milestoneId}/disburse"
        actor: ProgramAdmin
        preconditions:
          - "award_state == CONSTRUCTION_AUTHORIZED"
          - "milestone.milestone_state == APPROVED"
        side_effects:
          - "a DISBURSEMENT LedgerEntry is appended and disbursed_to_date_cents recomputed"
      - from: IN_CONSTRUCTION
        to: CLOSED
        trigger: "POST /broadband/awards/{id}/milestones/{milestoneId}/disburse with milestone.is_final == true"
        actor: ProgramAdmin
        preconditions:
          - "award_state == IN_CONSTRUCTION"
          - "milestone.is_final == true AND milestone.milestone_state == APPROVED"
          - "compliance_state IN {COMPLIANT, CURED}"
        side_effects:
          - "the holdback is released: disbursed_to_date_cents becomes obligation_amount_cents"
      - from: OBLIGATED
        to: TERMINATED
        trigger: "POST /broadband/awards/{id}/terminate"
        actor: ProgramAdmin
        preconditions:
          - "award_state == OBLIGATED"
        side_effects:
          - "hop 1: a DEOBLIGATION LedgerEntry for (obligation_amount_cents - disbursed_to_date_cents) is appended; program.obligated_balance_cents and program.uncommitted_balance_cents are recomputed from the ledger"
          - "hop 2 (caused by hop 1's termination of the award): application AWARDED -> NOT_SELECTED and its AWARD_BOUND LocationClaim rows move to RELEASED"
          - "hop 3 (caused by hop 2): because those claims were released, each location's eligibility_state AWARD_BOUND -> AFFIRMED and awarded_award_id := null"
          - "hop 4 (caused by hop 3): because no location of this program remains AWARD_BOUND for a stale sheet, program.scoring_posture is recomputed by calculations.program_scoring_posture"
          - "every Milestone with milestone_state IN {PLANNED, EVIDENCE_SUBMITTED, APPROVED, REJECTED, HELD} moves to VOIDED"
      - from: CONSTRUCTION_AUTHORIZED
        to: TERMINATED
        trigger: "POST /broadband/awards/{id}/terminate"
        actor: ProgramAdmin
        preconditions:
          - "award_state == CONSTRUCTION_AUTHORIZED"
        side_effects:
          - "same four-hop cascade as OBLIGATED -> TERMINATED; additionally every location with service_state == UNDER_CONSTRUCTION returns to NOT_BUILT"
      - from: IN_CONSTRUCTION
        to: TERMINATED
        trigger: "POST /broadband/awards/{id}/terminate"
        actor: ProgramAdmin
        preconditions:
          - "award_state == IN_CONSTRUCTION"
          - "compliance_state == NONCOMPLIANT"
        side_effects:
          - "same four-hop cascade; the DEOBLIGATION entry covers only the undisbursed remainder, so program.disbursed_balance_cents is unchanged"

  - entity: EnvironmentalReview
    state_field: ehp_state
    initial_state: SCREENING
    terminal_states: [CLEARED, BLOCKED]
    transitions:
      - from: SCREENING
        to: CATEGORICAL_EXCLUSION
        trigger: "POST /broadband/awards/{id}/environmental-review/determination with pathway == CATEGORICAL_EXCLUSION"
        actor: EnvironmentalReviewer
        preconditions:
          - "ehp_state == SCREENING"
          - "tribal_consultation_required == false AND shpo_consultation_required == false"
        side_effects:
          - "pathway := CATEGORICAL_EXCLUSION"
        note: "Fork branch 1: no consultation obligations, so clearance needs no mitigation record."
      - from: SCREENING
        to: EA_REQUIRED
        trigger: "POST /broadband/awards/{id}/environmental-review/determination with pathway == EA_REQUIRED"
        actor: EnvironmentalReviewer
        preconditions:
          - "ehp_state == SCREENING"
          - "tribal_consultation_required == true OR shpo_consultation_required == true"
        side_effects:
          - "pathway := EA_REQUIRED"
        note: "Fork branch 2: an environmental assessment is required before any clearance."
      - from: EA_REQUIRED
        to: MITIGATION_REQUIRED
        trigger: "POST /broadband/awards/{id}/environmental-review/determination with pathway == MITIGATION_PLAN_ACCEPTED"
        actor: EnvironmentalReviewer
        preconditions:
          - "ehp_state == EA_REQUIRED"
        side_effects:
          - "pathway := MITIGATION_PLAN_ACCEPTED; mitigation_summary stamped from the payload"
      - from: EA_REQUIRED
        to: BLOCKED
        trigger: "POST /broadband/awards/{id}/environmental-review/determination with pathway == ADVERSE_EFFECT"
        actor: EnvironmentalReviewer
        preconditions:
          - "ehp_state == EA_REQUIRED"
        side_effects:
          - "pathway := ADVERSE_EFFECT; the award can never reach CONSTRUCTION_AUTHORIZED"
        note: "Fork branch 3: divergent side-effect set - no clearance fields are ever stamped."
      - from: CATEGORICAL_EXCLUSION
        to: CLEARED
        trigger: "POST /broadband/awards/{id}/environmental-review/clear"
        actor: EnvironmentalReviewer
        preconditions:
          - "ehp_state == CATEGORICAL_EXCLUSION"
        side_effects:
          - "cleared_by_user_id := X-User-ID; cleared_at := clock.now"
      - from: MITIGATION_REQUIRED
        to: CLEARED
        trigger: "POST /broadband/awards/{id}/environmental-review/clear"
        actor: EnvironmentalReviewer
        preconditions:
          - "ehp_state == MITIGATION_REQUIRED"
          - "mitigation_summary != null"
        side_effects:
          - "cleared_by_user_id := X-User-ID; cleared_at := clock.now"

  - entity: Milestone
    state_field: milestone_state
    initial_state: PLANNED
    terminal_states: [DISBURSED, VOIDED]
    transitions:
      - from: PLANNED
        to: EVIDENCE_SUBMITTED
        trigger: "POST /broadband/awards/{id}/milestones/{milestoneId}/submit-evidence"
        actor: Subgrantee
        preconditions:
          - "milestone_state == PLANNED"
          - "X-User-ID == award.application.subgrantee_id"
          - "award.award_state IN {CONSTRUCTION_AUTHORIZED, IN_CONSTRUCTION}"
          - "award.compliance_state IN {COMPLIANT, CURED}"
          - "every id in built_location_ids appears in planned_location_ids"
          - "evidence_basis == INVOICED_COST implies invoiced_cost_cents != null"
        side_effects:
          - "built_location_ids and invoiced_cost_cents stamped from the payload"
      - from: EVIDENCE_SUBMITTED
        to: APPROVED
        trigger: "POST /broadband/awards/{id}/milestones/{milestoneId}/verify with outcome == APPROVED"
        actor: ProgramAdmin
        preconditions:
          - "milestone_state == EVIDENCE_SUBMITTED"
          - "every verified location id appears in built_location_ids"
          - "every verified location has service_state == UNDER_CONSTRUCTION"
        side_effects:
          - "verified_location_count stamped; payable_amount_cents stamped by calculations.milestone_disbursement_amount under the milestone's evidence_basis variant"
          - "each verified location moves service_state UNDER_CONSTRUCTION -> SERVICE_AVAILABLE"
          - "award.last_verifier_user_id := X-User-ID"
      - from: EVIDENCE_SUBMITTED
        to: REJECTED
        trigger: "POST /broadband/awards/{id}/milestones/{milestoneId}/verify with outcome == REJECTED"
        actor: ProgramAdmin
        preconditions:
          - "milestone_state == EVIDENCE_SUBMITTED"
        side_effects:
          - "rejection_reason stamped; payable_amount_cents := 0; award.last_verifier_user_id := X-User-ID"
      - from: REJECTED
        to: EVIDENCE_SUBMITTED
        trigger: "POST /broadband/awards/{id}/milestones/{milestoneId}/submit-evidence"
        actor: Subgrantee
        preconditions:
          - "milestone_state == REJECTED"
          - "resubmission_count < 2"
          - "award.compliance_state IN {COMPLIANT, CURED}"
        side_effects:
          - "resubmission_count += 1; built_location_ids replaced"
        note: "Resubmission cycle: EVIDENCE_SUBMITTED -> REJECTED -> EVIDENCE_SUBMITTED, at most twice."
      - from: APPROVED
        to: DISBURSED
        trigger: "POST /broadband/awards/{id}/milestones/{milestoneId}/disburse"
        actor: ProgramAdmin
        preconditions:
          - "milestone_state == APPROVED"
          - "award.compliance_state IN {COMPLIANT, CURED}"
          - "payable_amount_cents > 0 (strict)"
        side_effects:
          - "a DISBURSEMENT LedgerEntry for payable_amount_cents is appended; award.disbursed_to_date_cents recomputed"
          - "each SERVICE_AVAILABLE location in verified scope moves to CERTIFIED with certified_at := clock.now; award.certified_location_count recomputed"
      - from: EVIDENCE_SUBMITTED
        to: HELD
        trigger: "system: ComplianceAudit result FAILED cascade, hop 2"
        actor: system
        preconditions:
          - "milestone_state == EVIDENCE_SUBMITTED"
          - "award.compliance_state became NONCOMPLIANT in hop 1"
        side_effects:
          - "payable_amount_cents := 0"
      - from: APPROVED
        to: HELD
        trigger: "system: ComplianceAudit result FAILED cascade, hop 2"
        actor: system
        preconditions:
          - "milestone_state == APPROVED"
          - "award.compliance_state became NONCOMPLIANT in hop 1"
        side_effects:
          - "payable_amount_cents := 0 (the reserved disbursement is released)"
      - from: HELD
        to: EVIDENCE_SUBMITTED
        trigger: "POST /broadband/awards/{id}/compliance-audits/{auditId}/verify-remediation"
        actor: AuditOfficer
        preconditions:
          - "milestone_state == HELD"
          - "award.compliance_state becomes CURED in this transition"
        side_effects:
          - "payable_amount_cents stays 0 until re-verification"

  - entity: ComplianceAudit
    state_field: audit_state
    initial_state: SCHEDULED
    terminal_states: [PASSED, REMEDIATED, CLAWBACK_SETTLED, CLAWBACK_WAIVED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /broadband/awards/{id}/compliance-audits/{auditId}/record-result with result == PASSED"
        actor: AuditOfficer
        preconditions:
          - "audit_state == SCHEDULED"
          - "clock.now >= window_start"
          - "every measured location meets award.application.committed_down_mbps, committed_up_mbps and committed_latency_ms"
        side_effects:
          - "tested_location_count stamped; failed_location_ids := []"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /broadband/awards/{id}/compliance-audits/{auditId}/record-result with result == FAILED"
        actor: AuditOfficer
        preconditions:
          - "audit_state == SCHEDULED"
          - "clock.now >= window_start"
          - "failed_location_ids is non-empty and every id is AWARD_BOUND on this award"
        side_effects:
          - "hop 1: failed_location_ids stamped; each listed location moves service_state SERVICE_AVAILABLE|CERTIFIED -> AUDIT_FAILED; award.compliance_state COMPLIANT -> NONCOMPLIANT; award.failed_location_count and award.certified_location_count recomputed"
          - "hop 2 (caused by hop 1's compliance_state change): every Milestone of that award with milestone_state IN {EVIDENCE_SUBMITTED, APPROVED} moves to HELD and its payable_amount_cents is zeroed"
          - "hop 3 (caused by hop 2's non-empty HELD set): the award's Subgrantee moves capability_state QUALIFIED -> SUSPENDED and open_noncompliance_count += 1"
          - "noncompliant_share and penalty_multiplier stamped by calculations.clawback_recovery_amount"
      - from: FAILED
        to: REMEDIATED
        trigger: "POST /broadband/awards/{id}/compliance-audits/{auditId}/verify-remediation"
        actor: AuditOfficer
        preconditions:
          - "audit_state == FAILED"
          - "X-User-ID != award.last_verifier_user_id (segregation of duties)"
        side_effects:
          - "each AUDIT_FAILED location returns to SERVICE_AVAILABLE; award.compliance_state NONCOMPLIANT -> CURED"
          - "HELD milestones return to EVIDENCE_SUBMITTED; the Subgrantee returns SUSPENDED -> QUALIFIED"
      - from: FAILED
        to: CLAWBACK_NOTICE_ISSUED
        trigger: "POST /broadband/awards/{id}/compliance-audits/{auditId}/issue-clawback-notice"
        actor: AuditOfficer
        preconditions:
          - "audit_state == FAILED"
          - "award.disbursed_to_date_cents > 0"
        side_effects:
          - "recovery_amount_cents stamped by calculations.clawback_recovery_amount; notice_issued_by_user_id := X-User-ID"
      - from: CLAWBACK_NOTICE_ISSUED
        to: APPEALED
        trigger: "POST /broadband/awards/{id}/compliance-audits/{auditId}/appeal"
        actor: Subgrantee
        preconditions:
          - "audit_state == CLAWBACK_NOTICE_ISSUED"
          - "X-User-ID == award.application.subgrantee_id"
          - "appeal_count < 2"
        side_effects:
          - "appeal_count += 1"
      - from: APPEALED
        to: CLAWBACK_NOTICE_ISSUED
        trigger: "POST /broadband/awards/{id}/compliance-audits/{auditId}/issue-clawback-notice"
        actor: AuditOfficer
        preconditions:
          - "audit_state == APPEALED"
          - "appeal_count <= 2"
        side_effects:
          - "recovery_amount_cents recomputed on the current disbursed_to_date_cents; notice_issued_by_user_id := X-User-ID"
        note: "Appeal cycle: CLAWBACK_NOTICE_ISSUED -> APPEALED -> CLAWBACK_NOTICE_ISSUED, at most twice."
      - from: CLAWBACK_NOTICE_ISSUED
        to: CLAWBACK_SETTLED
        trigger: "POST /broadband/awards/{id}/compliance-audits/{auditId}/resolve-clawback with resolution == SETTLED"
        actor: ProgramAdmin
        preconditions:
          - "audit_state == CLAWBACK_NOTICE_ISSUED"
          - "recovery_amount_cents != null AND recovery_amount_cents <= award.disbursed_to_date_cents"
        side_effects:
          - "settled_amount_cents := the payload settled_amount_cents when supplied (validated into 1..recovery_amount_cents by priority 93), else recovery_amount_cents; a CLAWBACK_RECOVERY LedgerEntry for that amount is appended"
          - "program.disbursed_balance_cents decreases and program.uncommitted_balance_cents increases by settled_amount_cents"
          - "each location in failed_location_ids with service_state == AUDIT_FAILED has certified_at := null; award.certified_location_count is recomputed so it equals its pre-certification value for those locations"
      - from: APPEALED
        to: CLAWBACK_WAIVED
        trigger: "POST /broadband/awards/{id}/compliance-audits/{auditId}/resolve-clawback with resolution == WAIVED"
        actor: ProgramAdmin
        preconditions:
          - "audit_state == APPEALED"
          - "X-User-ID != notice_issued_by_user_id (segregation of duties)"
        side_effects:
          - "settled_amount_cents := 0; no LedgerEntry is appended; award.compliance_state stays NONCOMPLIANT"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: score-sheet-create-stale-application
    parent_entity: Application
    write_endpoint: "POST /broadband/score-sheets"
    occ_field: "expected_application_version"
    description: |
      Creating a ScoreSheet against an Application whose version has advanced since the client last
      observed it is rejected with a stale-version error. A new ScoreSheet legitimately supersedes the
      prior one (a sustained challenge drives the application to RESCORE_REQUIRED and marks the old
      sheet STALE), so the write itself is valid from a reachable state; only the client's stale view
      of the application is not.
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412

  - rule_id: challenge-evidence-append-stale-challenge
    parent_entity: Challenge
    write_endpoint: "POST /broadband/challenges/{id}/evidence"
    occ_field: "expected_challenge_version"
    description: |
      Appending a ChallengeEvidence item to a Challenge whose version has advanced since the client
      last observed it is rejected with a stale-version error. Multiple evidence items are legitimate
      on the same challenge, and every append recomputes evidence_sufficiency_score and bumps the
      challenge version, so the rejection turns purely on the stale version the client carried.
    error_id: ERR_STALE_CHALLENGE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: location_classification
    trigger: "POST /broadband/locations (creation), and re-stamped by Challenge UNDER_REVIEW -> SUSTAINED (classification_source := CHALLENGE_DETERMINATION)"
    algorithm: threshold
    formula: |
      # Evaluation order is fixed; the first matching branch wins.
      if reported_technology IN UNRELIABLE_TECHNOLOGIES:            # federal reliability rule
          return UNSERVED
      if reported_latency_ms > program.max_latency_ms:                # strict >
          return UNSERVED
      if reported_down_mbps < program.unserved_down_mbps_threshold
         OR reported_up_mbps < program.unserved_up_mbps_threshold:    # strict <
          return UNSERVED
      if reported_down_mbps < program.served_down_mbps_threshold
         OR reported_up_mbps < program.served_up_mbps_threshold:      # strict <
          return UNDERSERVED
      return SERVED
    input_set: "The single EligibleLocation row being created, plus the four speed thresholds, max_latency_ms and the technology list from its GrantProgram."
    constants:
      UNRELIABLE_TECHNOLOGIES: [UNLICENSED_FIXED_WIRELESS, GEOSTATIONARY_SATELLITE]
    precision: "Speeds compared as declared numbers; no rounding. Latency compared as integers."
    variants: []
    note: "Boundary semantics: exactly 25/3 is UNDERSERVED (not UNSERVED); exactly 100/20 is SERVED (not UNDERSERVED); latency exactly 100 does not trigger the unreliability branch."

  - name: challenge_evidence_sufficiency
    trigger: "POST /broadband/challenges/{id}/evidence (every append), and re-evaluated as a precondition of triage and of determine"
    algorithm: weighted_scoring
    formula: |
      age_days(item) = floor((challenge.created_at - item.collected_at) / 86400 seconds)
      recency_multiplier(item) = 1.0   if age_days <= 180
                                 0.5   if 181 <= age_days <= 365
                                 0.0   if age_days > 365          # item becomes STALE_EXCLUDED
      weighted_value(item) = round_half_up(EVIDENCE_WEIGHTS[item.evidence_type]
                                           * recency_multiplier(item), 2)
      evidence_sufficiency_score = round_half_up(
          sum(weighted_value(i) for i in items where i.submitter_side == CHALLENGE
                                              and i.evidence_state == ACCEPTED), 2)
      rebuttal_strength_score  = round_half_up(
          sum(weighted_value(i) for i in items where i.submitter_side == REBUTTAL
                                              and i.evidence_state == ACCEPTED), 2)
      required_sufficiency_threshold = PROVIDER_STANDARD_THRESHOLD if challenger_type == PROVIDER
                                       else COMMUNITY_STANDARD_THRESHOLD
      sufficient = evidence_sufficiency_score >= required_sufficiency_threshold
                   AND ( challenger_type == PROVIDER
                         ? any ACCEPTED CHALLENGE-side item with evidence_type IN {PROVIDER_ATTESTATION, MAP_DATA_EXPORT}
                         : distinct_evidence_type_count >= 2 )
    input_set: "All ChallengeEvidence rows with this challenge_id and evidence_state == ACCEPTED, partitioned by submitter_side; STALE_EXCLUDED rows contribute 0 and are excluded from distinct_evidence_type_count."
    constants:
      EVIDENCE_WEIGHTS:
        SPEED_TEST: 15
        SUBSCRIBER_BILL: 25
        SERVICE_DENIAL_LETTER: 30
        FIELD_SURVEY: 20
        PROVIDER_ATTESTATION: 35
        MAP_DATA_EXPORT: 10
        CONSTRUCTION_PERMIT_RECORD: 20
      PROVIDER_STANDARD_THRESHOLD: 60.00
      COMMUNITY_STANDARD_THRESHOLD: 40.00
      REBUTTAL_WINDOW_DAYS: 30
      MAX_REBUTTAL_ROUNDS: 2
    precision: "Per-item weighted_value rounded to 2 decimals (round_half_up) FIRST, then summed, then the sum rounded to 2 decimals."
    variants:
      - name: provider_standard
        when: "challenger_type == PROVIDER"
        difference: "Threshold 60.00 and at least one PROVIDER_ATTESTATION or MAP_DATA_EXPORT item; the distinct-type rule does not apply."
      - name: community_standard
        when: "challenger_type IN {COMMUNITY, LOCAL_GOVERNMENT, NONPROFIT}"
        difference: "Threshold 40.00 and distinct_evidence_type_count >= 2; no privileged evidence type is required."

  - name: subgrantee_capability_index
    trigger: "POST /broadband/subgrantees/{id}/record-capability-determination"
    algorithm: weighted_scoring
    formula: |
      # Variant selects the financial basis, the financial haircut and the personnel basis.
      net_basis      = net_assets_cents            if review_variant == INITIAL
                       else audited_net_assets_cents
      haircut        = 1.00                        if review_variant == INITIAL
                       else REMEDIATION_FINANCIAL_HAIRCUT
      personnel      = key_personnel_count         if review_variant == INITIAL
                       else key_personnel_count - withdrawn_personnel_count
      liquidity_need = requested_amount_cents * LIQUIDITY_REQUIREMENT_RATIO
      technical_component  = round_half_up(min(40.00, technical_raw_score), 2)
      financial_component  = round_half_up(min(35.00, 35.00 * min(1.0, net_basis / liquidity_need))
                                           * haircut, 2)
      managerial_component = round_half_up(min(25.00,
                                 PERSONNEL_POINTS * personnel
                                 + (PRIOR_AWARD_POINTS if has_prior_federal_award else 0)), 2)
      capability_index = round_half_up(technical_component + financial_component
                                       + managerial_component, 2)
    input_set: "The single Subgrantee row plus technical_raw_score supplied in the determination payload; review_variant is INITIAL on the first determination and REMEDIATION after a remediation submission."
    constants:
      LIQUIDITY_REQUIREMENT_RATIO: 0.25
      REMEDIATION_FINANCIAL_HAIRCUT: 0.85
      PERSONNEL_POINTS: 5
      PRIOR_AWARD_POINTS: 5
      QUALIFY_INDEX_THRESHOLD: 70.00
      REMEDIATION_INDEX_FLOOR: 55.00
      TECHNICAL_FLOOR: 24.00
      FINANCIAL_FLOOR: 17.50
    precision: "Each component rounded to 2 decimals (round_half_up) before summation; the haircut is applied inside the financial rounding step, not after."
    variants:
      - name: initial_review
        when: "review_variant == INITIAL (first determination after begin-capability-review)"
        difference: "Uses unaudited net_assets_cents, no haircut, and the full declared key_personnel_count."
      - name: remediation_review
        when: "review_variant == REMEDIATION (determination after submit-remediation)"
        difference: "Uses audited_net_assets_cents, multiplies the financial component by 0.85, and subtracts withdrawn_personnel_count from the personnel basis, so identical submitted figures yield a strictly lower index than initial_review."

  - name: application_cost_per_location
    trigger: "POST /broadband/applications/{id}/submit, and re-stamped whenever a LocationClaim of the application changes claim_state (challenge cascade hop 2, EHCL deferral, release)"
    algorithm: aggregation
    formula: |
      PRELIMINARY:
        numerator   = total_project_cost_cents      # all claims in {CLAIMED_ELIGIBLE, CLAIMED_INELIGIBLE, AWARD_BOUND, EHCL_DEFERRED}
        denominator = claim_count                   # same set, counted
      FINAL:
        numerator   = eligible_project_cost_cents   # claims in {CLAIMED_ELIGIBLE, AWARD_BOUND} only
        denominator = confirmed_location_count      # same set, counted
      if denominator == 0:
        PRELIMINARY -> ERR_INVALID_REQUEST at submit (claim_count >= 1 is a submit precondition)
        FINAL       -> null while unsubmitted; ERR_NO_ELIGIBLE_LOCATIONS at POST /broadband/score-sheets
      cost_per_location_cents = round_half_up(numerator / denominator, 0)
    input_set: "LocationClaim rows of this application; PRELIMINARY includes claims on locations whose classification_status == SERVED, FINAL excludes them. Rows with claim_state == RELEASED are excluded from both."
    constants: {}
    precision: "Integer cents, round_half_up on the quotient."
    variants:
      - name: preliminary
        when: "Stamped at submit and shown on the application; used for nothing else."
        difference: "Denominator counts every claim regardless of the claimed location's classification_status."
      - name: final
        when: "Basis of calculations.application_total_score cost tier and of the award obligation."
        difference: "Denominator counts only claims whose location is UNSERVED or UNDERSERVED, so the same claim set yields a different per-location cost."

  - name: application_total_score
    trigger: "POST /broadband/score-sheets"
    algorithm: weighted_scoring
    formula: |
      # (1) tiered selection on the FINAL cost per location
      c = application.final_cost_per_location_cents
      cost_points = 30.00 if c <= 100000
                    24.00 if c <= 250000
                    16.00 if c <= 500000
                     8.00 if c <= 1000000
                     0.00 otherwise
      # (2) capped additive branch on speed commitments
      speed_points = min(30.00,
                         25.00
                         + (5.00 if committed_down_mbps >= 1000 AND committed_up_mbps >= 1000 else 0)
                         + (2.00 if committed_latency_ms <= 50 else 0))
      # (3) capped tiered branch on affordability
      afford_base  = 20.00 if low_cost_plan_price_cents <= 3000
                     14.00 if low_cost_plan_price_cents <= 5000
                      6.00 if low_cost_plan_price_cents <= 7500
                      0.00 otherwise
      affordability_points = min(20.00, afford_base
                                 + (5.00 if participates_in_state_affordability_program else 0))
      # (4) capped mixed branch on workforce plan
      workforce_points = min(20.00, (5.00 if has_dbe_plan else 0)
                                    + (5.00 if has_union_agreement else 0)
                                    + round_half_up(10.00 * local_hire_pct / 100, 2))
      capability_multiplier = 1.05 if subgrantee.capability_index >= CAPABILITY_BONUS_THRESHOLD else 1.00
      subtotal    = cost_points + speed_points + affordability_points + workforce_points
      total_score = min(100.00, round_half_up(subtotal * capability_multiplier, 2))
    input_set: "The Application row, its FINAL cost per location, and the capability_index of its Subgrantee (which must be QUALIFIED)."
    constants:
      COST_TIER_BREAKPOINTS_CENTS: [100000, 250000, 500000, 1000000]
      COST_TIER_POINTS: [30.00, 24.00, 16.00, 8.00, 0.00]
      AFFORDABILITY_BREAKPOINTS_CENTS: [3000, 5000, 7500]
      CAPABILITY_BONUS_THRESHOLD: 90.00
      MAX_TOTAL_SCORE: 100.00
    precision: "Component points carry 2 decimals; the capability multiplier is applied ONCE to the un-rounded subtotal and the product is rounded to 2 decimals, then capped at 100.00."
    variants: []
    note: "Non-linear interaction: each of the four components has its own cap, so a component's raw sum can exceed its cap and be clipped before the multiplier applies."

  - name: award_match_requirement
    trigger: "POST /broadband/awards"
    algorithm: aggregation
    formula: |
      # PINNED ROUNDING ORDER: round per location FIRST, then sum.
      for each claim in AWARD_BOUND set (post EHCL deferral), in created_at ASC order:
          claim.match_share_cents = round_half_up(
              claim.claimed_cost_cents * program.min_match_pct / 100, 0)
      match_requirement_cents = sum(claim.match_share_cents)
      # FORBIDDEN alternative (do NOT implement):
      #   round_half_up(total_eligible_cost_cents * program.min_match_pct / 100, 0)
      # The two disagree by whole cents whenever per-location halves round up.
    input_set: "LocationClaim rows of the obligated application with claim_state == AWARD_BOUND, processed in created_at ASC order (order does not change the sum, but it fixes which per-location values are stamped first)."
    constants: {}
    precision: "Integer cents, round_half_up per location, then an exact integer sum. Sum-then-round is explicitly rejected."
    variants: []

  - name: award_obligation_amount
    trigger: "POST /broadband/awards"
    algorithm: waterfall_allocation
    formula: |
      # Single-pass evaluation order; the EHCL test looks circular (per-location cost
      # depends on the retained set, and the retained set depends on the EHCL test) so the
      # order below is pinned and there is NO second EHCL pass.
      step 1: base set  = LocationClaim rows of the application with claim_state == CLAIMED_ELIGIBLE
              N0 = count(base set); C0 = sum(claimed_cost_cents over base set)
      step 2: preliminary_per_location_cost = round_half_up(C0 / N0, 0)   # recorded for audit only
      step 3: for each claim in base set: claim.is_ehcl = (claim.claimed_cost_cents
                                                           > program.ehcl_threshold_cents)   # strict >
      step 4: if program.ehcl_waiver_enabled == true AND count(is_ehcl) >= 1:
                  every is_ehcl claim -> claim_state EHCL_DEFERRED, its location -> DEFERRED_HIGH_COST
                  retained = base set minus deferred; ehcl_deferred_count = count(deferred)
              else:
                  retained = base set; ehcl_deferred_count = 0
      step 5: N1 = count(retained); if N1 == 0 -> ERR_ALL_LOCATIONS_EHCL_DEFERRED
      step 6: total_eligible_cost_cents = sum(claimed_cost_cents over retained)
              final_per_location_cost_cents = round_half_up(total_eligible_cost_cents / N1, 0)
              # FROZEN: even if this value now exceeds ehcl_threshold_cents, no further deferral occurs
      step 7: match_requirement_cents = calculations.award_match_requirement over retained
      step 8: obligation_amount_cents = total_eligible_cost_cents - match_requirement_cents
              holdback_cap_cents = round_half_up(obligation_amount_cents
                                                 * (100 - program.holdback_pct) / 100, 0)
      step 9: if obligation_amount_cents > program.uncommitted_balance_cents
                  -> ERR_PROGRAM_FUNDS_EXHAUSTED
    input_set: "CLAIMED_ELIGIBLE LocationClaim rows of the SELECTED application; CLAIMED_INELIGIBLE rows never enter the base set."
    constants: {}
    precision: "Integer cents throughout; each division rounded round_half_up exactly once at the step where it appears."
    variants: []

  - name: milestone_disbursement_amount
    trigger: "POST /broadband/awards/{id}/milestones/{milestoneId}/verify with outcome == APPROVED"
    algorithm: waterfall_allocation
    formula: |
      cumulative_cap = award.holdback_cap_cents
      remaining_cap  = cumulative_cap - award.disbursed_to_date_cents
      if milestone.is_final == true:
          payable = award.obligation_amount_cents - award.disbursed_to_date_cents   # releases holdback
      elif milestone.evidence_basis == BUILD_PROGRESS:
          gross   = round_half_up(award.obligation_amount_cents
                                  * verified_location_count / award.confirmed_location_count, 0)
          payable = min(gross, remaining_cap)
      else:  # INVOICED_COST
          eligible = round_half_up(milestone.invoiced_cost_cents
                                   * (100 - program.min_match_pct) / 100, 0)
          payable  = min(eligible, remaining_cap)
      if payable <= 0: -> ERR_NO_DISBURSABLE_AMOUNT at the disburse call (strict > 0 required)
    input_set: "The verified Milestone, its award's obligation_amount_cents / holdback_cap_cents / disbursed_to_date_cents, and the program's min_match_pct."
    constants: {}
    precision: "Integer cents; the single division is rounded round_half_up before the min() clamp."
    variants:
      - name: pro_rata_build
        when: "milestone.evidence_basis == BUILD_PROGRESS AND is_final == false"
        difference: "Payment tracks the verified share of confirmed locations against the obligation."
      - name: cost_reimbursement
        when: "milestone.evidence_basis == INVOICED_COST AND is_final == false"
        difference: "Payment tracks the federal share (100 - min_match_pct) of invoiced cost, so identical build progress yields a different payable amount than pro_rata_build."

  - name: program_balance_reconciliation
    trigger: "Every LedgerEntry append (award obligation, milestone disbursement, award termination, clawback settlement)"
    algorithm: aggregation
    formula: |
      L = LedgerEntry rows whose award_id belongs to this program (all rows; the ledger is append-only)
      obligation_total  = sum(amount_cents where entry_type == OBLIGATION)
      disbursed_total   = sum(amount_cents where entry_type == DISBURSEMENT)
      deobligated_total = sum(amount_cents where entry_type == DEOBLIGATION)
      recovered_total   = sum(amount_cents where entry_type == CLAWBACK_RECOVERY)
      uncommitted_balance_cents = total_appropriation_cents - obligation_total
                                  + deobligated_total + recovered_total
      obligated_balance_cents   = obligation_total - deobligated_total - disbursed_total
      disbursed_balance_cents   = disbursed_total - recovered_total
      # INVARIANT (must hold after every mutation):
      #   total_appropriation_cents == uncommitted_balance_cents
      #                               + obligated_balance_cents + disbursed_balance_cents
      # Each entry also stamps program_uncommitted_after_cents for audit replay.
    input_set: "All LedgerEntry rows of the program's awards, with no status filter and no time window: the ledger is immutable, so the full replay is the definition."
    constants: {}
    precision: "Exact integer cents; no rounding occurs in reconciliation."
    variants: []

  - name: clawback_recovery_amount
    trigger: "POST .../compliance-audits/{auditId}/record-result with result == FAILED (stamps share and multiplier) and POST .../issue-clawback-notice (stamps recovery_amount_cents)"
    algorithm: threshold
    formula: |
      noncompliant_share = round_half_up(failed_location_count
                                         / award.confirmed_location_count, 4)
      penalty_multiplier = 1.00 if noncompliant_share <= 0.10
                           1.10 if noncompliant_share <= 0.25
                           1.25 if noncompliant_share <= 0.50
                           1.50 otherwise
      base_recovery_cents = round_half_up(award.disbursed_to_date_cents
                                          * failed_location_count
                                          / award.confirmed_location_count, 0)
      recovery_amount_cents = min(award.disbursed_to_date_cents,
                                  round_half_up(base_recovery_cents * penalty_multiplier, 0))
    input_set: "The FAILED ComplianceAudit's failed_location_ids, and the award's confirmed_location_count and disbursed_to_date_cents at notice-issuance time."
    constants:
      PENALTY_TIER_BREAKPOINTS: [0.10, 0.25, 0.50]
      PENALTY_TIER_MULTIPLIERS: [1.00, 1.10, 1.25, 1.50]
    precision: "Share rounded to 4 decimals before tier selection; base recovery uses the exact unrounded fraction of disbursed_to_date_cents and is rounded once, then the multiplier product is rounded once and clamped."
    variants: []
    note: "Tier boundaries are inclusive on the upper edge: a share of exactly 0.5000 selects 1.25, not 1.50."

  - name: program_scoring_posture
    trigger: "Every mutation that changes program_state, or that changes any ScoreSheet.score_state of the program (challenge cascade hop 4, score-sheet creation, award termination)"
    algorithm: aggregation
    formula: |
      stale_score_sheet_count = count(ScoreSheet rows whose application.program_id == this program
                                      AND score_state == STALE)
      scoring_posture = FROZEN     if program_state IN {DRAFT, CHALLENGE_OPEN, ALLOCATION_CLOSED}
                        RESTRICTED if program_state IN {CHALLENGE_CLOSED, SCORING}
                                      AND stale_score_sheet_count >= 1
                        OPEN       otherwise
      # FROZEN and RESTRICTED both block POST /broadband/applications/{id}/select and
      # POST /broadband/awards (ERR_SCORING_POSTURE_RESTRICTED); OPEN permits them.
    input_set: "The GrantProgram row and every ScoreSheet whose application belongs to it, with no time window."
    constants: {}
    precision: "Integer counts."
    variants: []

# =============================================================================
# 1.4 Validation Rules (evaluated in ascending priority; first violation wins)
# =============================================================================
validations:
  - priority: 10
    category: auth
    rule: "X-User-ID header present and non-empty on every endpoint except POST /_clock/set_current_utc."
    error_id: ERR_UNAUTHENTICATED
  - priority: 12
    category: authz
    rule: "X-User-Role header present, is one of the nine declared roles, and appears in the endpoint's allowed_roles list."
    error_id: ERR_UNAUTHORIZED
  - priority: 14
    category: request_validity
    rule: "Body parses as JSON; every required input field present; enum values in range; integer fields are integers; percentage fields within 0..100; *_cents fields >= 0; ISO-8601 timestamps parse and carry an explicit UTC offset."
    error_id: ERR_INVALID_REQUEST
  - priority: 16
    category: request_validity
    rule: "For list endpoints: limit is an integer in 1..100 and offset is an integer >= 0."
    error_id: ERR_INVALID_PAGINATION
  - priority: 20
    category: existence
    rule: "program_id in the path or body resolves to a GrantProgram."
    error_id: ERR_PROGRAM_NOT_FOUND
  - priority: 21
    category: existence
    rule: "location_id in the path or body resolves to an EligibleLocation."
    error_id: ERR_LOCATION_NOT_FOUND
  - priority: 22
    category: existence
    rule: "challenge_id in the path resolves to a Challenge."
    error_id: ERR_CHALLENGE_NOT_FOUND
  - priority: 23
    category: existence
    rule: "subgrantee_id in the path or body resolves to a Subgrantee."
    error_id: ERR_SUBGRANTEE_NOT_FOUND
  - priority: 24
    category: existence
    rule: "application_id in the path or body resolves to an Application."
    error_id: ERR_APPLICATION_NOT_FOUND
  - priority: 25
    category: existence
    rule: "award_id in the path or body resolves to an Award."
    error_id: ERR_AWARD_NOT_FOUND
  - priority: 26
    category: existence
    rule: "milestoneId in the path resolves to a Milestone whose award_id equals the path award id."
    error_id: ERR_MILESTONE_NOT_FOUND
  - priority: 27
    category: existence
    rule: "auditId in the path resolves to a ComplianceAudit whose award_id equals the path award id; environmental-review sub-path resolves to an existing EnvironmentalReview for that award."
    error_id: ERR_AUDIT_NOT_FOUND
  - priority: 28
    category: existence
    rule: "For POST /broadband/awards/{id}/environmental-review sub-actions, the award has an EnvironmentalReview row."
    error_id: ERR_ENVIRONMENTAL_REVIEW_NOT_FOUND
  - priority: 30
    category: authz
    rule: "Role Subgrantee acting on an Application, LocationClaim or Milestone: X-User-ID equals the owning Application.subgrantee_id (identity is entity_backed:Subgrantee, so X-User-ID is the Subgrantee id). Evidence appends: X-User-ID must equal either challenge.submitter_user_id (the item is recorded on the CHALLENGE side) or the challenged location's reporting_provider_user_id (the item is recorded on the REBUTTAL side); any other caller is refused. Challenge resubmit: X-User-ID equals challenge.submitter_user_id."
    error_id: ERR_NOT_RESOURCE_OWNER
  - priority: 32
    category: authz
    rule: "Segregation of duties: (a) challenge.triaged_by_user_id != the determine caller; (b) subgrantee.capability_reviewer_user_id != the POST /broadband/score-sheets caller for that subgrantee's applications; (c) award.last_verifier_user_id != the caller of record-result and of verify-remediation on the same award."
    error_id: ERR_SEGREGATION_OF_DUTIES
  - priority: 40
    category: state
    rule: "GrantProgram.program_state permits the operation (POST /broadband/locations requires DRAFT|CHALLENGE_OPEN; POST /broadband/challenges and POST /broadband/challenges/{id}/evidence require CHALLENGE_OPEN; the challenge adjudication actions triage, close-rebuttal, request-additional-evidence, determine and resubmit are permitted in CHALLENGE_OPEN|CHALLENGE_CLOSED|SCORING so that a late determination can still cascade into scoring; open-challenge-window requires DRAFT; close-challenge-window requires CHALLENGE_OPEN; open-scoring requires CHALLENGE_CLOSED; close-allocation, score-sheets and select require SCORING; subgrantees, applications and location-claims require CHALLENGE_OPEN|CHALLENGE_CLOSED|SCORING; ALLOCATION_CLOSED blocks every program-scoped mutation)."
    error_id: ERR_PROGRAM_STATE_INVALID
  - priority: 41
    category: state
    rule: "Challenge.challenge_state permits the transition (evidence append requires SUBMITTED|REBUTTAL_OPEN|UNDER_REVIEW|DEFICIENT; triage requires SUBMITTED; close-rebuttal requires REBUTTAL_OPEN; request-additional-evidence and determine require UNDER_REVIEW; resubmit requires DEFICIENT; SUSTAINED and REJECTED are terminal)."
    error_id: ERR_CHALLENGE_STATE_INVALID
  - priority: 42
    category: state
    rule: "Subgrantee.capability_state permits the transition (begin-capability-review requires REGISTERED|REMEDIATION_REQUIRED; record-capability-determination requires UNDER_CAPABILITY_REVIEW; submit-remediation requires REMEDIATION_REQUIRED; DISQUALIFIED is terminal)."
    error_id: ERR_SUBGRANTEE_STATE_INVALID
  - priority: 43
    category: state
    rule: "Application.application_state permits the operation (location-claims require DRAFT|RETURNED_FOR_CURE; submit requires DRAFT|RETURNED_FOR_CURE; return-for-cure requires SUBMITTED; score-sheets require SUBMITTED|RESCORE_REQUIRED; select requires SCORED; AWARDED and NOT_SELECTED are terminal)."
    error_id: ERR_APPLICATION_STATE_INVALID
  - priority: 44
    category: state
    rule: "POST /broadband/awards requires application_state == SELECTED; a NOT_SELECTED or SCORED application cannot be obligated."
    error_id: ERR_APPLICATION_NOT_SELECTED
  - priority: 45
    category: state
    rule: "Award.award_state permits the operation (environmental-review actions require OBLIGATED; authorize-construction requires OBLIGATED with cleared review; milestones require CONSTRUCTION_AUTHORIZED|IN_CONSTRUCTION; compliance-audits require IN_CONSTRUCTION|CLOSED; TERMINATED is terminal)."
    error_id: ERR_AWARD_STATE_INVALID
  - priority: 46
    category: state
    rule: "Milestone.milestone_state permits the transition (submit-evidence requires PLANNED|REJECTED; verify requires EVIDENCE_SUBMITTED; disburse requires APPROVED; DISBURSED and VOIDED are terminal; a HELD milestone accepts no direct call and returns to EVIDENCE_SUBMITTED only via verify-remediation on the failing audit)."
    error_id: ERR_MILESTONE_STATE_INVALID
  - priority: 47
    category: state
    rule: "ComplianceAudit.audit_state permits the transition (record-result requires SCHEDULED; issue-clawback-notice requires FAILED|APPEALED; appeal requires CLAWBACK_NOTICE_ISSUED; resolve-clawback with SETTLED requires CLAWBACK_NOTICE_ISSUED and with WAIVED requires APPEALED; verify-remediation requires FAILED; PASSED, REMEDIATED, CLAWBACK_SETTLED and CLAWBACK_WAIVED are terminal)."
    error_id: ERR_AUDIT_STATE_INVALID
  - priority: 48
    category: state
    rule: "EnvironmentalReview.ehp_state permits the transition (determination requires SCREENING|EA_REQUIRED; clear requires CATEGORICAL_EXCLUSION|MITIGATION_REQUIRED|BLOCKED). BLOCKED is deliberately admitted by this check so that the domain-specific refusal at priority 56 is the one the caller sees; CLEARED is terminal."
    error_id: ERR_EHP_STATE_INVALID
  - priority: 49
    category: state
    rule: "GrantProgram.scoring_posture must be OPEN for POST /broadband/applications/{id}/select and POST /broadband/awards; FROZEN or RESTRICTED blocks both."
    error_id: ERR_SCORING_POSTURE_RESTRICTED
  - priority: 50
    category: concurrency
    rule: "expected_challenge_version matches the Challenge's current version on POST /broadband/challenges/{id}/evidence."
    error_id: ERR_STALE_CHALLENGE_VERSION
  - priority: 51
    category: concurrency
    rule: "expected_application_version matches the Application's current version on POST /broadband/score-sheets."
    error_id: ERR_STALE_APPLICATION_VERSION
  - priority: 55
    category: business_safety
    rule: "POST /broadband/awards/{id}/authorize-construction requires the award to have an EnvironmentalReview whose ehp_state == CLEARED."
    error_id: ERR_EHP_NOT_CLEARED
  - priority: 56
    category: business_safety
    rule: "POST /broadband/awards/{id}/environmental-review/clear is refused when ehp_state == BLOCKED (pathway == ADVERSE_EFFECT): an adverse effect finding cannot be cleared, only the award can be terminated."
    error_id: ERR_EHP_ADVERSE_EFFECT_BLOCKING
  - priority: 60
    category: business_referential
    rule: "built_location_ids on submit-evidence, planned_location_ids on milestone creation, and failed_location_ids on record-result must all reference locations whose eligibility_state == AWARD_BOUND under this award (location.awarded_award_id == award.id)."
    error_id: ERR_LOCATION_NOT_IN_AWARD_SCOPE
  - priority: 61
    category: business_referential
    rule: "A Challenge's location_id must belong to the same program_id as the challenge; a LocationClaim's location must belong to the application's program."
    error_id: ERR_PROGRAM_SCOPE_MISMATCH
  - priority: 65
    category: business_temporal
    rule: "POST /broadband/challenges and its evidence appends require program.challenge_window_start <= now < program.challenge_window_end (half-open)."
    error_id: ERR_CHALLENGE_WINDOW_CLOSED
  - priority: 66
    category: business_temporal
    rule: "POST /broadband/applications/{id}/submit requires program.application_window_start <= now < program.application_window_end (half-open)."
    error_id: ERR_APPLICATION_WINDOW_CLOSED
  - priority: 67
    category: business_temporal
    rule: "POST /broadband/challenges/{id}/close-rebuttal requires now >= challenge.rebuttal_deadline (stamped at triage as triage time + REBUTTAL_WINDOW_DAYS, and re-stamped on every request-additional-evidence)."
    error_id: ERR_REBUTTAL_DEADLINE_NOT_REACHED
  - priority: 68
    category: business_temporal
    rule: "A new ComplianceAudit's closed window [window_start, window_end] must not overlap, nor sit within AUDIT_BUFFER_HOURS = 24 of, the window of any existing non-terminal ComplianceAudit on the same award."
    error_id: ERR_AUDIT_WINDOW_BUFFER_CONFLICT
  - priority: 69
    category: business_temporal
    rule: "A new LocationClaim's construction window, taken from its application as [proposed_construction_start, proposed_construction_end) (half-open), must not overlap the window of another non-RELEASED LocationClaim on the same location; touching endpoints (existing end == new start) are allowed."
    error_id: ERR_LOCATION_CLAIM_WINDOW_CONFLICT
  - priority: 70
    category: business_temporal
    rule: "proposed_construction_start < proposed_construction_end on application creation, window_start < window_end on audit creation, and challenge_window_start < challenge_window_end plus application_window_start < application_window_end on program creation."
    error_id: ERR_WINDOW_ORDER_INVALID
  - priority: 75
    category: business_constraint
    rule: "At most one non-terminal Challenge per (location_id, submitter_user_id) pair."
    error_id: ERR_DUPLICATE_CHALLENGE
  - priority: 76
    category: business_constraint
    rule: "POST /broadband/challenges/{id}/triage and .../determine with outcome == SUSTAINED require calculations.challenge_evidence_sufficiency.sufficient == true; conversely .../determine with outcome == DEFICIENT requires rebuttal_strength_score >= evidence_sufficiency_score, so DEFICIENT is exactly the complement of the priority 77 refusal and is the only outcome that reopens the resubmission cycle."
    error_id: ERR_EVIDENCE_STANDARD_NOT_MET
  - priority: 77
    category: business_constraint
    rule: "determine with determination == SUSTAINED is refused when rebuttal_strength_score >= evidence_sufficiency_score (the challenge must strictly exceed the rebuttal)."
    error_id: ERR_REBUTTAL_PREVAILS
  - priority: 78
    category: business_constraint
    rule: "POST /broadband/challenges/{id}/request-additional-evidence is refused once rebuttal_round == MAX_REBUTTAL_ROUNDS (2)."
    error_id: ERR_REBUTTAL_ROUND_EXHAUSTED
  - priority: 79
    category: business_constraint
    rule: "POST /broadband/applications/{id}/submit is refused once application.returned_for_cure_count == MAX_APPLICATION_CURES (2); POST /broadband/challenges/{id}/resubmit is refused once challenge.resubmission_count == MAX_CHALLENGE_RESUBMISSIONS (2); POST .../milestones/{milestoneId}/submit-evidence is refused once milestone.resubmission_count == MAX_MILESTONE_RESUBMISSIONS (2)."
    error_id: ERR_RESUBMISSION_LIMIT_REACHED
  - priority: 80
    category: business_constraint
    rule: "Application submit requires committed_down_mbps >= 100 and committed_up_mbps >= 20."
    error_id: ERR_SPEED_COMMITMENT_BELOW_MINIMUM
  - priority: 81
    category: business_constraint
    rule: "Application submit requires match_offer_pct >= program.min_match_pct."
    error_id: ERR_MATCH_BELOW_MINIMUM
  - priority: 82
    category: business_constraint
    rule: "POST /broadband/score-sheets and POST /broadband/awards require the application's Subgrantee.capability_state == QUALIFIED."
    error_id: ERR_SUBGRANTEE_NOT_QUALIFIED
  - priority: 83
    category: business_constraint
    rule: "POST /broadband/score-sheets requires at least one LocationClaim with claim_state == CLAIMED_ELIGIBLE (final denominator >= 1)."
    error_id: ERR_NO_ELIGIBLE_LOCATIONS
  - priority: 84
    category: business_constraint
    rule: "EligibleLocation.address_id is unique within a program; LocationClaim is unique per (application_id, location_id)."
    error_id: ERR_DUPLICATE_LOCATION_ADDRESS
  - priority: 85
    category: business_constraint
    rule: "Only one non-TERMINATED Award may exist per application, and a location may be AWARD_BOUND to at most one award."
    error_id: ERR_AWARD_ALREADY_EXISTS
  - priority: 86
    category: business_constraint
    rule: "At most one Milestone per award may have is_final == true, and the final milestone cannot be verified while another milestone is in PLANNED, EVIDENCE_SUBMITTED or HELD."
    error_id: ERR_FINAL_MILESTONE_CONFLICT
  - priority: 90
    category: business_fiscal
    rule: "POST /broadband/awards is refused when every CLAIMED_ELIGIBLE claim exceeds the EHCL threshold, leaving no retained location."
    error_id: ERR_ALL_LOCATIONS_EHCL_DEFERRED
  - priority: 91
    category: business_fiscal
    rule: "POST /broadband/awards is refused when obligation_amount_cents > program.uncommitted_balance_cents."
    error_id: ERR_PROGRAM_FUNDS_EXHAUSTED
  - priority: 92
    category: business_fiscal
    rule: "POST /broadband/awards/{id}/milestones/{milestoneId}/disburse requires payable_amount_cents > 0."
    error_id: ERR_NO_DISBURSABLE_AMOUNT
  - priority: 93
    category: business_fiscal
    rule: "POST .../compliance-audits/{auditId}/resolve-clawback with resolution == SETTLED requires settled_amount_cents in 1..recovery_amount_cents."
    error_id: ERR_CLAWBACK_AMOUNT_INVALID

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving surface -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["all window, deadline and recency comparisons use the new logical now"]

  # --- GrantProgram --------------------------------------------------------
  - method: POST
    path: "/broadband/programs"
    description: "Create a grant program round with its thresholds and windows."
    roles: [ProgramAdmin]
    code: 201
    input: [name, fiscal_year, total_appropriation_cents, challenge_window_start, challenge_window_end, application_window_start, application_window_end, "min_match_pct?", "holdback_pct?", "unserved_down_mbps_threshold?", "unserved_up_mbps_threshold?", "served_down_mbps_threshold?", "served_up_mbps_threshold?", "max_latency_ms?", "ehcl_threshold_cents?", "ehcl_waiver_enabled?"]
    output: GrantProgram
    side_effects: ["program_state := DRAFT", "uncommitted_balance_cents := total_appropriation_cents", "obligated_balance_cents := 0", "disbursed_balance_cents := 0", "calculations.program_scoring_posture -> FROZEN"]
  - method: GET
    path: "/broadband/programs/{id}"
    description: "Fetch one grant program with its computed balances and scoring posture."
    roles: [ProgramAdmin, EligibilityAnalyst, CapabilityReviewer, ScoringOfficer, EnvironmentalReviewer, AuditOfficer, Subgrantee, Challenger, Provider]
    code: 200
    input: []
    output: GrantProgram
    side_effects: []
  - method: GET
    path: "/broadband/programs"
    description: "List grant programs, filterable by fiscal year and state."
    roles: [ProgramAdmin, EligibilityAnalyst, ScoringOfficer, Subgrantee]
    code: 200
    input: ["fiscal_year?", "program_state?", "limit?", "offset?"]
    output: GrantProgram[]
    side_effects: []
  - method: POST
    path: "/broadband/programs/{id}/open-challenge-window"
    description: "Move a DRAFT program into CHALLENGE_OPEN so challenges may be filed."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: GrantProgram
    side_effects: ["program_state := CHALLENGE_OPEN", "calculations.program_scoring_posture -> FROZEN"]
  - method: POST
    path: "/broadband/programs/{id}/close-challenge-window"
    description: "Close the challenge window; every still-MAPPED location is AFFIRMED."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: GrantProgram
    side_effects: ["program_state := CHALLENGE_CLOSED", "each EligibleLocation MAPPED -> AFFIRMED", "calculations.program_scoring_posture"]
  - method: POST
    path: "/broadband/programs/{id}/open-scoring"
    description: "Open the scoring phase so score sheets may be produced."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: GrantProgram
    side_effects: ["program_state := SCORING", "calculations.program_scoring_posture"]
  - method: POST
    path: "/broadband/programs/{id}/close-allocation"
    description: "Close allocation; every SCORED application that was never selected becomes NOT_SELECTED."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: GrantProgram
    side_effects: ["program_state := ALLOCATION_CLOSED", "each Application SCORED -> NOT_SELECTED", "calculations.program_scoring_posture -> FROZEN"]

  # --- EligibleLocation ----------------------------------------------------
  - method: POST
    path: "/broadband/locations"
    description: "Ingest one national-map location record and classify it."
    roles: [ProgramAdmin, EligibilityAnalyst]
    code: 201
    input: [program_id, address_id, reported_down_mbps, reported_up_mbps, reported_latency_ms, reported_technology, reporting_provider_user_id]
    output: EligibleLocation
    side_effects: ["calculations.location_classification -> classification_status", "classification_source := NATIONAL_MAP", "eligibility_state := MAPPED", "service_state := NOT_BUILT", "program.location_count_total incremented"]
  - method: GET
    path: "/broadband/locations/{id}"
    description: "Fetch one eligible location with both of its state axes."
    roles: [ProgramAdmin, EligibilityAnalyst, ScoringOfficer, AuditOfficer, Subgrantee, Challenger, Provider]
    code: 200
    input: []
    output: EligibleLocation
    side_effects: []
  - method: GET
    path: "/broadband/locations"
    description: "List locations filtered by program, classification, either state axis, or the award they are bound to."
    roles: [ProgramAdmin, EligibilityAnalyst, ScoringOfficer, AuditOfficer, Subgrantee, Challenger, Provider]
    code: 200
    input: ["program_id?", "classification_status?", "eligibility_state?", "service_state?", "awarded_award_id?", "limit?", "offset?"]
    output: EligibleLocation[]
    side_effects: []
  - method: GET
    path: "/broadband/locations/{id}/location-claims"
    description: "List every claim filed against this location across applications (FK reverse-reachability for LocationClaim.location_id)."
    roles: [ProgramAdmin, EligibilityAnalyst, ScoringOfficer, AuditOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: LocationClaim[]
    side_effects: []

  # --- Challenge -----------------------------------------------------------
  - method: POST
    path: "/broadband/challenges"
    description: "File a challenge contesting a location's classification."
    roles: [Challenger, Provider]
    code: 201
    input: [program_id, location_id, challenger_type, asserted_classification, rationale]
    output: Challenge
    side_effects: ["challenge_state := SUBMITTED", "submitter_user_id := X-User-ID", "required_sufficiency_threshold stamped from challenger_type", "rebuttal_round := 0", "resubmission_count := 0", "location.challenge_count incremented"]
  - method: GET
    path: "/broadband/challenges/{id}"
    description: "Fetch one challenge with its evidence scores and rebuttal counters."
    roles: [ProgramAdmin, EligibilityAnalyst, ScoringOfficer, Challenger, Provider]
    code: 200
    input: []
    output: Challenge
    side_effects: []
  - method: GET
    path: "/broadband/challenges"
    description: "List challenges filtered by program, contested location or state (FK reverse-reachability for Challenge.program_id and Challenge.location_id)."
    roles: [ProgramAdmin, EligibilityAnalyst, ScoringOfficer, Challenger, Provider]
    code: 200
    input: ["program_id?", "location_id?", "challenge_state?", "challenger_type?", "limit?", "offset?"]
    output: Challenge[]
    side_effects: []
  - method: POST
    path: "/broadband/challenges/{id}/evidence"
    description: "Append one immutable evidence item to a challenge. The challenge's submitter appends CHALLENGE-side items; the challenged location's reporting provider appends REBUTTAL-side items. Optimistically concurrent on the parent challenge."
    roles: [Challenger, Provider]
    code: 201
    input: [evidence_type, collected_at, description, expected_challenge_version]
    output: ChallengeEvidence
    side_effects: ["submitter_side := CHALLENGE when X-User-ID == challenge.submitter_user_id, else REBUTTAL", "base_weight stamped from EVIDENCE_WEIGHTS and recency_multiplier from collected_at against challenge.created_at", "evidence_state := ACCEPTED, or STALE_EXCLUDED when the item is older than 365 days","calculations.challenge_evidence_sufficiency re-evaluated", "challenge.evidence_sufficiency_score / rebuttal_strength_score / distinct_evidence_type_count re-stamped", "increments Challenge.version by 1"]
  - method: GET
    path: "/broadband/challenges/{id}/evidence"
    description: "List the evidence items of a challenge (FK reverse-reachability for ChallengeEvidence.challenge_id)."
    roles: [ProgramAdmin, EligibilityAnalyst, Challenger, Provider]
    code: 200
    input: ["limit?", "offset?"]
    output: ChallengeEvidence[]
    side_effects: []
  - method: POST
    path: "/broadband/challenges/{id}/triage"
    description: "Accept a challenge for review, open the rebuttal window and mark the location as contested."
    roles: [EligibilityAnalyst]
    code: 200
    input: []
    output: Challenge
    side_effects: ["challenge_state := REBUTTAL_OPEN", "triaged_by_user_id := X-User-ID", "rebuttal_deadline := now + 30 days", "location.eligibility_state MAPPED -> CHALLENGED"]
  - method: POST
    path: "/broadband/challenges/{id}/close-rebuttal"
    description: "Close the rebuttal window once its deadline has passed and move the challenge to review."
    roles: [EligibilityAnalyst]
    code: 200
    input: []
    output: Challenge
    side_effects: ["challenge_state := UNDER_REVIEW"]
  - method: POST
    path: "/broadband/challenges/{id}/request-additional-evidence"
    description: "Reopen the rebuttal window for another round (at most two rounds)."
    roles: [EligibilityAnalyst]
    code: 200
    input: [reason]
    output: Challenge
    side_effects: ["challenge_state := REBUTTAL_OPEN", "rebuttal_round incremented", "rebuttal_deadline := now + 30 days"]
  - method: POST
    path: "/broadband/challenges/{id}/determine"
    description: "Determine a challenge SUSTAINED, REJECTED or DEFICIENT; a SUSTAINED determination starts the four-hop reclassification cascade."
    roles: [EligibilityAnalyst, ProgramAdmin]
    code: 200
    input: [outcome, "determination_note?"]
    output: Challenge
    side_effects: ["challenge_state := SUSTAINED | REJECTED | DEFICIENT", "determined_by_user_id := X-User-ID", "cascade hop 1: location.classification_status re-stamped from asserted_classification, classification_source := CHALLENGE_DETERMINATION, eligibility_state -> RECLASSIFIED or AFFIRMED", "cascade hop 2: affected LocationClaim rows flip claim_state and calculations.application_cost_per_location is re-run", "cascade hop 3: ScoreSheet -> STALE and Application SCORED -> RESCORE_REQUIRED", "cascade hop 4: calculations.program_scoring_posture -> RESTRICTED"]
  - method: POST
    path: "/broadband/challenges/{id}/resubmit"
    description: "Resubmit a DEFICIENT challenge with a corrected rationale (at most two resubmissions)."
    roles: [Challenger, Provider]
    code: 200
    input: ["rationale?"]
    output: Challenge
    side_effects: ["challenge_state := SUBMITTED", "resubmission_count incremented", "location.eligibility_state AFFIRMED -> CHALLENGED"]

  # --- Subgrantee ----------------------------------------------------------
  - method: POST
    path: "/broadband/subgrantees"
    description: "Register a prospective subgrantee with its declared financial and managerial figures."
    roles: [ProgramAdmin]
    code: 201
    input: [program_id, legal_name, ein, net_assets_cents, requested_amount_cents, key_personnel_count, has_prior_federal_award]
    output: Subgrantee
    side_effects: ["capability_state := REGISTERED", "remediation_count := 0", "withdrawn_personnel_count := 0"]
  - method: GET
    path: "/broadband/subgrantees/{id}"
    description: "Fetch one subgrantee with its capability components and index."
    roles: [ProgramAdmin, CapabilityReviewer, ScoringOfficer, AuditOfficer, Subgrantee]
    code: 200
    input: []
    output: Subgrantee
    side_effects: []
  - method: GET
    path: "/broadband/subgrantees"
    description: "List subgrantees filtered by program or capability state (FK reverse-reachability for Subgrantee.program_id)."
    roles: [ProgramAdmin, CapabilityReviewer, ScoringOfficer, AuditOfficer]
    code: 200
    input: ["program_id?", "capability_state?", "limit?", "offset?"]
    output: Subgrantee[]
    side_effects: []
  - method: POST
    path: "/broadband/subgrantees/{id}/begin-capability-review"
    description: "Open technical, financial and managerial capability review."
    roles: [CapabilityReviewer]
    code: 200
    input: []
    output: Subgrantee
    side_effects: ["capability_state := UNDER_CAPABILITY_REVIEW", "capability_reviewer_user_id := X-User-ID", "review_variant := INITIAL on the first review, REMEDIATION afterwards"]
  - method: POST
    path: "/broadband/subgrantees/{id}/record-capability-determination"
    description: "Record the technical raw score and derive the capability index, qualifying, remediating or disqualifying the subgrantee."
    roles: [CapabilityReviewer]
    code: 200
    input: [technical_raw_score, "determination_note?"]
    output: Subgrantee
    side_effects: ["calculations.subgrantee_capability_index", "capability_state := QUALIFIED when capability_index >= 70.00 and technical_component >= 24.00 and financial_component >= 17.50", "capability_state := REMEDIATION_REQUIRED when 55.00 <= capability_index < 70.00 or a floor is missed", "capability_state := DISQUALIFIED when capability_index < 55.00 or remediation_count == 1 and still short"]
  - method: POST
    path: "/broadband/subgrantees/{id}/submit-remediation"
    description: "Supply audited financials and withdrawn-personnel corrections to reopen capability review."
    roles: [Subgrantee, ProgramAdmin]
    code: 200
    input: [audited_net_assets_cents, withdrawn_personnel_count]
    output: Subgrantee
    side_effects: ["capability_state := UNDER_CAPABILITY_REVIEW", "remediation_count incremented", "review_variant := REMEDIATION"]

  # --- Application / LocationClaim / ScoreSheet -----------------------------
  - method: POST
    path: "/broadband/applications"
    description: "Open a draft subgrantee application with its speed, affordability and workforce commitments."
    roles: [Subgrantee, ProgramAdmin]
    code: 201
    input: [program_id, subgrantee_id, match_offer_pct, committed_down_mbps, committed_up_mbps, committed_latency_ms, low_cost_plan_price_cents, participates_in_state_affordability_program, has_dbe_plan, has_union_agreement, local_hire_pct, proposed_construction_start, proposed_construction_end]
    output: Application
    side_effects: ["application_state := DRAFT", "claim_count := 0", "returned_for_cure_count := 0"]
  - method: GET
    path: "/broadband/applications/{id}"
    description: "Fetch one application with both cost-per-location variants and its current score."
    roles: [ProgramAdmin, ScoringOfficer, CapabilityReviewer, AuditOfficer, Subgrantee]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: GET
    path: "/broadband/applications"
    description: "List applications filtered by program, subgrantee or state (FK reverse-reachability for Application.program_id and Application.subgrantee_id)."
    roles: [ProgramAdmin, ScoringOfficer, CapabilityReviewer, AuditOfficer, Subgrantee]
    code: 200
    input: ["program_id?", "subgrantee_id?", "application_state?", "limit?", "offset?"]
    output: Application[]
    side_effects: []
  - method: POST
    path: "/broadband/applications/{id}/submit"
    description: "Submit a draft or cured application for scoring."
    roles: [Subgrantee]
    code: 200
    input: []
    output: Application
    side_effects: ["application_state := SUBMITTED", "calculations.application_cost_per_location (both PRELIMINARY and FINAL variants stamped)"]
  - method: POST
    path: "/broadband/applications/{id}/return-for-cure"
    description: "Return a submitted application to the subgrantee for correction (at most two cures)."
    roles: [ScoringOfficer, ProgramAdmin]
    code: 200
    input: [cure_reason]
    output: Application
    side_effects: ["application_state := RETURNED_FOR_CURE", "returned_for_cure_count incremented"]
  - method: POST
    path: "/broadband/applications/{id}/select"
    description: "Select a scored application for award, allowed only while the program's scoring posture is OPEN."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Application
    side_effects: ["application_state := SELECTED"]
  - method: GET
    path: "/broadband/applications/{id}/location-claims"
    description: "List the location claims of an application (FK reverse-reachability for LocationClaim.application_id)."
    roles: [ProgramAdmin, ScoringOfficer, AuditOfficer, Subgrantee]
    code: 200
    input: ["limit?", "offset?"]
    output: LocationClaim[]
    side_effects: []
  - method: GET
    path: "/broadband/applications/{id}/score-sheets"
    description: "List the score sheets produced for an application, including STALE ones (FK reverse-reachability for ScoreSheet.application_id)."
    roles: [ProgramAdmin, ScoringOfficer, AuditOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: ScoreSheet[]
    side_effects: []
  - method: GET
    path: "/broadband/applications/{id}/awards"
    description: "List the awards obligated from an application (FK reverse-reachability for Award.application_id)."
    roles: [ProgramAdmin, ScoringOfficer, AuditOfficer, Subgrantee]
    code: 200
    input: ["limit?", "offset?"]
    output: Award[]
    side_effects: []
  - method: POST
    path: "/broadband/location-claims"
    description: "Claim one eligible location for a draft application at a declared build cost."
    roles: [Subgrantee]
    code: 201
    input: [application_id, location_id, claimed_cost_cents]
    output: LocationClaim
    side_effects: ["claim_state := CLAIMED_ELIGIBLE when the location is UNSERVED or UNDERSERVED, CLAIMED_INELIGIBLE when it is SERVED", "application.claim_count / total_project_cost_cents / eligible_project_cost_cents / confirmed_location_count re-derived", "calculations.application_cost_per_location"]
  - method: POST
    path: "/broadband/score-sheets"
    description: "Score a submitted or rescore-required application. Optimistically concurrent on the parent application."
    roles: [ScoringOfficer]
    code: 201
    input: [application_id, expected_application_version]
    output: ScoreSheet
    side_effects: ["calculations.application_total_score", "score_state := FINAL and any prior sheet of this application := SUPERSEDED", "application_state := SCORED", "application.current_total_score := total_score", "increments Application.version by 1", "calculations.program_scoring_posture re-evaluated"]

  # --- Award ---------------------------------------------------------------
  - method: POST
    path: "/broadband/awards"
    description: "Obligate an award to a selected application, running the pinned nine-step EHCL and match waterfall."
    roles: [ProgramAdmin]
    code: 201
    input: [application_id]
    output: Award
    side_effects: ["calculations.award_obligation_amount (steps 1-9)", "calculations.award_match_requirement (per-location rounding)", "award_state := OBLIGATED", "compliance_state := COMPLIANT", "EHCL claims -> EHCL_DEFERRED and their locations -> DEFERRED_HIGH_COST", "retained claims -> AWARD_BOUND and their locations -> AWARD_BOUND with awarded_award_id stamped", "application_state := AWARDED", "LedgerEntry OBLIGATION appended", "calculations.program_balance_reconciliation"]
  - method: GET
    path: "/broadband/awards/{id}"
    description: "Fetch one award with its obligation, holdback cap and disbursement totals."
    roles: [ProgramAdmin, ScoringOfficer, EnvironmentalReviewer, AuditOfficer, Subgrantee]
    code: 200
    input: []
    output: Award
    side_effects: []
  - method: GET
    path: "/broadband/awards"
    description: "List awards filtered by application, award state or compliance state."
    roles: [ProgramAdmin, EnvironmentalReviewer, AuditOfficer, Subgrantee]
    code: 200
    input: ["application_id?", "award_state?", "compliance_state?", "limit?", "offset?"]
    output: Award[]
    side_effects: []
  - method: POST
    path: "/broadband/awards/{id}/authorize-construction"
    description: "Authorize construction once environmental and historic preservation review is cleared."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Award
    side_effects: ["award_state := CONSTRUCTION_AUTHORIZED", "every AWARD_BOUND location service_state NOT_BUILT -> UNDER_CONSTRUCTION"]
  - method: POST
    path: "/broadband/awards/{id}/terminate"
    description: "Terminate an award, deobligating its undisbursed balance and releasing its locations."
    roles: [ProgramAdmin]
    code: 200
    input: [terminated_reason]
    output: Award
    side_effects: ["award_state := TERMINATED", "cascade hop 1: LedgerEntry DEOBLIGATION for obligation_amount_cents - disbursed_to_date_cents", "cascade hop 2: program balances re-derived by calculations.program_balance_reconciliation", "cascade hop 3: AWARD_BOUND claims -> RELEASED and non-DISBURSED milestones -> VOIDED", "cascade hop 4: released locations AWARD_BOUND -> AFFIRMED with awarded_award_id cleared, application AWARDED -> NOT_SELECTED, calculations.program_scoring_posture re-evaluated"]
  - method: GET
    path: "/broadband/awards/{id}/ledger-entries"
    description: "List the immutable ledger entries of an award (FK reverse-reachability for LedgerEntry.award_id)."
    roles: [ProgramAdmin, AuditOfficer, Subgrantee]
    code: 200
    input: ["limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []

  # --- EnvironmentalReview --------------------------------------------------
  - method: POST
    path: "/broadband/awards/{id}/environmental-review"
    description: "Open the environmental and historic preservation screening for an obligated award."
    roles: [EnvironmentalReviewer]
    code: 201
    input: [tribal_consultation_required, shpo_consultation_required]
    output: EnvironmentalReview
    side_effects: ["ehp_state := SCREENING"]
  - method: GET
    path: "/broadband/awards/{id}/environmental-review"
    description: "List the environmental review of an award; the array holds zero or one row (FK reverse-reachability for EnvironmentalReview.award_id)."
    roles: [ProgramAdmin, EnvironmentalReviewer, AuditOfficer, Subgrantee]
    code: 200
    input: ["limit?", "offset?"]
    output: EnvironmentalReview[]
    side_effects: []
  - method: POST
    path: "/broadband/awards/{id}/environmental-review/determination"
    description: "Record a screening or assessment determination, forking the review onto one of four pathways."
    roles: [EnvironmentalReviewer]
    code: 200
    input: [pathway, "mitigation_summary?"]
    output: EnvironmentalReview
    side_effects: ["ehp_state := CATEGORICAL_EXCLUSION | EA_REQUIRED | MITIGATION_REQUIRED | BLOCKED", "pathway stamped", "mitigation_summary stored on the MITIGATION_PLAN_ACCEPTED pathway"]
  - method: POST
    path: "/broadband/awards/{id}/environmental-review/clear"
    description: "Clear the review so construction may be authorized; refused outright on the adverse-effect pathway."
    roles: [EnvironmentalReviewer]
    code: 200
    input: []
    output: EnvironmentalReview
    side_effects: ["ehp_state := CLEARED", "cleared_by_user_id := X-User-ID", "cleared_at := now"]

  # --- Milestone ------------------------------------------------------------
  - method: POST
    path: "/broadband/awards/{id}/milestones"
    description: "Add a build milestone with its evidence basis and planned location set."
    roles: [ProgramAdmin]
    code: 201
    input: [sequence_no, description, evidence_basis, planned_location_ids, is_final]
    output: Milestone
    side_effects: ["milestone_state := PLANNED", "resubmission_count := 0"]
  - method: GET
    path: "/broadband/awards/{id}/milestones"
    description: "List the milestones of an award (FK reverse-reachability for Milestone.award_id)."
    roles: [ProgramAdmin, AuditOfficer, Subgrantee]
    code: 200
    input: ["limit?", "offset?"]
    output: Milestone[]
    side_effects: []
  - method: POST
    path: "/broadband/awards/{id}/milestones/{milestoneId}/submit-evidence"
    description: "Submit build-progress or invoiced-cost evidence for a milestone."
    roles: [Subgrantee]
    code: 200
    input: [built_location_ids, "invoiced_cost_cents?"]
    output: Milestone
    side_effects: ["milestone_state := EVIDENCE_SUBMITTED", "resubmission_count incremented when re-submitting after REJECTED"]
  - method: POST
    path: "/broadband/awards/{id}/milestones/{milestoneId}/verify"
    description: "Verify submitted build evidence and compute the payable amount under the milestone's variant."
    roles: [AuditOfficer, ProgramAdmin]
    code: 200
    input: [outcome, "rejection_reason?"]
    output: Milestone
    side_effects: ["milestone_state := APPROVED | REJECTED", "verified_location_count stamped from built_location_ids", "calculations.milestone_disbursement_amount -> payable_amount_cents", "verified_by_user_id := X-User-ID and award.last_verifier_user_id := X-User-ID", "verified locations service_state UNDER_CONSTRUCTION -> SERVICE_AVAILABLE"]
  - method: POST
    path: "/broadband/awards/{id}/milestones/{milestoneId}/disburse"
    description: "Disburse an approved milestone and certify its locations."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Milestone
    side_effects: ["milestone_state := DISBURSED", "LedgerEntry DISBURSEMENT for payable_amount_cents appended", "award.disbursed_to_date_cents increased", "award_state CONSTRUCTION_AUTHORIZED -> IN_CONSTRUCTION, or -> CLOSED when is_final", "verified locations service_state SERVICE_AVAILABLE -> CERTIFIED with certified_at stamped", "award.certified_location_count re-derived", "calculations.program_balance_reconciliation"]

  # --- ComplianceAudit ------------------------------------------------------
  - method: POST
    path: "/broadband/awards/{id}/compliance-audits"
    description: "Schedule a speed-test or service-availability audit over a closed window."
    roles: [AuditOfficer]
    code: 201
    input: [audit_type, window_start, window_end]
    output: ComplianceAudit
    side_effects: ["audit_state := SCHEDULED", "auditor_user_id := X-User-ID", "appeal_count := 0"]
  - method: GET
    path: "/broadband/awards/{id}/compliance-audits"
    description: "List the compliance audits of an award (FK reverse-reachability for ComplianceAudit.award_id)."
    roles: [ProgramAdmin, AuditOfficer, Subgrantee]
    code: 200
    input: ["limit?", "offset?"]
    output: ComplianceAudit[]
    side_effects: []
  - method: POST
    path: "/broadband/awards/{id}/compliance-audits/{auditId}/record-result"
    description: "Record the audit result; a FAILED result starts the three-hop noncompliance cascade."
    roles: [AuditOfficer]
    code: 200
    input: [result, tested_location_ids, "failed_location_ids?"]
    output: ComplianceAudit
    side_effects: ["audit_state := PASSED | FAILED", "tested_location_count and failed_location_count stamped", "calculations.clawback_recovery_amount stamps noncompliant_share and penalty_multiplier", "cascade hop 1: award.compliance_state COMPLIANT -> NONCOMPLIANT and failed locations service_state -> AUDIT_FAILED", "cascade hop 2: every EVIDENCE_SUBMITTED or APPROVED milestone -> HELD with payable_amount_cents zeroed", "cascade hop 3: the award's Subgrantee QUALIFIED -> SUSPENDED and open_noncompliance_count incremented"]
  - method: POST
    path: "/broadband/awards/{id}/compliance-audits/{auditId}/issue-clawback-notice"
    description: "Issue a clawback notice for the failed locations at the tiered penalty multiplier."
    roles: [AuditOfficer, ProgramAdmin]
    code: 200
    input: []
    output: ComplianceAudit
    side_effects: ["audit_state := CLAWBACK_NOTICE_ISSUED", "calculations.clawback_recovery_amount -> recovery_amount_cents", "notice_issued_by_user_id := X-User-ID"]
  - method: POST
    path: "/broadband/awards/{id}/compliance-audits/{auditId}/appeal"
    description: "Appeal an issued clawback notice."
    roles: [Subgrantee]
    code: 200
    input: [appeal_basis]
    output: ComplianceAudit
    side_effects: ["audit_state := APPEALED", "appeal_count incremented"]
  - method: POST
    path: "/broadband/awards/{id}/compliance-audits/{auditId}/resolve-clawback"
    description: "Settle or waive a clawback, recovering funds back to the program's uncommitted balance."
    roles: [ProgramAdmin]
    code: 200
    input: [resolution, "settled_amount_cents?"]
    output: ComplianceAudit
    side_effects: ["audit_state := CLAWBACK_SETTLED | CLAWBACK_WAIVED", "LedgerEntry CLAWBACK_RECOVERY for settled_amount_cents appended on SETTLED", "award.disbursed_to_date_cents reduced", "calculations.program_balance_reconciliation", "award.compliance_state := CURED"]
  - method: POST
    path: "/broadband/awards/{id}/compliance-audits/{auditId}/verify-remediation"
    description: "Verify that the failed locations were remediated, releasing held milestones and reinstating the subgrantee."
    roles: [AuditOfficer, ProgramAdmin]
    code: 200
    input: ["remediation_note?"]
    output: ComplianceAudit
    side_effects: ["audit_state := REMEDIATED", "failed locations service_state AUDIT_FAILED -> SERVICE_AVAILABLE", "HELD milestones -> EVIDENCE_SUBMITTED", "award.compliance_state := COMPLIANT", "Subgrantee SUSPENDED -> QUALIFIED when open_noncompliance_count reaches 0"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID header missing or empty."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "X-User-Role missing, unknown, or not in the endpoint's roles list."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, out-of-range enum, negative cents, non-integer count, or unparseable timestamp."
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100 or offset negative or non-integer."
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "No GrantProgram matches the supplied program id."
  - id: ERR_LOCATION_NOT_FOUND
    http: 404
    condition: "No EligibleLocation matches the supplied location id."
  - id: ERR_CHALLENGE_NOT_FOUND
    http: 404
    condition: "No Challenge matches the supplied challenge id."
  - id: ERR_SUBGRANTEE_NOT_FOUND
    http: 404
    condition: "No Subgrantee matches the supplied subgrantee id."
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "No Application matches the supplied application id."
  - id: ERR_AWARD_NOT_FOUND
    http: 404
    condition: "No Award matches the supplied award id."
  - id: ERR_MILESTONE_NOT_FOUND
    http: 404
    condition: "No Milestone matches the supplied milestoneId under the path award."
  - id: ERR_AUDIT_NOT_FOUND
    http: 404
    condition: "No ComplianceAudit matches the supplied auditId under the path award."
  - id: ERR_ENVIRONMENTAL_REVIEW_NOT_FOUND
    http: 404
    condition: "The award has no EnvironmentalReview row yet, but a determination or clear was attempted."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Caller holds an allowed role but does not own the resource: Subgrantee id mismatch, challenge submitter mismatch, or provider mismatch on the challenged location."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The caller already performed the conflicting upstream step (triage before determine, capability determination before scoring, milestone verification before audit result or remediation verification)."
  - id: ERR_PROGRAM_STATE_INVALID
    http: 409
    condition: "The program's program_state does not permit the requested operation."
  - id: ERR_CHALLENGE_STATE_INVALID
    http: 409
    condition: "The challenge's challenge_state does not permit the requested transition, including any call on a SUSTAINED or REJECTED challenge."
  - id: ERR_SUBGRANTEE_STATE_INVALID
    http: 409
    condition: "The subgrantee's capability_state does not permit the requested transition, including any call on a DISQUALIFIED subgrantee."
  - id: ERR_APPLICATION_STATE_INVALID
    http: 409
    condition: "The application's application_state does not permit the requested operation, including any call on an AWARDED or NOT_SELECTED application."
  - id: ERR_APPLICATION_NOT_SELECTED
    http: 409
    condition: "POST /broadband/awards was called for an application whose state is not SELECTED."
  - id: ERR_AWARD_STATE_INVALID
    http: 409
    condition: "The award's award_state does not permit the requested operation, including any call on a TERMINATED award."
  - id: ERR_MILESTONE_STATE_INVALID
    http: 409
    condition: "The milestone's milestone_state does not permit the requested transition, including any direct call on a HELD, DISBURSED or VOIDED milestone."
  - id: ERR_AUDIT_STATE_INVALID
    http: 409
    condition: "The audit's audit_state does not permit the requested transition, including any call on a terminal audit."
  - id: ERR_EHP_STATE_INVALID
    http: 409
    condition: "The environmental review's ehp_state does not permit the requested transition (determination on a decided review, or clear from SCREENING or EA_REQUIRED or CLEARED)."
  - id: ERR_SCORING_POSTURE_RESTRICTED
    http: 409
    condition: "Selection or obligation was attempted while the program's scoring_posture is FROZEN or RESTRICTED (at least one STALE score sheet outstanding)."
  - id: ERR_STALE_CHALLENGE_VERSION
    http: 412
    condition: "expected_challenge_version does not match the challenge's current version on an evidence append."
  - id: ERR_STALE_APPLICATION_VERSION
    http: 412
    condition: "expected_application_version does not match the application's current version on score-sheet creation."
  - id: ERR_EHP_NOT_CLEARED
    http: 409
    condition: "Construction authorization was attempted before the award's environmental review reached CLEARED."
  - id: ERR_EHP_ADVERSE_EFFECT_BLOCKING
    http: 422
    condition: "Clearing was attempted on a review whose ehp_state is BLOCKED because the assessment found an unmitigated adverse effect."
  - id: ERR_LOCATION_NOT_IN_AWARD_SCOPE
    http: 422
    condition: "A supplied location id is not AWARD_BOUND under the path award."
  - id: ERR_PROGRAM_SCOPE_MISMATCH
    http: 422
    condition: "A challenge's location, or a claim's location, belongs to a different program than the parent record."
  - id: ERR_CHALLENGE_WINDOW_CLOSED
    http: 409
    condition: "A challenge or evidence append was attempted outside the half-open challenge window."
  - id: ERR_APPLICATION_WINDOW_CLOSED
    http: 409
    condition: "An application submit was attempted outside the half-open application window."
  - id: ERR_REBUTTAL_DEADLINE_NOT_REACHED
    http: 409
    condition: "close-rebuttal was called before the challenge's rebuttal_deadline."
  - id: ERR_AUDIT_WINDOW_BUFFER_CONFLICT
    http: 409
    condition: "The requested audit window overlaps, or sits within 24 hours of, another non-terminal audit window on the same award."
  - id: ERR_LOCATION_CLAIM_WINDOW_CONFLICT
    http: 409
    condition: "The claiming application's construction window overlaps another non-RELEASED claim's window on the same location."
  - id: ERR_WINDOW_ORDER_INVALID
    http: 400
    condition: "A window's start is not strictly before its end."
  - id: ERR_DUPLICATE_CHALLENGE
    http: 409
    condition: "A non-terminal challenge already exists for this location and submitter."
  - id: ERR_EVIDENCE_STANDARD_NOT_MET
    http: 422
    condition: "Triage or a SUSTAINED determination was attempted while the challenge's evidence does not meet its challenger-type standard."
  - id: ERR_REBUTTAL_PREVAILS
    http: 422
    condition: "A SUSTAINED determination was attempted while rebuttal_strength_score is greater than or equal to evidence_sufficiency_score."
  - id: ERR_REBUTTAL_ROUND_EXHAUSTED
    http: 409
    condition: "request-additional-evidence was called after two rebuttal rounds."
  - id: ERR_RESUBMISSION_LIMIT_REACHED
    http: 409
    condition: "An application resubmit, challenge resubmit, or milestone evidence resubmit exceeded its limit of two."
  - id: ERR_SPEED_COMMITMENT_BELOW_MINIMUM
    http: 422
    condition: "Application submit with committed_down_mbps below 100 or committed_up_mbps below 20."
  - id: ERR_MATCH_BELOW_MINIMUM
    http: 422
    condition: "Application submit with match_offer_pct below the program's min_match_pct."
  - id: ERR_SUBGRANTEE_NOT_QUALIFIED
    http: 409
    condition: "Scoring or obligation was attempted while the application's subgrantee is not QUALIFIED."
  - id: ERR_NO_ELIGIBLE_LOCATIONS
    http: 422
    condition: "Score-sheet creation was attempted with no CLAIMED_ELIGIBLE claim, leaving the FINAL cost-per-location denominator at zero."
  - id: ERR_DUPLICATE_LOCATION_ADDRESS
    http: 409
    condition: "A location address_id is already registered in the program, or the same location is claimed twice by one application."
  - id: ERR_AWARD_ALREADY_EXISTS
    http: 409
    condition: "The application already has a non-TERMINATED award, or a claimed location is already AWARD_BOUND to another award."
  - id: ERR_FINAL_MILESTONE_CONFLICT
    http: 409
    condition: "A second final milestone was added, or the final milestone was verified while another milestone is still PLANNED, EVIDENCE_SUBMITTED or HELD."
  - id: ERR_ALL_LOCATIONS_EHCL_DEFERRED
    http: 422
    condition: "Every eligible claim exceeded the extremely-high-cost threshold, leaving no retained location to obligate."
  - id: ERR_PROGRAM_FUNDS_EXHAUSTED
    http: 422
    condition: "The computed obligation exceeds the program's uncommitted balance."
  - id: ERR_NO_DISBURSABLE_AMOUNT
    http: 422
    condition: "Disbursement was attempted with payable_amount_cents at or below zero, typically because the holdback cap is already exhausted."
  - id: ERR_CLAWBACK_AMOUNT_INVALID
    http: 422
    condition: "A SETTLED clawback resolution supplied settled_amount_cents outside 1..recovery_amount_cents."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "State broadband office program manager: creates programs and locations, advances program phases, selects applications, obligates awards, authorizes construction, disburses milestones and resolves clawbacks."
    identity: "opaque"
    exclusive_operations:
      - "POST /broadband/programs"
      - "POST /broadband/programs/{id}/open-challenge-window"
      - "POST /broadband/programs/{id}/close-challenge-window"
      - "POST /broadband/programs/{id}/open-scoring"
      - "POST /broadband/programs/{id}/close-allocation"
      - "POST /broadband/subgrantees"
      - "POST /broadband/applications/{id}/select"
      - "POST /broadband/awards"
      - "POST /broadband/awards/{id}/authorize-construction"
      - "POST /broadband/awards/{id}/terminate"
      - "POST /broadband/awards/{id}/milestones"
      - "POST /broadband/awards/{id}/milestones/{milestoneId}/disburse"
      - "POST /broadband/awards/{id}/compliance-audits/{auditId}/resolve-clawback"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /broadband/locations (with EligibilityAnalyst)"
      - "POST /broadband/challenges/{id}/determine (with EligibilityAnalyst)"
      - "POST /broadband/applications (with Subgrantee)"
      - "POST /broadband/applications/{id}/return-for-cure (with ScoringOfficer)"
      - "POST /broadband/subgrantees/{id}/submit-remediation (with Subgrantee)"
      - "POST /broadband/awards/{id}/milestones/{milestoneId}/verify (with AuditOfficer)"
      - "POST /broadband/awards/{id}/compliance-audits/{auditId}/issue-clawback-notice (with AuditOfficer)"
      - "POST /broadband/awards/{id}/compliance-audits/{auditId}/verify-remediation (with AuditOfficer)"
      - "all GET endpoints"
  - name: EligibilityAnalyst
    description: "Broadband office analyst who ingests national-map locations and runs the challenge adjudication workflow."
    identity: "opaque"
    exclusive_operations:
      - "POST /broadband/challenges/{id}/triage"
      - "POST /broadband/challenges/{id}/close-rebuttal"
      - "POST /broadband/challenges/{id}/request-additional-evidence"
    shared_operations:
      - "POST /broadband/locations (with ProgramAdmin)"
      - "POST /broadband/challenges/{id}/determine (with ProgramAdmin)"
      - "GET on programs, locations, challenges, challenge evidence, subgrantees"
  - name: CapabilityReviewer
    description: "Reviewer of technical, financial and managerial capability; may never score an application of a subgrantee it reviewed."
    identity: "opaque"
    exclusive_operations:
      - "POST /broadband/subgrantees/{id}/begin-capability-review"
      - "POST /broadband/subgrantees/{id}/record-capability-determination"
    shared_operations:
      - "GET on programs, subgrantees, applications"
  - name: ScoringOfficer
    description: "Scoring panel officer who produces score sheets and returns deficient applications for cure."
    identity: "opaque"
    exclusive_operations:
      - "POST /broadband/score-sheets"
    shared_operations:
      - "POST /broadband/applications/{id}/return-for-cure (with ProgramAdmin)"
      - "GET on programs, locations, challenges, subgrantees, applications, location claims, score sheets, awards"
  - name: EnvironmentalReviewer
    description: "Environmental and historic preservation reviewer who screens, determines a pathway, and clears awards for construction."
    identity: "opaque"
    exclusive_operations:
      - "POST /broadband/awards/{id}/environmental-review"
      - "POST /broadband/awards/{id}/environmental-review/determination"
      - "POST /broadband/awards/{id}/environmental-review/clear"
    shared_operations:
      - "GET on programs, awards, environmental reviews"
  - name: AuditOfficer
    description: "Deployment-obligation auditor who verifies milestone build evidence, schedules speed-test and service-availability audits, records results and issues clawback notices."
    identity: "opaque"
    exclusive_operations:
      - "POST /broadband/awards/{id}/compliance-audits"
      - "POST /broadband/awards/{id}/compliance-audits/{auditId}/record-result"
    shared_operations:
      - "POST /broadband/awards/{id}/milestones/{milestoneId}/verify (with ProgramAdmin)"
      - "POST /broadband/awards/{id}/compliance-audits/{auditId}/issue-clawback-notice (with ProgramAdmin)"
      - "POST /broadband/awards/{id}/compliance-audits/{auditId}/verify-remediation (with ProgramAdmin)"
      - "GET on programs, locations, subgrantees, applications, location claims, score sheets, awards, ledger entries, milestones, compliance audits"
  - name: Subgrantee
    description: "Applicant provider or cooperative. X-User-ID is the Subgrantee id, so ownership checks compare it to Application.subgrantee_id and to the subgrantee behind an award."
    identity: "entity_backed:Subgrantee"
    exclusive_operations:
      - "POST /broadband/applications/{id}/submit"
      - "POST /broadband/location-claims"
      - "POST /broadband/awards/{id}/milestones/{milestoneId}/submit-evidence"
      - "POST /broadband/awards/{id}/compliance-audits/{auditId}/appeal"
    shared_operations:
      - "POST /broadband/applications (with ProgramAdmin)"
      - "POST /broadband/subgrantees/{id}/submit-remediation (with ProgramAdmin)"
      - "GET on its own programs, locations, subgrantee, applications, location claims, awards, ledger entries, milestones, compliance audits"
  - name: Challenger
    description: "Community, local government or nonprofit filing a challenge; appends evidence only to challenges it submitted, which the server records on the CHALLENGE side."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /broadband/challenges (with Provider)"
      - "POST /broadband/challenges/{id}/evidence (with Provider; submitter_side follows X-User-ID, not the role)"
      - "POST /broadband/challenges/{id}/resubmit (with Provider)"
      - "GET on programs, locations, challenges, challenge evidence"
  - name: Provider
    description: "Incumbent internet service provider. Files provider-standard challenges, and appends evidence either as the submitter of its own challenge (CHALLENGE side) or as the reporting provider of a location someone else challenged (REBUTTAL side)."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /broadband/challenges (with Challenger)"
      - "POST /broadband/challenges/{id}/evidence (with Challenger; submitter_side follows X-User-ID, not the role)"
      - "POST /broadband/challenges/{id}/resubmit (with Challenger)"
      - "GET on programs, locations, challenges, challenge evidence"
