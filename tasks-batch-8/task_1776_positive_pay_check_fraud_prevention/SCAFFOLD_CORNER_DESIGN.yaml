          trigger:
            - { call: "POST /treasury/ops-runs", payload: { kind: "DAILY_SWEEP", enrollment_id: "${enr}" }, as: BankOps, captures: { n2: $.data.exceptions_defaulted, s2: $.data.checks_staled } }
