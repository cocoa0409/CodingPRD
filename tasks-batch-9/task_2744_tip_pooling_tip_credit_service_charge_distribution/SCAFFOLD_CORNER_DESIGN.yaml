            - "trigger 2 returns HTTP 412 with data.error_id == ERR_STALE_PAY_LINE_VERSION, and NOT ERR_SUPERSEDE_TARGET_MISMATCH, although it also omits the supersedes_correction_id that the PENDING ${c1_id} makes mandatory: priority 24 precedes priority 37"
            - "after trigger 2 GET /pay-lines/${line_id} still reports version == 3 and pending_correction_cents == 400, and GET /back-wage-corrections?pay_line_id=${line_id} reports total_count == 1"
            - "the captured ${v3} equals 3"
