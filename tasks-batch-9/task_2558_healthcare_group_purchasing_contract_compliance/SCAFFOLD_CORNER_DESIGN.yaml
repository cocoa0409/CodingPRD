            - "the final endorse by CR-1 returns 200 with ${st3} == ENDORSED and ${ed} == CR-1 — the originally blocked reviewer is freed by the handover"
            - "${ee} == true — the endorsement recomputed the contract flag"

      - name: every_role_may_set_the_logical_clock_and_read
