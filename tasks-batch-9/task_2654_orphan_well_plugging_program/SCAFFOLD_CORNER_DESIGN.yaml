      - name: duplicate_late_over_ceiling_bid_reports_the_duplicate_first
        claim_type: Priority Ordering
        grounds:
          - validations[priority 65].ERR_DUPLICATE_BID
          - validations[priority 67].ERR_BID_DEADLINE_PASSED
          - validations[priority 69].ERR_BID_EXCEEDS_CEILING
        distinguishing_aspect: |
          One payload violates all three bid rules at once and must report the lowest-numbered one,
          then each rule is isolated by removing the violations above it: a fresh contractor bidding
          late gets 67, and a fresh contractor bidding over the ceiling inside an open window gets 69.
          The 22200000-cent unit cost is over the 20000000 ceiling in every call, so an implementation
          that checks the cheapest-to-compute rule first fails the first two calls.
        test_recipe:
          setup:
            - "solicitation S1 OPEN with bid_due_at 2026-08-20 and ceiling 20000000, already holding one SUBMITTED bid from contractor C1"
            - "solicitation S2 OPEN with bid_due_at 2026-12-31 and ceiling 20000000 and no bids"
            - "the clock is then moved to 2026-08-21, past S1's deadline only"
          setup_api_calls:
            - call: "POST /contractors"
              payload: { name: "Bighorn Plugging", license_number: "P-A0001", bond_amount_cents: 2500000, performance_score: 89 }
              as: ProcurementOfficer
              as_user_id: "u_proc"
