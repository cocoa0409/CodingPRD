          assert:
            - "the first call is HTTP 422 with ${err_enum} == ERR_INVALID_ENUM, not ERR_VALIDATION"
            - "the second call is also HTTP 422 with ${err_case} == ERR_INVALID_ENUM: enum matching is exact and case-sensitive"
            - "the third call is HTTP 201 with data.squad == JUNIOR and data.squad_seq == 1"
            - "GET /swim-club/swim-team-registrations filtered by membership returns total_count == 1, so neither rejected request created a row"

      - name: type_constraints_season_close_date_must_be_after_open_date
        claim_type: type_constraints
        grounds:
          - entities.Season.fields.close_date
          - validations[priority=12]
          - errors[ERR_INVALID_TIME_RANGE]
        distinguishing_aspect: |
          The interval gate is strict, not merely ordered: an equal pair (close_date == open_date)
          must fail exactly as an inverted pair does, because a zero-length season would make
          total_days zero and divide by zero inside seasonal_dues_assessment. The gate is also
          distinct from ERR_VALIDATION - both dates are well-formed ISO dates here.
        test_recipe:
          setup:
            - "No season exists yet."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T09:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-09-06", close_date: "2027-05-22", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120 }
              as: BoardPresident
              captures: { err_inverted: $.data.error_id }
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-05-22", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120 }
              as: BoardPresident
              captures: { err_equal: $.data.error_id }
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-05-23", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120 }
              as: BoardPresident
              captures: { s_id: $.data.id, s_open: $.data.open_date, s_close: $.data.close_date }
          assert:
            - "the inverted pair is HTTP 422 with ${err_inverted} == ERR_INVALID_TIME_RANGE"
            - "the equal pair is HTTP 422 with ${err_equal} == ERR_INVALID_TIME_RANGE: the comparison is strictly greater-than"
            - "a one-day season (close_date == open_date + 1) is HTTP 201, so the gate is not off by one in the other direction"
            - "neither rejected request created a Season: GET /swim-club/seasons has total_count == 1"

      - name: parent_relationships_certification_requires_an_existing_lifeguard
        claim_type: parent_relationships
        grounds:
          - entities.Certification.parent
