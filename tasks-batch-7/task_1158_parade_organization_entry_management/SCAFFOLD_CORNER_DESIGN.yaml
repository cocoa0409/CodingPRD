            - { call: "POST /parades/${p_id}/dispersal-plan", payload: { emergency_lane_width_m: 4.0, dispersal_corridors: ["Pine Ave"] }, as: CommitteeAdmin, captures: { err2: $.data.error_id } }
          assert:
            - "second permit create -> error_id ERR_PERMIT_ALREADY_EXISTS (409)"
            - "second dispersal plan create -> error_id ERR_PLAN_ALREADY_EXISTS (409)"

      - name: duplicate_agency_endorsement_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_AGENCY_ENDORSEMENT]", entities.AgencyEndorsement.fields.agency_type]
        distinguishing_aspect: "A second POLICE endorsement while the first is still PENDING violates the (permit, agency_type) uniqueness over {PENDING, ENDORSED}."
        test_recipe:
          setup: ["One parade; permit with a PENDING POLICE endorsement"]
          setup_api_calls:
