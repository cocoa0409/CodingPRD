              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /specifications"
              payload: { program_id: "${prog_id}", title: "Spec one" }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { spec1_id: $.data.id }
            - call: "POST /specifications"
              payload: { program_id: "${prog_id}", title: "Spec two" }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { spec2_id: $.data.id }
          trigger:
