# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for this endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path id or body FK does not resolve"
  - id: ERR_NOT_OWNER
    http: 403
    condition: "Entity-backed identity mismatch (e.g. submitting another investigator's protocol)"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition not defined from current state"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Same user attempts both sides of a segregated duty (PI reviewing own protocol; reporter closing own deviation)"
  - id: ERR_TRAINING_INCOMPLETE
    http: 422
    condition: "Personnel lacks COMPLETED required training or CLEARED occ-health"
  - id: ERR_ANIMAL_CAP_EXCEEDED
    http: 422
    condition: "animals_used_count >= max_animals_justified on animal add"
  - id: ERR_PROTOCOL_NOT_APPROVED
    http: 409
    condition: "Protocol not APPROVED for animal add / room booking / adverse event"
  - id: ERR_CAGE_MISMATCH
    http: 422
    condition: "Species or protocol mismatch between animal and cage, or cage DECOMMISSIONED"
  - id: ERR_CAGE_OVER_CAPACITY
    http: 422
    condition: "effective_occupancy would exceed capacity_adults"
  - id: ERR_ROOM_CONFLICT
    http: 409
    condition: "Procedure-room booking overlaps existing CONFIRMED booking within turnover buffer"
  - id: ERR_LITTER_TOO_YOUNG
    http: 422
    condition: "Wean attempted before born_on + 21 days"
  - id: ERR_RESOLUTION_OVERDUE
    http: 422
    condition: "Resolve attempted after reported_at + 72h from UNDER_TREATMENT (must escalate first)"
  - id: ERR_INSPECTION_LAPSED
    http: 422
    condition: "Completion attempted after due_by"
  - id: ERR_CENSUS_DISCREPANCY
    http: 422
    condition: "Billing compute-provisional with any discrepancy != 0 census in period"
  - id: ERR_GRANT_INSOLVENT
    http: 402
    condition: "Posting would exceed grant budget_remaining_cents or grant expired before period_end"
  - id: ERR_GRANT_EXHAUSTED
    http: 402
    condition: "Protocol submission against a grant with zero remaining budget or past expiry"
  - id: ERR_DUPLICATE
    http: 409
    condition: "Uniqueness violation on email/grant_number/cage_barcode/animal_tag"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, bad type, out-of-range enum/integer"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC expected_*_version mismatch"
  - id: ERR_SERIOUS_DEVIATION_NOT_CLOSABLE
    http: 422
    condition: "close attempted on SERIOUS deviation under review"
  - id: ERR_INVALID_VOTE_TALLY
    http: 422
    condition: "review-decisions payload does not form a valid tally for the protocol's review path"
  - id: ERR_BOOKING_IN_PAST
    http: 422
    condition: "Room booking start_at before current logical clock time"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: IacucAdministrator
    description: "IACUC office administrator; runs reviews, inspections, suspensions, and registers investigators/grants/personnel"
    identity: "opaque"
    exclusive_operations:
      - "POST /iacuc/protocols/{id}/review-decisions"
      - "POST /iacuc/protocols/{id}/suspend"
      - "POST /iacuc/protocols/{id}/reinstate"
      - "POST /iacuc/protocol-deviations/{id}/begin-review"
      - "POST /iacuc/protocol-deviations/{id}/close"
      - "POST /iacuc/protocol-deviations/{id}/impose-suspension"
      - "POST /iacuc/inspections"
      - "POST /iacuc/inspections/{id}/complete"
      - "POST /iacuc/_clock/set_current_utc"
      - "POST /iacuc/investigators"
      - "POST /iacuc/grants"
      - "POST /iacuc/personnel"
    shared_operations:
      - "GET read endpoints"
  - name: Investigator
    description: "Principal investigator; owns protocols"
    identity: "entity_backed:Investigator"
    exclusive_operations:
      - "POST /iacuc/protocols"
      - "POST /iacuc/protocols/{id}/submit"
      - "POST /iacuc/protocols/{id}/personnel"
    shared_operations:
      - "POST /iacuc/protocol-deviations"
      - "GET read endpoints"
  - name: AnimalCareStaff
    description: "Vivarium husbandry staff; manages cages, animals, litters, census"
    identity: "entity_backed:Personnel"
    exclusive_operations:
      - "POST /iacuc/animals"
      - "POST /iacuc/animals/{id}/transfer"
      - "POST /iacuc/animals/{id}/retire"
      - "POST /iacuc/litters"
      - "POST /iacuc/litters/{id}/wean"
      - "POST /iacuc/litters/{id}/close"
      - "POST /iacuc/census-records"
    shared_operations:
      - "POST /iacuc/animals/{id}/euthanize"
      - "POST /iacuc/adverse-events"
      - "POST /iacuc/protocol-deviations"
      - "POST /iacuc/room-bookings"
      - "POST /iacuc/room-bookings/{id}/cancel"
      - "GET read endpoints"
  - name: AttendingVeterinarian
    description: "Veterinarian; manages adverse events and may euthanize"
    identity: "entity_backed:Personnel"
    exclusive_operations:
      - "POST /iacuc/adverse-events/{id}/begin-treatment"
      - "POST /iacuc/adverse-events/{id}/escalate"
      - "POST /iacuc/adverse-events/{id}/resolve"
