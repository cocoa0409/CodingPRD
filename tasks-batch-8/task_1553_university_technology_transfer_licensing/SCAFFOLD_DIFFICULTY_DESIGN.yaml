            - { call: "POST /tlo/disclosure-entries/${entry_id}/confirm", payload: {}, as: Inventor, as_user_id: "${inv_id}" }
            - { call: "GET /tlo/disclosures/${disc_id}", payload: {}, as: Any, captures: { disc_v: "$.data.version" } }
            - { call: "POST /tlo/disclosures/${disc_id}/inventorship/finalize", payload: { expected_disclosure_version: "${disc_v}" }, as: TechTransferOfficer }
            - { call: "POST /tlo/disclosures/${disc_id}/assessment", payload: { patentability_rating: "HIGH", market_rating: "HIGH" }, as: TechTransferOfficer }
            - { call: "POST /tlo/disclosures/${disc_id}/decision", payload: { decision: "PURSUE_PATENT" }, as: TechTransferOfficer }
            - { call: "POST /tlo/disclosures/${disc_id}/licenses", payload: { licensee_name: "Acme", exclusivity: "NON_EXCLUSIVE", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2030-01-01T00:00:00Z", royalty_rate_bp: 500, minimum_annual_royalty_cents: 0, upfront_fee_cents: 0 }, as: LicensingManager, captures: { lic_id: "$.data.id", lic_v: "$.data.version" } }
            - { call: "POST /tlo/licenses/${lic_id}/execute", payload: { expected_license_version: "${lic_v}" }, as: LicensingManager }
            - { call: "POST /tlo/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /tlo/disclosures/${disc_id}/patent-applications", payload: { docket_number: "DKT-1", application_type: "PROVISIONAL", filed_date: "2026-02-15T00:00:00Z" }, as: TechTransferOfficer, captures: { app_id: "$.data.id" } }
            - { call: "POST /tlo/patent-applications/${app_id}/costs", payload: { cost_type: "ATTORNEY_FEE", amount_cents: 400000, incurred_date: "2026-03-01T00:00:00Z" }, as: TechTransferOfficer, captures: { c1: "$.data.id" } }
            - { call: "POST /tlo/patent-applications/${app_id}/costs", payload: { cost_type: "FILING_FEE", amount_cents: 150000, incurred_date: "2026-03-02T00:00:00Z" }, as: TechTransferOfficer, captures: { c2: "$.data.id" } }
            - { call: "POST /tlo/licenses/${lic_id}/royalty-reports", payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", reported_sales_cents: 20000000 }, as: LicensingManager, captures: { rep_id: "$.data.id" } }
            - { call: "POST /tlo/royalty-reports/${rep_id}/accept", payload: {}, as: FinanceOfficer }
            - { call: "POST /tlo/royalty-reports/${rep_id}/distribution", payload: {}, as: FinanceOfficer, as_user_id: "fin_officer_1", captures: { dist_id: "$.data.id", dist_v: "$.data.version" } }
