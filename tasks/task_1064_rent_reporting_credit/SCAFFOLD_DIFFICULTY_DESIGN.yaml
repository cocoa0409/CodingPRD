              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
          assert:
            - "POST /api/rent-payments/${pay2_id}/report .data.error_id == ERR_PERIOD_ALREADY_COVERED"
            - "POST /api/rent-payments/${pay2_id}/report response http status == 409"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: correction_conserves_effective_furnished_count
        grounds:
          - state_machines.ReportedItem.DISPUTED_to_CORRECTED
          - entities.Tenant.fields.effective_reported_items
          - calculations.tenant_on_time_rate
        distinguishing_aspect: |
          Conserved quantity = count(ReportedItem where status IN {REPORTED, DISPUTED}) for the tenant. Resolving
          CORRECTED removes the original from the effective set (-1) and adds one superseding item (+1); the count is
          exactly 1 both before and after — no drift.
        test_recipe:
          setup:
            - "A dispute in INVESTIGATING on a REPORTED item (item is DISPUTED, effective count = 1); analyst-1 investigated."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/subscription-plans"
              payload: { name: "Plus", tier: "PLUS", monthly_fee_cents: 1499, back_reporting_included_months: 6 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /api/tenants"
              payload: { full_name: "Ivy Invariant", email: "ivy@x.com" }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
            - call: "POST /api/landlords"
              payload: { company_name: "Acme PM", email: "pm@x.com" }
              as: PlatformAdmin
              captures: { ll_id: $.data.id }
            - call: "POST /api/enrollments"
              payload: { tenant_id: "${t_id}", plan_id: "${plan_id}" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { en_id: $.data.id }
            - call: "GET /api/invoices"
              payload: { enrollment_id: "${en_id}", kind: "SUBSCRIPTION" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { sub_inv_id: "$.data[0].id" }
            - call: "POST /api/invoices/${sub_inv_id}/pay"
              payload: {}
              as: Tenant
              as_user_id: "${t_id}"
            - call: "POST /api/leases"
              payload: { tenant_id: "${t_id}", landlord_id: "${ll_id}", property_address: "24 Count Rd", rent_amount_cents: 120000, monthly_due_day: 5, lease_start: "2026-01-01T00:00:00Z", lease_end: "2027-01-01T00:00:00Z" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { lease_id: $.data.id }
            - call: "POST /api/leases/${lease_id}/verify"
              payload: { decision: "VERIFIED" }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { lease_v2: $.data.version }
            - call: "POST /api/rent-payments"
              payload: { lease_id: "${lease_id}", period_month: "2026-06", due_date: "2026-06-05T00:00:00Z", paid_date: "2026-06-25T00:00:00Z", amount_paid_cents: 120000, expected_lease_version: "${lease_v2}" }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { pay_id: $.data.id }
            - call: "POST /api/rent-payments/${pay_id}/report"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
              captures: { ri_id: $.data.id }
            - call: "POST /api/disputes"
              payload: { reported_item_id: "${ri_id}", reason_code: "PAID_ON_TIME" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { d_id: $.data.id }
            - call: "POST /api/disputes/${d_id}/investigate"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /api/disputes/${d_id}/resolve"
              payload: { resolution: "CORRECTED", corrected_on_time: true }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          assert:
            - "GET /api/tenants/${t_id}/credit-summary .data.effective_reported_items == 1"
            - "GET /api/reported-items/${ri_id} .data.status == CORRECTED"
            - "GET /api/reported-items?tenant_id=${t_id}&status=REPORTED .data[0].supersedes_item_id == ${ri_id}"

      - name: cancellation_conserves_period_money
        grounds:
          - calculations.cancellation_settlement
          - entities.Enrollment.fields.earned_cents
          - entities.Enrollment.fields.refund_cents
        distinguishing_aspect: |
          Conserved quantity = period cash in cents (a different type than a tradeline count): the cancel action pins
          earned_cents + refund_cents == paid_this_period_cents (484 + 1015 == 1499) with zero drift.
        test_recipe:
          setup:
            - "ACTIVE enrollment, fee 1499, current period 2026-07-01..2026-08-01 (31 days), subscription invoice PAID, clock advanced to 2026-07-11."
          setup_api_calls:
