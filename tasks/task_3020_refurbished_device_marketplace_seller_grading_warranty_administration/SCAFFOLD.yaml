scenario: 'Refurbished Device Marketplace Seller Grading & Warranty Administration (Back Market): seller onboarding with refurbishment process audit and battery-health thresholds, cosmetic and functional grading definitions enforced across sellers with mystery-shop verification, listing eligibility by model, carrier lock status and part provenance, warranty period administration with seller-funded repair
  or replacement obligations, buyer claim adjudication with diagnostic evidence and return routing to the original seller, seller performance scoring driving buy-box placement and suspension, trade-in intake pricing with post-inspection revision, counterfeit and stolen-device screening against blocklists'
domain_name: refurbished-device-marketplace-seller-grading-warranty-administration
api_prefix: /v1
complexity_profile:
  primary_archetype: Compliance / audit
  secondary_archetype: Pricing engine
  complexity_layers:
  - Cascading side effects
  - Dual-variant calculation
  - Rate / threshold triggers
  - Selector policy
  - Scheduled / deferred actions
  - Optimistic concurrency
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
  - one_to_many
  - many_to_many
  - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
response_envelope:
  success: "{ \"meta\": { \"api_request_id\": \"req_xxx\", \"api_request_timestamp\": \"ISO8601\" },\n  \"response_type\": \"object\" | \"array\", \"data\": {} }\n"
  error: "{ \"meta\": { ... }, \"response_type\": \"error\",\n  \"data\": { \"error_id\": \"ERR_XXX\", \"message\": \"...\" } }\n"
  pagination_fields:
  - limit
  - offset
  - total_count
  - has_more
  pagination_defaults:
    limit: 10
    min: 1
    max: 100
    offset: 0
entities:
- name: Seller
  parent: null
  common_fields: true
  fields:
  - name: legal_name
    type: string
    source: input
    description: Registered legal entity name of the refurbishing seller.
    constraints: required; unique across all Seller rows (case-insensitive)
  - name: country_code
    type: string
    source: input
    description: ISO 3166-1 alpha-2 country in which the seller refurbishes devices.
    constraints: required; exactly 2 uppercase letters
  - name: refurbishment_capacity_units
    type: integer
    source: input
    description: Maximum number of devices the seller can refurbish per calendar month.
    constraints: required; >= 1
  - name: onboarding_state
    type: enum
    source: input
    description: Seller onboarding lifecycle state.
    default: APPLICANT
    constraints: one of APPLICANT, DOCUMENT_VERIFIED, AUDIT_SCHEDULED, APPROVED, REJECTED
  - name: performance_tier
    type: enum
    source: computed
    description: Buy-box placement tier derived from the latest seller service score.
    default: PROBATION
    constraints: one of ELITE, STANDARD, PROBATION, SUSPENDED
  - name: latest_score_id
    type: string
    source: computed
    description: FK -> SellerServiceScore.id; the most recent CLOSED service-score section for this seller, or null when none has been finalized. Null is a legal value.
  - name: exposure_floor_cents
    type: integer
    source: computed
    description: Sum of the seller's live warranty exposure cells plus its constraint exposure, clamped at zero; recomputed on every closed section, disclosure, upheld or rejected claim and repair release.
    default: 0
  - name: suspension_trigger_count
    type: integer
    source: computed
    description: Number of CLOSED service-score sections in which the seller breached the suspension threshold.
    default: 0
  - name: blocklisted
    type: boolean
    source: computed
    description: True once the seller has been linked to a confirmed counterfeit or stolen-device finding.
    default: false
- name: SellerAuditRecord
  parent: Seller
  common_fields: true
  fields:
  - name: seller_id
    type: string
    source: input
    description: FK -> Seller.id; the applicant undergoing the refurbishment process audit.
    constraints: required
  - name: audit_state
    type: enum
    source: input
    description: Refurbishment process audit lifecycle state.
    default: IN_PROGRESS
    constraints: one of IN_PROGRESS, PASSED, FAILED
  - name: audit_scheduled_for
    type: datetime
    source: input
    description: Date on which the on-site refurbishment process audit is booked.
    constraints: required; ISO 8601; must be strictly later than the current logical clock instant
  - name: audit_scope_note
    type: string
    source: input
    description: Free-text description of the refurbishment steps covered by the audit.
    constraints: required; 1..500 characters
  - name: audit_score
    type: integer
    source: input
    description: Score awarded when the auditor records the outcome, 0..100.
    constraints: optional at creation; required to reach PASSED or FAILED; 0 <= audit_score <= 100
  - name: auditor_user_id
    type: string
    source: input
    description: Opaque operator identifier of the auditor who recorded the outcome.
    constraints: required when audit_state is set to PASSED or FAILED
  - name: declared_monthly_throughput
    type: integer
    source: input
    description: Throughput the applicant declared at scheduling time, used for the capacity cross-check.
    constraints: required; >= 1
- name: DeviceListing
  parent: Seller
  common_fields: true
  fields:
  - name: seller_id
    type: string
    source: input
    description: FK -> Seller.id; the seller offering this device.
    constraints: required
  - name: model_code
    type: string
    source: input
    description: Marketplace model identifier the listing is segregated under.
    constraints: required; must be present in the marketplace supported-model catalog
  - name: imei
    type: string
    source: input
    description: Device IMEI serial; drives stolen-device screening at creation.
    constraints: required; exactly 15 digits; unique across all non-WITHDRAWN DeviceListing rows
  - name: cosmetic_grade
    type: enum
    source: input
    description: Cosmetic grading definition the seller self-declared for this device.
    constraints: required; one of FLAWLESS, GOOD, FAIR, POOR
  - name: functional_grade
    type: enum
    source: input
    description: Functional grading definition the seller self-declared for this device.
    constraints: required; one of FULLY_FUNCTIONAL, MINOR_FAULTS, MAJOR_FAULTS
  - name: battery_health_pct
    type: integer
    source: input
    description: Measured battery health percentage disclosed on the listing.
    constraints: required; 1 <= battery_health_pct <= 100
  - name: carrier_lock_status
    type: enum
    source: input
    description: Carrier lock state declared for the device.
    constraints: required; one of UNLOCKED, LOCKED, UNKNOWN
  - name: part_provenance
    type: enum
    source: input
    description: Provenance class of the non-original parts used in the device.
    constraints: required; one of OEM_ONLY, OEM_EQUIVALENT, AFTERMARKET
  - name: provenance_doc_digest
    type: string
    source: input
    description: Digest of the part-provenance certificate filed with the listing application.
    constraints: required when part_provenance != OEM_ONLY; exactly 64 lowercase hex characters
  - name: serving_seller_id
    type: string
    source: computed
    description: FK -> Seller.id; remains the originally approved seller of record and MUST NOT be overwritten when servicing_seller_id changes.
    constraints: set at creation from seller_id; immutable
  - name: servicing_seller_id
    type: string
    source: computed
    description: FK -> Seller.id; the seller currently responsible for warranty servicing this device; starts equal to seller_id and changes only via warranty return routing.
    default: inherits seller_id at creation
  - name: listing_state
    type: enum
    source: input
    description: Listing lifecycle state.
    default: DRAFT
    constraints: one of DRAFT, UNDER_REVIEW, LISTED, DELISTED, WITHDRAWN
  - name: active_reservation_days
    type: integer
    source: computed
    description: Calendar days this listing has been the servicing record for an active warranty reservation, used by exposure calculations.
    default: 0
  - name: unit_reserve_per_day_cents
    type: integer
    source: input
    description: Seller-declared per-day reserve the listing contributes while under an active warranty reservation.
    default: 1800
    constraints: '>= 0'
  - name: mystery_shop_disclosed
    type: boolean
    source: computed
    description: True once the seller discloses a mystery-shop verification finding against this listing.
    default: false
  - name: servicing_reservation_id
    type: string
    source: computed
    description: FK -> WarrantyReservation.id; the warranty reservation currently servicing this listing, synthesised when the listing reaches LISTED. Null while the listing is not LISTED.
    constraints: nullable
  - name: list_price_cents
    type: integer
    source: input
    description: Price shown to buyers when this listing wins the buy box.
    constraints: required; >= 0
- name: MysteryShopVerification
  parent: Seller
  common_fields: true
  fields:
  - name: seller_id
    type: string
    source: input
    description: FK -> Seller.id; the seller whose listing was mystery-shopped.
    constraints: required
  - name: listing_id
    type: string
    source: input
    description: FK -> DeviceListing.id; the listing purchased under an undercover order.
    constraints: required
  - name: verification_state
    type: enum
    source: input
    description: Mystery-shop verification lifecycle state.
    default: OPEN
    constraints: one of OPEN, DISCLOSED, VOIDED
  - name: rationale_code
    type: enum
    source: input
    description: Machine-readable basis for the verification request.
    constraints: required; one of GRADE_GHOST, PART_PROVENANCE, BATTERY_MISMATCH
  - name: ordered_cosmetic_grade
    type: enum
    source: input
    description: Cosmetic grade the listing was sold under when the undercover order was placed.
    constraints: required; one of FLAWLESS, GOOD, FAIR, POOR
  - name: received_cosmetic_grade
    type: enum
    source: input
    description: Cosmetic grade the verifier recorded on the delivered device.
    constraints: optional at creation; required when verification_state is DISCLOSED; one of FLAWLESS, GOOD, FAIR, POOR
  - name: measured_battery_health_pct
    type: integer
    source: input
    description: Battery health percentage measured by the verifier on the delivered device.
    constraints: optional at creation; required when verification_state is DISCLOSED; 1 <= measured_battery_health_pct <= 100
  - name: value_at_risk
    type: integer
    source: computed
    description: Constraint-violation count filed against the seller when a disclosure is recorded, in integer units.
    constraints: '>= 0'
  - name: reserved_units_delta
    type: integer
    source: computed
    description: Signed change this verification applies to the listing's active reservation days, in integer units.
  - name: exposure_floor_delta_cents
    type: integer
    source: computed
    description: Signed change this verification applies to the seller's warranty exposure floor.
  - name: verification_start
    type: datetime
    source: input
    description: Scheduled start instant of the undercover verification window; half-open with verification_end.
    constraints: required; ISO 8601; verification_end must be strictly later than verification_start
  - name: verification_end
    type: datetime
    source: input
    description: Scheduled end instant of the undercover verification window; exclusive.
    constraints: required; ISO 8601; verification_end must be strictly later than verification_start
  - name: verifier_user_id
    type: string
    source: input
    description: Opaque operator identifier of the verifier who recorded the findings.
    constraints: required when verification_state is set to DISCLOSED
- name: WarrantyReservation
  parent: DeviceListing
  common_fields: true
  fields:
  - name: listing_id
    type: string
    source: input
    description: FK -> DeviceListing.id; the device operating under this warranty reservation.
    constraints: required
  - name: originated_claim_id
    type: string
    source: computed
    description: FK -> WarrantyClaim.id; the buyer claim that created this reservation; null when the reservation was opened by listing activation.
  - name: warranty_state
    type: enum
    source: input
    description: Warranty reservation lifecycle state.
    default: ACTIVE
    constraints: one of ACTIVE, REPAIRING, REPLACED, SUSPENDED, COMPLETED
  - name: activated_on
    type: datetime
    source: input
    description: Date the reservation began, from which the warranty period is measured.
    constraints: required; ISO 8601; must not be later than the current logical clock instant
  - name: warranty_period_days
    type: integer
    source: input
    description: Contractual warranty length for this device class; the reservation synthesised by POST /v1/listings/{id}/review uses the default 180.
    constraints: required; >= 1
  - name: expired_on
    type: datetime
    source: computed
    description: Activation date plus the warranty period, recomputed whenever activated_on or warranty_period_days changes.
  - name: reserved_units
    type: integer
    source: input
    description: Units of seller warranty exposure this reservation consumes while REPAIRING.
    default: 1
    constraints: '>= 0'
  - name: unit_reserve_per_day_cents
    type: integer
    source: input
    description: Per-day reserve this reservation contributes while in REPAIRING; the synthesised reservation uses the default 1800.
    default: 1800
    constraints: '>= 0'
  - name: claims_filed_count
    type: integer
    source: computed
    description: Number of buyer claims filed against this reservation in the current section.
    default: 0
  - name: repair_obligation_cents
    type: integer
    source: computed
    description: Total seller-funded repair obligation incurred against this reservation in the current section.
    default: 0
  - name: replacement_obligation_cents
    type: integer
    source: computed
    description: Total seller-funded replacement obligation incurred against this reservation in the current section.
    default: 0
- name: WarrantyClaim
  parent: DeviceListing
  common_fields: true
  fields:
  - name: listing_id
    type: string
    source: input
    description: FK -> DeviceListing.id; the listing the buyer purchased.
    constraints: required
  - name: routed_seller_id
    type: string
    source: computed
    description: FK -> Seller.id; the seller that must fund the outcome, pinned to DeviceListing.servicing_seller_id at routing time.
  - name: claim_state
    type: enum
    source: input
    description: Buyer claim lifecycle state.
    default: FILED
    constraints: one of FILED, UNDER_REVIEW, APPROVED, REJECTED, RESOLVED
  - name: resolution_type
    type: enum
    source: input
    description: Outcome the adjudicator selected; null until adjudication.
    constraints: one of REPAIR, REPLACE; null while claim_state is FILED or UNDER_REVIEW
  - name: resolution_obligation_cents
    type: integer
    source: input
    description: Amount the seller owes for the selected resolution, supplied by the adjudicator.
    constraints: required when claim_state is set to APPROVED; >= 0
  - name: claim_reason_code
    type: enum
    source: input
    description: Buyer-supplied reason for the claim.
    constraints: required; one of BATTERY_SWELL, TOUCH_FAILURE, CAMERA_FAILURE, UNLOCKED_PROMISE_BREACH
  - name: diagnostic_evidence_digest
    type: string
    source: input
    description: Digest of the uploaded diagnostic evidence bundle.
    constraints: required when claim_state is set to UNDER_REVIEW; exactly 64 lowercase hex characters
  - name: return_carrier
    type: enum
    source: input
    description: Carrier nominated for the return shipment to the original seller.
    constraints: required when resolution_type is REPAIR or REPLACE; one of CARRIER_A, CARRIER_B, CARRIER_C
  - name: return_shipment_cents
    type: integer
    source: input
    description: Seller-funded return shipping cost incurred for the routed device.
    constraints: '>= 0'
  - name: seller_funded_amount_cents
    type: integer
    source: computed
    description: Total amount charged back to the routed seller for this claim.
    default: 0
  - name: claim_reserve_cents
    type: integer
    source: computed
    description: Warranty reserve held for this claim while it is APPROVED and unresolved.
    default: 0
  - name: replacement_listing_id
    type: string
    source: computed
    description: FK -> DeviceListing.id; replacement device issued when resolution_type is REPLACE.
  - name: on_time_flag
    type: boolean
    source: computed
    description: True when the claim reached RESOLVED within on_time_window_days (21) calendar days of created_at, the window boundary being inclusive; false otherwise, including for claims that never resolve.
    default: false
  - name: evidence_included
    type: boolean
    source: input
    description: Whether the buyer supplied a diagnostic evidence bundle with the claim.
    default: false
- name: SellerServiceScore
  parent: Seller
  common_fields: true
  fields:
  - name: seller_id
    type: string
    source: input
    description: FK -> Seller.id; the seller being scored.
    constraints: required
  - name: section_opened_on
    type: datetime
    source: input
    description: Date the scoring section opened; boundary of the section-inclusion filter.
    constraints: required; ISO 8601; must not be later than the current logical clock instant
  - name: section_state
    type: enum
    source: input
    description: Service-score section lifecycle state.
    default: OPEN
    constraints: one of OPEN, CLOSED
  - name: section_closed_on
    type: datetime
    source: computed
    description: Date the section closed; boundary of the section-inclusion filter.
  - name: claim_failure_rate_pct
    type: number
    source: computed
    description: Section-scoped claim failure component, in percentage points.
  - name: on_time_resolution_pct
    type: number
    source: computed
    description: Section-scoped on-time resolution component, in percentage points.
  - name: grading_compliance_pct
    type: number
    source: computed
    description: Section-scoped grading compliance component, in percentage points.
  - name: return_rate_pct
    type: number
    source: computed
    description: Section-scoped return rate component, in percentage points.
  - name: service_score
    type: number
    source: computed
    description: Weighted seller service score, 0..100.
  - name: threshold_breached
    type: boolean
    source: computed
    description: True when the section score fell at or below the suspension threshold.
    default: false
- name: TradeInSubmission
  parent: null
  common_fields: true
  fields:
  - name: customer_ref
    type: string
    source: input
    description: Opaque consumer-supplied reference for the trade-in submission.
    constraints: required
  - name: submitted_model_code
    type: string
    source: input
    description: Model code the consumer declared before inspection.
    constraints: required
  - name: submission_state
    type: enum
    source: input
    description: Trade-in submission lifecycle state.
    default: SUBMITTED
    constraints: one of SUBMITTED, INSPECTED, PRICE_REVISED, ACCEPTED, REJECTED
  - name: self_declared_cosmetic_grade
    type: enum
    source: input
    description: Cosmetic grade the consumer declared before inspection.
    constraints: required; one of FLAWLESS, GOOD, FAIR, POOR
  - name: self_declared_functional_grade
    type: enum
    source: input
    description: Functional grade the consumer declared before inspection.
    constraints: required; one of FULLY_FUNCTIONAL, MINOR_FAULTS, MAJOR_FAULTS
  - name: self_declared_battery_health_pct
    type: integer
    source: input
    description: Battery health the consumer declared before inspection.
    constraints: required; 1 <= self_declared_battery_health_pct <= 100
  - name: self_declared_carrier_lock_status
    type: enum
    source: input
    description: Carrier lock state the consumer declared before inspection.
    constraints: required; one of UNLOCKED, LOCKED, UNKNOWN
  - name: provisional_quote_cents
    type: integer
    source: computed
    description: Pre-inspection quote computed from the consumer's declaration, in cents.
  - name: inspected_cosmetic_grade
    type: enum
    source: input
    description: Cosmetic grade the inspector measured; null until inspection.
    constraints: optional at creation; required to reach INSPECTED; one of FLAWLESS, GOOD, FAIR, POOR
  - name: inspected_functional_grade
    type: enum
    source: input
    description: Functional grade the inspector measured; null until inspection.
    constraints: optional at creation; required to reach INSPECTED; one of FULLY_FUNCTIONAL, MINOR_FAULTS, MAJOR_FAULTS
  - name: inspected_battery_health_pct
    type: integer
    source: input
    description: Battery health the inspector measured; null until inspection.
    constraints: optional at creation; required to reach INSPECTED; 1 <= inspected_battery_health_pct <= 100
  - name: inspected_carrier_lock_status
    type: enum
    source: input
    description: Carrier lock state the inspector measured; null until inspection.
    constraints: optional at creation; required to reach INSPECTED; one of UNLOCKED, LOCKED, UNKNOWN
  - name: inspection_fee_cents
    type: integer
    source: input
    description: Inspection handling fee withheld from the final credit.
    default: 0
    constraints: '>= 0'
  - name: final_quote_cents
    type: integer
    source: computed
    description: Post-inspection revised quote, in cents.
  - name: acceptance_deadline
    type: datetime
    source: computed
    description: Instant by which the consumer must accept the revised quote before the submission auto-rejects.
  - name: revision_count
    type: integer
    source: computed
    description: Number of times the post-inspection revision was recorded.
    default: 0
- name: GradingDefinition
  parent: null
  common_fields: true
  fields:
  - name: definition_state
    type: enum
    source: input
    description: Publication state of the marketplace grading definition.
    default: DRAFT
    constraints: one of DRAFT, ACTIVE, RETIRED
  - name: cosmetic_thresholds
    type: object
    source: input
    description: Mapping from cosmetic grade to the minimum accepted scratch score for that grade.
    constraints: required; keys must be exactly {FLAWLESS, GOOD, FAIR, POOR}
  - name: functional_thresholds
    type: object
    source: input
    description: Mapping from functional grade to the minimum accepted diagnostic pass rate for that grade.
    constraints: required; keys must be exactly {FULLY_FUNCTIONAL, MINOR_FAULTS, MAJOR_FAULTS}
  - name: battery_floor_pct
    type: integer
    source: input
    description: Minimum battery health a device may carry and still be graded at all.
    constraints: required; 1 <= battery_floor_pct <= 100
  - name: effective_from
    type: datetime
    source: input
    description: Date the definition becomes binding for listings submitted after it.
    constraints: required; ISO 8601
  - name: retired_on
    type: datetime
    source: computed
    description: Date the definition was retired; null while DRAFT or ACTIVE.
  - name: binding_definition_id
    type: string
    source: computed
    description: Identifier of the grading definition that was ACTIVE at the moment a listing entered UNDER_REVIEW; persisted on the listing's review record and never re-resolved.
state_machines:
- entity: Seller
  initial_state: APPLICANT
  terminal_states:
  - REJECTED
  - SUSPENDED
  transitions:
  - from: APPLICANT
    to: DOCUMENT_VERIFIED
    trigger: POST /sellers/{id}/verify-documents
    actor: ComplianceReviewer
    preconditions:
    - Seller.onboarding_state == APPLICANT
    - Seller.blocklisted == false
    side_effects:
    - Seller.onboarding_state := DOCUMENT_VERIFIED; Seller.version increments by 1
  - from: DOCUMENT_VERIFIED
    to: AUDIT_SCHEDULED
    trigger: POST /sellers/{id}/audit-records
    actor: ComplianceReviewer
    preconditions:
    - Seller.onboarding_state == DOCUMENT_VERIFIED
    - no SellerAuditRecord exists for this Seller with audit_state == IN_PROGRESS
    - payload.audit_scheduled_for is strictly later than the current logical clock instant
    side_effects:
    - Seller.onboarding_state := AUDIT_SCHEDULED; Seller.version increments by 1
  - from: AUDIT_SCHEDULED
    to: APPLICANT
    trigger: POST /audit-records/{id}/transition with target_state=FAILED
    actor: ComplianceReviewer
    preconditions:
    - Seller.onboarding_state == AUDIT_SCHEDULED
    - SellerAuditRecord.audit_state == IN_PROGRESS
    - payload.audit_score <= 69
    side_effects:
    - Seller.onboarding_state := APPLICANT; Seller.version increments by 1
  - from: AUDIT_SCHEDULED
    to: APPROVED
    trigger: POST /audit-records/{id}/transition with target_state=FAILED
    actor: ComplianceReviewer
    preconditions:
    - Seller.onboarding_state == AUDIT_SCHEDULED
    - SellerAuditRecord.audit_state == IN_PROGRESS
    - payload.audit_score >= 70
    side_effects:
    - Seller.onboarding_state := APPROVED; Seller.performance_tier := PROBATION; Seller.exposure_floor_cents := 0; Seller.version increments by 1
  - from: AUDIT_SCHEDULED
    to: REJECTED
    trigger: POST /audit-records/{id}/transition with target_state=FAILED
    actor: ComplianceReviewer
    preconditions:
    - SellerAuditRecord.audit_state == IN_PROGRESS
    - SellerAuditRecord.declared_monthly_throughput > Seller.refurbishment_capacity_units
    side_effects:
    - Seller.onboarding_state := REJECTED; Seller.version increments by 1; SellerAuditRecord.audit_state := FAILED
    note: 'Capacity cross-check outranks the score band: an over-capacity applicant is rejected before the pass/rework branch is decided.'
  - from: APPROVED
    to: SUSPENDED
    trigger: POST /v1/service-scores/{id}/close, or any component-source change that recomputes an OPEN section's score and takes it to or below the suspension threshold
    actor: System
    preconditions:
    - Seller.onboarding_state == APPROVED
    - SellerServiceScore.section_state == OPEN
    - computed SellerServiceScore.service_score <= 55.00
    side_effects:
    - Seller.onboarding_state := SUSPENDED; Seller.performance_tier := SUSPENDED; Seller.suspension_trigger_count increments by 1; Seller.version increments by 1
    note: Depth-1 link of the suspension cascade rooted at section close (ServiceScore -> Seller).
  - from: APPROVED
    to: SUSPENDED
    trigger: POST /sellers/{id}/blocklist
    actor: ComplianceReviewer
    preconditions:
    - Seller.blocklisted == false
    - payload.finding IN {CONFIRMED_COUNTERFEIT, CONFIRMED_STOLEN}
    side_effects:
    - Seller.blocklisted := true; Seller.onboarding_state := SUSPENDED; Seller.performance_tier := SUSPENDED; Seller.version increments by 1; then cascade Seller -> DeviceListing -> WarrantyReservation
    note: Depth-1 link of the blocklist cascade rooted at blocklisting (Seller -> DeviceListing -> WarrantyReservation).
- entity: SellerAuditRecord
  initial_state: IN_PROGRESS
  terminal_states:
  - FAILED
  transitions:
  - from: SCHEDULED
    to: IN_PROGRESS
    trigger: POST /v1/sellers/{id}/audit-records
    actor: ComplianceReviewer
    preconditions:
    - Seller.onboarding_state == DOCUMENT_VERIFIED
    - no SellerAuditRecord exists for this Seller with audit_state == IN_PROGRESS
    side_effects:
    - SellerAuditRecord.audit_state := IN_PROGRESS; Seller.onboarding_state := AUDIT_SCHEDULED; Seller.version increments by 1
    note: The audit row is created already IN_PROGRESS; there is no separate SCHEDULED resting state, so an on-site audit is never left waiting in a state nothing can advance.
  - from: IN_PROGRESS
    to: PASSED
    trigger: POST /audit-records/{id}/transition with target_state=PASSED
    actor: ComplianceReviewer
    preconditions:
    - SellerAuditRecord.audit_state == IN_PROGRESS
    - payload.audit_score >= 70
    - SellerAuditRecord.declared_monthly_throughput <= Seller.refurbishment_capacity_units
    side_effects:
    - SellerAuditRecord.audit_state := PASSED; Seller.onboarding_state := APPROVED; Seller.performance_tier := PROBATION; Seller.exposure_floor_cents := 0; Seller.version increments by 1
  - from: IN_PROGRESS
    to: FAILED
    trigger: POST /audit-records/{id}/transition with target_state=FAILED
    actor: ComplianceReviewer
    preconditions:
    - SellerAuditRecord.audit_state == IN_PROGRESS
    - payload.audit_score <= 69
    side_effects:
    - SellerAuditRecord.audit_state := FAILED; Seller.onboarding_state := APPLICANT; Seller.version increments by 1
    note: Onboarding loops back to APPLICANT so a seller may be re-audited; the loop is bounded because a SellerAuditRecord row is single-use and the next attempt requires a new record.
- entity: DeviceListing
  initial_state: DRAFT
  terminal_states:
  - WITHDRAWN
  transitions:
  - from: DRAFT
    to: UNDER_REVIEW
    trigger: POST /sellers/{id}/listings
    actor: Seller
    preconditions:
    - Seller.onboarding_state == APPROVED
    - model_code is present in the marketplace supported-model catalog
    - model_code is not subject to an active restricted-model restriction effective at the current logical clock instant
    - imei is not present in the stolen-device blocklist
    - imei is not present in the counterfeit blocklist
    - no non-WITHDRAWN DeviceListing for this Seller carries the same imei
    - battery_health_pct >= 80
    - battery_health_pct >= the ACTIVE GradingDefinition.battery_floor_pct
    - part_provenance == OEM_ONLY or provenance_doc_digest is present
    - carrier_lock_status != LOCKED
    side_effects:
    - DeviceListing.listing_state := UNDER_REVIEW; DeviceListing.serving_seller_id := seller_id; DeviceListing.servicing_seller_id := seller_id; DeviceListing.version increments by 1; captures GradingDefinition.binding_definition_id
    note: 'self-transition on re-submission: POST /listings/{id}/submit routes UNDER_REVIEW back to UNDER_REVIEW after a failed review.'
  - from: UNDER_REVIEW
    to: LISTED
    trigger: POST /listings/{id}/review with decision=APPROVED
    actor: ComplianceReviewer
    preconditions:
    - DeviceListing.listing_state == UNDER_REVIEW
    - the ACTIVE GradingDefinition.binding_definition_id captured at submission is still ACTIVE
    side_effects:
    - DeviceListing.listing_state := LISTED; DeviceListing.version increments by 1; then cascade DeviceListing -> WarrantyReservation (reservation auto-opened in ACTIVE)
  - from: UNDER_REVIEW
    to: DRAFT
    trigger: POST /listings/{id}/review with decision=REJECTED
    actor: ComplianceReviewer
    preconditions:
    - DeviceListing.listing_state == UNDER_REVIEW
    side_effects:
    - DeviceListing.listing_state := DRAFT; DeviceListing.version increments by 1
  - from: LISTED
    to: DELISTED
    trigger: POST /listings/{id}/suspend
    actor: ComplianceReviewer
    preconditions:
    - DeviceListing.listing_state == LISTED
    - payload.reason_code IN {BATTERY_DEGRADED, MYSTERY_SHOP_FINDING, PART_PROVENANCE_UNVERIFIED}
    side_effects:
    - DeviceListing.listing_state := DELISTED; DeviceListing.version increments by 1; then cascade DeviceListing -> WarrantyReservation (servicing_reservation_id flipped to SUSPENDED)
  - from: LISTED
    to: SUSPENDED
    trigger: POST /sellers/{id}/blocklist cascade
    actor: System
    preconditions:
    - Seller.blocklisted == true
    - DeviceListing.listing_state == LISTED
    side_effects:
    - DeviceListing.listing_state := SUSPENDED; DeviceListing.version increments by 1; then cascade DeviceListing -> WarrantyReservation (servicing_reservation_id flipped to SUSPENDED)
    note: 'Depth-2 link of the blocklist cascade: Seller -> DeviceListing -> WarrantyReservation.'
  - from: DELISTED
    to: UNDER_REVIEW
    trigger: POST /listings/{id}/submit
    actor: Seller
    preconditions:
    - DeviceListing.listing_state IN {DRAFT, DELISTED, SUSPENDED}
    - all listing-eligibility checks in this machine's DRAFT_to_UNDER_REVIEW transition hold again
    side_effects:
    - DeviceListing.listing_state := UNDER_REVIEW; DeviceListing.version increments by 1; captures the then-ACTIVE GradingDefinition.binding_definition_id
    note: 'Cyclic re-listing path: DRAFT/DELISTED/SUSPENDED -> UNDER_REVIEW -> LISTED. Not reachable from WITHDRAWN.'
  - from: SUSPENDED
    to: UNDER_REVIEW
    trigger: POST /listings/{id}/submit
    actor: Seller
    preconditions:
    - DeviceListing.listing_state IN {DRAFT, DELISTED, SUSPENDED}
    - all listing-eligibility checks in this machine's DRAFT_to_UNDER_REVIEW transition hold again
    side_effects:
    - DeviceListing.listing_state := UNDER_REVIEW; DeviceListing.version increments by 1; captures the then-ACTIVE GradingDefinition.binding_definition_id
  - from: DRAFT
    to: WITHDRAWN
    trigger: POST /listings/{id}/withdraw
    actor: Seller
    preconditions:
    - DeviceListing.listing_state IN {DRAFT, UNDER_REVIEW, DELISTED}
    - no WarrantyClaim for this listing has claim_state IN {FILED, UNDER_REVIEW, APPROVED}
    - no WarrantyReservation for this listing has warranty_state == REPAIRING
    side_effects:
    - DeviceListing.listing_state := WITHDRAWN; DeviceListing.version increments by 1
    note: 'Terminal: imei uniqueness is released because the uniqueness filter excludes WITHDRAWN rows.'
- entity: MysteryShopVerification
  initial_state: OPEN
  terminal_states:
  - DISCLOSED
  - VOIDED
  transitions:
  - from: OPEN
    to: DISCLOSED
    trigger: POST /mystery-shop-verifications/{id}/disclose
    actor: ComplianceReviewer
    preconditions:
    - MysteryShopVerification.verification_state == OPEN
    - payload.received_cosmetic_grade is present
    - payload.measured_battery_health_pct is present
    - the listing is not already flagged by a prior DISCLOSED verification for the same listing_id
    side_effects:
    - 'MysteryShopVerification.verification_state := DISCLOSED; DeviceListing.mystery_shop_disclosed := true; DeviceListing.version increments by 1; then cascade A: DeviceListing (mystery_shop_disclosed true) -> SellerServiceScore section value_at_risk += 1 per grading_constraint_violation_unit_cents; then cascade B: SellerServiceScore rescore -> Seller; SellerServiceScore version increments by 1'
    note: Re-disclosing a listing already carrying a DISCLOSED verification is rejected with ERR_VERIFICATION_ALREADY_DISCLOSED; the disclosure is not idempotent.
  - from: OPEN
    to: VOIDED
    trigger: POST /mystery-shop-verifications/{id}/void
    actor: ComplianceReviewer
    preconditions:
    - MysteryShopVerification.verification_state == OPEN
    side_effects:
    - MysteryShopVerification.verification_state := VOIDED; no DeviceListing or SellerServiceScore mutation fires
- entity: WarrantyReservation
  initial_state: ACTIVE
  terminal_states:
  - COMPLETED
  transitions:
  - from: ACTIVE
    to: REPAIRING
    trigger: POST /warranty-claims/{id}/adjudicate with decision=APPROVED and resolution_type=REPAIR
    actor: ClaimAdjudicator
    preconditions:
    - WarrantyReservation.warranty_state == ACTIVE
    - WarrantyClaim.claim_state == UNDER_REVIEW
    side_effects:
    - WarrantyReservation.warranty_state := REPAIRING; WarrantyReservation.version increments by 1; DeviceListing.active_reservation_days := DeviceListing.active_reservation_days + 1
  - from: ACTIVE
    to: REPLACED
    trigger: POST /warranty-claims/{id}/adjudicate with decision=APPROVED and resolution_type=REPLACE
    actor: ClaimAdjudicator
    preconditions:
    - WarrantyReservation.warranty_state == ACTIVE
    - WarrantyClaim.claim_state == UNDER_REVIEW
    side_effects:
    - WarrantyReservation.warranty_state := REPLACED; WarrantyReservation.version increments by 1; DeviceListing.active_reservation_days := DeviceListing.active_reservation_days + 1
  - from: REPAIRING
    to: ACTIVE
    trigger: POST /warranty-reservations/{id}/remediate
    actor: ClaimAdjudicator
    preconditions:
    - WarrantyReservation.warranty_state == REPAIRING
    - payload.repair_estimate_cents is present
    side_effects:
    - 'WarrantyReservation.warranty_state := ACTIVE; WarrantyReservation.version increments by 1; DeviceListing.active_reservation_days := 0; Seller.exposure_floor_cents := Seller.exposure_floor_cents - the released RESERVING cell value; Seller.version increments by 1; then cascade: Seller.exposure_floor_cents recompute -> Seller.performance_tier recompute -> DeviceListing buy-box rank recompute'
    note: Cyclic repair path; each REPAIRING stretch of at least 21 days contributes exactly one unit to Seller.exposure_floor_cents.
  - from: REPLACED
    to: ACTIVE
    trigger: POST /warranty-reservations/{id}/remediate
    actor: ClaimAdjudicator
    preconditions:
    - WarrantyReservation.warranty_state == REPLACED
    - payload.replacement_listing_id is present
    side_effects:
    - WarrantyReservation.warranty_state := ACTIVE; WarrantyReservation.version increments by 1; DeviceListing.active_reservation_days := 0; Seller.exposure_floor_cents := Seller.exposure_floor_cents - the released RESERVING cell value; Seller.version increments by 1
  - from: ACTIVE
    to: COMPLETED
    trigger: 'system event: warranty period expiry evaluated when the logical clock advances past WarrantyReservation.expired_on'
    actor: System
    preconditions:
    - WarrantyReservation.warranty_state == ACTIVE
    - current logical clock instant is strictly after WarrantyReservation.expired_on
    side_effects:
    - WarrantyReservation.warranty_state := COMPLETED; WarrantyReservation.version increments by 1
- entity: WarrantyClaim
  initial_state: FILED
  terminal_states:
  - REJECTED
  - RESOLVED
  transitions:
  - from: FILED
    to: UNDER_REVIEW
    trigger: POST /warranty-claims/{id}/evidence
    actor: ClaimAdjudicator
    preconditions:
    - WarrantyClaim.claim_state == FILED
    - payload.diagnostic_evidence_digest is a 64-character lowercase hex string
    side_effects:
    - WarrantyClaim.claim_state := UNDER_REVIEW; WarrantyClaim.routed_seller_id := DeviceListing.servicing_seller_id of the claim's listing; WarrantyReservation.claims_filed_count := WarrantyReservation.claims_filed_count + 1; WarrantyReservation.version increments by 1; then cascade WarrantyClaim UNDER_REVIEW -> WarrantyReservation (RESERVING flipped true) -> Seller.exposure_floor_cents debited and
      Seller.performance_tier remapped; WarrantyClaim.claim_reserve_cents := min(90000, 25000 + WarrantyReservation.unit_reserve_per_day_cents * 151); WarrantyClaim.version increments by 1
    note: 'A submission whose diagnostic_evidence_digest is absent or malformed does not reach this transition at all: §1.4 priority 5 rejects it with ERR_DIAGNOSTIC_EVIDENCE_REQUIRED.'
  - from: UNDER_REVIEW
    to: APPROVED
    trigger: POST /warranty-claims/{id}/adjudicate with decision=APPROVED
    actor: ClaimAdjudicator
    preconditions:
    - WarrantyClaim.claim_state == UNDER_REVIEW
    - payload.resolution_type IN {REPAIR, REPLACE}
    - payload.resolution_obligation_cents <= 25000 when resolution_type == REPAIR
    - payload.resolution_obligation_cents <= 90000 when resolution_type == REPLACE
    - WarrantyClaim.diagnostic_evidence_digest is present
    side_effects:
    - WarrantyClaim.claim_state := APPROVED; WarrantyClaim.seller_funded_amount_cents := payload.resolution_obligation_cents + payload.return_shipment_cents; WarrantyReservation.repair_obligation_cents := WarrantyReservation.repair_obligation_cents + payload.resolution_obligation_cents when resolution_type == REPAIR; WarrantyReservation.replacement_obligation_cents := WarrantyReservation.replacement_obligation_cents
      + payload.resolution_obligation_cents when resolution_type == REPLACE; then cascade WarrantyClaim APPROVED -> WarrantyReservation ACTIVE_to_REPAIRING or ACTIVE_to_REPLACED -> DeviceListing.active_reservation_days + 1
  - from: UNDER_REVIEW
    to: REJECTED
    trigger: POST /warranty-claims/{id}/adjudicate with decision=REJECTED
    actor: ClaimAdjudicator
    preconditions:
    - WarrantyClaim.claim_state == UNDER_REVIEW
    side_effects:
    - WarrantyClaim.claim_state := REJECTED; WarrantyClaim.claim_reserve_cents := 0; WarrantyReservation.claims_filed_count := WarrantyReservation.claims_filed_count - 1; WarrantyReservation.version increments by 1
  - from: APPROVED
    to: RESOLVED
    trigger: POST /warranty-claims/{id}/route-return
    actor: ClaimAdjudicator
    preconditions:
    - WarrantyClaim.claim_state == APPROVED
    - payload.return_carrier IN {CARRIER_A, CARRIER_B, CARRIER_C}
    - payload.return_shipment_cents >= 0
    side_effects:
    - WarrantyClaim.claim_state := RESOLVED; WarrantyClaim.seller_funded_amount_cents := WarrantyClaim.seller_funded_amount_cents + payload.return_shipment_cents; WarrantyClaim.claim_reserve_cents := 0; Seller.exposure_floor_cents := Seller.exposure_floor_cents - WarrantyClaim.claim_reserve_cents; WarrantyClaim.version increments by 1
  - from: APPROVED
    to: RESOLVED
    trigger: POST /warranty-claims/{id}/route-return with return_carrier omitted
    actor: ClaimAdjudicator
    preconditions:
    - WarrantyClaim.claim_state == APPROVED
    - payload.return_carrier is absent
    - the marketplace-owned reclamation policy is active for the routed seller
    side_effects:
    - WarrantyClaim.claim_state := RESOLVED; WarrantyClaim.routed_seller_id := the marketplace reclamation seller of record; WarrantyClaim.claim_reserve_cents := 0
    note: 'Reclaim-route conflict: the absence of carrier data would be admissible under the reclamation policy but the routed-seller binding is immutable, so this branch is rejected with ERR_ROUTED_SELLER_IMMUTABLE.'
  - from: APPROVED
    to: APPROVED
    trigger: POST /warranty-claims/{id}/adjudicate with decision=APPROVED on a claim already APPROVED
    actor: ClaimAdjudicator
    preconditions:
    - WarrantyClaim.claim_state == APPROVED
    - payload.resolution_type IN {REPAIR, REPLACE}
    - payload.resolution_obligation_cents is present
    - payload.return_shipment_cents >= 1
    side_effects:
    - 'no state change: the claim is already APPROVED and not terminal'
    note: 'Uphold cycle: re-upholding before the return is routed is rejected with ERR_CLAIM_ALREADY_UPHELD while the claim remains legally non-terminal. Once the claim reaches RESOLVED the same trigger is rejected with ERR_CLAIM_TERMINAL, so polarity is observable from the error code.'
- entity: SellerServiceScore
  initial_state: OPEN
  terminal_states:
  - CLOSED
  transitions:
  - from: OPEN
    to: CLOSED
    trigger: POST /service-scores/{id}/close
    actor: System
    preconditions:
    - SellerServiceScore.section_state == OPEN
    - SellerServiceScore.section_opened_on is at least 90 calendar days before the current logical clock instant
    - no WarrantyClaim routed to this Seller has claim_state == APPROVED
    side_effects:
    - 'SellerServiceScore.section_state := CLOSED; SellerServiceScore.section_closed_on := current logical clock instant; SellerServiceScore.claim_failure_rate_pct, on_time_resolution_pct, grading_compliance_pct and return_rate_pct recomputed over the section window; SellerServiceScore.service_score recomputed; SellerServiceScore.version increments by 1; then cascade: SellerServiceScore.service_score
      -> Seller.performance_tier remap -> DeviceListing buy-box rank recompute'
    note: The open-approved-claim guard fires before the section-age guard, so a section that is both too young and blocked by an open approved claim returns ERR_SECTION_BLOCKED_BY_OPEN_CLAIM.
- entity: TradeInSubmission
  initial_state: SUBMITTED
  terminal_states:
  - ACCEPTED
  - REJECTED
  transitions:
  - from: SUBMITTED
    to: INSPECTED
    trigger: POST /trade-ins/{id}/inspection
    actor: TradeInInspector
    preconditions:
    - TradeInSubmission.submission_state == SUBMITTED
    - payload.inspected_cosmetic_grade, inspected_functional_grade, inspected_battery_health_pct and inspected_carrier_lock_status are all present
    side_effects:
    - TradeInSubmission.submission_state := INSPECTED; TradeInSubmission.final_quote_cents := 0; TradeInSubmission.version increments by 1
  - from: INSPECTED
    to: PRICE_REVISED
    trigger: POST /trade-ins/{id}/inspection-revision
    actor: TradeInInspector
    preconditions:
    - TradeInSubmission.submission_state == INSPECTED
    - TradeInSubmission.revision_count == 0
    side_effects:
    - TradeInSubmission.submission_state := PRICE_REVISED; TradeInSubmission.final_quote_cents := max(0, inspected-formula quote minus the downgrade step penalty); TradeInSubmission.acceptance_deadline := current logical clock instant plus 7 calendar days; TradeInSubmission.inspection_fee_cents := 1500; TradeInSubmission.revision_count := TradeInSubmission.revision_count + 1; TradeInSubmission.version
      increments by 1
  - from: INSPECTED
    to: REJECTED
    trigger: POST /trade-ins/{id}/inspection with inspected_battery_health_pct < 70
    actor: TradeInInspector
    preconditions:
    - TradeInSubmission.submission_state == SUBMITTED
    - payload.inspected_battery_health_pct < 70
    side_effects:
    - TradeInSubmission.submission_state := REJECTED; TradeInSubmission.version increments by 1
    note: 'Boundary: measured battery health of exactly 70 is insurable and proceeds to INSPECTED; 69 rejects.'
  - from: PRICE_REVISED
    to: INSPECTED
    trigger: POST /trade-ins/{id}/inspection-revision
    actor: TradeInInspector
    preconditions:
    - TradeInSubmission.submission_state == PRICE_REVISED
    - current logical clock instant is at or before TradeInSubmission.acceptance_deadline
    - TradeInSubmission.revision_count == 1
    side_effects:
    - TradeInSubmission.submission_state := INSPECTED; TradeInSubmission.version increments by 1
    note: One free revision round per submission; a second revision attempt is rejected with ERR_REVISION_LIMIT_REACHED.
  - from: PRICE_REVISED
    to: ACCEPTED
    trigger: POST /trade-ins/{id}/accept
    actor: Consumer
    preconditions:
    - TradeInSubmission.submission_state == PRICE_REVISED
    - current logical clock instant is at or before TradeInSubmission.acceptance_deadline
    - TradeInSubmission.final_quote_cents > 0
    side_effects:
    - TradeInSubmission.submission_state := ACCEPTED; TradeInSubmission.version increments by 1
  - from: PRICE_REVISED
    to: REJECTED
    trigger: 'system event: acceptance deadline lapse evaluated when the logical clock advances strictly past TradeInSubmission.acceptance_deadline'
    actor: System
    preconditions:
    - TradeInSubmission.submission_state == PRICE_REVISED
    - current logical clock instant is strictly after TradeInSubmission.acceptance_deadline
    side_effects:
    - TradeInSubmission.submission_state := REJECTED; TradeInSubmission.version increments by 1
    note: 'Boundary: accepting at exactly acceptance_deadline succeeds; the same request one day later is rejected with ERR_ACCEPTANCE_WINDOW_CLOSED.'
- entity: GradingDefinition
  initial_state: DRAFT
  terminal_states:
  - RETIRED
  transitions:
  - from: DRAFT
    to: ACTIVE
    trigger: POST /grading-definitions/{id}/activate
    actor: ComplianceReviewer
    preconditions:
    - GradingDefinition.definition_state == DRAFT
    - no other GradingDefinition is ACTIVE at the same effective_from instant
    side_effects:
    - 'GradingDefinition.definition_state := ACTIVE; GradingDefinition.binding_definition_id := GradingDefinition.id; GradingDefinition.version increments by 1; then cascade: every DeviceListing currently UNDER_REVIEW and bound to the previously ACTIVE definition is re-flagged for re-review'
    note: Activation is the depth-1 link of the grading-definition cascade (GradingDefinition -> DeviceListing -> re-review).
  - from: ACTIVE
    to: RETIRED
    trigger: POST /grading-definitions/{id}/retire
    actor: ComplianceReviewer
    preconditions:
    - GradingDefinition.definition_state == ACTIVE
    - current logical clock instant is at or after GradingDefinition.effective_from
    side_effects:
    - GradingDefinition.definition_state := RETIRED; GradingDefinition.retired_on := current logical clock instant; GradingDefinition.version increments by 1
  - from: RETIRED
    to: ACTIVE
    trigger: POST /grading-definitions/{id}/reinstate
    actor: ComplianceReviewer
    preconditions:
    - GradingDefinition.definition_state == RETIRED
    - GradingDefinition.effective_from is strictly before the current logical clock instant
    - no other GradingDefinition is ACTIVE
    side_effects:
    - GradingDefinition.definition_state := ACTIVE; GradingDefinition.retired_on := null; GradingDefinition.version increments by 1
    note: Cyclic reinstatement path RETIRED -> ACTIVE -> RETIRED.
concurrency_rules:
- rule_id: listing-submit-stale-seller
  parent_entity: Seller
  write_endpoint: POST /listings/{id}/submit
  occ_field: expected_seller_version
  description: 'Re-submitting a DeviceListing for review against a Seller whose version has

    advanced since the client last observed it is rejected. A seller''s version

    legitimately advances whenever a closed service-score section remaps

    performance_tier or an exposure-floor recompute runs, so a client holding a

    pre-recompute view of the seller is stale even though no listing field it

    can see has changed.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
- rule_id: score-close-stale-seller
  parent_entity: Seller
  write_endpoint: POST /service-scores/{id}/close
  occ_field: expected_seller_version
  description: 'Closing a service-score section against a Seller whose version has advanced

    since the client last observed it is rejected, because the section''s

    aggregates and the seller''s exposure floor are read from the same instant and

    a stale seller view would pin the floor to a superseded value.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
calculations:
- name: trade_in_intake_price
  trigger: on TradeInSubmission creation (provisional) and on POST /trade-ins/{id}/inspection-revision (final)
  algorithm: tiered_pricing
  formula: "# GRADED_ORDER is the pinned ordinal map used by every grade-indexed term:\n#   cosmetic  FLAWLESS=0, GOOD=1, FAIR=2, POOR=3\n#   functional FULLY_FUNCTIONAL=0, MINOR_FAULTS=1, MAJOR_FAULTS=2\n# Evaluation order is pinned and MUST be followed literally:\n#   base -> deduct -> step penalty -> clamp at 0 -> subtract fee -> round -> clamp at 0\nPROVISIONAL (evaluated once, at creation, from\
    \ the consumer's declaration):\n  base_cents          = 38000\n  cosmetic_deduct     = cosmetic_deduct_table[self_declared_cosmetic_grade]\n  functional_deduct   = functional_deduct_table[self_declared_functional_grade]\n  battery_deduct      = battery_deduct_table(self_declared_battery_health_pct)\n  lock_deduct         = lock_deduct_table[self_declared_carrier_lock_status]\n  provisional_quote_cents\
    \ = max(0, base_cents - cosmetic_deduct - functional_deduct - battery_deduct - lock_deduct)\n\nFINAL (evaluated on the revision step, from the inspector's measurements):\n  grade_steps         = max(0, GRADED_ORDER[inspected_cosmetic_grade] - GRADED_ORDER[self_declared_cosmetic_grade])\n                        + max(0, GRADED_ORDER[inspected_functional_grade] - GRADED_ORDER[self_declared_functional_grade])\n\
    \  inspected_value     = base_cents\n                        - cosmetic_deduct_table[inspected_cosmetic_grade]\n                        - functional_deduct_table[inspected_functional_grade]\n                        - battery_deduct_table(inspected_battery_health_pct)\n                        - lock_deduct_table[inspected_carrier_lock_status]\n  revised             = inspected_value - grade_step_penalty_cents\
    \ * grade_steps\n  revised             = max(0, revised)\n  fee                 = round_half_up(revised * inspection_fee_pct, 0)\n  final_quote_cents   = max(0, round_half_up(revised - fee, 0))\n"
  input_set: 'Exactly one TradeInSubmission. The PROVISIONAL branch reads only the four

    self_declared_* fields captured at creation and is never recomputed. The FINAL

    branch reads only the four inspected_* fields written by the inspection call.

    Devices whose inspected_battery_health_pct < inspected_battery_health_reject_pct

    never reach the FINAL branch (the submission is rejected at inspection).

    '
  constants:
    base_cents: 38000
    grade_step_penalty_cents: 2500
    inspection_fee_cents: 1500
    inspection_fee_pct: 0.07
    inspected_battery_health_reject_pct: 70
    acceptance_window_days: 7
    cosmetic_deduct_table:
      FLAWLESS: 0
      GOOD: 1800
      FAIR: 5200
      POOR: 11000
    functional_deduct_table:
      FULLY_FUNCTIONAL: 0
      MINOR_FAULTS: 4200
      MAJOR_FAULTS: 13500
    lock_deduct_table:
      UNLOCKED: 0
      LOCKED: 9000
      UNKNOWN: 4500
    battery_deduct_bands: health >= 85 -> 0; 80 <= health <= 84 -> 2500; 70 <= health <= 79 -> 6000; health < 70 -> 12000 (rejected at inspection instead)
  precision: integer cents; round_half_up applied once at the fee step, then once more on the final subtraction; both use ROUND_HALF_UP
  variants:
  - name: provisional_quote_cents
    when: TradeInSubmission.submission_state == SUBMITTED, computed at creation
    difference: uses the consumer's self_declared_* fields as the grade band and omits both the grade_step_penalty_cents term and the inspection fee; it is never revised in place, so a submission that later receives an inspection keeps both numbers
  - name: final_quote_cents
    when: TradeInSubmission.submission_state == PRICE_REVISED, computed at the revision step
    difference: uses the inspector's inspected_* fields, adds grade_step_penalty_cents per cosmetic-and-functional grade step worse than the declaration, and subtracts the 7% inspection fee; for identical underlying device measurements the two variants differ by the step penalty plus the fee
- name: seller_performance_score
  trigger: on POST /v1/service-scores/{id}/close, and re-derived on every read of an OPEN section whenever one of its component sources changes (a claim transitions, a disclosure is recorded, a listing or reservation is created)
  algorithm: weighted_scoring
  formula: "# Pinned rounding order: each of the four components is rounded to 2 decimals\n# FIRST (round_half_up), then combined by weight, and the weighted sum is\n# rounded to 2 decimals ONCE MORE. \"Sum the raw ratios first, round only at\n# the end\" is a different, non-conforming order and yields different cents.\nsection window = (section_opened_on, section_closed_on], both boundaries pinned:\n\
    \  lower bound EXCLUSIVE (a claim created exactly at section_opened_on is excluded)\n  upper bound INCLUSIVE (a claim created exactly at section_closed_on is included)\nrouted = count of WarrantyClaim rows with routed_seller_id == seller_id\n         AND created_at IN section window\nrejected = count of those rows with claim_state == REJECTED\non_time = count of those rows with on_time_flag == true\n\
    shops = count of MysteryShopVerification rows with seller_id == seller_id\n        AND created_at IN section window\nviolations = sum of MysteryShopVerification.value_at_risk over those rows\nlisted = count of DeviceListing rows with seller_id == seller_id\n         AND created_at IN section window\nreturned = count of WarrantyReservation rows for those listings with\n           warranty_state ==\
    \ REPAIRING at section_closed_on\n\nclaim_failure_rate_pct = round_half_up(100 * rejected / max(1, routed), 2)\non_time_resolution_pct = round_half_up(100 * on_time  / max(1, routed), 2)\ngrading_compliance_pct = round_half_up(100 * (shops - violations) / max(1, shops), 2)\nreturn_rate_pct        = round_half_up(100 * returned / max(1, listed), 2)\n\nservice_score = round_half_up(\n    0.35 * (100\
    \ - claim_failure_rate_pct)\n  + 0.30 * on_time_resolution_pct\n  + 0.25 * grading_compliance_pct\n  + 0.10 * (100 - return_rate_pct)\n, 2)\n\nthreshold_breached = service_score <= 55.00\nSeller.performance_tier := ELITE if service_score >= 85.00\n                          else STANDARD if service_score >= 70.00\n                          else PROBATION if service_score > 55.00\n               \
    \           else SUSPENDED\n"
  input_set: 'Section-scoped and seller-scoped. Rows are selected by the half-open window

    (section_opened_on, section_closed_on] over created_at, never by id or by any

    random property. Ties in the ordering never arise because every term is a

    count or a sum, not a "pick one" selector. WarrantyClaim rows routed to a

    different seller are excluded by routed_seller_id, which is pinned at the

    moment the claim first enters UNDER_REVIEW and never re-resolved. For an OPEN section the window upper bound is the current logical clock instant instead of section_closed_on, so a score is always defined for a section that has opened.'
  constants:
    weight_claim_failure: 0.35
    weight_on_time_resolution: 0.3
    weight_grading_compliance: 0.25
    weight_return_rate: 0.1
    elite_threshold: 85.0
    standard_threshold: 70.0
    suspension_threshold: 55.0
    on_time_window_days: 21
    minimum_section_days: 90
  precision: component values and service_score are 2 decimal places, round_half_up; thresholds compare against the rounded value, so a score of exactly 55.00 breaches and 55.01 does not
  variants:
  - name: per_component_rounding
    when: always — this is the only conforming order
    difference: each of the four percentage components is rounded to 2 decimals before weighting; the alternative order reported in `alternate_order_observation` reuses unrounded ratios
  - name: alternate_order_observation
    when: non-conforming; present so tests can assert the scaffold did NOT take it
    difference: 'weighting the raw unrounded ratios and rounding only the final sum. For identical section data the two orders diverge: with routed=3, rejected=1, on_time=2, shops=2, violations=1, listed=4, returned=1 the conforming order yields service_score == 63.34 while the non-conforming order yields 63.33'
- name: buy_box_ranking
  trigger: on GET /listings/{id}/buy-box and whenever DeviceListing.version changes for a LISTED listing
  algorithm: weighted_scoring
  formula: "# Candidate set: DeviceListing rows with listing_state == LISTED and\n# seller.onboarding_state == APPROVED for the same model_code as the queried\n# listing. WITHDRAWN, DELISTED, SUSPENDED and DRAFT rows are excluded.\nrank_score(listing) = the seller's latest CLOSED SellerServiceScore.service_score\n  eligibility: Seller.performance_tier IN {ELITE, STANDARD, PROBATION}\n              \
    \ (a SUSPENDED-tier seller contributes no candidates at all)\n\n# Evaluation order is pinned: score -> tier -> price -> price rounding -> clamp.\n# Rounding is applied LAST, after the tier multiplier has been applied, and only once.\nmultiplier(rank_score) = 1.00  if rank_score >= 95.00\n                       = 0.70  if 85.00 <= rank_score < 95.00\n                       = 0.40  if 70.00 <= rank_score\
    \ < 85.00\n                       = 0.00  if rank_score < 70.00\naverage_competitor_price_cents = integer floor of the arithmetic mean of\n  list_price_cents over the OTHER candidates in the candidate set; when the\n  candidate set contains exactly one row the mean is undefined and the row's\n  own list_price_cents is used instead\nbuy_box_price_cents = round_half_up(multiplier * average_competitor_price_cents,\
    \ 0)\nif buy_box_price_cents <= 0 then buy_box_price_cents = list_price_cents of the highest-ranked candidate\n\nRanking expression (applied over the eligible candidate set), pinned:\n  sort key   = -1 * round_half_up(listing.list_price_cents * 1.00, 2)\n  tie-break  = listing.created_at ASC\n  no random property, and in particular no `id` value, participates in the\n  sort key or the tie-break.\n\
    \n\nWORKED CASE (pinned; the tests assert these literals):\nseller D has a latest CLOSED section score of 75.84 -> PROBATION -> multiplier 0.40;\nseller C has 31.66 -> SUSPENDED -> contributes no candidate at all.\nTwo LISTED candidates for the same model: D's listing at list_price_cents 160000 and\nseller A's listing at list_price_cents 150000 (A's score 70.00 -> multiplier 0.40).\nWinner: A's\
    \ 150000 listing (sort key -150000 beats -160000).\naverage_competitor_price_cents for A == 160000.\nbuy_box_price_cents == round_half_up(0.40 * 160000, 0) == 64000.\nIf D's listing were the only candidate its own list_price_cents substitutes:\nround_half_up(0.40 * 160000, 0) == 64000 as well, which is the named trap."
  input_set: 'Candidate set = DeviceListing rows whose listing_state == LISTED, whose

    model_code equals the queried listing''s model_code, and whose owning Seller has

    onboarding_state == APPROVED. Rows whose seller has no CLOSED SellerServiceScore

    are excluded (no rank_score exists to compare). The winner is the first row

    under the pinned sort key; ties are broken by created_at ASC.

    '
  constants:
    elite_multiplier: 1.0
    standard_multiplier: 0.7
    probation_multiplier: 0.4
    suspended_multiplier: 0.0
    elite_min_score: 95.0
    standard_min_score: 85.0
    probation_min_score: 70.0
    empty_candidate_set_behaviour: return the queried listing with buy_box_price_cents = its own list_price_cents and buy_box_winner_listing_id = its own id
  precision: buy_box_price_cents is integer cents via round_half_up applied once, after the multiplier; sort key is 2 decimal places
  variants:
  - name: ranked_winner
    when: the candidate set contains at least two LISTED rows for the model
    difference: the winner is chosen by the pinned sort key over list_price_cents, with created_at ASC as the tie-break
  - name: sole_candidate
    when: the candidate set contains exactly one LISTED row for the model
    difference: the competitor mean is undefined, so the row's own list_price_cents substitutes for average_competitor_price_cents; the row is still the winner and the multiplier still applies to its own price
- name: health_based_warranty_reserve
  trigger: on POST /sellers/{id}/blocklist and on POST /warranty-claims/{id}/route-return, whenever a warranty exposure floor is recomputed
  algorithm: aggregation
  formula: "# A live exposure cell exists for every WarrantyReservation that is the servicing\n# reservation of its listing AND has warranty_state IN {REPAIRING, REPLACED}.\n# A reservation that has returned to ACTIVE (remediated) or reached COMPLETED\n# contributes ZERO — its obligation has been discharged.\nremaining_days(cell)   = max(0, expiry_date - current logical clock instant, in calendar days)\n\
    \                        where expiry_date = activated_on + warranty_period_days\nremaining_fraction     = remaining_days / warranty_period_days\n# Pinned rounding order: EACH cell is rounded to integer cents individually\n# (round_half_up) and only then are the cells summed. Rounding once over the\n# combined total is the non-conforming order and yields different cents whenever\n# two cells have\
    \ fractional parts that cross .5 together.\ncell_value_cents = round_half_up(reserved_units * unit_reserve_per_day_cents * remaining_fraction, 0)\nrepaired_exposure_cents = sum over live cells of cell_value_cents\n# Worked case for two live cells at clock 2026-10-09 with unit 1855 and period 180:\n#   cell1 elapsed 37 days -> 1855 * 143/180 = 1473.36 -> 1473\n#   cell2 elapsed 42 days -> 1855 *\
    \ 138/180 = 1422.17 -> 1422\n#   per-cell sum 2895; single-rounding over the combined total gives 2896.\n"
  input_set: Every WarrantyReservation of the seller's listings whose warranty_state IN {REPAIRING, REPLACED}. Reservations in ACTIVE or COMPLETED contribute 0. Claims are NOT netted here — the seller's APPROVED-but-unresolved claim reserve is exposed separately by GET /v1/sellers/{id}/exposure-floor as reserved_claim_cents.
  constants:
    unit_reserve_per_day_cents_default: 1800
    selector: warranty_reservation_status_selector
    cell_rounding: per cell, integer cents, round_half_up, sum after rounding
    live_states:
    - REPAIRING
    - REPLACED
    zero_states:
    - ACTIVE
    - COMPLETED
  precision: integer cents everywhere; the per-cell rounding is what makes the rendering differ from the traced exposure (see consistency_note on Seller.exposure_floor_cents)
  variants:
  - name: per_cell_archived_sum
    when: always — the balance carried on Seller.exposure_floor_cents
    difference: each live cell is rounded individually before summing; this is the number the exposure-floor read endpoint publishes as published_exposure_floor_cents
  - name: on_read_traced_exposure
    when: GET /v1/sellers/{id}/exposure-floor as traced_exposure_cents
    difference: recomputes the same live cells and rounds only the final total, so with two cells whose fractional parts together cross .5 it can differ from the published balance by 1 cent; both numbers are returned side by side so the difference is explained rather than hidden
- name: warranty_reservation_status_selector
  trigger: on every GET and POST that needs the listing's servicing record, and on every Seller.exposure_floor_cents recompute
  algorithm: constraint_propagation
  formula: "# Selector for \"the warranty reservation currently servicing a listing\".\ncandidate_set(P) = WarrantyReservation rows R where R.listing_id == P.id\n                   AND R.warranty_state IN {ACTIVE, REPAIRING, REPLACED}\nranking expression over candidate_set:\n  primary key = R.activated_on DESC\n  tie-break   = R.created_at ASC\nwinner = first row under that ranking\nempty candidate\
    \ set -> err ERR_RESERVATION_NOT_FOUND (404), never a null winner\n# `id` is forbidden as either the primary key or the tie-break, because it is\n# random and would make an observable result non-deterministic.\n# The winning row MUST satisfy R.servicing_seller_id == R.listing.servicing_seller_id.\n"
  input_set: 'WarrantyReservation rows for one DeviceListing whose warranty_state IN

    {ACTIVE, REPAIRING, REPLACED}; rows in COMPLETED are excluded.

    '
  constants:
    exclusion_states:
    - COMPLETED
    selector_sort_key: activated_on DESC
    selector_tie_break: created_at ASC
    empty_pool_error: ERR_RESERVATION_NOT_FOUND
  precision: no arithmetic; ordering only
  variants:
  - name: single_active_reservation
    when: exactly one candidate row
    difference: the ranking is vacuous; the row is returned
  - name: multiple_candidates
    when: more than one candidate row
    difference: activated_on DESC decides; when two rows share activated_on exactly, created_at ASC decides — the winner is deterministic and never depends on the row id
- name: warranty_replacement_payout
  trigger: on POST /warranty-claims/{id}/adjudicate with resolution_type == REPLACE and on POST /warranty-claims/{id}/route-return
  algorithm: forward_looking
  formula: "# Pinned rounding order: gross is rounded first, then net is rounded, and the\n# reserve draw is the balance carried on WarrantyClaim.claim_reserve_cents.\nsold_price_cents          = DeviceListing.list_price_cents\ninbound_shipping_cents    = the routed seller's inbound shipping allowance, 5600\nmarketplace_fvf_cents     = round_half_up(sold_price_cents * 0.09, 0)\nrefused_funded_cents\
    \      = claimed warranty repair or replacement cost the\n                            marketplace advanced, 90000\nwarranty_period_days      = 180 (the replacement warranty class period)\nincurred_days             = calendar days from the replacement listing\n                            activation to the replacement claim resolution,\n                            capped at warranty_period_days (180)\n\
    payout_to_buyer_cents     = round_half_up(\n                                WarrantyClaim.claim_reserve_cents\n                              + round_half_up(sold_price_cents * 0.30, 0)\n                            , 0)\nseller_funded_amount_cents = max(0, round_half_up(refused_funded_cents\n                              * incurred_days / warranty_period_days, 0))\n# Worked case for the difficulty\
    \ instance that exercises this rule:\n#   sold_price_cents = 45000 -> marketplace_fvf_cents = 4050\n#   claim_reserve_cents = 90000 -> payout_to_buyer_cents = 103500\n#   incurred_days = 90 of 180 -> seller_funded_amount_cents = 45000\n"
  input_set: 'A WarrantyClaim with resolution_type == REPLACE that has already reached

    APPROVED, its routed_seller_id, its DeviceListing, and the replacement listing

    that the adjudicator nominated. Claims whose resolution_type == REPAIR are

    excluded.

    '
  constants:
    inbound_shipping_cents: 5600
    marketplace_fvf_rate: 0.09
    refused_funded_cents: 90000
    buyer_goodwill_rate: 0.3
    replacement_warranty_period_days: 180
  precision: integer cents; gross rounded first, then the net subtraction rounded; both ROUND_HALF_UP
  variants:
  - name: buyer_payout
    when: always, shown on the claim read
    difference: adds the reserve held for the claim to goodwill plus the reserve itself; this is the amount the marketplace pays the buyer
  - name: seller_chargeback
    when: always, shown on the claim read
    difference: charges only the pro-rated share of the refused funded cost, measured over the replacement warranty period; it is a different quantity on the same claim and the two are never netted into one field
- name: seller_constraint_exposure
  trigger: on POST /mystery-shop-verifications/{id}/disclose and on every Seller.exposure_floor_cents recompute
  algorithm: threshold
  formula: "# Pinned: the divisor is floors, NOT rounds.\nsection_claims_filed = count of WarrantyClaim rows routed to the seller in the\n                       source section (section_opened_on, section_closed_on]\nraw_violation_units  = 100 * section_claims_filed\nunits_per_constraint_violation =\n    raw_violation_units                                    if raw_violation_units >= units_denominator\n\
    \    floor(raw_violation_units / units_denominator)         if 100 <= raw_violation_units < units_denominator\n    0                                                      if raw_violation_units < 100\nseller_constraint_exposure = units_per_constraint_violation * constraint_violation_unit_cents\n# Worked case: section_claims_filed = 4 -> raw = 400, denominator = 300,\n#   400 >= 300 and 100 <= 400\
    \ < 300 is false, but 400 < 300 is false too, so\n#   the first branch applies and the result is 4 * 9600 = 38400.\n# Worked boundary case: section_claims_filed = 3 -> raw = 300, denominator = 300\n#   -> first branch applies (>= is inclusive) -> 3 * 9600 = 28800.\n# Worked case below the door: section_claims_filed = 1 -> raw = 100\n#   -> 100 < 300 and 100 >= 100 -> floor(100/300) = 0 -> 0.\n"
  input_set: 'The seller''s most recent CLOSED SellerServiceScore section, and the

    MysteryShopVerification disclosures recorded in that section. Sellers with no

    CLOSED section contribute 0.

    '
  constants:
    constraint_violation_unit_cents: 9600
    units_denominator: 300
    violation_rate_threshold_units: 25
    door_units: 100
  precision: integer units and integer cents; the division floors and never rounds, so a fractional unit is always discarded
  variants:
  - name: at_or_above_denominator
    when: raw_violation_units >= units_denominator
    difference: the raw unit count is used unchanged rather than divided down
  - name: below_denominator
    when: 100 <= raw_violation_units < units_denominator
    difference: the unit count is floored by units_denominator, so it is strictly smaller than the raw count and any remainder is discarded
- name: seller_exposure_floor
  trigger: on POST /service-scores/{id}/close, POST /mystery-shop-verifications/{id}/disclose, POST /warranty-claims/{id}/evidence, POST /warranty-claims/{id}/route-return and POST /warranty-reservations/{id}/remediate
  algorithm: aggregation
  formula: '# Pinned evaluation order: (1) constraint exposure, (2) carried repaired exposure,

    # (3) clamp at zero, (4) publish. reserved_claim_cents is exposed by the read

    # endpoint but is NOT netted out of the floor, because an unresolved approved claim

    # is still a live obligation of the seller.

    constraint_exposure_cents   = seller_constraint_exposure (see that rule)

    repaired_exposure_cents     = health_based_warranty_reserve (see that rule)

    exposure_floor_cents = max(0, constraint_exposure_cents + repaired_exposure_cents)

    '
  input_set: Seller-scoped. Live cells come only from reservations in REPAIRING or REPLACED; the constraint term comes only from the seller's most recent CLOSED section.
  constants:
    exposure_floor_floor_cents: 0
  precision: integer cents
  variants:
  - name: floor_after_repair
    when: POST /v1/warranty-reservations/{id}/remediate returns the reservation to ACTIVE
    difference: the remediated reservation stops contributing a cell, so the repaired term drops by exactly that cell and the published floor falls by the same amount
  - name: floor_after_loss
    when: POST /v1/sellers/{id}/blocklist suspends every servicing reservation
    difference: with every live cell removed the repaired term is 0, so the published floor equals the constraint term alone (0 for a seller with no closed section)
- name: seller_tier_escalation
  trigger: on POST /sellers/{id}/blocklist when a device listing was serviced by the seller
  algorithm: decay_function
  formula: "# Reinstatement ramps the seller back one tier per elapsed evaluation window.\nservice_days(seller) = calendar days contributed by archived exposure cells\n# Pinned: the day count is floored before the tier arithmetic, and the tier\n# step index is floored again, so neither a partial window nor a partial tier\n# is ever credited.\nramp_steps(seller)    = floor(service_days(seller) / reinstatement_window_days)\n\
    escalation_score(seller) = max(0, floor(seller.latest_score_pct - escalation_points_per_step * ramp_steps(seller)))\n# seller.latest_score_pct is 100.00 for a seller with no CLOSED service-score\n# section, so an un-scored seller starts at the top of the ramp.\nSeller.performance_tier := ELITE    if escalation_score >= 85.00\n                        := STANDARD if escalation_score >= 70.00\n   \
    \                     := PROBATION if escalation_score > 55.00\n                        := SUSPENDED otherwise\n# Worked case: service_days = 3, latest_score_pct = 100.00,\n#   reinstatement_window_days = 1 -> ramp_steps = 3,\n#   escalation_score = floor(100.00 - 20.00 * 3) = 40.00 -> PROBATION.\n"
  input_set: 'Sellers only. The day count is taken from the archived exposure cells already

    used by health_based_warranty_reserve; sellers with no archived cells have

    service_days == 0 and therefore ramp_steps == 0.

    '
  constants:
    reinstatement_window_days: 1
    escalation_points_per_step: 20.0
    unscored_seller_latest_score_pct: 100.0
    elite_threshold: 85.0
    standard_threshold: 70.0
    probation_threshold: 55.0
  precision: score is 2 decimal places, round_half_up; day and step counts are integers via floor
  variants:
  - name: scored_seller_ramp
    when: the seller has at least one CLOSED SellerServiceScore
    difference: the ramp starts from the seller's own latest section score
  - name: unscored_seller_ramp
    when: the seller has no CLOSED SellerServiceScore
    difference: the ramp starts from 100.00, so an un-scored seller is ELITE until 1 window of service has elapsed (escalation_score 80.00 -> PROBATION), reaches SUSPENDED at 3 windows (score 40.00), stays SUSPENDED through 5 windows (score 0.00) and lands exactly on PROBATION at 6 windows (score clamp keeps 0.00, so 5 windows is the last SUSPENDED window)
- name: seller_escalation_ceiling
  trigger: on every POST /sellers/{id}/blocklist recompute
  algorithm: threshold
  formula: "# Pinned: the ceiling is inclusive, and the docs page quotes the\n# minimum-trigger threshold (5) rather than the ceiling (99). A seller whose\n# trigger count reaches 5 cannot be blocklisted again, and a seller whose\n# trigger count has reached triggers_ceiling (99) is never eligible.\nif Seller.suspension_trigger_count >= triggers_ceiling:\n    blocklisting is refused with ERR_TRIGGER_CEILING_REACHED\n\
    elif Seller.suspension_trigger_count >= minimum_triggers:\n    blocklisting is refused with ERR_HUMAN_REVIEW_REQUIRED\nelse:\n    blocklisting proceeds\n"
  input_set: 'Seller-scoped. suspension_trigger_count is incremented only by the

    APPROVED_to_SUSPENDED transition triggered by POST /service-scores/{id}/close.

    '
  constants:
    minimum_triggers: 5
    triggers_ceiling: 99
    documentation_quoted_threshold: 5
  precision: integer counts; both comparisons are inclusive >=, so a count of exactly 5 refuses with the review error and a count of exactly 99 refuses with the ceiling error
  variants:
  - name: below_minimum
    when: suspension_trigger_count <= 4
    difference: blocklisting proceeds and is not gated
  - name: at_or_above_minimum
    when: suspension_trigger_count >= 5
    difference: blocklisting is refused, with the error selected by whether the count has also reached the ceiling
- name: warranty_exposure_trace
  trigger: on GET /v1/sellers/{id}/exposure-floor
  algorithm: aggregation
  formula: "total_raw = sum over live cells of (reserved_units * unit_reserve_per_day_cents * remaining_fraction)\ntraced_exposure_cents = round_half_up(total_raw, 0)\npublished_exposure_floor_cents = Seller.exposure_floor_cents as recomputed at the last\n  recompute trigger; the two are returned side by side and MAY differ by 1 cent\ncell_count = number of live cells the trace saw"
  input_set: The seller's live cells only, evaluated at the current logical clock instant. A seller with no live cell returns traced_exposure_cents 0 and cell_count 0.
  constants:
    cell_rounding: single round_half_up over the combined total
    live_states:
    - REPAIRING
    - REPLACED
  precision: integer cents; a single round_half_up over the combined total, in contrast to the per-cell rounding behind published_exposure_floor_cents
  variants:
  - name: two_or_more_live_cells
    when: the seller has at least two live cells
    difference: the combined rounding can differ from the per-cell sum by 1 cent
  - name: single_live_cell
    when: the seller has exactly one live cell
    difference: both orders coincide, so published and traced agree exactly
validations:
- priority: 1
  category: auth
  check: X-User-Role header present and its value is a declared role name; X-User-ID header present and non-empty unless the role is Anonymous
  error_id: ERR_UNAUTHENTICATED
  http_status: 401
  applies_to: all endpoints except POST /v1/sellers and POST /v1/trade-ins
- priority: 2
  category: business_constraint
  check: every required input field for the endpoint is present and type-conformant; enum-valued fields carry a declared enum member and numeric fields lie in their declared range
  error_id: ERR_INVALID_REQUEST
  http_status: 400
  applies_to: all endpoints with a request body
- priority: 3
  category: auth
  check: the acting role is listed in the target endpoint's roles; for entity_backed roles the X-User-ID identifies an existing row of the backing entity
  error_id: ERR_FORBIDDEN_ROLE
  http_status: 403
  applies_to: all endpoints
- priority: 4
  category: existence
  check: every resource named in the path exists, validated left to right; a non-existent parent id fails before the child id is examined
  error_id: ERR_RESOURCE_NOT_FOUND
  http_status: 404
  applies_to: all endpoints carrying {id} path parameters
- priority: 5
  category: existence
  check: 'every body-supplied foreign key resolves to an existing row: seller_id, listing_id, originated_claim_id, replacement_listing_id'
  error_id: ERR_REFERENCED_ENTITY_NOT_FOUND
  http_status: 404
  applies_to: POST /v1/sellers/{id}/listings, POST /v1/mystery-shop-verifications, POST /v1/sellers/{id}/warranty-claims, POST /v1/listings/{id}/warranty-reservations, POST /v1/trade-ins
- priority: 6
  category: business_safety
  check: the submitted imei is absent from the stolen-device blocklist and from the counterfeit blocklist
  error_id: ERR_DEVICE_BLOCKLISTED
  http_status: 422
  applies_to: POST /v1/sellers/{id}/listings, POST /v1/listings/{id}/submit
- priority: 7
  category: business_safety
  check: DeviceListing.battery_health_pct is at or above the ACTIVE GradingDefinition.battery_floor_pct; when no GradingDefinition is ACTIVE the hard floor of 80 applies
  error_id: ERR_BATTERY_BELOW_FLOOR
  http_status: 422
  applies_to: POST /v1/sellers/{id}/listings, POST /v1/listings/{id}/submit
- priority: 8
  category: business_safety
  check: post-inspection battery health is at or above inspected_battery_health_reject_pct (70); a device measured at exactly 70 is insurable and proceeds
  error_id: ERR_INSPECTION_BATTERY_UNINSURABLE
  http_status: 422
  applies_to: POST /v1/trade-ins/{id}/inspection
- priority: 9
  category: business_safety
  check: 'price-pattern screening: the listing''s list_price_cents is more than price_deviation_pct (50%) below the model''s catalog floor, which is the counterfeit-pricing signal'
  error_id: ERR_COUNTERFEIT_PRICE_SIGNAL
  http_status: 422
  applies_to: POST /v1/sellers/{id}/listings, POST /v1/listings/{id}/suspend
- priority: 10
  category: business_constraint
  check: 'the submitted part provenance is admissible: OEM_ONLY needs no document, OEM_EQUIVALENT and AFTERMARKET both require provenance_doc_digest'
  error_id: ERR_PART_PROVENANCE_UNDOCUMENTED
  http_status: 422
  applies_to: POST /v1/sellers/{id}/listings, POST /v1/listings/{id}/submit
- priority: 11
  category: business_constraint
  check: the listing's model_code is in the marketplace supported-model catalog and is not subject to an active restricted-model restriction
  error_id: ERR_MODEL_NOT_ELIGIBLE
  http_status: 422
  applies_to: POST /v1/sellers/{id}/listings, POST /v1/listings/{id}/submit
- priority: 12
  category: business_constraint
  check: the seller's onboarding state is APPROVED; an APPLICANT, DOCUMENT_VERIFIED, AUDIT_SCHEDULED or REJECTED seller may not hold or submit listings
  error_id: ERR_SELLER_NOT_APPROVED
  http_status: 422
  applies_to: POST /v1/sellers/{id}/listings, POST /v1/listings/{id}/submit
- priority: 13
  category: business_referential
  check: 'WarrantyClaim.routed_seller_id may not be reassigned once set: a claim whose routed_seller_id differs from the value it carried when it first entered UNDER_REVIEW is rejected'
  error_id: ERR_ROUTED_SELLER_IMMUTABLE
  http_status: 422
  applies_to: POST /v1/warranty-claims/{id}/route-return, POST /v1/warranty-claims/{id}/adjudicate
- priority: 14
  category: business_referential
  check: WarrantyClaim.diagnostic_evidence_digest is present and is exactly 64 lowercase hex characters before a claim may enter UNDER_REVIEW
  error_id: ERR_DIAGNOSTIC_EVIDENCE_REQUIRED
  http_status: 422
  applies_to: POST /v1/warranty-claims/{id}/evidence
- priority: 15
  category: business_temporal
  check: 'the return shipment the claim routes back collides with an already-booked return on the same carrier slot: the half-open interval [return_shipment_start, return_shipment_start + 86400) collides when a prior return exists whose interval touches it at either boundary'
  error_id: ERR_RETURN_SLOT_COLLISION
  http_status: 409
  applies_to: POST /v1/warranty-claims/{id}/route-return
- priority: 16
  category: business_temporal
  check: the mystery-shop verification the auditor is scheduling strictly overlaps an existing verification window for the same listing that is still OPEN; two windows that merely abut do NOT collide
  error_id: ERR_VERIFICATION_OVERLAP
  http_status: 409
  applies_to: POST /v1/mystery-shop-verifications
- priority: 17
  category: state
  check: the target resource is in a state from which the requested transition exists
  error_id: ERR_INVALID_STATE
  http_status: 409
  applies_to: all action endpoints
- priority: 18
  category: state
  check: the target resource is in a terminal state and admits no further mutation; this check precedes the already-transitioned check because a terminal claim and an approved claim are both non-mutable
  error_id: ERR_CLAIM_TERMINAL
  http_status: 409
  applies_to: POST /v1/warranty-claims/{id}/adjudicate, POST /v1/warranty-claims/{id}/evidence
- priority: 19
  category: state
  check: the claim has already been approved and is awaiting return routing; re-upholding it is refused on the already-upheld ground rather than on the terminal ground, because the claim is not yet terminal
  error_id: ERR_CLAIM_ALREADY_UPHELD
  http_status: 409
  applies_to: POST /v1/warranty-claims/{id}/adjudicate
- priority: 20
  category: state
  check: 'the acting operator is barred by the segregation-of-duties matrix: the auditor who recorded an audit outcome may not approve the listing of the audited seller, and the operator who recorded a claim''s evidence may not adjudicate that claim'
  error_id: ERR_SOD_VIOLATION
  http_status: 403
  applies_to: POST /v1/audit-records/{id}/transition, POST /v1/listings/{id}/review, POST /v1/warranty-claims/{id}/adjudicate
- priority: 21
  category: business_fiscal
  check: 'the claim''s requested resolution obligation is within the resolution cap for the selected resolution_type: 25000 for REPAIR and 90000 for REPLACE'
  error_id: ERR_OBLIGATION_EXCEEDS_CAP
  http_status: 422
  applies_to: POST /v1/warranty-claims/{id}/adjudicate
- priority: 22
  category: business_constraint
  check: the seller has already reached the trigger ceiling of 99, so it can never be blocklisted again
  error_id: ERR_TRIGGER_CEILING_REACHED
  http_status: 422
  applies_to: POST /v1/sellers/{id}/blocklist
- priority: 23
  category: business_constraint
  check: the seller's suspension_trigger_count has reached the documented minimum-trigger threshold of 5 but is still below the ceiling of 99, so blocklisting needs human review first
  error_id: ERR_HUMAN_REVIEW_REQUIRED
  http_status: 422
  applies_to: POST /v1/sellers/{id}/blocklist
- priority: 24
  category: business_constraint
  check: an expected_<parent>_version supplied in the request body equals the parent's current version; a stale value means the client's view of the parent predates the last mutation
  error_id: ERR_STALE_VERSION
  http_status: 412
  applies_to: POST /v1/listings/{id}/submit, POST /v1/service-scores/{id}/close
- priority: 25
  category: business_constraint
  check: the warranty reservation selector found no candidate row in {ACTIVE, REPAIRING, REPLACED} for the listing
  error_id: ERR_RESERVATION_NOT_FOUND
  http_status: 404
  applies_to: POST /v1/warranty-claims/{id}/evidence, GET /v1/listings/{id}/buy-box
- priority: 26
  category: business_constraint
  check: the seller already has an audit record in IN_PROGRESS, so a second refurbishment process audit cannot be booked
  error_id: ERR_AUDIT_ALREADY_SCHEDULED
  http_status: 409
  applies_to: POST /v1/sellers/{id}/audit-records
- priority: 27
  category: business_constraint
  check: the seller is already blocklisted and cannot be blocklisted twice
  error_id: ERR_SELLER_ALREADY_BLOCKLISTED
  http_status: 409
  applies_to: POST /v1/sellers/{id}/blocklist
- priority: 28
  category: business_constraint
  check: the service-score section is closed fewer than 90 calendar days after section_opened_on
  error_id: ERR_SECTION_TOO_YOUNG
  http_status: 409
  applies_to: POST /v1/service-scores/{id}/close
- priority: 29
  category: business_constraint
  check: a non-WITHDRAWN listing for the same seller already carries the submitted imei
  error_id: ERR_IMEI_ALREADY_LISTED
  http_status: 422
  applies_to: POST /v1/sellers/{id}/listings, POST /v1/listings/{id}/submit
- priority: 30
  category: business_constraint
  check: the grading definition bound to the listing at submission time is no longer ACTIVE when the review decision is recorded
  error_id: ERR_GRADING_DEFINITION_NOT_ACTIVE
  http_status: 409
  applies_to: POST /v1/listings/{id}/review
- priority: 31
  category: business_constraint
  check: the listing carries a claim in FILED, UNDER_REVIEW or APPROVED, or a reservation in REPAIRING, so it cannot be withdrawn
  error_id: ERR_WITHDRAW_BLOCKED_BY_OPEN_CLAIM
  http_status: 409
  applies_to: POST /v1/listings/{id}/withdraw
endpoints:
- method: POST
  path: /v1/sellers
  description: Register a refurbishing seller as an APPLICANT.
  roles:
  - PlatformAdmin
  code: 201
  input:
  - legal_name
  - country_code
  - refurbishment_capacity_units
  output: Seller
  side_effects:
  - Seller.created_at stamped; Seller.onboarding_state := APPLICANT; Seller.performance_tier := PROBATION; Seller.exposure_floor_cents := 0
- method: GET
  path: /v1/sellers
  description: List sellers with optional filters.
  roles:
  - PlatformAdmin
  - ComplianceReviewer
  - ClaimAdjudicator
  code: 200
  input:
  - onboarding_state?
  - performance_tier?
  - limit?
  - offset?
  - latest_score_id?
  output: Seller[]
  side_effects: []
- method: GET
  path: /v1/sellers/{id}
  description: Read one seller, including its computed performance tier and exposure floor.
  roles:
  - PlatformAdmin
  - ComplianceReviewer
  - ClaimAdjudicator
  - Seller
  code: 200
  input:
  - ''
  output: Seller
  side_effects: []
- method: POST
  path: /v1/sellers/{id}/verify-documents
  description: Move an APPLICANT seller to DOCUMENT_VERIFIED.
  roles:
  - ComplianceReviewer
  code: 200
  input:
  - expected_seller_version?
  output: Seller
  side_effects:
  - Seller.onboarding_state := DOCUMENT_VERIFIED; Seller.version increments by 1
- method: POST
  path: /v1/sellers/{id}/audit-records
  description: Book a refurbishment process audit; the audit record is created already IN_PROGRESS and the seller moves to AUDIT_SCHEDULED.
  roles:
  - ComplianceReviewer
  code: 201
  input:
  - audit_scheduled_for
  - audit_scope_note
  - declared_monthly_throughput
  output: SellerAuditRecord
  side_effects:
  - SellerAuditRecord.audit_state := IN_PROGRESS
  - Seller.onboarding_state := AUDIT_SCHEDULED
  - Seller.version increments by 1
- method: GET
  path: /v1/sellers/{id}/audit-records
  description: Book a refurbishment process audit; the audit record is created already IN_PROGRESS and the seller moves to AUDIT_SCHEDULED.
  roles:
  - ComplianceReviewer
  - PlatformAdmin
  code: 200
  input:
  - limit?
  - offset?
  output: SellerAuditRecord[]
  side_effects:
  - SellerAuditRecord.audit_state := IN_PROGRESS
  - Seller.onboarding_state := AUDIT_SCHEDULED
  - Seller.version increments by 1
- method: POST
  path: /v1/sellers/{id}/suspend
  description: Suspend an approved seller whose listings carry a counterfeit-pricing or grading signal.
  roles:
  - ComplianceReviewer
  code: 200
  input:
  - reason_code
  - expected_seller_version?
  output: Seller
  side_effects:
  - DeviceListing.listing_state := DELISTED; the listing's servicing reservation flips to REPAIRING; DeviceListing.active_reservation_days := active_reservation_days + 1
  - Seller.exposure_floor_cents := max(0, constraint_exposure_cents + repaired_exposure_cents)
  - Seller.version increments by 1
- method: POST
  path: /v1/sellers/{id}/blocklist
  description: Record a counterfeit or stolen-device finding against a seller; cascades Suspended onto every listed device and suspends the reservations servicing those devices.
  roles:
  - ComplianceReviewer
  code: 200
  input:
  - finding
  - evidence_digest
  - suspension_trigger_units?
  output: Seller
  side_effects:
  - Seller.blocklisted := true; Seller.onboarding_state := SUSPENDED; Seller.performance_tier := SUSPENDED; Seller.version increments by 1
  - 'cascade: every DeviceListing of the seller with listing_state == LISTED becomes SUSPENDED'
  - 'cascade depth 3: every WarrantyReservation servicing those listings has reserved_units := 0 and its owner Seller.exposure_floor_cents is recomputed'
- method: GET
  path: /v1/sellers/{id}/exposure-floor
  description: 'Trace the seller''s warranty exposure: published_exposure_floor_cents is the per-cell-rounded balance carried on Seller.exposure_floor_cents, traced_exposure_cents is the same cells rounded once over the combined total, and reserved_claim_cents is the seller''s APPROVED-unresolved claim reserve.'
  roles:
  - PlatformAdmin
  - ClaimAdjudicator
  - Seller
  code: 200
  input:
  - ''
  output:
    seller_id: string
    published_exposure_floor_cents: integer
    traced_exposure_cents: integer
    cell_count: integer
    reserved_claim_cents: integer
  side_effects: []
- method: GET
  path: /v1/sellers/{id}/listings
  description: List the device listings offered by a seller.
  roles:
  - PlatformAdmin
  - ComplianceReviewer
  - Seller
  code: 200
  input:
  - listing_state?
  - limit?
  - offset?
  output: DeviceListing[]
  side_effects: []
- method: GET
  path: /v1/sellers/{id}/mystery-shop-verifications
  description: List the mystery-shop verifications recorded against a seller.
  roles:
  - ComplianceReviewer
  - PlatformAdmin
  code: 200
  input:
  - verification_state?
  - limit?
  - offset?
  output: MysteryShopVerification[]
  side_effects: []
- method: GET
  path: /v1/sellers/{id}/service-scores
  description: List the seller's service-score sections.
  roles:
  - PlatformAdmin
  - Seller
  - ComplianceReviewer
  code: 200
  input:
  - section_state?
  - limit?
  - offset?
  output: SellerServiceScore[]
  side_effects: []
- method: POST
  path: /v1/sellers/{id}/listings
  description: Submit a device listing; runs the full eligibility ladder and lands the listing in UNDER_REVIEW, capturing the then-ACTIVE grading definition.
  roles:
  - Seller
  code: 201
  input:
  - model_code
  - imei
  - cosmetic_grade
  - functional_grade
  - battery_health_pct
  - carrier_lock_status
  - part_provenance
  - provenance_doc_digest?
  - list_price_cents
  output: DeviceListing
  side_effects:
  - DeviceListing.listing_state := UNDER_REVIEW; DeviceListing.serving_seller_id := seller_id; DeviceListing.servicing_seller_id := seller_id
  - DeviceListing.version increments by 1
  - POST /v1/sellers/{id}/listings is the only creation path; a listing created here is not yet bound to a servicing reservation because servicing_reservation_id stays null until the listing reaches LISTED
- method: GET
  path: /v1/listings
  description: List device listings with optional filters, including the seller filter.
  roles:
  - PlatformAdmin
  - ComplianceReviewer
  - ClaimAdjudicator
  - Seller
  code: 200
  input:
  - servicing_seller_id?
  - listing_state?
  - model_code?
  - limit?
  - offset?
  - servicing_reservation_id?
  output: DeviceListing[]
  side_effects: []
- method: GET
  path: /v1/listings/{id}
  description: Read one device listing.
  roles:
  - PlatformAdmin
  - ComplianceReviewer
  - ClaimAdjudicator
  - Seller
  code: 200
  input:
  - ''
  output: DeviceListing
  side_effects: []
- method: POST
  path: /v1/listings/{id}/submit
  description: Re-submit a non-terminal listing for review after a failed review or a delisting; re-runs the eligibility ladder and advances the parent seller's version.
  roles:
  - Seller
  code: 200
  input:
  - expected_seller_version
  output: DeviceListing
  side_effects:
  - DeviceListing.listing_state := UNDER_REVIEW; re-captures the then-ACTIVE GradingDefinition.binding_definition_id
  - DeviceListing.version increments by 1
  - increments Seller.version by 1
- method: POST
  path: /v1/listings/{id}/review
  description: Approve or reject a listing that is UNDER_REVIEW.
  roles:
  - ComplianceReviewer
  code: 200
  input:
  - decision
  - reviewer_user_id
  output: DeviceListing
  side_effects:
  - decision APPROVED -> DeviceListing.listing_state := LISTED; decision REJECTED -> DRAFT
  - DeviceListing.version increments by 1
  - 'cascade on approval: a WarrantyReservation is auto-opened with warranty_state ACTIVE, activated_on equal to the current logical clock instant, warranty_period_days 180, reserved_units 1 and unit_reserve_per_day_cents 1800; DeviceListing.servicing_reservation_id points at it'
- method: POST
  path: /v1/listings/{id}/suspend
  description: Delist a live listing on a grading, mystery-shop or provenance ground; the servicing reservation enters REPAIRING and the seller exposure floor is recomputed.
  roles:
  - ComplianceReviewer
  code: 200
  input:
  - reason_code
  - extended_reservation_days?
  output: DeviceListing
  side_effects:
  - DeviceListing.listing_state := DELISTED; DeviceListing.version increments by 1
  - 'cascade depth 2: the listing''s servicing WarrantyReservation flips to REPAIRING and DeviceListing.active_reservation_days := active_reservation_days + 1'
  - 'cascade depth 3: the seller''s exposure floor is recomputed'
- method: POST
  path: /v1/listings/{id}/withdraw
  description: Withdraw a listing permanently; the IMEI is released for reuse.
  roles:
  - Seller
  code: 200
  input:
  - withdrawal_reason
  output: DeviceListing
  side_effects:
  - DeviceListing.listing_state := WITHDRAWN; DeviceListing.version increments by 1; the IMEI uniqueness filter no longer covers this row
- method: GET
  path: /v1/listings/{id}/buy-box
  description: Compute the buy-box winner, price and rank for the listing's model, exposing the ranked candidate rows.
  roles:
  - PlatformAdmin
  - Seller
  - ComplianceReviewer
  code: 200
  input:
  - ''
  output:
    winner_listing_id: string
    winner_seller_id: string
    winner_rank_score: number
    buy_box_price_cents: integer
    ranked_listing_ids: array
  side_effects:
  - recomputes buy_box_price_cents; no persisted field is written
- method: POST
  path: /v1/mystery-shop-verifications
  description: Open a mystery-shop verification against a seller's listing over a scheduled half-open window.
  roles:
  - ComplianceReviewer
  code: 201
  input:
  - seller_id
  - listing_id
  - rationale_code
  - ordered_cosmetic_grade
  - verification_start?
  - verification_end?
  output: MysteryShopVerification
  side_effects:
  - MysteryShopVerification.verification_state := OPEN
- method: GET
  path: /v1/mystery-shop-verifications
  description: List mystery-shop verifications with optional listing and seller filters.
  roles:
  - ComplianceReviewer
  - PlatformAdmin
  code: 200
  input:
  - seller_id?
  - listing_id?
  - verification_state?
  - limit?
  - offset?
  output: MysteryShopVerification[]
  side_effects: []
- method: POST
  path: /v1/mystery-shop-verifications/{id}/disclose
  description: Record the verifier's measured grades against a listing that was sold under a declared grade; raises the seller's constraint exposure.
  roles:
  - ComplianceReviewer
  code: 200
  input:
  - received_cosmetic_grade
  - measured_battery_health_pct
  - verifier_user_id
  output: MysteryShopVerification
  side_effects:
  - MysteryShopVerification.verification_state := DISCLOSED; value_at_risk := 1; reserved_units_delta := 1; exposure_floor_delta_cents := 9600
  - DeviceListing.mystery_shop_disclosed := true; DeviceListing.active_reservation_days := active_reservation_days + 1
  - Seller.exposure_floor_cents := seller_constraint_exposure + repaired exposure - reserved claim cents
- method: POST
  path: /v1/mystery-shop-verifications/{id}/void
  description: Void an open verification that produced no finding.
  roles:
  - ComplianceReviewer
  code: 200
  input:
  - void_reason
  output: MysteryShopVerification
  side_effects:
  - MysteryShopVerification.verification_state := VOIDED; no seller or listing mutation
- method: POST
  path: /v1/listings/{id}/warranty-reservations
  description: Open a second warranty reservation against a listing.
  roles:
  - ComplianceReviewer
  - ClaimAdjudicator
  code: 201
  input:
  - activated_on
  - warranty_period_days
  - reserved_units
  - unit_reserve_per_day_cents
  output: WarrantyReservation
  side_effects:
  - WarrantyReservation.warranty_state := ACTIVE; expired_on := activated_on + warranty_period_days
- method: GET
  path: /v1/listings/{id}/warranty-reservations
  description: List the warranty reservations servicing a listing.
  roles:
  - PlatformAdmin
  - ClaimAdjudicator
  - Seller
  - ComplianceReviewer
  code: 200
  input:
  - warranty_state?
  - limit?
  - offset?
  output: WarrantyReservation[]
  side_effects: []
- method: GET
  path: /v1/warranty-reservations
  description: List warranty reservations with optional filters.
  roles:
  - PlatformAdmin
  - ClaimAdjudicator
  - Seller
  code: 200
  input:
  - warranty_state?
  - limit?
  - offset?
  - originated_claim_id?
  output: WarrantyReservation[]
  side_effects: []
- method: GET
  path: /v1/warranty-reservations/{id}
  description: Read one warranty reservation.
  roles:
  - PlatformAdmin
  - ClaimAdjudicator
  - Seller
  code: 200
  input:
  - ''
  output: WarrantyReservation
  side_effects: []
- method: POST
  path: /v1/warranty-reservations/{id}/remediate
  description: Close a repair or replacement and return the reservation to ACTIVE, releasing the reserving exposure cell.
  roles:
  - ClaimAdjudicator
  code: 200
  input:
  - repair_estimate_cents?
  - replacement_listing_id?
  - expected_reservation_version?
  output: WarrantyReservation
  side_effects:
  - WarrantyReservation.warranty_state := ACTIVE; DeviceListing.active_reservation_days := 0
  - Seller.exposure_floor_cents := recomputed with the released cell subtracted; Seller.version increments by 1
- method: POST
  path: /v1/sellers/{id}/warranty-claims
  description: File a buyer warranty claim against one of the seller's listings, routed to the servicing seller.
  roles:
  - Consumer
  code: 201
  input:
  - listing_id
  - claim_reason_code
  - evidence_included
  output: WarrantyClaim
  side_effects:
  - WarrantyClaim.claim_state := FILED; WarrantyClaim.routed_seller_id := DeviceListing.servicing_seller_id
- method: GET
  path: /v1/listings/{id}/warranty-claims
  description: List the buyer claims filed against a listing.
  roles:
  - PlatformAdmin
  - ClaimAdjudicator
  - Seller
  - Consumer
  code: 200
  input:
  - routed_seller_id?
  - claim_state?
  - limit?
  - offset?
  output: WarrantyClaim[]
  side_effects: []
- method: GET
  path: /v1/warranty-claims
  description: List buyer claims with optional filters, including the routed-seller filter.
  roles:
  - PlatformAdmin
  - ClaimAdjudicator
  - Seller
  code: 200
  input:
  - routed_seller_id?
  - claim_state?
  - resolution_type?
  - limit?
  - offset?
  - replacement_listing_id?
  output: WarrantyClaim[]
  side_effects: []
- method: GET
  path: /v1/warranty-claims/{id}
  description: Read one claim.
  roles:
  - PlatformAdmin
  - ClaimAdjudicator
  - Seller
  - Consumer
  code: 200
  input:
  - ''
  output: WarrantyClaim
  side_effects: []
- method: POST
  path: /v1/warranty-claims/{id}/evidence
  description: Attach the buyer's diagnostic evidence bundle and enter the claim into review; debits the seller's exposure floor through the reservation.
  roles:
  - ClaimAdjudicator
  code: 200
  input:
  - diagnostic_evidence_digest
  output: WarrantyClaim
  side_effects:
  - WarrantyClaim.claim_state := UNDER_REVIEW; routed_seller_id pinned to the listing's servicing seller; claim_reserve_cents := 90000 (the pre-authorization cap when the reservation earns 1800 cents per day)
  - WarrantyReservation.claims_filed_count increments by 1; WarrantyReservation.version increments by 1
  - 'cascade depth 2: Seller.exposure_floor_cents recomputed; Seller.version increments by 1'
- method: POST
  path: /v1/warranty-claims/{id}/adjudicate
  description: Uphold or reject a claim under review, and select repair or replacement when upheld.
  roles:
  - ClaimAdjudicator
  code: 200
  input:
  - decision
  - resolution_type?
  - resolution_obligation_cents?
  - adjudicator_user_id
  output: WarrantyClaim
  side_effects:
  - decision APPROVED -> WarrantyClaim.claim_state := APPROVED; seller_funded_amount_cents := resolution_obligation_cents
  - 'cascade depth 3: the listing''s servicing WarrantyReservation flips to REPAIRING or REPLACED; DeviceListing.active_reservation_days increments by 1; the seller''s exposure floor is recomputed'
  - decision REJECTED -> WarrantyClaim.claim_state := REJECTED; claim_reserve_cents := 0
- method: POST
  path: /v1/warranty-claims/{id}/route-return
  description: Route the diagnosed device back to the original seller, closing the claim out.
  roles:
  - ClaimAdjudicator
  code: 200
  input:
  - return_carrier?
  - return_shipment_cents
  - return_shipment_start?
  - expected_claim_version?
  output: WarrantyClaim
  side_effects:
  - WarrantyClaim.claim_state := RESOLVED; seller_funded_amount_cents := seller_funded_amount_cents + return_shipment_cents; claim_reserve_cents := 0
  - Seller.exposure_floor_cents := recomputed with the released claim reserve subtracted
- method: GET
  path: /v1/grading-definitions
  description: List marketplace grading definitions.
  roles:
  - PlatformAdmin
  - ComplianceReviewer
  - Seller
  code: 200
  input:
  - definition_state?
  - limit?
  - offset?
  output: GradingDefinition[]
  side_effects: []
- method: GET
  path: /v1/grading-definitions/{id}
  description: Read one grading definition and whether it is the ACTIVE one.
  roles:
  - PlatformAdmin
  - ComplianceReviewer
  - Seller
  code: 200
  input:
  - ''
  output: GradingDefinition
  side_effects: []
- method: POST
  path: /v1/grading-definitions
  description: Create a draft marketplace grading definition.
  roles:
  - ComplianceReviewer
  code: 201
  input:
  - definition_code
  - cosmetic_thresholds
  - functional_thresholds
  - battery_floor_pct
  - effective_from
  output: GradingDefinition
  side_effects:
  - GradingDefinition.definition_state := DRAFT
- method: GET
  path: /v1/grading-definitions/{id}/device-listings
  description: List the device listings bound to a grading definition at submission time.
  roles:
  - PlatformAdmin
  - ComplianceReviewer
  code: 200
  input:
  - listing_state?
  - limit?
  - offset?
  output: DeviceListing[]
  side_effects: []
- method: POST
  path: /v1/grading-definitions/{id}/activate
  description: Publish a draft grading definition, binding every subsequent listing submission to it.
  roles:
  - ComplianceReviewer
  code: 200
  input:
  - expected_definition_version?
  output: GradingDefinition
  side_effects:
  - GradingDefinition.definition_state := ACTIVE; binding_definition_id := id
  - 'cascade: every listing currently UNDER_REVIEW under the previously ACTIVE definition is re-flagged for re-review'
- method: POST
  path: /v1/grading-definitions/{id}/retire
  description: Retire the active grading definition.
  roles:
  - ComplianceReviewer
  code: 200
  input:
  - retirement_note
  output: GradingDefinition
  side_effects:
  - GradingDefinition.definition_state := RETIRED; retired_on := current logical clock instant
- method: POST
  path: /v1/grading-definitions/{id}/reinstate
  description: Reinstate a retired grading definition.
  roles:
  - ComplianceReviewer
  code: 200
  input:
  - expected_definition_version?
  output: GradingDefinition
  side_effects:
  - GradingDefinition.definition_state := ACTIVE; retired_on := null
- method: POST
  path: /v1/trade-ins
  description: Submit a trade-in with the consumer's self-declared device condition; returns the provisional quote.
  roles:
  - Consumer
  code: 201
  input:
  - customer_ref
  - submitted_model_code
  - self_declared_cosmetic_grade
  - self_declared_functional_grade
  - self_declared_battery_health_pct
  - self_declared_carrier_lock_status
  output: TradeInSubmission
  side_effects:
  - TradeInSubmission.submission_state := SUBMITTED; provisional_quote_cents computed from the declaration
- method: GET
  path: /v1/trade-ins
  description: List trade-in submissions with optional filters.
  roles:
  - PlatformAdmin
  - TradeInInspector
  code: 200
  input:
  - submission_state?
  - limit?
  - offset?
  output: TradeInSubmission[]
  side_effects: []
- method: GET
  path: /v1/trade-ins/{id}
  description: Read one trade-in submission, including both the provisional and the final quote.
  roles:
  - PlatformAdmin
  - TradeInInspector
  - Consumer
  code: 200
  input:
  - ''
  output: TradeInSubmission
  side_effects: []
- method: POST
  path: /v1/trade-ins/{id}/inspection
  description: Record the inspector's measured device condition; a device measured below the uninsurable battery threshold is rejected outright.
  roles:
  - TradeInInspector
  code: 200
  input:
  - inspected_cosmetic_grade
  - inspected_functional_grade
  - inspected_battery_health_pct
  - inspected_carrier_lock_status
  output: TradeInSubmission
  side_effects:
  - submission_state := INSPECTED unless the measured battery health is below the uninsurable threshold, in which case submission_state := REJECTED
- method: POST
  path: /v1/trade-ins/{id}/inspection-revision
  description: Revise the quote after inspection, applying the declared-versus-measured step penalty and the inspection fee.
  roles:
  - TradeInInspector
  code: 200
  input:
  - inspected_cosmetic_grade?
  - inspected_functional_grade?
  - inspected_battery_health_pct?
  - inspected_carrier_lock_status?
  output: TradeInSubmission
  side_effects:
  - submission_state := PRICE_REVISED; final_quote_cents computed; inspection_fee_cents := 1500; acceptance_deadline := current logical clock instant plus 7 calendar days; revision_count increments by 1
- method: POST
  path: /v1/trade-ins/{id}/accept
  description: Consumer accepts the revised trade-in quote.
  roles:
  - Consumer
  code: 200
  input:
  - ''
  output: TradeInSubmission
  side_effects:
  - submission_state := ACCEPTED
- method: POST
  path: /v1/service-scores
  description: Open a service-score section for a seller.
  roles:
  - PlatformAdmin
  code: 201
  input:
  - seller_id
  - section_opened_on
  output: SellerServiceScore
  side_effects:
  - SellerServiceScore.section_state := OPEN
- method: GET
  path: /v1/service-scores
  description: List service-score sections with optional seller and state filters.
  roles:
  - PlatformAdmin
  - ComplianceReviewer
  - Seller
  code: 200
  input:
  - seller_id?
  - section_state?
  - limit?
  - offset?
  output: SellerServiceScore[]
  side_effects: []
- method: GET
  path: /v1/service-scores/{id}
  description: Read one service-score section with its four components and weighted score.
  roles:
  - PlatformAdmin
  - ComplianceReviewer
  - Seller
  code: 200
  input:
  - ''
  output: SellerServiceScore
  side_effects: []
- method: POST
  path: /v1/service-scores/{id}/close
  description: Close a section, recompute its four components and weighted score, and drive the seller's tier.
  roles:
  - System
  code: 200
  input:
  - expected_seller_version
  output: SellerServiceScore
  side_effects:
  - SellerServiceScore.section_state := CLOSED; section_closed_on := current logical clock instant; components and service_score recomputed
  - 'cascade depth 2: Seller.performance_tier remapped; Seller.suspension_trigger_count incremented when the score breaches the suspension threshold; Seller.version increments by 1'
  - increments Seller.version by 1
- method: POST
  path: /v1/_clock/set_current_utc
  description: 'Test-driving endpoint: move the logical clock. The server starts with the logical clock fixed at 2026-09-01T00:00:00Z and never falls back to wall-clock time; every deadline, expiry, section-window and acceptance-window rule is evaluated against this clock.'
  roles:
  - PlatformAdmin
  code: 200
  input:
  - to_iso8601
  output: null
  side_effects:
  - logical clock := to_iso8601
  - 'system transitions whose guard depends on the clock are evaluated in this call: warranty reservations past expired_on become COMPLETED; trade-in submissions past acceptance_deadline become REJECTED'
- method: POST
  path: /v1/audit-records/{id}/transition
  description: Record the outcome of a refurbishment process audit; a score below the pass band sends the seller back to APPLICANT and a score at or above the band approves the seller.
  roles:
  - ComplianceReviewer
  code: 200
  input:
  - target_state
  - audit_score
  - auditor_user_id
  output: SellerAuditRecord
  side_effects:
  - SellerAuditRecord.audit_state := PASSED or FAILED
  - audit_score >= 70 -> Seller.onboarding_state := APPROVED and Seller.performance_tier := PROBATION
  - audit_score <= 69 -> Seller.onboarding_state := APPLICANT
  - declared_monthly_throughput > Seller.refurbishment_capacity_units -> Seller.onboarding_state := REJECTED
  - Seller.version increments by 1
- method: GET
  path: /v1/listings/{id}/mystery-shop-verifications
  description: List the mystery-shop verifications opened against a listing.
  roles:
  - ComplianceReviewer
  - PlatformAdmin
  code: 200
  input:
  - verification_state?
  - limit?
  - offset?
  output: MysteryShopVerification[]
  side_effects: []
- method: GET
  path: /v1/mystery-shop-verifications/{id}
  description: Read one mystery-shop verification.
  roles:
  - ComplianceReviewer
  - PlatformAdmin
  code: 200
  input: []
  output: MysteryShopVerification
  side_effects: []
- method: GET
  path: /v1/audit-records/{id}
  description: Read one refurbishment process audit record.
  roles:
  - ComplianceReviewer
  - PlatformAdmin
  code: 200
  input: []
  output: SellerAuditRecord
  side_effects: []
errors:
- id: ERR_INVALID_REQUEST
  http: 400
  condition: a required input field is missing, an enum-valued field carries an undeclared member, or a numeric field is outside its declared range
- id: ERR_UNAUTHENTICATED
  http: 401
  condition: X-User-Role or X-User-ID header absent on an endpoint that requires credentials
- id: ERR_FORBIDDEN_ROLE
  http: 403
  condition: the acting role is not listed on the target endpoint, or the role is barred from the operation by the segregation-of-duties matrix
- id: ERR_SOD_VIOLATION
  http: 403
  condition: the operator attempting the operation recorded the preceding step for the same resource (auditor may not approve the audited seller listing; evidence recorder may not adjudicate the same claim)
- id: ERR_RESOURCE_NOT_FOUND
  http: 404
  condition: a resource id in the path does not exist
- id: ERR_REFERENCED_ENTITY_NOT_FOUND
  http: 404
  condition: a body-supplied foreign key does not resolve to an existing row
- id: ERR_RESERVATION_NOT_FOUND
  http: 404
  condition: the warranty reservation selector found no candidate row in {ACTIVE, REPAIRING, REPLACED} for the listing
- id: ERR_DIAGNOSTIC_EVIDENCE_REQUIRED
  http: 422
  condition: a claim is moved to UNDER_REVIEW without a diagnostic_evidence_digest of exactly 64 lowercase hex characters
- id: ERR_DEVICE_BLOCKLISTED
  http: 422
  condition: the submitted imei appears on the stolen-device blocklist or the counterfeit blocklist
- id: ERR_BATTERY_BELOW_FLOOR
  http: 422
  condition: battery_health_pct is below the ACTIVE grading definition floor, or below the hard floor of 80 when no definition is ACTIVE
- id: ERR_INSPECTION_BATTERY_UNINSURABLE
  http: 422
  condition: inspected_battery_health_pct is strictly below 70 at trade-in inspection
- id: ERR_PART_PROVENANCE_UNDOCUMENTED
  http: 422
  condition: part_provenance is OEM_EQUIVALENT or AFTERMARKET and provenance_doc_digest is absent or malformed
- id: ERR_RETURN_SLOT_COLLISION
  http: 409
  condition: the return shipment window [return_shipment_start, return_shipment_start + 86400) touches an already-booked return interval on the same carrier
- id: ERR_VERIFICATION_OVERLAP
  http: 409
  condition: a mystery-shop verification window strictly overlaps an OPEN verification window for the same listing
- id: ERR_COUNTERFEIT_PRICE_SIGNAL
  http: 422
  condition: list_price_cents is more than 50% below the model catalog floor, which is the counterfeit-pricing screen
- id: ERR_MODEL_NOT_ELIGIBLE
  http: 422
  condition: model_code is absent from the supported-model catalog or carries an active restricted-model restriction
- id: ERR_SELLER_NOT_APPROVED
  http: 422
  condition: the seller holding or submitting a listing is not in onboarding_state APPROVED
- id: ERR_ROUTED_SELLER_IMMUTABLE
  http: 422
  condition: a claim return is routed to a seller other than the routed_seller_id pinned when the claim entered UNDER_REVIEW
- id: ERR_INVALID_STATE
  http: 409
  condition: the target resource is not in a state from which the requested transition exists
- id: ERR_CLAIM_TERMINAL
  http: 409
  condition: a claim in RESOLVED or REJECTED is mutated again
- id: ERR_CLAIM_ALREADY_UPHELD
  http: 409
  condition: a claim already APPROVED and awaiting return routing is upheld a second time
- id: ERR_OBLIGATION_EXCEEDS_CAP
  http: 422
  condition: resolution_obligation_cents exceeds 25000 for REPAIR or 90000 for REPLACE
- id: ERR_HUMAN_REVIEW_REQUIRED
  http: 422
  condition: a seller whose suspension_trigger_count has reached the documented minimum-trigger threshold of 5 is blocklisted again and needs human review first
- id: ERR_TRIGGER_CEILING_REACHED
  http: 422
  condition: suspension_trigger_count has reached the trigger ceiling of 99, after which the seller can never be blocklisted
- id: ERR_STALE_VERSION
  http: 412
  condition: the expected_<parent>_version supplied with the request does not equal the parent entity current version
- id: ERR_VERIFICATION_ALREADY_DISCLOSED
  http: 409
  condition: a listing already carries a DISCLOSED mystery-shop verification
- id: ERR_AUDIT_ALREADY_SCHEDULED
  http: 409
  condition: a seller already has an audit record in IN_PROGRESS, so a second audit cannot be booked
- id: ERR_SELLER_ALREADY_BLOCKLISTED
  http: 409
  condition: the seller is already blocklisted
- id: ERR_SECTION_BLOCKED_BY_OPEN_CLAIM
  http: 409
  condition: a service-score section cannot close while a claim routed to the seller is APPROVED and unresolved
- id: ERR_SECTION_TOO_YOUNG
  http: 409
  condition: a service-score section is closed fewer than 90 calendar days after section_opened_on
- id: ERR_REVISION_LIMIT_REACHED
  http: 409
  condition: a trade-in submission is revised a second time, beyond its one free revision round
- id: ERR_ACCEPTANCE_WINDOW_CLOSED
  http: 409
  condition: the trade-in acceptance window has lapsed, so the revised quote can no longer be accepted
- id: ERR_IMEI_ALREADY_LISTED
  http: 422
  condition: a non-WITHDRAWN listing for the same seller already carries the submitted imei
- id: ERR_GRADING_DEFINITION_NOT_ACTIVE
  http: 409
  condition: the grading definition bound to a listing at submission is no longer ACTIVE when the review decision is recorded
- id: ERR_WITHDRAW_BLOCKED_BY_OPEN_CLAIM
  http: 409
  condition: the listing carries a claim in FILED, UNDER_REVIEW or APPROVED, or a reservation in REPAIRING
roles:
- name: PlatformAdmin
  description: Marketplace operator with configuration and read authority over the whole catalog.
  identity: opaque
  exclusive_operations:
  - POST /v1/sellers
  - POST /v1/service-scores
  - POST /v1/_clock/set_current_utc
  shared_operations:
  - GET /v1/sellers
  - GET /v1/sellers/{id}
  - GET /v1/sellers/{id}/exposure-floor
  - GET /v1/listings
  - GET /v1/warranty-claims
  - GET /v1/grading-definitions
  - GET /v1/service-scores
- name: ComplianceReviewer
  description: Operator who audits sellers, confirms grading definitions and rules on listing and grading findings; may not approve the listing of a seller it audited.
  identity: opaque
  exclusive_operations:
  - POST /v1/sellers/{id}/verify-documents
  - POST /v1/sellers/{id}/audit-records
  - POST /v1/audit-records/{id}/transition
  - POST /v1/sellers/{id}/suspend
  - POST /v1/sellers/{id}/blocklist
  - POST /v1/mystery-shop-verifications
  - POST /v1/mystery-shop-verifications/{id}/disclose
  - POST /v1/mystery-shop-verifications/{id}/void
  - POST /v1/listings/{id}/review
  - POST /v1/grading-definitions
  - POST /v1/grading-definitions/{id}/activate
  - POST /v1/grading-definitions/{id}/retire
  - POST /v1/grading-definitions/{id}/reinstate
  shared_operations:
  - GET /v1/sellers
  - GET /v1/listings
  - GET /v1/grading-definitions
  - GET /v1/listings/{id}/warranty-reservations
- name: ClaimAdjudicator
  description: Operator who rules on buyer claims, nominates repair or replacement and routes the return to the original seller; may not adjudicate a claim whose evidence it recorded.
  identity: opaque
  exclusive_operations:
  - POST /v1/warranty-claims/{id}/evidence
  - POST /v1/warranty-claims/{id}/adjudicate
  - POST /v1/warranty-claims/{id}/route-return
  - POST /v1/warranty-reservations/{id}/remediate
  shared_operations:
  - GET /v1/warranty-claims
  - GET /v1/warranty-claims/{id}
  - GET /v1/listings/{id}/warranty-claims
  - GET /v1/sellers/{id}/exposure-floor
- name: TradeInInspector
  description: Operator who inspects traded-in devices and revises their quotes.
  identity: opaque
  exclusive_operations:
  - POST /v1/trade-ins/{id}/inspection
  - POST /v1/trade-ins/{id}/inspection-revision
  shared_operations:
  - GET /v1/trade-ins
  - GET /v1/trade-ins/{id}
- name: Seller
  description: A persisted refurbishing seller acting as itself; owns its listings and may re-submit them for review.
  identity: entity_backed:Seller
  exclusive_operations:
  - POST /v1/sellers/{id}/listings
  - POST /v1/listings/{id}/submit
  - POST /v1/listings/{id}/withdraw
  shared_operations:
  - GET /v1/sellers/{id}
  - GET /v1/listings
  - GET /v1/listings/{id}
  - GET /v1/warranty-claims
  - GET /v1/trade-ins/{id}
- name: Consumer
  description: A buyer or trade-in consumer acting under an opaque reference; files claims and accepts revised trade-in quotes.
  identity: opaque
  exclusive_operations:
  - POST /v1/sellers/{id}/warranty-claims
  - POST /v1/trade-ins
  - POST /v1/trade-ins/{id}/accept
  shared_operations:
  - GET /v1/listings/{id}/warranty-claims
  - GET /v1/warranty-claims/{id}
  - GET /v1/trade-ins/{id}
- name: System
  description: The scheduler acting on the logical clock; closes sections, expires reservations and lapses trade-in acceptance windows.
  identity: opaque
  exclusive_operations:
  - POST /v1/service-scores/{id}/close
  shared_operations: []
- name: Anonymous
  description: Unauthenticated caller; only used as the actor marker on endpoints that admit no credentials.
  identity: opaque
  exclusive_operations: []
  shared_operations: []
