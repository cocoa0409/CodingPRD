          trigger:
            - call: "POST /floral/orders/${ord_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { est: $.data.estimated_total_cents }
          assert:
            - "Order.${ord_id}.fulfillment_status == QUOTED"
