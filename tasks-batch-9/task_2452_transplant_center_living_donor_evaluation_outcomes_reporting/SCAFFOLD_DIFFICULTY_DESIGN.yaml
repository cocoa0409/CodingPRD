      - DonorCostClaim.${claim_a_id}.fund_part_cents == 400000 is retained on the row for audit, but a
        REVERSED row is excluded from the ledger sum
      - a subsequent MEDICAL claim of 1000000 cents for the same donor can again be adjudicated in full,
        proving the donor lifetime headroom was restored too
  - name: chain_commitment_count_conserved_on_break
    grounds:
    - calculations.chain_commitment_conservation
    - calculations.chain_commitment_conservation.invariants
    - state_machines.ExchangeChain.COMMITTED_to_BROKEN
    - state_machines.DonorCandidate.overall_status.CHAIN_COMMITTED_to_APPROVED
    - entities.ExchangeChain.fields.committed_donor_count
    distinguishing_aspect: 'A different KIND of conserved quantity: an ENTITY COUNT, not money. The invariant
      is a two-sided identity between an aggregate field (sum of committed_donor_count over the program''s
      chains) and a population count (donors whose overall_status == CHAIN_COMMITTED). Breaking the chain
      must zero one side and release every row on the other side in the same request, so the two sides
      never disagree - and each released donor must land on the state its stored final_risk_index dictates.'
    test_recipe:
      setup:
      - A COMMITTED 2-segment PAIRED_LOOP with committed_donor_count 2
      - Exactly two DonorCandidate rows in the program with overall_status == CHAIN_COMMITTED, so both
        sides of the invariant read 2
      - Both donors have final_risk_index 0.0 (< RISK_INDEX_CEILING 8.0), so the release target is APPROVED
        for both
      - No ProcedureBooking exists, so the release is observed on the commitment ledger alone
      - The logical clock is at 2026-08-08T00:00:00Z
