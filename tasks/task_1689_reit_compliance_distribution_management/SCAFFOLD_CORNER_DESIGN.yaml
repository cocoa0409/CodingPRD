              payload: { reit_id: "${reit_id}", taxable_year: 2026, taxable_income_cents: 900000, net_capital_gain_cents: 100000 }
              as: ComplianceOfficer
              captures: { req26: $.data.id }
            - call: "POST /reit-compliance/distribution-requirements"
              payload: { reit_id: "${reit_id}", taxable_year: 2027, taxable_income_cents: 100000, net_capital_gain_cents: 200000 }
              as: ComplianceOfficer
              captures: { req27: $.data.id }
          trigger:
            - call: "POST /reit-compliance/distribution-requirements/${req26}/post"
              payload: {}
              as: ComplianceOfficer
              captures: { req26_amt: $.data.required_amount_cents }
            - call: "POST /reit-compliance/distribution-requirements/${req27}/post"
              payload: {}
              as: ComplianceOfficer
              captures: { req27_amt: $.data.required_amount_cents }
          assert:
            - "2026: required_amount_cents == 720000"
            - "2027: required_amount_cents == 0 (zero floor — no negative requirement)"

      - name: distribution_requirement_half_cent_rounding
        claim_type: precision
        grounds: [calculations.calc_distribution_requirement]
        distinguishing_aspect: "taxable_income 1000001, ncg 0 -> 900000.9 rounds half-up to 900001 cents (integer-cent precision pinned)."
        test_recipe:
          setup: ["Reit R1 ACTIVE; DRAFT requirement 2026 ti 1000001 ncg 0"]
          setup_api_calls:
