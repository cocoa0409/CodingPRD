        grounds:
          - complexity_profile.consistency_model
          - calculations.benefit_entitlement_reconciliation
          - calculations.rewards_points_balance
        distinguishing_aspect: "The denormalized rollups are recomputed on read, so a GET issued immediately after a mutation already reflects the new value — the eventual model is observable through the read side rather than through any delay."
        test_recipe:
          setup:
