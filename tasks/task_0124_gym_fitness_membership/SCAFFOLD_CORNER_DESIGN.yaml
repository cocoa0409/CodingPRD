              payload: { plan_id: "${plan_id}", home_location_id: "${loc_id}", full_name: "Imm Member", email: "imm@x.com", period_start: "2026-06-10T00:00:00Z", period_end: "2026-07-01T00:00:00Z", due_date: "2026-06-10T00:00:00Z" }
              as: StaffManager
