              as: ProgramAdmin
              captures: { ch2_aug_id: $.data.id }
            - call: "POST /point-cycles"
              payload: { banner_id: "${bh2_id}", cycle_month: "2026-09", opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-30T23:59:59.999Z" }
              as: ProgramAdmin
              captures: { ch2_sep_id: $.data.id }
            - call: "POST /point-cycles"
              payload: { banner_id: "${ba2_id}", cycle_month: "2026-08", opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-08-31T23:59:59.999Z" }
              as: ProgramAdmin
              captures: { ca2_aug_id: $.data.id }
            - call: "POST /point-cycles"
              payload: { banner_id: "${ba2_id}", cycle_month: "2026-09", opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-30T23:59:59.999Z" }
              as: ProgramAdmin
              captures: { ca2_sep_id: $.data.id }
            - call: "POST /sites"
