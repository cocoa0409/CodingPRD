            - "AnnualOperatingInstruction.${c_aoi3_id}.aoi_status == \"VOIDED\" before the trigger"
            - "trigger returns HTTP 409 with data.error_id == \"ERR_AOI_STATE_INVALID\""
            - "AnnualOperatingInstruction.${c_aoi3_id}.aoi_status is still \"VOIDED\""
            - "GET /grazing-bills with aoi_id ${c_aoi3_id} returns total_count 0"
            - "Allotment.${c_a20_id}.allocated_aums == 0 and open_aums == 500 — a voided AOI reserves nothing"

      - name: corner_closure_order_lift_twice_rejected
        claim_type: idempotency
        grounds:
          - state_machines.ClosureOrder.ACTIVE_to_LIFTED
          - validations.priority_8
          - errors.ERR_CLOSURE_ORDER_STATE_INVALID
        distinguishing_aspect: "LIFTED is terminal for a ClosureOrder: the second POST /closure-orders/{closureOrderId}/lift returns HTTP 409 ERR_CLOSURE_ORDER_STATE_INVALID and does NOT re-run the reallocation cascade a second time, so the allotment's version stops moving."
        test_recipe:
          setup:
            - "One allotment with a DROUGHT_REDUCTION order at reduction_pct 0.25 that has already been lifted once"
          setup_api_calls:
            - call: "POST /allotments"
              payload: { name: "Double Lift Allotment", admin_unit_code: "NV-123", acres: 22000, total_permitted_aums: 800, season_start: "01-01", season_end: "12-31", required_pasture_rotation_count: 1 }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_a21_id: "$.data.id" }
            - call: "POST /closure-orders"
              payload: { allotment_id: "${c_a21_id}", order_type: "DROUGHT_REDUCTION", effective_start_date: "2026-08-05", effective_end_date: "2026-10-31", justification: "Below-average spring precipitation across the unit.", reduction_pct: 0.25 }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_co1_id: "$.data.id" }
            - call: "POST /closure-orders/${c_co1_id}/lift"
              payload: { justification: "Late-summer monsoon restored forage production." }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
            - call: "GET /allotments/${c_a21_id}"
              payload: {}
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_a21_ver: "$.data.version" }
          trigger:
            - call: "POST /closure-orders/${c_co1_id}/lift"
              payload: { justification: "Duplicate lift submitted by the field office." }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
          assert:
            - "HTTP 409 with data.error_id == \"ERR_CLOSURE_ORDER_STATE_INVALID\""
            - "ClosureOrder.${c_co1_id}.order_status is still \"LIFTED\""
            - "Allotment.${c_a21_id}.version == ${c_a21_ver} — unchanged, so the cascade did not run again"
            - "Allotment.${c_a21_id}.stocking_adjustment_pct == 0.0 and effective_capacity_aums == 800 and allotment_status == \"OPEN\""

      - name: corner_appeal_docket_moves_filed_to_under_review
        claim_type: valid_transition
        grounds:
          - state_machines.AppealCase.FILED_to_UNDER_REVIEW
          - endpoints.POST_/appeal-cases/{appealId}/docket
        distinguishing_aspect: "Docketing a FILED appeal moves it to UNDER_REVIEW and stamps adjudicator_id from X-User-ID while leaving stay_granted, remand_count and the appealed decision's STAYED status untouched."
        test_recipe:
          setup:
            - "One FINAL STOCKING_ADJUSTMENT decision appealed with stay_requested true, so the decision is STAYED and the appeal is FILED"
          setup_api_calls:
            - call: "POST /allotments"
              payload: { name: "Docket Probe Allotment", admin_unit_code: "NV-124", acres: 21000, total_permitted_aums: 760, season_start: "01-01", season_end: "12-31", required_pasture_rotation_count: 1 }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_a22_id: "$.data.id", c_a22_ver: "$.data.version" }
            - call: "POST /permittees"
              payload: { name: "Docket Probe Ranch", contact_email: "docket@example.com" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_m8_id: "$.data.id" }
            - call: "POST /permit-decisions"
              payload: { decision_type: "STOCKING_ADJUSTMENT", allotment_id: "${c_a22_id}", expected_allotment_version: "${c_a22_ver}", nepa_level: "CX", adjustment_pct: 0.3, effective_date: "2026-09-01" }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { c_d3_id: "$.data.id" }
            - call: "POST /permit-decisions/${c_d3_id}/complete-environmental-review"
              payload: { nepa_findings_summary: "Categorical exclusion applies to a temporary stocking change." }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
            - call: "POST /permit-decisions/${c_d3_id}/finalize"
              payload: { rationale: "Reduce authorized use by thirty percent for the balance of the season." }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
            - call: "POST /permit-decisions/${c_d3_id}/appeals"
              payload: { appellant_permittee_id: "${c_m8_id}", stay_requested: true, statement_of_reasons: "The reduction relies on utilization data collected outside the growing season." }
              as: Permittee
              as_user_id: "${c_m8_id}"
              captures: { c_ap1_id: "$.data.id" }
          trigger:
            - call: "POST /appeal-cases/${c_ap1_id}/docket"
              payload: {}
              as: AppealsAdjudicator
              as_user_id: "u_judge_1"
          assert:
            - "HTTP 200 and AppealCase.${c_ap1_id}.appeal_status == \"UNDER_REVIEW\""
            - "AppealCase.${c_ap1_id}.adjudicator_id == \"u_judge_1\""
            - "AppealCase.${c_ap1_id}.stay_granted == true and remand_count == 0"
            - "PermitDecision.${c_d3_id}.decision_status is still \"STAYED\" and Allotment.${c_a22_id}.stocking_adjustment_pct is still 0.0 — docketing has no cascade"

      - name: corner_appeal_decide_before_docketing_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.AppealCase.transitions
          - validations.priority_8
          - errors.ERR_APPEAL_STATE_INVALID
        distinguishing_aspect: "POST /appeal-cases/{appealId}/decide is only legal from UNDER_REVIEW: deciding a FILED appeal returns HTTP 409 ERR_APPEAL_STATE_INVALID, and in particular a REVERSE cannot skip docketing to vacate the decision."
        test_recipe:
