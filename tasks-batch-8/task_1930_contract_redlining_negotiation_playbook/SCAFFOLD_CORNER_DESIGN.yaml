            - call: "POST /users"
              payload: { email: "ca_occ1@x.com", display_name: "CA", primary_role: "CONTRACT_ANALYST" }
              as: OpsAdmin
              captures: { ca_id: $.data.id }
            - call: "POST /users"
              payload: { email: "cc_occ1@x.com", display_name: "CC", primary_role: "CHIEF_COUNSEL" }
              as: OpsAdmin
              captures: { cc_id: $.data.id }
            - call: "POST /contract-types"
              payload: { code: "OCC1", display_name: "OCC1", low_value_threshold_cents: 100000, mid_value_threshold_cents: 500000, high_value_threshold_cents: 2000000, auto_approve_below_cents: 50000, requires_chief_counsel_above_cents: 10000000, default_business_owner_id: "${bo_id}", default_legal_counsel_id: "${lc_id}" }
              as: OpsAdmin
              captures: { ct_id: $.data.id }
            - call: "POST /counterparties"
              payload: { legal_name: "OCC1", jurisdiction: "US-CA" }
              as: OpsAdmin
              captures: { cp_id: $.data.id }
            - call: "POST /playbooks"
              payload: { name: "OCC1" }
              as: ChiefCounsel
              as_user_id: "${cc_id}"
              captures: { pb_id: $.data.id }
            - call: "POST /playbooks/${pb_id}/clauses"
              payload: { clause_key: "A", category: "OPERATIONAL", standard_text: "a", fallback_positions: [], approver_role_required: "LEGAL_COUNSEL", deviation_severity_cap: "LOW" }
              as: ChiefCounsel
              as_user_id: "${cc_id}"
            - call: "POST /playbooks/${pb_id}/publish"
              payload: {}
              as: ChiefCounsel
              as_user_id: "${cc_id}"
            - call: "POST /intake-requests"
              payload: { submitted_by_user_id: "${ca_id}", contract_type_id: "${ct_id}", counterparty_id: "${cp_id}", contract_value_cents: 1000, effective_date: "2026-09-01T00:00:00Z" }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { ir_id: $.data.id }
            - call: "POST /intake-requests/${ir_id}/triage"
              payload: {}
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { ir_v: $.data.version }
          trigger:
            - call: "POST /intake-requests/${ir_id}/open-negotiation"
              payload: { playbook_id: "${pb_id}", drafter_user_id: "${ca_id}", expected_intake_request_version: "${ir_v}" }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
            # Second call with stale version
            - call: "POST /intake-requests/${ir_id}/open-negotiation"
              payload: { playbook_id: "${pb_id}", drafter_user_id: "${ca_id}", expected_intake_request_version: "${ir_v}" }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION"
            - "HTTP status == 412"

      - name: occ_stale_version_on_decide
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[deviation-decide-stale-negotiation]
        distinguishing_aspect: "Approver reads Negotiation.version, another writer mutates (new round opens) bumping version; approver's decide carrying stale version fails 412."
        test_recipe:
          setup: ["Negotiation REDLINING, Deviation IN_REVIEW; approver holds stale version"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /users"
              payload: { email: "bo_occ2@x.com", display_name: "BO", primary_role: "BUSINESS_OWNER" }
              as: OpsAdmin
              captures: { bo_id: $.data.id }
            - call: "POST /users"
