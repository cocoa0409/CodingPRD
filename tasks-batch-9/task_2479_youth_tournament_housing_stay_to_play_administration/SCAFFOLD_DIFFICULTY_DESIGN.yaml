  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: team_stay_closed_interval_adjacent_day_collision
        grounds:
          - validations[priority=55]
          - errors.ERR_TEAM_STAY_OVERLAP
          - endpoints[POST /housing/bookings]
        distinguishing_aspect: |
          Interval semantics are CLOSED with adjacency FORBIDDEN, and the contended resource is
          the TEAM itself — a team cannot be checked in at two properties on the same calendar
          day. A stay of 2026-09-10 to 2026-09-12 at hotel A therefore collides with a stay of
          2026-09-12 to 2026-09-14 at hotel B, because the closed intervals share the endpoint
          2026-09-12, even though the half-open night sets are disjoint. Shifting the second stay
          to 2026-09-13 to 2026-09-14 makes it legal. Any implementation using half-open night
          comparison here accepts the illegal pair.
        test_recipe:
          setup:
            - "Tournament posture OPEN, 2026-09-10 to 2026-09-13, so the legal block window is 2026-09-08 to 2026-09-15."
            - "Two hotels, each with its own EXECUTED HotelContract and one 20-room block spanning 2026-09-08 to 2026-09-15, so no capacity rule can interfere."
            - "One team with a single registration: 13 players and 3 staff, required_rooms_registered 6."
            - "An existing booking of 1 room at hotel A for 2026-09-10 to 2026-09-12."
          setup_api_calls:
            - call: "POST /housing/tournaments"
              payload: { name: "Fall Classic 2026", rights_holder_org: "USYS", destination_org: "Metro CVB", start_date: "2026-09-10", end_date: "2026-09-13", booking_deadline: "2026-09-01T00:00:00Z", stay_to_play_required: true, share_pct_organizer: 0.50, share_pct_rights_holder: 0.30, share_pct_destination: 0.20 }
