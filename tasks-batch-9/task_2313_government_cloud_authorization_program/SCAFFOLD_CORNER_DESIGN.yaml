      - 'at the clock instant: HTTP 201; PoamItem.${poam_now_id}.detected_at == anchor_at == 2026-03-01T00:00:00Z and deadline_at
        == 2026-03-31T00:00:00Z'
      - 'in the past: HTTP 201; PoamItem.${poam_past_id}.anchor_at == 2026-02-15T00:00:00Z and deadline_at == 2026-03-17T00:00:00Z
        — anchored on detection, not on the clock'
      - 'the past item is not yet overdue: is_overdue(2026-03-01T00:00:00Z) is false because 2026-03-01 < 2026-03-17'
      - 'GET /poam-items for the offering: total_count == 2'
