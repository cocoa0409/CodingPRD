      - name: outlet_listing_combined_region_and_status_filter
        claim_type: listing
        grounds:
          - endpoints[GET /fountain-network/outlets]
          - state_machines.Outlet.status.ACTIVE_to_SUSPENDED
        distinguishing_aspect: "region_code=R-WEST combined with status=ACTIVE returns only the one R-WEST outlet still ACTIVE — the suspended R-WEST outlet and the ACTIVE R-EAST outlet are both excluded."
        test_recipe:
          setup:
            - "Two R-WEST Outlets (one later SUSPENDED) and one ACTIVE R-EAST Outlet."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
              payload: { name: "Riverside Diner", account_code: "OUT-1001", region_code: "R-WEST" }
              as: NetworkAdmin
              captures: { o: $.data.id }
            - call: "POST /fountain-network/outlets"
              payload: { name: "Corner Deli", account_code: "OUT-1002", region_code: "R-WEST" }
              as: NetworkAdmin
              captures: { o2: $.data.id }
            - call: "POST /fountain-network/outlets"
              payload: { name: "Harbor Cafe", account_code: "OUT-1003", region_code: "R-EAST" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets/${o2}/status-change"
              payload: { action: "SUSPEND" }
              as: NetworkAdmin
          trigger:
            - call: "GET /fountain-network/outlets?region_code=R-WEST&status=ACTIVE"
              as: NetworkAdmin
          assert:
            - "the returned array holds exactly 1 Outlet row and its id == ${o}"
            - "pagination total_count == 1"
            - "Outlet.${o2}.status == SUSPENDED"

      - name: outlet_not_found_on_unknown_id
        claim_type: not_found
        grounds:
          - errors[ERR_OUTLET_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "GET on a well-formed UUID that matches no Outlet returns ERR_OUTLET_NOT_FOUND 404, not an empty object."
        test_recipe:
