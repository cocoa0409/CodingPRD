              as: EnrollmentAdmin
              captures: { iep_id: $.data.id }
            - call: "POST /part-b-enrollments"
              payload: { beneficiary_id: "${ben_id}", enrollment_period_id: "${iep_id}" }
              as: EnrollmentAdmin
              captures: { pbe_id: $.data.id }
            - call: "POST /part-b-enrollments/${pbe_id}/activate"
