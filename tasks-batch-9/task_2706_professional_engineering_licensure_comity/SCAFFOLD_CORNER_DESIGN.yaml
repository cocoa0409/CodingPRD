      - name: plan_seal_guards_attestation_then_plan_state
        claim_type: error_triggerable
        grounds:
          - errors.ERR_ATTESTATION_MISSING
          - errors.ERR_PLAN_STATE_INVALID
          - validations[priority=41]
          - state_machines.PlanSubmission.transitions.DRAFT_to_SEALED
        distinguishing_aspect: "A seal request with responsible_charge_attested false is 422 ERR_ATTESTATION_MISSING and leaves the set DRAFT with sealing_license_id null; the honest attestation then seals it, and a repeat seal on the SEALED set is 409 ERR_PLAN_STATE_INVALID with seal_affixed_at unchanged."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default."
            - "Engineer 'Tova Lind' holds an ACTIVE licence issued 2026-01-15 and is the responsible charge of ACTIVE FirmRegistration 'Lind Engineering PC' (OR), which has one DRAFT PlanSubmission 'Riverside Pump Station' of 12 sheets."
          setup_api_calls:
