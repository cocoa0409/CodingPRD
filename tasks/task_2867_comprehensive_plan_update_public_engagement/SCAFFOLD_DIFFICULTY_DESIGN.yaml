      - name: state_deficient_determination_four_link_freeze_cascade
        grounds:
          - state_machines.PlanUpdate.STATE_SUBMITTED_to_STATE_DEFICIENT
          - state_machines.PlanElement.APPROVED_to_REVISION_REQUESTED
          - state_machines.ConsistencyLink.CLEARED_to_OPEN
          - calculations.compliance_posture
        distinguishing_aspect: |
          A different trigger from the amendment cascade - POST /planning/plan-updates/{id}/state-determination
          with determination DEFICIENT - drives four causally chained links: the mandate verdict is
          recorded (1) -> every APPROVED element whose element_type is named in deficient_element_types
          is demoted to REVISION_REQUESTED with revision_round += 1 and consistency_status STALE (2)
          -> every CLEARED ConsistencyLink targeting a demoted element reopens to OPEN and stales its
          source element (3) -> the plan's counters are recomputed and compliance_posture becomes
          FROZEN, which outranks CONSISTENCY_HOLD in the posture precedence order (4).
        test_recipe:
          setup:
            - "The same plan as amendment_adoption_five_link_consistency_cascade up to state submission: four CERTIFIED inventories, ADOPTED TREND scenario, four allocations with zero shortfall, five APPROVED elements, a CLEARED ConsistencyLink from TRANSPORTATION to LAND_USE, one completed WORKSHOP at equity 40.0 and a CIRCULATED EIR."
