            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 8, start_date: "2026-08-01", end_date: "2026-08-31" }, as: SystemAdmin, as_user_id: admin-1 }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: CAPITAL, title: "Cancel early", initial_estimated_cost_cents: 400000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wa: $.data.id } }
