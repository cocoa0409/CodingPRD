      - name: gating_an_event_closed_forfeits_scheduled_slots_and_denies_outstanding_requests
        claim_type: cascade_down
        grounds:
          - state_machines.SelectionEvent.status.transitions.OPEN_to_CLOSED
          - state_machines.SelectionSlot.slot_status.transitions.SCHEDULED_to_FORFEITED
          - state_machines.RelocationRequest.status.transitions.AWAITING_SELECTION_to_DENIED
          - endpoints.POST_/athletics/selection-events/{id}/gate
        distinguishing_aspect: |
          One gate CLOSED request must fan out to two different child entity types
          in the same transaction: every still-SCHEDULED SelectionSlot on THIS
          event becomes FORFEITED (driving scheduled_slot_count to 0) and every
          outstanding RelocationRequest naming this event is DENIED with a
          recorded decision_note. Crucially the fan-out is event-scoped: the
          sibling event EV1 that the donor already picked through stays OPEN and
          its CONSUMED slot is untouched. The two events' windows are adjacent
          (EV1 ends exactly when EV2 begins), which the half-open overlap rule
          permits, so both can be OPEN simultaneously.
        test_recipe:
          setup:
            - "Sections SEC-K (OPEN, capacity 2, per_seat_requirement_cents 100000, required_points_per_seat 0, seats K/1 and K/2) and SEC-L (OPEN, capacity 1, per_seat_requirement_cents 200000, required_points_per_seat 0, seat L/1)."
