      - name: required_assurance_pinned_step_order
        claim_type: constraint_propagation
        grounds:
          - calculations.required_financial_assurance
          - calculations.plume_and_aor_radii
        distinguishing_aspect: |
          The pinned six-step evaluation order, where every step consumes the stored output of the
          previous one instead of re-deriving it, is the whole subject of the §1.8 combinatorial-formula
          instance.
        excluded_because:
          difficulty_instance: "combinatorial_formula / required_assurance_pinned_evaluation_order"
          rationale: "That §1.8 instance walks the six pinned steps and asserts the intermediate stored values."

      - name: claim_basis_diverges_between_reported_and_verified
        claim_type: variant_divergence
        grounds:
          - calculations.tax_credit_amount
          - entities.TaxCreditClaim.fields.claim_variant
        distinguishing_aspect: |
          The two claim bases producing different credit amounts from identical ledger rows is exactly
          the divergence asserted by the §1.8 dual-variant instance.
        excluded_because:
          difficulty_instance: "dual_variant_calc / tax_credit_reported_vs_verified_basis_divergence"
          rationale: "That §1.8 instance asserts reported_tonnes, verified_tonnes and both credit amounts on the same records."

      - name: seal_classification_uses_only_the_selected_variant_index
        claim_type: variant_selection
        grounds:
          - calculations.seal_integrity_index
          - entities.GeologicModel.fields.assessment_variant
        distinguishing_aspect: |
          Choosing which of the two stored indices governs the classification, based on the model's own
          assessment_variant, is the selection step asserted by the §1.8 dual-variant instance.
        excluded_because:
          difficulty_instance: "dual_variant_calc / seal_integrity_index_variant_flips_pass_to_fail"
          rationale: "That §1.8 instance stores both indices on two models and asserts that only the variant-named one drives seal_classification."

      - name: allocated_assurance_reconciles_with_allocated_instrument_buckets
        claim_type: reconciliation
        grounds:
          - calculations.assurance_waterfall_allocation
          - entities.StorageProject.fields.allocated_assurance_usd
          - entities.FinancialInstrument.fields.status
        distinguishing_aspect: |
          The project-level derived total reconciles with the per-instrument buckets over ALLOCATED rows
          only: while the second instrument is still POSTED the project shows 11000000.00, and once it is
          allocated the project shows 16000000.00 = 11000000.00 + 5000000.00 and flips from UNDERFUNDED
          to FUNDED, with the POSTED row's own buckets still zero in between.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "project 'Alpha Storage Hub' in status PERMITTING with required_financial_assurance_usd 12500000.00"
            - "instrument A of face 11000000 already ALLOCATED and instrument B of face 5000000 still POSTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ccs/storage-projects"
              payload: { name: "Alpha Storage Hub", operator_name: "Alpha CCS LLC", basin_code: "ILB-01", total_project_acreage: 4000, requested_annual_injection_rate_tpy: 1000000, annual_monitoring_cost_usd: 200000, required_consent_pct: 60, ca_rig_slots: 2 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id, proj_v0: $.data.version }
            - call: "POST /ccs/geologic-models"
              payload: { project_id: "${proj_id}", expected_project_version: "${proj_v0}", model_label: "M1-DET", injection_zone_top_depth_m: 1800, injection_zone_thickness_m: 50, seal_thickness_m: 60, capillary_entry_pressure_psi: 900, p10_seal_thickness_m: 30, p10_capillary_entry_pressure_psi: 700, reservoir_pressure_psi: 3000, fracture_pressure_psi: 4500, permeability_md: 200, porosity_fraction: 0.20, assessment_variant: "DETERMINISTIC" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { model_id: $.data.id }
            - call: "POST /ccs/geologic-models/${model_id}/run-plume-simulation"
              payload: { injection_years: 20 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/geologic-models/${model_id}/submit"
              payload: { submission_note: "initial site characterization" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/geologic-models/${model_id}/review"
              payload: { decision: "ACCEPT", review_note: "seal integrity acceptable" }
              as: RegulatoryReviewer
              as_user_id: "reviewer-1"
            - call: "POST /ccs/financial-instruments"
              payload: { project_id: "${proj_id}", instrument_type: "SURETY_BOND", face_amount_usd: 11000000 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { inst_a: $.data.id, inst_a_v0: $.data.version }
            - call: "POST /ccs/financial-instruments/${inst_a}/allocate"
              payload: { expected_instrument_version: "${inst_a_v0}" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/financial-instruments"
              payload: { project_id: "${proj_id}", instrument_type: "LETTER_OF_CREDIT", face_amount_usd: 5000000 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { inst_b: $.data.id, inst_b_v0: $.data.version }
            - call: "GET /ccs/storage-projects/${proj_id}"
              payload: {}
              as: ProgramAdmin
              captures: { allocated_before: $.data.allocated_assurance_usd, coverage_before: $.data.assurance_coverage_status }
          trigger:
            - call: "POST /ccs/financial-instruments/${inst_b}/allocate"
              payload: { expected_instrument_version: "${inst_b_v0}" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { b_pisc: $.data.allocated_pisc_usd, b_emerg: $.data.allocated_emergency_usd, b_unalloc: $.data.unallocated_usd }
          assert:
            - "${allocated_before} == 11000000.00"
            - "${coverage_before} == UNDERFUNDED"
            - "the trigger call returns HTTP 200"
            - "${b_pisc} == 5000000.00"
            - "${b_emerg} == 0.00"
            - "${b_unalloc} == 0.00"
            - "FinancialInstrument.${inst_b}.status == ALLOCATED"
            - "FinancialInstrument.${inst_a}.allocated_pisc_usd == 10000000.00"
            - "FinancialInstrument.${inst_a}.allocated_emergency_usd == 1000000.00"
            - "StorageProject.${proj_id}.allocated_assurance_usd == 16000000.00"
            - "StorageProject.${proj_id}.assurance_coverage_status == FUNDED"

