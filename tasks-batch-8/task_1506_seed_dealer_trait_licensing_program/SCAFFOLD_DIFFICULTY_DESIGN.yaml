  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (2 instances, different category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: confirm_cancelled_order_on_credit_hold_state_beats_fiscal
        grounds:
          - validations[priority=7]
          - validations[priority=12]
          - state_machines.SeedOrder.CONFIRMED_to_CANCELLED
          - state_machines.GrowerAccount.ACTIVE_to_CREDIT_HOLD
        distinguishing_aspect: |
          Category pair state(7) vs business_fiscal(12): the request violates both
          (order already CANCELLED AND grower on CREDIT_HOLD); the state error
          ERR_INVALID_STATE_TRANSITION must win over ERR_GROWER_NOT_ACTIVE.
        test_recipe:
          setup:
            - "Program OPEN; grower G; order with 10 units of SOY-V2 was CONFIRMED then CANCELLED"
            - "Grower G then placed on CREDIT_HOLD"
          setup_api_calls:
            - call: "POST /dealer/programs"
              payload: { name: "2027 Seed Program", crop_year: 2027, early_order_tiers: [{cutoff_at: "2027-01-15T23:59:59Z", discount_bps: 600}], prepay_tiers: [{pay_by: "2026-12-20T23:59:59Z", discount_bps: 800}], return_window_end: "2027-06-30T23:59:59Z", return_restocking_bps: 1000, returns_untreated_only: true, replant_claim_window_days: 21, replant_replacement_discount_bps: 10000, daily_delivery_capacity_units: 100000, delivery_window_start: "2027-03-01T00:00:00Z", delivery_window_end: "2027-05-31T23:59:59Z", sales_close_at: "2027-03-15T23:59:59Z", commission_base_bps: 500, min_plot_replications: 2 }
              as: DealerAdmin
              captures: { prog: $.data.id }
            - call: "POST /dealer/programs/${prog}/open"
              as: DealerAdmin
            - call: "POST /dealer/growers"
              payload: { account_name: "Smith Farms", external_ref: "EXT-001", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { g: $.data.id }
            - call: "POST /dealer/varieties"
              payload: { sku: "SOY-V2", crop: "SOYBEAN", relative_maturity_days: 118, base_price_cents_per_unit: 18000, seeds_per_unit: 140000, preferred_soils: ["CLAY", "LOAM"], min_drainage: "POOR" }
              as: DealerAdmin
              captures: { v2: $.data.id }
            - call: "POST /dealer/inventory-lots"
              payload: { variety_id: "${v2}", warehouse_code: "WH1", received_units: 500, expiry_date: "2027-12-31T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-10T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/orders"
              payload: { grower_id: "${g}", program_id: "${prog}" }
              as: SalesRep
              captures: { o: $.data.id }
            - call: "POST /dealer/orders/${o}/lines"
              payload: { variety_id: "${v2}", units: 10 }
              as: SalesRep
            - call: "POST /dealer/orders/${o}/confirm"
              as: SalesRep
            - call: "POST /dealer/orders/${o}/cancel"
              as: SalesRep
            - call: "POST /dealer/growers/${g}/hold"
              as: DealerAdmin
          trigger:
            - call: "POST /dealer/orders/${o}/confirm"
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (state priority 7 beats business_fiscal priority 12)"
            - "order remains CANCELLED and grower remains CREDIT_HOLD (no side effects fired)"

      - name: return_line_mismatch_referential_beats_temporal_window
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - state_machines.SeedReturn
        distinguishing_aspect: |
          Category pair business_referential(6) vs business_temporal(10): the return
          references a line belonging to a DIFFERENT order AND the return window has
          closed; the referential error ERR_ORDER_LINE_MISMATCH must win over
          ERR_RETURN_WINDOW_CLOSED. Distinct category pair from the sibling instance.
        test_recipe:
          setup:
            - "Program (return_window_end 2027-06-30T23:59:59Z) OPEN; grower G"
            - "Order A: line lnA of 10 units SOY-V2, confirmed and fully delivered"
            - "Order B: line lnB of 10 units SOY-V2, confirmed (never delivered)"
            - "Logical clock 2027-07-01 (past the return window)"
          setup_api_calls:
            - call: "POST /dealer/programs"
              payload: { name: "2027 Seed Program", crop_year: 2027, early_order_tiers: [{cutoff_at: "2027-01-15T23:59:59Z", discount_bps: 600}], prepay_tiers: [{pay_by: "2026-12-20T23:59:59Z", discount_bps: 800}], return_window_end: "2027-06-30T23:59:59Z", return_restocking_bps: 1000, returns_untreated_only: true, replant_claim_window_days: 21, replant_replacement_discount_bps: 10000, daily_delivery_capacity_units: 100000, delivery_window_start: "2027-03-01T00:00:00Z", delivery_window_end: "2027-05-31T23:59:59Z", sales_close_at: "2027-03-15T23:59:59Z", commission_base_bps: 500, min_plot_replications: 2 }
              as: DealerAdmin
              captures: { prog: $.data.id }
            - call: "POST /dealer/programs/${prog}/open"
              as: DealerAdmin
            - call: "POST /dealer/growers"
              payload: { account_name: "Smith Farms", external_ref: "EXT-001", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { g: $.data.id }
            - call: "POST /dealer/varieties"
              payload: { sku: "SOY-V2", crop: "SOYBEAN", relative_maturity_days: 118, base_price_cents_per_unit: 18000, seeds_per_unit: 140000, preferred_soils: ["CLAY", "LOAM"], min_drainage: "POOR" }
              as: DealerAdmin
              captures: { v2: $.data.id }
            - call: "POST /dealer/inventory-lots"
              payload: { variety_id: "${v2}", warehouse_code: "WH1", received_units: 2000, expiry_date: "2027-12-31T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-10T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/orders"
              payload: { grower_id: "${g}", program_id: "${prog}" }
              as: SalesRep
              captures: { o_a: $.data.id }
            - call: "POST /dealer/orders/${o_a}/lines"
              payload: { variety_id: "${v2}", units: 10 }
              as: SalesRep
              captures: { ln_a: $.data.id }
            - call: "POST /dealer/orders/${o_a}/confirm"
              as: SalesRep
            - call: "POST /dealer/orders"
              payload: { grower_id: "${g}", program_id: "${prog}" }
              as: SalesRep
              captures: { o_b: $.data.id }
            - call: "POST /dealer/orders/${o_b}/lines"
              payload: { variety_id: "${v2}", units: 10 }
              as: SalesRep
              captures: { ln_b: $.data.id }
            - call: "POST /dealer/orders/${o_b}/confirm"
              as: SalesRep
            - call: "POST /dealer/delivery-tickets"
              payload: { order_id: "${o_a}", order_line_id: "${ln_a}", type: "DELIVERY", scheduled_date: "2027-04-10T00:00:00Z", units: 10 }
              as: SalesRep
              captures: { t_a: $.data.id }
            - call: "POST /dealer/_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-10T12:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/delivery-tickets/${t_a}/complete"
              as: SalesRep
            - call: "POST /dealer/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-01T00:00:00Z" }
              as: DealerAdmin
          trigger:
            - call: "POST /dealer/returns"
              payload: { order_id: "${o_b}", order_line_id: "${ln_a}", units: 1, reason: "OVERSTOCK" }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ORDER_LINE_MISMATCH (referential priority 6 beats temporal priority 10, even though the window is also closed)"
            - "no SeedReturn row created for line ln_a"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (2 instances, different metrics/endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: early_order_cutoff_inclusive_exact_instant
        grounds:
          - calculations.early_order_discount_bps
          - entities.SeedOrder.fields.locked_discount_bps
        distinguishing_aspect: |
          Metric: datetime threshold on POST /dealer/orders/{id}/confirm. Confirming at
          exactly the cutoff instant 2026-09-30T23:59:59Z earns 1000bps (inclusive <=);
          one second later (2026-10-01T00:00:00Z) earns 0. Distinct metric and endpoint
          from the commission-units boundary instance.
        test_recipe:
          setup:
            - "Program with a single early tier {cutoff 2026-09-30T23:59:59Z -> 1000bps}, OPEN; grower G; SOY-V2 @18000; lot stocked"
            - "Two identical DRAFT orders of 30 units each (>= 20-unit discount gate)"
          setup_api_calls:
            - call: "POST /dealer/programs"
              payload: { name: "2027 Seed Program", crop_year: 2027, early_order_tiers: [{cutoff_at: "2026-09-30T23:59:59Z", discount_bps: 1000}], prepay_tiers: [{pay_by: "2026-12-20T23:59:59Z", discount_bps: 800}], return_window_end: "2027-06-30T23:59:59Z", return_restocking_bps: 1000, returns_untreated_only: true, replant_claim_window_days: 21, replant_replacement_discount_bps: 10000, daily_delivery_capacity_units: 100000, delivery_window_start: "2027-03-01T00:00:00Z", delivery_window_end: "2027-05-31T23:59:59Z", sales_close_at: "2027-03-15T23:59:59Z", commission_base_bps: 500, min_plot_replications: 2 }
              as: DealerAdmin
              captures: { prog: $.data.id }
            - call: "POST /dealer/programs/${prog}/open"
              as: DealerAdmin
            - call: "POST /dealer/growers"
              payload: { account_name: "Smith Farms", external_ref: "EXT-001", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { g: $.data.id }
            - call: "POST /dealer/varieties"
              payload: { sku: "SOY-V2", crop: "SOYBEAN", relative_maturity_days: 118, base_price_cents_per_unit: 18000, seeds_per_unit: 140000, preferred_soils: ["CLAY", "LOAM"], min_drainage: "POOR" }
              as: DealerAdmin
              captures: { v2: $.data.id }
            - call: "POST /dealer/inventory-lots"
              payload: { variety_id: "${v2}", warehouse_code: "WH1", received_units: 10000, expiry_date: "2027-12-31T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/orders"
              payload: { grower_id: "${g}", program_id: "${prog}" }
              as: SalesRep
              captures: { o1: $.data.id }
            - call: "POST /dealer/orders/${o1}/lines"
              payload: { variety_id: "${v2}", units: 30 }
              as: SalesRep
            - call: "POST /dealer/orders"
              payload: { grower_id: "${g}", program_id: "${prog}" }
              as: SalesRep
              captures: { o2: $.data.id }
            - call: "POST /dealer/orders/${o2}/lines"
              payload: { variety_id: "${v2}", units: 30 }
              as: SalesRep
          trigger:
            - call: "POST /dealer/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T23:59:59Z" }
              as: DealerAdmin
            - call: "POST /dealer/orders/${o1}/confirm"
              as: SalesRep
              captures: { d1: $.data.locked_discount_bps, n1: $.data.net_amount_cents }
            - call: "POST /dealer/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/orders/${o2}/confirm"
              as: SalesRep
              captures: { d2: $.data.locked_discount_bps, n2: $.data.net_amount_cents }
          assert:
            - "o1.locked_discount_bps == 1000 (confirmed exactly AT the cutoff: inclusive)"
            - "o1.net_amount_cents == 486000 (30 x round_half_up(18000 x 0.90) = 30 x 16200)"
            - "o2.locked_discount_bps == 0 (one second past the cutoff)"
            - "o2.net_amount_cents == 540000"

      - name: commission_volume_tier_exactly_at_min_units
        grounds:
          - calculations.commission_accrual
          - entities.CommissionStatement.fields.volume_bonus_bps
        distinguishing_aspect: |
          Metric: integer net-units threshold on POST /dealer/commission-statements/{id}/recompute.
          volume_units exactly == min_net_units (1000) earns the bonus (inclusive >=);
          999 earns nothing. Distinct metric (integer count) and endpoint from the
          datetime-cutoff instance.
        test_recipe:
          setup:
            - "Program (commission_base_bps 500, commission_volume_tiers [{1000 -> 100bps}], no volume rebate, capacity 100000) OPEN"
            - "Order A: 600 units SOY-V2 confirmed (net 10800000); order B: 400 units confirmed (net 7200000)"
            - "Clock 2027-02-01 (past all early-order cutoffs -> 0bps on both)"
          setup_api_calls:
            - call: "POST /dealer/programs"
              payload: { name: "2027 Seed Program", crop_year: 2027, early_order_tiers: [{cutoff_at: "2027-01-15T23:59:59Z", discount_bps: 600}], prepay_tiers: [{pay_by: "2026-12-20T23:59:59Z", discount_bps: 800}], return_window_end: "2027-06-30T23:59:59Z", return_restocking_bps: 1000, returns_untreated_only: true, replant_claim_window_days: 21, replant_replacement_discount_bps: 10000, daily_delivery_capacity_units: 100000, delivery_window_start: "2027-03-01T00:00:00Z", delivery_window_end: "2027-05-31T23:59:59Z", sales_close_at: "2027-03-15T23:59:59Z", commission_base_bps: 500, commission_volume_tiers: [{min_net_units: 1000, bonus_bps: 100}], min_plot_replications: 2 }
              as: DealerAdmin
              captures: { prog: $.data.id }
            - call: "POST /dealer/programs/${prog}/open"
              as: DealerAdmin
            - call: "POST /dealer/growers"
              payload: { account_name: "Smith Farms", external_ref: "EXT-001", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { g: $.data.id }
            - call: "POST /dealer/varieties"
              payload: { sku: "SOY-V2", crop: "SOYBEAN", relative_maturity_days: 118, base_price_cents_per_unit: 18000, seeds_per_unit: 140000, preferred_soils: ["CLAY", "LOAM"], min_drainage: "POOR" }
              as: DealerAdmin
              captures: { v2: $.data.id }
            - call: "POST /dealer/inventory-lots"
              payload: { variety_id: "${v2}", warehouse_code: "WH1", received_units: 50000, expiry_date: "2027-12-31T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/orders"
              payload: { grower_id: "${g}", program_id: "${prog}" }
              as: SalesRep
              captures: { o_a: $.data.id }
            - call: "POST /dealer/orders/${o_a}/lines"
              payload: { variety_id: "${v2}", units: 600 }
              as: SalesRep
            - call: "POST /dealer/orders/${o_a}/confirm"
              as: SalesRep
            - call: "POST /dealer/orders"
              payload: { grower_id: "${g}", program_id: "${prog}" }
              as: SalesRep
              captures: { o_b: $.data.id }
            - call: "POST /dealer/orders/${o_b}/lines"
              payload: { variety_id: "${v2}", units: 400 }
              as: SalesRep
            - call: "POST /dealer/orders/${o_b}/confirm"
              as: SalesRep
            - call: "GET /dealer/commission-statements"
              payload: { program_id: "${prog}" }
              as: DealerAdmin
              captures: { stmt: "$.data[0].id" }
          trigger:
            - call: "POST /dealer/commission-statements/${stmt}/recompute"
              as: DealerAdmin
              captures: { tot1: $.data.total_commission_cents, bps1: $.data.volume_bonus_bps, units1: $.data.volume_units }
            - call: "POST /dealer/orders/${o_b}/cancel"
              as: SalesRep
            - call: "POST /dealer/orders"
              payload: { grower_id: "${g}", program_id: "${prog}" }
              as: SalesRep
              captures: { o_b2: $.data.id }
            - call: "POST /dealer/orders/${o_b2}/lines"
              payload: { variety_id: "${v2}", units: 399 }
              as: SalesRep
            - call: "POST /dealer/orders/${o_b2}/confirm"
              as: SalesRep
            - call: "POST /dealer/commission-statements/${stmt}/recompute"
              as: DealerAdmin
              captures: { tot2: $.data.total_commission_cents, bps2: $.data.volume_bonus_bps, units2: $.data.volume_units }
          assert:
            - "at exactly 1000 net units: volume_bonus_bps == 100 (inclusive >=)"
            - "total_commission_cents == 1080000 (base 900000 + bonus 180000 on net_sales 18000000)"
            - "at 999 net units: volume_bonus_bps == 0"
            - "total_commission_cents == 899100 (base only on net_sales 17982000)"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (2 instances, different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: line_add_gated_by_trait_agreement_state
        grounds:
          - validations[priority=9]
          - state_machines.TraitAgreement
          - entities.OrderLine.fields.variety_id
        distinguishing_aspect: |
          Entity pair OrderLine x TraitAgreement: adding a line of a traited variety is
          rejected while the grower's agreement is PENDING_SIGNATURE
          (ERR_TRAIT_AGREEMENT_NOT_ACTIVE) and accepted once the agreement flips to
          ACTIVE — the line's legality is a pure function of another entity's state.
        test_recipe:
          setup:
            - "Program OPEN; grower G; trait package VT2P; traited variety CORN-V1; lot stocked"
            - "Agreement for (G, VT2P) exists but is only PENDING_SIGNATURE (never signed); default clock 2026-08-01T00:00:00Z is inside its window"
            - "DRAFT order O exists for G"
          setup_api_calls:
            - call: "POST /dealer/programs"
              payload: { name: "2027 Seed Program", crop_year: 2027, early_order_tiers: [{cutoff_at: "2027-01-15T23:59:59Z", discount_bps: 600}], prepay_tiers: [{pay_by: "2026-12-20T23:59:59Z", discount_bps: 800}], return_window_end: "2027-06-30T23:59:59Z", return_restocking_bps: 1000, returns_untreated_only: true, replant_claim_window_days: 21, replant_replacement_discount_bps: 10000, daily_delivery_capacity_units: 100000, delivery_window_start: "2027-03-01T00:00:00Z", delivery_window_end: "2027-05-31T23:59:59Z", sales_close_at: "2027-03-15T23:59:59Z", commission_base_bps: 500, min_plot_replications: 2 }
              as: DealerAdmin
              captures: { prog: $.data.id }
            - call: "POST /dealer/programs/${prog}/open"
              as: DealerAdmin
            - call: "POST /dealer/growers"
              payload: { account_name: "Smith Farms", external_ref: "EXT-001", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { g: $.data.id, gver: $.data.version }
            - call: "POST /dealer/trait-packages"
              payload: { code: "VT2P", description: "VT Double PRO", requires_stewardship_agreement: true, refuge_required_bps: 500 }
              as: DealerAdmin
              captures: { tp: $.data.id }
            - call: "POST /dealer/varieties"
              payload: { sku: "CORN-V1", crop: "CORN", relative_maturity_days: 112, trait_package_id: "${tp}", base_price_cents_per_unit: 25000, seeds_per_unit: 80000, preferred_soils: ["LOAM", "SILT"], min_drainage: "MODERATE" }
              as: DealerAdmin
              captures: { v1: $.data.id }
            - call: "POST /dealer/inventory-lots"
              payload: { variety_id: "${v1}", warehouse_code: "WH1", received_units: 500, expiry_date: "2027-12-31T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/trait-agreements"
              payload: { grower_id: "${g}", trait_package_id: "${tp}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-12-31T23:59:59Z", expected_grower_version: "${gver}" }
              as: DealerAdmin
              captures: { a: $.data.id }
            - call: "POST /dealer/orders"
              payload: { grower_id: "${g}", program_id: "${prog}" }
              as: SalesRep
              captures: { o: $.data.id }
          trigger:
            - call: "POST /dealer/orders/${o}/lines"
              payload: { variety_id: "${v1}", units: 10 }
              as: SalesRep
              captures: { err1: $.data.error_id }
            - call: "POST /dealer/trait-agreements/${a}/sign"
              as: DealerAdmin
            - call: "POST /dealer/orders/${o}/lines"
              payload: { variety_id: "${v1}", units: 10 }
              as: SalesRep
              captures: { ln_id: $.data.id, ln_units: $.data.units }
          assert:
            - "first attempt: error_id == ERR_TRAIT_AGREEMENT_NOT_ACTIVE (agreement PENDING_SIGNATURE)"
            - "after sign flips the agreement to ACTIVE: line created with units == 10"
            - "order now has the line (GET /dealer/order-lines?order_id returns it)"

      - name: order_confirm_gated_by_grower_account_state
        grounds:
          - validations[priority=12]
          - state_machines.GrowerAccount.ACTIVE_to_CREDIT_HOLD
          - state_machines.SeedOrder.DRAFT_to_CONFIRMED
        distinguishing_aspect: |
          Entity pair SeedOrder x GrowerAccount (distinct pair from the sibling's
          OrderLine x TraitAgreement): confirm is rejected while the grower is
          CREDIT_HOLD (ERR_GROWER_NOT_ACTIVE) and succeeds after release_hold returns
          the grower to ACTIVE.
        test_recipe:
          setup:
            - "Program OPEN; grower G; SOY-V2 @18000; lot stocked; DRAFT order with one 10-unit line"
            - "Grower placed on CREDIT_HOLD"
          setup_api_calls:
            - call: "POST /dealer/programs"
              payload: { name: "2027 Seed Program", crop_year: 2027, early_order_tiers: [{cutoff_at: "2027-01-15T23:59:59Z", discount_bps: 600}], prepay_tiers: [{pay_by: "2026-12-20T23:59:59Z", discount_bps: 800}], return_window_end: "2027-06-30T23:59:59Z", return_restocking_bps: 1000, returns_untreated_only: true, replant_claim_window_days: 21, replant_replacement_discount_bps: 10000, daily_delivery_capacity_units: 100000, delivery_window_start: "2027-03-01T00:00:00Z", delivery_window_end: "2027-05-31T23:59:59Z", sales_close_at: "2027-03-15T23:59:59Z", commission_base_bps: 500, min_plot_replications: 2 }
              as: DealerAdmin
              captures: { prog: $.data.id }
            - call: "POST /dealer/programs/${prog}/open"
              as: DealerAdmin
            - call: "POST /dealer/growers"
              payload: { account_name: "Smith Farms", external_ref: "EXT-001", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { g: $.data.id }
            - call: "POST /dealer/varieties"
              payload: { sku: "SOY-V2", crop: "SOYBEAN", relative_maturity_days: 118, base_price_cents_per_unit: 18000, seeds_per_unit: 140000, preferred_soils: ["CLAY", "LOAM"], min_drainage: "POOR" }
              as: DealerAdmin
              captures: { v2: $.data.id }
            - call: "POST /dealer/inventory-lots"
              payload: { variety_id: "${v2}", warehouse_code: "WH1", received_units: 500, expiry_date: "2027-12-31T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/_clock/set_current_utc"
