              payload: { expected_authorization_version: "${auth_v}", authorized_direct_units: 100, authorized_supervision_units: 20, authorized_parent_training_units: 8, period_start: "2027-01-01", period_end: "2027-12-31" }
              as: BillingSpecialist
          trigger:
