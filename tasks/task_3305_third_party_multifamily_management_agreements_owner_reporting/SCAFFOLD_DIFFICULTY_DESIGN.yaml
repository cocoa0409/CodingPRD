  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: incentive_threshold_strictly_greater_boundary
        grounds:
          - calculations.incentive_fee
          - entities.ManagementAgreement.fields.incentive_threshold_egi_cents
        distinguishing_aspect: |
          Metric: EGI threshold on the statement-close endpoint. EGI exactly
          equal to incentive_threshold_egi_cents yields incentive_fee_cents
          == 0 (strictly-greater semantics); EGI one cent above the threshold
          yields incentive_fee_cents == round(0.10 * 1) == 0 after
          round_half_up to whole cents, so the decisive probe is EGI
          threshold + 10 cents -> incentive == 1 cent.
        test_recipe:
          setup:
            - "Owner O11; Agreement AG11 ACTIVE with base_fee_pct=0.04, minimum 250000, incentive_threshold_egi_cents=12000000, incentive_tier1_rate=0.10; Property P11 MANAGED (zero-balance onboarding, one resident)"
