  # ===========================================================================
  # Section: errors (triggerability — stubs where §1.8 already asserts the error)
  # ===========================================================================
  - section: errors
    instances:
      - name: error_lot_not_verified_covered
        claim_type: error_triggerable
        grounds: ["errors[ERR_LOT_NOT_VERIFIED]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / lot_check_precedes_constrained_check
          rationale: "Asserted there as the winning error (422) on POST /v1/deliveries with a PENDING_INSPECTION lot."

      - name: error_window_overlap_covered
        claim_type: error_triggerable
        grounds: ["errors[ERR_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / delivery_windows_half_open_touching
          rationale: "Asserted there as the 409 result of a strictly overlapping window (also exercised as the priority-8 winner in overlap_check_precedes_volume_check)."

      - name: error_capacity_unavailable_covered
        claim_type: error_triggerable
        grounds: ["errors[ERR_CAPACITY_UNAVAILABLE]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / line_capacity_aggregate_booking
          rationale: "Asserted there as the 422 result of activating a 50.0 MW reservation with only 10.0 MW available."

      - name: error_deposit_insufficient_covered
        claim_type: error_triggerable
        grounds: ["errors[ERR_DEPOSIT_INSUFFICIENT]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / deposit_exact_minimum_boundary
          rationale: "Asserted there as the 422 result of deposit 299999.99 vs required 300000.00."

      - name: error_warranty_cap_exceeded_covered
        claim_type: error_triggerable
        grounds: ["errors[ERR_WARRANTY_CAP_EXCEEDED]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / warranty_cap_exact_boundary
          rationale: "Asserted there as the 422 result of approving 0.5 MW on top of a 10.0 MW approved claim against a 10.0 MW cap."

      - name: error_reservation_constrained_covered
        claim_type: error_triggerable
        grounds: ["errors[ERR_RESERVATION_CONSTRAINED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / confirm_requires_active_reservation
          rationale: "Asserted there as the 409 result of confirming a delivery whose reservation is CONSTRAINED (also exercised in line_suspend_constrains_reservation_blocks_delivery)."

