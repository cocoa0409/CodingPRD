          One request violates the priority-7 segregation-of-duties rule AND the priority-72 tier-cap
          rule at once; the ladder must answer 403 ERR_SOD_GRANT_REVIEWER_CONFLICT and never run the
          waterfall, and the identical request re-sent by a different reviewer must then answer 409
