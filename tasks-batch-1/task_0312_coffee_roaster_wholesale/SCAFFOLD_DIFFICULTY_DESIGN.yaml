  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: green_reservation_aggregate_capacity_overlap
        grounds:
          - calculations.green_reorder_status
          - state_machines.RoastBatch.PLANNED_to_ROASTING
          - validations[priority=10]
          - entities.GreenLot.fields.available_kg
        distinguishing_aspect: |
          Aggregate-capacity overlap on the GreenLot resource: two planned batches each reserve green from
          the same finite lot; the second start that would charge more physical green than on_hand_kg is
          rejected (ERR_INSUFFICIENT_GREEN). Interval semantics here are aggregate-capacity (sum of charges
          vs on_hand), distinct from the discrete-window roasted-lot overlap below.
        test_recipe:
          setup:
            - "GreenLot received 30 kg. Batch A planned 20 (reserved 20). Batch B planned 20 (reserved 40 total > 30). Start A consuming 20 (on_hand 30->... reserved 20 left)."
          setup_api_calls:
            - call: "POST /roast-profiles"
              payload: { name: "OV", roast_level: "MEDIUM", expected_shrink_bps: 1500, charge_temp_c: 200 }
              as: RoasterStaff
              captures: { rp_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-OV", name: "OV", roast_profile_id: "${rp_id}", base_price_cents_per_kg: 1900, freshness_window_days: 14 }
              as: RoasterStaff
              captures: { prod_id: $.data.id }
            - call: "POST /green-lots"
              payload: { origin: "Tanzania", lot_ref: "TAN-001", received_kg: 30, par_level_kg: 5 }
              as: RoasterStaff
              captures: { gl_id: $.data.id, gl_v0: $.data.version }
            - call: "POST /roast-batches"
              payload: { green_lot_id: "${gl_id}", product_id: "${prod_id}", planned_green_kg: 20, expected_green_lot_version: "${gl_v0}" }
              as: RoasterStaff
              captures: { rb_a: $.data.id }
            - call: "GET /green-lots/${gl_id}"
              payload: {}
              as: RoasterStaff
              captures: { gl_v1: $.data.version }
            - call: "POST /roast-batches"
              payload: { green_lot_id: "${gl_id}", product_id: "${prod_id}", planned_green_kg: 20, expected_green_lot_version: "${gl_v1}" }
              as: RoasterStaff
              captures: { rb_b: $.data.id }
            - call: "POST /roast-batches/${rb_a}/start"
              payload: { actual_green_kg: 20 }
              as: RoasterStaff
          trigger:
            - call: "POST /roast-batches/${rb_b}/start"
              payload: { actual_green_kg: 20 }
              as: RoasterStaff
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INSUFFICIENT_GREEN (only 10 kg physically remain on the lot after A consumed 20)"

      - name: roasted_lot_allocation_overlap_against_available
        grounds:
          - calculations.roasted_lot_availability
          - state_machines.Fulfillment.RESERVED
          - validations[priority=11]
          - entities.RoastedLot.fields.available_kg
        distinguishing_aspect: |
          Per-allocation overlap on a different resource (RoastedLot): two reservations against the same lot
          compete for available_kg; the second reservation whose allocated_kg exceeds the remaining available
          after the first is rejected (ERR_INSUFFICIENT_ROASTED). Interval semantics are remaining-available
          subtraction, geometrically distinct from the green aggregate-on_hand check.
        test_recipe:
          setup:
            - "RoastedLot of 10 kg available. First reservation takes 7 kg (available 3). Two separate orders each line the product; second reservation requests 5 kg (> 3 remaining)."
          setup_api_calls:
            - call: "POST /price-tiers"
              payload: { code: "RL0", discount_bps: 0, min_monthly_kg: 0, freshness_max_days: 60 }
              as: SalesRep
              captures: { tier_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Lot Sharers", price_tier_id: "${tier_id}", net_terms_days: 30, credit_limit_cents: 1000000 }
              as: SalesRep
              captures: { acct_id: $.data.id }
            - call: "POST /roast-profiles"
              payload: { name: "RL", roast_level: "MEDIUM", expected_shrink_bps: 1500, charge_temp_c: 205 }
              as: RoasterStaff
              captures: { rp_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-RL", name: "RL Prod", roast_profile_id: "${rp_id}", base_price_cents_per_kg: 2000, freshness_window_days: 60 }
              as: RoasterStaff
              captures: { prod_id: $.data.id }
            - call: "POST /green-lots"
              payload: { origin: "Costa Rica", lot_ref: "CRI-001", received_kg: 50, par_level_kg: 5 }
              as: RoasterStaff
              captures: { gl_id: $.data.id, gl_v: $.data.version }
            - call: "POST /roast-batches"
              payload: { green_lot_id: "${gl_id}", product_id: "${prod_id}", planned_green_kg: 14, expected_green_lot_version: "${gl_v}" }
              as: RoasterStaff
              captures: { rb_id: $.data.id }
            - call: "POST /roast-batches/${rb_id}/start"
              payload: { actual_green_kg: 14 }
              as: RoasterStaff
            - call: "POST /roast-batches/${rb_id}/drop"
              payload: {}
              as: RoasterStaff
            - call: "POST /roast-batches/${rb_id}/complete"
              payload: { actual_roasted_kg: 10 }
              as: RoasterStaff
            - call: "GET /roast-batches/${rb_id}/roasted-lots"
              payload: {}
              as: RoasterStaff
              captures: { rl_id: "$.data[0].id", rl_v0: "$.data[0].version"}
            - call: "POST /accounts/${acct_id}/orders"
              payload: { lines: [ { product_id: "${prod_id}", qty_kg: 7 } ] }
              as: SalesRep
              captures: { ord_a: $.data.id }
            - call: "POST /orders/${ord_a}/fulfillments"
              payload: { product_id: "${prod_id}", roasted_lot_id: "${rl_id}", allocated_kg: 7, expected_roasted_lot_version: "${rl_v0}" }
              as: SalesRep
              captures: { ful_a: $.data.id }
            - call: "GET /roasted-lots/${rl_id}"
              payload: {}
              as: SalesRep
              captures: { rl_v1: $.data.version }
            - call: "POST /accounts/${acct_id}/orders"
              payload: { lines: [ { product_id: "${prod_id}", qty_kg: 5 } ] }
              as: SalesRep
              captures: { ord_b: $.data.id }
          trigger:
            - call: "POST /orders/${ord_b}/fulfillments"
              payload: { product_id: "${prod_id}", roasted_lot_id: "${rl_id}", allocated_kg: 5, expected_roasted_lot_version: "${rl_v1}" }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INSUFFICIENT_ROASTED (only 3.000 kg remain after the first 7 kg reservation)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancel_batch_conserves_green_kg
        grounds:
          - state_machines.RoastBatch.PLANNED_to_CANCELLED
          - calculations.green_reorder_status
          - entities.GreenLot.fields.available_kg
        distinguishing_aspect: |
          Conserved quantity = GreenLot available_kg. Plan a batch (reserve 20) then cancel it; the
          compensating cancel MUST restore available_kg to exactly the pre-plan value: available_kg ==
          received_kg with no drift. Invariant: received_kg - reserved_kg - consumed == available_kg.
        test_recipe:
          setup:
            - "GreenLot received 40 kg (available 40). Plan a batch reserving 20 (available 20). Cancel it."
          setup_api_calls:
            - call: "POST /roast-profiles"
              payload: { name: "CMP", roast_level: "MEDIUM", expected_shrink_bps: 1500, charge_temp_c: 200 }
              as: RoasterStaff
              captures: { rp_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-CMP", name: "CMP", roast_profile_id: "${rp_id}", base_price_cents_per_kg: 1900, freshness_window_days: 14 }
              as: RoasterStaff
              captures: { prod_id: $.data.id }
            - call: "POST /green-lots"
              payload: { origin: "Burundi", lot_ref: "BDI-001", received_kg: 40, par_level_kg: 5 }
              as: RoasterStaff
              captures: { gl_id: $.data.id, gl_v: $.data.version }
            - call: "POST /roast-batches"
              payload: { green_lot_id: "${gl_id}", product_id: "${prod_id}", planned_green_kg: 20, expected_green_lot_version: "${gl_v}" }
              as: RoasterStaff
              captures: { rb_id: $.data.id }
          trigger:
            - call: "POST /roast-batches/${rb_id}/cancel"
              payload: {}
              as: RoasterStaff
            - call: "GET /green-lots/${gl_id}"
              payload: {}
              as: RoasterStaff
              captures: { gl_avail: $.data.available_kg, gl_reserved: $.data.reserved_kg }
          assert:
            - "GreenLot.${gl_id}.reserved_kg == 0.000 (reservation released)"
            - "GreenLot.${gl_id}.available_kg == 40.000 (restored to received_kg, zero drift)"

      - name: cancel_fulfillment_conserves_roasted_kg
        grounds:
          - state_machines.Fulfillment.RESERVED_to_CANCELLED
          - calculations.roasted_lot_availability
          - entities.RoastedLot.fields.available_kg
        distinguishing_aspect: |
          Conserved quantity = RoastedLot available_kg (a different conserved quantity than green kg).
          Reserve 8 kg then cancel the fulfillment; the compensating cancel MUST restore available_kg to
          exactly produced_kg with no drift: produced_kg - reserved_kg == available_kg, reserved back to 0.
        test_recipe:
          setup:
            - "RoastedLot produced 25 kg (available 25). Reserve a fulfillment of 8 kg (available 17). Cancel it."
          setup_api_calls:
            - call: "POST /price-tiers"
              payload: { code: "CMR0", discount_bps: 0, min_monthly_kg: 0, freshness_max_days: 60 }
              as: SalesRep
              captures: { tier_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Cmp Roasted", price_tier_id: "${tier_id}", net_terms_days: 30, credit_limit_cents: 1000000 }
              as: SalesRep
              captures: { acct_id: $.data.id }
            - call: "POST /roast-profiles"
              payload: { name: "CMR", roast_level: "MEDIUM", expected_shrink_bps: 1500, charge_temp_c: 205 }
              as: RoasterStaff
              captures: { rp_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-CMR", name: "CMR Prod", roast_profile_id: "${rp_id}", base_price_cents_per_kg: 2000, freshness_window_days: 60 }
              as: RoasterStaff
              captures: { prod_id: $.data.id }
            - call: "POST /green-lots"
              payload: { origin: "Panama", lot_ref: "PAN-001", received_kg: 60, par_level_kg: 5 }
              as: RoasterStaff
              captures: { gl_id: $.data.id, gl_v: $.data.version }
            - call: "POST /roast-batches"
              payload: { green_lot_id: "${gl_id}", product_id: "${prod_id}", planned_green_kg: 30, expected_green_lot_version: "${gl_v}" }
              as: RoasterStaff
              captures: { rb_id: $.data.id }
            - call: "POST /roast-batches/${rb_id}/start"
              payload: { actual_green_kg: 30 }
              as: RoasterStaff
            - call: "POST /roast-batches/${rb_id}/drop"
              payload: {}
              as: RoasterStaff
            - call: "POST /roast-batches/${rb_id}/complete"
              payload: { actual_roasted_kg: 25 }
              as: RoasterStaff
            - call: "GET /roast-batches/${rb_id}/roasted-lots"
              payload: {}
              as: RoasterStaff
              captures: { rl_id: "$.data[0].id", rl_v: "$.data[0].version"}
            - call: "POST /accounts/${acct_id}/orders"
              payload: { lines: [ { product_id: "${prod_id}", qty_kg: 8 } ] }
              as: SalesRep
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/fulfillments"
              payload: { product_id: "${prod_id}", roasted_lot_id: "${rl_id}", allocated_kg: 8, expected_roasted_lot_version: "${rl_v}" }
              as: SalesRep
              captures: { ful_id: $.data.id }
          trigger:
            - call: "POST /fulfillments/${ful_id}/cancel"
              payload: {}
              as: SalesRep
            - call: "GET /roasted-lots/${rl_id}"
              payload: {}
              as: SalesRep
              captures: { rl_avail: $.data.available_kg, rl_reserved: $.data.reserved_kg }
          assert:
            - "RoastedLot.${rl_id}.reserved_kg == 0.000 (reservation released)"
            - "RoastedLot.${rl_id}.available_kg == 25.000 (restored to produced_kg, zero drift)"
