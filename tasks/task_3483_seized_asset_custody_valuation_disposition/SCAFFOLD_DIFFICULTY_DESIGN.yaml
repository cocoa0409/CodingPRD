# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3483_seized_asset_custody_valuation_disposition
# Nine Difficulty Rules x 2 instances. Every instance grounds in SCAFFOLD.yaml
# §1.1-§1.7 and replays from empty-DB using only §1.5 endpoints.
# Logical clock default is 2026-09-01T00:00:00Z; recipes that need a later
# "now" set the clock first.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: retention_value_provisional_vs_final
        grounds:
          - calculations.retention_value_estimate
          - calculations.condition_adjusted_valuation
          - entities.Asset.fields.provisional_net_retention_value_cents
          - entities.Asset.fields.final_net_retention_value_cents
        distinguishing_aspect: "Asset-domain dual variant: with an ACCEPTED valuation of 1800000, posted net costs of 120000 and a still-SUBMITTED revaluation of 1980000, the PROVISIONAL variant (latest SUBMITTED, 6-month VEHICLE projection) yields 1710000 while the FINAL variant (ACCEPTED only, posted costs only) yields 1680000 — same asset, same instant, different numbers."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Case open; VEHICLE asset seized 2026-09-01 in GOOD condition."
            - "Valuation V1 raw 2000000 GOOD accepted (adjusted 1800000; legal VALUED); two COST expense entries totalling 120000."
            - "Valuation V2 raw 2200000 GOOD created and left SUBMITTED (adjusted 1980000, never adjudicated)."
          setup_api_calls:
            - call: "POST /custody/cases"
              payload: { case_number: "26-MJ-0001", judicial_district: "S.D.N.Y.", forfeiture_type: "CIVIL", lead_agency_code: "DEA" }
              as: CaseAgent
              captures: { case1: $.data.id }
            - call: "POST /custody/assets"
              payload: { seizure_case_id: "${case1}", asset_type: "VEHICLE", description: "2022 freight tractor", seized_on: "2026-09-01T00:00:00Z", seizure_condition_grade: "GOOD" }
              as: AssetCustodian
              captures: { a1: $.data.id, a1_v: $.data.version }
            - call: "POST /custody/valuations"
              payload: { asset_id: "${a1}", method: "CERTIFIED_APPRAISAL", raw_value_cents: 2000000, assessed_condition_grade: "GOOD", expected_asset_version: "${a1_v}" }
              as: Appraiser
              captures: { v1: $.data.id }
            - call: "POST /custody/valuations/${v1}/adjudicate"
              payload: { outcome: "ACCEPT" }
              as: CourtOfficial
            - call: "POST /custody/expense-entries"
              payload: { asset_id: "${a1}", entry_kind: "COST", expense_type: "STORAGE", amount_cents: 70000, incurred_on: "2026-09-02T00:00:00Z" }
              as: AssetCustodian
            - call: "POST /custody/expense-entries"
              payload: { asset_id: "${a1}", entry_kind: "COST", expense_type: "MAINTENANCE", amount_cents: 50000, incurred_on: "2026-09-03T00:00:00Z" }
              as: AssetCustodian
            - call: "GET /custody/assets/${a1}"
              payload: {}
              as: AssetManager
              as_user_id: "am-priya"
              captures: { a1_v2: $.data.version }
            - call: "POST /custody/valuations"
              payload: { asset_id: "${a1}", method: "MARKET_COMPARABLE", raw_value_cents: 2200000, assessed_condition_grade: "GOOD", expected_asset_version: "${a1_v2}" }
              as: Appraiser
              captures: { v2: $.data.id }
          trigger:
            - call: "GET /custody/assets/${a1}"
              payload: {}
              as: AssetManager
              as_user_id: "am-priya"
          assert:
            - "Asset.${a1}.provisional_net_retention_value_cents == 1710000 (1980000 - (120000 + 6 x 25000))"
            - "Asset.${a1}.final_net_retention_value_cents == 1680000 (1800000 - 120000)"
            - "Asset.${a1}.provisional_net_retention_value_cents != Asset.${a1}.final_net_retention_value_cents"
            - "Valuation.${v2}.status == SUBMITTED (never adjudicated, yet it drives the PROVISIONAL variant)"

      - name: sharing_pool_gross_vs_net_basis
        grounds:
          - calculations.proceeds_waterfall
          - calculations.auction_fee_schedule
          - entities.SeizureCase.fields.sharing_pool_gross_basis_cents
          - entities.SeizureCase.fields.sharing_pool_net_basis_cents
        distinguishing_aspect: "Proceeds-domain dual variant (different entity domain from retention_value_provisional_vs_final): one settled auction with gross 2000000, fee 170000, one VERIFIED lien of 300000 and 100000 of holding costs leaves GROSS_BASIS 1830000 but NET_BASIS 1430000 — the variants diverge by exactly the 400000 of carve-outs."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Case filed then forfeited. VEHICLE asset valued EXCELLENT raw 2000000 (adjusted 2000000), retention SELL, sale authorized."
            - "One VERIFIED mortgage lien of 300000 at priority 1; 100000 of posted COST entries."
            - "Sale event slot [2026-09-05T10:00,2026-09-05T12:00) reserve 2000000 closed with winning bid 2000000."
          setup_api_calls:
            - call: "POST /custody/cases"
              payload: { case_number: "26-MJ-0002", judicial_district: "N.D. Cal.", forfeiture_type: "CRIMINAL", lead_agency_code: "FBI" }
              as: CaseAgent
              captures: { case2: $.data.id }
            - call: "POST /custody/cases/${case2}/file-forfeiture"
              payload: {}
              as: CaseAgent
            - call: "POST /custody/cases/${case2}/forfeit"
              payload: {}
              as: CourtOfficial
              as_user_id: "co-reyes"
            - call: "POST /custody/assets"
              payload: { seizure_case_id: "${case2}", asset_type: "VEHICLE", description: "armored car", seized_on: "2026-09-01T00:00:00Z", seizure_condition_grade: "EXCELLENT" }
              as: AssetCustodian
              captures: { b1: $.data.id, b1_v: $.data.version }
            - call: "POST /custody/valuations"
              payload: { asset_id: "${b1}", method: "BLUE_BOOK", raw_value_cents: 2000000, assessed_condition_grade: "EXCELLENT", expected_asset_version: "${b1_v}" }
              as: Appraiser
              captures: { bv1: $.data.id }
            - call: "POST /custody/valuations/${bv1}/adjudicate"
              payload: { outcome: "ACCEPT" }
              as: CourtOfficial
              as_user_id: "co-reyes"
            - call: "POST /custody/expense-entries"
              payload: { asset_id: "${b1}", entry_kind: "COST", expense_type: "SECURITY", amount_cents: 100000, incurred_on: "2026-09-02T00:00:00Z" }
              as: AssetCustodian
            - call: "POST /custody/third-party-interests"
              payload: { asset_id: "${b1}", kind: "LIEN_MORTGAGE", petitioner_ref: "cl-bank", lienholder_name: "Meridian Bank", amount_cents: 300000, priority_position: 1 }
              as: Claimant
              as_user_id: "cl-bank"
              captures: { lien1: $.data.id }
            - call: "POST /custody/third-party-interests/${lien1}/adjudicate"
              payload: { outcome: "VERIFY" }
              as: CourtOfficial
              as_user_id: "co-reyes"
            - call: "POST /custody/assets/${b1}/decide-retention"
              payload: { decision: "SELL" }
              as: AssetManager
              as_user_id: "am-priya"
            - call: "POST /custody/assets/${b1}/authorize-sale"
              payload: {}
              as: AssetManager
              as_user_id: "am-priya"
            - call: "POST /custody/sale-events"
              payload: { asset_id: "${b1}", sale_method: "PUBLIC_AUCTION", auctioneer_ref: "auc-1", slot_start: "2026-09-05T10:00:00Z", slot_end: "2026-09-05T12:00:00Z", reserve_price_cents: 2000000 }
              as: AuctionCoordinator
              captures: { se1: $.data.id }
            - call: "POST /custody/sale-events/${se1}/close"
              payload: { winning_bid_cents: 2000000 }
              as: AuctionCoordinator
          trigger:
            - call: "POST /custody/sale-events/${se1}/settle"
              payload: {}
              as: FundAdministrator
              as_user_id: "fa-mora"
            - call: "GET /custody/cases/${case2}"
              payload: {}
              as: FundAdministrator
              as_user_id: "fa-mora"
          assert:
            - "SaleEvent.${se1}.auction_fee_cents == 170000 and net_proceeds_cents == 1830000"
            - "SeizureCase.${case2}.sharing_pool_gross_basis_cents == 1830000 (gross - fee only)"
            - "SeizureCase.${case2}.sharing_pool_net_basis_cents == 1430000 (1830000 - 300000 lien - 100000 cost)"
            - "SeizureCase.${case2}.available_proceeds_cents == 1430000"
            - "SeizureCase.${case2}.lien_payments_cents == 300000 and cost_reimbursements_cents == 100000"
            - "ThirdPartyInterest.${lien1}.status == SATISFIED and satisfied_amount_cents == 300000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: interlocutory_eligibility_forward_looking
        grounds:
          - calculations.interlocutory_eligibility
          - entities.InterlocutorySaleRequest.fields.projected_burden_cents
        distinguishing_aspect: "Mode (a) combinatorial: the gate combines accumulated costs, a 3-month forward projection, and a tiered monthly rate selected by asset_type — two assets with identical accumulated cost (60000) and identical appraised value (400000) diverge purely on the tier: VEHICLE burden 135000 >= 120000 is eligible, PERSONAL_PROPERTY burden 84000 < 120000 is rejected."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. One case; two assets each appraised at 400000 (raw 400000 EXCELLENT) with 60000 posted COST: asset V is a VEHICLE (tier 25000/month), asset P is PERSONAL_PROPERTY (tier 8000/month). Both legal VALUED."
          setup_api_calls:
            - call: "POST /custody/cases"
              payload: { case_number: "26-MJ-0003", judicial_district: "E.D. Va.", forfeiture_type: "CIVIL", lead_agency_code: "ATF" }
              as: CaseAgent
              captures: { case3: $.data.id }
            - call: "POST /custody/assets"
              payload: { seizure_case_id: "${case3}", asset_type: "VEHICLE", description: "box truck", seized_on: "2026-09-01T00:00:00Z", seizure_condition_grade: "EXCELLENT" }
              as: AssetCustodian
              captures: { av: $.data.id, av_v: $.data.version }
            - call: "POST /custody/valuations"
              payload: { asset_id: "${av}", method: "BLUE_BOOK", raw_value_cents: 400000, assessed_condition_grade: "EXCELLENT", expected_asset_version: "${av_v}" }
              as: Appraiser
              captures: { av_val: $.data.id }
            - call: "POST /custody/valuations/${av_val}/adjudicate"
              payload: { outcome: "ACCEPT" }
              as: CourtOfficial
              as_user_id: "co-reyes"
            - call: "POST /custody/expense-entries"
              payload: { asset_id: "${av}", entry_kind: "COST", expense_type: "STORAGE", amount_cents: 60000, incurred_on: "2026-09-02T00:00:00Z" }
              as: AssetCustodian
            - call: "POST /custody/assets"
              payload: { seizure_case_id: "${case3}", asset_type: "PERSONAL_PROPERTY", description: "coin collection", seized_on: "2026-09-01T00:00:00Z", seizure_condition_grade: "EXCELLENT" }
              as: AssetCustodian
              captures: { ap: $.data.id, ap_v: $.data.version }
            - call: "POST /custody/valuations"
              payload: { asset_id: "${ap}", method: "CERTIFIED_APPRAISAL", raw_value_cents: 400000, assessed_condition_grade: "EXCELLENT", expected_asset_version: "${ap_v}" }
              as: Appraiser
              captures: { ap_val: $.data.id }
            - call: "POST /custody/valuations/${ap_val}/adjudicate"
              payload: { outcome: "ACCEPT" }
              as: CourtOfficial
              as_user_id: "co-reyes"
            - call: "POST /custody/expense-entries"
              payload: { asset_id: "${ap}", entry_kind: "COST", expense_type: "STORAGE", amount_cents: 60000, incurred_on: "2026-09-02T00:00:00Z" }
              as: AssetCustodian
            - call: "GET /custody/assets/${av}"
              payload: {}
              as: AssetManager
              as_user_id: "am-priya"
              captures: { av_v2: $.data.version }
            - call: "GET /custody/assets/${ap}"
              payload: {}
              as: AssetManager
              as_user_id: "am-priya"
              captures: { ap_v2: $.data.version }
          trigger:
            - call: "POST /custody/interlocutory-sale-requests"
              payload: { asset_id: "${av}", justification: "carrying cost burn", expected_asset_version: "${av_v2}" }
              as: AssetManager
              as_user_id: "am-priya"
              captures: { isr_v: $.data.id }
            - call: "POST /custody/interlocutory-sale-requests"
              payload: { asset_id: "${ap}", justification: "carrying cost burn", expected_asset_version: "${ap_v2}" }
              as: AssetManager
              as_user_id: "am-priya"
              captures: { isr_p_err: $.data.error_id }
          assert:
            - "VEHICLE ISR ${isr_v} created with status PENDING and projected_burden_cents == 135000 (60000 + 3 x 25000)"
            - "PERSONAL_PROPERTY request rejected: isr_p_err == ERR_RATIO_BELOW_THRESHOLD (burden 84000 < 120000) with HTTP 422"
            - "GET /custody/assets/${ap}/interlocutory-sale-requests returns 0 rows"

      - name: income_approach_per_year_rounding
        grounds:
          - calculations.condition_adjusted_valuation
          - entities.Valuation.fields.adjusted_value_cents
        distinguishing_aspect: "Mode (b) combinatorial (nested rounding order, distinct from mode (a) above): INCOME_APPROACH pins per-year RHU rounding then sum — revenues [10001, 10001, 10001] at 3300 bps give 3300 + 3300 + 3300 = 9900, while the forbidden sum-then-round order would give RHU(30003 x 3300 / 10000) = 9901."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. One case; one BUSINESS asset."
          setup_api_calls:
            - call: "POST /custody/cases"
              payload: { case_number: "26-MJ-0004", judicial_district: "D. Del.", forfeiture_type: "CIVIL", lead_agency_code: "IRS" }
              as: CaseAgent
              captures: { case4: $.data.id }
            - call: "POST /custody/assets"
              payload: { seizure_case_id: "${case4}", asset_type: "BUSINESS", description: "vending route", seized_on: "2026-09-01T00:00:00Z", seizure_condition_grade: "GOOD" }
              as: AssetCustodian
              captures: { biz: $.data.id, biz_v: $.data.version }
          trigger:
            - call: "POST /custody/valuations"
              payload: { asset_id: "${biz}", method: "INCOME_APPROACH", annual_net_revenues_cents: [10001, 10001, 10001], expected_asset_version: "${biz_v}" }
              as: Appraiser
              captures: { v_income: $.data.id }
          assert:
            - "Valuation.${v_income}.adjusted_value_cents == 9900 (per-year round-then-sum)"
            - "adjusted_value_cents != 9901 (the sum-then-round order is NOT used)"
            - "Asset.${biz}.legal_state == VALUATION_PENDING"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: asset_parallel_dimensions_independent
        grounds:
          - state_machines.Asset
          - entities.Asset.fields.custody_state
          - entities.Asset.fields.legal_state
        distinguishing_aspect: "Asset carries two independent state dimensions: legal moves SEIZED->VALUATION_PENDING->VALUED->DISPOSITION_REVIEW while custody stays INTAKE, then custody cycles IN_STORAGE->IN_MAINTENANCE->IN_STORAGE while legal stays DISPOSITION_REVIEW — each dimension's moves leave the other untouched, and the custody leg is a genuine cycle."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. One case; one VEHICLE asset seized 2026-09-01T00:00:00Z, FAIR; valuation raw 1600000 FAIR accepted (adjusted 1200000); decision SELL."
            - "Three contiguous custody transfers: T1 STORAGE [09-01T08,09-02T08), T2 MAINTENANCE_SHOP [09-02T08,09-03T08), T3 STORAGE [09-03T08,09-04T08)."
          setup_api_calls:
            - call: "POST /custody/cases"
              payload: { case_number: "26-MJ-0005", judicial_district: "W.D. Tex.", forfeiture_type: "ADMINISTRATIVE", lead_agency_code: "CBP" }
              as: CaseAgent
              captures: { case5: $.data.id }
            - call: "POST /custody/assets"
              payload: { seizure_case_id: "${case5}", asset_type: "VEHICLE", description: "sedan", seized_on: "2026-09-01T00:00:00Z", seizure_condition_grade: "FAIR" }
              as: AssetCustodian
              captures: { pa: $.data.id, pa_v: $.data.version }
            - call: "POST /custody/valuations"
              payload: { asset_id: "${pa}", method: "BLUE_BOOK", raw_value_cents: 1600000, assessed_condition_grade: "FAIR", expected_asset_version: "${pa_v}" }
              as: Appraiser
              captures: { pa_val: $.data.id }
            - call: "POST /custody/valuations/${pa_val}/adjudicate"
              payload: { outcome: "ACCEPT" }
              as: CourtOfficial
              as_user_id: "co-reyes"
            - call: "GET /custody/assets/${pa}"
              payload: {}
              as: AssetManager
              as_user_id: "am-priya"
              captures: { pa_state1: $.data }
            - call: "POST /custody/assets/${pa}/decide-retention"
              payload: { decision: "SELL" }
              as: AssetManager
              as_user_id: "am-priya"
            - call: "POST /custody/custody-transfers"
              payload: { asset_id: "${pa}", from_location_ref: "impound-1", to_location_ref: "warehouse-7", to_location_kind: "STORAGE", window_start: "2026-09-01T08:00:00Z", window_end: "2026-09-02T08:00:00Z" }
              as: AssetCustodian
              captures: { t1: $.data.id }
            - call: "POST /custody/custody-transfers/${t1}/complete"
              payload: { condition_on_arrival: "FAIR" }
              as: AssetCustodian
            - call: "POST /custody/custody-transfers"
              payload: { asset_id: "${pa}", from_location_ref: "warehouse-7", to_location_ref: "shop-3", to_location_kind: "MAINTENANCE_SHOP", window_start: "2026-09-02T08:00:00Z", window_end: "2026-09-03T08:00:00Z" }
              as: AssetCustodian
              captures: { t2: $.data.id }
            - call: "POST /custody/custody-transfers/${t2}/complete"
              payload: { condition_on_arrival: "FAIR" }
              as: AssetCustodian
            - call: "POST /custody/custody-transfers"
              payload: { asset_id: "${pa}", from_location_ref: "shop-3", to_location_ref: "warehouse-7", to_location_kind: "STORAGE", window_start: "2026-09-03T08:00:00Z", window_end: "2026-09-04T08:00:00Z" }
              as: AssetCustodian
              captures: { t3: $.data.id }
            - call: "POST /custody/custody-transfers/${t3}/complete"
              payload: { condition_on_arrival: "GOOD" }
              as: AssetCustodian
          trigger:
            - call: "GET /custody/assets/${pa}"
              payload: {}
              as: AssetManager
              as_user_id: "am-priya"
          assert:
            - "after valuation acceptance the asset was (custody INTAKE, legal VALUED) — legal moved while custody stayed INTAKE"
            - "decide-retention SELL moved legal to DISPOSITION_REVIEW while custody stayed INTAKE"
            - "Asset.${pa}.custody_state == IN_STORAGE after the IN_STORAGE -> IN_MAINTENANCE -> IN_STORAGE maintenance cycle"
            - "Asset.${pa}.legal_state == DISPOSITION_REVIEW — unchanged by the three custody moves"
            - "Asset.${pa}.current_condition_grade == GOOD (T3's condition_on_arrival overwrote it)"

      - name: third_party_interest_appeal_cycle
        grounds:
          - state_machines.ThirdPartyInterest
          - entities.ThirdPartyInterest.fields.appeal_count
        distinguishing_aspect: "Different entity from Asset: ThirdPartyInterest runs a capped cycle FILED -> DENIED -> APPEALED -> DENIED, and the loop terminates only because APPEAL_LIMIT == 1 — the second appeal attempt fails with ERR_APPEAL_EXHAUSTED while a first appeal from FILED is itself an invalid transition."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. One case; one asset (legal SEIZED). One INNOCENT_OWNER claim filed by petitioner cl-orma."
          setup_api_calls:
            - call: "POST /custody/cases"
              payload: { case_number: "26-MJ-0006", judicial_district: "D. Ariz.", forfeiture_type: "CIVIL", lead_agency_code: "DEA" }
              as: CaseAgent
              captures: { case6: $.data.id }
            - call: "POST /custody/assets"
              payload: { seizure_case_id: "${case6}", asset_type: "REAL_PROPERTY", description: "ranch house", seized_on: "2026-09-01T00:00:00Z", seizure_condition_grade: "GOOD" }
              as: AssetCustodian
              captures: { ca: $.data.id }
            - call: "POST /custody/third-party-interests"
              payload: { asset_id: "${ca}", kind: "INNOCENT_OWNER", petitioner_ref: "cl-orma" }
              as: Claimant
              as_user_id: "cl-orma"
              captures: { claim1: $.data.id }
            - call: "POST /custody/third-party-interests/${claim1}/adjudicate"
              payload: { outcome: "DENY" }
              as: CourtOfficial
              as_user_id: "co-reyes"
            - call: "POST /custody/third-party-interests/${claim1}/appeal"
              payload: {}
              as: Claimant
              as_user_id: "cl-orma"
            - call: "POST /custody/third-party-interests/${claim1}/adjudicate"
              payload: { outcome: "DENY" }
              as: CourtOfficial
              as_user_id: "co-reyes"
          trigger:
            - call: "POST /custody/third-party-interests/${claim1}/appeal"
              payload: {}
              as: Claimant
              as_user_id: "cl-orma"
              captures: { appeal_err: $.data.error_id }
          assert:
            - "the FILED -> DENIED -> APPEALED -> DENIED cycle completed (interest is DENIED again after re-adjudication)"
            - "ThirdPartyInterest.${claim1}.appeal_count == 1"
            - "second appeal rejected: appeal_err == ERR_APPEAL_EXHAUSTED with HTTP 409"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: isr_approval_cascade
        grounds:
          - state_machines.InterlocutorySaleRequest.PENDING_to_APPROVED
          - state_machines.Asset
          - state_machines.CustodyTransfer.SCHEDULED_to_CANCELLED
          - calculations.monthly_holding_accrual
        distinguishing_aspect: "Depth-3 cascade triggered by ISR adjudication: APPROVE moves the asset (legal -> SALE_AUTHORIZED, custody -> RELEASED_FOR_SALE); the custody move itself cancels the SCHEDULED maintenance transfer; the legal move itself removes the asset from the monthly accrual sweep (a September run posts one 25000 accrual, the post-approval October run posts zero)."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Case open (NOT forfeited — the interlocutory path). VEHICLE asset appraised 500000 EXCELLENT, legal VALUED."
            - "T1 STORAGE transfer completed (custody IN_STORAGE); T2 MAINTENANCE_SHOP transfer SCHEDULED, contiguous [09-02T08,09-03T08)."
            - "75000 posted COST so the eligibility boundary holds exactly (burden 150000 == 30% of 500000)."
            - "A holding review at 2026-09-15 posts the September accrual (proving the sweep covered the asset before approval); ISR then created and approved."
          setup_api_calls:
            - call: "POST /custody/cases"
              payload: { case_number: "26-MJ-0007", judicial_district: "S.D. Fla.", forfeiture_type: "CIVIL", lead_agency_code: "USMS" }
              as: CaseAgent
              captures: { case7: $.data.id }
            - call: "POST /custody/assets"
              payload: { seizure_case_id: "${case7}", asset_type: "VEHICLE", description: "tow truck", seized_on: "2026-09-01T00:00:00Z", seizure_condition_grade: "EXCELLENT" }
              as: AssetCustodian
              captures: { xa: $.data.id, xa_v: $.data.version }
            - call: "POST /custody/valuations"
              payload: { asset_id: "${xa}", method: "BLUE_BOOK", raw_value_cents: 500000, assessed_condition_grade: "EXCELLENT", expected_asset_version: "${xa_v}" }
