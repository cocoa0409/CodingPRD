            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2027-01-12T06:00:00Z" }, as: TerminalOperator }
            - { call: "POST /api/vessel-calls/${vc}/tender-nor", payload: {}, as: CustomerRep, as_user_id: "${cust}" }
            - { call: "POST /api/vessel-calls/${vc}/berth", payload: {}, as: MarineScheduler }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2027-01-13T08:00:00Z" }, as: TerminalOperator }
          trigger:
            - { call: "POST /api/vessel-calls/${vc}/depart", payload: {}, as: MarineScheduler, captures: { dep: $.data.departed_at } }
            - { call: "GET /api/cargo-slots/${slot}", payload: {}, as: CommercialManager, captures: { prov: $.data.provisional_invoice_usd, lift: $.data.lift_status } }
          assert:
            - "depart response carries departed_at == 2027-01-13T08:00:00Z in the same request"
            - "immediate read: CargoSlot.${slot}.lift_status == LOADED and provisional_invoice_usd == 24399000.00"
