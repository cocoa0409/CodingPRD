            - call: "POST /purchase-data-records"
              payload: { retailer_id: "${ret_id}", offer_id: "${offer_id}", pos_transaction_ref: "POS-C2", transaction_date: "2026-07-06", qualifying_units: 8 }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /purchase-data-records"
              payload: { retailer_id: "${ret_id}", offer_id: "${offer_id}", pos_transaction_ref: "POS-C3", transaction_date: "2026-07-06", qualifying_units: 8 }
              as: IntakeClerk
