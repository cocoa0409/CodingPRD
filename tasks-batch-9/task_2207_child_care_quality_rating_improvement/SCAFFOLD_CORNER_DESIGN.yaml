            - { call: "POST /providers", payload: { legal_name: "Sunrise Center", license_number: "LIC-3001", county_code: "DANE", region_code: "URBAN", licensed_capacity: 60, active_staff_fte: 1.00 }, as: StateAdministrator, as_user_id: "admin_ops_1", captures: { pid: $.data.id } }
