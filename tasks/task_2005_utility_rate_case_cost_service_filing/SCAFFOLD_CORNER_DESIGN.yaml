  # ===========================================================================
  # Section: calculations (Table 3)
  # ===========================================================================
  - section: calculations
    instances:
      - name: cost_of_service_excludes_unlocked_entries
        claim_type: input_set_filtering
        grounds: [calculations.cost_of_service_total, calculations.rate_base_total, calculations.revenue_requirement]
        distinguishing_aspect: "Input-set filtering on BOTH legs: cost of service counts LOCKED entries only (a SUBMITTED 1,000,000,000 O&M entry contributes 0), while the as_filed rate base counts SUBMITTED+AUDITED items (2,400,000,000) -> return 180,000,000 and RR 180,000,000."
        test_recipe:
          setup: ["Case DRAFT with E1 SUBMITTED (deliberately not locked) and RB1 SUBMITTED"]
          setup_api_calls:
            - { call: "POST /api/v1/rate-cases", payload: { case_number: "UR-2026-104", utility_name: "Cascade Power & Light", test_year_start: "2025-01-01T00:00:00Z", test_year_end: "2025-12-31T00:00:00Z", return_on_rate_base_bp: 750, proposed_revenue_requirement_cents: 1897500000, allocation_method: "COINCIDENT_PEAK" }, as: UtilityFiler, captures: { rc: $.data.id } }
            - { call: "POST /api/v1/test-year-entries", payload: { rate_case_id: "${rc}", account_code: "900", category: "O_AND_M", booked_amount_cents: 1000000000 }, as: UtilityFiler, captures: { e1: $.data.id } }
            - { call: "POST /api/v1/test-year-entries/${e1}/submit", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/rate-base-items", payload: { rate_case_id: "${rc}", label: "Generation plant", plant_in_service_cents: 3000000000, accumulated_depreciation_cents: 500000000, working_capital_cents: 100000000, accumulated_deferred_taxes_cents: 200000000 }, as: UtilityFiler, captures: { rb1: $.data.id } }
            - { call: "POST /api/v1/rate-base-items/${rb1}/submit", payload: {}, as: UtilityFiler }
          trigger:
            - { call: "GET /api/v1/rate-cases/${rc}/revenue-requirement", payload: {}, as: CommissionStaff, captures: { cos: $.data.cost_of_service_cents, rb: $.data.rate_base_cents, ret: $.data.return_cents, rr: $.data.revenue_requirement_cents, var: $.data.variant } }
          assert:
            - "${cos} == 0 (SUBMITTED entry excluded; only LOCKED count)"
            - "${rb} == 2400000000 (SUBMITTED item included in as_filed)"
            - "${ret} == 180000000 == round_half_up(2400000000*750/10000)"
            - "${rr} == 180000000 and ${var} == as_filed"

      - name: bill_impact_with_explicit_tariff
        claim_type: correct_result
        grounds: [calculations.bill_impact, "endpoints[GET /api/v1/rate-cases/{caseId}/bill-impact]"]
        distinguishing_aspect: "The bill-impact read applies the same pinned tier engine to an individual 500-kwh month under both rate structures: present 4,700c vs proposed 5,050c -> impact 745 bp (round_half_up(10000*350/4700))."
        test_recipe:
