    roles: [Advertiser]
    code: 200
    input: []
    output: AdCreative
    side_effects: ["review_status -> WITHDRAWN", "expires every QUEUED or CLAIMED ReviewTask on this creative and decrements each holding Reviewer.claimed_task_count", "serving_eligible -> false", "increments AdCreative.version by 1"]

  - method: POST
    path: "/ad-policy/ad-creatives/{id}/screening-runs"
    description: "Ingest an automated pre-approval screening run; decisions is a non-empty array of { policy_rule_id, confidence, matched_snippet } objects. OCC-guarded on the creative (§1.2.1 screening-run-stale-creative)."
