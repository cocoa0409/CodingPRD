  - rule_id: resource_temporal_overlap
    instances:
      - name: supportive_service_periods_are_closed_inclusive_so_shared_endpoints_collide
        grounds:
          - calculations.supportive_service_waterfall
          - validations[priority=42]
          - errors.ERR_SERVICE_PERIOD_OVERLAP
          - entities.SupportiveServiceAuthorization.fields.period_end
        distinguishing_aspect: |
          Authorization periods are CLOSED and INCLUSIVE, so a second TRANSPORTATION
          period that starts on 2026-08-31 — the exact end date of the existing one —
          overlaps and is refused, while 2026-09-01 does not. An implementation using
          half-open intervals here would accept the 2026-08-31 start. The same case
          also holds a CHILD_CARE period fully inside 2026-08, proving the collision
          is scoped to a single service_type.
        test_recipe:
          setup:
            - "A SINGLE_PARENT case of household size 3 is ACTIVE with 2026-08 issued and has one ACTIVE COMMUNITY_SERVICE assignment of 20 scheduled weekly hours for 2026-08-01..2026-12-01."
