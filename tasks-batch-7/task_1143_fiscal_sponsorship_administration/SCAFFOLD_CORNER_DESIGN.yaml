            - { call: "POST /fsa/compliance-reviews/${rv}/issue-findings", payload: { findings_count: 2, severity_max: "MEDIUM" }, as: ComplianceOfficer, as_user_id: user_co_1 }
          trigger:
            - { call: "POST /fsa/compliance-reviews/${rv}/remediate", payload: { remediated_count: 3 }, as: ComplianceOfficer, as_user_id: user_co_1, captures: { e: $.data.error_id } }
            - { call: "POST /fsa/compliance-reviews/${rv}/remediate", payload: { remediated_count: 2 }, as: ComplianceOfficer, as_user_id: user_co_1, captures: { st: $.data.status, open: $.data.open_findings_count } }
          assert:
