      - name: waiver_state_beats_waiver_fiscal_eligibility
        grounds:
          - validations[priority=7]
          - validations[priority=12]
          - state_machines.Overpayment.ESTABLISHED_to_WAIVED
        distinguishing_aspect: |
          Pair `state` (priority 7, ERR_INVALID_STATE) vs `business_constraint`
          waiver-eligibility (priority 12, ERR_WAIVER_NOT_ALLOWED): waiving an
          Overpayment already RECOVERING (not ESTABLISHED) that is ALSO a FRAUD
          overpayment returns ERR_INVALID_STATE — a DIFFERENT error-category pairing
          than the state-vs-work-search conflict above (different priority-12 rule).
        test_recipe:
          setup:
            - "A FRAUD Overpayment (principal 50000, total_assessed 57500) advanced to RECOVERING by one partial CASH recovery of 10000."
