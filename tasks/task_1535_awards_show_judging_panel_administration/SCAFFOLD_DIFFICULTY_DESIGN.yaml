        as: ProgramAdmin
        payload:
          code: GALA-OVL
          title: Gala 2026
          submission_opens_at: '2026-08-10T00:00:00Z'
          early_fee_ends_at: '2026-08-20T00:00:00Z'
          submission_closes_at: '2026-09-01T00:00:00Z'
          eligibility_window_start: '2026-01-01T00:00:00Z'
          eligibility_window_end: '2026-08-01T00:00:00Z'
          ceremony_scheduled_at: '2026-10-01T19:00:00Z'
          refund_policy: FLAT_FEE
        captures:
          season_id: $.data.id
          season_v: $.data.version
      - call: POST /awards/seasons/${season_id}/categories
        as: ProgramAdmin
        payload:
          code: CAT_OVL
          name: CAT_OVL
          min_materials: 1
          max_entries_per_entrant: 3
          panel_size: 3
          finalist_slots: 2
          scoring_rubric: *id001
          early_fee_cents: 10000
          standard_fee_cents: 15000
          late_fee_cents: 20000
        captures:
          cat_id: $.data.id
      - call: POST /awards/categories/${cat_id}/publish
        as: ProgramAdmin
        payload: {}
      - call: POST /awards/seasons/${season_id}/ceremonies
        as: ProgramAdmin
        payload:
          venue_name: Hall A
          starts_at: '2026-10-01T19:00:00Z'
          ends_at: '2026-10-01T21:00:00Z'
          rundown:
          - segment_no: 1
            category_id: ${cat_id}
            duration_seconds: 600
        captures:
          cer_a: $.data.id
      trigger:
      - call: POST /awards/seasons/${season_id}/ceremonies
        as: ProgramAdmin
        payload:
          venue_name: Hall B
          starts_at: '2026-10-01T21:00:00Z'
          ends_at: '2026-10-01T23:00:00Z'
          rundown:
          - segment_no: 1
            category_id: ${cat_id}
            duration_seconds: 300
        captures:
          cer_b: $.data.id
      - call: POST /awards/seasons/${season_id}/ceremonies
        as: ProgramAdmin
        payload:
          venue_name: Hall C
          starts_at: '2026-10-01T20:59:59Z'
          ends_at: '2026-10-01T23:00:00Z'
          rundown:
          - segment_no: 1
            category_id: ${cat_id}
            duration_seconds: 300
        captures:
          err: $.data.error_id
      assert:
      - Adjacent ceremony (starts exactly at first ends_at) is created (201)
      - Overlapping ceremony (starts 1s before first ends_at) rejected 422 ERR_CEREMONY_OVERLAP
  - name: scoring_round_window_gap_buffer
    grounds:
    - validations[priority=12]
    - entities.ScoringRound.fields.scheduled_window_start
    distinguishing_aspect: 'Buffered-gap interval semantics on ScoringRound: a second round starting exactly 12h after the first round''s window end is accepted (gap
      >= 12h), while one starting 11h59m after is rejected with ERR_ROUND_WINDOW_TOO_CLOSE even though the raw intervals do not overlap — different geometry (minimum-gap
      buffer) than the half-open adjacency rule on Ceremony.'
