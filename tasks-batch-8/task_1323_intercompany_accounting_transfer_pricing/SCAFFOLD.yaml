# =============================================================================
# Task 1323 — Intercompany Accounting & Transfer Pricing Documentation
# =============================================================================

scenario: |
  Intercompany Accounting & Transfer Pricing Documentation (multinational tax department): intercompany agreement inventory & pricing policy, transaction recording & automatic elimination, markup/cost-plus calculation & true-up at year end, local file/master file documentation preparation, benchmarking study & comparables refresh, country-by-country reporting threshold, audit defense file & advance pricing agreement, settlement & cash pooling

domain_name: intercompany-transfer-pricing
api_prefix: /tp

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation      # provisional markup vs final benchmark true-up; average-balance vs closing-balance pool interest
    - cascading_side_effects        # post true-up -> adjustment tx -> auto-elimination -> pool accrual
    - optimistic_concurrency        # OCC on BenchmarkingStudy.version (refresh) and CashPool.version (sweeps)
    - version_pinning_on_approval   # agreement activation pins benchmarking study + range snapshot; APA agreement locks pricing
  entity_topology: flat             # peer entities joined by FK references; no nested ownership in URLs
  state_machine_shape: cyclic       # Agreement DRAFT->ACTIVE->UNDER_AMENDMENT->ACTIVE loop; ICTransaction carries parallel dims; AuditCase branches by case_type
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential              # BenchmarkingStudy.supersedes_study_id
  role_model: segregation_of_duties # preparer (TaxAnalyst) cannot approve own work; approver user-id must differ from creator/submitter
  consistency_model: immediate      # every mutation + cascade is visible in the same request's response

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: FiscalYear
    parent: null
    common_fields: true
    fields:
      - { name: year_index, type: integer, source: input, description: "Calendar year number, e.g. 2026; unique across all fiscal years" }
      - { name: group_revenue_eur, type: integer, source: input, description: "Consolidated group revenue in whole EUR (prior-year figure used for CbCR threshold test)" }
      - { name: cbc_required, type: boolean, source: computed, description: "true iff group_revenue_eur >= 750000000 (inclusive boundary)" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSING | CLOSED" }
      - { name: consolidated_intercompany_net_cents, type: integer, source: computed, default: 0, description: "Sum over ELIMINATED transactions of (provider_revenue_cents - recipient_cost_cents - plug_cents); elimination books a plug so this is always 0" }
      - { name: closed_at, type: datetime, source: system, description: "Logical-clock timestamp when status became CLOSED; null until then", default: null }

  - name: LegalEntity
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Legal entity name" }
      - { name: country_code, type: string, source: input, description: "ISO 3166-1 alpha-2 country code" }
      - { name: functional_currency, type: string, source: input, description: "ISO 4217 currency code" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE" }

  - name: IntercompanyAgreement
    parent: null
    common_fields: true
    fields:
      - { name: provider_entity_id, type: string, source: input, description: "FK -> LegalEntity.id; selling/providing entity" }
      - { name: recipient_entity_id, type: string, source: input, description: "FK -> LegalEntity.id; buying/receiving entity; must differ from provider_entity_id" }
      - { name: transaction_type, type: enum, source: input, description: "GOODS | SERVICES | IP_ROYALTY | FINANCING | COST_SHARING" }
      - { name: pricing_method, type: enum, source: input, description: "COST_PLUS | TNMM | RESALE_MINUS | CUP" }
      - { name: markup_bp, type: integer, source: input, description: "Applied markup in basis points; required when pricing_method = COST_PLUS" }
      - { name: true_up_method, type: enum, source: input, description: "TO_MEDIAN | TO_RANGE_EDGE — which arm's-length target the year-end true-up adjusts to" }
      - { name: benchmarking_study_id, type: string, source: input, description: "FK -> BenchmarkingStudy.id; the study supporting the pricing policy; required for COST_PLUS" }
      - { name: pinned_study_id, type: string, source: system, description: "FK -> BenchmarkingStudy.id; study version pinned at activation/amendment-approval time", default: null }
      - { name: pinned_p25_bp, type: integer, source: system, description: "Interquartile range snapshot from the pinned study at pin time", default: null }
      - { name: pinned_median_bp, type: integer, source: system, description: "Median snapshot from the pinned study at pin time", default: null }
      - { name: pinned_p75_bp, type: integer, source: system, description: "P75 snapshot from the pinned study at pin time", default: null }
      - { name: effective_from, type: string, source: input, description: "ISO date; half-open interval start (inclusive)" }
      - { name: effective_to, type: string, source: input, description: "ISO date; half-open interval end (exclusive)" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | UNDER_AMENDMENT | TERMINATED" }
      - { name: pending_markup_bp, type: integer, source: system, description: "Proposed markup while UNDER_AMENDMENT", default: null }
      - { name: pending_study_id, type: string, source: system, description: "Proposed replacement study while UNDER_AMENDMENT", default: null }
      - { name: amendment_started_by_user_id, type: string, source: system, description: "X-User-ID of the amendment initiator; segregation-of-duties reference", default: null }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator; segregation-of-duties reference for activation" }
      - { name: amendments_count, type: integer, source: system, default: 0, description: "Number of approved amendments; +1 per approve_amendment" }
      - { name: pricing_review_required, type: boolean, source: computed, default: false, description: "true when the pinned study became STALE via fiscal-year close cascade" }
      - { name: apa_locked, type: boolean, source: computed, default: false, description: "true while an AGREED APA AuditCase covers this entity pair + transaction type for a covered year" }

  - name: ICTransaction
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> IntercompanyAgreement.id" }
      - { name: fiscal_year_id, type: string, source: input, description: "FK -> FiscalYear.id" }
      - { name: cost_base_cents, type: integer, source: input, description: "Provider cost base in cents; denominator for cost-plus margin" }
      - { name: provider_revenue_cents, type: integer, source: input, description: "Amount the provider booked as revenue (the intercompany invoice price)" }
      - { name: recipient_cost_cents, type: integer, source: input, description: "Amount the recipient booked as cost; must match provider_revenue_cents within tolerance at match time" }
      - { name: origin_run_id, type: string, source: system, description: "FK -> TrueUpRun.id; set on system-created true-up adjustment entries", default: null }
      - { name: is_true_up_adjustment, type: boolean, source: computed, default: false, description: "true iff created by a TrueUpRun post cascade" }
      - { name: provisional_al_price_cents, type: integer, source: computed, description: "round_half_up(cost_base_cents * (1 + markup_bp/10000)) using the agreement markup at booking time" }
      - { name: margin_bp, type: integer, source: computed, description: "round_half_up((provider_revenue_cents - cost_base_cents) * 10000 / cost_base_cents)" }
      - { name: elimination_status, type: enum, source: system, description: "UNMATCHED | MATCHED | ELIMINATED — independent dimension 1" }
      - { name: settlement_status, type: enum, source: system, description: "UNSETTLED | NETTED | SETTLED — independent dimension 2" }
      - { name: matched_by_user_id, type: string, source: system, description: "X-User-ID that performed the match", default: null }

  - name: TrueUpRun
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> IntercompanyAgreement.id" }
      - { name: fiscal_year_id, type: string, source: input, description: "FK -> FiscalYear.id" }
      - { name: status, type: enum, source: system, description: "DRAFT | COMPUTED | APPROVED | POSTED" }
      - { name: actual_margin_bp, type: integer, source: computed, description: "Aggregate tested margin over the input set at compute time; null until COMPUTED", default: null }
      - { name: true_up_amount_cents, type: integer, source: computed, description: "Signed adjustment amount per true_up_calculation; null until COMPUTED", default: null }
      - { name: adjustment_transaction_id, type: string, source: system, description: "FK -> ICTransaction.id of the adjustment entry created at post; null when amount was 0", default: null }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator; segregation-of-duties reference for approve" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of approver", default: null }

  - name: BenchmarkingStudy
    parent: null
    common_fields: true
    fields:
      - { name: transaction_type, type: enum, source: input, description: "GOODS | SERVICES | IP_ROYALTY | FINANCING | COST_SHARING" }
      - { name: region, type: string, source: input, description: "Geographic scope label, e.g. EU" }
      - { name: vintage_year, type: integer, source: input, description: "Data vintage; study goes STALE when a fiscal year with year_index >= vintage_year + 2 closes" }
      - { name: comparables_bp, type: array, source: input, description: "Comparable margins in basis points; minimum 5 entries" }
      - { name: p25_bp, type: integer, source: computed, description: "Nearest-rank 25th percentile of comparables_bp, computed at approve; null until CURRENT", default: null }
      - { name: median_bp, type: integer, source: computed, description: "Nearest-rank 50th percentile at approve", default: null }
      - { name: p75_bp, type: integer, source: computed, description: "Nearest-rank 75th percentile at approve", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | CURRENT | STALE | SUPERSEDED" }
      - { name: supersedes_study_id, type: string, source: system, description: "FK -> BenchmarkingStudy.id; set on the new DRAFT created by refresh", default: null }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator; segregation-of-duties reference for approve" }

  - name: DocPackage
    parent: null
    common_fields: true
    fields:
      - { name: fiscal_year_id, type: string, source: input, description: "FK -> FiscalYear.id" }
      - { name: entity_id, type: string, source: input, description: "FK -> LegalEntity.id; required for LOCAL_FILE, must be null for MASTER_FILE and CBC_REPORT", default: null }
      - { name: doc_type, type: enum, source: input, description: "MASTER_FILE | LOCAL_FILE | CBC_REPORT" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | FILED" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID that submitted; approver must differ", default: null }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of approver", default: null }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock timestamp at filing", default: null }

  - name: AuditCase
    parent: null
    common_fields: true
    fields:
      - { name: entity_id, type: string, source: input, description: "FK -> LegalEntity.id; the audited entity" }
      - { name: case_type, type: enum, source: input, description: "AUDIT | APA" }
      - { name: authority_country, type: string, source: input, description: "ISO country code of the tax authority" }
      - { name: covered_year_indexes, type: array, source: input, description: "Integer year indexes covered; required for APA; must be disjoint from the covered_year_indexes of every other APA case for the same entity whose status is in {OPENED, ACTIVE_PREP, SUBMITTED_TO_AUTHORITY, CLOSED_AGREED} (CLOSED_RESOLVED cases do not block)", default: null }
      - { name: defense_doc_ids, type: array, source: system, default: [], description: "Ordered DocPackage ids attached as the audit defense file (append via attach_doc)" }
      - { name: status, type: enum, source: system, description: "OPENED | ACTIVE_PREP | SUBMITTED_TO_AUTHORITY | CLOSED_RESOLVED | CLOSED_AGREED" }

  - name: CashPool
    parent: null
    common_fields: true
    fields:
      - { name: fiscal_year_id, type: string, source: input, description: "FK -> FiscalYear.id; at most one pool per fiscal year" }
      - { name: interest_method, type: enum, source: input, description: "AVERAGE_BALANCE | CLOSING_BALANCE — interest allocation variant" }
      - { name: admin_fee_cents, type: integer, source: input, description: "Flat pool administration fee allocated pro-rata at netting" }
      - { name: status, type: enum, source: system, description: "OPEN | NETTING | SETTLED" }
      - { name: positions, type: array, source: computed, default: [], description: "Per-entity position objects: { entity_id, balance_cents, accrued_balance_day_cents, pending_cents, interest_cents, fee_cents, status }" }
      - { name: opened_at_utc, type: datetime, source: system, description: "Logical-clock timestamp at creation; day-count epoch for interest" }
      - { name: netting_at_utc, type: datetime, source: system, description: "Logical-clock timestamp at begin_netting", default: null }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: FiscalYear
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSING
        trigger: "POST /tp/fiscal_years/{fiscalYearId}/begin_closing"
        actor: GroupTaxAdmin
        preconditions: []
        side_effects:
          - "Every ICTransaction of this year with elimination_status == MATCHED transitions to ELIMINATED (automatic elimination); each books plug_cents = provider_revenue_cents - recipient_cost_cents so consolidated net stays 0"
          - "Recompute consolidated_intercompany_net_cents (= 0 by construction)"
          - "Increments FiscalYear.version by 1"
      - from: CLOSING
        to: CLOSED
        trigger: "POST /tp/fiscal_years/{fiscalYearId}/close"
        actor: GroupTaxAdmin
        preconditions:
          - "No ICTransaction of this year with elimination_status != ELIMINATED (ERR_YEAR_HAS_OPEN_TRANSACTIONS)"
          - "No TrueUpRun of this year with status != POSTED (ERR_YEAR_HAS_OPEN_TRUE_UPS)"
          - "If cbc_required: a DocPackage with doc_type == CBC_REPORT and status == FILED exists for this year (ERR_CBC_FILING_MISSING)"
        side_effects:
          - "closed_at = current logical clock"
          - "Cascade link 1: every BenchmarkingStudy in CURRENT with vintage_year <= year_index - 2 transitions to STALE"
          - "Cascade link 2 (caused by link 1): every IntercompanyAgreement whose pinned_study_id is one of those newly-STALE studies sets pricing_review_required = true"
          - "Increments FiscalYear.version by 1"

  - entity: LegalEntity
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /tp/legal_entities/{legalEntityId}/deactivate"
        actor: GroupTaxAdmin
        preconditions:
          - "No IntercompanyAgreement in {ACTIVE, UNDER_AMENDMENT} references this entity as provider or recipient (ERR_ENTITY_HAS_ACTIVE_AGREEMENTS); DRAFT agreements do not block"
        side_effects: ["Increments LegalEntity.version by 1"]

  - entity: IntercompanyAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /tp/agreements/{agreementId}/activate"
        actor: TaxManager
        preconditions:
          - "X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "provider_entity_id and recipient_entity_id both ACTIVE (ERR_ENTITY_INACTIVE)"
          - "Current logical clock date within [effective_from, effective_to) (ERR_AGREEMENT_NOT_IN_EFFECT)"
          - "No other agreement in {ACTIVE, UNDER_AMENDMENT} with same (provider_entity_id, recipient_entity_id, transaction_type) and overlapping half-open interval (ERR_AGREEMENT_PERIOD_OVERLAP)"
          - "benchmarking_study_id references a study in CURRENT (ERR_STALE_BENCHMARK)"
        side_effects:
          - "Pin study: pinned_study_id = benchmarking_study_id; pinned_p25_bp/median_bp/p75_bp copied from the study (version-pinning on approval)"
          - "Increments IntercompanyAgreement.version by 1"
      - from: ACTIVE
        to: UNDER_AMENDMENT
        trigger: "POST /tp/agreements/{agreementId}/start_amendment"
        actor: TaxAnalyst
        preconditions:
          - "apa_locked == false (ERR_APA_LOCKED)"
        side_effects:
          - "pending_markup_bp / pending_study_id stored from request; amendment_started_by_user_id = X-User-ID"
          - "Increments IntercompanyAgreement.version by 1"
      - from: UNDER_AMENDMENT
        to: ACTIVE
        trigger: "POST /tp/agreements/{agreementId}/approve_amendment"
        actor: TaxManager
        preconditions:
          - "X-User-ID != amendment_started_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "If pending_study_id is set it must be CURRENT (ERR_STALE_BENCHMARK)"
        side_effects:
          - "markup_bp = pending_markup_bp; if pending_study_id set: re-pin study + range snapshot; pending_* cleared"
          - "amendments_count += 1; pricing_review_required reset to false"
          - "Increments IntercompanyAgreement.version by 1 (cyclic return to ACTIVE; further amendment cycles allowed)"
      - from: UNDER_AMENDMENT
        to: ACTIVE
        trigger: "POST /tp/agreements/{agreementId}/discard_amendment"
        actor: TaxAnalyst
        preconditions: []
        side_effects:
          - "pending_* fields cleared; amendment_started_by_user_id cleared; markup and pins unchanged"
          - "Increments IntercompanyAgreement.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /tp/agreements/{agreementId}/terminate"
        actor: TaxManager
        preconditions:
          - "apa_locked == false (ERR_APA_LOCKED)"
          - "No ICTransaction of this agreement with elimination_status != ELIMINATED (ERR_AGREEMENT_HAS_OPEN_TRANSACTIONS)"
        side_effects: ["Increments IntercompanyAgreement.version by 1"]

  - entity: ICTransaction
    initial_state: "UNMATCHED / UNSETTLED (two independent parallel state dimensions)"
    terminal_states: ["ELIMINATED + SETTLED (both dimensions terminal)"]
    transitions:
      - from: UNMATCHED
        to: MATCHED
        trigger: "POST /tp/transactions/{transactionId}/match"
        actor: TaxAnalyst
        preconditions:
          - "abs(provider_revenue_cents - recipient_cost_cents) <= 100 cents (ERR_ELIMINATION_MISMATCH)"
        side_effects:
          - "matched_by_user_id = X-User-ID"
          - "Increments ICTransaction.version by 1"
        note: "elimination dimension; settlement_status is NOT touched — the dimensions evolve independently"
      - from: MATCHED
        to: ELIMINATED
        trigger: "system (automatic during POST /tp/fiscal_years/{id}/begin_closing) OR system (immediately, for true-up adjustment transactions created by TrueUpRun post)"
        actor: system
        preconditions: []
        side_effects:
          - "Book plug_cents = provider_revenue_cents - recipient_cost_cents to the consolidation plug so the fiscal year's consolidated_intercompany_net_cents remains 0"
          - "Increments ICTransaction.version by 1"
      - from: UNSETTLED
        to: NETTED
        trigger: "system (during POST /tp/cash_pools/{id}/begin_netting for transactions of the pool's fiscal year with elimination_status in {MATCHED, ELIMINATED})"
        actor: system
        preconditions: []
        side_effects:
          - "provider entity position.balance_cents += provider_revenue_cents; recipient entity position.balance_cents -= recipient_cost_cents"
          - "Increments ICTransaction.version by 1"
        note: "settlement dimension; works on MATCHED-but-not-yet-ELIMINATED transactions, proving independence of the two dimensions"
      - from: NETTED
        to: SETTLED
        trigger: "system (during POST /tp/cash_pools/{id}/settle)"
        actor: system
        preconditions: []
        side_effects: ["Increments ICTransaction.version by 1"]

  - entity: TrueUpRun
    initial_state: DRAFT
    terminal_states: [POSTED]
    transitions:
      - from: DRAFT
        to: COMPUTED
        trigger: "POST /tp/true_up_runs/{trueUpRunId}/compute"
        actor: TaxAnalyst
        preconditions:
          - "At least one ICTransaction with elimination_status in {MATCHED, ELIMINATED} exists for (agreement_id, fiscal_year_id) (ERR_NO_ELIMINATED_TRANSACTIONS)"
        side_effects:
          - "Run true_up_calculation; set actual_margin_bp and true_up_amount_cents"
          - "Increments TrueUpRun.version by 1"
      - from: COMPUTED
        to: DRAFT
        trigger: "POST /tp/true_up_runs/{trueUpRunId}/recompute"
        actor: TaxAnalyst
        preconditions: []
        side_effects:
          - "actual_margin_bp and true_up_amount_cents reset to null (recompute loop; cyclic)"
          - "Increments TrueUpRun.version by 1"
      - from: COMPUTED
        to: APPROVED
        trigger: "POST /tp/true_up_runs/{trueUpRunId}/approve"
        actor: TaxManager
        preconditions:
          - "FiscalYear.status == CLOSING (ERR_YEAR_NOT_CLOSING)"
          - "X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "approved_by_user_id = X-User-ID"
          - "Increments TrueUpRun.version by 1"
      - from: APPROVED
        to: POSTED
        trigger: "POST /tp/true_up_runs/{trueUpRunId}/post"
        actor: TaxManager
        preconditions:
          - "FiscalYear.status == CLOSING (ERR_YEAR_NOT_CLOSING)"
        side_effects:
          - "Cascade link 1: if true_up_amount_cents != 0, create adjustment ICTransaction (agreement_id, fiscal_year_id, cost_base_cents = 0, provider_revenue_cents = recipient_cost_cents = true_up_amount_cents, origin_run_id = this run, is_true_up_adjustment = true, elimination_status = MATCHED, settlement_status = UNSETTLED); adjustment_transaction_id set. If amount == 0, no adjustment is created."
          - "Cascade link 2 (caused by link 1): the adjustment transaction is immediately auto-eliminated (elimination_status -> ELIMINATED; plug 0)"
          - "Cascade link 3 (caused by link 2): if a CashPool exists for this fiscal year with status == OPEN, the provider entity position.pending_cents += true_up_amount_cents and recipient entity position.pending_cents -= true_up_amount_cents (positions upserted by entity)"
          - "Increments TrueUpRun.version by 1"

  - entity: BenchmarkingStudy
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: CURRENT
        trigger: "POST /tp/benchmarking_studies/{benchmarkingStudyId}/approve"
        actor: TransferPricingLead
        preconditions:
          - "X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Compute p25_bp/median_bp/p75_bp via nearest-rank percentiles over sorted comparables_bp"
          - "If supersedes_study_id is set, that study transitions CURRENT|STALE -> SUPERSEDED"
          - "Increments BenchmarkingStudy.version by 1"
      - from: CURRENT
        to: STALE
        trigger: "system (during POST /tp/fiscal_years/{id}/close when vintage_year <= closing year_index - 2)"
        actor: system
        preconditions: []
        side_effects:
          - "Agreements pinned to this study get pricing_review_required = true (cascade link 2 of fiscal-year close)"
          - "Increments BenchmarkingStudy.version by 1"
      - from: CURRENT
        to: SUPERSEDED
        trigger: "system (when the refresh child study created from this study is approved)"
        actor: system
        preconditions: []
        side_effects: ["Increments BenchmarkingStudy.version by 1"]
      - from: STALE
        to: SUPERSEDED
        trigger: "system (when the refresh child study created from this study is approved)"
        actor: system
        preconditions: []
        side_effects: ["Increments BenchmarkingStudy.version by 1"]
    note: "refresh is not a transition of this entity — it CREATES a new DRAFT study carrying supersedes_study_id; the old study's version advances by 1 as the OCC witness"

  - entity: DocPackage
    initial_state: DRAFT
    terminal_states: [FILED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /tp/doc_packages/{docPackageId}/submit"
        actor: TaxAnalyst
        preconditions: []
        side_effects:
          - "submitted_by_user_id = X-User-ID"
          - "Increments DocPackage.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /tp/doc_packages/{docPackageId}/approve"
        actor: TaxManager
        preconditions:
          - "X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "approved_by_user_id = X-User-ID"
          - "Increments DocPackage.version by 1"
      - from: APPROVED
        to: FILED
        trigger: "POST /tp/doc_packages/{docPackageId}/file"
        actor: TaxManager
        preconditions:
          - "FiscalYear.status != CLOSED (ERR_BOOKS_CLOSED)"
          - "If doc_type == CBC_REPORT: fiscal_year.cbc_required == true (ERR_CBC_NOT_REQUIRED)"
          - "If doc_type == LOCAL_FILE: no ACTIVE agreement of entity_id has pricing_review_required == true (ERR_STALE_BENCHMARK)"
        side_effects:
          - "filed_at = current logical clock"
          - "Increments DocPackage.version by 1"

  - entity: AuditCase
    initial_state: OPENED
    terminal_states: [CLOSED_RESOLVED, CLOSED_AGREED]
    transitions:
      - from: OPENED
        to: ACTIVE_PREP
        trigger: "system (automatic on first successful POST /tp/audit_cases/{auditCaseId}/attach_doc)"
        actor: system
        preconditions: []
        side_effects:
          - "doc_package_id appended to defense_doc_ids"
          - "Increments AuditCase.version by 1"
      - from: ACTIVE_PREP
        to: ACTIVE_PREP
        trigger: "POST /tp/audit_cases/{auditCaseId}/attach_doc (subsequent attachments)"
        actor: TransferPricingLead
        preconditions:
          - "DocPackage status in {APPROVED, FILED} (ERR_DOC_NOT_FINAL)"
        side_effects:
          - "doc_package_id appended to defense_doc_ids"
          - "Increments AuditCase.version by 1"
      - from: ACTIVE_PREP
        to: SUBMITTED_TO_AUTHORITY
        trigger: "POST /tp/audit_cases/{auditCaseId}/submit_response"
        actor: TransferPricingLead
        preconditions:
          - "defense_doc_ids non-empty (ERR_DEFENSE_FILE_EMPTY)"
        side_effects: ["Increments AuditCase.version by 1"]
      - from: OPENED
        to: SUBMITTED_TO_AUTHORITY
        trigger: "POST /tp/audit_cases/{auditCaseId}/submit_response"
        actor: TransferPricingLead
        preconditions:
          - "defense_doc_ids non-empty (ERR_DEFENSE_FILE_EMPTY)"
        side_effects: ["Increments AuditCase.version by 1"]
        note: "submitting directly from OPENED is legal only with a non-empty defense file; with none attached the business error ERR_DEFENSE_FILE_EMPTY (not a state error) is raised"
      - from: SUBMITTED_TO_AUTHORITY
        to: CLOSED_RESOLVED
        trigger: "POST /tp/audit_cases/{auditCaseId}/resolve (case_type == AUDIT branch)"
        actor: TransferPricingLead
        preconditions: []
        side_effects: ["Increments AuditCase.version by 1"]
      - from: SUBMITTED_TO_AUTHORITY
        to: CLOSED_AGREED
        trigger: "POST /tp/audit_cases/{auditCaseId}/resolve (case_type == APA branch)"
        actor: TransferPricingLead
        preconditions: []
        side_effects:
          - "Every IntercompanyAgreement with (provider_entity_id == entity_id OR recipient_entity_id == entity_id), status in {ACTIVE, UNDER_AMENDMENT}, and at least one calendar year y with effective_from <= y-01-01 and effective_to > y-01-01 for some y in covered_year_indexes, sets apa_locked = true (pricing locked for the APA term)"
          - "Increments AuditCase.version by 1"
        note: "branching: the same resolve trigger lands in different terminal states with divergent side-effect sets depending on case_type"

  - entity: CashPool
    initial_state: OPEN
    terminal_states: [SETTLED]
    transitions:
      - from: OPEN
        to: NETTING
        trigger: "POST /tp/cash_pools/{cashPoolId}/begin_netting"
        actor: TreasuryManager
        preconditions: []
        side_effects:
          - "netting_at_utc = current logical clock; accrue final balance-day epoch per position"
          - "Compute interest_cents per position per pool_interest_allocation (variant = interest_method)"
          - "Allocate admin_fee_cents per pool_fee_allocation (round per position, residual to largest |balance|, tie-break entity created_at ASC)"
          - "Fold pending_cents into balance_cents (pending reset to 0)"
          - "Every ICTransaction of the pool's fiscal year with settlement_status == UNSETTLED and elimination_status in {MATCHED, ELIMINATED} transitions to NETTED; provider position.balance_cents += provider_revenue_cents, recipient -= recipient_cost_cents"
          - "Increments CashPool.version by 1"
      - from: NETTING
        to: SETTLED
        trigger: "POST /tp/cash_pools/{cashPoolId}/settle"
        actor: TreasuryManager
        preconditions:
          - "Sum over positions of balance_cents == 0 after folding (ERR_POOL_NOT_ZERO_SUM)"
        side_effects:
          - "All positions status -> SETTLED; all NETTED transactions of the year -> SETTLED"
          - "Increments CashPool.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: study-refresh-stale-version
    parent_entity: BenchmarkingStudy
    write_endpoint: "POST /tp/benchmarking_studies/{benchmarkingStudyId}/refresh"
    occ_field: expected_study_version
    description: |
      Refreshing a BenchmarkingStudy whose version has advanced since the
      client last observed it is rejected. Refresh legitimately creates a new
      DRAFT study that will supersede this one, so a refresh based on a stale
      observed version would fork two competing successor lines.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: pool-sweep-stale-version
    parent_entity: CashPool
    write_endpoint: "POST /tp/cash_pools/{cashPoolId}/sweeps"
    occ_field: expected_cash_pool_version
    description: |
      Posting sweep movements against a CashPool whose version has advanced
      since the client last observed it is rejected. Sweep amounts are computed
      from observed position balances, so a sweep carrying a stale expected
      version would net against positions it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: cbcr_threshold_check
    trigger: "POST /tp/fiscal_years (at creation)"
    algorithm: threshold
    formula: |
      cbc_required = (group_revenue_eur >= CBCR_THRESHOLD_EUR)
      Boundary is INCLUSIVE: exactly 750000000 => true; 749999999 => false.
    input_set: "The FiscalYear being created"
    constants:
      CBCR_THRESHOLD_EUR: 750000000
    precision: "integer EUR comparison; no rounding"

  - name: provisional_price_calc
    trigger: "POST /tp/transactions (at booking)"
    algorithm: aggregation
    formula: |
      markup = agreement.markup_bp (snapshot at booking time)
      provisional_al_price_cents = round_half_up(cost_base_cents * (10000 + markup) / 10000)
      margin_bp = round_half_up((provider_revenue_cents - cost_base_cents) * 10000 / cost_base_cents)
      If cost_base_cents == 0 (system-created true-up adjustment): margin_bp = 0, provisional_al_price_cents = 0.
    input_set: "The ICTransaction being created + its agreement's current markup_bp"
    precision: "integer cents; round_half_up"

  - name: interquartile_range
    trigger: "POST /tp/benchmarking_studies/{id}/approve"
    algorithm: aggregation
    formula: |
      sorted = sort(comparables_bp) ascending; n = len(sorted)
      rank(p) = ceil(p * n / 100)   # nearest-rank method, 1-indexed
      p25_bp = sorted[rank(25)]; median_bp = sorted[rank(50)]; p75_bp = sorted[rank(75)]
      Example n=5 [300,400,500,600,700]: ranks 2/3/4 => 400/500/600.
    input_set: "comparables_bp of the study being approved (minimum 5 entries enforced by validation)"
    precision: "integer basis points"

  - name: true_up_calculation
    trigger: "POST /tp/true_up_runs/{id}/compute"
    algorithm: aggregation
    formula: |
      input_set = ICTransactions with elimination_status IN {MATCHED, ELIMINATED}
                  for (run.agreement_id, run.fiscal_year_id); UNMATCHED excluded
      S_cost  = sum(cost_base_cents); S_booked = sum(provider_revenue_cents)
      actual_margin_bp = round_half_up((S_booked - S_cost) * 10000 / S_cost)
      (lo, med, hi) = (agreement.pinned_p25_bp, agreement.pinned_median_bp, agreement.pinned_p75_bp)
      Range membership is INCLUSIVE: lo <= actual_margin_bp <= hi => true_up_amount_cents = 0
      Else target_bp = (agreement.true_up_method == TO_MEDIAN) ? med
                     : argmin over {lo, hi} of |x - actual_margin_bp|   # TO_RANGE_EDGE; tie breaks to lo
      target_price_cents = round_half_up(S_cost * (10000 + target_bp) / 10000)
      true_up_amount_cents = target_price_cents - S_booked   # signed; positive = recipient owes provider
    input_set: "MATCHED + ELIMINATED ICTransactions of (agreement, fiscal year); UNMATCHED excluded"
    precision: "integer cents/basis points; round_half_up at each stated step"
    variants:
      - name: to_median
        when: "agreement.true_up_method == TO_MEDIAN"
        difference: "target is the median of the interquartile range"
      - name: to_range_edge
        when: "agreement.true_up_method == TO_RANGE_EDGE"
        difference: "target is the nearest range edge; produces a smaller adjustment than TO_MEDIAN for the same data"

  - name: elimination_consolidation
    trigger: "POST /tp/fiscal_years/{id}/begin_closing (batch) and TrueUpRun post (single adjustment)"
    algorithm: chronological
    formula: |
      For each transaction entering ELIMINATED (process order: created_at ASC):
        plug_cents = provider_revenue_cents - recipient_cost_cents
        consolidated_intercompany_net_cents += (provider_revenue_cents - recipient_cost_cents - plug_cents)  # always += 0
      Invariant: consolidated_intercompany_net_cents == 0 after any elimination batch.
    input_set: "Transactions of the fiscal year with elimination_status == MATCHED at begin_closing, ordered by created_at ASC"
    precision: "integer cents"

  - name: pool_interest_allocation
    trigger: "POST /tp/cash_pools/{id}/begin_netting"
    algorithm: aggregation
    formula: |
      SPREAD = POOL_SPREAD_BP / 10000 / 365 per cent-day
      For each position (lender balances positive, borrower negative):
        variant AVERAGE_BALANCE: base = accrued_balance_day_cents
          (each sweep accrues balance_before * whole_days_since_previous_event using the logical clock;
           begin_netting accrues the final epoch balance * days(opened_or_last_sweep -> netting_at_utc))
        variant CLOSING_BALANCE: base = balance_cents * whole_days(opened_at_utc -> netting_at_utc)
        interest_cents = round_half_up(base * SPREAD)   # signed with balance: lenders +, borrowers -
      Zero-sum: sum(interest_cents) == 0 by symmetry of base signs.
    input_set: "All positions of the pool at netting"
    constants:
      POOL_SPREAD_BP: 85
    precision: "integer cents; round_half_up"
    variants:
      - name: average_balance
        when: "pool.interest_method == AVERAGE_BALANCE"
        difference: "chronological balance-day accumulation; intra-period timing of sweeps changes the result"
      - name: closing_balance
        when: "pool.interest_method == CLOSING_BALANCE"
        difference: "point-in-time closing balance * total days; ignores intra-period timing — different cents for identical sweeps"

  - name: pool_fee_allocation
    trigger: "POST /tp/cash_pools/{id}/begin_netting"
    algorithm: waterfall_allocation
    formula: |
      B = sum over positions of abs(balance_cents)   # after folding pending + transaction netting
      For each position in order entity.created_at ASC:
        fee_cents = round_half_up(admin_fee_cents * abs(balance_cents) / B)   # ROUND PER POSITION FIRST
      residual = admin_fee_cents - sum(fee_cents)   # may be positive or negative
      Assign residual to the position with the largest abs(balance_cents);
      tie-break: entity.created_at ASC (never entity id).
      Pinned rounding order: round-per-position THEN sum THEN residual; sum-then-round is the rejected alternative.
    input_set: "All positions of the pool at netting"
    precision: "integer cents; round_half_up"

  - name: pool_netting_calculation
    trigger: "POST /tp/cash_pools/{id}/begin_netting"
    algorithm: aggregation
    formula: |
      For each position: balance_cents = sweep_movement_sum + pending_cents
        + sum(provider_revenue_cents of newly-NETTED txs where entity is provider)
        - sum(recipient_cost_cents of newly-NETTED txs where entity is recipient)
      Invariant: sum over all positions of balance_cents == 0 at every step
        (sweeps are zero-sum validated; pending accruals are symmetric; tx folds are symmetric).
    input_set: "Positions + UNSETTLED transactions (elimination_status in {MATCHED, ELIMINATED}) of the pool's fiscal year"
    precision: "integer cents"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Caller role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Every path id and every body-supplied FK id exists, validated left-to-right (path first, then body fields in declared order)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints
  - priority: 4
    category: state
    check: "Target resource is in a state from which the requested transition/operation is defined"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: all action endpoints
  - priority: 5
    category: business_safety
    check: "Segregation of duties: approver/activator X-User-ID must differ from the stored creator/submitter/starter user id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST .../activate, .../approve_amendment, .../true_up_runs/{id}/approve, .../benchmarking_studies/{id}/approve, .../doc_packages/{id}/approve"
  - priority: 6
    category: business_referential
    check: "Referenced LegalEntity(ies) are ACTIVE; provider != recipient; audit-case entity ACTIVE"
    error_id: "ERR_ENTITY_INACTIVE | ERR_SAME_LEGAL_ENTITY"
    http_status: 409
    applies_to: "POST /tp/agreements, POST .../agreements/{id}/activate, POST /tp/audit_cases, POST /tp/doc_packages"
  - priority: 7
    category: business_temporal
    check: "Agreement half-open interval overlap per (provider, recipient, transaction_type); APA covered_year_indexes disjoint per entity; logical clock inside [effective_from, effective_to) at activation"
    error_id: "ERR_AGREEMENT_PERIOD_OVERLAP | ERR_APA_YEAR_OVERLAP | ERR_AGREEMENT_NOT_IN_EFFECT"
    http_status: 409
    applies_to: "POST /tp/agreements, POST .../agreements/{id}/activate, POST /tp/audit_cases"
  - priority: 8
    category: business_constraint
    check: "Study CURRENT where pinned/referenced; match tolerance <= 100 cents; pool sweep movements sum to 0; defense file non-empty; attached docs APPROVED/FILED; APA lock; structural business rules"
    error_id: "ERR_STALE_BENCHMARK | ERR_ELIMINATION_MISMATCH | ERR_POOL_NOT_ZERO_SUM | ERR_DEFENSE_FILE_EMPTY | ERR_DOC_NOT_FINAL | ERR_APA_LOCKED | ERR_AGREEMENT_NOT_ACTIVE | ERR_DUPLICATE_CASH_POOL | ERR_DUPLICATE_CBC_REPORT | ERR_ENTITY_HAS_ACTIVE_AGREEMENTS | ERR_AGREEMENT_HAS_OPEN_TRANSACTIONS | ERR_NO_ELIMINATED_TRANSACTIONS | ERR_YEAR_HAS_OPEN_TRANSACTIONS | ERR_YEAR_HAS_OPEN_TRUE_UPS"
    http_status: 409
    applies_to: various
  - priority: 9
    category: business_fiscal
    check: "Fiscal/filing obligations: year must be CLOSING for true-up approve/post; year not CLOSED for booking/filing; CBC filing presence/obligation"
    error_id: "ERR_YEAR_NOT_CLOSING | ERR_BOOKS_CLOSED | ERR_CBC_NOT_REQUIRED | ERR_CBC_FILING_MISSING"
    http_status: 409
    applies_to: "true-up approve/post, transaction create, doc file, fiscal-year close"
  - priority: 10
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, amounts positive where required, comparables_bp >= 5 entries, LOCAL_FILE requires entity_id and MASTER_FILE/CBC_REPORT forbid it"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all POST endpoints
    note: "Shape/field validation is lowest priority: a request that fails both a business rule and a shape rule surfaces the business error first when the offending field is parseable; truly unparseable bodies short-circuit as ERR_INVALID_REQUEST before priority 4."

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving; default 2026-08-01T00:00:00Z) ---
  - method: POST
    path: "/tp/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call, the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [GroupTaxAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Logical clock advanced (monotonic; setting backwards is ERR_INVALID_REQUEST)"]

  # --- FiscalYear ---
  - method: POST
    path: "/tp/fiscal_years"
    description: "Create a fiscal year; computes cbc_required from group_revenue_eur (>= 750000000, inclusive)"
    roles: [GroupTaxAdmin]
    code: 201
    input: [year_index, group_revenue_eur]
    output: FiscalYear
    side_effects: ["status = OPEN; cbc_required computed; ERR_INVALID_REQUEST on duplicate year_index"]
  - method: GET
    path: "/tp/fiscal_years/{fiscalYearId}"
    description: "Get a fiscal year"
    roles: [GroupTaxAdmin, TaxAnalyst, TaxManager, TransferPricingLead, TreasuryManager]
    code: 200
    input: []
    output: FiscalYear
    side_effects: []
  - method: POST
    path: "/tp/fiscal_years/{fiscalYearId}/begin_closing"
    description: "OPEN -> CLOSING; auto-eliminates all MATCHED transactions of the year"
    roles: [GroupTaxAdmin]
    code: 200
    input: []
    output: FiscalYear
    side_effects: ["MATCHED transactions -> ELIMINATED with plug booking; consolidated_intercompany_net_cents recomputed; version + 1"]
  - method: POST
    path: "/tp/fiscal_years/{fiscalYearId}/close"
    description: "CLOSING -> CLOSED; cascades benchmark staleness and agreement pricing_review flags"
    roles: [GroupTaxAdmin]
    code: 200
    input: []
    output: FiscalYear
    side_effects: ["studies vintage <= year_index - 2 -> STALE; pinned agreements -> pricing_review_required = true; closed_at set; version + 1"]

  # --- LegalEntity ---
  - method: POST
    path: "/tp/legal_entities"
    description: "Create a legal entity"
    roles: [GroupTaxAdmin]
    code: 201
    input: [name, country_code, functional_currency]
    output: LegalEntity
    side_effects: ["status = ACTIVE"]
  - method: GET
    path: "/tp/legal_entities/{legalEntityId}"
    description: "Get a legal entity"
    roles: [GroupTaxAdmin, TaxAnalyst, TaxManager, TransferPricingLead, TreasuryManager]
    code: 200
    input: []
    output: LegalEntity
    side_effects: []
  - method: POST
    path: "/tp/legal_entities/{legalEntityId}/deactivate"
    description: "ACTIVE -> INACTIVE; blocked by ACTIVE/UNDER_AMENDMENT agreements"
    roles: [GroupTaxAdmin]
    code: 200
    input: []
    output: LegalEntity
    side_effects: ["version + 1"]

  # --- IntercompanyAgreement ---
  - method: POST
    path: "/tp/agreements"
    description: "Create a DRAFT intercompany agreement; validates entity existence/status/distinctness and half-open interval overlap vs {DRAFT, ACTIVE, UNDER_AMENDMENT}"
    roles: [TaxAnalyst]
    code: 201
    input: [provider_entity_id, recipient_entity_id, transaction_type, pricing_method, markup_bp, true_up_method, benchmarking_study_id, effective_from, effective_to]
    output: IntercompanyAgreement
    side_effects: ["status = DRAFT; created_by_user_id = X-User-ID"]
  - method: GET
    path: "/tp/agreements/{agreementId}"
    description: "Get an agreement"
    roles: [GroupTaxAdmin, TaxAnalyst, TaxManager, TransferPricingLead, TreasuryManager]
    code: 200
    input: []
    output: IntercompanyAgreement
    side_effects: []
  - method: GET
    path: "/tp/agreements"
    description: "List agreements with optional filters (FK reverse-reachability for provider/recipient/pinned study)"
    roles: [GroupTaxAdmin, TaxAnalyst, TaxManager, TransferPricingLead, TreasuryManager]
    code: 200
    input: ["provider_entity_id?", "recipient_entity_id?", "pinned_study_id?", "benchmarking_study_id?", "status?"]
    output: IntercompanyAgreement[]
    side_effects: []
  - method: POST
    path: "/tp/agreements/{agreementId}/activate"
    description: "DRAFT -> ACTIVE; pins the benchmarking study and range snapshot; segregation vs creator"
    roles: [TaxManager]
    code: 200
    input: []
    output: IntercompanyAgreement
    side_effects: ["pinned_study_id + pinned range snapshot set; version + 1"]
  - method: POST
    path: "/tp/agreements/{agreementId}/start_amendment"
    description: "ACTIVE -> UNDER_AMENDMENT; stores pending markup/study"
    roles: [TaxAnalyst]
    code: 200
    input: [new_markup_bp, "new_benchmarking_study_id?"]
    output: IntercompanyAgreement
    side_effects: ["pending_* + amendment_started_by_user_id set; version + 1"]
  - method: POST
    path: "/tp/agreements/{agreementId}/approve_amendment"
    description: "UNDER_AMENDMENT -> ACTIVE; applies pending changes; segregation vs amendment starter"
    roles: [TaxManager]
    code: 200
    input: []
    output: IntercompanyAgreement
    side_effects: ["markup_bp / pins updated; amendments_count + 1; pricing_review_required = false; version + 1"]
  - method: POST
    path: "/tp/agreements/{agreementId}/discard_amendment"
    description: "UNDER_AMENDMENT -> ACTIVE without applying pending changes"
    roles: [TaxAnalyst]
    code: 200
    input: []
    output: IntercompanyAgreement
    side_effects: ["pending_* cleared; version + 1"]
  - method: POST
    path: "/tp/agreements/{agreementId}/terminate"
    description: "ACTIVE -> TERMINATED; blocked by APA lock or uneliminated transactions"
    roles: [TaxManager]
    code: 200
    input: []
    output: IntercompanyAgreement
    side_effects: ["version + 1"]

  # --- ICTransaction ---
  - method: POST
    path: "/tp/transactions"
    description: "Book an intercompany transaction (UNMATCHED / UNSETTLED); computes provisional price + margin"
    roles: [TaxAnalyst]
    code: 201
    input: [agreement_id, fiscal_year_id, cost_base_cents, provider_revenue_cents, recipient_cost_cents]
    output: ICTransaction
    side_effects: ["provisional_al_price_cents, margin_bp computed from agreement's current markup_bp"]
  - method: GET
    path: "/tp/transactions/{transactionId}"
    description: "Get a transaction"
    roles: [GroupTaxAdmin, TaxAnalyst, TaxManager, TransferPricingLead, TreasuryManager]
    code: 200
    input: []
    output: ICTransaction
    side_effects: []
  - method: GET
    path: "/tp/transactions"
    description: "List transactions with filters (FK reverse-reachability for agreement / fiscal year / origin run)"
    roles: [GroupTaxAdmin, TaxAnalyst, TaxManager, TransferPricingLead, TreasuryManager]
    code: 200
    input: ["agreement_id?", "fiscal_year_id?", "origin_run_id?", "elimination_status?", "settlement_status?"]
    output: ICTransaction[]
    side_effects: []
  - method: POST
    path: "/tp/transactions/{transactionId}/match"
    description: "UNMATCHED -> MATCHED when both sides' booked amounts agree within 100 cents"
    roles: [TaxAnalyst]
    code: 200
    input: []
    output: ICTransaction
    side_effects: ["matched_by_user_id set; version + 1"]

  # --- TrueUpRun ---
  - method: POST
    path: "/tp/true_up_runs"
    description: "Create a DRAFT true-up run for (agreement, fiscal year)"
    roles: [TaxAnalyst]
    code: 201
    input: [agreement_id, fiscal_year_id]
    output: TrueUpRun
    side_effects: ["status = DRAFT; created_by_user_id = X-User-ID"]
  - method: GET
    path: "/tp/true_up_runs/{trueUpRunId}"
    description: "Get a true-up run"
    roles: [GroupTaxAdmin, TaxAnalyst, TaxManager, TransferPricingLead, TreasuryManager]
    code: 200
    input: []
    output: TrueUpRun
    side_effects: []
  - method: GET
    path: "/tp/true_up_runs"
    description: "List true-up runs with filters (FK reverse-reachability)"
    roles: [GroupTaxAdmin, TaxAnalyst, TaxManager, TransferPricingLead, TreasuryManager]
    code: 200
    input: ["agreement_id?", "fiscal_year_id?", "adjustment_transaction_id?", "status?"]
    output: TrueUpRun[]
    side_effects: []
  - method: POST
    path: "/tp/true_up_runs/{trueUpRunId}/compute"
    description: "DRAFT -> COMPUTED; runs true_up_calculation over MATCHED+ELIMINATED transactions"
    roles: [TaxAnalyst]
    code: 200
    input: []
    output: TrueUpRun
    side_effects: ["actual_margin_bp, true_up_amount_cents set; version + 1"]
  - method: POST
    path: "/tp/true_up_runs/{trueUpRunId}/recompute"
    description: "COMPUTED -> DRAFT; clears computed fields so compute can run again (cyclic loop)"
    roles: [TaxAnalyst]
    code: 200
    input: []
    output: TrueUpRun
    side_effects: ["actual_margin_bp, true_up_amount_cents reset to null; version + 1"]
  - method: POST
    path: "/tp/true_up_runs/{trueUpRunId}/approve"
    description: "COMPUTED -> APPROVED; requires fiscal year CLOSING; segregation vs creator"
    roles: [TaxManager]
    code: 200
    input: []
    output: TrueUpRun
    side_effects: ["approved_by_user_id set; version + 1"]
  - method: POST
    path: "/tp/true_up_runs/{trueUpRunId}/post"
    description: "APPROVED -> POSTED; creates + auto-eliminates adjustment transaction; accrues pending into open cash pool"
    roles: [TaxManager]
    code: 200
    input: []
    output: TrueUpRun
    side_effects: ["adjustment ICTransaction created (skip when amount == 0); adjustment auto-ELIMINATED; pool positions pending_cents accrued; version + 1"]

  # --- BenchmarkingStudy ---
  - method: POST
    path: "/tp/benchmarking_studies"
    description: "Create a DRAFT benchmarking study (comparables inventory)"
    roles: [TaxAnalyst]
    code: 201
    input: [transaction_type, region, vintage_year, comparables_bp]
    output: BenchmarkingStudy
    side_effects: ["status = DRAFT; created_by_user_id = X-User-ID"]
  - method: GET
    path: "/tp/benchmarking_studies/{benchmarkingStudyId}"
    description: "Get a benchmarking study"
    roles: [GroupTaxAdmin, TaxAnalyst, TaxManager, TransferPricingLead, TreasuryManager]
    code: 200
    input: []
    output: BenchmarkingStudy
    side_effects: []
  - method: GET
    path: "/tp/benchmarking_studies"
    description: "List benchmarking studies with filters (FK reverse-reachability for supersedes_study_id)"
    roles: [GroupTaxAdmin, TaxAnalyst, TaxManager, TransferPricingLead, TreasuryManager]
    code: 200
    input: ["supersedes_study_id?", "status?", "transaction_type?"]
    output: BenchmarkingStudy[]
    side_effects: []
  - method: POST
    path: "/tp/benchmarking_studies/{benchmarkingStudyId}/approve"
    description: "DRAFT -> CURRENT; computes nearest-rank p25/median/p75; supersedes parent study if refreshed"
    roles: [TransferPricingLead]
    code: 200
    input: []
    output: BenchmarkingStudy
    side_effects: ["p25_bp/median_bp/p75_bp computed; superseded study -> SUPERSEDED; version + 1"]
  - method: POST
    path: "/tp/benchmarking_studies/{benchmarkingStudyId}/refresh"
    description: "Create a successor DRAFT study from a CURRENT or STALE study (comparables refresh); OCC-guarded on expected_study_version"
    roles: [TransferPricingLead]
    code: 201
    input: [comparables_bp, expected_study_version]
    output: BenchmarkingStudy
    side_effects: ["new DRAFT study with supersedes_study_id = this study; increments BenchmarkingStudy.version by 1 on the refreshed study"]

  # --- DocPackage ---
  - method: POST
    path: "/tp/doc_packages"
    description: "Create a DRAFT documentation package (master file / local file / CbC report); at most one CBC_REPORT per fiscal year"
    roles: [TaxAnalyst]
    code: 201
    input: [fiscal_year_id, doc_type, "entity_id?"]
    output: DocPackage
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/tp/doc_packages/{docPackageId}"
    description: "Get a documentation package"
    roles: [GroupTaxAdmin, TaxAnalyst, TaxManager, TransferPricingLead, TreasuryManager]
    code: 200
    input: []
    output: DocPackage
    side_effects: []
  - method: GET
    path: "/tp/doc_packages"
    description: "List documentation packages with filters (FK reverse-reachability)"
    roles: [GroupTaxAdmin, TaxAnalyst, TaxManager, TransferPricingLead, TreasuryManager]
    code: 200
    input: ["fiscal_year_id?", "entity_id?", "doc_type?", "status?"]
    output: DocPackage[]
    side_effects: []
  - method: POST
    path: "/tp/doc_packages/{docPackageId}/submit"
    description: "DRAFT -> SUBMITTED; records submitter for segregation of duties"
    roles: [TaxAnalyst]
    code: 200
    input: []
    output: DocPackage
    side_effects: ["submitted_by_user_id = X-User-ID; version + 1"]
  - method: POST
    path: "/tp/doc_packages/{docPackageId}/approve"
    description: "SUBMITTED -> APPROVED; approver must differ from submitter"
    roles: [TaxManager]
    code: 200
    input: []
    output: DocPackage
    side_effects: ["approved_by_user_id set; version + 1"]
  - method: POST
    path: "/tp/doc_packages/{docPackageId}/file"
    description: "APPROVED -> FILED; enforces CbC obligation, books-open, and fresh-benchmark preconditions"
    roles: [TaxManager]
    code: 200
    input: []
    output: DocPackage
    side_effects: ["filed_at set; version + 1"]

  # --- AuditCase ---
  - method: POST
    path: "/tp/audit_cases"
    description: "Open an audit defense case or APA case; APA covered years must be disjoint per entity"
    roles: [TransferPricingLead]
    code: 201
    input: [entity_id, case_type, authority_country, "covered_year_indexes?"]
    output: AuditCase
    side_effects: ["status = OPENED"]
  - method: GET
    path: "/tp/audit_cases/{auditCaseId}"
    description: "Get an audit case"
    roles: [GroupTaxAdmin, TaxAnalyst, TaxManager, TransferPricingLead, TreasuryManager]
    code: 200
    input: []
    output: AuditCase
    side_effects: []
  - method: GET
    path: "/tp/audit_cases"
    description: "List audit cases with filters (FK reverse-reachability)"
    roles: [GroupTaxAdmin, TaxAnalyst, TaxManager, TransferPricingLead, TreasuryManager]
    code: 200
    input: ["entity_id?", "case_type?", "status?"]
    output: AuditCase[]
    side_effects: []
  - method: POST
    path: "/tp/audit_cases/{auditCaseId}/attach_doc"
    description: "Attach an APPROVED/FILED doc package to the defense file; first attachment auto-advances OPENED -> ACTIVE_PREP"
    roles: [TransferPricingLead]
    code: 200
    input: [doc_package_id]
    output: AuditCase
    side_effects: ["defense_doc_ids appended; OPENED -> ACTIVE_PREP on first attach; version + 1"]
  - method: POST
    path: "/tp/audit_cases/{auditCaseId}/submit_response"
    description: "OPENED|ACTIVE_PREP -> SUBMITTED_TO_AUTHORITY; requires non-empty defense file"
    roles: [TransferPricingLead]
    code: 200
    input: []
    output: AuditCase
    side_effects: ["version + 1"]
  - method: POST
    path: "/tp/audit_cases/{auditCaseId}/resolve"
    description: "SUBMITTED_TO_AUTHORITY -> CLOSED_RESOLVED (AUDIT) or CLOSED_AGREED (APA, locks covered agreements' pricing)"
    roles: [TransferPricingLead]
    code: 200
    input: []
    output: AuditCase
    side_effects: ["APA branch sets apa_locked = true on covered agreements; version + 1"]

  # --- CashPool ---
  - method: POST
    path: "/tp/cash_pools"
    description: "Create the cash pool for a fiscal year (at most one per year)"
    roles: [TreasuryManager]
    code: 201
    input: [fiscal_year_id, interest_method, admin_fee_cents]
    output: CashPool
    side_effects: ["status = OPEN; positions = []; opened_at_utc = logical clock"]
  - method: GET
    path: "/tp/cash_pools/{cashPoolId}"
    description: "Get a cash pool including its positions array"
    roles: [GroupTaxAdmin, TaxAnalyst, TaxManager, TransferPricingLead, TreasuryManager]
    code: 200
    input: []
    output: CashPool
    side_effects: []
  - method: GET
    path: "/tp/cash_pools"
    description: "List cash pools with filters (FK reverse-reachability for fiscal_year_id)"
    roles: [GroupTaxAdmin, TaxAnalyst, TaxManager, TransferPricingLead, TreasuryManager]
    code: 200
    input: ["fiscal_year_id?"]
    output: CashPool[]
    side_effects: []
  - method: POST
    path: "/tp/cash_pools/{cashPoolId}/sweeps"
    description: "Post zero-sum sweep movements; upserts positions; OCC-guarded on expected_cash_pool_version"
    roles: [TreasuryManager]
    code: 200
    input: [movements, expected_cash_pool_version]
    output: CashPool
    side_effects: ["positions upserted (balance_cents += amount; balance-day accrual per sweep); increments CashPool.version by 1"]
  - method: POST
    path: "/tp/cash_pools/{cashPoolId}/begin_netting"
    description: "OPEN -> NETTING; computes interest + fee allocation, folds pending and UNSETTLED transactions into positions"
    roles: [TreasuryManager]
    code: 200
    input: []
    output: CashPool
    side_effects: ["interest_cents + fee_cents computed; pending folded; UNSETTLED transactions of the year -> NETTED; version + 1"]
  - method: POST
    path: "/tp/cash_pools/{cashPoolId}/settle"
    description: "NETTING -> SETTLED; requires zero-sum positions; settles positions and NETTED transactions"
    roles: [TreasuryManager]
    code: 200
    input: []
    output: CashPool
    side_effects: ["positions SETTLED; NETTED transactions -> SETTLED; version + 1"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role not in endpoint's roles" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, invalid enum, non-positive amount, comparables_bp < 5 entries, LOCAL_FILE without entity_id, MASTER_FILE/CBC_REPORT with entity_id, duplicate year_index, clock set backwards" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK id does not exist" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Resource not in a state from which the requested transition is defined (also: action on terminal resource)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Approver/activator X-User-ID equals the stored creator/submitter/starter user id" }
  - { id: ERR_ENTITY_INACTIVE, http: 409, condition: "Referenced LegalEntity is INACTIVE where ACTIVE is required" }
  - { id: ERR_SAME_LEGAL_ENTITY, http: 409, condition: "provider_entity_id == recipient_entity_id on agreement create" }
  - { id: ERR_ENTITY_HAS_ACTIVE_AGREEMENTS, http: 409, condition: "Deactivate blocked: entity referenced by an agreement in {ACTIVE, UNDER_AMENDMENT}" }
  - { id: ERR_AGREEMENT_PERIOD_OVERLAP, http: 409, condition: "Half-open [effective_from, effective_to) interval collides with another agreement of same (provider, recipient, transaction_type) in the checked state set; adjacency (to == from) is allowed" }
  - { id: ERR_AGREEMENT_NOT_IN_EFFECT, http: 409, condition: "Logical clock date outside [effective_from, effective_to) at activation" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Transaction booking against an agreement not in ACTIVE" }
  - { id: ERR_AGREEMENT_HAS_OPEN_TRANSACTIONS, http: 409, condition: "Terminate blocked: agreement has transactions with elimination_status != ELIMINATED" }
  - { id: ERR_APA_LOCKED, http: 409, condition: "Amendment/termination blocked by an AGREED APA covering this agreement" }
  - { id: ERR_STALE_BENCHMARK, http: 409, condition: "Referenced/pinned benchmarking study not CURRENT where freshness is required, or local-file filing while an ACTIVE agreement of the entity has pricing_review_required" }
  - { id: ERR_ELIMINATION_MISMATCH, http: 409, condition: "abs(provider_revenue_cents - recipient_cost_cents) > 100 at match" }
  - { id: ERR_NO_ELIMINATED_TRANSACTIONS, http: 409, condition: "True-up compute with empty input set (no MATCHED/ELIMINATED transactions for agreement+year)" }
  - { id: ERR_YEAR_NOT_CLOSING, http: 409, condition: "True-up approve/post requires fiscal year in CLOSING" }
  - { id: ERR_YEAR_HAS_OPEN_TRANSACTIONS, http: 409, condition: "Year close blocked by transactions with elimination_status != ELIMINATED" }
  - { id: ERR_YEAR_HAS_OPEN_TRUE_UPS, http: 409, condition: "Year close blocked by TrueUpRuns not in POSTED" }
  - { id: ERR_BOOKS_CLOSED, http: 409, condition: "Mutation targets a CLOSED fiscal year (booking transactions, filing docs)" }
  - { id: ERR_CBC_NOT_REQUIRED, http: 409, condition: "Filing a CBC_REPORT for a fiscal year whose cbc_required is false" }
  - { id: ERR_CBC_FILING_MISSING, http: 409, condition: "Year close blocked: cbc_required but no FILED CBC_REPORT package" }
  - { id: ERR_DUPLICATE_CBC_REPORT, http: 409, condition: "Second CBC_REPORT DocPackage for the same fiscal year" }
  - { id: ERR_DOC_NOT_FINAL, http: 409, condition: "attach_doc with a DocPackage not in {APPROVED, FILED}" }
  - { id: ERR_DEFENSE_FILE_EMPTY, http: 409, condition: "submit_response with empty defense_doc_ids" }
  - { id: ERR_APA_YEAR_OVERLAP, http: 409, condition: "APA covered_year_indexes intersect another APA case for the same entity in status {OPENED, ACTIVE_PREP, SUBMITTED_TO_AUTHORITY, CLOSED_AGREED}" }
  - { id: ERR_POOL_NOT_ZERO_SUM, http: 409, condition: "Sweep movements do not sum to 0, or pool positions not zero-sum at settle" }
  - { id: ERR_DUPLICATE_CASH_POOL, http: 409, condition: "Second cash pool for the same fiscal year" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: GroupTaxAdmin
    description: "Group tax operations owner: fiscal years, legal entities, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /tp/_clock/set_current_utc"
      - "POST /tp/fiscal_years"
      - "POST /tp/fiscal_years/{id}/begin_closing"
      - "POST /tp/fiscal_years/{id}/close"
      - "POST /tp/legal_entities"
      - "POST /tp/legal_entities/{id}/deactivate"
    shared_operations:
      - "All GET endpoints"
  - name: TaxAnalyst
    description: "Preparer: drafts agreements, books and matches transactions, drafts true-up runs, benchmarking studies and documentation packages"
    identity: opaque
    exclusive_operations:
      - "POST /tp/agreements"
      - "POST /tp/agreements/{id}/start_amendment"
      - "POST /tp/agreements/{id}/discard_amendment"
      - "POST /tp/transactions"
      - "POST /tp/transactions/{id}/match"
      - "POST /tp/true_up_runs"
      - "POST /tp/true_up_runs/{id}/compute"
      - "POST /tp/true_up_runs/{id}/recompute"
      - "POST /tp/benchmarking_studies"
      - "POST /tp/doc_packages"
      - "POST /tp/doc_packages/{id}/submit"
    shared_operations:
      - "All GET endpoints"
  - name: TaxManager
    description: "Reviewer/approver: activates and terminates agreements, approves amendments and true-ups, approves and files documentation; never approves own submissions (segregation of duties vs TaxAnalyst creator)"
    identity: opaque
    exclusive_operations:
      - "POST /tp/agreements/{id}/activate"
      - "POST /tp/agreements/{id}/approve_amendment"
      - "POST /tp/agreements/{id}/terminate"
      - "POST /tp/true_up_runs/{id}/approve"
      - "POST /tp/true_up_runs/{id}/post"
      - "POST /tp/doc_packages/{id}/approve"
      - "POST /tp/doc_packages/{id}/file"
    shared_operations:
      - "All GET endpoints"
  - name: TransferPricingLead
    description: "TP specialist: approves and refreshes benchmarking studies, owns audit defense files and APA negotiations"
    identity: opaque
    exclusive_operations:
      - "POST /tp/benchmarking_studies/{id}/approve"
      - "POST /tp/benchmarking_studies/{id}/refresh"
      - "POST /tp/audit_cases"
      - "POST /tp/audit_cases/{id}/attach_doc"
      - "POST /tp/audit_cases/{id}/submit_response"
      - "POST /tp/audit_cases/{id}/resolve"
    shared_operations:
      - "All GET endpoints"
  - name: TreasuryManager
    description: "Treasury operator: cash pool lifecycle, sweeps, netting, settlement"
    identity: opaque
    exclusive_operations:
      - "POST /tp/cash_pools"
      - "POST /tp/cash_pools/{id}/sweeps"
      - "POST /tp/cash_pools/{id}/begin_netting"
      - "POST /tp/cash_pools/{id}/settle"
    shared_operations:
      - "All GET endpoints"
