scaffold_difficulty_design:
  # ==========================================================================
  # Rule 1 — dual_variant_calc (>=2 instances, different entity domains)
  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: sso_volume_provisional_vs_final
        grounds:
          - calculations.sso_volume_estimate
          - entities.SsoEvent.fields.estimated_volume_gal
          - state_machines.SsoEvent.OPEN_to_CONTAINED
          - state_machines.SsoEvent.REPORT_DRAFT_to_REPORT_SUBMITTED
        distinguishing_aspect: |
          SsoEvent.estimated_volume_gal is computed twice from the same incident data: once at
          CONTAINED using firm_capacity_available_gpm at stopped_at (provisional variant) and once
          again at REPORT_SUBMITTED using firm_capacity_available_gpm at submission time (final
          variant). When a Pump status change mutates firm capacity between the two timestamps,
          the two computations return different numbers for the SAME SsoEvent — the entity domain
          is SsoEvent/compliance.
        test_recipe:
          setup:
            - "Station LS-1001 with design_capacity_gpm=500, pump_count=2, has_backup_generator=true, wet_well_volume_gal=5000, posture=NORMAL"
            - "Two Pump rows at LS-1001 (position 1 and 2), both IN_SERVICE, each rated_gpm=300 -> firm_capacity_available_gpm = 600 - 300 = 300"
            - "Logical clock set to 2026-08-01T00:00:00Z"
            - "SsoEvent S1 created at started_at=2026-08-01T00:00:00Z, reached_surface_water=false"
            - "S1 contained at 2026-08-01T02:00:00Z -> duration 120 min, firm_capacity=300 -> provisional volume = 120 * 300 = 36000 gal"
            - "Pump P2 transitioned IN_SERVICE -> OUT_OF_SERVICE at 2026-08-01T03:00:00Z -> firm_capacity_available_gpm recomputed = 300 - 300 = 0 (only one IN_SERVICE, largest = its own 300; total 300 - largest 300 = 0)"
            - "Report drafted at 2026-08-01T04:00:00Z"
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-1001", service_zone: "Z1", design_capacity_gpm: 500, pump_count: 2, has_backup_generator: true, wet_well_volume_gal: 5000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id, st_v: $.data.version }
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "${st_id}", position_index: 1, rated_gpm: 300, status: "IN_SERVICE" }
              as: UtilityAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "${st_id}", position_index: 2, rated_gpm: 300, status: "IN_SERVICE" }
              as: UtilityAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /lift-station-ops/stations/${st_id}/sso-events"
              payload: { started_at: "2026-08-01T00:00:00Z", cause_code: "GREASE_BLOCKAGE", reached_surface_water: false, expected_station_version: "${st_v}" }
              as: UtilityAdmin
              captures: { sso_id: $.data.id }
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T02:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/sso-events/${sso_id}/contain"
              payload: {}
              as: Operator
              captures: { provisional_vol: $.data.estimated_volume_gal }
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T03:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/pumps/${p2_id}/mark-out-of-service"
              payload: {}
              as: OperationsSupervisor
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T04:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/sso-events/${sso_id}/draft-report"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /lift-station-ops/sso-events/${sso_id}/submit-report"
              payload: {}
              as: ComplianceOfficer
              captures: { final_vol: $.data.estimated_volume_gal }
          assert:
            - "provisional_vol == 36000"
            - "final_vol == 0 (firm_capacity_available_gpm recomputed to 0 because only 1 IN_SERVICE pump remains; 300 - 300 = 0; 120 min * 0 = 0)"
            - "provisional_vol != final_vol"
            - "SsoEvent.${sso_id}.estimated_volume_gal == final_vol after submission"

      - name: grease_accumulation_calendar_vs_operating
        grounds:
          - calculations.grease_accumulation_rate
          - entities.WetWellCleaning.fields.grease_depth_inches_post
        distinguishing_aspect: |
          WetWellCleaning.grease_accumulation_rate is computed twice for the same station history:
          by_calendar_days uses calendar days between first and last completed_at; by_operating_days
          uses operating-day count from runtime telemetry. For stations where operating days are
          fewer than calendar days, the two variants return different rates for the SAME station
          history — the entity domain is WetWellCleaning/maintenance (distinct from SsoEvent/compliance).
        test_recipe:
          setup:
            - "Station LS-2001 with wet_well_volume_gal=4000, posture=NORMAL"
            - "Cleaning C1 completed at 2026-08-01T00:00:00Z with grease_depth_inches_pre=4.0, grease_depth_inches_post=0.5"
            - "Cleaning C2 completed at 2026-08-11T00:00:00Z with grease_depth_inches_pre=5.0, grease_depth_inches_post=0.5"
            - "calendar variant: total_inches=5.0 (skip baseline), days=10, rate=0.5 in/day"
            - "operating variant: total_inches=5.0, operating_days=8 (station runs 5 days/week, weekend down) -> rate=0.625 in/day"
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-31T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-2001", service_zone: "Z2", design_capacity_gpm: 400, pump_count: 2, has_backup_generator: false, wet_well_volume_gal: 4000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id }
            - call: "POST /lift-station-ops/operators"
              payload: { employee_code: "OP-1001", full_name: "Crew Lead", certifications: ["CSE_1"], home_zone: "Z2" }
              as: UtilityAdmin
              captures: { op_lead: $.data.id }
            - call: "POST /lift-station-ops/stations/${st_id}/wet-well-cleanings"
              payload: { scheduled_for: "2026-08-01T00:00:00Z", grease_depth_inches_pre: 4.0, crew_lead_operator_id: "${op_lead}", requires_confined_space_entry: false }
              as: MaintenancePlanner
              captures: { c1_id: $.data.id }
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/wet-well-cleanings/${c1_id}/start"
              payload: {}
              as: Operator
            - call: "POST /lift-station-ops/wet-well-cleanings/${c1_id}/complete"
              payload: { grease_depth_inches_post: 0.5 }
              as: Operator
            - call: "POST /lift-station-ops/stations/${st_id}/wet-well-cleanings"
              payload: { scheduled_for: "2026-08-11T00:00:00Z", grease_depth_inches_pre: 5.0, crew_lead_operator_id: "${op_lead}", requires_confined_space_entry: false }
              as: MaintenancePlanner
              captures: { c2_id: $.data.id }
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/wet-well-cleanings/${c2_id}/start"
              payload: {}
              as: Operator
            - call: "POST /lift-station-ops/wet-well-cleanings/${c2_id}/complete"
              payload: { grease_depth_inches_post: 0.5 }
              as: Operator
          trigger:
            - call: "GET /lift-station-ops/stations/${st_id}/summary"
              payload: {}
              as: OperationsSupervisor
              captures: { cal_rate: $.data.grease_accumulation_rate_inches_per_day }
          assert:
            - "cal_rate == 0.5 (calendar-day variant: 5.0 inches / 10 days)"
            - "by_operating_days variant would return 0.625 (5.0 / 8 operating days) — divergent from calendar variant on the same station history"

  # ==========================================================================
  # Rule 2 — combinatorial_formula (>=2 instances, different modes a/b/c)
  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: capital_risk_score_multi_input_formula
        grounds:
          - calculations.capital_risk_score
          - entities.CapitalProject.fields.risk_score
        distinguishing_aspect: |
          Mode (a): formula with >=3 inputs and non-linear interaction. capital_risk_score
          combines consequence_of_failure * likelihood_of_failure (multiplicative base),
          recency_bonus (conditional on last_sso_occurred_at within 365 days), resilience_bonus
          (conditional on has_backup_generator), and age_score (capped at 25 via nested min with
          floor). Four conditional branches, one nested min — same inputs can land anywhere in
          [2, 100] with non-linear jumps at each branch.
        test_recipe:
          setup:
            - "Station LS-3001 created 2024-08-01 (~2 years old at test time), has_backup_generator=false"
            - "SsoEvent at LS-3001 started_at 2026-07-01T00:00:00Z (within 365 days of test date 2026-08-01)"
            - "SSO contained and closed (transitions through REPORT_ACCEPTED and CLOSED)"
            - "CapitalPlan 2027 with budget_total_usd=1000000"
            - "CapitalProject with consequence_of_failure=8, likelihood_of_failure=7, estimated_cost_usd=50000"
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2024-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-3001", service_zone: "Z3", design_capacity_gpm: 600, pump_count: 3, has_backup_generator: false, wet_well_volume_gal: 8000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id, st_v: $.data.version }
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations/${st_id}/sso-events"
              payload: { started_at: "2026-07-01T00:00:00Z", cause_code: "PUMP_FAILURE", reached_surface_water: false, expected_station_version: "${st_v}" }
              as: UtilityAdmin
              captures: { sso_id: $.data.id }
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T02:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/sso-events/${sso_id}/contain"
              payload: {}
              as: Operator
            - call: "POST /lift-station-ops/sso-events/${sso_id}/draft-report"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /lift-station-ops/sso-events/${sso_id}/submit-report"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /lift-station-ops/sso-events/${sso_id}/accept-report"
              payload: {}
              as: RegulatorPortal
            - call: "POST /lift-station-ops/sso-events/${sso_id}/close"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/capital-plans"
              payload: { plan_year: 2027, budget_total_usd: 1000000 }
              as: CapitalProgramManager
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /lift-station-ops/capital-projects"
              payload: { plan_id: "${plan_id}", station_id: "${st_id}", project_name: "Pump rebuild", estimated_cost_usd: 50000, consequence_of_failure: 8, likelihood_of_failure: 7 }
              as: CapitalProgramManager
              captures: { proj_id: $.data.id, risk: $.data.risk_score }
          assert:
            - "risk == 100.00 (base=56 + recency=15 + resilience=10 + age_score=25 -> capped at 100)"
            - "CapitalProject.${proj_id}.risk_score == 100.00"

      - name: callout_score_tiebreak_determinism
        grounds:
          - calculations.operator_callout_selection
          - entities.Operator.fields.consecutive_callouts_24h
        distinguishing_aspect: |
          Mode (c): circular-looking dependency with pinned evaluation order. operator_callout_selection
          computes a per-operator score from three terms (zone_match + load_score + fairness_score),
          the winner selection feeds back into Operator.active_ticket_count and
          Operator.consecutive_callouts_24h (which appear in the score). The scaffold pins the
          evaluation order: scores computed from CURRENT state, winner selected, then counters
          incremented. Ties resolved by created_at ASC (never id).
        test_recipe:
          setup:
            - "Station LS-4001 in service_zone=Z1"
            - "Operator A: home_zone=Z1, created first (earlier created_at), consecutive_callouts_24h=0, active_ticket_count=0 -> score 100 + 0 + 0 = 100"
            - "Operator B: home_zone=Z1, created second, consecutive_callouts_24h=0, active_ticket_count=0 -> score 100"
            - "Both have COLLECTIONS_2 certification"
            - "AlarmTicket ACKED with alarm_class=MAJOR (does not require COLLECTIONS_2 cert but accepts it)"
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-4001", service_zone: "Z1", design_capacity_gpm: 300, pump_count: 2, has_backup_generator: false, wet_well_volume_gal: 3000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id }
            - call: "POST /lift-station-ops/operators"
              payload: { employee_code: "OP-4001", full_name: "Alice", certifications: ["CSE_1", "COLLECTIONS_2"], home_zone: "Z1" }
              as: UtilityAdmin
              captures: { op_a: $.data.id }
            - call: "POST /lift-station-ops/operators"
              payload: { employee_code: "OP-4002", full_name: "Bob", certifications: ["CSE_1", "COLLECTIONS_2"], home_zone: "Z1" }
              as: UtilityAdmin
              captures: { op_b: $.data.id }
            - call: "POST /lift-station-ops/stations/${st_id}/alarm-tickets"
              payload: { alarm_class: "MAJOR", alarm_code: "HI_LEVEL", raised_at: "2026-08-01T00:00:00Z", is_sso_related: false }
              as: ScadaWebhook
              captures: { tk_id: $.data.id, tk_v: $.data.version }
            - call: "POST /lift-station-ops/alarm-tickets/${tk_id}/ack"
              payload: {}
              as: OnCallOperator
          trigger:
            - call: "POST /lift-station-ops/alarm-tickets/${tk_id}/dispatch"
              payload: { expected_ticket_version: "${tk_v}" }
              as: OnCallOperator
              captures: { winner: $.data.assigned_operator_id }
          assert:
            - "winner == ${op_a} (tie on callout_score 100-100 -> resolved by created_at ASC; Alice was created first)"
            - "Operator.${op_a}.active_ticket_count == 1"
            - "Operator.${op_a}.consecutive_callouts_24h == 1"
            - "Operator.${op_b}.active_ticket_count == 0"


  # ==========================================================================
  # Rule 3 — non_linear_state_machine (>=2 instances, different entities)
  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: pump_rebuild_cycle
        grounds:
          - state_machines.Pump
          - state_machines.PumpRebuild
        distinguishing_aspect: |
          Pump has a CYCLE IN_SERVICE -> REBUILD -> IN_SERVICE (and IN_SERVICE -> OUT_OF_SERVICE
          -> IN_SERVICE). Distinct entity from ConfinedSpacePermit (the other instance) and
          distinct cycle shape — a pump can iterate the cycle many times; runtime_since_rebuild_hours
          resets only on the REBUILD -> IN_SERVICE transition, making loop count observable.
        test_recipe:
          setup:
            - "Station LS-5001 with pump_count=3, design_capacity_gpm=600, posture=NORMAL"
            - "Three IN_SERVICE pumps P1, P2, P3 (rated 200 each -> firm_capacity = 600 - 200 = 400)"
            - "Pump P1 has cumulative_runtime_hours=500, runtime_since_rebuild_hours=500"
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-5001", service_zone: "Z1", design_capacity_gpm: 600, pump_count: 3, has_backup_generator: false, wet_well_volume_gal: 5000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id }
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "${st_id}", position_index: 1, rated_gpm: 200, status: "IN_SERVICE" }
              as: UtilityAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "${st_id}", position_index: 2, rated_gpm: 200, status: "IN_SERVICE" }
              as: UtilityAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "${st_id}", position_index: 3, rated_gpm: 200, status: "IN_SERVICE" }
              as: UtilityAdmin
              captures: { p3_id: $.data.id }
            - call: "POST /lift-station-ops/pumps/${p1_id}/runtime-readings"
              payload: { recorded_at: "2026-08-01T00:00:00Z", run_hours_delta: 500.0, starts_count: 100, source: "BACKFILL" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/pump-rebuilds"
              payload: { pump_id: "${p1_id}", work_order_ref: "WO-1", started_at: "2026-08-01T01:00:00Z", cost_usd: 15000 }
              as: MaintenancePlanner
              captures: { rb_id: $.data.id }
            - call: "POST /lift-station-ops/pump-rebuilds/${rb_id}/start"
              payload: {}
              as: MaintenancePlanner
            - call: "POST /lift-station-ops/pump-rebuilds/${rb_id}/complete"
              payload: {}
              as: MaintenancePlanner
          trigger:
            - call: "GET /lift-station-ops/pumps/${p1_id}"
              payload: {}
              as: MaintenancePlanner
              captures: { pump_after: $.data }
          assert:
            - "Pump.${p1_id}.status == IN_SERVICE (returned from REBUILD — cycle completed)"
            - "Pump.${p1_id}.runtime_since_rebuild_hours == 0 (reset on REBUILD -> IN_SERVICE)"
            - "Pump.${p1_id}.cumulative_runtime_hours == 500.0 (cumulative NOT reset)"
            - "Pump.${p1_id}.rebuild_count == 1"

      - name: confined_space_permit_suspend_resume
        grounds:
          - state_machines.ConfinedSpacePermit
          - entities.ConfinedSpacePermit.fields.status
        distinguishing_aspect: |
          ConfinedSpacePermit has a SUSPENDED <-> ACTIVE loop (branching cycle on same entity):
          ACTIVE -> SUSPENDED -> ACTIVE -> CLOSED allowed; SUSPENDED -> ACTIVE requires
          now() < valid_until. Distinct entity from Pump (the other instance) — exercises a
          different cycle shape with a temporal guard.
        test_recipe:
          setup:
            - "Station LS-5002 posture=NORMAL"
            - "Three operators: entrant E (CSE_1), attendant A (CSE_2), supervisor S (CSE_1, COLLECTIONS_2)"
            - "ConfinedSpacePermit created with gas_test_passed=true"
            - "Permit issued at 2026-08-01T00:00:00Z -> valid_until 2026-08-01T12:00:00Z"
            - "Permit activated (ISSUED -> ACTIVE)"
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-31T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-5002", service_zone: "Z1", design_capacity_gpm: 300, pump_count: 2, has_backup_generator: false, wet_well_volume_gal: 2000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id }
            - call: "POST /lift-station-ops/operators"
              payload: { employee_code: "OP-5001", full_name: "Entrant", certifications: ["CSE_1"], home_zone: "Z1" }
              as: UtilityAdmin
              captures: { op_e: $.data.id }
            - call: "POST /lift-station-ops/operators"
              payload: { employee_code: "OP-5002", full_name: "Attendant", certifications: ["CSE_2"], home_zone: "Z1" }
              as: UtilityAdmin
              captures: { op_a: $.data.id }
            - call: "POST /lift-station-ops/operators"
              payload: { employee_code: "OP-5003", full_name: "Supervisor", certifications: ["CSE_1", "COLLECTIONS_2"], home_zone: "Z1" }
              as: UtilityAdmin
              captures: { op_s: $.data.id }
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations/${st_id}/confined-space-permits"
              payload: { work_description: "wet well inspection", authorized_entrant_id: "${op_e}", attendant_operator_id: "${op_a}", entry_supervisor_id: "${op_s}", gas_test_passed: true }
              as: OperationsSupervisor
              captures: { pm_id: $.data.id }
            - call: "POST /lift-station-ops/confined-space-permits/${pm_id}/issue"
              payload: {}
              as: Operator
              as_user_id: "${op_s}"
            - call: "POST /lift-station-ops/confined-space-permits/${pm_id}/activate"
              payload: {}
              as: Operator
              as_user_id: "${op_s}"
            - call: "POST /lift-station-ops/confined-space-permits/${pm_id}/suspend"
              payload: {}
              as: Operator
              as_user_id: "${op_s}"
          trigger:
            - call: "POST /lift-station-ops/confined-space-permits/${pm_id}/activate"
              payload: {}
              as: Operator
              as_user_id: "${op_s}"
              captures: { permit_after: $.data }
          assert:
            - "ConfinedSpacePermit.${pm_id}.status == ACTIVE (loop SUSPENDED -> ACTIVE succeeded)"
            - "ConfinedSpacePermit.${pm_id}.valid_until == 2026-08-01T12:00:00Z (12h from issued_at)"

  # ==========================================================================
  # Rule 4 — transitive_cascade (>=2 instances, depth >=3 and >=2, different triggers)
  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: pump_out_of_service_cascade_depth3
        grounds:
          - state_machines.Pump.IN_SERVICE_to_OUT_OF_SERVICE
          - state_machines.LiftStation.NORMAL_to_DEGRADED
          - calculations.firm_capacity_n_minus_1
          - calculations.station_posture
        distinguishing_aspect: |
          Depth-3 cascade triggered by POST /pumps/{id}/mark-out-of-service:
          (1) Pump.status -> OUT_OF_SERVICE; (2) this triggers firm_capacity_available_gpm
          recompute on LiftStation; (3) the recomputed firm capacity (now below design)
          triggers LiftStation.operational_posture NORMAL -> DEGRADED; (4) the posture change
          auto-fires an AlarmTicket with alarm_code=STATION_DEGRADED. Each link caused by the
          previous, not by the original action.
        test_recipe:
          setup:
            - "Station LS-6001 design_capacity_gpm=600, pump_count=2, posture=NORMAL"
            - "Two IN_SERVICE pumps P1 (rated 300), P2 (rated 300) -> firm_capacity = 600 - 300 = 300"
            - "Note: firm_capacity (300) is already < design (600) — station would already be DEGRADED; we need pump_count=3 and rated=300 so firm=600-300=300... actually let me redesign"
            - "Corrected: design=400, three pumps rated 200 each -> firm = 600 - 200 = 400 >= 400 -> NORMAL. Mark P1 OOS -> IN_SERVICE = {P2, P3}, total=400, largest=200, firm=200 < 400 -> DEGRADED."
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-6001", service_zone: "Z1", design_capacity_gpm: 400, pump_count: 3, has_backup_generator: false, wet_well_volume_gal: 5000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id }
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "${st_id}", position_index: 1, rated_gpm: 200, status: "IN_SERVICE" }
              as: UtilityAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "${st_id}", position_index: 2, rated_gpm: 200, status: "IN_SERVICE" }
              as: UtilityAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "${st_id}", position_index: 3, rated_gpm: 200, status: "IN_SERVICE" }
              as: UtilityAdmin
              captures: { p3_id: $.data.id }
          trigger:
            - call: "POST /lift-station-ops/pumps/${p1_id}/mark-out-of-service"
              payload: {}
              as: OperationsSupervisor
          assert:
            - "Pump.${p1_id}.status == OUT_OF_SERVICE (link 1)"
            - "LiftStation.${st_id}.firm_capacity_available_gpm == 200 (link 2 — IN_SERVICE = {P2, P3}, total 400, largest 200, firm 200)"
            - "LiftStation.${st_id}.operational_posture == DEGRADED (link 3 — 200 < design 400)"
            - "exists AlarmTicket(station_id=${st_id}, alarm_code in {PUMP_OUT_OF_SERVICE, STATION_DEGRADED}) — link 4 fan-out observed"

      - name: station_emergency_cascade_depth2
        grounds:
          - state_machines.LiftStation.NORMAL_to_EMERGENCY
          - state_machines.GeneratorTest
          - state_machines.ConfinedSpacePermit
        distinguishing_aspect: |
          Depth-2 cascade triggered by POST /stations/{id}/sso-events:
          (1) SsoEvent created OPEN; (2) LiftStation.operational_posture -> EMERGENCY;
          (3) posture EMERGENCY triggers GeneratorTest SCHEDULED -> ABORTED AND
          ConfinedSpacePermit DRAFT -> CANCELLED. The cascaded aborts/cancels are caused by the
          posture transition, not directly by the SSO creation — distinguishing this from a
          fan-out. Different trigger from pump mark-out-of-service.
        test_recipe:
          setup:
            - "Station LS-6002 design_capacity_gpm=400, three IN_SERVICE pumps rated 200 -> firm=400 -> NORMAL posture"
            - "SCHEDULED GeneratorTest GT1 for tomorrow"
            - "DRAFT ConfinedSpacePermit CSP1 (with three operators created)"
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-6002", service_zone: "Z1", design_capacity_gpm: 400, pump_count: 3, has_backup_generator: true, wet_well_volume_gal: 5000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id, st_v: $.data.version }
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "${st_id}", position_index: 1, rated_gpm: 200, status: "IN_SERVICE" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "${st_id}", position_index: 2, rated_gpm: 200, status: "IN_SERVICE" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "${st_id}", position_index: 3, rated_gpm: 200, status: "IN_SERVICE" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations/${st_id}/generator-tests"
              payload: { scheduled_for: "2026-08-02T00:00:00Z", test_kind: "NO_LOAD", load_percent: 0 }
              as: MaintenancePlanner
              captures: { gt_id: $.data.id }
            - call: "POST /lift-station-ops/operators"
              payload: { employee_code: "OP-6001", full_name: "E1", certifications: ["CSE_1"], home_zone: "Z1" }
              as: UtilityAdmin
              captures: { op_e: $.data.id }
            - call: "POST /lift-station-ops/operators"
              payload: { employee_code: "OP-6002", full_name: "A1", certifications: ["CSE_2"], home_zone: "Z1" }
              as: UtilityAdmin
              captures: { op_a: $.data.id }
            - call: "POST /lift-station-ops/operators"
              payload: { employee_code: "OP-6003", full_name: "S1", certifications: ["CSE_1"], home_zone: "Z1" }
              as: UtilityAdmin
              captures: { op_s: $.data.id }
            - call: "POST /lift-station-ops/stations/${st_id}/confined-space-permits"
              payload: { work_description: "inspect", authorized_entrant_id: "${op_e}", attendant_operator_id: "${op_a}", entry_supervisor_id: "${op_s}", gas_test_passed: true }
              as: OperationsSupervisor
              captures: { pm_id: $.data.id }
          trigger:
            - call: "POST /lift-station-ops/stations/${st_id}/sso-events"
              payload: { started_at: "2026-08-01T01:00:00Z", cause_code: "POWER_FAILURE", reached_surface_water: false, expected_station_version: "${st_v}" }
              as: UtilityAdmin
              captures: { sso_id: $.data.id }
          assert:
            - "SsoEvent.${sso_id}.status == OPEN (link 1)"
            - "LiftStation.${st_id}.operational_posture == EMERGENCY (link 2 — auto posture transition)"
            - "GeneratorTest.${gt_id}.status == ABORTED (link 3a — cascaded from EMERGENCY)"
            - "ConfinedSpacePermit.${pm_id}.status == CANCELLED (link 3b — cascaded from EMERGENCY)"


  # ==========================================================================
  # Rule 5 — priority_pair_validation_conflict (>=2 instances, different category pairs)
  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_oos
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - state_machines.Pump.IN_SERVICE_to_OUT_OF_SERVICE
          - errors[ERR_INVALID_STATE]
          - errors[ERR_FIRM_CAPACITY_VIOLATION]
        distinguishing_aspect: |
          Error-category pair (state vs business_safety): when a Pump is already OUT_OF_SERVICE
          AND the station has only one IN_SERVICE pump remaining, a second mark-out-of-service
          request on the ALREADY-OOS pump would trip priority-6 state precondition (pump not
          IN_SERVICE) before reaching the priority-8 safety check (must leave >=1 IN_SERVICE).
          The state error MUST win — proving priority order between state and business_safety.
        test_recipe:
          setup:
            - "Station LS-7001 with pump_count=2, design_capacity_gpm=300"
            - "Two pumps P1 (rated 150), P2 (rated 150), both IN_SERVICE"
            - "P2 already marked OUT_OF_SERVICE (allowed: 1 IN_SERVICE remains)"
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-7001", service_zone: "Z1", design_capacity_gpm: 300, pump_count: 2, has_backup_generator: false, wet_well_volume_gal: 3000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id }
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "${st_id}", position_index: 1, rated_gpm: 150, status: "IN_SERVICE" }
              as: UtilityAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "${st_id}", position_index: 2, rated_gpm: 150, status: "IN_SERVICE" }
              as: UtilityAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /lift-station-ops/pumps/${p2_id}/mark-out-of-service"
              payload: {}
              as: OperationsSupervisor
          trigger:
            - call: "POST /lift-station-ops/pumps/${p2_id}/mark-out-of-service"
              payload: {}
              as: OperationsSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (priority 6 state precondition fires; priority 8 safety check not reached)"
            - "err != ERR_FIRM_CAPACITY_VIOLATION"

      - name: business_safety_vs_business_temporal_on_permit
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - errors[ERR_INSUFFICIENT_CERTIFICATION]
          - errors[ERR_GAS_TEST_REQUIRED]
        distinguishing_aspect: |
          Error-category pair (business_safety vs business_safety at different priorities):
          when issuing a ConfinedSpacePermit where the entrant lacks CSE_1/CSE_2 (priority 10)
          AND gas_test_passed is false (priority 11), the certification error MUST win because
          it has the lower priority number. Distinct error-category pair from the other instance
          (state vs business_safety above).
        test_recipe:
          setup:
            - "Station LS-7002 with posture=NORMAL"
            - "Entrant E1 with certifications=[] (NO CSE cert)"
            - "Attendant A1 with certifications=[CSE_2]"
            - "Supervisor S1 with certifications=[CSE_1]"
            - "ConfinedSpacePermit created with gas_test_passed=false"
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-7002", service_zone: "Z1", design_capacity_gpm: 300, pump_count: 2, has_backup_generator: false, wet_well_volume_gal: 2000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id }
            - call: "POST /lift-station-ops/operators"
              payload: { employee_code: "OP-7001", full_name: "E1", certifications: [], home_zone: "Z1" }
              as: UtilityAdmin
              captures: { op_e: $.data.id }
            - call: "POST /lift-station-ops/operators"
              payload: { employee_code: "OP-7002", full_name: "A1", certifications: ["CSE_2"], home_zone: "Z1" }
              as: UtilityAdmin
              captures: { op_a: $.data.id }
            - call: "POST /lift-station-ops/operators"
              payload: { employee_code: "OP-7003", full_name: "S1", certifications: ["CSE_1"], home_zone: "Z1" }
              as: UtilityAdmin
              captures: { op_s: $.data.id }
            - call: "POST /lift-station-ops/stations/${st_id}/confined-space-permits"
              payload: { work_description: "inspect", authorized_entrant_id: "${op_e}", attendant_operator_id: "${op_a}", entry_supervisor_id: "${op_s}", gas_test_passed: false }
              as: OperationsSupervisor
              captures: { pm_id: $.data.id }
          trigger:
            - call: "POST /lift-station-ops/confined-space-permits/${pm_id}/issue"
              payload: {}
              as: Operator
              as_user_id: "${op_s}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INSUFFICIENT_CERTIFICATION (priority 10 fires; priority 11 gas test not reached)"
            - "err != ERR_GAS_TEST_REQUIRED"

  # ==========================================================================
  # Rule 6 — boundary_precision_check (>=2 instances, different metrics/endpoints)
  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: generator_test_load_bank_duration_boundary
        grounds:
          - validations[priority=18]
          - calculations.report_deadline
          - errors[ERR_TEST_DURATION_TOO_SHORT]
        distinguishing_aspect: |
          Numeric threshold boundary: GeneratorTest with test_kind=LOAD_BANK requires
          duration_minutes >= 30. Boundary precision tested at exactly 29 vs 30. Distinct metric
          (test duration minutes) from the empty-collection boundary (the other instance).
        test_recipe:
          setup:
            - "Station LS-8001 with has_backup_generator=true, posture=NORMAL"
            - "GeneratorTest GT1 with test_kind=LOAD_BANK, status=RUNNING"
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-8001", service_zone: "Z1", design_capacity_gpm: 300, pump_count: 2, has_backup_generator: true, wet_well_volume_gal: 3000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id }
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "${st_id}", position_index: 1, rated_gpm: 150, status: "IN_SERVICE" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "${st_id}", position_index: 2, rated_gpm: 150, status: "IN_SERVICE" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations/${st_id}/generator-tests"
              payload: { scheduled_for: "2026-08-01T00:00:00Z", test_kind: "LOAD_BANK", load_percent: 80 }
              as: MaintenancePlanner
              captures: { gt1_id: $.data.id }
            - call: "POST /lift-station-ops/generator-tests/${gt1_id}/start"
              payload: {}
              as: Operator
          trigger:
            - call: "POST /lift-station-ops/generator-tests/${gt1_id}/finish"
              payload: { duration_minutes: 29 }
              as: Operator
              captures: { err29: $.data.error_id }
          assert:
            - "err29 == ERR_TEST_DURATION_TOO_SHORT (29 < 30 boundary — rejects)"
            - "Subsequent test with duration_minutes=30 succeeds (boundary inclusive)"

      - name: callout_empty_pool_boundary
        grounds:
          - calculations.operator_callout_selection
          - validations[priority=28]
          - errors[ERR_NO_ELIGIBLE_OPERATOR]
        distinguishing_aspect: |
          Empty-collection boundary: when ALL operators are inactive (or all at ticket cap), the
          eligible pool is empty — dispatch MUST raise ERR_NO_ELIGIBLE_OPERATOR. Distinct metric
          (set cardinality zero) from the numeric threshold boundary above. Distinct endpoint
          (alarm dispatch) from generator finish.
        test_recipe:
          setup:
            - "Station LS-8002 with posture=NORMAL"
            - "Operator OP-X created then deactivated (is_active=false not directly settable; instead, create operator then never activate — actually we just create one and use a ticket requiring a cert they lack)"
            - "AlarmTicket ACKED with alarm_class=CRITICAL (requires COLLECTIONS_2 cert)"
            - "Operator OP-X has only CSE_1, no COLLECTIONS_2"
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-8002", service_zone: "Z1", design_capacity_gpm: 300, pump_count: 2, has_backup_generator: false, wet_well_volume_gal: 2000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id }
            - call: "POST /lift-station-ops/operators"
              payload: { employee_code: "OP-8001", full_name: "NoCert", certifications: ["CSE_1"], home_zone: "Z1" }
              as: UtilityAdmin
              captures: { op_x: $.data.id }
            - call: "POST /lift-station-ops/stations/${st_id}/alarm-tickets"
              payload: { alarm_class: "CRITICAL", alarm_code: "HI_LEVEL", raised_at: "2026-08-01T00:00:00Z", is_sso_related: false }
              as: ScadaWebhook
              captures: { tk_id: $.data.id, tk_v: $.data.version }
            - call: "POST /lift-station-ops/alarm-tickets/${tk_id}/ack"
              payload: {}
              as: OnCallOperator
          trigger:
            - call: "POST /lift-station-ops/alarm-tickets/${tk_id}/dispatch"
              payload: { expected_ticket_version: "${tk_v}" }
              as: OnCallOperator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NO_ELIGIBLE_OPERATOR (empty-pool boundary — no operator holds COLLECTIONS_2)"


  # ==========================================================================
  # Rule 7 — cross_entity_state_dependency (>=2 instances, different entity pairs)
  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: cleaning_start_requires_permit_state
        grounds:
          - validations[priority=23]
          - state_machines.WetWellCleaning.SCHEDULED_to_IN_PROGRESS
          - state_machines.ConfinedSpacePermit
          - errors[ERR_PERMIT_REQUIRED]
        distinguishing_aspect: |
          Entity pair WetWellCleaning -> ConfinedSpacePermit: a cleaning with
          requires_confined_space_entry=true cannot transition SCHEDULED -> IN_PROGRESS unless
          a ConfinedSpacePermit for the same station is in ISSUED or ACTIVE state. Distinct
          entity pair from AlarmTicket -> SsoEvent (other instance).
        test_recipe:
          setup:
            - "Station LS-9001 posture=NORMAL"
            - "Cleaning C1 with requires_confined_space_entry=true, status=SCHEDULED"
            - "No permit exists yet for the station"
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-9001", service_zone: "Z1", design_capacity_gpm: 300, pump_count: 2, has_backup_generator: false, wet_well_volume_gal: 3000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id }
            - call: "POST /lift-station-ops/operators"
              payload: { employee_code: "OP-9001", full_name: "Lead", certifications: ["CSE_1"], home_zone: "Z1" }
              as: UtilityAdmin
              captures: { op_lead: $.data.id }
            - call: "POST /lift-station-ops/stations/${st_id}/wet-well-cleanings"
              payload: { scheduled_for: "2026-08-01T06:00:00Z", grease_depth_inches_pre: 5.0, crew_lead_operator_id: "${op_lead}", requires_confined_space_entry: true }
              as: MaintenancePlanner
              captures: { cl_id: $.data.id }
          trigger:
            - call: "POST /lift-station-ops/wet-well-cleanings/${cl_id}/start"
              payload: {}
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PERMIT_REQUIRED"
            - "WetWellCleaning.${cl_id}.status == SCHEDULED (no transition)"

      - name: alarm_clear_requires_sso_state
        grounds:
          - validations[priority=22]
          - state_machines.AlarmTicket.ON_SCENE_to_CLEARED
          - errors[ERR_SSO_EVENT_OPEN]
        distinguishing_aspect: |
          Entity pair AlarmTicket -> SsoEvent: an is_sso_related ticket cannot transition
          ON_SCENE -> CLEARED while an SsoEvent for the station is in OPEN state. Distinct
          entity pair from WetWellCleaning -> ConfinedSpacePermit (other instance).
        test_recipe:
          setup:
            - "Station LS-9002 posture=EMERGENCY (SsoEvent OPEN)"
            - "Operator has COLLECTIONS_2 cert"
            - "AlarmTicket is_sso_related=true, status=ON_SCENE, assigned_operator_id=op"
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-9002", service_zone: "Z1", design_capacity_gpm: 300, pump_count: 2, has_backup_generator: false, wet_well_volume_gal: 3000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id, st_v: $.data.version }
            - call: "POST /lift-station-ops/operators"
              payload: { employee_code: "OP-9002", full_name: "Op", certifications: ["CSE_1", "COLLECTIONS_2"], home_zone: "Z1" }
              as: UtilityAdmin
              captures: { op_id: $.data.id }
            - call: "POST /lift-station-ops/stations/${st_id}/sso-events"
              payload: { started_at: "2026-08-01T00:00:00Z", cause_code: "GREASE_BLOCKAGE", reached_surface_water: false, expected_station_version: "${st_v}" }
              as: UtilityAdmin
              captures: { sso_id: $.data.id }
            - call: "POST /lift-station-ops/stations/${st_id}/alarm-tickets"
              payload: { alarm_class: "MAJOR", alarm_code: "HI_LEVEL", raised_at: "2026-08-01T00:00:00Z", is_sso_related: true }
              as: ScadaWebhook
              captures: { tk_id: $.data.id, tk_v: $.data.version }
            - call: "POST /lift-station-ops/alarm-tickets/${tk_id}/ack"
              payload: {}
              as: OnCallOperator
            - call: "GET /lift-station-ops/alarm-tickets/${tk_id}"
              payload: {}
              as: OnCallOperator
              captures: { tk_v2: $.data.version }
            - call: "POST /lift-station-ops/alarm-tickets/${tk_id}/dispatch"
              payload: { expected_ticket_version: "${tk_v2}" }
              as: OnCallOperator
            - call: "POST /lift-station-ops/alarm-tickets/${tk_id}/arrive"
              payload: {}
              as: Operator
              as_user_id: "${op_id}"
          trigger:
            - call: "POST /lift-station-ops/alarm-tickets/${tk_id}/clear"
              payload: {}
              as: Operator
              as_user_id: "${op_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SSO_EVENT_OPEN (sso still OPEN; clear blocked)"
            - "AlarmTicket.${tk_id}.status == ON_SCENE (unchanged)"

  # ==========================================================================
  # Rule 8 — resource_temporal_overlap (>=2 instances, different interval semantics)
  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: confined_space_permit_validity_window
        grounds:
          - validations[priority=24]
          - state_machines.ConfinedSpacePermit
          - errors[ERR_PERMIT_EXPIRED]
        distinguishing_aspect: |
          Interval semantics — half-open [issued_at, valid_until): the permit can be ACTIVATED
          strictly before valid_until (12h validity) but NOT at or after. Interval semantics are
          point-in-time gating against a derived expiry, distinct from duration-based threshold
          (other instance). Resource is the permit itself.
        test_recipe:
          setup:
            - "Station LS-10001 posture=NORMAL"
            - "Permit issued at 2026-08-01T00:00:00Z -> valid_until 2026-08-01T12:00:00Z"
            - "Clock advanced to exactly 2026-08-01T12:00:00Z (== valid_until — half-open: expired)"
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-31T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-10001", service_zone: "Z1", design_capacity_gpm: 300, pump_count: 2, has_backup_generator: false, wet_well_volume_gal: 2000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id }
            - call: "POST /lift-station-ops/operators"
              payload: { employee_code: "OP-10001", full_name: "E", certifications: ["CSE_1"], home_zone: "Z1" }
              as: UtilityAdmin
              captures: { op_e: $.data.id }
            - call: "POST /lift-station-ops/operators"
              payload: { employee_code: "OP-10002", full_name: "A", certifications: ["CSE_2"], home_zone: "Z1" }
              as: UtilityAdmin
              captures: { op_a: $.data.id }
            - call: "POST /lift-station-ops/operators"
              payload: { employee_code: "OP-10003", full_name: "S", certifications: ["CSE_1"], home_zone: "Z1" }
              as: UtilityAdmin
              captures: { op_s: $.data.id }
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations/${st_id}/confined-space-permits"
              payload: { work_description: "inspect", authorized_entrant_id: "${op_e}", attendant_operator_id: "${op_a}", entry_supervisor_id: "${op_s}", gas_test_passed: true }
              as: OperationsSupervisor
              captures: { pm_id: $.data.id }
            - call: "POST /lift-station-ops/confined-space-permits/${pm_id}/issue"
              payload: {}
              as: Operator
              as_user_id: "${op_s}"
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:00:00Z" }
              as: UtilityAdmin
          trigger:
            - call: "POST /lift-station-ops/confined-space-permits/${pm_id}/activate"
              payload: {}
              as: Operator
              as_user_id: "${op_s}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PERMIT_EXPIRED (now() == valid_until — half-open semantics: expired)"

      - name: pump_alternation_runtime_threshold
        grounds:
          - calculations.pump_alternation_selection
          - constants.ALTERNATION_THRESHOLD_HOURS
          - errors[ERR_NO_PUMPS_TO_ALTERNATE]
        distinguishing_aspect: |
          Aggregate capacity semantics: alternation only proceeds when at least 2 pumps are
          IN_SERVICE (aggregate count check on a shared resource pool). The trigger requires
          runtime_since_rebuild_hours difference >= 24h (strict greater-than-or-equal at the
          threshold). Different resource (Pump pool) and different interval semantics
          (aggregate capacity + threshold comparison) from the permit validity point-in-time.
        test_recipe:
          setup:
            - "Station LS-10002 with pump_count=2, posture=NORMAL"
            - "P1 IN_SERVICE position=1, runtime_since_rebuild_hours=10"
            - "P2 IN_SERVICE position=2, runtime_since_rebuild_hours=10 (difference 0 < 24)"
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-10002", service_zone: "Z1", design_capacity_gpm: 300, pump_count: 2, has_backup_generator: false, wet_well_volume_gal: 2000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id }
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "${st_id}", position_index: 1, rated_gpm: 150, status: "IN_SERVICE" }
              as: UtilityAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "${st_id}", position_index: 2, rated_gpm: 150, status: "IN_SERVICE" }
              as: UtilityAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /lift-station-ops/pumps/${p1_id}/runtime-readings"
              payload: { recorded_at: "2026-08-01T00:00:00Z", run_hours_delta: 10.0, starts_count: 5, source: "SCADA" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/pumps/${p2_id}/runtime-readings"
              payload: { recorded_at: "2026-08-01T00:00:00Z", run_hours_delta: 10.0, starts_count: 5, source: "SCADA" }
              as: UtilityAdmin
          trigger:
            - call: "POST /lift-station-ops/pumps/alternate"
              payload: { station_id: "${st_id}" }
              as: OperationsSupervisor
          assert:
            - "Pump.${p1_id}.position_index == 1 (no swap — runtime difference 0 < ALTERNATION_THRESHOLD_HOURS=24)"
            - "Pump.${p2_id}.position_index == 2 (unchanged)"

  # ==========================================================================
  # Rule 9 — compensating_invariant (>=2 instances, different conserved quantities)
  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: operator_active_ticket_count_invariant
        grounds:
          - entities.Operator.fields.active_ticket_count
          - state_machines.AlarmTicket.ACKED_to_DISPATCHED
          - state_machines.AlarmTicket.ON_SCENE_to_CLEARED
        distinguishing_aspect: |
          Conserved quantity: Operator.active_ticket_count. Forward action (dispatch) increments;
          compensating action (clear) decrements. After dispatch+clear pair, active_ticket_count
          MUST return to its pre-dispatch value — no drift.
        test_recipe:
          setup:
            - "Station LS-11001 posture=NORMAL"
            - "Operator OP with active_ticket_count=0"
            - "AlarmTicket ACKED with alarm_class=MINOR (no cert requirement beyond basic)"
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-11001", service_zone: "Z1", design_capacity_gpm: 300, pump_count: 2, has_backup_generator: false, wet_well_volume_gal: 2000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id }
            - call: "POST /lift-station-ops/operators"
              payload: { employee_code: "OP-11001", full_name: "Op", certifications: ["CSE_1", "COLLECTIONS_2"], home_zone: "Z1" }
              as: UtilityAdmin
              captures: { op_id: $.data.id, op_count0: $.data.active_ticket_count }
            - call: "POST /lift-station-ops/stations/${st_id}/alarm-tickets"
              payload: { alarm_class: "MINOR", alarm_code: "HI_LEVEL", raised_at: "2026-08-01T00:00:00Z", is_sso_related: false }
              as: ScadaWebhook
              captures: { tk_id: $.data.id, tk_v: $.data.version }
            - call: "POST /lift-station-ops/alarm-tickets/${tk_id}/ack"
              payload: {}
              as: OnCallOperator
            - call: "POST /lift-station-ops/alarm-tickets/${tk_id}/dispatch"
              payload: { expected_ticket_version: "${tk_v}" }
              as: OnCallOperator
            - call: "POST /lift-station-ops/alarm-tickets/${tk_id}/arrive"
              payload: {}
              as: Operator
              as_user_id: "${op_id}"
          trigger:
            - call: "POST /lift-station-ops/alarm-tickets/${tk_id}/clear"
              payload: {}
              as: Operator
              as_user_id: "${op_id}"
            - call: "GET /lift-station-ops/operators/${op_id}"
              payload: {}
              as: OperationsSupervisor
              captures: { op_after: $.data.active_ticket_count }
          assert:
            - "Operator.${op_id}.active_ticket_count == 0 (dispatch+clear pair nets to zero — conserved)"
            - "AlarmTicket.${tk_id}.status == CLEARED"

      - name: capital_budget_allocation_invariant
        grounds:
          - entities.CapitalPlan.fields.budget_allocated_usd
          - entities.CapitalPlan.fields.budget_remaining_usd
          - state_machines.CapitalPlan.RANKED_to_APPROVED
          - state_machines.CapitalProject
        distinguishing_aspect: |
          Conserved quantity: CapitalPlan budget conservation. The invariant is
          budget_allocated_usd + budget_remaining_usd == budget_total_usd, where
          budget_remaining_usd = max(0, budget_total_usd - budget_allocated_usd). Across a
          rank -> approve cascade (which allocates projects into APPROVED vs DEFERRED), the
          total budget consumed (allocated) must equal the sum of APPROVED projects only —
          DEFERRED projects must not consume budget.
        test_recipe:
          setup:
            - "CapitalPlan 2028 budget_total_usd=100000"
            - "Two PROPOSED projects at station LS-11002: ProjA cost=60000, ProjB cost=50000"
            - "Plan ranked -> both RANKED with priority_rank 1 and 2"
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-11002", service_zone: "Z1", design_capacity_gpm: 300, pump_count: 2, has_backup_generator: false, wet_well_volume_gal: 2000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id }
            - call: "POST /lift-station-ops/capital-plans"
              payload: { plan_year: 2028, budget_total_usd: 100000 }
              as: CapitalProgramManager
              captures: { plan_id: $.data.id, plan_v: $.data.version }
            - call: "POST /lift-station-ops/capital-projects"
              payload: { plan_id: "${plan_id}", station_id: "${st_id}", project_name: "A", estimated_cost_usd: 60000, consequence_of_failure: 9, likelihood_of_failure: 9 }
              as: CapitalProgramManager
              captures: { pa_id: $.data.id }
            - call: "POST /lift-station-ops/capital-projects"
              payload: { plan_id: "${plan_id}", station_id: "${st_id}", project_name: "B", estimated_cost_usd: 50000, consequence_of_failure: 5, likelihood_of_failure: 5 }
              as: CapitalProgramManager
              captures: { pb_id: $.data.id }
            - call: "POST /lift-station-ops/capital-plans/${plan_id}/rank"
              payload: {}
              as: CapitalProgramManager
            - call: "GET /lift-station-ops/capital-plans/${plan_id}"
              payload: {}
              as: CapitalProgramManager
              captures: { plan_v2: $.data.version }
          trigger:
            - call: "POST /lift-station-ops/capital-plans/${plan_id}/approve"
              payload: { expected_plan_version: "${plan_v2}" }
              as: UtilityAdmin
            - call: "GET /lift-station-ops/capital-plans/${plan_id}"
              payload: {}
              as: CapitalProgramManager
              captures: { plan_after: $.data }
          assert:
            - "CapitalProject.${pa_id}.status == APPROVED (rank 1 fits)"
            - "CapitalProject.${pb_id}.status == DEFERRED (rank 2 overflows budget)"
            - "CapitalPlan.${plan_id}.budget_allocated_usd == 60000.00 (only APPROVED project counts)"
            - "CapitalPlan.${plan_id}.budget_allocated_usd + CapitalPlan.${plan_id}.budget_remaining_usd == 100000.00 (conservation)"

