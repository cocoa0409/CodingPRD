        claim_type: RBAC Denial
        grounds:
          - roles.TradePartner
          - endpoints.POST_/rebuild/trade-work-orders/{workOrderId}/schedule
        distinguishing_aspect: "Scheduling is staff-only: the contractor that owns the work order still gets ERR_FORBIDDEN from the schedule endpoint, separating commercial (quote/invoice) from operational authority."
