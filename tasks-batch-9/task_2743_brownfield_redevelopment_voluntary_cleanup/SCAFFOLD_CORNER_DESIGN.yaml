              as_user_id: "${consult_id}"
              captures: { plan_v_patched: $.data.version }
          assert:
            - "at create RemedialActionPlan.${plan_id}.total_estimate_cents == 115210677 and total_funding_need_cents == 115210677"
            - "HTTP 200; RemedialActionPlan.${plan_id}.years_to_construction_start == 5, direct_cost_cents == 89787402 (unchanged) and escalation_cents == 18855354"
            - "RemedialActionPlan.${plan_id}.contingency_pct == 0.10 and contingency_cents == 10864276 (round_half_up(108642756 * 0.10))"
            - "RemedialActionPlan.${plan_id}.oversight_cents == 4000000 (still capped) and total_estimate_cents == 123507032"
            - "RemedialActionPlan.${plan_id}.total_funding_need_cents == 123507032 and version ${plan_v_patched} == ${plan_v} + 1"
            - "GET /remedial-action-plans/${plan_id} returns exactly the same figures, and status is still 'DRAFT' with pinned_cleanup_goal_versions == []"

