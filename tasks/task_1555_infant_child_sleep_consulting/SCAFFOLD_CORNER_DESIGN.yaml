        distinguishing_aspect: "The delivery_mode flag gates two different purchase surfaces: a GROUP_COURSE case cannot buy a support package and a ONE_ON_ONE case cannot enroll in a group course — both fail with ERR_DELIVERY_MODE_MISMATCH."
        test_recipe:
          setup: ["family with case_g (GROUP_COURSE, driven to PLANNING so the state gate passes and the mode gate is what fires) and case_o (ONE_ON_ONE, INTAKE — enrollment declares no case-state precondition); a course with free seats exists"]
