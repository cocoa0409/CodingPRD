            - call: "POST /market-price-snapshots"
              payload: { mpn: "LM317T", spot_price_cents: 9000, source: "TRADE_DESK" }
              as: BrokerOps
              captures: { obs: $.data.observed_at }
          assert:
            - "obs == 2026-08-01T00:00:00Z"

      - name: cascading_side_effects_release_quarantine_restores_posture
        claim_type: cascading_side_effects
        grounds: ["state_machines.Lot"]
        distinguishing_aspect: "release-quarantine clears the suspect flag and recomputes base posture in one call: lot returns to IN_STOCK (listings were withdrawn by quarantine, so LISTED is unreachable until a new listing activates)."
        test_recipe:
