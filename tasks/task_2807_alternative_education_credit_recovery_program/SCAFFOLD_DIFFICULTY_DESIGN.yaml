              captures: { ps1_id: $.data.id }
          trigger:
            - call: "POST /proctor-sessions"
              payload: { course_enrollment_id: "${enr_id}", proctor_station_id: "${st_id}", scheduled_start: "2026-08-05T10:10:00Z", scheduled_end: "2026-08-05T11:00:00Z" }
              as: PlacementCoordinator
