# =============================================================================
# Task 1971: Wholesale Buying Group & Co-op Rebate Administration
# =============================================================================

scenario: |
  1971. Wholesale Buying Group & Co-op Rebate Administration (Do it Best style
  co-op): member enrollment & purchase reporting, supplier program tier &
  rebate calculation, pass-through vs retained rebate split, member volume
  audit & self-report verification, program compliance (exclusivity)
  enforcement, quarterly distribution & holdback, new-supplier onboarding &
  negotiation, member churn & clawback

domain_name: wholesale-buying-group-coop
api_prefix: /coop

complexity_profile:
  primary_archetype: Ledger reconciliation
  secondary_archetype: Quota / allocation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - many_to_many
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Coop
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Co-op legal name" }
      - { name: current_quarter_index, type: integer, source: system, default: 0, description: "Logical quarter counter; advanced via close_quarter. Quarter 0 is open at bootstrap." }
      - { name: pool_reserve_cents, type: integer, source: computed, default: 0, description: "Aggregate undistributed rebate pool held in escrow across all quarters (sum of undisbursed distribution amounts minus clawbacks settled)" }
      - { name: retained_revenue_cents, type: integer, source: computed, default: 0, description: "Lifetime co-op retained share from all finalized distributions" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Member retailer legal name" }
      - { name: commitment_level, type: enum, source: input, description: "BUILDER | STANDARD | PLATINUM — drives pass-through split and holdback floor", constraints: "enum BUILDER | STANDARD | PLATINUM" }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | SUSPENDED | CHURNED", constraints: "enum PENDING | ACTIVE | SUSPENDED | CHURNED" }
      - { name: enrolled_quarter_index, type: integer, source: system, description: "Quarter the member was activated" }
      - { name: churn_quarter_index, type: integer, source: system, default: null, description: "Quarter churn was recorded (null until CHURNED)" }
      - { name: lifetime_pass_through_cents, type: integer, source: computed, default: 0, description: "Sum of member-facing distribution cash paid across all reconciled quarters" }
      - { name: lifetime_clawback_cents, type: integer, source: computed, default: 0, description: "Sum of clawbacks actually recovered from this member" }
      - { name: prior_audit_findings_count, type: integer, source: computed, default: 0, description: "Count of VolumeAudit rows resolved with finding_severity=MATERIAL; drives holdback variant switch" }

  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Supplier legal name" }
      - { name: onboarding_notes, type: string, source: input, default: "", description: "Free-form negotiation notes recorded at onboarding" }
      - { name: status, type: enum, source: system, description: "PROSPECT | ONBOARDED | INACTIVE", constraints: "enum PROSPECT | ONBOARDED | INACTIVE" }

  - name: SupplierProgram
    parent: Supplier
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: system, description: "FK -> Supplier.id; owning supplier" }
      - { name: program_code, type: string, source: input, description: "Supplier-scoped unique program identifier" , constraints: "unique within supplier among programs not in TERMINATED"}
      - { name: exclusivity_required, type: boolean, source: input, description: "Whether enrolled members must meet share-of-wallet exclusivity" }
      - { name: exclusivity_threshold_pct, type: integer, source: input, description: "Minimum share-of-wallet percentage (0-100) required when exclusivity_required is true" }
      - { name: tier_schedule, type: array, source: input, description: "Ordered tiers [{min_qty, rate_bps}] ascending by min_qty; rate_bps is rebate basis points of eligible purchase cents at-or-above min_qty" }
      - { name: holdback_policy, type: enum, source: input, description: "FLAT | RISK_ADJUSTED — chooses holdback variant", constraints: "enum FLAT | RISK_ADJUSTED" }
      - { name: negotiation_round, type: integer, source: system, default: 0, description: "Counter of amendment rounds, incremented on every PUT /supplier-programs/{id}" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | CLOSED_TO_NEW | REOPENED | TERMINATED", constraints: "enum DRAFT | OPEN | CLOSED_TO_NEW | REOPENED | TERMINATED" }

  - name: ProgramEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; enrolled member" }
      - { name: program_id, type: string, source: input, description: "FK -> SupplierProgram.id; program enrolled into" }
      - { name: enrolled_quarter_index, type: integer, source: system, description: "Quarter when enrollment became effective" }
      - { name: exit_quarter_index, type: integer, source: system, default: null, description: "Quarter enrollment ended (null while ACTIVE/SUSPENDED)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | EXITED", constraints: "enum ACTIVE | SUSPENDED | EXITED" }
      - { name: exclusivity_share_pct, type: integer, source: computed, default: 0, description: "Share-of-wallet percentage recomputed at every quarter close from PurchaseReport data" }
      - { name: exclusivity_status, type: enum, source: computed, description: "COMPLIANT | SHORTFALL | NOT_APPLICABLE (when exclusivity_required is false)", constraints: "enum COMPLIANT | SHORTFALL | NOT_APPLICABLE" }

  - name: PurchaseReport
    parent: ProgramEnrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> ProgramEnrollment.id; owning enrollment" }
      - { name: quarter_index, type: integer, source: input, description: "Quarter the report covers (must equal coop.current_quarter_index at submission)" }
      - { name: self_report_qty, type: integer, source: input, description: "Member-reported purchase quantity in units" }
      - { name: self_report_cents, type: integer, source: input, description: "Member-reported eligible purchase dollars in cents" }
      - { name: audited_qty, type: integer, source: system, default: null, description: "Auditor-confirmed quantity (set by VolumeAudit resolution; null until then)" }
      - { name: audited_cents, type: integer, source: system, default: null, description: "Auditor-confirmed dollars in cents (set by VolumeAudit resolution; null until then)" }
      - { name: revision_of_id, type: string, source: system, default: null, description: "FK -> PurchaseReport.id; set on a revision row to point at the report it supersedes" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | FLAGGED | SUPERSEDED | ADJUDICATED", constraints: "enum SUBMITTED | FLAGGED | SUPERSEDED | ADJUDICATED" }
      - { name: submitted_at_quarter, type: integer, source: system, description: "Quarter index at time of submission (for late-report detection)" }

  - name: VolumeAudit
    parent: ProgramEnrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> ProgramEnrollment.id; audit target enrollment" }
      - { name: purchase_report_id, type: string, source: input, description: "FK -> PurchaseReport.id; the specific report under audit" }
      - { name: opened_quarter_index, type: integer, source: system, description: "Quarter when audit was opened" }
      - { name: resolved_quarter_index, type: integer, source: system, default: null, description: "Quarter audit reached RESOLVED" }
      - { name: finding_severity, type: enum, source: system, default: null, description: "NONE | MINOR | MATERIAL — null until RESOLVED", constraints: "enum NONE | MINOR | MATERIAL" }
      - { name: audited_qty, type: integer, source: input, default: null, description: "Auditor-attested qty; required at resolve time" }
      - { name: audited_cents, type: integer, source: input, default: null, description: "Auditor-attested cents; required at resolve time" }
      - { name: status, type: enum, source: system, description: "OPEN | FIELDWORK | FINDINGS_ISSUED | ACCEPTED | APPEALED | RESOLVED", constraints: "enum OPEN | FIELDWORK | FINDINGS_ISSUED | ACCEPTED | APPEALED | RESOLVED" }

  - name: RebateAccrual
    parent: ProgramEnrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> ProgramEnrollment.id; accrual owner" }
      - { name: quarter_index, type: integer, source: system, description: "Quarter this accrual covers" }
      - { name: provisional_rebate_cents, type: integer, source: computed, default: 0, description: "Rebate computed from self_report_cents at submission time (provisional variant)" }
      - { name: final_rebate_cents, type: integer, source: computed, default: 0, description: "Rebate computed from audited_cents when audit resolves; falls back to provisional if no audit (final variant)" }
      - { name: tier_applied_min_qty, type: integer, source: computed, default: 0, description: "Tier breakpoint actually applied (from tier_schedule)" }
      - { name: pass_through_cents, type: integer, source: computed, default: 0, description: "Member-facing share of final_rebate_cents after split" }
      - { name: retained_cents, type: integer, source: computed, default: 0, description: "Co-op retained share of final_rebate_cents" }
      - { name: status, type: enum, source: system, description: "OPEN | FINALIZED | DISTRIBUTED | CLAWED_BACK", constraints: "enum OPEN | FINALIZED | DISTRIBUTED | CLAWED_BACK" }

  - name: QuarterlyDistribution
    parent: Coop
    common_fields: true
    fields:
      - { name: coop_id, type: string, source: system, description: "FK -> Coop.id; parent co-op" }
      - { name: quarter_index, type: integer, source: system, description: "Quarter this distribution covers (== Coop.current_quarter_index at close)" }
      - { name: gross_rebate_cents, type: integer, source: computed, default: 0, description: "Sum of final_rebate_cents over all accruals included in this distribution" }
      - { name: total_pass_through_cents, type: integer, source: computed, default: 0, description: "Sum of pass_through_cents across accruals" }
      - { name: total_retained_cents, type: integer, source: computed, default: 0, description: "Sum of retained_cents across accruals" }
      - { name: holdback_cents, type: integer, source: computed, default: 0, description: "Amount withheld this quarter (per holdback variant)" }
      - { name: clawback_offset_cents, type: integer, source: computed, default: 0, description: "Clawbacks netted against this distribution" }
      - { name: net_disbursed_cents, type: integer, source: computed, default: 0, description: "Cash actually leaving the pool: total_pass_through_cents - holdback_cents - clawback_offset_cents" }
      - { name: status, type: enum, source: system, description: "DRAFT | CALCULATED | APPROVED | DISBURSED | RECONCILED", constraints: "enum DRAFT | CALCULATED | APPROVED | DISBURSED | RECONCILED" }

  - name: ClawbackCase
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; clawback target" }
      - { name: trigger_reason, type: enum, source: input, description: "CHURN | AUDIT_SHORTFALL | EXCLUSIVITY_BREACH", constraints: "enum CHURN | AUDIT_SHORTFALL | EXCLUSIVITY_BREACH" }
      - { name: trigger_quarter_index, type: integer, source: system, description: "Quarter the triggering event occurred" }
      - { name: gross_clawback_cents, type: integer, source: computed, default: 0, description: "Total amount owed back before offsets (per gross variant)" }
      - { name: net_clawback_cents, type: integer, source: computed, default: 0, description: "Amount actually demanded after offsetting unpaid holdbacks (net variant)" }
      - { name: recovered_cents, type: integer, source: computed, default: 0, description: "Cash actually recovered against this clawback" }
      - { name: dispute_note, type: string, source: input, default: "", description: "Member's dispute narrative when transitioning to DISPUTED" }
      - { name: status, type: enum, source: system, description: "OPEN | NOTIFIED | DISPUTED | RESOLVED | WAIVED", constraints: "enum OPEN | NOTIFIED | DISPUTED | RESOLVED | WAIVED" }

  - name: HoldbackRelease
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; owner of the holdback" }
      - { name: source_distribution_id, type: string, source: system, description: "FK -> QuarterlyDistribution.id; distribution whose holdback is being released" }
      - { name: release_quarter_index, type: integer, source: system, description: "Quarter in which the release fires (== source_quarter + HOLDBACK_LAG_QUARTERS)" }
      - { name: release_cents, type: integer, source: computed, description: "Cash amount to release to the member at release_quarter_index" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | RELEASED | FORFEITED", constraints: "enum SCHEDULED | RELEASED | FORFEITED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Member
    initial_state: PENDING
    terminal_states: [CHURNED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /coop/members/{id}/activate"
        actor: CoopAdmin
        preconditions:
          - "Member.status == PENDING (else ERR_INVALID_STATE)"
        side_effects:
          - "enrolled_quarter_index = coop.current_quarter_index"
          - "Member.version incremented"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /coop/members/{id}/suspend"
        actor: CoopAdmin
        preconditions:
          - "Member.status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "All ProgramEnrollment rows for member_id in ACTIVE status transition to SUSPENDED"
          - "Member.version incremented"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /coop/members/{id}/reinstate"
        actor: CoopAdmin
        preconditions:
          - "Member.status == SUSPENDED (else ERR_INVALID_STATE)"
          - "No OPEN or NOTIFIED or DISPUTED ClawbackCase exists for member (else ERR_OPEN_CLAWBACK)"
        side_effects:
          - "All ProgramEnrollment rows in SUSPENDED status transition back to ACTIVE"
          - "Member.version incremented"

      - from: ACTIVE
        to: CHURNED
        trigger: "POST /coop/members/{id}/churn"
        actor: CoopAdmin
        preconditions:
          - "Member.status == ACTIVE or SUSPENDED (else ERR_INVALID_STATE)"
        side_effects:
          - "churn_quarter_index = coop.current_quarter_index"
          - "All ProgramEnrollment rows in ACTIVE or SUSPENDED transition to EXITED with exit_quarter_index = current_quarter_index"
          - "Auto-create ClawbackCase with trigger_reason=CHURN; compute gross and net clawback per clawback_amount calculation"
          - "All HoldbackRelease rows in SCHEDULED transition to FORFEITED (cascade: clawback nets against forfeited holdbacks first)"
          - "Member.version incremented"

      - from: SUSPENDED
        to: CHURNED
        trigger: "POST /coop/members/{id}/churn"
        actor: CoopAdmin
        preconditions: []
        side_effects:
          - "churn_quarter_index = coop.current_quarter_index"
          - "All ProgramEnrollment rows in SUSPENDED transition to EXITED"
          - "Auto-create ClawbackCase with trigger_reason=CHURN"
          - "All SCHEDULED HoldbackRelease rows transition to FORFEITED"
          - "Member.version incremented"

  - entity: Supplier
    initial_state: PROSPECT
    terminal_states: [INACTIVE]
    transitions:
      - from: PROSPECT
        to: ONBOARDED
        trigger: "POST /coop/suppliers/{id}/onboard"
        actor: CoopAdmin
        preconditions:
          - "Supplier.status == PROSPECT (else ERR_INVALID_STATE)"
        side_effects:
          - "Supplier.version incremented"

      - from: ONBOARDED
        to: INACTIVE
        trigger: "POST /coop/suppliers/{id}/deactivate"
        actor: CoopAdmin
        preconditions:
          - "Supplier.status == ONBOARDED (else ERR_INVALID_STATE)"
          - "No SupplierProgram rows with status in {OPEN, CLOSED_TO_NEW, REOPENED} reference this supplier (else ERR_SUPPLIER_HAS_ACTIVE_PROGRAMS)"
        side_effects:
          - "All SupplierProgram rows in DRAFT for this supplier transition to TERMINATED"
          - "Supplier.version incremented"

  - entity: SupplierProgram
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /coop/supplier-programs/{id}/open"
        actor: SupplierRep
        preconditions:
          - "SupplierProgram.status == DRAFT (else ERR_INVALID_STATE)"
          - "Parent Supplier.status == ONBOARDED (else ERR_SUPPLIER_NOT_ONBOARDED)"
          - "tier_schedule must be non-empty and ascending by min_qty (else ERR_INVALID_TIER_SCHEDULE)"
          - "If exclusivity_required is true, exclusivity_threshold_pct must be in [1,100] (else ERR_INVALID_EXCLUSIVITY)"
        side_effects:
          - "SupplierProgram.version incremented"

      - from: OPEN
        to: CLOSED_TO_NEW
        trigger: "POST /coop/supplier-programs/{id}/close_to_new"
        actor: SupplierRep
        preconditions:
          - "SupplierProgram.status == OPEN (else ERR_INVALID_STATE)"
        side_effects:
          - "SupplierProgram.version incremented"

      - from: CLOSED_TO_NEW
        to: REOPENED
        trigger: "POST /coop/supplier-programs/{id}/reopen"
        actor: SupplierRep
        preconditions:
          - "SupplierProgram.status == CLOSED_TO_NEW (else ERR_INVALID_STATE)"
        side_effects:
          - "SupplierProgram.version incremented"

      - from: REOPENED
        to: CLOSED_TO_NEW
        trigger: "POST /coop/supplier-programs/{id}/close_to_new"
        actor: SupplierRep
        preconditions:
          - "SupplierProgram.status == REOPENED (else ERR_INVALID_STATE)"
        side_effects:
          - "SupplierProgram.version incremented"

      - from: OPEN
        to: TERMINATED
        trigger: "POST /coop/supplier-programs/{id}/terminate"
        actor: SupplierRep
        preconditions:
          - "No ProgramEnrollment rows with status ACTIVE or SUSPENDED (else ERR_PROGRAM_HAS_ENROLLMENTS)"
        side_effects:
          - "SupplierProgram.version incremented"

      - from: CLOSED_TO_NEW
        to: TERMINATED
        trigger: "POST /coop/supplier-programs/{id}/terminate"
        actor: SupplierRep
        preconditions:
          - "No ProgramEnrollment rows with status ACTIVE or SUSPENDED (else ERR_PROGRAM_HAS_ENROLLMENTS)"
        side_effects:
          - "SupplierProgram.version incremented"

      - from: REOPENED
        to: TERMINATED
        trigger: "POST /coop/supplier-programs/{id}/terminate"
        actor: SupplierRep
        preconditions:
          - "No ProgramEnrollment rows with status ACTIVE or SUSPENDED (else ERR_PROGRAM_HAS_ENROLLMENTS)"
        side_effects:
          - "SupplierProgram.version incremented"

      - from: DRAFT
        to: TERMINATED
        trigger: "POST /coop/supplier-programs/{id}/terminate"
        actor: SupplierRep
        preconditions: []
        side_effects:
          - "SupplierProgram.version incremented"

  - entity: ProgramEnrollment
    initial_state: ACTIVE
    terminal_states: [EXITED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "cascade from Member.suspend"
        actor: system
        preconditions: []
        side_effects:
          - "ProgramEnrollment.version incremented"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "cascade from Member.reinstate"
        actor: system
        preconditions: []
        side_effects:
          - "ProgramEnrollment.version incremented"

      - from: ACTIVE
        to: EXITED
        trigger: "cascade from Member.churn OR POST /coop/enrollments/{id}/exit"
        actor: "system | CoopAdmin"
        preconditions:
          - "exit endpoint: ProgramEnrollment.status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "exit_quarter_index = coop.current_quarter_index"
          - "ProgramEnrollment.version incremented"

      - from: SUSPENDED
        to: EXITED
        trigger: "cascade from Member.churn"
        actor: system
        preconditions: []
        side_effects:
          - "exit_quarter_index = coop.current_quarter_index"
          - "ProgramEnrollment.version incremented"

  - entity: PurchaseReport
    initial_state: SUBMITTED
    terminal_states: [SUPERSEDED, ADJUDICATED]
    transitions:
      - from: SUBMITTED
        to: FLAGGED
        trigger: "POST /coop/purchase-reports/{id}/flag"
        actor: ProgramAuditor
        preconditions:
          - "PurchaseReport.status == SUBMITTED (else ERR_INVALID_STATE)"
        side_effects:
          - "PurchaseReport.version incremented"

      - from: FLAGGED
        to: SUBMITTED
        trigger: "POST /coop/purchase-reports/{id}/revise (creates NEW PurchaseReport; marks the FLAGGED one as SUPERSEDED — see SUPERSEDED transition below)"
        actor: MemberRep
        preconditions:
          - "PurchaseReport.status == FLAGGED (else ERR_INVALID_STATE)"
          - "Caller must be MemberRep acting on own member's report (else ERR_FORBIDDEN)"
        side_effects:
          - "Old report transitions FLAGGED -> SUPERSEDED; new report created in SUBMITTED with revision_of_id = old.id"
          - "Old PurchaseReport.version incremented"

      - from: FLAGGED
        to: SUPERSEDED
        trigger: "cascade from revise"
        actor: system
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: ADJUDICATED
        trigger: "cascade from VolumeAudit.resolve"
        actor: system
        preconditions: []
        side_effects:
          - "audited_qty, audited_cents populated from VolumeAudit"
          - "RebateAccrual for (enrollment_id, quarter_index) final_rebate_cents recomputed with audited values"
          - "PurchaseReport.version incremented"

  - entity: VolumeAudit
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: FIELDWORK
        trigger: "POST /coop/volume-audits/{id}/begin_fieldwork"
        actor: ProgramAuditor
        preconditions:
          - "VolumeAudit.status == OPEN (else ERR_INVALID_STATE)"
        side_effects:
          - "VolumeAudit.version incremented"

      - from: FIELDWORK
        to: FINDINGS_ISSUED
        trigger: "POST /coop/volume-audits/{id}/issue_findings"
        actor: ProgramAuditor
        preconditions:
          - "VolumeAudit.status == FIELDWORK (else ERR_INVALID_STATE)"
        side_effects:
          - "VolumeAudit.version incremented"

      - from: FINDINGS_ISSUED
        to: ACCEPTED
        trigger: "POST /coop/volume-audits/{id}/accept_findings"
        actor: MemberRep
        preconditions:
          - "VolumeAudit.status == FINDINGS_ISSUED (else ERR_INVALID_STATE)"
          - "Caller must be MemberRep acting on the member owning the audited enrollment (else ERR_FORBIDDEN)"
        side_effects:
          - "VolumeAudit.version incremented"

      - from: FINDINGS_ISSUED
        to: APPEALED
        trigger: "POST /coop/volume-audits/{id}/appeal"
        actor: MemberRep
        preconditions:
          - "VolumeAudit.status == FINDINGS_ISSUED (else ERR_INVALID_STATE)"
        side_effects:
          - "VolumeAudit.version incremented"

      - from: APPEALED
        to: FIELDWORK
        trigger: "POST /coop/volume-audits/{id}/reopen_fieldwork (cycle back)"
        actor: ProgramAuditor
        preconditions:
          - "VolumeAudit.status == APPEALED (else ERR_INVALID_STATE)"
        side_effects:
          - "VolumeAudit.version incremented"

      - from: ACCEPTED
        to: RESOLVED
        trigger: "POST /coop/volume-audits/{id}/resolve"
        actor: ProgramAuditor
        preconditions:
          - "VolumeAudit.status == ACCEPTED (else ERR_INVALID_STATE)"
          - "Payload carries audited_qty and audited_cents (else ERR_INVALID_REQUEST)"
        side_effects:
          - "resolved_quarter_index = coop.current_quarter_index"
          - "finding_severity computed: NONE if audited_cents == self_report_cents; MINOR if 0 < |delta|/self_report_cents <= 0.05; MATERIAL otherwise"
          - "PurchaseReport referenced by purchase_report_id transitions SUBMITTED -> ADJUDICATED with audited_* fields populated"
          - "RebateAccrual for the (enrollment, quarter) recomputed under final variant; if delta vs prior final differs, mark accrual OPEN (re-finalize at next quarter close)"
          - "If finding_severity == MATERIAL, Member.prior_audit_findings_count += 1 (cascades holdback variant switch on future distributions)"
          - "VolumeAudit.version incremented"

  - entity: RebateAccrual
    initial_state: OPEN
    terminal_states: [CLAWED_BACK]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "cascade from close_quarter"
        actor: system
        preconditions:
          - "All PurchaseReport rows for (enrollment, quarter) are in ADJUDICATED or SUBMITTED (none FLAGGED)"
        side_effects:
          - "final_rebate_cents locked; pass_through_cents and retained_cents computed via pass_through_split"
          - "RebateAccrual.version incremented"

      - from: FINALIZED
        to: DISTRIBUTED
        trigger: "cascade from QuarterlyDistribution DISBURSED"
        actor: system
        preconditions: []
        side_effects:
          - "RebateAccrual.version incremented"

      - from: DISTRIBUTED
        to: CLAWED_BACK
        trigger: "cascade from ClawbackCase RESOLVED with recovered amount"
        actor: system
        preconditions: []
        side_effects:
          - "RebateAccrual.version incremented"

      - from: FINALIZED
        to: OPEN
        trigger: "cascade from VolumeAudit.resolve when audited values differ (re-finalization loop)"
        actor: system
        preconditions: []
        side_effects:
          - "RebateAccrual.version incremented"

  - entity: QuarterlyDistribution
    initial_state: DRAFT
    terminal_states: [RECONCILED]
    transitions:
      - from: DRAFT
        to: CALCULATED
        trigger: "POST /coop/distributions/{id}/calculate"
        actor: CoopAdmin
        preconditions:
          - "QuarterlyDistribution.status == DRAFT (else ERR_INVALID_STATE)"
        side_effects:
          - "Aggregate all RebateAccrual rows with status == FINALIZED and quarter_index == distribution.quarter_index"
          - "gross_rebate_cents, total_pass_through_cents, total_retained_cents computed"
          - "holdback_cents computed per program holdback_policy variant"
          - "clawback_offset_cents computed by summing net_clawback_cents on ClawbackCase rows in {OPEN, NOTIFIED} status"
          - "net_disbursed_cents = total_pass_through_cents - holdback_cents - clawback_offset_cents"
          - "QuarterlyDistribution.version incremented"

      - from: CALCULATED
        to: APPROVED
        trigger: "POST /coop/distributions/{id}/approve"
        actor: FinanceOfficer
        preconditions:
          - "QuarterlyDistribution.status == CALCULATED (else ERR_INVALID_STATE)"
        side_effects:
          - "QuarterlyDistribution.version incremented"

      - from: APPROVED
        to: DISBURSED
        trigger: "POST /coop/distributions/{id}/disburse"
        actor: FinanceOfficer
        preconditions:
          - "QuarterlyDistribution.status == APPROVED (else ERR_INVALID_STATE)"
          - "Coop.pool_reserve_cents >= net_disbursed_cents (else ERR_INSUFFICIENT_POOL)"
        side_effects:
          - "Coop.pool_reserve_cents -= net_disbursed_cents"
          - "Coop.retained_revenue_cents += total_retained_cents"
          - "Each included RebateAccrual transitions FINALIZED -> DISTRIBUTED"
          - "Each Member.lifetime_pass_through_cents incremented by their share"
          - "For each included RebateAccrual whose program's holdback was applied, create HoldbackRelease row in SCHEDULED with release_quarter_index = current_quarter_index + HOLDBACK_LAG_QUARTERS"
          - "QuarterlyDistribution.version incremented"

      - from: DISBURSED
        to: RECONCILED
        trigger: "POST /coop/distributions/{id}/reconcile"
        actor: FinanceOfficer
        preconditions:
          - "QuarterlyDistribution.status == DISBURSED (else ERR_INVALID_STATE)"
        side_effects:
          - "QuarterlyDistribution.version incremented"

  - entity: ClawbackCase
    initial_state: OPEN
    terminal_states: [RESOLVED, WAIVED]
    transitions:
      - from: OPEN
        to: NOTIFIED
        trigger: "POST /coop/clawback-cases/{id}/notify"
        actor: CoopAdmin
        preconditions:
          - "ClawbackCase.status == OPEN (else ERR_INVALID_STATE)"
        side_effects:
          - "ClawbackCase.version incremented"

      - from: NOTIFIED
        to: DISPUTED
        trigger: "POST /coop/clawback-cases/{id}/dispute"
        actor: MemberRep
        preconditions:
          - "ClawbackCase.status == NOTIFIED (else ERR_INVALID_STATE)"
          - "Caller must be MemberRep acting on the case's member_id (else ERR_FORBIDDEN)"
        side_effects:
          - "ClawbackCase.version incremented"

      - from: NOTIFIED
        to: RESOLVED
        trigger: "POST /coop/clawback-cases/{id}/resolve"
        actor: CoopAdmin
        preconditions:
          - "ClawbackCase.status == NOTIFIED (else ERR_INVALID_STATE)"
        side_effects:
          - "recovered_cents = net_clawback_cents; Coop.pool_reserve_cents += recovered_cents"
          - "Member.lifetime_clawback_cents += recovered_cents"
          - "All RebateAccrual rows included in the clawback's compute set transition DISTRIBUTED -> CLAWED_BACK"
          - "ClawbackCase.version incremented"

      - from: DISPUTED
        to: RESOLVED
        trigger: "POST /coop/clawback-cases/{id}/resolve"
        actor: CoopAdmin
        preconditions:
          - "ClawbackCase.status == DISPUTED (else ERR_INVALID_STATE)"
        side_effects:
          - "recovered_cents = net_clawback_cents; pool and member ledgers updated as in NOTIFIED->RESOLVED"
          - "RebateAccrual rows transition DISTRIBUTED -> CLAWED_BACK"
          - "ClawbackCase.version incremented"

      - from: DISPUTED
        to: WAIVED
        trigger: "POST /coop/clawback-cases/{id}/waive"
        actor: CoopAdmin
        preconditions:
          - "ClawbackCase.status == DISPUTED (else ERR_INVALID_STATE)"
        side_effects:
          - "recovered_cents remains 0"
          - "ClawbackCase.version incremented"

      - from: NOTIFIED
        to: WAIVED
        trigger: "POST /coop/clawback-cases/{id}/waive"
        actor: CoopAdmin
        preconditions:
          - "ClawbackCase.status == NOTIFIED (else ERR_INVALID_STATE)"
        side_effects:
          - "recovered_cents remains 0"
          - "ClawbackCase.version incremented"

  - entity: HoldbackRelease
    initial_state: SCHEDULED
    terminal_states: [RELEASED, FORFEITED]
    transitions:
      - from: SCHEDULED
        to: RELEASED
        trigger: "cascade from close_quarter when current_quarter_index >= release_quarter_index"
        actor: system
        preconditions:
          - "Member.status != CHURNED at time of release (if CHURNED, FORFEITED instead)"
        side_effects:
          - "Coop.pool_reserve_cents -= release_cents"
          - "Member.lifetime_pass_through_cents += release_cents"
          - "HoldbackRelease.version incremented"

      - from: SCHEDULED
        to: FORFEITED
        trigger: "cascade from Member.churn (member churns before release)"
        actor: system
        preconditions: []
        side_effects:
          - "Holdback value is redirected to offset the member's gross clawback (netted in clawback_amount calculation)"
          - "HoldbackRelease.version incremented"

# =============================================================================
# Concurrency Rules (OCC — see SKILL.md §1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: program-amend-stale-version
    parent_entity: SupplierProgram
    write_endpoint: "PUT /coop/supplier-programs/{id}"
    occ_field: "expected_program_version"
    description: |
      Amending a SupplierProgram whose version has advanced since the client
      last observed it is rejected. This captures the case where another
      SupplierRep has just amended the program (e.g., a renegotiation round
      that legitimately supersedes the prior terms) and the current writer's
      view of the program is stale.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412

  - rule_id: distribution-recalc-stale-version
    parent_entity: QuarterlyDistribution
    write_endpoint: "POST /coop/distributions/{id}/calculate"
    occ_field: "expected_distribution_version"
    description: |
      Recalculating a QuarterlyDistribution whose version has advanced since
      the client last observed it is rejected. This captures the case where a
      prior calculate call (or a late-arriving audit resolution that cascaded
      into a recompute) has bumped the distribution version and the current
      request's view of the distribution is stale.
    error_id: ERR_STALE_DISTRIBUTION_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: rebate_tier_resolution
    trigger: "PurchaseReport submission (provisional) and VolumeAudit.resolve (final)"
    algorithm: tiered_pricing
    formula: |
      Inputs: tier_schedule (list of {min_qty, rate_bps} ascending by min_qty), eligible_qty, eligible_cents.
      Step 1: applicable_tier = the LAST tier t in tier_schedule such that eligible_qty >= t.min_qty.
              If no such tier exists (eligible_qty < tier_schedule[0].min_qty), applicable_tier = {min_qty: 0, rate_bps: 0}.
      Step 2: rebate_cents = floor(eligible_cents * applicable_tier.rate_bps / 10000).
      Boundary rule: eligibility uses >=, NOT >. At the exact min_qty, the tier IS applied.
      Rounding: floor to whole cents AFTER the multiplication and division, not per-tier.
    input_set: "PurchaseReport rows for one (enrollment_id, quarter_index). Provisional variant uses self_report_qty/self_report_cents; final variant uses audited_qty/audited_cents when audit resolved, else falls back to self_report values."
    constants:
      BPS_DENOMINATOR: 10000
    precision: "integer cents, floor rounding"
    variants:
      - name: provisional
        when: "PurchaseReport submission (before any audit)"
        difference: "Uses self_report_qty, self_report_cents. Result stored in RebateAccrual.provisional_rebate_cents."
      - name: final
        when: "VolumeAudit.resolve OR quarter-close finalization when no audit exists"
        difference: "Uses audited_qty, audited_cents when present; else self_report values. Result stored in RebateAccrual.final_rebate_cents."

  - name: pass_through_split
    trigger: "RebateAccrual OPEN -> FINALIZED"
    algorithm: tiered_pricing
    formula: |
      Inputs: member.commitment_level, final_rebate_cents.
      Rates:
        PLATINUM: member receives 8500 bps (85%) of final_rebate_cents; co-op retains 1500 bps.
        STANDARD: member receives 7500 bps (75%); co-op retains 2500 bps.
        BUILDER:  member receives 6500 bps (65%); co-op retains 3500 bps.
      Step 1: pass_through_cents = floor(final_rebate_cents * member_rate_bps / 10000).
      Step 2: retained_cents = final_rebate_cents - pass_through_cents.
      Invariant: pass_through_cents + retained_cents == final_rebate_cents (exactly, no cent drift).
    input_set: "Single RebateAccrual being finalized."
    constants:
      PLATINUM_BPS: 8500
      STANDARD_BPS: 7500
      BUILDER_BPS: 6500
      BPS_DENOMINATOR: 10000
    precision: "integer cents, floor rounding; retained_cents is the complement"
    variants:
      - name: by_commitment_level
        when: "At finalization"
        difference: "Different bps rate per commitment_level enum value."

  - name: holdback_calculation
    trigger: "QuarterlyDistribution CALCULATED"
    algorithm: threshold
    formula: |
      Inputs: total_pass_through_cents, member.prior_audit_findings_count (for each contributing member),
              program.holdback_policy.
      FLAT variant: holdback_cents = floor(total_pass_through_cents * FLAT_HOLDBACK_BPS / 10000).
      RISK_ADJUSTED variant (per-member): for each member, base = FLAT_HOLDBACK_BPS;
        if member.prior_audit_findings_count >= MATERIAL_FINDING_THRESHOLD,
          member_rate = RISK_HOLDBACK_BPS; else member_rate = FLAT_HOLDBACK_BPS.
        member_holdback = floor(member_pass_through * member_rate / 10000).
        holdback_cents = sum(member_holdback over contributing members).
      Boundary: threshold uses >=, so exactly MATERIAL_FINDING_THRESHOLD findings triggers RISK_HOLDBACK_BPS.
    input_set: "All RebateAccrual rows included in the distribution being calculated."
    constants:
      FLAT_HOLDBACK_BPS: 1000
      RISK_HOLDBACK_BPS: 2500
      MATERIAL_FINDING_THRESHOLD: 2
      BPS_DENOMINATOR: 10000
    precision: "integer cents, floor rounding per member"
    variants:
      - name: flat
        when: "program.holdback_policy == FLAT"
        difference: "Single flat rate applied to total_pass_through_cents."
      - name: risk_adjusted
        when: "program.holdback_policy == RISK_ADJUSTED"
        difference: "Per-member rate selected by prior_audit_findings_count threshold."

  - name: exclusivity_share_calculation
    trigger: "close_quarter"
    algorithm: aggregation
    formula: |
      Inputs: ProgramEnrollment row, PurchaseReport data for the enrollment's (member, quarter),
              supplier's program.
      Step 1: eligible_cents_in_program = sum of audited_cents (or self_report_cents if unaudited)
              across PurchaseReport rows for THIS enrollment at this quarter.
      Step 2: eligible_cents_total = sum of audited_cents (or self_report_cents if unaudited) across
              ALL PurchaseReport rows for THIS member at this quarter (any enrollment, any supplier
              in the same product category — approximated as all the member's reports).
      Step 3: if eligible_cents_total == 0: exclusivity_share_pct = 0.
              Else exclusivity_share_pct = floor(eligible_cents_in_program * 100 / eligible_cents_total).
      Step 4: exclusivity_status:
        - if program.exclusivity_required == false: NOT_APPLICABLE
        - elif exclusivity_share_pct >= program.exclusivity_threshold_pct: COMPLIANT
        - else: SHORTFALL
      Boundary: >= (not >); at exactly threshold_pct, status is COMPLIANT.
    input_set: "All ProgramEnrollment rows with status ACTIVE at quarter close."
    precision: "integer percentage, floor rounding"
    variants: []

  - name: clawback_amount
    trigger: "Member.churn OR VolumeAudit.resolve with MATERIAL finding OR exclusivity SHORTFALL at quarter close"
    algorithm: waterfall_allocation
    formula: |
      Inputs: member_id, trigger_reason.
      Compute set: all RebateAccrual rows for this member with status in {DISTRIBUTED}.
      Step 1 (gross variant): gross_clawback_cents = sum of pass_through_cents across compute set.
      Step 2 (offset): forfeited_holdback_cents = sum of release_cents over HoldbackRelease rows
        for this member currently in SCHEDULED (these transition to FORFEITED).
      Step 3 (net variant): net_clawback_cents = max(0, gross_clawback_cents - forfeited_holdback_cents).
      Invariant: gross_clawback_cents - forfeited_holdback_cents - net_clawback_cents == 0 OR
                 gross_clawback_cents - forfeited_holdback_cents <= 0 with net == 0.
      Order: forfeiture is applied first (Step 2), then netting (Step 3). Reversing the order
             produces different results when forfeited_holdback > gross.
    input_set: "RebateAccrual rows with member_id, status == DISTRIBUTED; HoldbackRelease rows with member_id, status == SCHEDULED."
    precision: "integer cents"
    variants:
      - name: gross
        when: "Reporting / member notification"
        difference: "Total clawback before any offsets. Stored in gross_clawback_cents."
      - name: net
        when: "Actual cash demand"
        difference: "Gross minus forfeited holdbacks. Stored in net_clawback_cents; floor at 0."

  - name: pool_reserve_reconciliation
    trigger: "QuarterlyDistribution DISBURSED, HoldbackRelease RELEASED, ClawbackCase RESOLVED"
    algorithm: aggregation
    formula: |
      Coop.pool_reserve_cents is a running balance:
        += each SupplierProgram accrual's final_rebate_cents when the accrual is FINALIZED at close_quarter
        -= QuarterlyDistribution.net_disbursed_cents when DISBURSED
        -= HoldbackRelease.release_cents when RELEASED
        += ClawbackCase.recovered_cents when RESOLVED
      Invariant: pool_reserve_cents >= 0 at all times; disburse is rejected with ERR_INSUFFICIENT_POOL
                 if net_disbursed_cents > pool_reserve_cents.
    input_set: "All mutating events touching the pool."
    precision: "integer cents"
    variants: []

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-templated resource IDs exist (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: business_referential
    check: "Body-referenced FKs resolve to existing entities (member_id, program_id, purchase_report_id, invoice_id, etc.)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: "all endpoints taking FKs in body"

  - priority: 5
    category: state
    check: "Target resource is in the correct state for this transition per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_safety
    check: "Coop invariant — pool_reserve_cents >= net_disbursed_cents at disburse"
    error_id: ERR_INSUFFICIENT_POOL
    http_status: 409
    applies_to: "POST /coop/distributions/{id}/disburse"

  - priority: 7
    category: business_fiscal
    check: "PurchaseReport submission quarter matches Coop.current_quarter_index (no early, no late)"
    error_id: ERR_QUARTER_MISMATCH
    http_status: 409
    applies_to: "POST /coop/enrollments/{id}/purchase-reports"

  - priority: 8
    category: business_fiscal
    check: "Pass-through + retained must equal final_rebate (no cent drift) — sanity check at finalize"
    error_id: ERR_SPLIT_MISMATCH
    http_status: 500
    applies_to: "system invariant during RebateAccrual finalization"

  - priority: 9
    category: business_constraint
    check: "SupplierProgram.tier_schedule non-empty, ascending by min_qty, all rate_bps in [0, 10000]"
    error_id: ERR_INVALID_TIER_SCHEDULE
    http_status: 422
    applies_to: "POST /coop/suppliers/{id}/supplier-programs, PUT /coop/supplier-programs/{id}, POST /coop/supplier-programs/{id}/open"

  - priority: 10
    category: business_constraint
    check: "exclusivity_threshold_pct in [1,100] when exclusivity_required is true"
    error_id: ERR_INVALID_EXCLUSIVITY
    http_status: 422
    applies_to: "POST /coop/suppliers/{id}/supplier-programs, PUT /coop/supplier-programs/{id}, POST /coop/supplier-programs/{id}/open"

  - priority: 11
    category: business_constraint
    check: "SupplierProgram.program_code unique within supplier among non-TERMINATED programs"
    error_id: ERR_DUPLICATE_PROGRAM_CODE
    http_status: 409
    applies_to: "POST /coop/suppliers/{id}/supplier-programs"

  - priority: 12
    category: business_temporal
    check: "Cannot exit enrollment that started in a future quarter; cannot submit report for quarter that hasn't started"
    error_id: ERR_FUTURE_QUARTER
    http_status: 409
    applies_to: "POST /coop/enrollments/{id}/exit, POST /coop/enrollments/{id}/purchase-reports"

  - priority: 13
    category: business_referential
    check: "Member must be ACTIVE to enroll in a program or submit a purchase report"
    error_id: ERR_MEMBER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /coop/enrollments, POST /coop/enrollments/{id}/purchase-reports"

  - priority: 14
    category: business_referential
    check: "SupplierProgram must be OPEN or REOPENED to accept new enrollments"
    error_id: ERR_PROGRAM_NOT_OPEN
    http_status: 409
    applies_to: "POST /coop/enrollments"

  - priority: 15
    category: business_referential
    check: "Supplier must be ONBOARDED before its program can be opened"
    error_id: ERR_SUPPLIER_NOT_ONBOARDED
    http_status: 409
    applies_to: "POST /coop/supplier-programs/{id}/open"

  - priority: 16
    category: business_constraint
    check: "Program cannot terminate with ACTIVE or SUSPENDED enrollments"
    error_id: ERR_PROGRAM_HAS_ENROLLMENTS
    http_status: 409
    applies_to: "POST /coop/supplier-programs/{id}/terminate"

  - priority: 17
    category: business_constraint
    check: "Supplier cannot deactivate with programs in OPEN/CLOSED_TO_NEW/REOPENED"
    error_id: ERR_SUPPLIER_HAS_ACTIVE_PROGRAMS
    http_status: 409
    applies_to: "POST /coop/suppliers/{id}/deactivate"

  - priority: 18
    category: business_referential
    check: "MemberRep ownership — X-User-ID must equal the target Member.id for member-scoped operations"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /coop/purchase-reports/{id}/revise, POST /coop/volume-audits/{id}/accept_findings, POST /coop/volume-audits/{id}/appeal, POST /coop/clawback-cases/{id}/dispute"

  - priority: 19
    category: business_safety
    check: "Reinstate blocked while any ClawbackCase for member is OPEN, NOTIFIED, or DISPUTED"
    error_id: ERR_OPEN_CLAWBACK
    http_status: 409
    applies_to: "POST /coop/members/{id}/reinstate"

  - priority: 20
    category: business_constraint
    check: "OCC — expected_program_version must equal current SupplierProgram.version"
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412
    applies_to: "PUT /coop/supplier-programs/{id}"

  - priority: 21
    category: business_constraint
    check: "OCC — expected_distribution_version must equal current QuarterlyDistribution.version"
    error_id: ERR_STALE_DISTRIBUTION_VERSION
    http_status: 412
    applies_to: "POST /coop/distributions/{id}/calculate"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- Coop bootstrap & clock ---
  - method: POST
    path: "/coop/bootstrap"
    description: "Initialize the Co-op (one-time). Returns the singleton Coop entity."
    roles: [CoopAdmin]
    code: 201
    input: [name]
    output: Coop
    side_effects:
      - "Coop created with current_quarter_index=0, pool_reserve_cents=0, retained_revenue_cents=0"

  - method: GET
    path: "/coop"
    description: "Get the Co-op singleton"
    roles: [CoopAdmin, FinanceOfficer, SupplierRep, MemberRep, ProgramAuditor]
    code: 200
    input: []
    output: Coop
    side_effects: []

  - method: POST
    path: "/coop/_clock/set_current_utc"
    description: "Test-driving endpoint — set the logical clock. Server default time before any call is 2026-08-01T00:00:00Z."
    roles: [CoopAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: []

  - method: POST
    path: "/coop/close_quarter"
    description: "Advance Coop.current_quarter_index by 1; finalize OPEN RebateAccrual rows for the closing quarter; compute exclusivity_share_pct on all ACTIVE enrollments; release due HoldbackRelease rows"
    roles: [CoopAdmin]
    code: 200
    input: []
    output: Coop
    side_effects:
      - "Coop.current_quarter_index += 1"
      - "For each RebateAccrual with status == OPEN and quarter_index == closing quarter: transition to FINALIZED; compute final_rebate_cents (final variant of rebate_tier_resolution), pass_through_cents, retained_cents; Coop.pool_reserve_cents += final_rebate_cents"
      - "For each ProgramEnrollment with status == ACTIVE: recompute exclusivity_share_pct and exclusivity_status; if exclusivity_status flips to SHORTFALL and program.exclusivity_required is true, auto-create ClawbackCase with trigger_reason=EXCLUSIVITY_BREACH"
      - "For each HoldbackRelease with status == SCHEDULED and release_quarter_index <= new current_quarter_index and member not CHURNED: transition to RELEASED; decrement pool, increment member.lifetime_pass_through_cents"
      - "Coop.version incremented"

  # --- Members ---
  - method: POST
    path: "/coop/members"
    description: "Enroll a new member (PENDING until activated)"
    roles: [CoopAdmin]
    code: 201
    input: [legal_name, commitment_level]
    output: Member
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/coop/members/{id}"
    description: "Get a Member"
    roles: [CoopAdmin, FinanceOfficer, ProgramAuditor, MemberRep]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: GET
    path: "/coop/members"
    description: "List Members"
    roles: [CoopAdmin, FinanceOfficer, ProgramAuditor]
    code: 200
    input: ["status?", "commitment_level?", "limit?", "offset?"]
    output: "Member[]"
    side_effects: []

  - method: POST
    path: "/coop/members/{id}/activate"
    description: "Activate a PENDING member"
    roles: [CoopAdmin]
    code: 200
    input: []
    output: Member
    side_effects: ["status PENDING -> ACTIVE, enrolled_quarter_index=current_quarter_index"]

  - method: POST
    path: "/coop/members/{id}/suspend"
    description: "Suspend an ACTIVE member (cascades to enrollments)"
    roles: [CoopAdmin]
    code: 200
    input: []
    output: Member
    side_effects: ["status ACTIVE -> SUSPENDED, all ACTIVE enrollments -> SUSPENDED"]

  - method: POST
    path: "/coop/members/{id}/reinstate"
    description: "Reinstate a SUSPENDED member"
    roles: [CoopAdmin]
    code: 200
    input: []
    output: Member
    side_effects: ["status SUSPENDED -> ACTIVE, all SUSPENDED enrollments -> ACTIVE"]

  - method: POST
    path: "/coop/members/{id}/churn"
    description: "Churn a member (cascades enrollment exit, holdback forfeit, clawback creation)"
    roles: [CoopAdmin]
    code: 200
    input: []
    output: Member
    side_effects:
      - "status -> CHURNED, churn_quarter_index=current_quarter_index"
      - "All ACTIVE/SUSPENDED enrollments -> EXITED"
      - "Auto-create ClawbackCase(trigger_reason=CHURN)"
      - "All SCHEDULED HoldbackRelease -> FORFEITED"

  # --- Suppliers ---
  - method: POST
    path: "/coop/suppliers"
    description: "Create a supplier in PROSPECT status"
    roles: [CoopAdmin]
    code: 201
    input: [legal_name, "onboarding_notes?"]
    output: Supplier
    side_effects: ["status=PROSPECT"]

  - method: GET
    path: "/coop/suppliers/{id}"
    description: "Get a Supplier"
    roles: [CoopAdmin, SupplierRep, FinanceOfficer, ProgramAuditor]
    code: 200
    input: []
    output: Supplier
    side_effects: []

  - method: GET
    path: "/coop/suppliers"
    description: "List Suppliers"
    roles: [CoopAdmin, FinanceOfficer, ProgramAuditor, SupplierRep]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Supplier[]"
    side_effects: []

  - method: POST
    path: "/coop/suppliers/{id}/onboard"
    description: "Onboard a PROSPECT supplier"
    roles: [CoopAdmin]
    code: 200
    input: []
    output: Supplier
    side_effects: ["status PROSPECT -> ONBOARDED"]

  - method: POST
    path: "/coop/suppliers/{id}/deactivate"
    description: "Deactivate an ONBOARDED supplier (requires no active programs)"
    roles: [CoopAdmin]
    code: 200
    input: []
    output: Supplier
    side_effects: ["status ONBOARDED -> INACTIVE; DRAFT programs -> TERMINATED"]

  # --- Supplier Programs ---
  - method: POST
    path: "/coop/suppliers/{id}/supplier-programs"
    description: "Create a new SupplierProgram in DRAFT status"
    roles: [SupplierRep, CoopAdmin]
    code: 201
    input: [program_code, exclusivity_required, exclusivity_threshold_pct, tier_schedule, holdback_policy]
    output: SupplierProgram
    side_effects: ["status=DRAFT, negotiation_round=0"]

  - method: GET
    path: "/coop/supplier-programs/{id}"
    description: "Get a SupplierProgram"
    roles: [CoopAdmin, SupplierRep, FinanceOfficer, ProgramAuditor, MemberRep]
    code: 200
    input: []
    output: SupplierProgram
    side_effects: []

  - method: GET
    path: "/coop/supplier-programs"
    description: "List SupplierPrograms"
    roles: [CoopAdmin, SupplierRep, FinanceOfficer, ProgramAuditor, MemberRep]
    code: 200
    input: ["supplier_id?", "status?", "limit?", "offset?"]
    output: "SupplierProgram[]"
    side_effects: []

  - method: PUT
    path: "/coop/supplier-programs/{id}"
    description: "Amend a SupplierProgram (renegotiation). OCC-guarded via expected_program_version. Increments negotiation_round."
    roles: [SupplierRep]
    code: 200
    input: [expected_program_version, "tier_schedule?", "exclusivity_required?", "exclusivity_threshold_pct?", "holdback_policy?"]
    output: SupplierProgram
    side_effects:
      - "negotiation_round += 1"
      - "SupplierProgram.version incremented"
      - "May only amend while status in {DRAFT, OPEN, CLOSED_TO_NEW, REOPENED}; TERMINATED returns ERR_INVALID_STATE"

  - method: POST
    path: "/coop/supplier-programs/{id}/open"
    description: "Open a DRAFT program for enrollment"
    roles: [SupplierRep]
    code: 200
    input: []
    output: SupplierProgram
    side_effects: ["status DRAFT -> OPEN"]

  - method: POST
    path: "/coop/supplier-programs/{id}/close_to_new"
    description: "Stop accepting new enrollments (existing members continue)"
    roles: [SupplierRep]
    code: 200
    input: []
    output: SupplierProgram
    side_effects: ["status OPEN/REOPENED -> CLOSED_TO_NEW"]

  - method: POST
    path: "/coop/supplier-programs/{id}/reopen"
    description: "Reopen a CLOSED_TO_NEW program"
    roles: [SupplierRep]
    code: 200
    input: []
    output: SupplierProgram
    side_effects: ["status CLOSED_TO_NEW -> REOPENED"]

  - method: POST
    path: "/coop/supplier-programs/{id}/terminate"
    description: "Terminate a program (requires no ACTIVE/SUSPENDED enrollments)"
    roles: [SupplierRep]
    code: 200
    input: []
    output: SupplierProgram
    side_effects: ["status -> TERMINATED"]

  # --- Enrollments ---
  - method: POST
    path: "/coop/enrollments"
    description: "Enroll a Member in a SupplierProgram"
    roles: [CoopAdmin, MemberRep]
    code: 201
    input: [member_id, program_id]
    output: ProgramEnrollment
    side_effects:
      - "status=ACTIVE, enrolled_quarter_index=current_quarter_index"
      - "ERR_MEMBER_NOT_ACTIVE unless Member.status == ACTIVE"
      - "ERR_PROGRAM_NOT_OPEN unless SupplierProgram.status in {OPEN, REOPENED}"

  - method: GET
    path: "/coop/enrollments/{id}"
    description: "Get a ProgramEnrollment"
    roles: [CoopAdmin, FinanceOfficer, ProgramAuditor, MemberRep, SupplierRep]
    code: 200
    input: []
    output: ProgramEnrollment
    side_effects: []

  - method: GET
    path: "/coop/enrollments"
    description: "List ProgramEnrollments (filterable by member_id or program_id)"
    roles: [CoopAdmin, FinanceOfficer, ProgramAuditor, MemberRep, SupplierRep]
    code: 200
    input: ["member_id?", "program_id?", "status?", "limit?", "offset?"]
    output: "ProgramEnrollment[]"
    side_effects: []

  - method: POST
    path: "/coop/enrollments/{id}/exit"
    description: "Voluntarily exit an ACTIVE enrollment (no clawback)"
    roles: [CoopAdmin, MemberRep]
    code: 200
    input: []
    output: ProgramEnrollment
    side_effects: ["status ACTIVE -> EXITED, exit_quarter_index=current_quarter_index"]

  # --- Purchase Reports ---
  - method: POST
    path: "/coop/enrollments/{id}/purchase-reports"
    description: "Submit a member's self-reported purchase volume for the current quarter"
    roles: [MemberRep, CoopAdmin]
    code: 201
    input: [quarter_index, self_report_qty, self_report_cents]
    output: PurchaseReport
    side_effects:
      - "status=SUBMITTED, submitted_at_quarter=current_quarter_index"
      - "Find or create RebateAccrual for (enrollment, quarter); recompute provisional_rebate_cents (provisional variant)"

  - method: GET
    path: "/coop/purchase-reports/{id}"
    description: "Get a PurchaseReport"
    roles: [CoopAdmin, FinanceOfficer, ProgramAuditor, MemberRep]
    code: 200
    input: []
    output: PurchaseReport
    side_effects: []

  - method: GET
    path: "/coop/enrollments/{id}/purchase-reports"
    description: "List PurchaseReports for an enrollment"
    roles: [CoopAdmin, FinanceOfficer, ProgramAuditor, MemberRep]
    code: 200
    input: ["quarter_index?", "status?", "limit?", "offset?"]
    output: "PurchaseReport[]"
    side_effects: []

  - method: GET
    path: "/coop/purchase-reports"
    description: "List PurchaseReports (filtered list form for FK reverse-reachability)"
    roles: [CoopAdmin, FinanceOfficer, ProgramAuditor, MemberRep]
    code: 200
    input: ["enrollment_id?", "revision_of_id?", "quarter_index?", "status?", "limit?", "offset?"]
    output: "PurchaseReport[]"
    side_effects: []

  - method: GET
    path: "/coop/purchase-reports/{id}/volume-audits"
    description: "List VolumeAudits targeting a given PurchaseReport"
    roles: [CoopAdmin, FinanceOfficer, ProgramAuditor, MemberRep]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "VolumeAudit[]"
    side_effects: []

  - method: POST
    path: "/coop/purchase-reports/{id}/flag"
    description: "Flag a SUBMITTED report for audit review"
    roles: [ProgramAuditor]
    code: 200
    input: []
    output: PurchaseReport
    side_effects: ["status SUBMITTED -> FLAGGED"]

  - method: POST
    path: "/coop/purchase-reports/{id}/revise"
    description: "Member revises a FLAGGED report — creates new SUBMITTED row; marks the old FLAGGED row SUPERSEDED"
    roles: [MemberRep]
    code: 201
    input: [self_report_qty, self_report_cents]
    output: PurchaseReport
    side_effects:
      - "Old report FLAGGED -> SUPERSEDED"
      - "New report created in SUBMITTED with revision_of_id=old.id, same quarter_index"
      - "Recompute RebateAccrual.provisional_rebate_cents"

  # --- Volume Audits ---
  - method: POST
    path: "/coop/volume-audits"
    description: "Open a VolumeAudit against a SUBMITTED PurchaseReport"
    roles: [ProgramAuditor]
    code: 201
    input: [purchase_report_id]
    output: VolumeAudit
    side_effects:
      - "status=OPEN, opened_quarter_index=current_quarter_index"
      - "enrollment_id derived from purchase_report_id"

  - method: GET
    path: "/coop/volume-audits/{id}"
    description: "Get a VolumeAudit"
    roles: [CoopAdmin, FinanceOfficer, ProgramAuditor, MemberRep]
    code: 200
    input: []
    output: VolumeAudit
    side_effects: []

  - method: GET
    path: "/coop/volume-audits"
    description: "List VolumeAudits"
    roles: [CoopAdmin, FinanceOfficer, ProgramAuditor, MemberRep]
    code: 200
    input: ["enrollment_id?", "status?", "finding_severity?", "limit?", "offset?"]
    output: "VolumeAudit[]"
    side_effects: []

  - method: POST
    path: "/coop/volume-audits/{id}/begin_fieldwork"
    description: "Move audit from OPEN to FIELDWORK"
    roles: [ProgramAuditor]
    code: 200
    input: []
    output: VolumeAudit
    side_effects: ["status OPEN -> FIELDWORK"]

  - method: POST
    path: "/coop/volume-audits/{id}/issue_findings"
    description: "Issue findings — move to FINDINGS_ISSUED"
    roles: [ProgramAuditor]
    code: 200
    input: []
    output: VolumeAudit
    side_effects: ["status FIELDWORK -> FINDINGS_ISSUED"]

  - method: POST
    path: "/coop/volume-audits/{id}/accept_findings"
    description: "Member accepts findings — move to ACCEPTED"
    roles: [MemberRep]
    code: 200
    input: []
    output: VolumeAudit
    side_effects: ["status FINDINGS_ISSUED -> ACCEPTED"]

  - method: POST
    path: "/coop/volume-audits/{id}/appeal"
    description: "Member appeals findings — move to APPEALED"
    roles: [MemberRep]
    code: 200
    input: []
    output: VolumeAudit
    side_effects: ["status FINDINGS_ISSUED -> APPEALED"]

  - method: POST
    path: "/coop/volume-audits/{id}/reopen_fieldwork"
    description: "Auditor reopens fieldwork after appeal (cycle APPEALED -> FIELDWORK)"
    roles: [ProgramAuditor]
    code: 200
    input: []
    output: VolumeAudit
    side_effects: ["status APPEALED -> FIELDWORK"]

  - method: POST
    path: "/coop/volume-audits/{id}/resolve"
    description: "Resolve an ACCEPTED audit; final audited values retroactively mutate downstream accrual"
    roles: [ProgramAuditor]
    code: 200
    input: [audited_qty, audited_cents]
    output: VolumeAudit
    side_effects:
      - "status ACCEPTED -> RESOLVED"
      - "PurchaseReport transitions SUBMITTED -> ADJUDICATED with audited_* populated"
      - "RebateAccrual recomputed (final variant); if accrual was already FINALIZED, transition it back to OPEN for re-finalization at next quarter close"
      - "If finding_severity == MATERIAL, Member.prior_audit_findings_count += 1"
      - "If MATERIAL and accrual was previously DISTRIBUTED, auto-create ClawbackCase(trigger_reason=AUDIT_SHORTFALL)"

  # --- Rebate Accruals ---
  - method: GET
    path: "/coop/rebate-accruals/{id}"
    description: "Get a RebateAccrual"
    roles: [CoopAdmin, FinanceOfficer, ProgramAuditor, MemberRep]
    code: 200
    input: []
    output: RebateAccrual
    side_effects: []

  - method: GET
    path: "/coop/rebate-accruals"
    description: "List RebateAccruals"
    roles: [CoopAdmin, FinanceOfficer, ProgramAuditor, MemberRep]
    code: 200
    input: ["enrollment_id?", "quarter_index?", "status?", "limit?", "offset?"]
    output: "RebateAccrual[]"
    side_effects: []

  # --- Quarterly Distributions ---
  - method: POST
    path: "/coop/distributions"
    description: "Create a QuarterlyDistribution for the current quarter (DRAFT)"
    roles: [FinanceOfficer]
    code: 201
    input: []
    output: QuarterlyDistribution
    side_effects: ["status=DRAFT, quarter_index=current_quarter_index, all computed totals=0"]

  - method: GET
    path: "/coop/distributions/{id}"
    description: "Get a QuarterlyDistribution"
    roles: [CoopAdmin, FinanceOfficer, ProgramAuditor, MemberRep]
    code: 200
    input: []
    output: QuarterlyDistribution
    side_effects: []

  - method: GET
    path: "/coop/distributions"
    description: "List QuarterlyDistributions"
    roles: [CoopAdmin, FinanceOfficer, ProgramAuditor]
    code: 200
    input: ["coop_id?", "quarter_index?", "status?", "limit?", "offset?"]
    output: "QuarterlyDistribution[]"
    side_effects: []

  - method: POST
    path: "/coop/distributions/{id}/calculate"
    description: "Calculate the distribution totals. OCC-guarded via expected_distribution_version."
    roles: [FinanceOfficer]
    code: 200
    input: [expected_distribution_version]
    output: QuarterlyDistribution
    side_effects:
      - "status DRAFT -> CALCULATED"
      - "Aggregate RebateAccrual rows with status == FINALIZED and quarter_index == distribution.quarter_index"
      - "Compute gross_rebate_cents, total_pass_through_cents, total_retained_cents, holdback_cents, clawback_offset_cents, net_disbursed_cents"
      - "Increments QuarterlyDistribution.version by 1"

  - method: POST
    path: "/coop/distributions/{id}/approve"
    description: "Approve a CALCULATED distribution"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: QuarterlyDistribution
    side_effects: ["status CALCULATED -> APPROVED"]

  - method: POST
    path: "/coop/distributions/{id}/disburse"
    description: "Disburse an APPROVED distribution (requires sufficient pool)"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: QuarterlyDistribution
    side_effects:
      - "status APPROVED -> DISBURSED"
      - "pool_reserve_cents -= net_disbursed_cents; retained_revenue_cents += total_retained_cents"
      - "Included accruals FINALIZED -> DISTRIBUTED; Member.lifetime_pass_through_cents updated"
      - "Create HoldbackRelease rows in SCHEDULED"

  - method: POST
    path: "/coop/distributions/{id}/reconcile"
    description: "Reconcile a DISBURSED distribution"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: QuarterlyDistribution
    side_effects: ["status DISBURSED -> RECONCILED"]

  # --- Clawback Cases ---
  - method: GET
    path: "/coop/clawback-cases/{id}"
    description: "Get a ClawbackCase"
    roles: [CoopAdmin, FinanceOfficer, MemberRep]
    code: 200
    input: []
    output: ClawbackCase
    side_effects: []

  - method: GET
    path: "/coop/clawback-cases"
    description: "List ClawbackCases"
    roles: [CoopAdmin, FinanceOfficer, MemberRep]
    code: 200
    input: ["member_id?", "status?", "trigger_reason?", "limit?", "offset?"]
    output: "ClawbackCase[]"
    side_effects: []

  - method: POST
    path: "/coop/clawback-cases/{id}/notify"
    description: "Notify member of clawback"
    roles: [CoopAdmin]
    code: 200
    input: []
    output: ClawbackCase
    side_effects: ["status OPEN -> NOTIFIED"]

  - method: POST
    path: "/coop/clawback-cases/{id}/dispute"
    description: "Member disputes the clawback"
    roles: [MemberRep]
    code: 200
    input: [dispute_note]
    output: ClawbackCase
    side_effects: ["status NOTIFIED -> DISPUTED"]

  - method: POST
    path: "/coop/clawback-cases/{id}/resolve"
    description: "Resolve a clawback — recovers net amount"
    roles: [CoopAdmin]
    code: 200
    input: []
    output: ClawbackCase
    side_effects:
      - "status -> RESOLVED"
      - "recovered_cents = net_clawback_cents; pool_reserve_cents += recovered_cents"
      - "Member.lifetime_clawback_cents += recovered_cents"
      - "Included RebateAccrual rows DISTRIBUTED -> CLAWED_BACK"

  - method: POST
    path: "/coop/clawback-cases/{id}/waive"
    description: "Waive a clawback (no recovery)"
    roles: [CoopAdmin]
    code: 200
    input: []
    output: ClawbackCase
    side_effects: ["status -> WAIVED, recovered_cents remains 0"]

  # --- Holdback Releases ---
  - method: GET
    path: "/coop/holdback-releases/{id}"
    description: "Get a HoldbackRelease"
    roles: [CoopAdmin, FinanceOfficer, MemberRep]
    code: 200
    input: []
    output: HoldbackRelease
    side_effects: []

  - method: GET
    path: "/coop/holdback-releases"
    description: "List HoldbackReleases"
    roles: [CoopAdmin, FinanceOfficer, MemberRep]
    code: 200
    input: ["member_id?", "status?", "source_distribution_id?", "limit?", "offset?"]
    output: "HoldbackRelease[]"
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "MemberRep attempting to act on another member's resource" }

  # --- Existence ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-templated resource id does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 422, condition: "Body FK references a non-existent entity" }

  # --- State ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a state that permits this transition" }

  # --- Fiscal / Pool ---
  - { id: ERR_INSUFFICIENT_POOL, http: 409, condition: "pool_reserve_cents < net_disbursed_cents at disburse time" }
  - { id: ERR_QUARTER_MISMATCH, http: 409, condition: "PurchaseReport quarter_index does not equal Coop.current_quarter_index" }
  - { id: ERR_FUTURE_QUARTER, http: 409, condition: "Action would reference a future quarter" }
  - { id: ERR_SPLIT_MISMATCH, http: 500, condition: "pass_through_cents + retained_cents != final_rebate_cents (invariant violation)" }

  # --- Business constraint (program/supplier) ---
  - { id: ERR_INVALID_TIER_SCHEDULE, http: 422, condition: "tier_schedule empty, non-ascending, or rate_bps out of [0,10000]" }
  - { id: ERR_INVALID_EXCLUSIVITY, http: 422, condition: "exclusivity_threshold_pct out of [1,100] while exclusivity_required=true" }
  - { id: ERR_DUPLICATE_PROGRAM_CODE, http: 409, condition: "program_code already in use for this supplier among non-TERMINATED programs" }
  - { id: ERR_SUPPLIER_NOT_ONBOARDED, http: 409, condition: "Supplier not ONBOARDED; program cannot open" }
  - { id: ERR_SUPPLIER_HAS_ACTIVE_PROGRAMS, http: 409, condition: "Supplier has programs in OPEN/CLOSED_TO_NEW/REOPENED; cannot deactivate" }
  - { id: ERR_PROGRAM_NOT_OPEN, http: 409, condition: "SupplierProgram not in {OPEN, REOPENED}; cannot accept enrollments" }
  - { id: ERR_PROGRAM_HAS_ENROLLMENTS, http: 409, condition: "SupplierProgram has ACTIVE/SUSPENDED enrollments; cannot terminate" }
  - { id: ERR_MEMBER_NOT_ACTIVE, http: 409, condition: "Member.status != ACTIVE; cannot enroll or submit reports" }
  - { id: ERR_OPEN_CLAWBACK, http: 409, condition: "Member has OPEN/NOTIFIED/DISPUTED ClawbackCase; reinstate blocked" }

  # --- Concurrency ---
  - { id: ERR_STALE_PROGRAM_VERSION, http: 412, condition: "expected_program_version mismatch on SupplierProgram amendment" }
  - { id: ERR_STALE_DISTRIBUTION_VERSION, http: 412, condition: "expected_distribution_version mismatch on distribution recalculation" }

  # --- Request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Body failed schema validation (missing required field, wrong type, negative amount where positive required)" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: CoopAdmin
    description: "Co-op operations administrator: enrollment, member lifecycle, clawback administration"
    identity: opaque
    exclusive_operations:
      - "POST /coop/bootstrap"
      - "POST /coop/_clock/set_current_utc"
      - "POST /coop/close_quarter"
      - "POST /coop/members"
      - "POST /coop/members/{id}/activate, /suspend, /reinstate, /churn"
      - "POST /coop/suppliers"
      - "POST /coop/suppliers/{id}/onboard, /deactivate"
      - "POST /coop/clawback-cases/{id}/notify, /resolve, /waive"
    shared_operations:
      - "GET /coop, /coop/members/{id}, /coop/suppliers/{id}, /coop/supplier-programs/{id}, /coop/enrollments/{id}, /coop/purchase-reports/{id}, /coop/volume-audits/{id}, /coop/rebate-accruals/{id}, /coop/distributions/{id}, /coop/clawback-cases/{id}, /coop/holdback-releases/{id}"
      - "GET list endpoints (members, suppliers, supplier-programs, enrollments, purchase-reports, volume-audits, rebate-accruals, distributions, clawback-cases, holdback-releases)"
      - "POST /coop/enrollments (with MemberRep)"
      - "POST /coop/enrollments/{id}/exit (with MemberRep)"
      - "POST /coop/enrollments/{id}/purchase-reports (with MemberRep)"
      - "POST /coop/suppliers/{id}/supplier-programs (with SupplierRep)"

  - name: MemberRep
    description: "Member retailer's authorized representative: submits purchase reports, responds to audits, disputes clawbacks"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /coop/purchase-reports/{id}/revise"
      - "POST /coop/volume-audits/{id}/accept_findings, /appeal"
      - "POST /coop/clawback-cases/{id}/dispute"
    shared_operations:
      - "POST /coop/enrollments (with CoopAdmin)"
      - "POST /coop/enrollments/{id}/exit (with CoopAdmin)"
      - "POST /coop/enrollments/{id}/purchase-reports (with CoopAdmin)"
      - "GET own member record, own enrollments, own purchase reports, own audits, own clawbacks, own holdback releases"

  - name: SupplierRep
    description: "Supplier's program manager: defines and amends programs, opens/closes/terminates them"
    identity: "entity_backed:Supplier"
    exclusive_operations:
      - "PUT /coop/supplier-programs/{id}"
      - "POST /coop/supplier-programs/{id}/open, /close_to_new, /reopen, /terminate"
    shared_operations:
      - "POST /coop/suppliers/{id}/supplier-programs (with CoopAdmin)"
      - "GET supplier, program, enrollment list endpoints"

  - name: FinanceOfficer
    description: "Co-op finance: runs quarterly distribution calculate/approve/disburse/reconcile"
    identity: opaque
    exclusive_operations:
      - "POST /coop/distributions"
      - "POST /coop/distributions/{id}/calculate, /approve, /disburse, /reconcile"
    shared_operations:
      - "GET list/detail endpoints (all)"

  - name: ProgramAuditor
    description: "Independent volume auditor: flags reports, conducts audits, resolves findings"
    identity: opaque
    exclusive_operations:
      - "POST /coop/volume-audits"
      - "POST /coop/purchase-reports/{id}/flag"
      - "POST /coop/volume-audits/{id}/begin_fieldwork, /issue_findings, /reopen_fieldwork, /resolve"
    shared_operations:
      - "GET list/detail endpoints (all)"
