              as_user_id: "dc-op-1"
          trigger:
            - call: "POST /items"
              payload: { sku: "SKU-UNQ-CS", description: "Duplicate sku", manufacturer_code: "MFR-OMNI", uom: "EA", wac_cents: 100, handling_class: "AMBIENT" }
              as: ContractAdmin
              captures: { e_sku: $.data.error_id }
            - call: "POST /contracts"
              payload: { manufacturer_code: "MFR-OMNI", contract_code: "CTR-UNQ", tier: "TIER_2", member_class_scope: "NON_ACUTE", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-06-30T23:59:59Z" }
              as: ContractAdmin
