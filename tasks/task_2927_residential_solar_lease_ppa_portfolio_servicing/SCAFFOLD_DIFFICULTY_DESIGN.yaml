            - "after run-credit-review, TransferCase.${tc_asm_id}.status == CREDIT_APPROVED and credit_composite_score == 86.67 and credit_decision == APPROVED and required_deposit_cents == 0"
            - "after the second clear-title, TransferCase.${tc_asm_id}.status == TITLE_CLEARED and payoff_method == NONE and payoff_quote_cents == 0"
