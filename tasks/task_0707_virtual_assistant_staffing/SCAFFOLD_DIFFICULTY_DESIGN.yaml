            - "Task.${task}.completed_at_iso == 2026-03-02T00:00:01Z"
            - "Task.${task}.sla_state == RESOLUTION_BREACHED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      # --- 9.A hour-bank conservation: cancel rejects LOGGED entry -> consumed_hours unchanged
      - name: cancel_rejects_logged_entry_leaves_consumed_hours_invariant
        grounds:
          - state_machines.Task.to_CANCELLED
          - state_machines.TimeEntry.LOGGED_to_REJECTED
          - calculations.cycle_balance
          - entities.RetainerCycle.fields.consumed_hours
          - entities.RetainerCycle.fields.available_hours
        distinguishing_aspect: |
          Conserved quantity #1 = the cycle hour-bank (consumed_hours / available_hours). The
          forward action (logging time) and its compensating action (task cancel -> entry
          REJECTED) MUST leave consumed_hours pinned at the formula sum over APPROVED entries
          only: with one APPROVED 4.0h entry plus one LOGGED 2.0h entry, cancelling the task
          rejects the LOGGED entry and consumed_hours stays exactly 4.0 (never 6.0), so
          available_hours stays 6.0 of a 10h bank — zero drift.
        test_recipe:
          setup:
            - "Client ACTIVE, 10h bank. One task with one APPROVED 4.0h entry (raw 240) and one LOGGED 2.0h entry (raw 120)."
            - "Before cancel: consumed_hours=4.0, available_hours=6.0."
          setup_api_calls:
            - call: "POST /va-staffing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: StaffingManager
            - call: "POST /va-staffing/skill-tags"
              payload: { code: "ACCOUNTS_PAYABLE", name: "AP", is_specialized: false }
              as: StaffingManager
              captures: { skill: $.data.id }
