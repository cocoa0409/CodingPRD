      - name: certificate_issuance_then_revocation_restores_ledger_identity_while_both_counters_grow
        grounds:
          - calculations.provider_ledger_balance
          - calculations.certificate_validity_window
          - state_machines.Certificate.ISSUED_to_REVOKED
          - endpoints[POST /security-incidents/{id}/resolution]
          - entities.TrainingProvider.fields.credit_balance_cents
