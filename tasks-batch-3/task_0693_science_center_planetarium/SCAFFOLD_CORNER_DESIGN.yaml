scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_venue_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Venue, endpoints]
        distinguishing_aspect: "POST /venues with all required fields returns 201 and a Venue whose status==ACTIVE, version==1, and seated_capacity echoes input."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /venues"
              payload: { name: "Dome Z", venue_type: "DOME", seated_capacity: 50, accessible_seats: 6 }
              as: FacilityAdmin
              captures: { vid: $.data.id, vstatus: $.data.status, vver: $.data.version }
          assert:
            - "Venue.${vid}.status == ACTIVE"
            - "Venue.${vid}.version == 1"
            - "Venue.${vid}.seated_capacity == 50"

      - name: get_show_returns_stored_entity
        claim_type: Retrieval
        grounds: [entities.ShowEvent, endpoints]
        distinguishing_aspect: "GET /shows/{id} returns the stored ShowEvent with title and base_price_cents matching what was created."
        test_recipe:
          setup: ["One DOME venue and one show created."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Dome M", venue_type: "DOME", seated_capacity: 40 }
              as: FacilityAdmin
              captures: { vid: $.data.id }
            - call: "POST /shows"
              payload: { venue_id: "${vid}", title: "Nebula", starts_at: "2026-04-30T10:00:00Z", ends_at: "2026-04-30T11:00:00Z", base_price_cents: 1800 }
              as: BoxOfficeOperator
              captures: { sid: $.data.id }
          trigger:
            - call: "GET /shows/${sid}"
              payload: {}
              as: BoxOfficeOperator
              captures: { t: $.data.title, p: $.data.base_price_cents }
          assert:
            - "ShowEvent.${sid}.title == Nebula"
            - "ShowEvent.${sid}.base_price_cents == 1800"

      - name: list_venues_paginated_envelope
        claim_type: Listing
        grounds: [entities.Venue, endpoints]
        distinguishing_aspect: "GET /venues returns an array response with pagination meta total_count and has_more after two venues are created."
        test_recipe:
          setup: ["Two venues created."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V1", venue_type: "DOME", seated_capacity: 30 }
              as: FacilityAdmin
            - call: "POST /venues"
              payload: { name: "V2", venue_type: "CLASSROOM", seated_capacity: 20 }
              as: FacilityAdmin
          trigger:
            - call: "GET /venues"
              payload: { limit: 10, offset: 0 }
              as: FacilityAdmin
          assert:
            - "response.total_count == 2"
            - "response.has_more == false"

      - name: get_membership_not_found
        claim_type: Not Found
        grounds: [entities.Membership, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /memberships/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /memberships/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: MembershipClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_NOT_FOUND"
            - "response.http_status == 404"

      - name: create_show_missing_required_field
        claim_type: Required Fields
        grounds: [entities.ShowEvent, "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /shows missing base_price_cents returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["One DOME venue."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Dome N", venue_type: "DOME", seated_capacity: 30 }
              as: FacilityAdmin
              captures: { vid: $.data.id }
          trigger:
            - call: "POST /shows"
              payload: { venue_id: "${vid}", title: "NoPrice", starts_at: "2026-05-01T10:00:00Z", ends_at: "2026-05-01T11:00:00Z" }
              as: BoxOfficeOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_REQUEST"

      - name: show_default_feature_surcharge_applied
        claim_type: Defaults
        grounds: [entities.ShowEvent.fields.feature_surcharge_cents]
        distinguishing_aspect: "Omitting feature_surcharge_cents on POST /shows yields feature_surcharge_cents==0 (default)."
        test_recipe:
          setup: ["One DOME venue."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Dome O", venue_type: "DOME", seated_capacity: 30 }
              as: FacilityAdmin
              captures: { vid: $.data.id }
          trigger:
            - call: "POST /shows"
              payload: { venue_id: "${vid}", title: "PlainShow", starts_at: "2026-05-03T10:00:00Z", ends_at: "2026-05-03T11:00:00Z", base_price_cents: 1200 }
              as: BoxOfficeOperator
              captures: { sid: $.data.id, fs: $.data.feature_surcharge_cents }
          assert:
            - "ShowEvent.${sid}.feature_surcharge_cents == 0"

      - name: membership_astc_eligible_computed
        claim_type: Computed Fields
        grounds: [entities.Membership.fields.astc_eligible, calculations.astc_reciprocal_eligibility]
        distinguishing_aspect: "A FAMILY membership has astc_eligible==true while an INDIVIDUAL membership has astc_eligible==false; the field is computed, input-supplied values ignored."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /memberships"
              payload: { primary_member_name: "Ind", tier: "INDIVIDUAL", home_zip: "90210", party_size: 1 }
              as: MembershipClerk
              captures: { ind_id: $.data.id, ind_astc: $.data.astc_eligible }
          trigger:
            - call: "POST /memberships"
              payload: { primary_member_name: "Fam2", tier: "FAMILY", home_zip: "90210", party_size: 3 }
              as: MembershipClerk
              captures: { fam_id: $.data.id, fam_astc: $.data.astc_eligible }
          assert:
            - "Membership.${ind_id}.astc_eligible == false"
            - "Membership.${fam_id}.astc_eligible == true"

      - name: venue_system_fields_generated
        claim_type: System Fields
        grounds: [entities.Venue.fields.status]
        distinguishing_aspect: "On POST /venues the server generates id and sets status=ACTIVE even if the client attempts to send a status (status is source:system, not an accepted input)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /venues"
              payload: { name: "Dome P", venue_type: "DOME", seated_capacity: 25 }
              as: FacilityAdmin
              captures: { vid: $.data.id, st: $.data.status }
          assert:
            - "Venue.${vid}.status == ACTIVE"

      - name: membership_invalid_tier_enum
        claim_type: Type Constraints
        grounds: [entities.Membership.fields.tier, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /memberships with tier='GOLD' (not in enum) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /memberships"
              payload: { primary_member_name: "Bad", tier: "GOLD", home_zip: "90210" }
              as: MembershipClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_REQUEST"

      - name: contribution_immutable_no_version
        claim_type: Immutability
        grounds: [entities.Contribution]
        distinguishing_aspect: "Contribution has common_fields:false — no version field and no update endpoint exists; it is append-only with status always RECEIVED."
        test_recipe:
          setup: ["A sponsor with one recorded contribution."]
          setup_api_calls:
            - call: "POST /sponsors"
              payload: { org_name: "Imm", sponsor_kind: "DONOR", pledged_cents: 10000 }
              as: DevelopmentOfficer
              captures: { sid: $.data.id, sv: $.data.version }
            - call: "POST /sponsors/${sid}/contributions"
              payload: { amount_cents: 4000, expected_sponsor_version: "${sv}" }
              as: DevelopmentOfficer
              captures: { cstatus: $.data.status }
          trigger:
            - call: "GET /sponsors/${sid}/contributions"
              payload: {}
              as: DevelopmentOfficer
          assert:
            - "first Contribution.status == RECEIVED"

      - name: show_create_wrong_parent_venue_type
        claim_type: Parent Relationships
        grounds: [entities.ShowEvent.fields.venue_id, "validations[priority=11]", "errors[ERR_VENUE_TYPE_MISMATCH]"]
        distinguishing_aspect: "Creating a show whose venue_id points to a CLASSROOM venue returns ERR_VENUE_TYPE_MISMATCH (422)."
        test_recipe:
          setup: ["One CLASSROOM venue."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Room W", venue_type: "CLASSROOM", seated_capacity: 20 }
              as: FacilityAdmin
              captures: { vid: $.data.id }
          trigger:
            - call: "POST /shows"
              payload: { venue_id: "${vid}", title: "WrongVenue", starts_at: "2026-05-04T10:00:00Z", ends_at: "2026-05-04T11:00:00Z", base_price_cents: 1000 }
              as: BoxOfficeOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_VENUE_TYPE_MISMATCH"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: open_already_open_show_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.ShowEvent.SCHEDULED_to_OPEN, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /shows/{id}/open on an already-OPEN show returns ERR_INVALID_STATE (409); no further version bump beyond the first open."
        test_recipe:
          setup: ["A show opened once."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Dome Q", venue_type: "DOME", seated_capacity: 30 }
              as: FacilityAdmin
              captures: { vid: $.data.id }
            - call: "POST /shows"
              payload: { venue_id: "${vid}", title: "Once", starts_at: "2026-05-05T10:00:00Z", ends_at: "2026-05-05T11:00:00Z", base_price_cents: 1000 }
              as: BoxOfficeOperator
              captures: { sid: $.data.id }
            - call: "POST /shows/${sid}/open"
              payload: {}
              as: BoxOfficeOperator
          trigger:
            - call: "POST /shows/${sid}/open"
              payload: {}
              as: BoxOfficeOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE"

      - name: cancel_already_cancelled_show_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.ShowEvent.OPEN_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A CANCELLED show is terminal: a second POST /shows/{id}/cancel returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A show opened then cancelled."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Dome R", venue_type: "DOME", seated_capacity: 30 }
              as: FacilityAdmin
              captures: { vid: $.data.id }
            - call: "POST /shows"
              payload: { venue_id: "${vid}", title: "Term", starts_at: "2026-05-06T10:00:00Z", ends_at: "2026-05-06T11:00:00Z", base_price_cents: 1000 }
              as: BoxOfficeOperator
              captures: { sid: $.data.id }
            - call: "POST /shows/${sid}/open"
              payload: {}
              as: BoxOfficeOperator
            - call: "POST /shows/${sid}/cancel"
              payload: {}
              as: BoxOfficeOperator
          trigger:
            - call: "POST /shows/${sid}/cancel"
              payload: {}
              as: BoxOfficeOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE"

      - name: new_show_starts_in_scheduled
        claim_type: Initial State
        grounds: [state_machines.ShowEvent]
        distinguishing_aspect: "A newly created ShowEvent has status==SCHEDULED (the declared initial_state)."
        test_recipe:
          setup: ["One DOME venue."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Dome S", venue_type: "DOME", seated_capacity: 30 }
              as: FacilityAdmin
              captures: { vid: $.data.id }
          trigger:
            - call: "POST /shows"
              payload: { venue_id: "${vid}", title: "Init", starts_at: "2026-05-07T10:00:00Z", ends_at: "2026-05-07T11:00:00Z", base_price_cents: 1000 }
              as: BoxOfficeOperator
              captures: { sid: $.data.id, st: $.data.status }
          assert:
            - "ShowEvent.${sid}.status == SCHEDULED"

      - name: hold_expiry_sweep_cancels_held_booking
        claim_type: Side Effect Execution
        grounds: [state_machines.ShowBooking.HELD_to_CANCELLED, entities.ShowBooking.fields.held_at, endpoints]
        distinguishing_aspect: "After the 30-min hold window elapses and a sweep runs, a HELD booking becomes CANCELLED and its seat is released (seats_sold returns to 0)."
        test_recipe:
          setup: ["An OPEN show with a HELD 1-seat booking held at 2026-03-01T00:00:00Z; clock advanced 31 minutes."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Dome T", venue_type: "DOME", seated_capacity: 30 }
              as: FacilityAdmin
              captures: { vid: $.data.id }
            - call: "POST /shows"
              payload: { venue_id: "${vid}", title: "Sweep", starts_at: "2026-04-01T10:00:00Z", ends_at: "2026-04-01T11:00:00Z", base_price_cents: 1000 }
              as: BoxOfficeOperator
              captures: { sid: $.data.id }
            - call: "POST /shows/${sid}/open"
              payload: {}
              as: BoxOfficeOperator
              captures: { sv: $.data.version }
            - call: "POST /show-bookings"
              payload: { show_event_id: "${sid}", party_size: 1, expected_show_version: "${sv}" }
              as: BoxOfficeOperator
              captures: { bid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:31:00Z" }
              as: FacilityAdmin
          trigger:
            - call: "POST /_sweeps/run"
              payload: {}
              as: FacilityAdmin
            - call: "GET /show-bookings/${bid}"
              payload: {}
              as: BoxOfficeOperator
              captures: { bstatus: $.data.status }
          assert:
            - "ShowBooking.${bid}.status == CANCELLED"
            - "ShowEvent.${sid}.seats_sold == 0"

      - name: confirm_booking_after_hold_window_expired
        claim_type: guarded transitions
        grounds: [state_machines.ShowBooking.HELD_to_CONFIRMED, "validations[priority=13]", "errors[ERR_HOLD_EXPIRED]"]
        distinguishing_aspect: "Confirming a HELD booking after the clock passes held_at+30min returns ERR_HOLD_EXPIRED (409)."
        test_recipe:
          setup: ["An OPEN show with a HELD booking; clock advanced 31 minutes past held_at."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Dome U", venue_type: "DOME", seated_capacity: 30 }
              as: FacilityAdmin
              captures: { vid: $.data.id }
            - call: "POST /shows"
              payload: { venue_id: "${vid}", title: "Expire", starts_at: "2026-04-02T10:00:00Z", ends_at: "2026-04-02T11:00:00Z", base_price_cents: 1000 }
              as: BoxOfficeOperator
              captures: { sid: $.data.id }
            - call: "POST /shows/${sid}/open"
              payload: {}
              as: BoxOfficeOperator
              captures: { sv: $.data.version }
            - call: "POST /show-bookings"
              payload: { show_event_id: "${sid}", party_size: 1, expected_show_version: "${sv}" }
              as: BoxOfficeOperator
              captures: { bid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:31:00Z" }
              as: FacilityAdmin
          trigger:
            - call: "POST /show-bookings/${bid}/confirm"
              payload: {}
              as: BoxOfficeOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_HOLD_EXPIRED"

      - name: program_cancel_cascades_all_registrations
        claim_type: Cascade down
        grounds: [state_machines.ProgramSession.ENROLLING_to_CANCELLED, state_machines.Registration.ENROLLED_to_CANCELLED]
        distinguishing_aspect: "POST /programs/{id}/cancel sets every ENROLLED/WAITLISTED Registration to CANCELLED and enrolled_count to 0."
        test_recipe:
          setup: ["A CLASSROOM session capacity 5 with two ENROLLED registrations."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Room X", venue_type: "CLASSROOM", seated_capacity: 20 }
              as: FacilityAdmin
              captures: { vid: $.data.id }
            - call: "POST /programs"
              payload: { venue_id: "${vid}", title: "CascadeCamp", program_kind: "CAMP", min_age: 5, max_age: 99, starts_at: "2026-08-01T09:00:00Z", capacity: 5, tuition_cents: 5000 }
              as: ProgramCoordinator
              captures: { pid: $.data.id, pv1: $.data.version }
            - call: "POST /registrations"
              payload: { program_session_id: "${pid}", participant_name: "R1", participant_age: 10, expected_session_version: "${pv1}" }
              as: ProgramCoordinator
              captures: { r1: $.data.id }
            - call: "GET /programs/${pid}"
              payload: {}
              as: ProgramCoordinator
              captures: { pv2: $.data.version }
            - call: "POST /registrations"
              payload: { program_session_id: "${pid}", participant_name: "R2", participant_age: 11, expected_session_version: "${pv2}" }
              as: ProgramCoordinator
              captures: { r2: $.data.id }
          trigger:
            - call: "POST /programs/${pid}/cancel"
              payload: {}
              as: ProgramCoordinator
          assert:
            - "Registration.${r1}.status == CANCELLED"
            - "Registration.${r2}.status == CANCELLED"
            - "ProgramSession.${pid}.enrolled_count == 0"

      - name: program_full_bubbles_up_on_last_enroll
        claim_type: Bubble up
        grounds: [state_machines.ProgramSession.ENROLLING_to_FULL, state_machines.Registration.WAITLISTED_to_ENROLLED]
        distinguishing_aspect: "Enrolling the registration that brings enrolled_count to capacity auto-transitions the ProgramSession to FULL (bubble-up)."
        test_recipe:
          setup: ["A CLASSROOM session capacity 1, no registrations yet."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Room Y", venue_type: "CLASSROOM", seated_capacity: 20 }
              as: FacilityAdmin
              captures: { vid: $.data.id }
            - call: "POST /programs"
              payload: { venue_id: "${vid}", title: "FillCamp", program_kind: "CLASS", min_age: 5, max_age: 99, starts_at: "2026-08-02T09:00:00Z", capacity: 1, tuition_cents: 5000 }
              as: ProgramCoordinator
              captures: { pid: $.data.id, pv1: $.data.version }
          trigger:
            - call: "POST /registrations"
              payload: { program_session_id: "${pid}", participant_name: "Only", participant_age: 10, expected_session_version: "${pv1}" }
              as: ProgramCoordinator
              captures: { rid: $.data.id }
            - call: "GET /programs/${pid}"
              payload: {}
              as: ProgramCoordinator
              captures: { pstatus: $.data.status }
          assert:
            - "Registration.${rid}.status == ENROLLED"
            - "ProgramSession.${pid}.status == FULL"

      - name: sponsor_contribution_advances_fulfillment_state
        claim_type: Cross-entity
        grounds: [state_machines.Sponsor.PLEDGED_to_PARTIALLY_FULFILLED, entities.Sponsor.fields.received_cents, entities.Sponsor.fields.fulfillment_ratio]
        distinguishing_aspect: "A partial contribution (3000 of 10000) advances Sponsor to PARTIALLY_FULFILLED with received_cents==3000 and fulfillment_ratio==0.3."
        test_recipe:
          setup: ["A sponsor pledged 10000."]
          setup_api_calls:
            - call: "POST /sponsors"
              payload: { org_name: "Partial", sponsor_kind: "SPONSOR", pledged_cents: 10000 }
              as: DevelopmentOfficer
              captures: { sid: $.data.id, sv: $.data.version }
          trigger:
            - call: "POST /sponsors/${sid}/contributions"
              payload: { amount_cents: 3000, expected_sponsor_version: "${sv}" }
              as: DevelopmentOfficer
            - call: "GET /sponsors/${sid}"
              payload: {}
              as: DevelopmentOfficer
              captures: { st: $.data.status, rc: $.data.received_cents, fr: $.data.fulfillment_ratio }
          assert:
            - "Sponsor.${sid}.status == PARTIALLY_FULFILLED"
            - "Sponsor.${sid}.received_cents == 3000"
            - "Sponsor.${sid}.fulfillment_ratio == 0.3"

      - name: accommodation_approve_then_fulfill
        claim_type: Valid Transition
        grounds: [state_machines.AccommodationRequest.SUBMITTED_to_APPROVED, state_machines.AccommodationRequest.APPROVED_to_FULFILLED]
        distinguishing_aspect: "A SENSORY_FRIENDLY accommodation on a registration can be approved then fulfilled, ending FULFILLED."
        test_recipe:
          setup: ["A CLASSROOM session with one ENROLLED registration and a SUBMITTED sensory accommodation on it."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Room Z", venue_type: "CLASSROOM", seated_capacity: 20 }
              as: FacilityAdmin
              captures: { vid: $.data.id }
            - call: "POST /programs"
              payload: { venue_id: "${vid}", title: "AccCamp", program_kind: "CAMP", min_age: 5, max_age: 99, starts_at: "2026-08-03T09:00:00Z", capacity: 5, tuition_cents: 5000 }
              as: ProgramCoordinator
              captures: { pid: $.data.id, pv1: $.data.version }
            - call: "POST /registrations"
              payload: { program_session_id: "${pid}", participant_name: "Acc", participant_age: 10, expected_session_version: "${pv1}" }
              as: ProgramCoordinator
              captures: { rid: $.data.id }
            - call: "POST /accommodations"
              payload: { subject_type: "REGISTRATION", accommodation_kind: "SENSORY_FRIENDLY", registration_id: "${rid}" }
              as: AccessibilityCoordinator
              captures: { aid: $.data.id }
            - call: "POST /accommodations/${aid}/approve"
              payload: {}
              as: AccessibilityCoordinator
          trigger:
            - call: "POST /accommodations/${aid}/fulfill"
              payload: {}
              as: AccessibilityCoordinator
              captures: { ast: $.data.status }
          assert:
            - "AccommodationRequest.${aid}.status == FULFILLED"

      - name: refund_conserves_seats_excluded
        claim_type: Compensation
        grounds: [state_machines.ShowBooking.CONFIRMED_to_REFUNDED]
        excluded_because:
          difficulty_instance: compensating_invariant / show_refund_conserves_seats_and_cents
          rationale: "The CONFIRMED->REFUNDED seat/cents conservation is asserted directly by the named §1.8 compensating-invariant instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: nonmember_show_pricing_no_discount
        claim_type: Correct Result
        grounds: [calculations.show_admission_pricing, entities.ShowBooking.fields.net_price_cents]
        distinguishing_aspect: "A non-member 2-seat hold on a show base=2000 surcharge=500 gets member_discount_cents==0 and net_price_cents==5000."
        test_recipe:
          setup: ["An OPEN show base=2000 surcharge=500."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Dome AA", venue_type: "DOME", seated_capacity: 40 }
              as: FacilityAdmin
              captures: { vid: $.data.id }
            - call: "POST /shows"
              payload: { venue_id: "${vid}", title: "NM", starts_at: "2026-05-10T10:00:00Z", ends_at: "2026-05-10T11:00:00Z", base_price_cents: 2000, feature_surcharge_cents: 500 }
              as: BoxOfficeOperator
              captures: { sid: $.data.id }
            - call: "POST /shows/${sid}/open"
              payload: {}
              as: BoxOfficeOperator
              captures: { sv: $.data.version }
          trigger:
            - call: "POST /show-bookings"
              payload: { show_event_id: "${sid}", party_size: 2, expected_show_version: "${sv}" }
              as: BoxOfficeOperator
              captures: { bid: $.data.id }
          assert:
