# =============================================================================
# Task 1812: Industrial MRO Distribution — §1.8 Scaffold Difficulty Design
# Test Targeting Index: 9 Difficulty Rules x >=2 instances.
# All money in integer cents. The logical clock defaults to
# 2026-08-01T00:00:00Z before any /_clock/set_current_utc call.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: rebate_provisional_average_vs_final_marginal
        grounds:
          - calculations.rebate_accrual_and_trueup
          - state_machines.RebateAgreement.ACTIVE_to_CLOSED
          - entities.RebateAgreement.fields.provisional_rebate_cents
          - entities.RebateAgreement.fields.final_rebate_cents
        distinguishing_aspect: |
          Dual variant on the RebateAgreement domain: the provisional variant applies
          the reached tier's rate to ALL accrued spend (average rate) while the final
          variant tiers spend into marginal bands — for identical accrued spend of
          15,000,000 cents they diverge (300,000 vs 200,000).
        test_recipe:
          setup:
            - "National-account customer, credit limit 100,000,000"
            - "RebateAgreement ACTIVE, period [2026-07-01, 2026-09-30], tiers [{0,100bps},{10000000,200bps}]"
            - "One WILL_CALL order of one STOCKED item (list 15,000,000, qty 1) confirmed, readied, fulfilled, completed on the default clock 2026-08-01"
            - "Accrued spend therefore 15,000,000 -> tier index 1 -> provisional 300,000"
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "NAT-1", display_name: "National One", is_national_account: true, credit_limit_cents: 100000000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /mro/customers/${cust_id}/rebate-agreements"
              payload: { period_start: "2026-07-01", period_end: "2026-09-30", tiers: [{ threshold_cents: 0, rebate_bps: 100 }, { threshold_cents: 10000000, rebate_bps: 200 }] }
              as: DistributionAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /mro/rebate-agreements/${agr_id}/activate"
              as: DistributionAdmin
            - call: "POST /mro/items"
              payload: { sku: "BIG-1", description: "Capital equipment", item_class: "STOCKED", list_price_cents: 15000000 }
              as: DistributionAdmin
              captures: { item_id: $.data.id }
            - call: "POST /mro/locations"
              payload: { location_code: "BR-1", location_type: "BRANCH", region_state: "OH", same_day_cutoff_minute: 900 }
              as: DistributionAdmin
              captures: { br_id: $.data.id }
            - call: "POST /mro/locations/${br_id}/restock"
              payload: { item_id: "${item_id}", qty: 1 }
              as: DistributionAdmin
            - call: "POST /mro/orders"
              payload: { customer_id: "${cust_id}", fulfillment_branch_id: "${br_id}", fulfillment_method: "WILL_CALL", lines: [{ item_id: "${item_id}", qty: 1 }] }
              as: DistributionAdmin
              captures: { ord_id: $.data.id }
            - call: "POST /mro/orders/${ord_id}/confirm"
              as: DistributionAdmin
            - call: "POST /mro/orders/${ord_id}/mark-ready"
              as: BranchManager
            - call: "POST /mro/orders/${ord_id}/mark-fulfilled"
              as: BranchManager
            - call: "POST /mro/orders/${ord_id}/complete"
              as: DistributionAdmin
            - call: "GET /mro/rebate-agreements/${agr_id}"
              as: DistributionAdmin
              captures: { pre_tier: $.data.current_tier_index, pre_prov: $.data.provisional_rebate_cents, pre_accrued: $.data.accrued_spend_cents }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: DistributionAdmin
            - call: "POST /mro/rebate-agreements/${agr_id}/close"
              as: DistributionAdmin
              captures: { post_final: $.data.final_rebate_cents, post_delta: $.data.true_up_delta_cents }
          assert:
            - "pre_accrued == 15000000 and pre_tier == 1 (spend 15,000,000 >= threshold 10,000,000)"
            - "pre_prov == 300000 (average-rate variant: 15,000,000 * 200bps)"
            - "post_final == 200000 (marginal-band variant: 10,000,000*100bps + 5,000,000*200bps)"
            - "post_delta == -100000 (true-up clawback; the two variants diverge on identical spend)"

      - name: drop_ship_provisional_vs_final_margin
        grounds:
          - calculations.drop_ship_margin
          - state_machines.SalesOrder.SUBMITTED_to_CONFIRMED
          - entities.OrderLine.fields.provisional_margin_cents
          - entities.OrderLine.fields.final_margin_cents
        distinguishing_aspect: |
          Dual variant on the OrderLine economics domain (different entity domain than
          the rebate instance): the provisional variant prices vendor cost from item
          estimates at confirm; the final variant actualizes with vendor-supplied costs
          at vendor-confirm — same sell price, different margin (900 vs 950).
        test_recipe:
          setup:
            - "Customer credit limit 1,000,000; SPECIAL_ORDER drop-ship-eligible item, list 1,000, vendor cost estimate 500/unit, freight estimate 100/line"
            - "Branch with zero stock of the item and no central stock -> the waterfall routes all units to drop-ship"
            - "Order STANDARD, 2 units, CONFIRMED -> qty_drop_ship 2, provisional margin 2,000 - (1,000 + 100) = 900"
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "DS-C", display_name: "DropShip Co", credit_limit_cents: 1000000, primary_ship_to_state: "TX" }
              as: DistributionAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /mro/items"
              payload: { sku: "DS-1", description: "Vendor special", item_class: "SPECIAL_ORDER", list_price_cents: 1000, drop_ship_eligible: true, vendor_cost_estimate_cents: 500, vendor_freight_estimate_cents: 100 }
              as: DistributionAdmin
              captures: { item_id: $.data.id }
            - call: "POST /mro/locations"
              payload: { location_code: "BR-2", location_type: "BRANCH", region_state: "TX", same_day_cutoff_minute: 900 }
              as: DistributionAdmin
              captures: { br_id: $.data.id }
            - call: "POST /mro/orders"
              payload: { customer_id: "${cust_id}", fulfillment_branch_id: "${br_id}", fulfillment_method: "STANDARD", lines: [{ item_id: "${item_id}", qty: 2 }] }
              as: DistributionAdmin
              captures: { ord_id: $.data.id }
            - call: "POST /mro/orders/${ord_id}/confirm"
              as: DistributionAdmin
            - call: "GET /mro/orders/${ord_id}/lines"
              as: DistributionAdmin
              captures: { line_id: "$.data[0].id", prov_margin: "$.data[0].provisional_margin_cents", src: "$.data[0].fulfillment_source" }
          trigger:
            - call: "POST /mro/orders/${ord_id}/vendor-confirm"
              payload: { actual_costs: [{ order_line_id: "${line_id}", vendor_cost_actual_cents: 450, freight_actual_cents: 150 }] }
              as: VendorRep
            - call: "GET /mro/orders/${ord_id}/lines"
              as: DistributionAdmin
              captures: { final_margin: "$.data[0].final_margin_cents", qvc: "$.data[0].qty_vendor_confirmed", mstat: "$.data[0].margin_status" }
          assert:
            - "src == DROP_SHIP_ONLY and prov_margin == 900 (estimated variant: 2*1000 - (2*500 + 100))"
            - "final_margin == 950 (actualized variant: 2*1000 - (2*450 + 150)); the variants diverge by +50 on identical sell data"
            - "qvc == 2 and mstat == FINALIZED"

  - rule_id: combinatorial_formula
    instances:
      - name: qty_tiered_contract_price_resolution
        grounds:
          - calculations.order_line_unit_price
          - entities.PriceMatrixRule.fields.rule_type
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — customer tier selects the
          rule set, rule specificity (item-level FIXED_PRICE beats class-level
          DISCOUNT_PCT) selects the base, the half-open window filters candidates, and
          the whole-quantity tier (>=50 -> 5%, >=10 -> 3%) applies a second rounded
          multiplier, capped at list price.
        test_recipe:
          setup:
            - "SILVER customer; item1 STOCKED list 1,000 with an ACTIVE SILVER item-level FIXED_PRICE 850 rule; item2 STOCKED list 500 with only the class-level rule"
            - "Class rule: SILVER x STOCKED DISCOUNT_PCT 10, window [2026-01-01, 2027-01-01); item rule same window; both ACTIVE (default clock 2026-08-01 inside)"
            - "Branch stocked with 60 of item1 and 12 of item2"
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "SLV-1", display_name: "Silver Co", price_tier: "SILVER", credit_limit_cents: 10000000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /mro/items"
              payload: { sku: "P-100", description: "Fastener box", item_class: "STOCKED", list_price_cents: 1000 }
              as: DistributionAdmin
              captures: { it1: $.data.id }
            - call: "POST /mro/items"
              payload: { sku: "P-200", description: "Grease tube", item_class: "STOCKED", list_price_cents: 500 }
              as: DistributionAdmin
              captures: { it2: $.data.id }
            - call: "POST /mro/price-rules"
              payload: { customer_tier: "SILVER", item_class: "STOCKED", rule_type: "DISCOUNT_PCT", discount_pct: 10, effective_from: "2026-01-01", effective_to: "2027-01-01" }
              as: DistributionAdmin
              captures: { pr1: $.data.id }
            - call: "POST /mro/price-rules/${pr1}/activate"
              as: DistributionAdmin
            - call: "POST /mro/price-rules"
              payload: { customer_tier: "SILVER", item_id: "${it1}", rule_type: "FIXED_PRICE", contract_unit_price_cents: 850, effective_from: "2026-01-01", effective_to: "2027-01-01" }
              as: DistributionAdmin
              captures: { pr2: $.data.id }
            - call: "POST /mro/price-rules/${pr2}/activate"
              as: DistributionAdmin
            - call: "POST /mro/locations"
              payload: { location_code: "BR-3", location_type: "BRANCH", region_state: "OH", same_day_cutoff_minute: 900 }
              as: DistributionAdmin
              captures: { br_id: $.data.id }
            - call: "POST /mro/locations/${br_id}/restock"
              payload: { item_id: "${it1}", qty: 60 }
              as: DistributionAdmin
            - call: "POST /mro/locations/${br_id}/restock"
              payload: { item_id: "${it2}", qty: 12 }
              as: DistributionAdmin
          trigger:
            - call: "POST /mro/orders"
              payload: { customer_id: "${cust_id}", fulfillment_branch_id: "${br_id}", fulfillment_method: "STANDARD", lines: [{ item_id: "${it1}", qty: 60 }, { item_id: "${it2}", qty: 12 }] }
              as: DistributionAdmin
              captures: { ord_id: $.data.id, o_sub: $.data.subtotal_cents, o_fr: $.data.freight_cents, o_tot: $.data.total_cents }
            - call: "GET /mro/orders/${ord_id}/lines"
              as: DistributionAdmin
              captures: { l1_unit: "$.data[0].unit_price_cents", l1_total: "$.data[0].line_total_cents", l2_unit: "$.data[1].unit_price_cents", l2_total: "$.data[1].line_total_cents" }
          assert:
            - "l1_unit == 808 (item-level FIXED 850 beats class rule; qty 60 >= 50 -> round_half_up(850*0.95) = round_half_up(807.5) = 808)"
            - "l1_total == 48480"
            - "l2_unit == 437 (class DISCOUNT 10%: round(500*0.9)=450; qty 12 >= 10 -> round_half_up(450*0.97) = round_half_up(436.5) = 437)"
            - "l2_total == 5244"
            - "o_sub == 53724 and o_fr == 0 (subtotal >= 25,000 free-freight threshold) and o_tot == 53724"

      - name: return_credit_per_line_rounding
        grounds:
          - calculations.return_credit
          - state_machines.ReturnAuthorization.RECEIVED_to_CREDITED
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the scaffold pins
          round-per-line-then-sum; two SPECIAL_ORDER lines grossing 103 each yield
          82 + 82 = 164, whereas the rejected sum-then-round order yields
          round(206 * 0.8) = 165.
        test_recipe:
          setup:
            - "Customer credit 1,000,000; two SPECIAL_ORDER items P and Q, list 103 each (20% restock, 30-day window)"
            - "Branch stocked 1 of each; WILL_CALL order with one line per item, confirmed/readied/fulfilled on the default clock (within window)"
            - "Return of both lines (P RESALEABLE, Q DAMAGED), approved and received"
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "RET-1", display_name: "Return Co", credit_limit_cents: 1000000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /mro/items"
              payload: { sku: "SP-103A", description: "Special fitting A", item_class: "SPECIAL_ORDER", list_price_cents: 103 }
              as: DistributionAdmin
              captures: { itP: $.data.id }
            - call: "POST /mro/items"
              payload: { sku: "SP-103B", description: "Special fitting B", item_class: "SPECIAL_ORDER", list_price_cents: 103 }
              as: DistributionAdmin
              captures: { itQ: $.data.id }
            - call: "POST /mro/locations"
              payload: { location_code: "BR-4", location_type: "BRANCH", region_state: "OH", same_day_cutoff_minute: 900 }
              as: DistributionAdmin
              captures: { br_id: $.data.id }
            - call: "POST /mro/locations/${br_id}/restock"
              payload: { item_id: "${itP}", qty: 1 }
              as: DistributionAdmin
            - call: "POST /mro/locations/${br_id}/restock"
              payload: { item_id: "${itQ}", qty: 1 }
              as: DistributionAdmin
            - call: "POST /mro/orders"
              payload: { customer_id: "${cust_id}", fulfillment_branch_id: "${br_id}", fulfillment_method: "WILL_CALL", lines: [{ item_id: "${itP}", qty: 1 }, { item_id: "${itQ}", qty: 1 }] }
              as: DistributionAdmin
              captures: { ord_id: $.data.id }
            - call: "POST /mro/orders/${ord_id}/confirm"
              as: DistributionAdmin
            - call: "POST /mro/orders/${ord_id}/mark-ready"
              as: BranchManager
            - call: "POST /mro/orders/${ord_id}/mark-fulfilled"
              as: BranchManager
            - call: "GET /mro/orders/${ord_id}/lines"
              as: DistributionAdmin
              captures: { lp: "$.data[0].id", lq: "$.data[1].id" }
            - call: "POST /mro/returns"
              payload: { order_id: "${ord_id}", lines: [{ order_line_id: "${lp}", qty: 1, condition: "RESALEABLE" }, { order_line_id: "${lq}", qty: 1, condition: "DAMAGED" }] }
              as: DistributionAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /mro/returns/${ret_id}/approve"
              as: DistributionAdmin
            - call: "POST /mro/returns/${ret_id}/receive"
              as: BranchManager
          trigger:
            - call: "POST /mro/returns/${ret_id}/credit"
              as: DistributionAdmin
              captures: { credit: $.data.credit_cents, fee: $.data.restocking_fee_cents }
          assert:
            - "credit == 164 (per-line rounding: round_half_up(103*0.8) = 82 per line, then 82 + 82; NOT sum-then-round's 165)"
            - "fee == 42 (sum of grosses 206 - credit 164)"

      - name: freight_threshold_on_pre_freight_subtotal
        grounds:
          - calculations.order_total_pricing
          - entities.SalesOrder.fields.freight_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency with pinned evaluation order — the
          free-freight threshold tests the PRE-FREIGHT subtotal only, and hazmat
          handling is added on top even when base freight is waived; subtotal exactly
          25,000 (>= boundary) yields freight 0, and a hazmat order at the same
          subtotal yields freight 2,500.
        test_recipe:
          setup:
            - "Customer credit 10,000,000; item A STOCKED list 25,000 hazmat NONE; item B STOCKED list 25,000 hazmat GROUND_ONLY"
            - "Branch stocked 1 of each"
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "FR-1", display_name: "Freight Co", credit_limit_cents: 10000000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /mro/items"
              payload: { sku: "FR-25K", description: "Compressor", item_class: "STOCKED", list_price_cents: 25000 }
              as: DistributionAdmin
              captures: { itA: $.data.id }
            - call: "POST /mro/items"
              payload: { sku: "HZ-25K", description: "Solvent drum", item_class: "STOCKED", hazmat_restriction: "GROUND_ONLY", list_price_cents: 25000 }
              as: DistributionAdmin
              captures: { itB: $.data.id }
            - call: "POST /mro/locations"
              payload: { location_code: "BR-5", location_type: "BRANCH", region_state: "OH", same_day_cutoff_minute: 900 }
              as: DistributionAdmin
              captures: { br_id: $.data.id }
            - call: "POST /mro/locations/${br_id}/restock"
              payload: { item_id: "${itA}", qty: 1 }
              as: DistributionAdmin
            - call: "POST /mro/locations/${br_id}/restock"
              payload: { item_id: "${itB}", qty: 1 }
              as: DistributionAdmin
          trigger:
            - call: "POST /mro/orders"
              payload: { customer_id: "${cust_id}", fulfillment_branch_id: "${br_id}", fulfillment_method: "STANDARD", lines: [{ item_id: "${itA}", qty: 1 }] }
              as: DistributionAdmin
              captures: { sub_a: $.data.subtotal_cents, fr_a: $.data.freight_cents, tot_a: $.data.total_cents }
            - call: "POST /mro/orders"
              payload: { customer_id: "${cust_id}", fulfillment_branch_id: "${br_id}", fulfillment_method: "STANDARD", lines: [{ item_id: "${itB}", qty: 1 }] }
              as: DistributionAdmin
              captures: { sub_b: $.data.subtotal_cents, fr_b: $.data.freight_cents, tot_b: $.data.total_cents }
          assert:
            - "sub_a == 25000 and fr_a == 0 (subtotal >= FREE_FREIGHT_THRESHOLD_CENTS at exact equality) and tot_a == 25000"
            - "sub_b == 25000 and fr_b == 2500 (base freight waived by threshold, hazmat handling 2,500 still added) and tot_b == 27500"

  - rule_id: non_linear_state_machine
    instances:
      - name: cart_rejection_revision_cycle
        grounds:
          - state_machines.RequisitionCart.OPEN_to_PENDING_APPROVAL
          - state_machines.RequisitionCart.PENDING_APPROVAL_to_REJECTED
          - state_machines.RequisitionCart.REJECTED_to_OPEN
          - state_machines.RequisitionCart.OPEN_to_APPROVED
        distinguishing_aspect: |
          Cyclic machine on RequisitionCart: OPEN -> PENDING_APPROVAL -> REJECTED ->
          OPEN (revise) -> APPROVED, with the submit fork decided by the account's
          approval threshold (10,000 > 5,000 requires approval; 3,000 <= 5,000
          auto-approves).
        test_recipe:
          setup:
            - "Customer with approval_threshold_cents 5,000; item A list 10,000; item B list 3,000"
            - "Cart created with one line of item A"
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "PO-1", display_name: "PunchOut Co", credit_limit_cents: 1000000, approval_threshold_cents: 5000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /mro/items"
              payload: { sku: "CT-10K", description: "Drill press", item_class: "STOCKED", list_price_cents: 10000 }
              as: DistributionAdmin
              captures: { itA: $.data.id }
            - call: "POST /mro/items"
              payload: { sku: "CT-3K", description: "Wrench set", item_class: "STOCKED", list_price_cents: 3000 }
              as: DistributionAdmin
              captures: { itB: $.data.id }
            - call: "POST /mro/carts"
              payload: { customer_id: "${cust_id}", lines: [{ item_id: "${itA}", qty: 1 }] }
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { cart_id: $.data.id }
          trigger:
            - call: "POST /mro/carts/${cart_id}/submit"
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { st1: $.data.status, est1: $.data.estimated_total_cents }
            - call: "POST /mro/carts/${cart_id}/reject"
              payload: { reason: "over budget" }
              as: CustomerApprover
              as_user_id: "${cust_id}"
              captures: { st2: $.data.status }
            - call: "PUT /mro/carts/${cart_id}"
              payload: { lines: [{ item_id: "${itB}", qty: 1 }] }
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { st3: $.data.status }
            - call: "POST /mro/carts/${cart_id}/submit"
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { st4: $.data.status, est4: $.data.estimated_total_cents }
          assert:
            - "st1 == PENDING_APPROVAL and est1 == 10000 (10,000 > 5,000 threshold)"
            - "st2 == REJECTED"
            - "st3 == OPEN (revision loop closes the cycle)"
            - "st4 == APPROVED and est4 == 3000 (3,000 <= 5,000 auto-approves)"

      - name: order_parallel_status_dimensions
        grounds:
          - state_machines.SalesOrder.UNALLOCATED_to_PARTIALLY_ALLOCATED
          - state_machines.SalesOrder.PARTIALLY_ALLOCATED_to_ALLOCATED
          - state_machines.SalesOrder.ALLOCATED_to_READY_FOR_WILL_CALL
        distinguishing_aspect: |
          Parallel state dimensions on SalesOrder (different entity than the cart
          cycle): fulfillment_status advances UNALLOCATED -> PARTIALLY_ALLOCATED ->
          ALLOCATED -> READY_FOR_WILL_CALL (via system backorder fill and mark-ready)
          while the commercial status dimension stays pinned at CONFIRMED throughout.
        test_recipe:
          setup:
            - "Customer credit 10,000,000; STOCKED item list 5,000 with only 3 on hand at the branch"
            - "WILL_CALL order for 5 units -> confirm allocates 3, backorders 2"
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "PD-1", display_name: "Parallel Co", credit_limit_cents: 10000000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /mro/items"
              payload: { sku: "PD-1", description: "Motor", item_class: "STOCKED", list_price_cents: 5000 }
              as: DistributionAdmin
              captures: { itX: $.data.id }
            - call: "POST /mro/locations"
              payload: { location_code: "BR-6", location_type: "BRANCH", region_state: "OH", same_day_cutoff_minute: 900 }
              as: DistributionAdmin
              captures: { br_id: $.data.id }
            - call: "POST /mro/locations/${br_id}/restock"
              payload: { item_id: "${itX}", qty: 3 }
              as: DistributionAdmin
            - call: "POST /mro/orders"
              payload: { customer_id: "${cust_id}", fulfillment_branch_id: "${br_id}", fulfillment_method: "WILL_CALL", lines: [{ item_id: "${itX}", qty: 5 }] }
              as: DistributionAdmin
              captures: { ord_id: $.data.id }
            - call: "POST /mro/orders/${ord_id}/confirm"
              as: DistributionAdmin
              captures: { s1: $.data.status, f1: $.data.fulfillment_status }
            - call: "POST /mro/locations/${br_id}/restock"
              payload: { item_id: "${itX}", qty: 5 }
              as: DistributionAdmin
            - call: "GET /mro/orders/${ord_id}"
              as: DistributionAdmin
              captures: { s2: $.data.status, f2: $.data.fulfillment_status }
          trigger:
            - call: "POST /mro/orders/${ord_id}/mark-ready"
              as: BranchManager
              captures: { f3: $.data.fulfillment_status }
            - call: "GET /mro/orders/${ord_id}"
              as: DistributionAdmin
              captures: { s3: $.data.status }
          assert:
            - "s1 == CONFIRMED and f1 == PARTIALLY_ALLOCATED (2 units backordered)"
            - "s2 == CONFIRMED and f2 == ALLOCATED (restock auto-fill advanced only the fulfillment dimension)"
            - "f3 == READY_FOR_WILL_CALL and s3 == CONFIRMED (mark-ready moves fulfillment; commercial status untouched)"

  - rule_id: transitive_cascade
    instances:
      - name: completion_accrual_cascade
        grounds:
          - state_machines.SalesOrder.CONFIRMED_to_COMPLETED
          - calculations.rebate_accrual_and_trueup
          - entities.CustomerAccount.fields.net_spend_cents
          - entities.RebateAgreement.fields.accrued_spend_cents
        distinguishing_aspect: |
          Depth-4 cascade triggered by order completion: SalesOrder -> CustomerAccount
          (net_spend += total) -> RebateAgreement (accrued_spend += total) ->
          current_tier_index re-evaluated -> provisional_rebate recomputed; the second
          completion crosses the 10,000,000 threshold and flips the tier.
        test_recipe:
          setup:
            - "National-account customer, credit 100,000,000; ACTIVE agreement [2026-07-01, 2026-09-30], tiers [{0,100bps},{10000000,200bps}]"
            - "STOCKED item list 6,000,000, 2 on hand at the branch"
            - "Order 1 (qty 1, WILL_CALL) fully completed -> accrued 6,000,000, tier 0, provisional 60,000"
            - "Order 2 (qty 1, WILL_CALL) confirmed, readied, fulfilled — awaiting completion"
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "NAT-2", display_name: "National Two", is_national_account: true, credit_limit_cents: 100000000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /mro/customers/${cust_id}/rebate-agreements"
              payload: { period_start: "2026-07-01", period_end: "2026-09-30", tiers: [{ threshold_cents: 0, rebate_bps: 100 }, { threshold_cents: 10000000, rebate_bps: 200 }] }
              as: DistributionAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /mro/rebate-agreements/${agr_id}/activate"
              as: DistributionAdmin
            - call: "POST /mro/items"
              payload: { sku: "AC-6M", description: "Lathe", item_class: "STOCKED", list_price_cents: 6000000 }
              as: DistributionAdmin
              captures: { itM: $.data.id }
            - call: "POST /mro/locations"
              payload: { location_code: "BR-7", location_type: "BRANCH", region_state: "OH", same_day_cutoff_minute: 900 }
              as: DistributionAdmin
              captures: { br_id: $.data.id }
            - call: "POST /mro/locations/${br_id}/restock"
              payload: { item_id: "${itM}", qty: 2 }
              as: DistributionAdmin
            - call: "POST /mro/orders"
              payload: { customer_id: "${cust_id}", fulfillment_branch_id: "${br_id}", fulfillment_method: "WILL_CALL", lines: [{ item_id: "${itM}", qty: 1 }] }
              as: DistributionAdmin
              captures: { ord1: $.data.id }
            - call: "POST /mro/orders/${ord1}/confirm"
              as: DistributionAdmin
            - call: "POST /mro/orders/${ord1}/mark-ready"
              as: BranchManager
            - call: "POST /mro/orders/${ord1}/mark-fulfilled"
              as: BranchManager
            - call: "POST /mro/orders/${ord1}/complete"
              as: DistributionAdmin
            - call: "GET /mro/rebate-agreements/${agr_id}"
              as: DistributionAdmin
              captures: { mid_accrued: $.data.accrued_spend_cents, mid_tier: $.data.current_tier_index, mid_prov: $.data.provisional_rebate_cents }
            - call: "POST /mro/orders"
              payload: { customer_id: "${cust_id}", fulfillment_branch_id: "${br_id}", fulfillment_method: "WILL_CALL", lines: [{ item_id: "${itM}", qty: 1 }] }
              as: DistributionAdmin
              captures: { ord2: $.data.id }
            - call: "POST /mro/orders/${ord2}/confirm"
              as: DistributionAdmin
            - call: "POST /mro/orders/${ord2}/mark-ready"
              as: BranchManager
            - call: "POST /mro/orders/${ord2}/mark-fulfilled"
              as: BranchManager
          trigger:
            - call: "POST /mro/orders/${ord2}/complete"
              as: DistributionAdmin
            - call: "GET /mro/customers/${cust_id}"
              as: DistributionAdmin
              captures: { cust_net: $.data.net_spend_cents }
            - call: "GET /mro/rebate-agreements/${agr_id}"
              as: DistributionAdmin
              captures: { end_accrued: $.data.accrued_spend_cents, end_tier: $.data.current_tier_index, end_prov: $.data.provisional_rebate_cents }
          assert:
            - "mid_accrued == 6000000 and mid_tier == 0 and mid_prov == 60000 (first completion propagated through links 1-4 below the threshold)"
            - "cust_net == 12000000 (link 1: order completions accumulate on the customer)"
            - "end_accrued == 12000000 (link 2: customer spend debited into the ACTIVE agreement)"
            - "end_tier == 1 (link 3: 12,000,000 >= 10,000,000 crosses the tier) and end_prov == 240000 (link 4: average-rate recompute at the new tier)"

      - name: cancel_release_backorder_fill_cascade
        grounds:
          - state_machines.SalesOrder.CONFIRMED_to_CANCELLED
          - calculations.allocation_waterfall
          - calculations.available_qty
          - entities.OrderLine.fields.qty_backordered
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger (order cancel, not completion):
          cancel releases StockBalance reservations (link 1) -> freed availability
          auto-fills the oldest eligible backordered OrderLine (link 2) -> the filled
          line's parent SalesOrder recomputes fulfillment_status PARTIALLY_ALLOCATED
          -> ALLOCATED (link 3).
        test_recipe:
          setup:
            - "Customer credit 10,000,000; STOCKED item list 1,000 with 5 on hand at the branch"
            - "Order A (qty 5, WILL_CALL) CONFIRMED -> branch reserved 5, available 0"
            - "Order B (qty 3, WILL_CALL) CONFIRMED -> branch bucket empty, not drop-ship eligible -> qty_backordered 3, PARTIALLY_ALLOCATED"
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "BO-1", display_name: "Backorder Co", credit_limit_cents: 10000000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /mro/items"
              payload: { sku: "BO-1", description: "Bearing", item_class: "STOCKED", list_price_cents: 1000 }
              as: DistributionAdmin
              captures: { itX: $.data.id }
            - call: "POST /mro/locations"
              payload: { location_code: "BR-8", location_type: "BRANCH", region_state: "OH", same_day_cutoff_minute: 900 }
              as: DistributionAdmin
              captures: { br_id: $.data.id }
            - call: "POST /mro/locations/${br_id}/restock"
              payload: { item_id: "${itX}", qty: 5 }
              as: DistributionAdmin
            - call: "POST /mro/orders"
              payload: { customer_id: "${cust_id}", fulfillment_branch_id: "${br_id}", fulfillment_method: "WILL_CALL", lines: [{ item_id: "${itX}", qty: 5 }] }
              as: DistributionAdmin
              captures: { ordA: $.data.id }
            - call: "POST /mro/orders/${ordA}/confirm"
              as: DistributionAdmin
            - call: "POST /mro/orders"
              payload: { customer_id: "${cust_id}", fulfillment_branch_id: "${br_id}", fulfillment_method: "WILL_CALL", lines: [{ item_id: "${itX}", qty: 3 }] }
              as: DistributionAdmin
              captures: { ordB: $.data.id, fB0: $.data.fulfillment_status }
            - call: "POST /mro/orders/${ordB}/confirm"
              as: DistributionAdmin
              captures: { fB1: $.data.fulfillment_status }
          trigger:
            - call: "POST /mro/orders/${ordA}/cancel"
              as: DistributionAdmin
              captures: { sA: $.data.status }
            - call: "GET /mro/locations/${br_id}/stock-balances"
              as: DistributionAdmin
              captures: { bal_on: "$.data[0].on_hand_qty", bal_res: "$.data[0].reserved_qty", bal_av: "$.data[0].available_qty" }
            - call: "GET /mro/orders/${ordB}/lines"
              as: DistributionAdmin
              captures: { lnB_branch: "$.data[0].qty_branch", lnB_bo: "$.data[0].qty_backordered" }
            - call: "GET /mro/orders/${ordB}"
              as: DistributionAdmin
              captures: { fB2: $.data.fulfillment_status }
          assert:
            - "fB1 == PARTIALLY_ALLOCATED (setup: order B confirmed into an empty branch bucket)"
            - "sA == CANCELLED"
            - "bal_on == 5 and bal_res == 3 and bal_av == 2 (link 1 released 5, link 2 re-reserved 3 to order B)"
            - "lnB_branch == 3 and lnB_bo == 0 (link 2: auto-fill from the freed units)"
            - "fB2 == ALLOCATED (link 3: parent order recomputed once fully allocated)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: confirm_state_error_beats_credit_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - errors[ERR_CUSTOMER_NOT_ACTIVE]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: confirming an order whose customer
          is CREDIT_HOLD (state, priority 6) and whose total exceeds the credit limit
          (fiscal, priority 11) must surface ERR_CUSTOMER_NOT_ACTIVE.
        test_recipe:
          setup:
            - "Customer credit limit 1,000 placed on CREDIT_HOLD"
            - "STOCKED item list 5,000, 1 on hand; WILL_CALL order total 5,000 > 1,000"
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "HOLD-1", display_name: "Hold Co", credit_limit_cents: 1000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { cust_id: $.data.id, cust_v: $.data.version }
            - call: "PUT /mro/customers/${cust_id}"
              payload: { status: "CREDIT_HOLD", expected_customer_version: "${cust_v}" }
              as: DistributionAdmin
            - call: "POST /mro/items"
              payload: { sku: "CF-5K", description: "Welder", item_class: "STOCKED", list_price_cents: 5000 }
              as: DistributionAdmin
              captures: { it_id: $.data.id }
            - call: "POST /mro/locations"
              payload: { location_code: "BR-9", location_type: "BRANCH", region_state: "OH", same_day_cutoff_minute: 900 }
              as: DistributionAdmin
              captures: { br_id: $.data.id }
            - call: "POST /mro/locations/${br_id}/restock"
              payload: { item_id: "${it_id}", qty: 1 }
              as: DistributionAdmin
            - call: "POST /mro/orders"
              payload: { customer_id: "${cust_id}", fulfillment_branch_id: "${br_id}", fulfillment_method: "WILL_CALL", lines: [{ item_id: "${it_id}", qty: 1 }] }
              as: DistributionAdmin
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /mro/orders/${ord_id}/confirm"
              as: DistributionAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CUSTOMER_NOT_ACTIVE (priority 6 state beats priority 11 business_fiscal; ERR_CREDIT_LIMIT_EXCEEDED is NOT returned)"

      - name: confirm_hazmat_safety_beats_credit_fiscal
