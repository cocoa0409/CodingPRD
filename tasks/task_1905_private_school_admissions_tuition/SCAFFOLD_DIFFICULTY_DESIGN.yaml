  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: pacing_cap_exact_acceptance_then_overflow
        grounds:
          - calculations.aid_pacing_cap
          - errors[ERR_AID_PACING_CAP_EXCEEDED]
          - state_machines.AidApplication.award_status.OFFERED_to_ACCEPTED
        distinguishing_aspect: |
          Money-metric boundary on accept-award: committed 5,400,000 + award 1,820,000
          lands EXACTLY on the 7,220,000 OPEN-phase cap and succeeds ('<=' semantics);
          the next acceptance of even 1 cent over the cap is rejected. Distinct metric
          and endpoint from the session-count boundary instance.
        test_recipe:
          setup:
            - "OPEN cycle budget 18,050,000 -> pacing cap exactly 7,220,000"
            - "fam-1 award 2,700,000 ACCEPTED, fam-2 award 2,700,000 ACCEPTED (committed 5,400,000)"
            - "fam-3 award finalized OFFERED at 1,820,000; fam-4 award finalized OFFERED at 2,700,000"
          setup_api_calls:
            - { call: "POST /admissions/cycles", payload: { academic_year: "2027-2028", early_deadline_at: "2026-11-01T00:00:00Z", regular_deadline_at: "2027-01-15T00:00:00Z", reenroll_response_deadline_at: "2027-03-01T00:00:00Z", melt_deadline_at: "2027-08-01T00:00:00Z", aid_budget_total_cents: 18050000 }, as: AdmissionDirector, captures: { cyc: $.data.id } }
            - { call: "POST /admissions/grade-sections", payload: { cycle_id: "${cyc}", grade_level: "G9", capacity: 10, tuition_cents: 3000000, max_aid_seat_pct: 1.0 }, as: AdmissionDirector, captures: { sec: $.data.id } }
