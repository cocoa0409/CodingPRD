            - "after the 1-byte upload: second projection posture == OVER_BUDGET and projection_month_cost_cents == 3001 (ceil((3 GiB + 1 byte)/GiB * 1000) = 3001 > 3000)"

      - name: dock_charge_floor_at_3599_vs_3600_seconds
        grounds:
          - calculations.dock_charge_gain
          - state_machines.Device.DOCKED_to_UNDOCKED
        distinguishing_aspect: "Boundary metric: docked elapsed seconds with floor semantics via POST undock on a device registered at battery 50 — a 3599-second dock gains 0 (battery stays 50) while a 3600-second dock gains exactly 10 (battery 60); same endpoint, two clock positions, pins floor(elapsed/3600) over round/ceil with the headroom cap (50 + 10 < 100) not binding."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Agency with ACTIVE policy. Device registered with battery_pct 50 (refurbished intake reading), starts DOCKED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /agencies"
