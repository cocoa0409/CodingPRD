      - name: reject_lot_voids_open_submitted_inspection
        claim_type: side_effect_execution
        grounds: [state_machines.Inspection.SUBMITTED_to_VOIDED, state_machines.PurchaseLot.DISPUTED_to_REJECTED]
        distinguishing_aspect: "The system-void invariant: when a dispute resolves REJECT_TO_SHIPPER while a second inspection is still SUBMITTED, that inspection flips to VOIDED — a REJECTED lot never carries an open SUBMITTED inspection."
        test_recipe:
          setup:
            - "Clock 2026-05-01T08:00:00Z; lot 100 @ 10.00; inspection I1 FAIL (defect 25) CERTIFIED; dispute opens DISPUTED"
            - "Re-inspection I2 SUBMITTED (lot back to INSPECTED); second dispute (I1 still CERTIFIED FAIL) returns lot to DISPUTED with I2 open"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: MarketAdmin }
            - { call: "POST /market/commodities", payload: { code: "TOM", name: "Tomato", ethylene_class: "PRODUCER", temp_min_f: 45, temp_max_f: 55, max_violation_minutes: 60 }, as: MarketAdmin, captures: { com: "$.data.id" } }
