            - { call: "POST /endowment/policies", payload: { pool_id: "${rc_pool}", spending_rate_bps: 500, smoothing_window_quarters: 4, band_floor_bps: 0, band_cap_bps: 10000, effective_from_fiscal_year: 2026 }, as: InvestmentOfficer, as_user_id: "io-1", captures: { rc_pol: $.data.id } }
            - { call: "POST /endowment/policies/${rc_pol}/adopt", payload: { expected_pool_version: "${rc_pv}" }, as: BoardMember, as_user_id: "bm-1" }
            - { call: "POST /endowment/managers", payload: { pool_id: "${rc_pool}", manager_name: "M RC2", asset_class: US_EQUITY, benchmark_code: "SPX", coverage_start_quarter: 1 }, as: InvestmentOfficer, captures: { rc_mgr: $.data.id } }
            - { call: "POST /endowment/managers/${rc_mgr}/engage", payload: {}, as: InvestmentOfficer }
            - { call: "POST /endowment/funds", payload: { pool_id: "${rc_pool}", fund_code: "FRC2", fund_name: "Fund RC2", endowment_class: TRUE_ENDOWMENT, purpose_restriction: UNRESTRICTED }, as: DevelopmentOfficer, captures: { rc_fund: $.data.id } }
            - { call: "POST /endowment/donors", payload: { donor_name: "D RC2", donor_type: INDIVIDUAL }, as: DevelopmentOfficer, captures: { rc_donor: $.data.id } }
            - { call: "POST /endowment/gifts", payload: { fund_id: "${rc_fund}", donor_id: "${rc_donor}", external_ref: "RC1", gift_type: CORPUS, amount_cents: 10000000 }, as: DevelopmentOfficer, captures: { rc_g1: $.data.id } }
            - { call: "POST /endowment/funds/${rc_fund}/activate", payload: {}, as: DevelopmentOfficer }
            - { call: "POST /endowment/gifts/${rc_g1}/receive", payload: {}, as: DevelopmentOfficer }
            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${rc_mgr}", quarter_index: 1, beginning_mv_cents: 0, ending_mv_cents: 10000000, flows: [ { day_offset: 0, amount_cents: 10000000 } ], benchmark_return_bps: 0 }, as: InvestmentOfficer }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${rc_pool}", estimated_pool_market_value_cents: 10000000 }, as: InvestmentOfficer, captures: { rc_v1: $.data.id } }
            - { call: "GET /endowment/pools/${rc_pool}", as: InvestmentOfficer, captures: { rc_pv1: $.data.version } }
            - { call: "POST /endowment/valuations/${rc_v1}/finalize", payload: { final_pool_market_value_cents: 10000000, expected_pool_version: "${rc_pv1}" }, as: InvestmentOfficer }
            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${rc_mgr}", quarter_index: 2, beginning_mv_cents: 10000000, ending_mv_cents: 4000000, flows: [], benchmark_return_bps: 0 }, as: InvestmentOfficer }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${rc_pool}", estimated_pool_market_value_cents: 4000000 }, as: InvestmentOfficer, captures: { rc_v2: $.data.id } }
            - { call: "GET /endowment/pools/${rc_pool}", as: InvestmentOfficer, captures: { rc_pv2: $.data.version } }
            - { call: "POST /endowment/valuations/${rc_v2}/finalize", payload: { final_pool_market_value_cents: 4000000, expected_pool_version: "${rc_pv2}" }, as: InvestmentOfficer }
            - { call: "POST /endowment/exceptions", payload: { fund_id: "${rc_fund}", fiscal_year: 2026, requested_amount_cents: 300000, justification: "bridge" }, as: DevelopmentOfficer, as_user_id: "dev-1", captures: { rc_ex: $.data.id } }
            - { call: "POST /endowment/exceptions/${rc_ex}/endorse", payload: {}, as: InvestmentOfficer, as_user_id: "io-2" }
            - { call: "POST /endowment/exceptions/${rc_ex}/approve", payload: { approved_amount_cents: 300000 }, as: BoardMember, as_user_id: "bm-1" }
            - { call: "POST /endowment/distributions", payload: { fund_id: "${rc_fund}", fiscal_year: 2026 }, as: DevelopmentOfficer, as_user_id: "dev-1", captures: { rc_d: $.data.id } }
            - { call: "POST /endowment/distributions/${rc_d}/propose", payload: {}, as: DevelopmentOfficer, as_user_id: "dev-1" }
            - { call: "POST /endowment/distributions/${rc_d}/approve", payload: {}, as: BoardMember, as_user_id: "bm-1" }
          trigger:
            - { call: "POST /endowment/exceptions/${rc_ex}/rescind", payload: {}, as: BoardMember, as_user_id: "bm-2" }
