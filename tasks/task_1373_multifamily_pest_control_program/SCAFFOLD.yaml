# =============================================================================
# SCAFFOLD.yaml — Multifamily Pest Control Program
# §1.0–§1.7 seed tables (difficulty/corner designs live in sibling files)
# =============================================================================

scenario: |
  Multifamily Pest Control Program (apartment community pest program): service contract scope & treatment schedule, unit inspection & infestation severity classification, prep requirement communication & non-compliant unit rescheduling, adjacent-unit treatment protocol, bed bug protocol with heat treatment & furniture disposal, resident chargeback policy & lease clause enforcement, follow-up inspection & clearance, documentation for habitability claims

domain_name: multifamily-pest-control
api_prefix: /pest

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Property
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Community name" }
      - { name: address, type: string, source: input, description: "Street address" }
      - { name: timezone, type: string, source: input, default: "America/Los_Angeles", description: "IANA timezone for schedule display" }
      - { name: posture, type: enum, source: computed, default: STANDARD, description: "STANDARD | ELEVATED | RESTRICTED — derived from open_bed_bug_case_count (calculations.exposure_posture)" }
      - { name: open_bed_bug_case_count, type: integer, source: computed, default: 0, description: "Count of BedBugCase with status in {OPEN, TREATING, MONITORING, REOPENED} across units of this property" }

  - name: ServiceContract
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: system, description: "FK -> Property.id; owning community" }
      - { name: vendor_name, type: string, source: input, description: "Pest control vendor legal name" }
      - { name: scope_pest_types, type: array, source: input, description: "Array of enum ANTS | ROACHES | RODENTS | BED_BUGS | TERMITES covered by the contract; must be non-empty" }
      - { name: visits_per_month, type: integer, source: input, description: "Contracted routine visits per calendar month; >= 1" }
      - { name: coverage_per_incident_cents, type: integer, source: input, description: "Vendor-absorbed credit applied to REPEAT_INFESTATION chargebacks; >= 0" }
      - { name: heat_treatment_included, type: boolean, source: input, description: "True when heat treatments are vendor-covered; false makes HEAT_SURCHARGE chargebacks assessable" }
      - { name: monthly_budget_cents, type: integer, source: input, description: "Fiscal cap on completed treatment cost per calendar month; >= 1" }
      - { name: spent_cents, type: integer, source: computed, default: 0, description: "Sum of estimated treatment cost for treatments COMPLETED in the current calendar month (resets at month boundary)" }
      - { name: start_date, type: string, source: input, description: "ISO date, inclusive" }
      - { name: end_date, type: string, source: input, description: "ISO date, inclusive; must be >= start_date" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | SUSPENDED | TERMINATED | EXPIRED" }

  - name: Unit
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: system, description: "FK -> Property.id; owning community" }
      - { name: unit_number, type: string, source: input, description: "Door number; unique within property" }
      - { name: floor, type: integer, source: input, description: "Floor number; >= 1" }
      - { name: stack_index, type: integer, source: input, description: "Vertical stack position within a floor; >= 1" }
      - { name: bedrooms, type: integer, source: input, description: "Bedroom count; >= 0" }
      - { name: operational_status, type: enum, source: input, default: OCCUPIED, description: "OCCUPIED | VACANT | RENOVATION" }
      - { name: pest_flag, type: enum, source: computed, default: CLEAR, description: "CLEAR | MONITORING | INFESTED — derived per calculations.unit_pest_flag" }
      - { name: no_access_strikes, type: integer, source: computed, default: 0, description: "Count of consecutive NO_ACCESS inspections; resets to 0 after an auto-created non-compliance chargeback" }

  - name: Lease
    parent: Unit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: system, description: "FK -> Unit.id; leased unit" }
      - { name: start_date, type: string, source: input, description: "ISO date, inclusive" }
      - { name: end_date, type: string, source: input, description: "ISO date, inclusive; must be >= start_date" }
      - { name: pest_addendum_signed, type: boolean, source: input, description: "True when the resident signed the pest-control chargeback lease clause" }
      - { name: chargeback_clause_version, type: string, source: input, description: "Lease clause version string, e.g. v2026.1" }
      - { name: chargeback_cap_cents, type: integer, source: input, description: "Per-chargeback cap enforced by the lease clause; >= 0" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | ENDED" }
      - { name: outstanding_balance_cents, type: integer, source: computed, default: 0, description: "= SUM(provisional_amount_cents over chargebacks in {ASSESSED, DISPUTED}) + SUM(final_amount_cents over chargebacks in {UPHELD, BILLED}); WAIVED and PAID contribute 0" }
      - { name: delinquent, type: boolean, source: computed, default: false, description: "true iff outstanding_balance_cents > 0" }

  - name: Resident
    parent: Unit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: system, description: "FK -> Unit.id; unit of residence" }
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id; governing lease" }
      - { name: full_name, type: string, source: input, description: "Resident full name" }
      - { name: email, type: string, source: input, description: "Contact email" }

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Technician name" }
      - { name: vendor_name, type: string, source: input, description: "Employing vendor" }
      - { name: active, type: boolean, source: input, default: true, description: "Only active technicians may be assigned" }
      - { name: booked_minutes, type: integer, source: computed, default: 0, description: "= SUM(window_end - window_start minutes) over assigned Treatments with status in {SCHEDULED, PREP_NOTIFIED, PREP_VERIFIED, NON_COMPLIANT}" }

  - name: Inspection
    parent: Unit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: system, description: "FK -> Unit.id; inspected unit" }
      - { name: technician_id, type: string, source: input, description: "FK -> Technician.id; assigned technician (must be active)" }
      - { name: bed_bug_case_id, type: string, source: input, description: "FK -> BedBugCase.id; set for FOLLOW_UP inspections and for INITIAL inspections auto-created by the adjacent-exposure cascade; null for ad-hoc ROUTINE inspections" }
      - { name: kind, type: enum, source: input, description: "ROUTINE | INITIAL | FOLLOW_UP" }
      - { name: pest_type, type: enum, source: input, description: "ANTS | ROACHES | RODENTS | BED_BUGS | TERMITES" }
      - { name: scheduled_for, type: datetime, source: input, description: "Planned inspection instant (UTC)" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | COMPLETED | NO_ACCESS | CANCELLED" }
      - { name: completed_at, type: datetime, source: system, description: "Server logical-clock timestamp set on completion" }
      - { name: live_sightings, type: integer, source: input, description: "Live pests seen; supplied on complete; >= 0" }
      - { name: evidence_count, type: integer, source: input, description: "Evidence traces (droppings, skins, gnaw marks); supplied on complete; >= 0" }
      - { name: bed_bug_positive, type: boolean, source: input, description: "Confirmed bed bug evidence; supplied on complete" }
      - { name: severity, type: enum, source: computed, description: "NONE | LOW | MODERATE | SEVERE — per calculations.severity_classification; null until COMPLETED" }

  - name: Treatment
    parent: Unit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: system, description: "FK -> Unit.id; treated unit" }
      - { name: technician_id, type: string, source: input, description: "FK -> Technician.id; assigned technician (must be active)" }
      - { name: inspection_id, type: string, source: input, description: "FK -> Inspection.id; originating inspection; optional" }
      - { name: bed_bug_case_id, type: string, source: input, description: "FK -> BedBugCase.id; links treatment into a bed bug case; optional" }
      - { name: pest_type, type: enum, source: input, description: "ANTS | ROACHES | RODENTS | BED_BUGS | TERMITES; must be within the ACTIVE contract scope_pest_types" }
      - { name: treatment_type, type: enum, source: input, description: "CHEMICAL | HEAT | EXCLUSION | TRAPPING" }
      - { name: window_start, type: datetime, source: input, description: "Visit window start (UTC); must be < window_end" }
      - { name: window_end, type: datetime, source: input, description: "Visit window end (UTC)" }
      - { name: planned_minutes, type: integer, source: computed, description: "= (window_end - window_start) in whole minutes" }
      - { name: vacancy_attested, type: boolean, source: input, default: false, description: "Manager attestation that the unit will be vacant; REQUIRED true when treatment_type == HEAT" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | PREP_NOTIFIED | PREP_VERIFIED | NON_COMPLIANT | COMPLETED | CANCELLED" }
      - { name: prep_notified_at, type: datetime, source: system, description: "Set by notify-prep; null until then" }
      - { name: prep_acknowledged_at, type: datetime, source: system, description: "Set by resident acknowledge-prep; null until then" }
      - { name: reschedule_count, type: integer, source: system, default: 0, description: "Increments on each successful reschedule; hard limit RESCHEDULE_LIMIT = 2" }
      - { name: actual_minutes, type: integer, source: input, description: "Actual on-site minutes; supplied on complete; >= 1" }

  - name: BedBugCase
    parent: Unit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: system, description: "FK -> Unit.id; infested unit" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | TREATING | MONITORING | CLEARED | REOPENED" }
      - { name: consecutive_negative_count, type: integer, source: computed, default: 0, description: "Running count of consecutive negative FOLLOW_UP inspections (bed_bug_positive == false AND severity == NONE), replayed in completed_at ASC, created_at ASC order; reset to 0 by any positive" }
      - { name: cleared_at, type: datetime, source: system, description: "Set on CLEARED; null otherwise" }

  - name: FurnitureDisposal
    parent: BedBugCase
    common_fields: true
    fields:
      - { name: bed_bug_case_id, type: string, source: system, description: "FK -> BedBugCase.id; owning case" }
      - { name: item_description, type: string, source: input, description: "Discarded furniture item (e.g. mattress, sofa)" }
      - { name: quantity, type: integer, source: input, description: "Item count; >= 1" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | VERIFIED | REJECTED" }
      - { name: verified_at, type: datetime, source: system, description: "Set on verify; null otherwise" }

  - name: Chargeback
    parent: Lease
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id; billed lease" }
      - { name: source_treatment_id, type: string, source: input, description: "FK -> Treatment.id; treatment whose overage is billed; optional" }
      - { name: bed_bug_case_id, type: string, source: input, description: "FK -> BedBugCase.id; REQUIRED when kind == FURNITURE_DISPOSAL (final amount counts VERIFIED items of this case)" }
      - { name: kind, type: enum, source: input, description: "NON_COMPLIANCE_FEE | REPEAT_INFESTATION | HEAT_SURCHARGE | FURNITURE_DISPOSAL | LATE_FEE (LATE_FEE is system-created only)" }
      - { name: planned_item_count, type: integer, source: input, description: "Planned disposal items; REQUIRED when kind == FURNITURE_DISPOSAL; >= 1" }
      - { name: note, type: string, source: input, description: "Assessor note; optional" }
      - { name: status, type: enum, source: system, default: ASSESSED, description: "ASSESSED | DISPUTED | UPHELD | WAIVED | BILLED | PAID" }
      - { name: provisional_amount_cents, type: integer, source: computed, description: "Computed at assessment per calculations.chargeback_amount (provisional variant)" }
      - { name: final_amount_cents, type: integer, source: computed, description: "Computed at billing per calculations.chargeback_amount (final variant); null until BILLED" }
      - { name: assessed_at, type: datetime, source: system, description: "Server logical-clock timestamp of assessment" }
      - { name: assessed_by, type: string, source: system, description: "X-User-ID of the assessing BillingClerk (segregation-of-duties anchor)" }
      - { name: disputed_at, type: datetime, source: system, description: "Set on dispute; null otherwise" }
      - { name: dispute_reason, type: string, source: input, description: "Resident dispute free-text; supplied on dispute" }
      - { name: resolved_by, type: string, source: system, description: "X-User-ID of resolving ComplianceOfficer; must differ from assessed_by" }
      - { name: resolution, type: enum, source: input, description: "UPHELD | WAIVED; supplied on resolve-dispute" }
      - { name: billed_at, type: datetime, source: system, description: "Set on bill; null otherwise" }
      - { name: paid_at, type: datetime, source: system, description: "Set on record-payment; null otherwise" }

  - name: ClaimPacket
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: system, description: "FK -> Property.id; documented community" }
      - { name: claim_reference, type: string, source: input, description: "External habitability-claim reference" }
      - { name: references, type: array, source: input, description: "Array of { entity_type: Inspection | Treatment | BedBugCase, entity_id } supplied at creation; server snapshots each entity's current version into pinned_references" }
      - { name: pinned_references, type: array, source: system, description: "Array of { entity_type, entity_id, version } captured at creation; finalize re-validates every pinned version" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | FINALIZED | DISCARDED" }
      - { name: finalized_at, type: datetime, source: system, description: "Set on finalize; null otherwise" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ServiceContract
    initial_state: DRAFT
    terminal_states: [TERMINATED, EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /pest/contracts/{id}/activate"
        actor: ProgramAdmin
        preconditions: ["scope_pest_types non-empty", "start_date <= current logical date <= end_date"]
        side_effects: ["increments ServiceContract.version by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /pest/contracts/{id}/suspend"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["increments ServiceContract.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /pest/contracts/{id}/reactivate"
        actor: ProgramAdmin
        preconditions: ["current logical date <= end_date"]
        side_effects: ["increments ServiceContract.version by 1"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /pest/contracts/{id}/terminate"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["increments ServiceContract.version by 1"]
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /pest/contracts/{id}/terminate"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["increments ServiceContract.version by 1"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (lazily applied: any contract-gated operation or GET observing current logical date > end_date)"
        actor: system
        preconditions: ["current logical date > end_date"]
        side_effects: ["increments ServiceContract.version by 1"]

  - entity: Unit
    initial_state: CLEAR
    terminal_states: []
    transitions:
      - from: CLEAR
        to: INFESTED
        trigger: "system (an Inspection of this Unit completes with bed_bug_positive == true)"
        actor: system
        preconditions: []
        side_effects: ["recomputes Property.open_bed_bug_case_count and Property.posture via the case-creation cascade"]
      - from: CLEAR
        to: MONITORING
        trigger: "system (an INITIAL Inspection is auto-created on this Unit by the adjacent-exposure cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: MONITORING
        to: INFESTED
        trigger: "system (an Inspection of this Unit completes with bed_bug_positive == true)"
        actor: system
        preconditions: []
        side_effects: []
      - from: INFESTED
        to: CLEAR
        trigger: "system (the unit's last non-terminal BedBugCase transitions to CLEARED and no SCHEDULED INITIAL inspection remains)"
        actor: system
        preconditions: []
        side_effects: []
      - from: MONITORING
        to: CLEAR
        trigger: "system (all auto-created INITIAL inspections on this unit reach COMPLETED or CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Lease
    initial_state: ACTIVE
    terminal_states: [ENDED]
    transitions:
      - from: ACTIVE
        to: ENDED
        trigger: "system (lazily applied when current logical date > end_date)"
        actor: system
        preconditions: ["current logical date > end_date"]
        side_effects: ["increments Lease.version by 1"]

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_ACCESS, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /pest/inspections/{id}/complete"
        actor: Technician
        preconditions: ["acting Technician.id == inspection.technician_id", "status == SCHEDULED"]
        side_effects:
          - "sets completed_at to current logical time"
          - "computes severity per calculations.severity_classification"
          - "CASCADE A link 1: if bed_bug_positive == true AND no BedBugCase for this unit in {OPEN, TREATING, MONITORING, REOPENED} exists, creates BedBugCase(status=OPEN); if one exists in MONITORING, transitions it to REOPENED; Unit.pest_flag -> INFESTED"
          - "CASCADE A link 2: on BedBugCase entering OPEN, runs calculations.adjacent_exposure_selector and creates one Inspection(kind=INITIAL, pest_type=BED_BUGS, status=SCHEDULED, bed_bug_case_id=<new case>, scheduled_for = current logical time + 24h, technician_id = null-unassigned sentinel not allowed — uses the completing technician) per exposed unit in selector order"
          - "CASCADE A link 3: each auto-created INITIAL inspection sets its target Unit.pest_flag CLEAR -> MONITORING"
          - "CASCADE A link 4: recomputes Property.open_bed_bug_case_count and Property.posture per calculations.exposure_posture"
          - "if kind == FOLLOW_UP and bed_bug_case_id set: replays calculations.clearance_evaluation counters; a positive result resets consecutive_negative_count to 0"
          - "increments Inspection.version by 1"
      - from: SCHEDULED
        to: NO_ACCESS
        trigger: "POST /pest/inspections/{id}/no-access"
        actor: Technician
        preconditions: ["acting Technician.id == inspection.technician_id", "status == SCHEDULED"]
        side_effects:
          - "Unit.no_access_strikes += 1"
          - "CASCADE: when no_access_strikes reaches 2, resets strikes to 0 and, if the unit has a Lease in ACTIVE with pest_addendum_signed == true, auto-creates a Chargeback(kind=NON_COMPLIANCE_FEE, status=ASSESSED), which itself triggers the lease-balance recompute and possible LATE_FEE cascade (calculations.chargeback_amount, calculations.lease_balance)"
          - "increments Inspection.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /pest/inspections/{id}/cancel"
        actor: PropertyManager
        preconditions: ["status == SCHEDULED"]
        side_effects: ["if kind == INITIAL auto-created, re-evaluates Unit.pest_flag (MONITORING -> CLEAR when no SCHEDULED INITIAL remains)", "increments Inspection.version by 1"]

  - entity: Treatment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PREP_NOTIFIED
        trigger: "POST /pest/treatments/{id}/notify-prep"
        actor: PropertyManager
        preconditions: ["status == SCHEDULED", "window_start >= current logical time + 48h (PREP_NOTICE_HOURS)"]
        side_effects: ["sets prep_notified_at", "increments Treatment.version by 1"]
      - from: PREP_NOTIFIED
        to: PREP_NOTIFIED
        trigger: "POST /pest/treatments/{id}/acknowledge-prep (field update only; state unchanged)"
        actor: Resident
        preconditions: ["status == PREP_NOTIFIED", "acting Resident.unit_id == treatment.unit_id", "prep_acknowledged_at is null"]
        side_effects: ["sets prep_acknowledged_at", "increments Treatment.version by 1"]
      - from: PREP_NOTIFIED
        to: PREP_VERIFIED
        trigger: "POST /pest/treatments/{id}/verify-prep with compliant=true"
        actor: PropertyManager
        preconditions: ["status == PREP_NOTIFIED", "prep_acknowledged_at is not null"]
        side_effects: ["increments Treatment.version by 1"]
      - from: PREP_NOTIFIED
        to: NON_COMPLIANT
        trigger: "POST /pest/treatments/{id}/verify-prep with compliant=false"
        actor: PropertyManager
        preconditions: ["status == PREP_NOTIFIED", "prep_acknowledged_at is not null"]
        side_effects:
          - "CASCADE B link 1: if the unit has a Lease in ACTIVE with pest_addendum_signed == true, auto-creates Chargeback(kind=NON_COMPLIANCE_FEE, source_treatment_id=<this treatment>, status=ASSESSED)"
          - "CASCADE B link 2: the new chargeback recomputes Lease.outstanding_balance_cents and Lease.delinquent per calculations.lease_balance"
          - "CASCADE B link 3: if the recomputed balance crosses LATE_FEE_THRESHOLD_CENTS (50000) upward and no LATE_FEE chargeback in {ASSESSED, DISPUTED, UPHELD, BILLED} exists for the lease, system creates Chargeback(kind=LATE_FEE, status=ASSESSED) and recomputes the balance again"
          - "increments Treatment.version by 1"
      - from: NON_COMPLIANT
        to: SCHEDULED
        trigger: "POST /pest/treatments/{id}/reschedule"
        actor: PropertyManager
        preconditions: ["status == NON_COMPLIANT", "reschedule_count < 2 (RESCHEDULE_LIMIT)", "expected_treatment_version == current version (OCC)", "new window passes safety + temporal validations (unit double-booking, technician buffered overlap, heat floor gap)"]
        side_effects: ["sets window_start/window_end to the new window", "reschedule_count += 1", "clears prep_notified_at and prep_acknowledged_at to null", "recomputes Technician.booked_minutes for old and new windows", "increments Treatment.version by 1"]
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /pest/treatments/{id}/reschedule (plain move; state unchanged)"
        actor: PropertyManager
        preconditions: ["status == SCHEDULED", "reschedule_count < 2", "expected_treatment_version == current version (OCC)", "new window passes safety + temporal validations"]
        side_effects: ["sets window_start/window_end", "reschedule_count += 1", "recomputes Technician.booked_minutes", "increments Treatment.version by 1"]
      - from: PREP_VERIFIED
        to: COMPLETED
        trigger: "POST /pest/treatments/{id}/complete"
        actor: Technician
        preconditions: ["acting Technician.id == treatment.technician_id", "status == PREP_VERIFIED"]
        side_effects:
          - "sets actual_minutes"
          - "ServiceContract.spent_cents += estimated cost of treatment_type (CHEMICAL 12000 | HEAT 65000 | EXCLUSION 9000 | TRAPPING 6000)"
          - "recomputes Technician.booked_minutes (treatment leaves the booked set)"
          - "CASCADE: if bed_bug_case_id set AND all Treatments linked to that case are COMPLETED AND all FurnitureDisposal rows of that case are in {VERIFIED} or none exist, transitions BedBugCase TREATING -> MONITORING"
          - "increments Treatment.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /pest/treatments/{id}/cancel"
        actor: PropertyManager
        preconditions: ["status in {SCHEDULED, PREP_NOTIFIED, NON_COMPLIANT}"]
        side_effects: ["recomputes Technician.booked_minutes (releases the window)", "increments Treatment.version by 1"]
      - from: PREP_NOTIFIED
        to: CANCELLED
        trigger: "POST /pest/treatments/{id}/cancel"
        actor: PropertyManager
        preconditions: ["status in {SCHEDULED, PREP_NOTIFIED, NON_COMPLIANT}"]
        side_effects: ["recomputes Technician.booked_minutes (releases the window)", "increments Treatment.version by 1"]
      - from: NON_COMPLIANT
        to: CANCELLED
        trigger: "POST /pest/treatments/{id}/cancel"
        actor: PropertyManager
        preconditions: ["status in {SCHEDULED, PREP_NOTIFIED, NON_COMPLIANT}"]
        side_effects: ["recomputes Technician.booked_minutes (releases the window)", "increments Treatment.version by 1"]

  - entity: BedBugCase
    initial_state: OPEN
    terminal_states: [CLEARED]
    transitions:
      - from: OPEN
        to: TREATING
        trigger: "system (a Treatment with bed_bug_case_id == this case is created)"
        actor: system
        preconditions: []
        side_effects: ["increments BedBugCase.version by 1"]
      - from: TREATING
        to: MONITORING
        trigger: "system (on Treatment completion when every Treatment linked to the case is COMPLETED and every FurnitureDisposal is VERIFIED or none exist)"
        actor: system
        preconditions: []
        side_effects: ["increments BedBugCase.version by 1"]
      - from: MONITORING
        to: CLEARED
        trigger: "POST /pest/bed-bug-cases/{id}/evaluate-clearance"
        actor: PropertyManager
        preconditions:
          - "status == MONITORING"
          - "consecutive_negative_count >= 2 per calculations.clearance_evaluation"
          - "the two most recent consecutive negative FOLLOW_UP inspections are spaced >= 14 days apart (completed_at difference >= 14 days, inclusive)"
          - "every FurnitureDisposal of the case is VERIFIED (or none exist)"
        side_effects: ["sets cleared_at", "recomputes Unit.pest_flag (INFESTED -> CLEAR when no other non-terminal case and no SCHEDULED INITIAL inspection)", "recomputes Property.open_bed_bug_case_count and Property.posture", "increments BedBugCase.version by 1"]
      - from: MONITORING
        to: REOPENED
        trigger: "system (a FOLLOW_UP Inspection linked to this case completes with bed_bug_positive == true)"
        actor: system
        preconditions: []
        side_effects: ["resets consecutive_negative_count to 0", "recomputes Property.open_bed_bug_case_count and Property.posture", "increments BedBugCase.version by 1"]
      - from: REOPENED
        to: TREATING
        trigger: "system (a Treatment with bed_bug_case_id == this case is created)"
        actor: system
        preconditions: []
        side_effects: ["increments BedBugCase.version by 1"]

  - entity: FurnitureDisposal
    initial_state: PENDING
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /pest/furniture-disposals/{id}/verify with verified=true"
        actor: PropertyManager
        preconditions: ["status == PENDING"]
        side_effects: ["sets verified_at", "re-evaluates the owning BedBugCase TREATING -> MONITORING condition", "increments FurnitureDisposal.version by 1"]
      - from: PENDING
        to: REJECTED
        trigger: "POST /pest/furniture-disposals/{id}/verify with verified=false"
        actor: PropertyManager
        preconditions: ["status == PENDING"]
        side_effects: ["increments FurnitureDisposal.version by 1"]

  - entity: Chargeback
    initial_state: ASSESSED
    terminal_states: [WAIVED, PAID]
    transitions:
      - from: ASSESSED
        to: DISPUTED
        trigger: "POST /pest/chargebacks/{id}/dispute"
        actor: Resident
        preconditions: ["status == ASSESSED", "acting Resident.lease_id == chargeback.lease_id", "current logical time <= assessed_at + 14 days (DISPUTE_WINDOW_DAYS, inclusive)"]
        side_effects: ["sets disputed_at and dispute_reason", "increments Chargeback.version by 1"]
      - from: DISPUTED
        to: UPHELD
        trigger: "POST /pest/chargebacks/{id}/resolve-dispute with resolution=UPHELD"
        actor: ComplianceOfficer
        preconditions: ["status == DISPUTED", "expected_chargeback_version == current version (OCC)", "acting X-User-ID != chargeback.assessed_by (segregation of duties)"]
        side_effects: ["sets resolved_by and resolution", "recomputes Lease.outstanding_balance_cents (provisional leaves the balance set; UPHELD contributes 0 until billed — final computed at bill)", "increments Chargeback.version by 1"]
        note: "UPHELD chargebacks contribute final_amount_cents once BILLED; while UPHELD-but-unbilled they contribute 0 to the balance formula — balance shifts on bill."
      - from: DISPUTED
        to: WAIVED
        trigger: "POST /pest/chargebacks/{id}/resolve-dispute with resolution=WAIVED"
        actor: ComplianceOfficer
        preconditions: ["status == DISPUTED", "expected_chargeback_version == current version (OCC)", "acting X-User-ID != chargeback.assessed_by (segregation of duties)"]
        side_effects: ["sets resolved_by and resolution", "recomputes Lease.outstanding_balance_cents (WAIVED contributes 0 — compensating action restoring the balance)", "increments Chargeback.version by 1"]
      - from: ASSESSED
        to: BILLED
        trigger: "POST /pest/chargebacks/{id}/bill"
        actor: BillingClerk
        preconditions: ["status in {ASSESSED, UPHELD}"]
        side_effects: ["computes final_amount_cents per calculations.chargeback_amount final variant (per-line rounding then sum per calculations.chargeback_billing_total)", "sets billed_at", "recomputes Lease.outstanding_balance_cents (provisional replaced by final in the balance set)", "increments Chargeback.version by 1"]
      - from: UPHELD
        to: BILLED
        trigger: "POST /pest/chargebacks/{id}/bill"
        actor: BillingClerk
        preconditions: ["status in {ASSESSED, UPHELD}"]
        side_effects: ["computes final_amount_cents (final variant)", "sets billed_at", "recomputes Lease.outstanding_balance_cents", "increments Chargeback.version by 1"]
      - from: BILLED
        to: PAID
        trigger: "POST /pest/chargebacks/{id}/record-payment"
        actor: BillingClerk
        preconditions: ["status == BILLED", "amount_cents == final_amount_cents"]
        side_effects: ["sets paid_at", "recomputes Lease.outstanding_balance_cents (PAID contributes 0)", "increments Chargeback.version by 1"]

  - entity: ClaimPacket
    initial_state: DRAFT
    terminal_states: [FINALIZED, DISCARDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /pest/claim-packets/{id}/finalize"
        actor: ComplianceOfficer
        preconditions:
          - "status == DRAFT"
          - "every pinned_references entry's entity still exists"
          - "every pinned version == the referenced entity's current version (stale reference rejected)"
          - "every referenced Inspection has status == COMPLETED"
        side_effects: ["sets finalized_at", "packet becomes immutable", "increments ClaimPacket.version by 1"]
      - from: DRAFT
        to: DISCARDED
        trigger: "POST /pest/claim-packets/{id}/discard"
        actor: ComplianceOfficer
        preconditions: ["status == DRAFT"]
        side_effects: ["increments ClaimPacket.version by 1"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: treatment-reschedule-stale-version
    parent_entity: Treatment
    write_endpoint: "POST /pest/treatments/{id}/reschedule"
    occ_field: "expected_treatment_version"
    description: |
      Rescheduling a Treatment with an expected_treatment_version that no
      longer matches the Treatment's current version is rejected. This covers
      the case where another writer has already rescheduled, notified, or
      otherwise mutated the same treatment since the client last read it;
      the client's view of the schedule is stale and must be refreshed.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: chargeback-resolve-stale-version
    parent_entity: Chargeback
    write_endpoint: "POST /pest/chargebacks/{id}/resolve-dispute"
    occ_field: "expected_chargeback_version"
    description: |
      Resolving a dispute with an expected_chargeback_version that no longer
      matches the Chargeback's current version is rejected. A prior
      resolution or other mutation has already advanced the chargeback, so
      the deciding officer's view is stale and the dispute must be re-read.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: severity_classification
    trigger: "on POST /pest/inspections/{id}/complete"
    algorithm: threshold
    formula: |
      if live_sightings >= 10 or evidence_count >= 20: severity = SEVERE
      elif live_sightings >= 4 or evidence_count >= 8: severity = MODERATE
      elif live_sightings >= 1 or evidence_count >= 1: severity = LOW
      else: severity = NONE
    input_set: "the completing Inspection's live_sightings and evidence_count"
    constants:
      SEVERE_LIVE: 10
      SEVERE_EVIDENCE: 20
      MODERATE_LIVE: 4
      MODERATE_EVIDENCE: 8
      LOW_LIVE: 1
      LOW_EVIDENCE: 1
    precision: "integer comparison; >= is inclusive at every threshold"

  - name: adjacent_exposure_selector
    trigger: "when a BedBugCase enters OPEN (Cascade A link 2)"
    algorithm: topological
    formula: |
      candidates = units U' where U'.property_id == source.property_id
        AND U'.id != source.id
        AND U'.operational_status != "RENOVATION"
        AND ( (U'.floor == source.floor AND abs(U'.stack_index - source.stack_index) == 1)
           OR (U'.stack_index == source.stack_index AND abs(U'.floor - source.floor) == 1) )
      order: unit_number ASC (unit_number is unique per property, so no further tie-break is reachable)
      empty pool: no-op (no error, zero inspections created)
      for each candidate in order: create Inspection(kind=INITIAL, pest_type=BED_BUGS,
        status=SCHEDULED, bed_bug_case_id=<case>, scheduled_for = now + 24h,
        technician_id = completing technician) and set candidate.pest_flag = MONITORING
    input_set: "all Units of the source unit's Property"
    constants:
      ADJACENT_STACK_DELTA: 1
      ADJACENT_FLOOR_DELTA: 1
      AUTO_INITIAL_DELAY_HOURS: 24
    precision: "integer floor/stack arithmetic; deltas are exact equality"

  - name: exposure_posture
    trigger: "on BedBugCase create / reopen / clear (Cascade A link 4 and clearance)"
    algorithm: threshold
    formula: |
      open = count of BedBugCase over all units of the Property
             with status in {OPEN, TREATING, MONITORING, REOPENED}
      posture = RESTRICTED if open >= 3
                ELEVATED if open >= 1
                STANDARD otherwise
      open_bed_bug_case_count = open
    input_set: "BedBugCase rows joined through Unit.property_id; terminal CLEARED excluded"
    constants:
      RESTRICTED_OPEN_CASES: 3
      ELEVATED_OPEN_CASES: 1
    precision: "integer count; >= 3 is inclusive"

  - name: chargeback_amount
    trigger: "provisional variant: on chargeback creation (assess or system auto-create); final variant: on POST /pest/chargebacks/{id}/bill"
    algorithm: tiered_pricing
    formula: |
      RATE_CARD = { NON_COMPLIANCE_FEE: 15000, REPEAT_INFESTATION: 22000,
                    HEAT_SURCHARGE: 65000, LATE_FEE: 5000 }
      coverage = min(contract.coverage_per_incident_cents, 22000) if kind == REPEAT_INFESTATION else 0
      line bases (pre-surcharge):
        NON_COMPLIANCE_FEE: [15000]
        REPEAT_INFESTATION: [max(0, 22000 - coverage)]
        HEAT_SURCHARGE:     [65000]
        LATE_FEE:           [5000]
        FURNITURE_DISPOSAL: provisional -> planned_item_count lines of 7995 each
                            final       -> one line of 7995 per FurnitureDisposal of
                                           bed_bug_case_id with status VERIFIED
      overage line (final variant only, appended when source_treatment_id is set and
        that Treatment is COMPLETED): [max(0, actual_minutes - planned_minutes) * 175]
      evaluation order (pinned): compute each line base -> apply coverage to the
        REPEAT_INFESTATION line base only -> round each line independently
        (round_half_up to whole cents after * 1.075) -> sum rounded lines ->
        clamp: amount = min(sum, lease.chargeback_cap_cents), floored at 0.
    input_set: "the Chargeback, its Lease (chargeback_cap_cents), the property's ACTIVE ServiceContract (coverage_per_incident_cents), and for FURNITURE_DISPOSAL the linked BedBugCase's FurnitureDisposal rows"
    constants:
      ADMIN_SURCHARGE_PCT: 0.075
      DISPOSAL_ITEM_RATE_CENTS: 7995
      OVERAGE_RATE_CENTS_PER_MIN: 175
    precision: "whole cents; round_half_up applied per line BEFORE summing"
    variants:
      - name: provisional
        when: "at assessment (status ASSESSED)"
        difference: "FURNITURE_DISPOSAL uses planned_item_count; no overage line is included even when source_treatment_id is set"
      - name: final
        when: "at billing (transition to BILLED)"
        difference: "FURNITURE_DISPOSAL uses VERIFIED item count (REJECTED/PENDING excluded); overage line included when the source treatment is COMPLETED"

  - name: chargeback_billing_total
    trigger: "inside chargeback_amount final variant (line composition and rounding order)"
    algorithm: aggregation
    formula: |
      total = SUM over lines of round_half_up(line_base_cents * 1.075)
      PINNED ORDER: round each line to whole cents FIRST, then sum the rounded lines.
      (Rounding only the grand sum is forbidden: e.g. three disposal lines of
      7995 * 1.075 = 8594.625 each yield 3 * 8595 = 25785 per-line vs
      round(25783.875) = 25784 sum-then-round — the scaffold pins 25785.)
    input_set: "the line list produced by chargeback_amount"
    constants:
      ADMIN_SURCHARGE_PCT: 0.075
    precision: "whole cents; round_half_up per line, then integer sum"

  - name: lease_balance
    trigger: "on any Chargeback create / status transition (assess, dispute, resolve, bill, waive, payment)"
    algorithm: aggregation
    formula: |
      outstanding_balance_cents =
          SUM(provisional_amount_cents) over chargebacks with status in {ASSESSED, DISPUTED}
        + SUM(final_amount_cents)      over chargebacks with status in {UPHELD, BILLED}
        (WAIVED and PAID contribute 0)
      delinquent = outstanding_balance_cents > 0
      LATE-FEE TRIGGER (run after every upward recompute):
        if outstanding_balance_cents >= 50000
           AND no Chargeback with kind == LATE_FEE and status in
               {ASSESSED, DISPUTED, UPHELD, BILLED} exists for this lease:
          create Chargeback(kind=LATE_FEE, status=ASSESSED) and recompute once more.
    input_set: "all Chargeback rows of the Lease"
    constants:
      LATE_FEE_THRESHOLD_CENTS: 50000
      LATE_FEE_BASE_CENTS: 5000
    precision: "integer cents; threshold crossing is >= (inclusive)"

  - name: unit_pest_risk_score
    trigger: "on GET /pest/units/{id}/risk-score"
    algorithm: weighted_scoring
    formula: |
      severe_recent   = 40 if any COMPLETED Inspection of this unit with
                        severity == SEVERE and completed_at >= now - 90 days else 0
      prior_cases     = 15 * min(3, count of BedBugCase of this unit, any status)
      adjacent_open   = 10 * min(2, count of BedBugCase with status in
                        {OPEN, TREATING, MONITORING, REOPENED} on units selected by
                        adjacent_exposure_selector's eligibility predicate)
      recency_points  = 25 if no relevant treatment exists with its relevant
                        timestamp >= now - 180 days
                        else min(25, 5 * floor(days_since_most_recent / 30))
                        where days_since_most_recent = max(0, now - most_recent) in whole days
      score = min(100, severe_recent + prior_cases + adjacent_open + recency_points)
    input_set: "Inspections, Treatments, BedBugCases of the unit and its adjacent units"
    constants:
      W_SEVERE: 40
      W_CASE: 15
      CASE_CAP: 3
      W_ADJACENT: 10
      ADJACENT_CAP: 2
      RECENCY_MAX: 25
      RECENCY_STEP_DAYS: 30
      RECENCY_STEP_POINTS: 5
      SEVERE_WINDOW_DAYS: 90
      RECENCY_WINDOW_DAYS: 180
    precision: "integer score; floor division on whole days"
    variants:
      - name: FORWARD
        when: "variant=FORWARD (operations planning view)"
        difference: "relevant treatments are those with status in {SCHEDULED, PREP_NOTIFIED, PREP_VERIFIED, COMPLETED}; relevant timestamp is window_start (a future-dated scheduled treatment zeroes recency_points)"
      - name: HISTORICAL
        when: "variant=HISTORICAL (audit view)"
        difference: "relevant treatments are those with status COMPLETED; relevant timestamp is the treatment's window_start; scheduled-but-incomplete treatments are invisible, so recency_points stays high"

  - name: clearance_evaluation
    trigger: "on completion of a FOLLOW_UP Inspection (counter replay) and on POST /pest/bed-bug-cases/{id}/evaluate-clearance"
    algorithm: chronological
    formula: |
      replay the case's COMPLETED FOLLOW_UP inspections in completed_at ASC order
      (tie-break: created_at ASC):
        negative = (bed_bug_positive == false AND severity == NONE)
        consecutive_negative_count resets to 0 on any non-negative entry
      clearance passes iff:
        consecutive_negative_count >= 2
        AND (last_negative.completed_at - previous_negative.completed_at) >= 14 days (inclusive)
        AND every FurnitureDisposal of the case has status VERIFIED (or none exist)
    input_set: "COMPLETED FOLLOW_UP Inspections with bed_bug_case_id == case.id; other kinds excluded"
    constants:
      REQUIRED_CONSECUTIVE_NEGATIVES: 2
      MIN_NEGATIVE_SPACING_DAYS: 14
    precision: "day arithmetic on ISO timestamps; >= 14 days is inclusive"

  - name: technician_booked_minutes
    trigger: "on Treatment create / reschedule / cancel / complete"
    algorithm: aggregation
    formula: |
      booked_minutes = SUM(window_end - window_start in whole minutes) over
        Treatments with technician_id == technician AND status in
        {SCHEDULED, PREP_NOTIFIED, PREP_VERIFIED, NON_COMPLIANT}
    input_set: "all Treatments of the Technician; terminal COMPLETED/CANCELLED excluded"
    constants: {}
    precision: "integer minutes"

  - name: unit_pest_flag
    trigger: "on Inspection completion (positive), adjacent-exposure INITIAL creation/cancellation/completion, and BedBugCase clearance"
    algorithm: constraint_propagation
    formula: |
      pest_flag = INFESTED   if the unit has any BedBugCase in {OPEN, TREATING, MONITORING, REOPENED}
                  MONITORING else if the unit has any INITIAL Inspection in SCHEDULED
                  CLEAR      otherwise
    input_set: "BedBugCases and INITIAL Inspections of the unit"
    constants: {}
    precision: "enum projection; evaluation order INFESTED > MONITORING > CLEAR is pinned"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — first match wins)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and names a declared role; X-User-ID present (except on POST /_clock/set_current_utc where ProgramAdmin is still required)", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "acting role is listed in the endpoint's roles; for entity-backed ownership endpoints, acting Resident/Technician must own/be-assigned the target resource (Resident.unit_id matches path scope; Technician.id == assigned technician_id)", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "every path id and body FK reference exists, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: state, check: "target entity is in a state from which the requested transition is defined (generic state precondition; terminal states reject everything)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 4, category: state, check: "target entity is in a terminal state (COMPLETED/CANCELLED treatment or inspection, TERMINATED/EXPIRED contract, WAIVED/PAID chargeback, CLEARED case, FINALIZED/DISCARDED packet, VERIFIED/REJECTED disposal)", error_id: ERR_ALREADY_TERMINAL, http_status: 409, applies_to: "all action endpoints on terminal-state machines" }
  - { priority: 4, category: state, check: "treatment scheduling/rescheduling requires the property's ServiceContract status == ACTIVE", error_id: ERR_CONTRACT_NOT_ACTIVE, http_status: 409, applies_to: ["POST /pest/units/{id}/treatments", "POST /pest/treatments/{id}/reschedule"] }
  - { priority: 4, category: state, check: "chargeback assessment requires Lease.status == ACTIVE", error_id: ERR_LEASE_NOT_ACTIVE, http_status: 409, applies_to: ["POST /pest/leases/{id}/chargebacks"] }
  - { priority: 4, category: state, check: "verify-prep requires prep_notified_at set (status PREP_NOTIFIED)", error_id: ERR_PREP_NOT_NOTIFIED, http_status: 409, applies_to: ["POST /pest/treatments/{id}/verify-prep"] }
  - { priority: 4, category: state, check: "verify-prep requires prep_acknowledged_at set", error_id: ERR_PREP_NOT_ACKNOWLEDGED, http_status: 409, applies_to: ["POST /pest/treatments/{id}/verify-prep"] }
  - { priority: 4, category: state, check: "evaluate-clearance requires BedBugCase.status == MONITORING", error_id: ERR_CASE_NOT_MONITORING, http_status: 409, applies_to: ["POST /pest/bed-bug-cases/{id}/evaluate-clearance"] }
  - { priority: 5, category: state, check: "OCC: expected_<parent>_version equals the parent entity's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["POST /pest/treatments/{id}/reschedule", "POST /pest/chargebacks/{id}/resolve-dispute"] }
  - { priority: 6, category: business_safety, check: "treatment_type == HEAT requires vacancy_attested == true", error_id: ERR_HEAT_SAFETY_VIOLATION, http_status: 422, applies_to: ["POST /pest/units/{id}/treatments", "POST /pest/treatments/{id}/reschedule"] }
  - { priority: 7, category: business_temporal, check: "unit double-booking: [window_start, window_end) must not intersect any non-terminal Treatment of the same unit (half-open intervals, no buffer; the treatment being rescheduled is excluded from its own conflict set)", error_id: ERR_UNIT_DOUBLE_BOOKED, http_status: 409, applies_to: ["POST /pest/units/{id}/treatments", "POST /pest/treatments/{id}/reschedule"] }
  - { priority: 8, category: business_temporal, check: "technician buffered overlap: effective interval [window_start - 15min, window_end + 15min) must not intersect the effective interval of any other non-terminal Treatment of the same technician (half-open with 15-minute travel buffer on both sides; the treatment being rescheduled is excluded)", error_id: ERR_TREATMENT_WINDOW_CONFLICT, http_status: 409, applies_to: ["POST /pest/units/{id}/treatments", "POST /pest/treatments/{id}/reschedule"] }
  - { priority: 9, category: business_temporal, check: "heat floor gap: a HEAT treatment requires |window_start difference| >= 24h against every other non-terminal HEAT treatment on the same property and floor (the treatment being rescheduled is excluded)", error_id: ERR_HEAT_FLOOR_GAP_VIOLATION, http_status: 409, applies_to: ["POST /pest/units/{id}/treatments", "POST /pest/treatments/{id}/reschedule"] }
  - { priority: 10, category: business_temporal, check: "notify-prep requires window_start >= current logical time + 48h", error_id: ERR_PREP_NOTICE_TOO_LATE, http_status: 422, applies_to: ["POST /pest/treatments/{id}/notify-prep"] }
  - { priority: 10, category: business_temporal, check: "dispute requires current logical time <= assessed_at + 14 days (inclusive)", error_id: ERR_DISPUTE_WINDOW_EXPIRED, http_status: 422, applies_to: ["POST /pest/chargebacks/{id}/dispute"] }
  - { priority: 11, category: business_constraint, check: "reschedule requires reschedule_count < 2", error_id: ERR_RESCHEDULE_LIMIT_EXCEEDED, http_status: 422, applies_to: ["POST /pest/treatments/{id}/reschedule"] }
  - { priority: 11, category: business_constraint, check: "evaluate-clearance requires the clearance formula to pass (consecutive negatives, 14-day spacing)", error_id: ERR_CLEARANCE_CRITERIA_UNMET, http_status: 422, applies_to: ["POST /pest/bed-bug-cases/{id}/evaluate-clearance"] }
  - { priority: 11, category: business_constraint, check: "evaluate-clearance rejects when any FurnitureDisposal of the case is PENDING or REJECTED", error_id: ERR_DISPOSAL_UNVERIFIED, http_status: 422, applies_to: ["POST /pest/bed-bug-cases/{id}/evaluate-clearance"] }
  - { priority: 11, category: business_constraint, check: "claim packet finalize rejects when any pinned reference version != the entity's current version", error_id: ERR_CLAIM_PACKET_STALE_REFERENCE, http_status: 409, applies_to: ["POST /pest/claim-packets/{id}/finalize"] }
  - { priority: 11, category: business_constraint, check: "lease creation rejected while Property.posture == RESTRICTED", error_id: ERR_PROPERTY_RESTRICTED, http_status: 409, applies_to: ["POST /pest/units/{id}/leases"] }
  - { priority: 11, category: business_constraint, check: "claim packet finalize requires every referenced Inspection to be COMPLETED", error_id: ERR_INSPECTION_NOT_COMPLETED, http_status: 409, applies_to: ["POST /pest/claim-packets/{id}/finalize"] }
  - { priority: 11, category: business_constraint, check: "unit_number must be unique within the property", error_id: ERR_DUPLICATE_UNIT_NUMBER, http_status: 409, applies_to: ["POST /pest/properties/{id}/units"] }
  - { priority: 12, category: business_referential, check: "treatment/inspection pest_type must be in the ACTIVE contract's scope_pest_types", error_id: ERR_CONTRACT_SCOPE_EXCLUDED, http_status: 422, applies_to: ["POST /pest/units/{id}/treatments", "POST /pest/units/{id}/inspections"] }
  - { priority: 12, category: business_referential, check: "manual chargeback assessment requires Lease.pest_addendum_signed == true", error_id: ERR_LEASE_CLAUSE_MISSING, http_status: 422, applies_to: ["POST /pest/leases/{id}/chargebacks"] }
  - { priority: 12, category: business_referential, check: "HEAT_SURCHARGE kind requires the contract's heat_treatment_included == false; LATE_FEE is not manually assessable; FURNITURE_DISPOSAL requires bed_bug_case_id and planned_item_count", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: ["POST /pest/leases/{id}/chargebacks"] }
  - { priority: 13, category: business_fiscal, check: "treatment scheduling requires contract spent_cents + estimated cost of treatment_type <= monthly_budget_cents (estimate: CHEMICAL 12000 | HEAT 65000 | EXCLUSION 9000 | TRAPPING 6000)", error_id: ERR_CONTRACT_BUDGET_EXCEEDED, http_status: 422, applies_to: ["POST /pest/units/{id}/treatments"] }
  - { priority: 13, category: business_fiscal, check: "record-payment requires amount_cents == final_amount_cents", error_id: ERR_PAYMENT_AMOUNT_MISMATCH, http_status: 422, applies_to: ["POST /pest/chargebacks/{id}/record-payment"] }
  - { priority: 14, category: business_constraint, check: "segregation of duties: resolve-dispute acting X-User-ID must differ from chargeback.assessed_by", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: ["POST /pest/chargebacks/{id}/resolve-dispute"] }
  - { priority: 3, category: existence, check: "malformed body, missing required field, unknown enum member, or window_start >= window_end", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving logical clock ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Sets the server logical clock. Startup default before any call is exactly 2026-08-01T00:00:00Z (never wall-clock). All timestamps stamped by the server use this clock.", roles: [ProgramAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["lazy EXPIRED/ENDED transitions may apply on subsequent reads"] }

  # --- Property ---
  - { method: POST, path: "/pest/properties", description: "Create a community", roles: [ProgramAdmin], code: 201, input: [name, address, "timezone?"], output: Property, side_effects: [] }
  - { method: GET, path: "/pest/properties", description: "List properties (paginated)", roles: [ProgramAdmin, PropertyManager, BillingClerk, ComplianceOfficer], code: 200, input: ["limit?", "offset?"], output: "Property[]", side_effects: [] }
  - { method: GET, path: "/pest/properties/{id}", description: "Read one property", roles: [ProgramAdmin, PropertyManager, BillingClerk, ComplianceOfficer], code: 200, input: [], output: Property, side_effects: [] }
  - { method: GET, path: "/pest/properties/{id}/summary", description: "Computed read: posture, open_bed_bug_case_count, aggregate outstanding balance", roles: [ProgramAdmin, PropertyManager, BillingClerk, ComplianceOfficer], code: 200, input: [], output: { posture: string, open_bed_bug_case_count: integer, total_outstanding_balance_cents: integer }, side_effects: ["recomputes exposure_posture"] }

  # --- ServiceContract ---
  - { method: POST, path: "/pest/properties/{id}/contracts", description: "Create contract in DRAFT", roles: [ProgramAdmin], code: 201, input: [vendor_name, scope_pest_types, visits_per_month, coverage_per_incident_cents, heat_treatment_included, monthly_budget_cents, start_date, end_date], output: ServiceContract, side_effects: [] }
  - { method: GET, path: "/pest/properties/{id}/contracts", description: "List contracts of a property", roles: [ProgramAdmin, PropertyManager, BillingClerk], code: 200, input: ["limit?", "offset?"], output: "ServiceContract[]", side_effects: [] }
  - { method: GET, path: "/pest/contracts/{id}", description: "Read one contract", roles: [ProgramAdmin, PropertyManager, BillingClerk], code: 200, input: [], output: ServiceContract, side_effects: ["lazy EXPIRED transition applies when current date > end_date"] }
  - { method: POST, path: "/pest/contracts/{id}/activate", description: "DRAFT -> ACTIVE", roles: [ProgramAdmin], code: 200, input: [], output: ServiceContract, side_effects: ["increments ServiceContract.version by 1"] }
  - { method: POST, path: "/pest/contracts/{id}/suspend", description: "ACTIVE -> SUSPENDED", roles: [ProgramAdmin], code: 200, input: [], output: ServiceContract, side_effects: ["increments ServiceContract.version by 1"] }
  - { method: POST, path: "/pest/contracts/{id}/reactivate", description: "SUSPENDED -> ACTIVE", roles: [ProgramAdmin], code: 200, input: [], output: ServiceContract, side_effects: ["increments ServiceContract.version by 1"] }
  - { method: POST, path: "/pest/contracts/{id}/terminate", description: "ACTIVE|SUSPENDED -> TERMINATED", roles: [ProgramAdmin], code: 200, input: [], output: ServiceContract, side_effects: ["increments ServiceContract.version by 1"] }

  # --- Unit ---
  - { method: POST, path: "/pest/properties/{id}/units", description: "Create a unit", roles: [ProgramAdmin], code: 201, input: [unit_number, floor, stack_index, bedrooms, "operational_status?"], output: Unit, side_effects: [] }
  - { method: GET, path: "/pest/properties/{id}/units", description: "List units of a property", roles: [ProgramAdmin, PropertyManager, Technician, BillingClerk, ComplianceOfficer], code: 200, input: ["limit?", "offset?", "floor?"], output: "Unit[]", side_effects: [] }
  - { method: GET, path: "/pest/units/{id}", description: "Read one unit", roles: [ProgramAdmin, PropertyManager, Technician, BillingClerk, ComplianceOfficer, Resident], code: 200, input: [], output: Unit, side_effects: [] }
  - { method: GET, path: "/pest/units/{id}/risk-score", description: "Computed read: unit pest risk score per variant", roles: [ProgramAdmin, PropertyManager], code: 200, input: [variant], output: { score: integer, variant: string, severe_recent: integer, prior_cases_points: integer, adjacent_open_points: integer, recency_points: integer }, side_effects: [] }
  - { method: GET, path: "/pest/units/{id}/adjacent-exposure", description: "Computed read: units the adjacent-exposure selector would pick for this unit", roles: [ProgramAdmin, PropertyManager], code: 200, input: [], output: "Unit[]", side_effects: [] }

  # --- Lease & Resident ---
  - { method: POST, path: "/pest/units/{id}/leases", description: "Create a lease (blocked while property RESTRICTED)", roles: [PropertyManager], code: 201, input: [start_date, end_date, pest_addendum_signed, chargeback_clause_version, chargeback_cap_cents], output: Lease, side_effects: [] }
  - { method: GET, path: "/pest/units/{id}/leases", description: "List leases of a unit", roles: [ProgramAdmin, PropertyManager, BillingClerk, Resident], code: 200, input: ["limit?", "offset?"], output: "Lease[]", side_effects: [] }
  - { method: GET, path: "/pest/leases/{id}", description: "Read one lease", roles: [ProgramAdmin, PropertyManager, BillingClerk, Resident], code: 200, input: [], output: Lease, side_effects: ["lazy ENDED transition applies when current date > end_date"] }
  - { method: GET, path: "/pest/leases/{id}/chargebacks", description: "List chargebacks of a lease", roles: [ProgramAdmin, PropertyManager, BillingClerk, Resident], code: 200, input: ["limit?", "offset?", "status?"], output: "Chargeback[]", side_effects: [] }
  - { method: POST, path: "/pest/units/{id}/residents", description: "Register a resident on a unit+lease", roles: [PropertyManager], code: 201, input: [full_name, email, lease_id], output: Resident, side_effects: [] }
  - { method: GET, path: "/pest/units/{id}/residents", description: "List residents of a unit", roles: [ProgramAdmin, PropertyManager], code: 200, input: ["limit?", "offset?"], output: "Resident[]", side_effects: [] }
  - { method: GET, path: "/pest/leases/{id}/residents", description: "List residents of a lease", roles: [ProgramAdmin, PropertyManager, BillingClerk], code: 200, input: ["limit?", "offset?"], output: "Resident[]", side_effects: [] }

  # --- Technician ---
  - { method: POST, path: "/pest/technicians", description: "Register a vendor technician", roles: [ProgramAdmin], code: 201, input: [full_name, vendor_name, "active?"], output: Technician, side_effects: [] }
  - { method: GET, path: "/pest/technicians/{id}", description: "Read one technician (includes booked_minutes)", roles: [ProgramAdmin, PropertyManager, Technician], code: 200, input: [], output: Technician, side_effects: [] }
  - { method: GET, path: "/pest/technicians/{id}/treatments", description: "List treatments assigned to a technician (schedule view)", roles: [ProgramAdmin, PropertyManager, Technician], code: 200, input: ["limit?", "offset?", "status?"], output: "Treatment[]", side_effects: [] }
  - { method: GET, path: "/pest/technicians/{id}/inspections", description: "List inspections assigned to a technician", roles: [ProgramAdmin, PropertyManager, Technician], code: 200, input: ["limit?", "offset?", "status?"], output: "Inspection[]", side_effects: [] }

  # --- Inspection ---
  - { method: POST, path: "/pest/units/{id}/inspections", description: "Schedule an inspection", roles: [PropertyManager], code: 201, input: [technician_id, kind, pest_type, scheduled_for, "bed_bug_case_id?"], output: Inspection, side_effects: [] }
  - { method: GET, path: "/pest/units/{id}/inspections", description: "List inspections of a unit", roles: [ProgramAdmin, PropertyManager, Technician, Resident], code: 200, input: ["limit?", "offset?", "kind?", "status?"], output: "Inspection[]", side_effects: [] }
  - { method: GET, path: "/pest/inspections/{id}", description: "Read one inspection", roles: [ProgramAdmin, PropertyManager, Technician, Resident, ComplianceOfficer], code: 200, input: [], output: Inspection, side_effects: [] }
  - { method: GET, path: "/pest/bed-bug-cases/{id}/inspections", description: "List inspections linked to a bed bug case", roles: [ProgramAdmin, PropertyManager, Technician], code: 200, input: ["limit?", "offset?"], output: "Inspection[]", side_effects: [] }
  - { method: GET, path: "/pest/inspections/{id}/treatments", description: "List treatments originating from an inspection", roles: [ProgramAdmin, PropertyManager, Technician], code: 200, input: ["limit?", "offset?"], output: "Treatment[]", side_effects: [] }
  - { method: POST, path: "/pest/inspections/{id}/complete", description: "Complete with findings; computes severity; may trigger Cascade A (bed bug case + adjacent exposure)", roles: [Technician], code: 200, input: [live_sightings, evidence_count, bed_bug_positive], output: Inspection, side_effects: ["computes severity", "Cascade A links 1-4 when bed_bug_positive", "FOLLOW_UP counter replay when linked to a case"] }
  - { method: POST, path: "/pest/inspections/{id}/no-access", description: "Mark NO_ACCESS; accrues unit strike and may auto-create non-compliance chargeback", roles: [Technician], code: 200, input: ["reason?"], output: Inspection, side_effects: ["Unit.no_access_strikes += 1; at 2 strikes resets and auto-assesses NON_COMPLIANCE_FEE chargeback + lease-balance recompute"] }
  - { method: POST, path: "/pest/inspections/{id}/cancel", description: "Cancel a scheduled inspection", roles: [PropertyManager], code: 200, input: [], output: Inspection, side_effects: ["re-evaluates Unit.pest_flag for auto-created INITIAL inspections"] }

  # --- Treatment ---
  - { method: POST, path: "/pest/units/{id}/treatments", description: "Schedule a treatment (contract ACTIVE + scope + budget + safety + overlap gates)", roles: [PropertyManager], code: 201, input: [technician_id, pest_type, treatment_type, window_start, window_end, "vacancy_attested?", "inspection_id?", "bed_bug_case_id?"], output: Treatment, side_effects: ["recomputes Technician.booked_minutes", "BedBugCase OPEN|REOPENED -> TREATING when bed_bug_case_id set"] }
  - { method: GET, path: "/pest/units/{id}/treatments", description: "List treatments of a unit", roles: [ProgramAdmin, PropertyManager, Technician, Resident], code: 200, input: ["limit?", "offset?", "status?"], output: "Treatment[]", side_effects: [] }
  - { method: GET, path: "/pest/treatments/{id}", description: "Read one treatment", roles: [ProgramAdmin, PropertyManager, Technician, Resident, BillingClerk, ComplianceOfficer], code: 200, input: [], output: Treatment, side_effects: [] }
  - { method: GET, path: "/pest/bed-bug-cases/{id}/treatments", description: "List treatments linked to a bed bug case", roles: [ProgramAdmin, PropertyManager, Technician], code: 200, input: ["limit?", "offset?"], output: "Treatment[]", side_effects: [] }
  - { method: GET, path: "/pest/treatments/{id}/chargebacks", description: "List chargebacks sourced from a treatment", roles: [ProgramAdmin, PropertyManager, BillingClerk], code: 200, input: ["limit?", "offset?"], output: "Chargeback[]", side_effects: [] }
  - { method: POST, path: "/pest/treatments/{id}/notify-prep", description: "SCHEDULED -> PREP_NOTIFIED; requires 48h notice", roles: [PropertyManager], code: 200, input: [], output: Treatment, side_effects: ["sets prep_notified_at", "increments Treatment.version by 1"] }
  - { method: POST, path: "/pest/treatments/{id}/acknowledge-prep", description: "Resident acknowledges prep requirements (state unchanged)", roles: [Resident], code: 200, input: [], output: Treatment, side_effects: ["sets prep_acknowledged_at", "increments Treatment.version by 1"] }
  - { method: POST, path: "/pest/treatments/{id}/verify-prep", description: "compliant=true -> PREP_VERIFIED; compliant=false -> NON_COMPLIANT + Cascade B", roles: [PropertyManager], code: 200, input: [compliant, "notes?"], output: Treatment, side_effects: ["on compliant=false: Cascade B links 1-3 (chargeback, balance, late fee)", "increments Treatment.version by 1"] }
  - { method: POST, path: "/pest/treatments/{id}/reschedule", description: "Move window (from SCHEDULED or NON_COMPLIANT); OCC-guarded; reschedule_count limit 2", roles: [PropertyManager], code: 200, input: [window_start, window_end, expected_treatment_version], output: Treatment, side_effects: ["reschedule_count += 1", "clears prep timestamps when coming from NON_COMPLIANT", "recomputes Technician.booked_minutes", "increments Treatment.version by 1"] }
  - { method: POST, path: "/pest/treatments/{id}/complete", description: "PREP_VERIFIED -> COMPLETED; books contract spend; may advance BedBugCase to MONITORING", roles: [Technician], code: 200, input: [actual_minutes], output: Treatment, side_effects: ["ServiceContract.spent_cents += estimated cost", "recomputes Technician.booked_minutes", "BedBugCase TREATING -> MONITORING when all linked treatments COMPLETED and disposals verified", "increments Treatment.version by 1"] }
  - { method: POST, path: "/pest/treatments/{id}/cancel", description: "Cancel from SCHEDULED | PREP_NOTIFIED | NON_COMPLIANT", roles: [PropertyManager], code: 200, input: ["reason?"], output: Treatment, side_effects: ["recomputes Technician.booked_minutes", "increments Treatment.version by 1"] }

  # --- BedBugCase & FurnitureDisposal ---
  - { method: GET, path: "/pest/units/{id}/bed-bug-cases", description: "List bed bug cases of a unit", roles: [ProgramAdmin, PropertyManager, Resident], code: 200, input: ["limit?", "offset?", "status?"], output: "BedBugCase[]", side_effects: [] }
  - { method: GET, path: "/pest/bed-bug-cases/{id}", description: "Read one bed bug case", roles: [ProgramAdmin, PropertyManager, Technician, Resident], code: 200, input: [], output: BedBugCase, side_effects: [] }
  - { method: GET, path: "/pest/bed-bug-cases/{id}/chargebacks", description: "List chargebacks linked to a bed bug case", roles: [ProgramAdmin, PropertyManager, BillingClerk], code: 200, input: ["limit?", "offset?"], output: "Chargeback[]", side_effects: [] }
  - { method: POST, path: "/pest/bed-bug-cases/{id}/furniture-disposals", description: "Log a furniture disposal item (PENDING)", roles: [PropertyManager], code: 201, input: [item_description, quantity], output: FurnitureDisposal, side_effects: [] }
  - { method: GET, path: "/pest/bed-bug-cases/{id}/furniture-disposals", description: "List disposal items of a case", roles: [ProgramAdmin, PropertyManager, Resident], code: 200, input: ["limit?", "offset?", "status?"], output: "FurnitureDisposal[]", side_effects: [] }
  - { method: POST, path: "/pest/furniture-disposals/{id}/verify", description: "verified=true -> VERIFIED; verified=false -> REJECTED", roles: [PropertyManager], code: 200, input: [verified, "note?"], output: FurnitureDisposal, side_effects: ["sets verified_at when verified", "re-evaluates BedBugCase TREATING -> MONITORING condition", "increments FurnitureDisposal.version by 1"] }
  - { method: POST, path: "/pest/bed-bug-cases/{id}/evaluate-clearance", description: "MONITORING -> CLEARED when clearance formula passes", roles: [PropertyManager], code: 200, input: [], output: BedBugCase, side_effects: ["sets cleared_at", "recomputes Unit.pest_flag", "recomputes Property.open_bed_bug_case_count and posture", "increments BedBugCase.version by 1"] }

  # --- Chargeback ---
  - { method: POST, path: "/pest/leases/{id}/chargebacks", description: "Assess a chargeback (computes provisional amount; runs late-fee cascade)", roles: [BillingClerk], code: 201, input: [kind, "planned_item_count?", "source_treatment_id?", "bed_bug_case_id?", "note?"], output: Chargeback, side_effects: ["computes provisional_amount_cents", "recomputes Lease.outstanding_balance_cents + delinquent", "late-fee cascade when balance crosses 50000 upward"] }
  - { method: GET, path: "/pest/chargebacks/{id}", description: "Read one chargeback", roles: [ProgramAdmin, PropertyManager, BillingClerk, ComplianceOfficer, Resident], code: 200, input: [], output: Chargeback, side_effects: [] }
  - { method: POST, path: "/pest/chargebacks/{id}/dispute", description: "ASSESSED -> DISPUTED within 14-day window", roles: [Resident], code: 200, input: [reason], output: Chargeback, side_effects: ["sets disputed_at", "increments Chargeback.version by 1"] }
  - { method: POST, path: "/pest/chargebacks/{id}/resolve-dispute", description: "DISPUTED -> UPHELD | WAIVED; OCC-guarded; segregation of duties", roles: [ComplianceOfficer], code: 200, input: [resolution, expected_chargeback_version], output: Chargeback, side_effects: ["sets resolved_by/resolution", "recomputes Lease.outstanding_balance_cents", "increments Chargeback.version by 1"] }
  - { method: POST, path: "/pest/chargebacks/{id}/bill", description: "ASSESSED|UPHELD -> BILLED; computes final_amount_cents (final variant)", roles: [BillingClerk], code: 200, input: [], output: Chargeback, side_effects: ["computes final_amount_cents", "sets billed_at", "recomputes Lease.outstanding_balance_cents", "increments Chargeback.version by 1"] }
  - { method: POST, path: "/pest/chargebacks/{id}/record-payment", description: "BILLED -> PAID when amount matches final", roles: [BillingClerk], code: 200, input: [amount_cents], output: Chargeback, side_effects: ["sets paid_at", "recomputes Lease.outstanding_balance_cents", "increments Chargeback.version by 1"] }

  # --- ClaimPacket ---
  - { method: POST, path: "/pest/properties/{id}/claim-packets", description: "Assemble habitability documentation packet (snapshots reference versions)", roles: [ComplianceOfficer], code: 201, input: [claim_reference, references], output: ClaimPacket, side_effects: ["captures pinned_references versions"] }
  - { method: GET, path: "/pest/properties/{id}/claim-packets", description: "List claim packets of a property", roles: [ProgramAdmin, PropertyManager, ComplianceOfficer], code: 200, input: ["limit?", "offset?"], output: "ClaimPacket[]", side_effects: [] }
  - { method: GET, path: "/pest/claim-packets/{id}", description: "Read one claim packet", roles: [ProgramAdmin, ComplianceOfficer], code: 200, input: [], output: ClaimPacket, side_effects: [] }
  - { method: POST, path: "/pest/claim-packets/{id}/finalize", description: "DRAFT -> FINALIZED; validates pinned versions and completed inspections", roles: [ComplianceOfficer], code: 200, input: [], output: ClaimPacket, side_effects: ["sets finalized_at; packet immutable", "increments ClaimPacket.version by 1"] }
  - { method: POST, path: "/pest/claim-packets/{id}/discard", description: "DRAFT -> DISCARDED", roles: [ComplianceOfficer], code: 200, input: [], output: ClaimPacket, side_effects: ["increments ClaimPacket.version by 1"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not allowed on endpoint, or entity-backed ownership/assignment check failed (Resident not of this unit/lease; Technician not the assignee)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or referenced FK does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, malformed value, unknown enum member, window_start >= window_end, disallowed kind (manual LATE_FEE), HEAT_SURCHARGE while contract includes heat, FURNITURE_DISPOSAL without bed_bug_case_id/planned_item_count" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not defined from the entity's current (non-terminal) state" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Action attempted on an entity in a terminal state" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "Treatment scheduling/rescheduling while the property contract is DRAFT, SUSPENDED, TERMINATED, or EXPIRED" }
  - { id: ERR_LEASE_NOT_ACTIVE, http: 409, condition: "Chargeback assessment while the lease is ENDED" }
  - { id: ERR_PREP_NOT_NOTIFIED, http: 409, condition: "verify-prep while treatment is still SCHEDULED (prep never notified)" }
  - { id: ERR_PREP_NOT_ACKNOWLEDGED, http: 409, condition: "verify-prep while prep_acknowledged_at is null" }
  - { id: ERR_CASE_NOT_MONITORING, http: 409, condition: "evaluate-clearance while the case is not MONITORING" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_<parent>_version does not match the parent's current version" }
  - { id: ERR_HEAT_SAFETY_VIOLATION, http: 422, condition: "HEAT treatment scheduled/rescheduled without vacancy_attested == true" }
  - { id: ERR_UNIT_DOUBLE_BOOKED, http: 409, condition: "Unit already has a non-terminal treatment intersecting [window_start, window_end)" }
  - { id: ERR_TREATMENT_WINDOW_CONFLICT, http: 409, condition: "Technician's buffered interval [start-15min, end+15min) intersects another non-terminal assigned treatment" }
  - { id: ERR_HEAT_FLOOR_GAP_VIOLATION, http: 409, condition: "HEAT treatment within 24h of another non-terminal HEAT treatment on the same property+floor" }
  - { id: ERR_PREP_NOTICE_TOO_LATE, http: 422, condition: "notify-prep with window_start < current logical time + 48h" }
  - { id: ERR_DISPUTE_WINDOW_EXPIRED, http: 422, condition: "dispute after assessed_at + 14 days" }
  - { id: ERR_RESCHEDULE_LIMIT_EXCEEDED, http: 422, condition: "reschedule attempted with reschedule_count >= 2" }
  - { id: ERR_CLEARANCE_CRITERIA_UNMET, http: 422, condition: "evaluate-clearance with consecutive_negative_count < 2 or negative spacing < 14 days" }
  - { id: ERR_DISPOSAL_UNVERIFIED, http: 422, condition: "evaluate-clearance while any FurnitureDisposal is PENDING or REJECTED" }
  - { id: ERR_CLAIM_PACKET_STALE_REFERENCE, http: 409, condition: "finalize with a pinned reference version no longer current" }
  - { id: ERR_PROPERTY_RESTRICTED, http: 409, condition: "lease creation while Property.posture == RESTRICTED" }
  - { id: ERR_INSPECTION_NOT_COMPLETED, http: 409, condition: "claim packet finalize referencing an Inspection not in COMPLETED" }
  - { id: ERR_DUPLICATE_UNIT_NUMBER, http: 409, condition: "unit_number already exists within the property" }
  - { id: ERR_CONTRACT_SCOPE_EXCLUDED, http: 422, condition: "pest_type not in the ACTIVE contract's scope_pest_types" }
  - { id: ERR_LEASE_CLAUSE_MISSING, http: 422, condition: "manual chargeback assessment while lease pest_addendum_signed == false" }
  - { id: ERR_CONTRACT_BUDGET_EXCEEDED, http: 422, condition: "scheduling would push contract spent_cents + estimate over monthly_budget_cents" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 422, condition: "record-payment amount_cents != final_amount_cents" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "resolve-dispute acting X-User-ID equals chargeback.assessed_by" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Platform operator administering properties, contracts, units, technicians; owns the logical clock"
    identity: opaque
    exclusive_operations: ["create property", "create/activate/suspend/reactivate/terminate contract", "create unit", "create technician", "set logical clock"]
    shared_operations: ["read any resource", "list collections"]
  - name: PropertyManager
    description: "On-site community manager running the day-to-day pest program"
    identity: opaque
    exclusive_operations: ["create lease", "create resident", "schedule/cancel inspection", "schedule treatment", "notify-prep", "verify-prep", "reschedule treatment", "cancel treatment", "log/verify furniture disposal", "evaluate clearance"]
    shared_operations: ["read units/inspections/treatments/cases/chargebacks", "view summaries and risk scores"]
  - name: Technician
    description: "Vendor field technician; acts only on records assigned to them"
    identity: entity_backed:Technician
    exclusive_operations: ["complete assigned inspection", "mark assigned inspection no-access", "complete assigned treatment"]
    shared_operations: ["read own schedule", "read assigned records"]
  - name: Resident
    description: "Unit resident; acts only on records of their own unit/lease"
    identity: entity_backed:Resident
    exclusive_operations: ["acknowledge prep requirements", "dispute own chargeback"]
    shared_operations: ["read own unit, inspections, treatments, cases, disposals, chargebacks"]
  - name: BillingClerk
    description: "Fiscal operator assessing and collecting chargebacks; barred from resolving disputes (segregation of duties)"
    identity: opaque
    exclusive_operations: ["assess chargeback", "bill chargeback", "record payment"]
    shared_operations: ["read leases/chargebacks/contracts"]
  - name: ComplianceOfficer
    description: "Habitability-compliance officer adjudicating disputes and finalizing claim packets; barred from assessing or billing chargebacks"
    identity: opaque
    exclusive_operations: ["resolve dispute", "assemble/finalize/discard claim packet"]
    shared_operations: ["read chargebacks/inspections/treatments", "view summaries"]
