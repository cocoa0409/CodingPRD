            - { call: "POST /dock-tickets", payload: { vessel_id: "${v_id}", catch_area_id: "${ca_id}", landing_start_at: "2026-08-01T10:00:00Z", landing_end_at: "2026-08-01T12:00:00Z" }, as: DockBuyer, captures: { t2_id: $.data.id, t2_v: $.data.version } }
