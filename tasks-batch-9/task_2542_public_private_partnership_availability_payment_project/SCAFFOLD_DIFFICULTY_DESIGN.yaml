            - "both periods carry gross_unitary_charge_cents 8604167 and deduction_cap_cents 1720833 — the frozen monthly charge is not day-prorated"
            - "STRADDLING IS REJECTED — the third POST returns ERR_SERVICE_PERIOD_OVERLAP with HTTP 409; [2027-03-31, 2027-04-30) intersects both existing periods"
            - "GET /ppp/service-periods?concession_id=${csn_id} returns total_count 2, so the rejected period was not persisted"
            - "the two accepted periods have distinct period_index values 1 and 2, so the refusal was the overlap rule and not ERR_DUPLICATE_PERIOD_INDEX"

