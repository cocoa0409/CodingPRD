            - { call: "POST /cable-diagnostics/outage-windows", payload: { circuit_id: "${c}", kind: "PLANNED_DIAGNOSTIC", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z" }, as: NetworkPlanner, captures: { w: $.data.id } }
          trigger:
            - { call: "POST /cable-diagnostics/outage-windows/${w}/approve", as: NetworkPlanner, captures: { est: $.data.estimated_charge_cents } }
            - { call: "POST /cable-diagnostics/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/activate", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/close", payload: { restored_at: "2026-08-10T12:00:00Z" }, as: NetworkPlanner, captures: { act: $.data.overrun_charge_cents, ov: $.data.overrun_minutes } }
          assert:
            - "estimated_charge_cents == 3600 at approve (estimate variant: ceil(240*0.10)=24 -> 9 chargeable x 400)"
            - "after close at exactly window_end: overrun_minutes == 0 and overrun_charge_cents == 0 (actual variant)"

      - name: health_empty_input_set_scores_100
        claim_type: input_set_filtering
        grounds: ["calculations.health_index_score"]
        distinguishing_aspect: "Empty included-set edge: a circuit with no series and no faults scores penalty 0 -> 100.0 GOOD rather than erroring; age below 25y contributes 0."
        test_recipe:
          setup: ["circuit installed 2015 (age 11y at clock 2026), no jobs, no series"]
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-C4", voltage_class: "KV_15", length_m: 1000, installation_year: 2015 }, as: SystemAdmin, captures: { c: $.data.id } }
            - { call: "GET /cable-diagnostics/circuits/${c}", as: AssetEngineer, captures: { cv: $.data.version } }
          trigger:
            - { call: "POST /cable-diagnostics/health-assessments", payload: { circuit_id: "${c}", basis: "FORMAL", expected_circuit_version: "${cv}" }, as: AssetEngineer, captures: { score: $.data.health_index_score, band: $.data.band } }
          assert: ["health_index_score == 100.0, band == GOOD, recommended_action == NONE, penalty_components all 0"]

      - name: invoice_with_no_work_lines
        claim_type: correct_result
        grounds: ["calculations.job_invoice_cents"]
        distinguishing_aspect: "Zero-line aggregation edge: invoice over a job with no excavations/splices equals estimate_cents exactly (424000 for length 1000 + [VLF_TAN_DELTA])."
        test_recipe:
          setup: ["circuit length 1000; job PLANNED (estimate 424000); no faults"]
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-C5", voltage_class: "KV_15", length_m: 1000, installation_year: 2015 }, as: SystemAdmin, captures: { c: $.data.id } }
            - { call: "POST /cable-diagnostics/outage-windows", payload: { circuit_id: "${c}", kind: "PLANNED_DIAGNOSTIC", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-12T12:00:00Z" }, as: NetworkPlanner, captures: { w: $.data.id } }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/approve", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/test-jobs", payload: { circuit_id: "${c}", outage_window_id: "${w}", requested_methods: ["VLF_TAN_DELTA"], approved_budget_cents: 800000 }, as: NetworkPlanner, captures: { j: $.data.id } }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/plan", as: NetworkPlanner }
          trigger:
            - { call: "GET /cable-diagnostics/test-jobs/${j}/invoice", as: NetworkPlanner, captures: { inv: $.data.invoice_total_cents, exc: $.data.excavation_total_cents, spl: $.data.splice_total_cents } }
          assert: ["invoice_total_cents == 424000; excavation_total_cents == 0; splice_total_cents == 0"]

      - name: corridor_min_half_width_applies
        claim_type: precision
        grounds: ["calculations.fault_distance_corridor"]
        distinguishing_aspect: "Nested min/max edge: at trace 0.5 us the 10% half-width (3.9 m) falls below CORRIDOR_MIN_M, so the corridor clamps to +/-5.0 m: d 39.0 -> [34.0, 44.0]."
        test_recipe:
          setup: ["job IN_PROGRESS; FAIL series evaluated; fault SUSPECTED exists"]
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-C6", voltage_class: "KV_15", length_m: 1000, installation_year: 2015 }, as: SystemAdmin, captures: { c: $.data.id } }
            - { call: "POST /cable-diagnostics/outage-windows", payload: { circuit_id: "${c}", kind: "PLANNED_DIAGNOSTIC", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-12T12:00:00Z" }, as: NetworkPlanner, captures: { w: $.data.id } }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/approve", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/test-jobs", payload: { circuit_id: "${c}", outage_window_id: "${w}", requested_methods: ["VLF_TAN_DELTA"], approved_budget_cents: 800000 }, as: NetworkPlanner, captures: { j: $.data.id } }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/plan", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/isolation-permits", payload: { test_job_id: "${j}", isolation_points: ["SW-N"], ground_count: 2 }, as: SafetyOfficer, as_user_id: "so-1", captures: { p: $.data.id } }
            - { call: "POST /cable-diagnostics/isolation-permits/${p}/issue", as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /cable-diagnostics/isolation-permits/${p}/verify-grounding", as: SafetyOfficer, as_user_id: "so-2" }
            - { call: "POST /cable-diagnostics/mobile-units", payload: { unit_code: "VAN-1", capabilities: ["VLF", "PD", "TDR"], max_test_voltage_kv: 30.0 }, as: SystemAdmin, captures: { u: $.data.id } }
            - { call: "POST /cable-diagnostics/equipment-assignments", payload: { mobile_unit_id: "${u}", test_job_id: "${j}", mobilize_at: "2026-08-10T07:00:00Z", demobilize_at: "2026-08-12T12:00:00Z" }, as: DispatchCoordinator, captures: { a: $.data.id } }
            - { call: "POST /cable-diagnostics/equipment-assignments/${a}/confirm", as: DispatchCoordinator }
            - { call: "POST /cable-diagnostics/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/activate", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/start", as: TestSupervisor }
            - { call: "POST /cable-diagnostics/test-series", payload: { test_job_id: "${j}", method: "VLF_TAN_DELTA", test_voltage_kv: 13.05 }, as: TestSupervisor, captures: { s: $.data.id } }
            - { call: "POST /cable-diagnostics/test-series/${s}/energize", as: TestSupervisor }
            - { call: "POST /cable-diagnostics/test-series/${s}/readings", payload: { step_index: 0, applied_voltage_kv: 4.35, tan_delta_e3: 90.0, ambient_temp_c: 20.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${s}/readings", payload: { step_index: 1, applied_voltage_kv: 8.7, tan_delta_e3: 90.0, ambient_temp_c: 20.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${s}/readings", payload: { step_index: 2, applied_voltage_kv: 13.05, tan_delta_e3: 90.0, ambient_temp_c: 20.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${s}/evaluate", as: TestSupervisor }
            - { call: "GET /cable-diagnostics/test-series/${s}/faults", as: TestSupervisor, captures: { f: "$.data[0].id" } }
          trigger:
            - { call: "POST /cable-diagnostics/faults/${f}/pinpoint", payload: { trace_time_us: 0.5, pinpoint_method: "PULSE_ECHO" }, as: FaultCrewLead, captures: { d: $.data.pinpointed_distance_m, lo: $.data.corridor_start_m, hi: $.data.corridor_end_m } }
          assert:
            - "pinpointed_distance_m == 39.0 (0.52 * 300 * 0.5 / 2)"
            - "corridor_start_m == 34.0 and corridor_end_m == 44.0 (10% = 3.9 < 5.0 -> clamped)"

  # ============================================================= validations
  - section: validations
    instances:
      - name: missing_auth_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Request without X-User-Role/X-User-ID is 401 ERR_UNAUTHENTICATED before any role check. (Sent with headers omitted.)"
        test_recipe:
          setup: ["one circuit exists"]
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-V1", voltage_class: "KV_15", length_m: 1000, installation_year: 2015 }, as: SystemAdmin, captures: { c: $.data.id } }
          trigger:
            - call: "GET /cable-diagnostics/circuits/${c}"
              captures: { err: $.data.error_id }
          assert: ["error_id == ERR_UNAUTHENTICATED, http 401"]

      - name: window_in_past_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_WINDOW_IN_PAST]"]
        distinguishing_aspect: "window_start earlier than the logical clock is rejected even when no overlap exists."
        test_recipe:
          setup: ["circuit exists; clock advanced to 2026-08-10T09:00Z"]
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-V2", voltage_class: "KV_15", length_m: 1000, installation_year: 2015 }, as: SystemAdmin, captures: { c: $.data.id } }
            - { call: "POST /cable-diagnostics/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /cable-diagnostics/outage-windows", payload: { circuit_id: "${c}", kind: "PLANNED_DIAGNOSTIC", window_start: "2026-08-09T08:00:00Z", window_end: "2026-08-09T12:00:00Z" }, as: NetworkPlanner, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_WINDOW_IN_PAST, http 409"]

      - name: voltage_tolerance_boundary
        claim_type: violation_to_error
        grounds: ["validations[priority=21]", "errors[ERR_VOLTAGE_MISMATCH]"]
        distinguishing_aspect: "±5% inclusive tolerance on 1.5*U0 (13.05 kV): 13.7025 kV accepted, 13.7026 kV rejected."
        test_recipe:
          setup: ["job IN_PROGRESS (no permit/equipment needed for series creation)"]
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-V3", voltage_class: "KV_15", length_m: 1000, installation_year: 2015 }, as: SystemAdmin, captures: { c: $.data.id } }
            - { call: "POST /cable-diagnostics/outage-windows", payload: { circuit_id: "${c}", kind: "PLANNED_DIAGNOSTIC", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-12T12:00:00Z" }, as: NetworkPlanner, captures: { w: $.data.id } }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/approve", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/test-jobs", payload: { circuit_id: "${c}", outage_window_id: "${w}", requested_methods: ["VLF_TAN_DELTA"], approved_budget_cents: 800000 }, as: NetworkPlanner, captures: { j: $.data.id } }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/plan", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/activate", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/start", as: TestSupervisor }
          trigger:
            - { call: "POST /cable-diagnostics/test-series", payload: { test_job_id: "${j}", method: "VLF_TAN_DELTA", test_voltage_kv: 13.7025 }, as: TestSupervisor, captures: { s: $.data.id } }
            - { call: "POST /cable-diagnostics/test-series", payload: { test_job_id: "${j}", method: "VLF_TAN_DELTA", test_voltage_kv: 13.7026 }, as: TestSupervisor, captures: { err: $.data.error_id } }
          assert:
            - "13.7025 kV (exactly +5%) created with 201, step_count == 3"
            - "13.7026 kV rejected: error_id == ERR_VOLTAGE_MISMATCH, http 422"

      - name: duplicate_step_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=25]", "errors[ERR_DUPLICATE_STEP]"]
        distinguishing_aspect: "(test_series_id, step_index) is unique: second reading for step 0 rejected."
        test_recipe:
          setup: ["series ENERGIZING with step 0 logged"]
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-V4", voltage_class: "KV_15", length_m: 1000, installation_year: 2015 }, as: SystemAdmin, captures: { c: $.data.id } }
            - { call: "POST /cable-diagnostics/outage-windows", payload: { circuit_id: "${c}", kind: "PLANNED_DIAGNOSTIC", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-12T12:00:00Z" }, as: NetworkPlanner, captures: { w: $.data.id } }
