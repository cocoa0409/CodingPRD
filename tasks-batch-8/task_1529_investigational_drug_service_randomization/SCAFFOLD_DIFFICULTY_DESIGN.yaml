  - rule_id: resource_temporal_overlap
    instances:
      - name: monitor_visit_half_open_adjacency_allowed
        grounds:
          - validations[priority=8]
          - errors[ERR_MONITOR_VISIT_OVERLAP]
        distinguishing_aspect: |
          HALF-OPEN interval semantics on the SITE resource: a new visit starting
          exactly at the previous visit's end (12:00 == 12:00) is ACCEPTED
          (adjacency permitted), while a visit overlapping by one hour is
          rejected with ERR_MONITOR_VISIT_OVERLAP.
        test_recipe:
          setup:
            - "Study ACTIVE; site ACTIVE; no visits yet"
          setup_api_calls:
            - { call: "POST /api/studies", payload: { protocol_number: "P-OVL-1", title: "Overlap Study", phase: "PHASE_II", blinding_model: "DOUBLE_BLIND", max_dose_per_visit_mg: 200, unblinding_suspension_threshold_pct: 10 }, as: SponsorAdmin, captures: { study: $.data.id, study_v1: $.data.version } }
            - { call: "POST /api/fee-schedules", payload: { study_id: "${study}", setup_fee_cents: 0, dispensing_fee_cents: 5000, dispensing_tier_threshold: 2, dispensing_tier_fee_cents: 3000, monitoring_fee_cents_per_hour: 10000, storage_fee_cents_per_kit_month: 100, unblinding_fee_cents: 25000, overhead_pct: 0 }, as: SponsorAdmin, captures: { fs: $.data.id } }
            - { call: "POST /api/fee-schedules/${fs}/approve", payload: { expected_study_version: "${study_v1}" }, as: SponsorAdmin }
            - { call: "POST /api/studies/${study}/transition", payload: { to: "ACTIVE" }, as: SponsorAdmin }
            - { call: "POST /api/sites", payload: { study_id: "${study}", site_number: "S1", name: "Site One", principal_investigator: "Dr A" }, as: SponsorAdmin, captures: { site: $.data.id } }
            - { call: "POST /api/sites/${site}/transition", payload: { to: "ACTIVE" }, as: SponsorAdmin }
          trigger:
            - { call: "POST /api/monitor-visits", payload: { site_id: "${site}", monitor_name: "CRA A", scheduled_start: "2026-08-10T09:00:00Z", scheduled_end: "2026-08-10T12:00:00Z" }, as: Monitor, captures: { mvA: $.data.id } }
            - { call: "POST /api/monitor-visits", payload: { site_id: "${site}", monitor_name: "CRA B", scheduled_start: "2026-08-10T12:00:00Z", scheduled_end: "2026-08-10T15:00:00Z" }, as: Monitor, captures: { mvB: $.data.id } }
            - { call: "POST /api/monitor-visits", payload: { site_id: "${site}", monitor_name: "CRA C", scheduled_start: "2026-08-10T11:00:00Z", scheduled_end: "2026-08-10T13:00:00Z" }, as: Monitor, captures: { err: $.data.error_id } }
          assert:
            - "mvA and mvB both created (201): [09:00,12:00) and [12:00,15:00) are adjacent half-open intervals — touching endpoints do not overlap"
            - "err == ERR_MONITOR_VISIT_OVERLAP for [11:00,13:00), which intersects both mvA and mvB"
      - name: destruction_window_requires_buffer_between_bookings
        grounds:
          - validations[priority=8]
          - errors[ERR_DESTRUCTION_WINDOW_CONFLICT]
        distinguishing_aspect: |
          DIFFERENT interval semantics on a DIFFERENT resource (destruction
          facility bookings at a site): CLOSED intervals plus a mandatory
          30-minute buffer — a booking starting 11:15 after a [10:00,11:00]
          window is rejected (inside buffer), and only a start at exactly
