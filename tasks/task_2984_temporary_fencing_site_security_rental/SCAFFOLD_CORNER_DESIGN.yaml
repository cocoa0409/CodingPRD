              as_user_id: "dc-001"
          assert:
            - "All three creations return 201 with version 1"
            - "Crew.${c1_id}.certified_for_solid_screen is false (default applied) and Crew.${c2_id}.certified_for_solid_screen is true"
            - "Fourth trigger: HTTP 200 and Crew.${c2_id}.crew_code == \"CRW-B\", depot_code == \"DEP-1\", daily_capacity_hours == 12.0"
            - "Fifth trigger: total_count == 2, has_more is false, and the returned rows are exactly ${c1_id} and ${c2_id}"
            - "Sixth trigger: total_count == 1 and the single row is ${c2_id}"
            - "Seventh trigger: exactly 1 row, limit == 1, offset == 0, total_count == 2 (the filtered total) and has_more is true"

      - name: accept_action_records_the_signer_and_refuses_a_draft_quote
