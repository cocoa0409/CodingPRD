- rule_id: dual_variant_calc
  instances:
  - name: rail_fee_aggregate_charge_vs_tranche_series
    grounds:
    - calculations.rail_fee_schedule
    - calculations.rail_fee_schedule.variants.aggregate_charge
    - calculations.rail_fee_schedule.variants.tranche_series
    - entities.PaymentOrder.fields.rail
    - entities.PaymentOrder.fields.amount_cents
    - entities.Transaction.fields.entry_type
    - entities.Transaction.fields.net_effect_cents
    distinguishing_aspect: 'The two fee variants for the same PaymentOrder differ in the number of FEE Transactions
      they emit, not in their sum: aggregate_charge books one leg of -1250 cents while tranche_series books 500
      + 250 + 250 + 250, so asserting on the count separates them where asserting on the total does not.'
    test_recipe:
      setup:
      - Logical clock 2026-09-01T00:00:00Z. One WIRE CREDIT order for 3000000 cents approved and dispatched.
