          setup:
            - "Logical clock at 2026-08-11T00:00:00Z."
            - "One COMMERCIAL pilot CERTIFIED at 2026-08-05T00:00:00Z, one REGISTERED 249 g airframe, one uncontrolled class G zone."
            - "One ACTIVE indemnified InsurancePolicy: coverage_limit_cents 2000000, deductible_cents 50000, remaining_coverage_cents 2000000."
            - "Flight A: COMPLETED COMMERCIAL, 2026-08-10T09:00:00Z .. 2026-08-10T10:00:00Z, incident_occurred true, covered by that policy."
            - "Flight B: PLANNED COMMERCIAL, 2026-08-20T09:00:00Z .. 2026-08-20T10:00:00Z, created while the policy still had 2000000 cents, covered by the same policy."
