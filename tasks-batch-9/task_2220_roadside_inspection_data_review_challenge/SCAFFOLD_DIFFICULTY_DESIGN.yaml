      - name: driver_attribution_counts_conserved_on_attribution_release
        grounds:
          - entities.Carrier.fields.unattributed_violation_count
          - entities.Carrier.fields.scored_violation_count
          - calculations.driver_attribution_scores
          - state_machines.CoachingAssignment.ASSIGNED_to_WAIVED
        distinguishing_aspect: |
          Releasing and re-applying a driver attribution conserves the carrier-level identity
          attributed + unattributed == scored_violation_count == 2 at every step while
          strict_attribution_score moves 15.00 -> 0.00 -> 15.00 with no drift and the BasicScore row is
          untouched (30.0 / 1.000 / 65.0), yet the WAIVED coaching assignment is NOT resurrected -
          the terminal state is the one thing the compensation does not undo.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Carrier c1 (MEDIUM, power_unit_exposure 30.0) and ACTIVE driver d1."
            - "Driver-attributable UNSAFE_DRIVING code weight 5; UNSAFE_DRIVING/MEDIUM threshold 0.5 / 1.0 / 2.0."
            - "One SCORED report dated 2026-07-01 with two weight-5 UNSAFE_DRIVING violations: v1 is a DRIVER unit attributed to d1, v2 is a VEHICLE unit with no driver."
            - "Starting ledger: Driver attributed_violation_count 1, strict_attribution_score 15.00, coaching_required true; Carrier scored_violation_count 2, unattributed_violation_count 1, open_coaching_count 1."
            - "One ASSIGNED CoachingAssignment for d1 on v1 (session 2026-08-05T14:00:00Z to 2026-08-05T16:00:00Z)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
            - call: "POST /carriers"
              payload: { dot_number: "1000001", legal_name: "Buckeye Freight LLC", average_power_units: 20, annual_vmt: 1600000 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { c1_id: $.data.id }
            - call: "POST /drivers"
              payload: { carrier_id: "${c1_id}", cdl_number: "OH-D-99001", full_name: "Dana Reyes", employment_status: "ACTIVE" }
              as: CarrierSafetyManager
              as_user_id: "${c1_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /violation-codes"
              payload: { code: "392.2S", description: "Speeding 15 or more over the limit", basic_category: "UNSAFE_DRIVING", severity_weight: 5, driver_attributable: true }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { vc_ud5_id: $.data.id }
            - call: "POST /intervention-thresholds"
              payload: { basic_category: "UNSAFE_DRIVING", carrier_segment: "MEDIUM", effective_from: "2026-01-01T00:00:00Z", measure_at_p50: 0.5, measure_at_p65: 1.0, measure_at_p80: 2.0 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
            - call: "POST /inspection-reports"
              payload: { report_number: "OH2026070120", inspection_state: "OH", inspection_level: 2, inspection_start: "2026-07-01T14:00:00Z", inspection_end: "2026-07-01T15:00:00Z", vehicle_vin: "1FUJA6CK21LK00020", attributed_carrier_id: "${c1_id}", selection_source: "RANDOM", driver_id: "${d1_id}" }
              as: StateInspectionOfficer
              as_user_id: "officer_ohio_1"
              captures: { r1_id: $.data.id }
            - call: "POST /inspection-reports/${r1_id}/violations"
              payload: { violation_code_id: "${vc_ud5_id}", unit_type: "DRIVER", driver_id: "${d1_id}" }
              as: StateInspectionOfficer
              as_user_id: "officer_ohio_1"
              captures: { v1_id: $.data.id }
            - call: "POST /inspection-reports/${r1_id}/violations"
              payload: { violation_code_id: "${vc_ud5_id}", unit_type: "VEHICLE" }
              as: StateInspectionOfficer
              as_user_id: "officer_ohio_1"
              captures: { v2_id: $.data.id }
            - call: "POST /inspection-reports/${r1_id}/validate"
              payload: {}
              as: StateInspectionOfficer
              as_user_id: "officer_ohio_1"
            - call: "POST /inspection-reports/${r1_id}/score"
              payload: {}
              as: StateInspectionOfficer
              as_user_id: "officer_ohio_1"
            - call: "POST /coaching-assignments"
              payload: { driver_id: "${d1_id}", violation_id: "${v1_id}", curriculum_code: "UNSAFE_DRIVING_101", session_start: "2026-08-05T14:00:00Z", session_end: "2026-08-05T16:00:00Z" }
              as: CarrierSafetyManager
              as_user_id: "${c1_id}"
              captures: { ca1_id: $.data.id }
          trigger:
