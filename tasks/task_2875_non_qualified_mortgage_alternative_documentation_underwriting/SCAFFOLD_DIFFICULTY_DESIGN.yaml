      - name: high_cost_safety_error_beats_already_pooled_referential_error
        grounds:
          - validations.priority_18
          - validations.priority_33
          - calculations.points_and_fees_test
          - endpoints.POST_securitization_pools_id_loans
        distinguishing_aspect: |
          A different error-category pair from the first instance: `business_safety`
          (priority 18, ERR_HIGH_COST_LOAN_PROHIBITED) against `business_referential`
          (priority 33, ERR_LOAN_ALREADY_POOLED), on a different endpoint
          (POST /securitization-pools/{id}/loans). A post-close fee correction flips the
          points-and-fees test to FAIL on a loan that is already a member of another pool,
          so both rules are live; the safety error must be returned. Voiding the fee removes
          only the safety violation and the referential error then surfaces.
        test_recipe:
          setup:
            - "A DSCR program and two OPEN pools, PL-2026A and PL-2026B, each with target_balance_cents 200000000."
            - "Loan A (60000000 cents, 80000000-cent investment property, interest-only at 8.750) driven to CLOSED with no fee items, so total_loan_amount_cents is 60000000, the cap is 3000000 and the test result is PASS."
            - "Loan A is assigned to PL-2026A, so its pool_id is set."
            - "A 3100000-cent LOAN_LEVEL_PRICE_ADJUSTMENT is then added post-close; the item is INCLUDED and is not a prepaid finance charge, so the total becomes 3100000 against the unchanged 3000000 cap and the test re-runs to FAIL."
          setup_api_calls:
            - call: "POST /documentation-programs"
              payload: { program_code: "DSCR", name: "Investor DSCR", min_dscr: 1.1000, max_ltv_pct: 85.00, min_fico: 660, min_reserves_months: 6, min_residual_income_cents: 0, second_valuation_ltv_threshold_pct: 90.00, second_valuation_loan_amount_threshold_cents: 150000000, atr_exempt_flag: true, seasoning_matrix: { FORECLOSURE: 36, SHORT_SALE: 24, DEED_IN_LIEU: 24, BK_CH7: 24, BK_CH13: 12, MODIFICATION: 12, MORTGAGE_LATE_60: 12 } }
              as: ProgramAdmin
              captures: { prog_hp_id: "$.data.id" }
            - call: "POST /borrowers"
              payload: { legal_name: "Jarrow Yield LLC", fico_score: 745, self_employed_flag: false, entity_ownership_pct: 100.0, monthly_debt_obligations_cents: 0, verified_liquid_assets_cents: 5000000, age_years: 55 }
              as: LoanOfficer
              captures: { bor_hp_id: "$.data.id" }
            - call: "POST /securitization-pools"
              payload: { pool_code: "PL-2026A", investor_code: "INV-ATLAS", target_balance_cents: 200000000 }
              as: SecuritizationAnalyst
              captures: { pool_hp_a_id: "$.data.id", pool_hp_a_v0: "$.data.version" }
            - call: "POST /securitization-pools"
              payload: { pool_code: "PL-2026B", investor_code: "INV-ATLAS", target_balance_cents: 200000000 }
              as: SecuritizationAnalyst
              captures: { pool_hp_b_id: "$.data.id", pool_hp_b_v0: "$.data.version" }
            - call: "POST /loan-files"
              payload: { borrower_id: "${bor_hp_id}", program_id: "${prog_hp_id}", investor_code: "INV-ATLAS", loan_amount_cents: 60000000, purchase_price_cents: 80000000, property_value_cents: 80000000, occupancy: "INVESTMENT", purpose: "PURCHASE", lien_position: "FIRST", note_rate_pct: 8.750, apor_pct: 6.100, term_months: 360, amortization_type: "INTEREST_ONLY", monthly_taxes_cents: 60000, monthly_insurance_cents: 20000, monthly_hoa_cents: 0, gross_market_rent_cents: 620000, lease_rent_cents: 640000 }
              as: LoanOfficer
              captures: { lf_hp_id: "$.data.id" }
            - call: "POST /loan-files/${lf_hp_id}/doc-type-selection"
              payload: { doc_type: "DSCR" }
              as: Underwriter
              as_user_id: "uw-10"
            - call: "POST /loan-files/${lf_hp_id}/submit-to-underwriting"
              payload: {}
              as: LoanOfficer
            - call: "POST /valuation-orders"
              payload: { loan_file_id: "${lf_hp_id}", valuation_type: "PRIMARY_APPRAISAL", vendor_code: "VND-ALPHA", effective_date: "2026-05-01T00:00:00Z" }
              as: AppraisalReviewer
              captures: { vo_hp_id: "$.data.id" }
            - call: "POST /valuation-orders/${vo_hp_id}/receive"
              payload: { appraised_value_cents: 80000000 }
              as: AppraisalReviewer
            - call: "POST /valuation-orders/${vo_hp_id}/decision"
              payload: { decision: "ACCEPTED" }
              as: AppraisalReviewer
            - call: "POST /loan-files/${lf_hp_id}/points-and-fees-test"
              payload: {}
              as: Underwriter
              as_user_id: "uw-10"
            - call: "POST /loan-files/${lf_hp_id}/atr-determination"
              payload: {}
              as: Underwriter
              as_user_id: "uw-10"
            - call: "POST /loan-files/${lf_hp_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw-10"
            - call: "POST /loan-files/${lf_hp_id}/close"
              payload: {}
              as: LoanOfficer
            - call: "POST /securitization-pools/${pool_hp_a_id}/loans"
              payload: { loan_file_id: "${lf_hp_id}", expected_pool_version: "${pool_hp_a_v0}" }
              as: SecuritizationAnalyst
            - call: "POST /points-and-fees-items"
              payload: { loan_file_id: "${lf_hp_id}", fee_code: "LLPA-INV-3", fee_category: "LOAN_LEVEL_PRICE_ADJUSTMENT", amount_cents: 3100000, prepaid_finance_charge_flag: false }
              as: LoanOfficer
              captures: { fee_hp_id: "$.data.id" }
          trigger:
            - call: "POST /securitization-pools/${pool_hp_b_id}/loans"
              payload: { loan_file_id: "${lf_hp_id}", expected_pool_version: "${pool_hp_b_v0}" }
              as: SecuritizationAnalyst
            - call: "POST /points-and-fees-items/${fee_hp_id}/void"
              payload: { void_reason: "LLPA billed to the wrong file" }
              as: LoanOfficer
            - call: "POST /securitization-pools/${pool_hp_b_id}/loans"
              payload: { loan_file_id: "${lf_hp_id}", expected_pool_version: "${pool_hp_b_v0}" }
              as: SecuritizationAnalyst
          assert:
            - "pre-trigger baseline: LoanFile.${lf_hp_id}.points_and_fees_total_cents == 3100000, total_loan_amount_cents == 60000000, points_and_fees_cap_cents == 3000000, points_and_fees_test_result == FAIL, securitization_eligible == false, pool_id == the PL-2026A id"
            - "trigger call 1 -> 422 ERR_HIGH_COST_LOAN_PROHIBITED (priority 18 wins over the priority-32 eligibility breach and the priority-33 already-pooled breach, both of which are also live)"
            - "trigger call 1 leaves SecuritizationPool.${pool_hp_b_id} at member_loan_count == 0, aggregate_scheduled_balance_cents == 0 and its original version"
            - "trigger call 2 -> 200, PointsAndFeesItem.${fee_hp_id}.status == VOIDED, LoanFile.${lf_hp_id}.points_and_fees_total_cents == 0, points_and_fees_cap_cents == 3000000, points_and_fees_test_result == PASS, securitization_eligible == true"
            - "trigger call 3 -> 422 ERR_LOAN_ALREADY_POOLED (the safety violation is gone, so the referential rule now surfaces)"
            - "LoanFile.${lf_hp_id}.pool_id still points at PL-2026A after all three calls"

  - rule_id: boundary_precision_check
    instances:
      - name: hoepa_tier_boundary_and_exact_cap_equality_at_one_cent
        grounds:
          - calculations.points_and_fees_test
          - calculations.points_and_fees_test.constants.HOEPA_TIER_BOUNDARY_CENTS
          - calculations.points_and_fees_test.constants.SMALL_LOAN_FLAT_CAP_CENTS
          - endpoints.POST_loan_files_id_points_and_fees_test
        distinguishing_aspect: |
          Metric under test: whole cents (total_loan_amount_cents against the 2486600-cent
          HOEPA tier boundary, and points_and_fees_total_cents against the derived cap).
          Endpoint under test: POST /loan-files/{id}/points-and-fees-test. Two loans one cent
          apart in loan_amount_cents land on opposite sides of the tier boundary, and on the
          large-loan side the total equals the cap exactly - which passes, because step 5
          compares with a strict >.
        test_recipe:
          setup:
            - "One BANK_STATEMENT_12MO program and one self-employed borrower with 500000 cents of verified liquid assets."
            - "Loan H (2586600 cents) and loan L (2586500 cents), both fully amortizing first liens at 9.500 over 360 months on a 3600000-cent primary residence with taxes 8000 and insurance 2500."
            - "Both files are moved to UNDERWRITING and carry the identical fee schedule: 100000 cents of ORIGINATION_POINTS flagged as a prepaid finance charge, 24330 cents of AFFILIATE_TITLE, and 180000 cents of ESCROW_TAXES also flagged prepaid."
