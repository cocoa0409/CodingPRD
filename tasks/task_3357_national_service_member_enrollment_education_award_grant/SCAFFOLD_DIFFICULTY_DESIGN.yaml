              captures: { error_id: $.data.error_id }
            - *d_clr_a1
            - *d_clr_a2
            - call: "POST /criminal-history-checks/${chk_a}/component-results"
              payload: { component: "FBI_FINGERPRINT", result: "CLEAR" }
              as: CNCSProgramOfficer
            - call: "GET /enrollments/${enr_a}"
              payload: {}
              as: CNCSProgramOfficer
            - call: "GET /slots/${slot_a}"
              payload: {}
              as: CNCSProgramOfficer
            - call: "POST /enrollments/${enr_a}/hour-entries"
              payload: { service_date: "2026-10-16", minutes: 480, activity_code: "DIRECT_SERVICE" }
              as: GranteeStaff
              as_user_id: "${org_id}"
          assert:
            - "before adjudication the hour entry fails 409 with error_id == ERR_ENROLLMENT_NOT_ACTIVE and MemberEnrollment.${enr_a}.status == PENDING_CHECKS"
            - "the third CLEAR component adjudicates the check CLEARED and the enrollment auto-transitions to ACTIVE (system transition, no enrollment endpoint call in between)"
            - "PositionSlot.${slot_a}.status == FILLED and fill_count == 1 after activation"
            - "after activation the same hour-entry payload succeeds with 201"

      - name: for_cause_exit_blocked_by_escalated_grievance
        grounds:
          - state_machines.MemberEnrollment.ACTIVE_to_RELEASED_FOR_CAUSE
          - state_machines.Grievance.FILED_to_ESCALATED
          - state_machines.Grievance.ESCALATED_to_RESOLVED
          - validations[priority=19]
        distinguishing_aspect: "Entity pair MemberEnrollment x Grievance: a FOR_CAUSE exit is rejected with ERR_GRIEVANCE_PENDING while the enrollment has an ESCALATED grievance, and succeeds only after the federal officer resolves it (DISMISSED)."
        test_recipe:
          setup:
            - "Award ACTIVE with 2 FULL_TIME slots; member A enrolled and ACTIVE; grievance filed by member A and escalated."
          setup_api_calls:
            - *d_clock0
            - *d_org
            - *d_comp
            - *d_app_2ft_4m
            - *d_submit
            - *d_clock_close
            - *d_close
            - *d_award_4m
            - *d_member_a
            - *d_check_a
            - *d_clr_a1
            - *d_clr_a2
            - *d_clr_a3
            - *d_enroll_a
            - &d_griev_a
              call: "POST /enrollments/${enr_a}/grievances"
              payload: { description: "Disputed conduct finding" }
              as: Member
              as_user_id: "${m_a}"
              captures: { grv_a: $.data.id }
            - &d_griev_a_esc
              call: "POST /grievances/${grv_a}/escalate"
              payload: {}
              as: Member
              as_user_id: "${m_a}"
          trigger:
            - call: "POST /enrollments/${enr_a}/exit"
              payload: { exit_reason: "FOR_CAUSE" }
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { error_id: $.data.error_id }
            - call: "POST /grievances/${grv_a}/resolve"
              payload: { outcome: "DISMISSED" }
              as: CNCSProgramOfficer
            - call: "POST /enrollments/${enr_a}/exit"
              payload: { exit_reason: "FOR_CAUSE" }
              as: GranteeStaff
              as_user_id: "${org_id}"
          assert:
            - "first exit attempt: status 409 and error_id == ERR_GRIEVANCE_PENDING"
            - "MemberEnrollment.${enr_a}.status == ACTIVE after the blocked exit and Member.${m_a}.status == ACTIVE (no debarment)"
            - "after resolve (outcome DISMISSED) the retry succeeds: enrollment RELEASED_FOR_CAUSE, member DEBARRED"
            - "no EducationAward is created for ${enr_a}"

