          - errors[ERR_VARIANCE_CASE_NOT_FOUND]
          - errors[ERR_CHANGE_ORDER_NOT_FOUND]
        distinguishing_aspect: >
          All eleven not-found codes are distinct and entity-specific: eleven authenticated GETs with
          eleven unused UUIDs return eleven different error_id values, each 404 — no endpoint falls back
          to a generic code.
        test_recipe:
          setup:
