- section: endpoints
  instances:
  - name: earned_value_computed_read_agrees_with_the_stored_package_aggregates
    claim_type: computed_read
    grounds:
    - endpoints[GET /facade-packages/{id}/earned-value]
    - calculations.earned_value_certified_cents
    - entities.FacadePackage.fields.earned_value_certified_cents
