  - section: errors
    instances:
      - name: error_stale_version_coverage
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_VERSION]"]
        excluded_because:
          difficulty_instance: recuse_retract_preserves_round_electorate
          rationale: "OCC happy-path PATCH is exercised there; the three stale-version rejections are realized by the occ_* instances in the cross-cutting section of this file."

      - name: error_cascade_and_variant_coverage
        claim_type: violation_to_error
        grounds: ["errors[ERR_CASE_STAGE_FORBIDDEN]", "errors[ERR_QUORUM_NOT_MET]", "errors[ERR_EXTENSION_INTERVAL_OVERLAP]", "errors[ERR_REVIEWER_CAPACITY_EXCEEDED]"]
        distinguishing_aspect: "Audit stub: these catalog entries are asserted as primary outcomes inside §1.8 difficulty instances."
        excluded_because:
          difficulty_instance: vote_tally_strict_vs_supermajority_diverge
