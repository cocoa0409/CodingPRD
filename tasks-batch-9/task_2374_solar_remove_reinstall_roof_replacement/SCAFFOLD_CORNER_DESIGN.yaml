      - name: corner_no_role_or_off_project_party_can_reach_another_roles_exclusive_operation
        claim_type: cannot_perform_others_exclusive_operations
        grounds:
          - roles
          - validations[priority=2]
          - validations[priority=6]
          - errors.ERR_ROLE_NOT_PERMITTED
          - errors.ERR_PARTY_NOT_ON_PROJECT
        distinguishing_aspect: "Both halves of authorization are checked. Six calls show that holding some role is never enough - each role is bounced off another role's exclusive endpoint with 403 ERR_ROLE_NOT_PERMITTED, including the ProjectCoordinator, who owns most of the API but has no override on the crew's energization endpoint. The last call shows that even the RIGHT role fails when the acting Party is not one of this project's parties: a second, unrelated ROOFER gets 403 ERR_PARTY_NOT_ON_PROJECT on the shared window-status endpoint. The AHJ's attempt is aimed at a sourcing-order id that does not exist, and must still answer 403 rather than 404 because the role check sits at priority 2."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A LEASE project exists in INTAKE with one circuit, one ON_ROOF panel, one OPEN deck finding, one DRAFT permit and one SCHEDULED roofing window for the project's own roofer. No state transitions are needed: the role check at priority 2 and the party check at priority 6 both outrank every state and existence check."
            - "A second ROOFER party, Summit Roofing, exists but is attached to no project."
            - "No SourcingOrder exists with id 00000000-0000-0000-0000-0000000000d1."
