            - "conflict_err == ERR_INSPECTOR_SCHEDULE_CONFLICT ([10:30,11:30) overlaps insp_1's existing [10:00,11:00) even though it is booked on another holdback)"

      - name: property_slot_closed_interval_overlap
        grounds:
          - validations[priority=12]
          - errors[ERR_INSPECTION_SLOT_OCCUPIED]
        distinguishing_aspect: |
          Closed-interval semantics on the property-slot resource (per holdback, across
          inspectors): with [10:00,11:00] already PLANNED on the holdback, an adjacent
