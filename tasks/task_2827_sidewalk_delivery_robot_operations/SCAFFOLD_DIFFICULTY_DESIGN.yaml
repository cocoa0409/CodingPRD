              as: PlatformAdmin
              captures: { z: $.data.id }
            - call: "POST /sidewalk-segments"
              payload: { zone_id: "${z}", segment_code: "S7", segment_type: "CROSSING", crossing_control: "MIDBLOCK", length_m: 16.0, measured_clearance_cm: 98.0, surface_grade_pct: 3.0, sightline_m: 20.0, pedestrian_flow_per_min: 15.0, curb_ramp_present: true }
              as: PlatformAdmin
              captures: { s7: $.data.id }
            - call: "POST /sidewalk-segments/${s7}/transitions"
              payload: { action: "SURVEY" }
              as: PlatformAdmin
            - call: "POST /sidewalk-segments"
              payload: { zone_id: "${z}", segment_code: "S8", segment_type: "CROSSING", crossing_control: "MIDBLOCK", length_m: 16.0, measured_clearance_cm: 98.0, surface_grade_pct: 3.0, sightline_m: 20.0, pedestrian_flow_per_min: 15.5, curb_ramp_present: true }
              as: PlatformAdmin
              captures: { s8: $.data.id }
            - call: "POST /sidewalk-segments/${s8}/transitions"
              payload: { action: "SURVEY" }
              as: PlatformAdmin
          trigger:
            - call: "POST /sidewalk-segments/${s7}/transitions"
              payload: { action: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /sidewalk-segments/${s8}/transitions"
              payload: { action: "APPROVE" }
              as: PlatformAdmin
          assert:
            - "SidewalkSegment.${s7}.crossing_risk_score == 45.0"
            - "SidewalkSegment.${s8}.crossing_risk_score == 45.7"
            - "the APPROVE of S7 returns 200 and SidewalkSegment.${s7}.status == APPROVED"
            - "the APPROVE of S8 returns 422 with error_id ERR_CROSSING_RISK_EXCEEDED and SidewalkSegment.${s8}.status == SURVEYED"
  - rule_id: cross_entity_state_dependency
