        grounds:
          - response_envelope.common_fields
          - entities.ServiceProviderProfile
        distinguishing_aspect: "The version field is the shared OCC counter: it starts at 1, advances by exactly 1 on each successful write to the row (publish-contact, agent registration, policy publication), and is untouched by reads and by rejected writes."
