  - method: GET
    path: "/athletics/selection-slots"
    description: "List selection slots ordered by slot_index ASC by default; the reverse-reachability channel for both SelectionSlot FKs."
    roles: [DevelopmentOfficer, PointsCertifier, PolicyCommittee, PlatformAdmin, Donor]
