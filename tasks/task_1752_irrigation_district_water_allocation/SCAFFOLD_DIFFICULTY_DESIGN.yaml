            - "SeasonAllocation.${alloc_id}.delivered_af == 3.30 exactly once (no double-post of the discarded 2.48) and committed_af == 0.00"

      - name: invoice_branching_direct_pay_vs_lien_path
        grounds:
          - state_machines.AssessmentInvoice.ISSUED_to_PAID
          - state_machines.AssessmentInvoice.DELINQUENT_to_LIEN_FILED
          - state_machines.AssessmentInvoice.LIEN_FILED_to_PAID
          - state_machines.WaterAccount.ACTIVE_to_SUSPENDED
          - state_machines.WaterAccount.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          AssessmentInvoice forks at ISSUED: the direct ISSUED -> PAID branch
          leaves the account untouched, while the ISSUED -> DELINQUENT ->
          LIEN_FILED -> PAID branch suspends the account and then restores it —
          divergent side-effect sets per branch on a different entity than the
          RiderWorkOrder cycle.
        test_recipe:
          setup:
            - "Season PER_ACRE rate 25.00; accounts A1 and A2, 10.0 acres each -> 250.00 invoices"
            - "Invoice1 issued and paid directly; invoice2 issued, swept to DELINQUENT, liened (account2 SUSPENDED), then paid"
