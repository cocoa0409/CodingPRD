  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (≥2 instances, different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: renewal_effort_window_half_open
        grounds:
          - calculations.renewal_offer_price
          - validations[priority=15]
        distinguishing_aspect: |
          Interval semantics: half-open renewal window. Effort N fires when
          current_utc >= expiry - effort_offsets_days[N-1] AND the prior effort
          has fired. The boundary is INCLUSIVE on the offset day. Two efforts
          cannot fire on the same day (the window for effort N+1 opens strictly
          after effort N fires).
        test_recipe:
          setup:
            - "Publication P with RenewalSeries offsets [-30, -7]"
            - "Subscription S expiring on 2026-09-01; current_utc = 2026-08-02 (30 days before)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: PublishingDirector
            - call: "POST /publications"
              payload: { title: "Overlap Test", issn: "55554444", frequency: "MONTHLY", circulation_model: "PAID", base_cover_price_cents: 599, deferred_revenue_method: "PRO_RATA_ISSUE" }
              as: PublishingDirector
              captures: { pub_id: $.data.id }
            - call: "POST /publications/${pub_id}/issues"
              payload: { issue_number: 1, volume_number: 1, cover_date: "2025-09-01T00:00:00Z", editorial_close_date: "2025-08-01T00:00:00Z", ad_close_date: "2025-08-05T00:00:00Z", ship_to_printer_date: "2025-08-10T00:00:00Z", mail_date: "2025-09-01T00:00:00Z", ad_pages_sold: 5 }
              as: ProductionManager
              captures: { issue_id: $.data.id }
            - call: "POST /publications/${pub_id}/renewal-series"
              payload: { series_code: "STD2", effort_offsets_days: [-30, -7], effort_pricing_cents: [999, 1199], is_default: true }
              as: CirculationManager
            - call: "POST /subscribers"
              payload: { email: "x@x.com", full_name: "X", address_line1: "1 A St", city: "Springfield", state_code: "IL", postal_code: "62701" }
              as: CirculationManager
              captures: { sub_id: $.data.id }
            - call: "POST /publications/${pub_id}/subscribers/${sub_id}/subscriptions"
              payload: { start_issue_id: "${issue_id}", term_issues: 12, price_paid_cents: 1200, qualification_tier: "PAID", payment_method: "CARD" }
              as: CirculationManager
              captures: { subscr_id: $.data.id }
            - call: "POST /publications/${pub_id}/subscriptions/${subscr_id}/activate"
              payload: {}
              as: CirculationManager
          trigger:
            - call: "POST /publications/${pub_id}/subscriptions/${subscr_id}/renewal-events/fire-next"
              payload: {}
              as: CirculationManager
              captures: { event1_id: $.data.id, event1_effort: $.data.effort_number, event1_price: $.data.offered_price_cents }
            # Attempt to fire effort 2 immediately (same day) — should fail because effort 2 window is [-7] = 2026-08-25
            - call: "POST /publications/${pub_id}/subscriptions/${subscr_id}/renewal-events/fire-next"
              payload: {}
              as: CirculationManager
              captures: { err_id: $.data.error_id }
          assert:
            - "RenewalEvent.${event1_id}.effort_number == 1"
            - "RenewalEvent.${event1_id}.offered_price_cents == 999"
            - "Second fire-next attempt: error_id == ERR_RENEWAL_WINDOW_NOT_OPEN (effort 2 window not yet open)"

      - name: audit_period_overlap_exclusive_boundary
        grounds:
          - validations[priority=14]
          - entities.CirculationAuditRecord.fields.audit_period_start
          - entities.CirculationAuditRecord.fields.audit_period_end
        distinguishing_aspect: |
          Interval semantics: closed-interval overlap on audit periods. A new
          DRAFT audit's [start, end] must not overlap any existing DRAFT audit
          on the same publication. ADJACENT periods (end == start of next) are
          allowed — closed intervals touch but do not overlap. Different from
          renewal window (half-open).
        test_recipe:
          setup:
            - "Publication P with one DRAFT audit covering [2026-01-01, 2026-06-30]"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PublishingDirector
            - call: "POST /publications"
              payload: { title: "AuditOverlap", issn: "66665555", frequency: "MONTHLY", circulation_model: "PAID", base_cover_price_cents: 599, deferred_revenue_method: "PRO_RATA_ISSUE" }
              as: PublishingDirector
              captures: { pub_id: $.data.id }
            - call: "POST /publications/${pub_id}/circulation-audits"
              payload: { audit_period_start: "2026-01-01T00:00:00Z", audit_period_end: "2026-06-30T23:59:59Z" }
              as: CirculationManager
              captures: { audit1_id: $.data.id }
          trigger:
            # Overlapping period — should fail with ERR_DRAFT_AUDIT_EXISTS
            - call: "POST /publications/${pub_id}/circulation-audits"
              payload: { audit_period_start: "2026-06-01T00:00:00Z", audit_period_end: "2026-11-30T23:59:59Z" }
              as: CirculationManager
              captures: { err_id: $.data.error_id }
          assert:
            - "response status == 422"
            - "error_id == ERR_DRAFT_AUDIT_EXISTS  # only one DRAFT audit at a time; overlapping-period rejection is a special case"

  # ===========================================================================
  # Rule 9 — compensating_invariant (≥2 instances, different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: deferred_revenue_recognized_plus_deferred_equals_gross
        grounds:
          - calculations.deferred_revenue_pro_rata_issue
          - entities.SubscriptionTerm.fields.recognized_balance_cents
          - entities.SubscriptionTerm.fields.deferred_balance_cents
          - entities.SubscriptionTerm.fields.gross_amount_cents
        distinguishing_aspect: |
          Conserved quantity: cents on a SubscriptionTerm. Invariant:
          recognized_balance_cents + deferred_balance_cents == gross_amount_cents
          throughout the term's life. Forward action: issue MAILED posts
          RECOGNITION entries (decrementing deferred, incrementing recognized
          by the same amount). Compensating action: cancel posts REFUND_LIQUIDATION
          which zeros deferred and reduces recognized by the refund amount, but
          the SUM recognized+deferred is adjusted by an equal-and-opposite
          RECOGNITION top-up — conserving the invariant recognized+deferred+refund == gross.
        test_recipe:
          setup:
            - "Publication P, Issue I, ACTIVE Subscription S with term.gross=1205, deferred=1205, recognized=0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PublishingDirector
            - call: "POST /publications"
