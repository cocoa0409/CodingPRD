            - call: "POST /mining/permit-revisions"
              payload: { permit_id: "${c_permit51_id}", revision_type: "EXPANSION", acreage_delta: 60.00 }
              as: Operator
              as_user_id: "${c_op51_id}"
              captures: { c_rev51_id: $.data.id }
            - call: "POST /mining/permit-revisions/${c_rev51_id}/decide"
              payload: { decision: "APPROVE" }
              as: PermitReviewer
            - call: "POST /mining/forfeiture-proceedings"
              payload: { permit_id: "${c_permit51_id}", initiation_reason: "BOND_DEFICIENCY_UNCURED" }
              as: ProgramDirector
              captures: { c_fp51_id: $.data.id }
            - call: "POST /mining/_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /mining/forfeiture-proceedings/${c_fp51_id}/finalize"
              payload: { state_reclamation_cost_estimate: 1200000.00 }
              as: ProgramDirector
          trigger:
            - call: "POST /mining/permits"
              payload: { mine_site_id: "${c_site51b_id}", operator_id: "${c_op51_id}", mining_plan_acres: 50.00, post_mining_land_use: "CROPLAND", proposed_start_date: "2026-10-01" }
              as: Operator
              as_user_id: "${c_op51_id}"
              captures: { c_err_dq: $.data.error_id }
            - call: "POST /mining/forfeiture-proceedings/${c_fp51_id}/contest"
              payload: { contest_note: "Contesting after the fact." }
              as: Operator
              as_user_id: "${c_op51_id}"
              captures: { c_err_fp_state: $.data.error_id }
          assert:
            - "ForfeitureProceeding.${c_fp51_id}.status == FINAL with forfeited_bond_amount == 900000.00 and deficiency_amount == 300000.00"
            - "Operator.${c_op51_id}.registry_status == DISQUALIFIED with forfeiture_count == 1"
            - "Permit.${c_permit51_id}.status == FORFEITED and BondInstrument.${c_inst51_id}.status == FORFEITED"
            - "HTTP 409 with ${c_err_dq} == ERR_OPERATOR_DISQUALIFIED and GET /mining/mine-sites/${c_site51b_id}/permits returns total_count == 0"
            - "HTTP 409 with ${c_err_fp_state} == ERR_PROCEEDING_STATE_INVALID — priority 9 outranks the priority-12 contest window"

      - name: no_accepted_estimate_on_issuance_is_triggerable
        claim_type: error_triggerability
        grounds:
          - errors[ERR_NO_ACCEPTED_ESTIMATE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / permit_issue_gated_on_accepted_estimate_state
          rationale: "That §1.8 instance issues the same permit before and after estimate acceptance, so the error is triggered there with its passing counterpart."

      - name: unabated_violation_and_notice_period_errors_are_triggerable
        claim_type: error_triggerability
        grounds:
          - errors[ERR_UNABATED_VIOLATION]
          - errors[ERR_NOTICE_PERIOD_NOT_ELAPSED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / unabated_violation_outranks_notice_period_on_release_decision
          rationale: "Both codes are raised in that one §1.8 instance, first together (violation wins) and then separately."

      - name: instrument_state_and_self_bond_capacity_errors_are_triggerable
        claim_type: error_triggerability
        grounds:
          - errors[ERR_INSTRUMENT_STATE_INVALID]
          - errors[ERR_SELF_BOND_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / instrument_own_state_outranks_self_bond_capacity_check
          rationale: "Both codes are raised in that §1.8 instance from the same pair of doubly invalid and singly invalid acceptances."

      - name: notice_window_and_double_booking_errors_are_triggerable
        claim_type: error_triggerability
        grounds:
          - errors[ERR_NOTICE_WINDOW_CONFLICT]
          - errors[ERR_INSPECTOR_DOUBLE_BOOKED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / public_notice_windows_enforce_fifteen_day_gap_buffer
          rationale: "The notice-gap code is raised there, and the companion instance inspector_calendar_rejects_overlap_but_allows_abutment raises ERR_INSPECTOR_DOUBLE_BOOKED with its abutment counterpart."

      - name: inspection_eligibility_and_revision_round_errors_are_triggerable
        claim_type: error_triggerability
        grounds:
          - errors[ERR_INSPECTION_NOT_ELIGIBLE]
          - errors[ERR_REVISION_ROUND_LIMIT]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / release_decision_gated_on_release_inspection_state
          rationale: "ERR_INSPECTION_NOT_ELIGIBLE is raised there against an ineligible RELEASE inspection, and ERR_REVISION_ROUND_LIMIT is raised by permit_revision_info_request_cycle_bounded_by_round_cap."

  # ===========================================================================
  # §1.7 sweep: each role's exclusive writes are closed to its peers, shared reads
  # are open to every declared role, and the segregation_of_duties role model bites.
  - section: rbac
    instances:
      - name: peer_roles_cannot_invoke_each_others_exclusive_writes
        claim_type: exclusive_operations_denied
        grounds:
          - roles.Operator.exclusive_operations
          - roles.PermitReviewer.exclusive_operations
          - roles.BondSpecialist.exclusive_operations
          - roles.Inspector.exclusive_operations
          - roles.ProgramDirector.exclusive_operations
          - roles.PublicParticipant.exclusive_operations
          - errors[ERR_UNAUTHORIZED]
          - validations[priority=2]
        distinguishing_aspect: "Six writes, one per role's signature exclusive operation, are each attempted by a peer role that does not hold it and all six return ERR_UNAUTHORIZED (403) with no state change."
        test_recipe:
          setup:
            - "CHAIN-ISSUED with 120.00 disturbed acres: one operator, one site, one ISSUED permit, one ACCEPTED estimate, one ACCEPTED CASH instrument."
            - "One inspector profile, one SCHEDULED ROUTINE inspection, and one SUBMITTED PHASE_I release application for 30.00 acres."
          setup_api_calls:
            - call: "POST /mining/operators"
              payload: { legal_name: "Role Matrix Mining", tangible_net_worth: 16000000.00, fixed_assets_in_state: 7900000.00, total_liabilities: 5120000.00, net_income_prior_year: 640000.00, elected_financial_test: "NET_WORTH_TEST" }
              as: ProgramDirector
              captures: { c_op52_id: $.data.id }
            - call: "POST /mining/mine-sites"
              payload: { name: "Role Matrix Pit", county: "Pima", total_acres: 300.00 }
              as: ProgramDirector
              captures: { c_site52_id: $.data.id }
            - call: "POST /mining/permits"
              payload: { mine_site_id: "${c_site52_id}", operator_id: "${c_op52_id}", mining_plan_acres: 120.00, post_mining_land_use: "RANGELAND", proposed_start_date: "2026-09-01" }
              as: Operator
              as_user_id: "${c_op52_id}"
              captures: { c_permit52_id: $.data.id }
            - call: "POST /mining/reclamation-cost-estimates"
              payload: { permit_id: "${c_permit52_id}", estimator_firm: "Ridgeline Reclamation Engineers", estimator_license_no: "RE-4417", estimate_effective_date: "2026-07-01", direct_cost_per_acre: 6000.00 }
              as: Operator
              as_user_id: "${c_op52_id}"
              captures: { c_est52_id: $.data.id }
            - call: "GET /mining/permits/${c_permit52_id}"
              as: PermitReviewer
              captures: { c_p52v1: $.data.version }
            - call: "POST /mining/reclamation-cost-estimates/${c_est52_id}/accept"
              payload: { expected_permit_version: "${c_p52v1}" }
              as: PermitReviewer
            - call: "POST /mining/bond-instruments"
              payload: { permit_id: "${c_permit52_id}", instrument_type: "CASH", face_amount: 900000.00 }
              as: Operator
              as_user_id: "${c_op52_id}"
              captures: { c_inst52_id: $.data.id }
            - call: "POST /mining/bond-instruments/${c_inst52_id}/accept"
              as: BondSpecialist
              as_user_id: "bs-001"
            - call: "POST /mining/permits/${c_permit52_id}/decide"
              payload: { decision: "ISSUE" }
              as: PermitReviewer
            - call: "PATCH /mining/permits/${c_permit52_id}/disturbance"
              payload: { disturbed_acres: 120.00 }
              as: Operator
              as_user_id: "${c_op52_id}"
            - call: "POST /mining/inspector-profiles"
              payload: { full_name: "Ingrid Halvorsen", certification_level: "CERT_II", region: "SOUTH" }
              as: ProgramDirector
              captures: { c_insp52_id: $.data.id }
            - call: "POST /mining/inspections"
              payload: { permit_id: "${c_permit52_id}", inspector_id: "${c_insp52_id}", inspection_type: "ROUTINE", scheduled_start: "2026-08-10T09:00:00Z", duration_hours: 3 }
              as: ProgramDirector
              captures: { c_ins52_id: $.data.id }
            - call: "POST /mining/bond-release-applications"
              payload: { permit_id: "${c_permit52_id}", phase: "PHASE_I", acres_requested: 30.00 }
              as: Operator
              as_user_id: "${c_op52_id}"
              captures: { c_app52_id: $.data.id }
          trigger:
            - call: "POST /mining/operators"
              payload: { legal_name: "Inspector Founded Mining", tangible_net_worth: 9000000.00, fixed_assets_in_state: 4000000.00, total_liabilities: 3000000.00, net_income_prior_year: 100000.00, elected_financial_test: "NET_WORTH_TEST" }
              as: Inspector
              as_user_id: "${c_insp52_id}"
              captures: { c_den_pd: $.data.error_id }
            - call: "POST /mining/permits"
              payload: { mine_site_id: "${c_site52_id}", operator_id: "${c_op52_id}", mining_plan_acres: 40.00, post_mining_land_use: "CROPLAND", proposed_start_date: "2026-10-01" }
              as: PermitReviewer
              captures: { c_den_op: $.data.error_id }
            - call: "POST /mining/permits/${c_permit52_id}/decide"
              payload: { decision: "DENY", denial_reason: "Self-denying to test the role gate." }
              as: Operator
              as_user_id: "${c_op52_id}"
              captures: { c_den_pr: $.data.error_id }
            - call: "POST /mining/bond-instruments/${c_inst52_id}/accept"
              as: PermitReviewer
              captures: { c_den_bs: $.data.error_id }
            - call: "POST /mining/inspections/${c_ins52_id}/record-result"
              payload: { result: "PASS", findings_note: "Director signing off from the office." }
              as: ProgramDirector
              captures: { c_den_insp: $.data.error_id }
            - call: "POST /mining/bond-release-applications/${c_app52_id}/comment"
              payload: { comment_text: "Specialist posing as the public.", is_objection: true }
              as: BondSpecialist
              as_user_id: "bs-001"
              captures: { c_den_pp: $.data.error_id }
          assert:
            - "All six responses are HTTP 403 with response_type == error and ${c_den_pd} == ${c_den_op} == ${c_den_pr} == ${c_den_bs} == ${c_den_insp} == ${c_den_pp} == ERR_UNAUTHORIZED"
            - "GET /mining/operators returns total_count == 1 and GET /mining/permits returns total_count == 1"
            - "Permit.${c_permit52_id}.status == ISSUED with denial_reason == null"
            - "Inspection.${c_ins52_id}.status == SCHEDULED and BondInstrument.${c_inst52_id}.status == ACCEPTED"
            - "BondReleaseApplication.${c_app52_id}.comment_count == 0 and objection_count == 0"

      - name: public_participant_cannot_read_inspector_or_bond_records
        claim_type: exclusive_operations_denied
        grounds:
          - roles.PublicParticipant.shared_operations
          - errors[ERR_UNAUTHORIZED]
          - validations[priority=2]
        distinguishing_aspect: "PublicParticipant reads the permit, its notice docket and the legacy queue successfully but is refused the inspector roster, the bond-instrument list, the estimate list and the bond summary with ERR_UNAUTHORIZED."
        test_recipe:
          setup:
            - "One operator, one site, one APPLICATION_SUBMITTED permit, one inspector profile, and one NOMINATED legacy site."
          setup_api_calls:
            - call: "POST /mining/operators"
              payload: { legal_name: "Public Reader Mining", tangible_net_worth: 16050000.00, fixed_assets_in_state: 7920000.00, total_liabilities: 5125000.00, net_income_prior_year: 645000.00, elected_financial_test: "NET_WORTH_TEST" }
              as: ProgramDirector
              captures: { c_op53_id: $.data.id }
            - call: "POST /mining/mine-sites"
              payload: { name: "Public Reader Pit", county: "Pima", total_acres: 260.00 }
              as: ProgramDirector
              captures: { c_site53_id: $.data.id }
            - call: "POST /mining/permits"
              payload: { mine_site_id: "${c_site53_id}", operator_id: "${c_op53_id}", mining_plan_acres: 80.00, post_mining_land_use: "RANGELAND", proposed_start_date: "2026-09-01" }
              as: Operator
              as_user_id: "${c_op53_id}"
              captures: { c_permit53_id: $.data.id }
            - call: "POST /mining/inspector-profiles"
              payload: { full_name: "Marcus Oyelaran", certification_level: "CERT_I", region: "SOUTH" }
              as: ProgramDirector
            - call: "POST /mining/mine-sites"
              payload: { name: "Public Reader Legacy Adit", county: "Pima", total_acres: 90.00, site_class: "ABANDONED_LEGACY" }
              as: ProgramDirector
              captures: { c_lsite7_id: $.data.id }
            - call: "POST /mining/mine-sites/${c_lsite7_id}/nominate-legacy"
              payload: { hazard_class: "H2_HIGH", public_safety_score: 40, water_quality_score: 30, acres_affected: 40.00, unfunded_reclamation_need: 350000.00 }
              as: ProgramDirector
          trigger:
            - call: "GET /mining/inspector-profiles"
              as: PublicParticipant
              captures: { c_den_roster: $.data.error_id }
            - call: "GET /mining/bond-instruments"
              as: PublicParticipant
              captures: { c_den_instl: $.data.error_id }
            - call: "GET /mining/reclamation-cost-estimates"
              as: PublicParticipant
              captures: { c_den_estl: $.data.error_id }
            - call: "GET /mining/permits/${c_permit53_id}/bond-summary"
              as: PublicParticipant
              captures: { c_den_summary: $.data.error_id }
            - call: "GET /mining/permits/${c_permit53_id}"
              as: PublicParticipant
              captures: { c_pub_permit_status: $.data.status }
            - call: "GET /mining/permits/${c_permit53_id}/violation-notices"
              as: PublicParticipant
            - call: "GET /mining/legacy-funding-queue"
              as: PublicParticipant
          assert:
            - "${c_den_roster} == ${c_den_instl} == ${c_den_estl} == ${c_den_summary} == ERR_UNAUTHORIZED, all HTTP 403"
            - "${c_pub_permit_status} == APPLICATION_SUBMITTED — the permit record itself is public"
            - "Both public reads return HTTP 200 with response_type == array: the violation-notice docket has total_count == 0 and the legacy queue has total_count == 1"
            - "The legacy queue entry is MineSite.${c_lsite7_id} with legacy_priority_score == 50.00 (H2_HIGH 30 + 40 x 0.30 + 30 x 0.20 + acre_points 2.00)"

      - name: shared_read_endpoints_admit_all_six_declared_roles
        claim_type: shared_operations_permitted
        grounds:
          - roles.Operator.shared_operations
          - roles.Inspector.shared_operations
          - roles.PublicParticipant.shared_operations
          - endpoints[GET /mining/permits/{id}]
          - endpoints[GET /mining/mine-sites/{id}]
        distinguishing_aspect: "GET /mining/permits/{id} and GET /mining/mine-sites/{id} declare all six roles and each of the six receives HTTP 200 with the identical status field, so the shared read surface is not silently narrowed to staff roles."
        test_recipe:
