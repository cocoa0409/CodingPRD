            - { call: "POST /service-visits", payload: { route_id: "${route}", store_agreement_id: "${agrA}", scheduled_date: "2026-08-01" }, as: JobberAdmin, captures: { visit: "$.data.id" } }
            - { call: "POST /service-visits/${visit}/check-in", payload: {}, as: RouteDriver, as_user_id: "drv-1" }
            - { call: "POST /service-visits/${visit}/submit-counts", payload: { lines: [ { product_id: "${prod}", counted_units: 0, restock_units: 5 } ] }, as: RouteDriver, as_user_id: "drv-1" }
