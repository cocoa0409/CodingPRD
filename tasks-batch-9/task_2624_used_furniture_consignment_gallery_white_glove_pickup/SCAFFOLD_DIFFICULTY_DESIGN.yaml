  - rule_id: boundary_precision_check
    instances:
      - name: markdown_step_two_applies_at_exactly_day_thirty
        metric: days_on_floor
        boundary_endpoint: "POST /_ops/markdown-run"
        grounds:
          - calculations.markdown_price
          - entities.PriceScheduleStep.fields.start_day_offset
          - entities.ConsignmentItem.fields.markdown_sequence
          - state_machines.ConsignmentItem.ON_FLOOR_to_MARKED_DOWN
        distinguishing_aspect: |
          The metric is days_on_floor, an integer derived by floor division from
          (clock - listed_at), and the endpoint is the markdown epoch. The step in force is
          the LAST step whose start_day_offset <= days_on_floor, so day 29 must still be
          step 1 at 0.00 and day 30 must be step 2 at 0.15. A >= that has drifted to > (or
          a ceiling instead of a floor) shows up only on these two adjacent runs.
        test_recipe:
          setup:
            - "one consignor at floor 1 with no elevator on an ACTIVE STD-2026 agreement (steps at day 0 / 30 / 60 / 90 with 0.00 / 0.15 / 0.30 / 0.50 and a 45000 floor on step 4)"
