          The response window is inclusive of info_response_deadline (logical clock + 30 days =
          2026-08-31T00:00:00Z): a resubmit at exactly that instant succeeds, and the identically
          evidenced resubmit of the sibling challenge one day later is refused — while no scoring run
          has intervened, so neither challenge was auto-expired.
