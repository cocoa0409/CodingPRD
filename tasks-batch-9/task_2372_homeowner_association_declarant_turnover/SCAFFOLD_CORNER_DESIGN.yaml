          rationale: "The threshold algorithm's below / exactly-at / above cases and the round-half-up behaviour that lands 66.67 on the threshold are the named §1.8 instance's subject."

  # ===========================================================================
  - section: validations
    instances:

      - name: fixed_date_certification_before_the_declaration_date_is_rejected
        claim_type: Violation to Error
        grounds:
          - validations[priority=14]
          - errors.ERR_FIXED_TURNOVER_DATE_NOT_REACHED
          - entities.Association.fields.fixed_turnover_date
          - endpoints[POST /hoa/turnover-cases/{id}/certify-trigger]
        distinguishing_aspect: "The FIXED_DATE basis compares the logical clock against fixed_turnover_date with an inclusive >=, so one second before the declaration date the certification is ERR_FIXED_TURNOVER_DATE_NOT_REACHED (422) and at exactly the declaration instant it succeeds — and the failed attempt leaves trigger_basis null rather than recording an attempt."
        test_recipe:
          setup:
            - "Association 'Ivywick' with fixed_turnover_date 2026-12-01T00:00:00Z and turnover_threshold_pct 66.67, with no lots sold."
            - "One TurnoverCase with total_seats 3 in DECLARANT_CONTROL."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Ivywick", total_planned_lots: 6, turnover_threshold_pct: 66.67, fixed_turnover_date: "2026-12-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 0, reserve_claim_pool_cents: 0, declarant_monthly_subsidy_cents: 0 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/turnover-cases"
              payload: { association_id: "${assoc_id}", total_seats: 3 }
              as: PlatformAdmin
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /hoa/turnover-cases/${case_id}/certify-trigger"
              payload: { trigger_basis: "FIXED_DATE" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { e_early: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-30T23:59:59Z" }
              as: PlatformAdmin
            - call: "POST /hoa/turnover-cases/${case_id}/certify-trigger"
              payload: { trigger_basis: "FIXED_DATE" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { e_one_second_early: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hoa/turnover-cases/${case_id}/certify-trigger"
              payload: { trigger_basis: "FIXED_DATE" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
          assert:
            - "e_early == ERR_FIXED_TURNOVER_DATE_NOT_REACHED with HTTP 422"
            - "e_one_second_early == ERR_FIXED_TURNOVER_DATE_NOT_REACHED with HTTP 422"
            - "after the third trigger call: TurnoverCase.${case_id}.governance_status == DECLARANT_CONTROL, trigger_basis == null and trigger_certified_at == null"
            - "fifth trigger call returns 200 with data.trigger_basis == FIXED_DATE, data.trigger_certified_at == 2026-12-01T00:00:00Z, data.governance_status == ELECTION_CALLED"
            - "fifth trigger call: data.owner_elected_seats_required == 2"

      - name: duplicate_lot_number_is_scoped_to_a_single_association
        claim_type: Violation to Error
        grounds:
          - validations[priority=12]
          - errors.ERR_DUPLICATE_LOT_NUMBER
          - entities.Lot.fields.lot_number
        distinguishing_aspect: "lot_number uniqueness is per association, not global: repeating 'L-100' inside one association is ERR_DUPLICATE_LOT_NUMBER (409), while the identical lot_number in a second association is accepted — and the rejected call does not create a row, so the first association still reports one lot."
        test_recipe:
          setup:
            - "Two associations, 'Jesmond Vale' and 'Kirkmoor', each with total_planned_lots 4."
            - "Association 'Jesmond Vale' has one Lot with lot_number L-100."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Jesmond Vale", total_planned_lots: 4, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 0, reserve_claim_pool_cents: 0, declarant_monthly_subsidy_cents: 0 }
              as: PlatformAdmin
              captures: { assoc_a_id: $.data.id }
            - call: "POST /hoa/associations"
              payload: { name: "Kirkmoor", total_planned_lots: 4, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 0, reserve_claim_pool_cents: 0, declarant_monthly_subsidy_cents: 0 }
              as: PlatformAdmin
              captures: { assoc_b_id: $.data.id }
            - call: "POST /hoa/lots"
              payload: { association_id: "${assoc_a_id}", lot_number: "L-100" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { lot_a_id: $.data.id }
          trigger:
            - call: "POST /hoa/lots"
              payload: { association_id: "${assoc_a_id}", lot_number: "L-100" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { e_dup: $.data.error_id }
            - call: "POST /hoa/lots"
              payload: { association_id: "${assoc_b_id}", lot_number: "L-100" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { lot_b_id: $.data.id }
            - call: "GET /hoa/associations/${assoc_a_id}/lots"
              payload: { limit: 10, offset: 0 }
              as: TransitionCommittee
              as_user_id: "${assoc_a_id}"
            - call: "GET /hoa/associations/${assoc_b_id}/lots"
              payload: { limit: 10, offset: 0 }
              as: TransitionCommittee
              as_user_id: "${assoc_b_id}"
          assert:
            - "e_dup == ERR_DUPLICATE_LOT_NUMBER with HTTP 409"
            - "second trigger call returns 201 with data.lot_number == L-100 and data.association_id == ${assoc_b_id}"
            - "third trigger call: total_count == 1"
            - "fourth trigger call: total_count == 1"
            - "Lot.${lot_a_id}.id != Lot.${lot_b_id}.id, two distinct rows sharing one lot_number across associations"

      - name: assessment_schedule_creation_while_the_subsidy_is_active_is_rejected
        claim_type: Satisfaction to Pass
        grounds:
          - validations[priority=10]
          - errors.ERR_SUBSIDY_STILL_ACTIVE
          - state_machines.TurnoverCase.SUBSIDY_ACTIVE_to_AUDIT_IN_PROGRESS
          - calculations.assessment_reforecast
        distinguishing_aspect: "A budget may not be re-forecast while the declarant subsidy is still running, even with an ADOPTED reserve study in place: the create is ERR_SUBSIDY_STILL_ACTIVE (409) until the FINANCIAL dimension leaves SUBSIDY_ACTIVE. Once it has, the same request succeeds with subsidy_offset_cents 0 for fiscal 2027 because subsidy_end_date 2026-10-01 precedes every month of that year."
        test_recipe:
          setup:
            - "Association 'Lowther Green' with total_planned_lots 3, reserve_pool_cents 1200000 and declarant_monthly_subsidy_cents 150000."
            - "Three Lots, all CLOSED, so billable_lot_count is 3."
            - "One ReserveStudy RECOMPUTEd under CASH_FLOW (planned 700000, expenditure 500000) and ADOPTED, giving recommended_annual_contribution_cents 700000."
            - "One TurnoverCase with total_seats 3 in SUBSIDY_ACTIVE, and one ENGAGED AuditEngagement over 2026-01-01..2026-06-30."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Lowther Green", total_planned_lots: 3, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 1200000, reserve_claim_pool_cents: 0, declarant_monthly_subsidy_cents: 150000 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/turnover-cases"
              payload: { association_id: "${assoc_id}", total_seats: 3 }
              as: PlatformAdmin
              captures: { case_id: $.data.id }
            - call: "POST /hoa/lots"
              payload: { association_id: "${assoc_id}", lot_number: "L-1" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { lot1: $.data.id }
            - call: "POST /hoa/lots"
              payload: { association_id: "${assoc_id}", lot_number: "L-2" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { lot2: $.data.id }
            - call: "POST /hoa/lots"
              payload: { association_id: "${assoc_id}", lot_number: "L-3" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { lot3: $.data.id }
            - call: "POST /hoa/lots/${lot1}/close-sale"
              payload: { closing_date: "2026-02-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/lots/${lot2}/close-sale"
              payload: { closing_date: "2026-03-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/lots/${lot3}/close-sale"
              payload: { closing_date: "2026-04-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/reserve-studies"
              payload: { association_id: "${assoc_id}", funding_method: "CASH_FLOW", planned_annual_contribution_cents: 700000, projected_annual_expenditure_cents: 500000 }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { study_id: $.data.id }
            - call: "POST /hoa/reserve-studies/${study_id}/actions"
              payload: { action: "RECOMPUTE", method: "CASH_FLOW" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/reserve-studies/${study_id}/actions"
              payload: { action: "ADOPT" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/audit-engagements"
              payload: { association_id: "${assoc_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: Auditor
              as_user_id: "auditor-9"
              captures: { eng_id: $.data.id }
          trigger:
            - call: "GET /hoa/associations/${assoc_id}"
              payload: {}
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { v_before: $.data.version }
            - call: "POST /hoa/assessment-schedules"
              payload: { association_id: "${assoc_id}", fiscal_year: 2027, projected_operating_cost_cents: 4000000, expected_association_version: "${v_before}" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { e_subsidy_active: $.data.error_id }
            - call: "POST /hoa/turnover-cases/${case_id}/advance"
              payload: { dimension: "FINANCIAL", subsidy_end_date: "2026-10-01T00:00:00Z" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "GET /hoa/associations/${assoc_id}"
              payload: {}
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { v_after: $.data.version }
            - call: "POST /hoa/assessment-schedules"
              payload: { association_id: "${assoc_id}", fiscal_year: 2027, projected_operating_cost_cents: 4000000, expected_association_version: "${v_after}" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { sched_id: $.data.id }
          assert:
            - "e_subsidy_active == ERR_SUBSIDY_STILL_ACTIVE with HTTP 409, even though the ADOPTED reserve study precondition was satisfied"
            - "third trigger call returns 200 with data.financial_status == AUDIT_IN_PROGRESS and Association.${assoc_id}.subsidy_end_date == 2026-10-01T00:00:00Z"
            - "fifth trigger call returns 201 with data.billable_lot_count == 3, data.reserve_contribution_cents == 700000, data.subsidy_offset_cents == 0"
            - "fifth trigger call: data.annual_requirement_cents == 4700000, data.per_lot_monthly_assessment_cents == 130556, data.annual_budget_total_cents == 4700016, data.residual_cents == 16"
            - "fifth trigger call: data.increase_pct_vs_prior == 0.00, data.owner_vote_required == false, data.status == DRAFT"

      - name: unresolved_body_foreign_key_outranks_body_shape_validation
        claim_type: Priority Ordering
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors.ERR_TURNOVER_CASE_NOT_FOUND
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Body-FK existence sits at priority 5 and body shape at priority 6, so a request that both names a non-existent turnover case AND carries an illegal category enum returns ERR_TURNOVER_CASE_NOT_FOUND (404), not ERR_INVALID_REQUEST (400) — the intuitive 'validate the payload first' order is wrong here. With a real parent the same illegal enum does surface as 400."
        test_recipe:
          setup:
            - "Association 'Mearnsbeck' with one TurnoverCase (total_seats 3)."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Mearnsbeck", total_planned_lots: 6, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 0, reserve_claim_pool_cents: 0, declarant_monthly_subsidy_cents: 0 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/turnover-cases"
              payload: { association_id: "${assoc_id}", total_seats: 3 }
              as: PlatformAdmin
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /hoa/records-items"
              payload: { turnover_case_id: "00000000-0000-0000-0000-0000000000aa", category: "NOT_A_CATEGORY", required: true }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { e_both_violated: $.data.error_id }
            - call: "POST /hoa/records-items"
              payload: { turnover_case_id: "${case_id}", category: "NOT_A_CATEGORY", required: true }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { e_shape_only: $.data.error_id }
            - call: "GET /hoa/turnover-cases/${case_id}/records-items"
              payload: { limit: 10, offset: 0 }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
          assert:
            - "e_both_violated == ERR_TURNOVER_CASE_NOT_FOUND with HTTP 404"
            - "e_shape_only == ERR_INVALID_REQUEST with HTTP 400"
            - "third trigger call: total_count == 0, so neither rejected call created a row"
            - "TurnoverCase.${case_id}.records_transfer_completeness_pct == 100.00, unmoved by the rejections"

      - name: corner_claim_state_check_outranks_the_fiscal_check
        claim_type: Priority Ordering
        grounds:
          - validations[priority=9]
          - validations[priority=15]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / claim_state_check_outranks_reserve_fiscal_shortfall
          rationale: "The pair (priority 9 state versus priority 15 fiscal) is violated by one request and both single-violation controls are asserted in the named §1.8 instance."

      - name: corner_referential_check_outranks_the_temporal_check
        claim_type: Priority Ordering
        grounds:
          - validations[priority=10]
          - validations[priority=11]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / component_conveyance_referential_outranks_repose_temporal
          rationale: "The priority 10 versus priority 11 pair, plus each control in isolation, is the named §1.8 instance's subject."

      - name: corner_role_discriminator_outranks_the_state_check
        claim_type: Priority Ordering
        grounds:
          - validations[priority=2]
          - validations[priority=9]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / role_discriminator_outranks_records_item_terminal_state
          rationale: "The per-dispatcher discriminator gate outranking an illegal-from-state rejection is asserted in both orders in the named §1.8 instance."

      - name: corner_settled_lock_outranks_per_entity_state_checks
        claim_type: Priority Ordering
        grounds:
          - validations[priority=8]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / settlement_depends_on_issued_clean_audit_then_locks_the_association
          rationale: "The named §1.8 instance settles a case and then shows the priority 8 lock rejecting association-scoped mutations that would otherwise be legal from their own state."

      - name: corner_assessment_increase_cap_is_strict
        claim_type: Violation to Error
        grounds:
          - validations[priority=14]
          - errors.ERR_OWNER_VOTE_REQUIRED
        excluded_because:
          difficulty_instance: boundary_precision_check / assessment_increase_strictly_above_cap_requires_owner_vote
          rationale: "The strict > comparison at exactly 20.00 versus 20.01, and the ratification payload that clears it, are asserted in the named §1.8 instance."

      - name: corner_audit_period_overlap_is_a_closed_interval_conflict
        claim_type: Violation to Error
        grounds:
          - validations[priority=12]
          - errors.ERR_AUDIT_PERIOD_OVERLAP
        excluded_because:
          difficulty_instance: resource_temporal_overlap / audit_periods_collide_as_closed_intervals_when_endpoints_touch
          rationale: "Touching endpoints, one-second gaps and the ENGAGED/ISSUED occupancy filter are all asserted in the named §1.8 instance."

      - name: corner_vendor_service_window_conflict_uses_the_inflated_end
        claim_type: Violation to Error
        grounds:
          - validations[priority=12]
          - errors.ERR_SERVICE_WINDOW_CONFLICT
        excluded_because:
          difficulty_instance: resource_temporal_overlap / vendor_service_window_conflict_uses_blackout_inflated_end_per_component
          rationale: "The blackout-inflated end, the half-open comparison and the per-component scoping are asserted in the named §1.8 instance."

  # ===========================================================================
  - section: endpoints
    instances:

      - name: repose_sweep_reports_only_claims_already_past_their_deadline
        claim_type: Conditional action
        grounds:
          - endpoints[POST /hoa/associations/{id}/repose-sweep]
          - state_machines.DefectClaim.INVESTIGATING_to_TIME_BARRED
          - calculations.defect_repose_deadline
          - entities.DefectClaim.fields.status
        distinguishing_aspect: "The sweep is a bulk conditional action with a declared object payload: on an association with no claims it returns swept_claim_count 0 and an empty time_barred_claim_ids rather than 404, it bars only the INVESTIGATING claim whose deadline has passed (strict >), and a second sweep is a no-op because the barred claim has left INVESTIGATING."
        test_recipe:
          setup:
            - "Association 'Netherfold' with statute_of_repose_years 8, at the default clock 2026-08-01T00:00:00Z."
            - "Two components taken to COMPLETE: one with substantial_completion_date 2016-01-01T00:00:00Z (deadline 2024-01-01, already past) and one with 2024-06-01T00:00:00Z (deadline 2032-06-01, far future)."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Netherfold", total_planned_lots: 6, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 0, reserve_claim_pool_cents: 900000, declarant_monthly_subsidy_cents: 0 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/components"
              payload: { association_id: "${assoc_id}", name: "Old Bridge", category: "INFRASTRUCTURE", replacement_cost_cents: 500000, useful_life_years: 30, effective_age_years: 10, promised_completion_date: "2016-01-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { comp_old_id: $.data.id }
            - call: "POST /hoa/components"
              payload: { association_id: "${assoc_id}", name: "New Pavilion", category: "AMENITY", replacement_cost_cents: 300000, useful_life_years: 20, effective_age_years: 2, promised_completion_date: "2024-06-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { comp_new_id: $.data.id }
            - call: "POST /hoa/components/${comp_old_id}/milestones"
              payload: { milestone: "BUILD_COMPLETE", effective_date: "2016-01-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/components/${comp_new_id}/milestones"
              payload: { milestone: "BUILD_COMPLETE", effective_date: "2024-06-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
          trigger:
            - call: "POST /hoa/associations/${assoc_id}/repose-sweep"
              payload: {}
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { empty_count: $.data.swept_claim_count }
            - call: "POST /hoa/defect-claims"
              payload: { association_id: "${assoc_id}", component_id: "${comp_old_id}", defect_summary: "Bridge deck spalling", repair_cost_estimate_cents: 300000, diminution_value_cents: 200000 }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { claim_old_id: $.data.id }
            - call: "POST /hoa/defect-claims"
              payload: { association_id: "${assoc_id}", component_id: "${comp_new_id}", defect_summary: "Pavilion roof leak", repair_cost_estimate_cents: 100000, diminution_value_cents: 60000 }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { claim_new_id: $.data.id }
            - call: "POST /hoa/associations/${assoc_id}/repose-sweep"
              payload: {}
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { swept_count: $.data.swept_claim_count }
            - call: "POST /hoa/associations/${assoc_id}/repose-sweep"
              payload: {}
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { second_count: $.data.swept_claim_count }
          assert:
            - "empty_count == 0 and the first trigger call returns 200 with data.time_barred_claim_ids == []"
            - "second trigger call returns 201 with data.repose_deadline == 2024-01-01T00:00:00Z"
            - "third trigger call returns 201 with data.repose_deadline == 2032-06-01T00:00:00Z"
            - "swept_count == 1 and the fourth trigger call returns data.time_barred_claim_ids == [${claim_old_id}]"
            - "DefectClaim.${claim_old_id}.status == TIME_BARRED and DefectClaim.${claim_new_id}.status == INVESTIGATING"
            - "second_count == 0 and the fifth trigger call returns data.time_barred_claim_ids == []"

      - name: logical_clock_starts_at_the_declared_default_and_set_current_utc_moves_it
        claim_type: Standard CRUD
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - entities.Association.common_fields
        distinguishing_aspect: "Every timestamp the system writes comes from the logical clock, which starts at 2026-08-01T00:00:00Z and only moves when POST /_clock/set_current_utc says so: a row created before the call is stamped with the default, the clock endpoint echoes the new instant as current_utc, and a row created after is stamped with the new value — no wall-clock leakage in either direction."
        test_recipe:
          setup:
            - "An empty system at the default logical clock."
          setup_api_calls: []
          trigger:
            - call: "POST /hoa/associations"
              payload: { name: "Oakhanger Before", total_planned_lots: 4, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 0, reserve_claim_pool_cents: 0, declarant_monthly_subsidy_cents: 0 }
              as: PlatformAdmin
              captures: { assoc_before_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: PlatformAdmin
              captures: { moved_to: $.data.current_utc }
            - call: "POST /hoa/associations"
              payload: { name: "Oakhanger After", total_planned_lots: 4, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 0, reserve_claim_pool_cents: 0, declarant_monthly_subsidy_cents: 0 }
              as: PlatformAdmin
              captures: { assoc_after_id: $.data.id }
            - call: "GET /hoa/associations/${assoc_before_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "first trigger call returns 201 with data.created_at == 2026-08-01T00:00:00Z and data.updated_at == 2026-08-01T00:00:00Z"
            - "moved_to == 2026-09-15T12:00:00Z and the second trigger call returns 200"
            - "third trigger call returns 201 with data.created_at == 2026-09-15T12:00:00Z"
            - "fourth trigger call: data.created_at == 2026-08-01T00:00:00Z, unchanged by the clock move"
            - "Association.${assoc_after_id}.version == Association.${assoc_before_id}.version, both untouched since creation"

      - name: component_listing_intersects_two_filters_before_paginating
        claim_type: Computed read
        grounds:
          - endpoints[GET /hoa/associations/{id}/components]
          - response_envelope.pagination_fields
          - entities.CommonAreaComponent.fields.build_status
          - entities.CommonAreaComponent.fields.category
        distinguishing_aspect: "category and build_status are ANDed, and only then is the page window applied, so total_count is the size of the filtered set (3), not of the association's five components; limit 2 offset 0 returns has_more true and offset 2 returns the remaining row with has_more false."
        test_recipe:
          setup:
            - "Association 'Pellingford' with five components: three UNBUILT AMENITY, one AMENITY taken to COMPLETE, one UNBUILT STRUCTURE."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Pellingford", total_planned_lots: 6, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 0, reserve_claim_pool_cents: 0, declarant_monthly_subsidy_cents: 0 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/components"
              payload: { association_id: "${assoc_id}", name: "Pool", category: "AMENITY", replacement_cost_cents: 100000, useful_life_years: 15, effective_age_years: 0, promised_completion_date: "2027-01-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { amen1: $.data.id }
            - call: "POST /hoa/components"
              payload: { association_id: "${assoc_id}", name: "Tennis Court", category: "AMENITY", replacement_cost_cents: 100000, useful_life_years: 15, effective_age_years: 0, promised_completion_date: "2027-01-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { amen2: $.data.id }
            - call: "POST /hoa/components"
              payload: { association_id: "${assoc_id}", name: "Playground", category: "AMENITY", replacement_cost_cents: 100000, useful_life_years: 15, effective_age_years: 0, promised_completion_date: "2027-01-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { amen3: $.data.id }
            - call: "POST /hoa/components"
              payload: { association_id: "${assoc_id}", name: "Gatehouse", category: "AMENITY", replacement_cost_cents: 100000, useful_life_years: 15, effective_age_years: 0, promised_completion_date: "2026-01-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { amen_complete: $.data.id }
            - call: "POST /hoa/components/${amen_complete}/milestones"
              payload: { milestone: "BUILD_COMPLETE", effective_date: "2026-01-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/components"
              payload: { association_id: "${assoc_id}", name: "Retaining Wall", category: "STRUCTURE", replacement_cost_cents: 100000, useful_life_years: 25, effective_age_years: 0, promised_completion_date: "2027-01-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { struct_unbuilt: $.data.id }
          trigger:
            - call: "GET /hoa/associations/${assoc_id}/components"
              payload: { category: "AMENITY", build_status: "UNBUILT", limit: 2, offset: 0 }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "GET /hoa/associations/${assoc_id}/components"
              payload: { category: "AMENITY", build_status: "UNBUILT", limit: 2, offset: 2 }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "GET /hoa/associations/${assoc_id}/components"
              payload: { limit: 10, offset: 0 }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "GET /hoa/associations/${assoc_id}/components"
              payload: { conveyance_status: "CONVEYED", limit: 10, offset: 0 }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
          assert:
            - "first trigger call returns 200 with total_count == 3, limit == 2, offset == 0, has_more == true and two rows"
            - "second trigger call: total_count == 3, offset == 2, has_more == false and exactly one row"
            - "the two pages together are exactly {${amen1}, ${amen2}, ${amen3}} with no repeats"
            - "third trigger call: total_count == 5, has_more == false"
            - "fourth trigger call: total_count == 0 and an empty rows array, not a 404"
            - "${amen_complete} and ${struct_unbuilt} never appear in the filtered pages"

      - name: corner_action_endpoints_drive_their_declared_transitions
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /hoa/turnover-cases/{id}/certify-trigger]
          - endpoints[POST /hoa/directors/{id}/rescind]
        excluded_because:
          difficulty_instance: compensating_invariant / board_seat_count_conserved_across_resignation_seating_and_rescission
          rationale: "The certify-trigger and rescind action endpoints are exercised end to end, with the seat ledger read back after every call, in the named §1.8 instance."

      - name: corner_computed_read_of_the_budget_matches_the_reforecast
        claim_type: Computed read
        grounds:
          - endpoints[GET /hoa/associations/{id}/assessment-schedules]
        excluded_because:
          difficulty_instance: combinatorial_formula / assessment_reforecast_four_input_non_linear_composition
          rationale: "Every derived budget field is read back and compared against literal expected values in the named §1.8 instance."

  # ===========================================================================
  - section: errors
    instances:

      - name: error_responses_wrap_error_id_and_message_in_the_data_envelope
        claim_type: Error Envelope
        grounds:
          - response_envelope
          - errors.ERR_ASSOCIATION_NOT_FOUND
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Failures use the same single-key envelope as successes: the body is { data: { error_id, message } } with a non-empty human-readable message and no top-level error, errors or detail key, and the same shape appears for a 404 path miss, a 400 shape failure and a 404 body-FK miss."
        test_recipe:
          setup:
            - "An empty system at the default logical clock."
          setup_api_calls: []
          trigger:
            - call: "GET /hoa/associations/00000000-0000-0000-0000-0000000000f1"
              payload: {}
              as: PlatformAdmin
              captures: { e_path: $.data.error_id, m_path: $.data.message }
            - call: "POST /hoa/associations"
              payload: { total_planned_lots: 4, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 0, reserve_claim_pool_cents: 0, declarant_monthly_subsidy_cents: 0 }
              as: PlatformAdmin
              captures: { e_shape: $.data.error_id, m_shape: $.data.message }
            - call: "POST /hoa/lots"
              payload: { association_id: "00000000-0000-0000-0000-0000000000f2", lot_number: "X-1" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { e_body_fk: $.data.error_id, m_body_fk: $.data.message }
          assert:
            - "e_path == ERR_ASSOCIATION_NOT_FOUND with HTTP 404 and m_path is a non-empty string"
            - "e_shape == ERR_INVALID_REQUEST with HTTP 400 and m_shape is a non-empty string naming the missing field"
            - "e_body_fk == ERR_ASSOCIATION_NOT_FOUND with HTTP 404 and m_body_fk is a non-empty string"
            - "each response body has exactly one top-level key, data, whose only keys are error_id and message"
            - "no error response carries a pagination field or an entity payload alongside the error"

      - name: corner_err_adequacy_not_evaluated_is_triggerable
        claim_type: Error Triggerability
        grounds:
          - errors.ERR_ADEQUACY_NOT_EVALUATED
        excluded_because:
          difficulty_instance: boundary_precision_check / empty_conveyed_component_set_is_undetermined_only_under_full_funding
          rationale: "Adopting a study whose verdict is still UNDETERMINED is the named §1.8 instance's rejection case."

      - name: corner_err_component_not_conveyed_is_triggerable
        claim_type: Error Triggerability
        grounds:
          - errors.ERR_COMPONENT_NOT_CONVEYED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / claim_notice_depends_on_conveyance_state_of_the_component
          rationale: "Serving notice on a NOT_CONVEYED and on a DEED_TENDERED component both produce this error inside the named §1.8 instance."

      - name: corner_err_reserve_study_not_adopted_is_triggerable
        claim_type: Error Triggerability
        grounds:
          - errors.ERR_RESERVE_STUDY_NOT_ADOPTED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / assessment_creation_depends_on_adopted_reserve_study_state
          rationale: "Creating a schedule against a DRAFT-only study set is the named §1.8 instance's rejection case."

      - name: corner_err_repose_period_expired_is_triggerable
        claim_type: Error Triggerability
        grounds:
          - errors.ERR_REPOSE_PERIOD_EXPIRED
        excluded_because:
          difficulty_instance: boundary_precision_check / repose_deadline_inclusive_at_the_instant_and_strict_for_the_sweep
          rationale: "Notice one second after the deadline instant is the named §1.8 instance's rejection case."

      - name: corner_err_turnover_threshold_not_met_is_triggerable
        claim_type: Error Triggerability
        grounds:
          - errors.ERR_TURNOVER_THRESHOLD_NOT_MET
        excluded_because:
          difficulty_instance: boundary_precision_check / sold_lot_pct_rounds_half_up_exactly_onto_turnover_threshold
          rationale: "Certifying on the PERCENT_SOLD basis one lot short of the threshold is the named §1.8 instance's rejection case."

      - name: corner_err_negotiation_rounds_exhausted_is_triggerable
        claim_type: Error Triggerability
        grounds:
          - errors.ERR_NEGOTIATION_ROUNDS_EXHAUSTED
        excluded_because:
          difficulty_instance: non_linear_state_machine / defect_claim_negotiation_cycle_reentry_and_round_cap
          rationale: "The cap is reached by walking the negotiation cycle to exhaustion inside the named §1.8 instance."

      - name: corner_err_seat_capacity_exceeded_is_triggerable
        claim_type: Error Triggerability
        grounds:
          - errors.ERR_SEAT_CAPACITY_EXCEEDED
        excluded_because:
          difficulty_instance: compensating_invariant / board_seat_count_conserved_across_resignation_seating_and_rescission
          rationale: "Seating one director past a full board is the named §1.8 instance's rejection case, asserted together with the conserved seat total."

      - name: corner_err_claim_reserve_insufficient_is_triggerable
        claim_type: Error Triggerability
        grounds:
          - errors.ERR_CLAIM_RESERVE_INSUFFICIENT
        excluded_because:
          difficulty_instance: compensating_invariant / claim_reserve_release_conserves_the_association_claim_pool
          rationale: "The pool is driven to the point where the next reserve no longer fits inside available_cents in the named §1.8 instance."

      - name: corner_err_settlement_blocked_and_settled_lock_are_triggerable
        claim_type: Error Triggerability
        grounds:
          - errors.ERR_SETTLEMENT_BLOCKED
          - errors.ERR_TURNOVER_SETTLED_LOCKED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / settlement_depends_on_issued_clean_audit_then_locks_the_association
          rationale: "Both the pre-settlement block and the post-settlement lock are triggered in sequence in the named §1.8 instance."

      - name: corner_err_owner_vote_required_is_triggerable
        claim_type: Error Triggerability
        grounds:
          - errors.ERR_OWNER_VOTE_REQUIRED
        excluded_because:
          difficulty_instance: boundary_precision_check / assessment_increase_strictly_above_cap_requires_owner_vote
          rationale: "Adopting a schedule whose increase is 20.01 percent without ratification is the named §1.8 instance's rejection case."

  # ===========================================================================
  - section: rbac
    instances:

      - name: each_role_performs_its_own_exclusive_operations
        claim_type: Role Permission
        grounds:
          - roles.PlatformAdmin.exclusive_operations
          - roles.Declarant.exclusive_operations
          - roles.TransitionCommittee.exclusive_operations
          - roles.Auditor.exclusive_operations
          - roles.ElectionInspector.exclusive_operations
        distinguishing_aspect: "All five roles have a non-empty exclusive set and each one is exercised successfully on the same association: PlatformAdmin stands the community up, Declarant sells and builds, TransitionCommittee runs the reserve study, Auditor engages, and ElectionInspector seats and rescinds an owner-elected director — no role needs another role's header to complete its own workflow step."
        test_recipe:
          setup:
            - "An empty system at the default logical clock."
          setup_api_calls: []
          trigger:
            - call: "POST /hoa/associations"
              payload: { name: "Quarrendon", total_planned_lots: 4, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 500000, reserve_claim_pool_cents: 0, declarant_monthly_subsidy_cents: 0 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/turnover-cases"
              payload: { association_id: "${assoc_id}", total_seats: 3 }
              as: PlatformAdmin
              captures: { case_id: $.data.id }
            - call: "POST /hoa/lots"
              payload: { association_id: "${assoc_id}", lot_number: "Q-1" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { lot_id: $.data.id }
            - call: "POST /hoa/reserve-studies"
              payload: { association_id: "${assoc_id}", funding_method: "CASH_FLOW", planned_annual_contribution_cents: 300000, projected_annual_expenditure_cents: 100000 }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { study_id: $.data.id }
            - call: "POST /hoa/audit-engagements"
              payload: { association_id: "${assoc_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: Auditor
              as_user_id: "auditor-9"
              captures: { eng_id: $.data.id }
            - call: "POST /hoa/directors"
              payload: { turnover_case_id: "${case_id}", full_name: "Rosalind Achebe", seat_type: "OWNER_ELECTED" }
              as: ElectionInspector
              as_user_id: "inspector-1"
              captures: { dir_id: $.data.id }
            - call: "POST /hoa/directors/${dir_id}/rescind"
              payload: {}
              as: ElectionInspector
              as_user_id: "inspector-1"
          assert:
            - "first and second trigger calls return 201"
            - "third trigger call returns 201 with Lot.${lot_id}.sale_status == UNSOLD"
            - "fourth trigger call returns 201 with ReserveStudy.${study_id}.status == DRAFT"
            - "fifth trigger call returns 201 with AuditEngagement.${eng_id}.status == ENGAGED"
            - "sixth trigger call returns 201 with Director.${dir_id}.status == SEATED and seated_by_user_id == inspector-1"
            - "seventh trigger call returns 200 with Director.${dir_id}.status == RESCINDED"
            - "TurnoverCase.${case_id}.vacant_seats == 3 once the seat is released"

      - name: other_roles_exclusive_operations_are_forbidden
        claim_type: Role Denial
        grounds:
          - validations[priority=2]
          - errors.ERR_ROLE_NOT_PERMITTED
          - roles.Declarant.exclusive_operations
          - roles.TransitionCommittee.exclusive_operations
          - roles.Auditor.exclusive_operations
          - roles.ElectionInspector.exclusive_operations
        distinguishing_aspect: "Denial is by declared endpoint role list AND by dispatcher discriminator: a Declarant may not create an association, an Auditor may not create lots, an ElectionInspector may not create a reserve study, a TransitionCommittee may not engage itself as auditor, and even on an endpoint it is allowed to call a Declarant may not send the TransitionCommittee-only ACCEPT action. Every one is 403 ERR_ROLE_NOT_PERMITTED, never 401 or 404."
        test_recipe:
          setup:
            - "Association 'Ravenstonedale' with a TurnoverCase (total_seats 3) and one OUTSTANDING required records item already DELIVERED by the declarant."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Ravenstonedale", total_planned_lots: 4, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 0, reserve_claim_pool_cents: 0, declarant_monthly_subsidy_cents: 0 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/turnover-cases"
              payload: { association_id: "${assoc_id}", total_seats: 3 }
              as: PlatformAdmin
              captures: { case_id: $.data.id }
            - call: "POST /hoa/records-items"
              payload: { turnover_case_id: "${case_id}", category: "WARRANTIES", required: true }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { item_id: $.data.id }
            - call: "POST /hoa/records-items/${item_id}/transitions"
              payload: { action: "DELIVER" }
              as: Declarant
              as_user_id: "declarant-1"
          trigger:
            - call: "POST /hoa/associations"
              payload: { name: "Sneaky Plat", total_planned_lots: 4, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 0, reserve_claim_pool_cents: 0, declarant_monthly_subsidy_cents: 0 }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { e_declarant_creates_assoc: $.data.error_id }
            - call: "POST /hoa/lots"
              payload: { association_id: "${assoc_id}", lot_number: "R-9" }
              as: Auditor
              as_user_id: "auditor-9"
              captures: { e_auditor_creates_lot: $.data.error_id }
            - call: "POST /hoa/reserve-studies"
              payload: { association_id: "${assoc_id}", funding_method: "CASH_FLOW", planned_annual_contribution_cents: 100000, projected_annual_expenditure_cents: 50000 }
              as: ElectionInspector
              as_user_id: "inspector-1"
              captures: { e_inspector_creates_study: $.data.error_id }
            - call: "POST /hoa/audit-engagements"
              payload: { association_id: "${assoc_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { e_committee_engages: $.data.error_id }
            - call: "POST /hoa/records-items/${item_id}/transitions"
              payload: { action: "ACCEPT" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { e_declarant_accepts: $.data.error_id }
            - call: "GET /hoa/turnover-cases/${case_id}/records-items"
              payload: { limit: 10, offset: 0 }
              as: Auditor
              as_user_id: "auditor-9"
          assert:
            - "e_declarant_creates_assoc == ERR_ROLE_NOT_PERMITTED with HTTP 403"
            - "e_auditor_creates_lot == ERR_ROLE_NOT_PERMITTED with HTTP 403"
            - "e_inspector_creates_study == ERR_ROLE_NOT_PERMITTED with HTTP 403"
            - "e_committee_engages == ERR_ROLE_NOT_PERMITTED with HTTP 403"
            - "e_declarant_accepts == ERR_ROLE_NOT_PERMITTED with HTTP 403, not ERR_RECORDS_ITEM_STATE_INVALID"
            - "RecordsTransferItem.${item_id}.status == DELIVERED, unchanged by the refused ACCEPT"
            - "sixth trigger call returns 200 with total_count == 1, confirming every role keeps its shared GET access"

      - name: transition_committee_acting_for_another_association_is_forbidden
        claim_type: Identity Scoping
        grounds:
          - roles.TransitionCommittee.identity
          - validations[priority=2]
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: "TransitionCommittee is entity_backed:Association, so its X-User-ID is the association id it speaks for: committee B calling into association A's reserve study, certification and claim endpoints is 403 ERR_ROLE_NOT_PERMITTED even though the role itself is authorised for those endpoints, and the identical call with A's own id succeeds."
        test_recipe:
          setup:
            - "Two associations, 'Saxtonbury' and 'Thurlemere', each with one TurnoverCase (total_seats 3); both have fixed_turnover_date 2026-07-01T00:00:00Z, reached at the default clock."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Saxtonbury", total_planned_lots: 4, turnover_threshold_pct: 66.67, fixed_turnover_date: "2026-07-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 200000, reserve_claim_pool_cents: 0, declarant_monthly_subsidy_cents: 0 }
              as: PlatformAdmin
              captures: { assoc_a_id: $.data.id }
            - call: "POST /hoa/associations"
              payload: { name: "Thurlemere", total_planned_lots: 4, turnover_threshold_pct: 66.67, fixed_turnover_date: "2026-07-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 200000, reserve_claim_pool_cents: 0, declarant_monthly_subsidy_cents: 0 }
              as: PlatformAdmin
              captures: { assoc_b_id: $.data.id }
            - call: "POST /hoa/turnover-cases"
              payload: { association_id: "${assoc_a_id}", total_seats: 3 }
              as: PlatformAdmin
              captures: { case_a_id: $.data.id }
            - call: "POST /hoa/turnover-cases"
              payload: { association_id: "${assoc_b_id}", total_seats: 3 }
              as: PlatformAdmin
              captures: { case_b_id: $.data.id }
          trigger:
            - call: "POST /hoa/reserve-studies"
              payload: { association_id: "${assoc_a_id}", funding_method: "CASH_FLOW", planned_annual_contribution_cents: 100000, projected_annual_expenditure_cents: 50000 }
              as: TransitionCommittee
              as_user_id: "${assoc_b_id}"
              captures: { e_body_scope: $.data.error_id }
            - call: "POST /hoa/turnover-cases/${case_a_id}/certify-trigger"
              payload: { trigger_basis: "FIXED_DATE" }
              as: TransitionCommittee
              as_user_id: "${assoc_b_id}"
              captures: { e_path_scope: $.data.error_id }
            - call: "POST /hoa/associations/${assoc_a_id}/repose-sweep"
              payload: {}
              as: TransitionCommittee
              as_user_id: "${assoc_b_id}"
              captures: { e_sweep_scope: $.data.error_id }
            - call: "POST /hoa/turnover-cases/${case_a_id}/certify-trigger"
              payload: { trigger_basis: "FIXED_DATE" }
              as: TransitionCommittee
              as_user_id: "${assoc_a_id}"
          assert:
            - "e_body_scope == ERR_ROLE_NOT_PERMITTED with HTTP 403"
            - "e_path_scope == ERR_ROLE_NOT_PERMITTED with HTTP 403, resolved from the path id's owning association rather than from a body field"
            - "e_sweep_scope == ERR_ROLE_NOT_PERMITTED with HTTP 403"
            - "after the third trigger call: TurnoverCase.${case_a_id}.governance_status == DECLARANT_CONTROL"
            - "fourth trigger call returns 200 with data.governance_status == ELECTION_CALLED and data.trigger_certified_by_user_id == ${assoc_a_id}"
            - "TurnoverCase.${case_b_id}.governance_status == DECLARANT_CONTROL, never touched by A's certification"

      - name: missing_x_user_role_header_and_unknown_roles_are_unauthenticated
        claim_type: Role Denial
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "Priority 1 outranks everything: a request with no X-User-Role, one with no X-User-ID, and one naming a role outside the declared five all return 401 ERR_UNAUTHENTICATED — even when the target id does not exist, so the 401 is chosen over the 404 that the same path would otherwise produce."
        test_recipe:
          setup:
            - "Association 'Underbarrow' exists so that a well-formed request would otherwise succeed."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Underbarrow", total_planned_lots: 4, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 0, reserve_claim_pool_cents: 0, declarant_monthly_subsidy_cents: 0 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
          trigger:
            - call: "GET /hoa/associations/${assoc_id}"
              payload: {}
              as: NO_ROLE_HEADER
              captures: { e_no_role: $.data.error_id }
            - call: "GET /hoa/associations/${assoc_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "NO_USER_ID_HEADER"
              captures: { e_no_user_id: $.data.error_id }
            - call: "GET /hoa/associations/00000000-0000-0000-0000-0000000000c7"
              payload: {}
              as: CommunityManager
              as_user_id: "manager-1"
              captures: { e_unknown_role: $.data.error_id }
            - call: "POST /hoa/lots"
              payload: { association_id: "${assoc_id}", lot_number: "U-1" }
              as: NO_ROLE_HEADER
              captures: { e_write_no_role: $.data.error_id }
          assert:
            - "e_no_role == ERR_UNAUTHENTICATED with HTTP 401, where the first trigger call sends no X-User-Role header at all"
            - "e_no_user_id == ERR_UNAUTHENTICATED with HTTP 401, where the second trigger call omits the X-User-ID header"
            - "e_unknown_role == ERR_UNAUTHENTICATED with HTTP 401 and NOT ERR_ASSOCIATION_NOT_FOUND, although the path id does not exist"
            - "e_write_no_role == ERR_UNAUTHENTICATED with HTTP 401 and no Lot row is created"
            - "Association.${assoc_id}.sold_lot_count == 0 and version unchanged by the rejected write"

      - name: segregation_of_duties_blocks_self_review_on_both_gated_endpoints
        claim_type: Segregation of duties
        grounds:
          - validations[priority=3]
          - errors.ERR_SEGREGATION_OF_DUTIES
          - roles.Auditor.description
          - calculations.audit_unreconciled_delta
        distinguishing_aspect: "Both gates compare X-User-ID against a recorded actor, not against a role: the user who posted an in-window SubsidyEntry cannot issue that engagement (a different auditor can), and the user who certified the turnover trigger cannot seat a director. The gate is window-scoped, so a poster of an out-of-window entry is free to issue."
        test_recipe:
          setup:
            - "Association 'Vellamore' with declarant_monthly_subsidy_cents 60000 and a TurnoverCase (total_seats 3); fixed_turnover_date 2026-07-01T00:00:00Z, reached at the default clock."
            - "Two POSTED SubsidyEntries: 60000 ACCRUAL for 2026-03 posted by user shared-1 and 60000 ACCRUAL for 2025-11 posted by user outsider-2."
            - "Two AuditEngagements are NOT pre-created; the single engagement covers 2026-01-01..2026-06-30, so 2026-03 is in window and 2025-11 is not."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Vellamore", total_planned_lots: 4, turnover_threshold_pct: 66.67, fixed_turnover_date: "2026-07-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 0, reserve_claim_pool_cents: 0, declarant_monthly_subsidy_cents: 60000 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/turnover-cases"
              payload: { association_id: "${assoc_id}", total_seats: 3 }
              as: PlatformAdmin
              captures: { case_id: $.data.id }
            - call: "POST /hoa/subsidy-entries"
              payload: { association_id: "${assoc_id}", direction: "ACCRUAL", amount_cents: 60000, period_month: "2026-03" }
              as: Declarant
              as_user_id: "shared-1"
              captures: { entry_in_window_id: $.data.id }
            - call: "POST /hoa/subsidy-entries"
              payload: { association_id: "${assoc_id}", direction: "ACCRUAL", amount_cents: 60000, period_month: "2025-11" }
              as: Declarant
              as_user_id: "outsider-2"
              captures: { entry_out_of_window_id: $.data.id }
            - call: "POST /hoa/audit-engagements"
              payload: { association_id: "${assoc_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: Auditor
              as_user_id: "shared-1"
              captures: { eng_id: $.data.id }
            - call: "POST /hoa/turnover-cases/${case_id}/certify-trigger"
              payload: { trigger_basis: "FIXED_DATE" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
          trigger:
            - call: "POST /hoa/audit-engagements/${eng_id}/issue"
              payload: {}
              as: Auditor
              as_user_id: "shared-1"
              captures: { e_self_review: $.data.error_id }
            - call: "POST /hoa/directors"
              payload: { turnover_case_id: "${case_id}", full_name: "Wilhelmina Osei", seat_type: "DECLARANT_APPOINTED" }
              as: Declarant
              as_user_id: "${assoc_id}"
              captures: { e_certifier_seats: $.data.error_id }
            - call: "POST /hoa/audit-engagements/${eng_id}/issue"
              payload: {}
              as: Auditor
              as_user_id: "outsider-2"
            - call: "POST /hoa/directors"
              payload: { turnover_case_id: "${case_id}", full_name: "Wilhelmina Osei", seat_type: "DECLARANT_APPOINTED" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { dir_id: $.data.id }
          assert:
            - "e_self_review == ERR_SEGREGATION_OF_DUTIES with HTTP 403, because shared-1 posted the in-window entry for 2026-03"
            - "e_certifier_seats == ERR_SEGREGATION_OF_DUTIES with HTTP 403, because TurnoverCase.${case_id}.trigger_certified_by_user_id == ${assoc_id}"
            - "after the second trigger call: TurnoverCase.${case_id}.declarant_appointed_seats == 0 and vacant_seats == 3"
            - "third trigger call returns 200 with data.status == ISSUED and data.issued_by_user_id == outsider-2, even though outsider-2 posted the out-of-window 2025-11 entry"
            - "third trigger call: data.audited_receivable_snapshot_cents == 60000, covering only the in-window entry"
            - "fourth trigger call returns 201 with Director.${dir_id}.seated_by_user_id == declarant-1 and TurnoverCase.${case_id}.vacant_seats == 2"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_expected_association_version_is_rejected_then_the_fresh_read_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[assessment-schedule-create-stale-association]
          - validations[priority=7]
          - errors.ERR_STALE_ASSOCIATION_VERSION
          - calculations.assessment_reforecast
        distinguishing_aspect: "The single declared OCC rule guards POST /hoa/assessment-schedules on Association.version: a version captured before a lot closing is refused with ERR_STALE_ASSOCIATION_VERSION (412) — and refused for a reason the client must care about, because the closing changed billable_lot_count from 3 to 4 and therefore the whole per-lot figure. Re-reading and retrying with the fresh version succeeds and produces the four-lot numbers."
        test_recipe:
          setup:
            - "Association 'Wetherlam' with total_planned_lots 4, reserve_pool_cents 1200000, declarant_monthly_subsidy_cents 150000."
            - "Four Lots, three of them CLOSED and the fourth still UNSOLD."
            - "One ReserveStudy RECOMPUTEd under CASH_FLOW (planned 700000, expenditure 500000) and ADOPTED, so recommended_annual_contribution_cents is 700000."
            - "TurnoverCase (total_seats 3) advanced to AUDIT_IN_PROGRESS with subsidy_end_date 2026-10-01T00:00:00Z, so the subsidy gate is satisfied and fiscal 2027 has no subsidised months."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Wetherlam", total_planned_lots: 4, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 1200000, reserve_claim_pool_cents: 0, declarant_monthly_subsidy_cents: 150000 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/turnover-cases"
              payload: { association_id: "${assoc_id}", total_seats: 3 }
              as: PlatformAdmin
              captures: { case_id: $.data.id }
            - call: "POST /hoa/lots"
              payload: { association_id: "${assoc_id}", lot_number: "W-1" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { lot1: $.data.id }
            - call: "POST /hoa/lots"
              payload: { association_id: "${assoc_id}", lot_number: "W-2" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { lot2: $.data.id }
            - call: "POST /hoa/lots"
              payload: { association_id: "${assoc_id}", lot_number: "W-3" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { lot3: $.data.id }
            - call: "POST /hoa/lots"
              payload: { association_id: "${assoc_id}", lot_number: "W-4" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { lot4: $.data.id }
            - call: "POST /hoa/lots/${lot1}/close-sale"
              payload: { closing_date: "2026-02-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/lots/${lot2}/close-sale"
              payload: { closing_date: "2026-03-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/lots/${lot3}/close-sale"
              payload: { closing_date: "2026-04-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/reserve-studies"
              payload: { association_id: "${assoc_id}", funding_method: "CASH_FLOW", planned_annual_contribution_cents: 700000, projected_annual_expenditure_cents: 500000 }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { study_id: $.data.id }
            - call: "POST /hoa/reserve-studies/${study_id}/actions"
              payload: { action: "RECOMPUTE", method: "CASH_FLOW" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/reserve-studies/${study_id}/actions"
              payload: { action: "ADOPT" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/audit-engagements"
              payload: { association_id: "${assoc_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: Auditor
              as_user_id: "auditor-9"
              captures: { eng_id: $.data.id }
            - call: "POST /hoa/turnover-cases/${case_id}/advance"
              payload: { dimension: "FINANCIAL", subsidy_end_date: "2026-10-01T00:00:00Z" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
          trigger:
            - call: "GET /hoa/associations/${assoc_id}"
              payload: {}
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { v_stale: $.data.version }
            - call: "POST /hoa/lots/${lot4}/close-sale"
              payload: { closing_date: "2026-07-15T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/assessment-schedules"
              payload: { association_id: "${assoc_id}", fiscal_year: 2027, projected_operating_cost_cents: 4000000, expected_association_version: "${v_stale}" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { e_stale: $.data.error_id }
            - call: "GET /hoa/associations/${assoc_id}"
              payload: {}
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { v_fresh: $.data.version }
            - call: "POST /hoa/assessment-schedules"
              payload: { association_id: "${assoc_id}", fiscal_year: 2027, projected_operating_cost_cents: 4000000, expected_association_version: "${v_fresh}" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { sched_id: $.data.id }
          assert:
            - "second trigger call returns 200 with Association.${assoc_id}.sold_lot_count == 4 and sold_lot_pct == 100.00"
            - "e_stale == ERR_STALE_ASSOCIATION_VERSION with HTTP 412"
            - "no AssessmentSchedule row exists for the association after the third trigger call"
            - "v_fresh != v_stale, and the fourth trigger call shows the version advanced by the lot closing"
            - "fifth trigger call returns 201 with data.billable_lot_count == 4, data.reserve_contribution_cents == 700000, data.subsidy_offset_cents == 0"
            - "fifth trigger call: data.annual_requirement_cents == 4700000, data.per_lot_monthly_assessment_cents == 97917, data.annual_budget_total_cents == 4700016, data.residual_cents == 16"
            - "fifth trigger call: had the stale request been honoured with billable_lot_count 3 the per-lot figure would have been 130556, so the 412 protected a materially different budget"

      - name: association_version_advances_once_per_write_that_moves_a_derived_field
        claim_type: optimistic_concurrency
        grounds:
          - entities.Association.common_fields
          - state_machines.DefectClaim.NOTICED_to_RESERVED
          - state_machines.DefectClaim.RESERVED_to_WITHDRAWN
          - calculations.defect_claim_reserve_amount
        distinguishing_aspect: "Association.version is the OCC token for the whole community aggregate, so it advances by exactly one on each write that moves an association-level derived field — once on the claim reserve and once on the compensating withdrawal — and it never advances twice for one call or moves backwards when the committed pool returns to its starting value."
        test_recipe:
          setup:
            - "Association 'Yealmpton' with reserve_claim_pool_cents 3000000 and one CONVEYED component (substantial_completion_date 2024-01-01T00:00:00Z, deadline 2032-01-01T00:00:00Z)."
            - "One DefectClaim moved to NOTICED."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Yealmpton", total_planned_lots: 4, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 0, reserve_claim_pool_cents: 3000000, declarant_monthly_subsidy_cents: 0 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/components"
              payload: { association_id: "${assoc_id}", name: "Podium Deck", category: "STRUCTURE", replacement_cost_cents: 2000000, useful_life_years: 30, effective_age_years: 2, promised_completion_date: "2024-01-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { comp_id: $.data.id }
            - call: "POST /hoa/components/${comp_id}/milestones"
              payload: { milestone: "BUILD_COMPLETE", effective_date: "2024-01-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/components/${comp_id}/milestones"
              payload: { milestone: "DEED_TENDERED" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/components/${comp_id}/milestones"
              payload: { milestone: "CONVEYANCE_ACCEPTED" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/defect-claims"
              payload: { association_id: "${assoc_id}", component_id: "${comp_id}", defect_summary: "Deck waterproofing failure", repair_cost_estimate_cents: 1500000, diminution_value_cents: 900000 }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /hoa/defect-claims/${claim_id}/actions"
              payload: { action: "NOTICE" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
          trigger:
            - call: "GET /hoa/associations/${assoc_id}"
              payload: {}
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { v0: $.data.version }
            - call: "POST /hoa/defect-claims/${claim_id}/actions"
              payload: { action: "RESERVE", valuation_basis: "REPAIR_COST" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "GET /hoa/associations/${assoc_id}"
              payload: {}
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { v1: $.data.version }
            - call: "POST /hoa/defect-claims/${claim_id}/actions"
              payload: { action: "WITHDRAW" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "GET /hoa/associations/${assoc_id}"
              payload: {}
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { v2: $.data.version }
          assert:
            - "second trigger call returns 200 with data.reserved_amount_cents == 1680000 and data.status == RESERVED"
            - "third trigger call: data.reserve_claim_committed_cents == 1680000, data.reserve_claim_available_cents == 1320000, and v1 is exactly one greater than v0"
            - "fourth trigger call returns 200 with data.status == WITHDRAWN and data.reserved_amount_cents == 0"
            - "fifth trigger call: data.reserve_claim_committed_cents == 0, data.reserve_claim_available_cents == 3000000, and v2 is exactly one greater than v1"
            - "v2 is strictly greater than v0 even though the committed pool returned to its starting value, so the version is a write counter and not a hash of the balances"

      - name: corner_five_hop_cascade_runs_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: transitive_cascade / certify_trigger_five_hop_cascade_to_superseded_draft_budget
          rationale: "The longest declared chain is walked hop by hop, with each intermediate read back, in the named §1.8 instance."

      - name: corner_four_hop_reversal_cascade_runs_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: transitive_cascade / subsidy_reversal_four_hop_cascade_blocks_settlement
          rationale: "The reversal chain from ledger row to settlement block is asserted at every hop in the named §1.8 instance."

      - name: corner_both_reserve_variants_produce_their_expected_results
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: dual_variant_calc / reserve_adequacy_component_full_funding_vs_cash_flow_divergence
          rationale: "The layer's claim — both variants correct, delta on switch correct — is exactly what the named §1.8 instance asserts."

      - name: corner_both_claim_valuation_variants_produce_their_expected_results
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: dual_variant_calc / claim_reserve_repair_cost_vs_diminution_variant_divergence
          rationale: "The second declared variant pair and its committed-pool delta are asserted in the named §1.8 instance."

      - name: corner_cumulative_sold_lot_threshold_at_the_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: boundary_precision_check / sold_lot_pct_rounds_half_up_exactly_onto_turnover_threshold
          rationale: "The cumulative percent-sold trigger is tested immediately below, exactly at and above the declaration threshold in the named §1.8 instance."

      - name: corner_instantaneous_assessment_increase_threshold_at_the_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: boundary_precision_check / assessment_increase_strictly_above_cap_requires_owner_vote
          rationale: "The instantaneous rate cap is tested at exactly 20.00 and at 20.01 in the named §1.8 instance."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: derived_fields_are_current_in_the_same_response_that_moves_them
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.DefectClaim.NOTICED_to_RESERVED
          - calculations.defect_claim_reserve_amount
          - calculations.records_transfer_completeness
        distinguishing_aspect: "Consistency is immediate, so no read-after-write lag is tolerated anywhere: the RESERVE response already carries the computed fee and total, the very next read of the association already shows the committed and available pools moved, and an ACCEPT response's turnover case already shows the new completeness percentage — nothing requires a second call or a settling delay to become correct."
        test_recipe:
          setup:
            - "Association 'Zeals Barrow' with reserve_claim_pool_cents 3000000, one CONVEYED component (substantial_completion_date 2024-01-01T00:00:00Z) and one DefectClaim moved to NOTICED."
            - "One TurnoverCase (total_seats 3) with two required RecordsTransferItems, the first already DELIVERED."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Zeals Barrow", total_planned_lots: 4, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 0, reserve_claim_pool_cents: 3000000, declarant_monthly_subsidy_cents: 0 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/turnover-cases"
              payload: { association_id: "${assoc_id}", total_seats: 3 }
              as: PlatformAdmin
              captures: { case_id: $.data.id }
            - call: "POST /hoa/components"
              payload: { association_id: "${assoc_id}", name: "Terrace Slab", category: "STRUCTURE", replacement_cost_cents: 2000000, useful_life_years: 30, effective_age_years: 2, promised_completion_date: "2024-01-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { comp_id: $.data.id }
            - call: "POST /hoa/components/${comp_id}/milestones"
              payload: { milestone: "BUILD_COMPLETE", effective_date: "2024-01-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/components/${comp_id}/milestones"
              payload: { milestone: "DEED_TENDERED" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/components/${comp_id}/milestones"
              payload: { milestone: "CONVEYANCE_ACCEPTED" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/defect-claims"
              payload: { association_id: "${assoc_id}", component_id: "${comp_id}", defect_summary: "Terrace slab cracking", repair_cost_estimate_cents: 1500000, diminution_value_cents: 900000 }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /hoa/defect-claims/${claim_id}/actions"
              payload: { action: "NOTICE" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/records-items"
              payload: { turnover_case_id: "${case_id}", category: "FINANCIAL_RECORDS", required: true }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { item1: $.data.id }
            - call: "POST /hoa/records-items"
              payload: { turnover_case_id: "${case_id}", category: "PERMITS", required: true }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { item2: $.data.id }
            - call: "POST /hoa/records-items/${item1}/transitions"
              payload: { action: "DELIVER" }
              as: Declarant
              as_user_id: "declarant-1"
          trigger:
            - call: "POST /hoa/defect-claims/${claim_id}/actions"
              payload: { action: "RESERVE", valuation_basis: "REPAIR_COST" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "GET /hoa/associations/${assoc_id}"
              payload: {}
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/records-items/${item1}/transitions"
              payload: { action: "ACCEPT" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "GET /hoa/turnover-cases/${case_id}"
              payload: {}
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
          assert:
            - "first trigger call returns 200 with data.reserve_subtotal_cents == 1500000, data.litigation_admin_fee_cents == 180000, data.reserved_amount_cents == 1680000 in that same response"
            - "second trigger call: data.reserve_claim_committed_cents == 1680000 and data.reserve_claim_available_cents == 1320000, with no intervening call needed"
            - "third trigger call returns 200 with data.status == ACCEPTED"
            - "fourth trigger call: data.records_transfer_completeness_pct == 50.00, current as of the accept in the previous call"
            - "RecordsTransferItem.${item2}.status == OUTSTANDING"
            - "no assertion in this recipe requires a retry, a delay or a second read to become true"
