  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: voiding_service_record_restores_total_refrigerant_mass_exactly
        grounds:
          - calculations.total_refrigerant_mass_invariant
          - calculations.system_charge_projection
          - entities.ServiceRecord.fields.voided
          - entities.Store.fields.vented_loss_lbs
          - entities.Cylinder.fields.current_contents_lbs
        distinguishing_aspect: |
          Conserved quantity: physical refrigerant MASS across the store's four
          buckets (system charge + cylinder contents + shipped-for-reclaim +
          vented loss), fixed at 120.0 lbs. The forward action splits 10.0 lbs
          out of a cylinder into a system and vents 2.0 lbs, moving three buckets
          at once; the void must reverse all three exactly and not merely flip
          the voided flag. Rounding drift or a partial reversal (for example
          restoring the cylinder but leaving Store.vented_loss_lbs at 2.0) shows
          up as a total of 122.0 or 118.0 rather than 120.0.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one store, R-404A, SYS1 (full 100.0, initial 80.0), T1 TYPE_II, EQ1 certified HIGH, CYL1 nominal 50.0 holding 40.0 lbs."
            - "Opening balance: 80.0 (system) + 40.0 (cylinder) + 0.0 (shipped) + 0.0 (vented) == 120.0 lbs."
            - "Forward action: ADD_REFRIGERANT of 10.0 lbs with refrigerant_lost_lbs 2.0 at 2026-08-01T00:00:00Z, duration 120."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id }
            - call: "POST /refrigerant-types"
              payload: { name: "R-404A", gwp: 3922, pressure_class: "HIGH", ods_class: "HFC", phasedown_status: "RESTRICTED_NEW_EQUIPMENT" }
              as: ComplianceManager
              captures: { rt404_id: $.data.id }
            - call: "POST /systems"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", system_category: "COMMERCIAL_REFRIGERATION", full_charge_lbs: 100.0, initial_charge_lbs: 80.0, installed_on: "2025-01-15T00:00:00Z", leak_rate_method: "ROLLING_AVERAGE" }
              as: ComplianceManager
              captures: { sys1_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Dana Ruiz", epa_certification_number: "EPA-608-11111", certification_type: "TYPE_II", certification_expires_on: "2027-12-31T00:00:00Z" }
              as: ComplianceManager
              captures: { tech1_id: $.data.id }
            - call: "POST /recovery-equipment"
              payload: { store_id: "${store_id}", assigned_technician_id: "${tech1_id}", equipment_serial: "RM-9001", certified_to_standard: "AHRI_740_2016", certified_for_pressure_class: "HIGH", last_verification_on: "2026-06-01T00:00:00Z" }
              as: ComplianceManager
              captures: { eq1_id: $.data.id }
            - call: "POST /cylinders"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", cylinder_serial: "CYL-0001", nominal_capacity_lbs: 50.0, initial_contents_lbs: 40.0 }
              as: ComplianceManager
              captures: { cyl1_id: $.data.id }
            - call: "GET /systems/${sys1_id}"
              payload: {}
              as: ComplianceManager
              captures: { sys1_v: $.data.version }
            - call: "POST /service-records"
              payload: { system_id: "${sys1_id}", technician_id: "${tech1_id}", recovery_equipment_id: "${eq1_id}", cylinder_id: "${cyl1_id}", service_type: "ADD_REFRIGERANT", refrigerant_added_lbs: 10.0, refrigerant_lost_lbs: 2.0, performed_at: "2026-08-01T00:00:00Z", duration_minutes: 120, expected_system_version: "${sys1_v}" }
              as: Technician
              as_user_id: "${tech1_id}"
              captures: { rec_id: $.data.id, rec_charge_after: $.data.system_charge_after_lbs, rec_retention: $.data.retention_until }
          trigger:
            - call: "POST /service-records/${rec_id}/void"
              payload: { void_reason_code: "MISKEYED_QUANTITY" }
              as: ComplianceManager
              captures: { rec_voided: $.data.voided, rec_voided_at: $.data.voided_at }
          assert:
            - "after the forward action: RefrigerantSystem.${sys1_id}.current_charge_lbs == 88.0, Cylinder.${cyl1_id}.current_contents_lbs == 30.0, Store.${store_id}.vented_loss_lbs == 2.0, sum == 120.0"
            - "after the forward action: ServiceRecord.${rec_id}.leak_rate_pct_after == 10.0 and no LeakEvent exists"
            - "after the forward action: ServiceRecord.${rec_id}.retention_until == 2029-08-01T00:00:00Z"
            - "after the void: ServiceRecord.${rec_id}.voided == true, voided_at == 2026-08-01T00:00:00Z, void_reason_code == MISKEYED_QUANTITY"
            - "after the void: RefrigerantSystem.${sys1_id}.current_charge_lbs == 80.0, Cylinder.${cyl1_id}.current_contents_lbs == 40.0, Store.${store_id}.vented_loss_lbs == 0.0, sum == 120.0 (unchanged)"
            - "after the void: RefrigerantSystem.${sys1_id}.leak_rate_pct == 0.0 and exceedance_count_12mo == 0"
            - "after the void: ServiceRecord.${rec_id}.retention_until == 2029-08-01T00:00:00Z (retention survives the void)"
            - "after the void: RefrigerantSystem.${sys1_id}.version == ${sys1_v} + 2 and Cylinder.${cyl1_id}.shipped_for_reclaim_lbs == 0.0"

      - name: revoking_extension_restores_thirty_day_budget_and_original_deadline
        grounds:
          - calculations.extension_day_budget
          - state_machines.ExtensionRequest.PENDING_to_APPROVED
          - state_machines.ExtensionRequest.APPROVED_to_REVOKED
          - entities.ExtensionRequest.fields.deadline_before
          - entities.LeakEvent.fields.repair_deadline
        distinguishing_aspect: |
          A different conserved quantity: the statutory 30-day extension budget,
          where extension_days_granted_total + extension_days_remaining == 30
          must hold before, during and after the compensation, and the derived
          LeakEvent.repair_deadline must land back on deadline_before to the
          exact instant. The approval moves a date rather than a mass, so the
          compensation is tested on calendar arithmetic instead of decimals: an
          implementation that subtracts 20 days from "today" instead of
          recomputing initial_repair_deadline + granted_total lands on the wrong
          date even though its budget counters look right.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one store, R-404A, SYS_E (full 60.0, initial 0.0, installed 2025-03-01)."
            - "A manually declared LeakEvent E1 (MANUAL_INSPECTION, detected_at 2026-08-01T00:00:00Z) with initial_repair_deadline == repair_deadline == 2026-08-31T00:00:00Z and extension_days_remaining 30."
            - "Forward action: ExtensionRequest ER1 for 20 days (PARTS_UNAVAILABLE) is APPROVED with granted_days 20, moving repair_deadline to 2026-09-20T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id }
            - call: "POST /refrigerant-types"
              payload: { name: "R-404A", gwp: 3922, pressure_class: "HIGH", ods_class: "HFC", phasedown_status: "RESTRICTED_NEW_EQUIPMENT" }
              as: ComplianceManager
              captures: { rt404_id: $.data.id }
            - call: "POST /systems"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", system_category: "COMMERCIAL_REFRIGERATION", full_charge_lbs: 60.0, initial_charge_lbs: 0.0, installed_on: "2025-03-01T00:00:00Z", leak_rate_method: "ROLLING_AVERAGE" }
              as: ComplianceManager
              captures: { syse_id: $.data.id }
            - call: "POST /leak-events"
              payload: { system_id: "${syse_id}", detected_at: "2026-08-01T00:00:00Z", detection_method: "MANUAL_INSPECTION" }
              as: ComplianceManager
              captures: { event_id: $.data.id, deadline_at_open: $.data.repair_deadline, remaining_at_open: $.data.extension_days_remaining }
            - call: "POST /extension-requests"
              payload: { leak_event_id: "${event_id}", reason_code: "PARTS_UNAVAILABLE", requested_days: 20, justification: "compressor rack valve on national backorder" }
              as: ComplianceManager
              captures: { er1_id: $.data.id, er1_before: $.data.deadline_before, er1_expires: $.data.expires_at }
            - call: "POST /extension-requests/${er1_id}/decision"
              payload: { decision: "APPROVE", granted_days: 20 }
              as: Regulator
              as_user_id: "regulator-1"
              captures: { er1_after: $.data.deadline_after, er1_status: $.data.status }
          trigger:
            - call: "POST /extension-requests/${er1_id}/revocation"
              payload: { revocation_reason_code: "JUSTIFICATION_WITHDRAWN" }
              as: Regulator
              as_user_id: "regulator-1"
              captures: { er1_revoked_status: $.data.status, er1_revoked_at: $.data.revoked_at }
          assert:
            - "at open: LeakEvent.${event_id}.extension_days_granted_total == 0 and extension_days_remaining == 30 (sum 30)"
            - "ExtensionRequest.${er1_id}.expires_at == 2026-08-16T00:00:00Z and deadline_before == 2026-08-31T00:00:00Z"
            - "after the approval: ExtensionRequest.${er1_id}.status == APPROVED, granted_days == 20, deadline_after == 2026-09-20T00:00:00Z"
            - "after the approval: LeakEvent.${event_id}.extension_days_granted_total == 20 and extension_days_remaining == 10 (sum 30)"
            - "after the revocation: ExtensionRequest.${er1_id}.status == REVOKED, revoked_at == 2026-08-01T00:00:00Z, revocation_reason_code == JUSTIFICATION_WITHDRAWN"
            - "after the revocation: LeakEvent.${event_id}.extension_days_granted_total == 0 and extension_days_remaining == 30 (sum 30)"
            - "after the revocation: LeakEvent.${event_id}.repair_deadline == 2026-08-31T00:00:00Z, identical to ExtensionRequest.${er1_id}.deadline_before"
            - "after the revocation: LeakEvent.${event_id}.initial_repair_deadline == 2026-08-31T00:00:00Z and status == OPEN (the restored deadline is still in the future, so no REPAIR_OVERDUE)"
            - "ExtensionRequest.${er1_id}.granted_days and deadline_after are retained as history; only the LeakEvent aggregates drop the row"
