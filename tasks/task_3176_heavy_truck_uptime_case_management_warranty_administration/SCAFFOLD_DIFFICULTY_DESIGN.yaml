  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: service_bay_half_open_interval_overlap
        grounds:
          - validations.priority_9_business_safety
          - entities.ServiceBay
          - state_machines.ServiceBay
        distinguishing_aspect: |
          Resource: ServiceBay. Semantics: half-open interval [start, end) —
          two windows that merely touch (end of A == start of B) do NOT conflict,
          but any positive overlap does. The test verifies the half-open
          boundary: Case A's window 13:00-17:00, Case B's window 17:00-19:00
          (touching) is ALLOWED; Case C's window 16:59-18:00 (overlapping by 1
          minute) is REJECTED. Differentiation: half-open interval arithmetic,
          distinct from the CampaignCompletion day-granularity window in the
          other instance.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Fleet/Truck/Dealer/Bay."
            - "Case A scheduled onto Bay B1 window 13:00-17:00; work order AUTHORIZED."
            - "Case B triaged, ready to schedule 17:00-19:00 (touching boundary) — should succeed."
            - "Case C triaged, attempted 16:59-18:00 — should fail ERR_BAY_TIME_CONFLICT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: UptimeCoordinator
