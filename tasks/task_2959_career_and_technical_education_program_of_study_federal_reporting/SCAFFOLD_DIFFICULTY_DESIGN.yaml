      - name: tagged_asset_periods_are_closed_and_inflated_by_a_fourteen_day_mobilisation_buffer
        grounds:
          - validations[priority=23]
          - errors[ERR_ASSET_PERIOD_OVERLAP]
          - entities.Expenditure.fields.asset_tag
          - entities.Expenditure.fields.service_period_start
          - entities.Expenditure.fields.service_period_end
        distinguishing_aspect: |
          Asset occupancy runs the OPPOSITE way from seat occupancy: the intervals are CLOSED and then inflated by 14
          days on each side, so adjacency is ILLEGAL and even a fourteen-day gap collides. A start exactly 14 days after
          the incumbent's end is rejected and 15 days after is accepted — the mirror image of the half-open seat rule.
        test_recipe:
          setup:
            - "Logical clock at its startup default 2026-08-01T00:00:00Z."
            - "One ProgramOfStudy in approval_status DRAFT (no approval state is required to REQUEST a charge)."
            - "One GrantAward for fiscal_year 2027 with allocation_cents 5000000 and obligation window 2026-07-01 to 2027-06-30."
            - "One REQUESTED EQUIPMENT Expenditure with asset_tag LATHE-01, service_period_start 2026-09-01 and service_period_end 2026-09-30, so its inflated occupancy runs 2026-08-18 through 2026-10-14."
            - "The rejected attempt leaves GrantAward.version untouched, so the same captured version value guards both attempts."
          setup_api_calls:
            - call: "POST /cte/programs-of-study"
              payload: { cip_code: "15.0403", title: "Mechatronics", cluster: "ADVANCED_MANUFACTURING", labor_market_data_asof: "2026-03-01" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { pos_id: $.data.id }
            - call: "POST /cte/grant-awards"
              payload: { fiscal_year: 2027, allocation_cents: 5000000, obligation_window_start: "2026-07-01", obligation_window_end: "2027-06-30" }
              as: GrantFiscalOfficer
              as_user_id: "u_fis_1"
              captures: { grant_id: $.data.id, grant_v1: $.data.version }
            - call: "POST /cte/grant-awards/${grant_id}/expenditures"
              payload: { pos_id: "${pos_id}", category: "EQUIPMENT", description: "Mechatronics trainer rig", unit_cost_cents: 300000, quantity: 1, service_period_start: "2026-09-01", service_period_end: "2026-09-30", asset_tag: "LATHE-01", expected_grant_award_version: "${grant_v1}" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { exp1_id: $.data.id }
            - call: "GET /cte/grant-awards/${grant_id}"
              payload: {}
              as: GrantFiscalOfficer
              as_user_id: "u_fis_1"
              captures: { grant_v2: $.data.version }
          trigger:
            - call: "POST /cte/grant-awards/${grant_id}/expenditures"
              payload: { pos_id: "${pos_id}", category: "EQUIPMENT", description: "Second rig booking", unit_cost_cents: 300000, quantity: 1, service_period_start: "2026-10-14", service_period_end: "2026-11-30", asset_tag: "LATHE-01", expected_grant_award_version: "${grant_v2}" }
              as: CteDirector
              as_user_id: "u_dir_1"
            - call: "POST /cte/grant-awards/${grant_id}/expenditures"
              payload: { pos_id: "${pos_id}", category: "EQUIPMENT", description: "Second rig booking", unit_cost_cents: 300000, quantity: 1, service_period_start: "2026-10-15", service_period_end: "2026-11-30", asset_tag: "LATHE-01", expected_grant_award_version: "${grant_v2}" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { exp2_id: $.data.id, exp2_st: $.data.status, exp2_gross: $.data.gross_cents }
          assert:
            - "the first expenditures call returns error_id == ERR_ASSET_PERIOD_OVERLAP with HTTP status 409"
            - "the first expenditures call does NOT return ERR_STALE_GRANT_VERSION"
            - "${exp2_st} == REQUESTED"
            - "${exp2_gross} == 300000"
            - "Expenditure.${exp2_id}.service_period_start == 2026-10-15"
            - "Expenditure.${exp1_id}.status == REQUESTED"
            - "GrantAward.${grant_id}.remaining_cents == 5000000"

  - rule_id: compensating_invariant
    instances:

      - name: voiding_recomputes_the_grant_ledger_from_scratch_instead_of_decrementing_it
        grounds:
          - state_machines.Expenditure.CERTIFIED_to_VOIDED
          - calculations.grant_obligation_rollup
          - calculations.expenditure_federal_share
          - entities.GrantAward.fields.indirect_pool_cents
          - entities.GrantAward.fields.remaining_cents
        distinguishing_aspect: |
          The compensation is arithmetically UNSAFE to implement by subtraction: because indirect_pool_cents is a
          round_half_up of the direct total, subtracting the voided line's own share of the pool leaves 17255 while a
          from-scratch recompute gives 17256, so remaining_cents lands on 4770236 instead of 4770235. The instance pins
          the recomputed figures and the conservation identity allocation == obligated + remaining.
        test_recipe:
          setup:
            - "Logical clock at its startup default 2026-08-01T00:00:00Z."
            - "One ProgramOfStudy in approval_status STATE_APPROVED with clna_phase CERTIFIED."
            - "One GrantAward for fiscal_year 2027 with allocation_cents 5000000 and obligation window 2026-07-01 to 2027-06-30."
            - "Two CONSUMABLE Expenditures on that award, each with unit_cost_cents 125005 and quantity 2 (gross_cents 250010, approved_cents round_half_up(250010 * 0.85) == 212509), both certified, so direct_obligated_cents is 425018, indirect_pool_cents is 34511, obligated_cents is 459529 and remaining_cents is 4540471."
            - "Neither expenditure carries an asset_tag, so the tagged-asset rule at priority 23 never applies."
