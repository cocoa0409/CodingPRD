              as: CastingDirector
              captures: { tal_id: $.data.id }
            # Build 3 union-covered roles/breakdowns and book+confirm the first two
            - call: "POST /casting/productions/${prod_id}/roles"
              payload: { character_name: "UR1", is_minor_role: false, is_union_covered: true, engagement_start: "2026-08-10T00:00:00Z", engagement_end: "2026-08-11T00:00:00Z" }
              as: CastingDirector
              captures: { role1_id: $.data.id }
