            - "School.${schC}.recognition_tier == SILVER (rate 50.0 == c40 50.0)"
            - "School.${schD}.recognition_tier == BRONZE (rate 25.0 < c40 50.0)"
            - "Each school's own rate participated in the distribution that produced its cutoffs (N=4, nearest-rank ceil)"

  - rule_id: non_linear_state_machine
    instances:
      - name: senior_record_parallel_match_and_fafsa_axes
        grounds:
          - state_machines.SeniorRecord
          - entities.SeniorRecord.fields.match_status
          - entities.SeniorRecord.fields.fafsa_status
        distinguishing_aspect: |
          Parallel state dimensions on ONE entity: the match axis cycles
          UNMATCHED->SUGGESTED->MATCHED->UNMATCHED (via invalidate) while the
          fafsa axis independently advances NO_RECORD->SUBMITTED->
          VERIFICATION_SELECTED and is NOT reset by the match-axis revert.
        test_recipe:
          setup:
            - "Campaign OPEN; school ENROLLED; senior matched via SUGGESTED link (score 0.85); aid record initially SUBMITTED (eff 2027-01-10)"
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "C27", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 100000 }, captures: { camp: $.data.id } }
            - { call: "POST /fafsa/campaigns/${camp}/activate", as: CampaignAdmin }
            - { call: "POST /fafsa/schools", as: CampaignAdmin, payload: { campaign_id: "${camp}", name: "North HS", district_code: "D01", school_code: "SC01" }, captures: { sch: $.data.id } }
            - { call: "POST /fafsa/schools/${sch}/enroll", as: CampaignAdmin }
            - { call: "POST /fafsa/staff-profiles", as: CampaignAdmin, payload: { campaign_id: "${camp}", full_name: "Spec Sal", capabilities: ["CASE_SPECIALIST"], languages: ["en"] }, captures: { spec: $.data.id } }
            - { call: "POST /fafsa/senior-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", student_ref: "S1", full_name: "Ana Lee", dob: "2009-03-04", home_language: "en" }, captures: { sr: $.data.id, sr_v: $.data.version } }
            - { call: "POST /fafsa/aid-records", as: DataImporter, payload: { campaign_id: "${camp}", external_ref: "EXT1", full_name: "Ana Lee", dob: "2009-03-04", school_code: "SC99", district_code: "D01", initial_status: "SUBMITTED", effective_date: "2027-01-10" }, captures: { ar: $.data.id } }
            - { call: "POST /fafsa/consent-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { senior_record_id: "${sr}", scopes: ["STATUS_DETAIL"], granted_by: "PARENT" } }
            - { call: "POST /fafsa/match-links", as: MatchReviewer, payload: { senior_record_id: "${sr}", aid_record_id: "${ar}", expected_senior_record_version: "${sr_v}" }, captures: { lk: $.data.id, lk_status: $.data.status } }
          trigger:
            - { call: "POST /fafsa/match-links/${lk}/confirm", as: MatchReviewer }
            - { call: "GET /fafsa/senior-records/${sr}", as: CampaignAdmin, captures: { ms1: $.data.match_status, fs1: $.data.fafsa_status } }
            - { call: "POST /fafsa/aid-records/${ar}/status-events", as: DataImporter, payload: { fafsa_status: "VERIFICATION_SELECTED", effective_date: "2027-02-01" } }
            - { call: "GET /fafsa/senior-records/${sr}", as: CampaignAdmin, captures: { fs2: $.data.fafsa_status } }
            - { call: "POST /fafsa/match-links/${lk}/invalidate", as: MatchReviewer }
            - { call: "GET /fafsa/senior-records/${sr}", as: CampaignAdmin, captures: { ms3: $.data.match_status, fs3: $.data.fafsa_status } }
          assert:
            - "After confirm: match_status == MATCHED and fafsa_status == SUBMITTED (axes moved together on link application)"
            - "After VERIFICATION_SELECTED event: fafsa_status == VERIFICATION_SELECTED while match_status still MATCHED (independent axis move)"
            - "After invalidate: match_status == UNMATCHED but fafsa_status REMAINS VERIFICATION_SELECTED (match revert does not touch the fafsa axis)"
            - "A VERIFICATION_FOLLOWUP SupportCase exists for the senior (auto-created by the fafsa axis transition)"
      - name: support_case_review_loop_cycles
        grounds:
          - state_machines.SupportCase
        distinguishing_aspect: |
          Cyclic machine on SupportCase: IN_REVIEW -> AWAITING_FAMILY -> IN_REVIEW
          loop executed, then IN_REVIEW -> ESCALATED -> RESOLVED (resolve allowed
          from ESCALATED), proving the machine is not a linear pipeline.
        test_recipe:
          setup:
            - "Campaign OPEN; school ENROLLED; senior with GRANTED STATUS_DETAIL consent; specialist (CASE_SPECIALIST, languages [en])"
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "C27", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 100000 }, captures: { camp: $.data.id } }
            - { call: "POST /fafsa/campaigns/${camp}/activate", as: CampaignAdmin }
            - { call: "POST /fafsa/schools", as: CampaignAdmin, payload: { campaign_id: "${camp}", name: "North HS", district_code: "D01", school_code: "SC01" }, captures: { sch: $.data.id } }
            - { call: "POST /fafsa/schools/${sch}/enroll", as: CampaignAdmin }
            - { call: "POST /fafsa/staff-profiles", as: CampaignAdmin, payload: { campaign_id: "${camp}", full_name: "Spec Sal", capabilities: ["CASE_SPECIALIST"], languages: ["en"] }, captures: { spec: $.data.id } }
            - { call: "POST /fafsa/senior-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", student_ref: "S1", full_name: "Ana Lee", dob: "2009-03-04", home_language: "en" }, captures: { sr: $.data.id } }
            - { call: "POST /fafsa/consent-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { senior_record_id: "${sr}", scopes: ["STATUS_DETAIL"], granted_by: "PARENT" } }
          trigger:
            - { call: "POST /fafsa/support-cases", as: SchoolCoordinator, as_user_id: "${sch}", payload: { senior_record_id: "${sr}", case_type: "SPECIAL_CIRCUMSTANCE", notes: "possible homelessness liaison referral" }, captures: { cs: $.data.id, cs_spec: $.data.assigned_specialist_id } }
            - { call: "POST /fafsa/support-cases/${cs}/accept", as: Specialist, as_user_id: "${cs_spec}", captures: { st1: $.data.status } }
            - { call: "POST /fafsa/support-cases/${cs}/request-documents", as: Specialist, as_user_id: "${cs_spec}", captures: { st2: $.data.status } }
            - { call: "POST /fafsa/support-cases/${cs}/documents-received", as: Specialist, as_user_id: "${cs_spec}", captures: { st3: $.data.status } }
            - { call: "POST /fafsa/support-cases/${cs}/escalate", as: Specialist, as_user_id: "${cs_spec}", captures: { st4: $.data.status } }
            - { call: "POST /fafsa/support-cases/${cs}/resolve", as: Specialist, as_user_id: "${cs_spec}", payload: { resolution_outcome: "NOT_QUALIFIED" }, captures: { st5: $.data.status, outcome: $.data.resolution_outcome } }
            - { call: "GET /fafsa/senior-records/${sr}", as: CampaignAdmin, captures: { dep: $.data.dependency_status } }
            - { call: "GET /fafsa/staff-profiles/${spec}", as: CampaignAdmin, captures: { caseload: $.data.active_case_count } }
          assert:
            - "Status path: IN_REVIEW -> AWAITING_FAMILY -> IN_REVIEW -> ESCALATED -> RESOLVED (loop traversed)"
            - "SupportCase.${cs}.assigned_specialist_id == ${spec} (selector: only ACTIVE specialist, language match)"
            - "resolution_outcome == NOT_QUALIFIED and SeniorRecord.${sr}.dependency_status == DEPENDENT (PENDING_REVIEW reverted)"
            - "StaffProfile.${spec}.active_case_count == 0 after resolve"
      - name: event_draft_publish_unpublish_cycle
        grounds:
          - state_machines.CompletionEvent
          - calculations.budget_ledger
        distinguishing_aspect: |
          Cyclic machine on CompletionEvent (DRAFT -> PUBLISHED -> DRAFT ->
          PUBLISHED): the unpublish revert releases the budget commitment and
          cancels registrations, and re-publish recommits — registrations are
          NOT restored (asymmetric compensation), distinguishing this cycle from
          a no-op toggle. (SeniorRecord and SupportCase supply the other two
          non-linear machines, on different entities.)
        test_recipe:
          setup:
            - "Campaign OPEN (budget 100000); school ENROLLED; event cost 20000 capacity 5, required_expert_count 0, supported_languages []"
            - "Senior with GRANTED OUTREACH consent"
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "C27", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 100000 }, captures: { camp: $.data.id } }
            - { call: "POST /fafsa/campaigns/${camp}/activate", as: CampaignAdmin }
            - { call: "POST /fafsa/schools", as: CampaignAdmin, payload: { campaign_id: "${camp}", name: "North HS", district_code: "D01", school_code: "SC01" }, captures: { sch: $.data.id } }
            - { call: "POST /fafsa/schools/${sch}/enroll", as: CampaignAdmin }
            - { call: "POST /fafsa/senior-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", student_ref: "S1", full_name: "Ana Lee", dob: "2009-03-04", home_language: "en" }, captures: { sr: $.data.id } }
            - { call: "POST /fafsa/consent-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { senior_record_id: "${sr}", scopes: ["OUTREACH"], granted_by: "PARENT" } }
            - { call: "POST /fafsa/events", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", title: "FAFSA Night", start_time: "2026-09-10T15:00:00Z", end_time: "2026-09-10T18:00:00Z", capacity: 5, cost_estimate_cents: 20000, required_expert_count: 0, supported_languages: [] }, captures: { ev: $.data.id } }
          trigger:
            - { call: "POST /fafsa/events/${ev}/publish", as: SchoolCoordinator, as_user_id: "${sch}", captures: { st1: $.data.status } }
            - { call: "POST /fafsa/event-registrations", as: SchoolCoordinator, as_user_id: "${sch}", payload: { event_id: "${ev}", senior_record_id: "${sr}" }, captures: { reg: $.data.id } }
            - { call: "POST /fafsa/events/${ev}/unpublish", as: SchoolCoordinator, as_user_id: "${sch}", captures: { st2: $.data.status } }
            - { call: "GET /fafsa/campaigns/${camp}", as: CampaignAdmin, captures: { committed_mid: $.data.committed_budget_cents } }
            - { call: "GET /fafsa/event-registrations/${reg}", as: CampaignAdmin, captures: { reg_st: $.data.status } }
            - { call: "POST /fafsa/events/${ev}/publish", as: SchoolCoordinator, as_user_id: "${sch}", captures: { st3: $.data.status } }
            - { call: "GET /fafsa/campaigns/${camp}", as: CampaignAdmin, captures: { committed_end: $.data.committed_budget_cents } }
          assert:
            - "Event status path PUBLISHED -> DRAFT -> PUBLISHED (cycle completed)"
            - "After unpublish: Campaign.committed_budget_cents == 0 and registration ${reg} status == CANCELLED"
            - "After re-publish: committed_budget_cents == 20000 and registration REMAINS CANCELLED (no auto-restore)"

  - rule_id: transitive_cascade
    instances:
      - name: verification_snapshot_cascade_depth3
        grounds:
          - state_machines.SeniorRecord
          - state_machines.SupportCase
          - state_machines.StaffProfile
          - calculations.specialist_selection
          - calculations.caseload_invariant
        distinguishing_aspect: |
          Depth-3 chain originating from a DATA IMPORT trigger: AidStatusEvent
          append -> SeniorRecord.fafsa_status flip -> auto-created SupportCase ->
          StaffProfile.active_case_count increment and OVERLOADED flip. Each link
          is caused by the previous link, and the trigger differs from
          match_confirm_checklist_generation_depth2's confirm trigger.
