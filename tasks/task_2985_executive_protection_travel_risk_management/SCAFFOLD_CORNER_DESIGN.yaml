      - name: consent_patch_stores_the_scope_and_expiry_it_is_given
        claim_type: standard_crud
        grounds:
          - endpoints.PATCH_/exec-protection/executives/{id}/consent
          - entities.Executive.consent_scope
          - entities.Executive.consent_expires_at
        distinguishing_aspect: |
          Consent is the one Executive field a protectee may change about themselves, and the
          endpoint is shared with ProtectionManager. A PATCH supplying both fields must store
          both and bump version; a later PATCH supplying only consent_scope must change only that
          field and leave the stored expiry in place, which is what makes a scope downgrade to
          NONE distinguishable from an expiry lapse.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z; one executive created with the default consent_scope NONE"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "ops-1"
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Mia Manager", staff_role: "MANAGER", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 11000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { mgr_id: $.data.id }
            - call: "POST /exec-protection/executives"
              payload: { full_name: "Eve Exec", tier: "TIER_3", role_title: "CEO", base_country_code: "US", annual_security_budget_cents: 100000000 }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { exec_id: $.data.id, v0: $.data.version }
          trigger:
            - call: "PATCH /exec-protection/executives/${exec_id}/consent"
              payload: { consent_scope: "FULL_ITINERARY", consent_expires_at: "2026-12-31T00:00:00Z" }
              as: Executive
              as_user_id: "${exec_id}"
              captures: { scope1: $.data.consent_scope, v1: $.data.version }
            - call: "PATCH /exec-protection/executives/${exec_id}/consent"
              payload: { consent_scope: "TRIP_ONLY" }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { scope2: $.data.consent_scope, v2: $.data.version }
          assert:
            - "the executive started at consent_scope == NONE, consent_expires_at == null and version == ${v0} == 1"
            - "the protectee's own PATCH returns HTTP 200 with ${scope1} == FULL_ITINERARY, consent_expires_at == '2026-12-31T00:00:00.000Z' and ${v1} == 2"
            - "the manager's PATCH returns HTTP 200 with ${scope2} == TRIP_ONLY and ${v2} == 3 — the endpoint is shared, not exclusive to the protectee"
            - "the second PATCH omitted consent_expires_at, so it is still '2026-12-31T00:00:00.000Z': an omitted optional field on a PATCH leaves the stored value alone"
            - "no other Executive field moved: annual_security_budget_cents == 100000000 and remaining_budget_cents == 100000000"

      - name: suspending_an_already_suspended_vendor_is_rejected
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/exec-protection/vendors/{id}/suspend
          - state_machines.Vendor.activation_status
          - errors.ERR_VENDOR_SUSPENDED
        distinguishing_aspect: |
          Suspension is the entry point of the deepest cascade in the scaffold, so it must not be
          re-runnable: the second call has to fail rather than re-fire hops 2..5 over engagements
          that hop 2 already cancelled. With no engagements attached, the first suspend is a pure
          one-row write, which isolates the idempotency claim from the cascade.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z; one AVAILABLE vendor with no engagements"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "ops-1"
