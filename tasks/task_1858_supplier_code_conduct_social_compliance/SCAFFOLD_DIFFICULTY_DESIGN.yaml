  - rule_id: transitive_cascade
    instances:
      - name: zt_finding_four_hop_cascade
        grounds:
          - state_machines.Audit.IN_PROGRESS_to_FAILED_ZT
          - calculations.supplier_scorecard_scores
          - calculations.consequence_tier_mapping
          - state_machines.Supplier.ACTIVE_to_PROBATION
        distinguishing_aspect: |
          Depth-4 cascade triggered by recording a ZERO_TOLERANCE finding: (1) audit
          zt_count increments, (2) audit auto-transitions IN_PROGRESS -> FAILED_ZT,
          (3) supplier scorecard recomputes (-40 in both variants), (4) supplier
          auto-transitions ACTIVE -> PROBATION. Each hop is caused by the previous
          hop's mutation, not by the original request; the paired instance uses a
          different trigger (CAP verify FAIL).
        test_recipe:
          setup:
            - "Supplier ACTIVE (scores 100, PREFERRED); facility BD / 1200; audit IN_PROGRESS with one MINOR and one MAJOR finding already OPEN"
          setup_api_calls:
            - { call: "POST /code-versions", payload: { version_label: "CoC v1.0", effective_from: "2026-01-01T00:00:00Z", zero_tolerance_categories: ["FORCED_LABOR", "CHILD_LABOR"] }, as: SourcingProgramAdmin, captures: { cv_id: $.data.id } }
            - { call: "POST /code-versions/${cv_id}/transition", payload: { to_status: "PUBLISHED" }, as: SourcingProgramAdmin }
            - { call: "POST /suppliers", payload: { legal_name: "Golf Apparel", country_code: "BD", sector: "APPAREL" }, as: SourcingProgramAdmin, captures: { sup_id: $.data.id, sup_v: $.data.version } }
            - { call: "POST /code-acknowledgments", payload: { supplier_id: "${sup_id}", code_version_id: "${cv_id}", signer_name: "T Ali", signer_title: "CEO", expected_supplier_version: "${sup_v}" }, as: SupplierContact, as_user_id: "${sup_id}" }
            - { call: "POST /facilities", payload: { supplier_id: "${sup_id}", name: "Narayanganj Unit", country_code: "BD", worker_count: 1200, processes: ["sewing"] }, as: SourcingProgramAdmin, captures: { fac_id: $.data.id } }
            - { call: "POST /auditors", payload: { full_name: "Lead Auditor", firm_name: "AuditCo", certifications: ["SA8000"], country_codes_covered: ["BD"] }, as: AuditCoordinator, captures: { aud_id: $.data.id } }
            - { call: "POST /audits", payload: { facility_id: "${fac_id}", auditor_id: "${aud_id}", audit_type: "INITIAL", announcement: "SEMI_ANNOUNCED", scheduled_start: "2026-09-01T00:00:00Z", scheduled_end: "2026-09-20T00:00:00Z" }, as: AuditCoordinator, captures: { au_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SourcingProgramAdmin }
            - { call: "POST /audits/${au_id}/start", payload: {}, as: Auditor, as_user_id: "${aud_id}" }
            - { call: "POST /audits/${au_id}/findings", payload: { classification: "MINOR", category: "ENVIRONMENT", description: "Waste log incomplete" }, as: Auditor, as_user_id: "${aud_id}", captures: { f_min: $.data.id } }
            - { call: "POST /audits/${au_id}/findings", payload: { classification: "MAJOR", category: "WAGES", description: "Piece-rate records missing" }, as: Auditor, as_user_id: "${aud_id}", captures: { f_maj: $.data.id } }
          trigger:
            - { call: "POST /audits/${au_id}/findings", payload: { classification: "ZERO_TOLERANCE", category: "CHILD_LABOR", description: "Underage worker on line" }, as: Auditor, as_user_id: "${aud_id}", captures: { f_zt: $.data.id } }
            - { call: "GET /audits/${au_id}", payload: {}, as: ComplianceOfficer, captures: { au_status: $.data.status, zt: $.data.zt_count, maj: $.data.major_count, min: $.data.minor_count } }
            - { call: "GET /suppliers/${sup_id}/scorecard", payload: {}, as: ComplianceOfficer, captures: { ver: $.data.verified_score, prov: $.data.provisional_score, tier: $.data.consequence_tier } }
            - { call: "GET /suppliers/${sup_id}", payload: {}, as: ComplianceOfficer, captures: { sup_status: $.data.status } }
          assert:
            - "hop 1+2: ${zt} == 1 and ${au_status} == FAILED_ZT (the ZT record auto-failed the audit)"
            - "hop 3: ${ver} == 47 and ${prov} == 47 (100 - 40 - 10 - 3; all findings OPEN)"
            - "hop 4: ${tier} == PROBATION_WATCH (47 in [40,59]) and ${sup_status} == PROBATION (open ZT rule)"
            - "${maj} == 1 and ${min} == 1 (prior tallies preserved by the cascade)"

      - name: cap_verify_fail_escalation_cascade
        grounds:
          - state_machines.CorrectiveActionPlan.VERIFICATION_REQUESTED_to_VERIFICATION_FAILED
          - calculations.supplier_scorecard_scores
          - state_machines.Supplier.ACTIVE_to_PROBATION
          - entities.Supplier.fields.escalation_penalty_points
        distinguishing_aspect: |
          Depth-3 cascade from a DIFFERENT trigger than the ZT instance: verify FAIL ->
          (1) CAP.escalation_count increments, (2) at count >= 2 the supplier's sticky
          escalation_penalty_points += 5, (3) scorecard recompute crosses the 60
          threshold (62 -> 57) so (4) consequence_tier drops QUALIFIED ->
          PROBATION_WATCH and supplier status flips ACTIVE -> PROBATION. The first FAIL
          (count 1) provably changes nothing downstream.
        test_recipe:
          setup:
            - "Supplier ACTIVE; facility US / 10 workers; audit IN_PROGRESS with 3 MAJOR + 1 MINOR findings OPEN; one unresolved CRITICAL grievance -> verified_score 62 (100-30-3-5), QUALIFIED, ACTIVE"
            - "CAP on the first MAJOR approved and in VERIFICATION_REQUESTED; second auditor available"
