              payload: { licensee_type: "VENDOR", licensee_name: "Plains Vendor", vendor_worldwide: false, expected_users: 5, sales_unit_count: 4, base_fee_cents: 0, territory_id: "${ter_s1}" }
              as: LicensingOfficer
              captures: { lic_s1: $.data.id }
            - call: "POST /cpt/licensing-agreements"
              payload: { licensee_type: "VENDOR", licensee_name: "Rockies Vendor", vendor_worldwide: false, expected_users: 5, sales_unit_count: 3, base_fee_cents: 0, territory_id: "${ter_s2}" }
              as: LicensingOfficer
              captures: { lic_s2: $.data.id }
            - call: "POST /cpt/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: EditorialStaff
          trigger:
            - call: "POST /cpt/licensing-agreements/${lic_s2}/activations"
              payload: {}
              as: LicensingOfficer
              captures: { err8: $.data.error_id }
          assert:
            - "${err8} == ERR_LICENSE_FEE_BELOW_MINIMUM"
            - "LicensingAgreement.${lic_s1}.royalty_fee_cents == 4"
            - "LicensingAgreement.${lic_s2}.royalty_fee_cents == 3"
            - "LicensingAgreement.${lic_s2}.agreement_status == DRAFT"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: duplicate_code_beats_evidence_tier_conflict
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_CODE_ALREADY_EXISTS]
          - errors[ERR_EVIDENCE_INSUFFICIENT]
        distinguishing_aspect: |
          The state-versus-business_constraint pair: a filing that both reuses an
          existing descriptor number and carries TIER_IV evidence for a
          low-volume addition fails two checks, and the lower-priority uniqueness
          check at priority 5 wins over the evidence check at priority 6.
        test_recipe:
          setup:
            - "One ACTIVE SpecialtySociety and one ACTIVE ChangeApplicant"
            - "Logical clock at 2026-09-01T00:00:00Z"
            - "One existing CodeChange 00007 already on file"
          setup_api_calls:
