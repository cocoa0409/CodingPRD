              as: Inspector
              as_user_id: "insp-1"
              captures: { ci_id: $.data.id }
          trigger:
            - call: "POST /complaints/${c_id}/transition"
              payload: { action: "TRIAGE", linked_inspection_id: "${ci_id}" }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /complaints/${c_id}/transition"
              payload: { action: "START_INVESTIGATION" }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /inspections/${ci_id}/transition"
              payload: { action: "START" }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /inspections/${ci_id}/transition"
              payload: { action: "SUBMIT" }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /inspections/${ci_id}/transition"
              payload: { action: "FINALIZE" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
            - call: "POST /complaints/${c_id}/transition"
              payload: { action: "SUBSTANTIATE", finding: "Filter media exhausted; turbidity confirmed" }
