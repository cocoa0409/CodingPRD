          - state_machines.Ensemble.transitions
        distinguishing_aspect: |
          Vacating unwinds each hop the acceptance cascade performed: the seat becomes
          VACATED, the placement ACCEPTED -> RELEASED, quota filled_count 1 -> 0 with
          balance_state FULL -> UNDERFILLED, ensemble SEATED -> FORMING with seated_count 0
          and Season.seated_ensemble_count 1 -> 0. It is not a full rollback: Season.status
