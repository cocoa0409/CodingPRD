      - name: deposit_tier_boundary_exactly_at_mid_floor
        claim_type: Correct Result
        grounds: [calculations.deposit_estimate]
        distinguishing_aspect: "The deposit tier uses >= semantics: a final estimate of exactly 100000 takes the 20% tier (20000), while 99999 takes the 10% tier (10000) — the boundary belongs to the higher tier. Exercised via estimate letter issuance on a single-visit itinerary priced to land exactly on the boundary."
        test_recipe:
          setup: ["FINANCIAL_CLEARED case (waived? no — deposit path) with one held visit priced 100000 (domestic, single visit => 0% discount tier, so final == 100000)."]
          setup_api_calls:
            - *k_clock
