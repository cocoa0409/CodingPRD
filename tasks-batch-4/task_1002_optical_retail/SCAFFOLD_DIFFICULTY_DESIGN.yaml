          assert:
            - "The first confirm returns HTTP 409 and ${err} == ERR_PRESCRIPTION_NOT_VERIFIED"
            - "The second confirm returns HTTP 200"
            - "Order.${ord_id}.fulfillment_status == CONFIRMED"
            - "Order.${ord_id}.payment_status == AUTHORIZED"
            - "GET /optical/lab-orders?order_id=${ord_id} returns exactly one LabOrder with status == QUEUED"

      - name: warranty_claim_depends_on_lab_order_delivered_state
        grounds:
          - state_machines.LabOrder.SHIPPED_to_DELIVERED
          - validations[priority=44]
          - errors[ERR_LAB_ORDER_NOT_DELIVERED]
          - calculations.remake_liability
          - concurrency_rules[warranty-create-stale-lab-order]
        distinguishing_aspect: |
          A DIFFERENT entity pair (WarrantyClaim, LabOrder): a WarrantyClaim may only be created
          when the *LabOrder* is in DELIVERED (delivered_at non-null). The same POST
          /optical/warranty-claims flips from 409 ERR_LAB_ORDER_NOT_DELIVERED to 201 solely
          because the StoreAssociate handed the glasses over.
        test_recipe:
          setup:
            - "Self-pay customer, confirmed order, LabOrder started, QC-passed and SHIPPED but NOT yet delivered."
            - "The clock is at its 2026-05-01T00:00:00Z default throughout."
          setup_api_calls:
            - call: "POST /optical/frames"
              payload: { sku: "FRM-012", name: "Reilly", brand: "WP", price_cents: 9500, tryon_stock: 1, min_pd_mm: 54.0, max_pd_mm: 70.0 }
              as: PlatformAdmin
