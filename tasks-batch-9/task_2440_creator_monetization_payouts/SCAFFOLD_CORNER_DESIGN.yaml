        distinguishing_aspect: "The YELLOW multiplier 6000 is applied only to the ADVERTISING accrual (5000 bps becomes effective 3000, so 200000 gross yields 60000) while the SUBSCRIPTIONS accrual in the same period keeps effective 7000 and yields 700000 despite the creator's item being YELLOW."
        test_recipe:
          setup: ["One ELIGIBLE creator; one OPEN period; one ADVERTISING product at 5000/5000 bps and one SUBSCRIPTIONS product at 7000/3000 bps, both with min_payable_cents 0; one content item rated YELLOW by pr_rate_1."]
