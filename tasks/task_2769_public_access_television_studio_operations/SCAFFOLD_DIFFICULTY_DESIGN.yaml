  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: pair_a_resource_unavailable_outranks_deposit_cap
        grounds:
          - priority_conflict_pairs.pair_a_state_over_fiscal
          - validations[priority=14]
          - validations[priority=40]
          - errors[ERR_RESOURCE_NOT_AVAILABLE]
          - errors[ERR_DEPOSIT_LIMIT_EXCEEDED]
          - constants.DEPOSIT_HOLD_CAP_CENTS
        distinguishing_aspect: |
          Error-category pair state (409) versus business_fiscal (402): the
          resource-availability band at priority 14 must mask the deposit cap at
          priority 40 on POST /reservations/{reservationId}/confirm. The recipe
          proves both rules were genuinely violated by clearing only the state
          violation and re-running the identical call, which then surfaces the
          fiscal error.
        test_recipe:
          setup:
            - "Producer P is ACTIVE with certification_level BASIC and competency_codes [STUDIO_FLOOR, EDIT_SUITE], 0 suspension points."
            - "StudioResource CAM-RIG has base_deposit_cents 400000, replacement_value_cents 900000, capacity_slots 5, turnaround_minutes 0 and requires STUDIO_FLOOR."
            - "Reservation R1 (2026-08-08T10:00:00Z-12:00:00Z) is CONFIRMED with deposit_hold_cents 420000, so Producer.deposit_held_cents is 420000 against a DEPOSIT_HOLD_CAP_CENTS of 500000."
            - "Reservation R2 covers the identical interval and is REQUESTED; capacity_slots 5 means the overlap alone is legal, so priority 29 stays silent."
            - "The resource is then moved to MAINTENANCE, which is permitted because priority 20 only guards the RETIRED transition."
          setup_api_calls:
            - call: "POST /producers"
              payload: {legal_name: "Ada Lovelace", email: "ada@patv.example"}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {p_id: $.data.id}
            - call: "POST /producers/${p_id}/residency-verification"
              payload: {document_reference: "UTIL-2026-0001"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /training-courses"
              payload: {course_code: "TV-101", title: "Studio Basics", tier: "BASIC", grants_competency_codes: ["STUDIO_FLOOR", "EDIT_SUITE"], seat_capacity: 12, session_start_at: "2026-08-05T17:00:00Z", session_end_at: "2026-08-05T21:00:00Z"}
              as: TrainingCoordinator
              as_user_id: "trn-1"
              captures: {c_basic_id: $.data.id}
            - call: "POST /course-enrollments"
              payload: {producer_id: "${p_id}", course_id: "${c_basic_id}"}
              as: Producer
              as_user_id: "${p_id}"
              captures: {ep_id: $.data.id}
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-06T00:00:00Z"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /course-enrollments/${ep_id}/attendance"
              payload: {attended: true}
              as: TrainingCoordinator
              as_user_id: "trn-1"
            - call: "POST /course-enrollments/${ep_id}/grade"
              payload: {practical_score: 88}
              as: TrainingCoordinator
              as_user_id: "trn-1"
            - call: "POST /studio-resources"
              payload: {resource_code: "CAM-RIG", resource_class: "EQUIPMENT", required_competency_code: "STUDIO_FLOOR", capacity_slots: 5, turnaround_minutes: 0, base_deposit_cents: 400000, replacement_value_cents: 900000}
              as: FacilitiesManager
              as_user_id: "fac-1"
              captures: {res_id: $.data.id}
            - call: "POST /reservations"
              payload: {producer_id: "${p_id}", resource_id: "${res_id}", start_at: "2026-08-08T10:00:00Z", end_at: "2026-08-08T12:00:00Z"}
              as: Producer
              as_user_id: "${p_id}"
              captures: {r1_id: $.data.id}
            - call: "POST /reservations"
              payload: {producer_id: "${p_id}", resource_id: "${res_id}", start_at: "2026-08-08T10:00:00Z", end_at: "2026-08-08T12:00:00Z"}
              as: Producer
              as_user_id: "${p_id}"
              captures: {r2_id: $.data.id}
            - call: "POST /reservations/${r1_id}/confirm"
              payload: {}
              as: FacilitiesManager
              as_user_id: "fac-1"
              captures: {r1_hold: $.data.deposit_hold_cents}
            - call: "POST /studio-resources/${res_id}/status"
              payload: {status: "MAINTENANCE", status_reason: "Annual service window"}
              as: FacilitiesManager
              as_user_id: "fac-1"
          trigger:
            - call: "POST /reservations/${r2_id}/confirm"
              payload: {}
              as: FacilitiesManager
              as_user_id: "fac-1"
              captures: {masked_err: $.data.error_id}
            - call: "POST /studio-resources/${res_id}/status"
              payload: {status: "AVAILABLE", status_reason: "Service complete"}
              as: FacilitiesManager
              as_user_id: "fac-1"
            - call: "POST /reservations/${r2_id}/confirm"
              payload: {}
              as: FacilitiesManager
              as_user_id: "fac-1"
              captures: {unmasked_err: $.data.error_id}
          assert:
            - "${r1_hold} == 420000 — 400000 line_risk at 0 bp plus 20000 line_duration for the second started hour"
            - "${masked_err} == ERR_RESOURCE_NOT_AVAILABLE with HTTP 409, NOT ERR_DEPOSIT_LIMIT_EXCEEDED"
            - "${unmasked_err} == ERR_DEPOSIT_LIMIT_EXCEEDED with HTTP 402 once the resource is AVAILABLE again, proving the fiscal rule was violated all along (420000 + 420000 > 500000)"
            - "Reservation.${r2_id}.status == REQUESTED after both refusals and deposit_hold_cents == 0"
            - "Producer.${p_id}.deposit_held_cents == 420000 — neither refusal placed a hold"
            - "StudioResource.${res_id}.open_reservation_count == 1"

