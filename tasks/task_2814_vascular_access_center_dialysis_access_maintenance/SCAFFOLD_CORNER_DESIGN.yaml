            - "the attest returns 409 with data.error_id == ERR_CODING_STATE_INVALID because coding_status is UNCODED — not ERR_ATTESTATION_NOT_OPERATOR, since the caller is the primary operator"
            - "the code line returns 409 with data.error_id == ERR_CODING_STATE_INVALID because clinical_status is SCHEDULED rather than DISCHARGED or ABORTED — not ERR_SEGREGATION_OF_DUTIES, since the coder is neither clinician on the case"
