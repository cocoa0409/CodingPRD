# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Instant Payments Participation & Liquidity Management
# Every instance grounds in SCAFFOLD.yaml sections 1.1-1.7 only.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: fraud_score_origination_vs_review_final_diverge
        grounds:
          - calculations.fraud_score
          - entities.CreditTransfer.fields.fraud_score
          - entities.FraudReview.fields.score_at_origination
          - entities.FraudReview.fields.final_fraud_score
          - state_machines.CreditTransfer.FRAUD_HOLD_to_INITIATED
          - validations[priority=68]
        distinguishing_aspect: |
          The two variants live in the RISK domain and differ in three declared ways at once -
          velocity weight 4 vs 3, free count 3 vs 5, and whether the new-beneficiary bonus is
          re-evaluated - so the identical stored transfer scores 63 at origination and 50 at
          REVIEW_FINAL, and the release decision is gated on the second number while the first
          stays frozen on the transfer row.
        test_recipe:
          setup:
            - "Alpha National Bank is LIVE with routing 021000021 and a prefunded position account holding 1,200,000,000 cents (warning 1,100,000,000 / critical 1,000,000,000 / floor 200,000,000)."
            - "A CORPORATE segment policy is effective from 2026-08-01 with per-transaction limit 250,000,000, daily aggregate 500,000,000, rolling count 5 and rolling amount 400,000,000."
            - "Customer account CUST-ALPHA-0001 is CORPORATE with fraud_risk_baseline 25."
            - "Transfer T1 for 250,000,000 cents is created at 13:00 and lands in FRAUD_HOLD with fraud_score 63; a FraudReview is queued for it."
            - "A second, small transfer T2 for 200,000 cents to the SAME receiver routing number is created at 13:10, scores 45, and is accepted and settled, so the beneficiary is no longer new."
            - "The clock is at 13:20 when the review is decided."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T13:00:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants"
              payload: { legal_name: "Alpha National Bank", routing_number: "021000021", settlement_agent_reference: "SA-ALPHA-01", participation_model: "SEND_AND_RECEIVE" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { pa_id: $.data.id }
            - call: "POST /position-accounts"
              payload: { participant_id: "${pa_id}", opening_balance_cents: 1200000000, warning_threshold_cents: 1100000000, critical_threshold_cents: 1000000000, floor_cents: 200000000 }
              as: LiquidityOfficer
              as_user_id: "liq-01"
              captures: { acct_id: $.data.id }
            - call: "POST /participants/${pa_id}/attestation"
              payload: { attestation_document_reference: "ATT-ALPHA-2026-08" }
              as: ParticipantAdmin
              as_user_id: "${pa_id}"
            - call: "POST /participants/${pa_id}/certification-window"
              payload: { certification_test_suite_version: "CERT-2026.2" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants/${pa_id}/certification-results"
              payload: { outcome: "PASS" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants/${pa_id}/activation"
              payload: { go_live_business_date: "2026-08-03" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { pa_v: $.data.version }
            - call: "POST /segment-policies"
              payload: { participant_id: "${pa_id}", segment: "CORPORATE", per_transaction_limit_cents: 250000000, daily_aggregate_limit_cents: 500000000, rolling_window_count_limit: 5, rolling_window_amount_limit_cents: 400000000, effective_from: "2026-08-01T00:00:00Z", expected_participant_version: "${pa_v}" }
              as: ParticipantAdmin
              as_user_id: "${pa_id}"
              captures: { pol_id: $.data.id }
            - call: "POST /customer-accounts"
              payload: { participant_id: "${pa_id}", segment: "CORPORATE", account_reference: "CUST-ALPHA-0001", fraud_risk_baseline: 25 }
              as: ParticipantAdmin
              as_user_id: "${pa_id}"
              captures: { ca_id: $.data.id }
            - call: "POST /settlement-cycles"
              payload: { business_date: "2026-08-03" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { cyc_id: $.data.id }
            - call: "GET /position-accounts/${acct_id}"
              payload: {}
              as: PaymentOperator
              as_user_id: "ops-alpha-01"
              captures: { acct_v1: $.data.version }
            - call: "POST /credit-transfers"
              payload: { originator_participant_id: "${pa_id}", customer_account_id: "${ca_id}", receiver_routing_number: "021000089", amount_cents: 250000000, expected_position_account_version: "${acct_v1}" }
              as: PaymentOperator
              as_user_id: "ops-alpha-01"
              captures: { t1_id: $.data.id, t1_score: $.data.fraud_score }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T13:10:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "GET /position-accounts/${acct_id}"
              payload: {}
              as: PaymentOperator
              as_user_id: "ops-alpha-01"
              captures: { acct_v2: $.data.version }
            - call: "POST /credit-transfers"
              payload: { originator_participant_id: "${pa_id}", customer_account_id: "${ca_id}", receiver_routing_number: "021000089", amount_cents: 200000, expected_position_account_version: "${acct_v2}" }
              as: PaymentOperator
              as_user_id: "ops-alpha-01"
              captures: { t2_id: $.data.id }
            - call: "POST /credit-transfers/${t2_id}/acceptance"
              payload: {}
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /credit-transfers/${t2_id}/settlement"
              payload: {}
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "GET /credit-transfers/${t1_id}/fraud-reviews"
              payload: {}
              as: FraudReviewer
              as_user_id: "reviewer-01"
              captures: { fr_id: "$.data[0].id", fr_origin_score: "$.data[0].score_at_origination" }
            - call: "POST /fraud-reviews/${fr_id}/assignment"
              payload: {}
              as: FraudReviewer
              as_user_id: "reviewer-01"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T13:20:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
          trigger:
            - call: "POST /fraud-reviews/${fr_id}/decision"
              payload: { decision: "RELEASE", decision_rationale: "Beneficiary confirmed by treasury callback." }
              as: FraudReviewer
              as_user_id: "reviewer-01"
              captures: { final_score: $.data.final_fraud_score }
          assert:
            - "CreditTransfer.${t1_id}.fraud_score == 63"
            - "FraudReview.${fr_id}.score_at_origination == 63"
            - "FraudReview.${fr_id}.final_fraud_score == 50"
            - "FraudReview.${fr_id}.final_fraud_score != FraudReview.${fr_id}.score_at_origination"
            - "FraudReview.${fr_id}.status == RELEASED"
            - "CreditTransfer.${t1_id}.clearing_status == INITIATED"
            - "CreditTransfer.${t1_id}.fraud_score is still 63 after the decision (the origination value is frozen, not recomputed)"
            - "CreditTransfer.${t2_id}.clearing_status == SETTLED"

      - name: reconciliation_variance_provisional_vs_final_diverge
        grounds:
          - calculations.reconciliation_variance
          - calculations.intraday_liquidity_access_fee
          - entities.ReconciliationRun.fields.rail_net_position_cents
          - entities.ReconciliationRun.fields.variance_cents
          - entities.ReconciliationRun.fields.fee_component_cents
          - state_machines.SettlementCycle.CUTOFF_to_RECONCILING
        distinguishing_aspect: |
          This dual variant lives in the ACCOUNTING domain, not the risk domain: PROVISIONAL
          admits clearing_status IN {ACCEPTED, SETTLED} and zeroes the fee component, FINAL
          admits SETTLED only and nets the FEE_DEBIT entries, so the same stored rows yield
          rail_net_position_cents -280,000,000 versus -250,250,000 and opposite outcomes
          (OUT_OF_BALANCE versus BALANCED) against one identical core_deposit_total_cents.
        test_recipe:
          setup:
            - "Alpha National Bank is LIVE with a position account holding 1,200,000,000 cents (warning 1,100,000,000 / critical 1,000,000,000 / floor 200,000,000)."
            - "A CORPORATE policy with per-transaction limit 250,000,000 and customer account CUST-ALPHA-0001 (baseline 20) exist; settlement cycle 2026-08-03 is OPEN."
            - "Transfer T1 for 250,000,000 is created at 13:00 and settles at 13:10; transfer T2 for 30,000,000 to the same beneficiary is created at 13:05 and is only ACCEPTED, never settled."
            - "Cutoff is taken at 13:20, assessing an access fee of 250,000 cents as a FEE_DEBIT on business date 2026-08-03."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T13:00:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants"
              payload: { legal_name: "Alpha National Bank", routing_number: "021000021", settlement_agent_reference: "SA-ALPHA-01", participation_model: "SEND_AND_RECEIVE" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { pa_id: $.data.id }
            - call: "POST /position-accounts"
              payload: { participant_id: "${pa_id}", opening_balance_cents: 1200000000, warning_threshold_cents: 1100000000, critical_threshold_cents: 1000000000, floor_cents: 200000000 }
              as: LiquidityOfficer
              as_user_id: "liq-01"
              captures: { acct_id: $.data.id }
            - call: "POST /participants/${pa_id}/attestation"
              payload: { attestation_document_reference: "ATT-ALPHA-2026-08" }
              as: ParticipantAdmin
              as_user_id: "${pa_id}"
            - call: "POST /participants/${pa_id}/certification-window"
              payload: { certification_test_suite_version: "CERT-2026.2" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants/${pa_id}/certification-results"
              payload: { outcome: "PASS" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants/${pa_id}/activation"
              payload: { go_live_business_date: "2026-08-03" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { pa_v: $.data.version }
            - call: "POST /segment-policies"
              payload: { participant_id: "${pa_id}", segment: "CORPORATE", per_transaction_limit_cents: 250000000, daily_aggregate_limit_cents: 500000000, rolling_window_count_limit: 5, rolling_window_amount_limit_cents: 400000000, effective_from: "2026-08-01T00:00:00Z", expected_participant_version: "${pa_v}" }
              as: ParticipantAdmin
              as_user_id: "${pa_id}"
            - call: "POST /customer-accounts"
              payload: { participant_id: "${pa_id}", segment: "CORPORATE", account_reference: "CUST-ALPHA-0001", fraud_risk_baseline: 20 }
              as: ParticipantAdmin
              as_user_id: "${pa_id}"
              captures: { ca_id: $.data.id }
            - call: "POST /settlement-cycles"
              payload: { business_date: "2026-08-03" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { cyc_id: $.data.id }
            - call: "GET /position-accounts/${acct_id}"
              payload: {}
              as: PaymentOperator
              as_user_id: "ops-alpha-01"
              captures: { acct_v1: $.data.version }
            - call: "POST /credit-transfers"
              payload: { originator_participant_id: "${pa_id}", customer_account_id: "${ca_id}", receiver_routing_number: "021000089", amount_cents: 250000000, expected_position_account_version: "${acct_v1}" }
              as: PaymentOperator
              as_user_id: "ops-alpha-01"
              captures: { t1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T13:05:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "GET /position-accounts/${acct_id}"
              payload: {}
              as: PaymentOperator
              as_user_id: "ops-alpha-01"
              captures: { acct_v2: $.data.version }
            - call: "POST /credit-transfers"
              payload: { originator_participant_id: "${pa_id}", customer_account_id: "${ca_id}", receiver_routing_number: "021000089", amount_cents: 30000000, expected_position_account_version: "${acct_v2}" }
              as: PaymentOperator
              as_user_id: "ops-alpha-01"
              captures: { t2_id: $.data.id }
            - call: "POST /credit-transfers/${t2_id}/acceptance"
              payload: {}
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /credit-transfers/${t1_id}/acceptance"
              payload: {}
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T13:10:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /credit-transfers/${t1_id}/settlement"
              payload: {}
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T13:20:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /settlement-cycles/${cyc_id}/cutoff"
              payload: {}
              as: NetworkOperator
              as_user_id: "netops-01"
          trigger:
            - call: "POST /reconciliation-runs"
              payload: { settlement_cycle_id: "${cyc_id}", participant_id: "${pa_id}", variant: "PROVISIONAL", core_deposit_total_cents: -250250000 }
              as: CoreBankingSystem
              as_user_id: "core-alpha-01"
              captures: { prov_id: $.data.id, prov_net: $.data.rail_net_position_cents }
            - call: "POST /reconciliation-runs"
              payload: { settlement_cycle_id: "${cyc_id}", participant_id: "${pa_id}", variant: "FINAL", core_deposit_total_cents: -250250000 }
              as: CoreBankingSystem
              as_user_id: "core-alpha-01"
              captures: { final_id: $.data.id, final_net: $.data.rail_net_position_cents }
          assert:
            - "SettlementCycle.${cyc_id}.assessed_fee_total_cents == 250000"
            - "ReconciliationRun.${prov_id}.rail_net_position_cents == -280000000"
            - "ReconciliationRun.${prov_id}.fee_component_cents == 0"
            - "ReconciliationRun.${prov_id}.variance_cents == 29750000"
            - "ReconciliationRun.${prov_id}.outcome == OUT_OF_BALANCE"
            - "ReconciliationRun.${prov_id}.included_transfer_count == 2"
            - "ReconciliationRun.${final_id}.rail_net_position_cents == -250250000"
            - "ReconciliationRun.${final_id}.fee_component_cents == -250000"
            - "ReconciliationRun.${final_id}.variance_cents == 0"
            - "ReconciliationRun.${final_id}.outcome == BALANCED"
            - "ReconciliationRun.${final_id}.included_transfer_count == 1"
            - "ReconciliationRun.${prov_id}.revision == 1 and ReconciliationRun.${final_id}.revision == 1"
            - "SettlementCycle.${cyc_id}.status == RECONCILING"

  - rule_id: combinatorial_formula
    instances:
      - name: fraud_score_multi_term_combination_with_segment_multiplier
        grounds:
          - calculations.fraud_score
          - calculations.velocity_window_usage
          - entities.CustomerAccount.fields.fraud_risk_baseline
          - entities.CustomerSegmentPolicy.fields.rolling_window_count_limit
          - entities.CreditTransfer.fields.fraud_reason_codes
        distinguishing_aspect: |
          Mode (a) combinatorial: four independent inputs (baseline 20, amount band capped at 10
          units, 60-minute velocity count 4 above a free allowance of 3, and the new-beneficiary
          bonus) are summed and only then scaled by the CORPORATE multiplier 1.10 and clamped at
          100, giving exactly 62 - a value no single term or pairwise subset can produce, and one
          that changes if the multiplier is applied before the caps.
        test_recipe:
          setup:
            - "Alpha National Bank is LIVE with a position account holding 1,200,000,000 cents (warning 1,100,000,000 / critical 1,000,000,000 / floor 200,000,000)."
            - "CORPORATE policy: per-transaction 250,000,000, daily aggregate 500,000,000, rolling count limit 5, rolling amount limit 400,000,000, effective from 2026-08-01."
            - "Customer account CUST-ALPHA-0001 is CORPORATE with fraud_risk_baseline 20."
            - "Four small transfers of 300,000 cents each are created at 13:00, 13:05, 13:10 and 13:15 and left INITIATED, so the 60-minute window count is exactly 4 when the fifth is scored at 13:20."
            - "No transfer to receiver routing 021000089 has ever settled for this customer account, so the beneficiary is still new."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T13:00:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants"
              payload: { legal_name: "Alpha National Bank", routing_number: "021000021", settlement_agent_reference: "SA-ALPHA-01", participation_model: "SEND_AND_RECEIVE" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { pa_id: $.data.id }
            - call: "POST /position-accounts"
              payload: { participant_id: "${pa_id}", opening_balance_cents: 1200000000, warning_threshold_cents: 1100000000, critical_threshold_cents: 1000000000, floor_cents: 200000000 }
              as: LiquidityOfficer
              as_user_id: "liq-01"
              captures: { acct_id: $.data.id }
            - call: "POST /participants/${pa_id}/attestation"
              payload: { attestation_document_reference: "ATT-ALPHA-2026-08" }
              as: ParticipantAdmin
              as_user_id: "${pa_id}"
            - call: "POST /participants/${pa_id}/certification-window"
              payload: { certification_test_suite_version: "CERT-2026.2" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants/${pa_id}/certification-results"
              payload: { outcome: "PASS" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants/${pa_id}/activation"
              payload: { go_live_business_date: "2026-08-03" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { pa_v: $.data.version }
            - call: "POST /segment-policies"
              payload: { participant_id: "${pa_id}", segment: "CORPORATE", per_transaction_limit_cents: 250000000, daily_aggregate_limit_cents: 500000000, rolling_window_count_limit: 5, rolling_window_amount_limit_cents: 400000000, effective_from: "2026-08-01T00:00:00Z", expected_participant_version: "${pa_v}" }
              as: ParticipantAdmin
              as_user_id: "${pa_id}"
            - call: "POST /customer-accounts"
              payload: { participant_id: "${pa_id}", segment: "CORPORATE", account_reference: "CUST-ALPHA-0001", fraud_risk_baseline: 20 }
              as: ParticipantAdmin
              as_user_id: "${pa_id}"
              captures: { ca_id: $.data.id }
            - call: "POST /settlement-cycles"
              payload: { business_date: "2026-08-03" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "GET /position-accounts/${acct_id}"
              payload: {}
              as: PaymentOperator
              as_user_id: "ops-alpha-01"
              captures: { acct_v1: $.data.version }
            - call: "POST /credit-transfers"
              payload: { originator_participant_id: "${pa_id}", customer_account_id: "${ca_id}", receiver_routing_number: "021000089", amount_cents: 300000, expected_position_account_version: "${acct_v1}" }
              as: PaymentOperator
              as_user_id: "ops-alpha-01"
              captures: { p1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T13:05:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "GET /position-accounts/${acct_id}"
              payload: {}
              as: PaymentOperator
              as_user_id: "ops-alpha-01"
              captures: { acct_v2: $.data.version }
            - call: "POST /credit-transfers"
              payload: { originator_participant_id: "${pa_id}", customer_account_id: "${ca_id}", receiver_routing_number: "021000089", amount_cents: 300000, expected_position_account_version: "${acct_v2}" }
              as: PaymentOperator
              as_user_id: "ops-alpha-01"
              captures: { p2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T13:10:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "GET /position-accounts/${acct_id}"
              payload: {}
              as: PaymentOperator
              as_user_id: "ops-alpha-01"
              captures: { acct_v3: $.data.version }
            - call: "POST /credit-transfers"
              payload: { originator_participant_id: "${pa_id}", customer_account_id: "${ca_id}", receiver_routing_number: "021000089", amount_cents: 300000, expected_position_account_version: "${acct_v3}" }
              as: PaymentOperator
              as_user_id: "ops-alpha-01"
              captures: { p3_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T13:15:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "GET /position-accounts/${acct_id}"
              payload: {}
              as: PaymentOperator
              as_user_id: "ops-alpha-01"
              captures: { acct_v4: $.data.version }
            - call: "POST /credit-transfers"
              payload: { originator_participant_id: "${pa_id}", customer_account_id: "${ca_id}", receiver_routing_number: "021000089", amount_cents: 300000, expected_position_account_version: "${acct_v4}" }
              as: PaymentOperator
              as_user_id: "ops-alpha-01"
              captures: { p4_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T13:20:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "GET /position-accounts/${acct_id}"
              payload: {}
              as: PaymentOperator
              as_user_id: "ops-alpha-01"
              captures: { acct_v5: $.data.version }
          trigger:
            - call: "POST /credit-transfers"
              payload: { originator_participant_id: "${pa_id}", customer_account_id: "${ca_id}", receiver_routing_number: "021000089", amount_cents: 250000000, expected_position_account_version: "${acct_v5}" }
              as: PaymentOperator
              as_user_id: "ops-alpha-01"
              captures: { t5_id: $.data.id, t5_score: $.data.fraud_score }
          assert:
            - "CreditTransfer.${t5_id}.fraud_score == 62"
            - "CreditTransfer.${t5_id}.clearing_status == FRAUD_HOLD"
            - "CreditTransfer.${t5_id}.fraud_reason_codes == ['AMOUNT_BAND', 'VELOCITY_BURST', 'NEW_BENEFICIARY']"
            - "CreditTransfer.${p1_id}.fraud_score == 42 (baseline 20 + amount band 6 + velocity 0 + new beneficiary 12, scaled by 1.10)"
            - "CreditTransfer.${p4_id}.fraud_score == 42"
            - "PrefundedPositionAccount.${acct_id}.reserved_cents == 251200000"
            - "PrefundedPositionAccount.${acct_id}.available_cents == 948800000"

      - name: intraday_access_fee_rounds_per_transfer_then_sums
        grounds:
          - calculations.intraday_liquidity_access_fee
          - entities.SettlementCycle.fields.assessed_fee_total_cents
          - entities.LiquidityLedgerEntry.fields.entry_type
          - state_machines.SettlementCycle.OPEN_to_CUTOFF
        distinguishing_aspect: |
          Mode (b) combinatorial: the fee is a multi-step calculation whose ROUNDING ORDER is the
          whole point - rounding each of 1,500 / 2,500 / 3,500 cents at 10 bps half-up gives
          2 + 3 + 4 = 9 cents, while summing the amounts first and rounding once gives 8 cents,
