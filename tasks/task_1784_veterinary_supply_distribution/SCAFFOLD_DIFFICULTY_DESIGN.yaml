          lot_number: LOT-M2
          expiry_date: '2027-06-30'
          qty_on_hand: 10
        as: SupplyChainPlanner
      - call: POST /vet/orders
        payload:
          clinic_id: ${c_id}
          ship_to_address: 12 Bridle Blvd
          delivery_window_start: '2026-08-10T13:00:00Z'
          delivery_window_end: '2026-08-10T15:00:00Z'
          lines:
          - product_id: ${p_low}
            qty_requested: 1
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          o_low: $.data.id
      - call: POST /vet/orders
        payload:
          clinic_id: ${c_id}
          ship_to_address: 12 Bridle Blvd
          delivery_window_start: '2026-08-10T13:00:00Z'
          delivery_window_end: '2026-08-10T15:00:00Z'
          lines:
          - product_id: ${p_exact}
