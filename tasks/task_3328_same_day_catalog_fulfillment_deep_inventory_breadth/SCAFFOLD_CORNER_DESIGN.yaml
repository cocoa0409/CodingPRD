            - "GET /items?dc_id=${dc_id} returns exactly 1 row, the item that has a stock row at that DC"
            - "GET /items?long_tail=true returns exactly 1 row, CatalogItem.${bronze_id}"
            - "GET /items?q=bronze returns exactly 1 row"
            - "every returned row carries unit_price_cents and catalog_status"

      - name: confirm_cutoff_response_is_the_shipment_not_the_order
        claim_type: Conditional Action
        grounds:
          - endpoints.POST_/orders/{id}/confirm_cutoff
          - entities.Shipment
          - state_machines.Shipment.STAGED_to_CUTOFF_CONFIRMED
