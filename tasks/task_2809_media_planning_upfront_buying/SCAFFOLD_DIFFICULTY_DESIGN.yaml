  - rule_id: transitive_cascade
    instances:
      - name: placement_overcommit_cascades_four_links_and_revokes_plan_approval
        grounds:
          - endpoints[POST /upfront/buys/{buyId}/place]
          - state_machines.Buy.PENDING_PLACEMENT_to_PLACED
          - state_machines.ChannelAllocation.LOCKED_to_DRAFT
          - state_machines.Campaign.APPROVED_to_REVISION_REQUIRED
          - entities.ChannelAllocation.fields.committed_cents
          - entities.ChannelAllocation.fields.posture
          - entities.Campaign.fields.plan_posture
          - validations[priority 17]
          - errors.ERR_CAMPAIGN_PLAN_NOT_APPROVED
        distinguishing_aspect: |
          One place call walks four links: committed_cents 0 -> 68,640,000, allocation
          posture WITHIN_PLAN -> OVERCOMMITTED, Campaign.plan_posture -> REPLAN_REQUIRED,
          then plan_status APPROVED -> REVISION_REQUIRED with both LOCKED allocations
          pushed back to DRAFT. Link 4 is observable only downstream: accepting the second,
          already-countered negotiation now fails with ERR_CAMPAIGN_PLAN_NOT_APPROVED, so an
          implementation that stops at link 2 or 3 is caught even though the placed buy
          itself looks identical. The buy stays inside the campaign budget (68,640,000 of
          100,000,000), so no budget validation fires.
        test_recipe:
          setup:
            - "an APPROVED 100,000,000 cent campaign with a 60/40 LINEAR_TV / DIGITAL_VIDEO split, so allocated_cents are 60,000,000 and 40,000,000 and both allocations are LOCKED"
            - "a PENDING_PLACEMENT linear buy of 30,000,000 impressions at CPM 2200: net 66,000,000, commission rate 0.0400, gross 68,640,000 - above its allocation's 60,000,000 but well inside the campaign budget"
            - "one 30-unit line at 2,200,000 cents projecting exactly the guaranteed 30,000,000 impressions, so coverage is satisfied"
            - "a second negotiation on the DIGITAL_VIDEO allocation left in SELLER_COUNTER, ready to be accepted"
          setup_api_calls:
            - call: "POST /upfront/advertisers"
              payload: { name: "Vantage Wireless", category_code: "TELECOM", credit_limit_cents: 200000000, payment_terms_days: 30, sequential_liability_enabled: true }
