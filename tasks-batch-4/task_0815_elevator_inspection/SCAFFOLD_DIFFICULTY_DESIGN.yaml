            - call: "POST /inspections"
              payload: { device_id: "${devA}", type: "ANNUAL", scheduled_start_period: 10, scheduled_end_period: 12 }
              as: Registrar
              captures: { ins1: "$.data.id" }
            - call: "POST /inspections/${ins1}/assign"
