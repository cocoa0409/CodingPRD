          trigger:
            - call: "POST /elevator-program/downtime-windows"
              payload: { car_id: "${m1_id}", window_type: "REPAIR", window_start: "2026-09-10T10:00:00Z", window_end: "2026-09-10T14:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { err_id2: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err_id2} == \"ERR_CAR_RED_TAGGED\""
            - "${err_id2} != \"ERR_DOWNTIME_WINDOW_CONFLICT\""
            - "ElevatorCar.${m1_id}.compliance_state == \"RED_TAGGED\""
            - "ElevatorCar.${m1_id}.scheduled_downtime_minutes == 240"
            - "ServiceContract.${km_id}.status == \"ACTIVE\""

