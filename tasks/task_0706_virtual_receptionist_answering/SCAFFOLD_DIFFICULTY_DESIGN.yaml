              as_user_id: "${acct_id}"
            - call: "POST /va/receptionists"
              payload: { display_name: "Off", languages: ["EN"], max_concurrent_calls: 5 }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            # receptionist deliberately left OFFLINE -> empty candidate set
            - call: "POST /va/calls"
              payload: { account_id: "${acct_id}", caller_id: "5550001", requested_language: "EN" }
              as: Receptionist
              as_user_id: "${rec_id}"
              captures: { call_id: $.data.id, h0: $.data.handling_status }
          trigger:
            - call: "POST /va/calls/${call_id}/answer"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
              captures: { h1: $.data.handling_status, ans: $.data.answered_by_receptionist_id }
          assert:
            - "Call.${call_id}.handling_status at intake == \"RINGING\" (business hours)"
            - "answer response status == 200 (no error on empty pool)"
            - "Call.${call_id}.handling_status after answer == \"OVERFLOW\""
            - "Call.${call_id}.answered_by_receptionist_id is null after OVERFLOW"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      # ---- Instance 1: Call answer depends on ClientAccount.status (Call -> ClientAccount pair)
      - name: answer_blocked_when_account_suspended
        grounds:
          - state_machines.Call.handling_status.RINGING_to_ANSWERED
          - state_machines.ClientAccount.status.ACTIVE_to_SUSPENDED
          - validations[priority=7]
          - errors[ERR_ACCOUNT_SUSPENDED]
        distinguishing_aspect: |
          Call's RINGING -> ANSWERED transition depends on a DIFFERENT entity's
          state: ClientAccount.status must not be SUSPENDED. Entity pair:
          Call -> ClientAccount.
        test_recipe:
          setup:
            - "Account SUSPENDED via a hard-cap-crossing completed call. A fresh business-hours RINGING call exists on that account with an AVAILABLE EN receptionist."
          setup_api_calls:
            - call: "POST /va/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /va/service-plans"
              payload: { name: "PMcap3", billing_model: "PER_MINUTE", base_fee_cents: 0, overage_rate_cents: 100, overage_tier2_rate_cents: 100, hard_cap_overage_cents: 300, included_minutes: 0, overage_tier2_threshold: 100 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /va/accounts"
              payload: { business_name: "Nu", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /va/call-scripts"
              payload: { account_id: "${acct_id}", greeting_en: "hi", business_open_minute: 0, business_close_minute: 1440 }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { script_id: $.data.id }
            - call: "POST /va/call-scripts/${script_id}/publish"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "POST /va/receptionists"
              payload: { display_name: "Rina", languages: ["EN"], max_concurrent_calls: 5 }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /va/receptionists/${rec_id}/availability-windows"
              payload: { start_minute: 0, end_minute: 1440 }
              as: Receptionist
              as_user_id: "${rec_id}"
            - call: "POST /va/receptionists/${rec_id}/go-online"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
            # billed call to suspend
            - call: "POST /va/calls"
              payload: { account_id: "${acct_id}", caller_id: "5550001", requested_language: "EN" }
              as: Receptionist
              as_user_id: "${rec_id}"
              captures: { biller: $.data.id }
            - call: "POST /va/calls/${biller}/answer"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
            - call: "POST /va/calls/${biller}/start"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
            - call: "POST /va/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T10:02:01Z" }
              as: PlatformAdmin
            - call: "POST /va/calls/${biller}/wrap"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
            - call: "POST /va/calls/${biller}/complete"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
            # fresh RINGING call on now-SUSPENDED account
            - call: "POST /va/calls"
              payload: { account_id: "${acct_id}", caller_id: "5559999", requested_language: "EN" }
              as: Receptionist
              as_user_id: "${rec_id}"
              captures: { target_call: $.data.id }
          trigger:
            - call: "POST /va/calls/${target_call}/answer"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
              captures: { err: $.data.error_id }
          assert:
            - "ClientAccount.${acct_id}.status == \"SUSPENDED\""
            - "answer response status == 409"
            - "answer error_id == \"ERR_ACCOUNT_SUSPENDED\""

      # ---- Instance 2: Appointment confirm depends on CalendarSlot.status (Appointment -> CalendarSlot pair)
      - name: confirm_blocked_when_slot_closed
        grounds:
          - state_machines.Appointment.status.REQUESTED_to_CONFIRMED
          - state_machines.CalendarSlot
          - entities.CalendarSlot.fields.status
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Appointment's REQUESTED -> CONFIRMED transition depends on a DIFFERENT
          entity pair than instance 1: CalendarSlot.status must be OPEN. With the
          slot CLOSED the confirm precondition fails. Entity pair:
          Appointment -> CalendarSlot.
        test_recipe:
          setup:
            - "Account ACTIVE; OPEN slot capacity 1; one REQUESTED appointment booked into it; then the slot is CLOSED before confirm."
          setup_api_calls:
            - call: "POST /va/_clock/set_current_utc"
