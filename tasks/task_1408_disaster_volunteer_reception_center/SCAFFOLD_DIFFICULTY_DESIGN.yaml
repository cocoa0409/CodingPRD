# =============================================================================
# Section 1.8: Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x 2 instances = 18 instances.
# All chains start from empty DB; every instance pins the logical clock first.
# Opaque-role as_user_id literals ("intake-1", "vet-1", "site-1", "risk-1",
# "logi-1", "mgr-1", "agency-1") are pinned only where SoD or audit identity
# matters; Volunteer-role calls always pass as_user_id: ${...}.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1: dual_variant_calc — two dual-variant calculations on DIFFERENT
  # entity domains (fiscal rollup on Incident/HourEntry vs risk scoring on
  # Volunteer/RiskReport).
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: cost_share_provisional_includes_unverified_but_verified_excludes_it
        grounds:
          - calculations.incident_cost_share_rollup
          - calculations.entry_cost_share_value
          - entities.Incident.fields.provisional_cost_share_cents
          - entities.Incident.fields.verified_cost_share_cents
        distinguishing_aspect: |
          Fiscal domain variant pair: with identical raw data (one VERIFIED 8.00h
          STANDARD entry worth 22400 cents and one SUBMITTED 3.75h STANDARD entry
          worth 10500 cents), the provisional variant reports 32900 while the
          verified variant reports 22400 — same inputs, different totals, because
          the two variants apply different status filters to the input set.
        test_recipe:
          setup:
            - "Incident ACTIVE with PPE stock; volunteer fully vetted to READY (credential GENERAL_LABOR/STANDARD expiring 2026-09-01, BG cleared, briefing refreshed 2026-08-09, waiver signed)"
            - "Assignment A on shift S1 (2026-08-10 08:00-16:00, 8.00h) COMPLETED with HourEntry E1 8.00h VERIFIED"
            - "Assignment B on shift S2 (2026-08-11 08:00-11:45, 3.75h) COMPLETED with HourEntry E2 3.75h left SUBMITTED"
          setup_api_calls:
            - { call: "POST /vrc/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VRCManager }
            - { call: "POST /vrc/incidents", payload: { name: "Flood Alpha", ppe_stock: { GLOVES: 10, MASK: 10, HARD_HAT: 5, VEST: 5, GOGGLES: 5 } }, as: VRCManager, captures: { inc: $.data.id } }
            - { call: "POST /vrc/incidents/${inc}/activate", payload: {}, as: VRCManager }
            - { call: "POST /vrc/volunteers", payload: { incident_id: "${inc}", full_name: "Ann Able", phone: "555-0101", email: "ann@x.com", home_locality: "Riverton" }, as: IntakeCoordinator, as_user_id: "intake-1", captures: { vol: $.data.id } }
            - { call: "POST /vrc/credentials", payload: { volunteer_id: "${vol}", skill_code: "GENERAL_LABOR", credential_class: "STANDARD", expires_at: "2026-09-01T00:00:00Z" }, as: IntakeCoordinator, captures: { cred: $.data.id } }
            - { call: "POST /vrc/volunteers/${vol}/submit-for-vetting", payload: {}, as: IntakeCoordinator }
            - { call: "POST /vrc/background-checks", payload: { volunteer_id: "${vol}" }, as: VettingOfficer, captures: { bg: $.data.id } }
            - { call: "POST /vrc/background-checks/${bg}/clear", payload: {}, as: VettingOfficer, as_user_id: "vet-1" }
            - { call: "POST /vrc/credentials/${cred}/verify", payload: {}, as: VettingOfficer, as_user_id: "vet-1" }
            - { call: "POST /vrc/clearances", payload: { volunteer_id: "${vol}", clearance_type: "SAFETY_BRIEFING" }, as: IntakeCoordinator }
            - { call: "POST /vrc/clearances", payload: { volunteer_id: "${vol}", clearance_type: "LIABILITY_WAIVER" }, as: IntakeCoordinator }
            - { call: "POST /vrc/volunteers/${vol}/mark-ready", payload: {}, as: IntakeCoordinator }
            - { call: "POST /vrc/support-requests", payload: { incident_id: "${inc}", requesting_agency: "County Public Works", site_name: "North Depot", required_skill: "GENERAL_LABOR", min_credential_class: "STANDARD", headcount_needed: 1, criticality: "STANDARD", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T20:00:00Z" }, as: AgencyCoordinator, captures: { req1: $.data.id } }
            - { call: "POST /vrc/support-requests/${req1}/publish", payload: {}, as: AgencyCoordinator }
            - { call: "POST /vrc/shifts", payload: { incident_id: "${inc}", site_name: "North Depot", hazard_level: "GREEN", start_at: "2026-08-10T08:00:00Z", end_at: "2026-08-10T16:00:00Z", capacity: 3 }, as: LogisticsCoordinator, captures: { sh1: $.data.id } }
            - { call: "POST /vrc/shifts/${sh1}/open-roster", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /vrc/assignments", payload: { volunteer_id: "${vol}", support_request_id: "${req1}", site_shift_id: "${sh1}" }, as: IntakeCoordinator, captures: { asg1: $.data.id } }
            - { call: "POST /vrc/assignments/${asg1}/accept", payload: {}, as: Volunteer, as_user_id: "${vol}" }
            - { call: "POST /vrc/assignments/${asg1}/confirm", payload: {}, as: IntakeCoordinator }
            - { call: "POST /vrc/ppe-issuances", payload: { volunteer_id: "${vol}", item_type: "GLOVES", quantity: 1 }, as: LogisticsCoordinator }
            - { call: "POST /vrc/_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T00:00:00Z" }, as: VRCManager }
            - { call: "POST /vrc/clearances", payload: { volunteer_id: "${vol}", clearance_type: "SAFETY_BRIEFING" }, as: IntakeCoordinator }
            - { call: "POST /vrc/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: VRCManager }
            - { call: "POST /vrc/assignments/${asg1}/check-in", payload: {}, as: SiteSupervisor, as_user_id: "site-1" }
            - { call: "POST /vrc/assignments/${asg1}/complete", payload: {}, as: SiteSupervisor, as_user_id: "site-1" }
            - { call: "POST /vrc/hour-entries", payload: { assignment_id: "${asg1}", work_date: "2026-08-10", hours: 8.0 }, as: Volunteer, as_user_id: "${vol}", captures: { e1: $.data.id } }
            - { call: "POST /vrc/hour-entries/${e1}/verify", payload: {}, as: SiteSupervisor, as_user_id: "site-1" }
            - { call: "POST /vrc/support-requests", payload: { incident_id: "${inc}", requesting_agency: "County Public Works", site_name: "North Depot", required_skill: "GENERAL_LABOR", min_credential_class: "STANDARD", headcount_needed: 1, criticality: "STANDARD", window_start: "2026-08-11T06:00:00Z", window_end: "2026-08-11T20:00:00Z" }, as: AgencyCoordinator, captures: { req2: $.data.id } }
            - { call: "POST /vrc/support-requests/${req2}/publish", payload: {}, as: AgencyCoordinator }
            - { call: "POST /vrc/shifts", payload: { incident_id: "${inc}", site_name: "North Depot", hazard_level: "GREEN", start_at: "2026-08-11T08:00:00Z", end_at: "2026-08-11T11:45:00Z", capacity: 3 }, as: LogisticsCoordinator, captures: { sh2: $.data.id } }
            - { call: "POST /vrc/shifts/${sh2}/open-roster", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /vrc/assignments", payload: { volunteer_id: "${vol}", support_request_id: "${req2}", site_shift_id: "${sh2}" }, as: IntakeCoordinator, captures: { asg2: $.data.id } }
            - { call: "POST /vrc/assignments/${asg2}/accept", payload: {}, as: Volunteer, as_user_id: "${vol}" }
            - { call: "POST /vrc/assignments/${asg2}/confirm", payload: {}, as: IntakeCoordinator }
            - { call: "POST /vrc/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T08:00:00Z" }, as: VRCManager }
            - { call: "POST /vrc/assignments/${asg2}/check-in", payload: {}, as: SiteSupervisor, as_user_id: "site-1" }
            - { call: "POST /vrc/assignments/${asg2}/complete", payload: {}, as: SiteSupervisor, as_user_id: "site-1" }
            - { call: "POST /vrc/hour-entries", payload: { assignment_id: "${asg2}", work_date: "2026-08-11", hours: 3.75 }, as: Volunteer, as_user_id: "${vol}" }
          trigger:
            - { call: "GET /vrc/incidents/${inc}", payload: {}, as: VRCManager, captures: { prov: $.data.provisional_cost_share_cents, ver: $.data.verified_cost_share_cents, fed: $.data.federal_share_cents, st: $.data.state_share_cents, loc: $.data.local_share_cents } }
          assert:
            - "Incident.${inc}.provisional_cost_share_cents == 32900 (22400 VERIFIED + 10500 SUBMITTED)"
            - "Incident.${inc}.verified_cost_share_cents == 22400 (SUBMITTED entry excluded)"
            - "Incident.${inc}.federal_share_cents == 16800"
            - "Incident.${inc}.state_share_cents == 2800"
            - "Incident.${inc}.local_share_cents == 2800"
            - "captured prov != captured ver (32900 != 22400): identical raw entries, divergent variant outputs"

      - name: risk_score_current_decays_to_zero_while_lifetime_persists
        grounds:
          - calculations.volunteer_risk_score
          - entities.Volunteer.fields.current_risk_score
          - entities.Volunteer.fields.lifetime_risk_score
        distinguishing_aspect: |
          Risk domain variant pair (distinct entity domain from the fiscal
          rollup): one substantiated MEDIUM report (15 points, adjudicated
          2026-08-01T00:00:00Z) yields current == 7 at age 216h (half-life step),
          current == 0 at age 721h, while lifetime stays == 15 at both instants.
        test_recipe:
          setup:
            - "Incident ACTIVE; volunteer REGISTERED (no vetting needed); MEDIUM RiskReport substantiated at 2026-08-01T00:00:00Z by risk-1 (reporter site-1)"
          setup_api_calls:
            - { call: "POST /vrc/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VRCManager }
            - { call: "POST /vrc/incidents", payload: { name: "Flood Beta", ppe_stock: { GLOVES: 5, MASK: 5, HARD_HAT: 5, VEST: 5, GOGGLES: 5 } }, as: VRCManager, captures: { inc: $.data.id } }
            - { call: "POST /vrc/incidents/${inc}/activate", payload: {}, as: VRCManager }
            - { call: "POST /vrc/volunteers", payload: { incident_id: "${inc}", full_name: "Bob Baker", phone: "555-0202", email: "bob@x.com", home_locality: "Hillview" }, as: IntakeCoordinator, as_user_id: "intake-1", captures: { vol: $.data.id } }
            - { call: "POST /vrc/risk-reports", payload: { subject_volunteer_id: "${vol}", severity: "MEDIUM", category: "MISCONDUCT", description: "Left staging area without sign-out", occurred_at: "2026-08-01T00:00:00Z" }, as: SiteSupervisor, as_user_id: "site-1", captures: { rep: $.data.id } }
            - { call: "POST /vrc/risk-reports/${rep}/substantiate", payload: {}, as: RiskOfficer, as_user_id: "risk-1" }
          trigger:
            - { call: "POST /vrc/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: VRCManager }
            - { call: "GET /vrc/volunteers/${vol}", payload: {}, as: VRCManager, captures: { cur_mid: $.data.current_risk_score, life_mid: $.data.lifetime_risk_score } }
            - { call: "POST /vrc/_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T01:00:00Z" }, as: VRCManager }
            - { call: "GET /vrc/volunteers/${vol}", payload: {}, as: VRCManager, captures: { cur_end: $.data.current_risk_score, life_end: $.data.lifetime_risk_score } }
          assert:
            - "Volunteer.${vol}.current_risk_score at 2026-08-10T00:00:00Z == 7 (floor(15/2) in the 168h-720h half-life band)"
            - "Volunteer.${vol}.current_risk_score at 2026-08-31T01:00:00Z == 0 (age 721h >= 720h step-off)"
            - "Volunteer.${vol}.lifetime_risk_score == 15 at both instants (never decays)"
            - "captured cur_end (0) != captured life_end (15): identical report history, divergent variant outputs"

  # ---------------------------------------------------------------------------
  # Rule 2: combinatorial_formula — two instances in DIFFERENT modes:
  # (a) multi-input non-linear tiered formula; (b) pinned rounding order.
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: entry_value_overtime_split_with_class_rate (mode a)
        grounds:
          - calculations.entry_cost_share_value
        distinguishing_aspect: |
          Mode (a): a formula with >= 3 inputs (hours, credential-class rate,
          daily OT threshold) and non-linear interaction (conditional min() split
          plus 1.5x multiplier on the excess portion only): 10.50h at ADVANCED
          rate yields 8*4600 + 2.5*4600*1.5 = 54050 cents, not 10.5*4600 = 48300.
        test_recipe:
          setup:
            - "Incident ACTIVE; volunteer READY holding VERIFIED CHAINSAW/ADVANCED credential; request requires CHAINSAW with min_credential_class STANDARD (rate must follow the CREDENTIAL class, not the request minimum)"
            - "Assignment on a 10.50h shift (2026-08-10 08:00-18:30) COMPLETED; entry of 10.50h VERIFIED"
          setup_api_calls:
            - { call: "POST /vrc/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VRCManager }
            - { call: "POST /vrc/incidents", payload: { name: "Wind Gamma", ppe_stock: { GLOVES: 5, MASK: 5, HARD_HAT: 5, VEST: 5, GOGGLES: 5 } }, as: VRCManager, captures: { inc: $.data.id } }
            - { call: "POST /vrc/incidents/${inc}/activate", payload: {}, as: VRCManager }
            - { call: "POST /vrc/volunteers", payload: { incident_id: "${inc}", full_name: "Cara Cruz", phone: "555-0303", email: "cara@x.com", home_locality: "Milltown" }, as: IntakeCoordinator, as_user_id: "intake-1", captures: { vol: $.data.id } }
            - { call: "POST /vrc/credentials", payload: { volunteer_id: "${vol}", skill_code: "CHAINSAW", credential_class: "ADVANCED", expires_at: "2026-09-01T00:00:00Z" }, as: IntakeCoordinator, captures: { cred: $.data.id } }
            - { call: "POST /vrc/volunteers/${vol}/submit-for-vetting", payload: {}, as: IntakeCoordinator }
            - { call: "POST /vrc/background-checks", payload: { volunteer_id: "${vol}" }, as: VettingOfficer, captures: { bg: $.data.id } }
            - { call: "POST /vrc/background-checks/${bg}/clear", payload: {}, as: VettingOfficer, as_user_id: "vet-1" }
            - { call: "POST /vrc/credentials/${cred}/verify", payload: {}, as: VettingOfficer, as_user_id: "vet-1" }
            - { call: "POST /vrc/clearances", payload: { volunteer_id: "${vol}", clearance_type: "SAFETY_BRIEFING" }, as: IntakeCoordinator }
            - { call: "POST /vrc/clearances", payload: { volunteer_id: "${vol}", clearance_type: "LIABILITY_WAIVER" }, as: IntakeCoordinator }
            - { call: "POST /vrc/volunteers/${vol}/mark-ready", payload: {}, as: IntakeCoordinator }
            - { call: "POST /vrc/support-requests", payload: { incident_id: "${inc}", requesting_agency: "County OES", site_name: "Ridge Road", required_skill: "CHAINSAW", min_credential_class: "STANDARD", headcount_needed: 1, criticality: "STANDARD", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T22:00:00Z" }, as: AgencyCoordinator, captures: { req: $.data.id } }
            - { call: "POST /vrc/support-requests/${req}/publish", payload: {}, as: AgencyCoordinator }
            - { call: "POST /vrc/shifts", payload: { incident_id: "${inc}", site_name: "Ridge Road", hazard_level: "AMBER", start_at: "2026-08-10T08:00:00Z", end_at: "2026-08-10T18:30:00Z", capacity: 2 }, as: LogisticsCoordinator, captures: { sh: $.data.id } }
            - { call: "POST /vrc/shifts/${sh}/open-roster", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /vrc/assignments", payload: { volunteer_id: "${vol}", support_request_id: "${req}", site_shift_id: "${sh}" }, as: IntakeCoordinator, captures: { asg: $.data.id } }
            - { call: "POST /vrc/assignments/${asg}/accept", payload: {}, as: Volunteer, as_user_id: "${vol}" }
            - { call: "POST /vrc/assignments/${asg}/confirm", payload: {}, as: IntakeCoordinator }
            - { call: "POST /vrc/ppe-issuances", payload: { volunteer_id: "${vol}", item_type: "HARD_HAT", quantity: 1 }, as: LogisticsCoordinator }
            - { call: "POST /vrc/_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T12:00:00Z" }, as: VRCManager }
            - { call: "POST /vrc/clearances", payload: { volunteer_id: "${vol}", clearance_type: "SAFETY_BRIEFING" }, as: IntakeCoordinator }
            - { call: "POST /vrc/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: VRCManager }
            - { call: "POST /vrc/assignments/${asg}/check-in", payload: {}, as: SiteSupervisor, as_user_id: "site-1" }
            - { call: "POST /vrc/assignments/${asg}/complete", payload: {}, as: SiteSupervisor, as_user_id: "site-1" }
            - { call: "POST /vrc/hour-entries", payload: { assignment_id: "${asg}", work_date: "2026-08-10", hours: 10.5 }, as: Volunteer, as_user_id: "${vol}", captures: { e1: $.data.id, e1_val: $.data.entry_value_cents } }
            - { call: "POST /vrc/hour-entries/${e1}/verify", payload: {}, as: SiteSupervisor, as_user_id: "site-1" }
          trigger:
            - { call: "GET /vrc/incidents/${inc}", payload: {}, as: VRCManager, captures: { ver: $.data.verified_cost_share_cents } }
          assert:
            - "HourEntry.${e1}.entry_value_cents == 54050 (8*4600 + 2.5*4600*1.5 = 36800 + 17250)"
            - "Incident.${inc}.verified_cost_share_cents == 54050"
            - "entry_value_cents != 48300 (10.5*4600 flat-rate misread) and != 72450 (10.5*4600*1.5 all-OT misread)"

      - name: share_split_rounding_local_absorbs_remainder (mode b)
        grounds:
          - calculations.incident_cost_share_rollup
          - entities.Incident.fields.local_share_cents
        distinguishing_aspect: |
          Mode (b): pinned rounding order — per-share round_half_up with the
          local share computed by SUBTRACTION. At verified total 10500 cents,
          federal 7875 + state round(1312.5)=1313 force local == 1312; an
          implementation that rounds local independently yields 1313 and breaks
          the sum (10501 != 10500). Different mode from the tiered-OT instance.
        test_recipe:
          setup:
            - "Incident ACTIVE; volunteer READY with GENERAL_LABOR/STANDARD; one assignment COMPLETED on a 3.75h shift; single entry 3.75h VERIFIED (verified total exactly 10500 cents)"
          setup_api_calls:
            - { call: "POST /vrc/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VRCManager }
            - { call: "POST /vrc/incidents", payload: { name: "Fire Delta", ppe_stock: { GLOVES: 5, MASK: 5, HARD_HAT: 5, VEST: 5, GOGGLES: 5 } }, as: VRCManager, captures: { inc: $.data.id } }
            - { call: "POST /vrc/incidents/${inc}/activate", payload: {}, as: VRCManager }
            - { call: "POST /vrc/volunteers", payload: { incident_id: "${inc}", full_name: "Dan Doyle", phone: "555-0404", email: "dan@x.com", home_locality: "Ashford" }, as: IntakeCoordinator, as_user_id: "intake-1", captures: { vol: $.data.id } }
            - { call: "POST /vrc/credentials", payload: { volunteer_id: "${vol}", skill_code: "GENERAL_LABOR", credential_class: "STANDARD", expires_at: "2026-09-01T00:00:00Z" }, as: IntakeCoordinator, captures: { cred: $.data.id } }
            - { call: "POST /vrc/volunteers/${vol}/submit-for-vetting", payload: {}, as: IntakeCoordinator }
            - { call: "POST /vrc/background-checks", payload: { volunteer_id: "${vol}" }, as: VettingOfficer, captures: { bg: $.data.id } }
            - { call: "POST /vrc/background-checks/${bg}/clear", payload: {}, as: VettingOfficer, as_user_id: "vet-1" }
            - { call: "POST /vrc/credentials/${cred}/verify", payload: {}, as: VettingOfficer, as_user_id: "vet-1" }
            - { call: "POST /vrc/clearances", payload: { volunteer_id: "${vol}", clearance_type: "SAFETY_BRIEFING" }, as: IntakeCoordinator }
            - { call: "POST /vrc/clearances", payload: { volunteer_id: "${vol}", clearance_type: "LIABILITY_WAIVER" }, as: IntakeCoordinator }
            - { call: "POST /vrc/volunteers/${vol}/mark-ready", payload: {}, as: IntakeCoordinator }
            - { call: "POST /vrc/support-requests", payload: { incident_id: "${inc}", requesting_agency: "County OES", site_name: "South Yard", required_skill: "GENERAL_LABOR", min_credential_class: "STANDARD", headcount_needed: 1, criticality: "STANDARD", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T20:00:00Z" }, as: AgencyCoordinator, captures: { req: $.data.id } }
            - { call: "POST /vrc/support-requests/${req}/publish", payload: {}, as: AgencyCoordinator }
            - { call: "POST /vrc/shifts", payload: { incident_id: "${inc}", site_name: "South Yard", hazard_level: "GREEN", start_at: "2026-08-10T08:00:00Z", end_at: "2026-08-10T11:45:00Z", capacity: 2 }, as: LogisticsCoordinator, captures: { sh: $.data.id } }
            - { call: "POST /vrc/shifts/${sh}/open-roster", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /vrc/assignments", payload: { volunteer_id: "${vol}", support_request_id: "${req}", site_shift_id: "${sh}" }, as: IntakeCoordinator, captures: { asg: $.data.id } }
            - { call: "POST /vrc/assignments/${asg}/accept", payload: {}, as: Volunteer, as_user_id: "${vol}" }
            - { call: "POST /vrc/assignments/${asg}/confirm", payload: {}, as: IntakeCoordinator }
            - { call: "POST /vrc/ppe-issuances", payload: { volunteer_id: "${vol}", item_type: "VEST", quantity: 1 }, as: LogisticsCoordinator }
            - { call: "POST /vrc/_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T12:00:00Z" }, as: VRCManager }
            - { call: "POST /vrc/clearances", payload: { volunteer_id: "${vol}", clearance_type: "SAFETY_BRIEFING" }, as: IntakeCoordinator }
            - { call: "POST /vrc/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: VRCManager }
            - { call: "POST /vrc/assignments/${asg}/check-in", payload: {}, as: SiteSupervisor, as_user_id: "site-1" }
            - { call: "POST /vrc/assignments/${asg}/complete", payload: {}, as: SiteSupervisor, as_user_id: "site-1" }
            - { call: "POST /vrc/hour-entries", payload: { assignment_id: "${asg}", work_date: "2026-08-10", hours: 3.75 }, as: Volunteer, as_user_id: "${vol}", captures: { e1: $.data.id } }
            - { call: "POST /vrc/hour-entries/${e1}/verify", payload: {}, as: SiteSupervisor, as_user_id: "site-1" }
          trigger:
            - { call: "GET /vrc/incidents/${inc}", payload: {}, as: VRCManager, captures: { ver: $.data.verified_cost_share_cents, fed: $.data.federal_share_cents, st: $.data.state_share_cents, loc: $.data.local_share_cents } }
          assert:
            - "Incident.${inc}.verified_cost_share_cents == 10500"
            - "Incident.${inc}.federal_share_cents == 7875 (round_half_up(10500*0.75))"
            - "Incident.${inc}.state_share_cents == 1313 (round_half_up(10500*0.125) = round_half_up(1312.5))"
            - "Incident.${inc}.local_share_cents == 1312 (10500 - 7875 - 1313 by subtraction; independently-rounded 1313 is WRONG)"
            - "federal + state + local == verified (7875 + 1313 + 1312 == 10500): remainder absorption keeps the split conservative"

  # ---------------------------------------------------------------------------
  # Rule 3: non_linear_state_machine — two non-linear machines on DIFFERENT
  # entities: Volunteer (suspension re-vetting CYCLE) and Incident (PARALLEL
  # lifecycle x posture dimensions).
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: volunteer_suspension_revetting_cycle_returns_to_ready
        grounds:
          - state_machines.Volunteer.SUSPENDED_to_VETTING
          - state_machines.Volunteer.VETTING_to_CLEARED
          - state_machines.Volunteer.CLEARED_to_READY
        distinguishing_aspect: |
          Cyclic shape on Volunteer: READY -> SUSPENDED -> VETTING -> CLEARED ->
          READY is a full loop (not a pipeline): the volunteer re-enters VETTING
          on reinstatement and auto-promotes to CLEARED again once the fresh
          background check clears, because the still-VERIFIED credential
          satisfies the second promotion precondition.
        test_recipe:
          setup:
            - "Incident ACTIVE; volunteer fully READY (credential VERIFIED, BG cleared, briefing + waiver ACTIVE) at clock 2026-08-01T00:00:00Z"
            - "Volunteer then suspended by RiskOfficer; a fresh BackgroundCheck opened while SUSPENDED"
          setup_api_calls:
            - { call: "POST /vrc/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VRCManager }
            - { call: "POST /vrc/incidents", payload: { name: "Flood Epsilon", ppe_stock: { GLOVES: 5, MASK: 5, HARD_HAT: 5, VEST: 5, GOGGLES: 5 } }, as: VRCManager, captures: { inc: $.data.id } }
            - { call: "POST /vrc/incidents/${inc}/activate", payload: {}, as: VRCManager }
            - { call: "POST /vrc/volunteers", payload: { incident_id: "${inc}", full_name: "Eve Egan", phone: "555-0505", email: "eve@x.com", home_locality: "Riverton" }, as: IntakeCoordinator, as_user_id: "intake-1", captures: { vol: $.data.id } }
            - { call: "POST /vrc/credentials", payload: { volunteer_id: "${vol}", skill_code: "SHELTER_OPS", credential_class: "STANDARD", expires_at: "2026-09-01T00:00:00Z" }, as: IntakeCoordinator, captures: { cred: $.data.id } }
            - { call: "POST /vrc/volunteers/${vol}/submit-for-vetting", payload: {}, as: IntakeCoordinator }
            - { call: "POST /vrc/background-checks", payload: { volunteer_id: "${vol}" }, as: VettingOfficer, captures: { bg1: $.data.id } }
            - { call: "POST /vrc/background-checks/${bg1}/clear", payload: {}, as: VettingOfficer, as_user_id: "vet-1" }
            - { call: "POST /vrc/credentials/${cred}/verify", payload: {}, as: VettingOfficer, as_user_id: "vet-1" }
            - { call: "POST /vrc/clearances", payload: { volunteer_id: "${vol}", clearance_type: "SAFETY_BRIEFING" }, as: IntakeCoordinator }
            - { call: "POST /vrc/clearances", payload: { volunteer_id: "${vol}", clearance_type: "LIABILITY_WAIVER" }, as: IntakeCoordinator }
            - { call: "POST /vrc/volunteers/${vol}/mark-ready", payload: {}, as: IntakeCoordinator }
            - { call: "POST /vrc/volunteers/${vol}/suspend", payload: {}, as: RiskOfficer, as_user_id: "risk-1" }
            - { call: "POST /vrc/background-checks", payload: { volunteer_id: "${vol}" }, as: VettingOfficer, captures: { bg2: $.data.id } }
          trigger:
            - { call: "POST /vrc/volunteers/${vol}/reinstate", payload: {}, as: RiskOfficer, as_user_id: "risk-1", captures: { st_reinstate: $.data.status } }
            - { call: "POST /vrc/background-checks/${bg2}/clear", payload: {}, as: VettingOfficer, as_user_id: "vet-1", captures: { dummy: $.data.status } }
            - { call: "GET /vrc/volunteers/${vol}", payload: {}, as: VRCManager, captures: { st_cleared: $.data.status } }
            - { call: "POST /vrc/volunteers/${vol}/mark-ready", payload: {}, as: IntakeCoordinator, captures: { st_ready: $.data.status } }
          assert:
            - "reinstate response status == VETTING (cycle re-entry, not direct READY restore)"
            - "after clearing the second background check, Volunteer.${vol}.status == CLEARED (auto-promotion re-fired: credential still VERIFIED)"
            - "final mark-ready response status == READY (full loop READY -> SUSPENDED -> VETTING -> CLEARED -> READY traversed)"

      - name: incident_lifecycle_stays_active_while_posture_freezes_and_thaws
        grounds:
          - state_machines.Incident.ACTIVATION_to_ACTIVE
          - calculations.posture_derivation
          - entities.Incident.fields.operational_posture
        distinguishing_aspect: |
          Parallel-dimension shape on Incident (distinct entity and distinct
          non-linear shape from the Volunteer cycle): lifecycle_status remains
          ACTIVE while operational_posture independently oscillates
          OPEN -> FROZEN -> OPEN driven by a CRITICAL substantiation and the
          24h decay window — two orthogonal state axes evolving on one row.
        test_recipe:
          setup:
            - "Incident ACTIVE at clock 2026-08-01T00:00:00Z; one REGISTERED volunteer; one CRITICAL risk report filed by site-1"
          setup_api_calls:
            - { call: "POST /vrc/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VRCManager }
            - { call: "POST /vrc/incidents", payload: { name: "Quake Zeta", ppe_stock: { GLOVES: 5, MASK: 5, HARD_HAT: 5, VEST: 5, GOGGLES: 5 } }, as: VRCManager, captures: { inc: $.data.id } }
            - { call: "POST /vrc/incidents/${inc}/activate", payload: {}, as: VRCManager }
            - { call: "POST /vrc/volunteers", payload: { incident_id: "${inc}", full_name: "Fred Foss", phone: "555-0606", email: "fred@x.com", home_locality: "Riverton" }, as: IntakeCoordinator, as_user_id: "intake-1", captures: { vol: $.data.id } }
            - { call: "POST /vrc/risk-reports", payload: { subject_volunteer_id: "${vol}", severity: "CRITICAL", category: "SAFETY_VIOLATION", description: "Entered structure against orders", occurred_at: "2026-08-01T00:00:00Z" }, as: SiteSupervisor, as_user_id: "site-1", captures: { rep: $.data.id } }
          trigger:
            - { call: "POST /vrc/risk-reports/${rep}/substantiate", payload: {}, as: RiskOfficer, as_user_id: "risk-1" }
            - { call: "GET /vrc/incidents/${inc}", payload: {}, as: VRCManager, captures: { life_frozen: $.data.lifecycle_status, post_frozen: $.data.operational_posture } }
            - { call: "POST /vrc/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T01:00:00Z" }, as: VRCManager }
            - { call: "GET /vrc/incidents/${inc}", payload: {}, as: VRCManager, captures: { life_thawed: $.data.lifecycle_status, post_thawed: $.data.operational_posture } }
          assert:
            - "post_frozen == FROZEN (CRITICAL substantiation inside the rolling 24h window)"
            - "life_frozen == ACTIVE (lifecycle dimension untouched by the posture swing)"
            - "post_thawed == OPEN (adjudicated_at 2026-08-01T00:00:00Z aged past the 24h window at 2026-08-02T01:00:00Z)"
            - "life_thawed == ACTIVE (lifecycle never moved: parallel dimensions evolve independently)"

  # ---------------------------------------------------------------------------
  # Rule 4: transitive_cascade — two cascades from DIFFERENT triggers;
  # instance 1 depth 5, instance 2 depth 4.
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: risk_substantiation_triggers_suspension_cascade_depth5
        grounds:
          - state_machines.RiskReport.FILED_to_SUBSTANTIATED
          - state_machines.Volunteer.READY_to_SUSPENDED
          - state_machines.DeploymentAssignment.CONFIRMED_to_CANCELLED
          - state_machines.SupportRequest.FILLED_to_MATCHING
          - state_machines.SiteShift.LOCKED_to_OPEN_FOR_ROSTER
          - state_machines.SeatBooking.BOOKED_to_CANCELLED
        distinguishing_aspect: |
          Depth-5 chain from the risk-adjudication trigger: substantiate ->
          risk score crosses 50 -> volunteer auto-suspends -> assignment
          CONFIRMED->CANCELLED -> support request FILLED regresses AND shift
          LOCKED regresses AND seat booking cancels -> incident posture
          recomputed. Each link is caused by the previous link's mutation, not
          by the original call.
        test_recipe:
          setup:
            - "Incident ACTIVE; volunteer READY; LOW (5) + MEDIUM (15) reports already substantiated (current score 20)"
            - "Request headcount 1 OPEN; shift capacity 1 OPEN_FOR_ROSTER; assignment CONFIRMED (request FILLED, shift LOCKED); trip with this volunteer's seat BOOKED (booked_seats 1)"
            - "A HIGH (30) report filed, unsubstantiated"
          setup_api_calls:
            - { call: "POST /vrc/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VRCManager }
            - { call: "POST /vrc/incidents", payload: { name: "Flood Eta", ppe_stock: { GLOVES: 5, MASK: 5, HARD_HAT: 5, VEST: 5, GOGGLES: 5 } }, as: VRCManager, captures: { inc: $.data.id } }
            - { call: "POST /vrc/incidents/${inc}/activate", payload: {}, as: VRCManager }
            - { call: "POST /vrc/volunteers", payload: { incident_id: "${inc}", full_name: "Gail Gow", phone: "555-0707", email: "gail@x.com", home_locality: "Riverton" }, as: IntakeCoordinator, as_user_id: "intake-1", captures: { vol: $.data.id } }
            - { call: "POST /vrc/credentials", payload: { volunteer_id: "${vol}", skill_code: "GENERAL_LABOR", credential_class: "STANDARD", expires_at: "2026-09-01T00:00:00Z" }, as: IntakeCoordinator, captures: { cred: $.data.id } }
            - { call: "POST /vrc/volunteers/${vol}/submit-for-vetting", payload: {}, as: IntakeCoordinator }
            - { call: "POST /vrc/background-checks", payload: { volunteer_id: "${vol}" }, as: VettingOfficer, captures: { bg: $.data.id } }
            - { call: "POST /vrc/background-checks/${bg}/clear", payload: {}, as: VettingOfficer, as_user_id: "vet-1" }
            - { call: "POST /vrc/credentials/${cred}/verify", payload: {}, as: VettingOfficer, as_user_id: "vet-1" }
            - { call: "POST /vrc/clearances", payload: { volunteer_id: "${vol}", clearance_type: "SAFETY_BRIEFING" }, as: IntakeCoordinator }
            - { call: "POST /vrc/clearances", payload: { volunteer_id: "${vol}", clearance_type: "LIABILITY_WAIVER" }, as: IntakeCoordinator }
            - { call: "POST /vrc/volunteers/${vol}/mark-ready", payload: {}, as: IntakeCoordinator }
            - { call: "POST /vrc/risk-reports", payload: { subject_volunteer_id: "${vol}", severity: "LOW", category: "OTHER", description: "late arrival", occurred_at: "2026-08-01T00:00:00Z" }, as: SiteSupervisor, as_user_id: "site-1", captures: { r_low: $.data.id } }
            - { call: "POST /vrc/risk-reports/${r_low}/substantiate", payload: {}, as: RiskOfficer, as_user_id: "risk-1" }
            - { call: "POST /vrc/risk-reports", payload: { subject_volunteer_id: "${vol}", severity: "MEDIUM", category: "MISCONDUCT", description: "ignored staging rules", occurred_at: "2026-08-01T01:00:00Z" }, as: SiteSupervisor, as_user_id: "site-1", captures: { r_med: $.data.id } }
            - { call: "POST /vrc/risk-reports/${r_med}/substantiate", payload: {}, as: RiskOfficer, as_user_id: "risk-1" }
            - { call: "POST /vrc/support-requests", payload: { incident_id: "${inc}", requesting_agency: "County Public Works", site_name: "East Lot", required_skill: "GENERAL_LABOR", min_credential_class: "STANDARD", headcount_needed: 1, criticality: "STANDARD", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T20:00:00Z" }, as: AgencyCoordinator, captures: { req: $.data.id } }
            - { call: "POST /vrc/support-requests/${req}/publish", payload: {}, as: AgencyCoordinator }
            - { call: "POST /vrc/shifts", payload: { incident_id: "${inc}", site_name: "East Lot", hazard_level: "GREEN", start_at: "2026-08-10T08:00:00Z", end_at: "2026-08-10T16:00:00Z", capacity: 1 }, as: LogisticsCoordinator, captures: { sh: $.data.id } }
            - { call: "POST /vrc/shifts/${sh}/open-roster", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /vrc/assignments", payload: { volunteer_id: "${vol}", support_request_id: "${req}", site_shift_id: "${sh}" }, as: IntakeCoordinator, captures: { asg: $.data.id } }
            - { call: "POST /vrc/assignments/${asg}/accept", payload: {}, as: Volunteer, as_user_id: "${vol}" }
            - { call: "POST /vrc/assignments/${asg}/confirm", payload: {}, as: IntakeCoordinator }
            - { call: "POST /vrc/trips", payload: { incident_id: "${inc}", site_shift_id: "${sh}", vehicle_id: "BUS-7", seat_capacity: 20, depart_at: "2026-08-10T07:00:00Z", arrive_estimate_at: "2026-08-10T07:45:00Z" }, as: LogisticsCoordinator, captures: { trip: $.data.id } }
            - { call: "POST /vrc/seat-bookings", payload: { trip_id: "${trip}", assignment_id: "${asg}" }, as: LogisticsCoordinator, captures: { bk: $.data.id } }
            - { call: "POST /vrc/risk-reports", payload: { subject_volunteer_id: "${vol}", severity: "HIGH", category: "SAFETY_VIOLATION", description: "removed PPE in hot zone", occurred_at: "2026-08-01T02:00:00Z" }, as: SiteSupervisor, as_user_id: "site-1", captures: { r_high: $.data.id } }
          trigger:
            - { call: "POST /vrc/risk-reports/${r_high}/substantiate", payload: {}, as: RiskOfficer, as_user_id: "risk-1" }
            - { call: "GET /vrc/volunteers/${vol}", payload: {}, as: VRCManager, captures: { v_status: $.data.status, v_score: $.data.current_risk_score, v_committed: $.data.committed_hours } }
            - { call: "GET /vrc/assignments/${asg}", payload: {}, as: VRCManager, captures: { a_status: $.data.status } }
            - { call: "GET /vrc/seat-bookings/${bk}", payload: {}, as: VRCManager, captures: { b_status: $.data.status } }
            - { call: "GET /vrc/trips/${trip}", payload: {}, as: VRCManager, captures: { t_seats: $.data.booked_seats } }
            - { call: "GET /vrc/support-requests/${req}", payload: {}, as: VRCManager, captures: { r_status: $.data.status, r_filled: $.data.filled_count } }
            - { call: "GET /vrc/shifts/${sh}", payload: {}, as: VRCManager, captures: { s_status: $.data.status, s_roster: $.data.rostered_count } }
          assert:
            - "v_score == 50 (5 + 15 + 30, all inside 168h) and v_status == SUSPENDED (auto-threshold at >= 50)"
            - "a_status == CANCELLED (link 3: suspension cancelled the CONFIRMED assignment)"
            - "v_committed == 0.0 (committed hours released by the cancellation)"
            - "b_status == CANCELLED and t_seats == 0 (link 4: seat booking cancelled, seat freed)"
            - "r_status == OPEN and r_filled == 0 (link 4: FILLED -> MATCHING -> OPEN double regression)"
            - "s_status == OPEN_FOR_ROSTER and s_roster == 0 (link 4: LOCKED regression)"

      - name: shift_cancel_triggers_release_cascade_depth4
        grounds:
          - state_machines.SiteShift.OPEN_FOR_ROSTER_to_CANCELLED
          - state_machines.DeploymentAssignment.CONFIRMED_to_CANCELLED
          - state_machines.SupportRequest.FILLED_to_MATCHING
          - state_machines.TransportTrip.SCHEDULED_to_CANCELLED
          - state_machines.SeatBooking.BOOKED_to_CANCELLED
        distinguishing_aspect: |
          Depth-4 chain from a DIFFERENT trigger (logistics shift cancellation,
          not risk adjudication): shift cancel -> assignment CANCELLED with
          committed-hours release -> support request FILLED->OPEN regression ->
          trips of the shift CANCELLED -> their seat bookings CANCELLED. The
          booking cancellation is caused by the trip cancellation, which is
          caused by the shift cancellation — not by the original call directly.
        test_recipe:
          setup:
            - "Incident ACTIVE; volunteer READY; request headcount 1 OPEN; shift capacity 2 OPEN_FOR_ROSTER; assignment CONFIRMED (request FILLED); trip SCHEDULED on the shift with the volunteer's seat BOOKED"
          setup_api_calls:
            - { call: "POST /vrc/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VRCManager }
            - { call: "POST /vrc/incidents", payload: { name: "Fire Theta", ppe_stock: { GLOVES: 5, MASK: 5, HARD_HAT: 5, VEST: 5, GOGGLES: 5 } }, as: VRCManager, captures: { inc: $.data.id } }
            - { call: "POST /vrc/incidents/${inc}/activate", payload: {}, as: VRCManager }
            - { call: "POST /vrc/volunteers", payload: { incident_id: "${inc}", full_name: "Hank Hale", phone: "555-0808", email: "hank@x.com", home_locality: "Milltown" }, as: IntakeCoordinator, as_user_id: "intake-1", captures: { vol: $.data.id } }
            - { call: "POST /vrc/credentials", payload: { volunteer_id: "${vol}", skill_code: "GENERAL_LABOR", credential_class: "STANDARD", expires_at: "2026-09-01T00:00:00Z" }, as: IntakeCoordinator, captures: { cred: $.data.id } }
            - { call: "POST /vrc/volunteers/${vol}/submit-for-vetting", payload: {}, as: IntakeCoordinator }
            - { call: "POST /vrc/background-checks", payload: { volunteer_id: "${vol}" }, as: VettingOfficer, captures: { bg: $.data.id } }
            - { call: "POST /vrc/background-checks/${bg}/clear", payload: {}, as: VettingOfficer, as_user_id: "vet-1" }
            - { call: "POST /vrc/credentials/${cred}/verify", payload: {}, as: VettingOfficer, as_user_id: "vet-1" }
            - { call: "POST /vrc/clearances", payload: { volunteer_id: "${vol}", clearance_type: "SAFETY_BRIEFING" }, as: IntakeCoordinator }
            - { call: "POST /vrc/clearances", payload: { volunteer_id: "${vol}", clearance_type: "LIABILITY_WAIVER" }, as: IntakeCoordinator }
            - { call: "POST /vrc/volunteers/${vol}/mark-ready", payload: {}, as: IntakeCoordinator }
            - { call: "POST /vrc/support-requests", payload: { incident_id: "${inc}", requesting_agency: "County OES", site_name: "West Field", required_skill: "GENERAL_LABOR", min_credential_class: "STANDARD", headcount_needed: 1, criticality: "STANDARD", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T20:00:00Z" }, as: AgencyCoordinator, captures: { req: $.data.id } }
            - { call: "POST /vrc/support-requests/${req}/publish", payload: {}, as: AgencyCoordinator }
            - { call: "POST /vrc/shifts", payload: { incident_id: "${inc}", site_name: "West Field", hazard_level: "GREEN", start_at: "2026-08-10T08:00:00Z", end_at: "2026-08-10T16:00:00Z", capacity: 2 }, as: LogisticsCoordinator, captures: { sh: $.data.id } }
            - { call: "POST /vrc/shifts/${sh}/open-roster", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /vrc/assignments", payload: { volunteer_id: "${vol}", support_request_id: "${req}", site_shift_id: "${sh}" }, as: IntakeCoordinator, captures: { asg: $.data.id } }
            - { call: "POST /vrc/assignments/${asg}/accept", payload: {}, as: Volunteer, as_user_id: "${vol}" }
            - { call: "POST /vrc/assignments/${asg}/confirm", payload: {}, as: IntakeCoordinator }
            - { call: "POST /vrc/trips", payload: { incident_id: "${inc}", site_shift_id: "${sh}", vehicle_id: "VAN-3", seat_capacity: 8, depart_at: "2026-08-10T07:00:00Z", arrive_estimate_at: "2026-08-10T07:45:00Z" }, as: LogisticsCoordinator, captures: { trip: $.data.id } }
            - { call: "POST /vrc/seat-bookings", payload: { trip_id: "${trip}", assignment_id: "${asg}" }, as: LogisticsCoordinator, captures: { bk: $.data.id } }
          trigger:
            - { call: "POST /vrc/shifts/${sh}/cancel", payload: {}, as: LogisticsCoordinator }
            - { call: "GET /vrc/assignments/${asg}", payload: {}, as: VRCManager, captures: { a_status: $.data.status } }
            - { call: "GET /vrc/volunteers/${vol}", payload: {}, as: VRCManager, captures: { v_committed: $.data.committed_hours } }
            - { call: "GET /vrc/support-requests/${req}", payload: {}, as: VRCManager, captures: { r_status: $.data.status } }
            - { call: "GET /vrc/trips/${trip}", payload: {}, as: VRCManager, captures: { t_status: $.data.status, t_seats: $.data.booked_seats } }
            - { call: "GET /vrc/seat-bookings/${bk}", payload: {}, as: VRCManager, captures: { b_status: $.data.status } }
          assert:
            - "a_status == CANCELLED (link 2: shift cancellation cancelled the CONFIRMED assignment)"
            - "v_committed == 0.0 (link 2 release)"
            - "r_status == OPEN (link 3: FILLED -> MATCHING -> OPEN regression chain)"
            - "t_status == CANCELLED (link 3: trips of the cancelled shift cancelled)"
            - "b_status == CANCELLED and t_seats == 0 (link 4: bookings cancelled via the trip cancellation)"

  # ---------------------------------------------------------------------------
  # Rule 5: priority_pair_validation_conflict — two dual-failure scenarios on
  # DIFFERENT error-category pairs: (state vs business_safety) and
  # (business_safety vs business_temporal).
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: checkin_on_cancelled_assignment_with_expired_briefing_state_wins
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_BRIEFING_NOT_CURRENT]
        distinguishing_aspect: |
          Category pair state (P7) vs business_safety (P10): the assignment is
          CANCELLED (state violation) AND the volunteer's briefing expired via
          clock sweep (safety violation) — the P7 state error ERR_INVALID_STATE
          must win over ERR_BRIEFING_NOT_CURRENT.
        test_recipe:
          setup:
            - "Incident ACTIVE; volunteer READY (briefing signed 2026-08-01, expires 2026-08-04T00:00:00Z); assignment CONFIRMED on shift 2026-08-10 08:00-16:00, then CANCELLED by IntakeCoordinator"
            - "Clock advanced to 2026-08-04T01:00:00Z so the briefing is EXPIRED (safety gate would also fail)"
          setup_api_calls:
            - { call: "POST /vrc/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VRCManager }
            - { call: "POST /vrc/incidents", payload: { name: "Flood Iota", ppe_stock: { GLOVES: 5, MASK: 5, HARD_HAT: 5, VEST: 5, GOGGLES: 5 } }, as: VRCManager, captures: { inc: $.data.id } }
