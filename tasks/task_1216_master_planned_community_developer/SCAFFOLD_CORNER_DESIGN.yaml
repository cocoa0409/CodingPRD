              payload: { declarant_director_names: ["D1", "D2", "D3", "D4", "D5"] }
              as: DeclarantExecutive
            - call: "POST /mpc/notices"
              payload: { community_id: "${c_id}", notice_type: "GENERAL_MEETING", subject: "n1", body: "one", send_at: "2026-05-10T00:00:00Z" }
              as: LifestyleCoordinator
              captures: { n1_id: $.data.id }
            - call: "POST /mpc/notices"
              payload: { community_id: "${c_id}", notice_type: "GENERAL_MEETING", subject: "n2", body: "two", send_at: "2026-05-10T00:00:00Z" }
              as: LifestyleCoordinator
              captures: { n2_id: $.data.id }
            - call: "POST /mpc/notices/${n1_id}/schedule"
              payload: {}
              as: LifestyleCoordinator
            - call: "POST /mpc/notices/${n2_id}/schedule"
              payload: {}
              as: LifestyleCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-09T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /mpc/notices/${n1_id}"
              as: LifestyleCoordinator
              captures: { n1_pre: $.data.status }
            - call: "POST /mpc/notices/${n2_id}/cancel"
              payload: {}
              as: LifestyleCoordinator
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /mpc/notices/${n1_id}"
              as: LifestyleCoordinator
              captures: { n1_post: $.data.status, n1_sent: $.data.sent_at }
            - call: "GET /mpc/notices/${n2_id}"
              as: LifestyleCoordinator
              captures: { n2_post: $.data.status }
          assert:
            - "before send_at: ${n1_pre} == SCHEDULED"
            - "at send_at: ${n1_post} == SENT and ${n1_sent} == 2026-05-10T00:00:00Z (sent_at pins the scheduled instant)"
            - "cancelled before the sweep: ${n2_post} == CANCELLED (never sent)"

      - name: derived_field_reconciliation_budget_and_district
        claim_type: derived_field_reconciliation
        grounds:
          - entities.AssociationBudget.fields.total_expense_cents
          - entities.ReimbursementDistrict.fields.provisional_interest_cents
        distinguishing_aspect: "Denormalized totals reconcile on every mutation: budget totals track each line-item add; district provisional interest goes 0 -> 24,658c when a 6,000,000c advance dated 2026-04-01 is recorded (30 days simple at 5%)."
        test_recipe:
          setup: ["ACTIVE community; DRAFT budget; district at 5.0%"]
          setup_api_calls:
