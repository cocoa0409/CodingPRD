  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: audit_snapshot_contents_on_seal
        claim_type: computed_read
        grounds:
          - calculations.audit_snapshot
          - entities.AuditPackage.fields.evidence_snapshot
        distinguishing_aspect: "Seal freezes exactly the in-period evidence: a verification event and a screening on 2026-08-01 produce a 2-item snapshot ordered by occurred_on then kind (EXCLUSION_SCREENING before VERIFICATION_EVENT)."
        test_recipe:
          setup:
            - "RN type; employee with license verified 2026-08-01; one CLEAR screening screened_on 2026-08-01; package [2026-08-01, 2026-09-01); clock at 2026-09-01"
          setup_api_calls:
            - call: "POST /licensing/license-types"
              payload: { code: "RN", name: "Registered Nurse", ce_hours_required_per_cycle: 30.0, cycle_length_months: 24, verification_frequency_days: 180, grace_period_days: 45, requires_exclusion_screening: true, reimbursement_mode: "RECEIPT_BASED", reimburse_full_up_to_cents: 200000, reimburse_half_up_to_cents: 500000, flat_schedule_amount_cents: 0, hard_claim_cap_cents: 500000 }
              as: ComplianceAdmin
              captures: { lt_rn: $.data.id }
            - call: "POST /licensing/employees"
              payload: { full_name: "Audrey Subject", work_email: "audrey.snap@example.com", role_code: "STAFF_NURSE" }
              as: HRPartner
              captures: { emp: $.data.id }
            - call: "POST /licensing/licenses"
              payload: { employee_id: "${emp}", license_type_id: "${lt_rn}", state_code: "CA", license_number: "RN-9401", issued_on: "2026-01-01", expires_on: "2027-06-30" }
              as: ComplianceOfficer
              captures: { lic: $.data.id }
            - call: "POST /licensing/licenses/${lic}/verify"
              payload: { verified_on: "2026-08-01", source: "STATE_BOARD_API", outcome: "VERIFIED" }
              as: ComplianceOfficer
            - call: "POST /licensing/employees/${emp}/exclusion-screenings"
              payload: { list_source: "OIG_LEIE", screened_on: "2026-08-01", outcome: "CLEAR" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /licensing/employees/${emp}/audit-packages"
              payload: { period_start: "2026-08-01", period_end: "2026-09-01" }
              as: ExternalAuditor
              captures: { pkg: $.data.id }
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ComplianceAdmin
