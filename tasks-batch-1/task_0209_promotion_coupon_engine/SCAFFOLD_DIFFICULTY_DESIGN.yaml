# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Promotion & Coupon Engine — Expert band
# 9 rule_ids × 2 instances = 18 difficulty instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      # --- instance 1: CartApplication domain (percent rounding order) ---
      - name: dvc_percent_rounding_order_diverges
        grounds:
          - calculations.percent_off_discount
          - entities.CartApplication.fields.raw_discount_cents
          - state_machines.Cart.pricing_status.UNPRICED_to_PRICED
        distinguishing_aspect: |
          Operates on the CartApplication/Cart discount domain: round-per-line-then-sum (302) vs the rejected
          sum-then-round (301) — distinct entity domain from instance 2 which scores Promotion budget in cents.
        test_recipe:
          setup:
            - "Clock at 2026-06-15T00:00:00Z (inside an ACTIVE PERCENT_OFF promotion's window)."
            - "Promotion P is PERCENT_OFF 10%, STACKABLE, ALL eligibility, window 2026-06-01..2026-07-01, with coupon ROUND10 ENABLED."
            - "Cart owned by customer C has two lines: (sku S1, 1005c x1) and (sku S2, 2005c x1); coupon ROUND10 applied; cart repriced."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-15T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /customers"
              payload: { email: "dvc1@x.com", display_name: "DVC1" }
              as: Shopper
              captures: { cust_id: $.data.id }
            - call: "POST /promotions"
              payload: { name: "P-pct10", promo_type: "PERCENT_OFF", percent_off: 0.10, stacking_class: "STACKABLE", eligibility_mode: "ALL", active_from: "2026-06-01T00:00:00Z", active_until: "2026-07-01T00:00:00Z" }
              as: MerchantAdmin
              captures: { promo_id: $.data.id }
            - call: "POST /promotions/${promo_id}/coupons"
              payload: { code: "ROUND10", use_mode: "MULTI_USE", max_total_redemptions: 100 }
              as: MerchantAdmin
              captures: { coupon_id: $.data.id }
            - call: "POST /promotions/${promo_id}/activate"
              payload: {}
              as: MerchantAdmin
            - call: "POST /carts"
              payload: { customer_id: "${cust_id}" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { cart_id: $.data.id }
            - call: "POST /carts/${cart_id}/lines"
              payload: { sku: "S1", unit_price_cents: 1005, quantity: 1 }
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /carts/${cart_id}/lines"
              payload: { sku: "S2", unit_price_cents: 2005, quantity: 1 }
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /carts/${cart_id}/applications"
              payload: { code: "ROUND10" }
              as: Shopper
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /carts/${cart_id}/reprice"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { repriced_total_discount: $.data.total_discount_cents }
          assert:
            - "Cart.${cart_id}.subtotal_cents == 3010"
            - "Cart.${cart_id}.total_discount_cents == 302"
            - "Cart.${cart_id}.total_cents == 2708"

      # --- instance 2: Promotion domain (budget cents: would-exceed vs exhausted) ---
      - name: dvc_budget_would_exceed_vs_exhausted
        grounds:
          - calculations.budget_consumption
          - entities.Promotion.fields.budget_consumed_cents
          - validations[priority=16]
          - validations[priority=17]
        distinguishing_aspect: |
          Operates on the Promotion budget domain in cents: pre-commit ERR_PROMO_BUDGET_WOULD_EXCEED vs post-commit
          ERR_PROMO_BUDGET_EXHAUSTED are two valid readings of "out of budget" producing different error_ids — a
          different entity domain than instance 1's per-line rounding on the cart.
        test_recipe:
          setup:
            - "Clock 2026-06-15. Promotion BP is THRESHOLD tier {min 0 -> 1000c discount}, STACKABLE, budget_cap_cents=1000, ACTIVE, coupon BUDGET1 SINGLE_USE."
            - "Customer C1 has a priced cart with a single line (sku S, 5000c x1), coupon BUDGET1 applied, locked, checked out — consuming the full 1000c budget so promotion auto-transitions to EXHAUSTED."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-15T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /customers"
              payload: { email: "dvc2a@x.com", display_name: "C1" }
              as: Shopper
              captures: { c1_id: $.data.id }
            - call: "POST /promotions"
              payload: { name: "BP", promo_type: "THRESHOLD", threshold_tiers: [{ min_subtotal_cents: 0, discount_cents: 1000 }], stacking_class: "STACKABLE", eligibility_mode: "ALL", active_from: "2026-06-01T00:00:00Z", active_until: "2026-07-01T00:00:00Z", budget_cap_cents: 1000 }
              as: MerchantAdmin
              captures: { bp_id: $.data.id }
            - call: "POST /promotions/${bp_id}/coupons"
              payload: { code: "BUDGET1", use_mode: "MULTI_USE", max_total_redemptions: 100 }
              as: MerchantAdmin
            - call: "POST /promotions/${bp_id}/coupons"
              payload: { code: "BUDGET2", use_mode: "MULTI_USE", max_total_redemptions: 100 }
              as: MerchantAdmin
            - call: "POST /promotions/${bp_id}/activate"
              payload: {}
              as: MerchantAdmin
            - call: "POST /carts"
              payload: { customer_id: "${c1_id}" }
              as: Shopper
              as_user_id: "${c1_id}"
              captures: { cart1_id: $.data.id }
            - call: "POST /carts/${cart1_id}/lines"
              payload: { sku: "S", unit_price_cents: 5000, quantity: 1 }
              as: Shopper
              as_user_id: "${c1_id}"
            - call: "GET /promotions/${bp_id}"
              payload: {}
              as: Shopper
              as_user_id: "${c1_id}"
              captures: { bp_ver: $.data.version }
            - call: "POST /carts/${cart1_id}/applications"
              payload: { code: "BUDGET1", expected_promotion_version: "${bp_ver}" }
              as: Shopper
              as_user_id: "${c1_id}"
            - call: "POST /carts/${cart1_id}/reprice"
              payload: {}
              as: Shopper
              as_user_id: "${c1_id}"
            - call: "POST /carts/${cart1_id}/lock"
              payload: {}
              as: Shopper
              as_user_id: "${c1_id}"
              captures: { cart1_ver: $.data.version }
            - call: "POST /carts/${cart1_id}/checkout"
              payload: { expected_cart_version: "${cart1_ver}" }
              as: Shopper
              as_user_id: "${c1_id}"
          trigger:
            - call: "POST /customers"
              payload: { email: "dvc2b@x.com", display_name: "C2" }
              as: Shopper
              captures: { c2_id: $.data.id }
            - call: "POST /carts"
              payload: { customer_id: "${c2_id}" }
              as: Shopper
              as_user_id: "${c2_id}"
              captures: { cart2_id: $.data.id }
            - call: "POST /carts/${cart2_id}/lines"
              payload: { sku: "S", unit_price_cents: 5000, quantity: 1 }
              as: Shopper
              as_user_id: "${c2_id}"
            - call: "GET /promotions/${bp_id}"
              payload: {}
              as: Shopper
              as_user_id: "${c2_id}"
              captures: { bp_ver2: $.data.version }
            - call: "POST /carts/${cart2_id}/applications"
              payload: { code: "BUDGET2", expected_promotion_version: "${bp_ver2}" }
              as: Shopper
              as_user_id: "${c2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Promotion.${bp_id}.budget_consumed_cents == 1000"
            - "Promotion.${bp_id}.status == EXHAUSTED"
            - "trigger application returns ERR_PROMO_BUDGET_EXHAUSTED (409)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      # --- mode (b): nested rounding order ---
      - name: cf_percent_per_line_rounding_mode_b
        grounds:
          - calculations.percent_off_discount
          - calculations.percent_off_discount.variants.per_line_then_sum
          - entities.Cart.fields.total_discount_cents
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: round-per-line-then-sum is pinned (302), distinct from the
          sum-then-round reading (301). This is the rounding-order axis, not the min/max-branch axis of instance 2.
        test_recipe:
          setup:
            - "Clock 2026-06-15. ACTIVE PERCENT_OFF 10% STACKABLE promotion with coupon PCT10."
            - "Cart with lines (1005c x1) and (2005c x1), coupon PCT10 applied."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-15T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /customers"
              payload: { email: "cfb@x.com", display_name: "CFB" }
              as: Shopper
              captures: { cust_id: $.data.id }
            - call: "POST /promotions"
              payload: { name: "PCT10", promo_type: "PERCENT_OFF", percent_off: 0.10, stacking_class: "STACKABLE", eligibility_mode: "ALL", active_from: "2026-06-01T00:00:00Z", active_until: "2026-07-01T00:00:00Z" }
              as: MerchantAdmin
              captures: { promo_id: $.data.id }
            - call: "POST /promotions/${promo_id}/coupons"
              payload: { code: "PCT10", use_mode: "MULTI_USE", max_total_redemptions: 100 }
              as: MerchantAdmin
            - call: "POST /promotions/${promo_id}/activate"
              payload: {}
              as: MerchantAdmin
            - call: "POST /carts"
              payload: { customer_id: "${cust_id}" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { cart_id: $.data.id }
            - call: "POST /carts/${cart_id}/lines"
              payload: { sku: "S1", unit_price_cents: 1005, quantity: 1 }
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /carts/${cart_id}/lines"
              payload: { sku: "S2", unit_price_cents: 2005, quantity: 1 }
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /carts/${cart_id}/applications"
              payload: { code: "PCT10" }
              as: Shopper
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /carts/${cart_id}/reprice"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
          assert:
            - "Cart.${cart_id}.total_discount_cents == 302"
            - "Cart.${cart_id}.total_cents == 2708"

      # --- mode (c): circular-looking stacking ceiling ---
      - name: cf_stacking_ceiling_circular_mode_c
        grounds:
          - calculations.stacking_ceiling
          - calculations.stacking_ceiling.variants.capped_waterfall
          - entities.CartApplication.fields.discount_cents
          - entities.Cart.fields.total_discount_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the ceiling depends on total which depends on per-application discount
          which the ceiling caps; evaluation order is pinned (raw first, then ceiling, then waterfall by created_at ASC).
          Distinct axis from instance 1's rounding-order mode.
        test_recipe:
          setup:
            - "Clock 2026-06-15. Two ACTIVE STACKABLE promotions, no ExclusionRule between them."
            - "P1 PERCENT_OFF 30% with max_stacked_discount_pct=0.50 (created first); P2 THRESHOLD {min 3000 -> 1500c} (created second)."
            - "Cart with one line (sku A, 4000c x1); both coupons applied (P1C then P2C)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-15T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /customers"
              payload: { email: "cfc@x.com", display_name: "CFC" }
              as: Shopper
              captures: { cust_id: $.data.id }
            - call: "POST /promotions"
              payload: { name: "P1pct30", promo_type: "PERCENT_OFF", percent_off: 0.30, stacking_class: "STACKABLE", max_stacked_discount_pct: 0.50, eligibility_mode: "ALL", active_from: "2026-06-01T00:00:00Z", active_until: "2026-07-01T00:00:00Z" }
              as: MerchantAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /promotions/${p1_id}/coupons"
              payload: { code: "P1C", use_mode: "MULTI_USE", max_total_redemptions: 100 }
              as: MerchantAdmin
            - call: "POST /promotions/${p1_id}/activate"
              payload: {}
              as: MerchantAdmin
            - call: "POST /promotions"
              payload: { name: "P2thr", promo_type: "THRESHOLD", threshold_tiers: [{ min_subtotal_cents: 3000, discount_cents: 1500 }], stacking_class: "STACKABLE", eligibility_mode: "ALL", active_from: "2026-06-01T00:00:00Z", active_until: "2026-07-01T00:00:00Z" }
              as: MerchantAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /promotions/${p2_id}/coupons"
              payload: { code: "P2C", use_mode: "MULTI_USE", max_total_redemptions: 100 }
              as: MerchantAdmin
            - call: "POST /promotions/${p2_id}/activate"
              payload: {}
              as: MerchantAdmin
            - call: "POST /carts"
              payload: { customer_id: "${cust_id}" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { cart_id: $.data.id }
            - call: "POST /carts/${cart_id}/lines"
              payload: { sku: "A", unit_price_cents: 4000, quantity: 1 }
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /carts/${cart_id}/applications"
              payload: { code: "P1C" }
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /carts/${cart_id}/applications"
              payload: { code: "P2C" }
              as: Shopper
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /carts/${cart_id}/reprice"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
          assert:
            - "Cart.${cart_id}.subtotal_cents == 4000"
            - "Cart.${cart_id}.total_discount_cents == 2000"
            - "Cart.${cart_id}.total_cents == 2000"
            - "CartApplication for P1 has discount_cents == 1200 and for P2 discount_cents == 800 (waterfall by created_at ASC)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      # --- cyclic: Promotion ACTIVE<->PAUSED ---
      - name: nlsm_promotion_active_pause_cycle
        grounds:
          - state_machines.Promotion.ACTIVE_to_PAUSED
          - state_machines.Promotion.PAUSED_to_ACTIVE
        distinguishing_aspect: |
          Cyclic shape on Promotion: ACTIVE->PAUSED->ACTIVE revision loop returns to a prior state — non-linear,
          on a different entity than instance 2's parallel-dimension Cart machine.
        test_recipe:
          setup:
            - "Clock 2026-06-15. Promotion CYC PERCENT_OFF 10% ACTIVE within window."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-15T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /promotions"
              payload: { name: "CYC", promo_type: "PERCENT_OFF", percent_off: 0.10, stacking_class: "STACKABLE", eligibility_mode: "ALL", active_from: "2026-06-01T00:00:00Z", active_until: "2026-07-01T00:00:00Z" }
              as: MerchantAdmin
              captures: { promo_id: $.data.id }
            - call: "POST /promotions/${promo_id}/activate"
              payload: {}
              as: MerchantAdmin
            - call: "POST /promotions/${promo_id}/pause"
              payload: {}
              as: MerchantAdmin
          trigger:
            - call: "POST /promotions/${promo_id}/activate"
              payload: {}
              as: MerchantAdmin
              captures: { re_status: $.data.status }
          assert:
            - "Promotion.${promo_id}.status == ACTIVE after the second activate (returned to a prior state)"

      # --- parallel dimensions: Cart pricing_status x checkout_status ---
      - name: nlsm_cart_parallel_pricing_checkout
        grounds:
          - state_machines.Cart.pricing_status.PRICED_to_STALE
          - state_machines.Cart.checkout_status.OPEN_to_LOCKED
          - entities.Cart.fields.pricing_status
          - entities.Cart.fields.checkout_status
        distinguishing_aspect: |
          Parallel state dimensions on one entity (Cart): pricing_status and checkout_status evolve on different
          triggers (reprice vs lock); adding a line flips pricing_status PRICED->STALE while checkout_status stays
          OPEN. Different entity than instance 1's cyclic Promotion machine.
        test_recipe:
          setup:
            - "Clock 2026-06-15. Cart with one line (sku A, 1000c x1), repriced -> pricing_status PRICED, checkout_status OPEN."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-15T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /customers"
              payload: { email: "nlsm2@x.com", display_name: "N2" }
              as: Shopper
              captures: { cust_id: $.data.id }
            - call: "POST /carts"
              payload: { customer_id: "${cust_id}" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { cart_id: $.data.id }
            - call: "POST /carts/${cart_id}/lines"
              payload: { sku: "A", unit_price_cents: 1000, quantity: 1 }
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /carts/${cart_id}/reprice"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /carts/${cart_id}/lines"
              payload: { sku: "B", unit_price_cents: 500, quantity: 1 }
              as: Shopper
              as_user_id: "${cust_id}"
          assert:
            - "Cart.${cart_id}.pricing_status == STALE after adding the line"
            - "Cart.${cart_id}.checkout_status == OPEN (unchanged by the line add — independent dimension)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      # --- depth >= 3: checkout -> redemption confirm -> budget bump -> EXHAUSTED ---
      - name: tc_checkout_confirm_budget_exhaust_depth3
        grounds:
          - state_machines.Cart.checkout_status.LOCKED_to_CHECKED_OUT
          - state_machines.CouponRedemption.RESERVED_to_CONFIRMED
          - state_machines.Promotion.ACTIVE_to_EXHAUSTED
          - calculations.budget_consumption
        distinguishing_aspect: |
          Depth-3 cascade originating from cart checkout: checkout (A) confirms the RESERVED redemption (B); the
          confirm bumps Promotion.budget_consumed_cents (C); reaching the cap drives Promotion ACTIVE->EXHAUSTED (D).
          Each link is caused by the previous link. Originates from a different trigger than instance 2.
        test_recipe:
          setup:
            - "Clock 2026-06-15. Promotion TCB THRESHOLD {min 0 -> 1000c}, budget_cap_cents=1000, ACTIVE, coupon TCB1 SINGLE_USE."
            - "Cart with one line (5000c x1), coupon TCB1 applied, repriced, locked (one RESERVED redemption of 1000c)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-15T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /customers"
              payload: { email: "tc1@x.com", display_name: "TC1" }
              as: Shopper
              captures: { cust_id: $.data.id }
            - call: "POST /promotions"
              payload: { name: "TCB", promo_type: "THRESHOLD", threshold_tiers: [{ min_subtotal_cents: 0, discount_cents: 1000 }], stacking_class: "STACKABLE", eligibility_mode: "ALL", active_from: "2026-06-01T00:00:00Z", active_until: "2026-07-01T00:00:00Z", budget_cap_cents: 1000 }
              as: MerchantAdmin
              captures: { promo_id: $.data.id }
            - call: "POST /promotions/${promo_id}/coupons"
              payload: { code: "TCB1", use_mode: "SINGLE_USE" }
              as: MerchantAdmin
            - call: "POST /promotions/${promo_id}/activate"
              payload: {}
              as: MerchantAdmin
            - call: "POST /carts"
              payload: { customer_id: "${cust_id}" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { cart_id: $.data.id }
            - call: "POST /carts/${cart_id}/lines"
              payload: { sku: "S", unit_price_cents: 5000, quantity: 1 }
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "GET /promotions/${promo_id}"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { promo_ver: $.data.version }
            - call: "POST /carts/${cart_id}/applications"
              payload: { code: "TCB1", expected_promotion_version: "${promo_ver}" }
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /carts/${cart_id}/reprice"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /carts/${cart_id}/lock"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { cart_ver: $.data.version }
          trigger:
            - call: "POST /carts/${cart_id}/checkout"
              payload: { expected_cart_version: "${cart_ver}" }
              as: Shopper
              as_user_id: "${cust_id}"
          assert:
            - "CouponRedemption for this cart has status == CONFIRMED"
            - "Promotion.${promo_id}.budget_consumed_cents == 1000"
            - "Promotion.${promo_id}.status == EXHAUSTED"

      # --- depth >= 2: archive promotion -> child coupons DISABLED ---
      - name: tc_archive_disables_coupons_depth2
        grounds:
          - state_machines.Promotion.PAUSED_to_ARCHIVED
          - state_machines.Coupon.ENABLED_to_DISABLED
          - entities.Coupon.fields.status
        distinguishing_aspect: |
          Depth-2 cascade originating from promotion archive: archive (A) cascades to set each child Coupon to
          DISABLED (B). Different triggering transition than instance 1's checkout cascade.
        test_recipe:
          setup:
            - "Clock 2026-06-15. Promotion ARC ACTIVE then PAUSED, with coupons K1 and K2 ENABLED, no reservations."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-15T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /promotions"
              payload: { name: "ARC", promo_type: "PERCENT_OFF", percent_off: 0.10, stacking_class: "STACKABLE", eligibility_mode: "ALL", active_from: "2026-06-01T00:00:00Z", active_until: "2026-07-01T00:00:00Z" }
              as: MerchantAdmin
              captures: { promo_id: $.data.id }
            - call: "POST /promotions/${promo_id}/coupons"
              payload: { code: "K1", use_mode: "MULTI_USE", max_total_redemptions: 10 }
              as: MerchantAdmin
              captures: { k1_id: $.data.id }
            - call: "POST /promotions/${promo_id}/coupons"
              payload: { code: "K2", use_mode: "MULTI_USE", max_total_redemptions: 10 }
              as: MerchantAdmin
              captures: { k2_id: $.data.id }
            - call: "POST /promotions/${promo_id}/activate"
              payload: {}
              as: MerchantAdmin
            - call: "POST /promotions/${promo_id}/pause"
              payload: {}
              as: MerchantAdmin
          trigger:
            - call: "POST /promotions/${promo_id}/archive"
              payload: {}
              as: MerchantAdmin
          assert:
            - "Promotion.${promo_id}.status == ARCHIVED"
            - "Coupon.${k1_id}.status == DISABLED"
            - "Coupon.${k2_id}.status == DISABLED"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      # --- pair A: state (priority 10 CART_NOT_PRICED) vs business_referential (11 NOT_REDEEMABLE) ---
      - name: ppvc_not_priced_beats_not_redeemable
        grounds:
          - validations[priority=10]
          - validations[priority=11]
        distinguishing_aspect: |
          Dual-failure on lock: cart pricing_status != PRICED (state, priority 10) AND a referenced promotion has
          since been PAUSED (business_referential, priority 11). The lower-priority-number state check wins
          (ERR_CART_NOT_PRICED). Error-category pair state vs business_referential — distinct from instance 2.
        test_recipe:
          setup:
            - "Clock 2026-06-15. Promotion PP1 PERCENT_OFF 10% ACTIVE, coupon PPC1; cart with line applied but then a line is added (pricing_status STALE) AND promotion PAUSED."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-15T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /customers"
              payload: { email: "pp1@x.com", display_name: "PP1" }
              as: Shopper
              captures: { cust_id: $.data.id }
            - call: "POST /promotions"
              payload: { name: "PP1", promo_type: "PERCENT_OFF", percent_off: 0.10, stacking_class: "STACKABLE", eligibility_mode: "ALL", active_from: "2026-06-01T00:00:00Z", active_until: "2026-07-01T00:00:00Z" }
              as: MerchantAdmin
              captures: { promo_id: $.data.id }
            - call: "POST /promotions/${promo_id}/coupons"
              payload: { code: "PPC1", use_mode: "MULTI_USE", max_total_redemptions: 10 }
              as: MerchantAdmin
            - call: "POST /promotions/${promo_id}/activate"
              payload: {}
              as: MerchantAdmin
            - call: "POST /carts"
              payload: { customer_id: "${cust_id}" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { cart_id: $.data.id }
            - call: "POST /carts/${cart_id}/lines"
              payload: { sku: "A", unit_price_cents: 2000, quantity: 1 }
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /carts/${cart_id}/applications"
              payload: { code: "PPC1" }
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /carts/${cart_id}/reprice"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /carts/${cart_id}/lines"
              payload: { sku: "B", unit_price_cents: 500, quantity: 1 }
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /promotions/${promo_id}/pause"
              payload: {}
              as: MerchantAdmin
          trigger:
            - call: "POST /carts/${cart_id}/lock"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "lock returns ERR_CART_NOT_PRICED (409), NOT ERR_PROMO_NOT_REDEEMABLE — lower priority number wins"

      # --- pair B: business_safety (12 NOT_ELIGIBLE) vs business_fiscal (16 BUDGET_WOULD_EXCEED) ---
      - name: ppvc_not_eligible_beats_budget_would_exceed
        grounds:
          - validations[priority=12]
          - validations[priority=16]
        distinguishing_aspect: |
          Dual-failure on apply: customer fails FIRST_ORDER eligibility (business_safety, priority 12) AND the
          discount would exceed remaining budget (business_fiscal, priority 16). The eligibility check wins
          (ERR_NOT_ELIGIBLE). Error-category pair business_safety vs business_fiscal — distinct from instance 1.
        test_recipe:
          setup:
            - "Clock 2026-06-15. Promotion PP2 THRESHOLD {min 0 -> 1000c} FIRST_ORDER eligibility, budget_cap_cents=500 (less than the 1000c discount), ACTIVE, coupon PPC2."
            - "Customer C has order_count == 1 (already checked out one prior cart on a different promotion), so FIRST_ORDER fails; second cart presents PPC2."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-15T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /customers"
              payload: { email: "pp2@x.com", display_name: "PP2" }
              as: Shopper
              captures: { cust_id: $.data.id }
            - call: "POST /carts"
              payload: { customer_id: "${cust_id}" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { prior_cart_id: $.data.id }
            - call: "POST /carts/${prior_cart_id}/lines"
              payload: { sku: "X", unit_price_cents: 1000, quantity: 1 }
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /carts/${prior_cart_id}/reprice"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /carts/${prior_cart_id}/lock"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { prior_ver: $.data.version }
            - call: "POST /carts/${prior_cart_id}/checkout"
              payload: { expected_cart_version: "${prior_ver}" }
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /promotions"
              payload: { name: "PP2", promo_type: "THRESHOLD", threshold_tiers: [{ min_subtotal_cents: 0, discount_cents: 1000 }], stacking_class: "STACKABLE", eligibility_mode: "FIRST_ORDER", active_from: "2026-06-01T00:00:00Z", active_until: "2026-07-01T00:00:00Z", budget_cap_cents: 500 }
              as: MerchantAdmin
              captures: { promo_id: $.data.id }
            - call: "POST /promotions/${promo_id}/coupons"
              payload: { code: "PPC2", use_mode: "MULTI_USE", max_total_redemptions: 10 }
              as: MerchantAdmin
            - call: "POST /promotions/${promo_id}/activate"
              payload: {}
              as: MerchantAdmin
            - call: "POST /carts"
              payload: { customer_id: "${cust_id}" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { cart_id: $.data.id }
            - call: "POST /carts/${cart_id}/lines"
              payload: { sku: "Y", unit_price_cents: 4000, quantity: 1 }
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "GET /promotions/${promo_id}"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { promo_ver: $.data.version }
          trigger:
            - call: "POST /carts/${cart_id}/applications"
              payload: { code: "PPC2", expected_promotion_version: "${promo_ver}" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "apply returns ERR_NOT_ELIGIBLE (403), NOT ERR_PROMO_BUDGET_WOULD_EXCEED — lower priority number wins"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      # --- metric 1: threshold subtotal boundary (>=), via reprice ---
      - name: bpc_threshold_subtotal_inclusive_boundary
        grounds:
          - calculations.threshold_discount
          - calculations.threshold_discount.variants.boundary_inclusive
          - entities.Cart.fields.total_discount_cents
        distinguishing_aspect: |
          Numeric threshold crossing on subtotal_cents: subtotal == 5000 (== tier min) qualifies (discount 1000),
          reached via POST /carts/{id}/reprice. Metric = cart subtotal cents; distinct metric/endpoint from
          instance 2's per-customer redemption count via apply.
        test_recipe:
          setup:
            - "Clock 2026-06-15. THRESHOLD promotion {min 5000 -> 1000c} ACTIVE, coupon THR5K; cart with one line exactly 5000c, coupon applied."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-15T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /customers"
              payload: { email: "bpc1@x.com", display_name: "B1" }
              as: Shopper
              captures: { cust_id: $.data.id }
            - call: "POST /promotions"
              payload: { name: "THR5K", promo_type: "THRESHOLD", threshold_tiers: [{ min_subtotal_cents: 5000, discount_cents: 1000 }], stacking_class: "STACKABLE", eligibility_mode: "ALL", active_from: "2026-06-01T00:00:00Z", active_until: "2026-07-01T00:00:00Z" }
              as: MerchantAdmin
              captures: { promo_id: $.data.id }
            - call: "POST /promotions/${promo_id}/coupons"
              payload: { code: "THR5K", use_mode: "MULTI_USE", max_total_redemptions: 100 }
              as: MerchantAdmin
            - call: "POST /promotions/${promo_id}/activate"
              payload: {}
              as: MerchantAdmin
            - call: "POST /carts"
              payload: { customer_id: "${cust_id}" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { cart_id: $.data.id }
            - call: "POST /carts/${cart_id}/lines"
              payload: { sku: "A", unit_price_cents: 5000, quantity: 1 }
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /carts/${cart_id}/applications"
              payload: { code: "THR5K" }
              as: Shopper
              as_user_id: "${cust_id}"
