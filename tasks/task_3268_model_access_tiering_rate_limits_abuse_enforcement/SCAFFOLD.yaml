# =============================================================================
# SCAFFOLD.yaml — Model Access Tiering, Rate Limits & Abuse Enforcement
# §1.0–§1.7 seed tables. Difficulty: Expert (maximal density). 40 endpoints.
# =============================================================================

scenario: |
  Model Access Tiering, Rate Limits & Abuse Enforcement (Anthropic): organization
  onboarding with usage tier progression based on payment history and spend
  thresholds, rate limits expressed in requests and tokens per minute with burst
  handling and queueing behavior, model version lifecycle with deprecation notices,
  migration windows and pinned version support, usage-based billing with input,
  output and cached token pricing and batch discount options, acceptable use policy
  enforcement through automated classification and human review with graduated
  account actions, appeals and reinstatement for accounts flagged in error,
  enterprise agreements with committed throughput and dedicated capacity, safety
  evaluations gating new capability release to broad availability

domain_name: "model-access-governance"
api_prefix: ""

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - rate_threshold_triggers
    - dual_variant_calculation
    - cascading_side_effects
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - many_to_many
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Organization
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Legal organization name; immutable after creation."
      - name: tier
        type: enum
        source: computed
        description: "Current usage tier. Values: TIER_1, TIER_2, TIER_3, TIER_4, ENTERPRISE. Recomputed by tier_progression whenever lifetime_spend_cents or qualifying_payment_count changes, or when an enterprise agreement activates/expires/terminates."
        default: TIER_1
        constraints: "enum {TIER_1, TIER_2, TIER_3, TIER_4, ENTERPRISE}"
      - name: status
        type: enum
        source: computed
        description: "Organizational lifecycle posture. Values: PROVISIONAL, ACTIVE, RESTRICTED, SUSPENDED, TERMINATED. Driven by onboarding and graduated abuse actions; restored by appeal grant."
        default: PROVISIONAL
        constraints: "enum {PROVISIONAL, ACTIVE, RESTRICTED, SUSPENDED, TERMINATED}"
      - name: lifetime_spend_cents
        type: integer
        source: computed
        description: "Sum of amount_cents across PaymentEvent rows with status == SETTLED for this organization (REFUND amounts are negative and subtract). Recomputed on each payment settlement."
        default: 0
      - name: qualifying_payment_count
        type: integer
        source: computed
        description: "Count of PaymentEvent rows with status == SETTLED and amount_cents >= MIN_QUALIFYING_PAYMENT_CENTS (1000). Tier progression requires both spend and count thresholds."
        default: 0
      - name: pinned_model_version_id
        type: string
        source: input
        description: "FK -> ModelVersion.id; when non-null the organization is locked to that model version and is exempt from automatic migration at deprecation. Settable only at creation; immutable afterwards."
        default: null
        constraints: "nullable; must reference a ModelVersion in status ACTIVE or DEPRECATED"
      - name: enterprise_agreement_id
        type: string
        source: computed
        description: "FK -> EnterpriseAgreement.id; set by agreement countersign, cleared by agreement expiry/termination. While set, organization tier is ENTERPRISE."
        default: null
        constraints: "nullable; FK -> EnterpriseAgreement.id"
      - name: credit_balance_cents
        type: integer
        source: computed
        description: "Prepaid balance. Increases on PaymentEvent settlement with kind == PREPAID_TOPUP; decreases on REFUND settlement and on Invoice finalize (debit = min(total_cents, balance)). May never go negative."
        default: 0

  - name: PaymentEvent
    parent: Organization
    common_fields: false
    fields:
      - name: organization_id
        type: string
        source: input
        description: "FK -> Organization.id; owning organization."
      - name: kind
        type: enum
        source: input
        description: "Payment classification. Values: PREPAID_TOPUP, INVOICE_SETTLEMENT, REFUND."
        constraints: "enum {PREPAID_TOPUP, INVOICE_SETTLEMENT, REFUND}"
      - name: amount_cents
        type: integer
        source: input
        description: "Signed amount. PREPAID_TOPUP and INVOICE_SETTLEMENT are positive; REFUND is negative. Zero is rejected."
      - name: status
        type: enum
        source: computed
        description: "Values: PENDING, SETTLED. PENDING on creation; settles via POST /payment-events/{id}/settle. Immutable and append-only: no update or delete endpoints exist."
        default: PENDING
        constraints: "enum {PENDING, SETTLED}"

  - name: UsageRecord
    parent: Organization
    common_fields: false
    fields:
      - name: organization_id
        type: string
        source: input
        description: "FK -> Organization.id; owning organization."
      - name: model_version_id
        type: string
        source: input
        description: "FK -> ModelVersion.id; the model version the usage was recorded against."
      - name: minute_window_start
        type: datetime
        source: input
        description: "ISO8601 UTC truncated to the minute. Identifies the rate-limit window this usage belongs to; half-open [window_start, window_start + 60s)."
      - name: requests
        type: integer
        source: input
        description: "Number of API requests in this window. Must be >= 0."
      - name: input_tokens
        type: integer
        source: input
        description: "Input (uncached) tokens consumed. Must be >= 0."
      - name: output_tokens
        type: integer
        source: input
        description: "Output tokens generated. Must be >= 0."
      - name: cached_tokens
        type: integer
        source: input
        description: "Cached input tokens (billed at discounted cached rate). Must be >= 0."
      - name: batch
        type: boolean
        source: input
        description: "True when the usage originated from the batch API; batch usage receives the batch discount in billing."
        default: false

  - name: ModelVersion
    parent: null
    common_fields: true
    fields:
      - name: model_slug
        type: string
        source: input
        description: "Human model identifier, e.g. 'claude-sonnet'. Combined with version_tag for uniqueness."
      - name: version_tag
        type: string
        source: input
        description: "Version suffix, e.g. '4-5'. The pair (model_slug, version_tag) is unique among non-SUNSET versions."
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state. Values: DRAFT, GATED, ACTIVE, DEPRECATED, SUNSET. DRAFT on creation; GATED while a safety evaluation is OPEN; ACTIVE on passing verdict; back to DRAFT on failing verdict (revision cycle); DEPRECATED via deprecate; SUNSET is terminal."
        default: DRAFT
        constraints: "enum {DRAFT, GATED, ACTIVE, DEPRECATED, SUNSET}"
      - name: deprecation_announced_at
        type: datetime
        source: computed
        description: "Timestamp when status transitioned ACTIVE -> DEPRECATED. Null until deprecation."
        default: null
      - name: sunset_at
        type: datetime
        source: computed
        description: "Scheduled sunset timestamp = deprecation_announced_at + MIGRATION_WINDOW_DAYS (30 days). Fixed at deprecation; not editable."
        default: null
      - name: pricing
        type: object
        source: input
        description: "Pricing table with keys input_per_mtok_cents, output_per_mtok_cents, cached_per_mtok_cents (each integer >= 0). Cached rate must be strictly less than input rate."
      - name: safety_evaluation_id
        type: string
        source: computed
        description: "FK -> SafetyEvaluation.id; the most recently opened evaluation for this version. Set when an evaluation is opened; null before."
        default: null
        constraints: "nullable; FK -> SafetyEvaluation.id"

  - name: SafetyEvaluation
    parent: ModelVersion
    common_fields: true
    fields:
      - name: model_version_id
        type: string
        source: input
        description: "FK -> ModelVersion.id; the model version under evaluation. At most one OPEN SafetyEvaluation per model version."
      - name: capability_class
        type: enum
        source: input
        description: "Capability tier under review. Values: STANDARD, ELEVATED, FRONTIER. FRONTIER requires PASS score >= 0.90, others >= 0.70."
        constraints: "enum {STANDARD, ELEVATED, FRONTIER}"
      - name: status
        type: enum
        source: computed
        description: "Values: OPEN, PASSED, FAILED. OPEN on creation; PASSED/FAILED via submit-verdict. Both PASSED and FAILED are terminal; a failed model returns to DRAFT and may be re-evaluated by opening a new evaluation."
        default: OPEN
        constraints: "enum {OPEN, PASSED, FAILED}"
      - name: score
        type: number
        source: input
        description: "Aggregate safety score in [0.0, 1.0], recorded at verdict time. Required input to submit-verdict; null while OPEN."
        default: null
      - name: verdict_by
        type: string
        source: computed
        description: "X-User-ID of the TrustLead who submitted the verdict. Segregation of duties: verdict_by must not equal the X-User-ID that opened the evaluation."
        default: null

  - name: EnterpriseAgreement
    parent: null
    common_fields: true
    fields:
      - name: organization_id
        type: string
        source: input
        description: "FK -> Organization.id; the counterparty organization. At most one ACTIVE agreement per organization."
      - name: status
        type: enum
        source: computed
        description: "Values: DRAFT, ACTIVE, EXPIRED, TERMINATED. DRAFT on creation; activates via countersign; expires at expires_at (clock-driven); TERMINATED only as cascade from Organization SUSPENDED/TERMINATED."
        default: DRAFT
        constraints: "enum {DRAFT, ACTIVE, EXPIRED, TERMINATED}"
      - name: committed_tpm
        type: integer
        source: input
        description: "Committed tokens-per-minute throughput. Must be > 0."
      - name: dedicated_capacity_pct
        type: integer
        source: input
        description: "Percentage [1..100] of the organization's model traffic that must be served on dedicated capacity."
      - name: effective_at
        type: datetime
        source: input
        description: "Agreement effective timestamp. Must be strictly before expires_at."
      - name: expires_at
        type: datetime
        source: input
        description: "Agreement expiry timestamp. Status auto-transitions ACTIVE -> EXPIRED when the logical clock reaches this instant (evaluated on POST /_clock/set_current_utc)."
      - name: price_override
        type: object
        source: input
        description: "Optional per-token price override with same keys as ModelVersion.pricing. When present on an ACTIVE agreement, billing for the organization uses these rates instead of the model's list pricing."
        default: null

  - name: RateLimitWindow
    parent: Organization
    common_fields: false
    fields:
      - name: organization_id
        type: string
        source: input
        description: "FK -> Organization.id; organization the window tracks."
      - name: model_version_id
        type: string
        source: input
        description: "Model version scope for the window (one window per organization, model_version_id, minute). References ModelVersion.id; scoped lookup only, not a navigable association."
      - name: window_start
        type: datetime
        source: input
        description: "Minute-aligned start of the window. Windows are half-open [window_start, window_start + 60s)."
      - name: requests_used
        type: integer
        source: computed
        description: "Requests admitted into this window so far (direct + dequeued)."
        default: 0
      - name: tokens_used
        type: integer
        source: computed
        description: "Tokens (input + output + cached) admitted into this window so far."
        default: 0
      - name: burst_credits_used
        type: integer
        source: computed
        description: "Burst credits consumed in this window. Burst pool = BURST_MULTIPLIER * effective rpm, refilled at each window roll."
        default: 0

  - name: QueuedRequest
    parent: Organization
    common_fields: true
    fields:
      - name: organization_id
        type: string
        source: input
        description: "FK -> Organization.id; queue is per (organization, model_version)."
      - name: model_version_id
        type: string
        source: input
        description: "Model version the request targets. References ModelVersion.id; scoped lookup only, not a navigable association."
      - name: requests_cost
        type: integer
        source: input
        description: "Request slots this queued item consumes when dequeued (>= 1)."
      - name: tokens_cost
        type: integer
        source: input
        description: "Token budget this queued item consumes when dequeued (>= 1)."
      - name: status
        type: enum
        source: computed
        description: "Values: QUEUED, ADMITTED, EXPIRED, DROPPED. QUEUED on creation; ADMITTED at a window roll when head-of-line fits; EXPIRED after QUEUE_TTL_SECONDS (120s) without admission; DROPPED by cascade when the organization is RESTRICTED/SUSPENDED/TERMINATED."
        default: QUEUED
        constraints: "enum {QUEUED, ADMITTED, EXPIRED, DROPPED}"
      - name: enqueued_at
        type: datetime
        source: computed
        description: "Logical-clock timestamp at enqueue. Expiry = enqueued_at + 120s, evaluated on POST /_clock/set_current_utc."

  - name: Invoice
    parent: Organization
    common_fields: true
    fields:
      - name: organization_id
        type: string
        source: input
        description: "FK -> Organization.id; billed organization."
      - name: period_start
        type: datetime
        source: input
        description: "Inclusive start of the billing period."
      - name: period_end
        type: datetime
        source: input
        description: "Exclusive end of the billing period. Must be strictly after period_start. Periods for one organization may not overlap (closed-open interval check)."
      - name: status
        type: enum
        source: computed
        description: "Values: DRAFT, FINALIZED. DRAFT on creation; FINALIZED via finalize (terminal) which computes line amounts, discount, totals, and debits credit balance."
        default: DRAFT
        constraints: "enum {DRAFT, FINALIZED}"
      - name: subtotal_cents
        type: integer
        source: computed
        description: "Sum of InvoiceLine.amount_cents before discounts. Computed at finalize."
        default: 0
      - name: batch_discount_cents
        type: integer
        source: computed
        description: "Discount applied to batch-originated lines. Computed at finalize per batch_discount rule."
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: "subtotal_cents - batch_discount_cents. Floored at 0. Computed at finalize."
        default: 0

  - name: InvoiceLine
    parent: Invoice
    common_fields: false
    fields:
      - name: invoice_id
        type: string
        source: input
        description: "FK -> Invoice.id; owning invoice. Lines are supplied as an array on POST /invoices and materialized with the invoice."
      - name: model_version_id
        type: string
        source: input
        description: "FK -> ModelVersion.id; model whose usage this line prices."
      - name: kind
        type: enum
        source: input
        description: "Line kind. Values: INPUT_TOKENS, OUTPUT_TOKENS, CACHED_TOKENS."
        constraints: "enum {INPUT_TOKENS, OUTPUT_TOKENS, CACHED_TOKENS}"
      - name: quantity
        type: integer
        source: input
        description: "Token quantity priced by this line (>= 0)."
      - name: rate_per_mtok_cents
        type: integer
        source: input
        description: "Rate applied per million tokens, from the governing price table (model list price or enterprise override)."
      - name: batch
        type: boolean
        source: input
        description: "Whether the line prices batch-API usage; batch lines receive the batch discount at invoice finalize."
        default: false
      - name: amount_cents
        type: integer
        source: computed
        description: "Line amount = round_half_up(quantity * rate_per_mtok_cents / 1_000_000), rounded per-line BEFORE summing. Pinned rounding order: round per line, then sum into Invoice.subtotal_cents. Null until finalize."

  - name: AbuseCase
    parent: Organization
    common_fields: true
    fields:
      - name: organization_id
        type: string
        source: input
        description: "FK -> Organization.id; accused organization."
      - name: source
        type: enum
        source: input
        description: "Detection source. Values: AUTOMATED, MANUAL. AUTOMATED cases auto-escalate when classifier_confidence >= AUTO_ACTION_THRESHOLD (0.95)."
        constraints: "enum {AUTOMATED, MANUAL}"
      - name: classifier_confidence
        type: number
        source: input
        description: "Classifier confidence in [0.0, 1.0]. Required when source == AUTOMATED; null otherwise."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Values: OPEN, UNDER_REVIEW, ACTIONED, REINSTATED. OPEN on creation; UNDER_REVIEW on claim; ACTIONED when a graduated action is issued; REINSTATED (terminal) when an appeal is granted."
        default: OPEN
        constraints: "enum {OPEN, UNDER_REVIEW, ACTIONED, REINSTATED}"
      - name: severity
        type: enum
        source: input
        description: "Case severity. Values: LOW, MEDIUM, HIGH, CRITICAL. Determines which graduated actions are available (action rank must be <= severity rank)."
        constraints: "enum {LOW, MEDIUM, HIGH, CRITICAL}"
      - name: assigned_analyst_id
        type: string
        source: computed
        description: "X-User-ID of the TrustAnalyst currently holding the case. Set by claim."
        default: null

  - name: AbuseAction
    parent: AbuseCase
    common_fields: false
    fields:
      - name: abuse_case_id
        type: string
        source: input
        description: "FK -> AbuseCase.id; the case this action enforces."
      - name: action_type
        type: enum
        source: input
        description: "Graduated action. Values: WARN, THROTTLE, RESTRICT, SUSPEND, TERMINATE. Strictly ordered by severity rank; only actions with rank <= case severity rank are issuable."
        constraints: "enum {WARN, THROTTLE, RESTRICT, SUSPEND, TERMINATE}"
      - name: issued_by
        type: string
        source: computed
        description: "X-User-ID of the issuing TrustAnalyst or TrustLead."
      - name: revoked_at
        type: datetime
        source: computed
        description: "Timestamp the action was revoked (on appeal grant). Null while effective."
        default: null

  - name: Appeal
    parent: AbuseCase
    common_fields: true
    fields:
      - name: abuse_case_id
        type: string
        source: input
        description: "FK -> AbuseCase.id; the case under appeal. At most one Appeal in status PENDING per case."
      - name: submitted_by
        type: string
        source: computed
        description: "X-User-ID of the OrganizationAdmin who filed the appeal. Must equal the accused organization's id."
      - name: status
        type: enum
        source: computed
        description: "Values: PENDING, GRANTED. PENDING on creation; GRANTED by TrustLead verdict (a different user than the action issuer). GRANTED is terminal."
        default: PENDING
        constraints: "enum {PENDING, GRANTED}"
      - name: resolved_by
        type: string
        source: computed
        description: "X-User-ID of the resolving TrustLead. Segregation: resolved_by must differ from the appealed AbuseAction.issued_by."
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Organization
    initial_state: PROVISIONAL
    terminal_states: [TERMINATED]
    transitions:
      - from: PROVISIONAL
        to: ACTIVE
        trigger: "POST /organizations/{id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "organization.status == PROVISIONAL"
          - "at least one PaymentEvent for the organization has status == SETTLED"
        side_effects:
          - "recompute Organization.tier via tier_progression"
          - "increments Organization.version by 1"
      - from: ACTIVE
        to: RESTRICTED
        trigger: "POST /abuse-cases/{id}/actions with action_type == RESTRICT"
        actor: TrustAnalyst
        preconditions:
          - "case.status == UNDER_REVIEW"
          - "case.severity rank >= RESTRICT rank"
        side_effects:
          - "create AbuseAction row on the case"
          - "cascade: every QueuedRequest with organization_id == org and status == QUEUED transitions to DROPPED"
          - "increments Organization.version by 1"
      - from: RESTRICTED
        to: SUSPENDED
        trigger: "POST /abuse-cases/{id}/actions with action_type == SUSPEND"
        actor: TrustAnalyst
        preconditions:
          - "case.status == UNDER_REVIEW"
          - "case.severity rank >= SUSPEND rank (HIGH or CRITICAL)"
        side_effects:
          - "create AbuseAction row on the case"
          - "cascade: all ACTIVE EnterpriseAgreement rows for the organization transition to TERMINATED"
          - "increments Organization.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /appeals/{id}/grant"
        actor: TrustLead
        preconditions:
          - "appeal.status == PENDING"
          - "appeal.resolved_by != appealed AbuseAction.issued_by (segregation of duties)"
        side_effects:
          - "appeal.status := GRANTED"
          - "revoke the appealed AbuseAction (revoked_at := now)"
          - "case.status := REINSTATED"
          - "increments Organization.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /abuse-cases/{id}/actions with action_type == TERMINATE"
        actor: TrustLead
        preconditions:
          - "case.status == UNDER_REVIEW"
          - "case.severity == CRITICAL"
        side_effects:
          - "create AbuseAction row on the case"
          - "cascade: all EnterpriseAgreement rows for the organization in {DRAFT, ACTIVE} transition to TERMINATED"
          - "cascade: all QueuedRequest rows in QUEUED transition to DROPPED"
          - "increments Organization.version by 1"
      - from: RESTRICTED
        to: ACTIVE
        trigger: "POST /appeals/{id}/grant"
        actor: TrustLead
        preconditions:
          - "appeal.status == PENDING"
          - "appeal.resolved_by != appealed AbuseAction.issued_by"
        side_effects:
          - "appeal.status := GRANTED"
          - "revoke the appealed AbuseAction"
          - "case.status := REINSTATED"
          - "increments Organization.version by 1"

  - entity: ModelVersion
    initial_state: DRAFT
    terminal_states: [SUNSET]
    transitions:
      - from: DRAFT
        to: GATED
        trigger: "POST /model-versions/{id}/safety-evaluations (opens evaluation)"
        actor: TrustAnalyst
        preconditions:
          - "model_version.status == DRAFT"
          - "no other SafetyEvaluation with model_version_id == this.id and status == OPEN"
        side_effects:
          - "create SafetyEvaluation row with status OPEN"
          - "set ModelVersion.safety_evaluation_id to the new evaluation id"
          - "increments ModelVersion.version by 1"
      - from: GATED
        to: ACTIVE
        trigger: "POST /safety-evaluations/{id}/submit-verdict with passing score"
        actor: TrustLead
        preconditions:
          - "evaluation.status == OPEN"
          - "score >= PASS threshold for capability_class (0.70 STANDARD/ELEVATED, 0.90 FRONTIER)"
          - "verdict_by (TrustLead X-User-ID) != evaluation opener's X-User-ID"
        side_effects:
          - "evaluation.status := PASSED"
          - "evaluation.verdict_by := current TrustLead"
          - "increments ModelVersion.version by 1"
      - from: GATED
        to: DRAFT
        trigger: "POST /safety-evaluations/{id}/submit-verdict with failing score"
        actor: TrustLead
        preconditions:
          - "evaluation.status == OPEN"
          - "score < PASS threshold for capability_class"
        side_effects:
          - "evaluation.status := FAILED"
          - "ModelVersion returns to DRAFT; a new evaluation may be opened (revision cycle)"
          - "increments ModelVersion.version by 1"
      - from: ACTIVE
        to: DEPRECATED
        trigger: "POST /model-versions/{id}/deprecate"
        actor: PlatformAdmin
        preconditions:
          - "model_version.status == ACTIVE"
        side_effects:
          - "deprecation_announced_at := now"
          - "sunset_at := now + 30 days"
          - "increments ModelVersion.version by 1"
      - from: DEPRECATED
        to: SUNSET
        trigger: "system auto-transition when logical clock >= sunset_at (evaluated on POST /_clock/set_current_utc)"
        actor: system
        preconditions:
          - "current_utc >= sunset_at"
        side_effects:
          - "UsageRecord creation against this version is rejected after sunset"
          - "organizations with pinned_model_version_id == this.id retain pinned access"

  - entity: SafetyEvaluation
    initial_state: OPEN
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: OPEN
        to: PASSED
        trigger: "POST /safety-evaluations/{id}/submit-verdict"
        actor: TrustLead
        preconditions:
          - "score >= threshold for capability_class"
          - "verdict_by != evaluation opener"
        side_effects:
          - "parent ModelVersion transitions GATED -> ACTIVE"
      - from: OPEN
        to: FAILED
        trigger: "POST /safety-evaluations/{id}/submit-verdict"
        actor: TrustLead
        preconditions:
          - "score < threshold for capability_class"
          - "verdict_by != evaluation opener"
        side_effects:
          - "parent ModelVersion transitions GATED -> DRAFT"

  - entity: PaymentEvent
    initial_state: PENDING
    terminal_states: [SETTLED]
    transitions:
      - from: PENDING
        to: SETTLED
        trigger: "POST /payment-events/{id}/settle"
        actor: PlatformAdmin
        preconditions:
          - "payment.status == PENDING"
          - "organization.status NOT IN {TERMINATED}"
        side_effects:
          - "Organization.lifetime_spend_cents += amount_cents (REFUND amounts are negative and subtract)"
          - "Organization.qualifying_payment_count += 1 when amount_cents >= 1000 (never for REFUND, whose amount is negative)"
          - "if kind == PREPAID_TOPUP: Organization.credit_balance_cents += amount_cents"
          - "if kind == REFUND: Organization.credit_balance_cents += amount_cents (negative; floored at 0)"
          - "recompute Organization.tier via tier_progression"
          - "increments Organization.version by 1"

  - entity: QueuedRequest
    initial_state: QUEUED
    terminal_states: [ADMITTED, EXPIRED, DROPPED]
    transitions:
      - from: QUEUED
        to: ADMITTED
        trigger: "system dequeue evaluated on POST /_clock/set_current_utc: at each minute boundary a new window opens and the head-of-line item (ordered by enqueued_at ASC) is admitted while residual capacity covers it"
        actor: system
        preconditions:
          - "head-of-line for (organization_id, model_version_id) queue ordered by enqueued_at ASC"
          - "target RateLimitWindow has residual request AND token capacity for this item"
        side_effects:
          - "RateLimitWindow.requests_used += requests_cost"
          - "RateLimitWindow.tokens_used += tokens_cost"
      - from: QUEUED
        to: EXPIRED
        trigger: "system auto-transition evaluated on POST /_clock/set_current_utc at enqueued_at + 120s"
        actor: system
        preconditions:
          - "current_utc >= enqueued_at + 120s"
        side_effects: []
      - from: QUEUED
        to: DROPPED
        trigger: "cascade from Organization RESTRICTED/SUSPENDED/TERMINATED"
        actor: system
        preconditions:
          - "organization transitions to one of RESTRICTED, SUSPENDED, TERMINATED"
        side_effects: []

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /invoices/{id}/finalize"
        actor: BillingContact
        preconditions:
          - "invoice.status == DRAFT"
          - "organization.status NOT IN {TERMINATED}"
        side_effects:
          - "compute InvoiceLine.amount_cents per line (round per line, round_half_up)"
          - "subtotal_cents := sum(amount_cents)"
          - "batch_discount_cents := per batch_discount rule"
          - "total_cents := max(0, subtotal_cents - batch_discount_cents)"
          - "debit Organization.credit_balance_cents by min(total_cents, balance); remainder becomes payable"
          - "increments Invoice.version by 1"

  - entity: AbuseCase
    initial_state: OPEN
    terminal_states: [REINSTATED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /abuse-cases/{id}/claim"
        actor: TrustAnalyst
        preconditions:
          - "case.status == OPEN"
          - "case.assigned_analyst_id IS NULL"
        side_effects:
          - "case.assigned_analyst_id := caller X-User-ID"
          - "increments AbuseCase.version by 1"
      - from: UNDER_REVIEW
        to: ACTIONED
        trigger: "POST /abuse-cases/{id}/actions"
        actor: TrustAnalyst
        preconditions:
          - "case.status == UNDER_REVIEW"
          - "caller X-User-ID == case.assigned_analyst_id"
          - "action_type rank <= case.severity rank"
        side_effects:
          - "create AbuseAction row"
          - "cascade to Organization status per action_type"
          - "if action_type == THROTTLE: reduce Organization's effective rate limits to 25% until revoked"
          - "increments AbuseCase.version by 1"
      - from: ACTIONED
        to: REINSTATED
        trigger: "POST /appeals/{id}/grant"
        actor: TrustLead
        preconditions:
          - "appeal.status == PENDING and abuse_case_id == case.id"
          - "resolved_by != appealed AbuseAction.issued_by"
        side_effects:
          - "appeal.status := GRANTED"
          - "revoke the appealed AbuseAction"
          - "cascade: Organization status returns to its pre-action posture"

  - entity: Appeal
    initial_state: PENDING
    terminal_states: [GRANTED]
    transitions:
      - from: PENDING
        to: GRANTED
        trigger: "POST /appeals/{id}/grant"
        actor: TrustLead
        preconditions:
          - "appeal.status == PENDING"
          - "resolved_by != appealed AbuseAction.issued_by"
        side_effects:
          - "case.status := REINSTATED"
          - "Organization status restored"
          - "increments Appeal.version by 1"

  - entity: EnterpriseAgreement
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /enterprise-agreements/{id}/countersign"
        actor: PlatformAdmin
        preconditions:
          - "agreement.status == DRAFT"
          - "organization.status == ACTIVE"
          - "effective_at <= current_utc < expires_at"
        side_effects:
          - "Organization.enterprise_agreement_id := agreement.id"
          - "Organization.tier := ENTERPRISE (overrides tier_progression until agreement terminates)"
          - "increments EnterpriseAgreement.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system auto-transition at expires_at (evaluated on POST /_clock/set_current_utc)"
        actor: system
        preconditions:
          - "current_utc >= expires_at"
        side_effects:
          - "Organization.enterprise_agreement_id := NULL"
          - "recompute Organization.tier via tier_progression (falls back from ENTERPRISE)"
          - "increments Organization.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "cascade from Organization SUSPENDED/TERMINATED"
        actor: system
        preconditions:
          - "agreement.status == ACTIVE"
        side_effects:
          - "Organization.enterprise_agreement_id := NULL"
          - "recompute Organization.tier via tier_progression"
          - "increments Organization.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: case-action-stale-version
    parent_entity: AbuseCase
    write_endpoint: "POST /abuse-cases/{id}/actions"
    occ_field: "expected_abuse_case_version"
    description: |
      Issuing an AbuseAction against an AbuseCase whose version has advanced
      since the issuing analyst last observed it is rejected with
      ERR_STALE_VERSION. Captures the case where a second action was just
      recorded on the case (which legitimately supersedes the analyst's stale
      view under the graduated-action ordering).
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: tier_progression
    trigger: "On PaymentEvent settlement, on EnterpriseAgreement activation/expiry/termination, and on Organization activation."
    algorithm: threshold
    formula: |
      # Inputs: Organization.lifetime_spend_cents, Organization.qualifying_payment_count,
      #         Organization.enterprise_agreement_id (resolved against ACTIVE agreements)
      # Thresholds (cumulative, both must be met):
      #   TIER_2: spend >= 5_000_000   AND count >= 5
      #   TIER_3: spend >= 25_000_000  AND count >= 25
      #   TIER_4: spend >= 100_000_000 AND count >= 100
      # ENTERPRISE: any ACTIVE EnterpriseAgreement overrides the computed tier.
      # Tier may move up or down (refunds reduce lifetime_spend_cents); the
      # recomputed tier replaces the previous value, except ENTERPRISE which
      # requires the agreement to remain ACTIVE.
      if organization has ACTIVE enterprise agreement:
          return ENTERPRISE
      spend = lifetime_spend_cents; count = qualifying_payment_count
      if spend >= 100_000_000 and count >= 100: return TIER_4
      if spend >= 25_000_000  and count >= 25:  return TIER_3
      if spend >= 5_000_000   and count >= 5:   return TIER_2
      return TIER_1
    input_set: "Single Organization row; uses its computed aggregates."
    constants:
      TIER_2_SPEND: 5000000
      TIER_2_COUNT: 5
      TIER_3_SPEND: 25000000
      TIER_3_COUNT: 25
      TIER_4_SPEND: 100000000
      TIER_4_COUNT: 100
      MIN_QUALIFYING_PAYMENT_CENTS: 1000
    precision: "integer comparisons; boundary is >= (inclusive)"
    variants:
      - name: forward_looking
        when: "Computed on demand by GET /organizations/{id} with preview=true"
        difference: "Includes PENDING PaymentEvents as if they will settle; produces a projected tier that may exceed the settled tier. Returned only in the preview response; never persisted."
      - name: settled_only
        when: "Authoritative tier persisted on Organization"
        difference: "Counts only SETTLED PaymentEvents; refunds subtract from spend."

  - name: rate_limit_for_window
    trigger: "On request admission into a RateLimitWindow (POST /usage-records) and on queue admission at window roll."
    algorithm: threshold
    formula: |
      # Tier base rates (requests per minute, tokens per minute):
      tier_caps = {
        TIER_1:     { rpm: 50,   tpm: 50_000 },
        TIER_2:     { rpm: 200,  tpm: 200_000 },
        TIER_3:     { rpm: 1000, tpm: 1_000_000 },
        TIER_4:     { rpm: 4000, tpm: 4_000_000 },
      }
      # ENTERPRISE: tpm = agreement.committed_tpm;
      #             rpm = ceil(committed_tpm / AVG_TOKENS_PER_REQUEST),
      #             AVG_TOKENS_PER_REQUEST = 1000.
      # THROTTLE (active unrevoked AbuseAction of type THROTTLE on any ACTIONED
      # case for this org): multiply both rpm and tpm by 0.25, floor, min 1.
      # Throttle applies to the BASE cap BEFORE burst pool sizing:
      #   burst_pool = BURST_MULTIPLIER * effective_rpm   (after throttle)
      # Admission test for a request of (r, t):
      #   admit if requests_used + r <= rpm  AND  tokens_used + t <= tpm
      # Burst: if admission fails but burst pool has remaining credit, consume
      # burst credits; each burst credit covers exactly 1 request slot OR 1
      # token slot. Otherwise the request is rejected ERR_RATE_LIMITED.
    input_set: "Organization.tier, active unrevoked THROTTLE AbuseActions, current RateLimitWindow, ACTIVE EnterpriseAgreement if any."
    constants:
      BURST_MULTIPLIER: 2
      AVG_TOKENS_PER_REQUEST: 1000
      THROTTLE_FACTOR: 0.25
      QUEUE_TTL_SECONDS: 120
      QUEUE_MAX_DEPTH: 100
    precision: "integer arithmetic; floor for throttled caps"
    variants:
      - name: instantaneous
        when: "Admission against the current minute window only"
        difference: "Hard ceiling on (rpm, tpm); no lookback across windows."
      - name: cumulative
        when: "Sustained-overload detection feeding automated abuse signals"
        difference: "Sums usage over the trailing 10-minute tumbling windows; an organization whose cumulative usage exceeds 3x its tier cap for 3 consecutive windows is flagged for automated classification."

  - name: batch_discount
    trigger: "On Invoice finalize."
    algorithm: tiered_pricing
    formula: |
      # For each InvoiceLine with batch == true:
      #   discount_contribution = line.amount_cents * BATCH_DISCOUNT_PCT
      # Sum contributions, then round-half-up ONCE at the invoice level
      # (rounding order pinned: per-line amounts are already rounded; the
      # discount is computed on those rounded line amounts and rounded once
      # more at aggregate).
      # BATCH_DISCOUNT_PCT = 0.50
      batch_discount_cents = round_half_up(
          sum(line.amount_cents for line in lines if line.batch) * 0.50
      )
    input_set: "InvoiceLine rows of the invoice with batch == true; line.amount_cents already finalized per the per-line rounding rule."
    constants:
      BATCH_DISCOUNT_PCT: 0.5
    precision: "round-half-up at the invoice level only; no further rounding of line amounts"
    variants:
      - name: provisional_estimate
        when: "Recomputed on demand while invoice is DRAFT"
        difference: "Computed on current DRAFT lines; never persisted. Adding lines before finalize changes the finalized discount — the provisional value is not sticky."
      - name: finalized
        when: "At POST /invoices/{id}/finalize"
        difference: "Locks amounts and discount onto the Invoice row."

  - name: invoice_pricing
    trigger: "On Invoice finalize — computes per-line amounts."
    algorithm: tiered_pricing
    formula: |
      # For each InvoiceLine on the invoice:
      #   amount_cents = round_half_up(quantity * rate_per_mtok_cents / 1_000_000)
      # Invoice.subtotal_cents = sum(amount_cents over all lines)
      # PINNED ROUNDING ORDER: round each line first, then sum. The alternative
      # (sum quantities then round) yields different cents and is forbidden.
      # The governing rate for a line is the input-supplied rate_per_mtok_cents,
      # which the caller derives from EnterpriseAgreement.price_override (when
      # present on an ACTIVE agreement) or ModelVersion.pricing.
    input_set: "InvoiceLine rows of the invoice (supplied on POST /invoices)."
    constants: {}
    precision: "integer cents; per-line round-half-up then integer sum"

  - name: safety_gate_threshold
    trigger: "On SafetyEvaluation submit-verdict."
    algorithm: weighted_scoring
    formula: |
      # Inputs: score (single number in [0, 1]), capability_class
      # PASS thresholds: STANDARD >= 0.70, ELEVATED >= 0.70, FRONTIER >= 0.90
      # Boundary is INCLUSIVE (>=). A score exactly equal to threshold passes.
      threshold = 0.90 if capability_class == "FRONTIER" else 0.70
      verdict = PASS if score >= threshold else FAIL
    input_set: "Single SafetyEvaluation row."
    constants:
      STANDARD_PASS: 0.70
      ELEVATED_PASS: 0.70
      FRONTIER_PASS: 0.90
    precision: "score compared as decimal; no rounding applied to score before comparison"
    variants:
      - name: automated_classifier_analog
        when: "AUTOMATED AbuseCase auto-escalation decision (separate domain)"
        difference: "Uses classifier_confidence >= 0.95 (AUTO_ACTION_THRESHOLD) on a different entity (AbuseCase), not SafetyEvaluation — demonstrating threshold semantics on a distinct metric."

  - name: abuse_auto_escalation
    trigger: "On AbuseCase creation with source == AUTOMATED."
    algorithm: threshold
    formula: |
      # If classifier_confidence >= AUTO_ACTION_THRESHOLD (0.95):
      #   immediately issue a THROTTLE AbuseAction (system actor) and move case
      #   directly OPEN -> ACTIONED, cascading THROTTLE effects to Organization.
      # Else: case remains OPEN awaiting human claim.
      if classifier_confidence >= 0.95:
          auto-issue THROTTLE action, transition to ACTIONED
      else:
          remain OPEN
    input_set: "Newly created AbuseCase row."
    constants:
      AUTO_ACTION_THRESHOLD: 0.95
    precision: "boundary is >= (inclusive)"
    variants:
      - name: automated
        when: "source == AUTOMATED"
        difference: "Threshold-driven auto-action by the system actor."
      - name: manual
        when: "source == MANUAL"
        difference: "No auto-escalation; classifier_confidence ignored even if supplied."

  - name: migration_window_eligibility
    trigger: "On ModelVersion deprecation — determines which organizations must migrate and when pinned access applies."
    algorithm: forward_looking
    formula: |
      # On ModelVersion ACTIVE -> DEPRECATED:
      #   sunset_at = deprecation_announced_at + 30 days
      # Organizations with pinned_model_version_id == this.id:
      #   retain access past sunset (pinned support)
      # Organizations WITHOUT pin and with any UsageRecord against this model
      # in the trailing 30 days before deprecation:
      #   enter migration window; new usage on the deprecated version is
      #   permitted until sunset_at, rejected after.
      # Organizations WITHOUT pin and WITHOUT recent usage:
      #   immediately blocked from new usage on the deprecated version.
    input_set: "ModelVersion row being deprecated; Organization rows with UsageRecords against it in the 30-day lookback."
    constants:
      MIGRATION_WINDOW_DAYS: 30
      LOOKBACK_DAYS: 30
    precision: "day-granularity timestamps compared as ISO8601 UTC"
    variants:
      - name: pinned
        when: "Organization.pinned_model_version_id == deprecated model id"
        difference: "Access retained indefinitely past sunset."
      - name: unpinned_recent_user
        when: "Has usage in trailing 30 days"
        difference: "Access until sunset_at, then hard block."
      - name: unpinned_no_recent
        when: "No usage in trailing 30 days"
        difference: "Blocked immediately upon deprecation."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Caller role is authorized for the endpoint per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-template resources exist, validated left-to-right (organization, then child)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Required request-body fields present and well-typed; enum values in declared set"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 5
    category: state
    check: "Target resource state machine permits the requested transition from its current state"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: state
    check: "OCC: expected_abuse_case_version matches the AbuseCase's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /abuse-cases/{id}/actions"

  - priority: 7
    category: business_safety
    check: "Segregation of duties: safety verdict_by must differ from evaluation opener; appeal resolver must differ from the appealed action issuer"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /safety-evaluations/{id}/submit-verdict, POST /appeals/{id}/grant"

  - priority: 8
    category: business_safety
    check: "UsageRecord may not be created against a SUNSET ModelVersion, or against a DEPRECATED ModelVersion by an unpinned organization without recent usage"
    error_id: ERR_MODEL_UNAVAILABLE
    http_status: 422
    applies_to: "POST /usage-records"

  - priority: 9
    category: business_constraint
    check: "Organization status must permit the operation: TERMINATED blocks all new usage/payments; SUSPENDED blocks new usage; RESTRICTED blocks new queued admissions"
    error_id: ERR_ORG_STATUS_BLOCKED
    http_status: 422
    applies_to: "POST /usage-records, POST /payment-events, POST /queued-requests"

  - priority: 10
    category: business_constraint
    check: "Invoice period [period_start, period_end) does not overlap any existing non-FINALIZED-or-any invoice for the same organization (closed-open interval test over all existing invoices)"
    error_id: ERR_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /invoices"

  - priority: 11
    category: business_constraint
    check: "AbuseCase has at most one Appeal in PENDING status; second appeal attempt rejected"
    error_id: ERR_APPEAL_ALREADY_PENDING
    http_status: 409
    applies_to: "POST /appeals"

  - priority: 12
    category: business_constraint
    check: "ModelVersion (model_slug, version_tag) pair unique across non-SUNSET versions"
    error_id: ERR_DUPLICATE_MODEL_VERSION
    http_status: 409
    applies_to: "POST /model-versions"

  - priority: 13
    category: business_constraint
    check: "EnterpriseAgreement effective_at strictly before expires_at; at most one ACTIVE agreement per organization"
    error_id: ERR_AGREEMENT_CONFLICT
    http_status: 422
    applies_to: "POST /enterprise-agreements, POST /enterprise-agreements/{id}/countersign"

  - priority: 14
    category: business_fiscal
    check: "PaymentEvent amount_cents non-zero; kind sign convention respected (REFUND negative, others positive)"
    error_id: ERR_INVALID_AMOUNT
    http_status: 422
    applies_to: "POST /payment-events"

  - priority: 15
    category: business_fiscal
    check: "Organization.credit_balance_cents may not go negative on invoice finalize (debit is min(total_cents, balance) so underflow cannot occur; the rule guards any implementation path that would debit more)"
    error_id: ERR_INSUFFICIENT_CREDIT
    http_status: 422
    applies_to: "POST /invoices/{id}/finalize"

  - priority: 16
    category: business_fiscal
    check: "RateLimitWindow admission: requests_used + r <= rpm AND tokens_used + t <= tpm after throttle/burst adjustments; queue depth below QUEUE_MAX_DEPTH"
    error_id: ERR_RATE_LIMITED
    http_status: 429
    applies_to: "POST /usage-records, POST /queued-requests"

  - priority: 17
    category: business_referential
    check: "Appeal filer (X-User-ID) equals the accused organization's id"
    error_id: ERR_APPEAL_FORBIDDEN
    http_status: 403
    applies_to: "POST /appeals"

  - priority: 18
    category: business_referential
    check: "AbuseCase action issuer is the currently assigned analyst; action_type rank <= case severity rank"
    error_id: ERR_ACTION_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /abuse-cases/{id}/actions"

  - priority: 19
    category: business_temporal
    check: "Logical clock comparisons: agreement effective_at/expires_at, model sunset_at, queue TTL, invoice period ordering — all use the logical clock, never wall-clock"
    error_id: ERR_TEMPORAL_INVALID
    http_status: 422
    applies_to: "all"

# =============================================================================
# §1.5 API Endpoint Table (40 endpoints)
# =============================================================================
endpoints:

  # --- clock & system ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the logical clock. Server startup default is 2026-09-01T00:00:00Z; before any set_current_utc call the logical clock reads exactly this default and never falls back to wall-clock time. Setting the clock re-evaluates all time-driven auto-transitions: agreement expiry, model sunset, queue TTL expiry, and queue admission at each minute boundary crossed."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["re-evaluate time-driven auto-transitions (agreement expiry, model sunset, queue TTL, queue admission at minute boundaries)"]

  # --- organizations ---
  - method: POST
    path: "/organizations"
    description: "Onboard a new organization in PROVISIONAL status."
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, "pinned_model_version_id?"]
    output: Organization
    side_effects: ["initialize aggregates to zero"]

  - method: GET
    path: "/organizations"
    description: "List organizations; filter by status, tier, pinned_model_version_id, or enterprise_agreement_id (reverse-reachability for both Organization FKs)."
    roles: [PlatformAdmin, TrustAnalyst, TrustLead, BillingContact, OrganizationAdmin]
    code: 200
    input: ["status?", "tier?", "pinned_model_version_id?", "enterprise_agreement_id?", "limit?", "offset?"]
    output: Organization[]
    side_effects: []

  - method: GET
    path: "/organizations/{id}"
    description: "Fetch a single organization. With preview=true, the returned tier is the forward-looking projection (counts PENDING payments); otherwise the persisted settled tier."
    roles: [PlatformAdmin, TrustAnalyst, TrustLead, BillingContact, OrganizationAdmin]
    code: 200
    input: ["preview?"]
    output: Organization
    side_effects: []

  - method: POST
    path: "/organizations/{id}/activate"
    description: "Transition PROVISIONAL -> ACTIVE; requires at least one settled payment."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Organization
    side_effects: ["tier_progression recompute", "increments Organization.version by 1"]

  - method: GET
    path: "/organizations/{id}/payment-events"
    description: "Reverse-reachability: list payment events for an organization."
    roles: [PlatformAdmin, BillingContact, OrganizationAdmin]
    code: 200
    input: ["status?", "kind?", "limit?", "offset?"]
    output: PaymentEvent[]
    side_effects: []

  - method: GET
    path: "/organizations/{id}/usage-records"
    description: "Reverse-reachability: list usage records for an organization."
    roles: [PlatformAdmin, BillingContact, OrganizationAdmin]
    code: 200
    input: ["model_version_id?", "batch?", "limit?", "offset?"]
    output: UsageRecord[]
    side_effects: []

  - method: GET
    path: "/organizations/{id}/invoices"
    description: "Reverse-reachability: list invoices for an organization."
    roles: [PlatformAdmin, BillingContact, OrganizationAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []

  - method: GET
    path: "/organizations/{id}/rate-limit-windows"
    description: "Reverse-reachability: list rate-limit windows for an organization; filter by model_version_id or window_start."
    roles: [PlatformAdmin, OrganizationAdmin]
    code: 200
    input: ["model_version_id?", "window_start?", "limit?", "offset?"]
    output: RateLimitWindow[]
    side_effects: []

  - method: GET
    path: "/organizations/{id}/queued-requests"
    description: "Reverse-reachability: list queued requests for an organization; filter by model_version_id or status."
    roles: [PlatformAdmin, OrganizationAdmin]
    code: 200
    input: ["model_version_id?", "status?", "limit?", "offset?"]
    output: QueuedRequest[]
    side_effects: []

  - method: GET
    path: "/organizations/{id}/abuse-cases"
    description: "Reverse-reachability: list abuse cases against an organization."
    roles: [PlatformAdmin, TrustAnalyst, TrustLead, OrganizationAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AbuseCase[]
    side_effects: []

  # --- payments ---
  - method: POST
    path: "/payment-events"
    description: "Record a payment event against an organization. Created PENDING."
    roles: [PlatformAdmin, BillingContact]
    code: 201
    input: [organization_id, kind, amount_cents]
    output: PaymentEvent
    side_effects: []

  - method: POST
    path: "/payment-events/{id}/settle"
    description: "Settle a PENDING payment; updates organization aggregates and tier."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: PaymentEvent
    side_effects: ["update Organization.lifetime_spend_cents, qualifying_payment_count, credit_balance_cents", "tier_progression", "increments Organization.version by 1"]

  # --- models ---
  - method: POST
    path: "/model-versions"
    description: "Register a new model version in DRAFT status."
    roles: [PlatformAdmin]
    code: 201
    input: [model_slug, version_tag, pricing]
    output: ModelVersion
    side_effects: []

  - method: GET
    path: "/model-versions"
    description: "List model versions; filter by status, model_slug, or safety_evaluation_id (reverse-reachability for ModelVersion.safety_evaluation_id)."
    roles: [PlatformAdmin, TrustAnalyst, TrustLead, BillingContact, OrganizationAdmin]
    code: 200
    input: ["status?", "model_slug?", "safety_evaluation_id?", "limit?", "offset?"]
    output: ModelVersion[]
    side_effects: []

  - method: GET
    path: "/model-versions/{id}"
    description: "Fetch one model version."
    roles: [PlatformAdmin, TrustAnalyst, TrustLead, BillingContact, OrganizationAdmin]
    code: 200
    input: []
    output: ModelVersion
    side_effects: []

  - method: POST
    path: "/model-versions/{id}/deprecate"
    description: "ACTIVE -> DEPRECATED; sets deprecation_announced_at and sunset_at."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ModelVersion
    side_effects: ["set deprecation_announced_at, sunset_at", "increments ModelVersion.version by 1"]

  - method: GET
    path: "/model-versions/{id}/safety-evaluations"
    description: "Reverse-reachability: list safety evaluations for a model version."
    roles: [PlatformAdmin, TrustAnalyst, TrustLead]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SafetyEvaluation[]
    side_effects: []

  - method: GET
    path: "/model-versions/{id}/usage-records"
    description: "Reverse-reachability: list usage records against a model version."
    roles: [PlatformAdmin, BillingContact]
    code: 200
    input: ["organization_id?", "batch?", "limit?", "offset?"]
    output: UsageRecord[]
    side_effects: []

  # --- safety ---
  - method: POST
    path: "/model-versions/{id}/safety-evaluations"
    description: "Open a safety evaluation; transitions model DRAFT -> GATED."
    roles: [TrustAnalyst]
    code: 201
    input: [capability_class]
    output: SafetyEvaluation
    side_effects: ["ModelVersion DRAFT -> GATED", "set ModelVersion.safety_evaluation_id", "increments ModelVersion.version by 1"]

  - method: POST
    path: "/safety-evaluations/{id}/submit-verdict"
    description: "TrustLead submits score; verdict transitions evaluation and gates model release (PASS: GATED->ACTIVE; FAIL: GATED->DRAFT)."
    roles: [TrustLead]
    code: 200
    input: [score]
    output: SafetyEvaluation
    side_effects: ["evaluation.status := PASSED or FAILED", "ModelVersion GATED -> ACTIVE on PASS, GATED -> DRAFT on FAIL", "increments ModelVersion.version by 1"]

  # --- usage / rate limits ---
  - method: POST
    path: "/usage-records"
    description: "Report usage into a minute window; admission-controlled by rate limits with burst handling."
    roles: [OrganizationAdmin, PlatformAdmin]
    code: 201
    input: [organization_id, model_version_id, minute_window_start, requests, input_tokens, output_tokens, cached_tokens, "batch?"]
    output: UsageRecord
    side_effects: ["update RateLimitWindow counters", "consume burst credits if over base cap"]

  - method: POST
    path: "/queued-requests"
    description: "Explicitly enqueue a request; bounded by queue depth (QUEUE_MAX_DEPTH 100)."
    roles: [OrganizationAdmin, PlatformAdmin]
    code: 201
    input: [organization_id, model_version_id, requests_cost, tokens_cost]
    output: QueuedRequest
    side_effects: ["sets enqueued_at from logical clock"]

  # --- billing ---
  - method: POST
    path: "/invoices"
    description: "Open a DRAFT invoice for an organization over a non-overlapping period. Optional lines array materializes InvoiceLine rows with the invoice (each line: model_version_id, kind, quantity, rate_per_mtok_cents, batch?)."
    roles: [BillingContact, PlatformAdmin]
    code: 201
    input: [organization_id, period_start, period_end, "lines?"]
    output: Invoice
    side_effects: ["create InvoiceLine rows from lines array"]

  - method: GET
    path: "/invoice-lines"
    description: "List invoice lines; filter by invoice_id or model_version_id (reverse-reachability for both InvoiceLine FKs)."
    roles: [BillingContact, PlatformAdmin, OrganizationAdmin]
    code: 200
    input: ["invoice_id?", "model_version_id?", "limit?", "offset?"]
    output: InvoiceLine[]
    side_effects: []

  - method: GET
    path: "/invoice-lines/{id}"
    description: "Fetch one invoice line."
    roles: [BillingContact, PlatformAdmin, OrganizationAdmin]
    code: 200
    input: []
    output: InvoiceLine
    side_effects: []

  - method: POST
    path: "/invoices/{id}/finalize"
    description: "Compute line amounts, discount, totals; debit credit balance by min(total, balance). Terminal."
    roles: [BillingContact]
    code: 200
    input: []
    output: Invoice
    side_effects: ["per-line round_half_up then sum", "batch_discount", "credit_balance_cents debit", "increments Invoice.version by 1"]

  # --- enterprise agreements ---
  - method: POST
    path: "/enterprise-agreements"
    description: "Open a DRAFT enterprise agreement."
    roles: [PlatformAdmin]
    code: 201
    input: [organization_id, committed_tpm, dedicated_capacity_pct, effective_at, expires_at, "price_override?"]
    output: EnterpriseAgreement
    side_effects: []

  - method: GET
    path: "/enterprise-agreements"
    description: "List agreements; filter by organization_id, status (reverse-reachability for EnterpriseAgreement.organization_id)."
    roles: [PlatformAdmin, BillingContact, OrganizationAdmin]
    code: 200
    input: ["organization_id?", "status?", "limit?", "offset?"]
    output: EnterpriseAgreement[]
    side_effects: []

  - method: GET
    path: "/enterprise-agreements/{id}"
    description: "Fetch one agreement."
    roles: [PlatformAdmin, BillingContact, OrganizationAdmin, TrustLead]
    code: 200
    input: []
    output: EnterpriseAgreement
    side_effects: []

  - method: POST
    path: "/enterprise-agreements/{id}/countersign"
    description: "DRAFT -> ACTIVE; requires organization ACTIVE; forces organization tier to ENTERPRISE."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: EnterpriseAgreement
    side_effects: ["Organization.enterprise_agreement_id set", "Organization.tier := ENTERPRISE", "increments EnterpriseAgreement.version by 1"]

  # --- abuse enforcement ---
  - method: POST
    path: "/abuse-cases"
    description: "Open an abuse case (AUTOMATED or MANUAL). AUTOMATED with classifier_confidence >= 0.95 auto-issues THROTTLE and moves OPEN -> ACTIONED."
    roles: [PlatformAdmin, TrustAnalyst]
    code: 201
    input: [organization_id, source, "classifier_confidence?", severity]
    output: AbuseCase
    side_effects: ["automated classifier threshold may auto-issue THROTTLE and transition OPEN -> ACTIONED"]

  - method: GET
    path: "/abuse-cases/{id}"
    description: "Fetch one abuse case."
    roles: [PlatformAdmin, TrustAnalyst, TrustLead, OrganizationAdmin]
    code: 200
    input: []
    output: AbuseCase
    side_effects: []

  - method: POST
    path: "/abuse-cases/{id}/claim"
    description: "TrustAnalyst claims an OPEN case -> UNDER_REVIEW."
    roles: [TrustAnalyst]
    code: 200
    input: []
    output: AbuseCase
    side_effects: ["assigned_analyst_id := caller", "increments AbuseCase.version by 1"]

  - method: POST
    path: "/abuse-cases/{id}/actions"
    description: "Issue a graduated action against a case in UNDER_REVIEW. OCC-guarded via expected_abuse_case_version."
    roles: [TrustAnalyst, TrustLead]
    code: 201
    input: [action_type, expected_abuse_case_version]
    output: AbuseAction
    side_effects: ["Organization status cascade per action_type", "THROTTLE reduces org effective rate limits", "increments AbuseCase.version by 1"]

  - method: GET
    path: "/abuse-cases/{id}/actions"
    description: "Reverse-reachability: list actions recorded on a case."
    roles: [PlatformAdmin, TrustAnalyst, TrustLead, OrganizationAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: AbuseAction[]
    side_effects: []

  - method: GET
    path: "/abuse-cases/{id}/appeals"
    description: "Reverse-reachability: list appeals for a case."
    roles: [PlatformAdmin, TrustAnalyst, TrustLead, OrganizationAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Appeal[]
    side_effects: []

  # --- appeals ---
  - method: POST
    path: "/appeals"
    description: "OrganizationAdmin files an appeal against an actioned case; submitted_by := caller X-User-ID and must equal the accused organization's id."
    roles: [OrganizationAdmin]
    code: 201
    input: [abuse_case_id]
    output: Appeal
    side_effects: ["submitted_by := caller X-User-ID"]

  - method: POST
    path: "/appeals/{id}/grant"
    description: "TrustLead grants an appeal; revokes action, reinstates case and organization."
    roles: [TrustLead]
    code: 200
    input: []
    output: Appeal
    side_effects: ["appeal.status := GRANTED", "AbuseAction revoked", "case.status := REINSTATED", "Organization status restored", "increments Appeal.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Caller role not authorized for the endpoint per RBAC."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-template resource does not exist (validated left-to-right)."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, ill-typed value, or unknown enum member."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "State machine rejects the transition from the current state."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC expected_abuse_case_version does not match the case's current version."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "Same user attempting two steps that must be performed by different users (verdict vs opener; resolver vs issuer)."
  - id: ERR_MODEL_UNAVAILABLE
    http: 422
    condition: "Usage attempted against SUNSET model, or against DEPRECATED model by an unpinned organization without recent usage."
  - id: ERR_ORG_STATUS_BLOCKED
    http: 422
    condition: "Organization status (RESTRICTED/SUSPENDED/TERMINATED) blocks the requested operation."
  - id: ERR_PERIOD_OVERLAP
    http: 409
    condition: "Invoice period overlaps an existing invoice for the same organization (closed-open interval test)."
  - id: ERR_APPEAL_ALREADY_PENDING
    http: 409
    condition: "An appeal is already PENDING for the abuse case."
  - id: ERR_DUPLICATE_MODEL_VERSION
    http: 409
    condition: "(model_slug, version_tag) pair already exists on a non-SUNSET model."
  - id: ERR_AGREEMENT_CONFLICT
    http: 422
    condition: "effective_at >= expires_at, or the organization already has an ACTIVE enterprise agreement."
  - id: ERR_INVALID_AMOUNT
    http: 422
    condition: "PaymentEvent amount_cents is zero or violates the kind's sign convention."
  - id: ERR_INSUFFICIENT_CREDIT
    http: 422
    condition: "Invoice finalize would drive credit_balance_cents negative."
  - id: ERR_RATE_LIMITED
    http: 429
    condition: "Request exceeds current window's (rpm, tpm) after throttle and burst adjustments."
  - id: ERR_APPEAL_FORBIDDEN
    http: 403
    condition: "Appeal filer's X-User-ID does not equal the accused organization's id."
  - id: ERR_ACTION_NOT_PERMITTED
    http: 422
    condition: "Caller is not the assigned analyst, or action_type rank exceeds case severity rank."
  - id: ERR_TEMPORAL_INVALID
    http: 422
    condition: "Logical-clock invariant violated (period ordering, expiry, sunset, TTL)."
  - id: ERR_QUEUE_FULL
    http: 429
    condition: "Queued request cannot be admitted because the (organization, model) queue depth has reached QUEUE_MAX_DEPTH (100)."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Internal platform operator with full administrative surface; cannot judge safety verdicts or appeals (segregation of duties)."
    identity: opaque
    exclusive_operations:
      - "POST /organizations"
      - "POST /organizations/{id}/activate"
      - "POST /model-versions"
      - "POST /model-versions/{id}/deprecate"
      - "POST /enterprise-agreements"
      - "POST /enterprise-agreements/{id}/countersign"
      - "POST /payment-events/{id}/settle"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET endpoints across all collections"
      - "POST /abuse-cases (manual source)"
      - "POST /payment-events"
      - "POST /invoices"
      - "POST /usage-records"
      - "POST /queued-requests"

  - name: OrganizationAdmin
    description: "Administrator of a single Organization (X-User-ID equals the Organization id); reports usage, files appeals."
    identity: "entity_backed:Organization"
    exclusive_operations:
      - "POST /appeals"
    shared_operations:
      - "POST /usage-records"
      - "POST /queued-requests"
      - "GET endpoints scoped to their own organization"

  - name: BillingContact
    description: "Financial operator for invoicing and payment recording; cannot modify model lifecycle or enforcement."
    identity: opaque
    exclusive_operations:
      - "POST /invoices/{id}/finalize"
    shared_operations:
      - "POST /invoices"
      - "POST /payment-events"
      - "GET billing-related endpoints"

  - name: TrustAnalyst
    description: "Trust & safety analyst; opens evaluations, claims and works abuse cases."
    identity: opaque
    exclusive_operations:
      - "POST /model-versions/{id}/safety-evaluations"
      - "POST /abuse-cases/{id}/claim"
    shared_operations:
      - "POST /abuse-cases"
      - "POST /abuse-cases/{id}/actions (for non-TERMINATE)"
      - "GET endpoints across enforcement surface"

  - name: TrustLead
    description: "Senior trust & safety lead; verdicts and appeal resolutions. Must differ from the originating analyst (segregation of duties)."
    identity: opaque
    exclusive_operations:
      - "POST /safety-evaluations/{id}/submit-verdict"
      - "POST /appeals/{id}/grant"
    shared_operations:
      - "POST /abuse-cases/{id}/actions (incl. TERMINATE)"
      - "GET endpoints across enforcement surface"
