scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: credit_assessment_lag_vs_chargeback_method_diverge
        grounds:
          - calculations.reserve_requirement_determination
          - entities.CreditAssessment.fields.reserve_pct_bps
          - entities.CreditAssessment.fields.exposure_estimate_cents
          - entities.CreditAssessment.fields.reserve_cap_cents
          - entities.CreditAssessment.fields.reserve_type
          - entities.MerchantApplication.fields.current_reserve_pct_bps
          - concurrency_rules[credit-assessment-create-stale-application]
        distinguishing_aspect: |
          One application priced twice: LAG_WEIGHTED reads avg_delivery_lag_days and ignores
          declared_chargeback_ratio_bps, CHARGEBACK_WEIGHTED does the exact opposite, so the same
          stored inputs yield 1350 bps / CAPPED / 24300000 cap versus 960 bps / ROLLING / 2000000 cap.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01"
            - "one application in UNDERWRITING with credit_score 610 (band C), prior_processing_history_months 24, avg_delivery_lag_days 21, declared_chargeback_ratio_bps 20, requested_monthly_volume_cents 30000000, mcc_code 5732 with no ProhibitedCategoryRule"
            - "one CLEARED beneficial owner holding 80.00 percent and one PASSED business verification"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-08-01T00:00:00Z" }
              as: UnderwritingOfficer
            - call: "POST /merchant-applications"
              payload: { legal_business_name: "Cascade Optics LLC", tax_id: "88-1110001", mcc_code: "5732", country_code: "US", requested_monthly_volume_cents: 30000000, average_ticket_cents: 12000, avg_delivery_lag_days: 21, declared_chargeback_ratio_bps: 20, prior_processing_history_months: 24, credit_score: 610 }
              as: Applicant
              captures: { app_id: "$.data.id" }
            - call: "POST /beneficial-owners"
              payload: { application_id: "${app_id}", full_name: "Rosa Lind", ownership_pct: 80.00, country_code: "US", date_of_birth: "1979-03-11", government_id_last4: "4417" }
              as: Applicant
              as_user_id: "${app_id}"
              captures: { own_id: "$.data.id" }
            - call: "POST /merchant-applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${app_id}"
            - call: "POST /business-verifications"
              payload: { application_id: "${app_id}", registry_match: true, address_match: true, tax_id_match: true, bank_account_match: true }
              as: UnderwritingOfficer
            - call: "POST /beneficial-owners/${own_id}/screen"
              payload: { sanctions_hit: false, pep_flag: false, id_verified: true }
              as: UnderwritingOfficer
            - call: "POST /merchant-applications/${app_id}/advance-to-underwriting"
              payload: {}
              as: UnderwritingOfficer
              captures: { app_v1: "$.data.version" }
          trigger:
            - call: "POST /credit-assessments"
              payload: { application_id: "${app_id}", method: "LAG_WEIGHTED", expected_application_version: "${app_v1}" }
              as: UnderwritingOfficer
              captures: { ca_lag_id: "$.data.id" }
            - call: "GET /merchant-applications/${app_id}"
              payload: {}
              as: UnderwritingOfficer
              captures: { app_v2: "$.data.version" }
            - call: "POST /credit-assessments"
              payload: { application_id: "${app_id}", method: "CHARGEBACK_WEIGHTED", expected_application_version: "${app_v2}" }
              as: UnderwritingOfficer
              captures: { ca_cbw_id: "$.data.id" }
          assert:
            - "CreditAssessment.${ca_lag_id}.assessment_sequence == 1"
            - "CreditAssessment.${ca_lag_id}.credit_band == C"
            - "CreditAssessment.${ca_lag_id}.base_reserve_bps == 900"
            - "CreditAssessment.${ca_lag_id}.lag_uplift_bps == 450"
            - "CreditAssessment.${ca_lag_id}.chargeback_uplift_bps == 0"
            - "CreditAssessment.${ca_lag_id}.reserve_pct_bps == 1350"
            - "CreditAssessment.${ca_lag_id}.exposure_estimate_cents == 21000000"
            - "CreditAssessment.${ca_lag_id}.reserve_cap_cents == 24300000"
            - "CreditAssessment.${ca_lag_id}.reserve_type == CAPPED"
            - "CreditAssessment.${ca_cbw_id}.assessment_sequence == 2"
            - "CreditAssessment.${ca_cbw_id}.lag_uplift_bps == 0"
            - "CreditAssessment.${ca_cbw_id}.chargeback_uplift_bps == 60"
            - "CreditAssessment.${ca_cbw_id}.reserve_pct_bps == 960"
            - "CreditAssessment.${ca_cbw_id}.exposure_estimate_cents == 1000000"
            - "CreditAssessment.${ca_cbw_id}.reserve_cap_cents == 2000000"
            - "CreditAssessment.${ca_cbw_id}.reserve_type == ROLLING"
            - "MerchantApplication.${app_id}.current_reserve_pct_bps == 960"
            - "MerchantApplication.${app_id}.current_reserve_type == ROLLING"
            - "MerchantApplication.${app_id}.current_assessment_method == CHARGEBACK_WEIGHTED"

      - name: chargeback_ratio_count_variant_gates_amount_variant_forecasts
        grounds:
          - calculations.rolling_chargeback_ratio
          - calculations.portfolio_loss_forecast
          - entities.Merchant.fields.rolling_chargeback_ratio_bps
          - entities.Merchant.fields.amount_based_chargeback_ratio_bps
          - entities.PortfolioForecast.fields.gross_expected_loss_cents
        distinguishing_aspect: |
          One activity row yields COUNT_BASED 60 bps and AMOUNT_BASED 120 bps; the monitoring run
          reads only COUNT_BASED and raises no alert (60 < 65), while the forecast reads only
          AMOUNT_BASED and prices the merchant in the 900 bps PD tier, producing
          gross_expected_loss_cents 253260 instead of the 28140 the COUNT_BASED tier would give.
        test_recipe:
          setup:
            - "one ACTIVE merchant onboarded at 500 bps ROLLING reserve (credit_score 700, avg_delivery_lag_days 0, requested_monthly_volume_cents 30000000)"
            - "one activity row on 2026-07-01 with txn_count 500, volume_cents 5000000, chargeback_count 3, chargeback_amount_cents 60000"
            - "one SCHEDULED settlement batch over 2026-07-01..2026-07-01 with net_payout_cents 4690000"
            - "logical clock moved to 2026-07-15"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-07-01T00:00:00Z" }
              as: PortfolioController
            - call: "POST /merchant-applications"
              payload: { legal_business_name: "Harbor Provisions LLC", tax_id: "88-1110002", mcc_code: "5999", country_code: "US", requested_monthly_volume_cents: 30000000, average_ticket_cents: 10000, avg_delivery_lag_days: 0, declared_chargeback_ratio_bps: 0, prior_processing_history_months: 24, credit_score: 700 }
              as: Applicant
              captures: { app_id_b: "$.data.id" }
            - call: "POST /beneficial-owners"
              payload: { application_id: "${app_id_b}", full_name: "Ann Ito", ownership_pct: 80.00, country_code: "US", date_of_birth: "1980-04-02", government_id_last4: "9902" }
              as: Applicant
              as_user_id: "${app_id_b}"
              captures: { own_id_b: "$.data.id" }
            - call: "POST /merchant-applications/${app_id_b}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${app_id_b}"
            - call: "POST /business-verifications"
              payload: { application_id: "${app_id_b}", registry_match: true, address_match: true, tax_id_match: true, bank_account_match: true }
              as: UnderwritingOfficer
            - call: "POST /beneficial-owners/${own_id_b}/screen"
              payload: { sanctions_hit: false, pep_flag: false, id_verified: true }
              as: UnderwritingOfficer
            - call: "POST /merchant-applications/${app_id_b}/advance-to-underwriting"
              payload: {}
              as: UnderwritingOfficer
              captures: { app_v_b: "$.data.version" }
            - call: "POST /credit-assessments"
              payload: { application_id: "${app_id_b}", method: "LAG_WEIGHTED", expected_application_version: "${app_v_b}" }
              as: UnderwritingOfficer
            - call: "POST /merchant-applications/${app_id_b}/decision"
              payload: { decision: "APPROVE" }
              as: RiskCommitteeApprover
            - call: "GET /merchant-applications/${app_id_b}/onboarded-merchants"
              payload: {}
              as: RiskAnalyst
              captures: { m_id_b: "$.data[0].id" }
            - call: "POST /merchant-day-activity"
              payload: { merchant_id: "${m_id_b}", business_date: "2026-07-01", txn_count: 500, volume_cents: 5000000, distinct_card_count: 480, decline_count: 4, cross_border_count: 0, refund_cents: 0, unique_bin_count: 210, chargeback_count: 3, chargeback_amount_cents: 60000, chargeback_network: "VISA" }
              as: RiskAnalyst
            - call: "POST /settlement-batches"
              payload: { merchant_id: "${m_id_b}", period_start_date: "2026-07-01", period_end_date: "2026-07-01", gross_volume_cents: 5000000 }
              as: PortfolioController
              captures: { batch_id_b: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-07-15T00:00:00Z" }
              as: PortfolioController
          trigger:
            - call: "POST /monitoring-runs"
              payload: { as_of_date: "2026-07-15" }
              as: RiskAnalyst
            - call: "POST /portfolio-forecasts"
              payload: { as_of_date: "2026-07-15", method: "EXPECTED_LOSS" }
              as: PortfolioController
              captures: { fc_id_b: "$.data.id" }
          assert:
            - "Merchant.${m_id_b}.rolling_chargeback_ratio_bps == 60"
            - "Merchant.${m_id_b}.amount_based_chargeback_ratio_bps == 120"
            - "the POST /monitoring-runs response data array has length 0"
            - "Merchant.${m_id_b}.open_alert_count == 0"
            - "Merchant.${m_id_b}.account_state == ACTIVE"
            - "SettlementBatch.${batch_id_b}.net_payout_cents == 4690000"
            - "PortfolioForecast.${fc_id_b}.unpaid_exposure_cents == 4690000"
            - "PortfolioForecast.${fc_id_b}.gross_expected_loss_cents == 253260"
            - "PortfolioForecast.${fc_id_b}.gross_expected_loss_cents != 28140"
            - "PortfolioForecast.${fc_id_b}.total_reserve_held_cents == 250000"
            - "PortfolioForecast.${fc_id_b}.net_expected_loss_cents == 3260"

  - rule_id: combinatorial_formula
    instances:
      - name: reserve_pct_upper_clamp_over_four_additive_uplifts
        grounds:
          - calculations.reserve_requirement_determination
          - entities.ProhibitedCategoryRule.fields.reserve_uplift_bps
          - entities.CreditAssessment.fields.thin_file_uplift_bps
          - entities.CreditAssessment.fields.mcc_uplift_bps
        distinguishing_aspect: |
          Mode (a) nested-conditional arithmetic: band D base 1500 plus thin-file 300 plus
          RESTRICTED_REVIEW mcc 400 plus lag 1050 sums to 3250, and the nested
          min(2500, max(100, sum)) clamp must publish 2500 while every component field is stored
          unclamped; the cap then takes min(2500 bps monthly hold x 6, 2 x exposure).
        test_recipe:
          setup:
            - "logical clock at 2026-08-01"
            - "a ProhibitedCategoryRule for mcc_code 7995 with disposition RESTRICTED_REVIEW and reserve_uplift_bps 400"
            - "one application in UNDERWRITING with credit_score 580 (band D), prior_processing_history_months 3 (thin file), avg_delivery_lag_days 45, requested_monthly_volume_cents 10000000, mcc_code 7995"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-08-01T00:00:00Z" }
              as: UnderwritingOfficer
            - call: "POST /prohibited-category-rules"
              payload: { mcc_code: "7995", category: "Betting and lottery", disposition: "RESTRICTED_REVIEW", reserve_uplift_bps: 400 }
              as: UnderwritingOfficer
            - call: "POST /merchant-applications"
              payload: { legal_business_name: "Riverbend Gaming LLC", tax_id: "88-1110003", mcc_code: "7995", country_code: "US", requested_monthly_volume_cents: 10000000, average_ticket_cents: 4000, avg_delivery_lag_days: 45, declared_chargeback_ratio_bps: 30, prior_processing_history_months: 3, credit_score: 580 }
              as: Applicant
              captures: { app_id_c: "$.data.id" }
            - call: "POST /beneficial-owners"
              payload: { application_id: "${app_id_c}", full_name: "Dev Rao", ownership_pct: 100.00, country_code: "US", date_of_birth: "1975-06-30", government_id_last4: "3311" }
              as: Applicant
              as_user_id: "${app_id_c}"
              captures: { own_id_c: "$.data.id" }
            - call: "POST /merchant-applications/${app_id_c}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${app_id_c}"
            - call: "POST /business-verifications"
              payload: { application_id: "${app_id_c}", registry_match: true, address_match: true, tax_id_match: true, bank_account_match: true }
              as: UnderwritingOfficer
            - call: "POST /beneficial-owners/${own_id_c}/screen"
              payload: { sanctions_hit: false, pep_flag: false, id_verified: true }
              as: UnderwritingOfficer
            - call: "POST /merchant-applications/${app_id_c}/advance-to-underwriting"
              payload: {}
              as: UnderwritingOfficer
              captures: { app_v_c: "$.data.version" }
          trigger:
            - call: "POST /credit-assessments"
              payload: { application_id: "${app_id_c}", method: "LAG_WEIGHTED", expected_application_version: "${app_v_c}" }
              as: UnderwritingOfficer
              captures: { ca_id_c: "$.data.id" }
          assert:
            - "MerchantApplication.${app_id_c}.mcc_disposition == RESTRICTED_REVIEW"
            - "CreditAssessment.${ca_id_c}.credit_band == D"
            - "CreditAssessment.${ca_id_c}.base_reserve_bps == 1500"
            - "CreditAssessment.${ca_id_c}.thin_file_uplift_bps == 300"
            - "CreditAssessment.${ca_id_c}.mcc_uplift_bps == 400"
            - "CreditAssessment.${ca_id_c}.lag_uplift_bps == 1050"
            - "CreditAssessment.${ca_id_c}.reserve_pct_bps == 2500"
            - "CreditAssessment.${ca_id_c}.exposure_estimate_cents == 10000000"
            - "CreditAssessment.${ca_id_c}.reserve_cap_cents == 15000000"
            - "CreditAssessment.${ca_id_c}.reserve_type == CAPPED"

      - name: settlement_hold_rounds_per_day_line_not_per_period
        grounds:
          - calculations.settlement_reserve_hold_and_payout_waterfall
          - entities.SettlementBatch.fields.reserve_hold_cents
          - entities.SettlementBatch.fields.day_line_count
          - entities.SettlementBatch.fields.net_payout_cents
        distinguishing_aspect: |
          Mode (b) pinned rounding order: three day lines of 100050 cents at 500 bps round
          half-up per line to 5003 each for reserve_hold_cents 15009, whereas rounding the
          300150-cent period total once gives 15008 - a one-cent discriminator that also moves
          net_payout_cents to 285141 rather than 285142.
        test_recipe:
          setup:
            - "one ACTIVE merchant at 500 bps ROLLING reserve, funding_state NORMAL"
            - "three activity rows on 2026-07-01, 2026-07-02 and 2026-07-03, each volume_cents 100050 and chargeback_amount_cents 0"
            - "logical clock at 2026-07-03"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-07-01T00:00:00Z" }
              as: PortfolioController
            - call: "POST /merchant-applications"
              payload: { legal_business_name: "Pinecrest Supply LLC", tax_id: "88-1110004", mcc_code: "5999", country_code: "US", requested_monthly_volume_cents: 30000000, average_ticket_cents: 1000, avg_delivery_lag_days: 0, declared_chargeback_ratio_bps: 0, prior_processing_history_months: 24, credit_score: 700 }
              as: Applicant
              captures: { app_id_d: "$.data.id" }
            - call: "POST /beneficial-owners"
              payload: { application_id: "${app_id_d}", full_name: "Ivo Bell", ownership_pct: 90.00, country_code: "US", date_of_birth: "1982-01-19", government_id_last4: "7788" }
              as: Applicant
              as_user_id: "${app_id_d}"
              captures: { own_id_d: "$.data.id" }
            - call: "POST /merchant-applications/${app_id_d}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${app_id_d}"
            - call: "POST /business-verifications"
              payload: { application_id: "${app_id_d}", registry_match: true, address_match: true, tax_id_match: true, bank_account_match: true }
              as: UnderwritingOfficer
            - call: "POST /beneficial-owners/${own_id_d}/screen"
              payload: { sanctions_hit: false, pep_flag: false, id_verified: true }
              as: UnderwritingOfficer
            - call: "POST /merchant-applications/${app_id_d}/advance-to-underwriting"
              payload: {}
              as: UnderwritingOfficer
              captures: { app_v_d: "$.data.version" }
            - call: "POST /credit-assessments"
              payload: { application_id: "${app_id_d}", method: "LAG_WEIGHTED", expected_application_version: "${app_v_d}" }
              as: UnderwritingOfficer
            - call: "POST /merchant-applications/${app_id_d}/decision"
              payload: { decision: "APPROVE" }
              as: RiskCommitteeApprover
            - call: "GET /merchant-applications/${app_id_d}/onboarded-merchants"
              payload: {}
              as: RiskAnalyst
              captures: { m_id_d: "$.data[0].id" }
            - call: "GET /merchants/${m_id_d}/reserve-accounts"
              payload: {}
              as: RiskAnalyst
              captures: { ra_id_d: "$.data[0].id" }
            - call: "POST /merchant-day-activity"
              payload: { merchant_id: "${m_id_d}", business_date: "2026-07-01", txn_count: 100, volume_cents: 100050, distinct_card_count: 98, decline_count: 1, cross_border_count: 0, refund_cents: 0, unique_bin_count: 55, chargeback_count: 0, chargeback_amount_cents: 0 }
              as: RiskAnalyst
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-07-02T00:00:00Z" }
              as: PortfolioController
            - call: "POST /merchant-day-activity"
              payload: { merchant_id: "${m_id_d}", business_date: "2026-07-02", txn_count: 100, volume_cents: 100050, distinct_card_count: 97, decline_count: 1, cross_border_count: 0, refund_cents: 0, unique_bin_count: 54, chargeback_count: 0, chargeback_amount_cents: 0 }
              as: RiskAnalyst
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-07-03T00:00:00Z" }
              as: PortfolioController
            - call: "POST /merchant-day-activity"
              payload: { merchant_id: "${m_id_d}", business_date: "2026-07-03", txn_count: 100, volume_cents: 100050, distinct_card_count: 99, decline_count: 2, cross_border_count: 0, refund_cents: 0, unique_bin_count: 56, chargeback_count: 0, chargeback_amount_cents: 0 }
              as: RiskAnalyst
          trigger:
            - call: "POST /settlement-batches"
              payload: { merchant_id: "${m_id_d}", period_start_date: "2026-07-01", period_end_date: "2026-07-03", gross_volume_cents: 300150 }
              as: PortfolioController
              captures: { batch_id_d: "$.data.id" }
          assert:
            - "SettlementBatch.${batch_id_d}.day_line_count == 3"
            - "SettlementBatch.${batch_id_d}.reserve_hold_cents == 15009"
            - "SettlementBatch.${batch_id_d}.reserve_hold_cents != 15008"
            - "SettlementBatch.${batch_id_d}.loss_offset_from_settlement_cents == 0"
            - "SettlementBatch.${batch_id_d}.reserve_offset_cents == 0"
            - "SettlementBatch.${batch_id_d}.uncovered_loss_cents == 0"
            - "SettlementBatch.${batch_id_d}.net_payout_cents == 285141"
            - "SettlementBatch.${batch_id_d}.payout_state == SCHEDULED"
            - "SettlementBatch.${batch_id_d}.scheduled_payout_date == 2026-07-04"
            - "ReserveAccount.${ra_id_d}.total_accrued_cents == 15009"
            - "ReserveAccount.${ra_id_d}.held_balance_cents == 15009"
            - "Merchant.${m_id_d}.pending_payout_cents == 285141"
            - "Merchant.${m_id_d}.reserve_balance_cents == 15009"

      - name: forecast_adequacy_tier_frozen_before_uplift
        grounds:
          - calculations.portfolio_loss_forecast
          - entities.PortfolioForecast.fields.reserve_adequacy_ratio_bps
          - entities.PortfolioForecast.fields.required_additional_reserve_cents
          - entities.PortfolioForecast.fields.projected_adequacy_ratio_bps
        distinguishing_aspect: |
          Mode (c) pinned evaluation order: the tier that sizes required_additional_reserve_cents
          is selected from the step-5 adequacy ratio only. STRESSED reports adequacy 3949 bps and
          therefore the FULL gap 383150 with projected_adequacy_ratio_bps 10000, while
          EXPECTED_LOSS reports 9871 bps and therefore only 25 percent (815) with projected 9903 -
          proving the tier was not re-derived from the post-uplift ratio.
        test_recipe:
          setup:
            - "one ACTIVE merchant at 500 bps ROLLING reserve with amount_based_chargeback_ratio_bps 120 at 2026-07-15"
            - "one SCHEDULED settlement batch with net_payout_cents 4690000 and reserve held_balance_cents 250000"
            - "logical clock at 2026-07-15"
