          assert:
            - "DeliveryTicket.${dtick}.status == CLOSED_VARIANCE (hop 1)"
            - "Shipment.${ship}.status == VARIANCE_REVIEW (hop 2, caused by hop 1)"
            - "DedicatedTrailerAgreement.${agr}.flagged_shipment_count == 1 (hop 3, caused by hop 2)"
            - "DedicatedTrailerAgreement.${agr}.status == ACTIVE (FLAG_SUSPEND_THRESHOLD 2 not yet reached)"
      - name: cert_revoke_cascades_shipment_and_trailer
        grounds:
          - state_machines.TankWashCertificate.HELD_to_VOIDED
          - state_machines.Shipment.PLANNED_to_DRAFT
          - state_machines.TankTrailer.ASSIGNED_to_AVAILABLE
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger (SafetyOfficer cert
          revoke): cert HELD -> VOIDED (hop 1); the holding Shipment reverts
          PLANNED -> DRAFT with assignments cleared (hop 2); the released
          TankTrailer returns ASSIGNED -> AVAILABLE (hop 3).
        test_recipe:
          setup:
            - "FLUSH certificate CERTIFIED for trailer T-101; shipment PLANNED with that cert attached (cert HELD); clock 2026-08-01T08:00:00Z"
          setup_api_calls:
