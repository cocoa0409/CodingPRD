# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role / X-User-ID header missing or role not declared" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id missing or wrong nesting; body FK id missing" }
  - { id: ERR_VALIDATION, http: 422, condition: "Malformed body: missing required field, bad enum, out-of-range integer, inverted time range, FAIL item without note, activation tier != unit.menu_tier" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a state from which the requested transition exists (includes second checklist run while one is IN_PROGRESS/SUBMITTED)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_storm_event_version / expected_unit_version does not match the current entity version (OCC)" }
  - { id: ERR_CHECKLIST_INCOMPLETE, http: 409, condition: "Checklist submit without all five items recorded PASS" }
  - { id: ERR_RESOURCES_STILL_DOWN, http: 409, condition: "Checklist submit while power, water or gas axis is DOWN" }
  - { id: ERR_REPORT_NOT_ALL_CLEAR, http: 409, condition: "Latest condition report does not show all four axes UP" }
  - { id: ERR_COLD_HOLD_EXPIRED, http: 409, condition: "All-clear report is older than the 4-hour cold-hold limit; perishables must be discarded and a new all-clear report filed" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Checklist approver/rejecter is the same X-User-ID that submitted the run" }
  - { id: ERR_STORM_NOT_ACTIVE, http: 409, condition: "Assignment start while the unit's storm is not ACTIVE or RECOVERY" }
  - { id: ERR_UNIT_NOT_IN_STORM_TIER, http: 409, condition: "Assignment start to a unit whose menu_tier is FULL" }
  - { id: ERR_NOT_JUMP_TEAM, http: 409, condition: "Assignment start for a crew member without jump-team certification" }
  - { id: ERR_CREW_MEMBER_INACTIVE, http: 409, condition: "Assignment creation for an INACTIVE crew member" }
  - { id: ERR_ASSIGNMENT_OVERLAP, http: 409, condition: "Crew member already has a SCHEDULED/ACTIVE assignment overlapping [assigned_from, assigned_until)" }
  - { id: ERR_ASSIGNMENT_WINDOW, http: 409, condition: "Assignment start before assigned_from" }
  - { id: ERR_ASSET_NOT_IDLE, http: 409, condition: "Allocation creation for an asset that is not IDLE" }
  - { id: ERR_PREPOSITION_WINDOW_EXPIRED, http: 409, condition: "Allocation attempted after storm.watch_started_at + 48h or after the storm left WATCH/WARNING" }
  - { id: ERR_ASSET_KIND_MISMATCH, http: 409, condition: "GENERATOR sent to a unit with power UP, or MOBILE_KITCHEN sent to a unit with water and gas both UP" }
  - { id: ERR_UNIT_STILL_LIMITED, http: 409, condition: "Asset return while the unit's menu_tier is not FULL" }
  - { id: ERR_UNIT_NOT_STORM_AFFECTED, http: 409, condition: "Menu activation or relief pledge on a unit whose menu_tier is FULL" }
  - { id: ERR_NOT_CASH_ONLY, http: 409, condition: "Cash drop while cash_only_flag is false" }
  - { id: ERR_LODGING_OVERLAP, http: 409, condition: "New booking shares a calendar night with a CONFIRMED booking of the same crew assignment" }
  - { id: ERR_LODGING_FUND_EXCEEDED, http: 409, condition: "Booking cost exceeds the unit's remaining lodging fund" }
  - { id: ERR_RELIEF_ORG_INACTIVE, http: 409, condition: "Pledge creation with a SUSPENDED relief organization" }
  - { id: ERR_SERVICE_NOT_PAST, http: 409, condition: "Pledge confirmation before the service date has begun" }
  - { id: ERR_UNITS_STABILIZING, http: 409, condition: "Storm deescalation ACTIVE -> RECOVERY while a unit checklist is IN_PROGRESS" }
  - { id: ERR_UNITS_NOT_RESTORED, http: 409, condition: "Storm close while a unit's menu_tier is not FULL" }
  - { id: ERR_OPEN_CHECKLISTS, http: 409, condition: "Storm close while a unit checklist is IN_PROGRESS, SUBMITTED or REJECTED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CommandCenterAdmin
    description: "Storm command center operator: declares storms, drives storm lifecycle, reviews reopening checklists, runs the reporting cadence. Hierarchical superset — may also read every resource."
    identity: "opaque"
    exclusive_operations:
      - "POST /storm-events, /ops/storm-events/{id}/escalate|deescalate|activate|close|cancel"
      - "POST /ops/storm-events/{id}/units — register affected units"
      - "PATCH /ops/units/{id} — top up lodging fund"
      - "POST /ops/units/{id}/checklists/{id}/approve|reject — reopening review"
      - "POST /run-report — reporting cadence"
      - "POST /ops/_clock/set_current_utc"
    shared_operations:
      - "GET on every resource (read superset)"

  - name: UnitManager
    description: "Restaurant unit operator: files condition reports, activates/deactivates the storm-tier menu, records cash drops during payment-network outage, works the reopening checklist."
    identity: "opaque"
    exclusive_operations:
      - "POST /ops/units/{id}/condition-reports"
      - "POST /ops/units/{id}/menu-activations, /ops/units/{id}/menu-activations/deactivate"
      - "POST /ops/units/{id}/checklists, /checklists/{id}/items, /submit, /rework"
      - "POST /ops/units/{id}/cash-drops"
    shared_operations:
      - "GET /ops/storm-events, /ops/storm-events/{id}, /ops/storm-events/{id}/units, /ops/units/{id}"
      - "GET unit-scoped collections (condition-reports, menu-activations, checklists, items, cash-drops, relief-pledges)"

  - name: LogisticsPlanner
    description: "Storm logistics operator: registers generators and mobile kitchens, pre-positions and dispatches them to affected units, returns and retires them."
    identity: "opaque"
    exclusive_operations:
