            - { call: "POST /tea-ops/runs", payload: { line_id: "${ln}", batch_id: "${b}", planned_start: "2026-08-05T09:00:00Z", planned_end: "2026-08-05T10:00:00Z", planned_units: 500, contract_id: "${c1}" }, as: ProductionPlanner, as_user_id: "pp-1", captures: { run2: $.data.id } }
            - { call: "POST /tea-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T08:30:00Z" }, as: PlatformAdmin, as_user_id: "adm-1" }
            - { call: "POST /tea-ops/runs/${run1}/start", payload: {}, as: ProductionPlanner, as_user_id: "pp-1" }
            - { call: "POST /tea-ops/runs/${run1}/complete", payload: { actual_units: 1000 }, as: ProductionPlanner, as_user_id: "pp-1" }
            - { call: "POST /tea-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:30:00Z" }, as: PlatformAdmin, as_user_id: "adm-1" }
            - { call: "POST /tea-ops/runs/${run2}/start", payload: {}, as: ProductionPlanner, as_user_id: "pp-1" }
          trigger:
            - { call: "POST /tea-ops/runs/${run2}/complete", payload: { actual_units: 500 }, as: ProductionPlanner, as_user_id: "pp-1" }
            - { call: "GET /tea-ops/contracts/${c1}", payload: {}, as: AccountManager, as_user_id: "am-1", captures: { fu: $.data.fulfilled_units, cst: $.data.status } }
          assert:
            - "PrivateLabelContract.${c1}.fulfilled_units == 1500 (1000 + 500)"
            - "bubble-up: ${cst} == FULFILLED (1500 >= 1500, inclusive boundary)"

  # -------------------------------------------------------- calculations ----
  - section: calculations
    instances:
      - name: grade_boundary_85_is_A
        claim_type: correct_result
        grounds:
          - "calculations.sensory_composite_grade"
        distinguishing_aspect: "Composite 85.0 (85/85/85) lands exactly on the inclusive A threshold; the weights sum to 1.0 so equal scores reproduce themselves."
        test_recipe:
          setup: ["supplier + REGISTERED lot"]
          setup_api_calls:
            - { call: "POST /tea-ops/suppliers", payload: { name: "Grade Co", origin_region: "Assam" }, as: ProcurementLead, as_user_id: "pl-1", captures: { sup: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "WHITE", harvest_date: "2026-02-01", weight_kg: 10.0, cost_per_kg_cents: 1500, moisture_pct: 5.0 }, as: ProcurementLead, as_user_id: "pl-1", captures: { lot: $.data.id } }
          trigger:
            - { call: "POST /tea-ops/leaf-lots/${lot}/grade-assessments", payload: { aroma_score: 85, briskness_score: 85, appearance_score: 85 }, as: SensoryGrader, as_user_id: "gr-1", captures: { cs: $.data.composite_score, cg: $.data.composite_grade } }
          assert:
            - "${cs} == 85.0 and ${cg} == A (>= 85.0 inclusive)"

      - name: residue_soft_boundary_1_00
        claim_type: correct_result
        grounds:
          - "calculations.residue_verdict_threshold"
        distinguishing_aspect: "Exactly 1.00 ppm equals 2.0x the 0.50 limit; the hard-fail bound is exclusive, so 1.00 is FAIL_SOFT (ON_HOLD), not FAIL_HARD."
        test_recipe:
          setup: ["supplier + lot graded B"]
          setup_api_calls:
            - { call: "POST /tea-ops/suppliers", payload: { name: "Soft Co", origin_region: "Assam" }, as: ProcurementLead, as_user_id: "pl-1", captures: { sup: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "BLACK", harvest_date: "2026-02-01", weight_kg: 10.0, cost_per_kg_cents: 900, moisture_pct: 5.0 }, as: ProcurementLead, as_user_id: "pl-1", captures: { lot: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots/${lot}/grade-assessments", payload: { aroma_score: 80, briskness_score: 80, appearance_score: 80 }, as: SensoryGrader, as_user_id: "gr-1" }
          trigger:
            - { call: "POST /tea-ops/leaf-lots/${lot}/residue-tests", payload: { lab_name: "LabA", measured_residue_ppm: 1.00, test_method: "GCMS" }, as: QALabAnalyst, as_user_id: "an-1", captures: { v: $.data.verdict } }
            - { call: "GET /tea-ops/leaf-lots/${lot}", payload: {}, as: QAManager, as_user_id: "qa-1", captures: { st: $.data.status } }
          assert:
            - "${v} == FAIL_SOFT and lot ${st} == ON_HOLD (1.00 is NOT > 1.00)"

      - name: moisture_release_gate_boundary
        claim_type: correct_result
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_MOISTURE_OUT_OF_RANGE]"
          - "calculations.moisture_adjusted_yield"
        distinguishing_aspect: "Batch release moisture gate is inclusive at 7.0: measured 7.0 releases; 7.1 fails with ERR_MOISTURE_OUT_OF_RANGE and stays in QC_REVIEW."
        test_recipe:
          setup: ["supplier; two GREEN lots RELEASED; recipe CONVENTIONAL LOOSE_PACK; batchA blended at 7.0 and batchB blended at 7.1, both in QC_REVIEW"]
          setup_api_calls:
            - { call: "POST /tea-ops/suppliers", payload: { name: "Moist Co", origin_region: "Assam" }, as: ProcurementLead, as_user_id: "pl-1", captures: { sup: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "GREEN", harvest_date: "2026-02-01", weight_kg: 30.0, cost_per_kg_cents: 800, moisture_pct: 5.0 }, as: ProcurementLead, as_user_id: "pl-1", captures: { l1: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots/${l1}/grade-assessments", payload: { aroma_score: 80, briskness_score: 80, appearance_score: 80 }, as: SensoryGrader, as_user_id: "gr-1" }
            - { call: "POST /tea-ops/leaf-lots/${l1}/residue-tests", payload: { lab_name: "LabA", measured_residue_ppm: 0.20, test_method: "GCMS" }, as: QALabAnalyst, as_user_id: "an-1" }
            - { call: "POST /tea-ops/leaf-lots/${l1}/release", payload: {}, as: QAManager, as_user_id: "qa-1" }
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "GREEN", harvest_date: "2026-02-02", weight_kg: 30.0, cost_per_kg_cents: 800, moisture_pct: 5.0 }, as: ProcurementLead, as_user_id: "pl-1", captures: { l2: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots/${l2}/grade-assessments", payload: { aroma_score: 80, briskness_score: 80, appearance_score: 80 }, as: SensoryGrader, as_user_id: "gr-1" }
            - { call: "POST /tea-ops/leaf-lots/${l2}/residue-tests", payload: { lab_name: "LabA", measured_residue_ppm: 0.20, test_method: "GCMS" }, as: QALabAnalyst, as_user_id: "an-1" }
            - { call: "POST /tea-ops/leaf-lots/${l2}/release", payload: {}, as: QAManager, as_user_id: "qa-1" }
            - { call: "POST /tea-ops/recipes", payload: { name: "RMO", certification_target: "CONVENTIONAL", pack_format: "LOOSE_PACK", components: [{ leaf_type: "GREEN", min_grade: "C", pct: 100.0 }] }, as: BlendMaster, as_user_id: "bm-1", captures: { r: $.data.id } }
            - { call: "POST /tea-ops/recipes/${r}/activate", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches", payload: { recipe_id: "${r}", target_weight_kg: 20.0 }, as: BlendMaster, as_user_id: "bm-1", captures: { ba: $.data.id } }
            - { call: "POST /tea-ops/batches/${ba}/lock-recipe", payload: {}, as: BlendMaster, as_user_id: "bm-1", captures: { bav: $.data.version } }
            - { call: "POST /tea-ops/batches/${ba}/allocations", payload: { lot_id: "${l1}", allocated_kg: 20.0, expected_batch_version: "${bav}" }, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches/${ba}/finalize-allocation", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches/${ba}/blend", payload: { measured_moisture_pct: 7.0 }, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches/${ba}/submit-qc", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches", payload: { recipe_id: "${r}", target_weight_kg: 20.0 }, as: BlendMaster, as_user_id: "bm-1", captures: { bb: $.data.id } }
            - { call: "POST /tea-ops/batches/${bb}/lock-recipe", payload: {}, as: BlendMaster, as_user_id: "bm-1", captures: { bbv: $.data.version } }
            - { call: "POST /tea-ops/batches/${bb}/allocations", payload: { lot_id: "${l2}", allocated_kg: 20.0, expected_batch_version: "${bbv}" }, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches/${bb}/finalize-allocation", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches/${bb}/blend", payload: { measured_moisture_pct: 7.1 }, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches/${bb}/submit-qc", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
          trigger:
            - { call: "POST /tea-ops/batches/${ba}/release", payload: {}, as: QAManager, as_user_id: "qa-1", captures: { sta: $.data.status } }
            - { call: "POST /tea-ops/batches/${bb}/release", payload: {}, as: QAManager, as_user_id: "qa-1", captures: { err: $.data.error_id } }
            - { call: "GET /tea-ops/batches/${bb}", payload: {}, as: QAManager, as_user_id: "qa-1", captures: { stb: $.data.status } }
          assert:
            - "7.0 releases (inclusive): ${sta} == RELEASED"
            - "7.1 fails: ${err} == ERR_MOISTURE_OUT_OF_RANGE and batch stays ${stb} == QC_REVIEW"

      - name: final_cost_with_flavoring_literal
        claim_type: correct_result
        grounds:
          - "calculations.batch_cost_accounting"
          - "calculations.recipe_component_scaling"
        distinguishing_aspect: "Flavored final cost composes pinned rounding at every step: leaf 43700 (28500 + 15200) + flavoring 7500 (2.5 kg x 3000) + waste 1024 (2% of 51200) = 52224 cents; actual_weight 50.0 kg."
        test_recipe:
          setup:
            - "supplier; BLACK lots 18.0 kg + 10.5 kg @1000 (both moisture 5.0) and GREEN lot 19.0 kg @800, all RELEASED"
            - "flavoring natural, 3000 c/kg; recipe CONVENTIONAL LOOSE_PACK [{BLACK,B,57.0},{GREEN,C,38.0}] + 5% flavoring ACTIVE; batch target 50.0 through FLAVORED"
          setup_api_calls:
            - { call: "POST /tea-ops/suppliers", payload: { name: "Cost Co", origin_region: "Assam" }, as: ProcurementLead, as_user_id: "pl-1", captures: { sup: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "BLACK", harvest_date: "2026-02-01", weight_kg: 18.0, cost_per_kg_cents: 1000, moisture_pct: 5.0 }, as: ProcurementLead, as_user_id: "pl-1", captures: { l1: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots/${l1}/grade-assessments", payload: { aroma_score: 90, briskness_score: 88, appearance_score: 92 }, as: SensoryGrader, as_user_id: "gr-1" }
            - { call: "POST /tea-ops/leaf-lots/${l1}/residue-tests", payload: { lab_name: "LabA", measured_residue_ppm: 0.20, test_method: "GCMS" }, as: QALabAnalyst, as_user_id: "an-1" }
            - { call: "POST /tea-ops/leaf-lots/${l1}/release", payload: {}, as: QAManager, as_user_id: "qa-1" }
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "BLACK", harvest_date: "2026-02-02", weight_kg: 10.5, cost_per_kg_cents: 1000, moisture_pct: 5.0 }, as: ProcurementLead, as_user_id: "pl-1", captures: { l2: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots/${l2}/grade-assessments", payload: { aroma_score: 90, briskness_score: 88, appearance_score: 92 }, as: SensoryGrader, as_user_id: "gr-1" }
            - { call: "POST /tea-ops/leaf-lots/${l2}/residue-tests", payload: { lab_name: "LabA", measured_residue_ppm: 0.20, test_method: "GCMS" }, as: QALabAnalyst, as_user_id: "an-1" }
            - { call: "POST /tea-ops/leaf-lots/${l2}/release", payload: {}, as: QAManager, as_user_id: "qa-1" }
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "GREEN", harvest_date: "2026-02-03", weight_kg: 19.0, cost_per_kg_cents: 800, moisture_pct: 5.0 }, as: ProcurementLead, as_user_id: "pl-1", captures: { l3: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots/${l3}/grade-assessments", payload: { aroma_score: 80, briskness_score: 80, appearance_score: 80 }, as: SensoryGrader, as_user_id: "gr-1" }
            - { call: "POST /tea-ops/leaf-lots/${l3}/residue-tests", payload: { lab_name: "LabA", measured_residue_ppm: 0.20, test_method: "GCMS" }, as: QALabAnalyst, as_user_id: "an-1" }
            - { call: "POST /tea-ops/leaf-lots/${l3}/release", payload: {}, as: QAManager, as_user_id: "qa-1" }
            - { call: "POST /tea-ops/flavorings", payload: { name: "Bergamot", allergen_tags: [], natural_certified: true, cost_per_kg_cents: 3000 }, as: BlendMaster, as_user_id: "bm-1", captures: { f: $.data.id } }
            - { call: "POST /tea-ops/recipes", payload: { name: "RCost", certification_target: "CONVENTIONAL", pack_format: "LOOSE_PACK", components: [{ leaf_type: "BLACK", min_grade: "B", pct: 57.0 }, { leaf_type: "GREEN", min_grade: "C", pct: 38.0 }], flavoring_id: "${f}", flavoring_pct: 5.0 }, as: BlendMaster, as_user_id: "bm-1", captures: { r: $.data.id } }
            - { call: "POST /tea-ops/recipes/${r}/activate", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches", payload: { recipe_id: "${r}", target_weight_kg: 50.0 }, as: BlendMaster, as_user_id: "bm-1", captures: { b: $.data.id } }
            - { call: "POST /tea-ops/batches/${b}/lock-recipe", payload: {}, as: BlendMaster, as_user_id: "bm-1", captures: { bv: $.data.version } }
            - { call: "POST /tea-ops/batches/${b}/allocations", payload: { lot_id: "${l1}", allocated_kg: 18.0, expected_batch_version: "${bv}" }, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "GET /tea-ops/batches/${b}", payload: {}, as: BlendMaster, as_user_id: "bm-1", captures: { bv2: $.data.version } }
            - { call: "POST /tea-ops/batches/${b}/allocations", payload: { lot_id: "${l2}", allocated_kg: 10.5, expected_batch_version: "${bv2}" }, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "GET /tea-ops/batches/${b}", payload: {}, as: BlendMaster, as_user_id: "bm-1", captures: { bv3: $.data.version } }
            - { call: "POST /tea-ops/batches/${b}/allocations", payload: { lot_id: "${l3}", allocated_kg: 19.0, expected_batch_version: "${bv3}" }, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches/${b}/finalize-allocation", payload: {}, as: BlendMaster, as_user_id: "bm-1", captures: { prov: $.data.provisional_cost_cents } }
            - { call: "POST /tea-ops/batches/${b}/blend", payload: { measured_moisture_pct: 5.0 }, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches/${b}/apply-flavoring", payload: { flavoring_id: "${f}", applied_kg: 2.5 }, as: BlendMaster, as_user_id: "bm-1", captures: { fcost: $.data.flavoring_cost_cents } }
            - { call: "POST /tea-ops/batches/${b}/submit-qc", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
          trigger:
            - { call: "POST /tea-ops/batches/${b}/release", payload: {}, as: QAManager, as_user_id: "qa-1", captures: { fin: $.data.final_cost_cents, aw: $.data.actual_weight_kg } }
          assert:
            - "provisional == 43700 (${prov}): 18000 + 10500 + 15200 with per-line rounding"
            - "flavoring_cost_cents == 7500 (${fcost})"
            - "final == 52224 (${fin}): 43700 + 7500 + round_half_up(51200 * 0.02) = 43700 + 7500 + 1024"
            - "actual_weight_kg == 50.0 (${aw}): yield 47.5 (no moisture loss at 5.0) + flavoring 2.5"

      - name: pricing_tier_edges
        claim_type: correct_result
        grounds:
          - "calculations.contract_unit_price"
        distinguishing_aspect: "Tier boundaries are inclusive: 9999 units earns 0% discount (price == base 200); exactly 10000 earns 5% (price == 190)."
        test_recipe:
          setup: ["CONVENTIONAL LOOSE_PACK recipe ACTIVE; two DRAFT contracts at base 200 with totals 9999 and 10000"]
          setup_api_calls:
            - { call: "POST /tea-ops/suppliers", payload: { name: "Tier Co", origin_region: "Assam" }, as: ProcurementLead, as_user_id: "pl-1" }
            - { call: "POST /tea-ops/recipes", payload: { name: "RT", certification_target: "CONVENTIONAL", pack_format: "LOOSE_PACK", components: [{ leaf_type: "GREEN", min_grade: "C", pct: 100.0 }] }, as: BlendMaster, as_user_id: "bm-1", captures: { r: $.data.id } }
            - { call: "POST /tea-ops/recipes/${r}/activate", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/contracts", payload: { customer_name: "Edge A", recipe_id: "${r}", minimum_units_per_run: 100, contracted_total_units: 9999, base_unit_price_cents: 200 }, as: AccountManager, as_user_id: "am-1", captures: { c1: $.data.id } }
            - { call: "POST /tea-ops/contracts", payload: { customer_name: "Edge B", recipe_id: "${r}", minimum_units_per_run: 100, contracted_total_units: 10000, base_unit_price_cents: 200 }, as: AccountManager, as_user_id: "am-1", captures: { c2: $.data.id } }
          trigger:
            - { call: "POST /tea-ops/contracts/${c1}/activate", payload: {}, as: AccountManager, as_user_id: "am-1", captures: { p1: $.data.contract_unit_price_cents } }
            - { call: "POST /tea-ops/contracts/${c2}/activate", payload: {}, as: AccountManager, as_user_id: "am-1", captures: { p2: $.data.contract_unit_price_cents } }
          assert:
            - "9999 units: ${p1} == 200 (no tier)"
            - "10000 units: ${p2} == 190 (round_half_up(200 * 1.00 * 0.95))"

      - name: shelf_life_variants_covered
        claim_type: variant_divergence
        grounds:
          - "calculations.packed_shelf_life"
        excluded_because:
          difficulty_instance: shelf_life_provisional_vs_final
          rationale: "Both variants and their 326 vs 295 divergence are asserted in the named §1.8 instance."

      - name: yield_rounding_covered
        claim_type: precision
        grounds:
          - "calculations.moisture_adjusted_yield"
        excluded_because:
          difficulty_instance: yield_per_line_rounding_order
          rationale: "Per-line vs sum-then-round divergence (19.790 vs 19.789) is asserted in the named §1.8 instance."

  # ---------------------------------------------------------- validations ----
  - section: validations
    instances:
      - name: allocation_exceeds_remaining_rejected
        claim_type: violation_to_error
        grounds:
          - "entities.BatchLotAllocation.fields.allocated_kg"
          - "errors[ERR_LOT_WEIGHT_EXCEEDED]"
        distinguishing_aspect: "allocated_kg 25.0 against a lot with remaining_weight_kg 20.0 fails with ERR_LOT_WEIGHT_EXCEEDED; nothing is allocated."
        test_recipe:
          setup: ["supplier; BLACK lot 20.0 kg RELEASED; CONVENTIONAL TEA_BAG recipe [{BLACK,C,100.0}] ACTIVE; batch target 10.0 RECIPE_LOCKED"]
          setup_api_calls:
            - { call: "POST /tea-ops/suppliers", payload: { name: "W Co", origin_region: "Assam" }, as: ProcurementLead, as_user_id: "pl-1", captures: { sup: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "BLACK", harvest_date: "2026-02-01", weight_kg: 20.0, cost_per_kg_cents: 900, moisture_pct: 5.0 }, as: ProcurementLead, as_user_id: "pl-1", captures: { lot: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots/${lot}/grade-assessments", payload: { aroma_score: 80, briskness_score: 80, appearance_score: 80 }, as: SensoryGrader, as_user_id: "gr-1" }
            - { call: "POST /tea-ops/leaf-lots/${lot}/residue-tests", payload: { lab_name: "LabA", measured_residue_ppm: 0.20, test_method: "GCMS" }, as: QALabAnalyst, as_user_id: "an-1" }
            - { call: "POST /tea-ops/leaf-lots/${lot}/release", payload: {}, as: QAManager, as_user_id: "qa-1" }
            - { call: "POST /tea-ops/recipes", payload: { name: "RW", certification_target: "CONVENTIONAL", pack_format: "TEA_BAG", components: [{ leaf_type: "BLACK", min_grade: "C", pct: 100.0 }] }, as: BlendMaster, as_user_id: "bm-1", captures: { r: $.data.id } }
            - { call: "POST /tea-ops/recipes/${r}/activate", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches", payload: { recipe_id: "${r}", target_weight_kg: 10.0 }, as: BlendMaster, as_user_id: "bm-1", captures: { b: $.data.id } }
            - { call: "POST /tea-ops/batches/${b}/lock-recipe", payload: {}, as: BlendMaster, as_user_id: "bm-1", captures: { bv: $.data.version } }
          trigger:
            - { call: "POST /tea-ops/batches/${b}/allocations", payload: { lot_id: "${lot}", allocated_kg: 25.0, expected_batch_version: "${bv}" }, as: BlendMaster, as_user_id: "bm-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_LOT_WEIGHT_EXCEEDED"
            - "GET /tea-ops/batches/${b}/allocations returns total_count == 0"

      - name: duplicate_lot_allocation_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_DUPLICATE_LOT_ALLOCATION]"
          - "entities.BatchLotAllocation"
