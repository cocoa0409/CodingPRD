      - name: error_evaluation_patient_mismatch_on_plan
        claim_type: Cross-entity validation
        grounds: ["validations[priority=7]"]
        distinguishing_aspect: "Creating a plan for patient B that references patient A's FINALIZED evaluation returns 409 ERR_EVALUATION_PATIENT_MISMATCH."
        test_recipe:
          setup: ["Patient A with a FINALIZED eval; Patient B with an authorization."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "A", mrn: "MRN-A" }
              as: ClinicAdmin
              captures: { pat_a: $.data.id, pat_a_v: $.data.version }
            - call: "POST /evaluations"
