              as: AuctionStaff
              captures: { cg: "$.data.id" }
            - call: "POST /consignments/${cg}/appraise"
              payload: { appraised_low_cents: 100000, appraised_high_cents: 900000 }
              as: Appraiser
            - call: "POST /consignments/${cg}/decision"
              payload: { outcome: "ACCEPT" }
              as: AuctionStaff
            - call: "POST /lots"
              payload: { consignment_id: "${cg}", auction_id: "${au}", title: "Vase", category: "ART", reserve_cents: 0, starting_bid_cents: 400000, estimate_low_cents: 100000, estimate_high_cents: 900000, lot_number: 1 }
              as: AuctionStaff
              captures: { lot: "$.data.id" }
            - call: "POST /auctions/${au}/open"
              payload: {}
              as: AuctionStaff
            - call: "POST /lots/${lot}/open"
              payload: {}
              as: AuctionStaff
              captures: { lot_v: "$.data.version" }
            - call: "POST /bidders"
              payload: { display_name: "Buyer", email: "b@x.com", paddle_number: "P1", deposit_cents: 0 }
              as: AuctionStaff
              captures: { bd: "$.data.id" }
            - call: "POST /lots/${lot}/bids"
              payload: { bidder_id: "${bd}", bid_type: "LIVE", amount_cents: 500000, expected_lot_version: "${lot_v}" }
              as: Bidder
              as_user_id: "${bd}"
          trigger:
            - call: "POST /lots/${lot}/hammer"
              payload: {}
              as: AuctionStaff
              captures: { hp: "$.data.hammer_price_cents" }
            - call: "GET /invoice-lines?lot_id=${lot}"
              payload: {}
              as: AuctionStaff
              captures: { prem: "$.data[0].buyers_premium_cents", ltot: "$.data[0].line_total_cents" }
          assert:
            - "${hp} == 500000"
            - "${prem} == 115000"
            - "${ltot} == 615000"

      - name: cf_invoice_premium_round_then_sum
        grounds:
          - calculations.invoice_total
          - calculations.buyers_premium
          - entities.Invoice.fields.premium_subtotal_cents
        distinguishing_aspect: "Mode (b): two lines each hammer 100001 give per-line premium round_half_up(25000.25)=25000, so premium_subtotal=50000 (round-per-line-then-sum), NOT 50001 (sum-raw-then-round) — a rounding-order axis distinct from the tiered-selection mode (a)."
        test_recipe:
          setup:
            - "Bidder bd wins two lots each at hammer 100001 (starting 100001, reserve 0) in the same auction; both HAMMERED into one Invoice with two lines."
