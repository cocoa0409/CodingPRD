  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_priority_beats_temporal_on_late_result_to_closed_shipment
        grounds:
          - validations[priority=4]
          - validations[priority=7]
          - state_machines.PTShipment.OPEN_to_CLOSED
