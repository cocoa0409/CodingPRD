  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: deadline_satisfy_exactly_at_due_is_timely
        grounds:
          - state_machines.Deadline.PENDING_to_SATISFIED
          - state_machines.Deadline.PENDING_to_MISSED
          - entities.Deadline.fields.satisfied_late
        distinguishing_aspect: |
          Metric = timestamp vs computed_due_at on the satisfy endpoint: at exactly
          current_utc == computed_due_at the deadline is still PENDING and satisfies
          timely (satisfied_late == false); one second later the clock sweep flips it
          to MISSED — the boundary is '>' for lateness, not '>='.
        test_recipe:
          setup:
            - "Client, PUBLISHED record, INFRINGEMENT matter; two RESPONSE_DUE deadlines (basis 2026-08-07T09:00:00Z, offset 5, due 2026-08-14T09:00:00Z), both verified to PENDING"
          setup_api_calls:
            - call: "POST /brand/clients"
              payload: { name: "Acme Brands", industry: "consumer goods", enforcement_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /brand/trademark-records"
              payload: { client_id: "${client_id}", mark_text: "ACME", mark_type: WORD, jurisdiction: "US", nice_classes: [9, 25], application_number: "US-901" }
              as: Paralegal
              captures: { rec_id: $.data.id }
            - call: "POST /brand/trademark-records/${rec_id}/publish"
              payload: { publication_date: "2026-08-03T00:00:00Z" }
              as: Paralegal
            - call: "POST /brand/watch-alerts"
              payload: { trademark_record_id: "${rec_id}", source: WATCH_SERVICE, conflicting_mark_text: "AKME", conflicting_owner: "Rival Co", conflicting_classes: [9], similarity_mark: 80, similarity_goods: 70, similarity_channels: 60 }
              as: WatchService
              captures: { alert_id: $.data.id }
            - call: "POST /brand/watch-alerts/${alert_id}/triage"
              as: Paralegal
              captures: { av: $.data.version }
            - call: "POST /brand/watch-alerts/${alert_id}/assess"
              payload: { weight_mark: 0.6, weight_goods: 0.3, weight_channels: 0.1, fame_adjustment: 5, rationale: "strong", expected_watch_alert_version: "${av}" }
              as: AssociateAttorney
              as_user_id: assoc_1
            - call: "POST /brand/watch-alerts/${alert_id}/escalate"
              payload: { matter_type: INFRINGEMENT }
              as: AssociateAttorney
              as_user_id: assoc_1
              captures: { matter_id: $.data.id }
            - call: "POST /brand/enforcement-matters/${matter_id}/deadlines"
              payload: { deadline_type: RESPONSE_DUE, statutory_basis: "37 CFR 2.196", basis_date: "2026-08-07T09:00:00Z", offset_days: 5 }
              as: Paralegal
              as_user_id: para_1
              captures: { dl_a: $.data.id }
            - call: "POST /brand/enforcement-matters/${matter_id}/deadlines"
              payload: { deadline_type: RESPONSE_DUE, statutory_basis: "37 CFR 2.196", basis_date: "2026-08-07T09:00:00Z", offset_days: 5 }
              as: Paralegal
              as_user_id: para_1
              captures: { dl_b: $.data.id }
            - call: "POST /brand/deadlines/${dl_a}/verify"
              as: AssociateAttorney
              as_user_id: assoc_2
            - call: "POST /brand/deadlines/${dl_b}/verify"
              as: AssociateAttorney
              as_user_id: assoc_2
            - call: "POST /brand/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-14T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /brand/deadlines/${dl_a}/satisfy"
              as: Paralegal
            - call: "POST /brand/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-14T09:00:01Z" }
              as: PlatformAdmin
            - call: "GET /brand/deadlines/${dl_b}"
              as: Paralegal
          assert:
            - "Deadline.${dl_a}.status == SATISFIED and satisfied_late == false (satisfied at exactly computed_due_at)"
            - "After the +1s clock advance, Deadline.${dl_b}.status == MISSED (strict '>' boundary for lateness)"
            - "Deadline.${dl_b}.id was NOT satisfiable as timely at 2026-08-14T09:00:01Z"

      - name: escalate_threshold_score_70_vs_69_45
        grounds:
          - validations[priority=12]
          - errors[ERR_SCORE_BELOW_THRESHOLD]
          - calculations.confusion_score
        distinguishing_aspect: |
          Metric = confusion score on the escalate endpoint (different metric and
          endpoint than the deadline timestamp boundary): final_score exactly 70.00
          escalates successfully ('>=' inclusive) while 69.45 is rejected with
          ERR_SCORE_BELOW_THRESHOLD.
        test_recipe:
          setup:
            - "Client, PUBLISHED record; alertA (80/80/30) assessed with weights 0.55/0.25/0.20 -> 70.00; alertB (79/80/30) assessed with the same weights -> 69.45"
          setup_api_calls:
