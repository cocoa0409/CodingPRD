            - "no EquipmentInstallation row exists for the order and committed_pto_flow_gpm is still 0"
            - "re-issuing the same POST with hydraulic_circuit \"PRIMARY\" now returns 422 ERR_NON_STANDARD_POOL_EQUIPMENT — the lower-priority rule was masked, not absent"
            - "the same PRIMARY request on a CUSTOMER_SPECIFIC order over the same configuration returns 201, because the standardization rule only binds POOL_STOCK builds"

      - name: payload_shortfall_is_evaluated_from_the_result_of_the_weight_gates
        claim_type: Cascading validation
        grounds:
          - validations.priority_50_ERR_GVWR_EXCEEDED
