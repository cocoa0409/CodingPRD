            - call: "POST /_clock/set_current_utc"
              payload: { resort_id: "${resort_id}", to_iso8601: "2026-01-08T00:00:00Z" }
              as: ResortManager
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ResortManager
            - call: "POST /_clock/set_current_utc"
              payload: { resort_id: "${resort_id}", to_iso8601: "2026-02-01T00:00:00Z" }
              as: ResortManager
          trigger:
            - call: "POST /contracts/${contract_id}/rescind"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_STATE (state priority 7 beats window priority 8)"
            - "Contract.${contract_id}.status remains ACTIVE"

