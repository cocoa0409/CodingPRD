# =============================================================================
# §1.8 Scaffold Difficulty Design — Software License Audit Defense
# Test Targeting Index: 9 rules × 2 instances. Every instance is a self-contained
# empty-DB recipe over §1.5 endpoints. Clock default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: position_exposure_self_audit_vs_vendor_list
        grounds:
          - calculations.position_exposure
          - entities.LicensePosition.fields.self_audit_exposure_cents
          - entities.LicensePosition.fields.vendor_list_exposure_cents
        distinguishing_aspect: |
          Two variants price the SAME gap_quantity on a LicensePosition: self_audit
          (bare list) yields 300000 cents while vendor_list (list + one year support
          uplift) yields 366000 cents — a 66000-cent divergence on identical inputs.
        test_recipe:
          setup:
            - "Product P (unit_list_price_cents=10000, support_rate_pct=0.22, PER_INSTALL) with 100 ACTIVE entitled units and 130 CONFIRMED PRODUCTION deployed units: gap=30"
          setup_api_calls:
            - call: "POST /sam/vendors"
              payload: { name: "Vendor A", vendor_code: "VND-A", default_license_metric: "PER_INSTALL", notice_response_deadline_days: 30 }
              as: SAMPlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /sam/products"
              payload: { vendor_id: "${v_id}", name: "DataGrid Server", license_metric: "PER_INSTALL", unit_list_price_cents: 10000, support_rate_pct: 0.22 }
              as: SAMPlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /sam/entitlements"
              payload: { product_id: "${p_id}", purchase_order_number: "PO-100", quantity: 100, coverage_class: "PRODUCTION", effective_from: "2026-01-01T00:00:00Z", source: "MANUAL_IMPORT" }
              as: SAMManager
            - call: "POST /sam/deployments"
              payload: { product_id: "${p_id}", measured_quantity: 130, environment: "PRODUCTION", measurement_method: "SCAN", measured_on: "2026-07-15T00:00:00Z" }
              as: ITAnalyst
              captures: { d_id: $.data.id }
            - call: "POST /sam/deployments/${d_id}/confirm"
              payload: {}
              as: SAMManager
            - call: "GET /sam/products/${p_id}/license-positions"
              as: SAMManager
              captures: { pos_id: "$.data[0].id" }
          trigger:
            - call: "POST /sam/license-positions/${pos_id}/recalculate"
              payload: {}
              as: SAMManager
          assert:
            - "LicensePosition.${pos_id}.gap_quantity == 30"
            - "LicensePosition.${pos_id}.self_audit_exposure_cents == 300000"
            - "LicensePosition.${pos_id}.vendor_list_exposure_cents == 366000"
            - "LicensePosition.${pos_id}.gap_severity == CRITICAL"

      - name: case_rollup_provisional_vs_worst_case
        grounds:
          - calculations.case_exposure_rollup
          - entities.AuditCase.fields.provisional_case_exposure_cents
          - entities.AuditCase.fields.worst_case_exposure_cents
        distinguishing_aspect: |
          Different entity domain than position_exposure_self_audit_vs_vendor_list:
          the AuditCase aggregate exposes two variants — provisional (self-audit
          basis, 350000) vs worst_case (vendor-list basis, 426000) over the same two
          CONFIRMED scope items with no findings recorded.
        test_recipe:
          setup:
            - "P_A: unit 10000, support 0.22, entitled 100, deployed 130 (gap 30; self 300000; vendor_list 366000)"
            - "P_B: unit 5000, support 0.20, entitled 50, deployed 60 (gap 10; self 50000; vendor_list 60000)"
            - "Audit case in SCOPE_NEGOTIATION with both products' scope items CONFIRMED; no vendor findings"
          setup_api_calls:
            - call: "POST /sam/vendors"
              payload: { name: "Vendor A", vendor_code: "VND-A", default_license_metric: "PER_INSTALL", notice_response_deadline_days: 30 }
              as: SAMPlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /sam/products"
              payload: { vendor_id: "${v_id}", name: "DataGrid Server", license_metric: "PER_INSTALL", unit_list_price_cents: 10000, support_rate_pct: 0.22 }
              as: SAMPlatformAdmin
              captures: { pa_id: $.data.id }
            - call: "POST /sam/products"
              payload: { vendor_id: "${v_id}", name: "QueryTool Desktop", license_metric: "PER_USER", unit_list_price_cents: 5000, support_rate_pct: 0.2 }
              as: SAMPlatformAdmin
              captures: { pb_id: $.data.id }
            - call: "POST /sam/entitlements"
              payload: { product_id: "${pa_id}", purchase_order_number: "PO-A1", quantity: 100, coverage_class: "PRODUCTION", effective_from: "2026-01-01T00:00:00Z", source: "MANUAL_IMPORT" }
              as: SAMManager
            - call: "POST /sam/entitlements"
              payload: { product_id: "${pb_id}", purchase_order_number: "PO-B1", quantity: 50, coverage_class: "PRODUCTION", effective_from: "2026-01-01T00:00:00Z", source: "MANUAL_IMPORT" }
              as: SAMManager
            - call: "POST /sam/deployments"
              payload: { product_id: "${pa_id}", measured_quantity: 130, environment: "PRODUCTION", measurement_method: "SCAN", measured_on: "2026-07-15T00:00:00Z" }
              as: ITAnalyst
              captures: { da_id: $.data.id }
            - call: "POST /sam/deployments/${da_id}/confirm"
              payload: {}
              as: SAMManager
            - call: "POST /sam/deployments"
              payload: { product_id: "${pb_id}", measured_quantity: 60, environment: "PRODUCTION", measurement_method: "SCAN", measured_on: "2026-07-15T00:00:00Z" }
              as: ITAnalyst
              captures: { db_id: $.data.id }
            - call: "POST /sam/deployments/${db_id}/confirm"
              payload: {}
              as: SAMManager
            - call: "POST /sam/audit-cases"
              payload: { vendor_id: "${v_id}", audit_firm_name: "AuditCo LLP", notice_received_on: "2026-08-01T00:00:00Z" }
              as: LegalCounsel
              captures: { case_id: $.data.id }
            - call: "POST /sam/audit-cases/${case_id}/advance"
              payload: { to_state: "SCOPE_NEGOTIATION" }
              as: LegalCounsel
            - call: "POST /sam/audit-scope-items"
              payload: { audit_case_id: "${case_id}", product_id: "${pa_id}", inclusion_rationale: "Vendor believes DataGrid deployed enterprise-wide" }
              as: VendorAuditor
              captures: { si_a: $.data.id }
            - call: "POST /sam/audit-scope-items"
              payload: { audit_case_id: "${case_id}", product_id: "${pb_id}", inclusion_rationale: "Vendor believes QueryTool deployed enterprise-wide" }
              as: VendorAuditor
              captures: { si_b: $.data.id }
            - call: "POST /sam/audit-scope-items/${si_a}/confirm"
              payload: {}
              as: LegalCounsel
            - call: "POST /sam/audit-scope-items/${si_b}/confirm"
              payload: {}
              as: LegalCounsel
          trigger:
            - call: "GET /sam/audit-cases/${case_id}"
              as: LegalCounsel
          assert:
            - "AuditCase.${case_id}.provisional_case_exposure_cents == 350000"
            - "AuditCase.${case_id}.worst_case_exposure_cents == 426000"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: gap_severity_three_input_tiering
        grounds:
          - calculations.gap_and_severity
          - entities.LicensePosition.fields.gap_severity
        distinguishing_aspect: |
          Mode (a): the tier decision combines >=3 inputs (gap_quantity, exact
          deployed/entitled ratio, mission_critical flag) with nested branches —
          CRITICAL at ratio 1.125 (below MATERIAL_RATIO 1.25) is only reachable via
          the mission_critical && gap >= 25 branch, proving the flag path fires.
        test_recipe:
          setup:
            - "Mission-critical product, entitled 200, deployed 224 CONFIRMED: gap 24, ratio 1.12 -> MATERIAL"
          setup_api_calls:
            - call: "POST /sam/vendors"
              payload: { name: "Vendor A", vendor_code: "VND-A", default_license_metric: "PER_CORE", notice_response_deadline_days: 30 }
              as: SAMPlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /sam/products"
              payload: { vendor_id: "${v_id}", name: "CoreDB", license_metric: "PER_CORE", unit_list_price_cents: 10000, support_rate_pct: 0.22, mission_critical: true }
              as: SAMPlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /sam/entitlements"
              payload: { product_id: "${p_id}", purchase_order_number: "PO-1", quantity: 200, coverage_class: "PRODUCTION", effective_from: "2026-01-01T00:00:00Z", source: "MANUAL_IMPORT" }
              as: SAMManager
            - call: "POST /sam/deployments"
              payload: { product_id: "${p_id}", measured_quantity: 124, environment: "PRODUCTION", measurement_method: "SCAN", measured_on: "2026-07-15T00:00:00Z" }
              as: ITAnalyst
              captures: { d1: $.data.id }
            - call: "POST /sam/deployments"
              payload: { product_id: "${p_id}", measured_quantity: 100, environment: "PRODUCTION", measurement_method: "SCAN", measured_on: "2026-07-15T00:00:00Z" }
              as: ITAnalyst
              captures: { d2: $.data.id }
            - call: "POST /sam/deployments/${d1}/confirm"
              payload: {}
              as: SAMManager
            - call: "POST /sam/deployments/${d2}/confirm"
              payload: {}
              as: SAMManager
            - call: "GET /sam/products/${p_id}/license-positions"
              as: SAMManager
              captures: { pos_id: "$.data[0].id", pre_sev: "$.data[0].gap_severity" }
          trigger:
            - call: "POST /sam/deployments"
              payload: { product_id: "${p_id}", measured_quantity: 1, environment: "PRODUCTION", measurement_method: "MANUAL_DECLARATION", measured_on: "2026-07-16T00:00:00Z" }
              as: ITAnalyst
              captures: { d3: $.data.id }
            - call: "POST /sam/deployments/${d3}/confirm"
              payload: {}
              as: SAMManager
            - call: "POST /sam/license-positions/${pos_id}/recalculate"
              payload: {}
              as: SAMManager
              captures: { post_sev: $.data.gap_severity }
          assert:
            - "pre_sev == MATERIAL (gap 24, ratio 1.12: above grace 1.05 but no CRITICAL branch)"
            - "LicensePosition.${pos_id}.gap_quantity == 25"
            - "post_sev == CRITICAL (mission_critical && gap >= 25 fires although ratio 1.125 < 1.25)"

      - name: vendor_finding_per_line_rounding_order
        grounds:
          - calculations.vendor_finding_line_pricing
          - calculations.case_exposure_rollup
          - entities.AuditScopeItem.fields.vendor_finding_amount_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — each finding line is rounded
          half-up to cents THEN summed (333 * 1.44 = 479.52 -> 480 per line; two
          lines total 960). The rejected sum-then-round order yields 959, so the
          one-cent delta proves the pinned order.
        test_recipe:
          setup:
            - "P1 and P2 each: unit_list_price_cents 333, support_rate_pct 0.22 (line factor 1.44), entitled 10, deployed 11 CONFIRMED (gap 1 each)"
            - "Audit case advanced to FINDINGS_REVIEW with both items CONFIRMED and one RELEASED submission covering both"
          setup_api_calls:
            - call: "POST /sam/vendors"
              payload: { name: "Vendor A", vendor_code: "VND-A", default_license_metric: "PER_INSTALL", notice_response_deadline_days: 30 }
              as: SAMPlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /sam/products"
              payload: { vendor_id: "${v_id}", name: "Prod One", license_metric: "PER_INSTALL", unit_list_price_cents: 333, support_rate_pct: 0.22 }
              as: SAMPlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /sam/products"
              payload: { vendor_id: "${v_id}", name: "Prod Two", license_metric: "PER_INSTALL", unit_list_price_cents: 333, support_rate_pct: 0.22 }
              as: SAMPlatformAdmin
              captures: { p2: $.data.id }
            - call: "POST /sam/entitlements"
              payload: { product_id: "${p1}", purchase_order_number: "PO-P1", quantity: 10, coverage_class: "PRODUCTION", effective_from: "2026-01-01T00:00:00Z", source: "MANUAL_IMPORT" }
              as: SAMManager
            - call: "POST /sam/entitlements"
              payload: { product_id: "${p2}", purchase_order_number: "PO-P2", quantity: 10, coverage_class: "PRODUCTION", effective_from: "2026-01-01T00:00:00Z", source: "MANUAL_IMPORT" }
              as: SAMManager
            - call: "POST /sam/deployments"
              payload: { product_id: "${p1}", measured_quantity: 11, environment: "PRODUCTION", measurement_method: "SCAN", measured_on: "2026-07-15T00:00:00Z" }
              as: ITAnalyst
              captures: { dp1: $.data.id }
            - call: "POST /sam/deployments/${dp1}/confirm"
              payload: {}
              as: SAMManager
            - call: "POST /sam/deployments"
              payload: { product_id: "${p2}", measured_quantity: 11, environment: "PRODUCTION", measurement_method: "SCAN", measured_on: "2026-07-15T00:00:00Z" }
              as: ITAnalyst
              captures: { dp2: $.data.id }
            - call: "POST /sam/deployments/${dp2}/confirm"
              payload: {}
              as: SAMManager
            - call: "POST /sam/audit-cases"
              payload: { vendor_id: "${v_id}", audit_firm_name: "AuditCo LLP", notice_received_on: "2026-08-01T00:00:00Z" }
              as: LegalCounsel
              captures: { case_id: $.data.id }
            - call: "POST /sam/audit-cases/${case_id}/advance"
              payload: { to_state: "SCOPE_NEGOTIATION" }
              as: LegalCounsel
            - call: "POST /sam/audit-scope-items"
              payload: { audit_case_id: "${case_id}", product_id: "${p1}", inclusion_rationale: "scope p1" }
              as: VendorAuditor
              captures: { si1: $.data.id }
            - call: "POST /sam/audit-scope-items/${si1}/confirm"
              payload: {}
              as: LegalCounsel
            - call: "POST /sam/audit-scope-items"
              payload: { audit_case_id: "${case_id}", product_id: "${p2}", inclusion_rationale: "scope p2" }
              as: VendorAuditor
              captures: { si2: $.data.id }
            - call: "POST /sam/audit-scope-items/${si2}/confirm"
              payload: {}
              as: LegalCounsel
            - call: "POST /sam/audit-cases/${case_id}/advance"
              payload: { to_state: "EVIDENCE_COLLECTION" }
              as: LegalCounsel
            - call: "POST /sam/data-submissions"
              payload: { audit_case_id: "${case_id}", submission_label: "Deployment extracts", covered_scope_item_ids: ["${si1}", "${si2}"] }
              as: SAMManager
              as_user_id: "sam-mgr-1"
              captures: { sub_id: $.data.id }
            - call: "POST /sam/data-submissions/${sub_id}/submit-for-review"
              payload: {}
              as: SAMManager
            - call: "POST /sam/data-submissions/${sub_id}/approve"
              payload: {}
              as: LegalCounsel
              as_user_id: "counsel-1"
            - call: "POST /sam/data-submissions/${sub_id}/release"
              payload: {}
              as: LegalCounsel
              as_user_id: "counsel-1"
            - call: "POST /sam/audit-cases/${case_id}/advance"
              payload: { to_state: "FINDINGS_REVIEW" }
              as: LegalCounsel
            - call: "POST /sam/audit-scope-items/${si1}/vendor-finding"
              payload: {}
              as: VendorAuditor
              captures: { f1: $.data.vendor_finding_amount_cents }
          trigger:
            - call: "POST /sam/audit-scope-items/${si2}/vendor-finding"
              payload: {}
              as: VendorAuditor
              captures: { f2: $.data.vendor_finding_amount_cents }
            - call: "GET /sam/audit-cases/${case_id}"
              as: LegalCounsel
              captures: { worst: $.data.worst_case_exposure_cents }
          assert:
            - "f1 == 480"
            - "f2 == 480"
            - "worst == 960 (per-line round then sum; sum-then-round would give 959)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: scope_item_dispute_repropose_cycle
        grounds:
          - state_machines.AuditScopeItem.PROPOSED_to_DISPUTED
          - state_machines.AuditScopeItem.DISPUTED_to_PROPOSED
          - state_machines.AuditScopeItem.PROPOSED_to_CONFIRMED
        distinguishing_aspect: |
          AuditScopeItem runs a true cycle on ONE row: PROPOSED -> DISPUTED ->
          PROPOSED -> CONFIRMED; the item id never changes while version increments
          each loop — no new entity is created per negotiation round.
        test_recipe:
          setup:
            - "Audit case in SCOPE_NEGOTIATION; one VENDOR-proposed scope item in PROPOSED"
          setup_api_calls:
            - call: "POST /sam/vendors"
              payload: { name: "Vendor A", vendor_code: "VND-A", default_license_metric: "PER_INSTALL", notice_response_deadline_days: 30 }
              as: SAMPlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /sam/products"
              payload: { vendor_id: "${v_id}", name: "Prod", license_metric: "PER_INSTALL", unit_list_price_cents: 10000, support_rate_pct: 0.22 }
              as: SAMPlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /sam/audit-cases"
              payload: { vendor_id: "${v_id}", audit_firm_name: "AuditCo LLP", notice_received_on: "2026-08-01T00:00:00Z" }
              as: LegalCounsel
              captures: { case_id: $.data.id }
            - call: "POST /sam/audit-cases/${case_id}/advance"
              payload: { to_state: "SCOPE_NEGOTIATION" }
              as: LegalCounsel
            - call: "POST /sam/audit-scope-items"
              payload: { audit_case_id: "${case_id}", product_id: "${p_id}", inclusion_rationale: "believe deployed" }
              as: VendorAuditor
              captures: { si: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /sam/audit-scope-items/${si}/dispute"
              payload: { dispute_rationale: "Retired product line, contract excludes it" }
              as: LegalCounsel
              captures: { s1: $.data.scope_status, v1: $.data.version }
            - call: "POST /sam/audit-scope-items/${si}/repropose"
              payload: { inclusion_rationale: "Revised: contract amendment 4 brings it in scope" }
              as: VendorAuditor
              captures: { s2: $.data.scope_status, v2: $.data.version }
            - call: "POST /sam/audit-scope-items/${si}/confirm"
              payload: {}
              as: LegalCounsel
              captures: { s3: $.data.scope_status, v3: $.data.version }
          assert:
            - "s1 == DISPUTED"
            - "s2 == PROPOSED"
            - "s3 == CONFIRMED"
            - "v1 == v0 + 1 and v2 == v1 + 1 and v3 == v2 + 1 (same row ${si} through the whole loop)"

      - name: submission_privilege_return_cycle
        grounds:
          - state_machines.DataSubmission.DRAFT_to_PRIVILEGE_REVIEW
          - state_machines.DataSubmission.PRIVILEGE_REVIEW_to_DRAFT
          - state_machines.DataSubmission.PRIVILEGE_REVIEW_to_APPROVED
          - state_machines.DataSubmission.APPROVED_to_RELEASED
        distinguishing_aspect: |
          Different entity than the scope-item cycle: DataSubmission loops
          DRAFT -> PRIVILEGE_REVIEW -> DRAFT -> PRIVILEGE_REVIEW -> APPROVED ->
          RELEASED on one row, and the release freezes a 50000-cent exposure
          snapshot computed only from covered CONFIRMED items.
        test_recipe:
          setup:
            - "Product with entitled 100 / deployed 105 CONFIRMED (gap 5, self-audit exposure 50000)"
            - "Audit case in EVIDENCE_COLLECTION with the product's scope item CONFIRMED"
            - "Submission covering that item, prepared by sam-mgr-1"
          setup_api_calls:
            - call: "POST /sam/vendors"
              payload: { name: "Vendor A", vendor_code: "VND-A", default_license_metric: "PER_INSTALL", notice_response_deadline_days: 30 }
              as: SAMPlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /sam/products"
              payload: { vendor_id: "${v_id}", name: "Prod", license_metric: "PER_INSTALL", unit_list_price_cents: 10000, support_rate_pct: 0.22 }
              as: SAMPlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /sam/entitlements"
              payload: { product_id: "${p_id}", purchase_order_number: "PO-1", quantity: 100, coverage_class: "PRODUCTION", effective_from: "2026-01-01T00:00:00Z", source: "MANUAL_IMPORT" }
              as: SAMManager
            - call: "POST /sam/deployments"
              payload: { product_id: "${p_id}", measured_quantity: 105, environment: "PRODUCTION", measurement_method: "SCAN", measured_on: "2026-07-15T00:00:00Z" }
              as: ITAnalyst
              captures: { d1: $.data.id }
            - call: "POST /sam/deployments/${d1}/confirm"
              payload: {}
              as: SAMManager
            - call: "POST /sam/audit-cases"
              payload: { vendor_id: "${v_id}", audit_firm_name: "AuditCo LLP", notice_received_on: "2026-08-01T00:00:00Z" }
              as: LegalCounsel
              captures: { case_id: $.data.id }
            - call: "POST /sam/audit-cases/${case_id}/advance"
              payload: { to_state: "SCOPE_NEGOTIATION" }
              as: LegalCounsel
            - call: "POST /sam/audit-scope-items"
              payload: { audit_case_id: "${case_id}", product_id: "${p_id}", inclusion_rationale: "in scope" }
              as: VendorAuditor
              captures: { si: $.data.id }
            - call: "POST /sam/audit-scope-items/${si}/confirm"
              payload: {}
              as: LegalCounsel
            - call: "POST /sam/audit-cases/${case_id}/advance"
              payload: { to_state: "EVIDENCE_COLLECTION" }
              as: LegalCounsel
            - call: "POST /sam/data-submissions"
              payload: { audit_case_id: "${case_id}", submission_label: "Usage extract", covered_scope_item_ids: ["${si}"] }
              as: SAMManager
              as_user_id: "sam-mgr-1"
              captures: { sub: $.data.id }
            - call: "POST /sam/data-submissions/${sub}/submit-for-review"
              payload: {}
              as: SAMManager
          trigger:
            - call: "POST /sam/data-submissions/${sub}/return"
              payload: { return_reason: "Contains internal legal memo; redact page 3" }
              as: LegalCounsel
              captures: { r1: $.data.status }
            - call: "POST /sam/data-submissions/${sub}/submit-for-review"
              payload: {}
              as: SAMManager
              captures: { r2: $.data.status }
            - call: "POST /sam/data-submissions/${sub}/approve"
              payload: {}
              as: LegalCounsel
              as_user_id: "counsel-1"
              captures: { r3: $.data.status }
            - call: "POST /sam/data-submissions/${sub}/release"
              payload: {}
              as: LegalCounsel
              as_user_id: "counsel-1"
              captures: { r4: $.data.status, snap: $.data.released_exposure_cents }
          assert:
            - "r1 == DRAFT"
            - "r2 == PRIVILEGE_REVIEW"
            - "r3 == APPROVED"
            - "r4 == RELEASED"
            - "snap == 50000"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: true_up_remediation_cascade
        grounds:
          - state_machines.RemediationAction.IN_PROGRESS_to_COMPLETED
          - state_machines.EntitlementRecord.create_to_ACTIVE
          - calculations.entitled_quantity
          - calculations.case_exposure_rollup
          - calculations.alert_evaluation
        distinguishing_aspect: |
          Depth-4 chain from remediation completion: RemediationAction COMPLETED ->
          creates AUTO_TRUE_UP EntitlementRecord -> LicensePosition recompute
          (entitled 100->130, gap 30->0, severity CRITICAL->COMPLIANT) -> AuditCase
          rollups recomputed (provisional 300000->0) -> OVER_DEPLOYMENT alert
          auto-RESOLVED. Each link is caused by the previous link, not the trigger.
        test_recipe:
          setup:
            - "Product: entitled 100, deployed 130 CONFIRMED (gap 30 CRITICAL); OVER_DEPLOYMENT alert OPEN"
            - "Audit case in SCOPE_NEGOTIATION with the product's scope item CONFIRMED; provisional rollup 300000"
            - "Remediation PURCHASE_TRUE_UP quantity 30 created and started"
          setup_api_calls:
            - call: "POST /sam/vendors"
