            - { call: "POST /packinghouse/groves/${tc_gr}/maturity-tests", payload: { sampled_at: "2026-07-31T10:00:00Z", brix: 9.0, acid_pct: 1.0, juice_pct: 45.0, expected_grove_version: "${tc_gr_v}" }, as: QualityInspector, as_user_id: "qi_tc1" }
            - { call: "POST /packinghouse/pools", payload: { variety: HAMLIN, week_start: "2026-07-27" }, as: PoolAccountant, captures: { tc_p: "$.data.id" } }
            - { call: "POST /packinghouse/allocation-channels", payload: { channel_code: "JP-TC1", channel_type: EXPORT, destination_market: JAPAN, variety: HAMLIN, week_start: "2026-07-27", allocation_boxes: 25, price_cents_per_box: 900, priority_rank: 1, accepts_grades: ["FANCY"] }, as: PackinghouseAdmin, captures: { tc_jp: "$.data.id" } }
            - { call: "POST /packinghouse/allocation-channels", payload: { channel_code: "DOM-TC1", channel_type: DOMESTIC_FRESH, destination_market: DOMESTIC, variety: HAMLIN, week_start: "2026-07-27", allocation_boxes: 40, price_cents_per_box: 500, priority_rank: 2, accepts_grades: ["FANCY", "CHOICE", "STANDARD"] }, as: PackinghouseAdmin, captures: { tc_dom: "$.data.id" } }
            - { call: "POST /packinghouse/allocation-channels", payload: { channel_code: "JU-TC1", channel_type: JUICE, destination_market: NONE, variety: HAMLIN, week_start: "2026-07-27", allocation_boxes: 0, price_cents_per_box: 220, priority_rank: 9, accepts_grades: ["FANCY", "CHOICE", "STANDARD", "JUICE"] }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/crews", payload: { crew_code: "CR-TC1", daily_capacity_boxes: 400 }, as: PackinghouseAdmin, captures: { tc_c: "$.data.id" } }
            - { call: "POST /packinghouse/harvest-assignments", payload: { crew_id: "${tc_c}", grove_id: "${tc_gr}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T12:00:00Z", planned_boxes: 100 }, as: FieldSupervisor, captures: { tc_a: "$.data.id" } }
            - { call: "POST /packinghouse/harvest-assignments/${tc_a}/start", payload: {}, as: FieldSupervisor }
            - { call: "POST /packinghouse/deliveries", payload: { grove_id: "${tc_gr}", assignment_id: "${tc_a}", gross_boxes: 100, tare_boxes: 0 }, as: FieldSupervisor, captures: { tc_d: "$.data.id", tc_d_v: "$.data.version" } }
            - { call: "POST /packinghouse/sort-runs", payload: { delivery_id: "${tc_d}", fancy_boxes: 40, choice_boxes: 30, standard_boxes: 20, juice_boxes: 8, cull_boxes: 2, color_score: 7, defect_pct: 10, expected_delivery_version: "${tc_d_v}" }, as: LineOperator, as_user_id: "op_tc1", captures: { tc_sr: "$.data.id" } }
            - { call: "POST /packinghouse/sort-runs/${tc_sr}/verify", payload: {}, as: QualityInspector, as_user_id: "qi_tc1" }
            - { call: "POST /packinghouse/sort-runs/${tc_sr}/post", payload: {}, as: LineOperator, as_user_id: "op_tc1" }
          trigger:
            - { call: "POST /packinghouse/sort-runs/${tc_sr}/reverse", payload: {}, as: PoolAccountant }
          assert:
            - "SortRun.${tc_sr}.status == VOIDED (link A)"
            - "Delivery.${tc_d}.processing_status == READY_TO_SORT (link B, caused by the reversal)"
            - "Pool.${tc_p}: posted_ge_boxes == 0, posted_proceeds_cents == 0, sorted_field_boxes == 0 (link C, caused by the run's voiding)"
            - "Pool.${tc_p}.provisional_price_cents_per_ge_box == 654 — the pre-post forward-looking value is exactly restored"
            - "AllocationChannel.${tc_jp}.remaining_boxes == 25 and AllocationChannel.${tc_dom}.remaining_boxes == 40 (capacity restoration)"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_safety_assignment_start
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_INVALID_STATE_TRANSITION]
          - errors[ERR_GROVE_QUARANTINED]
        distinguishing_aspect: |
          Category pair STATE vs BUSINESS_SAFETY: the assignment is CANCELLED
          (state failure, priority 6) AND its grove is QUARANTINED (safety
          failure, priority 7); the dual-failure request must surface
          ERR_INVALID_STATE_TRANSITION because state outranks safety.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; grower, HAMLIN grove with CURRENT PASS maturity; crew; assignment A window [2026-08-01T00:00,2026-08-01T12:00) then CANCELLED"
            - "Grove under ACTIVE GROVE-scope CANKER quarantine"
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-PP1", display_name: "Priority Pair Groves" }, as: PackinghouseAdmin, captures: { pp_g: "$.data.id" } }
            - { call: "POST /packinghouse/groves", payload: { grower_id: "${pp_g}", block_code: "B1", variety: HAMLIN, acreage: 50, county_code: "POLK" }, as: PackinghouseAdmin, captures: { pp_gr: "$.data.id", pp_gr_v: "$.data.version" } }
            - { call: "POST /packinghouse/groves/${pp_gr}/maturity-tests", payload: { sampled_at: "2026-07-31T10:00:00Z", brix: 9.0, acid_pct: 1.0, juice_pct: 45.0, expected_grove_version: "${pp_gr_v}" }, as: QualityInspector, as_user_id: "qi_pp1" }
            - { call: "POST /packinghouse/crews", payload: { crew_code: "CR-PP1", daily_capacity_boxes: 400 }, as: PackinghouseAdmin, captures: { pp_c: "$.data.id" } }
            - { call: "POST /packinghouse/harvest-assignments", payload: { crew_id: "${pp_c}", grove_id: "${pp_gr}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T12:00:00Z", planned_boxes: 100 }, as: FieldSupervisor, captures: { pp_a: "$.data.id" } }
            - { call: "POST /packinghouse/harvest-assignments/${pp_a}/cancel", payload: {}, as: FieldSupervisor }
            - { call: "POST /packinghouse/quarantine-orders", payload: { scope_type: GROVE, grove_id: "${pp_gr}", pest_type: CANKER }, as: ComplianceOfficer, as_user_id: "co_pp_a" }
          trigger:
            - { call: "POST /packinghouse/harvest-assignments/${pp_a}/start", payload: {}, as: FieldSupervisor, captures: { pp_err: "$.data.error_id" } }
          assert:
            - "${pp_err} == ERR_INVALID_STATE_TRANSITION (state priority 6 beats business_safety priority 7; NOT ERR_GROVE_QUARANTINED)"
            - "HarvestAssignment.${pp_a}.status remains CANCELLED and Grove.${pp_gr}.quarantine_posture remains QUARANTINED"

      - name: temporal_vs_fiscal_delivery_create
        grounds:
          - validations[priority=11]
          - validations[priority=12]
          - errors[ERR_MATURITY_TEST_EXPIRED]
          - errors[ERR_GROWER_NOT_ACTIVE]
        distinguishing_aspect: |
          Category pair BUSINESS_TEMPORAL vs BUSINESS_FISCAL (different pair
          from the state/safety instance): the grove's maturity test is EXPIRED
          (temporal, priority 11) AND the grower is SUSPENDED (fiscal standing,
          priority 12); the delivery create must surface
          ERR_MATURITY_TEST_EXPIRED because temporal outranks fiscal.
        test_recipe:
          setup:
            - "Grower GR-PP2 (later SUSPENDED); HAMLIN grove; maturity test sampled 2026-07-26T00:00:00Z -> expires 2026-07-31T00:00:00Z, result PASS"
            - "Pool HAMLIN wk 2026-07-27 OPEN; assignment window [2026-07-30T06:00,2026-08-01T06:00) STARTED at clock 2026-07-30T12:00:00Z (maturity then valid)"
            - "Clock advanced to 2026-08-01T00:00:01Z (maturity now expired); grower SUSPENDED"
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-07-30T12:00:00Z" }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-PP2", display_name: "Temporal Fiscal Groves" }, as: PackinghouseAdmin, captures: { tf_g: "$.data.id" } }
            - { call: "POST /packinghouse/groves", payload: { grower_id: "${tf_g}", block_code: "B1", variety: HAMLIN, acreage: 50, county_code: "POLK" }, as: PackinghouseAdmin, captures: { tf_gr: "$.data.id", tf_gr_v: "$.data.version" } }
            - { call: "POST /packinghouse/groves/${tf_gr}/maturity-tests", payload: { sampled_at: "2026-07-26T00:00:00Z", brix: 9.0, acid_pct: 1.0, juice_pct: 45.0, expected_grove_version: "${tf_gr_v}" }, as: QualityInspector, as_user_id: "qi_pp2" }
            - { call: "POST /packinghouse/pools", payload: { variety: HAMLIN, week_start: "2026-07-27" }, as: PoolAccountant, captures: { tf_p: "$.data.id" } }
            - { call: "POST /packinghouse/crews", payload: { crew_code: "CR-PP2", daily_capacity_boxes: 400 }, as: PackinghouseAdmin, captures: { tf_c: "$.data.id" } }
            - { call: "POST /packinghouse/harvest-assignments", payload: { crew_id: "${tf_c}", grove_id: "${tf_gr}", window_start: "2026-07-30T06:00:00Z", window_end: "2026-08-01T06:00:00Z", planned_boxes: 50 }, as: FieldSupervisor, captures: { tf_a: "$.data.id" } }
            - { call: "POST /packinghouse/harvest-assignments/${tf_a}/start", payload: {}, as: FieldSupervisor }
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:01Z" }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/growers/${tf_g}/suspend", payload: {}, as: PoolAccountant }
          trigger:
            - { call: "POST /packinghouse/deliveries", payload: { grove_id: "${tf_gr}", assignment_id: "${tf_a}", gross_boxes: 10, tare_boxes: 0 }, as: FieldSupervisor, captures: { tf_err: "$.data.error_id" } }
          assert:
            - "${tf_err} == ERR_MATURITY_TEST_EXPIRED (business_temporal priority 11 beats business_fiscal priority 12; NOT ERR_GROWER_NOT_ACTIVE)"
            - "No Delivery row is created for the grove; Grower.${tf_g}.status remains SUSPENDED"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: maturity_ratio_rounding_boundary
        grounds:
          - calculations.maturity_evaluation
          - entities.MaturityTest.fields.ratio
          - state_machines.MaturityTest.CURRENT_to_SUPERSEDED
        distinguishing_aspect: |
          Boundary metric = ROUNDED ratio vs inclusive >= threshold on the
          maturity-test endpoint: HAMLIN min_ratio 9.0; brix 8.994/acid 1.0 ->
          8.99 FAIL, but brix 8.995 -> round_half_up 9.00 PASS. The rounding-
          before-comparison order is what flips the result.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; grower with one HAMLIN grove (no tests yet)"
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-MB1", display_name: "Maturity Boundary Groves" }, as: PackinghouseAdmin, captures: { mb_g: "$.data.id" } }
            - { call: "POST /packinghouse/groves", payload: { grower_id: "${mb_g}", block_code: "B1", variety: HAMLIN, acreage: 50, county_code: "POLK" }, as: PackinghouseAdmin, captures: { mb_gr: "$.data.id", mb_gr_v: "$.data.version" } }
          trigger:
            - { call: "POST /packinghouse/groves/${mb_gr}/maturity-tests", payload: { sampled_at: "2026-07-31T10:00:00Z", brix: 8.994, acid_pct: 1.0, juice_pct: 45.0, expected_grove_version: "${mb_gr_v}" }, as: QualityInspector, as_user_id: "qi_mb1", captures: { mb_t1: "$.data.id" } }
            - { call: "GET /packinghouse/groves/${mb_gr}", payload: {}, as: QualityInspector, captures: { mb_gr_v2: "$.data.version" } }
            - { call: "POST /packinghouse/groves/${mb_gr}/maturity-tests", payload: { sampled_at: "2026-07-31T10:00:00Z", brix: 8.995, acid_pct: 1.0, juice_pct: 45.0, expected_grove_version: "${mb_gr_v2}" }, as: QualityInspector, as_user_id: "qi_mb1", captures: { mb_t2: "$.data.id", mb_t2_ratio: "$.data.ratio" } }
          assert:
            - "MaturityTest.${mb_t1}: ratio == 8.99 and result == FAIL (8.994 rounds DOWN below the 9.0 threshold)"
            - "MaturityTest.${mb_t2}: ratio == 9.0 and result == PASS (8.995 rounds HALF-UP onto the inclusive threshold)"
            - "MaturityTest.${mb_t1}.status == SUPERSEDED and MaturityTest.${mb_t2}.status == CURRENT (create-with-supersede)"
            - "MaturityTest.${mb_t2}.expires_at == 2026-08-05T10:00:00Z (sampled_at + 120h)"

      - name: degreening_capacity_exact_fit
        grounds:
          - calculations.degreening_capacity_check
          - errors[ERR_ROOM_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Boundary metric = aggregate overlapping boxes vs inclusive <= capacity
          on the degreening-session endpoint (different metric and endpoint from
          the maturity ratio boundary): 60 + 40 == 100 fits exactly, but one
          additional overlapping box (101) is rejected.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; grower, HAMLIN grove, CURRENT PASS maturity, pool OPEN, crew + assignment IN_PROGRESS"
            - "Degreening room RM cap 100 (min 12h, max 72h); three deliveries of 60, 40, and 1 net boxes"
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-DC1", display_name: "Degreening Capacity Groves" }, as: PackinghouseAdmin, captures: { dc_g: "$.data.id" } }
            - { call: "POST /packinghouse/groves", payload: { grower_id: "${dc_g}", block_code: "B1", variety: HAMLIN, acreage: 50, county_code: "POLK" }, as: PackinghouseAdmin, captures: { dc_gr: "$.data.id", dc_gr_v: "$.data.version" } }
            - { call: "POST /packinghouse/groves/${dc_gr}/maturity-tests", payload: { sampled_at: "2026-07-31T10:00:00Z", brix: 9.0, acid_pct: 1.0, juice_pct: 45.0, expected_grove_version: "${dc_gr_v}" }, as: QualityInspector, as_user_id: "qi_dc1" }
            - { call: "POST /packinghouse/pools", payload: { variety: HAMLIN, week_start: "2026-07-27" }, as: PoolAccountant }
            - { call: "POST /packinghouse/crews", payload: { crew_code: "CR-DC1", daily_capacity_boxes: 400 }, as: PackinghouseAdmin, captures: { dc_c: "$.data.id" } }
            - { call: "POST /packinghouse/degreening-rooms", payload: { room_code: "RM-DC1", capacity_boxes: 100, min_hours: 12, max_hours: 72 }, as: PackinghouseAdmin, captures: { dc_rm: "$.data.id" } }
            - { call: "POST /packinghouse/harvest-assignments", payload: { crew_id: "${dc_c}", grove_id: "${dc_gr}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T12:00:00Z", planned_boxes: 200 }, as: FieldSupervisor, captures: { dc_a: "$.data.id" } }
            - { call: "POST /packinghouse/harvest-assignments/${dc_a}/start", payload: {}, as: FieldSupervisor }
            - { call: "POST /packinghouse/deliveries", payload: { grove_id: "${dc_gr}", assignment_id: "${dc_a}", gross_boxes: 60, tare_boxes: 0 }, as: FieldSupervisor, captures: { dc_d1: "$.data.id" } }
            - { call: "POST /packinghouse/deliveries", payload: { grove_id: "${dc_gr}", assignment_id: "${dc_a}", gross_boxes: 40, tare_boxes: 0 }, as: FieldSupervisor, captures: { dc_d2: "$.data.id" } }
            - { call: "POST /packinghouse/deliveries", payload: { grove_id: "${dc_gr}", assignment_id: "${dc_a}", gross_boxes: 1, tare_boxes: 0 }, as: FieldSupervisor, captures: { dc_d3: "$.data.id" } }
          trigger:
            - { call: "POST /packinghouse/degreening-sessions", payload: { room_id: "${dc_rm}", delivery_id: "${dc_d1}", boxes: 60, planned_hours: 24 }, as: LineOperator, as_user_id: "op_dc1", captures: { dc_s1: "$.data.id" } }
            - { call: "POST /packinghouse/degreening-sessions", payload: { room_id: "${dc_rm}", delivery_id: "${dc_d2}", boxes: 40, planned_hours: 24 }, as: LineOperator, as_user_id: "op_dc1", captures: { dc_s2: "$.data.id" } }
            - { call: "POST /packinghouse/degreening-sessions", payload: { room_id: "${dc_rm}", delivery_id: "${dc_d3}", boxes: 1, planned_hours: 24 }, as: LineOperator, as_user_id: "op_dc1", captures: { dc_err: "$.data.error_id" } }
          assert:
            - "Sessions ${dc_s1} (60 boxes) and ${dc_s2} (40 boxes) both CONDITIONING: aggregate 100 == capacity 100 is accepted (inclusive <=)"
            - "Third session (1 box) rejected: ${dc_err} == ERR_ROOM_CAPACITY_EXCEEDED (101 > 100 at the overlapping instant)"
            - "Deliveries ${dc_d1} and ${dc_d2} moved RECEIVED -> IN_DEGREENING; ${dc_d3} remains RECEIVED"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: assignment_start_gated_by_grove_quarantine
        grounds:
          - state_machines.HarvestAssignment.SCHEDULED_to_IN_PROGRESS
          - entities.Grove.fields.quarantine_posture
          - errors[ERR_GROVE_QUARANTINED]
        distinguishing_aspect: |
          Entity pair HarvestAssignment -> Grove: the start transition's guard
          reads the GROVE's computed quarantine_posture, not the assignment's
          own fields; the transition becomes legal only after the quarantine is
          released by a different officer.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; grower, HAMLIN grove with CURRENT PASS maturity; crew; assignment window [2026-08-01T00:00,2026-08-01T12:00) SCHEDULED"
            - "ACTIVE GROVE-scope HLB_GREENING quarantine on the grove (issued by co_ce_a)"
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-CE1", display_name: "Cross Entity Groves" }, as: PackinghouseAdmin, captures: { ce_g: "$.data.id" } }
            - { call: "POST /packinghouse/groves", payload: { grower_id: "${ce_g}", block_code: "B1", variety: HAMLIN, acreage: 50, county_code: "POLK" }, as: PackinghouseAdmin, captures: { ce_gr: "$.data.id", ce_gr_v: "$.data.version" } }
            - { call: "POST /packinghouse/groves/${ce_gr}/maturity-tests", payload: { sampled_at: "2026-07-31T10:00:00Z", brix: 9.0, acid_pct: 1.0, juice_pct: 45.0, expected_grove_version: "${ce_gr_v}" }, as: QualityInspector, as_user_id: "qi_ce1" }
            - { call: "POST /packinghouse/crews", payload: { crew_code: "CR-CE1", daily_capacity_boxes: 400 }, as: PackinghouseAdmin, captures: { ce_c: "$.data.id" } }
            - { call: "POST /packinghouse/harvest-assignments", payload: { crew_id: "${ce_c}", grove_id: "${ce_gr}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T12:00:00Z", planned_boxes: 100 }, as: FieldSupervisor, captures: { ce_a: "$.data.id" } }
            - { call: "POST /packinghouse/quarantine-orders", payload: { scope_type: GROVE, grove_id: "${ce_gr}", pest_type: HLB_GREENING }, as: ComplianceOfficer, as_user_id: "co_ce_a", captures: { ce_q: "$.data.id" } }
          trigger:
            - { call: "POST /packinghouse/harvest-assignments/${ce_a}/start", payload: {}, as: FieldSupervisor, captures: { ce_err: "$.data.error_id" } }
            - { call: "POST /packinghouse/quarantine-orders/${ce_q}/release", payload: { inspection_passed: true }, as: ComplianceOfficer, as_user_id: "co_ce_b" }
            - { call: "POST /packinghouse/harvest-assignments/${ce_a}/start", payload: {}, as: FieldSupervisor }
          assert:
            - "First start rejected: ${ce_err} == ERR_GROVE_QUARANTINED (grove state gates the assignment transition)"
            - "After release by a different officer: Grove.${ce_gr}.quarantine_posture == CLEAR and the second start succeeds (status IN_PROGRESS)"
            - "QuarantineOrder.${ce_q}.released_by != issued_by"

      - name: export_ship_gated_by_certificate
        grounds:
          - state_machines.ExportLot.CERTIFIED_to_SHIPPED
          - state_machines.PhytosanitaryCertificate.ISSUED_to_REVOKED
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: |
          Entity pair ExportLot -> PhytosanitaryCertificate (different pair from
          the assignment/grove instance): SHIPPED is reachable only while a
          linked certificate is ISSUED and unexpired; revoking the certificate
          drags the lot back to INSPECTION_READY and shipping then fails.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; posted fixture: JP channel 25@900 [FANCY] holds 25 allocated FANCY boxes; JUICE channel present"
            - "ExportLot JAPAN/FANCY 10 boxes CERTIFIED via certificate PC-CE2 (ISSUED, expires 2026-08-15T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-CE2", display_name: "Cert Gate Groves" }, as: PackinghouseAdmin, captures: { cg_g: "$.data.id" } }
