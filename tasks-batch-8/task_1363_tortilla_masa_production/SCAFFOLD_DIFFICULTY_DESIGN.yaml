  - rule_id: compensating_invariant
    instances:
      - name: masa_allocate_release_conserves_total
        grounds:
          - calculations.masa_conservation_invariant
          - state_machines.BatchAllocation
        distinguishing_aspect: |
          Conserved quantity: masa kg. Forward action allocate(100) moves 100 kg
          from masa_available_kg into RESERVED; the compensating release returns
          it: actual_masa_kg == masa_available_kg + active allocations holds at
          1552.0 before, during, and after the pair — zero drift.
        test_recipe:
          setup:
            - "batch MASA_AVAILABLE 1552.0 kg; run PLANNED"
