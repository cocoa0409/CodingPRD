          - calculations.weighted_average_leg_price
        distinguishing_aspect: |
          Entity pair (PricingOrder, HedgePosition) — a third distinct pair: fixing the futures
          leg is blocked because the contract's board position sits in MARGIN_CALL, while the
          desk posture stays NORMAL (utilization 0.0055) so neither ERR_PRICING_LOCKED nor
          ERR_DESK_FROZEN can be the answer.
        test_recipe:
          setup:
            - "Desk with a 5,000,000 USD credit line so posture stays NORMAL, one elevator, ACTIVE basis -32 bid."
            - "One SHORT CORN 2026-12 hedge with 10 lots at 448 (posted margin 16500.00), marked to 470 so it sits in MARGIN_CALL with an open 11000.00 call."
            - "One 20,000-bushel BASIS contract on that position whose futures leg is still floating."
          setup_api_calls:
            - call: "POST /grain/trading-desks"
              payload: { desk_code: "GD19", name: "Hedge Gate Desk", credit_line_usd: 5000000.00 }
