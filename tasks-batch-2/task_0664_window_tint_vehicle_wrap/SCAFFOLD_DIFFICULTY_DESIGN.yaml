          - errors[ERR_NO_INCLUDED_LINES]
          - state_machines.Quote.DRAFT_to_PRICED
        distinguishing_aspect: >
          Empty-collection boundary (distinct metric from the numeric VLT threshold): a quote whose
          only line was REMOVED has zero INCLUDED lines; pricing returns ERR_NO_INCLUDED_LINES. Reached
          through DELETE /quote-lines/{id} then POST /quotes/{id}/price — a different endpoint pair.
        test_recipe:
