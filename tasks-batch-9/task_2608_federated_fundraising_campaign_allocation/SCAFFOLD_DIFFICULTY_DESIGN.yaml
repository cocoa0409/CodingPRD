              as_user_id: "${p1}"
            - call: "POST /fundraising/allocation-requests/${req_id}/scores"
              payload: { priority_alignment_score: 80, outcome_evidence_score: 75, capacity_score: 73 }
              as: VolunteerPanelist
              as_user_id: "${p2}"
            - call: "POST /fundraising/allocation-requests/${req_id}/scores"
              payload: { priority_alignment_score: 75, outcome_evidence_score: 70, capacity_score: 68 }
              as: VolunteerPanelist
              as_user_id: "${p3}"
            - call: "POST /fundraising/allocation-requests/${req_id}/finalize-review"
              payload: {}
              as: AllocationsDirector
            - call: "GET /fundraising/allocation-cycles/${cyc_id}"
              payload: {}
              as: AllocationsDirector
              captures: { cyc_ver: $.data.version }
          trigger:
            - call: "POST /fundraising/allocation-cycles/${cyc_id}/awards"
