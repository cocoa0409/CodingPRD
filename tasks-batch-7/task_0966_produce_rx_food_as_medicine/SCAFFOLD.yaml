  - method: GET
    path: "/renewals/{renewalId}"
    description: "Get a renewal"
    roles: [ProgramAdmin, ClinicStaff]
    code: 200
    input: []
    output: Renewal
    side_effects: []
  - method: GET
    path: "/renewals"
