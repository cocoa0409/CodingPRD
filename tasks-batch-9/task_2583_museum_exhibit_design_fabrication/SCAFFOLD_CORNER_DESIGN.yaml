      - name: exhibit_project_listing_paginates_with_total_count_and_filters_by_phase
        claim_type: listing
        grounds:
          - endpoints.GET_/exhibit-projects
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          GET /exhibit-projects is the only collection carrying limit and offset, so
          it is the one place where the §1.0 pagination contract is observable:
          limit defaults to 10, offset to 0, total_count counts the FILTERED set and
          not the page, and has_more is derived from offset + returned <
          total_count rather than from a full page. The three projects are created
          in three different phases so that the phase filter and the pagination
          window have to compose.
        test_recipe:
          setup:
            - "three projects: P1 left in INTERPRETIVE, P2 advanced to SCHEMATIC, P3 advanced to SCHEMATIC then DESIGN_DEV"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProjectManager
            - call: "POST /exhibit-projects"
              payload: { name: "Hall One", museum_name: "Ridgeline Museum", storyline_title: "One", objective_codes: ["OBJ-A"], target_open_date: "2027-05-01T00:00:00Z", contract_value_cents: 1000000 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { p1: $.data.id }
            - call: "POST /exhibit-projects"
              payload: { name: "Hall Two", museum_name: "Ridgeline Museum", storyline_title: "Two", objective_codes: ["OBJ-B"], target_open_date: "2027-05-01T00:00:00Z", contract_value_cents: 2000000 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { p2: $.data.id }
            - call: "POST /exhibit-projects/${p2}/advance-phase"
              payload: { to_phase: "SCHEMATIC" }
              as: ProjectManager
              as_user_id: pm-01
            - call: "POST /exhibit-projects"
              payload: { name: "Hall Three", museum_name: "Ridgeline Museum", storyline_title: "Three", objective_codes: ["OBJ-C"], target_open_date: "2027-05-01T00:00:00Z", contract_value_cents: 3000000 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { p3: $.data.id }
            - call: "POST /exhibit-projects/${p3}/advance-phase"
              payload: { to_phase: "SCHEMATIC" }
              as: ProjectManager
              as_user_id: pm-01
            - call: "POST /exhibit-projects/${p3}/advance-phase"
              payload: { to_phase: "DESIGN_DEV" }
              as: ProjectManager
              as_user_id: pm-01
          trigger:
            - call: "GET /exhibit-projects"
              payload: {}
              as: Curator
              as_user_id: cur-01
              captures: { allpage: $.data }
            - call: "GET /exhibit-projects"
              payload: { limit: 2, offset: 0 }
              as: Curator
              as_user_id: cur-01
              captures: { pg1: $.data }
            - call: "GET /exhibit-projects"
              payload: { limit: 2, offset: 2 }
              as: Curator
              as_user_id: cur-01
              captures: { pg2: $.data }
            - call: "GET /exhibit-projects"
              payload: { phase: "SCHEMATIC" }
              as: Curator
              as_user_id: cur-01
              captures: { sch: $.data, schname: "$.data[0].name", schphase: "$.data[0].phase" }
            - call: "GET /exhibit-projects"
              payload: { phase: "SCHEMATIC", limit: 1, offset: 0 }
              as: Curator
              as_user_id: cur-01
              captures: { schpg: $.data }
          assert:
            - "the unpaginated read returns all 3 rows with response_type == array, limit 10, offset 0, total_count 3 and has_more false - the declared defaults, not a naive unbounded list"
            - "${pg1} has 2 rows with total_count 3 and has_more true"
            - "${pg2} has exactly 1 row with total_count 3, offset 2 and has_more false - has_more is offset + returned < total_count, so a partial last page must NOT report has_more true"
            - "${sch} has exactly 1 row - only ${p2} - and ${schname} == Hall Two with ${schphase} == SCHEMATIC; ${p3} is excluded because it moved on to DESIGN_DEV"
            - "the filtered read reports total_count 1, NOT 3 - total_count counts the filtered set"
            - "${schpg} has 1 row with total_count 1 and has_more false - filter and pagination compose; a total_count computed before filtering would wrongly report has_more true"

      - name: every_path_id_and_body_foreign_key_with_an_unknown_uuid_returns_its_own_not_found
        claim_type: not_found
        grounds:
          - validations.priority_8
          - errors.ERR_PROJECT_NOT_FOUND
          - errors.ERR_PACKAGE_NOT_FOUND
          - errors.ERR_ROUND_NOT_FOUND
          - errors.ERR_ZONE_NOT_FOUND
          - errors.ERR_CASE_NOT_FOUND
          - errors.ERR_ARTIFACT_NOT_FOUND
          - errors.ERR_INTERACTIVE_NOT_FOUND
          - errors.ERR_MATERIAL_NOT_FOUND
          - errors.ERR_DRAWING_NOT_FOUND
          - errors.ERR_WINDOW_NOT_FOUND
          - errors.ERR_PUNCH_ITEM_NOT_FOUND
        distinguishing_aspect: |
          Eleven entities each own a distinct 404 code, and §1.4 priorities 8-18 are
          ordered so that a body-supplied foreign key resolves against ITS OWN
          entity's code rather than collapsing into the primary resource's code.
          The trap is an implementation that returns one generic ERR_NOT_FOUND, or
          that reports ERR_PROJECT_NOT_FOUND for a bad zone_id simply because the
          call was routed under /exhibit-projects/{id}. The last two calls prove the
          body-level resolution: a valid project in the path plus an unknown zone_id
          in the body must be ERR_ZONE_NOT_FOUND, and a valid case in the path plus
          an unknown artifact_id must be ERR_ARTIFACT_NOT_FOUND.
        test_recipe:
          setup:
            - "one project advanced to SCHEMATIC with one real zone and one real empty case, so the body-level foreign-key probes have a valid path resource to hang off"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProjectManager
            - call: "POST /exhibit-projects"
              payload: { name: "Deep Time Hall", museum_name: "Ridgeline Museum", storyline_title: "Deep Time: Reading the Rock Record", objective_codes: ["OBJ-STRATA", "OBJ-EXTINCTION"], target_open_date: "2027-05-01T00:00:00Z", contract_value_cents: 9000000 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { proj: $.data.id }
            - call: "POST /exhibit-projects/${proj}/advance-phase"
              payload: { to_phase: "SCHEMATIC" }
              as: ProjectManager
              as_user_id: pm-01
            - call: "POST /exhibit-projects/${proj}/gallery-zones"
              payload: { zone_code: "Z-A", visitor_route_order: 1, max_noise_dba: 85.0, case_slot_capacity: 2, closure_allowed: true, dust_settling_buffer_minutes: 120 }
              as: MuseumOperations
              as_user_id: ops-01
              captures: { zone1: $.data.id }
            - call: "POST /exhibit-projects/${proj}/artifact-cases"
              payload: { zone_id: "${zone1}", case_code: "C-01", objective_code: "OBJ-EXTINCTION", security_tier: "ENHANCED", target_rh_pct: 50.0, rh_tolerance_pct: 2.0, target_lux: 50.0, uv_microwatt_per_lumen: 20.0, interior_l_cm: 120.0, interior_w_cm: 60.0, interior_h_cm: 90.0, air_exchanges_per_day: 0.4 }
              as: Curator
              as_user_id: cur-01
              captures: { case1: $.data.id, case_v1: $.data.version }
          trigger:
            - call: "GET /exhibit-projects/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProjectManager
              as_user_id: pm-01
              captures: { e1: $.data.error_id }
            - call: "GET /design-packages/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProjectManager
              as_user_id: pm-01
              captures: { e2: $.data.error_id }
            - call: "GET /review-rounds/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProjectManager
              as_user_id: pm-01
              captures: { e3: $.data.error_id }
            - call: "GET /gallery-zones/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProjectManager
              as_user_id: pm-01
              captures: { e4: $.data.error_id }
            - call: "GET /artifact-cases/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProjectManager
              as_user_id: pm-01
              captures: { e5: $.data.error_id }
            - call: "GET /artifacts/00000000-0000-4000-8000-000000000000"
