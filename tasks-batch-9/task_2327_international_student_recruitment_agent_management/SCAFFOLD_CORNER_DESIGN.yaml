        grounds:
          - errors[ERR_PROGRAM_NOT_FOUND]
          - errors[ERR_CONTRACT_NOT_FOUND]
          - errors[ERR_APPLICATION_NOT_FOUND]
          - errors[ERR_DOCUMENT_NOT_FOUND]
          - errors[ERR_INCIDENT_NOT_FOUND]
          - errors[ERR_ENTRY_NOT_FOUND]
          - errors[ERR_TRANSITION_NOT_FOUND]
        distinguishing_aspect: |
          Catalog sweep for the seven per-entity 404s that no other instance reaches. Each
          read uses a syntactically valid but unused UUID against a different resource root,
          so each entity answers with its own code rather than a shared generic 404. The
          remaining catalog entries are already reached elsewhere: ERR_AGENCY_NOT_FOUND by
          agency_lookup_with_unknown_id_returns_not_found and ERR_ASSIGNMENT_NOT_FOUND by
          territory_release_under_wrong_contract_returns_not_found.
