  fields:
  - name: staff_member_id
    type: string
    source: system
    description: FK -> StaffMember.id
  - name: starts_on
    type: string
    source: input
    description: ISO date inclusive
  - name: ends_on
    type: string
    source: input
    description: ISO date inclusive
  - name: reason
    type: string
    source: input
