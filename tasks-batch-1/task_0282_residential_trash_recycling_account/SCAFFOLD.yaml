# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid auth headers or unrecognized X-User-Role"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "authenticated role not permitted for this endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "path-referenced resource does not exist"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "a body FK references a non-existent resource"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "malformed body: missing required field, bad enum, out-of-range integer"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent's current version (OCC)"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "requested transition is not defined from the resource's current state"
  - id: ERR_CARTS_INCOMPLETE
    http: 409
    condition: "activate-start attempted without both an ACTIVE TRASH and an ACTIVE RECYCLING cart"
  - id: ERR_PLAN_ARCHIVED
    http: 409
    condition: "an archived plan was referenced on account create or transfer"
  - id: ERR_ADDRESS_IN_USE
    http: 409
    condition: "service_address collides with an account in {PENDING_START, ACTIVE, SUSPENDED}"
  - id: ERR_DATE_DOUBLE_BOOKED
    http: 409
    condition: "another SCHEDULED extra-pickup on the same account already holds the requested_date"
  - id: ERR_REPORT_TOO_EARLY
    http: 409
    condition: "PickupEvent.reported_at precedes the schedule's effective_pickup_date"
  - id: ERR_CONTAMINATION_NOT_RECYCLING
    http: 409
    condition: "CONTAMINATED outcome reported on a non-RECYCLING schedule"
  - id: ERR_NO_PAYMENT_METHOD
    http: 409
    condition: "autopay enable attempted with null stored_payment_token"
  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 422
    condition: "payment amount_cents != invoice.amount_due_cents"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: Dispatcher
    description: "Operations staff: provisions plans/zones/accounts/carts, drives account lifecycle, generates invoices, schedules and cancels extra pickups, waives contamination fees, sets the clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /service-plans, POST /service-plans/{id}/archive"
      - "POST /collection-zones, POST /collection-zones/{id}/holidays"
      - "POST /accounts, POST /accounts/{id}/carts, POST /carts/{id}/remove"
      - "account lifecycle: activate-start, suspend, resume, stop, transfer-out"
      - "POST /accounts/{id}/invoices, POST /invoices/{id}/void"
      - "POST /extra-pickups/{id}/schedule"
      - "POST /contamination-notices/{id}/waive"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET reads"
      - "POST /accounts/{id}/payment-method, POST /accounts/{id}/autopay (shared with AccountHolder)"
      - "POST /invoices/{id}/pay (shared with AccountHolder)"
      - "POST /accounts/{id}/extra-pickups, POST /extra-pickups/{id}/cancel (shared with AccountHolder)"
  - name: AccountHolder
    description: "The residential customer; manages their own payment method/autopay, pays and reads invoices, requests/cancels extra pickups, acknowledges contamination notices."
    identity: "entity_backed:ServiceAccount"
    exclusive_operations:
      - "POST /contamination-notices/{id}/acknowledge"
    shared_operations:
      - "GET reads of own account resources"
      - "POST /accounts/{id}/payment-method, POST /accounts/{id}/autopay"
      - "POST /invoices/{id}/pay"
      - "POST /accounts/{id}/extra-pickups, POST /extra-pickups/{id}/cancel"
  - name: CrewLead
    description: "Field collection crew: reports pickup outcomes at the curb and completes scheduled extra pickups."
    identity: "opaque"
    exclusive_operations:
      - "POST /pickup-schedules/{id}/events"
      - "POST /extra-pickups/{id}/complete"
    shared_operations:
      - "GET /pickup-schedules/{id}, GET /pickup-schedules/{id}/events"
