              payload: { subscriber_id: "${sub_i_id}", source_document_id: "${doc_i_id}", request_channel: "DIRECT_MAIL", signed_at: "2026-08-15T00:00:00Z", attested_job_function_code: "ENGINEERING_MGMT", attested_industry_code: "MANUFACTURING", attested_purchasing_authority: "APPROVES", expected_subscriber_version: "${sub_i_ver}" }
              as: QualificationSpecialist
