      - name: claim_fee_tier_selected_from_subtotal_not_from_total
        grounds:
          - calculations.defect_claim_reserve_amount
          - entities.DefectClaim.fields.reserve_subtotal_cents
          - entities.DefectClaim.fields.litigation_admin_fee_cents
          - entities.DefectClaim.fields.reserved_amount_cents
          - state_machines.DefectClaim.NOTICED_to_RESERVED
        distinguishing_aspect: |
          Difficulty mode (c): the evaluation order is pinned as subtotal -> tier -> fee -> total, and the
          test input sits inside the trap window — subtotal 1950000 is below the 2000000 tier-1 ceiling
          (rate 0.12, fee 234000, reserved 2184000) while the resulting TOTAL 2184000 is above it, so an
          implementation that re-selects the tier from the total reports fee 175500 and reserved 2125500.
        test_recipe:
          setup:
            - "Association 'Dunmore Village' with reserve_claim_pool_cents = 3000000 and statute_of_repose_years = 8."
            - "One CommonAreaComponent COMPLETE with substantial_completion_date 2021-04-02T00:00:00Z and CONVEYED, so repose_deadline is 2029-04-02T00:00:00Z."
            - "One DefectClaim in NOTICED with repair_cost_estimate_cents 1950000 and diminution_value_cents 1100000."
