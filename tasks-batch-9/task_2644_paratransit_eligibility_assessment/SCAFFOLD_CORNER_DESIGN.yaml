              captures: { used_dup: $.data.days_used_365, remaining_dup: $.data.days_remaining_365 }
            - call: "POST /visitor-eligibilities/${vis_id}/service-days"
              payload: { service_date: "2026-07-31" }
              as: IntakeClerk
              captures: { early_err: $.data.error_id }
            - call: "POST /visitor-eligibilities/${vis_id}/service-days"
              payload: { service_date: "2026-10-31" }
