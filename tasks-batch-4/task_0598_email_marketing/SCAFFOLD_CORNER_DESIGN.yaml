scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:

      - name: create_account_returns_defaults_and_envelope
        claim_type: Creation
        grounds: [entities.Account.fields.plan_tier, entities.Account.fields.status, endpoints]
        distinguishing_aspect: "POST /accounts with only `name` returns 201, plan_tier FREE, status ACTIVE, granted_send_credits 0, hourly_send_capacity 1000, version 1, and the success envelope carries meta.api_request_id plus response_type 'object'."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { name: "Acme" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Account.${acct}.plan_tier == \"FREE\""
            - "Account.${acct}.status == \"ACTIVE\""
            - "Account.${acct}.granted_send_credits == 0"
            - "Account.${acct}.send_credit_balance == 0"
            - "Account.${acct}.hourly_send_capacity == 1000"
            - "Account.${acct}.billable_contact_count == 0"
            - "Account.${acct}.sender_reputation_score == 100"
            - "Account.${acct}.version == 1"
            - "response body has meta.api_request_id, meta.api_request_timestamp, response_type == \"object\", data"

      - name: create_account_opens_first_billing_cycle
        claim_type: Creation
        grounds: [entities.BillingCycle.fields.period_start, entities.BillingCycle.fields.period_end]
        distinguishing_aspect: "POST /accounts at the default clock (2026-05-01T00:00:00Z) opens exactly one BillingCycle with status OPEN, period_start 2026-05-01T00:00:00Z and period_end 2026-05-31T00:00:00Z (BILLING_PERIOD_DAYS = 30)."
        test_recipe:
          setup: ["Empty database; the logical clock has never been set, so it reads its startup default 2026-05-01T00:00:00Z."]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { name: "Acme", plan_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
          assert:
            - "GET /accounts/${acct}/billing-cycles returns exactly 1 row"
            - "GET /accounts/${acct}/billing-cycles -> $.data[0].status == \"OPEN\""
            - "GET /accounts/${acct}/billing-cycles -> $.data[0].period_start == \"2026-05-01T00:00:00.000Z\""
            - "GET /accounts/${acct}/billing-cycles -> $.data[0].period_end == \"2026-05-31T00:00:00.000Z\""
            - "GET /accounts/${acct}/billing-cycles -> $.data[0].peak_contact_count == 0"

      - name: list_audiences_paginated_and_filtered_by_account
        claim_type: Listing
        grounds: [endpoints, entities.Audience.fields.account_id]
        distinguishing_aspect: "GET /audiences?account_id=A&limit=2&offset=1 returns exactly 2 of account A's 3 audiences, in created_at ASC order, with total_count 3 and has_more true, and never leaks account B's audience."
        test_recipe:
          setup:
            - "Account A owns audiences L1, L2, L3 (created in that order); account B owns audience L9."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "A" }
              as: PlatformAdmin
              captures: { acctA: $.data.id }
            - call: "POST /accounts"
              payload: { name: "B" }
              as: PlatformAdmin
              captures: { acctB: $.data.id }
            - call: "POST /audiences"
              payload: { account_id: "${acctA}", name: "L1", default_from_email: "a@x.com" }
              as: PlatformAdmin
            - call: "POST /audiences"
              payload: { account_id: "${acctA}", name: "L2", default_from_email: "a@x.com" }
              as: PlatformAdmin
            - call: "POST /audiences"
              payload: { account_id: "${acctA}", name: "L3", default_from_email: "a@x.com" }
              as: PlatformAdmin
            - call: "POST /audiences"
              payload: { account_id: "${acctB}", name: "L9", default_from_email: "b@x.com" }
              as: PlatformAdmin
          trigger:
            - call: "GET /audiences"
              payload: { account_id: "${acctA}", limit: 2, offset: 1 }
              as: PlatformAdmin
          assert:
            - "response_type == \"array\"; total_count == 3; has_more == true; limit == 2; offset == 1"
            - "exactly 2 rows are returned, named \"L2\" and \"L3\" in that order (created_at ASC)"
            - "no returned audience has account_id == ${acctB}"

      - name: get_campaign_unknown_id_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_CAMPAIGN_NOT_FOUND]"]
        distinguishing_aspect: "GET /campaigns/{random-uuid} returns 404 ERR_CAMPAIGN_NOT_FOUND with response_type 'error'."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /campaigns/11111111-2222-4333-8444-555555555555"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err} == \"ERR_CAMPAIGN_NOT_FOUND\""
            - "response_type == \"error\""

      - name: create_audience_missing_default_from_email_invalid_request
        claim_type: Required Fields
        grounds: [entities.Audience.fields.default_from_email, "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /audiences without the required default_from_email field returns 400 ERR_INVALID_REQUEST and creates nothing."
        test_recipe:
          setup: ["One account exists."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
          trigger:
            - call: "POST /audiences"
              payload: { account_id: "${acct}", name: "Main" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${err} == \"ERR_INVALID_REQUEST\""
            - "GET /audiences {account_id: ${acct}} returns 0 rows"

      - name: create_audience_omits_double_optin_defaults_true
        claim_type: Defaults
        grounds: [entities.Audience.fields.double_optin_required, entities.Subscriber.fields.consent_state]
        distinguishing_aspect: "Omitting double_optin_required stores true, so the first subscriber added to that audience lands in consent_state PENDING with a non-null confirmation_token."
        test_recipe:
          setup: ["One account exists."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /audiences"
              payload: { account_id: "${acct}", name: "Main", default_from_email: "hi@acme.com" }
              as: PlatformAdmin
              captures: { aud: $.data.id, dbl: $.data.double_optin_required }
          trigger:
            - call: "POST /audiences/${aud}/subscribers"
              payload: { email: "s1@x.com", consent_source: "SIGNUP_FORM" }
              as: Anonymous
              captures: { s1: $.data.id, tok: $.data.confirmation_token }
          assert:
            - "${dbl} == true"
            - "Subscriber.${s1}.consent_state == \"PENDING\""
            - "${tok} != null"
            - "Subscriber.${s1}.consent_confirmed_at == null"
            - "Audience.${aud}.subscriber_count == 1   # PENDING contacts are billable"

      - name: template_has_unsubscribe_link_computed_from_body
        claim_type: Computed Fields
        grounds: [entities.Template.fields.has_unsubscribe_link]
        distinguishing_aspect: "has_unsubscribe_link is derived purely from the presence of the literal '{{unsubscribe_url}}' substring in html_body: true for a body that contains it, false for one that does not."
        test_recipe:
          setup: ["One account with a CAMPAIGN_AUTHOR."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/users"
              payload: { email: "author@acme.com", user_role: "CAMPAIGN_AUTHOR" }
              as: PlatformAdmin
              captures: { author: $.data.id }
          trigger:
            - call: "POST /templates"
              payload: { account_id: "${acct}", name: "Good", subject: "S", html_body: "<p>x</p><a href=\"{{unsubscribe_url}}\">u</a>" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { good_link: $.data.has_unsubscribe_link, good_status: $.data.status }
            - call: "POST /templates"
              payload: { account_id: "${acct}", name: "Bad", subject: "S", html_body: "<p>no footer</p>" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { bad_link: $.data.has_unsubscribe_link }
          assert:
            - "${good_link} == true"
            - "${bad_link} == false"
            - "${good_status} == \"DRAFT\""

      - name: create_subscriber_system_field_input_ignored
        claim_type: System Fields
        grounds: [entities.Subscriber.fields.consent_state, entities.Subscriber.fields.engagement_score]
        distinguishing_aspect: "consent_state, engagement_score, unsubscribe_token and id are source: system/computed; a POST body that attempts to set them is rejected as an unknown field (ERR_INVALID_REQUEST) rather than silently honoured."
        test_recipe:
          setup: ["One single-opt-in audience exists."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /audiences"
              payload: { account_id: "${acct}", name: "Main", default_from_email: "hi@acme.com", double_optin_required: false }
              as: PlatformAdmin
              captures: { aud: $.data.id }
          trigger:
            - call: "POST /audiences/${aud}/subscribers"
              payload: { email: "s1@x.com", consent_source: "API", consent_state: "CONFIRMED", engagement_score: 99 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${err} == \"ERR_INVALID_REQUEST\""
            - "GET /subscribers {audience_id: ${aud}} returns 0 rows"

      - name: create_subscriber_invalid_enum_consent_source
        claim_type: Type Constraints
        grounds: [entities.Subscriber.fields.consent_source, "validations[priority=4]"]
        distinguishing_aspect: "consent_source is an enum over {SIGNUP_FORM, IMPORT, API, MANUAL}; the value 'CARRIER_PIGEON' returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["One single-opt-in audience exists."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /audiences"
              payload: { account_id: "${acct}", name: "Main", default_from_email: "hi@acme.com", double_optin_required: false }
              as: PlatformAdmin
              captures: { aud: $.data.id }
          trigger:
            - call: "POST /audiences/${aud}/subscribers"
              payload: { email: "s1@x.com", consent_source: "CARRIER_PIGEON" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${err} == \"ERR_INVALID_REQUEST\""

      - name: suppression_entry_is_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.SuppressionEntry.fields.reason, entities.SuppressionEntry.fields.email]
        distinguishing_aspect: "SuppressionEntry has common_fields: false -- rows carry id, created_at, account_id, email and reason only, exposing no version and no updated_at, and no endpoint mutates or removes one."
        test_recipe:
          setup: ["One single-opt-in audience with one CONFIRMED subscriber who then unsubscribes, producing exactly one SuppressionEntry."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /audiences"
              payload: { account_id: "${acct}", name: "Main", default_from_email: "hi@acme.com", double_optin_required: false }
              as: PlatformAdmin
              captures: { aud: $.data.id }
            - call: "POST /audiences/${aud}/subscribers"
              payload: { email: "s1@x.com", consent_source: "API" }
              as: PlatformAdmin
              captures: { s1: $.data.id, tok: $.data.unsubscribe_token }
          trigger:
            - call: "POST /subscribers/${s1}/unsubscribe"
              payload: { unsubscribe_token: "${tok}" }
              as: Anonymous
          assert:
            - "GET /accounts/${acct}/suppressions returns exactly 1 row"
            - "GET /accounts/${acct}/suppressions -> $.data[0].email == \"s1@x.com\""
            - "GET /accounts/${acct}/suppressions -> $.data[0].reason == \"UNSUBSCRIBE\""
            - "the returned SuppressionEntry object exposes no `version` and no `updated_at` key"

      - name: create_subscriber_under_unknown_audience_returns_not_found
        claim_type: Parent Relationships
        grounds: ["errors[ERR_AUDIENCE_NOT_FOUND]", "validations[priority=5]"]
        distinguishing_aspect: "POST /audiences/{unknown}/subscribers resolves the path parent first and returns 404 ERR_AUDIENCE_NOT_FOUND before any body validation."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /audiences/99999999-8888-4777-8666-555555555555/subscribers"
              payload: { email: "s1@x.com", consent_source: "API" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err} == \"ERR_AUDIENCE_NOT_FOUND\""

  # =========================================================================
  - section: state_machines
    instances:

      - name: confirm_moves_pending_to_confirmed_with_token
        claim_type: Valid Transition
        grounds: [state_machines.Subscriber.PENDING_to_CONFIRMED, entities.Subscriber.fields.consent_confirmed_at]
        distinguishing_aspect: "POST /subscribers/{id}/confirm with the matching confirmation_token moves consent_state PENDING -> CONFIRMED, stamps consent_confirmed_at with the logical clock and nulls the confirmation_token."
        test_recipe:
          setup: ["One double-opt-in audience with one PENDING subscriber."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /audiences"
              payload: { account_id: "${acct}", name: "Main", default_from_email: "hi@acme.com", double_optin_required: true }
              as: PlatformAdmin
              captures: { aud: $.data.id }
            - call: "POST /audiences/${aud}/subscribers"
              payload: { email: "s1@x.com", consent_source: "SIGNUP_FORM" }
              as: Anonymous
              captures: { s1: $.data.id, tok: $.data.confirmation_token }
          trigger:
            - call: "POST /subscribers/${s1}/confirm"
              payload: { confirmation_token: "${tok}" }
              as: Anonymous
              captures: { st: $.data.consent_state, conf_at: $.data.consent_confirmed_at, tok_after: $.data.confirmation_token }
          assert:
            - "${st} == \"CONFIRMED\""
            - "${conf_at} == \"2026-05-01T00:00:00.000Z\"   # the clock's startup default"
            - "${tok_after} == null"
            - "Audience.${aud}.subscriber_count == 1"

      - name: publish_template_twice_rejects_second
        claim_type: Idempotency
        grounds: [state_machines.Template.DRAFT_to_PUBLISHED, "errors[ERR_INVALID_STATE]", "validations[priority=11]"]
        distinguishing_aspect: "PUBLISHED is terminal for Template: the second POST /templates/{id}/publish returns 409 ERR_INVALID_STATE and leaves Template.version at 2."
        test_recipe:
          setup: ["One PUBLISHED template (version 2)."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/users"
              payload: { email: "author@acme.com", user_role: "CAMPAIGN_AUTHOR" }
              as: PlatformAdmin
              captures: { author: $.data.id }
            - call: "POST /templates"
              payload: { account_id: "${acct}", name: "T", subject: "S", html_body: "<a href=\"{{unsubscribe_url}}\">u</a>" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { tpl: $.data.id }
            - call: "POST /templates/${tpl}/publish"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /templates/${tpl}/publish"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { err: $.data.error_id }
          assert:
            - "${v1} == 2"
            - "HTTP status == 409"
            - "${err} == \"ERR_INVALID_STATE\""
            - "Template.${tpl}.version == 2   # the rejected call did not bump the version"

      - name: pause_draft_journey_rejected_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Journey.ACTIVE_to_PAUSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Journey pause exists only from ACTIVE; pausing a DRAFT journey returns 409 ERR_INVALID_STATE and the journey stays DRAFT."
        test_recipe:
          setup: ["One DRAFT journey with a single WAIT step."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/users"
              payload: { email: "author@acme.com", user_role: "CAMPAIGN_AUTHOR" }
              as: PlatformAdmin
              captures: { author: $.data.id }
            - call: "POST /audiences"
              payload: { account_id: "${acct}", name: "Main", default_from_email: "hi@acme.com", double_optin_required: false }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { aud: $.data.id }
            - call: "POST /journeys"
              payload: { account_id: "${acct}", audience_id: "${aud}", name: "J", trigger_event: "SUBSCRIBE_CONFIRMED", steps: [{ step_index: 0, kind: "WAIT", wait_hours: 24 }] }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { jr: $.data.id }
          trigger:
            - call: "POST /journeys/${jr}/pause"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err} == \"ERR_INVALID_STATE\""
            - "Journey.${jr}.status == \"DRAFT\""

      - name: journey_active_pause_active_cycle_gates_ops_run
        claim_type: cyclic
        grounds: [state_machines.Journey.ACTIVE_to_PAUSED, state_machines.Journey.PAUSED_to_ACTIVE, state_machines.JourneyEnrollment.ACTIVE_to_ACTIVE]
        distinguishing_aspect: "The Journey cycle ACTIVE -> PAUSED -> ACTIVE is traversable: while PAUSED an ops run advances 0 enrollments and current_step_index stays 0; after re-activation the very next ops run executes the WAIT step and current_step_index becomes 1."
        test_recipe:
          setup:
            - "One single-opt-in audience; journey J (SUBSCRIBE_CONFIRMED, step 0 = WAIT 24h) is ACTIVE."
            - "Subscriber s1 enrolled at the default clock, so next_action_at == 2026-05-01T00:00:00Z."
            - "J is then PAUSED and the clock moved to 2026-05-01T02:00:00Z."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/users"
              payload: { email: "author@acme.com", user_role: "CAMPAIGN_AUTHOR" }
              as: PlatformAdmin
              captures: { author: $.data.id }
            - call: "POST /audiences"
              payload: { account_id: "${acct}", name: "Main", default_from_email: "hi@acme.com", double_optin_required: false }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { aud: $.data.id }
            - call: "POST /journeys"
              payload: { account_id: "${acct}", audience_id: "${aud}", name: "J", trigger_event: "SUBSCRIBE_CONFIRMED", steps: [{ step_index: 0, kind: "WAIT", wait_hours: 24 }] }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { jr: $.data.id }
            - call: "POST /journeys/${jr}/activate"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /audiences/${aud}/subscribers"
              payload: { email: "s1@x.com", consent_source: "API" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { s1: $.data.id }
            - call: "POST /journeys/${jr}/pause"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T02:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /_ops/run"
              payload: {}
              as: PlatformAdmin
              captures: { adv_paused: $.data.enrollments_advanced }
            - call: "POST /journeys/${jr}/activate"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { st: $.data.status }
            - call: "POST /_ops/run"
              payload: {}
              as: PlatformAdmin
              captures: { adv_active: $.data.enrollments_advanced }
          assert:
            - "${adv_paused} == 0   # PAUSED journeys are skipped"
            - "${st} == \"ACTIVE\""
            - "${adv_active} == 1"
            - "GET /journeys/${jr}/enrollments -> $.data[0].current_step_index == 1"
            - "GET /journeys/${jr}/enrollments -> $.data[0].status == \"ACTIVE\""
            - "Journey.${jr}.active_enrollment_count == 1"

      - name: enrollment_completes_after_last_step_and_mints_journey_send
        claim_type: Terminal State Lockdown
        grounds: [state_machines.JourneyEnrollment.ACTIVE_to_COMPLETED, entities.Send.fields.journey_id, entities.Journey.fields.active_enrollment_count]
        distinguishing_aspect: "After the WAIT step and then the EMAIL step run, the enrollment reaches COMPLETED with current_step_index 2, and the EMAIL step mints exactly one polymorphic Send with journey_id set, campaign_id null, variant_label null and delivery_status QUEUED."
        test_recipe:
          setup:
            - "One single-opt-in audience; journey J (SUBSCRIBE_CONFIRMED, step 0 = WAIT 1h, step 1 = EMAIL) is ACTIVE with one CONFIRMED subscriber enrolled at 2026-05-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/users"
              payload: { email: "author@acme.com", user_role: "CAMPAIGN_AUTHOR" }
              as: PlatformAdmin
              captures: { author: $.data.id }
            - call: "POST /audiences"
              payload: { account_id: "${acct}", name: "Main", default_from_email: "hi@acme.com", double_optin_required: false }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { aud: $.data.id }
            - call: "POST /templates"
              payload: { account_id: "${acct}", name: "T", subject: "Welcome", html_body: "<a href=\"{{unsubscribe_url}}\">u</a>" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { tpl: $.data.id }
            - call: "POST /templates/${tpl}/publish"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /journeys"
              payload: { account_id: "${acct}", audience_id: "${aud}", name: "J", trigger_event: "SUBSCRIBE_CONFIRMED", steps: [{ step_index: 0, kind: "WAIT", wait_hours: 1 }, { step_index: 1, kind: "EMAIL", template_id: "${tpl}" }] }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { jr: $.data.id }
            - call: "POST /journeys/${jr}/activate"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /audiences/${aud}/subscribers"
              payload: { email: "s1@x.com", consent_source: "API" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { s1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T02:00:00Z" }
