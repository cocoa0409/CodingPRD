            - "Photo.${ph}.status == RETAKEN (link B, caused by A)"
            - "RetouchOrder.${rt}.replacement_photo_id is a new Photo whose status == MATCHED and retake_of_photo_id == ${ph} (link C, caused by B)"
            - "PictureDaySession.${sess}.retouch_credit_balance_cents == 48500 (1500 reserved at approve remains debited)"

