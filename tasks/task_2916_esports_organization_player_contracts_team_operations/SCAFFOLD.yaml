    roles: [PerformanceSupport]
    code: 200
    input: [last_self_reported_load, "reported_streaming_minutes_7d?"]
    output: PlayerContract
    side_effects: ["burnout_score recomputed per calculations.burnout_score ROLLING_7DAY", "obligation_status escalated COMPLIANT -> WARNED -> BREACH at the thresholds", "on every escalation: each PracticeBlock with block_status == SCHEDULED and starts_at > current_utc listing this player -> CANCELLED with cancel_reason WELLNESS_HOLD", "only on entering BREACH: wellness_hold_until = current_utc + WELLNESS_HOLD_DAYS and Organization.wellness_flag_count += 1 (a WARNED escalation stamps neither)", "version incremented"]
  - method: GET
    path: "/contracts/{id}/obligation-summary"
    description: "Computed read: both burnout variants, the player's weekly cap arithmetic and both cap-charge variants"
    roles: [LeagueAdmin, GeneralManager, PerformanceSupport]
    code: 200
    input: []
    output: { obligation_status: string, burnout_score: integer, season_burnout_score: integer, scheduled_minutes_this_week: integer, streaming_minutes_this_week: integer, cap_minutes: integer, provisional_cap_charge_cents: integer, final_cap_charge_cents: integer, wellness_hold_until: string }
    side_effects: ["calculations.burnout_score both variants, calculations.weekly_hour_cap and calculations.salary_cap_charge both variants evaluated; nothing is persisted"]
  - method: GET
    path: "/contracts/{id}/prize-allocations"
    description: "List the prize rows paid against this contract (FK reverse for PrizeAllocation.contract_id)"
    roles: [LeagueAdmin, PlayerAgent, FinanceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: PrizeAllocation[]
    side_effects: []

  # --- TeamHouse ------------------------------------------------------------
  - method: POST
    path: "/organizations/{id}/team-houses"
