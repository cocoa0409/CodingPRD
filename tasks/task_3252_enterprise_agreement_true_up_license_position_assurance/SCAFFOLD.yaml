scenario: |
  Enterprise Agreement True-Up, License Position & Assurance Benefits (Microsoft): enrollment structures with three-year terms, price levels by organization size and annual anniversary billing, license position computation across users, devices and server workloads with virtualization and core-based rules, annual true-up requiring the customer to report and pay for growth with retroactive coverage, software assurance benefits including upgrade rights, training vouchers and support incidents with expiration, subscription versus perpetual license mixing and step-up rights between editions, cloud service commitments consumed against a monetary amount with expiration rules, license mobility and hosting restrictions for third-party datacenters, renewal, non-renewal and effective license shortfall exposure

domain_name: "enterprise-agreement-true-up"
api_prefix: "/licensing"

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Organization
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Customer legal entity name."
      - name: qualified_device_count
        type: integer
        source: input
        description: "Total qualified devices/users declared at enrollment; drives price-level tiering. Must be >= 1."
      - name: price_level
        type: enum
        source: computed
        description: "Derived from qualified_device_count via price_level_tiering: A < 250 <= B < 2400 <= C < 6000 <= D. Constraints: A|B|C|D."
        constraints: "A|B|C|D; recomputed on every PATCH to qualified_device_count"

  - name: Agreement
    parent: null
    common_fields: true
    fields:
      - name: organization_id
        type: string
        source: input
        description: "FK -> Organization.id; the customer organization that owns this enrollment."
      - name: enrollment_number
        type: string
        source: input
        description: "Unique enrollment number. Unique across all agreements."
      - name: start_date
        type: string
        source: input
        description: "ISO date the three-year term begins. Must be <= end_date."
      - name: end_date
        type: string
        source: input
        description: "ISO date the three-year term ends. Must be >= start_date; exactly 3 years recommended but any span >= 1 day accepted."
      - name: status
        type: enum
        source: system
        description: "Lifecycle state machine. Constraints: DRAFT|ACTIVE|RENEWAL_PENDING|RENEWED|EXPIRED|NON_RENEWED."
        constraints: "DRAFT|ACTIVE|RENEWAL_PENDING|RENEWED|EXPIRED|NON_RENEWED"
        default: DRAFT
      - name: renewal_count
        type: integer
        source: computed
        description: "Number of completed renewals. Starts 0; +1 on each successful renew."
        default: 0

  - name: Product
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: "Unique product SKU."
      - name: name
        type: string
        source: input
        description: "Product display name."
      - name: license_model
        type: enum
        source: input
        description: "Licensing basis. Constraints: PER_USER|PER_DEVICE|PER_SERVER_CORE."
        constraints: "PER_USER|PER_DEVICE|PER_SERVER_CORE"
      - name: license_kind
        type: enum
        source: input
        description: "Perpetual or subscription. Constraints: PERPETUAL|SUBSCRIPTION."
        constraints: "PERPETUAL|SUBSCRIPTION"
      - name: edition
        type: enum
        source: input
        description: "Edition within product family. Constraints: STANDARD|PROFESSIONAL|ENTERPRISE. Step-up direction is STANDARD -> PROFESSIONAL -> ENTERPRISE."
        constraints: "STANDARD|PROFESSIONAL|ENTERPRISE"
      - name: family
        type: string
        source: input
        description: "Product family grouping used by step_up_conversion matching (step-up requires same family)."
      - name: annual_unit_price_cents
        type: integer
        source: input
        description: "Price-level-A annual unit price in cents. Price levels B/C/D apply multipliers 0.95/0.90/0.85 (round_half_up to cents)."
      - name: license_mobility
        type: boolean
        source: input
        description: "True when product carries License Mobility rights (may be hosted at authorized third-party datacenters)."

  - name: EnrollmentAnniversary
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> Agreement.id; the agreement this anniversary period belongs to."
      - name: year_index
        type: integer
        source: input
        description: "1-based anniversary year within the current term. Must be >= 1 and <= 3 and strictly increasing per agreement."
      - name: period_start
        type: string
        source: input
        description: "ISO date the anniversary year begins. Must be >= 1 day after the previous anniversary's period_start and >= agreement.start_date."
      - name: period_end
        type: string
        source: input
        description: "ISO date the anniversary year ends. Must be > period_start."
      - name: true_up_closed
        type: boolean
        source: computed
        description: "True once a TrueUpReport for this anniversary reaches SETTLED."
        default: false

  - name: LicenseEntitlement
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> Agreement.id; agreement under which the entitlement is purchased."
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the licensed product."
      - name: quantity
        type: integer
        source: input
        description: "Purchased quantity. Must be >= 1. PATCH decreases may never take quantity below locked_baseline_quantity."
      - name: locked_baseline_quantity
        type: integer
        source: computed
        description: "Highest quantity ever ratified by a SETTLED true-up or step-up. Starts equal to initial quantity."
      - name: unit_price_cents
        type: integer
        source: computed
        description: "Price-level-adjusted annual unit price captured at creation from the organization's current price_level. Immutable afterwards."
      - name: acquired_at
        type: string
        source: system
        description: "ISO date recorded at creation (current logical clock date)."

  - name: Deployment
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> Agreement.id; agreement the deployment is reported under."
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; product being deployed."
      - name: scope
        type: enum
        source: input
        description: "Deployment scope. Constraints: USER|DEVICE|SERVER. Must match the product's license_model family (USER<->PER_USER, DEVICE<->PER_DEVICE, SERVER<->PER_SERVER_CORE)."
        constraints: "USER|DEVICE|SERVER"
      - name: deployment_date
        type: string
        source: input
        description: "ISO date the deployment began. Must be <= current logical clock date."
      - name: user_count
        type: integer
        source: input
        description: "Named users deployed. Required >= 1 when scope=USER; ignored otherwise."
        default: 0
      - name: device_count
        type: integer
        source: input
        description: "Devices deployed. Required >= 1 when scope=DEVICE; ignored otherwise."
        default: 0
      - name: physical_cores_per_server
        type: integer
        source: input
        description: "Physical cores on the host. Required >= 1 when scope=SERVER; otherwise 0."
        default: 0
      - name: core_factor
        type: number
        source: input
        description: "Processor core factor (e.g. 1.0, 0.75). Required when scope=SERVER; must be > 0."
      - name: vm_count
        type: integer
        source: input
        description: "Virtual machines on the host. Required >= 0 when scope=SERVER; 0 means bare-metal."
        default: 0
      - name: vcores_per_vm
        type: integer
        source: input
        description: "Virtual cores allocated to each VM. Required >= 1 when vm_count >= 1; ignored otherwise."
        default: 0
      - name: licensing_mode
        type: enum
        source: input
        description: "Server licensing mode. Constraints: PER_HOST|PER_VM. Required when scope=SERVER; ignored otherwise. PER_HOST licenses the whole normalized host (unlimited VMs); PER_VM licenses each VM separately."
        constraints: "PER_HOST|PER_VM"
      - name: hosting
        type: enum
        source: input
        description: "Where the workload runs. Constraints: ON_PREMISES|AUTHORIZED_MOBILITY_PARTNER|THIRD_PARTY_DATACENTER."
        constraints: "ON_PREMISES|AUTHORIZED_MOBILITY_PARTNER|THIRD_PARTY_DATACENTER"
      - name: retired
        type: boolean
        source: system
        description: "Set true by DELETE /deployments/{id}; retired deployments are excluded from license position computation."
        default: false

  - name: LicensePositionSnapshot
    parent: null
    common_fields: false
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> Agreement.id; agreement this snapshot was computed for."
      - name: anniversary_id
        type: string
        source: input
        description: "FK -> EnrollmentAnniversary.id; anniversary period the snapshot is pinned to."
      - name: computed_at
        type: string
        source: system
        description: "ISO datetime the snapshot was computed (current logical clock)."
      - name: lines
        type: array
        source: computed
        description: "Per-product computed position. Each element: {product_id, scope, required_licenses, entitled_quantity, net_position} where required_licenses uses license_position_computation and net_position = entitled_quantity - required_licenses (negative means shortfall)."

  - name: TrueUpReport
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> Agreement.id; agreement under true-up."
      - name: anniversary_id
        type: string
        source: input
        description: "FK -> EnrollmentAnniversary.id; the anniversary being trued up."
      - name: status
        type: enum
        source: system
        description: "Lifecycle state machine. Constraints: DRAFT|SUBMITTED|ACCEPTED|REJECTED|INVOICED|SETTLED."
        constraints: "DRAFT|SUBMITTED|ACCEPTED|REJECTED|INVOICED|SETTLED"
        default: DRAFT
      - name: snapshot_id
        type: string
        source: system
        description: "LicensePositionSnapshot.id computed at report creation (server-internal pinned reference; read via GET /position-snapshots/{id}; at most one non-REJECTED report per anniversary_id)."
      - name: total_amount_cents
        type: integer
        source: computed
        description: "Sum of all TrueUpLine.total_amount_cents on this report. Recomputed whenever lines change."
        default: 0
      - name: revision_count
        type: integer
        source: computed
        description: "Number of times the report has re-entered DRAFT via rejection. Starts 0; +1 on each REJECTED -> DRAFT cycle."
        default: 0

  - name: TrueUpLine
    parent: null
    common_fields: true
    fields:
      - name: report_id
        type: string
        source: input
        description: "FK -> TrueUpReport.id; parent report."
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; product being trued up."
      - name: growth_quantity
        type: integer
        source: computed
        description: "max(0, snapshot.required_licenses - entitled_quantity) for the product at report creation."
      - name: months_growth
        type: integer
        source: input
        description: "Number of whole months the growth was in use before the anniversary date (1..12). Drives retroactive proration."
      - name: pricing_variant
        type: enum
        source: input
        description: "Which retroactive proration variant to apply. Constraints: ANNIVERSARY_PRORATION|FULL_YEAR_RETROACTIVE."
        constraints: "ANNIVERSARY_PRORATION|FULL_YEAR_RETROACTIVE"
      - name: unit_price_cents
        type: integer
        source: computed
        description: "Price-level-adjusted annual unit price for the product at the report creation date (recomputed from organization price level at submit time, NOT copied from the entitlement)."
      - name: total_amount_cents
        type: integer
        source: computed
        description: "growth_quantity * unit_price_cents, then prorated by true_up_retroactive_pricing using months_growth and pricing_variant. Rounded per line then summed into report total."
        default: 0

  - name: AssuranceBenefitGrant
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> Agreement.id; agreement that accrued the benefit."
      - name: benefit_type
        type: enum
        source: input
        description: "Benefit category. Constraints: TRAINING_VOUCHER|SUPPORT_INCIDENT|UPGRADE_RIGHT."
        constraints: "TRAINING_VOUCHER|SUPPORT_INCIDENT|UPGRADE_RIGHT"
      - name: quantity_granted
        type: integer
        source: input
        description: "Units granted (voucher-days, incident count, or upgrade-right count). Must be >= 1."
      - name: quantity_remaining
        type: integer
        source: computed
        description: "quantity_granted minus redeemed units. Starts equal to quantity_granted; decremented by BenefitRedemption."
      - name: expires_on
        type: string
        source: input
        description: "ISO date the benefit expires. Benefit is redeemable only when current logical date <= expires_on."
      - name: status
        type: enum
        source: system
        description: "Derived lifecycle. Constraints: ACTIVE|DEPLETED|EXPIRED|FORFEITED."
        constraints: "ACTIVE|DEPLETED|EXPIRED|FORFEITED"
        default: ACTIVE

  - name: BenefitRedemption
    parent: null
    common_fields: false
    fields:
      - name: grant_id
        type: string
        source: input
        description: "FK -> AssuranceBenefitGrant.id; the grant being redeemed against."
      - name: quantity
        type: integer
        source: input
        description: "Units to redeem. Must be >= 1 and <= grant.quantity_remaining."
      - name: redeemed_on
        type: string
        source: system
        description: "ISO date of redemption (current logical clock date)."

  - name: StepUpConversion
    parent: null
    common_fields: true
    fields:
      - name: entitlement_id
        type: string
        source: input
        description: "FK -> LicenseEntitlement.id; the lower-edition entitlement being stepped up."
      - name: target_product_id
        type: string
        source: input
        description: "FK -> Product.id; higher-edition product in the same family being stepped up to."
      - name: quantity
        type: integer
        source: input
        description: "Units to convert. Must be >= 1 and <= source entitlement quantity at execution time."
      - name: charge_cents
        type: integer
        source: computed
        description: "quantity * max(0, target unit price - source unit price) at the current organization price level, per step_up_conversion calculation."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Lifecycle state machine. Constraints: REQUESTED|COMPLETED|REJECTED."
        constraints: "REQUESTED|COMPLETED|REJECTED"
        default: REQUESTED

  - name: CloudCommitment
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> Agreement.id; agreement holding the monetary commitment."
      - name: committed_amount_cents
        type: integer
        source: input
        description: "Prepaid monetary commitment in cents. Must be >= 1."
      - name: consumed_amount_cents
        type: integer
        source: computed
        description: "Sum of consumed_cents across all CloudConsumptionEvent rows for this commitment. Starts 0."
        default: 0
      - name: expires_on
        type: string
        source: input
        description: "ISO date the commitment expires. Unconsumed remainder is forfeited on expiry."
      - name: status
        type: enum
        source: system
        description: "Derived lifecycle. Constraints: ACTIVE|EXHAUSTED|EXPIRED."
        constraints: "ACTIVE|EXHAUSTED|EXPIRED"
        default: ACTIVE

  - name: CloudConsumptionEvent
    parent: null
    common_fields: false
    fields:
      - name: commitment_id
        type: string
        source: input
        description: "FK -> CloudCommitment.id; commitment being consumed."
      - name: requested_cents
        type: integer
        source: input
        description: "Consumption amount requested in cents. Must be >= 1."
      - name: consumed_cents
        type: integer
        source: computed
        description: "min(requested_cents, committed_amount_cents - consumed_amount_cents) at processing time. Partial consumption is permitted; the remainder above the cap is rejected silently (only consumed_cents is applied)."
        default: 0
      - name: occurred_on
        type: string
        source: system
        description: "ISO date of consumption (current logical clock date)."

  - name: HostingAuthorization
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> Agreement.id; agreement requesting mobility rights."
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; product to be hosted. Product.license_mobility must be true."
      - name: provider_name
        type: string
        source: input
        description: "Third-party datacenter provider name."
      - name: status
        type: enum
        source: system
        description: "Lifecycle state machine. Constraints: PENDING_REVIEW|APPROVED|DENIED|SUSPENDED|REVOKED."
        constraints: "PENDING_REVIEW|APPROVED|DENIED|SUSPENDED|REVOKED"
        default: PENDING_REVIEW
      - name: effective_on
        type: string
        source: input
        description: "ISO date the authorization becomes usable. Must be >= current logical clock date at creation."

  - name: ShortfallAssessment
    parent: null
    common_fields: false
    fields:
      - name: agreement_id
        type: string
        source: system
        description: "FK -> Agreement.id; the agreement assessed (copied from path parameter)."
      - name: agreement_status
        type: string
        source: system
        description: "Status of the agreement at assessment time (EXPIRED or NON_RENEWED)."
      - name: assessed_at
        type: string
        source: system
        description: "ISO datetime of assessment (current logical clock)."
      - name: lines
        type: array
        source: computed
        description: "Per-product shortfall exposure. Each element: {product_id, license_kind, required_licenses, perpetual_quantity, subscription_quantity, effective_coverage, shortfall} computed per shortfall_exposure_projection."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Agreement
    initial_state: DRAFT
    terminal_states: [RENEWED, EXPIRED, NON_RENEWED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /agreements/{id}/activate"
        actor: ProgramAdministrator
        preconditions:
          - "agreement.status == DRAFT"
          - "current logical clock date <= agreement.start_date"
        side_effects:
          - "agreement.version increments by 1"
        note: "Activation only on or before the term start date."
      - from: ACTIVE
        to: RENEWAL_PENDING
        trigger: "POST /agreements/{id}/renewal-review"
        actor: LicensingSpecialist
        preconditions:
          - "agreement.status == ACTIVE"
          - "current logical clock date >= agreement.end_date minus 90 days"
          - "current logical clock date <= agreement.end_date"
        side_effects:
          - "agreement.version increments by 1"
      - from: RENEWAL_PENDING
        to: ACTIVE
        trigger: "POST /agreements/{id}/decline-renewal with decision=CONTINUE"
        actor: CustomerAdmin
        preconditions:
          - "agreement.status == RENEWAL_PENDING"
          - "request body decision == CONTINUE"
        side_effects:
          - "agreement.version increments by 1"
        note: "Customer continues the current term without renewal; back-branch of the renewal fork."
      - from: RENEWAL_PENDING
        to: RENEWED
        trigger: "POST /agreements/{id}/renew"
        actor: ProgramAdministrator
        preconditions:
          - "agreement.status == RENEWAL_PENDING"
          - "current logical clock date <= agreement.end_date"
          - "request body new_end_date > agreement.end_date"
          - "request body expected_agreement_version == agreement.version (OCC)"
        side_effects:
          - "agreement.renewal_count increments by 1"
          - "agreement.end_date := new_end_date"
          - "all EnrollmentAnniversary rows for the agreement get true_up_closed := true"
          - "agreement.version increments by 1"
      - from: RENEWAL_PENDING
        to: NON_RENEWED
        trigger: "POST /agreements/{id}/decline-renewal with decision=NON_RENEW"
        actor: CustomerAdmin
        preconditions:
          - "agreement.status == RENEWAL_PENDING"
          - "request body decision == NON_RENEW"
        side_effects:
          - "agreement.version increments by 1"
          - "all AssuranceBenefitGrant rows for the agreement with status == ACTIVE get status := FORFEITED"
          - "all CloudCommitment rows for the agreement with status == ACTIVE get status := EXPIRED"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /agreements/{id}/expire"
        actor: ProgramAdministrator
        preconditions:
          - "agreement.status == ACTIVE"
          - "current logical clock date > agreement.end_date"
        side_effects:
          - "agreement.version increments by 1"
          - "all AssuranceBenefitGrant rows for the agreement with status == ACTIVE get status := FORFEITED"
          - "all CloudCommitment rows for the agreement with status == ACTIVE get status := EXPIRED"

  - entity: TrueUpReport
    initial_state: DRAFT
    terminal_states: [SETTLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /true-up-reports/{id}/submit"
        actor: CustomerAdmin
        preconditions:
          - "report.status == DRAFT"
          - "report.agreement.status == ACTIVE"
          - "report has >= 1 TrueUpLine"
        side_effects:
          - "recompute each TrueUpLine.unit_price_cents from the organization's current price_level (resolves price-level changes since report creation)"
          - "recompute each TrueUpLine.total_amount_cents via true_up_retroactive_pricing"
          - "recompute report.total_amount_cents as sum of line totals"
          - "report.version increments by 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /true-up-reports/{id}/accept"
        actor: LicensingSpecialist
        preconditions:
          - "report.status == SUBMITTED"
        side_effects:
          - "report.version increments by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /true-up-reports/{id}/reject"
        actor: LicensingSpecialist
        preconditions:
          - "report.status == SUBMITTED"
        side_effects:
          - "report.version increments by 1"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /true-up-reports/{id}/revise"
        actor: CustomerAdmin
        preconditions:
          - "report.status == REJECTED"
          - "report.agreement.status == ACTIVE"
        side_effects:
          - "report.revision_count increments by 1"
          - "report.version increments by 1"
        note: "Revision loop DRAFT -> SUBMITTED -> REJECTED -> DRAFT; each cycle re-snapshots on the NEXT report creation, not here."
      - from: ACCEPTED
        to: INVOICED
        trigger: "POST /true-up-reports/{id}/invoice"
        actor: LicensingSpecialist
        preconditions:
          - "report.status == ACCEPTED"
        side_effects:
          - "report.version increments by 1"
      - from: INVOICED
        to: SETTLED
        trigger: "POST /true-up-reports/{id}/settle"
        actor: LicensingSpecialist
        preconditions:
          - "report.status == INVOICED"
        side_effects:
          - "report.version increments by 1"
          - "for each TrueUpLine: the matching LicenseEntitlement (agreement_id + product_id) gets quantity := quantity + growth_quantity and locked_baseline_quantity := new quantity (cascade: entitlement.version increments by 1 per touched entitlement)"
          - "the EnrollmentAnniversary row referenced by report.anniversary_id gets true_up_closed := true (cascade: anniversary.version increments by 1)"
          - "accrue AssuranceBenefitGrant rows per benefit_accrual calculation on the settled total_amount_cents (cascade: each new grant row created ACTIVE)"

  - entity: StepUpConversion
    initial_state: REQUESTED
    terminal_states: [COMPLETED, REJECTED]
    transitions:
      - from: REQUESTED
        to: COMPLETED
        trigger: "POST /step-up-conversions/{id}/execute"
        actor: LicensingSpecialist
        preconditions:
          - "conversion.status == REQUESTED"
          - "agreement of the source entitlement has status == ACTIVE"
          - "source entitlement quantity >= conversion.quantity"
        side_effects:
          - "source entitlement quantity := quantity - conversion.quantity (cascade: entitlement.version increments by 1)"
          - "target entitlement (same agreement + target_product_id) created if absent with quantity := conversion.quantity, otherwise quantity += conversion.quantity; locked_baseline_quantity tracks the new quantity"
          - "conversion.charge_cents computed per step_up_conversion"
          - "conversion.version increments by 1"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /step-up-conversions/{id}/reject"
        actor: LicensingSpecialist
        preconditions:
          - "conversion.status == REQUESTED"
        side_effects:
          - "conversion.version increments by 1"

  - entity: AssuranceBenefitGrant
    initial_state: ACTIVE
    terminal_states: [DEPLETED, EXPIRED, FORFEITED]
    transitions:
      - from: ACTIVE
        to: DEPLETED
        trigger: "system: a BenefitRedemption drives quantity_remaining to exactly 0"
        actor: system
        preconditions:
          - "grant.status == ACTIVE"
          - "quantity_remaining == 0 after the redemption"
        side_effects:
          - "grant.version increments by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: POST /agreements/{id}/anniversaries and POST /agreements/{id}/position-snapshots sweep grants whose expires_on < current logical clock date"
        actor: system
        preconditions:
          - "grant.status == ACTIVE"
          - "grant.expires_on < current logical clock date"
        side_effects:
          - "grant.version increments by 1"
      - from: ACTIVE
        to: FORFEITED
        trigger: "system: owning agreement transitions to NON_RENEWED or EXPIRED"
        actor: system
        preconditions:
          - "grant.status == ACTIVE"
          - "owning agreement status becomes NON_RENEWED or EXPIRED"
        side_effects:
          - "grant.version increments by 1"

  - entity: CloudCommitment
    initial_state: ACTIVE
    terminal_states: [EXHAUSTED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system: a CloudConsumptionEvent drives consumed_amount_cents == committed_amount_cents"
        actor: system
        preconditions:
          - "commitment.status == ACTIVE"
          - "consumed_amount_cents == committed_amount_cents after the event"
        side_effects:
          - "commitment.version increments by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: POST /cloud-commitments/{id}/consumption-events with current logical clock date > expires_on, or owning agreement reaches NON_RENEWED/EXPIRED"
        actor: system
        preconditions:
          - "commitment.status == ACTIVE"
          - "current logical clock date > commitment.expires_on, OR owning agreement terminal"
        side_effects:
          - "commitment.version increments by 1"
          - "unconsumed remainder (committed_amount_cents - consumed_amount_cents) is forfeited; no refund entity is created"

  - entity: HostingAuthorization
    initial_state: PENDING_REVIEW
    terminal_states: [DENIED, REVOKED]
    transitions:
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /hosting-authorizations/{id}/review with decision=APPROVE"
        actor: LicensingSpecialist
        preconditions:
          - "authorization.status == PENDING_REVIEW"
          - "request body decision == APPROVE"
          - "product.license_mobility == true"
        side_effects:
          - "authorization.version increments by 1"
      - from: PENDING_REVIEW
        to: DENIED
        trigger: "POST /hosting-authorizations/{id}/review with decision=DENY"
        actor: LicensingSpecialist
        preconditions:
          - "authorization.status == PENDING_REVIEW"
          - "request body decision == DENY"
        side_effects:
          - "authorization.version increments by 1"
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /hosting-authorizations/{id}/suspend"
        actor: LicensingSpecialist
        preconditions:
          - "authorization.status == APPROVED"
        side_effects:
          - "authorization.version increments by 1"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /hosting-authorizations/{id}/reinstate"
        actor: LicensingSpecialist
        preconditions:
          - "authorization.status == SUSPENDED"
        side_effects:
          - "authorization.version increments by 1"
        note: "APPROVED <-> SUSPENDED cycle permits repeated suspension and reinstatement."
      - from: APPROVED
        to: REVOKED
        trigger: "POST /hosting-authorizations/{id}/revoke"
        actor: LicensingSpecialist
        preconditions:
          - "authorization.status == APPROVED"
        side_effects:
          - "authorization.version increments by 1"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /hosting-authorizations/{id}/revoke"
        actor: LicensingSpecialist
        preconditions:
          - "authorization.status == SUSPENDED"
        side_effects:
          - "authorization.version increments by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: agreement-renew-stale-version
    parent_entity: Agreement
    write_endpoint: "POST /agreements/{id}/renew"
    occ_field: "expected_agreement_version"
    description: |
      Renewing an Agreement whose version has advanced since the client last
      observed it is rejected. Captures the case where another writer has just
      renewed or modified the agreement and the current writer's view of the
      agreement is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: entitlement-adjust-stale-version
    parent_entity: LicenseEntitlement
    write_endpoint: "PATCH /entitlements/{id}"
    occ_field: "expected_entitlement_version"
    description: |
      Adjusting a LicenseEntitlement whose version has advanced since the
      client last observed it is rejected. Captures the case where another
      writer has just adjusted the same entitlement (or a settled true-up /
      executed step-up has just bumped its quantity) and the current writer's
      view of the entitlement is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: price_level_tiering
    trigger: "Organization creation and every PATCH to qualified_device_count"
    algorithm: threshold
    formula: |
      if qualified_device_count < 250:      price_level = "A"
      elif qualified_device_count < 2400:   price_level = "B"
      elif qualified_device_count < 6000:   price_level = "C"
      else:                                 price_level = "D"
    input_set: "Organization.qualified_device_count"
    constants:
      TIER_B_MIN: 250
      TIER_C_MIN: 2400
      TIER_D_MIN: 6000
      PRICE_MULTIPLIER_A: 1.00
      PRICE_MULTIPLIER_B: 0.95
      PRICE_MULTIPLIER_C: 0.90
      PRICE_MULTIPLIER_D: 0.85
    precision: "tier boundaries are inclusive on the lower side (>= 250 is B, exactly 249 is A)"

  - name: license_position_computation
    trigger: "POST /agreements/{id}/position-snapshots"
    algorithm: aggregation
    formula: |
      for each product P with >= 1 non-retired Deployment under the agreement:
        if P.license_model == PER_USER:
          required = sum(d.user_count for d in deployments(P))
        elif P.license_model == PER_DEVICE:
          required = sum(d.device_count for d in deployments(P))
        else:  # PER_SERVER_CORE
          required = 0
          for d in deployments(P):
            required += core_count_normalization(d)   # see core_count_normalization
        entitled = sum(e.quantity for e in entitlements(agreement, P))
        net = entitled - required
      Only deployments with retired == false and deployment_date <= current logical clock date are included.
      Only entitlements whose agreement_id == snapshot.agreement_id are included.
    input_set: "Deployments (retired == false, deployment_date <= clock date) and LicenseEntitlements of the agreement"
    constants: {}
    precision: "integer licenses; no rounding at this layer (core_count_normalization owns rounding)"
    variants:
      - name: per_host_full
        when: "server deployment licensing_mode resolves to PER_HOST (see core_count_normalization)"
        difference: "required cores = physical cores of the whole host, minimum 16, core factor applied"
      - name: per_vm
        when: "server deployment licensing_mode resolves to PER_VM"
        difference: "required cores = sum over VMs of max(vcores_per_vm, 8) capped by the host's normalized physical core count"

  - name: core_count_normalization
    trigger: "inside license_position_computation for each PER_SERVER_CORE deployment"
    algorithm: aggregation
    formula: |
      normalized_physical = ceil(physical_cores_per_server * core_factor)
      host_demand = max(16, normalized_physical)
      if vm_count == 0:
        return host_demand                      # bare-metal: always PER_HOST
      if licensing_mode == PER_HOST:
        return host_demand                      # unlimited VMs on the host
      else:  # PER_VM
        return min(host_demand, vm_count * max(8, vcores_per_vm))
    input_set: "one Deployment row (scope == SERVER)"
    constants:
      MIN_CORES_PER_HOST: 16
      MIN_CORES_PER_VM: 8
    precision: "ceil to whole cores per server BEFORE summing across servers; rounding order is pinned: round per-server, then sum"
    variants:
      - name: per_host
        when: "Deployment.licensing_mode == PER_HOST or vm_count == 0"
        difference: "licenses the full normalized host (unlimited virtualization)"
      - name: per_vm
        when: "Deployment.licensing_mode == PER_VM and vm_count >= 1"
        difference: "licenses per-VM vcores with an 8-core minimum per VM, capped at the normalized host demand"

  - name: true_up_retroactive_pricing
    trigger: "POST /true-up-reports/{id}/submit (recompute) and POST /true-up-reports/{id}/lines (initial computation)"
    algorithm: tiered_pricing
    formula: |
      base = growth_quantity * unit_price_cents            # unit_price_cents from org price level at submit time
      if pricing_variant == FULL_YEAR_RETROACTIVE:
        line_total = base                                  # full annual price, no proration
      else:  # ANNIVERSARY_PRORATION
        line_total = round_half_up(base * (12 - months_growth + 1) / 12)
      # Pinned evaluation order: compute base first, then apply the variant branch, then round the line.
      # Report total = sum of per-line totals (round per line THEN sum; never sum then round).
    input_set: "one TrueUpLine (growth_quantity, months_growth, unit_price_cents, pricing_variant)"
    constants:
      MONTHS_PER_YEAR: 12
    precision: "integer cents; round_half_up applied per line before summing into TrueUpReport.total_amount_cents"
    variants:
      - name: anniversary_proration
        when: "pricing_variant == ANNIVERSARY_PRORATION"
        difference: "charges only the remaining months of the anniversary year: factor (12 - months_growth + 1)/12"
      - name: full_year_retroactive
        when: "pricing_variant == FULL_YEAR_RETROACTIVE"
        difference: "charges the entire annual price regardless of when growth occurred; always >= prorated amount for identical inputs"

  - name: benefit_accrual
    trigger: "POST /true-up-reports/{id}/settle"
    algorithm: threshold
    formula: |
      t = settled report.total_amount_cents
      if t < 500_000_00:        vouchers = 0;  incidents = 0
      elif t < 2_000_000_00:    vouchers = 5;  incidents = 1
      else:                     vouchers = 10; incidents = 2
      if t >= 5_000_000_00:     upgrade_rights = 1
      else:                     upgrade_rights = 0
      for each (benefit_type, qty) with qty > 0:
        create AssuranceBenefitGrant(agreement_id, benefit_type, quantity_granted=qty,
                                     expires_on = current clock date + 365 days, status=ACTIVE)
    input_set: "settled TrueUpReport.total_amount_cents"
    constants:
      VOUCHER_TIER1_MIN_CENTS: 50000000
      VOUCHER_TIER2_MIN_CENTS: 200000000
      UPGRADE_RIGHT_MIN_CENTS: 500000000
      BENEFIT_TTL_DAYS: 365
    precision: "integer grant quantities; tier boundaries inclusive on the lower side (>= 50000000 cents enters tier 1)"

  - name: cloud_consumption_waterfall
    trigger: "POST /cloud-commitments/{id}/consumption-events"
    algorithm: waterfall_allocation
    formula: |
      available = commitment.committed_amount_cents - commitment.consumed_amount_cents
      consumed = min(requested_cents, available)
      commitment.consumed_amount_cents += consumed
      if commitment.consumed_amount_cents == commitment.committed_amount_cents:
        commitment.status = EXHAUSTED
      event.consumed_cents = consumed     # may be less than requested_cents; the excess is dropped
    input_set: "one ACTIVE CloudCommitment and the new CloudConsumptionEvent.requested_cents"
    constants: {}
    precision: "integer cents"

  - name: step_up_conversion
    trigger: "POST /step-up-conversions/{id}/execute"
    algorithm: constraint_propagation
    formula: |
      src = source LicenseEntitlement; tgt_p = target Product
      mult = price multiplier for organization's current price_level (A=1.00, B=0.95, C=0.90, D=0.85)
      tgt_unit = round_half_up(tgt_p.annual_unit_price_cents * mult)
      delta = max(0, tgt_unit - src.unit_price_cents)
      charge_cents = quantity * delta
      src.quantity -= quantity
      target entitlement (agreement_id + target_product_id) quantity += quantity (create with quantity if absent,
        unit_price_cents := tgt_unit, locked_baseline_quantity := quantity)
    input_set: "StepUpConversion row, source LicenseEntitlement, target Product, Organization.price_level"
    constants: {}
    precision: "integer cents; round_half_up on the target unit price before the delta"

  - name: shortfall_exposure_projection
    trigger: "GET /agreements/{id}/shortfall-assessment"
    algorithm: projection
    formula: |
      precondition: agreement.status in {EXPIRED, NON_RENEWED}
      for each product P with >= 1 non-retired Deployment or >= 1 entitlement under the agreement:
        required = license_position_computation(P)                # same rules as snapshots
        perp = sum(e.quantity for e in entitlements(P) where product.license_kind == PERPETUAL)
        subs = sum(e.quantity for e in entitlements(P) where product.license_kind == SUBSCRIPTION)
        effective_coverage = perp          # subscription coverage ends with the agreement
        shortfall = max(0, required - effective_coverage)
        line = {product_id: P, license_kind: ..., required_licenses: required,
                perpetual_quantity: perp, subscription_quantity: subs,
                effective_coverage: effective_coverage, shortfall: shortfall}
    input_set: "Deployments and LicenseEntitlements of an EXPIRED or NON_RENEWED agreement"
    constants: {}
    precision: "integer licenses"
    variants:
      - name: non_renewal
        when: "agreement.status == NON_RENEWED"
        difference: "PERPETUAL entitlements survive at their full quantity; SUBSCRIPTION entitlements count as zero effective coverage"
      - name: expiry
        when: "agreement.status == EXPIRED"
        difference: "identical arithmetic to non_renewal; only the assessment.agreement_status field differs"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is one of the declared roles."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted for the endpoint per §1.5 roles and §1.7 RBAC matrix."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "For entity_backed roles (CustomerAdmin), X-User-ID equals the id of the Organization that owns the target resource (resolved via agreement.organization_id or the path organization id)."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints carrying X-User-Role: CustomerAdmin"
  - priority: 4
    category: existence
    check: "Path and body references exist, validated left-to-right: organization, agreement, anniversary, product, entitlement, deployment, report, line, grant, commitment, authorization, snapshot."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: existence
    check: "POST /products sku must not collide with an existing product sku; POST /agreements enrollment_number must be globally unique."
    error_id: ERR_DUPLICATE_SKU
    http_status: 409
    applies_to: "POST /products, POST /agreements"
  - priority: 6
    category: existence
    check: "An agreement enrollment_number must be unique across all agreements."
    error_id: ERR_DUPLICATE_ENROLLMENT
    http_status: 409
    applies_to: "POST /agreements"
  - priority: 7
    category: existence
    check: "At most one LicenseEntitlement per (agreement_id, product_id) pair."
    error_id: ERR_DUPLICATE_ENTITLEMENT
    http_status: 409
    applies_to: "POST /agreements/{id}/entitlements"
  - priority: 8
    category: state
    check: "Target resource is in a state from which the requested transition is allowed per §1.2 (covers activate, renewal-review, renew, decline-renewal, expire, submit, accept, reject, revise, invoice, settle, execute, review, suspend, reinstate, revoke)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 9
    category: state
    check: "Mutations that require an active enrollment (create entitlement/deployment/commitment/snapshot/report/grant/authorization/step-up, PATCH entitlement) are rejected when agreement.status != ACTIVE."
    error_id: ERR_AGREEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /agreements/{id}/entitlements, POST /agreements/{id}/deployments, POST /agreements/{id}/cloud-commitments, POST /agreements/{id}/position-snapshots, POST /agreements/{id}/true-up-reports, POST /agreements/{id}/benefit-grants, POST /agreements/{id}/hosting-authorizations, POST /entitlements/{id}/step-up, PATCH /entitlements/{id}"
  - priority: 10
    category: state
    check: "Snapshot creation requires the target anniversary's true_up_closed == false; a closed anniversary is immutable."
    error_id: ERR_ANNIVERSARY_CLOSED
    http_status: 409
    applies_to: "POST /agreements/{id}/position-snapshots, POST /agreements/{id}/true-up-reports"
  - priority: 11
    category: state
    check: "PATCH /entitlements/{id} and POST /entitlements/{id}/step-up are rejected when any TrueUpReport for the entitlement's agreement is in status SUBMITTED or ACCEPTED (report under review locks the license base)."
    error_id: ERR_ENTITLEMENT_LOCKED_BY_REVIEW
    http_status: 409
    applies_to: "PATCH /entitlements/{id}, POST /entitlements/{id}/step-up"
  - priority: 12
    category: state
    check: "POST /true-up-reports/{id}/submit requires >= 1 TrueUpLine on the report."
    error_id: ERR_REPORT_EMPTY
    http_status: 422
    applies_to: "POST /true-up-reports/{id}/submit"
  - priority: 13
    category: business_temporal
    check: "POST /agreements/{id}/activate requires current logical clock date <= agreement.start_date."
    error_id: ERR_ACTIVATION_WINDOW_MISSED
    http_status: 422
    applies_to: "POST /agreements/{id}/activate"
  - priority: 14
    category: business_temporal
    check: "POST /agreements/{id}/renewal-review requires current date within [end_date - 90 days, end_date]."
    error_id: ERR_RENEWAL_WINDOW
    http_status: 422
    applies_to: "POST /agreements/{id}/renewal-review"
  - priority: 15
    category: business_temporal
    check: "POST /agreements/{id}/anniversaries requires: year_index in 1..3, strictly greater than all existing year_index values for the agreement, period_start >= agreement.start_date, period_start > previous anniversary period_start, period_end > period_start."
    error_id: ERR_INVALID_ANNIVERSARY_SEQUENCE
    http_status: 422
    applies_to: "POST /agreements/{id}/anniversaries"
  - priority: 16
    category: business_temporal
    check: "Deployment.deployment_date must be <= current logical clock date; HostingAuthorization.effective_on must be >= current logical clock date at creation."
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /agreements/{id}/deployments, POST /agreements/{id}/hosting-authorizations"
  - priority: 17
    category: business_temporal
    check: "POST /benefit-grants/{id}/redemptions requires grant.expires_on >= current logical clock date (in addition to grant.state checks at priority 8; a grant that should have expired but has not yet been swept fails here with the temporal error)."
    error_id: ERR_BENEFIT_EXPIRED
    http_status: 422
    applies_to: "POST /benefit-grants/{id}/redemptions"
  - priority: 18
    category: business_temporal
    check: "POST /cloud-commitments/{id}/consumption-events requires commitment.expires_on >= current logical clock date. (If the date is past expiry the commitment is transitioned to EXPIRED and this error is returned.)"
    error_id: ERR_COMMITMENT_EXPIRED
    http_status: 422
    applies_to: "POST /cloud-commitments/{id}/consumption-events"
  - priority: 19
    category: business_constraint
    check: "Deployment.scope must be consistent with the product's license_model: USER <-> PER_USER, DEVICE <-> PER_DEVICE, SERVER <-> PER_SERVER_CORE; scope-dependent numeric fields obey their >= 1 / >= 0 requirements."
    error_id: ERR_SCOPE_MISMATCH
    http_status: 422
    applies_to: "POST /agreements/{id}/deployments"
  - priority: 20
    category: business_constraint
    check: "A SERVER Deployment with hosting == THIRD_PARTY_DATACENTER is rejected unless the product has license_mobility == true AND there exists a HostingAuthorization for (agreement_id, product_id) with status == APPROVED and effective_on <= deployment_date."
    error_id: ERR_HOSTING_NOT_AUTHORIZED
    http_status: 422
    applies_to: "POST /agreements/{id}/deployments"
  - priority: 21
    category: business_constraint
    check: "Step-up requires: target product family == source product family, target edition strictly above source product edition (STANDARD -> PROFESSIONAL -> ENTERPRISE), both products' license_kind equal, and quantity >= 1."
    error_id: ERR_STEP_UP_INVALID
    http_status: 422
    applies_to: "POST /entitlements/{id}/step-up"
  - priority: 22
    category: business_constraint
    check: "HostingAuthorization creation requires product.license_mobility == true."
    error_id: ERR_LICENSE_MOBILITY_REQUIRED
    http_status: 422
    applies_to: "POST /agreements/{id}/hosting-authorizations"
  - priority: 23
    category: business_constraint
    check: "At most one TrueUpReport in a non-REJECTED status per (agreement_id, anniversary_id)."
    error_id: ERR_DUPLICATE_TRUE_UP
    http_status: 409
    applies_to: "POST /agreements/{id}/true-up-reports"
  - priority: 24
    category: business_referential
    check: "PATCH /entitlements/{id} new quantity must be >= locked_baseline_quantity; the ratified baseline may never be reduced."
    error_id: ERR_QUANTITY_BELOW_BASELINE
    http_status: 422
    applies_to: "PATCH /entitlements/{id}"
  - priority: 25
    category: business_fiscal
    check: "TrueUpLine.months_growth must be within 1..12."
    error_id: ERR_MONTHS_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /true-up-reports/{id}/lines"
  - priority: 26
    category: business_fiscal
    check: "BenefitRedemption.quantity must be >= 1 and <= grant.quantity_remaining."
    error_id: ERR_REDEMPTION_EXCEEDS_REMAINING
    http_status: 422
    applies_to: "POST /benefit-grants/{id}/redemptions"
  - priority: 27
    category: business_fiscal
    check: "CloudCommitment.committed_amount_cents >= 1; CloudConsumptionEvent.requested_cents >= 1."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /agreements/{id}/cloud-commitments, POST /cloud-commitments/{id}/consumption-events"
  - priority: 28
    category: existence
    check: "Any required field missing from a request body, or an enum value outside the declared constraint set."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/licensing/_clock/set_current_utc"
    description: "Test-driving endpoint: sets the logical clock. Server startup default is exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time before the first call."
    roles: [ProgramAdministrator]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: []

  - method: POST
    path: "/licensing/organizations"
    description: "Register a customer organization; price_level computed from qualified_device_count."
    roles: [ProgramAdministrator]
    code: 201
    input: [legal_name, qualified_device_count]
    output: Organization
    side_effects: ["price_level_tiering"]
  - method: GET
    path: "/licensing/organizations/{id}"
    description: "Fetch one organization."
    roles: [ProgramAdministrator, LicensingSpecialist, CustomerAdmin, Auditor]
    code: 200
    input: []
    output: Organization
    side_effects: []
  - method: GET
    path: "/licensing/organizations"
    description: "List organizations (paginated)."
    roles: [ProgramAdministrator, LicensingSpecialist, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: Organization[]
    side_effects: []
  - method: PATCH
    path: "/licensing/organizations/{id}"
    description: "Update qualified_device_count (and optionally legal_name); recomputes price_level."
    roles: [ProgramAdministrator]
    code: 200
    input: ["qualified_device_count?", "legal_name?"]
    output: Organization
    side_effects: ["price_level_tiering", "increments Organization.version by 1"]

  - method: POST
    path: "/licensing/agreements"
    description: "Create an enterprise agreement enrollment in DRAFT."
    roles: [ProgramAdministrator]
    code: 201
    input: [organization_id, enrollment_number, start_date, end_date]
    output: Agreement
    side_effects: []
  - method: GET
    path: "/licensing/agreements/{id}"
    description: "Fetch one agreement."
    roles: [ProgramAdministrator, LicensingSpecialist, CustomerAdmin, Auditor]
    code: 200
    input: []
    output: Agreement
    side_effects: []
  - method: GET
    path: "/licensing/organizations/{id}/agreements"
    description: "List agreements of an organization (FK reverse-reachability)."
    roles: [ProgramAdministrator, LicensingSpecialist, CustomerAdmin, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: Agreement[]
    side_effects: []
  - method: POST
    path: "/licensing/agreements/{id}/activate"
    description: "DRAFT -> ACTIVE; only on or before start_date."
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: Agreement
    side_effects: ["Agreement DRAFT -> ACTIVE"]
  - method: POST
    path: "/licensing/agreements/{id}/renewal-review"
    description: "ACTIVE -> RENEWAL_PENDING within the 90-day window before end_date."
    roles: [LicensingSpecialist]
    code: 200
    input: []
    output: Agreement
    side_effects: ["Agreement ACTIVE -> RENEWAL_PENDING"]
  - method: POST
    path: "/licensing/agreements/{id}/renew"
    description: "RENEWAL_PENDING -> RENEWED with a new end date; OCC-guarded."
    roles: [ProgramAdministrator]
    code: 200
