      - name: credit_cascade_member_to_household_to_readiness_to_mortgage
        depth: 4
        chain: "SweatEquityEntry CREDITED -> HouseholdMember.credited_hours_to_date -> ApplicantHousehold ledger + selection_status/readiness -> MortgageApplication APPROVED -> CLEARED_TO_CLOSE"
        grounds:
          - state_machines.SweatEquityEntry.status.VERIFIED_to_CREDITED
          - state_machines.ApplicantHousehold.partnership_readiness.EDUCATION_COMPLETE_to_CLOSING_READY
          - state_machines.MortgageApplication.status.APPROVED_to_CLEARED_TO_CLOSE
          - entities.HouseholdMember.fields.credited_hours_to_date
        distinguishing_aspect: |
          Every hop is CAUSED by the hop before it, and hop 4 is unreachable
          without hops 1-3 in the same request: hop 1 writes the member ledger,
          hop 1's total makes hop 2's household total 12.00 which equals
          sweat_equity_required_hours (equality satisfies), hop 2's satisfaction
          flag plus the pre-existing EDUCATION_COMPLETE readiness triggers hop 3
          (CLOSING_READY and SELECTED -> PARTNERSHIP_ACTIVE), and only
          CLOSING_READY drives hop 4 on the APPROVED mortgage. A one- or
          two-level implementation leaves the mortgage in APPROVED.
        test_recipe:
          setup:
            - "Program pool 5000000, sweat_equity_base_hours_required 12."
            - "Household SELECTED, HOMEBUYER_CORE COMPLETED (readiness EDUCATION_COMPLETE), MortgageApplication APPROVED with silent_second_amount_cents 1950000 (submitted by officer-1, approved by officer-2)."
            - "Clock at 2026-08-05T00:00:00.000Z; one 12.00-hour CONSTRUCTION entry in VERIFIED."
