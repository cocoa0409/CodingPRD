  - rule_id: cross_entity_state_dependency
    instances:

      - name: lot_issuance_blocked_by_unapproved_supplier
        grounds:
          - validations[priority=11]
          - errors[ERR_SUPPLIER_NOT_APPROVED]
          - state_machines.DeviceSupplier.PENDING_REVIEW_to_APPROVED
