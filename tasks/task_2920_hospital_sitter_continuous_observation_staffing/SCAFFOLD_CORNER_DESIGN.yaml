            - "Probe 5 (console owner O1, identical body): HTTP 201 with VideoFeed ${ofd} ACTIVE, acuity_weight 1.0; MonitoringStation.${ocs}.status == ACTIVE_MONITORING, active_feed_count == 1, effective_span_limit == 2; Staff.${oo1}.status == ON_ASSIGNMENT"

      - name: an_empty_identity_header_is_refused_before_the_path_is_resolved
        claim_type: authentication
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations[priority=1]
        distinguishing_aspect: "Priority 1 is the outermost gate: an empty-string X-User-ID on an entity_backed role must produce 401 even though the path names an assignment that does not exist and the role would also be wrong for the endpoint, so neither the 404 at priority 4 nor the 403 at priority 2 may surface. The empty header must be sent as a real empty string, not as whitespace and not omitted from the request builder."
        test_recipe:
          setup:
            - "Empty database; no assignment with the probed id exists."
          setup_api_calls: []
          trigger:
            - call: "POST /observation/sitter-assignments/cccccccc-cccc-4ccc-8ccc-cccccccccccc/start-watch"
              payload: {}
              as: Sitter
              as_user_id: ""
            - call: "POST /observation/orders/44444444-4444-4444-8444-444444444444/discontinuation-review"
              payload: { recommendation: "CONTINUE" }
              as: AttendingProvider
              as_user_id: ""
          assert:
            - "Probe 1: HTTP 401 with data.error_id == ERR_UNAUTHENTICATED — not 404 ERR_ASSIGNMENT_NOT_FOUND and not 404 ERR_STAFF_NOT_FOUND"
            - "Probe 2: HTTP 401 with data.error_id == ERR_UNAUTHENTICATED even for an opaque role — the header must be present and non-empty for every caller"
            - "Both error bodies still carry response_type == error, data.error_id, meta.api_request_id and meta.api_request_timestamp"

      - name: the_ordering_provider_may_not_render_the_discontinuation_decision
        claim_type: segregation_of_duties
        grounds:
          - roles.AttendingProvider.notes
          - validations[priority=16]
        distinguishing_aspect: "Opening the review carries no segregation constraint, so the same provider may recommend discontinuation; only the decision demands a second AttendingProvider user id. The refused decision must leave the order sitting in DISCONTINUATION_REVIEW so the second provider can complete the identical call."
        test_recipe:
          setup:
            - "Unit UNIT-C48 budget 250000, video disabled; admitted patient age 60 with a FALL-only order written by prov-1."
            - "prov-1 reassesses once (satisfying the review gate) and opens the discontinuation review with recommendation DISCONTINUE."
            - "No SafetyEvent exists on the order, so the 24h discontinuation safety window is vacuous."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-C48", name: "Corner Unit Fortyeight", observation_cost_budget_cents: 250000, video_monitoring_enabled: false }
              as: NurseManager
              captures: { u48: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${u48}", mrn: "MRN-C4801", full_name: "Sod Patient", age_years: 60 }
              as: NurseManager
              captures: { sdp: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${sdp}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Fall precautions, likely short-lived" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { sdo: $.data.id }
            - call: "POST /observation/orders/${sdo}/reassessments"
              payload: { risk_categories_after: ["FALL"] }
              as: AttendingProvider
              as_user_id: "prov-1"
            - call: "POST /observation/orders/${sdo}/discontinuation-review"
              payload: { recommendation: "DISCONTINUE" }
              as: AttendingProvider
              as_user_id: "prov-1"
          trigger:
            - call: "POST /observation/orders/${sdo}/discontinuation-decision"
              payload: { decision: "APPROVE", rationale: "Ordering provider attempting to close their own order" }
              as: AttendingProvider
              as_user_id: "prov-1"
            - call: "POST /observation/orders/${sdo}/discontinuation-decision"
              payload: { decision: "APPROVE", rationale: "Second provider concurs, risk resolved" }
              as: AttendingProvider
              as_user_id: "prov-2"
          assert:
            - "Setup: ObservationOrder.${sdo}.status == DISCONTINUATION_REVIEW with discontinuation_review_opened_by_user_id == prov-1 — opening the review by the ordering provider is legal"
            - "Probe 1: HTTP 403 with data.error_id == ERR_SEGREGATION_OF_DUTIES because prov-1 equals ordering_provider_user_id"
            - "Probe 1 changed nothing: the order is still DISCONTINUATION_REVIEW, discontinued_at is null and its version did not move"
            - "Probe 2: HTTP 200 with status == DISCONTINUED and discontinued_at == 2026-08-01T00:00:00Z"
            - "Unit.${u48}.open_order_count == 0 and observed_cost_to_date_cents == 0 — there were no watches to cascade to"

      - name: an_incident_review_may_not_be_closed_by_the_officer_who_opened_it
        claim_type: segregation_of_duties
        grounds:
          - roles.SafetyOfficer.notes
          - validations[priority=16]
        distinguishing_aspect: "The officer check compares the closer against review_opened_by_user_id, which only the incident-review branch ever populates. The same officer id is therefore refused on the incident-review event and accepted on the escalated-response event in the same run, which is the only way to show the constraint is branch-conditional rather than global."
        test_recipe:
          setup:
            - "Unit UNIT-C49 budget 250000, video disabled; two admitted patients age 60."
            - "Order A ([FALL], baseline 1.5) has a watch by sitter A that is ON_WATCH from 08:00Z; at 09:00Z sitter A reports a FALL_WITH_INJURY naming the assignment and safety-1 opens the incident review."
            - "Order B ([ELOPEMENT], baseline 2.5) has no watch; sitter B reports an ELOPEMENT_ATTEMPT with no assignment_id, which escalates order B, and safety-1 records the escalation response."
