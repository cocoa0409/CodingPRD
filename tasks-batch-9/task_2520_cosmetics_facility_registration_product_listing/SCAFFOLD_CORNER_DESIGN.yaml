          trigger:
            - call: "POST /cosmetics/recall-actions/${ra_id}/withdrawals"
              payload: { scope_depth: "RETAIL", expected_recall_action_version: "${ra_v2}" }
              as: EnforcementOfficer
              as_user_id: "OFF-1"
              captures: { wd2_id: $.data.id, wd2_status: $.data.status }
            - call: "GET /cosmetics/withdrawals/${wd1_id}"
              payload: {}
              as: EnforcementOfficer
              as_user_id: "OFF-1"
              captures: { wd1_status_after: $.data.status, wd1_count_after: $.data.records_produced_count }
            - call: "GET /cosmetics/distribution-records/${rec_id}"
              payload: {}
              as: EnforcementOfficer
              as_user_id: "OFF-1"
              captures: { rec_wd_after: $.data.withdrawal_id, rec_units_after: $.data.units_shipped }
          assert:
            - "${wd1_count} == 1 and ${wd1_units} == 600 before the successor round"
            - "${wd2_status} == \"OPEN\" and ${wd2_id} != ${wd1_id}"
            - "${wd1_status_after} == \"SUPERSEDED\" (terminal) and ${wd1_count_after} == 0 with shipped_units_total == 0 and outstanding_units_total == 0"
            - "${rec_wd_after} is null — the link was released, not deleted"
            - "${rec_units_after} == 600 with units_verified_returned == 0 and units_outstanding == 600 — the record's own tallies survive the compensation"
            - "GET /cosmetics/distribution-records?withdrawal_id=${wd1_id} returns total_count == 0"
            - "the RecallAction stayed EXECUTING (self-loop) and its version incremented by exactly 1"

      - name: parallel_listing_and_safety_dimensions_advance_independently
        claim_type: parallel
        grounds:
          - state_machines.ProductListing.parallel_dimensions
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: listing_register_dimension_holds_while_safety_dimension_resets
          rationale: |
            That §1.8 instance already drives both dimensions of one LISTED listing at once — the safety
            dimension is reset to UNSUBSTANTIATED by a fresh dossier and then walked back up through
            UNDER_SUBSTANTIATION while listing_status never leaves LISTED and listing_number is retained.
            A separate corner instance would repeat the same two-dimension observation with fewer hops.

      - name: facility_lapse_cascades_down_to_listings_and_designations
        claim_type: cascade_down
        grounds:
          - state_machines.Facility.REGISTERED_to_LAPSED
          - state_machines.ProductListing.LISTED_to_SUSPENDED
        excluded_because:
          difficulty_instance: sweep_lapse_cascades_posture_listing_designation_and_dormancy
          rationale: |
            The four-hop downward cascade (posture FROZEN -> listings SUSPENDED -> designation counts
            decremented -> responsible person DORMANT) with its pinned ledger ordering is exactly that
            §1.8 transitive-cascade instance; a corner instance could only re-assert the same hops.

      - name: late_serious_report_bubbles_up_from_event_to_facility_posture
        claim_type: bubble_up
        grounds:
          - state_machines.AdverseEvent.REPORT_DUE_to_REPORTED_LATE
          - calculations.facility_compliance_posture
        excluded_because:
          difficulty_instance: late_serious_report_cascades_points_posture_dossier_and_listing
          rationale: |
            The upward path from a single child AdverseEvent to its grandparent Facility's posture and
            then back down to every ADEQUATE dossier is the pinned four-hop chain of that §1.8 instance,
            including the per-event rounding that produces the escalating total.

      - name: late_renewal_restores_the_suspended_listings_it_released
        claim_type: compensation
        grounds:
          - state_machines.Facility.LAPSED_to_REGISTERED
          - state_machines.ProductListing.SUSPENDED_to_LISTED
        excluded_because:
          difficulty_instance: late_renewal_restores_the_designation_slot_count_it_released
          rationale: |
            The compensating restore (FACILITY_LAPSED suspensions returning to LISTED, designation counts
            and DORMANT flags reversing, RECALL_ESCALATION suspensions deliberately NOT restored) is the
            whole subject of that §1.8 compensating-invariant instance.

      - name: verified_recovery_entries_stay_in_sync_with_the_compliance_ledger
        claim_type: ledger_sync
        grounds:
          - calculations.distribution_unit_conservation
          - entities.ComplianceLedgerEntry.fields.signed_units_delta
        excluded_because:
          difficulty_instance: correction_reversal_preserves_shipped_unit_conservation_and_ledger_sum
          rationale: |
            That §1.8 instance is built precisely on the ledger-sync invariant: the signed UNIT_MOVEMENT
            deltas must sum to the bucket balances after a CORRECTION_REVERSAL, so a corner instance
            asserting the same equality would be redundant.

      - name: recall_plan_cycle_admits_at_most_three_submissions
        claim_type: cyclic
        grounds:
          - state_machines.RecallAction.PLAN_REJECTED_to_PLAN_SUBMITTED
          - state_machines.RecallAction.PLAN_SUBMITTED_to_ESCALATED_MANDATORY
          - errors[ERR_RECALL_PLAN_ROUNDS_EXHAUSTED]
        excluded_because:
          difficulty_instance: recall_plan_revision_cycle_terminates_at_third_round
          rationale: |
            The plan/rejection loop, its MAX_PLAN_ROUNDS termination, the MANDATORY_ORDER escalation
            cascade and the VOLUNTARY_NOTICE branch that makes ERR_RECALL_PLAN_ROUNDS_EXHAUSTED reachable
            are all pinned in that §1.8 non-linear-state-machine instance.

  - section: calculations
    instances:
      - name: initial_period_end_clamps_a_leap_day_anchor_to_february_twenty_seventh
        claim_type: chronological
        grounds:
          - calculations.registration_period_bounds
          - entities.RegistrationPeriod.fields.period_end
          - state_machines.Facility.PENDING_REVIEW_to_REGISTERED
        distinguishing_aspect: |
          A facility approved on a leap day exercises the day-clamp: anchor_day =
          min(29, days_in_month(2030, 2) = 28) = 28, so period_end is 2030-02-28 minus one day =
          2030-02-27 — NOT 2030-02-28 and not an invalid 2030-02-29. The two derived dates inherit the
          clamp: renewal_window_open_date 2029-11-29 and grace_end_date 2030-04-28.
        test_recipe:
          setup:
            - "logical clock moved to 2028-02-29T00:00:00Z before the facility is approved"
          setup_api_calls:
            - call: "POST /cosmetics/_clock/set_current_utc"
              payload: { current_utc: "2028-02-29T00:00:00Z" }
              as: SystemOperator
              as_user_id: "OPS-1"
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Newark", owner_operator_name: "Aster Holdings LLC", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
              captures: { fac_id: $.data.id }
            - call: "POST /cosmetics/facilities/${fac_id}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
          trigger:
            - call: "POST /cosmetics/facilities/${fac_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
              captures: { p_start: $.data.current_period_start, p_end: $.data.current_period_end, r_open: $.data.renewal_window_open_date, g_end: $.data.grace_end_date }
          assert:
            - "${p_start} == \"2028-02-29\" — the INITIAL period starts on date(logical clock now)"
            - "${p_end} == \"2030-02-27\" (anchor 2030-02-28 clamped from day 29, minus one day for the closed-closed interval)"
            - "${r_open} == \"2029-11-29\" (period_end - 90 days)"
            - "${g_end} == \"2030-04-28\" (period_end + 60 days)"
            - "GET /cosmetics/facilities/${fac_id}/registration-periods returns one ACTIVE row with period_kind == \"INITIAL\", sequence_index == 1 and the same four dates"

      - name: renewal_inside_the_window_mints_a_contiguous_gap_free_successor_period
        claim_type: correct_result
        grounds:
          - calculations.registration_period_bounds
          - state_machines.Facility.REGISTERED_to_REGISTERED
          - entities.RegistrationPeriod.fields.period_kind
        distinguishing_aspect: |
          The successor period_start is the PRIOR period_end + 1 day (2028-08-01) and not the renewal
          date (2028-06-15), so the biennial cadence never drifts: the successor runs
          2028-08-01 .. 2030-07-31 with period_kind RENEWAL (filed on or before the prior period_end),
          sequence_index 2, while the predecessor flips to EXPIRED and registration_cycle_count reaches 2.
        test_recipe:
          setup:
            - "one REGISTERED facility on the INITIAL 2026-08-01 .. 2028-07-31 period; clock moved into the renewal window"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Newark", owner_operator_name: "Aster Holdings LLC", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
              captures: { fac_id: $.data.id }
            - call: "POST /cosmetics/facilities/${fac_id}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
            - call: "POST /cosmetics/facilities/${fac_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
            - call: "POST /cosmetics/_clock/set_current_utc"
              payload: { current_utc: "2028-06-15T00:00:00Z" }
              as: SystemOperator
              as_user_id: "OPS-1"
          trigger:
            - call: "POST /cosmetics/facilities/${fac_id}/renewals"
              payload: { renewal_kind: "STANDARD" }
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
              captures: { new_start: $.data.period_start, new_end: $.data.period_end, new_kind: $.data.period_kind, new_seq: $.data.sequence_index }
            - call: "GET /cosmetics/facilities/${fac_id}"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
              captures: { cycle: $.data.registration_cycle_count, cur_end: $.data.current_period_end, cur_grace: $.data.grace_end_date }
          assert:
            - "${new_start} == \"2028-08-01\" — prior period_end 2028-07-31 plus one day, NOT the 2028-06-15 filing date"
            - "${new_end} == \"2030-07-31\", ${new_kind} == \"RENEWAL\" (filed on or before the prior period_end), ${new_seq} == 2"
            - "the new period's renewal_window_open_date == \"2030-05-02\" and grace_end_date == \"2030-09-29\""
            - "${cycle} == 2 and ${cur_end} == \"2030-07-31\" and ${cur_grace} == \"2030-09-29\""
            - "GET /cosmetics/facilities/${fac_id}/registration-periods?status=EXPIRED returns exactly the sequence_index 1 row; ?status=ACTIVE returns exactly the sequence_index 2 row"
            - "registration_status is \"REGISTERED\" — the REGISTERED -> REGISTERED self-loop fired because the sweep had not yet marked RENEWAL_DUE"

      - name: points_input_set_excludes_retained_and_still_unreported_events
        claim_type: input_set_filtering
        grounds:
          - calculations.facility_serious_event_points
          - state_machines.AdverseEvent.RECORDED_to_RETAINED
          - state_machines.AdverseEvent.RECORDED_to_REPORT_DUE
        distinguishing_aspect: |
          Only events in {REPORTED_TIMELY, REPORTED_LATE, REPORT_OVERDUE} enter the sum. With three
          events on one facility — one NON_SERIOUS (RETAINED), one SERIOUS still REPORT_DUE, and one
          SERIOUS reported on time — the facility total is exactly 2.00, not 2.00 plus any contribution
          from the other two, and the RETAINED event carries no deadline at all.
        test_recipe:
          setup:
            - "one REGISTERED facility, one consumer listing, clock at 2026-08-05T08:00:00Z"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Newark", owner_operator_name: "Aster Holdings LLC", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
              captures: { fac_id: $.data.id }
            - call: "POST /cosmetics/facilities/${fac_id}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
            - call: "POST /cosmetics/facilities/${fac_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
            - call: "POST /cosmetics/responsible-persons"
              payload: { legal_name: "Aster Brands Inc", us_address_line: "12 Market St, Newark NJ 07102", contact_phone: "+1-202-555-0110", contact_email: "safety@aster.example" }
              as: ResponsiblePersonAgent
              captures: { rp_id: $.data.id }
            - call: "POST /cosmetics/listings"
              payload: { facility_id: "${fac_id}", responsible_person_id: "${rp_id}", product_name: "Aster Blush Powder", category_code: "07A", product_form: "LEAVE_ON", label_contact_type: "ELECTRONIC_CONTACT", label_contact_value: "safety@aster.example" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /cosmetics/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T08:00:00Z" }
              as: SystemOperator
              as_user_id: "OPS-1"
          trigger:
            - call: "POST /cosmetics/listings/${lst_id}/adverse-events"
              payload: { event_description: "Transient stinging, resolved same day", received_at: "2026-08-05T00:00:00Z", seriousness: "NON_SERIOUS", outcome_code: "NONE" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { ae_retained_id: $.data.id, retained_status: $.data.report_status, retained_deadline: $.data.deadline_at, retained_points: $.data.event_points, retained_retention: $.data.retention_until }
            - call: "POST /cosmetics/listings/${lst_id}/adverse-events"
              payload: { event_description: "Chemical burn requiring urgent care", received_at: "2026-08-05T00:00:00Z", seriousness: "SERIOUS", outcome_code: "HOSPITALIZATION" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { ae_due_id: $.data.id, due_status: $.data.report_status, due_points: $.data.event_points }
            - call: "POST /cosmetics/listings/${lst_id}/adverse-events"
              payload: { event_description: "Facial swelling with persistent scarring", received_at: "2026-08-05T00:00:00Z", seriousness: "SERIOUS", outcome_code: "DISFIGUREMENT" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { ae_reported_id: $.data.id }
            - call: "POST /cosmetics/adverse-events/${ae_reported_id}/report"
              payload: { report_narrative: "Reported within the statutory window" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { reported_points: $.data.event_points }
            - call: "GET /cosmetics/facilities/${fac_id}"
              payload: {}
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
              captures: { fac_points: $.data.serious_event_points, fac_open: $.data.open_serious_event_count, fac_posture: $.data.compliance_posture }
          assert:
            - "${retained_status} == \"RETAINED\", ${retained_deadline} is null, ${retained_points} == 0.00 and ${retained_retention} == \"2029-08-05\" (3 years for a NON_SERIOUS consumer event)"
            - "${due_status} == \"REPORT_DUE\" and ${due_points} == 0.00 — an unreported event has no base to apply"
            - "${reported_points} == 2.00"
            - "${fac_points} == 2.00 — exactly the one in-scope event; neither the RETAINED nor the REPORT_DUE row contributes"
            - "${fac_open} == 1 — the two SERIOUS events raised it to 2 and the reported one lowered it to 1; the RETAINED event never touched it"
            - "${fac_posture} == \"OPEN\" (2.00 < 10.00)"
            - "GET /cosmetics/listings/${lst_id}/adverse-events?report_status=RETAINED returns only ${ae_retained_id}; ?seriousness=SERIOUS returns ${ae_due_id} and ${ae_reported_id}"

      - name: reclassified_event_rebases_its_deadline_and_extends_its_retention
        claim_type: correct_result
        grounds:
          - calculations.serious_event_report_deadline
          - state_machines.AdverseEvent.RETAINED_to_REPORT_DUE
          - entities.AdverseEvent.fields.retention_until
        distinguishing_aspect: |
          deadline_basis_at is reclassified_at when present — never received_at. An event received
          2026-08-05 and reclassified SERIOUS at 2026-08-25T09:30:00Z gets deadline 2026-09-09T23:59:59.999Z
          (15 days from the reclassification), NOT the already-expired 2026-08-20; meanwhile
          retention_until stretches from the 3-year consumer horizon 2029-08-05 to the 6-year serious
          horizon 2032-08-05, still anchored on received_at.
        test_recipe:
          setup:
            - "one REGISTERED facility, one consumer listing, one NON_SERIOUS event received 2026-08-05, clock later moved to 2026-08-25T09:30:00Z"
          setup_api_calls:
