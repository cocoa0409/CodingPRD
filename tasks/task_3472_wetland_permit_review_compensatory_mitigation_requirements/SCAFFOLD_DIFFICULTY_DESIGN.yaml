            - { call: "GET /wetland-permits/permits?application_id=${app_id}", as: Reviewer, as_user_id: "rev-1", captures: { perm_id: "$.data[0].id", perm_number: "$.data[0].permit_number" } }
            - { call: "POST /wetland-permits/permits/${perm_id}/commence-work", payload: {}, as: Applicant, as_user_id: "${ap_id}" }
