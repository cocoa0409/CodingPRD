            - "Trigger call 6: the fourth cell would reserve only 100 cents but 5000 + 4000 + 100 == 9100 > 9000, so HTTP 409 with ${e70b} == ERR_INCENTIVE_BUDGET_EXCEEDED - the same rule guards POST /markets/{market_id}/quota-cells, not just accruals"
            - "Trigger call 7: data.incentive_budget_committed_cents == 5000, data.incentive_budget_reserved_cents == 4000, data.quota_cell_count == 3 (the rejected cell was never created) and data.under_target_cell_count == 3"

