scaffold_corner_design:
- section: entities
  instances:
  - name: seller_create_returns_all_declared_fields_pending_approval
    claim_type: Creation
    grounds:
    - entities.Seller
    - endpoints.POST_/gse/sellers
    distinguishing_aspect: A seller created with the four required inputs returns 201 with status PENDING_APPROVAL, approval_cycle 1, probation_relief_enabled false, version 1 and server-generated id/created_at/updated_at.
    test_recipe:
      setup:
      - Clock 2026-09-01. Empty database.
      setup_api_calls:
      - &id001
        call: POST /gse/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: GseAdmin
      trigger:
      - call: POST /gse/sellers
        payload:
          legal_name: Meridian Lending
          seller_number: S-1001
          net_worth_cents: 500000000
          qc_defect_rate_bps: 100
        as: GseAdmin
        captures:
          s1: $.data.id
      assert:
      - response status is 201 and response_type is object
      - Seller.${s1}.status == PENDING_APPROVAL and approval_cycle == 1 and probation_relief_enabled == false
      - Seller.${s1}.net_worth_cents == 500000000 and qc_defect_rate_bps == 100
      - Seller.${s1}.version == 1 and id, created_at, updated_at are present
      - meta.api_request_id and meta.api_request_timestamp are present
  - name: loan_create_computes_ltv_and_ignores_client_status
    claim_type: Computed Fields
    grounds:
    - entities.Loan.fields.ltv_bp
    - calculations.ltv_calculation
    distinguishing_aspect: 'ltv_bp is server-computed at creation: UPB 333,333,300 on a 400,000,000 appraisal yields ltv_bp 8333 via round_half_up (8333.3325 -> 8333), and au_status starts NOT_SUBMITTED
      regardless of any client hint.'
    test_recipe:
      setup:
      - Clock 2026-09-01. Seller S and servicer V approved, agreement ACTIVE, grid M active.
      setup_api_calls: &id009
      - *id001
      - &id002
        call: POST /gse/sellers
        payload:
          legal_name: Meridian Lending
          seller_number: S-1001
          net_worth_cents: 500000000
          qc_defect_rate_bps: 100
        as: GseAdmin
        captures:
          s1: $.data.id
      - &id003
        call: POST /gse/servicers
        payload:
          legal_name: Atlas Servicing
          servicer_number: V-2001
          net_worth_cents: 300000000
          qc_rating: SATISFACTORY
        as: GseAdmin
        captures:
          v1: $.data.id
      - &id004
        call: POST /gse/sellers/${s1}/approve
        payload: {}
        as: GseAdmin
      - &id005
        call: POST /gse/servicers/${v1}/approve
        payload: {}
        as: GseAdmin
      - &id006
        call: POST /gse/master-agreements
        payload:
          seller_id: ${s1}
          servicer_id: ${v1}
          effective_date: '2026-01-01T00:00:00Z'
          expiration_date: '2028-01-01T00:00:00Z'
        as: GseAdmin
        captures:
          a1: $.data.id
      - &id007
        call: POST /gse/master-agreements/${a1}/activate
        payload: {}
        as: GseAdmin
      - &id008
        call: POST /gse/llpa-matrices
        payload:
          effective_from: '2026-01-01T00:00:00Z'
          effective_until: '2027-01-01T00:00:00Z'
          rows:
          - occupancy: PRIMARY_RESIDENCE
            product_type: FIXED_30
            llpa_bps: 100
            ltv_min_bp: 0
            ltv_max_bp: 9500
            credit_min: 620
            credit_max: 850
        as: GseAdmin
        captures:
          m1: $.data.id
      trigger:
      - call: POST /gse/loans
        payload:
          seller_id: ${s1}
          servicer_id: ${v1}
          agreement_id: ${a1}
          loan_number: LN-LTV
          borrower_name: Lt Vee
          unpaid_principal_balance_cents: 333333300
          appraised_value_cents: 400000000
          credit_score: 700
          occupancy: SECOND_HOME
          product_type: ARM_5_1
        as: SellerOfficer
        as_user_id: ${s1}
        captures:
          ll: $.data.id
      assert:
      - Loan.${ll}.ltv_bp == 8333
      - Loan.${ll}.status == DRAFT and au_status == NOT_SUBMITTED and relief_tier == NONE
      - Loan.${ll}.consecutive_on_time_payments == 0 and independent_validation_complete == false
      - Loan.${ll}.pool_id is null
  - name: loan_get_unknown_id_returns_not_found
    claim_type: Not Found
    grounds:
    - endpoints.GET_/gse/loans/{loanId}
    - errors[ERR_NOT_FOUND]
    distinguishing_aspect: GET on a well-formed but unknown loan id returns 404 ERR_NOT_FOUND.
    test_recipe:
      setup:
      - Clock 2026-09-01. Empty database.
      setup_api_calls:
      - *id001
      trigger:
      - call: GET /gse/loans/00000000-0000-4000-8000-000000000000
        payload: {}
        as: GseAdmin
        captures:
          e: $.data.error_id
      assert:
      - e == ERR_NOT_FOUND and the http status is 404
  - name: loans_list_paginates_with_total_count_and_has_more
    claim_type: Listing
    grounds:
    - endpoints.GET_/gse/loans
    - response_envelope.pagination_fields
    - response_envelope.pagination_defaults
    distinguishing_aspect: With three loans on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns the last row with has_more false.
    test_recipe:
      setup:
      - Clock 2026-09-01. Seller S, servicer V, agreement ACTIVE, grid M; three DRAFT loans.
      setup_api_calls:
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      - call: POST /gse/loans
        payload:
          seller_id: ${s1}
          servicer_id: ${v1}
          agreement_id: ${a1}
          loan_number: LN-PG1
          borrower_name: Pg One
          unpaid_principal_balance_cents: 400000000
          appraised_value_cents: 500000000
          credit_score: 740
          occupancy: PRIMARY_RESIDENCE
          product_type: FIXED_30
        as: SellerOfficer
        as_user_id: ${s1}
        captures:
          pg1: $.data.id
      - call: POST /gse/loans
        payload:
          seller_id: ${s1}
          servicer_id: ${v1}
          agreement_id: ${a1}
          loan_number: LN-PG2
          borrower_name: Pg Two
          unpaid_principal_balance_cents: 400000000
          appraised_value_cents: 500000000
          credit_score: 740
          occupancy: PRIMARY_RESIDENCE
          product_type: FIXED_30
        as: SellerOfficer
        as_user_id: ${s1}
        captures:
          pg2: $.data.id
      - call: POST /gse/loans
        payload:
          seller_id: ${s1}
          servicer_id: ${v1}
          agreement_id: ${a1}
          loan_number: LN-PG3
          borrower_name: Pg Three
          unpaid_principal_balance_cents: 400000000
          appraised_value_cents: 500000000
          credit_score: 740
          occupancy: PRIMARY_RESIDENCE
          product_type: FIXED_30
        as: SellerOfficer
        as_user_id: ${s1}
        captures:
          pg3: $.data.id
      trigger:
      - call: GET /gse/loans
        payload:
          seller_id: ${s1}
          limit: 2
          offset: 0
        as: GseAdmin
      - call: GET /gse/loans
        payload:
          seller_id: ${s1}
          limit: 2
          offset: 2
        as: GseAdmin
      assert:
      - first page returns exactly 2 loans with total_count == 3 and has_more == true
      - second page returns exactly 1 loan with total_count == 3 and has_more == false
  - name: payment_event_create_omitting_nothing_uses_no_defaults
    claim_type: Defaults
    grounds:
    - entities.SubservicerOversight.fields.findings_count
    - endpoints.POST_/gse/subservicer-oversight
    distinguishing_aspect: Omitting findings_count on oversight creation applies the declared default 0.
    test_recipe:
      setup:
      - Clock 2026-09-01. Two servicers V1 and V2 approved.
      setup_api_calls:
      - *id001
      - *id003
      - *id005
      - call: POST /gse/servicers
        payload:
          legal_name: Sub Servicing
          servicer_number: V-2002
          net_worth_cents: 300000000
          qc_rating: SATISFACTORY
        as: GseAdmin
        captures:
          v2: $.data.id
      - call: POST /gse/servicers/${v2}/approve
        payload: {}
        as: GseAdmin
      trigger:
      - call: POST /gse/subservicer-oversight
        payload:
          servicer_id: ${v1}
          subservicer_id: ${v2}
          oversight_period_start: '2026-06-01T00:00:00Z'
          oversight_period_end: '2026-09-01T00:00:00Z'
        as: GseAdmin
        captures:
          ov: $.data.id
      assert:
      - SubservicerOversight.${ov}.findings_count == 0 (default applied)
      - SubservicerOversight.${ov}.status == OPEN
  - name: seller_number_uniqueness_enforced
    claim_type: Type Constraints
    grounds:
    - entities.Seller.fields.seller_number
    - errors[ERR_DUPLICATE_IDENTIFIER]
    distinguishing_aspect: A second seller with an already-used seller_number is rejected with ERR_DUPLICATE_IDENTIFIER.
    test_recipe:
      setup:
      - Clock 2026-09-01. Seller S-1001 exists.
      setup_api_calls:
      - *id001
      - *id002
      trigger:
      - call: POST /gse/sellers
        payload:
          legal_name: Copycat Lending
          seller_number: S-1001
          net_worth_cents: 500000000
          qc_defect_rate_bps: 100
        as: GseAdmin
        captures:
          e: $.data.error_id
      assert:
      - e == ERR_DUPLICATE_IDENTIFIER (http 409)
  - name: loan_create_with_invalid_occupancy_enum_rejected
    claim_type: Type Constraints
    grounds:
    - entities.Loan.fields.occupancy
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: An occupancy value outside the enum (e.g. RENTAL) is rejected with ERR_INVALID_REQUEST before any state is persisted.
    test_recipe:
      setup:
      - Clock 2026-09-01. Seller S, servicer V, agreement ACTIVE, grid M.
      setup_api_calls: *id009
      trigger:
      - call: POST /gse/loans
        payload:
          seller_id: ${s1}
          servicer_id: ${v1}
          agreement_id: ${a1}
          loan_number: LN-BAD
          borrower_name: Bad Enum
          unpaid_principal_balance_cents: 400000000
          appraised_value_cents: 500000000
          credit_score: 740
          occupancy: RENTAL
          product_type: FIXED_30
        as: SellerOfficer
        as_user_id: ${s1}
        captures:
          e: $.data.error_id
      assert:
      - e == ERR_INVALID_REQUEST (http 400)
      - GET /gse/loans afterwards shows no loan with loan_number LN-BAD
  - name: loan_create_missing_required_field_rejected
    claim_type: Required Fields
    grounds:
    - entities.Loan.fields.credit_score
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: Omitting credit_score (a required input with no default) fails with ERR_INVALID_REQUEST.
    test_recipe:
      setup:
      - Clock 2026-09-01. Seller S, servicer V, agreement ACTIVE, grid M.
      setup_api_calls: *id009
      trigger:
      - call: POST /gse/loans
        payload:
          seller_id: ${s1}
          servicer_id: ${v1}
          agreement_id: ${a1}
          loan_number: LN-MISS
          borrower_name: Missing Field
          unpaid_principal_balance_cents: 400000000
          appraised_value_cents: 500000000
          occupancy: PRIMARY_RESIDENCE
          product_type: FIXED_30
        as: SellerOfficer
        as_user_id: ${s1}
        captures:
          e: $.data.error_id
      assert:
      - e == ERR_INVALID_REQUEST (http 400)
  - name: fk_integrity_loan_with_unknown_seller_rejected
    claim_type: Parent Relationships
    grounds:
    - entities.Loan.fields.seller_id
    - errors[ERR_NOT_FOUND]
    distinguishing_aspect: Creating a loan whose seller_id does not exist fails with ERR_NOT_FOUND; the FK is validated, not stored blindly.
    test_recipe:
      setup:
      - Clock 2026-09-01. Servicer V approved, agreement exists for real seller S.
      setup_api_calls: *id009
      trigger:
      - call: POST /gse/loans
        payload:
          seller_id: 00000000-0000-4000-8000-000000000000
          servicer_id: ${v1}
          agreement_id: ${a1}
          loan_number: LN-ORPHAN
          borrower_name: Or Phan
          unpaid_principal_balance_cents: 400000000
          appraised_value_cents: 500000000
          credit_score: 740
          occupancy: PRIMARY_RESIDENCE
          product_type: FIXED_30
        as: SellerOfficer
        as_user_id: ${s1}
        captures:
          e: $.data.error_id
      assert:
      - e == ERR_NOT_FOUND (http 404)
- section: state_machines
  instances:
  - name: seller_suspend_and_reapprove_sets_probation_flag
    claim_type: Valid Transition
    grounds:
    - state_machines.Seller.SUSPENDED_to_APPROVED
    - entities.Seller.fields.probation_relief_enabled
    distinguishing_aspect: Re-approving a SUSPENDED seller increments approval_cycle to 2 and flips probation_relief_enabled to true, capping relief at PAYMENT_HISTORY_36.
    test_recipe:
      setup:
      - Clock 2026-09-01. Seller S APPROVED then SUSPENDED.
      setup_api_calls:
      - *id001
      - *id002
      - *id004
      - call: POST /gse/sellers/${s1}/suspend
        payload: {}
        as: GseAdmin
      trigger:
      - call: POST /gse/sellers/${s1}/approve
        payload: {}
        as: GseAdmin
        captures:
          s_after: $.data.approval_cycle
      assert:
      - Seller.${s1}.status == APPROVED
      - s_after == 2
      - Seller.${s1}.probation_relief_enabled == true
  - name: seller_terminate_blocked_by_delivered_loan
    claim_type: Precondition Enforcement
    grounds:
    - state_machines.Seller.APPROVED_to_TERMINATED
    - errors[ERR_SELLER_HAS_ACTIVE_LOANS]
    distinguishing_aspect: A seller with a loan in DELIVERED status cannot be terminated; ERR_SELLER_HAS_ACTIVE_LOANS is returned and the seller stays APPROVED.
    test_recipe:
      setup:
      - Clock 2026-09-01. Seller S approved; loan PURCHASED-path loan delivered into PL-1 (DELIVERED, pool not issued).
      setup_api_calls:
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      - &id010
        call: POST /gse/pools
        payload:
          seller_id: ${s1}
          agreement_id: ${a1}
          pool_number: PL-1
          issue_date: '2026-10-01T00:00:00Z'
          target_balance_cents: 500000000
        as: SellerOfficer
        as_user_id: ${s1}
        captures:
          pl1: $.data.id
      - call: POST /gse/loans
        payload:
          seller_id: ${s1}
          servicer_id: ${v1}
          agreement_id: ${a1}
          loan_number: LN-TERM
          borrower_name: Term Block
          unpaid_principal_balance_cents: 400000000
          appraised_value_cents: 500000000
          credit_score: 740
          occupancy: PRIMARY_RESIDENCE
          product_type: FIXED_30
        as: SellerOfficer
        as_user_id: ${s1}
        captures:
          lt: $.data.id
      - call: POST /gse/underwriting-cases
        payload:
          loan_id: ${lt}
        as: SellerOfficer
        as_user_id: ${s1}
        captures:
          ct: $.data.id
      - call: POST /gse/underwriting-cases/${ct}/reports
        payload:
          service_type: INCOME
          provider_reference: PR-TERM-INCOME
        as: Underwriter
        captures:
          ct_income: $.data.id
      - call: POST /gse/validation-reports/${ct_income}/complete
        payload:
          result: VALIDATED
        as: Underwriter
      - call: POST /gse/underwriting-cases/${ct}/reports
        payload:
          service_type: ASSET
          provider_reference: PR-TERM-ASSET
        as: Underwriter
        captures:
          ct_asset: $.data.id
      - call: POST /gse/validation-reports/${ct_asset}/complete
        payload:
          result: VALIDATED
        as: Underwriter
      - call: POST /gse/underwriting-cases/${ct}/reports
        payload:
          service_type: EMPLOYMENT
          provider_reference: PR-TERM-EMPLOYMENT
        as: Underwriter
        captures:
          ct_employment: $.data.id
      - call: POST /gse/validation-reports/${ct_employment}/complete
        payload:
          result: VALIDATED
        as: Underwriter
      - call: GET /gse/underwriting-cases/${ct}
        payload: {}
        as: GseAdmin
        captures:
          ct_v: $.data.version
      - call: POST /gse/underwriting-cases/${ct}/finalize
        payload:
          expected_case_version: ${ct_v}
        as: GseUnderwritingEngine
      - call: POST /gse/loans/${lt}/deliver
        payload:
          pool_id: ${pl1}
        as: SellerOfficer
        as_user_id: ${s1}
      trigger:
      - call: POST /gse/sellers/${s1}/terminate
        payload: {}
        as: GseAdmin
        captures:
          e: $.data.error_id
      assert:
      - e == ERR_SELLER_HAS_ACTIVE_LOANS (http 409)
      - Seller.${s1}.status == APPROVED (no mutation)
  - name: agreement_expires_automatically_when_clock_passes_expiration
    claim_type: Valid Transition
    grounds:
    - state_machines.MasterAgreement.ACTIVE_to_EXPIRED
    distinguishing_aspect: Advancing the logical clock past expiration_date auto-transitions the ACTIVE agreement to EXPIRED with no explicit call against it.
    test_recipe:
      setup:
      - Clock 2026-09-01. Seller S and servicer V approved; agreement ACTIVE expiring 2026-12-31.
      setup_api_calls:
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - call: POST /gse/master-agreements
        payload:
          seller_id: ${s1}
          servicer_id: ${v1}
          effective_date: '2026-01-01T00:00:00Z'
          expiration_date: '2026-12-31T00:00:00Z'
        as: GseAdmin
        captures:
          ax: $.data.id
      - call: POST /gse/master-agreements/${ax}/activate
        payload: {}
        as: GseAdmin
      trigger:
      - call: POST /gse/_clock/set_current_utc
        payload:
          current_utc: '2027-01-01T00:00:00Z'
        as: GseAdmin
      - call: GET /gse/master-agreements/${ax}
        payload: {}
        as: GseAdmin
        captures:
          st: $.data.status
      assert:
      - st == EXPIRED after the clock crossed expiration_date
  - name: deliver_draft_loan_returns_invalid_state
    claim_type: Invalid Transitions
    grounds:
    - state_machines.Loan
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: Deliver is only valid from UNDERWRITTEN; calling it on a DRAFT loan returns ERR_INVALID_STATE and changes nothing.
    test_recipe:
      setup:
      - Clock 2026-09-01. Seller S, servicer V, agreement, grid, pool PL-1 OPEN; loan LD left in DRAFT (never underwritten).
      setup_api_calls:
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      - *id010
      - call: POST /gse/loans
        payload:
          seller_id: ${s1}
          servicer_id: ${v1}
          agreement_id: ${a1}
          loan_number: LN-DELIV-DRAFT
          borrower_name: Draft Del
          unpaid_principal_balance_cents: 400000000
          appraised_value_cents: 500000000
          credit_score: 740
          occupancy: PRIMARY_RESIDENCE
          product_type: FIXED_30
        as: SellerOfficer
        as_user_id: ${s1}
        captures:
          ld: $.data.id
      trigger:
      - call: POST /gse/loans/${ld}/deliver
        payload:
          pool_id: ${pl1}
        as: SellerOfficer
        as_user_id: ${s1}
        captures:
          e: $.data.error_id
      assert:
      - e == ERR_INVALID_STATE (http 409)
      - Loan.${ld}.status == DRAFT and Pool.${pl1}.current_balance_cents == 0
  - name: pool_unlock_lock_cycle_and_issue_from_open_rejected
    claim_type: Invalid Transitions
    grounds:
    - state_machines.Pool
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: Issue requires LOCKED; issuing an OPEN pool fails with ERR_INVALID_STATE, while the LOCKED -> OPEN unlock revert is legal and re-locking works.
    test_recipe:
      setup:
      - Clock 2026-09-01. Full chain; loan LP delivered into PL-1; pool still OPEN.
      setup_api_calls:
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      - *id010
      - call: POST /gse/loans
        payload:
          seller_id: ${s1}
          servicer_id: ${v1}
          agreement_id: ${a1}
          loan_number: LN-PGATE
          borrower_name: Pool Gate
          unpaid_principal_balance_cents: 400000000
          appraised_value_cents: 500000000
          credit_score: 740
          occupancy: PRIMARY_RESIDENCE
          product_type: FIXED_30
        as: SellerOfficer
        as_user_id: ${s1}
        captures:
          lp: $.data.id
      - call: POST /gse/underwriting-cases
        payload:
          loan_id: ${lp}
        as: SellerOfficer
        as_user_id: ${s1}
        captures:
          cp: $.data.id
      - call: POST /gse/underwriting-cases/${cp}/reports
        payload:
          service_type: INCOME
          provider_reference: PR-PGATE-INCOME
        as: Underwriter
        captures:
          cp_income: $.data.id
      - call: POST /gse/validation-reports/${cp_income}/complete
        payload:
          result: VALIDATED
        as: Underwriter
      - call: POST /gse/underwriting-cases/${cp}/reports
        payload:
          service_type: ASSET
          provider_reference: PR-PGATE-ASSET
        as: Underwriter
        captures:
          cp_asset: $.data.id
      - call: POST /gse/validation-reports/${cp_asset}/complete
        payload:
          result: VALIDATED
        as: Underwriter
      - call: POST /gse/underwriting-cases/${cp}/reports
        payload:
          service_type: EMPLOYMENT
          provider_reference: PR-PGATE-EMPLOYMENT
        as: Underwriter
        captures:
          cp_employment: $.data.id
      - call: POST /gse/validation-reports/${cp_employment}/complete
        payload:
          result: VALIDATED
        as: Underwriter
      - call: GET /gse/underwriting-cases/${cp}
        payload: {}
        as: GseAdmin
        captures:
          cp_v: $.data.version
      - call: POST /gse/underwriting-cases/${cp}/finalize
        payload:
          expected_case_version: ${cp_v}
        as: GseUnderwritingEngine
      - call: POST /gse/loans/${lp}/deliver
        payload:
          pool_id: ${pl1}
        as: SellerOfficer
        as_user_id: ${s1}
      - &id011
        call: GET /gse/pools/${pl1}
        payload: {}
        as: GseAdmin
        captures:
          pl1_v: $.data.version
      trigger:
      - call: POST /gse/pools/${pl1}/issue
        payload:
          expected_pool_version: ${pl1_v}
        as: SellerOfficer
        as_user_id: ${s1}
        captures:
          e: $.data.error_id
      - call: POST /gse/pools/${pl1}/lock
        payload: {}
        as: SellerOfficer
        as_user_id: ${s1}
