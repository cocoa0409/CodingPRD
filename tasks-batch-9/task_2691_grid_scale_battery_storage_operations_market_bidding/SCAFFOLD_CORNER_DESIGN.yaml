            - "execute from PENDING: HTTP 409 with ${e_exec} == \"ERR_DISPATCH_NOT_ACCEPTED\""
            - "settle-score from PENDING: HTTP 409 with ${e_settle} == \"ERR_DISPATCH_NOT_COMPLETED\" - the execution_status guard is evaluated before the scoring_status guard, so ERR_SCORE_NOT_PROVISIONAL is NOT the answer even though scoring_status is NOT_SCORED"
