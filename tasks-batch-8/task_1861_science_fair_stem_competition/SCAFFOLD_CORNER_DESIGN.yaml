scaffold_corner_design:
  # ===========================================================================
  # Section: entities — creation / retrieval / not-found / required / defaults /
  # computed / system / type / immutability
  # ===========================================================================
  - section: entities
    instances:
      - name: fair_edition_creation_defaults_and_system_fields
        claim_type: creation
        grounds: [entities.FairEdition]
        distinguishing_aspect: "POST /science-fair/fair-editions with the four required inputs returns 201; status defaults to SETUP, advancement_freeze to false, and id/created_at/updated_at/version are system-stamped (client-supplied values ignored)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /science-fair/fair-editions"
              payload: { name: "Defaults Edition", normalization_algorithm: "MIN_MAX", max_judges_per_project: 2, min_quorum_ratio_pct: 50 }
              as: FairDirector
              captures: { ed: $.data.id, ed_status: $.data.status, ed_freeze: $.data.advancement_freeze, ed_v: $.data.version }
          assert:
            - "FairEdition.${ed}.status == SETUP"
            - "FairEdition.${ed}.advancement_freeze == false"
            - "FairEdition.${ed}.version == 1"
      - name: fair_edition_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.FairEdition", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting normalization_algorithm (required, no default) yields ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /science-fair/fair-editions"
              payload: { name: "Bad", max_judges_per_project: 2, min_quorum_ratio_pct: 50 }
              as: FairDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "http status == 400"
      - name: fair_edition_invalid_enum_normalization_rejected
        claim_type: type_constraints
        grounds: ["entities.FairEdition.fields.normalization_algorithm", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "normalization_algorithm outside {Z_SCORE, MIN_MAX} is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /science-fair/fair-editions"
              payload: { name: "BadEnum", normalization_algorithm: "RANK_SUM", max_judges_per_project: 2, min_quorum_ratio_pct: 50 }
              as: FairDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
      - name: project_get_not_found_returns_404
        claim_type: not_found
        grounds: ["entities.Project", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /science-fair/projects/{random-uuid} returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /science-fair/projects/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: FairDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"
            - "http status == 404"
      - name: mentor_recognition_tier_computed_default_none
        claim_type: computed_fields
        grounds: [entities.Mentor.fields.recognition_points, entities.Mentor.fields.recognition_tier, calculations.mentor_recognition]
        distinguishing_aspect: "A freshly created mentor has recognition_points 0 and recognition_tier NONE; client-supplied recognition_points is ignored (computed field)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /science-fair/mentors"
              payload: { full_name: "New Mentor", email: "nm@x.com" }
              as: FairDirector
              captures: { m: $.data.id }
          assert:
            - "Mentor.${m}.recognition_points == 0"
            - "Mentor.${m}.recognition_tier == NONE"
      - name: judge_conflict_immutable_no_version_field
        claim_type: immutability
        grounds: [entities.JudgeConflict]
        distinguishing_aspect: "JudgeConflict has common_fields: false — responses expose id and created_at but no version/updated_at; there is no update endpoint."
        test_recipe:
          setup:
            - "Edition with ACTIVE judge J and CONFIRMED project P"
          setup_api_calls:
            - call: "POST /science-fair/fair-editions"
              payload: { name: "Imm Edition", normalization_algorithm: "Z_SCORE", max_judges_per_project: 2, min_quorum_ratio_pct: 50 }
              as: FairDirector
              captures: { ed: $.data.id }
            - call: "POST /science-fair/categories"
              payload: { fair_edition_id: "${ed}", code: "PHYS", name: "Physics", grade_band: "SENIOR", advancement_slots: 1 }
              as: FairDirector
              captures: { cat: $.data.id }
            - call: "POST /science-fair/mentors"
              payload: { full_name: "Mentor Im", email: "mim@x.com" }
              as: FairDirector
              captures: { men: $.data.id }
            - call: "POST /science-fair/fair-editions/${ed}/open-registration"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/projects"
              payload: { fair_edition_id: "${ed}", category_id: "${cat}", title: "PI", team_size: 1, involves_human_subjects: false, involves_animal_subjects: false }
              as: Mentor
              as_user_id: "${men}"
              captures: { p: $.data.id }
            - call: "POST /science-fair/judges"
              payload: { fair_edition_id: "${ed}", full_name: "JI", max_assignments: 3 }
              as: FairDirector
              captures: { j: $.data.id }
          trigger:
            - call: "POST /science-fair/judges/${j}/conflicts"
              payload: { project_id: "${p}", reason: "same school" }
              as: FairDirector
              captures: { jc: $.data.id }
          assert:
            - "JudgeConflict.${jc} response has no `version` field"
            - "JudgeConflict.${jc} response has no `updated_at` field"
            - "JudgeConflict.${jc}.reason == 'same school'"
      - name: list_projects_pagination_envelope
        claim_type: listing
        grounds: [entities.Project, response_envelope]
        distinguishing_aspect: "GET /science-fair/projects returns the §1.0 envelope: meta.api_request_id present, response_type == 'array', data is a list, and pagination fields limit/offset/total_count/has_more are present with default limit 10."
        test_recipe:
          setup:
            - "One edition with one category; registration open"
          setup_api_calls:
            - call: "POST /science-fair/fair-editions"
              payload: { name: "Pag Edition", normalization_algorithm: "Z_SCORE", max_judges_per_project: 2, min_quorum_ratio_pct: 50 }
              as: FairDirector
              captures: { ed: $.data.id }
            - call: "POST /science-fair/categories"
              payload: { fair_edition_id: "${ed}", code: "PHYS", name: "Physics", grade_band: "SENIOR", advancement_slots: 1 }
              as: FairDirector
              captures: { cat: $.data.id }
            - call: "POST /science-fair/mentors"
              payload: { full_name: "Mentor Pag", email: "mpag@x.com" }
              as: FairDirector
              captures: { men: $.data.id }
            - call: "POST /science-fair/fair-editions/${ed}/open-registration"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/projects"
              payload: { fair_edition_id: "${ed}", category_id: "${cat}", title: "T1", team_size: 1, involves_human_subjects: false, involves_animal_subjects: false }
              as: Mentor
              as_user_id: "${men}"
          trigger:
            - call: "GET /science-fair/projects"
              payload: {}
              as: FairDirector
          assert:
            - "response envelope: response_type == 'array'"
            - "pagination fields limit, offset, total_count, has_more present"
            - "total_count == 1"
            - "default limit applied == 10"

  # ===========================================================================
  # Section: state_machines — valid/invalid transitions, preconditions,
  # side effects, initial state, terminal lockdown, idempotency
  # ===========================================================================
  - section: state_machines
    instances:
      - name: open_registration_requires_open_category
        claim_type: precondition_enforcement
        grounds: ["state_machines.FairEdition.SETUP_to_REGISTRATION_OPEN", "errors[ERR_NO_OPEN_CATEGORY]"]
        distinguishing_aspect: "open-registration on an edition with zero categories fails with ERR_NO_OPEN_CATEGORY; adding a category then opening succeeds."
        test_recipe:
          setup: ["Edition in SETUP with no categories"]
          setup_api_calls:
            - call: "POST /science-fair/fair-editions"
              payload: { name: "NoCat Edition", normalization_algorithm: "Z_SCORE", max_judges_per_project: 2, min_quorum_ratio_pct: 50 }
              as: FairDirector
              captures: { ed: $.data.id }
          trigger:
            - call: "POST /science-fair/fair-editions/${ed}/open-registration"
              payload: {}
              as: FairDirector
              captures: { err: $.data.error_id }
            - call: "POST /science-fair/categories"
              payload: { fair_edition_id: "${ed}", code: "PHYS", name: "Physics", grade_band: "SENIOR", advancement_slots: 1 }
              as: FairDirector
            - call: "POST /science-fair/fair-editions/${ed}/open-registration"
              payload: {}
              as: FairDirector
          assert:
            - "first open-registration fails with ERR_NO_OPEN_CATEGORY"
            - "after creating a category, open-registration succeeds and FairEdition.${ed}.status == REGISTRATION_OPEN"
      - name: invalid_transition_submit_confirmed_project
        claim_type: invalid_transition
        grounds: ["state_machines.Project", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST submit on a project already CONFIRMED (past SUBMITTED) is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Edition REGISTRATION_CLOSED with project P already CONFIRMED"
          setup_api_calls:
            - call: "POST /science-fair/fair-editions"
              payload: { name: "IT Edition", normalization_algorithm: "Z_SCORE", max_judges_per_project: 2, min_quorum_ratio_pct: 50 }
              as: FairDirector
              captures: { ed: $.data.id }
            - call: "POST /science-fair/categories"
              payload: { fair_edition_id: "${ed}", code: "PHYS", name: "Physics", grade_band: "SENIOR", advancement_slots: 1 }
              as: FairDirector
              captures: { cat: $.data.id }
            - call: "POST /science-fair/mentors"
              payload: { full_name: "Mentor IT", email: "mit@x.com" }
              as: FairDirector
              captures: { men: $.data.id }
            - call: "POST /science-fair/fair-editions/${ed}/open-registration"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/projects"
              payload: { fair_edition_id: "${ed}", category_id: "${cat}", title: "ITP", team_size: 1, involves_human_subjects: false, involves_animal_subjects: false }
              as: Mentor
              as_user_id: "${men}"
              captures: { p: $.data.id }
            - call: "POST /science-fair/projects/${p}/submit"
              payload: {}
              as: Mentor
              as_user_id: "${men}"
            - call: "POST /science-fair/fair-editions/${ed}/close-registration"
              payload: {}
              as: FairDirector
          trigger:
            - call: "POST /science-fair/projects/${p}/submit"
              payload: {}
              as: Mentor
              as_user_id: "${men}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "http status == 409"
      - name: terminal_lockdown_withdrawn_project
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Project", "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "A WITHDRAWN project rejects further transitions (submit / withdraw) with ERR_ALREADY_TERMINAL."
        test_recipe:
          setup:
            - "Edition REGISTRATION_OPEN; project P withdrawn from DRAFT"
          setup_api_calls:
            - call: "POST /science-fair/fair-editions"
              payload: { name: "Term Edition", normalization_algorithm: "Z_SCORE", max_judges_per_project: 2, min_quorum_ratio_pct: 50 }
              as: FairDirector
              captures: { ed: $.data.id }
            - call: "POST /science-fair/categories"
              payload: { fair_edition_id: "${ed}", code: "PHYS", name: "Physics", grade_band: "SENIOR", advancement_slots: 1 }
              as: FairDirector
              captures: { cat: $.data.id }
            - call: "POST /science-fair/mentors"
              payload: { full_name: "Mentor T", email: "mt@x.com" }
              as: FairDirector
              captures: { men: $.data.id }
            - call: "POST /science-fair/fair-editions/${ed}/open-registration"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/projects"
              payload: { fair_edition_id: "${ed}", category_id: "${cat}", title: "TP", team_size: 1, involves_human_subjects: false, involves_animal_subjects: false }
              as: Mentor
              as_user_id: "${men}"
              captures: { p: $.data.id }
            - call: "POST /science-fair/projects/${p}/withdraw"
              payload: {}
              as: Mentor
              as_user_id: "${men}"
          trigger:
            - call: "POST /science-fair/projects/${p}/submit"
              payload: {}
              as: Mentor
              as_user_id: "${men}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ALREADY_TERMINAL"
            - "http status == 409"
      - name: initial_state_new_project_is_draft
        claim_type: initial_state
        grounds: [state_machines.Project]
        distinguishing_aspect: "A newly created project starts in registration_status=DRAFT, ethics_status unset (null-equivalent), inspection_status=NOT_SCHEDULED, judging_status=UNASSIGNED, advancement_result=PENDING."
        test_recipe:
          setup: ["Edition REGISTRATION_OPEN with category and mentor"]
          setup_api_calls:
            - call: "POST /science-fair/fair-editions"
              payload: { name: "Init Edition", normalization_algorithm: "Z_SCORE", max_judges_per_project: 2, min_quorum_ratio_pct: 50 }
              as: FairDirector
              captures: { ed: $.data.id }
            - call: "POST /science-fair/categories"
              payload: { fair_edition_id: "${ed}", code: "PHYS", name: "Physics", grade_band: "SENIOR", advancement_slots: 1 }
              as: FairDirector
              captures: { cat: $.data.id }
            - call: "POST /science-fair/mentors"
              payload: { full_name: "Mentor In", email: "min@x.com" }
              as: FairDirector
              captures: { men: $.data.id }
            - call: "POST /science-fair/fair-editions/${ed}/open-registration"
              payload: {}
              as: FairDirector
          trigger:
            - call: "POST /science-fair/projects"
              payload: { fair_edition_id: "${ed}", category_id: "${cat}", title: "NewP", team_size: 1, involves_human_subjects: false, involves_animal_subjects: false }
              as: Mentor
              as_user_id: "${men}"
              captures: { p: $.data.id }
          assert:
            - "Project.${p}.registration_status == DRAFT"
            - "Project.${p}.ethics_status == null (unset until submit)"
            - "Project.${p}.inspection_status == NOT_SCHEDULED"
            - "Project.${p}.judging_status == UNASSIGNED"
            - "Project.${p}.advancement_result == PENDING"
      - name: close_registration_withdraws_draft_side_effect
        claim_type: side_effect_execution
        grounds: [state_machines.FairEdition.REGISTRATION_OPEN_to_REGISTRATION_CLOSED]
        distinguishing_aspect: "The close-registration cascade: DRAFT projects become WITHDRAWN while SUBMITTED non-ethics projects become CONFIRMED — both side effects verified in one transition."
        test_recipe:
          setup:
            - "Edition REGISTRATION_OPEN; PD in DRAFT, PS SUBMITTED (no subjects)"
          setup_api_calls:
            - call: "POST /science-fair/fair-editions"
              payload: { name: "Close Edition", normalization_algorithm: "Z_SCORE", max_judges_per_project: 2, min_quorum_ratio_pct: 50 }
              as: FairDirector
              captures: { ed: $.data.id }
            - call: "POST /science-fair/categories"
              payload: { fair_edition_id: "${ed}", code: "PHYS", name: "Physics", grade_band: "SENIOR", advancement_slots: 1 }
              as: FairDirector
              captures: { cat: $.data.id }
            - call: "POST /science-fair/mentors"
              payload: { full_name: "Mentor Cl", email: "mcl@x.com" }
              as: FairDirector
              captures: { men: $.data.id }
            - call: "POST /science-fair/fair-editions/${ed}/open-registration"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/projects"
              payload: { fair_edition_id: "${ed}", category_id: "${cat}", title: "PD", team_size: 1, involves_human_subjects: false, involves_animal_subjects: false }
              as: Mentor
              as_user_id: "${men}"
              captures: { pd: $.data.id }
            - call: "POST /science-fair/projects"
              payload: { fair_edition_id: "${ed}", category_id: "${cat}", title: "PS", team_size: 1, involves_human_subjects: false, involves_animal_subjects: false }
              as: Mentor
              as_user_id: "${men}"
              captures: { ps: $.data.id }
            - call: "POST /science-fair/projects/${ps}/submit"
              payload: {}
              as: Mentor
              as_user_id: "${men}"
          trigger:
            - call: "POST /science-fair/fair-editions/${ed}/close-registration"
              payload: {}
              as: FairDirector
          assert:
            - "Project.${pd}.registration_status == WITHDRAWN"
            - "Project.${ps}.registration_status == CONFIRMED"
            - "Project.${ps}.ethics_status == NOT_REQUIRED"
      - name: publish_advancement_requires_all_judged
        claim_type: precondition_enforcement
        grounds: ["state_machines.FairEdition.JUDGING_to_ADVANCEMENT_PUBLISHED", "errors[ERR_UNJUDGED_PROJECTS]"]
        distinguishing_aspect: "publish-advancement with a CONFIRMED project still judging_status=ASSIGNED (quorum not met) fails with ERR_UNJUDGED_PROJECTS."
        test_recipe:
          setup:
            - "Edition in JUDGING; project P CONFIRMED+PASSED with 1 of 2 required sheets submitted (judging_status still ASSIGNED)"
          setup_api_calls:
            - call: "POST /science-fair/fair-editions"
              payload: { name: "UJ Edition", normalization_algorithm: "Z_SCORE", max_judges_per_project: 2, min_quorum_ratio_pct: 50 }
              as: FairDirector
              captures: { ed: $.data.id }
            - call: "POST /science-fair/categories"
              payload: { fair_edition_id: "${ed}", code: "PHYS", name: "Physics", grade_band: "SENIOR", advancement_slots: 1 }
              as: FairDirector
              captures: { cat: $.data.id }
            - call: "POST /science-fair/mentors"
              payload: { full_name: "Mentor UJ", email: "muj@x.com" }
              as: FairDirector
              captures: { men: $.data.id }
            - call: "POST /science-fair/fair-editions/${ed}/open-registration"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/projects"
              payload: { fair_edition_id: "${ed}", category_id: "${cat}", title: "UJP", team_size: 1, involves_human_subjects: false, involves_animal_subjects: false }
              as: Mentor
              as_user_id: "${men}"
              captures: { p: $.data.id }
            - call: "POST /science-fair/projects/${p}/submit"
              payload: {}
              as: Mentor
              as_user_id: "${men}"
            - call: "POST /science-fair/fair-editions/${ed}/close-registration"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/projects/${p}/booth-assignments"
              payload: { hall: "A", booth_number: 1, inspection_window_start: "2026-08-01T00:00:00Z", inspection_window_end: "2026-08-10T00:00:00Z" }
              as: OperationsLead
            - call: "POST /science-fair/projects/${p}/inspection-result"
              payload: { result: "PASS" }
              as: SafetyInspector
            - call: "POST /science-fair/fair-editions/${ed}/begin-judging"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/judges"
              payload: { fair_edition_id: "${ed}", full_name: "JU", max_assignments: 5 }
              as: FairDirector
              captures: { j: $.data.id }
            - call: "POST /science-fair/judges/${j}/activate"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/projects/${p}/judging-assignments"
              payload: { judge_id: "${j}" }
              as: FairDirector
              captures: { asg: $.data.id }
            - call: "POST /science-fair/judging-assignments/${asg}/score-sheets"
              payload: { raw_score: 80 }
              as: Judge
              as_user_id: "${j}"
            - call: "GET /science-fair/fair-editions/${ed}"
              payload: {}
              as: FairDirector
              captures: { ed_v: $.data.version }
          trigger:
            - call: "POST /science-fair/fair-editions/${ed}/publish-advancement"
              payload: { expected_fair_edition_version: "${ed_v}" }
              as: FairDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNJUDGED_PROJECTS (P has only 1 of 2 required sheets; judging_status != JUDGED)"
            - "FairEdition.${ed}.status == JUDGING (unchanged)"
      - name: score_submission_idempotency_double_submit
        claim_type: idempotency
        grounds: ["state_machines.JudgingAssignment", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Submitting a score sheet twice for the same assignment: the second POST fails with ERR_INVALID_STATE because the assignment is already SUBMITTED (terminal)."
        test_recipe:
          setup:
            - "Edition in JUDGING; assignment ASG already SUBMITTED once"
          setup_api_calls:
            - call: "POST /science-fair/fair-editions"
              payload: { name: "Idem Edition", normalization_algorithm: "Z_SCORE", max_judges_per_project: 2, min_quorum_ratio_pct: 50 }
              as: FairDirector
              captures: { ed: $.data.id }
            - call: "POST /science-fair/categories"
              payload: { fair_edition_id: "${ed}", code: "PHYS", name: "Physics", grade_band: "SENIOR", advancement_slots: 1 }
              as: FairDirector
              captures: { cat: $.data.id }
            - call: "POST /science-fair/mentors"
              payload: { full_name: "Mentor Id", email: "mid@x.com" }
              as: FairDirector
              captures: { men: $.data.id }
            - call: "POST /science-fair/fair-editions/${ed}/open-registration"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/projects"
              payload: { fair_edition_id: "${ed}", category_id: "${cat}", title: "IdP", team_size: 1, involves_human_subjects: false, involves_animal_subjects: false }
              as: Mentor
              as_user_id: "${men}"
              captures: { p: $.data.id }
            - call: "POST /science-fair/projects/${p}/submit"
              payload: {}
              as: Mentor
              as_user_id: "${men}"
            - call: "POST /science-fair/fair-editions/${ed}/close-registration"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/projects/${p}/booth-assignments"
              payload: { hall: "A", booth_number: 1, inspection_window_start: "2026-08-01T00:00:00Z", inspection_window_end: "2026-08-10T00:00:00Z" }
              as: OperationsLead
            - call: "POST /science-fair/projects/${p}/inspection-result"
              payload: { result: "PASS" }
              as: SafetyInspector
            - call: "POST /science-fair/fair-editions/${ed}/begin-judging"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/judges"
              payload: { fair_edition_id: "${ed}", full_name: "JId", max_assignments: 5 }
              as: FairDirector
              captures: { j: $.data.id }
            - call: "POST /science-fair/judges/${j}/activate"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/projects/${p}/judging-assignments"
              payload: { judge_id: "${j}" }
              as: FairDirector
              captures: { asg: $.data.id }
            - call: "POST /science-fair/judging-assignments/${asg}/score-sheets"
              payload: { raw_score: 75 }
              as: Judge
              as_user_id: "${j}"
          trigger:
            - call: "POST /science-fair/judging-assignments/${asg}/score-sheets"
              payload: { raw_score: 99 }
              as: Judge
              as_user_id: "${j}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (second submission rejected; assignment already SUBMITTED)"
