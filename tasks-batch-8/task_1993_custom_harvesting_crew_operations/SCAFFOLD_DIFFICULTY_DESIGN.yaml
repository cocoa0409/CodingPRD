  # ===========================================================================
  # Rule 4: transitive_cascade — depth ≥ 3 and ≥ 2, different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: open_settlement_cascades_season_stop_assignment_machine
        grounds:
          - state_machines.HarvestSeason.transitions.ACTIVE_to_SETTLING
          - state_machines.RouteStop.transitions.SCHEDULED_to_SKIPPED
          - state_machines.MachineAssignment.transitions.RESERVED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 chain originating from open-settlement on HarvestSeason:
          Season.ACTIVE→SETTLING ⇒ RouteStop.SCHEDULED→SKIPPED ⇒
          MachineAssignment.RESERVED→CANCELLED ⇒ Machine.ASSIGNED→AVAILABLE
          (last hop only when machine has no other active assignments).
        test_recipe:
          setup:
            - "Season ACTIVE"
            - "One contract COMMITTED with two stops: stop1 COMPLETED (so season has harvested_acres), stop2 still SCHEDULED with a RESERVED assignment on machine M2"
            - "M2 is in ASSIGNED status (no other assignments)"
          setup_api_calls:
            - call: "POST /harvest/seasons"
              payload: { season_year: 2026, diesel_baseline_per_gallon_cents: 300, current_diesel_per_gallon_cents: 300 }
              as: HarvestOperator
              captures: { season_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/machines"
              payload: { machine_kind: "COMBINE", label: "C1", daily_capacity_acres: 200 }
              as: HarvestOperator
              captures: { m1_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/machines"
              payload: { machine_kind: "COMBINE", label: "C2", daily_capacity_acres: 200 }
              as: HarvestOperator
              captures: { m2_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/activate"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest/seasons/${season_id}/contracts"
              payload: { grower_name: "G", state_code: "KS", crop: "WHEAT", rate_basis: "PER_ACRE", rate_cents_per_acre: 3200, rate_cents_per_bushel: 0, committed_acres: 200 }
              as: GrowerLiaison
              captures: { contract_id: $.data.id }
            - call: "POST /harvest/contracts/${contract_id}/commit"
              payload: {}
              as: GrowerLiaison
            - call: "POST /harvest/contracts/${contract_id}/route-stops"
              payload: { planned_start_date: "2026-08-05", planned_end_date: "2026-08-06", planned_acres: 100, sequence_index: 1 }
              as: GrowerLiaison
              captures: { stop1_id: $.data.id }
            - call: "POST /harvest/machine-assignments"
              payload: { route_stop_id: "${stop1_id}", machine_id: "${m1_id}", assigned_start_date: "2026-08-05", assigned_end_date: "2026-08-07" }
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop1_id}/depart"
              payload: {}
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop1_id}/start-cutting"
              payload: {}
              as: CrewBoss
            - call: "PATCH /harvest/route-stops/${stop1_id}"
              payload: { actual_acres: 100 }
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop1_id}/complete"
              payload: {}
              as: CrewBoss
            - call: "POST /harvest/contracts/${contract_id}/route-stops"
              payload: { planned_start_date: "2026-08-10", planned_end_date: "2026-08-11", planned_acres: 100, sequence_index: 2 }
              as: GrowerLiaison
              captures: { stop2_id: $.data.id }
            - call: "POST /harvest/machine-assignments"
              payload: { route_stop_id: "${stop2_id}", machine_id: "${m2_id}", assigned_start_date: "2026-08-10", assigned_end_date: "2026-08-12" }
              as: CrewBoss
              captures: { asg2_id: $.data.id }
          trigger:
            - call: "POST /harvest/seasons/${season_id}/open-settlement"
              payload: {}
              as: HarvestOperator
          assert:
            - "HarvestSeason.${season_id}.status == SETTLING"
            - "RouteStop.${stop2_id}.status == SKIPPED (re-read)"
            - "MachineAssignment.${asg2_id}.status == CANCELLED (re-read)"
            - "Machine.${m2_id}.status == AVAILABLE (re-read)"

      - name: report_breakdown_cascades_machine_to_stop_pause
        grounds:
          - state_machines.Machine.transitions.IN_FIELD_to_DOWN
          - state_machines.RouteStop.transitions.CUTTING_to_PAUSED_WEATHER
        distinguishing_aspect: |
          Depth-2 chain originating from report-breakdown on Machine:
          Machine.IN_FIELD→DOWN ⇒ RouteStop.CUTTING→PAUSED_WEATHER.
          Different triggering transition than open-settlement.
        test_recipe:
          setup:
            - "Season ACTIVE, contract IN_PROGRESS, stop CUTTING with machine DEPLOYED"
          setup_api_calls:
            - call: "POST /harvest/seasons"
              payload: { season_year: 2026, diesel_baseline_per_gallon_cents: 300, current_diesel_per_gallon_cents: 300 }
              as: HarvestOperator
