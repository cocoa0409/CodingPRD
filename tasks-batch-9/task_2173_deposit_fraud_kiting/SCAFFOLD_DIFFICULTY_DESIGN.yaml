  # =========================================================================
  # Rule 8 — resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: early_release_windows_on_one_account_use_half_open_intervals_with_adjacency_allowed
        grounds:
          - validations[priority=56]
          - errors[ERR_RELEASE_WINDOW_OVERLAP]
          - entities.HoldOverrideReview.fields.release_effective_at
          - entities.HoldOverrideReview.fields.release_window_end_at
        distinguishing_aspect: |
          Interval semantics A on the DepositAccount resource: half-open [start, end) windows with NO
          buffer, so a window starting exactly where another ends is accepted while a one-day straddle
          is rejected with ERR_RELEASE_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Logical clock at its 2026-08-01T00:00:00Z default."
            - "One ACTIVE DepositAccount with two separate CHECK deposits of 30000 cents, minting two independent ACTIVE holds of 7500 cents each."
            - "One DRAFT HoldOverrideReview on the first hold claiming the window 2026-08-01T00:00:00Z .. 2026-08-03T00:00:00Z."
