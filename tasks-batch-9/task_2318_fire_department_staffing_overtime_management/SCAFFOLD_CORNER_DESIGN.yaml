        distinguishing_aspect: "The SICK request filed last is adjudicated first (type priority 2 before VACATION's 5) and approved regardless of the floor; it consumes the only slack, so both VACATION requests are then denied even though the most senior of them would have been approved had the batch been scored against the pre-batch headcount of 3."
