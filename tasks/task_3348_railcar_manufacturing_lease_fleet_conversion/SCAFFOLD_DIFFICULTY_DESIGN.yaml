        is empty.'
      - LeaseContract.${lc_id}.capital_allocation_cents == 122500 (retained_cars = 2 live cars of the
        order; capital_cents = 2 * 875000 = 1750000; lessor_equity_cents = floor(1750000 * min(700, 900)
        / 10000) = 122500).
