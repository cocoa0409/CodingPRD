# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Bank Capital Planning & Regulatory Reporting
# =============================================================================
# Walks the claim-extraction-guide taxonomy. Covers claims §1.8 does not.
# =============================================================================

scaffold_corner_design:
  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:
      - name: bank_create_success_returns_defaults
        claim_type: creation
        grounds: [entities.Bank, endpoints."POST /banks"]
        distinguishing_aspect: "POST /banks with required inputs returns 201 with id, created_at, version=1, status defaults (pca_bucket=ADEQUATELY_CAPITALIZED, mdba_cents=0, pending_distribution_cents=0, supervisory_status=NORMAL)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /banks"
              payload: { legal_name: "DefaultBank", charter_id: "CH-DEF-001" }
              as: SystemOperator
              captures: { b: $.data.id, bucket: $.data.pca_bucket, mdba: $.data.mdba_cents, pending: $.data.pending_distribution_cents, sup: $.data.supervisory_status, v: $.data.version }
          assert:
            - "version == 1"
            - "pca_bucket == ADEQUATELY_CAPITALIZED"
            - "mdba_cents == 0"
            - "pending_distribution_cents == 0"
            - "supervisory_status == NORMAL"
            - "rwa_methodology == STANDARDIZED (default applied)"

      - name: bank_get_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Bank, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /banks/{nonexistent-uuid} returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /banks/00000000-0000-0000-0000-000000000000"
              as: CapitalAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"
            - "http_status == 404"

      - name: bank_list_pagination_defaults
        claim_type: listing
        grounds: [entities.Bank, response_envelope]
        distinguishing_aspect: "GET /banks returns paginated list with limit/offset/total_count/has_more; default limit 10, offset 0."
        test_recipe:
          setup: ["Three banks exist"]
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "B1", charter_id: "CH-LST-001" }
              as: SystemOperator
            - call: "POST /banks"
              payload: { legal_name: "B2", charter_id: "CH-LST-002" }
              as: SystemOperator
            - call: "POST /banks"
              payload: { legal_name: "B3", charter_id: "CH-LST-003" }
              as: SystemOperator
          trigger:
            - call: "GET /banks"
              as: CapitalAnalyst
          assert:
            - "response has pagination_fields [limit, offset, total_count, has_more]"
            - "total_count == 3"
            - "has_more == false"
            - "data is array of length 3"

      - name: bank_duplicate_charter_id_rejected
        claim_type: required_fields
        grounds: [entities.Bank.fields.charter_id, "errors[ERR_DUPLICATE_CHARTER_ID]"]
        distinguishing_aspect: "POST /banks with a charter_id that already exists returns ERR_DUPLICATE_CHARTER_ID (409)."
        test_recipe:
          setup: ["One bank with charter_id CH-DUP-001 exists"]
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "First", charter_id: "CH-DUP-001" }
              as: SystemOperator
          trigger:
            - call: "POST /banks"
              payload: { legal_name: "Second", charter_id: "CH-DUP-001" }
              as: SystemOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_CHARTER_ID"

      - name: risk_exposure_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.RiskExposure.fields.exposure_class, "errors[ERR_INVALID_ENUM_VALUE]"]
        distinguishing_aspect: "POST risk-exposures with exposure_class = 'BOGUS' returns 422 ERR_INVALID_ENUM_VALUE."
        test_recipe:
          setup: ["Bank + period exist"]
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "EnumBank", charter_id: "CH-ENM-001" }
              as: SystemOperator
              captures: { b: $.data.id }
            - call: "POST /banks/${b}/reporting-periods"
              payload: { period_end_date: "2026-06-30", period_year: 2026, period_quarter: "Q2" }
              as: CapitalAnalyst
              captures: { p: $.data.id }
          trigger:
            - call: "POST /banks/${b}/reporting-periods/${p}/risk-exposures"
              payload: { reporting_period_id: "${p}", exposure_class: "BOGUS", exposure_at_default_cents: 1000000, risk_weight_bps: 10000, obligor_grade: "INVESTMENT_GRADE" }
              as: CapitalAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_ENUM_VALUE"

      - name: risk_exposure_invalid_risk_weight_band
        claim_type: type_constraints
        grounds: [entities.RiskExposure.fields.risk_weight_bps, "errors[ERR_INVALID_RISK_PARAMETER]"]
        distinguishing_aspect: "POST risk-exposures with collateral_haircut_bps = 15000 (above 10000) returns ERR_INVALID_RISK_PARAMETER."
        test_recipe:
          setup: ["Bank + period exist"]
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "RiskBandBank", charter_id: "CH-RBD-001" }
              as: SystemOperator
              captures: { b: $.data.id }
            - call: "POST /banks/${b}/reporting-periods"
              payload: { period_end_date: "2026-06-30", period_year: 2026, period_quarter: "Q2" }
              as: CapitalAnalyst
              captures: { p: $.data.id }
          trigger:
            - call: "POST /banks/${b}/reporting-periods/${p}/risk-exposures"
              payload: { reporting_period_id: "${p}", exposure_class: "CORPORATE", exposure_at_default_cents: 1000000, risk_weight_bps: 10000, obligor_grade: "INVESTMENT_GRADE", collateral_haircut_bps: 15000 }
              as: CapitalAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_RISK_PARAMETER"

      - name: risk_exposure_computed_fields_ignore_input
        claim_type: computed_fields
        grounds: [entities.RiskExposure.fields.rwa_cents_standardized]
        distinguishing_aspect: "RiskExposure.rwa_cents_standardized is computed by the server per formula, not supplied by the client. A request that omits it yields the formula-derived value."
        test_recipe:
          setup: ["Bank + period exist"]
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "CompIgnBank", charter_id: "CH-CIG-001" }
              as: SystemOperator
              captures: { b: $.data.id }
            - call: "POST /banks/${b}/reporting-periods"
              payload: { period_end_date: "2026-06-30", period_year: 2026, period_quarter: "Q2" }
              as: CapitalAnalyst
              captures: { p: $.data.id }
          trigger:
            - call: "POST /banks/${b}/reporting-periods/${p}/risk-exposures"
              payload: { reporting_period_id: "${p}", exposure_class: "CORPORATE", exposure_at_default_cents: 10000000, risk_weight_bps: 5000, obligor_grade: "INVESTMENT_GRADE" }
              as: CapitalAnalyst
              captures: { e: $.data.id, rwa_s: $.data.rwa_cents_standardized }
          assert:
            - "RiskExposure.${e}.rwa_cents_standardized == 5000000  # floor(10000000 * 5000 / 10000); computed by server"

      - name: pca_threshold_event_immutable
        claim_type: immutability
        grounds: [entities.PCAThresholdEvent]
        distinguishing_aspect: "PCAThresholdEvent has common_fields: false — no update endpoint exists; only list/get."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /banks/00000000-0000-0000-0000-000000000000/pca-threshold-events"
              as: CapitalAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "No PUT/PATCH/DELETE endpoint exists for PCAThresholdEvent in §1.5 (structural claim)"
            - "GET on non-existent bank returns ERR_NOT_FOUND (parent check)"

      - name: cross_bank_fk_reference_rejected
        claim_type: parent_relationships
        grounds: ["validations[priority=4]", "errors[ERR_CROSS_BANK_REFERENCE]"]
        distinguishing_aspect: "POST capital-plans with baseline_period_id belonging to a different bank returns ERR_CROSS_BANK_REFERENCE."
        test_recipe:
          setup: ["Bank A and Bank B; period under Bank A"]
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "XRefA", charter_id: "CH-XREF-A" }
              as: SystemOperator
              captures: { ba: $.data.id }
            - call: "POST /banks"
              payload: { legal_name: "XRefB", charter_id: "CH-XREF-B" }
              as: SystemOperator
              captures: { bb: $.data.id }
            - call: "POST /banks/${ba}/reporting-periods"
              payload: { period_end_date: "2026-06-30", period_year: 2026, period_quarter: "Q2" }
              as: CapitalAnalyst
              captures: { pa: $.data.id }
            - call: "POST /banks/${bb}/stress-scenarios"
              payload: { scenario_code: "X-B", gdp_shock_bps: -100, unemployment_peak_bps: 600, hpi_shock_bps: -500, cre_price_shock_bps: -500, market_shock_bps: -1000 }
              as: CapitalAnalyst
              captures: { sb: $.data.id }
          trigger:
            - call: "POST /banks/${bb}/capital-plans"
              payload: { plan_year: 2027, baseline_period_id: "${pa}", stress_scenario_id: "${sb}" }
              as: CapitalAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CROSS_BANK_REFERENCE"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: reporting_period_initial_state_open
        claim_type: initial_state
        grounds: [state_machines.ReportingPeriod]
        distinguishing_aspect: "New ReportingPeriod starts in OPEN."
        test_recipe:
          setup: ["Bank exists"]
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "InitBank", charter_id: "CH-INI-001" }
              as: SystemOperator
              captures: { b: $.data.id }
          trigger:
            - call: "POST /banks/${b}/reporting-periods"
              payload: { period_end_date: "2026-06-30", period_year: 2026, period_quarter: "Q2" }
              as: CapitalAnalyst
              captures: { st: $.data.status }
          assert:
            - "status == OPEN"

      - name: call_report_invalid_submit_from_draft
        claim_type: invalid_transition
        grounds: [state_machines.CallReport, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Submit from DRAFT (not VALIDATED) returns ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["Bank, period, exposure, instrument, draft call report"]
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "InvTrBank", charter_id: "CH-ITR-001" }
              as: SystemOperator
              captures: { b: $.data.id }
            - call: "POST /banks/${b}/reporting-periods"
              payload: { period_end_date: "2026-06-30", period_year: 2026, period_quarter: "Q2" }
              as: CapitalAnalyst
              captures: { p: $.data.id }
            - call: "POST /banks/${b}/reporting-periods/${p}/risk-exposures"
              payload: { reporting_period_id: "${p}", exposure_class: "CORPORATE", exposure_at_default_cents: 100000000, risk_weight_bps: 10000, obligor_grade: "INVESTMENT_GRADE", collateral_haircut_bps: 0 }
              as: CapitalAnalyst
            - call: "POST /banks/${b}/capital-instruments"
              payload: { instrument_class: "CET1", instrument_subtype: "COMMON_STOCK", outstanding_amount_cents: 10000000, issuance_date: "2020-01-15", contractual_rate_bps: 0 }
              as: CapitalAnalyst
            - call: "POST /banks/${b}/reporting-periods/${p}/call-reports"
              payload: {}
              as: CapitalAnalyst
              captures: { r: $.data.id }
          trigger:
            - call: "POST /banks/${b}/reporting-periods/${p}/call-reports/${r}/submit"
              as: CapitalAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION"

      - name: distribution_terminal_state_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.CapitalDistributionRequest]
        distinguishing_aspect: "After EXECUTED, no further transitions allowed (attempting withdraw returns ERR_INVALID_STATE_TRANSITION)."
        test_recipe:
          setup: ["Bank with APPROVED plan; distribution APPROVED_NOT_EXECUTED then EXECUTED at payment_date"]
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "TermBank", charter_id: "CH-TRM-001" }
              as: SystemOperator
              captures: { b: $.data.id }
            - call: "POST /banks/${b}/reporting-periods"
              payload: { period_end_date: "2026-06-30", period_year: 2026, period_quarter: "Q2" }
              as: CapitalAnalyst
              captures: { p: $.data.id }
            - call: "POST /banks/${b}/reporting-periods/${p}/risk-exposures"
              payload: { reporting_period_id: "${p}", exposure_class: "CORPORATE", exposure_at_default_cents: 100000000000, risk_weight_bps: 10000, obligor_grade: "INVESTMENT_GRADE", collateral_haircut_bps: 0 }
              as: CapitalAnalyst
            - call: "POST /banks/${b}/capital-instruments"
              payload: { instrument_class: "CET1", instrument_subtype: "COMMON_STOCK", outstanding_amount_cents: 10000000000, issuance_date: "2020-01-15", contractual_rate_bps: 0 }
              as: CapitalAnalyst
            - call: "POST /banks/${b}/reporting-periods/${p}/call-reports"
              payload: {}
              as: CapitalAnalyst
              captures: { r: $.data.id }
            - call: "POST /banks/${b}/reporting-periods/${p}/call-reports/${r}/prepare"
              as: CapitalAnalyst
            - call: "POST /banks/${b}/reporting-periods/${p}/call-reports/${r}/submit"
              as: CapitalAnalyst
              as_user_id: "analyst-sub-1"
            - call: "POST /banks/${b}/reporting-periods/${p}/call-reports/${r}/accept"
              as: RegulatorReviewer
            - call: "POST /banks/${b}/stress-scenarios"
              payload: { scenario_code: "BASE-TRM", gdp_shock_bps: -100, unemployment_peak_bps: 600, hpi_shock_bps: -500, cre_price_shock_bps: -500, market_shock_bps: -1000 }
              as: CapitalAnalyst
              captures: { sc: $.data.id }
            - call: "POST /banks/${b}/stress-scenarios/${sc}/activate"
              as: CapitalAnalyst
            - call: "POST /banks/${b}/capital-plans"
              payload: { plan_year: 2027, baseline_period_id: "${p}", stress_scenario_id: "${sc}" }
              as: CapitalAnalyst
              captures: { pl: $.data.id }
            - call: "POST /banks/${b}/capital-plans/${pl}/submit_board"
              as: CapitalAnalyst
              as_user_id: "analyst-preparer-1"
            - call: "POST /banks/${b}/capital-plans/${pl}/board_approve"
              as: BoardApprover
              as_user_id: "board-1"
            - call: "GET /banks/${b}"
              as: CapitalAnalyst
              captures: { bv: $.data.version }
            - call: "POST /banks/${b}/capital-plans/${pl}/submit_regulator"
              payload: { expected_bank_version: "${bv}" }
              as: CapitalAnalyst
            - call: "POST /banks/${b}/capital-plans/${pl}/regulator_approve"
              as: RegulatorReviewer
            - call: "POST /banks/${b}/distribution-requests"
              payload: { capital_plan_id: "${pl}", reporting_period_id: "${p}", distribution_kind: "DIVIDEND", distribution_amount_cents: 50000000, proposed_payment_date: "2027-03-15" }
              as: CapitalAnalyst
              captures: { d: $.data.id }
            - call: "GET /banks/${b}"
              as: CapitalAnalyst
              captures: { bv2: $.data.version }
            - call: "POST /banks/${b}/distribution-requests/${d}/approve"
              payload: { expected_bank_version: "${bv2}" }
              as: CapitalAnalyst
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-15T09:00:00Z" }
              as: SystemOperator
            - call: "POST /banks/${b}/distribution-requests/${d}/execute"
              as: CapitalAnalyst
          trigger:
            - call: "POST /banks/${b}/distribution-requests/${d}/withdraw"
              as: CapitalAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION"

      - name: call_report_double_prepare_idempotent_or_rejected
        claim_type: idempotency
        grounds: [state_machines.CallReport]
        distinguishing_aspect: "Second prepare on an already-PREPARED/VALIDATED report returns ERR_INVALID_STATE_TRANSITION (or is rejected)."
        test_recipe:
          setup: ["Bank, period, exposure, instrument, prepared call report"]
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "IdemBank", charter_id: "CH-IDM-001" }
              as: SystemOperator
              captures: { b: $.data.id }
            - call: "POST /banks/${b}/reporting-periods"
              payload: { period_end_date: "2026-06-30", period_year: 2026, period_quarter: "Q2" }
              as: CapitalAnalyst
              captures: { p: $.data.id }
            - call: "POST /banks/${b}/reporting-periods/${p}/risk-exposures"
              payload: { reporting_period_id: "${p}", exposure_class: "CORPORATE", exposure_at_default_cents: 100000000, risk_weight_bps: 10000, obligor_grade: "INVESTMENT_GRADE", collateral_haircut_bps: 0 }
              as: CapitalAnalyst
            - call: "POST /banks/${b}/capital-instruments"
              payload: { instrument_class: "CET1", instrument_subtype: "COMMON_STOCK", outstanding_amount_cents: 10000000, issuance_date: "2020-01-15", contractual_rate_bps: 0 }
              as: CapitalAnalyst
            - call: "POST /banks/${b}/reporting-periods/${p}/call-reports"
              payload: {}
              as: CapitalAnalyst
              captures: { r: $.data.id }
            - call: "POST /banks/${b}/reporting-periods/${p}/call-reports/${r}/prepare"
              as: CapitalAnalyst
          trigger:
            - call: "POST /banks/${b}/reporting-periods/${p}/call-reports/${r}/prepare"
              as: CapitalAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION"

      - name: capital_plan_terminal_superseded_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.CapitalPlan]
        distinguishing_aspect: "SUPERSEDED plan cannot transition further; amend on SUPERSEDED returns ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["Plan moved to OBJECTED then amended back to DRAFT, then submit_board → ... eventually SUPERSEDED via amendment cascade. Simplify: construct plan, push to OBJECTED, amend, then test amend on a SUPERSEDED plan via a second amendment cascade. Alternative simpler path: create a second plan that goes to APPROVED, which SUPERSEDES the first if it was APPROVED — but only one in-flight at a time. Use the cascade path."]
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "SupBank", charter_id: "CH-SUP-001" }
              as: SystemOperator
              captures: { b: $.data.id }
            - call: "POST /banks/${b}/reporting-periods"
              payload: { period_end_date: "2026-06-30", period_year: 2026, period_quarter: "Q2" }
              as: CapitalAnalyst
              captures: { p: $.data.id }
            - call: "POST /banks/${b}/reporting-periods/${p}/risk-exposures"
              payload: { reporting_period_id: "${p}", exposure_class: "CORPORATE", exposure_at_default_cents: 100000000000, risk_weight_bps: 10000, obligor_grade: "INVESTMENT_GRADE", collateral_haircut_bps: 0 }
              as: CapitalAnalyst
            - call: "POST /banks/${b}/capital-instruments"
              payload: { instrument_class: "CET1", instrument_subtype: "COMMON_STOCK", outstanding_amount_cents: 10000000000, issuance_date: "2020-01-15", contractual_rate_bps: 0 }
              as: CapitalAnalyst
            - call: "POST /banks/${b}/reporting-periods/${p}/call-reports"
              payload: {}
              as: CapitalAnalyst
              captures: { r: $.data.id }
            - call: "POST /banks/${b}/reporting-periods/${p}/call-reports/${r}/prepare"
              as: CapitalAnalyst
            - call: "POST /banks/${b}/reporting-periods/${p}/call-reports/${r}/submit"
              as: CapitalAnalyst
              as_user_id: "analyst-sub-1"
            - call: "POST /banks/${b}/reporting-periods/${p}/call-reports/${r}/accept"
              as: RegulatorReviewer
            - call: "POST /banks/${b}/stress-scenarios"
              payload: { scenario_code: "BASE-SUP", gdp_shock_bps: -100, unemployment_peak_bps: 600, hpi_shock_bps: -500, cre_price_shock_bps: -500, market_shock_bps: -1000 }
              as: CapitalAnalyst
              captures: { sc: $.data.id }
            - call: "POST /banks/${b}/stress-scenarios/${sc}/activate"
              as: CapitalAnalyst
            - call: "POST /banks/${b}/capital-plans"
              payload: { plan_year: 2027, baseline_period_id: "${p}", stress_scenario_id: "${sc}" }
              as: CapitalAnalyst
              captures: { pl: $.data.id }
            - call: "POST /banks/${b}/capital-plans/${pl}/submit_board"
              as: CapitalAnalyst
              as_user_id: "analyst-preparer-1"
            - call: "POST /banks/${b}/capital-plans/${pl}/board_approve"
              as: BoardApprover
              as_user_id: "board-1"
            - call: "GET /banks/${b}"
              as: CapitalAnalyst
              captures: { bv: $.data.version }
            - call: "POST /banks/${b}/capital-plans/${pl}/submit_regulator"
              payload: { expected_bank_version: "${bv}" }
              as: CapitalAnalyst
            - call: "POST /banks/${b}/capital-plans/${pl}/regulator_object"
              as: RegulatorReviewer
            - call: "POST /banks/${b}/capital-plans/${pl}/amend"
              as: CapitalAnalyst
          trigger:
            - call: "POST /banks/${b}/capital-plans/${pl}/amend"
              as: CapitalAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION  # amend only valid from OBJECTED; plan is now DRAFT"

      - name: instrument_common_stock_cannot_be_called
        claim_type: invalid_transition
        grounds: [state_machines.CapitalInstrument, "errors[ERR_INSTRUMENT_NOT_CALLABLE]"]
        distinguishing_aspect: "Calling COMMON_STOCK instrument returns ERR_INSTRUMENT_NOT_CALLABLE."
        test_recipe:
          setup: ["Bank with COMMON_STOCK CET1 instrument OUTSTANDING"]
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "CallBank", charter_id: "CH-CAL-001" }
              as: SystemOperator
              captures: { b: $.data.id }
            - call: "POST /banks/${b}/capital-instruments"
              payload: { instrument_class: "CET1", instrument_subtype: "COMMON_STOCK", outstanding_amount_cents: 1000000000, issuance_date: "2020-01-15", contractual_rate_bps: 0 }
              as: CapitalAnalyst
              captures: { i: $.data.id }
          trigger:
            - call: "POST /banks/${b}/capital-instruments/${i}/call"
              as: CapitalAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INSTRUMENT_NOT_CALLABLE"

      - name: edit_exception_fatal_cannot_be_explained
        claim_type: precondition_enforcement
        grounds: [state_machines.EditException, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Explaining a FATAL edit returns ERR_INVALID_STATE_TRANSITION (must be RESOLVED, not EXPLAINED)."
        test_recipe:
          setup: ["ADVANCED bank with exposure where haircut makes advanced < standardized → EDIT_FLOOR_VIOLATION FATAL"]
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "FatalBank", charter_id: "CH-FAT-001", rwa_methodology: "ADVANCED" }
              as: SystemOperator
              captures: { b: $.data.id }
            - call: "POST /banks/${b}/reporting-periods"
              payload: { period_end_date: "2026-06-30", period_year: 2026, period_quarter: "Q2" }
              as: CapitalAnalyst
              captures: { p: $.data.id }
            - call: "POST /banks/${b}/reporting-periods/${p}/risk-exposures"
