              as: MarketingManager
              captures: { b1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-14T07:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /sales-galleries/${g1}/set-status"
              payload: { status: "CLOSED" }
              as: GalleryManager
            - call: "POST /tour-bookings/${b1}/check-in"
              payload: { issue_incentive_gift: true }
              as: GalleryManager
            - call: "POST /tour-bookings"
              payload: { channel_id: "${ch1}", prospect_id: "${p1}", gallery_id: "${g1}", scheduled_start_utc: "2026-08-14T12:00:00Z" }
