            - call: "POST /enrollments"
              payload: { session_id: "${sC}", member_id: "${m1}", coverage: "DROP_IN", sibling_index: 1, expected_session_version: "${sCv}" }
              as: Guardian
              as_user_id: "${g1}"
              captures: { eC: $.data.id }
          assert:
            - "the first trigger call (session B) returns response.data.error_id == ERR_MEMBER_SCHEDULE_CONFLICT with status 409"
            - "the second trigger call (session C) returns status 201 and Enrollment.${eC}.attendance_status == RESERVED"

      - name: showcase_buffered_closed_window_vs_session_start
        grounds:
          - validations[priority=10]
          - errors[ERR_SHOWCASE_SESSION_CLASH]
          - entities.Showcase.fields.starts_at
        distinguishing_aspect: "Closed buffered window [start-120m, start+120m] on Showcase (different resource entity and different interval geometry than the half-open Session overlap): a member enrolled in a session starting 2026-05-11T10:00:00Z is rejected entering a showcase starting 2026-05-11T11:00:00Z (60m < 120m buffer) with ERR_SHOWCASE_SESSION_CLASH, even though the intervals do not classically overlap."
