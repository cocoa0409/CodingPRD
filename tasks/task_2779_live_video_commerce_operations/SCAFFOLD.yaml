# =============================================================================
# SCAFFOLD — task_2779_live_video_commerce_operations
# §1.0–§1.7 seed tables. Single source of truth for PRD, tests, implementation.
# Difficulty band: Expert (upper end) — 13 entities, 62 endpoints, 8 state
# machines (45 transitions), 8 calculations, 31 validations, 54 error codes,
# 7 roles, 2 OCC rules.
# =============================================================================
scenario: |
  2779. Live Video Commerce Operations (retail live shopping team): show calendar
  planning with host booking, product lineup and inventory reservation, technical
  production setup across streaming platforms with simulcast and latency
  management, real-time inventory and pricing synchronization with flash offer
  windows and quantity limits, interactive features including chat moderation,
  polls and viewer question routing, in-stream checkout with cart persistence and
  abandonment recovery, host disclosure requirements for paid endorsements and
  product claims accuracy, replay merchandising with time-stamped product links
  and post-show conversion measurement, performance analytics by show, host and
  product with margin analysis
domain_name: live-video-commerce-operations
api_prefix: "/"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: quota_allocation            # finite offer allotment + physical inventory reserved, committed, released
  secondary_archetype: temporal_windowing        # host turnaround buffers, flash-offer windows, go-live window, replay decay window
  complexity_layers:
    - optimistic_concurrency                     # OCC on LineupSlot.version and Cart.version
    - cascading_side_effects                     # depth-4 chains from show end, from chat block, from booking cancel
    - dual_variant_calculation                   # show margin PROVISIONAL vs FINAL; host score LIVE_WINDOW vs ATTRIBUTED_72H
    - rate_threshold_triggers                    # bundle-discount tiers, free-ship threshold, readiness index gate, strike threshold
    - derived_field_reconciliation               # Product reserved/committed/available, FlashOffer held/sold/remaining, Show counters

  entity_topology: flat
  # Thirteen peer entities linked by explicit foreign keys; no entity is nested
  # in another's URL path — every reverse lookup is a filtered flat collection
  # (e.g. GET /stream-channels?show_id=...). `parent: null` on every entity.

  state_machine_shape: cyclic
  # Cyclic is the dominant shape: FlashOffer ACTIVE->EXHAUSTED->ACTIVE (restock on
  # order cancel), Cart OPEN->ABANDONED->OPEN (recovery), Interaction
  # QUEUED->ROUTED->DEFERRED->QUEUED (bounded deferral loop),
  # StreamChannel PROVISIONED->FAILED->PROVISIONED. Order additionally carries
  # parallel dimensions (payment_state x fulfillment_state) and Show is compound
  # (READY is derived from booking/disclosure/channel/lineup state and reverts).

  relationship_patterns:
    - one_to_many          # Show -> LineupSlot / StreamChannel / Cart / Interaction
    - many_to_many         # HostBooking joins Show x Host; LineupSlot joins Show x Product
    - self_referential     # FlashOffer.superseded_by_offer_id -> FlashOffer.id
    - cross_aggregate      # CartItem -> FlashOffer (offer aggregate) and -> LineupSlot (show aggregate)

  role_model: segregation_of_duties
  # ComplianceOfficer who substantiated a product claim must not be the officer
  # who signs off the show that merchandised it; producers cannot self-certify
  # host disclosures; hosts acknowledge their own disclosures only.

  consistency_model: immediate
  # Every cascade, counter and derived field is reconciled inside the same request.

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Host
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: on-air talent name
      - name: handle
        type: string
        source: input
        description: unique social handle used on every simulcast platform
        constraints: unique across Host; 3-30 chars
      - name: commission_pct
        type: number
        source: input
        description: fraction of merchandise revenue accrued as host commission
        constraints: 0.0 <= commission_pct <= 0.30
      - name: disclosure_certification_expires_at
        type: datetime
        source: system
        description: end of the host's paid-endorsement disclosure certification; set only by POST /hosts/{host_id}/disclosure-certifications
        default: null
      - name: certification_status
        type: enum
        source: computed
        description: UNCERTIFIED when disclosure_certification_expires_at is null; EXPIRED when disclosure_certification_expires_at < logical now; CERTIFIED otherwise
        constraints: one of {UNCERTIFIED, CERTIFIED, EXPIRED}
        default: UNCERTIFIED
      - name: effectiveness_score_live
        type: integer
        source: computed
        description: latest host_effectiveness_score LIVE_WINDOW variant value stamped by GET /hosts/{host_id}/performance
        default: 0
      - name: effectiveness_score_attributed
        type: integer
        source: computed
        description: latest host_effectiveness_score ATTRIBUTED_72H variant value stamped by GET /hosts/{host_id}/performance
        default: 0

  - name: Product
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: merchant stock keeping unit
        constraints: unique across Product
      - name: title
        type: string
        source: input
        description: merchandising title shown in-stream
      - name: base_price_cents
        type: integer
        source: input
        description: everyday list price in cents, used as the CartItem list-price snapshot
        constraints: 100 <= base_price_cents <= 5000000
      - name: unit_cost_cents
        type: integer
        source: input
        description: current landed unit cost in cents; revisable post-show via inventory-adjustments and used by the FINAL margin variant
        constraints: 0 <= unit_cost_cents < base_price_cents
      - name: on_hand_qty
        type: integer
        source: input
        description: physical units in the fulfilment centre; mutated only by POST /products/{product_id}/inventory-adjustments
        constraints: on_hand_qty >= 0
      - name: reserved_qty
        type: integer
        source: computed
        description: sum of CartItem.qty over CartItem rows with state == HELD (see calculations.inventory_pool_reconciliation)
        default: 0
      - name: committed_qty
        type: integer
        source: computed
        description: sum of CartItem.qty over CartItem rows with state == COMMITTED (see calculations.inventory_pool_reconciliation)
        default: 0
      - name: available_qty
        type: integer
        source: computed
        description: on_hand_qty - reserved_qty - committed_qty
        default: 0
      - name: claim_text
        type: string
        source: input
        description: product claim the host is permitted to state on air
        default: null
      - name: claim_substantiation_status
        type: enum
        source: system
        description: set by POST /products/{product_id}/claim-substantiations
        constraints: one of {UNSUBSTANTIATED, SUBSTANTIATED, REJECTED}
        default: UNSUBSTANTIATED
      - name: substantiated_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the ComplianceOfficer who recorded the SUBSTANTIATED decision; compared against the signoff officer by the segregation-of-duties rule
        default: null
      - name: substantiated_at
        type: datetime
        source: system
        description: logical-clock instant of the SUBSTANTIATED decision
        default: null

  - name: Viewer
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        description: chat display name
      - name: email
        type: string
        source: input
        description: contact address used for abandonment-recovery outreach
        constraints: unique across Viewer
      - name: chat_status
        type: enum
        source: system
        description: ACTIVE until MUTE_STRIKE_THRESHOLD (2) moderation blocks mute the viewer; auto-returns to ACTIVE on the first POST /interactions issued at or after muted_until
        constraints: one of {ACTIVE, MUTED}
        default: ACTIVE
      - name: strike_count
        type: integer
        source: system
        description: count of Interaction rows of this viewer that reached state BLOCKED
        default: 0
      - name: muted_until
        type: datetime
        source: system
        description: logical instant the mute lapses; set to block instant + MUTE_DURATION_MIN (15 minutes)
        default: null

  - name: Show
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: broadcast title
      - name: scheduled_start_at
        type: datetime
        source: input
        description: planned air start; bounds the go-live window
      - name: scheduled_end_at
        type: datetime
        source: input
        description: planned air end
        constraints: scheduled_end_at > scheduled_start_at
      - name: status
        type: enum
        source: system
        description: lifecycle state; see state_machines.Show
        constraints: one of {DRAFT, READY, LIVE, ENDED, SETTLED}
        default: DRAFT
      - name: created_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the ShowProducer that created the show
      - name: readiness_checked_at
        type: datetime
        source: system
        description: logical instant of the most recent DRAFT->READY evaluation
        default: null
      - name: went_live_at
        type: datetime
        source: system
        description: logical instant of READY->LIVE
        default: null
      - name: ended_at
        type: datetime
        source: system
        description: logical instant of LIVE->ENDED; the zero point of the replay decay curve
        default: null
      - name: settled_at
        type: datetime
        source: system
        description: logical instant of ENDED->SETTLED
        default: null
      - name: compliance_signoff_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the ComplianceOfficer that signed off the show
        default: null
      - name: simulcast_readiness_index
        type: integer
        source: computed
        description: minimum readiness_index over StreamChannel rows of this show whose status is in {PROVISIONED, LIVE}; 0 when that set is empty (see calculations.simulcast_readiness_index)
        default: 0
      - name: gross_merchandise_cents
        type: integer
        source: computed
        description: sum of Order.merchandise_cents over this show's Order rows with payment_state == CAPTURED
        default: 0
      - name: margin_provisional_cents
        type: integer
        source: computed
        description: latest PROVISIONAL variant output of calculations.show_margin_analysis
        default: 0
      - name: margin_final_cents
        type: integer
        source: computed
        description: FINAL variant output of calculations.show_margin_analysis, stamped by ENDED->SETTLED
        default: 0
      - name: abandoned_cart_count
        type: integer
        source: computed
        description: count of this show's Cart rows whose status is in {ABANDONED, EXPIRED}
        default: 0
      - name: abandonment_rate_bp
        type: integer
        source: computed
        description: round_half_up(10000 * abandoned_cart_count / total_cart_count) in basis points; 0 when total_cart_count == 0
        default: 0
      - name: pending_question_count
        type: integer
        source: computed
        description: count of this show's Interaction rows with kind == QUESTION and state in {QUEUED, ROUTED, DEFERRED}
        default: 0
      - name: replay_attributed_revenue_cents
        type: integer
        source: computed
        description: sum of LineupSlot.replay_attributed_revenue_cents over this show's slots
        default: 0

  - name: StreamChannel
    parent: null
    common_fields: true
    fields:
      - name: show_id
        type: string
        source: input
        description: FK -> Show.id; the broadcast this simulcast destination carries
      - name: platform
        type: enum
        source: input
        description: simulcast destination
        constraints: one of {FLAGSHIP_APP, SOCIAL_A, SOCIAL_B, PARTNER_APP}; unique per (show_id, platform)
      - name: is_primary
        type: boolean
        source: input
        description: true for the destination whose latency defines the reference clock for drift
        default: false
      - name: target_latency_ms
        type: integer
        source: input
        description: contracted glass-to-glass latency target for this destination
        constraints: 500 <= target_latency_ms <= 8000
      - name: status
        type: enum
        source: system
        description: lifecycle state; see state_machines.StreamChannel
        constraints: one of {DRAFT, PROVISIONED, LIVE, FAILED, ENDED}
        default: DRAFT
      - name: latency_ms
        type: integer
        source: system
        description: latency of the most recent health report; null until the first report
        default: null
      - name: dropped_frame_pct
        type: number
        source: system
        description: dropped-frame fraction (0.0-1.0) of the most recent health report
        default: 0.0
      - name: readiness_index
        type: integer
        source: computed
        description: 0-100 index from calculations.simulcast_readiness_index; 0 until the first health report
        default: 0
      - name: health_report_count
        type: integer
        source: system
        description: number of health reports accepted for this channel
        default: 0

  - name: HostBooking
    parent: null
    common_fields: true
    fields:
      - name: show_id
        type: string
        source: input
        description: FK -> Show.id; the booked broadcast
      - name: host_id
        type: string
        source: input
        description: FK -> Host.id; the booked talent
      - name: role
        type: enum
        source: input
        description: on-air role for this booking
        constraints: one of {PRIMARY, GUEST}; at most one booking with role PRIMARY and status in {PENDING, CONFIRMED} per show
      - name: status
        type: enum
        source: system
        description: lifecycle state; see state_machines.HostBooking
        constraints: one of {PENDING, CONFIRMED, CANCELLED, COMPLETED}
        default: PENDING
      - name: call_time_at
        type: datetime
        source: input
        description: start of the host's occupied interval (inclusive)
      - name: release_time_at
        type: datetime
        source: input
        description: end of the host's occupied interval (exclusive)
        constraints: release_time_at > call_time_at
      - name: fee_cents
        type: integer
        source: input
        description: flat appearance fee in cents (informational; commission is computed separately)
        constraints: fee_cents >= 0
      - name: confirmed_at
        type: datetime
        source: system
        description: logical instant of PENDING->CONFIRMED
        default: null
      - name: cancel_reason
        type: string
        source: system
        description: reason recorded on the cancel transition
        default: null

  - name: LineupSlot
    parent: null
    common_fields: true
    fields:
      - name: show_id
        type: string
        source: input
        description: FK -> Show.id; the broadcast this segment belongs to
      - name: product_id
        type: string
        source: input
        description: FK -> Product.id; the merchandised product
      - name: slot_sequence
        type: integer
        source: input
        description: 1-based on-air order within the show
        constraints: slot_sequence >= 1; unique per (show_id, slot_sequence)
      - name: planned_start_at
        type: datetime
        source: input
        description: planned on-air start of the segment
      - name: planned_end_at
        type: datetime
        source: input
        description: planned on-air end of the segment
        constraints: planned_end_at > planned_start_at; both inside [Show.scheduled_start_at, Show.scheduled_end_at]
      - name: planned_qty
        type: integer
        source: input
        description: units the merchandiser intends to sell in this segment
        constraints: planned_qty >= 1
      - name: unit_cost_snapshot_cents
        type: integer
        source: system
        description: Product.unit_cost_cents copied at slot creation; used by the PROVISIONAL margin variant
      - name: replay_marker_offset_sec
        type: integer
        source: system
        description: seconds from replay start where the time-stamped product link is anchored
        default: null
      - name: replay_product_link_url
        type: string
        source: system
        description: deep link attached to the replay marker
        default: null
      - name: replay_marker_status
        type: enum
        source: system
        description: NONE until a marker is set, DRAFT once set, PUBLISHED after publish
        constraints: one of {NONE, DRAFT, PUBLISHED}
        default: NONE
      - name: replay_conversions_count
        type: integer
        source: system
        description: number of replay conversions recorded against this slot's published marker
        default: 0
      - name: replay_attributed_revenue_cents
        type: integer
        source: computed
        description: sum of decay-weighted replay conversion revenue (see calculations.replay_attributed_revenue)
        default: 0

  - name: FlashOffer
    parent: null
    common_fields: true
    fields:
      - name: lineup_slot_id
        type: string
        source: input
        description: FK -> LineupSlot.id; the segment this offer prices
      - name: superseded_by_offer_id
        type: string
        source: system
        description: FK -> FlashOffer.id; set on the older offer when a newer offer is created against the same lineup slot
        default: null
      - name: offer_price_cents
        type: integer
        source: input
        description: flash price per unit in cents before any cart bundle discount
        constraints: 1 <= offer_price_cents <= Product.base_price_cents of the slot's product
      - name: window_start_at
        type: datetime
        source: input
        description: first instant the offer may be ACTIVE (inclusive)
      - name: window_end_at
        type: datetime
        source: input
        description: last instant the offer may be ACTIVE (inclusive — the window is a CLOSED interval)
        constraints: window_end_at > window_start_at
      - name: max_qty
        type: integer
        source: input
        description: hard allotment of units purchasable through this offer
        constraints: 1 <= max_qty <= 100000
      - name: held_qty
        type: integer
        source: computed
        description: sum of CartItem.qty over this offer's CartItem rows with state == HELD
        default: 0
      - name: sold_qty
        type: integer
        source: computed
        description: sum of CartItem.qty over this offer's CartItem rows with state == COMMITTED
        default: 0
      - name: remaining_qty
        type: integer
        source: computed
        description: max_qty - held_qty - sold_qty
        default: 0
      - name: status
        type: enum
        source: system
        description: lifecycle state; see state_machines.FlashOffer
        constraints: one of {SCHEDULED, ACTIVE, EXHAUSTED, EXPIRED, CANCELLED, SUPERSEDED}
        default: SCHEDULED
      - name: activated_at
        type: datetime
        source: system
        description: logical instant of SCHEDULED->ACTIVE
        default: null

  - name: DisclosureRecord
    parent: null
    common_fields: true
    fields:
      - name: show_id
        type: string
        source: input
        description: FK -> Show.id; the broadcast the disclosure belongs to
      - name: host_booking_id
        type: string
        source: input
        description: FK -> HostBooking.id; the booking whose host must speak the disclosure
      - name: disclosure_type
        type: enum
        source: input
        description: nature of the material connection being disclosed
        constraints: one of {PAID_ENDORSEMENT, MATERIAL_CONNECTION, FREE_PRODUCT}
      - name: required_script_code
        type: string
        source: input
        description: code of the approved on-air script the host must speak verbatim
      - name: status
        type: enum
        source: system
        description: lifecycle state; see state_machines.DisclosureRecord
        constraints: one of {PENDING, ACKNOWLEDGED, VOIDED}
        default: PENDING
      - name: acknowledged_at
        type: datetime
        source: system
        description: logical instant the host acknowledged the script
        default: null
      - name: acknowledged_late
        type: boolean
        source: computed
        description: true when acknowledged_at is not null and Show.went_live_at is not null and acknowledged_at > Show.went_live_at
        default: false

  - name: Cart
    parent: null
    common_fields: true
    fields:
      - name: show_id
        type: string
        source: input
        description: FK -> Show.id; the broadcast the cart was opened from
      - name: viewer_id
        type: string
        source: system
        description: FK -> Viewer.id; taken from X-User-ID of the Viewer that opened the cart, never from the body
      - name: status
        type: enum
        source: system
        description: lifecycle state; see state_machines.Cart
        constraints: one of {OPEN, ABANDONED, CHECKED_OUT, EXPIRED}
        default: OPEN
      - name: pre_discount_subtotal_cents
        type: integer
        source: computed
        description: sum of (CartItem.offer_unit_price_cents * CartItem.qty) over this cart's CartItem rows with state == HELD, evaluated BEFORE any bundle discount
        default: 0
      - name: bundle_discount_pct
        type: number
        source: computed
        description: tier fraction selected by calculations.cart_bundle_tier from pre_discount_subtotal_cents at the moment of the most recent add-item call
        default: 0.0
      - name: held_item_count
        type: integer
        source: computed
        description: count of this cart's CartItem rows with state == HELD
        default: 0
      - name: abandoned_at
        type: datetime
        source: system
        description: logical instant of OPEN->ABANDONED
        default: null
      - name: recovery_deadline_at
        type: datetime
        source: system
        description: abandoned_at + RECOVERY_WINDOW_MIN (20 minutes); recovery is refused at or after this instant
        default: null
      - name: recovered_count
        type: integer
        source: system
        description: number of ABANDONED->OPEN recoveries this cart has undergone
        default: 0
      - name: checked_out_at
        type: datetime
        source: system
        description: logical instant of OPEN->CHECKED_OUT
        default: null

  - name: CartItem
    parent: null
    common_fields: true
    fields:
      - name: cart_id
        type: string
        source: system
        description: FK -> Cart.id; taken from the path of POST /carts/{cart_id}/items
      - name: flash_offer_id
        type: string
        source: input
        description: FK -> FlashOffer.id; the offer whose allotment this line draws from
      - name: lineup_slot_id
        type: string
        source: system
        description: FK -> LineupSlot.id; copied from the offer's slot so product and cost are reachable without traversing the offer
      - name: qty
        type: integer
        source: input
        description: units on this line
        constraints: 1 <= qty <= 20
      - name: list_unit_price_cents
        type: integer
        source: system
        description: Product.base_price_cents snapshot at add time
      - name: offer_unit_price_cents
        type: integer
        source: system
        description: FlashOffer.offer_price_cents snapshot at add time, before bundle discount
      - name: effective_unit_price_cents
        type: integer
        source: computed
        description: locked price per unit from calculations.flash_offer_effective_unit_price; never recomputed by later adds
      - name: line_gross_cents
        type: integer
        source: computed
        description: effective_unit_price_cents * qty
      - name: line_tax_cents
        type: integer
        source: computed
        description: round_half_up(line_gross_cents * TAX_RATE), rounded per line before any order-level sum
      - name: state
        type: enum
        source: system
        description: HELD while it occupies inventory and offer allotment, COMMITTED once checkout converts it, RELEASED once a release cascade frees it
        constraints: one of {HELD, COMMITTED, RELEASED}
        default: HELD
      - name: released_reason
        type: enum
        source: system
        description: why the hold was freed
        constraints: one of {OFFER_EXPIRED, OFFER_CANCELLED, CART_ABANDONED, ORDER_CANCELLED}
        default: null
      - name: released_at
        type: datetime
        source: system
        description: logical instant the hold was freed
        default: null

  - name: Order
    parent: null
    common_fields: true
    fields:
      - name: cart_id
        type: string
        source: system
        description: FK -> Cart.id; the cart checkout converted
      - name: show_id
        type: string
        source: system
        description: FK -> Show.id; copied from the cart
      - name: viewer_id
        type: string
        source: system
        description: FK -> Viewer.id; copied from the cart
      - name: payment_state
        type: enum
        source: system
        description: payment dimension of state_machines.Order, independent of fulfillment_state
        constraints: one of {AUTHORIZED, CAPTURED, VOIDED, REFUNDED}
        default: AUTHORIZED
      - name: fulfillment_state
        type: enum
        source: system
        description: fulfilment dimension of state_machines.Order, independent of payment_state
        constraints: one of {PENDING, ALLOCATED, CANCELLED}
        default: PENDING
      - name: merchandise_cents
        type: integer
        source: computed
        description: sum of CartItem.line_gross_cents over the COMMITTED lines of this order's cart
      - name: tax_cents
        type: integer
        source: computed
        description: sum of CartItem.line_tax_cents over the same lines (per-line rounding, then summed)
      - name: shipping_cents
        type: integer
        source: computed
        description: SHIPPING_FLAT_CENTS, or 0 when merchandise_cents >= FREE_SHIP_THRESHOLD_CENTS
      - name: total_cents
        type: integer
        source: computed
        description: merchandise_cents + tax_cents + shipping_cents
      - name: host_commission_accrued_cents
        type: integer
        source: computed
        description: round_half_up(merchandise_cents * Host.commission_pct) of the show's PRIMARY booking host, stamped at capture
        default: 0
      - name: refunded_cents
        type: integer
        source: system
        description: total_cents refunded when a CAPTURED order is cancelled; 0 otherwise
        default: 0
      - name: captured_at
        type: datetime
        source: system
        description: logical instant of payment AUTHORIZED->CAPTURED
        default: null
      - name: cancelled_at
        type: datetime
        source: system
        description: logical instant of the cancel transition
        default: null
      - name: cancel_reason
        type: string
        source: system
        description: reason recorded on the cancel transition
        default: null

  - name: Interaction
    parent: null
    common_fields: true
    fields:
      - name: show_id
        type: string
        source: input
        description: FK -> Show.id; the broadcast the interaction belongs to
      - name: viewer_id
        type: string
        source: system
        description: FK -> Viewer.id; X-User-ID of the Viewer that submitted a CHAT or QUESTION; null for POLL
        default: null
      - name: host_id
        type: string
        source: system
        description: FK -> Host.id; X-User-ID of the Host that opened a POLL; null for CHAT and QUESTION
        default: null
      - name: kind
        type: enum
        source: input
        description: interaction family; determines the applicable transition set
        constraints: one of {CHAT, QUESTION, POLL}
      - name: body
        type: string
        source: input
        description: chat text, question text, or poll prompt
      - name: state
        type: enum
        source: system
        description: lifecycle state; see state_machines.Interaction
        constraints: one of {PENDING_MODERATION, APPROVED, BLOCKED, QUEUED, ROUTED, DEFERRED, ANSWERED, WITHDRAWN, OPEN, CLOSED}
        default: PENDING_MODERATION
      - name: moderated_at
        type: datetime
        source: system
        description: logical instant of the moderate decision
        default: null
      - name: blocked_reason
        type: string
        source: system
        description: moderator-supplied reason on a BLOCK decision
        default: null
      - name: routed_at
        type: datetime
        source: system
        description: logical instant of the most recent QUEUED->ROUTED
        default: null
      - name: defer_count
        type: integer
        source: system
        description: number of times a routed question has been deferred back to the queue
        default: 0
      - name: answered_at
        type: datetime
        source: system
        description: logical instant of ROUTED->ANSWERED
        default: null
      - name: answer_body
        type: string
        source: system
        description: host answer text
        default: null
      - name: options
        type: array
        source: input
        description: poll option labels; required for kind POLL, forbidden otherwise
        constraints: 2 <= length <= 4 when kind == POLL
        default: null
      - name: tallies
        type: object
        source: computed
        description: map of option index (as string) to vote count; initialised to zeros when a POLL is created
        default: null
      - name: voted_viewer_ids
        type: array
        source: system
        description: Viewer ids that have already voted on this poll; enforces one vote per viewer
        default: null
      - name: vote_count
        type: integer
        source: computed
        description: sum of tallies values
        default: 0

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Show
    initial_state: DRAFT
    terminal_states: [SETTLED]
    transitions:
      - from: DRAFT
        to: READY
        trigger: "POST /shows/{show_id}/ready"
        actor: ShowProducer
        preconditions:
          - "Show.status == DRAFT"
          - "count(LineupSlot WHERE show_id == Show.id) >= 1 — otherwise ERR_LINEUP_EMPTY"
          - "exactly one HostBooking WHERE show_id == Show.id AND role == PRIMARY AND status == CONFIRMED — otherwise ERR_PRIMARY_HOST_MISSING"
          - "that PRIMARY booking's Host.certification_status == CERTIFIED — otherwise ERR_HOST_CERTIFICATION_EXPIRED"
          - "count(DisclosureRecord WHERE show_id == Show.id AND status == PENDING) == 0 — otherwise ERR_DISCLOSURE_NOT_ACKNOWLEDGED"
          - "every Product referenced by LineupSlot.product_id of this show has claim_substantiation_status == SUBSTANTIATED — otherwise ERR_CLAIM_NOT_SUBSTANTIATED"
          - "count(StreamChannel WHERE show_id == Show.id AND status == PROVISIONED) >= 1 — otherwise ERR_SIMULCAST_NOT_READY"
        side_effects:
          - "recompute Show.simulcast_readiness_index via calculations.simulcast_readiness_index"
          - "set Show.readiness_checked_at = logical now"
          - "increment Show.version by 1"
      - from: READY
        to: LIVE
        trigger: "POST /shows/{show_id}/go-live"
        actor: ShowProducer
        preconditions:
          - "Show.status == READY"
          - "logical now >= Show.scheduled_start_at minus GO_LIVE_EARLY_MAX_MIN (30 minutes) and logical now < Show.scheduled_end_at — otherwise ERR_GO_LIVE_WINDOW_CLOSED"
          - "Show.simulcast_readiness_index (recomputed first) >= GO_LIVE_MIN_INDEX — otherwise ERR_SIMULCAST_NOT_READY"
          - "the PRIMARY HostBooking is still status == CONFIRMED — otherwise ERR_PRIMARY_HOST_MISSING"
        side_effects:
          - "set Show.went_live_at = logical now"
          - "every StreamChannel of this show with status == PROVISIONED transitions PROVISIONED -> LIVE"
          - "increment Show.version by 1"
        note: "The index gate is a >= comparison: exactly GO_LIVE_MIN_INDEX passes."
      - from: READY
        to: DRAFT
        trigger: "system — cascade from HostBooking CONFIRMED->CANCELLED on the PRIMARY booking, or from a StreamChannel health report that leaves zero channels in {PROVISIONED, LIVE}"
        actor: system
        preconditions:
          - "Show.status == READY"
        side_effects:
          - "every FlashOffer with status == SCHEDULED whose lineup_slot_id belongs to this show transitions SCHEDULED -> CANCELLED (cascade link 2)"
          - "each such cancelled offer releases its HELD CartItem rows with released_reason = OFFER_CANCELLED (cascade link 3)"
          - "each such release decrements Product.reserved_qty and recomputes Product.available_qty (cascade link 4)"
          - "set Show.readiness_checked_at = logical now"
          - "increment Show.version by 1"
      - from: LIVE
        to: ENDED
        trigger: "POST /shows/{show_id}/end"
        actor: ShowProducer
        preconditions:
          - "Show.status == LIVE"
        side_effects:
          - "set Show.ended_at = logical now"
          - "every StreamChannel of this show with status == LIVE transitions LIVE -> ENDED"
          - "every HostBooking of this show with status == CONFIRMED transitions CONFIRMED -> COMPLETED"
          - "every FlashOffer of this show with status in {SCHEDULED, ACTIVE, EXHAUSTED} transitions to EXPIRED (cascade link 1)"
          - "each expiring offer releases every CartItem of that offer with state == HELD, setting state = RELEASED and released_reason = OFFER_EXPIRED (cascade link 2)"
          - "each released line decrements Product.reserved_qty, recomputes Product.available_qty, and decrements FlashOffer.held_qty (cascade link 2 side ledger)"
          - "any Cart with status == OPEN that holds at least one CartItem and whose CartItem rows are now all state == RELEASED transitions OPEN -> ABANDONED with abandoned_at = logical now and recovery_deadline_at = abandoned_at + RECOVERY_WINDOW_MIN (20 minutes) (cascade link 3)"
          - "each such abandonment increments Show.abandoned_cart_count and recomputes Show.abandonment_rate_bp (cascade link 4)"
          - "recompute Show.margin_provisional_cents via calculations.show_margin_analysis variant PROVISIONAL"
          - "recompute Show.pending_question_count"
          - "increment Show.version by 1"
      - from: ENDED
        to: SETTLED
        trigger: "POST /shows/{show_id}/compliance-signoff"
        actor: ComplianceOfficer
        preconditions:
          - "Show.status == ENDED"
          - "count(Order WHERE show_id == Show.id AND payment_state == AUTHORIZED) == 0 — otherwise ERR_INVALID_ORDER_STATE"
          - "X-User-ID differs from Product.substantiated_by_user_id of every Product merchandised by this show's LineupSlot rows — otherwise ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "set Show.settled_at = logical now and Show.compliance_signoff_by_user_id = X-User-ID"
          - "compute and stamp Show.margin_final_cents via calculations.show_margin_analysis variant FINAL"
          - "every Cart of this show with status == ABANDONED and recovery_deadline_at <= logical now transitions ABANDONED -> EXPIRED"
          - "recompute Show.abandoned_cart_count and Show.abandonment_rate_bp"
          - "increment Show.version by 1"

  - entity: HostBooking
    initial_state: PENDING
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /host-bookings/{booking_id}/confirm"
        actor: Host
        preconditions:
          - "HostBooking.status == PENDING"
          - "X-User-ID == HostBooking.host_id — otherwise ERR_NOT_RESOURCE_OWNER"
          - "Show.status in {DRAFT, READY} — otherwise ERR_INVALID_SHOW_STATE"
          - "Host.certification_status == CERTIFIED — otherwise ERR_HOST_CERTIFICATION_EXPIRED"
        side_effects:
          - "set HostBooking.confirmed_at = logical now"
          - "increment HostBooking.version by 1"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /host-bookings/{booking_id}/cancel"
        actor: ShowProducer | Host
        preconditions:
          - "HostBooking.status == PENDING"
          - "Show.status in {DRAFT, READY} — otherwise ERR_INVALID_SHOW_STATE"
        side_effects:
          - "set HostBooking.cancel_reason and increment version by 1"
          - "every DisclosureRecord WHERE host_booking_id == HostBooking.id AND status == PENDING transitions PENDING -> VOIDED"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /host-bookings/{booking_id}/cancel"
        actor: ShowProducer | Host
        preconditions:
          - "HostBooking.status == CONFIRMED"
          - "Show.status in {DRAFT, READY} — otherwise ERR_INVALID_SHOW_STATE"
        side_effects:
          - "set HostBooking.cancel_reason and increment version by 1 (cascade link 1)"
          - "every DisclosureRecord WHERE host_booking_id == HostBooking.id AND status == PENDING transitions PENDING -> VOIDED"
          - "when HostBooking.role == PRIMARY and Show.status == READY, the show loses its confirmed primary host and transitions READY -> DRAFT (cascade link 2)"
          - "that READY -> DRAFT transition cancels every SCHEDULED FlashOffer on this show's lineup slots (cascade link 3)"
          - "each cancelled offer releases its HELD CartItem rows with released_reason = OFFER_CANCELLED, decrementing Product.reserved_qty and FlashOffer.held_qty (cascade link 4)"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "system — cascade from Show LIVE->ENDED"
        actor: system
        preconditions:
          - "HostBooking.status == CONFIRMED"
        side_effects:
          - "increment HostBooking.version by 1"

  - entity: StreamChannel
    initial_state: DRAFT
    terminal_states: [ENDED]
    transitions:
      - from: DRAFT
        to: PROVISIONED
        trigger: "POST /stream-channels/{channel_id}/provision"
        actor: ShowProducer
        preconditions:
          - "StreamChannel.status == DRAFT"
          - "Show.status in {DRAFT, READY} — otherwise ERR_INVALID_SHOW_STATE"
        side_effects:
          - "increment StreamChannel.version by 1"
      - from: FAILED
        to: PROVISIONED
        trigger: "POST /stream-channels/{channel_id}/provision"
        actor: ShowProducer
        preconditions:
          - "StreamChannel.status == FAILED"
          - "Show.status in {DRAFT, READY} — otherwise ERR_INVALID_SHOW_STATE"
        side_effects:
          - "increment StreamChannel.version by 1"
          - "recompute Show.simulcast_readiness_index"
        note: "Re-provisioning closes the PROVISIONED -> FAILED -> PROVISIONED cycle."
      - from: PROVISIONED
        to: LIVE
        trigger: "system — cascade from Show READY->LIVE"
        actor: system
        preconditions:
          - "StreamChannel.status == PROVISIONED"
        side_effects:
          - "increment StreamChannel.version by 1"
      - from: PROVISIONED
        to: FAILED
        trigger: "POST /stream-channels/{channel_id}/health-reports with a report whose recomputed readiness_index < CHANNEL_FAIL_INDEX"
        actor: system
        preconditions:
          - "StreamChannel.status == PROVISIONED"
          - "recomputed StreamChannel.readiness_index < CHANNEL_FAIL_INDEX"
        side_effects:
          - "recompute Show.simulcast_readiness_index over the remaining channels in {PROVISIONED, LIVE}"
          - "when Show.status == READY and zero channels remain in {PROVISIONED, LIVE}, the show transitions READY -> DRAFT"
          - "increment StreamChannel.version by 1"
      - from: LIVE
        to: FAILED
        trigger: "POST /stream-channels/{channel_id}/health-reports with a report whose recomputed readiness_index < CHANNEL_FAIL_INDEX"
        actor: system
        preconditions:
          - "StreamChannel.status == LIVE"
          - "recomputed StreamChannel.readiness_index < CHANNEL_FAIL_INDEX"
        side_effects:
          - "recompute Show.simulcast_readiness_index"
          - "increment StreamChannel.version by 1"
        note: "A LIVE show is never reverted by a channel failure; only READY shows revert."
      - from: LIVE
        to: ENDED
        trigger: "system — cascade from Show LIVE->ENDED"
        actor: system
        preconditions:
          - "StreamChannel.status == LIVE"
        side_effects:
          - "increment StreamChannel.version by 1"

  - entity: DisclosureRecord
    initial_state: PENDING
    terminal_states: [ACKNOWLEDGED, VOIDED]
    transitions:
      - from: PENDING
        to: ACKNOWLEDGED
        trigger: "POST /disclosure-records/{record_id}/acknowledge"
        actor: Host
        preconditions:
          - "DisclosureRecord.status == PENDING"
          - "X-User-ID == HostBooking.host_id of DisclosureRecord.host_booking_id — otherwise ERR_NOT_RESOURCE_OWNER"
          - "HostBooking.status in {PENDING, CONFIRMED} — otherwise ERR_INVALID_BOOKING_STATE"
          - "Show.status in {DRAFT, READY, LIVE} — otherwise ERR_INVALID_SHOW_STATE"
          - "script_code_spoken == DisclosureRecord.required_script_code — otherwise ERR_INVALID_REQUEST"
        side_effects:
          - "set DisclosureRecord.acknowledged_at = logical now"
          - "recompute DisclosureRecord.acknowledged_late (true when Show.went_live_at is not null and acknowledged_at > Show.went_live_at)"
          - "increment DisclosureRecord.version by 1"
      - from: PENDING
        to: VOIDED
        trigger: "system — cascade from HostBooking cancel"
        actor: system
        preconditions:
          - "DisclosureRecord.status == PENDING"
        side_effects:
          - "increment DisclosureRecord.version by 1"

  - entity: FlashOffer
    initial_state: SCHEDULED
    terminal_states: [EXPIRED, CANCELLED, SUPERSEDED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /flash-offers/{offer_id}/activate"
        actor: MerchandisingManager
        preconditions:
          - "FlashOffer.status == SCHEDULED"
          - "Show.status == LIVE for the show of FlashOffer -> LineupSlot.show_id — otherwise ERR_INVALID_SHOW_STATE"
          - "FlashOffer.window_start_at <= logical now <= FlashOffer.window_end_at (closed interval) — otherwise ERR_OFFER_WINDOW_CLOSED"
          - "Product.claim_substantiation_status == SUBSTANTIATED for the slot's product — otherwise ERR_CLAIM_NOT_SUBSTANTIATED"
        side_effects:
          - "set FlashOffer.activated_at = logical now"
          - "recompute FlashOffer.remaining_qty = max_qty - held_qty - sold_qty"
          - "increment FlashOffer.version by 1"
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system — the hold created by POST /carts/{cart_id}/items or the commit performed by POST /carts/{cart_id}/checkout drives remaining_qty to 0"
        actor: system
        preconditions:
          - "FlashOffer.status == ACTIVE"
          - "recomputed FlashOffer.remaining_qty == 0"
        side_effects:
          - "increment FlashOffer.version by 1"
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system — a release cascade (order cancel) returns allotment while the window is still open"
        actor: system
        preconditions:
          - "FlashOffer.status == EXHAUSTED"
          - "recomputed FlashOffer.remaining_qty >= 1"
          - "logical now <= FlashOffer.window_end_at"
          - "Show.status == LIVE"
        side_effects:
          - "increment FlashOffer.version by 1"
        note: "Closes the ACTIVE -> EXHAUSTED -> ACTIVE cycle. When the window has already closed or the show is no longer LIVE, the offer stays EXHAUSTED."
      - from: SCHEDULED
        to: SUPERSEDED
        trigger: "system — POST /flash-offers creates a newer offer against the same lineup_slot_id"
        actor: system
        preconditions:
          - "FlashOffer.status == SCHEDULED"
        side_effects:
          - "set FlashOffer.superseded_by_offer_id = id of the newly created offer"
          - "increment FlashOffer.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system — cascade from Show READY->DRAFT"
        actor: system
        preconditions:
          - "FlashOffer.status == SCHEDULED"
        side_effects:
          - "every CartItem of this offer with state == HELD becomes RELEASED with released_reason = OFFER_CANCELLED"
          - "decrement Product.reserved_qty and FlashOffer.held_qty by each released qty; recompute Product.available_qty and FlashOffer.remaining_qty"
          - "increment FlashOffer.version by 1"
      - from: SCHEDULED
        to: EXPIRED
        trigger: "system — cascade from Show LIVE->ENDED"
        actor: system
        preconditions:
          - "FlashOffer.status == SCHEDULED"
        side_effects:
          - "increment FlashOffer.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system — cascade from Show LIVE->ENDED"
        actor: system
        preconditions:
          - "FlashOffer.status == ACTIVE"
        side_effects:
          - "every CartItem of this offer with state == HELD becomes RELEASED with released_reason = OFFER_EXPIRED (cascade link 2 of the show-end chain)"
          - "decrement Product.reserved_qty and FlashOffer.held_qty by each released qty; recompute Product.available_qty and FlashOffer.remaining_qty"
          - "increment FlashOffer.version by 1"
      - from: EXHAUSTED
        to: EXPIRED
        trigger: "system — cascade from Show LIVE->ENDED"
        actor: system
        preconditions:
          - "FlashOffer.status == EXHAUSTED"
        side_effects:
          - "every CartItem of this offer with state == HELD becomes RELEASED with released_reason = OFFER_EXPIRED"
          - "decrement Product.reserved_qty and FlashOffer.held_qty by each released qty"
          - "increment FlashOffer.version by 1"

  - entity: Cart
    initial_state: OPEN
    terminal_states: [CHECKED_OUT, EXPIRED]
    transitions:
      - from: OPEN
        to: CHECKED_OUT
        trigger: "POST /carts/{cart_id}/checkout"
        actor: Viewer
        preconditions:
          - "Cart.status == OPEN"
          - "X-User-ID == Cart.viewer_id — otherwise ERR_NOT_RESOURCE_OWNER"
          - "expected_cart_version == Cart.version — otherwise ERR_STALE_CART_VERSION (see concurrency_rules.cart-checkout-stale-cart)"
          - "Show.status == LIVE — otherwise ERR_INVALID_SHOW_STATE"
          - "count(CartItem WHERE cart_id == Cart.id AND state == HELD) >= 1 — otherwise ERR_EMPTY_CART"
        side_effects:
          - "every HELD CartItem of this cart becomes state = COMMITTED"
          - "for each committed line: Product.reserved_qty -= qty and Product.committed_qty += qty (Product.available_qty unchanged)"
          - "for each committed line: FlashOffer.held_qty -= qty and FlashOffer.sold_qty += qty (remaining_qty unchanged)"
          - "create one Order with payment_state = AUTHORIZED, fulfillment_state = PENDING and the monetary fields from calculations.order_totals"
          - "set Cart.checked_out_at = logical now and recompute held_item_count, pre_discount_subtotal_cents"
          - "recompute Show.abandonment_rate_bp (the denominator counts every cart of the show)"
          - "increment Cart.version by 1"
      - from: OPEN
        to: ABANDONED
        trigger: "POST /carts/{cart_id}/abandon"
        actor: Viewer | MerchandisingManager
        preconditions:
          - "Cart.status == OPEN"
        side_effects:
          - "every HELD CartItem becomes RELEASED with released_reason = CART_ABANDONED"
          - "decrement Product.reserved_qty and FlashOffer.held_qty per released line; recompute Product.available_qty and FlashOffer.remaining_qty"
          - "any FlashOffer that was EXHAUSTED and now has remaining_qty >= 1 transitions EXHAUSTED -> ACTIVE when its window is still open and the show is LIVE"
          - "set Cart.abandoned_at = logical now and Cart.recovery_deadline_at = abandoned_at + RECOVERY_WINDOW_MIN (20 minutes)"
          - "increment Show.abandoned_cart_count and recompute Show.abandonment_rate_bp"
          - "increment Cart.version by 1"
      - from: OPEN
        to: ABANDONED
        trigger: "system — cascade from FlashOffer -> EXPIRED releasing every remaining HELD line of the cart (show-end chain link 3)"
        actor: system
        preconditions:
          - "Cart.status == OPEN"
          - "count(CartItem WHERE cart_id == Cart.id) >= 1 AND every CartItem of this cart has state == RELEASED after the offer-expiry releases (a cart that never held a line stays OPEN)"
        side_effects:
          - "set Cart.abandoned_at = logical now and Cart.recovery_deadline_at = abandoned_at + RECOVERY_WINDOW_MIN (20 minutes)"
          - "increment Show.abandoned_cart_count and recompute Show.abandonment_rate_bp (show-end chain link 4)"
          - "increment Cart.version by 1"
      - from: ABANDONED
        to: OPEN
        trigger: "POST /carts/{cart_id}/recover"
        actor: Viewer | MerchandisingManager
        preconditions:
          - "Cart.status == ABANDONED"
          - "logical now < Cart.recovery_deadline_at — otherwise ERR_RECOVERY_WINDOW_CLOSED"
          - "at least one RELEASED CartItem of this cart whose FlashOffer.status == ACTIVE AND FlashOffer.remaining_qty >= qty AND Product.available_qty >= qty — otherwise ERR_NO_RECOVERABLE_ITEMS"
        side_effects:
          - "every RELEASED CartItem meeting the eligibility predicate returns to state = HELD in ascending created_at order, clearing released_reason and released_at"
          - "each re-held line re-locks effective_unit_price_cents, line_gross_cents and line_tax_cents at the CURRENT bundle tier via calculations.flash_offer_effective_unit_price"
          - "ineligible RELEASED lines stay RELEASED"
          - "increment Product.reserved_qty and FlashOffer.held_qty per re-held line; recompute available_qty and remaining_qty; any offer whose remaining_qty reaches 0 transitions ACTIVE -> EXHAUSTED"
          - "increment Cart.recovered_count by 1; clear abandoned_at and recovery_deadline_at"
          - "decrement Show.abandoned_cart_count and recompute Show.abandonment_rate_bp"
          - "increment Cart.version by 1"
      - from: ABANDONED
        to: EXPIRED
        trigger: "system — cascade from Show ENDED->SETTLED when Cart.recovery_deadline_at <= logical now"
        actor: system
        preconditions:
          - "Cart.status == ABANDONED"
          - "Cart.recovery_deadline_at <= logical now"
        side_effects:
          - "increment Cart.version by 1"

  - entity: Order
    initial_state: "AUTHORIZED / PENDING (payment_state / fulfillment_state)"
    terminal_states: [VOIDED, REFUNDED]
    transitions:
      - from: AUTHORIZED
        to: CAPTURED
        trigger: "POST /orders/{order_id}/capture"
        actor: MerchandisingManager
        preconditions:
          - "Order.payment_state == AUTHORIZED"
          - "Show.status in {LIVE, ENDED} — otherwise ERR_INVALID_SHOW_STATE"
        side_effects:
          - "dimension payment_state: AUTHORIZED -> CAPTURED, set captured_at = logical now"
          - "dimension fulfillment_state: PENDING -> ALLOCATED (the two dimensions are stored independently; cancel can move fulfillment without moving payment)"
          - "stamp Order.host_commission_accrued_cents = round_half_up(merchandise_cents * Host.commission_pct) of the show's PRIMARY booking host"
          - "recompute Show.gross_merchandise_cents and Show.margin_provisional_cents"
          - "increment Order.version by 1"
      - from: AUTHORIZED
        to: VOIDED
        trigger: "POST /orders/{order_id}/cancel"
        actor: MerchandisingManager | Viewer
        preconditions:
          - "Order.payment_state == AUTHORIZED"
        side_effects:
          - "dimension payment_state: AUTHORIZED -> VOIDED; refunded_cents stays 0; cancelled_at = logical now"
          - "dimension fulfillment_state: PENDING -> CANCELLED"
          - "every COMMITTED CartItem of Order.cart_id becomes RELEASED with released_reason = ORDER_CANCELLED"
          - "Product.committed_qty -= qty per released line; recompute available_qty"
          - "FlashOffer.sold_qty -= qty per released line; recompute remaining_qty"
          - "any offer that was EXHAUSTED and now has remaining_qty >= 1 transitions EXHAUSTED -> ACTIVE when its window is open and the show is LIVE"
          - "Show.gross_merchandise_cents is unchanged (a never-captured order was never in it)"
          - "increment Order.version by 1"
      - from: CAPTURED
        to: REFUNDED
        trigger: "POST /orders/{order_id}/cancel"
        actor: MerchandisingManager | Viewer
        preconditions:
          - "Order.payment_state == CAPTURED"
        side_effects:
          - "dimension payment_state: CAPTURED -> REFUNDED; set refunded_cents = total_cents; cancelled_at = logical now"
          - "dimension fulfillment_state: ALLOCATED -> CANCELLED"
          - "reset Order.host_commission_accrued_cents to 0"
          - "every COMMITTED CartItem of Order.cart_id becomes RELEASED with released_reason = ORDER_CANCELLED"
          - "Product.committed_qty -= qty per released line; FlashOffer.sold_qty -= qty per released line; recompute available_qty and remaining_qty"
          - "any offer that was EXHAUSTED and now has remaining_qty >= 1 transitions EXHAUSTED -> ACTIVE when its window is open and the show is LIVE"
          - "recompute Show.gross_merchandise_cents and Show.margin_provisional_cents (the refunded order leaves both aggregates)"
          - "increment Order.version by 1"
        note: "Same trigger, two branches with divergent side-effect sets: the AUTHORIZED branch never touches money aggregates, the CAPTURED branch reverses them."

  - entity: Interaction
    initial_state: "PENDING_MODERATION for kind in {CHAT, QUESTION}; OPEN for kind == POLL"
    terminal_states: [APPROVED, BLOCKED, ANSWERED, WITHDRAWN, CLOSED]
    transitions:
      - from: PENDING_MODERATION
        to: APPROVED
        trigger: "POST /interactions/{interaction_id}/moderate with action == APPROVE and kind == CHAT"
        actor: Moderator
        preconditions:
          - "Interaction.state == PENDING_MODERATION"
          - "Interaction.kind == CHAT"
        side_effects:
          - "set moderated_at = logical now; increment Interaction.version by 1"
      - from: PENDING_MODERATION
        to: QUEUED
        trigger: "POST /interactions/{interaction_id}/moderate with action == APPROVE and kind == QUESTION"
        actor: Moderator
        preconditions:
          - "Interaction.state == PENDING_MODERATION"
          - "Interaction.kind == QUESTION"
        side_effects:
          - "set moderated_at = logical now"
          - "increment Show.pending_question_count by 1"
          - "increment Interaction.version by 1"
      - from: PENDING_MODERATION
        to: BLOCKED
        trigger: "POST /interactions/{interaction_id}/moderate with action == BLOCK"
        actor: Moderator
        preconditions:
          - "Interaction.state == PENDING_MODERATION"
          - "Interaction.kind in {CHAT, QUESTION}"
        side_effects:
          - "set blocked_reason and moderated_at (cascade link 1)"
          - "increment Viewer.strike_count by 1 for Interaction.viewer_id (cascade link 2, caused by the block)"
          - "when the incremented strike_count >= MUTE_STRIKE_THRESHOLD (2), that Viewer.chat_status flips ACTIVE -> MUTED and muted_until = logical now + MUTE_DURATION_MIN (15 minutes) (cascade link 3, caused by the increment)"
          - "the mute withdraws every other Interaction of that viewer whose state is in {PENDING_MODERATION, QUEUED, ROUTED, DEFERRED}, setting state = WITHDRAWN (cascade link 4, caused by the mute)"
          - "each withdrawn QUESTION recomputes Show.pending_question_count (cascade link 5)"
          - "increment Interaction.version by 1"
      - from: QUEUED
        to: ROUTED
        trigger: "POST /interactions/{interaction_id}/route"
        actor: Moderator
        preconditions:
          - "Interaction.state == QUEUED"
          - "Interaction.kind == QUESTION"
          - "Show.status == LIVE — otherwise ERR_INVALID_SHOW_STATE"
        side_effects:
          - "set routed_at = logical now; increment Interaction.version by 1"
      - from: ROUTED
        to: ANSWERED
        trigger: "POST /interactions/{interaction_id}/host-action with action == ANSWER"
        actor: Host
        preconditions:
          - "Interaction.state == ROUTED"
          - "X-User-ID == HostBooking.host_id of the show's PRIMARY CONFIRMED booking — otherwise ERR_NOT_RESOURCE_OWNER"
        side_effects:
          - "set answered_at = logical now and answer_body"
          - "decrement Show.pending_question_count by 1"
          - "increment Interaction.version by 1"
      - from: ROUTED
        to: DEFERRED
        trigger: "POST /interactions/{interaction_id}/host-action with action == DEFER"
        actor: Host
        preconditions:
          - "Interaction.state == ROUTED"
          - "X-User-ID == HostBooking.host_id of the show's PRIMARY CONFIRMED booking — otherwise ERR_NOT_RESOURCE_OWNER"
          - "Interaction.defer_count < MAX_DEFERRALS (2) — otherwise ERR_DEFERRAL_LIMIT_REACHED"
        side_effects:
          - "increment Interaction.defer_count by 1"
          - "increment Interaction.version by 1"
      - from: DEFERRED
        to: QUEUED
        trigger: "system — same request as the DEFER host-action, applied unconditionally after the defer_count increment"
        actor: system
        preconditions:
          - "Interaction.state == DEFERRED"
          - "Interaction.defer_count <= MAX_DEFERRALS (2)"
        side_effects:
          - "clear routed_at"
          - "increment Interaction.version by 1"
        note: "Closes the bounded QUEUED -> ROUTED -> DEFERRED -> QUEUED cycle: the question is always requeued after a DEFER, and the cycle terminates because the third DEFER (defer_count already 2) is refused with ERR_DEFERRAL_LIMIT_REACHED, leaving the question ROUTED until the host ANSWERs it. A single host-action DEFER request therefore returns state QUEUED with defer_count incremented and version incremented twice."
      - from: PENDING_MODERATION
        to: WITHDRAWN
        trigger: "system — cascade from the mute of Interaction.viewer_id"
        actor: system
        preconditions:
          - "Interaction.state == PENDING_MODERATION"
        side_effects:
          - "increment Interaction.version by 1"
      - from: QUEUED
        to: WITHDRAWN
        trigger: "system — cascade from the mute of Interaction.viewer_id"
        actor: system
        preconditions:
          - "Interaction.state == QUEUED"
        side_effects:
          - "recompute Show.pending_question_count"
          - "increment Interaction.version by 1"
      - from: ROUTED
        to: WITHDRAWN
        trigger: "system — cascade from the mute of Interaction.viewer_id"
        actor: system
        preconditions:
          - "Interaction.state == ROUTED"
        side_effects:
          - "recompute Show.pending_question_count"
          - "increment Interaction.version by 1"
      - from: DEFERRED
        to: WITHDRAWN
        trigger: "system — cascade from the mute of Interaction.viewer_id"
        actor: system
        preconditions:
          - "Interaction.state == DEFERRED"
        side_effects:
          - "recompute Show.pending_question_count"
          - "increment Interaction.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /interactions/{interaction_id}/host-action with action == CLOSE_POLL"
        actor: Host
        preconditions:
          - "Interaction.state == OPEN"
          - "Interaction.kind == POLL"
          - "X-User-ID == Interaction.host_id — otherwise ERR_NOT_RESOURCE_OWNER"
        side_effects:
          - "freeze tallies and vote_count; increment Interaction.version by 1"
        note: "Votes are only accepted while a POLL is OPEN; POST /interactions/{id}/votes against a CLOSED poll is refused with ERR_POLL_NOT_OPEN."

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent entity's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: flash-offer-create-stale-slot
    parent_entity: LineupSlot
    write_endpoint: "POST /flash-offers"
    occ_field: "expected_lineup_slot_version"
    description: |
      Creating a FlashOffer against a LineupSlot whose version has advanced since
      the client last read it is refused. A newer offer legitimately supersedes any
      SCHEDULED offer on the same slot (SCHEDULED -> SUPERSEDED), so a create issued
      from a stale view of the slot would silently retire pricing the client never
      saw. The stale-version check turns that into a deterministic rejection.
    error_id: ERR_STALE_LINEUP_SLOT_VERSION
    http_status: 412
  - rule_id: cart-checkout-stale-cart
    parent_entity: Cart
    write_endpoint: "POST /carts/{cart_id}/checkout"
    occ_field: "expected_cart_version"
    description: |
      Checking out a Cart whose version has advanced since the client last read it
      is refused. Every add-item, abandon and recover call bumps Cart.version and
      re-locks line pricing, so a checkout carrying an older version would convert
      a basket whose totals the client never observed.
    error_id: ERR_STALE_CART_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: cart_bundle_tier
    trigger: "evaluated inside POST /carts/{cart_id}/items and inside the re-lock step of POST /carts/{cart_id}/recover, before any per-unit discount is applied"
    algorithm: threshold
    formula: |
      # pre_discount_subtotal_cents is computed FIRST and uses UNDISCOUNTED offer prices,
      # including the line being added, so the tier can never depend on its own output.
      pre_discount_subtotal_cents =
          sum( item.offer_unit_price_cents * item.qty
               for item in CartItem WHERE cart_id == cart.id AND state == HELD )
        + incoming_offer.offer_price_cents * incoming_qty
      if pre_discount_subtotal_cents >= TIER2_FLOOR_CENTS: bundle_discount_pct = TIER2_PCT
      elif pre_discount_subtotal_cents >= TIER1_FLOOR_CENTS: bundle_discount_pct = TIER1_PCT
      else: bundle_discount_pct = 0.00
    input_set: "CartItem rows of this cart with state == HELD only; RELEASED and COMMITTED lines are excluded. During recovery the eligible re-held lines are the HELD set and are processed in ascending created_at order, each line seeing the subtotal of the lines already re-held."
    constants:
      TIER1_FLOOR_CENTS: 5000
      TIER1_PCT: 0.05
      TIER2_FLOOR_CENTS: 15000
      TIER2_PCT: 0.10
    precision: "bundle_discount_pct is an exact 2-decimal fraction; comparisons are >= (a subtotal of exactly 5000 is TIER1, exactly 15000 is TIER2)"

  - name: flash_offer_effective_unit_price
    trigger: "POST /carts/{cart_id}/items (locks the line price) and the re-lock step of POST /carts/{cart_id}/recover"
    algorithm: constraint_propagation
    formula: |
      # Circular-looking dependency, pinned to a single evaluation order:
      #   step 1: pre_discount_subtotal_cents  (calculations.cart_bundle_tier, undiscounted prices)
      #   step 2: bundle_discount_pct = tier(pre_discount_subtotal_cents)
      #   step 3: effective_unit_price_cents = round_half_up(offer_unit_price_cents * (1 - bundle_discount_pct))
      #   step 4: line_gross_cents = effective_unit_price_cents * qty
      # The tier is NEVER re-derived from the discounted subtotal, and lines already
      # HELD keep the effective price they locked at their own add time — a later add
      # that lifts the cart into a higher tier does not reprice earlier lines.
      effective_unit_price_cents = round_half_up(offer_unit_price_cents * (1 - bundle_discount_pct))
      line_gross_cents          = effective_unit_price_cents * qty
      line_tax_cents            = round_half_up(line_gross_cents * TAX_RATE)
    input_set: "exactly one CartItem — the line being added or re-held; its offer_unit_price_cents is the FlashOffer.offer_price_cents snapshot and its list_unit_price_cents is the Product.base_price_cents snapshot"
    constants:
      TAX_RATE: 0.0875
    precision: "round_half_up to whole cents at step 3 (per unit) and at line_tax_cents (per line); no intermediate float is carried into step 4"
    variants:
      - name: add_time_lock
        when: "POST /carts/{cart_id}/items"
        difference: "the tier is derived from the subtotal that includes only lines already HELD plus this new line"
      - name: recovery_relock
        when: "POST /carts/{cart_id}/recover"
        difference: "the tier is re-derived from the lines being re-held in ascending created_at order, so a recovered cart can price a line differently than it did before abandonment"

  - name: order_totals
    trigger: "POST /carts/{cart_id}/checkout, over the CartItem rows the checkout moves HELD -> COMMITTED"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED: tax is rounded PER LINE and the rounded line taxes
      # are then summed. Summing the gross first and rounding once
      # (round_half_up(sum(line_gross) * TAX_RATE)) is explicitly NOT the rule and
      # produces a different cent total for the same basket.
      merchandise_cents = sum( item.line_gross_cents for item in committed_lines )
      tax_cents         = sum( round_half_up(item.line_gross_cents * TAX_RATE) for item in committed_lines )
      shipping_cents    = 0 if merchandise_cents >= FREE_SHIP_THRESHOLD_CENTS else SHIPPING_FLAT_CENTS
      total_cents       = merchandise_cents + tax_cents + shipping_cents
    input_set: "CartItem rows of this cart with state == HELD at the instant of checkout (they become COMMITTED); RELEASED lines are excluded from every term"
    constants:
      TAX_RATE: 0.0875
      SHIPPING_FLAT_CENTS: 599
      FREE_SHIP_THRESHOLD_CENTS: 7500
    precision: "whole cents; round_half_up per line for tax; the free-shipping comparison is >= (merchandise_cents of exactly 7500 ships free)"

  - name: show_margin_analysis
    trigger: "GET /shows/{show_id}/analytics (either variant on demand), the LIVE->ENDED transition and every Order capture/refund (PROVISIONAL, stamped into Show.margin_provisional_cents), and the ENDED->SETTLED transition (FINAL, stamped into Show.margin_final_cents)"
    algorithm: aggregation
    formula: |
      # PROVISIONAL variant
      merchandise_revenue_cents = sum( o.merchandise_cents
            for o in Order WHERE show_id == show.id
                             AND payment_state IN {AUTHORIZED, CAPTURED}
                             AND fulfillment_state != CANCELLED )
      cogs_cents = sum( slot.unit_cost_snapshot_cents * item.qty
            for item in CartItem WHERE state == COMMITTED
                                   AND item.cart_id IN (the carts of those orders)
                                 joined to slot = LineupSlot[item.lineup_slot_id] )
      host_commission_cents = round_half_up(merchandise_revenue_cents * primary_host.commission_pct)
      return_provision_cents = 0
      margin_cents = merchandise_revenue_cents - cogs_cents - host_commission_cents

      # FINAL variant
      merchandise_revenue_cents = sum( o.merchandise_cents
            for o in Order WHERE show_id == show.id
                             AND payment_state == CAPTURED
                             AND fulfillment_state != CANCELLED )
      cogs_cents = sum( Product[slot.product_id].unit_cost_cents * item.qty ... )   # CURRENT cost, not the slot snapshot
      net_of_returns_cents   = round_half_up(merchandise_revenue_cents * (1 - RETURN_PROVISION_PCT))
      return_provision_cents = merchandise_revenue_cents - net_of_returns_cents
      host_commission_cents  = round_half_up(net_of_returns_cents * primary_host.commission_pct)
      margin_cents           = net_of_returns_cents - cogs_cents - host_commission_cents
    input_set: "PROVISIONAL includes AUTHORIZED and CAPTURED orders and values cost at LineupSlot.unit_cost_snapshot_cents; FINAL includes CAPTURED orders only and values cost at the product's current unit_cost_cents. Both exclude fulfillment_state == CANCELLED. `primary_host` is the Host of the HostBooking of this show with role == PRIMARY and status in {CONFIRMED, COMPLETED}; when no such booking exists, commission is 0."
    constants:
      RETURN_PROVISION_PCT: 0.06
    precision: "whole cents; FINAL rounds net_of_returns_cents first (round_half_up) and computes commission from that ROUNDED value — commission is never taken on the unrounded product"
    variants:
      - name: PROVISIONAL
        when: "the show has not been signed off (status in {LIVE, ENDED}) or GET /shows/{show_id}/analytics is called with variant=PROVISIONAL"
        difference: "counts still-authorised revenue, uses the cost snapshot taken at slot creation, and takes no return provision — so it reports a higher margin than FINAL for identical data"
      - name: FINAL
        when: "the ENDED->SETTLED transition, or GET /shows/{show_id}/analytics with variant=FINAL"
        difference: "drops non-captured revenue, revalues COGS at the product's current unit_cost_cents, deducts RETURN_PROVISION_PCT, and takes commission on the net-of-returns figure"

  - name: host_effectiveness_score
    trigger: "GET /hosts/{host_id}/performance (variant selected by the `variant` query field, default LIVE_WINDOW); the returned score is stamped into Host.effectiveness_score_live or Host.effectiveness_score_attributed"
    algorithm: weighted_scoring
    formula: |
      # counted over the shows the host worked as PRIMARY (status in {CONFIRMED, COMPLETED}),
      # optionally narrowed to one show by the `show_id` query field
      live_orders_count   = count( Order WHERE show_id IN scope
                                        AND payment_state IN {AUTHORIZED, CAPTURED}
                                        AND fulfillment_state != CANCELLED )
      unique_cart_count   = count( Cart WHERE show_id IN scope )        # every cart ever opened on the show
      replay_conversions  = sum( slot.replay_conversions_count for slot in LineupSlot WHERE show_id IN scope )
      answered_questions  = count( Interaction WHERE show_id IN scope AND kind == QUESTION AND state == ANSWERED )
      poll_votes          = sum( interaction.vote_count for interaction WHERE show_id IN scope AND kind == POLL )
      late_ack_count      = count( DisclosureRecord WHERE show_id IN scope AND acknowledged_late == true )
      unsubstantiated     = 1 if any Product merchandised in scope has claim_substantiation_status != SUBSTANTIATED else 0

      effective_orders = live_orders_count                                   # LIVE_WINDOW
      effective_orders = live_orders_count + REPLAY_ORDER_WEIGHT * replay_conversions   # ATTRIBUTED_72H

      conversion_component = min(100, round_half_up(100 * effective_orders / max(1, unique_cart_count)))
      engagement_component = min(100, ANSWER_POINTS * answered_questions + VOTE_POINTS * poll_votes)
      compliance_component = max(0, 100 - LATE_ACK_PENALTY * late_ack_count - UNSUBSTANTIATED_PENALTY * unsubstantiated)
      effectiveness_score  = round_half_up( W_CONVERSION * conversion_component
                                          + W_ENGAGEMENT * engagement_component
                                          + W_COMPLIANCE * compliance_component )
    input_set: "scope = the Show ids where this host holds a PRIMARY booking with status in {CONFIRMED, COMPLETED}, intersected with the `show_id` query field when supplied. Orders with fulfillment_state == CANCELLED are excluded from live_orders_count; carts are counted in every status."
    constants:
      W_CONVERSION: 0.5
      W_ENGAGEMENT: 0.3
      W_COMPLIANCE: 0.2
      ANSWER_POINTS: 10
      VOTE_POINTS: 2
      LATE_ACK_PENALTY: 25
      UNSUBSTANTIATED_PENALTY: 50
      REPLAY_ORDER_WEIGHT: 0.5
    precision: "each component is an integer 0-100 (round_half_up inside conversion_component); the weighted sum is rounded once, round_half_up, at the end"
    variants:
      - name: LIVE_WINDOW
        when: "variant is omitted or equals LIVE_WINDOW"
        difference: "effective_orders counts only orders placed during the broadcast; replay conversions are ignored entirely"
      - name: ATTRIBUTED_72H
        when: "variant == ATTRIBUTED_72H"
        difference: "each replay conversion adds REPLAY_ORDER_WEIGHT of an order to the conversion numerator, so the same data yields a strictly higher (or equal) score than LIVE_WINDOW"

  - name: simulcast_readiness_index
    trigger: "POST /stream-channels/{channel_id}/health-reports (per channel), and recomputed for the whole show on DRAFT->READY, on READY->LIVE, and on every channel status change"
    algorithm: weighted_scoring
    formula: |
      # per channel — three inputs interacting non-linearly through max()/min() and a
      # platform-conditional branch
      latency_penalty = max(0, (channel.latency_ms - LATENCY_TARGET_MS) / LATENCY_STEP_MS)
      frame_penalty   = channel.dropped_frame_pct * FRAME_PENALTY_FACTOR
      spread_ms       = max(c.latency_ms for c in reported_channels) - min(c.latency_ms for c in reported_channels)
      drift_penalty   = 0 if channel.platform == "PARTNER_APP"
                        else max(0, spread_ms - SIMULCAST_DRIFT_TOLERANCE_MS) / DRIFT_STEP_MS
      channel.readiness_index = max(0, min(100, 100 - round_half_up(latency_penalty + frame_penalty + drift_penalty)))

      # show level
      Show.simulcast_readiness_index = min( c.readiness_index
                                            for c in StreamChannel WHERE show_id == show.id
                                                              AND status IN {PROVISIONED, LIVE} )
                                       or 0 when that set is empty
    input_set: "reported_channels = StreamChannel rows of the show with status in {PROVISIONED, LIVE} and latency_ms != null; a single health report recomputes readiness_index for every member of that set, not only the reporting channel. A channel that has never reported keeps readiness_index 0 and is excluded from spread_ms but still floors the show index at 0 when it is PROVISIONED."
    constants:
      LATENCY_TARGET_MS: 1500
      LATENCY_STEP_MS: 50
      FRAME_PENALTY_FACTOR: 400
      SIMULCAST_DRIFT_TOLERANCE_MS: 800
      DRIFT_STEP_MS: 100
      GO_LIVE_MIN_INDEX: 70
      CHANNEL_FAIL_INDEX: 40
    precision: "the three penalty terms are carried as exact decimals, summed, and the SUM is rounded once with round_half_up before subtraction from 100; the gates are `>= GO_LIVE_MIN_INDEX` and `< CHANNEL_FAIL_INDEX`"

  - name: inventory_pool_reconciliation
    trigger: "every hold (POST /carts/{cart_id}/items), commit (checkout), release (offer expiry/cancel, cart abandon, order cancel), re-hold (cart recover) and inventory adjustment"
    algorithm: aggregation
    formula: |
      Product.reserved_qty  = sum(item.qty for item in CartItem WHERE lineup_slot_id -> product_id == product.id AND state == HELD)
      Product.committed_qty = sum(item.qty for item in CartItem WHERE lineup_slot_id -> product_id == product.id AND state == COMMITTED)
      Product.available_qty = Product.on_hand_qty - Product.reserved_qty - Product.committed_qty
      FlashOffer.held_qty      = sum(item.qty for item in CartItem WHERE flash_offer_id == offer.id AND state == HELD)
      FlashOffer.sold_qty      = sum(item.qty for item in CartItem WHERE flash_offer_id == offer.id AND state == COMMITTED)
      FlashOffer.remaining_qty = FlashOffer.max_qty - FlashOffer.held_qty - FlashOffer.sold_qty
      # conserved quantities (invariants that MUST hold after every request):
      #   INV-1 units:  Product.on_hand_qty == Product.available_qty + Product.reserved_qty + Product.committed_qty
      #   INV-2 allotment: FlashOffer.max_qty == FlashOffer.remaining_qty + FlashOffer.held_qty + FlashOffer.sold_qty
    input_set: "CartItem rows in state HELD or COMMITTED only; RELEASED rows contribute to no term. Inventory adjustments change on_hand_qty and therefore available_qty, never reserved_qty or committed_qty."
    constants:
      MAX_CART_DISTINCT_ITEMS: 3
    precision: "integer units; no rounding. A hold->release pair must return available_qty to its exact pre-hold value (INV-1), and a checkout->cancel pair must return remaining_qty to its exact pre-checkout value (INV-2)."

  - name: replay_attributed_revenue
    trigger: "POST /lineup-slots/{slot_id}/replay-conversions"
    algorithm: decay_function
    formula: |
      hours_since_end = (occurred_at - Show.ended_at) in whole hours, floor
      weight = 1.0  if hours_since_end <= DECAY_T1_HOURS
             = 0.6  elif hours_since_end <= DECAY_T2_HOURS
             = 0.3  elif hours_since_end <= DECAY_T3_HOURS
             = 0.0  else
      LineupSlot.replay_attributed_revenue_cents += round_half_up(net_revenue_cents * weight)
      LineupSlot.replay_conversions_count        += 1        # counted even when weight == 0.0
      Show.replay_attributed_revenue_cents        = sum over the show's slots
    input_set: "one conversion event per call; occurred_at MUST be >= Show.ended_at (otherwise ERR_INVALID_REQUEST) and the slot's replay_marker_status MUST be PUBLISHED (otherwise ERR_REPLAY_MARKER_NOT_PUBLISHED)"
    constants:
      DECAY_T1_HOURS: 24
      DECAY_T2_HOURS: 48
      DECAY_T3_HOURS: 72
    precision: "whole cents, round_half_up per conversion before accumulation; the boundaries are inclusive (exactly 24 hours still weights 1.0, exactly 48 weights 0.6, exactly 72 weights 0.3, 73 weights 0.0)"

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in priority order; the first
# failing row decides the response, so a request violating rows 8 and 20 returns
# row 8's error_id)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present, and X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's §1.5 roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "for entity_backed roles, X-User-ID equals the owning key of the target resource — Viewer: Cart.viewer_id / Order.viewer_id / Interaction.viewer_id; Host: HostBooking.host_id, the host_booking_id's host for a disclosure acknowledge, Interaction.host_id for a poll close, and the show's PRIMARY CONFIRMED booking host for a question host-action"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /carts/{cart_id}/items, POST /carts/{cart_id}/abandon, POST /carts/{cart_id}/recover, POST /carts/{cart_id}/checkout, POST /orders/{order_id}/cancel, POST /host-bookings/{booking_id}/confirm, POST /host-bookings/{booking_id}/cancel, POST /disclosure-records/{record_id}/acknowledge, POST /interactions/{interaction_id}/host-action"
  - priority: 4
    category: existence
    check: "every id in the path exists, validated left to right"
    error_id: "ERR_SHOW_NOT_FOUND | ERR_HOST_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_VIEWER_NOT_FOUND | ERR_STREAM_CHANNEL_NOT_FOUND | ERR_HOST_BOOKING_NOT_FOUND | ERR_LINEUP_SLOT_NOT_FOUND | ERR_FLASH_OFFER_NOT_FOUND | ERR_DISCLOSURE_RECORD_NOT_FOUND | ERR_CART_NOT_FOUND | ERR_CART_ITEM_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_INTERACTION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 5
    category: existence
    check: "every foreign key supplied in the body references an existing row (show_id, host_id, product_id, lineup_slot_id, flash_offer_id, host_booking_id, viewer_id)"
    error_id: "ERR_SHOW_NOT_FOUND | ERR_HOST_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_LINEUP_SLOT_NOT_FOUND | ERR_FLASH_OFFER_NOT_FOUND | ERR_HOST_BOOKING_NOT_FOUND | ERR_VIEWER_NOT_FOUND"
    http_status: 404
    applies_to: "POST /host-bookings, POST /lineup-slots, POST /flash-offers, POST /stream-channels, POST /disclosure-records, POST /carts, POST /carts/{cart_id}/items, POST /interactions, POST /lineup-slots/{slot_id}/replay-conversions"
  - priority: 6
    category: business_constraint
    check: "required body fields are present, enums are members of their declared sets, numbers respect their declared ranges, datetimes are ISO 8601 UTC with three fractional digits or a Z-suffixed second precision, and ordering constraints hold (scheduled_end_at > scheduled_start_at, release_time_at > call_time_at, window_end_at > window_start_at, planned_end_at > planned_start_at, offer_price_cents <= the slot product's base_price_cents, 1 <= qty <= 20, poll options length 2-4, script_code_spoken equals required_script_code, occurred_at >= Show.ended_at)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 7
    category: state
    check: "expected_<parent>_version equals the parent's current version (see §1.2.1)"
    error_id: "ERR_STALE_LINEUP_SLOT_VERSION | ERR_STALE_CART_VERSION"
    http_status: 412
    applies_to: "POST /flash-offers, POST /carts/{cart_id}/checkout"
  - priority: 8
    category: state
    check: "the target resource is in a state from which this transition exists (Show.status, HostBooking.status, StreamChannel.status, FlashOffer.status, Cart.status, Order.payment_state, Interaction.state, DisclosureRecord.status)"
    error_id: "ERR_INVALID_SHOW_STATE | ERR_INVALID_BOOKING_STATE | ERR_INVALID_CHANNEL_STATE | ERR_INVALID_OFFER_STATE | ERR_INVALID_CART_STATE | ERR_INVALID_ORDER_STATE | ERR_INVALID_INTERACTION_STATE | ERR_INVALID_DISCLOSURE_STATE"
    http_status: 409
    applies_to: "every state-transition endpoint"
  - priority: 9
    category: state
    check: "the related entity whose state gates this operation is in the required state — the show must be LIVE for offer activate, add-item, checkout, interaction submit / moderate / route / host-action / vote and order capture; the booking's show must be in {DRAFT, READY} for confirm/cancel/provision; the show must be in {DRAFT, READY, LIVE} for disclosure-record create and acknowledge; the show must be in {ENDED, SETTLED} for replay-marker set, replay-marker publish and replay conversions (the replay only exists once the broadcast is off air); and the offer of a line being added must be ACTIVE"
    error_id: "ERR_INVALID_SHOW_STATE | ERR_OFFER_NOT_ACTIVE | ERR_SHOW_NOT_ENDED"
    http_status: 409
    applies_to: "POST /flash-offers/{offer_id}/activate, POST /carts/{cart_id}/items, POST /carts/{cart_id}/checkout, POST /host-bookings/{booking_id}/confirm, POST /stream-channels/{channel_id}/provision, POST /lineup-slots/{slot_id}/replay-marker, POST /lineup-slots/{slot_id}/replay-marker/publish, POST /lineup-slots/{slot_id}/replay-conversions, POST /disclosure-records, POST /disclosure-records/{record_id}/acknowledge, POST /interactions, POST /interactions/{interaction_id}/moderate, POST /interactions/{interaction_id}/route, POST /interactions/{interaction_id}/host-action, POST /interactions/{interaction_id}/votes, POST /orders/{order_id}/capture"
  - priority: 10
    category: business_safety
    check: "the Product whose claim will be broadcast or sold has claim_substantiation_status == SUBSTANTIATED"
    error_id: ERR_CLAIM_NOT_SUBSTANTIATED
    http_status: 422
    applies_to: "POST /shows/{show_id}/ready, POST /flash-offers/{offer_id}/activate, POST /carts/{cart_id}/items"
  - priority: 11
    category: business_safety
    check: "no DisclosureRecord of the show is still PENDING"
    error_id: ERR_DISCLOSURE_NOT_ACKNOWLEDGED
    http_status: 422
    applies_to: "POST /shows/{show_id}/ready"
  - priority: 12
    category: business_safety
    check: "the acting or booked Host has certification_status == CERTIFIED (disclosure_certification_expires_at >= logical now)"
    error_id: ERR_HOST_CERTIFICATION_EXPIRED
    http_status: 422
    applies_to: "POST /host-bookings/{booking_id}/confirm, POST /shows/{show_id}/ready"
  - priority: 13
    category: business_safety
    check: "the ComplianceOfficer signing off the show is not the officer recorded in Product.substantiated_by_user_id of any product this show merchandised"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /shows/{show_id}/compliance-signoff"
  - priority: 14
    category: business_temporal
    check: "HOST INTERVAL SEMANTICS — half-open [call_time_at, release_time_at) expanded by a HOST_TURNAROUND_BUFFER_MIN = 45 minute buffer on BOTH sides: reject when new.call_time_at < existing.release_time_at + 45min AND existing.call_time_at < new.release_time_at + 45min, over HostBooking rows of the same host_id with status in {PENDING, CONFIRMED}. A gap of exactly 45 minutes is accepted; 44 minutes is rejected."
    error_id: ERR_HOST_BOOKING_OVERLAP
    http_status: 409
    applies_to: "POST /host-bookings"
  - priority: 15
    category: business_temporal
    check: "OFFER INTERVAL SEMANTICS — CLOSED [window_start_at, window_end_at] with zero buffer: reject when new.window_start_at <= existing.window_end_at AND existing.window_start_at <= new.window_end_at, over FlashOffer rows with status in {SCHEDULED, ACTIVE, EXHAUSTED} whose lineup slot points at the SAME product_id (across every show). Touching endpoints collide — a new window starting at the exact instant an existing window ends is rejected."
    error_id: ERR_OFFER_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /flash-offers"
  - priority: 16
    category: business_temporal
    check: "logical now is inside the offer's closed window [window_start_at, window_end_at]"
    error_id: ERR_OFFER_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /flash-offers/{offer_id}/activate, POST /carts/{cart_id}/items"
  - priority: 17
    category: business_temporal
    check: "logical now is inside [Show.scheduled_start_at - GO_LIVE_EARLY_MAX_MIN (30 minutes), Show.scheduled_end_at)"
    error_id: ERR_GO_LIVE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /shows/{show_id}/go-live"
  - priority: 18
    category: business_temporal
    check: "logical now < Cart.recovery_deadline_at"
    error_id: ERR_RECOVERY_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /carts/{cart_id}/recover"
  - priority: 19
    category: business_referential
    check: "the FlashOffer being added belongs, via LineupSlot.show_id, to the same show as the Cart"
    error_id: ERR_OFFER_SHOW_MISMATCH
    http_status: 422
    applies_to: "POST /carts/{cart_id}/items"
  - priority: 20
    category: business_referential
    check: "at most one HostBooking per show has role == PRIMARY with status in {PENDING, CONFIRMED}; a second PRIMARY booking is rejected"
    error_id: ERR_PRIMARY_HOST_CONFLICT
    http_status: 409
    applies_to: "POST /host-bookings"
  - priority: 21
    category: business_referential
    check: "exactly one HostBooking of the show has role == PRIMARY and status == CONFIRMED"
    error_id: ERR_PRIMARY_HOST_MISSING
    http_status: 422
    applies_to: "POST /shows/{show_id}/ready, POST /shows/{show_id}/go-live"
  - priority: 22
    category: business_constraint
    check: "the show has at least one LineupSlot"
    error_id: ERR_LINEUP_EMPTY
    http_status: 422
    applies_to: "POST /shows/{show_id}/ready"
  - priority: 23
    category: business_constraint
    check: "at least one StreamChannel of the show is PROVISIONED (readiness gate at ready) and Show.simulcast_readiness_index >= GO_LIVE_MIN_INDEX (readiness gate at go-live)"
    error_id: ERR_SIMULCAST_NOT_READY
    http_status: 422
    applies_to: "POST /shows/{show_id}/ready, POST /shows/{show_id}/go-live"
  - priority: 24
    category: business_constraint
    check: "the acting Viewer's chat_status is ACTIVE, or muted_until <= logical now (in which case the viewer is auto-unmuted before the interaction is accepted)"
    error_id: ERR_VIEWER_MUTED
    http_status: 403
    applies_to: "POST /interactions, POST /interactions/{interaction_id}/votes"
  - priority: 25
    category: business_constraint
    check: "the poll is state == OPEN and the acting Viewer's id is absent from voted_viewer_ids, and option_index is a valid index into options"
    error_id: "ERR_POLL_NOT_OPEN | ERR_DUPLICATE_VOTE"
    http_status: 409
    applies_to: "POST /interactions/{interaction_id}/votes"
  - priority: 26
    category: business_constraint
    check: "host-action DEFER is refused once Interaction.defer_count has already reached MAX_DEFERRALS = 2; the question stays ROUTED and the host must ANSWER it"
    error_id: ERR_DEFERRAL_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /interactions/{interaction_id}/host-action"
  - priority: 27
    category: business_constraint
    check: "the replay marker exists and is PUBLISHED before conversions may be recorded, and marker_offset_sec is within [0, floor((Show.ended_at - Show.went_live_at) in seconds)]"
    error_id: "ERR_REPLAY_MARKER_NOT_PUBLISHED | ERR_MARKER_OFFSET_OUT_OF_RANGE"
    http_status: "409 | 422"
    applies_to: "POST /lineup-slots/{slot_id}/replay-marker, POST /lineup-slots/{slot_id}/replay-conversions"
  - priority: 28
    category: business_constraint
    check: "the cart has at least one HELD line at checkout, and at least one recoverable line at recover"
    error_id: "ERR_EMPTY_CART | ERR_NO_RECOVERABLE_ITEMS"
    http_status: "422 | 409"
    applies_to: "POST /carts/{cart_id}/checkout, POST /carts/{cart_id}/recover"
  - priority: 29
    category: business_fiscal
    check: "the cart holds fewer than MAX_CART_DISTINCT_ITEMS = 3 lines in state HELD before the add"
    error_id: ERR_CART_ITEM_LIMIT
    http_status: 422
    applies_to: "POST /carts/{cart_id}/items"
  - priority: 30
    category: business_fiscal
    check: "FlashOffer.remaining_qty >= requested qty"
    error_id: ERR_OFFER_QTY_EXCEEDED
    http_status: 422
    applies_to: "POST /carts/{cart_id}/items, POST /carts/{cart_id}/recover"
  - priority: 31
    category: business_fiscal
    check: "Product.available_qty >= requested qty"
    error_id: ERR_INSUFFICIENT_INVENTORY
    http_status: 422
    applies_to: "POST /carts/{cart_id}/items, POST /carts/{cart_id}/recover, POST /products/{product_id}/inventory-adjustments"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- logical clock (test-driving surface) ---------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. The clock's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint every rule that reads `logical now` observes that default and never the real wall clock."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: datetime, previous_utc: datetime }
    side_effects: ["all subsequent `logical now` reads return current_utc", "no entity is mutated and no lazy transition fires"]

  # --- Host ----------------------------------------------------------------
  - method: POST
    path: "/hosts"
    description: "Registers on-air talent."
    roles: [ShowProducer, PlatformAdmin]
    code: 201
    input: [full_name, handle, commission_pct]
    output: Host
    side_effects: ["certification_status initialised to UNCERTIFIED"]
  - method: GET
    path: "/hosts/{host_id}"
    description: "Reads one host, with certification_status recomputed against the logical clock."
    roles: [ShowProducer, MerchandisingManager, Moderator, ComplianceOfficer, Host, Viewer, PlatformAdmin]
    code: 200
    input: []
    output: Host
    side_effects: []
  - method: POST
    path: "/hosts/{host_id}/disclosure-certifications"
    description: "Records or renews the host's paid-endorsement disclosure certification."
    roles: [ComplianceOfficer]
    code: 200
    input: [certified_until]
    output: Host
    side_effects: ["sets Host.disclosure_certification_expires_at", "recomputes Host.certification_status", "increments Host.version by 1"]
  - method: GET
    path: "/hosts/{host_id}/performance"
    description: "Computed read: host effectiveness score per calculations.host_effectiveness_score. `variant` defaults to LIVE_WINDOW; `show_id` narrows the scope to one show."
    roles: [ShowProducer, MerchandisingManager, PlatformAdmin]
    code: 200
    input: ["variant?", "show_id?"]
    output: { host_id: string, variant: string, live_orders_count: integer, replay_conversions_count: integer, unique_cart_count: integer, answered_questions_count: integer, poll_votes_count: integer, late_ack_count: integer, conversion_component: integer, engagement_component: integer, compliance_component: integer, effectiveness_score: integer }
    side_effects: ["stamps Host.effectiveness_score_live or Host.effectiveness_score_attributed depending on the variant"]

  # --- Product -------------------------------------------------------------
  - method: POST
    path: "/products"
    description: "Creates a merchandisable product with its on-hand inventory."
    roles: [MerchandisingManager]
    code: 201
    input: [sku, title, base_price_cents, unit_cost_cents, on_hand_qty, "claim_text?"]
    output: Product
    side_effects: ["reserved_qty and committed_qty initialised to 0, available_qty = on_hand_qty", "claim_substantiation_status initialised to UNSUBSTANTIATED"]
  - method: GET
    path: "/products/{product_id}"
    description: "Reads one product including the reconciled inventory pool."
    roles: [ShowProducer, MerchandisingManager, Moderator, ComplianceOfficer, Host, Viewer, PlatformAdmin]
    code: 200
    input: []
    output: Product
    side_effects: []
  - method: POST
    path: "/products/{product_id}/inventory-adjustments"
    description: "Adjusts on-hand units and/or revises the landed unit cost (the post-show cost revision the FINAL margin variant reads)."
    roles: [MerchandisingManager]
    code: 200
    input: [reason, "on_hand_delta?", "unit_cost_cents?"]
    output: Product
    side_effects: ["applies on_hand_delta to on_hand_qty", "replaces unit_cost_cents when supplied (LineupSlot.unit_cost_snapshot_cents is NOT touched)", "recomputes available_qty", "rejects an adjustment that would make available_qty negative with ERR_INSUFFICIENT_INVENTORY", "increments Product.version by 1"]
  - method: POST
    path: "/products/{product_id}/claim-substantiations"
    description: "Records a compliance decision on the product's on-air claim."
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "evidence_ref?"]
    output: Product
    side_effects: ["sets claim_substantiation_status to the decision", "on SUBSTANTIATED stamps substantiated_by_user_id = X-User-ID and substantiated_at = logical now", "on REJECTED clears substantiated_by_user_id and substantiated_at", "increments Product.version by 1"]

  # --- Viewer --------------------------------------------------------------
  - method: POST
    path: "/viewers"
    description: "Registers a shopping viewer."
    roles: [PlatformAdmin]
    code: 201
    input: [display_name, email]
    output: Viewer
    side_effects: ["chat_status initialised to ACTIVE with strike_count 0"]
  - method: GET
    path: "/viewers/{viewer_id}"
    description: "Reads one viewer including moderation strikes and mute window."
    roles: [ShowProducer, MerchandisingManager, Moderator, ComplianceOfficer, Host, Viewer, PlatformAdmin]
    code: 200
    input: []
    output: Viewer
    side_effects: []

  # --- Show ----------------------------------------------------------------
  - method: POST
    path: "/shows"
    description: "Creates a show on the broadcast calendar in DRAFT."
    roles: [ShowProducer]
    code: 201
    input: [title, scheduled_start_at, scheduled_end_at]
    output: Show
    side_effects: ["stamps created_by_user_id = X-User-ID", "all derived counters initialised to 0"]
  - method: GET
    path: "/shows/{show_id}"
    description: "Reads one show with every derived counter and margin field."
    roles: [ShowProducer, MerchandisingManager, Moderator, ComplianceOfficer, Host, Viewer, PlatformAdmin]
    code: 200
    input: []
    output: Show
    side_effects: []
  - method: POST
    path: "/shows/{show_id}/ready"
    description: "Runs the readiness gate and moves DRAFT -> READY."
    roles: [ShowProducer]
    code: 200
    input: []
    output: Show
    side_effects: ["see state_machines.Show DRAFT_to_READY", "recomputes simulcast_readiness_index", "increments Show.version by 1"]
  - method: POST
    path: "/shows/{show_id}/go-live"
    description: "Moves READY -> LIVE and takes every PROVISIONED channel LIVE."
    roles: [ShowProducer]
    code: 200
    input: []
    output: Show
    side_effects: ["see state_machines.Show READY_to_LIVE", "increments Show.version by 1"]
  - method: POST
    path: "/shows/{show_id}/end"
    description: "Ends the broadcast and runs the show-end release cascade."
    roles: [ShowProducer]
    code: 200
    input: []
    output: Show
    side_effects: ["see state_machines.Show LIVE_to_ENDED (depth-4 cascade)", "recomputes margin_provisional_cents", "increments Show.version by 1"]
  - method: POST
    path: "/shows/{show_id}/compliance-signoff"
    description: "Compliance sign-off; moves ENDED -> SETTLED, stamps the FINAL margin and expires stale abandoned carts. Segregation of duties: the signing officer must not be the officer who substantiated any merchandised product's claim."
    roles: [ComplianceOfficer]
    code: 200
    input: ["attestation_note?"]
    output: Show
    side_effects: ["see state_machines.Show ENDED_to_SETTLED", "stamps margin_final_cents", "increments Show.version by 1"]
  - method: GET
    path: "/shows/{show_id}/analytics"
    description: "Computed read: show margin analysis per calculations.show_margin_analysis. `variant` defaults to PROVISIONAL."
    roles: [ShowProducer, MerchandisingManager, PlatformAdmin]
    code: 200
    input: ["variant?"]
    output: { show_id: string, variant: string, order_count: integer, merchandise_revenue_cents: integer, cogs_cents: integer, return_provision_cents: integer, host_commission_cents: integer, margin_cents: integer, gross_merchandise_cents: integer, abandoned_cart_count: integer, abandonment_rate_bp: integer, replay_attributed_revenue_cents: integer }
    side_effects: ["when variant == PROVISIONAL the result is stamped into Show.margin_provisional_cents"]
  - method: GET
    path: "/stream-channels/{channel_id}"
    description: "One simulcast destination with its latest reported health metrics and readiness index."
    roles: [ShowProducer, MerchandisingManager, Moderator, ComplianceOfficer, Host, Viewer, PlatformAdmin]
    code: 200
    input: []
    output: StreamChannel
    side_effects: []
  - method: GET
    path: "/stream-channels"
    description: "Reverse lookup: filterable list of simulcast destinations; show_id yields the destinations of one show."
    roles: [ShowProducer, MerchandisingManager, Moderator, ComplianceOfficer, Host, Viewer, PlatformAdmin]
    code: 200
    input: ["show_id?", "status?", "limit?", "offset?"]
    output: StreamChannel[]
    side_effects: []

  # --- StreamChannel -------------------------------------------------------
  - method: POST
    path: "/stream-channels"
    description: "Adds a simulcast destination to a show in DRAFT."
    roles: [ShowProducer]
    code: 201
    input: [show_id, platform, target_latency_ms, "is_primary?"]
    output: StreamChannel
    side_effects: ["status initialised to DRAFT with readiness_index 0"]
  - method: POST
    path: "/stream-channels/{channel_id}/provision"
    description: "Provisions (or re-provisions after a failure) the destination."
    roles: [ShowProducer]
    code: 200
    input: []
    output: StreamChannel
    side_effects: ["see state_machines.StreamChannel DRAFT_to_PROVISIONED and FAILED_to_PROVISIONED", "increments StreamChannel.version by 1"]
  - method: POST
    path: "/stream-channels/{channel_id}/health-reports"
    description: "Reports glass-to-glass latency and dropped-frame fraction; recomputes the channel and show readiness indices and can fail the channel."
    roles: [ShowProducer, PlatformAdmin]
    code: 200
    input: [latency_ms, dropped_frame_pct]
    output: StreamChannel
    side_effects: ["stores latency_ms and dropped_frame_pct, increments health_report_count", "recomputes readiness_index for EVERY StreamChannel of the show in {PROVISIONED, LIVE} that has reported (a new report changes spread_ms and therefore every peer's drift penalty) and then Show.simulcast_readiness_index, per calculations.simulcast_readiness_index", "PROVISIONED/LIVE -> FAILED when readiness_index < CHANNEL_FAIL_INDEX, which can revert a READY show to DRAFT", "increments StreamChannel.version by 1"]

  # --- HostBooking ---------------------------------------------------------
  - method: POST
    path: "/host-bookings"
    description: "Books a host onto a show for a call-time interval."
    roles: [ShowProducer]
    code: 201
    input: [show_id, host_id, role, call_time_at, release_time_at, fee_cents]
    output: HostBooking
    side_effects: ["status initialised to PENDING", "runs the buffered half-open overlap check (validations priority 14)"]
  - method: GET
    path: "/host-bookings/{booking_id}"
    description: "Reads one booking."
    roles: [ShowProducer, MerchandisingManager, Moderator, ComplianceOfficer, Host, Viewer, PlatformAdmin]
    code: 200
    input: []
    output: HostBooking
    side_effects: []
  - method: GET
    path: "/host-bookings"
    description: "Reverse lookup: bookings filtered by show_id and/or host_id and/or status."
    roles: [ShowProducer, MerchandisingManager, Moderator, ComplianceOfficer, Host, Viewer, PlatformAdmin]
    code: 200
    input: ["show_id?", "host_id?", "status?", "limit?", "offset?"]
    output: HostBooking[]
    side_effects: []
  - method: POST
    path: "/host-bookings/{booking_id}/confirm"
    description: "The booked host accepts the booking."
    roles: [Host]
    code: 200
    input: []
    output: HostBooking
    side_effects: ["see state_machines.HostBooking PENDING_to_CONFIRMED", "increments HostBooking.version by 1"]
  - method: POST
    path: "/host-bookings/{booking_id}/cancel"
    description: "Cancels a booking; a cancelled PRIMARY booking reverts a READY show to DRAFT and cascades into offers and carts."
    roles: [ShowProducer, Host]
    code: 200
    input: [cancel_reason]
    output: HostBooking
    side_effects: ["see state_machines.HostBooking PENDING_to_CANCELLED and CONFIRMED_to_CANCELLED (depth-4 cascade)", "increments HostBooking.version by 1"]

  # --- LineupSlot ----------------------------------------------------------
  - method: POST
    path: "/lineup-slots"
    description: "Adds a product segment to a show's lineup and snapshots the product's unit cost."
    roles: [MerchandisingManager]
    code: 201
    input: [show_id, product_id, slot_sequence, planned_start_at, planned_end_at, planned_qty]
    output: LineupSlot
    side_effects: ["copies Product.unit_cost_cents into unit_cost_snapshot_cents", "replay_marker_status initialised to NONE", "increments Show.version by 1"]
  - method: GET
    path: "/lineup-slots/{slot_id}"
    description: "Reads one lineup slot including replay-marker and replay-attribution fields."
    roles: [ShowProducer, MerchandisingManager, Moderator, ComplianceOfficer, Host, Viewer, PlatformAdmin]
    code: 200
    input: []
    output: LineupSlot
    side_effects: []
  - method: GET
    path: "/lineup-slots"
    description: "Reverse lookup: slots filtered by show_id and/or product_id."
    roles: [ShowProducer, MerchandisingManager, Moderator, ComplianceOfficer, Host, Viewer, PlatformAdmin]
    code: 200
    input: ["show_id?", "product_id?", "limit?", "offset?"]
    output: LineupSlot[]
    side_effects: []
  - method: POST
    path: "/lineup-slots/{slot_id}/replay-marker"
    description: "Sets the time-stamped replay product link on the slot (marker goes to DRAFT); only allowed once the show has ENDED, because marker_offset_sec is validated against the aired duration."
    roles: [MerchandisingManager]
    code: 200
    input: [marker_offset_sec, product_link_url]
    output: LineupSlot
    side_effects: ["sets replay_marker_offset_sec, replay_product_link_url and replay_marker_status = DRAFT", "increments LineupSlot.version by 1"]
  - method: POST
    path: "/lineup-slots/{slot_id}/replay-marker/publish"
    description: "Publishes the replay marker; only allowed once the show has ENDED."
    roles: [MerchandisingManager]
    code: 200
    input: []
    output: LineupSlot
    side_effects: ["replay_marker_status DRAFT -> PUBLISHED", "increments LineupSlot.version by 1"]
  - method: POST
    path: "/lineup-slots/{slot_id}/replay-conversions"
    description: "Records one post-show conversion attributed to the slot's published replay marker; the revenue is decay-weighted per calculations.replay_attributed_revenue."
    roles: [MerchandisingManager]
    code: 201
    input: [viewer_id, net_revenue_cents, occurred_at]
    output: LineupSlot
    side_effects: ["increments replay_conversions_count", "adds the decay-weighted revenue to replay_attributed_revenue_cents", "recomputes Show.replay_attributed_revenue_cents", "increments LineupSlot.version by 1"]

  # --- FlashOffer ----------------------------------------------------------
  - method: POST
    path: "/flash-offers"
    description: "Creates a flash offer against a lineup slot. OCC: expected_lineup_slot_version must equal the slot's current version (§1.2.1 flash-offer-create-stale-slot)."
    roles: [MerchandisingManager]
    code: 201
    input: [lineup_slot_id, offer_price_cents, window_start_at, window_end_at, max_qty, expected_lineup_slot_version]
    output: FlashOffer
    side_effects: ["status initialised to SCHEDULED with remaining_qty = max_qty", "any existing SCHEDULED offer on the same slot transitions SCHEDULED -> SUPERSEDED with superseded_by_offer_id = the new offer id", "runs the closed-interval per-product window overlap check (validations priority 15)", "increments LineupSlot.version by 1"]
  - method: GET
    path: "/flash-offers/{offer_id}"
    description: "Reads one offer with the reconciled allotment ledger."
    roles: [ShowProducer, MerchandisingManager, Moderator, ComplianceOfficer, Host, Viewer, PlatformAdmin]
    code: 200
    input: []
    output: FlashOffer
    side_effects: []
  - method: GET
    path: "/flash-offers"
    description: "Reverse lookup: offers filtered by lineup_slot_id, by the offer that superseded them, and/or by status."
    roles: [ShowProducer, MerchandisingManager, Moderator, ComplianceOfficer, Host, Viewer, PlatformAdmin]
    code: 200
    input: ["lineup_slot_id?", "superseded_by_offer_id?", "status?", "limit?", "offset?"]
    output: FlashOffer[]
    side_effects: []
  - method: POST
    path: "/flash-offers/{offer_id}/activate"
    description: "Opens the offer for in-stream purchase; requires a LIVE show and logical now inside the closed window."
    roles: [MerchandisingManager]
    code: 200
    input: []
    output: FlashOffer
    side_effects: ["see state_machines.FlashOffer SCHEDULED_to_ACTIVE", "increments FlashOffer.version by 1"]

  # --- DisclosureRecord ----------------------------------------------------
  - method: POST
    path: "/disclosure-records"
    description: "Registers a required on-air disclosure for a booking; legal while the show is in {DRAFT, READY, LIVE} so an unplanned on-air paid mention can be papered mid-broadcast (an obligation registered after go-live is acknowledged late)."
    roles: [ShowProducer]
    code: 201
    input: [show_id, host_booking_id, disclosure_type, required_script_code]
    output: DisclosureRecord
    side_effects: ["status initialised to PENDING", "rejects a host_booking_id whose show_id differs from the body show_id with ERR_INVALID_REQUEST"]
  - method: GET
    path: "/disclosure-records/{record_id}"
    description: "Reads one disclosure record."
    roles: [ShowProducer, MerchandisingManager, Moderator, ComplianceOfficer, Host, Viewer, PlatformAdmin]
    code: 200
    input: []
    output: DisclosureRecord
    side_effects: []
  - method: GET
    path: "/disclosure-records"
    description: "Reverse lookup: disclosures filtered by show_id and/or host_booking_id and/or status."
    roles: [ShowProducer, MerchandisingManager, Moderator, ComplianceOfficer, Host, Viewer, PlatformAdmin]
    code: 200
    input: ["show_id?", "host_booking_id?", "status?", "limit?", "offset?"]
    output: DisclosureRecord[]
    side_effects: []
  - method: POST
    path: "/disclosure-records/{record_id}/acknowledge"
    description: "The booked host acknowledges the approved disclosure script verbatim."
    roles: [Host]
    code: 200
    input: [script_code_spoken]
    output: DisclosureRecord
    side_effects: ["see state_machines.DisclosureRecord PENDING_to_ACKNOWLEDGED", "computes acknowledged_late against Show.went_live_at", "increments DisclosureRecord.version by 1"]

  # --- Cart ----------------------------------------------------------------
  - method: POST
    path: "/carts"
    description: "Opens a persistent cart for the acting viewer on one show."
    roles: [Viewer]
    code: 201
    input: [show_id]
    output: Cart
    side_effects: ["viewer_id taken from X-User-ID", "status initialised to OPEN with recovered_count 0"]
  - method: GET
    path: "/carts/{cart_id}"
    description: "Reads one cart including the pre-discount subtotal and current bundle tier."
    roles: [ShowProducer, MerchandisingManager, Moderator, ComplianceOfficer, Host, Viewer, PlatformAdmin]
    code: 200
    input: []
    output: Cart
    side_effects: []
  - method: GET
    path: "/carts"
    description: "Reverse lookup: carts filtered by show_id and/or viewer_id and/or status — the abandonment-recovery worklist."
    roles: [ShowProducer, MerchandisingManager, ComplianceOfficer, Viewer, PlatformAdmin]
    code: 200
    input: ["show_id?", "viewer_id?", "status?", "limit?", "offset?"]
    output: Cart[]
    side_effects: []
  - method: POST
    path: "/carts/{cart_id}/items"
    description: "Adds a flash-offer line to the cart, locking the effective unit price and holding both offer allotment and physical inventory."
    roles: [Viewer]
    code: 201
    input: [flash_offer_id, qty]
    output: CartItem
    side_effects: ["creates a CartItem in state HELD with list/offer price snapshots", "runs calculations.cart_bundle_tier then calculations.flash_offer_effective_unit_price", "increments Product.reserved_qty and FlashOffer.held_qty; recomputes available_qty and remaining_qty", "ACTIVE -> EXHAUSTED when remaining_qty reaches 0", "recomputes Cart.pre_discount_subtotal_cents, bundle_discount_pct, held_item_count (at most MAX_CART_DISTINCT_ITEMS = 3 HELD lines per cart)", "increments Cart.version by 1"]
  - method: POST
    path: "/carts/{cart_id}/abandon"
    description: "Marks the cart abandoned, releasing every hold and opening the recovery window."
    roles: [Viewer, MerchandisingManager]
    code: 200
    input: []
    output: Cart
    side_effects: ["see state_machines.Cart OPEN_to_ABANDONED (explicit trigger)", "increments Cart.version by 1"]
  - method: POST
    path: "/carts/{cart_id}/recover"
    description: "Abandonment recovery: re-holds every still-eligible released line at the CURRENT bundle tier and reopens the cart."
    roles: [Viewer, MerchandisingManager]
    code: 200
    input: []
    output: Cart
    side_effects: ["see state_machines.Cart ABANDONED_to_OPEN", "re-locks effective prices", "increments Cart.recovered_count and Cart.version by 1"]
  - method: POST
    path: "/carts/{cart_id}/checkout"
    description: "In-stream checkout. OCC: expected_cart_version must equal the cart's current version (§1.2.1 cart-checkout-stale-cart)."
    roles: [Viewer]
    code: 201
    input: [expected_cart_version]
    output: Order
    side_effects: ["see state_machines.Cart OPEN_to_CHECKED_OUT", "creates the Order via calculations.order_totals", "moves holds to commitments in both ledgers", "increments Cart.version by 1"]

  # --- CartItem ------------------------------------------------------------
  - method: GET
    path: "/cart-items/{item_id}"
    description: "Reads one cart line with its locked pricing and hold state."
    roles: [ShowProducer, MerchandisingManager, Moderator, ComplianceOfficer, Host, Viewer, PlatformAdmin]
    code: 200
    input: []
    output: CartItem
    side_effects: []
  - method: GET
    path: "/cart-items"
    description: "Reverse lookup: lines filtered by cart_id, flash_offer_id, lineup_slot_id and/or state."
    roles: [ShowProducer, MerchandisingManager, Moderator, ComplianceOfficer, Host, Viewer, PlatformAdmin]
    code: 200
    input: ["cart_id?", "flash_offer_id?", "lineup_slot_id?", "state?", "limit?", "offset?"]
    output: CartItem[]
    side_effects: []

  # --- Order ---------------------------------------------------------------
  - method: GET
    path: "/orders/{order_id}"
    description: "Reads one order with both state dimensions and every monetary field."
    roles: [ShowProducer, MerchandisingManager, Moderator, ComplianceOfficer, Host, Viewer, PlatformAdmin]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: GET
    path: "/orders"
    description: "Reverse lookup: orders filtered by cart_id, show_id, viewer_id and/or payment_state."
    roles: [ShowProducer, MerchandisingManager, ComplianceOfficer, Viewer, PlatformAdmin]
    code: 200
    input: ["cart_id?", "show_id?", "viewer_id?", "payment_state?", "limit?", "offset?"]
    output: Order[]
    side_effects: []
  - method: POST
    path: "/orders/{order_id}/capture"
    description: "Captures payment and allocates fulfilment; accrues host commission and lifts the show's captured revenue."
    roles: [MerchandisingManager]
    code: 200
    input: []
    output: Order
    side_effects: ["see state_machines.Order AUTHORIZED_to_CAPTURED (both dimensions move)", "recomputes Show.gross_merchandise_cents and Show.margin_provisional_cents", "increments Order.version by 1"]
  - method: POST
    path: "/orders/{order_id}/cancel"
    description: "Cancels the order: a never-captured order is VOIDED, a captured order is REFUNDED, and both branches return allotment and inventory."
    roles: [MerchandisingManager, Viewer]
    code: 200
    input: [cancel_reason]
    output: Order
    side_effects: ["see state_machines.Order AUTHORIZED_to_VOIDED and CAPTURED_to_REFUNDED (divergent side-effect sets)", "releases COMMITTED lines and can restock an EXHAUSTED offer back to ACTIVE", "increments Order.version by 1"]

  # --- Interaction ---------------------------------------------------------
  - method: POST
    path: "/interactions"
    description: "Submits a viewer CHAT or QUESTION, or opens a host POLL. Viewers submit CHAT/QUESTION (state PENDING_MODERATION); a Host submits POLL with 2-4 options (state OPEN)."
    roles: [Viewer, Host]
    code: 201
    input: [show_id, kind, body, "options?"]
    output: Interaction
    side_effects: ["CHAT/QUESTION: viewer_id taken from X-User-ID, state PENDING_MODERATION", "POLL: host_id taken from X-User-ID, state OPEN, tallies initialised to zero per option", "auto-unmutes the acting viewer when chat_status == MUTED and muted_until <= logical now"]
  - method: GET
    path: "/interactions/{interaction_id}"
    description: "Reads one interaction with its moderation/routing state and poll tallies."
    roles: [ShowProducer, MerchandisingManager, Moderator, ComplianceOfficer, Host, Viewer, PlatformAdmin]
    code: 200
    input: []
    output: Interaction
    side_effects: []
  - method: GET
    path: "/interactions"
    description: "Reverse lookup: interactions filtered by show_id, viewer_id, host_id, kind and/or state — the moderation queue and the host question queue."
    roles: [ShowProducer, MerchandisingManager, Moderator, ComplianceOfficer, Host, Viewer, PlatformAdmin]
    code: 200
    input: ["show_id?", "viewer_id?", "host_id?", "kind?", "state?", "limit?", "offset?"]
    output: Interaction[]
    side_effects: []
  - method: POST
    path: "/interactions/{interaction_id}/moderate"
    description: "Moderator decision on a CHAT or QUESTION: APPROVE (chat published / question queued) or BLOCK (strike, mute cascade)."
    roles: [Moderator]
    code: 200
    input: [action, "blocked_reason?"]
    output: Interaction
    side_effects: ["see state_machines.Interaction PENDING_MODERATION_to_APPROVED / _to_QUEUED / _to_BLOCKED (depth-5 block cascade)", "increments Interaction.version by 1"]
  - method: POST
    path: "/interactions/{interaction_id}/route"
    description: "Routes a queued question to the on-air host."
    roles: [Moderator]
    code: 200
    input: []
    output: Interaction
    side_effects: ["see state_machines.Interaction QUEUED_to_ROUTED", "increments Interaction.version by 1"]
  - method: POST
    path: "/interactions/{interaction_id}/host-action"
    description: "Host action: ANSWER or DEFER a routed question, or CLOSE_POLL on an open poll."
    roles: [Host]
    code: 200
    input: [action, "answer_body?"]
    output: Interaction
    side_effects: ["ANSWER: ROUTED -> ANSWERED and pending_question_count decremented", "DEFER: ROUTED -> DEFERRED, defer_count incremented, and DEFERRED -> QUEUED in the same request while defer_count <= MAX_DEFERRALS", "CLOSE_POLL: OPEN -> CLOSED", "increments Interaction.version by 1"]
  - method: POST
    path: "/interactions/{interaction_id}/votes"
    description: "Casts the acting viewer's single vote on an open poll."
    roles: [Viewer]
    code: 200
    input: [option_index]
    output: Interaction
    side_effects: ["increments tallies[option_index] and vote_count", "appends X-User-ID to voted_viewer_ids", "increments Interaction.version by 1"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth / identity ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the seven declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting X-User-Role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity_backed role acts on a resource whose owning foreign key differs from X-User-ID: a Viewer touching another viewer's Cart/CartItem/Order/Interaction, or a Host acknowledging a DisclosureRecord whose booking names another host"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the ComplianceOfficer X-User-ID performing /shows/{show_id}/compliance-signoff equals the X-User-ID that recorded any claim substantiation for a product in that show's lineup"

  # --- not found ---
  - id: ERR_HOST_NOT_FOUND
    http: 404
    condition: "host_id in the path or body does not exist"
  - id: ERR_PRODUCT_NOT_FOUND
    http: 404
    condition: "product_id in the path or body does not exist"
  - id: ERR_VIEWER_NOT_FOUND
    http: 404
    condition: "viewer_id in the path or body does not exist"
  - id: ERR_SHOW_NOT_FOUND
    http: 404
    condition: "show_id in the path or body does not exist"
  - id: ERR_STREAM_CHANNEL_NOT_FOUND
    http: 404
    condition: "channel_id in the path does not exist"
  - id: ERR_HOST_BOOKING_NOT_FOUND
    http: 404
    condition: "booking_id in the path or host_booking_id in the body does not exist"
  - id: ERR_LINEUP_SLOT_NOT_FOUND
    http: 404
    condition: "slot_id in the path or lineup_slot_id in the body does not exist"
  - id: ERR_FLASH_OFFER_NOT_FOUND
    http: 404
    condition: "offer_id in the path or flash_offer_id in the body does not exist"
  - id: ERR_DISCLOSURE_RECORD_NOT_FOUND
    http: 404
    condition: "record_id in the path does not exist"
  - id: ERR_CART_NOT_FOUND
    http: 404
    condition: "cart_id in the path does not exist"
  - id: ERR_CART_ITEM_NOT_FOUND
    http: 404
    condition: "item_id in the path does not exist"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "order_id in the path does not exist"
  - id: ERR_INTERACTION_NOT_FOUND
    http: 404
    condition: "interaction_id in the path does not exist"

  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required input field is missing, an enum value is outside its declared set, a numeric field is out of range (negative money, qty < 1, max_qty < 1, target_latency_ms outside 500..8000, commission_pct outside 0.0..0.30, dropped_frame_pct outside 0..1, marker_offset_sec < 0, option_index outside the poll's option range, POLL options count outside 2..4), a timestamp is not RFC-3339 UTC, an interval has end <= start, slot_sequence duplicates another slot on the same show, sku or handle or email duplicates an existing row, or a body cross-reference is internally inconsistent (host_booking_id whose show_id differs from the body show_id; a lineup_slot window outside its show's scheduled window)"

  # --- concurrency ---
  - id: ERR_STALE_LINEUP_SLOT_VERSION
    http: 412
    condition: "expected_lineup_slot_version on POST /flash-offers does not equal the LineupSlot's current version (§1.2.1 flash-offer-create-stale-slot)"
  - id: ERR_STALE_CART_VERSION
    http: 412
    condition: "expected_cart_version on POST /carts/{cart_id}/checkout does not equal the Cart's current version (§1.2.1 cart-checkout-stale-cart)"

  # --- own-entity state ---
  - id: ERR_INVALID_SHOW_STATE
    http: 409
    condition: "the Show is not in a state from which the requested transition or write is declared in §1.2 (e.g. /go-live on a DRAFT show, /ready on a LIVE show, lineup or booking mutation on a LIVE/ENDED/SETTLED show, compliance-signoff on a show that is not ENDED), or an in-stream operation whose gating show is not LIVE (flash-offer activate, add cart item, checkout, interaction submit / moderate / route / host-action / vote)"
  - id: ERR_INVALID_BOOKING_STATE
    http: 409
    condition: "the HostBooking is not in a state permitting the transition (confirm on a non-PENDING booking, cancel on a COMPLETED or already CANCELLED booking)"
  - id: ERR_INVALID_CHANNEL_STATE
    http: 409
    condition: "the StreamChannel is not in a state permitting the write (provision on a PROVISIONED/LIVE/ENDED channel, health report on a DRAFT or ENDED channel)"
  - id: ERR_INVALID_DISCLOSURE_STATE
    http: 409
    condition: "acknowledging a DisclosureRecord that is already ACKNOWLEDGED or VOIDED"
  - id: ERR_INVALID_OFFER_STATE
    http: 409
    condition: "activating a FlashOffer that is not SCHEDULED, or one that is EXPIRED, CANCELLED or SUPERSEDED"
  - id: ERR_INVALID_CART_STATE
    http: 409
    condition: "adding an item to or checking out a cart that is not OPEN, abandoning a cart that is not OPEN, or recovering a cart that is not ABANDONED"
  - id: ERR_INVALID_ORDER_STATE
    http: 409
    condition: "capturing an order whose payment_state is not AUTHORIZED, or cancelling an order whose payment_state is REFUNDED or VOIDED"
  - id: ERR_INVALID_INTERACTION_STATE
    http: 409
    condition: "moderating an interaction that is not PENDING_MODERATION, routing one that is not QUEUED, ANSWER/DEFER on one that is not ROUTED, CLOSE_POLL or a vote on a poll that is not OPEN, or a kind/action mismatch such as CLOSE_POLL on a CHAT"

  # --- cross-entity state ---
  - id: ERR_OFFER_NOT_ACTIVE
    http: 409
    condition: "POST /carts/{cart_id}/items names a FlashOffer whose status is not ACTIVE"
  - id: ERR_SHOW_NOT_ENDED
    http: 409
    condition: "a replay-only operation is attempted before the show reaches ENDED: setting a replay marker, publishing a replay marker, or recording a replay conversion (validations priority 9)"

  # --- compliance business rules ---
  - id: ERR_CLAIM_NOT_SUBSTANTIATED
    http: 422
    condition: "POST /shows/{show_id}/ready, POST /flash-offers/{offer_id}/activate or POST /carts/{cart_id}/items involves a Product whose claim_text is non-empty and whose claim_substantiation_status is not SUBSTANTIATED (validations priority 10)"
  - id: ERR_DISCLOSURE_NOT_ACKNOWLEDGED
    http: 422
    condition: "POST /shows/{show_id}/ready while any DisclosureRecord of that show is still PENDING (validations priority 11)"
  - id: ERR_HOST_CERTIFICATION_EXPIRED
    http: 422
    condition: "POST /host-bookings/{booking_id}/confirm or POST /shows/{show_id}/ready when the booked Host's certification_status is not CERTIFIED, i.e. disclosure_certification_expires_at is null or strictly earlier than logical now (validations priority 12)"

  # --- temporal / overlap ---
  - id: ERR_HOST_BOOKING_OVERLAP
    http: 409
    condition: "POST /host-bookings would give one host two non-CANCELLED bookings whose 45-minute-buffered half-open [call_time_at - 45m, release_time_at + 45m) windows intersect"
  - id: ERR_OFFER_WINDOW_OVERLAP
    http: 409
    condition: "POST /flash-offers would give one product two non-terminal offers whose CLOSED [window_start_at, window_end_at] intervals intersect, touching endpoints included"
  - id: ERR_OFFER_WINDOW_CLOSED
    http: 409
    condition: "POST /flash-offers/{offer_id}/activate or POST /carts/{cart_id}/items when logical now is outside the offer's closed [window_start_at, window_end_at] window (validations priority 16)"
  - id: ERR_GO_LIVE_WINDOW_CLOSED
    http: 409
    condition: "POST /shows/{show_id}/go-live when logical now is outside [Show.scheduled_start_at - 30 minutes, Show.scheduled_end_at) (validations priority 17)"
  - id: ERR_RECOVERY_WINDOW_CLOSED
    http: 409
    condition: "POST /carts/{cart_id}/recover when logical now >= Cart.recovery_deadline_at (abandoned_at + 20 minutes) (validations priority 18)"
  - id: ERR_OFFER_SHOW_MISMATCH
    http: 422
    condition: "POST /carts/{cart_id}/items names a FlashOffer whose lineup slot belongs to a different show than the cart"

  # --- production readiness ---
  - id: ERR_PRIMARY_HOST_CONFLICT
    http: 409
    condition: "POST /host-bookings with role == PRIMARY while the show already has a PRIMARY booking whose status is PENDING or CONFIRMED (validations priority 20)"
  - id: ERR_PRIMARY_HOST_MISSING
    http: 422
    condition: "POST /shows/{show_id}/ready or POST /shows/{show_id}/go-live when the show has no HostBooking with role == PRIMARY and status == CONFIRMED (validations priority 21)"
  - id: ERR_LINEUP_EMPTY
    http: 422
    condition: "POST /shows/{show_id}/ready on a show with zero lineup slots"
  - id: ERR_SIMULCAST_NOT_READY
    http: 422
    condition: "POST /shows/{show_id}/ready when no StreamChannel of the show is PROVISIONED, or POST /shows/{show_id}/go-live when the recomputed Show.simulcast_readiness_index is below GO_LIVE_MIN_INDEX = 70 (validations priority 23)"

  # --- interactive ---
  - id: ERR_VIEWER_MUTED
    http: 403
    condition: "POST /interactions by a Viewer whose chat_status is MUTED and whose muted_until is strictly later than logical now"
  - id: ERR_POLL_NOT_OPEN
    http: 409
    condition: "POST /interactions/{interaction_id}/votes against a POLL whose state is not OPEN (already CLOSED), or against an interaction whose kind is not POLL"
  - id: ERR_DUPLICATE_VOTE
    http: 409
    condition: "POST /interactions/{interaction_id}/votes by a viewer already present in voted_viewer_ids"
  - id: ERR_DEFERRAL_LIMIT_REACHED
    http: 409
    condition: "POST /interactions/{interaction_id}/host-action with action == DEFER on a question whose defer_count already equals MAX_DEFERRALS = 2 (validations priority 26)"

  # --- replay merchandising ---
  - id: ERR_REPLAY_MARKER_NOT_PUBLISHED
    http: 409
    condition: "POST /lineup-slots/{slot_id}/replay-conversions on a slot whose replay_marker_status is not PUBLISHED"
  - id: ERR_MARKER_OFFSET_OUT_OF_RANGE
    http: 422
    condition: "marker_offset_sec falls outside [0, floor((Show.ended_at - Show.went_live_at) in seconds)] on POST /lineup-slots/{slot_id}/replay-marker (validations priority 27)"

  # --- cart / inventory boundaries ---
  - id: ERR_EMPTY_CART
    http: 422
    condition: "POST /carts/{cart_id}/checkout on a cart with zero HELD lines"
  - id: ERR_NO_RECOVERABLE_ITEMS
    http: 409
    condition: "POST /carts/{cart_id}/recover when no RELEASED line is still re-holdable (every referenced offer is terminal, out of window, or short of remaining_qty)"
  - id: ERR_CART_ITEM_LIMIT
    http: 422
    condition: "POST /carts/{cart_id}/items would push the cart's HELD line count above MAX_CART_DISTINCT_ITEMS (3)"
  - id: ERR_OFFER_QTY_EXCEEDED
    http: 422
    condition: "requested qty exceeds the FlashOffer's remaining_qty (max_qty - held_qty - sold_qty)"
  - id: ERR_INSUFFICIENT_INVENTORY
    http: 422
    condition: "requested qty exceeds the Product's available_qty (on_hand_qty - reserved_qty - committed_qty) even though the offer allotment would allow it"


# =============================================================================
# 1.7 RBAC Matrix — role_model: segregation_of_duties
#   Every entry below is the operation list implied by §1.5 `roles:`; an operation
#   naming exactly one role appears under that role's exclusive_operations, an
#   operation naming several roles appears under each of their shared_operations.
# =============================================================================
roles:
  - name: ShowProducer
    description: "Owns show calendar planning and technical production: creates shows and stream channels, books hosts, registers disclosure obligations, and drives the show through READY / LIVE / ENDED."
    identity: "opaque"
    exclusive_operations:
      - "POST /shows"
      - "POST /shows/{show_id}/ready"
      - "POST /shows/{show_id}/go-live"
      - "POST /shows/{show_id}/end"
      - "POST /stream-channels"
      - "POST /stream-channels/{channel_id}/provision"
      - "POST /host-bookings"
      - "POST /disclosure-records"
    shared_operations:
      - "POST /hosts (with PlatformAdmin)"
      - "POST /stream-channels/{channel_id}/health-reports (with PlatformAdmin)"
      - "POST /host-bookings/{booking_id}/cancel (with Host)"
      - "GET /shows/{show_id}/analytics and GET /hosts/{host_id}/performance (with MerchandisingManager, PlatformAdmin)"
      - "every other GET read endpoint"
    notes: "Cannot substantiate product claims, cannot certify hosts, and cannot sign the show off — those are ComplianceOfficer duties."
  - name: MerchandisingManager
    description: "Owns product catalogue, inventory, lineup and flash-offer pricing, replay merchandising, and order capture."
    identity: "opaque"
    exclusive_operations:
      - "POST /products"
      - "POST /products/{product_id}/inventory-adjustments"
      - "POST /lineup-slots"
      - "POST /lineup-slots/{slot_id}/replay-marker"
      - "POST /lineup-slots/{slot_id}/replay-marker/publish"
      - "POST /lineup-slots/{slot_id}/replay-conversions"
      - "POST /flash-offers"
      - "POST /flash-offers/{offer_id}/activate"
      - "POST /orders/{order_id}/capture"
    shared_operations:
      - "POST /carts/{cart_id}/abandon (with Viewer)"
      - "POST /carts/{cart_id}/recover (with Viewer)"
      - "POST /orders/{order_id}/cancel (with Viewer)"
      - "GET /carts, GET /orders, GET /shows/{show_id}/analytics, GET /hosts/{host_id}/performance"
      - "every other GET read endpoint"
    notes: "Cannot move the show through its lifecycle and cannot substantiate the claims of the products it prices."
  - name: ComplianceOfficer
    description: "Independent control function: substantiates product claims, certifies hosts for paid-endorsement disclosure, and signs the show off after air."
    identity: "opaque"
    exclusive_operations:
      - "POST /products/{product_id}/claim-substantiations"
      - "POST /hosts/{host_id}/disclosure-certifications"
      - "POST /shows/{show_id}/compliance-signoff"
    shared_operations:
      - "GET /carts, GET /orders"
      - "every other GET read endpoint"
    notes: "Segregation of duties: the X-User-ID that signs off a show must differ from the X-User-ID that substantiated any claim of a product in that show's lineup (ERR_SEGREGATION_OF_DUTIES)."
  - name: Moderator
    description: "Screens live chat and viewer questions and routes approved questions to the on-air host."
    identity: "opaque"
    exclusive_operations:
      - "POST /interactions/{interaction_id}/moderate"
      - "POST /interactions/{interaction_id}/route"
    shared_operations:
      - "GET /interactions and GET /interactions/{interaction_id}"
      - "every other GET read endpoint except GET /carts and GET /orders"
    notes: "Cannot submit an interaction, answer a question, or touch commerce state."
  - name: Host
    description: "On-air talent: confirms its own bookings, acknowledges disclosure scripts, opens and closes polls, answers or defers routed questions."
    identity: "entity_backed:Host"
    exclusive_operations:
      - "POST /host-bookings/{booking_id}/confirm"
      - "POST /disclosure-records/{record_id}/acknowledge"
      - "POST /interactions/{interaction_id}/host-action"
    shared_operations:
      - "POST /interactions with kind POLL (with Viewer, who may only submit CHAT or QUESTION)"
      - "POST /host-bookings/{booking_id}/cancel (with ShowProducer)"
      - "every GET read endpoint except GET /carts and GET /orders"
    notes: "X-User-ID equals a Host.id; confirm / cancel / acknowledge / host-action all require that id to match the booking's host_id (ERR_NOT_RESOURCE_OWNER)."
  - name: Viewer
    description: "The shopper: keeps a persistent cart, buys inside the stream, chats, asks questions and votes in polls."
    identity: "entity_backed:Viewer"
    exclusive_operations:
      - "POST /carts"
      - "POST /carts/{cart_id}/items"
      - "POST /carts/{cart_id}/checkout"
      - "POST /interactions/{interaction_id}/votes"
    shared_operations:
      - "POST /interactions with kind CHAT or QUESTION (with Host, who may only submit POLL)"
      - "POST /carts/{cart_id}/abandon (with MerchandisingManager)"
      - "POST /carts/{cart_id}/recover (with MerchandisingManager)"
      - "POST /orders/{order_id}/cancel (with MerchandisingManager)"
      - "GET /carts, GET /orders, and every other GET read endpoint except GET /shows/{show_id}/analytics and GET /hosts/{host_id}/performance"
    notes: "X-User-ID equals a Viewer.id; every cart, cart item, order and interaction write requires that id to match the row's viewer_id (ERR_NOT_RESOURCE_OWNER)."
  - name: PlatformAdmin
    description: "Operations engineering: registers viewers and hosts, drives the logical clock every temporal rule reads, and holds unrestricted read access."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /viewers"
    shared_operations:
      - "POST /hosts (with ShowProducer)"
      - "POST /stream-channels/{channel_id}/health-reports (with ShowProducer)"
      - "GET /shows/{show_id}/analytics, GET /hosts/{host_id}/performance, GET /carts, GET /orders"
      - "every other GET read endpoint"
    notes: "Holds no commerce, lifecycle or compliance write authority beyond viewer/host registration and the logical clock."
