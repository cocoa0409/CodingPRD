        excluded_because:
          difficulty_instance: chair_committed_minutes_and_nurse_acuity_fully_restored_by_an_early_cancellation
          rationale: |
            The compensating-write corner (a cancellation returning Chair.committed_minutes
            and Nurse.assigned_acuity_points to their exact pre-booking values, with the
            audit-trail chair_id deliberately left in place) is that §1.8 instance's whole
            claim, including the equality of the before and after snapshots.

