      - name: verify_funding_blocked_when_one_cost_share_source_suspended
        grounds:
          - "validations[priority=12]"
          - state_machines.FundingAllocation.PROPOSED_to_COMMITTED
          - state_machines.FundingSource.ACTIVE_to_SUSPENDED
          - "errors[ERR_FUNDING_SOURCE_NOT_ACTIVE]"
        distinguishing_aspect: |
          The blocking state lives on FundingSource, one hop away from the FundingAllocation rows being
          committed: with a two-way cost-share plan whose grant source is ACTIVE and whose departmental
          source has been suspended for SPONSOR_HOLD, verify-funding must return
          ERR_FUNDING_SOURCE_NOT_ACTIVE and leave BOTH allocations PROPOSED - no partial commit against
          the healthy source.
        test_recipe:
          setup:
            - "Term SUSP2026 (2026-09-01..2026-09-30, CALENDAR_DAY) OPEN with a single pay period [2026-09-01, 2026-10-01)."
            - "StipendPolicy (RESEARCH, DOCTORAL): min_fte_monthly_stipend_cents 400000, per_credit_tuition_cents 50000, max_remission_cents_per_term 500000, term_insurance_premium_cents 0, min_insurance_duration_days 90."
            - "DOCTORAL student, enrolled_credit_hours 0."
            - "GRANT source NSF-SUSP authorized 5000000, status ACTIVE; DEPARTMENTAL_BUDGET source DEPT-SUSP authorized 5000000, moved to SUSPENDED with suspension_reason SPONSOR_HOLD. Both budget periods are 2026-07-01..2027-06-30 so no funding-period violation is in play, and both are far larger than the 300000-cent plan so no insufficiency is in play."
            - "Appointment RESEARCH, effort_pct 75, 2026-09-01..2026-09-30, monthly_stipend_cents 300000, SUBMITTED with total_stipend_cents 300000 and two PROPOSED allocations: NSF-SUSP at 70.00 and DEPT-SUSP as cost share at 30.00."
