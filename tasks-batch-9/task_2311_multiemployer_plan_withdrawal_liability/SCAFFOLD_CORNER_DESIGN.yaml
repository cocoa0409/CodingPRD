      - name: the_direct_attribution_variant_replaces_the_ratio_basis_with_attributed_benefits
        claim_type: Variant Selection
        grounds:
          - "calculations.allocation_fraction_and_gross_share"
          - "entities.Plan.fields.unattributable_uvb_cents"
          - "entities.Employer.fields.directly_attributed_vested_benefits_cents"
        distinguishing_aspect: |
          DIRECT_ATTRIBUTION is the one variant that ignores the anchor valuation's
          uvb_total_cents entirely: the basis is the employer's own vested benefits net of
          attributed assets, plus a CBU-weighted slice of the plan's unattributable pool.
          Identical contribution data under MODIFIED_PRESUMPTIVE would give 250000000, so a
          server that pins the wrong variant is off by 75000000 and the amortization runs
          nine years instead of seven.
