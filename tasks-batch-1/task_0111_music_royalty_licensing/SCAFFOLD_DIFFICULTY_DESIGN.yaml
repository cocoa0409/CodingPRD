# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cross-references SCAFFOLD.yaml §1.1–§1.7 against the nine §0.5 Difficulty Rules.
# Every instance grounds in declared elements; every setup_api_calls chain is
# executable from empty-DB using only §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: performance_royalty_provisional_vs_final
        grounds:
          - calculations.performance_pool_royalty
          - state_machines.UsageEvent.INGESTED_to_ALLOCATED
          - state_machines.Statement.DRAFT_to_FINALIZED
          - entities.Rightsholder.fields.lifetime_earned_cents
        distinguishing_aspect: |
          Same EARNING figure (112000c) is PROVISIONAL while the holder's Statement is DRAFT
          (excluded from lifetime_earned_cents) and FINAL once the Statement is FINALIZED
          (counted in lifetime_earned_cents) — divergence is on the UsageEvent/Statement domain.
        test_recipe:
          setup:
            - "Clock at 2026-01-15. Writer R1 holds 100% composition share on an ASCAP work; recording locked; PERFORMANCE rights window covers US for Jan 2026; one PERFORMANCE usage (gross 200000, qty 1000, duration 180s) ALLOCATED into R1's DRAFT Jan statement."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00.000Z" }
              as: Administrator
            - call: "POST /rightsholders"
              payload: { legal_name: "R1 Writer", party_type: "WRITER", payee_country: "US", minimum_payout_cents: 5000, withholding_pct: 0 }
              as: Administrator
              captures: { r1_id: $.data.id }
            - call: "POST /works"
              payload: { title: "Song A", iswc: "T-000000001-0", pro_affiliation: "ASCAP", duration_seconds: 180 }
              as: Administrator
              captures: { work_id: $.data.id }
            - call: "POST /composition-shares"
              payload: { work_id: "${work_id}", rightsholder_id: "${r1_id}", role: "WRITER", split_bps: 10000 }
              as: Administrator
            - call: "POST /works/${work_id}/register"
              payload: {}
              as: Administrator
            - call: "POST /recordings"
              payload: { work_id: "${work_id}", isrc: "USAAA0100001", title: "Song A Master", release_type: "STREAMING", duration_seconds: 180 }
              as: Administrator
              captures: { rec_id: $.data.id }
            - call: "POST /recording-shares"
              payload: { recording_id: "${rec_id}", rightsholder_id: "${r1_id}", split_bps: 10000 }
              as: Administrator
            - call: "POST /recordings/${rec_id}/lock-shares"
              payload: {}
              as: Administrator
            - call: "POST /rights-windows"
              payload: { recording_id: "${rec_id}", territory: "US", rights_type: "PERFORMANCE", term_start: "2026-01-01T00:00:00.000Z", term_end: "2026-02-01T00:00:00.000Z" }
              as: Administrator
            - call: "POST /statements"
              payload: { rightsholder_id: "${r1_id}", period_start: "2026-01-01T00:00:00.000Z", period_end: "2026-02-01T00:00:00.000Z" }
              as: RoyaltyOperator
              captures: { stmt_id: $.data.id }
            - call: "POST /usage-events"
              payload: { recording_id: "${rec_id}", usage_type: "PERFORMANCE", territory: "US", occurred_at: "2026-01-15T00:00:00.000Z", quantity: 1000, gross_revenue_cents: 200000 }
              as: RoyaltyOperator
              captures: { ue_id: $.data.id }
            - call: "POST /usage-events/${ue_id}/allocate"
              payload: {}
              as: RoyaltyOperator
              captures: { ue_royalty: $.data.royalty_cents }
          trigger:
            - call: "GET /rightsholders/${r1_id}"
              as: RoyaltyOperator
              captures: { lifetime_before: $.data.lifetime_earned_cents }
            - call: "GET /statements/${stmt_id}"
              as: RoyaltyOperator
              captures: { stmt_v: $.data.version }
            - call: "POST /statements/${stmt_id}/finalize"
              payload: { expected_statement_version: "${stmt_v}" }
              as: RoyaltyOperator
          assert:
            - "UsageEvent.${ue_id}.royalty_cents == 112000 (provisional figure exposed on the event while statement DRAFT)"
            - "Rightsholder.${r1_id}.lifetime_earned_cents == 0 BEFORE finalize (provisional EARNING not yet counted)"
            - "Rightsholder.${r1_id}.lifetime_earned_cents == 112000 AFTER finalize (same figure now final)"

      - name: advance_recoupment_full_vs_partial
        grounds:
          - calculations.advance_recoupment
          - state_machines.Advance.ACTIVE_to_RECOUPED
          - entities.Advance.fields.recouped_cents
          - entities.Statement.fields.recoupment_applied_cents
        distinguishing_aspect: |
          The advance principal recoups PARTIALLY here (recoupment_pct 0.5: advance stays ACTIVE,
          recoupment_applied == floor(gross*0.5)) — contrasted in-test with the full-recoupment
          view (pct 1.0). Divergence is on the Advance domain, a different entity than instance
          one's UsageEvent/Statement.
        test_recipe:
          setup:
            - "R2 has an ACTIVE advance principal 80000 pct 0.5. A DRAFT statement gross 100000 (from an allocated PERFORMANCE usage: 176000*0.5 + 1000*12 = 100000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00.000Z" }
              as: Administrator
            - call: "POST /rightsholders"
              payload: { legal_name: "R2 Partial", party_type: "WRITER", payee_country: "US", minimum_payout_cents: 1, withholding_pct: 0 }
              as: Administrator
              captures: { r2_id: $.data.id }
            - call: "POST /works"
              payload: { title: "Song B", iswc: "T-000000002-0", pro_affiliation: "ASCAP", duration_seconds: 180 }
              as: Administrator
              captures: { workb_id: $.data.id }
            - call: "POST /composition-shares"
              payload: { work_id: "${workb_id}", rightsholder_id: "${r2_id}", role: "WRITER", split_bps: 10000 }
              as: Administrator
            - call: "POST /works/${workb_id}/register"
              payload: {}
              as: Administrator
            - call: "POST /recordings"
              payload: { work_id: "${workb_id}", isrc: "USAAA0200001", title: "Song B Master", release_type: "STREAMING", duration_seconds: 180 }
              as: Administrator
              captures: { recb_id: $.data.id }
            - call: "POST /recording-shares"
              payload: { recording_id: "${recb_id}", rightsholder_id: "${r2_id}", split_bps: 10000 }
              as: Administrator
            - call: "POST /recordings/${recb_id}/lock-shares"
              payload: {}
              as: Administrator
            - call: "POST /rights-windows"
              payload: { recording_id: "${recb_id}", territory: "US", rights_type: "PERFORMANCE", term_start: "2026-03-01T00:00:00.000Z", term_end: "2026-04-01T00:00:00.000Z" }
              as: Administrator
            - call: "POST /advances"
              payload: { rightsholder_id: "${r2_id}", principal_cents: 80000, recoupment_pct: 0.5 }
              as: Administrator
              captures: { adv_id: $.data.id }
            - call: "POST /statements"
              payload: { rightsholder_id: "${r2_id}", period_start: "2026-03-01T00:00:00.000Z", period_end: "2026-04-01T00:00:00.000Z" }
              as: RoyaltyOperator
              captures: { stmtb_id: $.data.id }
            - call: "POST /usage-events"
              payload: { recording_id: "${recb_id}", usage_type: "PERFORMANCE", territory: "US", occurred_at: "2026-03-15T00:00:00.000Z", quantity: 1000, gross_revenue_cents: 176000 }
              as: RoyaltyOperator
              captures: { ueb_id: $.data.id }
            - call: "POST /usage-events/${ueb_id}/allocate"
              payload: {}
              as: RoyaltyOperator
          trigger:
            - call: "GET /statements/${stmtb_id}"
              as: RoyaltyOperator
              captures: { stmtb_v: $.data.version }
            - call: "POST /statements/${stmtb_id}/finalize"
              payload: { expected_statement_version: "${stmtb_v}" }
              as: RoyaltyOperator
          assert:
            - "Statement.${stmtb_id}.gross_earnings_cents == 100000 (perf pool: 176000*0.5 + 1000*12*1.0 = 88000+12000 = 100000)"
            - "Statement.${stmtb_id}.recoupment_applied_cents == 50000 (PARTIAL: floor(100000*0.5)=50000, less than outstanding 80000)"
            - "Advance.${adv_id}.recouped_cents == 50000 AND Advance.${adv_id}.status == ACTIVE (partial view: stays ACTIVE)"
            - "Statement.${stmtb_id}.net_payable_cents == 50000 (100000 - 50000 - 0 withholding)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: sync_quote_circular_territory_tier_mode_c
        grounds:
          - calculations.sync_quote_fee
          - entities.SyncLicense.fields.quoted_fee_cents
          - state_machines.SyncLicense.COUNTERED_to_DRAFT
        distinguishing_aspect: |
          Mode (c): the territory multiplier depends on the media-scaled subtotal tier
          (circular-looking), resolved by pinned order media->territory->term. base 100000 FILM
          (media 2.0) US 24mo: subtotal 200000 (<500000 -> terr 1.2), term 1.3 => 312000.
        test_recipe:
          setup:
            - "A recording with a covering SYNC window. A sync license is quoted with FILM/US/24mo/base 100000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00.000Z" }
              as: Administrator
            - call: "POST /rightsholders"
              payload: { legal_name: "Label L1", party_type: "LABEL", payee_country: "US" }
              as: Administrator
              captures: { label_id: $.data.id }
            - call: "POST /rightsholders"
              payload: { legal_name: "Licensee Co", party_type: "LABEL", payee_country: "US" }
              as: Administrator
              captures: { lic_id: $.data.id }
            - call: "POST /works"
              payload: { title: "Song C", iswc: "T-000000003-0", pro_affiliation: "BMI", duration_seconds: 200 }
              as: Administrator
              captures: { workc_id: $.data.id }
            - call: "POST /composition-shares"
              payload: { work_id: "${workc_id}", rightsholder_id: "${label_id}", role: "PUBLISHER", split_bps: 10000 }
              as: Administrator
            - call: "POST /works/${workc_id}/register"
              payload: {}
              as: Administrator
            - call: "POST /recordings"
              payload: { work_id: "${workc_id}", isrc: "USAAA0300001", title: "Song C Master", release_type: "PHYSICAL", duration_seconds: 200 }
              as: Administrator
              captures: { recc_id: $.data.id }
            - call: "POST /recording-shares"
              payload: { recording_id: "${recc_id}", rightsholder_id: "${label_id}", split_bps: 10000 }
              as: Administrator
            - call: "POST /recordings/${recc_id}/lock-shares"
              payload: {}
              as: Administrator
            - call: "POST /rights-windows"
              payload: { recording_id: "${recc_id}", territory: "US", rights_type: "SYNC", term_start: "2026-01-01T00:00:00.000Z", term_end: "2027-01-01T00:00:00.000Z" }
              as: Administrator
          trigger:
            - call: "POST /sync-licenses"
              payload: { recording_id: "${recc_id}", licensee_id: "${lic_id}", media_type: "FILM", territory: "US", term_months: 24, base_fee_cents: 100000 }
              as: RoyaltyOperator
              captures: { sl_id: $.data.id, sl_fee: $.data.quoted_fee_cents }
          assert:
            - "SyncLicense.${sl_id}.quoted_fee_cents == 312000 (subtotal 200000 -> terr_mult 1.2 -> *term 1.3)"
            - "SyncLicense.${sl_id}.status == DRAFT"

      - name: mechanical_rounding_order_mode_b
        grounds:
          - calculations.mechanical_statutory_royalty
          - state_machines.UsageEvent.INGESTED_to_ALLOCATED
          - entities.RecordingShare.fields.split_bps
        distinguishing_aspect: |
          Mode (b): nested rounding order is PINNED — the mechanical pool total is rounded
          once (round_half_up) BEFORE per-holder allocation, then each holder's share is
          rounded once; this differs from round-after-allocate and is a different formula
          than the sync mode-(c) instance.
        test_recipe:
          setup:
            - "Physical recording (duration 200s) with two RecordingShare holders at 3333 / 6667 bps; a MECHANICAL window covers US; both holders have open statements; a MECHANICAL usage qty 999 is allocated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-10T00:00:00.000Z" }
              as: Administrator
            - call: "POST /rightsholders"
              payload: { legal_name: "Label A", party_type: "LABEL", payee_country: "US", minimum_payout_cents: 1 }
              as: Administrator
              captures: { la_id: $.data.id }
            - call: "POST /rightsholders"
              payload: { legal_name: "Label B", party_type: "LABEL", payee_country: "US", minimum_payout_cents: 1 }
              as: Administrator
              captures: { lb_id: $.data.id }
            - call: "POST /works"
              payload: { title: "Song D", iswc: "T-000000004-0", pro_affiliation: "NONE", duration_seconds: 200 }
              as: Administrator
              captures: { workd_id: $.data.id }
            - call: "POST /composition-shares"
              payload: { work_id: "${workd_id}", rightsholder_id: "${la_id}", role: "PUBLISHER", split_bps: 10000 }
              as: Administrator
            - call: "POST /works/${workd_id}/register"
              payload: {}
              as: Administrator
            - call: "POST /recordings"
              payload: { work_id: "${workd_id}", isrc: "USAAA0400001", title: "Song D Master", release_type: "PHYSICAL", duration_seconds: 200 }
              as: Administrator
              captures: { recd_id: $.data.id }
            - call: "POST /recording-shares"
              payload: { recording_id: "${recd_id}", rightsholder_id: "${la_id}", split_bps: 3333 }
              as: Administrator
            - call: "POST /recording-shares"
              payload: { recording_id: "${recd_id}", rightsholder_id: "${lb_id}", split_bps: 6667 }
              as: Administrator
            - call: "POST /recordings/${recd_id}/lock-shares"
              payload: {}
              as: Administrator
            - call: "POST /rights-windows"
              payload: { recording_id: "${recd_id}", territory: "US", rights_type: "MECHANICAL", term_start: "2026-04-01T00:00:00.000Z", term_end: "2026-05-01T00:00:00.000Z" }
              as: Administrator
            - call: "POST /statements"
              payload: { rightsholder_id: "${la_id}", period_start: "2026-04-01T00:00:00.000Z", period_end: "2026-05-01T00:00:00.000Z" }
              as: RoyaltyOperator
              captures: { stmt_la_id: $.data.id }
            - call: "POST /statements"
              payload: { rightsholder_id: "${lb_id}", period_start: "2026-04-01T00:00:00.000Z", period_end: "2026-05-01T00:00:00.000Z" }
              as: RoyaltyOperator
              captures: { stmt_lb_id: $.data.id }
            - call: "POST /usage-events"
              payload: { recording_id: "${recd_id}", usage_type: "MECHANICAL", territory: "US", occurred_at: "2026-04-10T00:00:00.000Z", quantity: 999, gross_revenue_cents: 0 }
              as: RoyaltyOperator
              captures: { ued_id: $.data.id }
          trigger:
            - call: "POST /usage-events/${ued_id}/allocate"
              payload: {}
              as: RoyaltyOperator
              captures: { ued_royalty: $.data.royalty_cents }
          assert:
            - "UsageEvent.${ued_id}.royalty_cents == 11988 (pool rounded once: rate 12 * qty 999 = 11988)"
            - "Statement.${stmt_la_id}.gross_earnings_cents == 3996 (round_half_up(11988*3333/10000)=round(3995.6)=3996)"
            - "Statement.${stmt_lb_id}.gross_earnings_cents == 7992 (round_half_up(11988*6667/10000)=round(7992.4)=7992)"
            - "sum of holder allocations 3996+7992 == 11988 equals the once-rounded pool total"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: sync_license_negotiation_cycle
        grounds:
          - state_machines.SyncLicense.DRAFT_to_COUNTERED
          - state_machines.SyncLicense.COUNTERED_to_DRAFT
          - entities.SyncLicense.fields.quoted_fee_cents
        distinguishing_aspect: |
          Cyclic shape on SyncLicense: DRAFT -> COUNTERED (counter) -> DRAFT (requote) re-enters
          a prior state with a recomputed quote, a true loop distinct from any linear pipeline.
        test_recipe:
          setup:
            - "A DRAFT sync license (FILM/US/24mo/base 100000 -> quoted 312000) owned by licensee Lic2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00.000Z" }
              as: Administrator
            - call: "POST /rightsholders"
              payload: { legal_name: "Label L2", party_type: "LABEL", payee_country: "US" }
              as: Administrator
              captures: { lab2_id: $.data.id }
            - call: "POST /rightsholders"
              payload: { legal_name: "Licensee2", party_type: "LABEL", payee_country: "US" }
              as: Administrator
              captures: { lic2_id: $.data.id }
            - call: "POST /works"
              payload: { title: "Song E", iswc: "T-000000005-0", pro_affiliation: "BMI", duration_seconds: 200 }
              as: Administrator
              captures: { worke_id: $.data.id }
            - call: "POST /composition-shares"
              payload: { work_id: "${worke_id}", rightsholder_id: "${lab2_id}", role: "PUBLISHER", split_bps: 10000 }
              as: Administrator
            - call: "POST /works/${worke_id}/register"
              payload: {}
              as: Administrator
            - call: "POST /recordings"
              payload: { work_id: "${worke_id}", isrc: "USAAA0500001", title: "Song E Master", release_type: "PHYSICAL", duration_seconds: 200 }
              as: Administrator
              captures: { rece_id: $.data.id }
            - call: "POST /recording-shares"
              payload: { recording_id: "${rece_id}", rightsholder_id: "${lab2_id}", split_bps: 10000 }
              as: Administrator
            - call: "POST /recordings/${rece_id}/lock-shares"
              payload: {}
              as: Administrator
            - call: "POST /sync-licenses"
              payload: { recording_id: "${rece_id}", licensee_id: "${lic2_id}", media_type: "FILM", territory: "US", term_months: 24, base_fee_cents: 100000 }
              as: RoyaltyOperator
              captures: { sle_id: $.data.id }
          trigger:
            - call: "POST /sync-licenses/${sle_id}/counter"
              payload: { counter_fee_cents: 150000 }
              as: Licensee
              as_user_id: "${lic2_id}"
              captures: { after_counter_status: $.data.status }
            - call: "POST /sync-licenses/${sle_id}/requote"
              payload: { base_fee_cents: 50000 }
              as: RoyaltyOperator
              captures: { after_requote_status: $.data.status, requoted_fee: $.data.quoted_fee_cents }
          assert:
            - "SyncLicense.${sle_id}.status == COUNTERED after counter, then == DRAFT after requote (returned to prior state — a cycle)"
            - "SyncLicense.${sle_id}.quoted_fee_cents == 156000 after requote (base 50000 FILM 2.0 -> sub 100000 -> terr 1.2 -> term 1.3 = 156000)"

      - name: statement_reopen_cycle
        grounds:
          - state_machines.Statement.DRAFT_to_FINALIZED
          - state_machines.Statement.FINALIZED_to_DRAFT
          - entities.Statement.fields.status
        distinguishing_aspect: |
          Cyclic shape on Statement (a different entity than SyncLicense): FINALIZED -> DRAFT via
          reopen re-enters the DRAFT state, a loop distinct from a linear settle pipeline.
        test_recipe:
          setup:
            - "R3 with a FINALIZED statement (gross 112000, no advance, no withholding, net 112000), no settled payout."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00.000Z" }
              as: Administrator
            - call: "POST /rightsholders"
              payload: { legal_name: "R3", party_type: "WRITER", payee_country: "US", minimum_payout_cents: 1, withholding_pct: 0 }
              as: Administrator
              captures: { r3_id: $.data.id }
            - call: "POST /works"
              payload: { title: "Song F", iswc: "T-000000006-0", pro_affiliation: "ASCAP", duration_seconds: 180 }
              as: Administrator
              captures: { workf_id: $.data.id }
            - call: "POST /composition-shares"
              payload: { work_id: "${workf_id}", rightsholder_id: "${r3_id}", role: "WRITER", split_bps: 10000 }
              as: Administrator
            - call: "POST /works/${workf_id}/register"
              payload: {}
              as: Administrator
            - call: "POST /recordings"
              payload: { work_id: "${workf_id}", isrc: "USAAA0600001", title: "Song F Master", release_type: "STREAMING", duration_seconds: 180 }
              as: Administrator
              captures: { recf_id: $.data.id }
            - call: "POST /recording-shares"
              payload: { recording_id: "${recf_id}", rightsholder_id: "${r3_id}", split_bps: 10000 }
              as: Administrator
            - call: "POST /recordings/${recf_id}/lock-shares"
              payload: {}
              as: Administrator
            - call: "POST /rights-windows"
              payload: { recording_id: "${recf_id}", territory: "US", rights_type: "PERFORMANCE", term_start: "2026-05-01T00:00:00.000Z", term_end: "2026-06-01T00:00:00.000Z" }
              as: Administrator
            - call: "POST /statements"
              payload: { rightsholder_id: "${r3_id}", period_start: "2026-05-01T00:00:00.000Z", period_end: "2026-06-01T00:00:00.000Z" }
              as: RoyaltyOperator
              captures: { stmtf_id: $.data.id }
            - call: "POST /usage-events"
              payload: { recording_id: "${recf_id}", usage_type: "PERFORMANCE", territory: "US", occurred_at: "2026-05-15T00:00:00.000Z", quantity: 1000, gross_revenue_cents: 200000 }
              as: RoyaltyOperator
              captures: { uef_id: $.data.id }
            - call: "POST /usage-events/${uef_id}/allocate"
              payload: {}
              as: RoyaltyOperator
            - call: "GET /statements/${stmtf_id}"
              as: RoyaltyOperator
              captures: { stmtf_v1: $.data.version }
            - call: "POST /statements/${stmtf_id}/finalize"
              payload: { expected_statement_version: "${stmtf_v1}" }
              as: RoyaltyOperator
              captures: { stmtf_v2: $.data.version }
          trigger:
            - call: "POST /statements/${stmtf_id}/reopen"
              payload: { expected_statement_version: "${stmtf_v2}" }
              as: RoyaltyOperator
              captures: { reopened_status: $.data.status }
          assert:
            - "Statement.${stmtf_id}.status == DRAFT after reopen (FINALIZED -> DRAFT, a cycle back to the initial state)"
            - "Statement.${stmtf_id}.net_payable_cents == 0 after reopen (totals reset)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: finalize_cascade_depth_three
        grounds:
          - state_machines.Statement.DRAFT_to_FINALIZED
          - state_machines.Advance.ACTIVE_to_RECOUPED
          - entities.Advance.fields.recouped_cents
          - entities.Rightsholder.fields.unrecouped_balance_cents
        distinguishing_aspect: |
          Depth-3 chain triggered by statement finalize: (A) finalize debits (B) Advance.recouped_cents
          which when it hits principal flips (C) Advance.status->RECOUPED which in turn drives
          (D) Rightsholder.unrecouped_balance_cents recompute. Each link is caused by the previous
          link, not directly by finalize.
        test_recipe:
          setup:
            - "R4 with one ACTIVE advance principal 50000 pct 1.0; a DRAFT statement gross 112000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00.000Z" }
              as: Administrator
            - call: "POST /rightsholders"
              payload: { legal_name: "R4", party_type: "WRITER", payee_country: "US", minimum_payout_cents: 1, withholding_pct: 0 }
              as: Administrator
              captures: { r4_id: $.data.id }
            - call: "POST /works"
              payload: { title: "Song G", iswc: "T-000000007-0", pro_affiliation: "ASCAP", duration_seconds: 180 }
              as: Administrator
