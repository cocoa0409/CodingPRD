# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# task_1614 airport-noise-abatement.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: complainant_create_applies_defaults
        claim_type: defaults
        grounds:
          - "entities.Complainant.fields.outreach_opt_in"
          - "entities.Complainant.fields.standing"
        distinguishing_aspect: "Omitting optional phone/outreach_opt_in yields outreach_opt_in=true, standing=GOOD_STANDING, all counters 0, version=1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /noise-program/complainants", payload: { full_name: "Def One", email: "def1@x.com", address_line: "1 Default Dr", zone_code: "Z1" }, as: CommunityLiaison, captures: { comp_id: $.data.id } }
          trigger:
            - { call: "GET /noise-program/complainants/${comp_id}", payload: {}, as: CommunityLiaison, captures: { d_opt: $.data.outreach_opt_in, d_st: $.data.standing, d_c: $.data.complaints_90d, d_v: $.data.version } }
          assert:
            - "d_opt == true and d_st == GOOD_STANDING and d_c == 0 and d_v == 1"

      - name: complainant_create_missing_email_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "validations[priority=2]"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "Missing required field email on complainant create -> ERR_VALIDATION 400."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /noise-program/complainants", payload: { full_name: "No Mail", address_line: "2 Void St", zone_code: "Z1" }, as: CommunityLiaison, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_VALIDATION (http 400)"

      - name: complaint_create_system_fields_input_ignored
        claim_type: computed_fields
        grounds:
          - "validations[priority=2]"
          - "entities.NoiseComplaint.fields.status"
        distinguishing_aspect: "Sending status/version in the create body is ignored (not rejected); server initializes status=RECEIVED, version=1."
        test_recipe:
          setup: ["one complainant"]
          setup_api_calls:
            - { call: "POST /noise-program/complainants", payload: { full_name: "Sys One", email: "sys1@x.com", address_line: "3 Sys St", zone_code: "Z1" }, as: CommunityLiaison, captures: { comp_id: $.data.id } }
          trigger:
            - { call: "POST /noise-program/noise-complaints", payload: { complainant_id: "${comp_id}", occurred_at: "2026-07-15T09:00:00Z", channel: "WEB", disturbance_type: "OTHER", status: "CLOSED_SUBSTANTIATED", version: 99 }, as: Complainant, as_user_id: "${comp_id}", captures: { c_st: $.data.status, c_v: $.data.version } }
          assert:
            - "c_st == RECEIVED and c_v == 1 (system fields from input ignored)"

      - name: complaint_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds:
          - "validations[priority=6]"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET with a well-formed but unknown complaint id -> ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /noise-program/noise-complaints/00000000-0000-0000-0000-000000000000", payload: {}, as: NoiseAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND (http 404)"

      - name: monitor_outage_immutable_record_has_no_version
        claim_type: immutability
        grounds:
          - "entities.MonitorOutage"
        distinguishing_aspect: "MonitorOutage (common_fields: false) exposes id and created_at but no version/updated_at; no update endpoint exists."
        test_recipe:
          setup: ["one monitor with one outage"]
          setup_api_calls:
            - { call: "POST /noise-program/noise-monitors", payload: { station_code: "IM1", zone_code: "Z1", latitude: 47.1, longitude: -122.3, commissioned_at: "2026-01-01T00:00:00Z" }, as: NoiseOfficeAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /noise-program/noise-monitors/${m_id}/outages", payload: { start_at: "2026-07-10T10:00:00Z", end_at: "2026-07-10T11:00:00Z", outage_type: "CALIBRATION" }, as: NoiseOfficeAdmin, captures: { o_id: $.data.id } }
          trigger:
            - { call: "GET /noise-program/noise-monitors/${m_id}/outages", payload: {}, as: NoiseAnalyst, captures: { o0_id: $.data.0.id } }
          assert:
            - "o0_id == o_id and the outage object carries no version field and no updated_at field"

      - name: flight_created_with_initial_state_and_zero_links
        claim_type: initial_state
        grounds:
          - "state_machines.FlightOperation"
          - "entities.FlightOperation.fields.status"
        distinguishing_aspect: "New flight: status=SCHEDULED, curfew_movement=false, curfew_violation=false, linked counts 0, actual_at null."
        test_recipe:
          setup: ["one operator"]
          setup_api_calls:
            - { call: "POST /noise-program/operators", payload: { name: "Air Nine", iata_code: "A9", contact_email: "ops@airnine.example" }, as: NoiseOfficeAdmin, captures: { op_id: $.data.id } }
          trigger:
            - { call: "POST /noise-program/flight-operations", payload: { flight_number: "A9100", operator_id: "${op_id}", aircraft_type: "B738", engine_class: "STAGE_4", operation_type: "DEPARTURE", runway_code: "09L", scheduled_at: "2026-08-05T10:00:00Z", zone_code: "Z1" }, as: NoiseOfficeAdmin, captures: { f_st: $.data.status, f_mv: $.data.curfew_movement, f_lc: $.data.linked_complaint_count, f_at: $.data.actual_at } }
          assert:
            - "f_st == SCHEDULED and f_mv == false and f_lc == 0 and f_at == null"

      - name: parcel_computed_band_and_compatibility_on_create
        claim_type: computed_fields
        grounds:
          - "calculations.parcel_dnl_exposure"
          - "entities.LandUseParcel.fields.dnl_band"
        distinguishing_aspect: "Parcel created while study not ADOPTED (PRELIMINARY): modeled 67.0 -> effective 65.5, band 65, INCOMPATIBLE_RESIDENTIAL, insulation_eligible true; client-sent band inputs impossible (fields not in input schema)."
        test_recipe:
          setup: ["study in DATA_COLLECTION"]
          setup_api_calls:
            - { call: "POST /noise-program/noise-studies", payload: { title: "Part150 Lambda", baseline_year: 2025 }, as: StudyCoordinator, captures: { st_id: $.data.id } }
            - { call: "POST /noise-program/noise-studies/${st_id}/start-data-collection", payload: {}, as: StudyCoordinator }
          trigger:
            - { call: "POST /noise-program/noise-studies/${st_id}/parcels", payload: { parcel_ref: "P-900", land_use: "RESIDENTIAL", dnl_db_measured: 64.0, dnl_db_modeled: 67.0, zone_code: "Z1" }, as: StudyCoordinator, captures: { p_eff: $.data.dnl_db_effective, p_band: $.data.dnl_band, p_compat: $.data.compatibility_status, p_elig: $.data.insulation_eligible } }
          assert:
            - "p_eff == 65.5 and p_band == 65 and p_compat == INCOMPATIBLE_RESIDENTIAL and p_elig == true"

  - section: state_machines
    instances:
      - name: complaint_begin_review_twice_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.NoiseComplaint.RECEIVED_to_UNDER_REVIEW"
          - "errors[ERR_INVALID_COMPLAINT_STATE]"
        distinguishing_aspect: "begin-review on an already UNDER_REVIEW complaint -> ERR_INVALID_COMPLAINT_STATE; no version increment."
        test_recipe:
          setup: ["complaint in UNDER_REVIEW"]
          setup_api_calls:
            - { call: "POST /noise-program/complainants", payload: { full_name: "SM One", email: "sm1@x.com", address_line: "4 Sm St", zone_code: "Z1" }, as: CommunityLiaison, captures: { comp_id: $.data.id } }
            - { call: "POST /noise-program/noise-complaints", payload: { complainant_id: "${comp_id}", occurred_at: "2026-07-15T09:00:00Z", channel: "WEB", disturbance_type: "OTHER" }, as: Complainant, as_user_id: "${comp_id}", captures: { c_id: $.data.id } }
            - { call: "POST /noise-program/noise-complaints/${c_id}/begin-review", payload: {}, as: NoiseAnalyst }
          trigger:
            - { call: "POST /noise-program/noise-complaints/${c_id}/begin-review", payload: {}, as: NoiseAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_COMPLAINT_STATE (http 409)"

      - name: complaint_withdraw_twice_rejected_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.NoiseComplaint"
          - "errors[ERR_INVALID_COMPLAINT_STATE]"
        distinguishing_aspect: "WITHDRAWN is terminal: a second withdraw -> ERR_INVALID_COMPLAINT_STATE."
        test_recipe:
          setup: ["complaint already WITHDRAWN"]
          setup_api_calls:
            - { call: "POST /noise-program/complainants", payload: { full_name: "SM Two", email: "sm2@x.com", address_line: "5 Sm St", zone_code: "Z1" }, as: CommunityLiaison, captures: { comp_id: $.data.id } }
            - { call: "POST /noise-program/noise-complaints", payload: { complainant_id: "${comp_id}", occurred_at: "2026-07-15T09:00:00Z", channel: "WEB", disturbance_type: "OTHER" }, as: Complainant, as_user_id: "${comp_id}", captures: { c_id: $.data.id } }
            - { call: "POST /noise-program/noise-complaints/${c_id}/withdraw", payload: {}, as: Complainant, as_user_id: "${comp_id}" }
          trigger:
            - { call: "POST /noise-program/noise-complaints/${c_id}/withdraw", payload: {}, as: Complainant, as_user_id: "${comp_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_COMPLAINT_STATE"

      - name: complaint_info_request_roundtrip_stores_note
        claim_type: valid_transition
        grounds:
          - "state_machines.NoiseComplaint.UNDER_REVIEW_to_AWAITING_COMPLAINANT"
          - "state_machines.NoiseComplaint.AWAITING_COMPLAINANT_to_UNDER_REVIEW"
        distinguishing_aspect: "request-info moves UNDER_REVIEW -> AWAITING_COMPLAINANT and stores info_request_note; owner provide-info returns it to UNDER_REVIEW."
        test_recipe:
          setup: ["complaint in UNDER_REVIEW"]
          setup_api_calls:
            - { call: "POST /noise-program/complainants", payload: { full_name: "SM Three", email: "sm3@x.com", address_line: "6 Sm St", zone_code: "Z1" }, as: CommunityLiaison, captures: { comp_id: $.data.id } }
            - { call: "POST /noise-program/noise-complaints", payload: { complainant_id: "${comp_id}", occurred_at: "2026-07-15T09:00:00Z", channel: "WEB", disturbance_type: "OTHER" }, as: Complainant, as_user_id: "${comp_id}", captures: { c_id: $.data.id } }
            - { call: "POST /noise-program/noise-complaints/${c_id}/begin-review", payload: {}, as: NoiseAnalyst }
          trigger:
            - { call: "POST /noise-program/noise-complaints/${c_id}/request-info", payload: { info_request_note: "Need exact time." }, as: NoiseAnalyst, captures: { st1: $.data.status, note: $.data.info_request_note } }
            - { call: "POST /noise-program/noise-complaints/${c_id}/provide-info", payload: { narrative: "It was 03:12 local." }, as: Complainant, as_user_id: "${comp_id}", captures: { st2: $.data.status } }
          assert:
            - "st1 == AWAITING_COMPLAINANT and note == 'Need exact time.'"
            - "st2 == UNDER_REVIEW"

      - name: complaint_reopen_after_30_days_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.NoiseComplaint.CLOSED_UNSUBSTANTIATED_to_REOPENED"
          - "errors[ERR_REOPEN_WINDOW_EXPIRED]"
        distinguishing_aspect: "Complaint closed at 2026-08-01; clock advanced to 2026-09-01 (> closed_at + 30d) -> reopen rejected with ERR_REOPEN_WINDOW_EXPIRED."
        test_recipe:
          setup: ["complaint CLOSED_UNSUBSTANTIATED at default clock"]
          setup_api_calls:
            - { call: "POST /noise-program/complainants", payload: { full_name: "SM Four", email: "sm4@x.com", address_line: "7 Sm St", zone_code: "Z1" }, as: CommunityLiaison, captures: { comp_id: $.data.id } }
            - { call: "POST /noise-program/noise-complaints", payload: { complainant_id: "${comp_id}", occurred_at: "2026-07-15T09:00:00Z", channel: "WEB", disturbance_type: "OTHER" }, as: Complainant, as_user_id: "${comp_id}", captures: { c_id: $.data.id } }
            - { call: "POST /noise-program/noise-complaints/${c_id}/begin-review", payload: {}, as: NoiseAnalyst }
            - { call: "POST /noise-program/noise-complaints/${c_id}/close", payload: { outcome: "UNSUBSTANTIATED" }, as: NoiseAnalyst }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: NoiseOfficeAdmin }
          trigger:
            - { call: "POST /noise-program/noise-complaints/${c_id}/reopen", payload: { reason: "late plea" }, as: Complainant, as_user_id: "${comp_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_REOPEN_WINDOW_EXPIRED (http 422)"

      - name: complaint_fourth_reopen_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.NoiseComplaint.CLOSED_UNSUBSTANTIATED_to_REOPENED"
          - "errors[ERR_REOPEN_LIMIT_REACHED]"
        distinguishing_aspect: "After 3 close/reopen cycles (reopen_count == 3), the 4th reopen fails with ERR_REOPEN_LIMIT_REACHED."
        test_recipe:
          setup: ["complaint closed 3 times and reopened 3 times (reopen_count == 3), currently CLOSED_UNSUBSTANTIATED"]
          setup_api_calls:
            - { call: "POST /noise-program/complainants", payload: { full_name: "SM Five", email: "sm5@x.com", address_line: "8 Sm St", zone_code: "Z1" }, as: CommunityLiaison, captures: { comp_id: $.data.id } }
            - { call: "POST /noise-program/noise-complaints", payload: { complainant_id: "${comp_id}", occurred_at: "2026-07-15T09:00:00Z", channel: "WEB", disturbance_type: "OTHER" }, as: Complainant, as_user_id: "${comp_id}", captures: { c_id: $.data.id } }
            - { call: "POST /noise-program/noise-complaints/${c_id}/begin-review", payload: {}, as: NoiseAnalyst }
            - { call: "POST /noise-program/noise-complaints/${c_id}/close", payload: { outcome: "UNSUBSTANTIATED" }, as: NoiseAnalyst }
            - { call: "POST /noise-program/noise-complaints/${c_id}/reopen", payload: { reason: "r1" }, as: Complainant, as_user_id: "${comp_id}" }
            - { call: "POST /noise-program/noise-complaints/${c_id}/resume-review", payload: {}, as: NoiseAnalyst }
            - { call: "POST /noise-program/noise-complaints/${c_id}/close", payload: { outcome: "UNSUBSTANTIATED" }, as: NoiseAnalyst }
            - { call: "POST /noise-program/noise-complaints/${c_id}/reopen", payload: { reason: "r2" }, as: Complainant, as_user_id: "${comp_id}" }
            - { call: "POST /noise-program/noise-complaints/${c_id}/resume-review", payload: {}, as: NoiseAnalyst }
            - { call: "POST /noise-program/noise-complaints/${c_id}/close", payload: { outcome: "UNSUBSTANTIATED" }, as: NoiseAnalyst }
            - { call: "POST /noise-program/noise-complaints/${c_id}/reopen", payload: { reason: "r3" }, as: Complainant, as_user_id: "${comp_id}" }
            - { call: "POST /noise-program/noise-complaints/${c_id}/resume-review", payload: {}, as: NoiseAnalyst }
            - { call: "POST /noise-program/noise-complaints/${c_id}/close", payload: { outcome: "UNSUBSTANTIATED" }, as: NoiseAnalyst }
          trigger:
            - { call: "POST /noise-program/noise-complaints/${c_id}/reopen", payload: { reason: "r4" }, as: Complainant, as_user_id: "${comp_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_REOPEN_LIMIT_REACHED (http 409)"

      - name: event_third_reclassify_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.NoiseEvent.CLASSIFIED_COMMUNITY_to_SCREENING"
          - "errors[ERR_RECLASSIFY_LIMIT_REACHED]"
        distinguishing_aspect: "reclassify_count reaches 2 after two loops; the third reclassify fails with ERR_RECLASSIFY_LIMIT_REACHED."
        test_recipe:
          setup: ["event classified and reclassified twice, currently CLASSIFIED_COMMUNITY"]
          setup_api_calls:
            - { call: "POST /noise-program/noise-monitors", payload: { station_code: "MR1", zone_code: "Z1", latitude: 47.1, longitude: -122.3, commissioned_at: "2026-01-01T00:00:00Z" }, as: NoiseOfficeAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /noise-program/noise-monitors/${m_id}/events", payload: { started_at: "2026-07-20T10:00:00Z", duration_seconds: 40, lmax_db: 72.0, sel_db: 90.0 }, as: NoiseOfficeAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /noise-program/noise-events/${e_id}/begin-screening", payload: {}, as: NoiseAnalyst }
            - { call: "POST /noise-program/noise-events/${e_id}/classify", payload: { classification: "COMMUNITY" }, as: NoiseAnalyst }
            - { call: "POST /noise-program/noise-events/${e_id}/reclassify", payload: {}, as: NoiseAnalyst }
            - { call: "POST /noise-program/noise-events/${e_id}/classify", payload: { classification: "COMMUNITY" }, as: NoiseAnalyst }
            - { call: "POST /noise-program/noise-events/${e_id}/reclassify", payload: {}, as: NoiseAnalyst }
            - { call: "POST /noise-program/noise-events/${e_id}/classify", payload: { classification: "COMMUNITY" }, as: NoiseAnalyst, captures: { rc: $.data.reclassify_count } }
          trigger:
            - { call: "POST /noise-program/noise-events/${e_id}/reclassify", payload: {}, as: NoiseAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "rc == 2 and err == ERR_RECLASSIFY_LIMIT_REACHED (http 409)"

      - name: event_classify_after_discard_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.NoiseEvent"
          - "errors[ERR_INVALID_EVENT_STATE]"
        distinguishing_aspect: "DISCARDED is terminal: classify on a discarded event -> ERR_INVALID_EVENT_STATE."
        test_recipe:
          setup: ["event DISCARDED"]
          setup_api_calls:
            - { call: "POST /noise-program/noise-monitors", payload: { station_code: "MR2", zone_code: "Z1", latitude: 47.1, longitude: -122.3, commissioned_at: "2026-01-01T00:00:00Z" }, as: NoiseOfficeAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /noise-program/noise-monitors/${m_id}/events", payload: { started_at: "2026-07-20T10:00:00Z", duration_seconds: 40, lmax_db: 72.0, sel_db: 90.0 }, as: NoiseOfficeAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /noise-program/noise-events/${e_id}/begin-screening", payload: {}, as: NoiseAnalyst }
            - { call: "POST /noise-program/noise-events/${e_id}/discard", payload: { reason: "ambient" }, as: NoiseAnalyst }
          trigger:
            - { call: "POST /noise-program/noise-events/${e_id}/classify", payload: { classification: "COMMUNITY" }, as: NoiseAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_EVENT_STATE"

      - name: notification_acknowledge_from_draft_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.OperatorNotification.SENT_to_ACKNOWLEDGED"
          - "errors[ERR_INVALID_NOTIFICATION_STATE]"
        distinguishing_aspect: "acknowledge on a DRAFT (never sent) notification -> ERR_INVALID_NOTIFICATION_STATE."
        test_recipe:
          setup: ["operator, complainant+complaint, DRAFT notification"]
          setup_api_calls:
            - { call: "POST /noise-program/complainants", payload: { full_name: "SM Six", email: "sm6@x.com", address_line: "9 Sm St", zone_code: "Z1" }, as: CommunityLiaison, captures: { comp_id: $.data.id } }
            - { call: "POST /noise-program/operators", payload: { name: "Air Ten", iata_code: "A10", contact_email: "ops@airten.example" }, as: NoiseOfficeAdmin, captures: { op_id: $.data.id } }
            - { call: "POST /noise-program/noise-complaints", payload: { complainant_id: "${comp_id}", occurred_at: "2026-07-15T09:00:00Z", channel: "WEB", disturbance_type: "OTHER" }, as: Complainant, as_user_id: "${comp_id}", captures: { c_id: $.data.id } }
            - { call: "POST /noise-program/operator-notifications", payload: { operator_id: "${op_id}", complaint_id: "${c_id}", severity: "ADVISORY", subject: "Draft", body: "Draft body." }, as: NoiseAnalyst, captures: { n_id: $.data.id } }
          trigger:
            - { call: "POST /noise-program/operator-notifications/${n_id}/acknowledge", payload: {}, as: OperatorRep, as_user_id: "${op_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_NOTIFICATION_STATE"

      - name: notification_short_response_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.OperatorNotification.ACKNOWLEDGED_to_RESPONSE_RECEIVED"
          - "errors[ERR_RESPONSE_TOO_SHORT]"
        distinguishing_aspect: "response_text of 10 characters (< 20) -> ERR_RESPONSE_TOO_SHORT; the notification stays ACKNOWLEDGED."
        test_recipe:
          setup: ["notification ACKNOWLEDGED"]
          setup_api_calls:
            - { call: "POST /noise-program/complainants", payload: { full_name: "SM Seven", email: "sm7@x.com", address_line: "10 Sm St", zone_code: "Z1" }, as: CommunityLiaison, captures: { comp_id: $.data.id } }
            - { call: "POST /noise-program/operators", payload: { name: "Air Eleven", iata_code: "A11", contact_email: "ops@aireleven.example" }, as: NoiseOfficeAdmin, captures: { op_id: $.data.id } }
            - { call: "POST /noise-program/noise-complaints", payload: { complainant_id: "${comp_id}", occurred_at: "2026-07-15T09:00:00Z", channel: "WEB", disturbance_type: "OTHER" }, as: Complainant, as_user_id: "${comp_id}", captures: { c_id: $.data.id } }
            - { call: "POST /noise-program/operator-notifications", payload: { operator_id: "${op_id}", complaint_id: "${c_id}", severity: "FORMAL", subject: "Q", body: "Please respond." }, as: NoiseAnalyst, captures: { n_id: $.data.id } }
            - { call: "POST /noise-program/operator-notifications/${n_id}/send", payload: {}, as: NoiseAnalyst }
            - { call: "POST /noise-program/operator-notifications/${n_id}/acknowledge", payload: {}, as: OperatorRep, as_user_id: "${op_id}" }
          trigger:
            - { call: "POST /noise-program/operator-notifications/${n_id}/respond", payload: { response_text: "too short!" }, as: OperatorRep, as_user_id: "${op_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_RESPONSE_TOO_SHORT (http 422); OperatorNotification.${n_id}.status remains ACKNOWLEDGED"

      - name: notification_auto_escalates_after_due_at_on_clock_advance
        claim_type: auto_transition
        grounds:
          - "state_machines.OperatorNotification.SENT_to_ESCALATED"
          - "entities.OperatorNotification.fields.due_at"
        distinguishing_aspect: "Sent at 2026-08-01 (due 2026-08-11); advancing the clock to 2026-08-12 auto-escalates (severity ESCALATION) and demotes the operator GOOD -> WATCH (grace stays 15 — not yet PROBATION)."
        test_recipe:
          setup: ["SENT notification (never acknowledged)"]
          setup_api_calls:
            - { call: "POST /noise-program/complainants", payload: { full_name: "SM Eight", email: "sm8@x.com", address_line: "11 Sm St", zone_code: "Z1" }, as: CommunityLiaison, captures: { comp_id: $.data.id } }
            - { call: "POST /noise-program/operators", payload: { name: "Air Twelve", iata_code: "A12", contact_email: "ops@airtwelve.example" }, as: NoiseOfficeAdmin, captures: { op_id: $.data.id } }
