              as: GateChair
              as_user_id: "chair-tk"
              captures: { tk_p_v2: $.data.version }
          trigger:
            - call: "POST /innovation-projects/${tk_p_id}/business-cases"
              payload: { expected_project_version: "${tk_p_v2}", variant_mode: "BOTTOM_UP", category_size_units_year: 5000000, target_share_pct: 3.00, cogs_per_unit_usd: 3.2000, slotting_fees_usd: 50000.00, capex_usd: 300000.00, discount_rate_pct: 9.00 }
              as: InnovationLead
            - call: "POST /innovation-projects/${tk_p_id}/formulations"
              payload: { expected_project_version: "${tk_p_v2}", spec_summary: "Toffee inclusion at 12 percent", allergen_regime: "NONE", target_shelf_life_days: 180, unit_cost_usd: 3.2000 }
              as: RnDLead
            - call: "POST /innovation-projects/${tk_p_id}/gate-reviews"
