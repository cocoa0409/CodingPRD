    side_effects: ["status=OPEN"]

  - method: GET
    path: "/studios"
    description: "List Studios"
    roles: [StudioManager, FrontDesk, LashTech, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: "Studio[]"
    side_effects: []

  - method: GET
    path: "/studios/{id}"
    description: "Get a Studio"
    roles: [StudioManager, FrontDesk, LashTech, Member]
    code: 200
    input: []
    output: Studio
    side_effects: []

  # ---- ServiceType (FK studio_id) ----
  - method: POST
    path: "/service-types"
