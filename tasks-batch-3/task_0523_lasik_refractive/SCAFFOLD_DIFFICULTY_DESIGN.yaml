  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cancel_case_cascade_to_financing_and_financial_status
        grounds:
          - state_machines.SurgeryCase.clinical_status IN {PLANNED, SCHEDULED, CONSENTED}_to_clinical_status=CANCELLED
          - entities.SuiteBooking.fields.status
          - entities.ConsentForm.fields.status
          - entities.FinancingPlan.fields.status
        distinguishing_aspect: |
          Depth-3 chain triggered by cancel: cancel sets clinical_status=CANCELLED (hop1) -> releases the ACTIVE booking and
          cancels the OPEN financing plan (hop2) -> because the plan was PAID_IN_FULL the case financial_status flips to REFUNDED (hop3);
          each link is caused by the previous, not by the cancel directly.
        test_recipe:
          setup:
            - "A SCHEDULED, PAID_IN_FULL case with one ACTIVE SuiteBooking and one SETTLED financing plan (paid in full)."
          setup_api_calls:
            - call: "POST /refractive/packages"
              payload: { tier: "STANDARD", base_price_cents: 500000, deposit_cents: 50000, enhancement_window_days: 365, outcome_guarantee_uncorrected_va: 1.0, refund_mode: "PRO_RATA" }
              as: Coordinator
              captures: { pkg: $.data.id }
