              payload: {}
              as: Regulator
              captures: { e_site: $.data.error_id }
            - call: "GET /relicensing/study-plans/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Regulator
              captures: { e_plan: $.data.error_id }
            - call: "GET /relicensing/studies/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Regulator
              captures: { e_study: $.data.error_id }
            - call: "GET /relicensing/comments/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Regulator
              captures: { e_comment: $.data.error_id }
            - call: "GET /relicensing/parties/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Regulator
              captures: { e_party: $.data.error_id }
            - call: "GET /relicensing/settlements/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Regulator
              captures: { e_stl: $.data.error_id }
            - call: "GET /relicensing/water-quality-certifications/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Regulator
              captures: { e_wqc: $.data.error_id }
            - call: "GET /relicensing/applications/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Regulator
              captures: { e_app: $.data.error_id }
            - call: "GET /relicensing/orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Regulator
              captures: { e_order: $.data.error_id }
            - call: "GET /relicensing/obligations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Regulator
