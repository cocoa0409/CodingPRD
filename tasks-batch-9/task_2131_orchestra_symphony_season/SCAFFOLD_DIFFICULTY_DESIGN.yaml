        grounds:
          - state_machines.GuestArtistContract.OFFERED_to_COUNTERED
          - state_machines.GuestArtistContract.COUNTERED_to_OFFERED
          - state_machines.GuestArtistContract.COUNTERED_to_SIGNED
          - entities.GuestArtistContract.fields.negotiation_round
          - entities.GuestArtistContract.fields.agreed_fee_cents
        distinguishing_aspect: |
          GuestArtistContract is CYCLIC: OFFERED -> COUNTERED -> OFFERED returns the row to a
          state it already occupied while negotiation_round advances 1 -> 2, and the second
          lap ends on the COUNTERED_to_SIGNED branch, which locks agreed_fee_cents to the
          artist's 1100000 counter rather than the orchestra's 950000 standing offer.
        test_recipe:
          setup:
            - "Season 2027 in PLANNING, one PROGRAMMED concert"
