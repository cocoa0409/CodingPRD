# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3460_generic_medicine_application_review_patent_certification
# 9 rules x >=2 instances, cross-referenced into SCAFFOLD.yaml 1.1-1.7.
# All recipes replay from empty-DB; logical clock default 2026-09-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: be_per_study_vs_pooled_average_verdict
        grounds:
          - calculations.be_adequacy_determination
          - entities.BioequivalenceStudy.fields.is_adequate
          - entities.BioequivalenceStudy.fields.status
        distinguishing_aspect: |
          Entity domain BIOEQUIVALENCE (contrasts with the patent/application
          domain of the sibling instance): the pinned per-study rule ACCEPTS a
          study set whose pooled-average variant would FAIL, so the same two
          studies yield different submittability verdicts under the two readings.
        test_recipe:
          setup:
            - "Logical clock at the default 2026-09-01T00:00:00Z. One applicant, one non-NCE reference product with no listed patents and no protected indications, one DRAFT application (FULL label)."
          setup_api_calls:
            - call: "POST /generic-drug-review/applicant-companies"
              payload: { legal_name: "Teva-like Generics LLC", contact_email: "reg@tlg.example", headquarters_country: "US" }
              as: ProgramAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /generic-drug-review/reference-products"
              payload: { brand_name: "Brandex", active_ingredient: "brandexol", strength: "20 mg", dosage_form: "TABLET", rld_approval_date: "2020-01-15", is_new_chemical_entity: false, indication_codes: ["IND-HTN"], patent_owner_user_id: "innovator-ops-1" }
              as: ProgramAdmin
              captures: { rld_id: $.data.id }
            - call: "POST /generic-drug-review/applications"
              payload: { reference_product_id: "${rld_id}", applicant_id: "${ac_id}", review_priority: "STANDARD", labeling_mode: "FULL", carved_indication_codes: [] }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /generic-drug-review/applications/${app_id}/bioequivalence-studies"
              payload: { study_type: "FASTING", analyte: "brandexol", auc_ratio_pct: 101.0, auc_ci_low_pct: 79.0, auc_ci_high_pct: 124.9, cmax_ratio_pct: 99.0, cmax_ci_low_pct: 81.0, cmax_ci_high_pct: 124.0 }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
              captures: { study_a_id: $.data.id, study_a_status: $.data.status }
            - call: "POST /generic-drug-review/applications/${app_id}/bioequivalence-studies"
              payload: { study_type: "FED", analyte: "brandexol", auc_ratio_pct: 100.0, auc_ci_low_pct: 80.2, auc_ci_high_pct: 124.9, cmax_ratio_pct: 99.5, cmax_ci_low_pct: 85.0, cmax_ci_high_pct: 120.0 }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
              captures: { study_b_id: $.data.id, study_b_status: $.data.status }
            - call: "POST /generic-drug-review/applications/${app_id}/submit"
              payload: {}
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
              captures: { app_status_after: $.data.status }
          assert:
            - "BioequivalenceStudy.${study_a_id}.is_adequate == false and status == DEFICIENT (rounded auc_ci_low 79.00 < 80.00)"
            - "BioequivalenceStudy.${study_b_id}.is_adequate == true and status == ACCEPTED"
            - "pooled-average variant check: mean of the two auc_ci_low values is (79.00 + 80.20) / 2 == 79.60, which would FAIL the 80.00 bound; the official per-study rule instead leaves study B ACCEPTED"
            - "GenericApplication.${app_id}.status after submit == RECEIVED, proving the application is submittable on the strength of the single ACCEPTED study"

      - name: approval_posture_optimistic_vs_conservative_window
        grounds:
          - calculations.approval_blocked_posture
          - entities.GenericApplication.fields.patent_blocked_until
          - state_machines.PatentChallengeNotice.NOTICE_SENT_to_NO_SUIT_FILED
        distinguishing_aspect: |
          Entity domain APPLICATION/PATENT-POSTURE (contrasts with the BE
          domain of the sibling instance): while the 45-day suit window is
          still open and no suit is filed, the pinned OPTIMISTIC variant
          permits immediate full approval, whereas the conservative variant
          would block until suit_deadline.
        test_recipe:
          setup:
            - "Clock default 2026-09-01. RLD with one LISTED patent expiring 2030-06-30; application with an accepted BE study, a PASSED domestic facility inspection, and a PARAGRAPH_IV_CHALLENGE certification; application submitted at 2026-09-01 and notice sent 2026-09-10 (timely); no suit filed; clock advanced to 2026-09-15 with the suit window open until 2026-10-25."
          setup_api_calls:
            - call: "POST /generic-drug-review/applicant-companies"
              payload: { legal_name: "Optimistic Generics Inc", contact_email: "reg@og.example", headquarters_country: "US" }
              as: ProgramAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /generic-drug-review/reference-products"
              payload: { brand_name: "Patentex", active_ingredient: "patentexol", strength: "50 mg", dosage_form: "CAPSULE", rld_approval_date: "2019-05-20", is_new_chemical_entity: false, indication_codes: ["IND-CHF"], patent_owner_user_id: "innovator-ops-9" }
              as: ProgramAdmin
              captures: { rld_id: $.data.id }
            - call: "POST /generic-drug-review/reference-products/${rld_id}/listed-patents"
              payload: { patent_number: "US9000001", patent_type: "DRUG_SUBSTANCE", expiry_date: "2030-06-30" }
              as: InnovatorSponsor
              as_user_id: "innovator-ops-9"
              captures: { pat_id: $.data.id }
            - call: "POST /generic-drug-review/applications"
              payload: { reference_product_id: "${rld_id}", applicant_id: "${ac_id}", review_priority: "STANDARD", labeling_mode: "FULL", carved_indication_codes: [] }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
              captures: { app_id: $.data.id, app_v0: $.data.version }
            - call: "POST /generic-drug-review/applications/${app_id}/bioequivalence-studies"
              payload: { study_type: "FASTING", analyte: "patentexol", auc_ratio_pct: 100.0, auc_ci_low_pct: 92.0, auc_ci_high_pct: 108.0, cmax_ratio_pct: 99.0, cmax_ci_low_pct: 90.0, cmax_ci_high_pct: 110.0 }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
            - call: "POST /generic-drug-review/applications/${app_id}/patent-certifications"
              payload: { patent_id: "${pat_id}", certification_type: "PARAGRAPH_IV_CHALLENGE", expected_application_version: "${app_v0}" }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
              captures: { cert_id: $.data.id }
            - call: "POST /generic-drug-review/manufacturing-facilities"
              payload: { applicant_id: "${ac_id}", facility_name: "Og Plant", fei_number: "FEI-OG-1", country_code: "US" }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /generic-drug-review/facility-inspections"
              payload: { facility_id: "${fac_id}", application_id: "${app_id}", scheduled_start_date: "2026-09-03", scheduled_end_date: "2026-09-05" }
              as: RegulatoryReviewer
              captures: { insp_id: $.data.id }
            - call: "POST /generic-drug-review/facility-inspections/${insp_id}/record-outcome"
              payload: { outcome: "PASSED" }
              as: FacilityInspector
            - call: "POST /generic-drug-review/applications/${app_id}/submit"
              payload: {}
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /generic-drug-review/patent-certifications/${cert_id}/notices"
              payload: {}
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
              captures: { notice_id: $.data.id, suit_deadline: $.data.suit_deadline, is_timely: $.data.is_timely }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /generic-drug-review/applications/${app_id}/approval-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              captures: { final_status: $.data.status, approval_date: $.data.approval_date }
          assert:
            - "PatentChallengeNotice.${notice_id}.is_timely == true and suit_deadline == \"2026-10-25\""
            - "PatentChallengeNotice.${notice_id}.status == NOTICE_SENT at decision time (window open, no suit)"
            - "GenericApplication.${app_id}.status == APPROVED and approval_date == \"2026-09-15\" — the OPTIMISTIC variant treats the open suit window as no block"
            - "conservative variant check: it would have computed patent_blocked_until == \"2026-10-25\" and forced TENTATIVE_APPROVAL; the observed APPROVED proves the optimistic reading is the pinned one"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: goal_date_priority_base_plus_stacked_major_extensions
        grounds:
          - calculations.goal_date_computation
          - entities.ReviewCycle.fields.goal_date
          - entities.ReviewCycle.fields.major_amendment_extensions_count
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: the goal date
          combines a conditional priority base (8 vs 10 months) with an
          additive stack of 3-month MAJOR-amendment extensions over a clamped
          month arithmetic, unlike the rounding-order instance (mode b) and
          the evaluation-order instance (mode c).
        test_recipe:
          setup:
            - "Clock default 2026-09-01. Applicant, non-NCE RLD with no patents, PRIORITY application with an ACCEPTED BE study; submitted at 2026-09-01 (cycle 1 OPEN, base 8 months, goal 2027-05-01)."
          setup_api_calls:
            - call: "POST /generic-drug-review/applicant-companies"
              payload: { legal_name: "Goaldate Generics", contact_email: "reg@gg.example", headquarters_country: "US" }
              as: ProgramAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /generic-drug-review/reference-products"
              payload: { brand_name: "Goaldrug", active_ingredient: "goaldrugol", strength: "10 mg", dosage_form: "TABLET", rld_approval_date: "2018-03-01", is_new_chemical_entity: false, indication_codes: ["IND-HTN"], patent_owner_user_id: "innovator-ops-2" }
              as: ProgramAdmin
              captures: { rld_id: $.data.id }
            - call: "POST /generic-drug-review/applications"
              payload: { reference_product_id: "${rld_id}", applicant_id: "${ac_id}", review_priority: "PRIORITY", labeling_mode: "FULL", carved_indication_codes: [] }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
              captures: { app_id: $.data.id }
            - call: "POST /generic-drug-review/applications/${app_id}/bioequivalence-studies"
              payload: { study_type: "FASTING", analyte: "goaldrugol", auc_ratio_pct: 100.0, auc_ci_low_pct: 92.0, auc_ci_high_pct: 108.0, cmax_ratio_pct: 99.0, cmax_ci_low_pct: 90.0, cmax_ci_high_pct: 110.0 }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
            - call: "POST /generic-drug-review/applications/${app_id}/submit"
              payload: {}
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
            - call: "GET /generic-drug-review/applications/${app_id}/review-cycles"
              payload: {}
              as: RegulatoryReviewer
              captures: { cyc_id: "$.data[0].id", goal_initial: "$.data[0].goal_date" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /generic-drug-review/review-cycles/${cyc_id}/issue-deficiency"
              payload: { deficiency_summary: "BE statistical review comments" }
              as: RegulatoryReviewer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-15T00:00:00Z" }
              as: ProgramAdmin
            - call: "GET /generic-drug-review/applications/${app_id}"
              payload: {}
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
              captures: { app_v_pre_am1: $.data.version }
            - call: "POST /generic-drug-review/applications/${app_id}/amendments"
              payload: { classification: "MAJOR", contains_new_be_data: true, expected_application_version: "${app_v_pre_am1}", notes: "new BE data" }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "GET /generic-drug-review/applications/${app_id}"
              payload: {}
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
              captures: { app_v_pre_am2: $.data.version }
          trigger:
            - call: "POST /generic-drug-review/applications/${app_id}/amendments"
              payload: { classification: "MAJOR", contains_new_be_data: false, expected_application_version: "${app_v_pre_am2}", notes: "unsolicited major update" }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
            - call: "GET /generic-drug-review/applications/${app_id}/review-cycles"
              payload: {}
              as: RegulatoryReviewer
              captures: { goal_final: "$.data[0].goal_date", ext_final: "$.data[0].major_amendment_extensions_count" }
          assert:
            - "initial cycle 1: base_review_months == 8 and goal_date == \"2027-05-01\""
            - "after the first MAJOR amendment: cycle status == AMENDMENT_RECEIVED, major_amendment_extensions_count == 1, goal_date == \"2027-08-01\""
            - "after the second (unsolicited) MAJOR amendment: major_amendment_extensions_count == 2 and goal_date == \"2027-11-01\""
            - "a MINOR amendment instead would have left goal_date at \"2027-08-01\" — the conditional classification input is what moves the date"

      - name: be_round_first_per_bound_vs_compare_raw
        grounds:
          - calculations.be_adequacy_determination
          - validations[priority=5]
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: each CI bound is
          rounded to 2 decimals (round_half_up) BEFORE the inclusive
          comparison, so 125.004 passes while compare-raw would fail it;
          distinct from the mode-(a) goal formula and the mode-(c) evaluation
          order instance.
        test_recipe:
          setup:
            - "Clock default 2026-09-01. Applicant, non-NCE RLD with no patents, DRAFT application."
          setup_api_calls:
            - call: "POST /generic-drug-review/applicant-companies"
              payload: { legal_name: "Rounding Generics", contact_email: "reg@rg.example", headquarters_country: "US" }
              as: ProgramAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /generic-drug-review/reference-products"
              payload: { brand_name: "Roundex", active_ingredient: "roundexol", strength: "5 mg", dosage_form: "TABLET", rld_approval_date: "2017-07-01", is_new_chemical_entity: false, indication_codes: ["IND-HTN"], patent_owner_user_id: "innovator-ops-3" }
              as: ProgramAdmin
              captures: { rld_id: $.data.id }
            - call: "POST /generic-drug-review/applications"
              payload: { reference_product_id: "${rld_id}", applicant_id: "${ac_id}", review_priority: "STANDARD", labeling_mode: "FULL", carved_indication_codes: [] }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /generic-drug-review/applications/${app_id}/bioequivalence-studies"
              payload: { study_type: "FASTING", analyte: "roundexol", auc_ratio_pct: 100.0, auc_ci_low_pct: 82.0, auc_ci_high_pct: 125.004, cmax_ratio_pct: 99.0, cmax_ci_low_pct: 90.0, cmax_ci_high_pct: 110.0 }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
              captures: { st_pass: $.data.id, st_pass_ok: $.data.is_adequate }
            - call: "POST /generic-drug-review/applications/${app_id}/bioequivalence-studies"
              payload: { study_type: "FASTING", analyte: "roundexol", auc_ratio_pct: 100.0, auc_ci_low_pct: 82.0, auc_ci_high_pct: 125.006, cmax_ratio_pct: 99.0, cmax_ci_low_pct: 90.0, cmax_ci_high_pct: 110.0 }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
              captures: { st_fail: $.data.id, st_fail_ok: $.data.is_adequate }
          assert:
            - "BioequivalenceStudy.${st_pass}.is_adequate == true and status == ACCEPTED: round_half_up(125.004, 2) == 125.00 meets the inclusive upper bound"
            - "BioequivalenceStudy.${st_fail}.is_adequate == false and status == DEFICIENT: round_half_up(125.006, 2) == 125.01 > 125.00"
            - "compare-raw variant check: raw 125.004 > 125.00 would have been DEFICIENT; the observed ACCEPTED proves the pinned round-first order"

      - name: exclusivity_window_anchor_evaluation_order
        grounds:
          - calculations.exclusivity_window_and_forfeiture
          - calculations.first_filer_determination
          - entities.ExclusivityAward.fields.exclusivity_end_date
          - entities.GenericApplication.fields.exclusivity_blocked
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency pinned by evaluation order:
          competitor B's block depends on A's exclusivity_end_date, which
          depends on A's marketing date, which depends on A's approval_date;
          the scaffold pins stored-field anchoring (approval_date recorded at
          approval, window computed from recorded marketing) so the value is
          well-defined — unlike mode (a) goal arithmetic and mode (b) rounding.
        test_recipe:
          setup:
            - "Clock default 2026-09-01. RLD with one LISTED patent expiring 2030-01-01. Applicant A files first with a P4 certification (award ELIGIBLE), notice timely, no suit; A approved 2026-12-01, markets 2026-12-10. Applicant B files second with its own P4 certification, notice timely, no suit; B otherwise fully clear."
          setup_api_calls:
            - call: "POST /generic-drug-review/applicant-companies"
              payload: { legal_name: "First Filer Pharma", contact_email: "reg@ffp.example", headquarters_country: "US" }
              as: ProgramAdmin
              captures: { ac_a: $.data.id }
            - call: "POST /generic-drug-review/applicant-companies"
              payload: { legal_name: "Second Filer Pharma", contact_email: "reg@sfp.example", headquarters_country: "US" }
              as: ProgramAdmin
              captures: { ac_b: $.data.id }
            - call: "POST /generic-drug-review/reference-products"
              payload: { brand_name: "Exclusex", active_ingredient: "exclusexol", strength: "100 mg", dosage_form: "TABLET", rld_approval_date: "2015-04-01", is_new_chemical_entity: false, indication_codes: ["IND-HTN"], patent_owner_user_id: "innovator-ops-4" }
              as: ProgramAdmin
              captures: { rld_id: $.data.id }
            - call: "POST /generic-drug-review/reference-products/${rld_id}/listed-patents"
              payload: { patent_number: "US9100002", patent_type: "DRUG_PRODUCT", expiry_date: "2030-01-01" }
              as: InnovatorSponsor
              as_user_id: "innovator-ops-4"
              captures: { pat_id: $.data.id }
            - call: "POST /generic-drug-review/applications"
              payload: { reference_product_id: "${rld_id}", applicant_id: "${ac_a}", review_priority: "STANDARD", labeling_mode: "FULL", carved_indication_codes: [] }
              as: ApplicantSponsor
              as_user_id: "${ac_a}"
              captures: { app_a: $.data.id, app_a_v0: $.data.version }
            - call: "POST /generic-drug-review/applications/${app_a}/bioequivalence-studies"
              payload: { study_type: "FASTING", analyte: "exclusexol", auc_ratio_pct: 100.0, auc_ci_low_pct: 92.0, auc_ci_high_pct: 108.0, cmax_ratio_pct: 99.0, cmax_ci_low_pct: 90.0, cmax_ci_high_pct: 110.0 }
              as: ApplicantSponsor
              as_user_id: "${ac_a}"
            - call: "POST /generic-drug-review/applications/${app_a}/patent-certifications"
              payload: { patent_id: "${pat_id}", certification_type: "PARAGRAPH_IV_CHALLENGE", expected_application_version: "${app_a_v0}" }
              as: ApplicantSponsor
              as_user_id: "${ac_a}"
              captures: { cert_a: $.data.id }
            - call: "POST /generic-drug-review/manufacturing-facilities"
              payload: { applicant_id: "${ac_a}", facility_name: "FFP Plant", fei_number: "FEI-FFP-1", country_code: "US" }
              as: ApplicantSponsor
              as_user_id: "${ac_a}"
              captures: { fac_a: $.data.id }
            - call: "POST /generic-drug-review/facility-inspections"
              payload: { facility_id: "${fac_a}", application_id: "${app_a}", scheduled_start_date: "2026-09-05", scheduled_end_date: "2026-09-07" }
              as: RegulatoryReviewer
              captures: { insp_a: $.data.id }
            - call: "POST /generic-drug-review/facility-inspections/${insp_a}/record-outcome"
              payload: { outcome: "PASSED" }
              as: FacilityInspector
            - call: "POST /generic-drug-review/applications/${app_a}/submit"
              payload: {}
              as: ApplicantSponsor
              as_user_id: "${ac_a}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /generic-drug-review/applications"
              payload: { reference_product_id: "${rld_id}", applicant_id: "${ac_b}", review_priority: "STANDARD", labeling_mode: "FULL", carved_indication_codes: [] }
              as: ApplicantSponsor
              as_user_id: "${ac_b}"
              captures: { app_b: $.data.id, app_b_v0: $.data.version }
            - call: "POST /generic-drug-review/applications/${app_b}/bioequivalence-studies"
              payload: { study_type: "FED", analyte: "exclusexol", auc_ratio_pct: 101.0, auc_ci_low_pct: 91.0, auc_ci_high_pct: 109.0, cmax_ratio_pct: 98.0, cmax_ci_low_pct: 89.0, cmax_ci_high_pct: 111.0 }
              as: ApplicantSponsor
              as_user_id: "${ac_b}"
            - call: "POST /generic-drug-review/applications/${app_b}/patent-certifications"
              payload: { patent_id: "${pat_id}", certification_type: "PARAGRAPH_IV_CHALLENGE", expected_application_version: "${app_b_v0}" }
              as: ApplicantSponsor
              as_user_id: "${ac_b}"
              captures: { cert_b: $.data.id }
            - call: "POST /generic-drug-review/manufacturing-facilities"
              payload: { applicant_id: "${ac_b}", facility_name: "SFP Plant", fei_number: "FEI-SFP-1", country_code: "US" }
              as: ApplicantSponsor
              as_user_id: "${ac_b}"
              captures: { fac_b: $.data.id }
            - call: "POST /generic-drug-review/facility-inspections"
              payload: { facility_id: "${fac_b}", application_id: "${app_b}", scheduled_start_date: "2026-09-08", scheduled_end_date: "2026-09-10" }
              as: RegulatoryReviewer
              captures: { insp_b: $.data.id }
            - call: "POST /generic-drug-review/facility-inspections/${insp_b}/record-outcome"
              payload: { outcome: "PASSED" }
              as: FacilityInspector
            - call: "POST /generic-drug-review/applications/${app_b}/submit"
              payload: {}
              as: ApplicantSponsor
              as_user_id: "${ac_b}"
            - call: "POST /_clock/set_current_utc"
