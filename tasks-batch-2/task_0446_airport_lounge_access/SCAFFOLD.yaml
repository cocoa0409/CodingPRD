# =============================================================================
# Task 0446 — Airport Lounge Access (Priority Pass style)
# SCAFFOLD.yaml  (§1.0–§1.7; no scaffold_difficulty_design / scaffold_corner_design keys)
# Difficulty band: Expert (§0.4)
# =============================================================================

scenario: |
  Airport Lounge Access (Priority Pass style): membership tier & visit allotment,
  eligibility (card/fare-class/status), check-in & capacity/overflow, guest fee &
  per-visit charge, network lounge directory, settlement to lounge, day-pass
  purchase, no-show/over-capacity

domain_name: airport-lounge-access
api_prefix: ""
# Flat topology: entities live at peer top-level collections (/lounges, /visits,
# /memberships, /day-passes, /settlements, /eligibility-cards, /guests,
# /ledger-entries, /membership-plans), linked by FKs, not a nested ownership tree.

# -----------------------------------------------------------------------------
# Complexity Profile (§0.1–§0.3)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Pricing engine"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: flat
  # Member, Lounge, Visit, DayPass, Settlement are peer entities linked by FKs;
  # no nested URL ownership tree. Guest is the one nested child (under Visit).

  state_machine_shape: branching
  # Visit forks HELD -> {CHECKED_IN, NO_SHOW, CANCELLED}; CHECKED_IN ->
  # {COMPLETED, ABANDONED} with divergent settlement/charge side-effect sets per
  # branch. DayPass and Member.standing carry independent non-linear machines.

  relationship_patterns:
    - one_to_many        # Lounge 1->* Visit; Member 1->* Visit; Visit 1->* Guest
    - cross_aggregate    # Visit references Member, Lounge, EligibilityCard, DayPass

  role_model: peer_roles
  # Member acts on own membership; LoungeAgent (entity_backed:Lounge) runs the
  # door (check-in/complete/no-show); NetworkAdmin (opaque) operates the network.

  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # --- Configuration: plan catalog -------------------------------------------
  - name: MembershipPlan
    parent: null
    common_fields: true
    fields:
      - { name: tier, type: enum, source: input, description: "STANDARD | PRESTIGE | PRESTIGE_PLUS", constraints: "unique across plans" }
      - { name: included_visits_per_year, type: integer, source: input, description: "Annual allotment of free primary visits; STANDARD typically 0, PRESTIGE_PLUS may be unlimited via sentinel", constraints: ">= 0; value -1 means UNLIMITED" }
      - { name: included_guest_visits_per_year, type: integer, source: input, description: "Annual allotment of free guest visits", constraints: ">= 0" }
      - { name: overage_charge_cents, type: integer, source: input, description: "Per-visit charge billed to the member when a primary visit is not covered by allotment", constraints: ">= 0" }
      - { name: guest_charge_cents, type: integer, source: input, description: "Per-guest charge billed to the member when a guest visit is not covered by guest allotment", constraints: ">= 0" }
      - { name: min_card_status, type: enum, source: input, description: "Minimum eligibility card status this plan requires a member to hold to remain ACTIVE", constraints: "BASIC | SILVER | GOLD" }
      - { name: annual_fee_cents, type: integer, source: input, description: "Membership annual fee (informational, billed at enrollment)", constraints: ">= 0" }

  # --- Resource: a network lounge --------------------------------------------
  - name: Lounge
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Lounge display name" }
      - { name: airport_code, type: string, source: input, description: "IATA airport code", constraints: "3 uppercase letters" }
      - { name: capacity, type: integer, source: input, description: "Maximum occupants present at once (primary + guests each count as one occupant)", constraints: ">= 1" }
      - { name: settlement_rate_cents, type: integer, source: input, description: "Amount the network owes this lounge per occupant on a COMPLETED visit", constraints: ">= 0" }
      - { name: guest_fee_cents, type: integer, source: input, description: "Lounge-set door fee per guest occupant, charged to the member at check-in in addition to plan guest_charge_cents", constraints: ">= 0" }
      - { name: day_pass_price_cents, type: integer, source: input, description: "Price a non-member or allotment-exhausted member pays for a single-use day pass to this lounge", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "OPEN | OVERFLOW | CLOSED; OPEN accepts holds, OVERFLOW only honours existing holds, CLOSED accepts none", default: "OPEN", constraints: "OPEN | OVERFLOW | CLOSED" }
      - { name: current_occupancy, type: integer, source: computed, description: "Sum of occupant_count over Visits at this lounge in status CHECKED_IN", constraints: ">= 0, <= capacity" }
      - { name: held_occupancy, type: integer, source: computed, description: "Sum of occupant_count over Visits at this lounge in status HELD", constraints: ">= 0" }
      - { name: settlement_balance_cents, type: integer, source: computed, description: "Running total the network owes this lounge: sum of Settlement.amount_cents for Settlements of this lounge in status PAYABLE", constraints: ">= 0" }

  # --- Resource: a member account --------------------------------------------
  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> MembershipPlan.id; the plan this member is enrolled on" }
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: membership_year_start, type: datetime, source: system, description: "UTC instant the current allotment year began; allotment counters reset relative to this on a year roll", constraints: "ISO 8601 UTC" }
      - { name: visits_used, type: integer, source: computed, description: "Count of primary visits in the current allotment year that consumed allotment (Visit.allotment_consumed == true AND status IN {CHECKED_IN, COMPLETED, NO_SHOW})", default: 0, constraints: ">= 0" }
      - { name: guest_visits_used, type: integer, source: computed, description: "Sum of Visit.guest_allotment_consumed over the member's Visits in the current allotment year in status IN {CHECKED_IN, COMPLETED, NO_SHOW}", default: 0, constraints: ">= 0" }
      - { name: standing, type: enum, source: computed, description: "GOOD | SUSPENDED; SUSPENDED members cannot open new holds. Driven solely by no_show_strikes crossing NO_SHOW_SUSPEND_THRESHOLD (and admin reinstate); card/fare eligibility is a separate per-hold gate, not a standing driver.", default: "GOOD", constraints: "GOOD | SUSPENDED" }
      - { name: no_show_strikes, type: integer, source: computed, description: "Count of NO_SHOW visits charged against this member in the current allotment year", default: 0, constraints: ">= 0" }
      - { name: wallet_balance_cents, type: integer, source: computed, description: "Running member ledger balance owed by the member: sum of LedgerEntry.amount_cents (POSTED) minus credits", default: 0, constraints: "may be negative when credits exceed charges" }

  # --- Resource: eligibility credential (card / fare-class / status) ----------
  - name: EligibilityCard
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the member this card belongs to" }
      - { name: card_status, type: enum, source: input, description: "Co-brand card tier: BASIC | SILVER | GOLD", constraints: "BASIC | SILVER | GOLD" }
      - { name: fare_class, type: enum, source: input, description: "Booked fare class for the active trip: ECONOMY | BUSINESS | FIRST", constraints: "ECONOMY | BUSINESS | FIRST" }
      - { name: active, type: boolean, source: system, description: "Whether this card is the member's currently active credential; at most one active card per member", default: true }
      - { name: valid_until, type: datetime, source: input, description: "UTC expiry instant of the credential; an EligibilityCard whose valid_until <= logical clock is expired", constraints: "ISO 8601 UTC" }

  # --- Resource: a check-in / visit ------------------------------------------
  - name: Visit
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the member checking in (null when entry is via a non-member DayPass)" }
      - { name: lounge_id, type: string, source: input, description: "FK -> Lounge.id; the lounge being entered" }
      - { name: eligibility_card_id, type: string, source: system, description: "FK -> EligibilityCard.id; the member's active card snapshotted at hold time (null for day-pass-only entry)" }
      - { name: day_pass_id, type: string, source: input, description: "FK -> DayPass.id; the day pass redeemed for this entry, when entry is on a day pass rather than allotment" }
      - { name: entry_mode, type: enum, source: computed, description: "ALLOTMENT | OVERAGE | DAY_PASS; how the primary occupant's entry was funded, pinned at hold time", constraints: "ALLOTMENT | OVERAGE | DAY_PASS" }
      - { name: guest_count, type: integer, source: input, description: "Number of guests accompanying the primary occupant at hold time", default: 0, constraints: ">= 0" }
      - { name: occupant_count, type: integer, source: computed, description: "1 + guest_count; the seats this visit occupies in the lounge", constraints: ">= 1" }
      - { name: allotment_consumed, type: boolean, source: computed, description: "true iff entry_mode == ALLOTMENT (primary visit drew from included_visits allotment)", default: false }
      - { name: guest_allotment_consumed, type: integer, source: computed, description: "Number of this visit's guests funded from the member's guest allotment at hold time (0..guest_count)", default: 0, constraints: ">= 0, <= guest_count" }
      - { name: status, type: enum, source: system, description: "HELD | CHECKED_IN | COMPLETED | NO_SHOW | CANCELLED | ABANDONED", default: "HELD", constraints: "HELD | CHECKED_IN | COMPLETED | NO_SHOW | CANCELLED | ABANDONED" }
      - { name: held_at, type: datetime, source: system, description: "Logical-clock instant the hold was opened", constraints: "ISO 8601 UTC" }
      - { name: hold_expires_at, type: datetime, source: system, description: "held_at + HOLD_TTL_MINUTES; a HELD visit at or past this instant is expired and swept to NO_SHOW by the next sweep", constraints: "ISO 8601 UTC" }
      - { name: member_charge_cents, type: integer, source: computed, description: "Total amount billed to the member for this visit at check-in (overage + guest charges + day-pass), pinned on CHECKED_IN", default: 0, constraints: ">= 0" }
      - { name: settlement_amount_cents, type: integer, source: computed, description: "Amount the network owes the lounge for this visit, pinned on COMPLETED", default: 0, constraints: ">= 0" }

  # --- Child: a guest on a visit ---------------------------------------------
  - name: Guest
    parent: Visit
    common_fields: true
    fields:
      - { name: visit_id, type: string, source: input, description: "FK -> Visit.id; the visit this guest is attached to" }
      - { name: full_name, type: string, source: input, description: "Guest full name" }
      - { name: funded_by, type: enum, source: computed, description: "GUEST_ALLOTMENT | GUEST_CHARGE; how this guest's entry was funded, pinned at hold time in created order", constraints: "GUEST_ALLOTMENT | GUEST_CHARGE" }
      - { name: charge_cents, type: integer, source: computed, description: "Member-borne charge for this guest (plan guest_charge_cents + lounge guest_fee_cents when GUEST_CHARGE, else lounge guest_fee_cents only)", default: 0, constraints: ">= 0" }

  # --- Resource: a day pass ---------------------------------------------------
  - name: DayPass
    parent: null
    common_fields: true
    fields:
      - { name: lounge_id, type: string, source: input, description: "FK -> Lounge.id; the lounge this pass admits to" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the purchasing member, null when purchased by a non-member buyer" }
      - { name: buyer_name, type: string, source: input, description: "Name of the buyer when no member_id is supplied (non-member purchase)" }
      - { name: price_cents, type: integer, source: computed, description: "Price paid, snapshotted from Lounge.day_pass_price_cents at purchase", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ISSUED | REDEEMED | REFUNDED | EXPIRED", default: "ISSUED", constraints: "ISSUED | REDEEMED | REFUNDED | EXPIRED" }
      - { name: valid_until, type: datetime, source: system, description: "purchased-at + DAY_PASS_TTL_HOURS; an ISSUED pass at or past this instant is expired", constraints: "ISO 8601 UTC" }
      - { name: redeemed_visit_id, type: string, source: system, description: "FK -> Visit.id; set when the pass is redeemed at a check-in, else null" }

  # --- Event/ledger: settlement owed to a lounge -----------------------------
  - name: Settlement
    parent: null
    common_fields: false
    fields:
      - { name: lounge_id, type: string, source: system, description: "FK -> Lounge.id; the lounge owed" }
      - { name: visit_id, type: string, source: system, description: "FK -> Visit.id; the completed visit that generated this settlement" }
      - { name: amount_cents, type: integer, source: system, description: "occupant_count * lounge.settlement_rate_cents, snapshotted at COMPLETED", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "PAYABLE | PAID | REVERSED", default: "PAYABLE", constraints: "PAYABLE | PAID | REVERSED" }

  # --- Event/ledger: member charge -------------------------------------------
  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; the charged member" }
      - { name: visit_id, type: string, source: system, description: "FK -> Visit.id; the visit that generated this entry, null for day-pass purchases not tied to a visit" }
      - { name: day_pass_id, type: string, source: system, description: "FK -> DayPass.id; the day-pass purchase that generated this entry, null otherwise" }
      - { name: kind, type: enum, source: system, description: "OVERAGE | GUEST_CHARGE | LOUNGE_GUEST_FEE | DAY_PASS | OVERAGE_REVERSAL | DAY_PASS_REFUND", constraints: "OVERAGE | GUEST_CHARGE | LOUNGE_GUEST_FEE | DAY_PASS | OVERAGE_REVERSAL | DAY_PASS_REFUND" }
      - { name: amount_cents, type: integer, source: system, description: "Signed amount: positive = charge to member, negative = credit", constraints: "non-zero" }
      - { name: status, type: enum, source: system, description: "POSTED | VOID", default: "POSTED", constraints: "POSTED | VOID" }

  # --- Resource: a bookable shower suite (amenity) ---------------------------
  - name: ShowerSuite
    parent: null
    common_fields: true
    fields:
      - { name: lounge_id, type: string, source: input, description: "FK -> Lounge.id; the lounge this suite sits in" }
      - { name: label, type: string, source: input, description: "Suite label, e.g. Suite A" }
      - { name: turnover_minutes, type: integer, source: input, description: "Cleaning buffer enforced AFTER each booking; the next booking's start must be >= prior booking's end_at + turnover_minutes", default: 0, constraints: ">= 0" }
      - { name: out_of_service, type: boolean, source: system, description: "When true the suite accepts no bookings", default: false }

  # --- Resource: a shower suite reservation (temporal interval) ---------------
  - name: ShowerReservation
    parent: null
    common_fields: true
    fields:
      - { name: shower_suite_id, type: string, source: input, description: "FK -> ShowerSuite.id; the suite booked" }
      - { name: visit_id, type: string, source: input, description: "FK -> Visit.id; the checked-in visit this reservation belongs to" }
      - { name: start_at, type: datetime, source: input, description: "Booking start instant (inclusive); intervals are half-open [start_at, end_at)", constraints: "ISO 8601 UTC; start_at < end_at" }
      - { name: end_at, type: datetime, source: input, description: "Booking end instant (exclusive)", constraints: "ISO 8601 UTC; end_at > start_at" }
      - { name: status, type: enum, source: system, description: "BOOKED | CANCELLED | COMPLETED", default: "BOOKED", constraints: "BOOKED | CANCELLED | COMPLETED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # --- Visit: branching with divergent side-effect sets (Rule 3, Rule 4) -----
  - entity: Visit
    initial_state: HELD
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED, ABANDONED]
    transitions:
      - from: HELD
        to: CHECKED_IN
        trigger: "POST /visits/{visit_id}/check-in"
        actor: LoungeAgent
        preconditions:
          - "Visit.status == HELD"
          - "Visit.hold_expires_at > logical clock (hold not expired)"
          - "Lounge.status IN {OPEN, OVERFLOW}"
          - "Lounge.current_occupancy + Visit.occupant_count <= Lounge.capacity"
          - "Member.standing == GOOD when entry_mode != DAY_PASS"
        side_effects:
          - "Computes member_charge_cents via calc compute_member_charge (overage + per-guest charges) and pins it on the Visit"
          - "Posts LedgerEntry rows: one OVERAGE row when entry_mode == OVERAGE; one GUEST_CHARGE row and/or one LOUNGE_GUEST_FEE row per guest per calc compute_member_charge"
          - "Member.wallet_balance_cents recomputed (derived) from POSTED LedgerEntry rows"
          - "Lounge.current_occupancy recomputed += occupant_count; Lounge.held_occupancy recomputed -= occupant_count"
          - "When day_pass_id present: DayPass HELD-redemption finalised (REDEEMED), redeemed_visit_id = this visit"
          - "increments Visit.version by 1"
      - from: HELD
        to: CANCELLED
        trigger: "POST /visits/{visit_id}/cancel"
        actor: Member
        preconditions:
          - "Visit.status == HELD"
          - "acting Member.id == Visit.member_id"
        side_effects:
          - "Lounge.held_occupancy recomputed -= occupant_count"
          - "When day_pass_id present and DayPass.status == REDEEMED-held: DayPass reverts to ISSUED, redeemed_visit_id cleared"
          - "No allotment is consumed (allotment_consumed stays false in member counters because status leaves the {CHECKED_IN,COMPLETED,NO_SHOW} set)"
          - "increments Visit.version by 1"
      - from: HELD
        to: NO_SHOW
        trigger: "POST /lounges/{lounge_id}/sweep (system sweep) for any HELD visit at/after hold_expires_at"
        actor: system
        preconditions:
          - "Visit.status == HELD"
          - "Visit.hold_expires_at <= logical clock"
        side_effects:
          - "Lounge.held_occupancy recomputed -= occupant_count"
          - "Member.no_show_strikes recomputed += 1 when entry_mode != DAY_PASS"
          - "CASCADE: when recomputed Member.no_show_strikes >= NO_SHOW_SUSPEND_THRESHOLD, Member.standing flips GOOD -> SUSPENDED (which itself blocks future holds via the HELD precondition)"
          - "allotment_consumed and guest_allotment_consumed count toward member usage (NO_SHOW is in the consuming set), so a no-show still burns allotment"
          - "When day_pass_id present: DayPass HELD-redemption reverts to EXPIRED (pass forfeited)"
          - "increments Visit.version by 1"
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /visits/{visit_id}/complete"
        actor: LoungeAgent
        preconditions:
          - "Visit.status == CHECKED_IN"
        side_effects:
          - "Computes settlement_amount_cents via calc compute_settlement (occupant_count * lounge.settlement_rate_cents) and pins it on the Visit"
          - "Creates a Settlement row (status PAYABLE) for the lounge for settlement_amount_cents"
          - "CASCADE: Lounge.settlement_balance_cents recomputed += settlement_amount_cents (derived from PAYABLE Settlements)"
          - "Lounge.current_occupancy recomputed -= occupant_count"
          - "increments Visit.version by 1"
      - from: CHECKED_IN
        to: ABANDONED
        trigger: "POST /lounges/{lounge_id}/sweep (system sweep) for CHECKED_IN visits whose member EligibilityCard expired mid-visit"
        actor: system
        preconditions:
          - "Visit.status == CHECKED_IN"
          - "Visit.eligibility_card_id is non-null AND that EligibilityCard.valid_until <= logical clock"
        side_effects:
          - "Lounge.current_occupancy recomputed -= occupant_count"
          - "NO Settlement is created (abandoned visit is not billable to the network); member_charge already posted at check-in is NOT reversed"
          - "increments Visit.version by 1"

  # --- DayPass: non-linear (refund loop / forfeiture) (Rule 3) ----------------
  - entity: DayPass
    initial_state: ISSUED
    terminal_states: [REFUNDED, EXPIRED]
    transitions:
      - from: ISSUED
        to: REDEEMED
        trigger: "POST /visits (open a hold with day_pass_id) then POST /visits/{visit_id}/check-in"
        actor: LoungeAgent
        preconditions:
          - "DayPass.status == ISSUED"
          - "DayPass.valid_until > logical clock"
          - "DayPass.lounge_id == the visit's lounge_id"
        side_effects:
          - "redeemed_visit_id set to the visit id"
          - "increments DayPass.version by 1"
      - from: REDEEMED
        to: ISSUED
        trigger: "POST /visits/{visit_id}/cancel (the redeeming hold is cancelled before check-in)"
        actor: Member
        preconditions:
          - "DayPass.status == REDEEMED"
          - "the redeeming Visit.status transitions HELD -> CANCELLED"
        side_effects:
          - "redeemed_visit_id cleared back to null"
          - "increments DayPass.version by 1"
      - from: ISSUED
        to: REFUNDED
        trigger: "POST /day-passes/{day_pass_id}/refund"
        actor: NetworkAdmin
        preconditions:
          - "DayPass.status == ISSUED (never redeemed)"
          - "DayPass.member_id is non-null (refunds only to member wallets)"
        side_effects:
          - "Posts a DAY_PASS_REFUND LedgerEntry (negative amount = -price_cents) for the member"
          - "CASCADE: Member.wallet_balance_cents recomputed (derived) from POSTED LedgerEntry rows, decreasing by price_cents"
          - "increments DayPass.version by 1"
      - from: ISSUED
        to: EXPIRED
        trigger: "POST /lounges/{lounge_id}/sweep (system sweep) for ISSUED passes at/after valid_until"
        actor: system
        preconditions:
          - "DayPass.status == ISSUED"
          - "DayPass.valid_until <= logical clock"
        side_effects:
          - "No refund (expired unredeemed passes are forfeited)"
          - "increments DayPass.version by 1"

  # --- Member.standing: cyclic suspend/reinstate (Rule 3, Rule 7) -------------
  # Standing is driven ONLY by no-show strikes (and admin reinstatement). Card/fare
  # eligibility is a SEPARATE per-hold gate (validations priority 7), so a member
  # below the plan card minimum is "not eligible" for a given hold but is NOT
  # suspended for it — the two mechanisms are orthogonal.
  - entity: Member
    initial_state: GOOD
    terminal_states: []
    transitions:
      - from: GOOD
        to: SUSPENDED
        trigger: "system, as a side effect of a NO_SHOW sweep crossing the strike threshold"
        actor: system
        preconditions:
          - "Member.no_show_strikes >= NO_SHOW_SUSPEND_THRESHOLD"
        side_effects:
          - "Member.standing = SUSPENDED; future HELD holds are rejected (see Visit HELD precondition)"
          - "CASCADE: every OTHER Visit of this member still in status HELD is auto-transitioned HELD -> CANCELLED, which itself releases each such visit's held_occupancy on its lounge (third cascade hop)"
      - from: SUSPENDED
        to: GOOD
        trigger: "POST /memberships/{member_id}/reinstate"
        actor: NetworkAdmin
        preconditions:
          - "Member.standing == SUSPENDED"
        side_effects:
          - "Member.no_show_strikes reset to 0"
          - "Member.standing = GOOD"
          - "increments Member.version by 1"

  # --- Lounge.status: capacity-driven overflow (Rule 7, Rule 8) ---------------
  - entity: Lounge
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: OVERFLOW
        trigger: "system, recomputed after any hold/check-in raises occupancy to the overflow line"
        actor: system
        preconditions:
          - "Lounge.current_occupancy + Lounge.held_occupancy >= Lounge.capacity"
        side_effects:
          - "New holds (POST /visits) are rejected with ERR_LOUNGE_OVERFLOW; existing HELD visits may still check in if a seat is free"
      - from: OVERFLOW
        to: OPEN
        trigger: "system, recomputed after a completion/cancel/sweep frees seats below the overflow line"
        actor: system
        preconditions:
          - "Lounge.current_occupancy + Lounge.held_occupancy < Lounge.capacity"
        side_effects:
          - "New holds accepted again"
      - from: OPEN
        to: CLOSED
        trigger: "POST /lounges/{lounge_id}/close"
        actor: NetworkAdmin
        preconditions:
          - "Lounge.status IN {OPEN, OVERFLOW}"
          - "expected_lounge_version matches Lounge.version (OCC)"
        side_effects:
          - "Lounge.status = CLOSED; new holds and check-ins rejected; existing CHECKED_IN visits may still complete"
          - "increments Lounge.version by 1"
      - from: OVERFLOW
        to: CLOSED
        trigger: "POST /lounges/{lounge_id}/close"
        actor: NetworkAdmin
        preconditions:
          - "Lounge.status IN {OPEN, OVERFLOW}"
          - "expected_lounge_version matches Lounge.version (OCC)"
        side_effects:
          - "Lounge.status = CLOSED"
          - "increments Lounge.version by 1"
      - from: CLOSED
        to: OPEN
        trigger: "POST /lounges/{lounge_id}/reopen"
        actor: NetworkAdmin
        preconditions:
          - "Lounge.status == CLOSED"
        side_effects:
          - "Lounge.status recomputed to OPEN or OVERFLOW based on current occupancy line"

  # --- Settlement: payout lifecycle (Rule 9 compensation) ---------------------
  - entity: Settlement
    initial_state: PAYABLE
    terminal_states: [PAID, REVERSED]
    transitions:
      - from: PAYABLE
        to: PAID
        trigger: "POST /lounges/{lounge_id}/settlements/pay"
        actor: NetworkAdmin
        preconditions:
          - "Settlement.status == PAYABLE"
        side_effects:
          - "CASCADE: Lounge.settlement_balance_cents recomputed -= amount_cents (PAID drops out of the PAYABLE sum)"
      - from: PAYABLE
        to: REVERSED
        trigger: "POST /settlements/{settlement_id}/reverse"
        actor: NetworkAdmin
        preconditions:
          - "Settlement.status == PAYABLE"
        side_effects:
          - "CASCADE: Lounge.settlement_balance_cents recomputed -= amount_cents (REVERSED drops out of the PAYABLE sum); the conserved-quantity invariant settlement_conservation holds"

  # --- ShowerReservation: temporal-interval booking (Rule 8) ------------------
  - entity: ShowerReservation
    initial_state: BOOKED
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /shower-reservations/{reservation_id}/cancel"
        actor: Member
        preconditions:
          - "ShowerReservation.status == BOOKED"
          - "acting Member.id == the reservation's Visit.member_id"
        side_effects:
          - "The booked interval is released, freeing the suite for new overlapping bookings"
          - "increments ShowerReservation.version by 1"
      - from: BOOKED
        to: COMPLETED
        trigger: "POST /shower-reservations/{reservation_id}/complete"
        actor: LoungeAgent
        preconditions:
          - "ShowerReservation.status == BOOKED"
          - "the reservation's Visit.lounge_id == acting LoungeAgent's lounge"
        side_effects:
          - "increments ShowerReservation.version by 1"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on parent version — true CREATE-with-supersede)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: hold-create-stale-lounge
    parent_entity: Lounge
    write_endpoint: "POST /visits"
    occ_field: "expected_lounge_version"
    description: |
      Opening a Visit hold against a Lounge whose version has advanced since the
      client last observed it is rejected. A hold legitimately succeeds against a
      fresh lounge read, but if the lounge's version has since advanced (e.g. it
      was just closed, or its capacity line moved), the caller's view is stale
      and the hold is refused so it cannot slip a seat past a capacity/closure
      change the caller never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: daypass-purchase-stale-lounge
    parent_entity: Lounge
    write_endpoint: "POST /lounges/{lounge_id}/day-passes"
    occ_field: "expected_lounge_version"
    description: |
      Purchasing a DayPass against a Lounge whose version has advanced since the
      client last read it is rejected. The price is snapshotted from the lounge
      at purchase, so a stale read could sell a pass at a superseded price or to
      a lounge that has since closed; the OCC check forces a re-read.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # ---- (1) Primary entry mode + allotment draw (threshold; Rule 6) ----------
  - name: resolve_entry_mode
    trigger: "On POST /visits (hold creation), before persisting the Visit"
    algorithm: threshold
    formula: |
      # Decide how the PRIMARY occupant's entry is funded and what allotment it draws.
      # Allotment is annual; member.visits_used already reflects the current year.
      let plan = member.plan
      if day_pass_id is provided and valid:
          entry_mode = DAY_PASS
          allotment_consumed = false
      elif plan.included_visits_per_year == -1:                       # UNLIMITED sentinel
          entry_mode = ALLOTMENT
          allotment_consumed = true
      elif member.visits_used < plan.included_visits_per_year:         # strict < : Nth free, (N+1)th is overage
          entry_mode = ALLOTMENT
          allotment_consumed = true
      else:
          entry_mode = OVERAGE
          allotment_consumed = false
    input_set: "member.visits_used over the current allotment year (Visits in {CHECKED_IN, COMPLETED, NO_SHOW} with allotment_consumed==true); plan.included_visits_per_year; day_pass_id validity"
    constants:
      HOLD_TTL_MINUTES: 30        # hold_expires_at = held_at + 30 minutes
      DAY_PASS_TTL_HOURS: 24      # day-pass valid_until = purchased_at + 24 hours
    precision: "integer counts; no rounding"
    variants:
      - name: unlimited_plan
        when: "plan.included_visits_per_year == -1"
        difference: "Always ALLOTMENT; member.visits_used is tracked but never gates entry_mode"
      - name: boundary_exhaustion
        when: "member.visits_used == plan.included_visits_per_year exactly"
        difference: "The Nth free visit uses visits_used == N-1 (< N → ALLOTMENT); the visit that observes visits_used == N is the first OVERAGE (>= → OVERAGE). 6 included means the 7th primary visit is the first overage."

  # ---- (2) Guest funding split, order-sensitive (combinatorial mode (c); Rule 2) ----
  - name: resolve_guest_funding
    trigger: "On POST /visits, after resolve_entry_mode, for each of the guest_count guests in creation order"
    algorithm: waterfall_allocation
    formula: |
      # Guests are funded in a fixed order: guest index 0,1,2,... (creation order).
      # Each guest first draws from the member's remaining guest allotment; once
      # the allotment is exhausted, all later guests are GUEST_CHARGE.
      # remaining = max(0, plan.included_guest_visits_per_year - member.guest_visits_used)
      remaining = max(0, plan.included_guest_visits_per_year - member.guest_visits_used)
      guest_allotment_consumed = min(guest_count, remaining)
      for i in 0 .. guest_count-1 (creation order):
          if i < guest_allotment_consumed:
              guest[i].funded_by = GUEST_ALLOTMENT
          else:
              guest[i].funded_by = GUEST_CHARGE
      # NOTE evaluation order: resolve_entry_mode runs first and does NOT change
      # guest_visits_used; guest funding reads the pre-hold guest_visits_used.
    input_set: "member.guest_visits_used (current year); plan.included_guest_visits_per_year; guest_count; guests in creation order"
    constants: {}
    precision: "integer counts; no rounding"
    variants:
      - name: partial_guest_allotment
        when: "remaining (1..guest_count-1) is strictly between 0 and guest_count"
        difference: "The first `remaining` guests in creation order are GUEST_ALLOTMENT; the rest GUEST_CHARGE — split point is order-sensitive, so order must be pinned to creation order"
      - name: zero_guest_allotment
        when: "remaining == 0 (allotment already exhausted or plan grants 0)"
        difference: "All guests are GUEST_CHARGE"

  # ---- (3) Member charge at check-in (combinatorial mode (b) nested rounding; Rule 2) ----
  - name: compute_member_charge
    trigger: "On POST /visits/{visit_id}/check-in (HELD -> CHECKED_IN); pins Visit.member_charge_cents"
    algorithm: aggregation
    formula: |
      # All amounts are already in integer cents; the ROUNDING ORDER is pinned:
      # apply the per-occupant member-discount multiplier PER LINE ITEM, round
      # each line to whole cents (round_half_up), THEN sum — NOT sum-then-round.
      # member_discount_multiplier = MEMBER_FEE_DISCOUNT for GOLD-card members, else 1.0
      disc = MEMBER_FEE_DISCOUNT if member.active_card.card_status == GOLD else 1.0
      overage_line = 0
      if entry_mode == OVERAGE:
          overage_line = round_half_up(plan.overage_charge_cents * disc)   # round per line
      guest_total = 0
      for each guest g of this visit (creation order):
          if g.funded_by == GUEST_CHARGE:
              line = round_half_up((plan.guest_charge_cents + lounge.guest_fee_cents) * disc)
          else:  # GUEST_ALLOTMENT — only the lounge door fee applies, no plan guest charge
              line = round_half_up(lounge.guest_fee_cents * disc)
          g.charge_cents = line
          guest_total += line                       # sum AFTER each line is rounded
      day_pass_line = 0
      if entry_mode == DAY_PASS:
          day_pass_line = day_pass.price_cents       # already snapshotted, not discounted
      member_charge_cents = overage_line + guest_total + day_pass_line
    input_set: "this Visit's entry_mode and guests; plan.overage_charge_cents, plan.guest_charge_cents; lounge.guest_fee_cents; member active card status; day_pass.price_cents"
    constants:
      MEMBER_FEE_DISCOUNT: 0.90
    precision: "round_half_up to whole cents PER LINE ITEM, then integer-sum the lines (sum-then-round is wrong and produces different cents)"
    variants:
      - name: gold_discount_per_line
        when: "member active card_status == GOLD"
        difference: "Each line multiplied by 0.90 and rounded individually; e.g. two guest lines of 1505*0.9=1354.5→1355 each sum to 2710, whereas (1505+1505)*0.9=2709 rounded would give 2709 — the pinned per-line order yields 2710"
      - name: no_discount
        when: "member active card_status != GOLD"
        difference: "disc = 1.0; lines pass through unrounded-by-multiplier"

  # ---- (4) Settlement owed to lounge (forward vs chronological dual-variant; Rule 1) ----
  - name: compute_settlement
    trigger: "On POST /visits/{visit_id}/complete (CHECKED_IN -> COMPLETED); pins Visit.settlement_amount_cents and creates Settlement"
    algorithm: aggregation
    formula: |
      settlement_amount_cents = occupant_count * lounge.settlement_rate_cents
      # occupant_count is frozen at the visit's check-in occupancy (1 + guest_count).
    input_set: "this Visit's occupant_count; lounge.settlement_rate_cents at completion time"
    constants: {}
    precision: "integer cents; no rounding"
    variants:
      - name: rate_snapshot_at_completion
        when: "lounge.settlement_rate_cents changed between check-in and completion"
        difference: "Uses the rate at completion time (when the Settlement crystallises), NOT the rate at check-in"

  # ---- (5) Lounge settlement balance (dual-variant: payable vs lifetime; Rule 1) ----
  - name: compute_lounge_settlement_balance
    trigger: "Recomputed (derived) whenever a Settlement of the lounge is created or changes status"
    algorithm: aggregation
    formula: |
      settlement_balance_cents = sum(s.amount_cents
                                     for s in Settlements where s.lounge_id == lounge.id
                                     and s.status == PAYABLE)
    input_set: "Settlements of this lounge filtered to status == PAYABLE only (PAID and REVERSED excluded)"
    constants: {}
    precision: "integer cents; no rounding"
    variants:
      - name: payable_balance
        when: "default — the owed balance"
        difference: "Includes ONLY status==PAYABLE; this is what /lounges/{id} exposes as settlement_balance_cents"
      - name: lifetime_earned
        when: "GET /lounges/{id}/settlement-summary requests the lifetime figure"
        difference: "lifetime_earned_cents = sum over status IN {PAYABLE, PAID} (REVERSED excluded); diverges from payable_balance once any Settlement is PAID"

  # ---- (6) Member allotment usage counters (chronological reset; Rule 6 boundary) ----
  - name: recompute_member_usage
    trigger: "Recomputed whenever a Visit of the member enters or leaves the consuming set, or on POST /memberships/{member_id}/roll-year"
    algorithm: chronological
    formula: |
      year_start = member.membership_year_start
      visits_used = count(v for v in member.Visits
                          where v.allotment_consumed == true
                          and v.status IN {CHECKED_IN, COMPLETED, NO_SHOW}
                          and v.held_at >= year_start)
      guest_visits_used = sum(v.guest_allotment_consumed for v in member.Visits
                          where v.status IN {CHECKED_IN, COMPLETED, NO_SHOW}
                          and v.held_at >= year_start)
      no_show_strikes  = count(v for v in member.Visits
                          where v.status == NO_SHOW and v.entry_mode != DAY_PASS
                          and v.held_at >= year_start)
    input_set: "the member's Visits whose held_at >= membership_year_start, filtered by status as shown"
    constants:
      NO_SHOW_SUSPEND_THRESHOLD: 3   # when no_show_strikes reaches 3, Member.standing flips to SUSPENDED
    precision: "integer counts; no rounding"
    variants:
      - name: in_year
        when: "Visit.held_at >= membership_year_start"
        difference: "Counts toward usage"
      - name: prior_year_excluded
        when: "Visit.held_at < membership_year_start (after a roll-year)"
        difference: "Excluded; this is the reset mechanism — a roll-year advances membership_year_start so prior visits drop out, returning visits_used toward 0"

  # ---- (7) Shower-suite booking overlap (interval geometry; Rule 8) ----------
  - name: check_shower_overlap
    trigger: "On POST /shower-reservations (booking creation), before persisting"
    algorithm: interval_merge
    formula: |
      # Half-open intervals [start_at, end_at). A buffered turnover gap is applied
      # AFTER each existing booking: the existing booking effectively occupies
      # [existing.start_at, existing.end_at + suite.turnover_minutes). The new
      # booking [new.start_at, new.end_at) is REJECTED iff it overlaps any BOOKED
      # reservation of the same suite under this buffered geometry:
      #   conflict  <=>  new.start_at < (existing.end_at + turnover_minutes)
      #                  AND existing.start_at < new.end_at
      # Adjacency exactly at the buffered boundary (new.start_at == existing.end_at
      # + turnover_minutes) is NOT a conflict (half-open, buffer-inclusive).
      for existing in ShowerReservations
          where existing.shower_suite_id == new.shower_suite_id
          and existing.status == BOOKED:
          buffered_end = existing.end_at + minutes(suite.turnover_minutes)
          if new.start_at < buffered_end and existing.start_at < new.end_at:
              reject ERR_SHOWER_CONFLICT
    input_set: "BOOKED ShowerReservations of the same suite; the proposed [start_at, end_at); suite.turnover_minutes"
    constants: {}
    precision: "minute-resolution UTC instants; intervals half-open [start, end)"
    variants:
      - name: zero_turnover_adjacency_allowed
        when: "suite.turnover_minutes == 0"
        difference: "Back-to-back bookings where new.start_at == existing.end_at are allowed (half-open, no buffer)"
      - name: buffered_turnover
        when: "suite.turnover_minutes > 0"
        difference: "A booking starting exactly at existing.end_at is REJECTED; it must start at or after existing.end_at + turnover_minutes"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path/body-referenced resources exist (member, lounge, visit, day_pass, plan, settlement), validated left-to-right in the path then body FKs"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: auth
    check: "Ownership: a Member acting on a Visit/DayPass/EligibilityCard must own it (X-User-ID == resource.member_id); a LoungeAgent acting on a Visit must staff that visit's lounge (X-User-ID == Visit.lounge_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /visits/{visit_id}/cancel, POST /visits/{visit_id}/check-in, POST /visits/{visit_id}/complete, POST /eligibility-cards/{card_id}/activate"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: business_referential
    check: "On hold creation, the member has an active, non-expired EligibilityCard (member_id route only); a DayPass-only entry needs no card"
    error_id: ERR_NO_ACTIVE_CARD
    http_status: 422
    applies_to: "POST /visits"

  - priority: 7
    category: business_constraint
    check: "Eligibility gate: member's active EligibilityCard satisfies plan.min_card_status OR fare_class IN {BUSINESS, FIRST}; otherwise the member is not eligible to enter on allotment/overage (day-pass entry bypasses this gate)"
    error_id: ERR_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /visits"

  - priority: 8
    category: state
    check: "Member.standing == GOOD on hold creation for member entry (SUSPENDED members may not open holds; day-pass-only entry is exempt)"
    error_id: ERR_MEMBER_SUSPENDED
    http_status: 409
    applies_to: "POST /visits"

  - priority: 9
    category: business_constraint
    check: "DayPass redemption: the supplied DayPass is ISSUED, not expired, belongs to this lounge, and (if member-owned) to this member"
    error_id: ERR_DAY_PASS_INVALID
    http_status: 422
    applies_to: "POST /visits, POST /visits/{visit_id}/check-in"

  - priority: 10
    category: business_temporal
    check: "Lounge accepts new holds: Lounge.status == OPEN (OVERFLOW and CLOSED reject new holds)"
    error_id: ERR_LOUNGE_OVERFLOW
    http_status: 409
    applies_to: "POST /visits"

  - priority: 11
    category: business_constraint
    check: "Capacity on check-in: Lounge.current_occupancy + Visit.occupant_count <= Lounge.capacity"
    error_id: ERR_OVER_CAPACITY
    http_status: 409
    applies_to: "POST /visits/{visit_id}/check-in"

  - priority: 12
    category: state
    check: "Shower booking requires the referenced Visit to be CHECKED_IN and its suite not out_of_service"
    error_id: ERR_SHOWER_UNAVAILABLE
    http_status: 409
    applies_to: "POST /shower-reservations"

  - priority: 13
    category: business_temporal
    check: "Shower booking interval must not overlap an existing BOOKED reservation of the same suite under the suite's buffered turnover geometry (calc check_shower_overlap)"
    error_id: ERR_SHOWER_CONFLICT
    http_status: 409
    applies_to: "POST /shower-reservations"

  - priority: 14
    category: business_fiscal
    check: "Settlement payout: only PAYABLE settlements may be paid or reversed"
    error_id: ERR_SETTLEMENT_NOT_PAYABLE
    http_status: 409
    applies_to: "POST /lounges/{lounge_id}/settlements/pay, POST /settlements/{settlement_id}/reverse"

  - priority: 15
    category: business_constraint
    check: "OCC: expected_<parent>_version matches the parent's current version on guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /visits, POST /lounges/{lounge_id}/day-passes, POST /lounges/{lounge_id}/close"

  - priority: 16
    category: business_constraint
    check: "Request body field types/enums valid and required fields present (including start_at < end_at on shower bookings)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- MembershipPlan ----
  - { method: POST, path: "/membership-plans", description: "Create a plan", roles: [NetworkAdmin], code: 201, input: [tier, included_visits_per_year, included_guest_visits_per_year, overage_charge_cents, guest_charge_cents, min_card_status, annual_fee_cents], output: MembershipPlan, side_effects: [] }
  - { method: GET, path: "/membership-plans", description: "List plans", roles: [NetworkAdmin, Member, LoungeAgent], code: 200, input: ["tier?", "limit?", "offset?"], output: "MembershipPlan[]", side_effects: [] }
  - { method: GET, path: "/membership-plans/{plan_id}", description: "Get a plan", roles: [NetworkAdmin, Member, LoungeAgent], code: 200, input: [], output: MembershipPlan, side_effects: [] }

  # ---- Lounge (network directory) ----
  - { method: POST, path: "/lounges", description: "Add a lounge to the network directory", roles: [NetworkAdmin], code: 201, input: [name, airport_code, capacity, settlement_rate_cents, guest_fee_cents, day_pass_price_cents], output: Lounge, side_effects: ["status=OPEN; occupancy counters=0; settlement_balance_cents=0"] }
  - { method: GET, path: "/lounges", description: "Network lounge directory (filterable by airport_code and status)", roles: [NetworkAdmin, Member, LoungeAgent], code: 200, input: ["airport_code?", "status?", "limit?", "offset?"], output: "Lounge[]", side_effects: [] }
  - { method: GET, path: "/lounges/{lounge_id}", description: "Get a lounge with live occupancy and settlement balance", roles: [NetworkAdmin, Member, LoungeAgent], code: 200, input: [], output: Lounge, side_effects: [] }
  - { method: GET, path: "/lounges/{lounge_id}/settlement-summary", description: "Computed read: payable_balance_cents and lifetime_earned_cents per compute_lounge_settlement_balance variants", roles: [NetworkAdmin, LoungeAgent], code: 200, input: [], output: "{ payable_balance_cents: integer, lifetime_earned_cents: integer, paid_cents: integer }", side_effects: [] }
  - { method: POST, path: "/lounges/{lounge_id}/close", description: "Close a lounge (OCC-guarded)", roles: [NetworkAdmin], code: 200, input: [expected_lounge_version], output: Lounge, side_effects: ["status -> CLOSED", "increments Lounge.version by 1"] }
  - { method: POST, path: "/lounges/{lounge_id}/reopen", description: "Reopen a closed lounge; status recomputed to OPEN/OVERFLOW by occupancy", roles: [NetworkAdmin], code: 200, input: [], output: Lounge, side_effects: ["status -> OPEN or OVERFLOW"] }
  - { method: POST, path: "/lounges/{lounge_id}/sweep", description: "System sweep at the current logical clock: expire stale HELD visits to NO_SHOW, ABANDON checked-in visits whose card expired, expire ISSUED day passes; recomputes derived state", roles: [NetworkAdmin], code: 200, input: [], output: "{ swept_no_show_count: integer, swept_abandoned_count: integer, expired_day_pass_count: integer }", side_effects: ["HELD visits past hold_expires_at -> NO_SHOW (+strike, possible standing cascade)", "CHECKED_IN visits with expired card -> ABANDONED", "ISSUED passes past valid_until -> EXPIRED"] }
  - { method: POST, path: "/lounges/{lounge_id}/day-passes", description: "Purchase a day pass for this lounge (OCC-guarded on the lounge)", roles: [NetworkAdmin, Member], code: 201, input: ["member_id?", "buyer_name?", expected_lounge_version], output: DayPass, side_effects: ["price_cents snapshotted from lounge.day_pass_price_cents", "when member_id present: posts DAY_PASS LedgerEntry and recomputes Member.wallet_balance_cents", "increments Lounge.version by 1"] }
  - { method: POST, path: "/lounges/{lounge_id}/settlements/pay", description: "Mark all PAYABLE settlements of this lounge as PAID (batch payout in created_at order)", roles: [NetworkAdmin], code: 200, input: [], output: "{ paid_count: integer, paid_total_cents: integer }", side_effects: ["each PAYABLE Settlement -> PAID", "Lounge.settlement_balance_cents recomputed to 0"] }

  # ---- Member ----
  - { method: POST, path: "/memberships", description: "Enrol a member on a plan", roles: [NetworkAdmin], code: 201, input: [plan_id, full_name], output: Member, side_effects: ["membership_year_start = logical clock now", "standing=GOOD; all usage counters=0"] }
  - { method: GET, path: "/memberships", description: "List members; filter by plan_id (FK reverse-reachability for Member.plan_id) or standing", roles: [NetworkAdmin], code: 200, input: ["plan_id?", "standing?", "limit?", "offset?"], output: "Member[]", side_effects: [] }
  - { method: GET, path: "/memberships/{member_id}", description: "Get a member with live usage/standing/wallet", roles: [NetworkAdmin, Member], code: 200, input: [], output: Member, side_effects: [] }
  - { method: POST, path: "/memberships/{member_id}/reinstate", description: "Reinstate a suspended member (resets strikes)", roles: [NetworkAdmin], code: 200, input: [], output: Member, side_effects: ["standing SUSPENDED -> GOOD", "no_show_strikes reset to 0", "increments Member.version by 1"] }
  - { method: POST, path: "/memberships/{member_id}/roll-year", description: "Advance the member's allotment year (resets usage baseline)", roles: [NetworkAdmin], code: 200, input: [], output: Member, side_effects: ["membership_year_start = logical clock now", "usage counters recomputed excluding prior-year visits", "increments Member.version by 1"] }

  # ---- EligibilityCard (card / fare-class / status credential) ----
  - { method: POST, path: "/eligibility-cards", description: "Issue an eligibility card to a member; becomes the member's active credential", roles: [NetworkAdmin], code: 201, input: [member_id, card_status, fare_class, valid_until], output: EligibilityCard, side_effects: ["active=true; any prior active card of this member set active=false"] }
  - { method: GET, path: "/eligibility-cards", description: "List eligibility cards; filter by member_id (FK reverse-reachability for EligibilityCard.member_id) or active", roles: [NetworkAdmin, Member], code: 200, input: ["member_id?", "active?", "limit?", "offset?"], output: "EligibilityCard[]", side_effects: [] }
  - { method: GET, path: "/eligibility-cards/{card_id}", description: "Get an eligibility card", roles: [NetworkAdmin, Member], code: 200, input: [], output: EligibilityCard, side_effects: [] }
  - { method: POST, path: "/eligibility-cards/{card_id}/activate", description: "Make this card the member's active credential", roles: [NetworkAdmin, Member], code: 200, input: [], output: EligibilityCard, side_effects: ["this card active=true; sibling cards active=false"] }

  # ---- Visit (check-in / capacity / overflow / no-show) ----
  - { method: POST, path: "/visits", description: "Open a hold (check-in intent): reserves a seat, resolves entry_mode and guest funding (OCC-guarded on the lounge)", roles: [NetworkAdmin, LoungeAgent], code: 201, input: ["member_id?", lounge_id, "day_pass_id?", "guest_count?", "guest_names?", expected_lounge_version], output: Visit, side_effects: ["entry_mode resolved (calc resolve_entry_mode)", "per-guest funding resolved (calc resolve_guest_funding), Guest rows created in guest_names order", "hold_expires_at = held_at + HOLD_TTL_MINUTES", "Lounge.held_occupancy recomputed += occupant_count; Lounge.status recomputed (may flip to OVERFLOW)", "increments Lounge.version by 1"] }
  - { method: GET, path: "/visits", description: "List visits; filter by member_id (Visit.member_id), lounge_id (Visit.lounge_id), eligibility_card_id (Visit.eligibility_card_id), day_pass_id (Visit.day_pass_id), or status — FK reverse-reachability for all four Visit FKs", roles: [NetworkAdmin, Member, LoungeAgent], code: 200, input: ["member_id?", "lounge_id?", "eligibility_card_id?", "day_pass_id?", "status?", "limit?", "offset?"], output: "Visit[]", side_effects: [] }
  - { method: GET, path: "/visits/{visit_id}", description: "Get a visit", roles: [NetworkAdmin, Member, LoungeAgent], code: 200, input: [], output: Visit, side_effects: [] }
  - { method: POST, path: "/visits/{visit_id}/check-in", description: "Admit a held visit: capacity-check, pin member_charge, post ledger entries, occupy seats", roles: [LoungeAgent], code: 200, input: [], output: Visit, side_effects: ["calc compute_member_charge pins member_charge_cents", "LedgerEntry rows posted; Member.wallet_balance_cents recomputed", "Lounge.current_occupancy += occupant_count; held_occupancy -= occupant_count", "DayPass -> REDEEMED when day_pass present", "increments Visit.version by 1"] }
  - { method: POST, path: "/visits/{visit_id}/complete", description: "Complete a checked-in visit: pin settlement, create PAYABLE Settlement, free seats", roles: [LoungeAgent], code: 200, input: [], output: Visit, side_effects: ["calc compute_settlement pins settlement_amount_cents", "Settlement(PAYABLE) created; Lounge.settlement_balance_cents recomputed += amount", "Lounge.current_occupancy -= occupant_count", "increments Visit.version by 1"] }
  - { method: POST, path: "/visits/{visit_id}/cancel", description: "Cancel a held visit before check-in (member-initiated)", roles: [Member, NetworkAdmin], code: 200, input: [], output: Visit, side_effects: ["Lounge.held_occupancy -= occupant_count", "redeeming DayPass reverts to ISSUED if applicable", "increments Visit.version by 1"] }

  # ---- Guest ----
  - { method: GET, path: "/guests", description: "List guests; filter by visit_id (FK reverse-reachability for Guest.visit_id)", roles: [NetworkAdmin, Member, LoungeAgent], code: 200, input: ["visit_id?", "limit?", "offset?"], output: "Guest[]", side_effects: [] }
  - { method: GET, path: "/guests/{guest_id}", description: "Get a guest", roles: [NetworkAdmin, Member, LoungeAgent], code: 200, input: [], output: Guest, side_effects: [] }

  # ---- DayPass ----
  - { method: GET, path: "/day-passes", description: "List day passes; filter by lounge_id (DayPass.lounge_id), member_id (DayPass.member_id), redeemed_visit_id (DayPass.redeemed_visit_id), or status — FK reverse-reachability for all three DayPass FKs", roles: [NetworkAdmin, Member, LoungeAgent], code: 200, input: ["lounge_id?", "member_id?", "redeemed_visit_id?", "status?", "limit?", "offset?"], output: "DayPass[]", side_effects: [] }
  - { method: GET, path: "/day-passes/{day_pass_id}", description: "Get a day pass", roles: [NetworkAdmin, Member, LoungeAgent], code: 200, input: [], output: DayPass, side_effects: [] }
  - { method: POST, path: "/day-passes/{day_pass_id}/refund", description: "Refund an unredeemed member-owned day pass", roles: [NetworkAdmin], code: 200, input: [], output: DayPass, side_effects: ["status ISSUED -> REFUNDED", "DAY_PASS_REFUND LedgerEntry posted (negative)", "Member.wallet_balance_cents recomputed"] }

  # ---- Settlement ----
  - { method: GET, path: "/settlements", description: "List settlements; filter by lounge_id (Settlement.lounge_id), visit_id (Settlement.visit_id), or status — FK reverse-reachability for both Settlement FKs", roles: [NetworkAdmin, LoungeAgent], code: 200, input: ["lounge_id?", "visit_id?", "status?", "limit?", "offset?"], output: "Settlement[]", side_effects: [] }
  - { method: GET, path: "/settlements/{settlement_id}", description: "Get a settlement", roles: [NetworkAdmin, LoungeAgent], code: 200, input: [], output: Settlement, side_effects: [] }
  - { method: POST, path: "/settlements/{settlement_id}/reverse", description: "Reverse a PAYABLE settlement (compensation)", roles: [NetworkAdmin], code: 200, input: [], output: Settlement, side_effects: ["status PAYABLE -> REVERSED", "Lounge.settlement_balance_cents recomputed -= amount"] }

  # ---- LedgerEntry (member charges) ----
  - { method: GET, path: "/ledger-entries", description: "List member ledger entries; filter by member_id (LedgerEntry.member_id), visit_id (LedgerEntry.visit_id), day_pass_id (LedgerEntry.day_pass_id), kind, or status — FK reverse-reachability for all three LedgerEntry FKs", roles: [NetworkAdmin, Member], code: 200, input: ["member_id?", "visit_id?", "day_pass_id?", "kind?", "status?", "limit?", "offset?"], output: "LedgerEntry[]", side_effects: [] }
  - { method: GET, path: "/ledger-entries/{entry_id}", description: "Get a single ledger entry", roles: [NetworkAdmin, Member], code: 200, input: [], output: LedgerEntry, side_effects: [] }

  # ---- ShowerSuite (amenity) ----
  - { method: POST, path: "/shower-suites", description: "Add a shower suite to a lounge", roles: [NetworkAdmin], code: 201, input: [lounge_id, label, "turnover_minutes?"], output: ShowerSuite, side_effects: ["out_of_service=false"] }
  - { method: GET, path: "/shower-suites", description: "List shower suites; filter by lounge_id (FK reverse-reachability for ShowerSuite.lounge_id)", roles: [NetworkAdmin, Member, LoungeAgent], code: 200, input: ["lounge_id?", "limit?", "offset?"], output: "ShowerSuite[]", side_effects: [] }
  - { method: GET, path: "/shower-suites/{suite_id}", description: "Get a shower suite", roles: [NetworkAdmin, Member, LoungeAgent], code: 200, input: [], output: ShowerSuite, side_effects: [] }

  # ---- ShowerReservation (temporal-interval booking) ----
  - { method: POST, path: "/shower-reservations", description: "Book a shower suite for a checked-in visit (interval overlap-checked, calc check_shower_overlap)", roles: [NetworkAdmin, Member, LoungeAgent], code: 201, input: [shower_suite_id, visit_id, start_at, end_at], output: ShowerReservation, side_effects: ["status=BOOKED after overlap/buffer check passes"] }
  - { method: GET, path: "/shower-reservations", description: "List shower reservations; filter by shower_suite_id (ShowerReservation.shower_suite_id), visit_id (ShowerReservation.visit_id), or status — FK reverse-reachability for both ShowerReservation FKs", roles: [NetworkAdmin, Member, LoungeAgent], code: 200, input: ["shower_suite_id?", "visit_id?", "status?", "limit?", "offset?"], output: "ShowerReservation[]", side_effects: [] }
  - { method: GET, path: "/shower-reservations/{reservation_id}", description: "Get a shower reservation", roles: [NetworkAdmin, Member, LoungeAgent], code: 200, input: [], output: ShowerReservation, side_effects: [] }
  - { method: POST, path: "/shower-reservations/{reservation_id}/cancel", description: "Cancel a booked reservation (member-initiated), releasing the interval", roles: [Member, NetworkAdmin], code: 200, input: [], output: ShowerReservation, side_effects: ["status BOOKED -> CANCELLED", "increments ShowerReservation.version by 1"] }
  - { method: POST, path: "/shower-reservations/{reservation_id}/complete", description: "Mark a reservation completed (lounge agent)", roles: [LoungeAgent], code: 200, input: [], output: ShowerReservation, side_effects: ["status BOOKED -> COMPLETED", "increments ShowerReservation.version by 1"] }

  # ---- Logical clock (test-driving) ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server logical clock to an absolute UTC instant. Server startup default is 2026-01-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time.", roles: [NetworkAdmin], code: 200, input: [to_iso8601], output: "{ now: datetime }", side_effects: ["logical clock set; subsequent hold_expires_at / valid_until / membership_year_start computations use this instant"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation per RBAC" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Member acting on a resource they do not own, or LoungeAgent acting on a visit at a lounge they do not staff" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced member/lounge/visit/day_pass/plan/settlement/card does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition not defined from the resource's current state" }
  - { id: ERR_NO_ACTIVE_CARD, http: 422, condition: "Member hold creation without an active, non-expired EligibilityCard" }
  - { id: ERR_NOT_ELIGIBLE, http: 422, condition: "Member's card_status below plan.min_card_status and fare_class not in {BUSINESS, FIRST}" }
  - { id: ERR_MEMBER_SUSPENDED, http: 409, condition: "SUSPENDED member attempts to open a hold" }
  - { id: ERR_DAY_PASS_INVALID, http: 422, condition: "Day pass not ISSUED, expired, wrong lounge, or not owned by the redeeming member" }
  - { id: ERR_LOUNGE_OVERFLOW, http: 409, condition: "New hold rejected because lounge is OVERFLOW or CLOSED" }
  - { id: ERR_OVER_CAPACITY, http: 409, condition: "Check-in would push current_occupancy + occupant_count over capacity" }
  - { id: ERR_SHOWER_UNAVAILABLE, http: 409, condition: "Shower booking against a visit that is not CHECKED_IN, or a suite that is out_of_service" }
  - { id: ERR_SHOWER_CONFLICT, http: 409, condition: "Shower booking interval overlaps an existing BOOKED reservation of the same suite under the buffered turnover geometry" }
  - { id: ERR_SETTLEMENT_NOT_PAYABLE, http: 409, condition: "Pay/reverse attempted on a settlement not in PAYABLE" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match parent's current version (OCC)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, bad enum/type, or invalid pagination params" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: NetworkAdmin
    description: "Operates the lounge network: plans, lounges, members, cards, settlements, sweeps, day-pass refunds, reinstatement, year roll."
    identity: "opaque"
    exclusive_operations:
      - "POST /membership-plans"
      - "POST /lounges"
      - "POST /lounges/{lounge_id}/close"
      - "POST /lounges/{lounge_id}/reopen"
      - "POST /lounges/{lounge_id}/sweep"
      - "POST /lounges/{lounge_id}/settlements/pay"
      - "POST /memberships"
      - "POST /memberships/{member_id}/reinstate"
      - "POST /memberships/{member_id}/roll-year"
      - "POST /eligibility-cards"
      - "POST /day-passes/{day_pass_id}/refund"
      - "POST /settlements/{settlement_id}/reverse"
      - "POST /shower-suites"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET (all read endpoints)"
      - "POST /lounges/{lounge_id}/day-passes (shared with Member)"
      - "POST /visits (shared with LoungeAgent)"
      - "POST /visits/{visit_id}/cancel (shared with Member)"
      - "POST /eligibility-cards/{card_id}/activate (shared with Member)"
      - "POST /shower-reservations (shared with Member, LoungeAgent)"
      - "POST /shower-reservations/{reservation_id}/cancel (shared with Member)"

  - name: LoungeAgent
    description: "Door staff of a specific lounge: opens holds, checks members in, completes or no-shows visits, completes shower reservations. X-User-ID is the staffed Lounge's id."
    identity: "entity_backed:Lounge"
    exclusive_operations:
      - "POST /visits/{visit_id}/check-in"
      - "POST /visits/{visit_id}/complete"
      - "POST /shower-reservations/{reservation_id}/complete"
    shared_operations:
      - "POST /visits (shared with NetworkAdmin)"
      - "POST /shower-reservations (shared with NetworkAdmin, Member)"
      - "GET (lounge/visit/day-pass/settlement/shower reads)"

  - name: Member
    description: "A Priority-Pass-style member acting on their own membership, holds, cards, day-pass purchases, and shower bookings. X-User-ID is the member's id."
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "POST /lounges/{lounge_id}/day-passes (shared with NetworkAdmin)"
      - "POST /visits/{visit_id}/cancel (shared with NetworkAdmin)"
      - "POST /eligibility-cards/{card_id}/activate (shared with NetworkAdmin)"
      - "POST /shower-reservations (shared with NetworkAdmin, LoungeAgent)"
      - "POST /shower-reservations/{reservation_id}/cancel (shared with NetworkAdmin)"
      - "GET (own membership, visits, cards, ledger, shower reservations; plans; lounge directory)"
