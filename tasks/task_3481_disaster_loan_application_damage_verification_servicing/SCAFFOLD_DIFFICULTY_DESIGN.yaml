              captures: { ho_id: $.data.id }
            - call: "POST /disaster-relief/loan-applications"
              payload: { declaration_id: "${decl_id}", county_fips: "06037", loan_purpose: "PHYSICAL_DAMAGE", requested_amount_cents: 20000000 }
              as: Applicant
              as_user_id: "${ho_id}"
              captures: { app_id: $.data.id }
            - call: "POST /disaster-relief/loan-applications/${app_id}/submit"
              payload: {}
              as: Applicant
