        by closing_a_program_is_conditional_on_every_taxable_award_being_reported; ERR_NOT_RESOURCE_OWNER
        by participant_identity_is_entity_backed_so_one_qualifier_cannot_touch_another; ERR_SEGREGATION_OF_DUTIES
