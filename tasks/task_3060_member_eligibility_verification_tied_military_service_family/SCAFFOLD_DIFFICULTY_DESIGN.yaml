  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_beats_business_safety_on_case_decide
        grounds:
          - validations[priority=5]
          - validations[priority=8]
        distinguishing_aspect: |
          Category pair state (priority 5) vs business_safety (priority 8): a
          decide call on a DENIED (terminal) case made by the SAME officer who
          recorded the reconstruction violates both the state precondition and
          segregation of duties — the response MUST be ERR_INVALID_STATE
          (409), proving the state check fires before the SoD check.
        test_recipe:
          setup:
            - "Case decided DENIED by officer-B; reconstruction had been recorded by officer-A earlier."
          setup_api_calls:
            - call: "POST /membership/eligibility-cases"
              payload: { applicant_legal_name: "Ned Null", applicant_dob: "1985-12-12", basis_type: "DIRECT_SERVICE" }
              as: EligibilityApplicant
              captures: { case_n: $.data.id }
            - call: "POST /membership/eligibility-cases/${case_n}/service-records"
              payload: { branch: "ARMY", component: "RESERVE", rank_grade: "E-3", service_start_date: "2010-01-01", service_end_date: "2012-01-01", discharge_characterization: "GENERAL_UNDER_HONORABLE" }
              as: EligibilityApplicant
              captures: { sr_n: $.data.id }
            - call: "POST /membership/eligibility-cases/${case_n}/evidence"
              payload: { doc_type: "DD214", issuing_authority: "NPRC", issued_on: "2012-02-01", covers_service_record_id: "${sr_n}", content_hash: "n13" }
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${case_n}/submit"
              payload: {}
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${case_n}/record-reconstruction"
              payload: { decision: "APPROVE", decision_note: "rebuilt from archives" }
              as: VerificationOfficer
              as_user_id: "officer-A"
            - call: "POST /membership/eligibility-cases/${case_n}/decide"
              payload: { decision: "DENY", decision_note: "insufficient character of service" }
              as: VerificationOfficer
              as_user_id: "officer-B"
          trigger:
            - call: "POST /membership/eligibility-cases/${case_n}/decide"
              payload: { decision: "APPROVE" }
              as: VerificationOfficer
              as_user_id: "officer-A"
              captures: { err_state: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (state priority 5 beats business_safety priority 8 even though officer-A would also trip ERR_SEGREGATION_OF_DUTIES)"
            - "EligibilityCase.${case_n}.status remains DENIED and member_id remains null"

      - name: referential_beats_fiscal_on_claim_decide
        grounds:
          - validations[priority=11]
          - validations[priority=18]
        distinguishing_aspect: |
          Category pair business_referential (priority 11) vs business_fiscal
          (priority 18) — a different pair than state-vs-safety: a claim
          created against a non-existent deployment_order_id fails
          ERR_INVALID_REFERENCE at filing time, and a decide call whose cap
          check would fail but whose referenced order is no longer ACTIVE
          surfaces ERR_SCRA_NOT_ELIGIBLE (constraint, priority 17) before
          ERR_RELIEF_CAP_EXCEEDED (fiscal, priority 18): pin both orderings on
          one chain — file with a bogus FK (422 INVALID_REFERENCE), then
          complete the order (no longer ACTIVE) and decide a claim whose
          uncapped relief would exceed exposure: SCRA error wins over the cap.
        test_recipe:
          setup:
            - "Member M ACTIVE with deployment D (scra_eligible, 3 periods) and an entitlement exposure_cents 100 (tiny cap) — any positive relief would exceed the cap once offset netting is considered; D then COMPLETED so it is no longer ACTIVE."
