            - "The second attempt reuses ${dc_ver}, proving the rejected call did not bump DealContract.${dc_id}.version."
            - "DealContract.${dc_id}.released_total_cents == 120000"
            - "A CONTRACT_ADVANCE release initiated by dual-agent on the same contract succeeds, because priority 22 is scoped to DELIVERABLE_PAYOUT."

  - section: cross-cutting complexity layers
    instances:

      - name: stale_expected_donor_member_version_on_commitment_create_returns_412
        claim_type: optimistic_concurrency
        grounds: [concurrency_rules.commitment-create-stale-donor, errors.ERR_STALE_DONOR_VERSION, validations.priority_21_occ_expected_parent_version]
        distinguishing_aspect: "A successful commitment create bumps DonorMember.version by exactly 1, so replaying the version the caller originally read must fail with 412; an implementation that ignores the echoed version silently writes a second commitment."
        test_recipe:
          setup: ["One collective, one OPEN tier, and one donor whose version 1 is captured before any commitment exists."]
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Occ Donor Collective", institution_name: "Occ Donor Institution", institution_ipeds_code: "026000", home_state_code: "TX", association_ruleset: "NCAA_2024" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/collectives/${col_id}/membership-tiers"
              payload: { tier_code: "T2", tier_name: "Occ Club", annual_dues_cents: 60000, benefit_rank: 2 }
              as: CollectiveDirector
              captures: { tier_id: $.data.id }
            - call: "POST /nil/membership-tiers/${tier_id}/transitions"
              payload: { action: "OPEN" }
              as: CollectiveDirector
            - call: "POST /nil/donor-members"
              payload: { collective_id: "${col_id}", membership_tier_id: "${tier_id}", display_name: "Occ Donor", email: "occd@example.com" }
              as: CollectiveDirector
              captures: { donor_id: $.data.id, ver1: $.data.version }
            - call: "POST /nil/commitments"
              payload: { donor_member_id: "${donor_id}", kind: "RECURRING_SUBSCRIPTION", amount_cents: 5000, billing_interval: "MONTHLY", expected_donor_member_version: "${ver1}" }
              as: CollectiveDirector
              captures: { cm_first: $.data.id }
            - call: "GET /nil/donor-members/${donor_id}"
              payload: {}
              as: CollectiveDirector
              captures: { ver2: $.data.version }
          trigger:
            - call: "POST /nil/commitments"
              payload: { donor_member_id: "${donor_id}", kind: "RECURRING_SUBSCRIPTION", amount_cents: 7000, billing_interval: "MONTHLY", expected_donor_member_version: "${ver1}" }
              as: CollectiveDirector
              captures: { err_id: $.data.error_id }
          assert:
            - "${ver1} == 1"
            - "${ver2} == 2"
            - "${err_id} == ERR_STALE_DONOR_VERSION"
            - "The response status is 412."
            - "GET /nil/commitments?donor_member_id=${donor_id} returns exactly 1 row."
            - "DonorMember.${donor_id}.version == 2, so the rejected request wrote nothing at all."
            - "Retrying the identical body with expected_donor_member_version ${ver2} succeeds and takes the version to 3."

      - name: stale_expected_collective_version_on_entity_structure_patch_returns_412
        claim_type: optimistic_concurrency
        grounds: [concurrency_rules.entity-structure-change-stale-collective, errors.ERR_STALE_COLLECTIVE_VERSION, 'endpoints."PATCH /nil/collectives/{id}/entity-structure"']
        distinguishing_aspect: "The OCC check at priority 21 must run before the structure-change business rules at priority 35, so a stale version on a request that would also be a legal change returns 412 and no cascade runs."
        test_recipe:
          setup: ["One collective created as NONPROFIT_501C3 at version 1, then changed once to FOR_PROFIT_LLC so its version is 2 and structure_change_count is 1."]
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Occ Structure Collective", institution_name: "Occ Structure Institution", institution_ipeds_code: "026100", home_state_code: "CA", association_ruleset: "NCAA_2026", entity_structure: "NONPROFIT_501C3" }
              as: PlatformAdmin
              captures: { col_id: $.data.id, ver1: $.data.version }
            - call: "PATCH /nil/collectives/${col_id}/entity-structure"
              payload: { entity_structure: "FOR_PROFIT_LLC", expected_collective_version: "${ver1}" }
              as: PlatformAdmin
              captures: { ver2: $.data.version, count1: $.data.structure_change_count }
          trigger:
            - call: "PATCH /nil/collectives/${col_id}/entity-structure"
              payload: { entity_structure: "DONOR_ADVISED_CONDUIT", expected_collective_version: "${ver1}" }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "${ver1} == 1"
            - "${ver2} == 2"
            - "${count1} == 1"
            - "${err_id} == ERR_STALE_COLLECTIVE_VERSION"
            - "The response status is 412."
            - "Collective.${col_id}.entity_structure == FOR_PROFIT_LLC"
            - "Collective.${col_id}.structure_change_count == 1"
            - "Collective.${col_id}.version == 2"
            - "The same body with expected_collective_version ${ver2} succeeds, so only the echoed version differed."

      - name: stale_expected_collective_version_on_roster_allocation_returns_412
        claim_type: optimistic_concurrency
        grounds: [concurrency_rules.roster-batch-create-stale-collective, 'endpoints."POST /nil/deal-contracts/roster-allocations"', validations.priority_21_occ_expected_parent_version]
        distinguishing_aspect: "Priority 21 outranks the roster gates at priorities 24, 27 and 39, so a stale collective version rejects the batch with 412 even though the batch would also have failed the empty-input-set rule; no contract may be minted."
        test_recipe:
          setup:
            - "One collective at version 1 whose version is then bumped to 2 by an entity-structure change."
            - "No athletes are created, so a version-valid batch would fail the priority 27 empty-set rule instead."
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Occ Roster Collective", institution_name: "Occ Roster Institution", institution_ipeds_code: "026200", home_state_code: "OH", association_ruleset: "NCAA_2024", entity_structure: "NONPROFIT_501C3" }
              as: PlatformAdmin
              captures: { col_id: $.data.id, ver1: $.data.version }
            - call: "PATCH /nil/collectives/${col_id}/entity-structure"
              payload: { entity_structure: "FOR_PROFIT_LLC", expected_collective_version: "${ver1}" }
              as: PlatformAdmin
              captures: { ver2: $.data.version }
          trigger:
            - call: "POST /nil/deal-contracts/roster-allocations"
              payload: { collective_id: "${col_id}", allocation_batch_code: "OCC-1", sport: "FOOTBALL", pool_amount_cents: 300000, allocation_mode: "EQUAL_SHARE", effective_start_at: "2026-09-01T00:00:00Z", effective_end_at: "2026-12-01T00:00:00Z", expected_collective_version: "${ver1}" }
              as: CollectiveDirector
              captures: { err_stale: $.data.error_id }
            - call: "POST /nil/deal-contracts/roster-allocations"
              payload: { collective_id: "${col_id}", allocation_batch_code: "OCC-1", sport: "FOOTBALL", pool_amount_cents: 300000, allocation_mode: "EQUAL_SHARE", effective_start_at: "2026-09-01T00:00:00Z", effective_end_at: "2026-12-01T00:00:00Z", expected_collective_version: "${ver2}" }
              as: CollectiveDirector
              captures: { err_empty: $.data.error_id }
          assert:
            - "${err_stale} == ERR_STALE_COLLECTIVE_VERSION"
            - "The first response status is 412."
            - "${err_empty} == ERR_NO_ELIGIBLE_ATHLETES"
            - "The second response status is 422, which proves the 412 was raised by the version check and not by the empty roster."
            - "GET /nil/deal-contracts?allocation_batch_code=OCC-1 returns 0 rows."
            - "Collective.${col_id}.version == ${ver2}, unchanged by either rejected batch."

      - name: stale_expected_deal_contract_version_on_payment_release_returns_412
        claim_type: optimistic_concurrency
        grounds: [concurrency_rules.payment-release-stale-contract, errors.ERR_STALE_CONTRACT_VERSION, 'endpoints."POST /nil/payment-releases"']
        distinguishing_aspect: "Activation bumps DealContract.version, so a release echoing the pre-activation version must be refused with 412 before the posture gate at priority 25 or the fiscal rules at 42 to 45 are ever consulted, even though the collective holds no money at all."
        test_recipe:
          setup:
            - "One collective with no contributions, so its funding posture would block a release if the OCC check did not fire first."
            - "One ENROLLED athlete and one contract worth 50000 (below the disclosure threshold, so DISCLOSURE_NOT_REQUIRED), whose version is captured at DRAFT and again after activation."
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Occ Release Collective", institution_name: "Occ Release Institution", institution_ipeds_code: "026300", home_state_code: "TX", association_ruleset: "NCAA_2024" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/athletes"
              payload: { collective_id: "${col_id}", full_name: "Occ Athlete", portal_user_id: "ath-occ", sport: "FOOTBALL", class_year: 2028 }
              as: CollectiveDirector
              captures: { ath_id: $.data.id }
            - call: "POST /nil/deal-contracts"
              payload: { collective_id: "${col_id}", athlete_id: "${ath_id}", total_value_cents: 50000, effective_start_at: "2026-08-01T00:00:00Z", effective_end_at: "2026-12-31T00:00:00Z", funding_designation: "UNRESTRICTED" }
              as: CollectiveDirector
              captures: { dc_id: $.data.id, dc_ver_draft: $.data.version }
            - call: "POST /nil/deal-contracts/${dc_id}/activation"
              payload: {}
              as: CollectiveDirector
              captures: { dc_ver_active: $.data.version, life_after: $.data.lifecycle_status }
          trigger:
            - call: "POST /nil/payment-releases"
              payload: { deal_contract_id: "${dc_id}", release_kind: "CONTRACT_ADVANCE", requested_amount_cents: 10000, expected_deal_contract_version: "${dc_ver_draft}" }
              as: TreasuryOfficer
              as_user_id: "treasury-occ"
              captures: { err_stale: $.data.error_id }
            - call: "POST /nil/payment-releases"
              payload: { deal_contract_id: "${dc_id}", release_kind: "CONTRACT_ADVANCE", requested_amount_cents: 10000, expected_deal_contract_version: "${dc_ver_active}" }
              as: TreasuryOfficer
              as_user_id: "treasury-occ"
              captures: { err_frozen: $.data.error_id }
          assert:
            - "${dc_ver_draft} == 1"
            - "${dc_ver_active} == 2"
            - "${life_after} == ACTIVE"
            - "${err_stale} == ERR_STALE_CONTRACT_VERSION"
            - "The first response status is 412."
            - "${err_frozen} == ERR_COLLECTIVE_FUNDING_FROZEN"
            - "The second response status is 409, which proves the 412 came from the version check and not from the empty treasury."
            - "GET /nil/payment-releases?deal_contract_id=${dc_id} returns 0 rows."
            - "DealContract.${dc_id}.version == 2, unchanged by either rejected release."
            - "Collective.${col_id}.funding_posture == FROZEN"

      - name: disclosure_submitted_after_the_window_is_recorded_as_late
        claim_type: rate_threshold_triggers
        grounds: [global_constants.DISCLOSURE_WINDOW_HOURS, entities.DealContract.fields.disclosure_due_at, state_machines.sm_deal_contract_disclosure]
        distinguishing_aspect: "The 168-hour window boundary is inclusive: a packet filed at exactly disclosure_due_at is DISCLOSURE_PENDING and one second later is DISCLOSURE_LATE, and the due date is frozen at contract creation rather than recomputed from the submission clock."
        test_recipe:
          setup:
            - "One collective and one ENROLLED athlete."
            - "Two contracts worth 100000 each, both created at the default clock 2026-08-01T00:00:00Z, so both carry disclosure_due_at 2026-08-08T00:00:00Z."
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Late Collective", institution_name: "Late Institution", institution_ipeds_code: "026400", home_state_code: "CA", association_ruleset: "NCAA_2026" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/athletes"
              payload: { collective_id: "${col_id}", full_name: "Late Athlete", portal_user_id: "ath-late", sport: "FOOTBALL", class_year: 2028 }
              as: CollectiveDirector
              captures: { ath_id: $.data.id }
            - call: "POST /nil/deal-contracts"
              payload: { collective_id: "${col_id}", athlete_id: "${ath_id}", total_value_cents: 100000, effective_start_at: "2026-08-01T00:00:00Z", effective_end_at: "2026-12-31T00:00:00Z" }
              as: CollectiveDirector
              captures: { dc_on_time: $.data.id, due_on_time: $.data.disclosure_due_at }
            - call: "POST /nil/deal-contracts"
              payload: { collective_id: "${col_id}", athlete_id: "${ath_id}", total_value_cents: 100000, effective_start_at: "2026-08-01T00:00:00Z", effective_end_at: "2026-12-31T00:00:00Z" }
              as: CollectiveDirector
              captures: { dc_late: $.data.id, due_late: $.data.disclosure_due_at }
          trigger:
            - call: "POST /nil/_clock/set_current_utc"
              payload: { current_utc: "2026-08-08T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nil/deal-contracts/${dc_on_time}/compliance-submissions"
              payload: { state_law_citation: "CA-AB131", association_rule_citation: "NCAA-2026-12.5" }
              as: CollectiveDirector
              captures: { status_on_time: $.data.disclosure_status, submitted_on_time: $.data.disclosure_submitted_at }
            - call: "POST /nil/_clock/set_current_utc"
              payload: { current_utc: "2026-08-08T00:00:01Z" }
              as: PlatformAdmin
            - call: "POST /nil/deal-contracts/${dc_late}/compliance-submissions"
              payload: { state_law_citation: "CA-AB131", association_rule_citation: "NCAA-2026-12.5" }
              as: CollectiveDirector
              captures: { status_late: $.data.disclosure_status, submitted_late: $.data.disclosure_submitted_at }
          assert:
            - "${due_on_time} == 2026-08-08T00:00:00Z"
            - "${due_late} == 2026-08-08T00:00:00Z"
            - "${status_on_time} == DISCLOSURE_PENDING"
            - "${submitted_on_time} == 2026-08-08T00:00:00Z"
            - "${status_late} == DISCLOSURE_LATE"
            - "${submitted_late} == 2026-08-08T00:00:01Z"
            - "One second of clock movement is the only difference between the two outcomes."
            - "DealContract.${dc_late}.disclosure_due_at == 2026-08-08T00:00:00Z, unchanged by the late submission."
            - "An ACCEPT decision on ${dc_late} still clears it to DISCLOSURE_ACCEPTED, so lateness is recorded rather than blocking."

      - name: three_level_cascade_from_athlete_transfer_verified_end_to_end
        claim_type: cascading_side_effects
        grounds: [state_machines.sm_athlete_eligibility_status, state_machines.sm_deal_contract_lifecycle, state_machines.sm_payment_release_status]
        excluded_because:
          difficulty_instance: transitive_cascade / athlete_transfer_terminates_contract_forfeits_deliverables_voids_queued_release
          rationale: "That §1.8 instance walks the full depth-3 chain from one eligibility change through contract termination and deliverable forfeiture to release voiding, asserting every level."

      - name: both_deduction_variants_produce_expected_results_and_delta
        claim_type: dual_variant_calculation
        grounds: [calculations.calc_contribution_deductible_amount, 'endpoints."POST /nil/collectives/{id}/billing-runs"']
        excluded_because:
          difficulty_instance: dual_variant_calc / deduction_attribution_diverges_between_at_receipt_and_year_end
          rationale: "That §1.8 instance asserts both variants over the same contributions plus the signed per-row deltas and the zero total delta of the switch."

  - section: consistency model
    instances:

      - name: derived_deduction_and_ledger_totals_are_visible_in_the_same_response
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, calculations.calc_contribution_deductible_amount, entities.Collective.fields.settled_net_funds_cents]
        distinguishing_aspect: "Consistency is immediate: the contribution response itself must already carry the fee, net and ceiling-limited deductible, and the second gift's response must already reflect the ceiling the first one consumed, with the collective and donor ledgers current on the very next read and no lag or retry."
        test_recipe:
          setup:
            - "A NONPROFIT_501C3 collective with one OPEN tier and one INDIVIDUAL donor whose annual_agi_cents is 1000000, giving a 600000 deduction ceiling."
            - "Two one-time gifts settled in sequence: gross 512851 (fee 12851, net 500000) then gross 410287 (fee 10287, net 400000)."
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Immediate Collective", institution_name: "Immediate Institution", institution_ipeds_code: "026500", home_state_code: "OH", association_ruleset: "NCAA_2026", entity_structure: "NONPROFIT_501C3" }
              as: PlatformAdmin
              captures: { col_id: $.data.id, ded_enabled: $.data.charitable_deduction_enabled }
            - call: "POST /nil/collectives/${col_id}/membership-tiers"
              payload: { tier_code: "T4", tier_name: "Imm Club", annual_dues_cents: 400000, benefit_rank: 4 }
              as: CollectiveDirector
              captures: { tier_id: $.data.id }
            - call: "POST /nil/membership-tiers/${tier_id}/transitions"
              payload: { action: "OPEN" }
              as: CollectiveDirector
            - call: "POST /nil/donor-members"
              payload: { collective_id: "${col_id}", membership_tier_id: "${tier_id}", display_name: "Imm Donor", email: "imm@example.com", donor_kind: "INDIVIDUAL", annual_agi_cents: 1000000 }
              as: CollectiveDirector
              captures: { donor_id: $.data.id }
          trigger:
            - call: "POST /nil/contributions"
              payload: { donor_member_id: "${donor_id}", gross_amount_cents: 512851, source_kind: "ONE_TIME_GIFT", designation: "UNRESTRICTED", processor_outcome: "APPROVE" }
              as: TreasuryOfficer
              captures: { c1_id: $.data.id, c1_fee: $.data.processing_fee_cents, c1_net: $.data.net_amount_cents, c1_ded: $.data.deductible_amount_cents, c1_variant: $.data.deduction_variant }
            - call: "GET /nil/collectives/${col_id}"
              payload: {}
              as: TreasuryOfficer
              captures: { settled_after_1: $.data.settled_net_funds_cents, posture_after_1: $.data.funding_posture }
            - call: "POST /nil/contributions"
              payload: { donor_member_id: "${donor_id}", gross_amount_cents: 410287, source_kind: "ONE_TIME_GIFT", designation: "UNRESTRICTED", processor_outcome: "APPROVE" }
              as: TreasuryOfficer
              captures: { c2_id: $.data.id, c2_fee: $.data.processing_fee_cents, c2_net: $.data.net_amount_cents, c2_ded: $.data.deductible_amount_cents }
            - call: "GET /nil/donor-members/${donor_id}"
              payload: {}
              as: TreasuryOfficer
              captures: { donor_settled: $.data.lifetime_settled_cents, donor_ded: $.data.lifetime_deductible_cents, donor_status: $.data.status }
          assert:
            - "${ded_enabled} == true"
            - "${c1_fee} == 12851"
            - "${c1_net} == 500000"
            - "${c1_ded} == 500000"
            - "${c1_variant} == AT_RECEIPT"
            - "${settled_after_1} == 500000"
            - "${posture_after_1} == OPEN"
            - "${c2_fee} == 10287"
            - "${c2_net} == 400000"
            - "${c2_ded} == 100000"
            - "The second gift's own response already shows the ceiling consumed by the first, so nothing is deferred to a later recompute."
            - "${donor_settled} == 900000"
            - "${donor_ded} == 600000"
            - "${donor_status} == ACTIVE"
            - "Collective.${col_id}.settled_net_funds_cents == 900000"
            - "Every read above is taken immediately after the write with no retry loop, because the consistency model is immediate."
