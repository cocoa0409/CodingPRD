scenario: "2210. Speakers Bureau Booking & Engagement Management (professional speakers bureau): talent roster management with topic taxonomy, fee ranges, availability and travel requirements, client inquiry qualification with budget, audience and objective matching, proposal presentation with multiple speaker options and fee quotations, contracting with speaker agreements, cancellation terms, travel reimbursement policy and recording rights, logistics coordination including travel booking, technical requirements and on-site handling, exclusivity, non-circumvention and commission protection when clients rebook directly, payment collection, speaker remittance and commission accounting, engagement feedback collection and roster performance review"
domain_name: "speakers-bureau-engagements"
api_prefix: ""

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - conditional_feature_flags

  entity_topology: flat
  # Peer collections joined by explicit foreign keys; no nested ownership URL chains
  # beyond one action segment. Inquiry / Proposal / ProposalOption / Engagement /
  # Contract / Invoice / Remittance are peers linked by FK fields, each addressable
  # at its own top-level collection.

  state_machine_shape: parallel
  # Engagement carries two independent state dimensions (booking_status ×
  # settlement_status). Proposal is cyclic (PRESENTED -> REVISION_REQUESTED ->
  # PRESENTED, and ACCEPTED -> PRESENTED when the speaker declines). Contract is
  # branching fork-join (SENT -> {speaker leg, client leg} -> EXECUTED).

  relationship_patterns:
    - one_to_many          # Client -> Inquiry, Inquiry -> Proposal, Proposal -> ProposalOption
    - many_to_many         # Speaker <-> Proposal through ProposalOption
    - cross_aggregate      # ExclusivityGrant / CircumventionClaim bind Speaker + Client + Engagement
    - polymorphic          # Invoice.kind selects which line composition applies

  role_model: segregation_of_duties
  # The BookingAgent that qualified an Inquiry owns the resulting Engagement and is
  # barred from approving that Engagement's commission adjustment; Speaker and Client
  # are entity-backed counterparties; BureauAdmin holds money and compliance actions.

  consistency_model: immediate

difficulty_level: expert_plus
# Expert band per §0.4 with deliberate density above it: 14 entities, 59 endpoints,
# 6 calculations (3 dual-variant / combinatorial), 10 state machines (2 independent
# dimensions on Engagement, 2 cyclic machines, 1 fork-join), 2 OCC races.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================

entities:

  - name: Speaker
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Speaker display name printed on proposals and agreements"
        constraints: "1..120 chars"
      - name: topics
        type: array
        source: input
        description: "Topic taxonomy codes this speaker is rostered for"
        constraints: "1..5 distinct codes from {AI_STRATEGY, LEADERSHIP, HEALTHCARE_POLICY, CYBERSECURITY, FUTURE_OF_WORK, SALES_MOTIVATION}"
      - name: fee_floor_cents
        type: integer
        source: input
        description: "Lowest speaking fee the speaker will accept, in cents"
        constraints: ">= 0"
      - name: fee_ceiling_cents
        type: integer
        source: input
        description: "Highest speaking fee the bureau may quote, in cents"
        constraints: ">= fee_floor_cents"
      - name: travel_class
        type: enum
        source: input
        description: "Contractual travel class, drives TRAVEL_CLASS_MULT in travel_reimbursable"
        constraints: "one of {ECONOMY, PREMIUM, BUSINESS}"
      - name: travel_buffer_days
        type: integer
        source: input
        default: 1
        description: "Whole days of calendar padding added on both sides of an engagement when a hold is created"
        constraints: "0..3"
      - name: roster_status
        type: enum
        source: system
        default: ACTIVE
        description: "Roster eligibility; ACTIVE is the only bookable value"
        constraints: "one of {ACTIVE, PROBATION, PAUSED, RETIRED}"
      - name: tax_form_status
        type: enum
        source: input
        default: MISSING
        description: "Tax paperwork state; remittance payout requires ON_FILE"
        constraints: "one of {MISSING, ON_FILE}"
      - name: roster_tier
        type: enum
        source: computed
        default: BRONZE
        description: "Performance tier recomputed by roster_tier_assignment on every delivery and every feedback"
        constraints: "one of {BRONZE, SILVER, GOLD}"
      - name: default_commission_pct
        type: number
        source: computed
        default: 0.25
        description: "Bureau commission rate implied by roster_tier; snapshotted onto an Engagement at contract execution"
        constraints: "TIER_COMMISSION_PCT[roster_tier]"
      - name: engagements_delivered_count
        type: integer
        source: computed
        default: 0
        description: "Count of Engagement rows for this speaker whose booking_status == DELIVERED"
      - name: lifetime_gross_fees_cents
        type: integer
        source: computed
        default: 0
        description: "Running sum of (quoted_fee_cents + recording_fee_cents) over DELIVERED engagements"
      - name: held_days_count
        type: integer
        source: computed
        default: 0
        description: "Conserved calendar quantity: sum of SpeakerHold.day_span over this speaker's holds with status == ACTIVE"
      - name: pending_remittance_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of Remittance.net_payable_cents for this speaker with status IN {PENDING, APPROVED}"
      - name: rolling_score
        type: number
        source: computed
        description: "Recency-weighted feedback score (variant ROLLING of speaker_performance_score); null until first Feedback"
        constraints: "2 decimals, round_half_up, or null"
      - name: lifetime_score
        type: number
        source: computed
        description: "Equal-weight feedback score (variant LIFETIME of speaker_performance_score); null until first Feedback"
        constraints: "2 decimals, round_half_up, or null"
      - name: feedback_count
        type: integer
        source: computed
        default: 0
        description: "Count of Feedback rows across this speaker's engagements"

  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: org_name
        type: string
        source: input
        description: "Booking organisation name"
        constraints: "1..160 chars"
      - name: industry_code
        type: enum
        source: input
        description: "Industry used as the exclusivity dimension of ExclusivityGrant"
        constraints: "one of {HEALTHCARE, FINANCE, TECHNOLOGY, EDUCATION, MANUFACTURING}"
      - name: primary_contact_email
        type: string
        source: input
        description: "Billing / proposal contact address"
      - name: credit_status
        type: enum
        source: system
        default: GOOD
        description: "Credit posture; HOLD blocks qualification, option selection and client counter-signature"
        constraints: "one of {GOOD, WATCH, HOLD}"
      - name: outstanding_balance_cents
        type: integer
        source: computed
        default: 0
        description: "Conserved receivable quantity: sum of (amount_due_cents - amount_paid_cents) over this client's Invoice rows with status IN {ISSUED, PARTIALLY_PAID}"
      - name: circumvention_strikes
        type: integer
        source: computed
        default: 0
        description: "Count of CircumventionClaim rows for this client with status IN {UPHELD, SETTLED}"

  - name: Inquiry
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the booking organisation that raised the inquiry"
      - name: owning_agent_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the BookingAgent that qualified this inquiry; copied onto the Engagement and used by the segregation-of-duties check"
      - name: required_topic
        type: enum
        source: input
        description: "Topic taxonomy code the audience requires; every ProposalOption speaker must carry it in topics"
        constraints: "one of {AI_STRATEGY, LEADERSHIP, HEALTHCARE_POLICY, CYBERSECURITY, FUTURE_OF_WORK, SALES_MOTIVATION}"
      - name: event_start_utc
        type: datetime
        source: input
        description: "Event window start, ISO 8601 UTC"
      - name: event_end_utc
        type: datetime
        source: input
        description: "Event window end, ISO 8601 UTC; must be strictly after event_start_utc"
      - name: is_virtual
        type: boolean
        source: input
        default: false
        description: "Virtual delivery flag; when true travel_reimbursable always evaluates to 0"
      - name: audience_size
        type: integer
        source: input
        description: "Expected audience headcount"
        constraints: ">= 1"
      - name: budget_cents
        type: integer
        source: input
        description: "Client stated speaking-fee budget in cents"
        constraints: ">= 0"
      - name: objective_tags
        type: array
        source: input
        description: "Objective codes used for matching narrative"
        constraints: "1..4 distinct codes from {INSPIRE, STRATEGY, TRAINING, CELEBRATE}"
      - name: status
        type: enum
        source: system
        default: RECEIVED
        description: "Qualification and pipeline state"
        constraints: "one of {RECEIVED, QUALIFIED, BLOCKED, PROPOSED, WON, LOST, DISQUALIFIED}"
      - name: qualification_note
        type: string
        source: system
        description: "Note recorded by the BookingAgent at qualification"

  - name: Proposal
    parent: Inquiry
    common_fields: true
    fields:
      - name: inquiry_id
        type: string
        source: input
        description: "FK -> Inquiry.id; the inquiry this proposal answers"
      - name: created_by_agent_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the BookingAgent that created the proposal"
      - name: round_no
        type: integer
        source: system
        default: 1
        description: "Presentation round; incremented by one each time the proposal is presented again after a revision request"
      - name: revision_count
        type: integer
        source: system
        default: 0
        description: "Number of client revision requests absorbed; capped by MAX_REVISION_ROUNDS"
      - name: valid_until_utc
        type: datetime
        source: input
        description: "Quotation expiry; presentation and selection are refused once now_utc >= valid_until_utc"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Negotiation state of the quotation package"
        constraints: "one of {DRAFT, PRESENTED, REVISION_REQUESTED, ACCEPTED, DECLINED, SUPERSEDED, CLOSED}"
      - name: options_count
        type: integer
        source: computed
        default: 0
        description: "Count of ProposalOption rows for this proposal with status IN {OFFERED, SELECTED}"
      - name: presented_at_utc
        type: datetime
        source: system
        description: "Logical clock value at the most recent presentation; null while DRAFT"

  - name: ProposalOption
    parent: Proposal
    common_fields: true
    fields:
      - name: proposal_id
        type: string
        source: input
        description: "FK -> Proposal.id; the quotation package this option belongs to"
      - name: speaker_id
        type: string
        source: input
        description: "FK -> Speaker.id; the speaker offered by this option"
      - name: quoted_fee_cents
        type: integer
        source: input
        description: "Speaking fee quoted to the client for this speaker, in cents"
        constraints: ">= 0; must fall inside [Speaker.fee_floor_cents, Speaker.fee_ceiling_cents]"
      - name: travel_allowance_cents
        type: integer
        source: input
        default: 0
        description: "Contractual travel allowance floor carried into the Engagement and used by travel_reimbursable"
        constraints: ">= 0"
      - name: rank_no
        type: integer
        source: input
        description: "Presentation rank inside the proposal; unique per proposal"
        constraints: "1..4"
      - name: status
        type: enum
        source: system
        default: OFFERED
        description: "Option disposition"
        constraints: "one of {OFFERED, SELECTED, REJECTED, WITHDRAWN}"

  - name: Engagement
    parent: Inquiry
    common_fields: true
    fields:
      - name: inquiry_id
        type: string
        source: system
        description: "FK -> Inquiry.id; copied from the selected option's proposal"
      - name: speaker_id
        type: string
        source: system
        description: "FK -> Speaker.id; copied from the selected option"
      - name: selected_option_id
        type: string
        source: system
        description: "FK -> ProposalOption.id; the option the client selected"
      - name: owning_agent_user_id
        type: string
        source: system
        description: "Opaque X-User-ID copied from Inquiry.owning_agent_user_id; barred from approving this engagement's commission adjustment"
      - name: booking_status
        type: enum
        source: system
        default: OFFERED
        description: "Booking dimension; evolves independently of settlement_status"
        constraints: "one of {OFFERED, CONFIRMED, CONTRACTED, DELIVERED, DECLINED_BY_SPEAKER, CANCELLED_BY_CLIENT, CANCELLED_BY_SPEAKER}"
      - name: settlement_status
        type: enum
        source: system
        default: UNBILLED
        description: "Money dimension; evolves independently of booking_status"
        constraints: "one of {UNBILLED, INVOICED, PARTIALLY_COLLECTED, COLLECTED, REMITTED, WAIVED, WRITTEN_OFF}"
      - name: event_start_utc
        type: datetime
        source: system
        description: "Copied from Inquiry.event_start_utc at engagement creation"
      - name: event_end_utc
        type: datetime
        source: system
        description: "Copied from Inquiry.event_end_utc at engagement creation"
      - name: is_virtual
        type: boolean
        source: system
        description: "Copied from Inquiry.is_virtual at engagement creation"
      - name: quoted_fee_cents
        type: integer
        source: system
        description: "Copied from ProposalOption.quoted_fee_cents"
      - name: travel_allowance_cents
        type: integer
        source: system
        description: "Copied from ProposalOption.travel_allowance_cents"
      - name: recording_rights
        type: enum
        source: system
        default: NONE
        description: "Recording grant copied from the Contract at contract creation"
        constraints: "one of {NONE, AUDIO_ONLY, FULL_BUY_OUT}"
      - name: recording_fee_cents
        type: integer
        source: system
        default: 0
        description: "Recording buy-out fee copied from the Contract; commissionable in the final variant only"
      - name: technical_rider_code
        type: enum
        source: system
        default: STANDARD_AV
        description: "On-site technical requirement profile copied from the Contract"
        constraints: "one of {STANDARD_AV, STAGE_PLUS, BROADCAST}"
      - name: commission_pct_snapshot
        type: number
        source: system
        description: "Speaker.default_commission_pct pinned at contract execution; later tier moves do NOT re-price this engagement"
      - name: provisional_commission_cents
        type: integer
        source: computed
        description: "Variant PROVISIONAL of engagement_commission, written at contract execution"
      - name: final_commission_cents
        type: integer
        source: computed
        description: "Variant FINAL of engagement_commission, written at delivery"
      - name: travel_reimbursable_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of TravelExpense.reimbursable_cents for this engagement with status IN {APPROVED, REIMBURSED}"
      - name: cancelled_by
        type: enum
        source: system
        description: "Cancelling party; null unless booking_status is a cancelled value"
        constraints: "one of {CLIENT, SPEAKER, BUREAU} or null"
      - name: cancellation_days_before
        type: integer
        source: system
        description: "Whole days between the logical clock at cancellation and event_start_utc, floored"
      - name: retention_net_cents
        type: integer
        source: computed
        description: "Net retained fee produced by cancellation_settlement; null when no cancellation occurred"
      - name: retention_commission_cents
        type: integer
        source: computed
        description: "Bureau share of retention_net_cents produced by cancellation_settlement"
      - name: commission_adjustment_count
        type: integer
        source: system
        default: 0
        description: "Number of accepted commission adjustments; each one supersedes commission_pct_snapshot"

  - name: Contract
    parent: Engagement
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: input
        description: "FK -> Engagement.id; the engagement this speaker agreement papers"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Agreement state; EXECUTED requires both counterparty legs"
        constraints: "one of {DRAFT, SENT, PARTIALLY_SIGNED, EXECUTED, VOID}"
      - name: cancellation_schedule_code
        type: enum
        source: input
        description: "Selects the retention ladder used by cancellation_settlement"
        constraints: "one of {STANDARD, STRICT}"
      - name: travel_policy_code
        type: enum
        source: input
        description: "Selects the branch of travel_reimbursable: POLICY_A honours the distance/class cap, POLICY_B honours the allowance only"
        constraints: "one of {POLICY_A, POLICY_B}"
      - name: recording_rights
        type: enum
        source: input
        description: "Recording grant negotiated with the speaker"
        constraints: "one of {NONE, AUDIO_ONLY, FULL_BUY_OUT}"
      - name: recording_fee_cents
        type: integer
        source: input
        default: 0
        description: "Buy-out fee for the recording grant; must be 0 when recording_rights == NONE and > 0 when recording_rights == FULL_BUY_OUT"
      - name: technical_rider_code
        type: enum
        source: input
        default: STANDARD_AV
        description: "On-site technical requirement profile"
        constraints: "one of {STANDARD_AV, STAGE_PLUS, BROADCAST}"
      - name: exclusivity_days
        type: integer
        source: input
        default: 0
        description: "Length of the industry exclusivity window granted to the client, counted from event_end_utc"
        constraints: "one of {0, 30, 90, 180}"
      - name: speaker_signed_at_utc
        type: datetime
        source: system
        description: "Logical clock value when the speaker leg was signed; null until signed"
      - name: client_signed_at_utc
        type: datetime
        source: system
        description: "Logical clock value when the client leg was signed; null until signed"
      - name: executed_at_utc
        type: datetime
        source: system
        description: "Logical clock value when both legs became present"

  - name: SpeakerHold
    parent: Speaker
    common_fields: true
    fields:
      - name: speaker_id
        type: string
        source: input
        description: "FK -> Speaker.id; the calendar this hold occupies"
      - name: engagement_id
        type: string
        source: system
        description: "FK -> Engagement.id; null for kind == BLACKOUT"
      - name: kind
        type: enum
        source: system
        default: BLACKOUT
        description: "ENGAGEMENT holds are minted at engagement confirmation; BLACKOUT holds are entered directly"
        constraints: "one of {ENGAGEMENT, BLACKOUT}"
      - name: hold_start_utc
        type: datetime
        source: input
        description: "Inclusive start of the occupied interval; for ENGAGEMENT holds equals event_start_utc minus Speaker.travel_buffer_days days"
      - name: hold_end_utc
        type: datetime
        source: input
        description: "Inclusive end of the occupied interval; for ENGAGEMENT holds equals event_end_utc plus Speaker.travel_buffer_days days"
      - name: day_span
        type: integer
        source: computed
        description: "Count of distinct UTC calendar dates touched by [hold_start_utc, hold_end_utc] inclusive"
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "ACTIVE holds occupy the calendar; RELEASED and CONSUMED do not"
        constraints: "one of {ACTIVE, RELEASED, CONSUMED}"
      - name: reason
        type: string
        source: input
        description: "Free-text note for blackout holds"

  - name: ExclusivityGrant
    parent: Engagement
    common_fields: true
    fields:
      - name: source_engagement_id
        type: string
        source: system
        description: "FK -> Engagement.id; the engagement whose executed contract created the grant"
      - name: speaker_id
        type: string
        source: system
        description: "FK -> Speaker.id; the speaker whose bookings the grant restricts"
      - name: beneficiary_client_id
        type: string
        source: system
        description: "FK -> Client.id; the client that holds the exclusivity"
      - name: industry_code
        type: enum
        source: system
        description: "Copied from the beneficiary client's industry_code; the dimension the grant restricts"
        constraints: "one of {HEALTHCARE, FINANCE, TECHNOLOGY, EDUCATION, MANUFACTURING}"
      - name: effective_from_utc
        type: datetime
        source: system
        description: "Inclusive window start; equals source engagement event_end_utc"
      - name: effective_to_utc
        type: datetime
        source: system
        description: "EXCLUSIVE window end; equals effective_from_utc plus Contract.exclusivity_days days"
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "Only ACTIVE grants restrict bookings"
        constraints: "one of {ACTIVE, EXPIRED, WAIVED}"

  - name: TravelExpense
    parent: Engagement
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: input
        description: "FK -> Engagement.id; the engagement the travel served"
      - name: receipts_cents
        type: integer
        source: input
        description: "Total receipts submitted by the speaker, in cents"
        constraints: ">= 0"
      - name: travel_days
        type: integer
        source: input
        description: "Whole travel days claimed"
        constraints: ">= 1"
      - name: distance_band
        type: enum
        source: input
        description: "Distance band selecting DISTANCE_BAND_RATE"
        constraints: "one of {LOCAL, REGIONAL, NATIONAL, INTERNATIONAL}"
      - name: memo
        type: string
        source: input
        description: "Free-text description of the itinerary"
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        description: "Expense disposition"
        constraints: "one of {SUBMITTED, APPROVED, REJECTED, REIMBURSED}"
      - name: reimbursable_cents
        type: integer
        source: computed
        description: "Output of travel_reimbursable, written at approval; null while SUBMITTED or REJECTED"

  - name: Invoice
    parent: Engagement
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: system
        description: "FK -> Engagement.id; the engagement being billed"
      - name: client_id
        type: string
        source: system
        description: "FK -> Client.id; the payer"
      - name: kind
        type: enum
        source: system
        description: "ENGAGEMENT_FEE invoices bill fee + recording + travel; CANCELLATION_RETENTION invoices bill retained fee + travel"
        constraints: "one of {ENGAGEMENT_FEE, CANCELLATION_RETENTION}"
      - name: fee_line_cents
        type: integer
        source: computed
        description: "Speaking-fee line: quoted_fee_cents for ENGAGEMENT_FEE, retention_net_cents for CANCELLATION_RETENTION"
      - name: recording_line_cents
        type: integer
        source: computed
        description: "Recording buy-out line; always 0 on CANCELLATION_RETENTION invoices"
      - name: travel_line_cents
        type: integer
        source: computed
        description: "Travel pass-through line; equals Engagement.travel_reimbursable_cents at issuance"
      - name: surcharge_cents
        type: integer
        source: computed
        description: "Processing surcharge produced by invoice_surcharge_rounding; bureau revenue, never remitted"
      - name: amount_due_cents
        type: integer
        source: computed
        description: "fee_line_cents + recording_line_cents + travel_line_cents + surcharge_cents"
      - name: amount_paid_cents
        type: integer
        source: computed
        default: 0
        description: "Cumulative collected amount across payment calls"
      - name: status
        type: enum
        source: system
        default: ISSUED
        description: "Collection state"
        constraints: "one of {ISSUED, PARTIALLY_PAID, PAID, VOID}"
      - name: issued_at_utc
        type: datetime
        source: system
        description: "Logical clock value at issuance"

  - name: Remittance
    parent: Engagement
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: system
        description: "FK -> Engagement.id; the engagement being settled"
      - name: speaker_id
        type: string
        source: system
        description: "FK -> Speaker.id; the payee"
      - name: gross_fee_cents
        type: integer
        source: computed
        description: "Commissionable base: quoted_fee_cents + recording_fee_cents for delivery, retention_net_cents for cancellation"
      - name: commission_cents
        type: integer
        source: computed
        description: "Bureau commission withheld: Engagement.final_commission_cents for delivery, Engagement.retention_commission_cents for cancellation"
      - name: travel_passthrough_cents
        type: integer
        source: computed
        description: "Travel amount passed straight through to the speaker, never commissioned"
      - name: net_payable_cents
        type: integer
        source: computed
        description: "gross_fee_cents - commission_cents + travel_passthrough_cents"
      - name: status
        type: enum
        source: system
        default: PENDING
        description: "Payout state; APPROVED only after the matching invoice is PAID"
        constraints: "one of {PENDING, APPROVED, PAID, VOIDED}"
      - name: paid_at_utc
        type: datetime
        source: system
        description: "Logical clock value at payout"

  - name: Feedback
    parent: Engagement
    common_fields: false
    fields:
      - name: engagement_id
        type: string
        source: system
        description: "FK -> Engagement.id; the delivered engagement being rated"
      - name: content_score
        type: integer
        source: input
        description: "Content rating"
        constraints: "integer 1..5"
      - name: logistics_score
        type: integer
        source: input
        description: "Logistics and on-site handling rating"
        constraints: "integer 1..5"
      - name: rebook_intent
        type: boolean
        source: input
        description: "Whether the client would rebook this speaker"
      - name: comment
        type: string
        source: input
        description: "Free-text client comment"
      - name: composite_score
        type: number
        source: computed
        description: "round_half_up(0.6 * content_score + 0.4 * logistics_score, 2); append-only, never mutated"

  - name: CircumventionClaim
    parent: Engagement
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the client accused of rebooking directly"
      - name: speaker_id
        type: string
        source: input
        description: "FK -> Speaker.id; the speaker rebooked outside the bureau"
      - name: source_engagement_id
        type: string
        source: input
        description: "FK -> Engagement.id; the bureau-brokered engagement that opened the protection window"
      - name: direct_event_date_utc
        type: datetime
        source: input
        description: "Date of the directly booked event"
      - name: direct_fee_cents
        type: integer
        source: input
        description: "Fee the client paid the speaker directly, in cents"
        constraints: ">= 0"
      - name: days_after_source
        type: integer
        source: computed
        description: "floor((direct_event_date_utc - source Engagement.event_end_utc) / 86400 seconds)"
      - name: protection_factor
        type: number
        source: computed
        description: "1.00 when days_after_source <= PROTECTION_FULL_DAYS, 0.50 when <= NON_CIRCUMVENTION_DAYS"
      - name: commission_due_cents
        type: integer
        source: computed
        description: "Output of circumvention_commission_due, locked at claim creation"
      - name: status
        type: enum
        source: system
        default: OPEN
        description: "Claim adjudication state"
        constraints: "one of {OPEN, UPHELD, DISMISSED, SETTLED}"
      - name: settled_cents
        type: integer
        source: system
        description: "Amount actually collected on settlement; null until status == SETTLED"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================

state_machines:

  - entity: Inquiry
    initial_state: RECEIVED
    terminal_states: [WON, LOST, DISQUALIFIED]
    transitions:
      - from: RECEIVED
        to: QUALIFIED
        trigger: "POST /inquiries/{inquiryId}/qualify with outcome == QUALIFY"
        actor: BookingAgent
        preconditions:
          - "inquiry.status == RECEIVED"
          - "client.credit_status != HOLD"
          - "floor((event_start_utc - now_utc) / 86400) >= MIN_LEAD_DAYS"
          - "budget_cents >= MIN_BUDGET_CENTS"
        side_effects:
          - "sets owning_agent_user_id = X-User-ID of the caller"
          - "sets qualification_note"
      - from: RECEIVED
        to: DISQUALIFIED
        trigger: "POST /inquiries/{inquiryId}/qualify with outcome == DISQUALIFY"
        actor: BookingAgent
        preconditions:
          - "inquiry.status == RECEIVED"
        side_effects:
          - "sets owning_agent_user_id = X-User-ID of the caller"
          - "sets qualification_note"
      - from: QUALIFIED
        to: PROPOSED
        trigger: "POST /proposals/{proposalId}/present (cascade from the proposal presentation)"
        actor: system
        preconditions:
          - "the presented proposal's inquiry_id == this inquiry"
        side_effects: ["none beyond the status change and updated_at/version bump"]
      - from: PROPOSED
        to: QUALIFIED
        trigger: "POST /inquiries/{inquiryId}/proposals (cascade: the new proposal supersedes every live proposal, so no presented quotation remains) or POST /proposals/{proposalId}/request-revision"
        actor: system
        preconditions:
          - "no Proposal for this inquiry remains in status PRESENTED after the triggering call"
        side_effects: ["none beyond the status change and updated_at/version bump"]
        note: "Cycle QUALIFIED -> PROPOSED -> QUALIFIED; each round is observable through Proposal.round_no"
      - from: QUALIFIED
        to: BLOCKED
        trigger: "POST /circumvention-claims/{claimId}/resolve (cascade hop 4: client.credit_status became HOLD)"
        actor: system
        preconditions:
          - "client.credit_status == HOLD after the strike increment"
          - "inquiry.status == QUALIFIED"
        side_effects: ["none beyond the status change and updated_at/version bump"]
        note: "Conditional cascade — only QUALIFIED inquiries are blocked; RECEIVED and PROPOSED rows are left untouched"
      - from: BLOCKED
        to: QUALIFIED
        trigger: "PATCH /clients/{clientId} setting credit_status to GOOD or WATCH"
        actor: BureauAdmin
        preconditions:
          - "client.credit_status != HOLD after the patch"
        side_effects: ["none beyond the status change and updated_at/version bump"]
      - from: PROPOSED
        to: WON
        trigger: "POST /proposals/{proposalId}/select"
        actor: Client
        preconditions:
          - "the selected option's proposal.inquiry_id == this inquiry"
        side_effects:
          - "an Engagement row is created in booking_status OFFERED / settlement_status UNBILLED"
      - from: PROPOSED
        to: LOST
        trigger: "POST /proposals/{proposalId}/decline"
        actor: Client
        preconditions:
          - "proposal.status == PRESENTED"
        side_effects:
          - "proposal.status becomes DECLINED and its OFFERED options become REJECTED"

  - entity: Proposal
    initial_state: DRAFT
    terminal_states: [DECLINED, SUPERSEDED, CLOSED]
    transitions:
      - from: DRAFT
        to: PRESENTED
        trigger: "POST /proposals/{proposalId}/present"
        actor: BookingAgent
        preconditions:
          - "proposal.status IN {DRAFT, REVISION_REQUESTED}"
          - "proposal.options_count >= 1"
          - "now_utc < proposal.valid_until_utc"
        side_effects:
          - "sets presented_at_utc = now_utc"
          - "inquiry QUALIFIED -> PROPOSED"
      - from: PRESENTED
        to: REVISION_REQUESTED
        trigger: "POST /proposals/{proposalId}/request-revision"
        actor: Client
        preconditions:
          - "proposal.status == PRESENTED"
          - "proposal.revision_count < MAX_REVISION_ROUNDS"
        side_effects:
          - "increments revision_count by 1"
          - "inquiry PROPOSED -> QUALIFIED"
      - from: REVISION_REQUESTED
        to: PRESENTED
        trigger: "POST /proposals/{proposalId}/present"
        actor: BookingAgent
        preconditions:
          - "proposal.options_count >= 1"
          - "now_utc < proposal.valid_until_utc"
        side_effects:
          - "increments round_no by 1"
          - "sets presented_at_utc = now_utc"
          - "inquiry QUALIFIED -> PROPOSED"
        note: "Cyclic negotiation loop; the loop is bounded by MAX_REVISION_ROUNDS on the revision leg, not on this leg"
      - from: PRESENTED
        to: ACCEPTED
        trigger: "POST /proposals/{proposalId}/select"
        actor: Client
        preconditions:
          - "proposal.status == PRESENTED"
          - "now_utc < proposal.valid_until_utc"
          - "the option named in the body has proposal_id == this proposal and status == OFFERED"
          - "client.credit_status != HOLD"
        side_effects:
          - "selected option OFFERED -> SELECTED; every sibling option OFFERED -> REJECTED"
          - "creates the Engagement (booking OFFERED / settlement UNBILLED) copying event window, is_virtual, quoted_fee_cents, travel_allowance_cents and owning_agent_user_id"
          - "inquiry PROPOSED -> WON"
      - from: ACCEPTED
        to: PRESENTED
        trigger: "POST /engagements/{engagementId}/decline (cascade: the speaker refused the selected option)"
        actor: system
        preconditions:
          - "engagement.booking_status == OFFERED"
          - "now_utc < proposal.valid_until_utc"
        side_effects:
          - "selected option SELECTED -> REJECTED; sibling REJECTED options return to OFFERED"
          - "inquiry WON -> PROPOSED"
        note: "Second cycle on the same entity: ACCEPTED returns to PRESENTED so the client can pick another speaker"
      - from: PRESENTED
        to: DECLINED
        trigger: "POST /proposals/{proposalId}/decline"
        actor: Client
        preconditions:
          - "proposal.status == PRESENTED"
        side_effects:
          - "every OFFERED option becomes REJECTED"
          - "inquiry PROPOSED -> LOST"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /inquiries/{inquiryId}/proposals (a newer proposal is created for the same inquiry)"
        actor: system
        preconditions:
          - "proposal.status IN {DRAFT, PRESENTED, REVISION_REQUESTED}"
        side_effects:
          - "every option of the superseded proposal moves OFFERED -> WITHDRAWN"
      - from: PRESENTED
        to: SUPERSEDED
        trigger: "POST /inquiries/{inquiryId}/proposals (a newer proposal is created for the same inquiry)"
        actor: system
        preconditions:
          - "proposal.status IN {DRAFT, PRESENTED, REVISION_REQUESTED}"
        side_effects:
          - "every option of the superseded proposal moves OFFERED -> WITHDRAWN"
          - "inquiry PROPOSED -> QUALIFIED"
      - from: REVISION_REQUESTED
        to: SUPERSEDED
        trigger: "POST /inquiries/{inquiryId}/proposals (a newer proposal is created for the same inquiry)"
        actor: system
        preconditions:
          - "proposal.status IN {DRAFT, PRESENTED, REVISION_REQUESTED}"
        side_effects:
          - "every option of the superseded proposal moves OFFERED -> WITHDRAWN"
      - from: ACCEPTED
        to: CLOSED
        trigger: "POST /contracts/{contractId}/sign completing the second signature leg"
        actor: system
        preconditions:
          - "contract.status becomes EXECUTED"
        side_effects: ["none beyond the status change and updated_at/version bump"]

  - entity: ProposalOption
    initial_state: OFFERED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: OFFERED
        to: SELECTED
        trigger: "POST /proposals/{proposalId}/select naming this option"
        actor: Client
        preconditions:
          - "option.status == OFFERED"
          - "option.proposal_id == the proposal in the path"
        side_effects: ["engagement creation as described on Proposal PRESENTED -> ACCEPTED"]
      - from: OFFERED
        to: REJECTED
        trigger: "POST /proposals/{proposalId}/select naming a sibling option, or POST /proposals/{proposalId}/decline"
        actor: system
        preconditions: ["option.status == OFFERED"]
        side_effects: ["none beyond the status change and updated_at/version bump"]
      - from: SELECTED
        to: REJECTED
        trigger: "POST /engagements/{engagementId}/decline (cascade from the speaker refusal)"
        actor: system
        preconditions: ["engagement.selected_option_id == this option"]
        side_effects: ["none beyond the status change and updated_at/version bump"]
      - from: REJECTED
        to: OFFERED
        trigger: "POST /engagements/{engagementId}/decline (cascade: sibling options are re-opened for a new selection)"
        actor: system
        preconditions: ["option.proposal_id == the declined engagement's proposal and option.id != engagement.selected_option_id"]
        side_effects: ["none beyond the status change and updated_at/version bump"]
      - from: OFFERED
        to: WITHDRAWN
        trigger: "POST /inquiries/{inquiryId}/proposals (cascade: the parent proposal was superseded)"
        actor: system
        preconditions: ["parent proposal moved to SUPERSEDED"]
        side_effects: ["none beyond the status change and updated_at/version bump"]

  - entity: Engagement
    dimension: booking_status
    initial_state: OFFERED
    terminal_states: [DELIVERED, DECLINED_BY_SPEAKER, CANCELLED_BY_CLIENT, CANCELLED_BY_SPEAKER]
    transitions:
      - from: OFFERED
        to: CONFIRMED
        trigger: "POST /engagements/{engagementId}/confirm"
        actor: Speaker
        preconditions:
          - "engagement.booking_status == OFFERED"
          - "speaker.roster_status == ACTIVE"
          - "no SpeakerHold for this speaker with status == ACTIVE intersects the buffered closed interval [event_start_utc - travel_buffer_days days, event_end_utc + travel_buffer_days days]"
          - "no ExclusivityGrant with status == ACTIVE, speaker_id == this speaker, industry_code == this client's industry_code and beneficiary_client_id != this client covers event_start_utc in [effective_from_utc, effective_to_utc)"
        side_effects:
          - "creates a SpeakerHold (kind ENGAGEMENT, status ACTIVE) over the buffered closed interval"
          - "increments speaker.held_days_count by the new hold's day_span"
          - "flips every ExclusivityGrant with status == ACTIVE and effective_to_utc <= now_utc to EXPIRED before the exclusivity screen runs"
      - from: OFFERED
        to: DECLINED_BY_SPEAKER
        trigger: "POST /engagements/{engagementId}/decline"
        actor: Speaker
        preconditions:
          - "engagement.booking_status == OFFERED"
        side_effects:
          - "selected option SELECTED -> REJECTED and sibling REJECTED options return to OFFERED"
          - "proposal ACCEPTED -> PRESENTED"
          - "inquiry WON -> PROPOSED"
      - from: CONFIRMED
        to: CONTRACTED
        trigger: "POST /contracts/{contractId}/sign completing the second signature leg"
        actor: system
        preconditions:
          - "contract.status becomes EXECUTED"
          - "engagement.booking_status == CONFIRMED"
        side_effects:
          - "sets commission_pct_snapshot = speaker.default_commission_pct at this instant"
          - "writes provisional_commission_cents via engagement_commission variant PROVISIONAL"
          - "creates an ExclusivityGrant (status ACTIVE) when contract.exclusivity_days > 0"
          - "proposal ACCEPTED -> CLOSED"
      - from: CONTRACTED
        to: DELIVERED
        trigger: "POST /engagements/{engagementId}/deliver"
        actor: BookingAgent
        preconditions:
          - "engagement.booking_status == CONTRACTED"
          - "the engagement's Contract has status == EXECUTED"
          - "now_utc >= engagement.event_end_utc"
        side_effects:
          - "writes final_commission_cents via engagement_commission variant FINAL"
          - "issues an Invoice (kind ENGAGEMENT_FEE, status ISSUED) whose surcharge_cents comes from invoice_surcharge_rounding; settlement_status UNBILLED -> INVOICED"
          - "increments client.outstanding_balance_cents by the new invoice.amount_due_cents"
          - "creates a Remittance (status PENDING) and increments speaker.pending_remittance_cents by its net_payable_cents"
          - "the engagement SpeakerHold moves ACTIVE -> CONSUMED and speaker.held_days_count is decremented by its day_span"
          - "cascade hop 2: increments speaker.engagements_delivered_count by 1 and speaker.lifetime_gross_fees_cents by (quoted_fee_cents + recording_fee_cents)"
          - "cascade hop 3: because engagements_delivered_count changed, roster_tier_assignment re-runs and may move speaker.roster_tier"
          - "cascade hop 4: because roster_tier changed, speaker.default_commission_pct is rewritten to TIER_COMMISSION_PCT[new tier]; already-snapshotted engagements keep their commission_pct_snapshot"
      - from: CONFIRMED
        to: CANCELLED_BY_CLIENT
        trigger: "POST /engagements/{engagementId}/cancel by the Client, or by BureauAdmin with on_behalf_of == CLIENT"
        actor: Client
        preconditions:
          - "engagement.booking_status IN {CONFIRMED, CONTRACTED}"
        side_effects:
          - "sets cancelled_by = CLIENT and cancellation_days_before = floor((event_start_utc - now_utc) / 86400)"
          - "the engagement SpeakerHold moves ACTIVE -> RELEASED and speaker.held_days_count is decremented by its day_span"
          - "the Contract moves DRAFT|SENT|PARTIALLY_SIGNED -> VOID"
          - "settlement_status UNBILLED -> WAIVED because no executed contract means no retention"
      - from: CONTRACTED
        to: CANCELLED_BY_CLIENT
        trigger: "POST /engagements/{engagementId}/cancel by the Client, or by BureauAdmin with on_behalf_of == CLIENT"
        actor: Client
        preconditions:
          - "engagement.booking_status IN {CONFIRMED, CONTRACTED}"
        side_effects:
          - "sets cancelled_by = CLIENT and cancellation_days_before = floor((event_start_utc - now_utc) / 86400)"
          - "runs cancellation_settlement, writing retention_net_cents and retention_commission_cents"
          - "when retention_net_cents + travel_reimbursable_cents > 0: issues an Invoice (kind CANCELLATION_RETENTION, status ISSUED), settlement_status UNBILLED -> INVOICED, client.outstanding_balance_cents increases by amount_due_cents, and a Remittance (status PENDING) is created"
          - "when retention_net_cents + travel_reimbursable_cents == 0: no Invoice and no Remittance are created and settlement_status UNBILLED -> WAIVED"
          - "the engagement SpeakerHold moves ACTIVE -> RELEASED and speaker.held_days_count is decremented by its day_span"
          - "every ExclusivityGrant with source_engagement_id == this engagement and status == ACTIVE moves to EXPIRED"
      - from: CONFIRMED
        to: CANCELLED_BY_SPEAKER
        trigger: "POST /engagements/{engagementId}/cancel by the Speaker, or by BureauAdmin with on_behalf_of == SPEAKER"
        actor: Speaker
        preconditions:
          - "engagement.booking_status IN {CONFIRMED, CONTRACTED}"
        side_effects:
          - "sets cancelled_by = SPEAKER; no retention is billed and settlement_status UNBILLED -> WAIVED"
          - "the engagement SpeakerHold moves ACTIVE -> RELEASED and speaker.held_days_count is decremented by its day_span"
          - "the Contract moves DRAFT|SENT|PARTIALLY_SIGNED -> VOID"
          - "speaker.roster_status ACTIVE -> PROBATION"
      - from: CONTRACTED
        to: CANCELLED_BY_SPEAKER
        trigger: "POST /engagements/{engagementId}/cancel by the Speaker, or by BureauAdmin with on_behalf_of == SPEAKER"
        actor: Speaker
        preconditions:
          - "engagement.booking_status IN {CONFIRMED, CONTRACTED}"
        side_effects:
          - "sets cancelled_by = SPEAKER; no retention is billed and settlement_status UNBILLED -> WAIVED"
          - "the engagement SpeakerHold moves ACTIVE -> RELEASED and speaker.held_days_count is decremented by its day_span"
          - "every ExclusivityGrant with source_engagement_id == this engagement and status == ACTIVE moves to EXPIRED"
          - "speaker.roster_status ACTIVE -> PROBATION"

  - entity: Engagement
    dimension: settlement_status
    initial_state: UNBILLED
    terminal_states: [REMITTED, WAIVED, WRITTEN_OFF]
    transitions:
      - from: UNBILLED
        to: INVOICED
        trigger: "POST /engagements/{engagementId}/deliver, or POST /engagements/{engagementId}/cancel that produces a positive retention amount"
        actor: system
        preconditions:
          - "settlement_status == UNBILLED"
          - "an Invoice with amount_due_cents > 0 is created by the triggering call"
        side_effects: ["client.outstanding_balance_cents increases by the invoice amount_due_cents"]
        note: "Independent of booking_status: the booking dimension may sit at DELIVERED, CANCELLED_BY_CLIENT, and it never moves while this dimension advances"
      - from: UNBILLED
        to: WAIVED
        trigger: "POST /engagements/{engagementId}/cancel that produces retention_net_cents + travel_reimbursable_cents == 0, or any speaker-side cancellation"
        actor: system
        preconditions:
          - "settlement_status == UNBILLED"
        side_effects: ["no Invoice and no Remittance rows exist for this engagement"]
      - from: INVOICED
        to: PARTIALLY_COLLECTED
        trigger: "POST /invoices/{invoiceId}/payments for less than the outstanding amount"
        actor: Client
        preconditions:
          - "invoice.status == ISSUED"
          - "amount_cents < invoice.amount_due_cents - invoice.amount_paid_cents"
        side_effects:
          - "invoice ISSUED -> PARTIALLY_PAID; client.outstanding_balance_cents decreases by amount_cents"
      - from: INVOICED
        to: COLLECTED
        trigger: "POST /invoices/{invoiceId}/payments settling the full outstanding amount"
        actor: Client
        preconditions:
          - "invoice.status == ISSUED"
          - "amount_cents == invoice.amount_due_cents - invoice.amount_paid_cents"
        side_effects:
          - "invoice ISSUED -> PAID; client.outstanding_balance_cents decreases by amount_cents"
          - "the engagement Remittance moves PENDING -> APPROVED"
      - from: PARTIALLY_COLLECTED
        to: COLLECTED
        trigger: "POST /invoices/{invoiceId}/payments settling the remaining amount"
        actor: Client
        preconditions:
          - "invoice.status == PARTIALLY_PAID"
          - "amount_cents == invoice.amount_due_cents - invoice.amount_paid_cents"
        side_effects:
          - "invoice PARTIALLY_PAID -> PAID; client.outstanding_balance_cents decreases by amount_cents"
          - "the engagement Remittance moves PENDING -> APPROVED"
      - from: COLLECTED
        to: REMITTED
        trigger: "POST /remittances/{remittanceId}/pay"
        actor: BureauAdmin
        preconditions:
          - "remittance.status == APPROVED"
          - "speaker.tax_form_status == ON_FILE"
        side_effects:
          - "remittance APPROVED -> PAID and paid_at_utc is stamped"
          - "speaker.pending_remittance_cents decreases by remittance.net_payable_cents"
          - "every TravelExpense of this engagement with status == APPROVED moves to REIMBURSED"
      - from: INVOICED
        to: WRITTEN_OFF
        trigger: "POST /invoices/{invoiceId}/void"
        actor: BureauAdmin
        preconditions:
          - "invoice.status == ISSUED"
        side_effects:
          - "invoice ISSUED -> VOID; client.outstanding_balance_cents decreases by (amount_due_cents - amount_paid_cents), restoring the pre-issuance balance"
          - "the engagement Remittance moves PENDING -> VOIDED and speaker.pending_remittance_cents decreases by its net_payable_cents"

  - entity: Contract
    initial_state: DRAFT
    terminal_states: [EXECUTED, VOID]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /contracts/{contractId}/send"
        actor: BookingAgent
        preconditions:
          - "contract.status == DRAFT"
          - "engagement.booking_status == CONFIRMED"
        side_effects: ["none beyond the status change and updated_at/version bump"]
      - from: SENT
        to: PARTIALLY_SIGNED
        trigger: "POST /contracts/{contractId}/sign as Speaker (speaker leg of the fork)"
        actor: Speaker
        preconditions:
          - "contract.status == SENT"
          - "contract.speaker_signed_at_utc is null"
          - "speaker.roster_status == ACTIVE"
        side_effects:
          - "sets speaker_signed_at_utc = now_utc"
        note: "Speaker leg: guarded by roster_status only"
      - from: SENT
        to: PARTIALLY_SIGNED
        trigger: "POST /contracts/{contractId}/sign as Client (client leg of the fork)"
        actor: Client
        preconditions:
          - "contract.status == SENT"
          - "contract.client_signed_at_utc is null"
          - "client.credit_status != HOLD"
        side_effects:
          - "sets client_signed_at_utc = now_utc"
        note: "Client leg: guarded by credit_status only — the two legs carry different guards and different stamped fields"
      - from: PARTIALLY_SIGNED
        to: EXECUTED
        trigger: "POST /contracts/{contractId}/sign by whichever party has not signed yet (join)"
        actor: Speaker
        preconditions:
          - "contract.status == PARTIALLY_SIGNED"
          - "the signing party's own signature field is null"
          - "the signing party's own guard holds (speaker.roster_status == ACTIVE for the speaker leg, client.credit_status != HOLD for the client leg)"
        side_effects:
          - "sets the missing signature field and executed_at_utc = now_utc"
          - "engagement CONFIRMED -> CONTRACTED with commission_pct_snapshot and provisional_commission_cents written"
          - "creates an ExclusivityGrant when exclusivity_days > 0"
          - "proposal ACCEPTED -> CLOSED"
      - from: DRAFT
        to: VOID
        trigger: "POST /engagements/{engagementId}/cancel (cascade)"
        actor: system
        preconditions: ["contract.status IN {DRAFT, SENT, PARTIALLY_SIGNED}"]
        side_effects: ["none beyond the status change and updated_at/version bump"]
      - from: SENT
        to: VOID
        trigger: "POST /engagements/{engagementId}/cancel (cascade)"
        actor: system
        preconditions: ["contract.status IN {DRAFT, SENT, PARTIALLY_SIGNED}"]
        side_effects: ["none beyond the status change and updated_at/version bump"]
      - from: PARTIALLY_SIGNED
        to: VOID
        trigger: "POST /engagements/{engagementId}/cancel (cascade)"
        actor: system
        preconditions: ["contract.status IN {DRAFT, SENT, PARTIALLY_SIGNED}"]
        side_effects: ["none beyond the status change and updated_at/version bump"]

  - entity: SpeakerHold
    initial_state: ACTIVE
    terminal_states: [RELEASED, CONSUMED]
    transitions:
      - from: ACTIVE
        to: CONSUMED
        trigger: "POST /engagements/{engagementId}/deliver (cascade)"
        actor: system
        preconditions: ["hold.kind == ENGAGEMENT and hold.engagement_id == the delivered engagement"]
        side_effects: ["speaker.held_days_count decreases by day_span"]
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /engagements/{engagementId}/cancel or POST /engagements/{engagementId}/decline (cascade)"
        actor: system
        preconditions: ["hold.kind == ENGAGEMENT and hold.engagement_id == the cancelled engagement"]
        side_effects: ["speaker.held_days_count decreases by day_span"]

  - entity: ExclusivityGrant
    initial_state: ACTIVE
    terminal_states: [EXPIRED, WAIVED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /engagements/{engagementId}/confirm (system sweep: now_utc >= effective_to_utc), or POST /engagements/{engagementId}/cancel on the source engagement (cascade)"
        actor: system
        preconditions: ["grant.status == ACTIVE"]
        side_effects: ["the grant stops restricting confirmations"]
      - from: ACTIVE
        to: WAIVED
        trigger: "POST /exclusivity-grants/{grantId}/waive"
        actor: BureauAdmin
        preconditions: ["grant.status == ACTIVE"]
        side_effects: ["the grant stops restricting confirmations"]

  - entity: TravelExpense
    initial_state: SUBMITTED
    terminal_states: [REJECTED, REIMBURSED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /travel-expenses/{expenseId}/approve"
        actor: BookingAgent
        preconditions:
          - "expense.status == SUBMITTED"
          - "engagement.booking_status == CONTRACTED"
          - "the engagement's Contract has status == EXECUTED"
          - "engagement.settlement_status == UNBILLED"
        side_effects:
          - "writes reimbursable_cents via travel_reimbursable"
          - "increments engagement.travel_reimbursable_cents by reimbursable_cents"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /travel-expenses/{expenseId}/reject"
        actor: BookingAgent
        preconditions: ["expense.status == SUBMITTED"]
        side_effects: ["reimbursable_cents stays null and engagement.travel_reimbursable_cents is unchanged"]
      - from: APPROVED
        to: REIMBURSED
        trigger: "POST /remittances/{remittanceId}/pay (cascade)"
        actor: system
        preconditions: ["expense.engagement_id == the remittance's engagement_id"]
        side_effects: ["none beyond the status change and updated_at/version bump"]

  - entity: Invoice
    initial_state: ISSUED
    terminal_states: [PAID, VOID]
    transitions:
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /invoices/{invoiceId}/payments for less than the outstanding amount"
        actor: Client
        preconditions:
          - "invoice.status == ISSUED"
          - "0 < amount_cents < amount_due_cents - amount_paid_cents"
        side_effects:
          - "amount_paid_cents increases by amount_cents; client.outstanding_balance_cents decreases by amount_cents"
          - "engagement.settlement_status INVOICED -> PARTIALLY_COLLECTED"
      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{invoiceId}/payments for exactly the outstanding amount"
        actor: Client
        preconditions:
          - "invoice.status == ISSUED"
          - "amount_cents == amount_due_cents - amount_paid_cents"
        side_effects:
          - "amount_paid_cents becomes amount_due_cents; client.outstanding_balance_cents decreases by amount_cents"
          - "engagement.settlement_status INVOICED -> COLLECTED and the Remittance moves PENDING -> APPROVED"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /invoices/{invoiceId}/payments for exactly the remaining amount"
        actor: Client
        preconditions:
          - "invoice.status == PARTIALLY_PAID"
          - "amount_cents == amount_due_cents - amount_paid_cents"
        side_effects:
          - "client.outstanding_balance_cents decreases by amount_cents"
          - "engagement.settlement_status PARTIALLY_COLLECTED -> COLLECTED and the Remittance moves PENDING -> APPROVED"
      - from: ISSUED
        to: VOID
        trigger: "POST /invoices/{invoiceId}/void"
        actor: BureauAdmin
        preconditions:
          - "invoice.status == ISSUED"
        side_effects:
          - "client.outstanding_balance_cents decreases by (amount_due_cents - amount_paid_cents)"
          - "engagement.settlement_status INVOICED -> WRITTEN_OFF"
          - "the engagement Remittance moves PENDING -> VOIDED and speaker.pending_remittance_cents decreases by net_payable_cents"

  - entity: Remittance
    initial_state: PENDING
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /invoices/{invoiceId}/payments that moves the matching invoice to PAID (cascade)"
        actor: system
        preconditions: ["remittance.engagement_id == invoice.engagement_id"]
        side_effects: ["none beyond the status change and updated_at/version bump"]
      - from: APPROVED
        to: PAID
        trigger: "POST /remittances/{remittanceId}/pay"
        actor: BureauAdmin
        preconditions:
          - "remittance.status == APPROVED"
          - "speaker.tax_form_status == ON_FILE"
        side_effects:
          - "stamps paid_at_utc; speaker.pending_remittance_cents decreases by net_payable_cents"
          - "engagement.settlement_status COLLECTED -> REMITTED"
          - "APPROVED TravelExpense rows of the engagement move to REIMBURSED"
      - from: PENDING
        to: VOIDED
        trigger: "POST /invoices/{invoiceId}/void (cascade)"
        actor: system
        preconditions: ["remittance.engagement_id == invoice.engagement_id"]
        side_effects: ["speaker.pending_remittance_cents decreases by net_payable_cents"]

  - entity: CircumventionClaim
    initial_state: OPEN
    terminal_states: [DISMISSED, SETTLED]
    transitions:
      - from: OPEN
        to: UPHELD
        trigger: "POST /circumvention-claims/{claimId}/resolve with outcome == UPHOLD"
        actor: BureauAdmin
        preconditions: ["claim.status == OPEN"]
        side_effects:
          - "cascade hop 2: client.circumvention_strikes increases by 1"
          - "cascade hop 3: because circumvention_strikes >= CREDIT_HOLD_STRIKE_THRESHOLD, client.credit_status becomes HOLD"
          - "cascade hop 4: because credit_status became HOLD, every Inquiry of that client with status == QUALIFIED moves to BLOCKED"
      - from: OPEN
        to: DISMISSED
        trigger: "POST /circumvention-claims/{claimId}/resolve with outcome == DISMISS"
        actor: BureauAdmin
        preconditions: ["claim.status == OPEN"]
        side_effects: ["client.circumvention_strikes is unchanged"]
      - from: UPHELD
        to: SETTLED
        trigger: "POST /circumvention-claims/{claimId}/resolve with outcome == SETTLE and settled_cents supplied"
        actor: BureauAdmin
        preconditions:
          - "claim.status == UPHELD"
          - "0 <= settled_cents <= claim.commission_due_cents"
        side_effects: ["writes settled_cents; client.circumvention_strikes is unchanged because UPHELD already counted the strike"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent entity's `version`)
# =============================================================================

concurrency_rules:
  - rule_id: proposal-create-stale-inquiry
    parent_entity: Inquiry
    write_endpoint: "POST /inquiries/{inquiryId}/proposals"
    occ_field: "expected_inquiry_version"
    description: |
      Creating a Proposal against an Inquiry whose version has advanced since the
      client last read it is rejected. A newly created proposal legitimately
      supersedes every live proposal on that inquiry (Proposal DRAFT|PRESENTED|
      REVISION_REQUESTED -> SUPERSEDED), so a writer holding a stale view of the
      inquiry would silently discard a quotation package it never saw.
    error_id: ERR_STALE_INQUIRY_VERSION
    http_status: 412

  - rule_id: commission-adjust-stale-engagement
    parent_entity: Engagement
    write_endpoint: "POST /engagements/{engagementId}/commission-adjustments"
    occ_field: "expected_engagement_version"
    description: |
      Recording a commission adjustment against an Engagement whose version has
      advanced since the caller last read it is rejected. Each accepted adjustment
      overwrites commission_pct_snapshot and rewrites provisional_commission_cents,
      so an adjustment computed from a stale snapshot would re-price the engagement
      from a superseded rate.
    error_id: ERR_STALE_ENGAGEMENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================

calculations:

  - name: engagement_commission
    trigger: |
      Variant PROVISIONAL runs when POST /contracts/{contractId}/sign completes the
      second signature leg (Contract -> EXECUTED, Engagement CONFIRMED -> CONTRACTED)
      and when POST /engagements/{engagementId}/commission-adjustments re-prices a
      CONTRACTED engagement. Variant FINAL runs when POST /engagements/{engagementId}/deliver
      moves the engagement CONTRACTED -> DELIVERED.
    algorithm: threshold
    formula: |
      commission_pct_snapshot is pinned at contract execution from
      speaker.default_commission_pct and never re-read from the Speaker afterwards.

      PROVISIONAL:
        provisional_commission_cents = round_half_up(quoted_fee_cents * commission_pct_snapshot)

      FINAL:
        final_commission_cents = round_half_up(
            (quoted_fee_cents + recording_fee_cents) * commission_pct_snapshot)

      recording_fee_cents is copied onto the Engagement from Contract.recording_fee_cents
      at execution; it is 0 whenever contract.recording_rights == NONE.
    input_set: |
      One Engagement whose booking_status is CONTRACTED (PROVISIONAL, written on entry to
      CONTRACTED) or DELIVERED (FINAL, written on entry to DELIVERED). Engagements in
      OFFERED, CONFIRMED, DECLINED_BY_SPEAKER or either CANCELLED_* state have
      commission_pct_snapshot == null and both commission fields null.
    constants:
      COMMISSION_PCT_MIN: 0.10
      COMMISSION_PCT_MAX: 0.35
    precision: "cents, integer, round_half_up on the single final product"
    variants:
      - name: PROVISIONAL
        when: "on entry to booking_status CONTRACTED, and on every accepted commission adjustment"
        difference: |
          Base only: the fee line alone. Recording rights revenue is excluded because the
          recording buy-out is not earned until the session is actually recorded, so the
          provisional figure understates the final one whenever recording_fee_cents > 0.
      - name: FINAL
        when: "on entry to booking_status DELIVERED"
        difference: |
          Base plus recording buy-out: (quoted_fee_cents + recording_fee_cents) is
          commissioned at the same pinned rate. Same engagement, same rate, strictly
          larger result whenever recording_fee_cents > 0; the delta
          round_half_up(recording_fee_cents * commission_pct_snapshot) is what the
          Remittance withholds beyond the provisional figure.

  - name: invoice_surcharge_rounding
    trigger: "Invoice creation on POST /engagements/{engagementId}/deliver (kind ENGAGEMENT_FEE) and on POST /engagements/{engagementId}/cancel with positive retention (kind CANCELLATION_RETENTION)"
    algorithm: aggregation
    formula: |
      Line composition depends on invoice.kind:
        kind == ENGAGEMENT_FEE:
          fee_line_cents       = engagement.quoted_fee_cents
          recording_line_cents = engagement.recording_fee_cents
          travel_line_cents    = engagement.travel_reimbursable_cents
        kind == CANCELLATION_RETENTION:
          fee_line_cents       = engagement.retention_net_cents
          recording_line_cents = 0
          travel_line_cents    = engagement.travel_reimbursable_cents

      Pinned evaluation order — round EACH line, THEN sum the rounded parts:
        s_fee       = round_half_up(fee_line_cents       * SURCHARGE_PCT)
        s_recording = round_half_up(recording_line_cents * SURCHARGE_PCT)
        s_travel    = round_half_up(travel_line_cents    * SURCHARGE_PCT)
        surcharge_cents = s_fee + s_recording + s_travel

      amount_due_cents = fee_line_cents + recording_line_cents + travel_line_cents
                         + surcharge_cents
      amount_paid_cents starts at 0.

      The order is normative and observable: summing the three lines first and rounding
      once, i.e. round_half_up((fee + recording + travel) * SURCHARGE_PCT), yields a
      different surcharge_cents for the same engagement whenever the discarded fractions
      of the individual lines re-combine across the half-cent boundary.
    input_set: "The single Engagement being delivered or cancelled; only APPROVED TravelExpense rows contribute to engagement.travel_reimbursable_cents"
    constants:
      SURCHARGE_PCT: 0.0175
    precision: "cents, integer, round_half_up applied once per line (three times), never to the aggregate"

  - name: cancellation_settlement
    trigger: "POST /engagements/{engagementId}/cancel when cancelled_by == CLIENT and booking_status == CONTRACTED"
    algorithm: tiered_pricing
    formula: |
      Step 1 — elapsed-time bucket (integer whole days, floor):
        cancellation_days_before = floor((event_start_utc - now_utc) / 86400)

      Step 2 — retention_pct from the contract's cancellation ladder
        (cancellation_schedule_code selects the ladder; both are inclusive-lower-bound):
        STANDARD: days_before >= 30            -> 0.00
                  14 <= days_before <= 29      -> 0.50
                  days_before < 14             -> 1.00
        STRICT:   days_before >= 60            -> 0.25
                  21 <= days_before <= 59      -> 0.75
                  days_before < 21             -> 1.00

      Step 3 — gross retention:
        gross_retention_cents = round_half_up(quoted_fee_cents * retention_pct)

      Step 4 — goodwill rebate tier, keyed on the GROSS retention of step 3:
        gross_retention_cents >= 500000            -> rebate_pct = 0.10
        200000 <= gross_retention_cents <= 499999  -> rebate_pct = 0.05
        gross_retention_cents < 200000             -> rebate_pct = 0.00
        rebate_cents = round_half_up(gross_retention_cents * rebate_pct)

      Step 5 — net retention:
        retention_net_cents = gross_retention_cents - rebate_cents

      Step 6 — bureau commission on the NET retention (never on the gross):
        retention_commission_cents = round_half_up(retention_net_cents * commission_pct_snapshot)

      The six steps are order-pinned. Keying the rebate tier on the NET figure of step 5,
      or commissioning the GROSS figure of step 3, produces a different invoice and a
      different remittance for identical inputs. recording_fee_cents is never retained:
      an unrecorded session earns no buy-out.

      Remittance for a cancellation:
        gross_fee_cents         = retention_net_cents
        commission_cents        = retention_commission_cents
        travel_passthrough_cents = engagement.travel_reimbursable_cents
        net_payable_cents       = gross_fee_cents - commission_cents + travel_passthrough_cents
    input_set: "The single CONTRACTED Engagement being cancelled by the client side, plus its EXECUTED Contract for the ladder code, plus its APPROVED TravelExpense rows"
    constants:
      STANDARD_FULL_WAIVER_DAYS: 30
      STANDARD_HALF_RETENTION_DAYS: 14
      STRICT_QUARTER_RETENTION_DAYS: 60
      STRICT_THREE_QUARTER_RETENTION_DAYS: 21
      REBATE_HIGH_THRESHOLD_CENTS: 500000
      REBATE_LOW_THRESHOLD_CENTS: 200000
      REBATE_HIGH_PCT: 0.10
      REBATE_LOW_PCT: 0.05
    precision: "cents, integer, round_half_up at steps 3, 4 and 6 independently"

  - name: travel_reimbursable
    trigger: "POST /travel-expenses/{expenseId}/approve (TravelExpense SUBMITTED -> APPROVED)"
    algorithm: waterfall_allocation
    formula: |
      Conditional feature flag: Contract.travel_policy_code selects the ceiling rule, and
      Engagement.is_virtual short-circuits the whole calculation.

      if engagement.is_virtual == true:
          reimbursable_cents = 0            # no travel occurs for a virtual engagement
      elif contract.travel_policy_code == POLICY_A:      # schedule-or-allowance, whichever is greater
          schedule_cents = round_half_up(
              DISTANCE_BAND_RATE[expense.distance_band]
              * expense.travel_days
              * TRAVEL_CLASS_MULT[speaker.travel_class])
          ceiling_cents = max(engagement.travel_allowance_cents, schedule_cents)
          reimbursable_cents = min(expense.receipts_cents, ceiling_cents)
      else:                                              # POLICY_B — hard allowance cap
          ceiling_cents = engagement.travel_allowance_cents
          reimbursable_cents = min(expense.receipts_cents, ceiling_cents)

      The min/max nesting is normative: under POLICY_A the allowance acts as a FLOOR on the
      ceiling (a generous allowance is honoured even when the mileage schedule is stingy)
      while the receipts always cap the payout. Reordering to
      max(allowance, min(receipts, schedule)) reimburses more than the receipts prove.

      Each approval increments engagement.travel_reimbursable_cents by reimbursable_cents,
      so several approved expenses on one engagement accumulate; each is capped on its own
      terms and the cap is never applied to the accumulated total.
    input_set: "One TravelExpense in status SUBMITTED whose engagement is CONTRACTED with an EXECUTED Contract and still settlement_status UNBILLED; REJECTED expenses contribute nothing"
    constants:
      DISTANCE_BAND_RATE_CENTS_PER_DAY:
        LOCAL: 15000
        REGIONAL: 45000
        NATIONAL: 90000
        INTERNATIONAL: 180000
      TRAVEL_CLASS_MULT:
        ECONOMY: 1.00
        PREMIUM: 1.25
        BUSINESS: 1.60
    precision: "cents, integer, round_half_up on the schedule product before the max/min comparison"

  - name: speaker_performance_score
    trigger: "POST /engagements/{engagementId}/feedback (both variants recomputed and stored on the Speaker), and read on demand via GET /speakers/{speakerId}/performance"
    algorithm: weighted_scoring
    formula: |
      Per-feedback composite (stored on Feedback.composite_score):
        composite_score = round_half_up(0.6 * content_score + 0.4 * logistics_score, 2)

      Candidate set: every Feedback row whose engagement.speaker_id == this speaker,
      ordered by Feedback.created_at DESC, then engagement.event_start_utc DESC. When two
      Feedback rows share both keys, every tied row stays in the set and their relative
      weight order follows the same DESC ordering. Feedback.id is never a decision input.

      LIFETIME:
        lifetime_score = round_half_up(mean(composite_score over ALL candidates), 2)

      ROLLING:
        take the first min(3, n) candidates of the ordered set as c[0], c[1], c[2]
        raw_weights = ROLLING_WEIGHTS[0..min(3,n)-1]
        renormalised w[i] = raw_weights[i] / sum(raw_weights[0..min(3,n)-1])
        rolling_score = round_half_up(sum(w[i] * c[i]), 2)

      Both variants read the same rows and differ only in weighting, so any speaker whose
      recent scores differ from their historical mean has rolling_score != lifetime_score.
      Renormalisation matters below three feedbacks: with n == 2 the weights are
      0.5/0.8 = 0.625 and 0.3/0.8 = 0.375, not 0.5 and 0.3.

      With n == 0 both fields are null and GET /speakers/{speakerId}/performance returns
      score: null with feedback_count: 0.
    input_set: "All Feedback rows reachable from this speaker's Engagement rows; engagement booking_status is irrelevant because Feedback can only be filed on a DELIVERED engagement"
    constants:
      CONTENT_WEIGHT: 0.6
      LOGISTICS_WEIGHT: 0.4
      ROLLING_WEIGHTS: [0.5, 0.3, 0.2]
      ROLLING_WINDOW: 3
    precision: "2 decimal places, round_half_up, applied to the per-feedback composite and once to each variant's weighted sum"
    variants:
      - name: ROLLING
        when: "GET /speakers/{speakerId}/performance?variant=ROLLING (the default) and Speaker.rolling_score; the tier gate in roster_tier_assignment reads this variant"
        difference: |
          Recency-weighted over at most the three newest feedbacks with renormalised
          weights; older feedbacks are dropped entirely once a fourth arrives.
      - name: LIFETIME
        when: "GET /speakers/{speakerId}/performance?variant=LIFETIME and Speaker.lifetime_score"
        difference: |
          Equal-weight arithmetic mean over every feedback ever filed, with no window and
          no recency weighting; a strong early record keeps propping this variant up after
          the rolling variant has already fallen below the tier gate.

  - name: roster_tier_assignment
    trigger: |
      Re-runs at the end of POST /engagements/{engagementId}/deliver (after
      engagements_delivered_count is incremented) and at the end of
      POST /engagements/{engagementId}/feedback (after rolling_score is rewritten).
    algorithm: threshold
    formula: |
      Both conditions of a tier must hold; the highest satisfied tier wins.
        GOLD   requires engagements_delivered_count >= 4 AND rolling_score >= 4.50
        SILVER requires engagements_delivered_count >= 2 AND rolling_score >= 4.00
        BRONZE otherwise (and always while rolling_score is null)

      speaker.default_commission_pct = TIER_COMMISSION_PCT[roster_tier]

      The tier can move DOWN as well as up: a poor feedback that drags rolling_score to
      3.99 demotes a SILVER speaker to BRONZE and lifts default_commission_pct back to
      0.25. Engagements already CONTRACTED keep their commission_pct_snapshot; only
      contracts executed after the change pick up the new rate.
    input_set: "One Speaker row; the gate reads the ROLLING variant of speaker_performance_score, never LIFETIME"
    constants:
      SILVER_MIN_DELIVERED: 2
      SILVER_MIN_ROLLING_SCORE: 4.00
      GOLD_MIN_DELIVERED: 4
      GOLD_MIN_ROLLING_SCORE: 4.50
      TIER_COMMISSION_PCT:
        BRONZE: 0.25
        SILVER: 0.22
        GOLD: 0.20
    precision: "comparisons against the already-rounded 2-decimal rolling_score; commission pct exact to 2 decimals"

  - name: circumvention_commission_due
    trigger: "POST /circumvention-claims (claim creation, status OPEN)"
    algorithm: decay_function
    formula: |
      days_after_source = floor((direct_event_date_utc - source_engagement.event_end_utc) / 86400)

      Step decay on the protection window:
        days_after_source <= PROTECTION_FULL_DAYS (180)        -> protection_factor = 1.00
        PROTECTION_FULL_DAYS < days_after_source
            <= NON_CIRCUMVENTION_DAYS (365)                    -> protection_factor = 0.50
        days_after_source > NON_CIRCUMVENTION_DAYS             -> claim rejected with
                                                                  ERR_OUTSIDE_PROTECTION_WINDOW

      commission_due_cents = round_half_up(
          direct_fee_cents * source_engagement.commission_pct_snapshot * protection_factor)

      The rate is the source engagement's pinned commission_pct_snapshot, not the
      speaker's current default_commission_pct: a speaker promoted to SILVER after the
      source engagement was contracted still owes commission at the rate that engagement
      was written at. direct_event_date_utc on or before source_engagement.event_end_utc
      gives days_after_source <= 0, which is inside the full-protection band.
    input_set: "One source Engagement whose booking_status == DELIVERED and whose commission_pct_snapshot is non-null; at most one OPEN or UPHELD claim may exist per (client_id, speaker_id, source_engagement_id) triple"
    constants:
      PROTECTION_FULL_DAYS: 180
      NON_CIRCUMVENTION_DAYS: 365
      PROTECTION_FULL_FACTOR: 1.00
      PROTECTION_TAIL_FACTOR: 0.50
      CREDIT_HOLD_STRIKE_THRESHOLD: 2
    precision: "cents, integer, round_half_up on the single triple product"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lowest number wins)
# =============================================================================
# Domain ordering inside the business band: identity/ownership (7-8) -> concurrency (9)
# -> lifecycle state (10-11) -> compliance & exclusivity (12-13) -> calendar/temporal
# (14) -> structural constraints (15) -> money (16). Compliance outranks money because
# the bureau may not quote a paused speaker even when the budget clears.

validations:

  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and X-User-Role is one of BureauAdmin, BookingAgent, Speaker, Client"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except POST /_clock/set_current_utc"

  - priority: 2
    category: auth
    check: "the supplied X-User-Role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints except POST /_clock/set_current_utc"

  - priority: 3
    category: existence
    check: "every id in the path resolves to a stored row, validated left to right"
    error_id: "ERR_SPEAKER_NOT_FOUND | ERR_CLIENT_NOT_FOUND | ERR_INQUIRY_NOT_FOUND | ERR_PROPOSAL_NOT_FOUND | ERR_OPTION_NOT_FOUND | ERR_ENGAGEMENT_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_HOLD_NOT_FOUND | ERR_TRAVEL_EXPENSE_NOT_FOUND | ERR_INVOICE_NOT_FOUND | ERR_REMITTANCE_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_GRANT_NOT_FOUND | ERR_FEEDBACK_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 4
    category: existence
    check: "request body parses, every required input field is present, every enum value is a declared member, every *_cents value is an integer >= 0, every *_utc value is an ISO-8601 UTC instant, scores are integers 1..5, rank_no is 1..4, travel_days >= 1, and new_commission_pct / amount_cents are well-formed numbers"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST and PATCH endpoints"

  - priority: 5
    category: existence
    check: "event_end_utc > event_start_utc on POST /inquiries; ExclusivityGrant windows and hold windows derived by the server are never inverted"
    error_id: ERR_EVENT_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /inquiries"

  - priority: 6
    category: existence
    check: "every foreign key supplied in the body resolves: client_id on POST /inquiries; speaker_id on POST /proposal-options and POST /speaker-holds; option_id on POST /proposals/{proposalId}/select; client_id, speaker_id and source_engagement_id on POST /circumvention-claims"
    error_id: "ERR_CLIENT_NOT_FOUND | ERR_SPEAKER_NOT_FOUND | ERR_OPTION_NOT_FOUND | ERR_ENGAGEMENT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /inquiries, POST /proposal-options, POST /speaker-holds, POST /proposals/{proposalId}/select, POST /circumvention-claims"

  - priority: 7
    category: business_referential
    check: |
      Ownership for entity_backed roles: a Client caller's X-User-ID must equal the
      client_id reachable from the target resource (inquiry.client_id, proposal ->
      inquiry.client_id, engagement -> inquiry.client_id, contract -> engagement ->
      inquiry.client_id, invoice.client_id); a Speaker caller's X-User-ID must equal
      engagement.speaker_id (or contract -> engagement.speaker_id, travel expense ->
      engagement.speaker_id). A BookingAgent acting on an Engagement, Proposal or
      TravelExpense must be the owning_agent_user_id recorded at qualification — with one
      deliberate exception: POST /engagements/{engagementId}/commission-adjustments is a
      four-eyes operation, so this ownership rule does NOT apply to it and the owner is
      instead barred by the segregation-of-duties rule at priority 8.
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all Client-, Speaker- and BookingAgent-facing action endpoints on Inquiry, Proposal, Engagement, Contract, TravelExpense and Invoice resources, EXCEPT POST /engagements/{engagementId}/commission-adjustments"

  - priority: 8
    category: business_safety
    check: |
      Segregation of duties: the BookingAgent whose X-User-ID equals
      engagement.owning_agent_user_id may not post a commission adjustment on that
      engagement (POST /engagements/{engagementId}/commission-adjustments); the
      adjustment must come from a different BookingAgent user id or from BureauAdmin.
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /engagements/{engagementId}/commission-adjustments"

  - priority: 9
    category: state
    check: "the OCC token in the body equals the parent's current version — expected_inquiry_version on POST /inquiries/{inquiryId}/proposals, expected_engagement_version on POST /engagements/{engagementId}/commission-adjustments"
    error_id: "ERR_STALE_INQUIRY_VERSION | ERR_STALE_ENGAGEMENT_VERSION"
    http_status: 412
    applies_to: "POST /inquiries/{inquiryId}/proposals, POST /engagements/{engagementId}/commission-adjustments"

  - priority: 10
    category: state
    check: |
      The target resource sits in a state that declares the requested transition in §1.2:
      inquiry.status for qualify and proposal creation; proposal.status for present /
      request-revision / decline / select; engagement.booking_status for confirm /
      decline / contract creation / deliver / cancel / travel-expense submission /
      commission adjustment; contract.status for send / sign; travel expense status for
      approve / reject; invoice.status for payment / void; remittance.status for pay;
      claim.status for resolve; grant.status for waive.
    error_id: "ERR_INQUIRY_STATE_INVALID | ERR_PROPOSAL_STATE_INVALID | ERR_ENGAGEMENT_STATE_INVALID | ERR_CONTRACT_STATE_INVALID | ERR_TRAVEL_EXPENSE_STATE_INVALID | ERR_INVOICE_NOT_PAYABLE | ERR_REMITTANCE_NOT_APPROVED | ERR_CLAIM_NOT_OPEN | ERR_GRANT_NOT_ACTIVE"
    http_status: 409
    applies_to: "all action endpoints that drive a §1.2 transition"

  - priority: 11
    category: state
    check: |
      Idempotency and terminal lockdown refinements evaluated after the generic state
      check: cancelling or delivering an engagement already in a terminal booking_status
      (DELIVERED, DECLINED_BY_SPEAKER, CANCELLED_BY_CLIENT, CANCELLED_BY_SPEAKER) is
      ERR_ENGAGEMENT_ALREADY_TERMINAL; signing a contract leg whose own signature field
      is already stamped is ERR_PARTY_ALREADY_SIGNED; filing a second Feedback for the
      same engagement is ERR_FEEDBACK_ALREADY_SUBMITTED.
    error_id: "ERR_ENGAGEMENT_ALREADY_TERMINAL | ERR_PARTY_ALREADY_SIGNED | ERR_FEEDBACK_ALREADY_SUBMITTED"
    http_status: 409
    applies_to: "POST /engagements/{engagementId}/cancel, POST /engagements/{engagementId}/deliver, POST /contracts/{contractId}/sign, POST /engagements/{engagementId}/feedback"

  - priority: 12
    category: business_referential
    check: "the option named in POST /proposals/{proposalId}/select has proposal_id equal to the proposal in the path"
    error_id: ERR_OPTION_NOT_IN_PROPOSAL
    http_status: 409
    applies_to: "POST /proposals/{proposalId}/select"

  - priority: 13
    category: business_safety
    check: |
      Compliance and counterparty posture, evaluated in this order within the priority:
      (a) client.credit_status != HOLD for qualification, option selection and the client
      signature leg -> ERR_CLIENT_CREDIT_HOLD;
      (b) speaker.roster_status == ACTIVE for being quoted on a proposal option, for
      confirming an engagement and for the speaker signature leg -> ERR_SPEAKER_NOT_ACTIVE;
      (c) the inquiry's required_topic is in speaker.topics when an option is created ->
      ERR_TOPIC_NOT_IN_ROSTER;
      (d) the engagement's contract.status == EXECUTED before a travel expense may be
      approved (a receipt may be SUBMITTED as soon as the engagement is CONFIRMED, but the
      reimbursement rule lives on the agreement) -> ERR_CONTRACT_NOT_EXECUTED;
      (e) speaker.tax_form_status == ON_FILE before a remittance payout ->
      ERR_SPEAKER_TAX_FORM_MISSING.
    error_id: "ERR_CLIENT_CREDIT_HOLD | ERR_SPEAKER_NOT_ACTIVE | ERR_TOPIC_NOT_IN_ROSTER | ERR_CONTRACT_NOT_EXECUTED | ERR_SPEAKER_TAX_FORM_MISSING"
    http_status: 409
    applies_to: "POST /inquiries/{inquiryId}/qualify, POST /proposal-options, POST /proposals/{proposalId}/select, POST /engagements/{engagementId}/confirm, POST /contracts/{contractId}/sign, POST /travel-expenses/{expenseId}/approve, POST /remittances/{remittanceId}/pay"

  - priority: 14
    category: business_safety
    check: |
      Exclusivity screen on confirmation: after the lazy expiry sweep, no ExclusivityGrant
      with status ACTIVE, the same speaker_id, the same industry_code as this engagement's
      client, and a beneficiary_client_id different from this engagement's client may cover
      event_start_utc in the half-open window [effective_from_utc, effective_to_utc).
    error_id: ERR_EXCLUSIVITY_CONFLICT
    http_status: 409
    applies_to: "POST /engagements/{engagementId}/confirm"

  - priority: 15
    category: business_temporal
    check: |
      Calendar and clock checks, evaluated in this order within the priority:
      (a) no SpeakerHold with status ACTIVE for this speaker intersects the buffered CLOSED
      interval [event_start_utc - travel_buffer_days days, event_end_utc +
      travel_buffer_days days] on confirmation, and a manually posted hold may not
      intersect an existing ACTIVE hold -> ERR_SPEAKER_CALENDAR_CONFLICT;
      (b) floor((event_start_utc - now_utc) / 86400) >= 21 at qualification ->
      ERR_INSUFFICIENT_LEAD_TIME;
      (c) now_utc < proposal.valid_until_utc when presenting, selecting or requesting a
      revision -> ERR_PROPOSAL_EXPIRED;
      (d) now_utc >= engagement.event_end_utc before delivery and before filing feedback ->
      ERR_EVENT_NOT_ENDED;
      (e) floor((direct_event_date_utc - source.event_end_utc) / 86400) <= 365 on claim
      creation -> ERR_OUTSIDE_PROTECTION_WINDOW.
    error_id: "ERR_SPEAKER_CALENDAR_CONFLICT | ERR_INSUFFICIENT_LEAD_TIME | ERR_PROPOSAL_EXPIRED | ERR_EVENT_NOT_ENDED | ERR_OUTSIDE_PROTECTION_WINDOW"
    http_status: 409
    applies_to: "POST /engagements/{engagementId}/confirm, POST /speaker-holds, POST /inquiries/{inquiryId}/qualify, POST /proposals/{proposalId}/present, POST /proposals/{proposalId}/select, POST /proposals/{proposalId}/request-revision, POST /engagements/{engagementId}/deliver, POST /engagements/{engagementId}/feedback, POST /circumvention-claims"

  - priority: 16
    category: business_constraint
    check: |
      Structural constraints on the quotation package and the claim register:
      (a) proposal.options_count >= 1 when presenting -> ERR_PROPOSAL_NO_OPTIONS;
      (b) proposal.options_count < 4 when adding an option -> ERR_OPTION_LIMIT_REACHED;
      (c) no sibling option on the same proposal already quotes this speaker_id ->
      ERR_DUPLICATE_SPEAKER_OPTION;
      (d) no sibling option on the same proposal already uses this rank_no ->
      ERR_DUPLICATE_RANK;
      (e) proposal.revision_count < 2 when requesting a revision ->
      ERR_REVISION_LIMIT_REACHED;
      (f) no OPEN or UPHELD claim already exists for the same (client_id, speaker_id,
      source_engagement_id) triple -> ERR_DUPLICATE_CLAIM.
    error_id: "ERR_PROPOSAL_NO_OPTIONS | ERR_OPTION_LIMIT_REACHED | ERR_DUPLICATE_SPEAKER_OPTION | ERR_DUPLICATE_RANK | ERR_REVISION_LIMIT_REACHED | ERR_DUPLICATE_CLAIM"
    http_status: 409
    applies_to: "POST /proposals/{proposalId}/present, POST /proposal-options, POST /proposals/{proposalId}/request-revision, POST /circumvention-claims"

  - priority: 17
    category: business_constraint
    check: |
      Recording-rights consistency on POST /engagements/{engagementId}/contracts:
      recording_rights == NONE requires recording_fee_cents to be omitted or 0
      (-> ERR_RECORDING_FEE_NOT_ALLOWED); recording_rights IN {AUDIO_ONLY, FULL_BUY_OUT}
      requires recording_fee_cents > 0 (-> ERR_RECORDING_FEE_REQUIRED).
    error_id: "ERR_RECORDING_FEE_NOT_ALLOWED | ERR_RECORDING_FEE_REQUIRED"
    http_status: 422
    applies_to: "POST /engagements/{engagementId}/contracts"

  - priority: 18
    category: business_fiscal
    check: |
      Money checks, last within the business band:
      (a) budget_cents >= 250000 at qualification -> ERR_BUDGET_BELOW_FLOOR;
      (b) fee_floor_cents <= quoted_fee_cents <= fee_ceiling_cents for the quoted speaker
      -> ERR_FEE_OUTSIDE_SPEAKER_RANGE;
      (c) quoted_fee_cents + travel_allowance_cents <= round_half_up(inquiry.budget_cents
      * 1.20) -> ERR_QUOTE_EXCEEDS_BUDGET;
      (d) 0 < amount_cents <= invoice.amount_due_cents - invoice.amount_paid_cents ->
      ERR_OVERPAYMENT;
      (e) 0.10 <= new_commission_pct <= 0.35 on a commission adjustment ->
      ERR_COMMISSION_PCT_OUT_OF_RANGE (422);
      (f) 0 <= settled_cents <= claim.commission_due_cents when settling a claim ->
      ERR_INVALID_REQUEST (422).
    error_id: "ERR_BUDGET_BELOW_FLOOR | ERR_FEE_OUTSIDE_SPEAKER_RANGE | ERR_QUOTE_EXCEEDS_BUDGET | ERR_OVERPAYMENT | ERR_COMMISSION_PCT_OUT_OF_RANGE | ERR_INVALID_REQUEST"
    http_status: 409
    applies_to: "POST /inquiries/{inquiryId}/qualify, POST /proposal-options, POST /invoices/{invoiceId}/payments, POST /engagements/{engagementId}/commission-adjustments, POST /circumvention-claims/{claimId}/resolve"

# =============================================================================
# §1.5 API Endpoint Table   (api_prefix is "" — every path is top-level)
# =============================================================================

endpoints:

  # --- Speaker roster ------------------------------------------------------
  - method: POST
    path: "/speakers"
    description: "Register a speaker on the roster with topic taxonomy, fee range and travel requirements"
    roles: [BureauAdmin]
    code: 201
    input: ["full_name", "topics", "fee_floor_cents", "fee_ceiling_cents", "travel_class", "travel_buffer_days?", "tax_form_status?"]
    output: Speaker
    side_effects:
      - "roster_status defaults to ACTIVE, roster_tier to BRONZE, default_commission_pct to TIER_COMMISSION_PCT[BRONZE] = 0.25"
      - "engagements_delivered_count, lifetime_gross_fees_cents, held_days_count, pending_remittance_cents and feedback_count start at 0; rolling_score and lifetime_score start null"

  - method: GET
    path: "/speakers"
    description: "List roster speakers, optionally filtered by topic code, roster status or tier"
    roles: [BureauAdmin, BookingAgent]
    code: 200
    input: ["topic?", "roster_status?", "roster_tier?", "limit?", "offset?"]
    output: Speaker[]
    side_effects: []

  - method: GET
    path: "/speakers/{speakerId}"
    description: "Read one roster speaker including derived tier, commission rate and conserved held_days_count"
    roles: [BureauAdmin, BookingAgent, Speaker]
    code: 200
    input: []
    output: Speaker
    side_effects: []

  - method: PATCH
    path: "/speakers/{speakerId}"
    description: "Maintain roster posture and travel/fee terms; roster_status and tax_form_status are the compliance levers"
    roles: [BureauAdmin]
    code: 200
    input: ["roster_status?", "tax_form_status?", "fee_floor_cents?", "fee_ceiling_cents?", "travel_class?", "travel_buffer_days?"]
    output: Speaker
    side_effects:
      - "increments Speaker.version by 1"
      - "roster_tier and default_commission_pct are never writable through this endpoint"

  - method: GET
    path: "/speakers/{speakerId}/performance"
    description: "Computed read of speaker_performance_score; variant defaults to ROLLING, LIFETIME returns the equal-weight mean over all feedback"
    roles: [BureauAdmin, BookingAgent, Speaker]
    code: 200
    input: ["variant?"]
    output: { speaker_id: string, variant: string, score: number, feedback_count: integer, roster_tier: string, default_commission_pct: number }
    side_effects: []

  # --- Clients -------------------------------------------------------------
  - method: POST
    path: "/clients"
    description: "Register a booking client organisation with its industry code (the exclusivity dimension)"
    roles: [BureauAdmin]
    code: 201
    input: [org_name, industry_code, primary_contact_email]
    output: Client
    side_effects:
      - "credit_status defaults to GOOD; outstanding_balance_cents and circumvention_strikes start at 0"

  - method: GET
    path: "/clients"
    description: "List client organisations, optionally filtered by industry or credit posture"
    roles: [BureauAdmin, BookingAgent]
    code: 200
    input: ["industry_code?", "credit_status?", "limit?", "offset?"]
    output: Client[]
    side_effects: []

  - method: GET
    path: "/clients/{clientId}"
    description: "Read one client including outstanding_balance_cents and circumvention_strikes"
    roles: [BureauAdmin, BookingAgent, Client]
    code: 200
    input: []
    output: Client
    side_effects: []

  - method: PATCH
    path: "/clients/{clientId}"
    description: "Adjust client credit posture or contact; clearing a HOLD releases the client's BLOCKED inquiries"
    roles: [BureauAdmin]
    code: 200
    input: ["credit_status?", "primary_contact_email?"]
    output: Client
    side_effects:
      - "increments Client.version by 1"
      - "when credit_status becomes GOOD or WATCH, every Inquiry of this client with status BLOCKED moves back to QUALIFIED"

  # --- Speaker calendar ----------------------------------------------------
  - method: POST
    path: "/speaker-holds"
    description: "Post a manual BLACKOUT hold on a speaker's calendar; rejected when it intersects an existing ACTIVE hold"
    roles: [BureauAdmin, BookingAgent]
    code: 201
    input: ["speaker_id", "hold_start_utc", "hold_end_utc", "reason?"]
    output: SpeakerHold
    side_effects:
      - "kind is BLACKOUT and engagement_id is null; status is ACTIVE"
      - "day_span is the count of distinct UTC calendar dates the closed interval touches"
      - "increments speaker.held_days_count by day_span"

  - method: GET
    path: "/speaker-holds"
    description: "List calendar holds; filterable by speaker, engagement, kind and status"
    roles: [BureauAdmin, BookingAgent, Speaker]
    code: 200
    input: ["speaker_id?", "engagement_id?", "kind?", "status?", "limit?", "offset?"]
    output: SpeakerHold[]
    side_effects: []

  - method: GET
    path: "/speaker-holds/{holdId}"
    description: "Read one calendar hold including its day_span"
    roles: [BureauAdmin, BookingAgent, Speaker]
    code: 200
    input: []
    output: SpeakerHold
    side_effects: []

  # --- Inquiries -----------------------------------------------------------
  - method: POST
    path: "/inquiries"
    description: "Record an inbound client inquiry with topic, event window, audience, objectives and budget"
    roles: [BookingAgent, BureauAdmin]
    code: 201
    input: ["client_id", "required_topic", "event_start_utc", "event_end_utc", "audience_size", "budget_cents", "objective_tags", "is_virtual?"]
    output: Inquiry
    side_effects:
      - "status starts at RECEIVED and owning_agent_user_id starts null"

  - method: GET
    path: "/inquiries"
    description: "List inquiries; filterable by client, owning agent, status and required topic"
    roles: [BureauAdmin, BookingAgent, Client]
    code: 200
    input: ["client_id?", "owning_agent_user_id?", "status?", "required_topic?", "limit?", "offset?"]
    output: Inquiry[]
    side_effects: []

  - method: GET
    path: "/inquiries/{inquiryId}"
    description: "Read one inquiry including its version (the OCC token for proposal creation)"
    roles: [BureauAdmin, BookingAgent, Client]
    code: 200
    input: []
    output: Inquiry
    side_effects: []

  - method: POST
    path: "/inquiries/{inquiryId}/qualify"
    description: "Qualify or disqualify an inquiry against lead time, budget floor and client credit posture"
    roles: [BookingAgent]
    code: 200
    input: ["outcome", "qualification_note?"]
    output: Inquiry
    side_effects:
      - "sets owning_agent_user_id to the calling agent's X-User-ID (the segregation-of-duties anchor)"
      - "RECEIVED -> QUALIFIED on outcome QUALIFY, RECEIVED -> DISQUALIFIED on outcome DISQUALIFY"
      - "increments Inquiry.version by 1"

  - method: POST
    path: "/inquiries/{inquiryId}/proposals"
    description: "Open a new proposal round on a qualified inquiry; supersedes every live proposal on that inquiry"
    roles: [BookingAgent]
    code: 201
    input: [expected_inquiry_version, valid_until_utc]
    output: Proposal
    side_effects:
      - "OCC per §1.2.1 rule proposal-create-stale-inquiry; increments Inquiry.version by 1 on success"
      - "every existing Proposal of this inquiry in DRAFT, PRESENTED or REVISION_REQUESTED moves to SUPERSEDED and its OFFERED options move to WITHDRAWN"
      - "an inquiry in PROPOSED falls back to QUALIFIED because no PRESENTED proposal remains"
      - "the new proposal starts in DRAFT with round_no 1, revision_count 0 and options_count 0"

  # --- Proposals and options ----------------------------------------------
  - method: GET
    path: "/proposals"
    description: "List proposals; filterable by inquiry, status and negotiation round"
    roles: [BureauAdmin, BookingAgent, Client]
    code: 200
    input: ["inquiry_id?", "status?", "round_no?", "limit?", "offset?"]
    output: Proposal[]
    side_effects: []

  - method: GET
    path: "/proposals/{proposalId}"
    description: "Read one proposal including round_no, revision_count, options_count and valid_until_utc"
    roles: [BureauAdmin, BookingAgent, Client]
    code: 200
    input: []
    output: Proposal
    side_effects: []

  - method: POST
    path: "/proposal-options"
    description: "Add one speaker option with its fee quotation to a proposal still in DRAFT or REVISION_REQUESTED"
    roles: [BookingAgent]
    code: 201
    input: ["proposal_id", "speaker_id", "quoted_fee_cents", "rank_no", "travel_allowance_cents?"]
    output: ProposalOption
    side_effects:
      - "increments the parent proposal's options_count by 1 and its version by 1"
      - "status starts at OFFERED"

  - method: GET
    path: "/proposal-options"
    description: "List quoted speaker options; filterable by proposal, speaker and status"
    roles: [BureauAdmin, BookingAgent, Client]
    code: 200
    input: ["proposal_id?", "speaker_id?", "status?", "limit?", "offset?"]
    output: ProposalOption[]
    side_effects: []

  - method: GET
    path: "/proposal-options/{optionId}"
    description: "Read one quoted speaker option"
    roles: [BureauAdmin, BookingAgent, Client]
    code: 200
    input: []
    output: ProposalOption
    side_effects: []

  - method: POST
    path: "/proposals/{proposalId}/present"
    description: "Present the quotation package to the client; the entry point of every negotiation round"
    roles: [BookingAgent]
    code: 200
    input: []
    output: Proposal
    side_effects:
      - "DRAFT -> PRESENTED, or REVISION_REQUESTED -> PRESENTED with round_no incremented by 1"
      - "stamps presented_at_utc with now_utc and moves the inquiry QUALIFIED -> PROPOSED"

  - method: POST
    path: "/proposals/{proposalId}/request-revision"
    description: "Client asks for a re-quote; bounded by the revision limit of 2"
    roles: [Client]
    code: 200
    input: ["revision_note?"]
    output: Proposal
    side_effects:
      - "PRESENTED -> REVISION_REQUESTED with revision_count incremented by 1"
      - "moves the inquiry PROPOSED -> QUALIFIED"

  - method: POST
    path: "/proposals/{proposalId}/decline"
    description: "Client declines the whole quotation package"
    roles: [Client]
    code: 200
    input: ["decline_reason?"]
    output: Proposal
    side_effects:
      - "PRESENTED -> DECLINED, every OFFERED option -> REJECTED, inquiry PROPOSED -> LOST"

  - method: POST
    path: "/proposals/{proposalId}/select"
    description: "Client selects one quoted speaker option, which mints the Engagement"
    roles: [Client]
    code: 201
    input: [option_id]
    output: Engagement
    side_effects:
      - "the named option OFFERED -> SELECTED and every sibling OFFERED option -> REJECTED"
      - "proposal PRESENTED -> ACCEPTED and inquiry PROPOSED -> WON"
      - "creates the Engagement with booking_status OFFERED, settlement_status UNBILLED, quoted_fee_cents and travel_allowance_cents copied from the option, event window and is_virtual copied from the inquiry, owning_agent_user_id copied from the inquiry"

  # --- Engagements ---------------------------------------------------------
  - method: GET
    path: "/engagements"
    description: "List engagements; filterable by inquiry, speaker, selected option and either state dimension"
    roles: [BureauAdmin, BookingAgent, Speaker, Client]
    code: 200
    input: ["inquiry_id?", "speaker_id?", "selected_option_id?", "booking_status?", "settlement_status?", "limit?", "offset?"]
    output: Engagement[]
    side_effects: []

  - method: GET
    path: "/engagements/{engagementId}"
    description: "Read one engagement including both state dimensions, commission snapshot and settlement figures"
    roles: [BureauAdmin, BookingAgent, Speaker, Client]
    code: 200
    input: []
    output: Engagement
    side_effects: []

  - method: POST
    path: "/engagements/{engagementId}/confirm"
    description: "Speaker accepts the booking; runs the exclusivity screen and mints the buffered calendar hold"
    roles: [Speaker]
    code: 200
    input: []
    output: Engagement
    side_effects:
      - "flips every ExclusivityGrant with status ACTIVE and effective_to_utc <= now_utc to EXPIRED, then screens the remaining ACTIVE grants"
      - "OFFERED -> CONFIRMED"
      - "creates a SpeakerHold (kind ENGAGEMENT, status ACTIVE) spanning [event_start_utc - travel_buffer_days days, event_end_utc + travel_buffer_days days] and increments speaker.held_days_count by its day_span"

  - method: POST
    path: "/engagements/{engagementId}/decline"
    description: "Speaker refuses the booking, re-opening the proposal for another selection"
    roles: [Speaker]
    code: 200
    input: ["decline_reason?"]
    output: Engagement
    side_effects:
      - "OFFERED -> DECLINED_BY_SPEAKER"
      - "selected option SELECTED -> REJECTED, sibling REJECTED options -> OFFERED, proposal ACCEPTED -> PRESENTED, inquiry WON -> PROPOSED"

  - method: POST
    path: "/engagements/{engagementId}/contracts"
    description: "Draft the speaker agreement with cancellation ladder, travel policy, recording rights and exclusivity term"
    roles: [BookingAgent]
    code: 201
    input: ["cancellation_schedule_code", "travel_policy_code", "recording_rights", "recording_fee_cents?", "technical_rider_code?", "exclusivity_days?"]
    output: Contract
    side_effects:
      - "status starts at DRAFT with both signature stamps null"
      - "recording_fee_cents defaults to 0, technical_rider_code to STANDARD_AV, exclusivity_days to 0"

  - method: POST
    path: "/engagements/{engagementId}/travel-expenses"
    description: "Submit a travel receipt against a confirmed or contracted engagement; approval is gated on the agreement being executed"
    roles: [Speaker, BookingAgent]
    code: 201
    input: ["receipts_cents", "travel_days", "distance_band", "memo?"]
    output: TravelExpense
    side_effects:
      - "status starts at SUBMITTED and reimbursable_cents starts null; permitted while booking_status is CONFIRMED or CONTRACTED"

  - method: POST
    path: "/engagements/{engagementId}/deliver"
    description: "Mark the engagement delivered after the event window closes; runs final commission, invoicing and remittance"
    roles: [BookingAgent]
    code: 200
    input: []
    output: Engagement
    side_effects:
      - "CONTRACTED -> DELIVERED and settlement_status UNBILLED -> INVOICED"
      - "writes final_commission_cents via engagement_commission variant FINAL"
      - "issues an Invoice (kind ENGAGEMENT_FEE, status ISSUED) whose surcharge_cents comes from invoice_surcharge_rounding and increments client.outstanding_balance_cents by its amount_due_cents"
      - "creates a Remittance (status PENDING) and increments speaker.pending_remittance_cents by its net_payable_cents"
      - "the engagement SpeakerHold ACTIVE -> CONSUMED and speaker.held_days_count decreases by its day_span"
      - "increments speaker.engagements_delivered_count by 1 and speaker.lifetime_gross_fees_cents by (quoted_fee_cents + recording_fee_cents), then re-runs roster_tier_assignment which may rewrite roster_tier and default_commission_pct"

  - method: POST
    path: "/engagements/{engagementId}/cancel"
    description: "Cancel a confirmed or contracted engagement; client-side cancellation of a contracted engagement runs cancellation_settlement"
    roles: [Client, Speaker, BureauAdmin]
    code: 200
    input: ["cancellation_reason?", "on_behalf_of?"]
    output: Engagement
    side_effects:
      - "sets cancelled_by from the caller's role (or from on_behalf_of when BureauAdmin acts) and cancellation_days_before = floor((event_start_utc - now_utc) / 86400)"
      - "client-side cancellation of a CONTRACTED engagement writes retention_net_cents and retention_commission_cents, and issues a CANCELLATION_RETENTION Invoice plus a PENDING Remittance when the billable total is positive, otherwise settlement_status UNBILLED -> WAIVED"
      - "speaker-side cancellation bills nothing, sets settlement_status WAIVED and moves speaker.roster_status ACTIVE -> PROBATION"
      - "the engagement SpeakerHold ACTIVE -> RELEASED and speaker.held_days_count decreases by its day_span"
      - "a non-executed Contract moves to VOID; ACTIVE ExclusivityGrant rows sourced from this engagement move to EXPIRED"

  - method: POST
    path: "/engagements/{engagementId}/feedback"
    description: "Client files engagement feedback, which re-scores the speaker and may re-tier the roster"
    roles: [Client]
    code: 201
    input: ["content_score", "logistics_score", "rebook_intent?", "comment?"]
    output: Feedback
    side_effects:
      - "writes Feedback.composite_score = round_half_up(0.6 * content_score + 0.4 * logistics_score, 2)"
      - "recomputes speaker.rolling_score and speaker.lifetime_score and increments speaker.feedback_count by 1"
      - "re-runs roster_tier_assignment, which may promote or demote roster_tier and rewrite default_commission_pct"

  - method: POST
    path: "/engagements/{engagementId}/commission-adjustments"
    description: "Re-price a contracted engagement's commission rate under four-eyes control; OCC-guarded on the engagement version"
    roles: [BookingAgent, BureauAdmin]
    code: 200
    input: [expected_engagement_version, new_commission_pct, reason]
    output: Engagement
    side_effects:
      - "OCC per §1.2.1 rule commission-adjust-stale-engagement; increments Engagement.version by 1 on success"
      - "overwrites commission_pct_snapshot with new_commission_pct and rewrites provisional_commission_cents via engagement_commission variant PROVISIONAL"
      - "increments commission_adjustment_count by 1"
      - "rejected with ERR_SEGREGATION_OF_DUTIES when the caller is the engagement's owning_agent_user_id"

  # --- Contracts -----------------------------------------------------------
  - method: GET
    path: "/contracts"
    description: "List speaker agreements; filterable by engagement and status"
    roles: [BureauAdmin, BookingAgent, Speaker, Client]
    code: 200
    input: ["engagement_id?", "status?", "limit?", "offset?"]
    output: Contract[]
    side_effects: []

  - method: GET
    path: "/contracts/{contractId}"
    description: "Read one speaker agreement including both signature stamps and executed_at_utc"
    roles: [BureauAdmin, BookingAgent, Speaker, Client]
    code: 200
    input: []
    output: Contract
    side_effects: []

  - method: POST
    path: "/contracts/{contractId}/send"
    description: "Send the drafted agreement out for signature"
    roles: [BookingAgent]
    code: 200
    input: []
    output: Contract
    side_effects:
      - "DRAFT -> SENT"

  - method: POST
    path: "/contracts/{contractId}/sign"
    description: "Sign one leg of the agreement; the second leg executes the contract and contracts the engagement"
    roles: [Speaker, Client]
    code: 200
    input: [signature_name]
    output: Contract
    side_effects:
      - "stamps speaker_signed_at_utc (Speaker leg, gated on roster_status == ACTIVE) or client_signed_at_utc (Client leg, gated on credit_status != HOLD)"
      - "SENT -> PARTIALLY_SIGNED on the first leg; PARTIALLY_SIGNED -> EXECUTED on the second leg, stamping executed_at_utc"
      - "on execution: engagement CONFIRMED -> CONTRACTED, commission_pct_snapshot pinned from speaker.default_commission_pct, provisional_commission_cents written, recording_rights / recording_fee_cents / technical_rider_code copied onto the engagement, proposal ACCEPTED -> CLOSED"
      - "on execution with exclusivity_days > 0: creates an ExclusivityGrant (status ACTIVE) for [event_end_utc, event_end_utc + exclusivity_days days) scoped to the client's industry_code"

  # --- Travel expenses -----------------------------------------------------
  - method: GET
    path: "/travel-expenses"
    description: "List travel expense submissions; filterable by engagement and status"
    roles: [BureauAdmin, BookingAgent, Speaker]
    code: 200
    input: ["engagement_id?", "status?", "limit?", "offset?"]
    output: TravelExpense[]
    side_effects: []

  - method: GET
    path: "/travel-expenses/{expenseId}"
    description: "Read one travel expense including its computed reimbursable_cents"
    roles: [BureauAdmin, BookingAgent, Speaker]
    code: 200
    input: []
    output: TravelExpense
    side_effects: []

  - method: POST
    path: "/travel-expenses/{expenseId}/approve"
    description: "Approve a travel receipt; runs travel_reimbursable under the contract's travel policy"
    roles: [BookingAgent]
    code: 200
    input: []
    output: TravelExpense
    side_effects:
      - "SUBMITTED -> APPROVED with reimbursable_cents written"
      - "increments engagement.travel_reimbursable_cents by reimbursable_cents"

  - method: POST
    path: "/travel-expenses/{expenseId}/reject"
    description: "Reject a travel receipt; nothing is added to the engagement's reimbursable total"
    roles: [BookingAgent]
    code: 200
    input: ["rejection_reason?"]
    output: TravelExpense
    side_effects:
      - "SUBMITTED -> REJECTED; reimbursable_cents stays null"

  # --- Feedback ------------------------------------------------------------
  - method: GET
    path: "/feedback"
    description: "List engagement feedback; filterable by engagement"
    roles: [BureauAdmin, BookingAgent, Speaker, Client]
    code: 200
    input: ["engagement_id?", "limit?", "offset?"]
    output: Feedback[]
    side_effects: []

  - method: GET
    path: "/feedback/{feedbackId}"
    description: "Read one immutable feedback record including its composite_score"
    roles: [BureauAdmin, BookingAgent, Speaker, Client]
    code: 200
    input: []
    output: Feedback
    side_effects: []

  # --- Invoices and collection --------------------------------------------
  - method: GET
    path: "/invoices"
    description: "List invoices; filterable by engagement, client, kind and status"
    roles: [BureauAdmin, BookingAgent, Client]
    code: 200
    input: ["engagement_id?", "client_id?", "kind?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []

  - method: GET
    path: "/invoices/{invoiceId}"
    description: "Read one invoice including its per-line amounts and surcharge_cents"
    roles: [BureauAdmin, BookingAgent, Client]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: POST
    path: "/invoices/{invoiceId}/payments"
    description: "Record a client payment against an issued invoice; full settlement approves the speaker remittance"
    roles: [Client, BureauAdmin]
    code: 200
    input: ["amount_cents", "method?"]
    output: Invoice
    side_effects:
      - "increments amount_paid_cents by amount_cents and decrements client.outstanding_balance_cents by amount_cents"
      - "partial payment: ISSUED -> PARTIALLY_PAID and engagement.settlement_status INVOICED -> PARTIALLY_COLLECTED"
      - "final payment: -> PAID, engagement.settlement_status -> COLLECTED, and the engagement's Remittance PENDING -> APPROVED"

  - method: POST
    path: "/invoices/{invoiceId}/void"
    description: "Void an unpaid issued invoice; compensates every ledger effect of issuance"
    roles: [BureauAdmin]
    code: 200
    input: ["void_reason?"]
    output: Invoice
    side_effects:
      - "ISSUED -> VOID"
      - "decrements client.outstanding_balance_cents by (amount_due_cents - amount_paid_cents)"
      - "engagement.settlement_status INVOICED -> WRITTEN_OFF"
      - "the engagement's Remittance PENDING -> VOIDED and speaker.pending_remittance_cents decreases by its net_payable_cents"

  # --- Remittances ---------------------------------------------------------
  - method: GET
    path: "/remittances"
    description: "List speaker remittances; filterable by engagement, speaker and status"
    roles: [BureauAdmin, BookingAgent, Speaker]
    code: 200
    input: ["engagement_id?", "speaker_id?", "status?", "limit?", "offset?"]
    output: Remittance[]
    side_effects: []

  - method: GET
    path: "/remittances/{remittanceId}"
    description: "Read one remittance including gross fee, withheld commission and travel pass-through"
    roles: [BureauAdmin, BookingAgent, Speaker]
    code: 200
    input: []
    output: Remittance
    side_effects: []

  - method: POST
    path: "/remittances/{remittanceId}/pay"
    description: "Pay out an approved remittance; requires the speaker's tax paperwork on file"
    roles: [BureauAdmin]
    code: 200
    input: ["payment_reference?"]
    output: Remittance
    side_effects:
      - "APPROVED -> PAID with paid_at_utc stamped"
      - "decrements speaker.pending_remittance_cents by net_payable_cents"
      - "engagement.settlement_status COLLECTED -> REMITTED"
      - "every APPROVED TravelExpense of the engagement moves to REIMBURSED"

  # --- Exclusivity ---------------------------------------------------------
  - method: GET
    path: "/exclusivity-grants"
    description: "List exclusivity grants; filterable by speaker, beneficiary client, source engagement, industry and status"
    roles: [BureauAdmin, BookingAgent, Speaker, Client]
    code: 200
    input: ["speaker_id?", "beneficiary_client_id?", "source_engagement_id?", "industry_code?", "status?", "limit?", "offset?"]
    output: ExclusivityGrant[]
    side_effects: []

  - method: GET
    path: "/exclusivity-grants/{grantId}"
    description: "Read one exclusivity grant including its half-open effective window"
    roles: [BureauAdmin, BookingAgent, Speaker, Client]
    code: 200
    input: []
    output: ExclusivityGrant
    side_effects: []

  - method: POST
    path: "/exclusivity-grants/{grantId}/waive"
    description: "Waive an active exclusivity grant so the speaker can be confirmed for a competing client"
    roles: [BureauAdmin]
    code: 200
    input: ["waiver_reason?"]
    output: ExclusivityGrant
    side_effects:
      - "ACTIVE -> WAIVED; the grant stops restricting confirmations"

  # --- Non-circumvention ---------------------------------------------------
  - method: POST
    path: "/circumvention-claims"
    description: "Open a commission-protection claim after a client rebooks a speaker directly"
    roles: [BureauAdmin, BookingAgent]
    code: 201
    input: [client_id, speaker_id, source_engagement_id, direct_event_date_utc, direct_fee_cents]
    output: CircumventionClaim
    side_effects:
      - "computes days_after_source, protection_factor and commission_due_cents via circumvention_commission_due"
      - "status starts at OPEN and settled_cents starts null"

  - method: GET
    path: "/circumvention-claims"
    description: "List commission-protection claims; filterable by client, speaker, source engagement and status"
    roles: [BureauAdmin, BookingAgent]
    code: 200
    input: ["client_id?", "speaker_id?", "source_engagement_id?", "status?", "limit?", "offset?"]
    output: CircumventionClaim[]
    side_effects: []

  - method: GET
    path: "/circumvention-claims/{claimId}"
    description: "Read one commission-protection claim including protection_factor and commission_due_cents"
    roles: [BureauAdmin, BookingAgent]
    code: 200
    input: []
    output: CircumventionClaim
    side_effects: []

  - method: POST
    path: "/circumvention-claims/{claimId}/resolve"
    description: "Uphold, dismiss or settle a commission-protection claim; upholding drives the credit-hold cascade"
    roles: [BureauAdmin]
    code: 200
    input: ["outcome", "settled_cents?", "resolution_note?"]
    output: CircumventionClaim
    side_effects:
      - "outcome UPHOLD: OPEN -> UPHELD, increments client.circumvention_strikes by 1; on reaching 2 strikes client.credit_status becomes HOLD and every QUALIFIED Inquiry of that client moves to BLOCKED"
      - "outcome DISMISS: OPEN -> DISMISSED with no strike"
      - "outcome SETTLE: UPHELD -> SETTLED writing settled_cents; no further strike"

  # --- Test-driving surface ------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and never falls back to wall-clock time. Every lead-time, expiry, cancellation-ladder, protection-window and exclusivity-window rule reads this clock."
    roles: [BureauAdmin, BookingAgent, Speaker, Client]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "sets now_utc for every subsequent request; no stored row is modified"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================

errors:

  # --- Authentication / authorization --------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing, or X-User-Role is not one of the four declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the caller's role is not listed in the target endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity-backed caller acts on a resource that does not resolve to their own id, or a BookingAgent acts on an engagement/proposal/travel expense they do not own"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the engagement's owning_agent_user_id attempts to post a commission adjustment on that same engagement"

  # --- Request shape -------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "malformed body, missing required field, undeclared enum member, negative money value, out-of-range score or rank, or settled_cents greater than the claim's commission_due_cents"
  - id: ERR_EVENT_WINDOW_INVALID
    http: 422
    condition: "event_end_utc is not strictly after event_start_utc on inquiry creation"
  - id: ERR_RECORDING_FEE_NOT_ALLOWED
    http: 422
    condition: "recording_rights == NONE but a positive recording_fee_cents was supplied on contract drafting"
  - id: ERR_RECORDING_FEE_REQUIRED
    http: 422
    condition: "recording_rights is AUDIO_ONLY or FULL_BUY_OUT but recording_fee_cents is absent or 0"
  - id: ERR_COMMISSION_PCT_OUT_OF_RANGE
    http: 422
    condition: "new_commission_pct on a commission adjustment lies outside [0.10, 0.35]"

  # --- Existence -----------------------------------------------------------
  - id: ERR_SPEAKER_NOT_FOUND
    http: 404
    condition: "no Speaker matches the path or body speaker_id"
  - id: ERR_CLIENT_NOT_FOUND
    http: 404
    condition: "no Client matches the path or body client_id"
  - id: ERR_INQUIRY_NOT_FOUND
    http: 404
    condition: "no Inquiry matches the path inquiryId"
  - id: ERR_PROPOSAL_NOT_FOUND
    http: 404
    condition: "no Proposal matches the path proposalId or body proposal_id"
  - id: ERR_OPTION_NOT_FOUND
    http: 404
    condition: "no ProposalOption matches the path optionId or body option_id"
  - id: ERR_ENGAGEMENT_NOT_FOUND
    http: 404
    condition: "no Engagement matches the path engagementId or body source_engagement_id"
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "no Contract matches the path contractId"
  - id: ERR_HOLD_NOT_FOUND
    http: 404
    condition: "no SpeakerHold matches the path holdId"
  - id: ERR_TRAVEL_EXPENSE_NOT_FOUND
    http: 404
    condition: "no TravelExpense matches the path expenseId"
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "no Invoice matches the path invoiceId"
  - id: ERR_REMITTANCE_NOT_FOUND
    http: 404
    condition: "no Remittance matches the path remittanceId"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "no CircumventionClaim matches the path claimId"
  - id: ERR_GRANT_NOT_FOUND
    http: 404
    condition: "no ExclusivityGrant matches the path grantId"
  - id: ERR_FEEDBACK_NOT_FOUND
    http: 404
    condition: "no Feedback matches the path feedbackId"

  # --- Optimistic concurrency ---------------------------------------------
  - id: ERR_STALE_INQUIRY_VERSION
    http: 412
    condition: "expected_inquiry_version does not equal the inquiry's current version on proposal creation (§1.2.1 proposal-create-stale-inquiry)"
  - id: ERR_STALE_ENGAGEMENT_VERSION
    http: 412
    condition: "expected_engagement_version does not equal the engagement's current version on commission adjustment (§1.2.1 commission-adjust-stale-engagement)"

  # --- Lifecycle state ----------------------------------------------------
  - id: ERR_INQUIRY_STATE_INVALID
    http: 409
    condition: "the inquiry's status does not declare the requested transition — qualifying a non-RECEIVED inquiry, or opening a proposal round on an inquiry that is not QUALIFIED or PROPOSED"
  - id: ERR_PROPOSAL_STATE_INVALID
    http: 409
    condition: "the proposal's status does not declare the requested transition — presenting an ACCEPTED/SUPERSEDED/DECLINED/CLOSED proposal, adding an option to a proposal that is not DRAFT or REVISION_REQUESTED, or requesting a revision / declining / selecting on a proposal that is not PRESENTED"
  - id: ERR_ENGAGEMENT_STATE_INVALID
    http: 409
    condition: "the engagement's booking_status does not declare the requested transition — confirming or declining a non-OFFERED engagement, drafting a contract for a non-CONFIRMED engagement, delivering a non-CONTRACTED engagement, submitting a travel expense outside CONFIRMED/CONTRACTED, adjusting commission outside CONTRACTED, or filing feedback on a non-DELIVERED engagement"
  - id: ERR_ENGAGEMENT_ALREADY_TERMINAL
    http: 409
    condition: "cancel or deliver targets an engagement already in DELIVERED, DECLINED_BY_SPEAKER, CANCELLED_BY_CLIENT or CANCELLED_BY_SPEAKER"
  - id: ERR_CONTRACT_STATE_INVALID
    http: 409
    condition: "sending a non-DRAFT contract, or signing a contract that is not SENT or PARTIALLY_SIGNED"
  - id: ERR_PARTY_ALREADY_SIGNED
    http: 409
    condition: "the signing party's own signature stamp is already set on this contract"
  - id: ERR_TRAVEL_EXPENSE_STATE_INVALID
    http: 409
    condition: "approving or rejecting a travel expense that is not SUBMITTED, or approving one whose engagement is no longer settlement_status UNBILLED"
  - id: ERR_INVOICE_NOT_PAYABLE
    http: 409
    condition: "a payment or void targets an invoice that is PAID or VOID, or a void targets an invoice already PARTIALLY_PAID"
  - id: ERR_REMITTANCE_NOT_APPROVED
    http: 409
    condition: "a payout targets a remittance whose status is not APPROVED"
  - id: ERR_CLAIM_NOT_OPEN
    http: 409
    condition: "UPHOLD or DISMISS targets a claim that is not OPEN, or SETTLE targets a claim that is not UPHELD"
  - id: ERR_GRANT_NOT_ACTIVE
    http: 409
    condition: "waiving an exclusivity grant whose status is already EXPIRED or WAIVED"
  - id: ERR_FEEDBACK_ALREADY_SUBMITTED
    http: 409
    condition: "a Feedback row already exists for this engagement"

  # --- Referential integrity ----------------------------------------------
  - id: ERR_OPTION_NOT_IN_PROPOSAL
    http: 409
    condition: "the option_id supplied to select belongs to a different proposal than the one in the path"

  # --- Compliance and counterparty posture --------------------------------
  - id: ERR_CLIENT_CREDIT_HOLD
    http: 409
    condition: "the client's credit_status is HOLD when qualifying an inquiry, selecting an option or signing the client leg"
  - id: ERR_SPEAKER_NOT_ACTIVE
    http: 409
    condition: "the speaker's roster_status is not ACTIVE when being quoted on an option, confirming an engagement or signing the speaker leg"
  - id: ERR_TOPIC_NOT_IN_ROSTER
    http: 409
    condition: "the inquiry's required_topic is absent from the quoted speaker's topics array"
  - id: ERR_CONTRACT_NOT_EXECUTED
    http: 409
    condition: "a travel expense approval is attempted while the engagement's contract is not yet EXECUTED"
  - id: ERR_SPEAKER_TAX_FORM_MISSING
    http: 409
    condition: "a remittance payout is attempted while the speaker's tax_form_status is MISSING"
  - id: ERR_EXCLUSIVITY_CONFLICT
    http: 409
    condition: "an ACTIVE exclusivity grant for the same speaker and industry_code, held by a different client, covers the engagement's event_start_utc within [effective_from_utc, effective_to_utc)"

  # --- Calendar and clock -------------------------------------------------
  - id: ERR_SPEAKER_CALENDAR_CONFLICT
    http: 409
    condition: "an ACTIVE SpeakerHold intersects the buffered closed interval of the engagement being confirmed, or intersects a manually posted blackout window"
  - id: ERR_INSUFFICIENT_LEAD_TIME
    http: 409
    condition: "floor((event_start_utc - now_utc) / 86400) is below 21 whole days at qualification"
  - id: ERR_PROPOSAL_EXPIRED
    http: 409
    condition: "now_utc is at or after proposal.valid_until_utc when presenting, requesting a revision or selecting"
  - id: ERR_EVENT_NOT_ENDED
    http: 409
    condition: "now_utc is before engagement.event_end_utc when delivering or filing feedback"
  - id: ERR_OUTSIDE_PROTECTION_WINDOW
    http: 409
    condition: "days_after_source exceeds 365 on circumvention claim creation"

  # --- Structural constraints ---------------------------------------------
  - id: ERR_PROPOSAL_NO_OPTIONS
    http: 409
    condition: "presenting a proposal whose options_count is 0"
  - id: ERR_OPTION_LIMIT_REACHED
    http: 409
    condition: "adding a fifth speaker option to a proposal that already carries 4"
  - id: ERR_DUPLICATE_SPEAKER_OPTION
    http: 409
    condition: "a sibling option on the same proposal already quotes this speaker_id"
  - id: ERR_DUPLICATE_RANK
    http: 409
    condition: "a sibling option on the same proposal already uses this rank_no"
  - id: ERR_REVISION_LIMIT_REACHED
    http: 409
    condition: "requesting a revision when proposal.revision_count already equals 2"
  - id: ERR_DUPLICATE_CLAIM
    http: 409
    condition: "an OPEN or UPHELD claim already exists for the same (client_id, speaker_id, source_engagement_id) triple"

  # --- Money --------------------------------------------------------------
  - id: ERR_BUDGET_BELOW_FLOOR
    http: 409
    condition: "the inquiry's budget_cents is below the 250000-cent engagement floor at qualification"
  - id: ERR_FEE_OUTSIDE_SPEAKER_RANGE
    http: 409
    condition: "quoted_fee_cents falls outside [fee_floor_cents, fee_ceiling_cents] for the quoted speaker"
  - id: ERR_QUOTE_EXCEEDS_BUDGET
    http: 409
    condition: "quoted_fee_cents + travel_allowance_cents exceeds round_half_up(inquiry.budget_cents * 1.20)"
  - id: ERR_OVERPAYMENT
    http: 409
    condition: "amount_cents is not positive, or exceeds invoice.amount_due_cents - invoice.amount_paid_cents"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================

roles:

  - name: BureauAdmin
    description: "Bureau back office: roster maintenance, credit posture, money movement, exclusivity waivers and non-circumvention adjudication"
    identity: "opaque"
    exclusive_operations:
      - "POST /speakers"
      - "PATCH /speakers/{speakerId}"
      - "POST /clients"
      - "PATCH /clients/{clientId}"
      - "POST /invoices/{invoiceId}/void"
      - "POST /remittances/{remittanceId}/pay"
      - "POST /exclusivity-grants/{grantId}/waive"
      - "POST /circumvention-claims/{claimId}/resolve"
    shared_operations:
      - "POST /inquiries (with BookingAgent)"
      - "POST /speaker-holds (with BookingAgent)"
      - "POST /circumvention-claims (with BookingAgent)"
      - "POST /engagements/{engagementId}/cancel (with Client and Speaker; must supply on_behalf_of)"
      - "POST /invoices/{invoiceId}/payments (with Client)"
      - "POST /engagements/{engagementId}/commission-adjustments (with BookingAgent, subject to segregation of duties)"
      - "all GET reads except the Client-scoped and Speaker-scoped ownership filters"

  - name: BookingAgent
    description: "Deal desk: qualifies inquiries, assembles quotation packages, drafts agreements, runs logistics and delivery"
    identity: "opaque"
    exclusive_operations:
      - "POST /inquiries/{inquiryId}/qualify"
      - "POST /inquiries/{inquiryId}/proposals"
      - "POST /proposal-options"
      - "POST /proposals/{proposalId}/present"
      - "POST /engagements/{engagementId}/contracts"
      - "POST /contracts/{contractId}/send"
      - "POST /travel-expenses/{expenseId}/approve"
      - "POST /travel-expenses/{expenseId}/reject"
      - "POST /engagements/{engagementId}/deliver"
    shared_operations:
      - "POST /inquiries (with BureauAdmin)"
      - "POST /speaker-holds (with BureauAdmin)"
      - "POST /circumvention-claims (with BureauAdmin)"
      - "POST /engagements/{engagementId}/travel-expenses (with Speaker)"
      - "POST /engagements/{engagementId}/commission-adjustments (with BureauAdmin, but never on an engagement the caller owns)"
      - "GET reads across speakers, clients, inquiries, proposals, options, engagements, contracts, holds, expenses, invoices, remittances, grants and claims"

  - name: Speaker
    description: "Rostered speaker acting on their own bookings: confirm or decline, sign the speaker leg, submit travel receipts, cancel their own engagement"
    identity: "entity_backed:Speaker"
    exclusive_operations:
      - "POST /engagements/{engagementId}/confirm"
      - "POST /engagements/{engagementId}/decline"
    shared_operations:
      - "POST /contracts/{contractId}/sign (speaker leg; the Client signs the other leg)"
      - "POST /engagements/{engagementId}/travel-expenses (with BookingAgent)"
      - "POST /engagements/{engagementId}/cancel (with Client and BureauAdmin)"
      - "GET reads scoped to their own speaker id: own speaker record, own performance, own holds, own engagements, own contracts, own travel expenses, own remittances, own feedback"

  - name: Client
    description: "Booking client organisation: negotiates the quotation package, selects a speaker, signs the client leg, pays invoices and files feedback"
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /proposals/{proposalId}/request-revision"
