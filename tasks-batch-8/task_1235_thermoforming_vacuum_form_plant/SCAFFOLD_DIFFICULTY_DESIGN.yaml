  # -------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: disposition_pass_at_exact_min_wall_boundary
        grounds:
          - calculations.wall_thickness_distribution
          - state_machines.QualityInspection.RECORDED_to_DISPOSITIONED
          - errors[ERR_DISPOSITION_CONTRADICTS_MEASUREMENT]
        distinguishing_aspect: |
          Boundary on the wall-thickness metric (mm) via the disposition
          endpoint: min_wall_mm exactly == spec_min_wall_mm (1.230 == 1.230)
          satisfies the >= rule, so PASS is accepted while SCRAP on the same
          readings is rejected as contradictory.
        test_recipe:
          setup:
            - "RUNNING INDUSTRIAL order (spec_nominal 1.300, spec_min 1.230) with one COMPLETED run (10 shots); booth free"
          setup_api_calls:
            - { call: "POST /material-lots", payload: { lot_code: "LB1", resin_type: PETG, gauge_mm: 1.500, cleanliness_grade_required: INDUSTRIAL, quantity_kg: 10.000, unit_cost_per_kg: 10.00 }, as: MaterialsPlanner, captures: { lot_id: $.data.id } }
            - { call: "POST /cleanliness-certificates", payload: { subject_type: MATERIAL_LOT, subject_id: "${lot_id}", grade: INDUSTRIAL, issued_at: "2026-04-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", cert_body: "LabA" }, as: QualityInspector }
            - { call: "POST /tools", payload: { tool_code: "TB1", part_number: "P-B1", tool_type: FORM_MOLD, min_gauge_mm: 1.000, max_gauge_mm: 3.000, cleanliness_grade: INDUSTRIAL, prototype_cost: 1200.00 }, as: ToolingEngineer, captures: { tool_id: $.data.id } }
            - { call: "POST /tools/${tool_id}/complete-prototype", as: ToolingEngineer }
            - { call: "POST /tools/${tool_id}/submit-qualification", as: ToolingEngineer }
            - { call: "POST /cleanliness-certificates", payload: { subject_type: TOOL, subject_id: "${tool_id}", grade: INDUSTRIAL, issued_at: "2026-04-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", cert_body: "LabA" }, as: QualityInspector }
            - { call: "POST /tools/${tool_id}/approve-production", payload: { production_cost: 8000.00, rated_lifetime_shots: 80000 }, as: ToolingEngineer }
            - { call: "POST /packaging-specs", payload: { spec_code: "S-B1", spec_type: STOCK, cleanliness_grade: INDUSTRIAL, per_pack_cost: 0.30 }, as: PackagingEngineer, captures: { spec_id: $.data.id } }
            - { call: "POST /machine-resources", payload: { resource_code: "ST-B1", resource_type: FORMING_STATION, cleanliness_grade: INDUSTRIAL, machine_rate_per_hour: 55.00 }, as: ProductionScheduler, captures: { station_id: $.data.id } }
            - { call: "POST /machine-resources", payload: { resource_code: "B-B1", resource_type: INSPECTION_BOOTH, cleanliness_grade: INDUSTRIAL, machine_rate_per_hour: 25.00 }, as: ProductionScheduler, captures: { booth_id: $.data.id } }
            - { call: "POST /production-orders", payload: { order_code: "OB1", part_number: "P-B1", resin_type: PETG, ordered_qty: 100, required_gauge_mm: 1.500, cleanliness_grade: INDUSTRIAL, spec_nominal_wall_mm: 1.300, spec_min_wall_mm: 1.230, nominal_part_weight_kg: 0.050, std_cycle_time_s: 30, std_machine_rate_per_hour: 55.00, tool_id: "${tool_id}", packaging_spec_id: "${spec_id}", is_prototype_order: false }, as: ProductionScheduler, captures: { order_id: $.data.id } }
            - { call: "POST /material-allocations", payload: { production_order_id: "${order_id}", source_type: VIRGIN_LOT, lot_id: "${lot_id}", qty_kg: 5.900 }, as: ProductionScheduler }
            - { call: "GET /production-orders/${order_id}", as: Any, captures: { o_ver: $.data.version } }
            - { call: "POST /production-orders/${order_id}/stage", payload: { expected_production_order_version: "${o_ver}" }, as: ProductionScheduler }
            - { call: "POST /forming-runs", payload: { production_order_id: "${order_id}", station_id: "${station_id}", planned_start: "2026-05-02T10:00:00Z", planned_end: "2026-05-02T10:30:00Z", oven_temp_c: 175.0, cycle_time_s: 30, shots_planned: 10 }, as: ProductionScheduler, captures: { run_id: $.data.id } }
            - { call: "POST /forming-runs/${run_id}/complete", payload: { shots_completed: 10, scrap_weight_kg: 0.000, actual_end: "2026-05-02T10:30:00Z" }, as: ProductionScheduler }
            - { call: "POST /quality-inspections", payload: { production_order_id: "${order_id}", forming_run_id: "${run_id}", booth_id: "${booth_id}", inspection_type: FIRST_ARTICLE, scheduled_start: "2026-05-02T13:00:00Z", scheduled_end: "2026-05-02T13:30:00Z", wall_measurements_mm: [1.2300, 1.2500] }, as: QualityInspector, as_user_id: qi-1, captures: { insp_pass: $.data.id, min_w: $.data.min_wall_mm } }
            - { call: "POST /quality-inspections", payload: { production_order_id: "${order_id}", forming_run_id: "${run_id}", booth_id: "${booth_id}", inspection_type: FIRST_ARTICLE, scheduled_start: "2026-05-02T14:00:00Z", scheduled_end: "2026-05-02T14:30:00Z", wall_measurements_mm: [1.2300, 1.2500] }, as: QualityInspector, as_user_id: qi-1, captures: { insp_scrap: $.data.id } }
          trigger:
            - { call: "POST /quality-inspections/${insp_pass}/disposition", payload: { disposition: PASS }, as: QualityInspector, as_user_id: qi-2, captures: { pass_st: $.data.status } }
            - { call: "POST /quality-inspections/${insp_scrap}/disposition", payload: { disposition: SCRAP, scrapped_qty: 5 }, as: QualityInspector, as_user_id: qi-2, captures: { err: $.data.error_id } }
          assert:
            - "min_wall_mm == 1.230 exactly equals spec_min_wall_mm 1.230 (captured ${min_w})"
            - "PASS disposition accepted: status == DISPOSITIONED (captured ${pass_st}) — >= boundary inclusive"
            - "SCRAP disposition on identical readings rejected: error == ERR_DISPOSITION_CONTRADICTS_MEASUREMENT (captured ${err})"
      - name: regrind_blend_at_exact_cap_boundary
        grounds:
          - calculations.regrind_blend_plan
          - errors[ERR_BLEND_CAP_EXCEEDED]
          - endpoints: "POST /material-allocations"
        distinguishing_aspect: |
          Boundary on the regrind mass metric (kg) via POST /material-allocations
          (distinct metric and endpoint from the wall-thickness boundary):
          INDUSTRIAL cap = round(5.900 x 0.40, 3) = 2.360kg; an allocation of
          exactly 2.360 is accepted (<= inclusive) while +0.001 is rejected.
        test_recipe:
          setup:
            - "Donor INDUSTRIAL order generated 2.500kg scrap; batch RB-2 (PETG, source INDUSTRIAL, target 2.000) accumulated 2.500 and decided CERTIFIED/INDUSTRIAL by second planner"
            - "Target INDUSTRIAL order O-CAP qty 100 (required 5.900) QUEUED"
          setup_api_calls:
            - { call: "POST /material-lots", payload: { lot_code: "LD2", resin_type: PETG, gauge_mm: 1.500, cleanliness_grade_required: INDUSTRIAL, quantity_kg: 10.000, unit_cost_per_kg: 10.00 }, as: MaterialsPlanner, captures: { lot_d: $.data.id } }
            - { call: "POST /cleanliness-certificates", payload: { subject_type: MATERIAL_LOT, subject_id: "${lot_d}", grade: INDUSTRIAL, issued_at: "2026-04-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", cert_body: "LabA" }, as: QualityInspector }
            - { call: "POST /tools", payload: { tool_code: "TD2", part_number: "P-D2", tool_type: FORM_MOLD, min_gauge_mm: 1.000, max_gauge_mm: 3.000, cleanliness_grade: INDUSTRIAL, prototype_cost: 1200.00 }, as: ToolingEngineer, captures: { tool_d: $.data.id } }
            - { call: "POST /tools/${tool_d}/complete-prototype", as: ToolingEngineer }
            - { call: "POST /tools/${tool_d}/submit-qualification", as: ToolingEngineer }
            - { call: "POST /cleanliness-certificates", payload: { subject_type: TOOL, subject_id: "${tool_d}", grade: INDUSTRIAL, issued_at: "2026-04-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", cert_body: "LabA" }, as: QualityInspector }
            - { call: "POST /tools/${tool_d}/approve-production", payload: { production_cost: 8000.00, rated_lifetime_shots: 80000 }, as: ToolingEngineer }
            - { call: "POST /packaging-specs", payload: { spec_code: "S-D2", spec_type: STOCK, cleanliness_grade: INDUSTRIAL, per_pack_cost: 0.30 }, as: PackagingEngineer, captures: { spec_d: $.data.id } }
            - { call: "POST /machine-resources", payload: { resource_code: "ST-D2", resource_type: FORMING_STATION, cleanliness_grade: INDUSTRIAL, machine_rate_per_hour: 55.00 }, as: ProductionScheduler, captures: { st_d: $.data.id } }
            - { call: "POST /production-orders", payload: { order_code: "OD2", part_number: "P-D2", resin_type: PETG, ordered_qty: 100, required_gauge_mm: 1.500, cleanliness_grade: INDUSTRIAL, spec_nominal_wall_mm: 1.300, spec_min_wall_mm: 1.230, nominal_part_weight_kg: 0.050, std_cycle_time_s: 30, std_machine_rate_per_hour: 55.00, tool_id: "${tool_d}", packaging_spec_id: "${spec_d}", is_prototype_order: false }, as: ProductionScheduler, captures: { ord_d: $.data.id } }
            - { call: "POST /material-allocations", payload: { production_order_id: "${ord_d}", source_type: VIRGIN_LOT, lot_id: "${lot_d}", qty_kg: 5.900 }, as: ProductionScheduler }
            - { call: "GET /production-orders/${ord_d}", as: Any, captures: { od_ver: $.data.version } }
            - { call: "POST /production-orders/${ord_d}/stage", payload: { expected_production_order_version: "${od_ver}" }, as: ProductionScheduler }
            - { call: "POST /forming-runs", payload: { production_order_id: "${ord_d}", station_id: "${st_d}", planned_start: "2026-05-02T10:00:00Z", planned_end: "2026-05-02T11:00:00Z", oven_temp_c: 180.0, cycle_time_s: 30, shots_planned: 100 }, as: ProductionScheduler, captures: { run_d: $.data.id } }
            - { call: "POST /forming-runs/${run_d}/complete", payload: { shots_completed: 100, scrap_weight_kg: 2.500, actual_end: "2026-05-02T11:00:00Z" }, as: ProductionScheduler }
            - { call: "GET /scrap-records", payload: { forming_run_id: "${run_d}" }, as: Any, captures: { scrap_id: "$.data[0].id" } }
            - { call: "POST /regrind-batches", payload: { batch_code: "RB-2", resin_type: PETG, source_grade: INDUSTRIAL, target_kg: 2.000 }, as: MaterialsPlanner, as_user_id: planner-1, captures: { rb_id: $.data.id } }
            - { call: "POST /scrap-records/${scrap_id}/certify", payload: { regrind_batch_id: "${rb_id}", decision: CERTIFY }, as: MaterialsPlanner }
            - { call: "POST /regrind-batches/${rb_id}/decide", payload: { decision: CERTIFIED, certified_grade: INDUSTRIAL }, as: MaterialsPlanner, as_user_id: planner-2 }
            - { call: "POST /production-orders", payload: { order_code: "OCAP", part_number: "P-D2", resin_type: PETG, ordered_qty: 100, required_gauge_mm: 1.500, cleanliness_grade: INDUSTRIAL, spec_nominal_wall_mm: 1.300, spec_min_wall_mm: 1.230, nominal_part_weight_kg: 0.050, std_cycle_time_s: 30, std_machine_rate_per_hour: 55.00, tool_id: "${tool_d}", packaging_spec_id: "${spec_d}", is_prototype_order: false }, as: ProductionScheduler, captures: { ord_cap: $.data.id } }
          trigger:
            - { call: "POST /material-allocations", payload: { production_order_id: "${ord_cap}", source_type: REGRIND, regrind_batch_id: "${rb_id}", qty_kg: 2.360 }, as: ProductionScheduler, captures: { alloc_ok: $.data.id } }
            - { call: "POST /material-allocations", payload: { production_order_id: "${ord_cap}", source_type: REGRIND, regrind_batch_id: "${rb_id}", qty_kg: 0.001 }, as: ProductionScheduler, captures: { err: $.data.error_id } }
          assert:
            - "Exactly-at-cap allocation 2.360kg accepted (id ${alloc_ok}) — <= boundary inclusive"
            - "+0.001kg rejected: error == ERR_BLEND_CAP_EXCEEDED (captured ${err}); 2.361 > 2.360"
  # -------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: stage_blocked_when_tool_under_revision
        grounds:
          - state_machines.ProductionOrder(schedule_status).QUEUED_to_STAGED
          - state_machines.Tool.PRODUCTION_to_UNDER_REVISION
          - errors[ERR_TOOL_NOT_QUALIFIED]
        distinguishing_aspect: |
          Entity pair ProductionOrder -> Tool: staging an order whose tool has
          moved PRODUCTION -> UNDER_REVISION after order creation is rejected
          with ERR_TOOL_NOT_QUALIFIED even though the order itself is in a
          legal from-state (QUEUED) with full material coverage and a fresh OCC
          version.
        test_recipe:
          setup:
            - "Tool T-RV at PRODUCTION; order O-RV QUEUED with 5.900kg RESERVED (version 2); tool then revised to UNDER_REVISION"
          setup_api_calls:
            - { call: "POST /material-lots", payload: { lot_code: "LRV", resin_type: PETG, gauge_mm: 1.500, cleanliness_grade_required: INDUSTRIAL, quantity_kg: 10.000, unit_cost_per_kg: 10.00 }, as: MaterialsPlanner, captures: { lot_id: $.data.id } }
