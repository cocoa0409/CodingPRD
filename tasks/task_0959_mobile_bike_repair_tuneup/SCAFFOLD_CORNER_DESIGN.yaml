          assert:
            - "error_id == ERR_SUBSCRIPTION_INACTIVE (409)"

      - name: duplicate_active_subscription_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=19]", "errors[ERR_SUBSCRIPTION_ACTIVE_EXISTS]"]
        distinguishing_aspect: "At most one non-CANCELLED subscription per customer: second creation fails with ERR_SUBSCRIPTION_ACTIVE_EXISTS (409)."
