# =============================================================================
# SCAFFOLD — task_1157 Water Meter Replacement Capital Program (AMI deployment)
# §1.0–§1.7. Difficulty design and corner design live in sibling files.
# =============================================================================

scenario: |
  generate task hard than expert level! 1157. Water Meter Replacement Capital Program (water utility AMI deployment): meter population aging & replacement wave planning, appointment scheduling & inside-meter access, serial swap & final/initial read reconciliation, high-bill complaint after change-out & bench test, contractor production & quality audit, AMI endpoint registration & communication verification, customer notification & no-access escalation, program budget & completion reporting

domain_name: water-meter-replacement-program
api_prefix: /api

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic   # WorkOrder access-fail/rework loops + parallel hold dimension; invoice dispute loop; complaint bench loop
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties   # contractor performs; auditor verifies; CS adjudicates; PM pays
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; FKs on children)
# =============================================================================
entities:
  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program name" }
      - { name: fiscal_year, type: string, source: input, description: "Fiscal year label, e.g. FY2027" }
      - { name: budget_total_cents, type: integer, source: input, description: "Total capital budget, cents; > 0" }
      - { name: target_meter_count, type: integer, source: input, description: "Planned replacements; > 0" }
      - { name: rate_per_ccf_cents, type: integer, source: input, description: "Volumetric rate used for swap true-up, cents per CCF" }
      - { name: default_unit_allowance_cents, type: integer, source: input, description: "Planning allowance committed per work order at creation, cents" }
      - { name: notice_days, type: integer, source: input, default: 3, description: "Regulatory minimum days between notification delivery and appointment slot" }
      - { name: budget_committed_cents, type: integer, source: computed, default: 0, description: "Sum of committed_amount_cents over work orders with lifecycle_status NOT IN {CLOSED, CANCELLED}" }
      - { name: budget_spent_cents, type: integer, source: computed, default: 0, description: "Sum of net_amount_cents over ContractorInvoice with status = APPROVED" }
      - { name: budget_available_cents, type: integer, source: computed, description: "= budget_total_cents - budget_committed_cents - budget_spent_cents" }
      - { name: budget_posture, type: enum, source: computed, description: "FUNDED | TIGHT | OVERRUN — see calculation budget_position" }
      - { name: completed_meter_count, type: integer, source: computed, default: 0, description: "Count of WorkOrder with lifecycle_status = CLOSED" }
      - { name: status, type: enum, source: system, description: "PLANNING | ACTIVE | CLOSING | CLOSED" }

  - name: Contractor
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: name, type: string, source: input, description: "Contractor legal name" }
      - { name: crew_capacity_per_window, type: integer, source: input, description: "Max appointments per (slot_date, window) bucket; >= 1" }
      - { name: unit_price_cents, type: integer, source: input, description: "Negotiated price per completed change-out, cents" }
      - { name: quality_score_bp, type: integer, source: computed, default: 10000, description: "Quality score in basis points 0..10000; see calculation quality_score_recompute" }
      - { name: audits_failed_count, type: integer, source: computed, default: 0, description: "Count of QualityAudit with result_status = FAIL for this contractor" }
      - { name: installs_completed_count, type: integer, source: computed, default: 0, description: "Count of this contractor's work orders with lifecycle_status = CLOSED" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }

  - name: ServiceAccount
    parent: null
    common_fields: true
    fields:
      - { name: account_number, type: string, source: input, description: "Unique utility account number" }
      - { name: service_address, type: string, source: input, description: "Premise address" }
      - { name: meter_location, type: enum, source: input, description: "INSIDE | OUTSIDE — INSIDE meters require customer presence at the appointment" }
      - { name: customer_name, type: string, source: input, description: "Customer name" }
      - { name: customer_phone, type: string, source: input, description: "Customer phone" }
      - { name: priority_tier, type: enum, source: input, default: "STANDARD", description: "STANDARD | SENSITIVE | CRITICAL — CRITICAL accounts require a DELIVERED CERTIFIED_MAIL notification before appointment booking (ERR_CRITICAL_CHANNEL_REQUIRED) and only CERTIFIED_MAIL deliveries count for the notice window" }
      - { name: avg_daily_usage_ccf, type: number, source: input, description: "Historical average daily consumption in CCF; used by prorated true-up variant" }
      - { name: last_billed_read_value, type: integer, source: input, description: "Meter register value at last billing, CCF" }
      - { name: last_billed_read_at, type: datetime, source: input, description: "Timestamp of last billed read (ISO 8601 UTC)" }
      - { name: status, type: enum, source: system, description: "ELIGIBLE | IN_PROGRAM | REPLACED | EXEMPTED" }

  - name: Meter
    parent: null
    common_fields: true
    fields:
      - { name: serial_number, type: string, source: input, description: "Manufacturer serial; unique across all meters" }
      - { name: size_code, type: enum, source: input, description: "S_5_8 | S_3_4 | S_1 | S_1_5 | S_2" }
      - { name: technology, type: enum, source: input, description: "LEGACY | AMI" }
      - { name: service_account_id, type: string, source: system, description: "FK -> ServiceAccount.id; set while INSTALLED, null otherwise", constraints: "nullable" }
      - { name: installed_read_value, type: integer, source: system, description: "Register value recorded at installation", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "IN_STOCK | INSTALLED | REMOVED | BENCH_PASSED | BENCH_FAILED | DISPOSED | RETURNED_TO_VENDOR" }

  - name: Wave
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: wave_number, type: integer, source: input, description: "Sequence number within program; unique per program" }
      - { name: window_start, type: datetime, source: input, description: "Planning window start (ISO 8601 UTC), inclusive" }
      - { name: window_end, type: datetime, source: input, description: "Planning window end (ISO 8601 UTC), exclusive — half-open [window_start, window_end)" }
      - { name: capacity, type: integer, source: input, description: "Max non-cancelled work orders; >= 1" }
      - { name: committed_count, type: integer, source: computed, default: 0, description: "Count of work orders in wave with lifecycle_status NOT IN {CANCELLED}" }
      - { name: completed_count, type: integer, source: computed, default: 0, description: "Count of work orders in wave with lifecycle_status = CLOSED" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | LOCKED | COMPLETE | CANCELLED" }

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: wave_id, type: string, source: input, description: "FK -> Wave.id" }
      - { name: service_account_id, type: string, source: input, description: "FK -> ServiceAccount.id" }
      - { name: contractor_id, type: string, source: system, description: "FK -> Contractor.id; null until assign", constraints: "nullable" }
      - { name: old_meter_id, type: string, source: system, description: "FK -> Meter.id; the account's INSTALLED meter captured at creation" }
      - { name: new_meter_id, type: string, source: system, description: "FK -> Meter.id; null until swap", constraints: "nullable" }
      - { name: committed_amount_cents, type: integer, source: system, description: "Budget commitment: program.default_unit_allowance_cents at creation, repriced to contractor.unit_price_cents on assign, zeroed on CLOSED/CANCELLED" }
      - { name: provisional_trueup_cents, type: integer, source: computed, description: "Prorated-variant true-up booked at swap; see calculation swap_trueup", constraints: "nullable" }
      - { name: trueup_amount_cents, type: integer, source: computed, description: "Measured-variant true-up computed at reconcile", constraints: "nullable" }
      - { name: trueup_delta_cents, type: integer, source: computed, description: "= trueup_amount_cents - provisional_trueup_cents, booked at reconcile", constraints: "nullable" }
      - { name: no_access_strikes, type: integer, source: system, default: 0, description: "Count of NO_ACCESS appointments on this work order" }
      - { name: closed_at, type: datetime, source: system, description: "Clock timestamp when lifecycle_status became CLOSED", constraints: "nullable" }
      - { name: lifecycle_status, type: enum, source: system, description: "CREATED | NOTIFIED | SCHEDULED | ACCESS_FAILED | SWAPPED | RECONCILED | AMI_VERIFIED | QA_REVIEW | QA_FAILED | CLOSED | CANCELLED" }
      - { name: hold_status, type: enum, source: system, default: "CLEAR", description: "CLEAR | ON_HOLD — parallel dimension driven by HighBillComplaint lifecycle" }

  - name: CustomerNotification
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id" }
      - { name: no_access_case_id, type: string, source: system, description: "FK -> NoAccessCase.id; set when the notification was auto-created by an escalation stage", constraints: "nullable" }
      - { name: channel, type: enum, source: input, description: "USPS_MAIL | CERTIFIED_MAIL | DOOR_HANGER | PHONE | EMAIL" }
      - { name: sent_at, type: datetime, source: system, description: "Logical-clock timestamp at creation" }
      - { name: delivered_at, type: datetime, source: input, description: "Delivery timestamp supplied on confirm-delivery", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "SENT | DELIVERED | FAILED | RETURNED" }

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id" }
      - { name: contractor_id, type: string, source: system, description: "FK -> Contractor.id; copied from work order at booking" }
      - { name: slot_date, type: string, source: input, description: "Appointment date, YYYY-MM-DD" }
      - { name: window, type: enum, source: input, description: "AM | PM | EVE" }
      - { name: attempt_number, type: integer, source: system, description: "1 + count of prior non-SUPERSEDED appointments on the work order" }
      - { name: status, type: enum, source: system, description: "BOOKED | CONFIRMED | COMPLETED | NO_ACCESS | CANCELLED_BY_CUSTOMER | SUPERSEDED" }

  - name: NoAccessCase
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: system, description: "FK -> WorkOrder.id; at most one OPEN case per work order" }
      - { name: stage, type: enum, source: system, description: "STAGE_1_DOOR_HANGER | STAGE_2_CERTIFIED_MAIL | STAGE_3_PHONE_CAMPAIGN | STAGE_4_FIELD_VISIT" }
      - { name: strikes_at_open, type: integer, source: system, description: "Work order no_access_strikes at case creation" }
      - { name: status, type: enum, source: system, description: "OPEN | RESOLVED" }
      - { name: resolution, type: enum, source: system, description: "ACCESS_GAINED | ACCOUNT_EXEMPTED | FORCED_ENTRY; null while OPEN", constraints: "nullable" }

  - name: MeterReading
    parent: null
    common_fields: false   # append-only event: id + created_at only; no update endpoint
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id" }
      - { name: meter_id, type: string, source: input, description: "FK -> Meter.id" }
      - { name: read_type, type: enum, source: input, description: "FINAL | INITIAL | VERIFICATION | ESTIMATED" }
      - { name: value, type: integer, source: input, description: "Register value, CCF; >= 0" }
      - { name: source, type: enum, source: input, description: "FIELD_CREW | AMI_NETWORK | CUSTOMER | SYSTEM_ESTIMATE" }
      - { name: read_at, type: datetime, source: input, description: "When the read was taken (ISO 8601 UTC)" }

  - name: EndpointRegistration
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; at most one non-REPLACED registration per work order" }
      - { name: meter_id, type: string, source: system, description: "FK -> Meter.id; copied from work order new_meter_id" }
      - { name: endpoint_serial, type: string, source: input, description: "AMI endpoint serial; unique across all registrations" }
      - { name: registered_at, type: datetime, source: system, description: "Logical-clock timestamp of registration" }
      - { name: reads_received_count, type: integer, source: system, default: 0, description: "AMI reads ingested for this registration" }
      - { name: rssi_sum_dbm, type: integer, source: system, default: 0, description: "Sum of rssi_dbm over ingested reads (avg = rssi_sum_dbm / reads_received_count)" }
      - { name: status, type: enum, source: system, description: "REGISTERED | COMM_VERIFIED | COMM_FAILED | REPLACED" }

  - name: BenchTest
    parent: null
    common_fields: true
    fields:
      - { name: meter_id, type: string, source: input, description: "FK -> Meter.id; meter must be REMOVED" }
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; the change-out that removed the meter", constraints: "nullable" }
      - { name: complaint_id, type: string, source: input, description: "FK -> HighBillComplaint.id; set when ordered for a complaint", constraints: "nullable" }
      - { name: measured_low_ccf, type: number, source: input, description: "Volume the meter registered at low test flow" }
      - { name: measured_mid_ccf, type: number, source: input, description: "Volume the meter registered at mid test flow" }
      - { name: measured_high_ccf, type: number, source: input, description: "Volume the meter registered at high test flow" }
      - { name: accuracy_low_pct, type: number, source: computed, description: "round(measured_low_ccf / KNOWN_LOW_CCF * 100, 2) half-up" }
      - { name: accuracy_mid_pct, type: number, source: computed, description: "round(measured_mid_ccf / KNOWN_MID_CCF * 100, 2) half-up" }
      - { name: accuracy_high_pct, type: number, source: computed, description: "round(measured_high_ccf / KNOWN_HIGH_CCF * 100, 2) half-up" }
      - { name: weighted_accuracy_pct, type: number, source: computed, description: "round(0.2*accuracy_low_pct + 0.3*accuracy_mid_pct + 0.5*accuracy_high_pct, 2) half-up — rounding per-flow FIRST, then weighting (pinned order)" }
      - { name: result, type: enum, source: computed, description: "PASS | FAIL — PASS iff 98.5 <= weighted_accuracy_pct <= 101.5 AND 95.0 <= accuracy_low_pct <= 105.0 (two-sided band)" }
      - { name: tested_at, type: datetime, source: system, description: "Logical-clock timestamp of test" }

  - name: HighBillComplaint
    parent: null
    common_fields: true
    fields:
      - { name: service_account_id, type: string, source: input, description: "FK -> ServiceAccount.id" }
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; the change-out preceding the disputed bill" }
      - { name: claimed_bill_cents, type: integer, source: input, description: "Disputed bill amount, cents" }
      - { name: baseline_bill_cents, type: integer, source: input, description: "Baseline bill for the same period from billing history, cents; > 0" }
      - { name: billing_period_start, type: datetime, source: input, description: "Disputed period start (ISO 8601 UTC)" }
      - { name: billing_period_end, type: datetime, source: input, description: "Disputed period end (ISO 8601 UTC), exclusive" }
      - { name: variance_pct, type: number, source: computed, description: "round((claimed_bill_cents - baseline_bill_cents) / baseline_bill_cents * 100, 2) half-up" }
      - { name: bench_test_id, type: string, source: system, description: "FK -> BenchTest.id; linked when the ordered bench test is recorded", constraints: "nullable" }
      - { name: adjustment_cents, type: integer, source: computed, description: "Credit computed at adjudication; see calculation complaint_adjustment", constraints: "nullable" }
      - { name: adjudication_variant, type: enum, source: computed, description: "REGISTRATION_ERROR | GOODWILL_TIERED; which variant produced adjustment_cents", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | BENCH_TEST_ORDERED | ADJUSTED | DENIED | WITHDRAWN" }

  - name: QualityAudit
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id" }
      - { name: contractor_id, type: string, source: system, description: "FK -> Contractor.id; copied from work order" }
      - { name: audit_type, type: enum, source: input, description: "SAMPLED | FOR_CAUSE" }
      - { name: checks_total, type: integer, source: input, description: "Checklist items inspected; >= 1; supplied at record", constraints: "nullable until record" }
      - { name: checks_passed, type: integer, source: input, description: "Checklist items passed; supplied at record", constraints: "nullable until record" }
      - { name: defects_found, type: integer, source: input, description: "Defects observed; supplied at record", constraints: "nullable until record" }
      - { name: recorded_at, type: datetime, source: system, description: "Logical-clock timestamp of record", constraints: "nullable" }
      - { name: result_status, type: enum, source: system, description: "PENDING | PASS | FAIL — PASS iff defects_found == 0 AND checks_passed == checks_total" }

  - name: ContractorInvoice
    parent: null
    common_fields: true
    fields:
      - { name: contractor_id, type: string, source: input, description: "FK -> Contractor.id" }
      - { name: program_id, type: string, source: system, description: "FK -> Program.id; copied from contractor" }
      - { name: period_start, type: datetime, source: input, description: "Billing period start (ISO 8601 UTC), inclusive" }
      - { name: period_end, type: datetime, source: input, description: "Billing period end (ISO 8601 UTC), exclusive" }
      - { name: units_completed, type: integer, source: computed, description: "Count of contractor's work orders CLOSED with closed_at in [period_start, period_end); frozen at submit" }
      - { name: gross_amount_cents, type: integer, source: computed, description: "= units_completed * contractor.unit_price_cents; frozen at submit" }
      - { name: bonus_cents, type: integer, source: computed, description: "round(gross_amount_cents * 0.02, 0) half-up if quality_score_bp >= 9800 at submit else 0" }
      - { name: penalty_cents, type: integer, source: computed, description: "min(failed_audits_in_period * round(gross_amount_cents * 0.01, 0), round(gross_amount_cents * 0.10, 0))" }
      - { name: retainage_cents, type: integer, source: computed, description: "round(gross_amount_cents * 0.10, 0) if contractor SUSPENDED at submit else round(gross_amount_cents * 0.05, 0)" }
      - { name: net_amount_cents, type: integer, source: computed, description: "= gross_amount_cents + bonus_cents - penalty_cents - retainage_cents" }
      - { name: dispute_reason, type: string, source: input, description: "Reason supplied on dispute", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | DISPUTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Program
    initial_state: PLANNING
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNING
        to: ACTIVE
        trigger: "POST /api/programs/{programId}/activate"
        actor: ProgramManager
        preconditions: []
        side_effects: ["Program.status = ACTIVE; Program.version += 1"]
      - from: ACTIVE
        to: CLOSING
        trigger: "POST /api/programs/{programId}/begin-closing"
        actor: ProgramManager
        preconditions:
          - "Every Wave of this program has status IN {COMPLETE, CANCELLED}"
        side_effects: ["Program.status = CLOSING; Program.version += 1"]
      - from: CLOSING
        to: CLOSED
        trigger: "POST /api/programs/{programId}/close"
        actor: ProgramManager
        preconditions:
          - "Every ContractorInvoice of this program has status = APPROVED"
        side_effects: ["Program.status = CLOSED; Program.version += 1"]

  - entity: Contractor
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/contractors/{contractorId}/suspend (manual) OR system auto-suspension when quality_score_recompute drops quality_score_bp < 9200"
        actor: ProgramManager | system
        preconditions: []
        side_effects:
          - "Contractor.status = SUSPENDED; Contractor.version += 1"
          - "Cascade: future Appointment booking for this contractor is rejected (ERR_CONTRACTOR_NOT_ACTIVE)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/contractors/{contractorId}/reinstate"
        actor: ProgramManager
        preconditions: []
        side_effects: ["Contractor.status = ACTIVE; Contractor.version += 1"]

  - entity: ServiceAccount
    initial_state: ELIGIBLE
    terminal_states: [EXEMPTED]
    transitions:
      - from: ELIGIBLE
        to: IN_PROGRAM
        trigger: "system (automatic when a WorkOrder is created for the account)"
        actor: system
        preconditions: []
        side_effects: ["ServiceAccount.status = IN_PROGRAM; ServiceAccount.version += 1"]
      - from: IN_PROGRAM
        to: REPLACED
        trigger: "system (automatic on WorkOrder swap)"
        actor: system
        preconditions: []
        side_effects: ["ServiceAccount.status = REPLACED; ServiceAccount.version += 1"]
      - from: IN_PROGRAM
        to: EXEMPTED
        trigger: "system (automatic when a NoAccessCase resolves with resolution = ACCOUNT_EXEMPTED)"
        actor: system
        preconditions: []
        side_effects: ["ServiceAccount.status = EXEMPTED; ServiceAccount.version += 1"]
      - from: IN_PROGRAM
        to: ELIGIBLE
        trigger: "system (automatic when the account's open WorkOrder is CANCELLED and no other open WorkOrder remains)"
        actor: system
        preconditions: []
        side_effects: ["ServiceAccount.status = ELIGIBLE; ServiceAccount.version += 1"]

  - entity: Meter
    initial_state: IN_STOCK
    terminal_states: [DISPOSED, RETURNED_TO_VENDOR]
    transitions:
      - from: IN_STOCK
        to: INSTALLED
        trigger: "POST /api/meters/{meterId}/install (legacy baseline install) OR system (as new meter on WorkOrder swap)"
        actor: Scheduler | system
        preconditions:
          - "Target ServiceAccount has no other INSTALLED meter"
        side_effects:
          - "Meter.status = INSTALLED; Meter.service_account_id = account; Meter.installed_read_value set; Meter.version += 1"
      - from: INSTALLED
        to: REMOVED
        trigger: "system (automatic as old meter on WorkOrder swap)"
        actor: system
        preconditions: []
        side_effects: ["Meter.status = REMOVED; Meter.service_account_id = null; Meter.version += 1"]
      - from: REMOVED
        to: BENCH_PASSED
        trigger: "system (automatic when a BenchTest with result = PASS is recorded for the meter)"
        actor: system
        preconditions: []
        side_effects: ["Meter.status = BENCH_PASSED; Meter.version += 1"]
      - from: REMOVED
        to: BENCH_FAILED
        trigger: "system (automatic when a BenchTest with result = FAIL is recorded for the meter)"
        actor: system
        preconditions: []
        side_effects: ["Meter.status = BENCH_FAILED; Meter.version += 1"]
      - from: BENCH_PASSED
        to: DISPOSED
        trigger: "POST /api/meters/{meterId}/dispose"
        actor: Scheduler
        preconditions: []
        side_effects: ["Meter.status = DISPOSED; Meter.version += 1"]
      - from: BENCH_FAILED
        to: RETURNED_TO_VENDOR
        trigger: "POST /api/meters/{meterId}/dispose"
        actor: Scheduler
        preconditions: []
        side_effects: ["Meter.status = RETURNED_TO_VENDOR; Meter.version += 1"]

  - entity: Wave
    initial_state: DRAFT
    terminal_states: [COMPLETE, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /api/waves/{waveId}/open"
        actor: ProgramManager
        preconditions:
          - "Program.status = ACTIVE (ERR_PROGRAM_NOT_ACTIVE)"
          - "Half-open window [window_start, window_end) does not intersect any other wave of the same program with status IN {OPEN, LOCKED}; adjacency (other.window_end == this.window_start or this.window_end == other.window_start) is allowed (ERR_WAVE_WINDOW_OVERLAP)"
        side_effects: ["Wave.status = OPEN; Wave.version += 1"]
      - from: OPEN
        to: LOCKED
        trigger: "POST /api/waves/{waveId}/lock"
        actor: ProgramManager
        preconditions:
          - "Program-wide commitment check: program.budget_committed_cents (including this wave's live work orders) <= program.budget_total_cents; equality allowed (ERR_BUDGET_COMMITMENT_EXCEEDED)"
        side_effects: ["Wave.status = LOCKED; Wave.version += 1"]
      - from: LOCKED
        to: COMPLETE
        trigger: "POST /api/waves/{waveId}/complete"
        actor: ProgramManager
        preconditions:
          - "Every work order of this wave has lifecycle_status IN {CLOSED, CANCELLED}"
        side_effects: ["Wave.status = COMPLETE; Wave.version += 1"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/waves/{waveId}/cancel"
        actor: ProgramManager
        preconditions:
          - "Wave has zero work orders with lifecycle_status NOT IN {CANCELLED}"
        side_effects: ["Wave.status = CANCELLED; Wave.version += 1"]
      - from: OPEN
        to: CANCELLED
        trigger: "POST /api/waves/{waveId}/cancel"
        actor: ProgramManager
        preconditions:
          - "Wave has zero work orders with lifecycle_status NOT IN {CANCELLED}"
        side_effects: ["Wave.status = CANCELLED; Wave.version += 1"]

  - entity: WorkOrder
    initial_state: "lifecycle_status = CREATED, hold_status = CLEAR"
    terminal_states: ["lifecycle_status IN {CLOSED, CANCELLED}"]
    transitions:
      - from: CREATED
        to: NOTIFIED
        trigger: "system (automatic when the first CustomerNotification becomes DELIVERED, any channel)"
        actor: system
        preconditions: []
        side_effects: ["WorkOrder.lifecycle_status = NOTIFIED; WorkOrder.version += 1"]
        note: "CRITICAL accounts are gated at booking time (ERR_CRITICAL_CHANNEL_REQUIRED) and their notice window counts only CERTIFIED_MAIL deliveries — see calculation notice_window_eligibility"
      - from: NOTIFIED
        to: SCHEDULED
        trigger: "POST /api/appointments (booking)"
        actor: Scheduler
        preconditions:
          - "WorkOrder.hold_status = CLEAR"
          - "Notice window: slot_date >= date(latest qualifying DELIVERED notification.delivered_at) + program.notice_days (ERR_NOTICE_WINDOW_NOT_MET)"
          - "slot_date >= current logical-clock date (ERR_APPOINTMENT_SLOT_PAST)"
          - "Crew bucket: count of contractor's appointments with status IN {BOOKED, CONFIRMED} on (slot_date, window) < contractor.crew_capacity_per_window (ERR_CREW_WINDOW_FULL)"
        side_effects:
          - "Any existing appointment of this work order with status IN {BOOKED, CONFIRMED} -> SUPERSEDED"
          - "New Appointment status = BOOKED, attempt_number = 1 + count of prior non-SUPERSEDED appointments"
          - "WorkOrder.lifecycle_status = SCHEDULED; WorkOrder.version += 1"
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /api/appointments (re-booking; same rules as booking)"
        actor: Scheduler
        preconditions: ["Same as NOTIFIED -> SCHEDULED"]
        side_effects: ["Same as NOTIFIED -> SCHEDULED (existing BOOKED/CONFIRMED appointment -> SUPERSEDED); WorkOrder.version += 1"]
      - from: ACCESS_FAILED
        to: SCHEDULED
        trigger: "POST /api/appointments (re-booking after no-access)"
        actor: Scheduler
        preconditions: ["Same as NOTIFIED -> SCHEDULED"]
        side_effects: ["Same as NOTIFIED -> SCHEDULED; WorkOrder.version += 1"]
      - from: SCHEDULED
        to: ACCESS_FAILED
        trigger: "POST /api/appointments/{appointmentId}/no-access"
        actor: FieldContractor
        preconditions:
          - "Appointment.status IN {BOOKED, CONFIRMED}"
          - "Appointment belongs to this work order"
        side_effects:
          - "Appointment.status = NO_ACCESS"
          - "WorkOrder.no_access_strikes += 1; WorkOrder.lifecycle_status = ACCESS_FAILED; WorkOrder.version += 1"
          - "Cascade link 1->2: if WorkOrder.no_access_strikes >= 3 AND no OPEN NoAccessCase exists for the work order, create NoAccessCase (status = OPEN, stage = STAGE_1_DOOR_HANGER, strikes_at_open = no_access_strikes)"
          - "Cascade link 2->3: on NoAccessCase creation, auto-create CustomerNotification (channel = DOOR_HANGER, no_access_case_id = case) with status = SENT"
      - from: SCHEDULED
        to: SWAPPED
        trigger: "POST /api/work-orders/{workOrderId}/swap"
        actor: FieldContractor
        preconditions:
          - "WorkOrder.hold_status = CLEAR"
          - "WorkOrder has an appointment with status = COMPLETED (the visit at which the swap happened)"
          - "OCC: expected_work_order_version == WorkOrder.version (ERR_STALE_WORK_ORDER_VERSION)"
          - "new_meter_id references a Meter with status = IN_STOCK and technology = AMI (ERR_METER_NOT_AVAILABLE)"
          - "final_read_value >= ServiceAccount.last_billed_read_value (ERR_READING_SEQUENCE_INVALID)"
          - "initial_read_value <= FACTORY_INITIAL_READ_MAX_CCF (1) (ERR_READING_SEQUENCE_INVALID)"
        side_effects:
          - "Old meter: INSTALLED -> REMOVED (service_account_id cleared)"
          - "New meter: IN_STOCK -> INSTALLED (service_account_id = account, installed_read_value = initial_read_value)"
          - "WorkOrder.new_meter_id = new_meter_id"
          - "Compute provisional_trueup_cents via swap_trueup PRORATED_ESTIMATE variant"
          - "ServiceAccount IN_PROGRAM -> REPLACED"
          - "WorkOrder.lifecycle_status = SWAPPED; WorkOrder.version += 1"
        note: "Swap payload reads are the crew's declared values; the corresponding MeterReading rows are appended via POST /api/readings (read_type FINAL for old_meter_id, INITIAL for new_meter_id) and are REQUIRED before reconcile"
      - from: SWAPPED
        to: RECONCILED
        trigger: "POST /api/work-orders/{workOrderId}/reconcile"
        actor: FieldContractor
        preconditions:
          - "OCC: expected_work_order_version == WorkOrder.version (ERR_STALE_WORK_ORDER_VERSION)"
          - "A FINAL MeterReading exists for old_meter_id and an INITIAL MeterReading exists for new_meter_id on this work order (ERR_RECONCILE_READINGS_INCOMPLETE)"
        side_effects:
          - "Compute trueup_amount_cents via swap_trueup MEASURED variant; trueup_delta_cents = trueup_amount_cents - provisional_trueup_cents"
          - "WorkOrder.lifecycle_status = RECONCILED; WorkOrder.version += 1"
      - from: RECONCILED
        to: AMI_VERIFIED
        trigger: "system (automatic when the work order's EndpointRegistration verify yields COMM_VERIFIED)"
        actor: system
        preconditions: []
        side_effects: ["WorkOrder.lifecycle_status = AMI_VERIFIED; WorkOrder.version += 1"]
      - from: AMI_VERIFIED
        to: QA_REVIEW
        trigger: "system (automatic, same verify event, immediately after AMI_VERIFIED)"
        actor: system
        preconditions: []
        side_effects:
          - "WorkOrder.lifecycle_status = QA_REVIEW; WorkOrder.version += 1"
          - "Sampling: if the count of this contractor's work orders that have entered QA_REVIEW (including this one) is a multiple of 5, auto-create QualityAudit (audit_type = SAMPLED, result_status = PENDING)"
      - from: QA_REVIEW
        to: QA_FAILED
        trigger: "system (automatic when a QualityAudit for this work order records result_status = FAIL)"
        actor: system
        preconditions: []
        side_effects: ["WorkOrder.lifecycle_status = QA_FAILED; WorkOrder.version += 1"]
      - from: QA_FAILED
        to: QA_REVIEW
        trigger: "POST /api/work-orders/{workOrderId}/submit-rework"
        actor: FieldContractor
        preconditions:
          - "OCC: expected_work_order_version == WorkOrder.version (ERR_STALE_WORK_ORDER_VERSION)"
        side_effects: ["WorkOrder.lifecycle_status = QA_REVIEW; WorkOrder.version += 1"]
      - from: QA_REVIEW
        to: CLOSED
        trigger: "POST /api/work-orders/{workOrderId}/close"
        actor: Scheduler
        preconditions:
          - "WorkOrder.hold_status = CLEAR (ERR_INVALID_STATE)"
          - "No QualityAudit of this work order has result_status = PENDING (ERR_INVALID_STATE)"
          - "No HighBillComplaint of this work order has status IN {FILED, UNDER_REVIEW, BENCH_TEST_ORDERED} (ERR_OPEN_COMPLAINT_EXISTS)"
          - "No NoAccessCase of this work order has status = OPEN (ERR_OPEN_NO_ACCESS_CASE)"
        side_effects:
          - "WorkOrder.lifecycle_status = CLOSED; closed_at = clock; committed_amount_cents = 0; WorkOrder.version += 1"
          - "Program.budget_committed_cents / completed_meter_count recomputed (commitment released)"
      - from: CREATED
        to: CANCELLED
        trigger: "POST /api/work-orders/{workOrderId}/cancel"
        actor: Scheduler
        preconditions: ["No OPEN NoAccessCase for this work order (ERR_OPEN_NO_ACCESS_CASE)"]
        side_effects: ["See shared cancel side effects below"]
      - from: NOTIFIED
        to: CANCELLED
        trigger: "POST /api/work-orders/{workOrderId}/cancel"
        actor: Scheduler
        preconditions: ["No OPEN NoAccessCase for this work order (ERR_OPEN_NO_ACCESS_CASE)"]
        side_effects: ["See shared cancel side effects below"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/work-orders/{workOrderId}/cancel"
        actor: Scheduler
        preconditions: ["No OPEN NoAccessCase for this work order (ERR_OPEN_NO_ACCESS_CASE)"]
        side_effects: ["See shared cancel side effects below"]
      - from: ACCESS_FAILED
        to: CANCELLED
        trigger: "POST /api/work-orders/{workOrderId}/cancel"
        actor: Scheduler
        preconditions: ["No OPEN NoAccessCase for this work order (ERR_OPEN_NO_ACCESS_CASE)"]
        side_effects: ["See shared cancel side effects below"]
        note: "Shared cancel side effects: WorkOrder.lifecycle_status = CANCELLED; committed_amount_cents = 0; appointments with status IN {BOOKED, CONFIRMED} -> SUPERSEDED; ServiceAccount -> ELIGIBLE if no other open work order; Program budget recomputed (commitment released); WorkOrder.version += 1"
      - from: "* (hold dimension, orthogonal to lifecycle)"
        to: "hold_status = ON_HOLD"
        trigger: "system (automatic when a HighBillComplaint is FILED for this work order and hold_status = CLEAR)"
        actor: system
        preconditions: []
        side_effects: ["WorkOrder.hold_status = ON_HOLD; WorkOrder.version += 1"]
      - from: "hold_status = ON_HOLD"
        to: "hold_status = CLEAR"
        trigger: "system (automatic when the work order's last open HighBillComplaint reaches ADJUSTED | DENIED | WITHDRAWN)"
        actor: system
        preconditions: []
        side_effects: ["WorkOrder.hold_status = CLEAR; WorkOrder.version += 1"]

  - entity: CustomerNotification
    initial_state: SENT
    terminal_states: [DELIVERED, FAILED, RETURNED]
    transitions:
      - from: SENT
        to: DELIVERED
        trigger: "POST /api/notifications/{notificationId}/confirm-delivery with outcome = DELIVERED"
        actor: Scheduler
        preconditions: []
        side_effects:
          - "CustomerNotification.status = DELIVERED; delivered_at set; version += 1"
          - "If WorkOrder.lifecycle_status = CREATED: WorkOrder CREATED -> NOTIFIED (any channel)"
      - from: SENT
        to: FAILED
        trigger: "POST /api/notifications/{notificationId}/confirm-delivery with outcome = FAILED"
        actor: Scheduler
        preconditions: []
        side_effects: ["CustomerNotification.status = FAILED; version += 1"]
      - from: SENT
        to: RETURNED
        trigger: "POST /api/notifications/{notificationId}/confirm-delivery with outcome = RETURNED"
        actor: Scheduler
        preconditions: []
        side_effects: ["CustomerNotification.status = RETURNED; version += 1"]

  - entity: Appointment
    initial_state: BOOKED
    terminal_states: [COMPLETED, NO_ACCESS, CANCELLED_BY_CUSTOMER, SUPERSEDED]
    transitions:
      - from: BOOKED
        to: CONFIRMED
        trigger: "POST /api/appointments/{appointmentId}/confirm"
        actor: CustomerService
        preconditions: []
        side_effects: ["Appointment.status = CONFIRMED; version += 1"]
      - from: BOOKED
        to: COMPLETED
        trigger: "POST /api/appointments/{appointmentId}/complete"
        actor: FieldContractor
        preconditions: ["Acting contractor owns the appointment (Appointment.contractor_id == X-User-ID) (ERR_CONTRACTOR_MISMATCH)"]
        side_effects: ["Appointment.status = COMPLETED; version += 1"]
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /api/appointments/{appointmentId}/complete"
        actor: FieldContractor
        preconditions: ["Acting contractor owns the appointment (ERR_CONTRACTOR_MISMATCH)"]
        side_effects: ["Appointment.status = COMPLETED; version += 1"]
      - from: BOOKED
        to: NO_ACCESS
        trigger: "POST /api/appointments/{appointmentId}/no-access"
        actor: FieldContractor
        preconditions: ["Acting contractor owns the appointment (ERR_CONTRACTOR_MISMATCH)"]
        side_effects: ["See WorkOrder SCHEDULED -> ACCESS_FAILED cascade (strikes, NoAccessCase, stage notification)"]
      - from: CONFIRMED
        to: NO_ACCESS
        trigger: "POST /api/appointments/{appointmentId}/no-access"
        actor: FieldContractor
        preconditions: ["Acting contractor owns the appointment (ERR_CONTRACTOR_MISMATCH)"]
        side_effects: ["See WorkOrder SCHEDULED -> ACCESS_FAILED cascade"]
      - from: BOOKED
        to: CANCELLED_BY_CUSTOMER
        trigger: "POST /api/appointments/{appointmentId}/cancel"
        actor: Scheduler | CustomerService
        preconditions: []
        side_effects: ["Appointment.status = CANCELLED_BY_CUSTOMER; version += 1; WorkOrder.lifecycle_status SCHEDULED -> ACCESS_FAILED does NOT fire (no strike)"]
      - from: CONFIRMED
        to: CANCELLED_BY_CUSTOMER
        trigger: "POST /api/appointments/{appointmentId}/cancel"
        actor: Scheduler | CustomerService
        preconditions: []
        side_effects: ["Appointment.status = CANCELLED_BY_CUSTOMER; version += 1"]
      - from: BOOKED
        to: SUPERSEDED
        trigger: "system (automatic when a new appointment is booked on the same work order, or the work order is cancelled)"
        actor: system
        preconditions: []
        side_effects: ["Appointment.status = SUPERSEDED; version += 1"]
      - from: CONFIRMED
        to: SUPERSEDED
        trigger: "system (automatic when a new appointment is booked on the same work order, or the work order is cancelled)"
        actor: system
        preconditions: []
        side_effects: ["Appointment.status = SUPERSEDED; version += 1"]

  - entity: NoAccessCase
    initial_state: "OPEN (stage = STAGE_1_DOOR_HANGER)"
    terminal_states: [RESOLVED]
    transitions:
      - from: "OPEN stage STAGE_1_DOOR_HANGER"
        to: "OPEN stage STAGE_2_CERTIFIED_MAIL"
        trigger: "POST /api/no-access-cases/{caseId}/advance"
        actor: Scheduler
        preconditions:
          - "A CustomerNotification with no_access_case_id = case, channel matching the current stage (STAGE_1 -> DOOR_HANGER) and status = DELIVERED exists (ERR_ESCALATION_STEP_REQUIRED)"
        side_effects: ["stage = STAGE_2_CERTIFIED_MAIL; auto-create CustomerNotification (channel = CERTIFIED_MAIL, no_access_case_id = case, status = SENT); version += 1"]
      - from: "OPEN stage STAGE_2_CERTIFIED_MAIL"
        to: "OPEN stage STAGE_3_PHONE_CAMPAIGN"
        trigger: "POST /api/no-access-cases/{caseId}/advance"
        actor: Scheduler
        preconditions: ["Stage notification (CERTIFIED_MAIL) DELIVERED (ERR_ESCALATION_STEP_REQUIRED)"]
        side_effects: ["stage = STAGE_3_PHONE_CAMPAIGN; auto-create CustomerNotification (channel = PHONE, no_access_case_id = case, status = SENT); version += 1"]
      - from: "OPEN stage STAGE_3_PHONE_CAMPAIGN"
        to: "OPEN stage STAGE_4_FIELD_VISIT"
        trigger: "POST /api/no-access-cases/{caseId}/advance"
        actor: Scheduler
        preconditions: ["Stage notification (PHONE) DELIVERED (ERR_ESCALATION_STEP_REQUIRED)"]
        side_effects: ["stage = STAGE_4_FIELD_VISIT; version += 1 (no auto-notification for field visit)"]
      - from: OPEN
        to: RESOLVED
        trigger: "POST /api/no-access-cases/{caseId}/resolve"
        actor: Scheduler
        preconditions:
          - "resolution = FORCED_ENTRY only allowed from stage = STAGE_4_FIELD_VISIT (ERR_FORCED_ENTRY_NOT_AUTHORIZED)"
        side_effects:
          - "status = RESOLVED; resolution set; version += 1"
          - "If resolution = ACCOUNT_EXEMPTED: WorkOrder -> CANCELLED (shared cancel side effects) and ServiceAccount -> EXEMPTED"

  - entity: EndpointRegistration
    initial_state: REGISTERED
    terminal_states: [COMM_VERIFIED, REPLACED]
    transitions:
      - from: REGISTERED
        to: COMM_VERIFIED
        trigger: "POST /api/endpoint-registrations/{registrationId}/verify (threshold met)"
        actor: AmiOperator
        preconditions: ["comm_verification threshold met (reads_received_count >= 4 within 72h of registered_at AND avg rssi >= -95 dBm)"]
        side_effects:
          - "EndpointRegistration.status = COMM_VERIFIED; version += 1"
          - "WorkOrder RECONCILED -> AMI_VERIFIED -> QA_REVIEW (chained automatic transitions, incl. audit sampling)"
      - from: REGISTERED
        to: COMM_FAILED
        trigger: "POST /api/endpoint-registrations/{registrationId}/verify (threshold not met)"
        actor: AmiOperator
        preconditions: []
        side_effects: ["EndpointRegistration.status = COMM_FAILED; version += 1"]
      - from: COMM_FAILED
        to: REPLACED
        trigger: "POST /api/endpoint-registrations/{registrationId}/replace"
        actor: AmiOperator
        preconditions: ["new_endpoint_serial unique (ERR_AMI_ENDPOINT_SERIAL_CONFLICT)"]
        side_effects: ["Old registration -> REPLACED; new EndpointRegistration created with status = REGISTERED, registered_at = clock, counters reset; version += 1 on old"]

  - entity: HighBillComplaint
    initial_state: FILED
    terminal_states: [ADJUSTED, DENIED, WITHDRAWN]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /api/complaints/{complaintId}/triage"
        actor: CustomerService
        preconditions: []
        side_effects: ["status = UNDER_REVIEW; version += 1"]
      - from: UNDER_REVIEW
        to: BENCH_TEST_ORDERED
        trigger: "POST /api/complaints/{complaintId}/order-bench-test"
        actor: CustomerService
        preconditions:
          - "The work order's old_meter_id meter has status = REMOVED (ERR_METER_NOT_AVAILABLE)"
        side_effects: ["status = BENCH_TEST_ORDERED; version += 1"]
      - from: BENCH_TEST_ORDERED
        to: UNDER_REVIEW
        trigger: "system (automatic when a BenchTest with complaint_id = this complaint is recorded)"
        actor: system
        preconditions: []
        side_effects: ["status = UNDER_REVIEW; bench_test_id = new bench test; version += 1"]
      - from: UNDER_REVIEW
        to: ADJUSTED
        trigger: "POST /api/complaints/{complaintId}/adjudicate with decision = ADJUSTED"
        actor: CustomerService
        preconditions:
          - "If variance_pct >= 50: a linked BenchTest with result = FAIL is required (ERR_BENCH_TEST_REQUIRED)"
        side_effects:
          - "adjustment_cents computed via complaint_adjustment: REGISTRATION_ERROR variant when a linked FAIL BenchTest exists, else GOODWILL_TIERED variant; adjudication_variant recorded"
          - "status = ADJUSTED; version += 1"
          - "If this was the work order's last open complaint: WorkOrder hold_status ON_HOLD -> CLEAR"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /api/complaints/{complaintId}/adjudicate with decision = DENIED"
        actor: CustomerService
        preconditions: []
        side_effects: ["status = DENIED; version += 1; hold release as above"]
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /api/complaints/{complaintId}/withdraw"
        actor: CustomerService
        preconditions: []
        side_effects: ["status = WITHDRAWN; version += 1; hold release as above"]
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /api/complaints/{complaintId}/withdraw"
        actor: CustomerService
        preconditions: []
        side_effects: ["status = WITHDRAWN; version += 1; hold release as above"]
      - from: BENCH_TEST_ORDERED
        to: WITHDRAWN
        trigger: "POST /api/complaints/{complaintId}/withdraw"
        actor: CustomerService
        preconditions: []
        side_effects: ["status = WITHDRAWN; version += 1; hold release as above"]

  - entity: QualityAudit
    initial_state: PENDING
    terminal_states: [PASS, FAIL]
    transitions:
      - from: PENDING
        to: PASS
        trigger: "POST /api/quality-audits/{auditId}/record with defects_found = 0 AND checks_passed = checks_total"
        actor: QualityAuditor
        preconditions: []
        side_effects: ["result_status = PASS; recorded_at = clock; version += 1", "Contractor.quality_score_bp recomputed (window shift may evict an old FAIL from the latest-20 window)"]
      - from: PENDING
        to: FAIL
        trigger: "POST /api/quality-audits/{auditId}/record with defects_found > 0 OR checks_passed < checks_total"
        actor: QualityAuditor
        preconditions: []
        side_effects:
          - "result_status = FAIL; recorded_at = clock; version += 1"
          - "Cascade link 1: WorkOrder QA_REVIEW -> QA_FAILED"
          - "Cascade link 2: Contractor.quality_score_bp recomputed (quality_score_recompute: 10000 - 400 per FAIL among latest 20 recorded audits, floor 0); audits_failed_count recomputed"
          - "Cascade link 3: if recomputed quality_score_bp < 9200 and contractor status = ACTIVE: Contractor ACTIVE -> SUSPENDED"

  - entity: ContractorInvoice
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/invoices/{invoiceId}/submit"
        actor: FieldContractor
        preconditions:
          - "Acting contractor owns the invoice (ERR_CONTRACTOR_MISMATCH)"
          - "Recomputed units_completed >= 1 (ERR_INVOICE_PERIOD_EMPTY)"
        side_effects: ["units_completed/gross/bonus/penalty/retainage/net recomputed via invoice_settlement and frozen; status = SUBMITTED; version += 1"]
      - from: DISPUTED
        to: SUBMITTED
        trigger: "POST /api/invoices/{invoiceId}/submit"
        actor: FieldContractor
        preconditions: ["Acting contractor owns the invoice (ERR_CONTRACTOR_MISMATCH)", "Recomputed units_completed >= 1 (ERR_INVOICE_PERIOD_EMPTY)"]
        side_effects: ["Amounts recomputed and frozen; status = SUBMITTED; version += 1"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/invoices/{invoiceId}/approve"
        actor: ProgramManager
        preconditions:
          - "net_amount_cents <= program.budget_available_cents (equality allowed) (ERR_BUDGET_AVAILABLE_EXCEEDED)"
        side_effects: ["status = APPROVED; Program.budget_spent_cents += net_amount_cents (budget_position recomputed); version += 1"]
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /api/invoices/{invoiceId}/dispute"
        actor: ProgramManager
        preconditions: []
        side_effects: ["status = DISPUTED; dispute_reason set; version += 1"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: assign-stale-work-order-version
    parent_entity: WorkOrder
    write_endpoint: "POST /api/work-orders/{workOrderId}/assign"
    occ_field: expected_work_order_version
    description: |
      Assigning (or re-assigning) a contractor to a WorkOrder whose version has
      advanced since the client last observed it is rejected. Re-assignment is
      legitimate while the work order is in CREATED/NOTIFIED/SCHEDULED/ACCESS_FAILED,
      so a stale version (e.g. another writer has just assigned a contractor) is
      the only signal that the client's decision basis is outdated.
    error_id: ERR_STALE_WORK_ORDER_VERSION
    http_status: 412
  - rule_id: book-appointment-stale-work-order-version
    parent_entity: WorkOrder
    write_endpoint: "POST /api/appointments"
    occ_field: expected_work_order_version
    description: |
      Booking an appointment against a WorkOrder whose version has advanced since
      the client last observed it is rejected. Booking legitimately supersedes an
      existing BOOKED/CONFIRMED appointment, so a second sequential booking still
      sees a schedulable work order; the stale version is the only deterministic
      rejection signal.
    error_id: ERR_STALE_WORK_ORDER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: budget_position
    trigger: "any mutation touching WorkOrder.committed_amount_cents (create/assign/close/cancel) or ContractorInvoice approval"
    algorithm: aggregation
    formula: |
      budget_committed_cents = sum(WorkOrder.committed_amount_cents for WorkOrder w where w.lifecycle_status NOT IN {CLOSED, CANCELLED} and w belongs to this program via wave_id -> Wave.program_id)
      budget_spent_cents = sum(ContractorInvoice.net_amount_cents where program_id = this and status = APPROVED)
      budget_available_cents = budget_total_cents - budget_committed_cents - budget_spent_cents
      budget_posture:
        OVERRUN if budget_committed_cents + budget_spent_cents > budget_total_cents
        TIGHT   else if budget_available_cents < floor(budget_total_cents * 0.10)
        FUNDED  otherwise
    input_set: "Work orders of this program with lifecycle_status NOT IN {CLOSED, CANCELLED}; invoices with status = APPROVED only (DRAFT/SUBMITTED/DISPUTED excluded)"
    constants:
      TIGHT_PCT: 0.10
    precision: "integer cents, exact"

  - name: swap_trueup
    trigger: "PRORATED_ESTIMATE at WorkOrder swap (books provisional_trueup_cents); MEASURED at reconcile (books trueup_amount_cents and trueup_delta_cents = measured - provisional)"
    algorithm: chronological
    formula: |
      days_since_billed = whole days between ServiceAccount.last_billed_read_at and swap clock timestamp (floor of seconds/86400)
      MEASURED variant:
        usage_ccf = final_read_value - ServiceAccount.last_billed_read_value
        trueup_amount_cents = round(usage_ccf * Program.rate_per_ccf_cents, 0) half-up
      PRORATED_ESTIMATE variant:
        usage_ccf = round(ServiceAccount.avg_daily_usage_ccf * days_since_billed, 2) half-up
        provisional_trueup_cents = round(usage_ccf * Program.rate_per_ccf_cents, 0) half-up
      reconcile: trueup_delta_cents = trueup_amount_cents - provisional_trueup_cents (may be negative = credit)
    input_set: "The work order's account fields (last_billed_read_value, last_billed_read_at, avg_daily_usage_ccf), the swap payload final_read_value, and Program.rate_per_ccf_cents"
    precision: "usage rounded to 2 dp half-up before rating; money integer cents"
    variants:
      - name: MEASURED
        when: "reconcile, when a FIELD_CREW/AMI_NETWORK FINAL reading exists"
        difference: "Uses the physical final read; diverges from provisional whenever actual consumption differs from the historical average"
      - name: PRORATED_ESTIMATE
        when: "swap time, before the final read is billing-verified"
        difference: "Uses avg_daily_usage_ccf * days; forward-looking estimate that the reconcile corrects via trueup_delta_cents"

  - name: complaint_adjustment
    trigger: "POST /api/complaints/{complaintId}/adjudicate with decision = ADJUSTED"
    algorithm: tiered_pricing
    formula: |
      Evaluation order (pinned): (1) compute variance_pct at filing; (2) if a linked BenchTest with result = FAIL exists -> REGISTRATION_ERROR variant; (3) else GOODWILL_TIERED variant.
      REGISTRATION_ERROR:
        A = BenchTest.weighted_accuracy_pct (over-registration when A > 100)
        adjustment_cents = claimed_bill_cents - round(claimed_bill_cents * 100 / A, 0) half-up
      GOODWILL_TIERED:
        excess_cents = claimed_bill_cents - baseline_bill_cents
        tier rate r: 0.10 if 25 <= variance_pct < 50; 0.20 if 50 <= variance_pct < 100; 0.30 if variance_pct >= 100
        adjustment_cents = round(excess_cents * r, 0) half-up
    input_set: "Complaint claimed/baseline amounts; linked BenchTest (only result = FAIL links count for REGISTRATION_ERROR)"
    constants:
      MANDATORY_BENCH_VARIANCE_PCT: 50
      GOODWILL_TIER1_PCT: 0.10
      GOODWILL_TIER2_PCT: 0.20
      GOODWILL_TIER3_PCT: 0.30
    precision: "integer cents, round_half_up"
    variants:
      - name: REGISTRATION_ERROR
        when: "a bench test linked to the complaint recorded FAIL"
        difference: "Removes the meter's over-registration fraction; for claimed 16800 with A = 105.00 yields 800, not the goodwill 480"
      - name: GOODWILL_TIERED
        when: "no FAIL bench test linked"
        difference: "Flat tiered percentage of the excess over baseline"

  - name: bench_weighted_accuracy
    trigger: "POST /api/bench-tests (computed synchronously at creation)"
    algorithm: weighted_scoring
    formula: |
      accuracy_low_pct  = round(measured_low_ccf  / KNOWN_LOW_CCF  * 100, 2) half-up
      accuracy_mid_pct  = round(measured_mid_ccf  / KNOWN_MID_CCF  * 100, 2) half-up
      accuracy_high_pct = round(measured_high_ccf / KNOWN_HIGH_CCF * 100, 2) half-up
      -- pinned rounding order: per-flow accuracies rounded to 2 dp FIRST, then weighted
      weighted_accuracy_pct = round(0.20 * accuracy_low_pct + 0.30 * accuracy_mid_pct + 0.50 * accuracy_high_pct, 2) half-up
      result = PASS iff 98.5 <= weighted_accuracy_pct <= 101.5 AND 95.0 <= accuracy_low_pct <= 105.0 else FAIL
      -- two-sided AWWA-style band: over-registration (accuracy > 101.5) is a FAIL and grounds REGISTRATION_ERROR complaint adjustments
    input_set: "The three measured volumes supplied at creation; constants fixed by metrology lab policy"
    constants:
      KNOWN_LOW_CCF: 2
      KNOWN_MID_CCF: 20
      KNOWN_HIGH_CCF: 30
      WEIGHT_LOW: 0.20
      WEIGHT_MID: 0.30
      WEIGHT_HIGH: 0.50
      WEIGHTED_PASS_MIN_PCT: 98.5
      WEIGHTED_PASS_MAX_PCT: 101.5
      LOW_FLOW_FLOOR_PCT: 95.0
      LOW_FLOW_CEIL_PCT: 105.0
    precision: "2 decimal places, round_half_up, per-flow rounding before weighting"

  - name: quality_score_recompute
    trigger: "any QualityAudit of the contractor records PASS or FAIL"
    algorithm: aggregation
    formula: |
      window = the contractor's latest 20 recorded QualityAudits, ordered by recorded_at DESC (tie-break: created_at ASC)
      fails = count of window entries with result_status = FAIL
      quality_score_bp = max(0, 10000 - AUDIT_FAIL_PENALTY_BP * fails)
      audits_failed_count = count of ALL recorded audits with result_status = FAIL
      if quality_score_bp < SUSPEND_BELOW_BP and Contractor.status = ACTIVE: auto-suspend (Contractor ACTIVE -> SUSPENDED)
    input_set: "Recorded audits (result_status IN {PASS, FAIL}) only; PENDING audits excluded"
    constants:
      AUDIT_FAIL_PENALTY_BP: 400
      SCORE_WINDOW_SIZE: 20
      SUSPEND_BELOW_BP: 9200
      BONUS_ELIGIBLE_BP: 9800
    precision: "integer basis points"

  - name: invoice_settlement
    trigger: "POST /api/invoices/{invoiceId}/submit (from DRAFT or DISPUTED); amounts recomputed and frozen at submit"
    algorithm: tiered_pricing
    formula: |
      units_completed = count of contractor's WorkOrders with lifecycle_status = CLOSED and closed_at in [period_start, period_end)
      gross_amount_cents = units_completed * Contractor.unit_price_cents
      bonus_cents = round(gross_amount_cents * 0.02, 0) half-up if Contractor.quality_score_bp >= 9800 at submit else 0
      fails_in_period = count of contractor's QualityAudits with result_status = FAIL and recorded_at in [period_start, period_end)
      penalty_cents = min(fails_in_period * round(gross_amount_cents * 0.01, 0) half-up, round(gross_amount_cents * 0.10, 0) half-up)
      retainage_cents = round(gross_amount_cents * 0.10, 0) half-up if Contractor.status = SUSPENDED at submit else round(gross_amount_cents * 0.05, 0) half-up
      net_amount_cents = gross_amount_cents + bonus_cents - penalty_cents - retainage_cents
    input_set: "Contractor's CLOSED work orders (closed_at window, half-open), contractor score/status snapshot at submit, recorded FAIL audits in the same window"
    constants:
      BONUS_PCT: 0.02
      PENALTY_PER_FAIL_PCT: 0.01
      PENALTY_CAP_PCT: 0.10
      RETAINAGE_PCT_STANDARD: 0.05
      RETAINAGE_PCT_SUSPENDED: 0.10
    precision: "integer cents, round_half_up; each component rounded to cents before summation (pinned order: round components, then net = sum)"

  - name: comm_verification
    trigger: "POST /api/endpoint-registrations/{registrationId}/verify"
    algorithm: threshold
    formula: |
      window_reads = ingested AMI reads with read_at in [registered_at, registered_at + 72h] (both bounds inclusive)
      count = len(window_reads); avg_rssi_dbm = sum(rssi)/count when count > 0
      COMM_VERIFIED iff count >= AMI_MIN_READS AND avg_rssi_dbm >= RSSI_MIN_DBM (boundary: exactly 4 reads and exactly -95 dBm pass)
      else COMM_FAILED
    input_set: "Reads ingested via POST /api/_ami/ingest-read for this registration; reads outside the 72h window excluded"
    constants:
      AMI_MIN_READS: 4
      COMM_WINDOW_HOURS: 72
      RSSI_MIN_DBM: -95
    precision: "rssi averaged as rational, compared without rounding"

  - name: no_access_escalation
    trigger: "POST /api/appointments/{appointmentId}/no-access"
    algorithm: threshold
    formula: |
      WorkOrder.no_access_strikes += 1
      if WorkOrder.no_access_strikes >= NO_ACCESS_STRIKE_THRESHOLD and no OPEN NoAccessCase exists:
        create NoAccessCase (stage = STAGE_1_DOOR_HANGER, strikes_at_open = strikes)
        auto-create stage-1 CustomerNotification (channel = DOOR_HANGER, status = SENT)
    input_set: "Appointments of the work order with status = NO_ACCESS"
    constants:
      NO_ACCESS_STRIKE_THRESHOLD: 3
    precision: "integer strike count; boundary: the 3rd strike opens the case"

  - name: completion_forecast
    trigger: "GET /api/programs/{programId}/completion-report"
    algorithm: forward_looking
    formula: |
      days_elapsed = days between program creation date and current logical clock (min 1)
      RUN_RATE variant (chronological):
        daily_rate = completed_meter_count / days_elapsed
        forecast_run_rate_date = today + ceil((target_meter_count - completed_meter_count) / max(daily_rate, 0.0001)) days
      STAGE_WEIGHTED variant (forward-looking):
        weight per open work order: CREATED 0.05, NOTIFIED 0.15, SCHEDULED 0.30, ACCESS_FAILED 0.25, SWAPPED 0.60, RECONCILED 0.75, AMI_VERIFIED 0.85, QA_REVIEW 0.90, QA_FAILED 0.55
        equivalent_done = completed_meter_count + sum(weights)
        remaining_weeks = (target_meter_count - equivalent_done) / max(total crew weekly capacity, 1), where crew weekly capacity = sum(crew_capacity_per_window * 9 windows/week) over ACTIVE contractors
        forecast_stage_weighted_date = today + ceil(remaining_weeks * 7) days
    input_set: "All work orders of the program (closed counted via completed_meter_count; open weighted by lifecycle_status); ACTIVE contractors only for capacity"
    precision: "dates rounded up to whole days"
    variants:
      - name: RUN_RATE
        when: "executive completion-report headline"
        difference: "Pure historical run rate; ignores pipeline composition"
      - name: STAGE_WEIGHTED
        when: "planning view in the same report"
        difference: "Weights pipeline stage progress against remaining crew capacity; diverges from RUN_RATE whenever the pipeline mix is skewed"

  - name: notice_window_eligibility
    trigger: "POST /api/appointments"
    algorithm: threshold
    formula: |
      qualifying = CustomerNotifications of the work order with status = DELIVERED
        and (ServiceAccount.priority_tier != CRITICAL or channel = CERTIFIED_MAIL)
      eligible_from_date = date(max(qualifying.delivered_at)) + Program.notice_days  (latest qualifying delivery governs)
      booking valid iff slot_date >= eligible_from_date AND slot_date >= current logical-clock date
    input_set: "Qualifying DELIVERED notifications only (FAILED/RETURNED/SENT excluded)"
    precision: "whole calendar days; boundary: slot exactly notice_days after latest delivery is valid (>=)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and one of the declared roles; X-User-ID present", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role permitted for this endpoint per §1.5 roles", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Entity-backed ownership: FieldContractor's X-User-ID equals the contractor id owning the resource (Appointment.contractor_id, WorkOrder.contractor_id, ContractorInvoice.contractor_id)", error_id: ERR_CONTRACTOR_MISMATCH, http_status: 403, applies_to: "POST /api/appointments/{id}/complete, /no-access; POST /api/work-orders/{id}/swap, /reconcile, /submit-rework; POST /api/invoices, /{id}/submit" }
  - { priority: 4, category: existence, check: "Path ids and body FK ids resolve to existing resources, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: business_constraint, check: "Payload schema: required fields present, types valid, enum members valid, ranges valid (budgets > 0, reads >= 0, etc.)", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }
  - { priority: 6, category: business_constraint, check: "Uniqueness: ServiceAccount.account_number, Meter.serial_number, EndpointRegistration.endpoint_serial, Wave.wave_number per program", error_id: "ERR_ACCOUNT_NUMBER_CONFLICT | ERR_METER_SERIAL_CONFLICT | ERR_AMI_ENDPOINT_SERIAL_CONFLICT | ERR_VALIDATION", http_status: 409, applies_to: "create endpoints for those entities" }
  - { priority: 7, category: state, check: "Target resource in a valid from-state for the requested transition; terminal states reject all transitions; complaint filing also requires the work order to be SWAPPED or later", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints; POST /api/complaints" }
  - { priority: 8, category: state, check: "Program must be ACTIVE for wave open, work order creation, and contractor onboarding", error_id: ERR_PROGRAM_NOT_ACTIVE, http_status: 422, applies_to: "POST /api/waves/{id}/open, POST /api/work-orders, POST /api/contractors" }
  - { priority: 9, category: business_safety, check: "CRITICAL accounts only become NOTIFIED via CERTIFIED_MAIL delivery; booking a CRITICAL account without a DELIVERED CERTIFIED_MAIL notification is rejected", error_id: ERR_CRITICAL_CHANNEL_REQUIRED, http_status: 422, applies_to: "POST /api/appointments" }
  - { priority: 10, category: business_safety, check: "FORCED_ENTRY resolution only from stage STAGE_4_FIELD_VISIT", error_id: ERR_FORCED_ENTRY_NOT_AUTHORIZED, http_status: 422, applies_to: "POST /api/no-access-cases/{id}/resolve" }
  - { priority: 11, category: business_safety, check: "Adjudicating ADJUSTED with variance_pct >= 50 requires a linked BenchTest with result = FAIL", error_id: ERR_BENCH_TEST_REQUIRED, http_status: 422, applies_to: "POST /api/complaints/{id}/adjudicate" }
  - { priority: 12, category: business_temporal, check: "Notice window: slot_date >= latest qualifying DELIVERED notification date + program.notice_days", error_id: ERR_NOTICE_WINDOW_NOT_MET, http_status: 422, applies_to: "POST /api/appointments" }
  - { priority: 13, category: business_temporal, check: "slot_date >= current logical-clock date", error_id: ERR_APPOINTMENT_SLOT_PAST, http_status: 422, applies_to: "POST /api/appointments" }
  - { priority: 14, category: business_temporal, check: "Wave half-open windows [window_start, window_end) of the same program in status OPEN/LOCKED must not intersect; adjacency allowed", error_id: ERR_WAVE_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /api/waves/{id}/open" }
  - { priority: 15, category: business_constraint, check: "Crew bucket capacity: contractor's BOOKED/CONFIRMED appointments on (slot_date, window) < crew_capacity_per_window", error_id: ERR_CREW_WINDOW_FULL, http_status: 409, applies_to: "POST /api/appointments" }
  - { priority: 16, category: business_constraint, check: "Wave capacity: committed_count < wave.capacity at work order creation", error_id: ERR_WAVE_CAPACITY_EXCEEDED, http_status: 422, applies_to: "POST /api/work-orders" }
  - { priority: 17, category: business_constraint, check: "Account has no other open work order (lifecycle_status NOT IN {CLOSED, CANCELLED})", error_id: ERR_ACCOUNT_ALREADY_IN_PROGRAM, http_status: 409, applies_to: "POST /api/work-orders" }
  - { priority: 18, category: business_constraint, check: "No second open complaint per work order", error_id: ERR_OPEN_COMPLAINT_EXISTS, http_status: 409, applies_to: "POST /api/complaints" }
  - { priority: 19, category: business_constraint, check: "WorkOrder cancel/close blocked while a NoAccessCase is OPEN", error_id: ERR_OPEN_NO_ACCESS_CASE, http_status: 409, applies_to: "POST /api/work-orders/{id}/cancel, POST /api/work-orders/{id}/close" }
  - { priority: 20, category: business_constraint, check: "NoAccessCase advance requires the current stage's notification DELIVERED", error_id: ERR_ESCALATION_STEP_REQUIRED, http_status: 422, applies_to: "POST /api/no-access-cases/{id}/advance" }
  - { priority: 21, category: business_referential, check: "Contractor is ACTIVE and belongs to the same program as the wave/work order", error_id: ERR_CONTRACTOR_NOT_ACTIVE, http_status: 422, applies_to: "POST /api/work-orders/{id}/assign, POST /api/appointments" }
  - { priority: 22, category: business_referential, check: "Cross-program reference: wave.program == contractor.program; complaint.service_account == work_order.service_account", error_id: "ERR_CROSS_PROGRAM_REFERENCE | ERR_ACCOUNT_WORK_ORDER_MISMATCH", http_status: 422, applies_to: "POST /api/work-orders/{id}/assign, POST /api/complaints" }
  - { priority: 23, category: business_referential, check: "Meter status/technology compatible (swap: new meter IN_STOCK + AMI; bench test: meter REMOVED; install: account has no INSTALLED meter)", error_id: ERR_METER_NOT_AVAILABLE, http_status: 422, applies_to: "POST /api/work-orders/{id}/swap, POST /api/bench-tests, POST /api/meters/{id}/install, POST /api/complaints/{id}/order-bench-test" }
  - { priority: 24, category: business_referential, check: "Reading plausibility: final_read_value >= account.last_billed_read_value; initial_read_value <= 1; reconcile requires FINAL+INITIAL readings present", error_id: "ERR_READING_SEQUENCE_INVALID | ERR_RECONCILE_READINGS_INCOMPLETE", http_status: 422, applies_to: "POST /api/work-orders/{id}/swap, POST /api/work-orders/{id}/reconcile" }
  - { priority: 25, category: business_fiscal, check: "Complaint filing requires variance_pct >= 25", error_id: ERR_COMPLAINT_VARIANCE_BELOW_THRESHOLD, http_status: 422, applies_to: "POST /api/complaints" }
  - { priority: 26, category: business_fiscal, check: "Wave lock: program.budget_committed_cents <= program.budget_total_cents (equality allowed)", error_id: ERR_BUDGET_COMMITMENT_EXCEEDED, http_status: 422, applies_to: "POST /api/waves/{id}/lock" }
  - { priority: 27, category: business_fiscal, check: "Invoice approve: net_amount_cents <= program.budget_available_cents (equality allowed)", error_id: ERR_BUDGET_AVAILABLE_EXCEEDED, http_status: 422, applies_to: "POST /api/invoices/{id}/approve" }
  - { priority: 28, category: business_fiscal, check: "Invoice submit requires units_completed >= 1", error_id: ERR_INVOICE_PERIOD_EMPTY, http_status: 422, applies_to: "POST /api/invoices/{id}/submit" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Program ---
  - { method: POST, path: "/api/programs", description: "Create program (status PLANNING)", roles: [ProgramManager], code: 201, input: [name, fiscal_year, budget_total_cents, target_meter_count, rate_per_ccf_cents, default_unit_allowance_cents, "notice_days?"], output: Program, side_effects: ["budget fields initialized to 0; posture FUNDED"] }
  - { method: GET, path: "/api/programs", description: "List programs (paginated)", roles: [ProgramManager, Scheduler, FieldContractor, QualityAuditor, AmiOperator, CustomerService], code: 200, input: ["status?", "limit?", "offset?"], output: "Program[]", side_effects: [] }
  - { method: GET, path: "/api/programs/{programId}", description: "Get program", roles: [ProgramManager, Scheduler, FieldContractor, QualityAuditor, AmiOperator, CustomerService], code: 200, input: [], output: Program, side_effects: [] }
  - { method: POST, path: "/api/programs/{programId}/activate", description: "PLANNING -> ACTIVE", roles: [ProgramManager], code: 200, input: [], output: Program, side_effects: ["status transition; version += 1"] }
  - { method: POST, path: "/api/programs/{programId}/begin-closing", description: "ACTIVE -> CLOSING (all waves terminal)", roles: [ProgramManager], code: 200, input: [], output: Program, side_effects: ["status transition; version += 1"] }
  - { method: POST, path: "/api/programs/{programId}/close", description: "CLOSING -> CLOSED (all invoices APPROVED)", roles: [ProgramManager], code: 200, input: [], output: Program, side_effects: ["status transition; version += 1"] }
  - { method: GET, path: "/api/programs/{programId}/completion-report", description: "Computed completion/budget report with both forecast variants", roles: [ProgramManager], code: 200, input: [], output: "{ completed_meter_count: integer, target_meter_count: integer, completion_pct: number, budget_total_cents: integer, budget_committed_cents: integer, budget_spent_cents: integer, budget_available_cents: integer, budget_posture: string, forecast_run_rate_date: string, forecast_stage_weighted_date: string }", side_effects: ["runs completion_forecast + budget_position"] }

  # --- Contractor ---
  - { method: POST, path: "/api/contractors", description: "Onboard contractor (status ACTIVE; program must be ACTIVE)", roles: [ProgramManager], code: 201, input: [program_id, name, crew_capacity_per_window, unit_price_cents], output: Contractor, side_effects: ["quality_score_bp = 10000"] }
  - { method: GET, path: "/api/contractors", description: "List contractors", roles: [ProgramManager, Scheduler, FieldContractor, QualityAuditor, AmiOperator, CustomerService], code: 200, input: ["program_id?", "status?", "limit?", "offset?"], output: "Contractor[]", side_effects: [] }
  - { method: GET, path: "/api/contractors/{contractorId}", description: "Get contractor", roles: [ProgramManager, Scheduler, FieldContractor, QualityAuditor, AmiOperator, CustomerService], code: 200, input: [], output: Contractor, side_effects: [] }
  - { method: POST, path: "/api/contractors/{contractorId}/suspend", description: "ACTIVE -> SUSPENDED", roles: [ProgramManager], code: 200, input: [], output: Contractor, side_effects: ["status transition; version += 1"] }
  - { method: POST, path: "/api/contractors/{contractorId}/reinstate", description: "SUSPENDED -> ACTIVE", roles: [ProgramManager], code: 200, input: [], output: Contractor, side_effects: ["status transition; version += 1"] }

  # --- ServiceAccount ---
  - { method: POST, path: "/api/accounts", description: "Register premise (status ELIGIBLE)", roles: [Scheduler], code: 201, input: [account_number, service_address, meter_location, customer_name, customer_phone, "priority_tier?", avg_daily_usage_ccf, last_billed_read_value, last_billed_read_at], output: ServiceAccount, side_effects: [] }
  - { method: GET, path: "/api/accounts", description: "List accounts", roles: [ProgramManager, Scheduler, FieldContractor, QualityAuditor, AmiOperator, CustomerService], code: 200, input: ["status?", "meter_location?", "priority_tier?", "limit?", "offset?"], output: "ServiceAccount[]", side_effects: [] }
  - { method: GET, path: "/api/accounts/{accountId}", description: "Get account", roles: [ProgramManager, Scheduler, FieldContractor, QualityAuditor, AmiOperator, CustomerService], code: 200, input: [], output: ServiceAccount, side_effects: [] }

  # --- Meter ---
  - { method: POST, path: "/api/meters", description: "Register meter in stock (IN_STOCK)", roles: [Scheduler], code: 201, input: [serial_number, size_code, technology], output: Meter, side_effects: [] }
  - { method: GET, path: "/api/meters", description: "List meters", roles: [ProgramManager, Scheduler, FieldContractor, QualityAuditor, AmiOperator, CustomerService], code: 200, input: ["service_account_id?", "status?", "technology?", "limit?", "offset?"], output: "Meter[]", side_effects: [] }
  - { method: GET, path: "/api/meters/{meterId}", description: "Get meter", roles: [ProgramManager, Scheduler, FieldContractor, QualityAuditor, AmiOperator, CustomerService], code: 200, input: [], output: Meter, side_effects: [] }
  - { method: POST, path: "/api/meters/{meterId}/install", description: "Legacy baseline install onto account (IN_STOCK -> INSTALLED)", roles: [Scheduler], code: 200, input: [service_account_id, initial_read_value, installed_at], output: Meter, side_effects: ["sets service_account_id + installed_read_value"] }
  - { method: POST, path: "/api/meters/{meterId}/dispose", description: "BENCH_PASSED -> DISPOSED; BENCH_FAILED -> RETURNED_TO_VENDOR", roles: [Scheduler], code: 200, input: [], output: Meter, side_effects: ["status transition; version += 1"] }

  # --- Wave ---
  - { method: POST, path: "/api/waves", description: "Create wave (DRAFT)", roles: [ProgramManager], code: 201, input: [program_id, wave_number, window_start, window_end, capacity], output: Wave, side_effects: [] }
  - { method: GET, path: "/api/waves", description: "List waves", roles: [ProgramManager, Scheduler, FieldContractor, QualityAuditor, AmiOperator, CustomerService], code: 200, input: ["program_id?", "status?", "limit?", "offset?"], output: "Wave[]", side_effects: [] }
  - { method: GET, path: "/api/waves/{waveId}", description: "Get wave", roles: [ProgramManager, Scheduler, FieldContractor, QualityAuditor, AmiOperator, CustomerService], code: 200, input: [], output: Wave, side_effects: [] }
  - { method: POST, path: "/api/waves/{waveId}/open", description: "DRAFT -> OPEN (window non-overlap, program ACTIVE)", roles: [ProgramManager], code: 200, input: [], output: Wave, side_effects: ["status transition; version += 1"] }
  - { method: POST, path: "/api/waves/{waveId}/lock", description: "OPEN -> LOCKED (commitment <= budget available, equality allowed)", roles: [ProgramManager], code: 200, input: [], output: Wave, side_effects: ["status transition; version += 1"] }
  - { method: POST, path: "/api/waves/{waveId}/complete", description: "LOCKED -> COMPLETE (all work orders terminal)", roles: [ProgramManager], code: 200, input: [], output: Wave, side_effects: ["status transition; version += 1"] }
  - { method: POST, path: "/api/waves/{waveId}/cancel", description: "DRAFT/OPEN -> CANCELLED (no live work orders)", roles: [ProgramManager], code: 200, input: [], output: Wave, side_effects: ["status transition; version += 1"] }

  # --- WorkOrder ---
  - { method: POST, path: "/api/work-orders", description: "Create change-out work order in an OPEN wave; captures account's INSTALLED meter as old_meter_id; commits default allowance", roles: [Scheduler], code: 201, input: [wave_id, service_account_id], output: WorkOrder, side_effects: ["lifecycle_status = CREATED; committed_amount_cents = program.default_unit_allowance_cents; account ELIGIBLE -> IN_PROGRAM; budget recompute"] }
  - { method: GET, path: "/api/work-orders", description: "List work orders", roles: [ProgramManager, Scheduler, FieldContractor, QualityAuditor, AmiOperator, CustomerService], code: 200, input: ["wave_id?", "service_account_id?", "contractor_id?", "status?", "old_meter_id?", "new_meter_id?", "limit?", "offset?"], output: "WorkOrder[]", side_effects: [] }
  - { method: GET, path: "/api/work-orders/{workOrderId}", description: "Get work order", roles: [ProgramManager, Scheduler, FieldContractor, QualityAuditor, AmiOperator, CustomerService], code: 200, input: [], output: WorkOrder, side_effects: [] }
  - { method: POST, path: "/api/work-orders/{workOrderId}/assign", description: "Assign/re-assign contractor (OCC); reprices commitment to contractor.unit_price_cents", roles: [Scheduler], code: 200, input: [contractor_id, expected_work_order_version], output: WorkOrder, side_effects: ["contractor_id set; committed_amount_cents repriced; budget recompute; increments WorkOrder.version by 1"] }
  - { method: POST, path: "/api/work-orders/{workOrderId}/swap", description: "Record physical swap with final/initial read values (OCC); cascades meter statuses, provisional true-up, account REPLACED", roles: [FieldContractor], code: 200, input: [expected_work_order_version, new_meter_id, final_read_value, initial_read_value], output: WorkOrder, side_effects: ["SCHEDULED -> SWAPPED; old meter REMOVED; new meter INSTALLED; provisional_trueup_cents computed; account -> REPLACED; increments WorkOrder.version by 1"] }
  - { method: POST, path: "/api/work-orders/{workOrderId}/reconcile", description: "SWAPPED -> RECONCILED; measured true-up + delta booked (OCC)", roles: [FieldContractor], code: 200, input: [expected_work_order_version], output: WorkOrder, side_effects: ["trueup_amount_cents + trueup_delta_cents computed; increments WorkOrder.version by 1"] }
  - { method: POST, path: "/api/work-orders/{workOrderId}/submit-rework", description: "QA_FAILED -> QA_REVIEW after corrective work (OCC)", roles: [FieldContractor], code: 200, input: [expected_work_order_version], output: WorkOrder, side_effects: ["increments WorkOrder.version by 1"] }
  - { method: POST, path: "/api/work-orders/{workOrderId}/close", description: "QA_REVIEW -> CLOSED (hold CLEAR, no PENDING audit, no open complaint/case)", roles: [Scheduler], code: 200, input: [], output: WorkOrder, side_effects: ["closed_at = clock; committed_amount_cents = 0; budget + completed counts recomputed; version += 1"] }
  - { method: POST, path: "/api/work-orders/{workOrderId}/cancel", description: "CREATED/NOTIFIED/SCHEDULED/ACCESS_FAILED -> CANCELLED", roles: [Scheduler], code: 200, input: [], output: WorkOrder, side_effects: ["commitment released; BOOKED/CONFIRMED appointments -> SUPERSEDED; account -> ELIGIBLE if no other open work order; version += 1"] }

  # --- CustomerNotification ---
  - { method: POST, path: "/api/notifications", description: "Send customer notification (status SENT, sent_at = clock)", roles: [Scheduler], code: 201, input: [work_order_id, channel], output: CustomerNotification, side_effects: ["sent_at stamped"] }
  - { method: POST, path: "/api/notifications/{notificationId}/confirm-delivery", description: "Vendor delivery callback: outcome DELIVERED | FAILED | RETURNED", roles: [Scheduler], code: 200, input: [outcome, "delivered_at?"], output: CustomerNotification, side_effects: ["DELIVERED may drive WorkOrder CREATED -> NOTIFIED (qualifying channel)"] }
  - { method: GET, path: "/api/notifications", description: "List notifications", roles: [ProgramManager, Scheduler, FieldContractor, QualityAuditor, AmiOperator, CustomerService], code: 200, input: ["work_order_id?", "no_access_case_id?", "status?", "limit?", "offset?"], output: "CustomerNotification[]", side_effects: [] }
  - { method: GET, path: "/api/notifications/{notificationId}", description: "Get notification", roles: [ProgramManager, Scheduler, FieldContractor, QualityAuditor, AmiOperator, CustomerService], code: 200, input: [], output: CustomerNotification, side_effects: [] }

  # --- Appointment ---
  - { method: POST, path: "/api/appointments", description: "Book appointment (OCC on work order); supersedes existing BOOKED/CONFIRMED appointment; notice window, slot-not-past, crew bucket enforced", roles: [Scheduler], code: 201, input: [work_order_id, slot_date, window, expected_work_order_version], output: Appointment, side_effects: ["existing BOOKED/CONFIRMED appointment -> SUPERSEDED; WorkOrder -> SCHEDULED; increments WorkOrder.version by 1"] }
  - { method: GET, path: "/api/appointments", description: "List appointments", roles: [ProgramManager, Scheduler, FieldContractor, QualityAuditor, AmiOperator, CustomerService], code: 200, input: ["work_order_id?", "contractor_id?", "slot_date?", "status?", "limit?", "offset?"], output: "Appointment[]", side_effects: [] }
  - { method: GET, path: "/api/appointments/{appointmentId}", description: "Get appointment", roles: [ProgramManager, Scheduler, FieldContractor, QualityAuditor, AmiOperator, CustomerService], code: 200, input: [], output: Appointment, side_effects: [] }
  - { method: POST, path: "/api/appointments/{appointmentId}/confirm", description: "BOOKED -> CONFIRMED (customer confirmation via CSR)", roles: [CustomerService], code: 200, input: [], output: Appointment, side_effects: ["version += 1"] }
  - { method: POST, path: "/api/appointments/{appointmentId}/complete", description: "BOOKED/CONFIRMED -> COMPLETED (crew)", roles: [FieldContractor], code: 200, input: [], output: Appointment, side_effects: ["version += 1"] }
  - { method: POST, path: "/api/appointments/{appointmentId}/no-access", description: "BOOKED/CONFIRMED -> NO_ACCESS; strike cascade on work order", roles: [FieldContractor], code: 200, input: [], output: Appointment, side_effects: ["WorkOrder strikes += 1 -> ACCESS_FAILED; at 3 strikes auto-create NoAccessCase + stage-1 DOOR_HANGER notification"] }
  - { method: POST, path: "/api/appointments/{appointmentId}/cancel", description: "BOOKED/CONFIRMED -> CANCELLED_BY_CUSTOMER (no strike)", roles: [Scheduler, CustomerService], code: 200, input: [], output: Appointment, side_effects: ["version += 1"] }

  # --- NoAccessCase ---
  - { method: GET, path: "/api/no-access-cases", description: "List no-access cases", roles: [ProgramManager, Scheduler, FieldContractor, QualityAuditor, AmiOperator, CustomerService], code: 200, input: ["work_order_id?", "stage?", "status?", "limit?", "offset?"], output: "NoAccessCase[]", side_effects: [] }
  - { method: GET, path: "/api/no-access-cases/{caseId}", description: "Get case", roles: [ProgramManager, Scheduler, FieldContractor, QualityAuditor, AmiOperator, CustomerService], code: 200, input: [], output: NoAccessCase, side_effects: [] }
  - { method: POST, path: "/api/no-access-cases/{caseId}/advance", description: "Advance escalation stage (requires current stage notification DELIVERED); auto-sends next stage notification", roles: [Scheduler], code: 200, input: [], output: NoAccessCase, side_effects: ["stage += 1; auto-create next stage CustomerNotification (none at STAGE_4); version += 1"] }
  - { method: POST, path: "/api/no-access-cases/{caseId}/resolve", description: "Resolve case (FORCED_ENTRY only at STAGE_4); ACCOUNT_EXEMPTED cancels work order and exempts account", roles: [Scheduler], code: 200, input: [resolution], output: NoAccessCase, side_effects: ["status = RESOLVED; conditional cascades per resolution"] }

  # --- MeterReading ---
  - { method: POST, path: "/api/readings", description: "Append a reading (VERIFICATION/ESTIMATED/supplemental); append-only", roles: [FieldContractor, Scheduler], code: 201, input: [work_order_id, meter_id, read_type, value, source, read_at], output: MeterReading, side_effects: [] }
  - { method: GET, path: "/api/readings", description: "List readings", roles: [ProgramManager, Scheduler, FieldContractor, QualityAuditor, AmiOperator, CustomerService], code: 200, input: ["work_order_id?", "meter_id?", "read_type?", "limit?", "offset?"], output: "MeterReading[]", side_effects: [] }
  - { method: GET, path: "/api/readings/{readingId}", description: "Get reading", roles: [ProgramManager, Scheduler, FieldContractor, QualityAuditor, AmiOperator, CustomerService], code: 200, input: [], output: MeterReading, side_effects: [] }

  # --- EndpointRegistration ---
  - { method: POST, path: "/api/endpoint-registrations", description: "Register AMI endpoint for a RECONCILED work order (status REGISTERED)", roles: [AmiOperator], code: 201, input: [work_order_id, endpoint_serial], output: EndpointRegistration, side_effects: ["meter_id copied from work order; registered_at = clock"] }
  - { method: GET, path: "/api/endpoint-registrations", description: "List registrations", roles: [ProgramManager, Scheduler, FieldContractor, QualityAuditor, AmiOperator, CustomerService], code: 200, input: ["work_order_id?", "meter_id?", "status?", "limit?", "offset?"], output: "EndpointRegistration[]", side_effects: [] }
  - { method: GET, path: "/api/endpoint-registrations/{registrationId}", description: "Get registration", roles: [ProgramManager, Scheduler, FieldContractor, QualityAuditor, AmiOperator, CustomerService], code: 200, input: [], output: EndpointRegistration, side_effects: [] }
  - { method: POST, path: "/api/endpoint-registrations/{registrationId}/verify", description: "Run comm_verification threshold -> COMM_VERIFIED | COMM_FAILED", roles: [AmiOperator], code: 200, input: [], output: EndpointRegistration, side_effects: ["COMM_VERIFIED drives WorkOrder RECONCILED -> AMI_VERIFIED -> QA_REVIEW + audit sampling"] }
  - { method: POST, path: "/api/endpoint-registrations/{registrationId}/replace", description: "COMM_FAILED -> REPLACED; creates successor registration (REGISTERED)", roles: [AmiOperator], code: 201, input: [new_endpoint_serial], output: EndpointRegistration, side_effects: ["old registration REPLACED; returns the new REGISTERED registration"] }
  - { method: POST, path: "/api/_ami/ingest-read", description: "Test-driving endpoint: ingest one AMI network read for a registration", roles: [AmiOperator], code: 200, input: [endpoint_registration_id, rssi_dbm, read_at], output: EndpointRegistration, side_effects: ["reads_received_count += 1; rssi_sum_dbm += rssi_dbm"] }

  # --- BenchTest ---
  - { method: POST, path: "/api/bench-tests", description: "Record bench test of a REMOVED meter; computes accuracies + result; links complaint (drives BENCH_TEST_ORDERED -> UNDER_REVIEW)", roles: [QualityAuditor], code: 201, input: [meter_id, "work_order_id?", "complaint_id?", measured_low_ccf, measured_mid_ccf, measured_high_ccf], output: BenchTest, side_effects: ["bench_weighted_accuracy computed; meter -> BENCH_PASSED | BENCH_FAILED; complaint linked + back to UNDER_REVIEW"] }
  - { method: GET, path: "/api/bench-tests", description: "List bench tests", roles: [ProgramManager, Scheduler, FieldContractor, QualityAuditor, AmiOperator, CustomerService], code: 200, input: ["meter_id?", "work_order_id?", "complaint_id?", "result?", "limit?", "offset?"], output: "BenchTest[]", side_effects: [] }
  - { method: GET, path: "/api/bench-tests/{benchTestId}", description: "Get bench test", roles: [ProgramManager, Scheduler, FieldContractor, QualityAuditor, AmiOperator, CustomerService], code: 200, input: [], output: BenchTest, side_effects: [] }

  # --- HighBillComplaint ---
  - { method: POST, path: "/api/complaints", description: "File high-bill complaint (variance >= 25%; WO swapped-or-later; one open per WO); sets WO hold ON_HOLD", roles: [CustomerService], code: 201, input: [service_account_id, work_order_id, claimed_bill_cents, baseline_bill_cents, billing_period_start, billing_period_end], output: HighBillComplaint, side_effects: ["variance_pct computed; WorkOrder hold_status CLEAR -> ON_HOLD"] }
  - { method: GET, path: "/api/complaints", description: "List complaints", roles: [ProgramManager, Scheduler, FieldContractor, QualityAuditor, AmiOperator, CustomerService], code: 200, input: ["service_account_id?", "work_order_id?", "bench_test_id?", "status?", "limit?", "offset?"], output: "HighBillComplaint[]", side_effects: [] }
  - { method: GET, path: "/api/complaints/{complaintId}", description: "Get complaint", roles: [ProgramManager, Scheduler, FieldContractor, QualityAuditor, AmiOperator, CustomerService], code: 200, input: [], output: HighBillComplaint, side_effects: [] }
  - { method: POST, path: "/api/complaints/{complaintId}/triage", description: "FILED -> UNDER_REVIEW", roles: [CustomerService], code: 200, input: [], output: HighBillComplaint, side_effects: ["version += 1"] }
  - { method: POST, path: "/api/complaints/{complaintId}/order-bench-test", description: "UNDER_REVIEW -> BENCH_TEST_ORDERED (old meter must be REMOVED)", roles: [CustomerService], code: 200, input: [], output: HighBillComplaint, side_effects: ["version += 1"] }
  - { method: POST, path: "/api/complaints/{complaintId}/adjudicate", description: "UNDER_REVIEW -> ADJUSTED | DENIED; computes adjustment via complaint_adjustment", roles: [CustomerService], code: 200, input: [decision], output: HighBillComplaint, side_effects: ["adjustment_cents + adjudication_variant computed; hold release when last open complaint closes"] }
  - { method: POST, path: "/api/complaints/{complaintId}/withdraw", description: "FILED/UNDER_REVIEW/BENCH_TEST_ORDERED -> WITHDRAWN", roles: [CustomerService], code: 200, input: [], output: HighBillComplaint, side_effects: ["hold release when last open complaint closes"] }

  # --- QualityAudit ---
  - { method: POST, path: "/api/quality-audits", description: "Create FOR_CAUSE audit for a work order in QA_REVIEW/QA_FAILED (SAMPLED audits are auto-created)", roles: [QualityAuditor], code: 201, input: [work_order_id, audit_type], output: QualityAudit, side_effects: ["contractor_id copied; result_status = PENDING"] }
  - { method: GET, path: "/api/quality-audits", description: "List audits", roles: [ProgramManager, Scheduler, FieldContractor, QualityAuditor, AmiOperator, CustomerService], code: 200, input: ["work_order_id?", "contractor_id?", "result_status?", "limit?", "offset?"], output: "QualityAudit[]", side_effects: [] }
  - { method: GET, path: "/api/quality-audits/{auditId}", description: "Get audit", roles: [ProgramManager, Scheduler, FieldContractor, QualityAuditor, AmiOperator, CustomerService], code: 200, input: [], output: QualityAudit, side_effects: [] }
  - { method: POST, path: "/api/quality-audits/{auditId}/record", description: "PENDING -> PASS | FAIL; FAIL cascades: WO -> QA_FAILED, contractor score recompute, auto-suspend below 9200", roles: [QualityAuditor], code: 200, input: [checks_total, checks_passed, defects_found], output: QualityAudit, side_effects: ["result_status + recorded_at; FAIL cascade per QualityAudit state machine"] }

  # --- ContractorInvoice ---
  - { method: POST, path: "/api/invoices", description: "Create DRAFT invoice for period (amounts computed at submit)", roles: [FieldContractor], code: 201, input: [contractor_id, period_start, period_end], output: ContractorInvoice, side_effects: ["program_id copied"] }
  - { method: GET, path: "/api/invoices", description: "List invoices", roles: [ProgramManager, Scheduler, FieldContractor, QualityAuditor, AmiOperator, CustomerService], code: 200, input: ["contractor_id?", "program_id?", "status?", "limit?", "offset?"], output: "ContractorInvoice[]", side_effects: [] }
  - { method: GET, path: "/api/invoices/{invoiceId}", description: "Get invoice", roles: [ProgramManager, Scheduler, FieldContractor, QualityAuditor, AmiOperator, CustomerService], code: 200, input: [], output: ContractorInvoice, side_effects: [] }
  - { method: POST, path: "/api/invoices/{invoiceId}/submit", description: "DRAFT|DISPUTED -> SUBMITTED; invoice_settlement computed and frozen", roles: [FieldContractor], code: 200, input: [], output: ContractorInvoice, side_effects: ["units/gross/bonus/penalty/retainage/net recomputed; version += 1"] }
  - { method: POST, path: "/api/invoices/{invoiceId}/approve", description: "SUBMITTED -> APPROVED; budget check (equality allowed); debits program spent", roles: [ProgramManager], code: 200, input: [], output: ContractorInvoice, side_effects: ["Program.budget_spent_cents += net_amount_cents; version += 1"] }
  - { method: POST, path: "/api/invoices/{invoiceId}/dispute", description: "SUBMITTED -> DISPUTED with reason", roles: [ProgramManager], code: 200, input: [reason], output: ContractorInvoice, side_effects: ["version += 1"] }

  # --- Test-driving clock ---
  - { method: POST, path: "/api/_clock/set_current_utc", description: "Set the logical clock (ISO 8601 UTC). Startup default is exactly 2026-05-01T00:00:00Z; the server never falls back to wall-clock time.", roles: [ProgramManager], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["all subsequent system timestamps use this clock"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_CONTRACTOR_MISMATCH, http: 403, condition: "FieldContractor X-User-ID does not own the targeted resource (contractor_id mismatch)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not resolve" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing/invalid field, bad enum member, out-of-range value" }
  - { id: ERR_ACCOUNT_NUMBER_CONFLICT, http: 409, condition: "account_number already registered" }
  - { id: ERR_METER_SERIAL_CONFLICT, http: 409, condition: "serial_number already registered" }
  - { id: ERR_AMI_ENDPOINT_SERIAL_CONFLICT, http: 409, condition: "endpoint_serial already registered (incl. replace)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid from-state for the requested transition (incl. terminal lockdown)" }
  - { id: ERR_STALE_WORK_ORDER_VERSION, http: 412, condition: "expected_work_order_version does not match current WorkOrder.version (OCC)" }
  - { id: ERR_PROGRAM_NOT_ACTIVE, http: 422, condition: "Program not ACTIVE for wave open / work order creation / contractor onboarding" }
  - { id: ERR_CRITICAL_CHANNEL_REQUIRED, http: 422, condition: "Booking a CRITICAL account without a DELIVERED CERTIFIED_MAIL notification" }
  - { id: ERR_FORCED_ENTRY_NOT_AUTHORIZED, http: 422, condition: "FORCED_ENTRY resolution attempted before STAGE_4_FIELD_VISIT" }
  - { id: ERR_BENCH_TEST_REQUIRED, http: 422, condition: "ADJUSTED adjudication with variance_pct >= 50 without a linked FAIL bench test" }
  - { id: ERR_NOTICE_WINDOW_NOT_MET, http: 422, condition: "slot_date before latest qualifying delivery + program.notice_days" }
  - { id: ERR_APPOINTMENT_SLOT_PAST, http: 422, condition: "slot_date earlier than current logical-clock date" }
  - { id: ERR_WAVE_WINDOW_OVERLAP, http: 409, condition: "Wave window intersects another OPEN/LOCKED wave of the same program (half-open; adjacency allowed)" }
  - { id: ERR_CREW_WINDOW_FULL, http: 409, condition: "Contractor's (slot_date, window) bucket already at crew_capacity_per_window" }
  - { id: ERR_WAVE_CAPACITY_EXCEEDED, http: 422, condition: "Wave committed_count already at capacity" }
  - { id: ERR_ACCOUNT_ALREADY_IN_PROGRAM, http: 409, condition: "Account already has an open work order" }
  - { id: ERR_OPEN_COMPLAINT_EXISTS, http: 409, condition: "Work order already has an open complaint (or close attempted while one is open)" }
  - { id: ERR_OPEN_NO_ACCESS_CASE, http: 409, condition: "Cancel/close attempted while a NoAccessCase is OPEN" }
  - { id: ERR_ESCALATION_STEP_REQUIRED, http: 422, condition: "Advance attempted without the current stage's notification DELIVERED" }
  - { id: ERR_CONTRACTOR_NOT_ACTIVE, http: 422, condition: "Contractor SUSPENDED (assign/booking) — only ACTIVE contractors accept work" }
  - { id: ERR_CROSS_PROGRAM_REFERENCE, http: 422, condition: "Contractor and wave/work order belong to different programs" }
  - { id: ERR_ACCOUNT_WORK_ORDER_MISMATCH, http: 422, condition: "Complaint service_account_id does not match the work order's account" }
  - { id: ERR_METER_NOT_AVAILABLE, http: 422, condition: "Meter not in required status/technology (swap: IN_STOCK AMI; bench: REMOVED; install: account already has INSTALLED meter)" }
  - { id: ERR_READING_SEQUENCE_INVALID, http: 422, condition: "final_read_value < account.last_billed_read_value, or initial_read_value > 1 (factory max)" }
  - { id: ERR_RECONCILE_READINGS_INCOMPLETE, http: 422, condition: "Reconcile without FINAL (old meter) + INITIAL (new meter) readings" }
  - { id: ERR_COMPLAINT_VARIANCE_BELOW_THRESHOLD, http: 422, condition: "Filing variance_pct < 25" }
  - { id: ERR_BUDGET_COMMITMENT_EXCEEDED, http: 422, condition: "Wave lock: wave commitments exceed program budget_available_cents" }
  - { id: ERR_BUDGET_AVAILABLE_EXCEEDED, http: 422, condition: "Invoice approve: net_amount_cents exceeds program budget_available_cents" }
  - { id: ERR_INVOICE_PERIOD_EMPTY, http: 422, condition: "Invoice submit with units_completed = 0" }

# =============================================================================
# §1.7 RBAC Matrix (segregation of duties: performer / verifier / adjudicator / payer)
# =============================================================================
roles:
  - name: ProgramManager
    description: "Utility capital-program owner: programs, waves, contractor governance, invoice approval, reporting, clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/programs, /activate, /begin-closing, /close"
      - "GET /api/programs/{id}/completion-report"
      - "POST /api/contractors, /suspend, /reinstate"
      - "POST /api/waves, /open, /lock, /complete, /cancel"
      - "POST /api/invoices/{id}/approve, /dispute"
      - "POST /api/_clock/set_current_utc"
    shared_operations: ["All GET list/detail endpoints"]
  - name: Scheduler
    description: "Utility operations scheduler: master data (accounts, meters), work order dispatch, notifications, appointments, escalations"
    identity: opaque
    exclusive_operations:
      - "POST /api/accounts"
      - "POST /api/meters, /install, /dispose"
      - "POST /api/work-orders, /assign, /close, /cancel"
      - "POST /api/notifications, /confirm-delivery"
      - "POST /api/appointments"
      - "POST /api/no-access-cases/{id}/advance, /resolve"
    shared_operations: ["POST /api/appointments/{id}/cancel (with CustomerService)", "POST /api/readings (with FieldContractor)", "All GET list/detail endpoints"]
  - name: FieldContractor
    description: "Contractor crew: performs swaps, files readings, submits invoices; acts only on resources whose contractor_id equals its identity"
    identity: "entity_backed:Contractor"
    exclusive_operations:
      - "POST /api/work-orders/{id}/swap, /reconcile, /submit-rework"
      - "POST /api/appointments/{id}/complete, /no-access"
      - "POST /api/invoices, /{id}/submit"
    shared_operations: ["POST /api/readings (with Scheduler)", "All GET list/detail endpoints"]
  - name: QualityAuditor
    description: "Independent meter shop / field QC: bench tests and quality audits — segregated from the contractor that performed the work"
    identity: opaque
    exclusive_operations:
      - "POST /api/bench-tests"
      - "POST /api/quality-audits, /{id}/record"
    shared_operations: ["All GET list/detail endpoints"]
  - name: AmiOperator
    description: "AMI network operator: endpoint registration, communication verification, replacement"
    identity: opaque
    exclusive_operations:
      - "POST /api/endpoint-registrations, /verify, /replace"
      - "POST /api/_ami/ingest-read"
    shared_operations: ["All GET list/detail endpoints"]
  - name: CustomerService
    description: "CSR: high-bill complaint intake and adjudication; appointment confirmations and customer cancellations"
    identity: opaque
    exclusive_operations:
      - "POST /api/complaints, /triage, /order-bench-test, /adjudicate, /withdraw"
      - "POST /api/appointments/{id}/confirm"
    shared_operations: ["POST /api/appointments/{id}/cancel (with Scheduler)", "All GET list/detail endpoints"]




