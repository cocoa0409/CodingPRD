# =============================================================================
# §1.7 RBAC Permission Matrix (segregation of duties)
# =============================================================================
roles:

  - name: StateAdmin
    description: "State distributing agency staff: registers program configuration (service areas, agencies, commodities, warehouses), records federal entitlement receipts, runs the allocation cycle and its ops-run checkpoints, proposes inventory transfers and executes recalls."
    identity: "opaque"
    exclusive_operations:
      - "POST /efap/service-areas"
      - "PATCH /efap/service-areas/{service_area_id}"
      - "POST /efap/agencies"
      - "PATCH /efap/agencies/{agency_id}"
      - "POST /efap/compliance-sweeps"
      - "POST /efap/commodities"
      - "POST /efap/warehouses"
      - "PATCH /efap/warehouses/{warehouse_id}"
      - "POST /efap/inventory-lots"
      - "POST /efap/inventory-lots/{inventory_lot_id}/post"
      - "POST /efap/inventory-monitor-runs"
      - "POST /efap/allocation-cycles"
      - "POST /efap/allocation-cycles/{cycle_id}/compute-allocations"
      - "POST /efap/allocation-cycles/{cycle_id}/open-window"
      - "POST /efap/allocation-cycles/{cycle_id}/close-window"
      - "POST /efap/allocation-cycles/{cycle_id}/finalize"
      - "POST /efap/inventory-transfers"
      - "POST /efap/recalls"
      - "POST /efap/recalls/{recall_id}/dispatch-notices"
      - "POST /efap/recalls/{recall_id}/expand"
      - "POST /efap/recalls/{recall_id}/close"
      - "POST /efap/delivery-appointments/{appointment_id}/cancel"
      - "POST /efap/_clock/set_current_utc"
    shared_operations:
      - "POST /efap/delivery-appointments (with StateWarehouseOperator)"
      - "POST /efap/commodity-orders/{order_id}/cancel (with AgencyCoordinator)"
      - "every GET endpoint"
    notes: "Cannot approve an order, cannot renew an agreement, cannot record a training, and cannot close a recall it raised itself (recall.initiated_by_user_id)."

  - name: ComplianceReviewer
    description: "State compliance staff: owns agency eligibility paperwork (agreement approval and renewal, civil rights training records) and the order review gate (return for revision, approve)."
    identity: "opaque"
    exclusive_operations:
      - "POST /efap/agencies/{agency_id}/agreement-renewals"
      - "POST /efap/agencies/{agency_id}/civil-rights-trainings"
      - "POST /efap/commodity-orders/{order_id}/return-for-revision"
      - "POST /efap/commodity-orders/{order_id}/approve"
    shared_operations:
      - "every GET endpoint"
    notes: "A reviewer who returned an order for revision may not approve the resubmission (order.last_returned_by_user_id). Cannot create program configuration, cannot run any ops checkpoint, cannot schedule or confirm deliveries."

  - name: AgencyCoordinator
    description: "Emergency feeding organization staff. X-User-ID equals the Agency.id they represent, so every write is ownership-checked."
    identity: "entity_backed:Agency"
    exclusive_operations:
      - "POST /efap/commodity-orders"
      - "POST /efap/commodity-orders/{order_id}/lines"
      - "POST /efap/commodity-orders/{order_id}/submit"
      - "POST /efap/inventory-transfers/{transfer_id}/accept"
      - "POST /efap/inventory-transfers/{transfer_id}/decline"
      - "POST /efap/recall-actions/{recall_action_id}/acknowledge"
      - "POST /efap/recall-actions/{recall_action_id}/report-disposition"
      - "POST /efap/household-distributions"
      - "POST /efap/household-distributions/{distribution_id}/void"
    shared_operations:
      - "POST /efap/commodity-orders/{order_id}/cancel (with StateAdmin)"
      - "every GET endpoint"
    notes: "Cannot approve its own order, cannot post lots, cannot book or confirm a dock appointment, and cannot touch another agency's rows (ERR_NOT_RESOURCE_OWNER)."

  - name: StateWarehouseOperator
    description: "Warehouse dock staff. X-User-ID equals the Warehouse.id they operate, so appointment confirmation is ownership-checked."
    identity: "entity_backed:Warehouse"
    exclusive_operations:
      - "POST /efap/delivery-appointments/{appointment_id}/confirm-delivery"
    shared_operations:
      - "POST /efap/delivery-appointments (with StateAdmin)"
      - "every GET endpoint"
    notes: "Cannot cancel an appointment (StateAdmin only), cannot approve orders, cannot run the inventory monitor, and cannot confirm a delivery at another warehouse."
