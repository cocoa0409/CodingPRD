            - call: "POST /merchandise/containers/${cont_id}/receive"
              payload: {}
              as: ImportCoordinator
          trigger:
            - call: "POST /merchandise/allocation-lines"
              payload: { container_id: "${cont_id}", store_id: "${store_id}", item_id: "${item_id}", sequence: 1, requested_units: 40 }
              as: MerchandiseBuyer
              captures: { err_role: $.data.error_id }
            - call: "GET /merchandise/containers/${cont_id}/allocation-lines"
              payload: {}
              as: MerchandiseAnalyst
          assert:
            - "the allocation attempt returns 403 and err_role == ERR_INSUFFICIENT_ROLE"
            - "the container's allocation-line read returns exactly 0 rows"
            - "Container.${cont_id}.status == RECEIVED — a line-free container never auto-advances to ALLOCATED"
            - "the same payload under DistributionCenterOperator returns 201 and Container.${cont_id}.status becomes RECEIVED still, because a fresh line reopens the container"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: conversion_projects_list_filters_by_status_and_paginates
        claim_type: pagination_with_filtering
        grounds:
          - complexity_profile.complexity_layers
          - endpoints.GET_/merchandise/conversion-projects
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With two conversion projects on file the status filter narrows the whole set while limit and offset page it: limit=1 returns 1 row with total_count 2 and has_more true, and the status filter cuts the set to 1."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An ACTIVE 125-cent point, an ACTIVE 300-cent point, and two CONVERTING stores each with a DRAFT project."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /merchandise/price-points"
              payload: { label: "DOLLAR_25", shelf_price_cents: 125, target_landed_cost_ratio: 0.90 }
              as: MerchandiseBuyer
              captures: { pp125_id: $.data.id }
            - call: "POST /merchandise/price-points/${pp125_id}/activate"
              payload: {}
              as: MerchandiseBuyer
            - call: "POST /merchandise/price-points"
              payload: { label: "THREE_DOLLAR_25", shelf_price_cents: 300, target_landed_cost_ratio: 0.40 }
              as: MerchandiseBuyer
              captures: { pp300_id: $.data.id }
            - call: "POST /merchandise/price-points/${pp300_id}/activate"
              payload: {}
              as: MerchandiseBuyer
            - call: "POST /merchandise/stores"
              payload: { store_number: "1927", shelf_facing_capacity_sqft: 400.0 }
              as: StoreOperationsManager
              captures: { store_a: $.data.id }
            - call: "POST /merchandise/stores"
              payload: { store_number: "2031", shelf_facing_capacity_sqft: 300.0 }
              as: StoreOperationsManager
              captures: { store_b: $.data.id }
            - call: "POST /merchandise/stores/${store_a}/conversions"
              payload: { to_price_point_id: "${pp300_id}" }
              as: StoreOperationsManager
              captures: { store_a_v: $.data.version }
            - call: "POST /merchandise/conversion-projects"
              payload: { store_id: "${store_a}", from_price_point_id: "${pp125_id}", to_price_point_id: "${pp300_id}", expected_store_version: "${store_a_v}" }
              as: StoreOperationsManager
              captures: { proj_a: $.data.id }
            - call: "POST /merchandise/stores/${store_b}/conversions"
              payload: { to_price_point_id: "${pp300_id}" }
              as: StoreOperationsManager
              captures: { store_b_v: $.data.version }
            - call: "POST /merchandise/conversion-projects"
              payload: { store_id: "${store_b}", from_price_point_id: "${pp125_id}", to_price_point_id: "${pp300_id}", expected_store_version: "${store_b_v}" }
              as: StoreOperationsManager
              captures: { proj_b: $.data.id }
            - call: "POST /merchandise/conversion-projects/${proj_b}/start"
              payload: {}
              as: StoreOperationsManager
          trigger:
            - call: "GET /merchandise/conversion-projects"
              payload: { limit: 1, offset: 0 }
              as: MerchandiseAnalyst
            - call: "GET /merchandise/conversion-projects"
              payload: { status: "DRAFT" }
              as: MerchandiseAnalyst
            - call: "GET /merchandise/conversion-projects"
              payload: { status: "IN_PROGRESS" }
              as: MerchandiseAnalyst
          assert:
            - "the paged read returns exactly 1 row with total_count == 2 and has_more == true"
            - "the DRAFT-filtered read returns exactly 1 row, project ${proj_a}"
            - "the IN_PROGRESS-filtered read returns exactly 1 row, project ${proj_b}"
            - "GET /merchandise/conversion-projects?store_id=${store_a} returns exactly 1 row"
            - "an unfiltered read with no query parameters returns 2 rows with limit defaulting to 10"

      - name: store_open_violation_count_reconciles_with_manual_resolution
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Store.fields.open_violation_count
          - endpoints.POST_/merchandise/price-integrity-audits/{id}/resolve
          - endpoints.GET_/merchandise/stores/{id}
        distinguishing_aspect: "open_violation_count is denormalized off the audit rows, so filing two violations reads 2, resolving one reads 1, and resolving the other reads 0 — and a WITHIN_TOLERANCE audit never counts at all."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An ACTIVE 125-cent point and one store."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /merchandise/price-points"
              payload: { label: "DOLLAR_25", shelf_price_cents: 125, target_landed_cost_ratio: 0.90 }
              as: MerchandiseBuyer
              captures: { pp125_id: $.data.id }
            - call: "POST /merchandise/price-points/${pp125_id}/activate"
              payload: {}
              as: MerchandiseBuyer
            - call: "POST /merchandise/stores"
              payload: { store_number: "1927", shelf_facing_capacity_sqft: 400.0 }
              as: StoreOperationsManager
              captures: { store_id: $.data.id }
            - call: "POST /merchandise/price-integrity-audits"
              payload: { store_id: "${store_id}", price_point_id: "${pp125_id}", audited_at: "2026-09-03T00:00:00Z", observed_item_count: 80, mismatched_item_count: 5 }
              as: StoreOperationsManager
              captures: { audit_v1: $.data.id }
            - call: "POST /merchandise/price-integrity-audits"
              payload: { store_id: "${store_id}", price_point_id: "${pp125_id}", audited_at: "2026-09-04T00:00:00Z", observed_item_count: 100, mismatched_item_count: 6 }
              as: StoreOperationsManager
              captures: { audit_v2: $.data.id }
            - call: "POST /merchandise/price-integrity-audits"
              payload: { store_id: "${store_id}", price_point_id: "${pp125_id}", audited_at: "2026-09-05T00:00:00Z", observed_item_count: 100, mismatched_item_count: 3 }
              as: StoreOperationsManager
              captures: { audit_ok: $.data.id }
          trigger:
            - call: "GET /merchandise/stores/${store_id}"
              payload: {}
              as: MerchandiseAnalyst
              captures: { open_before: $.data.open_violation_count, total_audits: $.data.price_integrity_audit_count }
            - call: "POST /merchandise/price-integrity-audits/${audit_v1}/resolve"
              payload: {}
              as: StoreOperationsManager
            - call: "GET /merchandise/stores/${store_id}"
              payload: {}
              as: MerchandiseAnalyst
              captures: { open_mid: $.data.open_violation_count }
            - call: "POST /merchandise/price-integrity-audits/${audit_v2}/resolve"
              payload: {}
              as: StoreOperationsManager
            - call: "GET /merchandise/stores/${store_id}"
              payload: {}
              as: MerchandiseAnalyst
              captures: { open_after: $.data.open_violation_count }
          assert:
            - "open_before == 2 and total_audits == 3 — the third audit is WITHIN_TOLERANCE and never counted"
            - "PriceIntegrityAudit.${audit_ok}.result == WITHIN_TOLERANCE with mismatch_ratio == 0.030"
            - "open_mid == 1 after the first resolution"
            - "open_after == 0 after the second"
            - "price_integrity_audit_count is unchanged at 3 across all three reads — resolution closes a violation without removing the visit"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: item_cost_fields_are_visible_in_the_same_response_that_writes_them
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/merchandise/items/{id}/landed-costs
          - entities.Item.fields.break_even_units
          - entities.Item.fields.net_contribution_cents_per_unit
        distinguishing_aspect: "Every derived cost field is immediate: a single landed-cost write returns the new landed_cost_cents, the new break_even_units and the new net_contribution_cents_per_unit in that same response, with no re-read and no eventual convergence window."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An ACTIVE 125-cent point, one import vendor, one price-assigned item with base_landed_cost_cents 105."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /merchandise/price-points"
              payload: { label: "DOLLAR_25", shelf_price_cents: 125, target_landed_cost_ratio: 0.90 }
              as: MerchandiseBuyer
              captures: { pp125_id: $.data.id }
            - call: "POST /merchandise/price-points/${pp125_id}/activate"
              payload: {}
              as: MerchandiseBuyer
            - call: "POST /merchandise/vendors"
              payload: { vendor_name: "Ningbo Home Goods Co", country_of_origin: "CN", import_flag: true }
              as: MerchandiseBuyer
              captures: { vendor_x_id: $.data.id }
            - call: "POST /merchandise/items"
              payload: { sku: "1001", description: "Bath Bar 4ct", unit_retail_cents: 125, commodity_class: "BATH", season_code: "", sqft_per_unit: 0.1, shelf_package_capacity: 4.0, units_per_case: 4, base_landed_cost_cents: 105, fixed_store_handling_cents: 6, variable_store_cost_cents: 4, sourcing_vendor_id: "${vendor_x_id}" }
              as: MerchandiseBuyer
              captures: { item_id: $.data.id }
            - call: "POST /merchandise/items/${item_id}/price-assignments"
              payload: { price_point_id: "${pp125_id}" }
              as: MerchandiseBuyer
          trigger:
            - call: "POST /merchandise/items/${item_id}/landed-costs"
              payload: { method: "VENDOR_PRICE_CHANGE", applied_amount_cents: 100 }
              as: MerchandiseBuyer
              captures: { hist_id: $.data.id }
            - call: "GET /merchandise/items/${item_id}/break-even"
              payload: {}
              as: MerchandiseBuyer
              captures: { be: $.data.break_even_units, regime: $.data.regime }
          assert:
            - "LandedCostHistory.${hist_id}.applied_amount_cents == 100 and effective_sequence == 1"
            - "the write's own response already carried the recomputed item: landed_cost_cents 100, break_even_units 4, net_contribution_cents_per_unit 21"
            - "the immediate break-even read agrees: be == 4 and regime == CONVERGENCE"
            - "ceil((100 * 4 + 6) / (125 - 4)) == ceil(406 / 121) == 4"
            - "the item's status is COST_PENDING in the same response — no eventual window separates the cost write from the lifecycle move"
