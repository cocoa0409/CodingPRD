          setup:
            - "Clock 2026-05-01T00:00:00Z; LEVEL_4 rider; MASTER instructor; horse Comet."
            - "Comet carries 2026-05-11 09:00 for 90 min, 2026-05-11 10:45 for 60 min and 2026-05-12 09:00 for 90 min: exactly 240 committed minutes in the week starting Monday 2026-05-11."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /condition-policies"
              payload: { condition_code: "CP_MILD_ASD", activity_type: "THERAPEUTIC_RIDING", tier: "CLEAR", min_instructor_tier: "REGISTERED" }
              as: ProgramAdmin
            - call: "POST /horses"
              payload: { name: "Comet", body_weight_lb: 1100, tack_weight_lb: 30 }
              as: ProgramAdmin
              captures: { h1_id: "$.data.id" }
            - call: "POST /instructors"
              payload: { full_name: "Ada Reins", certification_level: "MASTER", certification_expires_at: "2028-04-30T00:00:00Z" }
              as: ProgramAdmin
              captures: { i1_id: "$.data.id" }
            - call: "POST /riders"
              payload: { full_name: "Rae Rider", date_of_birth: "2012-03-04", weight_lb: 150, household_income_band: "BAND_D", demographic_group: "ADULT", program_code: "THERAPEUTIC_RIDING", condition_codes: ["CP_MILD_ASD"], funding_mode: "PRIVATE_PAY_ALLOWED", payer_rate_cents: 0 }
              as: IntakeCoordinator
              captures: { r1_id: "$.data.id", r1_v1: "$.data.version" }
            - call: "POST /riders/${r1_id}/medical-releases"
              payload: { signed_on: "2026-04-01", physician_name: "Dr Oak", cleared_condition_codes: [], expected_rider_version: "${r1_v1}" }
              as: IntakeCoordinator
            - call: "GET /riders/${r1_id}"
              payload: {}
              as: IntakeCoordinator
              captures: { r1_v2: "$.data.version" }
            - call: "POST /riders/${r1_id}/assessments"
              payload: { assessment_type: "INTAKE", performed_on: "2026-04-01", balance_score: 9, trunk_control_score: 9, rider_weight_lb: 150, backriding_required: false, expected_rider_version: "${r1_v2}" }
              as: Instructor
              as_user_id: "${i1_id}"
            - call: "POST /riders/${r1_id}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /sessions"
              payload: { rider_id: "${r1_id}", horse_id: "${h1_id}", instructor_id: "${i1_id}", activity_type: "THERAPEUTIC_RIDING", scheduled_start: "2026-05-11T09:00:00Z", duration_minutes: 90 }
              as: Instructor
              as_user_id: "${i1_id}"
              captures: { s_mon1_id: "$.data.id" }
            - call: "POST /sessions"
              payload: { rider_id: "${r1_id}", horse_id: "${h1_id}", instructor_id: "${i1_id}", activity_type: "THERAPEUTIC_RIDING", scheduled_start: "2026-05-11T10:45:00Z", duration_minutes: 60 }
              as: Instructor
              as_user_id: "${i1_id}"
              captures: { s_mon2_id: "$.data.id" }
            - call: "POST /sessions"
              payload: { rider_id: "${r1_id}", horse_id: "${h1_id}", instructor_id: "${i1_id}", activity_type: "THERAPEUTIC_RIDING", scheduled_start: "2026-05-12T09:00:00Z", duration_minutes: 90 }
              as: Instructor
              as_user_id: "${i1_id}"
              captures: { s_tue_id: "$.data.id" }
          trigger:
            - call: "POST /sessions"
              payload: { rider_id: "${r1_id}", horse_id: "${h1_id}", instructor_id: "${i1_id}", activity_type: "THERAPEUTIC_RIDING", scheduled_start: "2026-05-12T10:45:00Z", duration_minutes: 30 }
              as: Instructor
              as_user_id: "${i1_id}"
              captures: { err_id: "$.data.error_id" }
            - call: "POST /sessions/${s_tue_id}/cancel"
              payload: { cancellation_reason: "WEATHER" }
              as: Instructor
              as_user_id: "${i1_id}"
            - call: "POST /sessions"
              payload: { rider_id: "${r1_id}", horse_id: "${h1_id}", instructor_id: "${i1_id}", activity_type: "THERAPEUTIC_RIDING", scheduled_start: "2026-05-12T10:45:00Z", duration_minutes: 30 }
              as: Instructor
              as_user_id: "${i1_id}"
              captures: { s_retry_id: "$.data.id" }
            - call: "GET /horses/${h1_id}/workload"
              payload: { on_date: "2026-05-12", variant: "committed" }
              as: ProgramAdmin
              captures: { wk_after: "$.data.week_minutes" }
          assert:
            - "${err_id} == ERR_HORSE_WEEKLY_MINUTES_EXCEEDED with HTTP status 422"
            - "Session.${s_tue_id}.schedule_status == CANCELLED and cancellation_reason == WEATHER"
            - "No Charge exists with session_id ${s_tue_id} - a weather cancellation is never chargeable"
            - "The retry returns HTTP 201 and Session.${s_retry_id}.schedule_status == CREW_PENDING"
            - "${wk_after} == 180"
            - "GET /horses/${h1_id}/workload for 2026-05-12 with variant committed reports week_start_date == 2026-05-11, day_minutes == 30 and week_remaining_minutes == 60"
