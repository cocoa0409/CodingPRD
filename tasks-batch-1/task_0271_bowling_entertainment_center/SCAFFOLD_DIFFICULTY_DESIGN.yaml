              as: FrontDesk
              captures: { r_id: $.data.id }
            - call: "POST /reservations/${r_id}/hold"
              payload: {}
              as: FrontDesk
            - call: "POST /customers/${c_id}/suspend"
              payload: {}
              as: CenterManager
          trigger:
            - call: "POST /reservations/${r_id}/hold"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "Reservation.${r_id}.status == EXPIRED after suspend cascade"
            - "response.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"

