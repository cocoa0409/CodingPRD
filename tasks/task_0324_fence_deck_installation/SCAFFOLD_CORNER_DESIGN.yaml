# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Fence & Deck Installation — breadth probe across §1.1–§1.7 testable claims.
# Walks references/claim-extraction-guide.md row-by-row against this scaffold.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_project_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Project, endpoints]
        distinguishing_aspect: "POST /projects with required fields returns 201; response carries system id, status=DRAFT, contract_total 0.00, permit_clearance PENDING, version 1."
        test_recipe:
          setup: ["A customer exists"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cre A", email: "cre@x.com", hoa_governed: false }
              as: ProjectManager
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", site_address: "1 Create", job_type: "FENCE" }
              as: ProjectManager
              captures: { proj_id: $.data.id }
          assert:
            - "response code == 201"
            - "Project.${proj_id}.status == DRAFT"
            - "Project.${proj_id}.contract_total == 0.00"
            - "Project.${proj_id}.permit_clearance == PENDING"
            - "Project.${proj_id}.version == 1"

      - name: create_project_missing_job_type_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Project.fields.job_type, "validations[priority=5]"]
        distinguishing_aspect: "job_type is source:input with no default; omitting it yields ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A customer exists"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cre B", email: "creb@x.com", hoa_governed: false }
              as: ProjectManager
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", site_address: "2 NoType" }
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: get_project_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Project, "validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /projects/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /projects/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"

      - name: lineitem_default_accessory_and_slope_applied
        claim_type: Defaults
        grounds: [entities.LineItem.fields.accessory, entities.LineItem.fields.grade_slope_pct]
        distinguishing_aspect: "Omitting accessory and grade_slope_pct defaults them to NONE and 0; a CEDAR/PRIVACY 100ft line then prices to line_material_cost 4250.00 (no adder, no surcharge)."
        test_recipe:
          setup: ["A DRAFT estimate exists"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Def A", email: "def@x.com", hoa_governed: false }
              as: ProjectManager
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", site_address: "3 Def", job_type: "FENCE" }
              as: ProjectManager
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/estimates"
              payload: {}
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "POST /line-items"
              payload: { estimate_id: "${est_id}", work_type: "FENCE", material: "CEDAR", style: "PRIVACY", quantity_units: 100 }
              as: Estimator
              captures: { li_id: $.data.id }
          trigger:
            - call: "POST /projects/${proj_id}/estimates/${est_id}/price"
              payload: {}
              as: Estimator
          assert:
            - "LineItem.${li_id}.accessory == NONE"
            - "LineItem.${li_id}.grade_slope_pct == 0"
            - "LineItem.${li_id}.line_material_cost == 4250.00"

      - name: estimate_tax_rate_default_applied
        claim_type: Defaults
        grounds: [entities.Estimate.fields.tax_rate_pct]
        distinguishing_aspect: "Creating an estimate without tax_rate_pct defaults it to 7.25."
        test_recipe:
          setup: ["A project exists"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Def C", email: "defc@x.com", hoa_governed: false }
              as: ProjectManager
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", site_address: "4 Def", job_type: "FENCE" }
              as: ProjectManager
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /projects/${proj_id}/estimates"
              payload: {}
              as: Estimator
              captures: { est_id: $.data.id }
          assert:
            - "Estimate.${est_id}.tax_rate_pct == 7.25"

      - name: customer_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.Customer]
        distinguishing_aspect: "Customer is common_fields:false — it has id and created_at but no version/updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["A customer exists"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Imm A", email: "imm@x.com", hoa_governed: true }
              as: ProjectManager
              captures: { cust_id: $.data.id }
          trigger:
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: ProjectManager
          assert:
            - "Customer.${cust_id}.hoa_governed == true"
            - "Customer response has no version field"

      - name: project_balance_due_computed_field
        claim_type: Computed Fields
        grounds: [entities.Project.fields.balance_due, entities.Project.fields.contract_total]
        distinguishing_aspect: "balance_due is computed = contract_total - draws_paid_total; on a freshly accepted estimate (no draws paid) balance_due == contract_total 21605.04."
        test_recipe:
          setup: ["Accepted estimate (fence 120 + deck 200), contract_total 21605.04, no draws paid"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Comp A", email: "cmp@x.com", hoa_governed: false }
              as: ProjectManager
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", site_address: "5 Comp", job_type: "FENCE_AND_DECK" }
              as: ProjectManager
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/estimates"
              payload: {}
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "POST /line-items"
              payload: { estimate_id: "${est_id}", work_type: "FENCE", material: "CEDAR", style: "PRIVACY", quantity_units: 120, accessory: "SINGLE_GATE", grade_slope_pct: 10 }
              as: Estimator
            - call: "POST /line-items"
              payload: { estimate_id: "${est_id}", work_type: "DECK", material: "COMPOSITE", style: "DECK_STANDARD", quantity_units: 200, accessory: "STAIR_SET", grade_slope_pct: 20 }
              as: Estimator
            - call: "POST /projects/${proj_id}/estimates/${est_id}/price"
              payload: {}
              as: Estimator
          trigger:
            - call: "POST /projects/${proj_id}/estimates/${est_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Project.${proj_id}.contract_total == 21605.04"
            - "Project.${proj_id}.draws_paid_total == 0.00"
            - "Project.${proj_id}.balance_due == 21605.04"

      - name: create_project_unresolvable_customer_returns_reference_not_found
        claim_type: Parent Relationships
        grounds: [entities.Project.fields.customer_id, "validations[priority=4]", "errors[ERR_REFERENCE_NOT_FOUND]"]
        distinguishing_aspect: "POST /projects with a customer_id that resolves to no Customer returns ERR_REFERENCE_NOT_FOUND (422)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /projects"
              payload: { customer_id: "00000000-0000-4000-8000-000000000999", site_address: "6 NoCust", job_type: "FENCE" }
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_REFERENCE_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: price_already_priced_estimate_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Estimate.DRAFT_to_PRICED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Pricing an estimate already in PRICED is an undefined transition from PRICED — returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["An estimate priced once (PRICED) with one line item"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Inv S", email: "ivs@x.com", hoa_governed: false }
              as: ProjectManager
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", site_address: "7 InvS", job_type: "FENCE" }
              as: ProjectManager
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/estimates"
              payload: {}
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "POST /line-items"
              payload: { estimate_id: "${est_id}", work_type: "FENCE", material: "CEDAR", style: "PRIVACY", quantity_units: 100 }
              as: Estimator
            - call: "POST /projects/${proj_id}/estimates/${est_id}/price"
              payload: {}
              as: Estimator
          trigger:
            - call: "POST /projects/${proj_id}/estimates/${est_id}/price"
              payload: {}
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: accept_unpriced_estimate_returns_estimate_not_priced
        claim_type: Precondition Enforcement
        grounds: [state_machines.Estimate.PRICED_to_ACCEPTED, "errors[ERR_ESTIMATE_NOT_PRICED]"]
        distinguishing_aspect: "Accepting a DRAFT (unpriced) estimate violates the PRICED precondition — returns ERR_ESTIMATE_NOT_PRICED (409)."
        test_recipe:
          setup: ["A DRAFT estimate with a line item but not yet priced"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "NP A", email: "np@x.com", hoa_governed: false }
              as: ProjectManager
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", site_address: "8 NP", job_type: "FENCE" }
              as: ProjectManager
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/estimates"
              payload: {}
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "POST /line-items"
              payload: { estimate_id: "${est_id}", work_type: "FENCE", material: "CEDAR", style: "PRIVACY", quantity_units: 100 }
              as: Estimator
          trigger:
            - call: "POST /projects/${proj_id}/estimates/${est_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ESTIMATE_NOT_PRICED"

      - name: permit_submit_before_measured_returns_permit_too_early
        claim_type: Precondition Enforcement
        grounds: [state_machines.Permit.DRAFT_to_SUBMITTED, "errors[ERR_PERMIT_TOO_EARLY]"]
        distinguishing_aspect: "Submitting a permit while the project is only ESTIMATED (not yet MEASURED) returns ERR_PERMIT_TOO_EARLY (409)."
        test_recipe:
          setup: ["Project ESTIMATED (accepted estimate, no site measure approved) with a DRAFT permit"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "PE A", email: "pe@x.com", hoa_governed: false }
              as: ProjectManager
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", site_address: "9 PE", job_type: "FENCE" }
              as: ProjectManager
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/estimates"
              payload: {}
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "POST /line-items"
              payload: { estimate_id: "${est_id}", work_type: "FENCE", material: "CEDAR", style: "PRIVACY", quantity_units: 100 }
              as: Estimator
            - call: "POST /projects/${proj_id}/estimates/${est_id}/price"
              payload: {}
              as: Estimator
            - call: "POST /projects/${proj_id}/estimates/${est_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /projects/${proj_id}/permits"
              payload: { permit_type: "FENCE_PERMIT", jurisdiction: "City of Elm" }
              as: PermitClerk
              captures: { permit_id: $.data.id }
          trigger:
            - call: "POST /projects/${proj_id}/permits/${permit_id}/submit"
              payload: {}
              as: PermitClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PERMIT_TOO_EARLY"

      - name: permit_denied_blocks_clearance
        claim_type: Side Effect Execution
        grounds: [state_machines.Permit.SUBMITTED_to_DENIED, entities.Project.fields.permit_clearance]
        distinguishing_aspect: "Denying a submitted permit sets Project.permit_clearance to BLOCKED and the project does not advance to APPROVED."
        test_recipe:
          setup: ["Project MEASURED with one SUBMITTED FENCE_PERMIT"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Den A", email: "den@x.com", hoa_governed: false }
              as: ProjectManager
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", site_address: "10 Den", job_type: "FENCE" }
              as: ProjectManager
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/estimates"
              payload: {}
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "POST /line-items"
              payload: { estimate_id: "${est_id}", work_type: "FENCE", material: "CEDAR", style: "PRIVACY", quantity_units: 100 }
              as: Estimator
              captures: { li_id: $.data.id }
            - call: "POST /projects/${proj_id}/estimates/${est_id}/price"
              payload: {}
              as: Estimator
            - call: "POST /projects/${proj_id}/estimates/${est_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /projects/${proj_id}/site-measures"
              payload: { measured_quantities: [ { line_item_id: "${li_id}", measured_units: 100 } ], property_line_note: "clear", setback_ok: true }
              as: FieldTech
              captures: { sm_id: $.data.id }
            - call: "POST /projects/${proj_id}/site-measures/${sm_id}/approve"
              payload: {}
              as: ProjectManager
            - call: "POST /projects/${proj_id}/permits"
              payload: { permit_type: "FENCE_PERMIT", jurisdiction: "City of Elm" }
              as: PermitClerk
              captures: { permit_id: $.data.id }
            - call: "POST /projects/${proj_id}/permits/${permit_id}/submit"
              payload: {}
              as: PermitClerk
          trigger:
            - call: "POST /projects/${proj_id}/permits/${permit_id}/decide"
              payload: { decision: "DENY" }
              as: PermitClerk
          assert:
            - "Permit.${permit_id}.status == DENIED"
            - "Project.${proj_id}.permit_clearance == BLOCKED"
            - "Project.${proj_id}.status == MEASURED"

      - name: cancel_terminal_completed_project_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Project.terminal_states, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a COMPLETED project (terminal) is undefined and returns ERR_INVALID_STATE; project stays COMPLETED."
        test_recipe:
          setup: ["A project driven all the way to COMPLETED (single fence line, all draws paid, FINAL paid)"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Term A", email: "trm@x.com", hoa_governed: false }
              as: ProjectManager
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", site_address: "11 Term", job_type: "FENCE" }
              as: ProjectManager
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/estimates"
              payload: {}
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "POST /line-items"
              payload: { estimate_id: "${est_id}", work_type: "FENCE", material: "CEDAR", style: "PRIVACY", quantity_units: 100 }
              as: Estimator
              captures: { li_id: $.data.id }
            - call: "POST /projects/${proj_id}/estimates/${est_id}/price"
              payload: {}
              as: Estimator
            - call: "POST /projects/${proj_id}/estimates/${est_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /projects/${proj_id}/site-measures"
              payload: { measured_quantities: [ { line_item_id: "${li_id}", measured_units: 100 } ], property_line_note: "clear", setback_ok: true }
              as: FieldTech
              captures: { sm_id: $.data.id }
            - call: "POST /projects/${proj_id}/site-measures/${sm_id}/approve"
              payload: {}
              as: ProjectManager
            - call: "POST /projects/${proj_id}/permits"
              payload: { permit_type: "FENCE_PERMIT", jurisdiction: "City of Elm" }
              as: PermitClerk
              captures: { permit_id: $.data.id }
            - call: "POST /projects/${proj_id}/permits/${permit_id}/submit"
              payload: {}
              as: PermitClerk
            - call: "POST /projects/${proj_id}/permits/${permit_id}/decide"
              payload: { decision: "ISSUE" }
              as: PermitClerk
            - call: "POST /projects/${proj_id}/material-orders"
              payload: { supplier_name: "Acme", dock_id: "DOCK_T", delivery_window_start: "2026-07-01T08:00:00Z", delivery_window_end: "2026-07-01T12:00:00Z" }
              as: ProjectManager
              captures: { mo_id: $.data.id }
            - call: "POST /projects/${proj_id}/material-orders/${mo_id}/confirm"
              payload: {}
              as: ProjectManager
            - call: "POST /projects/${proj_id}/material-orders/${mo_id}/deliver"
              payload: {}
              as: FieldTech
            - call: "POST /projects/${proj_id}/crew-bookings"
              payload: { crew_id: "CREW_T", window_start: "2026-07-20T08:00:00Z", window_end: "2026-07-20T17:00:00Z" }
              as: FieldTech
              captures: { cb_id: $.data.id }
            - call: "POST /projects/${proj_id}/crew-bookings/${cb_id}/confirm"
              payload: {}
              as: FieldTech
            - call: "GET /projects/${proj_id}/draws"
              payload: {}
              as: ProjectManager
              captures: { dep_id: "$.data[0].id", del_id: "$.data[1].id", fra_id: "$.data[2].id", fin_id: "$.data[3].id" }
            - call: "POST /projects/${proj_id}/draws/${dep_id}/invoice"
              payload: {}
              as: ProjectManager
            - call: "POST /projects/${proj_id}/draws/${dep_id}/pay"
              payload: {}
              as: ProjectManager
            - call: "POST /projects/${proj_id}/draws/${del_id}/pay"
              payload: {}
              as: ProjectManager
            - call: "POST /projects/${proj_id}/draws/${fra_id}/invoice"
              payload: {}
              as: ProjectManager
            - call: "POST /projects/${proj_id}/draws/${fra_id}/pay"
              payload: {}
              as: ProjectManager
            - call: "POST /projects/${proj_id}/draws/${fin_id}/invoice"
              payload: {}
              as: ProjectManager
            - call: "POST /projects/${proj_id}/draws/${fin_id}/pay"
              payload: {}
              as: ProjectManager
          trigger:
            - call: "POST /projects/${proj_id}/cancel"
              payload: {}
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Project.${proj_id}.status == COMPLETED"

      - name: cancel_project_cascades_void_draws_cancel_bookings
        claim_type: Side Effect Execution
        grounds: [state_machines.Project.ESTIMATED_to_CANCELLED, state_machines.Draw.SCHEDULED_to_VOIDED]
        distinguishing_aspect: "Cancelling an ESTIMATED project voids its SCHEDULED draws (the four draw rows created on accept all become VOIDED)."
        test_recipe:
          setup: ["Accepted estimate (single fence line), project ESTIMATED with four SCHEDULED draws"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cxl A", email: "cxl@x.com", hoa_governed: false }
              as: ProjectManager
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", site_address: "12 Cxl", job_type: "FENCE" }
              as: ProjectManager
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/estimates"
              payload: {}
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "POST /line-items"
              payload: { estimate_id: "${est_id}", work_type: "FENCE", material: "CEDAR", style: "PRIVACY", quantity_units: 100 }
              as: Estimator
            - call: "POST /projects/${proj_id}/estimates/${est_id}/price"
              payload: {}
              as: Estimator
            - call: "POST /projects/${proj_id}/estimates/${est_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /projects/${proj_id}/cancel"
              payload: {}
              as: ProjectManager
          assert:
            - "Project.${proj_id}.status == CANCELLED"
            - "every Draw for ${proj_id} has status == VOIDED"

      - name: warranty_claim_resolve_repaired_cycle
        claim_type: cyclic
        grounds: [state_machines.Warranty.ISSUED_to_CLAIMED, state_machines.Warranty.CLAIMED_to_ISSUED]
        distinguishing_aspect: "Warranty cycle: a CLAIMED warranty resolved as REPAIRED returns to ISSUED (coverage continues)."
        test_recipe:
          setup: ["A COMPLETED project with an ISSUED warranty that the customer has CLAIMED"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Wcy A", email: "wcy@x.com", hoa_governed: false }
              as: ProjectManager
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", site_address: "13 Wcy", job_type: "FENCE" }
              as: ProjectManager
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/estimates"
              payload: {}
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "POST /line-items"
              payload: { estimate_id: "${est_id}", work_type: "FENCE", material: "CEDAR", style: "PRIVACY", quantity_units: 100 }
              as: Estimator
              captures: { li_id: $.data.id }
            - call: "POST /projects/${proj_id}/estimates/${est_id}/price"
              payload: {}
              as: Estimator
            - call: "POST /projects/${proj_id}/estimates/${est_id}/accept"
              payload: {}
