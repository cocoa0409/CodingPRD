              payload: { organization_id: "${org_id}", serial_number: "SN-0002", model_code: "M8R", selling_dealer_id: "${dealer_id}", modem_imei: "IMEI-0002", manufacture_date: "2025-09-01" }
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { machine2_id: $.data.id }
