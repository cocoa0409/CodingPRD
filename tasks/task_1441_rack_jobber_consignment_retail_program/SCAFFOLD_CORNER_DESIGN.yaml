            - { call: "POST /routes", payload: { program_id: "${prog}", name: "Route CX", assigned_driver_id: "drv-1" }, as: JobberAdmin, captures: { route: "$.data.id" } }
            - { call: "POST /service-visits", payload: { route_id: "${route}", store_agreement_id: "${agr}", scheduled_date: "2026-08-01" }, as: JobberAdmin, captures: { visit: "$.data.id" } }
            - { call: "POST /service-visits/${visit}/check-in", payload: {}, as: RouteDriver, as_user_id: "drv-1" }
          trigger:
            - { call: "POST /service-visits/${visit}/submit-counts", payload: { lines: [ { product_id: "${prod}", counted_units: 0, restock_units: 6 } ] }, as: RouteDriver, as_user_id: "drv-1", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_RESTOCK_VALUE_CAP_EXCEEDED — 6 * 100 = 600 > 500; visit stays CHECKED_IN"

      - name: scan_on_suspended_agreement_goes_unmatched
        claim_type: conditional_validation
        grounds: [state_machines.ScanEvent, "validations[priority=27]"]
        distinguishing_aspect: "Scans are never rejected for agreement posture: a SUSPENDED agreement's scan persists as UNMATCHED, then resolve after resume matches it at the directive price."
        test_recipe:
          setup: ["ACTIVE agreement; directive 200; agreement then suspended"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
