    category: business_temporal
    check: "current logical clock >= PurchaseAgreement.rescission_deadline_at (inclusive)"
    error_id: ERR_RESCISSION_PERIOD_OPEN
    http_status: 409
    applies_to: "POST /purchase-agreements/{id}/hardening"
  - priority: 36
    category: business_temporal
    check: "current logical clock < PurchaseAgreement.rescission_deadline_at (strict; at the exact
      deadline instant rescission is refused)"
    error_id: ERR_RESCISSION_PERIOD_CLOSED
    http_status: 409
    applies_to: "POST /purchase-agreements/{id}/rescission"
  - priority: 37
    category: business_temporal
    check: "current logical clock <= WarrantyClaim.warranty_expires_at (inclusive)"
    error_id: ERR_WARRANTY_PERIOD_EXPIRED
    http_status: 409
    applies_to: "POST /conversion-projects/{id}/warranty-claims,
      POST /warranty-claims/{id}/triage, POST /warranty-claims/{id}/reopening"
  - priority: 38
    category: business_temporal
    check: "HALF-OPEN interval geometry on the ConversionProject resource: window_end_at >
      window_start_at (a zero-length or inverted window is rejected), and the requested half-open
      window [window_start_at, window_end_at) must not overlap the half-open window of any sibling
      ClosingBatch of the same project whose status IN {DRAFT, OPEN_FOR_ASSIGNMENT,
      THRESHOLD_SHORT, THRESHOLD_MET, RELEASED}. Overlap test: new_start < other_end AND
      other_start < new_end. Adjacency is ALLOWED - new_start == other_end is accepted, and there
      is no buffer and no aggregate capacity: at most one batch may occupy any instant."
    error_id: ERR_BATCH_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /conversion-projects/{id}/closing-batches"
  - priority: 39
    category: business_temporal
    check: "CLOSED interval geometry with a trailing buffer on the MajorComponent resource:
      remediation_end_at >= remediation_start_at, and the requested closed window
      [remediation_start_at, remediation_end_at] must not collide with the closed window of any
      other WarrantyClaim on the SAME major_component_id whose status IN {REMEDIATION_SCHEDULED,
      REMEDIATED}. Collision test with the 259200-second cooldown: new_start <= other_end +
      259200 AND other_start <= new_end + 259200. Touching endpoints collide and a gap of exactly
      259200 seconds still collides; the earliest admissible start is other_end + 259201 seconds."
    error_id: ERR_REMEDIATION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /warranty-claims/{id}/remediation-schedule"
  - priority: 40
    category: business_temporal
    check: "aggregate capacity on the ConversionProject resource: at no instant inside the requested
      closed window does the number of project WarrantyClaims with status IN
      {REMEDIATION_SCHEDULED, REMEDIATED} whose closed windows contain that instant (counting the
      requested window itself, and counting both windows at an instant shared by one window's end
      and another's start) exceed ConversionProject.max_overlapping_remediations"
    error_id: ERR_REMEDIATION_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /warranty-claims/{id}/remediation-schedule"
  - priority: 41
    category: business_referential
    check: "TenantHousehold.occupied_unit_id is not null and the referenced Unit has
      declaration_status == INCLUDED and Unit.conversion_project_id ==
      TenantHousehold.conversion_project_id"
    error_id: ERR_ROFR_UNIT_NOT_LINKED
    http_status: 409
    applies_to: "POST /tenant-households/{id}/rofr-responses,
      POST /tenant-households/{id}/notices"
  - priority: 42
    category: business_referential
    check: "the PurchaseAgreement being assigned has closing_batch_id == null"
    error_id: ERR_AGREEMENT_ALREADY_ASSIGNED
    http_status: 409
    applies_to: "POST /closing-batches/{id}/agreement-assignments"
  - priority: 43
    category: business_constraint
    check: "DeclarationPackage.allocated_bp_total == 10000 exactly, computed by
      calculations.percentage_interest_reallocation over the INCLUDED Unit set"
    error_id: ERR_PERCENTAGE_INTEREST_NOT_BALANCED
    http_status: 409
    applies_to: "POST /declaration-packages/{id}/plat-certification,
      POST /declaration-packages/{id}/record"
  - priority: 44
    category: business_constraint
    check: "after the withdrawal at least one Unit of the DeclarationPackage still has
      declaration_status == INCLUDED"
    error_id: ERR_LAST_INCLUDED_UNIT
    http_status: 409
    applies_to: "POST /units/{id}/withdraw"
  - priority: 45
    category: business_constraint
    check: "ConversionProject.included_unit_count >= 1 so the presale percentage has a non-zero
      denominator"
    error_id: ERR_NO_INCLUDED_UNITS
    http_status: 409
    applies_to: "POST /closing-batches/{id}/threshold-evaluations"
  - priority: 46
    category: business_constraint
    check: "WarrantyClaim.reopen_count < MAX_CLAIM_REOPENS (2); strict, so the third reopening is
      refused"
    error_id: ERR_CLAIM_REOPEN_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /warranty-claims/{id}/reopening"
  - priority: 47
    category: business_fiscal
    check: "request amount_cents == PurchaseAgreement.deposit_cents exactly"
    error_id: ERR_ESCROW_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /purchase-agreements/{id}/escrow-deposits"
  - priority: 48
    category: business_fiscal
    check: "PurchaseAgreement.escrow_status == FUNDED"
    error_id: ERR_ESCROW_NOT_FUNDED
    http_status: 402
    applies_to: "POST /purchase-agreements/{id}/hardening,
      POST /purchase-agreements/{id}/closing"
  - priority: 49
    category: business_fiscal
    check: "request amount_cents == TenantHousehold.relocation_assistance_cents exactly"
    error_id: ERR_RELOCATION_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /tenant-households/{id}/relocation-disbursements"
  - priority: 50
    category: business_fiscal
    check: "calculations.presale_threshold_evaluation returns met == true for the batch, and every
      assigned PurchaseAgreement has contract_status IN {HARD, CLOSED}"
    error_id: ERR_PRESALE_THRESHOLD_NOT_MET
    http_status: 409
    applies_to: "POST /closing-batches/{id}/release"

endpoints:
  # ---------------- logical clock (test-driving namespace) ----------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical current UTC instant to the supplied timestamp. The
      server's startup default logical clock value is exactly 2026-08-01T00:00:00Z; before any
      call to this endpoint the logical clock reads 2026-08-01T00:00:00Z and never falls back to
      real wall-clock time. Every deadline, expiry, notice period, rescission window, warranty
      window, closing-batch window and remediation window in this API is evaluated against this
      logical clock only. Moving the clock does not itself fire any state transition; sweeps are
      fired explicitly by POST /conversion-projects/{id}/posture-recalculations."
    roles: [PlatformAdmin, ConverterSponsor, StateRegulator, EscrowAgent, LenderUnderwriter]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["sets the logical clock read by every temporal validation and calculation"]
  - method: GET
    path: "/_clock/current"
    description: "Returns the logical clock's current UTC instant (2026-08-01T00:00:00Z until a
      POST /_clock/set_current_utc changes it)."
    roles: [PlatformAdmin, ConverterSponsor, StateRegulator, EscrowAgent, LenderUnderwriter,
            LicensedEngineer, PeerReviewEngineer, TenantOccupant, Purchaser]
    code: 200
    input: []
    output: null
    side_effects: []

  # ---------------- ConversionProject ----------------
  - method: POST
    path: "/conversion-projects"
    description: "Creates a conversion project in status FEASIBILITY and posture OPEN with all
      money, share and ratio aggregates initialised to 0."
    roles: [ConverterSponsor]
    code: 201
    input: [building_address, year_built, total_unit_count, sponsor_user_id,
            "max_overlapping_remediations?"]
    output: ConversionProject
    side_effects: ["status := FEASIBILITY", "posture := RESTRICTED", "suitability_gate := UNEVALUATED",
      "all *_cents aggregates := 0", "included_unit_count := 0", "version := 1"]
  - method: GET
    path: "/conversion-projects"
    description: "Lists conversion projects filtered by status, posture, suitability_gate and
      sponsor_user_id, ordered by created_at ASC."
    roles: [ConverterSponsor, StateRegulator, LenderUnderwriter, EscrowAgent, PlatformAdmin]
    code: 200
    input: ["status?", "posture?", "suitability_gate?", "sponsor_user_id?", "limit?", "offset?"]
    output: ConversionProject[]
    side_effects: []
  - method: GET
    path: "/conversion-projects/{id}"
    description: "Returns one conversion project including every derived aggregate, posture,
      warrantability verdicts, reconciliation deltas and version."
    roles: [ConverterSponsor, StateRegulator, LenderUnderwriter, EscrowAgent, PlatformAdmin,
            LicensedEngineer, PeerReviewEngineer]
    code: 200
    input: []
    output: ConversionProject
    side_effects: []
  - method: PATCH
    path: "/conversion-projects/{id}"
    description: "Updates the mutable project inputs building_address, total_unit_count and
      max_overlapping_remediations. Lowering max_overlapping_remediations never retroactively
      invalidates already scheduled remediation windows; it only constrains later scheduling."
    roles: [ConverterSponsor, PlatformAdmin]
    code: 200
    input: ["building_address?", "total_unit_count?", "max_overlapping_remediations?"]
    output: ConversionProject
    side_effects: ["version += 1"]
  - method: POST
    path: "/conversion-projects/{id}/posture-recalculations"
    description: "Explicit sweep-and-derive endpoint. Runs the four pinned sweep steps of
      calculations.project_posture_derivation in order (1 tenant notice expiry, 2 ROFR expiry,
      3 warranty claim expiry, 4 posture first-match evaluation) against the current logical
      clock, then rewrites ConversionProject.posture and last_posture_recalculated_at."
    roles: [ConverterSponsor, StateRegulator, PlatformAdmin]
    code: 200
    input: []
    output: ConversionProject
    side_effects: ["TenantHousehold.notice_status NOTICE_SERVED -> VACATE_DUE for households whose
        vacate_deadline_at <= clock", "TenantHousehold.rofr_status OFFERED -> EXPIRED for
        households whose rofr_expires_at < clock", "WarrantyClaim.status
        REMEDIATED -> CLOSED for claims whose warranty_expires_at < clock",
      "recomputes ConversionProject.posture", "last_posture_recalculated_at := clock",
      "version += 1"]
  - method: GET
    path: "/conversion-projects/{id}/escrow-summary"
    description: "Computed read returning the escrow cash conservation snapshot:
      escrow_deposits_received_cents, escrow_balance_cents, escrow_refunded_cents,
      escrow_disbursed_cents, escrow_reconciliation_delta_cents (which must always read 0), plus
      relocation_obligation_accrued_cents, relocation_paid_cents, relocation_reversed_cents,
      relocation_outstanding_cents, relocation_reconciliation_delta_cents and
      bp_conservation_total."
    roles: [ConverterSponsor, EscrowAgent, StateRegulator, PlatformAdmin]
    code: 200
    input: []
    output: ConversionProject
    side_effects: ["re-runs calculations.escrow_and_obligation_conservation as a read-only check"]
  - method: GET
    path: "/conversion-projects/{id}/warrantability-summary"
    description: "Computed read returning both variants of calculations.warrantability_ratios:
      owner_occupancy_pct_contract_basis, investor_concentration_pct_contract_basis,
      warrantability_verdict, owner_occupancy_pct_closed_basis,
      investor_concentration_pct_closed_basis, warrantability_verdict_closed_basis,
      single_investor_max_pct and presale_sold_pct."
    roles: [ConverterSponsor, LenderUnderwriter, StateRegulator, PlatformAdmin]
    code: 200
    input: []
    output: ConversionProject
    side_effects: ["re-runs calculations.warrantability_ratios under both variants and persists
        both verdicts on the project"]
  - method: GET
    path: "/conversion-projects/{id}/relocation-summary"
    description: "Computed read returning the tenant obligation ledger for the project:
      relocation_obligation_accrued_cents, relocation_paid_cents, relocation_reversed_cents,
      relocation_outstanding_cents and relocation_reconciliation_delta_cents (always 0)."
    roles: [ConverterSponsor, StateRegulator, PlatformAdmin]
    code: 200
    input: []
    output: ConversionProject
    side_effects: []

  # ---------------- EngineeringReport ----------------
  - method: POST
    path: "/conversion-projects/{id}/engineering-reports"
    description: "Creates an engineering report in status DRAFT with revision_round 0. Reverse
      reachability for EngineeringReport.conversion_project_id is
      GET /conversion-projects/{id}/engineering-reports."
    roles: [LicensedEngineer, ConverterSponsor]
    code: 201
    input: [report_label, inspection_date, submitted_by_user_id]
    output: EngineeringReport
    side_effects: ["status := DRAFT", "revision_round := 0", "verified_component_count := 0",
      "total_replacement_cost_cents := 0", "version := 1"]
  - method: GET
    path: "/conversion-projects/{id}/engineering-reports"
    description: "Sub-resource list giving FK reverse reachability for
      EngineeringReport.conversion_project_id, filterable by status, ordered by created_at ASC."
    roles: [ConverterSponsor, LicensedEngineer, PeerReviewEngineer, StateRegulator, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: EngineeringReport[]
    side_effects: []
  - method: GET
    path: "/engineering-reports/{id}"
    description: "Returns one engineering report with status, revision_round,
      verified_component_count, total_replacement_cost_cents and version."
    roles: [ConverterSponsor, LicensedEngineer, PeerReviewEngineer, StateRegulator, PlatformAdmin]
    code: 200
    input: []
    output: EngineeringReport
    side_effects: []
  - method: POST
    path: "/engineering-reports/{id}/submit"
    description: "Moves the report DRAFT -> SUBMITTED. The first submission on a project also
      bubbles the project FEASIBILITY -> SUITABILITY_REVIEW."
    roles: [LicensedEngineer]
    code: 200
    input: []
    output: EngineeringReport
    side_effects: ["status := SUBMITTED", "recomputes verified_component_count and
        total_replacement_cost_cents over child MajorComponents",
      "ConversionProject.status FEASIBILITY -> SUITABILITY_REVIEW on the project's first
        submission", "version += 1"]
  - method: POST
    path: "/engineering-reports/{id}/peer-review-decisions"
    description: "Peer review branch point. decision == ACCEPT moves SUBMITTED -> ACCEPTED and
      supersedes every other ACCEPTED report of the same project; decision == REJECT moves
      SUBMITTED -> REVISION_REQUESTED and applies the disjoint punitive cascade. The reviewing
      user must differ from EngineeringReport.submitted_by_user_id."
    roles: [PeerReviewEngineer]
    code: 200
    input: [decision, reviewed_by_user_id, "review_note?"]
    output: EngineeringReport
    side_effects: ["ACCEPT: status := ACCEPTED, prior ACCEPTED sibling reports := SUPERSEDED,
        reviewed_by_user_id stored", "REJECT: status := REVISION_REQUESTED, revision_round += 1,
        ConversionProject.suitability_gate := FAILED, ConversionProject.posture := FROZEN,
        the project's EFFECTIVE PublicOfferingStatement -> AMENDMENT_REQUIRED",
      "recomputes ConversionProject.posture", "version += 1"]
  - method: POST
    path: "/engineering-reports/{id}/revisions"
    description: "Moves the report REVISION_REQUESTED -> DRAFT, reopening the revision cycle so a
      corrected component set can be edited and resubmitted."
    roles: [LicensedEngineer]
    code: 200
    input: ["revision_note?"]
    output: EngineeringReport
    side_effects: ["status := DRAFT", "version += 1"]

  # ---------------- MajorComponent ----------------
  - method: POST
    path: "/engineering-reports/{id}/major-components"
    description: "Adds a major component to a DRAFT engineering report with verification_status
      UNVERIFIED. Reverse reachability for MajorComponent.engineering_report_id is
      GET /engineering-reports/{id}/major-components."
    roles: [LicensedEngineer]
    code: 201
    input: [component_type, remaining_useful_life_years, effective_age_years,
            replacement_cost_cents, funded_pct_bp, condition_rating,
            "planned_remediation_gain_years?", "is_life_safety?", "is_structural?"]
    output: MajorComponent
    side_effects: ["verification_status := UNVERIFIED",
