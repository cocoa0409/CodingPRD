# §1.9 Scaffold Corner Design (Breadth Index)
#
# Nine sections, taken verbatim from references/claim-extraction-guide.md
# (Entities / State Machines / Calculations / Validations / Endpoints / Errors / RBAC /
# Cross-Cutting Complexity Layers / Consistency Model). Every `claim_type:` below is a row
# of that guide's per-section table. Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml
# are emitted as `excluded_because:` stubs and carry no test_recipe.
#
# Every numeric literal in every `assert:` was produced by executing the corresponding
# SCAFFOLD.yaml `calculations[].formula` (or the declared side effect) against the pinned
# literals in `setup:`.
#
# Two reusable setup skeletons are referenced by name in the prose of `setup:` but always
# written out in full in `setup_api_calls:` (each instance must run from an empty DB):
#
#   SKELETON-AUTO  (unrestricted order, no attestation or identity check needed):
#     clock 2026-08-20T12:00:00Z -> jurisdiction US-NY (WET, utc_offset_minutes -240)
#     -> product GROCERY-D (restriction_type NONE, 0 units, 500c)
#     -> customer -> delivery partner (STANDARD) -> courier -> ALCOHOL certification
#     -> order (scheduled 2026-08-20T18:00:00Z, delivery_fee_cents 600) -> line -> submit
#     (compliance_state AUTO_CLEARED) -> dispatch -> delivery attempt at 2026-08-20T18:00:00Z
#
#   SKELETON-RESTRICTED (age-restricted order routed to PREVERIFIED):
#     SKELETON-AUTO plus ALCOHOL RestrictionPolicy (min_age 21, window [600, 1320),
#     unit_scale_factor 1.00, max_units_per_order 6.97, rolling_window_days 30,
#     max_units_per_window 40.00, acceptable_document_types [DRIVERS_LICENSE, PASSPORT],
#     requires_scan true, effective 2026-08-01 .. 2026-08-31), product WINE-A
#     (ALCOHOL, 1.50 units, 6800c), customer age attestation (attested_dob 2000-03-15,
#     age 26 on 2026-08-20) and a MATCH IdentityCheck (confidence 0.8500)
#
# Non-existent-id literal used by every not-found probe: 00000000-0000-4000-8000-000000000000

scaffold_corner_design:

  # =========================================================================
  # Section 1 — Entities (§1.1)
  # =========================================================================
  - section: entities
    instances:

      - name: corner_jurisdiction_creation_returns_all_declared_fields
        claim_type: creation
        grounds:
          - entities.Jurisdiction
          - endpoints.POST /jurisdictions
        distinguishing_aspect: |
          POST /jurisdictions with all four declared input fields returns 201 and echoes every
          declared field, with the computed field active_policy_count seeded to 0 by the
          entity's declared default rather than taken from the request.
        test_recipe:
          setup:
            - "empty database, logical clock pinned to 2026-08-20T12:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T12:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /jurisdictions"
              payload: { code: "US-NY", name: "New York", dry_status: "WET", utc_offset_minutes: -240 }
              as: PlatformAdmin
              captures: { j_ny: $.data.id }
          assert:
            - "HTTP status is 201"
            - 'Jurisdiction.${j_ny}.code == "US-NY"'
            - 'Jurisdiction.${j_ny}.name == "New York"'
            - "Jurisdiction.${j_ny}.dry_status == WET"
            - "Jurisdiction.${j_ny}.utc_offset_minutes == -240"
            - "Jurisdiction.${j_ny}.active_policy_count == 0"
            - "response.response_type == \"object\" and response.meta.api_request_id is present"

      - name: corner_product_retrieval_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - entities.Product
          - endpoints.GET /products/{id}
        distinguishing_aspect: |
          GET /products/{id} returns exactly the row written by POST /products — sku, name,
          restriction_type, restricted_units_per_item 1.50 and list_price_cents 6800 all
          survive the round trip unmodified.
        test_recipe:
          setup:
            - "logical clock 2026-08-20T12:00:00Z; one product WINE-A stored"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /products"
              payload: { sku: "WINE-A", name: "Cabernet 750ml", restriction_type: "ALCOHOL", restricted_units_per_item: 1.50, list_price_cents: 6800 }
              as: PlatformAdmin
              captures: { prod_a: $.data.id }
          trigger:
            - call: "GET /products/${prod_a}"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "HTTP status is 200"
            - 'Product.${prod_a}.sku == "WINE-A"'
            - "Product.${prod_a}.restriction_type == ALCOHOL"
            - "Product.${prod_a}.restricted_units_per_item == 1.50"
            - "Product.${prod_a}.list_price_cents == 6800"

      - name: corner_order_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - entities.Order
          - endpoints.GET /orders
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          With three orders for one customer and limit 2 / offset 0, GET /orders returns
          exactly 2 rows with total_count 3 and has_more true; the same query at offset 2
          returns 1 row with has_more false.
        test_recipe:
          setup:
            - "logical clock 2026-08-20T12:00:00Z"
            - "one jurisdiction, one delivery partner, one customer holding three CREATED orders"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "US-NY", name: "New York", dry_status: "WET", utc_offset_minutes: -240 }
              as: PlatformAdmin
              captures: { j_ny: $.data.id }
            - call: "POST /delivery-partners"
              payload: { legal_name: "Empire Last Mile", contract_tier: "STANDARD", license_reference: "NY-DEL-0001" }
              as: PlatformAdmin
              captures: { partner: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ada Lin", email: "ada@example.com", jurisdiction_id: "${j_ny}" }
              as: PlatformAdmin
              captures: { cust: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", delivery_jurisdiction_id: "${j_ny}", delivery_partner_id: "${partner}", scheduled_delivery_at: "2026-08-21T16:00:00Z", delivery_fee_cents: 600 }
              as: Customer
              as_user_id: "${cust}"
              captures: { order_1: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", delivery_jurisdiction_id: "${j_ny}", delivery_partner_id: "${partner}", scheduled_delivery_at: "2026-08-22T16:00:00Z", delivery_fee_cents: 600 }
              as: Customer
              as_user_id: "${cust}"
              captures: { order_2: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", delivery_jurisdiction_id: "${j_ny}", delivery_partner_id: "${partner}", scheduled_delivery_at: "2026-08-23T16:00:00Z", delivery_fee_cents: 600 }
              as: Customer
              as_user_id: "${cust}"
              captures: { order_3: $.data.id }
          trigger:
            - call: "GET /orders"
              payload: { customer_id: "${cust}", limit: 2, offset: 0 }
              as: ComplianceOfficer
            - call: "GET /orders"
              payload: { customer_id: "${cust}", limit: 2, offset: 2 }
              as: ComplianceOfficer
          assert:
            - "first response: response_type == \"array\", len(data) == 2, total_count == 3, has_more == true"
            - "second response: len(data) == 1, total_count == 3, has_more == false, offset == 2"
            - "every returned row has customer_id == ${cust}"

      - name: corner_product_not_found_for_unknown_id
        claim_type: not_found
        grounds:
          - validations[priority=30]
          - errors[ERR_PRODUCT_NOT_FOUND]
          - endpoints.GET /products/{id}
        distinguishing_aspect: |
          A well-formed UUID that matches no Product row returns 404 ERR_PRODUCT_NOT_FOUND,
          not an empty 200 body.
        test_recipe:
          setup:
            - "empty database, logical clock pinned to 2026-08-20T12:00:00Z, no Product rows"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T12:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /products/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - 'response.data.error_id == "ERR_PRODUCT_NOT_FOUND"'
            - "response.response_type == \"error\""

      - name: corner_product_creation_missing_required_field_is_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=35]
          - errors[ERR_VALIDATION]
          - endpoints.POST /products
        distinguishing_aspect: |
          POST /products without list_price_cents — a declared input field with source input and
          no default — is rejected with 422 ERR_VALIDATION and no Product row is created.
        test_recipe:
          setup:
            - "empty database, logical clock pinned to 2026-08-20T12:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T12:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /products"
              payload: { sku: "WINE-A", name: "Cabernet 750ml", restriction_type: "ALCOHOL", restricted_units_per_item: 1.50 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 422"
            - 'response.data.error_id == "ERR_VALIDATION"'
            - "GET /products returns total_count == 0"

      - name: corner_new_customer_carries_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Customer.fields.attestation_state
          - entities.Customer.fields.latest_identity_check_result
          - entities.Customer.fields.refusal_strikes
          - entities.Customer.fields.blocked_until
        distinguishing_aspect: |
          A Customer created with only full_name, email and jurisdiction_id lands with
          attestation_state NOT_ATTESTED, latest_identity_check_result NONE, refusal_strikes 0
          and blocked_until null — all four from declared defaults, none supplied by the caller.
        test_recipe:
          setup:
            - "logical clock 2026-08-20T12:00:00Z; one jurisdiction US-NY"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "US-NY", name: "New York", dry_status: "WET", utc_offset_minutes: -240 }
              as: PlatformAdmin
              captures: { j_ny: $.data.id }
          trigger:
            - call: "POST /customers"
              payload: { full_name: "Ada Lin", email: "ada@example.com", jurisdiction_id: "${j_ny}" }
              as: PlatformAdmin
              captures: { cust: $.data.id }
          assert:
            - "HTTP status is 201"
            - "Customer.${cust}.attestation_state == NOT_ATTESTED"
            - "Customer.${cust}.latest_identity_check_result == NONE"
            - "Customer.${cust}.refusal_strikes == 0"
            - "Customer.${cust}.blocked_until is null"
            - "Customer.${cust}.attestation_at is null"

      - name: corner_order_line_snapshots_and_totals_are_computed_not_supplied
        claim_type: computed_fields
        grounds:
          - entities.OrderLine.fields.unit_price_cents
          - entities.OrderLine.fields.units_per_item_snapshot
          - entities.OrderLine.fields.line_total_cents
          - entities.Order.fields.item_subtotal_cents
          - endpoints.POST /orders/{id}/lines
        distinguishing_aspect: |
          POST /orders/{id}/lines accepts only product_id and quantity; the row comes back with
          unit_price_cents 6800 and units_per_item_snapshot 1.50 copied from the Product and
          line_total_cents 20400 computed as 3 x 6800, and the parent Order.item_subtotal_cents
          is recomputed to 20400 while line_restricted_units is still 0.0 before submit.
        test_recipe:
          setup:
            - "logical clock 2026-08-20T12:00:00Z"
            - "product WINE-A at 6800c and 1.50 units; one CREATED order"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "US-NY", name: "New York", dry_status: "WET", utc_offset_minutes: -240 }
              as: PlatformAdmin
              captures: { j_ny: $.data.id }
            - call: "POST /products"
              payload: { sku: "WINE-A", name: "Cabernet 750ml", restriction_type: "ALCOHOL", restricted_units_per_item: 1.50, list_price_cents: 6800 }
              as: PlatformAdmin
              captures: { prod_a: $.data.id }
            - call: "POST /delivery-partners"
              payload: { legal_name: "Empire Last Mile", contract_tier: "STANDARD", license_reference: "NY-DEL-0001" }
              as: PlatformAdmin
              captures: { partner: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ada Lin", email: "ada@example.com", jurisdiction_id: "${j_ny}" }
              as: PlatformAdmin
              captures: { cust: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", delivery_jurisdiction_id: "${j_ny}", delivery_partner_id: "${partner}", scheduled_delivery_at: "2026-08-20T18:00:00Z", delivery_fee_cents: 600 }
              as: Customer
              as_user_id: "${cust}"
              captures: { order: $.data.id }
          trigger:
            - call: "POST /orders/${order}/lines"
              payload: { product_id: "${prod_a}", quantity: 3 }
              as: Customer
              as_user_id: "${cust}"
              captures: { line_a: $.data.id }
          assert:
            - "HTTP status is 201"
            - "OrderLine.${line_a}.unit_price_cents == 6800"
            - "OrderLine.${line_a}.units_per_item_snapshot == 1.50"
            - "OrderLine.${line_a}.line_total_cents == 20400"
            - "OrderLine.${line_a}.line_restricted_units == 0.0"
            - "OrderLine.${line_a}.line_state == INCLUDED"
            - "Order.${order}.item_subtotal_cents == 20400"
            - 'Order.${order}.restriction_types == ["ALCOHOL"]'
            - "Order.${order}.charged_cents == 0"

      - name: corner_submit_stamps_system_fields_from_the_logical_clock
        claim_type: system_fields
        grounds:
          - entities.Order.fields.submitted_at
          - entities.Order.fields.dispatched_at
          - state_machines.Order.fulfillment_state.CREATED_to_SUBMITTED
          - endpoints.POST /orders/{id}/submit
        distinguishing_aspect: |
          submitted_at is stamped by the server from the logical clock (2026-08-20T12:00:00Z),
          not from any request field, while dispatched_at and delivered_at remain null; the
          caller has no way to supply any of the three.
        test_recipe:
          setup:
            - "SKELETON-AUTO up to and including the single unrestricted line (order not yet submitted)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "US-NY", name: "New York", dry_status: "WET", utc_offset_minutes: -240 }
              as: PlatformAdmin
              captures: { j_ny: $.data.id }
            - call: "POST /products"
              payload: { sku: "GROCERY-D", name: "Sparkling Water 1L", restriction_type: "NONE", restricted_units_per_item: 0, list_price_cents: 500 }
              as: PlatformAdmin
              captures: { prod_d: $.data.id }
            - call: "POST /delivery-partners"
              payload: { legal_name: "Empire Last Mile", contract_tier: "STANDARD", license_reference: "NY-DEL-0001" }
              as: PlatformAdmin
              captures: { partner: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ada Lin", email: "ada@example.com", jurisdiction_id: "${j_ny}" }
              as: PlatformAdmin
              captures: { cust: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", delivery_jurisdiction_id: "${j_ny}", delivery_partner_id: "${partner}", scheduled_delivery_at: "2026-08-20T18:00:00Z", delivery_fee_cents: 600 }
              as: Customer
              as_user_id: "${cust}"
              captures: { order: $.data.id }
            - call: "POST /orders/${order}/lines"
              payload: { product_id: "${prod_d}", quantity: 4 }
              as: Customer
              as_user_id: "${cust}"
              captures: { line_d: $.data.id }
          trigger:
            - call: "POST /orders/${order}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          assert:
            - "HTTP status is 200"
            - 'Order.${order}.submitted_at == "2026-08-20T12:00:00Z"'
            - "Order.${order}.dispatched_at is null"
            - "Order.${order}.delivered_at is null"
            - "Order.${order}.compliance_state == AUTO_CLEARED"
            - "Order.${order}.fulfillment_state == SUBMITTED"
            - "Order.${order}.item_subtotal_cents == 2000"
            - "Order.${order}.charged_cents == 2600"

      - name: corner_restriction_policy_out_of_range_and_bad_enum_are_rejected
        claim_type: type_constraints
        grounds:
          - entities.RestrictionPolicy.fields.min_age_years
          - entities.RestrictionPolicy.fields.restriction_type
          - validations[priority=35]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: |
          min_age_years 26 breaches the declared 18..25 range and the token TOBACCO is not a
          member of the declared restriction_type enum {ALCOHOL, TOBACCO_VAPE, CANNABIS,
          PHARMACY_OTC_RESTRICTED, AEROSOL_SOLVENT}; both are rejected with 422 ERR_VALIDATION
          and no RestrictionPolicy row is stored.
        test_recipe:
          setup:
            - "logical clock 2026-08-20T12:00:00Z; one jurisdiction US-NY with no policies"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "US-NY", name: "New York", dry_status: "WET", utc_offset_minutes: -240 }
              as: PlatformAdmin
              captures: { j_ny: $.data.id }
          trigger:
            - call: "POST /restriction-policies"
              payload: { jurisdiction_id: "${j_ny}", restriction_type: "ALCOHOL", permissibility: "PERMITTED", min_age_years: 26, delivery_window_start_minute: 600, delivery_window_end_minute: 1320, unit_scale_factor: 1.00, max_units_per_order: 6.97, rolling_window_days: 30, max_units_per_window: 40.00, acceptable_document_types: ["DRIVERS_LICENSE"], requires_scan: true, effective_from: "2026-08-01", effective_to: "2026-08-31" }
              as: PlatformAdmin
              captures: { err_range: $.data.error_id }
            - call: "POST /restriction-policies"
              payload: { jurisdiction_id: "${j_ny}", restriction_type: "TOBACCO", permissibility: "PERMITTED", min_age_years: 21, delivery_window_start_minute: 600, delivery_window_end_minute: 1320, unit_scale_factor: 1.00, max_units_per_order: 6.97, rolling_window_days: 30, max_units_per_window: 40.00, acceptable_document_types: ["DRIVERS_LICENSE"], requires_scan: true, effective_from: "2026-08-01", effective_to: "2026-08-31" }
              as: PlatformAdmin
              captures: { err_enum: $.data.error_id }
          assert:
            - "both responses have HTTP status 422"
            - 'both responses have data.error_id == "ERR_VALIDATION"'
            - "Jurisdiction.${j_ny}.active_policy_count == 0"
            - "GET /jurisdictions/${j_ny}/restriction-policies returns total_count == 0"

      - name: corner_capture_artifact_row_is_immutable_and_versionless
        claim_type: immutability
        grounds:
          - entities.CaptureArtifact
          - endpoints.POST /delivery-attempts/{id}/captures
          - endpoints.GET /delivery-attempts/{id}/captures
        distinguishing_aspect: |
          CaptureArtifact is declared common_fields false: the creation response carries no
          version, updated_at or id-mutating surface, §1.5 declares no update or delete
          endpoint for it, and re-reading through GET /delivery-attempts/{id}/captures returns
          the byte-identical content_hash and retention_until.
        test_recipe:
          setup:
            - "SKELETON-AUTO through the delivery attempt at 2026-08-20T18:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "US-NY", name: "New York", dry_status: "WET", utc_offset_minutes: -240 }
              as: PlatformAdmin
              captures: { j_ny: $.data.id }
            - call: "POST /products"
              payload: { sku: "GROCERY-D", name: "Sparkling Water 1L", restriction_type: "NONE", restricted_units_per_item: 0, list_price_cents: 500 }
              as: PlatformAdmin
              captures: { prod_d: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ada Lin", email: "ada@example.com", jurisdiction_id: "${j_ny}" }
              as: PlatformAdmin
              captures: { cust: $.data.id }
            - call: "POST /delivery-partners"
              payload: { legal_name: "Empire Last Mile", contract_tier: "STANDARD", license_reference: "NY-DEL-0001" }
              as: PlatformAdmin
              captures: { partner: $.data.id }
            - call: "POST /couriers"
              payload: { delivery_partner_id: "${partner}", full_name: "Dana Reyes", hired_at: "2026-05-01" }
              as: PartnerManager
              as_user_id: "${partner}"
              captures: { courier: $.data.id }
            - call: "POST /courier-certifications"
              payload: { courier_id: "${courier}", restriction_type: "ALCOHOL", training_score: 92, training_completed_at: "2026-07-15", valid_days: 365 }
              as: PartnerManager
              as_user_id: "${partner}"
              captures: { cert: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", delivery_jurisdiction_id: "${j_ny}", delivery_partner_id: "${partner}", scheduled_delivery_at: "2026-08-20T18:00:00Z", delivery_fee_cents: 600 }
              as: Customer
              as_user_id: "${cust}"
              captures: { order: $.data.id }
            - call: "POST /orders/${order}/lines"
              payload: { product_id: "${prod_d}", quantity: 4 }
              as: Customer
              as_user_id: "${cust}"
              captures: { line_d: $.data.id }
            - call: "POST /orders/${order}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /orders/${order}/dispatch"
              payload: {}
              as: PartnerManager
              as_user_id: "${partner}"
            - call: "POST /delivery-attempts"
              payload: { order_id: "${order}", courier_id: "${courier}", started_at: "2026-08-20T18:00:00Z" }
              as: Courier
              as_user_id: "${courier}"
              captures: { att: $.data.id }
          trigger:
            - call: "POST /delivery-attempts/${att}/captures"
              payload: { kind: "SIGNATURE", content_hash: "1111111111111111111111111111111111111111111111111111111111111111", captured_at: "2026-08-20T18:05:00Z" }
              as: Courier
              as_user_id: "${courier}"
            - call: "GET /delivery-attempts/${att}/captures"
              payload: { kind: "SIGNATURE" }
              as: ComplianceOfficer
          assert:
            - "creation response HTTP status is 201"
            - "creation response data has no `version` key and no `updated_at` key"
            - "GET response: total_count == 1 and the single row has kind == SIGNATURE"
            - 'the single row has content_hash == "1111111111111111111111111111111111111111111111111111111111111111"'
            - 'the single row has retention_until == "2033-08-18T18:05:00Z"'
            - "§1.5 declares no PUT, PATCH or DELETE endpoint whose path resolves to a CaptureArtifact row"

      - name: corner_courier_certification_with_unknown_parent_courier_not_found
        claim_type: parent_relationships
        grounds:
          - entities.CourierCertification.fields.courier_id
          - validations[priority=32]
