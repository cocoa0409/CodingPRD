            - "After reversal LandfillSite.${site_id}.rin_generated_total == 3988, rin_available_count == 0, rin_retired_count == 0, rin_reversed_count == 3988"

      - name: site_energy_mmbtu_conserved_across_divert_and_void
        grounds:
          - calculations.energy_balance_invariant
          - state_machines.InjectionBatch.ON_SPEC_to_DIVERTED_TO_FLARE
          - state_machines.InjectionBatch.DIVERTED_TO_FLARE_to_VOIDED
          - entities.LandfillSite.fields.energy_produced_mmbtu
          - entities.LandfillSite.fields.energy_flared_mmbtu
        distinguishing_aspect: |
          A different type of conserved quantity - MMBtu of accounted energy rather than a count
          of certificates. The divert credits energy_produced_mmbtu and energy_flared_mmbtu by
          340.14 each; the compensating void debits exactly the same two buckets, so
          energy_produced_mmbtu == energy_injected_mmbtu + energy_flared_mmbtu + energy_vented_mmbtu
          holds at 340.14 == 0.00 + 340.14 + 0.00 after the divert and at 0.00 == 0.00 + 0.00 + 0.00
          after the void, with zero residual drift.
        test_recipe:
          setup:
            - "Producing site with plant in UPGRADING and one InjectionBatch of gross_mmbtu 340.14 analysed to ON_SPEC and not yet nominated."
            - "All four LandfillSite energy buckets are 0.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectAdmin
            - call: "POST /sites"
              payload: { name: "Rolling Hills Landfill", state_code: "CA", host_royalty_pct: 0.12, royalty_variant: "GROSS_REVENUE_SHARE", permit_nmoc_limit_lb_per_hr: 3.5 }
              as: ProjectAdmin
              captures: { site_id: $.data.id }
            - call: "POST /plants"
              payload: { site_id: "${site_id}", plant_code: "P1", receipt_point_code: "RP-7", receipt_point_mdq_dth_per_day: 4800.0, min_feed_scfm: 900.0 }
              as: ProjectAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /wells"
              payload: { site_id: "${site_id}", well_code: "W-01", target_flow_scfm: 500.0 }
              as: ProjectAdmin
              captures: { w1_id: $.data.id }
            - call: "POST /wells"
              payload: { site_id: "${site_id}", well_code: "W-02", target_flow_scfm: 500.0 }
              as: ProjectAdmin
              captures: { w2_id: $.data.id }
            - call: "POST /wells/${w1_id}/readings"
              payload: { taken_at: "2026-08-10T01:00:00Z", methane_pct: 55.0, oxygen_pct: 0.8, nitrogen_pct: 4.0, temperature_f: 118.0, flow_scfm: 480.0, vacuum_inhg: 22.5 }
              as: WellfieldTechnician
            - call: "POST /wells/${w2_id}/readings"
              payload: { taken_at: "2026-08-10T01:00:00Z", methane_pct: 55.0, oxygen_pct: 0.8, nitrogen_pct: 4.0, temperature_f: 118.0, flow_scfm: 470.0, vacuum_inhg: 22.5 }
              as: WellfieldTechnician
            - call: "POST /plants/${plant_id}/status"
              payload: { process_mode: "UPGRADING" }
              as: PlantOperator
            - call: "POST /injection-batches"
              payload: { plant_id: "${plant_id}", interval_start: "2026-08-10T02:00:00Z", interval_end: "2026-08-10T05:00:00Z", hourly_volumes_mscf: [115.0, 115.0, 115.0], methane_pct: 97.4, oxygen_pct: 0.1, co2_pct: 1.4 }
              as: PlantOperator
              captures: { b1_id: $.data.id }
            - call: "POST /injection-batches/${b1_id}/status"
              payload: { to_status: "PENDING_ANALYSIS" }
              as: PlantOperator
          trigger:
            - call: "POST /injection-batches/${b1_id}/status"
              payload: { to_status: "DIVERTED_TO_FLARE" }
              as: PlantOperator
            - call: "GET /sites/${site_id}/energy-balance"
              as: ProjectAdmin
              captures: { prod_after_divert: $.data.energy_produced_mmbtu, flared_after_divert: $.data.energy_flared_mmbtu, ok_after_divert: $.data.balance_ok }
            - call: "POST /injection-batches/${b1_id}/status"
              payload: { to_status: "VOIDED", void_reason: "Chromatograph calibration error - batch withdrawn" }
              as: PlantOperator
            - call: "GET /sites/${site_id}/energy-balance"
              as: ProjectAdmin
              captures: { prod_after_void: $.data.energy_produced_mmbtu, flared_after_void: $.data.energy_flared_mmbtu, ok_after_void: $.data.balance_ok }
          assert:
            - "InjectionBatch.${b1_id}.gross_mmbtu == 340.14"
            - "${prod_after_divert} == 340.14"
            - "${flared_after_divert} == 340.14"
            - "${ok_after_divert} == true"
