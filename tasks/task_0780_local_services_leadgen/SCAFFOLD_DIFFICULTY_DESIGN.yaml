            - { call: "POST /pros/${pr2}/credit-topup", payload: { amount_cents: 20000 }, as: PlatformAdmin }
            - { call: "POST /service-requests", payload: { customer_id: "${cr}", category_id: "${cat}", zip_code: "94016", description: "fridge", budget_cents: 15000 }, as: Customer, as_user_id: "${cr}", captures: { sr: "$.data.id", sr_v: "$.data.version" } }
            - { call: "POST /service-requests/${sr}/distribute", payload: { expected_service_request_version: "${sr_v}" }, as: PlatformAdmin }
            - { call: "GET /leads", payload: { request_id: "${sr}", pro_id: "${pr2}" }, as: PlatformAdmin, captures: { lead: "$.data[0].id" } }
          trigger:
            - { call: "POST /leads/${lead}/refund-request", payload: { reason: "DUPLICATE" }, as: Pro, as_user_id: "${pr2}" }
          assert:
            - "Lead.${lead}.billing_status == REFUNDED"
            - "Pro.${pr2}.credit_balance_cents == 20000"

      - name: pro_slot_minutes_conserved_book_then_cancel
        grounds:
          - state_machines.AvailabilitySlot.OPEN_to_BOOKED
          - state_machines.AvailabilitySlot.BOOKED_to_OPEN
