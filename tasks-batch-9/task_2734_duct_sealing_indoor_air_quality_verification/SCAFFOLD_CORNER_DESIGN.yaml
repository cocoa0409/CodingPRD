      - name: invalid_state_outranks_the_combustion_safety_gate
        claim_type: priority_conflict
        grounds:
          - validations[priority=60]
          - validations[priority=80]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_safety_on_start_injection
          rationale: "That §1.8 instance fires start-injection on a SCHEDULED job with no PRE combustion test and asserts 409 ERR_SEAL_JOB_INVALID_STATE rather than 422 ERR_COMBUSTION_SAFETY_REQUIRED."

      - name: safety_gate_outranks_the_fiscal_gate_on_a_claim
        claim_type: priority_conflict
        grounds:
          - validations[priority=80]
          - validations[priority=120]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / safety_beats_fiscal_on_rebate_claim
          rationale: "That §1.8 instance submits a claim on a safety-held project whose payable also exceeds the remaining budget and asserts 422 ERR_PROJECT_SAFETY_HOLD."

      - name: overlapping_technician_windows_are_refused
        claim_type: temporal_validation
        grounds:
          - validations[priority=110]
          - errors.ERR_TECHNICIAN_SCHEDULE_CONFLICT
        excluded_because:
          difficulty_instance: resource_temporal_overlap / technician_schedule_half_open_adjacent_allowed_overlap_rejected
          rationale: "The half-open [start, end) semantics — adjacent windows sharing 18:00 accepted, a straddling 17:00-19:00 window rejected — are asserted end-to-end by that §1.8 instance."

      - name: buffered_leakage_test_windows_that_merely_touch_are_refused
        claim_type: temporal_validation
        grounds:
          - validations[priority=110]
          - errors.ERR_TEST_WINDOW_CONFLICT
        excluded_because:
          difficulty_instance: resource_temporal_overlap / leakage_test_window_buffered_closed_interval_conflict
          rationale: "The CLOSED 30-minute buffered interval and its touching-endpoint rejection at 15:30 (with 16:01 accepted) are asserted by that §1.8 instance."

