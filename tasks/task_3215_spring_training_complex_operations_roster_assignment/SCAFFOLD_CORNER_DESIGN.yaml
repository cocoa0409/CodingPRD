              as: PlatformAdmin
              captures: { cx: $.data.id }
            - call: "POST /camp-ops/players"
              payload: { full_name: "Sod Case", idp_number: "IDP-62001", position_code: "P", acquisition_channel: "NRI_ASSIGNMENT", mlb_service_days: 0, minor_league_option_years_used: 1, home_country: "United States", home_complex_id: "${cx}" }
              as: RosterManager
              captures: { pl: $.data.id }
            - call: "POST /camp-ops/players/${pl}/roster-record"
              payload: { player_id: "${pl}" }
              as: RosterManager
            - call: "POST /camp-ops/players/${pl}/program-profile"
              payload: { player_id: "${pl}" }
              as: TeamPhysician
            - call: "POST /camp-ops/players/${pl}/physicals"
              payload: { player_id: "${pl}", scheduled_visit_date: "2026-01-02T00:00:00Z" }
              as: TeamPhysician
              captures: { ph: $.data.id }
            - call: "POST /camp-ops/physicals/${ph}/perform"
              payload: { physical_result: "PASSED" }
              as: TeamPhysician
            - call: "POST /camp-ops/players/${pl}/roster-record/decide"
              payload: { decision_type: "OPTION_ASSIGN" }
              as: RosterManager
              as_user_id: "rm-applier"
          trigger:
            - call: "POST /camp-ops/players/${pl}/roster-record/finalize-decision"
              payload: {}
              as: RosterManager
              as_user_id: "rm-applier"
              captures: { err: $.data.error_id }
            - call: "POST /camp-ops/players/${pl}/roster-record/finalize-decision"
