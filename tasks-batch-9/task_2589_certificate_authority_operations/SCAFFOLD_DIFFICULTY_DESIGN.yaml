  - rule_id: boundary_precision_check
    instances:
      - name: sct_count_exactly_equal_to_required_threshold_permits_activation
        grounds:
          - calculations.sct_sufficiency
          - validations[priority=111]
          - entities.Certificate.fields.sct_count
          - entities.CtLogSubmission.fields.counted_toward_sct
          - state_machines.Certificate.PREISSUANCE_to_ISSUED
        distinguishing_aspect: |
          Metric: a DEDUPLICATED INTEGER COUNT compared with >=, on
          POST /ca/certificates/{id}/activate. The boundary is crossed only by the second
          DISTINCT accepted log operator: a duplicate ACCEPTED submission to an operator
          already counted, and a REJECTED submission to a new operator, both leave
          sct_count at 1 and activation must still fail; sct_count exactly equal to
          required_sct_count then succeeds.
