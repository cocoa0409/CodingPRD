              payload: { attestation_text: "Register certified for activity year 2026." }
              as: ComplianceOfficer
              as_user_id: "officer-alpha"
          trigger:
            - call: "POST /hmda/applications/${app_id}/reopen"
              payload: { reason: "Source document shows a different application date." }
              as: ComplianceAnalyst
              as_user_id: "analyst-nova"
          assert:
            - "Application.${app_id}.stage == DECISIONED"
            - "Application.${app_id}.action_taken == null"
            - "Application.${app_id}.action_taken_date == null"
            - "Application.${app_id}.lar_status == PENDING_FIELDS"
            - "EditException.${exc_id}.status == OPEN"
            - "EditException.${exc_id}.verified_by_user_id == null"
            - "EditRun.${run_id}.verified_exception_count == 0"
            - "EditRun.${run_id}.open_exception_count == 1"
            - "EditRun.${run_id}.cleared_record_count == 0"
            - "EditRun.${run_id}.status == INVALIDATED"
            - "FilingSubmission.${sub_id}.status == DRAFT"
            - "FilingSubmission.${sub_id}.edit_run_id == null"
            - "FilingSubmission.${sub_id}.certified_by_user_id == null"
            - "FilingSubmission.${sub_id}.final_record_count == null"
            - "Institution.${inst_id}.filing_posture == OPEN"
            - "Institution.${inst_id}.cleared_record_count == 0"

      - name: filing_drives_three_hop_archive_and_year_close
        grounds:
          - state_machines.FilingSubmission.CERTIFIED_to_FILED
          - state_machines.Application.stage.REGISTER_LOCKED_to_ARCHIVED
          - entities.Institution.fields.open_register_count
          - entities.DisclosureStatement.fields.redacted_field_count
