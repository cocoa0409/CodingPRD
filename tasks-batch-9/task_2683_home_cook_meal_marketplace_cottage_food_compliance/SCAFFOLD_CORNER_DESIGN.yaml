      - name: clock_advance_decays_severity_and_returns_a_warned_cook_to_clear
        claim_type: valid_transition
        grounds:
          - state_machines.Cook.compliance_standing.CLEAR_to_WARNED
          - state_machines.Cook.compliance_standing.WARNED_to_CLEAR
          - calculations.cook_safety_score.constants.DECAY_STEP_1_WEEKS
          - endpoints.POST /_clock/set_current_utc
        distinguishing_aspect: >
          The only decay-driven edge in the scaffold, and its boundary: two substantiated incidents
          charge 12 + 25 = 37 points at full weight, so the cook lands on 63 - inside the WARNED band
          [60, 80). At 55 days the incidents are 7 whole weeks old, decay is still 1.00 and nothing
          moves; at 56 days they are exactly 8 weeks old, decay drops to 0.50, the charge becomes
          18.5, round_half_up on the SUMMED charge gives 19, and 81 crosses back into CLEAR. Note
          that SUSPENDED has no such edge - only WARNED recovers by decay.
        test_recipe:
          setup:
            - "StatePolicy CA; logical clock 2026-08-01T00:00:00Z."
            - "Cook Dara exists (compliance_standing CLEAR, safety_score 100)."
