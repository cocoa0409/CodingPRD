  # =====================================================================
  # RULE 8 — resource_temporal_overlap
  # Two instances over DIFFERENT resource entities with DIFFERENT interval
  # semantics:
  #   ExamSite        half-open [start, end + trailing buffer), capacity 2
  #   Representative  closed [start, end] + symmetric travel buffer, capacity 1
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: exam_site_admits_touching_block_then_rejects_the_one_that_makes_three_concurrent
        grounds:
          - calculations.exam_site_interval_conflict
          - calculations.exam_slot_ledger
          - validations[priority=66]
          - errors[ERR_EXAM_SITE_CAPACITY_EXCEEDED]
          - entities.ExamSite.buffer_minutes
        distinguishing_aspect: |
          Half-open semantics with a TRAILING-ONLY 15-minute buffer and concurrent_capacity 2. Blocks are
          [starts_at, ends_at + 15). A 09:00-10:00 -> [09:00,10:15); B 09:30-10:30 -> [09:30,10:45) overlaps
          only A so concurrent 1 < 2 and is accepted; C 10:15-11:00 -> [10:15,11:15) starts exactly when A's
          buffered block ends, and because both comparisons are strict < it does NOT overlap A, only B, so
          it is accepted too and booked_slot_count reaches 3 at a capacity-2 site; D 09:45-10:05 ->
          [09:45,10:20) overlaps all three, so concurrent 3 >= 2 and it is refused. An implementation using
          closed intervals rejects C, one buffering both ends rejects C as well, and one comparing
          booked_slot_count against concurrent_capacity instead of counting overlaps rejects C and accepts
          nothing after it.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, so every 2026-08-20 booking is in the future and validations[priority=56] passes."
            - "rep_a ACTIVE COUNTY_CVSO."
            - "ExamSite site with concurrent_capacity 2 and buffer_minutes 15."
            - "Veteran vet with discharge VERIFIED, intake_status SCREENED, ACTIVE PowerOfAttorney designating rep_a."
            - "Claim claim_r in EVIDENCE_DEVELOPMENT."
            - "SCHEDULED appointments appt_a 09:00-10:00, appt_b 09:30-10:30 and appt_c 10:15-11:00 on 2026-08-20 at that site, so booked_slot_count is 3."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cvso/representatives"
              payload: { full_name: "Dana Reyes", accreditation_number: "ACC-2849-201", accreditation_type: "COUNTY_CVSO", accreditation_expires_on: "2029-12-31" }
              as: SystemAdmin
              captures: { rep_a: $.data.id }
            - call: "POST /cvso/representatives/${rep_a}/accreditation"
              payload: { action: "ACTIVATE" }
              as: SystemAdmin
            - call: "POST /cvso/exam-sites"
              payload: { name: "Southgate Two-Bay Exam Suite", county_code: "CVSO2", concurrent_capacity: 2, buffer_minutes: 15 }
              as: SystemAdmin
              captures: { site: $.data.id }
            - call: "POST /cvso/veterans"
