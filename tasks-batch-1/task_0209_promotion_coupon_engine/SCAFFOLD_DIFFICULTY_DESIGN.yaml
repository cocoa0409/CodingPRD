          assert:
            - "Cart.${cart_id}.subtotal_cents == 5000"
            - "Cart.${cart_id}.total_discount_cents == 1000 (subtotal == tier min qualifies; boundary inclusive)"

      # --- metric 2: per-customer abuse count boundary (>=), via apply ---
      - name: bpc_abuse_count_at_limit_rejects_next
        grounds:
          - calculations.usage_limit_check
          - calculations.usage_limit_check.variants.at_limit_boundary
          - validations[priority=15]
        distinguishing_aspect: |
          Integer count boundary on per-customer redemptions: max_redemptions_per_customer == 1, so after one
          CONFIRMED redemption the next apply (count would reach 2) is rejected with ERR_ABUSE_LIMIT_EXCEEDED via
          POST /carts/{id}/applications. Metric = redemption count; distinct metric/endpoint from instance 1.
        test_recipe:
