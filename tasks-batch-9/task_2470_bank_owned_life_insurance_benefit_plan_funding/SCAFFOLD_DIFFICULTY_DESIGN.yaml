  - rule_id: non_linear_state_machine
    instances:
      - name: diligence_info_request_cycle_capped_at_two_rounds
        grounds:
          - state_machines.DiligenceReview.UNDER_REVIEW_to_INFO_REQUESTED
          - state_machines.DiligenceReview.INFO_REQUESTED_to_UNDER_REVIEW
          - entities.DiligenceReview.fields.info_request_count
          - validations[priority=12]
          - errors[ERR_INFO_REQUEST_LIMIT_REACHED]
        distinguishing_aspect: |
          DiligenceReview cycles UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW twice; the loop is
          not open-ended because the third operator-driven request-info is rejected with
          ERR_INFO_REQUEST_LIMIT_REACHED once info_request_count has reached INFO_REQUEST_LIMIT 2,
          leaving the review parked in UNDER_REVIEW rather than looping again.
        test_recipe:
          setup:
            - "One CapitalPosition with tier1_capital_usd 1000000000.00 so submit can score the carrier."
            - "Carrier Cascade with am_best_rating A_PLUS, statutory_surplus_usd 400000000.00 and concentration_bps 0."
            - "One DRAFT DiligenceReview for review_year 2026 on that carrier."
          setup_api_calls:
            - call: "POST /capital-positions"
              payload: { as_of_date: "2026-06-30T00:00:00Z", tier1_capital_usd: 1000000000.00, total_assets_usd: 12000000000.00 }
              as: TreasuryController
              captures: { cap_cs_id: $.data.id }
            - call: "POST /carriers"
              payload: { legal_name: "Cascade Life", naic_code: "65555", am_best_rating: "A_PLUS", statutory_surplus_usd: 400000000.00, domicile_state: "WA" }
              as: PlatformAdmin
              captures: { carrier_cs_id: $.data.id }
            - call: "POST /diligence-reviews"
              payload: { carrier_id: "${carrier_cs_id}", review_year: 2026 }
              as: BenefitsAnalyst
              captures: { rev_cs_id: $.data.id }
          trigger:
            - call: "POST /diligence-reviews/${rev_cs_id}/submit"
              payload: {}
              as: BenefitsAnalyst
              as_user_id: "analyst-1"
            - call: "POST /diligence-reviews/${rev_cs_id}/request-info"
              payload: {}
              as: RiskOfficer
              as_user_id: "risk-1"
            - call: "POST /diligence-reviews/${rev_cs_id}/submit"
              payload: {}
              as: BenefitsAnalyst
              as_user_id: "analyst-1"
            - call: "POST /diligence-reviews/${rev_cs_id}/request-info"
              payload: {}
              as: RiskOfficer
              as_user_id: "risk-1"
            - call: "POST /diligence-reviews/${rev_cs_id}/submit"
              payload: {}
              as: BenefitsAnalyst
              as_user_id: "analyst-1"
            - call: "POST /diligence-reviews/${rev_cs_id}/request-info"
              payload: {}
              as: RiskOfficer
              as_user_id: "risk-1"
          assert:
            - "the first five trigger calls all succeed with HTTP 200"
            - "after trigger call 2, DiligenceReview.${rev_cs_id}.status == INFO_REQUESTED and info_request_count == 1"
            - "after trigger call 4, DiligenceReview.${rev_cs_id}.status == INFO_REQUESTED and info_request_count == 2"
            - "after trigger call 5, DiligenceReview.${rev_cs_id}.status == UNDER_REVIEW"
            - "trigger call 6 returns HTTP 409 with data.error_id == ERR_INFO_REQUEST_LIMIT_REACHED"
            - "DiligenceReview.${rev_cs_id}.status == UNDER_REVIEW after trigger call 6"
            - "DiligenceReview.${rev_cs_id}.info_request_count == 2 after trigger call 6"
            - "DiligenceReview.${rev_cs_id}.financial_strength_score == 65"
            - "Carrier.${carrier_cs_id}.status == PENDING_DILIGENCE"

