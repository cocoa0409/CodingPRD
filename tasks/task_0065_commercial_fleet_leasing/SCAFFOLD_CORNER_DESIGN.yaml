          rationale: "Immediate visibility of computed net_charge_cents in the finalize response is asserted by the named §1.8 instance."

  # =========================================================================
  # FK reverse-reachability coverage — every FK in §1.1 is discoverable via a
  # GET in §1.5. These are validated mechanically by scaffold_lint.py check (f);
  # the instances below assert the discovery channel returns the child.
  - section: entities
    instances:
      - name: fk_reverse_telematics_by_vehicle_subresource
        claim_type: Parent Relationships
        grounds: [entities.TelematicsReading.fields.vehicle_id, endpoints]
        distinguishing_aspect: "GET /fleet/vehicles/{id}/telematics-readings returns the readings created for that vehicle (FK reverse-reachability)."
        test_recipe:
          setup: ["A vehicle with one telematics reading."]
          setup_api_calls:
            - call: "POST /fleet/vehicles"
              payload: { vin: "VINFK00001", class: "HEAVY_DUTY" }
              as: FleetManager
              captures: { veh_id: $.data.id }
            - call: "POST /fleet/telematics-readings"
              payload: { vehicle_id: "${veh_id}", jurisdiction: "CA", odometer_miles: 1000, segment_miles: 1000, recorded_at: "2026-06-01T00:00:00Z" }
              as: TelematicsGateway
          trigger:
            - call: "GET /fleet/vehicles/${veh_id}/telematics-readings"
              payload: {}
              as: FleetManager
          assert:
            - "response.response_type == array"
            - "response.data.total_count == 1"

      - name: fk_reverse_repair_orders_by_lease_filtered_list
        claim_type: Parent Relationships
        grounds: [entities.RepairOrder.fields.lease_id, endpoints]
        distinguishing_aspect: "GET /fleet/repair-orders?lease_id=... returns the repair orders for that lease (FK reverse-reachability, filtered-list form)."
        test_recipe:
          setup: ["A lease ACTIVE with one repair order reported."]
          setup_api_calls:
            - call: "POST /fleet/lessees"
              payload: { company_name: "FK2 Co", billing_email: "fk2@x.com" }
              as: FleetManager
              captures: { lessee_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { vin: "VINFK20001", class: "MEDIUM_DUTY" }
              as: FleetManager
              captures: { veh_id: $.data.id }
            - call: "POST /fleet/leases"
              payload: { lessee_id: "${lessee_id}", vehicle_id: "${veh_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", contracted_miles: 60000, per_mile_overage_cents: 25, overage_model: "CONTRACT_FLAT", collision_deductible_cents: 100000, waterfall_model: "DEDUCTIBLE_FIRST" }
              as: FleetManager
              captures: { lease_id: $.data.id }
            - call: "POST /fleet/leases/${lease_id}/activate"
              payload: {}
              as: FleetManager
            - call: "GET /fleet/vehicles/${veh_id}"
              payload: {}
              as: FleetManager
              captures: { veh_ver: $.data.version }
            - call: "POST /fleet/repair-orders"
              payload: { vehicle_id: "${veh_id}", lease_id: "${lease_id}", expected_vehicle_version: "${veh_ver}" }
              as: FleetManager
          trigger:
            - call: "GET /fleet/repair-orders"
              payload: { lease_id: "${lease_id}" }
              as: FleetManager
          assert:
            - "response.response_type == array"
            - "response.data.total_count == 1"
