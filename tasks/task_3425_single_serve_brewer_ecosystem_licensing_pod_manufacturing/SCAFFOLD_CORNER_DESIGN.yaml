            - call: "GET /households/${ca4_hh}"
              payload: {}
              as: PlatformAdmin
              captures: { ca4_exp: $.data.expected_monthly_pods }
          assert:
            - "Brewer.${ca4_br}.warranty_status == EXPIRED at exactly registered_at + 1 month (equality expires)"
            - "Household.${ca4_hh}.expected_monthly_pods == 108.00"
            - "operational still ACTIVE (30 days idle < 60) so engagement stays ENGAGED"

      - name: lapsed_engagement_quarters_the_forward_model
        claim_type: Correct Result
        grounds:
          - "calculations.household_consumption_model"
          - "calculations.descale_and_dormancy_clock"
        distinguishing_aspect: "After exactly DORMANCY_DAYS 60 idle the brewer flips DORMANT, engagement LAPSED, and expected_monthly_pods == 48.00 (4*30*0.4) — the engagement factor branch."
        test_recipe:
          setup: ["Household size 4; brewer registered 2026-09-01, no brews; clock advanced to 2026-10-31T00:00:00Z (exactly 60 days)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /households"
              payload: { region: "NW", size: 4 }
              as: PlatformAdmin
              captures: { ca5_hh: $.data.id }
            - call: "POST /brewer-models"
              payload: { model_code: "K-DORM", firmware_compat: "OPEN", warranty_months: 12, descale_interval_brews: 200, msrp_cents: 5000, unit_cost_cents: 4000 }
              as: PlatformAdmin
              captures: { ca5_model: $.data.id }
            - call: "POST /households/${ca5_hh}/brewers"
              payload: { model_id: "${ca5_model}", serial_number: "SN-CA5" }
              as: PlatformAdmin
              captures: { ca5_br: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /households/${ca5_hh}"
              payload: {}
              as: PlatformAdmin
              captures: { ca5_g: $.data.engagement, ca5_exp: $.data.expected_monthly_pods }
          assert:
            - "Brewer.${ca5_br}.operational == DORMANT at exactly 60 idle days (>= boundary)"
            - "engagement == LAPSED and expected_monthly_pods == 48.00"

      - name: quality_penalty_follows_only_the_latest_audit
        claim_type: Input Set Filtering
        grounds:
          - "calculations.royalty_accrual"
        distinguishing_aspect: "Two PASS audits exist; the older has defects 300 (penalty band), the latest has defects 50 — the issued royalty uses the latest audit only, so no penalty: base == final at 375000."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z. ACTIVE agreement; audit A (2026-06-01, cup 90, defects 300), audit B (2026-08-01, cup 90, defects 50); statement sell_in=sell_through=500000, unlicensed 0, non-exclusive."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brands"
              payload: { name: "Latest Audit Co", kind: "LICENSED", home_region: "US" }
              as: PlatformAdmin
              captures: { ca6_brand: $.data.id }
            - call: "POST /license-agreements"
              payload: { brand_id: "${ca6_brand}", territory_code: "US", effective_start: "2026-01-01", effective_end: "2026-12-31", royalty_tiers: [{up_to_units: null, millicents_per_pod: 750}], quality_min_cup_score: 80, exclusive: false }
              as: LicensingManager
              captures: { ca6_ag: $.data.id }
            - call: "POST /license-agreements/${ca6_ag}/transition"
              payload: { target_state: "ACTIVE" }
              as: LicensingManager
            - call: "POST /license-agreements/${ca6_ag}/quality-audits"
              payload: { audited_at: "2026-06-01T00:00:00Z", cup_score: 90, defect_rate_ppm: 300 }
              as: QualityAuditor
            - call: "POST /license-agreements/${ca6_ag}/quality-audits"
              payload: { audited_at: "2026-08-01T00:00:00Z", cup_score: 90, defect_rate_ppm: 50 }
              as: QualityAuditor
            - call: "POST /license-agreements/${ca6_ag}/royalty-statements"
              payload: { period: "2026-08", sell_in_units: 500000, sell_through_units: 500000, unlicensed_share_pct: 0 }
              as: FinanceAnalyst
              captures: { ca6_st: $.data.id }
          trigger:
            - call: "POST /royalty-statements/${ca6_st}/transition"
              payload: { target_state: "ISSUED" }
              as: FinanceAnalyst
              captures: { ca6_final: $.data.final_royalty_cents }
          assert:
            - "final_royalty_cents == 375000 (500000 * 750/1000, no penalty — latest audit defects 50 <= 200)"
            - "the older 300-ppm audit does not leak into the computation"

  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: Violation → Error
        grounds:
          - "validations[priority=1]"
          - "errors.ERR_UNAUTHENTICATED"
        distinguishing_aspect: "A request without X-User-Role / X-User-ID fails 401 ERR_UNAUTHENTICATED before any role, existence, or business check runs."
        test_recipe:
          setup: ["Empty database; any endpoint."]
          setup_api_calls: []
          trigger:
            - call: "POST /brands"
              payload: { name: "NoAuth Brand", kind: "LICENSED", home_region: "US" }
              as: PlatformAdmin
              captures: { va1_err: $.data.error_id }
          assert:
            - "the test sends NO X-User-Role / X-User-ID headers: status 401, error_id == ERR_UNAUTHENTICATED"

      - name: window_in_past_rejected_on_run_create
        claim_type: Violation → Error
        grounds:
          - "validations[priority=9]"
          - "errors.ERR_WINDOW_IN_PAST"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / temporal_beats_overlap_on_run_create
          rationale: "Asserted as the winning error of the temporal-vs-constraint conflict there."

      - name: invalid_window_shape_rejected
        claim_type: Violation → Error
        grounds:
          - "validations[priority=6]"
          - "errors.ERR_INVALID_WINDOW"
        distinguishing_aspect: "window_start == window_end (empty half-open window) fails 422 ERR_INVALID_WINDOW at creation — checked before state, temporal, or overlap rules."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z. Owned ACTIVE variety and a line."]
          setup_api_calls:
            - call: "POST /brands"
              payload: { name: "Shape Brand", kind: "PLATFORM_OWNED", home_region: "US" }
              as: PlatformAdmin
              captures: { va3_brand: $.data.id }
            - call: "POST /pod-varieties"
              payload: { brand_id: "${va3_brand}", name: "Shape Var", roast_level: "MEDIUM", flavor_family: "UNFLAVORED", wholesale_price_cents: 100, margin_cents: 20 }
              as: BrandManager
              as_user_id: "${va3_brand}"
              captures: { va3_var: $.data.id }
            - call: "POST /facilities"
              payload: { name: "Shape Plant", kind: "OWNED", region: "US" }
              as: OperationsDirector
              captures: { va3_fac: $.data.id }
            - call: "POST /facilities/${va3_fac}/filling-lines"
              payload: { line_code: "L1", supported_roast: "UNIVERSAL", supports_flavored: true, material_capability: "BOTH", capacity_pods_per_day: 100000, changeover_hours: 0 }
              as: OperationsDirector
              captures: { va3_line: $.data.id }
          trigger:
            - call: "POST /production-runs"
              payload: { line_id: "${va3_line}", variety_id: "${va3_var}", window_start: "2026-09-10T00:00:00Z", window_end: "2026-09-10T00:00:00Z", planned_units: 100 }
              as: ProductionPlanner
              captures: { va3_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_WINDOW (422); no run persisted"

      - name: agreement_for_non_licensed_brand_rejected
        claim_type: Violation → Error
        grounds:
          - "validations[priority=11]"
          - "errors.ERR_BRAND_NOT_LICENSED"
        distinguishing_aspect: "A license agreement for a PLATFORM_OWNED brand fails 422 ERR_BRAND_NOT_LICENSED at creation; UNLICENSED_COMPATIBLE brands are likewise barred from the licensing program."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z. One PLATFORM_OWNED brand, one UNLICENSED_COMPATIBLE brand."]
          setup_api_calls:
            - call: "POST /brands"
              payload: { name: "Owned House", kind: "PLATFORM_OWNED", home_region: "US" }
              as: PlatformAdmin
              captures: { va4_b1: $.data.id }
            - call: "POST /brands"
              payload: { name: "Pirate Pods", kind: "UNLICENSED_COMPATIBLE", home_region: "US" }
              as: PlatformAdmin
              captures: { va4_b2: $.data.id }
          trigger:
            - call: "POST /license-agreements"
              payload: { brand_id: "${va4_b1}", territory_code: "US", effective_start: "2026-01-01", effective_end: "2026-12-31", royalty_tiers: [{up_to_units: null, millicents_per_pod: 500}], quality_min_cup_score: 80, exclusive: false }
              as: LicensingManager
              captures: { va4_err1: $.data.error_id }
            - call: "POST /license-agreements"
              payload: { brand_id: "${va4_b2}", territory_code: "US", effective_start: "2026-01-01", effective_end: "2026-12-31", royalty_tiers: [{up_to_units: null, millicents_per_pod: 500}], quality_min_cup_score: 80, exclusive: false }
              as: LicensingManager
              captures: { va4_err2: $.data.error_id }
          assert:
            - "PLATFORM_OWNED brand: error_id == ERR_BRAND_NOT_LICENSED (422)"
            - "UNLICENSED_COMPATIBLE brand: error_id == ERR_BRAND_NOT_LICENSED (422)"

      - name: line_rejects_mismatched_roast
        claim_type: Violation → Error
        grounds:
          - "validations[priority=10]"
          - "errors.ERR_LINE_INCOMPATIBLE"
        distinguishing_aspect: "A DARK variety on a LIGHT-only line fails 422 ERR_LINE_INCOMPATIBLE; UNIVERSAL lines accept any roast."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z. DARK variety; LIGHT-only line."]
          setup_api_calls:
            - call: "POST /brands"
              payload: { name: "Roast Brand", kind: "PLATFORM_OWNED", home_region: "US" }
              as: PlatformAdmin
              captures: { va5_brand: $.data.id }
            - call: "POST /pod-varieties"
              payload: { brand_id: "${va5_brand}", name: "Roast Var", roast_level: "DARK", flavor_family: "UNFLAVORED", wholesale_price_cents: 100, margin_cents: 20 }
              as: BrandManager
              as_user_id: "${va5_brand}"
              captures: { va5_var: $.data.id }
            - call: "POST /facilities"
              payload: { name: "Roast Plant", kind: "OWNED", region: "US" }
              as: OperationsDirector
              captures: { va5_fac: $.data.id }
            - call: "POST /facilities/${va5_fac}/filling-lines"
              payload: { line_code: "L-LIGHT", supported_roast: "LIGHT", supports_flavored: true, material_capability: "BOTH", capacity_pods_per_day: 100000, changeover_hours: 0 }
              as: OperationsDirector
              captures: { va5_line: $.data.id }
          trigger:
            - call: "POST /production-runs"
              payload: { line_id: "${va5_line}", variety_id: "${va5_var}", window_start: "2026-09-10T00:00:00Z", window_end: "2026-09-11T00:00:00Z", planned_units: 100 }
              as: ProductionPlanner
              captures: { va5_err: $.data.error_id }
          assert:
            - "error_id == ERR_LINE_INCOMPATIBLE (422) — DARK on LIGHT-only"

      - name: line_rejects_flavored_when_unsupported
        claim_type: Violation → Error
        grounds:
          - "validations[priority=10]"
          - "errors.ERR_LINE_INCOMPATIBLE"
        distinguishing_aspect: "A FLAVORED variety on a line with supports_flavored false fails 422 — flavor capability is independent of roast capability."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z. FLAVORED MEDIUM variety; unflavored-only line."]
          setup_api_calls:
            - call: "POST /brands"
              payload: { name: "Flavor Brand", kind: "PLATFORM_OWNED", home_region: "US" }
              as: PlatformAdmin
              captures: { va6_brand: $.data.id }
            - call: "POST /pod-varieties"
              payload: { brand_id: "${va6_brand}", name: "Hazelnut Medium", roast_level: "MEDIUM", flavor_family: "FLAVORED", wholesale_price_cents: 100, margin_cents: 20 }
              as: BrandManager
              as_user_id: "${va6_brand}"
              captures: { va6_var: $.data.id }
            - call: "POST /facilities"
              payload: { name: "Flavor Plant", kind: "OWNED", region: "US" }
              as: OperationsDirector
              captures: { va6_fac: $.data.id }
            - call: "POST /facilities/${va6_fac}/filling-lines"
              payload: { line_code: "L-PLAIN", supported_roast: "UNIVERSAL", supports_flavored: false, material_capability: "BOTH", capacity_pods_per_day: 100000, changeover_hours: 0 }
              as: OperationsDirector
              captures: { va6_line: $.data.id }
          trigger:
            - call: "POST /production-runs"
              payload: { line_id: "${va6_line}", variety_id: "${va6_var}", window_start: "2026-09-10T00:00:00Z", window_end: "2026-09-11T00:00:00Z", planned_units: 100 }
              as: ProductionPlanner
              captures: { va6_err: $.data.error_id }
          assert:
            - "error_id == ERR_LINE_INCOMPATIBLE (422) — FLAVORED on supports_flavored=false"

      - name: line_rejects_recyclable_material_when_conventional_only
        claim_type: Violation → Error
        grounds:
          - "validations[priority=10]"
          - "errors.ERR_LINE_INCOMPATIBLE"
          - "state_machines.PodVariety.ACTIVE_to_ACTIVE"
        distinguishing_aspect: "A RECYCLABLE-converted variety can fill on BOTH-capable lines but is rejected 422 on a CONVENTIONAL-only line — material capability is a third independent axis."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z. Variety converted to RECYCLABLE (a BOTH line exists to permit conversion); a second CONVENTIONAL-only line is the run target."]
          setup_api_calls:
            - call: "POST /brands"
              payload: { name: "Material Brand", kind: "PLATFORM_OWNED", home_region: "US" }
              as: PlatformAdmin
              captures: { va7_brand: $.data.id }
            - call: "POST /pod-varieties"
              payload: { brand_id: "${va7_brand}", name: "Material Var", roast_level: "MEDIUM", flavor_family: "UNFLAVORED", wholesale_price_cents: 100, margin_cents: 20 }
              as: BrandManager
              as_user_id: "${va7_brand}"
              captures: { va7_var: $.data.id }
            - call: "POST /facilities"
              payload: { name: "Material Plant", kind: "OWNED", region: "US" }
              as: OperationsDirector
              captures: { va7_fac: $.data.id }
            - call: "POST /facilities/${va7_fac}/filling-lines"
              payload: { line_code: "L-REC", supported_roast: "UNIVERSAL", supports_flavored: true, material_capability: "BOTH", capacity_pods_per_day: 100000, changeover_hours: 0 }
              as: OperationsDirector
            - call: "POST /facilities/${va7_fac}/filling-lines"
              payload: { line_code: "L-CONV", supported_roast: "UNIVERSAL", supports_flavored: true, material_capability: "CONVENTIONAL", capacity_pods_per_day: 100000, changeover_hours: 0 }
              as: OperationsDirector
              captures: { va7_line_conv: $.data.id }
            - call: "POST /pod-varieties/${va7_var}/transition"
              payload: { target_state: "CONVERT_RECYCLABLE", education_notices_sent: 1 }
              as: BrandManager
              as_user_id: "${va7_brand}"
          trigger:
            - call: "POST /production-runs"
              payload: { line_id: "${va7_line_conv}", variety_id: "${va7_var}", window_start: "2026-09-10T00:00:00Z", window_end: "2026-09-11T00:00:00Z", planned_units: 100 }
              as: ProductionPlanner
              captures: { va7_err: $.data.error_id }
          assert:
            - "conversion succeeded: material == RECYCLABLE"
            - "run on the CONVENTIONAL-only line: error_id == ERR_LINE_INCOMPATIBLE (422)"

      - name: convert_recyclable_requires_education_notices
        claim_type: Violation → Error
        grounds:
          - "validations[priority=11]"
          - "errors.ERR_EDUCATION_REQUIRED"
        distinguishing_aspect: "CONVERT_RECYCLABLE with education_notices_sent 0 (or omitted) fails 422 ERR_EDUCATION_REQUIRED when a capable line exists — consumer education is a hard precondition of the recyclable transition."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z. CONVENTIONAL variety; a BOTH-capable line exists (so only the education gate can fire)."]
          setup_api_calls:
            - call: "POST /brands"
              payload: { name: "Edu Brand", kind: "PLATFORM_OWNED", home_region: "US" }
              as: PlatformAdmin
              captures: { vb1_brand: $.data.id }
            - call: "POST /pod-varieties"
              payload: { brand_id: "${vb1_brand}", name: "Edu Var", roast_level: "MEDIUM", flavor_family: "UNFLAVORED", wholesale_price_cents: 100, margin_cents: 20 }
              as: BrandManager
              as_user_id: "${vb1_brand}"
              captures: { vb1_var: $.data.id }
            - call: "POST /facilities"
              payload: { name: "Edu Plant", kind: "OWNED", region: "US" }
              as: OperationsDirector
              captures: { vb1_fac: $.data.id }
            - call: "POST /facilities/${vb1_fac}/filling-lines"
              payload: { line_code: "L1", supported_roast: "UNIVERSAL", supports_flavored: true, material_capability: "BOTH", capacity_pods_per_day: 100000, changeover_hours: 0 }
              as: OperationsDirector
          trigger:
            - call: "POST /pod-varieties/${vb1_var}/transition"
              payload: { target_state: "CONVERT_RECYCLABLE", education_notices_sent: 0 }
              as: BrandManager
              as_user_id: "${vb1_brand}"
              captures: { vb1_err: $.data.error_id }
            - call: "POST /pod-varieties/${vb1_var}/transition"
              payload: { target_state: "CONVERT_RECYCLABLE", education_notices_sent: 1 }
              as: BrandManager
              as_user_id: "${vb1_brand}"
              captures: { vb1_mat: $.data.material }
          assert:
            - "notices 0: error_id == ERR_EDUCATION_REQUIRED (422), material stays CONVENTIONAL"
            - "notices 1 (== EDUCATION_MIN_NOTICES boundary): 200, material == RECYCLABLE, education_notices_sent == 1"

      - name: convert_recyclable_without_any_capable_line
        claim_type: Violation → Error
        grounds:
          - "validations[priority=10]"
          - "errors.ERR_NO_COMPATIBLE_LINE"
        distinguishing_aspect: "With notices sent but NO line having material_capability RECYCLABLE|BOTH in the system, conversion fails 409 ERR_NO_COMPATIBLE_LINE — and this constraint (P10) outranks the education check (P11)."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z. CONVENTIONAL variety; no filling lines exist at all."]
          setup_api_calls:
            - call: "POST /brands"
              payload: { name: "NoLine Brand", kind: "PLATFORM_OWNED", home_region: "US" }
              as: PlatformAdmin
              captures: { vb2_brand: $.data.id }
            - call: "POST /pod-varieties"
              payload: { brand_id: "${vb2_brand}", name: "NoLine Var", roast_level: "MEDIUM", flavor_family: "UNFLAVORED", wholesale_price_cents: 100, margin_cents: 20 }
              as: BrandManager
              as_user_id: "${vb2_brand}"
              captures: { vb2_var: $.data.id }
          trigger:
            - call: "POST /pod-varieties/${vb2_var}/transition"
              payload: { target_state: "CONVERT_RECYCLABLE", education_notices_sent: 5 }
              as: BrandManager
              as_user_id: "${vb2_brand}"
              captures: { vb2_err: $.data.error_id }
          assert:
            - "error_id == ERR_NO_COMPATIBLE_LINE (409) — constraint (P10) beats the education check (P11) even though notices are sufficient"

      - name: restrictive_firmware_blocks_unlicensed_pods
        claim_type: Violation → Error
        grounds:
          - "validations[priority=11]"
          - "errors.ERR_POD_BLOCKED"
          - "entities.BrewerModel.fields.firmware_compat"
        distinguishing_aspect: "The technical response to unlicensed competition: a RESTRICTIVE brewer rejects brews of an UNLICENSED_COMPATIBLE brand's variety with 422 ERR_POD_BLOCKED, while an OPEN brewer accepts the same variety."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z. UNLICENSED_COMPATIBLE brand with ACTIVE variety; two households, one with a RESTRICTIVE-model brewer, one OPEN-model."]
          setup_api_calls:
            - call: "POST /brands"
              payload: { name: "Pirate Pods", kind: "UNLICENSED_COMPATIBLE", home_region: "US" }
              as: PlatformAdmin
              captures: { vb3_uba: $.data.id }
            - call: "POST /pod-varieties"
              payload: { brand_id: "${vb3_uba}", name: "Knockoff Dark", roast_level: "DARK", flavor_family: "UNFLAVORED", wholesale_price_cents: 60, margin_cents: 40 }
              as: BrandManager
              as_user_id: "${vb3_uba}"
              captures: { vb3_uvar: $.data.id }
            - call: "POST /brewer-models"
              payload: { model_code: "K-LOCK", firmware_compat: "RESTRICTIVE", warranty_months: 12, descale_interval_brews: 200, msrp_cents: 9000, unit_cost_cents: 8000 }
              as: PlatformAdmin
              captures: { vb3_mlock: $.data.id }
            - call: "POST /brewer-models"
              payload: { model_code: "K-OPEN", firmware_compat: "OPEN", warranty_months: 12, descale_interval_brews: 200, msrp_cents: 7000, unit_cost_cents: 6000 }
              as: PlatformAdmin
              captures: { vb3_mopen: $.data.id }
            - call: "POST /households"
              payload: { region: "NW", size: 2 }
              as: PlatformAdmin
              captures: { vb3_h1: $.data.id }
            - call: "POST /households"
              payload: { region: "NW", size: 2 }
              as: PlatformAdmin
              captures: { vb3_h2: $.data.id }
            - call: "POST /households/${vb3_h1}/brewers"
              payload: { model_id: "${vb3_mlock}", serial_number: "SN-VB3-LOCK" }
              as: PlatformAdmin
              captures: { vb3_b_lock: $.data.id }
            - call: "POST /households/${vb3_h2}/brewers"
              payload: { model_id: "${vb3_mopen}", serial_number: "SN-VB3-OPEN" }
              as: PlatformAdmin
              captures: { vb3_b_open: $.data.id }
          trigger:
            - call: "POST /brewers/${vb3_b_lock}/record-brews"
              payload: { brews: 5, variety_id: "${vb3_uvar}" }
              as: PlatformAdmin
              captures: { vb3_err: $.data.error_id }
            - call: "POST /brewers/${vb3_b_open}/record-brews"
              payload: { brews: 5, variety_id: "${vb3_uvar}" }
              as: PlatformAdmin
              captures: { vb3_count: $.data.brew_count }
          assert:
            - "RESTRICTIVE brewer: error_id == ERR_POD_BLOCKED (422); brew_count stays 0"
            - "OPEN brewer: 200 and brew_count == 5 — same unlicensed variety brews fine on open firmware"

      - name: warranty_claim_on_expired_brewer_rejected
        claim_type: Violation → Error
        grounds:
          - "validations[priority=11]"
          - "errors.ERR_WARRANTY_NOT_ACTIVE"
        distinguishing_aspect: "A WARRANTY_CLAIM opened after lazy expiry (clock == registered_at + warranty_months) fails 409 ERR_WARRANTY_NOT_ACTIVE; DESCALING events remain legal out of warranty."
        test_recipe:
          setup: ["Brewer on a warranty_months=1 model registered 2026-09-01; clock advanced to 2026-10-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
