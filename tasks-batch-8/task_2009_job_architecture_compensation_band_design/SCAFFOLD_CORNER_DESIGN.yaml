scaffold_corner_design:
  - section: entities
    instances:
      - name: program_creation_defaults
        claim_type: defaults
        grounds: [entities.CompProgram.fields.refresh_cadence_months, entities.CompProgram.fields.status]
        distinguishing_aspect: "Omitting refresh_cadence_months applies default 12; status starts DRAFT; computed totals start at 0."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /comp/programs", payload: { fiscal_year: 2027, merit_budget_cents: 50000000, refresh_budget_cents: 2000000, pricing_as_of_date: "2026-08-01" }, as: CompAdmin, captures: { prog: $.data.id } }
          assert:
            - "CompProgram.${prog}.refresh_cadence_months == 12 (default applied)"
            - "status == DRAFT; total_payroll_projection_cents == 0; refresh_budget_spent_cents == 0; version == 1"

      - name: employee_create_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Employee.fields.compa_ratio, entities.Employee.fields.range_position]
        distinguishing_aspect: "Client-supplied id/version/compa_ratio in the create body are ignored: server mints a UUID id, sets version 1, and computes compa_ratio itself (null here, no PUBLISHED band)."
        test_recipe:
          setup: ["department DA exists; profile SWE1 APPROVED; zone US-NAT exists; no bands priced"]
          setup_api_calls:
            - { call: "POST /comp/job-families", payload: { code: "ENG", name: "Engineering" }, as: CompAdmin, captures: { fam: $.data.id } }
            - { call: "POST /comp/job-levels", payload: { level_code: "P1", title: "Engineer I", rank_order: 1 }, as: CompAdmin, captures: { lv1: $.data.id } }
            - { call: "POST /comp/geo-zones", payload: { zone_code: "US-NAT", name: "US National", differential_ratio: 1.000000 }, as: CompAdmin, captures: { nat: $.data.id } }
            - { call: "POST /comp/job-profiles", payload: { job_family_id: "${fam}", job_level_id: "${lv1}", title: "SWE I", summary: "s", salary_basis_weekly_cents: 200000, duties_test_passed: true }, as: CompAnalyst, captures: { prof1: $.data.id } }
            - { call: "POST /comp/job-profiles/${prof1}/determine-flsa", payload: {}, as: CompAnalyst }
            - { call: "POST /comp/job-profiles/${prof1}/submit", payload: {}, as: CompAnalyst }
            - { call: "POST /comp/job-profiles/${prof1}/approve", payload: {}, as: CompManager }
            - { call: "POST /comp/departments", payload: { name: "Dept A", code: "DA", adjustment_pool_cents: 5000000 }, as: CompAdmin, captures: { dept: $.data.id } }
          trigger:
            - { call: "POST /comp/employees", payload: { employee_ref: "E1", department_id: "${dept}", job_profile_id: "${prof1}", geo_zone_id: "${nat}", base_salary_cents: 10000000, hire_date: "2020-01-15", id: "deadbeef-0000-0000-0000-000000000000", version: 99, compa_ratio: 9.9999 }, as: HRBP, captures: { emp: $.data.id, ev: $.data.version, cr: $.data.compa_ratio } }
          assert:
            - "Employee.${emp}.id != deadbeef-0000-0000-0000-000000000000 (server-minted)"
            - "version == 1 (client 99 ignored)"
            - "compa_ratio == null and range_position == UNBANDED (client 9.9999 ignored; no PUBLISHED band exists)"

      - name: pay_band_get_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID yields ERR_NOT_FOUND (404), not a 500 or empty object."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /comp/pay-bands/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: CompAnalyst, as_user_id: "analyst-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND with http 404"

      - name: employee_create_missing_required_field
        claim_type: required_fields
        grounds: ["entities.Employee.fields.base_salary_cents", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required base_salary_cents yields ERR_INVALID_REQUEST (400) before any state or business check."
        test_recipe:
          setup: ["department DA, approved profile, and zone exist"]
          setup_api_calls:
            - { call: "POST /comp/job-families", payload: { code: "ENG", name: "Engineering" }, as: CompAdmin, captures: { fam: $.data.id } }
            - { call: "POST /comp/job-levels", payload: { level_code: "P1", title: "Engineer I", rank_order: 1 }, as: CompAdmin, captures: { lv1: $.data.id } }
            - { call: "POST /comp/geo-zones", payload: { zone_code: "US-NAT", name: "US National", differential_ratio: 1.000000 }, as: CompAdmin, captures: { nat: $.data.id } }
            - { call: "POST /comp/job-profiles", payload: { job_family_id: "${fam}", job_level_id: "${lv1}", title: "SWE I", summary: "s", salary_basis_weekly_cents: 200000, duties_test_passed: true }, as: CompAnalyst, captures: { prof1: $.data.id } }
            - { call: "POST /comp/job-profiles/${prof1}/determine-flsa", payload: {}, as: CompAnalyst }
            - { call: "POST /comp/job-profiles/${prof1}/submit", payload: {}, as: CompAnalyst }
            - { call: "POST /comp/job-profiles/${prof1}/approve", payload: {}, as: CompManager }
            - { call: "POST /comp/departments", payload: { name: "Dept A", code: "DA", adjustment_pool_cents: 5000000 }, as: CompAdmin, captures: { dept: $.data.id } }
          trigger:
            - { call: "POST /comp/employees", payload: { employee_ref: "E1", department_id: "${dept}", job_profile_id: "${prof1}", geo_zone_id: "${nat}", hire_date: "2020-01-15" }, as: HRBP, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST with http 400; no employee persisted"

      - name: band_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds: ["entities.PayBand.fields.target_percentile", "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "target_percentile P90 is not a declared enum member -> ERR_INVALID_ENUM (400)."
        test_recipe:
          setup: ["ENG family, levels P1/P2, zone, and a DRAFT program exist"]
          setup_api_calls:
            - { call: "POST /comp/job-families", payload: { code: "ENG", name: "Engineering" }, as: CompAdmin, captures: { fam: $.data.id } }
            - { call: "POST /comp/job-levels", payload: { level_code: "P1", title: "Engineer I", rank_order: 1 }, as: CompAdmin }
            - { call: "POST /comp/job-levels", payload: { level_code: "P2", title: "Engineer II", rank_order: 2 }, as: CompAdmin, captures: { lv2: $.data.id } }
            - { call: "POST /comp/geo-zones", payload: { zone_code: "US-NAT", name: "US National", differential_ratio: 1.000000 }, as: CompAdmin, captures: { nat: $.data.id } }
            - { call: "POST /comp/programs", payload: { fiscal_year: 2027, merit_budget_cents: 50000000, refresh_budget_cents: 2000000, pricing_as_of_date: "2026-08-01" }, as: CompAdmin, captures: { prog: $.data.id } }
          trigger:
            - { call: "POST /comp/pay-bands", payload: { comp_program_id: "${prog}", job_family_id: "${fam}", job_level_id: "${lv2}", geo_zone_id: "${nat}", target_percentile: "P90", spread_pct: 0.3000 }, as: CompAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_ENUM with http 400"

      - name: department_list_pagination
        claim_type: listing
        grounds: [response_envelope.pagination_fields, response_envelope.pagination_defaults]
        distinguishing_aspect: "limit/offset/total_count/has_more interact correctly: 3 departments, page 1 (limit 2) shows has_more true, page 2 (offset 2) returns 1 row with has_more false."
        test_recipe:
          setup: ["three departments created"]
          setup_api_calls:
            - { call: "POST /comp/departments", payload: { name: "Dept A", code: "DA", adjustment_pool_cents: 1000000 }, as: CompAdmin }
            - { call: "POST /comp/departments", payload: { name: "Dept B", code: "DB", adjustment_pool_cents: 1000000 }, as: CompAdmin }
            - { call: "POST /comp/departments", payload: { name: "Dept C", code: "DC", adjustment_pool_cents: 1000000 }, as: CompAdmin }
          trigger:
            - { call: "GET /comp/departments", payload: { limit: 2, offset: 0 }, as: CompAnalyst, as_user_id: "analyst-1" }
            - { call: "GET /comp/departments", payload: { limit: 2, offset: 2 }, as: CompAnalyst, as_user_id: "analyst-1" }
          assert:
            - "page 1: 2 rows, total_count == 3, has_more == true"
            - "page 2: 1 row, total_count == 3, has_more == false"
            - "default limit is 10 and max is 100 per response_envelope.pagination_defaults"

  - section: state_machines
    instances:
      - name: price_published_band_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.PayBand.transitions", "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "price is declared only from DRAFT/PRICED; from PUBLISHED it fails with ERR_INVALID_STATE_TRANSITION and the band is untouched."
        test_recipe:
          setup: ["ENG P1 band PUBLISHED (mid 10000000, spread 0.30); program in PRICING (publish allowed from PRICING)"]
          setup_api_calls:
            - { call: "POST /comp/job-families", payload: { code: "ENG", name: "Engineering" }, as: CompAdmin, captures: { fam: $.data.id } }
            - { call: "POST /comp/job-levels", payload: { level_code: "P1", title: "Engineer I", rank_order: 1 }, as: CompAdmin, captures: { lv1: $.data.id } }
            - { call: "POST /comp/job-levels", payload: { level_code: "P2", title: "Engineer II", rank_order: 2 }, as: CompAdmin }
            - { call: "POST /comp/geo-zones", payload: { zone_code: "US-NAT", name: "US National", differential_ratio: 1.000000 }, as: CompAdmin, captures: { nat: $.data.id } }
            - { call: "POST /comp/job-profiles", payload: { job_family_id: "${fam}", job_level_id: "${lv1}", title: "SWE I", summary: "s", salary_basis_weekly_cents: 200000, duties_test_passed: true }, as: CompAnalyst, captures: { prof1: $.data.id } }
            - { call: "POST /comp/job-profiles/${prof1}/determine-flsa", payload: {}, as: CompAnalyst }
            - { call: "POST /comp/job-profiles/${prof1}/submit", payload: {}, as: CompAnalyst }
            - { call: "POST /comp/job-profiles/${prof1}/approve", payload: {}, as: CompManager }
            - { call: "POST /comp/programs", payload: { fiscal_year: 2027, merit_budget_cents: 50000000, refresh_budget_cents: 2000000, pricing_as_of_date: "2026-08-01" }, as: CompAdmin, captures: { prog: $.data.id } }
            - { call: "POST /comp/programs/${prog}/transition", payload: { to_state: "FRAMEWORK_LOCKED" }, as: CompAdmin }
            - { call: "POST /comp/programs/${prog}/transition", payload: { to_state: "PRICING" }, as: CompAdmin }
            - { call: "POST /comp/market-surveys", payload: { name: "S", publisher: "Pub", survey_year: 2026, effective_date: "2026-08-01" }, as: CompAnalyst, captures: { s: $.data.id } }
            - { call: "POST /comp/market-surveys/${s}/accept", payload: {}, as: CompManager }
            - { call: "POST /comp/market-cuts", payload: { market_survey_id: "${s}", job_profile_id: "${prof1}", geo_zone_id: "${nat}", p50_cents: 10000000, sample_size: 20, effective_date: "2026-08-01" }, as: CompAnalyst }
            - { call: "POST /comp/pay-bands", payload: { comp_program_id: "${prog}", job_family_id: "${fam}", job_level_id: "${lv1}", geo_zone_id: "${nat}", target_percentile: "P50", spread_pct: 0.3000 }, as: CompAnalyst, captures: { band: $.data.id, band_v: $.data.version } }
            - { call: "POST /comp/pay-bands/${band}/price", payload: { pricing_variant: "OFFICIAL", expected_pay_band_version: "${band_v}" }, as: CompAnalyst }
            - { call: "POST /comp/pay-bands/${band}/approve", payload: {}, as: CompManager }
            - { call: "POST /comp/pay-bands/${band}/publish", payload: {}, as: CompManager, captures: { band_vp: $.data.version } }
          trigger:
            - { call: "POST /comp/pay-bands/${band}/price", payload: { pricing_variant: "OFFICIAL", expected_pay_band_version: "${band_vp}" }, as: CompAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (OCC passed — version current — so the state machine is what rejects)"
            - "PayBand.${band}.status == PUBLISHED and midpoint_cents == 10000000 (unchanged)"

      - name: withdraw_then_submit_terminal
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.MappingDecision.transitions", "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "WITHDRAWN is terminal: submit from WITHDRAWN fails with ERR_ALREADY_TERMINAL, not ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["ENG P1 band PUBLISHED; program MAPPING_OPEN; dept DA; employee E1 on SWE1; mapping created (DRAFT) then withdrawn"]
          setup_api_calls:
            - { call: "POST /comp/job-families", payload: { code: "ENG", name: "Engineering" }, as: CompAdmin, captures: { fam: $.data.id } }
            - { call: "POST /comp/job-levels", payload: { level_code: "P1", title: "Engineer I", rank_order: 1 }, as: CompAdmin, captures: { lv1: $.data.id } }
            - { call: "POST /comp/job-levels", payload: { level_code: "P2", title: "Engineer II", rank_order: 2 }, as: CompAdmin, captures: { lv2: $.data.id } }
            - { call: "POST /comp/geo-zones", payload: { zone_code: "US-NAT", name: "US National", differential_ratio: 1.000000 }, as: CompAdmin, captures: { nat: $.data.id } }
            - { call: "POST /comp/job-profiles", payload: { job_family_id: "${fam}", job_level_id: "${lv1}", title: "SWE I", summary: "s", salary_basis_weekly_cents: 200000, duties_test_passed: true }, as: CompAnalyst, captures: { prof1: $.data.id } }
            - { call: "POST /comp/job-profiles/${prof1}/determine-flsa", payload: {}, as: CompAnalyst }
            - { call: "POST /comp/job-profiles/${prof1}/submit", payload: {}, as: CompAnalyst }
            - { call: "POST /comp/job-profiles/${prof1}/approve", payload: {}, as: CompManager }
            - { call: "POST /comp/job-profiles", payload: { job_family_id: "${fam}", job_level_id: "${lv2}", title: "SWE II", summary: "s", salary_basis_weekly_cents: 200000, duties_test_passed: true }, as: CompAnalyst, captures: { prof2: $.data.id } }
            - { call: "POST /comp/job-profiles/${prof2}/determine-flsa", payload: {}, as: CompAnalyst }
            - { call: "POST /comp/job-profiles/${prof2}/submit", payload: {}, as: CompAnalyst }
            - { call: "POST /comp/job-profiles/${prof2}/approve", payload: {}, as: CompManager }
            - { call: "POST /comp/programs", payload: { fiscal_year: 2027, merit_budget_cents: 50000000, refresh_budget_cents: 2000000, pricing_as_of_date: "2026-08-01" }, as: CompAdmin, captures: { prog: $.data.id } }
            - { call: "POST /comp/programs/${prog}/transition", payload: { to_state: "FRAMEWORK_LOCKED" }, as: CompAdmin }
            - { call: "POST /comp/programs/${prog}/transition", payload: { to_state: "PRICING" }, as: CompAdmin }
            - { call: "POST /comp/market-surveys", payload: { name: "S", publisher: "Pub", survey_year: 2026, effective_date: "2026-08-01" }, as: CompAnalyst, captures: { s: $.data.id } }
            - { call: "POST /comp/market-surveys/${s}/accept", payload: {}, as: CompManager }
            - { call: "POST /comp/market-cuts", payload: { market_survey_id: "${s}", job_profile_id: "${prof1}", geo_zone_id: "${nat}", p50_cents: 10000000, sample_size: 20, effective_date: "2026-08-01" }, as: CompAnalyst }
            - { call: "POST /comp/pay-bands", payload: { comp_program_id: "${prog}", job_family_id: "${fam}", job_level_id: "${lv1}", geo_zone_id: "${nat}", target_percentile: "P50", spread_pct: 0.3000 }, as: CompAnalyst, captures: { band1: $.data.id, band1_v: $.data.version } }
            - { call: "POST /comp/pay-bands/${band1}/price", payload: { pricing_variant: "OFFICIAL", expected_pay_band_version: "${band1_v}" }, as: CompAnalyst }
            - { call: "POST /comp/pay-bands/${band1}/approve", payload: {}, as: CompManager }
            - { call: "POST /comp/pay-bands/${band1}/publish", payload: {}, as: CompManager }
            - { call: "POST /comp/programs/${prog}/transition", payload: { to_state: "MAPPING_OPEN" }, as: CompAdmin }
            - { call: "POST /comp/departments", payload: { name: "Dept A", code: "DA", adjustment_pool_cents: 5000000 }, as: CompAdmin, captures: { dept: $.data.id } }
            - { call: "POST /comp/employees", payload: { employee_ref: "E1", department_id: "${dept}", job_profile_id: "${prof1}", geo_zone_id: "${nat}", base_salary_cents: 10000000, hire_date: "2020-01-15" }, as: HRBP, captures: { emp: $.data.id } }
            - { call: "POST /comp/mapping-decisions", payload: { employee_id: "${emp}", to_job_profile_id: "${prof2}" }, as: DepartmentManager, as_user_id: "${dept}", captures: { md: $.data.id } }
            - { call: "POST /comp/mapping-decisions/${md}/withdraw", payload: {}, as: DepartmentManager, as_user_id: "${dept}" }
          trigger:
            - { call: "POST /comp/mapping-decisions/${md}/submit", payload: {}, as: DepartmentManager, as_user_id: "${dept}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ALREADY_TERMINAL (terminal lockdown), decision remains WITHDRAWN"

      - name: survey_rejected_is_terminal
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.MarketSurvey.transitions", "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "A REJECTED survey cannot be accepted afterwards; both terminals lock."
        test_recipe:
          setup: ["one survey in SUBMITTED, then rejected"]
          setup_api_calls:
            - { call: "POST /comp/market-surveys", payload: { name: "S", publisher: "Pub", survey_year: 2026, effective_date: "2026-08-01" }, as: CompAnalyst, captures: { s: $.data.id } }
            - { call: "POST /comp/market-surveys/${s}/reject", payload: {}, as: CompManager }
          trigger:
            - { call: "POST /comp/market-surveys/${s}/accept", payload: {}, as: CompManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ALREADY_TERMINAL; MarketSurvey.${s}.status == REJECTED"

      - name: band_created_in_draft
        claim_type: initial_state
        grounds: [state_machines.PayBand.initial_state]
        distinguishing_aspect: "A new PayBand starts DRAFT with null computed pricing fields and version 1."
        test_recipe:
          setup: ["ENG family, levels, zone, DRAFT program exist"]
          setup_api_calls:
            - { call: "POST /comp/job-families", payload: { code: "ENG", name: "Engineering" }, as: CompAdmin, captures: { fam: $.data.id } }
            - { call: "POST /comp/job-levels", payload: { level_code: "P1", title: "Engineer I", rank_order: 1 }, as: CompAdmin, captures: { lv1: $.data.id } }
            - { call: "POST /comp/geo-zones", payload: { zone_code: "US-NAT", name: "US National", differential_ratio: 1.000000 }, as: CompAdmin, captures: { nat: $.data.id } }
            - { call: "POST /comp/programs", payload: { fiscal_year: 2027, merit_budget_cents: 50000000, refresh_budget_cents: 2000000, pricing_as_of_date: "2026-08-01" }, as: CompAdmin, captures: { prog: $.data.id } }
          trigger:
            - { call: "POST /comp/pay-bands", payload: { comp_program_id: "${prog}", job_family_id: "${fam}", job_level_id: "${lv1}", geo_zone_id: "${nat}", target_percentile: "P50", spread_pct: 0.3000 }, as: CompAnalyst, captures: { band: $.data.id, st: $.data.status } }
          assert:
            - "status == DRAFT; midpoint_cents == null; min_cents == null; max_cents == null; pricing_variant == null; version == 1"

      - name: publish_recomputes_employee_compa
        claim_type: side_effect_execution
        grounds: [state_machines.PayBand.transitions, calculations.compa_ratio_and_range_position]
        distinguishing_aspect: "An employee created while its band is merely COMP_APPROVED stays UNBANDED; the publish transition recomputes compa_ratio to 1.0769 and range_position IN_RANGE without any employee write."
        test_recipe:
          setup:
            - "ENG P2 band COMP_APPROVED (mid 13000000, spread 0.30 -> [11050000, 14950000]); program PRICING"
            - "employee E1 salary 14000000 on SWE2 created while band not yet PUBLISHED (compa_ratio null)"
          setup_api_calls:
            - { call: "POST /comp/job-families", payload: { code: "ENG", name: "Engineering" }, as: CompAdmin, captures: { fam: $.data.id } }
            - { call: "POST /comp/job-levels", payload: { level_code: "P1", title: "Engineer I", rank_order: 1 }, as: CompAdmin }
            - { call: "POST /comp/job-levels", payload: { level_code: "P2", title: "Engineer II", rank_order: 2 }, as: CompAdmin, captures: { lv2: $.data.id } }
            - { call: "POST /comp/geo-zones", payload: { zone_code: "US-NAT", name: "US National", differential_ratio: 1.000000 }, as: CompAdmin, captures: { nat: $.data.id } }
            - { call: "POST /comp/job-profiles", payload: { job_family_id: "${fam}", job_level_id: "${lv2}", title: "SWE II", summary: "s", salary_basis_weekly_cents: 200000, duties_test_passed: true }, as: CompAnalyst, captures: { prof2: $.data.id } }
            - { call: "POST /comp/job-profiles/${prof2}/determine-flsa", payload: {}, as: CompAnalyst }
            - { call: "POST /comp/job-profiles/${prof2}/submit", payload: {}, as: CompAnalyst }
            - { call: "POST /comp/job-profiles/${prof2}/approve", payload: {}, as: CompManager }
            - { call: "POST /comp/programs", payload: { fiscal_year: 2027, merit_budget_cents: 50000000, refresh_budget_cents: 2000000, pricing_as_of_date: "2026-08-01" }, as: CompAdmin, captures: { prog: $.data.id } }
            - { call: "POST /comp/programs/${prog}/transition", payload: { to_state: "FRAMEWORK_LOCKED" }, as: CompAdmin }
            - { call: "POST /comp/programs/${prog}/transition", payload: { to_state: "PRICING" }, as: CompAdmin }
            - { call: "POST /comp/market-surveys", payload: { name: "S", publisher: "Pub", survey_year: 2026, effective_date: "2026-08-01" }, as: CompAnalyst, captures: { s: $.data.id } }
            - { call: "POST /comp/market-surveys/${s}/accept", payload: {}, as: CompManager }
            - { call: "POST /comp/market-cuts", payload: { market_survey_id: "${s}", job_profile_id: "${prof2}", geo_zone_id: "${nat}", p50_cents: 13000000, sample_size: 20, effective_date: "2026-08-01" }, as: CompAnalyst }
            - { call: "POST /comp/pay-bands", payload: { comp_program_id: "${prog}", job_family_id: "${fam}", job_level_id: "${lv2}", geo_zone_id: "${nat}", target_percentile: "P50", spread_pct: 0.3000 }, as: CompAnalyst, captures: { band2: $.data.id, band2_v: $.data.version } }
            - { call: "POST /comp/pay-bands/${band2}/price", payload: { pricing_variant: "OFFICIAL", expected_pay_band_version: "${band2_v}" }, as: CompAnalyst }
            - { call: "POST /comp/pay-bands/${band2}/approve", payload: {}, as: CompManager }
            - { call: "POST /comp/departments", payload: { name: "Dept A", code: "DA", adjustment_pool_cents: 5000000 }, as: CompAdmin, captures: { dept: $.data.id } }
            - { call: "POST /comp/employees", payload: { employee_ref: "E1", department_id: "${dept}", job_profile_id: "${prof2}", geo_zone_id: "${nat}", base_salary_cents: 14000000, hire_date: "2019-05-01" }, as: HRBP, captures: { emp: $.data.id, cr_pre: $.data.compa_ratio } }
          trigger:
            - { call: "POST /comp/pay-bands/${band2}/publish", payload: {}, as: CompManager }
          assert:
            - "before publish: Employee compa_ratio == null, range_position == UNBANDED"
            - "after publish: Employee.${emp}.compa_ratio == 1.0769 (round4(14000000/13000000)), range_position == IN_RANGE, red_circled == false"
            - "Employee.version incremented by the cascade (publish is a mutation of derived employee fields)"

      - name: refresh_apply_leaves_draft_band_untouched
        claim_type: conditional_cascade
        grounds: [state_machines.RefreshCycle.transitions, state_machines.PayBand.transitions]
