    roles: [NetworkDirector]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["system transitions whose clock preconditions now hold fire in deterministic order: Course SCHEDULED->IN_SESSION and IN_SESSION->CONCLUDED, Certification LAPSED->EXPIRED grace expiry"]

