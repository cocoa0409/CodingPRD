              as: Admin
              captures: { cid: $.data.id }
            - call: "POST /edt/patients"
              payload: { facility_id: "${fid}", full_name: "Pat N", age_band: "ADULT", bmi: 17.0 }
              as: Intake
              captures: { pid: $.data.id }
            - call: "POST /edt/admissions"
              payload: { patient_id: "${pid}", facility_id: "${fid}", program_id: "${pgid}", cohort_id: "${cid}", requested_length_of_stay_days: 14 }
              as: Intake
              captures: { aid: $.data.id }
            - call: "POST /edt/authorizations"
              payload: { admission_id: "${aid}", facility_id: "${fid}", payer_name: "BlueCo", daily_rate_cents: 100000, coinsurance_pct: 0.20 }
              as: UtilizationReviewer
              captures: { authid: $.data.id }
            - call: "POST /edt/reviews"
              payload: { authorization_id: "${authid}", facility_id: "${fid}", decision: "APPROVE", window_start_iso: "2026-01-01T00:00:00Z", window_end_iso: "2026-01-08T00:00:00Z" }
              as: UtilizationReviewer
          trigger:
            - call: "POST /edt/reviews"
              payload: { authorization_id: "${authid}", facility_id: "${fid}", decision: "APPROVE", window_start_iso: "2026-01-10T00:00:00Z", window_end_iso: "2026-01-15T00:00:00Z" }
              as: UtilizationReviewer
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_AUTH_WINDOW_NONCONTIGUOUS"
            - "InsuranceAuthorization.${authid}.days_authorized == 7"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: bed_conservation_admit_then_discharge
        grounds:
          - state_machines.Admission.PENDING_ADMISSION_to_ADMITTED
          - state_machines.Admission.DISCHARGE_PENDING_to_DISCHARGED
          - entities.Program.fields.beds_occupied
          - entities.Program.fields.beds_available
        distinguishing_aspect: |
          Conserved quantity = program bed pool: beds_occupied + beds_available ==
          bed_capacity holds before and after the admit/discharge pair. Admit debits one bed
          (occupied 1 / available 4), discharge credits it back (occupied 0 / available 5);
          the invariant beds_occupied + beds_available == 5 never drifts.
        test_recipe:
          setup:
            - "Program capacity 5; one patient admitted then taken through discharge (finalized discharge plan + waived family program)."
          setup_api_calls:
            - call: "POST /edt/facilities"
              payload: { name: "Maple EDT" }
              as: Admin
              captures: { fid: $.data.id }
            - call: "POST /edt/programs"
              payload: { facility_id: "${fid}", level_of_care: "RESIDENTIAL", bed_capacity: 5 }
              as: Admin
              captures: { pgid: $.data.id }
            - call: "POST /edt/cohorts"
              payload: { program_id: "${pgid}", facility_id: "${fid}", name: "Adult AM", age_band: "ADULT", slot_capacity: 5 }
              as: Admin
              captures: { cid: $.data.id }
            - call: "POST /edt/patients"
              payload: { facility_id: "${fid}", full_name: "Pat O", age_band: "ADULT", bmi: 17.0 }
              as: Intake
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /edt/assessments"
              payload: { patient_id: "${pid}", facility_id: "${fid}", medical_severity: 5, behavioral_severity: 5, psychiatric_severity: 4, motivation_level: 6 }
              as: Clinician
              captures: { asid: $.data.id }
            - call: "POST /edt/assessments/${asid}/finalize"
              payload: { expected_patient_version: "${pv}" }
              as: Clinician
            - call: "POST /edt/admissions"
              payload: { patient_id: "${pid}", facility_id: "${fid}", program_id: "${pgid}", cohort_id: "${cid}", requested_length_of_stay_days: 14 }
              as: Intake
              captures: { aid: $.data.id }
            - call: "POST /edt/authorizations"
              payload: { admission_id: "${aid}", facility_id: "${fid}", payer_name: "BlueCo", daily_rate_cents: 100000, coinsurance_pct: 0.20 }
              as: UtilizationReviewer
              captures: { authid: $.data.id }
            - call: "POST /edt/reviews"
              payload: { authorization_id: "${authid}", facility_id: "${fid}", decision: "APPROVE", window_start_iso: "2026-01-01T00:00:00Z", window_end_iso: "2026-01-15T00:00:00Z" }
              as: UtilizationReviewer
            - call: "POST /edt/admissions/${aid}/promote"
              as: Intake
            - call: "POST /edt/admissions/${aid}/admit"
              as: Intake
            - call: "POST /edt/family-programs"
              payload: { admission_id: "${aid}", facility_id: "${fid}", family_contact_name: "Kin", sessions_required: 1 }
              as: Clinician
              captures: { fpid: $.data.id }
            - call: "POST /edt/family-programs/${fpid}/waive"
              as: Clinician
            - call: "POST /edt/discharge-plans"
              payload: { admission_id: "${aid}", facility_id: "${fid}", aftercare_level_of_care: "IOP", relapse_warning_signs: "skipping meals", relapse_plan_complete: true }
              as: Clinician
              captures: { dpid: $.data.id }
            - call: "POST /edt/discharge-plans/${dpid}/finalize"
              as: Clinician
            - call: "POST /edt/admissions/${aid}/begin-discharge"
              as: Clinician
          trigger:
            - call: "POST /edt/admissions/${aid}/discharge"
              as: Clinician
          assert:
            - "Program.${pgid}.beds_occupied == 0"
            - "Program.${pgid}.beds_available == 5"
            - "Program.${pgid}.occupancy_posture == OPEN"

      - name: authorization_days_conservation_consumed_plus_remaining
        grounds:
          - calculations.authorized_days_balance
          - entities.InsuranceAuthorization.fields.days_authorized
          - entities.InsuranceAuthorization.fields.days_consumed
          - entities.InsuranceAuthorization.fields.days_remaining
        distinguishing_aspect: |
          A DIFFERENT conserved quantity (covered-day ledger, not beds): days_consumed +
          days_remaining == days_authorized holds as the clock advances. With a 7-day
          authorized window and clock at day 3, consumed 3 + remaining 4 == authorized 7;
          the identity never drifts as the clock moves.
        test_recipe:
          setup:
            - "Authorization with one APPROVED 7-day window [2026-01-01,2026-01-08); clock advanced to 2026-01-04."
          setup_api_calls:
            - call: "POST /edt/facilities"
              payload: { name: "Maple EDT" }
              as: Admin
              captures: { fid: $.data.id }
            - call: "POST /edt/programs"
              payload: { facility_id: "${fid}", level_of_care: "RESIDENTIAL", bed_capacity: 5 }
              as: Admin
              captures: { pgid: $.data.id }
            - call: "POST /edt/cohorts"
              payload: { program_id: "${pgid}", facility_id: "${fid}", name: "Adult AM", age_band: "ADULT", slot_capacity: 5 }
              as: Admin
              captures: { cid: $.data.id }
            - call: "POST /edt/patients"
              payload: { facility_id: "${fid}", full_name: "Pat P", age_band: "ADULT", bmi: 17.0 }
              as: Intake
              captures: { pid: $.data.id }
            - call: "POST /edt/admissions"
              payload: { patient_id: "${pid}", facility_id: "${fid}", program_id: "${pgid}", cohort_id: "${cid}", requested_length_of_stay_days: 7 }
              as: Intake
              captures: { aid: $.data.id }
            - call: "POST /edt/authorizations"
              payload: { admission_id: "${aid}", facility_id: "${fid}", payer_name: "BlueCo", daily_rate_cents: 100000, coinsurance_pct: 0.20 }
              as: UtilizationReviewer
              captures: { authid: $.data.id }
            - call: "POST /edt/reviews"
              payload: { authorization_id: "${authid}", facility_id: "${fid}", decision: "APPROVE", window_start_iso: "2026-01-01T00:00:00Z", window_end_iso: "2026-01-08T00:00:00Z" }
              as: UtilizationReviewer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-04T00:00:00Z" }
              as: Admin
          trigger:
            - call: "GET /edt/authorizations/${authid}"
              as: UtilizationReviewer
          assert:
            - "InsuranceAuthorization.${authid}.days_authorized == 7"
            - "InsuranceAuthorization.${authid}.days_consumed == 3"
            - "InsuranceAuthorization.${authid}.days_remaining == 4"
