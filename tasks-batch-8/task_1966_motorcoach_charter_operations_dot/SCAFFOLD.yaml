        default: 0

  - name: InsuranceCertificate
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> CharterOrder.id; the order this certificate covers"
      - name: venue_name
        type: string
        source: input
        description: "Venue requesting the certificate"
      - name: venue_address
        type: string
        source: input
        description: "Venue address"
      - name: certificate_type
        type: enum
        source: input
