        distinguishing_aspect: "Priority 1: a call without X-User-Role fails 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER even when the endpoint, payload, and target state would otherwise be valid."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z. One active ingredient."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
