  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: place_store_paused_beats_slot_full
        grounds:
          - validations[priority=7]
          - validations[priority=11]
          - errors[ERR_STORE_PAUSED]
          - errors[ERR_SLOT_FULL]
        distinguishing_aspect: >
          On place, business_constraint (ERR_STORE_PAUSED, priority 7) outranks business_temporal
          (ERR_SLOT_FULL, priority 11): an order whose store is PAUSED AND whose slot is already full
          returns ERR_STORE_PAUSED, a different category pair than instance 2's referential-vs-fiscal.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; store slot_capacity 1 so one prior placed order fills the slot; latte 615c."
            - "Member A's order placed (slot full); store then PAUSED; Member B's order paid and ready to place into the same full slot."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /stores", payload: { name: "Elm St", timezone: "America/Los_Angeles", slot_capacity: 1, prep_minutes: 0 }, as: PlatformAdmin, captures: { store_id: $.data.id } }
            - { call: "POST /stores/${store_id}/menu-items", payload: { name: "Latte", base_price_cents: 615, category: "BEVERAGE" }, as: PlatformAdmin, captures: { latte_id: $.data.id } }
            - { call: "POST /stores/${store_id}/pickup-slots", payload: { window_start: "2026-06-01T17:00:00Z", window_end: "2026-06-01T17:15:00Z" }, as: PlatformAdmin, captures: { slot_id: $.data.id, slot_v0: $.data.version } }
            - { call: "POST /members", payload: { email: "pa@x.com", full_name: "PA", birth_month_day: "01-01" }, as: Anonymous, captures: { mem_a: $.data.id } }
            - { call: "POST /members/${mem_a}/orders", payload: { store_id: "${store_id}", pickup_slot_id: "${slot_id}" }, as: Member, as_user_id: "${mem_a}", captures: { ord_a: $.data.id } }
            - { call: "POST /members/${mem_a}/orders/${ord_a}/lines", payload: { menu_item_id: "${latte_id}", quantity: 1 }, as: Member, as_user_id: "${mem_a}" }
            - { call: "POST /members/${mem_a}/orders/${ord_a}/pay", payload: { pay_method: "EXTERNAL_CARD" }, as: Member, as_user_id: "${mem_a}" }
            - { call: "POST /members/${mem_a}/orders/${ord_a}/place", payload: { expected_slot_version: "${slot_v0}" }, as: Member, as_user_id: "${mem_a}" }
            - { call: "POST /members", payload: { email: "pb@x.com", full_name: "PB", birth_month_day: "01-01" }, as: Anonymous, captures: { mem_b: $.data.id } }
            - { call: "POST /members/${mem_b}/orders", payload: { store_id: "${store_id}", pickup_slot_id: "${slot_id}" }, as: Member, as_user_id: "${mem_b}", captures: { ord_b: $.data.id } }
            - { call: "POST /members/${mem_b}/orders/${ord_b}/lines", payload: { menu_item_id: "${latte_id}", quantity: 1 }, as: Member, as_user_id: "${mem_b}" }
            - { call: "POST /members/${mem_b}/orders/${ord_b}/pay", payload: { pay_method: "EXTERNAL_CARD" }, as: Member, as_user_id: "${mem_b}" }
            - { call: "GET /stores/${store_id}/pickup-slots", payload: {}, as: Member, as_user_id: "${mem_b}", captures: { slot_v_now: "$.data[0].version" } }
            - { call: "POST /stores/${store_id}/pause", payload: { paused: true }, as: PlatformAdmin }
          trigger:
            - { call: "POST /members/${mem_b}/orders/${ord_b}/place", payload: { expected_slot_version: "${slot_v_now}" }, as: Member, as_user_id: "${mem_b}", captures: { err: $.data.error_id } }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_STORE_PAUSED"

      - name: pay_reward_not_applicable_beats_insufficient_balance
        grounds:
          - validations[priority=9]
          - validations[priority=12]
          - errors[ERR_REWARD_NOT_APPLICABLE]
          - errors[ERR_INSUFFICIENT_BALANCE]
        distinguishing_aspect: >
          On pay, business_referential (ERR_REWARD_NOT_APPLICABLE, priority 9) outranks business_fiscal
          (ERR_INSUFFICIENT_BALANCE, priority 12): an order applying an expired reward AND paying
          STORED_VALUE with an empty card returns ERR_REWARD_NOT_APPLICABLE, a distinct category pair.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z when reward minted; reward TTL makes it expire before 2026-12-01."
            - "Member with 0 card balance; order applies the now-expired reward and pays STORED_VALUE."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /stores", payload: { name: "Oak St", timezone: "America/Los_Angeles", slot_capacity: 5, prep_minutes: 0 }, as: PlatformAdmin, captures: { store_id: $.data.id } }
            - { call: "POST /stores/${store_id}/menu-items", payload: { name: "Latte", base_price_cents: 615, category: "BEVERAGE", reward_eligible: true }, as: PlatformAdmin, captures: { latte_id: $.data.id } }
            - { call: "POST /stores/${store_id}/menu-items", payload: { name: "Box", base_price_cents: 15000, category: "FOOD", reward_eligible: false }, as: PlatformAdmin, captures: { box_id: $.data.id } }
            - { call: "POST /stores/${store_id}/pickup-slots", payload: { window_start: "2026-06-01T17:00:00Z", window_end: "2026-06-01T17:15:00Z" }, as: PlatformAdmin, captures: { slot1_id: $.data.id, slot1_v: $.data.version } }
            - { call: "POST /stores/${store_id}/pickup-slots", payload: { window_start: "2026-12-01T17:00:00Z", window_end: "2026-12-01T17:15:00Z" }, as: PlatformAdmin, captures: { slot2_id: $.data.id } }
            - { call: "POST /members", payload: { email: "rb@x.com", full_name: "RB", birth_month_day: "01-01" }, as: Anonymous, captures: { mem_id: $.data.id } }
            - { call: "POST /members/${mem_id}/orders", payload: { store_id: "${store_id}", pickup_slot_id: "${slot1_id}" }, as: Member, as_user_id: "${mem_id}", captures: { seed_id: $.data.id } }
            - { call: "POST /members/${mem_id}/orders/${seed_id}/lines", payload: { menu_item_id: "${box_id}", quantity: 1 }, as: Member, as_user_id: "${mem_id}" }
            - { call: "POST /members/${mem_id}/orders/${seed_id}/pay", payload: { pay_method: "EXTERNAL_CARD" }, as: Member, as_user_id: "${mem_id}" }
            - { call: "POST /members/${mem_id}/orders/${seed_id}/place", payload: { expected_slot_version: "${slot1_v}" }, as: Member, as_user_id: "${mem_id}" }
            - { call: "POST /members/${mem_id}/rewards/redeem", payload: {}, as: Member, as_user_id: "${mem_id}", captures: { reward_id: $.data.id } }
            # advance clock past reward expiry; balance remains 0
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /members/${mem_id}/orders", payload: { store_id: "${store_id}", pickup_slot_id: "${slot2_id}", applied_reward_id: "${reward_id}" }, as: Member, as_user_id: "${mem_id}", captures: { order_id: $.data.id } }
            - { call: "POST /members/${mem_id}/orders/${order_id}/lines", payload: { menu_item_id: "${latte_id}", quantity: 1 }, as: Member, as_user_id: "${mem_id}" }
            - { call: "GET /members/${mem_id}/card", payload: {}, as: Member, as_user_id: "${mem_id}", captures: { card_v: "$.data[0].version" } }
          trigger:
            - { call: "POST /members/${mem_id}/orders/${order_id}/pay", payload: { pay_method: "STORED_VALUE", expected_card_version: "${card_v}" }, as: Member, as_user_id: "${mem_id}", captures: { err: $.data.error_id } }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_REWARD_NOT_APPLICABLE"

