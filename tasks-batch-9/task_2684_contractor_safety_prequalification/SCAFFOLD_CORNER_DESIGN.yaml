        distinguishing_aspect: "Priority 1 demands BOTH X-User-Role and X-User-ID: a request carrying a valid role but no X-User-ID is 401 ERR_UNAUTHENTICATED - never 403 - and it fails ahead of the 404 that the bogus path id in the same request would otherwise produce."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; Client Northwind on defaults; Contractor Acme registered."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /clients"
              payload: { legal_name: "Northwind Facilities", industry_code: "2361" }
              as: NetworkAdmin
              captures: { client_id: $.data.id }
            - call: "POST /contractors"
              payload: { legal_name: "Acme Mechanical", scope_of_work: ["MECHANICAL_TRADE"], hazard_profile: ["GENERAL"], employee_count: 40 }
              as: NetworkAdmin
              captures: { con_id: $.data.id, con_v: $.data.version }
          trigger:
            - call: "GET /contractors/${con_id}"
              payload: {}
              as: ContractorAdmin
              note: "sent with header X-User-Role ContractorAdmin and NO X-User-ID header"
            - call: "GET /contractors/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ContractorAdmin
              note: "again with no X-User-ID header, this time against an id that does not exist"
            - call: "POST /prequalifications"
              payload: { contractor_id: "${con_id}", client_id: "${client_id}", cycle_year: 2026, expected_contractor_version: "${con_v}" }
              as: ContractorAdmin
              note: "no X-User-Role header at all, X-User-ID present"
          assert:
