# =============================================================================
# §1.8 — Scaffold Difficulty Design (Test Targeting Index)
# Task 0076 — Hotel Housekeeping
#
# Each rule_id below corresponds verbatim to a rule in §0.5 of the
# prd-bench-scaffold-generator SKILL.md. Every instance grounds in §1.1–§1.6
# of the sibling SCAFFOLD.yaml; deleting this file does not change declared
# behavior, it only makes test coverage harder to audit.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: cleaning_task_priority_original_vs_rework
        grounds:
          - calculations.task_priority_score
          - state_machines.CleaningTask.SUBMITTED_to_CANCELLED
          - entities.CleaningTask.fields.priority_score
          - entities.CleaningTask.fields.priority_tier
          - entities.CleaningTask.fields.parent_task_id
        distinguishing_aspect: |
          The "original" and "rework" variants of task_priority_score operate on the
          CleaningTask entity domain and produce different priority_score and
          priority_tier for the same room+task_source inputs because the rework
          variant forces expedite_flag=true, activating the all-three-bonus synergy
          multiplier. This is a calculation-level dual variant on CleaningTask.
        test_recipe:
          setup:
            - "POST /rooms → STANDARD room R with vip_flag=true, pms_occupancy=VACANT, zone_code=Z1"
            - "POST /housekeepers → Alice in zone Z1; POST /housekeepers/{alice}/shift {shift_status:ON_SHIFT}"
            - "POST /cleaning-tasks → task T_orig with room_id=R.id, task_source=SCHEDULED, expedite_flag=false, early_check_in_at = now + 1h (within 4h window)"
          trigger:
            - "Observe T_orig (auto-dispatched to Alice). Then proceed through accept/start/submit on T_orig."
            - "POST /cleaning-tasks/{T_orig}/inspect {outcome:FAIL, checklist_items:[{item_code:BATHROOM, passed:false}]} → server auto-creates rework T_rework with parent_task_id=T_orig.id"
          assert:
            - "T_orig.priority_score == 75 and T_orig.priority_tier == 'HIGH'  # base 20 + vip 30 + early 25, no synergy because expedite_bonus is 0"
            - "T_rework.parent_task_id == T_orig.id and T_rework.expedite_flag == true and T_rework.task_source == 'SCHEDULED' and T_rework.early_check_in_at == T_orig.early_check_in_at"
            - "T_rework.priority_score == 110 and T_rework.priority_tier == 'URGENT'  # base 20 + round_half_up((30+20+25)*1.20) = 20 + 90 = 110"
            - "T_orig.priority_score != T_rework.priority_score even though the natural inputs are identical"

      - name: housekeeper_workload_provisional_vs_realized
        grounds:
          - calculations.housekeeper_workload_balance
          - entities.Housekeeper.fields.provisional_workload_minutes
          - entities.Housekeeper.fields.realized_workload_minutes
          - state_machines.CleaningTask.IN_PROGRESS_to_SUBMITTED
        distinguishing_aspect: |
          The provisional and realized variants operate on the Housekeeper entity
          domain (different from CleaningTask used in the previous instance) and
          can return DIFFERENT integer minute totals for the SAME housekeeper at
          the SAME instant: provisional sums estimated_minutes over non-terminal
          assigned tasks, realized sums actual_minutes over COMPLETED tasks today.
        test_recipe:
          setup:
            - "Create STANDARD room R1, R2; create Housekeeper Alice (zone Z1, ON_SHIFT)"
            - "POST /cleaning-tasks → T1 for R1, task_source=STAYOVER (estimated_minutes = 25 + 0 = 25). Auto-dispatched to Alice → ASSIGNED."
            - "Accept, start, submit T1 with a clock-advance of 30 minutes between start and submit → actual_minutes = 30; PASS inspection → T1.status=COMPLETED."
            - "POST /cleaning-tasks → T2 for R2, task_source=CHECK_OUT (estimated_minutes = 25 + 15 = 40). Auto-dispatched to Alice; accept, start; do NOT submit."
          trigger:
            - "GET /housekeepers/{alice}"
          assert:
            - "response.realized_workload_minutes == 30  # actual_minutes of T1 only"
            - "response.provisional_workload_minutes == 40  # estimated_minutes of in-progress T2 only"
            - "response.provisional_workload_minutes != response.realized_workload_minutes"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: priority_score_synergy_multiplier_mode_a
        grounds:
          - calculations.task_priority_score
          - calculations.task_priority_score.constants.SYNERGY_MULTIPLIER
          - entities.Room.fields.vip_flag
          - entities.CleaningTask.fields.expedite_flag
          - entities.CleaningTask.fields.early_check_in_at
        distinguishing_aspect: |
          Mode (a): formula has 5 inputs (task_source base, vip_bonus, expedite_bonus,
          early_bonus, synergy_multiplier) and a non-linear conditional branch — the
          SYNERGY_MULTIPLIER applies ONLY when vip_bonus, expedite_bonus, AND
          early_bonus are ALL non-zero. Removing any one of the three drops the
          multiplier and the priority_score reverts to additive.
        test_recipe:
          setup:
            - "Create STANDARD room R_A with vip_flag=true"
            - "Create STANDARD room R_B with vip_flag=false"
            - "POST /cleaning-tasks → T_A: room_id=R_A.id, task_source=SCHEDULED, expedite_flag=true, early_check_in_at = now + 1h"
            - "POST /cleaning-tasks → T_B: room_id=R_B.id, task_source=SCHEDULED, expedite_flag=true, early_check_in_at = now + 1h  (vip_bonus absent)"
          trigger:
            - "GET /cleaning-tasks/{T_A}; GET /cleaning-tasks/{T_B}"
          assert:
            - "T_A.priority_score == 110  # base 20 + round_half_up((30+20+25)*1.20) = 20 + 90 = 110"
            - "T_B.priority_score == 65   # base 20 + (0+20+25) = 65, NO synergy because vip_bonus is 0"
            - "T_A.priority_tier == 'URGENT' and T_B.priority_tier == 'NORMAL'  # 110>=100 URGENT, 65<70 NORMAL"

      - name: minibar_charge_sum_then_round_mode_b
        grounds:
          - calculations.minibar_charge_total
          - calculations.minibar_charge_total.constants.MINIBAR_TAX_RATE
          - entities.MinibarConsumption.fields.gross_amount_cents
          - entities.MinibarConsumption.fields.tax_cents
          - entities.MinibarConsumption.fields.posted_amount_cents
        distinguishing_aspect: |
          Mode (b): nested-rounding order matters. The scaffold pins SUM first then
          ROUND once. Two line items priced at 25 cents each produce gross=50,
          tax = round_half_up(5.0) = 5, posted = 55. The wrong "round-per-line then
          sum" approach yields round_half_up(2.5)+round_half_up(2.5) = 3+3 = 6,
          posted = 56 — a different literal value at every level.
        test_recipe:
          setup:
            - "POST /minibar-items → Item_X with unit_price_cents=25, par_level=10, replenishment_threshold=2"
            - "POST /minibar-items → Item_Y with unit_price_cents=25, par_level=10, replenishment_threshold=2"
            - "POST /rooms → room R; POST /minibar-consumptions → C with line_items=[{minibar_item_id:Item_X, quantity:1}, {minibar_item_id:Item_Y, quantity:1}], source_type=GUEST_SELF_REPORT"
          trigger:
            - "POST /minibar-consumptions/{C}/post"
          assert:
            - "C.gross_amount_cents == 50"
            - "C.tax_cents == 5    # round_half_up(50 * 0.10) on the SUM"
            - "C.posted_amount_cents == 55  # 50 + 5"
            - "C.tax_cents != 6    # the wrong per-line rounding (round(2.5)+round(2.5)=6) is forbidden"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: cleaning_task_submitted_branching
        grounds:
          - state_machines.CleaningTask.SUBMITTED_to_COMPLETED
          - state_machines.CleaningTask.SUBMITTED_to_CANCELLED
        distinguishing_aspect: |
          The CleaningTask state machine forks at SUBMITTED into two divergent
          terminal-or-rework branches: PASS leads to COMPLETED with InspectionRecord
          archival, FAIL leads to CANCELLED with a NEW rework CleaningTask whose
          parent_task_id points back. The two branches produce disjoint side-effect
          sets — this is a branching (fork-join-like) shape, not a linear pipeline.
        test_recipe:
          setup:
            - "Spin up R, Alice, T (CHECK_OUT) → submitted state (via accept/start/submit)"
          trigger:
            - "POST /cleaning-tasks/{T}/inspect {outcome:FAIL, checklist_items:[{item_code:BATHROOM,passed:false}]}"
          assert:
            - "T.status == 'CANCELLED'"
            - "A new CleaningTask T_rework exists with parent_task_id == T.id and status in {'ASSIGNED','PENDING'}"
            - "No rework task is created when outcome is PASS — fork branches are mutually exclusive"

      - name: minibar_consumption_investigated_branching
        grounds:
          - state_machines.MinibarConsumption.INVESTIGATED_to_RESOLVED
          - state_machines.MinibarConsumption.INVESTIGATED_to_WAIVED
        distinguishing_aspect: |
          The MinibarConsumption state machine forks at INVESTIGATED into two
          divergent terminal branches: keep_charge=true → RESOLVED (folio
          untouched), keep_charge=false → WAIVED (outbound payment-reverse with
          full reversal). Different entity than CleaningTask, distinct branching
          shape with disjoint side-effects.
        test_recipe:
          setup:
            - "Create Item_X with unit_price_cents=25; create Room R; POST /minibar-consumptions; POST /post; POST /dispute {note}; POST /investigate {note}"
          trigger:
            - "POST /minibar-consumptions/{C}/resolve {keep_charge:false}"
          assert:
            - "C.status == 'WAIVED'"
            - "AuditLog with action_type='MINIBAR_CONSUMPTION_WAIVE' appended for subject_id=C.id"
            - "When the same setup ends with {keep_charge:true} on a sibling consumption, that record reaches 'RESOLVED' instead and emits NO payment-reverse event"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: dispatch_isolate_room_triple_hop
        grounds:
          - state_machines.MaintenanceTicket.REPORTED_to_DISPATCHED
          - state_machines.Room.VACANT_DIRTY_to_OUT_OF_ORDER
          - state_machines.CleaningTask.PENDING_to_CANCELLED
          - entities.Housekeeper.fields.provisional_workload_minutes
          - entities.Room.fields.out_of_order_ticket_id
        distinguishing_aspect: |
          Depth-3 transitive cascade triggered by POST /maintenance-tickets/{id}/dispatch:
          (hop 1) dispatching the isolating ticket mutates MaintenanceTicket.status and
          Room.out_of_order_ticket_id; (hop 2) THAT Room mutation forces Room.status
          to OUT_OF_ORDER which itself triggers (hop 3) cancellation of all open
          CleaningTasks on the room, which itself triggers (hop 4) recomputation of
          Housekeeper.provisional_workload_minutes. Each hop is caused by the prior
          hop, not by the original dispatch call.
        test_recipe:
          setup:
            - "Create Room R (zone Z1); create Housekeeper Alice (Z1, ON_SHIFT); POST /cleaning-tasks {room_id:R, task_source:CHECK_OUT} → T (auto-dispatched, status=ASSIGNED, estimated_minutes=40); GET /housekeepers/{alice} → provisional_workload_minutes == 40"
            - "POST /maintenance-tickets {room_id:R, reporter_housekeeper_id:Alice.id, category:PLUMBING, severity:CRITICAL, description:'pipe burst'} → M (isolates_room=true)"
          trigger:
            - "POST /maintenance-tickets/{M}/dispatch {engineering_assignee:'eng-1'}"
          assert:
            - "M.status == 'DISPATCHED'  # hop 1"
            - "Room R.status == 'OUT_OF_ORDER' and R.out_of_order_ticket_id == M.id  # hop 2"
            - "T.status == 'CANCELLED'  # hop 3"
            - "Alice.provisional_workload_minutes == 0  # hop 4"

      - name: inspect_fail_rework_chain_depth_two
        grounds:
          - state_machines.CleaningTask.SUBMITTED_to_CANCELLED
          - entities.CleaningTask.fields.parent_task_id
          - state_machines.CleaningTask.PENDING_to_ASSIGNED
        distinguishing_aspect: |
          Depth-2 transitive cascade with a DIFFERENT triggering transition than the
          previous instance: a SUBMITTED→CANCELLED inspection failure (hop 1) causes
          creation of a brand-new rework CleaningTask (hop 2 — caused by the FAIL
          side-effect, not by the inspect call itself), which in turn (hop 3) is
          auto-dispatched to a housekeeper.
        test_recipe:
          setup:
            - "Create R, Alice ON_SHIFT in zone Z1, T (CHECK_OUT) auto-dispatched; accept/start/submit T → SUBMITTED"
          trigger:
            - "POST /cleaning-tasks/{T}/inspect {outcome:FAIL, checklist_items:[{item_code:BATHROOM,passed:false}]}"
          assert:
            - "T.status == 'CANCELLED'  # hop 1"
            - "Exactly one new CleaningTask T_rework exists with parent_task_id == T.id  # hop 2"
            - "T_rework.status in {'ASSIGNED','PENDING'} and T_rework.expedite_flag == true  # hop 3"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_vs_business_safety_dispatch_already_dispatched_on_isolated_room
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors.ERR_TICKET_NOT_REPORTED
          - errors.ERR_ROOM_ALREADY_ISOLATED
        distinguishing_aspect: |
          Pair: state (priority 5) vs business_safety (priority 7). A POST
          /maintenance-tickets/{id}/dispatch on a ticket that has ALREADY been
          dispatched, where additionally the room is held by a different isolating
          ticket, fails BOTH checks — state wins, returning ERR_TICKET_NOT_REPORTED,
          not ERR_ROOM_ALREADY_ISOLATED.
        test_recipe:
          setup:
            - "Create Room R; create maintenance ticket M1 with severity=CRITICAL on R; POST /dispatch on M1 → Room R isolated by M1"
            - "Create a second maintenance ticket M2 on the same Room R with severity=CRITICAL; POST /dispatch on M2 → fails with ERR_ROOM_ALREADY_ISOLATED, M2 remains REPORTED"
          trigger:
            - "POST /maintenance-tickets/{M1}/dispatch {engineering_assignee:'eng-1'}  # M1 is no longer REPORTED"
          assert:
            - "Response HTTP status == 409"
            - "Response data.error_id == 'ERR_TICKET_NOT_REPORTED'  # state precedes business_safety"
            - "Response data.error_id != 'ERR_ROOM_ALREADY_ISOLATED'"

      - name: state_vs_business_referential_accept_completed_task_by_nonassignee
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - errors.ERR_TASK_NOT_ASSIGNED
          - errors.ERR_NOT_TASK_ASSIGNEE
        distinguishing_aspect: |
          Pair: state (priority 5) vs business_referential (priority 8) — a
          DIFFERENT category pair than the previous instance. POST
          /cleaning-tasks/{id}/accept on a task that is no longer ASSIGNED, from a
          caller who is also not the assignee, fails both — state wins.
        test_recipe:
          setup:
            - "Create R, Alice ON_SHIFT, T (CHECK_OUT) auto-dispatched to Alice; accept T as Alice → status=ACCEPTED"
            - "Create Bob ON_SHIFT (also in zone Z1)"
          trigger:
            - "POST /cleaning-tasks/{T}/accept with X-User-ID = Bob.id, X-User-Role = Housekeeper"
          assert:
            - "Response HTTP status == 409"
            - "Response data.error_id == 'ERR_TASK_NOT_ASSIGNED'  # state precedes business_referential"
            - "Response data.error_id != 'ERR_NOT_TASK_ASSIGNEE'"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: linen_scheduled_replacement_at_exact_interval
        grounds:
          - calculations.linen_replacement_required
          - entities.LinenType.fields.scheduled_interval_days
          - errors.ERR_LINEN_REPLACEMENT_NOT_DUE
          - validations[priority=14]
        distinguishing_aspect: |
          Numeric threshold boundary on LinenType.scheduled_interval_days: the
          formula pins elapsed_days >= scheduled_interval_days, so AT exact 3 days
          replacement IS due (succeeds), and at 2 days it is NOT (fails with
          ERR_LINEN_REPLACEMENT_NOT_DUE). Endpoint: POST /linen-movements.
        test_recipe:
          setup:
            - "POST /linen-types → LT with replacement_policy=SCHEDULED, scheduled_interval_days=3, par_per_room=2, replacement_cost_cents=2000, code=BATH_TOWEL_LG"
            - "Create Room R; POST /linen-movements → prior_M (room_id=R, linen_type_id=LT, collected_quantity=2); POST /handover-laundry on prior_M; POST /_events/laundry-return {returned:2, loss:0, damage:0}"
            - "POST /_clock/advance {minutes: 2*1440}  # advance 2 days exactly"
          trigger:
            - "POST /linen-movements {room_id:R, linen_type_id:LT, collected_quantity:1}  # elapsed_days==2 < 3"
          assert:
            - "Response HTTP status == 409"
            - "Response data.error_id == 'ERR_LINEN_REPLACEMENT_NOT_DUE'"
            - "After POST /_clock/advance {minutes: 1440} (total 3 days), the same call now succeeds with 201  # boundary: elapsed_days >= scheduled_interval_days"

      - name: priority_tier_threshold_at_exact_urgent_boundary
        grounds:
          - calculations.task_priority_score
          - calculations.task_priority_score.constants.URGENT_THRESHOLD
          - entities.CleaningTask.fields.priority_tier
        distinguishing_aspect: |
          Numeric threshold boundary on a DIFFERENT metric (priority_score) reached
          through a DIFFERENT endpoint (POST /cleaning-tasks). priority_tier=URGENT
          requires priority_score >= 100 (inclusive). At exactly 100, the tier is
          URGENT; at 99, the tier is HIGH.
        test_recipe:
          setup:
            - "Create Room R_vip (vip_flag=true); housekeeper Alice ON_SHIFT in zone"
          trigger:
            - "POST /cleaning-tasks {room_id:R_vip, task_source:CHECK_OUT, expedite_flag:true, early_check_in_at:null}  # base 50 + vip 30 + expedite 20 = 100, no synergy (early_bonus=0)"
          assert:
            - "Response data.priority_score == 100"
            - "Response data.priority_tier == 'URGENT'  # >= 100"
            - "A sibling task created with vip_flag=false (base 50 + expedite 20 = 70) returns priority_tier == 'HIGH'  # 70 is the HIGH lower bound, NOT URGENT"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: cleaning_task_dispatch_requires_housekeeper_on_shift
        grounds:
          - state_machines.CleaningTask.PENDING_to_ASSIGNED
          - entities.Housekeeper.fields.shift_status
          - errors.ERR_NO_ELIGIBLE_HOUSEKEEPER
        distinguishing_aspect: |
          CleaningTask PENDING→ASSIGNED transition depends on Housekeeper.shift_status
          ON_SHIFT in the same zone. Entity pair: CleaningTask ↔ Housekeeper.
          With all housekeepers OFF_SHIFT, manual dispatch returns
          ERR_NO_ELIGIBLE_HOUSEKEEPER and the task remains PENDING.
        test_recipe:
          setup:
            - "Create Room R (zone Z1); create Housekeeper Alice (Z1, default OFF_SHIFT)"
            - "POST /cleaning-tasks {room_id:R, task_source:SCHEDULED}  # task created, status=PENDING (no auto-dispatch because Alice OFF_SHIFT)"
          trigger:
            - "POST /cleaning-tasks/{T}/dispatch"
          assert:
            - "Response HTTP status == 409"
            - "Response data.error_id == 'ERR_NO_ELIGIBLE_HOUSEKEEPER'"
            - "T.status == 'PENDING' and T.assigned_housekeeper_id == null"
            - "After POST /housekeepers/{Alice}/shift {shift_status:ON_SHIFT}, the same POST /dispatch succeeds → T.status=='ASSIGNED' and T.assigned_housekeeper_id==Alice.id"

      - name: maintenance_dispatch_requires_room_not_already_isolated
        grounds:
          - state_machines.MaintenanceTicket.REPORTED_to_DISPATCHED
          - entities.Room.fields.out_of_order_ticket_id
          - errors.ERR_ROOM_ALREADY_ISOLATED
        distinguishing_aspect: |
          MaintenanceTicket REPORTED→DISPATCHED depends on Room.out_of_order_ticket_id
          being null (when the dispatching ticket would itself isolate). DIFFERENT
          entity pair than the previous instance: MaintenanceTicket ↔ Room.
        test_recipe:
          setup:
            - "Create Room R; create M1 (severity=CRITICAL, isolates_room=true); POST /maintenance-tickets/{M1}/dispatch → R.status=OUT_OF_ORDER, R.out_of_order_ticket_id=M1.id"
            - "Create M2 on R (severity=CRITICAL)"
          trigger:
            - "POST /maintenance-tickets/{M2}/dispatch {engineering_assignee:'eng-2'}"
          assert:
            - "Response HTTP status == 409"
            - "Response data.error_id == 'ERR_ROOM_ALREADY_ISOLATED'"
            - "M2.status == 'REPORTED'"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: room_isolation_exclusive_capacity_one
        grounds:
          - entities.Room.fields.out_of_order_ticket_id
          - concurrency_rules[Room.out_of_order_ticket_id]
          - errors.ERR_ROOM_ALREADY_ISOLATED
          - state_machines.MaintenanceTicket.REPORTED_to_DISPATCHED
        distinguishing_aspect: |
          Interval semantics: aggregate-capacity-of-1 mutual exclusion on a single
          resource (Room). The room's "isolation interval" is open-ended from the
          moment a HIGH/CRITICAL ticket is dispatched until its verify; any other
          isolating ticket whose dispatch attempt overlaps even by one instant is
          rejected. No half-open temporal arithmetic — purely set-membership.
        test_recipe:
          setup:
            - "Create Room R; create M1 and M2 both on R both severity=CRITICAL"
            - "POST /maintenance-tickets/{M1}/dispatch  # R isolated by M1"
          trigger:
            - "POST /maintenance-tickets/{M2}/dispatch {engineering_assignee:'eng-2'}"
          assert:
            - "Response data.error_id == 'ERR_ROOM_ALREADY_ISOLATED'  # exclusive-capacity-one overlap rejected"
            - "After POST /_events/engineering-update {ticket_id:M1, new_status:REPAIR_COMPLETED}; POST /maintenance-tickets/{M1}/verify, the previously-failed POST /dispatch on M2 NOW succeeds because R.out_of_order_ticket_id was cleared"

      - name: minibar_dispute_window_half_open_temporal
        grounds:
          - validations[priority=13]
          - errors.ERR_DISPUTE_WINDOW_EXPIRED
          - state_machines.MinibarConsumption.POSTED_to_DISPUTED
        distinguishing_aspect: |
          Interval semantics: a HALF-OPEN temporal window [posted_at, posted_at +
          72h). DIFFERENT resource entity (MinibarConsumption) and DIFFERENT
          interval geometry (half-open temporal window vs the room's
          aggregate-capacity-of-1 mutex). A dispute at exactly t=72h is REJECTED;
          a dispute at t=72h-1min succeeds.
        test_recipe:
          setup:
            - "Create Room R, Item_X (unit_price_cents=25); create consumption C; POST /post  # posted_at = clock_now"
            - "POST /_clock/advance {minutes: 72*60}  # advance exactly 72 hours"
          trigger:
            - "POST /minibar-consumptions/{C}/dispute {dispute_note:'guest claims not consumed'}"
          assert:
            - "Response HTTP status == 409"
            - "Response data.error_id == 'ERR_DISPUTE_WINDOW_EXPIRED'  # half-open: 72h boundary is OUT"
            - "When the clock advance is 72*60 - 1 minutes instead, the same call succeeds (C.status='DISPUTED')"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: minibar_waiver_net_zero_folio_invariant
        grounds:
          - state_machines.MinibarConsumption.PENDING_to_POSTED
          - state_machines.MinibarConsumption.INVESTIGATED_to_WAIVED
          - entities.MinibarConsumption.fields.posted_amount_cents
          - calculations.minibar_charge_total
        distinguishing_aspect: |
          Conserved quantity: NET MONETARY AMOUNT charged to the guest folio for a
          single MinibarConsumption. The forward action /post adds
          posted_amount_cents; its compensating action /resolve {keep_charge:false}
          (WAIVED) must reverse the EXACT same amount via /_events/payment-reverse,
          so the folio net for that consumption is precisely 0.
        test_recipe:
          setup:
            - "POST /minibar-items → Item_X (unit_price_cents=25, par_level=10, replenishment_threshold=2); POST /minibar-items → Item_Y (unit_price_cents=25, par_level=10, replenishment_threshold=2)"
            - "POST /rooms → R; POST /minibar-consumptions → C with line_items=[{minibar_item_id:Item_X.id, quantity:1},{minibar_item_id:Item_Y.id, quantity:1}], source_type=GUEST_SELF_REPORT"
            - "POST /post → C.posted_amount_cents = 55 (50 gross + 5 tax)"
            - "POST /dispute; POST /investigate"
          trigger:
            - "POST /minibar-consumptions/{C}/resolve {keep_charge:false}"
          assert:
            - "C.status == 'WAIVED'"
            - "AuditLog with action_type='MINIBAR_CONSUMPTION_POST' for subject_id=C.id has detail.amount_cents == 55"
            - "AuditLog with action_type='MINIBAR_CONSUMPTION_WAIVE' for subject_id=C.id has detail.amount_cents == 55  # equal-and-opposite reversal"
            - "Sum over AuditLog entries for subject_id=C.id of (POST entries +amount; WAIVE entries -amount) == 0  # conserved-quantity invariant"

      - name: linen_unit_conservation_invariant
        grounds:
          - entities.LinenMovement.fields.collected_quantity
          - entities.LinenMovement.fields.sent_to_laundry_quantity
          - entities.LinenMovement.fields.returned_quantity
          - entities.LinenMovement.fields.loss_quantity
          - entities.LinenMovement.fields.damage_quantity
          - validations[priority=15]
          - errors.ERR_LAUNDRY_RETURN_QUANTITY_MISMATCH
        distinguishing_aspect: |
          Conserved quantity: PHYSICAL UNIT COUNT of linen items. Different from the
          monetary invariant in the previous instance. The forward action
          /handover-laundry sets sent_to_laundry_quantity = collected_quantity; the
          compensating /_events/laundry-return MUST report returned + loss + damage
          equal to sent_to_laundry_quantity, or the entire return is rejected
          (ERR_LAUNDRY_RETURN_QUANTITY_MISMATCH). The conserved formula is unit
          counts, not money.
        test_recipe:
          setup:
            - "Create LinenType LT (par_per_room=4, replacement_cost_cents=2000); create Room R"
            - "POST /linen-movements {room_id:R, linen_type_id:LT, collected_quantity:10} → M, status=COLLECTED"
            - "POST /linen-movements/{M}/handover-laundry → M.sent_to_laundry_quantity == 10"
          trigger:
            - "POST /_events/laundry-return {movement_id:M, returned_quantity:7, loss_quantity:2, damage_quantity:1}"
          assert:
            - "Response HTTP status == 200  # 7 + 2 + 1 == 10 matches sent_to_laundry_quantity"
            - "M.returned_quantity == 7 and M.loss_quantity == 2 and M.damage_quantity == 1"
            - "M.collected_quantity == M.sent_to_laundry_quantity == (M.returned_quantity + M.loss_quantity + M.damage_quantity) == 10  # conserved-unit invariant"
            - "A sibling movement with /_events/laundry-return {returned:7, loss:2, damage:0} returns 422 with error_id == 'ERR_LAUNDRY_RETURN_QUANTITY_MISMATCH' because 7+2+0 != 10"
