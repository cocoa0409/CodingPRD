        test_recipe:
          setup: ["empty"]
          setup_api_calls: []
          trigger:
            - call: "GET /regulatory-exams/agencies"
              as: ""
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_UNAUTHENTICATED"

      - name: invalid_date_range_on_exam_create
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_INVALID_DATE_RANGE]"]
        distinguishing_aspect: "scheduled_end_date <= scheduled_start_date -> ERR_INVALID_DATE_RANGE."
        test_recipe:
          setup: ["one agency"]
          setup_api_calls:
