        distinguishing_aspect: "pay_date 2026-08-31 (Monday) with cutoff_lead_working_days 3 resolves to 2026-08-26T17:00:00.000Z: the pay_date itself is never counted and the 2026-08-29/30 weekend is skipped, so a naive minus-three-calendar-days answer of 2026-08-28 is wrong."
