              as: MSHAAdmin
              captures: { err_pub: $.data.error_id }
            - call: "POST /msha/inspections/${insp1}/complete"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
            - call: "POST /msha/accidents/${acc1}/publish-report"
              payload: { root_cause: "brake fade on 8 percent grade", report_text: "public report body" }
              as: MSHAAdmin
            - call: "GET /msha/accidents/${acc1}/public-report"
