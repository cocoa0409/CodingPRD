        claim_type: idempotency
        grounds: ["endpoints[POST /rescue-ops/client-accounts/{accountId}/statements/generate]", entities.StandbyAssignment.fields.billed]
        distinguishing_aspect: "Regenerating an OPEN statement for the identical period returns the same statement id and does not duplicate lines: swept items are marked billed, so the second sweep appends nothing."
