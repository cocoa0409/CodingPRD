  - rule_id: boundary_precision_check
    instances:
      - name: moisture_exactly_eight_pct_conditions
        grounds:
          - calculations.seasoning_and_drying_gates
          - state_machines.WoodBatch.DRYING_to_CONDITIONED
        distinguishing_aspect: |
          Moisture metric on the moisture-readings endpoint: exactly 8.0 passes the
          <= MOISTURE_READY_PCT gate at exactly day 240; 8.01 on a twin batch at the
          same clock position stays DRYING.
        test_recipe:
          setup:
            - "Two MAPLE batches created at the default clock 2026-09-01; clock advanced exactly 240 days to 2027-04-29"
          setup_api_calls:
            - { call: "POST /piano-works/wood-batches", payload: { species: MAPLE, moisture_content_pct: 12.0 }, as: WorkshopManager, captures: { wb1: $.data.id } }
            - { call: "POST /piano-works/wood-batches", payload: { species: MAPLE, moisture_content_pct: 11.0 }, as: WorkshopManager, captures: { wb2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-04-29T00:00:00Z" }, as: WorkshopManager }
          trigger:
            - { call: "POST /piano-works/wood-batches/${wb1}/moisture-readings", payload: { moisture_content_pct: 8.0 }, as: WorkshopManager, captures: { s1: $.data.status } }
            - { call: "POST /piano-works/wood-batches/${wb2}/moisture-readings", payload: { moisture_content_pct: 8.01 }, as: WorkshopManager, captures: { s2: $.data.status } }
          assert:
            - "WoodBatch.${wb1}.status == CONDITIONED (captured ${s1}) with conditioned_at == 2027-04-29T00:00:00Z"
            - "WoodBatch.${wb2}.status == DRYING (captured ${s2}); moisture_content_pct == 8.01 recorded"

      - name: seasoning_exactly_365_days_allows_regulation
        grounds:
          - calculations.seasoning_and_drying_gates
          - state_machines.BuildOrder.SEASONING_to_ACTION_REGULATION
        distinguishing_aspect: |
          Seasoning-days metric on the advance endpoint (different metric and endpoint
          than moisture): at exactly 365 elapsed days the >= SEASONING_MIN_DAYS gate
          passes; the 364-day failure side is covered in the corner design.
        test_recipe:
          setup:
            - "Build entered SEASONING at 2027-04-29T00:00:00Z (version 3); clock set to 2028-04-28T00:00:00Z = exactly 365 days later"
          setup_api_calls:
            - { call: "POST /piano-works/wood-batches", payload: { species: MAPLE, moisture_content_pct: 12.5 }, as: WorkshopManager, captures: { wb1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-04-29T00:00:00Z" }, as: WorkshopManager }
            - { call: "POST /piano-works/wood-batches/${wb1}/moisture-readings", payload: { moisture_content_pct: 8.0 }, as: WorkshopManager }
            - { call: "POST /piano-works/craftsmen", payload: { name: "Rim Master", specialty: RIM_BENDING }, as: WorkshopManager, captures: { cr_rim: $.data.id } }
            - { call: "POST /piano-works/craftsmen", payload: { name: "Sea Master", specialty: SEASONING_CHECK }, as: WorkshopManager, captures: { cr_sea: $.data.id } }
            - { call: "POST /piano-works/build-orders", payload: { model: MODEL_B, wood_batch_id: "${wb1}" }, as: WorkshopManager, captures: { b_id: $.data.id, bv: $.data.version } }
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: RIM_BENT, hours_applied: 100, expected_build_order_version: "${bv}" }, as: MasterCraftsman, as_user_id: "${cr_rim}", captures: { bv: $.data.version } }
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: SEASONING, hours_applied: 30, expected_build_order_version: "${bv}" }, as: MasterCraftsman, as_user_id: "${cr_sea}", captures: { bv3: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-04-28T00:00:00Z" }, as: WorkshopManager }
          trigger:
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: ACTION_REGULATION, hours_applied: 40, expected_build_order_version: "${bv3}" }, as: MasterCraftsman, as_user_id: "${cr_sea}", captures: { st: $.data.status } }
          assert:
            - "advance succeeds: captured status == ACTION_REGULATION"
            - "BuildOrder.${b_id}.version == 4"
            - "seasoning_started_at remains 2027-04-29T00:00:00Z"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: build_create_requires_conditioned_batch
        grounds:
          - validations[priority=6]
          - state_machines.WoodBatch.CONDITIONED_to_ALLOCATED
        distinguishing_aspect: |
          Pair BuildOrder x WoodBatch: create is gated on the batch's CONDITIONED
          state — a DRYING batch yields ERR_WOOD_NOT_CONDITIONED, and the same call
          succeeds after the batch conditions.
        test_recipe:
          setup:
            - "Batch wb1 DRYING at default clock; later CONDITIONED at day 240"
          setup_api_calls:
            - { call: "POST /piano-works/wood-batches", payload: { species: BIRCH, moisture_content_pct: 12.9 }, as: WorkshopManager, captures: { wb1: $.data.id } }
          trigger:
            - { call: "POST /piano-works/build-orders", payload: { model: MODEL_O, wood_batch_id: "${wb1}" }, as: WorkshopManager, captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-04-29T00:00:00Z" }, as: WorkshopManager }
            - { call: "POST /piano-works/wood-batches/${wb1}/moisture-readings", payload: { moisture_content_pct: 8.0 }, as: WorkshopManager }
            - { call: "POST /piano-works/build-orders", payload: { model: MODEL_O, wood_batch_id: "${wb1}" }, as: WorkshopManager, captures: { b_id: $.data.id } }
          assert:
            - "first create captured error_id == ERR_WOOD_NOT_CONDITIONED"
            - "second create succeeds: BuildOrder status == COMMISSIONED, wood_batch_id == ${wb1}"
            - "WoodBatch.${wb1}.status == ALLOCATED after the second create"

      - name: loan_create_requires_active_artist
        grounds:
          - validations[priority=4]
          - state_machines.Artist.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Pair ConcertLoan x Artist (different pair than BuildOrder x WoodBatch): a
          SUSPENDED artist's loan create is rejected with ERR_ARTIST_NOT_ACTIVE, and no
          loan row is persisted.
