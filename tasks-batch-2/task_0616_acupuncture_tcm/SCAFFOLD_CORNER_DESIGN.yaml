  - section: consistency_model
    instances:
      - name: immediate_visibility_of_booking_in_get
        claim_type: immediate
        grounds:
          - endpoints
          - entities.Appointment.fields.clinical_status
        distinguishing_aspect: "A booked appointment is immediately visible via GET /patients/{id}/appointments in the same logical session (immediate consistency)."
        test_recipe:
          setup: ["Patient with ACTIVE plan; one booking."]
          setup_api_calls:
            - call: "POST /practitioners"
              payload: { full_name: "Dr Z1", license_number: "LIC-Z1" }
              as: ClinicAdmin
              captures: { prac: $.data.id }
            - call: "POST /rooms"
              payload: { room_name: "Room Z1" }
              as: ClinicAdmin
              captures: { room: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Z1 Pat", date_of_birth: "1990-01-01" }
              as: ClinicAdmin
              captures: { pid: $.data.id }
            - call: "POST /intakes"
              payload: { patient_id: "${pid}", chief_complaint: "x", tongue_finding: "RED", tongue_coating: "THIN_WHITE", pulse_finding: "WIRY", tcm_pattern: "QI_STAGNATION" }
              as: Practitioner
              as_user_id: "${prac}"
              captures: { ik: $.data.id }
            - call: "POST /intakes/${ik}/finalize"
              payload: {}
              as: Practitioner
              as_user_id: "${prac}"
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pid}", practitioner_id: "${prac}", intake_id: "${ik}", acupoints: ["LI4"], planned_sessions: 3 }
              as: Practitioner
              as_user_id: "${prac}"
              captures: { pl: $.data.id, plv: $.data.version }
            - call: "POST /appointments"
              payload: { patient_id: "${pid}", treatment_plan_id: "${pl}", practitioner_id: "${prac}", room_id: "${room}", charge_source: "PER_VISIT", scheduled_start: "2026-06-29T10:00:00Z", scheduled_end: "2026-06-29T10:45:00Z", base_fee_cents: 12000, expected_treatment_plan_version: "${plv}" }
              as: ClinicAdmin
              captures: { ap: $.data.id }
          trigger:
            - call: "GET /appointments"
              payload: { treatment_plan_id: "${pl}" }
              as: ClinicAdmin
          assert:
            - "response_type == array; total_count == 1; data[0].id == ${ap}; data[0].clinical_status == SCHEDULED"
