            - "after the refused attempt DepositProgram.${prog_id}.state == PENDING_CLASSIFICATION and version == ${prog_v} — no version was consumed"
            - "PrimaryPurposeException.${exc_id}.filing_type == NOTICE and test_outcome == QUALIFIED and business_line_deposit_ratio_bps == 1000"
            - "after SUBMIT, PrimaryPurposeException.${exc_id}.status == ACKNOWLEDGED and reporting_due_date == \"2026-10-30\""
            - "attempt 2 returns HTTP 201 and DepositClassification.${cls_id}.determined_class == LISTING_SERVICE_NON_BROKERED"
            - "DepositClassification.${cls_id}.deposit_broker_prong == NOT_APPLICABLE and call_report_line == RC_E_M2_LISTING"
            - "DepositProgram.${prog_id}.state == CLASSIFIED and governing_classification_id == ${cls_id}"
            - "PrimaryPurposeException.${exc_id}.reliant_program_count == 1"

      - name: capital_category_change_gated_on_examiner_review_lock
        grounds:
          - validations[priority=34]
          - state_machines.CallReportFiling
          - endpoints[PATCH /institutions/{id}/capital-category]
        distinguishing_aspect: |
          Entity pair 3 - Institution depends on CallReportFiling, and the dependency runs
          UP the reference rather than down it: the child's UNDER_EXAMINER_REVIEW state
          freezes edits to the parent it points at, so the supervisory PATCH is refused
          while the exam is open and permitted once the examiner ACCEPTs.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One WELL_CAPITALIZED Institution with no programs or placements, so the computed brokered figure is 0."
            - "One 2026Q2 CallReportFiling reporting 0 brokered, driven all the way to UNDER_EXAMINER_REVIEW (PREPARE by op_desk, ATTEST by op_comp, FILE by op_desk, OPEN_EXAM_REVIEW by op_exam)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /institutions"
              payload: { legal_name: "Exam Lock Bank NA", cert_id: "CERT-2834-18", capital_category: "WELL_CAPITALIZED", core_deposits_cents: 40000000000, total_liabilities_cents: 50000000000, tier1_capital_cents: 5000000000, liquidity_buffer_cents: 1000000000 }
              as: SystemAdmin
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /institutions/${inst_id}/call-report-filings"
              payload: { report_period: "2026Q2", rc_e_brokered_reported_cents: 0, rc_o_listing_reported_cents: 0, rc_e_core_reported_cents: 40000000000 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { fil_id: $.data.id }
            - call: "POST /call-report-filings/${fil_id}/workflow-actions"
              payload: { action: "PREPARE" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
            - call: "POST /call-report-filings/${fil_id}/workflow-actions"
              payload: { action: "ATTEST" }
              as: ComplianceReviewer
              as_user_id: "op_comp"
            - call: "POST /call-report-filings/${fil_id}/workflow-actions"
              payload: { action: "FILE" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
            - call: "POST /call-report-filings/${fil_id}/workflow-actions"
              payload: { action: "OPEN_EXAM_REVIEW" }
              as: Examiner
              as_user_id: "op_exam"
          trigger:
            - call: "PATCH /institutions/${inst_id}/capital-category"
              payload: { capital_category: "ADEQUATELY_CAPITALIZED", expected_institution_version: "${inst_v}" }
              as: Examiner
              as_user_id: "op_exam"
            - call: "POST /institutions/${inst_id}/balance-adjustments"
              payload: { liquidity_buffer_cents: 2000000000 }
              as: TreasuryController
              as_user_id: "op_alm"
            - call: "POST /call-report-filings/${fil_id}/workflow-actions"
              payload: { action: "ACCEPT", examiner_finding_note: "no exceptions noted" }
              as: Examiner
              as_user_id: "op_exam"
            - call: "PATCH /institutions/${inst_id}/capital-category"
              payload: { capital_category: "ADEQUATELY_CAPITALIZED", expected_institution_version: "${inst_v}" }
              as: Examiner
              as_user_id: "op_exam"
          assert:
            - "CallReportFiling.${fil_id}.accuracy_status == ACCURATE and variance_cents == 0 and variance_bps == 0"
            - "after PREPARE, CallReportFiling.${fil_id}.computed_brokered_cents == 0 and computed_core_cents == 40000000000"
            - "the first PATCH returns HTTP 409 with error_id == ERR_EXAMINER_REVIEW_LOCK while status == UNDER_EXAMINER_REVIEW"
            - "the balance-adjustments call returns HTTP 409 with error_id == ERR_EXAMINER_REVIEW_LOCK — the same lock covers both write paths"
            - "Institution.${inst_id}.capital_category is still WELL_CAPITALIZED and version is still ${inst_v} and liquidity_buffer_cents is still 1000000000 after both refusals"
            - "after ACCEPT, CallReportFiling.${fil_id}.status == ACCEPTED and examiner_finding_note == \"no exceptions noted\" and amendment_round == 0"
            - "the second PATCH returns HTTP 200 — the stale-looking ${inst_v} is still current precisely because the refusals wrote nothing"
            - "Institution.${inst_id}.capital_category == ADEQUATELY_CAPITALIZED and rate_cap_regime == CAPPED after the successful PATCH"

  - rule_id: resource_temporal_overlap
    instances:
      - name: contingency_plan_closed_window_exclusive_occupancy
        grounds:
          - validations[priority=37]
          - state_machines.LiquidityContingencyPlan
          - entities.LiquidityContingencyPlan.fields.effective_from
        distinguishing_aspect: |
          Resource entity 1 - LiquidityContingencyPlan coverage windows, with EXCLUSIVE
          OCCUPANCY semantics over a CLOSED calendar interval: at most one live plan may
          cover any given day, touching endpoints (new.effective_from ==
          existing.effective_to) DO collide, a next-day start does not, and the occupancy
          set is filtered by status so a DRAFT plan occupies nothing at all.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One Institution and one DRAFT LiquidityContingencyPlan covering the closed interval 2026-08-01 .. 2026-09-30."
            - "Stage triggers 3000 < 4000 < 5000 satisfy the threshold ordering rule."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /institutions"
              payload: { legal_name: "Window Bank NA", cert_id: "CERT-2834-19", capital_category: "WELL_CAPITALIZED", core_deposits_cents: 40000000000, total_liabilities_cents: 50000000000, tier1_capital_cents: 5000000000, liquidity_buffer_cents: 1000000000 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /institutions/${inst_id}/contingency-plans"
              payload: { plan_version_label: "CFP-2026-A", effective_from: "2026-08-01", effective_to: "2026-09-30", stage_1_trigger_bps: 3000, stage_2_trigger_bps: 4000, stage_3_trigger_bps: 5000, stage_1_action_code: "MONITOR_DAILY", stage_2_action_code: "DRAW_FHLB_LINE", stage_3_action_code: "SELL_LIQUID_SECURITIES" }
              as: TreasuryController
              as_user_id: "op_alm"
              captures: { plan_a_id: $.data.id }
          trigger:
            - call: "POST /institutions/${inst_id}/contingency-plans"
              payload: { plan_version_label: "CFP-2026-B", effective_from: "2026-09-01", effective_to: "2026-10-31", stage_1_trigger_bps: 3000, stage_2_trigger_bps: 4000, stage_3_trigger_bps: 5000, stage_1_action_code: "MONITOR_DAILY", stage_2_action_code: "DRAW_FHLB_LINE", stage_3_action_code: "SELL_LIQUID_SECURITIES" }
              as: TreasuryController
              as_user_id: "op_alm"
              captures: { plan_b_id: $.data.id }
            - call: "POST /contingency-plans/${plan_b_id}/lifecycle-actions"
              payload: { action: "SUBMIT_FOR_REVIEW" }
              as: TreasuryController
              as_user_id: "op_alm"
            - call: "POST /institutions/${inst_id}/contingency-plans"
              payload: { plan_version_label: "CFP-2026-C", effective_from: "2026-10-31", effective_to: "2026-12-31", stage_1_trigger_bps: 3000, stage_2_trigger_bps: 4000, stage_3_trigger_bps: 5000, stage_1_action_code: "MONITOR_DAILY", stage_2_action_code: "DRAW_FHLB_LINE", stage_3_action_code: "SELL_LIQUID_SECURITIES" }
              as: TreasuryController
              as_user_id: "op_alm"
            - call: "POST /institutions/${inst_id}/contingency-plans"
              payload: { plan_version_label: "CFP-2026-D", effective_from: "2026-11-01", effective_to: "2026-12-31", stage_1_trigger_bps: 3000, stage_2_trigger_bps: 4000, stage_3_trigger_bps: 5000, stage_1_action_code: "MONITOR_DAILY", stage_2_action_code: "DRAW_FHLB_LINE", stage_3_action_code: "SELL_LIQUID_SECURITIES" }
              as: TreasuryController
              as_user_id: "op_alm"
              captures: { plan_d_id: $.data.id }
          assert:
            - "CFP-2026-B returns HTTP 201 even though 2026-09-01 .. 2026-09-30 overlaps plan A, because plan A is still DRAFT and DRAFT is outside the occupancy status set"
            - "LiquidityContingencyPlan.${plan_a_id}.status == DRAFT and LiquidityContingencyPlan.${plan_b_id}.status == UNDER_REVIEW after SUBMIT_FOR_REVIEW"
            - "CFP-2026-C returns HTTP 409 with error_id == ERR_PLAN_WINDOW_OVERLAP: its effective_from 2026-10-31 touches plan B's effective_to 2026-10-31 and closed intervals that share one endpoint intersect"
            - "CFP-2026-D returns HTTP 201: 2026-11-01 is the day after plan B's effective_to, so the closed intervals are disjoint"
            - "LiquidityContingencyPlan.${plan_d_id}.status == DRAFT and activation_stage == NONE and required_buffer_cents == 0 and buffer_shortfall_cents == 0"
            - "GET /institutions/${inst_id}/contingency-plans returns total_count == 3 (A, B, D) — the refused C persisted nothing"

      - name: maturity_ladder_buffered_window_aggregate_capacity
        grounds:
          - calculations.maturity_window_exposure
          - validations[priority=48]
          - entities.Institution.fields.total_deposits_cents
        distinguishing_aspect: |
          Resource entity 2 - DepositPlacement maturity dates, with the OPPOSITE interval
          semantics: not exclusive occupancy but a BUFFERED AGGREGATE CAPACITY over a
          +/-15 day window centred on the candidate, where many neighbours may legally
          share the window until their summed principal reaches 35% of total deposits.
          Overlap is a matter of degree here, not of presence, and a placement moves out
          of the window by one calendar day rather than by changing status.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Institution WELL_CAPITALIZED with core_deposits_cents 40,000,000,000."
            - "One OPEN_FOR_PLACEMENT brokered program with one ACTIVE placement of 12,000,000,000 cents issued 2026-08-01 for 60 days, maturing 2026-09-30."
            - "total_deposits_cents is therefore 52,000,000,000 and the ladder cap is floor(52,000,000,000 * 3500 / 10000) == 18,200,000,000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /institutions"
              payload: { legal_name: "Ladder Bank NA", cert_id: "CERT-2834-20", capital_category: "WELL_CAPITALIZED", core_deposits_cents: 40000000000, total_liabilities_cents: 80000000000, tier1_capital_cents: 8000000000, liquidity_buffer_cents: 1000000000 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /brokers"
              payload: { legal_name: "Ladder Deposit Brokers LLC", broker_type: "DEPOSIT_BROKER", has_placement_discretion: true, fee_structure: "FLAT_FEE", fee_flat_cents: 25000 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { brk_id: $.data.id }
            - call: "POST /brokers/${brk_id}/agreements"
              payload: { agreement_ref: "AGR-2834-20", fee_structure: "FLAT_FEE", fee_flat_cents: 25000, termination_notice_days: 30, effective_date: "2026-07-01", aml_program_score: 80, financial_condition_score: 75, insurance_coverage_score: 70, recordkeeping_score: 65 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { agr_id: $.data.id }
            - call: "POST /broker-agreements/${agr_id}/diligence-actions"
              payload: { action: "START_DILIGENCE" }
              as: ComplianceReviewer
              as_user_id: "op_comp"
            - call: "POST /broker-agreements/${agr_id}/diligence-actions"
              payload: { action: "APPROVE" }
              as: ComplianceReviewer
              as_user_id: "op_comp"
            - call: "POST /deposit-programs"
              payload: { institution_id: "${inst_id}", broker_id: "${brk_id}", agreement_id: "${agr_id}", program_name: "Ladder Brokered CD", funding_channel_claim: "BROKERED", product_type: "TIME_DEPOSIT", tenor_days: 60, offered_rate_bps: 470, early_withdrawal_penalty_days: 30, titling_convention: "DIRECT_TITLED" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { prog_id: $.data.id, prog_v: $.data.version }
            - call: "POST /deposit-classifications"
              payload: { program_id: "${prog_id}", expected_program_version: "${prog_v}", rationale_code: "PLACEMENT_DISCRETION_PRONG" }
              as: ComplianceReviewer
              as_user_id: "op_comp"
            - call: "POST /deposit-programs/${prog_id}/state-actions"
              payload: { action: "ATTEST_CLASSIFICATION" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
            - call: "POST /deposit-placements"
              payload: { program_id: "${prog_id}", principal_cents: 12000000000, rate_bps: 470, issue_date: "2026-08-01", tenor_days: 60 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { pl_anchor_id: $.data.id }
            - call: "POST /deposit-placements/${pl_anchor_id}/funding-actions"
              payload: { action: "ACTIVATE" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
          trigger:
            - call: "POST /deposit-placements"
              payload: { program_id: "${prog_id}", principal_cents: 6200000000, rate_bps: 470, issue_date: "2026-08-01", tenor_days: 75 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
            - call: "POST /deposit-placements"
              payload: { program_id: "${prog_id}", principal_cents: 6200000000, rate_bps: 470, issue_date: "2026-08-01", tenor_days: 76 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { pl_outside_id: $.data.id }
          assert:
            - "Institution.${inst_id}.brokered_deposits_cents == 12000000000 and total_deposits_cents == 52000000000 after the anchor ACTIVATE"
            - "the tenor_days 75 candidate matures 2026-10-15, exactly 15 days after the anchor's 2026-09-30, so the anchor is inside the closed window: exposure 6,200,000,000 + 12,000,000,000 == 18,200,000,000 == cap, and the call returns HTTP 422 with error_id == ERR_MATURITY_WINDOW_CONCENTRATION"
            - "the tenor_days 76 candidate matures 2026-10-16, 16 days after the anchor, so the window [2026-10-01, 2026-10-31] excludes the anchor: exposure is 6,200,000,000 alone and the call returns HTTP 201"
            - "DepositPlacement.${pl_outside_id}.maturity_date == \"2026-10-16\" and tenor_bucket == DAYS_31_90 and funding_status == PENDING"
            - "Institution.${inst_id}.brokered_deposits_cents is still 12000000000 — a PENDING placement contributes to the ladder window but not to the balance buckets"
            - "GET /deposit-placements?program_id=${prog_id} returns total_count == 2 (the ACTIVE anchor and the accepted PENDING candidate)"

  - rule_id: compensating_invariant
    instances:
      - name: activate_then_early_withdraw_conserves_brokered_principal
        grounds:
          - calculations.wholesale_balance_rollup
          - state_machines.DepositPlacement.dimension=funding_status
          - calculations.early_withdrawal_penalty
          - calculations.concentration_posture
        distinguishing_aspect: |
          Conserved quantity 1 - Institution.brokered_deposits_cents (and the derived
          DepositProgram.outstanding_principal_cents and concentration_posture that hang
          off it). ACTIVATE is the forward leg and EARLY_WITHDRAW the compensating leg;
          after the pair, every balance and every posture is back to its exact
          pre-ACTIVATE value with no rounding drift, and because the program forbids
          principal erosion the cash settlement returns exactly the principal too.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Institution WELL_CAPITALIZED, core_deposits_cents 40,000,000,000, total_liabilities_cents 50,000,000,000."
            - "One ACTIVE BROKERED_TO_TOTAL_DEPOSITS ConcentrationLimit with warning 400 bps and breach 2000 bps."
            - "One OPEN_FOR_PLACEMENT brokered program with early_withdrawal_penalty_days 30 and principal_erosion_allowed false, plus one PENDING placement of 2,000,000,000 cents at 470 bps issued 2026-08-01 for 60 days."
