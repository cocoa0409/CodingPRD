            - {call: "GET /chick-batches/${cb1}", payload: {}, as: HatcheryManager, captures: {cbv2: "$.data.version"}}
            - {call: "POST /chick-batches/${cb1}/allocations", payload: {expected_chick_batch_version: "${cbv2}"}, as: HatcheryManager, captures: {a3: "$.data[0].id"}}
          assert:
            - "Before allocation: ChickBatch.${cb1}.saleable_count == 9262, unassigned_chicks == 9262, box_count == 93; conservation 9262 == 9262 + 0"
