# =============================================================================
# PRD Benchmark Seed Tables — Chain Restaurant Menu Labeling & Allergen
# Disclosure Compliance (FDA menu labeling program)
# §1.0–§1.7 live in this file. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Chain Restaurant Menu Labeling & Allergen Disclosure Compliance (FDA menu
  labeling program): covered-establishment determination by unit count and
  standard menu items, calorie declarations on menus and menu boards with
  succinct statements, additional written nutrition information availability
  on request, variable menu items, combination meals and topping calculation
  methodologies, temporary and test items exclusion rules, recipe change
  triggering nutrition recalculation and menu reprint, allergen matrix
  publication and cross-contact statements, state and local labeling variance
  and enforcement responses.

domain_name: chain-menu-labeling

# Flat top-level collections; every resource path is rooted at "/" and every
# parent/child link is expressed by an explicit foreign key, never by URL
# nesting of two ids.
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # MenuBoardListing is a junction between MenuBoard and MenuItem (many-to-many);
  # Recipe references itself through supersedes_recipe_id (version chain);
  # VarianceRequest and EnforcementAction join a Brand/Establishment aggregate to
  # a Jurisdiction aggregate. No id is nested inside another id in any path.

  state_machine_shape: cyclic
  # Recipe: APPROVED -> SUPERSEDED -> APPROVED (certification withdrawal restores
  # the prior version). EnforcementAction: RESPONSE_SUBMITTED -> INFO_REQUESTED ->
  # RESPONSE_SUBMITTED (information rounds) and PENALTY_ASSESSED ->
  # RESPONSE_SUBMITTED (penalty rescission). MenuBoard carries two independent
  # state dimensions on one row (publication_status x calorie_compliance_status).

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The NutritionAnalyst who submits a recipe for analysis may not be the analyst
  # who certifies it; brand-side, establishment-side and regulator-side roles own
  # disjoint write surfaces (peer roles) on top of that separation.

  consistency_model: immediate

  difficulty_level: expert
  # 12 entities / 50 endpoints / 50 error codes / 8 calculations (3 carrying
  # variants) / 11 state machines across 10 entities, several cyclic and one
  # entity carrying two parallel state dimensions.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Brand
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered legal name of the chain operator.
        constraints: 1-120 chars, non-blank
      - name: doing_business_as
        type: string
        source: input
        description: Public-facing chain name used to test the "same name" limb of covered-establishment determination.
        constraints: 1-120 chars, non-blank
      - name: coverage_status
        type: enum
        source: computed
        description: Authoritative federal covered-establishment status, recomputed by calculations.covered_establishment_determination under the OPERATING_ONLY basis.
        default: NOT_COVERED
        constraints: "one of {COVERED, NOT_COVERED}"
      - name: coverage_reason
        type: enum
        source: computed
        description: Why the brand holds its current coverage_status.
        default: NO_STANDARD_MENU_ITEMS
        constraints: "one of {COVERED_BY_UNIT_COUNT, BELOW_UNIT_THRESHOLD, NO_STANDARD_MENU_ITEMS}"
      - name: counted_unit_count
        type: integer
        source: computed
        description: Number of Establishment rows of this brand with unit_status == OPERATING and operates_under_brand_name == true.
        default: 0
      - name: standard_item_count
        type: integer
        source: computed
        description: Number of MenuItem rows of this brand with labeling_exempt == false.
        default: 0
      - name: compliance_posture
        type: enum
        source: computed
        description: Derived posture that gates child write operations; recomputed after every mutation that touches coverage_status, open_reprint_obligation_count, overdue_board_count or open_enforcement_escalated_count.
        default: EXEMPT
        constraints: "one of {EXEMPT, COMPLIANT, RESTRICTED, FROZEN}"
      - name: open_reprint_obligation_count
        type: integer
        source: computed
        description: Count of this brand's MenuBoard rows with publication_status == PUBLISHED and calorie_compliance_status IN {REPRINT_REQUIRED, OVERDUE}. Conserved quantity of the reprint-obligation invariant.
        default: 0
      - name: overdue_board_count
        type: integer
        source: computed
        description: Count of this brand's MenuBoard rows with calorie_compliance_status == OVERDUE.
        default: 0
      - name: open_enforcement_escalated_count
        type: integer
        source: computed
        description: Count of EnforcementAction rows against this brand's establishments with status == ESCALATED.
        default: 0
      - name: has_published_disclosure_packet
        type: boolean
        source: computed
        description: True when at least one DisclosurePacket of this brand has status == PUBLISHED.
        default: false

  - name: Jurisdiction
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: State or local authority code used in enforcement correspondence.
        constraints: unique across Jurisdiction, 2-12 chars, uppercase letters/digits/hyphen only
      - name: name
        type: string
        source: input
        description: Human-readable authority name.
        constraints: 1-120 chars, non-blank
      - name: preemption_mode
        type: enum
        source: input
        description: Whether this authority may grant labeling variances at all.
        constraints: "one of {PREEMPTED, VARIANCE_ALLOWED}"
      - name: extra_requirement
        type: enum
        source: input
        description: State/local labeling requirement layered on top of the federal rule.
        default: NONE
        constraints: "one of {NONE, SODIUM_WARNING, ADDED_SUGAR_ICON}"
      - name: enforcement_tier
        type: enum
        source: input
        description: Penalty multiplier tier applied by calculations.enforcement_penalty_assessment.
        default: FEDERAL_ALIGNED
        constraints: "one of {FEDERAL_ALIGNED, ENHANCED}"
      - name: sodium_warning_threshold_mg
        type: integer
        source: input
        description: Declared-sodium level at or above which a listing must carry the sodium warning icon when extra_requirement == SODIUM_WARNING.
        default: 2300
        constraints: 0-10000
      - name: required_succinct_statement_variant
        type: enum
        source: input
        description: Succinct-statement wording variant a menu board must carry in this jurisdiction.
        default: FEDERAL_DEFAULT
        constraints: "one of {FEDERAL_DEFAULT, STATE_EXTENDED}"
      - name: reprint_grace_days
        type: integer
        source: computed
        description: Reprint window granted after a material recalculation; 30 when extra_requirement == NONE, else 14.
        default: 30
      - name: assessed_penalty_cents_total
        type: integer
        source: computed
        description: Sum of penalty_total_cents over this jurisdiction's EnforcementAction rows with status IN {PENALTY_ASSESSED, CLOSED_PENALTY}. Conserved quantity of the penalty-ledger invariant.
        default: 0

  - name: Establishment
    parent: Brand
    common_fields: true
    fields:
      - name: brand_id
        type: string
        source: input
        description: FK -> Brand.id; owning chain brand.
      - name: jurisdiction_id
        type: string
        source: input
        description: FK -> Jurisdiction.id; state/local authority whose labeling rules bind this unit.
      - name: unit_label
        type: string
        source: input
        description: Operator's label for the unit (store number).
        constraints: 1-40 chars, non-blank, unique within brand_id
      - name: unit_status
        type: enum
        source: input
        description: Operating lifecycle state of the unit; only OPERATING units count toward the federal unit threshold.
        default: PLANNED
        constraints: "one of {PLANNED, OPERATING, TEMPORARILY_CLOSED, PERMANENTLY_CLOSED}"
      - name: operates_under_brand_name
        type: boolean
        source: input
        description: True when the unit does business under Brand.doing_business_as; false units never count toward the unit threshold under any basis.
        default: true
      - name: outstanding_penalty_cents
        type: integer
        source: computed
        description: Sum of penalty_total_cents over this establishment's EnforcementAction rows with status IN {PENALTY_ASSESSED, CLOSED_PENALTY}.
        default: 0
      - name: board_count
        type: integer
        source: computed
        description: Count of MenuBoard rows of this establishment with publication_status != WITHDRAWN.
        default: 0

  - name: MenuItem
    parent: Brand
    common_fields: true
    fields:
      - name: brand_id
        type: string
        source: input
        description: FK -> Brand.id; chain that offers this item.
      - name: name
        type: string
        source: input
        description: Item name as printed on menus and menu boards.
        constraints: 1-120 chars, non-blank, unique within brand_id
      - name: item_class
        type: enum
        source: input
        description: FDA menu-item classification that drives the exclusion rules.
        constraints: "one of {STANDARD, TEMPORARY, TEST_MARKET, DAILY_SPECIAL, CUSTOM_ORDER, SELF_SERVICE}"
      - name: variable_type
        type: enum
        source: input
        description: Shape of the item's declaration; NONE declares a single value, every other value declares a min-max range.
        default: NONE
        constraints: "one of {NONE, SIZE_VARIANTS, FLAVOR_VARIANTS, COMBINATION_MEAL, TOPPING_BASED}"
      - name: first_offered_on
        type: string
        source: input
        description: Calendar date (YYYY-MM-DD) the item first appeared on a menu.
        constraints: ISO 8601 calendar date
      - name: offer_windows
        type: array
        source: computed
        description: "Append-only list of offered date ranges, each entry { start_date, end_date } (whole calendar days, closed interval), appended by POST /menu-items/{id}/offer-windows and never removed."
        default: []
      - name: cumulative_offered_days
        type: integer
        source: computed
        description: Merged offered-day total for the most recently reviewed calendar year, produced by calculations.temporary_item_exemption_days.
        default: 0
      - name: labeling_exempt
        type: boolean
        source: computed
        description: True when this item is excluded from calorie-declaration duty. STANDARD is never exempt; DAILY_SPECIAL, CUSTOM_ORDER and SELF_SERVICE are always exempt; TEMPORARY and TEST_MARKET start exempt and lose exemption once the merged day total reaches their limit.
        default: false
      - name: labeling_status
        type: enum
        source: computed
        description: Declaration lifecycle of the item on menus.
        default: DECLARATION_PENDING
        constraints: "one of {NOT_REQUIRED, DECLARATION_PENDING, DECLARED, RELABEL_REQUIRED}"
      - name: declared_calorie_min
        type: integer
        source: computed
        description: Low end of the printed calorie declaration after FDA declaration rounding; null until a Recipe is APPROVED.
        default: null
      - name: declared_calorie_max
        type: integer
        source: computed
        description: High end of the printed calorie declaration after FDA declaration rounding; equals declared_calorie_min when variable_type == NONE.
        default: null
      - name: declared_sodium_mg
        type: integer
        source: computed
        description: Declared sodium for the maximum-calorie configuration after the declare_sodium ladder of calculations.declared_sodium_rounding; drives the state/local sodium warning icon.
        default: null
      - name: approved_recipe_version_no
        type: integer
        source: computed
        description: version_no of the Recipe currently in status APPROVED for this item; null when none. The recipe row itself is discovered through GET /recipes with menu_item_id and status filters.
        default: null
      - name: allergen_groups
        type: array
        source: computed
        description: Alphabetically ascending list of distinct allergen groups declared by the APPROVED recipe's components (NONE excluded).
        default: []
      - name: cross_contact_groups
        type: array
        source: computed
        description: Alphabetically ascending list of allergen groups contributed by components whose cross_contact_risk != NONE.
        default: []

  - name: Recipe
    parent: MenuItem
    common_fields: true
    fields:
      - name: menu_item_id
        type: string
        source: input
        description: FK -> MenuItem.id; item this recipe version specifies.
      - name: version_no
        type: integer
        source: computed
        description: 1 for the item's first recipe, then previous highest version_no + 1.
      - name: supersedes_recipe_id
        type: string
        source: computed
        description: FK -> Recipe.id; the APPROVED recipe this version displaced when it was certified, null when the item had no APPROVED recipe at certification time.
        default: null
      - name: status
        type: enum
        source: computed
        description: Certification lifecycle of the recipe version.
        default: DRAFT
        constraints: "one of {DRAFT, ANALYSIS_PENDING, APPROVED, SUPERSEDED, WITHDRAWN, REJECTED}"
      - name: revision_round
        type: integer
        source: computed
        description: Number of rejections this recipe has absorbed; a rejection at revision_round == 3 ends in REJECTED instead of returning to DRAFT.
        default: 0
      - name: change_note
        type: string
        source: input
        description: Operator's description of what changed versus the prior version.
        constraints: 1-240 chars, non-blank
      - name: component_count
        type: integer
        source: computed
        description: Count of RecipeComponent rows attached to this recipe.
        default: 0
      - name: computed_base_calories
        type: number
        source: computed
        description: Sum of component_calories over components with role == BASE, at 2 decimal places, before FDA declaration rounding.
        default: 0
      - name: computed_declared_min
        type: integer
        source: computed
        description: Declaration-rounded low end computed at certification time.
        default: null
      - name: computed_declared_max
        type: integer
        source: computed
        description: Declaration-rounded high end computed at certification time.
        default: null
      - name: computed_sodium_mg
        type: integer
        source: computed
        description: Declared sodium of the maximum-calorie configuration, rounded to the nearest 10 mg.
        default: null
      - name: approved_at
        type: datetime
        source: computed
        description: Logical-clock instant at which the recipe entered APPROVED; null otherwise.
        default: null

  - name: RecipeComponent
    parent: Recipe
    common_fields: false
    fields:
      - name: recipe_id
        type: string
        source: input
        description: FK -> Recipe.id; recipe this component belongs to.
      - name: component_name
        type: string
        source: input
        description: Ingredient or slot name as it appears in the recipe sheet.
        constraints: 1-80 chars, non-blank, unique within recipe_id
      - name: role
        type: enum
        source: input
        description: BASE components are always served; CHOICE components belong to a selectable group.
        constraints: "one of {BASE, CHOICE}"
      - name: choice_group
        type: string
        source: input
        description: Group label shared by mutually exclusive or additive options; required when role == CHOICE, must be null when role == BASE.
        default: null
        constraints: 1-40 chars when present
      - name: selection_mode
        type: enum
        source: input
        description: How many members of choice_group a guest receives; required when role == CHOICE, must be null when role == BASE, and identical across every component sharing one choice_group.
        default: null
        constraints: "one of {EXACTLY_ONE, UP_TO_N, UNLIMITED}"
      - name: selection_limit
        type: integer
        source: input
        description: N for selection_mode == UP_TO_N; required in that mode, must be null otherwise, and identical across every component sharing one choice_group.
        default: null
        constraints: 1-10
      - name: grams
        type: number
        source: input
        description: As-served portion weight in grams.
        constraints: "> 0, at most 2 decimal places"
      - name: calories_per_100g
        type: number
        source: input
        description: Supplier-specification energy density per 100 g.
        constraints: ">= 0, at most 2 decimal places"
      - name: sodium_mg_per_100g
        type: number
        source: input
        description: Supplier-specification sodium per 100 g.
        constraints: ">= 0, at most 2 decimal places"
      - name: added_sugar_g_per_100g
        type: number
        source: input
        description: Supplier-specification added sugar per 100 g.
        default: 0
        constraints: ">= 0, at most 2 decimal places"
      - name: allergen_group
        type: enum
        source: input
        description: Major food allergen this component contributes.
        default: NONE
        constraints: "one of {NONE, MILK, EGG, FISH, CRUSTACEAN_SHELLFISH, TREE_NUT, PEANUT, WHEAT, SOY, SESAME}"
      - name: cross_contact_risk
        type: enum
        source: input
        description: Shared-equipment exposure that forces a cross-contact statement on the brand's disclosure packet.
        default: NONE
        constraints: "one of {NONE, SHARED_FRYER, SHARED_LINE, SHARED_EQUIPMENT}"
      - name: component_calories
        type: number
        source: computed
        description: round_half_up(calories_per_100g * grams / 100, 2) — the per-component figure that is summed before declaration rounding.
      - name: component_sodium_mg
        type: number
        source: computed
        description: round_half_up(sodium_mg_per_100g * grams / 100, 2).

  - name: NutritionAnalysis
    parent: Recipe
    common_fields: true
    fields:
      - name: recipe_id
        type: string
        source: input
        description: FK -> Recipe.id; recipe version under analysis.
      - name: method
        type: enum
        source: input
        description: Basis of the nutrient figures.
        constraints: "one of {DATABASE, LAB_ANALYSIS}"
      - name: status
        type: enum
        source: computed
        description: Review state of the analysis.
        default: SUBMITTED
        constraints: "one of {SUBMITTED, CERTIFIED, REJECTED}"
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the NutritionAnalyst who submitted the recipe for analysis.
      - name: decided_by_user_id
        type: string
        source: computed
        description: X-User-ID of the NutritionAnalyst who certified or rejected the analysis; must differ from submitted_by_user_id for a CERTIFY decision.
        default: null
      - name: decision_note
        type: string
        source: computed
        description: Note supplied with the certification decision.
        default: null
      - name: certified_at
        type: datetime
        source: computed
        description: Logical-clock instant of certification; null unless status == CERTIFIED.
        default: null
      - name: declared_calorie_min
        type: integer
        source: computed
        description: Declaration-rounded low end snapshotted at certification.
        default: null
      - name: declared_calorie_max
        type: integer
        source: computed
        description: Declaration-rounded high end snapshotted at certification.
        default: null
      - name: declared_sodium_mg
        type: integer
        source: computed
        description: Declared sodium snapshotted at certification, nearest 10 mg.
        default: null

  - name: MenuBoard
    parent: Establishment
    common_fields: true
    fields:
      - name: establishment_id
        type: string
        source: input
        description: FK -> Establishment.id; unit that displays this board.
      - name: board_type
        type: enum
        source: input
        description: Surface the declaration appears on; overlap of display windows is checked per (establishment_id, board_type).
        constraints: "one of {PRIMARY_MENU_BOARD, DRIVE_THRU_BOARD, PRINTED_MENU, THIRD_PARTY_DELIVERY}"
      - name: succinct_statement_variant
        type: enum
        source: input
        description: Succinct-statement wording carried by this board; must match the jurisdiction's requirement unless a GRANTED variance covers SUCCINCT_STATEMENT.
        constraints: "one of {FEDERAL_DEFAULT, STATE_EXTENDED, OMITTED}"
      - name: publication_status
        type: enum
        source: computed
        description: First of the board's two independent state dimensions.
        default: DRAFT
        constraints: "one of {DRAFT, PUBLISHED, WITHDRAWN}"
      - name: calorie_compliance_status
        type: enum
        source: computed
        description: Second, independent state dimension tracking whether the printed declarations still match the certified recipes.
        default: CURRENT
        constraints: "one of {CURRENT, REPRINT_REQUIRED, OVERDUE}"
      - name: effective_from
        type: datetime
        source: computed
        description: Start instant of the display window, set at publication; the window is half-open [effective_from, effective_to).
        default: null
      - name: effective_to
        type: datetime
        source: computed
        description: Exclusive end instant of the display window; null means open-ended (no later window on the same establishment_id and board_type can be published).
        default: null
      - name: reprint_deadline
        type: datetime
        source: computed
        description: Instant by which the reprint must be filed; set when calorie_compliance_status becomes REPRINT_REQUIRED, cleared on reprint.
        default: null
      - name: reprint_count
        type: integer
        source: computed
        description: Number of accepted reprints on this board.
        default: 0
      - name: listing_count
        type: integer
        source: computed
        description: Count of MenuBoardListing rows with listing_status != REMOVED.
        default: 0
      - name: stale_listing_count
        type: integer
        source: computed
        description: Count of MenuBoardListing rows with listing_status == STALE.
        default: 0

  - name: MenuBoardListing
    parent: MenuBoard
    common_fields: true
    fields:
      - name: menu_board_id
        type: string
        source: input
        description: FK -> MenuBoard.id; board this line appears on.
      - name: menu_item_id
        type: string
        source: input
        description: FK -> MenuItem.id; item printed on this line; must belong to the same brand as the board's establishment.
      - name: sodium_warning_icon
        type: boolean
        source: input
        description: Whether the printed line carries the state/local sodium warning icon.
        default: false
      - name: listing_status
        type: enum
        source: computed
        description: Whether the printed line still matches the item's certified declaration.
        default: LISTED
        constraints: "one of {LISTED, STALE, REMOVED}"
      - name: display_calorie_text
        type: string
        source: computed
        description: "Printed calorie text derived from the item's declaration: \"<min> Cal\" when declared_calorie_min == declared_calorie_max, else \"<min>-<max> Cal\"."
      - name: declared_min_snapshot
        type: integer
        source: computed
        description: declared_calorie_min copied from the item when the line was created or last reprinted.
      - name: declared_max_snapshot
        type: integer
        source: computed
        description: declared_calorie_max copied from the item when the line was created or last reprinted.

  - name: DisclosurePacket
    parent: Brand
    common_fields: true
    fields:
      - name: brand_id
        type: string
        source: input
        description: FK -> Brand.id; chain publishing the allergen matrix and written nutrition information.
      - name: packet_version
        type: integer
        source: computed
        description: 1 for the brand's first packet, then previous highest packet_version + 1.
      - name: cross_contact_statement
        type: string
        source: input
        description: Cross-contact wording printed with the allergen matrix; may be an empty string only when no covered item has a component with cross_contact_risk != NONE.
        constraints: 0-400 chars
      - name: written_info_channels
        type: array
        source: input
        description: Channels through which the additional written nutrition information is available on request; each entry one of {IN_STORE_BINDER, WEBSITE, QR_HANDOUT, PHONE_LINE}.
        constraints: 1-4 distinct entries
      - name: status
        type: enum
        source: computed
        description: Publication state of the packet.
        default: DRAFT
        constraints: "one of {DRAFT, PUBLISHED, SUPERSEDED, STALE}"
      - name: covered_item_count
        type: integer
        source: computed
        description: Count of the brand's MenuItem rows with labeling_exempt == false that have an APPROVED recipe, snapshotted whenever the matrix is synthesized.
        default: 0
      - name: allergen_matrix_complete
        type: boolean
        source: computed
        description: True when covered_item_count equals the brand's standard_item_count.
        default: false
      - name: cross_contact_statement_required
        type: boolean
        source: computed
        description: True when any component of any covered item's APPROVED recipe has cross_contact_risk != NONE.
        default: false
      - name: allergen_rows
        type: array
        source: computed
        description: "One entry per covered item: { menu_item_id, item_name, allergen_groups, cross_contact_groups }, ordered by item_name ASC."
        default: []
      - name: published_at
        type: datetime
        source: computed
        description: Logical-clock instant of publication; null unless the packet has been published.
        default: null

  - name: VarianceRequest
    parent: Brand
    common_fields: true
    fields:
      - name: brand_id
        type: string
        source: input
        description: FK -> Brand.id; chain asking for relief.
      - name: jurisdiction_id
        type: string
        source: input
        description: FK -> Jurisdiction.id; authority asked to grant the variance.
      - name: requirement_code
        type: enum
        source: input
        description: Which state/local requirement the brand asks to be relieved from.
        constraints: "one of {SUCCINCT_STATEMENT, SODIUM_WARNING, ADDED_SUGAR_ICON, WRITTEN_INFO_FORMAT}"
      - name: justification
        type: string
        source: input
        description: Brand's written justification.
        constraints: 1-400 chars, non-blank
      - name: requested_start_date
        type: string
        source: input
        description: First calendar day of relief the brand asks for (YYYY-MM-DD).
      - name: requested_end_date
        type: string
        source: input
        description: Last calendar day of relief the brand asks for (YYYY-MM-DD); must be >= requested_start_date.
      - name: status
        type: enum
        source: computed
        description: Review state of the request.
        default: SUBMITTED
        constraints: "one of {SUBMITTED, UNDER_REVIEW, GRANTED, DENIED, EXPIRED}"
      - name: effective_start_date
        type: string
        source: computed
        description: First covered day, set on grant; the covered interval is closed [effective_start_date, effective_end_date].
        default: null
      - name: effective_end_date
        type: string
        source: computed
        description: Last covered day, set on grant.
        default: null
      - name: decision_note
        type: string
        source: computed
        description: Regulator's note recorded with the decision.
        default: null
      - name: decided_by_user_id
        type: string
        source: computed
        description: X-User-ID of the StateRegulator who decided the request.
        default: null

  - name: EnforcementAction
    parent: Establishment
    common_fields: true
    fields:
      - name: establishment_id
        type: string
        source: input
        description: FK -> Establishment.id; cited unit.
      - name: jurisdiction_id
        type: string
        source: computed
        description: FK -> Jurisdiction.id; copied from the cited establishment at opening time.
      - name: citation_code
        type: enum
        source: input
        description: Labeling requirement the inspector cites.
        constraints: "one of {CALORIES_NOT_DECLARED, SUCCINCT_STATEMENT_MISSING, WRITTEN_INFO_UNAVAILABLE, ALLERGEN_MATRIX_MISSING, SODIUM_WARNING_MISSING}"
      - name: inspection_note
        type: string
        source: input
        description: Inspector's field note.
        default: null
        constraints: 0-400 chars
      - name: status
        type: enum
        source: computed
        description: Case state; information rounds and penalty rescission both re-enter RESPONSE_SUBMITTED.
        default: OPEN
        constraints: "one of {OPEN, RESPONSE_SUBMITTED, INFO_REQUESTED, ESCALATED, PENALTY_ASSESSED, CLOSED_COMPLIANT, CLOSED_PENALTY}"
      - name: info_round_count
        type: integer
        source: computed
        description: Number of REQUEST_INFO actions taken on this case; escalation requires at least 1.
        default: 0
      - name: response_count
        type: integer
        source: computed
        description: Number of brand responses filed on this case.
        default: 0
      - name: last_response_type
        type: enum
        source: computed
        description: Type of the most recent brand response.
        default: null
        constraints: "one of {REPRINT_COMPLETED, VARIANCE_CITED, DISPUTED}"
      - name: penalty_basis
        type: enum
        source: computed
        description: Counting basis chosen by the regulator at assessment time.
        default: null
        constraints: "one of {PER_BOARD, PER_ESTABLISHMENT}"
      - name: violation_unit_count
        type: integer
        source: computed
        description: Number of violation units counted under penalty_basis.
        default: null
      - name: base_penalty_cents
        type: integer
        source: computed
        description: violation_unit_count * 50000 * the jurisdiction's tier multiplier, rounded half up to whole cents.
        default: null
      - name: admin_fee_cents
        type: integer
        source: computed
        description: Administrative fee selected from the tier of base_penalty_cents, rounded half up to whole cents.
        default: null
      - name: penalty_total_cents
        type: integer
        source: computed
        description: base_penalty_cents + admin_fee_cents while a penalty stands; 0 before assessment and after rescission.
        default: 0
      - name: opened_at
        type: datetime
        source: computed
        description: Logical-clock instant the case was opened.
      - name: closed_at
        type: datetime
        source: computed
        description: Logical-clock instant the case reached CLOSED_COMPLIANT or CLOSED_PENALTY.
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Brand
    state_field: compliance_posture
    initial_state: EXEMPT
    terminal_states: []
    note: |
      Derived posture. It is never set by a request field; it is recomputed at the
      end of every mutation that changes coverage_status, open_reprint_obligation_count,
      overdue_board_count or open_enforcement_escalated_count, using this ladder
      evaluated top to bottom (first match wins):
        FROZEN     when coverage_status == COVERED and (overdue_board_count >= 1
                   or open_enforcement_escalated_count >= 1)
        RESTRICTED when coverage_status == COVERED and open_reprint_obligation_count >= 1
        COMPLIANT  when coverage_status == COVERED
        EXEMPT     when coverage_status == NOT_COVERED
    transitions:
      - from: EXEMPT
        to: COMPLIANT
        trigger: "system: recomputation after Brand.coverage_status becomes COVERED"
        actor: system
        preconditions: ["coverage_status == COVERED", "open_reprint_obligation_count == 0", "overdue_board_count == 0", "open_enforcement_escalated_count == 0"]
        side_effects: ["Brand.updated_at refreshed", "Brand.version incremented by 1"]
      - from: COMPLIANT
        to: EXEMPT
        trigger: "system: recomputation after Brand.coverage_status becomes NOT_COVERED"
        actor: system
        preconditions: ["coverage_status == NOT_COVERED"]
        side_effects: ["Brand.updated_at refreshed", "Brand.version incremented by 1"]
      - from: COMPLIANT
        to: RESTRICTED
        trigger: "system: a PUBLISHED MenuBoard of this brand entered calorie_compliance_status REPRINT_REQUIRED"
        actor: system
        preconditions: ["coverage_status == COVERED", "open_reprint_obligation_count >= 1", "overdue_board_count == 0", "open_enforcement_escalated_count == 0"]
        side_effects: ["Brand.updated_at refreshed", "Brand.version incremented by 1"]
      - from: RESTRICTED
        to: COMPLIANT
        trigger: "system: the last outstanding reprint obligation cleared (reprint filed, board withdrawn, or certification withdrawn)"
        actor: system
        preconditions: ["coverage_status == COVERED", "open_reprint_obligation_count == 0", "overdue_board_count == 0", "open_enforcement_escalated_count == 0"]
        side_effects: ["Brand.updated_at refreshed", "Brand.version incremented by 1"]
      - from: RESTRICTED
        to: FROZEN
        trigger: "system: a REPRINT_REQUIRED board passed its reprint_deadline during POST /_clock/set_current_utc, or an EnforcementAction against this brand reached ESCALATED"
        actor: system
        preconditions: ["coverage_status == COVERED", "overdue_board_count >= 1 or open_enforcement_escalated_count >= 1"]
        side_effects:
          - "gates POST /menu-items and POST /menu-boards/{id}/publish for this brand with ERR_BRAND_POSTURE_FROZEN"
          - "Brand.version incremented by 1"
      - from: COMPLIANT
        to: FROZEN
        trigger: "system: an EnforcementAction against one of this brand's establishments reached ESCALATED"
        actor: system
        preconditions: ["coverage_status == COVERED", "open_enforcement_escalated_count >= 1"]
        side_effects: ["gates POST /menu-items and POST /menu-boards/{id}/publish for this brand with ERR_BRAND_POSTURE_FROZEN", "Brand.version incremented by 1"]
      - from: FROZEN
        to: RESTRICTED
        trigger: "system: the last overdue board was reprinted while other reprint obligations remain, or the escalated case was closed/rescinded"
        actor: system
        preconditions: ["coverage_status == COVERED", "overdue_board_count == 0", "open_enforcement_escalated_count == 0", "open_reprint_obligation_count >= 1"]
        side_effects: ["Brand.version incremented by 1"]
      - from: FROZEN
        to: COMPLIANT
        trigger: "system: every overdue board reprinted and no escalated case remains"
        actor: system
        preconditions: ["coverage_status == COVERED", "overdue_board_count == 0", "open_enforcement_escalated_count == 0", "open_reprint_obligation_count == 0"]
        side_effects: ["Brand.version incremented by 1"]

  - entity: Establishment
    state_field: unit_status
    initial_state: PLANNED
    terminal_states: [PERMANENTLY_CLOSED]
    note: "unit_status may also be supplied as OPERATING at creation time; PLANNED is the default when the field is omitted."
    transitions:
      - from: PLANNED
        to: OPERATING
        trigger: "POST /establishments/{id}/status-changes with new_unit_status OPERATING"
        actor: BrandComplianceOfficer
        preconditions: ["acting X-User-ID == Establishment.brand_id"]
        side_effects:
          - "Brand.counted_unit_count recomputed"
          - "calculations.covered_establishment_determination re-run on the OPERATING_ONLY basis, updating Brand.coverage_status and Brand.coverage_reason"
          - "Brand.compliance_posture recomputed"
      - from: OPERATING
        to: TEMPORARILY_CLOSED
        trigger: "POST /establishments/{id}/status-changes with new_unit_status TEMPORARILY_CLOSED"
        actor: BrandComplianceOfficer
        preconditions: ["acting X-User-ID == Establishment.brand_id"]
        side_effects:
          - "Brand.counted_unit_count recomputed (the unit stops counting on the OPERATING_ONLY basis but still counts on the REGISTERED_ALL basis)"
          - "calculations.covered_establishment_determination re-run on the OPERATING_ONLY basis"
          - "Brand.compliance_posture recomputed"
          - "MenuBoard rows of the unit are untouched (a temporary closure does not withdraw boards)"
      - from: TEMPORARILY_CLOSED
        to: OPERATING
        trigger: "POST /establishments/{id}/status-changes with new_unit_status OPERATING"
        actor: BrandComplianceOfficer
        preconditions: ["acting X-User-ID == Establishment.brand_id"]
        side_effects: ["Brand.counted_unit_count recomputed", "coverage determination re-run", "Brand.compliance_posture recomputed"]
        note: "Reopening cycle: OPERATING -> TEMPORARILY_CLOSED -> OPERATING."
      - from: OPERATING
        to: PERMANENTLY_CLOSED
        trigger: "POST /establishments/{id}/status-changes with new_unit_status PERMANENTLY_CLOSED"
        actor: BrandComplianceOfficer
        preconditions: ["acting X-User-ID == Establishment.brand_id", "no EnforcementAction of this establishment has status IN {OPEN, RESPONSE_SUBMITTED, INFO_REQUESTED, ESCALATED, PENALTY_ASSESSED}"]
        side_effects:
          - "CASCADE hop 1: every MenuBoard of the unit with publication_status IN {DRAFT, PUBLISHED} transitions to WITHDRAWN, processed in created_at ASC order"
          - "CASCADE hop 2 (caused by hop 1): each withdrawn board sets its MenuBoardListing rows with listing_status IN {LISTED, STALE} to REMOVED and, when the board left PUBLISHED with calorie_compliance_status IN {REPRINT_REQUIRED, OVERDUE}, decrements Brand.open_reprint_obligation_count by 1 and Brand.overdue_board_count when applicable"
          - "CASCADE hop 3 (caused by hop 2): each MenuItem that no longer has any STALE listing returns from labeling_status RELABEL_REQUIRED to DECLARED"
          - "CASCADE hop 4 (caused by hops 1-3): Brand.counted_unit_count recomputed, coverage determination re-run on the OPERATING_ONLY basis, Brand.compliance_posture recomputed"
          - "Establishment.board_count recomputed to 0"
      - from: TEMPORARILY_CLOSED
        to: PERMANENTLY_CLOSED
        trigger: "POST /establishments/{id}/status-changes with new_unit_status PERMANENTLY_CLOSED"
        actor: BrandComplianceOfficer
        preconditions: ["acting X-User-ID == Establishment.brand_id", "no EnforcementAction of this establishment has status IN {OPEN, RESPONSE_SUBMITTED, INFO_REQUESTED, ESCALATED, PENALTY_ASSESSED}"]
        side_effects: ["same four cascade hops as OPERATING -> PERMANENTLY_CLOSED"]

  - entity: MenuItem
    state_field: labeling_status
    initial_state: DECLARATION_PENDING
    terminal_states: []
    note: "Items created with item_class IN {DAILY_SPECIAL, CUSTOM_ORDER, SELF_SERVICE, TEMPORARY, TEST_MARKET} are initialized to NOT_REQUIRED because labeling_exempt starts true for those classes; STANDARD items start at DECLARATION_PENDING."
    transitions:
      - from: DECLARATION_PENDING
        to: DECLARED
        trigger: "system: the item's first Recipe reaches APPROVED (POST /nutrition-analyses/{id}/decision with decision CERTIFY)"
        actor: system
        preconditions: ["labeling_exempt == false", "the certified recipe has component_count >= 1"]
        side_effects:
          - "MenuItem.declared_calorie_min / declared_calorie_max / declared_sodium_mg set from the certified recipe"
          - "MenuItem.allergen_groups and cross_contact_groups recomputed by calculations.allergen_matrix_synthesis"
          - "MenuItem.approved_recipe_version_no set"
      - from: DECLARED
        to: RELABEL_REQUIRED
        trigger: "system: a newer Recipe reaches APPROVED and |new declared_calorie_max - prior declared_calorie_max| >= the tolerance from calculations.reprint_obligation_and_deadline"
        actor: system
        preconditions: ["labeling_exempt == false", "the item has at least one MenuBoardListing with listing_status == LISTED on a board with publication_status == PUBLISHED"]
        side_effects:
          - "every MenuBoardListing of this item with listing_status == LISTED becomes STALE"
          - "every PUBLISHED board holding such a listing moves calorie_compliance_status CURRENT -> REPRINT_REQUIRED"
      - from: RELABEL_REQUIRED
        to: DECLARED
        trigger: "system: the last STALE listing of this item was cleared by POST /menu-boards/{id}/reprint, by board withdrawal, or by POST /recipes/{id}/withdraw-certification"
        actor: system
        preconditions: ["no MenuBoardListing of this item has listing_status == STALE"]
        side_effects: ["MenuItem.declared_* fields hold the values of the currently APPROVED recipe"]
        note: "Relabel cycle: DECLARED -> RELABEL_REQUIRED -> DECLARED."
      - from: NOT_REQUIRED
        to: DECLARATION_PENDING
        trigger: "POST /menu-items/{id}/exemption-reviews whose merged day total reaches the class limit, flipping labeling_exempt true -> false"
        actor: BrandComplianceOfficer
        preconditions: ["item_class IN {TEMPORARY, TEST_MARKET}", "no Recipe of this item has status APPROVED"]
        side_effects:
          - "Brand.standard_item_count recomputed"
          - "coverage determination re-run on the OPERATING_ONLY basis"
          - "every PUBLISHED DisclosurePacket of the brand becomes STALE because allergen_matrix_complete no longer holds"
          - "Brand.compliance_posture recomputed"
      - from: NOT_REQUIRED
        to: DECLARED
        trigger: "POST /menu-items/{id}/exemption-reviews flipping labeling_exempt true -> false while a Recipe of the item is already APPROVED"
        actor: BrandComplianceOfficer
        preconditions: ["item_class IN {TEMPORARY, TEST_MARKET}", "exactly one Recipe of this item has status APPROVED"]
        side_effects: ["Brand.standard_item_count recomputed", "coverage determination re-run", "Brand.compliance_posture recomputed"]
      - from: DECLARATION_PENDING
        to: NOT_REQUIRED
        trigger: "POST /menu-items/{id}/exemption-reviews whose merged day total for the reviewed year falls back below the class limit, flipping labeling_exempt false -> true"
        actor: BrandComplianceOfficer
        preconditions: ["item_class IN {TEMPORARY, TEST_MARKET}"]
        side_effects: ["Brand.standard_item_count recomputed", "coverage determination re-run", "Brand.compliance_posture recomputed"]

  - entity: Recipe
    state_field: status
    initial_state: DRAFT
    terminal_states: [WITHDRAWN, REJECTED]
    transitions:
      - from: DRAFT
        to: ANALYSIS_PENDING
        trigger: "POST /recipes/{id}/submit-for-analysis"
        actor: NutritionAnalyst
        preconditions: ["Recipe.component_count >= 1", "every choice_group of the recipe declares one consistent selection_mode / selection_limit", "no other Recipe of the same MenuItem has status ANALYSIS_PENDING"]
        side_effects:
          - "a NutritionAnalysis row is created with status SUBMITTED and submitted_by_user_id = acting X-User-ID (discoverable through GET /recipes/{id}/nutrition-analyses)"
          - "Recipe.computed_base_calories recomputed by calculations.base_item_calorie_declaration"
      - from: ANALYSIS_PENDING
        to: APPROVED
        trigger: "POST /nutrition-analyses/{id}/decision with decision CERTIFY"
        actor: NutritionAnalyst
        preconditions: ["acting X-User-ID != NutritionAnalysis.submitted_by_user_id", "NutritionAnalysis.status == SUBMITTED"]
        side_effects:
          - "Recipe.approved_at set to the logical clock; Recipe.computed_declared_min / computed_declared_max / computed_sodium_mg written"
          - "CASCADE hop 1: the MenuItem's previously APPROVED Recipe (if any) transitions APPROVED -> SUPERSEDED and this recipe's supersedes_recipe_id is set to that row's id"
          - "CASCADE hop 2 (caused by hop 1): MenuItem.declared_calorie_min / declared_calorie_max / declared_sodium_mg / allergen_groups / cross_contact_groups / approved_recipe_version_no are rewritten from this recipe, and labeling_status moves DECLARATION_PENDING -> DECLARED, or DECLARED -> RELABEL_REQUIRED when the calorie delta reaches the tolerance"
          - "CASCADE hop 3 (caused by hop 2 entering RELABEL_REQUIRED): every LISTED MenuBoardListing of the item becomes STALE and every PUBLISHED holding board moves calorie_compliance_status CURRENT -> REPRINT_REQUIRED with reprint_deadline = logical clock + the board's jurisdiction's reprint_grace_days"
          - "CASCADE hop 4 (caused by hop 3): Brand.open_reprint_obligation_count increases by one per newly REPRINT_REQUIRED board and Brand.compliance_posture is recomputed (COMPLIANT -> RESTRICTED)"
          - "every PUBLISHED DisclosurePacket of the brand becomes STALE when the item's allergen_groups or cross_contact_groups changed"
      - from: ANALYSIS_PENDING
        to: DRAFT
        trigger: "POST /nutrition-analyses/{id}/decision with decision REJECT while Recipe.revision_round < 3"
        actor: NutritionAnalyst
        preconditions: ["NutritionAnalysis.status == SUBMITTED", "Recipe.revision_round < 3"]
        side_effects: ["Recipe.revision_round incremented by 1", "NutritionAnalysis.status becomes REJECTED", "the recipe becomes editable again so further components may be added"]
        note: "Revision cycle: DRAFT -> ANALYSIS_PENDING -> DRAFT."
      - from: ANALYSIS_PENDING
        to: REJECTED
        trigger: "POST /nutrition-analyses/{id}/decision with decision REJECT while Recipe.revision_round == 3"
        actor: NutritionAnalyst
        preconditions: ["NutritionAnalysis.status == SUBMITTED", "Recipe.revision_round == 3"]
        side_effects: ["NutritionAnalysis.status becomes REJECTED", "the recipe version is terminal and can never be resubmitted"]
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system: a newer Recipe of the same MenuItem reached APPROVED"
        actor: system
        preconditions: ["the newer recipe's certification succeeded"]
        side_effects: ["Recipe.updated_at refreshed", "Recipe.version incremented by 1"]
      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /recipes/{id}/withdraw-certification"
        actor: NutritionAnalyst
        preconditions: ["Recipe.status == APPROVED", "Recipe.supersedes_recipe_id != null"]
        side_effects:
          - "COMPENSATION hop 1: the Recipe named by supersedes_recipe_id transitions SUPERSEDED -> APPROVED"
          - "COMPENSATION hop 2 (caused by hop 1): MenuItem.declared_calorie_min / declared_calorie_max / declared_sodium_mg / allergen_groups / cross_contact_groups / approved_recipe_version_no are rewritten from the restored recipe"
          - "COMPENSATION hop 3 (caused by hop 2): every MenuBoardListing of the item with listing_status == STALE returns to LISTED with display_calorie_text and snapshots rebuilt from the restored declaration, and every board whose stale_listing_count reaches 0 returns calorie_compliance_status REPRINT_REQUIRED -> CURRENT or OVERDUE -> CURRENT with reprint_deadline cleared"
          - "COMPENSATION hop 4 (caused by hop 3): Brand.open_reprint_obligation_count and Brand.overdue_board_count are decremented back to their pre-certification values, MenuItem.labeling_status returns RELABEL_REQUIRED -> DECLARED, and Brand.compliance_posture is recomputed"
      - from: SUPERSEDED
        to: APPROVED
        trigger: "system: the superseding Recipe was withdrawn by POST /recipes/{id}/withdraw-certification"
        actor: system
        preconditions: ["the withdrawing recipe's supersedes_recipe_id == this Recipe.id"]
        side_effects: ["Recipe.approved_at refreshed to the logical clock of the restoration", "Recipe.version incremented by 1"]
        note: "Certification cycle: APPROVED -> SUPERSEDED -> APPROVED."

  - entity: NutritionAnalysis
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [CERTIFIED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /nutrition-analyses/{id}/decision with decision CERTIFY"
        actor: NutritionAnalyst
        preconditions: ["acting X-User-ID != submitted_by_user_id", "the parent Recipe.status == ANALYSIS_PENDING"]
        side_effects: ["certified_at, decided_by_user_id, decision_note, declared_calorie_min / declared_calorie_max / declared_sodium_mg written", "parent Recipe transitions ANALYSIS_PENDING -> APPROVED with its full cascade"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /nutrition-analyses/{id}/decision with decision REJECT"
        actor: NutritionAnalyst
        preconditions: ["the parent Recipe.status == ANALYSIS_PENDING"]
        side_effects: ["decided_by_user_id and decision_note written", "parent Recipe returns to DRAFT with revision_round + 1, or becomes REJECTED when revision_round was already 3"]
        note: "A REJECT decision may be taken by the submitting analyst; only CERTIFY is segregated."

  - entity: MenuBoard
    state_field: publication_status
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    note: "First of two independent state dimensions on the same MenuBoard row; publication_status and calorie_compliance_status advance on unrelated triggers and any combination of the two is reachable."
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /menu-boards/{id}/publish"
        actor: MenuboardPublisher
        preconditions:
          - "acting X-User-ID == MenuBoard.establishment_id"
          - "Brand.coverage_status == COVERED"
          - "Brand.compliance_posture != FROZEN"
          - "the brand has a DisclosurePacket with status == PUBLISHED and allergen_matrix_complete == true"
          - "succinct_statement_variant matches the jurisdiction's required_succinct_statement_variant, unless a GRANTED VarianceRequest for requirement_code SUCCINCT_STATEMENT covers the publication date"
          - "MenuBoard.listing_count >= 1 and every listing's MenuItem has labeling_status IN {DECLARED, RELABEL_REQUIRED} with declared_calorie_max != null, or labeling_exempt == true"
          - "every listing whose item's declared_sodium_mg >= the jurisdiction's sodium_warning_threshold_mg carries sodium_warning_icon == true when the jurisdiction's extra_requirement == SODIUM_WARNING"
          - "no other MenuBoard of the same establishment_id and board_type with publication_status == PUBLISHED has a display window overlapping [effective_from, effective_to)"
        side_effects:
          - "effective_from / effective_to written from the request"
          - "Establishment.board_count recomputed"
          - "listing snapshots (declared_min_snapshot, declared_max_snapshot, display_calorie_text) refreshed from the items' current declarations"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "system: the owning Establishment reached PERMANENTLY_CLOSED"
        actor: system
        preconditions: ["Establishment.unit_status == PERMANENTLY_CLOSED"]
        side_effects: ["every MenuBoardListing of the board becomes REMOVED", "Establishment.board_count recomputed"]
      - from: PUBLISHED
        to: WITHDRAWN
        trigger: "system: the owning Establishment reached PERMANENTLY_CLOSED"
        actor: system
        preconditions: ["Establishment.unit_status == PERMANENTLY_CLOSED"]
        side_effects:
          - "every MenuBoardListing of the board becomes REMOVED"
          - "when calorie_compliance_status was REPRINT_REQUIRED or OVERDUE, Brand.open_reprint_obligation_count is decremented by 1 (and Brand.overdue_board_count when it was OVERDUE)"
          - "Brand.compliance_posture recomputed"

  - entity: MenuBoard
    state_field: calorie_compliance_status
    initial_state: CURRENT
    terminal_states: []
    note: "Second, independent state dimension on the same MenuBoard row. It advances only on recipe-certification cascades, clock advances and reprints, and never on publication actions."
    transitions:
      - from: CURRENT
        to: REPRINT_REQUIRED
        trigger: "system: an item listed on this board entered labeling_status RELABEL_REQUIRED after a recipe certification"
        actor: system
        preconditions: ["publication_status == PUBLISHED", "at least one MenuBoardListing of the board became STALE"]
        side_effects:
          - "reprint_deadline set to the logical clock + the establishment's jurisdiction's reprint_grace_days"
          - "stale_listing_count recomputed"
          - "Brand.open_reprint_obligation_count incremented by 1 and Brand.compliance_posture recomputed"
      - from: REPRINT_REQUIRED
        to: OVERDUE
        trigger: "POST /_clock/set_current_utc advancing the logical clock past reprint_deadline"
        actor: system
        preconditions: ["publication_status == PUBLISHED", "reprint_deadline < the new logical clock"]
        side_effects:
          - "Brand.overdue_board_count incremented by 1"
          - "Brand.compliance_posture recomputed (RESTRICTED -> FROZEN)"
      - from: REPRINT_REQUIRED
        to: CURRENT
        trigger: "POST /menu-boards/{id}/reprint"
        actor: MenuboardPublisher
        preconditions: ["acting X-User-ID == MenuBoard.establishment_id", "publication_status == PUBLISHED", "stale_listing_count >= 1"]
        side_effects:
          - "CASCADE hop 1: every STALE MenuBoardListing of the board returns to LISTED with declared_min_snapshot / declared_max_snapshot / display_calorie_text rebuilt from the items' current declarations"
          - "CASCADE hop 2 (caused by hop 1): each affected MenuItem with no remaining STALE listing returns labeling_status RELABEL_REQUIRED -> DECLARED"
          - "CASCADE hop 3 (caused by hops 1-2): Brand.open_reprint_obligation_count decremented by 1 and Brand.compliance_posture recomputed"
          - "reprint_deadline cleared, reprint_count incremented by 1, stale_listing_count reset to 0"
      - from: OVERDUE
        to: CURRENT
        trigger: "POST /menu-boards/{id}/reprint"
        actor: MenuboardPublisher
        preconditions: ["acting X-User-ID == MenuBoard.establishment_id", "publication_status == PUBLISHED", "stale_listing_count >= 1"]
        side_effects:
          - "same three cascade hops as REPRINT_REQUIRED -> CURRENT"
          - "Brand.overdue_board_count decremented by 1 and Brand.compliance_posture recomputed (FROZEN -> RESTRICTED or FROZEN -> COMPLIANT)"
        note: "Reprint cycle: CURRENT -> REPRINT_REQUIRED -> OVERDUE -> CURRENT."

  - entity: MenuBoardListing
    state_field: listing_status
    initial_state: LISTED
    terminal_states: [REMOVED]
    transitions:
      - from: LISTED
        to: STALE
        trigger: "system: the listed MenuItem entered labeling_status RELABEL_REQUIRED"
        actor: system
        preconditions: ["the board's publication_status == PUBLISHED"]
        side_effects: ["MenuBoard.stale_listing_count recomputed"]
      - from: STALE
        to: LISTED
        trigger: "POST /menu-boards/{id}/reprint, or the compensation cascade of POST /recipes/{id}/withdraw-certification"
        actor: MenuboardPublisher
        preconditions: ["the board's publication_status == PUBLISHED"]
        side_effects: ["display_calorie_text and both snapshots rebuilt from the item's current declaration"]
        note: "Listing cycle: LISTED -> STALE -> LISTED."
      - from: LISTED
        to: REMOVED
        trigger: "system: the holding MenuBoard reached publication_status WITHDRAWN"
        actor: system
        preconditions: ["MenuBoard.publication_status == WITHDRAWN"]
        side_effects: ["MenuBoard.listing_count recomputed"]
      - from: STALE
        to: REMOVED
        trigger: "system: the holding MenuBoard reached publication_status WITHDRAWN"
        actor: system
        preconditions: ["MenuBoard.publication_status == WITHDRAWN"]
        side_effects: ["MenuBoard.listing_count and stale_listing_count recomputed", "Brand.open_reprint_obligation_count decremented once for the board"]

  - entity: DisclosurePacket
    state_field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /disclosure-packets/{id}/publish"
        actor: BrandComplianceOfficer
        preconditions:
          - "acting X-User-ID == DisclosurePacket.brand_id"
          - "allergen_matrix_complete == true"
          - "cross_contact_statement is non-empty whenever cross_contact_statement_required == true"
          - "written_info_channels has at least one entry"
        side_effects:
          - "published_at set to the logical clock; Brand.has_published_disclosure_packet set to true"
          - "any other DisclosurePacket of the brand with status IN {PUBLISHED, STALE} transitions to SUPERSEDED"
      - from: PUBLISHED
        to: STALE
        trigger: "system: a recipe certification changed a covered item's allergen_groups / cross_contact_groups, or an exemption review changed the brand's standard_item_count"
        actor: system
        preconditions:
          - "one of exactly two staleness triggers fired: a CERTIFY decision changed the allergen_groups or cross_contact_groups recorded in allergen_rows for a covered item, or an exemption review flipped a covered item's labeling_exempt"
          - "creating a new MenuItem or a new Establishment does NOT stale a published packet; the matrix is not re-derived outside those two triggers"
        side_effects: ["Brand.has_published_disclosure_packet set to false", "POST /menu-boards/{id}/publish is blocked for the brand until a fresh packet is published"]
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system: a newer DisclosurePacket of the same brand was published"
        actor: system
        preconditions: ["the newer packet reached PUBLISHED"]
        side_effects: ["DisclosurePacket.version incremented by 1"]
      - from: STALE
        to: SUPERSEDED
        trigger: "system: a newer DisclosurePacket of the same brand was published"
        actor: system
        preconditions: ["the newer packet reached PUBLISHED"]
        side_effects: ["DisclosurePacket.version incremented by 1"]

  - entity: VarianceRequest
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [DENIED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /variance-requests/{id}/decision with decision OPEN_REVIEW"
        actor: StateRegulator
        preconditions: ["acting X-User-ID == VarianceRequest.jurisdiction_id"]
        side_effects: ["decided_by_user_id and decision_note recorded"]
      - from: UNDER_REVIEW
        to: GRANTED
        trigger: "POST /variance-requests/{id}/decision with decision GRANTED"
        actor: StateRegulator
        preconditions:
          - "acting X-User-ID == VarianceRequest.jurisdiction_id"
          - "Jurisdiction.preemption_mode == VARIANCE_ALLOWED"
          - "effective_start_date <= effective_end_date"
          - "no other VarianceRequest of the same (brand_id, jurisdiction_id, requirement_code) with status == GRANTED has a closed covered interval whose effective_end_date + 7 days reaches effective_start_date"
        side_effects:
          - "effective_start_date / effective_end_date written from the decision payload, defaulting to requested_start_date / requested_end_date when omitted"
          - "any EnforcementAction of the brand's establishments in this jurisdiction whose citation maps to requirement_code can no longer be escalated while the covered interval contains the logical clock's date"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /variance-requests/{id}/decision with decision DENIED"
        actor: StateRegulator
        preconditions: ["acting X-User-ID == VarianceRequest.jurisdiction_id"]
        side_effects: ["decision_note recorded; effective_start_date and effective_end_date stay null"]
      - from: GRANTED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc advancing the logical clock past effective_end_date"
        actor: system
        preconditions: ["effective_end_date < the calendar date of the new logical clock"]
        side_effects: ["the variance stops shielding citations, so escalation of matching EnforcementAction rows becomes possible again"]

  - entity: EnforcementAction
    state_field: status
    initial_state: OPEN
    terminal_states: [CLOSED_COMPLIANT, CLOSED_PENALTY]
    transitions:
      - from: OPEN
        to: RESPONSE_SUBMITTED
        trigger: "POST /enforcement-actions/{id}/responses"
        actor: BrandComplianceOfficer
        preconditions:
          - "acting X-User-ID == the cited establishment's brand_id"
          - "the brand has a DisclosurePacket with status == PUBLISHED"
          - "when response_type == REPRINT_COMPLETED, the cited establishment's outstanding_penalty_cents == 0"
        side_effects: ["response_count incremented by 1", "last_response_type recorded"]
      - from: INFO_REQUESTED
        to: RESPONSE_SUBMITTED
        trigger: "POST /enforcement-actions/{id}/responses"
        actor: BrandComplianceOfficer
        preconditions: ["acting X-User-ID == the cited establishment's brand_id", "the brand has a DisclosurePacket with status == PUBLISHED", "when response_type == REPRINT_COMPLETED, outstanding_penalty_cents == 0"]
        side_effects: ["response_count incremented by 1", "last_response_type recorded"]
        note: "Information cycle: RESPONSE_SUBMITTED -> INFO_REQUESTED -> RESPONSE_SUBMITTED."
      - from: RESPONSE_SUBMITTED
        to: INFO_REQUESTED
        trigger: "POST /enforcement-actions/{id}/regulator-actions with action_type REQUEST_INFO"
        actor: StateRegulator
        preconditions: ["acting X-User-ID == EnforcementAction.jurisdiction_id"]
        side_effects: ["info_round_count incremented by 1"]
      - from: RESPONSE_SUBMITTED
        to: ESCALATED
        trigger: "POST /enforcement-actions/{id}/regulator-actions with action_type ESCALATE"
        actor: StateRegulator
        preconditions:
          - "acting X-User-ID == EnforcementAction.jurisdiction_id"
          - "info_round_count >= 1"
          - "no VarianceRequest of the cited brand in this jurisdiction with status == GRANTED and requirement_code mapping to citation_code covers the logical clock's calendar date"
        side_effects: ["Brand.open_enforcement_escalated_count incremented by 1", "Brand.compliance_posture recomputed to FROZEN"]
      - from: RESPONSE_SUBMITTED
        to: CLOSED_COMPLIANT
        trigger: "POST /enforcement-actions/{id}/regulator-actions with action_type CLOSE_COMPLIANT"
        actor: StateRegulator
        preconditions: ["acting X-User-ID == EnforcementAction.jurisdiction_id", "last_response_type IN {REPRINT_COMPLETED, VARIANCE_CITED}"]
        side_effects: ["closed_at set to the logical clock"]
      - from: ESCALATED
        to: PENALTY_ASSESSED
        trigger: "POST /enforcement-actions/{id}/regulator-actions with action_type ASSESS_PENALTY"
        actor: StateRegulator
        preconditions: ["acting X-User-ID == EnforcementAction.jurisdiction_id", "penalty_basis supplied in the request"]
        side_effects:
          - "calculations.enforcement_penalty_assessment writes violation_unit_count, base_penalty_cents, admin_fee_cents and penalty_total_cents"
          - "Establishment.outstanding_penalty_cents increased by penalty_total_cents"
          - "Jurisdiction.assessed_penalty_cents_total increased by penalty_total_cents"
          - "Brand.open_enforcement_escalated_count decremented by 1 and Brand.compliance_posture recomputed"
      - from: PENALTY_ASSESSED
        to: RESPONSE_SUBMITTED
        trigger: "POST /enforcement-actions/{id}/regulator-actions with action_type RESCIND_PENALTY"
        actor: StateRegulator
        preconditions: ["acting X-User-ID == EnforcementAction.jurisdiction_id"]
        side_effects:
          - "COMPENSATION: Establishment.outstanding_penalty_cents and Jurisdiction.assessed_penalty_cents_total each decreased by exactly penalty_total_cents"
          - "penalty_basis, violation_unit_count, base_penalty_cents and admin_fee_cents cleared to null and penalty_total_cents reset to 0"
        note: "Penalty cycle: RESPONSE_SUBMITTED -> ESCALATED -> PENALTY_ASSESSED -> RESPONSE_SUBMITTED."
      - from: PENALTY_ASSESSED
        to: CLOSED_PENALTY
        trigger: "POST /enforcement-actions/{id}/regulator-actions with action_type CLOSE_PENALTY"
        actor: StateRegulator
        preconditions: ["acting X-User-ID == EnforcementAction.jurisdiction_id"]
        side_effects: ["closed_at set to the logical clock", "the penalty stays on both ledgers (status remains inside the assessed set)"]

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: recipe-create-stale-menu-item
    parent_entity: MenuItem
    write_endpoint: "POST /menu-items/{id}/recipes"
    occ_field: "expected_menu_item_version"
    description: |
      Creating a new Recipe version for a MenuItem whose version has advanced
      since the client last observed it is rejected. A new recipe version
      legitimately supersedes the item's prior certified declaration once it is
      certified, so a writer holding a stale view of the item would otherwise
      branch the version chain from an outdated baseline.
    error_id: ERR_STALE_MENU_ITEM_VERSION
    http_status: 412
  - rule_id: packet-create-stale-brand
    parent_entity: Brand
    write_endpoint: "POST /brands/{id}/disclosure-packets"
    occ_field: "expected_brand_version"
    description: |
      Creating a DisclosurePacket against a Brand whose version has advanced
      since the client last observed it is rejected. Publishing a packet
      legitimately supersedes the brand's prior published packet, so a writer
      whose view of the brand predates the latest allergen-affecting mutation
      would publish a matrix synthesized from an outdated item set.
    error_id: ERR_STALE_BRAND_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules
# =============================================================================
calculations:
  - name: covered_establishment_determination
    description: |
      Decides whether a Brand is a covered establishment under the menu labeling
      program. Two variants of the same determination diverge on identical data
      because they disagree about which units count: the OPERATING_ONLY variant
      counts only unit_status == OPERATING, while the REGISTERED_ALL variant also
      counts unit_status == TEMPORARILY_CLOSED. Both write coverage_status,
      coverage_reason, counted_unit_count and standard_item_count.
    trigger: "POST /brands/{id}/coverage-determinations, and automatically (always on the OPERATING_ONLY basis) after POST /establishments, POST /brands/{id}/establishment-batches, POST /establishments/{id}/status-changes, POST /menu-items and POST /menu-items/{id}/exemption-reviews"
    inputs:
      - "Establishment rows of the brand with operates_under_brand_name == true, filtered by unit_status per the chosen basis"
      - "MenuItem rows of the brand with labeling_exempt == false"
    algorithm: threshold
    formula: |
      # variant OPERATING_ONLY
      counted_unit_count =
        count(Establishment
              where brand_id == brand.id
                and unit_status == OPERATING
                and operates_under_brand_name == true)

      # variant REGISTERED_ALL
      counted_unit_count =
        count(Establishment
              where brand_id == brand.id
                and unit_status IN {OPERATING, TEMPORARILY_CLOSED}
                and operates_under_brand_name == true)

      # PLANNED and PERMANENTLY_CLOSED units, and units with
      # operates_under_brand_name == false, are excluded under both bases.

      standard_item_count =
        count(MenuItem
              where brand_id == brand.id
                and labeling_exempt == false)

      # shared decision, applied to whichever counted_unit_count the basis produced
      if standard_item_count == 0:
          coverage_status = NOT_COVERED
          coverage_reason = NO_STANDARD_MENU_ITEMS
      elif counted_unit_count >= COVERED_UNIT_THRESHOLD:
          coverage_status = COVERED
          coverage_reason = COVERED_BY_UNIT_COUNT
      else:
          coverage_status = NOT_COVERED
          coverage_reason = BELOW_UNIT_THRESHOLD
      # The zero-item branch outranks the unit branch, so a 20-unit brand with no
      # non-exempt item reports NO_STANDARD_MENU_ITEMS, never BELOW_UNIT_THRESHOLD.
    constants:
      COVERED_UNIT_THRESHOLD: 20
    precision: "integer counts; no rounding"
    variants:
      - name: OPERATING_ONLY
        when: "POST /brands/{id}/coverage-determinations with basis == OPERATING_ONLY, and every automatic re-determination"
        difference: "Counts only OPERATING units. A brand with 19 OPERATING units and 1 TEMPORARILY_CLOSED unit counts 19 and is NOT_COVERED with reason BELOW_UNIT_THRESHOLD."
      - name: REGISTERED_ALL
        when: "POST /brands/{id}/coverage-determinations with basis == REGISTERED_ALL"
        difference: "Also counts TEMPORARILY_CLOSED units. The same 19+1 brand counts 20 and is COVERED with reason COVERED_BY_UNIT_COUNT."

  - name: base_item_calorie_declaration
    description: |
      Computes the declared calorie figure for a MenuItem whose recipe has no
      choice groups (variable_type == NONE). The order of operations is pinned:
      component calories are summed at full precision first and the FDA
      declaration rounding is applied exactly once to the total. Rounding each
      component before summing yields a different number and is wrong.
    trigger: "POST /recipes/{id}/components (recomputes Recipe.computed_* fields) and POST /nutrition-analyses/{id}/decision with decision CERTIFY (copies onto the MenuItem)"
    inputs:
      - "RecipeComponent rows of the recipe with role == BASE"
    algorithm: aggregation
    formula: |
      component_calories(c)   = c.grams * c.calories_per_100g / 100      # 2 dp, ROUND_HALF_UP
      computed_base_calories  = sum(component_calories(c)
                                    for c in components where role == BASE)  # 2 dp

      declare(x):                                    # FDA declaration rounding
        if x < DECLARE_ZERO_CEILING:      return 0
        if x <= DECLARE_NEAREST_5_CEILING: return round_half_up(x / 5) * 5
        return round_half_up(x / 10) * 10

      computed_declared_min = declare(computed_base_calories)
      computed_declared_max = computed_declared_min
      # Mandatory order: sum at full precision, then declare() once.
      # Counter-example: two components of 2.60 cal each sum to 5.20 and declare
      # to 5; declaring each component first gives 0 + 0 = 0.
    constants:
      DECLARE_ZERO_CEILING: 5
      DECLARE_NEAREST_5_CEILING: 50
    precision: "component_calories and the sum at 2 decimal places, ROUND_HALF_UP; declare() returns an integer"

  - name: variable_item_calorie_range
    description: |
      Computes the declared calorie range for a variable MenuItem. The recipe's
      non-BASE components are partitioned into choice groups; each group's
      selection_mode and selection_limit determine the minimum and maximum
      calorie contribution the group can add. The range endpoints are the
      declared minimum and maximum after a single declare() application each.
    trigger: "POST /recipes/{id}/components and POST /nutrition-analyses/{id}/decision with decision CERTIFY"
    inputs:
      - "RecipeComponent rows of the recipe, partitioned by choice_group"
      - "MenuItem.variable_type"
    algorithm: combinatorial_bounds
    formula: |
      base_sum = sum(component_calories(c) for c in components where role == BASE)

      for each choice_group g (components with role == CHOICE, ordered by
          component_calories DESC, then created_at ASC):
        n = g.selection_limit
        if g.selection_mode == EXACTLY_ONE:
            g.min = min(component_calories(c) for c in g)
            g.max = max(component_calories(c) for c in g)
        if g.selection_mode == UP_TO_N:
            g.min = 0
            g.max = sum of the n largest component_calories in g
                    (fewer than n members -> sum of all members)
        if g.selection_mode == UNLIMITED:
            g.min = 0
            g.max = max(component_calories(c) for c in g) * UNLIMITED_REPEAT_CAP

      raw_min = base_sum + sum(g.min for all groups)
      raw_max = base_sum + sum(g.max for all groups)

      computed_declared_min = declare(raw_min)
      computed_declared_max = declare(raw_max)
      display_calorie_text  = "{min} Cal"           if min == max
                              "{min}-{max} Cal"     otherwise
      # declare() is applied to raw_min and raw_max, never to individual groups.
    constants:
      UNLIMITED_REPEAT_CAP: 3
    precision: "component sums at 2 decimal places, ROUND_HALF_UP; declared endpoints are integers"
    variants:
      - name: TOPPING_BASED
        when: "MenuItem.variable_type == TOPPING_BASED"
        difference: "Choice groups are optional add-ons, so every group contributes min 0 and the declared minimum equals declare(base_sum)."
      - name: COMBINATION_MEAL
        when: "MenuItem.variable_type == COMBINATION_MEAL"
        difference: "Each choice group is EXACTLY_ONE, so every group contributes its cheapest member to the minimum; the declared minimum strictly exceeds declare(base_sum) whenever any group's cheapest member is non-zero."

  - name: temporary_item_exemption_days
    description: |
      Decides whether a MenuItem qualifies for the temporary / test item
      exemption. Offer windows are inclusive calendar intervals that must be
      merged before counting: overlapping and adjacent windows collapse into one
      span, so the cumulative day count is not the naive sum of window lengths.
    trigger: "POST /menu-items/{id}/exemption-reviews, and automatically after POST /menu-items/{id}/offer-windows"
    inputs:
      - "MenuItem.offer_windows entries whose start_date falls in the reviewed review_year"
    algorithm: interval_merge
    formula: |
      windows = offer_windows of the item with start_date year == review_year,
                sorted by start_date ASC, then end_date ASC

      merged = []
      for w in windows:
        if merged is empty or w.start_date > merged.last.end_date + 1 day:
            append a copy of w to merged            # disjoint with a real gap
        else:
            merged.last.end_date = max(merged.last.end_date, w.end_date)
        # adjacency rule: a window starting exactly one day after the previous
        # window ends merges into it; a two-day gap does not.

      cumulative_offered_days = sum(end_date - start_date + 1 for m in merged)

      labeling_exempt = false if item_class == STANDARD
                        true  if item_class IN {DAILY_SPECIAL, CUSTOM_ORDER,
                                                SELF_SERVICE}
                        (cumulative_offered_days < EXEMPTION_DAY_LIMIT)
                              if item_class IN {TEMPORARY, TEST_MARKET}
      # STANDARD is never exempt and DAILY_SPECIAL / CUSTOM_ORDER / SELF_SERVICE
      # are always exempt, both regardless of the day count; only TEMPORARY and
      # TEST_MARKET depend on the merged total.
      labeling_status = NOT_REQUIRED        when labeling_exempt flips to true
                        DECLARATION_PENDING when it flips to false and the item
                                            has no APPROVED recipe
                        DECLARED            when it flips to false and the item
                                            already has an APPROVED recipe
    constants:
      EXEMPTION_DAY_LIMIT: 60
    precision: "whole calendar days, inclusive of both endpoints"

  - name: reprint_obligation_and_deadline
    description: |
      Decides whether certifying a new recipe version forces a menu reprint, and
      when the reprint is due. The tolerance is a floating band around the
      previously declared minimum: a delta at or above the band triggers the
      obligation, a delta strictly below it does not.
    trigger: "POST /nutrition-analyses/{id}/decision with decision CERTIFY"
    inputs:
      - "MenuItem.declared_calorie_max before the certification"
      - "Recipe.computed_declared_max of the newly certified recipe"
      - "the establishments' Jurisdiction.reprint_grace_days for every published board listing the item"
    algorithm: threshold
    formula: |
      prior_max = MenuItem.declared_calorie_max      # null on first certification
      new_max   = Recipe.computed_declared_max

      if prior_max is null:
          reprint_required = false                   # first declaration
      else:
          delta     = abs(new_max - prior_max)
          tolerance = max(TOLERANCE_FLOOR_CALORIES,
                          round_half_up(prior_max * TOLERANCE_FRACTION))   # integer
          reprint_required = delta >= tolerance      # at the band, reprint IS required

      if reprint_required:
          MenuItem.labeling_status = RELABEL_REQUIRED
          every LISTED MenuBoardListing of the item on a PUBLISHED board -> STALE
          each affected MenuBoard.calorie_compliance_status -> REPRINT_REQUIRED
          MenuBoard.reprint_deadline = current logical clock
                                       + Jurisdiction.reprint_grace_days days
          # reprint_grace_days is 30 when the jurisdiction's extra_requirement is
          # NONE and 14 otherwise, so two boards of the same brand in two
          # jurisdictions receive different deadlines from one certification.
    constants:
      TOLERANCE_FLOOR_CALORIES: 20
      TOLERANCE_FRACTION: 0.20
      GRACE_DAYS_NO_EXTRA_REQUIREMENT: 30
      GRACE_DAYS_WITH_EXTRA_REQUIREMENT: 14
    precision: "tolerance rounded to a whole calorie, ROUND_HALF_UP; deadlines at whole-day granularity in UTC"

  - name: allergen_matrix_synthesis
    description: |
      Builds a DisclosurePacket's allergen matrix from the currently certified
      recipes of the brand's covered items, and decides whether a cross-contact
      statement is mandatory.
    trigger: "POST /brands/{id}/disclosure-packets and POST /disclosure-packets/{id}/publish"
    inputs:
      - "MenuItem rows of the brand with labeling_exempt == false"
      - "the APPROVED Recipe of each such item and its RecipeComponent rows"
    algorithm: aggregation
    formula: |
      matrix_items = MenuItem rows of the brand with labeling_exempt == false,
                     ordered by name ASC
      covered_item_count = count(MenuItem rows of the brand
                                 where labeling_exempt == false
                                   and the item has a Recipe with status APPROVED)

      for each item i in matrix_items:
        allergen_rows += {
          menu_item_id: i.id,
          allergen_groups:      alphabetically ascending distinct
                                component.allergen_group over the item's APPROVED
                                recipe components, excluding NONE,
          cross_contact_groups: alphabetically ascending distinct
                                component.allergen_group over the same components
                                where cross_contact_risk != NONE, excluding NONE
        }
      # Sets are alphabetically sorted so the matrix is deterministic.

      allergen_matrix_complete =
          covered_item_count >= MIN_COVERED_ITEMS_FOR_PACKET
          and covered_item_count == Brand.standard_item_count

      cross_contact_statement_required =
          any component of any APPROVED recipe of a non-exempt item of the brand
          has cross_contact_risk != NONE
    constants:
      MIN_COVERED_ITEMS_FOR_PACKET: 1
    precision: "exact set membership; no numeric rounding"

  - name: enforcement_penalty_assessment
    description: |
      Computes the money owed on an escalated EnforcementAction. Two variants
      differ in what the violation unit is; both then apply the same tier-based
      administrative fee, and the fee tier is selected from the base penalty
      sum, never from the fee-inclusive total.
    trigger: "POST /enforcement-actions/{id}/regulator-actions with action_type ASSESS_PENALTY"
    inputs:
      - "penalty_basis from the request"
      - "the cited Establishment and its PUBLISHED MenuBoard rows with calorie_compliance_status IN {REPRINT_REQUIRED, OVERDUE}"
      - "Jurisdiction.enforcement_tier of the citing jurisdiction"
    algorithm: tiered_pricing
    formula: |
      # variant PER_BOARD
      violation_unit_count = count(MenuBoard
                                   where establishment_id == action.establishment_id
                                     and publication_status == PUBLISHED
                                     and calorie_compliance_status IN
                                         {REPRINT_REQUIRED, OVERDUE})
      # variant PER_ESTABLISHMENT
      violation_unit_count = 1

      tier_multiplier = ENHANCED_MULTIPLIER if Jurisdiction.enforcement_tier
                                               == ENHANCED
                        1                   otherwise   # FEDERAL_ALIGNED
      base_penalty_cents = round_half_up(BASE_VIOLATION_CENTS
                                         * violation_unit_count
                                         * tier_multiplier)          # whole cents

      # Fee tier is chosen from base_penalty_cents.
      fee_rate = FEE_RATE_TIER_1 if base_penalty_cents <= FEE_TIER_1_CEILING_CENTS
                 FEE_RATE_TIER_2 if base_penalty_cents <= FEE_TIER_2_CEILING_CENTS
                 FEE_RATE_TIER_3 otherwise
      admin_fee_cents   = round_half_up(base_penalty_cents * fee_rate)
      penalty_total_cents = base_penalty_cents + admin_fee_cents

      Establishment.outstanding_penalty_cents += penalty_total_cents
      Jurisdiction.assessed_penalty_cents_total += penalty_total_cents
    constants:
      BASE_VIOLATION_CENTS: 50000
      ENHANCED_MULTIPLIER: 1.5
      FEE_TIER_1_CEILING_CENTS: 100000
      FEE_TIER_2_CEILING_CENTS: 250000
      FEE_RATE_TIER_1: 0.05
      FEE_RATE_TIER_2: 0.08
      FEE_RATE_TIER_3: 0.12
    precision: "all money in whole cents, ROUND_HALF_UP; the multiplier is applied before the fee, and the fee tier is read off base_penalty_cents"
    variants:
      - name: PER_BOARD
        when: "penalty_basis == PER_BOARD"
        difference: "One violation unit per non-current published board. Three such boards in an ENHANCED jurisdiction give base 225000, fee tier 2 (8%) = 18000, total 243000."
      - name: PER_ESTABLISHMENT
        when: "penalty_basis == PER_ESTABLISHMENT"
        difference: "Exactly one violation unit regardless of board count. The same establishment gives base 75000, fee tier 1 (5%) = 3750, total 78750 — a different tier from the same data."

  - name: declared_sodium_rounding
    description: |
      Computes the declared sodium figure that drives the jurisdictional sodium
      warning icon. Sodium uses its own rounding ladder, distinct from the
      calorie declaration ladder, and is likewise applied once to the summed
      total.
    trigger: "POST /recipes/{id}/components and POST /nutrition-analyses/{id}/decision with decision CERTIFY"
    inputs:
      - "RecipeComponent rows of the recipe"
      - "Jurisdiction.sodium_warning_threshold_mg of each listing establishment's jurisdiction"
    algorithm: threshold
    formula: |
      component_sodium_mg(c) = c.grams * c.sodium_mg_per_100g / 100    # 2 dp
      raw_sodium = sum(component_sodium_mg(c) for c in components where role == BASE)

      declare_sodium(x):
        if x < SODIUM_ZERO_CEILING:       return 0
        if x <= SODIUM_NEAREST_5_CEILING: return round_half_up(x / 5) * 5
        return round_half_up(x / 10) * 10

      computed_sodium_mg = declare_sodium(raw_sodium)

      # icon requirement, evaluated per listing at publish time
      icon_required = Jurisdiction.extra_requirement == SODIUM_WARNING
                      and MenuItem.declared_sodium_mg
                          >= Jurisdiction.sodium_warning_threshold_mg
      # at the threshold the icon IS required
    constants:
      SODIUM_ZERO_CEILING: 5
      SODIUM_NEAREST_5_CEILING: 140
    precision: "component sums at 2 decimal places, ROUND_HALF_UP; the declared figure is an integer number of milligrams"

# =============================================================================
# §1.4 Validation Rules — evaluated strictly in ascending `priority` order.
# The first violated rule short-circuits the request; no later rule is consulted.
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID header present and non-empty"
    error_id: ERR_MISSING_AUTH
    http_status: 401
    applies_to: "all"
    description: "A missing, absent-valued or empty-string X-User-ID is rejected before anything else, including before the role header is examined."
  - priority: 2
    category: auth
    check: "X-User-Role header present and equal to one of PlatformAdmin, BrandComplianceOfficer, NutritionAnalyst, MenuboardPublisher, StateRegulator"
    error_id: ERR_INVALID_ROLE
    http_status: 401
    applies_to: "all"
    description: "An unknown or empty role string is rejected before endpoint authorization, so an unknown role never yields ERR_UNAUTHORIZED."
  - priority: 3
    category: auth
    check: "the role is listed in the endpoint's authorized_roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
    description: "Endpoint-level RBAC. Checked before ownership scoping, so a wrong-role caller on someone else's resource gets ERR_UNAUTHORIZED, not ERR_FORBIDDEN_SCOPE."
  - priority: 4
    category: auth
    check: "for an entity_backed role, X-User-ID equals the id of the entity the write targets (Brand for BrandComplianceOfficer, Establishment for MenuboardPublisher, Jurisdiction for StateRegulator)"
    error_id: ERR_FORBIDDEN_SCOPE
    http_status: 403
    applies_to: "all writes; reads are open to every known role and are never ownership-scoped"
    description: "Ownership scoping. A BrandComplianceOfficer acting for brand A cannot mutate brand B's resources; a MenuboardPublisher may only touch boards of its own establishment; a StateRegulator may only decide variances and enforcement in its own jurisdiction."
  - priority: 5
    category: business_constraint
    check: "request body is well-formed: every required field present, every field of the declared type, every enum value inside its domain, integers non-negative where declared, decimals within their stated precision"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all writes"
    description: "Schema validation runs after authorization and before any existence lookup, so a malformed body against a non-existent path id yields ERR_VALIDATION."
  - priority: 6
    category: business_constraint
    check: "limit within [1, 100] and offset >= 0 when supplied"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"
    description: "limit defaults to 10 and offset to 0. limit == 0, limit == 101 and a negative offset are rejected; limit == 1 and limit == 100 are accepted."
  - priority: 7
    category: existence
    check: "every templated path id resolves to an existing row"
    error_id: "ERR_BRAND_NOT_FOUND | ERR_JURISDICTION_NOT_FOUND | ERR_ESTABLISHMENT_NOT_FOUND | ERR_MENU_ITEM_NOT_FOUND | ERR_RECIPE_NOT_FOUND | ERR_NUTRITION_ANALYSIS_NOT_FOUND | ERR_MENU_BOARD_NOT_FOUND | ERR_DISCLOSURE_PACKET_NOT_FOUND | ERR_VARIANCE_REQUEST_NOT_FOUND | ERR_ENFORCEMENT_ACTION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a templated path segment"
    description: "The entity-specific not-found error for the path resource, chosen by the resource type in the path."
  - priority: 8
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row"
    error_id: "the entity-specific NOT_FOUND error of the referenced entity"
    http_status: 404
    applies_to: "POST /establishments, POST /brands/{id}/establishment-batches, POST /menu-items, POST /menu-boards, POST /menu-boards/{id}/listings, POST /variance-requests, POST /enforcement-actions"
    description: "Body foreign keys are resolved after the path resource, so a bad body FK on a bad path id yields the path resource's error."
  - priority: 9
    category: state
    check: "the supplied expected_<parent>_version equals the parent's current version"
    error_id: "ERR_STALE_MENU_ITEM_VERSION | ERR_STALE_BRAND_VERSION"
    http_status: 412
    applies_to: "POST /menu-items/{id}/recipes, POST /brands/{id}/disclosure-packets"
    description: "Optimistic concurrency on the parent row, per §1.2.1. Evaluated after existence and before any state precondition, so a stale version against an already-terminal parent yields the 412."
  - priority: 10
    category: state
    check: "the targeted row is not in a terminal state for the state field the request would move"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all transition endpoints"
    description: "Terminal lockdown: SUPERSEDED recipes and packets, WITHDRAWN boards, REMOVED listings, DENIED and EXPIRED variances, CLOSED_COMPLIANT and CLOSED_PENALTY enforcement actions, and PERMANENTLY_CLOSED establishments accept no further transitions."
  - priority: 11
    category: state
    check: "the MenuBoard's publication_status == DRAFT"
    error_id: ERR_BOARD_NOT_DRAFT
    http_status: 409
    applies_to: "POST /menu-boards/{id}/listings, POST /menu-boards/{id}/publish"
    description: "Listings may only be attached to, and publication may only be requested for, a DRAFT board. Re-publishing a PUBLISHED board fails here before any window-overlap arithmetic runs."
  - priority: 12
    category: state
    check: "the Recipe's status == DRAFT"
    error_id: ERR_RECIPE_NOT_DRAFT
    http_status: 409
    applies_to: "POST /recipes/{id}/components, POST /recipes/{id}/submit-for-analysis"
    description: "Components may only be added while the recipe is DRAFT, and only a DRAFT recipe may be submitted for analysis."
  - priority: 13
    category: state
    check: "the NutritionAnalysis status == SUBMITTED"
    error_id: ERR_ANALYSIS_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /nutrition-analyses/{id}/decision"
    description: "A second decision on an already CERTIFIED or REJECTED analysis is refused."
  - priority: 14
    category: state
    check: "the Recipe's status == APPROVED"
    error_id: ERR_RECIPE_NOT_APPROVED
    http_status: 409
    applies_to: "POST /recipes/{id}/withdraw-certification"
    description: "Only the currently approved recipe version may have its certification withdrawn."
  - priority: 15
    category: state
    check: "the EnforcementAction is in a state from which the requested action_type or response is defined, and CLOSE_COMPLIANT additionally requires last_response_type IN {REPRINT_COMPLETED, VARIANCE_CITED}"
    error_id: ERR_ACTION_STATE_INVALID
    http_status: 409
    applies_to: "POST /enforcement-actions/{id}/responses, POST /enforcement-actions/{id}/regulator-actions"
    description: "ESCALATE requires RESPONSE_SUBMITTED, ASSESS_PENALTY requires ESCALATED, RESCIND_PENALTY and CLOSE_PENALTY require PENALTY_ASSESSED, CLOSE_COMPLIANT requires RESPONSE_SUBMITTED, REQUEST_INFO requires RESPONSE_SUBMITTED, and a brand response requires OPEN or INFO_REQUESTED."
  - priority: 16
    category: state
    check: "the VarianceRequest is in the state the requested decision expects"
    error_id: ERR_VARIANCE_STATE_INVALID
    http_status: 409
    applies_to: "POST /variance-requests/{id}/decision"
    description: "OPEN_REVIEW requires SUBMITTED; GRANTED and DENIED require UNDER_REVIEW, so a regulator cannot grant straight from SUBMITTED."
  - priority: 17
    category: state
    check: "the DisclosurePacket's status == DRAFT"
    error_id: ERR_PACKET_NOT_DRAFT
    http_status: 409
    applies_to: "POST /disclosure-packets/{id}/publish"
    description: "Publishing an already PUBLISHED or STALE packet is refused; a fresh packet must be created instead."
  - priority: 18
    category: business_safety
    check: "the deciding NutritionAnalyst's X-User-ID differs from NutritionAnalysis.submitted_by_user_id when the decision is CERTIFY"
    error_id: ERR_SAME_USER_CERTIFICATION
    http_status: 403
    applies_to: "POST /nutrition-analyses/{id}/decision"
    description: "Segregation of duties: the analyst who submitted a recipe for analysis may not certify it. REJECT by the same user is permitted."
  - priority: 19
    category: business_safety
    check: "the owning Brand's compliance_posture != FROZEN"
    error_id: ERR_BRAND_POSTURE_FROZEN
    http_status: 409
    applies_to: "POST /menu-boards, POST /menu-boards/{id}/listings, POST /menu-boards/{id}/publish, POST /menu-items, POST /menu-items/{id}/recipes"
    description: "A frozen brand — one with an overdue board or an escalated enforcement action — cannot expand its menu or its board estate. POST /menu-boards/{id}/reprint and enforcement responses stay open so the brand can recover."
  - priority: 20
    category: business_referential
    check: "the owning Brand's coverage_status == COVERED"
    error_id: ERR_BRAND_NOT_COVERED
    http_status: 409
    applies_to: "POST /brands/{id}/disclosure-packets, POST /menu-boards/{id}/publish"
    description: "Calorie declarations and allergen packets are only required, and only accepted, from covered establishments."
  - priority: 21
    category: business_referential
    check: "the listed MenuItem's brand_id equals the board's establishment's brand_id"
    error_id: ERR_ITEM_BRAND_MISMATCH
    http_status: 409
    applies_to: "POST /menu-boards/{id}/listings"
    description: "A board cannot list another brand's menu item even when both brands are covered."
  - priority: 22
    category: business_constraint
    check: "the (menu_board_id, menu_item_id) pair is not already listed with listing_status IN {LISTED, STALE}"
    error_id: ERR_DUPLICATE_LISTING
    http_status: 409
    applies_to: "POST /menu-boards/{id}/listings"
    description: "Uniqueness of a live listing per board and item. A REMOVED listing does not block a re-listing."
  - priority: 23
    category: business_constraint
    check: "choice-group metadata is internally consistent: role == CHOICE requires a non-null choice_group and selection_mode; role == BASE forbids all three choice fields; selection_mode == UP_TO_N requires selection_limit >= 1; EXACTLY_ONE and UNLIMITED forbid selection_limit; every component of one choice_group declares the same selection_mode and selection_limit"
    error_id: ERR_CHOICE_GROUP_INCONSISTENT
    http_status: 400
    applies_to: "POST /recipes/{id}/components"
    description: "Conditional field validation whose applicability depends on the component's role and on the components already stored in the same choice group."
  - priority: 24
    category: business_constraint
    check: "the Recipe has at least one component with role == BASE"
    error_id: ERR_RECIPE_HAS_NO_BASE_COMPONENT
    http_status: 409
    applies_to: "POST /recipes/{id}/submit-for-analysis"
    description: "A recipe with no base component has no computable base calorie figure, so it cannot enter analysis."
  - priority: 25
    category: business_safety
    check: "the Brand has a DisclosurePacket with status == PUBLISHED"
    error_id: ERR_NO_PUBLISHED_PACKET
    http_status: 409
    applies_to: "POST /menu-boards/{id}/publish, POST /enforcement-actions/{id}/responses"
    description: "Written nutrition and allergen information must be on file before a menu board goes live or a brand answers a citation."
  - priority: 26
    category: business_safety
    check: "the referenced DisclosurePacket's allergen_matrix_complete == true"
    error_id: ERR_ALLERGEN_MATRIX_INCOMPLETE
    http_status: 409
    applies_to: "POST /disclosure-packets/{id}/publish, POST /menu-boards/{id}/publish"
    description: "Evaluated against the stored allergen_matrix_complete flag of the packet, which is computed when the packet is created and refreshed at packet publication — not re-derived at board publication."
  - priority: 27
    category: business_safety
    check: "cross_contact_statement is non-empty whenever the packet's cross_contact_statement_required == true"
    error_id: ERR_CROSS_CONTACT_STATEMENT_REQUIRED
    http_status: 409
    applies_to: "POST /disclosure-packets/{id}/publish"
    description: "Conditional requirement: only packets whose synthesized matrix contains at least one cross-contact group need the statement."
  - priority: 28
    category: business_safety
    check: "MenuBoard.succinct_statement_variant equals the establishment's jurisdiction's required_succinct_statement_variant, unless a GRANTED VarianceRequest for requirement_code SUCCINCT_STATEMENT covers effective_from"
    error_id: ERR_SUCCINCT_STATEMENT_MISMATCH
    http_status: 409
    applies_to: "POST /menu-boards/{id}/publish"
    description: "State and local labeling variance: the succinct statement wording is dictated by the jurisdiction and only a granted variance releases the brand from it. Checked before any per-listing declaration check."
  - priority: 29
    category: business_safety
    check: "every listing whose item's declared_sodium_mg >= the jurisdiction's sodium_warning_threshold_mg carries sodium_warning_icon == true, when the jurisdiction's extra_requirement == SODIUM_WARNING"
    error_id: ERR_SODIUM_WARNING_ICON_REQUIRED
    http_status: 409
    applies_to: "POST /menu-boards/{id}/publish"
    description: "Aggregate conditional check across the board's listings; inapplicable when the jurisdiction has no sodium requirement. At exactly the threshold the icon is required."
  - priority: 30
    category: business_referential
    check: "every listed MenuItem has labeling_status IN {DECLARED, RELABEL_REQUIRED} with declared_calorie_max != null, or labeling_exempt == true"
    error_id: ERR_ITEM_CALORIES_UNDECLARED
    http_status: 409
    applies_to: "POST /menu-boards/{id}/publish"
    description: "A board may not go live carrying an item that has never had a certified calorie declaration. Exempt temporary and test items are allowed with no declaration."
  - priority: 31
    category: business_temporal
    check: "start <= end on every supplied date pair (offer windows, requested variance windows, decided variance windows, board display windows with a non-null effective_to)"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 400
    applies_to: "POST /menu-items/{id}/offer-windows, POST /variance-requests, POST /variance-requests/{id}/decision, POST /menu-boards/{id}/publish"
    description: "Ordering of a single range is checked before any comparison against other rows' ranges."
  - priority: 32
    category: business_temporal
    check: "the requested display window does not overlap the window of another PUBLISHED MenuBoard of the same establishment_id and board_type"
    error_id: ERR_BOARD_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /menu-boards/{id}/publish"
    description: "Board display windows are half-open [effective_from, effective_to); a null effective_to is open-ended. A window starting exactly at another window's effective_to is accepted."
  - priority: 33
    category: business_referential
    check: "the target Jurisdiction's preemption_mode == VARIANCE_ALLOWED"
    error_id: ERR_VARIANCE_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /variance-requests/{id}/decision"
    description: "A jurisdiction with preemption_mode PREEMPTED may open a review and deny, but may not grant."
  - priority: 34
    category: business_temporal
    check: "the granted window's effective_start_date is more than VARIANCE_COOLING_DAYS after the effective_end_date of every other GRANTED VarianceRequest for the same (brand_id, jurisdiction_id, requirement_code)"
    error_id: ERR_VARIANCE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /variance-requests/{id}/decision"
    description: "Variance windows are inclusive closed intervals separated by a 7-day cooling buffer, deliberately unlike the half-open, buffer-free board display windows."
  - priority: 35
    category: business_constraint
    check: "EnforcementAction.info_round_count >= 1"
    error_id: ERR_INFO_ROUND_REQUIRED
    http_status: 409
    applies_to: "POST /enforcement-actions/{id}/regulator-actions with action_type ESCALATE"
    description: "A regulator must request information at least once before escalating."
  - priority: 36
    category: business_referential
    check: "no GRANTED VarianceRequest of the cited brand in the citing jurisdiction whose requirement_code maps to the action's citation_code covers the current logical date"
    error_id: ERR_CITATION_SHIELDED_BY_VARIANCE
    http_status: 409
    applies_to: "POST /enforcement-actions/{id}/regulator-actions with action_type ESCALATE"
    description: "Cross-aggregate shield. The citation-to-requirement map is fixed: SUCCINCT_STATEMENT_MISSING -> SUCCINCT_STATEMENT, SODIUM_WARNING_MISSING -> SODIUM_WARNING, WRITTEN_INFO_UNAVAILABLE -> WRITTEN_INFO_FORMAT; CALORIES_NOT_DECLARED and ALLERGEN_MATRIX_MISSING map to no requirement_code and can never be shielded. A granted variance blocks escalation while it is in force and stops blocking once the clock pushes it to EXPIRED."
  - priority: 39
    category: business_fiscal
    check: "the cited Establishment's outstanding_penalty_cents == 0"
    error_id: ERR_OUTSTANDING_PENALTY
    http_status: 402
    applies_to: "POST /enforcement-actions/{id}/responses with response_type REPRINT_COMPLETED"
    description: "A brand cannot certify a reprint as complete for a unit that still owes an assessed penalty; rescinding the penalty clears the block."
  - priority: 40
    category: business_constraint
    check: "MenuBoard.stale_listing_count >= 1"
    error_id: ERR_NO_STALE_LISTINGS
    http_status: 409
    applies_to: "POST /menu-boards/{id}/reprint"
    description: "Reprinting a board with nothing stale on it is refused, so reprint_count cannot be inflated."
  - priority: 41
    category: business_constraint
    check: "MenuItem.item_class IN {TEMPORARY, TEST_MARKET}"
    error_id: ERR_ITEM_NOT_TEMPORARY
    http_status: 409
    applies_to: "POST /menu-items/{id}/exemption-reviews, POST /menu-items/{id}/offer-windows"
    description: "Only temporary and test-market items carry offer windows and can be reviewed for the exemption; a STANDARD item is refused."
  - priority: 42
    category: state
    check: "no EnforcementAction of the target Establishment has status IN {OPEN, RESPONSE_SUBMITTED, INFO_REQUESTED, ESCALATED, PENALTY_ASSESSED} when new_unit_status == PERMANENTLY_CLOSED"
    error_id: ERR_UNIT_HAS_OPEN_ENFORCEMENT
    http_status: 409
    applies_to: "POST /establishments/{id}/status-changes"
    description: "A unit cannot be closed out of the register while a live citation is pending against it; the enforcement file must reach CLOSED_COMPLIANT or CLOSED_PENALTY first. Only the PERMANENTLY_CLOSED target is gated — TEMPORARILY_CLOSED and OPERATING moves stay open."

# =============================================================================
# §1.5 API Endpoints
# `input:` lists request-body fields for writes and query parameters for reads;
# a trailing `?` marks the field optional. Every read is open to all five roles
# and is never ownership-scoped; ownership scoping applies to writes only.
# =============================================================================
endpoints:
  # ---------------------------------------------------------------- reads ----
  - method: GET
    path: /brands/{id}
    description: "Fetch one Brand with its derived coverage and posture fields."
    roles: [PlatformAdmin, BrandComplianceOfficer, NutritionAnalyst, MenuboardPublisher, StateRegulator]
    input: []
    output: Brand
    success_code: 200
    side_effects: []
  - method: GET
    path: /brands/{id}/compliance-summary
    description: "Computed read: the brand's coverage determination and posture inputs in one object, recomputed on read from current rows."
    roles: [PlatformAdmin, BrandComplianceOfficer, NutritionAnalyst, MenuboardPublisher, StateRegulator]
    input: []
    output: "{ brand_id: string, coverage_status: string, coverage_reason: string, counted_unit_count: integer, standard_item_count: integer, compliance_posture: string, open_reprint_obligation_count: integer, overdue_board_count: integer, open_enforcement_escalated_count: integer, has_published_disclosure_packet: boolean, outstanding_penalty_cents_total: integer }"
    success_code: 200
    side_effects: []
  - method: GET
    path: /brands/{id}/disclosure-packets
    description: "List the brand's disclosure packets, newest packet_version first."
    roles: [PlatformAdmin, BrandComplianceOfficer, NutritionAnalyst, MenuboardPublisher, StateRegulator]
    input: ["status?", "limit?", "offset?"]
    output: DisclosurePacket[]
    success_code: 200
    side_effects: []
  - method: GET
    path: /brands/{id}/variance-requests
    description: "List the brand's variance requests across all jurisdictions, created_at ASC."
    roles: [PlatformAdmin, BrandComplianceOfficer, NutritionAnalyst, MenuboardPublisher, StateRegulator]
    input: ["status?", "requirement_code?", "limit?", "offset?"]
    output: VarianceRequest[]
    success_code: 200
    side_effects: []
  - method: GET
    path: /jurisdictions/{id}
    description: "Fetch one Jurisdiction with its derived reprint_grace_days and penalty ledger."
    roles: [PlatformAdmin, BrandComplianceOfficer, NutritionAnalyst, MenuboardPublisher, StateRegulator]
    input: []
    output: Jurisdiction
    success_code: 200
    side_effects: []
  - method: GET
    path: /jurisdictions/{id}/variance-requests
    description: "List variance requests filed with this jurisdiction, created_at ASC."
    roles: [PlatformAdmin, BrandComplianceOfficer, NutritionAnalyst, MenuboardPublisher, StateRegulator]
    input: ["status?", "brand_id?", "limit?", "offset?"]
    output: VarianceRequest[]
    success_code: 200
    side_effects: []
  - method: GET
    path: /jurisdictions/{id}/enforcement-actions
    description: "List enforcement actions opened by this jurisdiction, created_at ASC."
    roles: [PlatformAdmin, BrandComplianceOfficer, NutritionAnalyst, MenuboardPublisher, StateRegulator]
    input: ["status?", "limit?", "offset?"]
    output: EnforcementAction[]
    success_code: 200
    side_effects: []
  - method: GET
    path: /establishments/{id}
    description: "Fetch one Establishment with its board count and outstanding penalty balance."
    roles: [PlatformAdmin, BrandComplianceOfficer, NutritionAnalyst, MenuboardPublisher, StateRegulator]
    input: []
    output: Establishment
    success_code: 200
    side_effects: []
  - method: GET
    path: /establishments
    description: "Filtered, paginated list of establishments; created_at ASC."
    roles: [PlatformAdmin, BrandComplianceOfficer, NutritionAnalyst, MenuboardPublisher, StateRegulator]
    input: ["brand_id?", "jurisdiction_id?", "unit_status?", "limit?", "offset?"]
    output: Establishment[]
    success_code: 200
    side_effects: []
  - method: GET
    path: /establishments/{id}/enforcement-actions
    description: "List enforcement actions citing this unit, created_at ASC."
    roles: [PlatformAdmin, BrandComplianceOfficer, NutritionAnalyst, MenuboardPublisher, StateRegulator]
    input: ["status?", "limit?", "offset?"]
    output: EnforcementAction[]
    success_code: 200
    side_effects: []
  - method: GET
    path: /menu-items/{id}
    description: "Fetch one MenuItem with its declared calorie range, sodium figure and allergen sets."
    roles: [PlatformAdmin, BrandComplianceOfficer, NutritionAnalyst, MenuboardPublisher, StateRegulator]
    input: []
    output: MenuItem
    success_code: 200
    side_effects: []
  - method: GET
    path: /menu-items
    description: "Filtered, paginated list of menu items; created_at ASC."
    roles: [PlatformAdmin, BrandComplianceOfficer, NutritionAnalyst, MenuboardPublisher, StateRegulator]
    input: ["brand_id?", "item_class?", "labeling_status?", "limit?", "offset?"]
    output: MenuItem[]
    success_code: 200
    side_effects: []
  - method: GET
    path: /menu-items/{id}/listings
    description: "List every board line that prints this item, created_at ASC."
    roles: [PlatformAdmin, BrandComplianceOfficer, NutritionAnalyst, MenuboardPublisher, StateRegulator]
    input: ["listing_status?", "limit?", "offset?"]
    output: MenuBoardListing[]
    success_code: 200
    side_effects: []
  - method: GET
    path: /recipes/{id}
    description: "Fetch one Recipe version with its computed calorie and sodium figures."
    roles: [PlatformAdmin, BrandComplianceOfficer, NutritionAnalyst, MenuboardPublisher, StateRegulator]
    input: []
    output: Recipe
    success_code: 200
    side_effects: []
  - method: GET
    path: /recipes
    description: "Filtered, paginated list of recipe versions; created_at ASC. supersedes_recipe_id walks the self-referential version chain."
    roles: [PlatformAdmin, BrandComplianceOfficer, NutritionAnalyst, MenuboardPublisher, StateRegulator]
    input: ["menu_item_id?", "supersedes_recipe_id?", "status?", "limit?", "offset?"]
    output: Recipe[]
    success_code: 200
    side_effects: []
  - method: GET
    path: /recipes/{id}/components
    description: "List the recipe's components with their per-component calorie and sodium contributions, created_at ASC."
    roles: [PlatformAdmin, BrandComplianceOfficer, NutritionAnalyst, MenuboardPublisher, StateRegulator]
    input: ["role?", "choice_group?", "limit?", "offset?"]
    output: RecipeComponent[]
    success_code: 200
    side_effects: []
  - method: GET
    path: /recipes/{id}/nutrition-analyses
    description: "List the analyses raised against this recipe version, created_at ASC."
    roles: [PlatformAdmin, BrandComplianceOfficer, NutritionAnalyst, MenuboardPublisher, StateRegulator]
    input: ["status?", "limit?", "offset?"]
    output: NutritionAnalysis[]
    success_code: 200
    side_effects: []
  - method: GET
    path: /nutrition-analyses/{id}
    description: "Fetch one NutritionAnalysis with its submitter, decider and declared figures."
    roles: [PlatformAdmin, BrandComplianceOfficer, NutritionAnalyst, MenuboardPublisher, StateRegulator]
    input: []
    output: NutritionAnalysis
    success_code: 200
    side_effects: []
  - method: GET
    path: /menu-boards/{id}
    description: "Fetch one MenuBoard with both of its state dimensions, its display window and its reprint deadline."
    roles: [PlatformAdmin, BrandComplianceOfficer, NutritionAnalyst, MenuboardPublisher, StateRegulator]
    input: []
    output: MenuBoard
    success_code: 200
    side_effects: []
  - method: GET
    path: /menu-boards
    description: "Filtered, paginated list of boards; created_at ASC."
    roles: [PlatformAdmin, BrandComplianceOfficer, NutritionAnalyst, MenuboardPublisher, StateRegulator]
    input: ["establishment_id?", "board_type?", "publication_status?", "calorie_compliance_status?", "limit?", "offset?"]
    output: MenuBoard[]
    success_code: 200
    side_effects: []
  - method: GET
    path: /menu-boards/{id}/listings
    description: "List the board's lines with their calorie snapshots and display text, created_at ASC."
    roles: [PlatformAdmin, BrandComplianceOfficer, NutritionAnalyst, MenuboardPublisher, StateRegulator]
    input: ["listing_status?", "limit?", "offset?"]
    output: MenuBoardListing[]
    success_code: 200
    side_effects: []
  - method: GET
    path: /disclosure-packets/{id}
    description: "Fetch one DisclosurePacket with its synthesized allergen matrix."
    roles: [PlatformAdmin, BrandComplianceOfficer, NutritionAnalyst, MenuboardPublisher, StateRegulator]
    input: []
    output: DisclosurePacket
    success_code: 200
    side_effects: []
  - method: GET
    path: /variance-requests/{id}
    description: "Fetch one VarianceRequest with its requested and decided windows."
    roles: [PlatformAdmin, BrandComplianceOfficer, NutritionAnalyst, MenuboardPublisher, StateRegulator]
    input: []
    output: VarianceRequest
    success_code: 200
    side_effects: []
  - method: GET
    path: /enforcement-actions/{id}
    description: "Fetch one EnforcementAction with its response counters and money breakdown."
    roles: [PlatformAdmin, BrandComplianceOfficer, NutritionAnalyst, MenuboardPublisher, StateRegulator]
    input: []
    output: EnforcementAction
    success_code: 200
    side_effects: []

  # --------------------------------------------------------------- writes ----
  - method: POST
    path: /brands
    description: "Register a chain brand. Starts NOT_COVERED with posture COMPLIANT."
    roles: [PlatformAdmin]
    input: ["legal_name", "doing_business_as?"]
    output: Brand
    success_code: 201
    side_effects: ["coverage_status seeded to NOT_COVERED with coverage_reason NO_STANDARD_MENU_ITEMS"]
  - method: POST
    path: /jurisdictions
    description: "Register a state or local authority and its labeling regime."
    roles: [PlatformAdmin]
    input: ["code", "name", "preemption_mode", "extra_requirement?", "enforcement_tier?", "sodium_warning_threshold_mg?", "required_succinct_statement_variant?"]
    output: Jurisdiction
    success_code: 201
    side_effects: ["reprint_grace_days derived from extra_requirement (30 for NONE, 14 otherwise)"]
  - method: POST
    path: /establishments
    description: "Register one unit of a brand in a jurisdiction."
    roles: [PlatformAdmin, BrandComplianceOfficer]
    input: ["brand_id", "jurisdiction_id", "unit_label", "unit_status?", "operates_under_brand_name?"]
    output: Establishment
    success_code: 201
    side_effects: ["Brand coverage re-determined on the OPERATING_ONLY basis", "Brand.version incremented"]
  - method: POST
    path: /brands/{id}/establishment-batches
    description: "Bulk-register unit_count identical units of the brand in one jurisdiction, so a covered estate can be built without one call per unit."
    roles: [PlatformAdmin, BrandComplianceOfficer]
    input: ["jurisdiction_id", "unit_count", "unit_status?", "operates_under_brand_name?", "unit_label_prefix?"]
    output: "{ brand_id: string, created_count: integer, unit_status: string, first_created_establishment_id: string, brand_coverage_status: string, brand_counted_unit_count: integer }"
    success_code: 201
    side_effects: ["created_count Establishment rows created in created_at ASC order with labels <unit_label_prefix>-0001..", "Brand coverage re-determined once after the whole batch", "Brand.version incremented once"]
  - method: POST
    path: /establishments/{id}/status-changes
    description: "Move a unit between PLANNED, OPERATING, TEMPORARILY_CLOSED and PERMANENTLY_CLOSED."
    roles: [PlatformAdmin, BrandComplianceOfficer]
    input: ["new_unit_status", "effective_note?"]
    output: Establishment
    success_code: 200
    side_effects: ["Brand coverage re-determined", "on PERMANENTLY_CLOSED: the board and listing cascade of §1.2 runs and the brand's reprint obligation counters are adjusted"]
  - method: POST
    path: /menu-items
    description: "Add a menu item to a brand's menu."
    roles: [BrandComplianceOfficer]
    input: ["brand_id", "name", "item_class", "variable_type?", "first_offered_on"]
    output: MenuItem
    success_code: 201
    side_effects: ["labeling_exempt and labeling_status seeded from item_class (STANDARD -> false / DECLARATION_PENDING; every other class -> true / NOT_REQUIRED)", "Brand coverage re-determined on the OPERATING_ONLY basis", "Brand.version incremented"]
  - method: POST
    path: /menu-items/{id}/offer-windows
    description: "Append an inclusive offer window to a temporary or test-market item and recount its cumulative offered days."
    roles: [BrandComplianceOfficer]
    input: ["start_date", "end_date"]
    output: MenuItem
    success_code: 200
    side_effects: ["offer_windows appended", "cumulative_offered_days recomputed by the interval-merge calculation"]
  - method: POST
    path: /menu-items/{id}/exemption-reviews
    description: "Re-evaluate the temporary / test item exemption for one review year."
    roles: [BrandComplianceOfficer]
    input: ["review_year"]
    output: MenuItem
    success_code: 200
    side_effects: ["labeling_exempt and labeling_status updated", "Brand coverage re-determined", "any PUBLISHED DisclosurePacket of the brand becomes STALE when the flag flipped"]
  - method: POST
    path: /menu-items/{id}/recipes
    description: "Open a new DRAFT recipe version for the item. OCC-guarded on the item's version."
    roles: [NutritionAnalyst]
    input: ["expected_menu_item_version", "change_note"]
    output: Recipe
    success_code: 201
    side_effects: ["version_no set to the item's highest version_no + 1", "revision_round seeded to 0"]
  - method: POST
    path: /recipes/{id}/components
    description: "Add a base or choice component to a DRAFT recipe and recompute the recipe's figures."
    roles: [NutritionAnalyst]
    input: ["component_name", "role", "grams", "calories_per_100g", "sodium_mg_per_100g", "added_sugar_g_per_100g?", "allergen_group?", "cross_contact_risk?", "choice_group?", "selection_mode?", "selection_limit?"]
    output: RecipeComponent
    success_code: 201
    side_effects: ["component_calories and component_sodium_mg computed", "Recipe.component_count, computed_base_calories, computed_declared_min, computed_declared_max and computed_sodium_mg recomputed"]
  - method: POST
    path: /recipes/{id}/submit-for-analysis
    description: "Send a DRAFT recipe into nutrition analysis, creating the PENDING NutritionAnalysis record."
    roles: [NutritionAnalyst]
    input: ["method"]
    output: NutritionAnalysis
    success_code: 201
    side_effects: ["Recipe.status DRAFT -> ANALYSIS_PENDING", "submitted_by_user_id recorded from X-User-ID"]
  - method: POST
    path: /nutrition-analyses/{id}/decision
    description: "Certify or reject a pending analysis. CERTIFY runs the four-hop certification cascade."
    roles: [NutritionAnalyst]
    input: ["decision", "decision_note?"]
    output: NutritionAnalysis
    success_code: 200
    side_effects:
      - "REJECT: Recipe.status -> DRAFT with revision_round incremented"
      - "CERTIFY hop 1: Recipe.status -> APPROVED, any prior APPROVED recipe of the item -> SUPERSEDED and recorded in supersedes_recipe_id"
      - "CERTIFY hop 2: the MenuItem's declared calorie range, sodium figure, allergen sets and approved_recipe_version_no are refreshed"
      - "CERTIFY hop 3: the reprint-obligation calculation may set labeling_status RELABEL_REQUIRED and stale every affected published listing"
      - "CERTIFY hop 4: each affected MenuBoard moves to REPRINT_REQUIRED with a jurisdiction-specific deadline, and Brand.open_reprint_obligation_count and compliance_posture are recomputed"
      - "any PUBLISHED DisclosurePacket of the brand becomes STALE when the allergen sets changed"
  - method: POST
    path: /recipes/{id}/withdraw-certification
    description: "Compensating action: undo a certification, restoring the superseded version and reversing every hop of the certification cascade."
    roles: [NutritionAnalyst]
    input: ["reason"]
    output: Recipe
    success_code: 200
    side_effects:
      - "Recipe.status APPROVED -> SUPERSEDED and the recipe named by supersedes_recipe_id returns SUPERSEDED -> APPROVED"
      - "the MenuItem's declarations are restored from the reinstated recipe"
      - "listings staled by this certification return to LISTED with rebuilt snapshots; boards return to CURRENT with reprint_deadline cleared"
      - "Brand.open_reprint_obligation_count and overdue_board_count are decremented back to their pre-certification values and compliance_posture is recomputed"
  - method: POST
    path: /brands/{id}/coverage-determinations
    description: "Run a covered-establishment determination on demand under an explicit basis and persist the result."
    roles: [PlatformAdmin, BrandComplianceOfficer]
    input: ["basis"]
    output: "{ brand_id: string, basis: string, counted_unit_count: integer, standard_item_count: integer, coverage_status: string, coverage_reason: string, persisted: boolean }"
    success_code: 200
    side_effects: ["Brand.coverage_status, coverage_reason, counted_unit_count and standard_item_count overwritten with the chosen variant's result", "Brand.version incremented"]
  - method: POST
    path: /brands/{id}/disclosure-packets
    description: "Draft a new allergen / written-nutrition packet from the brand's current covered items. OCC-guarded on the brand's version."
    roles: [BrandComplianceOfficer]
    input: ["expected_brand_version", "cross_contact_statement", "written_info_channels"]
    output: DisclosurePacket
    success_code: 201
    side_effects: ["allergen_rows synthesized", "covered_item_count, allergen_matrix_complete and cross_contact_statement_required computed", "packet_version set to the brand's highest packet_version + 1"]
  - method: POST
    path: /disclosure-packets/{id}/publish
    description: "Publish a DRAFT packet, superseding the brand's previous packet."
    roles: [BrandComplianceOfficer]
    input: []
    output: DisclosurePacket
    success_code: 200
    side_effects: ["status DRAFT -> PUBLISHED with published_at stamped", "the brand's previous PUBLISHED or STALE packet -> SUPERSEDED", "Brand.has_published_disclosure_packet set to true"]
  - method: POST
    path: /menu-boards
    description: "Create a DRAFT menu board or menu-board panel for one unit."
    roles: [MenuboardPublisher]
    input: ["establishment_id", "board_type", "succinct_statement_variant"]
    output: MenuBoard
    success_code: 201
    side_effects: ["publication_status DRAFT and calorie_compliance_status CURRENT seeded independently", "Establishment.board_count recomputed"]
  - method: POST
    path: /menu-boards/{id}/listings
    description: "Print a menu item on a DRAFT board."
    roles: [MenuboardPublisher]
    input: ["menu_item_id", "sodium_warning_icon?"]
    output: MenuBoardListing
    success_code: 201
    side_effects: ["display_calorie_text and both declaration snapshots captured from the item", "MenuBoard.listing_count recomputed"]
  - method: POST
    path: /menu-boards/{id}/publish
    description: "Take a DRAFT board live over a half-open display window."
    roles: [MenuboardPublisher]
    input: ["effective_from", "effective_to?"]
    output: MenuBoard
    success_code: 200
    side_effects: ["publication_status DRAFT -> PUBLISHED", "every listing's snapshots and display text refreshed", "Establishment.board_count recomputed"]
  - method: POST
    path: /menu-boards/{id}/reprint
    description: "Record a reprint of a published board, clearing its stale listings and the brand's obligation."
    roles: [MenuboardPublisher]
    input: ["reprint_note?"]
    output: MenuBoard
    success_code: 200
    side_effects: ["calorie_compliance_status REPRINT_REQUIRED or OVERDUE -> CURRENT with the three-hop cascade of §1.2", "reprint_count incremented, reprint_deadline cleared, stale_listing_count reset"]
  - method: POST
    path: /variance-requests
    description: "Ask a jurisdiction for relief from one labeling requirement over a closed date interval."
    roles: [BrandComplianceOfficer]
    input: ["brand_id", "jurisdiction_id", "requirement_code", "justification", "requested_start_date", "requested_end_date"]
    output: VarianceRequest
    success_code: 201
    side_effects: ["status seeded to SUBMITTED; effective dates stay null until a decision"]
  - method: POST
    path: /variance-requests/{id}/decision
    description: "Open review, grant or deny a variance request."
    roles: [StateRegulator]
    input: ["decision", "decision_note?", "effective_start_date?", "effective_end_date?"]
    output: VarianceRequest
    success_code: 200
    side_effects: ["GRANTED: the effective window is written and immediately shields matching citations from escalation", "DENIED: terminal with null effective dates"]
  - method: POST
    path: /enforcement-actions
    description: "Open a citation against one unit."
    roles: [StateRegulator]
    input: ["establishment_id", "citation_code", "inspection_note?"]
    output: EnforcementAction
    success_code: 201
    side_effects: ["jurisdiction_id copied from the cited establishment", "status OPEN with zeroed counters and money fields", "opened_at stamped from the logical clock"]
  - method: POST
    path: /enforcement-actions/{id}/responses
    description: "File the brand's response to a citation."
    roles: [BrandComplianceOfficer]
    input: ["response_type", "response_note?"]
    output: EnforcementAction
    success_code: 200
    side_effects: ["status OPEN or INFO_REQUESTED -> RESPONSE_SUBMITTED", "response_count incremented and last_response_type recorded"]
  - method: POST
    path: /enforcement-actions/{id}/regulator-actions
    description: "Regulator-side move on a citation: request more information, escalate, assess or rescind a penalty, or close."
    roles: [StateRegulator]
    input: ["action_type", "penalty_basis?", "action_note?"]
    output: EnforcementAction
    success_code: 200
    side_effects:
      - "REQUEST_INFO: info_round_count incremented"
      - "ESCALATE: Brand.open_enforcement_escalated_count incremented and posture recomputed to FROZEN"
      - "ASSESS_PENALTY: the penalty calculation writes the money breakdown and adds it to the establishment and jurisdiction ledgers"
      - "RESCIND_PENALTY: both ledgers are reduced by exactly penalty_total_cents and the money fields are cleared"
      - "CLOSE_COMPLIANT / CLOSE_PENALTY: closed_at stamped"
  - method: POST
    path: /_clock/set_current_utc
    description: "Set the server's logical UTC clock. Default value at process start is 2026-08-01T00:00:00Z. Advancing the clock sweeps reprint deadlines and variance expiries."
    roles: [PlatformAdmin]
    input: ["to_iso8601"]
    output: "{ current_utc: string, boards_marked_overdue: integer, variances_expired: integer }"
    success_code: 200
    side_effects: ["every PUBLISHED board with calorie_compliance_status REPRINT_REQUIRED and reprint_deadline < the new clock moves to OVERDUE, incrementing Brand.overdue_board_count and freezing the brand", "every GRANTED VarianceRequest whose effective_end_date is before the new date moves to EXPIRED"]

# =============================================================================
# §1.6 Error Catalog — every id is reachable from at least one §1.8/§1.9 instance
# =============================================================================
errors:
  - id: ERR_MISSING_AUTH
    http_status: 401
    condition: "X-User-ID header absent or empty"
    applies_to: ["all endpoints"]
  - id: ERR_INVALID_ROLE
    http_status: 401
    condition: "X-User-Role header absent, empty, or not one of the five known roles"
    applies_to: ["all endpoints"]
  - id: ERR_UNAUTHORIZED
    http_status: 403
    condition: "the known role is not in the endpoint's authorized roles"
    applies_to: ["all endpoints"]
  - id: ERR_FORBIDDEN_SCOPE
    http_status: 403
    condition: "an entity_backed role targets a resource outside the entity its X-User-ID names"
    applies_to: ["all write endpoints"]
  - id: ERR_VALIDATION
    http_status: 400
    condition: "missing required body field, wrong type, unknown enum value, negative quantity, or malformed date"
    applies_to: ["all write endpoints"]
  - id: ERR_INVALID_PAGINATION
    http_status: 400
    condition: "limit outside [1, 100] or negative offset"
    applies_to: ["all list endpoints"]
  - id: ERR_BRAND_NOT_FOUND
    http_status: 404
    condition: "no Brand with the given id"
    applies_to: ["GET /brands/{id}", "GET /brands/{id}/compliance-summary", "GET /brands/{id}/disclosure-packets", "GET /brands/{id}/variance-requests", "POST /brands/{id}/establishment-batches", "POST /brands/{id}/coverage-determinations", "POST /brands/{id}/disclosure-packets", "POST /establishments", "POST /menu-items", "POST /variance-requests"]
  - id: ERR_JURISDICTION_NOT_FOUND
    http_status: 404
    condition: "no Jurisdiction with the given id"
    applies_to: ["GET /jurisdictions/{id}", "GET /jurisdictions/{id}/variance-requests", "GET /jurisdictions/{id}/enforcement-actions", "POST /establishments", "POST /brands/{id}/establishment-batches", "POST /variance-requests"]
  - id: ERR_ESTABLISHMENT_NOT_FOUND
    http_status: 404
    condition: "no Establishment with the given id"
    applies_to: ["GET /establishments/{id}", "GET /establishments/{id}/enforcement-actions", "POST /establishments/{id}/status-changes", "POST /menu-boards", "POST /enforcement-actions"]
  - id: ERR_MENU_ITEM_NOT_FOUND
    http_status: 404
    condition: "no MenuItem with the given id"
    applies_to: ["GET /menu-items/{id}", "GET /menu-items/{id}/listings", "POST /menu-items/{id}/offer-windows", "POST /menu-items/{id}/exemption-reviews", "POST /menu-items/{id}/recipes", "POST /menu-boards/{id}/listings"]
  - id: ERR_RECIPE_NOT_FOUND
    http_status: 404
    condition: "no Recipe with the given id"
    applies_to: ["GET /recipes/{id}", "GET /recipes/{id}/components", "GET /recipes/{id}/nutrition-analyses", "POST /recipes/{id}/components", "POST /recipes/{id}/submit-for-analysis", "POST /recipes/{id}/withdraw-certification"]
  - id: ERR_NUTRITION_ANALYSIS_NOT_FOUND
    http_status: 404
    condition: "no NutritionAnalysis with the given id"
    applies_to: ["GET /nutrition-analyses/{id}", "POST /nutrition-analyses/{id}/decision"]
  - id: ERR_MENU_BOARD_NOT_FOUND
    http_status: 404
    condition: "no MenuBoard with the given id"
    applies_to: ["GET /menu-boards/{id}", "GET /menu-boards/{id}/listings", "POST /menu-boards/{id}/listings", "POST /menu-boards/{id}/publish", "POST /menu-boards/{id}/reprint"]
  - id: ERR_DISCLOSURE_PACKET_NOT_FOUND
    http_status: 404
    condition: "no DisclosurePacket with the given id"
    applies_to: ["GET /disclosure-packets/{id}", "POST /disclosure-packets/{id}/publish"]
  - id: ERR_VARIANCE_REQUEST_NOT_FOUND
    http_status: 404
    condition: "no VarianceRequest with the given id"
    applies_to: ["GET /variance-requests/{id}", "POST /variance-requests/{id}/decision"]
  - id: ERR_ENFORCEMENT_ACTION_NOT_FOUND
    http_status: 404
    condition: "no EnforcementAction with the given id"
    applies_to: ["GET /enforcement-actions/{id}", "POST /enforcement-actions/{id}/responses", "POST /enforcement-actions/{id}/regulator-actions"]
  - id: ERR_STALE_MENU_ITEM_VERSION
    http_status: 412
    condition: "expected_menu_item_version does not equal the MenuItem's current version"
    applies_to: ["POST /menu-items/{id}/recipes"]
  - id: ERR_STALE_BRAND_VERSION
    http_status: 412
    condition: "expected_brand_version does not equal the Brand's current version"
    applies_to: ["POST /brands/{id}/disclosure-packets"]
  - id: ERR_ALREADY_TERMINAL
    http_status: 409
    condition: "the target row is already in a terminal state for the state field the request would move"
    applies_to: ["all transition endpoints"]
  - id: ERR_BOARD_NOT_DRAFT
    http_status: 409
    condition: "MenuBoard.publication_status != DRAFT"
    applies_to: ["POST /menu-boards/{id}/listings", "POST /menu-boards/{id}/publish"]
  - id: ERR_RECIPE_NOT_DRAFT
    http_status: 409
    condition: "Recipe.status != DRAFT"
    applies_to: ["POST /recipes/{id}/components", "POST /recipes/{id}/submit-for-analysis"]
  - id: ERR_ANALYSIS_ALREADY_DECIDED
    http_status: 409
    condition: "NutritionAnalysis.status != SUBMITTED"
    applies_to: ["POST /nutrition-analyses/{id}/decision"]
  - id: ERR_RECIPE_NOT_APPROVED
    http_status: 409
    condition: "Recipe.status != APPROVED"
    applies_to: ["POST /recipes/{id}/withdraw-certification"]
  - id: ERR_ACTION_STATE_INVALID
    http_status: 409
    condition: "the EnforcementAction is not in a state from which the requested response or regulator action is defined, or CLOSE_COMPLIANT is requested while last_response_type is DISPUTED"
    applies_to: ["POST /enforcement-actions/{id}/responses", "POST /enforcement-actions/{id}/regulator-actions"]
  - id: ERR_VARIANCE_STATE_INVALID
    http_status: 409
    condition: "the VarianceRequest is not in the state the requested decision expects"
    applies_to: ["POST /variance-requests/{id}/decision"]
  - id: ERR_PACKET_NOT_DRAFT
    http_status: 409
    condition: "DisclosurePacket.status != DRAFT"
    applies_to: ["POST /disclosure-packets/{id}/publish"]
  - id: ERR_SAME_USER_CERTIFICATION
    http_status: 403
    condition: "the certifying analyst is the analyst who submitted the recipe for analysis"
    applies_to: ["POST /nutrition-analyses/{id}/decision"]
  - id: ERR_BRAND_POSTURE_FROZEN
    http_status: 409
    condition: "Brand.compliance_posture == FROZEN"
    applies_to: ["POST /menu-items", "POST /menu-items/{id}/recipes", "POST /menu-boards", "POST /menu-boards/{id}/listings", "POST /menu-boards/{id}/publish"]
  - id: ERR_BRAND_NOT_COVERED
    http_status: 409
    condition: "Brand.coverage_status != COVERED"
    applies_to: ["POST /brands/{id}/disclosure-packets", "POST /menu-boards/{id}/publish"]
  - id: ERR_ITEM_BRAND_MISMATCH
    http_status: 409
    condition: "the listed MenuItem belongs to a different brand than the board's establishment"
    applies_to: ["POST /menu-boards/{id}/listings"]
  - id: ERR_DUPLICATE_LISTING
    http_status: 409
    condition: "the item is already listed on the board with listing_status LISTED or STALE"
    applies_to: ["POST /menu-boards/{id}/listings"]
  - id: ERR_CHOICE_GROUP_INCONSISTENT
    http_status: 400
    condition: "choice-group metadata contradicts the component's role or the components already stored in the same choice group"
    applies_to: ["POST /recipes/{id}/components"]
  - id: ERR_RECIPE_HAS_NO_BASE_COMPONENT
    http_status: 409
    condition: "the recipe has no component with role BASE"
    applies_to: ["POST /recipes/{id}/submit-for-analysis"]
  - id: ERR_NO_PUBLISHED_PACKET
    http_status: 409
    condition: "the brand has no DisclosurePacket in status PUBLISHED"
    applies_to: ["POST /menu-boards/{id}/publish", "POST /enforcement-actions/{id}/responses"]
  - id: ERR_ALLERGEN_MATRIX_INCOMPLETE
    http_status: 409
    condition: "the packet's allergen_matrix_complete is false"
    applies_to: ["POST /disclosure-packets/{id}/publish", "POST /menu-boards/{id}/publish"]
  - id: ERR_CROSS_CONTACT_STATEMENT_REQUIRED
    http_status: 409
    condition: "cross_contact_statement is empty while the packet's cross_contact_statement_required is true"
    applies_to: ["POST /disclosure-packets/{id}/publish"]
  - id: ERR_SUCCINCT_STATEMENT_MISMATCH
    http_status: 409
    condition: "the board's succinct statement variant differs from the jurisdiction's required variant and no granted variance covers the publication date"
    applies_to: ["POST /menu-boards/{id}/publish"]
  - id: ERR_SODIUM_WARNING_ICON_REQUIRED
    http_status: 409
    condition: "a listing at or above the jurisdiction's sodium threshold lacks the warning icon in a SODIUM_WARNING jurisdiction"
    applies_to: ["POST /menu-boards/{id}/publish"]
  - id: ERR_ITEM_CALORIES_UNDECLARED
    http_status: 409
    condition: "a non-exempt listed item has no certified calorie declaration"
    applies_to: ["POST /menu-boards/{id}/publish"]
  - id: ERR_INVALID_DATE_RANGE
    http_status: 400
    condition: "a supplied range has start after end"
    applies_to: ["POST /menu-items/{id}/offer-windows", "POST /variance-requests", "POST /variance-requests/{id}/decision", "POST /menu-boards/{id}/publish"]
  - id: ERR_BOARD_WINDOW_CONFLICT
    http_status: 409
    condition: "the requested half-open display window overlaps another published board of the same establishment and board type"
    applies_to: ["POST /menu-boards/{id}/publish"]
  - id: ERR_VARIANCE_NOT_ALLOWED
    http_status: 409
    condition: "the jurisdiction's preemption_mode is PREEMPTED, so a variance cannot be granted"
    applies_to: ["POST /variance-requests/{id}/decision"]
  - id: ERR_VARIANCE_WINDOW_CONFLICT
    http_status: 409
    condition: "the granted window starts within the 7-day cooling buffer after another granted window for the same brand, jurisdiction and requirement"
    applies_to: ["POST /variance-requests/{id}/decision"]
  - id: ERR_INFO_ROUND_REQUIRED
    http_status: 409
    condition: "escalation attempted with info_round_count == 0"
    applies_to: ["POST /enforcement-actions/{id}/regulator-actions"]
  - id: ERR_CITATION_SHIELDED_BY_VARIANCE
    http_status: 409
    condition: "a granted variance covering the current logical date shields the citation from escalation"
    applies_to: ["POST /enforcement-actions/{id}/regulator-actions"]
  - id: ERR_OUTSTANDING_PENALTY
    http_status: 402
    condition: "a REPRINT_COMPLETED response is filed for a unit whose outstanding_penalty_cents is greater than zero"
    applies_to: ["POST /enforcement-actions/{id}/responses"]
  - id: ERR_NO_STALE_LISTINGS
    http_status: 409
    condition: "reprint requested for a board with stale_listing_count == 0"
    applies_to: ["POST /menu-boards/{id}/reprint"]
  - id: ERR_ITEM_NOT_TEMPORARY
    http_status: 409
    condition: "offer windows or an exemption review requested for an item whose item_class is STANDARD"
    applies_to: ["POST /menu-items/{id}/offer-windows", "POST /menu-items/{id}/exemption-reviews"]
  - id: ERR_UNIT_HAS_OPEN_ENFORCEMENT
    http_status: 409
    condition: "PERMANENTLY_CLOSED requested for an establishment with a live EnforcementAction (status IN {OPEN, RESPONSE_SUBMITTED, INFO_REQUESTED, ESCALATED, PENALTY_ASSESSED})"
    applies_to: ["POST /establishments/{id}/status-changes"]

# =============================================================================
# §1.7 RBAC — segregation_of_duties role model
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Program operator. Registers brands, jurisdictions and units, runs coverage determinations, and controls the logical clock. Holds no brand, unit or jurisdiction identity, so no write of this role is ownership-scoped."
    identity: opaque
    exclusive_operations:
      - "POST /brands"
      - "POST /jurisdictions"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /establishments (shared with BrandComplianceOfficer)"
      - "POST /brands/{id}/establishment-batches (shared with BrandComplianceOfficer)"
      - "POST /establishments/{id}/status-changes (shared with BrandComplianceOfficer)"
      - "POST /brands/{id}/coverage-determinations (shared with BrandComplianceOfficer)"
      - "every GET"
  - name: BrandComplianceOfficer
    description: "Acts for exactly one chain brand; X-User-ID is that Brand's id. Owns the menu, the disclosure packet, variance filings and citation responses."
    identity: "entity_backed:Brand"
    exclusive_operations:
      - "POST /menu-items"
      - "POST /menu-items/{id}/offer-windows"
      - "POST /menu-items/{id}/exemption-reviews"
      - "POST /brands/{id}/disclosure-packets"
      - "POST /disclosure-packets/{id}/publish"
      - "POST /variance-requests"
      - "POST /enforcement-actions/{id}/responses"
    shared_operations:
      - "POST /establishments (shared with PlatformAdmin)"
      - "POST /brands/{id}/establishment-batches (shared with PlatformAdmin)"
      - "POST /establishments/{id}/status-changes (shared with PlatformAdmin)"
      - "POST /brands/{id}/coverage-determinations (shared with PlatformAdmin)"
      - "every GET"
  - name: NutritionAnalyst
    description: "Independent laboratory analyst. Owns recipe versions, their components and the certification decision. Identity is an opaque analyst id so that two distinct analysts can be told apart for segregation of duties."
    identity: opaque
    exclusive_operations:
      - "POST /menu-items/{id}/recipes"
      - "POST /recipes/{id}/components"
      - "POST /recipes/{id}/submit-for-analysis"
      - "POST /nutrition-analyses/{id}/decision"
      - "POST /recipes/{id}/withdraw-certification"
    shared_operations:
      - "every GET"
    segregation_of_duties: "The analyst whose X-User-ID was recorded in NutritionAnalysis.submitted_by_user_id may not issue the CERTIFY decision on that analysis; a REJECT by the same analyst is allowed."
  - name: MenuboardPublisher
    description: "Acts for exactly one unit; X-User-ID is that Establishment's id. Owns boards, their listings, publication and reprints."
    identity: "entity_backed:Establishment"
    exclusive_operations:
      - "POST /menu-boards"
      - "POST /menu-boards/{id}/listings"
      - "POST /menu-boards/{id}/publish"
      - "POST /menu-boards/{id}/reprint"
    shared_operations:
      - "every GET"
  - name: StateRegulator
    description: "Acts for exactly one jurisdiction; X-User-ID is that Jurisdiction's id. Decides variances and drives enforcement."
    identity: "entity_backed:Jurisdiction"
    exclusive_operations:
      - "POST /variance-requests/{id}/decision"
      - "POST /enforcement-actions"
      - "POST /enforcement-actions/{id}/regulator-actions"
    shared_operations:
      - "every GET"
