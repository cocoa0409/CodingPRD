      - name: occ_stale_version_on_registration_patch
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[registration-amend-stale-request]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "PATCH a DRAFT request with expected_registration_request_version captured at creation (1) succeeds and bumps version to 2; a second PATCH replaying the captured version 1 is rejected ERR_STALE_VERSION 412 — strictly sequential, deterministic."
        test_recipe:
          setup: ["DRAFT request; version captured at creation"]
          setup_api_calls:
            - call: "POST /registration-desk/firms"
              payload: { crd_number: "3703", legal_name: "Occ2 Firm" }
              as: SystemOperator
              captures: { firm_oc2_id: $.data.id }
            - call: "POST /registration-desk/applicants"
              payload: { crd_number: "3704", full_name: "Occ2 Rep", date_of_birth: "1985-07-31" }
              as: RegistrationPrincipal
              captures: { app_oc2_id: $.data.id }
            - call: "POST /registration-desk/registration-requests"
