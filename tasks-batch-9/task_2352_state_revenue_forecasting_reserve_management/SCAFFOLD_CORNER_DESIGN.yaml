            - { call: "POST /revenue-sources/${src_pit}/policy-adjustments", payload: { statute_code: "HB-2027-014", policy_category: "RATE_CHANGE", adjustment_kind: "DECREASE", annualized_amount_cents: 50000000, effective_start_date: "2026-10-01", effective_end_date: "2027-07-01", phase_in_type: "PRORATED", first_effective_fiscal_year: 2027 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles", payload: { fiscal_year: 2027, cycle_type: "BASELINE", reconciliation_policy: "MIDPOINT_AVERAGE", enacted_appropriation_cents: 1650000000, prior_recurring_baseline_cents: 1500000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc: $.data.id } }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "BASELINE", weight_bps: 6000, employment_growth_bps: 150, wage_income_bps: 400, retail_sales_bps: 300, asset_market_return_bps: 600 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "OPTIMISTIC", weight_bps: 2500, employment_growth_bps: 300, wage_income_bps: 700, retail_sales_bps: 600, asset_market_return_bps: 1500 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "PESSIMISTIC", weight_bps: 1500, employment_growth_bps: -100, wage_income_bps: 100, retail_sales_bps: -200, asset_market_return_bps: -1000 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/lock-inputs", payload: {}, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc_v: $.data.version } }
            - { call: "POST /consensus-rounds", payload: { cycle_id: "${cyc}", variance_tolerance_bps: 150, per_source_tolerance_bps: 150, expected_cycle_version: "${cyc_v}" }, as: ForecastDirector, as_user_id: "dir-1", captures: { rnd: $.data.id } }
            - { call: "POST /source-estimates", payload: { round_id: "${rnd}", source_id: "${src_pit}" }, as: ExecutiveEconomist, as_user_id: "exec-eco-1" }
            - { call: "POST /source-estimates", payload: { round_id: "${rnd}", source_id: "${src_pit}", judgmental_adjustment_cents: -20000000 }, as: LegislativeEconomist, as_user_id: "leg-eco-1" }
            - { call: "POST /consensus-rounds/${rnd}/submit", payload: {}, as: ExecutiveEconomist, as_user_id: "exec-eco-1" }
            - { call: "POST /consensus-rounds/${rnd}/submit", payload: {}, as: LegislativeEconomist, as_user_id: "leg-eco-1" }
            - { call: "GET /disagreement-records", payload: { round_id: "${rnd}", status: "OPEN" }, as: ForecastDirector, as_user_id: "dir-1", captures: { dis: "$.data[0].id" } }
          trigger:
            - { call: "POST /disagreement-records/${dis}/resolve", payload: { resolution_method: "MIDPOINT", rationale: "Split the difference between the two filed estimates.", resolved_amount_cents: 1248956684 }, as: ForecastDirector, as_user_id: "dir-1", captures: { err: $.data.error_id } }
            - { call: "POST /disagreement-records/${dis}/resolve", payload: { resolution_method: "MIDPOINT", rationale: "Split the difference between the two filed estimates." }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /disagreement-records/${dis}/resolve", payload: { resolution_method: "EXEC_VALUE", rationale: "Second thoughts about the midpoint resolution." }, as: ForecastDirector, as_user_id: "dir-1", captures: { err_closed: $.data.error_id } }
          assert:
            - "first trigger: HTTP 422 and ${err} == ERR_RESOLUTION_AMOUNT_NOT_ALLOWED"
            - "after the first trigger: DisagreementRecord.${dis}.status == OPEN and resolved_amount_cents == null"
            - "second trigger: HTTP 200; DisagreementRecord.${dis}.status == RESOLVED, resolution_method == MIDPOINT, resolved_amount_cents == 1248956684"
            - "ConsensusRound.${rnd}.open_disagreement_count == 0 and status == COMPARED"
            - "third trigger: HTTP 409 and ${err_closed} == ERR_DISAGREEMENT_NOT_OPEN; resolution_method stays MIDPOINT and resolved_amount_cents stays 1248956684"

      - name: resolution_rationale_too_short_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 53 ERR_RATIONALE_TOO_SHORT]
          - endpoints[POST /disagreement-records/{id}/resolve]
        distinguishing_aspect: |
          The 20-character rationale floor is a documentation requirement of the consensus process,
          checked at priority 53: a 19-character rationale is refused with ERR_RATIONALE_TOO_SHORT
          422 even when the resolution method and amount are both valid, and the record stays OPEN.
        test_recipe:
          setup:
            - "The PIT-only DISPUTE variant with its single OPEN DisagreementRecord (exec 1258956684, leg 1238956684, variance 160 bps). The rationale \"Exec figure adopted\" is exactly 19 characters."
          setup_api_calls:
            - { call: "POST /revenue-sources", payload: { name: "Personal Income Tax", tax_type: "PIT", base_year_receipts_cents: 1234567800, elasticity_employment_bps: 4150, elasticity_wage_income_bps: 7825, elasticity_retail_bps: 640, elasticity_asset_bps: 1420, volatility_class: "MEDIUM" }, as: ForecastDirector, as_user_id: "dir-1", captures: { src_pit: $.data.id } }
