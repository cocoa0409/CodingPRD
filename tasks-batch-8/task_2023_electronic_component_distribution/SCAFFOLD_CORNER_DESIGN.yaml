      - name: alternate_revoke_from_proposed_rejected
        claim_type: invalid_transition
        grounds: ["errors[ERR_ALTERNATE_APPROVAL_INVALID_STATE]", state_machines.AlternatePartApproval.APPROVED_to_REVOKED]
        distinguishing_aspect: "REVOKE is legal only from APPROVED; revoking a PROPOSED approval fails with ERR_ALTERNATE_APPROVAL_INVALID_STATE."
