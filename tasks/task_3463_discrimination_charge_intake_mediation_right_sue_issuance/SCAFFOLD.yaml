# =============================================================================
# SCAFFOLD.yaml — EEOC-style Discrimination Charge Intake, Mediation &
# Right-to-Sue Issuance. Single source of truth for PRD/test/impl generators.
# =============================================================================

scenario: |
  Discrimination Charge Intake, Mediation & Right-to-Sue Issuance (Equal Employment Opportunity Commission): charge intake with jurisdictional screening on employer size, protected basis and timeliness deadlines that vary by state deferral agency, work sharing agreements with state and local fair employment agencies determining which body investigates, mediation offering to both parties with confidentiality and separation from investigation, investigation with position statement requests, information requests and witness interviews, cause and no-cause determination with conciliation attempts before litigation referral, right-to-sue notice issuance on request or at conclusion starting a filing clock, systemic investigation and commissioner charges reaching beyond an individual complaint, charge data confidentiality and disclosure limits

domain_name: "eeoc-charge-processing"
api_prefix: "/eeoc"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# §1.0 Response Envelope (FIXED — verbatim)
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; all links are FK references)
# =============================================================================
entities:
  - name: Complainant
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Legal name of the person filing charges."
      - name: email
        type: string
        source: input
        description: "Contact email. Not unique; multiple complainants may share an inbox."

  - name: Employer
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Respondent organization's legal name."
      - name: state_code
        type: string
        source: input
        description: "Two-letter state of the worksite; drives deferral-agency matching at charge intake."
      - name: employee_count_current
        type: integer
        source: input
        description: "Most recently verified headcount; drives size_band and therefore the damages-cap tier used by PROVISIONAL remedy valuation."
        constraints: "integer >= 0"
      - name: size_band
        type: enum
        source: computed
        description: "Band derived from employee_count_current: UNDER_15 (0-14), FROM_15_TO_19 (15-19), FROM_20_TO_100 (20-100), FROM_101_TO_200 (101-200), FROM_201_TO_500 (201-500), OVER_500 (501+). Recomputed on every PATCH."
        constraints: "enum: UNDER_15 | FROM_15_TO_19 | FROM_20_TO_100 | FROM_101_TO_200 | FROM_201_TO_500 | OVER_500"

  - name: DeferralAgency
    parent: null
    common_fields: true
    fields:
      - name: state_code
        type: string
        source: input
        description: "Two-letter state this fair-employment agency covers. Unique: one agency per state."
        constraints: "unique across DeferralAgency"
      - name: agency_name
        type: string
        source: input
        description: "Display name of the state or local FEPA."
      - name: filing_deadline_days
        type: integer
        source: input
        description: "Timeliness deadline in days from incident_date for charges in this state. Only 180 or 300 are accepted."
        constraints: "enum-as-integer: 180 | 300"
      - name: work_sharing_policy
        type: enum
        source: input
        description: "Work-sharing agreement tier. EEOC_RETAINS_ALL: EEOC investigates, no dual filing. DUAL_FILE_DEFAULT: charge dual-filed, EEOC investigates. FEPA_EXCLUSIVE: charge dual-filed and the FEPA investigates (charge lands DELEGATED_TO_FEPA)."
        constraints: "enum: EEOC_RETAINS_ALL | DUAL_FILE_DEFAULT | FEPA_EXCLUSIVE"
      - name: covers_age
        type: boolean
        source: input
        description: "Whether the state agency's statute covers age discrimination. When false, an AGE basis is stripped from covered_bases at screening even if the employer meets the ADEA size threshold."

  - name: Charge
    parent: null
    common_fields: true
    fields:
      - name: complainant_id
        type: string
        source: input
        description: "FK -> Complainant.id; the person filing. ChargingParty role ownership compares X-User-ID to this field."
      - name: employer_id
        type: string
        source: input
        description: "FK -> Employer.id; the respondent. RespondentRep role ownership compares X-User-ID to this field."
      - name: deferral_agency_id
        type: string
        source: system
        description: "FK -> DeferralAgency.id; auto-matched at intake from Employer.state_code (null when the state has no agency). Never client-supplied."
      - name: basis_codes
        type: array
        source: input
        description: "Protected bases asserted. Non-empty array of enum members."
        constraints: "array of enum: RACE | COLOR | RELIGION | SEX | NATIONAL_ORIGIN | AGE | DISABILITY | GENETIC_INFO | RETALIATION; min length 1"
      - name: covered_bases
        type: array
        source: computed
        description: "Subset of basis_codes passing the size/coverage screen: AGE requires employee_count_at_incident >= 20 AND (no deferral agency OR agency.covers_age); every other basis requires employee_count_at_incident >= 15. When empty the charge is DISMISSED_NO_JURISDICTION."
      - name: incident_date
        type: datetime
        source: input
        description: "Date of the alleged harm (date precision; time component must be T00:00:00Z). Must not be after received_date."
      - name: harm_description
        type: string
        source: input
        description: "Free-text account of the alleged discriminatory act."
      - name: employee_count_at_incident
        type: integer
        source: input
        description: "Snapshot of respondent headcount during the incident period; the jurisdictional size screen uses ONLY this snapshot, never Employer.employee_count_current."
        constraints: "integer >= 0"
      - name: received_date
        type: datetime
        source: system
        description: "Date the charge was received, stamped from the logical clock at creation (date precision)."
      - name: case_status
        type: enum
        source: computed
        description: "Primary lifecycle dimension (see state_machines.Charge)."
        constraints: "enum: DOCKETED | IN_MEDIATION | UNDER_INVESTIGATION | DETERMINATION_REVIEW | CONCILIATION | DELEGATED_TO_FEPA | CLOSED_SETTLED | CLOSED_NO_CAUSE | LITIGATION_REFERRED | RTS_ISSUED | DISMISSED_UNTIMELY | DISMISSED_NO_JURISDICTION | WITHDRAWN"
      - name: disclosure_hold
        type: enum
        source: computed
        description: "Parallel confidentiality dimension, independent of case_status. NONE normally; SEALED while linked to a SystemicCase; lifted back to NONE when that systemic case resolves."
        constraints: "enum: NONE | SEALED"
      - name: jurisdiction_outcome
        type: enum
        source: computed
        description: "Result of intake screening: TIMELY_CONFIRMED, DISMISSED_UNTIMELY (received_date > filing_deadline_date), or DISMISSED_NO_JURISDICTION (covered_bases empty)."
        constraints: "enum: TIMELY_CONFIRMED | DISMISSED_UNTIMELY | DISMISSED_NO_JURISDICTION"
      - name: filing_deadline_date
        type: datetime
        source: computed
        description: "incident_date + deadline_days, where deadline_days = deferral_agency.filing_deadline_days when an agency matched, else 180 (FEDERAL_DEFAULT_DEADLINE_DAYS). Timeliness test: received_date <= filing_deadline_date (inclusive)."
      - name: investigation_owner
        type: enum
        source: computed
        description: "EEOC when no agency matched or policy in {EEOC_RETAINS_ALL, DUAL_FILE_DEFAULT}; FEPA when policy == FEPA_EXCLUSIVE; NONE when the charge is dismissed at intake."
        constraints: "enum: EEOC | FEPA | NONE"
      - name: dual_filed
        type: boolean
        source: computed
        description: "true when a deferral agency matched AND its work_sharing_policy is DUAL_FILE_DEFAULT or FEPA_EXCLUSIVE."
      - name: investigation_case_id
        type: string
        source: system
        description: "System-set id of the linked InvestigationCase (1:1, created on first entry to UNDER_INVESTIGATION; reverse lookup via GET /eeoc/investigation-cases?charge_id=). Null until then."
      - name: priority_escalated
        type: boolean
        source: computed
        description: "Sticky flag set true the first time investigation_priority_score recomputes to >= ESCALATION_THRESHOLD (80); never auto-clears."
        default: false
      - name: settled_amount_cents
        type: integer
        source: computed
        description: "Agreed settlement amount in cents, set on settlement (mediation conclude or conciliation accept), zeroed by vacate-settlement."
        default: 0
      - name: settled_via
        type: enum
        source: computed
        description: "Which path produced the settlement: MEDIATION or CONCILIATION. Null when unsettled or after vacate."
        constraints: "enum: MEDIATION | CONCILIATION; nullable"
      - name: settled_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of settlement; the vacate window (VACATE_WINDOW_DAYS = 10) is measured from this. Null when unsettled."
      - name: systemic_case_id
        type: string
        source: system
        description: "FK -> SystemicCase.id; set by POST /eeoc/systemic-cases/{id}/links, null otherwise."
      - name: days_elapsed_since_filing
        type: integer
        source: computed
        description: "Whole days between received_date and the current logical clock; recomputed on every read. Drives the 180-day right-to-sue gate."

  - name: MediationCase
    parent: null
    common_fields: true
    fields:
      - name: charge_id
        type: string
        source: input
        description: "FK -> Charge.id; charge under mediation (from path)."
      - name: round_number
        type: integer
        source: computed
        description: "1 + count of prior MediationCase rows for this charge. Hard cap MAX_MEDIATION_ROUNDS = 2."
      - name: complainant_response
        type: enum
        source: computed
        description: "Charging party's response to the mediation offer; set by respond when X-User-ID == charge.complainant_id."
        constraints: "enum: PENDING | ACCEPTED | DECLINED"
        default: PENDING
      - name: respondent_response
        type: enum
        source: computed
        description: "Respondent's response; set by respond when X-User-ID == charge.employer_id."
        constraints: "enum: PENDING | ACCEPTED | DECLINED"
        default: PENDING
      - name: status
        type: enum
        source: computed
        description: "Mediation lifecycle (see state_machines.MediationCase)."
        constraints: "enum: OFFERED | ACTIVE | SETTLED | IMPASSE | DECLINED | VACATED"
      - name: settlement_amount_cents
        type: integer
        source: input
        description: "Agreed amount supplied on conclude when outcome == SETTLED; required then, forbidden otherwise."
        constraints: "integer > 0; nullable"
      - name: concluded_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of conclude; null until concluded."

  - name: MediationSession
    parent: null
    common_fields: true
    fields:
      - name: mediation_case_id
        type: string
        source: input
        description: "FK -> MediationCase.id (from path)."
      - name: mediator_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the acting Mediator; stamped at creation, client input ignored. Sessions overlap-check against this mediator's other SCHEDULED sessions."
      - name: scheduled_start
        type: datetime
        source: input
        description: "Session start (ISO 8601). Must be >= current logical clock time."
      - name: scheduled_end
        type: datetime
        source: input
        description: "Session end. Must be strictly after scheduled_start."
      - name: status
        type: enum
        source: computed
        description: "SCHEDULED at creation; flips to HELD on read once the logical clock passes scheduled_end; flips to CANCELLED when the parent mediation concludes while still SCHEDULED."
        constraints: "enum: SCHEDULED | HELD | CANCELLED"

  - name: InvestigationCase
    parent: null
    common_fields: true
    fields:
      - name: charge_id
        type: string
        source: system
        description: "FK -> Charge.id; set by the auto-create cascade on the charge's first entry to UNDER_INVESTIGATION."
      - name: assigned_investigator_id
        type: string
        source: system
        description: "Opaque X-User-ID of the assigned Investigator; set by assign, null until assigned. Reassign transfers caseload."
      - name: status
        type: enum
        source: computed
        description: "Investigation lifecycle (see state_machines.InvestigationCase)."
        constraints: "enum: OPEN | GATHERING | SUSPENDED_MEDIATION | CLOSED"
      - name: open_request_count
        type: integer
        source: computed
        description: "Count of this case's EvidenceRequests with status PENDING or OVERDUE; RESPONDED and WAIVED excluded."
        default: 0
      - name: overdue_request_count
        type: integer
        source: computed
        description: "Count of this case's EvidenceRequests with status OVERDUE."
        default: 0
      - name: priority_score
        type: integer
        source: computed
        description: "See calculations.investigation_priority_score; recomputed on read and on evidence-request transitions."

  - name: EvidenceRequest
    parent: null
    common_fields: true
    fields:
      - name: investigation_case_id
        type: string
        source: input
        description: "FK -> InvestigationCase.id (from path)."
      - name: request_type
        type: enum
        source: input
        description: "Kind of compulsory request issued to the respondent."
        constraints: "enum: POSITION_STATEMENT | RFI | DOCUMENT_DEMAND"
      - name: issued_date
        type: datetime
        source: system
        description: "Logical-clock date of issuance."
      - name: due_date
        type: datetime
        source: computed
        description: "issued_date + EVIDENCE_RESPONSE_WINDOW_DAYS (30 days)."
      - name: status
        type: enum
        source: computed
        description: "PENDING at issuance; OVERDUE on read once clock passes due_date; RESPONDED on respond (even after OVERDUE); WAIVED when the charge reaches a terminal state with the request still open."
        constraints: "enum: PENDING | OVERDUE | RESPONDED | WAIVED"
      - name: response_text
        type: string
        source: input
        description: "Respondent's submitted response body; null until responded."
      - name: responded_late
        type: boolean
        source: computed
        description: "true when the response arrived while status was OVERDUE."
        default: false

  - name: WitnessInterview
    parent: null
    common_fields: true
    fields:
      - name: investigation_case_id
        type: string
        source: input
        description: "FK -> InvestigationCase.id (from path)."
      - name: investigator_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the logging Investigator; must equal the case's assigned_investigator_id. Buffer-conflict checks run across ALL of this investigator's interviews regardless of case."
      - name: witness_name
        type: string
        source: input
        description: "Name of the interviewed witness."
      - name: interview_start
        type: datetime
        source: input
        description: "Interview start. May be in the past (interviews are logged after the fact; ERR_SESSION_IN_PAST does NOT apply here)."
      - name: interview_end
        type: datetime
        source: input
        description: "Interview end; must be strictly after interview_start."
      - name: summary
        type: string
        source: input
        description: "Investigator's interview summary."

  - name: Determination
    parent: null
    common_fields: true
    fields:
      - name: investigation_case_id
        type: string
        source: input
        description: "FK -> InvestigationCase.id (from path)."
      - name: outcome
        type: enum
        source: input
        description: "CAUSE, NO_CAUSE, or UNABLE_TO_DETERMINE. CAUSE requires the four remedy component fields plus harm_start_date."
        constraints: "enum: CAUSE | NO_CAUSE | UNABLE_TO_DETERMINE"
      - name: rationale
        type: string
        source: input
        description: "Investigator's written basis for the outcome."
      - name: back_pay_cents
        type: integer
        source: input
        description: "Documented wage loss; required when outcome == CAUSE, must be null otherwise."
        constraints: "integer >= 0; nullable"
      - name: front_pay_cents
        type: integer
        source: input
        description: "Projected future wage loss; required when outcome == CAUSE, must be null otherwise."
        constraints: "integer >= 0; nullable"
      - name: compensatory_damages_cents
        type: integer
        source: input
        description: "Non-pecuniary compensatory damages pre-cap; required when outcome == CAUSE, must be null otherwise."
        constraints: "integer >= 0; nullable"
      - name: punitive_damages_cents
        type: integer
        source: input
        description: "Punitive damages pre-cap; required when outcome == CAUSE, must be null otherwise."
        constraints: "integer >= 0; nullable"
      - name: harm_start_date
        type: datetime
        source: input
        description: "Date wage harm began; interest accrues from this date. Required when outcome == CAUSE, must be null otherwise."
      - name: status
        type: enum
        source: computed
        description: "DRAFT at creation; PENDING_REVIEW on submit; APPROVED or RETURNED on review; RETURNED may be submitted again (cycle)."
        constraints: "enum: DRAFT | PENDING_REVIEW | RETURNED | APPROVED"
      - name: prepared_by_user_id
        type: string
        source: system
        description: "X-User-ID of the drafting Investigator; the reviewing Director must differ (segregation of duties)."
      - name: reviewed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the reviewing Director; null until reviewed."
      - name: return_reason
        type: string
        source: input
        description: "Required when review decision == RETURN; must be null when decision == APPROVE."

  - name: ConciliationProcess
    parent: null
    common_fields: true
    fields:
      - name: charge_id
        type: string
        source: system
        description: "FK -> Charge.id; set by the cause-approval cascade."
      - name: origin_determination_id
        type: string
        source: system
        description: "System-set id of the APPROVED CAUSE Determination that created this process (trace via GET /eeoc/investigation-cases/{id}/determinations)."
      - name: status
        type: enum
        source: computed
        description: "INITIATED at creation; first offer moves to OFFER_TABLED; a counter-offer by the opposite side moves to COUNTERED; the next counter flips back to OFFER_TABLED (two-state negotiation cycle); accept -> SETTLED; fail -> FAILED."
        constraints: "enum: INITIATED | OFFER_TABLED | COUNTERED | SETTLED | FAILED"
      - name: current_offer_cents
        type: integer
        source: computed
        description: "Amount of the most recent offer; null before the first offer."
      - name: last_offer_by
        type: enum
        source: computed
        description: "Which side tabled the current offer: COMMISSION (Director) or RESPONDENT (RespondentRep). Offers must strictly alternate; same side twice -> ERR_OFFER_OUT_OF_TURN."
        constraints: "enum: COMMISSION | RESPONDENT; nullable"
      - name: rounds_count
        type: integer
        source: computed
        description: "Number of offers tabled so far; increments on every successful offer."
        default: 0

  - name: RemedyPackage
    parent: null
    common_fields: true
    fields:
      - name: conciliation_process_id
        type: string
        source: system
        description: "FK -> ConciliationProcess.id; set by the cause-approval cascade (exactly one package per process)."
      - name: valuation_variant
        type: enum
        source: computed
        description: "PROVISIONAL from creation until conciliation accept flips it to FINAL. See calculations.remedy_valuation for the divergence."
        constraints: "enum: PROVISIONAL | FINAL"
      - name: back_pay_cents
        type: integer
        source: system
        description: "Copied from the origin Determination at creation."
      - name: front_pay_cents
        type: integer
        source: system
        description: "Copied from the origin Determination at creation."
      - name: compensatory_damages_cents
        type: integer
        source: system
        description: "Copied from the origin Determination (pre-cap)."
      - name: punitive_damages_cents
        type: integer
        source: system
        description: "Copied from the origin Determination (pre-cap)."
      - name: harm_start_date
        type: datetime
        source: system
        description: "Copied from the origin Determination."
      - name: band_used
        type: enum
        source: computed
        description: "Employer band applied to the cap: PROVISIONAL uses Employer.size_band at computation time; FINAL uses the band derived from the charge's employee_count_at_incident snapshot."
        constraints: "enum: UNDER_15 | FROM_15_TO_19 | FROM_20_TO_100 | FROM_101_TO_200 | FROM_201_TO_500 | OVER_500"
      - name: projection_date
        type: datetime
        source: computed
        description: "Interest end date: PROVISIONAL pins the conciliation-initiation date; FINAL pins the accept (agreement) date. Recomputes on accept, never after."
      - name: interest_days
        type: integer
        source: computed
        description: "Whole days from harm_start_date to projection_date."
      - name: back_pay_interest_cents
        type: integer
        source: computed
        description: "round_half_up(back_pay_cents * 0.05 * interest_days / 365) — rounded per component BEFORE summing (pinned order)."
      - name: front_pay_interest_cents
        type: integer
        source: computed
        description: "round_half_up(front_pay_cents * 0.05 * interest_days / 365) — rounded per component BEFORE summing (pinned order)."
      - name: capped_nonpecuniary_cents
        type: integer
        source: computed
        description: "min(compensatory_damages_cents + punitive_damages_cents, CAP_TIER[band_used]) with CAP_TIER: FROM_15_TO_19/FROM_20_TO_100 -> 5000000; FROM_101_TO_200 -> 10000000; FROM_201_TO_500 -> 20000000; OVER_500 -> 30000000. UNDER_15 never reaches conciliation."
      - name: total_cents
        type: integer
        source: computed
        description: "back_pay_cents + front_pay_cents + back_pay_interest_cents + front_pay_interest_cents + capped_nonpecuniary_cents. All components are already whole cents; no rounding at summation."

  - name: RightToSueNotice
    parent: null
    common_fields: true
    fields:
      - name: charge_id
        type: string
        source: input
        description: "FK -> Charge.id (from path)."
      - name: issuance_basis
        type: enum
        source: computed
        description: "ELAPSED_180_DAYS (charging-party request once days_elapsed_since_filing >= 180), DIRECTOR_DISCRETION (Director request), AUTO_ON_DISMISSAL (system-issued when a determination is approved NO_CAUSE or UNABLE_TO_DETERMINE)."
        constraints: "enum: ELAPSED_180_DAYS | DIRECTOR_DISCRETION | AUTO_ON_DISMISSAL"
      - name: requested_by_role
        type: string
        source: system
        description: "Role that requested issuance; 'system' for AUTO_ON_DISMISSAL."
      - name: issued_date
        type: datetime
        source: system
        description: "Logical-clock date of issuance."
      - name: court_filing_deadline
        type: datetime
        source: computed
        description: "issued_date + RTS_COURT_FILING_DAYS (90 days)."
      - name: status
        type: enum
        source: computed
        description: "ISSUED while logical clock <= court_filing_deadline; flips to EXPIRED on read once the clock is strictly after the deadline."
        constraints: "enum: ISSUED | EXPIRED"

  - name: SystemicCase
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: "Commissioner-charge or pattern-or-practice investigation title."
      - name: basis_focus
        type: array
        source: input
        description: "Basis codes the systemic probe targets; consolidation requires at least 2 linked non-terminal charges sharing a basis with this set."
        constraints: "array of the Charge basis enum; min length 1"
      - name: commissioner_user_id
        type: string
        source: system
        description: "X-User-ID of the creating Commissioner."
      - name: status
        type: enum
        source: computed
        description: "OPENED at creation; EXPANDING once >= 1 charge linked; CONSOLIDATED at the calculations.systemic_consolidation_threshold rule; RESOLVED automatically once >= 1 charge is linked and every linked charge is terminal."
        constraints: "enum: OPENED | EXPANDING | CONSOLIDATED | RESOLVED"
      - name: linked_charge_count
        type: integer
        source: computed
        description: "Count of ALL charges whose systemic_case_id == this case's id, regardless of charge status."
        default: 0

  - name: DisclosureRecord
    parent: null
    common_fields: false
    fields:
      - name: charge_id
        type: string
        source: system
        description: "FK -> Charge.id; the charge whose data was disclosed."
      - name: accessor_role
        type: string
        source: system
        description: "Role that accessed/received the data."
      - name: accessor_user_id
        type: string
        source: system
        description: "X-User-ID of the accessor."
      - name: legal_basis
        type: enum
        source: input
        description: "COURT_ORDER, FEPA_WORK_SHARE, or PARTY_CONSENT for explicit disclosures; INTERNAL_ACCESS is system-stamped on privileged reads of SEALED charges."
        constraints: "enum: COURT_ORDER | FEPA_WORK_SHARE | PARTY_CONSENT | INTERNAL_ACCESS"
      - name: target_description
        type: string
        source: input
        description: "Who/what received the disclosure; null on INTERNAL_ACCESS auto-log rows."
      - name: disclosed_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of disclosure. Append-only: DisclosureRecord has no update or delete path."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Charge
    initial_state: DOCKETED
    terminal_states: [DISMISSED_UNTIMELY, DISMISSED_NO_JURISDICTION, CLOSED_NO_CAUSE, RTS_ISSUED, WITHDRAWN]
    note: >
      Creation synchronously runs intake screening: the row lands in DOCKETED
      (jurisdiction TIMELY_CONFIRMED, owner EEOC), DELEGATED_TO_FEPA (owner FEPA),
      or the DISMISSED_* terminals. CLOSED_SETTLED and LITIGATION_REFERRED are
      non-terminal: vacate-settlement reopens the former, and a right-to-sue
      request may still be made from the latter. Every transition of a
      systemically-linked charge (systemic_case_id set) INTO a terminal state
      also bubbles up: calculations.systemic_consolidation_threshold re-evaluates
      the linked SystemicCase, which may auto-resolve it and lift disclosure_hold
      SEALED -> NONE on all linked charges.
    transitions:
      - from: DOCKETED
        to: IN_MEDIATION
        trigger: "POST /eeoc/mediation-cases/{id}/respond recording the SECOND acceptance (both parties ACCEPTED)"
        actor: ChargingParty | RespondentRep
        preconditions:
          - "mediation case status == OFFERED"
          - "after this response both complainant_response and respondent_response == ACCEPTED"
        side_effects:
          - "mediation case status -> ACTIVE"
          - "charge.case_status -> IN_MEDIATION"
      - from: DOCKETED
        to: UNDER_INVESTIGATION
        trigger: "POST /eeoc/mediation-cases/{id}/respond recording a DECLINE from either party"
        actor: ChargingParty | RespondentRep
        preconditions:
          - "mediation case status == OFFERED"
        side_effects:
          - "mediation case status -> DECLINED"
          - "charge.case_status -> UNDER_INVESTIGATION"
          - "auto-create InvestigationCase (status OPEN, assigned_investigator_id null) and stamp charge.investigation_case_id"
      - from: IN_MEDIATION
        to: CLOSED_SETTLED
        trigger: "POST /eeoc/mediation-cases/{id}/conclude with outcome SETTLED"
        actor: Mediator
        preconditions:
          - "mediation case status == ACTIVE"
          - "charge.case_status == IN_MEDIATION (cross-entity gate: an ACTIVE mediation orphaned by RTS issuance cannot settle)"
          - "settlement_amount_cents present and > 0"
        side_effects:
          - "mediation case status -> SETTLED, concluded_at = clock"
          - "charge.settled_amount_cents = settlement_amount_cents; charge.settled_via = MEDIATION; charge.settled_at = clock"
          - "charge.case_status -> CLOSED_SETTLED"
          - "every SCHEDULED MediationSession of this mediation case -> CANCELLED"
      - from: IN_MEDIATION
        to: UNDER_INVESTIGATION
        trigger: "POST /eeoc/mediation-cases/{id}/conclude with outcome IMPASSE"
        actor: Mediator
        preconditions:
          - "mediation case status == ACTIVE"
          - "charge.case_status == IN_MEDIATION"
        side_effects:
          - "mediation case status -> IMPASSE, concluded_at = clock"
          - "every SCHEDULED MediationSession of this mediation case -> CANCELLED"
          - "charge.case_status -> UNDER_INVESTIGATION"
          - "if an InvestigationCase exists: SUSPENDED_MEDIATION -> GATHERING; else auto-create one (OPEN)"
      - from: UNDER_INVESTIGATION
        to: IN_MEDIATION
        trigger: "POST /eeoc/mediation-cases/{id}/respond recording the SECOND acceptance on a re-offer (mediation cycle re-entry)"
        actor: ChargingParty | RespondentRep
        preconditions:
          - "mediation case status == OFFERED (round_number 2 re-offer)"
          - "both responses ACCEPTED after this response"
        side_effects:
          - "mediation case status -> ACTIVE"
          - "charge.case_status -> IN_MEDIATION"
          - "InvestigationCase GATHERING -> SUSPENDED_MEDIATION (if it exists and is GATHERING)"
      - from: UNDER_INVESTIGATION
        to: DETERMINATION_REVIEW
        trigger: "POST /eeoc/determinations/{id}/submit"
        actor: Investigator
        preconditions:
          - "determination status in {DRAFT, RETURNED} and prepared_by_user_id == X-User-ID"
        side_effects:
          - "determination status -> PENDING_REVIEW"
          - "charge.case_status -> DETERMINATION_REVIEW"
      - from: DETERMINATION_REVIEW
        to: UNDER_INVESTIGATION
        trigger: "POST /eeoc/determinations/{id}/review with decision RETURN"
        actor: Director
        preconditions:
          - "determination status == PENDING_REVIEW"
          - "reviewer X-User-ID != determination.prepared_by_user_id (segregation of duties)"
          - "return_reason present"
        side_effects:
          - "determination status -> RETURNED, reviewed_by_user_id = X-User-ID"
          - "charge.case_status -> UNDER_INVESTIGATION"
      - from: DETERMINATION_REVIEW
        to: CONCILIATION
        trigger: "POST /eeoc/determinations/{id}/review with decision APPROVE on outcome CAUSE"
        actor: Director
        preconditions:
          - "determination status == PENDING_REVIEW"
          - "reviewer X-User-ID != determination.prepared_by_user_id"
        side_effects:
          - "determination status -> APPROVED, reviewed_by_user_id = X-User-ID (link 1: A mutates B)"
          - "charge.case_status -> CONCILIATION"
          - "entering CONCILIATION auto-creates ConciliationProcess (status INITIATED, origin_determination_id set) (link 2: B's transition creates C)"
          - "ConciliationProcess INITIATED auto-creates its RemedyPackage with valuation_variant PROVISIONAL computed per calculations.remedy_valuation (link 3: C's creation computes D)"
          - "InvestigationCase -> CLOSED; its PENDING/OVERDUE EvidenceRequests -> WAIVED"
      - from: DETERMINATION_REVIEW
        to: CLOSED_NO_CAUSE
        trigger: "POST /eeoc/determinations/{id}/review with decision APPROVE on outcome NO_CAUSE or UNABLE_TO_DETERMINE"
        actor: Director
        preconditions:
          - "determination status == PENDING_REVIEW"
          - "reviewer X-User-ID != determination.prepared_by_user_id"
        side_effects:
          - "determination status -> APPROVED, reviewed_by_user_id = X-User-ID"
          - "charge.case_status -> CLOSED_NO_CAUSE"
          - "charge closure auto-issues a RightToSueNotice (issuance_basis AUTO_ON_DISMISSAL, issued_date = clock, court_filing_deadline = +90 days)"
          - "InvestigationCase -> CLOSED; its PENDING/OVERDUE EvidenceRequests -> WAIVED"
      - from: CONCILIATION
        to: CLOSED_SETTLED
        trigger: "POST /eeoc/conciliation-processes/{id}/accept"
        actor: ChargingParty
        preconditions:
          - "conciliation status in {OFFER_TABLED, COUNTERED} (an outstanding offer exists)"
          - "X-User-ID == charge.complainant_id"
        side_effects:
          - "conciliation status -> SETTLED"
          - "RemedyPackage recomputed as FINAL (band from employee_count_at_incident snapshot, projection_date = accept date) and valuation_variant -> FINAL"
          - "charge.settled_amount_cents = conciliation.current_offer_cents; settled_via = CONCILIATION; settled_at = clock"
          - "charge.case_status -> CLOSED_SETTLED"
      - from: CONCILIATION
        to: LITIGATION_REFERRED
        trigger: "POST /eeoc/conciliation-processes/{id}/fail"
        actor: Director
        preconditions:
          - "conciliation status in {INITIATED, OFFER_TABLED, COUNTERED}"
        side_effects:
          - "conciliation status -> FAILED"
          - "charge.case_status -> LITIGATION_REFERRED"
      - from: CLOSED_SETTLED
        to: UNDER_INVESTIGATION
        trigger: "POST /eeoc/charges/{id}/vacate-settlement"
        actor: Director
        preconditions:
          - "charge.case_status == CLOSED_SETTLED and charge.settled_via == MEDIATION (conciliation settlements are final)"
          - "logical clock <= charge.settled_at + VACATE_WINDOW_DAYS (10 days)"
        side_effects:
          - "charge.case_status -> UNDER_INVESTIGATION; settled_amount_cents -> 0; settled_via -> null; settled_at -> null"
          - "the SETTLED MediationCase -> VACATED"
          - "InvestigationCase CLOSED -> GATHERING if one exists, else auto-create (OPEN)"
      - from: DELEGATED_TO_FEPA
        to: RTS_ISSUED
        trigger: "POST /eeoc/charges/{id}/right-to-sue-notices"
        actor: ChargingParty | Director
        preconditions:
          - "no RightToSueNotice exists for the charge"
          - "ChargingParty path: days_elapsed_since_filing >= RTS_MIN_ELAPSED_DAYS (180); Director path: unconditional"
        side_effects:
          - "RightToSueNotice created (issued_date = clock, court_filing_deadline = +90 days)"
          - "charge.case_status -> RTS_ISSUED"
      - from: IN_MEDIATION
        to: RTS_ISSUED
        trigger: "POST /eeoc/charges/{id}/right-to-sue-notices"
        actor: ChargingParty | Director
        preconditions:
          - "no RightToSueNotice exists for the charge"
          - "ChargingParty path: days_elapsed_since_filing >= 180; Director path: unconditional"
        side_effects:
          - "RightToSueNotice created; mediation case is deliberately NOT touched (an ACTIVE/OFFERED mediation may be orphaned; its conclude then fails the charge-state gate)"
          - "charge.case_status -> RTS_ISSUED"
          - "InvestigationCase (if any) -> CLOSED; its PENDING/OVERDUE EvidenceRequests -> WAIVED"
      - from: UNDER_INVESTIGATION
        to: RTS_ISSUED
        trigger: "POST /eeoc/charges/{id}/right-to-sue-notices"
        actor: ChargingParty | Director
        preconditions:
          - "no RightToSueNotice exists for the charge"
          - "ChargingParty path: days_elapsed_since_filing >= 180; Director path: unconditional"
        side_effects:
          - "RightToSueNotice created"
          - "charge.case_status -> RTS_ISSUED"
          - "InvestigationCase -> CLOSED; its PENDING/OVERDUE EvidenceRequests -> WAIVED"
      - from: DETERMINATION_REVIEW
        to: RTS_ISSUED
        trigger: "POST /eeoc/charges/{id}/right-to-sue-notices"
        actor: ChargingParty | Director
        preconditions:
          - "no RightToSueNotice exists for the charge"
          - "ChargingParty path: days_elapsed_since_filing >= 180; Director path: unconditional"
        side_effects:
          - "RightToSueNotice created"
          - "charge.case_status -> RTS_ISSUED"
          - "InvestigationCase -> CLOSED; its PENDING/OVERDUE EvidenceRequests -> WAIVED"
      - from: DOCKETED
        to: RTS_ISSUED
        trigger: "POST /eeoc/charges/{id}/right-to-sue-notices"
        actor: ChargingParty | Director
        preconditions:
          - "ChargingParty path: days_elapsed_since_filing >= 180; Director path: unconditional"
        side_effects:
          - "RightToSueNotice created"
          - "charge.case_status -> RTS_ISSUED; any OFFERED MediationCase -> DECLINED"
      - from: LITIGATION_REFERRED
        to: RTS_ISSUED
        trigger: "POST /eeoc/charges/{id}/right-to-sue-notices"
        actor: ChargingParty | Director
        preconditions:
          - "no RightToSueNotice exists for the charge"
        side_effects:
          - "RightToSueNotice created"
          - "charge.case_status -> RTS_ISSUED"
      - from: DOCKETED
        to: WITHDRAWN
        trigger: "POST /eeoc/charges/{id}/withdraw"
        actor: ChargingParty
        preconditions: ["X-User-ID == charge.complainant_id"]
        side_effects:
          - "any OFFERED MediationCase -> DECLINED"
          - "charge.case_status -> WITHDRAWN"
      - from: IN_MEDIATION
        to: WITHDRAWN
        trigger: "POST /eeoc/charges/{id}/withdraw"
        actor: ChargingParty
        preconditions: ["X-User-ID == charge.complainant_id"]
        side_effects:
          - "ACTIVE/OFFERED MediationCase -> DECLINED; its SCHEDULED sessions -> CANCELLED"
          - "charge.case_status -> WITHDRAWN"
      - from: UNDER_INVESTIGATION
        to: WITHDRAWN
        trigger: "POST /eeoc/charges/{id}/withdraw"
        actor: ChargingParty
        preconditions: ["X-User-ID == charge.complainant_id"]
        side_effects:
          - "OFFERED MediationCase (pending re-offer response) -> DECLINED"
          - "InvestigationCase OPEN/GATHERING/SUSPENDED_MEDIATION -> CLOSED; PENDING/OVERDUE EvidenceRequests -> WAIVED"
          - "charge.case_status -> WITHDRAWN"
      - from: DELEGATED_TO_FEPA
        to: WITHDRAWN
        trigger: "POST /eeoc/charges/{id}/withdraw"
        actor: ChargingParty
        preconditions: ["X-User-ID == charge.complainant_id"]
        side_effects:
          - "charge.case_status -> WITHDRAWN"
      - from: DOCKETED
        to: DISMISSED_UNTIMELY
        trigger: "POST /eeoc/charges/{id}/amend moving incident_date so received_date > recomputed filing_deadline_date"
        actor: ChargingParty
        preconditions:
          - "amend gate satisfied (case_status in {DOCKETED, IN_MEDIATION, UNDER_INVESTIGATION, DELEGATED_TO_FEPA})"
          - "recomputed jurisdiction_outcome == DISMISSED_UNTIMELY"
        side_effects:
          - "charge.case_status -> DISMISSED_UNTIMELY; investigation_owner -> NONE"
          - "OFFERED/ACTIVE MediationCase -> DECLINED; InvestigationCase -> CLOSED; PENDING/OVERDUE EvidenceRequests -> WAIVED"
      - from: IN_MEDIATION
        to: DISMISSED_UNTIMELY
        trigger: "POST /eeoc/charges/{id}/amend moving incident_date past the deadline"
        actor: ChargingParty
        preconditions:
          - "amend gate satisfied"
          - "recomputed jurisdiction_outcome == DISMISSED_UNTIMELY"
        side_effects:
          - "charge.case_status -> DISMISSED_UNTIMELY; investigation_owner -> NONE"
          - "ACTIVE MediationCase -> DECLINED; SCHEDULED sessions -> CANCELLED"
      - from: UNDER_INVESTIGATION
        to: DISMISSED_UNTIMELY
        trigger: "POST /eeoc/charges/{id}/amend moving incident_date past the deadline"
        actor: ChargingParty
        preconditions:
          - "amend gate satisfied"
          - "recomputed jurisdiction_outcome == DISMISSED_UNTIMELY"
        side_effects:
          - "charge.case_status -> DISMISSED_UNTIMELY; investigation_owner -> NONE"
          - "InvestigationCase -> CLOSED; PENDING/OVERDUE EvidenceRequests -> WAIVED; OFFERED MediationCase -> DECLINED"

  - entity: MediationCase
    initial_state: OFFERED
    terminal_states: [IMPASSE, DECLINED, VACATED]
    note: "SETTLED is non-terminal because vacate-settlement reverts it. At most MAX_MEDIATION_ROUNDS (2) MediationCase rows may exist per charge; a new one may be created only when every prior one is terminal."
    transitions:
      - from: OFFERED
        to: ACTIVE
        trigger: "POST /eeoc/mediation-cases/{id}/respond recording the second ACCEPTED"
        actor: ChargingParty | RespondentRep
        preconditions:
          - "acting party's own response field == PENDING"
          - "after this response both responses == ACCEPTED"
        side_effects:
          - "acting party's response -> ACCEPTED, then status -> ACTIVE"
          - "charge -> IN_MEDIATION (see Charge.DOCKETED_to_IN_MEDIATION / UNDER_INVESTIGATION_to_IN_MEDIATION)"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /eeoc/mediation-cases/{id}/respond recording any DECLINED"
        actor: ChargingParty | RespondentRep
        preconditions:
          - "acting party's own response field == PENDING"
        side_effects:
          - "acting party's response -> DECLINED, then status -> DECLINED"
          - "if charge.case_status == DOCKETED: charge -> UNDER_INVESTIGATION with InvestigationCase auto-create; if already UNDER_INVESTIGATION: no charge transition"
      - from: ACTIVE
        to: SETTLED
        trigger: "POST /eeoc/mediation-cases/{id}/conclude with outcome SETTLED"
        actor: Mediator
        preconditions:
          - "charge.case_status == IN_MEDIATION"
          - "settlement_amount_cents present and > 0"
        side_effects:
          - "settlement_amount_cents stored; concluded_at = clock"
          - "charge -> CLOSED_SETTLED (see Charge.IN_MEDIATION_to_CLOSED_SETTLED); SCHEDULED sessions -> CANCELLED"
      - from: ACTIVE
        to: IMPASSE
        trigger: "POST /eeoc/mediation-cases/{id}/conclude with outcome IMPASSE"
        actor: Mediator
        preconditions:
          - "charge.case_status == IN_MEDIATION"
        side_effects:
          - "concluded_at = clock; SCHEDULED sessions -> CANCELLED"
          - "charge -> UNDER_INVESTIGATION (see Charge.IN_MEDIATION_to_UNDER_INVESTIGATION)"
      - from: SETTLED
        to: VACATED
        trigger: "POST /eeoc/charges/{id}/vacate-settlement"
        actor: Director
        preconditions:
          - "charge settled_via == MEDIATION and within VACATE_WINDOW_DAYS (10) of settled_at"
        side_effects:
          - "status -> VACATED; settlement_amount_cents retained for audit but charge.settled_amount_cents -> 0"

  - entity: MediationSession
    initial_state: SCHEDULED
    terminal_states: [HELD, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "system: lazy transition evaluated on read when logical clock > scheduled_end"
        actor: system
        preconditions: ["current logical clock time > scheduled_end"]
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "cascade: parent MediationCase concludes (SETTLED or IMPASSE) or charge withdrawn"
        actor: system
        preconditions: ["parent mediation concluded or charge withdrawn while session still SCHEDULED"]
        side_effects: []

  - entity: InvestigationCase
    initial_state: OPEN
    terminal_states: [CLOSED]
    note: "Auto-created (OPEN) when its Charge first enters UNDER_INVESTIGATION. Reopens CLOSED -> GATHERING on vacate-settlement."
    transitions:
      - from: OPEN
        to: GATHERING
        trigger: "POST /eeoc/investigation-cases/{id}/evidence-requests or POST /eeoc/investigation-cases/{id}/interviews (first evidence activity)"
        actor: Investigator
        preconditions:
          - "assigned_investigator_id == X-User-ID"
        side_effects: []
      - from: GATHERING
        to: SUSPENDED_MEDIATION
        trigger: "cascade: charge re-enters IN_MEDIATION on a re-offer"
        actor: system
        preconditions: ["charge transitions UNDER_INVESTIGATION -> IN_MEDIATION"]
        side_effects: []
      - from: SUSPENDED_MEDIATION
        to: GATHERING
        trigger: "cascade: mediation concludes IMPASSE (charge returns to UNDER_INVESTIGATION)"
        actor: system
        preconditions: ["charge transitions IN_MEDIATION -> UNDER_INVESTIGATION"]
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "cascade: charge reaches a terminal state (withdraw, RTS, amend-dismissal, determination approval)"
        actor: system
        preconditions: []
        side_effects: ["PENDING/OVERDUE EvidenceRequests -> WAIVED"]
      - from: GATHERING
        to: CLOSED
        trigger: "cascade: charge reaches a terminal state"
        actor: system
        preconditions: []
        side_effects: ["PENDING/OVERDUE EvidenceRequests -> WAIVED"]
      - from: SUSPENDED_MEDIATION
        to: CLOSED
        trigger: "cascade: charge reaches a terminal state while suspended (withdraw or RTS from IN_MEDIATION)"
        actor: system
        preconditions: []
        side_effects: ["PENDING/OVERDUE EvidenceRequests -> WAIVED"]
      - from: CLOSED
        to: GATHERING
        trigger: "cascade: POST /eeoc/charges/{id}/vacate-settlement reopens the charge"
        actor: system
        preconditions: ["charge CLOSED_SETTLED -> UNDER_INVESTIGATION via vacate"]
        side_effects: []

  - entity: EvidenceRequest
    initial_state: PENDING
    terminal_states: [RESPONDED, WAIVED]
    transitions:
      - from: PENDING
        to: OVERDUE
        trigger: "system: lazy transition evaluated on read when logical clock > due_date"
        actor: system
        preconditions: ["current logical clock date > due_date"]
        side_effects:
          - "InvestigationCase.overdue_request_count and open_request_count recomputed"
          - "InvestigationCase.priority_score recomputed; if >= ESCALATION_THRESHOLD (80) then charge.priority_escalated -> true (sticky)"
      - from: PENDING
        to: RESPONDED
        trigger: "POST /eeoc/evidence-requests/{id}/respond"
        actor: RespondentRep
        preconditions:
          - "X-User-ID == the employer_id of the charge owning the parent investigation"
        side_effects:
          - "response_text stored; responded_late = false"
          - "parent InvestigationCase.open_request_count recomputed; priority_score recomputed"
      - from: OVERDUE
        to: RESPONDED
        trigger: "POST /eeoc/evidence-requests/{id}/respond (late response accepted, flagged)"
        actor: RespondentRep
        preconditions:
          - "X-User-ID == the employer_id of the charge owning the parent investigation"
        side_effects:
          - "response_text stored; responded_late = true"
          - "parent InvestigationCase.open_request_count and overdue_request_count recomputed; priority_score recomputed"
      - from: PENDING
        to: WAIVED
        trigger: "cascade: owning charge reaches a terminal state"
        actor: system
        preconditions: []
        side_effects: ["parent InvestigationCase.open_request_count recomputed"]
      - from: OVERDUE
        to: WAIVED
        trigger: "cascade: owning charge reaches a terminal state"
        actor: system
        preconditions: []
        side_effects: ["parent InvestigationCase.open_request_count and overdue_request_count recomputed"]

  - entity: Determination
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: PENDING_REVIEW
        trigger: "POST /eeoc/determinations/{id}/submit"
        actor: Investigator
        preconditions:
          - "prepared_by_user_id == X-User-ID"
          - "charge.case_status == UNDER_INVESTIGATION"
        side_effects: ["charge UNDER_INVESTIGATION -> DETERMINATION_REVIEW"]
      - from: RETURNED
        to: PENDING_REVIEW
        trigger: "POST /eeoc/determinations/{id}/submit (resubmission cycle)"
        actor: Investigator
        preconditions:
          - "prepared_by_user_id == X-User-ID"
          - "charge.case_status == UNDER_INVESTIGATION"
        side_effects: ["charge UNDER_INVESTIGATION -> DETERMINATION_REVIEW"]
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /eeoc/determinations/{id}/review with decision APPROVE"
        actor: Director
        preconditions:
          - "X-User-ID != prepared_by_user_id (segregation of duties)"
        side_effects:
          - "reviewed_by_user_id = X-User-ID"
          - "outcome CAUSE: charge -> CONCILIATION with ConciliationProcess + PROVISIONAL RemedyPackage cascade"
          - "outcome NO_CAUSE or UNABLE_TO_DETERMINE: charge -> CLOSED_NO_CAUSE with AUTO_ON_DISMISSAL RightToSueNotice cascade"
      - from: PENDING_REVIEW
        to: RETURNED
        trigger: "POST /eeoc/determinations/{id}/review with decision RETURN"
        actor: Director
        preconditions:
          - "X-User-ID != prepared_by_user_id"
          - "return_reason present"
        side_effects:
          - "reviewed_by_user_id = X-User-ID; charge DETERMINATION_REVIEW -> UNDER_INVESTIGATION"

  - entity: ConciliationProcess
    initial_state: INITIATED
    terminal_states: [SETTLED, FAILED]
    transitions:
      - from: INITIATED
        to: OFFER_TABLED
        trigger: "POST /eeoc/conciliation-processes/{id}/offers (first offer)"
        actor: Director | RespondentRep
        preconditions:
          - "expected_conciliation_version == current version (OCC)"
        side_effects:
          - "current_offer_cents = amount_cents; last_offer_by = COMMISSION (Director) or RESPONDENT (RespondentRep); rounds_count += 1; version += 1"
      - from: OFFER_TABLED
        to: COUNTERED
        trigger: "POST /eeoc/conciliation-processes/{id}/offers by the OPPOSITE side"
        actor: Director | RespondentRep
        preconditions:
          - "offering side != last_offer_by (strict alternation; same side -> ERR_OFFER_OUT_OF_TURN)"
          - "expected_conciliation_version == current version (OCC)"
        side_effects:
          - "current_offer_cents = amount_cents; last_offer_by flips; rounds_count += 1; version += 1"
      - from: COUNTERED
        to: OFFER_TABLED
        trigger: "POST /eeoc/conciliation-processes/{id}/offers by the OPPOSITE side (cycle continues)"
        actor: Director | RespondentRep
        preconditions:
          - "offering side != last_offer_by"
          - "expected_conciliation_version == current version (OCC)"
        side_effects:
          - "current_offer_cents = amount_cents; last_offer_by flips; rounds_count += 1; version += 1"
      - from: OFFER_TABLED
        to: SETTLED
        trigger: "POST /eeoc/conciliation-processes/{id}/accept"
        actor: ChargingParty
        preconditions: ["X-User-ID == charge.complainant_id"]
        side_effects: ["charge CONCILIATION -> CLOSED_SETTLED with FINAL remedy recompute (see Charge transition)"]
      - from: COUNTERED
        to: SETTLED
        trigger: "POST /eeoc/conciliation-processes/{id}/accept"
        actor: ChargingParty
        preconditions: ["X-User-ID == charge.complainant_id"]
        side_effects: ["charge CONCILIATION -> CLOSED_SETTLED with FINAL remedy recompute"]
      - from: INITIATED
        to: FAILED
        trigger: "POST /eeoc/conciliation-processes/{id}/fail"
        actor: Director
        preconditions: []
        side_effects: ["charge CONCILIATION -> LITIGATION_REFERRED"]
      - from: OFFER_TABLED
        to: FAILED
        trigger: "POST /eeoc/conciliation-processes/{id}/fail"
        actor: Director
        preconditions: []
        side_effects: ["charge CONCILIATION -> LITIGATION_REFERRED"]
      - from: COUNTERED
        to: FAILED
        trigger: "POST /eeoc/conciliation-processes/{id}/fail"
        actor: Director
        preconditions: []
        side_effects: ["charge CONCILIATION -> LITIGATION_REFERRED"]

  - entity: RightToSueNotice
    initial_state: ISSUED
    terminal_states: [EXPIRED]
    transitions:
      - from: ISSUED
        to: EXPIRED
        trigger: "system: lazy transition evaluated on read when logical clock > court_filing_deadline"
        actor: system
        preconditions: ["current logical clock date > court_filing_deadline (still ISSUED at exactly the deadline date)"]
        side_effects: []

  - entity: SystemicCase
    initial_state: OPENED
    terminal_states: [RESOLVED]
    transitions:
      - from: OPENED
        to: EXPANDING
        trigger: "cascade: first POST /eeoc/systemic-cases/{id}/links"
        actor: system
        preconditions: ["linked_charge_count becomes >= 1"]
        side_effects: []
      - from: EXPANDING
        to: CONSOLIDATED
        trigger: "cascade: a link makes calculations.systemic_consolidation_threshold true"
        actor: system
        preconditions: [">= 3 linked non-terminal charges AND >= 2 of them share a basis with basis_focus"]
        side_effects: []
      - from: EXPANDING
        to: RESOLVED
        trigger: "cascade: a linked charge reaches a terminal state leaving zero linked non-terminal charges"
        actor: system
        preconditions: ["linked_charge_count >= 1 and no linked charge is non-terminal"]
        side_effects: ["every linked charge's disclosure_hold -> NONE"]
      - from: CONSOLIDATED
        to: RESOLVED
        trigger: "cascade: last linked non-terminal charge reaches a terminal state"
        actor: system
        preconditions: ["no linked charge is non-terminal"]
        side_effects: ["every linked charge's disclosure_hold -> NONE"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC-only; true races per the serial-observability filter)
# =============================================================================
concurrency_rules:
  - rule_id: charge-amend-stale-version
    parent_entity: Charge
    write_endpoint: "POST /eeoc/charges/{id}/amend"
    occ_field: "expected_charge_version"
    description: |
      Amending a Charge whose version has advanced since the client last
      observed it is rejected. A later amendment legitimately supersedes the
      prior factual allegations (basis_codes / incident_date), and the charge
      status does not change between two amendments, so a stale client would
      otherwise silently overwrite a newer amendment's edits.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: conciliation-offer-stale-version
    parent_entity: ConciliationProcess
    write_endpoint: "POST /eeoc/conciliation-processes/{id}/offers"
    occ_field: "expected_conciliation_version"
    description: |
      Tabling an offer against a ConciliationProcess whose version has advanced
      since the client last observed it is rejected. A newer offer changes
      current_offer_cents and last_offer_by without changing the negotiation
      status, so a stale client view is otherwise undetectable and would
      silently displace the newest offer.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: timeliness_deadline_resolution
    trigger: "at charge creation (POST /eeoc/charges) and again on any amend that changes incident_date"
    algorithm: threshold
    formula: |
      agency := DeferralAgency where state_code == employer.state_code (else null)
      deadline_days := agency ? agency.filing_deadline_days : FEDERAL_DEFAULT_DEADLINE_DAYS
      filing_deadline_date := incident_date + deadline_days days
      timely := (received_date <= filing_deadline_date)          # INCLUSIVE boundary
      size_ok(basis) :=
        if basis == AGE: employee_count_at_incident >= ADEA_MIN_EMPLOYEES AND (agency is null OR agency.covers_age)
        else:            employee_count_at_incident >= TITLE_VII_MIN_EMPLOYEES
      covered_bases := [b in basis_codes if size_ok(b)]          # preserves basis_codes order
      jurisdiction_outcome :=
        DISMISSED_NO_JURISDICTION  if covered_bases is empty
        DISMISSED_UNTIMELY         else if not timely
        TIMELY_CONFIRMED           otherwise
      # Evaluation order pinned: size screen FIRST, timeliness SECOND —
      # a charge failing both lands DISMISSED_NO_JURISDICTION.
    input_set: "the new Charge plus its Employer (state_code only) and matched DeferralAgency; never uses Employer.employee_count_current"
    constants:
      FEDERAL_DEFAULT_DEADLINE_DAYS: 180
      TITLE_VII_MIN_EMPLOYEES: 15
      ADEA_MIN_EMPLOYEES: 20
    precision: "date arithmetic on whole days; dates compared at day granularity"
    variants:
      - name: STANDARD_180
        when: "no deferral agency matches the employer's state_code"
        difference: "deadline_days = 180; a charge 181+ days after incident is DISMISSED_UNTIMELY"
      - name: DEFERRAL_EXTENDED_300
        when: "a deferral agency matches and its filing_deadline_days == 300"
        difference: "deadline_days = 300; the SAME incident_date/received_date pair that is untimely under STANDARD_180 is timely here"

  - name: employer_size_band_classification
    trigger: "on Employer creation and on every PATCH /eeoc/employers/{id}"
    algorithm: threshold
    formula: |
      band(count) :=
        UNDER_15        if count <= 14
        FROM_15_TO_19   if 15 <= count <= 19
        FROM_20_TO_100  if 20 <= count <= 100
        FROM_101_TO_200 if 101 <= count <= 200
        FROM_201_TO_500 if 201 <= count <= 500
        OVER_500        if count >= 501
      # Boundaries are INCLUSIVE at the low end of each band:
      # 14 -> UNDER_15, 15 -> FROM_15_TO_19, 20 -> FROM_20_TO_100, 100 -> FROM_20_TO_100, 101 -> FROM_101_TO_200.
    input_set: "Employer.employee_count_current for Employer.size_band; Charge.employee_count_at_incident for jurisdiction and FINAL remedy (the snapshot is never re-derived from the employer row)"
    constants:
      BAND_EDGE_TITLE_VII: 15
      BAND_EDGE_ADEA: 20
      BAND_EDGE_CAP_T1_MAX: 100
      BAND_EDGE_CAP_T2_MAX: 200
      BAND_EDGE_CAP_T3_MAX: 500
    precision: "integer comparison, inclusive lower bounds"
    variants:
      - name: COUNT_AT_INCIDENT
        when: "jurisdictional screening and FINAL remedy cap"
        difference: "uses the immutable Charge.employee_count_at_incident snapshot"
      - name: COUNT_CURRENT
        when: "Employer.size_band field and PROVISIONAL remedy cap"
        difference: "uses the mutable Employer.employee_count_current; a PATCH can shift this band and force provisional remedy recomputation"

  - name: remedy_valuation
    trigger: "PROVISIONAL: on ConciliationProcess creation (cause-approval cascade) and re-banded on PATCH /eeoc/employers/{id} while the conciliation is non-terminal; FINAL: on POST /eeoc/conciliation-processes/{id}/accept"
    algorithm: tiered_pricing
    formula: |
      # Pinned evaluation order (nested rounding — per-component rounding THEN sum):
      band := (variant == PROVISIONAL) ? Employer.size_band : band(charge.employee_count_at_incident)
      projection_date := (variant == PROVISIONAL) ? conciliation.created_at_date : accept_date
      interest_days := (projection_date - harm_start_date).days
      back_pay_interest_cents  := round_half_up(back_pay_cents  * ANNUAL_INTEREST_RATE * interest_days / 365)
      front_pay_interest_cents := round_half_up(front_pay_cents * ANNUAL_INTEREST_RATE * interest_days / 365)
      nonpecuniary := compensatory_damages_cents + punitive_damages_cents
      capped_nonpecuniary_cents := min(nonpecuniary, CAP_TIER_CENTS[band])
      total_cents := back_pay_cents + front_pay_cents + back_pay_interest_cents
                     + front_pay_interest_cents + capped_nonpecuniary_cents
      # The per-component round-then-sum order is LOAD-BEARING: with
      # back_pay = front_pay = 3650 and interest_days = 1 the pinned order
      # yields 1 + 1 = 2 cents of interest; sum-then-round would yield 1.
    input_set: "the RemedyPackage's four copied component fields and harm_start_date; Employer row (PROVISIONAL band); Charge snapshot (FINAL band); logical clock for dates"
    constants:
      ANNUAL_INTEREST_RATE: 0.05
      CAP_TIER_CENTS: {FROM_15_TO_19: 5000000, FROM_20_TO_100: 5000000, FROM_101_TO_200: 10000000, FROM_201_TO_500: 20000000, OVER_500: 30000000}
    precision: "integer cents; round_half_up applied per interest component before summation"
    variants:
      - name: PROVISIONAL
        when: "conciliation open (INITIATED/OFFER_TABLED/COUNTERED)"
        difference: "band from Employer.employee_count_current; interest accrues to the conciliation-initiation date"
      - name: FINAL
        when: "conciliation accept"
        difference: "band from the charge's employee_count_at_incident snapshot; interest accrues to the accept date; variant flips and never recomputes again"

  - name: investigation_priority_score
    trigger: "recomputed on every read of an InvestigationCase and on every EvidenceRequest transition of that case"
    algorithm: weighted_scoring
    formula: |
      severity := max(BASIS_SEVERITY_WEIGHT[b] for b in charge.basis_codes)
      days := charge.days_elapsed_since_filing
      age_component := 0  if days < 90
                       10 if 90 <= days <= 179
                       20 if 180 <= days <= 364
                       35 if days >= 365
      overdue_component := min(OVERDUE_PER_REQUEST * overdue_request_count, OVERDUE_COMPONENT_CAP)
      multiplier := SYSTEMIC_MULTIPLIER if charge.systemic_case_id is not null else 1.0
      raw := (severity + age_component + overdue_component) * multiplier
      priority_score := min(SCORE_CEILING, round_half_up(raw))
      # Non-linear: tiered age steps, a MAX over bases (not a sum), a capped
      # overdue term, and a multiplicative systemic boost, then a ceiling clamp.
      if priority_score >= ESCALATION_THRESHOLD: charge.priority_escalated := true  (sticky, once only)
    input_set: "Charge.basis_codes, Charge.days_elapsed_since_filing, InvestigationCase.overdue_request_count (OVERDUE only — PENDING/RESPONDED/WAIVED excluded), Charge.systemic_case_id"
    constants:
      BASIS_SEVERITY_WEIGHT: {RETALIATION: 30, DISABILITY: 25, AGE: 20, SEX: 15, RACE: 15, COLOR: 15, RELIGION: 15, NATIONAL_ORIGIN: 15, GENETIC_INFO: 15}
      OVERDUE_PER_REQUEST: 15
      OVERDUE_COMPONENT_CAP: 45
      SYSTEMIC_MULTIPLIER: 1.5
      SCORE_CEILING: 100
      ESCALATION_THRESHOLD: 80
    precision: "single round_half_up AFTER multiplication; ceiling clamp last"

  - name: systemic_consolidation_threshold
    trigger: "on every POST /eeoc/systemic-cases/{id}/links and on every linked charge's transition to a terminal state"
    algorithm: threshold
    formula: |
      linked := [Charge where systemic_case_id == this.id]
      linked_charge_count := len(linked)                                  # ALL statuses
      non_terminal := [c in linked if c.case_status not in TERMINAL_CHARGE_STATES]
      sharing := [c in non_terminal if intersection(c.basis_codes, basis_focus) non-empty]
      status :=
        OPENED       if linked_charge_count == 0
        RESOLVED     else if len(non_terminal) == 0
        CONSOLIDATED else if len(non_terminal) >= CONSOLIDATION_MIN_CHARGES and len(sharing) >= CONSOLIDATION_MIN_SHARED_BASIS
        EXPANDING    otherwise
      # TERMINAL_CHARGE_STATES := {DISMISSED_UNTIMELY, DISMISSED_NO_JURISDICTION,
      #   CLOSED_NO_CAUSE, RTS_ISSUED, WITHDRAWN} union {CLOSED_SETTLED}
      # i.e. every state NOT in {DOCKETED, IN_MEDIATION, UNDER_INVESTIGATION,
      #   DETERMINATION_REVIEW, CONCILIATION, DELEGATED_TO_FEPA, LITIGATION_REFERRED}.
    input_set: "all Charges with systemic_case_id == this SystemicCase.id"
    constants:
      CONSOLIDATION_MIN_CHARGES: 3
      CONSOLIDATION_MIN_SHARED_BASIS: 2
    precision: "integer counts; >= comparisons inclusive at the threshold"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role string is one of the nine declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Request body schema: required fields present, enum members valid, types match, conditional requirements met (outcome SETTLED requires settlement_amount_cents; outcome CAUSE requires the four remedy components + harm_start_date; decision RETURN requires return_reason; end strictly after start; basis_codes non-empty; agency filing_deadline_days in {180,300})"
    error_id: ERR_VALIDATION_FAILED
    http_status: 400
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Referenced resources exist: path-templated ids validated left to right (charge, then child collections, then child id), then body references (complainant_id, employer_id at intake; charge_id at systemic link)"
    error_id: ERR_CHARGE_NOT_FOUND
    http_status: 404
    applies_to: "all (resource-specific variants: ERR_EMPLOYER_NOT_FOUND, ERR_COMPLAINANT_NOT_FOUND, ERR_MEDIATION_CASE_NOT_FOUND, ERR_INVESTIGATION_CASE_NOT_FOUND, ERR_EVIDENCE_REQUEST_NOT_FOUND, ERR_DETERMINATION_NOT_FOUND, ERR_CONCILIATION_NOT_FOUND, ERR_SYSTEMIC_CASE_NOT_FOUND)"
  - priority: 5
    category: auth
    check: "Ownership scope: ChargingParty's X-User-ID == charge.complainant_id; RespondentRep's X-User-ID == charge.employer_id (and, at POST /eeoc/charges, == payload complainant_id); StateAgencyOfficer may only touch charges with investigation_owner == FEPA; evidence/interview/determination writes require X-User-ID == investigation.assigned_investigator_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "ownership-scoped endpoints"
  - priority: 6
    category: state
    check: "State preconditions of the target transition; on a terminal charge the specific ERR_CHARGE_ALREADY_CLOSED wins over the generic ERR_INVALID_STATE; a right-to-sue request against a charge in CONCILIATION returns the specific ERR_CONCILIATION_ACTIVE (a non-terminal ConciliationProcess blocks issuance)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "state-transition endpoints (variant ERR_CHARGE_ALREADY_CLOSED for terminal charges)"
  - priority: 7
    category: business_safety
    check: "Confidentiality & segregation-of-duties: (a) GET /eeoc/charges/{id} on a SEALED charge by any role outside {IntakeOfficer, Director, Commissioner} -> ERR_CONFIDENTIALITY_SEALED; (b) assign an investigator who was mediator_user_id on any MediationSession of the same charge -> ERR_SEGREGATION_OF_DUTIES; (c) determination review where X-User-ID == prepared_by_user_id -> ERR_SEGREGATION_OF_DUTIES; (d) POST disclosures on a SEALED charge with legal_basis != COURT_ORDER -> ERR_DISCLOSURE_FORBIDDEN"
    error_id: ERR_CONFIDENTIALITY_SEALED
    http_status: 403
    applies_to: "GET /eeoc/charges/{id}; POST /eeoc/investigation-cases/{id}/assign; POST /eeoc/determinations/{id}/review; POST /eeoc/charges/{id}/disclosures (variants ERR_SEGREGATION_OF_DUTIES 409, ERR_DISCLOSURE_FORBIDDEN 403)"
  - priority: 8
    category: business_constraint
    check: "Constraint satisfaction: duplicate agency state_code -> ERR_DUPLICATE_AGENCY_STATE; mediator session overlap (half-open [start,end), adjacency allowed) -> ERR_SESSION_OVERLAP; investigator interview gap < INTERVIEW_BUFFER_MINUTES (30) on either side -> ERR_INTERVIEW_BUFFER_CONFLICT; third mediation case for a charge -> ERR_MEDIATION_ROUND_EXHAUSTED; second non-terminal Determination for an investigation -> ERR_DETERMINATION_EXISTS; offer by the same side twice -> ERR_OFFER_OUT_OF_TURN; link to a RESOLVED systemic case or already-linked/terminal charge -> ERR_INVALID_STATE"
    error_id: ERR_DUPLICATE_AGENCY_STATE
    http_status: 409
    applies_to: "constraint endpoints (per-error variants as listed)"
  - priority: 9
    category: business_temporal
    check: "Temporal rules: charging-party RTS request with days_elapsed_since_filing < RTS_MIN_ELAPSED_DAYS (180) -> ERR_RTS_PREMATURE; mediation session scheduled_start before the logical clock -> ERR_SESSION_IN_PAST; vacate after settled_at + VACATE_WINDOW_DAYS (10) -> ERR_VACATE_WINDOW_EXPIRED; incident_date after the logical clock at intake -> ERR_INCIDENT_DATE_FUTURE"
    error_id: ERR_RTS_PREMATURE
    http_status: 422
    applies_to: "temporal-rule endpoints (per-error variants as listed)"
  - priority: 10
    category: business_referential
    check: "OCC precondition: expected_charge_version / expected_conciliation_version must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /eeoc/charges/{id}/amend; POST /eeoc/conciliation-processes/{id}/offers"

# =============================================================================
# §1.5 API Endpoint Table (all paths under api_prefix /eeoc)
# =============================================================================
endpoints:
  - method: POST
    path: "/eeoc/_clock/set_current_utc"
    description: "Test-driving endpoint: sets the logical clock. Before any call the clock reads exactly 2026-09-01T00:00:00Z (startup default, never wall-clock). All date stamps and lazy transitions derive from this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["lazy transitions (EvidenceRequest OVERDUE, RightToSueNotice EXPIRED, MediationSession HELD) evaluate against the new time on subsequent reads"]
  - method: POST
    path: "/eeoc/deferral-agencies"
    description: "Register a state/local fair-employment agency (config). One per state_code."
    roles: [PlatformAdmin]
    code: 201
    input: [state_code, agency_name, filing_deadline_days, work_sharing_policy, covers_age]
    output: DeferralAgency
    side_effects: []
  - method: POST
    path: "/eeoc/employers"
    description: "Register a respondent employer; size_band computed from employee_count_current."
    roles: [IntakeOfficer]
    code: 201
    input: [legal_name, state_code, employee_count_current]
    output: Employer
    side_effects: ["employer_size_band_classification"]
  - method: PATCH
    path: "/eeoc/employers/{id}"
    description: "Update verified headcount/legal name; recomputes size_band and re-bands every PROVISIONAL RemedyPackage on this employer's non-terminal conciliations (keeping each package's original projection_date)."
    roles: [IntakeOfficer]
    code: 200
    input: ["employee_count_current?", "legal_name?"]
    output: Employer
    side_effects: ["increments Employer.version by 1", "employer_size_band_classification", "remedy_valuation (PROVISIONAL re-band only)"]
  - method: POST
    path: "/eeoc/complainants"
    description: "Register a complainant (charging-party identity anchor)."
    roles: [IntakeOfficer]
    code: 201
    input: [full_name, email]
    output: Complainant
    side_effects: []
  - method: POST
    path: "/eeoc/charges"
    description: "Charge intake with synchronous jurisdictional screening. Never rejects for timeliness/size — records jurisdiction_outcome and lands in DOCKETED / DELEGATED_TO_FEPA / DISMISSED_UNTIMELY / DISMISSED_NO_JURISDICTION. ChargingParty callers must set complainant_id == X-User-ID."
    roles: [IntakeOfficer, ChargingParty]
    code: 201
    input: [complainant_id, employer_id, basis_codes, incident_date, harm_description, employee_count_at_incident]
    output: Charge
    side_effects: ["timeliness_deadline_resolution", "deferral-agency auto-match by employer.state_code", "work-sharing routing (investigation_owner, dual_filed)"]
  - method: GET
    path: "/eeoc/charges/{id}"
    description: "Charge detail. SEALED charges reject non-privileged roles (ERR_CONFIDENTIALITY_SEALED); privileged reads of a SEALED charge auto-append an INTERNAL_ACCESS DisclosureRecord."
    roles: [IntakeOfficer, ChargingParty, RespondentRep, Investigator, Mediator, Director, Commissioner, StateAgencyOfficer]
    code: 200
    input: []
    output: Charge
    side_effects: ["INTERNAL_ACCESS DisclosureRecord appended when disclosure_hold == SEALED and accessor is IntakeOfficer/Director/Commissioner"]
  - method: GET
    path: "/eeoc/charges"
    description: "Paginated charge list with filters. StateAgencyOfficer sees only FEPA-owned rows."
    roles: [IntakeOfficer, Investigator, Director, Commissioner, StateAgencyOfficer]
    code: 200
    input: ["status?", "employer_id?", "complainant_id?", "deferral_agency_id?", "systemic_case_id?", "basis?", "limit?", "offset?"]
    output: "Charge[]"
    side_effects: []
  - method: POST
    path: "/eeoc/charges/{id}/amend"
    description: "Amend factual allegations (OCC-guarded). Re-runs timeliness screening when incident_date changes; may flip the charge to DISMISSED_UNTIMELY. Blocked in DETERMINATION_REVIEW, CONCILIATION, and terminal states."
    roles: [ChargingParty]
    code: 200
    input: [expected_charge_version, "basis_codes?", "incident_date?", "harm_description?"]
    output: Charge
    side_effects: ["increments Charge.version by 1", "timeliness_deadline_resolution re-run when incident_date changes", "dismissal cascade when re-screening fails"]
  - method: POST
    path: "/eeoc/charges/{id}/withdraw"
    description: "Charging party withdraws. Allowed from DOCKETED, IN_MEDIATION, UNDER_INVESTIGATION, DELEGATED_TO_FEPA; blocked elsewhere."
    roles: [ChargingParty]
    code: 200
    input: []
    output: Charge
    side_effects: ["withdraw cascade per Charge state machine (mediation DECLINED, sessions CANCELLED, investigation CLOSED, requests WAIVED)"]
  - method: POST
    path: "/eeoc/charges/{id}/mediation-cases"
    description: "Offer mediation (initial offer or re-offer). Requires charge DOCKETED or UNDER_INVESTIGATION, every prior MediationCase terminal, and fewer than MAX_MEDIATION_ROUNDS (2) existing cases."
    roles: [IntakeOfficer]
    code: 201
    input: []
    output: MediationCase
    side_effects: ["round_number assigned"]
  - method: GET
    path: "/eeoc/charges/{id}/mediation-cases"
    description: "List a charge's mediation cases."
    roles: [IntakeOfficer, Mediator, Director, Commissioner, ChargingParty, RespondentRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "MediationCase[]"
    side_effects: []
  - method: GET
    path: "/eeoc/mediation-cases/{id}"
    description: "Mediation case detail. Firewall: the Investigator role is excluded from mediation content."
    roles: [IntakeOfficer, Mediator, Director, Commissioner, ChargingParty, RespondentRep]
    code: 200
    input: []
    output: MediationCase
    side_effects: []
  - method: POST
    path: "/eeoc/mediation-cases/{id}/respond"
    description: "Record the acting party's ACCEPTED/DECLINED. Second ACCEPTED activates mediation; any DECLINED closes it. Party derived from X-User-ID vs the charge's complainant_id/employer_id."
    roles: [ChargingParty, RespondentRep]
    code: 200
    input: [response]
    output: MediationCase
    side_effects: ["activation/decline cascades per MediationCase and Charge state machines"]
  - method: POST
    path: "/eeoc/mediation-cases/{id}/sessions"
    description: "Schedule a mediation session on the acting mediator's calendar. Half-open interval [start, end): back-to-back sessions are allowed, any true overlap with the mediator's other SCHEDULED sessions is rejected."
    roles: [Mediator]
    code: 201
    input: [scheduled_start, scheduled_end]
    output: MediationSession
    side_effects: ["mediator_user_id stamped from X-User-ID"]
  - method: GET
    path: "/eeoc/mediation-cases/{id}/sessions"
    description: "List sessions of a mediation case (lazy HELD transition applies)."
    roles: [Mediator, Director, IntakeOfficer, ChargingParty, RespondentRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "MediationSession[]"
    side_effects: []
  - method: POST
    path: "/eeoc/mediation-cases/{id}/conclude"
    description: "Conclude an ACTIVE mediation: outcome SETTLED (requires settlement_amount_cents) settles the charge; IMPASSE returns the charge to investigation."
    roles: [Mediator]
    code: 200
    input: [outcome, "settlement_amount_cents?"]
    output: MediationCase
    side_effects: ["settle/impasse cascades per MediationCase and Charge state machines"]
  - method: GET
    path: "/eeoc/investigation-cases/{id}"
    description: "Investigation case detail including live priority_score. Firewall: the Mediator role is excluded from investigation content."
    roles: [Investigator, Director, Commissioner]
    code: 200
    input: []
    output: InvestigationCase
    side_effects: ["investigation_priority_score recomputed on read"]
  - method: GET
    path: "/eeoc/investigation-cases"
    description: "Paginated investigation list; caseload observable via assigned_investigator_id + status filters."
    roles: [Investigator, Director, Commissioner]
    code: 200
    input: ["charge_id?", "status?", "assigned_investigator_id?", "limit?", "offset?"]
    output: "InvestigationCase[]"
    side_effects: []
  - method: POST
    path: "/eeoc/investigation-cases/{id}/assign"
    description: "Assign or reassign the investigator. Reassignment transfers the caseload slot. SoD: the target must not have served as mediator_user_id on any session of the same charge."
    roles: [Director]
    code: 200
    input: [investigator_user_id]
    output: InvestigationCase
    side_effects: ["assigned_investigator_id set/transferred", "investigation_priority_score recomputed"]

  - method: POST
    path: "/eeoc/investigation-cases/{id}/evidence-requests"
    description: "Issue a position-statement request, RFI, or document demand to the respondent. Only the assigned investigator; case must be OPEN or GATHERING."
    roles: [Investigator]
    code: 201
    input: [request_type]
    output: EvidenceRequest
    side_effects: ["due_date = issued_date + 30 days", "OPEN -> GATHERING on first activity", "open_request_count recomputed"]
  - method: GET
    path: "/eeoc/investigation-cases/{id}/evidence-requests"
    description: "List evidence requests (lazy OVERDUE transition applies). RespondentRep sees only requests against its own employer."
    roles: [Investigator, Director, Commissioner, RespondentRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "EvidenceRequest[]"
    side_effects: []
  - method: POST
    path: "/eeoc/evidence-requests/{id}/respond"
    description: "Respondent submits its response. Late responses (after due_date) are accepted and flagged responded_late."
    roles: [RespondentRep]
    code: 200
    input: [response_text]
    output: EvidenceRequest
    side_effects: ["status -> RESPONDED", "open/overdue counts and priority_score recomputed"]
  - method: POST
    path: "/eeoc/investigation-cases/{id}/interviews"
    description: "Log a witness interview (interviews are recorded after the fact; past dates allowed). The same investigator's interviews must keep a 30-minute buffer on BOTH sides: gap < 30 minutes to any existing interview is rejected."
    roles: [Investigator]
    code: 201
    input: [witness_name, interview_start, interview_end, summary]
    output: WitnessInterview
    side_effects: ["investigator_user_id stamped from X-User-ID", "OPEN -> GATHERING on first activity"]
  - method: GET
    path: "/eeoc/investigation-cases/{id}/interviews"
    description: "List witness interviews of an investigation."
    roles: [Investigator, Director]
    code: 200
    input: ["limit?", "offset?"]
    output: "WitnessInterview[]"
    side_effects: []
  - method: POST
    path: "/eeoc/investigation-cases/{id}/determinations"
    description: "Draft a determination. Only the assigned investigator; case must be GATHERING; at most one non-terminal Determination per investigation. CAUSE requires the four remedy components and harm_start_date."
    roles: [Investigator]
    code: 201
    input: [outcome, rationale, "back_pay_cents?", "front_pay_cents?", "compensatory_damages_cents?", "punitive_damages_cents?", "harm_start_date?"]
    output: Determination
    side_effects: ["prepared_by_user_id stamped from X-User-ID"]
  - method: GET
    path: "/eeoc/investigation-cases/{id}/determinations"
    description: "List determinations of an investigation."
    roles: [Investigator, Director]
    code: 200
    input: ["limit?", "offset?"]
    output: "Determination[]"
    side_effects: []
  - method: POST
    path: "/eeoc/determinations/{id}/submit"
    description: "Submit (or resubmit from RETURNED) a draft for Director review; moves the charge to DETERMINATION_REVIEW."
    roles: [Investigator]
    code: 200
    input: []
    output: Determination
    side_effects: ["charge UNDER_INVESTIGATION -> DETERMINATION_REVIEW"]
  - method: POST
    path: "/eeoc/determinations/{id}/review"
    description: "Director approves or returns a pending determination. Approving CAUSE cascades to conciliation with a PROVISIONAL RemedyPackage; approving NO_CAUSE/UNABLE_TO_DETERMINE closes the charge and auto-issues a right-to-sue notice."
    roles: [Director]
    code: 200
    input: [decision, "return_reason?"]
    output: Determination
    side_effects: ["approval/return cascades per Determination and Charge state machines"]
  - method: GET
    path: "/eeoc/charges/{id}/conciliation-processes"
    description: "List a charge's conciliation processes (0 or 1 rows)."
    roles: [Director, Commissioner, ChargingParty, RespondentRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "ConciliationProcess[]"
    side_effects: []
  - method: GET
    path: "/eeoc/conciliation-processes/{id}"
    description: "Conciliation detail (status, current_offer_cents, last_offer_by, rounds_count, version)."
    roles: [Director, Commissioner, ChargingParty, RespondentRep]
    code: 200
    input: []
    output: ConciliationProcess
    side_effects: []
  - method: POST
    path: "/eeoc/conciliation-processes/{id}/offers"
    description: "Table an offer (OCC-guarded). Sides must strictly alternate: Director tables as COMMISSION, RespondentRep as RESPONDENT. Status cycles OFFER_TABLED <-> COUNTERED."
    roles: [Director, RespondentRep]
    code: 200
    input: [amount_cents, expected_conciliation_version]
    output: ConciliationProcess
    side_effects: ["increments ConciliationProcess.version by 1", "rounds_count += 1", "current_offer_cents and last_offer_by updated"]
  - method: POST
    path: "/eeoc/conciliation-processes/{id}/accept"
    description: "Charging party accepts the outstanding offer: remedy recomputes as FINAL (incident-snapshot band, agreement-date interest) and the charge settles at current_offer_cents."
    roles: [ChargingParty]
    code: 200
    input: []
    output: ConciliationProcess
    side_effects: ["remedy_valuation FINAL", "charge -> CLOSED_SETTLED (settled_via CONCILIATION)"]
  - method: POST
    path: "/eeoc/conciliation-processes/{id}/fail"
    description: "Director declares conciliation failed; the charge is referred for litigation."
    roles: [Director]
    code: 200
    input: [reason]
    output: ConciliationProcess
    side_effects: ["charge -> LITIGATION_REFERRED"]
  - method: GET
    path: "/eeoc/conciliation-processes/{id}/remedy-packages"
    description: "List the conciliation's remedy package (exactly one row; PROVISIONAL until accept, FINAL after)."
    roles: [Director, ChargingParty, RespondentRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "RemedyPackage[]"
    side_effects: []
  - method: POST
    path: "/eeoc/charges/{id}/right-to-sue-notices"
    description: "Issue a right-to-sue notice. ChargingParty path requires days_elapsed_since_filing >= 180 and no active conciliation; Director may issue at discretion from any non-terminal, non-conciliating status; exactly one notice per charge."
    roles: [ChargingParty, Director]
    code: 201
    input: []
    output: RightToSueNotice
    side_effects: ["charge -> RTS_ISSUED with closure cascade (investigation CLOSED, requests WAIVED); mediation deliberately untouched"]
  - method: GET
    path: "/eeoc/charges/{id}/right-to-sue-notices"
    description: "List a charge's right-to-sue notices (lazy EXPIRED transition applies)."
    roles: [ChargingParty, Director, IntakeOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "RightToSueNotice[]"
    side_effects: []
  - method: POST
    path: "/eeoc/systemic-cases"
    description: "Commissioner opens a systemic investigation (commissioner charge or pattern-or-practice probe reaching beyond any individual complaint)."
    roles: [Commissioner]
    code: 201
    input: [title, basis_focus]
    output: SystemicCase
    side_effects: ["commissioner_user_id stamped from X-User-ID"]
  - method: POST
    path: "/eeoc/systemic-cases/{id}/links"
    description: "Link a non-terminal, not-yet-linked charge into the systemic case. Seals the charge (disclosure_hold -> SEALED), triggers the priority multiplier, and re-evaluates consolidation."
    roles: [Commissioner]
    code: 200
    input: [charge_id]
    output: SystemicCase
    side_effects: ["charge.systemic_case_id set", "charge.disclosure_hold -> SEALED", "systemic_consolidation_threshold re-evaluated"]
  - method: POST
    path: "/eeoc/charges/{id}/disclosures"
    description: "Record an authorized disclosure of charge data. On a SEALED charge only legal_basis COURT_ORDER is permitted."
    roles: [Director]
    code: 201
    input: [legal_basis, target_description]
    output: DisclosureRecord
    side_effects: []
  - method: GET
    path: "/eeoc/charges/{id}/disclosures"
    description: "Audit log of disclosures for a charge, including system-stamped INTERNAL_ACCESS rows."
    roles: [Director, Commissioner, IntakeOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "DisclosureRecord[]"
    side_effects: []
  - method: POST
    path: "/eeoc/charges/{id}/vacate-settlement"
    description: "Vacate a MEDIATION-path settlement within VACATE_WINDOW_DAYS (10) days: charge reopens to UNDER_INVESTIGATION, settlement zeroed, mediation VACATED, investigation reopened. Conciliation settlements are final and cannot be vacated."
    roles: [Director]
    code: 200
    input: [reason]
    output: Charge
    side_effects: ["vacate cascade per Charge.CLOSED_SETTLED_to_UNDER_INVESTIGATION"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - {id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing X-User-Role/X-User-ID header, or role string not among the nine declared roles"}
  - {id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role is authenticated but not in the endpoint's roles list"}
  - {id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Entity-backed or scoped role acting on a resource outside its ownership (wrong complainant/employer, non-FEPA charge for StateAgencyOfficer, unassigned investigator writing to a case)"}
  - {id: ERR_VALIDATION_FAILED, http: 400, condition: "Schema/enum/conditional-required failure (e.g. SETTLED without settlement_amount_cents, CAUSE without remedy components, RETURN without return_reason, end <= start, empty basis_codes, filing_deadline_days not in {180,300})"}
  - {id: ERR_CHARGE_NOT_FOUND, http: 404, condition: "No charge with the given id (existence precedes ownership and confidentiality)"}
  - {id: ERR_EMPLOYER_NOT_FOUND, http: 404, condition: "No employer with the given id"}
  - {id: ERR_COMPLAINANT_NOT_FOUND, http: 404, condition: "No complainant with the given id"}
  - {id: ERR_MEDIATION_CASE_NOT_FOUND, http: 404, condition: "No mediation case with the given id"}
  - {id: ERR_INVESTIGATION_CASE_NOT_FOUND, http: 404, condition: "No investigation case with the given id"}
  - {id: ERR_EVIDENCE_REQUEST_NOT_FOUND, http: 404, condition: "No evidence request with the given id"}
  - {id: ERR_DETERMINATION_NOT_FOUND, http: 404, condition: "No determination with the given id"}
  - {id: ERR_CONCILIATION_NOT_FOUND, http: 404, condition: "No conciliation process with the given id"}
  - {id: ERR_SYSTEMIC_CASE_NOT_FOUND, http: 404, condition: "No systemic case with the given id"}
  - {id: ERR_INVALID_STATE, http: 409, condition: "Target resource is in a state that forbids the requested transition (non-terminal but wrong state; also used for link gates on terminal/linked charges)"}
  - {id: ERR_CHARGE_ALREADY_CLOSED, http: 409, condition: "Operation attempted on a terminal charge (DISMISSED_*, CLOSED_NO_CAUSE, RTS_ISSUED, WITHDRAWN); outranks business-temporal errors"}
  - {id: ERR_STALE_VERSION, http: 412, condition: "OCC mismatch: expected_charge_version / expected_conciliation_version does not equal the parent's current version"}
  - {id: ERR_CONFIDENTIALITY_SEALED, http: 403, condition: "Read of a SEALED charge by a role outside {IntakeOfficer, Director, Commissioner}"}
  - {id: ERR_DISCLOSURE_FORBIDDEN, http: 403, condition: "Explicit disclosure on a SEALED charge with legal_basis other than COURT_ORDER"}
  - {id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Same person on both sides of a firewall: assignee previously mediated this charge, or reviewing Director == drafting investigator"}
  - {id: ERR_SESSION_OVERLAP, http: 409, condition: "Mediation session overlaps (half-open interval intersection) another SCHEDULED session of the same mediator"}
  - {id: ERR_INTERVIEW_BUFFER_CONFLICT, http: 409, condition: "Witness interview leaves < INTERVIEW_BUFFER_MINUTES (30) gap to another interview of the same investigator (either side)"}
  - {id: ERR_MEDIATION_ROUND_EXHAUSTED, http: 409, condition: "A third MediationCase is offered for a charge (MAX_MEDIATION_ROUNDS = 2)"}
  - {id: ERR_DETERMINATION_EXISTS, http: 409, condition: "A non-terminal Determination (DRAFT/PENDING_REVIEW/RETURNED) already exists for the investigation"}
  - {id: ERR_OFFER_OUT_OF_TURN, http: 409, condition: "Same side tables two offers in a row; offers must strictly alternate COMMISSION/RESPONDENT"}
  - {id: ERR_RTS_PREMATURE, http: 422, condition: "Charging-party right-to-sue request with days_elapsed_since_filing < RTS_MIN_ELAPSED_DAYS (180)"}
  - {id: ERR_CONCILIATION_ACTIVE, http: 409, condition: "Right-to-sue request while the charge is in CONCILIATION (a non-terminal ConciliationProcess blocks issuance); state-category specific variant at priority 6"}
  - {id: ERR_VACATE_WINDOW_EXPIRED, http: 422, condition: "Vacate attempted after charge.settled_at + VACATE_WINDOW_DAYS (10 days)"}
  - {id: ERR_SESSION_IN_PAST, http: 422, condition: "Mediation session scheduled_start is before the current logical clock (witness interviews are exempt — they are logged after the fact)"}
  - {id: ERR_INCIDENT_DATE_FUTURE, http: 422, condition: "incident_date is after the current logical clock at intake or amend"}
  - {id: ERR_DUPLICATE_AGENCY_STATE, http: 409, condition: "A DeferralAgency already exists for the given state_code"}

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "System operator managing the logical clock and deferral-agency configuration."
    identity: opaque
    exclusive_operations: ["POST /eeoc/_clock/set_current_utc", "POST /eeoc/deferral-agencies"]
    shared_operations: []
  - name: IntakeOfficer
    description: "Commission intake staff: registers employers/complainants, files charges, offers mediation."
    identity: opaque
    exclusive_operations: ["POST /eeoc/employers", "PATCH /eeoc/employers/{id}", "POST /eeoc/complainants", "POST /eeoc/charges/{id}/mediation-cases"]
    shared_operations: ["POST /eeoc/charges", "GET /eeoc/charges", "GET /eeoc/charges/{id}", "GET /eeoc/charges/{id}/mediation-cases", "GET /eeoc/mediation-cases/{id}", "GET /eeoc/mediation-cases/{id}/sessions", "GET /eeoc/charges/{id}/right-to-sue-notices", "GET /eeoc/charges/{id}/disclosures"]
  - name: ChargingParty
    description: "The person who filed the charge; acts only on own charges (X-User-ID == charge.complainant_id)."
    identity: "entity_backed:Complainant"
    exclusive_operations: ["POST /eeoc/charges/{id}/amend", "POST /eeoc/charges/{id}/withdraw", "POST /eeoc/conciliation-processes/{id}/accept"]
    shared_operations: ["POST /eeoc/charges", "GET /eeoc/charges/{id}", "GET /eeoc/charges/{id}/mediation-cases", "GET /eeoc/mediation-cases/{id}", "POST /eeoc/mediation-cases/{id}/respond", "GET /eeoc/mediation-cases/{id}/sessions", "GET /eeoc/charges/{id}/conciliation-processes", "GET /eeoc/conciliation-processes/{id}", "GET /eeoc/conciliation-processes/{id}/remedy-packages", "POST /eeoc/charges/{id}/right-to-sue-notices", "GET /eeoc/charges/{id}/right-to-sue-notices"]
  - name: RespondentRep
    description: "Respondent employer's representative; acts only on charges against own employer (X-User-ID == charge.employer_id)."
    identity: "entity_backed:Employer"
    exclusive_operations: ["POST /eeoc/evidence-requests/{id}/respond"]
    shared_operations: ["GET /eeoc/charges/{id}", "GET /eeoc/charges/{id}/mediation-cases", "GET /eeoc/mediation-cases/{id}", "POST /eeoc/mediation-cases/{id}/respond", "GET /eeoc/mediation-cases/{id}/sessions", "GET /eeoc/investigation-cases/{id}/evidence-requests", "GET /eeoc/charges/{id}/conciliation-processes", "GET /eeoc/conciliation-processes/{id}", "POST /eeoc/conciliation-processes/{id}/offers", "GET /eeoc/conciliation-processes/{id}/remedy-packages"]
  - name: Mediator
    description: "Neutral mediator; firewalled from all investigation content."
    identity: opaque
    exclusive_operations: ["POST /eeoc/mediation-cases/{id}/sessions", "POST /eeoc/mediation-cases/{id}/conclude"]
    shared_operations: ["GET /eeoc/charges/{id}", "GET /eeoc/charges/{id}/mediation-cases", "GET /eeoc/mediation-cases/{id}", "GET /eeoc/mediation-cases/{id}/sessions"]
  - name: Investigator
    description: "Enforcement investigator; firewalled from mediation content; writes only to assigned cases."
    identity: opaque
    exclusive_operations: ["POST /eeoc/investigation-cases/{id}/evidence-requests", "POST /eeoc/investigation-cases/{id}/interviews", "POST /eeoc/investigation-cases/{id}/determinations", "POST /eeoc/determinations/{id}/submit"]
    shared_operations: ["GET /eeoc/charges", "GET /eeoc/charges/{id}", "GET /eeoc/investigation-cases", "GET /eeoc/investigation-cases/{id}", "GET /eeoc/investigation-cases/{id}/evidence-requests", "GET /eeoc/investigation-cases/{id}/interviews", "GET /eeoc/investigation-cases/{id}/determinations"]
  - name: Director
    description: "Office director: assigns investigators, reviews determinations, manages conciliation offers/failure, disclosures, and settlement vacatur."
    identity: opaque
    exclusive_operations: ["POST /eeoc/investigation-cases/{id}/assign", "POST /eeoc/determinations/{id}/review", "POST /eeoc/conciliation-processes/{id}/fail", "POST /eeoc/charges/{id}/disclosures", "POST /eeoc/charges/{id}/vacate-settlement"]
    shared_operations: ["GET /eeoc/charges", "GET /eeoc/charges/{id}", "GET /eeoc/charges/{id}/mediation-cases", "GET /eeoc/mediation-cases/{id}", "GET /eeoc/mediation-cases/{id}/sessions", "GET /eeoc/investigation-cases", "GET /eeoc/investigation-cases/{id}", "GET /eeoc/investigation-cases/{id}/evidence-requests", "GET /eeoc/investigation-cases/{id}/interviews", "GET /eeoc/investigation-cases/{id}/determinations", "GET /eeoc/charges/{id}/conciliation-processes", "GET /eeoc/conciliation-processes/{id}", "POST /eeoc/conciliation-processes/{id}/offers", "GET /eeoc/conciliation-processes/{id}/remedy-packages", "POST /eeoc/charges/{id}/right-to-sue-notices", "GET /eeoc/charges/{id}/right-to-sue-notices", "GET /eeoc/charges/{id}/disclosures"]
  - name: Commissioner
    description: "Commissioner initiating systemic investigations and linking charges."
    identity: opaque
    exclusive_operations: ["POST /eeoc/systemic-cases", "POST /eeoc/systemic-cases/{id}/links"]
    shared_operations: ["GET /eeoc/charges", "GET /eeoc/charges/{id}", "GET /eeoc/charges/{id}/mediation-cases", "GET /eeoc/mediation-cases/{id}", "GET /eeoc/investigation-cases", "GET /eeoc/investigation-cases/{id}", "GET /eeoc/investigation-cases/{id}/evidence-requests", "GET /eeoc/charges/{id}/conciliation-processes", "GET /eeoc/conciliation-processes/{id}", "GET /eeoc/charges/{id}/disclosures"]
  - name: StateAgencyOfficer
    description: "FEPA partner staff; sees only charges whose investigation_owner == FEPA (work-sharing partition)."
    identity: opaque
    exclusive_operations: []
    shared_operations: ["GET /eeoc/charges", "GET /eeoc/charges/{id}"]
