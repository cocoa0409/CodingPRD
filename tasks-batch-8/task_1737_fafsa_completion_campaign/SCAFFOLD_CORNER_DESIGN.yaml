      - name: stale_and_tiebreaker_snapshot_projection
        claim_type: correct_result
        grounds:
          - state_machines.AidRecord
          - entities.AidRecord.fields.current_status
        distinguishing_aspect: "Projection ordering: an event with effective_date older than the current winner is stored but does NOT move current_status; an event with equal effective_date wins by later created_at."
        test_recipe:
          setup: ["Campaign exists; aid record imported SUBMITTED eff 2027-01-10, then advanced to COMPLETE eff 2027-02-01"]
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "C27", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 50000 }, captures: { camp: $.data.id } }
            - { call: "POST /fafsa/aid-records", as: DataImporter, payload: { campaign_id: "${camp}", external_ref: "EXT1", full_name: "Ana Lee", dob: "2009-03-04", school_code: "SC01", district_code: "D01", initial_status: "SUBMITTED", effective_date: "2027-01-10" }, captures: { ar: $.data.id } }
            - { call: "POST /fafsa/aid-records/${ar}/status-events", as: DataImporter, payload: { fafsa_status: "COMPLETE", effective_date: "2027-02-01" } }
          trigger:
            - { call: "POST /fafsa/aid-records/${ar}/status-events", as: DataImporter, payload: { fafsa_status: "STARTED", effective_date: "2027-01-20" } }
            - { call: "GET /fafsa/aid-records/${ar}", as: DataImporter, captures: { cur1: $.data.current_status, eff1: $.data.last_effective_date } }
            - { call: "POST /fafsa/aid-records/${ar}/status-events", as: DataImporter, payload: { fafsa_status: "VERIFICATION_SELECTED", effective_date: "2027-02-01" } }
            - { call: "GET /fafsa/aid-records/${ar}", as: DataImporter, captures: { cur2: $.data.current_status, eff2: $.data.last_effective_date } }
          assert:
            - "After stale event (eff 2027-01-20 < 2027-02-01): current_status stays COMPLETE, last_effective_date stays 2027-02-01"
            - "After tie event (eff == 2027-02-01, later import): current_status == VERIFICATION_SELECTED — created_at breaks the tie"
            - "GET status-events lists all 4 events (stale events are retained, not dropped)"

