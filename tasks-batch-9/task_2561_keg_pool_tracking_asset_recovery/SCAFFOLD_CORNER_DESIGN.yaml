            - "the Brewer's release returns HTTP 403 ERR_FORBIDDEN_ROLE — the two 403s on the same endpoint carry different error_ids"
            - "the operator's release returns HTTP 200 with stage == RELEASED, released_by_user_id == op-1 and released_at == 2026-08-01T13:00:00Z"
            - "Keg.${k1_id}: custody_state == IN_FLOAT, service_state == SERVICE_OK, last_pressure_test_at == 2026-08-01T12:00:00Z (the test instant, not the release instant), fills_at_last_pressure_test == 0 and dwell_started_at == 2026-08-01T13:00:00Z"
