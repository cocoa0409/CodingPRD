              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "GET /district-energy/connection-agreements/${cm1_id}"
              payload: {}
              as: BillingAnalyst
              captures: { cm1_v1: $.data.version }
            - call: "POST /district-energy/invoices"
              payload: { agreement_id: "${cm1_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", variant: "ESTIMATED", expected_agreement_version: "${cm1_v1}" }
              as: BillingAnalyst
              captures: { inv_june_id: $.data.id }
          trigger:
            - call: "GET /district-energy/connection-agreements/${cm1_id}"
              payload: {}
              as: BillingAnalyst
              captures: { cm1_v2: $.data.version }
            - call: "POST /district-energy/invoices"
              payload: { agreement_id: "${cm1_id}", period_start: "2026-06-15T00:00:00Z", period_end: "2026-07-15T00:00:00Z", variant: "ESTIMATED", expected_agreement_version: "${cm1_v2}" }
              as: BillingAnalyst
            - call: "POST /district-energy/invoices/${inv_june_id}/void"
              payload: { reason: "rebilling on a mid-month cycle" }
              as: BillingAnalyst
              captures: { june_void_state: $.data.invoice_state }
            - call: "GET /district-energy/connection-agreements/${cm1_id}"
              payload: {}
              as: BillingAnalyst
              captures: { cm1_v3: $.data.version }
            - call: "POST /district-energy/invoices"
              payload: { agreement_id: "${cm1_id}", period_start: "2026-06-15T00:00:00Z", period_end: "2026-07-15T00:00:00Z", variant: "ESTIMATED", expected_agreement_version: "${cm1_v3}" }
              as: BillingAnalyst
              captures: { inv_mid_id: $.data.id, mid_energy: $.data.billed_energy_mwh }
          assert:
            - "the first straddling invoice response status is 409 with data.error_id == ERR_INVOICE_PERIOD_OVERLAP"
            - "${june_void_state} == VOID"
            - "the second straddling invoice response status is 201"
            - "${mid_energy} == 1.000"
            - "Invoice.${inv_mid_id}.billed_demand_kw == 70.00"
            - "GET /district-energy/invoices?agreement_id=${cm1_id}&invoice_state=DRAFT has total_count == 1"
            - "GET /district-energy/invoices?agreement_id=${cm1_id}&invoice_state=VOID has total_count == 1"

      - name: aggregate_reservation_across_agreements_exceeds_the_loop_ceiling
        claim_type: Aggregate validation
        excluded_because:
          difficulty_instance: loop_capacity_ceiling_sweep_over_half_open_reservation_windows
          rationale: "Rule 8 instance 1 already covers the aggregate case: three individually legal peer reservations plus the candidate are swept at every window boundary against the 1.15 oversubscription ceiling, and only the collective total triggers ERR_LOOP_CAPACITY_EXCEEDED."

      - name: agreement_activation_depends_on_the_loop_posture_of_another_entity
        claim_type: Cross-entity validation
        excluded_because:
          difficulty_instance: agreement_activation_blocked_while_network_loop_is_isolated
          rationale: "Rule 7 instance 1 already tests both directions of the cross-entity guard: activation refused with ERR_LOOP_ISOLATED while the loop posture is ISOLATED, then accepted unchanged once the work order completes and the posture returns to NORMAL."

      - name: a_future_work_window_conflict_is_detected_at_permit_time
        claim_type: Temporal validation
        excluded_because:
          difficulty_instance: work_window_single_occupancy_with_six_hour_refill_buffer
          rationale: "Rule 8 instance 2 already tests the forward-looking window check, including the six-hour refill buffer added to the peer's window_end and the closed-interval boundary where a candidate starting exactly on the buffered end still conflicts."

  - section: Endpoints
    instances:
      - name: fuel_supply_contract_create_read_and_filtered_list_round_trip
        claim_type: Standard CRUD
        grounds:
          - entities.FuelSupplyContract
          - endpoints[POST /district-energy/fuel-supply-contracts]
          - endpoints[GET /district-energy/fuel-supply-contracts/{contract_id}]
          - endpoints[GET /district-energy/fuel-supply-contracts]
        distinguishing_aspect: "This API exposes no update or delete route for FuelSupplyContract — the only mutation surface is the /status action — so the CRUD contract is create, read one, and list with filters, and a GET by id after two further creates still returns the first row byte-for-byte."
        test_recipe:
          setup:
            - "No prerequisites; FuelSupplyContract has no parent."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemController
          trigger:
            - call: "POST /district-energy/fuel-supply-contracts"
              payload: { supplier_code: "FC-GAS-1", fuel_type: "NATURAL_GAS", contracted_energy_mwh_per_year: 90000.0, price_per_mwh: 34.50, delivery_firmness: "FIRM" }
              as: SystemController
              captures: { fc1_id: $.data.id, fc1_status: $.data.status, fc1_version: $.data.version }
            - call: "POST /district-energy/fuel-supply-contracts"
              payload: { supplier_code: "FC-GAS-2", fuel_type: "NATURAL_GAS", contracted_energy_mwh_per_year: 12000.0, price_per_mwh: 41.00, delivery_firmness: "INTERRUPTIBLE" }
              as: SystemController
              captures: { fc2_id: $.data.id }
            - call: "POST /district-energy/fuel-supply-contracts"
              payload: { supplier_code: "FC-BIO-1", fuel_type: "BIOMASS", contracted_energy_mwh_per_year: 30000.0, price_per_mwh: 52.00, delivery_firmness: "FIRM" }
              as: SystemController
              captures: { fc3_id: $.data.id }
            - call: "POST /district-energy/fuel-supply-contracts/${fc3_id}/status"
              payload: { status: "SUSPENDED", reason: "supplier default" }
              as: SystemController
              captures: { fc3_status: $.data.status }
            - call: "GET /district-energy/fuel-supply-contracts/${fc1_id}"
              payload: {}
              as: NetworkEngineer
              captures: { fc1_read_code: $.data.supplier_code, fc1_read_price: $.data.price_per_mwh, fc1_read_version: $.data.version }
            - call: "GET /district-energy/fuel-supply-contracts?fuel_type=NATURAL_GAS"
              payload: {}
              as: BillingAnalyst
            - call: "GET /district-energy/fuel-supply-contracts?status=ACTIVE&delivery_firmness=FIRM"
              payload: {}
              as: BillingAnalyst
          assert:
            - "all three create responses have status 201"
            - "${fc1_status} == ACTIVE by default and ${fc1_version} == 1"
            - "${fc1_read_code} == FC-GAS-1 and ${fc1_read_price} == 34.50"
            - "${fc1_read_version} == 1, unchanged by the later creates and by the status change on another row"
            - "${fc3_status} == SUSPENDED"
            - "GET /district-energy/fuel-supply-contracts?fuel_type=NATURAL_GAS has total_count == 2"
            - "GET /district-energy/fuel-supply-contracts?status=ACTIVE&delivery_firmness=FIRM has total_count == 1"
            - "GET /district-energy/fuel-supply-contracts has total_count == 3 and has_more == false"
            - "no PUT, PATCH or DELETE route exists for /district-energy/fuel-supply-contracts/{contract_id}"

      - name: metering_point_removal_action_locks_out_further_register_reads
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /district-energy/metering-points/{point_id}/remove]
          - state_machines.MeteringPoint.COMMISSIONED_to_REMOVED
          - errors[ERR_METER_STATE_INVALID]
        distinguishing_aspect: "The remove action is the only route out of COMMISSIONED and REMOVED is terminal, so after removal both a further reading append and a re-commission fail with ERR_METER_STATE_INVALID while the reading already banked before removal stays readable and keeps last_reading_energy_mwh at 42.500."
        test_recipe:
          setup:
            - "NetworkLoop LOOP-T with SEG-T1, RS-U and ACTIVE agreement CT1 (UNIVERSITY, reserved 800.0)."
            - "MeteringPoint MP-T1 (multiplier 1.0) commissioned, with one ACTUAL reading of 42.500 MWh."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemController
            - call: "POST /district-energy/network-loops"
              payload: { code: "LOOP-T", name: "Terrace Loop T", service_mode: "HEATING", design_supply_temp_c: 90.0, max_pressure_kpa: 1400.0, rated_capacity_kw: 6000.0 }
              as: SystemController
              captures: { loop_t_id: $.data.id }
            - call: "POST /district-energy/pipe-segments"
              payload: { loop_id: "${loop_t_id}", code: "SEG-T1", length_m: 350.0, diameter_mm: 150, install_year: 2019, insulation_class: "A", buried_depth_m: 1.2 }
              as: NetworkEngineer
              captures: { seg_t1_id: $.data.id }
            - call: "POST /district-energy/rate-schedules"
              payload: { code: "RS-U", customer_class: "UNIVERSITY", fixed_service_charge: 1500.00, demand_charge_per_kw: 11.00, minimum_bill_amount: 4500.00, tiers: [{ load_factor_max: 35.0, energy_rate_per_mwh: 85.00 }, { load_factor_max: 100.0, energy_rate_per_mwh: 66.00 }] }
              as: BillingAnalyst
              captures: { rs_u_id: $.data.id }
            - call: "POST /district-energy/connection-agreements"
              payload: { loop_id: "${loop_t_id}", rate_schedule_id: "${rs_u_id}", customer_name: "Terrace Institute", customer_class: "UNIVERSITY", reserved_capacity_kw: 800.0, service_mode: "HEATING", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2027-01-01T00:00:00Z" }
              as: BillingAnalyst
              captures: { ct1_id: $.data.id }
            - call: "POST /district-energy/connection-agreements/${ct1_id}/activate"
              payload: {}
              as: BillingAnalyst
            - call: "POST /district-energy/metering-points"
              payload: { agreement_id: "${ct1_id}", segment_id: "${seg_t1_id}", code: "MP-T1", multiplier: 1.0 }
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { mp_t1_id: $.data.id, mp_t1_state: $.data.meter_state }
            - call: "POST /district-energy/metering-points/${mp_t1_id}/commission"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { mp_t1_commissioned: $.data.meter_state }
            - call: "POST /district-energy/metering-points/${mp_t1_id}/readings"
              payload: { read_at: "2026-07-15T00:00:00Z", cumulative_energy_mwh: 42.500, peak_demand_kw: 610.0, read_type: "ACTUAL" }
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { reading_t1_id: $.data.id }
          trigger:
            - call: "POST /district-energy/metering-points/${mp_t1_id}/remove"
              payload: { reason: "customer switched to a direct-buried takeoff" }
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { mp_t1_removed: $.data.meter_state, mp_t1_last: $.data.last_reading_energy_mwh, mp_t1_count: $.data.reading_count }
            - call: "POST /district-energy/metering-points/${mp_t1_id}/readings"
              payload: { read_at: "2026-07-31T00:00:00Z", cumulative_energy_mwh: 50.000, peak_demand_kw: 640.0, read_type: "ACTUAL" }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /district-energy/metering-points/${mp_t1_id}/commission"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "GET /district-energy/metering-points/${mp_t1_id}/readings"
              payload: {}
              as: BillingAnalyst
          assert:
            - "${mp_t1_state} == INSTALLED and ${mp_t1_commissioned} == COMMISSIONED"
            - "the remove response status is 200 and ${mp_t1_removed} == REMOVED"
            - "${mp_t1_last} == 42.500 and ${mp_t1_count} == 1"
            - "the post-removal reading response status is 409 with data.error_id == ERR_METER_STATE_INVALID"
            - "the re-commission response status is 409 with data.error_id == ERR_METER_STATE_INVALID"
            - "GET /district-energy/metering-points/${mp_t1_id}/readings has total_count == 1"
            - "MeterReading.${reading_t1_id}.cumulative_energy_mwh == 42.500 is still readable after removal"

      - name: work_order_and_metering_point_links_must_agree_on_the_owning_loop
        claim_type: Cross-reference link
        grounds:
          - validations[priority 9 ERR_SEGMENT_LOOP_MISMATCH]
          - endpoints[POST /district-energy/work-orders]
          - endpoints[POST /district-energy/metering-points]
        distinguishing_aspect: "Both link endpoints carry two references that must resolve to the same NetworkLoop: a WorkOrder naming LOOP-Y1 but SEG-Y2 is refused, and a MeteringPoint whose agreement sits on LOOP-Y1 while its segment sits on LOOP-Y2 is refused too — the same error from two different pairs of fields, while the consistent pair succeeds and stores both references."
        test_recipe:
          setup:
            - "NetworkLoop LOOP-Y1 with SEG-Y1 and NetworkLoop LOOP-Y2 with SEG-Y2."
            - "RS-U and ACTIVE agreement CY1 (UNIVERSITY, reserved 600.0) on LOOP-Y1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemController
            - call: "POST /district-energy/network-loops"
              payload: { code: "LOOP-Y1", name: "Yard Loop One", service_mode: "HEATING", design_supply_temp_c: 90.0, max_pressure_kpa: 1400.0, rated_capacity_kw: 5000.0 }
              as: SystemController
              captures: { loop_y1_id: $.data.id }
            - call: "POST /district-energy/network-loops"
              payload: { code: "LOOP-Y2", name: "Yard Loop Two", service_mode: "HEATING", design_supply_temp_c: 90.0, max_pressure_kpa: 1400.0, rated_capacity_kw: 5000.0 }
              as: SystemController
              captures: { loop_y2_id: $.data.id }
            - call: "POST /district-energy/pipe-segments"
              payload: { loop_id: "${loop_y1_id}", code: "SEG-Y1", length_m: 500.0, diameter_mm: 200, install_year: 2015, insulation_class: "A", buried_depth_m: 1.3 }
              as: NetworkEngineer
              captures: { seg_y1_id: $.data.id }
            - call: "POST /district-energy/pipe-segments"
              payload: { loop_id: "${loop_y2_id}", code: "SEG-Y2", length_m: 500.0, diameter_mm: 200, install_year: 2015, insulation_class: "A", buried_depth_m: 1.3 }
              as: NetworkEngineer
              captures: { seg_y2_id: $.data.id }
            - call: "POST /district-energy/rate-schedules"
              payload: { code: "RS-U", customer_class: "UNIVERSITY", fixed_service_charge: 1500.00, demand_charge_per_kw: 11.00, minimum_bill_amount: 4500.00, tiers: [{ load_factor_max: 35.0, energy_rate_per_mwh: 85.00 }, { load_factor_max: 100.0, energy_rate_per_mwh: 66.00 }] }
              as: BillingAnalyst
              captures: { rs_u_id: $.data.id }
            - call: "POST /district-energy/connection-agreements"
              payload: { loop_id: "${loop_y1_id}", rate_schedule_id: "${rs_u_id}", customer_name: "Yard Campus", customer_class: "UNIVERSITY", reserved_capacity_kw: 600.0, service_mode: "HEATING", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2027-01-01T00:00:00Z" }
              as: BillingAnalyst
              captures: { cy1_id: $.data.id }
            - call: "POST /district-energy/connection-agreements/${cy1_id}/activate"
              payload: {}
              as: BillingAnalyst
          trigger:
            - call: "POST /district-energy/work-orders"
              payload: { segment_id: "${seg_y2_id}", loop_id: "${loop_y1_id}", work_type: "INSPECTION", window_start: "2026-09-01T08:00:00Z", window_end: "2026-09-01T16:00:00Z", requires_isolation: false }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /district-energy/metering-points"
              payload: { agreement_id: "${cy1_id}", segment_id: "${seg_y2_id}", code: "MP-Y-BAD", multiplier: 1.0 }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /district-energy/work-orders"
              payload: { segment_id: "${seg_y1_id}", loop_id: "${loop_y1_id}", work_type: "INSPECTION", window_start: "2026-09-01T08:00:00Z", window_end: "2026-09-01T16:00:00Z", requires_isolation: false }
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { wo_ok_id: $.data.id, wo_ok_segment: $.data.segment_id, wo_ok_loop: $.data.loop_id, wo_ok_reporter: $.data.reported_by_user_id }
            - call: "POST /district-energy/metering-points"
              payload: { agreement_id: "${cy1_id}", segment_id: "${seg_y1_id}", code: "MP-Y-OK", multiplier: 1.0 }
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { mp_ok_id: $.data.id, mp_ok_segment: $.data.segment_id, mp_ok_agreement: $.data.agreement_id }
          assert:
            - "the first work-order response status is 409 with data.error_id == ERR_SEGMENT_LOOP_MISMATCH"
            - "the first metering-point response status is 409 with data.error_id == ERR_SEGMENT_LOOP_MISMATCH"
            - "the second work-order response status is 201 with ${wo_ok_segment} == ${seg_y1_id} and ${wo_ok_loop} == ${loop_y1_id}"
