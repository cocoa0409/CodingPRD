# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Automatic Portability & Small-Balance Force-Out.
# Breadth walk over §1.1–§1.7 per references/claim-extraction-guide.md.
# Names are unique across this file and SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: recordkeeper_create_defaults_and_initial_state
        claim_type: creation
        grounds: ["entities.Recordkeeper", "state_machines.Recordkeeper"]
        distinguishing_aspect: "A created recordkeeper starts PENDING_ONBOARD with version 1, exited_at null, and server-minted id/created_at — before any activate call."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /recordkeepers", payload: { recordkeeper_code: "RK-A", legal_name: "Recordkeeper A" }, as: ProviderOps, captures: { rk: $.data.id } }
          assert:
            - "201; Recordkeeper.${rk}.network_status == PENDING_ONBOARD (initial_state), version == 1, exited_at == null"
            - "id is a server-minted UUID; created_at == logical clock 2026-08-01T00:00:00.000Z"

      - name: plan_create_applies_defaults_and_computes_reachability
        claim_type: defaults
        grounds: ["entities.Plan", "calculations.force_out_path_selection"]
        distinguishing_aspect: "Omitting every optional field applies the documented defaults (thresholds 100000/700000, rate 0, PROCESSING_DATE, both flags true) and computes network_reachable from the recordkeeper."
        test_recipe:
          setup: ["ACTIVE recordkeeper ${rk}"]
          setup_api_calls:
            - { call: "POST /recordkeepers", payload: { recordkeeper_code: "RK-A", legal_name: "Recordkeeper A" }, as: ProviderOps, captures: { rk: $.data.id } }
            - { call: "POST /recordkeepers/${rk}/activate", payload: {}, as: ProviderOps }
          trigger:
            - { call: "POST /plans", payload: { plan_name: "Plan X", sponsor_ein: "11-1111111", recordkeeper_id: "${rk}" }, as: PlanSponsor, captures: { pl: $.data.id } }
          assert:
            - "Plan.${pl}: cash_out_threshold_cents == 100000, rollover_threshold_cents == 700000, state_withholding_rate == 0, valuation_basis == PROCESSING_DATE, auto_portability_enabled == true, accepts_incoming_transfers == true"
            - "network_reachable == true (recordkeeper ACTIVE and accepts flag true); plan_status == ACTIVE"

      - name: participant_create_system_fields_input_ignored
        claim_type: system_fields
        grounds: ["entities.Participant"]
        distinguishing_aspect: "Client-supplied id/created_at/version in the create payload are ignored; the server mints its own."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /participants", payload: { id: "00000000-0000-0000-0000-000000000000", created_at: "2001-01-01T00:00:00Z", ssn_hash: "hash-a", full_name: "Ann A", date_of_birth: "1980-01-01", mailing_address_line1: "1 Main St", mailing_city: "Springfield", mailing_state: "IL", mailing_zip: "62701" }, as: PlanSponsor, captures: { p: $.data.id } }
          assert:
            - "201; Participant.${p}.id != the client-supplied UUID; created_at == 2026-08-01T00:00:00.000Z (logical clock), version == 1"
            - "address_quality == UNVERIFIED (default)"

      - name: plan_get_not_found_returns_404
        claim_type: not_found
        grounds: ["entities.Plan", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns the error envelope with ERR_NOT_FOUND/404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /plans/00000000-0000-0000-0000-000000000000", payload: {}, as: ProviderOps, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND, http 404"

      - name: case_create_with_unknown_batch_returns_not_found
        claim_type: parent_relationships
        grounds: ["entities.DistributionCase.fields.distribution_batch_id", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "FK integrity: a case referencing a non-existent batch id fails existence validation before any state or business rule runs."
        test_recipe:
          setup: ["one plan ${pl}, one participant ${p}"]
          setup_api_calls:
            - { call: "POST /recordkeepers", payload: { recordkeeper_code: "RK-A", legal_name: "Recordkeeper A" }, as: ProviderOps, captures: { rk: $.data.id } }
            - { call: "POST /recordkeepers/${rk}/activate", payload: {}, as: ProviderOps }
            - { call: "POST /plans", payload: { plan_name: "Plan X", sponsor_ein: "11-1111111", recordkeeper_id: "${rk}" }, as: PlanSponsor, captures: { pl: $.data.id } }
            - { call: "POST /participants", payload: { ssn_hash: "hash-a", full_name: "Ann A", date_of_birth: "1980-01-01", mailing_address_line1: "1 Main St", mailing_city: "Springfield", mailing_state: "IL", mailing_zip: "62701" }, as: PlanSponsor, captures: { p: $.data.id } }
          trigger:
            - { call: "POST /distribution-cases", payload: { distribution_batch_id: "00000000-0000-0000-0000-000000000000", plan_id: "${pl}", participant_id: "${p}", separation_date: "2026-07-15T00:00:00Z", separation_date_balance_cents: 50000, processing_date_balance_cents: 50000 }, as: PlanSponsor, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND, http 404"

      - name: fee_assessment_immutable_event_entity
        claim_type: immutability
        grounds: ["entities.IRAFeeAssessment"]
        distinguishing_aspect: "common_fields: false — the ledger entry carries id and created_at but no version/updated_at, and no PATCH/DELETE endpoint exists for it."
        test_recipe:
          setup: ["IRA ${ira} OPEN funded 300000 with FEE_DISCLOSURE delivered; clock 2026-09-01"]
          setup_api_calls:
            - { call: "POST /recordkeepers", payload: { recordkeeper_code: "RK-A", legal_name: "Recordkeeper A" }, as: ProviderOps, captures: { rk_a: $.data.id } }
            - { call: "POST /recordkeepers/${rk_a}/activate", payload: {}, as: ProviderOps }
            - { call: "POST /plans", payload: { plan_name: "Plan X", sponsor_ein: "11-1111111", recordkeeper_id: "${rk_a}" }, as: PlanSponsor, captures: { plan_x: $.data.id } }
            - { call: "POST /participants", payload: { ssn_hash: "hash-a", full_name: "Ann A", date_of_birth: "1980-01-01", mailing_address_line1: "1 Main St", mailing_city: "Springfield", mailing_state: "IL", mailing_zip: "62701" }, as: PlanSponsor, captures: { p_a: $.data.id } }
            - { call: "POST /distribution-batches", payload: { plan_id: "${plan_x}" }, as: PlanSponsor, captures: { b_x: $.data.id } }
            - { call: "POST /distribution-cases", payload: { distribution_batch_id: "${b_x}", plan_id: "${plan_x}", participant_id: "${p_a}", separation_date: "2026-07-15T00:00:00Z", separation_date_balance_cents: 300000, processing_date_balance_cents: 300000 }, as: PlanSponsor, captures: { c_a: $.data.id } }
            - { call: "POST /distribution-batches/${b_x}/lock", payload: {}, as: PlanSponsor }
            - { call: "POST /distribution-cases/${c_a}/notices", payload: { notice_type: "FORCE_OUT_ELECTION" }, as: ProviderOps, captures: { n_a: $.data.id } }
            - { call: "POST /notices/${n_a}/record-delivery", payload: { outcome: "DELIVERED" }, as: ProviderOps }
            - { call: "GET /distribution-cases/${c_a}", payload: {}, as: ProviderOps, captures: { c_a_v: $.data.version } }
            - { call: "POST /distribution-cases/${c_a}/elections", payload: { election_type: "SAFE_HARBOR_IRA", expected_case_version: "${c_a_v}" }, as: Participant, as_user_id: "${p_a}" }
            - { call: "POST /distribution-batches/${b_x}/execute", payload: {}, as: ProviderOps, as_user_id: "ops_exec_1" }
            - { call: "POST /safe-harbor-iras", payload: { distribution_case_id: "${c_a}" }, as: ProviderOps, captures: { ira: $.data.id } }
            - { call: "POST /distribution-cases/${c_a}/notices", payload: { notice_type: "FEE_DISCLOSURE" }, as: ProviderOps, captures: { nf: $.data.id } }
            - { call: "POST /notices/${nf}/record-delivery", payload: { outcome: "DELIVERED" }, as: ProviderOps }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProviderOps }
            - { call: "POST /safe-harbor-iras/${ira}/assess-fee", payload: {}, as: ProviderOps, captures: { fee: $.data.id } }
          trigger:
            - { call: "GET /fee-assessments/${fee}", payload: {}, as: ProviderOps }
          assert:
            - "IRAFeeAssessment.${fee} has id and created_at but no version or updated_at key"
            - "amount_cents == 510, days_in_period == 31, day_count_convention == ACTUAL_365, period_end == 2026-09-01T00:00:00.000Z"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: check_reissue_from_issued_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Check.VOIDED_to_VOIDED"]
        distinguishing_aspect: "Reissue is only defined from VOIDED; an ISSUED check rejects reissue with ERR_INVALID_STATE and spawns no successor."
        test_recipe:
          setup: ["Case EXECUTED via elected LUMP_SUM_CASH; check ${chk} ISSUED at default clock"]
          setup_api_calls:
            - { call: "POST /recordkeepers", payload: { recordkeeper_code: "RK-A", legal_name: "Recordkeeper A" }, as: ProviderOps, captures: { rk_a: $.data.id } }
            - { call: "POST /recordkeepers/${rk_a}/activate", payload: {}, as: ProviderOps }
            - { call: "POST /plans", payload: { plan_name: "Plan X", sponsor_ein: "11-1111111", recordkeeper_id: "${rk_a}" }, as: PlanSponsor, captures: { plan_x: $.data.id } }
            - { call: "POST /participants", payload: { ssn_hash: "hash-a", full_name: "Ann A", date_of_birth: "1980-01-01", mailing_address_line1: "1 Main St", mailing_city: "Springfield", mailing_state: "IL", mailing_zip: "62701" }, as: PlanSponsor, captures: { p_a: $.data.id } }
            - { call: "POST /distribution-batches", payload: { plan_id: "${plan_x}" }, as: PlanSponsor, captures: { b_x: $.data.id } }
            - { call: "POST /distribution-cases", payload: { distribution_batch_id: "${b_x}", plan_id: "${plan_x}", participant_id: "${p_a}", separation_date: "2026-07-15T00:00:00Z", separation_date_balance_cents: 100000, processing_date_balance_cents: 100000 }, as: PlanSponsor, captures: { c_a: $.data.id } }
            - { call: "POST /distribution-batches/${b_x}/lock", payload: {}, as: PlanSponsor }
            - { call: "POST /distribution-cases/${c_a}/notices", payload: { notice_type: "FORCE_OUT_ELECTION" }, as: ProviderOps, captures: { n_a: $.data.id } }
            - { call: "POST /notices/${n_a}/record-delivery", payload: { outcome: "DELIVERED" }, as: ProviderOps }
            - { call: "GET /distribution-cases/${c_a}", payload: {}, as: ProviderOps, captures: { c_a_v: $.data.version } }
            - { call: "POST /distribution-cases/${c_a}/elections", payload: { election_type: "LUMP_SUM_CASH", expected_case_version: "${c_a_v}" }, as: Participant, as_user_id: "${p_a}" }
            - { call: "POST /distribution-batches/${b_x}/execute", payload: {}, as: ProviderOps, as_user_id: "ops_exec_1" }
            - { call: "POST /checks", payload: { distribution_case_id: "${c_a}" }, as: ProviderOps, captures: { chk: $.data.id } }
          trigger:
            - { call: "POST /checks/${chk}/reissue", payload: {}, as: ProviderOps, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE, http 409; Check.${chk}.check_status remains ISSUED; no successor created"

      - name: recordkeeper_exit_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Recordkeeper"]
        distinguishing_aspect: "EXITED is terminal: activate, suspend, and a second exit all fail with ERR_INVALID_STATE."
        test_recipe:
          setup: ["recordkeeper ${rk} ACTIVE then EXITED"]
          setup_api_calls:
            - { call: "POST /recordkeepers", payload: { recordkeeper_code: "RK-A", legal_name: "Recordkeeper A" }, as: ProviderOps, captures: { rk: $.data.id } }
            - { call: "POST /recordkeepers/${rk}/activate", payload: {}, as: ProviderOps }
            - { call: "POST /recordkeepers/${rk}/exit", payload: {}, as: ProviderOps }
          trigger:
            - { call: "POST /recordkeepers/${rk}/activate", payload: {}, as: ProviderOps, captures: { e1: $.data.error_id } }
            - { call: "POST /recordkeepers/${rk}/suspend", payload: {}, as: ProviderOps, captures: { e2: $.data.error_id } }
          assert:
            - "e1 == ERR_INVALID_STATE and e2 == ERR_INVALID_STATE (both 409)"
            - "Recordkeeper.${rk}.network_status remains EXITED"

      - name: cancelled_case_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.DistributionCase"]
        distinguishing_aspect: "CANCELLED is terminal: sending a notice to a cancelled case fails; the case never re-enters the workflow."
        test_recipe:
          setup: ["case ${c_a} CANCELLED from IDENTIFIED before lock? no — cancel requires IDENTIFIED/NOTIFIED; batch OPEN case created then cancelled"]
          setup_api_calls:
            - { call: "POST /recordkeepers", payload: { recordkeeper_code: "RK-A", legal_name: "Recordkeeper A" }, as: ProviderOps, captures: { rk_a: $.data.id } }
            - { call: "POST /recordkeepers/${rk_a}/activate", payload: {}, as: ProviderOps }
            - { call: "POST /plans", payload: { plan_name: "Plan X", sponsor_ein: "11-1111111", recordkeeper_id: "${rk_a}" }, as: PlanSponsor, captures: { plan_x: $.data.id } }
            - { call: "POST /participants", payload: { ssn_hash: "hash-a", full_name: "Ann A", date_of_birth: "1980-01-01", mailing_address_line1: "1 Main St", mailing_city: "Springfield", mailing_state: "IL", mailing_zip: "62701" }, as: PlanSponsor, captures: { p_a: $.data.id } }
            - { call: "POST /distribution-batches", payload: { plan_id: "${plan_x}" }, as: PlanSponsor, captures: { b_x: $.data.id } }
            - { call: "POST /distribution-cases", payload: { distribution_batch_id: "${b_x}", plan_id: "${plan_x}", participant_id: "${p_a}", separation_date: "2026-07-15T00:00:00Z", separation_date_balance_cents: 50000, processing_date_balance_cents: 50000 }, as: PlanSponsor, captures: { c_a: $.data.id } }
            - { call: "POST /distribution-batches/${b_x}/lock", payload: {}, as: PlanSponsor }
          trigger:
            - { call: "POST /distribution-cases/${c_a}/cancel", payload: {}, as: PlanSponsor }
            - { call: "POST /distribution-cases/${c_a}/notices", payload: { notice_type: "FORCE_OUT_ELECTION" }, as: ProviderOps, captures: { err: $.data.error_id } }
          assert:
            - "After cancel: case_status == CANCELLED"
            - "Notice on cancelled case: err == ERR_INVALID_STATE, http 409"

      - name: election_void_after_window_closed
        claim_type: precondition_enforcement
        grounds: ["state_machines.Election.SUBMITTED_to_VOIDED", "errors[ERR_ELECTION_WINDOW_CLOSED]"]
        distinguishing_aspect: "Voiding is window-gated like submission: after the deadline the SUBMITTED election can no longer be revoked (ERR_ELECTION_WINDOW_CLOSED) and stands for execution."
        test_recipe:
          setup: ["case NOTIFIED, notice delivered 2026-08-01 (deadline 2026-08-31T00:00:00.000Z); participant submitted LUMP_SUM_CASH; clock advanced to 2026-09-01T00:00:00Z (no sweep)"]
          setup_api_calls:
            - { call: "POST /recordkeepers", payload: { recordkeeper_code: "RK-A", legal_name: "Recordkeeper A" }, as: ProviderOps, captures: { rk_a: $.data.id } }
            - { call: "POST /recordkeepers/${rk_a}/activate", payload: {}, as: ProviderOps }
            - { call: "POST /plans", payload: { plan_name: "Plan X", sponsor_ein: "11-1111111", recordkeeper_id: "${rk_a}" }, as: PlanSponsor, captures: { plan_x: $.data.id } }
            - { call: "POST /participants", payload: { ssn_hash: "hash-a", full_name: "Ann A", date_of_birth: "1980-01-01", mailing_address_line1: "1 Main St", mailing_city: "Springfield", mailing_state: "IL", mailing_zip: "62701" }, as: PlanSponsor, captures: { p_a: $.data.id } }
            - { call: "POST /distribution-batches", payload: { plan_id: "${plan_x}" }, as: PlanSponsor, captures: { b_x: $.data.id } }
            - { call: "POST /distribution-cases", payload: { distribution_batch_id: "${b_x}", plan_id: "${plan_x}", participant_id: "${p_a}", separation_date: "2026-07-15T00:00:00Z", separation_date_balance_cents: 100000, processing_date_balance_cents: 100000 }, as: PlanSponsor, captures: { c_a: $.data.id } }
            - { call: "POST /distribution-batches/${b_x}/lock", payload: {}, as: PlanSponsor }
            - { call: "POST /distribution-cases/${c_a}/notices", payload: { notice_type: "FORCE_OUT_ELECTION" }, as: ProviderOps, captures: { n_a: $.data.id } }
            - { call: "POST /notices/${n_a}/record-delivery", payload: { outcome: "DELIVERED" }, as: ProviderOps }
            - { call: "GET /distribution-cases/${c_a}", payload: {}, as: ProviderOps, captures: { c_a_v: $.data.version } }
            - { call: "POST /distribution-cases/${c_a}/elections", payload: { election_type: "LUMP_SUM_CASH", expected_case_version: "${c_a_v}" }, as: Participant, as_user_id: "${p_a}", captures: { el: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProviderOps }
          trigger:
            - { call: "POST /elections/${el}/void", payload: {}, as: Participant, as_user_id: "${p_a}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_ELECTION_WINDOW_CLOSED, http 422; Election.${el}.election_status remains SUBMITTED"

      - name: notice_bounced_marks_bad_address
        claim_type: side_effect_execution
        grounds: ["state_machines.Notice.SENT_to_BOUNCED", "entities.Participant.fields.address_quality"]
        distinguishing_aspect: "BOUNCED (distinct from the RETURNED_MAIL cycle in §1.8) leaves the case IDENTIFIED and flips address_quality to BAD_ADDRESS, blocking future reissue."
        test_recipe:
          setup: ["batch LOCKED with one case; FORCE_OUT_ELECTION notice SENT"]
          setup_api_calls:
            - { call: "POST /recordkeepers", payload: { recordkeeper_code: "RK-A", legal_name: "Recordkeeper A" }, as: ProviderOps, captures: { rk_a: $.data.id } }
            - { call: "POST /recordkeepers/${rk_a}/activate", payload: {}, as: ProviderOps }
            - { call: "POST /plans", payload: { plan_name: "Plan X", sponsor_ein: "11-1111111", recordkeeper_id: "${rk_a}" }, as: PlanSponsor, captures: { plan_x: $.data.id } }
            - { call: "POST /participants", payload: { ssn_hash: "hash-a", full_name: "Ann A", date_of_birth: "1980-01-01", mailing_address_line1: "1 Main St", mailing_city: "Springfield", mailing_state: "IL", mailing_zip: "62701" }, as: PlanSponsor, captures: { p_a: $.data.id } }
            - { call: "POST /distribution-batches", payload: { plan_id: "${plan_x}" }, as: PlanSponsor, captures: { b_x: $.data.id } }
            - { call: "POST /distribution-cases", payload: { distribution_batch_id: "${b_x}", plan_id: "${plan_x}", participant_id: "${p_a}", separation_date: "2026-07-15T00:00:00Z", separation_date_balance_cents: 50000, processing_date_balance_cents: 50000 }, as: PlanSponsor, captures: { c_a: $.data.id } }
            - { call: "POST /distribution-batches/${b_x}/lock", payload: {}, as: PlanSponsor }
            - { call: "POST /distribution-cases/${c_a}/notices", payload: { notice_type: "FORCE_OUT_ELECTION" }, as: ProviderOps, captures: { n_a: $.data.id } }
          trigger:
            - { call: "POST /notices/${n_a}/record-delivery", payload: { outcome: "BOUNCED" }, as: ProviderOps }
          assert:
            - "Notice.${n_a}.delivery_status == BOUNCED, response_deadline == null"
            - "DistributionCase.${c_a}.case_status remains IDENTIFIED; Participant.${p_a}.address_quality == BAD_ADDRESS"

      - name: double_execute_rejected
        claim_type: idempotency
        grounds: ["state_machines.DistributionBatch.LOCKED_to_EXECUTED"]
        distinguishing_aspect: "Executing an already-EXECUTED batch is a state error, not a silent no-op: ERR_INVALID_STATE and executed_by_user_id is not overwritten."
        test_recipe:
          setup: ["batch EXECUTED by ops_exec_1 with one ELECTED case"]
          setup_api_calls:
            - { call: "POST /recordkeepers", payload: { recordkeeper_code: "RK-A", legal_name: "Recordkeeper A" }, as: ProviderOps, captures: { rk_a: $.data.id } }
            - { call: "POST /recordkeepers/${rk_a}/activate", payload: {}, as: ProviderOps }
            - { call: "POST /plans", payload: { plan_name: "Plan X", sponsor_ein: "11-1111111", recordkeeper_id: "${rk_a}" }, as: PlanSponsor, captures: { plan_x: $.data.id } }
            - { call: "POST /participants", payload: { ssn_hash: "hash-a", full_name: "Ann A", date_of_birth: "1980-01-01", mailing_address_line1: "1 Main St", mailing_city: "Springfield", mailing_state: "IL", mailing_zip: "62701" }, as: PlanSponsor, captures: { p_a: $.data.id } }
            - { call: "POST /distribution-batches", payload: { plan_id: "${plan_x}" }, as: PlanSponsor, captures: { b_x: $.data.id } }
            - { call: "POST /distribution-cases", payload: { distribution_batch_id: "${b_x}", plan_id: "${plan_x}", participant_id: "${p_a}", separation_date: "2026-07-15T00:00:00Z", separation_date_balance_cents: 300000, processing_date_balance_cents: 300000 }, as: PlanSponsor, captures: { c_a: $.data.id } }
            - { call: "POST /distribution-batches/${b_x}/lock", payload: {}, as: PlanSponsor }
            - { call: "POST /distribution-cases/${c_a}/notices", payload: { notice_type: "FORCE_OUT_ELECTION" }, as: ProviderOps, captures: { n_a: $.data.id } }
            - { call: "POST /notices/${n_a}/record-delivery", payload: { outcome: "DELIVERED" }, as: ProviderOps }
            - { call: "GET /distribution-cases/${c_a}", payload: {}, as: ProviderOps, captures: { c_a_v: $.data.version } }
            - { call: "POST /distribution-cases/${c_a}/elections", payload: { election_type: "SAFE_HARBOR_IRA", expected_case_version: "${c_a_v}" }, as: Participant, as_user_id: "${p_a}" }
            - { call: "POST /distribution-batches/${b_x}/execute", payload: {}, as: ProviderOps, as_user_id: "ops_exec_1" }
          trigger:
            - { call: "POST /distribution-batches/${b_x}/execute", payload: {}, as: ProviderOps, as_user_id: "ops_exec_2", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE, http 409"
            - "DistributionBatch.${b_x}.executed_by_user_id remains \"ops_exec_1\" (segregation-of-duties anchor is immutable once set)"

      - name: match_reject_from_rejected_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.MatchCandidate.CANDIDATE_to_REJECTED"]
        distinguishing_aspect: "REJECTED is terminal for a match: a second reject fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["IRA ${ira} OPEN; one CANDIDATE match ${m1} (score 0.652)"]
          setup_api_calls:
            - { call: "POST /recordkeepers", payload: { recordkeeper_code: "RK-A", legal_name: "Recordkeeper A" }, as: ProviderOps, captures: { rk_a: $.data.id } }
            - { call: "POST /recordkeepers/${rk_a}/activate", payload: {}, as: ProviderOps }
            - { call: "POST /recordkeepers", payload: { recordkeeper_code: "RK-B", legal_name: "Recordkeeper B" }, as: ProviderOps, captures: { rk_b: $.data.id } }
            - { call: "POST /recordkeepers/${rk_b}/activate", payload: {}, as: ProviderOps }
            - { call: "POST /plans", payload: { plan_name: "Plan X", sponsor_ein: "11-1111111", recordkeeper_id: "${rk_a}" }, as: PlanSponsor, captures: { plan_x: $.data.id } }
