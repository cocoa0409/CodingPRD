          assert:
            - "response.data.swept_count == 1, debited_claim_ids == [${clp_id}] and total_debit_cents == 275250"
            - "level 1: PartsReturnRequest.${pr_pwr_id}.status == NOT_RETURNED with debit_amount_cents == 275250 and due_date == 2026-06-15"
            - "level 2: WarrantyClaim.${clp_id}.payment_status == DEBITED with debited_amount_cents == 275250 (the FULL approved total, not the 234000 parts amount) and status still APPROVED"
            - "level 3: exactly one new ChargebackLedgerEntry for D_PWR with source_type == PARTS_NON_RETURN, claim_id == ${clp_id}, amount_cents == 275250 and balance_after_cents == 275250"
            - "level 4: Dealer.${dpwr_id}.chargeback_balance_cents == 275250, status == SUSPENDED (>= 200000, PROBATION skipped) and open_parts_return_count == 0"
            - "level 5: WarrantyClaim.${cls_id}.status == SUSPENDED although nothing in the request named it, and GET /warranty/claims/${cls_id}/edits returns one edit with edit_code == DEALER_POSTURE_HOLD and severity == SUSPEND"
            - "the sibling claim's payment_status is untouched at UNPAID and its approved_total_cents is still null"

      - name: appeal_grant_depth_five_finding_recompute_ledger_posture_release
        grounds:
          - endpoints.POST_/warranty/appeals/{id}/decision
          - state_machines.AuditFinding.status.CHARGED_BACK_to_OVERTURNED
          - state_machines.DealerAudit.status.APPEALED_to_CLOSED
          - state_machines.Dealer.status.PROBATION_to_ACTIVE
          - state_machines.WarrantyClaim.payment_status.DEBITED_to_CREDIT_REINSTATED
          - calculations.audit_extrapolated_chargeback
          - calculations.dealer_chargeback_balance
        distinguishing_aspect: |
          This is the same five-level shape driven BACKWARDS and through different entities: one
          GRANT overturns the finding, which recomputes the audit's error rate to 0.0 and drops the
          extrapolation tier from 1.00 to 0.00, which appends TWO negative ledger rows, which
          returns the dealer from PROBATION to ACTIVE, which releases a posture-suspended claim
          that the appeal never mentioned - and, on a sixth branch, drives the audit itself
          APPEALED -> CLOSED. The extrapolated reversal (60000) is twice the finding the dealer
          actually appealed (30000), so an implementation that reverses only the sampled amount
          leaves the dealer stuck on PROBATION and the sibling claim stuck SUSPENDED.
