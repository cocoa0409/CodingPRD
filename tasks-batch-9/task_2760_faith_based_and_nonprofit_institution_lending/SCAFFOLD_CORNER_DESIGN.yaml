  - section: validations
    instances:
      - name: restricted_plus_endowment_draw_above_total_contributions_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=43]
          - errors[ERR_RESTRICTED_EXCEEDS_TOTAL]
          - entities.GivingPeriod.fields.unrestricted_contributions_cents
        distinguishing_aspect: "The two restricted buckets are checked TOGETHER against total_contributions_cents: 50000000 + 15000000 > 60000000 is 422 ERR_RESTRICTED_EXCEEDS_TOTAL even though neither bucket alone exceeds the total."
        test_recipe:
          setup:
            - "One institution with no giving periods."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { legal_name: "Grace Covenant Church", institution_type: "CONGREGATION", denomination_code: "PCA", bylaws_borrowing_cap_cents: 500000000, bylaws_quorum_pct: 0.6667 }
              as: PlatformAdmin
              captures: { inst: $.data.id }
          trigger:
            - call: "POST /giving-periods"
              payload: { institution_id: "${inst}", period_label: "2025Q1", period_start: "2025-01-01T00:00:00Z", period_end: "2025-03-31T00:00:00Z", source: "AUDITED", total_contributions_cents: 60000000, restricted_contributions_cents: 50000000, donor_restricted_endowment_draw_cents: 15000000, operating_expense_cents: 30000000, member_household_count: 500 }
              as: CreditAnalyst
              captures: { err: $.data.error_id }
          assert:
