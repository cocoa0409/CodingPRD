# =============================================================================
# Health Department Food Safety Inspection — Scaffold (Expert tier)
# §1.0–§1.7 plus preamble. No scaffold_difficulty_design / scaffold_corner_design
# keys live here (they are in their sibling files).
# =============================================================================

scenario: |
  Health Department Food Safety Inspection: establishment permit & risk category,
  inspection schedule & route, violation (critical/non-critical) & code (FDA Food
  Code), score/grade placard, reinspection & closure order, complaint/foodborne-
  illness, plan review & permit issuance, enforcement/hearing

domain_name: food-safety-inspection
api_prefix: /

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - dual_variant_calculation        # as-observed vs corrected-on-site scoring; risk-tier dual scaling
    - cascading_side_effects          # violation -> score -> grade -> placard -> closure-order cascade
    - rate_threshold_triggers         # grade-cut thresholds, critical-count autosuspend, repeat-violation escalation
    - optimistic_concurrency          # OCC on Inspection.version for finalize-with-supersede
    - scheduled_actions               # logical clock drives reinspection due dates and permit expiry

  entity_topology: flat
  # Every entity is a top-level collection (/establishments, /inspections,
  # /violations, ...) cross-referenced by FK fields carried in request bodies
  # and discoverable via filtered-list GETs. No nesting in URL paths.

  state_machine_shape: cyclic
  # Establishment SUSPENDED<->PERMITTED loop, PlanReview resubmission loop,
  # Inspection finalize/amend, EnforcementCase branching to hearing.

  relationship_patterns:
    - one_to_many        # Establishment -> Inspections, Inspection -> Violations
    - cross_aggregate    # Violation.fda_code_id -> FdaFoodCode.code; route -> inspector
    - polymorphic        # Complaint.linked_inspection_id optional cross-link

  role_model: peer_roles
  # PermitClerk (plan review / permit), Inspector (inspections/violations),
  # EnforcementOfficer (closure/enforcement/hearing), HealthDirector (override).

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: FdaFoodCode
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "FDA Food Code section identifier, e.g. '3-501.16'", constraints: "unique across all FdaFoodCode rows; immutable after create" }
      - { name: title, type: string, source: input, description: "Human-readable violation title" }
      - { name: classification, type: enum, source: input, description: "CRITICAL | NON_CRITICAL", constraints: "CRITICAL | NON_CRITICAL" }
      - { name: base_demerit_points, type: integer, source: input, description: "Points deducted from the 100-point base when this code is cited once at full weight", constraints: "integer 1..40" }
      - { name: repeat_surcharge_points, type: integer, source: input, default: 0, description: "Extra points added per prior unresolved citation of the same code at this establishment", constraints: "integer 0..20" }
      - { name: is_active, type: boolean, source: system, default: true, description: "Soft-retire flag; retired codes cannot be cited on new violations" }

  - name: Inspector
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Inspector display name" }
      - { name: badge_number, type: string, source: input, description: "Department badge id", constraints: "unique across all Inspector rows" }
      - { name: max_daily_route_stops, type: integer, source: input, default: 8, description: "Capacity cap on stops assignable to this inspector per route day", constraints: "integer 1..20" }
      - { name: is_active, type: boolean, source: system, default: true, description: "Inactive inspectors cannot be assigned to new routes or inspections" }

  - name: Establishment
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Trading name of the food establishment" }
      - { name: address, type: string, source: input, description: "Physical street address" }
      - { name: cuisine_type, type: string, source: input, required: false, description: "Optional descriptive cuisine label" }
      - { name: seating_capacity, type: integer, source: input, description: "Declared seating capacity, drives risk category", constraints: "integer >= 0" }
      - { name: serves_raw_animal_foods, type: boolean, source: input, default: false, description: "True if menu includes raw/undercooked animal foods, drives risk category" }
      - { name: does_onsite_processing, type: boolean, source: input, default: false, description: "True if establishment cans/cures/smokes on site, drives risk category" }
      - { name: risk_category, type: enum, source: computed, description: "CATEGORY_1 (low) | CATEGORY_2 (medium) | CATEGORY_3 (high); computed by risk_category_assignment", constraints: "CATEGORY_1 | CATEGORY_2 | CATEGORY_3" }
      - { name: routine_interval_days, type: integer, source: computed, description: "Days between routine inspections, derived from risk_category" }
      - { name: status, type: enum, source: system, default: PRELICENSE, description: "PRELICENSE -> PERMITTED -> (SUSPENDED <-> PERMITTED) -> REVOKED", constraints: "PRELICENSE | PERMITTED | SUSPENDED | REVOKED" }
      - { name: current_score, type: integer, source: computed, description: "Score (0..100) from the most recent FINALIZED inspection, else null until first finalize" }
      - { name: current_grade, type: enum, source: computed, description: "A | B | C | CLOSED placard grade from latest FINALIZED inspection", constraints: "A | B | C | CLOSED" }
      - { name: current_placard_color, type: enum, source: computed, description: "GREEN | YELLOW | RED placard color from latest FINALIZED inspection", constraints: "GREEN | YELLOW | RED" }
      - { name: open_critical_count, type: integer, source: computed, default: 0, description: "Count of unresolved CRITICAL violations across all FINALIZED inspections" }
      - { name: next_reinspection_due_index, type: integer, source: computed, description: "Logical clock index by which a mandated reinspection must occur; null when none pending" }
      - { name: active_closure_order_id, type: string, source: computed, description: "Id of the currently-active ClosureOrder, null when not closed" }

  - name: PlanReview
    parent: Establishment
    common_fields: true
    fields:
      - { name: establishment_id, type: string, source: input, description: "FK -> Establishment.id; the establishment this plan review is for" }
      - { name: submitted_layout_sqft, type: integer, source: input, description: "Proposed kitchen layout square footage", constraints: "integer > 0" }
      - { name: equipment_count, type: integer, source: input, description: "Count of NSF-listed equipment items in the plan", constraints: "integer >= 0" }
      - { name: plan_fee_cents, type: integer, source: computed, description: "Plan review fee in cents, computed by plan_review_fee" }
      - { name: rejection_reason, type: string, source: input, required: false, description: "Reason recorded when a plan review is rejected" }
      - { name: revision_round, type: integer, source: system, default: 0, description: "Increments each time a rejected plan review is resubmitted (cycle)" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED -> {APPROVED, REJECTED}; REJECTED -> SUBMITTED on resubmit", constraints: "SUBMITTED | APPROVED | REJECTED" }

  - name: Permit
    parent: Establishment
    common_fields: true
    fields:
      - { name: establishment_id, type: string, source: input, description: "FK -> Establishment.id; the establishment receiving the permit" }
      - { name: plan_review_id, type: string, source: input, description: "FK -> PlanReview.id; the APPROVED plan review authorizing issuance" }
      - { name: issued_index, type: integer, source: system, description: "Logical clock index at issuance" }
      - { name: expires_index, type: integer, source: computed, description: "issued_index + PERMIT_TERM_DAYS; permit valid while clock <= expires_index" }
      - { name: annual_fee_cents, type: integer, source: computed, description: "Annual permit fee in cents, computed by permit_fee (risk-tier scaled)" }
      - { name: status, type: enum, source: computed, default: ACTIVE, description: "ACTIVE on issue; derived EXPIRED when current clock index > expires_index (and not VOID); set VOID by establishment revoke. Computed on every read.", constraints: "ACTIVE | EXPIRED | VOID" }

  - name: InspectionRoute
    parent: null
    common_fields: true
    fields:
      - { name: inspector_id, type: string, source: input, description: "FK -> Inspector.id; the inspector who runs this route" }
      - { name: route_date_index, type: integer, source: input, description: "Logical clock index (day) on which the route is run", constraints: "integer >= 0" }
      - { name: planned_stop_count, type: integer, source: computed, default: 0, description: "Count of SCHEDULED inspections attached to this route" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED -> DISPATCHED -> COMPLETED", constraints: "PLANNED | DISPATCHED | COMPLETED" }

  - name: Inspection
    parent: Establishment
    common_fields: true
    fields:
      - { name: establishment_id, type: string, source: input, description: "FK -> Establishment.id; the inspected establishment" }
      - { name: route_id, type: string, source: input, required: false, description: "FK -> InspectionRoute.id; the route this inspection is scheduled under, null for ad-hoc" }
      - { name: inspector_id, type: string, source: input, description: "FK -> Inspector.id; the assigned inspector" }
      - { name: inspection_type, type: enum, source: input, description: "ROUTINE | REINSPECTION | COMPLAINT", constraints: "ROUTINE | REINSPECTION | COMPLAINT" }
      - { name: reinspection_of_id, type: string, source: input, required: false, description: "FK -> Inspection.id; the prior FINALIZED inspection this reinspection follows (REINSPECTION only)" }
      - { name: scheduled_index, type: integer, source: input, description: "Logical clock index the inspection is scheduled for", constraints: "integer >= 0" }
      - { name: as_observed_score, type: integer, source: computed, description: "Score (0..100) ignoring on-site corrections; provisional variant" }
      - { name: final_score, type: integer, source: computed, description: "Score (0..100) crediting corrected_on_site violations; final variant, used for grade" }
      - { name: grade, type: enum, source: computed, description: "A | B | C | CLOSED; from grade_assignment on final_score with critical cap", constraints: "A | B | C | CLOSED" }
      - { name: placard_color, type: enum, source: computed, description: "GREEN | YELLOW | RED, paired with grade", constraints: "GREEN | YELLOW | RED" }
      - { name: critical_count, type: integer, source: computed, default: 0, description: "Count of CRITICAL violations recorded on this inspection" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED -> IN_PROGRESS -> COMPLETED -> FINALIZED; COMPLETED -> AMENDING -> COMPLETED (cycle)", constraints: "SCHEDULED | IN_PROGRESS | COMPLETED | AMENDING | FINALIZED" }

  - name: Violation
    parent: Inspection
    common_fields: true
    fields:
      - { name: inspection_id, type: string, source: input, description: "FK -> Inspection.id; the inspection this violation is recorded on" }
      - { name: fda_code_id, type: string, source: input, description: "FK -> FdaFoodCode.id; the cited code" }
      - { name: classification, type: enum, source: computed, description: "Copied from the cited FdaFoodCode.classification at citation time", constraints: "CRITICAL | NON_CRITICAL" }
      - { name: corrected_on_site, type: boolean, source: input, default: false, description: "True if corrected during the inspection (credits final_score)" }
      - { name: repeat_offense, type: boolean, source: computed, description: "True if the same fda_code was cited and left RESOLVED=false on a prior FINALIZED inspection of this establishment" }
      - { name: demerit_points_observed, type: integer, source: computed, description: "Points this violation contributes to as_observed_score (base + repeat surcharge)" }
      - { name: demerit_points_final, type: integer, source: computed, description: "Points this violation contributes to final_score (halved when corrected_on_site)" }
      - { name: resolution_status, type: enum, source: system, default: OPEN, description: "OPEN -> RESOLVED (cleared by a passing reinspection)", constraints: "OPEN | RESOLVED" }

  - name: ClosureOrder
    parent: Establishment
    common_fields: true
    fields:
      - { name: establishment_id, type: string, source: input, description: "FK -> Establishment.id; the closed establishment" }
      - { name: triggering_inspection_id, type: string, source: input, description: "FK -> Inspection.id; the FINALIZED inspection that triggered closure" }
      - { name: reason_code, type: enum, source: input, description: "GRADE_C_AUTOCLOSE | CRITICAL_THRESHOLD | IMMINENT_HEALTH_HAZARD", constraints: "GRADE_C_AUTOCLOSE | CRITICAL_THRESHOLD | IMMINENT_HEALTH_HAZARD" }
      - { name: issued_index, type: integer, source: system, description: "Logical clock index at issuance" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE -> LIFTED (passing reinspection) | VACATED (hearing overturns)", constraints: "ACTIVE | LIFTED | VACATED" }

  - name: Complaint
    parent: Establishment
    common_fields: true
    fields:
      - { name: establishment_id, type: string, source: input, description: "FK -> Establishment.id; the establishment the complaint is against" }
      - { name: complaint_type, type: enum, source: input, description: "FOODBORNE_ILLNESS | SANITATION | OTHER", constraints: "FOODBORNE_ILLNESS | SANITATION | OTHER" }
      - { name: reported_ill_count, type: integer, source: input, default: 0, description: "Number of persons reporting illness (FOODBORNE_ILLNESS)", constraints: "integer >= 0" }
      - { name: severity_score, type: integer, source: computed, description: "Triage severity, computed by complaint_severity" }
      - { name: priority, type: enum, source: computed, description: "ROUTINE | PRIORITY | URGENT triage band from severity_score", constraints: "ROUTINE | PRIORITY | URGENT" }
      - { name: linked_inspection_id, type: string, source: system, required: false, description: "FK -> Inspection.id; the COMPLAINT inspection spawned to investigate, null until dispatched" }
      - { name: status, type: enum, source: system, default: RECEIVED, description: "RECEIVED -> TRIAGED -> DISPATCHED -> CLOSED", constraints: "RECEIVED | TRIAGED | DISPATCHED | CLOSED" }

  - name: EnforcementCase
    parent: Establishment
    common_fields: true
    fields:
      - { name: establishment_id, type: string, source: input, description: "FK -> Establishment.id; the establishment under enforcement" }
      - { name: closure_order_id, type: string, source: input, required: false, description: "FK -> ClosureOrder.id; the closure being contested, null for fine-only cases" }
      - { name: alleged_penalty_cents, type: integer, source: input, description: "Penalty amount sought in cents", constraints: "integer >= 0" }
      - { name: assessed_penalty_cents, type: integer, source: computed, description: "Final penalty after hearing, computed by penalty_assessment" }
      - { name: hearing_index, type: integer, source: input, required: false, description: "Logical clock index a hearing is scheduled for" }
      - { name: ruling, type: enum, source: system, required: false, description: "UPHELD | REDUCED | DISMISSED set at hearing close", constraints: "UPHELD | REDUCED | DISMISSED" }
      - { name: status, type: enum, source: system, default: OPENED, description: "OPENED -> HEARING_SCHEDULED -> HEARD -> CLOSED; OPENED -> CLOSED (settle)", constraints: "OPENED | HEARING_SCHEDULED | HEARD | CLOSED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PlanReview
    initial_state: SUBMITTED
    terminal_states: [APPROVED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /plan-reviews/{planReviewId}/approve"
        actor: PermitClerk
        preconditions:
          - "PlanReview.status == SUBMITTED (ERR_PLAN_REVIEW_NOT_SUBMITTED)"
          - "Establishment.status == PRELICENSE (ERR_ESTABLISHMENT_NOT_PRELICENSE)"
        side_effects:
          - "PlanReview.status -> APPROVED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /plan-reviews/{planReviewId}/reject"
        actor: PermitClerk
        preconditions:
          - "PlanReview.status == SUBMITTED (ERR_PLAN_REVIEW_NOT_SUBMITTED)"
          - "rejection_reason non-empty (ERR_MISSING_REJECTION_REASON)"
        side_effects:
          - "PlanReview.status -> REJECTED; rejection_reason recorded"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /plan-reviews/{planReviewId}/resubmit"
        actor: PermitClerk
        preconditions:
          - "PlanReview.status == REJECTED (ERR_PLAN_REVIEW_NOT_REJECTED)"
        side_effects:
          - "PlanReview.status -> SUBMITTED; revision_round += 1; plan_fee_cents recomputed for new layout/equipment; rejection_reason cleared"
        note: "Cyclic: a plan can bounce SUBMITTED<->REJECTED until approved."

  - entity: Establishment
    initial_state: PRELICENSE
    terminal_states: [REVOKED]
    transitions:
      - from: PRELICENSE
        to: PERMITTED
        trigger: "POST /permits"
        actor: PermitClerk
        preconditions:
          - "Establishment.status == PRELICENSE (ERR_ESTABLISHMENT_NOT_PRELICENSE)"
          - "Referenced PlanReview belongs to this establishment and is APPROVED (ERR_PLAN_REVIEW_NOT_APPROVED)"
        side_effects:
          - "Create Permit (status ACTIVE, issued_index = clock, expires_index = clock + PERMIT_TERM_DAYS)"
          - "Establishment.status -> PERMITTED"
          - "Establishment.next_reinspection_due_index set to clock + routine_interval_days"
      - from: PERMITTED
        to: SUSPENDED
        trigger: "system (ClosureOrder becomes ACTIVE) or POST /closure-orders"
        actor: system
        preconditions:
          - "Establishment.status == PERMITTED (ERR_ESTABLISHMENT_NOT_PERMITTED)"
        side_effects:
          - "Establishment.status -> SUSPENDED"
          - "Establishment.active_closure_order_id set to the new ClosureOrder.id"
      - from: SUSPENDED
        to: PERMITTED
        trigger: "system (passing REINSPECTION finalized: grade A or B and zero open criticals) or POST /closure-orders/{closureOrderId}/lift"
        actor: system
        preconditions:
          - "Establishment.status == SUSPENDED (ERR_ESTABLISHMENT_NOT_SUSPENDED)"
          - "active ClosureOrder exists (ERR_NO_ACTIVE_CLOSURE_ORDER)"
        side_effects:
          - "ClosureOrder.status -> LIFTED"
          - "Establishment.active_closure_order_id -> null"
          - "Establishment.status -> PERMITTED"
        note: "Cyclic: SUSPENDED<->PERMITTED loops as closures are issued and lifted."
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /establishments/{establishmentId}/revoke"
        actor: HealthDirector
        preconditions:
          - "Establishment.status == SUSPENDED (ERR_ESTABLISHMENT_NOT_SUSPENDED)"
        side_effects:
          - "Establishment.status -> REVOKED"
          - "All ACTIVE Permits of this establishment -> VOID"
      - from: PERMITTED
        to: REVOKED
        trigger: "POST /establishments/{establishmentId}/revoke"
        actor: HealthDirector
        preconditions:
          - "Establishment.status IN {PERMITTED, SUSPENDED} (ERR_ESTABLISHMENT_NOT_REVOCABLE)"
        side_effects:
          - "Establishment.status -> REVOKED"
          - "All ACTIVE Permits of this establishment -> VOID"

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [FINALIZED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /inspections/{inspectionId}/start"
        actor: Inspector
        preconditions:
          - "Inspection.status == SCHEDULED (ERR_INSPECTION_NOT_SCHEDULED)"
          - "Inspection.inspector_id == X-User-ID (ERR_NOT_ASSIGNED_INSPECTOR)"
          - "Establishment.status != REVOKED (ERR_ESTABLISHMENT_REVOKED)"
        side_effects:
          - "Inspection.status -> IN_PROGRESS"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /inspections/{inspectionId}/complete"
        actor: Inspector
        preconditions:
          - "Inspection.status == IN_PROGRESS (ERR_INSPECTION_NOT_IN_PROGRESS)"
        side_effects:
          - "Recompute as_observed_score, final_score, critical_count, grade, placard_color from this inspection's Violations (preview values, not yet promoted to Establishment)"
          - "Inspection.status -> COMPLETED"
      - from: COMPLETED
        to: AMENDING
        trigger: "POST /inspections/{inspectionId}/reopen"
        actor: Inspector
        preconditions:
          - "Inspection.status == COMPLETED (ERR_INSPECTION_NOT_COMPLETED)"
        side_effects:
          - "Inspection.status -> AMENDING (violations may be added/removed again)"
        note: "Cyclic: COMPLETED -> AMENDING -> COMPLETED allows violation edits before finalize."
      - from: AMENDING
        to: COMPLETED
        trigger: "POST /inspections/{inspectionId}/complete"
        actor: Inspector
        preconditions:
          - "Inspection.status == AMENDING (ERR_INSPECTION_NOT_AMENDING)"
        side_effects:
          - "Recompute as_observed_score, final_score, critical_count, grade, placard_color"
          - "Inspection.status -> COMPLETED"
      - from: COMPLETED
        to: FINALIZED
        trigger: "POST /inspections/{inspectionId}/finalize"
        actor: Inspector
        preconditions:
          - "Inspection.status == COMPLETED (ERR_INSPECTION_NOT_COMPLETED)"
          - "expected_inspection_version matches Inspection.version (ERR_STALE_INSPECTION_VERSION)"
        side_effects:
          - "Promote final_score/grade/placard_color onto Establishment.current_score/current_grade/current_placard_color"
          - "Establishment.open_critical_count recomputed across FINALIZED inspections"
          - "If inspection_type==REINSPECTION and grade IN {A,B} and this inspection has zero CRITICAL violations: mark matching prior OPEN violations RESOLVED, then if establishment SUSPENDED lift its ACTIVE ClosureOrder and establishment -> PERMITTED"
          - "If grade==CLOSED: create ClosureOrder (reason_code per closure_trigger), establishment PERMITTED -> SUSPENDED, set next_reinspection_due_index = clock + REINSPECTION_GRACE_DAYS"
          - "If inspection_type==ROUTINE and grade IN {A,B}: next_reinspection_due_index = clock + routine_interval_days"
          - "Inspection.version increments by 1"

  - entity: InspectionRoute
    initial_state: PLANNED
    terminal_states: [COMPLETED]
    transitions:
      - from: PLANNED
        to: DISPATCHED
        trigger: "POST /inspection-routes/{routeId}/dispatch"
        actor: Inspector
        preconditions:
          - "InspectionRoute.status == PLANNED (ERR_ROUTE_NOT_PLANNED)"
          - "planned_stop_count <= Inspector.max_daily_route_stops (ERR_ROUTE_CAPACITY_EXCEEDED)"
        side_effects:
          - "InspectionRoute.status -> DISPATCHED"
      - from: DISPATCHED
        to: COMPLETED
        trigger: "POST /inspection-routes/{routeId}/close"
        actor: Inspector
        preconditions:
          - "InspectionRoute.status == DISPATCHED (ERR_ROUTE_NOT_DISPATCHED)"
        side_effects:
          - "InspectionRoute.status -> COMPLETED"

  - entity: Complaint
    initial_state: RECEIVED
    terminal_states: [CLOSED]
    transitions:
      - from: RECEIVED
        to: TRIAGED
        trigger: "POST /complaints/{complaintId}/triage"
        actor: PermitClerk
        preconditions:
          - "Complaint.status == RECEIVED (ERR_COMPLAINT_NOT_RECEIVED)"
        side_effects:
          - "Recompute severity_score and priority (complaint_severity)"
          - "Complaint.status -> TRIAGED"
      - from: TRIAGED
        to: DISPATCHED
        trigger: "POST /complaints/{complaintId}/dispatch"
        actor: Inspector
        preconditions:
          - "Complaint.status == TRIAGED (ERR_COMPLAINT_NOT_TRIAGED)"
          - "Establishment.status != REVOKED (ERR_ESTABLISHMENT_REVOKED)"
        side_effects:
          - "Create COMPLAINT Inspection (status SCHEDULED, scheduled_index = clock) assigned to the dispatching Inspector"
          - "Complaint.linked_inspection_id set to the new Inspection.id"
          - "Complaint.status -> DISPATCHED"
      - from: DISPATCHED
        to: CLOSED
        trigger: "POST /complaints/{complaintId}/close"
        actor: PermitClerk
        preconditions:
          - "Complaint.status == DISPATCHED (ERR_COMPLAINT_NOT_DISPATCHED)"
          - "linked Inspection.status == FINALIZED (ERR_COMPLAINT_INSPECTION_OPEN)"
        side_effects:
          - "Complaint.status -> CLOSED"

  - entity: EnforcementCase
    initial_state: OPENED
    terminal_states: [CLOSED]
    transitions:
      - from: OPENED
        to: HEARING_SCHEDULED
        trigger: "POST /enforcement-cases/{caseId}/schedule-hearing"
        actor: EnforcementOfficer
        preconditions:
          - "EnforcementCase.status == OPENED (ERR_CASE_NOT_OPENED)"
          - "hearing_index >= current clock index (ERR_HEARING_IN_PAST)"
        side_effects:
          - "EnforcementCase.status -> HEARING_SCHEDULED; hearing_index recorded"
      - from: HEARING_SCHEDULED
        to: HEARD
        trigger: "POST /enforcement-cases/{caseId}/rule"
        actor: HealthDirector
        preconditions:
          - "EnforcementCase.status == HEARING_SCHEDULED (ERR_CASE_NOT_SCHEDULED)"
          - "current clock index >= hearing_index (ERR_HEARING_NOT_REACHED)"
          - "ruling IN {UPHELD, REDUCED, DISMISSED} (ERR_INVALID_RULING)"
        side_effects:
          - "ruling recorded; assessed_penalty_cents computed by penalty_assessment"
          - "If ruling==DISMISSED and closure_order_id set: ClosureOrder.status -> VACATED; if establishment SUSPENDED with no other ACTIVE closure -> PERMITTED"
          - "EnforcementCase.status -> HEARD"
      - from: HEARD
        to: CLOSED
        trigger: "POST /enforcement-cases/{caseId}/close"
        actor: EnforcementOfficer
        preconditions:
          - "EnforcementCase.status == HEARD (ERR_CASE_NOT_HEARD)"
        side_effects:
          - "EnforcementCase.status -> CLOSED"
      - from: OPENED
        to: CLOSED
        trigger: "POST /enforcement-cases/{caseId}/settle"
        actor: EnforcementOfficer
        preconditions:
          - "EnforcementCase.status == OPENED (ERR_CASE_NOT_OPENED)"
        side_effects:
          - "assessed_penalty_cents = alleged_penalty_cents (settlement, no reduction)"
          - "EnforcementCase.status -> CLOSED"
        note: "Branching: OPENED forks to a hearing path or a direct settle path, with divergent side-effect sets."

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: inspection-finalize-stale-version
    parent_entity: Inspection
    write_endpoint: "POST /inspections/{inspectionId}/finalize"
    occ_field: "expected_inspection_version"
    description: |
      Finalizing an Inspection whose version has advanced since the client last
      observed it is rejected with a stale-version error. A COMPLETED inspection
      can be reopened to AMENDING (bumping version) and re-completed, legitimately
      superseding the score the finalizing client last read; a finalize still
      carrying the pre-amendment version is therefore stale and rejected.
    error_id: ERR_STALE_INSPECTION_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: risk_category_assignment
    trigger: "Establishment creation; recomputed on PUT establishment profile"
    algorithm: threshold
    formula: |
      base = CATEGORY_1
      if seating_capacity >= 50: base = CATEGORY_2
      if seating_capacity >= 150: base = CATEGORY_3
      # escalators (each lifts category by exactly one band, capped at CATEGORY_3)
      if serves_raw_animal_foods: base = bump_one(base)
      if does_onsite_processing:  base = bump_one(base)
      risk_category = base   # bump_one(CATEGORY_3) == CATEGORY_3
      routine_interval_days = { CATEGORY_1: 365, CATEGORY_2: 180, CATEGORY_3: 90 }[risk_category]
    input_set: "single Establishment row's input fields"
    constants:
      CAT2_SEATS: 50
      CAT3_SEATS: 150
      INTERVAL_CAT1: 365
      INTERVAL_CAT2: 180
      INTERVAL_CAT3: 90
    precision: "integer days"
    note: "Order is fixed: seating band first, then escalators applied in declared order; ceiling at CATEGORY_3."

  - name: inspection_scoring
    trigger: "Inspection complete (IN_PROGRESS->COMPLETED, AMENDING->COMPLETED) and finalize"
    algorithm: aggregation
    formula: |
      # Per violation v on this inspection, code = its FdaFoodCode:
      #   observed_pts(v) = code.base_demerit_points
      #                     + (code.repeat_surcharge_points if v.repeat_offense else 0)
      #   final_pts(v)    = ceil(observed_pts(v) / 2) if v.corrected_on_site else observed_pts(v)
      # Sum-then-clamp (NOT per-line clamp): aggregate raw points across all
      # violations FIRST, subtract from 100, THEN clamp to [0,100].
      as_observed_score = max(0, 100 - sum(observed_pts(v) for v in violations))
      final_score       = max(0, 100 - sum(final_pts(v)    for v in violations))
      critical_count    = count(v for v in violations if v.classification == CRITICAL)
    input_set: "all Violation rows whose inspection_id == this Inspection.id"
    constants:
      BASE_SCORE: 100
    precision: "integer points; per-violation ceil division applied before summation; final clamp to [0,100]"
    variants:
      - name: as_observed
        when: "provisional snapshot ignoring on-site corrections"
        difference: "uses observed_pts for every violation (corrected_on_site ignored)"
      - name: final
        when: "drives grade and placard; promoted to Establishment at finalize"
        difference: "halves (ceil) the points of corrected_on_site violations"
    note: "Rounding order is pinned: halve-then-ceil per violation, THEN sum, THEN clamp. Summing then halving would differ."

  - name: grade_assignment
    trigger: "Inspection complete and finalize (paired with inspection_scoring)"
    algorithm: threshold
    formula: |
      # score_band from final_score:
      if final_score >= 90: score_band = A      # GREEN
      elif final_score >= 80: score_band = B     # YELLOW
      else: score_band = C                        # YELLOW
      # critical cap: each CRITICAL violation lowers the achievable letter.
      # cap_band = A if critical_count==0, B if critical_count==1, C if critical_count>=2
      # closure trigger (lowest wins): grade=CLOSED when
      #   critical_count >= CRITICAL_CLOSE_COUNT  OR  score_band==C with final_score < HARD_CLOSE_SCORE
      grade = worst_of(score_band, cap_band)      # ordering A < B < C < CLOSED, worst = max severity
      if critical_count >= CRITICAL_CLOSE_COUNT or final_score < HARD_CLOSE_SCORE:
          grade = CLOSED
      placard_color = { A: GREEN, B: YELLOW, C: YELLOW, CLOSED: RED }[grade]
    input_set: "this Inspection's final_score and critical_count"
    constants:
      A_CUT: 90
      B_CUT: 80
      CRITICAL_CLOSE_COUNT: 3
      HARD_CLOSE_SCORE: 60
    precision: "enum result"
    note: |
      Combinatorial: grade = worst of (score-derived band, critical-count cap),
      overridden to CLOSED by either a >=3 critical count OR a final_score < 60.
      Evaluation order pinned: compute score_band and cap_band, take worst, THEN
      apply the CLOSED override.

  - name: closure_trigger
    trigger: "Inspection finalize when grade == CLOSED"
    algorithm: threshold
    formula: |
      if critical_count >= CRITICAL_CLOSE_COUNT: reason_code = CRITICAL_THRESHOLD
      elif final_score < HARD_CLOSE_SCORE:       reason_code = GRADE_C_AUTOCLOSE
      else:                                      reason_code = IMMINENT_HEALTH_HAZARD
    input_set: "this Inspection's critical_count and final_score"
    constants:
      CRITICAL_CLOSE_COUNT: 3
      HARD_CLOSE_SCORE: 60
    precision: "enum result"
    note: "Critical-count cause takes precedence over score cause when both hold."

  - name: complaint_severity
    trigger: "Complaint triage (RECEIVED->TRIAGED)"
    algorithm: weighted_scoring
    formula: |
      type_weight = { FOODBORNE_ILLNESS: 40, SANITATION: 15, OTHER: 5 }[complaint_type]
      ill_weight  = min(reported_ill_count, ILL_CAP) * ILL_POINT
      risk_weight = { CATEGORY_1: 0, CATEGORY_2: 5, CATEGORY_3: 10 }[establishment.risk_category]
      severity_score = type_weight + ill_weight + risk_weight
      if severity_score >= URGENT_CUT: priority = URGENT
      elif severity_score >= PRIORITY_CUT: priority = PRIORITY
      else: priority = ROUTINE
    input_set: "the Complaint row plus its parent Establishment.risk_category"
    constants:
      ILL_CAP: 10
      ILL_POINT: 4
      URGENT_CUT: 60
      PRIORITY_CUT: 30
    precision: "integer score"
    note: "Cross-entity: pulls risk_category from the parent Establishment."

  - name: plan_review_fee
    trigger: "PlanReview creation and resubmit"
    algorithm: tiered_pricing
    formula: |
      # sqft tiers (marginal, not flat): first 500 sqft @ 0 surcharge baseline,
      # then tiered per-sqft rate added to a base fee.
      fee = BASE_FEE_CENTS
      remaining = submitted_layout_sqft
      tier1 = min(remaining, 500)                 # 0..500 sqft @ 0 cents/sqft
      remaining -= tier1
      tier2 = min(remaining, 1000)                # 501..1500 sqft @ 50 cents/sqft
      fee += tier2 * 50
      tier3 = remaining                            # 1501+ sqft @ 80 cents/sqft
      fee += tier3 * 80
      fee += equipment_count * EQUIP_FEE_CENTS
    input_set: "single PlanReview row"
    constants:
      BASE_FEE_CENTS: 20000
      EQUIP_FEE_CENTS: 1500
      T2_RATE: 50
      T3_RATE: 80
    precision: "integer cents; marginal tiering, no rounding (rates are whole-cent)"
    note: "Marginal tiered pricing across square-footage bands plus per-equipment flat fee."

  - name: permit_fee
    trigger: "Permit issuance"
    algorithm: tiered_pricing
    formula: |
      base = { CATEGORY_1: 30000, CATEGORY_2: 60000, CATEGORY_3: 120000 }[risk_category]
      annual_fee_cents = base
    input_set: "Establishment.risk_category at issuance"
    constants:
      FEE_CAT1: 30000
      FEE_CAT2: 60000
      FEE_CAT3: 120000
    precision: "integer cents"
    note: "Risk-tier scaled flat fee."

  - name: penalty_assessment
    trigger: "EnforcementCase ruling (HEARING_SCHEDULED->HEARD) and settle (OPENED->CLOSED)"
    algorithm: threshold
    formula: |
      # Forward action: opening a case alleges alleged_penalty_cents.
      # Ruling decides the compensating assessment:
      if ruling == DISMISSED: assessed_penalty_cents = 0
      elif ruling == REDUCED: assessed_penalty_cents = floor(alleged_penalty_cents * REDUCED_RATIO)
      elif ruling == UPHELD:  assessed_penalty_cents = alleged_penalty_cents
      # settle path: assessed_penalty_cents = alleged_penalty_cents (no ruling)
    input_set: "the EnforcementCase row and its ruling"
    constants:
      REDUCED_RATIO: 0.5
    precision: "integer cents, floor on reduction"
    note: "Invariant pairs with the case lifecycle: a DISMISSED ruling must also VACATE the linked closure and the conserved 'establishment suspension count' returns to baseline (see compensating invariant)."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path-referenced resources exist, validated left-to-right"
    error_id: "ERR_*_NOT_FOUND"
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: existence
    check: "Body foreign keys (fda_code_id, plan_review_id, route_id, inspector_id, reinspection_of_id, closure_order_id) reference existing rows"
    error_id: "ERR_*_NOT_FOUND"
    http_status: 404
    applies_to: "POST/PUT endpoints carrying FK fields"

  - priority: 5
    category: state
    check: "expected_inspection_version, when supplied, equals Inspection.version (OCC, before business logic)"
    error_id: ERR_STALE_INSPECTION_VERSION
    http_status: 412
    applies_to: "POST inspections/{id}/finalize"

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is legal (see §1.2)"
    error_id: "ERR_*_NOT_<STATE> (domain-specific)"
    http_status: 409
    applies_to: all transition endpoints

  - priority: 7
    category: business_referential
    check: "Cited FdaFoodCode.is_active == true when recording a Violation"
    error_id: ERR_CODE_RETIRED
    http_status: 409
    applies_to: "POST inspections/{id}/violations"

  - priority: 8
    category: business_referential
    check: "REINSPECTION inspection must reference a prior FINALIZED inspection of the SAME establishment via reinspection_of_id"
    error_id: ERR_INVALID_REINSPECTION_TARGET
    http_status: 409
    applies_to: "POST /inspections (inspection_type==REINSPECTION)"

  - priority: 9
    category: business_safety
    check: "Cannot finalize an inspection on a REVOKED establishment"
    error_id: ERR_ESTABLISHMENT_REVOKED
    http_status: 409
    applies_to: "POST inspections/{id}/finalize, /start"

  - priority: 10
    category: business_safety
    check: "Violations may only be added/removed while Inspection.status IN {IN_PROGRESS, AMENDING}"
    error_id: ERR_INSPECTION_NOT_EDITABLE
    http_status: 409
    applies_to: "POST/DELETE inspections/{id}/violations"

  - priority: 11
    category: business_temporal
    check: "InspectionRoute dispatch requires route_date_index >= current clock index"
    error_id: ERR_ROUTE_DATE_IN_PAST
    http_status: 409
    applies_to: "POST inspection-routes/{id}/dispatch"

  - priority: 12
    category: business_constraint
    check: "Route planned_stop_count must not exceed assigned Inspector.max_daily_route_stops at dispatch"
    error_id: ERR_ROUTE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST inspection-routes/{id}/dispatch"

  - priority: 13
    category: business_constraint
    check: "Two inspections cannot occupy the same inspector on overlapping route days; an Inspection scheduled_index must not collide with another non-terminal Inspection for the same inspector_id on the same index"
    error_id: ERR_INSPECTOR_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /inspections"

  - priority: 14
    category: business_temporal
    check: "EnforcementCase hearing_index must be >= current clock index when scheduling"
    error_id: ERR_HEARING_IN_PAST
    http_status: 409
    applies_to: "POST enforcement-cases/{id}/schedule-hearing"

  - priority: 15
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, integers in declared ranges"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all write endpoints

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Clock (test-driving; default 2026-01-01T00:00:00Z, index 0) ----
  - method: POST
    path: "/_clock/set_current_index"
    description: "Set the logical clock to an integer day index. Server startup default is index 0, corresponding to 2026-01-01T00:00:00Z; before any set call the clock reads exactly index 0 and never falls back to wall-clock time."
    roles: [HealthDirector]
    code: 200
    input: [to_index]
    output: "{ current_index: integer }"
    side_effects: ["logical clock current_index set to to_index"]

  - method: GET
    path: "/_clock"
    description: "Read the current logical clock index"
    roles: [HealthDirector, PermitClerk, Inspector, EnforcementOfficer]
    code: 200
    input: []
    output: "{ current_index: integer }"
    side_effects: []

  # ---- FDA Food Codes (configuration) ----
  - method: POST
    path: "/fda-food-codes"
    description: "Create an FDA Food Code catalog entry"
    roles: [HealthDirector]
    code: 201
    input: [code, title, classification, base_demerit_points, "repeat_surcharge_points?"]
    output: FdaFoodCode
    side_effects: ["is_active = true"]

  - method: GET
    path: "/fda-food-codes"
    description: "List FDA Food Codes (paginated; optional classification filter)"
    roles: [HealthDirector, PermitClerk, Inspector, EnforcementOfficer]
    code: 200
    input: ["classification?", "is_active?", "limit?", "offset?"]
    output: "FdaFoodCode[]"
    side_effects: []

  - method: GET
    path: "/fda-food-codes/{codeId}"
    description: "Get an FDA Food Code"
    roles: [HealthDirector, PermitClerk, Inspector, EnforcementOfficer]
    code: 200
    input: []
    output: FdaFoodCode
    side_effects: []

  - method: POST
    path: "/fda-food-codes/{codeId}/retire"
    description: "Retire an FDA Food Code (cannot be cited on new violations)"
    roles: [HealthDirector]
    code: 200
    input: []
    output: FdaFoodCode
    side_effects: ["is_active = false"]

  # ---- Inspectors ----
  - method: POST
    path: "/inspectors"
    description: "Register an inspector"
    roles: [HealthDirector]
    code: 201
    input: [full_name, badge_number, "max_daily_route_stops?"]
    output: Inspector
    side_effects: ["is_active = true"]

  - method: GET
    path: "/inspectors"
    description: "List inspectors"
    roles: [HealthDirector, PermitClerk, Inspector, EnforcementOfficer]
    code: 200
    input: ["is_active?", "limit?", "offset?"]
    output: "Inspector[]"
    side_effects: []

  - method: GET
    path: "/inspectors/{inspectorId}"
    description: "Get an inspector"
    roles: [HealthDirector, PermitClerk, Inspector, EnforcementOfficer]
    code: 200
    input: []
    output: Inspector
    side_effects: []

  # ---- Establishments ----
  - method: POST
    path: "/establishments"
    description: "Create an establishment (PRELICENSE); computes risk_category and routine_interval_days"
    roles: [PermitClerk]
    code: 201
    input: [name, address, "cuisine_type?", seating_capacity, "serves_raw_animal_foods?", "does_onsite_processing?"]
    output: Establishment
    side_effects: ["status = PRELICENSE", "risk_category computed (risk_category_assignment)", "routine_interval_days computed"]

  - method: GET
    path: "/establishments"
    description: "List establishments (paginated; optional status/risk_category filters)"
    roles: [HealthDirector, PermitClerk, Inspector, EnforcementOfficer]
    code: 200
    input: ["status?", "risk_category?", "limit?", "offset?"]
    output: "Establishment[]"
    side_effects: []

  - method: GET
    path: "/establishments/{establishmentId}"
    description: "Get an establishment with computed score/grade/placard fields"
    roles: [HealthDirector, PermitClerk, Inspector, EnforcementOfficer]
    code: 200
    input: []
    output: Establishment
    side_effects: []

  - method: PUT
    path: "/establishments/{establishmentId}"
    description: "Update establishment profile (recomputes risk_category)"
    roles: [PermitClerk]
    code: 200
    input: ["name?", "address?", "cuisine_type?", "seating_capacity?", "serves_raw_animal_foods?", "does_onsite_processing?"]
    output: Establishment
    side_effects: ["risk_category and routine_interval_days recomputed"]

  - method: POST
    path: "/establishments/{establishmentId}/revoke"
    description: "Revoke an establishment's permit (terminal)"
    roles: [HealthDirector]
    code: 200
    input: []
    output: Establishment
    side_effects: ["status -> REVOKED", "ACTIVE Permits -> VOID"]

  # ---- Plan Reviews (flat; establishment_id in body) ----
  - method: POST
    path: "/plan-reviews"
    description: "Submit a plan review for an establishment"
    roles: [PermitClerk]
    code: 201
    input: [establishment_id, submitted_layout_sqft, equipment_count]
    output: PlanReview
    side_effects: ["status = SUBMITTED", "plan_fee_cents computed (plan_review_fee)"]

  - method: GET
    path: "/plan-reviews"
    description: "List plan reviews; filter by establishment_id (FK reverse-reachability) or status"
    roles: [HealthDirector, PermitClerk, Inspector, EnforcementOfficer]
    code: 200
    input: ["establishment_id?", "status?", "limit?", "offset?"]
    output: "PlanReview[]"
    side_effects: []

  - method: GET
    path: "/plan-reviews/{planReviewId}"
    description: "Get a plan review"
    roles: [HealthDirector, PermitClerk, Inspector, EnforcementOfficer]
    code: 200
    input: []
    output: PlanReview
    side_effects: []

  - method: POST
    path: "/plan-reviews/{planReviewId}/approve"
    description: "Approve a submitted plan review"
    roles: [PermitClerk]
    code: 200
    input: []
    output: PlanReview
    side_effects: ["status -> APPROVED"]

  - method: POST
    path: "/plan-reviews/{planReviewId}/reject"
    description: "Reject a submitted plan review"
    roles: [PermitClerk]
    code: 200
    input: [rejection_reason]
    output: PlanReview
    side_effects: ["status -> REJECTED", "rejection_reason recorded"]

  - method: POST
    path: "/plan-reviews/{planReviewId}/resubmit"
    description: "Resubmit a rejected plan review with revised layout/equipment"
    roles: [PermitClerk]
    code: 200
    input: ["submitted_layout_sqft?", "equipment_count?"]
    output: PlanReview
    side_effects: ["status -> SUBMITTED", "revision_round += 1", "plan_fee_cents recomputed", "rejection_reason cleared"]

  # ---- Permits (flat; establishment_id + plan_review_id in body) ----
  - method: POST
    path: "/permits"
    description: "Issue a permit against an APPROVED plan review; transitions establishment to PERMITTED"
    roles: [PermitClerk]
    code: 201
    input: [establishment_id, plan_review_id]
    output: Permit
    side_effects: ["Permit ACTIVE created", "establishment PRELICENSE -> PERMITTED", "annual_fee_cents computed (permit_fee)", "next_reinspection_due_index set"]

  - method: GET
    path: "/permits"
    description: "List permits; filter by establishment_id or plan_review_id (FK reverse-reachability)"
    roles: [HealthDirector, PermitClerk, Inspector, EnforcementOfficer]
    code: 200
    input: ["establishment_id?", "plan_review_id?", "status?", "limit?", "offset?"]
    output: "Permit[]"
    side_effects: []

  - method: GET
    path: "/permits/{permitId}"
    description: "Get a permit"
    roles: [HealthDirector, PermitClerk, Inspector, EnforcementOfficer]
    code: 200
    input: []
    output: Permit
    side_effects: []

  # ---- Inspection Routes ----
  - method: POST
    path: "/inspection-routes"
    description: "Create an inspection route for an inspector on a logical day"
    roles: [PermitClerk, Inspector]
    code: 201
    input: [inspector_id, route_date_index]
    output: InspectionRoute
    side_effects: ["status = PLANNED", "planned_stop_count = 0"]

  - method: GET
    path: "/inspection-routes"
    description: "List inspection routes (optional inspector_id filter)"
    roles: [HealthDirector, PermitClerk, Inspector, EnforcementOfficer]
    code: 200
    input: ["inspector_id?", "status?", "limit?", "offset?"]
    output: "InspectionRoute[]"
    side_effects: []

  - method: GET
    path: "/inspection-routes/{routeId}"
    description: "Get an inspection route"
    roles: [HealthDirector, PermitClerk, Inspector, EnforcementOfficer]
    code: 200
    input: []
    output: InspectionRoute
    side_effects: []

  - method: POST
    path: "/inspection-routes/{routeId}/dispatch"
    description: "Dispatch a planned route (capacity check)"
    roles: [Inspector]
    code: 200
    input: []
    output: InspectionRoute
    side_effects: ["status -> DISPATCHED"]

  - method: POST
    path: "/inspection-routes/{routeId}/close"
    description: "Close a dispatched route"
    roles: [Inspector]
    code: 200
    input: []
    output: InspectionRoute
    side_effects: ["status -> COMPLETED"]

  # ---- Inspections (flat; establishment_id + inspector_id in body) ----
