# =============================================================================
# Doula & Midwifery Birth Center — Scaffold Seed Tables (Expert difficulty)
# §1.0–§1.7. Difficulty design (§1.8) and corner design (§1.9) live in sibling
# files SCAFFOLD_DIFFICULTY_DESIGN.yaml and SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Doula & Midwifery Birth Center: client intake & care plan, prenatal-visit
  schedule & risk screening (transfer criteria), birth-on-call assignment &
  backup, package (birth/postpartum) & payment plan, insurance/global-fee
  billing, birth-center room booking & hospital-transfer, postpartum/lactation
  follow-up, supply/kit

domain_name: midwifery-birth-center
api_prefix: /birth-center

# -----------------------------------------------------------------------------
# Complexity profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities linked by foreign keys; no nesting in URL paths. Every entity
  # lives directly under /birth-center/<collection>. Cross-aggregate references
  # (Episode -> Client, Booking -> Provider, Charge -> InsuranceClaim) abound.

  state_machine_shape: parallel
  # Episode of care carries two INDEPENDENT state axes on the same row:
  #   clinical_status (eligibility/transfer lifecycle) ×
  #   financial_status (billing/payment lifecycle).
  # Booking has a branching+revert lifecycle (HELD -> CONFIRMED -> IN_USE ->
  # COMPLETED, with TRANSFERRED branch). PrenatalVisit has a cyclic risk loop.

  relationship_patterns:
    - one_to_many        # Client 1—* Episode; Episode 1—* PrenatalVisit, Charge
    - cross_aggregate    # OnCallAssignment -> Provider; Booking -> Episode + Room
    - self_referential   # OnCallAssignment.backup_assignment_id -> OnCallAssignment.id

  role_model: peer_roles
  # IntakeCoordinator owns Client/Episode/Package intake; Midwife owns clinical
  # screening + birth attendance; BillingClerk owns Charges/Claims/PaymentPlans;
  # CenterAdmin is the operational superset for rooms, on-call rosters, supply
  # kits, and the logical clock. Roles do not overlap on exclusive operations.

  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — emitted verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ---------------------------------------------------------------------------
  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Pregnant client legal name" }
      - { name: date_of_birth, type: datetime, source: input, description: "Client DOB (ISO 8601 date)" }
      - { name: parity, type: integer, source: input, description: "Number of prior births", constraints: ">= 0" }
      - { name: insurance_payer, type: string, source: input, description: "Insurance payer name; empty string means self-pay", default: "" }
      - { name: policy_number, type: string, source: input, description: "Insurance policy number; empty when self-pay", default: "" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ARCHIVED", default: "ACTIVE", constraints: "ACTIVE | ARCHIVED" }

  # ---------------------------------------------------------------------------
  - name: CarePackage
    parent: null
    common_fields: false
    note: "Configuration entity; price list. Immutable once created (no version/update)."
    fields:
      - { name: code, type: string, source: input, description: "Unique package code, e.g. BIRTH_FULL", constraints: "unique across CarePackage" }
      - { name: package_type, type: enum, source: input, description: "BIRTH | POSTPARTUM | COMBINED", constraints: "BIRTH | POSTPARTUM | COMBINED" }
      - { name: global_fee_cents, type: integer, source: input, description: "Global (bundled) fee for the package in cents", constraints: ">= 0" }
      - { name: prenatal_visits_included, type: integer, source: input, description: "Count of prenatal visits bundled into the global fee", constraints: ">= 0" }
      - { name: postpartum_visits_included, type: integer, source: input, description: "Count of postpartum/lactation visits bundled in", constraints: ">= 0" }
      - { name: kit_sku, type: string, source: input, description: "FK -> SupplyKit.sku; birth-kit SKU bundled with this package" }

  # ---------------------------------------------------------------------------
  - name: SupplyKit
    parent: null
    common_fields: true
    note: "Inventory of birth kits. on_hand decrements on Episode kit issuance, restores on cancellation."
    fields:
      - { name: sku, type: string, source: input, description: "Unique kit SKU", constraints: "unique across SupplyKit" }
      - { name: name, type: string, source: input, description: "Kit display name" }
      - { name: on_hand_count, type: integer, source: input, description: "Units physically in stock and available", constraints: ">= 0" }
      - { name: reserved_count, type: integer, source: computed, description: "Units reserved by Episodes in PLANNING/ACTIVE clinical state (not yet consumed)", default: 0 }
      - { name: consumed_count, type: integer, source: computed, description: "Units consumed by Episodes whose birth was attended (clinical_status BORN or COMPLETED)", default: 0 }

  # ---------------------------------------------------------------------------
  - name: Provider
    parent: null
    common_fields: true
    note: "Midwives and birth doulas eligible for on-call."
    fields:
      - { name: full_name, type: string, source: input, description: "Provider name" }
      - { name: role_type, type: enum, source: input, description: "MIDWIFE | DOULA", constraints: "MIDWIFE | DOULA" }
      - { name: license_number, type: string, source: input, description: "Clinical license number" }
      - { name: max_active_episodes, type: integer, source: input, description: "Max episodes for which provider may be primary on-call at once", constraints: ">= 1" }
      - { name: active_assignment_count, type: integer, source: computed, description: "Count of OnCallAssignment rows where this provider is primary and status in {ASSIGNED, ON_DUTY}", default: 0 }
      - { name: status, type: enum, source: system, description: "AVAILABLE | UNAVAILABLE", default: "AVAILABLE", constraints: "AVAILABLE | UNAVAILABLE" }

  # ---------------------------------------------------------------------------
  - name: Room
    parent: null
    common_fields: true
    note: "Birth-center labor/delivery rooms; booked over time intervals."
    fields:
      - { name: name, type: string, source: input, description: "Room label, e.g. 'Garden Suite'" }
      - { name: turnover_minutes, type: integer, source: input, description: "Mandatory cleaning buffer enforced AFTER each booking before the next may start", constraints: ">= 0", default: 0 }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED (CLOSED rooms reject new bookings)", default: "OPEN", constraints: "OPEN | CLOSED" }

  # ---------------------------------------------------------------------------
  - name: Episode
    parent: null
    common_fields: true
    note: |
      Episode of care — the central aggregate. Carries TWO independent parallel
      state axes: clinical_status and financial_status. Links Client + CarePackage.
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the pregnant client" }
      - { name: package_code, type: string, source: input, description: "FK -> CarePackage.code; selected care package" }
      - { name: edd, type: datetime, source: input, description: "Estimated due date (ISO 8601 date)" }
      - { name: clinical_status, type: enum, source: system, description: "Clinical axis: PLANNING | ACTIVE | TRANSFERRED | BORN | COMPLETED", default: "PLANNING", constraints: "PLANNING | ACTIVE | TRANSFERRED | BORN | COMPLETED" }
      - { name: financial_status, type: enum, source: system, description: "Financial axis: UNBILLED | PLAN_ACTIVE | SETTLED | WRITTEN_OFF", default: "UNBILLED", constraints: "UNBILLED | PLAN_ACTIVE | SETTLED | WRITTEN_OFF" }
      - { name: risk_tier, type: enum, source: computed, description: "LOW | ELEVATED | TRANSFER_REQUIRED — highest tier implied by latest PrenatalVisit screenings", default: "LOW", constraints: "LOW | ELEVATED | TRANSFER_REQUIRED" }
      - { name: kit_issued, type: boolean, source: computed, description: "True once a SupplyKit unit has been reserved for this episode", default: false }
      - { name: prenatal_visits_completed, type: integer, source: computed, description: "Count of PrenatalVisit rows on this episode in status COMPLETED", default: 0 }
      - { name: global_fee_cents, type: integer, source: computed, description: "Snapshot of CarePackage.global_fee_cents at episode creation", default: 0 }
      - { name: balance_due_cents, type: integer, source: computed, description: "Net client responsibility: sum of unbilled+billed Charge.client_responsibility_cents minus PaymentPlan paid", default: 0 }

  # ---------------------------------------------------------------------------
  - name: PrenatalVisit
    parent: null
    common_fields: true
    note: |
      Scheduled prenatal/postpartum visit on an episode. Risk screening result
      drives Episode.risk_tier. Cyclic: a visit can be SCHEDULED -> COMPLETED,
      and a later visit can de-escalate or escalate risk (loop on the episode).
    fields:
      - { name: episode_id, type: string, source: input, description: "FK -> Episode.id; owning episode" }
      - { name: visit_kind, type: enum, source: input, description: "PRENATAL | POSTPARTUM | LACTATION", constraints: "PRENATAL | POSTPARTUM | LACTATION" }
      - { name: scheduled_at, type: datetime, source: input, description: "Visit appointment time (ISO 8601)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | NO_SHOW | CANCELLED", default: "SCHEDULED", constraints: "SCHEDULED | COMPLETED | NO_SHOW | CANCELLED" }
      - { name: blood_pressure_systolic, type: integer, source: input, description: "Systolic BP recorded at completion; null until completed", default: null }
      - { name: risk_flag, type: enum, source: input, description: "Screening outcome recorded at completion: NONE | WATCH | TRANSFER. null until completed", default: null, constraints: "NONE | WATCH | TRANSFER" }

  # ---------------------------------------------------------------------------
  - name: OnCallAssignment
    parent: null
    common_fields: true
    note: |
      Birth on-call coverage for an episode. Self-referential: a primary
      assignment names a backup assignment (different provider). Branch/revert
      lifecycle. Guarded by Episode.clinical_status and Provider capacity.
    fields:
      - { name: episode_id, type: string, source: input, description: "FK -> Episode.id; episode covered" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; primary on-call provider" }
      - { name: coverage_start, type: datetime, source: input, description: "On-call coverage window start (ISO 8601), inclusive" }
      - { name: coverage_end, type: datetime, source: input, description: "On-call coverage window end (ISO 8601), inclusive" }
      - { name: backup_assignment_id, type: string, source: system, description: "FK -> OnCallAssignment.id; the backup assignment created for this primary (null until a backup is named)", default: null }
      - { name: coverage_role, type: enum, source: input, description: "PRIMARY | BACKUP", default: "PRIMARY", constraints: "PRIMARY | BACKUP" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | ON_DUTY | RELEASED | PROMOTED | STOOD_DOWN", default: "ASSIGNED", constraints: "ASSIGNED | ON_DUTY | RELEASED | PROMOTED | STOOD_DOWN" }

  # ---------------------------------------------------------------------------
  - name: Booking
    parent: null
    common_fields: true
    note: |
      Birth-center room booking for an episode over a time interval. Branching
      lifecycle with a TRANSFERRED branch (hospital transfer) whose side effects
      differ from normal COMPLETED. Temporal overlap enforced with room turnover.
    fields:
      - { name: episode_id, type: string, source: input, description: "FK -> Episode.id; episode this booking serves" }
      - { name: room_id, type: string, source: input, description: "FK -> Room.id; booked room" }
      - { name: starts_at, type: datetime, source: input, description: "Booking start (ISO 8601), inclusive" }
      - { name: ends_at, type: datetime, source: input, description: "Booking end (ISO 8601), exclusive" }
      - { name: status, type: enum, source: system, description: "HELD | CONFIRMED | IN_USE | COMPLETED | TRANSFERRED | CANCELLED", default: "HELD", constraints: "HELD | CONFIRMED | IN_USE | COMPLETED | TRANSFERRED | CANCELLED" }

  # ---------------------------------------------------------------------------
  - name: InsuranceClaim
    parent: null
    common_fields: true
    note: |
      Global-fee insurance claim submitted for an episode. Allowed amount and
      adjudication drive client responsibility on Charges.
    fields:
      - { name: episode_id, type: string, source: input, description: "FK -> Episode.id; episode billed" }
      - { name: billed_amount_cents, type: integer, source: computed, description: "Snapshot of Episode.global_fee_cents at submission", default: 0 }
      - { name: allowed_amount_cents, type: integer, source: input, description: "Payer-allowed amount entered on adjudication; <= billed_amount_cents", default: 0 }
      - { name: paid_amount_cents, type: integer, source: input, description: "Payer-paid amount entered on adjudication; <= allowed_amount_cents", default: 0 }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ADJUDICATED | DENIED | VOID", default: "SUBMITTED", constraints: "SUBMITTED | ADJUDICATED | DENIED | VOID" }

  # ---------------------------------------------------------------------------
  - name: Charge
    parent: null
    common_fields: true
    note: |
      A line item on an episode. Either the bundled global-fee charge or an
      out-of-bundle extra. client_responsibility_cents depends on whether a
      claim has adjudicated (dual-variant: estimate vs adjudicated).
    fields:
      - { name: episode_id, type: string, source: input, description: "FK -> Episode.id; episode charged" }
      - { name: claim_id, type: string, source: input, description: "FK -> InsuranceClaim.id; claim covering this charge; empty for self-pay/extra", default: "" }
      - { name: charge_kind, type: enum, source: input, description: "GLOBAL_FEE | EXTRA_VISIT | SUPPLY | TRANSFER_FEE", constraints: "GLOBAL_FEE | EXTRA_VISIT | SUPPLY | TRANSFER_FEE" }
      - { name: amount_cents, type: integer, source: input, description: "Gross charge amount in cents", constraints: ">= 0" }
      - { name: client_responsibility_cents, type: integer, source: computed, description: "Client portion after insurance allowed/paid applied; recomputed on claim adjudication", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | BILLED | PAID | VOID", default: "DRAFT", constraints: "DRAFT | BILLED | PAID | VOID" }

  # ---------------------------------------------------------------------------
  - name: PaymentPlan
    parent: null
    common_fields: true
    note: |
      Installment plan for the client-responsibility balance on an episode.
      Waterfall allocation of each payment across ordered installments.
    fields:
      - { name: episode_id, type: string, source: input, description: "FK -> Episode.id; episode the plan settles" }
      - { name: total_cents, type: integer, source: computed, description: "Snapshot of Episode.balance_due_cents at plan creation", default: 0 }
      - { name: installment_count, type: integer, source: input, description: "Number of equal installments", constraints: ">= 1" }
      - { name: paid_cents, type: integer, source: computed, description: "Cumulative payments applied to this plan", default: 0 }
      - { name: remaining_cents, type: integer, source: computed, description: "total_cents - paid_cents; never negative", default: 0 }
      - { name: status, type: enum, source: system, description: "OPEN | PAID_OFF | DEFAULTED | CANCELLED", default: "OPEN", constraints: "OPEN | PAID_OFF | DEFAULTED | CANCELLED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  # Episode — CLINICAL axis (parallel dimension #1)
  # ---------------------------------------------------------------------------
  - entity: Episode
    field: clinical_status
    initial_state: PLANNING
    terminal_states: [COMPLETED]
    note: "Parallel axis 1. Evolves independently of financial_status."
    transitions:
      - from: PLANNING
        to: ACTIVE
        trigger: "POST /birth-center/episodes/{id}/activate"
        actor: Midwife
        preconditions:
          - "Episode.clinical_status == PLANNING"
          - "Episode.risk_tier != TRANSFER_REQUIRED"
          - "kit_issued == true (a SupplyKit unit has been reserved)"
        side_effects:
          - "Episode.clinical_status -> ACTIVE"
          - "increments Episode.version by 1"

      - from: [PLANNING, ACTIVE]
        to: TRANSFERRED
        trigger: "POST /birth-center/episodes/{id}/transfer"
        actor: Midwife
        preconditions:
          - "Episode.clinical_status in {PLANNING, ACTIVE}"
        side_effects:
          - "Episode.clinical_status -> TRANSFERRED"
          - "CASCADE: the episode's HELD/CONFIRMED/IN_USE Booking (if any) -> TRANSFERRED (Booking transition fires its own side effects: releases room interval and creates a TRANSFER_FEE Charge of TRANSFER_FEE_CENTS)"
          - "CASCADE: the episode's primary OnCallAssignment in {ASSIGNED, ON_DUTY} -> STOOD_DOWN; that STOOD_DOWN itself decrements its Provider.active_assignment_count and, if a backup_assignment exists, promotes the backup (backup ASSIGNED -> PROMOTED, then the promoted backup's provider active count increments)"
          - "SupplyKit: reserved unit for this episode is treated as consumed (reserved_count-- , consumed_count++) — kit is non-recoverable once transfer occurs"
          - "increments Episode.version by 1"

      - from: ACTIVE
        to: BORN
        trigger: "POST /birth-center/episodes/{id}/record-birth"
        actor: Midwife
        preconditions:
          - "Episode.clinical_status == ACTIVE"
          - "Episode has a Booking in status IN_USE"
        side_effects:
          - "Episode.clinical_status -> BORN"
          - "the episode's IN_USE Booking -> COMPLETED (Booking transition releases the room and frees the interval at ends_at)"
          - "SupplyKit: reserved unit consumed (reserved_count--, consumed_count++)"
          - "Episode.global_fee_cents becomes billable: a GLOBAL_FEE Charge already in DRAFT may now be billed"
          - "increments Episode.version by 1"

      - from: BORN
        to: COMPLETED
        trigger: "POST /birth-center/episodes/{id}/complete-care"
        actor: Midwife
        preconditions:
          - "Episode.clinical_status == BORN"
          - "prenatal_visits_completed >= CarePackage.postpartum_visits_included for the episode's package (postpartum follow-up fulfilled)"
        side_effects:
          - "Episode.clinical_status -> COMPLETED"
          - "increments Episode.version by 1"

  # ---------------------------------------------------------------------------
  # Episode — FINANCIAL axis (parallel dimension #2)
  # ---------------------------------------------------------------------------
  - entity: Episode
    field: financial_status
    initial_state: UNBILLED
    terminal_states: [SETTLED, WRITTEN_OFF]
    note: "Parallel axis 2. Independent of clinical_status."
    transitions:
      - from: UNBILLED
        to: PLAN_ACTIVE
        trigger: "POST /birth-center/payment-plans (creates the plan)"
        actor: BillingClerk
        preconditions:
          - "Episode.financial_status == UNBILLED"
          - "Episode.balance_due_cents > 0"
        side_effects:
          - "Episode.financial_status -> PLAN_ACTIVE"
          - "PaymentPlan created in OPEN with total_cents = Episode.balance_due_cents"
          - "increments Episode.version by 1"

      - from: PLAN_ACTIVE
        to: SETTLED
        trigger: "system (PaymentPlan reaches remaining_cents == 0 via POST .../payments)"
        actor: system
        preconditions:
          - "Episode.financial_status == PLAN_ACTIVE"
          - "the episode's PaymentPlan.remaining_cents == 0"
        side_effects:
          - "Episode.financial_status -> SETTLED"
          - "PaymentPlan.status -> PAID_OFF"
          - "all BILLED Charges on the episode -> PAID"
          - "increments Episode.version by 1"

      - from: [UNBILLED, PLAN_ACTIVE]
        to: WRITTEN_OFF
        trigger: "POST /birth-center/episodes/{id}/write-off"
        actor: BillingClerk
        preconditions:
          - "Episode.financial_status in {UNBILLED, PLAN_ACTIVE}"
        side_effects:
          - "Episode.financial_status -> WRITTEN_OFF"
          - "the episode's OPEN PaymentPlan (if any) -> CANCELLED"
          - "all DRAFT/BILLED Charges on the episode -> VOID"
          - "increments Episode.version by 1"

  # ---------------------------------------------------------------------------
  # PrenatalVisit — cyclic risk loop
  # ---------------------------------------------------------------------------
  - entity: PrenatalVisit
    field: status
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    note: "Completing a visit records a risk_flag that re-derives Episode.risk_tier (escalate or de-escalate — cyclic effect on the episode)."
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /birth-center/prenatal-visits/{id}/complete"
        actor: Midwife
        preconditions:
          - "PrenatalVisit.status == SCHEDULED"
          - "risk_flag input in {NONE, WATCH, TRANSFER}"
          - "Episode.clinical_status not in {TRANSFERRED, COMPLETED}"
        side_effects:
          - "PrenatalVisit.status -> COMPLETED; persists blood_pressure_systolic and risk_flag"
          - "CASCADE: re-derive Episode.risk_tier from the episode's COMPLETED visits (see calc episode_risk_tier); this re-derivation may flip Episode.risk_tier up OR down"
          - "if the re-derived Episode.risk_tier == TRANSFER_REQUIRED while Episode.clinical_status == ACTIVE: no auto-transfer, but the episode is barred from record-birth until a transfer is performed"
          - "increments Episode.version by 1 and PrenatalVisit.version by 1"

      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /birth-center/prenatal-visits/{id}/mark-no-show"
        actor: Midwife
        preconditions:
          - "PrenatalVisit.status == SCHEDULED"
          - "current logical clock >= PrenatalVisit.scheduled_at"
        side_effects:
          - "PrenatalVisit.status -> NO_SHOW"
          - "increments PrenatalVisit.version by 1"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /birth-center/prenatal-visits/{id}/cancel"
        actor: [Midwife, IntakeCoordinator]
        preconditions:
          - "PrenatalVisit.status == SCHEDULED"
        side_effects:
          - "PrenatalVisit.status -> CANCELLED"
          - "increments PrenatalVisit.version by 1"

  # ---------------------------------------------------------------------------
  # OnCallAssignment — branch + revert/promote lifecycle
  # ---------------------------------------------------------------------------
  - entity: OnCallAssignment
    field: status
    initial_state: ASSIGNED
    terminal_states: [RELEASED, STOOD_DOWN]
    note: "Self-referential backup chain. PROMOTED is reached only by a backup whose primary stood down."
    transitions:
      - from: ASSIGNED
        to: ON_DUTY
        trigger: "POST /birth-center/on-call-assignments/{id}/go-on-duty"
        actor: CenterAdmin
        preconditions:
          - "OnCallAssignment.status == ASSIGNED"
          - "OnCallAssignment.coverage_role == PRIMARY"
          - "the episode's clinical_status == ACTIVE"
        side_effects:
          - "OnCallAssignment.status -> ON_DUTY"
          - "increments OnCallAssignment.version by 1"

      - from: [ASSIGNED, ON_DUTY]
        to: RELEASED
        trigger: "POST /birth-center/on-call-assignments/{id}/release"
        actor: CenterAdmin
        preconditions:
          - "OnCallAssignment.status in {ASSIGNED, ON_DUTY}"
          - "OnCallAssignment.coverage_role == PRIMARY"
          - "the episode's clinical_status in {BORN, COMPLETED, TRANSFERRED} (coverage no longer needed)"
        side_effects:
          - "OnCallAssignment.status -> RELEASED"
          - "decrements the provider's active_assignment_count by 1"
          - "increments OnCallAssignment.version by 1"

      - from: [ASSIGNED, ON_DUTY]
        to: STOOD_DOWN
        trigger: "system (episode transfer cascade)"
        actor: system
        preconditions:
          - "OnCallAssignment.status in {ASSIGNED, ON_DUTY}"
          - "OnCallAssignment.coverage_role == PRIMARY"
        side_effects:
          - "OnCallAssignment.status -> STOOD_DOWN"
          - "decrements the provider's active_assignment_count by 1"
          - "CASCADE: if backup_assignment_id is set, the referenced backup assignment (BACKUP, ASSIGNED) -> PROMOTED; that promotion increments the backup provider's active_assignment_count by 1"
          - "increments OnCallAssignment.version by 1"

      - from: ASSIGNED
        to: PROMOTED
        trigger: "system (primary stood down, this backup promoted)"
        actor: system
        preconditions:
          - "OnCallAssignment.status == ASSIGNED"
          - "OnCallAssignment.coverage_role == BACKUP"
        side_effects:
          - "OnCallAssignment.status -> PROMOTED"
          - "increments the backup provider's active_assignment_count by 1"
          - "increments OnCallAssignment.version by 1"

  # ---------------------------------------------------------------------------
  # Booking — branching room lifecycle with TRANSFERRED branch
  # ---------------------------------------------------------------------------
  - entity: Booking
    field: status
    initial_state: HELD
    terminal_states: [COMPLETED, TRANSFERRED, CANCELLED]
    note: "Two distinct terminal success paths: COMPLETED (birth at center) vs TRANSFERRED (hospital transfer) with divergent side effects."
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /birth-center/bookings/{id}/confirm"
        actor: CenterAdmin
        preconditions:
          - "Booking.status == HELD"
          - "Room.status == OPEN"
        side_effects:
          - "Booking.status -> CONFIRMED"
          - "increments Booking.version by 1"

      - from: CONFIRMED
        to: IN_USE
        trigger: "POST /birth-center/bookings/{id}/check-in"
        actor: CenterAdmin
        preconditions:
          - "Booking.status == CONFIRMED"
          - "the episode's clinical_status == ACTIVE"
          - "current logical clock >= Booking.starts_at"
        side_effects:
          - "Booking.status -> IN_USE"
          - "increments Booking.version by 1"

      - from: IN_USE
        to: COMPLETED
        trigger: "system (Episode record-birth cascade)"
        actor: system
        preconditions:
          - "Booking.status == IN_USE"
        side_effects:
          - "Booking.status -> COMPLETED"
          - "room interval is released at ends_at (no further occupancy)"
          - "increments Booking.version by 1"

      - from: [HELD, CONFIRMED, IN_USE]
        to: TRANSFERRED
        trigger: "system (Episode transfer cascade)"
        actor: system
        preconditions:
          - "Booking.status in {HELD, CONFIRMED, IN_USE}"
        side_effects:
          - "Booking.status -> TRANSFERRED"
          - "room interval released immediately"
          - "creates a Charge of charge_kind=TRANSFER_FEE, amount_cents=TRANSFER_FEE_CENTS, status=DRAFT on the episode"
          - "increments Booking.version by 1"

      - from: [HELD, CONFIRMED]
        to: CANCELLED
        trigger: "POST /birth-center/bookings/{id}/cancel"
        actor: CenterAdmin
        preconditions:
          - "Booking.status in {HELD, CONFIRMED}"
        side_effects:
          - "Booking.status -> CANCELLED"
          - "room interval released"
          - "increments Booking.version by 1"

  # ---------------------------------------------------------------------------
  # InsuranceClaim — adjudication lifecycle
  # ---------------------------------------------------------------------------
  - entity: InsuranceClaim
    field: status
    initial_state: SUBMITTED
    terminal_states: [VOID]
    note: "Adjudication recomputes client_responsibility on the episode's GLOBAL_FEE charge (dual-variant estimate->adjudicated)."
    transitions:
      - from: SUBMITTED
        to: ADJUDICATED
        trigger: "POST /birth-center/insurance-claims/{id}/adjudicate"
        actor: BillingClerk
        preconditions:
          - "InsuranceClaim.status == SUBMITTED"
          - "allowed_amount_cents <= billed_amount_cents"
          - "paid_amount_cents <= allowed_amount_cents"
        side_effects:
          - "InsuranceClaim.status -> ADJUDICATED"
          - "CASCADE: recompute client_responsibility_cents on the episode's GLOBAL_FEE Charge using the ADJUDICATED variant (= allowed_amount_cents - paid_amount_cents); that recompute re-derives Episode.balance_due_cents and increments Episode.version by 1"
          - "increments InsuranceClaim.version by 1"

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /birth-center/insurance-claims/{id}/deny"
        actor: BillingClerk
        preconditions:
          - "InsuranceClaim.status == SUBMITTED"
        side_effects:
          - "InsuranceClaim.status -> DENIED"
          - "CASCADE: the episode's GLOBAL_FEE Charge client_responsibility_cents -> full amount_cents (client owes entire global fee); re-derives Episode.balance_due_cents and increments Episode.version by 1"
          - "increments InsuranceClaim.version by 1"

      - from: [SUBMITTED, DENIED]
        to: VOID
        trigger: "POST /birth-center/insurance-claims/{id}/void"
        actor: BillingClerk
        preconditions:
          - "InsuranceClaim.status in {SUBMITTED, DENIED}"
          - "no PaymentPlan exists for the episode (cannot void after a plan is built on the balance)"
        side_effects:
          - "InsuranceClaim.status -> VOID"
          - "CASCADE: GLOBAL_FEE Charge reverts to ESTIMATE variant client_responsibility (= global_fee_cents * SELF_PAY_ESTIMATE_PCT); re-derives Episode.balance_due_cents and increments Episode.version by 1"
          - "increments InsuranceClaim.version by 1"

  # ---------------------------------------------------------------------------
  # PaymentPlan — installment lifecycle
  # ---------------------------------------------------------------------------
  - entity: PaymentPlan
    field: status
    initial_state: OPEN
    terminal_states: [PAID_OFF, DEFAULTED, CANCELLED]
    transitions:
      - from: OPEN
        to: PAID_OFF
        trigger: "system (a POST .../payments drives remaining_cents to 0)"
        actor: system
        preconditions:
          - "PaymentPlan.status == OPEN"
          - "remaining_cents == 0 after the payment is applied"
        side_effects:
          - "PaymentPlan.status -> PAID_OFF"
          - "CASCADE: episode financial_status PLAN_ACTIVE -> SETTLED; that transition marks all BILLED Charges on the episode -> PAID"
          - "increments PaymentPlan.version by 1"

      - from: OPEN
        to: DEFAULTED
        trigger: "POST /birth-center/payment-plans/{id}/default"
        actor: BillingClerk
        preconditions:
          - "PaymentPlan.status == OPEN"
          - "remaining_cents > 0"
        side_effects:
          - "PaymentPlan.status -> DEFAULTED"
          - "increments PaymentPlan.version by 1"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: plan-create-stale-episode
    parent_entity: Episode
    write_endpoint: "POST /birth-center/payment-plans"
    occ_field: "expected_episode_version"
    description: |
      Creating a PaymentPlan against an Episode whose version has advanced since
      the client last observed it is rejected. A PaymentPlan snapshots
      Episode.balance_due_cents into total_cents at creation; if another writer
      adjudicated/denied a claim (which re-derives balance_due_cents and bumps
      Episode.version) after the client read the episode, the client's view of
      the balance is stale and the plan would lock in a wrong total. The stale
      expected_episode_version is rejected so the client must re-read first.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: booking-create-stale-room
    parent_entity: Room
    write_endpoint: "POST /birth-center/bookings"
    occ_field: "expected_room_version"
    description: |
      Creating a Booking against a Room whose version has advanced since the
      client last observed it is rejected. A room's occupancy footprint changes
      when another writer creates or cancels a booking on it (each such write
      bumps Room.version). A booking request carrying a stale
      expected_room_version computed its non-overlap against an out-of-date room
      occupancy and is rejected so the client re-reads the room's current
      bookings before retrying.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # -- DUAL-VARIANT #1 (Charge domain): client responsibility on the global fee
  - name: charge_client_responsibility
    trigger: "GLOBAL_FEE Charge created; recomputed on InsuranceClaim adjudicate/deny/void"
    algorithm: forward_looking
    formula: |
      For a GLOBAL_FEE Charge on an episode:
        ESTIMATE variant (no claim adjudicated yet — claim SUBMITTED or absent):
          client_responsibility_cents = round_half_up(amount_cents * SELF_PAY_ESTIMATE_PCT)
        ADJUDICATED variant (claim ADJUDICATED):
          client_responsibility_cents = allowed_amount_cents - paid_amount_cents
        DENIED variant (claim DENIED):
          client_responsibility_cents = amount_cents   # client owes full global fee
      For EXTRA_VISIT / SUPPLY / TRANSFER_FEE charges:
        client_responsibility_cents = amount_cents   # always full, never insured
    input_set: "The single GLOBAL_FEE Charge per episode plus its linked InsuranceClaim (if any). Extra charges are always full responsibility."
    constants:
      SELF_PAY_ESTIMATE_PCT: 0.20
    precision: "integer cents, round_half_up on the ESTIMATE multiply"
    variants:
      - { name: estimate, when: "no claim adjudicated", difference: "20% self-pay estimate of the gross global fee" }
      - { name: adjudicated, when: "claim ADJUDICATED", difference: "allowed minus paid (true patient responsibility)" }
      - { name: denied, when: "claim DENIED", difference: "client owes the entire gross global fee" }

  # -- DUAL-VARIANT #2 (Provider domain): on-call capacity load score
  - name: provider_capacity_load
    trigger: "OnCallAssignment create, go-on-duty, release, stand-down, promote"
    algorithm: aggregation
    formula: |
      PRIMARY-LOAD variant (used to gate new PRIMARY assignments and persisted in
      Provider.active_assignment_count — counts rows that carry active primary coverage):
        load = count(OnCallAssignment where provider_id == P
                     and (
                       (coverage_role == PRIMARY and status in {ASSIGNED, ON_DUTY})
                       OR (coverage_role == BACKUP and status == PROMOTED)
                     ))
        A PROMOTED backup is now carrying primary coverage, so it counts. A new PRIMARY
        assignment is allowed only if load < Provider.max_active_episodes.
      COVERAGE-LOAD variant (roster reporting; counts not-yet-promoted backups too):
        coverage_load = count(OnCallAssignment where provider_id == P
                              and status in {ASSIGNED, ON_DUTY, PROMOTED})
        This differs from PRIMARY-LOAD precisely for a provider holding a BACKUP row still in
        ASSIGNED (counted by coverage_load, not by primary_load).
      Provider.active_assignment_count persists the PRIMARY-LOAD variant.
    input_set: "OnCallAssignment rows for the provider, filtered by coverage_role and status as above."
    constants: {}
    precision: "integer counts"
    variants:
      - { name: primary_load, when: "gating a new PRIMARY assignment", difference: "counts only PRIMARY rows in {ASSIGNED, ON_DUTY}" }
      - { name: coverage_load, when: "roster reporting", difference: "counts PRIMARY and BACKUP rows in {ASSIGNED, ON_DUTY, PROMOTED}" }

  # -- COMBINATORIAL mode (a): risk tier with >=3 inputs and non-linear branching
  - name: episode_risk_tier
    trigger: "PrenatalVisit complete (re-derive on the episode)"
    algorithm: weighted_scoring
    formula: |
      Consider only the episode's COMPLETED PrenatalVisits. Let:
        worst_flag      = highest risk_flag among them, ordered NONE < WATCH < TRANSFER
        max_systolic    = max(blood_pressure_systolic among them; 0 if none recorded)
        watch_count     = count of COMPLETED visits whose risk_flag == WATCH
      Then (evaluated top-down, first match wins):
        if worst_flag == TRANSFER                       -> TRANSFER_REQUIRED
        elif max_systolic >= BP_TRANSFER_THRESHOLD      -> TRANSFER_REQUIRED
        elif worst_flag == WATCH and watch_count >= WATCH_ESCALATION_COUNT -> TRANSFER_REQUIRED
        elif worst_flag == WATCH                         -> ELEVATED
        elif max_systolic >= BP_ELEVATED_THRESHOLD       -> ELEVATED
        else                                             -> LOW
      With no COMPLETED visits, risk_tier defaults to LOW.
    input_set: "Episode's PrenatalVisits with status == COMPLETED only. SCHEDULED/NO_SHOW/CANCELLED excluded."
    constants:
      BP_ELEVATED_THRESHOLD: 140
      BP_TRANSFER_THRESHOLD: 160
      WATCH_ESCALATION_COUNT: 2
    precision: "exact integer comparisons; boundary is inclusive (>=)"

  # -- COMBINATORIAL mode (b): payment waterfall with per-installment rounding order pinned
  - name: payment_plan_waterfall
    trigger: "POST /birth-center/payment-plans/{id}/payments"
    algorithm: waterfall_allocation
    formula: |
      Installment schedule is computed ONCE at plan creation and pinned:
        base = floor(total_cents / installment_count)
        remainder = total_cents - base * installment_count
        Installments are ordered 1..installment_count. The first `remainder`
        installments get (base + 1) cents; the rest get `base` cents.
        (ROUNDING ORDER IS PINNED: distribute the remainder to the EARLIEST
        installments FIRST, never spread evenly or to the last installment.)
      Applying a payment of amount_cents:
        Walk installments in order 1..N. For each not-yet-fully-paid installment,
        apply min(remaining_payment, installment_due - installment_paid). Continue
        to the next installment only after the current one is fully covered.
        Overpayment beyond the final installment is REJECTED (ERR_OVERPAYMENT) —
        the payment must not exceed PaymentPlan.remaining_cents.
        paid_cents += applied; remaining_cents = total_cents - paid_cents.
    input_set: "The plan's pinned installment schedule plus cumulative paid_cents."
    constants: {}
    precision: "integer cents; floor on base, remainder to earliest installments"

  # -- COMBINATORIAL mode (c): episode balance with pinned evaluation order (circular-looking)
  - name: episode_balance_due
    trigger: "Charge create/void/recompute; InsuranceClaim adjudicate/deny/void; PaymentPlan payment"
    algorithm: aggregation
    formula: |
      EVALUATION ORDER IS PINNED to avoid circularity between charges and plan:
        STEP 1 — sum charge responsibility:
          gross_responsibility =
            sum(client_responsibility_cents for Charges on episode with status in {DRAFT, BILLED})
          (VOID and PAID charges excluded.)
        STEP 2 — subtract plan payments ONLY IF a PaymentPlan exists:
          if episode has a PaymentPlan in {OPEN, PAID_OFF}:
            balance_due_cents = max(0, plan.total_cents - plan.paid_cents)
          else:
            balance_due_cents = gross_responsibility
      Note: once a plan exists, the plan's frozen total_cents (snapshot taken at
      plan creation) governs the balance — later charge edits do NOT retroactively
      change a frozen plan total. This pins the order: charges feed the plan total
      at creation; thereafter the plan governs.
    input_set: "DRAFT/BILLED Charges on the episode, plus the episode's PaymentPlan if present."
    constants:
      TRANSFER_FEE_CENTS: 75000
    precision: "integer cents; max(0, ...) floor"

  # -- Aggregation: supply kit availability reconciliation (derived-field)
  - name: supply_kit_counters
    trigger: "Episode create (kit reserve), activate, transfer, record-birth, write-off, cancel"
    algorithm: aggregation
    formula: |
      reserved_count = count(Episodes that reserved this kit and whose
                             clinical_status in {PLANNING, ACTIVE})
      consumed_count = count(Episodes that reserved this kit and whose
                             clinical_status in {BORN, COMPLETED, TRANSFERRED})
      available = on_hand_count - reserved_count   (must stay >= 0; a reserve
                  that would drive available below 0 is rejected with
                  ERR_KIT_OUT_OF_STOCK)
    input_set: "Episodes grouped by the SupplyKit they reserved (via their CarePackage.kit_sku)."
    constants: {}
    precision: "integer counts"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role in X-User-Role is permitted to perform this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body referenced resources exist (validated left-to-right). Includes FK targets like client_id, package_code, room_id, provider_id, episode_id, claim_id, kit_sku."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, integers within stated constraints (parity>=0, amount_cents>=0, installment_count>=1)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

  - priority: 5
    category: existence
    check: "Uniqueness: CarePackage.code, SupplyKit.sku unique on create"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: ["POST /birth-center/care-packages", "POST /birth-center/supply-kits"]

  - priority: 6
    category: state
    check: "Target resource is in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_safety
    check: "Episode cannot ACTIVATE while risk_tier == TRANSFER_REQUIRED (clinical safety gate)"
    error_id: ERR_RISK_TRANSFER_REQUIRED
    http_status: 409
    applies_to: ["POST /birth-center/episodes/{id}/activate"]

  - priority: 8
    category: business_safety
    check: "Episode cannot record-birth while risk_tier == TRANSFER_REQUIRED (must transfer to hospital first)"
    error_id: ERR_RISK_TRANSFER_REQUIRED
    http_status: 409
    applies_to: ["POST /birth-center/episodes/{id}/record-birth"]

  - priority: 9
    category: business_referential
    check: "OnCallAssignment backup provider must differ from primary provider; a BACKUP cannot reference itself or share the primary's provider_id"
    error_id: ERR_BACKUP_SAME_PROVIDER
    http_status: 409
    applies_to: ["POST /birth-center/on-call-assignments/{id}/name-backup"]

  - priority: 10
    category: business_constraint
    check: "Provider PRIMARY-LOAD must be below max_active_episodes before a new PRIMARY assignment (capacity)"
    error_id: ERR_PROVIDER_AT_CAPACITY
    http_status: 409
    applies_to: ["POST /birth-center/on-call-assignments"]

  - priority: 11
    category: business_temporal
    check: "Provider on-call coverage windows must not overlap for the same primary provider across that provider's PRIMARY assignments in {ASSIGNED, ON_DUTY, PROMOTED}. CLOSED-interval semantics [coverage_start, coverage_end]: touching endpoints DO collide (coverage_end == other.coverage_start is a conflict). No buffer."
    error_id: ERR_PROVIDER_WINDOW_OVERLAP
    http_status: 409
    applies_to: ["POST /birth-center/on-call-assignments"]

  - priority: 12
    category: business_temporal
    check: "Booking interval must not overlap an existing non-terminal booking on the same room, including the room's turnover buffer applied AFTER each booking. HALF-OPEN semantics [starts_at, ends_at): exactly abutting bookings (next.starts_at == prev.ends_at) DO NOT collide when turnover_minutes == 0; with turnover_minutes > 0 the next booking must start at or after prev.ends_at + turnover_minutes."
    error_id: ERR_ROOM_DOUBLE_BOOKED
    http_status: 409
    applies_to: ["POST /birth-center/bookings"]

  - priority: 13
    category: business_temporal
    check: "Booking starts_at must be strictly before ends_at (zero-length and inverted intervals rejected)"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: ["POST /birth-center/bookings"]

  - priority: 14
    category: business_fiscal
    check: "InsuranceClaim adjudication amounts ordered: paid_amount_cents <= allowed_amount_cents <= billed_amount_cents"
    error_id: ERR_CLAIM_AMOUNTS_INVALID
    http_status: 422
    applies_to: ["POST /birth-center/insurance-claims/{id}/adjudicate"]

  - priority: 15
    category: business_fiscal
    check: "SupplyKit reserve must not drive available (on_hand - reserved) below 0"
    error_id: ERR_KIT_OUT_OF_STOCK
    http_status: 409
    applies_to: ["POST /birth-center/episodes"]

  - priority: 16
    category: business_fiscal
    check: "A payment must not exceed PaymentPlan.remaining_cents (overpayment forbidden)"
    error_id: ERR_OVERPAYMENT
    http_status: 409
    applies_to: ["POST /birth-center/payment-plans/{id}/payments"]

  - priority: 17
    category: business_fiscal
    check: "PaymentPlan can be created only when Episode.balance_due_cents > 0"
    error_id: ERR_NO_BALANCE
    http_status: 409
    applies_to: ["POST /birth-center/payment-plans"]

  - priority: 18
    category: state
    check: "record-birth requires an IN_USE booking on the episode"
    error_id: ERR_NO_ACTIVE_BOOKING
    http_status: 409
    applies_to: ["POST /birth-center/episodes/{id}/record-birth"]

  - priority: 19
    category: business_constraint
    check: "complete-care requires prenatal_visits_completed >= package.postpartum_visits_included"
    error_id: ERR_POSTPARTUM_INCOMPLETE
    http_status: 409
    applies_to: ["POST /birth-center/episodes/{id}/complete-care"]

  - priority: 20
    category: business_referential
    check: "Claim void blocked while a PaymentPlan exists on the episode"
    error_id: ERR_CLAIM_HAS_PLAN
    http_status: 409
    applies_to: ["POST /birth-center/insurance-claims/{id}/void"]

  - priority: 21
    category: state
    check: "Optimistic concurrency: expected_<parent>_version must equal current parent version on guarded creates"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /birth-center/payment-plans", "POST /birth-center/bookings"]

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ----- Logical clock (test-driving) -----
  - method: POST
    path: "/birth-center/_clock/set_current_utc"
    description: "Set the server logical clock. Server startup default is 2026-01-01T00:00:00Z; before any set, the clock reads exactly this default and never falls back to wall-clock."
    roles: [CenterAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ now: datetime }"
    side_effects: ["logical clock advanced to to_iso8601"]

  # ----- Client -----
  - method: POST
    path: "/birth-center/clients"
    description: "Register a client (intake)"
    roles: [IntakeCoordinator]
    code: 201
    input: [full_name, date_of_birth, parity, "insurance_payer?", "policy_number?"]
    output: Client
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/birth-center/clients/{id}"
    description: "Get a client"
    roles: [IntakeCoordinator, Midwife, BillingClerk, CenterAdmin]
    code: 200
    input: []
    output: Client
    side_effects: []

  - method: GET
    path: "/birth-center/clients"
    description: "List clients (paginated)"
    roles: [IntakeCoordinator, Midwife, BillingClerk, CenterAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Client[]
    side_effects: []

  - method: POST
    path: "/birth-center/clients/{id}/archive"
    description: "Archive a client (soft)"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: Client
    side_effects: ["status=ARCHIVED"]

  # ----- CarePackage (config) -----
  - method: POST
    path: "/birth-center/care-packages"
    description: "Create an immutable care package (price list entry)"
    roles: [CenterAdmin]
    code: 201
    input: [code, package_type, global_fee_cents, prenatal_visits_included, postpartum_visits_included, kit_sku]
    output: CarePackage
    side_effects: []

  - method: GET
    path: "/birth-center/care-packages/{id}"
    description: "Get a care package by code (id == code)"
    roles: [IntakeCoordinator, Midwife, BillingClerk, CenterAdmin]
    code: 200
    input: []
    output: CarePackage
    side_effects: []

  - method: GET
    path: "/birth-center/care-packages"
    description: "List care packages; filterable by kit_sku for reverse-reachability"
    roles: [IntakeCoordinator, Midwife, BillingClerk, CenterAdmin]
    code: 200
    input: ["kit_sku?", "package_type?", "limit?", "offset?"]
    output: CarePackage[]
    side_effects: []

  # ----- SupplyKit -----
  - method: POST
    path: "/birth-center/supply-kits"
    description: "Create a supply kit inventory record"
    roles: [CenterAdmin]
    code: 201
    input: [sku, name, on_hand_count]
    output: SupplyKit
    side_effects: ["reserved_count=0, consumed_count=0"]

  - method: GET
    path: "/birth-center/supply-kits/{id}"
    description: "Get a supply kit by sku (id == sku)"
    roles: [IntakeCoordinator, Midwife, BillingClerk, CenterAdmin]
    code: 200
    input: []
    output: SupplyKit
    side_effects: []

  - method: GET
    path: "/birth-center/supply-kits"
    description: "List supply kits"
    roles: [IntakeCoordinator, Midwife, BillingClerk, CenterAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: SupplyKit[]
    side_effects: []

  # ----- Provider -----
  - method: POST
    path: "/birth-center/providers"
    description: "Create a provider (midwife/doula)"
    roles: [CenterAdmin]
    code: 201
    input: [full_name, role_type, license_number, max_active_episodes]
    output: Provider
    side_effects: ["status=AVAILABLE, active_assignment_count=0"]

  - method: GET
    path: "/birth-center/providers/{id}"
    description: "Get a provider"
    roles: [IntakeCoordinator, Midwife, BillingClerk, CenterAdmin]
    code: 200
    input: []
    output: Provider
    side_effects: []

  - method: GET
    path: "/birth-center/providers"
    description: "List providers"
    roles: [IntakeCoordinator, Midwife, BillingClerk, CenterAdmin]
    code: 200
    input: ["role_type?", "status?", "limit?", "offset?"]
    output: Provider[]
    side_effects: []

  # ----- Room -----
  - method: POST
    path: "/birth-center/rooms"
    description: "Create a birth-center room"
    roles: [CenterAdmin]
    code: 201
    input: [name, "turnover_minutes?"]
    output: Room
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/birth-center/rooms/{id}"
    description: "Get a room"
    roles: [IntakeCoordinator, Midwife, BillingClerk, CenterAdmin]
    code: 200
    input: []
    output: Room
    side_effects: []

  - method: GET
    path: "/birth-center/rooms"
    description: "List rooms"
    roles: [IntakeCoordinator, Midwife, BillingClerk, CenterAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Room[]
    side_effects: []

  - method: POST
    path: "/birth-center/rooms/{id}/close"
    description: "Close a room to new bookings"
    roles: [CenterAdmin]
    code: 200
    input: []
    output: Room
    side_effects: ["status=CLOSED"]

  # ----- Episode -----
  - method: POST
    path: "/birth-center/episodes"
    description: "Open an episode of care; reserves a SupplyKit unit from the package's kit_sku"
    roles: [IntakeCoordinator]
    code: 201
    input: [client_id, package_code, edd]
    output: Episode
    side_effects:
      - "clinical_status=PLANNING, financial_status=UNBILLED, risk_tier=LOW"
      - "snapshot global_fee_cents from CarePackage.global_fee_cents"
      - "reserve one unit of CarePackage.kit_sku SupplyKit (reserved_count++, kit_issued=true); rejected ERR_KIT_OUT_OF_STOCK if none available"
      - "create a GLOBAL_FEE Charge in DRAFT with amount_cents=global_fee_cents; client_responsibility = ESTIMATE variant (20%)"

  - method: GET
    path: "/birth-center/episodes/{id}"
    description: "Get an episode (both status axes, risk_tier, balance_due_cents)"
    roles: [IntakeCoordinator, Midwife, BillingClerk, CenterAdmin]
    code: 200
    input: []
    output: Episode
    side_effects: []

  - method: GET
    path: "/birth-center/episodes"
    description: "List episodes; filter by client_id (reverse-reachability for Client FK)"
    roles: [IntakeCoordinator, Midwife, BillingClerk, CenterAdmin]
    code: 200
    input: ["client_id?", "package_code?", "clinical_status?", "financial_status?", "limit?", "offset?"]
    output: Episode[]
    side_effects: []

  - method: POST
    path: "/birth-center/episodes/{id}/activate"
    description: "Begin active care (clinical axis PLANNING->ACTIVE)"
    roles: [Midwife]
    code: 200
    input: []
    output: Episode
    side_effects: ["clinical_status=ACTIVE; gated on risk_tier != TRANSFER_REQUIRED and kit_issued"]

  - method: POST
    path: "/birth-center/episodes/{id}/transfer"
    description: "Hospital transfer (clinical axis -> TRANSFERRED) with cascades"
    roles: [Midwife]
    code: 200
    input: []
    output: Episode
    side_effects:
      - "clinical_status=TRANSFERRED"
      - "cascade booking -> TRANSFERRED (room released, TRANSFER_FEE charge created)"
      - "cascade primary OnCallAssignment -> STOOD_DOWN -> promotes backup"
      - "kit reserved->consumed"

  - method: POST
    path: "/birth-center/episodes/{id}/record-birth"
    description: "Record birth at center (clinical axis ACTIVE->BORN)"
    roles: [Midwife]
    code: 200
    input: []
    output: Episode
    side_effects:
      - "clinical_status=BORN; requires an IN_USE booking and risk_tier != TRANSFER_REQUIRED"
      - "cascade IN_USE booking -> COMPLETED (room released)"
      - "kit reserved->consumed"

  - method: POST
    path: "/birth-center/episodes/{id}/complete-care"
    description: "Complete the episode (clinical axis BORN->COMPLETED)"
    roles: [Midwife]
    code: 200
    input: []
    output: Episode
    side_effects: ["clinical_status=COMPLETED; requires postpartum visits fulfilled"]

  - method: POST
    path: "/birth-center/episodes/{id}/write-off"
    description: "Write off the episode's balance (financial axis -> WRITTEN_OFF)"
    roles: [BillingClerk]
    code: 200
    input: []
    output: Episode
    side_effects: ["financial_status=WRITTEN_OFF; OPEN plan CANCELLED; DRAFT/BILLED charges VOID"]

  - method: GET
    path: "/birth-center/episodes/{id}/prenatal-visits"
    description: "List visits on an episode (reverse-reachability for PrenatalVisit.episode_id)"
    roles: [IntakeCoordinator, Midwife, BillingClerk, CenterAdmin]
    code: 200
    input: ["visit_kind?", "status?"]
    output: PrenatalVisit[]
    side_effects: []

  - method: GET
    path: "/birth-center/episodes/{id}/charges"
    description: "List charges on an episode (reverse-reachability for Charge.episode_id)"
    roles: [IntakeCoordinator, Midwife, BillingClerk, CenterAdmin]
    code: 200
    input: ["charge_kind?", "status?"]
    output: Charge[]
    side_effects: []

  - method: GET
    path: "/birth-center/episodes/{id}/on-call-assignments"
    description: "List on-call assignments on an episode (reverse-reachability for OnCallAssignment.episode_id)"
    roles: [IntakeCoordinator, Midwife, BillingClerk, CenterAdmin]
    code: 200
    input: ["coverage_role?", "status?"]
    output: OnCallAssignment[]
    side_effects: []

  - method: GET
    path: "/birth-center/episodes/{id}/bookings"
    description: "List bookings on an episode (reverse-reachability for Booking.episode_id)"
    roles: [IntakeCoordinator, Midwife, BillingClerk, CenterAdmin]
    code: 200
    input: ["status?"]
    output: Booking[]
    side_effects: []

  - method: GET
    path: "/birth-center/episodes/{id}/insurance-claims"
    description: "List claims on an episode (reverse-reachability for InsuranceClaim.episode_id)"
    roles: [IntakeCoordinator, Midwife, BillingClerk, CenterAdmin]
    code: 200
    input: ["status?"]
    output: InsuranceClaim[]
    side_effects: []

  - method: GET
    path: "/birth-center/episodes/{id}/payment-plans"
    description: "List payment plans on an episode (reverse-reachability for PaymentPlan.episode_id)"
    roles: [IntakeCoordinator, Midwife, BillingClerk, CenterAdmin]
    code: 200
    input: ["status?"]
    output: PaymentPlan[]
    side_effects: []

  # ----- PrenatalVisit -----
  - method: POST
    path: "/birth-center/prenatal-visits"
    description: "Schedule a prenatal/postpartum/lactation visit"
    roles: [IntakeCoordinator, Midwife]
    code: 201
    input: [episode_id, visit_kind, scheduled_at]
    output: PrenatalVisit
    side_effects: ["status=SCHEDULED"]

  - method: GET
    path: "/birth-center/prenatal-visits/{id}"
    description: "Get a prenatal visit"
    roles: [IntakeCoordinator, Midwife, BillingClerk, CenterAdmin]
    code: 200
    input: []
    output: PrenatalVisit
    side_effects: []

  - method: POST
    path: "/birth-center/prenatal-visits/{id}/complete"
    description: "Complete a visit, record screening; re-derives Episode.risk_tier"
    roles: [Midwife]
    code: 200
    input: [risk_flag, "blood_pressure_systolic?"]
    output: PrenatalVisit
    side_effects: ["status=COMPLETED; re-derive Episode.risk_tier; episode prenatal_visits_completed++"]

  - method: POST
    path: "/birth-center/prenatal-visits/{id}/mark-no-show"
    description: "Mark a past-due visit as no-show"
    roles: [Midwife]
    code: 200
    input: []
    output: PrenatalVisit
    side_effects: ["status=NO_SHOW; requires clock >= scheduled_at"]

  - method: POST
    path: "/birth-center/prenatal-visits/{id}/cancel"
    description: "Cancel a scheduled visit"
    roles: [IntakeCoordinator, Midwife]
    code: 200
    input: []
    output: PrenatalVisit
    side_effects: ["status=CANCELLED"]

  # ----- OnCallAssignment -----
  - method: POST
    path: "/birth-center/on-call-assignments"
    description: "Assign a primary on-call provider to an episode over a coverage window"
    roles: [CenterAdmin]
    code: 201
    input: [episode_id, provider_id, coverage_start, coverage_end]
    output: OnCallAssignment
    side_effects:
      - "coverage_role=PRIMARY, status=ASSIGNED"
      - "gated on provider PRIMARY-LOAD < max_active_episodes (else ERR_PROVIDER_AT_CAPACITY)"
      - "gated on no overlapping PRIMARY coverage window for the provider, CLOSED-interval [coverage_start, coverage_end] (else ERR_PROVIDER_WINDOW_OVERLAP)"
      - "increments provider active_assignment_count"

  - method: GET
    path: "/birth-center/on-call-assignments/{id}"
    description: "Get an on-call assignment"
    roles: [IntakeCoordinator, Midwife, BillingClerk, CenterAdmin]
    code: 200
    input: []
    output: OnCallAssignment
    side_effects: []

  - method: GET
    path: "/birth-center/on-call-assignments"
    description: "List on-call assignments; filter by provider_id, backup_assignment_id, or episode_id (reverse-reachability for OnCallAssignment.provider_id and self-referential backup_assignment_id)"
    roles: [IntakeCoordinator, Midwife, BillingClerk, CenterAdmin]
    code: 200
    input: ["provider_id?", "backup_assignment_id?", "episode_id?", "coverage_role?", "status?", "limit?", "offset?"]
    output: OnCallAssignment[]
    side_effects: []

  - method: POST
    path: "/birth-center/on-call-assignments/{id}/name-backup"
    description: "Create a BACKUP assignment for a primary and link it (backup_assignment_id)"
    roles: [CenterAdmin]
    code: 201
    input: [provider_id, coverage_start, coverage_end]
    output: OnCallAssignment
    side_effects:
      - "creates a new OnCallAssignment with coverage_role=BACKUP, status=ASSIGNED, same episode_id, given coverage window"
      - "sets the primary's backup_assignment_id to the new backup's id"
      - "backup provider must differ from primary's provider (else ERR_BACKUP_SAME_PROVIDER)"
      - "BACKUP rows do not consume primary capacity and are NOT subject to the PROVIDER_WINDOW_OVERLAP check"

  - method: POST
    path: "/birth-center/on-call-assignments/{id}/go-on-duty"
    description: "Primary goes on duty (ASSIGNED->ON_DUTY)"
    roles: [CenterAdmin]
    code: 200
    input: []
    output: OnCallAssignment
    side_effects: ["status=ON_DUTY; requires episode clinical_status==ACTIVE"]

  - method: POST
    path: "/birth-center/on-call-assignments/{id}/release"
    description: "Release primary coverage (ASSIGNED/ON_DUTY -> RELEASED)"
    roles: [CenterAdmin]
    code: 200
    input: []
    output: OnCallAssignment
    side_effects: ["status=RELEASED; decrements provider active_assignment_count; requires episode in {BORN, COMPLETED, TRANSFERRED}"]

  # ----- Booking -----
  - method: POST
    path: "/birth-center/bookings"
    description: "Hold a room booking for an episode over an interval (OCC on Room.version)"
    roles: [CenterAdmin]
    code: 201
    input: [episode_id, room_id, starts_at, ends_at, expected_room_version]
    output: Booking
    side_effects:
      - "status=HELD"
      - "increments Room.version by 1"
      - "rejected ERR_ROOM_DOUBLE_BOOKED on overlap (incl. turnover buffer), ERR_INVALID_INTERVAL if starts_at >= ends_at, ERR_STALE_VERSION on stale expected_room_version"

  - method: GET
    path: "/birth-center/bookings/{id}"
    description: "Get a booking"
    roles: [IntakeCoordinator, Midwife, BillingClerk, CenterAdmin]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: GET
    path: "/birth-center/bookings"
    description: "List bookings; filter by room_id (reverse-reachability for Booking.room_id)"
    roles: [IntakeCoordinator, Midwife, BillingClerk, CenterAdmin]
    code: 200
    input: ["room_id?", "episode_id?", "status?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []

  - method: POST
    path: "/birth-center/bookings/{id}/confirm"
    description: "Confirm a held booking (HELD->CONFIRMED)"
    roles: [CenterAdmin]
    code: 200
    input: []
    output: Booking
    side_effects: ["status=CONFIRMED; requires Room.status==OPEN"]

  - method: POST
    path: "/birth-center/bookings/{id}/check-in"
    description: "Check in to a room (CONFIRMED->IN_USE)"
    roles: [CenterAdmin]
    code: 200
    input: []
    output: Booking
    side_effects: ["status=IN_USE; requires episode clinical_status==ACTIVE and clock >= starts_at"]

  - method: POST
    path: "/birth-center/bookings/{id}/cancel"
    description: "Cancel a held/confirmed booking (-> CANCELLED)"
    roles: [CenterAdmin]
    code: 200
    input: []
    output: Booking
    side_effects: ["status=CANCELLED; room interval released; increments Room.version by 1"]

  # ----- Charge -----
  - method: POST
    path: "/birth-center/charges"
    description: "Add an out-of-bundle charge (EXTRA_VISIT/SUPPLY) to an episode"
    roles: [BillingClerk]
    code: 201
    input: [episode_id, charge_kind, amount_cents]
    output: Charge
    side_effects:
      - "status=DRAFT; client_responsibility_cents=amount_cents (extras always full responsibility)"
      - "re-derive Episode.balance_due_cents and increment Episode.version by 1"

  - method: GET
    path: "/birth-center/charges/{id}"
    description: "Get a charge"
    roles: [IntakeCoordinator, Midwife, BillingClerk, CenterAdmin]
    code: 200
    input: []
    output: Charge
    side_effects: []

  - method: GET
    path: "/birth-center/charges"
    description: "List charges; filter by episode_id or claim_id (reverse-reachability for Charge.claim_id)"
    roles: [IntakeCoordinator, Midwife, BillingClerk, CenterAdmin]
    code: 200
    input: ["episode_id?", "claim_id?", "charge_kind?", "status?", "limit?", "offset?"]
    output: Charge[]
    side_effects: []

  - method: POST
    path: "/birth-center/charges/{id}/bill"
    description: "Mark a DRAFT charge as BILLED"
    roles: [BillingClerk]
    code: 200
    input: []
    output: Charge
    side_effects: ["status=BILLED"]

  # ----- InsuranceClaim -----
  - method: POST
    path: "/birth-center/insurance-claims"
    description: "Submit a global-fee insurance claim for an episode; links the GLOBAL_FEE charge"
    roles: [BillingClerk]
    code: 201
    input: [episode_id]
    output: InsuranceClaim
    side_effects:
      - "status=SUBMITTED; billed_amount_cents snapshot from Episode.global_fee_cents"
      - "the episode's GLOBAL_FEE Charge.claim_id set to this claim"

  - method: GET
    path: "/birth-center/insurance-claims/{id}"
    description: "Get an insurance claim"
    roles: [IntakeCoordinator, Midwife, BillingClerk, CenterAdmin]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: []

  - method: GET
    path: "/birth-center/insurance-claims"
    description: "List claims; filter by episode_id"
    roles: [IntakeCoordinator, Midwife, BillingClerk, CenterAdmin]
    code: 200
    input: ["episode_id?", "status?", "limit?", "offset?"]
    output: InsuranceClaim[]
    side_effects: []

  - method: POST
    path: "/birth-center/insurance-claims/{id}/adjudicate"
    description: "Adjudicate a claim (SUBMITTED->ADJUDICATED); recompute client responsibility"
    roles: [BillingClerk]
    code: 200
    input: [allowed_amount_cents, paid_amount_cents]
    output: InsuranceClaim
    side_effects: ["status=ADJUDICATED; GLOBAL_FEE charge responsibility = allowed-paid; re-derive balance_due_cents"]

  - method: POST
    path: "/birth-center/insurance-claims/{id}/deny"
    description: "Deny a claim (SUBMITTED->DENIED); client owes full global fee"
    roles: [BillingClerk]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: ["status=DENIED; GLOBAL_FEE charge responsibility = full amount; re-derive balance_due_cents"]

  - method: POST
    path: "/birth-center/insurance-claims/{id}/void"
    description: "Void a claim (SUBMITTED/DENIED->VOID); responsibility reverts to estimate"
    roles: [BillingClerk]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: ["status=VOID; GLOBAL_FEE charge responsibility reverts to 20% estimate; re-derive balance_due_cents; requires no PaymentPlan exists"]

  # ----- PaymentPlan -----
  - method: POST
    path: "/birth-center/payment-plans"
    description: "Create an installment plan for the episode balance (OCC on Episode.version)"
    roles: [BillingClerk]
    code: 201
    input: [episode_id, installment_count, expected_episode_version]
    output: PaymentPlan
    side_effects:
      - "status=OPEN; total_cents snapshot from Episode.balance_due_cents; pinned installment schedule"
      - "Episode.financial_status UNBILLED->PLAN_ACTIVE"
      - "increments Episode.version by 1"
      - "rejected ERR_NO_BALANCE if balance_due_cents == 0, ERR_STALE_VERSION on stale expected_episode_version"

  - method: GET
    path: "/birth-center/payment-plans/{id}"
    description: "Get a payment plan"
    roles: [IntakeCoordinator, Midwife, BillingClerk, CenterAdmin]
    code: 200
    input: []
    output: PaymentPlan
    side_effects: []

  - method: POST
    path: "/birth-center/payment-plans/{id}/payments"
    description: "Apply a payment with waterfall allocation across installments"
    roles: [BillingClerk]
    code: 200
    input: [amount_cents]
    output: PaymentPlan
    side_effects:
      - "waterfall-allocate amount across installments; paid_cents += amount; remaining_cents recomputed"
      - "if remaining_cents == 0: status=PAID_OFF; cascade episode financial PLAN_ACTIVE->SETTLED; BILLED charges->PAID"
      - "rejected ERR_OVERPAYMENT if amount > remaining_cents"

  - method: POST
    path: "/birth-center/payment-plans/{id}/default"
    description: "Mark a plan as defaulted (OPEN->DEFAULTED)"
    roles: [BillingClerk]
    code: 200
    input: []
    output: PaymentPlan
    side_effects: ["status=DEFAULTED; requires remaining_cents > 0"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation per §1.7" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource (path or FK target) does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, invalid enum, constraint violation (negative parity/amount, installment_count<1)" }
  - { id: ERR_DUPLICATE_RESOURCE, http: 409, condition: "CarePackage.code or SupplyKit.sku already exists" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_RISK_TRANSFER_REQUIRED, http: 409, condition: "Clinical action blocked because Episode.risk_tier == TRANSFER_REQUIRED (activate, record-birth)" }
  - { id: ERR_BACKUP_SAME_PROVIDER, http: 409, condition: "Backup assignment provider equals the primary's provider" }
  - { id: ERR_PROVIDER_AT_CAPACITY, http: 409, condition: "Provider PRIMARY-LOAD already at max_active_episodes" }
  - { id: ERR_PROVIDER_WINDOW_OVERLAP, http: 409, condition: "New PRIMARY coverage window [coverage_start, coverage_end] overlaps (closed-interval, touching endpoints collide) an existing PRIMARY window of the same provider" }
  - { id: ERR_ROOM_DOUBLE_BOOKED, http: 409, condition: "Booking interval (half-open, with turnover buffer) overlaps an existing non-terminal booking on the room" }
  - { id: ERR_INVALID_INTERVAL, http: 422, condition: "Booking starts_at >= ends_at" }
  - { id: ERR_CLAIM_AMOUNTS_INVALID, http: 422, condition: "Claim adjudication breaks paid <= allowed <= billed ordering" }
  - { id: ERR_KIT_OUT_OF_STOCK, http: 409, condition: "Reserving a kit would drive available (on_hand - reserved) below 0" }
  - { id: ERR_OVERPAYMENT, http: 409, condition: "Payment exceeds PaymentPlan.remaining_cents" }
  - { id: ERR_NO_BALANCE, http: 409, condition: "PaymentPlan create attempted when Episode.balance_due_cents == 0" }
  - { id: ERR_POSTPARTUM_INCOMPLETE, http: 409, condition: "complete-care attempted before postpartum_visits_included visits are COMPLETED" }
  - { id: ERR_NO_ACTIVE_BOOKING, http: 409, condition: "record-birth attempted with no IN_USE booking on the episode" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the current parent version (OCC)" }
  - { id: ERR_CLAIM_HAS_PLAN, http: 409, condition: "void a claim while a PaymentPlan exists on the episode" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: IntakeCoordinator
    description: "Owns client intake, episode opening, and visit scheduling."
    identity: "opaque"
    exclusive_operations:
      - "POST /birth-center/clients — register client"
      - "POST /birth-center/clients/{id}/archive — archive client"
      - "POST /birth-center/episodes — open episode (reserve kit)"
    shared_operations:
      - "POST /birth-center/prenatal-visits — schedule visit (with Midwife)"
      - "POST /birth-center/prenatal-visits/{id}/cancel — cancel visit (with Midwife)"
      - "GET endpoints (read access)"

  - name: Midwife
    description: "Owns clinical lifecycle: activation, screening completion, birth, transfer, completion."
    identity: "opaque"
    exclusive_operations:
      - "POST /birth-center/episodes/{id}/activate"
      - "POST /birth-center/episodes/{id}/transfer"
      - "POST /birth-center/episodes/{id}/record-birth"
      - "POST /birth-center/episodes/{id}/complete-care"
      - "POST /birth-center/prenatal-visits/{id}/complete"
      - "POST /birth-center/prenatal-visits/{id}/mark-no-show"
    shared_operations:
      - "POST /birth-center/prenatal-visits — schedule visit (with IntakeCoordinator)"
      - "POST /birth-center/prenatal-visits/{id}/cancel — cancel visit (with IntakeCoordinator)"
      - "GET endpoints (read access)"

  - name: BillingClerk
    description: "Owns financial lifecycle: charges, claims, payment plans, write-offs."
    identity: "opaque"
    exclusive_operations:
      - "POST /birth-center/charges"
      - "POST /birth-center/charges/{id}/bill"
      - "POST /birth-center/insurance-claims (and adjudicate/deny/void)"
      - "POST /birth-center/payment-plans (and payments/default)"
      - "POST /birth-center/episodes/{id}/write-off"
    shared_operations:
      - "GET endpoints (read access)"

  - name: CenterAdmin
    description: "Operational superset for rooms, providers, supply kits, care packages, on-call roster, bookings, and the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /birth-center/care-packages"
      - "POST /birth-center/supply-kits"
      - "POST /birth-center/providers"
      - "POST /birth-center/rooms (and /close)"
      - "POST /birth-center/on-call-assignments (and name-backup/go-on-duty/release)"
      - "POST /birth-center/bookings (and confirm/check-in/cancel)"
      - "POST /birth-center/_clock/set_current_utc"
    shared_operations:
      - "GET endpoints (read access)"
