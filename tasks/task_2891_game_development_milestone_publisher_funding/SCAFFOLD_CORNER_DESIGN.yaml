          - roles.PublisherFinance.segregation_of_duties
          - state_machines.MilestonePayment.PENDING_AUTHORIZATION_to_AUTHORIZED
        distinguishing_aspect: "The check spans two entities: the payment's own Milestone must be traced back to the ACCEPTED PublisherReview's reviewer_user_id. A function == DUAL operator passes the role/function check (priority 5) yet must still be refused with 403 ERR_SEGREGATION_OF_DUTIES, while a different FINANCE operator authorizes the very same payment successfully."
        test_recipe:
          setup:
            - "Agreement Aurora Solo (advance 3600000, single ALPHA milestone funded 3600000, contractor budget 0) is ACTIVE."
            - "PublisherUser Dana is created with function DUAL; PublisherUser Fen has function FINANCE."
            - "Dana records the ACCEPTED review on build 1 (75.00 / 96.00 / 60.00 / 5), which creates one PENDING_AUTHORIZATION payment of 3600000."
