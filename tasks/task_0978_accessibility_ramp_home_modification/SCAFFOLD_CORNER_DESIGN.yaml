        distinguishing_aspect: "Known inputs mobility 60, hazard_count 4 yield risk = 4*0.5 + (100-60)*0.05 = 4.0 exactly; the case's recomputed safety_risk_index must equal 4.0."
        test_recipe:
          setup: ["Clock at 2026-05-01T00:00:00Z; case with assessment IN_PROGRESS"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cases"
              payload: { client_name: "Hal Kern", client_address: "34 Risk Rd", client_phone: "555-0301" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/assessments"
              payload: { assessor_id: "ot-20", assessor_role: "OT", assessment_type: "INITIAL", scheduled_date: "2026-05-01T00:00:00Z", mobility_score: 60, hazard_count: 4 }
              as: IntakeCoordinator
