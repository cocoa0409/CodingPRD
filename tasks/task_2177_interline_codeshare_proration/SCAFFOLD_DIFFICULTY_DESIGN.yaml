              payload: { run_type: "FINAL", expected_ticket_version: "${tv}" }
              as: RevenueAccountant
              as_user_id: "${aa}"
            - call: "GET /interline/tickets/${t1}"
              payload: {}
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { tv2: $.data.version }
          trigger:
            - call: "POST /interline/tickets/${t1}/void-proration"
              payload: { expected_ticket_version: "${tv2}" }
              as: RevenueAccountant
              as_user_id: "${aa}"
          assert:
            - "Before the trigger: 66601 + 12000 + 21399 + Ticket.${t1}.unallocated_residual_minor(0) == 100000"
            - "After the trigger: Coupon.${c1}.allocated_amount_minor == 0, Coupon.${c2}.allocated_amount_minor == 0, Coupon.${c3}.allocated_amount_minor == 0"
            - "After the trigger: Ticket.${t1}.unallocated_residual_minor == 100000, so 0 + 0 + 0 + 100000 == Ticket.${t1}.total_fare_minor"
            - "All three coupons read allocation_basis == UNALLOCATED and keep coupon_status == FLOWN"
            - "Ticket.${t1}.proration_status == UNPRORATED and last_run_type == NONE"

      - name: invoice_recall_conserves_the_clearinghouse_zero_sum
        grounds:
          - state_machines.BillingInvoice.DRAFT_to_SUBMITTED
          - state_machines.BillingInvoice.SUBMITTED_to_DRAFT
          - calculations.carrier_net_position
          - entities.Carrier.fields.pending_receivable_minor
          - entities.Carrier.fields.pending_payable_minor
        distinguishing_aspect: |
          A different conserved quantity from the fare identity — the clearinghouse zero sum
          sum over all Carrier rows of net_position_minor == 0. Submitting posts +99250 to
          BB and -99250 to AA; the compensating recall reverses exactly those two figures back
          to 0/0, and the sum is 0 at all three observation points.
        test_recipe:
          setup:
            - "Carriers AA, BB, CC ACTIVE with credit_limit_minor 100000000 and all four balance fields at 0."
            - "Period 2026-08-P1 OPEN in USD; a USD 100000 single-coupon ticket validated by AA, operated by BB, flown and FINAL-prorated."
            - "A DRAFT invoice BB->AA holding that coupon."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ClearinghouseOperator
            - call: "POST /interline/carriers"
              payload: { iata_code: "AA", name: "Aurora Air", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { aa: $.data.id }
            - call: "POST /interline/carriers"
              payload: { iata_code: "BB", name: "Borealis Airways", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { bb: $.data.id }
            - call: "POST /interline/carriers"
              payload: { iata_code: "CC", name: "Cirrus Continental", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { cc: $.data.id }
            - call: "POST /interline/settlement-periods"
              payload: { period_code: "2026-08-P1", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", submission_deadline: "2026-09-05T00:00:00Z", rate_fixing_date: "2026-09-06T00:00:00Z", settlement_currency: "USD" }
              as: ClearinghouseOperator
              captures: { p1: $.data.id }
            - call: "POST /interline/tickets"
              payload: { ticket_number: "0029000000001", validating_carrier_id: "${aa}", sale_currency: "USD", total_fare_minor: 100000, issue_date: "2026-08-10T00:00:00Z" }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { t1: $.data.id }
            - call: "POST /interline/tickets/${t1}/coupons"
              payload: { coupon_number: 1, origin: "JFK", destination: "LHR", operating_carrier_id: "${bb}", class_of_service: "ECONOMY", tpm_miles: 1000 }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { c1: $.data.id }
            - call: "POST /interline/coupons/${c1}/fly"
              payload: {}
              as: RevenueAccountant
              as_user_id: "${aa}"
            - call: "GET /interline/tickets/${t1}"
              payload: {}
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { tv: $.data.version }
            - call: "POST /interline/tickets/${t1}/prorate"
              payload: { run_type: "FINAL", expected_ticket_version: "${tv}" }
              as: RevenueAccountant
              as_user_id: "${aa}"
            - call: "POST /interline/billing-invoices"
              payload: { settlement_period_id: "${p1}", billing_carrier_id: "${bb}", billed_carrier_id: "${aa}", billing_currency: "USD", coupon_ids: ["${c1}"] }
              as: RevenueAccountant
              as_user_id: "${bb}"
              captures: { inv: $.data.id }
            - call: "POST /interline/billing-invoices/${inv}/submit"
              payload: {}
              as: BillingAgent
              as_user_id: "${bb}"
          trigger:
            - call: "POST /interline/billing-invoices/${inv}/recall"
              payload: {}
              as: BillingAgent
              as_user_id: "${bb}"
          assert:
            - "After the submit: Carrier.${bb}.pending_receivable_minor == 99250, Carrier.${aa}.pending_payable_minor == 99250, and net_position_minor sums to 0 across AA(-99250) + BB(99250) + CC(0)"
            - "After the recall: Carrier.${bb}.pending_receivable_minor == 0 and Carrier.${aa}.pending_payable_minor == 0"
            - "After the recall: Carrier.${aa}.net_position_minor == 0, Carrier.${bb}.net_position_minor == 0, Carrier.${cc}.net_position_minor == 0, sum == 0"
            - "BillingInvoice.${inv}.status == DRAFT, gross_billed_minor == 0, total_claim_minor == 0, provisional_settlement_minor == 0, submitted_at is null, coupon_count == 0"
            - "Coupon.${c1}.billing_invoice_id is null and Coupon.${c1}.allocated_amount_minor == 100000 — the recall touches billing state only"
            - "Ticket.${t1}.billing_status == UNBILLED and Ticket.${t1}.proration_status == FINAL"
