              as: IdentityAnalyst
              captures: { rec_v9a_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_v9_id}", mrn: "V9-2000", last_name: "Delgado", first_name: "Rosalia", dob: "1965-03-03", sex: "F", ssn_last4: "4141", postal_code: "33101", phone: "3055550101", clinical_element_count: 2 }
              as: IdentityAnalyst
              captures: { rec_v9b_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_v9_id}", mrn: "V9-3000", last_name: "Delgado", first_name: "Rosalia", dob: "1965-03-03", sex: "F", ssn_last4: "4141", postal_code: "33101", phone: "3055550101", clinical_element_count: 1 }
              as: IdentityAnalyst
              captures: { rec_v9c_id: $.data.id }
            - call: "POST /mpi/candidate-pairs"
              payload: { record_a_id: "${rec_v9a_id}", record_b_id: "${rec_v9b_id}", rule_set_id: "${rs_base_id}", score_variant: "STRICT" }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
              captures: { pair_v9ab_id: $.data.id }
            - call: "POST /mpi/merge-operations"
              payload: { pair_id: "${pair_v9ab_id}", survivor_record_id: "${rec_v9a_id}", subsumed_record_id: "${rec_v9b_id}", rationale: "First merge." }
              as: IdentityStewardApprover
              as_user_id: "steward-1"
            - call: "POST /mpi/candidate-pairs"
              payload: { record_a_id: "${rec_v9b_id}", record_b_id: "${rec_v9c_id}", rule_set_id: "${rs_base_id}", score_variant: "STRICT" }
