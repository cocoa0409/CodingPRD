          Parallel state dimensions on a different entity from the cyclic RelocationRequest: the same
          MembershipAgreement row carries agreement_status and dues_status that move on disjoint triggers.
          Freezing while dues_status is CURRENT does not stop the ledger, which walks CURRENT -> PAST_DUE
