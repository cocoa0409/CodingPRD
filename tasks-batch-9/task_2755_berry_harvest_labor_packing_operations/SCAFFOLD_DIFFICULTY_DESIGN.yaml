  - rule_id: resource_temporal_overlap
    instances:

      - name: block_reentry_buffer_rejects_adjacent_harvest_window
        grounds:
          - calculations.block_window_separation
          - validations[priority=57]
          - errors[ERR_BLOCK_REENTRY_CONFLICT]
        distinguishing_aspect: |
          The block re-entry rule treats intervals as CLOSED plus a 12-hour
          buffer, so a window starting exactly at a live window's end_at
          (2026-08-03T14:00:00Z) is REJECTED with ERR_BLOCK_REENTRY_CONFLICT
          while one starting exactly 12 hours later (2026-08-04T02:00:00Z) is
          ACCEPTED — adjacency is a conflict here, the opposite of the tunnel
          occupancy rule.
        test_recipe:
          setup:
            - "One STRAWBERRY block and one crew."
            - "One live PLANNED harvest window 2026-08-03T06:00:00Z -> 2026-08-03T14:00:00Z on that block."
          setup_api_calls:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-RT1", variety: "STRAWBERRY", acres: 14.00, planting_year: 2020, irrigation_source_code: "WELL-15" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { blk: $.data.id }
            - call: "POST /berry-ops/crews"
              payload: { name: "CREW-RT1", labor_program: "DOMESTIC", supervisor_user_id: "sup-1", planned_head_count: 1, contract_start_date: "2026-07-01", contract_end_date: "2026-09-30" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { crew: $.data.id }
            - call: "POST /berry-ops/harvest-windows"
              payload: { block_id: "${blk}", crew_id: "${crew}", start_at: "2026-08-03T06:00:00Z", end_at: "2026-08-03T14:00:00Z", forecast_brix: 8.5, planned_volume_lbs: 150.00, piece_rate_cents_per_clamshell: 45, clamshell_net_weight_lbs: 1.00 }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { win1: $.data.id }
          trigger:
            - call: "POST /berry-ops/harvest-windows"
              payload: { block_id: "${blk}", crew_id: "${crew}", start_at: "2026-08-03T14:00:00Z", end_at: "2026-08-03T20:00:00Z", forecast_brix: 8.5, planned_volume_lbs: 100.00, piece_rate_cents_per_clamshell: 45, clamshell_net_weight_lbs: 1.00 }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { err: $.data.error_id }
            - call: "POST /berry-ops/harvest-windows"
              payload: { block_id: "${blk}", crew_id: "${crew}", start_at: "2026-08-04T02:00:00Z", end_at: "2026-08-04T10:00:00Z", forecast_brix: 8.5, planned_volume_lbs: 100.00, piece_rate_cents_per_clamshell: 45, clamshell_net_weight_lbs: 1.00 }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { win3: $.data.id }
          assert:
            - "adjacent attempt: response status is 409 and $.data.error_id == ERR_BLOCK_REENTRY_CONFLICT"
            - "buffer-edge attempt: response status is 201 and HarvestWindow.${win3}.status == PLANNED"
            - "GET /berry-ops/harvest-windows?block_id=${blk} returns exactly 2 windows"
            - "HarvestWindow.${win1}.status == PLANNED (untouched by the refused create)"
            - "HarvestWindow.${win3}.window_hours == 8.00"

      - name: tunnel_slot_capacity_aggregate_over_half_open_intervals_admits_adjacency
        grounds:
          - calculations.tunnel_occupancy
          - validations[priority=61]
          - errors[ERR_TUNNEL_CAPACITY_EXCEEDED]
          - entities.CoolingTunnel.fields.committed_slots
        distinguishing_aspect: |
          A different resource and the OPPOSITE boundary convention from the
          block re-entry instance: tunnel occupancy is HALF-OPEN, so a second lot
          requesting 12:00-16:00 against an occupant holding 3 of 3 slots over
          09:00-13:00 is refused with ERR_TUNNEL_CAPACITY_EXCEEDED (422) on the
          AGGREGATE of slots, while the same request shifted to 13:00-17:00 —
          exactly abutting the occupant's end — is admitted.
        test_recipe:
          setup:
            - "One STRAWBERRY block, one crew, one PLANNED window spanning 2026-08-03."
            - "One tunnel with slot_capacity 3."
            - "Lot one (60 clamshells) COOLING in that tunnel over 2026-08-03T09:00:00Z -> 2026-08-03T13:00:00Z holding all 3 pallet slots."
            - "Lot two (40 clamshells) PACKED, pack_completed_at 2026-08-03T06:00:00Z, not yet cooled."
          setup_api_calls:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-RT2", variety: "STRAWBERRY", acres: 9.50, planting_year: 2021, irrigation_source_code: "WELL-16" }
