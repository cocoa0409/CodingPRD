              captures: { err_owner: $.data.error_id }
          assert:
            - "the call returns 409 ERR_OWNER_ALREADY_EXISTS (captured as ${err_owner})"
            - "GET /fitness/memberships/${m_id}/household-users returns exactly 1 row, the original owner ${u_ada}"
            - "Membership.${m_id}.active_user_count stays 1"

      - name: warranty_reset_on_a_new_sale_device_returns_not_eligible
        claim_type: Violation → Error
        grounds:
          - errors[ERR_WARRANTY_RESET_NOT_ELIGIBLE]
          - state_machines.Device.ACTIVE_to_ACTIVE
        distinguishing_aspect: "The resale warranty reset is gated on provenance: a NEW_SALE device is refused while the identical call against a RESALE device rewrites the window to 90 days."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-05T13:30:00Z. A delivered linked ACTIVE NEW_SALE device."
          setup_api_calls:
            - *c_clock
            - *c_m_create
            - *c_u_owner
            - *c_uv_owner
            - *c_d_create
            - *c_o_create
            - *c_a_create
            - *c_a_sched
            - *c_k_deliver
            - *c_a_start
            - *c_a_complete
            - *c_d_get
            - *c_d_link
            - *c_m_get
            - *c_m_act
          trigger:
            - call: "POST /fitness/devices/${d_id}/warranty-reset"
              payload: {}
              as: ServiceTechnician
              captures: { err_reset: $.data.error_id }
          assert:
            - "the call returns 409 ERR_WARRANTY_RESET_NOT_ELIGIBLE (captured as ${err_reset}) because Device.${d_id}.provenance_source == NEW_SALE"
            - "Device.${d_id}.warranty_expires_at stays 2027-09-05T13:30:00Z and Device.${d_id}.resale_cycle_count stays 0"
            - "the identical call against a device minted by a RefurbBatch sale succeeds and sets warranty_expires_at to clock + 90 days with resale_cycle_count == 1"

      - name: cosmetic_fault_with_no_stock_parks_the_service_order_pending_a_part
        claim_type: Violation → Error
        grounds:
          - errors[ERR_PART_INSUFFICIENT]
          - state_machines.ServiceOrder.DISPATCHED_to_DISPATCH_PENDING_PART
        distinguishing_aspect: "An empty shelf on a cosmetic fault produces the parking transition with its distinct error id rather than the safety-stock error, and no content lock is taken while the part is missing."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-05T13:30:00Z. A delivered linked ACTIVE device, a DISPATCHED cosmetic order, and a part registered but never restocked."
          setup_api_calls:
            - *c_clock
            - *c_m_create
            - *c_u_owner
            - *c_uv_owner
            - *c_d_create
            - *c_o_create
            - *c_a_create
            - *c_a_sched
            - *c_k_deliver
            - *c_a_start
            - *c_a_complete
            - call: "POST /fitness/parts-inventory"
              payload: { part_code: "TREAD-BELT-42", compatible_sku: "TREAD", safety_stock_qty: 2, part_lot_key: "LOT-2026-09" }
