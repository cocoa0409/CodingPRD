scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 — Entities (creation, retrieval, listing, not-found, required,
  #             defaults, computed, system, type-constraints, FK integrity)
  # ===========================================================================
  - section: entities
    instances:
      - name: create_product_returns_201_with_active_status_and_system_fields
        claim_type: Creation
        grounds:
          - endpoints.POST_/products
          - entities.Product.fields.status
        distinguishing_aspect: |
          POST /products with all required fields returns 201, status defaults to ACTIVE,
          and system fields id/created_at/version are minted (version == 1).
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { model_number: "PRD-CREATE-1", category: "ELECTRONICS", msrp_cents: 60000, base_warranty_months: 12, serviceable_lifespan_months: 48 }
              as: WarrantyAdmin
              captures: { prod_id: $.data.id, prod_v: $.data.version }
          assert:
            - "response.status == 201"
            - "Product.${prod_id}.status == ACTIVE"
            - "Product.${prod_id}.model_number == PRD-CREATE-1"
            - "Product.${prod_id}.version == 1"

      - name: get_product_returns_stored_entity
        claim_type: Retrieval
        grounds:
          - endpoints.GET_/products/{id}
        distinguishing_aspect: "GET /products/{id} returns the exact stored Product fields."
        test_recipe:
          setup:
            - "One product exists."
          setup_api_calls:
            - call: "POST /products"
              payload: { model_number: "PRD-GET-1", category: "APPLIANCE", msrp_cents: 75000, base_warranty_months: 24, serviceable_lifespan_months: 60 }
              as: WarrantyAdmin
              captures: { prod_id: $.data.id }
          trigger:
            - call: "GET /products/${prod_id}"
              payload: {}
              as: Owner
              as_user_id: "any-owner"
          assert:
            - "response.status == 200"
            - "Product.${prod_id}.model_number == PRD-GET-1"
            - "Product.${prod_id}.msrp_cents == 75000"
            - "Product.${prod_id}.category == APPLIANCE"

      - name: list_products_paginated_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/products
        distinguishing_aspect: |
          GET /products with limit=1&offset=0 returns one item, total_count reflecting the full
          set, and has_more=true when more remain.
        test_recipe:
          setup:
            - "Two products exist."
          setup_api_calls:
            - call: "POST /products"
              payload: { model_number: "PRD-LIST-A", category: "ELECTRONICS", msrp_cents: 10000, base_warranty_months: 12, serviceable_lifespan_months: 24 }
              as: WarrantyAdmin
            - call: "POST /products"
              payload: { model_number: "PRD-LIST-B", category: "FURNITURE", msrp_cents: 20000, base_warranty_months: 6, serviceable_lifespan_months: 120 }
              as: WarrantyAdmin
          trigger:
            - call: "GET /products?limit=1&offset=0"
              payload: {}
              as: WarrantyAdmin
          assert:
            - "response.status == 200"
            - "len(response.data) == 1"
            - "response.meta-or-pagination.total_count == 2"
            - "response.has_more == true"

      - name: get_product_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/products/{id}
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /products/{random-uuid} for an unknown id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /products/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: WarrantyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_registration_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints.POST_/registrations
          - validations[priority=13]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          POST /registrations omitting the required serial_number returns ERR_INVALID_REQUEST (400) —
          serial_number is source:input with no default.
        test_recipe:
          setup:
            - "A product and owner exist."
          setup_api_calls:
            - call: "POST /products"
              payload: { model_number: "PRD-REQ-1", category: "ELECTRONICS", msrp_cents: 60000, base_warranty_months: 12, serviceable_lifespan_months: 48 }
              as: WarrantyAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /owners"
              payload: { full_name: "Req Owner", email: "req@x.com" }
              as: WarrantyAdmin
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /registrations"
              payload: { product_id: "${prod_id}", owner_user_id: "${o_id}", purchase_date: "2024-01-15T00:00:00Z", purchase_price_cents: 50000 }
              as: Owner
              as_user_id: "${o_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_coverage_tier_refund_eligible_defaults_true
        claim_type: Defaults
        grounds:
          - endpoints.POST_/coverage-tiers
          - entities.CoverageTier.fields.refund_eligible
        distinguishing_aspect: |
          POST /coverage-tiers omitting refund_eligible applies the default true; premium_refund_method
          omitted applies default PRO_RATA; status defaults ACTIVE.
        test_recipe:
          setup:
            - "A product exists."
          setup_api_calls:
            - call: "POST /products"
              payload: { model_number: "PRD-DEF-1", category: "ELECTRONICS", msrp_cents: 60000, base_warranty_months: 12, serviceable_lifespan_months: 48 }
              as: WarrantyAdmin
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /coverage-tiers"
              payload: { product_id: "${prod_id}", tier_name: "SILVER", extension_months: 12, price_cents: 6000, coverage_cap_cents: 30000, depreciation_method: "STRAIGHT_LINE" }
              as: WarrantyAdmin
              captures: { tier_id: $.data.id }
          assert:
            - "response.status == 201"
            - "CoverageTier.${tier_id}.refund_eligible == true"
            - "CoverageTier.${tier_id}.premium_refund_method == PRO_RATA"
            - "CoverageTier.${tier_id}.status == ACTIVE"

      - name: registration_remaining_coverage_initialized_to_base_tier_cap_on_create
        claim_type: Computed Fields
        grounds:
          - endpoints.POST_/registrations
          - entities.Registration.fields.remaining_coverage_cents
          - entities.Registration.fields.active_tier_id
        distinguishing_aspect: |
          On registration create, active_tier_id is set to the product's BASE tier and
          remaining_coverage_cents equals that BASE tier's coverage_cap_cents (no extensions yet, no debits).
        test_recipe:
          setup:
            - "Product with a BASE tier cap 18000 exists."
          setup_api_calls:
            - call: "POST /products"
              payload: { model_number: "PRD-COMP-1", category: "ELECTRONICS", msrp_cents: 60000, base_warranty_months: 12, serviceable_lifespan_months: 48 }
              as: WarrantyAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /coverage-tiers"
              payload: { product_id: "${prod_id}", tier_name: "BASE", extension_months: 0, price_cents: 0, coverage_cap_cents: 18000, depreciation_method: "STRAIGHT_LINE" }
              as: WarrantyAdmin
              captures: { base_id: $.data.id }
            - call: "POST /owners"
              payload: { full_name: "Comp Owner", email: "comp@x.com" }
              as: WarrantyAdmin
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /registrations"
              payload: { product_id: "${prod_id}", serial_number: "SN-COMP", owner_user_id: "${o_id}", purchase_date: "2024-01-15T00:00:00Z", purchase_price_cents: 50000 }
              as: Owner
              as_user_id: "${o_id}"
              captures: { reg_id: $.data.id, reg_tier: $.data.active_tier_id }
          assert:
            - "response.status == 201"
            - "Registration.${reg_id}.remaining_coverage_cents == 18000"
            - "Registration.${reg_id}.active_tier_id == ${base_id}"
            - "Registration.${reg_id}.proof_status == UNVERIFIED"
            - "Registration.${reg_id}.status == REGISTERED"

      - name: registration_status_input_ignored_starts_registered
        claim_type: System Fields
        grounds:
          - endpoints.POST_/registrations
          - entities.Registration.fields.status
        distinguishing_aspect: |
          status is source:system; any client-supplied status in the body is ignored and the new
          Registration always starts REGISTERED with version 1.
        test_recipe:
          setup:
            - "Product with BASE tier and an owner exist."
          setup_api_calls:
            - call: "POST /products"
              payload: { model_number: "PRD-SYS-1", category: "ELECTRONICS", msrp_cents: 60000, base_warranty_months: 12, serviceable_lifespan_months: 48 }
              as: WarrantyAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /coverage-tiers"
              payload: { product_id: "${prod_id}", tier_name: "BASE", extension_months: 0, price_cents: 0, coverage_cap_cents: 20000, depreciation_method: "STRAIGHT_LINE" }
              as: WarrantyAdmin
            - call: "POST /owners"
              payload: { full_name: "Sys Owner", email: "sys@x.com" }
              as: WarrantyAdmin
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /registrations"
              payload: { product_id: "${prod_id}", serial_number: "SN-SYS", owner_user_id: "${o_id}", purchase_date: "2024-01-15T00:00:00Z", purchase_price_cents: 50000 }
              as: Owner
              as_user_id: "${o_id}"
              captures: { reg_id: $.data.id, reg_v: $.data.version }
          assert:
            - "response.status == 201"
            - "Registration.${reg_id}.status == REGISTERED"
            - "Registration.${reg_id}.version == 1"

      - name: create_product_invalid_category_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - endpoints.POST_/products
          - entities.Product.fields.category
          - validations[priority=13]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          POST /products with category outside {ELECTRONICS, APPLIANCE, POWER_TOOL, FURNITURE} returns
          ERR_INVALID_REQUEST (400).
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { model_number: "PRD-BADENUM", category: "VEHICLE", msrp_cents: 60000, base_warranty_months: 12, serviceable_lifespan_months: 48 }
              as: WarrantyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_product_negative_msrp_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - endpoints.POST_/products
          - entities.Product.fields.msrp_cents
          - validations[priority=13]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          msrp_cents has constraint >= 1; a zero/negative value is rejected with ERR_INVALID_REQUEST (400)
          (a numeric-range constraint distinct from the enum constraint above).
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { model_number: "PRD-NEG", category: "ELECTRONICS", msrp_cents: 0, base_warranty_months: 12, serviceable_lifespan_months: 48 }
              as: WarrantyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: owner_immutable_entity_has_only_id_and_created_at_no_version
        claim_type: Immutability
        grounds:
          - entities.Owner
          - endpoints.POST_/owners
          - endpoints.GET_/owners/{id}
        distinguishing_aspect: |
          Owner has common_fields:false: the created/fetched Owner exposes id and created_at but no
          version field, and there is no update endpoint for it in §1.5.
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Immutable Owner", email: "immut@x.com" }
              as: WarrantyAdmin
              captures: { o_id: $.data.id }
          trigger:
            - call: "GET /owners/${o_id}"
              payload: {}
              as: WarrantyAdmin
          assert:
            - "response.status == 200"
            - "Owner.${o_id}.full_name == Immutable Owner"
            - "Owner.${o_id} has no version field"

      - name: create_registration_unknown_product_fk_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - endpoints.POST_/registrations
          - entities.Registration.fields.product_id
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: |
          flat-topology FK integrity: POST /registrations referencing a non-existent product_id returns
          ERR_NOT_FOUND (404).
        test_recipe:
          setup:
            - "An owner exists; no product with the referenced id."
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "FK Owner", email: "fk@x.com" }
              as: WarrantyAdmin
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /registrations"
              payload: { product_id: "11111111-1111-4111-8111-111111111111", serial_number: "SN-FK", owner_user_id: "${o_id}", purchase_date: "2024-01-15T00:00:00Z", purchase_price_cents: 50000 }
              as: Owner
              as_user_id: "${o_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: list_coverage_tiers_filtered_by_product_id_fk_reverse_reachability
        claim_type: Listing
        grounds:
          - endpoints.GET_/coverage-tiers
          - entities.CoverageTier.fields.product_id
        distinguishing_aspect: |
          flat-topology FK reverse-reachability: GET /coverage-tiers?product_id=X returns only tiers of
          product X as a CoverageTier[] array.
        test_recipe:
          setup:
            - "Product P1 has BASE+GOLD tiers; product P2 has only BASE."
          setup_api_calls:
            - call: "POST /products"
              payload: { model_number: "PRD-RR-1", category: "ELECTRONICS", msrp_cents: 60000, base_warranty_months: 12, serviceable_lifespan_months: 48 }
              as: WarrantyAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /products"
              payload: { model_number: "PRD-RR-2", category: "APPLIANCE", msrp_cents: 40000, base_warranty_months: 12, serviceable_lifespan_months: 48 }
              as: WarrantyAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /coverage-tiers"
              payload: { product_id: "${p1_id}", tier_name: "BASE", extension_months: 0, price_cents: 0, coverage_cap_cents: 20000, depreciation_method: "STRAIGHT_LINE" }
              as: WarrantyAdmin
            - call: "POST /coverage-tiers"
              payload: { product_id: "${p1_id}", tier_name: "GOLD", extension_months: 24, price_cents: 12000, coverage_cap_cents: 40000, depreciation_method: "STRAIGHT_LINE" }
              as: WarrantyAdmin
            - call: "POST /coverage-tiers"
              payload: { product_id: "${p2_id}", tier_name: "BASE", extension_months: 0, price_cents: 0, coverage_cap_cents: 15000, depreciation_method: "STRAIGHT_LINE" }
              as: WarrantyAdmin
          trigger:
            - call: "GET /coverage-tiers?product_id=${p1_id}"
              payload: {}
              as: WarrantyAdmin
          assert:
            - "response.status == 200"
            - "len(response.data) == 2"
            - "every CoverageTier in response.data has product_id == ${p1_id}"

  # ===========================================================================
  # SECTION 2 — State Machines (valid transitions, invalid-from rejection,
  #             terminal lockdown, idempotency, initial-state, side-effects)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: validate_proof_from_already_validated_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.ProofOfPurchase.SUBMITTED_to_VALIDATED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          ProofOfPurchase already VALIDATED (terminal): a second POST /proofs/{id}/validate is rejected
          with ERR_INVALID_STATE (409); precondition status==SUBMITTED fails.
        test_recipe:
          setup:
            - "Owner O1 ACTIVE-eligible registration; proof submitted and already validated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-01-15T00:00:00Z" }
              as: WarrantyAdmin
            - call: "POST /products"
              payload: { model_number: "PRD-SM1", category: "ELECTRONICS", msrp_cents: 60000, base_warranty_months: 12, serviceable_lifespan_months: 48 }
              as: WarrantyAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /coverage-tiers"
              payload: { product_id: "${prod_id}", tier_name: "BASE", extension_months: 0, price_cents: 0, coverage_cap_cents: 20000, depreciation_method: "STRAIGHT_LINE" }
              as: WarrantyAdmin
            - call: "POST /owners"
              payload: { full_name: "SM Owner", email: "sm1@x.com" }
              as: WarrantyAdmin
              captures: { o_id: $.data.id }
            - call: "POST /registrations"
              payload: { product_id: "${prod_id}", serial_number: "SN-SM1", owner_user_id: "${o_id}", purchase_date: "2024-01-15T00:00:00Z", purchase_price_cents: 50000 }
              as: Owner
              as_user_id: "${o_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /proofs"
              payload: { registration_id: "${reg_id}", document_type: "RECEIPT", stated_purchase_date: "2024-01-15T00:00:00Z", stated_amount_cents: 50000 }
              as: Owner
              as_user_id: "${o_id}"
              captures: { proof_id: $.data.id }
            - call: "POST /proofs/${proof_id}/validate"
              payload: {}
              as: WarrantyAdmin
          trigger:
            - call: "POST /proofs/${proof_id}/validate"
              payload: {}
              as: WarrantyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "ProofOfPurchase.${proof_id}.status == VALIDATED"

      - name: issue_rma_twice_idempotency_second_call_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.Claim.INTAKE_to_RMA_ISSUED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Re-issuing an RMA on a claim already in RMA_ISSUED is rejected with ERR_INVALID_STATE (409);
          precondition Claim.status==INTAKE fails on the second call.
        test_recipe:
          setup:
            - "Owner O1 ACTIVE validated registration; a MANUFACTURING claim already RMA_ISSUED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-01-15T00:00:00Z" }
              as: WarrantyAdmin
            - call: "POST /products"
              payload: { model_number: "PRD-SM2", category: "ELECTRONICS", msrp_cents: 60000, base_warranty_months: 24, serviceable_lifespan_months: 48 }
              as: WarrantyAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /coverage-tiers"
              payload: { product_id: "${prod_id}", tier_name: "BASE", extension_months: 0, price_cents: 0, coverage_cap_cents: 40000, depreciation_method: "STRAIGHT_LINE" }
              as: WarrantyAdmin
            - call: "POST /owners"
              payload: { full_name: "SM Owner2", email: "sm2@x.com" }
              as: WarrantyAdmin
              captures: { o_id: $.data.id }
            - call: "POST /registrations"
              payload: { product_id: "${prod_id}", serial_number: "SN-SM2", owner_user_id: "${o_id}", purchase_date: "2024-01-15T00:00:00Z", purchase_price_cents: 50000 }
              as: Owner
              as_user_id: "${o_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /proofs"
              payload: { registration_id: "${reg_id}", document_type: "RECEIPT", stated_purchase_date: "2024-01-15T00:00:00Z", stated_amount_cents: 50000 }
              as: Owner
              as_user_id: "${o_id}"
              captures: { proof_id: $.data.id }
            - call: "POST /proofs/${proof_id}/validate"
              payload: {}
              as: WarrantyAdmin
            - call: "POST /claims"
              payload: { registration_id: "${reg_id}", defect_category: "MANUFACTURING", reported_date: "2024-02-15T00:00:00Z" }
              as: Owner
              as_user_id: "${o_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/issue-rma"
              payload: {}
              as: ClaimsProcessor
          trigger:
            - call: "POST /claims/${claim_id}/issue-rma"
              payload: {}
              as: ClaimsProcessor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Claim.${claim_id}.status == RMA_ISSUED"

      - name: fulfill_terminal_denied_claim_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Claim.RMA_ISSUED_to_DENIED
          - state_machines.Claim.ADJUDICATED_to_FULFILLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          A DENIED claim is terminal: POST /claims/{id}/fulfill is rejected with ERR_INVALID_STATE (409)
          because the fulfill precondition status==ADJUDICATED fails.
        test_recipe:
          setup:
            - "Owner O1 ACTIVE validated registration; a MANUFACTURING claim RMA_ISSUED then DENIED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-01-15T00:00:00Z" }
              as: WarrantyAdmin
            - call: "POST /products"
              payload: { model_number: "PRD-SM3", category: "ELECTRONICS", msrp_cents: 60000, base_warranty_months: 24, serviceable_lifespan_months: 48 }
              as: WarrantyAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /coverage-tiers"
              payload: { product_id: "${prod_id}", tier_name: "BASE", extension_months: 0, price_cents: 0, coverage_cap_cents: 40000, depreciation_method: "STRAIGHT_LINE" }
              as: WarrantyAdmin
            - call: "POST /owners"
              payload: { full_name: "SM Owner3", email: "sm3@x.com" }
              as: WarrantyAdmin
              captures: { o_id: $.data.id }
            - call: "POST /registrations"
              payload: { product_id: "${prod_id}", serial_number: "SN-SM3", owner_user_id: "${o_id}", purchase_date: "2024-01-15T00:00:00Z", purchase_price_cents: 50000 }
              as: Owner
              as_user_id: "${o_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /proofs"
              payload: { registration_id: "${reg_id}", document_type: "RECEIPT", stated_purchase_date: "2024-01-15T00:00:00Z", stated_amount_cents: 50000 }
              as: Owner
              as_user_id: "${o_id}"
              captures: { proof_id: $.data.id }
            - call: "POST /proofs/${proof_id}/validate"
              payload: {}
              as: WarrantyAdmin
            - call: "POST /claims"
              payload: { registration_id: "${reg_id}", defect_category: "WEAR_AND_TEAR", reported_date: "2024-02-15T00:00:00Z" }
              as: Owner
              as_user_id: "${o_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/issue-rma"
              payload: {}
              as: ClaimsProcessor
            - call: "POST /claims/${claim_id}/adjudicate"
              payload: { decision: "DENY" }
              as: WarrantyAdmin
          trigger:
            - call: "POST /claims/${claim_id}/fulfill"
