            - { call: "GET /haul/loads/${ld}", as: Any, captures: { ld_v2: $.data.version } }
          trigger:
            - { call: "POST /haul/loads/${ld}/allocations", payload: { trailer_compartment_id: "${c1}", head_count: 5, avg_weight_lb: 1000, expected_load_version: "${ld_v}" }, as: Dispatcher, captures: { err: $.data.error_id } }
            - { call: "POST /haul/loads/${ld}/allocations", payload: { trailer_compartment_id: "${c1}", head_count: 5, avg_weight_lb: 1000, expected_load_version: "${ld_v2}" }, as: Dispatcher }
