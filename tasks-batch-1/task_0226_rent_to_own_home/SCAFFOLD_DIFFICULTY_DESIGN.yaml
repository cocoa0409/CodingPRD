# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Rent-to-Own / Lease-Purchase Home — 9 rules x >=2 instances = 18 instances
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1-§1.7.
# Every setup_api_calls / trigger call resolves to a §1.5 endpoint.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dvc_rent_credit_provisional_vs_final
        grounds:
          - calculations.rent_credit_accrual
          - entities.Agreement.fields.gross_credit_accrued_cents
          - entities.Agreement.fields.available_credit_cents
          - state_machines.RentPayment.PENDING_to_PAID
          - state_machines.RentPayment.PENDING_to_LATE
        distinguishing_aspect: |
          On the Agreement domain, the provisional variant (gross_credit_accrued counts
          PENDING+PAID+LATE) and the final variant (available_credit counts PAID only)
          produce DIFFERENT cents for the same payment set: 240000 vs 120000.
        test_recipe:
          setup:
            - "Landlord L, Tenant T, Property P (AVAILABLE), Agreement A ACTIVE with monthly_payment_cents=200000, credit_pct=0.30 (credit_portion=60000/period)."
            - "Four RentPayment periods scheduled; p1 & p2 recorded on-time (PAID), p3 recorded past grace (LATE), p4 left PENDING."
          setup_api_calls:
            - call: "POST /landlords"
              payload: { legal_name: "L Owner", email: "l1@x.com", payout_account_ref: "acct_l1" }
              as: Landlord
              captures: { l_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "T Buyer", email: "t1@x.com", credit_score: 700 }
              as: Tenant
              captures: { t_id: $.data.id }
            - call: "POST /properties"
              payload: { landlord_id: "${l_id}", address: "1 Provisional Way", list_price_cents: 30000000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { p_id: $.data.id, p_ver: $.data.version }
            - call: "POST /agreements"
              payload: { property_id: "${p_id}", tenant_id: "${t_id}", locked_price_cents: 30000000, option_fee_cents: 500000, monthly_payment_cents: 200000, credit_pct: 0.30, lease_start: "2026-01-01T00:00:00Z", option_term_months: 24 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { a_id: $.data.id }
            - call: "POST /agreements/${a_id}/activate"
              payload: { expected_property_version: "${p_ver}" }
              as: Landlord
              as_user_id: "${l_id}"
            - call: "POST /agreements/${a_id}/rent-payments"
              payload: { period_index: 1, due_date: "2026-02-01T00:00:00Z" }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { rp1_id: $.data.id }
            - call: "POST /agreements/${a_id}/rent-payments"
              payload: { period_index: 2, due_date: "2026-03-01T00:00:00Z" }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { rp2_id: $.data.id }
            - call: "POST /agreements/${a_id}/rent-payments"
              payload: { period_index: 3, due_date: "2026-04-01T00:00:00Z" }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { rp3_id: $.data.id }
            - call: "POST /agreements/${a_id}/rent-payments"
              payload: { period_index: 4, due_date: "2026-05-01T00:00:00Z" }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { rp4_id: $.data.id }
            - call: "POST /rent-payments/${rp1_id}/record"
              payload: { paid_at: "2026-02-03T00:00:00Z" }
              as: Tenant
              as_user_id: "${t_id}"
            - call: "POST /rent-payments/${rp2_id}/record"
              payload: { paid_at: "2026-03-04T00:00:00Z" }
              as: Tenant
              as_user_id: "${t_id}"
            - call: "POST /rent-payments/${rp3_id}/record"
              payload: { paid_at: "2026-04-20T00:00:00Z" }
              as: Tenant
              as_user_id: "${t_id}"
          trigger:
            - call: "GET /agreements/${a_id}"
              as: Landlord
              as_user_id: "${l_id}"
              captures: { gross: $.data.gross_credit_accrued_cents, avail: $.data.available_credit_cents }
          assert:
            - "Agreement.${a_id}.gross_credit_accrued_cents == 240000"
            - "Agreement.${a_id}.available_credit_cents == 120000"
            - "Agreement.${a_id}.gross_credit_accrued_cents != Agreement.${a_id}.available_credit_cents"

      - name: dvc_maintenance_estimate_vs_actual_split
        grounds:
          - calculations.maintenance_cost_split
          - entities.MaintenanceTicket.fields.tenant_share_cents
          - entities.MaintenanceTicket.fields.landlord_share_cents
          - state_machines.MaintenanceTicket.OPEN_to_APPROVED
          - state_machines.MaintenanceTicket.APPROVED_to_RESOLVED
        distinguishing_aspect: |
          On the MaintenanceTicket domain (different entity from rent_credit_accrual),
          the estimate-split variant (on estimated_cost_cents=80000 -> landlord_share 30000)
          and the actual-split variant (on actual_cost_cents=120000 -> landlord_share 70000)
          produce DIFFERENT landlord_share for the same ticket.
        test_recipe:
          setup:
            - "Agreement A ACTIVE (maintenance_threshold_cents=50000 default)."
            - "MaintenanceTicket M filed (estimated_cost_cents=80000), approved (estimate split), then resolved with actual_cost_cents=120000."
          setup_api_calls:
            - call: "POST /landlords"
              payload: { legal_name: "L2", email: "l2@x.com", payout_account_ref: "acct_l2" }
              as: Landlord
              captures: { l_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "T2", email: "t2@x.com", credit_score: 700 }
              as: Tenant
              captures: { t_id: $.data.id }
            - call: "POST /properties"
              payload: { landlord_id: "${l_id}", address: "2 Repair Rd", list_price_cents: 30000000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { p_id: $.data.id, p_ver: $.data.version }
            - call: "POST /agreements"
              payload: { property_id: "${p_id}", tenant_id: "${t_id}", locked_price_cents: 30000000, option_fee_cents: 500000, monthly_payment_cents: 200000, credit_pct: 0.30, lease_start: "2026-01-01T00:00:00Z", option_term_months: 24 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { a_id: $.data.id }
            - call: "POST /agreements/${a_id}/activate"
              payload: { expected_property_version: "${p_ver}" }
              as: Landlord
              as_user_id: "${l_id}"
            - call: "POST /agreements/${a_id}/maintenance-tickets"
              payload: { summary: "Furnace", estimated_cost_cents: 80000 }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { m_id: $.data.id }
            - call: "POST /maintenance-tickets/${m_id}/approve"
              payload: {}
              as: Landlord
              as_user_id: "${l_id}"
              captures: { est_landlord: $.data.landlord_share_cents }
          trigger:
            - call: "POST /maintenance-tickets/${m_id}/resolve"
              payload: { actual_cost_cents: 120000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { act_landlord: $.data.landlord_share_cents }
          assert:
            - "MaintenanceTicket.${m_id} landlord_share_cents was 30000 after approve (estimate split)"
            - "MaintenanceTicket.${m_id}.landlord_share_cents == 70000 after resolve (actual split)"
            - "MaintenanceTicket.${m_id}.tenant_share_cents == 50000 after resolve"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cf_purchase_settlement_nested_min_and_conditional
        grounds:
          - calculations.purchase_settlement
          - entities.OptionExercise.fields.credit_applied_cents
          - entities.OptionExercise.fields.net_due_at_closing_cents
          - state_machines.OptionExercise.PENDING_to_SETTLED
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — credit_applied = min(available_credit,
          round(locked*max_credit_pct)) and option_fee_credit branches on option_fee_creditable;
          with available 180000 < cap 6000000 the min picks available, fee creditable subtracts 500000:
          net_due = 30000000 - 180000 - 500000 = 29320000.
        test_recipe:
          setup:
            - "Agreement A ACTIVE: locked_price_cents=30000000, max_credit_pct=0.20, option_fee_cents=500000, option_fee_creditable=true."
            - "Three RentPayments PAID on time -> available_credit_cents=180000; clock at 2026-06-01 (before option_deadline 2028-01-01)."
          setup_api_calls:
            - call: "POST /landlords"
              payload: { legal_name: "L3", email: "l3@x.com", payout_account_ref: "acct_l3" }
              as: Landlord
              captures: { l_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "T3", email: "t3@x.com", credit_score: 700 }
              as: Tenant
              captures: { t_id: $.data.id }
            - call: "POST /properties"
              payload: { landlord_id: "${l_id}", address: "3 Closing Ct", list_price_cents: 30000000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { p_id: $.data.id, p_ver: $.data.version }
            - call: "POST /agreements"
              payload: { property_id: "${p_id}", tenant_id: "${t_id}", locked_price_cents: 30000000, option_fee_cents: 500000, option_fee_creditable: true, monthly_payment_cents: 200000, credit_pct: 0.30, max_credit_pct: 0.20, lease_start: "2026-01-01T00:00:00Z", option_term_months: 24 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { a_id: $.data.id }
            - call: "POST /agreements/${a_id}/activate"
              payload: { expected_property_version: "${p_ver}" }
              as: Landlord
              as_user_id: "${l_id}"
            - call: "POST /agreements/${a_id}/rent-payments"
              payload: { period_index: 1, due_date: "2026-02-01T00:00:00Z" }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { rp1_id: $.data.id }
            - call: "POST /agreements/${a_id}/rent-payments"
              payload: { period_index: 2, due_date: "2026-03-01T00:00:00Z" }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { rp2_id: $.data.id }
            - call: "POST /agreements/${a_id}/rent-payments"
              payload: { period_index: 3, due_date: "2026-04-01T00:00:00Z" }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { rp3_id: $.data.id }
            - call: "POST /rent-payments/${rp1_id}/record"
              payload: { paid_at: "2026-02-03T00:00:00Z" }
              as: Tenant
              as_user_id: "${t_id}"
            - call: "POST /rent-payments/${rp2_id}/record"
              payload: { paid_at: "2026-03-03T00:00:00Z" }
              as: Tenant
              as_user_id: "${t_id}"
            - call: "POST /rent-payments/${rp3_id}/record"
              payload: { paid_at: "2026-04-03T00:00:00Z" }
              as: Tenant
              as_user_id: "${t_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Landlord
              as_user_id: "${l_id}"
          trigger:
            - call: "POST /agreements/${a_id}/option-exercises"
              payload: { exercised_at: "2026-06-01T00:00:00Z" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { oe_id: $.data.id, applied: $.data.credit_applied_cents, net: $.data.net_due_at_closing_cents }
          assert:
            - "OptionExercise.${oe_id}.max_credit_cap_cents == 6000000"
            - "OptionExercise.${oe_id}.credit_applied_cents == 180000"
            - "OptionExercise.${oe_id}.option_fee_credit_cents == 500000"
            - "OptionExercise.${oe_id}.net_due_at_closing_cents == 29320000"

      - name: cf_accrual_round_per_payment_then_sum
        grounds:
          - calculations.payment_split
          - calculations.rent_credit_accrual
          - entities.RentPayment.fields.credit_portion_cents
          - entities.Agreement.fields.available_credit_cents
        distinguishing_aspect: |
          Mode (b): rounding-order pinned — credit_portion = round_half_up(amount*credit_pct) PER PAYMENT,
          then accrual SUMS the rounded per-payment values. amount=33333, credit_pct=0.30 ->
          round(9999.9)=10000 per payment; three PAID -> 30000. (Sum-then-round of 3*9999.9=29999.7
          would round to 30000 here, but the per-payment row credit_portion is pinned to 10000, not 9999.9.)
        test_recipe:
          setup:
            - "Agreement A ACTIVE with monthly_payment_cents=33333, credit_pct=0.30 (per-payment credit_portion rounds to 10000)."
            - "Three RentPayments recorded PAID on time."
          setup_api_calls:
            - call: "POST /landlords"
              payload: { legal_name: "L4", email: "l4@x.com", payout_account_ref: "acct_l4" }
              as: Landlord
              captures: { l_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "T4", email: "t4@x.com", credit_score: 700 }
              as: Tenant
              captures: { t_id: $.data.id }
            - call: "POST /properties"
              payload: { landlord_id: "${l_id}", address: "4 Rounding Rd", list_price_cents: 30000000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { p_id: $.data.id, p_ver: $.data.version }
            - call: "POST /agreements"
              payload: { property_id: "${p_id}", tenant_id: "${t_id}", locked_price_cents: 30000000, option_fee_cents: 0, monthly_payment_cents: 33333, credit_pct: 0.30, lease_start: "2026-01-01T00:00:00Z", option_term_months: 24 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { a_id: $.data.id }
            - call: "POST /agreements/${a_id}/activate"
              payload: { expected_property_version: "${p_ver}" }
              as: Landlord
              as_user_id: "${l_id}"
            - call: "POST /agreements/${a_id}/rent-payments"
              payload: { period_index: 1, due_date: "2026-02-01T00:00:00Z" }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { rp1_id: $.data.id, cp1: $.data.credit_portion_cents }
            - call: "POST /agreements/${a_id}/rent-payments"
              payload: { period_index: 2, due_date: "2026-03-01T00:00:00Z" }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { rp2_id: $.data.id }
            - call: "POST /agreements/${a_id}/rent-payments"
              payload: { period_index: 3, due_date: "2026-04-01T00:00:00Z" }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { rp3_id: $.data.id }
            - call: "POST /rent-payments/${rp1_id}/record"
              payload: { paid_at: "2026-02-03T00:00:00Z" }
              as: Tenant
              as_user_id: "${t_id}"
            - call: "POST /rent-payments/${rp2_id}/record"
              payload: { paid_at: "2026-03-03T00:00:00Z" }
              as: Tenant
              as_user_id: "${t_id}"
            - call: "POST /rent-payments/${rp3_id}/record"
              payload: { paid_at: "2026-04-03T00:00:00Z" }
              as: Tenant
              as_user_id: "${t_id}"
          trigger:
            - call: "GET /agreements/${a_id}"
              as: Landlord
              as_user_id: "${l_id}"
              captures: { avail: $.data.available_credit_cents }
          assert:
            - "RentPayment.${rp1_id}.credit_portion_cents == 10000"
            - "Agreement.${a_id}.available_credit_cents == 30000"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: nlsm_rentpayment_late_to_paid_cure_cycle
        grounds:
          - state_machines.RentPayment.PENDING_to_LATE
          - state_machines.RentPayment.LATE_to_PAID
          - entities.RentPayment.fields.status
        distinguishing_aspect: |
          RentPayment has a revert/cure loop: PENDING->LATE then LATE->PAID — a non-linear shape on
          the RentPayment entity (a strictly linear pipeline could never re-enter PAID from LATE).
        test_recipe:
          setup:
            - "Agreement A ACTIVE; one RentPayment recorded LATE (paid past grace)."
          setup_api_calls:
            - call: "POST /landlords"
              payload: { legal_name: "L5", email: "l5@x.com", payout_account_ref: "acct_l5" }
              as: Landlord
              captures: { l_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "T5", email: "t5@x.com", credit_score: 700 }
              as: Tenant
              captures: { t_id: $.data.id }
            - call: "POST /properties"
              payload: { landlord_id: "${l_id}", address: "5 Cure Cir", list_price_cents: 30000000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { p_id: $.data.id, p_ver: $.data.version }
            - call: "POST /agreements"
              payload: { property_id: "${p_id}", tenant_id: "${t_id}", locked_price_cents: 30000000, option_fee_cents: 500000, monthly_payment_cents: 200000, credit_pct: 0.30, lease_start: "2026-01-01T00:00:00Z", option_term_months: 24 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { a_id: $.data.id }
            - call: "POST /agreements/${a_id}/activate"
              payload: { expected_property_version: "${p_ver}" }
              as: Landlord
              as_user_id: "${l_id}"
            - call: "POST /agreements/${a_id}/rent-payments"
              payload: { period_index: 1, due_date: "2026-02-01T00:00:00Z" }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { rp1_id: $.data.id }
            - call: "POST /rent-payments/${rp1_id}/record"
              payload: { paid_at: "2026-02-20T00:00:00Z" }
              as: Tenant
              as_user_id: "${t_id}"
          trigger:
            - call: "POST /rent-payments/${rp1_id}/cure"
              payload: {}
              as: Landlord
              as_user_id: "${l_id}"
              captures: { st: $.data.status }
          assert:
            - "RentPayment.${rp1_id}.status == PAID after cure (was LATE)"
            - "Agreement.${a_id}.available_credit_cents == 60000 after cure"

      - name: nlsm_agreement_branching_active_to_default_vs_exercised
        grounds:
          - state_machines.Agreement.ACTIVE_to_EXERCISED
          - state_machines.Agreement.ACTIVE_to_DEFAULTED
          - state_machines.Agreement.ACTIVE_to_EXPIRED
          - entities.Agreement.fields.status
        distinguishing_aspect: |
          Agreement (different entity from RentPayment) branches from ACTIVE into divergent terminal
          paths {EXERCISED, DEFAULTED, EXPIRED} with different side-effect sets (DEFAULTED zeroes
          available_credit and forfeits payments; EXERCISED freezes credit into the exercise).
        test_recipe:
          setup:
            - "Agreement A ACTIVE with three PENDING RentPayments, all FORFEITED so missed_payment_count=3 (>= MAX_MISSED_PAYMENTS)."
          setup_api_calls:
            - call: "POST /landlords"
              payload: { legal_name: "L6", email: "l6@x.com", payout_account_ref: "acct_l6" }
              as: Landlord
              captures: { l_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "T6", email: "t6@x.com", credit_score: 700 }
              as: Tenant
              captures: { t_id: $.data.id }
            - call: "POST /properties"
              payload: { landlord_id: "${l_id}", address: "6 Branch Blvd", list_price_cents: 30000000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { p_id: $.data.id, p_ver: $.data.version }
            - call: "POST /agreements"
              payload: { property_id: "${p_id}", tenant_id: "${t_id}", locked_price_cents: 30000000, option_fee_cents: 500000, monthly_payment_cents: 200000, credit_pct: 0.30, lease_start: "2026-01-01T00:00:00Z", option_term_months: 24 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { a_id: $.data.id }
            - call: "POST /agreements/${a_id}/activate"
              payload: { expected_property_version: "${p_ver}" }
              as: Landlord
              as_user_id: "${l_id}"
            - call: "POST /agreements/${a_id}/rent-payments"
              payload: { period_index: 1, due_date: "2026-02-01T00:00:00Z" }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { rp1_id: $.data.id }
            - call: "POST /agreements/${a_id}/rent-payments"
              payload: { period_index: 2, due_date: "2026-03-01T00:00:00Z" }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { rp2_id: $.data.id }
            - call: "POST /agreements/${a_id}/rent-payments"
              payload: { period_index: 3, due_date: "2026-04-01T00:00:00Z" }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { rp3_id: $.data.id }
            - call: "POST /rent-payments/${rp1_id}/forfeit"
              payload: {}
              as: Landlord
              as_user_id: "${l_id}"
            - call: "POST /rent-payments/${rp2_id}/forfeit"
              payload: {}
              as: Landlord
              as_user_id: "${l_id}"
            - call: "POST /rent-payments/${rp3_id}/forfeit"
              payload: {}
              as: Landlord
              as_user_id: "${l_id}"
          trigger:
            - call: "POST /agreements/${a_id}/default"
              payload: {}
              as: Landlord
              as_user_id: "${l_id}"
              captures: { st: $.data.status }
          assert:
            - "Agreement.${a_id}.status == DEFAULTED"
            - "Agreement.${a_id}.available_credit_cents == 0"
            - "Property.${p_id}.status == AVAILABLE after default cascade"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: tc_mortgage_conversion_depth3
        grounds:
          - state_machines.Agreement.EXERCISED_to_CONVERTED
          - state_machines.Property.UNDER_AGREEMENT_to_SOLD
          - state_machines.OptionExercise.PENDING_to_SETTLED
          - entities.Mortgage.fields.principal_cents
          - entities.Property.fields.status
        distinguishing_aspect: |
          Depth-3 cascade from the EXERCISED->CONVERTED transition: convert mutates Agreement
          (->CONVERTED); that Agreement mutation itself drives Property (UNDER_AGREEMENT->SOLD),
          which itself bumps Property.version — each hop caused by the prior, not the original call.
        test_recipe:
          setup:
            - "Agreement A in EXERCISED with a SETTLED OptionExercise (net_due_at_closing_cents=29320000); Tenant.credit_score=700 (>= MIN_CONVERSION_SCORE 620)."
          setup_api_calls:
            - call: "POST /landlords"
              payload: { legal_name: "L7", email: "l7@x.com", payout_account_ref: "acct_l7" }
              as: Landlord
              captures: { l_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "T7", email: "t7@x.com", credit_score: 700 }
              as: Tenant
              captures: { t_id: $.data.id }
            - call: "POST /properties"
