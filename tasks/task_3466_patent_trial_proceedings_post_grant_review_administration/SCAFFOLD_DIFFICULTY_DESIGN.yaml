              as: Petitioner
              as_user_id: "${p19_id}"
              captures: { pet19_id: $.data.id }
            - call: "POST /ptab/petitions/${pet19_id}/accord-filing-date"
              payload: {}
              as: BoardPanel
            - call: "POST /ptab/petitions/${pet19_id}/decide-institution"
              payload: { per_ground_scores: [{ claim_number: 1, basis: "ANTICIPATION_102", score: 71 }, { claim_number: 2, basis: "OBVIOUSNESS_103", score: 62 }], lead_judge_user_id: "judge-quinn" }
              as: BoardPanel
              captures: { proc19_id: $.data.proceeding_id }
          trigger:
            - call: "POST /ptab/proceedings/${proc19_id}/amendment-motions"
              payload: { substitute_claims: [{ original_claim_number: 1, substitute_text: "1. (substitute) A filter comprising ..." }] }
