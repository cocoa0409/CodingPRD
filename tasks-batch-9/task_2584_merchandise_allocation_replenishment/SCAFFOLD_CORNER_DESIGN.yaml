            - "Receipt ASN-R201 of 30 units was spread, committed and the single 0101 line of 30 units (S 6 / M 11 / L 9 / XL 4) was SHIPPED"
            - "A REBALANCE transfer of 6 units from 0102 to 0101 was created by Allocator u-alloc-1, approved and DISPATCHED, so its size_split is S 4 / XL 2"
            - "StoreOperator's X-User-ID is the Store id; ${s1_id} is store 0101 and ${s2_id} is store 0102"
