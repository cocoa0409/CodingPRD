              as: Manager
              captures: { plant_id: "$.data.id" }
            - call: "POST /plants/${plant_id}/stock-units"
              payload: { acquisition_date: "2026-03-25T00:00:00Z" }
              as: ShopStaff
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_zone: "ZONE_A", lines: [{ plant_id: "${plant_id}", qty: 1 }] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /orders/${order_id}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/dispatch"
              payload: { driver_id: "${driver_id}", window_start_at: "2026-04-05T09:00:00Z", window_end_at: "2026-04-05T11:00:00Z" }
              as: ShopStaff
              captures: { delivery_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-05T10:00:00Z" }
              as: Manager
            - call: "POST /deliveries/${delivery_id}/deliver"
              payload: {}
              as: DeliveryDriver
              as_user_id: "${driver_id}"
            - call: "GET /order-lines"
              payload: { order_id: "${order_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { orderline_id: "$.data[0].id" }
            # advance to day 31 (2026-05-06T10:00Z) — one full day past the 30-day window
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-06T10:00:00Z" }
              as: Manager
          trigger:
            - call: "POST /warranty-claims"
              payload: { orderline_id: "${orderline_id}", customer_id: "${cust_id}", reason: "MORTALITY" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_WARRANTY_EXPIRED"

      - name: subscription_stock_selector_empty_candidate_set_flips_missing_stock
        grounds:
          - calculations.subscription_stock_selector
          - state_machines.Subscription.ACTIVE_to_MISSING_STOCK
          - entities.Subscription.fields.status
        distinguishing_aspect: |
          Empty-set boundary on a different metric (candidate cardinality)
          reachable through a different endpoint (/_scheduler/fulfill-
          subscriptions, not /warranty-claims). When the selector's candidate
          set has size 0 — zero StockUnits match care/light preferences — the
          scheduler transitions Subscription ACTIVE → MISSING_STOCK. A single
          matching unit (size 1) would fulfill; size 0 flips state.
        test_recipe:
          setup:
            - "Customer has an ACTIVE STARTER Subscription (care=EASY, light=MEDIUM); no plants match those preferences."
            - "Clock advanced past next_fulfillment_at."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: Manager
            - call: "POST /customers/register"
              payload: { email: "quinn@example.com", full_name: "Quinn", delivery_zone: "ZONE_A", address_line: "13 Sage" }
              as: Anonymous
