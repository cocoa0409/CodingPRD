            - call: "POST /cbb/enrollments/${enr_f5_id}/consent"
              payload: { consent_document_hash: "hash-f5-v1" }
              as: ParentGuardian
              as_user_id: "${enr_f5_id}"
            - call: "POST /cbb/storage-accounts"
              payload: { enrollment_id: "${enr_f5_id}", billing_contact_email: "f5@example.com", plan_term_years: 5, prepaid_through_date: "2027-06-30" }
              as: BillingAdministrator
              captures: { acct_f5_id: "$.data.id" }
            - call: "POST /cbb/collection-kits"
              payload: { enrollment_id: "${enr_f5_id}", kit_lot_code: "LOT-2026-B", courier_tracking_code: "TRK-0002" }
              as: IntakeCoordinator
              captures: { kit_f5_id: "$.data.id" }
            - call: "POST /cbb/enrollments"
              payload: { program_type: "PRIVATE_FAMILY", primary_parent_name: "One Year Parent", expected_delivery_date: "2026-08-10", collection_site_code: "SITE-01" }
              as: IntakeCoordinator
              captures: { enr_f1_id: "$.data.id" }
            - call: "POST /cbb/enrollments/${enr_f1_id}/consent"
              payload: { consent_document_hash: "hash-f1-v1" }
              as: ParentGuardian
              as_user_id: "${enr_f1_id}"
            - call: "POST /cbb/storage-accounts"
              payload: { enrollment_id: "${enr_f1_id}", billing_contact_email: "f1@example.com", plan_term_years: 1, prepaid_through_date: "2027-06-30" }
              as: BillingAdministrator
