            - "RouteSegment.${seg1}.crew_capacity == 12"

      - name: escrow_tier_one_cent_below_tier_2_floor_stays_tier_1
        grounds:
          - calculations.mitigation_escrow_requirement
          - entities.Certificate.fields.escrow_tier
          - endpoints[POST /siting/applications/{applicationId}/decision]
        distinguishing_aspect: |
          A third metric (a whole-cent tier floor) on a third endpoint: mitigation_base_cents
          499999999 is one cent below TIER_2_FLOOR 500000000, so the rate stays 0.10 and
          escrow_required_cents is 554999999 (contingency 50000000 after ROUND_HALF_UP of
          49999999.9); a base of exactly 500000000 crosses into TIER_2 at 0.14 and yields 575000000 —
          a 20000001-cent jump across one cent of input.
        test_recipe:
