              as: LPAnalyst
              as_user_id: ana-1
            - call: "POST /cases/${cx}/advance"
              payload: {}
              as: LPAnalyst
              as_user_id: ana-1
          trigger:
            - call: "POST /cases/${ce}/adjudicate"
              payload: { decision: "UNSUBSTANTIATED" }
              as: LPManager
              as_user_id: mgr-1
              captures: { err1: $.data.error_id }
            - call: "POST /cases/${cx}/adjudicate"
              payload: { decision: "UNSUBSTANTIATED" }
              as: HRPartner
              as_user_id: hr-1
              captures: { err2: $.data.error_id }
            - call: "POST /cases/${ce}/adjudicate"
              payload: { decision: "UNSUBSTANTIATED" }
              as: HRPartner
              as_user_id: hr-1
            - call: "POST /cases/${cx}/adjudicate"
              payload: { decision: "UNSUBSTANTIATED" }
              as: LPManager
              as_user_id: mgr-1
          assert:
            - "err1 == ERR_FORBIDDEN_FOR_ROLE  # LPManager may not adjudicate EMPLOYEE cases"
            - "err2 == ERR_FORBIDDEN_FOR_ROLE  # HRPartner may not adjudicate EXTERNAL cases"
            - "HRPartner on CE succeeds: Case.${ce}.status == CLOSED_UNSUBSTANTIATED"
            - "LPManager on CX succeeds: Case.${cx}.status == CLOSED_UNSUBSTANTIATED"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_demand_create_stale_case_version_and_supersede
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[demand-create-stale-case]", "endpoints[POST /civil-demands]"]
        distinguishing_aspect: "OCC on Case.version: first draft with the observed version succeeds (201) and bumps the version; a second draft carrying the SAME stale version fails ERR_STALE_CASE_VERSION (412); a draft carrying the fresh version succeeds and auto-CANCELS the first draft (legitimate supersede)."
        test_recipe:
          setup: ["Store S1; EXTERNAL case CX (loss 10000) INTERVIEWED; version captured"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_number: "S400", name: "Store 400", region_code: "R1" }
              as: LPAdmin
              as_user_id: adm-1
              captures: { s1: $.data.id }
            - call: "POST /cases"
              payload: { store_id: "${s1}", subject_type: "EXTERNAL", manual_loss_cents: 10000 }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { cx: $.data.id }
            - call: "POST /cases/${cx}/assign"
              payload: { analyst_id: "ana-1" }
              as: LPManager
              as_user_id: mgr-1
            - call: "POST /evidence-items"
              payload: { case_id: "${cx}", evidence_type: "PHOTO", captured_at: "2026-07-15T10:00:00Z", retention_class: "STANDARD" }
              as: LPAnalyst
              as_user_id: ana-1
            - call: "POST /cases/${cx}/advance"
              payload: {}
              as: LPAnalyst
              as_user_id: ana-1
            - call: "POST /interviews"
              payload: { case_id: "${cx}", interviewer_id: "ana-1", scheduled_start: "2026-08-02T09:00:00Z", scheduled_end: "2026-08-02T10:00:00Z" }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { iv: $.data.id }
            - call: "POST /interviews/${iv}/record-outcome"
              payload: { outcome: "ADMITTED" }
              as: LPAnalyst
              as_user_id: ana-1
            - call: "POST /interviews/${iv}/document"
              payload: { notes: "done" }
              as: LPAnalyst
              as_user_id: ana-1
            - call: "GET /cases/${cx}"
              as: LPManager
              as_user_id: mgr-1
              captures: { cx_v: $.data.version }
          trigger:
            - call: "POST /civil-demands"
              payload: { case_id: "${cx}", basis: "ACTUAL_LOSS", expected_case_version: "${cx_v}" }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { d1: $.data.id }
            - call: "POST /civil-demands"
              payload: { case_id: "${cx}", basis: "ACTUAL_LOSS", recovery_cost_cents: 2500, expected_case_version: "${cx_v}" }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { err: $.data.error_id }
            - call: "GET /cases/${cx}"
              as: LPManager
              as_user_id: mgr-1
              captures: { cx_v2: $.data.version }
            - call: "POST /civil-demands"
              payload: { case_id: "${cx}", basis: "ACTUAL_LOSS", recovery_cost_cents: 2500, expected_case_version: "${cx_v2}" }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { d2: $.data.id }
            - call: "GET /civil-demands/${d1}"
              as: LPManager
              as_user_id: mgr-1
              captures: { d1_status: $.data.status }
          assert:
            - "err == ERR_STALE_CASE_VERSION (HTTP 412)  # two strictly sequential requests, deterministic"
            - "fresh-version create succeeds: CivilDemand.${d2}.status == DRAFT"
            - "d1_status == CANCELLED  # superseded by the newer draft"
            - "Case.${cx}.version advanced by exactly 1 per successful demand create"

      - name: occ_record_count_stale_period_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[count-record-stale-period]", "endpoints[POST /shrink-periods/{period_id}/record-count]"]
        distinguishing_aspect: "OCC on ShrinkPeriod.version: a recount carrying the creation version after a successful count fails ERR_STALE_PERIOD_VERSION (412); carrying the post-count version succeeds and supersedes counted_inventory_cents."
        test_recipe:
          setup: ["Store S1; period P1 OPEN, version captured at creation"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_number: "S401", name: "Store 401", region_code: "R1" }
              as: LPAdmin
              as_user_id: adm-1
              captures: { s1: $.data.id }
            - call: "POST /shrink-periods"
              payload: { store_id: "${s1}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-09-30T23:59:59Z", book_inventory_cents: 5000000, period_sales_cents: 4000000 }
              as: LPAdmin
              as_user_id: adm-1
              captures: { p1: $.data.id, p1_v: $.data.version }
          trigger:
            - call: "POST /shrink-periods/${p1}/record-count"
              payload: { counted_inventory_cents: 4950000, expected_shrink_period_version: "${p1_v}" }
              as: LPAdmin
              as_user_id: adm-1
              captures: { p1_v2: $.data.version }
            - call: "POST /shrink-periods/${p1}/record-count"
              payload: { counted_inventory_cents: 4940000, expected_shrink_period_version: "${p1_v}" }
              as: LPAdmin
              as_user_id: adm-1
              captures: { err: $.data.error_id }
            - call: "POST /shrink-periods/${p1}/record-count"
              payload: { counted_inventory_cents: 4940000, expected_shrink_period_version: "${p1_v2}" }
              as: LPAdmin
              as_user_id: adm-1
          assert:
            - "err == ERR_STALE_PERIOD_VERSION (HTTP 412)"
            - "p1_v2 == ${p1_v} + 1  # version increments exactly once per mutation"
            - "final recount succeeds: ShrinkPeriod.${p1}.counted_inventory_cents == 4940000 and status == COUNTED"

      - name: cascading_side_effects_layer
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: transitive_cascade / payment_return_cascade_depth4
          rationale: "Depth-4 cascade asserted end-to-end in the named §1.8 instance; case_link_confirm_cascade_depth3 covers the second cascade pattern."

      - name: dual_variant_calculation_layer
        claim_type: dual_variant_calculation
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: dual_variant_calc / civil_demand_statutory_vs_actual_loss_same_inputs
          rationale: "Both-variant divergence with literal expected values asserted there and in shrink_accrual_case_posted_vs_sales_ratio_same_period."

      - name: rate_threshold_triggers_layer
        claim_type: rate_threshold_triggers
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: boundary_precision_check / alert_escalation_exactly_75_vs_74
          rationale: "Cumulative threshold crossing at the exact boundary asserted in the named §1.8 instance; ORC conjunctive thresholds in orc_escalation_three_input_conjunction_at_boundary."

      - name: derived_field_reconciliation_layer
        claim_type: derived_field_reconciliation
        grounds: [complexity_profile.complexity_layers, entities.ShrinkPeriod.fields.known_loss_posted_cents]
        excluded_because:
          difficulty_instance: non_linear_state_machine / case_reopen_cycle_reverses_and_reposts_loss
          rationale: "Derived-field reversal and re-derivation across the reopen cycle asserted there."

