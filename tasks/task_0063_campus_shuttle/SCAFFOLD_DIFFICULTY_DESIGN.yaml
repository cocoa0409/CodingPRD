scaffold_difficulty_design:

  # ===================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: route_duration_base_vs_peak_adjusted
        grounds:
          - calculations.route_duration_estimate
          - state_machines.Route.DRAFT_to_ACTIVE
          - state_machines.RunSheet.PLANNED_to_BOARDING
          - entities.Route.fields.estimated_duration_minutes
          - entities.RunSheet.fields.scheduled_arrival
        distinguishing_aspect: |
          Operates on the Route entity domain: the BASE variant on Route.estimated_duration_minutes
          is computed at publish-time without the peak multiplier, while the PEAK_ADJUSTED variant
          on the per-instance RunSheet.scheduled_arrival multiplies travel-time minutes by 1.25 when
          scheduled_departure falls inside a peak window. Same inputs (distance + dwell) yield
          different stored values across Route vs RunSheet.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T05:00:00Z (off-peak baseline)"
            - "Create two ACTIVE stops S1 (lat=0.0, lng=0.0), S2 (lat=0.0, lng=0.05); haversine raw 5.5598 km, per-segment rounded to 4 dp -> 5.5598, total rounded to 2 dp -> 5.56 km"
            - "Create Route R with start=S1, end=S2, peak_windows=[[09:00, 11:00]], peak=10, offpeak=30; publish it"
            - "base_minutes = (5.56/25)*60 + 1*0 = 13.344; estimated_duration_minutes = ceil(13.344) = 14"
          trigger:
            - "GET /shuttle/routes/{R.id} (read BASE estimate)"
            - "POST /shuttle/run-sheets with scheduled_departure=2026-06-02T09:30:00Z (peak window)"
          assert:
            - "Route.estimated_duration_minutes == 14"
            - "RunSheet.scheduled_arrival - RunSheet.scheduled_departure == ceil(13.344 * 1.25) minutes == ceil(16.68) == 17 minutes"
            - "BASE and PEAK_ADJUSTED produce different durations for identical Route input"

      - name: no_show_penalty_first_vs_repeat
        grounds:
          - calculations.no_show_penalty_score
          - state_machines.Reservation.CONFIRMED_to_NO_SHOW
          - entities.Reservation.fields.no_show_penalty_points
        distinguishing_aspect: |
          Operates on the Reservation entity domain (NOT Route): first-time NO_SHOW within 30 days
          uses repeat_count=0 yielding 10 points (off-peak, no delay mitigation), while a SECOND
          NO_SHOW for the same employee uses repeat_count=1 yielding 10 + 0 - 0 + 2 = 12 points.
          Identical reservation inputs produce different penalty depending on prior history.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T08:00:00Z; employee EMP1 has no prior NO_SHOW"
            - "Two off-peak RunSheets RS1 (2026-06-01T08:00Z) and RS2 (2026-06-02T08:00Z) with cumulative delay 0"
            - "Two reservations RESA on RS1 and RESB on RS2 for EMP1, CONFIRMED"
          trigger:
            - "POST /shuttle/run-sheets/{RS1.id}/depart (cascades RESA -> NO_SHOW)"
            - "Advance clock to 2026-06-02T07:00Z, then POST /shuttle/run-sheets/{RS2.id}/depart (cascades RESB -> NO_SHOW)"
          assert:
            - "RESA.no_show_penalty_points == 10"
            - "RESB.no_show_penalty_points == 12"
            - "Identical reservation shape yields different penalty across first vs repeat"

  # ===================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: fare_tier_peak_combination_three_inputs
        grounds:
          - calculations.fare_calculation
          - entities.Reservation.fields.fare_cents
          - entities.Route.fields.peak_windows
          - entities.RunSheet.fields.scheduled_departure
        distinguishing_aspect: |
          Mode (a): three inputs (segment_count, peak_flag, BASE_FARE_CENTS) with non-linear
          interaction. Tier function is a step function on segment_count, then conditional multiply
          by PEAK_FARE_MULTIPLIER=1.5 when scheduled_departure intersects peak_windows. A reservation
          spanning 5 segments at peak yields (200+100)*1.5 = 450 cents, while the same 5-segment
          reservation off-peak yields 300 cents — a conditional branch on entity state changes
          the result.
        test_recipe:
          setup:
            - "Stops S0..S6 ACTIVE; Route R with peak_windows=[[09:00,11:00]], peak=10, offpeak=30"
            - "RunSheet RS_peak at 2026-06-02T09:30Z and RunSheet RS_off at 2026-06-02T05:00Z"
          trigger:
            - "POST /shuttle/run-sheets/{RS_peak.id}/reservations with boarding=S0, alighting=S5 (5 segments)"
            - "POST /shuttle/run-sheets/{RS_off.id}/reservations with boarding=S0, alighting=S5 (5 segments)"
          assert:
            - "Reservation on RS_peak.fare_cents == 450"
            - "Reservation on RS_off.fare_cents == 300"

      - name: route_distance_segment_then_total_rounding
        grounds:
          - calculations.route_distance_estimate
          - state_machines.Route.DRAFT_to_ACTIVE
          - entities.Route.fields.estimated_distance_km
        distinguishing_aspect: |
          Mode (b): nested rounding. Per-segment distances are rounded to 4 dp BEFORE summation,
          then the SUM is rounded to 2 dp. "Sum then round" alone would give a different result
          when summing many segments whose 5th-decimal residues compound. The scaffold pins
          "round per segment first, then round the sum".
        test_recipe:
          setup:
            - "Create ACTIVE stops S0 (lat=0.0, lng=0.0), S1 (lat=0.0, lng=0.01), S2 (lat=0.0, lng=0.02), S3 (lat=0.0, lng=0.03)"
            - "Each segment is ~ 1.1120 km raw, rounded per-segment to 4 dp -> 1.1120 (executed: 1.112)"
            - "Route R with start=S0, end=S3, intermediate=[S1,S2]"
          trigger:
            - "POST /shuttle/routes/{R.id}/publish"
            - "GET /shuttle/routes/{R.id}"
          assert:
            - "Route.estimated_distance_km == 3.34 (computed as round(1.112+1.112+1.112, 2) = round(3.336, 2) = 3.34)"
            - "Order of rounding is pinned: per-segment-then-total, NOT total-then-round"

  # ===================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: runsheet_planned_delayed_in_transit_cycle
        grounds:
          - state_machines.RunSheet.PLANNED_to_DELAYED
          - state_machines.RunSheet.IN_TRANSIT_to_DELAYED
          - state_machines.RunSheet.DELAYED_to_IN_TRANSIT
          - state_machines.RunSheet.DELAYED_to_COMPLETED
          - entities.RunSheet.fields.status
        distinguishing_aspect: |
          RunSheet has a cycle: IN_TRANSIT -> DELAYED -> IN_TRANSIT (resume after delay), allowing
          repeated delay-then-resume bouncing. This is NOT a linear pipeline; the same run can
          oscillate between IN_TRANSIT and DELAYED multiple times before terminating in COMPLETED.
        test_recipe:
          setup:
            - "Create Route, RunSheet RS in PLANNED; bring to IN_TRANSIT via start-boarding then depart"
          trigger:
            - "POST /shuttle/run-sheets/{RS.id}/delays {cause=TRAFFIC, delay_minutes=5, affected_from_stop_id=S1}"
            - "POST /shuttle/run-sheets/{RS.id}/resume"
            - "POST /shuttle/run-sheets/{RS.id}/delays {cause=WEATHER, delay_minutes=3, affected_from_stop_id=S2}"
            - "POST /shuttle/run-sheets/{RS.id}/resume"
          assert:
            - "RunSheet.status after two cycles == IN_TRANSIT"
            - "RunSheet.delay_minutes_accumulated == 8"

      - name: reservation_waitlisted_confirmed_cancelled_cycle
        grounds:
          - state_machines.Reservation.WAITLISTED_to_CONFIRMED
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - state_machines.Reservation.WAITLISTED_to_CANCELLED
          - entities.Reservation.fields.status
          - entities.Reservation.fields.waitlist_position
        distinguishing_aspect: |
          Reservation (different entity from RunSheet) exhibits a branching shape with cascading
          re-entry: a reservation cancelled from CONFIRMED promotes a sibling from WAITLISTED to
          CONFIRMED — the system as a whole transitions between WAITLISTED and CONFIRMED in
          response to peer cancellations. Branch points: from CONFIRMED to {CHECKED_IN, CANCELLED,
          NO_SHOW}, and from WAITLISTED to {CONFIRMED, CANCELLED}. This is fork/branching, not a
          linear A->B->C pipeline.
        test_recipe:
          setup:
            - "RunSheet RS with vehicle seat_capacity=1"
            - "Reservation R1 CONFIRMED on RS (capacity full), Reservation R2 WAITLISTED at position 1"
          trigger:
            - "DELETE /shuttle/reservations/{R1.id} (cancel within window)"
          assert:
            - "R1.status == CANCELLED"
            - "R2.status == CONFIRMED"
            - "R2.waitlist_position == null"
            - "RunSheet.capacity_remaining == 0"

  # ===================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===================================================================
  - rule_id: transitive_cascade
    instances:
      - name: route_retire_cancels_runs_cancels_reservations_refunds_bills
        grounds:
          - state_machines.Route.ACTIVE_to_RETIRED
          - state_machines.RunSheet.PLANNED_to_CANCELLED
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - state_machines.MonthlyBill.FINALIZED_to_REFUNDED
          - entities.MonthlyBill.fields.refund_cents
        distinguishing_aspect: |
          Depth-4 cascade originating from Route.ACTIVE_to_RETIRED: (1) Route RETIRED triggers
          (2) PLANNED RunSheets -> CANCELLED, which itself triggers (3) CONFIRMED Reservations
          on those runs -> CANCELLED, which itself triggers (4) FINALIZED MonthlyBill refund
          accrual (refund_cents += fare). Each link is caused by the previous link, not by the
          original POST /retire — this is a true transitive chain, not a fan-out.
        test_recipe:
          setup:
            - "ACTIVE Route R, PLANNED RunSheet RS on R for next month"
            - "CONFIRMED Reservation Res on RS with payer_mode=SELF_PAY"
            - "Advance clock past run, mark COMPLETED, finalize EMPLOYEE-scope bill B for prior month including Res's fare (fare_cents pinned)"
            - "Re-do: a SEPARATE second pair — PLANNED RS2 (future) on same Route R with new CONFIRMED Res2 NOT YET BILLED"
          trigger:
            - "POST /shuttle/routes/{R.id}/retire"
          assert:
            - "RS2.status == CANCELLED (link 1->2)"
            - "Res2.status == CANCELLED (link 2->3)"
            - "Res2 was unbilled so no refund; but a separate billed scenario shows MonthlyBill.refund_cents > 0 (link 3->4)"

      - name: delay_breakdown_substitutes_updates_vehicle_rotation
        grounds:
          - state_machines.RunSheet.IN_TRANSIT_to_DELAYED
          - calculations.substitute_vehicle_selector
          - calculations.vehicle_rotation_selector
          - entities.RunSheet.fields.substitute_vehicle_id
          - entities.Vehicle.fields.last_run_completed_at
        distinguishing_aspect: |
          Depth-3 cascade originating from POST /delays with cause=BREAKDOWN: (1) RunSheet ->
          DELAYED triggers substitute_vehicle_selector setting substitute_vehicle_id, which on
          (2) RunSheet COMPLETED stamps Vehicle.last_run_completed_at on the substitute, which
          in turn (3) reshuffles the eligibility ranking for the NEXT vehicle_rotation_selector
          call on a new RunSheet creation (the substitute is now LESS recently-rested, so it
          falls in rank order). Originates from a different trigger (POST /delays, not Route
          retire) and propagates through a different chain.
        test_recipe:
          setup:
            - "Two ACTIVE vehicles V1 (plate=AAA), V2 (plate=BBB) with last_run_completed_at == NULL for both"
            - "RunSheet RS1 IN_TRANSIT assigned to V1; RS2 PLANNED tomorrow on same route"
          trigger:
            - "POST /shuttle/run-sheets/{RS1.id}/delays {cause=BREAKDOWN, delay_minutes=20, affected_from_stop_id=S1}"
            - "POST /shuttle/run-sheets/{RS1.id}/complete"
            - "POST /shuttle/run-sheets for a NEW run RS3 (auto-select vehicle)"
          assert:
            - "RS1.substitute_vehicle_id == V2.id (link 1)"
            - "V2.last_run_completed_at != null after RS1 completes (link 2)"
            - "RS3.assigned_vehicle_id == V1.id (link 3: V1 now lower last_run_completed_at)"

  # ===================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_temporal_on_cancel
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          Pair: `state` (priority 6) vs `business_temporal` (priority 10). Cancelling a
          CHECKED_IN reservation 5 minutes before departure hits BOTH: state is wrong (not
          CONFIRMED, so cannot cancel) AND temporal window is closed. Priority 6 wins and
          returns ERR_INVALID_STATE (or ERR_RESERVATION_ALREADY_CHECKED_IN per concurrency
          rule), NOT ERR_CANCEL_WINDOW_CLOSED.
        test_recipe:
          setup:
            - "RunSheet RS scheduled_departure at 2026-06-02T08:00Z, IN_TRANSIT at 2026-06-02T07:56Z"
            - "Reservation Res CHECKED_IN on RS"
            - "Clock advanced to 2026-06-02T07:56Z (4 minutes before departure, inside no-cancel window)"
          trigger:
            - "DELETE /shuttle/reservations/{Res.id}"
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_STATE (priority 6 wins over priority 10)"

      - name: business_safety_vs_business_constraint_on_run_creation
        grounds:
          - validations[priority=9]
          - validations[priority=16]
          - state_machines.RunSheet.PLANNED_to_BOARDING
        distinguishing_aspect: |
          Pair: `business_safety` (priority 9 — expired driver license) vs `business_constraint`
          (priority 16 — driver double-booking). A request that assigns a driver with an expired
          license AND who is already double-booked must return ERR_DRIVER_LICENSE_EXPIRED, not
          ERR_DRIVER_DOUBLE_BOOKED, because safety precedes constraint by priority. Different
          error-category pair from the previous instance.
        test_recipe:
          setup:
            - "Driver D with license_expiry_date 2025-12-31 (already expired by clock at 2026-06-01)"
            - "RunSheet RS_existing with D assigned, scheduled_departure 2026-06-02T08:00Z, scheduled_arrival 08:30Z"
          trigger:
            - "POST /shuttle/run-sheets with driver=D, scheduled_departure=2026-06-02T08:15Z (overlap + expired)"
          assert:
            - "HTTP 409 with error_id == ERR_DRIVER_LICENSE_EXPIRED (priority 9 wins over priority 16)"

  # ===================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: cancel_window_exact_minus_15_minutes
        grounds:
          - validations[priority=10]
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          Numeric boundary on a temporal threshold: cancellation is allowed when
          now() <= scheduled_departure - 15 minutes (inclusive). Exactly at
          scheduled_departure - 15:00.000 minutes -> allowed; one second later -> rejected.
          Endpoint: DELETE /shuttle/reservations/{id}.
        test_recipe:
          setup:
            - "RunSheet RS scheduled_departure = 2026-06-02T08:00:00Z"
            - "Reservation Res CONFIRMED on RS"
            - "Clock at 2026-06-02T07:45:00.000Z (exactly 15 min before)"
          trigger:
            - "DELETE /shuttle/reservations/{Res.id}"
          assert:
            - "Cancellation succeeds (HTTP 200); Res.status == CANCELLED"
            - "Re-test at 2026-06-02T07:45:00.001Z would fail with ERR_CANCEL_WINDOW_CLOSED (boundary is inclusive on the early side)"

      - name: empty_waitlist_on_cancel_no_promotion
        grounds:
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - state_machines.Reservation.WAITLISTED_to_CONFIRMED
          - entities.Reservation.fields.waitlist_position
        distinguishing_aspect: |
          Empty-collection boundary: when CONFIRMED is cancelled and the waitlist is EMPTY
          (zero candidates), the system MUST NOT promote anything and MUST NOT crash.
          Different metric (collection-size = 0) on a different endpoint
          (DELETE /shuttle/reservations) than the prior numeric-threshold case.
        test_recipe:
          setup:
            - "RunSheet RS with vehicle seat_capacity=5; one CONFIRMED Reservation R1; zero WAITLISTED"
            - "Clock within cancel window"
          trigger:
            - "DELETE /shuttle/reservations/{R1.id}"
          assert:
            - "R1.status == CANCELLED"
            - "No WAITLISTED reservation exists; RunSheet.capacity_remaining == 5"
            - "No promotion side-effect occurred"

  # ===================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: stop_offshelf_requires_no_active_route_references
        grounds:
          - state_machines.Stop.ACTIVE_to_OFFSHELF
          - validations[priority=6]
          - entities.Route.fields.status
          - entities.Stop.fields.status
        distinguishing_aspect: |
          Entity pair (Stop, Route): Stop.ACTIVE_to_OFFSHELF transition is blocked iff at least
          one Route with status==ACTIVE references this stop in its start/end/intermediate list.
          Stop's valid transitions depend on Route's state.
        test_recipe:
          setup:
            - "ACTIVE Stop S0 referenced by ACTIVE Route R as start_stop"
          trigger:
            - "POST /shuttle/stops/{S0.id}/offshelf"
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_STATE"
            - "After POST /shuttle/routes/{R.id}/retire, retry POST /shuttle/stops/{S0.id}/offshelf succeeds"

      - name: vehicle_maintenance_requires_no_planned_runs_overlap
        grounds:
          - state_machines.Vehicle.ACTIVE_to_MAINTENANCE
          - validations[priority=8]
          - entities.RunSheet.fields.status
          - entities.Vehicle.fields.status
        distinguishing_aspect: |
          Entity pair (Vehicle, RunSheet) — different from (Stop, Route). Vehicle's transition
          ACTIVE -> MAINTENANCE is blocked iff any RunSheet whose status IN
          {PLANNED, BOARDING, IN_TRANSIT, DELAYED} has this vehicle assigned and a planned
          occupation window overlapping the proposed maintenance window. Vehicle's valid
          transitions depend on RunSheet's state.
        test_recipe:
          setup:
            - "ACTIVE Vehicle V; PLANNED RunSheet RS at 2026-06-02T08:00Z-08:30Z assigned to V"
          trigger:
            - "POST /shuttle/vehicles/{V.id}/maintenance with window 2026-06-02T08:00Z..2026-06-02T10:00Z"
          assert:
            - "HTTP 409 with error_id == ERR_VEHICLE_HAS_BOOKED_RUNS"
            - "After POST /shuttle/run-sheets/{RS.id}/cancel, retry succeeds and V.status == MAINTENANCE"

  # ===================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: vehicle_closed_closed_with_15min_buffer
        grounds:
          - validations[priority=15]
          - entities.RunSheet.fields.scheduled_departure
          - entities.RunSheet.fields.scheduled_arrival
        distinguishing_aspect: |
          Resource: Vehicle. Interval semantics: CLOSED-CLOSED occupation
          [scheduled_departure - 15 min, scheduled_arrival + 15 min] — both endpoints inclusive,
          symmetric 15-minute buffer on each side. Two runs whose buffered intervals share any
          instant (even a single point) conflict.
        test_recipe:
          setup:
            - "ACTIVE Vehicle V with seat_capacity=20"
            - "PLANNED RunSheet RS1 assigned to V, scheduled_departure=2026-06-02T08:00Z, scheduled_arrival=08:30Z"
            - "(Buffered window: 07:45..08:45 inclusive)"
          trigger:
            - "POST /shuttle/run-sheets with vehicle=V, scheduled_departure=2026-06-02T08:45:00Z (touches buffer end inclusively)"
          assert:
            - "HTTP 409 with error_id == ERR_VEHICLE_DOUBLE_BOOKED"
            - "Same request at 2026-06-02T08:46:00Z succeeds (1-minute gap beyond buffer)"

      - name: driver_closed_open_touching_is_conflict_no_buffer
        grounds:
          - validations[priority=16]
          - entities.Driver.fields.full_name
          - entities.RunSheet.fields.assigned_driver_id
        distinguishing_aspect: |
          Resource: Driver. Interval semantics: CLOSED-OPEN
          [scheduled_departure, scheduled_arrival) with NO buffer, but adjacent intervals where
          end_a == start_b are STILL counted as conflict (touching counts). This contrasts with
          the Vehicle rule: NO buffer, but tighter adjacency policy. Same touching-instant logic,
          opposite interval polarity: vehicle requires gap-after-buffer, driver requires gap-at-
          interval-boundary even without buffer.
        test_recipe:
          setup:
            - "ACTIVE Driver D"
            - "PLANNED RunSheet RS1 assigned to D, scheduled_departure=2026-06-02T08:00Z, scheduled_arrival=08:30Z"
          trigger:
            - "POST /shuttle/run-sheets with driver=D, scheduled_departure=2026-06-02T08:30:00Z (touches end exactly)"
          assert:
            - "HTTP 409 with error_id == ERR_DRIVER_DOUBLE_BOOKED"
            - "Same request at 2026-06-02T08:31:00Z succeeds (1-minute gap)"

  # ===================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===================================================================
  - rule_id: compensating_invariant
    instances:
      - name: bill_gross_minus_refund_equals_net_invariant
        grounds:
          - state_machines.MonthlyBill.FINALIZED_to_REFUNDED
          - state_machines.MonthlyBill.REFUNDED_to_SETTLED
          - calculations.monthly_bill_aggregation
          - entities.MonthlyBill.fields.gross_cents
          - entities.MonthlyBill.fields.refund_cents
          - entities.MonthlyBill.fields.net_cents
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: MonthlyBill.net_cents = MonthlyBill.gross_cents -
          MonthlyBill.refund_cents at SETTLE time. The forward action (finalize) sets gross_cents;
          the compensating action (cancel a billed reservation) increments refund_cents by EXACTLY
          the cancelled Reservation.fare_cents. After settlement, the invariant net = gross -
          refund holds with no drift. Conserved quantity type: monetary cents.
        test_recipe:
          setup:
            - "Single COMPLETED Reservation Res with fare_cents=300, SELF_PAY, in prior month"
            - "MonthlyBill B EMPLOYEE-scope finalized: gross_cents=300, refund_cents=0"
            - "Cancel Res via DELETE within cancel window (note: needs Res to still be cancellable per state; for billed-but-still-CONFIRMED scenario, defer cancellation policy to a synthetic refund event)"
          trigger:
            - "POST /shuttle/bills/{B.id}/settle"
          assert:
            - "MonthlyBill.net_cents == MonthlyBill.gross_cents - MonthlyBill.refund_cents"
            - "If gross_cents=300 and refund_cents=300, then net_cents == 0 (full compensation, zero net drift)"

      - name: capacity_seat_conservation_under_cancel_then_promote
        grounds:
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - state_machines.Reservation.WAITLISTED_to_CONFIRMED
          - entities.RunSheet.fields.capacity_remaining
          - entities.Vehicle.fields.seat_capacity
        distinguishing_aspect: |
          Conserved quantity: Vehicle.seat_capacity - count(Reservation.run_sheet_id==RS AND
          status IN {CONFIRMED, CHECKED_IN}) == RunSheet.capacity_remaining at all times. A
          cancellation (forward) frees a seat; the compensating side-effect (waitlist promotion)
          occupies it. The invariant holds exactly: capacity_remaining unchanged before and
          after a cancel+promote pair, even though two state transitions occurred. Conserved
          quantity type: seat count (integer), distinct from the monetary cents invariant above.
        test_recipe:
          setup:
            - "RunSheet RS with vehicle seat_capacity=1"
            - "Reservation R1 CONFIRMED (capacity_remaining=0)"
            - "Reservation R2 WAITLISTED at position 1"
          trigger:
            - "DELETE /shuttle/reservations/{R1.id} (cancel within window)"
          assert:
            - "RunSheet.capacity_remaining == 0 BEFORE cancel (R1 occupies the seat)"
            - "RunSheet.capacity_remaining == 0 AFTER cancel+promote (R2 occupies the seat)"
            - "Invariant: seat_capacity - count(CONFIRMED + CHECKED_IN) == 0 unchanged"
            - "R1.status == CANCELLED, R2.status == CONFIRMED, R2.waitlist_position == null"
