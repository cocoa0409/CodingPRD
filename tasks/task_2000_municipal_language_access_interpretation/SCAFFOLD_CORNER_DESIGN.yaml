              as_user_id: "officer-7"
          assert:
            - "Complaint.${complaint_id}.recorded_by_user_id == \"officer-9\""
            - "First adjudicate: error_id == ERR_SEGREGATION_OF_DUTIES_VIOLATION (HTTP 403)"
            - "Second adjudicate (different officer): Complaint.${complaint_id}.status == SUBSTANTIATED and adjudicated_by_user_id == \"officer-7\""

  # ===========================================================================
  - section: complexity_layers
    instances:
      - name: occ_department_patch_stale_and_fresh
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[department-patch-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Department.version: create returns version 1; PATCH with expected 1 succeeds (version 2); replaying expected 1 -> 412 ERR_STALE_VERSION; PATCH with the fresh version 2 succeeds (version 3)."
        test_recipe:
          setup: ["Department D created (version 1)"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dept OCC", service_area_code: "SA-C39", annual_budget_cents: 100000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id, dept_v: $.data.version }
          trigger:
            - call: "PATCH /departments/${dept_id}"
              payload: { signage_status: "DEFICIENT", expected_department_version: "${dept_v}" }
              as: LanguageAccessCoordinator
              captures: { dept_v2: $.data.version }
            - call: "PATCH /departments/${dept_id}"
              payload: { signage_status: "CURRENT", expected_department_version: "${dept_v}" }
              as: LanguageAccessCoordinator
              captures: { err: $.data.error_id }
            - call: "PATCH /departments/${dept_id}"
              payload: { signage_status: "CURRENT", expected_department_version: "${dept_v2}" }
              as: LanguageAccessCoordinator
          assert:
            - "First PATCH: 200, version == 2, signage_status == DEFICIENT"
            - "Second PATCH (stale ${dept_v} == 1): error_id == ERR_STALE_VERSION (HTTP 412), signage_status unchanged DEFICIENT"
            - "Third PATCH (fresh ${dept_v2} == 2): 200, version == 3, signage_status == CURRENT"

      - name: dispatch_tie_break_earliest_created_at
        claim_type: selector_policy
        grounds: [calculations.interpreter_dispatch_selection]
        distinguishing_aspect: "Two equally-ranked candidates (both 0 minutes_current_month) are ordered by created_at ASC: X created at clock T beats Y created at T+60s — the deterministic tie-break decides the assignment."
        test_recipe:
          setup: ["Department D budget 1000000; contract ACTIVE (phone 50c/min); X created at 2026-08-01T00:00:00Z; clock advanced 60s; Y created; both REGISTERED [es] [PHONE] conf current"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dept Tie", service_area_code: "SA-C40", annual_budget_cents: 1000000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
            - call: "POST /vendor-contracts"
              payload: { vendor_name: "VendorTie", ceiling_cents: 500000, phone_per_minute_cents: 50, video_per_minute_cents: 75, in_person_per_minute_cents: 100, translation_per_word_cents: 20, in_person_travel_flat_cents: 2500 }
              as: LanguageAccessCoordinator
              captures: { contract_id: $.data.id }
            - call: "POST /vendor-contracts/${contract_id}/activate"
              as: LanguageAccessCoordinator
            - call: "POST /interpreters"
              payload: { full_name: "Zed First", language_codes: ["es"], modalities: ["PHONE"], tier: "REGISTERED", vendor_contract_id: "${contract_id}" }
              as: LanguageAccessCoordinator
              captures: { x_id: $.data.id }
            - call: "PATCH /interpreters/${x_id}"
              payload: { confidentiality_signed: true }
              as: LanguageAccessCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:01:00Z" }
              as: LanguageAccessCoordinator
            - call: "POST /interpreters"
              payload: { full_name: "Aaron Second", language_codes: ["es"], modalities: ["PHONE"], tier: "REGISTERED", vendor_contract_id: "${contract_id}" }
              as: LanguageAccessCoordinator
              captures: { y_id: $.data.id }
            - call: "PATCH /interpreters/${y_id}"
              payload: { confidentiality_signed: true }
              as: LanguageAccessCoordinator
          trigger:
            - call: "POST /interpretation-requests"
              payload: { department_id: "${dept_id}", language_code: "es", modality: "PHONE", encounter_setting: "GENERAL", scheduled_duration_minutes: 30 }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { req_id: $.data.id }
          assert:
            - "InterpretationRequest.${req_id}.status == ASSIGNED and interpreter_id == ${x_id} (earliest created_at wins over ${y_id})"
            - "InterpretationRequest.${req_id}.estimated_cost_cents == 1500 (30 min x 50c x 1.0 REGISTERED)"

      - name: dispatch_empty_pool_unfulfilled_with_penalty
        claim_type: selector_policy
        grounds: [calculations.interpreter_dispatch_selection, calculations.department_compliance_score, state_machines.InterpretationRequest.NEW_to_UNFULFILLED]
        distinguishing_aspect: "Empty-pool fallback: no interpreter covers 'fr' at all -> 201 with status UNFULFILLED, interpreter_id null, and the department absorbs a -50 compliance event (score 950)."
        test_recipe:
          setup: ["Department D exists; zero interpreters in the system"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dept Empty", service_area_code: "SA-C41", annual_budget_cents: 100000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
          trigger:
            - call: "POST /interpretation-requests"
              payload: { department_id: "${dept_id}", language_code: "fr", modality: "PHONE", encounter_setting: "GENERAL", scheduled_duration_minutes: 30 }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { req_id: $.data.id }
          assert:
            - "InterpretationRequest.${req_id}.status == UNFULFILLED and interpreter_id == null and estimated_cost_cents == null"
            - "Department.${dept_id}.compliance_score == 950 (single -50 unfulfilled event), posture still GOOD_STANDING"

      - name: confidentiality_expired_excluded_then_resign_restores
        claim_type: selector_policy
        grounds: [calculations.interpreter_dispatch_selection, entities.Interpreter.fields.confidentiality_signed_at]
        distinguishing_aspect: "Confidentiality TTL interacts with the logical clock: signed 2025-01-01 is stale at 2026-08-01 (> 365 days) so the sole candidate is excluded (UNFULFILLED); PATCH confidentiality_signed=true re-stamps signed_at and the next identical request is ASSIGNED."
        test_recipe:
          setup: ["Clock at 2025-01-01T00:00:00Z; Department D budget 1000000; contract ACTIVE (phone 50c/min); interpreter X CERTIFIED [es] [PHONE], confidentiality signed at 2025-01-01; clock advanced to 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-01-01T00:00:00Z" }
              as: LanguageAccessCoordinator
            - call: "POST /departments"
              payload: { name: "Dept TTL", service_area_code: "SA-C42", annual_budget_cents: 1000000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
            - call: "POST /vendor-contracts"
              payload: { vendor_name: "VendorTTL", ceiling_cents: 500000, phone_per_minute_cents: 50, video_per_minute_cents: 75, in_person_per_minute_cents: 100, translation_per_word_cents: 20, in_person_travel_flat_cents: 2500 }
              as: LanguageAccessCoordinator
              captures: { contract_id: $.data.id }
            - call: "POST /vendor-contracts/${contract_id}/activate"
              as: LanguageAccessCoordinator
            - call: "POST /interpreters"
              payload: { full_name: "TTL Tessa", language_codes: ["es"], modalities: ["PHONE"], tier: "CERTIFIED", vendor_contract_id: "${contract_id}" }
              as: LanguageAccessCoordinator
              captures: { x_id: $.data.id }
            - call: "PATCH /interpreters/${x_id}"
              payload: { confidentiality_signed: true }
              as: LanguageAccessCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LanguageAccessCoordinator
          trigger:
            - call: "POST /interpretation-requests"
              payload: { department_id: "${dept_id}", language_code: "es", modality: "PHONE", encounter_setting: "GENERAL", scheduled_duration_minutes: 30 }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { req1_id: $.data.id }
            - call: "PATCH /interpreters/${x_id}"
              payload: { confidentiality_signed: true }
              as: LanguageAccessCoordinator
            - call: "POST /interpretation-requests"
              payload: { department_id: "${dept_id}", language_code: "es", modality: "PHONE", encounter_setting: "GENERAL", scheduled_duration_minutes: 30 }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { req2_id: $.data.id }
          assert:
            - "InterpretationRequest.${req1_id}.status == UNFULFILLED (signed_at 2025-01-01 older than 365 days at 2026-08-01)"
            - "InterpretationRequest.${req2_id}.status == ASSIGNED and interpreter_id == ${x_id} (re-sign restored eligibility)"
            - "Department.${dept_id}.compliance_score == 950 (exactly one unfulfilled event)"

      - name: court_setting_requires_certified_pool
        claim_type: selector_policy
        grounds: [calculations.interpreter_dispatch_selection, entities.InterpretationRequest.fields.encounter_setting]
        distinguishing_aspect: "Tier eligibility at dispatch (not at creation): a COURT IN_PERSON request is schema/state-valid but the REGISTERED-only pool yields UNFULFILLED — the setting's CERTIFIED requirement filters the pool."
        test_recipe:
          setup: ["Clock default 2026-08-01T00:00:00Z; Department D budget 1000000; contract ACTIVE (in_person 100c/min); interpreter REGISTERED [es] [IN_PERSON] conf current"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dept Court", service_area_code: "SA-C43", annual_budget_cents: 1000000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
            - call: "POST /vendor-contracts"
              payload: { vendor_name: "VendorCourt", ceiling_cents: 500000, phone_per_minute_cents: 50, video_per_minute_cents: 75, in_person_per_minute_cents: 100, translation_per_word_cents: 20, in_person_travel_flat_cents: 2500 }
              as: LanguageAccessCoordinator
              captures: { contract_id: $.data.id }
            - call: "POST /vendor-contracts/${contract_id}/activate"
              as: LanguageAccessCoordinator
            - call: "POST /interpreters"
              payload: { full_name: "Reg Court", language_codes: ["es"], modalities: ["IN_PERSON"], tier: "REGISTERED", vendor_contract_id: "${contract_id}" }
              as: LanguageAccessCoordinator
              captures: { x_id: $.data.id }
            - call: "PATCH /interpreters/${x_id}"
              payload: { confidentiality_signed: true }
              as: LanguageAccessCoordinator
          trigger:
            - call: "POST /interpretation-requests"
              payload: { department_id: "${dept_id}", language_code: "es", modality: "IN_PERSON", encounter_setting: "COURT", scheduled_start: "2026-08-02T10:00:00Z", scheduled_duration_minutes: 60 }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { req_id: $.data.id }
          assert:
            - "InterpretationRequest.${req_id}.status == UNFULFILLED (COURT requires CERTIFIED; REGISTERED candidate excluded)"
            - "Interpreter.${x_id} unchanged: status ACTIVE, minutes_current_month == 0"

      - name: notice_missing_substantiation_marks_signage_deficient
        claim_type: cascading_side_effects
        grounds: [state_machines.Complaint.RECEIVED_to_SUBSTANTIATED, entities.Department.fields.signage_status]
        distinguishing_aspect: "Category-conditional cascade: a SUBSTANTIATED NOTICE_MISSING complaint flips the department's signage_status to DEFICIENT in the same request (signage & notice compliance tracking), alongside the standard -150."
        test_recipe:
          setup: ["Department D (signage CURRENT); complaint category NOTICE_MISSING recorded by liaison"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dept Sign", service_area_code: "SA-C44", annual_budget_cents: 100000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
            - call: "POST /complaints"
              payload: { department_id: "${dept_id}", category: "NOTICE_MISSING", description: "no signage at lobby" }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { complaint_id: $.data.id }
          trigger:
            - call: "POST /complaints/${complaint_id}/adjudicate"
              payload: { outcome: "SUBSTANTIATED" }
              as: ComplianceOfficer
          assert:
            - "Department.${dept_id}.signage_status == DEFICIENT (category-conditional cascade)"
            - "Department.${dept_id}.compliance_score == 850 (single -150 event)"
            - "Complaint.${complaint_id}.remediation_due_at == adjudicated_at + 30 days"

      - name: close_within_remediation_window_restores_points
        claim_type: rate_threshold_triggers
        grounds: [calculations.department_compliance_score, entities.Complaint.fields.remediation_due_at]
        distinguishing_aspect: "On-time remediation restores +100: substantiated at 2026-08-01 (due 2026-08-31), closed at 2026-08-15 -> score 950; the +100 event only fires when closed_at <= remediation_due_at."
        test_recipe:
          setup: ["Department D; complaint substantiated at clock 2026-08-01T00:00:00Z (score 850); clock advanced to 2026-08-15T00:00:00Z"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dept Ontime", service_area_code: "SA-C45", annual_budget_cents: 100000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
            - call: "POST /complaints"
              payload: { department_id: "${dept_id}", category: "OTHER", description: "fixable" }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { complaint_id: $.data.id }
            - call: "POST /complaints/${complaint_id}/adjudicate"
              payload: { outcome: "SUBSTANTIATED" }
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: LanguageAccessCoordinator
          trigger:
            - call: "POST /complaints/${complaint_id}/close"
              payload: { resolution_note: "fixed within window" }
              as: ComplianceOfficer
          assert:
            - "Complaint.${complaint_id}.status == RESOLVED and closed_at == 2026-08-15T00:00:00Z"
            - "Department.${dept_id}.compliance_score == 950 (1000 - 150 + 100; on-time restore)"

      - name: close_after_remediation_window_restores_nothing
        claim_type: rate_threshold_triggers
        grounds: [calculations.department_compliance_score, entities.Complaint.fields.remediation_due_at]
        distinguishing_aspect: "Late remediation restores nothing: closed at 2026-09-01, one day past the 2026-08-31 deadline -> score stays 850 (no +100 event) — the window edge is inclusive on the due date itself."
        test_recipe:
          setup: ["Department D; complaint substantiated at clock 2026-08-01T00:00:00Z (due 2026-08-31T00:00:00Z, score 850); clock advanced to 2026-09-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dept Late", service_area_code: "SA-C46", annual_budget_cents: 100000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
            - call: "POST /complaints"
              payload: { department_id: "${dept_id}", category: "OTHER", description: "late fix" }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { complaint_id: $.data.id }
            - call: "POST /complaints/${complaint_id}/adjudicate"
              payload: { outcome: "SUBSTANTIATED" }
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: LanguageAccessCoordinator
          trigger:
            - call: "POST /complaints/${complaint_id}/close"
              payload: { resolution_note: "fixed late" }
              as: ComplianceOfficer
          assert:
            - "Complaint.${complaint_id}.status == RESOLVED (close still allowed)"
            - "Department.${dept_id}.compliance_score == 850 (closed_at > remediation_due_at -> no +100)"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_visibility
        claim_type: immediate_consistency
        grounds: [complexity_profile, endpoints]
        distinguishing_aspect: "Immediate consistency: a department created via POST is fully visible in the very next GET, including computed fields (compliance_score 1000, remaining_cents == budget) — no lag, no stale cache."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /departments"
              payload: { name: "Dept Imm", service_area_code: "SA-C47", annual_budget_cents: 123456 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
            - call: "GET /departments/${dept_id}"
              as: LanguageAccessCoordinator
          assert:
            - "GET returns name == \"Dept Imm\", annual_budget_cents == 123456, remaining_cents == 123456, compliance_score == 1000, version == 1 in the immediately following request"
