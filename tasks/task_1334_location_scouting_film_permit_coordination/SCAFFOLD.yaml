    roles: [LocationManager]
    code: 201
    input: [location_id, shoot_start_date, shoot_end_date, "max_rounds?"]
    output: OwnerAgreement
    side_effects: ["status := DRAFT", "round_count := 0"]
  - method: GET
    path: "/productions/{id}/owner-agreements"
    description: "List agreements (filterable by location_id, status)"
    roles: [FilmOffice, LocationManager, OwnerRep]
    code: 200
    input: ["limit?", "offset?", "location_id?", "status?"]
    output: OwnerAgreement[]
    side_effects: []
  - method: GET
    path: "/productions/{id}/owner-agreements/{rid}"
    description: "Get an agreement"
    roles: [FilmOffice, LocationManager, OwnerRep]
    code: 200
    input: []
    output: OwnerAgreement
    side_effects: []
  - method: POST
    path: "/productions/{id}/owner-agreements/{rid}/propose"
    description: "Propose (or re-propose after a counter) a day rate"
    roles: [LocationManager]
    code: 200
    input: [proposed_day_rate_cents]
    output: OwnerAgreement
