            - { call: "POST /api/photos/${photo_id}/review", payload: { decision: "APPROVED" }, as: CardOfficeAdmin }
            - { call: "POST /api/cards/${card_id}/activate", payload: {}, as: CardOfficeAdmin }
            - call: "POST /api/card-holders/${h_id}/accounts"
