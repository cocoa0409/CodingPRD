      - name: period_close_is_blocked_while_a_leg_is_still_open_and_succeeds_once_it_is_cancelled
        claim_type: Conditional action
        grounds:
          - validations[priority 46 ERR_PERIOD_INVALID_STATE]
          - endpoints[POST /wetlease/utilization-periods/{periodId}/close]
          - state_machines.UtilizationPeriod[OPEN -> PENDING_SETTLEMENT]
          - entities.UtilizationPeriod.fields.variant_applied
        distinguishing_aspect: |
          Closure carries a precondition beyond the source state: no leg with scheduled_out inside
          period_month may still be SCHEDULED or DISPATCHED. The very same call is a 409 while the
          Palma leg is open and a 200 once it is cancelled - and because the lessee cancelled it, the
          leg contributes nothing to credited hours and generates NO shortfall credit, so the empty
          month settles at the bare guarantee of 2,400,000 with variant_applied flipped to FINAL and
