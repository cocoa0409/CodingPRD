scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across DIFFERENT entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: funding_progress_provisional_vs_final
        grounds:
          - calculations.funding_progress_provisional
          - calculations.funding_progress_final
          - entities.Project.fields.provisional_raised_cents
          - entities.Project.fields.final_raised_cents
          - state_machines.Project.LIVE_to_SUCCEEDED
        distinguishing_aspect: |
          Two valid algorithms over the same Order set produce different cents on the
          Project entity domain: provisional sums payment_status==AUTHORIZED, final sums
          payment_status IN {CHARGED, PARTIALLY_REFUNDED}. When charges fail post-deadline,
          provisional_raised_cents > final_raised_cents on the same Project row.
        test_recipe:
          setup:
            - "Initiator (KYC VERIFIED), Project (TECH, ALL_OR_NOTHING, target=20000, deadline=now+72h, LIVE)"
            - "Reward R (pledge=10000 cents, PHYSICAL, inventory_limit=null)"
            - "3 Backers each POST /orders selecting R → 3 AUTHORIZED orders, order_total=10000 each"
          trigger:
            - "Read Project: assert provisional_raised_cents == 30000"
            - "POST /_clock/advance to deadline+1s → Project SUCCEEDED, all 3 orders CHARGE_PENDING"
            - "POST /_events/payment for orders 1 and 2 with result=SUCCESS"
            - "POST /_events/payment for order 3 with result=FAILURE three times → CHARGE_FAILED"
          assert:
            - "Project.provisional_raised_cents == 30000 (snapshot before charge wave)"
            - "Project.final_raised_cents == 20000 after charge wave"
            - "Project.provisional_raised_cents != Project.final_raised_cents"

      - name: order_refundable_remainder_pre_vs_post_shipment
        grounds:
          - calculations.partial_refund_eligibility
          - entities.Order.fields.refundable_remainder_cents
          - entities.Order.fields.order_total_cents
          - state_machines.Order.CHARGED_to_PARTIALLY_REFUNDED
        distinguishing_aspect: |
          Two valid algorithms on the Order entity domain (DIFFERENT domain than Project
          above): pre_shipment variant sets refundable_remainder_cents == order_total_cents
          (full refundable); post_partial_shipment variant subtracts shipped_value_cents.
          Same Order row yields different remainder values depending on which shipment
          events have been posted.
        test_recipe:
          setup:
            - "SUCCEEDED Project; Order with order_total_cents=15000 in CHARGED state"
          trigger:
            - "Read Order before shipment → refundable_remainder_cents == 15000"
            - "POST /_events/logistics order_id=O lines=[{value_cents:6000}] (partial)"
            - "Read Order after shipment → refundable_remainder_cents == 9000"
          assert:
            - "Order.refundable_remainder_cents transitions from 15000 to 9000"
            - "Order.refundable_remainder_cents == 9000 (== 15000 - 6000)"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across DIFFERENT modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: per_order_rounding_then_sum_for_batch_commission
        grounds:
          - calculations.commission_calculation
          - entities.SettlementBatch.fields.commission_cents
          - entities.Order.fields.order_total_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. Commission rate (BPS) applied
          per order, rounded half-up per order, THEN summed to batch. The alternative
          (sum gross then round once) yields different cents. SCAFFOLD pins per-order
          rounding then sum and rejects the alternative.
        test_recipe:
          setup:
            - "SUCCEEDED Project (TECH, COMMISSION_RATE_BPS=500)"
            - "Three CHARGED orders with order_total_cents = 333, 333, 334 (sum 1000)"
          trigger:
            - "POST /projects/{p}/settlement-batches with period covering all 3 charges"
            - "POST .../settlement-batches/{b}/finalize"
          assert:
            - "Per-order: round_half_up(333*500/10000)=round_half_up(16.65)=17, round_half_up(333*500/10000)=17, round_half_up(334*500/10000)=round_half_up(16.7)=17"
            - "SettlementBatch.commission_cents == 51 (17+17+17)"
            - "If implementation summed gross first: 1000*500/10000=50 — REJECTED"

      - name: settlement_net_circular_look_evaluation_order
        grounds:
          - calculations.settlement_net
          - calculations.tax_withholding
          - calculations.commission_calculation
          - calculations.refund_commission_reversal
          - entities.SettlementBatch.fields.net_payout_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency. Tax depends on (gross - commission -
          channel_fee - refund_reversal); but commission is NOT recomputed from net.
          Pinned evaluation order: commission first, then channel_fee, refund_reversal,
          then tax, then net. Different from Mode (b) above (per-order rounding then sum).
        test_recipe:
          setup:
            - "SUCCEEDED Project (TECH, 500 BPS), Initiator with tax_id present"
            - "One CHARGED order order_total_cents=100000, no refunds"
          trigger:
            - "POST /projects/{p}/settlement-batches; finalize"
          assert:
            - "SettlementBatch.commission_cents == 5000 (100000*500/10000)"
            - "SettlementBatch.channel_fee_cents == 2900 (max(30, floor(100000*290/10000)))"
            - "SettlementBatch.refund_reversal_cents == 0"
            - "Computed taxable_base = 100000 - 5000 - 2900 - 0 = 92100; > 60000 ⇒ tax = round_half_up(92100*1000/10000) = 9210"
            - "SettlementBatch.tax_withheld_cents == 9210"
            - "SettlementBatch.net_payout_cents == 82890 (92100 - 9210)"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shapes on DIFFERENT entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: project_review_revision_loop_cycle
        grounds:
          - state_machines.Project
          - state_machines.Project.CONTENT_REVIEW_to_DRAFT
          - state_machines.Project.LEGAL_REVIEW_to_DRAFT
          - state_machines.Project.FINANCIAL_REVIEW_to_DRAFT
          - state_machines.Project.DRAFT_to_CONTENT_REVIEW
        distinguishing_aspect: |
          Cyclic shape on Project: DRAFT → CONTENT_REVIEW → DRAFT → CONTENT_REVIEW → ...
          via REQUEST_CHANGES decisions. The same project can re-enter the same review
          state arbitrarily many times. This is structurally NOT a linear A→B→C→D pipeline.
        test_recipe:
          setup:
            - "Project P in DRAFT (KYC OK, all fields, 1 reward, deadline > now+24h)"
          trigger:
            - "POST /projects/{P}/submit → CONTENT_REVIEW"
            - "POST /projects/{P}/review-content {decision:REQUEST_CHANGES} → DRAFT"
            - "POST /projects/{P}/submit → CONTENT_REVIEW (cycle round 2)"
            - "POST /projects/{P}/review-content {decision:REQUEST_CHANGES} → DRAFT (cycle round 2 complete)"
          assert:
            - "Project.status equals 'DRAFT' after second REQUEST_CHANGES"
            - "AuditLogEntry STATUS_CHANGE count for project >= 4"

      - name: order_parallel_payment_and_fulfillment_dimensions
        grounds:
          - state_machines.Order
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
          - state_machines.Order.CHARGED_to_PARTIALLY_REFUNDED
        distinguishing_aspect: |
          Parallel state dimensions on the Order entity (different from Project above):
          payment_status (AUTHORIZED, CHARGE_PENDING, CHARGED, …) and fulfillment_status
          (NOT_STARTED, PARTIALLY_SHIPPED, FULLY_SHIPPED) evolve independently on the
          same row — Order can be CHARGED + PARTIALLY_SHIPPED + PARTIALLY_REFUNDED at once.
        test_recipe:
          setup:
            - "Order O in (payment_status=CHARGED, fulfillment_status=NOT_STARTED), order_total=10000"
          trigger:
            - "POST /_events/logistics O lines=[{value_cents:4000}] → fulfillment_status=PARTIALLY_SHIPPED, payment_status unchanged"
            - "POST /refund-requests {order_id:O, requested_amount_cents:6000, reason:DISPUTE}"
            - "POST /refund-requests/{r}/approve; POST /refund-requests/{r}/execute"
          assert:
            - "Order.payment_status == 'PARTIALLY_REFUNDED' AND Order.fulfillment_status == 'PARTIALLY_SHIPPED' simultaneously"
            - "The two dimensions changed independently (logistics event did NOT change payment_status; refund did NOT change fulfillment_status)"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from DIFFERENT triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: project_succeeded_charge_wave_cascade_depth3
        grounds:
          - state_machines.Project.LIVE_to_SUCCEEDED
          - state_machines.Order.AUTHORIZED_to_CHARGE_PENDING
          - state_machines.Order.CHARGE_PENDING_to_CHARGED
          - calculations.commission_calculation
          - entities.EscrowLedgerEntry
        distinguishing_aspect: |
          Depth-3 cascade originating from clock advance past deadline.
          Hop 1: clock advance triggers Project LIVE→SUCCEEDED (the original action).
          Hop 2: SUCCEEDED auto-transitions every AUTHORIZED Order to CHARGE_PENDING — caused by hop 1, not directly by the clock event.
          Hop 3: subsequent payment SUCCESS event drives CHARGE_PENDING→CHARGED, which itself triggers commission_calculation insert + EscrowLedgerEntry COMMISSION_HOLD/CHANNEL_FEE rows — caused by hop 2's transition, not by the clock advance.
        test_recipe:
          setup:
            - "Project LIVE with funding_target met by 1 AUTHORIZED Order (order_total=10000, TECH)"
          trigger:
            - "POST /_clock/advance to deadline+1s"
            - "POST /_events/payment {order_id:O, result:SUCCESS}"
          assert:
            - "Project.status == 'SUCCEEDED' (hop 1)"
            - "Order.payment_status walked AUTHORIZED → CHARGE_PENDING → CHARGED (hop 2 then hop 3)"
            - "EscrowLedgerEntry rows of types {CHARGE_CAPTURE, COMMISSION_HOLD, CHANNEL_FEE} all present for the order (hop 3 side effects)"

      - name: refund_execute_cascade_depth3
        grounds:
          - state_machines.RefundRequest.APPROVED_to_EXECUTED
          - state_machines.Order.CHARGED_to_PARTIALLY_REFUNDED
          - calculations.refund_commission_reversal
          - entities.SettlementBatch.fields.refund_reversal_cents
        distinguishing_aspect: |
          Depth-3 cascade originating from a DIFFERENT trigger than instance 1: a
          PlatformAdmin call to POST /refund-requests/{id}/execute.
          Hop 1: RefundRequest APPROVED→EXECUTED.
          Hop 2: caused by hop 1, the linked Order transitions CHARGED→PARTIALLY_REFUNDED.
          Hop 3: caused by hop 2's transition, the open SettlementBatch's
          refund_reversal_cents is recomputed and EscrowLedgerEntry COMMISSION_REVERSAL is appended.
        test_recipe:
          setup:
            - "SUCCEEDED Project; CHARGED Order O (order_total=10000, ART category → original_commission_cents=700); a DRAFT SettlementBatch B for the period"
            - "RefundRequest R in APPROVED status with approved_amount_cents=4000"
          trigger:
            - "POST /refund-requests/{R}/execute"
          assert:
            - "RefundRequest.status == 'EXECUTED' (hop 1)"
            - "Order.payment_status == 'PARTIALLY_REFUNDED' (hop 2)"
            - "EscrowLedgerEntry COMMISSION_REVERSAL row exists with amount round_half_up(700*4000/10000)=280 (hop 3 side effect)"
            - "SettlementBatch B.refund_reversal_cents == 280 (hop 3 recomputation)"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across DIFFERENT error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_temporal_on_order_modify
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - errors.ERR_INVALID_STATE
          - errors.ERR_MODIFICATION_WINDOW_CLOSED
        distinguishing_aspect: |
          Pair: state (priority 5) vs business_temporal (priority 8). When a Backer
          PATCHes an Order whose Project has cancelled (so Order.payment_status=VOIDED)
          AND the modification window has closed, the state error wins because state
          (priority 5) is checked before business_temporal (priority 8). Returns
          ERR_INVALID_STATE, not ERR_MODIFICATION_WINDOW_CLOSED.
        test_recipe:
          setup:
            - "Project LIVE with one AUTHORIZED Order O at created_at=t0 (window closes at t0+72h)"
            - "POST /projects/{p}/cancel → cascade VOIDs Order O"
            - "POST /_clock/advance to t0+73h (window closed)"
          trigger:
            - "PATCH /orders/{O} {add_ons: [...], version: V} as Backer"
          assert:
            - "Response error_id == 'ERR_INVALID_STATE'"
            - "Response http_status == 409"
            - "NOT 'ERR_MODIFICATION_WINDOW_CLOSED'"

      - name: business_safety_vs_business_constraint_on_submit
        grounds:
          - validations[priority=7]
          - validations[priority=14]
          - errors.ERR_KYC_REQUIRED
          - errors.ERR_NO_REWARDS_DEFINED
        distinguishing_aspect: |
          DIFFERENT pair from above: business_safety (priority 7, KYC) vs
          business_constraint (priority 14, no rewards). When an Initiator with
          kyc_status=PENDING submits a project that ALSO has zero Rewards, the safety
          error wins because priority 7 < priority 14. Returns ERR_KYC_REQUIRED, not
          ERR_NO_REWARDS_DEFINED.
        test_recipe:
          setup:
            - "Initiator I with kyc_status=PENDING"
            - "Project P in DRAFT (all fields valid, deadline > now+48h) but ZERO rewards"
          trigger:
            - "POST /projects/{P}/submit as Initiator I"
          assert:
            - "Response error_id == 'ERR_KYC_REQUIRED'"
            - "Response http_status == 422"
            - "NOT 'ERR_NO_REWARDS_DEFINED'"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on DIFFERENT metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: tax_withholding_threshold_strictly_greater
        grounds:
          - calculations.tax_withholding
          - calculations.tax_withholding.constants.REPORTING_THRESHOLD_CENTS
          - entities.SettlementBatch.fields.tax_withheld_cents
        distinguishing_aspect: |
          Numeric boundary: taxable_base_cents > 60000 triggers tax; == 60000 does NOT.
          Strict-greater (>), reachable via POST /projects/{p}/settlement-batches/{b}/finalize.
        test_recipe:
          setup:
            - "Initiator with tax_id present"
            - "Construct CHARGED orders so that taxable_base = exactly 60000 cents:"
            - "  e.g., one TECH order order_total=63158: commission=floor_round(63158*500/10000)=round_half_up(3157.9)=3158; channel_fee=max(30,floor(63158*290/10000))=floor(1831.582)=1831; taxable_base=63158-3158-1831=58169 — adjust until taxable_base==60000"
            - "  Pinned setup: TECH order order_total=63157; commission=round_half_up(63157*500/10000)=round_half_up(3157.85)=3158; channel=max(30,floor(63157*290/10000))=floor(1831.553)=1831; taxable_base=63157-3158-1831=58168. NOT exact — instead use multi-order construction so taxable_base exactly equals 60000."
            - "  Simplified pinned setup: skip channel by using two orders contrived: order A 60000 TECH, no other deductions assumed by zeroing channel via mock — instead the test fixture seeds gross=64500, commission=2500, channel=2000, refund_reversal=0 → taxable_base=60000 exactly. (See test_recipe in unit-test generator for the seed; this scaffold instance simply pins the boundary semantics.)"
          trigger:
            - "POST /projects/{p}/settlement-batches; POST .../finalize"
          assert:
            - "When taxable_base_cents == 60000: tax_withheld_cents == 0 (boundary inclusive lower side)"
            - "Re-run with taxable_base_cents == 60001: tax_withheld_cents == round_half_up(60001*1000/10000) == 6000"
            - "The strict-greater boundary is honored at exactly 60000 vs 60001"

      - name: empty_set_no_authorized_orders_at_deadline
        grounds:
          - calculations.funding_progress_provisional
          - state_machines.Project.LIVE_to_FAILED
          - entities.Project.fields.provisional_raised_cents
        distinguishing_aspect: |
          DIFFERENT metric — empty-collection boundary on a DIFFERENT endpoint
          (POST /_clock/advance, not settlement finalize). Project with zero AUTHORIZED
          Orders has provisional_raised_cents == 0 < funding_target_cents, hence
          ALL_OR_NOTHING project must transition LIVE→FAILED at deadline (zero-count edge).
        test_recipe:
          setup:
            - "Project LIVE, ALL_OR_NOTHING, funding_target_cents=100, deadline=now+1h. ZERO orders placed."
          trigger:
            - "POST /_clock/advance to deadline+1s"
          assert:
            - "Project.provisional_raised_cents == 0"
            - "Project.status == 'FAILED'"
            - "No EscrowLedgerEntry of type CHARGE_CAPTURE created (empty cascade)"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across DIFFERENT entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_create_requires_project_live
        grounds:
          - state_machines.Order
          - state_machines.Project
          - validations[priority=4]
          - endpoints.POST_/orders
        distinguishing_aspect: |
          Entity pair: Order ↔ Project. Order creation (initial state AUTHORIZED) is
          gated on Project.status == LIVE. Submitting POST /orders against a Project in
          DRAFT, CONTENT_REVIEW, SUCCEEDED, or any other state is rejected with
          ERR_INVALID_STATE — Order's transitions depend on Project's state.
        test_recipe:
          setup:
            - "Project P in CONTENT_REVIEW status; Reward R defined; Backer B"
          trigger:
            - "POST /orders {project_id:P, reward_id:R, ...} as Backer B"
          assert:
            - "Response error_id == 'ERR_INVALID_STATE'"
            - "Response http_status == 409"
            - "No Order row created"

      - name: settlement_finalize_requires_no_open_refunds_on_orders
        grounds:
          - state_machines.SettlementBatch.DRAFT_to_FINALIZED
          - state_machines.RefundRequest
          - validations[priority=17]
          - errors.ERR_PENDING_REFUNDS_BLOCK_SETTLEMENT
        distinguishing_aspect: |
          DIFFERENT pair from above: SettlementBatch ↔ RefundRequest (via Order).
          SettlementBatch DRAFT→FINALIZED is rejected when any RefundRequest in
          PENDING_REVIEW or APPROVED exists for an Order whose CHARGE event falls in
          the batch period. The cross-entity dependency goes through Order as a join.
        test_recipe:
          setup:
            - "SUCCEEDED Project; CHARGED Order O in batch period; RefundRequest R against O in PENDING_REVIEW"
            - "DRAFT SettlementBatch B"
          trigger:
            - "POST /projects/{p}/settlement-batches/{B}/finalize"
          assert:
            - "Response error_id == 'ERR_PENDING_REFUNDS_BLOCK_SETTLEMENT'"
            - "Response http_status == 422"
            - "SettlementBatch.status remains 'DRAFT' (no transition)"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across DIFFERENT interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: order_modification_window_half_open_interval
        grounds:
          - entities.Order.fields.order_modification_locked_at
          - validations[priority=8]
          - errors.ERR_MODIFICATION_WINDOW_CLOSED
          - endpoints.POST_/_clock/advance
        distinguishing_aspect: |
          Interval semantics A — half-open [created_at, order_modification_locked_at).
          PATCH allowed when now() < locked_at; rejected when now() >= locked_at. The
          right boundary is exclusive (closed window at exact locked_at). Resource
          entity: Order.
        test_recipe:
          setup:
            - "Project LIVE; Order O created at t0 with locked_at = t0 + 72h"
          trigger:
            - "POST /_clock/advance to t0 + 72h (exact boundary)"
            - "PATCH /orders/{O} {shipping_address:{...}, version:V}"
          assert:
            - "Response error_id == 'ERR_MODIFICATION_WINDOW_CLOSED' (now() == locked_at; window closed)"
            - "Re-run after rewinding to t0 + 72h - 1s: PATCH succeeds (window open)"

      - name: settlement_period_half_open_interval_with_event_aggregation
        grounds:
          - entities.SettlementBatch.fields.period_start
          - entities.SettlementBatch.fields.period_end
          - calculations.commission_calculation.input_set
          - state_machines.SettlementBatch.DRAFT_to_FINALIZED
        distinguishing_aspect: |
          DIFFERENT interval semantics on a DIFFERENT resource entity (SettlementBatch
          vs Order above): half-open [period_start, period_end) where the AGGREGATE
          (sum of order_total_cents over CHARGED orders in window) defines membership,
          not point-in-time occupation. Adjacency is allowed (a batch ending at T does
          not overlap a batch starting at T) — this is a different geometric treatment
          (aggregate window vs blocking interval).
        test_recipe:
          setup:
            - "SUCCEEDED Project; Order A CHARGED at time T1; Order B CHARGED at exactly time T2"
            - "Two adjacent SettlementBatches: B1 [T1, T2), B2 [T2, T3)"
          trigger:
            - "POST /projects/{p}/settlement-batches/{B1}/finalize"
            - "POST /projects/{p}/settlement-batches/{B2}/finalize"
          assert:
            - "B1.gross_charged_cents includes A only (A is in [T1, T2))"
            - "B2.gross_charged_cents includes B only (B is in [T2, T3); period_start inclusive)"
            - "Order at exact boundary T2 belongs to exactly ONE batch (B2), proving half-open treatment"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across DIFFERENT conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: reward_inventory_conservation_on_order_cancel
        grounds:
          - entities.Reward.fields.inventory_claimed
          - state_machines.Order.AUTHORIZED_to_VOIDED
          - endpoints.POST_/orders
          - endpoints.POST_/orders/{id}/cancel
        distinguishing_aspect: |
          Conserved quantity: Reward.inventory_claimed. Forward action POST /orders
          increments by 1; compensating POST /orders/{id}/cancel decrements by 1.
          INVARIANT: across any number of (create, cancel) pairs on the same Reward,
          the quantity Reward.inventory_claimed equals (count of orders for this reward
          with payment_status NOT IN {VOIDED, REFUNDED}) and is unchanged after a
          paired create+cancel.
        test_recipe:
          setup:
            - "Reward R with inventory_claimed=0, inventory_limit=1"
            - "Backer B"
          trigger:
            - "POST /orders for R as B → Order O; read R.inventory_claimed (snapshot s1)"
            - "POST /orders/{O}/cancel → Order O = VOIDED; read R.inventory_claimed (snapshot s2)"
          assert:
            - "s1 == 1 (forward action)"
            - "s2 == 0 (compensating action)"
            - "Final Reward.inventory_claimed == 0 (named conserved quantity unchanged after paired forward+compensate)"

      - name: escrow_balance_conservation_on_full_refund
        grounds:
          - entities.EscrowLedgerEntry
          - calculations.refund_commission_reversal
          - state_machines.Order.CHARGED_to_REFUNDED
          - state_machines.RefundRequest.APPROVED_to_EXECUTED
        distinguishing_aspect: |
          DIFFERENT conserved quantity (monetary, not inventory):
          named_quantity := sum(EscrowLedgerEntry.amount_cents
                                for entry where order_id == O
                                and entry_type IN {CHARGE_CAPTURE, REFUND_OUT,
                                                   COMMISSION_HOLD, COMMISSION_REVERSAL}).
          Forward: CHARGE inserts +order_total CHARGE_CAPTURE and -original_commission
          COMMISSION_HOLD; channel fee is OUT of this conserved set (asymmetric).
          Compensating full refund inserts -order_total REFUND_OUT and
          +original_commission COMMISSION_REVERSAL. INVARIANT: after full refund,
          named_quantity == 0 cents (paired forward + compensate cancels exactly,
          DESPITE channel_fee being non-refundable — channel_fee is excluded from this
          conserved set on purpose to make the invariant exact).
        test_recipe:
          setup:
            - "SUCCEEDED Project ART category; Order O order_total=10000, original_commission=700"
          trigger:
            - "POST /_events/payment {O, SUCCESS} → CHARGED. Read named_quantity (snapshot s1)"
            - "POST /refund-requests {order_id:O, requested_amount_cents:10000}; approve; execute"
            - "Read named_quantity (snapshot s2)"
          assert:
            - "s1 == +10000 + (-700) == 9300 (CHARGE_CAPTURE + COMMISSION_HOLD)"
            - "After full refund: REFUND_OUT == -10000 and COMMISSION_REVERSAL == +700"
            - "s2 == 9300 + (-10000) + 700 == 0"
            - "Conserved quantity returns exactly to 0 after paired forward+compensate"
