              payload: { customer_name: "Larkin Mfg", term_months: 36, included_service_scope: "BASIC", minimum_mono_pages_per_period: 0, minimum_color_pages_per_period: 0, monthly_service_fee_cents: 48000, response_sla_hours_critical: 4, response_sla_hours_standard: 24, labor_rate_cents_per_hour: 9500, early_termination_fee_cents: 0 }
