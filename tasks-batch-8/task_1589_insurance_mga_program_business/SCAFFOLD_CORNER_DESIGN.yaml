# =============================================================================
# §1.9 Scaffold Corner Design — Insurance MGA & Program Business Administration
# Enumerative coverage of every §1.1-§1.7 testable claim not already covered by
# §1.8 (SCAFFOLD_DIFFICULTY_DESIGN.yaml). Sections follow references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: carrier_create_success_and_duplicate_naic_rejected
        claim_type: creation
        grounds: ["entities.Carrier", "errors[ERR_NAIC_CODE_EXISTS]"]
        distinguishing_aspect: "First carrier create returns 201 with status defaulting to ACTIVE; a second create reusing the same naic_code fails 409 ERR_NAIC_CODE_EXISTS (uniqueness constraint)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /mga/carriers", payload: { name: "Carrier One", naic_code: "NAIC-C1", contact_email: "a@c1.com" }, as: PlatformAdmin, captures: { c1: $.data.id, c1_st: $.data.status } }
          trigger:
            - { call: "POST /mga/carriers", payload: { name: "Carrier Dup", naic_code: "NAIC-C1", contact_email: "b@c2.com" }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "first create: status == ACTIVE (default applied), id present"
            - "duplicate create: error_id == ERR_NAIC_CODE_EXISTS, http 409"

      - name: tpa_duplicate_license_rejected
        claim_type: type_constraints
        grounds: ["entities.TPA", "errors[ERR_LICENSE_NUMBER_EXISTS]"]
        distinguishing_aspect: "TPA license_number uniqueness: second TPA with same license_number -> ERR_LICENSE_NUMBER_EXISTS (409)."
        test_recipe:
          setup: ["one TPA registered with license_number LIC-DUP"]
          setup_api_calls:
            - { call: "POST /mga/tpas", payload: { name: "TPA One", license_number: "LIC-DUP", contact_email: "a@t.com" }, as: PlatformAdmin, captures: { t1: $.data.id } }
          trigger:
            - { call: "POST /mga/tpas", payload: { name: "TPA Two", license_number: "LIC-DUP", contact_email: "b@t.com" }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_LICENSE_NUMBER_EXISTS"

      - name: program_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.Program", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required aggregate_limit_cents from program create -> 400 ERR_INVALID_REQUEST; no program row created."
        test_recipe:
          setup: ["carrier exists"]
          setup_api_calls:
            - { call: "POST /mga/carriers", payload: { name: "Carrier MR", naic_code: "NAIC-MR", contact_email: "a@mr.com" }, as: PlatformAdmin, captures: { ca: $.data.id } }
          trigger:
            - { call: "POST /mga/programs", payload: { carrier_id: "${ca}", name: "Missing Fields", line_of_business: "GENERAL_LIABILITY", states_covered: ["CA"], inception_date: "2026-08-01T00:00:00Z", commission_rate_pct: 0.15, corrective_threshold_pct: 70, termination_threshold_pct: 85, min_trust_balance_cents: 10000, min_earned_premium_for_ratio_cents: 50000 }, as: MGAUnderwriter, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (aggregate_limit_cents absent)"
            - "GET /mga/programs?carrier_id=${ca} -> total_count == 0"

      - name: program_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds: ["entities.Program.fields.line_of_business", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "line_of_business outside the declared enum -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["carrier exists"]
          setup_api_calls:
            - { call: "POST /mga/carriers", payload: { name: "Carrier IE", naic_code: "NAIC-IE", contact_email: "a@ie.com" }, as: PlatformAdmin, captures: { ca: $.data.id } }
          trigger:
            - { call: "POST /mga/programs", payload: { carrier_id: "${ca}", name: "Bad Enum", line_of_business: "SPACE_TRAVEL", states_covered: ["CA"], inception_date: "2026-08-01T00:00:00Z", aggregate_limit_cents: 500000, commission_rate_pct: 0.15, corrective_threshold_pct: 70, termination_threshold_pct: 85, min_trust_balance_cents: 10000, min_earned_premium_for_ratio_cents: 50000 }, as: MGAUnderwriter, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: program_computed_fields_input_ignored
        claim_type: computed_fields
        grounds: ["entities.Program.fields.status", "entities.Program.fields.consumed_aggregate_cents"]
        distinguishing_aspect: "Client-supplied status/consumed_aggregate_cents/trust_balance_cents on create are ignored: response shows server defaults PROPOSED / 0 / 0."
        test_recipe:
          setup: ["carrier exists"]
          setup_api_calls:
            - { call: "POST /mga/carriers", payload: { name: "Carrier CI", naic_code: "NAIC-CI", contact_email: "a@ci.com" }, as: PlatformAdmin, captures: { ca: $.data.id } }
          trigger:
            - { call: "POST /mga/programs", payload: { carrier_id: "${ca}", name: "Sneaky", line_of_business: "GENERAL_LIABILITY", states_covered: ["CA"], inception_date: "2026-08-01T00:00:00Z", aggregate_limit_cents: 500000, commission_rate_pct: 0.15, corrective_threshold_pct: 70, termination_threshold_pct: 85, min_trust_balance_cents: 10000, min_earned_premium_for_ratio_cents: 50000, status: "ACTIVE", consumed_aggregate_cents: 999999, trust_balance_cents: 888888 }, as: MGAUnderwriter, captures: { st: $.data.status, cons: $.data.consumed_aggregate_cents, tb: $.data.trust_balance_cents } }
          assert:
            - "response status == PROPOSED, consumed_aggregate_cents == 0, trust_balance_cents == 0 (input values ignored)"

      - name: get_policy_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /mga/policies/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: MGAUnderwriter, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404"

      - name: policy_list_pagination_limit_offset
        claim_type: listing
        grounds: ["response_envelope", "endpoints"]
        distinguishing_aspect: "List endpoint honors pagination envelope: limit=2 returns 2 rows with has_more=true and total_count=3; offset=2 returns the 3rd row with has_more=false."
        test_recipe:
          setup:
            - "ACTIVE program with three QUOTED policies"
          setup_api_calls:
            - { call: "POST /mga/carriers", payload: { name: "Carrier PG", naic_code: "NAIC-PG", contact_email: "a@pg.com" }, as: PlatformAdmin, captures: { ca: $.data.id } }
            - { call: "POST /mga/programs", payload: { carrier_id: "${ca}", name: "PG Program", line_of_business: "GENERAL_LIABILITY", states_covered: ["CA"], inception_date: "2026-08-01T00:00:00Z", aggregate_limit_cents: 500000, commission_rate_pct: 0.15, corrective_threshold_pct: 70, termination_threshold_pct: 85, min_trust_balance_cents: 10000, min_earned_premium_for_ratio_cents: 50000 }, as: MGAUnderwriter, captures: { prog: $.data.id, prog_v: $.data.version } }
            - { call: "POST /mga/programs/${prog}/guidelines", payload: { state_code: "CA", class_code: "ARTISAN", max_policy_premium_cents: 250000, max_policy_limit_cents: 1000000, min_policy_premium_cents: 5000, expected_program_version: "${prog_v}" }, as: MGAUnderwriter }
            - { call: "GET /mga/programs/${prog}", payload: {}, as: MGAUnderwriter, captures: { prog_v2: $.data.version } }
            - { call: "POST /mga/programs/${prog}/capacity-allocations", payload: { period_label: "2026-Q3", allocated_cents: 300000, expected_program_version: "${prog_v2}" }, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/rate-filings", payload: { state_code: "CA", filing_type: "RATE", base_rates: { ARTISAN: 1500 }, policy_fee_cents: 5000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: MGAUnderwriter, captures: { fil: $.data.id } }
            - { call: "POST /mga/rate-filings/${fil}/submit", payload: {}, as: MGAUnderwriter }
            - { call: "POST /mga/rate-filings/${fil}/approve", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/rate-filings/${fil}/mark-effective", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/activate", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/policies", payload: { insured_name: "P1", state_code: "CA", class_code: "ARTISAN", exposure_units: 10, coverage_limit_cents: 100000, experience_mod: 1.0, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: MGAUnderwriter }
            - { call: "POST /mga/programs/${prog}/policies", payload: { insured_name: "P2", state_code: "CA", class_code: "ARTISAN", exposure_units: 10, coverage_limit_cents: 100000, experience_mod: 1.0, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: MGAUnderwriter }
            - { call: "POST /mga/programs/${prog}/policies", payload: { insured_name: "P3", state_code: "CA", class_code: "ARTISAN", exposure_units: 10, coverage_limit_cents: 100000, experience_mod: 1.0, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: MGAUnderwriter }
          trigger:
            - { call: "GET /mga/programs/${prog}/policies?limit=2&offset=0", payload: {}, as: MGAUnderwriter }
            - { call: "GET /mga/programs/${prog}/policies?limit=2&offset=2", payload: {}, as: MGAUnderwriter }
          assert:
            - "page 1: 2 rows, total_count == 3, has_more == true"
            - "page 2: 1 row, total_count == 3, has_more == false"

      - name: trust_ledger_entry_immutable_record
        claim_type: immutability
        grounds: ["entities.TrustLedgerEntry"]
        distinguishing_aspect: "TrustLedgerEntry has common_fields: false — GET response carries id and created_at but no version/updated_at, and no update/delete endpoint exists for it."
        test_recipe:
          setup: ["ACTIVE program; bound policy with one collection"]
          setup_api_calls:
            - { call: "POST /mga/carriers", payload: { name: "Carrier IM", naic_code: "NAIC-IM", contact_email: "a@im.com" }, as: PlatformAdmin, captures: { ca: $.data.id } }
            - { call: "POST /mga/programs", payload: { carrier_id: "${ca}", name: "IM Program", line_of_business: "GENERAL_LIABILITY", states_covered: ["CA"], inception_date: "2026-08-01T00:00:00Z", aggregate_limit_cents: 500000, commission_rate_pct: 0.15, corrective_threshold_pct: 70, termination_threshold_pct: 85, min_trust_balance_cents: 10000, min_earned_premium_for_ratio_cents: 50000 }, as: MGAUnderwriter, captures: { prog: $.data.id, prog_v: $.data.version } }
            - { call: "POST /mga/programs/${prog}/guidelines", payload: { state_code: "CA", class_code: "ARTISAN", max_policy_premium_cents: 250000, max_policy_limit_cents: 1000000, min_policy_premium_cents: 5000, expected_program_version: "${prog_v}" }, as: MGAUnderwriter }
            - { call: "GET /mga/programs/${prog}", payload: {}, as: MGAUnderwriter, captures: { prog_v2: $.data.version } }
            - { call: "POST /mga/programs/${prog}/capacity-allocations", payload: { period_label: "2026-Q3", allocated_cents: 300000, expected_program_version: "${prog_v2}" }, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/rate-filings", payload: { state_code: "CA", filing_type: "RATE", base_rates: { ARTISAN: 1500 }, policy_fee_cents: 5000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: MGAUnderwriter, captures: { fil: $.data.id } }
            - { call: "POST /mga/rate-filings/${fil}/submit", payload: {}, as: MGAUnderwriter }
            - { call: "POST /mga/rate-filings/${fil}/approve", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/rate-filings/${fil}/mark-effective", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/activate", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/policies", payload: { insured_name: "Ledger Co", state_code: "CA", class_code: "ARTISAN", exposure_units: 100, coverage_limit_cents: 500000, experience_mod: 1.0, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: MGAUnderwriter, captures: { pol: $.data.id } }
            - { call: "POST /mga/policies/${pol}/bind", payload: {}, as: MGAUnderwriter }
            - { call: "POST /mga/policies/${pol}/collections", payload: { amount_cents: 155000 }, as: MGAFinance, captures: { e1: $.data.id } }
          trigger:
            - { call: "GET /mga/trust-ledger-entries/${e1}", payload: {}, as: MGAFinance, captures: { et: $.data.entry_type, amt: $.data.amount_cents, rb: $.data.running_balance_cents } }
          assert:
            - "entry readable: entry_type == COLLECTION, amount_cents == 155000, running_balance_cents == 155000"
            - "response has id and created_at but NO version and NO updated_at (common_fields: false; append-only record)"

      - name: guideline_new_scope_does_not_supersede_other_scope
        claim_type: parent_relationships
        grounds: ["state_machines.UnderwritingGuideline.ACTIVE_to_SUPERSEDED"]
        distinguishing_aspect: "Supersede is scoped to (state_code, class_code): creating a guideline for CA/TRUCKING leaves the CA/ARTISAN guideline ACTIVE — two ACTIVE guidelines in different scopes coexist."
        test_recipe:
          setup: ["program PROPOSED with guideline G1 for (CA, ARTISAN)"]
          setup_api_calls:
            - { call: "POST /mga/carriers", payload: { name: "Carrier GS", naic_code: "NAIC-GS", contact_email: "a@gs.com" }, as: PlatformAdmin, captures: { ca: $.data.id } }
            - { call: "POST /mga/programs", payload: { carrier_id: "${ca}", name: "GS Program", line_of_business: "GENERAL_LIABILITY", states_covered: ["CA"], inception_date: "2026-08-01T00:00:00Z", aggregate_limit_cents: 500000, commission_rate_pct: 0.15, corrective_threshold_pct: 70, termination_threshold_pct: 85, min_trust_balance_cents: 10000, min_earned_premium_for_ratio_cents: 50000 }, as: MGAUnderwriter, captures: { prog: $.data.id, prog_v: $.data.version } }
            - { call: "POST /mga/programs/${prog}/guidelines", payload: { state_code: "CA", class_code: "ARTISAN", max_policy_premium_cents: 250000, max_policy_limit_cents: 1000000, min_policy_premium_cents: 5000, expected_program_version: "${prog_v}" }, as: MGAUnderwriter, captures: { g1: $.data.id } }
          trigger:
            - { call: "GET /mga/programs/${prog}", payload: {}, as: MGAUnderwriter, captures: { v2: $.data.version } }
            - { call: "POST /mga/programs/${prog}/guidelines", payload: { state_code: "CA", class_code: "TRUCKING", max_policy_premium_cents: 400000, max_policy_limit_cents: 2000000, min_policy_premium_cents: 8000, expected_program_version: "${v2}" }, as: MGAUnderwriter, captures: { g2: $.data.id } }
            - { call: "GET /mga/guidelines/${g1}", payload: {}, as: MGAUnderwriter, captures: { g1_st: $.data.status } }
          assert:
            - "Guideline.${g1}.status == ACTIVE (different scope untouched)"
            - "Guideline.${g2}.status == ACTIVE (both scopes have one ACTIVE guideline each)"

      - name: suspended_carrier_blocks_program_activation
        claim_type: type_constraints
        grounds: ["state_machines.Carrier.ACTIVE_to_SUSPENDED", "validations[priority=7]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Carrier.status SUSPENDED gates child operation: activating a program of a suspended carrier fails 409 ERR_INVALID_STATE; re-activating the carrier unblocks it."
        test_recipe:
          setup: ["carrier + program fully prepared (guideline, allocation, EFFECTIVE filing) but not yet activated"]
          setup_api_calls:
            - { call: "POST /mga/carriers", payload: { name: "Carrier SC", naic_code: "NAIC-SC", contact_email: "a@sc.com" }, as: PlatformAdmin, captures: { ca: $.data.id } }
            - { call: "POST /mga/programs", payload: { carrier_id: "${ca}", name: "SC Program", line_of_business: "GENERAL_LIABILITY", states_covered: ["CA"], inception_date: "2026-08-01T00:00:00Z", aggregate_limit_cents: 500000, commission_rate_pct: 0.15, corrective_threshold_pct: 70, termination_threshold_pct: 85, min_trust_balance_cents: 10000, min_earned_premium_for_ratio_cents: 50000 }, as: MGAUnderwriter, captures: { prog: $.data.id, prog_v: $.data.version } }
            - { call: "POST /mga/programs/${prog}/guidelines", payload: { state_code: "CA", class_code: "ARTISAN", max_policy_premium_cents: 250000, max_policy_limit_cents: 1000000, min_policy_premium_cents: 5000, expected_program_version: "${prog_v}" }, as: MGAUnderwriter }
            - { call: "GET /mga/programs/${prog}", payload: {}, as: MGAUnderwriter, captures: { prog_v2: $.data.version } }
            - { call: "POST /mga/programs/${prog}/capacity-allocations", payload: { period_label: "2026-Q3", allocated_cents: 300000, expected_program_version: "${prog_v2}" }, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/rate-filings", payload: { state_code: "CA", filing_type: "RATE", base_rates: { ARTISAN: 1500 }, policy_fee_cents: 5000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: MGAUnderwriter, captures: { fil: $.data.id } }
            - { call: "POST /mga/rate-filings/${fil}/submit", payload: {}, as: MGAUnderwriter }
            - { call: "POST /mga/rate-filings/${fil}/approve", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/rate-filings/${fil}/mark-effective", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/carriers/${ca}/suspend", payload: {}, as: PlatformAdmin, captures: { cst: $.data.status } }
          trigger:
            - { call: "POST /mga/programs/${prog}/activate", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}", captures: { err: $.data.error_id } }
            - { call: "POST /mga/carriers/${ca}/suspend", payload: {}, as: PlatformAdmin }
            - { call: "POST /mga/programs/${prog}/activate", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}", captures: { pst: $.data.status } }
          assert:
            - "carrier suspended (status SUSPENDED): activate rejected with error_id == ERR_INVALID_STATE"
            - "carrier toggled back to ACTIVE: activate succeeds, program status == ACTIVE"

      - name: suspended_tpa_blocks_new_appointment
        claim_type: violation_to_error
        grounds: ["state_machines.TPA.ACTIVE_to_SUSPENDED", "validations[priority=11]", "errors[ERR_TPA_SUSPENDED]"]
        distinguishing_aspect: "Creating an appointment for a SUSPENDED TPA fails 422 ERR_TPA_SUSPENDED (referential integrity against TPA status)."
        test_recipe:
          setup: ["carrier + program (any status); TPA created then suspended"]
          setup_api_calls:
            - { call: "POST /mga/carriers", payload: { name: "Carrier ST", naic_code: "NAIC-ST", contact_email: "a@st.com" }, as: PlatformAdmin, captures: { ca: $.data.id } }
            - { call: "POST /mga/tpas", payload: { name: "TPA ST", license_number: "LIC-ST", contact_email: "t@st.com" }, as: PlatformAdmin, captures: { tpa: $.data.id } }
            - { call: "POST /mga/programs", payload: { carrier_id: "${ca}", name: "ST Program", line_of_business: "GENERAL_LIABILITY", states_covered: ["CA"], inception_date: "2026-08-01T00:00:00Z", aggregate_limit_cents: 500000, commission_rate_pct: 0.15, corrective_threshold_pct: 70, termination_threshold_pct: 85, min_trust_balance_cents: 10000, min_earned_premium_for_ratio_cents: 50000 }, as: MGAUnderwriter, captures: { prog: $.data.id } }
            - { call: "POST /mga/tpas/${tpa}/suspend", payload: {}, as: PlatformAdmin }
          trigger:
            - { call: "POST /mga/programs/${prog}/tpa-appointments", payload: { tpa_id: "${tpa}", claim_type: "LIABILITY", authority_limit_cents: 100000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: CarrierUnderwriter, as_user_id: "${ca}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_TPA_SUSPENDED; no appointment created"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: program_initial_state_is_proposed
        claim_type: initial_state
        grounds: ["state_machines.Program"]
        distinguishing_aspect: "A newly created program starts in PROPOSED with version 1 and computed counters at 0."
        test_recipe:
          setup: ["carrier exists"]
          setup_api_calls:
            - { call: "POST /mga/carriers", payload: { name: "Carrier IN", naic_code: "NAIC-IN", contact_email: "a@in.com" }, as: PlatformAdmin, captures: { ca: $.data.id } }
          trigger:
            - { call: "POST /mga/programs", payload: { carrier_id: "${ca}", name: "Init", line_of_business: "PROPERTY", states_covered: ["CA"], inception_date: "2026-08-01T00:00:00Z", aggregate_limit_cents: 500000, commission_rate_pct: 0.15, corrective_threshold_pct: 70, termination_threshold_pct: 85, min_trust_balance_cents: 10000, min_earned_premium_for_ratio_cents: 50000 }, as: MGAUnderwriter, captures: { st: $.data.status, v: $.data.version, cons: $.data.consumed_aggregate_cents } }
          assert:
            - "status == PROPOSED; version == 1; consumed_aggregate_cents == 0"

      - name: program_activate_twice_rejected
        claim_type: idempotency
        grounds: ["state_machines.Program.PROPOSED_to_ACTIVE", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Repeating the activate trigger on an already-ACTIVE program fails with ERR_INVALID_STATE (409); no double activation, version bumped exactly once."
        test_recipe:
          setup: ["program fully prepared and ACTIVATED once (version advanced past activation)"]
          setup_api_calls:
            - { call: "POST /mga/carriers", payload: { name: "Carrier IA", naic_code: "NAIC-IA", contact_email: "a@ia.com" }, as: PlatformAdmin, captures: { ca: $.data.id } }
            - { call: "POST /mga/programs", payload: { carrier_id: "${ca}", name: "IA Program", line_of_business: "GENERAL_LIABILITY", states_covered: ["CA"], inception_date: "2026-08-01T00:00:00Z", aggregate_limit_cents: 500000, commission_rate_pct: 0.15, corrective_threshold_pct: 70, termination_threshold_pct: 85, min_trust_balance_cents: 10000, min_earned_premium_for_ratio_cents: 50000 }, as: MGAUnderwriter, captures: { prog: $.data.id, prog_v: $.data.version } }
            - { call: "POST /mga/programs/${prog}/guidelines", payload: { state_code: "CA", class_code: "ARTISAN", max_policy_premium_cents: 250000, max_policy_limit_cents: 1000000, min_policy_premium_cents: 5000, expected_program_version: "${prog_v}" }, as: MGAUnderwriter }
            - { call: "GET /mga/programs/${prog}", payload: {}, as: MGAUnderwriter, captures: { prog_v2: $.data.version } }
            - { call: "POST /mga/programs/${prog}/capacity-allocations", payload: { period_label: "2026-Q3", allocated_cents: 300000, expected_program_version: "${prog_v2}" }, as: CarrierUnderwriter, as_user_id: "${ca}" }
