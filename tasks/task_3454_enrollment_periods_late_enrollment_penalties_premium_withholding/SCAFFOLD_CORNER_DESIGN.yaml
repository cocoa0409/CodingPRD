# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Domain: medicare-enrollment. Breadth probe: every testable claim of
# SCAFFOLD.yaml §1.1-§1.7 not already covered by §1.8 (stubs cite the covering
# difficulty instance via excluded_because).
# =============================================================================
scaffold_corner_design:
  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:
      - name: beneficiary_creation_computes_attainment_and_iep
        claim_type: computed_fields
        grounds: [entities.Beneficiary.fields.attainment_month, calculations.calc_attainment_month]
        distinguishing_aspect: "A created beneficiary exposes computed attainment/IEP fields in the read response (DOB 1961-12-14 -> attainment 2026-12, IEP [2026-09, 2027-03])."
        test_recipe:
          setup: ["empty DB; one beneficiary created"]
          setup_api_calls:
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "Comp Uted", date_of_birth: "1961-12-14" }
              as: FieldOfficer
              captures: { b_id: "$.data.id" }
          trigger:
            - call: "GET /medicare/beneficiaries/${b_id}"
              as: FieldOfficer
              captures: { b_att: "$.data.attainment_month", b_start: "$.data.iep_start_month", b_end: "$.data.iep_end_month", b_credit: "$.data.credit_cents", b_ver: "$.data.version" }
          assert:
            - "attainment_month == \"2026-12\""
            - "iep_start_month == \"2026-09\", iep_end_month == \"2027-03\""
            - "credit_cents == 0 (default), version == 1"
      - name: first_of_month_birthday_shifts_attainment_back_one_month
        claim_type: computed_fields
        grounds: [calculations.calc_attainment_month]
        distinguishing_aspect: "First-of-month trap: DOB 1961-12-01 turns 65 on 2026-12-01 but attainment is computed as 2026-11 (prior month), moving the whole IEP earlier."
        test_recipe:
          setup: ["empty DB; one beneficiary created with first-of-month birthday"]
          setup_api_calls:
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "First Ofmonth", date_of_birth: "1961-12-01" }
              as: FieldOfficer
              captures: { b_id: "$.data.id" }
          trigger:
            - call: "GET /medicare/beneficiaries/${b_id}"
              as: FieldOfficer
              captures: { b_att: "$.data.attainment_month", b_start: "$.data.iep_start_month", b_end: "$.data.iep_end_month" }
          assert:
            - "attainment_month == \"2026-11\" (NOT 2026-12)"
            - "iep_start_month == \"2026-08\", iep_end_month == \"2027-02\""
      - name: enrollment_create_missing_required_fields_rejected
        claim_type: required_fields
        grounds: ["validations[priority=4]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /medicare/enrollments with an empty body fails request-shape validation before any existence or window check."
        test_recipe:
          setup: ["one beneficiary exists"]
          setup_api_calls:
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "Miss Ing", date_of_birth: "1961-12-14" }
              as: FieldOfficer
              captures: { b_id: "$.data.id" }
          trigger:
            - call: "POST /medicare/enrollments"
              payload: {}
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "http 400, error_id == ERR_VALIDATION (beneficiary_id and part missing)"
      - name: get_enrollment_unknown_id_returns_404
        claim_type: not_found
        grounds: ["validations[priority=6]", "errors[ERR_ENROLLMENT_NOT_FOUND]"]
        distinguishing_aspect: "Reading a well-formed but nonexistent enrollment id yields the enrollment-specific 404."
        test_recipe:
          setup: ["one beneficiary exists (authentication context)"]
          setup_api_calls:
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "Not Found", date_of_birth: "1961-12-14" }
              as: FieldOfficer
          trigger:
            - call: "GET /medicare/enrollments/00000000-0000-0000-0000-000000000000"
              as: FieldOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "http 404, error_id == ERR_ENROLLMENT_NOT_FOUND"
      - name: beneficiary_create_client_supplied_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Beneficiary.fields.id, "validations[priority=4]"]
        distinguishing_aspect: "Client-supplied id/version in the create body are ignored: the server mints its own id and starts version at 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "Sys Fields", date_of_birth: "1961-12-14", id: "11111111-1111-1111-1111-111111111111", version: 99 }
              as: FieldOfficer
              captures: { b_id: "$.data.id", b_ver: "$.data.version" }
          trigger:
            - call: "GET /medicare/beneficiaries/${b_id}"
              as: FieldOfficer
          assert:
            - "201 on create; response id != \"11111111-1111-1111-1111-111111111111\""
            - "version == 1 (client-supplied 99 ignored)"
      - name: rate_schedule_second_row_same_year_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=30]", "errors[ERR_DUPLICATE_RATE_SCHEDULE]", entities.RateSchedule.fields.coverage_year]
        distinguishing_aspect: "coverage_year is unique across RateSchedule rows; a second 2026 table is a conflict."
        test_recipe:
          setup: ["rate schedule for 2026 published"]
          setup_api_calls:
            - call: "POST /medicare/rate-schedules"
              payload: { coverage_year: 2026, part_b_standard_cents: 18500, part_d_national_base_cents: 3450, irmaa_brackets: [ { tier: 0, single_floor_cents: 0, joint_floor_cents: 0, part_b_surcharge_cents: 0, part_d_surcharge_cents: 0 }, { tier: 1, single_floor_cents: 10000000, joint_floor_cents: 20000000, part_b_surcharge_cents: 7400, part_d_surcharge_cents: 1370 }, { tier: 2, single_floor_cents: 13300000, joint_floor_cents: 26600000, part_b_surcharge_cents: 18500, part_d_surcharge_cents: 3530 }, { tier: 3, single_floor_cents: 16700000, joint_floor_cents: 33400000, part_b_surcharge_cents: 29590, part_d_surcharge_cents: 5680 }, { tier: 4, single_floor_cents: 20000000, joint_floor_cents: 40000000, part_b_surcharge_cents: 40680, part_d_surcharge_cents: 7850 }, { tier: 5, single_floor_cents: 50000000, joint_floor_cents: 75000000, part_b_surcharge_cents: 44390, part_d_surcharge_cents: 8580 } ] }
              as: BenefitAdministrator
          trigger:
            - call: "POST /medicare/rate-schedules"
              payload: { coverage_year: 2026, part_b_standard_cents: 18600, part_d_national_base_cents: 3460, irmaa_brackets: [ { tier: 0, single_floor_cents: 0, joint_floor_cents: 0, part_b_surcharge_cents: 0, part_d_surcharge_cents: 0 }, { tier: 1, single_floor_cents: 10000000, joint_floor_cents: 20000000, part_b_surcharge_cents: 7400, part_d_surcharge_cents: 1370 }, { tier: 2, single_floor_cents: 13300000, joint_floor_cents: 26600000, part_b_surcharge_cents: 18500, part_d_surcharge_cents: 3530 }, { tier: 3, single_floor_cents: 16700000, joint_floor_cents: 33400000, part_b_surcharge_cents: 29590, part_d_surcharge_cents: 5680 }, { tier: 4, single_floor_cents: 20000000, joint_floor_cents: 40000000, part_b_surcharge_cents: 40680, part_d_surcharge_cents: 7850 }, { tier: 5, single_floor_cents: 50000000, joint_floor_cents: 75000000, part_b_surcharge_cents: 44390, part_d_surcharge_cents: 8580 } ] }
              as: BenefitAdministrator
              captures: { err: "$.data.error_id" }
          assert:
            - "http 409, error_id == ERR_DUPLICATE_RATE_SCHEDULE"
      - name: tax_record_second_row_same_year_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=25]", "errors[ERR_DUPLICATE_TAX_YEAR]"]
        distinguishing_aspect: "(beneficiary, tax_year) uniqueness: an amended-looking second 2024 record is a conflict, not an overwrite."
        test_recipe:
          setup: ["beneficiary with a 2024 tax record"]
          setup_api_calls:
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "Tax Dup", date_of_birth: "1960-01-15" }
              as: FieldOfficer
              captures: { b_id: "$.data.id" }
            - call: "POST /medicare/tax-records"
              payload: { beneficiary_id: "${b_id}", tax_year: 2024, magi_cents: 9000000, filing_status: "SINGLE" }
              as: IrsDataAgent
          trigger:
            - call: "POST /medicare/tax-records"
              payload: { beneficiary_id: "${b_id}", tax_year: 2024, magi_cents: 9100000, filing_status: "SINGLE" }
              as: IrsDataAgent
              captures: { err: "$.data.error_id" }
          assert:
            - "http 409, error_id == ERR_DUPLICATE_TAX_YEAR; the original 9000000 record is unchanged"
      - name: employer_coverage_defaults_and_initial_states
        claim_type: defaults
        grounds: [entities.EmployerCoverageRecord.fields.is_drug_coverage_creditable, state_machines.EmployerCoverageRecord.verification_status]
        distinguishing_aspect: "Omitting is_drug_coverage_creditable applies the default false; new records start UNVERIFIED / ACTIVE_COVERAGE."
        test_recipe:
          setup: ["beneficiary exists"]
          setup_api_calls:
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "Def Ault", date_of_birth: "1961-03-10" }
              as: FieldOfficer
              captures: { b_id: "$.data.id" }
          trigger:
            - call: "POST /medicare/employer-coverages"
              payload: { beneficiary_id: "${b_id}", employer_name: "ACME", employer_size: 30, coverage_start_month: "2024-01" }
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { ec_flag: "$.data.is_drug_coverage_creditable", ec_ver: "$.data.verification_status", ec_rec: "$.data.record_status" }
          assert:
            - "is_drug_coverage_creditable == false (default applied)"
            - "verification_status == UNVERIFIED, record_status == ACTIVE_COVERAGE (initial states)"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: terminate_already_terminated_enrollment_rejected
        claim_type: terminal_lockdown
        grounds: [state_machines.CoverageEnrollment.enrollment_status, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "TERMINATED is terminal: a second terminate is rejected and fires no side effects."
        test_recipe:
          setup:
            - "Beneficiary DOB 1960-12-05; PART_B enrolled at clock 2025-12-10 (effective 2026-01); activated by cycle at 2026-01-05"
            - "terminated at clock 2026-06-10 (end_month 2026-06)"
          setup_api_calls:
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "Term Inal", date_of_birth: "1960-12-05" }
              as: FieldOfficer
              captures: { b_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-12-10T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /medicare/enrollments"
              payload: { beneficiary_id: "${b_id}", part: "PART_B" }
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { e_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /_ops/run_monthly_cycle"
              as: BenefitAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /medicare/enrollments/${e_id}/terminate"
              payload: {}
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { e_status: "$.data.enrollment_status", e_end: "$.data.end_month" }
          trigger:
            - call: "POST /medicare/enrollments/${e_id}/terminate"
              payload: {}
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "first terminate: enrollment_status == TERMINATED, end_month == \"2026-06\", collection_status == CLOSED"
            - "second terminate: http 409, error_id == ERR_INVALID_STATE; end_month stays \"2026-06\""
      - name: terminate_pending_enrollment_cancels_without_end_month
        claim_type: valid_transition
        grounds: [state_machines.CoverageEnrollment.PENDING_to_CANCELLED]
        distinguishing_aspect: "Terminating a PENDING enrollment takes the CANCELLED branch (no coverage ever began): end_month stays null and collection closes."
        test_recipe:
          setup: ["Beneficiary DOB 1961-04-12; PART_B enrolled at clock 2026-05-10 (effective 2026-06, still PENDING)"]
          setup_api_calls:
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "Pen Ding", date_of_birth: "1961-04-12" }
              as: FieldOfficer
              captures: { b_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /medicare/enrollments"
              payload: { beneficiary_id: "${b_id}", part: "PART_B" }
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { e_id: "$.data.id", e_status: "$.data.enrollment_status" }
          trigger:
            - call: "POST /medicare/enrollments/${e_id}/terminate"
              payload: {}
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { e_status2: "$.data.enrollment_status", e_end2: "$.data.end_month", e_coll2: "$.data.collection_status" }
          assert:
            - "before: enrollment_status == PENDING (effective 2026-06 > clock 2026-05)"
            - "after: enrollment_status == CANCELLED, end_month == null, collection_status == CLOSED"
      - name: adjudicate_terminal_appeal_rejected
        claim_type: terminal_lockdown
        grounds: [state_machines.AppealCase.status, "validations[priority=16]", "errors[ERR_APPEAL_NOT_REVIEWABLE]"]
        distinguishing_aspect: "A DENIED appeal is terminal: a later adjudication attempt fails with the appeal-specific state error."
        test_recipe:
          setup:
            - "Rate schedule 2027; beneficiary DOB 1960-01-15; PART_B enrolled 2025-01-10; tax 2025 (15000000) present"
            - "FINAL determination 2027/PART_B by fo-100; appeal filed; DENIED by ao-200"
          setup_api_calls:
            - call: "POST /medicare/rate-schedules"
              payload: { coverage_year: 2027, part_b_standard_cents: 19000, part_d_national_base_cents: 3600, irmaa_brackets: [ { tier: 0, single_floor_cents: 0, joint_floor_cents: 0, part_b_surcharge_cents: 0, part_d_surcharge_cents: 0 }, { tier: 1, single_floor_cents: 10000000, joint_floor_cents: 20000000, part_b_surcharge_cents: 7600, part_d_surcharge_cents: 1400 }, { tier: 2, single_floor_cents: 13300000, joint_floor_cents: 26600000, part_b_surcharge_cents: 19000, part_d_surcharge_cents: 3620 }, { tier: 3, single_floor_cents: 16700000, joint_floor_cents: 33400000, part_b_surcharge_cents: 30400, part_d_surcharge_cents: 5830 }, { tier: 4, single_floor_cents: 20000000, joint_floor_cents: 40000000, part_b_surcharge_cents: 41800, part_d_surcharge_cents: 8060 }, { tier: 5, single_floor_cents: 50000000, joint_floor_cents: 75000000, part_b_surcharge_cents: 45600, part_d_surcharge_cents: 8810 } ] }
              as: BenefitAdministrator
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "Ap Peal", date_of_birth: "1960-01-15" }
              as: FieldOfficer
              captures: { b_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-01-10T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /medicare/enrollments"
              payload: { beneficiary_id: "${b_id}", part: "PART_B" }
              as: Beneficiary
              as_user_id: "${b_id}"
            - call: "POST /medicare/tax-records"
              payload: { beneficiary_id: "${b_id}", tax_year: 2025, magi_cents: 15000000, filing_status: "SINGLE" }
              as: IrsDataAgent
            - call: "POST /medicare/premium-determinations"
              payload: { beneficiary_id: "${b_id}", coverage_year: 2027, part: "PART_B" }
              as: FieldOfficer
              as_user_id: "fo-100"
              captures: { det_id: "$.data.id" }
            - call: "POST /medicare/appeals"
              payload: { premium_determination_id: "${det_id}", life_event_type: "DIVORCE", event_date: "2026-08-15", claimed_magi_cents: 8000000 }
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { ap_id: "$.data.id" }
            - call: "POST /medicare/appeals/${ap_id}/adjudicate"
              payload: { decision: "DENIED" }
              as: AppealsOfficer
              as_user_id: "ao-200"
          trigger:
            - call: "POST /medicare/appeals/${ap_id}/adjudicate"
              payload: { decision: "APPROVED" }
              as: AppealsOfficer
              as_user_id: "ao-200"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_APPEAL_NOT_REVIEWABLE; the appeal stays DENIED; no new determination is created"
      - name: employer_record_reverify_after_rejection_cycle
        claim_type: valid_transition
        grounds: [state_machines.EmployerCoverageRecord.verification_status]
        distinguishing_aspect: "The verification machine is cyclic: REJECTED -> VERIFIED via a later verify call (resubmission)."
        test_recipe:
          setup: ["beneficiary with one UNVERIFIED employer record"]
          setup_api_calls:
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "Re Verify", date_of_birth: "1961-03-10" }
              as: FieldOfficer
              captures: { b_id: "$.data.id" }
            - call: "POST /medicare/employer-coverages"
              payload: { beneficiary_id: "${b_id}", employer_name: "ACME", employer_size: 30, coverage_start_month: "2024-01" }
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { ec_id: "$.data.id" }
          trigger:
            - call: "POST /medicare/employer-coverages/${ec_id}/verify"
              payload: { decision: "REJECTED" }
              as: FieldOfficer
              as_user_id: "fo-100"
              captures: { ec_s1: "$.data.verification_status" }
            - call: "POST /medicare/employer-coverages/${ec_id}/verify"
              payload: { decision: "VERIFIED" }
              as: FieldOfficer
              as_user_id: "fo-100"
              captures: { ec_s2: "$.data.verification_status" }
          assert:
            - "first verify: verification_status == REJECTED"
            - "second verify (cycle): verification_status == VERIFIED"
      - name: withholding_resume_blocked_when_benefit_still_insufficient
        claim_type: precondition_enforcement
        grounds: [state_machines.WithholdingArrangement.SUSPENDED_to_ACTIVE]
        distinguishing_aspect: "Adjusting a SUSPENDED arrangement to a benefit (20000) still below the total monthly premium (21950) leaves it SUSPENDED — the resume precondition is a computed comparison, not a formality."
        test_recipe:
          setup:
            - "Rate schedule 2026; beneficiary DOB 1961-04-12; PART_B + PART_D enrolled at 2026-05-10 (both effective 2026-06)"
            - "arrangement 21000; cycle at 2026-06-05 -> shortfall suspension (total due 21950 > 21000)"
          setup_api_calls:
            - call: "POST /medicare/rate-schedules"
              payload: { coverage_year: 2026, part_b_standard_cents: 18500, part_d_national_base_cents: 3450, irmaa_brackets: [ { tier: 0, single_floor_cents: 0, joint_floor_cents: 0, part_b_surcharge_cents: 0, part_d_surcharge_cents: 0 }, { tier: 1, single_floor_cents: 10000000, joint_floor_cents: 20000000, part_b_surcharge_cents: 7400, part_d_surcharge_cents: 1370 }, { tier: 2, single_floor_cents: 13300000, joint_floor_cents: 26600000, part_b_surcharge_cents: 18500, part_d_surcharge_cents: 3530 }, { tier: 3, single_floor_cents: 16700000, joint_floor_cents: 33400000, part_b_surcharge_cents: 29590, part_d_surcharge_cents: 5680 }, { tier: 4, single_floor_cents: 20000000, joint_floor_cents: 40000000, part_b_surcharge_cents: 40680, part_d_surcharge_cents: 7850 }, { tier: 5, single_floor_cents: 50000000, joint_floor_cents: 75000000, part_b_surcharge_cents: 44390, part_d_surcharge_cents: 8580 } ] }
              as: BenefitAdministrator
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "Re Sume", date_of_birth: "1961-04-12" }
              as: FieldOfficer
              captures: { b_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /medicare/enrollments"
              payload: { beneficiary_id: "${b_id}", part: "PART_B" }
              as: Beneficiary
              as_user_id: "${b_id}"
            - call: "POST /medicare/enrollments"
              payload: { beneficiary_id: "${b_id}", part: "PART_D" }
              as: Beneficiary
              as_user_id: "${b_id}"
            - call: "POST /medicare/withholding-arrangements"
              payload: { beneficiary_id: "${b_id}", monthly_benefit_cents: 21000 }
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { wa_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /_ops/run_monthly_cycle"
              as: BenefitAdministrator
          trigger:
            - call: "POST /medicare/withholding-arrangements/${wa_id}/adjust"
              payload: { monthly_benefit_cents: 20000 }
              as: BenefitAdministrator
              captures: { wa_status: "$.data.status", wa_benefit: "$.data.monthly_benefit_cents" }
          assert:
            - "adjust succeeds (200) and monthly_benefit_cents == 20000"
            - "status stays SUSPENDED (20000 < 21950) — resume precondition fails silently by design, no error"
      - name: enrollment_period_status_tracks_clock_across_cycles
        claim_type: valid_transition
        grounds: [state_machines.EnrollmentPeriod.status]
        distinguishing_aspect: "The IEP row walks UPCOMING -> OPEN -> EXPIRED purely from clock position at creation and at two monthly cycles."
        test_recipe:
          setup: ["beneficiary DOB 1961-12-14 created at clock 2026-06-01 (IEP [2026-09, 2027-03] not yet open)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "Peri Od", date_of_birth: "1961-12-14" }
              as: FieldOfficer
              captures: { b_id: "$.data.id" }
            - call: "GET /medicare/beneficiaries/${b_id}/enrollment-periods"
              as: FieldOfficer
              captures: { p_status_0: "$.data[0].status" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /_ops/run_monthly_cycle"
              as: BenefitAdministrator
            - call: "GET /medicare/beneficiaries/${b_id}/enrollment-periods"
              as: FieldOfficer
              captures: { p_status_1: "$.data[0].status" }
            - call: "POST /_clock/set_current_utc"
