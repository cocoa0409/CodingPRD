              as: AssessorAnalyst
              as_user_id: "analyst-01"
              captures: { p1_id: $.data.id, p1_v: $.data.version }
            - call: "POST /parcels"
              payload: { apn: "P-0003", situs_address_normalized: "300 PINE CT NORTHFIELD ST 10001", county_zone: "NORTH", tax_year: 2026, base_year: 2026, base_year_value_cents: 40000000, market_value_cents: 45000000, assessment_cap_pct_bps: 200 }
