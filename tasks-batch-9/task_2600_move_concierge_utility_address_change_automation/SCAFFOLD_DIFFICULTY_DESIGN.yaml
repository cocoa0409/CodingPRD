  - rule_id: cross_entity_state_dependency
    instances:
      - name: filing_submission_blocked_by_revoked_utility_consent
        grounds:
          - state_machines.AddressChangeFiling.DRAFT_to_SUBMITTED
          - state_machines.ConsentRecord.GRANTED_to_REVOKED
          - state_machines.ConsentRecord.CREATION_to_GRANTED
          - "validations[priority=21]"
        distinguishing_aspect: |
          Entity pair ConsentRecord -> AddressChangeFiling: the filing sits in DRAFT, which is a perfectly
          legal from-state for DRAFT_to_SUBMITTED, and every other precondition holds; the ONLY thing that
          blocks submission is the state of a different entity (a REVOKED UTILITY_SETUP ConsentRecord
          driving MoveRecord.consent_gate to BLOCKED). Recording a fresh GRANTED consent for that scope
          reopens the gate and the identical submission call then succeeds, so the dependency is on the
          other entity's live state and not on anything stored on the filing.
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z."
            - "Resident with GRANTED consents for UTILITY_SETUP and USPS_FILING (both move_id null)."
            - "Move for 2026-08-20 verified by KBA; one filing created and left in DRAFT."
            - "The UTILITY_SETUP consent is revoked, so consent_gate is BLOCKED while the USPS_FILING consent stays GRANTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /feed-sources"
              payload: { name: "Metro PM Feed", source_type: "PROPERTY_MANAGER", referral_revenue_share_pct: 0.1750, dedupe_window_days: 30, trust_tier: "TIER_B" }
              as: PlatformAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "Dana Ruiz", email: "dana.ruiz@example.com", phone_last4: "4417", date_of_birth: "1988-04-12", ssn_last4: "6621" }
              as: PlatformAdmin
              captures: { res_id: $.data.id, res_v1: $.data.version }
            - call: "POST /service-addresses"
              payload: { line1: "18 Maple Ct", city: "Atlanta", state_code: "GA", postal_code: "30301" }
              as: PlatformAdmin
              captures: { orig_id: $.data.id }
            - call: "POST /service-addresses"
              payload: { line1: "402 Peachtree Way", unit: "7B", city: "Atlanta", state_code: "GA", postal_code: "30302" }
              as: PlatformAdmin
              captures: { dest_id: $.data.id }
            - call: "POST /moves"
              payload: { resident_id: "${res_id}", feed_source_id: "${fs_id}", origin_address_id: "${orig_id}", destination_address_id: "${dest_id}", move_date: "2026-08-20" }
              as: MoveOpsAgent
              captures: { mv_id: $.data.id }
            - call: "POST /residents/${res_id}/consent-records"
              payload: { scope: "UTILITY_SETUP", source_channel: "PM_FEED", consent_text_version: "v3", expected_resident_version: "${res_v1}" }
              as: MoveOpsAgent
              captures: { cs_util_id: $.data.id }
            - call: "GET /residents/${res_id}"
              payload: {}
              as: MoveOpsAgent
              captures: { res_v2: $.data.version }
            - call: "POST /residents/${res_id}/consent-records"
              payload: { scope: "USPS_FILING", source_channel: "PM_FEED", consent_text_version: "v3", expected_resident_version: "${res_v2}" }
              as: MoveOpsAgent
              captures: { cs_usps_id: $.data.id }
            - call: "POST /moves/${mv_id}/identity-verifications"
              payload: { method: "KBA" }
              as: MoveOpsAgent
              captures: { idv_id: $.data.id }
            - call: "POST /identity-verifications/${idv_id}/kba-result"
              payload: { outcome: "PASSED", score: 720 }
              as: ExternalServiceGateway
            - call: "POST /moves/${mv_id}/address-change-filings"
              payload: { filing_type: "INDIVIDUAL", forward_start_date: "2026-08-20" }
              as: MoveOpsAgent
              captures: { f_id: $.data.id }
            - call: "POST /consent-records/${cs_util_id}/revocation"
