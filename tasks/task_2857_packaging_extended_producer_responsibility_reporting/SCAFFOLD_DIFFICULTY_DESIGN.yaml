              payload: {}
              as: ProgramRegulator
              as_user_id: "reg-1"
            - call: "POST /epr/registrations"
              payload: { producer_id: "${pf_id}", state_program_id: "${sp_ca_id}" }
              as: ProducerComplianceOfficer
              as_user_id: "${pf_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /epr/registrations/${reg_id}/submit"
              payload: {}
              as: ProducerComplianceOfficer
              as_user_id: "${pf_id}"
            - call: "POST /epr/registrations/${reg_id}/decide"
