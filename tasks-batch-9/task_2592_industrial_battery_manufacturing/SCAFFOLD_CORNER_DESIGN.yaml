            - call: POST /production-lots/${lot_id}/sampling-plans
              as: QualityInspector
              as_user_id: "${qa_a_id}"
              payload: { expected_lot_version: "${lot_v1}", plan_reason: "stale token on a held lot" }
              captures: { err_stale_while_held: "$.data.error_id" }
            - call: GET /production-lots/${lot_id}
              as: QualityInspector
              as_user_id: "${qa_a_id}"
              captures: { lot_v2: "$.data.version" }
            - call: POST /production-lots/${lot_id}/sampling-plans
              as: QualityInspector
              as_user_id: "${qa_a_id}"
              payload: { expected_lot_version: "${lot_v2}", plan_reason: "fresh token on a held lot" }
              captures: { err_held: "$.data.error_id" }
            - call: POST /production-lots/${lot_id}/env-hold
              as: SafetyOfficer
              as_user_id: "${safety_a_id}"
              payload: { action: RELEASE_HOLD }
            - call: POST /production-lots/${lot_id}/sampling-plans
              as: QualityInspector
              as_user_id: "${qa_a_id}"
              payload: { expected_lot_version: "${lot_v2}", plan_reason: "token invalidated by the hold release" }
              captures: { err_stale_after_release: "$.data.error_id" }
            - call: GET /production-lots/${lot_id}
              as: QualityInspector
              as_user_id: "${qa_a_id}"
