            - call: "GET /eas/solicitations/${sol_id}/ranking"
              payload: {}
              as: SelectionOfficer
              as_user_id: "officer-1"
            - call: "GET /eas/solicitations/${sol_id}"
              payload: {}
              as: CommunityRepresentative
              as_user_id: "${comm_id}"
              captures: { sol_v2: $.data.version }
            - call: "POST /eas/solicitations/${sol_id}/preferences"
