              payload: {}
              as: QualityAnalyst
              captures: { g2_protein: $.data.composite_protein_pct, g2_dev: $.data.deviation_index, g2_label: $.data.label_compliance }
          assert:
            - "B1 composite_protein_pct == 25.0 (plain mean of two spot samples, weight 1 each)"
            - "B1 deviation_index == 3.0 (3.0 x protein deficit 1.0; all other nutrients within guarantee)"
            - "B1 label_compliance == MISBRANDED (deviation_index > 0)"
            - "B2 composite_protein_pct == 27.0, deviation_index == 0.0, label_compliance == COMPLIANT"

