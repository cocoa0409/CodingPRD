          assert:
            - "${all_status} == 200"
            - "${all_total} == 2"
            - "${draft_total} == 1"
            - "${appr_total} == 1"
            - "TargetMarket.${tm1_id}.state == APPROVED"
            - "TargetMarket.${tm2_id}.state == DRAFT"
            - "TargetMarket.${tm2_id}.census_tract_codes == [36005011200, 36005011300]"
            - "TargetMarket.${tm2_id}.approved_at == null"
      - name: servicing_run_returns_the_recomputed_institution_and_bumps_its_version
        claim_type: computed_read
        grounds:
          - endpoints[POST /cdfi/institutions/{institution_id}/servicing-runs]
          - calculations.reserve_coverage_and_posture
        distinguishing_aspect: |
          The run's declared output is the Institution itself, so the response body - not a
          follow-up read - must carry the recomputed reserve figures. On a loan-free institution
          both requirements are 0, the ratio is pinned at 1.0000 and the posture is COMPLIANT,
          yet each run still increments version, so two runs take version 1 -> 3.
        test_recipe:
          setup:
            - "One institution with no loans and loss_reserve_balance_cents 0."
          setup_api_calls:
            - call: "POST /cdfi/institutions"
              payload: { legal_name: "Harborline Community Fund", ein: "210000038", entity_type: "LOAN_FUND", primary_mission_statement: "Primary mission of community development finance for underserved households and small businesses.", asset_size_cents: 250000000, reserve_method: "MIGRATION_ANALYSIS", loss_reserve_balance_cents: 0 }
              as: InstitutionOfficer
              captures: { inst_id: $.data.id }
            - call: "POST /cdfi/institutions/${inst_id}/servicing-runs"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "ops-1"
              captures: { r1_status: $.status, r1_version: $.data.version, r1_ratio: $.data.reserve_coverage_ratio, r1_posture: $.data.compliance_posture }
          trigger:
            - call: "POST /cdfi/institutions/${inst_id}/servicing-runs"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "ops-1"
              captures: { r2_status: $.status, r2_version: $.data.version, r2_required: $.data.loss_reserve_required_cents, r2_deficit: $.data.reserve_deficit_cents }
          assert:
            - "${r1_status} == 200"
            - "${r1_version} == 2"
            - "${r1_ratio} == 1.0000"
            - "${r1_posture} == COMPLIANT"
            - "${r2_status} == 200"
            - "${r2_version} == 3"
            - "${r2_required} == 0"
            - "${r2_deficit} == 0"
            - "Institution.${inst_id}.loss_reserve_required_migration_cents == 0"
            - "Institution.${inst_id}.loss_reserve_required_static_cents == 0"
            - "Institution.${inst_id}.compliance_posture == COMPLIANT"
      - name: resume_draws_on_a_draft_award_is_a_state_error_not_a_posture_error
        claim_type: conditional_action
        grounds:
          - endpoints[POST /cdfi/award-applications/{award_id}/resume-draws]
          - validations[priority=50]
          - validations[priority=62]
        distinguishing_aspect: |
          resume-draws is only meaningful from DRAW_SUSPENDED. On a DRAFT award held by a
          loan-free institution the posture rung at priority 62 is satisfied (COMPLIANT), so the
          answer must be the priority-50 409 ERR_INVALID_STATE_TRANSITION and the award must stay
          DRAFT with suspension_reason null.
        test_recipe:
          setup:
            - "One loan-free institution, therefore compliance_posture COMPLIANT."
            - "One DRAFT CMF award for 5,000,000 cents at match_ratio_pct 100.00."
          setup_api_calls:
            - call: "POST /cdfi/institutions"
              payload: { legal_name: "Harborline Community Fund", ein: "210000039", entity_type: "LOAN_FUND", primary_mission_statement: "Primary mission of community development finance for underserved households and small businesses.", asset_size_cents: 250000000, reserve_method: "MIGRATION_ANALYSIS", loss_reserve_balance_cents: 0 }
              as: InstitutionOfficer
              captures: { inst_id: $.data.id, posture: $.data.compliance_posture }
            - call: "POST /cdfi/institutions/${inst_id}/award-applications"
              payload: { program: "CMF", requested_amount_cents: 5000000, match_ratio_pct: 100.00, performance_goal_jobs: 0, performance_goal_housing_units: 25, period_start: "2027-01-01T00:00:00Z", period_end: "2027-12-31T00:00:00Z" }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { award_id: $.data.id }
          trigger:
            - call: "POST /cdfi/award-applications/${award_id}/resume-draws"
              payload: {}
              as: AwardAdministrator
              as_user_id: "adm-1"
              captures: { rs_status: $.status, rs_code: $.data.error_id }
          assert:
            - "${posture} == COMPLIANT"
            - "${rs_status} == 409"
            - "${rs_code} == ERR_INVALID_STATE_TRANSITION"
            - "AwardApplication.${award_id}.state == DRAFT"
            - "AwardApplication.${award_id}.suspension_reason == null"
            - "AwardApplication.${award_id}.version == 1"
      - name: refinance_link_is_stored_and_filterable_in_both_directions
