          raw 73 produce three different weighted totals: 25/15/14/19 -> 74.20,
          19/15/14/25 -> 71.80 and 18/17/20/18 -> 73.00. An unweighted implementation would
          return 73.00 for all three and a provisional composite of 73.00 by accident, so
          the per-sheet values are the discriminator, not the mean.
