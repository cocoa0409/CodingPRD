  - rule_id: resource_temporal_overlap
    instances:
      - name: press_run_washup_buffer_overlap
        grounds:
          - calculations.press_window_conflict
          - calculations.press_run_duration
          - errors[ERR_PRESS_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Resource Press, pairwise interval semantics WITH trailing buffer:
          run A (21000 impressions -> 171 min) occupies [08:00, 10:51 + 30 min)
          = up to 11:21; a candidate at 11:20 conflicts while one at exactly
          11:21 is admitted (half-open boundary with buffer).
        test_recipe:
          setup:
            - "Press W (10000 iph, MR 45, washup 30); jobs JA and JB each Q=21000 single signature up=1 (planned_impressions 21000, duration 171 min), both PLATED; paper 100000 sheets available"
