              payload: { branch_id: "${br_id}", currency_code: "CHF", wholesale_rate_id: "${wr_id}", buy_spread_bps: 555, sell_spread_bps: 445, board_display_label: "CHF Swiss Franc", disclosure_text_version: 3, effective_from: "2026-07-01T00:00:00Z", expected_branch_version: "${br_v0}" }
