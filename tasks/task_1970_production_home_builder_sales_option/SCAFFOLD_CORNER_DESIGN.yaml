            - { call: "POST /homebuilder/plans", payload: { community_id: "${c_id}", plan_name: "Maple", base_price_cents: 35000000, elevations: [ { name: "A", price_cents: 0 }, { name: "B", price_cents: 250000 } ] }, as: SalesDirector, captures: { pl_id: $.data.id } }
            - { call: "POST /homebuilder/option-catalog-items", payload: { community_id: "${c_id}", option_name: "EV Outlet", category: "ELECTRICAL", price_cents: 150000, cutoff_stage: "DRYWALL", install_stage: "FINAL_WALKTHROUGH" }, as: SalesDirector, captures: { op_ev: $.data.id } }
            - { call: "POST /homebuilder/lots", payload: { community_id: "${c_id}", lot_number: "L-101", base_price_cents: 8000000, lot_type: "CORNER", view_adjustment_cents: 200000 }, as: SalesDirector, captures: { lot_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_id}/release", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/buyers", payload: { full_name: "Bea Buyer", email: "bea@example.com" }, as: Anonymous, captures: { b_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_id}/reserve", payload: { buyer_id: "${b_id}" }, as: Buyer, as_user_id: "${b_id}", captures: { lot_v: $.data.version } }
            - { call: "POST /homebuilder/agreements", payload: { buyer_id: "${b_id}", lot_id: "${lot_id}", plan_id: "${pl_id}", elevation_name: "B", earnest_money_deposited_cents: 500000, contingency_deadline: "2026-08-21T00:00:00Z", outside_close_date: "2027-03-01T00:00:00Z", has_sale_of_home_contingency: false, expected_lot_version: "${lot_v}" }, as: SalesAgent, captures: { agr_id: $.data.id } }
            - { call: "POST /homebuilder/agreements/${agr_id}/sign", payload: {}, as: Buyer, as_user_id: "${b_id}" }
            - { call: "POST /homebuilder/option-selections", payload: { agreement_id: "${agr_id}", option_item_id: "${op_ev}", quantity: 2 }, as: Buyer, as_user_id: "${b_id}", captures: { sel_e: $.data.id } }
            - { call: "POST /homebuilder/option-selections/${sel_e}/confirm", payload: {}, as: Buyer, as_user_id: "${b_id}" }
            - { call: "GET /homebuilder/milestones?agreement_id=${agr_id}", payload: {}, as: SalesAgent, captures: { m1: "$.data[0].id", m2: "$.data[1].id", m3: "$.data[2].id", m4: "$.data[3].id" } }
            - { call: "POST /homebuilder/milestones/${m1}/complete", payload: {}, as: ConstructionManager }
            - { call: "POST /homebuilder/milestones/${m2}/complete", payload: {}, as: ConstructionManager }
            - { call: "POST /homebuilder/milestones/${m3}/complete", payload: {}, as: ConstructionManager }
            - { call: "POST /homebuilder/milestones/${m4}/complete", payload: {}, as: ConstructionManager }
          trigger:
            - { call: "POST /homebuilder/option-selections/${sel_e}/cancel", payload: {}, as: Buyer, as_user_id: "${b_id}", captures: { fee: $.data.change_fee_cents } }
          assert:
            - "Pre-trigger: OptionSelection.${sel_e}.status == CONFIRMED at current_stage FINAL_WALKTHROUGH (install sweep requires ordinal > 5)"
            - "change_fee_cents == 30000 (round_half_up(300000 * 0.10)); status == CANCELLED, cancel_reason == BUYER_REQUEST"
            - "PurchaseAgreement.${agr_id}.change_fees_total_cents == 30000 and options_total_cents == 0"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: reserve_draft_lot_returns_not_released
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_LOT_NOT_RELEASED]"]
        distinguishing_aspect: "Reserving a DRAFT (never released) lot fails with ERR_LOT_NOT_RELEASED; the reserve endpoint admits only RELEASED lots."
        test_recipe:
          setup: ["Community SELLING; lot L-101 in DRAFT; buyer registered"]
          setup_api_calls:
            - { call: "POST /homebuilder/communities", payload: { name: "Cedar Ridge", incentive_budget_total_cents: 1000000 }, as: SalesDirector, captures: { c_id: $.data.id } }
            - { call: "POST /homebuilder/communities/${c_id}/open-sales", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/lots", payload: { community_id: "${c_id}", lot_number: "L-101", base_price_cents: 8000000, lot_type: "CORNER", view_adjustment_cents: 0 }, as: SalesDirector, captures: { lot_id: $.data.id } }
            - { call: "POST /homebuilder/buyers", payload: { full_name: "Bea Buyer", email: "bea@example.com" }, as: Anonymous, captures: { b_id: $.data.id } }
          trigger:
            - { call: "POST /homebuilder/lots/${lot_id}/reserve", payload: { buyer_id: "${b_id}" }, as: Buyer, as_user_id: "${b_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_LOT_NOT_RELEASED; lot stays DRAFT with release_price_cents null"

      - name: agreement_create_plan_from_other_community_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_PLAN_NOT_IN_COMMUNITY]"]
        distinguishing_aspect: "The plan must belong to the lot's community: pairing a community-2 plan with a community-1 lot fails with ERR_PLAN_NOT_IN_COMMUNITY (422) after state and OCC checks pass."
        test_recipe:
          setup: ["Community 1 SELLING with lot L-101 RELEASED and reserved by Bea; community 2 with plan Aspen"]
          setup_api_calls:
            - { call: "POST /homebuilder/communities", payload: { name: "Cedar Ridge", incentive_budget_total_cents: 1000000 }, as: SalesDirector, captures: { c_id: $.data.id } }
            - { call: "POST /homebuilder/communities/${c_id}/open-sales", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/price-phases", payload: { community_id: "${c_id}", phase_name: "P1", uplift_pct: 0.03, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }, as: SalesDirector }
            - { call: "POST /homebuilder/lots", payload: { community_id: "${c_id}", lot_number: "L-101", base_price_cents: 8000000, lot_type: "CORNER", view_adjustment_cents: 0 }, as: SalesDirector, captures: { lot_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_id}/release", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/buyers", payload: { full_name: "Bea Buyer", email: "bea@example.com" }, as: Anonymous, captures: { b_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_id}/reserve", payload: { buyer_id: "${b_id}" }, as: Buyer, as_user_id: "${b_id}", captures: { lot_v: $.data.version } }
            - { call: "POST /homebuilder/communities", payload: { name: "Aspen Grove", incentive_budget_total_cents: 1000000 }, as: SalesDirector, captures: { c2_id: $.data.id } }
            - { call: "POST /homebuilder/plans", payload: { community_id: "${c2_id}", plan_name: "Aspen", base_price_cents: 30000000, elevations: [ { name: "A", price_cents: 0 } ] }, as: SalesDirector, captures: { pl2_id: $.data.id } }
          trigger:
            - { call: "POST /homebuilder/agreements", payload: { buyer_id: "${b_id}", lot_id: "${lot_id}", plan_id: "${pl2_id}", elevation_name: "A", earnest_money_deposited_cents: 500000, contingency_deadline: "2026-08-21T00:00:00Z", outside_close_date: "2027-03-01T00:00:00Z", has_sale_of_home_contingency: false, expected_lot_version: "${lot_v}" }, as: SalesAgent, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PLAN_NOT_IN_COMMUNITY (referential, priority 10)"

      - name: agreement_create_unknown_elevation_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_ELEVATION_NOT_AVAILABLE]"]
        distinguishing_aspect: "elevation_name must be one of the plan's elevations: choosing Z on a plan offering A/B fails with ERR_ELEVATION_NOT_AVAILABLE (422)."
        test_recipe:
          setup: ["Default fixtures through lot reserved by Bea (plan Maple, elevations A/B)"]
          setup_api_calls:
            - { call: "POST /homebuilder/communities", payload: { name: "Cedar Ridge", incentive_budget_total_cents: 1000000 }, as: SalesDirector, captures: { c_id: $.data.id } }
            - { call: "POST /homebuilder/communities/${c_id}/open-sales", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/plans", payload: { community_id: "${c_id}", plan_name: "Maple", base_price_cents: 35000000, elevations: [ { name: "A", price_cents: 0 }, { name: "B", price_cents: 250000 } ] }, as: SalesDirector, captures: { pl_id: $.data.id } }
            - { call: "POST /homebuilder/lots", payload: { community_id: "${c_id}", lot_number: "L-101", base_price_cents: 8000000, lot_type: "CORNER", view_adjustment_cents: 0 }, as: SalesDirector, captures: { lot_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_id}/release", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/buyers", payload: { full_name: "Bea Buyer", email: "bea@example.com" }, as: Anonymous, captures: { b_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_id}/reserve", payload: { buyer_id: "${b_id}" }, as: Buyer, as_user_id: "${b_id}", captures: { lot_v: $.data.version } }
          trigger:
            - { call: "POST /homebuilder/agreements", payload: { buyer_id: "${b_id}", lot_id: "${lot_id}", plan_id: "${pl_id}", elevation_name: "Z", earnest_money_deposited_cents: 500000, contingency_deadline: "2026-08-21T00:00:00Z", outside_close_date: "2027-03-01T00:00:00Z", has_sale_of_home_contingency: false, expected_lot_version: "${lot_v}" }, as: SalesAgent, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ELEVATION_NOT_AVAILABLE"

      - name: agreement_create_earnest_below_minimum_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_EARNEST_BELOW_MINIMUM]", "calculations.earnest_money_refund"]
        distinguishing_aspect: "earnest_money_deposited_cents below MIN_EARNEST_CENTS (100000) fails with ERR_EARNEST_BELOW_MINIMUM (402); exactly 100000 is accepted."
        test_recipe:
          setup: ["Default fixtures through lot reserved by Bea"]
          setup_api_calls:
            - { call: "POST /homebuilder/communities", payload: { name: "Cedar Ridge", incentive_budget_total_cents: 1000000 }, as: SalesDirector, captures: { c_id: $.data.id } }
            - { call: "POST /homebuilder/communities/${c_id}/open-sales", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/plans", payload: { community_id: "${c_id}", plan_name: "Maple", base_price_cents: 35000000, elevations: [ { name: "A", price_cents: 0 }, { name: "B", price_cents: 250000 } ] }, as: SalesDirector, captures: { pl_id: $.data.id } }
            - { call: "POST /homebuilder/lots", payload: { community_id: "${c_id}", lot_number: "L-101", base_price_cents: 8000000, lot_type: "CORNER", view_adjustment_cents: 0 }, as: SalesDirector, captures: { lot_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_id}/release", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/buyers", payload: { full_name: "Bea Buyer", email: "bea@example.com" }, as: Anonymous, captures: { b_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_id}/reserve", payload: { buyer_id: "${b_id}" }, as: Buyer, as_user_id: "${b_id}", captures: { lot_v: $.data.version } }
          trigger:
            - { call: "POST /homebuilder/agreements", payload: { buyer_id: "${b_id}", lot_id: "${lot_id}", plan_id: "${pl_id}", elevation_name: "B", earnest_money_deposited_cents: 50000, contingency_deadline: "2026-08-21T00:00:00Z", outside_close_date: "2027-03-01T00:00:00Z", has_sale_of_home_contingency: false, expected_lot_version: "${lot_v}" }, as: SalesAgent, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_EARNEST_BELOW_MINIMUM (50000 < 100000)"

      - name: duplicate_lot_number_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_DUPLICATE_LOT_NUMBER]"]
        distinguishing_aspect: "lot_number is unique per community: a second L-101 in the same community fails with ERR_DUPLICATE_LOT_NUMBER; the same number in a different community succeeds."
        test_recipe:
          setup: ["Community 1 with lot L-101; community 2 without lots"]
          setup_api_calls:
            - { call: "POST /homebuilder/communities", payload: { name: "Cedar Ridge", incentive_budget_total_cents: 1000000 }, as: SalesDirector, captures: { c_id: $.data.id } }
            - { call: "POST /homebuilder/lots", payload: { community_id: "${c_id}", lot_number: "L-101", base_price_cents: 8000000, lot_type: "CORNER", view_adjustment_cents: 0 }, as: SalesDirector }
            - { call: "POST /homebuilder/communities", payload: { name: "Aspen Grove", incentive_budget_total_cents: 1000000 }, as: SalesDirector, captures: { c2_id: $.data.id } }
          trigger:
            - { call: "POST /homebuilder/lots", payload: { community_id: "${c_id}", lot_number: "L-101", base_price_cents: 9000000, lot_type: "STANDARD", view_adjustment_cents: 0 }, as: SalesDirector, captures: { err: $.data.error_id } }
            - { call: "POST /homebuilder/lots", payload: { community_id: "${c2_id}", lot_number: "L-101", base_price_cents: 9000000, lot_type: "STANDARD", view_adjustment_cents: 0 }, as: SalesDirector, captures: { ok_id: $.data.id } }
          assert:
            - "Same community duplicate: error_id == ERR_DUPLICATE_LOT_NUMBER"
            - "Different community same number: created 201 (uniqueness is community-scoped)"

      - name: priority_state_vs_fiscal_on_incentive_create
        claim_type: priority_ordering
        grounds: ["validations[priority=7]", "validations[priority=11]"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / incentive_create_state_beats_fiscal"
          rationale: "The state-over-fiscal priority conflict is exactly the difficulty instance's trigger."

      - name: priority_temporal_vs_referential_on_selection_create
        claim_type: priority_ordering
        grounds: ["validations[priority=8]", "validations[priority=10]"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / selection_create_temporal_beats_referential"
          rationale: "The temporal-over-referential priority conflict is exactly the difficulty instance's trigger."

