        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z."
            - "rep_a ACTIVE COUNTY_CVSO."
            - "Forty veterans vet_1 .. vet_40, each with a VERIFIED HONORABLE DD214 and an ACCEPTED designation to rep_a, so rep_a.active_poa_count is exactly 40."
