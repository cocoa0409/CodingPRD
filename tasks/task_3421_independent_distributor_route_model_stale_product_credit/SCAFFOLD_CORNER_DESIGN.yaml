          - errors.ERR_FORBIDDEN_FOR_ROLE
        distinguishing_aspect: "Segregation of duties: the role that decides claims (RouteOpsManager) cannot issue the credit — issue-credit is exclusive to CreditAnalyst, so the approver's attempt is 403 ERR_FORBIDDEN_FOR_ROLE with the claim still APPROVED."
        test_recipe:
