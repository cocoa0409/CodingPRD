# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for operation" }
  - { id: ERR_TEAM_NOT_FOUND, http: 404, condition: "teamId does not exist" }
  - { id: ERR_SEASON_NOT_FOUND, http: 404, condition: "seasonId does not exist within team" }
  - { id: ERR_TRIP_NOT_FOUND, http: 404, condition: "tripId does not exist within team" }
  - { id: ERR_LEG_NOT_FOUND, http: 404, condition: "legId does not exist within trip" }
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "contractId does not exist within trip" }
  - { id: ERR_BLOCK_NOT_FOUND, http: 404, condition: "blockId does not exist within trip" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "memberId does not exist within trip" }
  - { id: ERR_ENTRY_NOT_FOUND, http: 404, condition: "entryId does not exist within leg manifest" }
  - { id: ERR_LEDGER_NOT_FOUND, http: 404, condition: "ledgerId does not exist within member" }
  - { id: ERR_SHIPMENT_NOT_FOUND, http: 404, condition: "shipmentId does not exist within trip" }
  - { id: ERR_EVENT_NOT_FOUND, http: 404, condition: "eventId does not exist within trip" }
  - { id: ERR_CREDENTIAL_NOT_FOUND, http: 404, condition: "credId does not exist within trip" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match current parent version" }
  - { id: ERR_TRIP_NOT_DRAFT, http: 409, condition: "Operation requires trip posture DRAFT" }
  - { id: ERR_TRIP_NOT_LOCKED, http: 409, condition: "Operation requires trip posture LOCKED" }
  - { id: ERR_TRIP_ALREADY_TERMINAL, http: 409, condition: "Trip already CLOSED or CANCELLED" }
  - { id: ERR_SEASON_CLOSED, http: 409, condition: "Season is CLOSED; no new child state permitted" }
  - { id: ERR_BLOCK_NOT_NAME_LIST_DUE, http: 409, condition: "Hotel block must be in NAME_LIST_DUE posture" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state machine precondition violation" }
  - { id: ERR_CONTRACT_NOT_VENDOR_COUNTERSIGNED, http: 409, condition: "Contract must be VENDOR_COUNTERSIGNED to execute" }
  - { id: ERR_CONTRACT_NOT_EXECUTABLE, http: 409, condition: "Contract must be TEAM_EXECUTED or ACTIVE to bind legs" }
  - { id: ERR_LEG_NOT_BOOKED, http: 409, condition: "Operation requires leg in BOOKED" }
  - { id: ERR_ENTRY_NOT_PENDING, http: 409, condition: "Manifest entry must be PENDING" }
  - { id: ERR_LEDGER_NOT_APPROVED, http: 409, condition: "Ledger must be APPROVED to pay" }
  - { id: ERR_CREDENTIAL_NOT_IN_REVIEW, http: 409, condition: "Credential must be in SECURITY_REVIEW to approve/deny" }
  - { id: ERR_REST_FLOOR_VIOLATION, http: 409, condition: "Departure too soon after prior leg arrival given league rest policy and prior delay" }
  - { id: ERR_CREDENTIAL_REQUIRED, http: 409, condition: "Member lacks APPROVED credential for destination venue" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Segregation of duties: same user cannot perform adjacent credential workflow steps" }
  - { id: ERR_ROOMMATE_INCOMPATIBLE, http: 409, condition: "Roommate constraint violated (single-room or incompatible party_role)" }
  - { id: ERR_MANIFEST_FULL, http: 409, condition: "Confirmed manifest count equals charter seat_capacity" }
  - { id: ERR_CARGO_OVERWEIGHT, http: 409, condition: "Shipment would exceed charter cargo capacity" }
  - { id: ERR_CUTOFF_PASSED, http: 409, condition: "Hotel cutoff_date has passed; room names locked" }
  - { id: ERR_CONTRACT_EXECUTION_WINDOW, http: 409, condition: "Fewer than 30 days remain before game_tipoff_utc" }
  - { id: ERR_MEMBER_NOT_IN, http: 409, condition: "Referenced member status is not IN" }
  - { id: ERR_LEG_NOT_CHARTER, http: 409, condition: "Referenced leg is not on a charter contract" }
  - { id: ERR_BUDGET_EXCEEDED, http: 402, condition: "Season committed_cost_cents + proposed change exceeds travel_budget_cents" }
  - { id: ERR_INVALID_PER_DIEM_INPUT, http: 400, condition: "meals_provided_count > 3 or day_kind invalid" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Generic request body validation failure" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: TravelOpsAdmin
    description: "Platform-level administrator; can create teams and drive the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /travel/teams"
      - "POST /travel/_clock/set_current_utc"
    shared_operations: ["GET on any resource"]

  - name: TravelManager
    description: "Team travel department head; owns trip build, party roster, charter negotiation, contingencies"
    identity: opaque
    exclusive_operations:
      - "POST /travel/teams/{teamId}/trips"
      - "POST .../trips/{tripId}/lock"
      - "POST .../trips/{tripId}/cancel"
      - "POST .../members"
      - "POST .../members/{memberId}/scratch"
      - "POST .../charter-contracts (and submit/cancel)"
      - "POST .../contingencies (and mitigate/resolve/close-noop)"
    shared_operations: ["GET on any resource"]

  - name: TravelCoordinator
    description: "Travel ops specialist; owns flight legs, manifests, hotel blocks, room assignments"
    identity: opaque
    exclusive_operations:
      - "POST .../flight-legs (and book/delay/rebook/depart/arrive/cancel)"
      - "POST .../manifest (and confirm/bump)"
      - "POST .../hotel-blocks (and lock/release)"
      - "POST .../rooms (and confirm/checkin/checkout/cancel)"
    shared_operations: ["GET on any resource"]

  - name: TravelFinanceLead
    description: "Team finance; owns seasons, budgets, per-diem, contract execution, trip close"
    identity: opaque
    exclusive_operations:
      - "POST .../seasons (and close)"
      - "POST .../charter-contracts/{id}/execute"
      - "POST .../trips/{tripId}/close"
      - "POST .../per-diem (and approve/pay/resolve)"
    shared_operations: ["GET on any resource"]

  - name: EquipmentManager
    description: "Equipment/baggage lead; owns shipments"
    identity: opaque
    exclusive_operations:
      - "POST .../equipment (and load/deliver/mark-lost)"
    shared_operations: ["GET on any resource"]

  - name: SecurityOfficer
    description: "Venue security liaison; first step of credential workflow"
    identity: opaque
    exclusive_operations:
      - "POST .../credentials/{credId}/security-review"
      - "POST .../credentials/{credId}/revoke"
    shared_operations: ["GET on any resource"]

  - name: VenueCredentialApprover
    description: "Venue-side credential approver; second step of credential workflow"
    identity: opaque
    exclusive_operations:
      - "POST .../credentials/{credId}/approve"
      - "POST .../credentials/{credId}/deny"
    shared_operations: ["GET on any resource"]

  - name: VendorRep
    description: "Charter vendor representative; counter-signs contracts"
    identity: opaque
    exclusive_operations:
      - "POST .../charter-contracts/{contractId}/countersign"
    shared_operations: []

  - name: TeamMember
    description: "Member of the travel party; can submit credential requests and dispute per-diem"
    identity: "entity_backed:TravelPartyMember"
    exclusive_operations:
      - "POST .../credentials"
      - "POST .../per-diem/{ledgerId}/dispute"
    shared_operations: ["GET on own resources"]

  - name: Any
    description: "Shared read access"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["GET endpoints"]
