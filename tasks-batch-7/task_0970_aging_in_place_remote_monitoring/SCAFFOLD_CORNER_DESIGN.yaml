  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_med_schedule_stale_version_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[med-schedule-create-stale-senior]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Senior.version: after the first schedule create bumps the senior to version 2, a second create carrying the stale expected_senior_version 1 fails 412 — two strictly sequential requests, deterministic."
        test_recipe:
          setup: ["ACTIVE senior S_oc (PLUS plan), version captured after activation; one CRITICAL schedule already created (senior now version+1)"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: "PLUS", monthly_fee_cents: 6000, included_motion_sensors: 2, extra_sensor_fee_cents: 199, max_contacts: 5, checkin_interval_hours: 48, medication_reminders_enabled: true, wellness_report_enabled: true, wellness_report_cadence: "MONTHLY" }, as: PlatformAdmin, captures: { plan_oc: $.data.id } }
