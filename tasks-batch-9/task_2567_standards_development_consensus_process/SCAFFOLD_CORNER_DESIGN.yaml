            - call: "POST /sdo/committees/${c1}/memberships"
              payload: { participant_id: "${p6}", voting_rights: false }
              as: StandardsStaff
              captures: { m6: $.data.id }
          trigger:
            - call: "GET /sdo/committees/${c1}"
              payload: {}
              as: StandardsStaff
          assert:
            - 'HTTP status == 200'
            - 'balance_status == BALANCED and dominance_pct == 33.3 (voting basis, 3 seats)'
            - 'distinct_category_count == 3 (voting basis)'
            - 'roster_balance_status == BALANCED and roster_dominance_pct == 25.0 (roster basis, 4 members)'
            - 'roster_member_count == 4'
            - 'status == ACTIVE — appointing a non-voting observer never destabilises the committee'
            - 'category_counts reports the voting-basis tallies { PRODUCER: 1, USER: 1, GENERAL_INTEREST: 1 }'

      - name: the_close_cascade_reaches_the_work_item_gate_four_hops_from_the_request
        claim_type: cascading_side_effects
        grounds:
          - endpoints[POST /sdo/ballots/{ballotId}/close]
          - state_machines[Ballot].CLOSED_to_EVALUATED
        distinguishing_aspect: "One close request must propagate through Vote, Draft and WorkItem in a fixed hop order."
        excluded_because:
          difficulty_instance: ballot_close_cascade_reaches_work_item_gate_through_vote_and_draft
          rationale: "That §1.8 cascading_side_effects instance drives exactly this close and asserts every hop in order — tallies, each CAST negative to PENDING, the draft into COMMENT_RESOLUTION, the work item unresolved_negative_count and consensus_gate BLOCKED, plus the version bumps on all four rows — so a §1.9 probe of the same cascade would restate it."

  # ===================================================================================
  # Guide section 9 — From Table 9 (Consistency model). consistency_model is immediate:
  # every cascade completes inside the request that triggered it.
  # ===================================================================================
  - section: consistency_model
    instances:

      - name: every_cascaded_counter_is_readable_in_the_first_request_after_the_close
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /sdo/ballots/{ballotId}/close]
          - calculations.consensus_gate_evaluation
        distinguishing_aspect: "There is no eventual-consistency window anywhere in the API: the response to the close already carries the recomputed tallies, and the very next reads of the vote, the draft and the work item show the fully cascaded state with no second write, no clock advance and no retry."
        test_recipe:
          setup:
            - "Three participants on distinct employer codes in three distinct interest categories (PRODUCER/ACME, USER/CITYW, GENERAL_INTEREST/SAFEL)."
            - "Committee TC-14 chaired by the PRODUCER with all three appointed as voting members, activated so balance_status is BALANCED."
            - "Work item STD-1400 scope-approved onto TC-14 and carrying revision-1 draft d1 of 40 clauses."
            - "Logical clock left at its 2026-08-01T00:00:00Z default."
            - "SUBCOMMITTEE ballot b1 open 2026-08-01 .. 2026-08-15 with two AFFIRMATIVE returns and one explained NEGATIVE, so all three seats have returned and the ballot can close immediately."
          setup_api_calls:
            - call: "POST /sdo/participants"
              payload: { full_name: "Ada Producer", organization: "Acme Steel", interest_category: "PRODUCER", employer_affiliation_code: "ACME" }
              as: StandardsStaff
              captures: { p1: $.data.id }
            - call: "POST /sdo/participants"
              payload: { full_name: "Ben User", organization: "City Water", interest_category: "USER", employer_affiliation_code: "CITYW" }
              as: StandardsStaff
              captures: { p2: $.data.id }
            - call: "POST /sdo/participants"
              payload: { full_name: "Cleo General", organization: "Safety League", interest_category: "GENERAL_INTEREST", employer_affiliation_code: "SAFEL" }
              as: StandardsStaff
              captures: { p3: $.data.id }
            - call: "POST /sdo/committees"
              payload: { designation: "TC-14", scope_text: "Structural fasteners", chair_participant_id: "${p1}", max_concurrent_ballots: 2 }
              as: StandardsStaff
              captures: { c1: $.data.id }
            - call: "POST /sdo/committees/${c1}/memberships"
              payload: { participant_id: "${p1}", voting_rights: true }
              as: StandardsStaff
              captures: { m1: $.data.id }
            - call: "POST /sdo/committees/${c1}/memberships"
              payload: { participant_id: "${p2}", voting_rights: true }
              as: StandardsStaff
              captures: { m2: $.data.id }
            - call: "POST /sdo/committees/${c1}/memberships"
              payload: { participant_id: "${p3}", voting_rights: true }
              as: StandardsStaff
              captures: { m3: $.data.id }
            - call: "POST /sdo/committees/${c1}/activate"
              payload: {}
              as: StandardsStaff
            - call: "POST /sdo/work-items"
              payload: { title: "Fastener torque spec", scope_text: "Torque limits for structural fasteners", work_item_type: "NEW_STANDARD", proposer_participant_id: "${p1}", target_completion_date: "2027-06-30" }
              as: Proposer
              as_user_id: "${p1}"
              captures: { w1: $.data.id }
            - call: "POST /sdo/work-items/${w1}/approve-scope"
              payload: { decision: "APPROVE", sponsoring_committee_id: "${c1}", designation: "STD-1400" }
              as: StandardsStaff
            - call: "POST /sdo/work-items/${w1}/drafts"
              payload: { total_clause_count: 40, changed_clause_count: 0, summary: "Revision 1" }
              as: CommitteeChair
              as_user_id: "${p1}"
              captures: { d1: $.data.id }
            - call: "POST /sdo/ballots"
              payload: { draft_id: "${d1}", committee_id: "${c1}", ballot_kind: "SUBCOMMITTEE", opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-08-15T00:00:00Z" }
              as: CommitteeChair
              as_user_id: "${p1}"
              captures: { b1: $.data.id }
            - call: "POST /sdo/ballots/${b1}/votes"
              payload: { membership_id: "${m1}", position: "AFFIRMATIVE" }
              as: CommitteeChair
              as_user_id: "${p1}"
              captures: { v1: $.data.id }
            - call: "POST /sdo/ballots/${b1}/votes"
              payload: { membership_id: "${m2}", position: "AFFIRMATIVE" }
              as: CommitteeMember
              as_user_id: "${p2}"
              captures: { v2: $.data.id }
            - call: "POST /sdo/ballots/${b1}/votes"
              payload: { membership_id: "${m3}", position: "NEGATIVE", comment_text: "Clause 12 torque ceiling is unsafe", clause_reference: "12" }
              as: CommitteeMember
              as_user_id: "${p3}"
              captures: { v3: $.data.id }
          trigger:
            - call: "POST /sdo/ballots/${b1}/close"
              payload: {}
              as: CommitteeChair
              as_user_id: "${p1}"
            - call: "GET /sdo/votes/${v3}"
              payload: {}
              as: StandardsStaff
            - call: "GET /sdo/drafts/${d1}"
              payload: {}
              as: StandardsStaff
            - call: "GET /sdo/work-items/${w1}"
              payload: {}
              as: StandardsStaff
          assert:
            - 'the close response itself already reports status EVALUATED, returned_count 3, return_rate_pct 100.0, provisional_approval_pct 66.7, pending_negative_count 1 and consensus_result APPROVED_PENDING_NEGATIVES'
            - 'first read: Vote.${v3}.adjudication_status == PENDING (set by hop 2 of the same request)'
            - 'second read: Draft.${d1}.status == COMMENT_RESOLUTION with unresolved_negative_count == 1'
            - 'third read: WorkItem.${w1}.unresolved_negative_count == 1 and consensus_gate == BLOCKED'
            - 'the linked BALLOT_NEGATIVE Comment is already reachable via GET /sdo/comments?source_vote_id=${v3}'
            - 'no further request is needed to reach this state and repeating the three reads returns identical payloads'
