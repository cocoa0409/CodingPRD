              as: CareCoordinator
              captures: { error_id_e2: $.data.error_id }
          assert:
            - "POST /visits against E1 (CONSENTED) returns 409 and error_id_e1 == ERR_ENROLLMENT_NOT_ACTIVE"
            - "POST /visits against E2 (ACTIVE but CT SUSPENDED) returns 409 and error_id_e2 == ERR_CARE_TEAM_NOT_ACTIVE"
            - "error_id_e1 != error_id_e2"
            - "GET /visits returns 0 rows for both enrollments"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across DIFFERENT interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: visit_window_half_open_overlap_on_same_clinician
        grounds:
          - validations.priority_9_business_constraint
          - errors.ERR_VISIT_TIME_OVERLAP
          - entities.Visit.fields.scheduled_start
          - entities.Visit.fields.scheduled_end
        distinguishing_aspect: |
          Interval semantic: HALF-OPEN [scheduled_start, scheduled_end) on a
          single clinician's calendar. An existing visit [09:00, 10:00) blocks
          a new visit at [09:30, 10:30) (interior overlap) and at [08:00,
          09:30) (leading-edge overlap), but PERMITS an adjacent visit at
          [10:00, 11:00) — back-to-back visits share only an endpoint, which
          is excluded by the half-open rule.
        test_recipe:
          setup:
            - "Standard ACTIVE enrollment; clinician NP1 (max 10)."
            - "Existing visit V0 at [2026-09-02T09:00, 2026-09-02T10:00) assigned to NP1."
          setup_api_calls:
            - call: "POST /care-programs"
              payload: { program_code: "LMRK-TX", display_name: "Landmark TX", service_geography_zips: ["75201"], urgent_response_sla_hours: 24 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /payer-contracts"
              payload: { care_program_id: "${prog_id}", payer_name: "PlanA", contract_effective_date: "2026-01-01T00:00:00Z", contract_expiration_date: "2027-12-31T23:59:59Z", payment_model: "CAPITATED", pmpm_rate_cents: 500000, quality_withhold_pct: 0.10, min_performance_threshold: 0.80 }
              as: ContractAdministrator
              captures: { contract_id: $.data.id }
            - call: "POST /pcp-providers"
              payload: { care_program_id: "${prog_id}", npi: "1234567890", full_name: "Dr. Patel", practice_name: "DFM", notification_opt_in: true }
              as: PlatformAdmin
              captures: { pcp_id: $.data.id }
            - call: "POST /clinicians"
              payload: { care_program_id: "${prog_id}", full_name: "Nancy NP", discipline: "NP", home_zip: "75201", max_daily_visits: 10, urgent_response_qualified: false }
              as: PlatformAdmin
              captures: { np_id: $.data.id }
            - call: "POST /members"
              payload: { care_program_id: "${prog_id}", payer_contract_id: "${contract_id}", member_external_id: "M-001", full_name: "Member X", date_of_birth: "1950-01-01T00:00:00Z", address_zip: "75201", pcp_provider_id: "${pcp_id}", chronic_condition_codes: ["CHF"], prior_ed_visits_12mo: 1, prior_inpatient_admits_12mo: 1 }
              as: PlatformAdmin
              captures: { member_id: $.data.id, member_v: $.data.version }
            - call: "POST /members/${member_id}/enrollments"
              payload: { outreach_channel: "PHONE", expected_member_version: "${member_v}" }
              as: EngagementSpecialist
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/begin-outreach"
              payload: {}
              as: EngagementSpecialist
            - call: "POST /enrollments/${enr_id}/record-consent"
              payload: { consent_document_id: "DOC-1" }
              as: EngagementSpecialist
            - call: "PUT /enrollments/${enr_id}/care-team"
              payload: { primary_np_id: "${np_id}" }
              as: CareCoordinator
            - call: "POST /enrollments/${enr_id}/care-team/activate"
              payload: {}
              as: CareCoordinator
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: EngagementSpecialist
            - call: "POST /visits"
              payload: { enrollment_id: "${enr_id}", visit_type: "ROUTINE_FOLLOWUP", scheduled_start: "2026-09-02T09:00:00Z", scheduled_end: "2026-09-02T10:00:00Z" }
              as: CareCoordinator
              captures: { v0: $.data.id, v0_clin: $.data.clinician_id }
          trigger:
            - call: "POST /visits"
              payload: { enrollment_id: "${enr_id}", visit_type: "ROUTINE_FOLLOWUP", scheduled_start: "2026-09-02T09:30:00Z", scheduled_end: "2026-09-02T10:30:00Z" }
              as: CareCoordinator
              captures: { error_interior: $.data.error_id }
            - call: "POST /visits"
              payload: { enrollment_id: "${enr_id}", visit_type: "ROUTINE_FOLLOWUP", scheduled_start: "2026-09-02T08:00:00Z", scheduled_end: "2026-09-02T09:30:00Z" }
              as: CareCoordinator
              captures: { error_leading: $.data.error_id }
            - call: "POST /visits"
              payload: { enrollment_id: "${enr_id}", visit_type: "ROUTINE_FOLLOWUP", scheduled_start: "2026-09-02T10:00:00Z", scheduled_end: "2026-09-02T11:00:00Z" }
              as: CareCoordinator
              captures: { adjacent_id: $.data.id }
          assert:
            - "interior overlap returns 409 and error_interior == ERR_VISIT_TIME_OVERLAP"
            - "leading-edge overlap returns 409 and error_leading == ERR_VISIT_TIME_OVERLAP"
            - "adjacent back-to-back visit (start == previous end) succeeds with 201 and creates Visit.${adjacent_id}"
            - "GET /visits?enrollment_id=${enr_id} returns 2 rows (V0 + adjacent)"

      - name: urgent_episode_sla_deadline_uses_closed_interval_temporal_semantics
        grounds:
          - state_machines.UrgentResponseEpisode.transitions.TRIGGERED_to_LAPSED
          - entities.UrgentResponseEpisode.fields.sla_deadline
          - calculations.urgent_clinician_selector
        distinguishing_aspect: |
          Different interval semantic from the half-open visit window: the
          SLA deadline is treated as a CLOSED upper bound (dispatch accepted
          while clock <= sla_deadline, rejected only when strictly past).
          Coupled with a DIFFERENT resource: the urgent clinician pool
          (urgent_response_qualified=true). An episode triggered at T0 with
          sla_hours=24 has sla_deadline = T0+24h. Dispatch at T0+24h exactly
          succeeds; dispatch at T0+24h+1s returns ERR_SLA_ALREADY_LAPSED. The
          two interval rules (half-open [) for visits vs closed <= for SLA)
          sit on different resource types and produce different boundary
          behavior.
        test_recipe:
          setup:
            - "Standard ACTIVE enrollment; urgent-qualified NP available."
            - "Two urgent episodes EP_A (will dispatch at exact sla_deadline) and EP_B (will dispatch 1s past sla_deadline)."
          setup_api_calls:
            - call: "POST /care-programs"
              payload: { program_code: "LMRK-TX", display_name: "Landmark TX", service_geography_zips: ["75201"], urgent_response_sla_hours: 24 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
