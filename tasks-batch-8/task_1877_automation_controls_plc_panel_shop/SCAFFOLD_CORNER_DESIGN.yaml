  # ===========================================================================
  # Section: rbac
  # ===========================================================================
  - section: rbac
    instances:
      - name: customer_cannot_create_jobs_or_components
        claim_type: rbac_denial
        grounds: [roles, endpoints]
        distinguishing_aspect: "Customer role is denied on ProjectManager-only POST /jobs and QAManager-only POST /components with ERR_UNAUTHORIZED 403, while allowed on its exclusive POST /jobs/{id}/warranty-claims path (denial shown on two different owning roles)."
        test_recipe:
          setup: ["customer exists"]
          setup_api_calls:
            - call: "POST /panel-shop/customers"
              payload: { company_name: "RB Co", site_state_code: "UT" }
              as: ProjectManager
              captures: { c_rb: "$.data.id" }
          trigger:
            - call: "POST /panel-shop/jobs"
              payload: { customer_id: "${c_rb}", job_number: "J-RB1", quoted_price_cents: 100 }
              as: Customer
              as_user_id: "${c_rb}"
              captures: { err_rb1: "$.data.error_id" }
            - call: "POST /panel-shop/components"
              payload: { part_number: "RB-1", component_class: "CONTACTOR", unit_cost_cents: 100, lead_time_days: 1, sccr_ka: 10, heat_dissipation_w: 1 }
              as: Customer
              as_user_id: "${c_rb}"
              captures: { err_rb2: "$.data.error_id" }
          assert:
            - "both responses 403 with error_id == ERR_UNAUTHORIZED"

      - name: shipping_clerk_cannot_approve_change_order
        claim_type: rbac_denial
        grounds: [roles, state_machines.ChangeOrder.PROPOSED_to_APPROVED]
        distinguishing_aspect: "ShippingClerk (and any non-Customer role) calling POST /change-orders/{id}/approve is rejected with ERR_UNAUTHORIZED before any state/OCC check — RBAC (priority 2) precedes state (priority 6)."
        test_recipe:
          setup: ["job with PROPOSED change order"]
          setup_api_calls:
            - call: "POST /panel-shop/customers"
              payload: { company_name: "SC Co", site_state_code: "UT" }
              as: ProjectManager
              captures: { c_sc: "$.data.id" }
            - call: "POST /panel-shop/jobs"
              payload: { customer_id: "${c_sc}", job_number: "J-SC1", quoted_price_cents: 100 }
              as: ProjectManager
              captures: { j_sc: "$.data.id" }
            - call: "POST /panel-shop/jobs/${j_sc}/change-orders"
              payload: { description: "rbac probe", price_delta_cents: 1000 }
              as: ProjectManager
              captures: { co_sc: "$.data.id" }
            - call: "GET /panel-shop/jobs/${j_sc}"
              payload: {}
              as: ProjectManager
              captures: { j_sc_v: "$.data.version" }
          trigger:
            - call: "POST /panel-shop/change-orders/${co_sc}/approve"
              payload: { expected_job_version: "${j_sc_v}" }
              as: ShippingClerk
              captures: { err_sc: "$.data.error_id" }
          assert:
            - "response status == 403 with error_id == ERR_UNAUTHORIZED (RBAC fires before OCC/state)"
            - "ChangeOrder.${co_sc}.status remains PROPOSED"

      - name: customer_ownership_required_on_change_order_approve
        claim_type: rbac_ownership
        grounds: ["validations[priority=3]", "errors[ERR_NOT_RESOURCE_OWNER]", roles]
        distinguishing_aspect: "entity_backed Customer approving a change order on ANOTHER customer's job is rejected with ERR_NOT_RESOURCE_OWNER 403 even though the role is correct — the X-User-ID must equal Job.customer_id."
        test_recipe:
          setup: ["two customers C1, C2; job owned by C1 with a PROPOSED change order"]
          setup_api_calls:
            - call: "POST /panel-shop/customers"
              payload: { company_name: "Own A", site_state_code: "UT" }
              as: ProjectManager
              captures: { c_oa: "$.data.id" }
            - call: "POST /panel-shop/customers"
              payload: { company_name: "Own B", site_state_code: "UT" }
              as: ProjectManager
              captures: { c_ob: "$.data.id" }
            - call: "POST /panel-shop/jobs"
              payload: { customer_id: "${c_oa}", job_number: "J-OW1", quoted_price_cents: 100 }
              as: ProjectManager
              captures: { j_ow: "$.data.id" }
            - call: "POST /panel-shop/jobs/${j_ow}/change-orders"
              payload: { description: "ownership probe", price_delta_cents: 1000 }
              as: ProjectManager
              captures: { co_ow: "$.data.id" }
            - call: "GET /panel-shop/jobs/${j_ow}"
              payload: {}
              as: Customer
              as_user_id: "${c_ob}"
              captures: { j_ow_v: "$.data.version" }
          trigger:
            - call: "POST /panel-shop/change-orders/${co_ow}/approve"
              payload: { expected_job_version: "${j_ow_v}" }
              as: Customer
              as_user_id: "${c_ob}"
              captures: { err_ow2: "$.data.error_id" }
          assert:
            - "response status == 403 with error_id == ERR_NOT_RESOURCE_OWNER"
            - "ChangeOrder.${co_ow}.status remains PROPOSED"

  # ===========================================================================
  # Section: cross_cutting_layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_correct_version_succeeds_and_bumps_panel_version
        claim_type: occ_happy_path
        grounds: ["concurrency_rules[program-release-stale-panel]", complexity_profile]
        distinguishing_aspect: "Program release with the CURRENT panel version succeeds and increments Panel.version by exactly 1 per release — the version field is observable proof the OCC anchor advances on every mutation."
        test_recipe:
          setup: ["fresh panel (version captured at creation)"]
          setup_api_calls:
            - call: "POST /panel-shop/customers"
              payload: { company_name: "OC Co", site_state_code: "UT" }
              as: ProjectManager
              captures: { c_oc: "$.data.id" }
            - call: "POST /panel-shop/jobs"
              payload: { customer_id: "${c_oc}", job_number: "J-OC1", quoted_price_cents: 100 }
              as: ProjectManager
              captures: { j_oc: "$.data.id" }
            - call: "POST /panel-shop/jobs/${j_oc}/panels"
              payload: { panel_tag: "P-OC1", enclosure_rating: "NEMA_1", design_engineer_id: "de-oc" }
              as: DesignEngineer
              captures: { p_oc: "$.data.id", p_oc_v0: "$.data.version" }
          trigger:
            - call: "POST /panel-shop/panels/${p_oc}/program-versions"
              payload: { version_tag: "v1.0.0", content_hash: "eeee0000eeff0011223344556677889900112233445566778899aabbccddeeff00", expected_panel_version: "${p_oc_v0}" }
              as: ControlsEngineer
            - call: "GET /panel-shop/panels/${p_oc}"
              payload: {}
              as: ControlsEngineer
              captures: { p_oc_v1: "$.data.version" }
          assert:
            - "release succeeds with the creation-time version"
            - "captured p_oc_v1 == p_oc_v0 + 1 (exactly one increment for the release)"

      - name: derived_contract_price_reconciles_after_each_ledger_mutation
        claim_type: derived_field_reconciliation
        grounds: [entities.Job.fields.contract_price_cents, entities.Job.fields.approved_co_delta_cents]
        distinguishing_aspect: "contract_price_cents == quoted_price_cents + approved_co_delta_cents after every single mutation: checked after creation (no COs -> equals quoted), after one approval, and is never stale within the same response (immediate consistency)."
        test_recipe:
          setup: ["job quoted 1000000; one change order priced 120000 (computed 114000)"]
          setup_api_calls:
            - call: "POST /panel-shop/customers"
              payload: { company_name: "DF Co", site_state_code: "UT" }
              as: ProjectManager
              captures: { c_df: "$.data.id" }
            - call: "POST /panel-shop/jobs"
              payload: { customer_id: "${c_df}", job_number: "J-DF1", quoted_price_cents: 1000000 }
              as: ProjectManager
              captures: { j_df: "$.data.id", df_q: "$.data.contract_price_cents" }
