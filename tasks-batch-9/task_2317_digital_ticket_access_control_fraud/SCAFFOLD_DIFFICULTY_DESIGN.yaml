            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "DOORS_OPEN" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T18:10:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /scan-sessions"
              payload: { gate_id: "${g1_id}", operator_device_id: "SCN-1", mode: "ONLINE", expected_gate_version: "${g1_v}" }
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { s1_id: $.data.id }
            - call: "GET /tickets/${t_ada_id}/barcode"
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { bc_ada: $.data.current_barcode }
            - call: "GET /tickets/${t_ben_id}/barcode"
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { bc_ben: $.data.current_barcode }
            - call: "GET /tickets/${t_cyd_id}/barcode"
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { bc_cyd: $.data.current_barcode }
            - call: "POST /scan-sessions/${s1_id}/scan-events"
              payload: { presented_barcode: "${bc_ada}", device_fingerprint: "DEV-ADA", direction: "IN", dedupe_key: "S1-ONLINE-001" }
              as: GateOperator
              as_user_id: "gate-op-1"
            - call: "POST /tickets/${t_ben_id}/void"
              payload: { reason: "Fraudulent purchase instrument", refund_to_holder: false }
              as: SecurityInvestigator
              as_user_id: "sec-1"
          trigger:
            - call: "POST /scan-sessions/${s1_id}/scan-events"
              payload: { presented_barcode: "${bc_ben}", device_fingerprint: "DEV-BEN", direction: "IN", dedupe_key: "S1-ONLINE-002" }
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { err_pair: $.data.error_id }
            - call: "POST /scan-sessions/${s1_id}/scan-events"
              payload: { presented_barcode: "${bc_cyd}", device_fingerprint: "DEV-CYD", direction: "IN", dedupe_key: "S1-ONLINE-003" }
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { err_control: $.data.error_id }
          assert:
