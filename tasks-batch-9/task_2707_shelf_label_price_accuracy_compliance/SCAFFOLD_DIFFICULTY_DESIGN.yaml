            - "Middle-hop necessity: voiding the setup WRITTEN_WARNING before the close (POST /price-integrity/accountability-actions/${act_ww}/transition with target_status VOIDED) makes the waterfall select COACHING, giving score 95.00, leaving la1 CERTIFIED, and hops 4-5 never run — LabelTask.${task_1} stays PRINTED x PLACED"

  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: refund_claim_state_priority_42_beats_fiscal_budget_priority_72
        grounds:
          - validations.priority_42_ERR_AUDIT_NOT_CLOSED
          - validations.priority_72_ERR_REFUND_BUDGET_EXCEEDED
          - endpoints.POST_/price-integrity/refund-claims
          - calculations.refund_claim_amount
        distinguishing_aspect: |
          Pair across the state / business_fiscal boundary on POST /refund-claims: the audit is
          REOPENED (priority 42) at the same instant the store's outstanding liability already
          exhausts the jurisdiction refund budget (priority 72). Only the lower number may surface,
          and each condition is isolated by a control arm — re-closing the audit exposes 72 alone,
          raising the budget exposes 42 alone. Distinct from the other pair below because it crosses
          state -> fiscal (409 -> 422) and the higher-priority condition is reachable only by
          cycling the audit back out of CLOSED.
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z default."
            - "Jurisdiction US-CA with overcharge_refund_policy REFUND_DIFFERENCE_PLUS_FIXED, refund_fixed_bonus_cents 500, refund_cap_cents 5000, refund_budget_per_audit_cents 700, scanner_error_rate_threshold_pct 25.0."
            - "One store, one aisle with NO assigned associate (so the FAIL close creates no accountability action), one CERTIFIED PRICE_AUDITOR (pa1)."
            - "One audit with TWO overcharge scan lines, each +150c."
            - "Audit closed, then one refund claim already filed on scan line A for 650c, then the audit reopened."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-CA", name: "California", overcharge_refund_policy: "REFUND_DIFFERENCE_PLUS_FIXED", refund_fixed_bonus_cents: 500, refund_cap_cents: 5000, refund_budget_per_audit_cents: 700, scanner_error_rate_threshold_pct: 25.0 }
              as: PricingAdmin
              captures: { jur_a: $.data.id }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S001", name: "Bay Street", jurisdiction_id: "${jur_a}" }
              as: PricingAdmin
              captures: { store_a: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/aisles"
              payload: { aisle_code: "A01", category_code: "DAIRY" }
              as: PricingAdmin
              captures: { aisle_a1: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/associates"
              payload: { employee_number: "E-PA1", full_name: "Pat Auditor", role_code: "PRICE_AUDITOR" }
              as: PricingAdmin
              captures: { pa1: $.data.id }
            - call: "POST /price-integrity/associates/${pa1}/training-completions"
              payload: { module_code: "AUDIT_101", score_pct: 95 }
              as: PricingAdmin
            - call: "POST /price-integrity/scanner-audits"
              payload: { store_id: "${store_a}", aisle_id: "${aisle_a1}", auditor_associate_id: "${pa1}", audit_type: "ROUTINE", scan_window_start: "2026-08-01T08:00:00Z", scan_window_end: "2026-08-01T10:00:00Z" }
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { audit_a: $.data.id }
            - call: "POST /price-integrity/scanner-audits/${audit_a}/scan-lines"
              payload: { item_upc: "00000000000501", shelf_price_cents: 949, register_price_cents: 1099 }
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { sl_a: $.data.id }
            - call: "POST /price-integrity/scanner-audits/${audit_a}/scan-lines"
              payload: { item_upc: "00000000000502", shelf_price_cents: 349, register_price_cents: 499 }
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { sl_b: $.data.id }
            - call: "POST /price-integrity/scanner-audits/${audit_a}/close"
              payload: {}
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { audit_v_closed: $.data.version }
            - call: "POST /price-integrity/refund-claims"
              payload: { scan_line_id: "${sl_a}", customer_ref: "CUST-A", expected_scanner_audit_version: "${audit_v_closed}" }
              as: CustomerServiceDesk
              captures: { claim_a: $.data.id }
            - call: "POST /price-integrity/scanner-audits/${audit_a}/reopen"
              payload: { reopen_reason: "Register export was incomplete" }
              as: ComplianceOfficer
              captures: { audit_v_reopened: $.data.version }
          trigger:
            - call: "POST /price-integrity/refund-claims"
              payload: { scan_line_id: "${sl_b}", customer_ref: "CUST-B", expected_scanner_audit_version: "${audit_v_reopened}" }
              as: CustomerServiceDesk
              captures: { err_pair: $.data.error_id }
          assert:
            - "Setup baseline: RefundClaim.${claim_a}.claimed_amount_cents == 650 (variance 150 + REFUND_DIFFERENCE_PLUS_FIXED bonus 500) and Store.${store_a}.refund_liability_outstanding_cents == 650"
            - "Both conditions genuinely hold at trigger time: ScannerAudit.${audit_a}.status == REOPENED (violates priority 42) and 650 + 650 == 1300 > refund_budget_per_audit_cents 700 (violates priority 72)"
            - "The fresh expected_scanner_audit_version ${audit_v_reopened} is passed so that priority 45 (ERR_STALE_SCANNER_AUDIT_VERSION) does not pre-empt the pair"
            - "Trigger returns HTTP 409 with ${err_pair} == ERR_AUDIT_NOT_CLOSED — priority 42 wins over priority 72"
            - "No RefundClaim row is created: GET /price-integrity/refund-claims?scan_line_id=${sl_b} returns total_count 0"
            - "Store.${store_a}.refund_liability_outstanding_cents is unchanged at 650"
            - "Isolation arm 1 (only priority 72 violated): close the audit again as PriceAuditor ${pa1}, capture the new version, then POST the same claim -> HTTP 422 with error_id ERR_REFUND_BUDGET_EXCEEDED"
            - "Isolation arm 2 (only priority 42 violated): from the REOPENED state, PATCH /price-integrity/jurisdictions/${jur_a} with refund_budget_per_audit_cents 5000, then POST the same claim -> HTTP 409 with error_id ERR_AUDIT_NOT_CLOSED"
            - "Clean arm (neither violated): budget 5000 and audit CLOSED -> HTTP 201, claimed_amount_cents == 650, Store.${store_a}.refund_liability_outstanding_cents == 1300"

      - name: verify_placement_safety_priority_50_beats_temporal_priority_59
        grounds:
          - validations.priority_50_ERR_SEGREGATION_OF_DUTIES
          - validations.priority_59_ERR_VERIFICATION_WINDOW_CLOSED
          - endpoints.POST_/price-integrity/label-tasks/{id}/verify-placement
          - constants.VERIFICATION_GRACE_HOURS
        distinguishing_aspect: |
          Pair across the business_safety / business_temporal boundary on the SAME endpoint, and both
          rules return 422 — so the discriminator is purely the priority number, not the HTTP status.
          One associate both places and verifies (priority 50) after the 48-hour grace window has
          already lapsed (priority 59); the expected surface is ERR_SEGREGATION_OF_DUTIES. Unlike the
          refund pair, neither condition depends on any other entity's state, and the ordering is
          proved by two control arms that each violate exactly one rule at the identical clock value.
        test_recipe:
          setup:
            - "Clock starts at the 2026-08-01T00:00:00Z default; jurisdiction US-CA with grace_period_hours 48."
            - "One store, one aisle, one CERTIFIED STORE_MANAGER associate (sm1) and one CERTIFIED PRICE_AUDITOR (pa1)."
            - "A distributed one-line file with a label task assigned to sm1, printed and placed BY sm1 at 2026-08-01T00:00:00Z."
            - "Clock then advanced to 2026-08-03T01:00:00Z — 49 hours after placed_at, so the 48h grace has lapsed."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
