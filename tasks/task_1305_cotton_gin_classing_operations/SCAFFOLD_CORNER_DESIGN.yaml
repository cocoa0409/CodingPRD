  # ================================================== cross-cutting layers
  - section: cross_cutting_layers
    instances:
      - name: occ_classing_stale_version_rejected
        claim_type: stale_version_conflict
        grounds: ["concurrency_rules[classing-result-supersede-stale-bale]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "a classing create carrying the pre-classing Bale.version is accepted once; replaying the same observed version after the bale advanced is rejected 412 — sequential determinism, no wall-clock."
        test_recipe:
          setup: ["grade schedule 31-3 covering 2026; grower with one ginned 500-lb bale at version 1"]
          setup_api_calls:
            - call: "POST /gin-ops/grade-schedules"
              payload: { grade_code: "31-3", premium_discount_points: 265, loan_rate_points: 5450, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /gin-ops/growers"
              payload: { membership_number: "MB-C80", legal_name: "OCC Farm" }
              as: CoopAdmin
              captures: { g: $.data.id }
            - call: "POST /gin-ops/gin-shifts"
              payload: { season: "2026", stand_label: "STAND-OC" }
              as: GinOperator
              captures: { s: $.data.id }
            - call: "POST /gin-ops/modules"
              payload: { grower_id: "${g}", season: "2026", ticket_number: "T-1", module_tag: "MT-OC", gross_weight_lbs: 11000, tare_weight_lbs: 1000, moisture_pct: 8.0, foreign_matter_pct: 4.0 }
              as: GinOperator
              captures: { m: $.data.id }
            - call: "POST /gin-ops/modules/${m}/queue"
              payload: { gin_shift_id: "${s}" }
              as: GinOperator
            - call: "POST /gin-ops/modules/${m}/start-ginning"
              as: GinOperator
            - call: "POST /gin-ops/modules/${m}/complete-ginning"
              payload: { bales: [ {bale_tag: "B-OC1", net_weight_lbs: 500} ] }
              as: GinOperator
              as_user_id: "gin-op-1"
            - call: "GET /gin-ops/modules/${m}/bales"
              as: ClassingClerk
              captures: { b: "$.data[0].id", bv: "$.data[0].version" }
          trigger:
            - call: "POST /gin-ops/bales/${b}/classing-results"
              payload: { grade_code: "31-3", micronaire: 4.0, strength_gpt: 28.0, staple_32nds: 36, classing_office: "USDA-MEMPHIS", result_date: "2026-03-10T00:00:00Z", expected_bale_version: "${bv}" }
              as: ClassingClerk
              captures: { cr1: $.data.id }
            - call: "POST /gin-ops/bales/${b}/classing-results"
              payload: { grade_code: "31-3", micronaire: 4.2, strength_gpt: 28.0, staple_32nds: 36, classing_office: "USDA-MEMPHIS", result_date: "2026-03-11T00:00:00Z", expected_bale_version: "${bv}" }
              as: ClassingClerk
              captures: { err: $.data.error_id }
          assert:
            - "first classing with the observed version: 201 (${cr1} ACTIVE)"
            - "second classing replaying the same expected_bale_version: http 412, error_id == ERR_STALE_VERSION"
            - "Bale.${b} still has exactly one ClassingResult (${cr1} ACTIVE); no supersede occurred"

      - name: occ_settlement_stale_version_rejected
        claim_type: stale_version_conflict
        grounds: ["concurrency_rules[settlement-supersede-stale-grower]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "settlement creation OCC-gates on Grower.version: creating a settlement advances the grower version, so a second create carrying the first observed version is rejected 412 instead of silently superseding."
        test_recipe:
          setup: ["grower GU freshly created (version captured)"]
          setup_api_calls:
            - call: "POST /gin-ops/growers"
              payload: { membership_number: "MB-C81", legal_name: "OCC Settle Farm" }
              as: CoopAdmin
              captures: { g: $.data.id, gv: $.data.version }
          trigger:
            - call: "POST /gin-ops/growers/${g}/settlements"
              payload: { season: "2026", expected_grower_version: "${gv}" }
              as: CoopAccountant
              captures: { st1: $.data.id }
            - call: "POST /gin-ops/growers/${g}/settlements"
              payload: { season: "2026", expected_grower_version: "${gv}" }
              as: CoopAccountant
              captures: { err: $.data.error_id }
          assert:
            - "first create: 201 (${st1} DRAFT) and Grower.version incremented"
            - "second create with the stale expected_grower_version: http 412, error_id == ERR_STALE_VERSION"
            - "no SUPERSEDED settlement was produced by the rejected call: ${st1} stays DRAFT"

      - name: ginning_charge_cascade_to_ledger_and_balance
        claim_type: cascade_chain
        grounds: [state_machines.ModuleReceipt.GINNING_to_GINNED, entities.Grower.fields.credit_balance_cents]
        excluded_because:
          difficulty_instance: "transitive_cascade / complete_ginning_charge_cascade_to_grower_balance"
          rationale: "asserted hop-by-hop there (module -> bales -> GINNING_CHARGE entry -> grower balance)."

      - name: draft_settlement_recomputed_on_classing
        claim_type: cascade_chain
        grounds: [state_machines.Bale, calculations.settlement_net]
        excluded_because:
          difficulty_instance: "transitive_cascade / reclass_cascade_recomputes_draft_settlement"
          rationale: "the reclass cascade asserts the DRAFT settlement line recompute with exact deltas."

      - name: stored_count_conserved_on_issue_cancel
        claim_type: derived_field_reconciliation
        grounds: [entities.Warehouse.fields.stored_bale_count]
        excluded_because:
          difficulty_instance: "compensating_invariant / receipt_issue_cancel_conserve_stored_count"
          rationale: "the issue/cancel pair with the COUNT invariant is asserted there."

  # ================================================== consistency model
  - section: consistency_model
    instances:
      - name: create_response_reflects_post_state
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, state_machines.ModuleReceipt.GINNING_to_GINNED]
        distinguishing_aspect: "immediate consistency: the complete-ginning 200 response itself carries status GINNED and actual_lint_lbs 500 — no re-read or eventual catch-up is needed to observe the transition."
        test_recipe:
          setup: ["grower; shift; module in GINNING"]
          setup_api_calls:
            - call: "POST /gin-ops/growers"
              payload: { membership_number: "MB-C90", legal_name: "Immediate Farm" }
              as: CoopAdmin
              captures: { g: $.data.id }
            - call: "POST /gin-ops/gin-shifts"
              payload: { season: "2026", stand_label: "STAND-IM" }
              as: GinOperator
              captures: { s: $.data.id }
            - call: "POST /gin-ops/modules"
              payload: { grower_id: "${g}", season: "2026", ticket_number: "T-1", module_tag: "MT-IM", gross_weight_lbs: 11000, tare_weight_lbs: 1000, moisture_pct: 8.0, foreign_matter_pct: 4.0 }
              as: GinOperator
              captures: { m: $.data.id }
            - call: "POST /gin-ops/modules/${m}/queue"
              payload: { gin_shift_id: "${s}" }
              as: GinOperator
            - call: "POST /gin-ops/modules/${m}/start-ginning"
              as: GinOperator
          trigger:
            - call: "POST /gin-ops/modules/${m}/complete-ginning"
              payload: { bales: [ {bale_tag: "B-IM1", net_weight_lbs: 500} ] }
              as: GinOperator
              as_user_id: "gin-op-1"
          assert:
            - "the 200 response body itself: data.status == GINNED, data.actual_lint_lbs == 500, data.ginned_by_user_id == gin-op-1"
            - "data.version advanced by exactly 1 relative to the pre-call read"
