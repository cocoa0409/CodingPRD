              as: FinanceController
              captures: { ct_idm: $.data.id }
            - call: "POST /v1/capacity-contracts/${ct_idm}/activate"
              payload: {}
              as: FinanceController
            - call: "GET /v1/capacity-contracts/${ct_idm}"
              payload: {}
              as: FinanceController
              captures: { idm_v1: $.data.version }
          trigger:
            - call: "POST /v1/credit-drawdowns"
              payload: { contract_id: "${ct_idm}", warehouse_id: "${wh_idm}", amount_credits: 250, source_kind: "SESSION", idempotency_key: "idem-k1", expected_contract_version: "${idm_v1}" }
              as: DataEngineer
              captures: { dd_idm_first: $.data.id }
            - call: "GET /v1/capacity-contracts/${ct_idm}"
              payload: {}
              as: FinanceController
              captures: { idm_v2: $.data.version }
            - call: "POST /v1/credit-drawdowns"
              payload: { contract_id: "${ct_idm}", warehouse_id: "${wh_idm}", amount_credits: 250, source_kind: "SESSION", idempotency_key: "idem-k1", expected_contract_version: "${idm_v2}" }
              as: DataEngineer
              captures: { dd_idm_second: $.data.id }
          assert:
            - "${dd_idm_second} == ${dd_idm_first}"
            - "CapacityContract.${ct_idm}.drawn_credits == 250.0, so the replay drew nothing extra"
            - "CapacityContract.${ct_idm}.drawdown_count == 1"
            - "a different key idem-k2 with the same amount does draw again and moves drawn_credits to 500.0"
      - name: partial_failure_in_scaling_sweep_is_per_resource
        claim_type: bulk_operations
        grounds:
          - endpoints.POST /v1/warehouses/{id}/cluster-scaling
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Two scaling calls issued as a sweep are best-effort, so the running warehouse scales while the suspended one is refused and neither rolls back the other."
        test_recipe:
          setup: ["two warehouses on one account, one running and one left suspended"]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Bulk Sweep", account_locator: "bs6007", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_bs: $.data.id }
            - call: "POST /v1/warehouses"
              payload: { account_id: "${acct_bs}", name: "WH_BS_RUN", size: "LARGE", clusters_min: 1, clusters_max: 4 }
              as: DataEngineer
              captures: { wh_bs_run: $.data.id }
            - call: "POST /v1/warehouses"
              payload: { account_id: "${acct_bs}", name: "WH_BS_OFF", size: "LARGE", clusters_min: 1, clusters_max: 4 }
              as: DataEngineer
              captures: { wh_bs_off: $.data.id }
            - call: "POST /v1/warehouses/${wh_bs_run}/resume"
              payload: {}
              as: DataEngineer
            - call: "GET /v1/warehouses/${wh_bs_run}"
              payload: {}
              as: DataEngineer
              captures: { bs_run_v: $.data.version }
            - call: "GET /v1/warehouses/${wh_bs_off}"
              payload: {}
              as: DataEngineer
              captures: { bs_off_v: $.data.version }
          trigger:
            - call: "POST /v1/warehouses/${wh_bs_run}/cluster-scaling"
              payload: { clusters: 4, queued_queries: 32, expected_warehouse_version: "${bs_run_v}" }
              as: DataEngineer
            - call: "POST /v1/warehouses/${wh_bs_off}/cluster-scaling"
              payload: { clusters: 4, queued_queries: 32, expected_warehouse_version: "${bs_off_v}" }
              as: DataEngineer
              captures: { err_bs: $.data.error_id }
          assert:
            - "VirtualWarehouse.${wh_bs_run}.cluster_count == 4 and the first call succeeded"
            - "${err_bs} == ERR_INVALID_STATE for the suspended warehouse"
            - "the failure on the second warehouse did not revert the first, which is the partial-success semantics"
            - "GET /v1/warehouses?account_id=${acct_bs} still reports both warehouses"
      - name: replication_cost_reported_before_and_after_refresh
        claim_type: derived_field_reconciliation
        grounds:
          - entities.ReplicationConfiguration.fields.transfer_cost_dollars
          - calculations.replication_transfer_cost
        distinguishing_aspect: "The derived transfer cost reads 0 before a refresh and reconciles to the priced value after, so the staleness window is observable at the read surface."
        test_recipe:
          setup: ["one replication configuration"]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Recl Repl", account_locator: "rr6008", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_rr: $.data.id }
            - call: "POST /v1/replication-configurations"
              payload: { account_id: "${acct_rr}", name: "REPL_RR", target_region: "eu-central-1", target_cloud: "SAME_CLOUD", replicated_tb: 3.0 }
              as: DataEngineer
              captures: { repl_rr: $.data.id }
            - call: "GET /v1/replication-configurations/${repl_rr}"
              payload: {}
              as: DataEngineer
              captures: { rr_cost_before: $.data.transfer_cost_dollars }
          trigger:
            - call: "POST /v1/replication-configurations/${repl_rr}/refresh"
              payload: {}
              as: DataEngineer
          assert:
            - "${rr_cost_before} == 0.0 and ReplicationConfiguration.${repl_rr}.refresh_count == 0 before the refresh"
            - "ReplicationConfiguration.${repl_rr}.transfer_cost_dollars == 18.0 after the refresh"
            - "the derived field is recomputed rather than incremented, so a second identical refresh leaves it at 18.0 while refresh_count becomes 2"
            - "Account.${acct_rr}.posted_storage_dollars_reconciled stays 0.0 because replication posts to its own bucket"
      - name: conditional_monitor_scope_changes_which_warehouses_drain
        claim_type: conditional_feature_flags
        grounds:
          - entities.Account.fields.monitor_scope
          - state_machines.ResourceMonitor.transitions.OK_to_SUSPENDED
        distinguishing_aspect: "The account-level monitor scope is the feature flag: with INCLUDE_CONSUMERS the sweep reaches the consumer's own warehouses, and with ACCOUNT_ONLY it stops at the account boundary."
        test_recipe:
          setup: ["a provider account scoped ACCOUNT_ONLY, a consumer account, a published share and a monitor bound to the provider"]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Flag Prov", account_locator: "fp7002", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_fp: $.data.id }
            - call: "POST /v1/accounts"
              payload: { org_name: "Flag Cons", account_locator: "fc7003", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_fc: $.data.id }
            - call: "POST /v1/warehouses"
              payload: { account_id: "${acct_fp}", name: "WH_FP", size: "LARGE", auto_suspend_seconds: 3600 }
              as: DataEngineer
              captures: { wh_fp: $.data.id }
            - call: "POST /v1/warehouses"
              payload: { account_id: "${acct_fc}", name: "WH_FC", size: "LARGE", auto_suspend_seconds: 3600 }
              as: DataEngineer
              captures: { wh_fc: $.data.id }
            - call: "POST /v1/data-shares"
              payload: { provider_account_id: "${acct_fp}", name: "SHARE_FL", objects_exposed: 2, consumer_account_ids: ["${acct_fc}"] }
              as: ShareAdmin
              as_user_id: "${acct_fp}"
              captures: { share_fl: $.data.id }
            - call: "POST /v1/data-shares/${share_fl}/publish"
              payload: {}
              as: ShareAdmin
              as_user_id: "${acct_fp}"
            - call: "POST /v1/resource-monitors"
              payload: { account_id: "${acct_fp}", name: "MON_FL", credit_quota: 1, interval: "MONTHLY", action: "SUSPEND" }
              as: FinanceController
              captures: { mon_fl: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /v1/warehouses/${wh_fp}/resume"
              payload: {}
              as: DataEngineer
            - call: "POST /v1/warehouses/${wh_fc}/resume"
              payload: {}
              as: DataEngineer
            - call: "POST /v1/warehouse-sessions"
              payload: { warehouse_id: "${wh_fp}" }
              as: DataEngineer
              captures: { ses_fl: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T00:15:00Z" }
              as: PlatformOperator
            - call: "GET /v1/warehouses/${wh_fp}"
              payload: {}
              as: DataEngineer
              captures: { wh_fp_v: $.data.version }
          trigger:
            - call: "POST /v1/warehouse-sessions/${ses_fl}/close"
              payload: { expected_warehouse_version: "${wh_fp_v}" }
              as: DataEngineer
          assert:
            - "ResourceMonitor.${mon_fl}.monitor_state == SUSPENDED because 6.0 credits exceed the quota of 1"
            - "VirtualWarehouse.${wh_fp}.status == DRAINING"
            - "VirtualWarehouse.${wh_fc}.status == RUNNING because the provider account is scoped ACCOUNT_ONLY"
            - "switching the provider account to INCLUDE_CONSUMERS would drain ${wh_fc} on the next sweep, which is the flag's effect"
  - section: consistency_model
    instances:
      - name: immediate_consistency_of_reconciled_credit_figure
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - entities.Account.fields.posted_consumption_credits_reconciled
        distinguishing_aspect: "The reconciled credit figure is visible in the same request's response rather than lagging behind a recompute, so a close and a read never disagree."
        test_recipe:
          setup: ["one running SMALL warehouse with an open session and a contract"]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Imm Credit", account_locator: "ic7001", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_im: $.data.id }
            - call: "POST /v1/warehouses"
              payload: { account_id: "${acct_im}", name: "WH_IM", size: "SMALL", auto_suspend_seconds: 60 }
              as: DataEngineer
              captures: { wh_im: $.data.id }
            - call: "POST /v1/capacity-contracts"
              payload: { account_id: "${acct_im}", term_start: "2026-09-01T00:00:00Z", term_end: "2026-10-01T00:00:00Z", base_credits: 1000, overage_rate_per_credit: 3.00, rollover_cap_credits: 200, currency: "USD" }
              as: FinanceController
              captures: { ct_im: $.data.id }
            - call: "POST /v1/capacity-contracts/${ct_im}/activate"
              payload: {}
              as: FinanceController
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /v1/warehouses/${wh_im}/resume"
              payload: {}
              as: DataEngineer
            - call: "POST /v1/warehouse-sessions"
              payload: { warehouse_id: "${wh_im}" }
              as: DataEngineer
              captures: { ses_im: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:10:00Z" }
              as: PlatformOperator
            - call: "GET /v1/warehouses/${wh_im}"
              payload: {}
              as: DataEngineer
              captures: { wh_im_v: $.data.version }
          trigger:
            - call: "POST /v1/warehouse-sessions/${ses_im}/close"
              payload: { expected_warehouse_version: "${wh_im_v}" }
              as: DataEngineer
          assert:
            - "the close response already reports WarehouseSession.billed_credits 0.333333"
            - "an immediate GET /v1/accounts/${acct_im} returns posted_consumption_credits_reconciled == 0.333333 with no wait"
            - "GET /v1/accounts/${acct_im}/ledger-entries returns the CONSUMPTION row in the same read"
            - "the monitor for the account already reflects the new interval consumption without a second sweep being triggered by the reader"
