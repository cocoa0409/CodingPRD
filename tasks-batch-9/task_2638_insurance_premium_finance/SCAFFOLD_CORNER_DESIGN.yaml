            - "${fk_e3} == 'ERR_STATE_RULE_NOT_FOUND' with HTTP 404"
            - "${fk_e4} == 'ERR_INSURED_NOT_FOUND' with HTTP 404 when ALL THREE are dangling, because priority 4's insured existence check runs ahead of the agent and rule checks"
