              as: EvidenceTechnician
              captures: { e1: $.data.id }
            - call: "POST /lab/evidence-items"
              payload: { case_id: "${c1}", item_number: "2", item_description: "Sealed powder packet B", item_type: "CHEMICAL", seal_intact: true }
              as: EvidenceTechnician
              captures: { e2: $.data.id }
            - call: "POST /lab/evidence-items"
              payload: { case_id: "${c1}", item_number: "3", item_description: "Sealed powder packet C", item_type: "CHEMICAL", seal_intact: true }
              as: EvidenceTechnician
              captures: { e3: $.data.id }
            - call: "POST /lab/cases/${c1}/accept"
              payload: {}
              as: EvidenceTechnician
            - call: "POST /lab/examination-requests"
              payload: { case_id: "${c1}", evidence_item_id: "${e1}", method_id: "${m1}", item_count: 2 }
