  # ===========================================================================
  # Rule 6 — Boundary / precision checks on different metrics at distinct endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: moq_surcharge_at_exactly_two_thousand_chargeable_pounds
        boundary_metric: SalesOrder.chargeable_lbs against MOQ_ORDER_LBS
        endpoint: "POST /sales-orders/{id}/confirm"
        grounds:
          - calculations.order_fee_assessment
          - entities.SalesOrder.fields.small_order_surcharge_cents
          - entities.SalesOrder.fields.chargeable_lbs
        distinguishing_aspect: |
          The metric is the ORDER-LEVEL aggregate chargeable_lbs measured against
          MOQ_ORDER_LBS 2000, and the surcharge test is strictly less-than, so
          exactly 2000 lbs is free. The pair of orders differ by a single pound
          split across two lines — 1000+1000 versus 999+1000 — which also exposes
          the per-line rounding of 999 lbs at 68.50 cents to 68432 cents.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brewer with credit_limit_cents 5000000, legacy_trailing_lbs 0, cold_chain_certified false."
