  # ===========================================================================
  # Section: errors
  # ===========================================================================
  - section: errors
    instances:
      - name: not_found_sweep_all_resources
        claim_type: violation_to_error
        grounds:
          - validations[priority=3]
          - errors[ERR_SITE_NOT_FOUND]
          - errors[ERR_SHOW_NOT_FOUND]
          - errors[ERR_AUTHORIZATION_NOT_FOUND]
          - errors[ERR_DESIGN_NOT_FOUND]
          - errors[ERR_SIMULATION_RUN_NOT_FOUND]
          - errors[ERR_SAFETY_CONFIG_NOT_FOUND]
          - errors[ERR_DRONE_NOT_FOUND]
          - errors[ERR_CHARGE_BAY_NOT_FOUND]
          - errors[ERR_CHARGE_SESSION_NOT_FOUND]
          - errors[ERR_ASSIGNMENT_NOT_FOUND]
          - errors[ERR_WEATHER_READING_NOT_FOUND]
          - errors[ERR_EVALUATION_NOT_FOUND]
          - errors[ERR_INCIDENT_NOT_FOUND]
          - errors[ERR_FLIGHT_LOG_NOT_FOUND]
        distinguishing_aspect: "every one of the 14 resource families returns its own domain-specific 404 for a well-formed but unknown UUID."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/sites/11111111-1111-4111-8111-111111111111", as: ProductionPlanner, captures: { e_site: $.data.error_id } }
            - { call: "GET /api/show-events/11111111-1111-4111-8111-111111111111", as: ProductionPlanner, captures: { e_show: $.data.error_id } }
            - { call: "GET /api/airspace-authorizations/11111111-1111-4111-8111-111111111111", as: ProductionPlanner, captures: { e_auth: $.data.error_id } }
            - { call: "GET /api/show-designs/11111111-1111-4111-8111-111111111111", as: ProductionPlanner, captures: { e_design: $.data.error_id } }
            - { call: "GET /api/simulation-runs/11111111-1111-4111-8111-111111111111", as: ProductionPlanner, captures: { e_sim: $.data.error_id } }
            - { call: "GET /api/safety-configurations/11111111-1111-4111-8111-111111111111", as: ProductionPlanner, captures: { e_cfg: $.data.error_id } }
            - { call: "GET /api/drones/11111111-1111-4111-8111-111111111111", as: FleetManager, captures: { e_drone: $.data.error_id } }
            - { call: "GET /api/charge-bays/11111111-1111-4111-8111-111111111111", as: FleetManager, captures: { e_bay: $.data.error_id } }
            - { call: "GET /api/charge-sessions/11111111-1111-4111-8111-111111111111", as: FleetManager, captures: { e_sess: $.data.error_id } }
            - { call: "GET /api/launch-grid-assignments/11111111-1111-4111-8111-111111111111", as: FleetManager, captures: { e_asg: $.data.error_id } }
            - { call: "GET /api/weather-readings/11111111-1111-4111-8111-111111111111", as: SafetyOfficer, captures: { e_wx: $.data.error_id } }
            - { call: "GET /api/go-no-go-evaluations/11111111-1111-4111-8111-111111111111", as: SafetyOfficer, captures: { e_eval: $.data.error_id } }
            - { call: "GET /api/incident-reports/11111111-1111-4111-8111-111111111111", as: SafetyOfficer, captures: { e_inc: $.data.error_id } }
            - { call: "GET /api/flight-logs/11111111-1111-4111-8111-111111111111", as: FleetManager, captures: { e_log: $.data.error_id } }
          assert:
            - "${e_site} == ERR_SITE_NOT_FOUND"
            - "${e_show} == ERR_SHOW_NOT_FOUND"
            - "${e_auth} == ERR_AUTHORIZATION_NOT_FOUND"
            - "${e_design} == ERR_DESIGN_NOT_FOUND"
            - "${e_sim} == ERR_SIMULATION_RUN_NOT_FOUND"
            - "${e_cfg} == ERR_SAFETY_CONFIG_NOT_FOUND"
            - "${e_drone} == ERR_DRONE_NOT_FOUND"
            - "${e_bay} == ERR_CHARGE_BAY_NOT_FOUND"
            - "${e_sess} == ERR_CHARGE_SESSION_NOT_FOUND"
            - "${e_asg} == ERR_ASSIGNMENT_NOT_FOUND"
            - "${e_wx} == ERR_WEATHER_READING_NOT_FOUND"
            - "${e_eval} == ERR_EVALUATION_NOT_FOUND"
            - "${e_inc} == ERR_INCIDENT_NOT_FOUND"
            - "${e_log} == ERR_FLIGHT_LOG_NOT_FOUND"
            - "all 14 responses use HTTP 404 with the standard error envelope (meta + response_type error + data.error_id)"

      - name: response_envelope_shape_on_success_and_error
        claim_type: violation_to_error
        grounds: [response_envelope]
        distinguishing_aspect: "success responses carry meta.api_request_id/api_request_timestamp with response_type object; error responses carry response_type error and data.error_id + data.message."
        test_recipe:
          setup: ["one drone registered"]
          setup_api_calls:
            - { call: "POST /api/drones", payload: { serial_number: "SN-ENV", model: "LUM-2" }, as: FleetManager, captures: { drone_id: $.data.id } }
          trigger:
            - { call: "GET /api/drones/${drone_id}", as: OpsAdmin }
            - { call: "GET /api/drones/99999999-9999-4999-8999-999999999999", as: OpsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "success: envelope has meta.api_request_id (string), meta.api_request_timestamp (ISO8601), response_type == 'object', data.serial_number == 'SN-ENV'"
            - "error: response_type == 'error', data.error_id == ERR_DRONE_NOT_FOUND, data.message is a non-empty string, HTTP 404"

  # ===========================================================================
  # Section: rbac
  # ===========================================================================
  - section: rbac
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: permission_denied
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "a request without X-User-Role/X-User-ID is rejected 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/sites"
              payload: { name: "NoAuth Site", latitude: 34.0, longitude: -118.0, ground_length_m: 1000, ground_width_m: 800, site_max_wind_kt: 20, site_max_gust_kt: 25, site_max_altitude_ft: 500 }
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_UNAUTHENTICATED and HTTP status 401"

      - name: production_planner_cannot_decide_authorization
        claim_type: permission_denied
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "decide is exclusive to AuthorityOfficer; a ProductionPlanner is rejected 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["Site A; Show S; authorization UNDER_REVIEW"]
          setup_api_calls:
            - { call: "POST /api/sites", payload: { name: "Site A", latitude: 34.0, longitude: -118.0, ground_length_m: 1000, ground_width_m: 800, site_max_wind_kt: 20, site_max_gust_kt: 25, site_max_altitude_ft: 500 }, as: ProductionPlanner, captures: { site_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /api/show-events", payload: { site_id: "${site_id}", name: "Show S", window_start: "2026-08-10T19:00:00Z", window_end: "2026-08-10T19:30:00Z", drone_count_planned: 10 }, as: ProductionPlanner, captures: { show_id: $.data.id } }
            - { call: "POST /api/airspace-authorizations", payload: { show_event_id: "${show_id}", window_start: "2026-08-10T18:00:00Z", window_end: "2026-08-10T21:00:00Z", altitude_ceiling_ft: 450, waiver_types: [] }, as: ProductionPlanner, captures: { auth_id: $.data.id } }
            - { call: "POST /api/airspace-authorizations/${auth_id}/submit", payload: {}, as: ProductionPlanner }
          trigger:
            - { call: "POST /api/airspace-authorizations/${auth_id}/decide", payload: { decision: "APPROVED" }, as: ProductionPlanner, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN (403) and the authorization remains UNDER_REVIEW"

      - name: fleet_manager_cannot_create_show_event
        claim_type: permission_denied
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "show creation is exclusive to ProductionPlanner; FleetManager is rejected 403."
        test_recipe:
          setup: ["Site A exists"]
          setup_api_calls:
            - { call: "POST /api/sites", payload: { name: "Site A", latitude: 34.0, longitude: -118.0, ground_length_m: 1000, ground_width_m: 800, site_max_wind_kt: 20, site_max_gust_kt: 25, site_max_altitude_ft: 500 }, as: ProductionPlanner, captures: { site_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
          trigger:
            - { call: "POST /api/show-events", payload: { site_id: "${site_id}", name: "Forbidden Show", window_start: "2026-08-10T19:00:00Z", window_end: "2026-08-10T19:30:00Z", drone_count_planned: 10 }, as: FleetManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN (403)"

      - name: safety_officer_cannot_register_drone
        claim_type: permission_denied
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "drone registry is exclusive to FleetManager; SafetyOfficer is rejected 403."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/drones", payload: { serial_number: "SN-NOPE", model: "LUM-2" }, as: SafetyOfficer, as_user_id: "so-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN (403)"

      - name: authority_officer_cannot_record_weather
        claim_type: permission_denied
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "weather recording is exclusive to SafetyOfficer; AuthorityOfficer is rejected 403."
        test_recipe:
          setup: ["Site A exists"]
          setup_api_calls:
            - { call: "POST /api/sites", payload: { name: "Site A", latitude: 34.0, longitude: -118.0, ground_length_m: 1000, ground_width_m: 800, site_max_wind_kt: 20, site_max_gust_kt: 25, site_max_altitude_ft: 500 }, as: ProductionPlanner, captures: { site_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
          trigger:
            - { call: "POST /api/weather-readings", payload: { site_id: "${site_id}", recorded_at: "2026-07-31T23:00:00Z", wind_speed_kt: 5, gust_kt: 8, precip_mm_hr: 0.0, temperature_c: 18 }, as: AuthorityOfficer, as_user_id: "ao-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN (403)"

      - name: ops_admin_cannot_file_incident
        claim_type: permission_denied
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "incident filing is exclusive to SafetyOfficer; OpsAdmin (test-driving role) is rejected 403."
        test_recipe:
          setup: ["empty DB (role check precedes existence)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/incident-reports", payload: { show_event_id: "11111111-1111-4111-8111-111111111111", severity: "MINOR", description: "x" }, as: OpsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN (403) — role check (p2) fires before existence (p3)"

  # ===========================================================================
  # Section: cross_cutting_layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_safety_config_create
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[safety-config-create-stale-show]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "POST /api/safety-configurations with a superseded expected_show_event_version fails 412 ERR_STALE_VERSION; the same call with the fresh version succeeds and supersedes the first config."
        test_recipe:
          setup: ["Site A; Show S (version v_a at creation); config C1 created with v_a (show version advanced)"]
          setup_api_calls:
            - { call: "POST /api/sites", payload: { name: "Site A", latitude: 34.0, longitude: -118.0, ground_length_m: 1000, ground_width_m: 800, site_max_wind_kt: 20, site_max_gust_kt: 25, site_max_altitude_ft: 500 }, as: ProductionPlanner, captures: { site_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /api/show-events", payload: { site_id: "${site_id}", name: "Show S", window_start: "2026-08-10T19:00:00Z", window_end: "2026-08-10T19:30:00Z", drone_count_planned: 10 }, as: ProductionPlanner, captures: { show_id: $.data.id, v_a: $.data.version } }
            - { call: "POST /api/safety-configurations", payload: { show_event_id: "${show_id}", geofence_radius_m: 250, altitude_hard_ceiling_ft: 400, lost_link_action: "RETURN_TO_HOME", geofence_breach_action: "IMMEDIATE_LAND", battery_rtl_threshold_pct: 30, expected_show_event_version: "${v_a}" }, as: ProductionPlanner, as_user_id: "planner-1", captures: { cfg1: $.data.id } }
          trigger:
            - { call: "POST /api/safety-configurations", payload: { show_event_id: "${show_id}", geofence_radius_m: 260, altitude_hard_ceiling_ft: 400, lost_link_action: "HOVER_THEN_LAND", geofence_breach_action: "RETURN_TO_HOME", battery_rtl_threshold_pct: 25, expected_show_event_version: "${v_a}" }, as: ProductionPlanner, as_user_id: "planner-1", captures: { err: $.data.error_id } }
            - { call: "GET /api/show-events/${show_id}", as: ProductionPlanner, captures: { v_b: $.data.version } }
            - { call: "POST /api/safety-configurations", payload: { show_event_id: "${show_id}", geofence_radius_m: 260, altitude_hard_ceiling_ft: 400, lost_link_action: "HOVER_THEN_LAND", geofence_breach_action: "RETURN_TO_HOME", battery_rtl_threshold_pct: 25, expected_show_event_version: "${v_b}" }, as: ProductionPlanner, as_user_id: "planner-1", captures: { cfg2: $.data.id } }
            - { call: "GET /api/safety-configurations/${cfg1}", as: ProductionPlanner, captures: { cfg1_st: $.data.status } }
          assert:
            - "stale expected_show_event_version (${v_a} after C1 bumped it): ${err} == ERR_STALE_VERSION (412)"
            - "fresh version ${v_b}: C2 created (${cfg2})"
            - "C1 auto-superseded by C2's creation: ${cfg1_st} == SUPERSEDED"

      - name: occ_stale_version_design_lock
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[design-lock-stale-show]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "design lock carries the same OCC guard on the show: a payment mutation advances the show version, so locking with the pre-payment version fails 412; locking with the fresh version succeeds."
        test_recipe:
          setup: ["Site A; Show S with SIMULATED design D1; show version captured before and after a deposit payment"]
          setup_api_calls:
            - { call: "POST /api/sites", payload: { name: "Site A", latitude: 34.0, longitude: -118.0, ground_length_m: 1000, ground_width_m: 800, site_max_wind_kt: 20, site_max_gust_kt: 25, site_max_altitude_ft: 500 }, as: ProductionPlanner, captures: { site_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /api/show-events", payload: { site_id: "${site_id}", name: "Show S", window_start: "2026-08-10T19:00:00Z", window_end: "2026-08-10T19:30:00Z", drone_count_planned: 10 }, as: ProductionPlanner, captures: { show_id: $.data.id, v_pre: $.data.version } }
            - { call: "POST /api/show-designs", payload: { show_event_id: "${show_id}", drone_count: 10, max_altitude_ft: 300, duration_sec: 600, min_separation_m: 3.0 }, as: ProductionPlanner, captures: { design_id: $.data.id } }
            - { call: "POST /api/simulation-runs", payload: { show_design_id: "${design_id}", min_separation_observed_m: 3.5, battery_draw_pct: 55, max_speed_mps: 9.0 }, as: ProductionPlanner }
            - { call: "POST /api/show-events/${show_id}/record-payment", payload: { kind: "DEPOSIT", amount_cents: 165375 }, as: ProductionPlanner }
          trigger:
            - { call: "POST /api/show-designs/${design_id}/lock", payload: { expected_show_event_version: "${v_pre}" }, as: ProductionPlanner, captures: { err: $.data.error_id } }
            - { call: "GET /api/show-events/${show_id}", as: ProductionPlanner, captures: { v_fresh: $.data.version } }
            - { call: "POST /api/show-designs/${design_id}/lock", payload: { expected_show_event_version: "${v_fresh}" }, as: ProductionPlanner, captures: { st: $.data.status } }
          assert:
            - "stale lock (payment bumped the show version after ${v_pre} was captured): ${err} == ERR_STALE_VERSION (412)"
            - "fresh lock: ${st} == LOCKED"

      - name: authorize_revalidates_coverage_after_reschedule
        claim_type: version_pinning_revalidation
        grounds:
          - state_machines.ShowEvent.DESIGN_LOCKED_to_AUTHORIZED
          - errors[ERR_AUTHORIZATION_WINDOW_INSUFFICIENT]
        distinguishing_aspect: "the pinned authorization is re-validated at authorize time: after the show is postponed and rescheduled to 2026-08-20 (outside the APPROVED window 2026-08-10 18:00-21:00), authorize fails with ERR_AUTHORIZATION_WINDOW_INSUFFICIENT."
        test_recipe:
          setup: ["Site A; Show S AUTHORIZED via APPROVED auth (2026-08-10T18:00-21:00Z); show postponed and rescheduled to 2026-08-20T19:00-19:30Z (auto-advanced to DESIGN_LOCKED)"]
          setup_api_calls:
            - { call: "POST /api/sites", payload: { name: "Site A", latitude: 34.0, longitude: -118.0, ground_length_m: 1000, ground_width_m: 800, site_max_wind_kt: 20, site_max_gust_kt: 25, site_max_altitude_ft: 500 }, as: ProductionPlanner, captures: { site_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /api/show-events", payload: { site_id: "${site_id}", name: "Show S", window_start: "2026-08-10T19:00:00Z", window_end: "2026-08-10T19:30:00Z", drone_count_planned: 10 }, as: ProductionPlanner, captures: { show_id: $.data.id } }
            - { call: "POST /api/show-designs", payload: { show_event_id: "${show_id}", drone_count: 10, max_altitude_ft: 300, duration_sec: 600, min_separation_m: 3.0 }, as: ProductionPlanner, captures: { design_id: $.data.id } }
            - { call: "POST /api/simulation-runs", payload: { show_design_id: "${design_id}", min_separation_observed_m: 3.5, battery_draw_pct: 55, max_speed_mps: 9.0 }, as: ProductionPlanner }
            - { call: "GET /api/show-events/${show_id}", as: ProductionPlanner, captures: { v1: $.data.version } }
            - { call: "POST /api/show-designs/${design_id}/lock", payload: { expected_show_event_version: "${v1}" }, as: ProductionPlanner }
            - { call: "GET /api/show-events/${show_id}", as: ProductionPlanner, captures: { v2: $.data.version } }
            - { call: "POST /api/safety-configurations", payload: { show_event_id: "${show_id}", geofence_radius_m: 250, altitude_hard_ceiling_ft: 400, lost_link_action: "RETURN_TO_HOME", geofence_breach_action: "IMMEDIATE_LAND", battery_rtl_threshold_pct: 30, expected_show_event_version: "${v2}" }, as: ProductionPlanner, as_user_id: "planner-1", captures: { config_id: $.data.id } }
            - { call: "POST /api/safety-configurations/${config_id}/approve", payload: {}, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /api/airspace-authorizations", payload: { show_event_id: "${show_id}", window_start: "2026-08-10T18:00:00Z", window_end: "2026-08-10T21:00:00Z", altitude_ceiling_ft: 450, waiver_types: [] }, as: ProductionPlanner, captures: { auth_id: $.data.id } }
            - { call: "POST /api/airspace-authorizations/${auth_id}/submit", payload: {}, as: ProductionPlanner }
            - { call: "POST /api/airspace-authorizations/${auth_id}/decide", payload: { decision: "APPROVED" }, as: AuthorityOfficer, as_user_id: "ao-1" }
            - { call: "POST /api/show-events/${show_id}/authorize", payload: { authorization_id: "${auth_id}" }, as: ProductionPlanner }
            - { call: "POST /api/show-events/${show_id}/postpone", payload: {}, as: ProductionPlanner }
            - { call: "POST /api/show-events/${show_id}/reschedule", payload: { window_start: "2026-08-20T19:00:00Z", window_end: "2026-08-20T19:30:00Z" }, as: ProductionPlanner, captures: { st: $.data.lifecycle_status } }
          trigger:
            - { call: "POST /api/show-events/${show_id}/authorize", payload: { authorization_id: "${auth_id}" }, as: ProductionPlanner, captures: { err: $.data.error_id } }
          assert:
            - "after reschedule: ${st} == DESIGN_LOCKED (pinned design still LOCKED)"
            - "re-authorize with the old authorization: ${err} == ERR_AUTHORIZATION_WINDOW_INSUFFICIENT (window no longer covered)"

      - name: layer_cascading_side_effects
        claim_type: cascade_chain
        grounds: [state_machines.IncidentReport.UNDER_INVESTIGATION_to_CLOSED_CONFIRMED]
        excluded_because:
          difficulty_instance: critical_incident_grounding_cascade
          rationale: "The N-level cascade (incident -> drones -> assignments -> shows) is asserted end-to-end by the named §1.8 instance."

      - name: layer_dual_variant_calculation
        claim_type: variant_divergence
        grounds: [calculations.crowd_distance, calculations.battery_derated_charge]
        excluded_because:
          difficulty_instance: crowd_radius_planned_vs_as_flown_divergence
          rationale: "Variant divergence and selection are asserted by §1.8 dual_variant_calc instances (perimeter and battery domains)."

      - name: layer_rate_threshold_triggers
        claim_type: threshold_boundary
        grounds: [calculations.cancellation_refund, calculations.go_no_go_verdict]
        excluded_because:
          difficulty_instance: refund_lead_time_336h_exact_boundary
          rationale: "Threshold boundaries (lead-time tiers, wind limits) are asserted by §1.8 boundary_precision_check instances."

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_after_assignment
        claim_type: immediate_visibility
        grounds: [complexity_profile, entities.ShowEvent.fields.assigned_count]
        distinguishing_aspect: "immediate consistency: the assignment POST response and the very next GET of the show both already reflect assigned_count 1 — no lag, no reconciliation window."
        test_recipe:
          setup: ["Site A; Show S AUTHORIZED (design 300ft/2); drone d1 AVAILABLE"]
          setup_api_calls:
            - { call: "POST /api/sites", payload: { name: "Site A", latitude: 34.0, longitude: -118.0, ground_length_m: 1000, ground_width_m: 800, site_max_wind_kt: 20, site_max_gust_kt: 25, site_max_altitude_ft: 500 }, as: ProductionPlanner, captures: { site_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /api/show-events", payload: { site_id: "${site_id}", name: "Show S", window_start: "2026-08-10T19:00:00Z", window_end: "2026-08-10T19:30:00Z", drone_count_planned: 2 }, as: ProductionPlanner, captures: { show_id: $.data.id } }
            - { call: "POST /api/show-designs", payload: { show_event_id: "${show_id}", drone_count: 2, max_altitude_ft: 300, duration_sec: 600, min_separation_m: 3.0 }, as: ProductionPlanner, captures: { design_id: $.data.id } }
            - { call: "POST /api/simulation-runs", payload: { show_design_id: "${design_id}", min_separation_observed_m: 3.5, battery_draw_pct: 55, max_speed_mps: 9.0 }, as: ProductionPlanner }
            - { call: "GET /api/show-events/${show_id}", as: ProductionPlanner, captures: { v1: $.data.version } }
            - { call: "POST /api/show-designs/${design_id}/lock", payload: { expected_show_event_version: "${v1}" }, as: ProductionPlanner }
            - { call: "GET /api/show-events/${show_id}", as: ProductionPlanner, captures: { v2: $.data.version } }
            - { call: "POST /api/safety-configurations", payload: { show_event_id: "${show_id}", geofence_radius_m: 250, altitude_hard_ceiling_ft: 400, lost_link_action: "RETURN_TO_HOME", geofence_breach_action: "IMMEDIATE_LAND", battery_rtl_threshold_pct: 30, expected_show_event_version: "${v2}" }, as: ProductionPlanner, as_user_id: "planner-1", captures: { config_id: $.data.id } }
            - { call: "POST /api/safety-configurations/${config_id}/approve", payload: {}, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /api/airspace-authorizations", payload: { show_event_id: "${show_id}", window_start: "2026-08-10T18:00:00Z", window_end: "2026-08-10T21:00:00Z", altitude_ceiling_ft: 450, waiver_types: [] }, as: ProductionPlanner, captures: { auth_id: $.data.id } }
            - { call: "POST /api/airspace-authorizations/${auth_id}/submit", payload: {}, as: ProductionPlanner }
            - { call: "POST /api/airspace-authorizations/${auth_id}/decide", payload: { decision: "APPROVED" }, as: AuthorityOfficer, as_user_id: "ao-1" }
            - { call: "POST /api/show-events/${show_id}/authorize", payload: { authorization_id: "${auth_id}" }, as: ProductionPlanner }
            - { call: "POST /api/drones", payload: { serial_number: "SN-IMM", model: "LUM-2" }, as: FleetManager, captures: { d1: $.data.id } }
          trigger:
            - { call: "POST /api/launch-grid-assignments", payload: { show_event_id: "${show_id}", drone_id: "${d1}", grid_row: 0, grid_col: 0 }, as: FleetManager, captures: { asg_st: $.data.status } }
            - { call: "GET /api/show-events/${show_id}", as: FleetManager, captures: { cnt: $.data.assigned_count } }
            - { call: "GET /api/drones/${d1}", as: FleetManager, captures: { dst: $.data.status } }
          assert:
            - "${asg_st} == ASSIGNED"
            - "immediate read: ${cnt} == 1 and ${dst} == RESERVED"
