          - entities.KnownIssue.fields.resolution_run_id
        distinguishing_aspect: "Resolution evidence must belong to the issue's own component: a COMPLETED run on a second component returns ERR_RESOLUTION_EVIDENCE_INVALID 422 and the train's committed_effort_points stays 2 instead of being released."
        test_recipe:
