# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Driver Record Verification & Interstate Data Exchange
# Breadth probe over §1.1–§1.7 claims not already covered by §1.8.
# Default logical clock 2026-09-01T00:00:00Z unless a chain sets it.
# =============================================================================

scaffold_corner_design:
  # ---------------------------------------------------------------------------
  # From Table 1 (Entities)
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_jurisdiction_applies_defaults
        claim_type: creation
        grounds:
          - "entities.Jurisdiction"
          - "state_machines.Jurisdiction"
        distinguishing_aspect: "A created jurisdiction starts APPLIED with computed defaults and common fields pinned."
        test_recipe:
          setup: ["Empty database; logical clock at default 2026-09-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /driver-exchange/jurisdictions"
              payload: { code: "AA", name: "State A", fee_tier: "TIER_1" }
              as: AssociationAdmin
              captures: { j_id: $.data.id, j_status: $.data.membership_status, j_ver: $.data.version, j_score: $.data.timeliness_score_bp, j_certs: $.data.certified_systems_count }
          assert:
            - "j_status == APPLIED (initial state)"
            - "j_ver == 1 (version starts at 1)"
            - "j_score == 10000 (empty conviction set is fully timely)"
            - "j_certs == 0"
            - "j_id matches the dashed UUID format; created_at == 2026-09-01T00:00:00.000Z logical clock, not wall clock"

      - name: create_jurisdiction_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.Jurisdiction.fields.fee_tier"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting the required input field fee_tier is rejected with ERR_INVALID_REQUEST and nothing is persisted."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /driver-exchange/jurisdictions"
              payload: { code: "AA", name: "State A" }
              as: AssociationAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST (http 400)"

      - name: create_jurisdiction_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - "entities.Jurisdiction.fields.fee_tier"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "fee_tier must be one of TIER_1 | TIER_2 | TIER_3; TIER_9 is rejected."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /driver-exchange/jurisdictions"
              payload: { code: "AA", name: "State A", fee_tier: "TIER_9" }
              as: AssociationAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST (http 400)"

      - name: get_jurisdiction_not_found_returns_404
        claim_type: not_found
        grounds:
          - "errors[ERR_JURISDICTION_NOT_FOUND]"
        distinguishing_aspect: "Reading a well-formed but nonexistent jurisdiction id yields ERR_JURISDICTION_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /driver-exchange/jurisdictions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: AssociationAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_JURISDICTION_NOT_FOUND (http 404)"

      - name: duplicate_jurisdiction_code_rejected
        claim_type: type_constraints
        grounds:
          - "entities.Jurisdiction.fields.code"
          - "errors[ERR_JURISDICTION_CODE_TAKEN]"
        distinguishing_aspect: "code is unique across jurisdictions; the second registration with code AA fails."
        test_recipe:
          setup: ["Jurisdiction AA exists"]
          setup_api_calls:
            - call: "POST /driver-exchange/jurisdictions"
              payload: { code: "AA", name: "State A", fee_tier: "TIER_1" }
              as: AssociationAdmin
          trigger:
            - call: "POST /driver-exchange/jurisdictions"
              payload: { code: "AA", name: "Another A", fee_tier: "TIER_2" }
              as: AssociationAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_JURISDICTION_CODE_TAKEN (http 409)"

      - name: driver_create_and_retrieval
        claim_type: retrieval
        grounds:
          - "entities.DriverIdentity"
        distinguishing_aspect: "A registered driver round-trips: GET returns exactly the fields supplied at POST."
        test_recipe:
          setup: ["A bare jurisdiction AA exists (APPLIED); its registrar registers the driver"]
          setup_api_calls:
            - call: "POST /driver-exchange/jurisdictions"
              payload: { code: "AA", name: "State A", fee_tier: "TIER_1" }
              as: AssociationAdmin
              captures: { j_a: $.data.id }
            - call: "POST /driver-exchange/drivers"
              payload: { full_name: "Round Trip", date_of_birth: "1995-06-15", ssn_last4_hash: "hRT1", lawful_status_basis: "US_CITIZEN" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { d_id: $.data.id }
          trigger:
            - call: "GET /driver-exchange/drivers/${d_id}"
              payload: {}
              as: FederalVerifier
          assert:
            - "GET returns full_name == Round Trip, date_of_birth == 1995-06-15, ssn_last4_hash == hRT1, lawful_status_basis == US_CITIZEN"
            - "version == 1 and created_at present"

      - name: conviction_is_immutable_event
        claim_type: immutability
        grounds:
          - "entities.Conviction"
        distinguishing_aspect: "Conviction declares common_fields: false — the response carries id and created_at but no version/updated_at, and no update or delete endpoint exists for it."
        test_recipe:
          setup:
            - "Jurisdiction AA is ACTIVE with CERTIFIED POINTER_NETWORK and COMMERCIAL_DRIVER_NETWORK participations; driver D's ACTIVE record is held by AA"
          setup_api_calls:
            - call: "POST /driver-exchange/jurisdictions"
              payload: { code: "AA", name: "State A", fee_tier: "TIER_1" }
              as: AssociationAdmin
              captures: { j_a: $.data.id }
            - call: "POST /driver-exchange/system-participations"
              payload: { jurisdiction_id: "${j_a}", system: "POINTER_NETWORK" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { p_a: $.data.id }
            - call: "POST /driver-exchange/connection-certifications"
              payload: { participation_id: "${p_a}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T00:00:00Z" }
              as: CertificationEngineer
              captures: { c_a: $.data.id }
            - call: "POST /driver-exchange/connection-certifications/${c_a}/complete"
              payload: { result: "PASSED", score: 97 }
              as: CertificationEngineer
            - call: "POST /driver-exchange/system-participations/${p_a}/grant-certification"
              payload: {}
              as: AssociationAdmin
            - call: "POST /driver-exchange/system-participations"
              payload: { jurisdiction_id: "${j_a}", system: "COMMERCIAL_DRIVER_NETWORK" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { p_a2: $.data.id }
            - call: "POST /driver-exchange/connection-certifications"
              payload: { participation_id: "${p_a2}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T00:00:00Z" }
              as: CertificationEngineer
              captures: { c_a2: $.data.id }
            - call: "POST /driver-exchange/connection-certifications/${c_a2}/complete"
              payload: { result: "PASSED", score: 95 }
              as: CertificationEngineer
            - call: "POST /driver-exchange/system-participations/${p_a2}/grant-certification"
              payload: {}
              as: AssociationAdmin
            - call: "PATCH /driver-exchange/jurisdictions/${j_a}"
              payload: { status: "ACTIVE" }
              as: AssociationAdmin
            - call: "POST /driver-exchange/drivers"
              payload: { full_name: "Immutable Case", date_of_birth: "1990-02-02", ssn_last4_hash: "hIM1", lawful_status_basis: "US_CITIZEN" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /driver-exchange/driver-records"
              payload: { driver_id: "${d_id}", expected_driver_version: "${d_v}" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /driver-exchange/convictions"
              payload: { record_id: "${r_id}", offense_date: "2026-08-10", conviction_date: "2026-08-20", severity: "NON_CMV", points: 2 }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { cv_id: $.data.id }
          assert:
            - "The response carries id, created_at, record_id, offense_date, conviction_date, severity, points, posted_at, is_late"
            - "The response carries NO version and NO updated_at field (common_fields: false)"

      - name: vehicle_title_brands_default_empty
        claim_type: defaults
        grounds:
          - "entities.VehicleTitle.fields.brands"
        distinguishing_aspect: "Omitting brands at title creation defaults the brand set to []."
        test_recipe:
          setup: ["Jurisdiction AA is ACTIVE with CERTIFIED POINTER_NETWORK and TITLE_NETWORK participations"]
          setup_api_calls:
            - call: "POST /driver-exchange/jurisdictions"
              payload: { code: "AA", name: "State A", fee_tier: "TIER_1" }
              as: AssociationAdmin
              captures: { j_a: $.data.id }
            - call: "POST /driver-exchange/system-participations"
              payload: { jurisdiction_id: "${j_a}", system: "POINTER_NETWORK" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { p_a: $.data.id }
            - call: "POST /driver-exchange/connection-certifications"
              payload: { participation_id: "${p_a}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T00:00:00Z" }
              as: CertificationEngineer
              captures: { c_a: $.data.id }
            - call: "POST /driver-exchange/connection-certifications/${c_a}/complete"
              payload: { result: "PASSED", score: 97 }
              as: CertificationEngineer
            - call: "POST /driver-exchange/system-participations/${p_a}/grant-certification"
              payload: {}
              as: AssociationAdmin
            - call: "POST /driver-exchange/system-participations"
              payload: { jurisdiction_id: "${j_a}", system: "TITLE_NETWORK" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { p_a2: $.data.id }
            - call: "POST /driver-exchange/connection-certifications"
              payload: { participation_id: "${p_a2}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T00:00:00Z" }
              as: CertificationEngineer
              captures: { c_a2: $.data.id }
            - call: "POST /driver-exchange/connection-certifications/${c_a2}/complete"
              payload: { result: "PASSED", score: 93 }
              as: CertificationEngineer
            - call: "POST /driver-exchange/system-participations/${p_a2}/grant-certification"
              payload: {}
              as: AssociationAdmin
            - call: "PATCH /driver-exchange/jurisdictions/${j_a}"
              payload: { status: "ACTIVE" }
              as: AssociationAdmin
          trigger:
            - call: "POST /driver-exchange/vehicle-titles"
              payload: { vin: "1FTFW1ET5DFC10312" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { vt_brands: $.data.brands, vt_status: $.data.status }
          assert:
            - "vt_brands == [] (default applied)"
            - "vt_status == ACTIVE and washing_alert == false"

      - name: create_jurisdiction_computed_field_input_ignored
        claim_type: computed_fields
        grounds:
          - "entities.Jurisdiction.fields.timeliness_score_bp"
        distinguishing_aspect: "Client-supplied values for computed fields are ignored: posting timeliness_score_bp 1 still yields 10000."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /driver-exchange/jurisdictions"
              payload: { code: "AA", name: "State A", fee_tier: "TIER_1", timeliness_score_bp: 1 }
              as: AssociationAdmin
              captures: { j_score: $.data.timeliness_score_bp }
          assert:
            - "j_score == 10000 (server-computed value wins; client input for the computed field is ignored)"

      - name: driver_records_list_pagination
        claim_type: listing
        grounds:
          - "response_envelope"
          - "entities.DriverRecord"
        distinguishing_aspect: "List endpoints honor limit/offset with envelope pagination fields: two records, limit 1 -> total_count 2, has_more true, first page length 1."
        test_recipe:
          setup:
            - "Jurisdiction AA is ACTIVE with a CERTIFIED POINTER_NETWORK participation"
            - "Two drivers each have an ACTIVE record claimed by AA"
          setup_api_calls:
            - call: "POST /driver-exchange/jurisdictions"
              payload: { code: "AA", name: "State A", fee_tier: "TIER_1" }
              as: AssociationAdmin
              captures: { j_a: $.data.id }
            - call: "POST /driver-exchange/system-participations"
              payload: { jurisdiction_id: "${j_a}", system: "POINTER_NETWORK" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { p_a: $.data.id }
            - call: "POST /driver-exchange/connection-certifications"
              payload: { participation_id: "${p_a}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T00:00:00Z" }
              as: CertificationEngineer
              captures: { c_a: $.data.id }
            - call: "POST /driver-exchange/connection-certifications/${c_a}/complete"
              payload: { result: "PASSED", score: 97 }
              as: CertificationEngineer
            - call: "POST /driver-exchange/system-participations/${p_a}/grant-certification"
              payload: {}
              as: AssociationAdmin
            - call: "PATCH /driver-exchange/jurisdictions/${j_a}"
              payload: { status: "ACTIVE" }
              as: AssociationAdmin
            - call: "POST /driver-exchange/drivers"
              payload: { full_name: "Page One", date_of_birth: "1990-01-01", ssn_last4_hash: "hPG1", lawful_status_basis: "US_CITIZEN" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { d1_id: $.data.id, d1_v: $.data.version }
            - call: "POST /driver-exchange/driver-records"
              payload: { driver_id: "${d1_id}", expected_driver_version: "${d1_v}" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { r1_id: $.data.id }
            - call: "POST /driver-exchange/drivers"
              payload: { full_name: "Page Two", date_of_birth: "1991-02-02", ssn_last4_hash: "hPG2", lawful_status_basis: "US_CITIZEN" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { d2_id: $.data.id, d2_v: $.data.version }
            - call: "POST /driver-exchange/driver-records"
              payload: { driver_id: "${d2_id}", expected_driver_version: "${d2_v}" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { r2_id: $.data.id }
          trigger:
            - call: "GET /driver-exchange/driver-records"
              payload: { limit: 1, offset: 0 }
              as: AssociationAdmin
            - call: "GET /driver-exchange/driver-records"
              payload: { limit: 1, offset: 1 }
              as: AssociationAdmin
          assert:
            - "First page: data length == 1 and data[0].id == ${r1_id} (created_at ascending); envelope pagination total_count == 2, has_more == true, limit == 1, offset == 0"
            - "Second page: data length == 1 and data[0].id == ${r2_id}; has_more == false, offset == 1"

  # ---------------------------------------------------------------------------
  # From Table 2 (State Machines)
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: jurisdiction_activation_requires_certified_pointer
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Jurisdiction.APPLIED_to_ACTIVE"
          - "errors[ERR_PARTICIPATION_NOT_CERTIFIED]"
        distinguishing_aspect: "Activating a jurisdiction whose POINTER_NETWORK participation is still ENROLLING (no certification at all) is rejected."
        test_recipe:
          setup: ["Jurisdiction AA exists (APPLIED) with an ENROLLING POINTER_NETWORK participation and no certifications"]
          setup_api_calls:
            - call: "POST /driver-exchange/jurisdictions"
              payload: { code: "AA", name: "State A", fee_tier: "TIER_1" }
              as: AssociationAdmin
              captures: { j_a: $.data.id }
            - call: "POST /driver-exchange/system-participations"
              payload: { jurisdiction_id: "${j_a}", system: "POINTER_NETWORK" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
          trigger:
            - call: "PATCH /driver-exchange/jurisdictions/${j_a}"
              payload: { status: "ACTIVE" }
              as: AssociationAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PARTICIPATION_NOT_CERTIFIED (http 409)"
            - "Jurisdiction.${j_a}.membership_status remains APPLIED"

      - name: grant_without_passed_certification_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.SystemParticipation.TESTING_to_CERTIFIED"
          - "errors[ERR_GRANT_REQUIRES_PASSED_CERTIFICATION]"
        distinguishing_aspect: "The latest completed certification (max window_start) is FAILED, so granting certification is rejected and the participation stays TESTING."
        test_recipe:
          setup: ["Jurisdiction AA (APPLIED) with a POINTER_NETWORK participation whose only certification completed FAILED"]
          setup_api_calls:
            - call: "POST /driver-exchange/jurisdictions"
              payload: { code: "AA", name: "State A", fee_tier: "TIER_1" }
              as: AssociationAdmin
              captures: { j_a: $.data.id }
            - call: "POST /driver-exchange/system-participations"
              payload: { jurisdiction_id: "${j_a}", system: "POINTER_NETWORK" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { p_a: $.data.id }
            - call: "POST /driver-exchange/connection-certifications"
              payload: { participation_id: "${p_a}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T00:00:00Z" }
              as: CertificationEngineer
              captures: { c_a: $.data.id }
            - call: "POST /driver-exchange/connection-certifications/${c_a}/complete"
              payload: { result: "FAILED", score: 41 }
              as: CertificationEngineer
          trigger:
            - call: "POST /driver-exchange/system-participations/${p_a}/grant-certification"
              payload: {}
              as: AssociationAdmin
              captures: { err: $.data.error_id }
            - call: "GET /driver-exchange/jurisdictions/${j_a}/system-participations"
              payload: {}
              as: AssociationAdmin
              captures: { p_status: "$.data[0].status" }
          assert:
            - "err == ERR_GRANT_REQUIRES_PASSED_CERTIFICATION (http 409)"
            - "p_status == TESTING (grant failure leaves the machine in place)"

      - name: certification_complete_outside_window_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.ConnectionCertification.SCHEDULED_to_PASSED"
          - "errors[ERR_OUTSIDE_TEST_WINDOW]"
        distinguishing_aspect: "The certification window [2026-08-01, 2026-08-15) has fully elapsed at the 2026-09-01 default clock, so completion is rejected and the certification stays SCHEDULED."
        test_recipe:
          setup: ["Jurisdiction AA (APPLIED) with a POINTER_NETWORK participation and a SCHEDULED certification whose window already closed"]
          setup_api_calls:
            - call: "POST /driver-exchange/jurisdictions"
              payload: { code: "AA", name: "State A", fee_tier: "TIER_1" }
              as: AssociationAdmin
              captures: { j_a: $.data.id }
            - call: "POST /driver-exchange/system-participations"
              payload: { jurisdiction_id: "${j_a}", system: "POINTER_NETWORK" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { p_a: $.data.id }
            - call: "POST /driver-exchange/connection-certifications"
              payload: { participation_id: "${p_a}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-15T00:00:00Z" }
              as: CertificationEngineer
              captures: { c_a: $.data.id }
          trigger:
            - call: "POST /driver-exchange/connection-certifications/${c_a}/complete"
              payload: { result: "PASSED", score: 97 }
              as: CertificationEngineer
              captures: { err: $.data.error_id }
            - call: "GET /driver-exchange/connection-certifications/${c_a}"
              payload: {}
              as: AuditAuthority
              captures: { c_status: $.data.status }
          assert:
            - "err == ERR_OUTSIDE_TEST_WINDOW (http 422)"
            - "c_status == SCHEDULED (no state change, no score recorded)"

      - name: certification_window_end_exact_is_outside
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.ConnectionCertification.SCHEDULED_to_PASSED"
          - "entities.ConnectionCertification.fields.window_end"
        distinguishing_aspect: "Half-open upper bound: completing at an instant exactly equal to window_end (2026-09-01T00:00:00Z, the default clock) is OUTSIDE the window."
        test_recipe:
          setup: ["Jurisdiction AA (APPLIED) with a POINTER_NETWORK participation and a SCHEDULED certification with window_end exactly 2026-09-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /driver-exchange/jurisdictions"
              payload: { code: "AA", name: "State A", fee_tier: "TIER_1" }
              as: AssociationAdmin
              captures: { j_a: $.data.id }
            - call: "POST /driver-exchange/system-participations"
              payload: { jurisdiction_id: "${j_a}", system: "POINTER_NETWORK" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { p_a: $.data.id }
            - call: "POST /driver-exchange/connection-certifications"
              payload: { participation_id: "${p_a}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }
              as: CertificationEngineer
              captures: { c_a: $.data.id }
          trigger:
            - call: "POST /driver-exchange/connection-certifications/${c_a}/complete"
              payload: { result: "PASSED", score: 97 }
              as: CertificationEngineer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_OUTSIDE_TEST_WINDOW (the half-open interval [start, end) excludes its end instant)"

      - name: certification_invalid_window_rejected
        claim_type: precondition_enforcement
        grounds:
          - "validations[priority=9]"
          - "errors[ERR_INVALID_WINDOW]"
        distinguishing_aspect: "window_end equal to window_start (empty interval) is a 400 ERR_INVALID_WINDOW at scheduling time."
        test_recipe:
          setup: ["Jurisdiction AA (APPLIED) with a POINTER_NETWORK participation"]
          setup_api_calls:
            - call: "POST /driver-exchange/jurisdictions"
              payload: { code: "AA", name: "State A", fee_tier: "TIER_1" }
              as: AssociationAdmin
              captures: { j_a: $.data.id }
            - call: "POST /driver-exchange/system-participations"
              payload: { jurisdiction_id: "${j_a}", system: "POINTER_NETWORK" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { p_a: $.data.id }
          trigger:
            - call: "POST /driver-exchange/connection-certifications"
              payload: { participation_id: "${p_a}", window_start: "2026-10-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z" }
              as: CertificationEngineer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_WINDOW (http 400)"

      - name: withdrawn_jurisdiction_is_terminal
        claim_type: terminal_lockdown
        grounds:
          - "state_machines.Jurisdiction.SUSPENDED_to_WITHDRAWN"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "WITHDRAWN is terminal: a withdrawn jurisdiction cannot be re-activated."
        test_recipe:
          setup: ["Jurisdiction AA is ACTIVE (CERTIFIED POINTER_NETWORK participation), then WITHDRAWN"]
          setup_api_calls:
            - call: "POST /driver-exchange/jurisdictions"
              payload: { code: "AA", name: "State A", fee_tier: "TIER_1" }
              as: AssociationAdmin
              captures: { j_a: $.data.id }
            - call: "POST /driver-exchange/system-participations"
