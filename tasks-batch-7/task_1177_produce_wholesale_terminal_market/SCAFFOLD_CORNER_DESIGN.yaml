  - section: validations
    instances:
      - name: customer_create_terms_over_30_returns_terms_exceeded
        claim_type: conditional_validation
        grounds: ["validations[priority=9]", "errors[ERR_TERMS_EXCEEDED]", entities.Customer.fields.terms_days]
        distinguishing_aspect: "The terms_days <= 30 rule is conditional on the paca_special_agreement flag: terms_days 31 without the flag is rejected ERR_TERMS_EXCEEDED (422); the identical payload with paca_special_agreement == true succeeds."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /market/customers", payload: { name: "Buyer Slow", credit_limit_cents: 500000, terms_days: 31 }, as: MarketAdmin, captures: { err: "$.data.error_id" } }
            - { call: "POST /market/customers", payload: { name: "Buyer Agreed", credit_limit_cents: 500000, terms_days: 31, paca_special_agreement: true }, as: MarketAdmin, captures: { terms: "$.data.terms_days", agr: "$.data.paca_special_agreement" } }
          assert:
            - "first call: error_id == ERR_TERMS_EXCEEDED, http 422"
            - "second call: HTTP 201 with terms_days == 31 and paca_special_agreement == true"

      - name: lot_price_outside_daily_band_returns_price_out_of_range
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_PRICE_OUT_OF_RANGE]", entities.PurchaseLot.fields.shipper_unit_price]
        distinguishing_aspect: "The DailyPrice band is inclusive: shipper_unit_price 12.00 with band [8.00, 12.00] is accepted; 12.01 (one cent of a dollar above the high) and 7.99 (below the low) are rejected ERR_PRICE_OUT_OF_RANGE (422)."
        test_recipe:
          setup: ["Clock 2026-05-01T08:00:00Z; commodity + shipper; DailyPrice 2026-05-01 low 8.00 high 12.00"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: MarketAdmin }
            - { call: "POST /market/commodities", payload: { code: "TOM", name: "Tomato", ethylene_class: "PRODUCER", temp_min_f: 45, temp_max_f: 55, max_violation_minutes: 60 }, as: MarketAdmin, captures: { com: "$.data.id" } }
            - { call: "POST /market/shippers", payload: { name: "Shipper One", paca_license: "PACA-001" }, as: MarketAdmin, captures: { sh: "$.data.id" } }
            - { call: "POST /market/daily-prices", payload: { commodity_id: "${com}", market_date: "2026-05-01", low_price: 8.00, high_price: 12.00 }, as: MarketAdmin }
          trigger:
            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com}", market_date: "2026-05-01", quantity_units: 10, shipper_unit_price: 12.00, declared_grade: "US1" }, as: Receiver, captures: { lot_ok: "$.data.id" } }
            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com}", market_date: "2026-05-01", quantity_units: 10, shipper_unit_price: 12.01, declared_grade: "US1" }, as: Receiver, captures: { err_hi: "$.data.error_id" } }
            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com}", market_date: "2026-05-01", quantity_units: 10, shipper_unit_price: 7.99, declared_grade: "US1" }, as: Receiver, captures: { err_lo: "$.data.error_id" } }
          assert:
            - "price 12.00 (== high_price) -> HTTP 201, lot created (inclusive bound)"
            - "price 12.01 -> error_id == ERR_PRICE_OUT_OF_RANGE (422)"
            - "price 7.99 -> error_id == ERR_PRICE_OUT_OF_RANGE (422)"

      - name: lot_create_without_daily_price_returns_price_not_posted
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_PRICE_NOT_POSTED]", entities.DailyPrice.fields.market_date]
        distinguishing_aspect: "Lot creation requires a DailyPrice keyed on (commodity_id, market_date): a price posted for 2026-05-01 does not satisfy a lot with market_date 2026-05-02 on the same commodity -> ERR_PRICE_NOT_POSTED (422)."
        test_recipe:
          setup: ["Clock 2026-05-01T08:00:00Z; commodity + shipper; DailyPrice exists only for 2026-05-01"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: MarketAdmin }
            - { call: "POST /market/commodities", payload: { code: "TOM", name: "Tomato", ethylene_class: "PRODUCER", temp_min_f: 45, temp_max_f: 55, max_violation_minutes: 60 }, as: MarketAdmin, captures: { com: "$.data.id" } }
            - { call: "POST /market/shippers", payload: { name: "Shipper One", paca_license: "PACA-001" }, as: MarketAdmin, captures: { sh: "$.data.id" } }
            - { call: "POST /market/daily-prices", payload: { commodity_id: "${com}", market_date: "2026-05-01", low_price: 8.00, high_price: 12.00 }, as: MarketAdmin }
          trigger:
            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com}", market_date: "2026-05-02", quantity_units: 10, shipper_unit_price: 10.00, declared_grade: "US1" }, as: Receiver, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_PRICE_NOT_POSTED (422)"
            - "the 2026-05-01 price row does not cover market_date 2026-05-02 — the key is (commodity_id, market_date)"

      - name: order_line_above_available_returns_insufficient_quantity
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_INSUFFICIENT_QUANTITY]", entities.PurchaseLot.fields.available_units]
        distinguishing_aspect: "Order creation enforces line.quantity <= lot.available_units per line: a line for 101 units against a 100-unit ACCEPTED lot (nothing reserved or sold) is rejected ERR_INSUFFICIENT_QUANTITY (422) at create time, before any reservation exists."
        test_recipe:
          setup: ["Clock 2026-05-01T08:00:00Z; lot 100 units ACCEPTED (available_units == 100); customer ACTIVE with ample credit"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: MarketAdmin }
            - { call: "POST /market/commodities", payload: { code: "TOM", name: "Tomato", ethylene_class: "PRODUCER", temp_min_f: 45, temp_max_f: 55, max_violation_minutes: 60 }, as: MarketAdmin, captures: { com: "$.data.id" } }
            - { call: "POST /market/shippers", payload: { name: "Shipper One", paca_license: "PACA-001" }, as: MarketAdmin, captures: { sh: "$.data.id" } }
            - { call: "POST /market/daily-prices", payload: { commodity_id: "${com}", market_date: "2026-05-01", low_price: 8.00, high_price: 12.00 }, as: MarketAdmin }
            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com}", market_date: "2026-05-01", quantity_units: 100, shipper_unit_price: 10.00, declared_grade: "US1" }, as: Receiver, captures: { lot: "$.data.id" } }
            - { call: "POST /market/purchase-lots/${lot}/receive", payload: {}, as: Receiver }
            - { call: "POST /market/inspections", payload: { purchase_lot_id: "${lot}", inspected_grade: "US1", defect_pct: 0, result: "PASS" }, as: USDAInspector, captures: { insp: "$.data.id" } }
            - { call: "POST /market/inspections/${insp}/certify", payload: {}, as: USDAInspector }
            - { call: "POST /market/customers", payload: { name: "Buyer A", credit_limit_cents: 1000000 }, as: MarketAdmin, captures: { cust: "$.data.id" } }
          trigger:
            - { call: "POST /market/sales-orders", payload: { customer_id: "${cust}", delivery_date: "2026-05-02", window_start: "08:00", window_end: "10:00", lines: [ { lot_id: "${lot}", quantity: 101, unit_price: 10.00 } ] }, as: SalesDesk, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INSUFFICIENT_QUANTITY (422)"
            - "lot.available_units remains 100 (no reservation written by the rejected create)"

      - name: order_create_after_cutoff_returns_cutoff_passed
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_CUTOFF_PASSED]", entities.SalesOrder.fields.delivery_date]
        distinguishing_aspect: "The rejection side of the cut-off rule (§1.8 pinned only the 14:00:00 acceptance): at clock 2026-05-01T14:00:01Z a next-day (2026-05-02) order is rejected ERR_CUTOFF_PASSED, and a same-day (2026-05-01) order is rejected at any clock time because delivery_date <= clock date."
        test_recipe:
          setup: ["Clock 2026-05-01T14:00:01Z (one second past the cut-off); lot ACCEPTED; customer ACTIVE with ample credit"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: MarketAdmin }
            - { call: "POST /market/commodities", payload: { code: "TOM", name: "Tomato", ethylene_class: "PRODUCER", temp_min_f: 45, temp_max_f: 55, max_violation_minutes: 60 }, as: MarketAdmin, captures: { com: "$.data.id" } }
            - { call: "POST /market/shippers", payload: { name: "Shipper One", paca_license: "PACA-001" }, as: MarketAdmin, captures: { sh: "$.data.id" } }
            - { call: "POST /market/daily-prices", payload: { commodity_id: "${com}", market_date: "2026-05-01", low_price: 8.00, high_price: 12.00 }, as: MarketAdmin }
            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com}", market_date: "2026-05-01", quantity_units: 100, shipper_unit_price: 10.00, declared_grade: "US1" }, as: Receiver, captures: { lot: "$.data.id" } }
            - { call: "POST /market/purchase-lots/${lot}/receive", payload: {}, as: Receiver }
            - { call: "POST /market/inspections", payload: { purchase_lot_id: "${lot}", inspected_grade: "US1", defect_pct: 0, result: "PASS" }, as: USDAInspector, captures: { insp: "$.data.id" } }
            - { call: "POST /market/inspections/${insp}/certify", payload: {}, as: USDAInspector }
            - { call: "POST /market/customers", payload: { name: "Buyer A", credit_limit_cents: 1000000 }, as: MarketAdmin, captures: { cust: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T14:00:01Z" }, as: MarketAdmin }
          trigger:
            - { call: "POST /market/sales-orders", payload: { customer_id: "${cust}", delivery_date: "2026-05-02", window_start: "08:00", window_end: "10:00", lines: [ { lot_id: "${lot}", quantity: 1, unit_price: 10.00 } ] }, as: SalesDesk, captures: { err_next: "$.data.error_id" } }
            - { call: "POST /market/sales-orders", payload: { customer_id: "${cust}", delivery_date: "2026-05-01", window_start: "08:00", window_end: "10:00", lines: [ { lot_id: "${lot}", quantity: 1, unit_price: 10.00 } ] }, as: SalesDesk, captures: { err_same: "$.data.error_id" } }
          assert:
            - "next-day order at 14:00:01 -> error_id == ERR_CUTOFF_PASSED (422)"
            - "same-day order -> error_id == ERR_CUTOFF_PASSED (422) (delivery_date <= clock date)"

      - name: shape_error_beats_not_found_on_order_create
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=4]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Priority pair shape (3) vs existence (4) — a different pair from §1.8's state-vs-fiscal and safety-vs-temporal: an order payload missing the required `lines` field AND carrying a nonexistent customer_id must return ERR_VALIDATION (422), because request-shape validation runs before FK resolution."
        test_recipe:
          setup: ["empty database (no customer with the referenced id)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /market/sales-orders", payload: { customer_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", delivery_date: "2026-05-02", window_start: "08:00", window_end: "10:00" }, as: SalesDesk, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_VALIDATION (422), not ERR_NOT_FOUND (404)"
            - "both failures hold simultaneously; priority 3 (shape) beats priority 4 (existence)"

  - section: endpoints
    instances:
