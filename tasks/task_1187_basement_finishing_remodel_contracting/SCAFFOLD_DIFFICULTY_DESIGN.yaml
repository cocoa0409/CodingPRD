            - { call: "GET /api/projects/${proj_id}", payload: {}, as: Contractor, as_user_id: "${ctr_id}", captures: { st_end: $.data.status, sc_end: $.data.strike_count } }
          assert:
            - "after 2 violations: strike_count == 2, status == IN_PROGRESS, both logs strike_applied == false"
            - "3rd violation: strike_applied == true"
            - "final: strike_count == 3 and status == SUSPENDED (boundary is >= 3, not > 3)"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: design_submit_blocked_until_moisture_accepted
        grounds:
          - state_machines.DesignPackage.DRAFT_to_SUBMITTED
          - validations[priority=10]
          - entities.Project.fields.status
        distinguishing_aspect: |
          Entity pair DesignPackage -> MoistureAssessment: a DRAFT package cannot
          transition to SUBMITTED while the project has no ACCEPTED assessment
          (ERR_MOISTURE_NOT_CLEARED), and the identical call succeeds once an
          assessment is ACCEPTED. Sibling exercises a different entity pair.
        test_recipe:
          setup:
            - "Project ASSESSMENT whose only assessment was REJECTED; a DRAFT design package exists (creation allowed in ASSESSMENT)"
          setup_api_calls:
            - { call: "POST /api/contractors", payload: { name: "GC Thirteen", license_no: "LIC-13" }, as: PlatformAdmin, captures: { ctr_id: $.data.id } }
            - { call: "POST /api/homeowners", payload: { name: "H O", email: "ho@x.com", phone: "15" }, as: Contractor, as_user_id: "${ctr_id}", captures: { ho_id: $.data.id } }
            - { call: "POST /api/projects", payload: { homeowner_id: "${ho_id}", address: "15 O St", basement_sqft: 900, base_contract_cents: 4500000 }, as: Contractor, as_user_id: "${ctr_id}", captures: { proj_id: $.data.id } }
            - { call: "POST /api/projects/${proj_id}/moisture-assessments", payload: { slab_moisture_lbs: 6.5, interior_rh_pct: 75, efflorescence_observed: true, grading_deficit: false, egress_windows_existing: 0, ceiling_height_in: 86 }, as: Contractor, as_user_id: "${ctr_id}", captures: { ma_id: $.data.id } }
            - { call: "POST /api/moisture-assessments/${ma_id}/submit", payload: {}, as: Contractor, as_user_id: "${ctr_id}" }
            - { call: "POST /api/projects/${proj_id}/design-packages", payload: { layout_notes: "suite", mechanical_relocations: [] }, as: Contractor, as_user_id: "${ctr_id}", captures: { dp_id: $.data.id } }
          trigger:
            - { call: "POST /api/design-packages/${dp_id}/submit", payload: {}, as: Contractor, as_user_id: "${ctr_id}", captures: { err1: $.data.error_id } }
            - { call: "POST /api/moisture-assessments/${ma_id}/reopen", payload: { remediation_notes: "fixed grading", slab_moisture_lbs: 1.8, interior_rh_pct: 50, efflorescence_observed: false, grading_deficit: false }, as: Contractor, as_user_id: "${ctr_id}" }
            - { call: "POST /api/moisture-assessments/${ma_id}/submit", payload: {}, as: Contractor, as_user_id: "${ctr_id}" }
            - { call: "POST /api/design-packages/${dp_id}/submit", payload: {}, as: Contractor, as_user_id: "${ctr_id}", captures: { st2: $.data.status } }
          assert:
            - "first submit rejected with ERR_MOISTURE_NOT_CLEARED while no ACCEPTED assessment exists"
            - "after remediation cycle ACCEPTED: same submit call returns status == SUBMITTED"
            - "DesignPackage.${dp_id}.revision_number == 1 (failed submit did not consume a revision)"

      - name: rough_in_trade_completion_blocked_until_inspection_passed
        grounds:
          - state_machines.WorkPhase.IN_PROGRESS_to_COMPLETED
          - validations[priority=23]
          - entities.WorkPhase.fields.requires_rough_in
        distinguishing_aspect: |
          Entity pair WorkPhase -> Inspection: an IN_PROGRESS ELECTRICAL phase
          cannot complete until a ROUGH_IN inspection on that phase is PASSED —
          a FAILED one does not satisfy the gate; the sibling pair is
          DesignPackage -> MoistureAssessment.
        test_recipe:
          setup:
            - "Project IN_PROGRESS; ELECTRICAL phase IN_PROGRESS; first ROUGH_IN inspection FAILED; second ROUGH_IN REQUESTED"
          setup_api_calls:
            - { call: "POST /api/contractors", payload: { name: "GC Fourteen", license_no: "LIC-14" }, as: PlatformAdmin, captures: { ctr_id: $.data.id } }
            - { call: "POST /api/homeowners", payload: { name: "H P", email: "hp@x.com", phone: "16" }, as: Contractor, as_user_id: "${ctr_id}", captures: { ho_id: $.data.id } }
            - { call: "POST /api/subcontractors", payload: { name: "Wire Co", trade: "ELECTRICAL" }, as: PlatformAdmin, captures: { sub_id: $.data.id } }
            - { call: "POST /api/projects", payload: { homeowner_id: "${ho_id}", address: "16 P St", basement_sqft: 900, base_contract_cents: 5200000 }, as: Contractor, as_user_id: "${ctr_id}", captures: { proj_id: $.data.id } }
            - { call: "POST /api/projects/${proj_id}/moisture-assessments", payload: { slab_moisture_lbs: 2.0, interior_rh_pct: 50, efflorescence_observed: false, grading_deficit: false, egress_windows_existing: 1, ceiling_height_in: 86 }, as: Contractor, as_user_id: "${ctr_id}", captures: { ma_id: $.data.id } }
            - { call: "POST /api/moisture-assessments/${ma_id}/submit", payload: {}, as: Contractor, as_user_id: "${ctr_id}" }
            - { call: "POST /api/projects/${proj_id}/design-packages", payload: { layout_notes: "media room", mechanical_relocations: [] }, as: Contractor, as_user_id: "${ctr_id}", captures: { dp_id: $.data.id } }
            - { call: "POST /api/design-packages/${dp_id}/submit", payload: {}, as: Contractor, as_user_id: "${ctr_id}" }
            - { call: "POST /api/design-packages/${dp_id}/approve", payload: {}, as: Homeowner, as_user_id: "${ho_id}" }
            - { call: "POST /api/projects/${proj_id}/permits", payload: { bedroom_count: 0, windows: [], ceiling_height_in: 86, finished_area_sqft: 900, low_area_sqft: 100, prohibited_area_sqft: 0 }, as: Contractor, as_user_id: "${ctr_id}", captures: { pm_id: $.data.id } }
            - { call: "POST /api/permits/${pm_id}/submit", payload: {}, as: Contractor, as_user_id: "${ctr_id}" }
            - { call: "POST /api/permits/${pm_id}/record-decision", payload: { outcome: "ISSUED" }, as: Inspector }
            - { call: "POST /api/projects/${proj_id}/work-phases", payload: { trade: "ELECTRICAL", zone: "MEDIA", start_date: "2026-06-01", end_date: "2026-06-10", crew_count: 2, subcontractor_id: "${sub_id}" }, as: Contractor, as_user_id: "${ctr_id}", captures: { wp_id: $.data.id, wp_rough: $.data.requires_rough_in } }
            - { call: "POST /api/work-phases/${wp_id}/start", payload: {}, as: Subcontractor, as_user_id: "${sub_id}" }
            - { call: "POST /api/projects/${proj_id}/inspections", payload: { type: "ROUGH_IN", work_phase_id: "${wp_id}" }, as: Contractor, as_user_id: "${ctr_id}", captures: { insp1: $.data.id } }
            - { call: "POST /api/inspections/${insp1}/record-result", payload: { outcome: "FAILED", notes: "panel clearance" }, as: Inspector }
            - { call: "POST /api/projects/${proj_id}/inspections", payload: { type: "ROUGH_IN", work_phase_id: "${wp_id}" }, as: Contractor, as_user_id: "${ctr_id}", captures: { insp2: $.data.id } }
          trigger:
            - { call: "POST /api/work-phases/${wp_id}/complete", payload: {}, as: Subcontractor, as_user_id: "${sub_id}", captures: { err1: $.data.error_id } }
            - { call: "POST /api/inspections/${insp2}/record-result", payload: { outcome: "PASSED" }, as: Inspector }
            - { call: "POST /api/work-phases/${wp_id}/complete", payload: {}, as: Subcontractor, as_user_id: "${sub_id}", captures: { wp_status: $.data.status } }
          assert:
            - "WorkPhase.${wp_id}.requires_rough_in == true (derived from ELECTRICAL trade)"
            - "complete with only a FAILED rough-in returns ERR_ROUGH_IN_REQUIRED"
            - "after second inspection PASSED: complete succeeds, status == COMPLETED"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: zone_overlap_half_open_and_drywall_buffer
        grounds:
          - calculations.zone_schedule_overlap
          - validations[priority=17]
          - entities.WorkPhase.fields.zone
        distinguishing_aspect: |
          Interval semantics (adjacency + mandatory buffer) on the zone resource:
          half-open intervals allow touching endpoints, but a DRYWALL phase in the
          same zone forces the next phase to start >= end_date + 2 days, so a
          start exactly at end_date (legal for other trades) is rejected after
          drywall. Sibling uses aggregate-capacity semantics on a different
          resource.
        test_recipe:
          setup:
            - "Project SCHEDULING with an existing DRYWALL phase in zone REC_ROOM occupying [2026-06-01, 2026-06-10)"
          setup_api_calls:
            - { call: "POST /api/contractors", payload: { name: "GC Fifteen", license_no: "LIC-15" }, as: PlatformAdmin, captures: { ctr_id: $.data.id } }
            - { call: "POST /api/homeowners", payload: { name: "H Q", email: "hq@x.com", phone: "17" }, as: Contractor, as_user_id: "${ctr_id}", captures: { ho_id: $.data.id } }
            - { call: "POST /api/subcontractors", payload: { name: "Dust Co", trade: "DRYWALL" }, as: PlatformAdmin, captures: { sub1: $.data.id } }
            - { call: "POST /api/subcontractors", payload: { name: "Brush Co", trade: "PAINT" }, as: PlatformAdmin, captures: { sub2: $.data.id } }
            - { call: "POST /api/projects", payload: { homeowner_id: "${ho_id}", address: "17 Q St", basement_sqft: 1000, base_contract_cents: 6000000 }, as: Contractor, as_user_id: "${ctr_id}", captures: { proj_id: $.data.id } }
            - { call: "POST /api/projects/${proj_id}/moisture-assessments", payload: { slab_moisture_lbs: 2.0, interior_rh_pct: 50, efflorescence_observed: false, grading_deficit: false, egress_windows_existing: 1, ceiling_height_in: 86 }, as: Contractor, as_user_id: "${ctr_id}", captures: { ma_id: $.data.id } }
            - { call: "POST /api/moisture-assessments/${ma_id}/submit", payload: {}, as: Contractor, as_user_id: "${ctr_id}" }
            - { call: "POST /api/projects/${proj_id}/design-packages", payload: { layout_notes: "rec room", mechanical_relocations: [] }, as: Contractor, as_user_id: "${ctr_id}", captures: { dp_id: $.data.id } }
            - { call: "POST /api/design-packages/${dp_id}/submit", payload: {}, as: Contractor, as_user_id: "${ctr_id}" }
            - { call: "POST /api/design-packages/${dp_id}/approve", payload: {}, as: Homeowner, as_user_id: "${ho_id}" }
            - { call: "POST /api/projects/${proj_id}/permits", payload: { bedroom_count: 0, windows: [], ceiling_height_in: 86, finished_area_sqft: 1000, low_area_sqft: 100, prohibited_area_sqft: 0 }, as: Contractor, as_user_id: "${ctr_id}", captures: { pm_id: $.data.id } }
            - { call: "POST /api/permits/${pm_id}/submit", payload: {}, as: Contractor, as_user_id: "${ctr_id}" }
            - { call: "POST /api/permits/${pm_id}/record-decision", payload: { outcome: "ISSUED" }, as: Inspector }
            - { call: "POST /api/projects/${proj_id}/work-phases", payload: { trade: "DRYWALL", zone: "REC_ROOM", start_date: "2026-06-01", end_date: "2026-06-10", crew_count: 2, subcontractor_id: "${sub1}" }, as: Contractor, as_user_id: "${ctr_id}", captures: { wp1: $.data.id } }
          trigger:
            - { call: "POST /api/projects/${proj_id}/work-phases", payload: { trade: "PAINT", zone: "REC_ROOM", start_date: "2026-06-10", end_date: "2026-06-15", crew_count: 1, subcontractor_id: "${sub2}" }, as: Contractor, as_user_id: "${ctr_id}", captures: { err: $.data.error_id } }
            - { call: "POST /api/projects/${proj_id}/work-phases", payload: { trade: "PAINT", zone: "REC_ROOM", start_date: "2026-06-12", end_date: "2026-06-18", crew_count: 1, subcontractor_id: "${sub2}" }, as: Contractor, as_user_id: "${ctr_id}", captures: { wp2: $.data.id, wp2_status: $.data.status } }
          assert:
            - "start at 2026-06-10 (touching endpoint, legal under half-open overlap) rejected with ERR_ZONE_SCHEDULE_OVERLAP because DRYWALL buffer demands >= 2026-06-12"
            - "start at 2026-06-12 accepted: WorkPhase created with status READY"
            - "total phases in zone REC_ROOM == 2 after the calls"

      - name: daily_crew_capacity_aggregate
        grounds:
          - calculations.daily_crew_capacity
          - validations[priority=18]
          - entities.WorkPhase.fields.crew_count
        distinguishing_aspect: |
          Interval semantics (aggregate capacity over calendar dates) on the
          occupied-home-day resource: crews of 2 + 2 sum exactly to the inclusive
          cap 4 and are accepted, while any 1-crew overlap pushing a covered date
          to 5 is rejected — regardless of zones being disjoint. Sibling uses
          adjacency/buffer semantics on the zone resource.
        test_recipe:
          setup:
            - "Project SCHEDULING with phases A (crew 2, Z1, [06-01,06-10)) and B (crew 2, Z2, [06-05,06-12)) already created — daily sum 4 on [06-05,06-10)"
