            - "CapitalProject.${proj_id}.rate_impact_pct is still 7.18 — a fully repaid standard SRF loan does not move the ladder"
            - "The second 400,000,000 award returns HTTP 422 with error_id ERR_AWARD_EXCEEDS_PROJECT_COST because 400,000,000 + 400,000,000 exceeds the 680,000,000 capital cost"
            - "FundingApplication.${app2_id}.status is still SUBMITTED and CapitalProject.${proj_id}.funding_awarded_cents is still 400000000"
            - "The repeat award on the AWARDED application returns HTTP 422 with error_id ERR_APPLICATION_STATE_INVALID"
            - "The final BIDDING attempt returns HTTP 200 with construction_status BIDDING — the funding gate lifted once an award existed and no concentrate permit is required for GAC"

