            - { call: "POST /air-freight/screening-records/${srr1}/resolve", payload: { outcome: "REJECTED", rejection_reason: "alarm" }, as: ComplianceOfficer, as_user_id: "comp-1" }
            - { call: "POST /air-freight/house-waybills", payload: { shipper_id: "${sh1}", hwb_number: "HWB-R2", origin_code: "SFO", destination_code: "NRT", pieces: 1, gross_weight_kg: 10.0, declared_volume_m3: 0.05, dg_flag: false }, as: ForwarderOps, captures: { r2: "$.data.id" } }
            - { call: "POST /air-freight/house-waybills/${r2}/submit", as: ForwarderOps, as_user_id: "ops-1" }
            - { call: "GET /air-freight/house-waybills/${r2}/screening-records", as: ForwarderOps, captures: { srr2: "$.data[0].id" } }
            - { call: "POST /air-freight/screening-records/${srr2}/resolve", payload: { outcome: "REJECTED", rejection_reason: "alarm" }, as: ComplianceOfficer, as_user_id: "comp-1" }
            - { call: "POST /air-freight/house-waybills", payload: { shipper_id: "${sh1}", hwb_number: "HWB-R3", origin_code: "SFO", destination_code: "NRT", pieces: 1, gross_weight_kg: 10.0, declared_volume_m3: 0.05, dg_flag: false }, as: ForwarderOps, captures: { r3: "$.data.id" } }
            - { call: "POST /air-freight/house-waybills/${r3}/submit", as: ForwarderOps, as_user_id: "ops-1" }
            - { call: "GET /air-freight/house-waybills/${r3}/screening-records", as: ForwarderOps, captures: { srr3: "$.data[0].id" } }
            - { call: "POST /air-freight/screening-records/${srr3}/resolve", payload: { outcome: "REJECTED", rejection_reason: "alarm" }, as: ComplianceOfficer, as_user_id: "comp-1" }
            - { call: "POST /air-freight/flight-bookings", payload: { airline_code: "UA", flight_number: "UA859", origin_code: "SFO", destination_code: "NRT", scheduled_departure_utc: "2026-08-10T10:00:00Z", cutoff_utc: "2026-08-09T10:00:00Z", booked_weight_kg: 50.0, booked_volume_m3: 50.0 }, as: CapacityPlanner, captures: { bk1: "$.data.id" } }
            - { call: "POST /air-freight/master-waybills", payload: { booking_id: "${bk1}", mawb_number: "180-55555555" }, as: CapacityPlanner, captures: { mb1: "$.data.id" } }
            - { call: "POST /air-freight/master-waybills/${mb1}/open", as: CapacityPlanner }
            - { call: "GET /air-freight/master-waybills/${mb1}", as: ForwarderOps, captures: { mv1: "$.data.version" } }
