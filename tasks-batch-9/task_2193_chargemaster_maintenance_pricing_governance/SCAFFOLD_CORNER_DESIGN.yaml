          setup:
            - "Clock 2026-09-01T00:00:00Z; facility CCN-0001."
            - "Revenue code 0300 (allowed_code_types [CPT], requires_hcpcs false) and 0250 (allowed_code_types [HCPCS], requires_hcpcs true)."
            - "Department CC-100 (mgr_cath) with allowed_revenue_code_values ['0300']; department CC-200 (mgr_supply) with the field omitted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /chargemaster/facilities"
              payload: { name: "Mercy General", cms_certification_number: "CCN-0001", rounding_mode: "NEAREST_CENT" }
              as: SystemAdmin
              captures: { fac: $.data.id }
            - call: "POST /chargemaster/revenue-codes"
              payload: { code: "0300", description: "Laboratory", requires_hcpcs: false, allowed_code_types: ["CPT"], pricing_class: "PROCEDURE" }
