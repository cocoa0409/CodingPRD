      - 'hop B: the released capacity is what lets PartOrder.${o5}.status reach CONFIRMED, and Store.${s_sat}.committed_units_today becomes 4'
      - 'hop C: PartOrder.${o5}.service_route_id == ServiceRoute.${r1}.id and PartOrder.${o4}.service_route_id is null'
      - 'hop D: RouteStop.${st2}.stop_sequence == 2'
      - 'hop D: RouteStop.${st2}.projected_arrival_at == "2026-09-02T13:20:00Z"'
      - 'hop D: RouteStop.${st2}.projected_departure_at == "2026-09-02T13:25:00Z" and RouteStop.${st2}.lateness_minutes == 0'
      - 'hop D: RouteStop.${st2}.status == "SEQUENCED" — the re-projection came from hop C, not from the original void'
      - rejecting RouteStop.${st2} afterwards succeeds with status REJECTED, proving the chain left it in a genuinely rejectable SEQUENCED state rather than a draft PLANNED state
