            - "SalesRepresentative.${rep1}.compliance_strike_count == 1 and status != SUSPENDED (1 < COMPLIANCE_STRIKE_SUSPEND_THRESHOLD 2)"
            - "trigger 4 returns 422 with error_id ERR_PRESENTATION_NOT_CLEARED"
