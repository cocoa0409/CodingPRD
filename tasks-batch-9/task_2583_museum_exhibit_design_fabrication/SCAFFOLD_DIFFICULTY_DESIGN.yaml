            - "${posture2} == FROZEN_CONSERVATION, ${cvc2} == 1 and ${cbc2} == 1 - the identical VETO payload from a Conservator has a strictly larger side-effect set"

      - name: project_phase_reverts_out_of_fabrication_and_then_re_advances
        grounds:
          - state_machines.ExhibitProject.FABRICATION_to_DESIGN_DEV
          - state_machines.ExhibitProject.DESIGN_DEV_to_FABRICATION
          - state_machines.DesignPackage.APPROVED_to_SUPERSEDED
          - state_machines.InstallWindow.REQUESTED_to_DENIED
          - entities.DesignPackage.fields.superseded_by_package_id
        distinguishing_aspect: |
          The phase machine is not a pipeline. A design change issued during
          FABRICATION supersedes the approved DESIGN_DEV package, and when the
          replacement comes back REVISION_REQUESTED the project walks BACKWARDS
          to DESIGN_DEV, denying every REQUESTED install window on the way. The
          project must then be able to walk forward over the same edge again
          once the replacement is approved. Implementations that model phase as
          a monotonically increasing index either reject the revert outright or
          refuse the second DESIGN_DEV -> FABRICATION advance as a repeat, and
          implementations that treat DENIED as recoverable wrongly resurrect
          the install window on the re-advance.
