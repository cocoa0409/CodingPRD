      - name: a_courier_cannot_act_on_another_couriers_assignment_or_read_its_delivery
        claim_type: peer_roles
        grounds:
          - errors[ERR_COURIER_SCOPE_VIOLATION]
          - errors[ERR_HIPAA_SCOPE_VIOLATION]
          - endpoints[GET /deliveries/{id}/courier-view]
        distinguishing_aspect: "Couriers are peers, and the peer boundary is enforced with two different ids: touching another courier's assignment or profile is ERR_COURIER_SCOPE_VIOLATION, while reading the PHI projection of a delivery you hold no assignment on is ERR_HIPAA_SCOPE_VIOLATION — the disclosure log therefore never records a courier who was not on the job."
        test_recipe:
          setup:
            - "Base fixture with one QUEUED delivery offered to Ray at 13:45Z."
            - "Tova is a second AVAILABLE courier with no assignment on that delivery."
