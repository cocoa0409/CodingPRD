            - "GET /resorts/${rl4_id}/capacity?service_date=2026-09-04 -> room_units_reserved == 4"

  - section: consistency_model
    instances:

      - name: immediate_visibility_of_cancel_refund_and_cabana_release
        claim_type: immediate
        grounds: ["endpoints.POST /resorts/{resort_id}/activity-bookings/{activity_booking_id}/cancel", "state_machines.ActivityBooking.transitions.CONFIRMED_to_CANCELLED"]
        distinguishing_aspect: "The cancel response carries the settled refund and the released cabana status in the same request, with no read-back delay."
        test_recipe:
          setup: ["One Resort with a CONFIRMED group holding a confirmed activity booking"]
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "Mason", park_capacity_occupancy_units: 20, day_pass_cap_units: 10, arcade_credit_rate_cents_per_unit: 250 }
              as: platform_ops
              captures: { rm1_id: "$.data.id" }
            - call: "POST /resorts/${rm1_id}/activities"
              payload: { name: "Craft Hour", tier_code: "STANDARD", base_price_cents: 3900, capacity_units: 20 }
              as: platform_ops
              captures: { sessm1_id: "$.data.id" }
            - call: "POST /resorts/${rm1_id}/group-bookings"
              payload: { group_kind: "BIRTHDAY", service_date: "2026-09-28", member_count: 2, deposit_paid_cents: 1000 }
              as: Group
              as_user_id: "gb-placeholder"
              captures: { gbm1_id: "$.data.id" }
            - call: "POST /resorts/${rm1_id}/group-bookings/${gbm1_id}/confirm"
              payload: {}
              as: Group
              as_user_id: "${gbm1_id}"
            - call: "POST /resorts/${rm1_id}/activity-bookings"
              payload: { activity_session_id: "${sessm1_id}", group_booking_id: "${gbm1_id}", attendees: 2, reservation_id: null }
              as: Group
              as_user_id: "${gbm1_id}"
              captures: { abm1_id: "$.data.id" }
            - call: "POST /resorts/${rm1_id}/activity-bookings/${abm1_id}/confirm"
              payload: {}
              as: Group
              as_user_id: "${gbm1_id}"
          trigger:
            - call: "POST /resorts/${rm1_id}/activity-bookings/${abm1_id}/cancel"
              payload: {}
              as: Group
              as_user_id: "${gbm1_id}"
              captures: { abm1_refund: "$.data.activity_rate_refund_cents" }
          assert:
            - "ActivityBooking.${abm1_id}.activity_booking_status == CANCELLED"
            - "${abm1_refund} == 2925"
