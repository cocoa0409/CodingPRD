      - name: calc_launch_readiness_denominator_covers_only_readiness_types
        claim_type: denominator_scope
        grounds:
          - calculations.launch_readiness_pct.READINESS_WEIGHTS
          - endpoints[GET /innovation-projects/{id}/launch-readiness]
        distinguishing_aspect: |
          The denominator is the intersection of the weight table with the gate-3 checklist, not
          the whole checklist and not the whole table: a gate requiring two readiness types plus a
          non-readiness type divides by 0.55 and reads 63.64, while a gate requiring no readiness
          type at all divides by zero and is pinned to 0.00 instead of erroring.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-03T00:00:00Z."
            - "A SNACK gate 3 requiring MANUFACTURING_READINESS, SALES_SELL_IN_PLAN and SHELF_LIFE_REPORT."
            - "A BEVERAGE gate 3 requiring only SHELF_LIFE_REPORT."
            - "One SNACK project with the three SNACK checklist items created by hand, and one BEVERAGE project with its single item."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /stage-gates"
              payload: { gate_number: 3, category: "SNACK", stage_from: "PILOT_QUALIFIED", stage_to: "LAUNCH_READY", required_deliverable_types: ["MANUFACTURING_READINESS", "SALES_SELL_IN_PLAN", "SHELF_LIFE_REPORT"], quorum_size: 1, veto_functions: [], npv_hurdle_usd: 0.00, payback_months_max: 24, gross_margin_floor_pct: 0.00, readiness_floor_index: 0.00 }
              as: PortfolioAdmin
              captures: { dn_gs_id: $.data.id }
            - call: "POST /stage-gates"
              payload: { gate_number: 3, category: "BEVERAGE", stage_from: "PILOT_QUALIFIED", stage_to: "LAUNCH_READY", required_deliverable_types: ["SHELF_LIFE_REPORT"], quorum_size: 1, veto_functions: [], npv_hurdle_usd: 0.00, payback_months_max: 24, gross_margin_floor_pct: 0.00, readiness_floor_index: 0.00 }
              as: PortfolioAdmin
              captures: { dn_gb_id: $.data.id }
            - call: "POST /innovation-projects"
              payload: { name: "Toffee Crunch Bites", brand: "GrainWell", category: "SNACK", project_type: "LINE_EXTENSION", strategic_fit_score: 8, consumer_need_score: 7, target_gross_margin_pct: 36, category_attractiveness_score: 7, development_budget_cap_usd: 500000.00 }
              as: InnovationLead
              as_user_id: "lead-dn"
              captures: { dn_ps_id: $.data.id }
            - call: "POST /innovation-projects"
              payload: { name: "Yuzu Sparkling Water", brand: "GrainWell", category: "BEVERAGE", project_type: "LINE_EXTENSION", strategic_fit_score: 8, consumer_need_score: 7, target_gross_margin_pct: 36, category_attractiveness_score: 7, development_budget_cap_usd: 500000.00 }
              as: InnovationLead
              as_user_id: "lead-dn"
              captures: { dn_pb_id: $.data.id }
            - call: "POST /innovation-projects/${dn_ps_id}/deliverables"
              payload: { gate_id: "${dn_gs_id}", deliverable_type: "MANUFACTURING_READINESS", owner_function: "OPERATIONS" }
              as: GateChair
              captures: { dn_mfg_id: $.data.id }
            - call: "POST /innovation-projects/${dn_ps_id}/deliverables"
              payload: { gate_id: "${dn_gs_id}", deliverable_type: "SALES_SELL_IN_PLAN", owner_function: "SALES" }
              as: GateChair
              captures: { dn_sales_id: $.data.id }
            - call: "POST /innovation-projects/${dn_ps_id}/deliverables"
              payload: { gate_id: "${dn_gs_id}", deliverable_type: "SHELF_LIFE_REPORT", owner_function: "QUALITY" }
              as: GateChair
              captures: { dn_shelf_id: $.data.id }
            - call: "POST /innovation-projects/${dn_pb_id}/deliverables"
              payload: { gate_id: "${dn_gb_id}", deliverable_type: "SHELF_LIFE_REPORT", owner_function: "QUALITY" }
              as: GateChair
              captures: { dn_bshelf_id: $.data.id }
            - call: "POST /deliverables/${dn_bshelf_id}/submit"
              payload: { evidence_url: "https://npd.example/dn/bev-shelf-life" }
              as: RnDLead
              as_user_id: "sub-dn"
            - call: "POST /deliverables/${dn_bshelf_id}/decide"
              payload: { decision: "APPROVE", comment: "Ambient stability confirmed." }
              as: FunctionalReviewer
              as_user_id: "rev-dn"
          trigger:
            - call: "POST /deliverables/${dn_mfg_id}/submit"
              payload: { evidence_url: "https://npd.example/dn/mfg-readiness" }
              as: InnovationLead
              as_user_id: "sub-dn"
            - call: "POST /deliverables/${dn_mfg_id}/decide"
              payload: { decision: "APPROVE", comment: "Line qualified." }
              as: FunctionalReviewer
              as_user_id: "rev-dn"
            - call: "GET /innovation-projects/${dn_ps_id}/launch-readiness"
              as: GateChair
            - call: "GET /innovation-projects/${dn_pb_id}/launch-readiness"
              as: GateChair
          assert:
            - "InnovationProject.${dn_ps_id}.launch_readiness_pct == 63.64, being 0.35 over the 0.55 denominator of MANUFACTURING_READINESS plus SALES_SELL_IN_PLAN"
            - "InnovationProject.${dn_ps_id}.launch_readiness_pct != 35.00, the value a full-table 1.00 denominator would give"
            - "InnovationProject.${dn_ps_id}.launch_readiness_pct != 33.33, the value an equal-weight three-item checklist would give"
            - "the SNACK response has blocking_deliverable_types == [SALES_SELL_IN_PLAN], excluding the still-pending SHELF_LIFE_REPORT"
            - "InnovationProject.${dn_pb_id}.launch_readiness_pct == 0.00 although its only required item ${dn_bshelf_id} is APPROVED, because the denominator is zero"
            - "the BEVERAGE response has blocking_deliverable_types == [] and returns 200 rather than failing on a zero denominator"

      - name: calc_committed_ledger_counts_only_live_commitments
        claim_type: aggregation_filter
        grounds:
          - calculations.committed_development_budget.LEDGER_BASIS
        distinguishing_aspect: |
          The ledger filters on child status rather than summing every child: a COMPLETED run and
          a FAILED study still hold their money while a CANCELLED run has released it, so the
          project reads 30000.00 out of 80000.00 of created commitments.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-03T00:00:00Z."
            - "One NONE-regime pilot line with a 240 minute buffer."
            - "One SNACK project in dev_status IDEA with a 500000.00 cap and one DRAFT formulation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /pilot-lines"
              payload: { plant_name: "Toledo", line_code: "TOL-11", changeover_buffer_minutes: 240, allergen_regime: "NONE", hourly_cost_usd: 500.00 }
              as: PortfolioAdmin
              captures: { lf_line_id: $.data.id }
            - call: "POST /innovation-projects"
              payload: { name: "Toffee Crunch Bites", brand: "GrainWell", category: "SNACK", project_type: "LINE_EXTENSION", strategic_fit_score: 8, consumer_need_score: 7, target_gross_margin_pct: 36, category_attractiveness_score: 7, development_budget_cap_usd: 500000.00 }
              as: InnovationLead
              as_user_id: "lead-lf"
              captures: { lf_p_id: $.data.id, lf_p_v1: $.data.version }
            - call: "POST /innovation-projects/${lf_p_id}/formulations"
              payload: { expected_project_version: "${lf_p_v1}", spec_summary: "Toffee inclusion at 12 percent", allergen_regime: "NONE", target_shelf_life_days: 180, unit_cost_usd: 3.2000 }
              as: RnDLead
              captures: { lf_f_id: $.data.id }
          trigger:
            - call: "POST /formulations/${lf_f_id}/pilot-runs"
              payload: { pilot_line_id: "${lf_line_id}", window_start: "2026-08-01T08:00:00Z", window_end: "2026-08-01T16:00:00Z", planned_units: 10000, committed_cost_usd: 10000.00 }
              as: RnDLead
              captures: { lf_run1_id: $.data.id }
            - call: "POST /pilot-runs/${lf_run1_id}/start"
              as: RnDLead
            - call: "POST /pilot-runs/${lf_run1_id}/complete"
              payload: { actual_units: 10000 }
              as: RnDLead
            - call: "POST /formulations/${lf_f_id}/pilot-runs"
              payload: { pilot_line_id: "${lf_line_id}", window_start: "2026-08-04T08:00:00Z", window_end: "2026-08-04T16:00:00Z", planned_units: 12000, committed_cost_usd: 50000.00 }
              as: RnDLead
              captures: { lf_run2_id: $.data.id }
            - call: "POST /pilot-runs/${lf_run2_id}/cancel"
              payload: { reason: "Co-packer pulled the slot." }
              as: RnDLead
            - call: "GET /formulations/${lf_f_id}"
              as: RnDLead
              captures: { lf_f_v: $.data.version }
            - call: "POST /formulations/${lf_f_id}/shelf-life-studies"
              payload: { expected_formulation_version: "${lf_f_v}", duration_days: 180, committed_cost_usd: 20000.00, start_at: "2026-08-05T00:00:00Z" }
              as: RnDLead
              captures: { lf_study_id: $.data.id }
            - call: "POST /shelf-life-studies/${lf_study_id}/timepoints"
              payload: { day_index: 10, quality_score: 55.00 }
              as: RnDLead
            - call: "GET /innovation-projects/${lf_p_id}"
              as: RnDLead
          assert:
            - "InnovationProject.${lf_p_id}.development_budget_committed_usd == 30000.00"
            - "the ledger is not 80000.00, the sum of every commitment ever created on the formulation"
            - "the ledger is not 10000.00, so the FAILED study still holds its 20000.00"
            - "PilotRun.${lf_run1_id}.status == COMPLETED, PilotRun.${lf_run2_id}.status == CANCELLED and ShelfLifeStudy.${lf_study_id}.status == FAILED"
            - "ShelfLifeStudy.${lf_study_id}.verdict == FAIL with min_quality_score 55.00, closed by the sub-60.00 reading rather than by reaching day 180"
            - "Formulation.${lf_f_id}.status == PILOT_PASSED, unchanged by the failed study"

      - name: calc_avg_list_price_is_store_count_weighted
        claim_type: weighted_aggregation
        grounds:
          - calculations.forecast_volume_and_revenue.avg_list_price_usd
          - calculations.business_case_financials.TRADE_TIERS
        distinguishing_aspect: |
          avg_list_price_usd weights each channel price by its store count rather than averaging
          the prices, so a 3000-store line at 4.0000 and a 1000-store line at 8.0000 give 5.0000
          and not 6.0000; in TOP_DOWN that weighted price is what puts gross revenue on exactly
          1000000.00, the inclusive lower edge of the 12.00 trade tier.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-03T00:00:00Z."
            - "One SNACK project in dev_status IDEA holding a TOP_DOWN case with two channel lines."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /innovation-projects"
              payload: { name: "Toffee Crunch Bites", brand: "GrainWell", category: "SNACK", project_type: "LINE_EXTENSION", strategic_fit_score: 8, consumer_need_score: 7, target_gross_margin_pct: 36, category_attractiveness_score: 7, development_budget_cap_usd: 500000.00 }
              as: InnovationLead
              as_user_id: "lead-wa"
              captures: { wa_p_id: $.data.id, wa_p_v1: $.data.version }
            - call: "POST /innovation-projects/${wa_p_id}/business-cases"
              payload: { expected_project_version: "${wa_p_v1}", variant_mode: "TOP_DOWN", category_size_units_year: 1000000, target_share_pct: 20.00, cogs_per_unit_usd: 2.0000, slotting_fees_usd: 0.00, capex_usd: 200000.00, discount_rate_pct: 10.00 }
              as: InnovationLead
              captures: { wa_bc_id: $.data.id }
          trigger:
            - call: "POST /business-cases/${wa_bc_id}/forecast-lines"
              payload: { channel: "GROCERY", store_count: 3000, base_velocity_units_per_store_week: 1.00, promo_weeks: 0, promo_lift_pct: 0.00, list_price_usd: 4.0000 }
              as: InnovationLead
            - call: "POST /business-cases/${wa_bc_id}/forecast-lines"
              payload: { channel: "MASS", store_count: 1000, base_velocity_units_per_store_week: 1.00, promo_weeks: 0, promo_lift_pct: 0.00, list_price_usd: 8.0000 }
              as: InnovationLead
            - call: "GET /business-cases/${wa_bc_id}"
              as: InnovationLead
          assert:
            - "BusinessCase.${wa_bc_id}.avg_list_price_usd == 5.0000"
            - "BusinessCase.${wa_bc_id}.avg_list_price_usd != 6.0000, the unweighted mean of 4.0000 and 8.0000"
            - "BusinessCase.${wa_bc_id}.annual_units == 200000 and gross_revenue_usd == 1000000.00"
            - "BusinessCase.${wa_bc_id}.trade_spend_rate_pct == 12.00, so the tier lower bound is inclusive, and not 10.00"
            - "BusinessCase.${wa_bc_id}.trade_spend_usd == 120000.00 and net_revenue_usd == 880000.00"
            - "BusinessCase.${wa_bc_id}.gross_margin_pct == 54.55 and npv_usd == 1140465.82 with payback_months 5"

      - name: calc_zero_net_revenue_guard_returns_zero_margin_pct
        claim_type: zero_denominator
        grounds:
          - calculations.business_case_financials.step_6
        distinguishing_aspect: |
          Slotting fees exactly consume the post-trade revenue, so step 6 divides by a net of
          0.00; the guard returns 0.00 rather than raising, and that 0.00 sits next to a
          gross_margin_usd of -100000.00, proving it is a guard value and not break-even.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-03T00:00:00Z."
