              captures: { w203_id: $.data.id }
          trigger:
            - call: "POST /fleet/mechanics/${m203_id}/off-duty"
              as: FleetAdmin
              captures: { m203_off: $.data.status }
            - call: "POST /fleet/work-orders/${w203_id}/dispatch"
              payload: { mechanic_id: "${m203_id}" }
              as: FleetAdmin
              captures: { err: $.data.error_id }
            - call: "POST /fleet/mechanics/${m203_id}/on-duty"
              as: FleetAdmin
              captures: { m203_on: $.data.status }
            - call: "POST /fleet/work-orders/${w203_id}/dispatch"
