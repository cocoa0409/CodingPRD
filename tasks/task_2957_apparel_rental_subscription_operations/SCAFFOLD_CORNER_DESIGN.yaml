            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /shipments/${in1_id}/receipt"
              payload: {}
              as: WarehouseTech
              as_user_id: "${tech_insp_id}"
            - call: "GET /reverse-logistics-jobs"
              payload: { reservation_id: "${res1_id}" }
              as: WarehouseTech
              as_user_id: "${tech_insp_id}"
              captures: { job1_id: "$.data[0].id" }
            - call: "POST /reverse-logistics-jobs/${job1_id}/inspections"
              payload: { soil_level: "LIGHT", damage_severity: "MODERATE", condition_grade_after: "B", biohazard_flag: false, notes: "post-turn inspection" }
              as: WarehouseTech
              as_user_id: "${tech_insp_id}"
            - call: "GET /damage-claims"
              payload: { reservation_id: "${res1_id}" }
              as: ClaimsAdjuster
              captures: { claim1_id: "$.data[0].id" }
            - call: "POST /damage-claims/${claim1_id}/assessment"
              payload: {}
              as: ClaimsAdjuster
          trigger:
            - call: "POST /damage-claims/${claim1_id}/charge"
              payload: {}
              as: ClaimsAdjuster
            - call: "GET /members/${member_id}"
              payload: {}
              as: ClaimsAdjuster
            - call: "GET /fee-ledger-entries"
              payload: { member_id: "${member_id}" }
              as: ClaimsAdjuster
          assert:
            - "charge response: HTTP 200 with DamageClaim.state == CHARGED and charged_at == 2026-08-10T09:00:00Z and net_fee_cents == 9000"
            - "member read: outstanding_fee_cents == 9000 and status == ACTIVE"
            - "ledger read: total_count == 1 with data[0].kind == DAMAGE_FEE and amount_cents == 9000 and direction == DEBIT and balance_after_cents == 9000"
            - "ledger read: data[0].damage_claim_id == ${claim1_id} and data[0].member_id == ${member_id}"
            - "GET /rental-units/${unit1_id} reports availability_state == PROCESSING and condition_state == NEEDS_REPAIR"
