            - "ParticipationReport.${rep_id}.verified_hours == null"
            - "ParticipationReport.${rep_id}.core_hours_credited == 0"
            - "WorkAssignment.${wa_id}.cumulative_verified_hours == 0"
            - "WorkAssignment.${wa_id}.compliance_flag == NONE"
            - "AssistanceCase.${case_id}.compliance_status == ASSIGNED"
            - "GET /compliance-episodes?case_id=${case_id} returns total_count 0"

      - name: declining_a_diversion_offer_cycles_the_application_back_to_determined
        claim_type: cyclic
        grounds:
          - state_machines.Application.status
          - state_machines.DiversionGrant.status
          - endpoints[POST /diversion-grants/{id}/decline]
        distinguishing_aspect: |
          The application returns to DETERMINED — a state it already occupied —
          and ongoing assistance can then be approved, while
          Household.diversion_ineligible_through_month stays null because only an
          acceptance opens the ineligibility window.
        test_recipe:
          setup:
            - "A household of size 3 has a DIVERSION_CONSIDERED 2026-08 application, DETERMINED with no income so determined_benefit_cents is 41650."
            - "A DiversionGrant has been offered on it, so the application is DIVERSION_OFFERED."
          setup_api_calls:
            - call: "POST /households"
              payload: { head_of_household_name: "Corner Decline Diversion Household", county_code: "ADA", household_size: 3, adult_count: 1, youngest_child_age_months: 84, has_subsidized_child_care: false }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hh_id: $.data.id }
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", application_month: "2026-08", requested_program: "DIVERSION_CONSIDERED", budgeting_method: "PROSPECTIVE" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/determine"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /applications/${app_id}/diversion-grants"
              payload: {}
              as: EligibilitySupervisor
              as_user_id: "sup-1"
              captures: { div_id: $.data.id }
          trigger:
            - call: "POST /diversion-grants/${div_id}/decline"
              payload: { decline_reason: "PREFERS_ONGOING_ASSISTANCE" }
              as: Applicant
              as_user_id: "${hh_id}"
            - call: "POST /applications/${app_id}/approve"
              payload: { certification_start_month: "2026-08" }
              as: EligibilitySupervisor
              as_user_id: "sup-1"
              captures: { case_id: $.data.id }
          assert:
            - "the first trigger call returns HTTP 200"
            - "DiversionGrant.${div_id}.status == DECLINED"
            - "DiversionGrant.${div_id}.lump_sum_cents == 124950"
            - "DiversionGrant.${div_id}.ineligibility_months == 3"
            - "Application.${app_id}.status == DETERMINED after the first trigger call"
            - "Household.${hh_id}.diversion_ineligible_through_month == null after the first trigger call"
            - "the second trigger call returns HTTP 201"
            - "AssistanceCase.${case_id}.benefit_amount_cents == 41650"
            - "Application.${app_id}.status == APPROVED after the second trigger call"

      - name: case_dimensions_move_independently_covered_by_difficulty_design
        claim_type: parallel
        grounds:
          - state_machines.AssistanceCase.benefit_status
          - state_machines.AssistanceCase.compliance_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / case_benefit_and_compliance_dimensions_advance_independently
          rationale: "That instance walks compliance_status ASSIGNED -> CONCILIATION_PENDING -> SANCTIONED -> ASSIGNED while benefit_status stays ACTIVE and asserts both dimensions at every step."

      - name: first_issuance_activates_the_case_covered_by_difficulty_design
        claim_type: valid_transition
        grounds:
          - state_machines.AssistanceCase.benefit_status
