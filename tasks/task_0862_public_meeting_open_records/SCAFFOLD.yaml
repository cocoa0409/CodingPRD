# =============================================================================
# PRD-bench seed tables — Public-Meeting & Open-Records Portal (Expert)
# =============================================================================

scenario: |
  862. Public-Meeting & Open-Records Portal: agenda & packet publishing, notice &
  posting (open-meetings law) compliance, public-comment signup & speaker queue,
  minutes & vote record, records-request (FOIA/state) intake & fee,
  exemption/redaction & deadline, appeal, retention schedule

domain_name: public-meeting-open-records

# Flat/hybrid multi-root topology: resources are reached both by nested creation
# paths (POST /meetings/{id}/agenda-items) and by flat single-resource reads
# (GET /meetings/{id}). There is no single common URL root, so api_prefix is the
# empty string (all paths are absolute from "/").
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency          # OCC on RecordsRequest.version at determination
    - cascading_side_effects          # meeting-cancel & request-withdraw & appeal-remand chains
    - dual_variant_calculation        # estimated-vs-assessed fee; simple-vs-absolute majority
    - rate_threshold_triggers         # notice lead-time hours, free-page allowance, quorum count

  entity_topology: hybrid             # containment tree (body>meeting>item>motion) + cross-cutting refs (venue, presiding member)
  state_machine_shape: parallel       # Meeting carries lifecycle × minutes dimensions; Motion cyclic; Appeal branching
  relationship_patterns:
    - one_to_many                     # body has meetings; meeting has agenda items; request has documents
    - cross_aggregate                 # meeting references venue and presiding member; ballots reference members
    - self_referential: false
  role_model: segregation_of_duties   # appeals officer != determining records officer; presiding officer gating
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: PublicBody
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Governing body name (e.g., City Council)" }
      - { name: jurisdiction_state, type: string, source: input, description: "Two-letter US state code governing open-meetings/records law" }
      - { name: seat_count, type: integer, source: input, description: "Total number of authorized voting seats (used for absolute-majority tally)", constraints: ">= 1" }
      - { name: quorum_size, type: integer, source: input, description: "Minimum members that must be present to convene a meeting", constraints: ">= 1, <= seat_count" }

  - name: Requester
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Member of the public submitting records requests / speaking" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: organization, type: string, source: input, description: "Optional affiliation", default: null }

  - name: BodyMember
    parent: PublicBody
    common_fields: true
    fields:
      - { name: body_id, type: string, source: system, description: "FK -> PublicBody.id; owning governing body" }
      - { name: full_name, type: string, source: input, description: "Member (elected official) full name" }
      - { name: seat_number, type: integer, source: input, description: "Seat index within the body", constraints: ">= 1, <= body.seat_count" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RECUSED | VACANT", default: "ACTIVE" }

  - name: Venue
    parent: PublicBody
    common_fields: true
    fields:
      - { name: body_id, type: string, source: system, description: "FK -> PublicBody.id; owning governing body" }
      - { name: name, type: string, source: input, description: "Room / location name" }
      - { name: capacity, type: integer, source: input, description: "Seating capacity", default: 50 }

  - name: Meeting
    parent: PublicBody
    common_fields: true
    fields:
      - { name: body_id, type: string, source: system, description: "FK -> PublicBody.id; owning governing body" }
      - { name: venue_id, type: string, source: input, description: "Venue.id of the booked room; must belong to the same PublicBody. Occupancy interval used for venue-overlap check." }
      - { name: presiding_member_id, type: string, source: input, description: "BodyMember.id designated to preside (chair); must belong to the same PublicBody. Used for presiding-overlap check and presiding-officer authorization." }
      - { name: title, type: string, source: input, description: "Meeting title" }
      - { name: meeting_type, type: enum, source: input, description: "REGULAR | SPECIAL | EMERGENCY — selects statutory notice lead time" }
      - { name: scheduled_start, type: datetime, source: input, description: "Planned start (ISO8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Planned end (ISO8601 UTC); must be strictly after scheduled_start" }
      - { name: status, type: enum, source: system, description: "Lifecycle dimension: SCHEDULED | NOTICED | IN_SESSION | ADJOURNED | CANCELLED", default: "SCHEDULED" }
      - { name: minutes_status, type: enum, source: system, description: "Minutes dimension (independent axis): NONE | DRAFT | APPROVED | AMENDED", default: "NONE" }
      - { name: notice_channel, type: enum, source: system, description: "WEBSITE | BULLETIN | NEWSPAPER — set when notice posted", default: null }
      - { name: notice_posted_at, type: datetime, source: system, description: "Logical-clock instant the notice was posted (set on NOTICED transition)", default: null }
      - { name: notice_lead_hours, type: number, source: computed, description: "= (scheduled_start - notice_posted_at) / 3600, null until noticed" }
      - { name: present_member_ids, type: array, source: system, description: "BodyMember.id list recorded present at convene (set on IN_SESSION transition)", default: [] }
      - { name: quorum_met, type: boolean, source: computed, description: "= len(present_member_ids) >= body.quorum_size" }
      - { name: minutes_text, type: string, source: system, description: "Drafted minutes body", default: null }
      - { name: minutes_approved_at, type: datetime, source: system, description: "Instant minutes were approved", default: null }

  - name: AgendaItem
    parent: Meeting
    common_fields: true
    fields:
      - { name: meeting_id, type: string, source: system, description: "FK -> Meeting.id; owning meeting" }
      - { name: title, type: string, source: input, description: "Agenda item caption" }
      - { name: sequence, type: integer, source: input, description: "Order on the agenda", constraints: ">= 1" }
      - { name: item_type, type: enum, source: input, description: "ACTION | DISCUSSION | CONSENT — only ACTION items may carry motions", default: "DISCUSSION" }
      - { name: public_comment_enabled, type: boolean, source: input, description: "Whether public may sign up to speak on this item", default: true }
      - { name: status, type: enum, source: system, description: "PENDING | OPEN | CLOSED | CANCELLED", default: "PENDING" }

  - name: SpeakerSlip
    parent: AgendaItem
    common_fields: true
    fields:
      - { name: agenda_item_id, type: string, source: system, description: "FK -> AgendaItem.id; item the speaker signed up on" }
      - { name: requester_id, type: string, source: input, description: "Requester.id of the signer; must equal X-User-ID of the acting Requester (ownership)" }
      - { name: speaker_name, type: string, source: input, description: "Display name for the podium queue" }
      - { name: allotted_seconds, type: integer, source: input, description: "Requested speaking time; capped by ITEM_COMMENT_CAP_SECONDS aggregate", default: 180 }
      - { name: position, type: integer, source: computed, description: "1-based queue order = rank of created_at ASC among non-withdrawn slips on the item" }
      - { name: called_at, type: datetime, source: system, description: "Instant the chair called this speaker", default: null }
      - { name: status, type: enum, source: system, description: "QUEUED | CALLED | SPOKEN | YIELDED | WITHDRAWN | EXPIRED", default: "QUEUED" }

  - name: Motion
    parent: AgendaItem
    common_fields: true
    fields:
      - { name: agenda_item_id, type: string, source: system, description: "FK -> AgendaItem.id; item under which the motion is moved" }
      - { name: text, type: string, source: input, description: "Motion text" }
      - { name: moved_by_member_id, type: string, source: input, description: "BodyMember.id of the mover; must be a present member" }
      - { name: seconded_by_member_id, type: string, source: input, description: "BodyMember.id of the seconder; must be a present member distinct from the mover" }
      - { name: vote_threshold, type: enum, source: input, description: "SIMPLE | ABSOLUTE — passage rule variant", default: "SIMPLE" }
      - { name: ballots, type: array, source: system, description: "Roll-call ballots: list of {member_id, value in YEA|NAY|ABSTAIN|RECUSED}; one per member (upsert on re-cast)", default: [] }
      - { name: yea_count, type: integer, source: computed, description: "count of ballots with value==YEA", default: 0 }
      - { name: nay_count, type: integer, source: computed, description: "count of ballots with value==NAY", default: 0 }
      - { name: abstain_count, type: integer, source: computed, description: "count of ballots with value==ABSTAIN", default: 0 }
      - { name: recused_count, type: integer, source: computed, description: "count of ballots with value==RECUSED", default: 0 }
      - { name: ballot_count, type: integer, source: computed, description: "total ballots = yea+nay+abstain+recused", default: 0 }
      - { name: outcome, type: enum, source: computed, description: "PENDING until closed; then CARRIED | FAILED per vote_threshold", default: "PENDING" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | CARRIED | FAILED | TABLED | VOIDED", default: "DRAFT" }

  - name: RecordsRequest
    parent: null
    common_fields: true
    fields:
      - { name: requester_id, type: string, source: input, description: "Requester.id who submitted the request; must equal X-User-ID of the acting Requester (ownership)" }
      - { name: body_id, type: string, source: input, description: "PublicBody.id the request is addressed to" }
      - { name: subject, type: string, source: input, description: "Short subject line" }
      - { name: description, type: string, source: input, description: "Free-text description of records sought" }
      - { name: estimated_page_count, type: integer, source: input, description: "Requester's estimate of responsive pages (drives forward-looking estimated_fee)", constraints: ">= 0" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock instant of submission" }
      - { name: response_deadline, type: datetime, source: computed, description: "submitted_at advanced by RESPONSE_DEADLINE_BUSINESS_DAYS business days, at 23:59:59Z of that date" }
      - { name: estimated_fee_cents, type: integer, source: computed, description: "Forward-looking fee = copy_fee(estimated_page_count); labor unknown at intake so 0" }
      - { name: assessed_fee_cents, type: integer, source: computed, description: "Final fee at determination = copy_fee(sum billable pages) + labor_fee(sum review_minutes); 0 until determined", default: 0 }
      - { name: amount_waived_cents, type: integer, source: system, description: "Public-interest waiver applied at determination", default: 0 }
      - { name: amount_paid_cents, type: integer, source: system, description: "Cumulative payments received", default: 0 }
      - { name: fee_balance_cents, type: integer, source: computed, description: "= assessed_fee_cents - amount_waived_cents - amount_paid_cents", default: 0 }
      - { name: decision, type: enum, source: system, description: "NONE | GRANTED | PARTIALLY_GRANTED | DENIED", default: "NONE" }
      - { name: determined_by_user_id, type: string, source: system, description: "X-User-ID of the RecordsOfficer who issued the determination (basis for SoD on appeal)", default: null }
      - { name: determined_at, type: datetime, source: system, description: "Instant of determination (starts the APPEAL_WINDOW_DAYS clock)", default: null }
      - { name: status, type: enum, source: system, description: "RECEIVED | UNDER_REVIEW | GRANTED | PARTIALLY_GRANTED | DENIED | CLOSED | WITHDRAWN", default: "RECEIVED" }

  - name: ResponsiveDocument
    parent: RecordsRequest
    common_fields: true
    fields:
      - { name: request_id, type: string, source: system, description: "FK -> RecordsRequest.id; owning request" }
      - { name: title, type: string, source: input, description: "Document title / bates label" }
      - { name: page_count, type: integer, source: input, description: "Pages in the document", constraints: ">= 0" }
      - { name: review_minutes, type: integer, source: input, description: "Staff minutes spent reviewing/redacting this document (drives labor fee)", constraints: ">= 0" }
      - { name: exemption_code, type: enum, source: input, description: "NONE | PRIVACY | DELIBERATIVE | SECURITY | MEDICAL", default: "NONE" }
      - { name: retention_series, type: enum, source: input, description: "PERMANENT | FISCAL | ADMIN | TRANSITORY — selects RETENTION_YEARS for disposition", default: "ADMIN" }
      - { name: billable_pages, type: integer, source: computed, description: "= page_count when status in {RELEASED, REDACTED}, else 0 (EXEMPT/CANCELLED pages are not copied)" }
      - { name: status, type: enum, source: system, description: "IDENTIFIED | REVIEWED | RELEASED | REDACTED | EXEMPT | DISPOSED | CANCELLED", default: "IDENTIFIED" }

  - name: Appeal
    parent: RecordsRequest
    common_fields: true
    fields:
      - { name: request_id, type: string, source: system, description: "FK -> RecordsRequest.id; the appealed request" }
      - { name: grounds, type: string, source: input, description: "Requester's stated grounds for appeal" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock instant the appeal was filed" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the AppealsOfficer who reviewed (must differ from request.determined_by_user_id — SoD)", default: null }
      - { name: decision, type: enum, source: system, description: "NONE | UPHELD | OVERTURNED | REMANDED", default: "NONE" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | UPHELD | OVERTURNED | REMANDED", default: "FILED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Meeting: lifecycle dimension (status) ----
  - entity: Meeting
    initial_state: SCHEDULED
    terminal_states: [ADJOURNED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: NOTICED
        trigger: "POST /meetings/{id}/transition {to_status: NOTICED, notice_channel}"
        actor: Clerk
        preconditions:
          - "notice_channel provided"
        side_effects:
          - "notice_posted_at = current logical clock"
          - "notice_channel set from request"
          - "notice_lead_hours computed = (scheduled_start - notice_posted_at)/3600"

      - from: NOTICED
        to: NOTICED
        trigger: "POST /meetings/{id}/transition {to_status: NOTICED, notice_channel}"
        actor: Clerk
        preconditions:
          - "notice_channel provided"
        side_effects:
          - "Re-post (amended notice): notice_posted_at and notice_lead_hours recomputed to the new clock instant"
        note: "Amended notice; resets the lead-time clock."

      - from: NOTICED
        to: IN_SESSION
        trigger: "POST /meetings/{id}/transition {to_status: IN_SESSION, present_member_ids}"
        actor: BodyMember
        preconditions:
          - "Acting BodyMember (X-User-ID) == presiding_member_id (ERR_NOT_PRESIDING_OFFICER)"
          - "notice_lead_hours >= NOTICE_LEAD_HOURS[meeting_type] (ERR_NOTICE_NONCOMPLIANT) — business_temporal"
          - "len(present_member_ids) >= body.quorum_size (ERR_QUORUM_NOT_MET) — business_constraint"
        side_effects:
          - "present_member_ids recorded; quorum_met computed true"

      - from: IN_SESSION
        to: ADJOURNED
        trigger: "POST /meetings/{id}/transition {to_status: ADJOURNED}"
        actor: BodyMember
        preconditions:
          - "Acting BodyMember == presiding_member_id (ERR_NOT_PRESIDING_OFFICER)"
          - "No Motion under any agenda item is in OPEN (ERR_OPEN_MOTIONS_EXIST)"
        side_effects:
          - "Each AgendaItem in OPEN -> CLOSED"
          - "Each SpeakerSlip in QUEUED or CALLED -> EXPIRED"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /meetings/{id}/transition {to_status: CANCELLED}"
        actor: Clerk
        preconditions: []
        side_effects:
          - "Cascade: each non-terminal AgendaItem -> CANCELLED (see AgendaItem cascade)"

      - from: NOTICED
        to: CANCELLED
        trigger: "POST /meetings/{id}/transition {to_status: CANCELLED}"
        actor: Clerk
        preconditions: []
        side_effects:
          - "Cascade: each non-terminal AgendaItem -> CANCELLED (see AgendaItem cascade)"

      - from: IN_SESSION
        to: CANCELLED
        trigger: "POST /meetings/{id}/transition {to_status: CANCELLED}"
        actor: Clerk
        preconditions: []
        side_effects:
          - "Depth-3 cascade root. Each AgendaItem in {PENDING, OPEN} -> CANCELLED; that item-cancellation itself voids its Motions and withdraws its SpeakerSlips (see AgendaItem transitions)."

  # ---- Meeting: minutes dimension (minutes_status) — parallel axis ----
  - entity: Meeting
    initial_state: NONE
    terminal_states: []
    note: "Second (parallel) state dimension on Meeting, advanced by POST /meetings/{id}/minutes independent of the lifecycle dimension, but guarded by status == ADJOURNED."
    transitions:
      - from: NONE
        to: DRAFT
        trigger: "POST /meetings/{id}/minutes {to_status: DRAFT, minutes_text}"
        actor: Clerk
        preconditions:
          - "status (lifecycle dimension) == ADJOURNED (ERR_INVALID_STATE) — cross-dimension guard"
        side_effects:
          - "minutes_text stored"

      - from: DRAFT
        to: APPROVED
        trigger: "POST /meetings/{id}/minutes {to_status: APPROVED}"
        actor: BodyMember
        preconditions:
          - "Acting BodyMember == presiding_member_id (ERR_NOT_PRESIDING_OFFICER)"
        side_effects:
          - "minutes_approved_at = current logical clock"

      - from: APPROVED
        to: AMENDED
        trigger: "POST /meetings/{id}/minutes {to_status: AMENDED, minutes_text}"
        actor: Clerk
        preconditions: []
        side_effects:
          - "minutes_text replaced; minutes_approved_at cleared to null"

      - from: AMENDED
        to: APPROVED
        trigger: "POST /meetings/{id}/minutes {to_status: APPROVED}"
        actor: BodyMember
        preconditions:
          - "Acting BodyMember == presiding_member_id"
        side_effects:
          - "minutes_approved_at = current logical clock"
        note: "AMENDED -> APPROVED closes the amendment cycle (APPROVED -> AMENDED -> APPROVED)."

  # ---- AgendaItem ----
  - entity: AgendaItem
    initial_state: PENDING
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PENDING
        to: OPEN
        trigger: "POST /agenda-items/{id}/transition {to_status: OPEN}"
        actor: BodyMember
        preconditions:
          - "Acting BodyMember == parent meeting.presiding_member_id (ERR_NOT_PRESIDING_OFFICER)"
          - "Parent Meeting.status == IN_SESSION (ERR_MEETING_NOT_IN_SESSION) — cross-entity (AgendaItem depends on Meeting)"
        side_effects:
          - "Public comment for the item may now be called"

      - from: OPEN
        to: CLOSED
        trigger: "POST /agenda-items/{id}/transition {to_status: CLOSED}"
        actor: BodyMember
        preconditions:
          - "Acting BodyMember == parent meeting.presiding_member_id"
          - "No Motion under this item in OPEN (ERR_OPEN_MOTIONS_EXIST)"
        side_effects:
          - "Each SpeakerSlip under item in {QUEUED, CALLED} -> EXPIRED"

      - from: PENDING
        to: CANCELLED
        trigger: "system cascade from Meeting CANCELLED"
        actor: system
        preconditions: []
        side_effects:
          - "Each SpeakerSlip in {QUEUED, CALLED} -> WITHDRAWN"

      - from: OPEN
        to: CANCELLED
        trigger: "system cascade from Meeting CANCELLED"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade link 2: each Motion under item in {DRAFT, OPEN, TABLED} -> VOIDED (that voiding clears the motion's ballots — link 3)"
          - "Each SpeakerSlip under item in {QUEUED, CALLED} -> WITHDRAWN"

  # ---- SpeakerSlip ----
  - entity: SpeakerSlip
    initial_state: QUEUED
    terminal_states: [SPOKEN, YIELDED, WITHDRAWN, EXPIRED]
    transitions:
      - from: QUEUED
        to: CALLED
        trigger: "POST /speaker-slips/{id}/transition {to_status: CALLED}"
        actor: BodyMember
        preconditions:
          - "Acting BodyMember == parent meeting.presiding_member_id (ERR_NOT_PRESIDING_OFFICER)"
          - "Parent AgendaItem.status == OPEN (ERR_MEETING_NOT_IN_SESSION alias -> ERR_INVALID_STATE)"
          - "No other SpeakerSlip under the same AgendaItem is currently CALLED (ERR_SPEAKER_ALREADY_ACTIVE)"
        side_effects:
          - "called_at = current logical clock"

      - from: CALLED
        to: SPOKEN
        trigger: "POST /speaker-slips/{id}/transition {to_status: SPOKEN}"
        actor: BodyMember
        preconditions: []
        side_effects: []

      - from: CALLED
        to: YIELDED
        trigger: "POST /speaker-slips/{id}/transition {to_status: YIELDED}"
        actor: BodyMember
        preconditions: []
        side_effects: []

      - from: QUEUED
        to: WITHDRAWN
        trigger: "POST /speaker-slips/{id}/transition {to_status: WITHDRAWN}"
        actor: Requester
        preconditions:
          - "Acting Requester (X-User-ID) == slip.requester_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "Frees the slip's allotted_seconds from the item comment-cap total"

      - from: QUEUED
        to: EXPIRED
        trigger: "system cascade from Meeting ADJOURNED or AgendaItem CLOSED"
        actor: system
        preconditions: []
        side_effects: []

      - from: CALLED
        to: EXPIRED
        trigger: "system cascade from Meeting ADJOURNED or AgendaItem CLOSED"
        actor: system
        preconditions: []
        side_effects: []

      - from: QUEUED
        to: WITHDRAWN
        trigger: "system cascade from AgendaItem CANCELLED"
        actor: system
        preconditions: []
        side_effects: []

      - from: CALLED
        to: WITHDRAWN
        trigger: "system cascade from AgendaItem CANCELLED"
        actor: system
        preconditions: []
        side_effects: []

  # ---- Motion (cyclic: OPEN <-> TABLED reconsider) ----
  - entity: Motion
    initial_state: DRAFT
    terminal_states: [CARRIED, FAILED, VOIDED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /motions/{id}/transition {to_status: OPEN}"
        actor: BodyMember
        preconditions:
          - "Acting BodyMember == parent meeting.presiding_member_id (ERR_NOT_PRESIDING_OFFICER)"
          - "Parent AgendaItem.status == OPEN (ERR_INVALID_STATE) AND parent Meeting.status == IN_SESSION (ERR_MEETING_NOT_IN_SESSION) — cross-entity (Motion depends on Meeting)"
        side_effects:
          - "Voting is opened; ballots may be cast"

      - from: OPEN
        to: CARRIED
        trigger: "POST /motions/{id}/transition {to_status: CLOSED}"
        actor: BodyMember
        preconditions:
          - "Acting BodyMember == parent meeting.presiding_member_id"
        side_effects:
          - "Compute vote_tally; outcome==CARRIED iff passage rule (vote_threshold) is met; status=CARRIED"
        note: "Chair closes voting; server computes CARRIED vs FAILED from the tally."

      - from: OPEN
        to: FAILED
        trigger: "POST /motions/{id}/transition {to_status: CLOSED}"
        actor: BodyMember
        preconditions:
          - "Acting BodyMember == parent meeting.presiding_member_id"
        side_effects:
          - "Compute vote_tally; outcome==FAILED iff passage rule not met; status=FAILED"
        note: "Same trigger as CARRIED; branch chosen by the computed tally."

      - from: OPEN
        to: TABLED
        trigger: "POST /motions/{id}/transition {to_status: TABLED}"
        actor: BodyMember
        preconditions:
          - "Acting BodyMember == parent meeting.presiding_member_id"
        side_effects: []

      - from: TABLED
        to: OPEN
        trigger: "POST /motions/{id}/transition {to_status: OPEN}"
        actor: BodyMember
        preconditions:
          - "Acting BodyMember == parent meeting.presiding_member_id"
          - "Parent Meeting.status == IN_SESSION"
        side_effects:
          - "Motion reconsidered; voting re-opened (existing ballots retained)"
        note: "Cycle: OPEN -> TABLED -> OPEN (reconsideration)."

      - from: DRAFT
        to: VOIDED
        trigger: "system cascade from AgendaItem CANCELLED"
        actor: system
        preconditions: []
        side_effects: ["ballots cleared to []"]

      - from: OPEN
        to: VOIDED
        trigger: "system cascade from AgendaItem CANCELLED"
        actor: system
        preconditions: []
        side_effects: ["ballots cleared to [] (cascade link 3)"]

      - from: TABLED
        to: VOIDED
        trigger: "system cascade from AgendaItem CANCELLED"
        actor: system
        preconditions: []
        side_effects: ["ballots cleared to []"]

  # ---- RecordsRequest (branch at determination; cyclic reopen via appeal remand) ----
  - entity: RecordsRequest
    initial_state: RECEIVED
    terminal_states: [CLOSED, WITHDRAWN]
    transitions:
      - from: RECEIVED
        to: UNDER_REVIEW
        trigger: "POST /records-requests/{id}/transition {to_status: UNDER_REVIEW}"
        actor: RecordsOfficer
        preconditions: []
        side_effects: []

      - from: UNDER_REVIEW
        to: GRANTED
        trigger: "POST /records-requests/{id}/determination {decision: GRANTED, ...}"
        actor: RecordsOfficer
        preconditions:
          - "expected_records_request_version matches current version (ERR_STALE_VERSION) — OCC"
        side_effects:
          - "assessed_fee_cents computed; amount_waived_cents set; fee_balance recomputed; determined_by_user_id and determined_at recorded; decision=GRANTED"

      - from: UNDER_REVIEW
        to: PARTIALLY_GRANTED
        trigger: "POST /records-requests/{id}/determination {decision: PARTIALLY_GRANTED, ...}"
        actor: RecordsOfficer
        preconditions:
          - "expected_records_request_version matches current version (ERR_STALE_VERSION) — OCC"
        side_effects:
          - "assessed_fee/waiver/balance/determined_* set; decision=PARTIALLY_GRANTED"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /records-requests/{id}/determination {decision: DENIED, ...}"
        actor: RecordsOfficer
        preconditions:
          - "expected_records_request_version matches current version (ERR_STALE_VERSION) — OCC"
        side_effects:
          - "assessed_fee/waiver/balance/determined_* set; decision=DENIED"

      - from: GRANTED
        to: CLOSED
        trigger: "POST /records-requests/{id}/transition {to_status: CLOSED}"
        actor: RecordsOfficer
        preconditions:
          - "fee_balance_cents == 0 (ERR_FEE_OUTSTANDING) — business_fiscal, checked after state"
        side_effects: []

      - from: PARTIALLY_GRANTED
        to: CLOSED
        trigger: "POST /records-requests/{id}/transition {to_status: CLOSED}"
        actor: RecordsOfficer
        preconditions:
          - "fee_balance_cents == 0 (ERR_FEE_OUTSTANDING)"
        side_effects: []

      - from: DENIED
        to: CLOSED
        trigger: "POST /records-requests/{id}/transition {to_status: CLOSED}"
        actor: RecordsOfficer
        preconditions: []
        side_effects: []

      - from: DENIED
        to: UNDER_REVIEW
        trigger: "system cascade from Appeal REMANDED"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade: each ResponsiveDocument in EXEMPT -> REVIEWED (re-review); decision reset to NONE; determined_* cleared"

      - from: PARTIALLY_GRANTED
        to: UNDER_REVIEW
        trigger: "system cascade from Appeal REMANDED"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade: each ResponsiveDocument in EXEMPT -> REVIEWED; decision reset to NONE; determined_* cleared"

      - from: RECEIVED
        to: WITHDRAWN
        trigger: "POST /records-requests/{id}/transition {to_status: WITHDRAWN}"
        actor: Requester
        preconditions:
          - "Acting Requester (X-User-ID) == requester_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "Cascade: each ResponsiveDocument not DISPOSED -> CANCELLED"

      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /records-requests/{id}/transition {to_status: WITHDRAWN}"
        actor: Requester
        preconditions:
          - "Acting Requester (X-User-ID) == requester_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "Depth-2 cascade: each ResponsiveDocument not DISPOSED -> CANCELLED; assessed_fee_cents/fee_balance_cents reset to 0"

      - from: DENIED
        to: GRANTED
        trigger: "system cascade from Appeal OVERTURNED"
        actor: system
        preconditions: []
        side_effects:
          - "decision=GRANTED; assessed_fee recomputed over now-released documents"

  # ---- ResponsiveDocument ----
  - entity: ResponsiveDocument
    initial_state: IDENTIFIED
    terminal_states: [DISPOSED, CANCELLED]
    transitions:
      - from: IDENTIFIED
        to: REVIEWED
        trigger: "POST /records-requests/{rid}/documents/{id}/transition {to_status: REVIEWED}"
        actor: RecordsOfficer
        preconditions:
          - "Parent RecordsRequest.status == UNDER_REVIEW (ERR_DOCUMENT_REQUEST_NOT_UNDER_REVIEW) — cross-entity (Document depends on RecordsRequest)"
        side_effects: []

      - from: REVIEWED
        to: RELEASED
        trigger: "POST /records-requests/{rid}/documents/{id}/transition {to_status: RELEASED}"
        actor: RecordsOfficer
        preconditions: []
        side_effects: ["billable_pages recomputed = page_count"]

      - from: REVIEWED
        to: REDACTED
        trigger: "POST /records-requests/{rid}/documents/{id}/transition {to_status: REDACTED}"
        actor: RecordsOfficer
        preconditions:
          - "exemption_code != NONE (ERR_VALIDATION) — a redaction requires an exemption basis"
        side_effects: ["billable_pages recomputed = page_count"]

      - from: REVIEWED
        to: EXEMPT
        trigger: "POST /records-requests/{rid}/documents/{id}/transition {to_status: EXEMPT}"
        actor: RecordsOfficer
        preconditions:
          - "exemption_code != NONE (ERR_VALIDATION)"
        side_effects: ["billable_pages recomputed = 0 (withheld in full)"]

      - from: RELEASED
        to: DISPOSED
        trigger: "POST /records-requests/{rid}/documents/{id}/transition {to_status: DISPOSED}"
        actor: Clerk
        preconditions:
          - "current logical clock >= created_at + RETENTION_YEARS[retention_series] years (ERR_RETENTION_NOT_ELAPSED) — business_temporal"
        side_effects: []

      - from: REDACTED
        to: DISPOSED
        trigger: "POST /records-requests/{rid}/documents/{id}/transition {to_status: DISPOSED}"
        actor: Clerk
        preconditions:
          - "current logical clock >= created_at + RETENTION_YEARS[retention_series] years (ERR_RETENTION_NOT_ELAPSED)"
        side_effects: []

      - from: EXEMPT
        to: DISPOSED
        trigger: "POST /records-requests/{rid}/documents/{id}/transition {to_status: DISPOSED}"
        actor: Clerk
        preconditions:
          - "current logical clock >= created_at + RETENTION_YEARS[retention_series] years (ERR_RETENTION_NOT_ELAPSED)"
        side_effects: []

      - from: EXEMPT
        to: REVIEWED
        trigger: "system cascade from Appeal REMANDED (via RecordsRequest reopen)"
        actor: system
        preconditions: []
        side_effects: []

      - from: IDENTIFIED
        to: CANCELLED
        trigger: "system cascade from RecordsRequest WITHDRAWN"
        actor: system
        preconditions: []
        side_effects: []

      - from: REVIEWED
        to: CANCELLED
        trigger: "system cascade from RecordsRequest WITHDRAWN"
        actor: system
        preconditions: []
        side_effects: []

      - from: RELEASED
        to: CANCELLED
        trigger: "system cascade from RecordsRequest WITHDRAWN"
        actor: system
        preconditions: []
        side_effects: []

  # ---- Appeal (branching, divergent side-effect sets per branch) ----
  - entity: Appeal
    initial_state: FILED
    terminal_states: [UPHELD, OVERTURNED, REMANDED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /records-requests/{rid}/appeals/{id}/transition {to_status: UNDER_REVIEW}"
        actor: AppealsOfficer
        preconditions:
          - "Acting AppealsOfficer (X-User-ID) != parent request.determined_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "decided_by_user_id = X-User-ID"

      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /records-requests/{rid}/appeals/{id}/transition {to_status: UPHELD}"
        actor: AppealsOfficer
        preconditions: []
        side_effects:
          - "decision=UPHELD; parent request unchanged (denial stands)"

      - from: UNDER_REVIEW
        to: OVERTURNED
        trigger: "POST /records-requests/{rid}/appeals/{id}/transition {to_status: OVERTURNED}"
        actor: AppealsOfficer
        preconditions: []
        side_effects:
          - "decision=OVERTURNED; parent request DENIED -> GRANTED (cross-entity cascade); assessed_fee recomputed"

      - from: UNDER_REVIEW
        to: REMANDED
        trigger: "POST /records-requests/{rid}/appeals/{id}/transition {to_status: REMANDED}"
        actor: AppealsOfficer
        preconditions: []
        side_effects:
          - "decision=REMANDED; parent request {DENIED, PARTIALLY_GRANTED} -> UNDER_REVIEW (reopen); its EXEMPT documents -> REVIEWED; determined_* cleared (depth-2 cascade, distinct branch)"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: determination-stale-request
    parent_entity: RecordsRequest
    write_endpoint: "POST /records-requests/{id}/determination"
    occ_field: "expected_records_request_version"
    description: |
      Issuing a determination against a RecordsRequest whose version has advanced
      since the officer last observed it is rejected. A determination snapshots the
      current responsive-document set to compute assessed_fee; adding or transitioning
      a ResponsiveDocument bumps RecordsRequest.version, so a determination carrying a
      version the officer read before that document mutation is stale and must be
      rejected rather than pricing an out-of-date document set.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: copy_fee
    trigger: "RecordsRequest intake (over estimated_page_count) and determination (over sum of billable_pages)"
    algorithm: tiered_pricing
    formula: |
      # Combinatorial mode (a): >=3 inputs, nested max/min, tier selection.
      billable = max(0, pages - FREE_PAGE_ALLOWANCE)          # pages at or below 50 -> 0 copy fee
      tier1_pages = min(billable, COPY_TIER1_LIMIT - FREE_PAGE_ALLOWANCE)   # up to 450 pages @ tier1
      tier2_pages = max(0, billable - (COPY_TIER1_LIMIT - FREE_PAGE_ALLOWANCE))
      copy_fee_cents = tier1_pages * COPY_TIER1_RATE_CENTS + tier2_pages * COPY_TIER2_RATE_CENTS
    input_set: "pages = estimated_page_count (intake) OR sum(ResponsiveDocument.page_count for docs whose status in {RELEASED, REDACTED}) (determination); EXEMPT/CANCELLED docs contribute 0"
    constants:
      FREE_PAGE_ALLOWANCE: 50
      COPY_TIER1_LIMIT: 500
      COPY_TIER1_RATE_CENTS: 15
      COPY_TIER2_RATE_CENTS: 10
    precision: "integer cents, exact"

  - name: labor_fee
    trigger: "RecordsRequest determination"
    algorithm: aggregation
    formula: |
      # Combinatorial mode (b): rounding order is pinned and observable.
      # Round EACH document's review_minutes UP to the next LABOR_INCREMENT_MINUTES,
      # THEN sum, THEN subtract the free allowance, THEN convert to hours and price.
      per_doc_billable = ceil(review_minutes / LABOR_INCREMENT_MINUTES) * LABOR_INCREMENT_MINUTES   # per document
      total_billable_minutes = sum(per_doc_billable for docs whose status in {RELEASED, REDACTED, EXEMPT})
      chargeable_minutes = max(0, total_billable_minutes - LABOR_FREE_MINUTES)
      labor_fee_cents = round_half_up(chargeable_minutes / 60 * LABOR_RATE_CENTS_PER_HOUR)
    input_set: "reviewed documents (RELEASED, REDACTED, EXEMPT); labor is billed even for withheld documents because review effort was expended"
    constants:
      LABOR_INCREMENT_MINUTES: 15
      LABOR_FREE_MINUTES: 30
      LABOR_RATE_CENTS_PER_HOUR: 2500
    precision: "integer cents, round_half_up"
    note: "Pinned order = round-per-document-then-sum. Sum-then-round would produce a different result and is WRONG."

  - name: estimated_fee
    trigger: "RecordsRequest creation"
    algorithm: forward_looking
    formula: |
      estimated_fee_cents = copy_fee(estimated_page_count)      # labor unknown at intake -> excluded
    input_set: "requester-declared estimated_page_count only"
    variants:
      - name: intake_estimate
        when: "at RecordsRequest creation"
        difference: "uses the requester's declared estimated_page_count; excludes labor entirely"
    precision: "integer cents"
    note: "Dual-variant pair with assessed_fee: same request, different algorithm and inputs, different result."

  - name: assessed_fee
    trigger: "RecordsRequest determination"
    algorithm: aggregation
    formula: |
      assessed_fee_cents = copy_fee(sum billable pages over RELEASED/REDACTED docs)
                         + labor_fee(reviewed docs)
      fee_balance_cents = assessed_fee_cents - amount_waived_cents - amount_paid_cents
    input_set: "actual ResponsiveDocuments discovered during review, filtered by status"
    variants:
      - name: final_assessment
        when: "at determination"
        difference: "uses actual document page_counts + labor; includes labor; excludes withheld/cancelled pages from copy fee"
    precision: "integer cents, round_half_up"

  - name: vote_tally
    trigger: "Motion close (OPEN -> CARRIED/FAILED); recomputed on every ballot cast"
    algorithm: weighted_scoring
    formula: |
      yea_count     = count(ballots where value == YEA)
      nay_count     = count(ballots where value == NAY)
      abstain_count = count(ballots where value == ABSTAIN)
      recused_count = count(ballots where value == RECUSED)
      ballot_count  = yea_count + nay_count + abstain_count + recused_count
      # Dual-variant passage rule keyed on Motion.vote_threshold:
      if vote_threshold == SIMPLE:
        outcome = CARRIED if yea_count > nay_count else FAILED       # abstain/recused excluded
      elif vote_threshold == ABSOLUTE:
        outcome = CARRIED if (yea_count * 2) > body.seat_count else FAILED   # majority of FULL body
    input_set: "ballots on the motion; body.seat_count for the ABSOLUTE variant"
    variants:
      - name: simple_majority
        when: "vote_threshold == SIMPLE"
        difference: "majority of votes cast (abstentions/recusals excluded)"
      - name: absolute_majority
        when: "vote_threshold == ABSOLUTE"
        difference: "majority of the full authorized membership (seat_count); abstentions effectively count against passage"
    precision: "integer counts"
    note: "Dual-variant on the governance domain (different entity from the fee dual-variant). Divergence appears with abstentions present."

  - name: notice_lead_hours
    trigger: "Meeting NOTICED transition; re-checked at IN_SESSION (convene)"
    algorithm: threshold
    formula: |
      notice_lead_hours = (scheduled_start - notice_posted_at) / 3600
      compliant = notice_lead_hours >= NOTICE_LEAD_HOURS[meeting_type]     # >= boundary (exactly the minimum passes)
    input_set: "meeting scheduled_start and notice_posted_at"
    constants:
      NOTICE_LEAD_HOURS_REGULAR: 72
      NOTICE_LEAD_HOURS_SPECIAL: 24
      NOTICE_LEAD_HOURS_EMERGENCY: 1
    precision: "hours as a real number; comparison is inclusive (>=)"

  - name: response_deadline
    trigger: "RecordsRequest creation"
    algorithm: chronological
    formula: |
      # Advance RESPONSE_DEADLINE_BUSINESS_DAYS business days (Mon-Fri, no holidays)
      # from the calendar date of submitted_at (submission day excluded), then pin the
      # instant to 23:59:59Z of the resulting date.
      d = date(submitted_at)
      remaining = RESPONSE_DEADLINE_BUSINESS_DAYS
      while remaining > 0:
        d = d + 1 day
        if weekday(d) in {Mon,Tue,Wed,Thu,Fri}: remaining -= 1
      response_deadline = d @ 23:59:59Z
    input_set: "submitted_at only"
    constants:
      RESPONSE_DEADLINE_BUSINESS_DAYS: 10
    precision: "whole seconds; pinned to 23:59:59Z"
    note: "No holiday calendar; weekends only. Example: submitted 2026-06-01T09:00:00Z (Mon) -> deadline 2026-06-15T23:59:59Z."

  - name: fee_ledger
    trigger: "determination, payment, waiver"
    algorithm: aggregation
    formula: |
      # Conservation identity (Rule 9 invariant #1, conserved quantity = owed money):
      # for a determined request, (amount_paid_cents + fee_balance_cents) is invariant
      # across payments and equals (assessed_fee_cents - amount_waived_cents).
      invariant: assessed_fee_cents == amount_waived_cents + amount_paid_cents + fee_balance_cents
    input_set: "the single RecordsRequest's fee fields"
    precision: "integer cents"

  - name: comment_cap
    trigger: "SpeakerSlip creation"
    algorithm: aggregation
    formula: |
      active_seconds = sum(allotted_seconds for slips on item whose status in {QUEUED, CALLED, SPOKEN})
      if active_seconds + new.allotted_seconds > ITEM_COMMENT_CAP_SECONDS: reject ERR_COMMENT_CAP_EXCEEDED
    input_set: "non-withdrawn/non-expired slips on the agenda item"
    constants:
      ITEM_COMMENT_CAP_SECONDS: 1800
    precision: "integer seconds; strict > triggers rejection"

  - name: meeting_interval_conflict
    trigger: "Meeting creation (POST /public-bodies/{id}/meetings)"
    algorithm: interval_merge
    formula: |
      # Two DISTINCT interval semantics on two different resources, evaluated in this order:
      # (1) Venue conflict — buffered, HALF-OPEN. Reject if the new meeting's venue occupancy
      #     overlaps any non-CANCELLED meeting sharing venue_id:
      #       occ(m) = [m.scheduled_start - SETUP_BUFFER_MINUTES, m.scheduled_end)   # end exclusive
      #       conflict iff occ(new).start < occ(other).end AND occ(other).start < occ(new).end
      #     -> ERR_VENUE_CONFLICT. (Back-to-back meetings still collide via the 30-min setup buffer.)
      # (2) Presiding conflict — UNBUFFERED, CLOSED. Reject if the new meeting shares
      #     presiding_member_id with any non-CANCELLED meeting whose CLOSED interval touches/overlaps:
      #       occ(m) = [m.scheduled_start, m.scheduled_end]    # both endpoints inclusive
      #       conflict iff occ(new).start <= occ(other).end AND occ(other).start <= occ(new).end
      #     -> ERR_PRESIDING_CONFLICT. (Adjacent meetings sharing only an endpoint DO collide.)
    input_set: "existing meetings of the same PublicBody in status != CANCELLED"
    constants:
      SETUP_BUFFER_MINUTES: 30
    precision: "minute-resolution timestamps; venue is half-open, presiding is closed"
    note: "Venue check runs before presiding check; both are business_constraint (priority 11)."

  - name: retention_and_appeal_windows
    trigger: "Document disposition (retention) and appeal filing (window)"
    algorithm: threshold
    formula: |
      # Retention: a document may be DISPOSED only once
      #   current_clock >= document.created_at + RETENTION_YEARS[retention_series] * 365 days
      #   else ERR_RETENTION_NOT_ELAPSED.
      # Appeal window: an appeal may be FILED only if
      #   current_clock <= request.determined_at + APPEAL_WINDOW_DAYS days
      #   else ERR_APPEAL_WINDOW_CLOSED.
    input_set: "single document (retention) or single request (appeal window)"
    constants:
      RETENTION_YEARS_PERMANENT: 9999
      RETENTION_YEARS_FISCAL: 7
      RETENTION_YEARS_ADMIN: 3
      RETENTION_YEARS_TRANSITORY: 1
      APPEAL_WINDOW_DAYS: 30
      DAYS_PER_YEAR: 365
    precision: "day-resolution; comparisons inclusive"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and valid (Anonymous permitted only where an endpoint lists it)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /requesters and public GET reads"

  - priority: 2
    category: auth
    check: "Acting role is permitted for the endpoint per the RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "Ownership: entity-backed Requester acting on a RecordsRequest/SpeakerSlip must own it (X-User-ID == requester_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "records-request withdraw/pay/appeal-file, speaker-slip withdraw"

  - priority: 4
    category: auth
    check: "Presiding gating: BodyMember convening/adjourning/opening items or motions must be the meeting's presiding_member_id"
    error_id: ERR_NOT_PRESIDING_OFFICER
    http_status: 403
    applies_to: "meeting convene/adjourn, agenda-item/motion/speaker-slip transitions, minutes approve"

  - priority: 5
    category: auth
    check: "Segregation of duties: AppealsOfficer reviewing an appeal must differ from the request's determined_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /records-requests/{id}/appeals/{id}/transition to UNDER_REVIEW"

  - priority: 6
    category: existence
    check: "All path-referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 7
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, numeric ranges honored, scheduled_end > scheduled_start, mover != seconder, waiver <= assessed"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all create/transition endpoints (specific: ERR_MOVER_SECONDER_SAME, ERR_WAIVER_EXCEEDS_FEE)"

  - priority: 8
    category: business_constraint
    check: "OCC: expected_records_request_version matches current RecordsRequest.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /records-requests/{id}/determination"

  - priority: 9
    category: state
    check: "Target resource is in a legal from-state for the requested transition (and cross-dimension/entity state guards)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints (specific: ERR_MEETING_NOT_IN_SESSION, ERR_DOCUMENT_REQUEST_NOT_UNDER_REVIEW, ERR_REQUEST_NOT_DENIED, ERR_OPEN_MOTIONS_EXIST, ERR_ITEM_NOT_ACTIONABLE, ERR_MEMBER_NOT_PRESENT, ERR_PUBLIC_COMMENT_DISABLED, ERR_SPEAKER_ALREADY_ACTIVE)"

  - priority: 10
    category: business_temporal
    check: "Temporal compliance gates: notice lead time, appeal window, retention elapsed"
    error_id: "ERR_NOTICE_NONCOMPLIANT | ERR_APPEAL_WINDOW_CLOSED | ERR_RETENTION_NOT_ELAPSED"
    http_status: 409
    applies_to: "meeting convene, appeal file, document dispose"

  - priority: 11
    category: business_constraint
    check: "Resource conflicts and quorum: venue overlap, presiding overlap, quorum count, comment cap"
    error_id: "ERR_VENUE_CONFLICT | ERR_PRESIDING_CONFLICT | ERR_QUORUM_NOT_MET | ERR_COMMENT_CAP_EXCEEDED"
    http_status: 409
    applies_to: "meeting create, meeting convene, speaker-slip create"

  - priority: 12
    category: business_fiscal
    check: "Fee obligations satisfied before closing a granted/partially-granted request"
    error_id: ERR_FEE_OUTSTANDING
    http_status: 409
    applies_to: "records-request close"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test-driving: logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock to an arbitrary ISO8601 UTC instant. Startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time. Governs notice lead time, response deadline, appeal window, and retention checks."
    roles: [Clerk]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced to the given instant"]

  # ---- PublicBody ----
  - method: POST
    path: "/public-bodies"
    description: "Create a governing body"
    roles: [Clerk]
    code: 201
    input: [name, jurisdiction_state, seat_count, quorum_size]
    output: PublicBody
    side_effects: []

  - method: GET
    path: "/public-bodies/{id}"
    description: "Read a governing body"
    roles: [Clerk, RecordsOfficer, AppealsOfficer, BodyMember, Requester]
    code: 200
    input: []
    output: PublicBody
    side_effects: []

  # ---- BodyMember ----
  - method: POST
    path: "/public-bodies/{id}/members"
    description: "Add a member (seat) to the body"
    roles: [Clerk]
    code: 201
    input: [full_name, seat_number]
    output: BodyMember
    side_effects: []

  - method: GET
    path: "/public-bodies/{id}/members"
    description: "List members of a body (reverse-reachability for BodyMember.body_id)"
    roles: [Clerk, RecordsOfficer, AppealsOfficer, BodyMember, Requester]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: BodyMember[]
    side_effects: []

  # ---- Venue ----
  - method: POST
    path: "/public-bodies/{id}/venues"
    description: "Register a venue for the body"
    roles: [Clerk]
    code: 201
    input: [name, "capacity?"]
    output: Venue
    side_effects: []

  - method: GET
    path: "/public-bodies/{id}/venues"
    description: "List venues of a body (reverse-reachability for Venue.body_id)"
    roles: [Clerk, RecordsOfficer, AppealsOfficer, BodyMember, Requester]
    code: 200
    input: ["limit?", "offset?"]
    output: Venue[]
    side_effects: []

  # ---- Meeting ----
  - method: POST
    path: "/public-bodies/{id}/meetings"
    description: "Schedule a meeting. Rejects on venue-occupancy overlap (buffered half-open) or presiding-member overlap (closed, touching-conflicts)."
    roles: [Clerk]
    code: 201
    input: [venue_id, presiding_member_id, title, meeting_type, scheduled_start, scheduled_end]
    output: Meeting
    side_effects: ["status=SCHEDULED, minutes_status=NONE"]

  - method: GET
    path: "/meetings/{id}"
    description: "Read a meeting"
    roles: [Clerk, RecordsOfficer, AppealsOfficer, BodyMember, Requester, Anonymous]
    code: 200
    input: []
    output: Meeting
    side_effects: []

  - method: GET
    path: "/public-bodies/{id}/meetings"
    description: "List meetings of a body (reverse-reachability for Meeting.body_id)"
    roles: [Clerk, RecordsOfficer, AppealsOfficer, BodyMember, Requester, Anonymous]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Meeting[]
    side_effects: []

  - method: POST
    path: "/meetings/{id}/transition"
    description: "Advance the meeting lifecycle dimension (NOTICED/IN_SESSION/ADJOURNED/CANCELLED)."
    roles: [Clerk, BodyMember]
    code: 200
    input: [to_status, "notice_channel?", "present_member_ids?"]
    output: Meeting
    side_effects: ["notice posting, convene, adjourn cascade, or cancel cascade per state machine"]

  - method: POST
    path: "/meetings/{id}/minutes"
    description: "Advance the meeting minutes dimension (DRAFT/APPROVED/AMENDED)."
    roles: [Clerk, BodyMember]
    code: 200
    input: [to_status, "minutes_text?"]
    output: Meeting
    side_effects: ["minutes_status per minutes state machine"]

  # ---- AgendaItem ----
  - method: POST
    path: "/meetings/{id}/agenda-items"
    description: "Add an agenda item (packet)"
    roles: [Clerk]
    code: 201
    input: [title, sequence, "item_type?", "public_comment_enabled?"]
    output: AgendaItem
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/agenda-items/{id}"
    description: "Read an agenda item"
    roles: [Clerk, RecordsOfficer, AppealsOfficer, BodyMember, Requester, Anonymous]
    code: 200
    input: []
    output: AgendaItem
    side_effects: []

  - method: GET
    path: "/meetings/{id}/agenda-items"
    description: "List agenda items of a meeting (reverse-reachability for AgendaItem.meeting_id)"
    roles: [Clerk, RecordsOfficer, AppealsOfficer, BodyMember, Requester, Anonymous]
    code: 200
    input: ["limit?", "offset?"]
    output: AgendaItem[]
    side_effects: []

  - method: POST
    path: "/agenda-items/{id}/transition"
    description: "Open/close an agenda item (presiding officer)."
    roles: [BodyMember]
    code: 200
    input: [to_status]
    output: AgendaItem
    side_effects: ["close cascade expires queued speakers"]

  # ---- SpeakerSlip ----
  - method: POST
    path: "/agenda-items/{id}/speaker-slips"
    description: "Public sign-up to speak on an item; assigns queue position by created_at."
    roles: [Requester]
    code: 201
    input: [requester_id, speaker_name, "allotted_seconds?"]
    output: SpeakerSlip
    side_effects: ["status=QUEUED, position computed, comment-cap checked"]

  - method: GET
    path: "/agenda-items/{id}/speaker-slips"
    description: "List speaker slips on an item, queue order (reverse-reachability for SpeakerSlip.agenda_item_id)"
    roles: [Clerk, BodyMember, Requester, Anonymous]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: SpeakerSlip[]
    side_effects: []

  - method: POST
    path: "/speaker-slips/{id}/transition"
    description: "Call/mark-spoken/yield (presiding) or withdraw (owner)."
    roles: [BodyMember, Requester]
    code: 200
    input: [to_status]
    output: SpeakerSlip
    side_effects: ["called_at set on CALLED"]

  # ---- Motion ----
  - method: POST
    path: "/agenda-items/{id}/motions"
    description: "Move a motion on an ACTION item (mover + distinct seconder, both present)."
    roles: [BodyMember]
    code: 201
    input: [text, moved_by_member_id, seconded_by_member_id, "vote_threshold?"]
    output: Motion
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/agenda-items/{id}/motions"
    description: "List motions on an item (reverse-reachability for Motion.agenda_item_id)"
    roles: [Clerk, RecordsOfficer, AppealsOfficer, BodyMember, Requester, Anonymous]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Motion[]
    side_effects: []

  - method: POST
    path: "/motions/{id}/transition"
    description: "Open/close(->CARRIED|FAILED)/table/reconsider a motion (presiding)."
    roles: [BodyMember]
    code: 200
    input: [to_status]
    output: Motion
    side_effects: ["tally computed on close"]

  - method: POST
    path: "/motions/{id}/votes"
    description: "Cast or re-cast (upsert) a roll-call ballot; recomputes tally. One ballot per member."
    roles: [BodyMember]
    code: 200
    input: [member_id, value]
    output: Motion
    side_effects: ["ballots upserted; yea/nay/abstain/recused/ballot counts recomputed"]

  # ---- Requester ----
  - method: POST
    path: "/requesters"
    description: "Self-register as a member of the public"
    roles: [Anonymous]
    code: 201
    input: [full_name, email, "organization?"]
    output: Requester
    side_effects: []

  # ---- RecordsRequest ----
  - method: POST
    path: "/records-requests"
    description: "Submit a records (FOIA/state) request; computes response_deadline and estimated_fee."
    roles: [Requester]
    code: 201
    input: [requester_id, body_id, subject, description, estimated_page_count]
    output: RecordsRequest
    side_effects: ["submitted_at=clock, response_deadline computed, estimated_fee_cents computed, status=RECEIVED"]

  - method: GET
    path: "/records-requests/{id}"
    description: "Read a records request (fee ledger, deadline, decision, version)"
    roles: [Clerk, RecordsOfficer, AppealsOfficer, Requester]
    code: 200
    input: []
    output: RecordsRequest
    side_effects: []

  - method: GET
    path: "/records-requests"
    description: "List records requests, optionally filtered by requester_id (reverse-reachability for RecordsRequest.requester_id) or body_id"
    roles: [Clerk, RecordsOfficer, AppealsOfficer, Requester]
    code: 200
    input: ["requester_id?", "body_id?", "status?", "limit?", "offset?"]
    output: RecordsRequest[]
    side_effects: []

  - method: POST
    path: "/records-requests/{id}/transition"
    description: "Move request lifecycle (UNDER_REVIEW / CLOSED / WITHDRAWN)."
    roles: [RecordsOfficer, Requester]
    code: 200
    input: [to_status]
    output: RecordsRequest
    side_effects: ["withdraw cascade cancels documents & reverses fee; close checks fee_balance"]

  - method: POST
    path: "/records-requests/{id}/determination"
    description: "Issue a determination (GRANTED/PARTIALLY_GRANTED/DENIED). OCC-guarded on the request version; computes assessed_fee and applies waiver."
    roles: [RecordsOfficer]
    code: 200
    input: [decision, expected_records_request_version, "waive_fee_cents?"]
    output: RecordsRequest
    side_effects: ["assessed_fee computed, amount_waived set, fee_balance computed, determined_by_user_id/determined_at set, version incremented by 1"]

  - method: POST
    path: "/records-requests/{id}/payments"
    description: "Record a fee payment against the request; reduces fee_balance."
    roles: [Requester]
    code: 200
    input: [amount_cents]
    output: RecordsRequest
    side_effects: ["amount_paid_cents += amount_cents; fee_balance recomputed"]

  # ---- ResponsiveDocument ----
  - method: POST
    path: "/records-requests/{id}/documents"
    description: "Attach a responsive document (page_count, review_minutes, exemption, retention series). Bumps the parent request version (OCC-relevant)."
    roles: [RecordsOfficer]
    code: 201
    input: [title, page_count, review_minutes, "exemption_code?", "retention_series?"]
    output: ResponsiveDocument
    side_effects: ["status=IDENTIFIED; parent RecordsRequest.version incremented by 1"]

  - method: GET
    path: "/records-requests/{id}/documents"
    description: "List responsive documents of a request (reverse-reachability for ResponsiveDocument.request_id)"
    roles: [Clerk, RecordsOfficer, AppealsOfficer, Requester]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: ResponsiveDocument[]
    side_effects: []

  - method: POST
    path: "/records-requests/{rid}/documents/{id}/transition"
    description: "Advance a document (REVIEWED/RELEASED/REDACTED/EXEMPT/DISPOSED)."
    roles: [RecordsOfficer, Clerk]
    code: 200
    input: [to_status]
    output: ResponsiveDocument
    side_effects: ["billable_pages recomputed; DISPOSED requires retention elapsed"]

  # ---- Appeal ----
  - method: POST
    path: "/records-requests/{id}/appeals"
    description: "File an appeal of a DENIED/PARTIALLY_GRANTED determination within the appeal window."
    roles: [Requester]
    code: 201
    input: [grounds]
    output: Appeal
    side_effects: ["filed_at=clock, status=FILED"]

  - method: GET
    path: "/records-requests/{id}/appeals"
    description: "List appeals of a request (reverse-reachability for Appeal.request_id)"
    roles: [Clerk, RecordsOfficer, AppealsOfficer, Requester]
    code: 200
    input: ["limit?", "offset?"]
    output: Appeal[]
    side_effects: []

  - method: POST
    path: "/records-requests/{rid}/appeals/{id}/transition"
    description: "Decide an appeal (UNDER_REVIEW/UPHELD/OVERTURNED/REMANDED). SoD enforced at UNDER_REVIEW."
    roles: [AppealsOfficer]
    code: 200
    input: [to_status]
    output: Appeal
    side_effects: ["OVERTURNED->request GRANTED; REMANDED->request reopened & EXEMPT docs re-reviewed"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid auth headers on a protected endpoint" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role not permitted for the operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Requester acting on a request/slip they do not own" }
  - { id: ERR_NOT_PRESIDING_OFFICER, http: 403, condition: "BodyMember action requires the meeting's presiding_member_id" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "AppealsOfficer reviewing an appeal equals the request's determined_by_user_id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path-referenced resource does not exist (validated left-to-right)" }
  - { id: ERR_VALIDATION, http: 422, condition: "Malformed body: missing required field, bad enum, out-of-range number, scheduled_end<=start" }
  - { id: ERR_MOVER_SECONDER_SAME, http: 422, condition: "Motion mover and seconder are the same member" }
  - { id: ERR_WAIVER_EXCEEDS_FEE, http: 422, condition: "waive_fee_cents exceeds computed assessed_fee_cents" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_records_request_version does not match current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not legal from the current state" }
  - { id: ERR_MEETING_NOT_IN_SESSION, http: 409, condition: "Agenda-item/motion action requires parent Meeting.status==IN_SESSION" }
  - { id: ERR_OPEN_MOTIONS_EXIST, http: 409, condition: "Adjourn/close blocked by a Motion still OPEN" }
  - { id: ERR_ITEM_NOT_ACTIONABLE, http: 409, condition: "Motion moved on a non-ACTION agenda item" }
  - { id: ERR_MEMBER_NOT_PRESENT, http: 409, condition: "Mover/seconder/voter is not in the meeting's present_member_ids" }
  - { id: ERR_PUBLIC_COMMENT_DISABLED, http: 409, condition: "Speaker sign-up on an item with public_comment_enabled=false" }
  - { id: ERR_SPEAKER_ALREADY_ACTIVE, http: 409, condition: "Calling a speaker while another slip on the item is CALLED" }
  - { id: ERR_COMMENT_CAP_EXCEEDED, http: 409, condition: "Speaker sign-up would exceed ITEM_COMMENT_CAP_SECONDS" }
  - { id: ERR_DOCUMENT_REQUEST_NOT_UNDER_REVIEW, http: 409, condition: "Document review/creation requires parent request UNDER_REVIEW" }
  - { id: ERR_REQUEST_NOT_DENIED, http: 409, condition: "Appeal filed on a request not in DENIED/PARTIALLY_GRANTED" }
  - { id: ERR_NOTICE_NONCOMPLIANT, http: 409, condition: "notice_lead_hours below the statutory minimum for the meeting_type" }
  - { id: ERR_QUORUM_NOT_MET, http: 409, condition: "Fewer present members than body.quorum_size at convene" }
  - { id: ERR_VENUE_CONFLICT, http: 409, condition: "Meeting overlaps another meeting's buffered occupancy of the same venue" }
  - { id: ERR_PRESIDING_CONFLICT, http: 409, condition: "Presiding member already presides an overlapping (closed-interval) meeting" }
  - { id: ERR_APPEAL_WINDOW_CLOSED, http: 409, condition: "Appeal filed after determined_at + APPEAL_WINDOW_DAYS" }
  - { id: ERR_RETENTION_NOT_ELAPSED, http: 409, condition: "Document disposition before its retention period has elapsed" }
  - { id: ERR_FEE_OUTSTANDING, http: 409, condition: "Closing a granted request with fee_balance_cents > 0" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Clerk
    description: "Government clerk: schedules/notices/cancels meetings, publishes agenda packets, drafts/amends minutes, disposes records per retention. Operational identity tracked for audit."
    identity: opaque
    exclusive_operations:
      - "POST /public-bodies, /public-bodies/{id}/members, /public-bodies/{id}/venues"
      - "POST /public-bodies/{id}/meetings"
      - "POST /meetings/{id}/transition (NOTICED, CANCELLED)"
      - "POST /meetings/{id}/minutes (DRAFT, AMENDED)"
      - "POST /meetings/{id}/agenda-items"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /records-requests/{rid}/documents/{id}/transition (DISPOSED) — shared with RecordsOfficer"
      - "GET reads"

  - name: BodyMember
    description: "Elected member of the body. Casts ballots and moves/seconds motions. When acting as the meeting's presiding_member_id, convenes/adjourns, opens/closes items, calls speakers, opens/closes motions, approves minutes."
    identity: "entity_backed:BodyMember"
    exclusive_operations:
      - "POST /meetings/{id}/transition (IN_SESSION, ADJOURNED) — presiding only"
      - "POST /agenda-items/{id}/transition — presiding only"
      - "POST /motions/{id}/transition — presiding only"
      - "POST /agenda-items/{id}/motions"
      - "POST /motions/{id}/votes"
      - "POST /meetings/{id}/minutes (APPROVED) — presiding only"
    shared_operations:
      - "POST /speaker-slips/{id}/transition (CALLED/SPOKEN/YIELDED) — presiding; WITHDRAWN shared with Requester"
      - "GET reads"

  - name: RecordsOfficer
    description: "Records custodian: reviews requests, attaches responsive documents, redacts/exempts, issues determinations and assesses fees. Operational identity tracked for SoD (bars deciding the appeal of one's own determination)."
    identity: opaque
    exclusive_operations:
      - "POST /records-requests/{id}/transition (UNDER_REVIEW, CLOSED)"
      - "POST /records-requests/{id}/determination"
      - "POST /records-requests/{id}/documents"
      - "POST /records-requests/{rid}/documents/{id}/transition (REVIEWED/RELEASED/REDACTED/EXEMPT)"
    shared_operations:
      - "POST /records-requests/{rid}/documents/{id}/transition (DISPOSED) — shared with Clerk"
      - "GET reads"

  - name: AppealsOfficer
    description: "Independent reviewer of records-request appeals. Barred by SoD from reviewing an appeal of a determination they issued as RecordsOfficer."
    identity: opaque
    exclusive_operations:
      - "POST /records-requests/{rid}/appeals/{id}/transition"
    shared_operations:
      - "GET reads"

  - name: Requester
    description: "Member of the public. Submits records requests, pays fees, files appeals, withdraws own requests, signs up to speak and withdraws own slips."
    identity: "entity_backed:Requester"
    exclusive_operations:
      - "POST /records-requests"
      - "POST /records-requests/{id}/payments"
      - "POST /records-requests/{id}/appeals"
      - "POST /agenda-items/{id}/speaker-slips"
    shared_operations:
      - "POST /records-requests/{id}/transition (WITHDRAWN) — own request"
      - "POST /speaker-slips/{id}/transition (WITHDRAWN) — own slip"
      - "GET reads"

  - name: Anonymous
    description: "Unauthenticated public. May self-register as a Requester and read public meeting/agenda/motion/speaker information."
    identity: opaque
    exclusive_operations:
      - "POST /requesters"
    shared_operations:
      - "GET public reads (meetings, agenda-items, motions, speaker-slips)"
