          - entities.CoverageAssignment.fields.supersedes_assignment_id
          - concurrency_rules[coverage-assignment-create-stale-distributor]
        distinguishing_aspect: "Creating an assignment on a cell with a live PROPOSED proposal supersedes that proposal (even another distributor's): the old one reads SUPERSEDED and the new one records supersedes_assignment_id pointing at it."
        test_recipe:
          setup:
