              payload: { test_type: "NTE", lab_code: "LAB-5", scheduled_start: "2026-10-05T00:00:00Z", scheduled_end: "2026-10-07T00:00:00Z" }
              as: CertificationEngineer
              captures: { run_a_id: $.data.id }
            - call: "POST /emissions/engine-families/${fam_id}/test-runs"
              payload: { test_type: "NTE", lab_code: "LAB-5", scheduled_start: "2026-10-07T00:00:00Z", scheduled_end: "2026-10-09T00:00:00Z" }
              as: CertificationEngineer
              captures: { run_b_id: $.data.id }
          trigger:
            - call: "POST /emissions/test-runs/${run_a_id}/record-results"
              payload: { measured_nox_g_per_bhp_hr: 0.35, measured_pm_g_per_bhp_hr: 0.009, deterioration_factor: 1.0 }
              as: CertificationEngineer
              captures: { res_a: $.data.result, adj_nox_a: $.data.adjusted_nox_g_per_bhp_hr }
            - call: "POST /emissions/test-runs/${run_b_id}/record-results"
              payload: { measured_nox_g_per_bhp_hr: 0.30, measured_pm_g_per_bhp_hr: 0.0092, deterioration_factor: 1.1 }
              as: CertificationEngineer
              captures: { res_b: $.data.result, adj_pm_b: $.data.adjusted_pm_g_per_bhp_hr }
          assert:
            - "run A: adjusted_nox == 0.35 (0.35 x 1.0 at 4dp) equals the limit and PASSES via ${adj_nox_a}/${res_a} — equality is inclusive"
            - "run B: adjusted_nox == 0.33 passes but adjusted_pm == 0.0101 (round_half_up(0.0092 x 1.1, 4)) exceeds 0.01 via ${adj_pm_b}, so result == FAIL via ${res_b}"

