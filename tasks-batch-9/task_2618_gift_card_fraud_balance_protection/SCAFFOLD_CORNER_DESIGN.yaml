              as: PosAssociate
              captures: { ir_id: $.data.id }
            - call: "POST /issuance-requests/${ir_id}/screen"
              payload: {}
              as: PosAssociate
            - call: "GET /gift-cards/${card_id}"
              payload: {}
              as: RiskManager
              as_user_id: "risk-47"
              captures: { cv1: $.data.version }
            - call: "POST /gift-cards/${card_id}/redemption-holds"
              payload: { amount_cents: 4000, hold_start: "2026-08-01T00:00:00Z", hold_expires_at: "2026-08-01T06:00:00Z", expected_gift_card_version: "${cv1}" }
              as: PosAssociate
              captures: { hold_id: $.data.id, h_state0: $.data.state }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T07:00:00Z" }
              as: PlatformAdmin
              captures: { now2: $.data.current_utc, expired_n: $.data.expired_hold_count }
            - call: "GET /gift-cards/${card_id}"
              payload: {}
              as: RiskManager
