            - "ProcedureCode.${c3_id}: is_bundled == false, reduction_factor_pct == 25, allowed_cents == 22513 (IMAGING survives bundling only because of M59; 90050 * 1.00 * 0.25 = 22512.5 rounds half-up to 22513)"
            - "ProcedureCode.${c4_id}: is_bundled == false, reduction_factor_pct == 25, allowed_cents == 5635 (45076 * 0.50 * 0.25 = 5634.5 rounds half-up to 5635)"
            - "Procedure.${proc_id}.allowed_amount_cents == 328148"
            - "Procedure.${proc_id}.allowed_amount_cents != 328147, which is what summing the unrounded products 300000 + 0 + 22512.5 + 5634.5 and rounding once would give"
            - "Procedure.${proc_id}.reimbursement_variant == BUNDLED_ESRD"
            - "Procedure.${proc_id}.clinical_status == ABORTED and coding_status == CODED (the two dimensions advance independently)"
            - "GET /procedures/${proc_id}/codes returns the four lines ordered by rank ASC with total_count 4"

      - name: partnership_score_breaks_its_own_cycle_by_reading_the_previously_persisted_tier
        grounds:
          - calculations.facility_partnership_score
          - entities.DialysisFacility.fields.partnership_tier
          - entities.DialysisFacility.fields.grace_credit_window
          - entities.DialysisFacility.fields.contract_status
          - state_machines.DialysisFacility.ACTIVE_to_PROBATION
        distinguishing_aspect: |
          The score formula is genuinely circular - grace_credit depends on the tier, the tier
          depends on the score, the score depends on grace_credit - and the scaffold breaks it by
          reading tier_at_eval as PERSISTED BEFORE the write. With 5 in-window referrals, a raw
          missed count of 13 and a stored tier of GOLD, the pinned order gives grace 1, adjusted
          12, score 52, tier WATCH and contract PROBATION; an implementation that re-reads the
          tier it just wrote (WATCH, grace rate 0.00) gets grace 0, adjusted 13, score 48 and
          SUSPENDED, which additionally cancels procedures. The one call therefore separates the
          two evaluation orders by both a score and a posture.
        test_recipe:
          setup:
            - "one facility that reaches the GOLD tier by accumulating 5 clean referrals (each missed_treatment_count 0, so every intermediate score is 100)"
            - "all 5 referrals left SUBMITTED and un-triaged, so same_day_honored_window and same_day_referral_count are both 0"
            - "logical clock left at its 2026-08-01T00:00:00Z default so all 5 referrals sit inside the closed 90-day window"
          setup_api_calls:
            - call: "POST /dialysis-facilities"
              payload: { name: "Eastmere Dialysis", facility_code: "EMR-01" }
              as: CenterAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0004", full_name: "Dee Okafor", dialysis_facility_id: "${fac_id}", dialysis_modality: "IN_CENTER_HD", payer_program: "FEE_FOR_SERVICE" }
              as: CenterAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /vascular-accesses"
              payload: { patient_id: "${pat_id}", access_type: "AVG", laterality: "LEFT", site: "FOREARM", placed_on: "2026-05-01" }
              as: AccessCoordinator
              captures: { acc_id: $.data.id }
            - call: "POST /vascular-accesses/${acc_id}/status"
              payload: { to_status: "PLACED" }
              as: AccessCoordinator
            - call: "POST /vascular-accesses/${acc_id}/status"
              payload: { to_status: "MATURING" }
              as: AccessCoordinator
            - call: "POST /vascular-accesses/${acc_id}/status"
              payload: { to_status: "IN_USE" }
              as: AccessCoordinator
            - call: "POST /referrals"
              payload: { access_id: "${acc_id}", referring_facility_id: "${fac_id}", suspected_problem: "STENOSIS", clinical_narrative: "clean referral one", missed_treatment_count: 0 }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /referrals"
              payload: { access_id: "${acc_id}", referring_facility_id: "${fac_id}", suspected_problem: "STENOSIS", clinical_narrative: "clean referral two", missed_treatment_count: 0 }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
              captures: { r2_id: $.data.id }
            - call: "POST /referrals"
              payload: { access_id: "${acc_id}", referring_facility_id: "${fac_id}", suspected_problem: "STENOSIS", clinical_narrative: "clean referral three", missed_treatment_count: 0 }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
              captures: { r3_id: $.data.id }
            - call: "POST /referrals"
              payload: { access_id: "${acc_id}", referring_facility_id: "${fac_id}", suspected_problem: "STENOSIS", clinical_narrative: "clean referral four", missed_treatment_count: 0 }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
              captures: { r4_id: $.data.id }
            - call: "POST /referrals"
              payload: { access_id: "${acc_id}", referring_facility_id: "${fac_id}", suspected_problem: "STENOSIS", clinical_narrative: "clean referral five", missed_treatment_count: 0 }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
              captures: { r5_id: $.data.id }
          trigger:
            - call: "POST /referrals/${r5_id}/missed-treatments"
              payload: { missed_treatment_count: 13 }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
          assert:
            - "before the trigger DialysisFacility.${fac_id}.partnership_score == 100 and partnership_tier == GOLD (the very first evaluation ran against the seeded SILVER tier, grace floor(1 * 0.10) == 0)"
            - "DialysisFacility.${fac_id}.referral_volume_window == 5"
            - "DialysisFacility.${fac_id}.raw_missed_count_window == 13"
            - "DialysisFacility.${fac_id}.grace_credit_window == 1 (floor(5 * 0.20) using the persisted GOLD rate, not the freshly derived WATCH rate)"
            - "DialysisFacility.${fac_id}.adjusted_missed_count_window == 12"
            - "DialysisFacility.${fac_id}.same_day_honored_window == 0"
            - "DialysisFacility.${fac_id}.partnership_score == 52"
            - "DialysisFacility.${fac_id}.partnership_tier == WATCH"
            - "DialysisFacility.${fac_id}.contract_status == PROBATION"
            - "the score is NOT 48 and the posture is NOT SUSPENDED, which is what re-reading the just-written WATCH tier (grace rate 0.00, grace 0, adjusted 13) would produce"
            - "all five referrals ${r1_id}..${r5_id} are INFO_REQUESTED with hold_reason == FACILITY_POSTURE_HOLD and info_request_count == 1 (the ACTIVE -> PROBATION cascade holds SUBMITTED and TRIAGED referrals)"
            - "GET /dialysis-facilities/${fac_id}/partnership-metrics reports missed_treatments_per_referral_x100 == 260 and same_day_honor_rate_pct == 0"
            - "the score is computed in a single pass: the five referrals moving to INFO_REQUESTED do not re-trigger the calculation, so referral_volume_window stays 5"

  - rule_id: non_linear_state_machine
    instances:
      - name: referral_revision_loop_traversed_twice_then_locked_out_after_triage
        grounds:
          - state_machines.Referral.SUBMITTED_to_INFO_REQUESTED
          - state_machines.Referral.INFO_REQUESTED_to_SUBMITTED
          - entities.Referral.fields.info_request_count
          - entities.Referral.fields.hold_reason
          - errors.ERR_REFERRAL_STATE_INVALID
        distinguishing_aspect: |
          The SUBMITTED <-> INFO_REQUESTED revision loop is walked twice in one test, and the loop
          is countable in exactly one direction: info_request_count reaches 2 while the resubmit
          leg never decrements it. Each resubmit also wipes triage_score, triage_variant, urgency
          and triaged_at, so the second lap re-triages from scratch against a DIFFERENT
          missed_treatment_count (1 -> 3 -> 0) and lands on 73/SAME_DAY rather than the 79 the
          original submission would have produced. The loop is not re-enterable from TRIAGED:
          request-info there is a 409, so only the system posture cascade can hold a triaged
          referral.
        test_recipe:
          setup:
            - "one facility, one patient, one IN_USE AVG access with two in-window readings (2026-07-20 flow 1000, 2026-07-28 flow 700 / VP 160 / recirc 12.0)"
            - "one SUBMITTED referral with missed_treatment_count 1"
          setup_api_calls:
            - call: "POST /dialysis-facilities"
              payload: { name: "Riverbend Dialysis", facility_code: "RVB-01" }
              as: CenterAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0005", full_name: "Eli Navarro", dialysis_facility_id: "${fac_id}", dialysis_modality: "IN_CENTER_HD", payer_program: "FEE_FOR_SERVICE" }
              as: CenterAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /vascular-accesses"
              payload: { patient_id: "${pat_id}", access_type: "AVG", laterality: "LEFT", site: "FOREARM", placed_on: "2026-05-01" }
              as: AccessCoordinator
              captures: { acc_id: $.data.id }
            - call: "POST /vascular-accesses/${acc_id}/status"
              payload: { to_status: "PLACED" }
              as: AccessCoordinator
            - call: "POST /vascular-accesses/${acc_id}/status"
              payload: { to_status: "MATURING" }
              as: AccessCoordinator
            - call: "POST /vascular-accesses/${acc_id}/status"
              payload: { to_status: "IN_USE" }
              as: AccessCoordinator
            - call: "POST /surveillance-readings"
              payload: { access_id: "${acc_id}", reported_by_facility_id: "${fac_id}", reading_at: "2026-07-20T08:00:00Z", access_flow_ml_min: 1000, venous_pressure_mmhg: 120, recirculation_pct: 4.0, kind: "ROUTINE" }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
            - call: "POST /surveillance-readings"
              payload: { access_id: "${acc_id}", reported_by_facility_id: "${fac_id}", reading_at: "2026-07-28T08:00:00Z", access_flow_ml_min: 700, venous_pressure_mmhg: 160, recirculation_pct: 12.0, kind: "URGENT" }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
            - call: "POST /referrals"
              payload: { access_id: "${acc_id}", referring_facility_id: "${fac_id}", suspected_problem: "STENOSIS", clinical_narrative: "original submission", missed_treatment_count: 1 }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
              captures: { ref_id: $.data.id }
          trigger:
            - call: "POST /referrals/${ref_id}/request-info"
              payload: { info_request_note: "need the last three flow trends" }
              as: AccessCoordinator
            - call: "POST /referrals/${ref_id}/resubmit"
              payload: { clinical_narrative: "revised A", missed_treatment_count: 3 }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
            - call: "POST /referrals/${ref_id}/request-info"
              payload: { info_request_note: "missed treatment tally looks wrong" }
              as: AccessCoordinator
            - call: "POST /referrals/${ref_id}/resubmit"
              payload: { clinical_narrative: "revised B", missed_treatment_count: 0 }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
            - call: "POST /referrals/${ref_id}/triage"
              payload: {}
              as: AccessCoordinator
            - call: "POST /referrals/${ref_id}/request-info"
              payload: { info_request_note: "third lap attempt" }
              as: AccessCoordinator
          assert:
            - "after the first request-info: Referral.${ref_id}.status == INFO_REQUESTED, hold_reason == COORDINATOR_REQUEST, info_request_count == 1"
            - "after the first resubmit: status == SUBMITTED, hold_reason == null, clinical_narrative == 'revised A', missed_treatment_count == 3, info_request_count still 1"
            - "after the second request-info: info_request_count == 2"
            - "after the second resubmit: status == SUBMITTED, clinical_narrative == 'revised B', missed_treatment_count == 0, info_request_count == 2 (never decremented by the resubmit leg)"
            - "the resubmit legs leave triage_score, triage_variant, urgency and triaged_at all null"
            - "after the triage: status == TRIAGED, triage_variant == TREND_BASED, triage_score == 73, urgency == SAME_DAY, triaged_at == 2026-08-01T00:00:00Z"
            - "the score is 73 and not 79: the second resubmit dropped missed_treatment_count to 0, removing the 6 missed points from the otherwise identical 36 + 12 + 15 + 10 reading contribution"
            - "the third request-info returns 409 ERR_REFERRAL_STATE_INVALID and leaves info_request_count at 2 and status at TRIAGED"
            - "VascularAccess.${acc_id}.status == DYSFUNCTIONAL (the triage side effect fired once, on the successful lap)"
            - "DialysisFacility.${fac_id}.partnership_score == 100 and raw_missed_count_window == 0, because the triage rescore reads the resubmitted count of 0"

      - name: procedure_clinical_aborted_while_coding_dimension_walks_all_the_way_to_billed
        grounds:
          - state_machines.Procedure.clinical_status.IN_ROOM_to_ABORTED
          - state_machines.Procedure.coding_status.UNCODED_to_CODED
          - state_machines.Procedure.coding_status.CODED_to_ATTESTED
          - state_machines.Procedure.coding_status.ATTESTED_to_BILLED
          - entities.DeviceUsage.fields.wasted_quantity
          - entities.VascularAccess.fields.angioplasty_count
        distinguishing_aspect: |
          Procedure carries two independent state dimensions. This instance drives clinical_status
          into the ABORTED terminal and then walks coding_status UNCODED -> CODED -> ATTESTED ->
          BILLED on the SAME row, proving the dimensions are not coupled: a terminal clinical
          state does not freeze coding. It also isolates the ABORTED branch's divergence from
          DISCHARGED - the abort shares only hop 1 (device consumption, here with
          wasted_quantity == quantity) and fires none of hops 2-5, so the referral stays SCHEDULED,
          the access stays DYSFUNCTIONAL and angioplasty_count stays 0 even though the procedure
          bills 180050 cents.
        test_recipe:
          setup:
            - "one FEE_FOR_SERVICE patient, one IN_USE AVG access with one 2026-07-28 reading, one ROUTINE referral (score 0)"
            - "one BALLOON lot of 10 units with 2 units reserved on the procedure before it starts"
            - "the procedure taken to IN_ROOM at 13:00 on 2026-08-01"
