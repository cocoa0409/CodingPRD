  # ===========================================================================
  # RULE 9 — compensating_invariant
  # Two instances over DIFFERENT conserved quantities:
  #   9.1  the append-only money ledger: Lease.allotment_balance_cents must equal
  #        the running sum of its AllotmentTransaction rows, and voiding a hazard
  #        must return it to the pre-abatement value with zero drift
  #   9.2  the unit inventory: Installation's five status counters must always
  #        sum to total_unit_count across HAZARD_HOLD / OFFLINE_MAINTENANCE
  #        placement and release
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: hazard_void_restores_allotment_ledger_without_drift
        grounds:
          - calculations.allotment_ledger_conservation
          - calculations.hazard_abatement_posting
          - state_machines.HazardCase.DISPLACEMENT_ACTIVE_to_VOIDED
          - entities.Lease.fields.allotment_balance_cents
          - entities.Lease.fields.abatement_total_cents
          - endpoints.POST_/hazard-cases/{id}/void
        distinguishing_aspect: |
          The conserved quantity is MONEY in the append-only allotment ledger:
          allotment_balance_cents must always equal the running sum of the
          lease's AllotmentTransaction rows, so the void may not edit or delete
          the -78892 ABATEMENT row — it must append an equal and opposite
          ARREARS_ADJUSTMENT of +78892, returning the balance to exactly 218150
          (the pre-abatement value) and abatement_total_cents to exactly 0, with
          the reversed row still visible in history. The zero-night lodging
          closure the void performs must also leave the ReinvestmentAccount's
          money untouched. Instance 9.2 conserves a unit count, not money.
        test_recipe:
          setup:
            - "One installation with one 2-bedroom TOWNHOME unit; lease 1 is OCCUPIED / ACTIVE from 2026-09-01 with net_rent_cents 218150 and daily_rent_cents 7172."
            - "A ReinvestmentAccount exists for fiscal_year 2026 with opening_balance_cents 5000000, occupancy_basis UNIT_DAY_WEIGHTED, expenditures_cents 0 and closing_balance_cents 5000000."
            - "The clock stands at 2026-09-20T10:00:00Z and the 2026-09 allotment run has posted a CHARGE of 218150, so allotment_balance_cents is 218150 and abatement_total_cents is 0 — this is the value the void must restore."
            - "A MOLD HazardCase assessed at 45 affected_area_sqft with a child under six has driven the unit into HAZARD_HOLD, suspended the allotment and posted the -78892 ABATEMENT for the 11 inclusive days 2026-09-20 through 2026-09-30, leaving allotment_balance_cents 139258 and abatement_total_cents 78892."
            - "One AUTHORIZED DisplacementLodging covers [2026-09-20, 2026-09-30) at nightly_rate_cents 22000 for 4 occupants."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /installations"
