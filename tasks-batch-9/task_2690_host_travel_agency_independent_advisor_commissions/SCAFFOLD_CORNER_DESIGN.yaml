            - call: "POST /host-agency/advisors"
              payload: { legal_name: "Dana Reyes", email: "dana.reyes@example.com", seller_of_travel_state: "NY" }
              as: HostOperations
              captures: { adv_id: $.data.id, adv_v0: $.data.version }
            - call: "POST /host-agency/advisors/${adv_id}/agreements"
              payload: { split_schedule_id: "${sched_id}", effective_date: "2026-01-01", post_departure_advisor_pct: 0.50, expected_advisor_version: "${adv_v0}" }
              as: HostOperations
            - call: "POST /host-agency/advisors/${adv_id}/credentials"
              payload: { credential_type: "SELLER_OF_TRAVEL", credential_number: "NY-SOT-40118", effective_on: "2026-01-01", expires_on: "2027-01-01", jurisdiction_state_code: "NY" }
              as: HostOperations
              captures: { cr_sot_id: $.data.id }
            - call: "POST /host-agency/advisors/${adv_id}/credentials"
              payload: { credential_type: "EO_POLICY", credential_number: "EO-99881", effective_on: "2026-01-01", expires_on: "2027-01-01", coverage_amount_cents: 100000000 }
              as: HostOperations
              captures: { cr_eo_id: $.data.id }
            - call: "POST /host-agency/advisors/${adv_id}/credentials"
              payload: { credential_type: "TRAINING_CERT", credential_number: "TRN-2026-A", effective_on: "2026-01-01", expires_on: "2027-01-01" }
              as: HostOperations
              captures: { cr_trn_id: $.data.id }
            - call: "POST /host-agency/advisors/${adv_id}/credentials"
              payload: { credential_type: "SUPPLIER_ACCREDITATION", credential_number: "ARC-33290", effective_on: "2026-01-01", expires_on: "2027-01-01", supplier_id: "${sup_id}" }
              as: HostOperations
              captures: { cr_acc_id: $.data.id }
            - call: "POST /host-agency/compliance-credentials/${cr_sot_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /host-agency/compliance-credentials/${cr_eo_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /host-agency/compliance-credentials/${cr_trn_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /host-agency/compliance-credentials/${cr_acc_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /host-agency/advisors/${adv_id}/activate"
              payload: {}
              as: HostOperations
            - call: "POST /host-agency/clients"
              payload: { owner_advisor_id: "${adv_id}", full_name: "Nadia Okoye", home_state_code: "NY", max_concurrent_trips: 4 }
              as: Advisor
              as_user_id: "${adv_id}"
              captures: { cli_id: $.data.id }
            - call: "POST /host-agency/bookings"
              payload: { advisor_id: "${adv_id}", supplier_id: "${sup_id}", client_id: "${cli_id}", channel: "SUPPLIER_DIRECT", payment_method: "MERCHANT_DIRECT", gross_sale_cents: 1000000, deposit_amount_cents: 0, travel_start_date: "2026-06-01", travel_end_date: "2026-06-10" }
              as: Advisor
              as_user_id: "${adv_id}"
              captures: { bk_1_id: $.data.id }
            - call: "POST /host-agency/bookings"
              payload: { advisor_id: "${adv_id}", supplier_id: "${sup_id}", client_id: "${cli_id}", channel: "SUPPLIER_DIRECT", payment_method: "MERCHANT_DIRECT", gross_sale_cents: 500000, deposit_amount_cents: 0, travel_start_date: "2026-06-01", travel_end_date: "2026-06-10" }
              as: Advisor
              as_user_id: "${adv_id}"
              captures: { bk_2_id: $.data.id }
          trigger:
            - call: "POST /host-agency/bookings/${bk_1_id}/confirm"
              payload: {}
              as: SupplierPortal
              as_user_id: "${sup_id}"
            - call: "POST /host-agency/bookings/${bk_2_id}/confirm"
              payload: {}
              as: SupplierPortal
              as_user_id: "${sup_id}"
            - call: "GET /host-agency/suppliers/${sup_id}"
              payload: {}
              as: HostOperations
              captures: { out_after_confirm: $.data.total_outstanding_cents, bucket_after_confirm: $.data.aging_0_30_cents }
            - call: "POST /host-agency/bookings/${bk_2_id}/cancel"
              payload: { cancellation_reason: "CLIENT_INITIATED" }
              as: Advisor
              as_user_id: "${adv_id}"
            - call: "GET /host-agency/suppliers/${sup_id}"
              payload: {}
              as: HostOperations
              captures: { out_after_cancel: $.data.total_outstanding_cents }
            - call: "POST /host-agency/bookings/${bk_1_id}/commission-receipt"
              payload: { amount_cents: 60000, received_on: "2026-08-01" }
              as: SupplierPortal
              as_user_id: "${sup_id}"
            - call: "GET /host-agency/suppliers/${sup_id}"
              payload: {}
              as: HostOperations
              captures: { out_after_receipt: $.data.total_outstanding_cents }
            - call: "POST /host-agency/bookings/${bk_1_id}/commission-claims"
              payload: { claimed_amount_cents: 40000 }
              as: Advisor
              as_user_id: "${adv_id}"
              captures: { claim_id: $.data.id }
            - call: "GET /host-agency/suppliers/${sup_id}"
              payload: {}
              as: HostOperations
              captures: { out_after_claim: $.data.total_outstanding_cents, bucket_after_claim: $.data.aging_0_30_cents }
            - call: "POST /host-agency/commission-claims/${claim_id}/resolve"
              payload: { resolution: "PAID", recovered_amount_cents: 40000 }
              as: HostOperations
            - call: "GET /host-agency/suppliers/${sup_id}"
              payload: {}
              as: HostOperations
              captures: { out_after_resolution: $.data.total_outstanding_cents }
          assert:
            - "AFTER CREATE: out_after_confirm == 150000 and bucket_after_confirm == 150000 — both receivables are 22 days past a 2026-07-10 due date"
            - "AFTER SOURCE REMOVAL: out_after_cancel == 100000, because the cancelled booking's commission_status became WRITTEN_OFF and left the cohort"
            - "AFTER PARTIAL COLLECTION: out_after_receipt == 0 — a RECEIVED booking is excluded from the cohort even though 40000 is still unpaid"
            - "AFTER RE-ENTRY: out_after_claim == 40000 and bucket_after_claim == 40000, computed as expected_commission_cents 100000 minus received_commission_cents 60000 on the CLAIMED booking"
            - "AFTER FINAL COLLECTION: out_after_resolution == 0 with all four buckets 0 and never null"
            - "Supplier.${sup_id}.chargeback_count == 0 throughout: cancelling an EXPECTED booking is a write-off, not a chargeback"
            - "Booking.${bk_1_id}.received_commission_cents == 100000 and shortfall_cents == 0 at the end"

      - name: corner_four_level_cascade_runs_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - endpoints["POST /host-agency/bookings/{id}/cancel"]
          - endpoints["POST /host-agency/advisors/{id}/departure/finalize"]
        excluded_because:
          difficulty_instance: transitive_cascade / chargeback_demotes_supplier_reprices_pending_and_moves_tier_basis
          rationale: "Both declared cascades are asserted level by level by the two §1.8 transitive_cascade instances (CASCADE-A on cancellation and CASCADE-B on departure finalization), including the level-3 repricing and the level-4 tier recomputation."

      - name: corner_both_variants_and_the_switch_delta
        claim_type: dual_variant_calculation
        grounds:
          - calculations.advisor_production_ytd.variants
          - calculations.cancellation_chargeback.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / chargeback_gross_reversal_vs_net_of_retention_diverge
          rationale: "The two §1.8 dual_variant_calc instances assert both variants of both calculations with their divergent literals and the context that selects each."

      - name: corner_cumulative_threshold_boundaries_flip_the_rate
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.split_tier_selection
          - calculations.supplier_commission_aging
          - calculations.claim_aging_escalation
        excluded_because:
          difficulty_instance: boundary_precision_check / split_tier_boundary_exact_five_million_final_production
          rationale: "The cumulative production threshold is asserted at 4999999 and exactly 5000000 there, and the two time-driven thresholds are asserted at 30/31 days and 59/60/119/120 days by the aging instance and by the calculations threshold corner."

  # ==========================================================================
  # 9. CONSISTENCY MODEL — declared: immediate
  # ==========================================================================
  - section: consistency model
    instances:
      - name: corner_every_derived_field_is_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.booking_expected_commission
          - calculations.client_trust_balance
          - calculations.advisor_production_ytd
        distinguishing_aspect: "consistency_model is immediate, so no read-after-write lag is tolerated anywhere: the booking create response already carries expected_commission_cents, the confirm response already carries the swept trust balance's effect, and a GET issued immediately afterwards returns byte-identical derived values — nothing is recomputed lazily on read."
        test_recipe:
          setup:
            - "Priya Nair ACTIVE in CA (trust_account_required true), accredited with Meridian Air, one client funded with a 300000-cent deposit."
          setup_api_calls:
            - call: "POST /host-agency/split-schedules"
              payload: { name: "Standard 2026", tiers: [{ tier_level: 1, min_production_cents: 0, advisor_pct: 0.70 }, { tier_level: 2, min_production_cents: 5000000, advisor_pct: 0.80 }], platform_fee_tiers: [{ min_share_cents: 0, fee_pct: 0.05 }], chargeback_retention_pct: 0.10 }
              as: HostOperations
              captures: { sched_id: $.data.id }
            - call: "POST /host-agency/suppliers"
              payload: { name: "Meridian Air", accreditation_scheme: "ARC", base_commission_pct: 0.10, preferred_override_commission_pct: 0.12, rate_ceiling_pct: 0.20, max_commission_per_booking_cents: 9000000, remit_terms_days: 30 }
              as: HostOperations
              captures: { sup_id: $.data.id }
            - call: "POST /host-agency/advisors"
              payload: { legal_name: "Priya Nair", email: "priya.nair@example.com", seller_of_travel_state: "CA" }
              as: HostOperations
              captures: { adv_id: $.data.id, adv_v0: $.data.version }
            - call: "POST /host-agency/advisors/${adv_id}/agreements"
              payload: { split_schedule_id: "${sched_id}", effective_date: "2026-01-01", post_departure_advisor_pct: 0.50, expected_advisor_version: "${adv_v0}" }
              as: HostOperations
            - call: "POST /host-agency/advisors/${adv_id}/credentials"
              payload: { credential_type: "SELLER_OF_TRAVEL", credential_number: "CA-SOT-20551", effective_on: "2026-01-01", expires_on: "2027-01-01", jurisdiction_state_code: "CA" }
              as: HostOperations
              captures: { cr_sot_id: $.data.id }
            - call: "POST /host-agency/advisors/${adv_id}/credentials"
              payload: { credential_type: "EO_POLICY", credential_number: "EO-20552", effective_on: "2026-01-01", expires_on: "2027-01-01", coverage_amount_cents: 100000000 }
              as: HostOperations
              captures: { cr_eo_id: $.data.id }
            - call: "POST /host-agency/advisors/${adv_id}/credentials"
              payload: { credential_type: "TRAINING_CERT", credential_number: "TRN-20553", effective_on: "2026-01-01", expires_on: "2027-01-01" }
              as: HostOperations
              captures: { cr_trn_id: $.data.id }
            - call: "POST /host-agency/advisors/${adv_id}/credentials"
              payload: { credential_type: "SUPPLIER_ACCREDITATION", credential_number: "ARC-20554", effective_on: "2026-01-01", expires_on: "2027-01-01", supplier_id: "${sup_id}" }
              as: HostOperations
              captures: { cr_acc_id: $.data.id }
            - call: "POST /host-agency/compliance-credentials/${cr_sot_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /host-agency/compliance-credentials/${cr_eo_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /host-agency/compliance-credentials/${cr_trn_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /host-agency/compliance-credentials/${cr_acc_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /host-agency/advisors/${adv_id}/activate"
              payload: {}
              as: HostOperations
            - call: "POST /host-agency/clients"
              payload: { owner_advisor_id: "${adv_id}", full_name: "Marta Vidal", home_state_code: "CA" }
              as: Advisor
              as_user_id: "${adv_id}"
              captures: { cli_id: $.data.id, cli_v0: $.data.version }
            - call: "POST /host-agency/clients/${cli_id}/trust-ledger-entries"
              payload: { direction: "DEPOSIT", amount_cents: 300000, memo: "Trip funding", expected_client_version: "${cli_v0}" }
              as: Advisor
              as_user_id: "${adv_id}"
              captures: { deposit_balance: $.data.balance_after_cents }
          trigger:
            - call: "POST /host-agency/bookings"
              payload: { advisor_id: "${adv_id}", supplier_id: "${sup_id}", client_id: "${cli_id}", channel: "SUPPLIER_DIRECT", payment_method: "CLIENT_TRUST", gross_sale_cents: 1000000, deposit_amount_cents: 250000, travel_start_date: "2026-10-01", travel_end_date: "2026-10-10" }
              as: Advisor
              as_user_id: "${adv_id}"
              captures: { create_expected: $.data.expected_commission_cents, create_rate: $.data.applied_commission_rate, bk_id: $.data.id }
            - call: "GET /host-agency/bookings/${bk_id}"
              payload: {}
              as: HostOperations
              captures: { read_expected: $.data.expected_commission_cents, read_rate: $.data.applied_commission_rate }
            - call: "GET /host-agency/advisors/${adv_id}"
              payload: {}
              as: HostOperations
              captures: { prod_after_create: $.data.production_ytd_provisional_cents }
            - call: "POST /host-agency/bookings/${bk_id}/confirm"
              payload: {}
              as: SupplierPortal
              as_user_id: "${sup_id}"
              captures: { confirm_commission: $.data.commission_status }
            - call: "GET /host-agency/clients/${cli_id}"
              payload: {}
              as: HostController
              as_user_id: "ctrl-1"
              captures: { balance_after_sweep: $.data.trust_balance_cents }
            - call: "GET /host-agency/clients/${cli_id}/trust-ledger-entries"
              payload: {}
              as: HostController
              as_user_id: "ctrl-1"
          assert:
            - "SAME RESPONSE: create_expected == 100000 and create_rate == 0.10 — the derived commission is in the create response, not filled in later"
            - "READ MATCHES WRITE: read_expected == create_expected and read_rate == create_rate with no delay and no second call needed"
            - "prod_after_create == 100000: the advisor aggregate was already updated by the time the very next request was served"
            - "CONFIRM RESPONSE: confirm_commission == EXPECTED"
            - "SWEEP IS IMMEDIATE: deposit_balance == 300000 and balance_after_sweep == 50000, i.e. the 250000 CLIENT_TRUST deposit was disbursed inside the confirm request itself"
            - "the ledger read returns 2 rows: +300000 (balance_after_cents 300000) then -250000 (balance_after_cents 50000), the second one carrying booking_id == ${bk_id} and recorded_by_user_id == ${sup_id}"
            - "no endpoint in §1.5 requires a follow-up refresh call: there is no eventual-consistency window to test"
