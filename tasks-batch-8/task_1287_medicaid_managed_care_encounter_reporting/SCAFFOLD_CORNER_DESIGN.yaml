            - { call: "POST /programs/batches/${b_id}/seal", payload: {}, as: McoEncounterOps, as_user_id: "ops-1" }
            - { call: "POST /programs/batches/${b_id}/transmit", payload: {}, as: McoCompliance, as_user_id: "comp-1" }
            - { call: "POST /programs/batches/${b_id}/acknowledge", payload: { outcomes: [{ encounter_id: "${e1}", outcome: "DENIED", edit_code: "E501_STATE_EDIT" }, { encounter_id: "${e2}", outcome: "ACCEPTED" }] }, as: StateAgency }
          trigger:
            - { call: "POST /programs/encounters/${e1}/replace", payload: { encounter_ref: "E1R", service_from_date: "2026-08-10", service_to_date: "2026-08-10", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 10000, lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, paid_amount_cents: 10000 }] }, as: McoEncounterOps, captures: { e1r: $.data.id } }
            - { call: "GET /programs/cycles/${cyc_id}", as: StateAgency, captures: { intake_n: $.data.intake_encounter_count, net_n: $.data.net_accepted_encounter_count } }
          assert:
            - "cycle.intake_encounter_count == 2 after the replace (E1 SUPERSEDED drops out, E1R enters; a naive count would read 3)"
            - "cycle.net_accepted_encounter_count == 1 (only e2; denied-then-superseded e1 never contributed)"
            - "Encounter.${e1}.status == SUPERSEDED and Encounter.${e1r}.status == RECEIVED"

      - name: member_months_partial_overlap_counts_full_month
        claim_type: input_set_filtering
        grounds: [calculations.capitation_amount, entities.CapitationStatement.fields.member_months]
        distinguishing_aspect: "Member-month counting uses any-overlap semantics: a member enrolled from 2026-08-15 counts a full month, while a member whose enrollment ended 2026-07-31 does not overlap the August window and is excluded."
        test_recipe:
          setup: ["Program; TANF@50000 schedule; August cycle; member A enrolled from 2026-08-15; member B enrolled 2026-07-01 and disenrolled 2026-07-31"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-CALC5", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000 }, as: StateAgency, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/rate-schedules", payload: { program_id: "${prog_id}", aid_category: "TANF", pmpm_cents: 50000, effective_from: "2026-08-01", effective_to: "2026-08-31" }, as: StateAgency }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-09-15T00:00:00Z" }, as: StateAgency, captures: { cyc_id: $.data.id } }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "MA", aid_category: "TANF", enrolled_from: "2026-08-15" }, as: McoEncounterOps }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "MB", aid_category: "TANF", enrolled_from: "2026-07-01" }, as: McoEncounterOps, captures: { mb: $.data.id } }
            - { call: "POST /programs/members/${mb}/disenroll", payload: { disenrolled_date: "2026-07-31" }, as: McoEncounterOps }
          trigger:
            - { call: "POST /programs/capitation-statements", payload: { cycle_id: "${cyc_id}" }, as: McoFinance, captures: { stmt_id: $.data.id, mm: $.data.member_months } }
          assert:
            - "CapitationStatement.${stmt_id}.member_months == 1 (mid-month enrollee counts; July-only member excluded)"
            - "provisional_paid_cents == 50000"

      - name: late_penalty_day_floor_at_zero_days_late
        claim_type: constants_applied
        grounds: [calculations.penalty_amount, entities.SubmissionBatch.fields.late]
        distinguishing_aspect: "Transmitting 1 second past the deadline is late but floors to 0 days, so the penalty is exactly the 500000 flat component with no per-day adder."
        test_recipe:
          setup: ["Program (high threshold); cycle deadline 2026-09-15T00:00:00Z; member; provider; e1 VALIDATED, staged, sealed; clock at 2026-09-15T00:00:01Z"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-CALC6", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000000 }, as: StateAgency, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-09-15T00:00:00Z" }, as: StateAgency, captures: { cyc_id: $.data.id } }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M1", aid_category: "TANF", enrolled_from: "2026-08-01" }, as: McoEncounterOps, captures: { m1: $.data.id } }
            - { call: "POST /programs/providers", payload: { program_id: "${prog_id}", npi: "1234567890", taxonomy_code: "207Q00000X" }, as: McoEncounterOps, captures: { prov_id: $.data.id } }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov_id}", encounter_ref: "E1", service_from_date: "2026-08-10", service_to_date: "2026-08-10", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 10000, lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, paid_amount_cents: 10000 }] }, as: McoEncounterOps, captures: { e1: $.data.id } }
            - { call: "POST /programs/encounters/${e1}/validate", payload: {}, as: McoEncounterOps }
            - { call: "POST /programs/batches", payload: { cycle_id: "${cyc_id}" }, as: McoEncounterOps, captures: { b_id: $.data.id, b_v1: $.data.version } }
            - { call: "POST /programs/batches/${b_id}/encounters", payload: { encounter_id: "${e1}", expected_batch_version: "${b_v1}" }, as: McoEncounterOps }
            - { call: "POST /programs/batches/${b_id}/seal", payload: {}, as: McoEncounterOps, as_user_id: "ops-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T00:00:01Z" }, as: StateAgency }
          trigger:
            - { call: "POST /programs/batches/${b_id}/transmit", payload: {}, as: McoCompliance, as_user_id: "comp-1" }
            - { call: "GET /programs/penalties?cycle_id=${cyc_id}", as: StateAgency, captures: { pen_amt: "$.data[0].amount_cents" } }
          assert:
            - "SubmissionBatch.${b_id}.late == true"
            - "penalty amount_cents == 500000 (floor(1s / 86400) = 0 days; flat component only)"

  - section: validations
    instances:
      - name: missing_auth_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-Role/X-User-ID headers is rejected at priority 1 before any role or existence check."
        test_recipe:
          setup: ["Request is sent with both X-User-ID and X-User-Role headers omitted"]
          setup_api_calls: []
          trigger:
            - { call: "POST /programs", payload: { name: "P-NOAUTH", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000 }, as: StateAgency, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER and http status == 400"

      - name: encounter_create_paid_exceeds_billed_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=17]", "errors[ERR_PAID_EXCEEDS_BILLED]"]
        distinguishing_aspect: "A line with paid 12000 against billed 10000 violates the per-line fiscal cap on its own."
        test_recipe:
          setup: ["Program; August cycle; member; provider"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-V1", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000 }, as: StateAgency, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-09-15T00:00:00Z" }, as: StateAgency }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M1", aid_category: "TANF", enrolled_from: "2026-08-01" }, as: McoEncounterOps, captures: { m1: $.data.id } }
            - { call: "POST /programs/providers", payload: { program_id: "${prog_id}", npi: "1234567890", taxonomy_code: "207Q00000X" }, as: McoEncounterOps, captures: { prov_id: $.data.id } }
          trigger:
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov_id}", encounter_ref: "E1", service_from_date: "2026-08-10", service_to_date: "2026-08-10", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 12000, lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, paid_amount_cents: 12000 }] }, as: McoEncounterOps, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PAID_EXCEEDS_BILLED (http 422); nothing persisted"

      - name: encounter_create_header_lines_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "errors[ERR_HEADER_LINES_PAID_MISMATCH]"]
        distinguishing_aspect: "Header paid 10000 against lines summing 8000 fails the header-equals-sum-of-lines fiscal rule when all referential checks pass."
        test_recipe:
          setup: ["Program; August cycle; member; provider"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-V2", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000 }, as: StateAgency, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-09-15T00:00:00Z" }, as: StateAgency }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M1", aid_category: "TANF", enrolled_from: "2026-08-01" }, as: McoEncounterOps, captures: { m1: $.data.id } }
            - { call: "POST /programs/providers", payload: { program_id: "${prog_id}", npi: "1234567890", taxonomy_code: "207Q00000X" }, as: McoEncounterOps, captures: { prov_id: $.data.id } }
          trigger:
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov_id}", encounter_ref: "E1", service_from_date: "2026-08-10", service_to_date: "2026-08-10", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 10000, lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 8000, paid_amount_cents: 8000 }] }, as: McoEncounterOps, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_HEADER_LINES_PAID_MISMATCH (http 422)"

      - name: duplicate_encounter_ref_rejected_then_reusable_after_supersede
        claim_type: violation_to_error
        grounds: ["validations[priority=23]", "errors[ERR_DUPLICATE_ENCOUNTER_REF]"]
        distinguishing_aspect: "encounter_ref uniqueness is scoped to non-SUPERSEDED, non-VOIDED rows: a duplicate is rejected while the original is live, but the ref frees up once the original is superseded."
        test_recipe:
          setup: ["Program; cycle; member; provider; e1 (ref DUP) DENIED via a full batch cycle, then superseded by replace with ref E1R"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-V3", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000 }, as: StateAgency, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-09-15T00:00:00Z" }, as: StateAgency, captures: { cyc_id: $.data.id } }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M1", aid_category: "TANF", enrolled_from: "2026-08-01" }, as: McoEncounterOps, captures: { m1: $.data.id } }
            - { call: "POST /programs/providers", payload: { program_id: "${prog_id}", npi: "1234567890", taxonomy_code: "207Q00000X" }, as: McoEncounterOps, captures: { prov_id: $.data.id } }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov_id}", encounter_ref: "DUP", service_from_date: "2026-08-10", service_to_date: "2026-08-10", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 10000, lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, paid_amount_cents: 10000 }] }, as: McoEncounterOps, captures: { e1: $.data.id } }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov_id}", encounter_ref: "OK2", service_from_date: "2026-08-13", service_to_date: "2026-08-13", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 2000, lines: [{ line_number: 1, procedure_code: "99211", units: 1, billed_amount_cents: 2000, paid_amount_cents: 2000 }] }, as: McoEncounterOps, captures: { e2: $.data.id } }
          trigger:
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov_id}", encounter_ref: "DUP", service_from_date: "2026-08-12", service_to_date: "2026-08-12", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 3000, lines: [{ line_number: 1, procedure_code: "99212", units: 1, billed_amount_cents: 3000, paid_amount_cents: 3000 }] }, as: McoEncounterOps, captures: { err_dup: $.data.error_id } }
            - { call: "POST /programs/encounters/${e1}/validate", payload: {}, as: McoEncounterOps }
            - { call: "POST /programs/encounters/${e2}/validate", payload: {}, as: McoEncounterOps }
            - { call: "POST /programs/batches", payload: { cycle_id: "${cyc_id}" }, as: McoEncounterOps, captures: { b_id: $.data.id, b_v1: $.data.version } }
            - { call: "POST /programs/batches/${b_id}/encounters", payload: { encounter_id: "${e1}", expected_batch_version: "${b_v1}" }, as: McoEncounterOps, captures: { b_v2: $.data.version } }
            - { call: "POST /programs/batches/${b_id}/encounters", payload: { encounter_id: "${e2}", expected_batch_version: "${b_v2}" }, as: McoEncounterOps }
            - { call: "POST /programs/batches/${b_id}/seal", payload: {}, as: McoEncounterOps, as_user_id: "ops-1" }
            - { call: "POST /programs/batches/${b_id}/transmit", payload: {}, as: McoCompliance, as_user_id: "comp-1" }
            - { call: "POST /programs/batches/${b_id}/acknowledge", payload: { outcomes: [{ encounter_id: "${e1}", outcome: "DENIED", edit_code: "E501_STATE_EDIT" }, { encounter_id: "${e2}", outcome: "ACCEPTED" }] }, as: StateAgency }
            - { call: "POST /programs/encounters/${e1}/replace", payload: { encounter_ref: "E1R", service_from_date: "2026-08-10", service_to_date: "2026-08-10", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 10000, lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, paid_amount_cents: 10000 }] }, as: McoEncounterOps }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov_id}", encounter_ref: "DUP", service_from_date: "2026-08-12", service_to_date: "2026-08-12", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 3000, lines: [{ line_number: 1, procedure_code: "99212", units: 1, billed_amount_cents: 3000, paid_amount_cents: 3000 }] }, as: McoEncounterOps, captures: { e3: $.data.id } }
          assert:
            - "first duplicate create fails with ERR_DUPLICATE_ENCOUNTER_REF (e1 still live)"
            - "after e1 is SUPERSEDED, the same ref DUP succeeds: Encounter.${e3} created in RECEIVED"

      - name: audit_sample_invalid_variants_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=28]", "errors[ERR_AUDIT_SAMPLE_INVALID]"]
        distinguishing_aspect: "Both sample_size 0 and defect_count > sample_size violate audit sample sanity at creation time."
        test_recipe:
          setup: ["Program; August cycle"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-V4", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000 }, as: StateAgency, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-09-15T00:00:00Z" }, as: StateAgency, captures: { cyc_id: $.data.id } }
          trigger:
            - { call: "POST /programs/audits", payload: { cycle_id: "${cyc_id}", sample_size: 0, defect_count: 0 }, as: StateAgency, captures: { err1: $.data.error_id } }
            - { call: "POST /programs/audits", payload: { cycle_id: "${cyc_id}", sample_size: 10, defect_count: 11 }, as: StateAgency, captures: { err2: $.data.error_id } }
          assert:
            - "both attempts fail with ERR_AUDIT_SAMPLE_INVALID (http 422)"
            - "GET /programs/audits?cycle_id=${cyc_id} returns total_count == 0"

      - name: audit_and_statement_uniqueness_per_cycle
        claim_type: violation_to_error
        grounds: ["validations[priority=24]", "validations[priority=25]", "errors[ERR_AUDIT_EXISTS]", "errors[ERR_STATEMENT_EXISTS]"]
        distinguishing_aspect: "At-most-one-per-cycle holds for both audits and capitation statements."
        test_recipe:
          setup: ["Program; TANF schedule; August cycle; 1 TANF member; one audit and one statement already created"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-V5", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000 }, as: StateAgency, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/rate-schedules", payload: { program_id: "${prog_id}", aid_category: "TANF", pmpm_cents: 50000, effective_from: "2026-08-01", effective_to: "2026-08-31" }, as: StateAgency }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-09-15T00:00:00Z" }, as: StateAgency, captures: { cyc_id: $.data.id } }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M1", aid_category: "TANF", enrolled_from: "2026-08-01" }, as: McoEncounterOps }
            - { call: "POST /programs/audits", payload: { cycle_id: "${cyc_id}", sample_size: 5, defect_count: 0 }, as: StateAgency }
            - { call: "POST /programs/capitation-statements", payload: { cycle_id: "${cyc_id}" }, as: McoFinance }
          trigger:
            - { call: "POST /programs/audits", payload: { cycle_id: "${cyc_id}", sample_size: 8, defect_count: 1 }, as: StateAgency, captures: { err_a: $.data.error_id } }
            - { call: "POST /programs/capitation-statements", payload: { cycle_id: "${cyc_id}" }, as: McoFinance, captures: { err_s: $.data.error_id } }
          assert:
            - "second audit create fails with ERR_AUDIT_EXISTS"
            - "second statement create fails with ERR_STATEMENT_EXISTS"

      - name: statement_create_without_rate_coverage_returns_rate_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors[ERR_RATE_NOT_FOUND]"]
        distinguishing_aspect: "A cycle with an enrolled EXPANSION member but no EXPANSION rate schedule covering the window start fails statement creation."
        test_recipe:
          setup: ["Program with only a TANF schedule; August cycle; one EXPANSION member enrolled"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-V6", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000 }, as: StateAgency, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/rate-schedules", payload: { program_id: "${prog_id}", aid_category: "TANF", pmpm_cents: 50000, effective_from: "2026-08-01", effective_to: "2026-08-31" }, as: StateAgency }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-09-15T00:00:00Z" }, as: StateAgency, captures: { cyc_id: $.data.id } }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M1", aid_category: "EXPANSION", enrolled_from: "2026-08-01" }, as: McoEncounterOps }
          trigger:
            - { call: "POST /programs/capitation-statements", payload: { cycle_id: "${cyc_id}" }, as: McoFinance, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_RATE_NOT_FOUND (http 422); no statement persisted"

      - name: audit_determine_requires_statement_and_reconcile_requires_snapshots
        claim_type: violation_to_error
        grounds: ["validations[priority=14]", "validations[priority=15]", "errors[ERR_STATEMENT_REQUIRED]", "errors[ERR_SNAPSHOTS_REQUIRED]"]
        distinguishing_aspect: "Two referential prerequisites in the reporting pipeline: determine needs the cycle statement; reconcile needs computed risk snapshots."
        test_recipe:
          setup: ["Program; TANF schedule; August cycle; 1 member; audit created but no statement; then statement created but snapshots never computed"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-V7", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000 }, as: StateAgency, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/rate-schedules", payload: { program_id: "${prog_id}", aid_category: "TANF", pmpm_cents: 50000, effective_from: "2026-08-01", effective_to: "2026-08-31" }, as: StateAgency }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-09-15T00:00:00Z" }, as: StateAgency, captures: { cyc_id: $.data.id } }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M1", aid_category: "TANF", enrolled_from: "2026-08-01" }, as: McoEncounterOps }
            - { call: "POST /programs/audits", payload: { cycle_id: "${cyc_id}", sample_size: 5, defect_count: 0 }, as: StateAgency, captures: { aud_id: $.data.id } }
          trigger:
            - { call: "POST /programs/audits/${aud_id}/determine", payload: {}, as: StateAgency, captures: { err_d: $.data.error_id } }
            - { call: "POST /programs/capitation-statements", payload: { cycle_id: "${cyc_id}" }, as: McoFinance, captures: { stmt_id: $.data.id } }
            - { call: "POST /programs/capitation-statements/${stmt_id}/reconcile", payload: {}, as: McoFinance, captures: { err_r: $.data.error_id } }
          assert:
            - "determine without a statement fails with ERR_STATEMENT_REQUIRED"
            - "reconcile without compute-risk-scores fails with ERR_SNAPSHOTS_REQUIRED"
            - "Audit.${aud_id}.status remains DRAFT; CapitationStatement.${stmt_id}.status remains PROVISIONAL_ISSUED"

      - name: add_encounter_to_batch_of_different_cycle_returns_cycle_mismatch
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_CYCLE_MISMATCH]"]
        distinguishing_aspect: "An encounter attributed to the August cycle cannot be staged into a batch of the September cycle."
        test_recipe:
          setup: ["Program; August and September cycles (adjacent, both OPEN); member; provider; e1 (service 2026-08-10) VALIDATED; batch on September cycle"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-V8", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000 }, as: StateAgency, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-09-15T00:00:00Z" }, as: StateAgency }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-09", window_start_at: "2026-09-01T00:00:00Z", window_end_at: "2026-10-01T00:00:00Z", submission_deadline_at: "2026-10-15T00:00:00Z" }, as: StateAgency, captures: { cyc_sep: $.data.id } }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M1", aid_category: "TANF", enrolled_from: "2026-08-01" }, as: McoEncounterOps, captures: { m1: $.data.id } }
            - { call: "POST /programs/providers", payload: { program_id: "${prog_id}", npi: "1234567890", taxonomy_code: "207Q00000X" }, as: McoEncounterOps, captures: { prov_id: $.data.id } }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov_id}", encounter_ref: "E1", service_from_date: "2026-08-10", service_to_date: "2026-08-10", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 10000, lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, paid_amount_cents: 10000 }] }, as: McoEncounterOps, captures: { e1: $.data.id } }
            - { call: "POST /programs/encounters/${e1}/validate", payload: {}, as: McoEncounterOps }
            - { call: "POST /programs/batches", payload: { cycle_id: "${cyc_sep}" }, as: McoEncounterOps, captures: { b_id: $.data.id, b_v1: $.data.version } }
          trigger:
            - { call: "POST /programs/batches/${b_id}/encounters", payload: { encounter_id: "${e1}", expected_batch_version: "${b_v1}" }, as: McoEncounterOps, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CYCLE_MISMATCH"
            - "batch encounter_count remains 0 and Encounter.${e1}.status remains VALIDATED"

      - name: add_received_encounter_returns_not_stageable
        claim_type: violation_to_error
        grounds: [state_machines.Encounter.VALIDATED_to_STAGED, "errors[ERR_ENCOUNTER_NOT_STAGEABLE]"]
        distinguishing_aspect: "Only VALIDATED encounters can be staged; a RECEIVED (never validated) encounter is rejected."
        test_recipe:
          setup: ["Program; August cycle; member; provider; e1 in RECEIVED; DRAFT batch on the cycle"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-V9", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000 }, as: StateAgency, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-09-15T00:00:00Z" }, as: StateAgency, captures: { cyc_id: $.data.id } }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M1", aid_category: "TANF", enrolled_from: "2026-08-01" }, as: McoEncounterOps, captures: { m1: $.data.id } }
            - { call: "POST /programs/providers", payload: { program_id: "${prog_id}", npi: "1234567890", taxonomy_code: "207Q00000X" }, as: McoEncounterOps, captures: { prov_id: $.data.id } }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov_id}", encounter_ref: "E1", service_from_date: "2026-08-10", service_to_date: "2026-08-10", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 10000, lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, paid_amount_cents: 10000 }] }, as: McoEncounterOps, captures: { e1: $.data.id } }
            - { call: "POST /programs/batches", payload: { cycle_id: "${cyc_id}" }, as: McoEncounterOps, captures: { b_id: $.data.id, b_v1: $.data.version } }
          trigger:
            - { call: "POST /programs/batches/${b_id}/encounters", payload: { encounter_id: "${e1}", expected_batch_version: "${b_v1}" }, as: McoEncounterOps, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ENCOUNTER_NOT_STAGEABLE"

      - name: suspended_provider_and_submitter_block_encounter_create
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_PROVIDER_SUSPENDED]", "errors[ERR_SUBMITTER_SUSPENDED]"]
        distinguishing_aspect: "Both suspended-party gates fire at intake: one trigger hits ERR_PROVIDER_SUSPENDED (suspended provider, direct intake), the other isolates ERR_SUBMITTER_SUSPENDED by using an ACTIVE provider with a SUSPENDED submitter."
        test_recipe:
          setup: ["Program; August cycle; member; provider p1 SUSPENDED; provider p2 ACTIVE; submitter SUSPENDED"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-V10", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000 }, as: StateAgency, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-09-15T00:00:00Z" }, as: StateAgency }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M1", aid_category: "TANF", enrolled_from: "2026-08-01" }, as: McoEncounterOps, captures: { m1: $.data.id } }
            - { call: "POST /programs/providers", payload: { program_id: "${prog_id}", npi: "1234567890", taxonomy_code: "207Q00000X" }, as: McoEncounterOps, captures: { prov_id: $.data.id } }
            - { call: "POST /programs/providers/${prov_id}/suspend", payload: {}, as: McoEncounterOps }
            - { call: "POST /programs/providers", payload: { program_id: "${prog_id}", npi: "9876543210", taxonomy_code: "207Q00000X" }, as: McoEncounterOps, captures: { prov2_id: $.data.id } }
            - { call: "POST /programs/submitters", payload: { program_id: "${prog_id}", name: "DELEGATE-1", trading_partner_id: "TP1" }, as: McoEncounterOps, captures: { sub_id: $.data.id } }
            - { call: "POST /programs/submitters/${sub_id}/suspend", payload: {}, as: McoEncounterOps }
          trigger:
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov_id}", encounter_ref: "E1", service_from_date: "2026-08-10", service_to_date: "2026-08-10", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 10000, lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, paid_amount_cents: 10000 }] }, as: McoEncounterOps, captures: { err_p: $.data.error_id } }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov2_id}", submitter_id: "${sub_id}", encounter_ref: "E2", service_from_date: "2026-08-10", service_to_date: "2026-08-10", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 10000, lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, paid_amount_cents: 10000 }] }, as: McoEncounterOps, captures: { err_s: $.data.error_id } }
          assert:
            - "create with suspended provider fails with ERR_PROVIDER_SUSPENDED"
            - "create carrying suspended submitter fails with ERR_SUBMITTER_SUSPENDED"

      - name: extension_regression_and_approve_without_pending_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=21]", "errors[ERR_EXTENSION_REGRESSION]", "errors[ERR_EXTENSION_NOT_PENDING]"]
        distinguishing_aspect: "requested_new_deadline_at must move the deadline forward, and approve is only legal while a request is PENDING."
        test_recipe:
          setup: ["Program; August cycle with deadline 2026-09-15; clock at default 2026-08-01 (window open); no extension requested"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-V11", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000 }, as: StateAgency, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-09-15T00:00:00Z" }, as: StateAgency, captures: { cyc_id: $.data.id, c_v1: $.data.version } }
          trigger:
            - { call: "POST /programs/cycles/${cyc_id}/request-extension", payload: { requested_new_deadline_at: "2026-09-10T00:00:00Z", reason: "backwards", expected_cycle_version: "${c_v1}" }, as: McoCompliance, captures: { err_r: $.data.error_id } }
            - { call: "POST /programs/cycles/${cyc_id}/approve-extension", payload: {}, as: StateAgency, captures: { err_a: $.data.error_id } }
          assert:
            - "request with requested <= effective deadline fails with ERR_EXTENSION_REGRESSION (http 422)"
            - "approve with extension_status == NONE fails with ERR_EXTENSION_NOT_PENDING"
            - "cycle.extension_status remains NONE and version is unchanged by both failures"

  - section: endpoints
    instances:
      - name: encounters_list_filters_by_status_and_paginates
        claim_type: standard_crud
        grounds: [endpoints, response_envelope]
        distinguishing_aspect: "The encounter list honors the status filter and returns the fixed pagination envelope fields."
        test_recipe:
          setup: ["Program; cycle; member; provider; e1 VALIDATED (clean), e2 REJECTED (bad diagnosis)"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-EP1", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000 }, as: StateAgency, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-09-15T00:00:00Z" }, as: StateAgency }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M1", aid_category: "TANF", enrolled_from: "2026-08-01" }, as: McoEncounterOps, captures: { m1: $.data.id } }
            - { call: "POST /programs/providers", payload: { program_id: "${prog_id}", npi: "1234567890", taxonomy_code: "207Q00000X" }, as: McoEncounterOps, captures: { prov_id: $.data.id } }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov_id}", encounter_ref: "E1", service_from_date: "2026-08-10", service_to_date: "2026-08-10", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 10000, lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, paid_amount_cents: 10000 }] }, as: McoEncounterOps, captures: { e1: $.data.id } }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov_id}", encounter_ref: "E2", service_from_date: "2026-08-11", service_to_date: "2026-08-11", place_of_service: "11", diagnosis_codes: ["9XX"], paid_amount_cents: 3000, lines: [{ line_number: 1, procedure_code: "99212", units: 1, billed_amount_cents: 3000, paid_amount_cents: 3000 }] }, as: McoEncounterOps, captures: { e2: $.data.id } }
            - { call: "POST /programs/encounters/${e1}/validate", payload: {}, as: McoEncounterOps }
            - { call: "POST /programs/encounters/${e2}/validate", payload: {}, as: McoEncounterOps }
          trigger:
            - { call: "GET /programs/encounters?program_id=${prog_id}&status=REJECTED", as: McoEncounterOps }
          assert:
            - "response_type == array with total_count == 1 and the row is ${e2}"
            - "envelope carries limit, offset, total_count, has_more (defaults limit 10, offset 0)"
            - "unfiltered GET /programs/encounters?program_id=${prog_id} returns total_count == 2"

      - name: warn_finding_accepts_encounter_with_warning
        claim_type: action_endpoint
        grounds: [state_machines.Encounter.RECEIVED_to_VALIDATED, entities.ValidationFinding.fields.severity, calculations.provider_error_rate]
        distinguishing_aspect: "A WARN-only edit run (units 95 > 90 triggers E302_UNITS_HIGH) still transitions the encounter to VALIDATED while persisting the warning finding."
        test_recipe:
          setup: ["Program; cycle; member; provider; e1 with a line of 95 units"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-EP2", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000 }, as: StateAgency, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-09-15T00:00:00Z" }, as: StateAgency, captures: { cyc_id: $.data.id } }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M1", aid_category: "TANF", enrolled_from: "2026-08-01" }, as: McoEncounterOps, captures: { m1: $.data.id } }
            - { call: "POST /programs/providers", payload: { program_id: "${prog_id}", npi: "1234567890", taxonomy_code: "207Q00000X" }, as: McoEncounterOps, captures: { prov_id: $.data.id } }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov_id}", encounter_ref: "E1", service_from_date: "2026-08-10", service_to_date: "2026-08-10", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 9500, lines: [{ line_number: 1, procedure_code: "99213", units: 95, billed_amount_cents: 9500, paid_amount_cents: 9500 }] }, as: McoEncounterOps, captures: { e1: $.data.id } }
          trigger:
            - { call: "POST /programs/encounters/${e1}/validate", payload: {}, as: McoEncounterOps, captures: { st: $.data.status } }
            - { call: "GET /programs/encounters/${e1}/findings", as: McoEncounterOps, captures: { f_code: "$.data[0].edit_code", f_sev: "$.data[0].severity" } }
          assert:
            - "Encounter.${e1}.status == VALIDATED (WARN findings do not reject)"
            - "finding edit_code == E302_UNITS_HIGH with severity == WARN, tier == BUSINESS, origin == MCO_EDIT"
            - "provider scorecard run_count == 1 and fatal_finding_count == 0 (warnings do not count against quality)"

      - name: clock_default_makes_transmit_on_time
        claim_type: action_endpoint
        grounds: [endpoints, entities.SubmissionBatch.fields.late]
        distinguishing_aspect: "Without any set_current_utc call the logical clock reads the fixed default 2026-08-01T00:00:00Z, so transmitting a batch for a 2026-09-15 deadline is on-time."
        test_recipe:
          setup: ["Program; August cycle; member; provider; e1 VALIDATED, staged, sealed; clock never set"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-EP3", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000000 }, as: StateAgency, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-09-15T00:00:00Z" }, as: StateAgency, captures: { cyc_id: $.data.id } }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M1", aid_category: "TANF", enrolled_from: "2026-08-01" }, as: McoEncounterOps, captures: { m1: $.data.id } }
            - { call: "POST /programs/providers", payload: { program_id: "${prog_id}", npi: "1234567890", taxonomy_code: "207Q00000X" }, as: McoEncounterOps, captures: { prov_id: $.data.id } }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov_id}", encounter_ref: "E1", service_from_date: "2026-08-10", service_to_date: "2026-08-10", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 10000, lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, paid_amount_cents: 10000 }] }, as: McoEncounterOps, captures: { e1: $.data.id } }
            - { call: "POST /programs/encounters/${e1}/validate", payload: {}, as: McoEncounterOps }
            - { call: "POST /programs/batches", payload: { cycle_id: "${cyc_id}" }, as: McoEncounterOps, captures: { b_id: $.data.id, b_v1: $.data.version } }
            - { call: "POST /programs/batches/${b_id}/encounters", payload: { encounter_id: "${e1}", expected_batch_version: "${b_v1}" }, as: McoEncounterOps }
            - { call: "POST /programs/batches/${b_id}/seal", payload: {}, as: McoEncounterOps, as_user_id: "ops-1" }
          trigger:
            - { call: "POST /programs/batches/${b_id}/transmit", payload: {}, as: McoCompliance, as_user_id: "comp-1", captures: { late_flag: $.data.late, tx_at: $.data.transmitted_at } }
          assert:
            - "transmitted_at == 2026-08-01T00:00:00Z (fixed default clock, never wall-clock)"
            - "late == false and GET /programs/penalties?cycle_id=${cyc_id} returns total_count == 0"

