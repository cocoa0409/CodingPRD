    http_status: 409
    triggered_by: "V-REF-2"
    message: "A raw material in this recipe is no longer active."
  - error_id: ERR_PRINT_FILM_NOT_AVAILABLE
    http_status: 409
    triggered_by: "V-REF-3"
    message: "The SKU's print film is not available."
  - error_id: ERR_LICENSE_NOT_ACTIVE
    http_status: 409
    triggered_by: "V-REF-4"
    message: "The governing design license is not active."
  - error_id: ERR_BATCH_NOT_TRACEABLE
    http_status: 409
    triggered_by: "V-REF-5"
    message: "The batch has no traceability evidence for a warranty claim."
  - error_id: ERR_NO_ELIGIBLE_BATCH
    http_status: 409
    triggered_by: "V-REF-7"
    message: "No eligible batch satisfies this allocation's substitution policy."
  - error_id: ERR_REVIEW_OUTCOME_CONFLICT
    http_status: 409
    triggered_by: "V-REF-8"
    message: "Not every required review confirmed the defect."

  # --- business fiscal (422) ----------------------------------------------
  - error_id: ERR_LICENSE_VOLUME_CAP_EXCEEDED
    http_status: 422
    triggered_by: "V-FISC-1, V-FISC-2"
    message: "The licensed term volume cap would be exceeded."

# =============================================================================
# Table 7: RBAC Matrix  (§1.7)
# role_model: segregation_of_duties — four SoD rules ride on top of the matrix.
# X-User-ID is an opaque identifier for six of the seven roles; for Distributor
# it must equal a Distributor.id.
# =============================================================================
roles:

  - role: PlantAdmin
    user_id_semantics: opaque
    description: "Master-data and commercial administration."
    exclusive_operations:
      - "POST /distributors"
      - "POST /raw-materials"
      - "POST /raw-materials/{id}/status"
      - "POST /raw-materials/{id}/cost"
      - "POST /design-licenses"
      - "POST /print-films"
      - "POST /print-films/{id}/status"
      - "POST /product-skus"
      - "POST /product-skus/{id}/commercial-status"
      - "POST /press-lines"
      - "POST /press-lines/{id}/status"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /design-licenses/{id}/status (ACTIVE / SUSPENDED only, per V-RBAC-2)"
      - "POST /allocations"
      - "every GET except GET /product-skus/{id}/cost-summary is readable by PlantAdmin"

  - role: Formulator
    user_id_semantics: opaque
    description: "Authors and revises compound recipes; may never approve one."
    exclusive_operations:
      - "POST /formulations"
      - "POST /formulations/{id}/components"
      - "DELETE /formulations/{id}/components/{component_id}"
      - "POST /formulations/{id}/submit"
      - "POST /formulations/{id}/revisions"
    shared_operations:
      - "GET /raw-materials, GET /formulations, GET /formulations/{id}/components, GET /product-skus, GET /product-skus/{id}/cost-summary, GET /test-panels, GET /test-panels/{id}/results, GET /design-licenses"
    denied_examples:
      - "POST /formulations/{id}/review-decision -> ERR_UNAUTHORIZED"
      - "POST /product-skus/{id}/certify -> ERR_UNAUTHORIZED"

  - role: TechnicalDirector
    user_id_semantics: opaque
    description: "Approves recipes, certifies SKUs, terminates and amends licenses."
    exclusive_operations:
      - "POST /formulations/{id}/review-decision"
      - "POST /product-skus/{id}/certify"
      - "POST /design-licenses/{id}/amendments"
    shared_operations:
      - "POST /design-licenses/{id}/status (TERMINATED only, per V-RBAC-2)"
      - "GET /formulations, GET /formulations/{id}/components, GET /product-skus, GET /product-skus/{id}/cost-summary, GET /design-licenses, GET /design-licenses/{id}/utilization, GET /print-films, GET /test-panels, GET /test-panels/{id}/results, GET /production-runs"
    sod_rules:
      - "S1: may not review a recipe whose authored_by_user_id equals X-User-ID"
      - "S2: may not certify a SKU using a TestResult that X-User-ID recorded"
    denied_examples:
      - "POST /product-skus -> ERR_UNAUTHORIZED"
      - "POST /production-runs -> ERR_UNAUTHORIZED"

  - role: QaTechnician
    user_id_semantics: opaque
    description: "Runs the laboratory, dispositions runs and controls stock holds."
    exclusive_operations:
      - "POST /test-panels"
      - "POST /test-panels/{id}/start"
      - "POST /test-panels/{id}/results"
      - "POST /test-panels/{id}/void"
      - "POST /product-skus/{id}/begin-testing"
      - "POST /production-runs/{id}/qc-disposition"
      - "POST /batches/{id}/hold-status"
    shared_operations:
      - "GET /raw-materials, GET /formulations, GET /product-skus, GET /press-lines, GET /print-films, GET /test-panels, GET /test-panels/{id}/results, GET /production-runs, GET /batches, GET /batches/{id}/allocation-lines, GET /warranty-claims"
    sod_rules:
      - "S3: may not release a hold that X-User-ID placed"
    denied_examples:
      - "POST /product-skus/{id}/certify -> ERR_UNAUTHORIZED"
      - "POST /production-runs/{id}/complete -> ERR_UNAUTHORIZED"

  - role: ProductionPlanner
    user_id_semantics: opaque
    description: "Schedules and executes press and calender line runs."
    exclusive_operations:
      - "POST /production-runs"
      - "POST /production-runs/{id}/setup"
      - "POST /production-runs/{id}/start"
      - "POST /production-runs/{id}/complete"
      - "POST /production-runs/{id}/abort"
    shared_operations:
      - "GET /distributors, GET /formulations, GET /product-skus, GET /press-lines, GET /print-films, GET /design-licenses, GET /design-licenses/{id}/utilization, GET /production-runs, GET /batches, GET /batches/{id}/allocation-lines, GET /allocations, GET /allocations/{id}/lines"
    denied_examples:
      - "POST /production-runs/{id}/qc-disposition -> ERR_UNAUTHORIZED"
      - "POST /batches/{id}/hold-status -> ERR_UNAUTHORIZED"

  - role: WarrantyAdjuster
    user_id_semantics: opaque
    description: "Triages, reviews and adjudicates warranty claims."
    exclusive_operations:
      - "POST /warranty-claims/{id}/triage"
      - "POST /warranty-claims/{id}/reviews"
      - "POST /warranty-claims/{id}/adjudicate"
    shared_operations:
      - "POST /warranty-claims"
      - "GET /distributors, GET /batches, GET /warranty-claims"
    sod_rules:
      - "S4: may not adjudicate a claim whose assigned_adjuster_user_id equals X-User-ID"
    denied_examples:
      - "POST /batches/{id}/hold-status -> ERR_UNAUTHORIZED"
      - "POST /product-skus -> ERR_UNAUTHORIZED"

  - role: Distributor
    user_id_semantics: "entity_backed:Distributor — X-User-ID must equal a Distributor.id"
    description: "Requests and fills stock allocations and files warranty claims for its own account."
    exclusive_operations:
      - "POST /allocations/{id}/fill"
      - "POST /allocations/{id}/release"
    shared_operations:
      - "POST /allocations"
      - "POST /warranty-claims"
      - "GET /product-skus, GET /batches, GET /batches/{id}/allocation-lines, GET /allocations, GET /allocations/{id}/lines, GET /warranty-claims"
    ownership_rules:
      - "V-OWN-1 / V-OWN-2: every allocation and claim the role touches must carry distributor_id == X-User-ID"
    denied_examples:
      - "POST /product-skus -> ERR_UNAUTHORIZED"
      - "POST /production-runs -> ERR_UNAUTHORIZED"
      - "POST /warranty-claims/{id}/adjudicate -> ERR_UNAUTHORIZED"
