            - "ARM 2, everything is final on the very next reads with no second call needed: b_status1 == \"EXPIRED\", bed_status1 == \"AVAILABLE\", p_status1 == \"EXPIRED\", and b_proj1 == 675 because the frozen quantum is retained on the expired row — it is the exact amount credited back."
            - "ARM 2, ledger view: the post-sweep capacity-summary for 2026-08-02 returns held_bed_minutes 0, held_ldr_beds 0, available_ldr_beds 2, remaining_bed_minutes 2880 and last_capacity_sweep_at \"2026-08-02T06:00:00Z\" — the credit-back moved exactly projected_occupancy_minutes, not an amount recomputed from the current buffer."
            - "ARM 3 — the second identical sweep is a no-op, not a replay: the SECOND capacity-sweep returns beds_cleared_count 0, promoted_count 0, swept_at \"2026-08-02T06:00:00Z\", staffing_posture \"RATIO_STRAINED\" and every id array empty, no error is raised, b_status2 == \"EXPIRED\", and the final capacity-summary still reports held_bed_minutes 0 and available_ldr_beds 2 — the bed-minutes were not credited twice into negative territory."

      - name: read_your_writes_on_the_two_computed_report_endpoints
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model=immediate
          - endpoints[GET /labor-encounters/{encounterId}/coverage-summary]
          - endpoints[GET /obstetric-units/{unitId}/coverage-report]
        excluded_because:
          difficulty_instance: corner:endpoints / encounter_coverage_summary_read_agrees_with_the_stored_assignment_and_shift_ledger
          rationale: >
            The `immediate` model's read-your-writes obligation for the COMPUTED reads (as opposed to the
            stored rows) is already discharged there: that instance writes an assignment and then proves the
            encounter's coverage-summary agrees field-for-field with the stored CareAssignment and
            ShiftAssignment rows in the same instant, with no refresh and no sweep. The unit-level twin
            (coverage-report) is exercised the same way inside
            corner:consistency_model / a_four_entity_cascade_is_final_on_the_very_next_read_and_leaves_the_sweep_nothing_to_do,
            whose posture_reason moves NONE -> DEFICIT_POSITIVE on the call after the release. A third
            report-agreement instance would restate the same claim with different labels.

      - name: the_remaining_sweep_driven_edges_are_asserted_where_their_own_machines_are_walked
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model=immediate
          - endpoints[POST /obstetric-units/{unitId}/capacity-sweep]
          - state_machines[BundleChecklistItem].PENDING->MISSED
          - state_machines[FetalMonitoringAssessment].->TIMED_OUT_BREACH
          - state_machines[InductionBooking].BUMPED->{REQUESTED|EXPIRED}
          - state_machines[Bed].TURNOVER->AVAILABLE
        excluded_because:
          difficulty_instance: corner:errors / both_support_pass_ids_from_four_reentry_laps_and_one_pass_that_expires_without_a_sweep
          rationale: >
            §1.9 already walks each of the other sweep-driven edges at the place its own machine is
            exercised, and each of those walks carries the same "nothing happens until the sweep is called"
            shape: the cited instance for pass expiry; corner:errors / five_fetal_escalation_ids_separate_across_the_14_1_8_10_11_2_and_11_3_rungs
            for the escalation chain's TIMED_OUT_BREACH and REASSESSMENT_PENDING -> ESCALATION_DUE re-arm;
            corner:errors / five_induction_lifecycle_ids_across_two_full_bump_laps_one_clock_advance_and_one_elective_38_week
            for the BUMPED requeue-or-expire fork; corner:state_machines / recording_a_cesarean_delivery_cascades_into_delivery_fields_snapshots_and_the_or_bed
            for the TURNOVER -> AVAILABLE clear; and corner:calculations / an_idle_sweep_stamps_the_sweep_time_and_touches_nothing_that_is_not_yet_due
            for the not-yet-due case. Since §1.0 declares consistency_model `immediate`, the guide's
            `eventual` row (denormalised fields may lag; re-read after a delay) and `saga` row (compensate
            steps 1..N-1 when step N fails) are not claims about this scaffold at all — the closest
            analogues, write-free partial failure and full compensation, are asserted in
            corner:cross_cutting_complexity_layers / magnesium_step_completion_cascades_five_levels_from_one_checklist_item_to_a_frozen_induction_projection
            and in compensating_invariant / bundle_rescind_returns_the_shared_shift_load_to_1_3_not_to_zero_and_not_to_2_8.
