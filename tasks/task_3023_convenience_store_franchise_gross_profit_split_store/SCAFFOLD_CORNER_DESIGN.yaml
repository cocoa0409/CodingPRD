            - call: "POST /franchise/settlements/${setO_id}/revenue-lines"
              payload: { category: "MERCHANDISE", gross_sales_cents: 3000000, cost_of_goods_cents: 2000000, expected_settlement_version: "${setO_v1}" }
              as: FranchisorAdmin
          trigger:
            - call: "POST /franchise/settlements/${setO_id}/reconcile"
              payload: {}
              as: FranchisorAdmin
            - call: "POST /franchise/settlements/${setO_id}/reconcile"
              payload: {}
              as: FranchisorAdmin
            - call: "POST /franchise/settlements/${setO_id}/finalize"
              payload: {}
              as: FranchisorAdmin
          assert:
            - "Settlement.${setO_id}.net_settlement_cents == 500000.00"
            - "the older draw ${drOld_id} drawn on 2026-09-02 was recovered in full: DrawAdvance.${drOld_id}.status == RECOVERED and recovered_cents == 300000.00"
            - "the newer draw ${drNew_id} drawn on 2026-09-05 was only partially recovered: DrawAdvance.${drNew_id}.status == PARTIALLY_RECOVERED and recovered_cents == 200000.00"
            - "the waterfall stopped when the available cash hit 0 rather than spilling into the newer draw by id order"
            - "Settlement.${setO_id}.draw_recovery_cents == 500000.00"
            - "Franchisee.${frO_id}.draw_outstanding_cents == 100000.00"

      - name: renewal_eligibility_band_is_keyed_off_the_provisional_score_not_the_final_score
        claim_type: Correct Result
        grounds:
          - calculations.renewal_eligibility
          - entities.FranchiseAgreement.fields.renewal_eligibility_score
          - entities.FranchiseAgreement.fields.performance_tier
          - endpoints.POST_/franchise/agreements/{id}/open-renewal
        distinguishing_aspect: "The pinned order is observable at the band boundary: with no finalized settlements and no finalized audits in the term the provisional score is 10 + 30 + 20 = 60, which keys the MID band of 10000000, and the net-worth sub-score of 10 then lifts the FINAL score to 70 — keying the band off the final 70 instead would still give MID here, so the instance pins that 60 lands on the mid band rather than the 7500000 base band that a 54 would produce."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. One franchisee stating 30000000 cents, one ACTIVE store, and one DRAFT agreement for term 2025-01-01 to 2027-01-01 with renewal_window_days 180, so the window opened on 2026-07-05 and no settlement or audit exists for the term."
          setup_api_calls:
            - call: "POST /franchise/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FranchisorAdmin
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Willapa Operator LLC", owner_name: "Corinne Mbeki", stated_net_worth_cents: 30000000 }
              as: FranchisorAdmin
              captures: { frAB_id: $.data.id }
            - call: "POST /franchise/stores"
              payload: { franchisee_id: "${frAB_id}", store_number: "WA-1700", state_code: "WA", format: "SUBURBAN", opened_on: "2022-01-01T00:00:00Z", cold_chain_certified: true }
              as: FranchisorAdmin
              captures: { stAB_id: $.data.id }
            - call: "POST /franchise/agreements"
              payload: { franchisee_id: "${frAB_id}", store_id: "${stAB_id}", split_pct: 0.50, waste_share_pct: 0.50, shrink_responsibility_pct: 0.50, rebate_pass_pct: 1.0, minimum_net_worth_cents: 10000000, term_start: "2025-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z", renewal_window_days: 180 }
              as: FranchisorAdmin
              captures: { agAB_id: $.data.id }
            - call: "POST /franchise/agreements/${agAB_id}/activate"
              payload: {}
              as: FranchisorAdmin
          trigger:
            - call: "POST /franchise/agreements/${agAB_id}/open-renewal"
              payload: {}
              as: FranchisorAdmin
          assert:
            - "the open-renewal response status is 200 and FranchiseAgreement.${agAB_id}.status == RENEWAL_PENDING"
            - "FranchiseAgreement.${agAB_id}.renewal_eligibility_score == 70"
            - "the components are sales_activity_score 10 (no finalized settlement in the term), settlement_score 30 (no disputed settlement) and audit_score 20 (no finalized audit with a positive shrink), giving a provisional score of 60"
            - "the provisional 60 keys the MID band of 10000000, and the net-worth sub-score of 10 then makes the final score 70"
            - "FranchiseAgreement.${agAB_id}.performance_tier == STANDARD because no settlement has yet driven a tier promotion"
            - "posting the identical open-renewal again returns 409 ERR_INVALID_STATE because the agreement is no longer ACTIVE"

  # ===========================================================================
  - section: validations
    instances:

      - name: settlement_state_precondition_beats_the_no_open_agreement_rule_on_reconcile
        claim_type: Priority Ordering
        grounds:
          - validations[priority=6]
          - validations[priority=23]
          - validations[priority=32]
          - errors[ERR_INVALID_STATE]
          - endpoints.POST_/franchise/settlements/{id}/reconcile
        distinguishing_aspect: "The `state` vs `business_constraint` error-category pair, distinct from every §1.8 priority instance: a settlement already in RECONCILED whose store and agreement have since been TERMINATED fails three rules at once and returns ERR_INVALID_STATE from priority 6, not ERR_NO_OPEN_AGREEMENT from priority 23 nor ERR_STORE_NOT_ACTIVE from priority 32."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-16T00:00:00Z. One franchisee, one ACTIVE store, one ACTIVE agreement and one settlement for [2026-09-01, 2026-09-08) with a single SERVICES line 2000000/800000, driven through both reconcile steps into RECONCILED."
            - "The franchisee is then terminated, which cascades the store and agreement to TERMINATED; the RECONCILED settlement is not in {OPEN, DRAW_PAID} so the termination cascade leaves it untouched."
          setup_api_calls:
            - call: "POST /franchise/_clock/set_current_utc"
              payload: { current_utc: "2026-09-16T00:00:00Z" }
              as: FranchisorAdmin
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Kanawha Retail LLC", owner_name: "Iris Delacroix", stated_net_worth_cents: 30000000 }
              as: FranchisorAdmin
              captures: { frP_id: $.data.id }
            - call: "POST /franchise/stores"
              payload: { franchisee_id: "${frP_id}", store_number: "WV-1100", state_code: "WV", format: "RURAL", opened_on: "2022-01-01T00:00:00Z", cold_chain_certified: true }
              as: FranchisorAdmin
              captures: { stP_id: $.data.id, stP_v: $.data.version }
            - call: "POST /franchise/agreements"
              payload: { franchisee_id: "${frP_id}", store_id: "${stP_id}", split_pct: 0.50, waste_share_pct: 0.50, shrink_responsibility_pct: 0.50, rebate_pass_pct: 1.0, minimum_net_worth_cents: 10000000, term_start: "2025-01-01T00:00:00Z", term_end: "2030-01-01T00:00:00Z", renewal_window_days: 90 }
              as: FranchisorAdmin
              captures: { agP_id: $.data.id }
            - call: "POST /franchise/agreements/${agP_id}/activate"
              payload: {}
              as: FranchisorAdmin
            - call: "POST /franchise/settlements"
              payload: { store_id: "${stP_id}", franchisee_id: "${frP_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-08T00:00:00Z", trailing_avg_gross_profit_cents: 1000000, expected_store_version: "${stP_v}" }
              as: FranchisorAdmin
              captures: { setP_id: $.data.id, setP_v1: $.data.version }
            - call: "POST /franchise/settlements/${setP_id}/revenue-lines"
              payload: { category: "SERVICES", gross_sales_cents: 2000000, cost_of_goods_cents: 800000, expected_settlement_version: "${setP_v1}" }
              as: FranchisorAdmin
            - call: "POST /franchise/settlements/${setP_id}/reconcile"
              payload: {}
              as: FranchisorAdmin
            - call: "POST /franchise/settlements/${setP_id}/reconcile"
              payload: {}
              as: FranchisorAdmin
            - call: "POST /franchise/franchisees/${frP_id}/terminate"
              payload: {}
              as: FranchisorAdmin
          trigger:
            - call: "POST /franchise/settlements/${setP_id}/reconcile"
              payload: {}
              as: FranchisorAdmin
              captures: { err_priority: $.data.error_id }
          assert:
            - "the response status is 409 and err_priority == ERR_INVALID_STATE"
            - "err_priority != ERR_NO_OPEN_AGREEMENT and err_priority != ERR_STORE_NOT_ACTIVE"
            - "Settlement.${setP_id}.status is still RECONCILED"
            - "the request violated the priority-6 state rule, the priority-23 open-agreement rule and the priority-32 store-state rule, and the lowest priority number won"

      - name: window_lock_rule_beats_capacity_rule_on_a_locked_overfull_window
        claim_type: Priority Ordering
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_WINDOW_LOCKED]
          - errors[ERR_WINDOW_CAPACITY_EXCEEDED]
          - endpoints.POST_/franchise/fresh-orders
        distinguishing_aspect: "The `business_referential` vs `business_temporal` error-category pair, distinct from the state/business_constraint pair above and from every §1.8 pair: an order that is both booked into a LOCKED window and far over its capacity returns ERR_WINDOW_LOCKED from priority 9, not ERR_WINDOW_CAPACITY_EXCEEDED from priority 10."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One franchisee, one cold-chain-certified ACTIVE store, and a delivery window of capacity_units 500 that has already been LOCKED."
          setup_api_calls:
            - call: "POST /franchise/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: FranchisorAdmin
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Monongahela Stores LLC", owner_name: "Elias Fontaine", stated_net_worth_cents: 30000000 }
              as: FranchisorAdmin
              captures: { frQ_id: $.data.id }
            - call: "POST /franchise/stores"
              payload: { franchisee_id: "${frQ_id}", store_number: "WV-1101", state_code: "WV", format: "URBAN", opened_on: "2022-01-01T00:00:00Z", cold_chain_certified: true }
              as: FranchisorAdmin
              captures: { stQ_id: $.data.id }
            - call: "POST /franchise/delivery-windows"
              payload: { store_id: "${stQ_id}", commissary_code: "COMM-WV-1", day_of_week: "THU", window_start: "2026-09-10T06:00:00Z", window_end: "2026-09-10T10:00:00Z", capacity_units: 500 }
              as: FranchisorAdmin
              captures: { dwQ_id: $.data.id }
            - call: "POST /franchise/delivery-windows/${dwQ_id}/lock"
              payload: {}
              as: FranchisorAdmin
          trigger:
            - call: "POST /franchise/fresh-orders"
              payload: { store_id: "${stQ_id}", delivery_window_id: "${dwQ_id}", sku_code: "SKU-Q1", ordered_units: 9000, unit_cost_cents: 320 }
              as: Franchisee
              as_user_id: "${frQ_id}"
              captures: { err_priority: $.data.error_id }
          assert:
            - "the response status is 409 and err_priority == ERR_WINDOW_LOCKED"
            - "err_priority != ERR_WINDOW_CAPACITY_EXCEEDED"
            - "the cold-chain check passed, so priority 8 did not fire"
            - "GET /franchise/fresh-orders?delivery_window_id=${dwQ_id} returns 0 rows and DeliveryWindow.${dwQ_id}.reserved_units == 0"

      - name: franchisee_scoped_endpoints_enforce_ownership_not_just_role
        claim_type: Violation to Error
        grounds:
          - validations[priority=35]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - endpoints.POST_/franchise/fresh-orders/{id}/cancel
        distinguishing_aspect: "Priority 35 fires only after the priority-34 role check passes: a franchisee holding the correct Franchisee role but naming a DIFFERENT franchisee's store on the cancel call is rejected 403 ERR_NOT_RESOURCE_OWNER, not ERR_FORBIDDEN and not ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Two franchisees, each with its own cold-chain-certified store and SCHEDULED window, and a PLACED order owned by the first."
          setup_api_calls:
            - call: "POST /franchise/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: FranchisorAdmin
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Owner Franchisee LLC", owner_name: "Nadia Ferraro", stated_net_worth_cents: 30000000 }
              as: FranchisorAdmin
              captures: { frOwner_id: $.data.id }
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Rival Franchisee LLC", owner_name: "Chuck Beaulieu", stated_net_worth_cents: 30000000 }
              as: FranchisorAdmin
              captures: { frRival_id: $.data.id }
            - call: "POST /franchise/stores"
              payload: { franchisee_id: "${frOwner_id}", store_number: "MI-9001", state_code: "MI", format: "URBAN", opened_on: "2022-01-01T00:00:00Z", cold_chain_certified: true }
              as: FranchisorAdmin
              captures: { stOwner_id: $.data.id }
            - call: "POST /franchise/delivery-windows"
              payload: { store_id: "${stOwner_id}", commissary_code: "COMM-MI-1", day_of_week: "MON", window_start: "2026-09-14T06:00:00Z", window_end: "2026-09-14T10:00:00Z", capacity_units: 500 }
              as: FranchisorAdmin
              captures: { dwOwner_id: $.data.id }
            - call: "POST /franchise/fresh-orders"
              payload: { store_id: "${stOwner_id}", delivery_window_id: "${dwOwner_id}", sku_code: "SKU-R1", ordered_units: 120, unit_cost_cents: 240 }
              as: Franchisee
              as_user_id: "${frOwner_id}"
              captures: { foOwner_id: $.data.id }
          trigger:
            - call: "POST /franchise/fresh-orders/${foOwner_id}/cancel"
              payload: {}
              as: Franchisee
              as_user_id: "${frRival_id}"
              captures: { err_owner: $.data.error_id }
          assert:
            - "the response status is 403 and err_owner == ERR_NOT_RESOURCE_OWNER"
            - "err_owner != ERR_FORBIDDEN — the rival holds the Franchisee role, so the role check passed"
            - "FreshOrder.${foOwner_id}.status is still PLACED"
            - "DeliveryWindow.${dwOwner_id}.reserved_units == 120 unchanged"

  # ===========================================================================
  - section: endpoints
