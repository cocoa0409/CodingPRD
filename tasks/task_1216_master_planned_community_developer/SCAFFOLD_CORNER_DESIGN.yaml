              as: DeclarantController
              captures: { d_id: $.data.id }
            - call: "GET /mpc/districts/${d_id}"
              as: DeclarantController
              captures: { prov0: $.data.provisional_interest_cents }
          trigger:
            - call: "POST /mpc/line-items"
              payload: { budget_id: "${bud_id}", category: "MANAGEMENT", amount_cents: 100000 }
              as: DeclarantController
            - call: "GET /mpc/budgets/${bud_id}"
