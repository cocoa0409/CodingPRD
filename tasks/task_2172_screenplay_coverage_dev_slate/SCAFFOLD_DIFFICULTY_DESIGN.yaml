              as: BusinessAffairs
            - call: "POST /literary-properties/${p_id}/rights-documents"
              payload: { doc_type: "WGA_REGISTRATION", executed_on: "2026-01-22", verified: true }
              as: BusinessAffairs
            - call: "GET /literary-properties/${p_id}"
              payload: {}
              as: BusinessAffairs
              captures: { p_v: "$.data.version" }
            - call: "POST /option-agreements"
              payload: { property_id: "${p_id}", expected_property_version: "${p_v}", option_fee_cents: 5000000, purchase_price_cents: 90000000, initial_period_months: 18, option_start_at: "2026-09-01T00:00:00Z" }
              as: BusinessAffairs
              captures: { o_id: "$.data.id" }
            - call: "POST /option-agreements/${o_id}/execute"
              payload: {}
              as: BusinessAffairs
            - call: "POST /development-projects"
              payload: { property_id: "${p_id}", option_agreement_id: "${o_id}", budget_cents: 2000000000, slate_year: 2028 }
              as: DevelopmentExec
              as_user_id: "exec-alpha"
              captures: { proj_id: "$.data.id", proj_v: "$.data.version" }
            - call: "POST /writers"
              payload: { name: "W1 Ferrante", guild_member: true, quote_cents: 10000000 }
              as: SlateAdmin
              captures: { w1_id: "$.data.id" }
            - call: "POST /writer-engagements"
              payload: { project_id: "${proj_id}", writer_id: "${w1_id}", engagement_type: "ORIGINAL_DRAFT", total_fee_cents: 10000003, start_date: "2026-09-05", end_date: "2027-01-05", expected_project_version: "${proj_v}" }
              as: DevelopmentExec
              as_user_id: "exec-alpha"
              captures: { e1_id: "$.data.id" }
            - call: "POST /writer-engagements/${e1_id}/attach"
              payload: {}
              as: DevelopmentExec
              as_user_id: "exec-alpha"
          trigger:
            - call: "POST /writer-engagements/${e1_id}/terminate"
              payload: { reason: "Creative differences." }
              as: DevelopmentExec
