            - *k_jc_split
            - *k_jc_admin
            - *k_w_coord
            - *k_w_admin
            - *k_w_rn
            - *k_sub
            - *k_pr_0401
            - *k_entry_0401
            - call: "POST /hour-entries"
              payload: { submission_id: "${sub}", worker_id: "${w_rn}", job_category_id: "${jc_rn}", work_date: "2026-04-02", shift_start: "07:00", shift_end: "19:00", allocations: [{ job_category_id: "${jc_rn}", percent: 100.00 }], expected_submission_version: "${sv2}" }
              as: StaffingCoordinator
