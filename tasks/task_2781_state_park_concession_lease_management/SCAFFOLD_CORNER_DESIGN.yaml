# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Scaffold Corner Design
# Task: 2781 State Park Concession & Lease Management
#
# Breadth probe over the claim-extraction-guide's nine sections, walked against
# this scaffold's §1.1–§1.7 surface. §1.8 (SCAFFOLD_DIFFICULTY_DESIGN.yaml) is
# the depth probe; corners it already asserts appear here as `excluded_because:`
# stubs naming the covering §1.8 instance.
#
# Every `setup_api_calls` / `trigger` chain composes only §1.5 endpoints, binds
# every ${var} from an earlier `captures:`, and asserts literal values computed
# from §1.3.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: park_creation_returns_201_with_benchmark_rates_and_zero_closure_count
        claim_type: creation
        grounds:
          - entities.Park
          - endpoints.POST_/parks
        distinguishing_aspect: "A park created with all six required inputs returns 201 and echoes every input, with open_closure_window_count seeded to 0 and status seeded to OPERATING."
        test_recipe:
          setup:
            - "Empty database; the logical clock is positioned at 2027-01-05."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /parks"
              payload: { name: "Whitewater Gorge State Park", region_code: "SE", annual_visitation: 315000, comparable_lodging_rate_cents: 17500, comparable_meal_rate_cents: 2800, comparable_activity_rate_cents: 6400 }
              as: ProgramAdministrator
              captures: { park_id: $.data.id }
          assert:
            - "HTTP 201"
            - "data.name == Whitewater Gorge State Park"
            - "data.region_code == SE"
            - "data.annual_visitation == 315000"
            - "data.comparable_lodging_rate_cents == 17500"
            - "data.comparable_meal_rate_cents == 2800"
            - "data.comparable_activity_rate_cents == 6400"
            - "data.open_closure_window_count == 0"
            - "data.status == OPERATING"
            - "data.version == 1"
            - "data.id is a non-empty string minted by the server"

      - name: park_retrieval_returns_the_stored_row_unchanged
        claim_type: retrieval
        grounds:
          - endpoints.GET_/parks/{id}
          - entities.Park
        distinguishing_aspect: "GET /parks/{id} returns exactly the row POST /parks stored, including the seeded computed and system fields, with no version bump from the read."
        test_recipe:
          setup:
            - "One park registered at clock 2027-01-05."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /parks"
              payload: { name: "Whitewater Gorge State Park", region_code: "SE", annual_visitation: 315000, comparable_lodging_rate_cents: 17500, comparable_meal_rate_cents: 2800, comparable_activity_rate_cents: 6400 }
              as: ProgramAdministrator
              captures: { park_id: $.data.id }
          trigger:
            - call: "GET /parks/${park_id}"
              payload: {}
              as: ConcessionSpecialist
          assert:
            - "HTTP 200"
            - "response_type == object"
            - "data.id == ${park_id}"
            - "data.region_code == SE"
            - "data.comparable_lodging_rate_cents == 17500"
            - "data.open_closure_window_count == 0"
            - "data.version == 1"

      - name: offeror_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_/offerors
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Three offerors exist; limit 2 / offset 0 returns 2 rows with total_count 3 and has_more true, and limit 2 / offset 2 returns the remaining 1 row with has_more false — total_count reports the unpaginated count, not the page size."
        test_recipe:
          setup:
            - "Three offerors registered at clock 2027-01-05, all ELIGIBLE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /offerors"
              payload: { legal_name: "Alder Ridge Outfitters LLC", contact_email: "bids@alderridge.example", bond_capacity_cents: 40000000 }
              as: ProgramAdministrator
              captures: { off_a_id: $.data.id }
            - call: "POST /offerors"
              payload: { legal_name: "Basin Marina Group Inc", contact_email: "bids@basinmarina.example", bond_capacity_cents: 60000000 }
              as: ProgramAdministrator
              captures: { off_b_id: $.data.id }
            - call: "POST /offerors"
              payload: { legal_name: "Cedar Hollow Hospitality LLC", contact_email: "ops@cedarhollow.example", bond_capacity_cents: 50000000 }
              as: ProgramAdministrator
              captures: { off_c_id: $.data.id }
          trigger:
            - call: "GET /offerors"
              payload: { limit: 2, offset: 0 }
              as: ContractingOfficer
              as_user_id: "officer-award-01"
            - call: "GET /offerors"
              payload: { limit: 2, offset: 2 }
              as: ContractingOfficer
              as_user_id: "officer-award-01"
          assert:
            - "first trigger call: HTTP 200 with response_type == array"
            - "first trigger call: total_count == 3"
            - "first trigger call: has_more == true"
            - "first trigger call: exactly 2 rows returned"
            - "second trigger call: total_count == 3"
            - "second trigger call: has_more == false"
            - "second trigger call: exactly 1 row returned"

      - name: lease_get_with_unknown_id_returns_lease_not_found
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_LEASE_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid but unassigned lease id on GET /leases/{id} yields 404 ERR_LEASE_NOT_FOUND, not an empty 200 body."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "GET /leases/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ContractingOfficer
              as_user_id: "officer-award-01"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404"
            - "response_type == error"
            - "data.error_id == ERR_LEASE_NOT_FOUND"
            - "data.message is a non-empty string"

      - name: prospectus_create_missing_required_scoring_mode_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=6]
          - errors[ERR_INVALID_REQUEST]
          - endpoints.POST_/prospectuses
        distinguishing_aspect: "scoring_mode has source input and no default, so omitting it is a 400 ERR_INVALID_REQUEST — it must not silently fall back to PER_CRITERION_ROUNDING."
        test_recipe:
          setup:
            - "One park and one opportunity whose market analysis has been filed, so the parent reference resolves and only the missing field can fail."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /parks"
              payload: { name: "Cedar Hollow State Park", region_code: "NW", annual_visitation: 480000, comparable_lodging_rate_cents: 20000, comparable_meal_rate_cents: 3000, comparable_activity_rate_cents: 9000 }
              as: ProgramAdministrator
              captures: { park_id: $.data.id }
            - call: "POST /concession-opportunities"
              payload: { park_id: "${park_id}", title: "Cedar Hollow Lodge Concession", service_category: "LODGING", required_capital_investment_cents: 30000000 }
              as: ConcessionSpecialist
              captures: { opp_id: $.data.id }
            - call: "POST /concession-opportunities/${opp_id}/market-analysis"
              payload: { comparable_gross_receipts_cents: 200000000, market_capture_pct: 80.00 }
              as: ConcessionSpecialist
          trigger:
            - call: "POST /prospectuses"
              payload: { opportunity_id: "${opp_id}", minimum_franchise_fee_pct: 4.00, minimum_annual_guarantee_cents: 6000000, term_years: 10, submission_deadline: "2027-02-01T00:00:00Z", weight_experience: 20, weight_operating_plan: 25, weight_capital_investment: 20, weight_financial_capacity: 15, weight_fee_offer: 20, min_technical_score: 70.00 }
              as: ConcessionSpecialist
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 400"
            - "data.error_id == ERR_INVALID_REQUEST"
            - "no Prospectus row exists with opportunity_id == ${opp_id}"

      - name: opportunity_create_defaults_market_fields_to_null_and_status_to_draft
        claim_type: defaults
        grounds:
          - entities.ConcessionOpportunity.fields.comparable_gross_receipts_cents
          - entities.ConcessionOpportunity.fields.market_capture_pct
          - entities.ConcessionOpportunity.fields.estimated_annual_gross_receipts_cents
          - entities.ConcessionOpportunity.fields.analyst_note
          - entities.ConcessionOpportunity.fields.status
        distinguishing_aspect: "Creating an opportunity without any market-analysis input leaves comparable_gross_receipts_cents, market_capture_pct, estimated_annual_gross_receipts_cents and analyst_note at their declared null defaults and status at DRAFT — the projection is not computed from absent inputs as 0."
        test_recipe:
          setup:
            - "One park registered at clock 2027-01-05."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /parks"
              payload: { name: "Cedar Hollow State Park", region_code: "NW", annual_visitation: 480000, comparable_lodging_rate_cents: 20000, comparable_meal_rate_cents: 3000, comparable_activity_rate_cents: 9000 }
              as: ProgramAdministrator
              captures: { park_id: $.data.id }
          trigger:
            - call: "POST /concession-opportunities"
              payload: { park_id: "${park_id}", title: "Cedar Hollow Marina Concession", service_category: "MARINA", required_capital_investment_cents: 12000000 }
              as: ConcessionSpecialist
              captures: { opp_id: $.data.id }
          assert:
            - "HTTP 201"
            - "data.status == DRAFT"
            - "data.comparable_gross_receipts_cents == null"
            - "data.market_capture_pct == null"
            - "data.estimated_annual_gross_receipts_cents == null"
            - "data.analyst_note == null"
            - "data.service_category == MARINA"
            - "data.required_capital_investment_cents == 12000000"
            - "data.version == 1"

      - name: market_analysis_projection_computes_estimated_annual_gross_receipts
        claim_type: computed_fields
        grounds:
          - calculations.market_analysis_projection
          - entities.ConcessionOpportunity.fields.estimated_annual_gross_receipts_cents
          - state_machines.ConcessionOpportunity.DRAFT_to_ANALYSIS_COMPLETE
        distinguishing_aspect: "123,456,789 comparable receipts at 37.50% capture is 46,296,295.875 cents, so the stored projection must be the round_half_up value 46,296,296 — truncation would store 46,296,295."
        test_recipe:
          setup:
            - "One park and one DRAFT opportunity at clock 2027-01-05."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /parks"
              payload: { name: "Cedar Hollow State Park", region_code: "NW", annual_visitation: 480000, comparable_lodging_rate_cents: 20000, comparable_meal_rate_cents: 3000, comparable_activity_rate_cents: 9000 }
              as: ProgramAdministrator
              captures: { park_id: $.data.id }
            - call: "POST /concession-opportunities"
              payload: { park_id: "${park_id}", title: "Cedar Hollow Trading Post", service_category: "RETAIL", required_capital_investment_cents: 8000000 }
              as: ConcessionSpecialist
              captures: { opp_id: $.data.id }
          trigger:
            - call: "POST /concession-opportunities/${opp_id}/market-analysis"
              payload: { comparable_gross_receipts_cents: 123456789, market_capture_pct: 37.50, analyst_note: "Regional gift-shop comparables, shoulder-season adjusted." }
              as: ConcessionSpecialist
          assert:
            - "HTTP 200"
            - "data.estimated_annual_gross_receipts_cents == 46296296"
            - "data.comparable_gross_receipts_cents == 123456789"
            - "data.market_capture_pct == 37.50"
            - "data.analyst_note == Regional gift-shop comparables, shoulder-season adjusted."
            - "data.status == ANALYSIS_COMPLETE"

      - name: offeror_create_with_client_supplied_status_and_id_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Offeror.fields.status
          - endpoints.POST_/offerors
        distinguishing_aspect: "id, created_at, updated_at, version and status are system-sourced on Offeror, so a client that posts them alongside the real inputs must see them discarded: the row is ELIGIBLE at version 1 with a server-minted id, never the submitted DEBARRED / fixed id."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /offerors"
              payload: { legal_name: "Basin Marina Group Inc", contact_email: "bids@basinmarina.example", bond_capacity_cents: 60000000, status: "DEBARRED", id: "client-chosen-id", version: 99 }
              as: ProgramAdministrator
              captures: { off_id: $.data.id }
          assert:
            - "HTTP 201"
            - "data.status == ELIGIBLE"
            - "data.version == 1"
            - "data.id != client-chosen-id"
            - "data.legal_name == Basin Marina Group Inc"
            - "data.bond_capacity_cents == 60000000"

      - name: park_create_with_unknown_region_code_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - validations[priority=6]
          - errors[ERR_INVALID_REQUEST]
          - entities.Park.fields.region_code
        distinguishing_aspect: "region_code is an enum over exactly {NW, NE, SW, SE}; the plausible-looking value CENTRAL is a 400 ERR_INVALID_REQUEST rather than an accepted free-text region."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /parks"
              payload: { name: "Prairie Bend State Park", region_code: "CENTRAL", annual_visitation: 210000, comparable_lodging_rate_cents: 15000, comparable_meal_rate_cents: 2500, comparable_activity_rate_cents: 5000 }
              as: ProgramAdministrator
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 400"
            - "data.error_id == ERR_INVALID_REQUEST"
            - "no Park row named Prairie Bend State Park exists"

      - name: proposal_evaluation_row_carries_no_version_and_has_no_update_endpoint
        claim_type: immutability
        grounds:
          - entities.ProposalEvaluation
          - endpoints.GET_/proposal-evaluations/{id}
        distinguishing_aspect: "ProposalEvaluation is declared common_fields: false, so a filed score sheet exposes no version field and §1.5 offers no write endpoint that can alter it — the only way to change a panel's arithmetic is to file the second sheet."
        test_recipe:
          setup:
            - "A prospectus is ISSUED with one SUBMITTED proposal moved to UNDER_REVIEW, and panelist-01 has filed one score sheet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /parks"
              payload: { name: "Cedar Hollow State Park", region_code: "NW", annual_visitation: 480000, comparable_lodging_rate_cents: 20000, comparable_meal_rate_cents: 3000, comparable_activity_rate_cents: 9000 }
              as: ProgramAdministrator
              captures: { park_id: $.data.id }
            - call: "POST /offerors"
              payload: { legal_name: "Cedar Hollow Hospitality LLC", contact_email: "ops@cedarhollow.example", bond_capacity_cents: 50000000 }
              as: ProgramAdministrator
              captures: { offeror_id: $.data.id }
            - call: "POST /concession-opportunities"
              payload: { park_id: "${park_id}", title: "Cedar Hollow Lodge Concession", service_category: "LODGING", required_capital_investment_cents: 30000000 }
              as: ConcessionSpecialist
              captures: { opp_id: $.data.id }
            - call: "POST /concession-opportunities/${opp_id}/market-analysis"
              payload: { comparable_gross_receipts_cents: 200000000, market_capture_pct: 80.00 }
              as: ConcessionSpecialist
            - call: "POST /concession-opportunities/${opp_id}/approve-solicitation"
              payload: {}
              as: ContractingOfficer
              as_user_id: "officer-award-01"
            - call: "POST /prospectuses"
              payload: { opportunity_id: "${opp_id}", minimum_franchise_fee_pct: 4.00, minimum_annual_guarantee_cents: 6000000, term_years: 10, submission_deadline: "2027-02-01T00:00:00Z", weight_experience: 20, weight_operating_plan: 25, weight_capital_investment: 20, weight_financial_capacity: 15, weight_fee_offer: 20, scoring_mode: "PER_CRITERION_ROUNDING", min_technical_score: 70.00 }
              as: ConcessionSpecialist
              captures: { pros_id: $.data.id }
            - call: "POST /prospectuses/${pros_id}/issue"
              payload: {}
              as: ConcessionSpecialist
            - call: "POST /proposals"
              payload: { prospectus_id: "${pros_id}", offeror_id: "${offeror_id}", offered_franchise_fee_pct: 5.00, proposed_capital_investment_cents: 30000000, proposed_annual_guarantee_cents: 6000000, experience_years: 12, financial_capacity_ratio: 1.80 }
              as: Concessionaire
              as_user_id: "${offeror_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /proposals/${prop_id}/begin-review"
              payload: {}
              as: ConcessionSpecialist
            - call: "POST /proposals/${prop_id}/evaluations"
              payload: { score_experience: 81, score_operating_plan: 86, score_capital_investment: 91, score_financial_capacity: 76, score_fee_offer: 71 }
              as: EvaluationPanelist
              as_user_id: "panelist-01"
              captures: { eval_id: $.data.id }
          trigger:
            - call: "GET /proposal-evaluations/${eval_id}"
              payload: {}
              as: AuditorGeneral
              as_user_id: "auditor-01"
          assert:
            - "HTTP 200"
            - "data.proposal_id == ${prop_id}"
            - "data.panelist_user_id == panelist-01"
            - "data.score_experience == 81"
            - "data.score_fee_offer == 71"
            - "the response carries no version field and no updated_at field"
            - "§1.5 declares no PATCH, PUT or DELETE on /proposal-evaluations/{id}"

      - name: opportunity_create_with_unknown_park_id_returns_park_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=4]
          - errors[ERR_PARK_NOT_FOUND]
          - endpoints.POST_/concession-opportunities
        distinguishing_aspect: "The park_id foreign key on ConcessionOpportunity is resolved before any field validation, so an unassigned park id yields 404 ERR_PARK_NOT_FOUND rather than 400 or a dangling row."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock — no park has ever been registered."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /concession-opportunities"
              payload: { park_id: "00000000-0000-4000-8000-0000000000aa", title: "Phantom Park Lodge", service_category: "LODGING", required_capital_investment_cents: 30000000 }
              as: ConcessionSpecialist
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404"
            - "data.error_id == ERR_PARK_NOT_FOUND"
            - "no ConcessionOpportunity row exists"

      - name: capital_improvement_create_with_unknown_lease_id_returns_lease_not_found
        claim_type: foreign_key_integrity
        grounds:
          - validations[priority=4]
          - errors[ERR_LEASE_NOT_FOUND]
          - complexity_profile.entity_topology
        distinguishing_aspect: "The topology is flat, so CapitalImprovement.lease_id is the only route to a park and a lease; an unresolvable lease_id must be caught at priority 4 before the ownership check at 5 or the ACTIVE check at 11 can run."
        test_recipe:
          setup:
            - "One offeror exists so the acting concessionaire identity is real, but no lease has ever been awarded."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /offerors"
              payload: { legal_name: "Cedar Hollow Hospitality LLC", contact_email: "ops@cedarhollow.example", bond_capacity_cents: 50000000 }
              as: ProgramAdministrator
              captures: { offeror_id: $.data.id }
          trigger:
            - call: "POST /capital-improvements"
              payload: { lease_id: "00000000-0000-4000-8000-0000000000bb", description: "Phantom boathouse", funding_source: "CONCESSIONAIRE_CAPITAL", proposed_cost_cents: 5000000, useful_life_years: 20, construction_window_start: "2027-04-01", construction_window_end: "2027-07-01", ownership_at_expiration: "AGENCY" }
              as: Concessionaire
              as_user_id: "${offeror_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404"
            - "data.error_id == ERR_LEASE_NOT_FOUND"
            - "no CapitalImprovement row exists"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: prospectus_issue_moves_draft_to_issued_and_solicits_the_opportunity
        claim_type: valid_transition
        grounds:
          - state_machines.Prospectus.DRAFT_to_ISSUED
          - state_machines.ConcessionOpportunity.APPROVED_FOR_SOLICITATION_to_SOLICITED
        distinguishing_aspect: "With the opportunity already APPROVED_FOR_SOLICITATION and the clock before the submission deadline, issue succeeds: the prospectus becomes ISSUED and the opportunity moves on to SOLICITED in the same request."
        test_recipe:
          setup:
            - "A park, an opportunity whose analysis projects 160,000,000 and which a contracting officer approved for solicitation, and a DRAFT prospectus with normalized weights and a 2027-02-01T00:00:00Z deadline. The clock is 2027-01-05."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /parks"
              payload: { name: "Cedar Hollow State Park", region_code: "NW", annual_visitation: 480000, comparable_lodging_rate_cents: 20000, comparable_meal_rate_cents: 3000, comparable_activity_rate_cents: 9000 }
              as: ProgramAdministrator
              captures: { park_id: $.data.id }
            - call: "POST /concession-opportunities"
              payload: { park_id: "${park_id}", title: "Cedar Hollow Lodge Concession", service_category: "LODGING", required_capital_investment_cents: 30000000 }
              as: ConcessionSpecialist
              captures: { opp_id: $.data.id }
            - call: "POST /concession-opportunities/${opp_id}/market-analysis"
              payload: { comparable_gross_receipts_cents: 200000000, market_capture_pct: 80.00 }
              as: ConcessionSpecialist
            - call: "POST /concession-opportunities/${opp_id}/approve-solicitation"
              payload: {}
              as: ContractingOfficer
              as_user_id: "officer-award-01"
            - call: "POST /prospectuses"
              payload: { opportunity_id: "${opp_id}", minimum_franchise_fee_pct: 4.00, minimum_annual_guarantee_cents: 6000000, term_years: 10, submission_deadline: "2027-02-01T00:00:00Z", weight_experience: 20, weight_operating_plan: 25, weight_capital_investment: 20, weight_financial_capacity: 15, weight_fee_offer: 20, scoring_mode: "PER_CRITERION_ROUNDING", min_technical_score: 70.00 }
              as: ConcessionSpecialist
              captures: { pros_id: $.data.id }
          trigger:
            - call: "POST /prospectuses/${pros_id}/issue"
              payload: {}
              as: ConcessionSpecialist
          assert:
            - "HTTP 200"
            - "data.status == ISSUED"
            - "data.version == 2"
            - "ConcessionOpportunity.${opp_id}.status == SOLICITED"
            - "ConcessionOpportunity.${opp_id}.estimated_annual_gross_receipts_cents == 160000000"

