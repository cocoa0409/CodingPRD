  # =========================================================================
  # SECTION 6 — ERRORS
  #
  # Table 6 of the guide is a coverage obligation rather than a taxonomy: every id
  # in §1.6 must be triggerable. The instances below batch the ids §1.8 and the
  # earlier §1.9 sections do not already exercise, grouped by error family so each
  # batch shares one fixture. The auth family (ERR_UNAUTHENTICATED,
  # ERR_ROLE_NOT_PERMITTED, ERR_IDENTITY_REQUIRED, ERR_EXHIBITOR_SCOPE_VIOLATION,
  # the three ERR_SOD_* ids and ERR_DISCOUNT_APPROVAL_REQUIRED) is covered in the
  # rbac section; ERR_STALE_VENUE_CONTRACT_VERSION in the cross-cutting section.
  # =========================================================================
  - section: errors
    instances:

      - name: every_missing_reference_reports_its_own_entity_not_found
        claim_type: error_triggerable
        grounds:
          - validations[priority=9]
          - validations[priority=13]
          - validations[priority=14]
          - validations[priority=15]
