  - rule_id: boundary_precision_check
    instances:
      - name: sla_not_breached_exactly_at_deadline
        grounds:
          - calculations.sla_breach_sweep
          - entities.ServiceRequest.fields.sla_breached
        distinguishing_aspect: |
          Time-threshold boundary on POST /_clock/advance: at clock_now == sla_deadline_at the strict
          comparison now > deadline is false, so sla_breached stays false and zero escalations fire —
          the exact-deadline tick is NOT a breach.
        test_recipe:
          setup:
            - "Request routed at 2026-06-01T08:00:00Z, STANDARD 24h SLA (deadline 2026-06-02T08:00:00Z); clock advanced exactly 24h to the deadline instant."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: SystemAdmin
            - call: "POST /departments"
              payload: { name: "Streets", backlog_threshold: 5 }
              as: SystemAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /categories"
              payload: { name: "Pothole", code: "POTHOLE", default_priority: "STANDARD", default_department_id: "${dept_id}", requires_geolocation: false }
              as: SystemAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /sla-policies"
              payload: { category_id: "${cat_id}", priority: "STANDARD", resolution_sla_hours: 24, escalation_tier1_hours: 2, escalation_tier2_hours: 6 }
              as: SystemAdmin
            - call: "POST /citizens"
              payload: { email: "c@x.com", full_name: "C" }
              as: Anonymous
              captures: { citizen_id: $.data.id }
            - call: "POST /service-requests"
              payload: { citizen_id: "${citizen_id}", category_id: "${cat_id}", description: "r" }
              as: Citizen
              as_user_id: "${citizen_id}"
              captures: { req_id: $.data.id }
            - call: "POST /service-requests/${req_id}/triage"
              payload: {}
              as: Dispatcher
            - call: "POST /service-requests/${req_id}/route"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /_clock/advance"
              payload: { hours: 24 }
              as: SystemAdmin
              captures: { created: $.data.escalations_created }
          assert:
            - "ServiceRequest.${req_id}.sla_breached == false"
            - "response.data.escalations_created == 0"

      - name: cluster_member_at_exactly_150m_radius_eligible
        grounds:
          - calculations.haversine_distance
          - validations[priority=11]
          - state_machines.ServiceRequest.SUBMITTED_to_DUPLICATE
        distinguishing_aspect: |
          Distance-metric boundary on POST /duplicate-clusters/{id}/members (a different metric and
          endpoint than the SLA time boundary): a candidate at ~149.83m (dlat 0.0013474667624865)
          from the cluster center is <= CLUSTER_RADIUS_METERS=150 and is therefore ELIGIBLE
          (inclusive boundary).
        test_recipe:
          setup:
            - "Cluster centered at (41.8800,-87.6300); a SUBMITTED same-category request at (41.88134746676249,-87.6300) ~149.83m from center."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: SystemAdmin
            - call: "POST /departments"
              payload: { name: "Streets", backlog_threshold: 5 }
              as: SystemAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /categories"
              payload: { name: "Pothole", code: "POTHOLE", default_priority: "STANDARD", default_department_id: "${dept_id}", requires_geolocation: true }
              as: SystemAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /citizens"
              payload: { email: "c@x.com", full_name: "C" }
              as: Anonymous
              captures: { citizen_id: $.data.id }
            - call: "POST /service-requests"
              payload: { citizen_id: "${citizen_id}", category_id: "${cat_id}", description: "canon", lat: 41.8800, lng: -87.6300 }
              as: Citizen
              as_user_id: "${citizen_id}"
              captures: { canon_id: $.data.id, canon_v: $.data.version }
            - call: "POST /duplicate-clusters"
              payload: { category_id: "${cat_id}", canonical_request_id: "${canon_id}", expected_canonical_version: "${canon_v}" }
              as: Dispatcher
              captures: { cluster_id: $.data.id }
            - call: "POST /service-requests"
              payload: { citizen_id: "${citizen_id}", category_id: "${cat_id}", description: "edge", lat: 41.88134746676249, lng: -87.6300 }
              as: Citizen
              as_user_id: "${citizen_id}"
              captures: { edge_id: $.data.id }
          trigger:
            - call: "POST /duplicate-clusters/${cluster_id}/members"
              payload: { request_id: "${edge_id}" }
              as: Dispatcher
              captures: { st: $.data.status }
          assert:
            - "ServiceRequest.${edge_id}.status == DUPLICATE"
            - "DuplicateCluster.${cluster_id}.member_count == 1"

