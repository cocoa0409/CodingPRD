            - "call 5 succeeds: ControlMeasure.${mb_id}.permit_term_id == ${tb_id} and measure_code == PUBLIC_EDUCATION, so the scope really is per term"
            - "GET /stormwater/permit-terms/${ta_id}/control-measures returns total_count 1 and GET /stormwater/permit-terms/${ta_id}/accounts returns total_count 1"
            - "GET /stormwater/permit-terms returns total_count 2, so the duplicate term was never created"

