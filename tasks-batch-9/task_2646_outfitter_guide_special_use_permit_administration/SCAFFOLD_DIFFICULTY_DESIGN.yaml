              payload: { to_iso8601: "2027-09-20T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /osup/permits/${p_id}/trip-use-reports"
              payload: { period_start_date: "2027-05-15", period_end_date: "2027-06-14", service_days_used: 40, client_count: 8, gross_revenue_cents: 1600050, allowable_deductions_cents: 0 }
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
              captures: { r1_id: "$.data.id" }
            - call: "POST /osup/trip-use-reports/${r1_id}/accept"
              payload: {}
