            - call: "POST /presentations/${p_id}/submit"
              payload: { submission_note: "documents forwarded" }
              as: CorrespondentBank
              as_user_id: "${bank_id}"
            - call: "POST /presentations/${p_id}/discrepancies"
              payload: { code: "GOODS_DESCRIPTION_MISMATCH", severity: "MINOR", description: "invoice says boards, credit says planks" }
              as: DocumentExaminer
              as_user_id: "dx_1"
            - call: "POST /presentations/${p_id}/conclude-examination"
              payload: { conclusion_note: "one minor discrepancy" }
              as: DocumentExaminer
              as_user_id: "dx_1"
            - call: "POST /presentations/${p_id}/waiver-requests"
              payload: { discrepancy_codes: ["GOODS_DESCRIPTION_MISMATCH"], request_note: "sent to the applicant" }
              as: DocumentExaminer
              as_user_id: "dx_1"
              captures: { wr_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-18T09:00:00Z" }
              as: SystemOperator
              as_user_id: "sysop_1"
          trigger:
            - call: "POST /_ops/run-expiry-sweep"
              payload: { dry_run: true }
              as: SystemOperator
              as_user_id: "sysop_1"
              captures: { dry_precluded: $.data.presentations_precluded, dry_waivers: $.data.waiver_requests_expired, dry_credits: $.data.credits_expired }
            - call: "POST /_ops/run-expiry-sweep"
              payload: { dry_run: false }
              as: SystemOperator
              as_user_id: "sysop_1"
              captures: { run1_precluded: $.data.presentations_precluded, run1_waivers: $.data.waiver_requests_expired, run1_credits: $.data.credits_expired, run1_released: $.data.allocations_released }
            - call: "POST /_ops/run-expiry-sweep"
              payload: { dry_run: false }
              as: SystemOperator
              as_user_id: "sysop_1"
              captures: { run2_precluded: $.data.presentations_precluded, run2_waivers: $.data.waiver_requests_expired, run2_credits: $.data.credits_expired, run2_released: $.data.allocations_released, run2_lapsed: $.data.amendments_lapsed, run2_reactivated: $.data.facilities_reactivated }
          assert:
            - "${dry_precluded} == 1 and ${dry_waivers} == 1 and ${dry_credits} == 0"
            - "after trigger call 1 Presentation.${p_id}.examination_status is still UNDER_EXAMINATION and WaiverRequest.${wr_id}.status is still PENDING - dry_run reports without mutating"
            - "${run1_precluded} == 1 and ${run1_waivers} == 1 and ${run1_credits} == 0 and ${run1_released} == 0"
            - "Presentation.${p_id}.examination_status == PRECLUDED (PASS 1 scans WAIVER_REQUESTED too) and settlement_status == UNSETTLED"
            - "WaiverRequest.${wr_id}.status == EXPIRED and the GOODS_DESCRIPTION_MISMATCH discrepancy is UPHELD"
            - "DocumentaryCredit.${cr_id}.reserved_cents == 4000000 - a precluded drawing stays reserved because the bank is bound to honour it"
            - "${run2_precluded} == 0 and ${run2_waivers} == 0 and ${run2_credits} == 0 and ${run2_released} == 0 and ${run2_lapsed} == 0 and ${run2_reactivated} == 0"
            - "Presentation.${p_id}.examination_status == PRECLUDED and WaiverRequest.${wr_id}.status == EXPIRED after trigger call 3 - the second sweep is a no-op"

  - section: consistency_model
    instances:
      - name: immediate_visibility_issuance_response_already_carries_every_derived_field
        claim_type: immediate
        grounds:
          - calculations.credit_allocation_exposure
          - calculations.issuance_charges
          - calculations.presentation_window
          - calculations.facility_exposure_ledger
          - endpoints.POST_/credits/{id}/issue
        distinguishing_aspect: |
          consistency_model is immediate, so the issuance response itself - not a
          later read - must already carry every field the cascade computed:
          max_drawable_cents and gross_exposure_cents and committed_allocation_cents
          all 10000000 (tolerance 0, tenor 0), commission_bps_applied 10 on the
          middle tier, base_commission_cents 25000 because the 20000 arithmetic
          result loses to the floor, confirmation_charge_cents 0 while unconfirmed,
          total_charge_cents 25000, chargeable_utilisation_cents 10025000,
          presentation_deadline_date 2026-11-21, confirmation_window_start 2026-08-10
          and confirmation_window_end 2026-12-21. The subsequent reads of the facility
          and of the allocation row must agree with that same response with no sweep,
          no refresh and no second write in between - an implementation that computed
          the ledger lazily would return zeros here and correct numbers only later.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "Applicant Baltic Timber Imports AS (NO, CLEARED) with a USD facility of limit_cents 50000000, collateral_required_pct 0, facility_expiry_date 2027-06-30; bank Nordkyst Bank NDKBNOKK; beneficiary Riga Sawmill SIA (LV)."
            - "One credit of amount_cents 10000000, SIGHT_PAYMENT, tenor_days 0, tolerance_pct 0, FOB, latest_shipment_date 2026-10-31, expiry_date 2026-11-30, presentation_period_days 21, approved and awaiting issuance."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SystemOperator
              as_user_id: "sysop_1"
            - call: "POST /applicants"
              payload: { legal_name: "Baltic Timber Imports AS", country_code: "NO", industry_code: "4671", internal_risk_grade: "A", kyc_status: "CLEARED" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { app_id: $.data.id }
            - call: "POST /applicants/${app_id}/facilities"
              payload: { currency: "USD", limit_cents: 50000000, collateral_required_pct: 0, facility_expiry_date: "2027-06-30" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { fac_id: $.data.id }
            - call: "POST /banks"
              payload: { bank_name: "Nordkyst Bank", swift_bic: "NDKBNOKK", country_code: "NO", country_risk_score: 12, credit_rating: "AA", confirmation_appetite_cents: 90000000 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { bank_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { beneficiary_name: "Riga Sawmill SIA", country_code: "LV", nominated_bank_id: "${bank_id}" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { ben_id: $.data.id }
            - call: "POST /credits"
              payload: { applicant_id: "${app_id}", beneficiary_id: "${ben_id}", facility_id: "${fac_id}", advising_bank_id: "${bank_id}", currency: "USD", amount_cents: 10000000, available_by: "SIGHT_PAYMENT", tenor_days: 0, tolerance_pct: 0, incoterm: "FOB", incoterm_place: "Port of Riga", latest_shipment_date: "2026-10-31", expiry_date: "2026-11-30", expiry_place: "Oslo", presentation_period_days: 21 }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { cr_id: $.data.id, prov: $.data.provisional_allocation_cents }
            - call: "POST /credits/${cr_id}/documentary-requirements"
              payload: { doc_type: "COMMERCIAL_INVOICE", originals_required: 1, copies_required: 2, issuer_constraint: "Beneficiary", is_mandatory: true }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
            - call: "POST /credits/${cr_id}/documentary-requirements"
              payload: { doc_type: "BILL_OF_LADING", originals_required: 1, copies_required: 1, issuer_constraint: "Carrier", is_mandatory: true }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
            - call: "POST /credits/${cr_id}/submit-for-approval"
              payload: { submission_note: "standard credit" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
            - call: "POST /credits/${cr_id}/approve"
              payload: { decision: "APPROVE", approval_note: "within appetite" }
              as: CreditOfficer
              as_user_id: "co_2"
          trigger:
            - call: "POST /credits/${cr_id}/issue"
              payload: { issue_note: "issued to Riga Sawmill" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures:
                st: $.data.status
                issued_on: $.data.issue_date
                maxdraw: $.data.max_drawable_cents
                gross: $.data.gross_exposure_cents
                committed: $.data.committed_allocation_cents
                bps: $.data.commission_bps_applied
                base: $.data.base_commission_cents
                confcharge: $.data.confirmation_charge_cents
                total: $.data.total_charge_cents
                chargeable: $.data.chargeable_utilisation_cents
                pres_deadline: $.data.presentation_deadline_date
                win_start: $.data.confirmation_window_start
                win_end: $.data.confirmation_window_end
                reserved: $.data.reserved_cents
                avail: $.data.available_cents
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { fac_alloc: $.data.allocated_cents, fac_avail: $.data.available_cents, fac_posture: $.data.utilisation_posture, fac_threshold: $.data.restrict_threshold_cents }
            - call: "GET /credits/${cr_id}/allocations"
              payload: {}
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { alloc_amount: "$.data[0].allocated_cents", alloc_charge: "$.data[0].charge_cents", alloc_basis: "$.data[0].basis", alloc_status: "$.data[0].status" }
          assert:
            - "${prov} == 10000000 - the draft already carried the provisional figure, computed with tolerance and tenor forced to zero"
            - "${st} == ISSUED and ${issued_on} == 2026-08-10"
            - "${maxdraw} == 10000000 and ${gross} == 10000000 and ${committed} == 10000000"
            - "${bps} == 10 and ${base} == 25000 and ${confcharge} == 0 and ${total} == 25000"
            - "${chargeable} == 10025000"
            - "${pres_deadline} == 2026-11-21 and ${win_start} == 2026-08-10 and ${win_end} == 2026-12-21"
            - "${reserved} == 0 and ${avail} == 10000000"
            - "${fac_alloc} == 10025000 and ${fac_avail} == 39975000 and ${fac_posture} == OPEN and ${fac_threshold} == 47500000"
            - "${alloc_amount} == 10000000 and ${alloc_charge} == 25000 and ${alloc_basis} == COMMITTED_ISSUANCE and ${alloc_status} == OPEN"
            - "every one of those figures is readable in the issuance response or in a plain read taken straight afterwards, with no sweep and no second write"

      - name: immediate_visibility_refusal_response_already_reflects_the_released_reservation
        claim_type: immediate
        grounds:
          - endpoints.POST_/presentations/{id}/refuse
          - calculations.credit_drawable_ledger
          - state_machines.Presentation
        distinguishing_aspect: |
          The refusal notice runs a three-hop cascade and, under an immediate
          consistency model, the single response must already show the end of it:
          examination_status REFUSED, settlement_status VOID and
          refusal_notice_sent_at set. The read of the credit taken immediately
          afterwards must show reserved_cents back at 0 and available_cents back at
          10000000 - exactly the pre-submit values - while the FACILITY figures must
          be untouched at 10025000 allocated, because the credit itself remains
          outstanding. An implementation that deferred the ledger recompute to the
          sweep would show reserved_cents 4000000 here.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z (a Monday)."
            - "Standard fixture with a credit of amount_cents 10000000, SIGHT_PAYMENT, tenor_days 0, tolerance_pct 0, FOB, latest_shipment_date 2026-10-31, expiry_date 2026-11-30, presentation_period_days 21, ISSUED, so reserved_cents 0 and available_cents 10000000 and the facility carries allocated_cents 10025000."
            - "A presentation carrying a clean invoice of 4000000 and a bill of lading is submitted, which lifts reserved_cents to 4000000 and drops available_cents to 6000000; one MATERIAL discrepancy is raised and the examination is concluded to DISCREPANT, all well inside the examination_deadline of 2026-08-17T23:59:59.999Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SystemOperator
              as_user_id: "sysop_1"
            - call: "POST /applicants"
              payload: { legal_name: "Baltic Timber Imports AS", country_code: "NO", industry_code: "4671", internal_risk_grade: "A", kyc_status: "CLEARED" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { app_id: $.data.id }
            - call: "POST /applicants/${app_id}/facilities"
              payload: { currency: "USD", limit_cents: 50000000, collateral_required_pct: 0, facility_expiry_date: "2027-06-30" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { fac_id: $.data.id }
            - call: "POST /banks"
              payload: { bank_name: "Nordkyst Bank", swift_bic: "NDKBNOKK", country_code: "NO", country_risk_score: 12, credit_rating: "AA", confirmation_appetite_cents: 90000000 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { bank_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { beneficiary_name: "Riga Sawmill SIA", country_code: "LV", nominated_bank_id: "${bank_id}" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { ben_id: $.data.id }
            - call: "POST /credits"
              payload: { applicant_id: "${app_id}", beneficiary_id: "${ben_id}", facility_id: "${fac_id}", advising_bank_id: "${bank_id}", currency: "USD", amount_cents: 10000000, available_by: "SIGHT_PAYMENT", tenor_days: 0, tolerance_pct: 0, incoterm: "FOB", incoterm_place: "Port of Riga", latest_shipment_date: "2026-10-31", expiry_date: "2026-11-30", expiry_place: "Oslo", presentation_period_days: 21 }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { cr_id: $.data.id }
            - call: "POST /credits/${cr_id}/documentary-requirements"
              payload: { doc_type: "COMMERCIAL_INVOICE", originals_required: 1, copies_required: 2, issuer_constraint: "Beneficiary", is_mandatory: true }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
            - call: "POST /credits/${cr_id}/documentary-requirements"
              payload: { doc_type: "BILL_OF_LADING", originals_required: 1, copies_required: 1, issuer_constraint: "Carrier", is_mandatory: true }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
            - call: "POST /credits/${cr_id}/submit-for-approval"
              payload: { submission_note: "standard credit" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
            - call: "POST /credits/${cr_id}/approve"
              payload: { decision: "APPROVE", approval_note: "ok" }
              as: CreditOfficer
              as_user_id: "co_2"
            - call: "POST /credits/${cr_id}/issue"
              payload: { issue_note: "issued" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
            - call: "POST /presentations"
              payload: { credit_id: "${cr_id}", presenting_bank_id: "${bank_id}", cover_letter_reference: "NDK/2026/13" }
              as: CorrespondentBank
              as_user_id: "${bank_id}"
              captures: { p_id: $.data.id }
            - call: "POST /presentations/${p_id}/documents"
              payload: { doc_type: "COMMERCIAL_INVOICE", originals_presented: 1, copies_presented: 2, issue_date: "2026-08-08", invoice_amount_cents: 4000000, goods_description: "Sawn spruce boards", hs_code: "440710", consignee_country: "LV", issuer_name: "Riga Sawmill SIA" }
              as: CorrespondentBank
              as_user_id: "${bank_id}"
            - call: "POST /presentations/${p_id}/documents"
              payload: { doc_type: "BILL_OF_LADING", originals_presented: 1, copies_presented: 1, issue_date: "2026-08-07", shipment_date: "2026-08-06", goods_description: "Sawn spruce boards", hs_code: "440710", consignee_country: "LV", issuer_name: "Baltic Line AS" }
              as: CorrespondentBank
              as_user_id: "${bank_id}"
            - call: "POST /presentations/${p_id}/submit"
              payload: { submission_note: "documents forwarded" }
              as: CorrespondentBank
              as_user_id: "${bank_id}"
              captures: { reserved_after_submit: $.data.drawn_amount_cents }
            - call: "GET /credits/${cr_id}"
              payload: {}
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { res_mid: $.data.reserved_cents, avail_mid: $.data.available_cents }
            - call: "POST /presentations/${p_id}/discrepancies"
              payload: { code: "INVOICE_OVERDRAWN", severity: "MATERIAL", description: "invoice value exceeds the unit price schedule" }
              as: DocumentExaminer
              as_user_id: "dx_1"
            - call: "POST /presentations/${p_id}/conclude-examination"
              payload: { conclusion_note: "one material discrepancy" }
              as: DocumentExaminer
              as_user_id: "dx_1"
          trigger:
            - call: "POST /presentations/${p_id}/refuse"
              payload: { disposal_instruction: "RETURN_TO_PRESENTER", refusal_note: "documents refused, returned to the presenting bank" }
              as: DocumentExaminer
              as_user_id: "dx_1"
              captures: { exam_st: $.data.examination_status, settle_st: $.data.settlement_status, notice_at: $.data.refusal_notice_sent_at, disposal: $.data.disposal_instruction }
            - call: "GET /credits/${cr_id}"
              payload: {}
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { res_after: $.data.reserved_cents, avail_after: $.data.available_cents, drawn_after: $.data.drawn_settled_cents, cr_st: $.data.status }
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { fac_alloc_after: $.data.allocated_cents, fac_avail_after: $.data.available_cents }
          assert:
            - "${reserved_after_submit} == 4000000 and ${res_mid} == 4000000 and ${avail_mid} == 6000000"
            - "${exam_st} == REFUSED and ${settle_st} == VOID in the refusal response itself"
            - "${notice_at} == 2026-08-10T09:00:00Z and ${disposal} == RETURN_TO_PRESENTER"
            - "${res_after} == 0 and ${avail_after} == 10000000 and ${drawn_after} == 0 - hops 2 and 3 are visible in the very next read"
            - "${cr_st} == ISSUED - refusing a presentation does not touch the credit's own status"
            - "${fac_alloc_after} == 10025000 and ${fac_avail_after} == 39975000 - the facility is deliberately untouched"
