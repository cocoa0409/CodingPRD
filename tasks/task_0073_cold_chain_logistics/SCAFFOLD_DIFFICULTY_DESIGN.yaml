scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: damage_amount_insured_vs_invoice_value
        grounds:
          - calculations.damage_amount_calculation
          - entities.DamageAssessment.fields.variant
          - entities.DamageAssessment.fields.invoice_unit_value_cents
          - entities.DamageAssessment.fields.damage_amount_cents
          - endpoints.POST_/damage-assessments
        distinguishing_aspect: |
          Operates on the DamageAssessment entity (cost-accounting domain). Two valid
          algorithms — INSURED_VALUE (declared cargo value divided by quantity) and
          INVOICE_VALUE (per-unit purchase invoice price) — produce different
          damage_amount_cents for identical damage_class, damaged_quantity, and
          salvage_pct inputs.
        test_recipe:
          setup:
            - "Create Vehicle V with insured_cap_cents=500000."
            - "Create Driver D with max_daily_minutes=660."
            - "POST /transport-tasks with cargo_value_cents=1000000, cargo_quantity=100, FOOD cargo_type. Two stops; assign V and D before /dispatch."
            - "Dispatch the task. Advance clock past planned_start_at. Depart."
            - "Ingest readings that open and resolve at least one Alert for evidence."
            - "Complete the task to DELIVERED via final handover."
          trigger:
            - "POST /damage-assessments with task_id=T, damaged_quantity=5, damage_class=MODERATE, salvage_pct=0.10, variant=INSURED_VALUE, evidence_alert_ids=[A1]."
            - "POST /damage-assessments with task_id=T2 (a sibling task with identical parameters), damaged_quantity=5, damage_class=MODERATE, salvage_pct=0.10, variant=INVOICE_VALUE, invoice_unit_value_cents=12000, evidence_alert_ids=[A2]."
          assert:
            - "First DamageAssessment.damage_amount_cents == 27000  # unit=10000, factor=0.60, salvage=0.10 -> per_unit=5400, x5=27000"
            - "Second DamageAssessment.damage_amount_cents == 32400  # unit=12000, factor=0.60, salvage=0.10 -> per_unit=6480, x5=32400"
            - "27000 != 32400 (same damaged_quantity / damage_class / salvage_pct, different variant)."

      - name: responsibility_split_duration_vs_severity_weighted
        grounds:
          - calculations.responsibility_split_advisory
          - entities.ResponsibilityDecision.fields.split_method
          - entities.ResponsibilityDecision.fields.shipper_pct
          - entities.ResponsibilityDecision.fields.carrier_pct
          - entities.ResponsibilityDecision.fields.consignee_pct
          - endpoints.POST_/responsibility-decisions
        distinguishing_aspect: |
          Operates on the ResponsibilityDecision entity (party-attribution domain,
          different domain from DamageAssessment). Two valid weighting algorithms
          — DURATION_WEIGHTED (overlap-seconds of custody with alert window) and
          SEVERITY_WEIGHTED (peak deviation attributed to custodian at alert open
          moment) — produce different advisory_split percentages for the same
          evidence chain and HandoverRecord history.
        test_recipe:
          setup:
            - "Reuse the FINALIZED DamageAssessment scenario from instance damage_amount_insured_vs_invoice_value."
            - "Ensure two evidence alerts exist: A1 opened entirely while SHIPPER held custody (longer duration but lower peak), A2 opened briefly while CARRIER held custody (shorter duration but higher peak)."
          trigger:
            - "POST /responsibility-decisions with task_id=T, assessment_id=ASSESS_A, shipper_pct=0.50, carrier_pct=0.50, consignee_pct=0.00, split_method=DURATION_WEIGHTED."
            - "POST /responsibility-decisions on a sibling task T2 with the same evidence shape, split_method=SEVERITY_WEIGHTED."
          assert:
            - "Response 1.advisory_split[SHIPPER] > Response 1.advisory_split[CARRIER]  # SHIPPER held cargo longer"
            - "Response 2.advisory_split[CARRIER] > Response 2.advisory_split[SHIPPER]  # CARRIER overlapped highest peak"
            - "Response 1.advisory_split != Response 2.advisory_split (same inputs, different variant)."

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: damage_amount_three_input_nonlinear
        grounds:
          - calculations.damage_amount_calculation
          - entities.DamageAssessment.fields.damage_class
          - entities.DamageAssessment.fields.salvage_pct
          - entities.DamageAssessment.fields.damaged_quantity
          - entities.Vehicle.fields.insured_cap_cents
        distinguishing_aspect: |
          Mode (a): three-input nonlinear formula combining (1) tiered DAMAGE_FACTOR
          lookup keyed on damage_class enum, (2) multiplicative (1 - salvage_pct)
          factor, and (3) min(raw_total, insured_cap_cents) cap clipping. Output is
          a non-linear interaction of damage_class branch, salvage_pct decimal,
          and insured_cap_cents threshold.
        test_recipe:
          setup:
            - "Create Vehicle V with insured_cap_cents=20000."
            - "Create a task with cargo_value_cents=1000000, cargo_quantity=100. Bring it to DELIVERED with at least one RESOLVED Alert (A1)."
          trigger:
            - "POST /damage-assessments with damaged_quantity=5, damage_class=MODERATE, salvage_pct=0.10, variant=INSURED_VALUE, evidence_alert_ids=[A1]."
          assert:
            - "raw_total uncapped would be 27000 (per_unit=5400 x 5); insured_cap_cents=20000."
            - "DamageAssessment.damage_amount_cents == 20000  # min(27000, 20000) = 20000 — cap clipping engages"
            - "If salvage_pct were 0.50 instead, per_unit=round_half_up(10000*0.60*0.50)=3000, raw_total=15000, damage_amount_cents=15000 (no cap clipping)."

      - name: damage_amount_per_unit_then_sum_rounding_order
        grounds:
          - calculations.damage_amount_calculation
          - entities.DamageAssessment.fields.damage_amount_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. The formula pins
          "per-unit round_half_up first, then multiply by damaged_quantity" — the
          alternative ("multiply first, round once") yields a different cents
          value. With unit_value=10001, factor=0.60, salvage=0.00, quantity=3:
          per-unit-then-sum = 6001 x 3 = 18003; sum-then-round =
          round_half_up(10001 x 0.60 x 3) = 18002. The scaffold pins 18003.
        test_recipe:
          setup:
            - "Create Vehicle V with insured_cap_cents=10000000."
            - "Create a task with cargo_value_cents=1000100, cargo_quantity=100 (so unit_value=10001 cents under INSURED_VALUE)."
            - "Bring it to DELIVERED with one RESOLVED Alert A1."
          trigger:
            - "POST /damage-assessments with damaged_quantity=3, damage_class=MODERATE, salvage_pct=0.00, variant=INSURED_VALUE, evidence_alert_ids=[A1]."
          assert:
            - "DamageAssessment.damage_amount_cents == 18003  # per-unit (round_half_up(10001 * 0.60) = 6001) * 3"
            - "It MUST NOT equal 18002 (which would be the sum-then-round-once alternative)."

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: responsibility_decision_mediation_cycle
        grounds:
          - state_machines.ResponsibilityDecision.DISPUTED_to_MEDIATION
          - state_machines.ResponsibilityDecision.MEDIATION_to_DRAFT
          - state_machines.ResponsibilityDecision.UNDER_REVIEW_to_DISPUTED
          - state_machines.ResponsibilityDecision.DRAFT_to_UNDER_REVIEW
        distinguishing_aspect: |
          ResponsibilityDecision contains a cyclic state path: DRAFT -> UNDER_REVIEW
          -> DISPUTED -> MEDIATION -> DRAFT. A single decision row may revisit DRAFT
          multiple times before terminating at FINALIZED. This is a cycle on the
          ResponsibilityDecision entity, distinct from any other entity's machine.
        test_recipe:
          setup:
            - "Create a FINALIZED DamageAssessment ASSESS_A on task T."
            - "POST /responsibility-decisions creating decision D with split_method=DURATION_WEIGHTED."
            - "POST /responsibility-decisions/D/submit (DRAFT -> UNDER_REVIEW)."
            - "POST /responsibility-decisions/D/dispute as CARRIER (UNDER_REVIEW -> DISPUTED)."
            - "POST /responsibility-decisions/D/mediate as COMPLIANCE_OFFICER (DISPUTED -> MEDIATION)."
          trigger:
            - "PATCH /responsibility-decisions/D with revised shipper_pct=0.40, carrier_pct=0.40, consignee_pct=0.20 (MEDIATION -> DRAFT)."
            - "POST /responsibility-decisions/D/submit again (DRAFT -> UNDER_REVIEW)."
          assert:
            - "After PATCH, ResponsibilityDecision.status == DRAFT (cycled back from MEDIATION)."
            - "After /submit, ResponsibilityDecision.status == UNDER_REVIEW (second arrival)."
            - "ResponsibilityDecision.version increments by at least 2 across the cycle (PATCH + /submit)."

      - name: insurance_claim_assessment_negotiation_cycle
        grounds:
          - state_machines.InsuranceClaim.ASSESSMENT_to_NEGOTIATING
          - state_machines.InsuranceClaim.NEGOTIATING_to_ASSESSMENT
        distinguishing_aspect: |
          InsuranceClaim contains a cycle ASSESSMENT -> NEGOTIATING -> ASSESSMENT
          allowing multiple rounds of negotiated re-assessment. This is a cycle on
          a different entity (InsuranceClaim) than the ResponsibilityDecision
          mediation cycle, satisfying the "different entities" clause.
        test_recipe:
          setup:
            - "Reach REPORTED InsuranceClaim C on task T (with FINALIZED decision)."
            - "POST /insurance-claims/C/prepare-evidence (REPORTED -> EVIDENCE_PREP)."
            - "POST /insurance-claims/C/assess with assessed_amount_cents=15000 (EVIDENCE_PREP -> ASSESSMENT)."
            - "POST /insurance-claims/C/negotiate (ASSESSMENT -> NEGOTIATING)."
          trigger:
            - "POST /insurance-claims/C/assess with assessed_amount_cents=12000 (NEGOTIATING -> ASSESSMENT; cycle)."
          assert:
            - "InsuranceClaim.status == ASSESSMENT (second arrival)."
            - "InsuranceClaim.assessed_amount_cents == 12000 (revised in cycle)."
            - "InsuranceClaim.version >= 4 (the cycle bumped version on each transition)."

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: handover_to_task_to_vehicle_driver_release
        grounds:
          - state_machines.TaskStop.ARRIVED_to_HANDED_OVER
          - state_machines.TransportTask.AT_STOP_to_DELIVERED
          - entities.Vehicle.fields.status
          - entities.Driver.fields.status
          - endpoints.POST_/transport-tasks/{id}/stops/{stop_id}/handovers
        distinguishing_aspect: |
          Depth-3 cascade. Trigger: POST /handovers on final-sequence stop.
          Link 1: TaskStop transitions ARRIVED -> HANDED_OVER. Link 2: BECAUSE the
          final stop is now HANDED_OVER and all others are done, the parent
          TransportTask auto-transitions AT_STOP -> DELIVERED. Link 3: BECAUSE the
          TransportTask just hit DELIVERED, the assigned Driver.status flips
          ON_DUTY -> OFF_DUTY and Vehicle.status flips IN_USE -> AVAILABLE. Each
          hop is caused by the previous, not by the original handover call.
        test_recipe:
          setup:
            - "Create Vehicle V (AVAILABLE), Driver D (OFF_DUTY)."
            - "Create task T with two stops; dispatch (V=IN_USE, D=ON_DUTY); depart; arrive at stop 1; handover stop 1; depart; arrive at final stop 2."
          trigger:
            - "POST /transport-tasks/T/stops/STOP2/handovers with valid handover body."
          assert:
            - "TaskStop STOP2.status == HANDED_OVER (link 1)."
            - "TransportTask T.status == DELIVERED (link 2, caused by stop 2 final-handover completion)."
            - "Vehicle V.status == AVAILABLE (link 3, caused by task transitioning to DELIVERED)."
            - "Driver D.status == OFF_DUTY (link 3, caused by task transitioning to DELIVERED)."

      - name: close_task_to_resolved_alerts_to_closed
        grounds:
          - state_machines.TransportTask.DELIVERED_to_CLOSED
          - state_machines.Alert.RESOLVED_to_CLOSED
          - endpoints.POST_/transport-tasks/{id}/close
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger than the handover cascade.
          Trigger: POST /transport-tasks/{id}/close. Link 1: TransportTask
          transitions DELIVERED -> CLOSED (and closed_at set). Link 2: BECAUSE
          the task just hit CLOSED, every Alert on this task with status=RESOLVED
          auto-transitions RESOLVED -> CLOSED. Originates from /close, not from
          /handovers.
        test_recipe:
          setup:
            - "Bring task T to DELIVERED with two alerts A1, A2 both RESOLVED on it."
          trigger:
            - "POST /transport-tasks/T/close."
          assert:
            - "TransportTask T.status == CLOSED (link 1)."
            - "Alert A1.status == CLOSED (link 2)."
            - "Alert A2.status == CLOSED (link 2)."
            - "TransportTask T.closed_at is non-null and equals current server clock."

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_constraint_on_dispatch
        grounds:
          - validations[priority=5]
          - validations[priority=11]
          - errors.ERR_INVALID_STATE
          - errors.ERR_VEHICLE_OVERLAP
          - endpoints.POST_/transport-tasks/{id}/dispatch
        distinguishing_aspect: |
          Error-category pair (state vs business_constraint). Construct a request
          that simultaneously violates (a) state precondition — the task is
          already DISPATCHED, not PLANNED — AND (b) business_constraint —
          re-dispatching would cause a vehicle overlap with itself. Priority 5
          (state) fires first. The state error wins.
        test_recipe:
          setup:
            - "Create Vehicle V and Driver D."
            - "POST /transport-tasks creating task T (PLANNED) assigned to V and D."
            - "POST /transport-tasks/T/dispatch (T now DISPATCHED, V=IN_USE, D=ON_DUTY)."
          trigger:
            - "POST /transport-tasks/T/dispatch again (state violation AND would re-overlap V)."
          assert:
            - "HTTP status 409."
            - "Response error_id == 'ERR_INVALID_STATE' (priority 5 wins over priority 11 ERR_VEHICLE_OVERLAP)."

      - name: business_safety_vs_business_fiscal_on_claim_report
        grounds:
          - validations[priority=8]
          - validations[priority=15]
          - errors.ERR_DECISION_NOT_FINALIZED
          - errors.ERR_INSURANCE_CAP_EXCEEDED
          - endpoints.POST_/insurance-claims
        distinguishing_aspect: |
          DIFFERENT error-category pair (business_safety vs business_fiscal),
          distinct from instance state_vs_business_constraint_on_dispatch.
          Construct a POST /insurance-claims that simultaneously violates (a)
          business_safety — linked ResponsibilityDecision is not FINALIZED
          (priority 8) — AND (b) business_fiscal — requested_amount_cents exceeds
          Vehicle.insured_cap_cents (priority 15). Priority 8 wins.
        test_recipe:
          setup:
            - "Create Vehicle V with insured_cap_cents=10000."
            - "Bring task T to DELIVERED. Create FINALIZED DamageAssessment, then create a ResponsibilityDecision D and keep its status at DRAFT (do NOT finalize)."
          trigger:
            - "POST /insurance-claims with task_id=T, decision_id=D, requested_amount_cents=50000."
          assert:
            - "HTTP status 409."
            - "Response error_id == 'ERR_DECISION_NOT_FINALIZED' (priority 8 wins over priority 15 ERR_INSURANCE_CAP_EXCEEDED)."
            - "Error-category pair {business_safety, business_fiscal} differs from prior instance's {state, business_constraint}."

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics / endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: driver_rolling_24h_minutes_strict_gt
        grounds:
          - calculations.driver_rolling_24h_minutes
          - validations[priority=12]
          - errors.ERR_DRIVER_HOURS_EXCEEDED
          - entities.Driver.fields.max_daily_minutes
          - endpoints.POST_/transport-tasks/{id}/dispatch
        distinguishing_aspect: |
          Numeric threshold boundary. Driver.max_daily_minutes=660. Existing
          assignment consumes 540 minutes; new task contributes 120 minutes
          fully inside a single 24h window. Sum = 660 — equality is ALLOWED
          (strict >, not >=). At 661 minutes the dispatch is REJECTED.
          Metric: rolling-window driving minutes; endpoint:
          POST /transport-tasks/{id}/dispatch.
        test_recipe:
          setup:
            - "Create Driver D with max_daily_minutes=660 and Vehicle V."
            - "Create task T1 with [planned_start_at, planned_end_at] spanning exactly 540 minutes within the test window; dispatch."
            - "Create task T2 with [planned_start_at, planned_end_at] spanning exactly 120 minutes, ENTIRELY within the same 24h window as T1, assigned to D and a different vehicle V2."
            - "Create task T3 identical to T2 but spanning 121 minutes."
          trigger:
            - "POST /transport-tasks/T2/dispatch (sum = 660, equality)."
            - "On a sibling driver D2 with the same setup but spanning 121 minutes instead of 120: POST /transport-tasks/T3/dispatch."
          assert:
            - "POST T2/dispatch returns 200 (660 == max_daily_minutes; strict > so equality passes)."
            - "POST T3/dispatch returns 409 with error_id='ERR_DRIVER_HOURS_EXCEEDED' (661 > 660)."

      - name: damage_assessment_empty_evidence_array
        grounds:
          - validations[priority=9]
          - errors.ERR_EVIDENCE_REQUIRED
          - entities.DamageAssessment.fields.evidence_alert_ids
          - endpoints.POST_/damage-assessments
        distinguishing_aspect: |
          Empty-collection boundary on a DIFFERENT metric (cardinality of
          evidence_alert_ids) and DIFFERENT endpoint (POST /damage-assessments).
          Size=0 fails with ERR_EVIDENCE_REQUIRED; size=1 with a valid
          referenced alert succeeds.
        test_recipe:
          setup:
            - "Bring task T to DELIVERED with one RESOLVED alert A1."
          trigger:
            - "POST /damage-assessments with task_id=T, damaged_quantity=1, damage_class=MINOR, salvage_pct=0.00, variant=INSURED_VALUE, evidence_alert_ids=[]."
            - "POST /damage-assessments with the same body except evidence_alert_ids=[A1]."
          assert:
            - "First call returns 422 with error_id='ERR_EVIDENCE_REQUIRED' (empty array rejected)."
            - "Second call returns 201 (size=1 accepted)."

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: alert_resolve_requires_task_not_terminal
        grounds:
          - state_machines.Alert.IN_RESPONSE_to_RESOLVED
          - state_machines.Alert.ESCALATED_to_RESOLVED
          - validations[priority=7]
          - errors.ERR_TASK_NOT_RESOLVABLE
          - endpoints.POST_/alerts/{id}/resolve
        distinguishing_aspect: |
          Entity pair Alert <-> TransportTask. The Alert's IN_RESPONSE->RESOLVED
          transition is gated by the PARENT TransportTask's state — only allowed
          while task.status in {IN_TRANSIT, AT_STOP, DELIVERED}; rejected when
          task.status in {CLOSED, ABORTED}.
        test_recipe:
          setup:
            - "Bring task T to DELIVERED. Open Alert A on T and advance it to IN_RESPONSE (acknowledge + first response)."
            - "POST /transport-tasks/T/close — but BEFORE closing, the precondition says no Alert may be in {OPEN, ACKNOWLEDGED, IN_RESPONSE, ESCALATED}. So first move A to RESOLVED, then close T. Then test the rejection on a SECOND alert A2 opened on T2 that has been ABORTED."
            - "Set up task T2 with Alert A2 in IN_RESPONSE. POST /transport-tasks/T2/abort to push T2 to ABORTED with A2 still in IN_RESPONSE."
          trigger:
            - "POST /alerts/A2/resolve."
          assert:
            - "HTTP status 409."
            - "Response error_id == 'ERR_TASK_NOT_RESOLVABLE'."
            - "Alert A2.status remains IN_RESPONSE (unchanged)."

      - name: insurance_claim_report_requires_finalized_decision
        grounds:
          - state_machines.InsuranceClaim.none_to_REPORTED
          - validations[priority=8]
          - errors.ERR_DECISION_NOT_FINALIZED
          - endpoints.POST_/insurance-claims
          - entities.ResponsibilityDecision.fields.status
        distinguishing_aspect: |
          DIFFERENT entity pair (InsuranceClaim <-> ResponsibilityDecision). The
          InsuranceClaim none->REPORTED creation is gated by the referenced
          ResponsibilityDecision's state — only allowed when decision.status =
          FINALIZED. Rejected otherwise.
        test_recipe:
          setup:
            - "Bring task T to DELIVERED. Create FINALIZED DamageAssessment ASSESS_A."
            - "POST /responsibility-decisions creating decision D in DRAFT. Do NOT submit/accept/finalize."
          trigger:
            - "POST /insurance-claims with task_id=T, decision_id=D, requested_amount_cents=100."
          assert:
            - "HTTP status 409."
            - "Response error_id == 'ERR_DECISION_NOT_FINALIZED'."
            - "ResponsibilityDecision D.status remains DRAFT (unchanged)."

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: vehicle_half_open_interval_overlap
        grounds:
          - calculations.vehicle_overlap_check
          - validations[priority=11]
          - errors.ERR_VEHICLE_OVERLAP
          - endpoints.POST_/transport-tasks/{id}/dispatch
        distinguishing_aspect: |
          Half-open interval [planned_start_at, planned_end_at) semantics on
          Vehicle. Two tasks that touch boundary-to-boundary (existing.end ==
          new.start, exact equality) are ADJACENT and ALLOWED; any strict
          intersection is REJECTED.
        test_recipe:
          setup:
            - "Create Vehicle V and two Drivers D1, D2."
            - "Create task T1 with planned_start_at=T0, planned_end_at=T0+3600s, assigned to V and D1. Dispatch."
            - "Create task T2 with planned_start_at=T0+3600s (exact adjacency), planned_end_at=T0+7200s, assigned to V and D2."
            - "Create task T3 with planned_start_at=T0+3599s (1-second overlap), planned_end_at=T0+7199s, assigned to V and a third driver."
          trigger:
            - "POST /transport-tasks/T2/dispatch (adjacency)."
            - "POST /transport-tasks/T3/dispatch (1-second strict overlap)."
          assert:
            - "POST T2/dispatch returns 200 (adjacent endpoints under half-open semantics — allowed)."
            - "POST T3/dispatch returns 409 error_id='ERR_VEHICLE_OVERLAP'."

      - name: driver_rolling_24h_aggregate_capacity
        grounds:
          - calculations.driver_rolling_24h_minutes
          - validations[priority=12]
          - errors.ERR_DRIVER_HOURS_EXCEEDED
          - entities.Driver.fields.max_daily_minutes
        distinguishing_aspect: |
          DIFFERENT interval semantics on a DIFFERENT resource. Driver capacity
          is not pairwise-overlap geometry; it is an aggregate-capacity rule
          over a rolling 24h window — sum of driving minutes within any 24h
          window must not exceed max_daily_minutes. Two non-overlapping
          assignments can still violate this (e.g., 540 min + 121 min within
          one 24h window).
        test_recipe:
          setup:
            - "Create Driver D with max_daily_minutes=660 and two non-overlapping Vehicles V1, V2."
            - "Create task T1 spanning 540 minutes (e.g., T0..T0+32400s) assigned to V1, D. Dispatch."
            - "Create task T2 spanning 121 minutes starting at T0+34000s (non-overlapping with T1) assigned to V2, D. Both T1 and T2 are inside a single 24h window."
          trigger:
            - "POST /transport-tasks/T2/dispatch."
          assert:
            - "HTTP status 409, error_id='ERR_DRIVER_HOURS_EXCEEDED' (540 + 121 = 661 > 660 within rolling 24h)."
            - "Note: vehicles do NOT overlap, so ERR_VEHICLE_OVERLAP is NOT raised — this is purely an aggregate-capacity violation, distinct from instance vehicle_half_open_interval_overlap."

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: insurer_outflow_pay_then_subrogate
        grounds:
          - calculations.insurance_claim_payout
          - state_machines.InsuranceClaim.ASSESSMENT_to_PAID_OUT
          - state_machines.InsuranceClaim.PAID_OUT_to_SUBROGATION
          - entities.InsuranceClaim.fields.payout_amount_cents
          - entities.InsuranceClaim.fields.subrogation_recovered_cents
        distinguishing_aspect: |
          Conserved quantity: net_insurer_outflow_cents := payout_amount_cents.
          Forward action: /pay (sets payout_amount_cents := assessed_amount_cents).
          Compensating action: /subrogate (reduces payout_amount_cents by
          subrogation_recovered_cents). Named invariant:
            net_insurer_outflow_cents
              == assessed_amount_cents - subrogation_recovered_cents
          after the (PAY, SUBROGATE) pair, regardless of intermediate state.
        test_recipe:
          setup:
            - "Bring task T to DELIVERED with FINALIZED ResponsibilityDecision D."
            - "POST /insurance-claims with requested_amount_cents=20000."
            - "POST /insurance-claims/C/prepare-evidence (REPORTED -> EVIDENCE_PREP)."
            - "POST /insurance-claims/C/assess with assessed_amount_cents=15000 (EVIDENCE_PREP -> ASSESSMENT)."
          trigger:
            - "POST /insurance-claims/C/pay (ASSESSMENT -> PAID_OUT)."
            - "POST /insurance-claims/C/subrogate with subrogation_recovered_cents=4000 (PAID_OUT -> SUBROGATION)."
          assert:
            - "After /pay: InsuranceClaim.payout_amount_cents == 15000 (equals assessed_amount_cents)."
            - "After /subrogate: InsuranceClaim.payout_amount_cents == 11000 (15000 - 4000)."
            - "InsuranceClaim.subrogation_recovered_cents == 4000."
            - "Invariant: payout_amount_cents == assessed_amount_cents - subrogation_recovered_cents (11000 == 15000 - 4000)."

      - name: damaged_quantity_conservation_across_mediation_cycle
        grounds:
          - state_machines.ResponsibilityDecision.ACCEPTED_to_FINALIZED
          - state_machines.ResponsibilityDecision.UNDER_REVIEW_to_DISPUTED
          - state_machines.ResponsibilityDecision.MEDIATION_to_DRAFT
          - entities.ResponsibilityDecision.fields.attributed_quantity
          - entities.DamageAssessment.fields.damaged_quantity
        distinguishing_aspect: |
          DIFFERENT conserved quantity (damaged-unit count, integer attribution)
          on a DIFFERENT entity pair (ResponsibilityDecision +
          DamageAssessment). Forward action: FINALIZE (sets
          attributed_quantity := DamageAssessment.damaged_quantity).
          Compensating cycle: DISPUTE -> MEDIATION -> DRAFT -> revised
          submit -> ACCEPT -> FINALIZE. Invariant: after any (FINALIZE,
          mediation-cycle, FINALIZE) pair, attributed_quantity ==
          DamageAssessment.damaged_quantity exactly — the global damaged-unit
          count attributed across parties is conserved across revisions; the
          mediation cycle MUST NOT introduce drift in unit attribution.
        test_recipe:
          setup:
            - "Bring task T to DELIVERED. Create FINALIZED DamageAssessment ASSESS_A with damaged_quantity=10."
            - "Create decision D1 (DURATION_WEIGHTED, shipper_pct=0.50, carrier_pct=0.50, consignee_pct=0.00). /submit. All three parties /accept. /finalize."
            - "(After first finalize, decision D1.attributed_quantity == 10 == ASSESS_A.damaged_quantity.)"
            - "Test continues with a SECOND decision D2 on a sibling task T2 to exercise the cycle."
            - "On T2: create FINALIZED DamageAssessment ASSESS_B with damaged_quantity=7."
            - "Create decision D2 (DURATION_WEIGHTED, splits sum to 1.00). /submit. /dispute. /mediate. PATCH with revised splits 0.30/0.50/0.20. /submit. All parties /accept."
          trigger:
            - "POST /responsibility-decisions/D2/finalize (after the mediation cycle)."
          assert:
            - "ResponsibilityDecision D1.attributed_quantity == 10 (matches ASSESS_A.damaged_quantity; no drift)."
            - "ResponsibilityDecision D2.attributed_quantity == 7 (matches ASSESS_B.damaged_quantity; the mediation cycle did NOT modify damaged_quantity)."
            - "ASSESS_B.damaged_quantity is unchanged (still 7) after the cycle."
            - "Conserved-quantity invariant holds: D2.attributed_quantity == ASSESS_B.damaged_quantity even though the cycle revised percentage splits multiple times."
