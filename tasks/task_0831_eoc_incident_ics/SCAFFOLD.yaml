    code: 200
    input: [to_status, "actual_cost?"]
    output: CostRecord
    side_effects: ["state transition per CostRecord state machine; incident cost/federal-share recompute"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request body, missing required field, or field fails a type/format constraint" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a declared role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role is not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "JurisdictionLiaison X-User-ID does not match MutualAidRequest.to_jurisdiction_id" }
  - { id: ERR_INCIDENT_NOT_FOUND, http: 404, condition: "Referenced incident does not exist" }
  - { id: ERR_JURISDICTION_NOT_FOUND, http: 404, condition: "Referenced jurisdiction does not exist" }
  - { id: ERR_RESOURCE_POOL_NOT_FOUND, http: 404, condition: "Referenced resource pool does not exist" }
  - { id: ERR_RESOURCE_REQUEST_NOT_FOUND, http: 404, condition: "Referenced resource request does not exist" }
  - { id: ERR_IAP_NOT_FOUND, http: 404, condition: "Referenced incident action plan does not exist" }
  - { id: ERR_TASK_NOT_FOUND, http: 404, condition: "Referenced task does not exist" }
  - { id: ERR_SHELTER_NOT_FOUND, http: 404, condition: "Referenced shelter does not exist" }
  - { id: ERR_MUTUAL_AID_NOT_FOUND, http: 404, condition: "Referenced mutual-aid request does not exist" }
  - { id: ERR_DAMAGE_ASSESSMENT_NOT_FOUND, http: 404, condition: "Referenced damage assessment does not exist" }
  - { id: ERR_COST_RECORD_NOT_FOUND, http: 404, condition: "Referenced cost record does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition is not valid from the resource's current state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_incident_version does not match the incident's current version (OCC)" }
  - { id: ERR_CROSS_INCIDENT_REFERENCE, http: 409, condition: "A task's resource_request_id belongs to a different incident than the task's IAP" }
  - { id: ERR_OPERATIONAL_PERIOD_OVERLAP, http: 409, condition: "IAP operational period overlaps another PUBLISHED IAP for the same incident (adjacency allowed)" }
  - { id: ERR_DEPLOYMENT_WINDOW_CONFLICT, http: 409, condition: "Pool commitments overlapping the buffered deployment window would exceed total_units" }
  - { id: ERR_RESOURCE_WINDOW_MISMATCH, http: 409, condition: "Backing resource deploy_end precedes the IAP operational_period_start on task assignment" }
  - { id: ERR_INCIDENT_NOT_ACTIVE, http: 409, condition: "Operation requires Incident.op_status == ACTIVATED" }
  - { id: ERR_IAP_NOT_PUBLISHED, http: 409, condition: "Task assignment requires the referenced IAP to be PUBLISHED" }
  - { id: ERR_REQUEST_NOT_FILLED, http: 409, condition: "Task assignment with a backing resource requires that request to be FILLED" }
  - { id: ERR_INVALID_QUANTITY, http: 422, condition: "requested_quantity / offered_units / countered_units is less than 1" }
  - { id: ERR_INSUFFICIENT_RESOURCES, http: 409, condition: "Pool has fewer available units than requested, or resource_type mismatch, at SOURCED" }
  - { id: ERR_SHELTER_CAPACITY_EXCEEDED, http: 409, condition: "Occupancy change would push current_occupancy + reserved_occupancy above capacity" }
  - { id: ERR_SHELTER_OCCUPIED, http: 409, condition: "Shelter cannot close while it has current or reserved occupants" }
  - { id: ERR_INVALID_ACTIVATION_LEVEL, http: 422, condition: "to_activation_level is not one of LEVEL_1/LEVEL_2/LEVEL_3, or level change attempted while not ACTIVATED" }
  - { id: ERR_MISSING_TRANSITION_TARGET, http: 422, condition: "Incident transition supplied neither to_status nor to_activation_level" }
  - { id: ERR_INCIDENT_NOT_READY_TO_CLOSE, http: 409, condition: "Incident has in-flight requests, open/planned shelters, or ESTIMATED cost records at close" }
  - { id: ERR_COST_CEILING_EXCEEDED, http: 409, condition: "Creating the cost record would push total_committed_cost above cost_ceiling" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: EOCManager
    description: "EOC director / Incident Commander. Owns the incident lifecycle, activation level, and jurisdiction registry."
    identity: opaque
    exclusive_operations:
      - "POST /eoc/incidents (create incident)"
      - "POST /eoc/incidents/{id}/transition (activate / demobilize / close / set activation level)"
      - "POST /eoc/jurisdictions (register partner jurisdiction)"
    shared_operations:
      - "All GET reads and the situation-report snapshot"

  - name: LogisticsChief
    description: "Logistics Section. Owns resource pools, sources/fills/denies ICS-213RR requests, and drives mutual-aid negotiation from the requesting side."
    identity: opaque
    exclusive_operations:
      - "POST /eoc/resource-pools (create pool)"
      - "POST /eoc/resource-requests/{id}/transition (NEEDS_INFO / SOURCED / FILLED / DENIED / DEMOBILIZED)"
      - "POST /eoc/mutual-aid-requests (create) and COUNTERED / ACCEPTED / DECLINED / WITHDRAWN transitions"
    shared_operations:
      - "POST /eoc/resource-requests/{id}/transition (endpoint shared with OperationsChief; per-transition actor enforced)"
      - "All GET reads and the situation-report snapshot"

  - name: OperationsChief
    description: "Operations Section. Submits ICS-213RR requests, executes tasks (ICS-204), and runs shelters."
    identity: opaque
    exclusive_operations:
      - "POST /eoc/resource-requests (create) and SUBMITTED / resubmit transitions"
      - "POST /eoc/tasks/{id}/transition (ASSIGNED / COMPLETED / CANCELLED)"
      - "POST /eoc/shelters (create), shelter transition, and shelter occupancy"
    shared_operations:
      - "POST /eoc/resource-requests/{id}/transition (endpoint shared with LogisticsChief)"
      - "All GET reads and the situation-report snapshot"

  - name: PlanningChief
    description: "Planning Section. Owns the IAP, tasks/objectives, and damage assessments feeding the declaration."
    identity: opaque
    exclusive_operations:
      - "POST /eoc/incident-action-plans (create) and PUBLISHED / CLOSED transitions"
      - "POST /eoc/tasks (create task/objective)"
      - "POST /eoc/damage-assessments (create) and VALIDATED / REJECTED transitions"
    shared_operations:
      - "All GET reads and the situation-report snapshot"

  - name: FinanceChief
    description: "Finance/Admin Section. Owns FEMA-PA cost-recovery documentation (CostRecords)."
    identity: opaque
    exclusive_operations:
      - "POST /eoc/cost-records (create) and ACTUAL / VOID transitions"
    shared_operations:
      - "All GET reads and the situation-report snapshot"

  - name: JurisdictionLiaison
    description: "Represents a specific partner jurisdiction; responds to mutual-aid requests directed at its own jurisdiction. X-User-ID equals the Jurisdiction id."
    identity: "entity_backed:Jurisdiction"
    exclusive_operations:
      - "POST /eoc/mutual-aid-requests/{id}/transition (OFFERED — offer/re-offer) for requests whose to_jurisdiction_id == X-User-ID"
    shared_operations:
      - "POST /eoc/mutual-aid-requests/{id}/transition (endpoint shared with LogisticsChief; per-transition actor + ownership enforced)"
      - "All GET reads and the situation-report snapshot"
