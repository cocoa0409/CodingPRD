              as: PlanAdmin
          assert:
            - "POST /accounts/${acc_id}/activate returns 409 ERR_INVALID_STATE (Participant.hdhp_covered == false)"
            - "Account.${acc_id}.funding_status == PENDING (unchanged)"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: health_fsa_closed_interval_shared_boundary_collides
        grounds:
          - validations[priority=14]
          - entities.Account.fields.plan_year_id
          - entities.PlanYear.fields.coverage_end
        distinguishing_aspect: |
          CLOSED-interval semantics on a HEALTH_FSA resource: a second HEALTH_FSA whose plan-year window
          [2026-06-30, ...] shares exactly the boundary day 2026-06-30 with the participant's existing
          HEALTH_FSA window [2026-01-01, 2026-06-30] collides (a.start <= b.end AND b.start <= a.end),
          rejected with ERR_COVERAGE_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Two HEALTH_FSA plan years exist whose closed coverage intervals share the boundary day 2026-06-30."
            - "Participant P already has a non-CLOSED HEALTH_FSA under the first plan year."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /plan-years"
              payload: { label: "PY-H1", coverage_start: "2026-01-01", coverage_end: "2026-06-30", run_out_end: "2026-09-30", health_fsa_cap_cents: 335000, hsa_individual_cap_cents: 437500, hsa_family_cap_cents: 865000, hsa_catchup_cents: 100000, dcfsa_cap_joint_cents: 500000, dcfsa_cap_separate_cents: 250000 }
              as: PlanAdmin
              captures: { py1_id: $.data.id }
            - call: "POST /plan-years"
              payload: { label: "PY-H2", coverage_start: "2026-06-30", coverage_end: "2026-12-31", run_out_end: "2027-03-31", health_fsa_cap_cents: 335000, hsa_individual_cap_cents: 437500, hsa_family_cap_cents: 865000, hsa_catchup_cents: 100000, dcfsa_cap_joint_cents: 500000, dcfsa_cap_separate_cents: 250000 }
              as: PlanAdmin
              captures: { py2_id: $.data.id }
            - call: "POST /participants"
              payload: { email: "p8a@x.com", full_name: "P8a", birth_date: "1990-01-01" }
              as: PlanAdmin
              captures: { p_id: $.data.id }
            - call: "POST /accounts"
              payload: { participant_id: "${p_id}", plan_year_id: "${py1_id}", account_type: "HEALTH_FSA", elected_amount_cents: 100000 }
              as: PlanAdmin
              captures: { acc1_id: $.data.id }
          trigger:
            - call: "POST /accounts"
              payload: { participant_id: "${p_id}", plan_year_id: "${py2_id}", account_type: "HEALTH_FSA", elected_amount_cents: 100000 }
              as: PlanAdmin
          assert:
            - "Second POST /accounts returns 409 ERR_COVERAGE_WINDOW_OVERLAP (closed intervals share boundary day 2026-06-30)"
            - "GET /accounts?participant_id=${p_id}&account_type=HEALTH_FSA returns exactly one account"

      - name: dcfsa_half_open_interval_shared_boundary_permitted
        grounds:
          - validations[priority=14]
          - entities.Account.fields.plan_year_id
          - entities.PlanYear.fields.coverage_start
        distinguishing_aspect: |
          HALF-OPEN interval semantics on a DCFSA resource (different geometry from the HEALTH_FSA
          sibling): two DCFSA windows [2026-01-01,2026-12-31) and [2026-12-31,2027-12-31) share the
          boundary day 2026-12-31 but do NOT collide under half-open arithmetic (a.start < b.end AND
          b.start < a.end is false), so the second DCFSA opens successfully.
        test_recipe:
          setup:
            - "Two DCFSA plan years exist whose half-open coverage intervals abut at 2026-12-31."
            - "Participant P already has a non-CLOSED DCFSA under the first plan year."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /plan-years"
              payload: { label: "PY-D1", coverage_start: "2026-01-01", coverage_end: "2026-12-31", run_out_end: "2027-03-31", dcfsa_cap_joint_cents: 500000, dcfsa_cap_separate_cents: 250000, hsa_individual_cap_cents: 437500, hsa_family_cap_cents: 865000, hsa_catchup_cents: 100000, health_fsa_cap_cents: 335000 }
              as: PlanAdmin
              captures: { py1_id: $.data.id }
            - call: "POST /plan-years"
              payload: { label: "PY-D2", coverage_start: "2026-12-31", coverage_end: "2027-12-31", run_out_end: "2028-03-31", dcfsa_cap_joint_cents: 500000, dcfsa_cap_separate_cents: 250000, hsa_individual_cap_cents: 437500, hsa_family_cap_cents: 865000, hsa_catchup_cents: 100000, health_fsa_cap_cents: 335000 }
              as: PlanAdmin
              captures: { py2_id: $.data.id }
            - call: "POST /participants"
              payload: { email: "p8b@x.com", full_name: "P8b", birth_date: "1990-01-01", marital_status: "SINGLE" }
              as: PlanAdmin
              captures: { p_id: $.data.id }
            - call: "POST /accounts"
              payload: { participant_id: "${p_id}", plan_year_id: "${py1_id}", account_type: "DCFSA", elected_amount_cents: 300000 }
              as: PlanAdmin
              captures: { acc1_id: $.data.id }
          trigger:
            - call: "POST /accounts"
              payload: { participant_id: "${p_id}", plan_year_id: "${py2_id}", account_type: "DCFSA", elected_amount_cents: 300000 }
              as: PlanAdmin
              captures: { acc2_id: $.data.id }
          assert:
            - "Second POST /accounts returns 201 (half-open windows sharing boundary day 2026-12-31 do not collide)"
            - "GET /accounts?participant_id=${p_id}&account_type=DCFSA returns exactly two accounts"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: reimburse_then_clawback_conserves_fsa_election_pool
        grounds:
          - state_machines.Claim.APPROVED_to_REIMBURSED
          - state_machines.Claim.REIMBURSED_to_VOIDED
          - calculations.Available-Balance
        distinguishing_aspect: |
          Conserved quantity = the FSA election pool: available_balance_cents + reimbursed_cents ==
          elected_amount_cents + carried_in_cents (= 335000) MUST hold both after a REIMBURSEMENT and
          after its compensating REIMBURSEMENT_REVERSAL (clawback void), leaving zero drift.
        test_recipe:
          setup:
            - "Participant P owns an ACTIVE HEALTH_FSA, elected 335000, carried_in 0; available 335000."
            - "A substantiated MEDICAL claim for 80000 is APPROVED, then REIMBURSED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /plan-years"
              payload: { label: "PY2026", coverage_start: "2026-01-01", coverage_end: "2026-12-31", run_out_end: "2027-03-31", hsa_individual_cap_cents: 437500, hsa_family_cap_cents: 865000, hsa_catchup_cents: 100000, health_fsa_cap_cents: 335000, dcfsa_cap_joint_cents: 500000, dcfsa_cap_separate_cents: 250000 }
              as: PlanAdmin
              captures: { py_id: $.data.id }
            - call: "POST /participants"
              payload: { email: "p9a@x.com", full_name: "P9a", birth_date: "1990-01-01" }
              as: PlanAdmin
              captures: { p_id: $.data.id }
            - call: "POST /accounts"
              payload: { participant_id: "${p_id}", plan_year_id: "${py_id}", account_type: "HEALTH_FSA", elected_amount_cents: 335000, auto_adjudication_threshold_cents: 1000000 }
              as: PlanAdmin
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /claims"
              payload: { account_id: "${acc_id}", service_date: "2026-04-01", expense_category: "MEDICAL", claimed_amount_cents: 80000, substantiated: true }
              as: PlanAdmin
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/adjudicate"
              payload: { decision: "APPROVE" }
              as: Adjudicator
              as_user_id: "adj-1"
            - call: "POST /reimbursement-batches"
              payload: { participant_id: "${p_id}", claim_ids: ["${claim_id}"] }
              as: FundDisburser
              as_user_id: "disb-1"
              captures: { batch_id: $.data.id }
            - call: "GET /accounts/${acc_id}"
              payload: {}
              as: FundDisburser
              captures: { acc_v: $.data.version }
            - call: "POST /reimbursement-batches/${batch_id}/disburse"
              payload: { expected_account_version: "${acc_v}" }
              as: FundDisburser
              as_user_id: "disb-1"
          trigger:
            - call: "POST /claims/${claim_id}/void"
              payload: {}
              as: PlanAdmin
            - call: "GET /accounts/${acc_id}"
              payload: {}
              as: PlanAdmin
              captures: { avail: $.data.available_balance_cents, reimb: $.data.reimbursed_cents }
          assert:
            - "After REIMBURSED: available_balance_cents 255000 + reimbursed_cents 80000 == 335000"
            - "After clawback void: Account.${acc_id}.available_balance_cents == 335000 and reimbursed_cents == 0 (pool conserved at 335000, zero drift)"
            - "Claim.${claim_id}.status == VOIDED"

      - name: contribute_then_reverse_conserves_hsa_contributed_principal
        grounds:
          - state_machines.Account.PENDING_to_ACTIVE
          - calculations.Available-Balance
          - entities.Contribution.fields.status
        distinguishing_aspect: |
          A DIFFERENT conserved quantity (HSA contributed principal, not the FSA election pool):
          contributed_cents == sum(CONTRIBUTION ledger) - sum(CONTRIBUTION_REVERSAL ledger). Posting a
          50000 contribution then reversing it returns contributed_cents and available_balance_cents to 0
          with no drift.
        test_recipe:
          setup:
            - "Participant P (hdhp_covered=true) owns an ACTIVE HSA with one POSTED 50000 contribution; contributed 50000, available 50000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /plan-years"
              payload: { label: "PY2026", coverage_start: "2026-01-01", coverage_end: "2026-12-31", run_out_end: "2027-03-31", hsa_individual_cap_cents: 437500, hsa_family_cap_cents: 865000, hsa_catchup_cents: 100000, health_fsa_cap_cents: 335000, dcfsa_cap_joint_cents: 500000, dcfsa_cap_separate_cents: 250000 }
              as: PlanAdmin
              captures: { py_id: $.data.id }
            - call: "POST /participants"
              payload: { email: "p9b@x.com", full_name: "P9b", birth_date: "1990-01-01", hdhp_covered: true }
              as: PlanAdmin
              captures: { p_id: $.data.id }
            - call: "POST /accounts"
              payload: { participant_id: "${p_id}", plan_year_id: "${py_id}", account_type: "HSA", coverage_tier: "SELF_ONLY", elected_amount_cents: 437500 }
              as: PlanAdmin
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/activate"
              payload: {}
              as: PlanAdmin
              captures: { acc_v1: $.data.version }
            - call: "POST /accounts/${acc_id}/contributions"
              payload: { amount_cents: 50000, source: "PAYROLL", posted_at: "2026-02-01T00:00:00Z", expected_account_version: "${acc_v1}" }
              as: PlanAdmin
              captures: { contrib_id: $.data.id }
            - call: "GET /accounts/${acc_id}"
              payload: {}
              as: PlanAdmin
              captures: { acc_v2: $.data.version }
          trigger:
            - call: "POST /accounts/${acc_id}/contributions/${contrib_id}/reverse"
              payload: { expected_account_version: "${acc_v2}" }
              as: PlanAdmin
            - call: "GET /accounts/${acc_id}"
              payload: {}
              as: PlanAdmin
              captures: { contributed: $.data.contributed_cents, avail: $.data.available_balance_cents }
          assert:
            - "After reverse: Account.${acc_id}.contributed_cents == 0 and available_balance_cents == 0 (principal conserved to baseline, zero drift)"
            - "Contribution.${contrib_id}.status == REVERSED"
            - "GET /accounts/${acc_id}/ledger-entries?entry_type=CONTRIBUTION_REVERSAL returns one entry with amount_cents == 50000"
