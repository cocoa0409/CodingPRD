  # ------------------------------------------------------------------ Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: order_cancel_cascades_phase_window_and_frees_plant_capacity
        grounds:
          - state_machines.ProjectOrder.ACKNOWLEDGED_to_CANCELLED
          - state_machines.InstallationPhase
          - state_machines.InstallWindow
          - calculations.plant_capacity_available
        distinguishing_aspect: |
          Depth-3 chain from POST /project-orders/{id}/cancel: (1) order
          ACKNOWLEDGED->CANCELLED mutates phase A1 to CANCELLED; (2) the phase
          cancellation itself cancels its RESERVED window and releases its
          plant-day reservation; (3) the release itself makes a previously
          rejected reserve-slot on the same plant/day (order B, phase B1)
          succeed. Each link is caused by the previous link, not by the
          original cancel.
        test_recipe:
          setup:
            - "agreement with two acknowledged orders (A and B) on the same locked 4-chair configuration; cumulative volume 1000000"
            - "order A phase A1: 120 units reserved PLANT_GR 2026-11-02 (plant-day full); RESERVED window on A1"
            - "order B phase B1: 60 units; its reserve-slot for PLANT_GR 2026-11-02 already rejected with ERR_PLANT_CAPACITY_EXCEEDED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ManufacturerAdmin }
            - { call: "POST /product-families", payload: { family_code: "SEAT-2200", name: "Seating 2200", category: "SEATING", base_lead_time_days: 28 }, as: ManufacturerAdmin }
            - { call: "POST /dealers", payload: { name: "Dealer Alpha", territory_codes: ["MI", "OH"], service_capability_level: 4 }, as: ManufacturerAdmin, captures: { dlr_id: "$.data.id" } }
            - { call: "POST /end-users", payload: { name: "MegaCorp", industry: "technology" }, as: ManufacturerAdmin, captures: { eu_id: "$.data.id" } }
            - { call: "POST /volume-agreements", payload: { end_user_id: "${eu_id}", effective_start: "2026-01-01", effective_end: "2027-12-31", tier1_discount_pct: 0.10, tier2_discount_pct: 0.15, tier3_discount_pct: 0.20 }, as: ManufacturerAdmin, captures: { agr_id: "$.data.id" } }
            - { call: "POST /volume-agreements/${agr_id}/activate", as: ManufacturerAdmin }
            - { call: "POST /configurations", payload: { name: "Chairs", modules: [{ module_type: "TASK_CHAIR_SET", fabric_grade: "A", qty: 4 }] }, as: DealerRep, as_user_id: "${dlr_id}", captures: { cfg_id: "$.data.id" , cfg_v: "$.data.version" } }
            - { call: "POST /configurations/${cfg_id}/lock", payload: { expected_configuration_version: "${cfg_v}" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /project-orders", payload: { volume_agreement_id: "${agr_id}", configuration_id: "${cfg_id}", territory_code: "MI", requested_install_date: "2026-12-15" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { ordA_id: "$.data.id", ordA_v: "$.data.version" } }
            - { call: "POST /project-orders/${ordA_id}/submit", payload: { expected_order_version: "${ordA_v}" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /project-orders/${ordA_id}/acknowledge", as: ManufacturerAdmin }
            - { call: "POST /project-orders/${ordA_id}/phases", payload: { floor_number: 1, phase_sequence: 1, building_zone_id: "Z1", planned_units: 120 }, as: DealerRep, as_user_id: "${dlr_id}", captures: { phA_id: "$.data.id" } }
            - { call: "POST /phases/${phA_id}/reserve-slot", payload: { plant_code: "PLANT_GR", production_date: "2026-11-02" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /install-windows", payload: { installation_phase_id: "${phA_id}", start_at: "2026-12-01T09:00:00Z", end_at: "2026-12-01T12:00:00Z", union_required: false, elevator_required: true, crew_size: 4 }, as: DealerRep, as_user_id: "${dlr_id}", captures: { winA_id: "$.data.id" } }
            - { call: "POST /project-orders", payload: { volume_agreement_id: "${agr_id}", configuration_id: "${cfg_id}", territory_code: "MI", requested_install_date: "2026-12-15" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { ordB_id: "$.data.id", ordB_v: "$.data.version" } }
            - { call: "POST /project-orders/${ordB_id}/submit", payload: { expected_order_version: "${ordB_v}" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /project-orders/${ordB_id}/acknowledge", as: ManufacturerAdmin }
            - { call: "POST /project-orders/${ordB_id}/phases", payload: { floor_number: 2, phase_sequence: 1, building_zone_id: "Z1", planned_units: 60 }, as: DealerRep, as_user_id: "${dlr_id}", captures: { phB_id: "$.data.id" } }
            - { call: "POST /phases/${phB_id}/reserve-slot", payload: { plant_code: "PLANT_GR", production_date: "2026-11-02" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { err_full: "$.data.error_id" } }
          trigger:
            - { call: "POST /project-orders/${ordA_id}/cancel", payload: { reason: "scope cut" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "GET /project-orders/${ordA_id}/phases", as: DealerRep, as_user_id: "${dlr_id}", captures: { phA_log: "$.data[0].logistics_status", phA_ins: "$.data[0].install_status" } }
