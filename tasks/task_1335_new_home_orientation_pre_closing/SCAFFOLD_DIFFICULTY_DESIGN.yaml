            - "after new deficiency: Home.${h1}.status == ORIENTED (observed ${home_status_stale})"
            - "after re-sign: signature status == SIGNED and open_item_snapshot_count == 1 (the still-open new item; snapshot counts ALL non-terminal items incl. IDENTIFIED)"
