          assert:
            - "the first trigger returns status 201"
            - "VoluntaryDisclosureAgreement.${agr_inside_id}.status == \"DRAFTED\""
            - "the third trigger returns status 422 with error_id ERR_PROGRAM_WINDOW_CLOSED"
            - "AmnestyProgram.${prog_id}.status == \"OPEN\" (the row was never closed; only the clock moved)"
            - "GET /amnesty/agreements?program_id=${prog_id} returns total_count == 1"

      - name: down_payment_minimum_is_inclusive_at_ten_percent
        grounds:
          - validations[priority=41]
          - calculations.installment_schedule_generation.constants.MIN_DOWN_PAYMENT_PCT
          - errors[ERR_DOWN_PAYMENT_BELOW_MINIMUM]
        distinguishing_aspect: |
          With total_due_cents 1050000 the minimum is round_half_up(1050000 * 0.10) = 105000
          exactly. 104999 is refused and 105000 is accepted, so the comparison must be >= on the
          rounded product; a strict > or a floor of the product shifts the accepted value by one cent.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; OPEN program with installment_max_count 12 and one SALES_USE term"
            - "Taxpayer Bramble Hill holds an EXECUTED agreement with one FILED return and total_due_cents 1050000"
            - "No payment plan exists yet, so the agreement version is read immediately before proposing"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
