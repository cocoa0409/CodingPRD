            - "GET /allegations with subject_officer_id ${subj_id} returns total_count == 1 and data[0].id == ${aa_id}"

  # =========================================================================
  # Guide section 2 - State Machines (§1.2, 12 machines)
  # =========================================================================
  - section: state_machines
    instances:
      - name: complaint_and_investigation_rows_start_in_their_declared_initial_states
        claim_type: Initial State
        grounds:
          - state_machines.Complaint.initial_state
          - state_machines.Complaint.transitions.INTAKE_RECEIVED_to_SCREENING
          - state_machines.Complaint.transitions.INTAKE_RECEIVED_to_CLASSIFIED
          - state_machines.Investigation.initial_state
        distinguishing_aspect: |
          Complaint declares initial_state INTAKE_RECEIVED, but both exits from it are system
          transitions that fire inside POST /complaints, so the created row is never observable
          in INTAKE_RECEIVED: an ANONYMOUS minor complaint is already SCREENING and a
          SUPERVISOR complaint is already CLASSIFIED in the creation response. Every derived
          counter must still read its initial value, and the Investigation created later starts
          in UNASSIGNED with a zeroed ledger.
        test_recipe:
          setup:
            - "The logical clock stands at 2026-08-01T00:00:00Z."
            - "One INTERNAL_AFFAIRS unit, one PATROL_DIVISION unit with intake_enabled true, Commander Reyes, Sergeant Doyle and Officer Vance exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /units"
