          assert:
            - "${case_v_create} == 1 — a freshly created row starts at version 1"
            - "${case_v_after_read} == 1 — a GET never advances the version"
            - "${case_v_schedule} == 2, ${case_v_prep} == 3, ${case_v_clear} == 4, ${case_v_checkin} == 5, ${case_v_complete} == 6 — exactly one increment per successful write, including the two writes that do not change schedule_status"
            - "${e_not_cleared} == \"ERR_CASE_NOT_CLEARED\" at HTTP 409 and ${case_v_after_refusal} == 2 — a refused write leaves the version untouched"
            - "${room_v_end} == ${room_v0} + 1 — of the five successful case writes only the schedule rewrote the room's occupancy ledger; the prep acknowledgement, clearance review, check-in and completion left the room at that version"

      - name: ccl_derived_field_reconciliation_counters
        claim_type: derived_field_reconciliation
        grounds:
          - entities[Patient].outstanding_recall_count
          - entities[ProcedureRoom].occupied_block_count
          - state_machines[SurveillanceRecall.status]
          - state_machines[ProcedureCase.schedule_status]
        distinguishing_aspect: "Two derived counters are checked after a create, after an update that moves a source row to a non-counted state, and after the source row leaves the counted set entirely. Patient.outstanding_recall_count follows the open recall set through create, close and supersede — and a supersede holds the count flat at 2 because one row enters SCHEDULED_DUE as another leaves it. ProcedureRoom.occupied_block_count follows the room's committed blocks through two schedules, a cancel and a no-show back down to zero, so the counter is reconciled rather than monotonically incremented."
        test_recipe:
          setup:
            - "urologist, scheduler, nurse; patient; room Cysto A; type CYSTOSCOPY; clock 2026-09-14T09:00:00Z"
            - "two cases at 09:00 and 11:00, both scheduled"
          setup_api_calls:
            - call: "POST /urology/providers"
              payload: { full_name: "Dr Ada Nour", npi: "1000000001", role_type: "UROLOGIST" }
              as: PracticeAdmin
              captures: { uro_id: $.data.id }
            - call: "POST /urology/providers"
              payload: { full_name: "Sam Reyes", npi: "1000000002", role_type: "SCHEDULER" }
              as: PracticeAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /urology/providers"
              payload: { full_name: "Nia Park", npi: "1000000003", role_type: "RN" }
              as: PracticeAdmin
              captures: { rn_id: $.data.id }
            - call: "POST /urology/patients"
              payload: { mrn: "MRN-5082", full_name: "Wes Hone", date_of_birth: "1951-11-01", primary_urologist_id: "${uro_id}", egfr: 61 }
              as: Scheduler
              as_user_id: "${sch_id}"
              captures: { pat_id: $.data.id, pat_v0: $.data.version }
            - call: "POST /urology/procedure-rooms"
              payload: { name: "Cysto A", room_type: "CYSTO_SUITE", turnover_minutes: 10 }
              as: PracticeAdmin
              captures: { room_id: $.data.id, room_v0: $.data.version }
            - call: "POST /urology/procedure-types"
              payload: { code: "CYSTOSCOPY", base_minutes: 20, cleanup_class: "HIGH", allowed_room_type: "CYSTO_SUITE", required_prep_codes: [] }
              as: PracticeAdmin
              captures: { type_id: $.data.id }
            - call: "POST /urology/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T09:00:00Z" }
              as: PracticeAdmin
            - call: "POST /urology/procedure-cases"
              payload: { patient_id: "${pat_id}", procedure_type_id: "${type_id}", room_id: "${room_id}", primary_provider_id: "${uro_id}", scheduled_start_at: "2026-09-14T09:00:00Z" }
              as: Scheduler
              as_user_id: "${sch_id}"
              captures: { case_1_id: $.data.id }
            - call: "POST /urology/procedure-cases"
              payload: { patient_id: "${pat_id}", procedure_type_id: "${type_id}", room_id: "${room_id}", primary_provider_id: "${uro_id}", scheduled_start_at: "2026-09-14T11:00:00Z" }
              as: Scheduler
              as_user_id: "${sch_id}"
              captures: { case_2_id: $.data.id }
          trigger:
            - call: "POST /urology/surveillance-recalls"
              payload: { patient_id: "${pat_id}", protocol: "STONE", risk_tier: "LOW", anchor_date: "2026-09-01", expected_patient_version: "${pat_v0}" }
              as: Urologist
              as_user_id: "${uro_id}"
              captures: { recall_stone_id: $.data.id, pat_v1: $.data.version }
            - call: "GET /urology/patients/${pat_id}"
              payload: {}
              as: PracticeAdmin
              captures: { pat_v1_read: $.data.version }
            - call: "POST /urology/surveillance-recalls"
              payload: { patient_id: "${pat_id}", protocol: "BLADDER_CANCER", risk_tier: "LOW", anchor_date: "2026-09-01", expected_patient_version: "${pat_v1_read}" }
              as: Urologist
              as_user_id: "${uro_id}"
              captures: { recall_bc_id: $.data.id }
            - call: "POST /urology/surveillance-recalls/${recall_stone_id}/close"
              payload: { closed_reason: "PATIENT_DECLINED" }
              as: Urologist
              as_user_id: "${uro_id}"
            - call: "GET /urology/patients/${pat_id}"
              payload: {}
              as: PracticeAdmin
              captures: { pat_v_after_close: $.data.version }
            - call: "POST /urology/surveillance-recalls"
              payload: { patient_id: "${pat_id}", protocol: "BLADDER_CANCER", risk_tier: "HIGH", anchor_date: "2026-09-14", expected_patient_version: "${pat_v_after_close}" }
              as: Urologist
              as_user_id: "${uro_id}"
              captures: { recall_bc2_id: $.data.id }
            - call: "POST /urology/procedure-cases/${case_1_id}/schedule"
