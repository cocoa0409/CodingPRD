          setup:
            - "Agreement Aurora Solo (advance 3600000, single ALPHA milestone funded 3600000) is ACTIVE; build 1 (75.00 / 96.00 / 60.00 / 5) passed the gate."
            - "A CONDITIONAL review with conditions [0] and the default cure_days 14 was recorded at the default clock 2026-08-01T00:00:00Z, so cure_deadline_at == 2026-08-15T00:00:00.000Z and the milestone is CURE_PENDING with cure_count 1."
