  # =========================================================================
  # SECTION: validations
  # =========================================================================
  - section: validations
    instances:

      - name: gauntlet_origin_rung_wins_over_condition_safety_connectivity_and_consent
        claim_type: priority_ordering
        grounds:
          - "validations[priority=11]"
          - "validations[priority=12]"
          - "validations[priority=15]"
          - "validations[priority=16]"
          - "validations[priority=18]"
          - entities.Referral.fields.first_failed_gauntlet_rung
        distinguishing_aspect: "A referral violating five gauntlet rungs at once (CLINIC origin, OTHER condition, FAIL safety, FAIL broadband, unsigned consent) surfaces only the lowest-numbered ERR_REFERRAL_ORIGIN_INELIGIBLE at priority 11."
        test_recipe:
          setup:
            - "One SCREENING referral whose origin is CLINIC and condition OTHER, with an assessment that fails home safety, fails broadband and has no consent."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /patients"
              payload: { mrn: "MRN-GT", full_name: "Gus Gauntlet", home_distance_km: 60.0, primary_diagnosis_code: "OTHER", diet_restriction: "NONE", broadband_verified: false, caregiver_present: false }
              as: AdmittingPhysician
              captures: { pat_gt: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_gt}", origin: "CLINIC", qualifying_condition_code: "OTHER", acuity: "HIGH", referring_physician_user_id: "phys-1" }
              as: AdmittingPhysician
              captures: { ref_gt: $.data.id }
            - call: "POST /eligibility-assessments"
              payload: { referral_id: "${ref_gt}", in_person_eval_at: "2026-06-01T06:00:00Z", home_safety_outcome: "FAIL", broadband_check: "FAIL", caregiver_present_confirmed: false, consent_signed: false, assessor_user_id: "phys-1" }
              as: AdmittingPhysician
          trigger:
            - call: "POST /referrals/${ref_gt}/mark-eligible"
              payload: {}
              as: AdmittingPhysician
              captures: { err_gt: $.data.error_id }
          assert:
            - "error_id == ERR_REFERRAL_ORIGIN_INELIGIBLE with HTTP 422"
            - "error_id is none of ERR_CONDITION_NOT_QUALIFYING, ERR_OUTSIDE_SERVICE_RADIUS, ERR_HOME_SAFETY_FAILED, ERR_CONNECTIVITY_INSUFFICIENT, ERR_CAREGIVER_REQUIRED, ERR_CONSENT_MISSING"
            - "Referral.${ref_gt}.status is still SCREENING"
            - "Referral.${ref_gt}.first_failed_gauntlet_rung == ERR_REFERRAL_ORIGIN_INELIGIBLE"

      - name: qualifying_condition_other_is_rejected_while_origin_and_radius_pass
        claim_type: violation_to_error
        grounds:
          - "validations[priority=12]"
          - "errors[ERR_CONDITION_NOT_QUALIFYING]"
        distinguishing_aspect: "OTHER is a legal enum member of qualifying_condition_code but is never in QUALIFYING_CONDITION_CODES, so it clears rung 4 and fails at priority 12 with ERR_CONDITION_NOT_QUALIFYING."
        test_recipe:
          setup:
            - "One SCREENING referral from the ED with qualifying_condition_code OTHER and an all-PASS assessment."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /patients"
              payload: { mrn: "MRN-OT", full_name: "Ora Other", home_distance_km: 5.0, primary_diagnosis_code: "OTHER", diet_restriction: "NONE", broadband_verified: true, caregiver_present: true }
              as: AdmittingPhysician
              captures: { pat_ot: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_ot}", origin: "ED", qualifying_condition_code: "OTHER", acuity: "STANDARD", referring_physician_user_id: "phys-1" }
              as: AdmittingPhysician
              captures: { ref_ot: $.data.id }
            - call: "POST /eligibility-assessments"
              payload: { referral_id: "${ref_ot}", in_person_eval_at: "2026-06-01T06:00:00Z", home_safety_outcome: "PASS", broadband_check: "PASS", caregiver_present_confirmed: true, consent_signed: true, assessor_user_id: "phys-1" }
              as: AdmittingPhysician
          trigger:
            - call: "POST /referrals/${ref_ot}/mark-eligible"
              payload: {}
              as: AdmittingPhysician
              captures: { err_ot: $.data.error_id }
          assert:
            - "error_id == ERR_CONDITION_NOT_QUALIFYING with HTTP 422"
            - "Referral.${ref_ot}.first_failed_gauntlet_rung == ERR_CONDITION_NOT_QUALIFYING"

      - name: conditional_home_safety_outcome_is_rejected_like_an_outright_fail
        claim_type: violation_to_error
        grounds:
          - "validations[priority=15]"
          - "errors[ERR_HOME_SAFETY_FAILED]"
          - entities.EligibilityAssessment.fields.home_safety_outcome
        distinguishing_aspect: "The rung requires home_safety_outcome == PASS exactly, so the middle enum value CONDITIONAL rejects with ERR_HOME_SAFETY_FAILED just as FAIL does."
        test_recipe:
          setup:
            - "One SCREENING ED referral for a qualifying condition whose assessment records home_safety_outcome CONDITIONAL and everything else PASS."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /patients"
              payload: { mrn: "MRN-HS", full_name: "Hana Safety", home_distance_km: 5.0, primary_diagnosis_code: "CELLULITIS", diet_restriction: "NONE", broadband_verified: true, caregiver_present: true }
              as: AdmittingPhysician
              captures: { pat_hs: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_hs}", origin: "ED", qualifying_condition_code: "CELLULITIS", acuity: "STANDARD", referring_physician_user_id: "phys-1" }
              as: AdmittingPhysician
              captures: { ref_hs: $.data.id }
            - call: "POST /eligibility-assessments"
              payload: { referral_id: "${ref_hs}", in_person_eval_at: "2026-06-01T06:00:00Z", home_safety_outcome: "CONDITIONAL", broadband_check: "PASS", caregiver_present_confirmed: true, consent_signed: true, assessor_user_id: "phys-1" }
              as: AdmittingPhysician
          trigger:
            - call: "POST /referrals/${ref_hs}/mark-eligible"
              payload: {}
              as: AdmittingPhysician
              captures: { err_hs: $.data.error_id }
          assert:
            - "error_id == ERR_HOME_SAFETY_FAILED with HTTP 422"
            - "Referral.${ref_hs}.status is still SCREENING"

      - name: broadband_check_failure_returns_connectivity_insufficient
        claim_type: violation_to_error
        grounds:
          - "validations[priority=16]"
          - "errors[ERR_CONNECTIVITY_INSUFFICIENT]"
        distinguishing_aspect: "With safety PASS but broadband_check FAIL the gauntlet stops at priority 16 with ERR_CONNECTIVITY_INSUFFICIENT rather than the later caregiver or consent rungs."
        test_recipe:
          setup:
            - "One SCREENING ED referral for a qualifying condition whose assessment has home_safety_outcome PASS, broadband_check FAIL, caregiver confirmed and consent signed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /patients"
              payload: { mrn: "MRN-BB", full_name: "Bo Broadband", home_distance_km: 5.0, primary_diagnosis_code: "COPD_EXAC", diet_restriction: "NONE", broadband_verified: false, caregiver_present: true }
              as: AdmittingPhysician
              captures: { pat_bb: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_bb}", origin: "ED", qualifying_condition_code: "COPD_EXAC", acuity: "STANDARD", referring_physician_user_id: "phys-1" }
              as: AdmittingPhysician
              captures: { ref_bb: $.data.id }
            - call: "POST /eligibility-assessments"
              payload: { referral_id: "${ref_bb}", in_person_eval_at: "2026-06-01T06:00:00Z", home_safety_outcome: "PASS", broadband_check: "FAIL", caregiver_present_confirmed: true, consent_signed: true, assessor_user_id: "phys-1" }
              as: AdmittingPhysician
          trigger:
            - call: "POST /referrals/${ref_bb}/mark-eligible"
              payload: {}
              as: AdmittingPhysician
              captures: { err_bb: $.data.error_id }
          assert:
            - "error_id == ERR_CONNECTIVITY_INSUFFICIENT with HTTP 422"

      - name: high_acuity_without_caregiver_returns_caregiver_required_but_standard_passes
        claim_type: conditional_validation
        grounds:
          - "validations[priority=17]"
          - "errors[ERR_CAREGIVER_REQUIRED]"
          - entities.Referral.fields.acuity
        distinguishing_aspect: "The caregiver rung applies only when acuity == HIGH: the identical caregiver-absent data rejects the HIGH referral with ERR_CAREGIVER_REQUIRED and lets the STANDARD referral reach ELIGIBLE."
        test_recipe:
          setup:
            - "Two SCREENING ED referrals for qualifying conditions on caregiver-absent patients, one HIGH acuity and one STANDARD, both with PASS safety, PASS broadband and signed consent."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /patients"
              payload: { mrn: "MRN-CH", full_name: "Cal Caregiver High", home_distance_km: 5.0, primary_diagnosis_code: "CHF_EXAC", diet_restriction: "NONE", broadband_verified: true, caregiver_present: false }
              as: AdmittingPhysician
              captures: { pat_ch: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-CS", full_name: "Cleo Caregiver Std", home_distance_km: 5.0, primary_diagnosis_code: "CHF_EXAC", diet_restriction: "NONE", broadband_verified: true, caregiver_present: false }
              as: AdmittingPhysician
              captures: { pat_cs: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_ch}", origin: "ED", qualifying_condition_code: "CHF_EXAC", acuity: "HIGH", referring_physician_user_id: "phys-1" }
              as: AdmittingPhysician
              captures: { ref_ch: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_cs}", origin: "ED", qualifying_condition_code: "CHF_EXAC", acuity: "STANDARD", referring_physician_user_id: "phys-1" }
              as: AdmittingPhysician
              captures: { ref_cs: $.data.id }
            - call: "POST /eligibility-assessments"
              payload: { referral_id: "${ref_ch}", in_person_eval_at: "2026-06-01T06:00:00Z", home_safety_outcome: "PASS", broadband_check: "PASS", caregiver_present_confirmed: false, consent_signed: true, assessor_user_id: "phys-1" }
              as: AdmittingPhysician
            - call: "POST /eligibility-assessments"
              payload: { referral_id: "${ref_cs}", in_person_eval_at: "2026-06-01T06:00:00Z", home_safety_outcome: "PASS", broadband_check: "PASS", caregiver_present_confirmed: false, consent_signed: true, assessor_user_id: "phys-1" }
              as: AdmittingPhysician
          trigger:
            - call: "POST /referrals/${ref_ch}/mark-eligible"
              payload: {}
              as: AdmittingPhysician
              captures: { err_ch: $.data.error_id }
            - call: "POST /referrals/${ref_cs}/mark-eligible"
              payload: {}
              as: AdmittingPhysician
          assert:
            - "the HIGH-acuity call returns error_id ERR_CAREGIVER_REQUIRED with HTTP 422"
            - "Referral.${ref_ch}.status is still SCREENING"
            - "the STANDARD call succeeds and Referral.${ref_cs}.status == ELIGIBLE"

      - name: unsigned_consent_returns_consent_missing_as_the_last_gauntlet_rung
        claim_type: violation_to_error
        grounds:
          - "validations[priority=18]"
          - "errors[ERR_CONSENT_MISSING]"
        distinguishing_aspect: "With every earlier rung satisfied, consent_signed false is the sole failure and surfaces ERR_CONSENT_MISSING at priority 18, the last rung of the gauntlet."
        test_recipe:
          setup:
            - "One SCREENING ED referral for a qualifying condition whose assessment passes safety and broadband and confirms a caregiver but leaves consent unsigned."
