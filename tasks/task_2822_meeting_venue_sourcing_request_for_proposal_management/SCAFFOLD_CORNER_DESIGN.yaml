    - name: cyclic_proposal_returns_to_under_review_after_each_counter_round
      claim_type: cyclic
      grounds:
      - complexity_profile.state_machine_shape
      - state_machines.Proposal.COUNTERED_to_REVISED
      - state_machines.Proposal.REVISED_to_UNDER_REVIEW
      - entities.Proposal.fields.negotiation_round_count
      excluded_because:
        difficulty_instance: proposal_negotiation_cycle_revisits_under_review
        rationale: The cyclic-shape claim - the proposal loops UNDER_REVIEW -> COUNTERED -> REVISED -> UNDER_REVIEW while negotiation_round_count monotonically increases and each lap re-prices the grid - is exactly what that difficulty instance drives twice around the loop.
    - name: parallel_approval_and_signature_dimensions_advance_independently
      claim_type: parallel
      grounds:
      - complexity_profile.state_machine_shape
      - entities.Contract.fields.approval_state
      - entities.Contract.fields.signature_state
      excluded_because:
        difficulty_instance: contract_parallel_dimensions_join_from_approval_side
        rationale: Contract's two independent dimensions and the EXECUTED join that requires both of them to be complete are the whole subject of that difficulty instance, which drives the signature dimension to PLANNER_SIGNED while approval is still IN_APPROVAL and then closes the join.
    - name: bubble_up_final_approval_step_flips_contract_approval_state
      claim_type: Bubble up
      grounds:
      - state_machines.ApprovalStep.PENDING_to_APPROVED
      - entities.Contract.fields.approval_state
      - entities.Contract.fields.approved_at
      excluded_because:
        difficulty_instance: contract_parallel_dimensions_join_from_approval_side
        rationale: The bubble-up claim - the parent Contract auto-transitions to APPROVED only when the last child ApprovalStep leaves PENDING - is asserted step by step there, including the intermediate state where one step is APPROVED and the parent is still IN_APPROVAL.
    - name: cascade_down_award_rejects_only_non_terminal_sibling_proposals
      claim_type: Cascade down
      grounds:
      - state_machines.MeetingEvent.BID_REVIEW_to_AWARDED
      - state_machines.Proposal.UNDER_REVIEW_to_REJECTED
      - state_machines.VenueShortlistEntry.RFP_ISSUED_to_ELIMINATED
      excluded_because:
        difficulty_instance: award_cascade_four_hops_cancels_losing_venue_inspection
        rationale: That difficulty instance walks the full four-hop award cascade and asserts that only non-terminal siblings are touched - an already WITHDRAWN sibling keeps its state while the live one is rejected, its entry eliminated and its PLANNED inspection cancelled.
