# ---------------------------------------------------------------------------
# PRD-Bench scaffold — Resort Spa Operations & Treatment Scheduling
# §1.0–§1.7. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# ---------------------------------------------------------------------------

scenario: |
  2952. Resort Spa Operations & Treatment Scheduling (destination resort spa): treatment menu design with duration, room type requirements and therapist skill mapping, scheduling optimization across therapist certification, room availability and turnover time, guest intake with health questionnaire, contraindication screening and consent documentation, therapist licensing verification, continuing education and scope-of-practice compliance, commission and gratuity structure with service charge distribution rules, retail attachment programs with product recommendation tracking, cancellation policy with late-cancel charges and no-show handling on high-demand slots, facility utilization, revenue per treatment room and labor cost management

domain_name: resort-spa-operations
# Flat topology: every peer collection is mounted at the root, so the api_prefix
# is empty. Collections: /treatment-types, /treatment-rooms, /therapists,
# /therapist-licenses, /certifications, /guests, /intake-forms, /appointments,
# /retail-attachments, /reports, /compliance-sweeps.
api_prefix: ""

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by explicit foreign keys; no ownership tree in the URL
  # space beyond one sub-resource hop used purely for reverse-reachability.

  state_machine_shape: parallel
  # Appointment carries two independent state dimensions (schedule_status ×
  # clearance_status). TherapistLicense, Therapist and IntakeForm are cyclic.

  relationship_patterns:
    - one_to_many          # Therapist -> TherapistLicense / ShiftBlock / CertificationGrant
    - many_to_many         # Therapist <-> TreatmentType, resolved through CertificationGrant.skill_code
    - cross_aggregate      # Appointment references Guest, TreatmentType, TreatmentRoom, Therapist
    - polymorphic          # FolioCharge.kind discriminates treatment / retail / penalty / reversal postings

  role_model: segregation_of_duties
  # The user who submits a licence cannot review it; the user who screens an
  # intake form cannot override its flag.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:

  - name: TreatmentType
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Menu code, unique across all TreatmentType rows.
        constraints: "1..24 chars, uppercase alphanumeric plus '-'; unique"
      - name: name
        type: string
        source: input
        description: Guest-facing treatment name.
      - name: duration_minutes
        type: integer
        source: input
        description: Scheduled service duration used to derive Appointment.end_at.
        constraints: "15..240 and an exact multiple of 15"
      - name: room_class_required
        type: enum
        source: input
        description: Room class a booking of this treatment must be placed in.
        constraints: "DRY | WET | HYDRO | COUPLES"
      - name: required_skill_code
        type: string
        source: input
        description: Skill code a therapist must hold an ACTIVE CertificationGrant for.
        constraints: "1..32 chars uppercase"
      - name: required_scope_level
        type: enum
        source: input
        description: Minimum certification scope level for scope-of-practice compliance.
        constraints: "BASIC | ADVANCED (rank BASIC=1, ADVANCED=2)"
      - name: base_price_cents
        type: integer
        source: input
        description: List price before room-class, surcharge and loyalty adjustments.
        constraints: ">= 1"
      - name: contraindication_codes
        type: array
        source: input
        description: Condition codes that bar this treatment outright.
        default: "[]"
        constraints: "array of uppercase condition codes; may be empty"
      - name: retail_product_line
        type: string
        source: input
        description: Product line every RetailAttachment on this treatment must belong to.
      - name: required_consent_version
        type: string
        source: input
        description: Consent document version the guest must have signed.
        constraints: "e.g. '2026.1'"
      - name: high_demand
        type: boolean
        source: input
        description: Marks the treatment as a high-demand offering; drives surcharge and late-cancel uplift.
        default: false

  - name: TreatmentRoom
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Room code, unique across all TreatmentRoom rows.
        constraints: "1..24 chars; unique"
      - name: room_class
        type: enum
        source: input
        description: Physical class of the room.
        constraints: "DRY | WET | HYDRO | COUPLES"
      - name: capacity_guests
        type: integer
        source: input
        description: Number of guests the room can serve in one appointment.
        constraints: "1..2"
      - name: turnover_buffer_minutes
        type: integer
        source: input
        description: Sanitation/reset minutes appended to every appointment's room occupancy interval.
        constraints: "0..60"
      - name: hourly_fixed_cost_cents
        type: integer
        source: input
        description: Fixed room cost per hour used by the margin calculations.
        constraints: ">= 0"
      - name: status
        type: enum
        source: input
        description: Availability state of the room.
        default: ACTIVE
        constraints: "ACTIVE | MAINTENANCE | OUT_OF_SERVICE"
      - name: booked_minutes_total
        type: integer
        source: computed
        description: Running ledger of committed occupancy minutes (duration + turnover_buffer_minutes) over non-terminal and COMPLETED appointments.
        default: 0

  - name: Therapist
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Therapist display name.
      - name: employment_type
        type: enum
        source: input
        description: Payroll classification.
        constraints: "EMPLOYEE | CONTRACTOR"
      - name: commission_tier
        type: enum
        source: input
        description: Commission tier used by settlement_distribution.
        constraints: "JUNIOR | SENIOR | MASTER"
      - name: base_hourly_cost_cents
        type: integer
        source: input
        description: Hourly labour cost used by settlement_distribution.
        constraints: ">= 0"
      - name: practice_state_code
        type: string
        source: input
        description: Two-letter state the therapist practises in; must match the licence state.
        constraints: "exactly 2 uppercase letters"
      - name: status
        type: enum
        source: system
        description: Lifecycle state; gates every assignment and service transition.
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED | INACTIVE"
      - name: suspension_reason
        type: enum
        source: system
        description: Why the therapist is SUSPENDED or INACTIVE; null while ACTIVE.
        default: "null"
        constraints: "null | LICENSE_EXPIRED | DIRECTOR_ACTION"
      - name: assigned_minutes_total
        type: integer
        source: computed
        description: Running ledger of scheduled treatment minutes committed to this therapist over non-terminal and COMPLETED appointments.
        default: 0

  - name: TherapistLicense
    parent: Therapist
    common_fields: true
    fields:
      - name: therapist_id
        type: string
        source: system
        description: "FK -> Therapist.id; taken from the creation path, never from the body."
      - name: license_number
        type: string
        source: input
        description: State licence number.
      - name: license_type
        type: enum
        source: input
        description: Licence category.
        constraints: "LMT | ESTHETICIAN | NAIL_TECH"
      - name: state_code
        type: string
        source: input
        description: Issuing state; must equal Therapist.practice_state_code.
        constraints: "exactly 2 uppercase letters"
      - name: issued_on
        type: string
        source: input
        description: Issue date (date-only, YYYY-MM-DD).
      - name: expires_on
        type: string
        source: input
        description: Expiry date (date-only, YYYY-MM-DD); must be strictly after issued_on.
      - name: current_period_start_on
        type: string
        source: input
        description: First day of the current continuing-education period (date-only); lower bound of the CALENDAR_WINDOW variant.
      - name: ce_hours_required
        type: number
        source: input
        description: Continuing-education hours required for this renewal period.
        default: 12
        constraints: ">= 0, at most one decimal place"
      - name: verification_status
        type: enum
        source: system
        description: Licensing verification state.
        default: PENDING_REVIEW
        constraints: "PENDING_REVIEW | VERIFIED | REJECTED | EXPIRED"
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID that created or last resubmitted the licence; the segregation-of-duties counterparty for review.
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the last reviewer; null before the first review.
        default: "null"
      - name: review_note
        type: string
        source: system
        description: Free-text note recorded by the last review or resubmission; null when never set.
        default: "null"
      - name: verified_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent VERIFIED review; null otherwise.
        default: "null"
      - name: credited_ce_hours
        type: number
        source: computed
        description: CALENDAR_WINDOW credited continuing-education hours evaluated at the most recent review; 0 before the first review.
        default: 0

  - name: CertificationGrant
    parent: Therapist
    common_fields: true
    fields:
      - name: therapist_id
        type: string
        source: system
        description: "FK -> Therapist.id; taken from the creation path."
      - name: skill_code
        type: string
        source: input
        description: Skill this grant certifies; matched against TreatmentType.required_skill_code.
      - name: scope_level
        type: enum
        source: input
        description: Scope of practice granted.
        constraints: "BASIC | ADVANCED (rank BASIC=1, ADVANCED=2)"
      - name: granted_on
        type: string
        source: input
        description: Grant date (date-only).
      - name: expires_on
        type: string
        source: input
        description: Expiry date (date-only); must be strictly after granted_on.
      - name: status
        type: enum
        source: system
        description: Grant lifecycle state.
        default: ACTIVE
        constraints: "ACTIVE | LAPSED | REVOKED"
      - name: revoked_by_user_id
        type: string
        source: system
        description: X-User-ID that revoked the grant; null unless REVOKED.
        default: "null"

  - name: ContinuingEducationRecord
    parent: TherapistLicense
    common_fields: false
    fields:
      - name: license_id
        type: string
        source: system
        description: "FK -> TherapistLicense.id; taken from the creation path."
      - name: course_code
        type: string
        source: input
        description: Course identifier.
      - name: category
        type: enum
        source: input
        description: Continuing-education category; the per-category credit cap applies to each.
        constraints: "ETHICS | CLINICAL | SAFETY"
      - name: ce_hours
        type: number
        source: input
        description: Hours earned by this course.
        constraints: "> 0 and <= 8, at most one decimal place"
      - name: completed_on
        type: string
        source: input
        description: Completion date (date-only); decides which CE window the record falls in.
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer that recorded the course.

  - name: ShiftBlock
    parent: Therapist
    common_fields: true
    fields:
      - name: therapist_id
        type: string
        source: system
        description: "FK -> Therapist.id; taken from the creation path."
      - name: block_type
        type: enum
        source: input
        description: AVAILABLE blocks are the only windows an appointment may sit inside; BREAK and ADMIN blocks are exclusion windows.
        constraints: "AVAILABLE | BREAK | ADMIN"
      - name: start_at
        type: datetime
        source: input
        description: Inclusive block start (ISO 8601 UTC, three fractional digits).
      - name: end_at
        type: datetime
        source: input
        description: Inclusive block end; must be strictly after start_at.
      - name: note
        type: string
        source: input
        description: Optional scheduling note.
        default: "null"

  - name: Guest
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Guest name.
      - name: resort_room_number
        type: string
        source: input
        description: Resort room the folio posts against.
      - name: loyalty_tier
        type: enum
        source: input
        description: Loyalty tier driving the price-quote discount rate.
        default: NONE
        constraints: "NONE | SILVER | GOLD | PLATINUM"
      - name: folio_limit_cents
        type: integer
        source: input
        description: Maximum folio exposure allowed for this guest.
        constraints: ">= 0"
      - name: folio_balance_cents
        type: integer
        source: computed
        description: Exact sum of FolioCharge.amount_cents over every charge whose guest_id is this guest (postings are immutable, reversals are negative rows).
        default: 0
      - name: late_cancel_count
        type: integer
        source: computed
        description: Number of this guest's appointments that reached LATE_CANCELLED.
        default: 0
      - name: no_show_strikes
        type: integer
        source: computed
        description: Number of this guest's appointments that reached NO_SHOW.
        default: 0
      - name: booking_privilege
        type: enum
        source: system
        description: OPEN until late_cancel_count >= 2 or no_show_strikes >= 1, then RESTRICTED.
        default: OPEN
        constraints: "OPEN | RESTRICTED"
      - name: authoritative_intake_form_id
        type: string
        source: computed
        description: "Computed pointer to the id of this guest's authoritative IntakeForm — the row with guest_id = this guest and status IN {SCREENED_CLEAR, SCREENED_FLAGGED, OVERRIDDEN} having the greatest created_at (ties broken by greater version). Not a foreign key: the reverse-reachability channel for IntakeForm is GET /guests/{id}/intake-forms. Null when the guest has no screened form."
        default: "null"
      - name: screened_condition_codes
        type: array
        source: computed
        description: condition_codes copied from the authoritative IntakeForm at screening time; the input set for contraindication checks at booking.
        default: "[]"

  - name: IntakeForm
    parent: Guest
    common_fields: true
    fields:
      - name: guest_id
        type: string
        source: system
        description: "FK -> Guest.id; taken from the creation path."
      - name: condition_codes
        type: array
        source: input
        description: Health-questionnaire condition codes declared by the guest.
        default: "[]"
      - name: medications
        type: array
        source: input
        description: Declared medications; recorded but not screened.
        default: "[]"
      - name: status
        type: enum
        source: system
        description: Intake lifecycle state.
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | SCREENED_CLEAR | SCREENED_FLAGGED | OVERRIDDEN | SUPERSEDED"
      - name: flagged_condition_codes
        type: array
        source: computed
        description: >-
          Intersection of condition_codes with the fixed HIGH_RISK_CONDITION_CODES registry,
          written at screening. HIGH_RISK_CONDITION_CODES =
          ["ACUTE_HYPERTENSION", "PREGNANCY_FIRST_TRIMESTER", "DEEP_VEIN_THROMBOSIS",
          "RECENT_SURGERY_90D", "ACTIVE_INFECTION"] — a closed literal set, not configurable.
          Comparison is exact string equality; codes outside the registry are recorded but never flag.
        default: "[]"
      - name: consent_version
        type: string
        source: input
        description: Consent document version signed by the guest; null until the consent endpoint is called.
        default: "null"
      - name: consent_signed_at
        type: datetime
        source: system
        description: Logical-clock instant the consent was recorded; null until then.
        default: "null"
      - name: screened_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer that screened the form; the segregation-of-duties counterparty for override.
        default: "null"
      - name: screened_at
        type: datetime
        source: system
        description: Logical-clock instant of screening; null before screening.
        default: "null"
      - name: overridden_by_user_id
        type: string
        source: system
        description: X-User-ID of the SpaDirector that overrode the flag; null unless OVERRIDDEN.
        default: "null"
      - name: override_reason
        type: string
        source: system
        description: Reason text captured with the override; null unless OVERRIDDEN.
        default: "null"
      - name: amendment_round
        type: integer
        source: system
        description: >-
          Number of completed SCREENED_FLAGGED -> DRAFT amendment loops;
          hard-capped at MAX_AMENDMENT_ROUNDS = 2 (a third amendment attempt is refused).
        default: 0

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - name: guest_id
        type: string
        source: input
        description: "FK -> Guest.id; the guest receiving the treatment."
      - name: treatment_type_id
        type: string
        source: input
        description: "FK -> TreatmentType.id; the booked menu item."
      - name: room_id
        type: string
        source: input
        description: "FK -> TreatmentRoom.id; the room the treatment occupies."
      - name: therapist_id
        type: string
        source: input
        description: "FK -> Therapist.id; omitted on create to invoke therapist_assignment_selector, in which case the server writes the selected therapist. Never null after a successful create."
      - name: start_at
        type: datetime
        source: input
        description: Inclusive treatment start (ISO 8601 UTC, three fractional digits).
      - name: end_at
        type: datetime
        source: computed
        description: start_at + scheduled_duration_minutes.
      - name: scheduled_duration_minutes
        type: integer
        source: computed
        description: Snapshot of TreatmentType.duration_minutes taken at create.
      - name: actual_duration_minutes
        type: integer
        source: input
        description: Delivered minutes reported at completion; null before COMPLETED.
        default: "null"
        constraints: "1..480 integer"
      - name: high_demand_slot
        type: boolean
        source: computed
        description: True when TreatmentType.high_demand is true OR start_at falls in the peak window (16 <= UTC hour < 20); drives the late-cancel uplift.
      - name: quoted_price_cents
        type: integer
        source: computed
        description: Output of appointment_price_quote, frozen at create.
      - name: realized_price_cents
        type: integer
        source: computed
        description: Output of the FINAL variant of settlement_distribution; null until a FINAL SettlementRecord exists.
        default: "null"
      - name: gratuity_cents
        type: integer
        source: input
        description: Guest-added gratuity captured at completion.
        default: 0
        constraints: ">= 0"
      - name: schedule_status
        type: enum
        source: system
        description: Scheduling dimension of the parallel state machine.
        default: REQUESTED
        constraints: "REQUESTED | CONFIRMED | CHECKED_IN | IN_SERVICE | COMPLETED | CANCELLED | LATE_CANCELLED | NO_SHOW"
      - name: clearance_status
        type: enum
        source: system
        description: Clinical-clearance dimension of the parallel state machine; evolves independently of schedule_status.
        default: PENDING
        constraints: "PENDING | CLEARED | BLOCKED"
      - name: clearance_block_reason
        type: enum
        source: system
        description: Why clearance is BLOCKED; null whenever clearance_status is PENDING or CLEARED.
        default: "null"
        constraints: "null | INTAKE_FLAGGED | LICENSE_INVALID | THERAPIST_SUSPENDED | ROOM_UNAVAILABLE"
      - name: cancellation_charge_cents
        type: integer
        source: computed
        description: Output of cancellation_charge; 0 unless the appointment reached LATE_CANCELLED or NO_SHOW.
        default: 0
      - name: assignment_mode
        type: enum
        source: computed
        description: EXPLICIT when therapist_id was supplied on create, AUTO when therapist_assignment_selector picked it.
        constraints: "EXPLICIT | AUTO"

  - name: RetailAttachment
    parent: Appointment
    common_fields: true
    fields:
      - name: appointment_id
        type: string
        source: system
        description: "FK -> Appointment.id; taken from the creation path."
      - name: product_sku
        type: string
        source: input
        description: Recommended product SKU.
      - name: product_line
        type: string
        source: input
        description: Product line; must equal the appointment's TreatmentType.retail_product_line.
      - name: amount_cents
        type: integer
        source: input
        description: Retail price of the recommendation.
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: Recommendation lifecycle state.
        default: RECOMMENDED
        constraints: "RECOMMENDED | PURCHASED | DECLINED | EXPIRED"
      - name: resolved_by_user_id
        type: string
        source: system
        description: X-User-ID that purchased or declined the recommendation; null while RECOMMENDED or when EXPIRED by cascade.
        default: "null"
      - name: resolved_at
        type: datetime
        source: system
        description: Logical-clock instant of resolution; null while RECOMMENDED.
        default: "null"

  - name: SettlementRecord
    parent: Appointment
    common_fields: true
    fields:
      - name: appointment_id
        type: string
        source: system
        description: "FK -> Appointment.id; taken from the creation path or from the check-in cascade."
      - name: variant
        type: enum
        source: system
        description: Which variant of settlement_distribution produced this row.
        constraints: "PROVISIONAL | FINAL"
      - name: status
        type: enum
        source: system
        description: PROVISIONAL rows start PROVISIONAL and become SUPERSEDED (a FINAL row was cut) or REVERSED (the checked-in appointment was aborted); FINAL rows are FINALIZED.
        constraints: "PROVISIONAL | SUPERSEDED | FINALIZED | REVERSED"
      - name: basis_duration_minutes
        type: integer
        source: computed
        description: scheduled_duration_minutes for PROVISIONAL, actual_duration_minutes for FINAL.
      - name: realized_price_cents
        type: integer
        source: computed
        description: Treatment revenue recognised by this row.
      - name: retail_revenue_cents
        type: integer
        source: computed
        description: Sum of amount_cents over the appointment's PURCHASED RetailAttachment rows at evaluation time.
      - name: service_charge_bp
        type: integer
        source: computed
        description: Service-charge rate in basis points selected from the pre-charge tier basis.
      - name: service_charge_pool_cents
        type: integer
        source: computed
        description: Mandatory service charge collected on realized_price_cents.
      - name: gratuity_cents
        type: integer
        source: computed
        description: Snapshot of Appointment.gratuity_cents at evaluation time.
      - name: distributable_pool_cents
        type: integer
        source: computed
        description: service_charge_pool_cents + gratuity_cents; the quantity conserved by the three shares.
      - name: therapist_share_cents
        type: integer
        source: computed
        description: Therapist bucket of the distributable pool.
      - name: support_pool_cents
        type: integer
        source: computed
        description: Support-staff bucket of the distributable pool.
      - name: house_share_cents
        type: integer
        source: computed
        description: House bucket; absorbs the rounding residual so the three buckets sum exactly to distributable_pool_cents.
      - name: therapist_commission_cents
        type: integer
        source: computed
        description: Treatment commission earned by the therapist.
      - name: retail_commission_cents
        type: integer
        source: computed
        description: Retail commission, rounded per purchased attachment then summed.
      - name: labor_cost_cents
        type: integer
        source: computed
        description: Hourly labour + treatment commission + therapist share + retail commission.
      - name: room_fixed_cost_cents
        type: integer
        source: computed
        description: Room fixed cost charged against basis_duration_minutes.
      - name: folio_total_cents
        type: integer
        source: computed
        description: realized_price_cents + retail_revenue_cents + service_charge_pool_cents + gratuity_cents; the guest-facing total for the appointment.
      - name: net_margin_cents
        type: integer
        source: computed
        description: realized_price_cents + retail_revenue_cents - labor_cost_cents - room_fixed_cost_cents.

  - name: FolioCharge
    parent: Guest
    common_fields: false
    fields:
      - name: guest_id
        type: string
        source: system
        description: "FK -> Guest.id; the folio the amount posts to."
      - name: appointment_id
        type: string
        source: system
        description: "FK -> Appointment.id; the appointment the posting belongs to. Never null — every posting in this system originates from an appointment."
      - name: kind
        type: enum
        source: system
        description: Posting discriminator.
        constraints: "TREATMENT | RETAIL | SETTLEMENT_ADJUSTMENT | REVERSAL | LATE_CANCEL | NO_SHOW"
      - name: amount_cents
        type: integer
        source: system
        description: Signed posting amount; SETTLEMENT_ADJUSTMENT and REVERSAL rows may be negative.
      - name: memo
        type: string
        source: system
        description: Human-readable posting memo.
      - name: posted_at
        type: datetime
        source: system
        description: Logical-clock instant of the posting.

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# NEW is the pre-persistence pseudo-state used to document creation effects.
# ---------------------------------------------------------------------------
state_machines:

  - entity: Appointment
    state_field: schedule_status
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED, LATE_CANCELLED, NO_SHOW]
    note: |
      Dimension 1 of a parallel state machine. schedule_status and
      clearance_status advance independently on the same row: an appointment can
      sit at CONFIRMED x BLOCKED, CONFIRMED x CLEARED or CHECKED_IN x BLOCKED,
      and the pair decides which transitions are legal.
    transitions:
      - from: NEW
        to: REQUESTED
        trigger: "POST /appointments"
        actor: SpaCoordinator | Guest
        preconditions:
          - "every §1.4 rule whose applies_to covers POST /appointments passes"
          - "guest.booking_privilege == OPEN"
          - "start_at >= clock + MIN_LEAD_MINUTES, where MIN_LEAD_MINUTES = 120"
        side_effects:
          - "scheduled_duration_minutes := TreatmentType.duration_minutes (snapshot)"
          - "end_at := start_at + scheduled_duration_minutes"
          - "high_demand_slot := TreatmentType.high_demand OR (16 <= UTC hour of start_at < 20)"
          - "therapist_id := body value when supplied (assignment_mode EXPLICIT), else the winner of therapist_assignment_selector (assignment_mode AUTO)"
          - "quoted_price_cents := appointment_price_quote output"
          - "clearance_status := PENDING, clearance_block_reason := null"
          - "TreatmentRoom.booked_minutes_total += scheduled_duration_minutes + room.turnover_buffer_minutes; increments TreatmentRoom.version by 1"
          - "Therapist.assigned_minutes_total += scheduled_duration_minutes; increments Therapist.version by 1"

      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /appointments/{id}/confirm"
        actor: SpaCoordinator
        preconditions:
          - "schedule_status == REQUESTED"
          - "guest.authoritative_intake_form_id is not null and that form's status IN {SCREENED_CLEAR, OVERRIDDEN}"
          - "that form's consent_signed_at is not null and its consent_version == TreatmentType.required_consent_version"
          - "guest.screened_condition_codes INTERSECT TreatmentType.contraindication_codes == empty"
          - "the assigned therapist has a TherapistLicense with verification_status == VERIFIED, state_code == Therapist.practice_state_code and expires_on >= date(clock)"
          - "the assigned therapist has a CertificationGrant with skill_code == TreatmentType.required_skill_code, status == ACTIVE, expires_on >= date(clock) and scope rank >= TreatmentType.required_scope_level rank"
          - "Therapist.status == ACTIVE"
          - "TreatmentRoom.status == ACTIVE"
        side_effects:
          - "clearance_status := CLEARED on the clearance dimension (PENDING -> CLEARED), clearance_block_reason := null"

      - from: "REQUESTED | CONFIRMED"
        to: CANCELLED
        trigger: "POST /appointments/{id}/cancel"
        actor: SpaCoordinator | Guest
        preconditions:
          - "schedule_status IN {REQUESTED, CONFIRMED}"
          - "cancellation_charge selects the FREE band: (start_at - clock) >= FREE_CANCEL_HOURS hours"
        side_effects:
          - "cancellation_charge_cents := 0; no FolioCharge is posted"
          - "TreatmentRoom.booked_minutes_total -= scheduled_duration_minutes + room.turnover_buffer_minutes; increments TreatmentRoom.version by 1"
          - "Therapist.assigned_minutes_total -= scheduled_duration_minutes; increments Therapist.version by 1"
          - "clearance_status and clearance_block_reason freeze at their current values"

      - from: "REQUESTED | CONFIRMED"
        to: LATE_CANCELLED
        trigger: "POST /appointments/{id}/cancel"
        actor: SpaCoordinator | Guest
        preconditions:
          - "schedule_status IN {REQUESTED, CONFIRMED}"
          - "cancellation_charge selects a CHARGED band: (start_at - clock) < FREE_CANCEL_HOURS hours"
        side_effects:
          - "cancellation_charge_cents := cancellation_charge output (LATE_CANCEL band)"
          - "TreatmentRoom.booked_minutes_total -= scheduled_duration_minutes + room.turnover_buffer_minutes; Therapist.assigned_minutes_total -= scheduled_duration_minutes"
          - "CASCADE hop 1 -> hop 2: posts FolioCharge{kind: LATE_CANCEL, amount_cents: cancellation_charge_cents}; because that row exists, Guest.folio_balance_cents is recomputed as the exact sum of the guest's FolioCharge.amount_cents and Guest.late_cancel_count += 1; increments Guest.version by 1"
          - "CASCADE hop 2 -> hop 3: because late_cancel_count reached LATE_CANCEL_RESTRICTION_THRESHOLD, Guest.booking_privilege := RESTRICTED"
          - "CASCADE hop 3 -> hop 4: because the guest became RESTRICTED, every OTHER appointment of that guest with schedule_status == REQUESTED transitions REQUESTED -> CANCELLED (actor system, cancellation_charge_cents 0), processed in created_at ASC order"
          - "CASCADE hop 4 -> hop 5: because those appointments were cancelled, each one's TreatmentRoom.booked_minutes_total and Therapist.assigned_minutes_total are decremented by that appointment's committed minutes"

      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /appointments/{id}/no-show"
        actor: SpaCoordinator
        preconditions:
          - "schedule_status == CONFIRMED"
          - "clock >= start_at + NO_SHOW_GRACE_MINUTES"
        side_effects:
          - "cancellation_charge_cents := cancellation_charge output (NO_SHOW band)"
          - "TreatmentRoom.booked_minutes_total -= scheduled_duration_minutes + room.turnover_buffer_minutes; Therapist.assigned_minutes_total -= scheduled_duration_minutes"
          - "CASCADE hop 1 -> hop 2: posts FolioCharge{kind: NO_SHOW, amount_cents: cancellation_charge_cents}; because that row exists, Guest.folio_balance_cents is recomputed as the exact sum of the guest's FolioCharge.amount_cents and Guest.no_show_strikes += 1; increments Guest.version by 1"
          - "CASCADE hop 2 -> hop 3: because no_show_strikes reached NO_SHOW_RESTRICTION_THRESHOLD, Guest.booking_privilege := RESTRICTED"
          - "CASCADE hop 3 -> hop 4: because the guest became RESTRICTED, every OTHER appointment of that guest with schedule_status == REQUESTED transitions REQUESTED -> CANCELLED (actor system), processed in created_at ASC order"
          - "CASCADE hop 4 -> hop 5: because those appointments were cancelled, each one's TreatmentRoom.booked_minutes_total and Therapist.assigned_minutes_total are decremented by that appointment's committed minutes"

      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /appointments/{id}/check-in"
        actor: SpaCoordinator
        preconditions:
          - "schedule_status == CONFIRMED"
          - "clearance_status == CLEARED"
        side_effects:
          - "creates SettlementRecord{variant: PROVISIONAL, status: PROVISIONAL} from settlement_distribution variant PROVISIONAL"
          - "posts FolioCharge{kind: TREATMENT, amount_cents: that record's folio_total_cents}; Guest.folio_balance_cents recomputed as the exact sum of the guest's FolioCharge.amount_cents; increments Guest.version by 1"

      - from: CHECKED_IN
        to: IN_SERVICE
        trigger: "POST /appointments/{id}/start"
        actor: Therapist
        preconditions:
          - "schedule_status == CHECKED_IN"
          - "clearance_status == CLEARED"
          - "X-User-ID == Appointment.therapist_id"
          - "Therapist.status == ACTIVE"
        side_effects:
          - "no field beyond schedule_status, updated_at and version changes"

      - from: IN_SERVICE
        to: COMPLETED
        trigger: "POST /appointments/{id}/complete"
        actor: Therapist
        preconditions:
          - "schedule_status == IN_SERVICE"
          - "X-User-ID == Appointment.therapist_id"
          - "gratuity_cents <= round_half_up(quoted_price_cents * GRATUITY_CAP_BP / 10000)"
        side_effects:
          - "actual_duration_minutes := body value; gratuity_cents := body value (default 0)"
          - "no settlement is cut here; the FINAL SettlementRecord is created by POST /appointments/{id}/settlements"

      - from: CHECKED_IN
        to: CANCELLED
        trigger: "POST /appointments/{id}/cancel"
        actor: SpaCoordinator
        preconditions:
          - "schedule_status == CHECKED_IN"
          - "clearance_status == BLOCKED"
        note: "Pre-treatment abort: clearance was withdrawn after the guest checked in. Guest role is not permitted on this path."
        side_effects:
          - "the appointment's SettlementRecord with status PROVISIONAL becomes REVERSED"
          - "posts FolioCharge{kind: REVERSAL, amount_cents: -1 * that record's folio_total_cents}; Guest.folio_balance_cents recomputed as the exact sum of the guest's FolioCharge.amount_cents, returning it to its pre-check-in value"
          - "cancellation_charge_cents stays 0; Guest.late_cancel_count is NOT incremented"
          - "TreatmentRoom.booked_minutes_total -= scheduled_duration_minutes + room.turnover_buffer_minutes; Therapist.assigned_minutes_total -= scheduled_duration_minutes"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "system event: POST /compliance-sweeps auto-cancel step"
        actor: system
        preconditions:
          - "clearance_status == BLOCKED with clearance_block_reason == LICENSE_INVALID"
          - "start_at < sweep instant + SWEEP_AUTO_CANCEL_HORIZON_HOURS hours, where SWEEP_AUTO_CANCEL_HORIZON_HOURS = 48"
        side_effects:
          - "cancellation_charge_cents := 0; no FolioCharge is posted"
          - "TreatmentRoom.booked_minutes_total and Therapist.assigned_minutes_total decremented by the appointment's committed minutes"

      - from: REQUESTED
        to: CANCELLED
        trigger: "system event: guest-restriction cascade from LATE_CANCELLED or NO_SHOW"
        actor: system
        preconditions:
          - "Guest.booking_privilege flipped to RESTRICTED during the triggering request"
          - "schedule_status == REQUESTED"
        side_effects:
          - "cancellation_charge_cents := 0; no FolioCharge is posted"
          - "TreatmentRoom.booked_minutes_total and Therapist.assigned_minutes_total decremented by the appointment's committed minutes"

  - entity: Appointment
    state_field: clearance_status
    initial_state: PENDING
    terminal_states: []
    note: |
      Dimension 2 of the parallel state machine. Whenever a block or re-clear
      cascade re-evaluates an appointment it walks the clearance predicate in
      this fixed order and takes the FIRST failing clause as
      clearance_block_reason: (1) intake INTAKE_FLAGGED, (2) licence
      LICENSE_INVALID, (3) therapist THERAPIST_SUSPENDED, (4) room
      ROOM_UNAVAILABLE. All four clauses holding means CLEARED.
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /appointments/{id}/confirm"
        actor: SpaCoordinator
        preconditions:
          - "the four clearance clauses in the note above all hold"
        side_effects:
          - "clearance_block_reason := null"

      - from: "PENDING | CLEARED"
        to: BLOCKED
        trigger: "system event: POST /intake-forms/{id}/screen (flagged), POST /therapists/{id}/suspend, PATCH /treatment-rooms/{id} (non-ACTIVE), or POST /compliance-sweeps (licence expiry)"
        actor: system
        preconditions:
          - "schedule_status IN {REQUESTED, CONFIRMED, CHECKED_IN}"
          - "at least one clearance clause now fails"
        side_effects:
          - "clearance_block_reason := the first failing clause in the fixed order"
          - "every RetailAttachment on this appointment with status RECOMMENDED becomes EXPIRED"

      - from: BLOCKED
        to: CLEARED
        trigger: "system event: POST /intake-forms/{id}/override, POST /therapists/{id}/reinstate, or PATCH /treatment-rooms/{id} back to ACTIVE"
        actor: system
        preconditions:
          - "schedule_status IN {REQUESTED, CONFIRMED, CHECKED_IN}"
          - "all four clearance clauses hold again after the resolving action"
        side_effects:
          - "clearance_block_reason := null"
          - "RetailAttachment rows already EXPIRED are NOT revived"
        note: "When only some clauses are repaired the row stays BLOCKED and clearance_block_reason is rewritten to the new first failing clause."

  - entity: TherapistLicense
    state_field: verification_status
    initial_state: PENDING_REVIEW
    terminal_states: []
    note: |
      Cyclic machine. PENDING_REVIEW -> REJECTED -> PENDING_REVIEW is the
      revision loop, and VERIFIED -> EXPIRED -> PENDING_REVIEW -> VERIFIED is
      the renewal loop. No state is terminal.
    transitions:
      - from: NEW
        to: PENDING_REVIEW
        trigger: "POST /therapists/{id}/licenses"
        actor: ComplianceOfficer
        preconditions:
          - "state_code == Therapist.practice_state_code"
          - "expires_on > issued_on and current_period_start_on <= expires_on"
        side_effects:
          - "submitted_by_user_id := X-User-ID of the caller"
          - "credited_ce_hours := 0"

      - from: PENDING_REVIEW
        to: VERIFIED
        trigger: "POST /therapist-licenses/{id}/review with decision VERIFIED"
        actor: ComplianceOfficer
        preconditions:
          - "verification_status == PENDING_REVIEW"
          - "X-User-ID != submitted_by_user_id (segregation of duties)"
          - "expires_on >= date(clock)"
          - "ce_compliance_evaluation variant CALENDAR_WINDOW reports shortfall_hours == 0"
          - "when ce_hours_required > 0: ethics_hours_credited >= CE_ETHICS_MIN_HOURS"
        side_effects:
          - "verified_at := clock; reviewed_by_user_id := X-User-ID; review_note := body value or null"
          - "credited_ce_hours := credited_hours from the CALENDAR_WINDOW evaluation"

      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /therapist-licenses/{id}/review with decision REJECTED"
        actor: ComplianceOfficer
        preconditions:
          - "verification_status == PENDING_REVIEW"
          - "X-User-ID != submitted_by_user_id (segregation of duties)"
        side_effects:
          - "reviewed_by_user_id := X-User-ID; review_note := body value or null"
          - "verified_at stays null; credited_ce_hours unchanged"

      - from: "REJECTED | EXPIRED"
        to: PENDING_REVIEW
        trigger: "POST /therapist-licenses/{id}/resubmit"
        actor: ComplianceOfficer
        preconditions:
          - "verification_status IN {REJECTED, EXPIRED}"
        side_effects:
          - "submitted_by_user_id := X-User-ID of the resubmitter (which re-arms the segregation-of-duties check for the next review)"
          - "license_number, expires_on and current_period_start_on replaced when supplied"
          - "reviewed_by_user_id := null; review_note := null; verified_at := null"

      - from: VERIFIED
        to: EXPIRED
        trigger: "system event: POST /compliance-sweeps"
        actor: system
        preconditions:
          - "verification_status == VERIFIED"
          - "expires_on < date(sweep instant)"
        side_effects:
          - "CASCADE hop 1 -> hop 2: because this licence expired and the therapist now holds no VERIFIED unexpired licence, Therapist.status ACTIVE -> SUSPENDED with suspension_reason LICENSE_EXPIRED"
          - "CASCADE hop 2 -> hop 3: because the therapist became SUSPENDED, every appointment of that therapist with schedule_status IN {REQUESTED, CONFIRMED, CHECKED_IN} gets clearance_status := BLOCKED with clearance_block_reason := LICENSE_INVALID, processed in start_at ASC then created_at ASC order"
          - "CASCADE hop 3 -> hop 4: because those appointments became BLOCKED, every RetailAttachment on them with status RECOMMENDED becomes EXPIRED"
          - "CASCADE hop 3 -> hop 5: because those appointments became BLOCKED, each one with schedule_status == CONFIRMED and start_at < sweep instant + SWEEP_AUTO_CANCEL_HORIZON_HOURS transitions CONFIRMED -> CANCELLED (actor system), and each such cancellation decrements that appointment's TreatmentRoom.booked_minutes_total and Therapist.assigned_minutes_total"

  - entity: Therapist
    state_field: status
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    note: "Cyclic between ACTIVE and SUSPENDED; INACTIVE is the only terminal state."
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /therapists/{id}/suspend with permanent false"
        actor: SpaDirector
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "suspension_reason := DIRECTOR_ACTION"
          - "every appointment of this therapist with schedule_status IN {REQUESTED, CONFIRMED, CHECKED_IN} gets clearance_status := BLOCKED with clearance_block_reason := THERAPIST_SUSPENDED; each such block expires that appointment's RECOMMENDED RetailAttachment rows"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "system event: POST /compliance-sweeps licence-expiry step"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "the therapist's last VERIFIED licence just transitioned to EXPIRED and no other VERIFIED unexpired licence remains"
        side_effects:
          - "suspension_reason := LICENSE_EXPIRED"
          - "continues the sweep cascade documented on TherapistLicense VERIFIED -> EXPIRED (hops 3, 4 and 5)"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /therapists/{id}/reinstate"
        actor: SpaDirector
        preconditions:
          - "status == SUSPENDED"
          - "the therapist has at least one TherapistLicense with verification_status == VERIFIED and expires_on >= date(clock)"
        side_effects:
          - "suspension_reason := null"
          - "every appointment of this therapist with schedule_status IN {REQUESTED, CONFIRMED, CHECKED_IN} and clearance_status == BLOCKED is re-evaluated against the clearance predicate and becomes CLEARED when all four clauses hold"

      - from: "ACTIVE | SUSPENDED"
        to: INACTIVE
        trigger: "POST /therapists/{id}/suspend with permanent true"
        actor: SpaDirector
        preconditions:
          - "status IN {ACTIVE, SUSPENDED}"
        side_effects:
          - "suspension_reason := DIRECTOR_ACTION"
          - "same clearance-block cascade as the ACTIVE -> SUSPENDED transition"
          - "no transition out of INACTIVE exists"

  - entity: IntakeForm
    state_field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    note: "Cyclic: SCREENED_FLAGGED -> DRAFT -> SUBMITTED -> SCREENED_* is the amendment loop, bounded by MAX_AMENDMENT_ROUNDS."
    transitions:
      - from: NEW
        to: DRAFT
        trigger: "POST /guests/{id}/intake-forms"
        actor: Guest | SpaCoordinator
        preconditions:
          - "expected_guest_version == Guest.version (see §1.2.1)"
        side_effects:
          - "increments Guest.version by 1"

      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /intake-forms/{id}/submit"
        actor: Guest | SpaCoordinator
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "no other field changes; consent may be recorded before or after this transition"

      - from: SUBMITTED
        to: SCREENED_CLEAR
        trigger: "POST /intake-forms/{id}/screen"
        actor: ComplianceOfficer
        preconditions:
          - "status == SUBMITTED"
          - "condition_codes INTERSECT HIGH_RISK_CONDITION_CODES == empty"
        side_effects:
          - "screened_by_user_id := X-User-ID; screened_at := clock; flagged_condition_codes := []"
          - "Guest.authoritative_intake_form_id := this form's id; Guest.screened_condition_codes := condition_codes; increments Guest.version by 1"
          - "the guest's previous authoritative form, when any, transitions to SUPERSEDED"
          - "every appointment of this guest with schedule_status IN {REQUESTED, CONFIRMED, CHECKED_IN} and clearance_status == BLOCKED is re-evaluated and becomes CLEARED when all four clearance clauses hold"

      - from: SUBMITTED
        to: SCREENED_FLAGGED
        trigger: "POST /intake-forms/{id}/screen"
        actor: ComplianceOfficer
        preconditions:
          - "status == SUBMITTED"
          - "condition_codes INTERSECT HIGH_RISK_CONDITION_CODES != empty"
        side_effects:
          - "screened_by_user_id := X-User-ID; screened_at := clock; flagged_condition_codes := that intersection"
          - "Guest.authoritative_intake_form_id := this form's id; Guest.screened_condition_codes := condition_codes; the previous authoritative form transitions to SUPERSEDED; increments Guest.version by 1"
          - "CASCADE hop 1 -> hop 2: because this guest's authoritative form is now flagged, every appointment of the guest with schedule_status IN {REQUESTED, CONFIRMED, CHECKED_IN} gets clearance_status := BLOCKED with clearance_block_reason := INTAKE_FLAGGED, processed in start_at ASC then created_at ASC order"
          - "CASCADE hop 2 -> hop 3: because those appointments became BLOCKED, every RetailAttachment on them with status RECOMMENDED becomes EXPIRED"

      - from: SCREENED_FLAGGED
        to: OVERRIDDEN
        trigger: "POST /intake-forms/{id}/override"
        actor: SpaDirector
        preconditions:
          - "status == SCREENED_FLAGGED"
          - "X-User-ID != screened_by_user_id (segregation of duties)"
        side_effects:
          - "overridden_by_user_id := X-User-ID; override_reason := body value"
          - "every appointment of this guest with schedule_status IN {REQUESTED, CONFIRMED, CHECKED_IN} and clearance_status == BLOCKED is re-evaluated and becomes CLEARED when all four clearance clauses hold; already EXPIRED RetailAttachment rows are not revived"

      - from: SCREENED_FLAGGED
        to: DRAFT
        trigger: "POST /intake-forms/{id}/amend"
        actor: Guest | SpaCoordinator
        preconditions:
          - "status == SCREENED_FLAGGED"
          - "amendment_round < MAX_AMENDMENT_ROUNDS"
        side_effects:
          - "amendment_round += 1; condition_codes and medications replaced by the body values; flagged_condition_codes := []; screened_by_user_id := null; screened_at := null"
          - "Guest.authoritative_intake_form_id is recomputed and becomes null when no other screened form exists; Guest.screened_condition_codes follows it; increments Guest.version by 1"
          - "appointments already BLOCKED with reason INTAKE_FLAGGED stay BLOCKED (there is no clear authoritative form to clear them)"

      - from: "SCREENED_CLEAR | SCREENED_FLAGGED | OVERRIDDEN"
        to: SUPERSEDED
        trigger: "system event: a newer IntakeForm for the same guest reaches SCREENED_CLEAR or SCREENED_FLAGGED"
        actor: system
        preconditions:
          - "this form is the guest's current authoritative form"
        side_effects:
          - "no further transition out of SUPERSEDED exists"

  - entity: RetailAttachment
    state_field: status
    initial_state: RECOMMENDED
    terminal_states: [PURCHASED, DECLINED, EXPIRED]
    note: "Branching machine: one RECOMMENDED state forks into three terminal outcomes with different side-effect sets."
    transitions:
      - from: NEW
        to: RECOMMENDED
        trigger: "POST /appointments/{id}/retail-attachments"
        actor: Therapist
        preconditions:
          - "X-User-ID == Appointment.therapist_id"
          - "Appointment.schedule_status IN {CONFIRMED, CHECKED_IN, IN_SERVICE, COMPLETED}"
          - "product_line == the appointment's TreatmentType.retail_product_line"
        side_effects:
          - "no folio posting yet"

      - from: RECOMMENDED
        to: PURCHASED
        trigger: "POST /retail-attachments/{id}/resolve with outcome PURCHASED"
        actor: Guest | SpaCoordinator
        preconditions:
          - "status == RECOMMENDED"
          - "Appointment.schedule_status IN {CONFIRMED, CHECKED_IN, IN_SERVICE, COMPLETED}"
          - "Guest.folio_balance_cents + amount_cents <= Guest.folio_limit_cents"
        side_effects:
          - "resolved_by_user_id := X-User-ID; resolved_at := clock"
          - "posts FolioCharge{kind: RETAIL, amount_cents: amount_cents}; Guest.folio_balance_cents recomputed as the exact sum of the guest's FolioCharge.amount_cents; increments Guest.version by 1"

      - from: RECOMMENDED
        to: DECLINED
        trigger: "POST /retail-attachments/{id}/resolve with outcome DECLINED"
        actor: Guest | SpaCoordinator
        preconditions:
          - "status == RECOMMENDED"
        side_effects:
          - "resolved_by_user_id := X-User-ID; resolved_at := clock; no folio posting"

      - from: RECOMMENDED
        to: EXPIRED
        trigger: "system event: the parent appointment's clearance_status became BLOCKED"
        actor: system
        preconditions:
          - "status == RECOMMENDED"
        side_effects:
          - "resolved_by_user_id and resolved_at stay null; no folio posting"

  - entity: SettlementRecord
    state_field: status
    initial_state: PROVISIONAL
    terminal_states: [SUPERSEDED, FINALIZED, REVERSED]
    transitions:
      - from: NEW
        to: PROVISIONAL
        trigger: "system event: POST /appointments/{id}/check-in"
        actor: system
        preconditions:
          - "the appointment has no SettlementRecord yet"
        side_effects:
          - "every computed money field is filled from settlement_distribution variant PROVISIONAL"

      - from: NEW
        to: FINALIZED
        trigger: "POST /appointments/{id}/settlements"
        actor: SpaDirector
        preconditions:
          - "Appointment.schedule_status == COMPLETED"
          - "no SettlementRecord with variant FINAL exists for the appointment"
          - "expected_appointment_version == Appointment.version (see §1.2.1)"
        side_effects:
          - "every computed money field is filled from settlement_distribution variant FINAL"
          - "Appointment.realized_price_cents := this row's realized_price_cents; increments Appointment.version by 1"
          - "the appointment's PROVISIONAL row transitions PROVISIONAL -> SUPERSEDED"
          - "posts FolioCharge{kind: SETTLEMENT_ADJUSTMENT, amount_cents: folio_total_cents - sum of the appointment's existing FolioCharge.amount_cents}; Guest.folio_balance_cents recomputed as the exact sum of the guest's FolioCharge.amount_cents; increments Guest.version by 1"

      - from: PROVISIONAL
        to: SUPERSEDED
        trigger: "system event: a FINAL SettlementRecord was created for the same appointment"
        actor: system
        preconditions:
          - "status == PROVISIONAL"
        side_effects:
          - "computed money fields freeze at their PROVISIONAL values"

      - from: PROVISIONAL
        to: REVERSED
        trigger: "system event: POST /appointments/{id}/cancel from CHECKED_IN with clearance BLOCKED"
        actor: system
        preconditions:
          - "status == PROVISIONAL"
        side_effects:
          - "computed money fields freeze; the compensating FolioCharge REVERSAL row carries -1 * folio_total_cents"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules — OCC on the parent entity's version only
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: intake-form-create-stale-guest
    parent_entity: Guest
    write_endpoint: "POST /guests/{id}/intake-forms"
    occ_field: "expected_guest_version"
    description: |
      Creating an IntakeForm for a Guest whose version has advanced since the
      client last read it is rejected. A newly screened form legitimately
      supersedes the guest's previous authoritative form and rewrites
      Guest.authoritative_intake_form_id and Guest.screened_condition_codes, so a
      writer holding a stale view of the guest would silently discard a
      screening decision it never saw.
    error_id: ERR_STALE_GUEST_VERSION
    http_status: 412

  - rule_id: settlement-create-stale-appointment
    parent_entity: Appointment
    write_endpoint: "POST /appointments/{id}/settlements"
    occ_field: "expected_appointment_version"
    description: |
      Cutting a FINAL SettlementRecord against an Appointment whose version has
      advanced since the client last read it is rejected. The FINAL settlement
      supersedes the PROVISIONAL row and writes
      Appointment.realized_price_cents, so a stale writer would distribute a
      pool computed from duration, gratuity or retail figures that have since
      changed.
    error_id: ERR_STALE_APPOINTMENT_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# All money is integer cents. round_half_up(x) means Decimal quantisation to
# zero decimal places with ROUND_HALF_UP unless a places argument is given.
# No calculation, selector, ordering or tie-break in this scaffold reads any
# entity's `id`; `created_at` ASC is the only common-field fallback used.
# ---------------------------------------------------------------------------
calculations:

  - name: appointment_price_quote
    trigger: "on POST /appointments, writing Appointment.quoted_price_cents (declared in that transition's side_effects)"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is fixed; each step consumes only the steps above it.
      room_adjusted_cents = round_half_up(
          treatment_type.base_price_cents * ROOM_CLASS_MULTIPLIER_BP[room.room_class] / 10000)
      peak_bp   = PEAK_SURCHARGE_BP if (16 <= utc_hour(start_at) < 20) else 0
      demand_bp = HIGH_DEMAND_SURCHARGE_BP if treatment_type.high_demand else 0
      surcharge_bp = min(peak_bp + demand_bp, SURCHARGE_CAP_BP)          # nested cap
      surcharge_cents = round_half_up(room_adjusted_cents * surcharge_bp / 10000)
      subtotal_cents  = room_adjusted_cents + surcharge_cents
      raw_discount_cents = round_half_up(
          subtotal_cents * LOYALTY_DISCOUNT_BP[guest.loyalty_tier] / 10000)
      discount_cents  = min(raw_discount_cents, MAX_DISCOUNT_CENTS)      # nested cap
      price_floor_cents = round_half_up(
          treatment_type.base_price_cents * PRICE_FLOOR_BP / 10000)
      quoted_price_cents = max(subtotal_cents - discount_cents, price_floor_cents)
    input_set: |
      Exactly one TreatmentType (the booked one), one TreatmentRoom (the booked
      one, whose room_class is read even though the class must already match
      TreatmentType.room_class_required) and one Guest (loyalty_tier only). No
      other appointment participates. utc_hour(start_at) is the UTC hour of the
      submitted start_at, never a local-time conversion.
    constants:
      ROOM_CLASS_MULTIPLIER_BP: { DRY: 10000, WET: 11500, HYDRO: 13000, COUPLES: 12500 }
      PEAK_SURCHARGE_BP: 1500
      HIGH_DEMAND_SURCHARGE_BP: 1000
      SURCHARGE_CAP_BP: 2000
      LOYALTY_DISCOUNT_BP: { NONE: 0, SILVER: 500, GOLD: 1000, PLATINUM: 1500 }
      MAX_DISCOUNT_CENTS: 4000
      PRICE_FLOOR_BP: 8000
    precision: "integer cents, round_half_up at every named rounding step; no intermediate value is carried at sub-cent precision"

  - name: therapist_assignment_selector
    trigger: "on POST /appointments when therapist_id is omitted from the body; writes Appointment.therapist_id and assignment_mode := AUTO"
    algorithm: weighted_scoring
    formula: |
      # (a) eligibility filter — every clause must hold
      candidates = Therapist rows where
          status == ACTIVE
        AND exists TherapistLicense L with L.therapist_id == therapist.id
              AND L.verification_status == VERIFIED
              AND L.state_code == therapist.practice_state_code
              AND L.expires_on >= date(clock)          # current validity, NOT validity at start_at
        AND exists CertificationGrant C with C.therapist_id == therapist.id
              AND C.skill_code == treatment_type.required_skill_code
              AND C.status == ACTIVE
              AND C.expires_on >= date(clock)          # current validity, NOT validity at start_at
              AND SCOPE_RANK[C.scope_level] >= SCOPE_RANK[treatment_type.required_scope_level]
        AND exists ShiftBlock S with S.therapist_id == therapist.id
              AND S.block_type == AVAILABLE
              AND S.start_at <= start_at AND S.end_at >= end_at        # closed containment
        AND no ShiftBlock B with B.therapist_id == therapist.id
              AND B.block_type IN {BREAK, ADMIN}
              AND B.start_at <= end_at AND B.end_at >= start_at        # closed intersection
        AND no Appointment A with A.therapist_id == therapist.id
              AND A.schedule_status IN {REQUESTED, CONFIRMED, CHECKED_IN, IN_SERVICE}
              AND A.start_at <= end_at AND A.end_at >= start_at        # closed intersection
      # (b) ranking expression, applied in this order
      #   1. assigned_minutes_on_date ASC
      #      = sum of scheduled_duration_minutes over that therapist's appointments
      #        whose schedule_status IN {REQUESTED, CONFIRMED, CHECKED_IN, IN_SERVICE, COMPLETED}
      #        and whose start_at falls on the same UTC calendar date as start_at
      #   2. SCOPE_RANK of the matching CertificationGrant DESC
      #   3. base_hourly_cost_cents ASC
      # (c) tie-break
      #   4. Therapist.created_at ASC
      # (d) empty candidate set
      #   -> reject the request with ERR_NO_ELIGIBLE_THERAPIST (409)
    input_set: "Every Therapist row is a candidate before the filter; no row is excluded by anything other than the clauses above."
    constants:
      SCOPE_RANK: { BASIC: 1, ADVANCED: 2 }
    precision: "integer minutes; no rounding"

  - name: settlement_distribution
    trigger: "PROVISIONAL variant on POST /appointments/{id}/check-in (side effect: creates the PROVISIONAL SettlementRecord); FINAL variant on POST /appointments/{id}/settlements (side effect: creates the FINAL SettlementRecord and writes Appointment.realized_price_cents)"
    algorithm: waterfall_allocation
    formula: |
      # ---- step 1: basis and realized revenue (variant-dependent)
      # PROVISIONAL: basis_duration_minutes = appointment.scheduled_duration_minutes
      #              realized_price_cents   = appointment.quoted_price_cents
      # FINAL:       basis_duration_minutes = appointment.actual_duration_minutes
      #   overtime_blocks = ceil(max(0, actual - scheduled - OVERTIME_GRACE_MINUTES) / 15)
      #   overtime_cents  = overtime_blocks * OVERTIME_BLOCK_CENTS
      #   shortfall_cents = 0 if actual >= scheduled - SHORTFALL_GRACE_MINUTES
      #                     else round_half_up(quoted_price_cents * (scheduled - actual) / scheduled)
      #   realized_price_cents = quoted_price_cents + overtime_cents - shortfall_cents
      # ---- step 2: retail revenue
      retail_revenue_cents = sum(amount_cents) over this appointment's
          RetailAttachment rows with status == PURCHASED   # PROVISIONAL and FINAL use the same filter
      # ---- step 3: service-charge rate — EVALUATION ORDER PIN
      # The waiver tier is keyed on the PRE-CHARGE basis, never on folio_total_cents
      # (which itself contains the service charge and would make the rule circular).
      tier_basis_cents = realized_price_cents + retail_revenue_cents
      service_charge_bp = (SERVICE_CHARGE_REDUCED_BP
                           if tier_basis_cents >= SERVICE_CHARGE_TIER_THRESHOLD_CENTS
                           else SERVICE_CHARGE_STANDARD_BP)
      service_charge_pool_cents = round_half_up(realized_price_cents * service_charge_bp / 10000)
      # ---- step 4: distributable pool and its three buckets
      gratuity_cents = appointment.gratuity_cents
      distributable_pool_cents = service_charge_pool_cents + gratuity_cents
      # ROUNDING ORDER PIN: round each bucket in the declared order, then give the
      # residual to the house. Do NOT compute house_share as
      # round_half_up(pool * HOUSE_SHARE_BP / 10000).
      therapist_share_cents = round_half_up(distributable_pool_cents * THERAPIST_SHARE_BP / 10000)
      support_pool_cents    = round_half_up(distributable_pool_cents * SUPPORT_SHARE_BP / 10000)
      house_share_cents     = distributable_pool_cents - therapist_share_cents - support_pool_cents
      # ---- step 5: commissions
      therapist_commission_cents = round_half_up(
          realized_price_cents * COMMISSION_BP[therapist.commission_tier] / 10000)
      # ROUNDING ORDER PIN: round per purchased attachment, then sum. Do NOT
      # round once over the summed retail revenue.
      retail_commission_cents = sum(
          round_half_up(a.amount_cents * RETAIL_COMMISSION_BP / 10000)
          for a in this appointment's RetailAttachment rows with status == PURCHASED)
      # ---- step 6: costs, folio total, margin
      labor_cost_cents = round_half_up(therapist.base_hourly_cost_cents * basis_duration_minutes / 60)
                         + therapist_commission_cents + therapist_share_cents + retail_commission_cents
      room_fixed_cost_cents = round_half_up(room.hourly_fixed_cost_cents * basis_duration_minutes / 60)
      folio_total_cents = realized_price_cents + retail_revenue_cents
                          + service_charge_pool_cents + gratuity_cents
      net_margin_cents  = realized_price_cents + retail_revenue_cents
                          - labor_cost_cents - room_fixed_cost_cents
    input_set: |
      One Appointment, its Guest, Therapist, TreatmentRoom and TreatmentType, plus
      that appointment's RetailAttachment rows with status == PURCHASED (RECOMMENDED,
      DECLINED and EXPIRED rows are excluded from both variants). No other
      appointment's rows participate.
    constants:
      OVERTIME_GRACE_MINUTES: 5
      SHORTFALL_GRACE_MINUTES: 5
      OVERTIME_BLOCK_CENTS: 2500
      SERVICE_CHARGE_STANDARD_BP: 1800
      SERVICE_CHARGE_REDUCED_BP: 1500
      SERVICE_CHARGE_TIER_THRESHOLD_CENTS: 50000
      THERAPIST_SHARE_BP: 6000
      SUPPORT_SHARE_BP: 2500
      HOUSE_SHARE_BP: 1500
      COMMISSION_BP: { JUNIOR: 3000, SENIOR: 3800, MASTER: 4500 }
      RETAIL_COMMISSION_BP: 1200
      GRATUITY_CAP_BP: 5000
    precision: "integer cents; round_half_up per named step in the declared order"
    variants:
      - name: PROVISIONAL
        when: "cut automatically at check-in, before any service is delivered"
        difference: "basis_duration_minutes is the scheduled duration and realized_price_cents is exactly quoted_price_cents — no overtime block, no shortfall credit, and gratuity_cents is still 0 because it is only captured at completion"
      - name: FINAL
        when: "cut by POST /appointments/{id}/settlements after the appointment reached COMPLETED"
        difference: "basis_duration_minutes is the delivered duration and realized_price_cents adds overtime blocks / subtracts a shortfall credit, so the pool, all three buckets, both commissions, labour, room cost, folio total and margin all differ from the PROVISIONAL row for the same appointment"

  - name: cancellation_charge
    trigger: "on POST /appointments/{id}/cancel (LATE_CANCELLED band) and on POST /appointments/{id}/no-show; writes Appointment.cancellation_charge_cents and the FolioCharge amount posted by those transitions"
    algorithm: threshold
    formula: |
      hours_before = (appointment.start_at - clock) / 3600 seconds   # exact, may be negative
      if trigger is no-show:
          band_bp = NO_SHOW_BP
      elif hours_before >= FREE_CANCEL_HOURS:            # note >=, not >
          return 0 and the CANCELLED band
      elif hours_before >= SHORT_NOTICE_HOURS:           # note >=, not >
          band_bp = LATE_CANCEL_BP
      else:
          band_bp = SHORT_NOTICE_BP
      if appointment.high_demand_slot:
          band_bp = band_bp + HIGH_DEMAND_UPLIFT_BP
      band_bp = min(band_bp, CHARGE_CAP_BP)              # nested cap
      cancellation_charge_cents = round_half_up(appointment.quoted_price_cents * band_bp / 10000)
    input_set: "One Appointment and the logical clock at the instant of the request. quoted_price_cents is the frozen create-time quote, never a re-quote at cancel time."
    constants:
      FREE_CANCEL_HOURS: 24
      SHORT_NOTICE_HOURS: 4
      LATE_CANCEL_BP: 5000
      SHORT_NOTICE_BP: 10000
      NO_SHOW_BP: 10000
      HIGH_DEMAND_UPLIFT_BP: 2000
      CHARGE_CAP_BP: 10000
      NO_SHOW_GRACE_MINUTES: 15
      LATE_CANCEL_RESTRICTION_THRESHOLD: 2
      NO_SHOW_RESTRICTION_THRESHOLD: 1
    precision: "integer cents, round_half_up once at the end"

  - name: ce_compliance_evaluation
    trigger: "on GET /therapist-licenses/{id}/ce-compliance (inline read) and as the gate inside POST /therapist-licenses/{id}/review with decision VERIFIED (which uses the CALENDAR_WINDOW variant and writes TherapistLicense.credited_ce_hours)"
    algorithm: aggregation
    formula: |
      # window_lower / window_upper are variant-dependent (see variants below)
      in_window = [r for r in this licence's ContinuingEducationRecord rows
                   if window_contains(r.completed_on)]
      # per-category credit cap, applied category by category
      for category in [ETHICS, CLINICAL, SAFETY]:
          raw[category]      = sum(r.ce_hours for r in in_window if r.category == category)
          credited[category] = min(raw[category], CE_PER_CATEGORY_CAP_HOURS)
      credited_hours      = credited[ETHICS] + credited[CLINICAL] + credited[SAFETY]
      ethics_hours_credited = credited[ETHICS]
      shortfall_hours     = max(0, license.ce_hours_required - credited_hours)
      ethics_requirement_met = (ethics_hours_credited >= CE_ETHICS_MIN_HOURS)
                               if license.ce_hours_required > 0 else true
      compliant = (shortfall_hours == 0) and ethics_requirement_met
    input_set: |
      Only ContinuingEducationRecord rows whose license_id is this licence. Records
      belonging to any other licence of the same therapist are excluded, and a
      record whose completed_on falls outside the variant's window contributes 0
      to every total including its category's raw sum.
    constants:
      CE_PER_CATEGORY_CAP_HOURS: 8
      CE_ETHICS_MIN_HOURS: 2
      ROLLING_WINDOW_MONTHS: 24
    precision: "hours carried as a decimal with one place, round_half_up(x, 1); hour totals are never converted to integers"
    variants:
      - name: CALENDAR_WINDOW
        when: "the default variant; always the one used by POST /therapist-licenses/{id}/review"
        difference: "window_contains(d) is license.current_period_start_on <= d <= license.expires_on — BOTH bounds inclusive, taken from the licence row, ignoring as_of entirely"
      - name: ROLLING_24M
        when: "requested explicitly via GET /therapist-licenses/{id}/ce-compliance?variant=ROLLING_24M"
        difference: "window_contains(d) is (as_of_date - ROLLING_WINDOW_MONTHS months) < d <= as_of_date — lower bound EXCLUSIVE and derived from as_of (default: the logical clock's UTC date), so the same records can credit fewer hours, drop a whole category below CE_ETHICS_MIN_HOURS and flip compliant to false"

  - name: room_utilization_and_margin
    trigger: "on GET /reports/room-utilization"
    algorithm: interval_merge
    formula: |
      window_minutes = (to_at - from_at) / 60 seconds        # to_at is EXCLUSIVE
      for each TreatmentRoom (or only room_id when the filter is supplied):
        rows = that room's Appointment rows with
                 schedule_status == COMPLETED
             AND from_at <= start_at < to_at                 # half-open on start_at
        occupied_minutes = sum(a.actual_duration_minutes + room.turnover_buffer_minutes
                               for a in rows)
        # occupancy intervals of COMPLETED appointments in one room never overlap,
        # so the merge of the intervals equals the sum of their lengths.
        utilization_pct = round_half_up(occupied_minutes * 100 / window_minutes, 2)
        settlements = FINALIZED SettlementRecord rows of those appointments
        revenue_cents = sum(s.realized_price_cents + s.retail_revenue_cents for s in settlements)
        labor_cost_cents = sum(s.labor_cost_cents for s in settlements)
        room_fixed_cost_cents = round_half_up(room.hourly_fixed_cost_cents * occupied_minutes / 60)
        net_margin_cents = revenue_cents - labor_cost_cents - room_fixed_cost_cents
        revenue_per_room_hour_cents = round_half_up(revenue_cents * 60 / window_minutes)
      # an empty rows set yields occupied_minutes 0, utilization_pct 0.00,
      # every money field 0 — the room still appears in the report
    input_set: |
      COMPLETED appointments only: REQUESTED, CONFIRMED, CHECKED_IN, IN_SERVICE,
      CANCELLED, LATE_CANCELLED and NO_SHOW rows are all excluded, and so are
      PROVISIONAL, SUPERSEDED and REVERSED settlement rows. Selection is on
      start_at, so an appointment that starts inside the window and ends after
      to_at contributes its full occupied minutes.
    constants:
      MAX_REPORT_WINDOW_DAYS: 92
    precision: "utilization_pct is a decimal with exactly 2 places (round_half_up); every money field is integer cents"

  - name: retail_attachment_rate
    trigger: "on GET /reports/retail-attachment"
    algorithm: aggregation
    formula: |
      eligible = Appointment rows with
                   schedule_status == COMPLETED
               AND from_at <= start_at < to_at                # half-open on start_at
               AND (therapist_id == therapist_id filter, when supplied)
      eligible_appointment_count = count(eligible)
      purchased = RetailAttachment rows on those appointments with status == PURCHASED
      purchased_count  = count(purchased)
      purchased_amount_cents = sum(p.amount_cents for p in purchased)
      commission_cents = sum(round_half_up(p.amount_cents * RETAIL_COMMISSION_BP / 10000)
                             for p in purchased)     # per line, then summed
      attach_rate_pct = (0.00 if eligible_appointment_count == 0
                         else round_half_up(purchased_count * 100
                                            / eligible_appointment_count, 2))
      # the rate is a per-appointment attachment ratio, NOT capped at 100.00:
      # two purchased products on one completed appointment give 200.00
    input_set: |
      RECOMMENDED, DECLINED and EXPIRED attachments are excluded from
      purchased_count, purchased_amount_cents and commission_cents but their
      appointment still counts toward eligible_appointment_count. Attachments on
      non-COMPLETED appointments are excluded entirely.
    constants:
      RETAIL_COMMISSION_BP: 1200
    precision: "attach_rate_pct is a decimal with exactly 2 places (round_half_up); a zero denominator yields exactly 0.00 and never an error"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# A request is evaluated top to bottom and returns the FIRST violated rule's
# error_id. Clinical safety outranks licensing, licensing outranks resource
# availability, and fiscal capacity is checked last.
# ---------------------------------------------------------------------------
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the five roles in §1.7 and that role appears in the endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "request body/query shape is valid: required fields present, types and enums legal, integers within range, datetimes ISO-8601 UTC, pagination limit in 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

  - priority: 4
    category: existence
    check: "every path id resolves, validated strictly left to right: the guest/therapist/appointment segment before the nested segment"
    error_id: "ERR_GUEST_NOT_FOUND | ERR_THERAPIST_NOT_FOUND | ERR_LICENSE_NOT_FOUND | ERR_CERTIFICATION_NOT_FOUND | ERR_INTAKE_FORM_NOT_FOUND | ERR_APPOINTMENT_NOT_FOUND | ERR_RETAIL_ATTACHMENT_NOT_FOUND | ERR_ROOM_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  - priority: 5
    category: business_referential
    check: "every id supplied in the body resolves, validated in the body-field order guest_id, treatment_type_id, room_id, therapist_id"
    error_id: "ERR_GUEST_NOT_FOUND | ERR_TREATMENT_TYPE_NOT_FOUND | ERR_ROOM_NOT_FOUND | ERR_THERAPIST_NOT_FOUND"
    http_status: 404
    applies_to: "POST /appointments"

  - priority: 6
    category: business_constraint
    check: "TreatmentType.code and TreatmentRoom.code are unique across their collection"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /treatment-types, POST /treatment-rooms"

  - priority: 7
    category: auth
    check: "when the caller's role is Guest, X-User-ID equals the Guest.id the resource hangs off; when the caller's role is Therapist, X-User-ID equals Appointment.therapist_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "every endpoint whose roles list includes Guest or Therapist"

  - priority: 8
    category: business_constraint
    check: "expected_<parent>_version equals the parent's current version (see §1.2.1)"
    error_id: "ERR_STALE_GUEST_VERSION | ERR_STALE_APPOINTMENT_VERSION"
    http_status: 412
    applies_to: "POST /guests/{id}/intake-forms, POST /appointments/{id}/settlements"

  - priority: 9
    category: state
    check: "the target resource is in a state the requested transition departs from (§1.2), including terminal-state lockdown and repeat-trigger idempotency rejection"
    error_id: "ERR_INVALID_APPOINTMENT_STATE | ERR_INVALID_INTAKE_STATE | ERR_INVALID_LICENSE_STATE | ERR_INVALID_THERAPIST_STATE | ERR_INVALID_ATTACHMENT_STATE | ERR_SETTLEMENT_ALREADY_FINAL"
    http_status: 409
    applies_to: "every action endpoint"

  - priority: 10
    category: state
    check: "the appointment's clearance_status is CLEARED for check-in and start, and BLOCKED for the CHECKED_IN abort path"
    error_id: ERR_APPOINTMENT_NOT_CLEARED
    http_status: 409
    applies_to: "POST /appointments/{id}/check-in, POST /appointments/{id}/start, POST /appointments/{id}/cancel from CHECKED_IN"
  - priority: 11
    category: business_safety
    check: "segregation of duties: the licence reviewer differs from submitted_by_user_id, and the intake overrider differs from screened_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /therapist-licenses/{id}/review, POST /intake-forms/{id}/override"

  - priority: 12
    category: business_safety
    check: "the guest has an authoritative IntakeForm whose status is SCREENED_CLEAR or OVERRIDDEN"
    error_id: ERR_INTAKE_NOT_CLEARED
    http_status: 409
    applies_to: "POST /appointments, POST /appointments/{id}/confirm"

  - priority: 13
    category: business_safety
    check: "that form's consent_signed_at is set and its consent_version equals TreatmentType.required_consent_version"
    error_id: ERR_CONSENT_MISSING
    http_status: 409
    applies_to: "POST /appointments, POST /appointments/{id}/confirm"

  - priority: 14
    category: business_safety
    check: "Guest.screened_condition_codes shares no code with TreatmentType.contraindication_codes"
    error_id: ERR_CONTRAINDICATION_PRESENT
    http_status: 409
    applies_to: "POST /appointments, POST /appointments/{id}/confirm"

  - priority: 15
    category: business_safety
    check: "the therapist holds a TherapistLicense with verification_status VERIFIED whose state_code equals Therapist.practice_state_code"
    error_id: ERR_LICENSE_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /appointments, POST /appointments/{id}/confirm"

  - priority: 16
    category: business_safety
    check: "that licence's expires_on is on or after the current logical-clock date (booking checks CURRENT validity; a licence that lapses between booking and service is caught later by POST /compliance-sweeps, which blocks the appointment's clearance dimension)"
    error_id: ERR_LICENSE_EXPIRED
    http_status: 409
    applies_to: "POST /appointments, POST /appointments/{id}/confirm"

  - priority: 17
    category: business_safety
    check: "ce_compliance_evaluation variant CALENDAR_WINDOW reports shortfall_hours == 0 for the licence under review"
    error_id: ERR_CE_HOURS_INSUFFICIENT
    http_status: 409
    applies_to: "POST /therapist-licenses/{id}/review with decision VERIFIED"

  - priority: 18
    category: business_safety
    check: "when ce_hours_required > 0, that evaluation's ethics_hours_credited is at least CE_ETHICS_MIN_HOURS"
    error_id: ERR_CE_ETHICS_REQUIREMENT_UNMET
    http_status: 409
    applies_to: "POST /therapist-licenses/{id}/review with decision VERIFIED"

  - priority: 19
    category: business_safety
    check: "the therapist holds an ACTIVE CertificationGrant for TreatmentType.required_skill_code with expires_on >= date(clock) whose scope rank is at least the required scope rank"
    error_id: ERR_SCOPE_OF_PRACTICE_VIOLATION
    http_status: 409
    applies_to: "POST /appointments, POST /appointments/{id}/confirm"

  - priority: 20
    category: state
    check: "Therapist.status is ACTIVE"
    error_id: ERR_THERAPIST_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /appointments, POST /appointments/{id}/confirm, POST /appointments/{id}/start"

  - priority: 21
    category: business_constraint
    check: "TreatmentRoom.room_class equals TreatmentType.room_class_required and TreatmentRoom.capacity_guests >= 1"
    error_id: ERR_ROOM_CLASS_MISMATCH
    http_status: 409
    applies_to: "POST /appointments"

  - priority: 22
    category: business_constraint
    check: "TreatmentRoom.status is ACTIVE"
    error_id: ERR_ROOM_UNAVAILABLE
    http_status: 409
    applies_to: "POST /appointments, POST /appointments/{id}/confirm"

  - priority: 23
    category: business_temporal
    check: "an AVAILABLE ShiftBlock of the assigned therapist contains [start_at, end_at] with both bounds inclusive"
    error_id: ERR_OUTSIDE_SHIFT_WINDOW
    http_status: 409
    applies_to: "POST /appointments"

  - priority: 24
    category: business_temporal
    check: "the assigned therapist has no BREAK/ADMIN ShiftBlock and no non-terminal appointment whose closed interval intersects [start_at, end_at]"
    error_id: ERR_THERAPIST_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /appointments"

  - priority: 25
    category: business_temporal
    check: "the room's occupancy interval [start_at, end_at + turnover_buffer_minutes) does not overlap any non-terminal or COMPLETED appointment's occupancy interval in that room; touching at exactly end_at + turnover_buffer_minutes is allowed"
    error_id: ERR_ROOM_TURNOVER_CONFLICT
    http_status: 409
    applies_to: "POST /appointments"

  - priority: 26
    category: business_temporal
    check: "start_at is at least MIN_LEAD_MINUTES (= 120) minutes after the logical clock: start_at >= clock + 120 minutes"
    error_id: ERR_BOOKING_LEAD_TIME
    http_status: 409
    applies_to: "POST /appointments"

  - priority: 27
    category: business_constraint
    check: "Guest.booking_privilege is OPEN"
    error_id: ERR_GUEST_BOOKING_RESTRICTED
    http_status: 409
    applies_to: "POST /appointments"

  - priority: 28
    category: business_constraint
    check: "RetailAttachment.product_line equals the appointment's TreatmentType.retail_product_line"
    error_id: ERR_PRODUCT_LINE_MISMATCH
    http_status: 409
    applies_to: "POST /appointments/{id}/retail-attachments"

  - priority: 29
    category: business_fiscal
    check: "gratuity_cents is at most round_half_up(quoted_price_cents * GRATUITY_CAP_BP / 10000)"
    error_id: ERR_GRATUITY_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /appointments/{id}/complete"

  - priority: 30
    category: business_fiscal
    check: "Guest.folio_balance_cents plus the amount about to post is at most Guest.folio_limit_cents"
    error_id: ERR_FOLIO_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /retail-attachments/{id}/resolve with outcome PURCHASED, POST /appointments/{id}/check-in"

  - priority: 31
    category: business_constraint
    check: "no eligible therapist exists for the requested slot when therapist_id was omitted (therapist_assignment_selector empty-pool fallback)"
    error_id: ERR_NO_ELIGIBLE_THERAPIST
    http_status: 409
    applies_to: "POST /appointments without therapist_id"

  - priority: 32
    category: business_temporal
    check: "report windows satisfy from_at < to_at and span at most MAX_REPORT_WINDOW_DAYS days; ce-compliance as_of is a valid date"
    error_id: ERR_INVALID_REPORT_WINDOW
    http_status: 422
    applies_to: "GET /reports/room-utilization, GET /reports/retail-attachment"

  - priority: 33
    category: business_temporal
    check: "the requested clock instant is greater than or equal to the current logical clock (the clock never rewinds)"
    error_id: ERR_CLOCK_REWIND
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"

  - priority: 34
    category: business_constraint
    check: "IntakeForm.amendment_round is below MAX_AMENDMENT_ROUNDS"
    error_id: ERR_AMENDMENT_LIMIT
    http_status: 409
    applies_to: "POST /intake-forms/{id}/amend"


# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# Every path parameter is spelled {id} and is resolved against the collection
# segment immediately to its left. The surface is deliberately above the
# Expert band because the scenario asks for a harder-than-expert task: the
# extra endpoints are all reverse-reachability GETs and single state
# transitions, not new business concepts.
# ---------------------------------------------------------------------------
endpoints:

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: sets the server's logical UTC clock, which every expiry, window, lead-time and cancellation-band rule reads. Before the first call the clock reads exactly 2026-08-01T00:00:00Z; it never falls back to wall-clock time and never rewinds."
    roles: [SpaDirector, ComplianceOfficer, SpaCoordinator]
    code: 200
    input: [current_utc]
    output: "{ current_utc: datetime }"
    side_effects: ["no entity is mutated; subsequent requests evaluate every temporal rule against the new instant"]

  - method: POST
    path: "/treatment-types"
    description: "Register a menu item with its duration, room-class requirement, skill/scope mapping, contraindication list, retail line and consent version."
    roles: [SpaDirector]
    code: 201
    input: [code, name, duration_minutes, room_class_required, required_skill_code, required_scope_level, base_price_cents, "contraindication_codes?", retail_product_line, required_consent_version, "high_demand?"]
    output: TreatmentType
    side_effects: ["none beyond creation"]

  - method: POST
    path: "/treatment-rooms"
    description: "Register a treatment room with its class, capacity, turnover buffer and hourly fixed cost."
    roles: [SpaDirector]
    code: 201
    input: [code, room_class, capacity_guests, turnover_buffer_minutes, hourly_fixed_cost_cents, "status?"]
    output: TreatmentRoom
    side_effects: ["booked_minutes_total initialised to 0"]

  - method: GET
    path: "/treatment-rooms/{id}"
    description: "Read one room, including the booked_minutes_total ledger the compensating-invariant checks reconcile against."
    roles: [SpaDirector, SpaCoordinator, ComplianceOfficer]
    code: 200
    input: []
    output: TreatmentRoom
    side_effects: []

  - method: PATCH
    path: "/treatment-rooms/{id}"
    description: "Change a room's status. Moving it out of ACTIVE blocks the clearance dimension of every non-terminal appointment in that room; moving it back to ACTIVE re-evaluates them."
    roles: [SpaDirector]
    code: 200
    input: [status]
    output: TreatmentRoom
    side_effects:
      - "status != ACTIVE: every appointment in this room with schedule_status IN {REQUESTED, CONFIRMED, CHECKED_IN} gets clearance_status := BLOCKED with clearance_block_reason := ROOM_UNAVAILABLE (subject to the fixed reason precedence), and their RECOMMENDED RetailAttachment rows become EXPIRED"
      - "status back to ACTIVE: those appointments are re-evaluated and become CLEARED when all four clearance clauses hold"

  - method: POST
    path: "/therapists"
    description: "Register a therapist with employment type, commission tier, hourly labour cost and practice state."
    roles: [SpaDirector]
    code: 201
    input: [full_name, employment_type, commission_tier, base_hourly_cost_cents, practice_state_code]
    output: Therapist
    side_effects: ["status := ACTIVE, suspension_reason := null, assigned_minutes_total := 0"]

  - method: GET
    path: "/therapists/{id}"
    description: "Read one therapist, including status, suspension_reason and the assigned_minutes_total ledger."
    roles: [SpaDirector, SpaCoordinator, ComplianceOfficer, Therapist]
    code: 200
    input: []
    output: Therapist
    side_effects: []

  - method: POST
    path: "/therapists/{id}/suspend"
    description: "Suspend a therapist (permanent true makes it INACTIVE, the only terminal state)."
    roles: [SpaDirector]
    code: 200
    input: ["permanent?", "reason_note?"]
    output: Therapist
    side_effects:
      - "status := SUSPENDED (or INACTIVE when permanent is true); suspension_reason := DIRECTOR_ACTION"
      - "every non-terminal appointment of this therapist gets clearance_status := BLOCKED with clearance_block_reason := THERAPIST_SUSPENDED, expiring their RECOMMENDED RetailAttachment rows"

  - method: POST
    path: "/therapists/{id}/reinstate"
    description: "Return a SUSPENDED therapist to ACTIVE; requires a currently VERIFIED unexpired licence."
    roles: [SpaDirector]
    code: 200
    input: []
    output: Therapist
    side_effects:
      - "status := ACTIVE; suspension_reason := null"
      - "every BLOCKED non-terminal appointment of this therapist is re-evaluated and becomes CLEARED when all four clearance clauses hold"

  - method: POST
    path: "/therapists/{id}/licenses"
    description: "Submit a state licence for verification. The caller is recorded as submitted_by_user_id and is therefore barred from reviewing it."
    roles: [ComplianceOfficer]
    code: 201
    input: [license_number, license_type, state_code, issued_on, expires_on, current_period_start_on, "ce_hours_required?"]
    output: TherapistLicense
    side_effects: ["verification_status := PENDING_REVIEW; submitted_by_user_id := X-User-ID; credited_ce_hours := 0"]

  - method: GET
    path: "/therapists/{id}/licenses"
    description: "List a therapist's licences (reverse-reachability channel for TherapistLicense.therapist_id)."
    roles: [ComplianceOfficer, SpaDirector]
    code: 200
    input: ["verification_status?", "limit?", "offset?"]
    output: "TherapistLicense[]"
    side_effects: []

  - method: GET
    path: "/therapist-licenses/{id}"
    description: "Read one licence, including verification_status, credited_ce_hours and the two segregation-of-duties user ids."
    roles: [ComplianceOfficer, SpaDirector]
    code: 200
    input: []
    output: TherapistLicense
    side_effects: []

  - method: POST
    path: "/therapist-licenses/{id}/review"
    description: "Verify or reject a PENDING_REVIEW licence. A VERIFIED decision additionally runs ce_compliance_evaluation variant CALENDAR_WINDOW as a gate."
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "review_note?"]
    output: TherapistLicense
    side_effects:
      - "decision VERIFIED: verification_status := VERIFIED, verified_at := clock, credited_ce_hours := the CALENDAR_WINDOW credited_hours"
      - "decision REJECTED: verification_status := REJECTED, verified_at stays null"
      - "reviewed_by_user_id := X-User-ID; review_note := body value or null"

  - method: POST
    path: "/therapist-licenses/{id}/resubmit"
    description: "Return a REJECTED or EXPIRED licence to PENDING_REVIEW, optionally replacing the licence number, expiry and CE period. Re-arms the segregation-of-duties check for the next review."
    roles: [ComplianceOfficer]
    code: 200
    input: ["license_number?", "expires_on?", "current_period_start_on?", "ce_hours_required?"]
    output: TherapistLicense
    side_effects: ["verification_status := PENDING_REVIEW; submitted_by_user_id := X-User-ID; reviewed_by_user_id := null; review_note := null; verified_at := null"]

  - method: POST
    path: "/therapist-licenses/{id}/ce-records"
    description: "Record a completed continuing-education course against a licence."
    roles: [ComplianceOfficer]
    code: 201
    input: [course_code, category, ce_hours, completed_on]
    output: ContinuingEducationRecord
    side_effects: ["recorded_by_user_id := X-User-ID; the record is immutable (no version, no update endpoint)"]

  - method: GET
    path: "/therapist-licenses/{id}/ce-records"
    description: "List a licence's continuing-education records (reverse-reachability channel for ContinuingEducationRecord.license_id)."
    roles: [ComplianceOfficer, SpaDirector]
    code: 200
    input: ["category?", "limit?", "offset?"]
    output: "ContinuingEducationRecord[]"
    side_effects: []

  - method: GET
    path: "/therapist-licenses/{id}/ce-compliance"
    description: "Computed read: runs ce_compliance_evaluation. variant defaults to CALENDAR_WINDOW; as_of defaults to the logical clock's UTC date and is only consulted by ROLLING_24M."
    roles: [ComplianceOfficer, SpaDirector]
    code: 200
    input: ["variant?", "as_of?"]
    output: "{ variant: string, window_start_on: string, window_end_on: string, credited_hours: number, ethics_hours_credited: number, ce_hours_required: number, shortfall_hours: number, ethics_requirement_met: boolean, compliant: boolean }"
    side_effects: ["read-only; TherapistLicense.credited_ce_hours is NOT written by this endpoint"]

  - method: POST
    path: "/therapists/{id}/certifications"
    description: "Grant a skill certification at BASIC or ADVANCED scope."
    roles: [ComplianceOfficer]
    code: 201
    input: [skill_code, scope_level, granted_on, expires_on]
    output: CertificationGrant
    side_effects: ["status := ACTIVE"]

  - method: GET
    path: "/therapists/{id}/certifications"
    description: "List a therapist's certification grants (reverse-reachability channel for CertificationGrant.therapist_id)."
    roles: [ComplianceOfficer, SpaDirector, SpaCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CertificationGrant[]"
    side_effects: []

  - method: POST
    path: "/certifications/{id}/revoke"
    description: "Revoke a certification grant, removing the therapist from the eligible pool for treatments requiring that skill."
    roles: [ComplianceOfficer]
    code: 200
    input: ["reason_note?"]
    output: CertificationGrant
    side_effects: ["status := REVOKED; revoked_by_user_id := X-User-ID"]

  - method: POST
    path: "/therapists/{id}/shift-blocks"
    description: "Publish an AVAILABLE, BREAK or ADMIN block on a therapist's calendar. Both bounds are inclusive."
    roles: [SpaCoordinator, SpaDirector]
    code: 201
    input: [block_type, start_at, end_at, "note?"]
    output: ShiftBlock
    side_effects: ["none beyond creation; existing appointments are never re-validated against a newly published block"]

  - method: GET
    path: "/therapists/{id}/shift-blocks"
    description: "List a therapist's shift blocks (reverse-reachability channel for ShiftBlock.therapist_id)."
    roles: [SpaCoordinator, SpaDirector, Therapist]
    code: 200
    input: ["block_type?", "from_at?", "to_at?", "limit?", "offset?"]
    output: "ShiftBlock[]"
    side_effects: []

  - method: POST
    path: "/guests"
    description: "Register a resort guest with loyalty tier and folio limit."
    roles: [SpaCoordinator, SpaDirector]
    code: 201
    input: [full_name, resort_room_number, "loyalty_tier?", folio_limit_cents]
    output: Guest
    side_effects: ["folio_balance_cents := 0; late_cancel_count := 0; no_show_strikes := 0; booking_privilege := OPEN; authoritative_intake_form_id := null; screened_condition_codes := []"]

  - method: GET
    path: "/guests/{id}"
    description: "Read one guest, including folio_balance_cents, booking_privilege, authoritative_intake_form_id, screened_condition_codes and version (the OCC token for intake-form creation)."
    roles: [SpaCoordinator, SpaDirector, ComplianceOfficer, Guest]
    code: 200
    input: []
    output: Guest
    side_effects: []

  - method: POST
    path: "/guests/{id}/intake-forms"
    description: "Open a new health-questionnaire intake form for a guest. Guarded by OCC on Guest.version (§1.2.1) because a screened form supersedes the guest's previous authoritative form."
    roles: [Guest, SpaCoordinator]
    code: 201
    input: [expected_guest_version, "condition_codes?", "medications?"]
    output: IntakeForm
    side_effects: ["status := DRAFT; increments Guest.version by 1"]

  - method: GET
    path: "/guests/{id}/intake-forms"
    description: "List a guest's intake forms newest-first (reverse-reachability channel for IntakeForm.guest_id)."
    roles: [SpaCoordinator, ComplianceOfficer, SpaDirector, Guest]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "IntakeForm[]"
    side_effects: []

  - method: GET
    path: "/intake-forms/{id}"
    description: "Read one intake form, including status, flagged_condition_codes, consent fields, amendment_round and the two segregation-of-duties user ids."
    roles: [SpaCoordinator, ComplianceOfficer, SpaDirector, Guest]
    code: 200
    input: []
    output: IntakeForm
    side_effects: []

  - method: POST
    path: "/intake-forms/{id}/consent"
    description: "Record the guest's signature on a consent document version. Legal from DRAFT or SUBMITTED, before or after screening."
    roles: [Guest, SpaCoordinator]
    code: 200
    input: [consent_version]
    output: IntakeForm
    side_effects: ["consent_version := body value; consent_signed_at := clock"]

  - method: POST
    path: "/intake-forms/{id}/submit"
    description: "Submit a DRAFT intake form for compliance screening."
    roles: [Guest, SpaCoordinator]
    code: 200
    input: []
    output: IntakeForm
    side_effects: ["status := SUBMITTED"]

  - method: POST
    path: "/intake-forms/{id}/screen"
    description: "Screen a SUBMITTED form against the HIGH_RISK_CONDITION_CODES registry. The screener becomes the segregation-of-duties counterparty for any later override."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: IntakeForm
    side_effects:
      - "status := SCREENED_CLEAR or SCREENED_FLAGGED; flagged_condition_codes := the intersection; screened_by_user_id := X-User-ID; screened_at := clock"
      - "Guest.authoritative_intake_form_id and Guest.screened_condition_codes are rewritten; the previous authoritative form becomes SUPERSEDED; increments Guest.version by 1"
      - "SCREENED_FLAGGED runs the block cascade; SCREENED_CLEAR re-evaluates BLOCKED appointments of that guest"

  - method: POST
    path: "/intake-forms/{id}/override"
    description: "Director override of a SCREENED_FLAGGED form. The overriding user must differ from screened_by_user_id."
    roles: [SpaDirector]
    code: 200
    input: [override_reason]
    output: IntakeForm
    side_effects:
      - "status := OVERRIDDEN; overridden_by_user_id := X-User-ID; override_reason := body value"
      - "BLOCKED appointments of that guest are re-evaluated and become CLEARED when all four clauses hold; EXPIRED RetailAttachment rows are not revived"

  - method: POST
    path: "/intake-forms/{id}/amend"
    description: "Guest amendment loop: return a SCREENED_FLAGGED form to DRAFT with corrected answers, at most MAX_AMENDMENT_ROUNDS times."
    roles: [Guest, SpaCoordinator]
    code: 200
    input: ["condition_codes?", "medications?"]
    output: IntakeForm
    side_effects:
      - "status := DRAFT; amendment_round += 1; flagged_condition_codes := []; screened_by_user_id := null; screened_at := null"
      - "Guest.authoritative_intake_form_id and Guest.screened_condition_codes are recomputed; increments Guest.version by 1"

  - method: POST
    path: "/appointments"
    description: "Book a treatment. Omitting therapist_id invokes therapist_assignment_selector; supplying it books that therapist explicitly. Runs the whole §1.4 ladder from priority 5 down."
    roles: [SpaCoordinator, Guest]
    code: 201
    input: [guest_id, treatment_type_id, room_id, "therapist_id?", start_at]
    output: Appointment
    side_effects:
      - "scheduled_duration_minutes, end_at, high_demand_slot and assignment_mode are derived; quoted_price_cents := appointment_price_quote output"
      - "schedule_status := REQUESTED; clearance_status := PENDING"
      - "TreatmentRoom.booked_minutes_total += duration + turnover_buffer_minutes; Therapist.assigned_minutes_total += duration"

  - method: GET
    path: "/appointments"
    description: "Filtered, paginated appointment list. Also the reverse-reachability channel for Appointment.guest_id, treatment_type_id, room_id and therapist_id."
    roles: [SpaCoordinator, SpaDirector, ComplianceOfficer]
    code: 200
    input: ["guest_id?", "therapist_id?", "room_id?", "treatment_type_id?", "schedule_status?", "clearance_status?", "from_at?", "to_at?", "limit?", "offset?"]
    output: "Appointment[]"
    side_effects: []

  - method: GET
    path: "/appointments/{id}"
    description: "Read one appointment, including both state dimensions, clearance_block_reason, quoted_price_cents, realized_price_cents, cancellation_charge_cents and version (the OCC token for settlement creation)."
    roles: [SpaCoordinator, SpaDirector, ComplianceOfficer, Therapist, Guest]
    code: 200
    input: []
    output: Appointment
    side_effects: []

  - method: POST
    path: "/appointments/{id}/confirm"
    description: "Confirm a REQUESTED appointment. Re-runs the clinical, licensing, scope, therapist-status and room-status gates and advances the clearance dimension to CLEARED."
    roles: [SpaCoordinator]
    code: 200
    input: []
    output: Appointment
    side_effects: ["schedule_status := CONFIRMED; clearance_status := CLEARED; clearance_block_reason := null"]

  - method: POST
    path: "/appointments/{id}/check-in"
    description: "Check the guest in. Cuts the PROVISIONAL settlement and posts the treatment charge to the folio."
    roles: [SpaCoordinator]
    code: 200
    input: []
    output: Appointment
    side_effects:
      - "schedule_status := CHECKED_IN"
      - "creates SettlementRecord{variant: PROVISIONAL, status: PROVISIONAL} from settlement_distribution variant PROVISIONAL"
      - "posts FolioCharge{kind: TREATMENT} for that record's folio_total_cents; Guest.folio_balance_cents recomputed; increments Guest.version by 1"

  - method: POST
    path: "/appointments/{id}/start"
    description: "The assigned therapist starts the treatment. Requires CLEARED clearance and an ACTIVE therapist."
    roles: [Therapist]
    code: 200
    input: []
    output: Appointment
    side_effects: ["schedule_status := IN_SERVICE"]

  - method: POST
    path: "/appointments/{id}/complete"
    description: "The assigned therapist reports the delivered duration and any guest gratuity. No settlement is cut here."
    roles: [Therapist]
    code: 200
    input: [actual_duration_minutes, "gratuity_cents?"]
    output: Appointment
    side_effects: ["schedule_status := COMPLETED; actual_duration_minutes and gratuity_cents := body values"]

  - method: POST
    path: "/appointments/{id}/cancel"
    description: "Cancel an appointment. From REQUESTED/CONFIRMED the cancellation_charge band decides CANCELLED vs LATE_CANCELLED; from CHECKED_IN with BLOCKED clearance it is the compensating pre-treatment abort (SpaCoordinator only)."
    roles: [SpaCoordinator, Guest]
    code: 200
    input: ["cancel_reason?"]
    output: Appointment
    side_effects:
      - "schedule_status := CANCELLED or LATE_CANCELLED per the cancellation_charge band; cancellation_charge_cents := that output"
      - "LATE_CANCELLED posts FolioCharge{kind: LATE_CANCEL}, increments Guest.late_cancel_count and may run the restriction cascade"
      - "the CHECKED_IN abort reverses the PROVISIONAL settlement and posts a negative FolioCharge{kind: REVERSAL}"
      - "the room and therapist minute ledgers are decremented by this appointment's committed minutes"

  - method: POST
    path: "/appointments/{id}/no-show"
    description: "Mark a CONFIRMED appointment as a no-show once the grace period has elapsed. Charges the full no-show band."
    roles: [SpaCoordinator]
    code: 200
    input: []
    output: Appointment
    side_effects:
      - "schedule_status := NO_SHOW; cancellation_charge_cents := cancellation_charge output (NO_SHOW band)"
      - "posts FolioCharge{kind: NO_SHOW}; increments Guest.no_show_strikes; runs the restriction cascade"
      - "the room and therapist minute ledgers are decremented"

  - method: POST
    path: "/appointments/{id}/retail-attachments"
    description: "The assigned therapist recommends a retail product. The product line must match the treatment's retail_product_line."
    roles: [Therapist]
    code: 201
    input: [product_sku, product_line, amount_cents]
    output: RetailAttachment
    side_effects: ["status := RECOMMENDED; no folio posting"]

  - method: GET
    path: "/appointments/{id}/retail-attachments"
    description: "List an appointment's retail recommendations (reverse-reachability channel for RetailAttachment.appointment_id)."
    roles: [Therapist, SpaCoordinator, SpaDirector, Guest]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "RetailAttachment[]"
    side_effects: []

  - method: POST
    path: "/retail-attachments/{id}/resolve"
    description: "Resolve a RECOMMENDED attachment as PURCHASED (posts to the folio, subject to the folio limit) or DECLINED."
    roles: [Guest, SpaCoordinator]
    code: 200
    input: [outcome]
    output: RetailAttachment
    side_effects:
      - "status := PURCHASED or DECLINED; resolved_by_user_id := X-User-ID; resolved_at := clock"
      - "PURCHASED posts FolioCharge{kind: RETAIL} for amount_cents and recomputes Guest.folio_balance_cents; increments Guest.version by 1"

  - method: POST
    path: "/appointments/{id}/settlements"
    description: "Cut the FINAL settlement for a COMPLETED appointment. Guarded by OCC on Appointment.version (§1.2.1)."
    roles: [SpaDirector]
    code: 201
    input: [expected_appointment_version]
    output: SettlementRecord
    side_effects:
      - "creates SettlementRecord{variant: FINAL, status: FINALIZED} from settlement_distribution variant FINAL"
      - "Appointment.realized_price_cents := that row's realized_price_cents; increments Appointment.version by 1"
      - "the PROVISIONAL row becomes SUPERSEDED"
      - "posts FolioCharge{kind: SETTLEMENT_ADJUSTMENT} for folio_total_cents minus the appointment's already-posted charges; recomputes Guest.folio_balance_cents; increments Guest.version by 1"

  - method: GET
    path: "/appointments/{id}/settlements"
    description: "List an appointment's settlement rows, PROVISIONAL first then FINAL (reverse-reachability channel for SettlementRecord.appointment_id)."
    roles: [SpaDirector, SpaCoordinator, ComplianceOfficer]
    code: 200
    input: ["variant?", "limit?", "offset?"]
    output: "SettlementRecord[]"
    side_effects: []

  - method: GET
    path: "/guests/{id}/folio-charges"
    description: "List a guest's folio postings in posted_at ASC order (reverse-reachability channel for FolioCharge.guest_id)."
    roles: [SpaCoordinator, SpaDirector, Guest]
    code: 200
    input: ["kind?", "limit?", "offset?"]
    output: "FolioCharge[]"
    side_effects: []

  - method: GET
    path: "/appointments/{id}/folio-charges"
    description: "List one appointment's folio postings (reverse-reachability channel for FolioCharge.appointment_id)."
    roles: [SpaCoordinator, SpaDirector, Guest]
    code: 200
    input: ["kind?", "limit?", "offset?"]
    output: "FolioCharge[]"
    side_effects: []

  - method: GET
    path: "/reports/room-utilization"
    description: "Computed read: runs room_utilization_and_margin over the half-open window [from_at, to_at). Every room appears, including rooms with no completed appointments. Each element of rooms carries room_id, room_code, occupied_minutes, utilization_pct, revenue_cents, labor_cost_cents, room_fixed_cost_cents, net_margin_cents and revenue_per_room_hour_cents."
    roles: [SpaDirector, SpaCoordinator]
    code: 200
    input: [from_at, to_at, "room_id?"]
    output: "{ from_at: datetime, to_at: datetime, window_minutes: integer, rooms: array }"
    side_effects: ["read-only"]

  - method: GET
    path: "/reports/retail-attachment"
    description: "Computed read: runs retail_attachment_rate over the half-open window [from_at, to_at), optionally scoped to one therapist."
    roles: [SpaDirector, SpaCoordinator]
    code: 200
    input: [from_at, to_at, "therapist_id?"]
    output: "{ from_at: datetime, to_at: datetime, eligible_appointment_count: integer, purchased_count: integer, attach_rate_pct: number, purchased_amount_cents: integer, commission_cents: integer }"
    side_effects: ["read-only"]

  - method: POST
    path: "/compliance-sweeps"
    description: "Operator batch step evaluated at the current logical clock: expires every VERIFIED licence whose expires_on has passed and runs the five-hop licence-expiry cascade."
    roles: [ComplianceOfficer, SpaDirector]
    code: 200
    input: []
    output: "{ swept_at: datetime, expired_license_ids: array, suspended_therapist_ids: array, blocked_appointment_ids: array, auto_cancelled_appointment_ids: array, expired_attachment_ids: array }"
    side_effects:
      - "hop 1: matching TherapistLicense rows go VERIFIED -> EXPIRED"
      - "hop 2: therapists left without any VERIFIED unexpired licence go ACTIVE -> SUSPENDED with suspension_reason LICENSE_EXPIRED"
      - "hop 3: their non-terminal appointments get clearance_status := BLOCKED with clearance_block_reason := LICENSE_INVALID, in start_at ASC then created_at ASC order"
      - "hop 4: RECOMMENDED RetailAttachment rows on those appointments become EXPIRED"
      - "hop 5: those appointments with schedule_status CONFIRMED starting within SWEEP_AUTO_CANCEL_HORIZON_HOURS go CONFIRMED -> CANCELLED with cancellation_charge_cents 0, decrementing the room and therapist minute ledgers"

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:

  # --- authentication / authorization / shape
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the caller's role is not in the endpoint's roles list"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a Guest caller's X-User-ID is not the guest the resource belongs to, or a Therapist caller's X-User-ID is not Appointment.therapist_id"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required field, illegal enum, out-of-range number, malformed ISO-8601 instant or date, or pagination limit/offset outside 1..100 / >= 0"

  # --- existence
  - id: ERR_TREATMENT_TYPE_NOT_FOUND
    http: 404
    condition: "treatment_type_id does not resolve"
  - id: ERR_ROOM_NOT_FOUND
    http: 404
    condition: "a treatment-room id in the path or body does not resolve"
  - id: ERR_THERAPIST_NOT_FOUND
    http: 404
    condition: "a therapist id in the path or body does not resolve"
  - id: ERR_LICENSE_NOT_FOUND
    http: 404
    condition: "a therapist-licence id in the path does not resolve"
  - id: ERR_CERTIFICATION_NOT_FOUND
    http: 404
    condition: "a certification id in the path does not resolve"
  - id: ERR_GUEST_NOT_FOUND
    http: 404
    condition: "a guest id in the path or body does not resolve"
  - id: ERR_INTAKE_FORM_NOT_FOUND
    http: 404
    condition: "an intake-form id in the path does not resolve"
  - id: ERR_APPOINTMENT_NOT_FOUND
    http: 404
    condition: "an appointment id in the path does not resolve"
  - id: ERR_RETAIL_ATTACHMENT_NOT_FOUND
    http: 404
    condition: "a retail-attachment id in the path does not resolve"

  # --- optimistic concurrency (§1.2.1)
  - id: ERR_STALE_GUEST_VERSION
    http: 412
    condition: "expected_guest_version does not equal Guest.version on POST /guests/{id}/intake-forms"
  - id: ERR_STALE_APPOINTMENT_VERSION
    http: 412
    condition: "expected_appointment_version does not equal Appointment.version on POST /appointments/{id}/settlements"

  # --- state
  - id: ERR_INVALID_APPOINTMENT_STATE
    http: 409
    condition: "the appointment's schedule_status has no transition for the requested action, including repeating a trigger and acting on a terminal status"
  - id: ERR_APPOINTMENT_NOT_CLEARED
    http: 409
    condition: "clearance_status is not CLEARED for check-in or start, or not BLOCKED for the CHECKED_IN abort path"
  - id: ERR_INVALID_INTAKE_STATE
    http: 409
    condition: "the intake form's status has no transition for the requested action, including acting on a SUPERSEDED form"
  - id: ERR_INVALID_LICENSE_STATE
    http: 409
    condition: "reviewing a licence that is not PENDING_REVIEW, or resubmitting one that is neither REJECTED nor EXPIRED"
  - id: ERR_INVALID_THERAPIST_STATE
    http: 409
    condition: "suspending a therapist that is not ACTIVE, reinstating one that is not SUSPENDED, or any transition out of INACTIVE"
  - id: ERR_INVALID_ATTACHMENT_STATE
    http: 409
    condition: "resolving a RetailAttachment that is not RECOMMENDED, or attaching to an appointment outside {CONFIRMED, CHECKED_IN, IN_SERVICE, COMPLETED}"
  - id: ERR_SETTLEMENT_ALREADY_FINAL
    http: 409
    condition: "a FINAL SettlementRecord already exists for the appointment"

  # --- compliance and clinical safety
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "the licence reviewer equals submitted_by_user_id, or the intake overrider equals screened_by_user_id"
  - id: ERR_INTAKE_NOT_CLEARED
    http: 409
    condition: "the guest has no authoritative IntakeForm in status SCREENED_CLEAR or OVERRIDDEN"
  - id: ERR_CONSENT_MISSING
    http: 409
    condition: "the authoritative intake form has no consent signature, or its consent_version differs from TreatmentType.required_consent_version"
  - id: ERR_CONTRAINDICATION_PRESENT
    http: 409
    condition: "a screened condition code appears in the treatment's contraindication_codes"
  - id: ERR_LICENSE_NOT_VERIFIED
    http: 409
    condition: "the therapist has no VERIFIED licence for the practice state"
  - id: ERR_LICENSE_EXPIRED
    http: 409
    condition: "the therapist's VERIFIED licence has already expired as of the logical-clock date"
  - id: ERR_CE_HOURS_INSUFFICIENT
    http: 409
    condition: "the CALENDAR_WINDOW continuing-education evaluation reports a non-zero shortfall at licence verification"
  - id: ERR_CE_ETHICS_REQUIREMENT_UNMET
    http: 409
    condition: "credited ethics hours are below CE_ETHICS_MIN_HOURS while ce_hours_required is greater than 0"
  - id: ERR_SCOPE_OF_PRACTICE_VIOLATION
    http: 409
    condition: "the therapist holds no ACTIVE unexpired certification for the required skill at the required scope rank"
  - id: ERR_THERAPIST_NOT_ACTIVE
    http: 409
    condition: "the assigned therapist is SUSPENDED or INACTIVE"

  # --- scheduling constraints
  - id: ERR_ROOM_CLASS_MISMATCH
    http: 409
    condition: "the room's class differs from the treatment's room_class_required"
  - id: ERR_ROOM_UNAVAILABLE
    http: 409
    condition: "the room's status is MAINTENANCE or OUT_OF_SERVICE"
  - id: ERR_OUTSIDE_SHIFT_WINDOW
    http: 409
    condition: "no AVAILABLE ShiftBlock of the therapist contains the appointment's closed interval"
  - id: ERR_THERAPIST_DOUBLE_BOOKED
    http: 409
    condition: "a BREAK/ADMIN block or another non-terminal appointment of that therapist intersects the appointment's closed interval"
  - id: ERR_ROOM_TURNOVER_CONFLICT
    http: 409
    condition: "the room's occupancy interval, extended by turnover_buffer_minutes, overlaps another appointment's occupancy interval in that room"
  - id: ERR_BOOKING_LEAD_TIME
    http: 409
    condition: "start_at is less than MIN_LEAD_MINUTES (= 120) minutes after the logical clock"
  - id: ERR_GUEST_BOOKING_RESTRICTED
    http: 409
    condition: "the guest's booking_privilege is RESTRICTED"
  - id: ERR_NO_ELIGIBLE_THERAPIST
    http: 409
    condition: "therapist_id was omitted and therapist_assignment_selector's candidate pool is empty"
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "a TreatmentType.code or TreatmentRoom.code already exists"
  - id: ERR_AMENDMENT_LIMIT
    http: 409
    condition: "the intake form has already used MAX_AMENDMENT_ROUNDS amendment rounds"
  - id: ERR_PRODUCT_LINE_MISMATCH
    http: 409
    condition: "the attachment's product_line differs from the treatment's retail_product_line"

  # --- fiscal and temporal input
  - id: ERR_FOLIO_LIMIT_EXCEEDED
    http: 402
    condition: "the posting would push Guest.folio_balance_cents above folio_limit_cents"
  - id: ERR_GRATUITY_LIMIT_EXCEEDED
    http: 422
    condition: "gratuity_cents exceeds GRATUITY_CAP_BP of quoted_price_cents"
  - id: ERR_INVALID_REPORT_WINDOW
    http: 422
    condition: "from_at is not before to_at, or the window spans more than MAX_REPORT_WINDOW_DAYS days"
  - id: ERR_CLOCK_REWIND
    http: 422
    condition: "the requested logical-clock instant is earlier than the current one"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix — role_model: segregation_of_duties
# SoD-1: the ComplianceOfficer who submitted or resubmitted a licence cannot
#        review it (compared against TherapistLicense.submitted_by_user_id).
# SoD-2: the SpaDirector who screened an intake form cannot override it
#        (compared against IntakeForm.screened_by_user_id) — a Director who
#        also holds officer duties is caught by the same comparison.
# ---------------------------------------------------------------------------
roles:

  - name: SpaDirector
    description: "Spa leadership: owns the menu, rooms, therapist roster, clinical overrides, final settlements and the revenue/utilization reports."
    identity: opaque
    exclusive_operations:
      - "POST /treatment-types"
      - "POST /treatment-rooms"
      - "PATCH /treatment-rooms/{id}"
      - "POST /therapists"
      - "POST /therapists/{id}/suspend"
      - "POST /therapists/{id}/reinstate"
      - "POST /intake-forms/{id}/override"
      - "POST /appointments/{id}/settlements"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "POST /compliance-sweeps"
      - "POST /guests"
      - "POST /therapists/{id}/shift-blocks"
      - "GET /reports/room-utilization"
      - "GET /reports/retail-attachment"
      - "GET /treatment-rooms/{id}"
      - "GET /therapists/{id}"
      - "GET /therapists/{id}/licenses"
      - "GET /therapists/{id}/certifications"
      - "GET /therapists/{id}/shift-blocks"
      - "GET /therapist-licenses/{id}"
      - "GET /therapist-licenses/{id}/ce-records"
      - "GET /therapist-licenses/{id}/ce-compliance"
      - "GET /guests/{id}"
      - "GET /guests/{id}/intake-forms"
      - "GET /intake-forms/{id}"
      - "GET /appointments"
      - "GET /appointments/{id}"
      - "GET /appointments/{id}/retail-attachments"
      - "GET /appointments/{id}/settlements"
      - "GET /guests/{id}/folio-charges"
      - "GET /appointments/{id}/folio-charges"

  - name: ComplianceOfficer
    description: "Licensing, continuing-education and clinical-screening authority. Submits and reviews licences (never the same one), records CE, grants and revokes certifications, screens intake forms."
    identity: opaque
    exclusive_operations:
      - "POST /therapists/{id}/licenses"
      - "POST /therapist-licenses/{id}/review"
      - "POST /therapist-licenses/{id}/resubmit"
      - "POST /therapist-licenses/{id}/ce-records"
      - "POST /therapists/{id}/certifications"
      - "POST /certifications/{id}/revoke"
      - "POST /intake-forms/{id}/screen"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "POST /compliance-sweeps"
      - "GET /therapist-licenses/{id}"
      - "GET /therapist-licenses/{id}/ce-compliance"
      - "GET /appointments"
      - "GET /appointments/{id}"
      - "GET /appointments/{id}/settlements"

  - name: SpaCoordinator
    description: "Front-desk operations: books, confirms, checks in, cancels and no-shows appointments, publishes shift blocks, registers guests and resolves retail recommendations on the guest's behalf."
    identity: opaque
    exclusive_operations:
      - "POST /appointments/{id}/confirm"
      - "POST /appointments/{id}/check-in"
      - "POST /appointments/{id}/no-show"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "POST /guests"
      - "POST /guests/{id}/intake-forms"
      - "POST /intake-forms/{id}/consent"
      - "POST /intake-forms/{id}/submit"
      - "POST /intake-forms/{id}/amend"
      - "POST /appointments"
      - "POST /appointments/{id}/cancel"
      - "POST /retail-attachments/{id}/resolve"
      - "POST /therapists/{id}/shift-blocks"
      - "GET /reports/room-utilization"
      - "GET /reports/retail-attachment"

  - name: Therapist
    description: "Licensed service provider. Starts and completes only their own appointments and recommends retail products on them."
    identity: "entity_backed:Therapist"
    exclusive_operations:
      - "POST /appointments/{id}/start"
      - "POST /appointments/{id}/complete"
      - "POST /appointments/{id}/retail-attachments"
    shared_operations:
      - "GET /therapists/{id}"
      - "GET /therapists/{id}/shift-blocks"
      - "GET /appointments/{id}"
      - "GET /appointments/{id}/retail-attachments"

  - name: Guest
    description: "Resort guest. Files and amends their own intake forms, signs consent, books and cancels their own appointments and resolves retail recommendations on their own appointments."
    identity: "entity_backed:Guest"
    exclusive_operations: []
    shared_operations:
      - "POST /guests/{id}/intake-forms"
      - "POST /intake-forms/{id}/consent"
      - "POST /intake-forms/{id}/submit"
      - "POST /intake-forms/{id}/amend"
      - "POST /appointments"
      - "POST /appointments/{id}/cancel"
      - "POST /retail-attachments/{id}/resolve"
      - "GET /guests/{id}"
      - "GET /guests/{id}/intake-forms"
      - "GET /intake-forms/{id}"
      - "GET /appointments/{id}"
      - "GET /appointments/{id}/retail-attachments"
      - "GET /guests/{id}/folio-charges"
      - "GET /appointments/{id}/folio-charges"
