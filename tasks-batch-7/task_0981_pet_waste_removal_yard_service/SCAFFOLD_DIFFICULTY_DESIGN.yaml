            - "ServiceRoute.${rt_g}.route_load_factor_bp == 0 (was 2500)"

  # =========================================================================
  # Rule 5 — priority_pair_validation_conflict (2 instances, different error-category pairs)
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_priority_pair
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_ACCESS_NOT_VERIFIED]
        distinguishing_aspect: |
          Pair: state (priority 5) vs business_safety (priority 7). Subscription in
          PAUSED state is sent /activate (invalid from state) AND its access
          profile is also not VERIFIED. Higher priority state error wins:
          ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Subscription sub_h PAUSED"
            - "PropertyAccessProfile for the yard is VERIFICATION_PENDING (not VERIFIED)"
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { full_name: "H", email: "h@x.com", phone: "+14155550108" }
              as: OperationsManager
              captures: { cu_h: $.data.id }
            - call: "POST /api/yards"
              payload: { customer_id: "${cu_h}", address_line1: "7 Main", city: "SF", state_code: "CA", postal_code: "94110", yard_size_sqft: 1500, pet_count: 1, service_region_code: "R1" }
              as: OperationsManager
              captures: { y_h: $.data.id }
            - call: "POST /api/yards/${y_h}/access-profile"
              payload: { gate_access_code: "1", gate_instructions: "", pet_on_premises: false, pet_aggression_flag: "NONE" }
              as: OperationsManager
              captures: { pap_h: $.data.id }
            - call: "POST /api/property-access-profiles/${pap_h}/verify"
              payload: {}
              as: OperationsManager
            - call: "POST /api/subscription-plans"
              payload: { plan_code: "WH", display_name: "WH", visit_frequency: "WEEKLY", applies_to_multifamily: false, base_monthly_fee_cents: 10000, yard_tier_thresholds: [], yard_tier_surcharges_cents: [0], pet_tier_thresholds: [], pet_tier_surcharges_cents: [0] }
              as: OperationsManager
              captures: { pl_h: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/subscriptions"
              payload: { customer_id: "${cu_h}", yard_id: "${y_h}", plan_id: "${pl_h}" }
              as: Customer
              as_user_id: "${cu_h}"
              captures: { sub_h: $.data.id }
            - call: "POST /api/subscriptions/${sub_h}/activate"
              payload: {}
              as: Customer
              as_user_id: "${cu_h}"
            - call: "POST /api/subscriptions/${sub_h}/pause"
              payload: {}
              as: Customer
              as_user_id: "${cu_h}"
            - call: "POST /api/property-access-profiles/${pap_h}/require-reverification"
              payload: {}
              as: OperationsManager
          trigger:
            - call: "POST /api/subscriptions/${sub_h}/activate"
              payload: {}
              as: Customer
              as_user_id: "${cu_h}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE (state priority 5 fires before business_safety priority 7)"
      - name: business_constraint_vs_business_fiscal_priority_pair
        grounds:
          - validations[priority=10]
          - validations[priority=18]
          - errors[ERR_PLAN_SCOPE_MISMATCH]
          - errors[ERR_PAYMENT_AMOUNT_MISMATCH]
        distinguishing_aspect: |
          Pair: business_constraint (priority 10) vs business_fiscal (priority 18).
          Customer attempts to activate a Subscription whose plan scope mismatches
          the yard (constraint violation) AND simultaneously an unrelated invoice
          record-payment would have had a wrong amount (fiscal violation). The
          activation attempt fails with ERR_PLAN_SCOPE_MISMATCH; separately,
          attempting to record-payment on the open invoice with wrong amount
          confirms fiscal check fires later in its own priority order.
        test_recipe:
          setup:
            - "Customer cu_i with a non-multifamily Yard y_i VERIFIED"
            - "Plan pl_i_mm applies_to_multifamily=true (scope mismatch)"
            - "Subscription sub_i DRAFT referencing y_i and pl_i_mm"
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { full_name: "I", email: "i@x.com", phone: "+14155550109" }
              as: OperationsManager
              captures: { cu_i: $.data.id }
            - call: "POST /api/yards"
              payload: { customer_id: "${cu_i}", address_line1: "8 Main", city: "SF", state_code: "CA", postal_code: "94110", yard_size_sqft: 1500, pet_count: 1, service_region_code: "R1" }
              as: OperationsManager
              captures: { y_i: $.data.id }
            - call: "POST /api/yards/${y_i}/access-profile"
              payload: { gate_access_code: "1", gate_instructions: "", pet_on_premises: false, pet_aggression_flag: "NONE" }
              as: OperationsManager
              captures: { pap_i: $.data.id }
            - call: "POST /api/property-access-profiles/${pap_i}/verify"
              payload: {}
