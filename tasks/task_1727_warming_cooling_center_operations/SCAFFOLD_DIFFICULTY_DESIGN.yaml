  - rule_id: resource_temporal_overlap
    instances:
      - name: staff_shift_half_open_adjacency_allowed_overlap_rejected
        grounds:
          - state_machines.Shift.PLANNED_to_CONFIRMED
          - errors[ERR_SHIFT_OVERLAP]
        distinguishing_aspect: |
          Resource StaffMember with pure half-open interval semantics: [20:00, 04:00) and
          [04:00, 08:00) touch at 04:00 and do NOT intersect (adjacent confirm succeeds), while
          [03:00, 05:00) intersects [20:00, 04:00) and is rejected with ERR_SHIFT_OVERLAP.
        test_recipe:
          setup:
            - "Episode STANDBY; SiteActivation OPENING; staff W with INTAKE skill"
          setup_api_calls:
            - call: "POST /api/episodes"
              payload: { mode: "WARMING", threshold_f: 32.0, sustained_hours_required: 1, scheduled_end_at: "2026-08-12T00:00:00Z" }
              as: EOCManager
              captures: { ep: $.data.id }
            - call: "POST /api/sites"
              payload: { name: "Armory", address: "9 Oak Ave", bed_capacity: 10, pet_capacity: 0, locker_capacity: 0 }
              as: EOCManager
              captures: { site: $.data.id }
            - call: "POST /api/episodes/${ep}/site-activations"
              payload: { site_id: "${site}" }
              as: EOCManager
              captures: { sa: $.data.id }
            - call: "POST /api/staff-members"
              payload: { full_name: "Lead One", skills: ["SITE_LEAD"] }
              as: EOCManager
              captures: { lead1: $.data.id }
            - call: "POST /api/staff-members"
              payload: { full_name: "Worker W", skills: ["INTAKE"] }
              as: EOCManager
              captures: { w: $.data.id }
            - call: "POST /api/site-activations/${sa}/shifts"
              payload: { staff_member_id: "${w}", role_on_shift: "INTAKE", start_at: "2026-08-10T20:00:00Z", end_at: "2026-08-11T04:00:00Z" }
              as: SiteLead
              as_user_id: "${lead1}"
              captures: { s1: $.data.id }
            - { call: "POST /api/shifts/${s1}/confirm", payload: {}, as: SiteLead, as_user_id: "${lead1}" }
            - call: "POST /api/site-activations/${sa}/shifts"
              payload: { staff_member_id: "${w}", role_on_shift: "INTAKE", start_at: "2026-08-11T04:00:00Z", end_at: "2026-08-11T08:00:00Z" }
              as: SiteLead
              as_user_id: "${lead1}"
              captures: { s2: $.data.id }
            - call: "POST /api/site-activations/${sa}/shifts"
              payload: { staff_member_id: "${w}", role_on_shift: "INTAKE", start_at: "2026-08-11T03:00:00Z", end_at: "2026-08-11T05:00:00Z" }
              as: SiteLead
              as_user_id: "${lead1}"
              captures: { s3: $.data.id }
          trigger:
            - call: "POST /api/shifts/${s2}/confirm"
              payload: {}
              as: SiteLead
              as_user_id: "${lead1}"
              captures: { s2_status: $.data.status }
            - call: "POST /api/shifts/${s3}/confirm"
              payload: {}
              as: SiteLead
              as_user_id: "${lead1}"
              captures: { err: $.data.error_id }
          assert:
            - "Adjacent shift [04:00, 08:00) confirms: status == CONFIRMED (end == start is not an intersection)"
            - "Overlapping shift [03:00, 05:00) rejected: error_id == ERR_SHIFT_OVERLAP"
            - "Shift.${s3}.status remains PLANNED"
      - name: vehicle_window_turnaround_buffer_blocks_adjacent_dispatch
        grounds:
          - state_machines.TransportDispatch.REQUESTED_to_ASSIGNED
          - errors[ERR_VEHICLE_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Resource Vehicle with buffer-expanded interval semantics (different resource and
          different geometry from the staff half-open rule): the assigned window is fattened by
          +/- turnaround_minutes (30), so a back-to-back dispatch at exactly the prior window's
          end IS a conflict, while a start exactly 30 minutes after that end is allowed.
