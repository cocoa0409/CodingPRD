  - rule_id: non_linear_state_machine
    instances:

      - name: parallel_payment_and_fulfillment_dimension_gate
        grounds:
          - state_machines.Reservation.fulfillment_status
          - state_machines.Reservation.payment_status
          - validations.priority_20_ERR_BALANCE_OUTSTANDING
          - complexity_profile.state_machine_shape
        distinguishing_aspect: |
          Reservation carries two independent state dimensions. Paying the
          balance advances payment_status DEPOSIT_PAID -> FULLY_PAID while
          leaving fulfillment_status at SEATED, and the SEATED -> COMPLETED
          edge is gated on the OTHER dimension, so the same trigger on the same
          entity fails and then succeeds with no change to the dimension it
          moves. This is the parallel-dimension shape; the sibling instances
          cover a capped cycle, an amend loop and a fork with disjoint arms.
        test_recipe:
          setup:
            - "one restaurant, one DEPOSIT package (deposit_bp 3000), one PUBLISHED Saturday HIGH service seating at 2026-09-12T22:00:00Z"
            - "one table seating 2 to 4 with turn_buffer_minutes 15"
            - "one guest with a party-of-2 reservation: grand_total 38610, deposit 11583 paid, CONFIRMED, table assigned at 22:00"
            - "logical clock advanced to 2026-09-12T22:00:00Z and the party SEATED"
