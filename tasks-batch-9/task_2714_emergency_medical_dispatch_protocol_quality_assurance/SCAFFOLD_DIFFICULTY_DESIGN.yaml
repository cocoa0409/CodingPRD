            - "Review.${ra_id}.pre_penalty_composite_score == 90.0, penalty_points == 0.0, final_composite_score == 90.0, compliant == true"
            - "Review.${rb_id}.pre_penalty_composite_score == 89.9, penalty_points == 0.0, final_composite_score == 89.9, compliant == false"
            - "Dispatcher.${da_id}.compliance_pct == 90.0 and compliance_posture == GOOD (the comparison is >=, so exactly at target is GOOD)"
            - "Dispatcher.${db_id}.compliance_pct == 89.9 and compliance_posture == WATCH"
