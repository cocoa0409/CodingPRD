              as: network_admin
              as_user_id: "u_na_1"
              captures: { p2: $.data.id }
            - call: "POST /backup-care/providers/${p2}/credentials"
              payload: { credential_type: "LICENSE", issued_on: "2026-01-02", expires_on: "2027-06-30", verified_by: "u_na_1" }
              as: network_admin
              as_user_id: "u_na_1"
            - call: "POST /backup-care/providers/${p2}/credentials"
              payload: { credential_type: "BACKGROUND_CHECK", issued_on: "2026-01-02", expires_on: "2027-06-30", verified_by: "u_na_1" }
              as: network_admin
              as_user_id: "u_na_1"
            - call: "POST /backup-care/providers/${p2}/credentials"
              payload: { credential_type: "CPR", issued_on: "2026-01-02", expires_on: "2027-06-30", verified_by: "u_na_1" }
              as: network_admin
              as_user_id: "u_na_1"
            - call: "POST /backup-care/providers/${p2}/credentials"
              payload: { credential_type: "INSURANCE", issued_on: "2026-01-02", expires_on: "2027-06-30", verified_by: "u_na_1" }
              as: network_admin
              as_user_id: "u_na_1"
              captures: { p2_ins: $.data.id }
            - call: "POST /backup-care/providers/${p2}/credential-review"
