              as: LogisticsDispatcher
              as_user_id: "LD-1"
              captures: { err_station: "$.data.error_id" }
            - call: "POST /deliveries"
              payload: { station_id: "${st_id}", production_lot_id: "11111111-1111-4111-8111-111111111111", receiving_vessel_id: "${v_low}", mode: "LIQUID_TANKER", planned_kg: 100.000, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T12:00:00Z", departed_at: "2026-08-02T04:00:00Z" }
              as: LogisticsDispatcher
              as_user_id: "LD-1"
              captures: { err_lot: "$.data.error_id" }
            - call: "POST /deliveries"
              payload: { station_id: "${st_id}", production_lot_id: "${lot_id}", receiving_vessel_id: "11111111-1111-4111-8111-111111111111", mode: "LIQUID_TANKER", planned_kg: 100.000, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T12:00:00Z", departed_at: "2026-08-02T04:00:00Z" }
              as: LogisticsDispatcher
