              as: TherapyLead
              as_user_id: "${pt1_id}"
              captures: { s_a2_id: $.data.id }
            - call: "POST /therapy-sessions"
              payload: { admission_id: "${adm_a_id}", clinician_id: "${pt1_id}", discipline: "PT", modality: "INDIVIDUAL", start_at: "2026-08-06T09:00:00Z", end_at: "2026-08-06T14:00:00Z", group_size: 1 }
              as: TherapyLead
              as_user_id: "${pt1_id}"
              captures: { s_a3_id: $.data.id }
            - call: "POST /therapy-sessions"
              payload: { admission_id: "${adm_b_id}", clinician_id: "${pt2_id}", discipline: "PT", modality: "INDIVIDUAL", start_at: "2026-08-04T09:00:00Z", end_at: "2026-08-04T14:00:00Z", group_size: 1 }
              as: TherapyLead
              as_user_id: "${pt2_id}"
              captures: { s_b1_id: $.data.id }
            - call: "POST /therapy-sessions"
              payload: { admission_id: "${adm_b_id}", clinician_id: "${pt2_id}", discipline: "PT", modality: "INDIVIDUAL", start_at: "2026-08-05T09:00:00Z", end_at: "2026-08-05T14:00:00Z", group_size: 1 }
              as: TherapyLead
              as_user_id: "${pt2_id}"
              captures: { s_b2_id: $.data.id }
            - call: "POST /therapy-sessions"
              payload: { admission_id: "${adm_b_id}", clinician_id: "${pt2_id}", discipline: "PT", modality: "INDIVIDUAL", start_at: "2026-08-06T09:00:00Z", end_at: "2026-08-06T14:00:00Z", group_size: 1 }
              as: TherapyLead
              as_user_id: "${pt2_id}"
              captures: { s_b3_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
