      - name: risk_index_decay_floor_clamps_at_twenty_percent
        claim_type: Correct Result
        grounds:
          - calculations.applicant_disciplinary_risk_index
          - calculations.applicant_disciplinary_risk_index.constants
          - entities.Applicant.fields.disciplinary_risk_index_reported
        distinguishing_aspect: "An ADVISORY action aged 16 full 365-day blocks would produce a decay factor of 1.0 - 0.2 * 16 = -2.2, but DECAY_FLOOR clamps it to 0.2, so the contribution is 5 * 0.2 = 1.00 rather than a negative number."
        test_recipe:
          setup:
            - "One Applicant with no disciplinary rows; the logical clock is at its startup default 2026-08-01T00:00:00Z."
            - "2010-01-01T00:00:00Z is 6056 days before the clock, i.e. floor(6056 / 365) == 16 full year blocks."
          setup_api_calls:
            - call: "POST /licensure/applicants"
              payload: { full_name: "Yara Bello", state_code: "TX", residency_months: 24, military_status: "NONE" }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { ap: $.data.id }
          trigger:
            - call: "POST /licensure/disciplinary-records"
              payload: { applicant_id: "${ap}", source_state: "OK", source_database: "NPDB", severity: "ADVISORY", action_effective_at: "2010-01-01T00:00:00Z", reported_at: "2010-01-01T00:00:00Z" }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { dr: $.data.id }
          assert:
            - "HTTP status is 201 and DisciplinaryRecord.${dr}.resolved == false"
            - "Applicant.${ap}.disciplinary_risk_index_reported == 1.00"
            - "Applicant.${ap}.disciplinary_risk_index_effective == 1.00"
            - "Applicant.${ap}.good_standing_flag == true (1.00 < GOOD_STANDING_MAX_INDEX 25.00 and ADVISORY is neither SUSPENSION nor REVOCATION)"

