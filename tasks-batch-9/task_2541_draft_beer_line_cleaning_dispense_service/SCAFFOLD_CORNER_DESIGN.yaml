              captures: { err_both: $.data.error_id }
            - call: "POST /draft-service/balance-records"
              payload: { visit_id: "${visit}", line_id: "${line1}", measured_temp_f: 40.0, proposed_applied_psi: 13.6, proposed_co2_pct: 30.0, expected_line_version: "${lv1}" }
              as: ServiceTechnician
