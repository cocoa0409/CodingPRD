scaffold_corner_design:
  - section: entities
    instances:
      - name: manufacturer_creation_returns_envelope_and_defaults
        claim_type: creation
        grounds:
          - entities.Manufacturer
          - endpoints.POST_dealer-board_manufacturers
          - response_envelope.success
        distinguishing_aspect: "POST /dealer-board/manufacturers with the four required fields returns 201, echoes them, defaults state_registration_status to REGISTERED, zeroes both derived counters and stamps version 1 inside the meta/data envelope."
        test_recipe:
          setup:
            - "Empty database; the logical clock is left at its 2026-08-01T00:00:00Z default."
          setup_api_calls: []
          trigger:
            - call: "POST /dealer-board/manufacturers"
              payload: { legal_name: "Aurora Motors NA", line_make: "AURORA", home_office_state: "MI", posted_warranty_labor_rate_cents: 6000 }
              as: BoardAdmin
              captures: { mfr_c1_id: $.data.id, mfr_c1_v: $.data.version }
          assert:
            - "HTTP status 201"
            - "response has meta.api_request_id and meta.api_request_timestamp and response_type == object"
            - "Manufacturer.${mfr_c1_id}.legal_name == Aurora Motors NA"
            - "Manufacturer.${mfr_c1_id}.line_make == AURORA"
            - "Manufacturer.${mfr_c1_id}.posted_warranty_labor_rate_cents == 6000"
            - "Manufacturer.${mfr_c1_id}.state_registration_status == REGISTERED"
            - "Manufacturer.${mfr_c1_id}.open_dispute_count == 0"
            - "Manufacturer.${mfr_c1_id}.active_filing_count == 0"
            - "Manufacturer.${mfr_c1_id}.version == 1"

      - name: dealer_retrieval_returns_stored_row
        claim_type: retrieval
        grounds:
          - entities.Dealer
          - endpoints.GET_dealer-board_dealers_id
        distinguishing_aspect: "GET /dealer-board/dealers/{id} returns exactly the stored row: PROSPECTIVE licence dimension, NONE franchise dimension, zeroed counters and the supplied coordinates."
        test_recipe:
          setup:
            - "One dealer created 2026-09-01 and never licensed."
          setup_api_calls:
            - call: "POST /dealer-board/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /dealer-board/dealers"
              payload: { legal_name: "Lakeside Aurora", dealer_type: "NEW_MOTOR_VEHICLE", county_tier: "TIER_2", site_x_km: 0, site_y_km: 0, line_make: "AURORA" }
              as: BoardAdmin
              captures: { dlr_c2_id: $.data.id }
          trigger:
            - call: "GET /dealer-board/dealers/${dlr_c2_id}"
              payload: {}
              as: LicensingAnalyst
          assert:
            - "HTTP status 200"
            - "Dealer.${dlr_c2_id}.license_status == PROSPECTIVE"
            - "Dealer.${dlr_c2_id}.franchise_status == NONE"
            - "Dealer.${dlr_c2_id}.suspension_reason == NONE"
            - "Dealer.${dlr_c2_id}.disciplinary_points == 0"
            - "Dealer.${dlr_c2_id}.restitution_outstanding_cents == 0"
            - "Dealer.${dlr_c2_id}.licensed_salesperson_count == 0"
            - "Dealer.${dlr_c2_id}.license_effective_on == null"

      - name: dealers_listing_paginates_and_filters_by_county_tier
        claim_type: listing
        grounds:
          - endpoints.GET_dealer-board_dealers
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three dealers stored, GET /dealer-board/dealers?limit=2&offset=0 reports total_count 3 and has_more true, and adding county_tier=TIER_1 narrows total_count to 1 with has_more false."
        test_recipe:
          setup:
            - "Three dealers created 2026-09-01: two TIER_2 and one TIER_1."
          setup_api_calls:
            - call: "POST /dealer-board/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /dealer-board/dealers"
              payload: { legal_name: "Lakeside Aurora", dealer_type: "NEW_MOTOR_VEHICLE", county_tier: "TIER_2", site_x_km: 0, site_y_km: 0, line_make: "AURORA" }
              as: BoardAdmin
              captures: { dlr_c3a_id: $.data.id }
            - call: "POST /dealer-board/dealers"
              payload: { legal_name: "Harbor Aurora", dealer_type: "NEW_MOTOR_VEHICLE", county_tier: "TIER_2", site_x_km: 20, site_y_km: 0, line_make: "AURORA" }
              as: BoardAdmin
              captures: { dlr_c3b_id: $.data.id }
            - call: "POST /dealer-board/dealers"
              payload: { legal_name: "Metro Aurora", dealer_type: "NEW_MOTOR_VEHICLE", county_tier: "TIER_1", site_x_km: 4, site_y_km: 3, line_make: "AURORA" }
              as: BoardAdmin
              captures: { dlr_c3c_id: $.data.id }
          trigger:
            - call: "GET /dealer-board/dealers"
              payload: { limit: 2, offset: 0 }
              as: BoardAdmin
            - call: "GET /dealer-board/dealers"
              payload: { county_tier: "TIER_1", limit: 10, offset: 0 }
              as: BoardAdmin
          assert:
            - "first read: total_count == 3 AND has_more == true AND the data array holds 2 rows"
            - "first read: response_type == array and the rows are ordered created_at ASC, so data[0].id == ${dlr_c3a_id}"
            - "second read: total_count == 1 AND has_more == false AND data[0].id == ${dlr_c3c_id}"
            - "second read: data[0].county_tier == TIER_1"

      - name: dealer_detail_read_unknown_id_not_found
        claim_type: not_found
        grounds:
          - validations.priority_6_existence
          - errors[ERR_DEALER_NOT_FOUND]
        distinguishing_aspect: "GET /dealer-board/dealers/{id} for an id that was never minted returns 404 ERR_DEALER_NOT_FOUND, not an empty 200 body."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /dealer-board/dealers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: BoardAdmin
              captures: { nf_err: $.data.error_id }
          assert:
            - "HTTP status 404"
            - "error_id == ERR_DEALER_NOT_FOUND"
            - "response_type == error and data.message is present"

      - name: manufacturer_missing_required_line_make_rejected
        claim_type: required_fields
        grounds:
          - validations.priority_5_ERR_INVALID_REQUEST
          - endpoints.POST_dealer-board_manufacturers
        distinguishing_aspect: "line_make has source input with no default, so omitting it returns 400 ERR_INVALID_REQUEST and no Manufacturer row is created."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /dealer-board/manufacturers"
              payload: { legal_name: "Aurora Motors NA", home_office_state: "MI", posted_warranty_labor_rate_cents: 6000 }
              as: BoardAdmin
              captures: { req_err: $.data.error_id }
          assert:
            - "HTTP status 400"
            - "error_id == ERR_INVALID_REQUEST"
            - "GET /dealer-board/manufacturers reports total_count 0"

      - name: hearing_room_defaults_applied_when_omitted
        claim_type: defaults
        grounds:
          - entities.HearingRoom.fields.max_hearings_per_day
          - entities.HearingRoom.fields.buffer_minutes
        distinguishing_aspect: "Creating a room without max_hearings_per_day or buffer_minutes stores the declared defaults 2 and 60, and supplying them explicitly overrides both."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /dealer-board/hearing-rooms"
              payload: { room_code: "HR-1", seating_capacity: 60 }
              as: BoardAdmin
              captures: { room_c6a_id: $.data.id }
            - call: "POST /dealer-board/hearing-rooms"
              payload: { room_code: "HR-2", seating_capacity: 40, max_hearings_per_day: 3, buffer_minutes: 30 }
              as: BoardAdmin
              captures: { room_c6b_id: $.data.id }
          assert:
            - "HearingRoom.${room_c6a_id}.max_hearings_per_day == 2"
            - "HearingRoom.${room_c6a_id}.buffer_minutes == 60"
            - "HearingRoom.${room_c6a_id}.booked_hearing_count == 0"
            - "HearingRoom.${room_c6b_id}.max_hearings_per_day == 3"
            - "HearingRoom.${room_c6b_id}.buffer_minutes == 30"

      - name: dealer_create_rejects_client_supplied_computed_fields
        claim_type: computed_fields
        grounds:
          - validations.priority_5_ERR_INVALID_REQUEST
          - entities.Dealer.fields.disciplinary_points
          - entities.Dealer.fields.license_status
        distinguishing_aspect: "disciplinary_points and license_status are computed/system fields absent from the endpoint's input list, so a body carrying them returns 400 ERR_INVALID_REQUEST rather than being silently honoured."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /dealer-board/dealers"
              payload: { legal_name: "Lakeside Aurora", dealer_type: "NEW_MOTOR_VEHICLE", county_tier: "TIER_2", site_x_km: 0, site_y_km: 0, line_make: "AURORA", disciplinary_points: 99, license_status: "LICENSED" }
              as: BoardAdmin
              captures: { comp_err: $.data.error_id }
          assert:
            - "HTTP status 400"
            - "error_id == ERR_INVALID_REQUEST"
            - "GET /dealer-board/dealers reports total_count 0"

      - name: dealer_system_fields_generated_on_create
        claim_type: system_fields
        grounds:
          - entities.Dealer.common_fields
          - response_envelope.success
        distinguishing_aspect: "id, created_at, updated_at and version are minted by the server: created_at equals the logical clock instant 2026-09-01T00:00:00Z and version starts at 1."
        test_recipe:
          setup:
            - "The logical clock is set to 2026-09-01T00:00:00Z before the create."
          setup_api_calls:
            - call: "POST /dealer-board/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: BoardAdmin
          trigger:
            - call: "POST /dealer-board/dealers"
              payload: { legal_name: "Lakeside Aurora", dealer_type: "NEW_MOTOR_VEHICLE", county_tier: "TIER_2", site_x_km: 0, site_y_km: 0, line_make: "AURORA" }
              as: BoardAdmin
              captures: { dlr_c8_id: $.data.id, dlr_c8_created: $.data.created_at, dlr_c8_v: $.data.version }
          assert:
            - "Dealer.${dlr_c8_id}.id is non-empty and was not supplied by the client"
            - "Dealer.${dlr_c8_id}.created_at == 2026-09-01T00:00:00Z"
            - "Dealer.${dlr_c8_id}.updated_at == 2026-09-01T00:00:00Z"
            - "Dealer.${dlr_c8_id}.version == 1"

      - name: dealer_invalid_enum_county_tier_rejected
        claim_type: type_constraints
        grounds:
          - validations.priority_5_ERR_INVALID_REQUEST
          - entities.Dealer.fields.county_tier
        distinguishing_aspect: "county_tier accepts only TIER_1, TIER_2 and TIER_3, so TIER_4 returns 400 ERR_INVALID_REQUEST while TIER_3 is stored."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /dealer-board/dealers"
              payload: { legal_name: "Bad Tier Autos", dealer_type: "NEW_MOTOR_VEHICLE", county_tier: "TIER_4", site_x_km: 0, site_y_km: 0 }
              as: BoardAdmin
              captures: { enum_err: $.data.error_id }
            - call: "POST /dealer-board/dealers"
              payload: { legal_name: "Rural Autos", dealer_type: "NEW_MOTOR_VEHICLE", county_tier: "TIER_3", site_x_km: 0, site_y_km: 0 }
              as: BoardAdmin
              captures: { dlr_c9_id: $.data.id }
          assert:
            - "first call: HTTP status 400 with error_id ERR_INVALID_REQUEST"
            - "second call: HTTP status 201"
            - "Dealer.${dlr_c9_id}.county_tier == TIER_3"
            - "GET /dealer-board/dealers reports total_count 1"

      - name: market_study_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.MarketStudy.common_fields
          - endpoints.POST_dealer-board_protests_id_market-studies
          - endpoints.GET_dealer-board_protests_id_market-studies
        distinguishing_aspect: "MarketStudy is declared common_fields false: the create response and the sub-resource list expose no version, updated_at or update/delete endpoint, and a second study by the same party is appended rather than overwriting the first."
        test_recipe:
          setup:
            - "Licensed, franchised incumbent Lakeside Aurora at (0, 0); ADDITIONAL_POINT filing at (9, 12) noticed 2026-09-10; protest filed 2026-09-15."
          setup_api_calls:
            - call: "POST /dealer-board/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /dealer-board/manufacturers"
              payload: { legal_name: "Aurora Motors NA", line_make: "AURORA", home_office_state: "MI", posted_warranty_labor_rate_cents: 6000 }
              as: BoardAdmin
              captures: { mfr_c10_id: $.data.id }
            - call: "POST /dealer-board/dealers"
              payload: { legal_name: "Lakeside Aurora", dealer_type: "NEW_MOTOR_VEHICLE", county_tier: "TIER_2", site_x_km: 0, site_y_km: 0, line_make: "AURORA" }
              as: BoardAdmin
              captures: { dlr_c10_id: $.data.id }
            - call: "POST /dealer-board/license-applications"
              payload: { dealer_id: "${dlr_c10_id}", application_type: "INITIAL", facility_sqft: 9000, display_spaces: 12, service_bays: 4, bond_amount_cents: 5000000, insurance_liability_cents: 100000000, zoning_certificate_status: "APPROVED", line_make_count: 1 }
              as: Dealer
              as_user_id: "${dlr_c10_id}"
              captures: { app_c10_id: $.data.id }
            - call: "POST /dealer-board/license-applications/${app_c10_id}/submit"
              payload: {}
              as: Dealer
              as_user_id: "${dlr_c10_id}"
            - call: "POST /dealer-board/license-applications/${app_c10_id}/decision"
              payload: { outcome: "APPROVED" }
              as: BoardAdmin
            - call: "POST /dealer-board/franchise-filings"
              payload: { manufacturer_id: "${mfr_c10_id}", filing_type: "ADDITIONAL_POINT", proposed_effective_on: "2026-11-15", site_x_km: 9, site_y_km: 12 }
              as: Manufacturer
              as_user_id: "${mfr_c10_id}"
              captures: { fil_c10_id: $.data.id }
            - call: "POST /dealer-board/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /dealer-board/franchise-filings/${fil_c10_id}/serve-notice"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_c10_id}"
              captures: { fil_c10_v: $.data.version }
            - call: "POST /dealer-board/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /dealer-board/protests"
              payload: { franchise_filing_id: "${fil_c10_id}", protestant_dealer_id: "${dlr_c10_id}", grounds_code: "MARKET_ENCROACHMENT", expected_franchise_filing_version: "${fil_c10_v}" }
              as: Dealer
              as_user_id: "${dlr_c10_id}"
              captures: { prt_c10_id: $.data.id }
          trigger:
            - call: "POST /dealer-board/protests/${prt_c10_id}/market-studies"
              payload: { submitted_by_party: "PROTESTANT", basis: "STATEWIDE_AVERAGE", total_market_registrations: 40000, line_make_registrations: 3200, statewide_line_make_share_pct: 12.50, permanency_investment_cents: 250000000, consumer_access_drive_minutes: 22, market_growth_pct: 8.00 }
              as: Dealer
              as_user_id: "${dlr_c10_id}"
              captures: { ms_c10a_id: $.data.id }
            - call: "POST /dealer-board/protests/${prt_c10_id}/market-studies"
              payload: { submitted_by_party: "PROTESTANT", basis: "COMPARABLE_MARKET", total_market_registrations: 40000, line_make_registrations: 3200, comparable_market_shares_pct: [9.00, 10.00, 11.00], permanency_investment_cents: 250000000, consumer_access_drive_minutes: 22, market_growth_pct: 8.00 }
              as: Dealer
              as_user_id: "${dlr_c10_id}"
              captures: { ms_c10b_id: $.data.id }
            - call: "GET /dealer-board/protests/${prt_c10_id}/market-studies"
              payload: { submitted_by_party: "PROTESTANT", limit: 10, offset: 0 }
              as: HearingClerk
          assert:
            - "MarketStudy.${ms_c10a_id} response exposes no version field and no updated_at field"
            - "MarketStudy.${ms_c10a_id}.expected_penetration_pct == 12.50 AND shortfall_pts == 4.50"
            - "MarketStudy.${ms_c10b_id}.expected_penetration_pct == 10.00 AND shortfall_pts == 2.00"
            - "the sub-resource list reports total_count 2 (the second study appends, it does not overwrite the first)"
            - "no PUT, PATCH or DELETE endpoint exists for market studies in §1.5"

      - name: license_application_unknown_dealer_id_not_found
        claim_type: foreign_key_validation
        grounds:
          - validations.priority_7_existence
          - entities.LicenseApplication.fields.dealer_id
          - complexity_profile.entity_topology
        distinguishing_aspect: "The flat topology validates every body FK: POST /dealer-board/license-applications with a dealer_id that names no row returns 404 ERR_DEALER_NOT_FOUND and stores nothing."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /dealer-board/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: BoardAdmin
          trigger:
            - call: "POST /dealer-board/license-applications"
              payload: { dealer_id: "00000000-0000-0000-0000-000000000000", application_type: "INITIAL", facility_sqft: 9000, display_spaces: 12, service_bays: 4, bond_amount_cents: 5000000, insurance_liability_cents: 100000000, zoning_certificate_status: "APPROVED", line_make_count: 1 }
              as: BoardAdmin
              captures: { fk_err: $.data.error_id }
          assert:
            - "HTTP status 404"
            - "error_id == ERR_DEALER_NOT_FOUND"
            - "GET /dealer-board/license-applications reports total_count 0"

  - section: state_machines
    instances:
      - name: license_application_created_starts_in_draft
        claim_type: initial_state
        grounds:
          - state_machines.LicenseApplication.initial_state
          - entities.LicenseApplication.fields.status
        distinguishing_aspect: "A freshly created application is DRAFT with no deficiency scan run yet: deficiency_codes empty, deficiency_count 0, fee_quoted_cents null and resubmission_count 0."
        test_recipe:
          setup:
            - "One unlicensed dealer created 2026-09-01."
          setup_api_calls:
            - call: "POST /dealer-board/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /dealer-board/dealers"
              payload: { legal_name: "Lakeside Aurora", dealer_type: "NEW_MOTOR_VEHICLE", county_tier: "TIER_2", site_x_km: 0, site_y_km: 0, line_make: "AURORA" }
              as: BoardAdmin
              captures: { dlr_c12_id: $.data.id }
          trigger:
            - call: "POST /dealer-board/license-applications"
              payload: { dealer_id: "${dlr_c12_id}", application_type: "INITIAL", facility_sqft: 5000, display_spaces: 12, service_bays: 4, bond_amount_cents: 5000000, insurance_liability_cents: 100000000, zoning_certificate_status: "APPROVED", line_make_count: 1 }
              as: Dealer
              as_user_id: "${dlr_c12_id}"
              captures: { app_c12_id: $.data.id }
          assert:
            - "LicenseApplication.${app_c12_id}.status == DRAFT"
            - "LicenseApplication.${app_c12_id}.deficiency_count == 0"
            - "LicenseApplication.${app_c12_id}.deficiency_codes == []"
            - "LicenseApplication.${app_c12_id}.fee_quoted_cents == null"
            - "LicenseApplication.${app_c12_id}.resubmission_count == 0"
            - "Dealer.${dlr_c12_id}.license_status == PROSPECTIVE"

      - name: application_submit_twice_rejected_as_invalid_state
        claim_type: idempotency
        grounds:
          - validations.priority_9_ERR_INVALID_APPLICATION_STATE
          - state_machines.LicenseApplication.DRAFT_to_SUBMITTED
        distinguishing_aspect: "submit is admitted only from DRAFT, so replaying it on a SUBMITTED application returns 409 ERR_INVALID_APPLICATION_STATE and neither re-prices the fee nor re-runs the deficiency scan."
        test_recipe:
          setup:
            - "Licensed-eligible dealer created 2026-09-01 with one DRAFT INITIAL application already submitted (fee_quoted_cents 141000)."
          setup_api_calls:
            - call: "POST /dealer-board/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /dealer-board/dealers"
              payload: { legal_name: "Lakeside Aurora", dealer_type: "NEW_MOTOR_VEHICLE", county_tier: "TIER_2", site_x_km: 0, site_y_km: 0, line_make: "AURORA" }
              as: BoardAdmin
              captures: { dlr_c13_id: $.data.id }
            - call: "POST /dealer-board/license-applications"
              payload: { dealer_id: "${dlr_c13_id}", application_type: "INITIAL", facility_sqft: 9000, display_spaces: 12, service_bays: 4, bond_amount_cents: 5000000, insurance_liability_cents: 100000000, zoning_certificate_status: "APPROVED", line_make_count: 1 }
              as: Dealer
              as_user_id: "${dlr_c13_id}"
              captures: { app_c13_id: $.data.id }
            - call: "POST /dealer-board/license-applications/${app_c13_id}/submit"
              payload: {}
              as: Dealer
              as_user_id: "${dlr_c13_id}"
          trigger:
            - call: "POST /dealer-board/license-applications/${app_c13_id}/submit"
              payload: {}
              as: Dealer
              as_user_id: "${dlr_c13_id}"
              captures: { sub2_err: $.data.error_id }
          assert:
            - "HTTP status 409"
            - "error_id == ERR_INVALID_APPLICATION_STATE"
            - "LicenseApplication.${app_c13_id}.status == SUBMITTED"
            - "LicenseApplication.${app_c13_id}.fee_quoted_cents == 141000"
            - "LicenseApplication.${app_c13_id}.submitted_at == 2026-09-01T00:00:00Z"

      - name: deficiency_notice_on_draft_application_rejected
        claim_type: invalid_transitions
        grounds:
          - validations.priority_9_ERR_INVALID_APPLICATION_STATE
          - state_machines.LicenseApplication.SUBMITTED_to_DEFICIENT
        distinguishing_aspect: "deficiency-notice is admitted only from SUBMITTED; issuing it against a DRAFT application returns 409 ERR_INVALID_APPLICATION_STATE and leaves the row DRAFT with deficiency_note null."
        test_recipe:
          setup:
            - "A DRAFT INITIAL application that has never been submitted."
          setup_api_calls:
            - call: "POST /dealer-board/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /dealer-board/dealers"
              payload: { legal_name: "Lakeside Aurora", dealer_type: "NEW_MOTOR_VEHICLE", county_tier: "TIER_2", site_x_km: 0, site_y_km: 0, line_make: "AURORA" }
              as: BoardAdmin
              captures: { dlr_c14_id: $.data.id }
            - call: "POST /dealer-board/license-applications"
