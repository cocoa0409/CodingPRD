            - "SolidsBatch.${batch_id}.unallocated_dry_tons == 0.000"

      - name: ceiling_exceedance_cascade_cancels_event_then_freezes_facility
        depth: 3
        trigger_transition: SolidsBatch QUAL_QUALIFIED -> QUAL_REJECTED on POST /solids-batches/{batchId}/lab-results
        grounds:
          - state_machines.SolidsBatch.QUAL_QUALIFIED_to_QUAL_REJECTED
          - state_machines.ApplicationEvent.SCHEDULED_to_CANCELLED
          - calculations.facility_posture
          - entities.SolidsBatch.fields.ceiling_exceedance_flag
          - entities.TreatmentFacility.fields.open_ceiling_exceedance_count
        distinguishing_aspect: |
          A confirmatory LEAD result of 400.0 mg/kg filed after certification withdraws the
          certification (hop 1), and that flag flip - not the lab posting itself - cancels the
          scheduled application and returns its 80.000 reserved tons (hop 2), which in turn
          drives open_ceiling_exceedance_count to 1 and freezes the plant (hop 3). The trigger
          transition differs from the completion cascade, and the LEAD limit is created after
          certification so the certification panel was legitimately complete.
        test_recipe:
          setup:
            - "The base fixture of completion_cascade_restricts_site_then_defers_sibling_event up to and including the ACTIVE agreement, but with the CADMIUM CPLR at the ordinary 39.0 kg/ha."
            - "One SCHEDULED ApplicationEvent of 80.000 dry tons on 80.0 acres for 2026-08-20 .. 2026-08-21."
            - "A LEAD PollutantLimit created AFTER the batch was certified: ceiling 300.0, monthly average 200.0, APLR 21.0, CPLR 300.0."
