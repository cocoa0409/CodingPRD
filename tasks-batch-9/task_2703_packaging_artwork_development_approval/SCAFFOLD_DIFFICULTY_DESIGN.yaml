            - call: "POST /plate-orders"
              payload: {artwork_version_id: "${v1_id}", printer_id: "${printer_id}", printer_proof_id: "${proof_id}", plate_set_count: 10, expedite: true}
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { order_3: "$.data.id" }
            - call: "POST /plate-orders/${order_2}/cancel"
              payload: {cancel_reason: "Print run deferred; plates not yet cut."}
              as: PackagingCoordinator
