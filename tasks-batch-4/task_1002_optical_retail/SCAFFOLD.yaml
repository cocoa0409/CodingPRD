scenario: "1002. Optical Retail & Online Eyewear (Warby Parker style): frame catalog & virtual try-on, prescription/PD capture & verification, home try-on kit & return, lens option/coating & pricing, insurance/FSA & out-of-network reimbursement, lab order & remake, BOPIS & exam linkage, warranty"
domain_name: optical-retail-eyewear
api_prefix: "/optical"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # Peer entities linked by explicit FK edges that cross aggregate boundaries in
  # both directions (Order -> InsuranceClaim.active_claim_id AND
  # InsuranceClaim.order_id; LabOrder -> WarrantyClaim.active_warranty_claim_id
  # AND WarrantyClaim.lab_order_id; WarrantyClaim.remake_lab_order_id closes a
  # LabOrder -> LabOrder loop). URL paths stay flat; nesting appears only for
  # FK reverse-reachability reads.

  state_machine_shape: parallel
  # Order carries two independent dimensions (payment_status x fulfillment_status)
  # that advance on different triggers. LabOrder is cyclic
  # (IN_PRODUCTION -> REMAKE_QUEUED -> IN_PRODUCTION). Prescription is branching
  # with a revert loop (SUBMITTED -> REJECTED -> SUBMITTED).

  relationship_patterns:
    - one_to_many          # Customer -> Prescription / HomeTryOnKit / Order
    - many_to_many         # HomeTryOnKit <-> Frame via TryOnKitItem
    - cross_aggregate      # Order <-> InsuranceClaim <-> InsurancePolicy ledger
    - self_referential     # WarrantyClaim.remake_lab_order_id -> LabOrder (a LabOrder begets a LabOrder)

  role_model: peer_roles
  # Customer owns prescriptions/kits/orders/warranty requests; OpticianVerifier owns
  # prescription verification; LabTechnician owns lab production; BenefitsAdmin owns
  # insurance claims; StoreAssociate owns physical store handoffs; PlatformAdmin owns
  # catalog + clock.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: InsurancePolicy
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: Insurer-side member identifier.
      - name: network
        type: enum
        source: input
        description: Whether the plan pays the retailer directly at point of sale or reimburses the member afterwards.
        constraints: "IN_NETWORK | OUT_OF_NETWORK"
      - name: frame_allowance_cents
        type: integer
        source: input
        description: Total frame-dollar allowance granted for the plan year.
        constraints: ">= 0"
      - name: frame_allowance_remaining_cents
        type: integer
        source: computed
        description: Unreserved portion of the frame allowance; initialized to frame_allowance_cents, debited when an InsuranceClaim reserves benefit, credited back when that claim goes VOID.
      - name: lens_copay_cents
        type: integer
        source: input
        description: Flat member copay applied to the lens portion of an IN_NETWORK order.
        constraints: ">= 0"
      - name: annual_max_cents
        type: integer
        source: input
        description: Ceiling on total out-of-network reimbursement per plan year.
        constraints: ">= 0"
      - name: annual_reimbursed_cents
        type: integer
        source: computed
        description: Running total of reimbursed_amount_cents across REIMBURSED claims on this policy; starts at 0.
      - name: oon_reimburse_pct
        type: number
        source: input
        description: Fraction of the eligible amount reimbursed per service line for OUT_OF_NETWORK plans.
        default: 0.75
        constraints: "0 <= x <= 1"
      - name: oon_fee_schedule
        type: object
        source: input
        description: "Map of service code -> maximum eligible cents (e.g. { \"92004\": 5000, \"V2020\": 5000 }). A code absent from the map is eligible for 0 cents."
        default: {}
      - name: plan_year_start
        type: datetime
        source: input
        description: ISO 8601 UTC start of the plan year.

  - name: Store
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Retail location name.
      - name: status
        type: enum
        source: input
        description: Whether the store can accept BOPIS handoffs and exams.
        default: OPEN
        constraints: "OPEN | CLOSED"
      - name: exam_chairs
        type: integer
        source: input
        description: Number of simultaneous exam chairs; caps concurrent ExamAppointment intervals.
        constraints: ">= 1"
      - name: buffer_minutes
        type: integer
        source: input
        description: Turnover buffer appended AFTER each exam interval for overlap arithmetic.
        default: 10
        constraints: ">= 0"
      - name: pickup_capacity_per_day
        type: integer
        source: input
        description: Informational BOPIS throughput figure; not enforced.
        default: 50

  - name: Frame
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: Catalog SKU, unique.
      - name: name
        type: string
        source: input
        description: Frame model name.
      - name: brand
        type: string
        source: input
        description: Brand name.
      - name: price_cents
        type: integer
        source: input
        description: Retail frame price before any discount or benefit.
        constraints: ">= 0"
      - name: status
        type: enum
        source: input
        description: ACTIVE frames may be ordered and tried on; DISCONTINUED frames may not be ordered.
        default: ACTIVE
        constraints: "ACTIVE | DISCONTINUED"
      - name: tryon_stock
        type: integer
        source: input
        description: Total physical sample units of this frame held for home try-on.
        constraints: ">= 0"
      - name: tryon_available
        type: integer
        source: computed
        description: tryon_stock minus the number of TryOnKitItem rows on this frame whose outcome is PENDING; initialized to tryon_stock.
      - name: min_pd_mm
        type: number
        source: input
        description: Minimum pupillary distance (mm) the frame geometry can glaze.
      - name: max_pd_mm
        type: number
        source: input
        description: Maximum pupillary distance (mm) the frame geometry can glaze.

  - name: LensOption
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Short option code, unique (e.g. M167, AR, BLUE, PHOTO).
      - name: category
        type: enum
        source: input
        description: MATERIAL options carry a refractive index; COATING options are add-ons.
        constraints: "MATERIAL | COATING"
      - name: base_price_cents
        type: integer
        source: input
        description: List price of the option before coating volume discount.
        constraints: ">= 0"
      - name: material_index
        type: number
        source: input
        description: "Refractive index for MATERIAL options (1.50 / 1.60 / 1.67 / 1.74); null for COATING options."
        default: null
      - name: incompatible_with
        type: array
        source: input
        description: Array of LensOption.code values this option may not be combined with on the same Order.
        default: []
      - name: status
        type: enum
        source: input
        description: RETIRED options may not be selected on a new Order.
        default: ACTIVE
        constraints: "ACTIVE | RETIRED"

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Customer name.
      - name: email
        type: string
        source: input
        description: Contact email, unique.
      - name: dob
        type: datetime
        source: input
        description: Date of birth, ISO 8601 UTC.
      - name: insurance_policy_id
        type: string
        source: input
        description: "FK -> InsurancePolicy.id; nullable — customer may be self-pay."
        default: null
      - name: fsa_balance_cents
        type: integer
        source: input
        description: Flexible-spending-account balance available to apply against orders.
        default: 0
        constraints: ">= 0"
      - name: lifetime_kit_count
        type: integer
        source: computed
        description: Count of HomeTryOnKit rows for this customer whose status is RETURNED or OVERDUE; drives the risk-score variant selection.
      - name: return_risk_score
        type: integer
        source: computed
        description: Integer 0-100 produced by calculations.customer_return_risk_score; recomputed on every kit return and on every kit OVERDUE transition; starts at 0.

  - name: Prescription
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id"
      - name: od_sphere
        type: number
        source: input
        description: Right-eye sphere power in diopters.
      - name: od_cylinder
        type: number
        source: input
        description: Right-eye cylinder power in diopters.
      - name: os_sphere
        type: number
        source: input
        description: Left-eye sphere power in diopters.
      - name: os_cylinder
        type: number
        source: input
        description: Left-eye cylinder power in diopters.
      - name: pd_mm
        type: number
        source: input
        description: Pupillary distance in millimetres.
        constraints: "45.0 <= pd_mm <= 80.0"
      - name: prism_diopters
        type: number
        source: input
        description: Prism correction in prism diopters; >= 0.50 triggers the prism surcharge.
        default: 0.0
        constraints: ">= 0"
      - name: issued_at
        type: datetime
        source: input
        description: ISO 8601 UTC date the prescription was written.
      - name: expires_at
        type: datetime
        source: input
        description: ISO 8601 UTC expiry; must be strictly after issued_at.
      - name: status
        type: enum
        source: system
        description: Verification lifecycle state.
        default: SUBMITTED
        constraints: "SUBMITTED | VERIFIED | REJECTED | EXPIRED"
      - name: verified_by
        type: string
        source: system
        description: X-User-ID of the OpticianVerifier that verified it; null until verified.
        default: null
      - name: rejection_reason
        type: string
        source: system
        description: Free text supplied on rejection; null otherwise.
        default: null
      - name: resubmit_count
        type: integer
        source: system
        description: Number of times this prescription has been resubmitted after rejection.
        default: 0

  - name: HomeTryOnKit
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id"
      - name: ship_date
        type: datetime
        source: input
        description: ISO 8601 UTC start of the frame-hold interval (inclusive).
      - name: due_date
        type: datetime
        source: input
        description: ISO 8601 UTC end of the frame-hold interval (inclusive); must be strictly after ship_date.
      - name: status
        type: enum
        source: system
        description: Kit lifecycle state.
        default: REQUESTED
        constraints: "REQUESTED | SHIPPED | OVERDUE | RETURNED"
      - name: was_overdue
        type: boolean
        source: system
        description: Latched true the moment the kit enters OVERDUE; survives the later return.
        default: false
      - name: item_count
        type: integer
        source: computed
        description: Number of TryOnKitItem rows whose kit_id is this kit.
      - name: kept_count
        type: integer
        source: computed
        description: Number of TryOnKitItem rows on this kit whose outcome is KEPT; 0 until the kit is returned.
      - name: late_fee_cents
        type: integer
        source: computed
        description: Produced by calculations.kit_late_fee on return; 0 for on-time returns.
        default: 0

  - name: TryOnKitItem
    parent: HomeTryOnKit
    common_fields: false
    fields:
      - name: kit_id
        type: string
        source: system
        description: "FK -> HomeTryOnKit.id"
      - name: frame_id
        type: string
        source: system
        description: "FK -> Frame.id"
      - name: outcome
        type: enum
        source: system
        description: PENDING while the sample is held; resolved to KEPT (customer intends to buy) or RETURNED on kit return. Both resolutions release the physical hold.
        default: PENDING
        constraints: "PENDING | KEPT | RETURNED"

  - name: ExamAppointment
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id"
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id"
      - name: start_at
        type: datetime
        source: input
        description: ISO 8601 UTC exam start (interval is half-open [start_at, end_at)).
      - name: end_at
        type: datetime
        source: input
        description: ISO 8601 UTC exam end; must be strictly after start_at.
      - name: status
        type: enum
        source: system
        description: Appointment lifecycle state.
        default: BOOKED
        constraints: "BOOKED | COMPLETED"
      - name: resulting_prescription_id
        type: string
        source: system
        description: "FK -> Prescription.id; set when the appointment is completed."
        default: null

  - name: Order
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id"
      - name: prescription_id
        type: string
        source: input
        description: "FK -> Prescription.id"
      - name: frame_id
        type: string
        source: input
        description: "FK -> Frame.id"
      - name: material_option_id
        type: string
        source: input
        description: "FK -> LensOption.id; must be a MATERIAL-category option."
      - name: coating_option_ids
        type: array
        source: input
        description: Array of LensOption.id values, each of COATING category; may be empty.
        default: []
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; required when delivery_method is BOPIS, otherwise null."
        default: null
      - name: exam_appointment_id
        type: string
        source: input
        description: "FK -> ExamAppointment.id; optional linkage to the exam that produced the prescription."
        default: null
      - name: active_claim_id
        type: string
        source: system
        description: "FK -> InsuranceClaim.id; the single non-VOID claim currently attached to this order."
        default: null
      - name: delivery_method
        type: enum
        source: input
        description: SHIP mails the finished glasses; BOPIS routes them to store_id for pickup.
        constraints: "SHIP | BOPIS"
      - name: fulfillment_status
        type: enum
        source: system
        description: Fulfillment dimension of the order's parallel state machine.
        default: DRAFT
        constraints: "DRAFT | CONFIRMED | IN_LAB | READY_FOR_PICKUP | SHIPPED | DELIVERED | CANCELLED"
      - name: payment_status
        type: enum
        source: system
        description: Payment dimension of the order's parallel state machine; advances independently of fulfillment_status.
        default: UNPAID
        constraints: "UNPAID | AUTHORIZED | CAPTURED | REFUNDED"
      - name: lens_upcharge_cents
        type: integer
        source: computed
        description: Output of calculations.lens_upcharge; recomputed at POST /orders only.
      - name: subtotal_cents
        type: integer
        source: computed
        description: frame.price_cents + lens_upcharge_cents.
      - name: discount_cents
        type: integer
        source: computed
        description: Volume discount keyed on subtotal_cents tier.
      - name: benefit_frame_cents
        type: integer
        source: computed
        description: Frame-allowance portion of the applied insurance benefit; 0 for self-pay and OUT_OF_NETWORK.
      - name: benefit_lens_cents
        type: integer
        source: computed
        description: Lens portion of the applied insurance benefit; 0 for self-pay and OUT_OF_NETWORK.
      - name: benefit_applied_cents
        type: integer
        source: computed
        description: benefit_frame_cents + benefit_lens_cents under the ESTIMATED variant; capped at the insurer's allowed_amount_cents under the FINAL variant.
      - name: fsa_applied_cents
        type: integer
        source: computed
        description: FSA dollars applied at confirm; never recomputed by the FINAL variant.
        default: 0
      - name: customer_due_cents
        type: integer
        source: computed
        description: subtotal_cents - discount_cents - benefit_applied_cents - fsa_applied_cents.
      - name: quote_variant
        type: enum
        source: system
        description: Which variant of calculations.order_price_quote produced the current money fields.
        default: ESTIMATED
        constraints: "ESTIMATED | FINAL"

  - name: LabOrder
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: system
        description: "FK -> Order.id"
      - name: shipped_to_store_id
        type: string
        source: system
        description: "FK -> Store.id; set on ship when the order's delivery_method is BOPIS, else null."
        default: null
      - name: active_warranty_claim_id
        type: string
        source: system
        description: "FK -> WarrantyClaim.id; the single non-SUPERSEDED warranty claim currently attached to this lab order."
        default: null
      - name: status
        type: enum
        source: system
        description: Production lifecycle state; cycles through REMAKE_QUEUED on QC failure.
        default: QUEUED
        constraints: "QUEUED | IN_PRODUCTION | REMAKE_QUEUED | QC_PASSED | SHIPPED | DELIVERED | CANCELLED"
      - name: remake_count
        type: integer
        source: system
        description: Number of QC failures so far; a third failure is refused.
        default: 0
      - name: qc_failure_reason
        type: string
        source: system
        description: Reason recorded on the most recent QC failure.
        default: null
      - name: is_remake
        type: boolean
        source: system
        description: True when this lab order was created by an approved WarrantyClaim rather than by an order confirmation.
        default: false
      - name: delivered_at
        type: datetime
        source: system
        description: Logical-clock timestamp at which the lab order entered DELIVERED; anchors the 365-day warranty window.
        default: null

  - name: InsuranceClaim
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id"
      - name: policy_id
        type: string
        source: system
        description: "FK -> InsurancePolicy.id; copied from the order's customer at claim creation."
      - name: service_lines
        type: array
        source: input
        description: "Array of objects { code: string, billed_cents: integer }, evaluated in array order (index ascending); empty for the claim auto-created at order confirmation."
        default: []
      - name: status
        type: enum
        source: system
        description: Adjudication lifecycle state.
        default: SUBMITTED
        constraints: "SUBMITTED | ADJUDICATED_APPROVED | ADJUDICATED_DENIED | REIMBURSED | VOID"
      - name: reserved_frame_benefit_cents
        type: integer
        source: computed
        description: Frame-allowance dollars this claim holds against its policy; equals the order's benefit_frame_cents at claim creation, released when the claim goes VOID.
      - name: allowed_amount_cents
        type: integer
        source: input
        description: Insurer-declared allowed amount supplied at adjudication; drives the FINAL order quote for IN_NETWORK policies.
        default: null
      - name: approved_amount_cents
        type: integer
        source: computed
        description: min(order.benefit_applied_cents at the ESTIMATED variant, allowed_amount_cents) for IN_NETWORK; 0 for OUT_OF_NETWORK.
        default: 0
      - name: reimbursed_amount_cents
        type: integer
        source: computed
        description: Output of calculations.oon_reimbursement; 0 until the claim is REIMBURSED.
        default: 0
      - name: denial_reason
        type: string
        source: input
        description: Free text supplied on denial.
        default: null

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - name: lab_order_id
        type: string
        source: input
        description: "FK -> LabOrder.id; the delivered lab order the claim is filed against."
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id"
      - name: remake_lab_order_id
        type: string
        source: system
        description: "FK -> LabOrder.id; the replacement lab order minted on approval."
        default: null
      - name: reason
        type: enum
        source: input
        description: Cause of the warranty request; drives the remake liability charge.
        constraints: "MANUFACTURER_DEFECT | CUSTOMER_DAMAGE | RX_CHANGE"
      - name: status
        type: enum
        source: system
        description: Warranty lifecycle state.
        default: OPEN
        constraints: "OPEN | APPROVED | DENIED | SUPERSEDED"
      - name: customer_charge_cents
        type: integer
        source: computed
        description: Output of calculations.remake_liability; computed at claim creation.
      - name: denial_reason
        type: string
        source: input
        description: Free text supplied on denial.
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  # --- Prescription: branching with a revert loop (REJECTED -> SUBMITTED) ---
  - entity: Prescription
    initial_state: SUBMITTED
    terminal_states: [EXPIRED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /optical/prescriptions/{id}/verify with decision=VERIFIED"
        actor: OpticianVerifier
        preconditions:
          - "prescription.status == SUBMITTED"
          - "prescription.expires_at > logical clock now (else ERR_PRESCRIPTION_EXPIRED)"
        side_effects:
          - "prescription.verified_by = X-User-ID"
          - "prescription.rejection_reason = null"
          - "increments Prescription.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /optical/prescriptions/{id}/verify with decision=REJECTED"
        actor: OpticianVerifier
        preconditions:
          - "prescription.status == SUBMITTED"
          - "rejection_reason present (else ERR_INVALID_REQUEST)"
        side_effects:
          - "prescription.rejection_reason = payload.rejection_reason"
          - "increments Prescription.version by 1"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /optical/prescriptions/{id}/resubmit"
        actor: Customer
        preconditions:
          - "prescription.status == REJECTED"
          - "acting Customer owns the prescription (prescription.customer_id == X-User-ID)"
          - "payload.pd_mm within [45.0, 80.0] (else ERR_PD_OUT_OF_RANGE)"
        side_effects:
          - "all Rx measurement fields overwritten from payload"
          - "prescription.resubmit_count += 1"
          - "prescription.rejection_reason = null"
          - "increments Prescription.version by 1"
        note: "Revert loop — a prescription may cycle REJECTED -> SUBMITTED -> REJECTED indefinitely."
      - from: VERIFIED
        to: EXPIRED
        trigger: "system event: POST /optical/_clock/set_current_utc advances the clock to a time >= prescription.expires_at"
        actor: system
        preconditions:
          - "prescription.status == VERIFIED"
          - "new clock time >= prescription.expires_at"
        side_effects:
          - "increments Prescription.version by 1"
        note: "EXPIRED is terminal — no resubmit, no verify. Orders in DRAFT referencing it can no longer be confirmed."

  # --- Order: PARALLEL dimensions (fulfillment_status x payment_status) ---
  - entity: Order
    initial_state: "fulfillment_status=DRAFT, payment_status=UNPAID"
    terminal_states: ["fulfillment_status=DELIVERED", "fulfillment_status=CANCELLED"]
    transitions:
      - from: "fulfillment_status=DRAFT"
        to: "fulfillment_status=CONFIRMED; payment_status=AUTHORIZED"
        trigger: "POST /optical/orders/{id}/confirm"
        actor: Customer
        preconditions:
          - "order.fulfillment_status == DRAFT"
          - "prescription.status == VERIFIED (else ERR_PRESCRIPTION_NOT_VERIFIED)"
          - "prescription.expires_at > clock now (else ERR_PRESCRIPTION_EXPIRED)"
          - "if order.delivery_method == BOPIS: store.status == OPEN (else ERR_STORE_CLOSED)"
          - "order.benefit_frame_cents <= policy.frame_allowance_remaining_cents (else ERR_INSUFFICIENT_BENEFIT)"
          - "payload.fsa_amount_cents <= customer.fsa_balance_cents (else ERR_INSUFFICIENT_FSA)"
        side_effects:
          - "order.fsa_applied_cents = min(payload.fsa_amount_cents, customer.fsa_balance_cents, customer_due_pre_fsa) per calculations.order_price_quote"
          - "customer.fsa_balance_cents -= order.fsa_applied_cents"
          - "order.customer_due_cents recomputed under the ESTIMATED variant of calculations.order_price_quote"
          - "CASCADE L2: a LabOrder is created for this order with status QUEUED, remake_count 0, is_remake false"
          - "CASCADE L3 (caused by L2): if customer.insurance_policy_id is not null, an InsuranceClaim is created with status SUBMITTED, policy_id = customer.insurance_policy_id, service_lines [], reserved_frame_benefit_cents = order.benefit_frame_cents; order.active_claim_id is set to it"
          - "CASCADE L4 (caused by L3): policy.frame_allowance_remaining_cents -= claim.reserved_frame_benefit_cents"
          - "increments Order.version by 1"
      - from: "fulfillment_status=CONFIRMED"
        to: "fulfillment_status=IN_LAB"
        trigger: "system event: the order's LabOrder enters IN_PRODUCTION via POST /optical/lab-orders/{id}/start"
        actor: system
        preconditions:
          - "order.fulfillment_status == CONFIRMED"
        side_effects:
          - "increments Order.version by 1"
        note: "Bubble-up: the child LabOrder's transition drives the parent Order's fulfillment dimension."
      - from: "fulfillment_status=IN_LAB"
        to: "fulfillment_status=READY_FOR_PICKUP (delivery_method BOPIS) | fulfillment_status=SHIPPED (delivery_method SHIP); payment_status=CAPTURED"
        trigger: "system event: the order's LabOrder enters SHIPPED via POST /optical/lab-orders/{id}/ship"
        actor: system
        preconditions:
          - "order.fulfillment_status == IN_LAB"
          - "order.payment_status == AUTHORIZED"
        side_effects:
          - "order.payment_status = CAPTURED (payment dimension advances on the fulfillment trigger but is tracked independently)"
          - "increments Order.version by 1"
      - from: "fulfillment_status=READY_FOR_PICKUP | fulfillment_status=SHIPPED"
        to: "fulfillment_status=DELIVERED"
        trigger: "system event: the order's LabOrder enters DELIVERED via POST /optical/lab-orders/{id}/deliver"
        actor: system
        preconditions:
          - "order.fulfillment_status IN {READY_FOR_PICKUP, SHIPPED}"
        side_effects:
          - "increments Order.version by 1"
      - from: "fulfillment_status IN {DRAFT, CONFIRMED, IN_LAB}"
        to: "fulfillment_status=CANCELLED; payment_status=REFUNDED when it was AUTHORIZED"
        trigger: "POST /optical/orders/{id}/cancel"
        actor: Customer | PlatformAdmin
        preconditions:
          - "order.fulfillment_status IN {DRAFT, CONFIRMED, IN_LAB} (else ERR_INVALID_STATE)"
          - "acting Customer owns the order when the actor role is Customer"
        side_effects:
          - "CASCADE L1: order.fulfillment_status = CANCELLED; if order.payment_status == AUTHORIZED it becomes REFUNDED and customer.fsa_balance_cents += order.fsa_applied_cents (payment dimension moves on its own axis; a payment_status of UNPAID stays UNPAID)"
          - "CASCADE L2 (caused by L1): the order's LabOrder, when its status IN {QUEUED, IN_PRODUCTION, REMAKE_QUEUED, QC_PASSED}, transitions to CANCELLED"
          - "CASCADE L3 (caused by L2): the LabOrder cancellation voids the order's active_claim_id InsuranceClaim when that claim's status != VOID -> claim.status = VOID"
          - "CASCADE L4 (caused by L3): the claim going VOID credits its policy — policy.frame_allowance_remaining_cents += claim.reserved_frame_benefit_cents; order.active_claim_id = null"
          - "increments Order.version by 1"

  # --- LabOrder: CYCLIC (IN_PRODUCTION -> REMAKE_QUEUED -> IN_PRODUCTION) ---
  - entity: LabOrder
    initial_state: QUEUED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: QUEUED
        to: IN_PRODUCTION
        trigger: "POST /optical/lab-orders/{id}/start"
        actor: LabTechnician
        preconditions:
          - "lab_order.status == QUEUED"
        side_effects:
          - "the parent Order's fulfillment_status advances CONFIRMED -> IN_LAB"
          - "increments LabOrder.version by 1"
      - from: REMAKE_QUEUED
        to: IN_PRODUCTION
        trigger: "POST /optical/lab-orders/{id}/start"
        actor: LabTechnician
        preconditions:
          - "lab_order.status == REMAKE_QUEUED"
        side_effects:
          - "increments LabOrder.version by 1"
        note: "Closes the production cycle — the same lab order re-enters IN_PRODUCTION after a QC failure."
      - from: IN_PRODUCTION
        to: QC_PASSED
        trigger: "POST /optical/lab-orders/{id}/qc with result=PASS"
        actor: LabTechnician
        preconditions:
          - "lab_order.status == IN_PRODUCTION"
        side_effects:
          - "lab_order.qc_failure_reason = null"
          - "increments LabOrder.version by 1"
      - from: IN_PRODUCTION
        to: REMAKE_QUEUED
        trigger: "POST /optical/lab-orders/{id}/qc with result=FAIL"
        actor: LabTechnician
        preconditions:
          - "lab_order.status == IN_PRODUCTION"
          - "lab_order.remake_count < 2 (else ERR_REMAKE_LIMIT_EXCEEDED)"
          - "failure_reason present (else ERR_INVALID_REQUEST)"
        side_effects:
          - "lab_order.remake_count += 1"
          - "lab_order.qc_failure_reason = payload.failure_reason"
          - "increments LabOrder.version by 1"
      - from: QC_PASSED
        to: SHIPPED
        trigger: "POST /optical/lab-orders/{id}/ship"
        actor: LabTechnician
        preconditions:
          - "lab_order.status == QC_PASSED"
          - "when order.delivery_method == BOPIS: order.store_id store has status == OPEN (else ERR_STORE_CLOSED)"
        side_effects:
          - "lab_order.shipped_to_store_id = order.store_id when order.delivery_method == BOPIS, else null"
          - "the parent Order's fulfillment_status advances IN_LAB -> READY_FOR_PICKUP (BOPIS) or IN_LAB -> SHIPPED (SHIP), and its payment_status advances AUTHORIZED -> CAPTURED"
          - "increments LabOrder.version by 1"
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /optical/lab-orders/{id}/deliver"
        actor: StoreAssociate
        preconditions:
          - "lab_order.status == SHIPPED"
        side_effects:
          - "lab_order.delivered_at = logical clock now"
          - "the parent Order's fulfillment_status advances to DELIVERED"
          - "increments LabOrder.version by 1"
      - from: "QUEUED | IN_PRODUCTION | REMAKE_QUEUED | QC_PASSED"
        to: CANCELLED
        trigger: "system event: the parent Order is cancelled via POST /optical/orders/{id}/cancel"
        actor: system
        preconditions:
          - "lab_order.status IN {QUEUED, IN_PRODUCTION, REMAKE_QUEUED, QC_PASSED}"
        side_effects:
          - "voids the parent Order's active InsuranceClaim (see the Order cancel cascade, link L3)"
          - "increments LabOrder.version by 1"

  # --- HomeTryOnKit: branch with rejoin (SHIPPED -> OVERDUE -> RETURNED) ---
  - entity: HomeTryOnKit
    initial_state: REQUESTED
    terminal_states: [RETURNED]
    transitions:
      - from: REQUESTED
        to: SHIPPED
        trigger: "POST /optical/home-try-on-kits/{id}/ship"
        actor: StoreAssociate
        preconditions:
          - "kit.status == REQUESTED"
        side_effects:
          - "increments HomeTryOnKit.version by 1"
      - from: SHIPPED
        to: OVERDUE
        trigger: "system event: POST /optical/_clock/set_current_utc advances the clock past kit.due_date"
        actor: system
        preconditions:
          - "kit.status == SHIPPED"
          - "new clock time > kit.due_date"
        side_effects:
          - "kit.was_overdue = true"
          - "customer.return_risk_score recomputed via calculations.customer_return_risk_score"
          - "increments HomeTryOnKit.version by 1"
      - from: "SHIPPED | OVERDUE"
        to: RETURNED
        trigger: "POST /optical/home-try-on-kits/{id}/return"
        actor: Customer
        preconditions:
          - "kit.status IN {SHIPPED, OVERDUE} (else ERR_INVALID_STATE)"
          - "acting Customer owns the kit (kit.customer_id == X-User-ID)"
          - "every id in payload.kept_frame_ids is the frame_id of a TryOnKitItem on this kit (else ERR_FRAME_NOT_FOUND)"
        side_effects:
          - "CASCADE L1: kit.status = RETURNED; kit.late_fee_cents = calculations.kit_late_fee"
          - "CASCADE L2 (caused by L1): every TryOnKitItem on this kit whose outcome is PENDING resolves — outcome = KEPT when its frame_id is in payload.kept_frame_ids, otherwise outcome = RETURNED"
          - "CASCADE L3 (caused by L2): every Frame referenced by a resolved item has tryon_available += 1 (both KEPT and RETURNED release the physical sample hold)"
          - "customer.lifetime_kit_count and customer.return_risk_score recomputed via calculations.customer_return_risk_score"
          - "increments HomeTryOnKit.version by 1"

  # --- InsuranceClaim: branching adjudication with a VOID compensation edge ---
  - entity: InsuranceClaim
    initial_state: SUBMITTED
    terminal_states: [ADJUDICATED_DENIED, REIMBURSED, VOID]
    transitions:
      - from: SUBMITTED
        to: ADJUDICATED_APPROVED
        trigger: "POST /optical/insurance-claims/{id}/adjudicate with decision=APPROVED"
        actor: BenefitsAdmin
        preconditions:
          - "claim.status == SUBMITTED"
          - "allowed_amount_cents present and >= 0 (else ERR_INVALID_REQUEST)"
        side_effects:
          - "claim.allowed_amount_cents = payload.allowed_amount_cents"
          - "when policy.network == IN_NETWORK: claim.approved_amount_cents = min(order.benefit_applied_cents, allowed_amount_cents); the parent Order is re-quoted under the FINAL variant of calculations.order_price_quote (order.benefit_applied_cents, order.customer_due_cents, order.quote_variant = FINAL)"
          - "when policy.network == OUT_OF_NETWORK: claim.approved_amount_cents = 0 and the order is not re-quoted"
          - "increments InsuranceClaim.version by 1"
      - from: SUBMITTED
        to: ADJUDICATED_DENIED
        trigger: "POST /optical/insurance-claims/{id}/adjudicate with decision=DENIED"
        actor: BenefitsAdmin
        preconditions:
          - "claim.status == SUBMITTED"
          - "denial_reason present (else ERR_INVALID_REQUEST)"
        side_effects:
          - "claim.denial_reason = payload.denial_reason"
          - "increments InsuranceClaim.version by 1"
        note: "The reserved frame benefit stays reserved on a denial; only VOID releases it."
      - from: ADJUDICATED_APPROVED
        to: REIMBURSED
        trigger: "POST /optical/insurance-claims/{id}/reimburse"
        actor: BenefitsAdmin
        preconditions:
          - "claim.status == ADJUDICATED_APPROVED"
          - "policy.network == OUT_OF_NETWORK (else ERR_INVALID_STATE)"
          - "policy.annual_max_cents - policy.annual_reimbursed_cents > 0 (else ERR_ANNUAL_MAX_EXCEEDED)"
        side_effects:
          - "claim.reimbursed_amount_cents = calculations.oon_reimbursement"
          - "policy.annual_reimbursed_cents += claim.reimbursed_amount_cents"
          - "increments InsuranceClaim.version by 1"
      - from: "SUBMITTED | ADJUDICATED_APPROVED | ADJUDICATED_DENIED"
        to: VOID
        trigger: "system event: the parent Order is cancelled (POST /optical/orders/{id}/cancel), or a superseding claim is created (POST /optical/insurance-claims)"
        actor: system
        preconditions:
          - "claim.status IN {SUBMITTED, ADJUDICATED_APPROVED, ADJUDICATED_DENIED}"
        side_effects:
          - "policy.frame_allowance_remaining_cents += claim.reserved_frame_benefit_cents"
          - "order.active_claim_id is cleared (order cancel) or repointed at the superseding claim"
          - "increments InsuranceClaim.version by 1"
        note: "Compensating edge — restores the exact benefit dollars the claim reserved."

  # --- WarrantyClaim: branching approval with a SUPERSEDED edge ---
  - entity: WarrantyClaim
    initial_state: OPEN
    terminal_states: [APPROVED, DENIED, SUPERSEDED]
    transitions:
      - from: OPEN
        to: APPROVED
        trigger: "POST /optical/warranty-claims/{id}/decide with decision=APPROVED"
        actor: StoreAssociate
        preconditions:
          - "warranty_claim.status == OPEN"
        side_effects:
          - "a fresh LabOrder is created for the same order_id with status QUEUED, remake_count 0, is_remake true"
          - "warranty_claim.remake_lab_order_id = the new LabOrder's id"
          - "increments WarrantyClaim.version by 1"
      - from: OPEN
        to: DENIED
        trigger: "POST /optical/warranty-claims/{id}/decide with decision=DENIED"
        actor: StoreAssociate
        preconditions:
          - "warranty_claim.status == OPEN"
          - "denial_reason present (else ERR_INVALID_REQUEST)"
        side_effects:
          - "warranty_claim.denial_reason = payload.denial_reason"
          - "increments WarrantyClaim.version by 1"
      - from: OPEN
        to: SUPERSEDED
        trigger: "system event: a new WarrantyClaim is created against the same LabOrder via POST /optical/insurance-claims's sibling POST /optical/warranty-claims"
        actor: system
        preconditions:
          - "warranty_claim.status == OPEN"
        side_effects:
          - "lab_order.active_warranty_claim_id is repointed at the new claim"
          - "increments WarrantyClaim.version by 1"

  # --- ExamAppointment: linear, links exam to prescription ---
  - entity: ExamAppointment
    initial_state: BOOKED
    terminal_states: [COMPLETED]
    transitions:
      - from: BOOKED
        to: COMPLETED
        trigger: "POST /optical/exam-appointments/{id}/complete"
        actor: StoreAssociate
        preconditions:
          - "appointment.status == BOOKED"
          - "the referenced Prescription exists and its customer_id == appointment.customer_id (else ERR_PRESCRIPTION_OWNER_MISMATCH)"
        side_effects:
          - "appointment.resulting_prescription_id = payload.prescription_id"
          - "increments ExamAppointment.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules  (OCC on the parent's `version` — the only mechanism)
# =============================================================================
concurrency_rules:

  - rule_id: claim-create-stale-order
    parent_entity: Order
    write_endpoint: "POST /optical/insurance-claims"
    occ_field: "expected_order_version"
    description: |
      Creating an InsuranceClaim against an Order whose version has advanced
      since the client last observed it is rejected. A new claim legitimately
      supersedes the order's existing active claim (voiding it and re-reserving
      the frame benefit), so the write cannot be resolved by a state
      precondition alone — the stale-version check is what prevents a claim
      being filed against an order whose money fields the client has not seen.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

  - rule_id: warranty-create-stale-lab-order
    parent_entity: LabOrder
    write_endpoint: "POST /optical/warranty-claims"
    occ_field: "expected_lab_order_version"
    description: |
      Filing a WarrantyClaim against a LabOrder whose version has advanced since
      the client last observed it is rejected. A new warranty claim legitimately
      supersedes the lab order's existing OPEN claim, so a second sequential
      filing would otherwise succeed under the product's own supersede
      semantics; the stale-version check pins it to the observed lab order.
    error_id: ERR_STALE_LAB_ORDER_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: lens_upcharge
    trigger: "POST /optical/orders — computed once at order creation and frozen on Order.lens_upcharge_cents"
    algorithm: tiered_pricing
    formula: |
      # All money in integer cents. Evaluation order is pinned top to bottom.
      rx_max_sphere = max(abs(rx.od_sphere), abs(rx.os_sphere))
      rx_max_cyl    = max(abs(rx.od_cylinder), abs(rx.os_cylinder))
      rx_power      = rx_max_sphere + 0.5 * rx_max_cyl

      required_index_tier =
          1.50  if rx_power < 4.00
          1.60  if 4.00 <= rx_power < 6.00
          1.67  if 6.00 <= rx_power < 8.00
          1.74  if rx_power >= 8.00
      # material.material_index < required_index_tier -> ERR_LENS_INCOMPATIBLE_WITH_RX
      # (validation priority 50, checked before the money is computed)

      material_price   = material.base_price_cents
      coating_total    = sum(c.base_price_cents for c in coatings)          # array order irrelevant, pure sum
      coating_discount = floor(coating_total * COATING_BUNDLE_PCT) if len(coatings) >= 2 else 0
      prism_surcharge  = PRISM_SURCHARGE_CENTS if rx.prism_diopters >= 0.50 else 0
      high_power_surcharge = min(HIGH_POWER_CAP_CENTS,
                                 max(0, round_half_up((rx_power - 6.00) * HIGH_POWER_RATE_CENTS_PER_DIOPTER)))

      lens_upcharge_cents = material_price + coating_total - coating_discount
                          + prism_surcharge + high_power_surcharge
    input_set: "The Order's material_option_id (LensOption, category MATERIAL, status ACTIVE) plus every LensOption in coating_option_ids (category COATING, status ACTIVE), and the referenced Prescription's measurement fields. RETIRED options are rejected at validation priority 5, never included."
    constants:
      COATING_BUNDLE_PCT: 0.15
      PRISM_SURCHARGE_CENTS: 4500
      HIGH_POWER_RATE_CENTS_PER_DIOPTER: 1000
      HIGH_POWER_CAP_CENTS: 6000
    precision: "Integer cents. coating_discount uses floor(); high_power_surcharge uses round_half_up() on the diopter product before min/max clamping."
    variants: []

  - name: order_price_quote
    trigger: "POST /optical/orders (ESTIMATED), POST /optical/orders/{id}/confirm (ESTIMATED, re-run against current policy remaining and FSA), POST /optical/insurance-claims/{id}/adjudicate with decision=APPROVED on an IN_NETWORK policy (FINAL)"
    algorithm: waterfall_allocation
    formula: |
      # Evaluation order is PINNED and non-negotiable — the discount tier is keyed on
      # subtotal_cents, the benefit waterfall is keyed on the post-discount amounts,
      # and FSA is applied last against whatever the customer still owes.
      subtotal_cents = frame.price_cents + order.lens_upcharge_cents

      discount_pct = 0.00 if subtotal_cents < DISCOUNT_TIER_1_CENTS
                     0.10 if DISCOUNT_TIER_1_CENTS <= subtotal_cents < DISCOUNT_TIER_2_CENTS
                     0.15 if subtotal_cents >= DISCOUNT_TIER_2_CENTS
      discount_cents = floor(subtotal_cents * discount_pct)
      net_cents      = subtotal_cents - discount_cents

      # The frame line carries its own proportional share of the discount so the
      # frame allowance is applied to the discounted frame, not the list frame.
      frame_after_discount = frame.price_cents - floor(frame.price_cents * discount_pct)
      lens_after_discount  = net_cents - frame_after_discount

      if customer.insurance_policy_id is null or policy.network == OUT_OF_NETWORK:
          benefit_frame_cents = 0
          benefit_lens_cents  = 0
      else:                                   # IN_NETWORK waterfall, bucket order pinned
          benefit_frame_cents = min(policy.frame_allowance_remaining_cents, frame_after_discount)   # bucket 1
          benefit_lens_cents  = max(0, lens_after_discount - policy.lens_copay_cents)               # bucket 2

      benefit_applied_cents = benefit_frame_cents + benefit_lens_cents      # ESTIMATED variant
      customer_due_pre_fsa  = net_cents - benefit_applied_cents

      # FSA bucket — applied only at confirm; fsa_amount_cents defaults to 0 when omitted.
      fsa_applied_cents  = min(fsa_amount_cents, customer.fsa_balance_cents, customer_due_pre_fsa)
      customer_due_cents = customer_due_pre_fsa - fsa_applied_cents
    input_set: "The Order's frame, its frozen lens_upcharge_cents, the Customer's insurance_policy_id + fsa_balance_cents, and — for IN_NETWORK plans — the policy's frame_allowance_remaining_cents AT THE MOMENT OF THE CALL (i.e. net of every non-VOID InsuranceClaim's reserved_frame_benefit_cents) and lens_copay_cents."
    constants:
      DISCOUNT_TIER_1_CENTS: 25000
      DISCOUNT_TIER_2_CENTS: 50000
    precision: "Integer cents; every percentage product uses floor()."
    variants:
      - name: ESTIMATED
        when: "At POST /optical/orders and at POST /optical/orders/{id}/confirm — before the insurer has adjudicated the claim."
        difference: "benefit_applied_cents = benefit_frame_cents + benefit_lens_cents, i.e. the retailer's own reading of the plan's allowance and copay. Order.quote_variant = ESTIMATED."
      - name: FINAL
        when: "At POST /optical/insurance-claims/{id}/adjudicate with decision=APPROVED, when the policy network is IN_NETWORK and the insurer supplied allowed_amount_cents."
        difference: "benefit_applied_cents = min(ESTIMATED benefit_applied_cents, claim.allowed_amount_cents) — the insurer's allowed amount caps the retailer's estimate. subtotal_cents, discount_cents, benefit_frame_cents, benefit_lens_cents and fsa_applied_cents are NOT recomputed; customer_due_cents = net_cents - benefit_applied_cents(FINAL) - fsa_applied_cents. Order.quote_variant = FINAL. Identical order data therefore yields a different customer_due_cents than the ESTIMATED variant whenever allowed_amount_cents < ESTIMATED benefit_applied_cents."

  - name: oon_reimbursement
    trigger: "POST /optical/insurance-claims/{id}/reimburse (OUT_OF_NETWORK policies only)"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED: round EACH service line to whole cents, THEN sum.
      # (The alternative — sum the raw products and round once — is explicitly WRONG
      #  and produces a different total; see the two-line 4999-cent example.)
      total = 0
      for line in claim.service_lines:                 # array order, index ascending
          schedule_cap = policy.oon_fee_schedule.get(line.code, 0)
          eligible     = min(line.billed_cents, schedule_cap)
          line_reimb   = round_half_up(eligible * policy.oon_reimburse_pct)   # ROUND PER LINE
          total       += line_reimb                                            # THEN SUM

      remaining_annual = policy.annual_max_cents - policy.annual_reimbursed_cents
      # remaining_annual <= 0 -> ERR_ANNUAL_MAX_EXCEEDED (validation priority 76)
      reimbursed_amount_cents = min(total, remaining_annual)
    input_set: "Every element of claim.service_lines, in array order (index ascending). A service code absent from policy.oon_fee_schedule has schedule_cap 0 and therefore contributes 0. Only claims whose status is ADJUDICATED_APPROVED reach this calculation."
    constants: {}
    precision: "Integer cents; round_half_up applied PER LINE before summation, never after."
    variants: []

  - name: customer_return_risk_score
    trigger: "POST /optical/home-try-on-kits/{id}/return; and POST /optical/_clock/set_current_utc whenever a SHIPPED kit flips to OVERDUE"
    algorithm: weighted_scoring
    formula: |
      history = [k for k in HomeTryOnKit where k.customer_id == customer.id
                                        and k.status in {RETURNED, OVERDUE}]
      customer.lifetime_kit_count = len(history)

      # VARIANT SELECTION IS PINNED on lifetime_kit_count:
      if customer.lifetime_kit_count >= STRICT_HISTORY_THRESHOLD:
          window = history                                             # STRICT variant
      else:
          cutoff = clock_now - ROLLING_WINDOW_DAYS days
          window = [k for k in history if k.due_date >= cutoff]        # ROLLING variant

      if len(window) == 0:
          return_risk_score = 0
      else:
          returned_zero_kept = count(k in window where k.kept_count == 0)
          overdue_kits       = count(k in window where k.was_overdue == true)
          return_risk_score  = round_half_up(
              100 * (W_ZERO_KEPT * returned_zero_kept + W_OVERDUE * overdue_kits) / len(window)
          )
      # Gate: POST /optical/home-try-on-kits is refused with ERR_CUSTOMER_TRYON_BLOCKED
      # when return_risk_score >= BLOCK_THRESHOLD (>= , not >).
    input_set: "HomeTryOnKit rows for this customer with status IN {RETURNED, OVERDUE}. REQUESTED and SHIPPED kits are excluded entirely. The ROLLING window uses kit.due_date (inclusive: due_date >= cutoff)."
    constants:
      ROLLING_WINDOW_DAYS: 180
      STRICT_HISTORY_THRESHOLD: 3
      W_ZERO_KEPT: 0.6
      W_OVERDUE: 0.4
      BLOCK_THRESHOLD: 70
    precision: "Integer 0-100, round_half_up on the final percentage."
    variants:
      - name: ROLLING
        when: "customer.lifetime_kit_count < 3 — the customer has too little history for a lifetime average to be fair."
        difference: "Only kits whose due_date >= clock_now - 180 days enter the denominator and the numerator. Kits older than the window are invisible."
      - name: STRICT
        when: "customer.lifetime_kit_count >= 3 — enough history exists to average over the customer's entire relationship."
        difference: "Every RETURNED/OVERDUE kit in the customer's lifetime enters the window, regardless of due_date. For an identical kit set the two variants diverge: a customer with two recent bad kits and one old clean kit scores 70 under ROLLING (blocked) and 47 under STRICT (allowed)."

  - name: remake_liability
    trigger: "POST /optical/warranty-claims — computed once at claim creation and frozen on WarrantyClaim.customer_charge_cents"
    algorithm: threshold
    formula: |
      days_since_delivery = floor((clock_now - lab_order.delivered_at) / 86400 seconds)
      # days_since_delivery > WARRANTY_WINDOW_DAYS -> ERR_WARRANTY_EXPIRED (priority 62).
      # Exactly WARRANTY_WINDOW_DAYS is INSIDE the window.

      if reason == MANUFACTURER_DEFECT:
          customer_charge_cents = 0
      elif reason == RX_CHANGE:
          customer_charge_cents = 0 if days_since_delivery <= RX_CHANGE_GRACE_DAYS
                                  else floor(order.lens_upcharge_cents * REMAKE_SHARE_PCT)
      elif reason == CUSTOMER_DAMAGE:
          customer_charge_cents = floor(order.lens_upcharge_cents * REMAKE_SHARE_PCT)
                                + REMAKE_SHIPPING_CENTS
    input_set: "The WarrantyClaim's lab_order (must be DELIVERED, with a non-null delivered_at) and that lab order's parent Order's frozen lens_upcharge_cents."
    constants:
      WARRANTY_WINDOW_DAYS: 365
      RX_CHANGE_GRACE_DAYS: 30
      REMAKE_SHARE_PCT: 0.50
      REMAKE_SHIPPING_CENTS: 1500
    precision: "Integer cents; floor() on the share product."
    variants: []

  - name: kit_late_fee
    trigger: "POST /optical/home-try-on-kits/{id}/return"
    algorithm: threshold
    formula: |
      if clock_now <= kit.due_date:
          late_fee_cents = 0
      else:
          days_late      = ceil((clock_now - kit.due_date) / 86400 seconds)
          late_fee_cents = min(LATE_FEE_CAP_CENTS, days_late * LATE_FEE_PER_DAY_CENTS)
    input_set: "The kit's own due_date and the logical clock at the moment of return."
    constants:
      LATE_FEE_PER_DAY_CENTS: 500
      LATE_FEE_CAP_CENTS: 5000
    precision: "Integer cents; ceil() on the day count, then the cap clamps."
    variants: []

# =============================================================================
# 1.3.1 Conserved-Quantity Invariants (compensating actions must not drift)
# =============================================================================
invariants:

  - id: INV_FRAME_BENEFIT_DOLLARS
    conserved_quantity: "Frame-allowance dollars on an InsurancePolicy"
    formula: |
      For every InsurancePolicy P:
        P.frame_allowance_remaining_cents
          + SUM(C.reserved_frame_benefit_cents
                for C in InsuranceClaim where C.policy_id == P.id and C.status != VOID)
        == P.frame_allowance_cents
    forward_action: "POST /optical/orders/{id}/confirm (creates the claim that reserves benefit_frame_cents)"
    compensating_action: "POST /optical/orders/{id}/cancel (voids that claim, crediting the exact reserved amount back)"

  - id: INV_TRYON_SAMPLE_UNITS
    conserved_quantity: "Physical try-on sample units of a Frame"
    formula: |
      For every Frame F:
        F.tryon_available
          + COUNT(I in TryOnKitItem where I.frame_id == F.id and I.outcome == PENDING)
        == F.tryon_stock
    forward_action: "POST /optical/home-try-on-kits (mints a PENDING TryOnKitItem per frame, decrementing tryon_available)"
    compensating_action: "POST /optical/home-try-on-kits/{id}/return (resolves every PENDING item to KEPT or RETURNED, incrementing tryon_available by exactly one per resolved item)"

# =============================================================================
# 1.3.2 Temporal Overlap Rules (distinct interval semantics per resource)
# =============================================================================
overlap_rules:

  - id: EXAM_CHAIR_OVERLAP
    resource_entity: Store
    interval_semantics: "HALF-OPEN [start_at, end_at) with a TRAILING buffer of store.buffer_minutes appended to every interval. Two exams collide when [new.start_at, new.end_at + buffer) intersects [existing.start_at, existing.end_at + buffer). Back-to-back exams with a gap strictly less than buffer_minutes therefore collide; a gap of exactly buffer_minutes does NOT."
    capacity: "store.exam_chairs — the booking is refused only when the number of colliding BOOKED/COMPLETED appointments at that store is >= store.exam_chairs."
    error_id: ERR_EXAM_SLOT_CONFLICT
    applies_to: "POST /optical/exam-appointments"

  - id: CUSTOMER_KIT_WINDOW_OVERLAP
    resource_entity: Customer
    interval_semantics: "CLOSED [ship_date, due_date] — BOTH endpoints inclusive. Two of the same customer's kit windows collide even when they merely TOUCH: kit A's due_date == kit B's ship_date IS an overlap. This is the exact opposite of EXAM_CHAIR_OVERLAP, where a gap of exactly buffer_minutes leaves the half-open intervals disjoint."
    capacity: "1 — a customer may hold at most one kit window at a time. Candidate set: the customer's own kits with status IN {REQUESTED, SHIPPED, OVERDUE}."
    error_id: ERR_TRYON_WINDOW_CONFLICT
    applies_to: "POST /optical/home-try-on-kits"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority — lowest number wins)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the six declared roles."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's roles list."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "Request body schema: required fields present, types correct, enum members valid, money/count fields >= 0, pd_mm within [45.0, 80.0] is checked separately at priority 48, expires_at > issued_at, due_date > ship_date, end_at > start_at."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all writes"

  - priority: 4
    category: existence
    check: "Every resource named in the URL path exists, validated left to right."
    error_id: "ERR_CUSTOMER_NOT_FOUND | ERR_FRAME_NOT_FOUND | ERR_PRESCRIPTION_NOT_FOUND | ERR_KIT_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_LAB_ORDER_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_WARRANTY_CLAIM_NOT_FOUND | ERR_APPOINTMENT_NOT_FOUND"
    http_status: 404
    applies_to: all

  - priority: 5
    category: existence
    check: "Every resource id referenced in the request body exists and, for LensOption/Frame, has status ACTIVE at the catalog level; a RETIRED LensOption is treated as not found."
    error_id: "ERR_CUSTOMER_NOT_FOUND | ERR_FRAME_NOT_FOUND | ERR_LENS_OPTION_NOT_FOUND | ERR_PRESCRIPTION_NOT_FOUND | ERR_STORE_NOT_FOUND | ERR_POLICY_NOT_FOUND | ERR_LAB_ORDER_NOT_FOUND | ERR_APPOINTMENT_NOT_FOUND"
    http_status: 404
    applies_to: "all writes with body references"

  - priority: 6
    category: business_referential
    check: "When the acting role is Customer, X-User-ID must equal the customer_id of the resource being read or mutated (prescriptions, kits, orders, warranty claims, appointments)."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all Customer-role operations on customer-owned resources"

  - priority: 10
    category: business_constraint
    check: "expected_order_version equals the current Order.version (OCC, concurrency_rules.claim-create-stale-order)."
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
    applies_to: "POST /optical/insurance-claims"

  - priority: 11
    category: business_constraint
    check: "expected_lab_order_version equals the current LabOrder.version (OCC, concurrency_rules.warranty-create-stale-lab-order)."
    error_id: ERR_STALE_LAB_ORDER_VERSION
    http_status: 412
    applies_to: "POST /optical/warranty-claims"

  - priority: 40
    category: state
    check: "The target entity is in a from-state that the requested transition declares in §1.2."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 42
    category: state
    check: "At order confirmation, the referenced Prescription's status is VERIFIED."
    error_id: ERR_PRESCRIPTION_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /optical/orders/{id}/confirm"

  - priority: 44
    category: state
    check: "A warranty claim may only be filed against a LabOrder whose status is DELIVERED (delivered_at non-null)."
    error_id: ERR_LAB_ORDER_NOT_DELIVERED
    http_status: 409
    applies_to: "POST /optical/warranty-claims"

  - priority: 46
    category: state
    check: "A BOPIS order may only be confirmed, and a BOPIS lab order may only be shipped, when the destination Store's status is OPEN."
    error_id: ERR_STORE_CLOSED
    http_status: 409
    applies_to: "POST /optical/orders/{id}/confirm, POST /optical/lab-orders/{id}/ship"

  - priority: 48
    category: business_safety
    check: "The prescription's pd_mm lies within [45.0, 80.0] on capture, and within [frame.min_pd_mm, frame.max_pd_mm] (inclusive) on order creation."
    error_id: ERR_PD_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /optical/prescriptions, POST /optical/prescriptions/{id}/resubmit, POST /optical/orders"

  - priority: 50
    category: business_safety
    check: "The selected MATERIAL LensOption's material_index is >= the required_index_tier that calculations.lens_upcharge derives from the prescription's rx_power."
    error_id: ERR_LENS_INCOMPATIBLE_WITH_RX
    http_status: 422
    applies_to: "POST /optical/orders"

  - priority: 52
    category: business_safety
    check: "No selected COATING LensOption lists another selected option's code in its incompatible_with array (checked symmetrically)."
    error_id: ERR_COATING_INCOMPATIBLE
    http_status: 422
    applies_to: "POST /optical/orders"

  - priority: 54
    category: business_referential
    check: "The ordered Frame's status is ACTIVE."
    error_id: ERR_FRAME_DISCONTINUED
    http_status: 422
    applies_to: "POST /optical/orders"

  - priority: 58
    category: business_referential
    check: "The referenced Prescription's customer_id equals the order's (or the appointment's) customer_id."
    error_id: ERR_PRESCRIPTION_OWNER_MISMATCH
    http_status: 422
    applies_to: "POST /optical/orders, POST /optical/exam-appointments/{id}/complete"

  - priority: 60
    category: business_temporal
    check: "The referenced Prescription's expires_at is strictly after the logical clock at verify time and at confirm time."
    error_id: ERR_PRESCRIPTION_EXPIRED
    http_status: 422
    applies_to: "POST /optical/prescriptions/{id}/verify, POST /optical/orders/{id}/confirm"

  - priority: 62
    category: business_temporal
    check: "The warranty claim is filed no more than 365 days after lab_order.delivered_at (exactly 365 is inside the window)."
    error_id: ERR_WARRANTY_EXPIRED
    http_status: 422
    applies_to: "POST /optical/warranty-claims"

  - priority: 64
    category: business_constraint
    check: "frame_ids is a non-empty array."
    error_id: ERR_KIT_EMPTY
    http_status: 422
    applies_to: "POST /optical/home-try-on-kits"

  - priority: 65
    category: business_constraint
    check: "frame_ids holds at most 5 distinct frames."
    error_id: ERR_KIT_SIZE_EXCEEDED
    http_status: 422
    applies_to: "POST /optical/home-try-on-kits"

  - priority: 66
    category: business_constraint
    check: "customer.return_risk_score < 70 (the gate fires at >= 70, per calculations.customer_return_risk_score.BLOCK_THRESHOLD)."
    error_id: ERR_CUSTOMER_TRYON_BLOCKED
    http_status: 403
    applies_to: "POST /optical/home-try-on-kits"

  - priority: 67
    category: business_temporal
    check: "overlap_rules.CUSTOMER_KIT_WINDOW_OVERLAP — the customer has no other kit with status IN {REQUESTED, SHIPPED, OVERDUE} whose closed [ship_date, due_date] interval intersects the requested one."
    error_id: ERR_TRYON_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /optical/home-try-on-kits"

  - priority: 68
    category: business_constraint
    check: "Every requested frame has tryon_available >= 1 (i.e. at least one physical sample unit is not currently held by a PENDING TryOnKitItem). The check fires at exactly 0, never at 1."
    error_id: ERR_TRYON_STOCK_UNAVAILABLE
    http_status: 409
    applies_to: "POST /optical/home-try-on-kits"

  - priority: 69
    category: business_temporal
    check: "overlap_rules.EXAM_CHAIR_OVERLAP — the count of colliding BOOKED/COMPLETED appointments (half-open interval + trailing buffer_minutes) at the store is < store.exam_chairs."
    error_id: ERR_EXAM_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /optical/exam-appointments"

  - priority: 70
    category: business_constraint
    check: "delivery_method BOPIS requires a non-null store_id; delivery_method SHIP requires store_id to be null."
    error_id: ERR_BOPIS_STORE_REQUIRED
    http_status: 422
    applies_to: "POST /optical/orders"

  - priority: 71
    category: business_constraint
    check: "A QC failure is only accepted while lab_order.remake_count < 2."
    error_id: ERR_REMAKE_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /optical/lab-orders/{id}/qc"

  - priority: 72
    category: business_fiscal
    check: "At confirmation, the order's benefit_frame_cents is <= policy.frame_allowance_remaining_cents (the reservation must not over-draw the allowance)."
    error_id: ERR_INSUFFICIENT_BENEFIT
    http_status: 422
    applies_to: "POST /optical/orders/{id}/confirm"

  - priority: 74
    category: business_fiscal
    check: "fsa_amount_cents <= customer.fsa_balance_cents."
    error_id: ERR_INSUFFICIENT_FSA
    http_status: 422
    applies_to: "POST /optical/orders/{id}/confirm"

  - priority: 76
    category: business_fiscal
    check: "policy.annual_max_cents - policy.annual_reimbursed_cents > 0."
    error_id: ERR_ANNUAL_MAX_EXCEEDED
    http_status: 422
    applies_to: "POST /optical/insurance-claims/{id}/reimburse"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- catalog & configuration ---
  - method: POST
    path: "/optical/insurance-policies"
    description: "Register a vision plan."
    roles: [PlatformAdmin]
    code: 201
    input: [member_id, network, frame_allowance_cents, lens_copay_cents, annual_max_cents, plan_year_start, "oon_reimburse_pct?", "oon_fee_schedule?"]
    output: InsurancePolicy
    side_effects: ["frame_allowance_remaining_cents initialized to frame_allowance_cents", "annual_reimbursed_cents initialized to 0"]

  - method: GET
    path: "/optical/insurance-policies/{id}"
    description: "Read a policy, including the live frame_allowance_remaining_cents and annual_reimbursed_cents ledgers."
    roles: [PlatformAdmin, BenefitsAdmin, Customer]
    code: 200
    input: []
    output: InsurancePolicy
    side_effects: []

  - method: POST
    path: "/optical/stores"
    description: "Register a retail store with exam-chair capacity and turnover buffer."
    roles: [PlatformAdmin]
    code: 201
    input: [name, exam_chairs, "status?", "buffer_minutes?", "pickup_capacity_per_day?"]
    output: Store
    side_effects: []

  - method: POST
    path: "/optical/frames"
    description: "Add a frame to the catalog."
    roles: [PlatformAdmin]
    code: 201
    input: [sku, name, brand, price_cents, tryon_stock, min_pd_mm, max_pd_mm, "status?"]
    output: Frame
    side_effects: ["tryon_available initialized to tryon_stock"]

  - method: GET
    path: "/optical/frames/{id}"
    description: "Read a frame, including the live tryon_available count."
    roles: [PlatformAdmin, StoreAssociate, Customer, OpticianVerifier, LabTechnician, BenefitsAdmin]
    code: 200
    input: []
    output: Frame
    side_effects: []

  - method: GET
    path: "/optical/frames/{id}/try-on-kit-items"
    description: "List every try-on kit item that holds (or held) this frame."
    roles: [PlatformAdmin, StoreAssociate]
    code: 200
    input: ["outcome?", "limit?", "offset?"]
    output: TryOnKitItem[]
    side_effects: []

  - method: POST
    path: "/optical/lens-options"
    description: "Add a lens material or coating to the catalog."
    roles: [PlatformAdmin]
    code: 201
    input: [code, category, base_price_cents, "material_index?", "incompatible_with?", "status?"]
    output: LensOption
    side_effects: []

  - method: POST
    path: "/optical/customers"
    description: "Register a customer, optionally attaching a vision policy and an FSA balance."
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, email, dob, "insurance_policy_id?", "fsa_balance_cents?"]
    output: Customer
    side_effects: ["return_risk_score initialized to 0", "lifetime_kit_count initialized to 0"]

  - method: GET
    path: "/optical/customers/{id}"
    description: "Read a customer, including fsa_balance_cents, lifetime_kit_count and return_risk_score."
    roles: [PlatformAdmin, StoreAssociate, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: GET
    path: "/optical/customers"
    description: "List customers, optionally filtered by the policy they are enrolled in."
    roles: [PlatformAdmin, StoreAssociate]
    code: 200
    input: ["insurance_policy_id?", "limit?", "offset?"]
    output: Customer[]
    side_effects: []

  - method: POST
    path: "/optical/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical UTC clock. Before any call, the clock reads exactly 2026-05-01T00:00:00Z and NEVER falls back to wall-clock time. Advancing the clock is the only way EXPIRED prescriptions and OVERDUE kits come into being."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, expired_prescription_ids: string[], overdue_kit_ids: string[] }"
    side_effects:
      - "every VERIFIED Prescription with expires_at <= new clock time transitions to EXPIRED"
      - "every SHIPPED HomeTryOnKit with due_date < new clock time transitions to OVERDUE, latches was_overdue = true, and triggers a recompute of its customer's return_risk_score"

  # --- prescriptions & PD ---
  - method: POST
    path: "/optical/prescriptions"
    description: "Capture a prescription and PD; enters SUBMITTED awaiting optician verification."
    roles: [Customer, StoreAssociate]
    code: 201
    input: [customer_id, od_sphere, od_cylinder, os_sphere, os_cylinder, pd_mm, issued_at, expires_at, "prism_diopters?"]
    output: Prescription
    side_effects: ["status initialized to SUBMITTED", "resubmit_count initialized to 0"]

  - method: GET
    path: "/optical/prescriptions/{id}"
    description: "Read a prescription."
    roles: [Customer, OpticianVerifier, StoreAssociate, PlatformAdmin]
    code: 200
    input: []
    output: Prescription
    side_effects: []

  - method: GET
    path: "/optical/customers/{id}/prescriptions"
    description: "List a customer's prescriptions."
    roles: [Customer, OpticianVerifier, StoreAssociate, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Prescription[]
    side_effects: []

  - method: POST
    path: "/optical/prescriptions/{id}/verify"
    description: "Optician verifies or rejects a SUBMITTED prescription."
    roles: [OpticianVerifier]
    code: 200
    input: [decision, "rejection_reason?"]
    output: Prescription
    side_effects: ["VERIFIED: verified_by = X-User-ID", "REJECTED: rejection_reason recorded", "increments Prescription.version by 1"]

  - method: POST
    path: "/optical/prescriptions/{id}/resubmit"
    description: "Customer corrects and resubmits a REJECTED prescription (revert loop back to SUBMITTED)."
    roles: [Customer]
    code: 200
    input: [od_sphere, od_cylinder, os_sphere, os_cylinder, pd_mm, issued_at, expires_at, "prism_diopters?"]
    output: Prescription
    side_effects: ["status REJECTED -> SUBMITTED", "resubmit_count += 1", "increments Prescription.version by 1"]

  # --- home try-on ---
  - method: POST
    path: "/optical/home-try-on-kits"
    description: "Request a home try-on kit holding 1-5 frames over the closed [ship_date, due_date] window."
    roles: [Customer]
    code: 201
    input: [customer_id, frame_ids, ship_date, due_date]
    output: HomeTryOnKit
    side_effects:
      - "one PENDING TryOnKitItem minted per frame_id"
      - "each referenced Frame's tryon_available decremented by 1"
      - "item_count set; kept_count 0; late_fee_cents 0"

  - method: GET
    path: "/optical/home-try-on-kits/{id}"
    description: "Read a kit."
    roles: [Customer, StoreAssociate, PlatformAdmin]
    code: 200
    input: []
    output: HomeTryOnKit
    side_effects: []

  - method: GET
    path: "/optical/customers/{id}/home-try-on-kits"
    description: "List a customer's try-on kits."
    roles: [Customer, StoreAssociate, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: HomeTryOnKit[]
    side_effects: []

  - method: GET
    path: "/optical/home-try-on-kits/{id}/items"
    description: "List the items in a kit with their PENDING/KEPT/RETURNED outcomes."
    roles: [Customer, StoreAssociate, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: TryOnKitItem[]
    side_effects: []

  - method: POST
    path: "/optical/home-try-on-kits/{id}/ship"
    description: "Store associate ships the kit."
    roles: [StoreAssociate]
    code: 200
    input: []
    output: HomeTryOnKit
    side_effects: ["status REQUESTED -> SHIPPED", "increments HomeTryOnKit.version by 1"]

  - method: POST
    path: "/optical/home-try-on-kits/{id}/return"
    description: "Customer returns the kit, naming which frames they intend to buy. Runs the three-link return cascade and the late-fee calculation."
    roles: [Customer]
    code: 200
    input: [kept_frame_ids]
    output: HomeTryOnKit
    side_effects:
      - "status SHIPPED|OVERDUE -> RETURNED; late_fee_cents = calculations.kit_late_fee"
      - "each PENDING item resolves to KEPT or RETURNED"
      - "each affected Frame's tryon_available incremented by 1"
      - "customer.lifetime_kit_count and customer.return_risk_score recomputed"
      - "increments HomeTryOnKit.version by 1"

  # --- orders ---
  - method: POST
    path: "/optical/orders"
    description: "Build an order (frame + lens material + coatings + Rx). Freezes lens_upcharge_cents and produces an ESTIMATED quote."
    roles: [Customer]
    code: 201
    input: [customer_id, prescription_id, frame_id, material_option_id, delivery_method, "coating_option_ids?", "store_id?", "exam_appointment_id?"]
    output: Order
    side_effects:
      - "lens_upcharge_cents = calculations.lens_upcharge"
      - "subtotal_cents / discount_cents / benefit_frame_cents / benefit_lens_cents / benefit_applied_cents / customer_due_cents = calculations.order_price_quote (ESTIMATED, fsa_amount_cents = 0)"
      - "quote_variant = ESTIMATED; fulfillment_status = DRAFT; payment_status = UNPAID"

  - method: GET
    path: "/optical/orders/{id}"
    description: "Read an order and its full money breakdown."
    roles: [Customer, StoreAssociate, BenefitsAdmin, PlatformAdmin]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: GET
    path: "/optical/orders"
    description: "List orders with FK filters."
    roles: [StoreAssociate, BenefitsAdmin, PlatformAdmin]
    code: 200
    input: ["customer_id?", "prescription_id?", "frame_id?", "store_id?", "exam_appointment_id?", "material_option_id?", "active_claim_id?", "fulfillment_status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []

  - method: POST
    path: "/optical/orders/{id}/confirm"
    description: "Confirm and authorize the order; mints the LabOrder and (for insured customers) the InsuranceClaim that reserves the frame benefit."
    roles: [Customer]
    code: 200
    input: ["fsa_amount_cents?"]
    output: Order
    side_effects:
      - "fulfillment_status DRAFT -> CONFIRMED; payment_status UNPAID -> AUTHORIZED"
      - "order re-quoted under the ESTIMATED variant with fsa_applied_cents; customer.fsa_balance_cents debited"
      - "LabOrder created (QUEUED)"
      - "InsuranceClaim created (SUBMITTED) when the customer has a policy; order.active_claim_id set; policy.frame_allowance_remaining_cents debited by claim.reserved_frame_benefit_cents"
      - "increments Order.version by 1"

  - method: POST
    path: "/optical/orders/{id}/cancel"
    description: "Cancel the order; runs the four-link cancel cascade (order -> lab order -> claim -> policy ledger)."
    roles: [Customer, PlatformAdmin]
    code: 200
    input: ["reason?"]
    output: Order
    side_effects:
      - "fulfillment_status -> CANCELLED; payment_status AUTHORIZED -> REFUNDED; customer.fsa_balance_cents credited by fsa_applied_cents"
      - "the LabOrder is CANCELLED when non-terminal"
      - "the active InsuranceClaim is VOIDed and policy.frame_allowance_remaining_cents credited by reserved_frame_benefit_cents; active_claim_id cleared"
      - "increments Order.version by 1"

  # --- lab ---
  - method: GET
    path: "/optical/lab-orders/{id}"
    description: "Read a lab order."
    roles: [LabTechnician, StoreAssociate, Customer, PlatformAdmin]
    code: 200
    input: []
    output: LabOrder
    side_effects: []

  - method: GET
    path: "/optical/lab-orders"
    description: "List lab orders with FK filters."
    roles: [LabTechnician, StoreAssociate, PlatformAdmin]
    code: 200
    input: ["order_id?", "shipped_to_store_id?", "active_warranty_claim_id?", "status?", "limit?", "offset?"]
    output: LabOrder[]
    side_effects: []

  - method: POST
    path: "/optical/lab-orders/{id}/start"
    description: "Move a QUEUED or REMAKE_QUEUED lab order into production (the remake cycle re-enters here)."
    roles: [LabTechnician]
    code: 200
    input: []
    output: LabOrder
    side_effects: ["status -> IN_PRODUCTION", "from QUEUED: the parent Order's fulfillment_status advances CONFIRMED -> IN_LAB", "increments LabOrder.version by 1"]

  - method: POST
    path: "/optical/lab-orders/{id}/qc"
    description: "Record a QC result; a FAIL sends the lab order back to REMAKE_QUEUED and bumps remake_count."
    roles: [LabTechnician]
    code: 200
    input: [result, "failure_reason?"]
    output: LabOrder
    side_effects: ["PASS: status -> QC_PASSED", "FAIL: status -> REMAKE_QUEUED, remake_count += 1, qc_failure_reason recorded", "increments LabOrder.version by 1"]

  - method: POST
    path: "/optical/lab-orders/{id}/ship"
    description: "Ship the finished glasses — to the BOPIS store or to the customer — and capture payment."
    roles: [LabTechnician]
    code: 200
    input: []
    output: LabOrder
    side_effects:
      - "status QC_PASSED -> SHIPPED; shipped_to_store_id set for BOPIS orders"
      - "the parent Order's fulfillment_status advances to READY_FOR_PICKUP (BOPIS) or SHIPPED, and payment_status AUTHORIZED -> CAPTURED"
      - "increments LabOrder.version by 1"

  - method: POST
    path: "/optical/lab-orders/{id}/deliver"
    description: "Hand the glasses to the customer (BOPIS pickup or courier delivery); starts the 365-day warranty window."
    roles: [StoreAssociate]
    code: 200
    input: []
    output: LabOrder
    side_effects: ["status SHIPPED -> DELIVERED; delivered_at = logical clock now", "the parent Order's fulfillment_status advances to DELIVERED", "increments LabOrder.version by 1"]

  # --- insurance ---
  - method: POST
    path: "/optical/insurance-claims"
    description: "File (or re-file) an insurance claim against an order. A new claim supersedes the order's existing active claim, which goes VOID. Guarded by OCC on the order's version."
    roles: [BenefitsAdmin]
    code: 201
    input: [order_id, service_lines, expected_order_version]
    output: InsuranceClaim
    side_effects:
      - "any existing non-VOID claim on the order transitions to VOID, crediting policy.frame_allowance_remaining_cents by its reserved_frame_benefit_cents"
      - "the new claim reserves reserved_frame_benefit_cents = order.benefit_frame_cents, debiting policy.frame_allowance_remaining_cents"
      - "order.active_claim_id repointed at the new claim"
      - "increments Order.version by 1"

  - method: GET
    path: "/optical/insurance-claims/{id}"
    description: "Read a claim."
    roles: [BenefitsAdmin, PlatformAdmin, Customer]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: []

  - method: GET
    path: "/optical/insurance-claims"
    description: "List claims with FK filters."
    roles: [BenefitsAdmin, PlatformAdmin]
    code: 200
    input: ["order_id?", "policy_id?", "status?", "limit?", "offset?"]
    output: InsuranceClaim[]
    side_effects: []

  - method: POST
    path: "/optical/insurance-claims/{id}/adjudicate"
    description: "Insurer decision. An APPROVED decision on an IN_NETWORK policy re-quotes the parent order under the FINAL variant."
    roles: [BenefitsAdmin]
    code: 200
    input: [decision, "allowed_amount_cents?", "denial_reason?"]
    output: InsuranceClaim
    side_effects:
      - "APPROVED: approved_amount_cents = min(order.benefit_applied_cents, allowed_amount_cents) for IN_NETWORK; the parent Order is re-quoted FINAL"
      - "DENIED: denial_reason recorded; the frame benefit stays reserved"
      - "increments InsuranceClaim.version by 1"

  - method: POST
    path: "/optical/insurance-claims/{id}/reimburse"
    description: "Pay an approved OUT_OF_NETWORK claim: runs calculations.oon_reimbursement (round per line, then sum, then cap at the annual max remaining)."
    roles: [BenefitsAdmin]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects:
      - "reimbursed_amount_cents = calculations.oon_reimbursement; status -> REIMBURSED"
      - "policy.annual_reimbursed_cents += reimbursed_amount_cents"
      - "increments InsuranceClaim.version by 1"

  # --- warranty ---
  - method: POST
    path: "/optical/warranty-claims"
    description: "File a warranty claim against a DELIVERED lab order; freezes customer_charge_cents via calculations.remake_liability. A new claim supersedes the lab order's existing OPEN claim. Guarded by OCC on the lab order's version."
    roles: [Customer]
    code: 201
    input: [lab_order_id, customer_id, reason, expected_lab_order_version]
    output: WarrantyClaim
    side_effects:
      - "any existing OPEN claim on the lab order transitions to SUPERSEDED"
      - "customer_charge_cents = calculations.remake_liability"
      - "lab_order.active_warranty_claim_id repointed at the new claim"
      - "increments LabOrder.version by 1"

  - method: GET
    path: "/optical/warranty-claims/{id}"
    description: "Read a warranty claim."
    roles: [Customer, StoreAssociate, PlatformAdmin]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []

  - method: GET
    path: "/optical/warranty-claims"
    description: "List warranty claims with FK filters."
    roles: [StoreAssociate, PlatformAdmin]
    code: 200
    input: ["lab_order_id?", "customer_id?", "remake_lab_order_id?", "status?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []

  - method: POST
    path: "/optical/warranty-claims/{id}/decide"
    description: "Approve (minting a remake LabOrder) or deny an OPEN warranty claim."
    roles: [StoreAssociate]
    code: 200
    input: [decision, "denial_reason?"]
    output: WarrantyClaim
    side_effects:
      - "APPROVED: a fresh LabOrder (QUEUED, is_remake true) is created on the same order_id; remake_lab_order_id set"
      - "DENIED: denial_reason recorded"
      - "increments WarrantyClaim.version by 1"

  # --- exams & BOPIS linkage ---
  - method: POST
    path: "/optical/exam-appointments"
    description: "Book an eye exam; enforces half-open interval + trailing store buffer against the store's exam-chair capacity."
    roles: [Customer]
    code: 201
    input: [customer_id, store_id, start_at, end_at]
    output: ExamAppointment
    side_effects: ["status initialized to BOOKED"]

  - method: GET
    path: "/optical/exam-appointments/{id}"
    description: "Read an appointment."
    roles: [Customer, StoreAssociate, PlatformAdmin]
    code: 200
    input: []
    output: ExamAppointment
    side_effects: []

  - method: GET
    path: "/optical/exam-appointments"
    description: "List appointments with FK filters."
    roles: [StoreAssociate, PlatformAdmin]
    code: 200
    input: ["customer_id?", "store_id?", "resulting_prescription_id?", "status?", "limit?", "offset?"]
    output: ExamAppointment[]
    side_effects: []

  - method: POST
    path: "/optical/exam-appointments/{id}/complete"
    description: "Close the exam and link the prescription it produced."
    roles: [StoreAssociate]
    code: 200
    input: [prescription_id]
    output: ExamAppointment
    side_effects: ["status BOOKED -> COMPLETED", "resulting_prescription_id set", "increments ExamAppointment.version by 1"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the six declared roles."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not permitted on this endpoint, or a Customer is acting on a resource whose customer_id is not their X-User-ID."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, wrong type, invalid enum member, negative money value, expires_at <= issued_at, due_date <= ship_date, end_at <= start_at, REJECTED decision without rejection_reason, FAIL QC without failure_reason."
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "The referenced Customer id does not exist."
  - id: ERR_POLICY_NOT_FOUND
    http: 404
    condition: "The referenced InsurancePolicy id does not exist."
  - id: ERR_STORE_NOT_FOUND
    http: 404
    condition: "The referenced Store id does not exist."
  - id: ERR_FRAME_NOT_FOUND
    http: 404
    condition: "The referenced Frame id does not exist, or a kept_frame_ids entry names a frame that is not in the kit."
  - id: ERR_LENS_OPTION_NOT_FOUND
    http: 404
    condition: "The referenced LensOption id does not exist, or its status is RETIRED, or a material_option_id names a COATING (or vice-versa)."
  - id: ERR_PRESCRIPTION_NOT_FOUND
    http: 404
    condition: "The referenced Prescription id does not exist."
  - id: ERR_KIT_NOT_FOUND
    http: 404
    condition: "The referenced HomeTryOnKit id does not exist."
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "The referenced Order id does not exist."
  - id: ERR_LAB_ORDER_NOT_FOUND
    http: 404
    condition: "The referenced LabOrder id does not exist."
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "The referenced InsuranceClaim id does not exist."
  - id: ERR_WARRANTY_CLAIM_NOT_FOUND
    http: 404
    condition: "The referenced WarrantyClaim id does not exist."
  - id: ERR_APPOINTMENT_NOT_FOUND
    http: 404
    condition: "The referenced ExamAppointment id does not exist."
  - id: ERR_STALE_ORDER_VERSION
    http: 412
    condition: "expected_order_version does not equal the Order's current version (concurrency_rules.claim-create-stale-order)."
  - id: ERR_STALE_LAB_ORDER_VERSION
    http: 412
    condition: "expected_lab_order_version does not equal the LabOrder's current version (concurrency_rules.warranty-create-stale-lab-order)."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target entity is not in a from-state that the requested transition declares (e.g. shipping a kit that is already SHIPPED, cancelling a DELIVERED order, reimbursing an IN_NETWORK claim)."
  - id: ERR_PRESCRIPTION_NOT_VERIFIED
    http: 409
    condition: "Order confirmation attempted while the referenced Prescription's status is not VERIFIED."
  - id: ERR_LAB_ORDER_NOT_DELIVERED
    http: 409
    condition: "A warranty claim was filed against a LabOrder whose status is not DELIVERED."
  - id: ERR_STORE_CLOSED
    http: 409
    condition: "A BOPIS order was confirmed, or a BOPIS lab order shipped, while the destination Store's status is CLOSED."
  - id: ERR_PD_OUT_OF_RANGE
    http: 422
    condition: "pd_mm outside [45.0, 80.0] on capture/resubmit, or outside the ordered frame's [min_pd_mm, max_pd_mm] on order creation."
  - id: ERR_LENS_INCOMPATIBLE_WITH_RX
    http: 422
    condition: "The chosen MATERIAL option's material_index is below the required_index_tier derived from the prescription's rx_power."
  - id: ERR_COATING_INCOMPATIBLE
    http: 422
    condition: "Two selected coatings list each other (or one lists the other) in incompatible_with."
  - id: ERR_FRAME_DISCONTINUED
    http: 422
    condition: "An order references a Frame whose status is DISCONTINUED."
  - id: ERR_PRESCRIPTION_OWNER_MISMATCH
    http: 422
    condition: "The referenced Prescription's customer_id differs from the order's / appointment's customer_id."
  - id: ERR_PRESCRIPTION_EXPIRED
    http: 422
    condition: "The referenced Prescription's expires_at is at or before the logical clock at verify time or confirm time (or its status is already EXPIRED)."
  - id: ERR_WARRANTY_EXPIRED
    http: 422
    condition: "A warranty claim was filed more than 365 days after lab_order.delivered_at."
  - id: ERR_KIT_EMPTY
    http: 422
    condition: "A home try-on kit was requested with an empty frame_ids array."
  - id: ERR_KIT_SIZE_EXCEEDED
    http: 422
    condition: "A home try-on kit was requested with more than 5 frames."
  - id: ERR_CUSTOMER_TRYON_BLOCKED
    http: 403
    condition: "The customer's return_risk_score is >= 70 at kit-request time."
  - id: ERR_TRYON_WINDOW_CONFLICT
    http: 409
    condition: "The customer already holds a kit (REQUESTED/SHIPPED/OVERDUE) whose CLOSED [ship_date, due_date] interval intersects the requested one — touching endpoints (previous due_date == new ship_date) count as an intersection."
  - id: ERR_TRYON_STOCK_UNAVAILABLE
    http: 409
    condition: "Some requested frame has tryon_available == 0 — every physical sample unit is already held by a PENDING TryOnKitItem."
  - id: ERR_EXAM_SLOT_CONFLICT
    http: 409
    condition: "The number of colliding appointments (half-open interval plus trailing store buffer) is already >= store.exam_chairs."
  - id: ERR_BOPIS_STORE_REQUIRED
    http: 422
    condition: "delivery_method BOPIS was requested without a store_id, or SHIP was requested with one."
  - id: ERR_REMAKE_LIMIT_EXCEEDED
    http: 409
    condition: "A third QC failure was recorded on a lab order whose remake_count is already 2."
  - id: ERR_INSUFFICIENT_BENEFIT
    http: 422
    condition: "At confirmation, the order's benefit_frame_cents exceeds the policy's frame_allowance_remaining_cents."
  - id: ERR_INSUFFICIENT_FSA
    http: 422
    condition: "fsa_amount_cents exceeds the customer's fsa_balance_cents."
  - id: ERR_ANNUAL_MAX_EXCEEDED
    http: 422
    condition: "Reimbursement attempted on a policy whose annual_max_cents - annual_reimbursed_cents is <= 0."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "The person buying glasses. Owns their prescriptions, try-on kits, orders, appointments and warranty requests."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /optical/prescriptions/{id}/resubmit"
      - "POST /optical/home-try-on-kits"
      - "POST /optical/home-try-on-kits/{id}/return"
      - "POST /optical/orders"
      - "POST /optical/orders/{id}/confirm"
      - "POST /optical/warranty-claims"
      - "POST /optical/exam-appointments"
    shared_operations:
      - "POST /optical/prescriptions (with StoreAssociate)"
      - "POST /optical/orders/{id}/cancel (with PlatformAdmin)"
      - "GET reads of their own customer record, prescriptions, kits, orders, lab orders, claims, warranty claims, appointments, frames and policy"

  - name: OpticianVerifier
    description: "Licensed optician who verifies or rejects captured prescriptions."
    identity: "opaque"
    exclusive_operations:
      - "POST /optical/prescriptions/{id}/verify"
    shared_operations:
      - "GET /optical/prescriptions/{id}, GET /optical/customers/{id}/prescriptions, GET /optical/frames/{id}"

  - name: StoreAssociate
    description: "Retail-floor staff: captures prescriptions in store, ships try-on kits, hands over BOPIS orders, decides warranty claims, completes exams."
    identity: "opaque"
    exclusive_operations:
      - "POST /optical/home-try-on-kits/{id}/ship"
      - "POST /optical/lab-orders/{id}/deliver"
      - "POST /optical/warranty-claims/{id}/decide"
      - "POST /optical/exam-appointments/{id}/complete"
    shared_operations:
      - "POST /optical/prescriptions (with Customer)"
      - "GET reads across customers, kits, kit items, orders, lab orders, warranty claims, appointments, frames"

  - name: LabTechnician
    description: "Optical lab staff: runs production, QC, remakes and shipment."
    identity: "opaque"
    exclusive_operations:
      - "POST /optical/lab-orders/{id}/start"
      - "POST /optical/lab-orders/{id}/qc"
      - "POST /optical/lab-orders/{id}/ship"
    shared_operations:
      - "GET /optical/lab-orders, GET /optical/lab-orders/{id}, GET /optical/frames/{id}"

  - name: BenefitsAdmin
    description: "Insurance operations: files claims, records insurer adjudications, pays out-of-network reimbursements."
    identity: "opaque"
    exclusive_operations:
      - "POST /optical/insurance-claims"
      - "POST /optical/insurance-claims/{id}/adjudicate"
      - "POST /optical/insurance-claims/{id}/reimburse"
    shared_operations:
      - "GET /optical/insurance-claims, GET /optical/insurance-claims/{id}, GET /optical/insurance-policies/{id}, GET /optical/orders, GET /optical/orders/{id}, GET /optical/frames/{id}"

  - name: PlatformAdmin
    description: "Operator of the catalog, the store network, customer records and the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /optical/insurance-policies"
      - "POST /optical/stores"
      - "POST /optical/frames"
      - "POST /optical/lens-options"
      - "POST /optical/customers"
      - "POST /optical/_clock/set_current_utc"
    shared_operations:
      - "POST /optical/orders/{id}/cancel (with Customer)"
      - "GET reads across every collection"
