          trigger:
            - { call: "POST /sensory-lab/study-arms", payload: { study_id: "${study_id}", packaging_variant: "MAP", is_control: true }, as: SensoryScientist, captures: { err1: $.data.error_id } }
            - { call: "POST /sensory-lab/study-arms", payload: { study_id: "${study_id}", packaging_variant: "STANDARD_FILM", is_control: false }, as: SensoryScientist, captures: { err2: $.data.error_id } }
          assert:
            - "second control arm: error_id == ERR_CONTROL_ARM_EXISTS"
            - "duplicate variant: error_id == ERR_DUPLICATE_ARM_VARIANT; study still has exactly 1 arm"

      - name: session_exists_per_arm_timepoint
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_SESSION_EXISTS]"]
        distinguishing_aspect: "Second non-CANCELLED session for the same (time_point_id, arm_id) fails with ERR_SESSION_EXISTS."
        test_recipe:
          setup: ["study SCHEDULED; 1 control arm; tp0; one PLANNED session for (tp0, arm)"]
