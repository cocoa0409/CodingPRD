  - rule_id: priority_pair_validation_conflict
    instances:
      - name: spot_confirm_state_beats_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=13]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Category pair {state, business_fiscal}: confirming a CANCELLED spot
          sale whose total (515200) also exceeds the credit limit (100) returns
          ERR_INVALID_STATE (priority 6), not ERR_CREDIT_LIMIT_EXCEEDED
          (priority 13).
        test_recipe:
          setup:
            - "Pellet lot qty 736; spot sale (price 700, credit limit 100) created then cancelled, so the sale is CANCELLED and the lot AVAILABLE again"
          setup_api_calls:
            - { call: "POST /api/fields", payload: { name: "F1", acreage: 100 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /api/planting-plans", payload: { field_id: "${f_id}", crop_year: 2026, variety: "CASCADE", planned_acreage: 40 }, as: FarmManager, captures: { p_id: $.data.id } }
            - { call: "POST /api/planting-plans/${p_id}/approve", payload: {}, as: FarmManager }
            - { call: "POST /api/planting-plans/${p_id}/open-harvest", payload: {}, as: FarmManager }
            - { call: "POST /api/kilns", payload: { name: "K1" }, as: FarmManager, captures: { k_id: $.data.id } }
            - { call: "POST /api/harvest-lots", payload: { planting_plan_id: "${p_id}", wet_lbs: 3000 }, as: FarmManager, captures: { lot_id: $.data.id } }
            - { call: "POST /api/harvest-lots/${lot_id}/load-kiln", payload: { kiln_id: "${k_id}", kiln_window_start: "2026-08-20T08:00:00Z", kiln_window_end: "2026-08-20T12:00:00Z" }, as: FarmManager }
            - { call: "POST /api/harvest-lots/${lot_id}/finish-drying", payload: { dried_lbs: 800 }, as: FarmManager }
            - { call: "POST /api/harvest-lots/${lot_id}/release", payload: {}, as: FarmManager }
            - { call: "POST /api/lab-tests", payload: { harvest_lot_id: "${lot_id}", test_type: "PROVISIONAL", alpha_pct: 12.0 }, as: LabTechnician }
            - { call: "POST /api/pellet-lots", payload: { source_lot_ids: ["${lot_id}"], storage_room: "R1" }, as: FarmManager, captures: { pellet_id: $.data.id } }
            - { call: "POST /api/spot-sales", payload: { pellet_lot_id: "${pellet_id}", buyer_name: "CraftBrew", price_cents_per_lb: 700, buyer_credit_limit_cents: 100 }, as: ContractManager, captures: { sale_id: $.data.id } }
            - { call: "POST /api/spot-sales/${sale_id}/cancel", payload: {}, as: ContractManager }
          trigger:
            - { call: "POST /api/spot-sales/${sale_id}/confirm", payload: {}, as: ContractManager, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INVALID_STATE (state check outranks the fiscal credit-limit check, which would also fail: 736 x 700 = 515200 > 100)"
            - "SpotSale ${sale_id} remains CANCELLED; PelletLot ${pellet_id} remains AVAILABLE"

      - name: pelletize_referential_beats_constraint
        grounds:
          - validations[priority=11]
          - validations[priority=12]
          - errors[ERR_LOT_NOT_DRIED]
          - errors[ERR_MIXED_VARIETY]
        distinguishing_aspect: |
          Category pair {business_referential, business_constraint} (disjoint
          from the state-vs-fiscal pair): pelletizing a source set containing a
          non-DRIED CITRA lot alongside a DRIED CASCADE lot returns
          ERR_LOT_NOT_DRIED (priority 11), not ERR_MIXED_VARIETY (priority 12).
        test_recipe:
          setup:
            - "Lot A: CASCADE 2026, DRIED (dried 500). Lot B: CITRA 2026 on a different field, MOISTURE_CHECK (finished at dried 500, never released)"
          setup_api_calls:
            - { call: "POST /api/fields", payload: { name: "F1", acreage: 100 }, as: FarmManager, captures: { f1: $.data.id } }
            - { call: "POST /api/fields", payload: { name: "F2", acreage: 100 }, as: FarmManager, captures: { f2: $.data.id } }
            - { call: "POST /api/planting-plans", payload: { field_id: "${f1}", crop_year: 2026, variety: "CASCADE", planned_acreage: 40 }, as: FarmManager, captures: { p1: $.data.id } }
