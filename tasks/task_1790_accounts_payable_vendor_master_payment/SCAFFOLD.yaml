  # --- approval matrix ---
  - method: POST
    path: "/approval-matrix-rules"
    description: "Create an ACTIVE approval matrix rule (half-open bracket per cost_center; GLOBAL fallback scope)"
    roles: [Controller]
    code: 201
    input: [cost_center, min_amount_cents, "max_amount_cents?", tier]
    output: ApprovalMatrixRule
    side_effects: ["AuditEvent CREATE"]

  - method: POST
    path: "/approval-matrix-rules/{id}/retire"
    description: "ACTIVE -> RETIRED"
    roles: [Controller]
    code: 200
    input: []
    output: ApprovalMatrixRule
    side_effects: ["AuditEvent RETIRE"]

  # --- invoices ---
  - method: POST
    path: "/invoices"
    description: "Create an invoice in RECEIVED for an ACTIVE vendor"
    roles: [APClerk, APSupervisor, APManager]
    code: 201
    input: [vendor_id, invoice_number, amount_cents, cost_center, "received_date?"]
    output: Invoice
    side_effects: ["status=RECEIVED"]

  - method: GET
    path: "/invoices"
    description: "List invoices"
    roles: [VendorSpecialist, VendorManager, ComplianceOfficer, APClerk, APSupervisor, APManager, Controller, TreasuryAnalyst, TreasuryManager, BankFileProcessor, Auditor, SystemAdmin]
    code: 200
    input: ["vendor_id?", "status?", "cost_center?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []

  - method: GET
    path: "/invoices/{id}"
    description: "Get an invoice"
    roles: [VendorSpecialist, VendorManager, ComplianceOfficer, APClerk, APSupervisor, APManager, Controller, TreasuryAnalyst, TreasuryManager, BankFileProcessor, Auditor, SystemAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: PATCH
    path: "/invoices/{id}"
    description: "Edit amount/cost_center/invoice_number while RECEIVED or REJECTED"
    roles: [APClerk, APSupervisor, APManager]
    code: 200
    input: ["amount_cents?", "cost_center?", "invoice_number?"]
    output: Invoice
    side_effects: []

  - method: POST
    path: "/invoices/{id}/submit"
    description: "RECEIVED -> PENDING_APPROVAL; snapshots required_tier"
    roles: [APClerk, APSupervisor, APManager]
    code: 200
    input: []
    output: Invoice
    side_effects: ["invoice_approval_routing snapshot", "approval_round=1, submitted_by_user_id=caller"]

  - method: POST
    path: "/invoices/{id}/approve"
    description: "Approve the next pending tier; final tier flips invoice APPROVED and snapshots provisional_discount_cents"
    roles: [APSupervisor, APManager, Controller]
    code: 200
    input: [tier]
    output: Invoice
    side_effects: ["InvoiceApproval row", "final tier: invoice_pay_amount provisional variant"]

  - method: POST
    path: "/invoices/{id}/reject"
    description: "Reject at the next pending tier -> REJECTED"
    roles: [APSupervisor, APManager, Controller]
    code: 200
    input: [tier, reason]
    output: Invoice
    side_effects: ["AuditEvent STATUS_CHANGE"]

  - method: POST
    path: "/invoices/{id}/resubmit"
    description: "REJECTED -> PENDING_APPROVAL; approval_round+1 and required_tier re-snapshotted against CURRENT matrix/timestamps"
    roles: [APClerk, APSupervisor, APManager]
    code: 200
    input: []
    output: Invoice
    side_effects: ["invoice_approval_routing re-snapshot"]

  - method: POST
    path: "/invoices/{id}/cancel"
    description: "RECEIVED|PENDING_APPROVAL|REJECTED -> CANCELLED"
    roles: [APClerk]
    code: 200
    input: ["reason?"]
    output: Invoice
    side_effects: []

  - method: GET
    path: "/invoices/{id}/approvals"
    description: "List approval rows (all rounds)"
    roles: [VendorSpecialist, VendorManager, ComplianceOfficer, APClerk, APSupervisor, APManager, Controller, TreasuryAnalyst, TreasuryManager, BankFileProcessor, Auditor, SystemAdmin]
    code: 200
    input: ["round_no?", "limit?", "offset?"]
    output: InvoiceApproval[]
    side_effects: []

  # --- payment runs & payments ---
  - method: POST
    path: "/payment-runs"
    description: "Create a DRAFT payment run"
    roles: [TreasuryAnalyst, TreasuryManager]
    code: 201
    input: [scheduled_date, payment_method]
    output: PaymentRun
    side_effects: ["created_by_user_id=caller, totals 0"]

  - method: GET
    path: "/payment-runs/{id}"
    description: "Get a payment run"
    roles: [VendorSpecialist, VendorManager, ComplianceOfficer, APClerk, APSupervisor, APManager, Controller, TreasuryAnalyst, TreasuryManager, BankFileProcessor, Auditor, SystemAdmin]
    code: 200
    input: []
    output: PaymentRun
    side_effects: []

  - method: POST
    path: "/payment-runs/{id}/invoices"
    description: "Add an APPROVED invoice to a DRAFT run; payment-time screening runs FIRST and a REVIEW/HIT suspends/blocks the vendor as a side effect of the failed add"
    roles: [TreasuryAnalyst]
    code: 201
    input: [invoice_id]
    output: Payment
    side_effects:
      - "sanctions_screening payment variant (side effects fire even when the add is rejected)"
      - "Payment PENDING created with bank snapshot (id+version), invoice_pay_amount final variant, WIRE fee"
      - "invoice APPROVED -> IN_PAYMENT_RUN; payment_run_totals maintained"

  - method: POST
    path: "/payments/{id}/void"
    description: "Void a PENDING payment (manual removal); invoice reverts to APPROVED, run recomputes, APPROVED run demotes"
    roles: [TreasuryAnalyst]
    code: 200
    input: []
    output: Payment
    side_effects: ["void_reason=MANUAL_REMOVED", "invoice IN_PAYMENT_RUN -> APPROVED", "payment_run_totals", "run APPROVED -> COMPILED auto-demote"]

  - method: POST
    path: "/payment-runs/{id}/compile"
    description: "DRAFT -> COMPILED; requires >= 1 non-VOIDED payment"
    roles: [TreasuryAnalyst]
    code: 200
    input: []
    output: PaymentRun
    side_effects: ["payment_run_totals recompute"]

  - method: POST
    path: "/payment-runs/{id}/uncompile"
    description: "COMPILED -> DRAFT"
    roles: [TreasuryAnalyst]
    code: 200
    input: []
    output: PaymentRun
    side_effects: []

  - method: POST
    path: "/payment-runs/{id}/approve"
    description: "COMPILED -> APPROVED (SoD-4a)"
    roles: [TreasuryManager]
    code: 200
    input: []
    output: PaymentRun
    side_effects: ["approved_by_user_id=caller"]

  - method: POST
    path: "/payment-runs/{id}/revoke-approval"
    description: "APPROVED -> COMPILED"
    roles: [TreasuryManager]
    code: 200
    input: []
    output: PaymentRun
    side_effects: ["approved_by_user_id=null"]

  - method: POST
    path: "/payment-runs/{id}/release"
    description: "APPROVED -> RELEASED (SoD-4b, bank snapshot freshness, daily_release_limit); payments PENDING -> RELEASED"
    roles: [TreasuryManager]
    code: 200
    input: []
    output: PaymentRun
    side_effects: ["released_at=now", "payments RELEASED (positive-pay file deemed issued)"]

  - method: POST
    path: "/payment-runs/{id}/positive-pay-acks"
    description: "Bank acks the issued file per payment: MATCH clears, MISMATCH voids with the fraud cascade; run closes when all payments terminal"
    roles: [BankFileProcessor]
    code: 200
    input: [acks]
    output: PaymentRun
    side_effects: ["per-item payment MATCH->CLEARED / MISMATCH->VOIDED chains", "run bubble-up to CLOSED"]

  - method: POST
    path: "/payment-runs/{id}/void"
    description: "DRAFT|COMPILED -> VOIDED; unwinds PENDING payments and their invoices"
    roles: [TreasuryAnalyst, TreasuryManager]
    code: 200
    input: []
    output: PaymentRun
    side_effects: ["payments PENDING -> VOIDED (RUN_VOIDED)", "invoices IN_PAYMENT_RUN -> APPROVED", "payment_run_totals"]

  - method: GET
    path: "/payment-runs/{id}/payments"
    description: "List payments of a run"
    roles: [VendorSpecialist, VendorManager, ComplianceOfficer, APClerk, APSupervisor, APManager, Controller, TreasuryAnalyst, TreasuryManager, BankFileProcessor, Auditor, SystemAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []

  - method: GET
    path: "/payments/{id}"
    description: "Get a payment"
    roles: [VendorSpecialist, VendorManager, ComplianceOfficer, APClerk, APSupervisor, APManager, Controller, TreasuryAnalyst, TreasuryManager, BankFileProcessor, Auditor, SystemAdmin]
    code: 200
    input: []
    output: Payment
    side_effects: []

  - method: GET
    path: "/payments"
    description: "List payments with FK filters"
    roles: [VendorSpecialist, VendorManager, ComplianceOfficer, APClerk, APSupervisor, APManager, Controller, TreasuryAnalyst, TreasuryManager, BankFileProcessor, Auditor, SystemAdmin]
    code: 200
    input: ["vendor_id?", "invoice_id?", "bank_account_id?", "status?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []

  # --- audit ---
  - method: GET
    path: "/audit-events"
    description: "Query the append-only master-data audit trail (no update/delete endpoints exist)"
    roles: [VendorManager, ComplianceOfficer, Controller, Auditor]
    code: 200
    input: ["entity_type?", "entity_id?", "actor_user_id?", "event_type?", "limit?", "offset?"]
    output: AuditEvent[]
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID / X-User-Role missing or role not declared" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not permitted on this endpoint, or approve/reject tier-role mismatch" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, invalid enum, non-positive amount, immutable tax_id in PATCH, valid_from > valid_until" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_vendor_version mismatch (OCC)" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Transition not allowed from current state (incl. terminal lockdown, edit outside RECEIVED/REJECTED, already-approved tier, confirm on CONFIRMED verification)" }
  - { id: ERR_CALLBACK_LOCKED, http: 409, condition: "Verification LOCKED (3rd mismatch also returns this and locks)" }
  - { id: ERR_CALLBACK_EXPIRED, http: 409, condition: "Verification EXPIRED past expires_at" }
  - { id: ERR_PAYMENT_ALREADY_TERMINAL, http: 409, condition: "Ack targets a CLEARED/VOIDED payment" }
  - { id: ERR_VENDOR_BLOCKED, http: 409, condition: "Vendor BLOCKED; also the error returned by a payment-time screening HIT (vendor blocks as side effect)" }
  - { id: ERR_SANCTIONS_REVIEW_PENDING, http: 409, condition: "OPEN case exists or payment-time screening returned REVIEW (vendor suspends + case opens as side effect)" }
  - { id: ERR_DUPLICATE_TAX_ID, http: 409, condition: "tax_id already present on a non-terminal vendor" }
  - { id: ERR_DUPLICATE_VENDOR_HARD_BLOCK, http: 409, condition: "Relaxed duplicate score >= 0.9000" }
  - { id: ERR_DUPLICATE_VENDOR_REVIEW_REQUIRED, http: 409, condition: "Relaxed score in [0.7500, 0.9000) without duplicate_acknowledged=true" }
  - { id: ERR_SOD_VENDOR_CREATOR_CANNOT_APPROVE, http: 403, condition: "SoD-1 on vendor approve" }
  - { id: ERR_SOD_INVOICE_SUBMITTER_CANNOT_APPROVE, http: 403, condition: "SoD-2 on invoice approve" }
  - { id: ERR_SOD_SAME_APPROVER_TWO_TIERS, http: 403, condition: "SoD-5: same user approved another tier this round" }
  - { id: ERR_SOD_RUN_CREATOR_CANNOT_APPROVE, http: 403, condition: "SoD-4a on run approve" }
  - { id: ERR_SOD_RUN_CREATOR_CANNOT_RELEASE, http: 403, condition: "SoD-4b on run release" }
  - { id: ERR_SOD_CALLBACK_REQUESTER_CANNOT_CONFIRM, http: 403, condition: "SoD-3 on callback confirm" }
  - { id: ERR_VENDOR_NOT_ACTIVE, http: 409, condition: "Vendor not ACTIVE for invoice create/submit/resubmit or run add" }
  - { id: ERR_REQUIRED_DOCUMENT_MISSING, http: 409, condition: "No W9 on file at all (vendor submit gate)" }
  - { id: ERR_DOCUMENT_PERIOD_OVERLAP, http: 409, condition: "Closed-interval overlap on (vendor, doc_type)" }
  - { id: ERR_RULE_RANGE_OVERLAP, http: 409, condition: "Half-open bracket overlap within a cost_center scope" }
  - { id: ERR_VENDOR_NOT_MERGEABLE, http: 409, condition: "Merge gate failed (state, self-merge, in-flight payments, OPEN case, invoice_number collision)" }
  - { id: ERR_NO_APPROVAL_RULE, http: 409, condition: "No ACTIVE matrix rule covers the amount in cost_center or GLOBAL scope" }
  - { id: ERR_APPROVAL_TIER_OUT_OF_ORDER, http: 409, condition: "Tier skip-ahead on approve/reject" }
  - { id: ERR_DUPLICATE_INVOICE_NUMBER, http: 409, condition: "invoice_number reuse per vendor among non-CANCELLED invoices" }
  - { id: ERR_BANK_ACCOUNT_NOT_VERIFIED, http: 409, condition: "No primary VERIFIED bank account at run add" }
  - { id: ERR_BANK_ACCOUNT_IN_USE, http: 409, condition: "Disable blocked by in-flight payments" }
  - { id: ERR_VENDOR_HAS_OPEN_CASE, http: 409, condition: "Reinstate blocked by OPEN sanctions case" }
  - { id: ERR_VENDOR_HAS_OPEN_INVOICES, http: 409, condition: "Deactivate blocked by open invoices" }
  - { id: ERR_EMPTY_PAYMENT_RUN, http: 409, condition: "Compile with zero non-VOIDED payments" }
  - { id: ERR_CALLBACK_CODE_MISMATCH, http: 409, condition: "Wrong verification code (attempts < 3)" }
  - { id: ERR_BANK_CHANGE_COOLING_OFF, http: 409, condition: "Primary account verified < 72h ago at run add" }
  - { id: ERR_DOCUMENT_EXPIRED, http: 409, condition: "W9 exists but its window has passed (live evaluation) at run add" }
  - { id: ERR_BANK_SNAPSHOT_STALE, http: 409, condition: "Vendor primary bank id/version changed since payment snapshot" }
  - { id: ERR_DAILY_LIMIT_EXCEEDED, http: 409, condition: "Release would push the logical day's released totals over TREASURY_DAILY_LIMIT_CENTS" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: VendorSpecialist
    description: "AP vendor desk clerk; creates and edits master data, requests bank changes"
    identity: opaque
    exclusive_operations: ["PATCH /vendors/{id}", "POST /vendors/{id}/bank-accounts", "POST /vendors/{id}/documents", "POST /documents/{id}/supersede"]
    shared_operations: ["POST /vendors", "POST /vendors/{id}/submit", "POST /bank-accounts/{id}/confirm-verification", "read endpoints"]
  - name: VendorManager
    description: "Vendor desk supervisor; approves, suspends, reinstates, merges; may also create (SoD-1 then bars self-approval)"
    identity: opaque
    exclusive_operations: ["POST /vendors/{id}/approve", "POST /vendors/{id}/reject", "POST /vendors/{id}/reinstate", "POST /vendors/{id}/reactivate", "POST /vendors/{id}/deactivate", "POST /vendors/{id}/merge", "POST /bank-accounts/{id}/disable"]
    shared_operations: ["POST /vendors", "POST /vendors/{id}/submit", "POST /vendors/{id}/suspend", "POST /bank-accounts/{id}/confirm-verification", "read endpoints"]
  - name: ComplianceOfficer
    description: "Sanctions/watchlist owner; dispositions review cases"
    identity: opaque
    exclusive_operations: ["POST /watchlist-entries", "POST /watchlist-entries/{id}/retire", "POST /sanctions-cases/{id}/disposition"]
    shared_operations: ["POST /vendors/{id}/suspend", "GET /audit-events", "read endpoints"]
  - name: APClerk
    description: "Invoice intake clerk"
    identity: opaque
    exclusive_operations: ["POST /invoices/{id}/cancel"]
    shared_operations: ["POST /invoices", "PATCH /invoices/{id}", "POST /invoices/{id}/submit", "POST /invoices/{id}/resubmit", "read endpoints"]
  - name: APSupervisor
    description: "Tier-1 invoice approver"
    identity: opaque
    exclusive_operations: ["invoice approve/reject at tier 1"]
    shared_operations: ["POST /invoices", "PATCH /invoices/{id}", "POST /invoices/{id}/submit", "POST /invoices/{id}/resubmit", "read endpoints"]
  - name: APManager
    description: "Tier-2 invoice approver"
    identity: opaque
    exclusive_operations: ["invoice approve/reject at tier 2"]
    shared_operations: ["POST /invoices", "PATCH /invoices/{id}", "POST /invoices/{id}/submit", "POST /invoices/{id}/resubmit", "read endpoints"]
  - name: Controller
    description: "Tier-3 invoice approver and approval-matrix administrator"
    identity: opaque
    exclusive_operations: ["invoice approve/reject at tier 3", "POST /approval-matrix-rules", "POST /approval-matrix-rules/{id}/retire"]
    shared_operations: ["GET /audit-events", "read endpoints"]
  - name: TreasuryAnalyst
    description: "Builds payment runs"
    identity: opaque
    exclusive_operations: ["POST /payment-runs/{id}/invoices", "POST /payments/{id}/void", "POST /payment-runs/{id}/compile", "POST /payment-runs/{id}/uncompile"]
    shared_operations: ["POST /payment-runs", "POST /payment-runs/{id}/void", "read endpoints"]
  - name: TreasuryManager
    description: "Approves and releases payment files (SoD-4 bars acting on self-created runs)"
    identity: opaque
    exclusive_operations: ["POST /payment-runs/{id}/approve", "POST /payment-runs/{id}/revoke-approval", "POST /payment-runs/{id}/release"]
    shared_operations: ["POST /payment-runs", "POST /payment-runs/{id}/void", "read endpoints"]
  - name: BankFileProcessor
    description: "Bank integration service account; submits positive-pay acknowledgements"
    identity: opaque
    exclusive_operations: ["POST /payment-runs/{id}/positive-pay-acks"]
    shared_operations: ["read endpoints"]
  - name: Auditor
    description: "Read-only assurance role"
    identity: opaque
    exclusive_operations: ["GET /audit-events"]
    shared_operations: ["read endpoints"]
  - name: SystemAdmin
    description: "Platform operator for the logical clock and ops-run sweep"
    identity: opaque
    exclusive_operations: ["POST /_clock/set_current_utc", "POST /vendor-sweeps/run"]
    shared_operations: ["read endpoints"]
