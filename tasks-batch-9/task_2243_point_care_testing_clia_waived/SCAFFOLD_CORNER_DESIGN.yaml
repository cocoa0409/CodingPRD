            - "${a_total} == 3 (GLUCOSE/2026, GLUCOSE/2027, HEMOGLOBIN_A1C/2026) and site B holds exactly 1"

      - name: pt_event_create_after_unsuccessful_participation_returns_enrollment_status_invalid
