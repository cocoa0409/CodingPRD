scaffold_corner_design:
  - section: entities
    instances:
      - name: dealer_creation_returns_envelope_with_server_minted_identity_and_defaults
        claim_type: creation
        grounds:
          - entities.Dealer
          - endpoints.POST_dealers
          - response_envelope.success
        distinguishing_aspect: "A single POST with every required input returns 201 and a full success envelope whose data carries the four common fields plus both computed money fields at their declared defaults; the id is a bare UUID with no type prefix."
        test_recipe:
          setup:
            - "Empty database; only the logical clock has been pinned so created_at is deterministic."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
          trigger:
            - call: "POST /incentives/dealers"
              payload: { dealer_code: "CRN-D-001", name: "Cornerstone Auto", region_code: "WEST", historical_volume_units: 10, market_opportunity_bps: 1500 }
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { dealer_id: $.data.id, dealer_created: $.data.created_at, dealer_updated: $.data.updated_at, dealer_version: $.data.version, dealer_status: $.data.status, dealer_paid: $.data.paid_cents, dealer_open: $.data.open_chargeback_cents }
          assert:
            - "HTTP 201, and the body has exactly the keys meta, response_type and data with response_type == \"object\""
            - "meta carries api_request_id and api_request_timestamp"
            - "${dealer_id} is a bare 36-character UUID with NO type prefix such as 'dlr_'"
            - "${dealer_version} == 1 and ${dealer_created} == ${dealer_updated} == 2026-08-01T00:00:00.000Z (three fractional digits, driven by the logical clock)"
            - "${dealer_status} == ACTIVE, ${dealer_paid} == 0 and ${dealer_open} == 0"
            - "dealer_code, name, region_code, historical_volume_units == 10 and market_opportunity_bps == 1500 are echoed verbatim"

      - name: program_retrieval_returns_every_stored_and_computed_field
        claim_type: retrieval
        grounds:
          - entities.IncentiveProgram
          - endpoints.GET_programs_id
        distinguishing_aspect: "GET /incentives/programs/{id} returns the same field values the create call reported, including the money-ledger fields at zero and the two type-conditional fields left at their defaults for a CUSTOMER_CASH program."
        test_recipe:
          setup:
            - "One DRAFT CUSTOMER_CASH program created with the nine required inputs and accrual_method UNIT_BASED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /incentives/programs"
              payload: { program_code: "CRN-P-001", name: "Corner Retrieval Cash", incentive_type: "CUSTOMER_CASH", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2026-09-01T00:00:00.000Z", per_unit_amount_cents: 111000, budget_cents: 12000000, stack_group: "CRN", priority_rank: 201, accrual_method: "UNIT_BASED" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { prog_id: $.data.id }
          trigger:
            - call: "GET /incentives/programs/${prog_id}"
              payload: {}
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { code: $.data.program_code, status: $.data.status, per_unit: $.data.per_unit_amount_cents, apr: $.data.apr_buydown_bps, residual: $.data.residual_support_bps, cap: $.data.stack_cap_cents, committed: $.data.committed_cents, paid: $.data.paid_cents, accrued: $.data.accrued_budget_cents, units: $.data.claimed_units, spend: $.data.per_unit_spend_cents, rimpact: $.data.residual_impact_bps, sub: $.data.submitted_by_user_id, appr: $.data.approved_by_user_id, sup: $.data.supersedes_program_id, ver: $.data.version }
          assert:
            - "HTTP 200 with response_type == \"object\""
            - "${code} == CRN-P-001, ${status} == DRAFT, ${per_unit} == 111000 and ${ver} == 1"
            - "${apr} == 0 and ${residual} == 0 and ${cap} == 0 — the type-conditional fields default rather than erroring on a CUSTOMER_CASH program"
            - "${committed} == 0, ${paid} == 0, ${accrued} == 0, ${units} == 0, ${spend} == 0 and ${rimpact} == 0"
            - "${sub} == null, ${appr} == null and ${sup} == null"

      - name: program_listing_paginates_and_filters_by_status_and_incentive_type
        claim_type: listing
        grounds:
          - endpoints.GET_programs
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Three programs of two incentive_types are listed with limit/offset and with the status and incentive_type filters; total_count reflects the FILTERED population, not the table, and has_more flips with the offset."
        test_recipe:
          setup:
            - "Three DRAFT programs: two CUSTOMER_CASH (CRN-L-1, CRN-L-2) and one LEASE_SUPPORT (CRN-L-3); one of the cash programs is submitted so it reaches PENDING_APPROVAL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /incentives/programs"
              payload: { program_code: "CRN-L-1", name: "List One", incentive_type: "CUSTOMER_CASH", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2026-09-01T00:00:00.000Z", per_unit_amount_cents: 100000, budget_cents: 12000000, stack_group: "CRNL", priority_rank: 211, accrual_method: "UNIT_BASED" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { p1: $.data.id }
            - call: "POST /incentives/programs/${p1}/eligibility-rules"
              payload: { model_code: "MX5", region_code: "WEST", build_date_from: "2026-05-01T00:00:00.000Z", build_date_to: "2026-07-31T00:00:00.000Z", allowed_deal_types: ["CASH"] }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
            - call: "POST /incentives/programs/${p1}/submit"
              payload: {}
              as: ProgramDesigner
              as_user_id: "u-designer-1"
            - call: "POST /incentives/programs"
              payload: { program_code: "CRN-L-2", name: "List Two", incentive_type: "CUSTOMER_CASH", effective_from: "2026-09-01T00:00:00.000Z", effective_to: "2026-10-01T00:00:00.000Z", per_unit_amount_cents: 100000, budget_cents: 12000000, stack_group: "CRNL", priority_rank: 212, accrual_method: "UNIT_BASED" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { p2: $.data.id }
            - call: "POST /incentives/programs"
              payload: { program_code: "CRN-L-3", name: "List Three", incentive_type: "LEASE_SUPPORT", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2026-09-01T00:00:00.000Z", per_unit_amount_cents: 100000, residual_support_bps: 300, budget_cents: 12000000, stack_group: "CRNL", priority_rank: 213, accrual_method: "UNIT_BASED" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { p3: $.data.id }
          trigger:
            - call: "GET /incentives/programs"
              payload: { limit: 2, offset: 0 }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { page1_first_code: "$.data[0].program_code" }
            - call: "GET /incentives/programs"
              payload: { limit: 2, offset: 2 }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { page2_first_code: "$.data[0].program_code" }
            - call: "GET /incentives/programs"
              payload: { incentive_type: "LEASE_SUPPORT" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { lease_first_code: "$.data[0].program_code" }
            - call: "GET /incentives/programs"
              payload: { status: "PENDING_APPROVAL" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { pending_first_code: "$.data[0].program_code" }
          assert:
            - "the unfiltered page-1 call returns response_type == \"array\", total_count == 3, has_more == true and exactly 2 rows"
            - "the offset-2 call returns total_count == 3, has_more == false and exactly 1 row"
            - "${page1_first_code} and ${page2_first_code} are different program_codes — offset advances the window rather than repeating it"
            - "the incentive_type == LEASE_SUPPORT call returns total_count == 1 with ${lease_first_code} == CRN-L-3"
            - "the status == PENDING_APPROVAL call returns total_count == 1 with ${pending_first_code} == CRN-L-1"
            - "omitting limit and offset entirely returns at most 10 rows with offset 0, per the declared pagination defaults"

      - name: unknown_program_id_returns_program_not_found
        claim_type: not_found
        grounds:
          - errors.ERR_PROGRAM_NOT_FOUND
          - validations.priority_5_existence
          - response_envelope.error
        distinguishing_aspect: "A syntactically valid UUID that matches no row returns 404 ERR_PROGRAM_NOT_FOUND through the error envelope, and the same UUID used as a path id on a sub-resource list returns the same error rather than an empty list."
        test_recipe:
          setup:
            - "Empty database apart from the clock pin; no program has ever been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
          trigger:
            - call: "GET /incentives/programs/11111111-2222-4333-8444-555555555555"
              payload: {}
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { err: $.data.error_id, msg: $.data.message }
            - call: "GET /incentives/programs/11111111-2222-4333-8444-555555555555/eligibility-rules"
              payload: {}
              as: ProgramDesigner
              as_user_id: "u-designer-1"
          assert:
            - "HTTP 404 with ${err} == ERR_PROGRAM_NOT_FOUND and a non-empty ${msg}"
            - "the error body has response_type == \"error\" and its data holds ONLY error_id and message — no partial program object"
            - "the sub-resource list on the same unknown id also returns HTTP 404 ERR_PROGRAM_NOT_FOUND, NOT HTTP 200 with an empty array"

      - name: delivery_create_missing_required_vin_returns_400
        claim_type: required_fields
        grounds:
          - entities.RetailDelivery.fields.vin
          - errors.ERR_INVALID_REQUEST
          - validations.priority_6_shape
        distinguishing_aspect: "vin has source input with no default, so omitting it is a shape violation caught at priority 6 — before the dealer-standing and eligibility checks — and no RetailDelivery row is created."
        test_recipe:
          setup:
            - "One ACTIVE dealer exists; no program is needed because the shape check precedes every business rule."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /incentives/dealers"
              payload: { dealer_code: "CRN-D-002", name: "Required Fields Motors", region_code: "WEST", historical_volume_units: 4, market_opportunity_bps: 0 }
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { dealer_id: $.data.id }
          trigger:
            - call: "POST /incentives/deliveries"
              payload: { dealer_id: "${dealer_id}", model_code: "MX5", trim_code: "BASE", build_date: "2026-06-01T00:00:00.000Z", msrp_cents: 3100000, sale_date: "2026-08-09T00:00:00.000Z", customer_region_code: "WEST", deal_type: "CASH" }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { err: $.data.error_id }
            - call: "GET /incentives/deliveries"
              payload: { dealer_id: "${dealer_id}" }
              as: ClaimsAuditor
              as_user_id: "u-auditor-1"
          assert:
            - "HTTP 400 with ${err} == ERR_INVALID_REQUEST"
            - "the delivery list for this dealer is empty (0 rows) — the refused create persisted nothing"
            - "the same call WITH vin succeeds, so vin is the only missing element"

      - name: eligibility_rule_defaults_apply_when_optional_inputs_are_omitted
        claim_type: defaults
        grounds:
          - entities.EligibilityRule.fields.trim_code
          - entities.EligibilityRule.fields.min_msrp_cents
          - entities.EligibilityRule.fields.max_msrp_cents
          - entities.EligibilityRule.fields.allowed_deal_types
        distinguishing_aspect: "Four optional inputs with four DIFFERENT default shapes — null, 0, null and a three-member array — are all materialised by omitting them, and the null trim_code then admits a delivery of any trim."
        test_recipe:
          setup:
            - "One DRAFT program to own the rule; the rule is created with only the four required inputs."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /incentives/programs"
              payload: { program_code: "CRN-P-DEF", name: "Defaults Program", incentive_type: "CUSTOMER_CASH", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2026-09-01T00:00:00.000Z", per_unit_amount_cents: 90000, budget_cents: 12000000, stack_group: "CRND", priority_rank: 221, accrual_method: "UNIT_BASED" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /incentives/programs/${prog_id}/eligibility-rules"
              payload: { model_code: "MX5", region_code: "WEST", build_date_from: "2026-05-01T00:00:00.000Z", build_date_to: "2026-07-31T00:00:00.000Z" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { rule_trim: $.data.trim_code, rule_min: $.data.min_msrp_cents, rule_max: $.data.max_msrp_cents, rule_deals: $.data.allowed_deal_types, rule_prog: $.data.program_id }
          assert:
            - "HTTP 201 with ${rule_trim} == null, ${rule_min} == 0, ${rule_max} == null and ${rule_deals} == [\"CASH\", \"FINANCE\", \"LEASE\"]"
            - "${rule_prog} == ${prog_id} — program_id comes from the path, never from the body"
            - "a null trim_code admits EVERY trim of MX5, and min_msrp_cents 0 with max_msrp_cents null admits every positive msrp_cents"

      - name: delivery_computed_and_system_fields_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.RetailDelivery.fields.reporting_lag_days
          - entities.RetailDelivery.fields.back_dated_flag
          - entities.RetailDelivery.fields.status
          - entities.RetailDelivery.fields.reported_at
          - calculations.back_dated_sale_detection
        distinguishing_aspect: "The create payload smuggles status, reported_at, reporting_lag_days and back_dated_flag; all four are recomputed or system-stamped, and the smuggled values (VALIDATED / a fake instant / 0 / false) never appear in the response."
        test_recipe:
          setup:
            - "One ACTIVE dealer; the logical clock is pinned to 2026-08-25 while the sale is dated 2026-08-01, which is a lag of 24 days and therefore genuinely back-dated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-25T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /incentives/dealers"
              payload: { dealer_code: "CRN-D-003", name: "Computed Fields Motors", region_code: "WEST", historical_volume_units: 4, market_opportunity_bps: 0 }
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { dealer_id: $.data.id }
          trigger:
            - call: "POST /incentives/deliveries"
              payload: { dealer_id: "${dealer_id}", vin: "VIN2842CMP000099", model_code: "MX5", trim_code: "BASE", build_date: "2026-06-01T00:00:00.000Z", msrp_cents: 3100000, sale_date: "2026-08-01T00:00:00.000Z", customer_region_code: "WEST", deal_type: "CASH", status: "VALIDATED", reported_at: "2026-08-02T00:00:00.000Z", reporting_lag_days: 0, back_dated_flag: false }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { d_status: $.data.status, d_reported: $.data.reported_at, d_lag: $.data.reporting_lag_days, d_flag: $.data.back_dated_flag, d_validator: $.data.validated_by_user_id, d_unwound: $.data.unwound_at, d_version: $.data.version }
          assert:
            - "${d_status} == REPORTED — the smuggled VALIDATED is ignored; only POST /incentives/deliveries/{id}/validate can move the status"
            - "${d_reported} == 2026-08-25T00:00:00.000Z, the logical clock, NOT the smuggled 2026-08-02T00:00:00.000Z"
            - "${d_lag} == 24 and ${d_flag} == true — both recomputed from (reported_at - sale_date), overriding the smuggled 0 / false"
            - "${d_validator} == null, ${d_unwound} == null and ${d_version} == 1"
            - "the response contains no echo of the four rejected keys under any other name"

      - name: claim_system_fields_start_at_their_declared_defaults
        claim_type: system_fields
        grounds:
          - entities.Claim.fields.validation_status
          - entities.Claim.fields.payment_status
          - entities.Claim.fields.snapshot_per_unit_cents
          - entities.Claim.fields.claim_type
        distinguishing_aspect: "A freshly submitted Claim carries validation_status SUBMITTED, payment_status UNPAID, both audit user ids null, a claim_type DERIVED from the program's incentive_type and a snapshot_per_unit_cents frozen from the program — five server-owned fields the dealer never supplies."
        test_recipe:
          setup:
            - "One ACTIVE CUSTOMER_CASH program with per_unit_amount_cents 118000 and an MX5/WEST/CASH rule."
            - "One ACTIVE dealer with one VALIDATED MX5/CASH delivery inside the program window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /incentives/dealers"
              payload: { dealer_code: "CRN-D-004", name: "System Fields Motors", region_code: "WEST", historical_volume_units: 4, market_opportunity_bps: 0 }
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { dealer_id: $.data.id }
            - call: "POST /incentives/programs"
              payload: { program_code: "CRN-P-SYS", name: "System Fields Cash", incentive_type: "CUSTOMER_CASH", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2026-09-01T00:00:00.000Z", per_unit_amount_cents: 118000, budget_cents: 12000000, stack_group: "CRNS", priority_rank: 231, accrual_method: "UNIT_BASED" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { prog_id: $.data.id }
            - call: "POST /incentives/programs/${prog_id}/eligibility-rules"
              payload: { model_code: "MX5", region_code: "WEST", build_date_from: "2026-05-01T00:00:00.000Z", build_date_to: "2026-07-31T00:00:00.000Z", allowed_deal_types: ["CASH"] }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
            - call: "POST /incentives/programs/${prog_id}/submit"
              payload: {}
              as: ProgramDesigner
              as_user_id: "u-designer-1"
            - call: "POST /incentives/programs/${prog_id}/approve"
              payload: {}
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /incentives/deliveries"
              payload: { dealer_id: "${dealer_id}", vin: "VIN2842SYS000001", model_code: "MX5", trim_code: "BASE", build_date: "2026-06-01T00:00:00.000Z", msrp_cents: 3100000, sale_date: "2026-08-07T00:00:00.000Z", customer_region_code: "WEST", deal_type: "CASH" }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { delivery_id: $.data.id }
            - call: "POST /incentives/deliveries/${delivery_id}/validate"
              payload: {}
              as: ClaimsAuditor
              as_user_id: "u-auditor-1"
            - call: "GET /incentives/programs/${prog_id}"
              payload: {}
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { pv: $.data.version }
          trigger:
            - call: "POST /incentives/claims"
              payload: { delivery_id: "${delivery_id}", program_id: "${prog_id}", claimed_amount_cents: 999999, expected_program_version: "${pv}" }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { c_vs: $.data.validation_status, c_ps: $.data.payment_status, c_type: $.data.claim_type, c_snap: $.data.snapshot_per_unit_cents, c_claimed: $.data.claimed_amount_cents, c_approved: $.data.approved_amount_cents, c_basis: $.data.rate_basis, c_batch: $.data.payment_batch_id, c_adj: $.data.adjudicated_by_user_id, c_rej: $.data.rejection_error_id, c_dealer: $.data.dealer_id, c_version: $.data.version }
          assert:
            - "${c_vs} == SUBMITTED and ${c_ps} == UNPAID — the two independent dimensions both start at their declared defaults"
            - "${c_type} == UNIT_INCENTIVE, derived from the program's CUSTOMER_CASH incentive_type"
            - "${c_snap} == 118000, frozen from the program at claim creation"
            - "${c_claimed} == 999999 is recorded verbatim while ${c_approved} == null and ${c_basis} == null until adjudication — the dealer's ask never becomes the payable amount"
            - "${c_batch} == null, ${c_adj} == null, ${c_rej} == null and ${c_version} == 1"
            - "${c_dealer} == ${dealer_id}, derived from the delivery rather than supplied in the payload"

      - name: program_invalid_incentive_type_enum_returns_400
        claim_type: type_constraints
        grounds:
          - entities.IncentiveProgram.fields.incentive_type
          - errors.ERR_INVALID_REQUEST
          - validations.priority_6_shape
        distinguishing_aspect: "Three distinct shape violations on the same endpoint all collapse to ERR_INVALID_REQUEST at priority 6: an out-of-enum incentive_type, a negative per_unit_amount_cents against its '>= 0' constraint, and a non-integer budget_cents."
        test_recipe:
          setup:
            - "Empty database apart from the clock pin."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
          trigger:
            - call: "POST /incentives/programs"
              payload: { program_code: "CRN-P-BAD1", name: "Bad Enum", incentive_type: "TRADE_IN_BONUS", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2026-09-01T00:00:00.000Z", per_unit_amount_cents: 100000, budget_cents: 12000000, stack_group: "CRNB", priority_rank: 241 }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { err1: $.data.error_id }
            - call: "POST /incentives/programs"
              payload: { program_code: "CRN-P-BAD2", name: "Bad Amount", incentive_type: "CUSTOMER_CASH", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2026-09-01T00:00:00.000Z", per_unit_amount_cents: -1, budget_cents: 12000000, stack_group: "CRNB", priority_rank: 242 }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
