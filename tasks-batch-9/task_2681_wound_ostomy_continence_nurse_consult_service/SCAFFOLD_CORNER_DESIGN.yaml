              payload: {}
              as: WocProgramDirector
          assert:
            - "Call 1 returns HTTP 404 with data.error_id == ERR_PATIENT_NOT_FOUND"
            - "Call 2 returns HTTP 404 with data.error_id == ERR_NURSE_NOT_FOUND"
            - "Call 3 returns HTTP 404 with data.error_id == ERR_CONSULT_NOT_FOUND"
            - "Call 4 returns HTTP 404 with data.error_id == ERR_ASSESSMENT_NOT_FOUND"
            - "Call 5 returns HTTP 404 with data.error_id == ERR_CASE_NOT_FOUND"
            - "Every one of calls 1-5 carries the failure envelope (success == false, data.error_id set, data.message non-empty) and no entity payload"
            - "Call 6 (control, the real id) returns HTTP 200 with data.id == ${p1_id} and data.status == ADMITTED — the 404s are id-specific, not table-wide"
            - "No probe mutated anything: Patient.${p1_id}.version == 2 (1 at creation, +1 from the one accepted assessment), SkinAssessment.${a1_id}.validation_status == PENDING_VALIDATION and PressureInjuryCase.${k1_id}.status == OPEN"

