            - "Third reopen returns ERR_COMPLAINT_REOPEN_LIMIT"
            - "ComplaintTicket.${c_id}.status == RESOLVED after failed reopen (no drift)"

  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers, depth >= 3 and >= 2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: batch_reject_cascade_depth3
        grounds:
          - state_machines.ProcessingBatch.OPEN_to_CLOSED_REJECTED
          - state_machines.DropEvent.FLAGGED_CONTAMINATED_to_REJECTED
          - state_machines.Site.OPERATIONAL_to_OPERATIONAL
          - calculations.site_posture
        distinguishing_aspect: |
          Depth-3 cascade from batch close: ProcessingBatch CLOSED_REJECTED →
          DropEvent verification_state → FLAGGED_CONTAMINATED + auto-created
          OPEN ContaminationReport (link 2) → Participant provisional credits
          reversed AND Site posture recomputed to WATCH from the new OPEN
          report (link 3). Different trigger than the agreement cascade.
        test_recipe:
          setup:
            - "Program ACTIVE with posture_contam_threshold=1 (single OPEN MAJOR report → WATCH)"
            - "Site OPERATIONAL, agreement, year-round material, participant with grant"
            - "One ACCEPTED drop 10.00/0.00 → participant has 10 provisional credits"
            - "Route collected 10.00 kg; batch OPEN with input_gross=10.00"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P7", fiscal_year: 2026, posture_contam_threshold: 1 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
