            - call: "POST /stores/launch-queues/grant"
              payload: { launch_id: "${launch_h1}", expected_theme_launch_version: "${launch_h1_v0}" }
              as: StoreAssociate
              captures: { occ_first: "$.data[0].status" }
            - call: "GET /stores/theme-launches/{id}"
              payload: {}
              as: StoreAssociate
              captures: { launch_h1_v1: $.data.version }
            - call: "POST /stores/launch-queues/grant"
              payload: { launch_id: "${launch_h1}", expected_theme_launch_version: "${launch_h1_v0}" }
              as: StoreAssociate
              captures: { occ_err: $.data.error_id }
          assert:
            - "the first batch grants and ThemeLaunch.${launch_h1}.exclusive_set_units_remaining == 0"
            - "the replayed batch returns error_id == ERR_STALE_VERSION"
            - "ThemeLaunch.${launch_h1}.version == ${launch_h1_v1} and it advanced by exactly 1 from the first batch"

      - name: stale_order_version_on_an_inspection_is_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[exit-inspection-stale-order]", "errors[ERR_INSPECTION_STALE_VERSION]", "endpoints.POST_/stores/exit-inspections"]
        distinguishing_aspect: "The inspection endpoint guards a different parent: recording an inspection against a one-version-old cup is rejected with the inspection stale-version error rather than the launch stale-version error."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Store LEGO-0231 with element 6801, one member, one bin holding 600 g, and one PENDING cup."]
          setup_api_calls:
