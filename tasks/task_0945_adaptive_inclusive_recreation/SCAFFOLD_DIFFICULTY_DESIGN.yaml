            - "FundingSource.${fs}.available_cents == 20000 and FundingSource.${fs}.encumbered_cents == 0 and FundingSource.${fs}.status == OPEN"
            - "Enrollment.${e1}.funding_status == QUOTED"
            - "OperatingPeriod.${p_cur}.status == OPEN, so the request was not blocked by the global write gate"

  # =========================================================================
  # Rule 8 — resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: staff_back_to_back_sessions_collide_because_of_the_turnaround_buffer
        grounds:
          - validations[priority=42]
          - errors[ERR_STAFF_TIME_CONFLICT]
          - entities.StaffAssignment.fields.session_id
        distinguishing_aspect: |
          Resource StaffMember, interval semantics = half-open intervals WIDENED by
          STAFF_TURNAROUND_BUFFER_MINUTES (30). A session starting exactly when the
          previous one ends (11:00 after 09:00-11:00) COLLIDES, while one starting at
          11:30 does not — the buffer, not the raw interval, decides.
        test_recipe:
          setup:
            - "A LOW-risk program with no certification requirements."
            - "Three same-day DRAFT sessions: X 09:00-11:00Z, Y 11:00-13:00Z and Z 11:30-13:30Z on 2026-06-10."
            - "One staff member already holding a PROPOSED GROUP assignment on session X."
          setup_api_calls:
            - call: "POST /recreation/activity-programs"
              payload: { name: "Inclusive Fitness", activity_type: "FITNESS", risk_tier: "LOW", pricing_mode: "PER_SESSION", rounding_policy: "ROUND_ON_TOTAL", waitlist_policy: "FIFO", fee_multiplier_bp: 10000, scheduled_session_count: 3, required_consent_types: [], required_certification_types: [], requires_medication_admin: false }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /recreation/program-sessions"
              payload: { program_id: "${prog}", start_at: "2026-06-10T09:00:00Z", end_at: "2026-06-10T11:00:00Z", slot_capacity: 2, one_to_one_pool_size: 0 }
              as: ProgramAdmin
              captures: { sx: "$.data.id" }
            - call: "POST /recreation/program-sessions"
              payload: { program_id: "${prog}", start_at: "2026-06-10T11:00:00Z", end_at: "2026-06-10T13:00:00Z", slot_capacity: 2, one_to_one_pool_size: 0 }
              as: ProgramAdmin
              captures: { sy: "$.data.id" }
            - call: "POST /recreation/program-sessions"
              payload: { program_id: "${prog}", start_at: "2026-06-10T11:30:00Z", end_at: "2026-06-10T13:30:00Z", slot_capacity: 2, one_to_one_pool_size: 0 }
              as: ProgramAdmin
              captures: { sz: "$.data.id" }
            - call: "POST /recreation/staff-members"
              payload: { full_name: "Dana Lead", role_title: "Recreation Therapist" }
              as: ProgramAdmin
              captures: { st1: "$.data.id" }
            - call: "POST /recreation/staff-assignments"
              payload: { session_id: "${sx}", staff_member_id: "${st1}", assignment_role: "GROUP" }
              as: ProgramAdmin
              captures: { asg_x: "$.data.id" }
          trigger:
            - call: "POST /recreation/staff-assignments"
              payload: { session_id: "${sy}", staff_member_id: "${st1}", assignment_role: "GROUP" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
            - call: "POST /recreation/staff-assignments"
              payload: { session_id: "${sz}", staff_member_id: "${st1}", assignment_role: "GROUP" }
              as: ProgramAdmin
              captures: { asg_z: "$.data.id", asg_z_status: "$.data.status" }
          assert:
            - "The assignment on session Y returns HTTP 409 with data.error_id == ERR_STAFF_TIME_CONFLICT"
            - "The assignment on session Z returns HTTP 201 with StaffAssignment.${asg_z}.status == PROPOSED"
            - "ProgramSession.${sy}.assigned_group_staff_count == 0"
            - "ProgramSession.${sz}.assigned_group_staff_count == 1"

      - name: participant_back_to_back_sessions_do_not_collide_but_a_real_overlap_does
        grounds:
          - validations[priority=43]
          - errors[ERR_PARTICIPANT_TIME_CONFLICT]
          - entities.Enrollment.fields.session_id
        distinguishing_aspect: |
          Resource Participant on a different entity, with STRICTLY half-open intervals
          and NO buffer: 11:00 after 09:00-11:00 is accepted, which is the exact
          opposite outcome from the staff rule on the identical pair of sessions; only a
          genuine interior overlap (10:00-12:00) is rejected.
        test_recipe:
          setup:
            - "A LOW-risk program with three OPEN sessions on 2026-06-10: X 09:00-11:00Z, Y 11:00-13:00Z and W 10:00-12:00Z."
            - "One ACTIVE INDEPENDENT participant with no enrollments yet."
          setup_api_calls:
            - call: "POST /recreation/fee-scale-bands"
              payload: { household_size_min: 1, household_size_max: 6, income_band: "BAND_C", per_session_cents: 4000, series_cents: 24000 }
              as: ProgramAdmin
              captures: { band_c: "$.data.id" }
            - call: "POST /recreation/activity-programs"
              payload: { name: "Inclusive Fitness", activity_type: "FITNESS", risk_tier: "LOW", pricing_mode: "PER_SESSION", rounding_policy: "ROUND_ON_TOTAL", waitlist_policy: "FIFO", fee_multiplier_bp: 10000, scheduled_session_count: 3, required_consent_types: [], required_certification_types: [], requires_medication_admin: false }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /recreation/program-sessions"
              payload: { program_id: "${prog}", start_at: "2026-06-10T09:00:00Z", end_at: "2026-06-10T11:00:00Z", slot_capacity: 2, one_to_one_pool_size: 0 }
              as: ProgramAdmin
              captures: { sx: "$.data.id" }
            - call: "POST /recreation/program-sessions"
              payload: { program_id: "${prog}", start_at: "2026-06-10T11:00:00Z", end_at: "2026-06-10T13:00:00Z", slot_capacity: 2, one_to_one_pool_size: 0 }
              as: ProgramAdmin
              captures: { sy: "$.data.id" }
            - call: "POST /recreation/program-sessions"
              payload: { program_id: "${prog}", start_at: "2026-06-10T10:00:00Z", end_at: "2026-06-10T12:00:00Z", slot_capacity: 2, one_to_one_pool_size: 0 }
              as: ProgramAdmin
              captures: { sw: "$.data.id" }
            - call: "POST /recreation/participants"
              payload: { legal_name: "Ada Rivera", date_of_birth: "2010-03-04", household_id: "HH-1", household_size: 3, income_band: "BAND_C", weight_kg: 40, mobility_profile: "AMBULATORY", guardianship_status: "GUARDIAN_REQUIRED" }
              as: IntakeCoordinator
              captures: { p1: "$.data.id", p1_v: "$.data.version" }
            - call: "POST /recreation/support-assessments"
              payload: { participant_id: "${p1}", assessed_on: "2026-04-01", effective_from: "2026-04-01T00:00:00Z", support_tier: "INDEPENDENT", expected_participant_version: "${p1_v}" }
              as: IntakeCoordinator
              captures: { a1: "$.data.id" }
            - call: "POST /recreation/support-assessments/${a1}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /recreation/participants/${p1}/status"
              payload: { target_status: "ACTIVE" }
              as: IntakeCoordinator
            - call: "POST /recreation/program-sessions/${sx}/open"
              payload: {}
              as: ProgramAdmin
            - call: "POST /recreation/program-sessions/${sy}/open"
              payload: {}
              as: ProgramAdmin
            - call: "POST /recreation/program-sessions/${sw}/open"
              payload: {}
              as: ProgramAdmin
            - call: "GET /recreation/program-sessions/${sx}"
              payload: {}
              as: ProgramAdmin
              captures: { sx_v: "$.data.version" }
            - call: "GET /recreation/program-sessions/${sy}"
              payload: {}
              as: ProgramAdmin
              captures: { sy_v: "$.data.version" }
            - call: "GET /recreation/program-sessions/${sw}"
              payload: {}
              as: ProgramAdmin
              captures: { sw_v: "$.data.version" }
          trigger:
            - call: "POST /recreation/enrollments"
              payload: { participant_id: "${p1}", session_id: "${sx}", expected_session_version: "${sx_v}" }
              as: IntakeCoordinator
              captures: { e_x: "$.data.id" }
            - call: "POST /recreation/enrollments"
              payload: { participant_id: "${p1}", session_id: "${sy}", expected_session_version: "${sy_v}" }
              as: IntakeCoordinator
              captures: { e_y: "$.data.id" }
            - call: "POST /recreation/enrollments"
              payload: { participant_id: "${p1}", session_id: "${sw}", expected_session_version: "${sw_v}" }
              as: IntakeCoordinator
              captures: { err: "$.data.error_id" }
          assert:
