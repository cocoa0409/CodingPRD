  # =========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: bpc_risk_points_ge_probation_threshold
        grounds:
          - calculations.risk_status_from_points
          - entities.Chapter.fields.risk_status
          - entities.RiskIncident.fields.severity_points
        distinguishing_aspect: |
          Boundary at risk_points = PROBATION_THRESHOLD = 6: >= 6 -> PROBATION,
          5 -> GOOD_STANDING. Metric is integer risk_points; endpoint is POST
          /risk-incidents. Different metric and endpoint from instance B
          (party time-interval adjacency on POST /invitations/{id}/accept).
        test_recipe:
          setup:
            - "Chapter N at risk_points=5 (one ACTIVE incident severity_points=5)."
          setup_api_calls:
            - call: "POST /rush/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PanhellenicAdmin
            - call: "POST /rush/chapters"
              payload: { name: "Nu", greek_type: "FRATERNITY", quota_total: 5, dues_per_member_cents: 10000, legacy_priority_slots: 0 }
              as: PanhellenicAdmin
              captures: { ch_n: $.data.id }
            - call: "POST /rush/risk-incidents"
              payload: { chapter_id: "${ch_n}", severity_points: 5, reason: "noise" }
              as: RiskOfficer
              captures: { ri1: $.data.id }
            - call: "GET /rush/chapters/${ch_n}"
              payload: {}
              as: PanhellenicAdmin
              captures: { status_at_5: $.data.risk_status, points_at_5: $.data.risk_points }
          trigger:
            - call: "POST /rush/risk-incidents"
              payload: { chapter_id: "${ch_n}", severity_points: 1, reason: "boundary push" }
              as: RiskOfficer
              captures: { ri2: $.data.id }
          assert:
            - "Before trigger: status_at_5 == 'GOOD_STANDING' AND points_at_5 == 5 (>= threshold semantics: 5 < 6 is below)."
            - "After trigger: Chapter ${ch_n}.risk_points == 6 (exact PROBATION_THRESHOLD)."
            - "After trigger: Chapter ${ch_n}.risk_status == PROBATION (>= 6, not >)."

      - name: bpc_party_time_adjacency_at_zero_gap_does_not_collide
        grounds:
          - validations[priority=8]
          - state_machines.PartyInvitation.INVITED_to_ACCEPTED
          - entities.Party.fields.scheduled_start_utc
          - entities.Party.fields.duration_minutes
        distinguishing_aspect: |
          Boundary: half-open interval [start, start + duration). PNM
          accepting two adjacent invitations where party A ends EXACTLY at
          time T and party B starts EXACTLY at time T (zero-gap adjacency)
          must NOT collide (>= vs > on the temporal axis). Different metric
          (datetime interval) and different endpoint (POST
          /invitations/{id}/accept) than instance A (integer risk_points).
        test_recipe:
          setup:
            - "Two OPEN parties on different chapters: party A 18:00-19:00 UTC, party B 19:00-20:00 UTC (zero gap)."
            - "PNM O1 is INVITED to both."
          setup_api_calls:
            - call: "POST /rush/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PanhellenicAdmin
            - call: "POST /rush/chapters"
              payload: { name: "Xi", greek_type: "SORORITY", quota_total: 5, dues_per_member_cents: 10000, legacy_priority_slots: 0 }
              as: PanhellenicAdmin
              captures: { ch_o1: $.data.id }
            - call: "POST /rush/chapters"
              payload: { name: "Omicron", greek_type: "SORORITY", quota_total: 5, dues_per_member_cents: 10000, legacy_priority_slots: 0 }
              as: PanhellenicAdmin
              captures: { ch_o2: $.data.id }
            - call: "POST /rush/rounds"
              payload: { cycle_label: "Fall 2026 bpc2", bid_day_at: "2026-09-15T12:00:00Z" }
              as: PanhellenicAdmin
              captures: { rnd: $.data.id }
            - call: "POST /rush/pnms/register"
              payload: { full_name: "O1", gpa: 3.50 }
              as: Anonymous
              captures: { o1: $.data.id }
            - call: "POST /rush/pnms/${o1}/activate"
              payload: {}
              as: RecruitmentChair
            - call: "POST /rush/parties"
              payload: { round_id: "${rnd}", chapter_id: "${ch_o1}", scheduled_start_utc: "2026-09-05T18:00:00Z", duration_minutes: 60, capacity: 10 }
              as: ChapterOfficer
              as_user_id: "${ch_o1}"
              captures: { p_a: $.data.id }
            - call: "POST /rush/parties"
              payload: { round_id: "${rnd}", chapter_id: "${ch_o2}", scheduled_start_utc: "2026-09-05T19:00:00Z", duration_minutes: 60, capacity: 10 }
              as: ChapterOfficer
              as_user_id: "${ch_o2}"
              captures: { p_b: $.data.id }
            - call: "POST /rush/parties/${p_a}/open"
              payload: {}
              as: ChapterOfficer
              as_user_id: "${ch_o1}"
            - call: "POST /rush/parties/${p_b}/open"
              payload: {}
              as: ChapterOfficer
              as_user_id: "${ch_o2}"
            - call: "POST /rush/invitations"
              payload: { party_id: "${p_a}", pnm_id: "${o1}" }
              as: ChapterOfficer
              as_user_id: "${ch_o1}"
              captures: { inv_a: $.data.id }
            - call: "POST /rush/invitations"
              payload: { party_id: "${p_b}", pnm_id: "${o1}" }
