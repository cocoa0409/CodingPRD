        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[business-plan-create-stale-group]
          - errors[ERR_STALE_GROUP_VERSION]
          - validations[priority=7]
          - endpoints[POST /de-novo/business-plans]
        distinguishing_aspect: >
          A genuinely stale token: the version is read while the group has four organizers, the fifth
          organizer and its background results then bump it, and the plan create carrying the old
          token is refused 412 - the identical body with the re-read token is accepted, so the only
          difference between failure and success is the version field.
        test_recipe:
          setup:
            - "One OrganizingGroup that first has four cleared organizers; its version at that moment is"
            - "captured as ${g_v_stale}."
            - "A fifth organizer is then added and cleared, which bumps OrganizingGroup.version several"
            - "times; the new value is captured as ${g_v_fresh}, and ${g_v_stale} is now strictly behind."
