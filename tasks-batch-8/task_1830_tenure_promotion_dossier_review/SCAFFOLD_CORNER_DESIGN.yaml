  # ===========================================================================
  - section: rbac
    instances:
      - name: rbac_exclusive_operations_denied
        claim_type: rbac_deny
        grounds: [roles (§1.7), "validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Role-permission denials fire at priority 2 (before existence): Candidate creating a case, ProvostOfficer archiving, ProvostOfficer resolving an appeal, ProvostOfficer setting the clock, CommitteeVoter opening a round — all ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["one candidate + one case exist (for endpoints needing an existing path id where role passes); role checks on foreign-role endpoints fire regardless"]
          setup_api_calls:
            - { call: "POST /api/candidates", payload: { full_name: "Cand RB", employee_id: "E9500", department: "CS", college: "ENG", tenure_clock_start: "2020-08-01" }, as: ProvostOfficer, captures: { cand_rb: $.data.id } }
            - { call: "POST /api/cases", payload: { candidate_id: "${cand_rb}", review_cycle: "2026-2027", target_rank: "ASSOCIATE_PROFESSOR", seeking_tenure: true, clock_policy: "ANNIVERSARY" }, as: ProvostOfficer, as_user_id: "po_creator", captures: { case_rb: $.data.id } }
          trigger:
            - { call: "POST /api/cases", payload: { candidate_id: "${cand_rb}", review_cycle: "2026-2027", target_rank: "ASSOCIATE_PROFESSOR", seeking_tenure: true, clock_policy: "ANNIVERSARY" }, as: Candidate, as_user_id: "${cand_rb}", captures: { err_rb1: $.data.error_id } }
            - { call: "POST /api/cases/${case_rb}/archive", as: ProvostOfficer, captures: { err_rb2: $.data.error_id } }
            - { call: "POST /api/appeals/00000000-0000-4000-8000-000000000000/resolve", payload: { resolution: "DENIED", resolution_text: "x" }, as: ProvostOfficer, captures: { err_rb3: $.data.error_id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProvostOfficer, captures: { err_rb4: $.data.error_id } }
            - { call: "POST /api/rounds/00000000-0000-4000-8000-000000000000/open", as: CommitteeVoter, as_user_id: "00000000-0000-4000-8000-000000000000", captures: { err_rb5: $.data.error_id } }
          assert:
            - "err_rb1 == ERR_FORBIDDEN_ROLE (Candidate cannot create cases)"
            - "err_rb2 == ERR_FORBIDDEN_ROLE (archive is RecordsOfficer-only)"
            - "err_rb3 == ERR_FORBIDDEN_ROLE (resolve is AppealOfficer-only; role fires before the nonexistent appeal's 404)"
            - "err_rb4 == ERR_FORBIDDEN_ROLE (clock is SystemAdmin-only)"
            - "err_rb5 == ERR_FORBIDDEN_ROLE (open is CommitteeChair-only)"

      - name: rbac_confidentiality_seal_conditional_on_waiver
        claim_type: conditional_validation
        grounds: ["validations[priority=5]", "errors[ERR_CONFIDENTIAL_LETTERS_SEALED]", entities.TenureCase.fields.waiver_signed]
        distinguishing_aspect: "Conditional RBAC: the SAME candidate role reads are sealed when the case has waiver_signed == true (ERR_CONFIDENTIAL_LETTERS_SEALED on invitations/rounds/votes of the own case) and allowed when waiver_signed == false — the flag flips the read path."
        test_recipe:
          setup: ["case A waiver_signed true (default) for candidate A; case B waiver_signed false for candidate B; neither has invitations yet"]
          setup_api_calls:
            - { call: "POST /api/candidates", payload: { full_name: "Cand CF", employee_id: "E9501", department: "CS", college: "ENG", tenure_clock_start: "2020-08-01" }, as: ProvostOfficer, captures: { cand_cf: $.data.id } }
            - { call: "POST /api/candidates", payload: { full_name: "Cand CG", employee_id: "E9502", department: "CS", college: "ENG", tenure_clock_start: "2020-08-01" }, as: ProvostOfficer, captures: { cand_cg: $.data.id } }
            - { call: "POST /api/cases", payload: { candidate_id: "${cand_cf}", review_cycle: "2026-2027", target_rank: "ASSOCIATE_PROFESSOR", seeking_tenure: true, clock_policy: "ANNIVERSARY", waiver_signed: true }, as: ProvostOfficer, as_user_id: "po_creator", captures: { case_cf: $.data.id } }
            - { call: "POST /api/cases", payload: { candidate_id: "${cand_cg}", review_cycle: "2026-2027", target_rank: "ASSOCIATE_PROFESSOR", seeking_tenure: true, clock_policy: "ANNIVERSARY", waiver_signed: false }, as: ProvostOfficer, as_user_id: "po_creator", captures: { case_cg: $.data.id } }
          trigger:
            - { call: "GET /api/invitations?case_id=${case_cf}", as: Candidate, as_user_id: "${cand_cf}", captures: { err_cf1: $.data.error_id } }
            - { call: "GET /api/rounds?case_id=${case_cf}", as: Candidate, as_user_id: "${cand_cf}", captures: { err_cf2: $.data.error_id } }
            - { call: "GET /api/invitations?case_id=${case_cg}", as: Candidate, as_user_id: "${cand_cg}", captures: { cg_list: $.data } }
            - { call: "GET /api/cases/${case_cf}", as: Any, captures: { cf_stage: $.data.stage } }
          assert:
            - "err_cf1 == ERR_CONFIDENTIAL_LETTERS_SEALED (waived candidate cannot list invitations of own case)"
            - "err_cf2 == ERR_CONFIDENTIAL_LETTERS_SEALED (rounds equally sealed)"
            - "GET on case_cg returns 200 with an empty data array (waiver_signed false unseals)"
            - "cf_stage == DOSSIER_ASSEMBLY (non-confidential case reads remain open to the candidate)"

