      - name: parallel_processing_and_fee_dimensions_move_independently
        claim_type: Parallel dimensions
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.PublicRecordsRequest.processing_status
          - state_machines.PublicRecordsRequest.fee_status
        distinguishing_aspect: |
          The two dimensions of PublicRecordsRequest advance on disjoint triggers, so a
          fee-side move must leave processing_status frozen and vice versa, and the
          combined pair is what gates release.
        excluded_because:
          difficulty_instance: request_parallel_dimensions_evolve_independently
          rationale: |
            That §1.8 instance already walks both dimensions through four interleaved
            writes and asserts the exact (processing_status, fee_status) pair after each
            one, including the cross-dimension RELEASED + SETTLED -> CLOSED junction.
            A second parallel-shape test would replay the same edges.
      - name: qa_rework_loop_returns_task_to_qa_pending
        claim_type: Cyclic
        grounds:
          - state_machines.RedactionTask.transitions.QA_REJECTED->QA_PENDING
          - entities.RedactionTask.fields.rework_count
          - entities.RedactionTask.fields.logged_labor_minutes
        distinguishing_aspect: |
          The QA loop can repeat without bound, incrementing rework_count each pass and
          OVERWRITING logged_labor_minutes rather than accumulating it.
        excluded_because:
          difficulty_instance: redaction_task_qa_rework_cycle_repeats_qa_pending
          rationale: |
            That §1.8 instance drives two full DRAFT -> QA_PENDING -> QA_REJECTED laps
            and pins rework_count, the overwritten logged_labor_minutes and the
            reviewer's open_qa_assignment_count at every stop of the loop.
      - name: sustained_full_withhold_cascades_down_and_bubbles_up
        claim_type: Cascade down and bubble up
        grounds:
          - state_machines.ExemptionClaim.transitions.ASSERTED->SUSTAINED
          - state_machines.ResponsiveRecord.transitions.RESPONSIVE->WITHHELD_IN_FULL
          - state_machines.RedactionTask.transitions.DRAFT->CANCELLED
          - state_machines.PublicRecordsRequest.processing_status.transitions.REDACTION->RELEASE_READY
        distinguishing_aspect: |
          One adjudication has to walk claim -> record -> tasks -> reviewer load and then
          bubble the request up to RELEASE_READY, touching only non-terminal children.
        excluded_because:
          difficulty_instance: sustained_full_withhold_cascade_depth_four
          rationale: |
            That §1.8 instance is the four-link chain itself, and it already asserts the
            untouched APPROVED task, the decremented reviewer counter, the STALE estimate
            fan-out and the bubbled-up request state from a single call.
      - name: litigation_hold_cascades_down_to_every_matching_recording
        claim_type: Cascade down
        grounds:
          - state_machines.VideoAsset.transitions.SCHEDULED->SUSPENDED
          - entities.LitigationHold.fields.suspended_asset_count
          - entities.VideoAsset.fields.retention_locked
        distinguishing_aspect: |
          A hold placed on an incident number fans out to every recording of that
          incident, skipping already-PURGED rows, and counts exactly the rows it moved.
        excluded_because:
          difficulty_instance: litigation_hold_suspension_cascade_depth_three
          rationale: |
            That §1.8 instance places one hold over three recordings of the same incident
            (one already purged) and pins retention_locked, disposition_state,
            suspended_by_hold_id and suspended_asset_count across the whole fan-out.
      - name: responsive_ruling_is_guarded_by_the_parent_request_state
        claim_type: Guarded transition
        grounds:
          - state_machines.ResponsiveRecord.transitions.CANDIDATE->RESPONSIVE
          - validations.priority_8
          - errors.ERR_REQUEST_STATE_INVALID
        distinguishing_aspect: |
          CANDIDATE -> RESPONSIVE is a cross-entity guarded edge: it is legal only while
          the parent request is SCOPING or EXEMPTION_REVIEW, so an INTAKE parent must be
          refused even though the record itself is in the right state.
        excluded_because:
          difficulty_instance: responsive_ruling_requires_request_past_intake
          rationale: |
            That §1.8 instance fires the ruling against an INTAKE request, asserts
            ERR_REQUEST_STATE_INVALID and the untouched CANDIDATE row, then clarifies the
            scope and replays the identical call to success.
  - section: calculations
    instances:
      - name: review_minutes_ceil_the_duration_then_ceil_the_product
        claim_type: Precision
        grounds:
          - calculations.record_review_minutes
          - entities.ResponsiveRecord.fields.estimated_review_minutes
          - entities.VideoAsset.fields.duration_ms
        distinguishing_aspect: |
          The ceil is applied twice and the order is observable: 90001 ms is 2 whole
          minutes, so JUVENILE_CONTACT bills ceil(2 * 2.5) == 5 and
          OFFICER_INVOLVED_SHOOTING ceil(2 * 3.0) == 6, whereas ceil'ing only the
