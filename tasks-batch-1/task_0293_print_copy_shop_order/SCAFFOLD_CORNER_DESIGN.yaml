        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[order-confirm-stale-version]", "validations[priority=6]", "errors[ERR_STALE_ORDER_VERSION]"]
        distinguishing_aspect: "A confirm carrying a stale expected_order_version (one behind the current version after a reorder bumped it) is rejected ERR_STALE_ORDER_VERSION 412."
