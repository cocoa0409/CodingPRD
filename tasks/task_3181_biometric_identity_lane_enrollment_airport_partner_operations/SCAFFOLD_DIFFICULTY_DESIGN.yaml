            - "${err} == ERR_MEMBER_UNDERAGE (age check at priority 5 wins over the document-expiry check at priority 6)"
            - "HTTP status is 422"
            - "Enrollment.${enr_id}.status == DRAFT (no transition fired)"

      - name: state_vs_fiscal_lane_open_on_planned_with_capacity_breach
        grounds:
          - validations[priority=11]
          - validations[priority=12]
          - errors[ERR_AGREEMENT_NOT_ACTIVE]
          - errors[ERR_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Pair: business_referential(agreement must be ACTIVE, p11) vs
          business_fiscal(capacity footprint, p12). Opening a lane whose
          agreement is SUSPENDED AND whose capacity would breach the
          footprint returns ERR_AGREEMENT_NOT_ACTIVE, not
          ERR_CAPACITY_EXCEEDED — referential outranks fiscal.
