      - name: five_induction_lifecycle_ids_across_two_full_bump_laps_one_clock_advance_and_one_elective_38_week
        claim_type: Error Triggerability
        grounds:
          - errors[ERR_ELECTIVE_INDUCTION_GESTATIONAL_AGE]
          - errors[ERR_INDUCTION_NOT_BUMPABLE]
          - errors[ERR_INDUCTION_BUMP_LIMIT_REACHED]
          - errors[ERR_INDUCTION_WINDOW_PASSED]
          - errors[ERR_INDUCTION_ADMIT_TOO_EARLY]
          - validations[priority 8.09]
          - validations[priority 11.8]
          - validations[priority 14.2]
          - calculations.induction_priority_class
          - state_machines[InductionBooking]
        distinguishing_aspect: |
          ERR_INDUCTION_BUMP_LIMIT_REACHED is only reachable after two complete
          hold -> bump -> requeue laps, and at that instant the booking has ALSO been promoted to
          MEDICALLY_INDICATED by calc induction_priority_class step 4 -- so both clauses of rule 8.09
          are violated and the limit clause must win. A MEDICALLY_INDICATED-by-indication booking that
          has never been bumped violates only the second clause and must answer ERR_INDUCTION_NOT_BUMPABLE.
          The two probes together pin the intra-rule ordering that a single-clause implementation
          collapses. The elective probe additionally shows rule 11.8 firing on hold-capacity (not just
          on confirm) for an ELECTIVE_NO_INDICATION booking at 38 weeks, and the requeue probe shows
          that WINDOW_PASSED depends on the clock, not on the booking, since the identical call would
          have succeeded four hours earlier.
        test_recipe:
          setup: |
            Clock 2026-08-01T06:00:00Z. One unit with FOUR AVAILABLE LDR beds (three holds are live at
            once and available_ldr_beds must never reach 0, which would flip posture to DIVERT and change
            turnover_buffer_minutes from 45 to 75). A VALIDATED DECISION_TO_INCISION drill at
            measured_d2i_minutes 10 with no ACTIVE OR_STANDBY shift, so cesarean_readiness_state is
            DEGRADED, coverage_deficit_units is 0 and staffing_posture is OPEN (buffer 45, every
            projected_occupancy_minutes 60 + 45 = 105). Five REQUESTED bookings, all expected_labor_minutes
            60: elec (ELECTIVE_NO_INDICATION, 38 weeks, start 12:00, PATIENT_REQUEST), med (PREECLAMPSIA,
            39 weeks, start 12:00, MEDICALLY_INDICATED), cycle (GDM_CONTROLLED, 39 weeks, start 20:00,
            ELECTIVE_39_WEEK), past (GDM_CONTROLLED, 39 weeks, start 09:00, ELECTIVE_39_WEEK) and
