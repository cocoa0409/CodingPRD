        distinguishing_aspect: "A newly minted obligation sits at the origin of BOTH parallel axes — election_status PENDING_ELECTION and settlement_status UNSETTLED — with settlement_attempt_count 0, credit_bonus_cents 0 and payable_total_cents equal to amount_cents (4500)."
