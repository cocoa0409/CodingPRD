  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      # --- semantics A: blackout interval [starts_at, ends_at) on Promotion ---
      - name: rto_blackout_window_half_open_inside
        grounds:
          - entities.BlackoutWindow.fields.starts_at
          - entities.BlackoutWindow.fields.ends_at
          - validations[priority=11]
        distinguishing_aspect: |
          Blackout interval semantics: half-open [starts_at, ends_at) — a clock inside the blackout suppresses the
          promotion (ERR_PROMO_NOT_REDEEMABLE) even though the active window is open. Resource = BlackoutWindow on
          Promotion; distinct interval arithmetic from instance 2's active-window end boundary.
        test_recipe:
          setup:
            - "Promotion BLK PERCENT_OFF 10% ACTIVE, active window 2026-06-01..2026-07-01, blackout [2026-06-10,2026-06-20). Clock set to 2026-06-15 (inside blackout). Coupon BLKC; cart with line."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-05T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /customers"
              payload: { email: "rto1@x.com", display_name: "R1" }
              as: Shopper
              captures: { cust_id: $.data.id }
            - call: "POST /promotions"
              payload: { name: "BLK", promo_type: "PERCENT_OFF", percent_off: 0.10, stacking_class: "STACKABLE", eligibility_mode: "ALL", active_from: "2026-06-01T00:00:00Z", active_until: "2026-07-01T00:00:00Z" }
              as: MerchantAdmin
              captures: { promo_id: $.data.id }
            - call: "POST /promotions/${promo_id}/blackouts"
              payload: { starts_at: "2026-06-10T00:00:00Z", ends_at: "2026-06-20T00:00:00Z", reason: "inventory freeze" }
              as: MerchantAdmin
            - call: "POST /promotions/${promo_id}/coupons"
              payload: { code: "BLKC", use_mode: "MULTI_USE", max_total_redemptions: 10 }
              as: MerchantAdmin
            - call: "POST /promotions/${promo_id}/activate"
              payload: {}
              as: MerchantAdmin
            - call: "POST /carts"
              payload: { customer_id: "${cust_id}" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { cart_id: $.data.id }
            - call: "POST /carts/${cart_id}/lines"
              payload: { sku: "A", unit_price_cents: 2000, quantity: 1 }
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-15T00:00:00Z" }
              as: PlatformOperator
          trigger:
            - call: "POST /carts/${cart_id}/applications"
              payload: { code: "BLKC" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "apply returns ERR_PROMO_NOT_REDEEMABLE (409) because clock 2026-06-15 is inside the half-open blackout [2026-06-10,2026-06-20)"

      # --- semantics B: active window [active_from, active_until) end is exclusive -> EXPIRED at end ---
      - name: rto_active_window_exclusive_end_expires
        grounds:
          - entities.Promotion.fields.active_until
          - state_machines.Promotion.ACTIVE_to_EXPIRED
          - validations[priority=11]
        distinguishing_aspect: |
          Active-window interval semantics: exclusive upper bound — at clock == active_until the promotion has
          left its window and the expiry sweep moves it ACTIVE->EXPIRED (ERR_PROMO_NOT_REDEEMABLE on apply). The
          boundary is the window END (different adjacency treatment) versus instance 1's mid-interval blackout.
        test_recipe:
          setup:
            - "Promotion EXPW PERCENT_OFF 10% ACTIVE, active window 2026-06-01..2026-06-20. Clock advanced to exactly 2026-06-20 (== active_until) triggering the expiry sweep. Coupon EXPC; cart with line."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-05T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /customers"
              payload: { email: "rto2@x.com", display_name: "R2" }
              as: Shopper
              captures: { cust_id: $.data.id }
            - call: "POST /promotions"
              payload: { name: "EXPW", promo_type: "PERCENT_OFF", percent_off: 0.10, stacking_class: "STACKABLE", eligibility_mode: "ALL", active_from: "2026-06-01T00:00:00Z", active_until: "2026-06-20T00:00:00Z" }
              as: MerchantAdmin
              captures: { promo_id: $.data.id }
            - call: "POST /promotions/${promo_id}/coupons"
              payload: { code: "EXPC", use_mode: "MULTI_USE", max_total_redemptions: 10 }
              as: MerchantAdmin
            - call: "POST /promotions/${promo_id}/activate"
              payload: {}
              as: MerchantAdmin
            - call: "POST /carts"
              payload: { customer_id: "${cust_id}" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { cart_id: $.data.id }
            - call: "POST /carts/${cart_id}/lines"
              payload: { sku: "A", unit_price_cents: 2000, quantity: 1 }
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-20T00:00:00Z" }
              as: PlatformOperator
          trigger:
            - call: "POST /carts/${cart_id}/applications"
              payload: { code: "EXPC" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Promotion.${promo_id}.status == EXPIRED (clock == active_until, exclusive end reached)"
            - "apply returns ERR_PROMO_NOT_REDEEMABLE (409)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      # --- conserved quantity 1: budget_consumed_cents (cents) across lock+unlock ---
      - name: ci_budget_consumed_unchanged_lock_unlock
        grounds:
          - state_machines.Cart.checkout_status.OPEN_to_LOCKED
          - state_machines.Cart.checkout_status.LOCKED_to_OPEN
          - state_machines.CouponRedemption.RESERVED_to_RELEASED
          - calculations.budget_consumption
        distinguishing_aspect: |
          Conserved quantity = Promotion.budget_consumed_cents (CONFIRMED-only cents). Forward action lock creates
          a RESERVED redemption; compensating action unlock RELEASES it. budget_consumed_cents (which counts only
          CONFIRMED) is 0 both before lock and after unlock — no drift. Cents-conserved invariant.
        test_recipe:
          setup:
            - "Clock 2026-06-15. Promotion CIB THRESHOLD {min 0 -> 1000c} budget_cap_cents=5000 ACTIVE, coupon CIBC; cart with line 5000c, applied, repriced, locked, then unlocked."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-15T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /customers"
              payload: { email: "ci1@x.com", display_name: "CI1" }
              as: Shopper
              captures: { cust_id: $.data.id }
            - call: "POST /promotions"
              payload: { name: "CIB", promo_type: "THRESHOLD", threshold_tiers: [{ min_subtotal_cents: 0, discount_cents: 1000 }], stacking_class: "STACKABLE", eligibility_mode: "ALL", active_from: "2026-06-01T00:00:00Z", active_until: "2026-07-01T00:00:00Z", budget_cap_cents: 5000 }
              as: MerchantAdmin
              captures: { promo_id: $.data.id }
            - call: "POST /promotions/${promo_id}/coupons"
              payload: { code: "CIBC", use_mode: "MULTI_USE", max_total_redemptions: 10 }
              as: MerchantAdmin
            - call: "POST /promotions/${promo_id}/activate"
              payload: {}
              as: MerchantAdmin
            - call: "POST /carts"
              payload: { customer_id: "${cust_id}" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { cart_id: $.data.id }
            - call: "POST /carts/${cart_id}/lines"
              payload: { sku: "S", unit_price_cents: 5000, quantity: 1 }
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "GET /promotions/${promo_id}"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { promo_ver: $.data.version }
            - call: "POST /carts/${cart_id}/applications"
              payload: { code: "CIBC", expected_promotion_version: "${promo_ver}" }
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /carts/${cart_id}/reprice"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /carts/${cart_id}/lock"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /carts/${cart_id}/unlock"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
          assert:
            - "Promotion.${promo_id}.budget_consumed_cents == 0 after unlock (== its pre-lock value; CONFIRMED-only, no drift)"
            - "the cart's CouponRedemption has status == RELEASED"

      # --- conserved quantity 2: coupon.redeemed_count (count) across lock+abandon ---
      - name: ci_coupon_redeemed_count_unchanged_lock_abandon
        grounds:
          - state_machines.Cart.checkout_status.LOCKED_to_ABANDONED
          - state_machines.CouponRedemption.RESERVED_to_RELEASED
          - entities.Coupon.fields.redeemed_count
        distinguishing_aspect: |
          Conserved quantity = Coupon.redeemed_count (CONFIRMED-only integer count). Forward action lock reserves a
          redemption; compensating action abandon RELEASES it. redeemed_count is 0 both before lock and after
          abandon — no drift. Count-conserved invariant, a different conserved quantity than instance 1's cents.
        test_recipe:
          setup:
            - "Clock 2026-06-15. Promotion CIC PERCENT_OFF 10% ACTIVE, coupon CICK MULTI_USE cap 5; cart with line, coupon applied, repriced, locked, then abandoned."
          setup_api_calls:
            - call: "POST /_clock/set"
