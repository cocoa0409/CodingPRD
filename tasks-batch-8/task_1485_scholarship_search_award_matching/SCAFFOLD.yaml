    path: "/api/students"
    description: "Register a student profile"
    roles: [ScholarshipCoordinator]
    code: 201
    input: [full_name, email, grade_level, gpa_hundredths, residency_state, intended_major, household_income_cents, efc_cents, cost_of_attendance_cents, institution_name, "verified_gpa_hundredths?", "tags?"]
    output: Student
    side_effects: ["status=ACTIVE", "aid_cap_cents computed"]
  - method: GET
    path: "/api/students/{id}"
    description: "Get a student"
    roles: [ScholarshipCoordinator, Student, FinancialAidOfficer]
    code: 200
    input: []
    output: Student
    side_effects: []
  - method: PATCH
    path: "/api/students/{id}"
    description: "Update profile fields; sets verified_gpa_hundredths when provided (coordinator only)"
    roles: [ScholarshipCoordinator]
    code: 200
    input: ["gpa_hundredths?", "verified_gpa_hundredths?", "residency_state?", "intended_major?", "household_income_cents?", "efc_cents?", "cost_of_attendance_cents?", "institution_name?", "tags?"]
    output: Student
    side_effects: ["aid_cap_cents recomputed", "stacking recompute on COA/EFC change (may auto-create adjustments)", "increments Student.version by 1"]
  - method: POST
