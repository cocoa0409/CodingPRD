          - state_machines.ClaimAssessment.ELIGIBLE_to_SUSPENDED
          - entities.LabelVersion.fields.content_status
        distinguishing_aspect: |
          Trigger = POST /api/lab-analyses/{id}/review (VALIDATED). Depth-4 chain, each hop
          caused by the previous: new VALIDATED analysis -> prior VALIDATED analysis
          SUPERSEDED -> its derived LAB NutrientPanel STALE -> claim on that panel SUSPENDED
