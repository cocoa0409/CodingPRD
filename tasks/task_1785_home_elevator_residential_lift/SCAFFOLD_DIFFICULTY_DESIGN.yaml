            - "ElevatorUnit.${unit}.equipment_status == OUT_OF_SERVICE (hop 3: caused by revocation/suspension)"
            - "ServiceCall.${call}.status == CANCELLED (hop 4: caused by unit leaving service)"

      - name: project_cancel_grant_clawback_cascade
        grounds:
          - state_machines.Project.ANY_NON_TERMINAL_to_CANCELLED
          - state_machines.GrantApplication.APPROVED_to_WITHDRAWN
          - entities.GrantProgram.fields.remaining_pool
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger (project cancel): project CANCELLED ->
          APPROVED application WITHDRAWN (hop 2) -> program remaining_pool credited
          10000.00 back to 50000.00 (hop 3, a mutation of the program caused by the
          application's withdrawal, not by the cancel directly).
        test_recipe:
          setup:
            - "Project QUOTED (HYD-100, 33000.00); program pool 50000.00; application APPROVED with final_award 10000.00 (pool at 40000.00)"
          setup_api_calls:
            - { call: "POST /api/properties", payload: { owner_user_id: "u-own-1", address_line: "1 Pine St", state_code: "CA" }, as: ProjectCoordinator, captures: { prop: $.data.id } }
            - { call: "POST /api/technicians", payload: { full_name: "Sam Surveyor", certification: "CET_AND_QEI", home_region: "north" }, as: DealerAdmin, captures: { t_surv: $.data.id } }
