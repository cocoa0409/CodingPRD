              payload: { completed_at: "2026-11-20", actual_cost_cents: 250000 }
              as: RoadCommissioner
              as_user_id: "rc-user-1"
            - call: "POST /maintenance-projects"
              payload: { road_segment_id: "${seg_id}", category: "GRADING", window_start_date: "2026-11-22", window_end_date: "2026-11-25" }
              as: RoadCommissioner
              as_user_id: "rc-user-1"
              captures: { cure_error: "$.data.error_id" }
            - call: "POST /maintenance-projects"
              payload: { road_segment_id: "${seg_id}", category: "GRADING", window_start_date: "2026-11-23", window_end_date: "2026-11-26" }
              as: RoadCommissioner
              as_user_id: "rc-user-1"
              captures: { proj_f: "$.data.id" }
          assert:
            - "project A [2026-11-01, 2026-11-10) is created 201 in BID_SOLICITATION with reserve_draw_cents 0"
            - "project B [2026-11-10, 2026-11-15) is created 201: touching at A's exclusive end is permitted"
            - "the [2026-11-09, 2026-11-12) request returns HTTP 409 with error_id ERR_WORK_WINDOW_CONFLICT: it intersects A on 11-09 and B on 11-10 and 11-11"
            - "project D [2026-11-15, 2026-11-16) is created 201, confirming window_end_date is exclusive rather than the last worked day"
            - "cancelling A returns status CANCELLED, and the identical-start window [2026-11-01, 2026-11-05) is then accepted 201 because only BID_SOLICITATION and AWARDED projects reserve a window"
            - "the PAVING project [2026-11-16, 2026-11-20) is accepted 201, awarded at 250000 with reserve_draw_cents 250000, leaving the association at reserve_balance_cents 350000 and reserve_posture UNDERFUNDED"
            - "completing the PAVING project at 2026-11-20 sets status COMPLETE, actual_cost_cents 250000, segment surface_type PAVED and emergency_access_grade UNKNOWN, and the reserve stays 350000 (the draw stays spent)"
            - "the [2026-11-22, 2026-11-25) request returns HTTP 409 with error_id ERR_PAVING_CURE_BUFFER_VIOLATION: 11-22 is inside the three cure days after the exclusive end 2026-11-20"
            - "the [2026-11-23, 2026-11-26) request is accepted 201: window_end_date + 3 days is an inclusive earliest start, and ERR_WORK_WINDOW_CONFLICT never fires against the COMPLETE paving window"
            - "exactly six projects exist on the segment at the end: A (CANCELLED), B, D, H, P (COMPLETE) and F, of which B, D, H and F are BID_SOLICITATION"

      - name: aggregate_restriction_days_ceiling_holds_across_the_fiscal_year_and_survives_release
        grounds:
          - "validations[priority=50]"
          - "calculations.member_access_reconciliation"
          - "entities.Member.fields.restricted_days_used"
          - "endpoints[POST /delinquency-actions/{action_id}/effectuate]"
        distinguishing_aspect: >
          Each restriction interval is individually lawful and they merely touch
          rather than overlap, yet the member's access time is the contended
          resource across the whole fiscal year: 30 days then 15 days lands
          exactly on the inclusive 45-day ceiling and must be allowed, and one
          further day must be refused. The second twist is that
          restricted_days_used sums EFFECTIVE and RELEASED actions, so releasing
          the 15-day restriction does not hand the days back and the one-day
          action is still refused afterwards — an implementation that recomputes
          the counter from currently-EFFECTIVE actions only, or that decrements on
          release, admits the extra day.
        test_recipe:
          setup: |
            Build SINGLE_4M: charge 1600000 with due_date 2026-11-15 on a
            COMPLIANT segment. Advance the clock to 2026-12-15 (due_date plus the
            30 grace days, the inclusive first eligible day) and have bt-user-1
            initiate three ACCESS_RESTRICTION actions while the charge is still
            DELINQUENT, so no initiation depends on a later state:
            R1 [2026-12-16, 2027-01-15) = 30 days, R2 [2027-01-15, 2027-01-30)
            = 15 days and R3 [2027-01-30, 2027-01-31) = 1 day. All three sit
            inside the roll's fiscal interval.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
