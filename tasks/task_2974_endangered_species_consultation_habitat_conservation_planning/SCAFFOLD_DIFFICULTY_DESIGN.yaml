            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2027-06-01T00:00:00Z"}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
            - call: "GET /proponents/${proponent_id}"
              payload: {}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {rolling_score: "$.data.compliance_standing_score", rolling_variant: "$.data.compliance_variant_applied"}
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2028-06-01T00:00:00Z"}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
          trigger:
            - call: "GET /proponents/${proponent_id}"
              payload: {}
              as: Proponent
              as_user_id: "${proponent_id}"
          assert:
            - "the captured ${rolling_variant} == 'ROLLING_12_MONTH' and ${rolling_score} == 88.50 (R1 rejected 193 days old -> 11 * 0.5 = 5.5, R2 late 12 days old -> 6.0, so 100 - 11.5)"
            - "Proponent.compliance_variant_applied == 'LIFETIME' in the trigger response (no MonitoringReport has period_end inside [2027-06-03, 2028-06-01])"
            - "Proponent.compliance_standing_score == 91.50 in the trigger response (R1 559 days old -> 5.5, R2 378 days old -> 3.0, so 100 - 8.5)"
            - "the two scores differ by exactly 3.00 with zero writes between the two reads"
            - "Proponent.open_reinitiation_count == 0 in the trigger response"
            - "the captured ${r1_due} == '2026-12-15' and ${r1_late} == false; ${r2_late} == true"
            - "the captured ${bo_take} == 4.00 and ${bo_trigger} == 3.60"
            - "the captured ${permit_number} == 'ITP-000001'"

  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: endowment_rounds_per_commitment_then_sums_reserve_on_rounded_base
        grounds:
          - calculations.endowment_requirement
          - calculations.endowment_requirement.precision
          - calculations.endowment_requirement.constants.ANNUAL_MGMT_COST_PER_UNIT_CENTS
          - calculations.endowment_requirement.constants.CAPITALIZATION_YEARS
          - calculations.endowment_requirement.constants.MECHANISM_FACTOR
          - calculations.endowment_requirement.constants.CHANGED_CIRCUMSTANCE_RESERVE_PCT
          - entities.MitigationCommitment.fields.endowment_contribution_cents
          - entities.HabitatConservationPlan.fields.endowment_base_cents
          - entities.HabitatConservationPlan.fields.changed_circumstance_reserve_cents
          - entities.HabitatConservationPlan.fields.endowment_required_cents
        distinguishing_aspect: >-
          Mode (b) — NESTED ROUNDING ORDER. Two rounding steps whose order is
          normative: each commitment's contribution is rounded to integer cents
          FIRST and only then summed, and the changed-circumstance reserve is a
          percentage of that already-rounded sum. Both raw products end in
          exactly .5 (3382501.5 and 1105456.5), so rounding per row and summing
          gives 4487959 while summing raw and rounding once gives 4487958 — a
          one-cent fork that propagates into the reserve and the required total.
          This instance contains no tier table and no ordering pin.
        test_recipe:
          setup:
            - "The canonical registry chain through the LAA effect determination, the biological assessment and the biological opinion, then an HCP with covered_acres 20.00 and permit_term_years 30."
            - "One CONSERVATION_BANK_CREDIT commitment of 45.01 units is booked against ${hcp_v1}; the plan is re-read to obtain ${hcp_v2}."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-10-01T00:00:00Z"}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
            - call: "POST /species"
