        distinguishing_aspect: "Approval is all-or-nothing rather than eventually reconciled: hop 2 finds no eligible lot for the proposed SKU, so hop 1's product rewrite, the reprice, the exposure recompute and the risk recompute are all absent afterwards and the request stays UNDER_REVIEW."
