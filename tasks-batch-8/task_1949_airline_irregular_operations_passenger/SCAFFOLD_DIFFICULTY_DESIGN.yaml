# =============================================================================
# Task 1949: Airline Irregular Operations & Passenger Rebooking
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 23 instances across the nine §0.5 rules (2-3 per rule).
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: compensation_provisional_vs_final
        grounds:
          - calculations.compensation_amount
          - state_machines.Flight.IN_FLIGHT_to_ARRIVED
          - state_machines.ReaccommodationCase.OFFERED_to_COMMITTED
          - entities.Booking.fields.compensation_amount_cents
        distinguishing_aspect: |
          Booking-domain calculation: identical booking and itinerary yield 20000 under the
          provisional variant (projected delay 200 min triggers the 50% reduction) but 40000
          under the final variant (actual delay 250 min removes the reduction).
        test_recipe:
          setup:
            - "Controllable event E in RECOVERY; booking B (fare 50000, party 1, ECONOMY) on flight F1 (HUB->DST, 3200 km, dep 10:00, arr 12:00) cancelled under E"
            - "Recovery flight F2 (HUB->DST, 3200 km, dep 14:00, arr 15:20) with 100 ECONOMY seats; case for B OFFERED with option on F2 (projected arrival delay 200 min)"
          setup_api_calls:
            - { call: "POST /irops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: OpsAdmin }
            - { call: "POST /irops/passengers", payload: { full_name: "Ann A", contact_email: "ann@x.com", loyalty_tier: "GOLD" }, as: ReaccommodationAgent, captures: { pax: "$.data.id" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC100", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T10:00:00Z", sched_arr_utc: "2026-08-10T12:00:00Z", distance_km: 3200, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 100 }] }, as: OpsController, captures: { f1: "$.data.id", f1v: "$.data.version" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC200", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T14:00:00Z", sched_arr_utc: "2026-08-10T15:20:00Z", distance_km: 3200, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 100 }] }, as: OpsController, captures: { f2: "$.data.id" } }
            - { call: "POST /irops/disruption-events", payload: { event_code: "MECH-1", hub: "HUB", classification: "MECHANICAL", cost_cap_cents: 1000000 }, as: DutyManager, captures: { ev: "$.data.id" } }
            - { call: "POST /irops/disruption-events/${ev}/assess", payload: {}, as: DutyManager }
            - { call: "POST /irops/bookings", payload: { passenger_id: "${pax}", fare_cents: 50000, cabin: "ECONOMY", party_size: 1, segments: [{ flight_id: "${f1}", seq_no: 1 }] }, as: ReaccommodationAgent, captures: { bk: "$.data.id" } }
            - { call: "POST /irops/flights/${f1}/cancel", payload: { disruption_event_id: "${ev}", expected_flight_version: "${f1v}" }, as: OpsController }
            - { call: "POST /irops/disruption-events/${ev}/declare-recovery", payload: {}, as: DutyManager }
            - { call: "GET /irops/reaccommodation-cases?booking_id=${bk}", as: ReaccommodationAgent, captures: { cs: "$.data[0].id" } }
            - { call: "POST /irops/reaccommodation-cases/${cs}/generate-options", payload: { include_interline: false }, as: ReaccommodationAgent, captures: { csv: "$.data.version" } }
            - { call: "GET /irops/reaccommodation-cases/${cs}/options", as: ReaccommodationAgent, captures: { opt: "$.data[0].id" } }
          trigger:
            - { call: "POST /irops/reaccommodation-cases/${cs}/commit", payload: { option_id: "${opt}", expected_case_version: "${csv}" }, as: ReaccommodationAgent }
            - { call: "GET /irops/bookings/${bk}", as: ReaccommodationAgent, captures: { comp_prov: "$.data.compensation_amount_cents" } }
            - { call: "POST /irops/flights/${f2}/depart", payload: { act_dep_utc: "2026-08-10T14:10:00Z" }, as: OpsController }
            - { call: "POST /irops/flights/${f2}/record-actuals", payload: { act_arr_utc: "2026-08-10T16:10:00Z" }, as: OpsController }
            - { call: "GET /irops/bookings/${bk}", as: ReaccommodationAgent }
          assert:
            - "Booking.${bk}.compensation_amount_cents == 20000 after commit (provisional: tier 40000 with 50% reduction at projected 200 < 240)"
            - "Booking.${bk}.compensation_basis == PROVISIONAL after commit"
            - "Booking.${bk}.compensation_amount_cents == 40000 after record-actuals (final: actual delay 250 >= 240, no reduction)"
            - "Booking.${bk}.compensation_basis == FINAL after record-actuals"

      - name: event_cost_accrual_vs_settled
        grounds:
          - calculations.event_cost_rollup
          - entities.DisruptionEvent.fields.accrual_total_cents
          - entities.DisruptionEvent.fields.settled_total_cents
          - state_machines.Voucher.ISSUED_to_REDEEMED
        distinguishing_aspect: |
          DisruptionEvent-domain calculation: the same ledger (hotel 15000 + meal 4500 issued,
          hotel redeemed at 13200) yields accrual_total_cents = 19500 but settled_total_cents = 13200 —
          same inputs, two variants, different totals on the event (not on any Booking).
        test_recipe:
          setup:
            - "Controllable event E in RECOVERY with cost_cap_cents 100000; flight F3 (dep 10:00) cancelled at 06:00; booking B disrupted; recovery flight F4 dep 18:00 committed (disruption window 12h)"
          setup_api_calls:
            - { call: "POST /irops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: OpsAdmin }
            - { call: "POST /irops/passengers", payload: { full_name: "Bob B", contact_email: "bob@x.com" }, as: ReaccommodationAgent, captures: { pax: "$.data.id" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC300", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T10:00:00Z", sched_arr_utc: "2026-08-10T11:00:00Z", distance_km: 900, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 100 }] }, as: OpsController, captures: { f3: "$.data.id", f3v: "$.data.version" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC400", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T18:00:00Z", sched_arr_utc: "2026-08-10T19:00:00Z", distance_km: 900, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 100 }] }, as: OpsController, captures: { f4: "$.data.id" } }
            - { call: "POST /irops/disruption-events", payload: { event_code: "MECH-2", hub: "HUB", classification: "MECHANICAL", cost_cap_cents: 100000 }, as: DutyManager, captures: { ev: "$.data.id" } }
            - { call: "POST /irops/disruption-events/${ev}/assess", payload: {}, as: DutyManager }
            - { call: "POST /irops/bookings", payload: { passenger_id: "${pax}", fare_cents: 20000, cabin: "ECONOMY", party_size: 1, segments: [{ flight_id: "${f3}", seq_no: 1 }] }, as: ReaccommodationAgent, captures: { bk: "$.data.id" } }
            - { call: "POST /irops/flights/${f3}/cancel", payload: { disruption_event_id: "${ev}", expected_flight_version: "${f3v}" }, as: OpsController }
            - { call: "POST /irops/disruption-events/${ev}/declare-recovery", payload: {}, as: DutyManager }
            - { call: "GET /irops/reaccommodation-cases?booking_id=${bk}", as: ReaccommodationAgent, captures: { cs: "$.data[0].id" } }
            - { call: "POST /irops/reaccommodation-cases/${cs}/generate-options", payload: { include_interline: false }, as: ReaccommodationAgent, captures: { csv: "$.data.version" } }
            - { call: "GET /irops/reaccommodation-cases/${cs}/options", as: ReaccommodationAgent, captures: { opt: "$.data[0].id" } }
            - { call: "POST /irops/reaccommodation-cases/${cs}/commit", payload: { option_id: "${opt}", expected_case_version: "${csv}" }, as: ReaccommodationAgent }
            - { call: "POST /irops/bookings/${bk}/vouchers", payload: { voucher_type: "HOTEL", check_in_date: "2026-08-10" }, as: ReaccommodationAgent, captures: { vh: "$.data.id" } }
            - { call: "POST /irops/bookings/${bk}/vouchers", payload: { voucher_type: "MEAL" }, as: ReaccommodationAgent }
          trigger:
            - { call: "GET /irops/disruption-events/${ev}/cost-summary", as: FinanceProcessor, captures: { acc_pre: "$.data.accrual_total_cents", set_pre: "$.data.settled_total_cents" } }
            - { call: "POST /irops/vouchers/${vh}/redeem", payload: { actual_amount_cents: 13200 }, as: FinanceProcessor }
            - { call: "GET /irops/disruption-events/${ev}/cost-summary", as: FinanceProcessor }
          assert:
            - "cost-summary before redeem: accrual_total_cents == 19500 (hotel 15000 + meal 4500 at face), settled_total_cents == 0"
            - "cost-summary after redeem: accrual_total_cents == 19500 (unchanged), settled_total_cents == 13200"
            - "the two variants diverge on identical ledger rows: 19500 != 13200"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (modes a, b, c)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: priority_score_weighted_multi_factor
        grounds:
          - calculations.reaccommodation_priority_score
          - entities.ReaccommodationCase.fields.priority_score
        distinguishing_aspect: |
          Mode (a): 5 inputs with non-linear interaction (tiered urgency bonus, capped SSR sum,
          capped group penalty). Case A (PLATINUM+BUSINESS+90min+UMNR, party 1) scores 4830;
          Case B (GOLD+ECONOMY+360min, party 3) scores 1910; listing orders A before B.
        test_recipe:
          setup:
            - "Clock at 2026-08-10T06:00:00Z; event E (MECHANICAL) ASSESSING"
            - "Flight F5 dep 07:30 (90 min urgency) carrying booking A; flight F6 dep 12:00 (360 min urgency) carrying booking B"
          setup_api_calls:
            - { call: "POST /irops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: OpsAdmin }
            - { call: "POST /irops/passengers", payload: { full_name: "Pia A", contact_email: "pia@x.com", loyalty_tier: "PLATINUM", special_service_codes: ["UMNR"] }, as: ReaccommodationAgent, captures: { pa: "$.data.id" } }
            - { call: "POST /irops/passengers", payload: { full_name: "Gil B", contact_email: "gil@x.com", loyalty_tier: "GOLD" }, as: ReaccommodationAgent, captures: { pb: "$.data.id" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC500", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T07:30:00Z", sched_arr_utc: "2026-08-10T08:30:00Z", distance_km: 1200, operating_carrier: "OC", cabins: [{ cabin: "BUSINESS", capacity: 20 }] }, as: OpsController, captures: { f5: "$.data.id", f5v: "$.data.version" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC600", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T12:00:00Z", sched_arr_utc: "2026-08-10T13:00:00Z", distance_km: 1200, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 100 }] }, as: OpsController, captures: { f6: "$.data.id", f6v: "$.data.version" } }
            - { call: "POST /irops/disruption-events", payload: { event_code: "MECH-3", hub: "HUB", classification: "MECHANICAL", cost_cap_cents: 1000000 }, as: DutyManager, captures: { ev: "$.data.id" } }
            - { call: "POST /irops/disruption-events/${ev}/assess", payload: {}, as: DutyManager }
            - { call: "POST /irops/bookings", payload: { passenger_id: "${pa}", fare_cents: 80000, cabin: "BUSINESS", party_size: 1, segments: [{ flight_id: "${f5}", seq_no: 1 }] }, as: ReaccommodationAgent, captures: { ba: "$.data.id" } }
            - { call: "POST /irops/bookings", payload: { passenger_id: "${pb}", fare_cents: 30000, cabin: "ECONOMY", party_size: 3, segments: [{ flight_id: "${f6}", seq_no: 1 }] }, as: ReaccommodationAgent, captures: { bb: "$.data.id" } }
            - { call: "POST /irops/flights/${f5}/cancel", payload: { disruption_event_id: "${ev}", expected_flight_version: "${f5v}" }, as: OpsController }
            - { call: "POST /irops/flights/${f6}/cancel", payload: { disruption_event_id: "${ev}", expected_flight_version: "${f6v}" }, as: OpsController }
          trigger:
            - { call: "GET /irops/reaccommodation-cases?disruption_event_id=${ev}", as: ReaccommodationAgent, captures: { first_case: "$.data[0].id", first_score: "$.data[0].priority_score", second_score: "$.data[1].priority_score" } }
          assert:
            - "case for booking ${ba} has priority_score == 4830 (4000 tier + 30 cabin + 500 urgency + 300 UMNR - 0)"
            - "case for booking ${bb} has priority_score == 1910 (2000 + 10 + 0 urgency at exactly 360 min + 0 SSR - 100 group)"
            - "list order: data[0].priority_score == 4830 and data[1].priority_score == 1910 (score DESC)"

      - name: refund_credit_nested_rounding
        grounds:
          - calculations.election_amounts
          - entities.RefundElection.fields.refund_amount_cents
          - entities.RefundElection.fields.credit_amount_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order pinned — per-FLOWN-segment round_half_up first, sum,
          subtract from fare, then a single rounding on the credit bonus. Fare 10000 over
          1000/1000/1000 km legs with one leg FLOWN gives refund 6667 (not 6666, which the
          unflown-sum order would produce) and credit round_half_up(6667 * 1.10) = 7334.
        test_recipe:
          setup:
            - "Booking B fare 10000 ECONOMY party 1 over G1->G2->G3 (1000 km each, 60-min connections); G1 already ARRIVED (seg1 FLOWN); G2 and G3 cancelled under controllable event E"
          setup_api_calls:
            - { call: "POST /irops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /irops/passengers", payload: { full_name: "Ron R", contact_email: "ron@x.com" }, as: ReaccommodationAgent, captures: { pax: "$.data.id" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC11", origin: "AAA", destination: "BBB", sched_dep_utc: "2026-08-09T06:00:00Z", sched_arr_utc: "2026-08-09T07:00:00Z", distance_km: 1000, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 50 }] }, as: OpsController, captures: { g1: "$.data.id" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC12", origin: "BBB", destination: "CCC", sched_dep_utc: "2026-08-09T08:00:00Z", sched_arr_utc: "2026-08-09T09:00:00Z", distance_km: 1000, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 50 }] }, as: OpsController, captures: { g2: "$.data.id", g2v: "$.data.version" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC13", origin: "CCC", destination: "DDD", sched_dep_utc: "2026-08-09T10:00:00Z", sched_arr_utc: "2026-08-09T11:00:00Z", distance_km: 1000, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 50 }] }, as: OpsController, captures: { g3: "$.data.id", g3v: "$.data.version" } }
            - { call: "POST /irops/bookings", payload: { passenger_id: "${pax}", fare_cents: 10000, cabin: "ECONOMY", party_size: 1, segments: [{ flight_id: "${g1}", seq_no: 1 }, { flight_id: "${g2}", seq_no: 2 }, { flight_id: "${g3}", seq_no: 3 }] }, as: ReaccommodationAgent, captures: { bk: "$.data.id" } }
            - { call: "POST /irops/flights/${g1}/depart", payload: { act_dep_utc: "2026-08-09T06:05:00Z" }, as: OpsController }
            - { call: "POST /irops/flights/${g1}/record-actuals", payload: { act_arr_utc: "2026-08-09T07:05:00Z" }, as: OpsController }
            - { call: "POST /irops/disruption-events", payload: { event_code: "MECH-4", hub: "BBB", classification: "MECHANICAL", cost_cap_cents: 1000000 }, as: DutyManager, captures: { ev: "$.data.id" } }
            - { call: "POST /irops/disruption-events/${ev}/assess", payload: {}, as: DutyManager }
            - { call: "POST /irops/flights/${g2}/cancel", payload: { disruption_event_id: "${ev}", expected_flight_version: "${g2v}" }, as: OpsController }
            - { call: "POST /irops/flights/${g3}/cancel", payload: { disruption_event_id: "${ev}", expected_flight_version: "${g3v}" }, as: OpsController }
          trigger:
            - { call: "POST /irops/bookings/${bk}/refund-elections", payload: { election: "CREDIT" }, as: ReaccommodationAgent, captures: { el: "$.data.id", el_refund: "$.data.refund_amount_cents", el_credit: "$.data.credit_amount_cents" } }
          assert:
            - "RefundElection.${el}.refund_amount_cents == 6667 (10000 - round_half_up(10000*1000/3000)=3333 for the one FLOWN leg)"
            - "RefundElection.${el}.credit_amount_cents == 7334 (round_half_up(6667*110/100))"
            - "the pinned order deliberately differs from summing unflown allocations (3333+3333=6666)"

      - name: comms_batch_evaluation_order
        grounds:
          - calculations.comms_cadence_batch
          - state_machines.Booking.ELIGIBLE_PENDING_to_ELECTED_CREDIT
          - state_machines.Voucher.ISSUED_to_EXPIRED
        distinguishing_aspect: |
          Mode (c): the batch reads self-referential state, so evaluation order is pinned —
          voucher expiry (step 2) and election defaulting (step 3) run before reminder selection
          (step 5); a booking defaulted in step 3 receives ELECTION_DEFAULT (step 4), never a
          REMINDER in the same batch. Asserts pin defaulted_elections=1, expired_vouchers=1,
          sent_count=2, reminders_sent=0 and accrual 73000 / settled 40000.
        test_recipe:
          setup:
            - "Clock T0=2026-08-10T00:00Z; event E (MECHANICAL, cap 500000) RECOVERY; flight C1 (2000 km) cancelled at T0; booking B (fare 30000, party 1) DISRUPTED + ELIGIBLE_PENDING with deadline T0+72h; TRANSPORT voucher issued at T0 (valid_through 2026-08-12); CANCELLATION log QUEUED due T0"
            - "Clock advanced to 2026-08-13T00:00:01Z: election deadline passed and voucher validity date passed"
          setup_api_calls:
            - { call: "POST /irops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /irops/passengers", payload: { full_name: "Sue S", contact_email: "sue@x.com" }, as: ReaccommodationAgent, captures: { pax: "$.data.id" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC700", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T08:00:00Z", sched_arr_utc: "2026-08-10T09:00:00Z", distance_km: 2000, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 100 }] }, as: OpsController, captures: { c1: "$.data.id", c1v: "$.data.version" } }
            - { call: "POST /irops/disruption-events", payload: { event_code: "MECH-5", hub: "HUB", classification: "MECHANICAL", cost_cap_cents: 500000 }, as: DutyManager, captures: { ev: "$.data.id" } }
            - { call: "POST /irops/disruption-events/${ev}/assess", payload: {}, as: DutyManager }
            - { call: "POST /irops/bookings", payload: { passenger_id: "${pax}", fare_cents: 30000, cabin: "ECONOMY", party_size: 1, segments: [{ flight_id: "${c1}", seq_no: 1 }] }, as: ReaccommodationAgent, captures: { bk: "$.data.id" } }
            - { call: "POST /irops/flights/${c1}/cancel", payload: { disruption_event_id: "${ev}", expected_flight_version: "${c1v}" }, as: OpsController }
            - { call: "POST /irops/disruption-events/${ev}/declare-recovery", payload: {}, as: DutyManager }
            - { call: "POST /irops/bookings/${bk}/vouchers", payload: { voucher_type: "TRANSPORT" }, as: ReaccommodationAgent, captures: { vt: "$.data.id" } }
            - { call: "POST /irops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-13T00:00:01Z" }, as: OpsAdmin }
          trigger:
            - { call: "POST /irops/communications/process-due", payload: {}, as: OpsAdmin, captures: { sent: "$.data.sent_count", defaulted: "$.data.defaulted_elections", expired_v: "$.data.expired_vouchers", reminders: "$.data.reminders_sent" } }
            - { call: "GET /irops/bookings/${bk}", as: ReaccommodationAgent }
            - { call: "GET /irops/disruption-events/${ev}/cost-summary", as: FinanceProcessor }
          assert:
            - "batch result: defaulted_elections == 1, expired_vouchers == 1, sent_count == 2 (CANCELLATION + ELECTION_DEFAULT), reminders_sent == 0"
            - "Booking.${bk}.compensation_status == SETTLED (system-default election created already PROCESSED)"
            - "the auto-created RefundElection has election == CREDIT and election_source == SYSTEM_DEFAULT"
            - "event cost-summary: accrual_total_cents == 73000 (5000 - 5000 reversal + 33000 credit + 40000 compensation), settled_total_cents == 40000"
            - "CommunicationLog for the booking contains ELECTION_DEFAULT in SENT and no REMINDER row"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: disruption_event_recovery_reopen_cycle
        grounds:
          - state_machines.DisruptionEvent
        distinguishing_aspect: |
          DisruptionEvent is cyclic: OPEN->ASSESSING->RECOVERY->ASSESSING->RECOVERY->CLOSED
          traverses the RECOVERY->ASSESSING loop edge; each pass bumps version, ending at 6.
        test_recipe:
          setup:
            - "Empty event, no flights/cases attached"
          setup_api_calls:
            - { call: "POST /irops/disruption-events", payload: { event_code: "CYC-1", hub: "HUB", classification: "ATC", cost_cap_cents: 100000 }, as: DutyManager, captures: { ev: "$.data.id" } }
          trigger:
            - { call: "POST /irops/disruption-events/${ev}/assess", payload: {}, as: DutyManager }
            - { call: "POST /irops/disruption-events/${ev}/declare-recovery", payload: {}, as: DutyManager }
            - { call: "POST /irops/disruption-events/${ev}/reopen", payload: {}, as: DutyManager, captures: { v_reopened: "$.data.version" } }
            - { call: "POST /irops/disruption-events/${ev}/declare-recovery", payload: {}, as: DutyManager }
            - { call: "POST /irops/disruption-events/${ev}/close", payload: {}, as: DutyManager, captures: { v_closed: "$.data.version", st: "$.data.event_status" } }
          assert:
            - "after reopen the event is ASSESSING again (loop edge taken), version == 4"
            - "final close from RECOVERY succeeds: event_status == CLOSED, version == 6"

      - name: booking_parallel_status_axes
        grounds:
          - state_machines.Booking
          - entities.Booking.fields.booking_status
          - entities.Booking.fields.compensation_status
        distinguishing_aspect: |
          Booking carries two independent axes on one row: booking_status walks
          ACTIVE->DISRUPTED->REBOOKED while compensation_status independently walks
          NONE->ELIGIBLE_PENDING->ELECTED_REFUND->SETTLED; intermediate combined state
          REBOOKED x ELIGIBLE_PENDING proves neither axis gates the other.
        test_recipe:
          setup:
            - "Controllable event E RECOVERY; booking B on cancelled flight F1 (case committed onto F2): booking DISRUPTED + ELIGIBLE_PENDING at start of trigger"
          setup_api_calls:
            - { call: "POST /irops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: OpsAdmin }
            - { call: "POST /irops/passengers", payload: { full_name: "Tim T", contact_email: "tim@x.com" }, as: ReaccommodationAgent, captures: { pax: "$.data.id" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC800", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T10:00:00Z", sched_arr_utc: "2026-08-10T12:00:00Z", distance_km: 3200, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 100 }] }, as: OpsController, captures: { f1: "$.data.id", f1v: "$.data.version" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC900", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T14:00:00Z", sched_arr_utc: "2026-08-10T16:00:00Z", distance_km: 3200, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 100 }] }, as: OpsController, captures: { f2: "$.data.id" } }
            - { call: "POST /irops/disruption-events", payload: { event_code: "MECH-6", hub: "HUB", classification: "MECHANICAL", cost_cap_cents: 1000000 }, as: DutyManager, captures: { ev: "$.data.id" } }
            - { call: "POST /irops/disruption-events/${ev}/assess", payload: {}, as: DutyManager }
            - { call: "POST /irops/bookings", payload: { passenger_id: "${pax}", fare_cents: 50000, cabin: "ECONOMY", party_size: 1, segments: [{ flight_id: "${f1}", seq_no: 1 }] }, as: ReaccommodationAgent, captures: { bk: "$.data.id" } }
            - { call: "POST /irops/flights/${f1}/cancel", payload: { disruption_event_id: "${ev}", expected_flight_version: "${f1v}" }, as: OpsController }
            - { call: "POST /irops/disruption-events/${ev}/declare-recovery", payload: {}, as: DutyManager }
          trigger:
            - { call: "GET /irops/reaccommodation-cases?booking_id=${bk}", as: ReaccommodationAgent, captures: { cs: "$.data[0].id" } }
            - { call: "POST /irops/reaccommodation-cases/${cs}/generate-options", payload: { include_interline: false }, as: ReaccommodationAgent, captures: { csv: "$.data.version" } }
            - { call: "GET /irops/reaccommodation-cases/${cs}/options", as: ReaccommodationAgent, captures: { opt: "$.data[0].id" } }
            - { call: "POST /irops/reaccommodation-cases/${cs}/commit", payload: { option_id: "${opt}", expected_case_version: "${csv}" }, as: ReaccommodationAgent }
            - { call: "GET /irops/bookings/${bk}", as: ReaccommodationAgent, captures: { axis_mid: "$.data.compensation_status" } }
            - { call: "POST /irops/bookings/${bk}/refund-elections", payload: { election: "REFUND" }, as: ReaccommodationAgent, captures: { el: "$.data.id" } }
            - { call: "POST /irops/refund-elections/${el}/process", payload: {}, as: FinanceProcessor }
            - { call: "GET /irops/bookings/${bk}", as: ReaccommodationAgent }
          assert:
            - "after commit: booking_status == REBOOKED while compensation_status == ELIGIBLE_PENDING (axes independent)"
            - "after election: booking_status still REBOOKED, compensation_status == ELECTED_REFUND"
            - "after process: booking_status still REBOOKED, compensation_status == SETTLED"

      - name: reaccommodation_case_branching_with_loop
        grounds:
          - state_machines.ReaccommodationCase
        distinguishing_aspect: |
          ReaccommodationCase is branching with a loop: QUEUED->ESCALATED->OFFERED->COMMITTED
          exercises the ESCALATED->OFFERED loop edge (regenerate after escalation), and the
          ESCALATED branch has no option-creation side effect while OFFERED does.
        test_recipe:
          setup:
            - "Controllable event E RECOVERY; booking disrupted (flight cancelled); case QUEUED; recovery flight F2 available"
          setup_api_calls:
            - { call: "POST /irops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: OpsAdmin }
            - { call: "POST /irops/passengers", payload: { full_name: "Uma U", contact_email: "uma@x.com" }, as: ReaccommodationAgent, captures: { pax: "$.data.id" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC1000", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T10:00:00Z", sched_arr_utc: "2026-08-10T11:00:00Z", distance_km: 900, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 100 }] }, as: OpsController, captures: { f1: "$.data.id", f1v: "$.data.version" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC1100", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T15:00:00Z", sched_arr_utc: "2026-08-10T16:00:00Z", distance_km: 900, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 100 }] }, as: OpsController }
            - { call: "POST /irops/disruption-events", payload: { event_code: "MECH-7", hub: "HUB", classification: "MECHANICAL", cost_cap_cents: 1000000 }, as: DutyManager, captures: { ev: "$.data.id" } }
            - { call: "POST /irops/disruption-events/${ev}/assess", payload: {}, as: DutyManager }
            - { call: "POST /irops/bookings", payload: { passenger_id: "${pax}", fare_cents: 15000, cabin: "ECONOMY", party_size: 1, segments: [{ flight_id: "${f1}", seq_no: 1 }] }, as: ReaccommodationAgent, captures: { bk: "$.data.id" } }
            - { call: "POST /irops/flights/${f1}/cancel", payload: { disruption_event_id: "${ev}", expected_flight_version: "${f1v}" }, as: OpsController }
            - { call: "GET /irops/reaccommodation-cases?booking_id=${bk}", as: ReaccommodationAgent, captures: { cs: "$.data[0].id" } }
          trigger:
            - { call: "POST /irops/reaccommodation-cases/${cs}/escalate", payload: {}, as: ReaccommodationAgent, captures: { st_esc: "$.data.case_status" } }
            - { call: "POST /irops/reaccommodation-cases/${cs}/generate-options", payload: { include_interline: false }, as: ReaccommodationAgent, captures: { st_off: "$.data.case_status", csv: "$.data.version" } }
            - { call: "GET /irops/reaccommodation-cases/${cs}/options", as: ReaccommodationAgent, captures: { opt: "$.data[0].id" } }
            - { call: "POST /irops/reaccommodation-cases/${cs}/commit", payload: { option_id: "${opt}", expected_case_version: "${csv}" }, as: ReaccommodationAgent, captures: { st_com: "$.data.case_status" } }
          assert:
            - "escalate from QUEUED yields case_status == ESCALATED with no options created (branch side-effect divergence)"
            - "generate-options from ESCALATED loops back to OFFERED and creates PROPOSED options"
            - "commit from OFFERED yields COMMITTED (terminal)"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers; depths 4 and 4)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: flight_cancel_cascade_depth4
        grounds:
          - state_machines.Flight.SCHEDULED_to_CANCELLED
          - state_machines.BookingSegment.CONFIRMED_to_CANCELLED
          - state_machines.Booking.ACTIVE_to_DISRUPTED
          - entities.DisruptionEvent.fields.affected_booking_count
        distinguishing_aspect: |
          Trigger = flight cancel. Depth-4 chain: Flight CANCELLED -> BookingSegments CANCELLED
          (link 1) -> each Booking becomes DISRUPTED (link 2, caused by the segment mutation)
          -> ReaccommodationCase created per booking (link 3, caused by the booking mutation)
          -> CANCELLATION CommunicationLogs queued + event counters recomputed (link 4).
        test_recipe:
          setup:
            - "Event E (MECHANICAL) ASSESSING; flight F with ECONOMY 100 carries booking BA (party 1) and booking BB (party 2) for two passengers"
          setup_api_calls:
            - { call: "POST /irops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: OpsAdmin }
            - { call: "POST /irops/passengers", payload: { full_name: "Cas A", contact_email: "casa@x.com" }, as: ReaccommodationAgent, captures: { pa: "$.data.id" } }
            - { call: "POST /irops/passengers", payload: { full_name: "Cas B", contact_email: "casb@x.com" }, as: ReaccommodationAgent, captures: { pb: "$.data.id" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC2000", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T10:00:00Z", sched_arr_utc: "2026-08-10T11:00:00Z", distance_km: 900, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 100 }] }, as: OpsController, captures: { f: "$.data.id", fv: "$.data.version" } }
            - { call: "POST /irops/disruption-events", payload: { event_code: "MECH-8", hub: "HUB", classification: "MECHANICAL", cost_cap_cents: 1000000 }, as: DutyManager, captures: { ev: "$.data.id" } }
            - { call: "POST /irops/disruption-events/${ev}/assess", payload: {}, as: DutyManager }
            - { call: "POST /irops/bookings", payload: { passenger_id: "${pa}", fare_cents: 12000, cabin: "ECONOMY", party_size: 1, segments: [{ flight_id: "${f}", seq_no: 1 }] }, as: ReaccommodationAgent, captures: { ba: "$.data.id" } }
            - { call: "POST /irops/bookings", payload: { passenger_id: "${pb}", fare_cents: 24000, cabin: "ECONOMY", party_size: 2, segments: [{ flight_id: "${f}", seq_no: 1 }] }, as: ReaccommodationAgent, captures: { bb: "$.data.id" } }
          trigger:
            - { call: "POST /irops/flights/${f}/cancel", payload: { disruption_event_id: "${ev}", expected_flight_version: "${fv}" }, as: OpsController }
            - { call: "GET /irops/booking-segments?flight_id=${f}", as: ReaccommodationAgent }
            - { call: "GET /irops/bookings/${ba}", as: ReaccommodationAgent }
            - { call: "GET /irops/bookings/${bb}", as: ReaccommodationAgent }
            - { call: "GET /irops/reaccommodation-cases?disruption_event_id=${ev}", as: ReaccommodationAgent, captures: { n_cases: "$.data[0].id" } }
            - { call: "GET /irops/communication-logs?disruption_event_id=${ev}", as: DutyManager }
            - { call: "GET /irops/disruption-events/${ev}", as: DutyManager }
          assert:
            - "link 1: both segments on flight ${f} have segment_status == CANCELLED"
            - "link 2: Booking.${ba}.booking_status == DISRUPTED and Booking.${bb}.booking_status == DISRUPTED"
            - "link 3: two ReaccommodationCases exist for the event (one per booking), both QUEUED"
            - "link 4: two CommunicationLog rows (template CANCELLATION, log_status QUEUED) exist for the event"
            - "event counters: affected_booking_count == 2, affected_passenger_count == 3 (party 1 + party 2)"

      - name: flight_delay_misconnect_cascade
        grounds:
          - state_machines.Flight.SCHEDULED_to_DELAYED
          - state_machines.BookingSegment.CONFIRMED_to_DISRUPTED
          - state_machines.Booking.ACTIVE_to_DISRUPTED
        distinguishing_aspect: |
          Trigger = flight delay (different trigger than the cancel cascade). Chain: Flight
          retimed -> onward segment of a through-itinerary becomes DISRUPTED by misconnect
          protection (link 1) -> Booking becomes DISRUPTED (link 2) -> ReaccommodationCase
          created (link 3) -> DISRUPTION_DETECTED CommunicationLog queued (link 4).
        test_recipe:
          setup:
            - "Event E (MECHANICAL) OPEN; through booking B: M1 (AAA->BBB, arr 09:00) then M2 (BBB->CCC, dep 10:00, 60-min connection >= 45 at booking time)"
          setup_api_calls:
            - { call: "POST /irops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: OpsAdmin }
            - { call: "POST /irops/passengers", payload: { full_name: "Dee D", contact_email: "dee@x.com" }, as: ReaccommodationAgent, captures: { pax: "$.data.id" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC21", origin: "AAA", destination: "BBB", sched_dep_utc: "2026-08-10T08:00:00Z", sched_arr_utc: "2026-08-10T09:00:00Z", distance_km: 800, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 50 }] }, as: OpsController, captures: { m1: "$.data.id", m1v: "$.data.version" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC22", origin: "BBB", destination: "CCC", sched_dep_utc: "2026-08-10T10:00:00Z", sched_arr_utc: "2026-08-10T11:00:00Z", distance_km: 800, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 50 }] }, as: OpsController, captures: { m2: "$.data.id" } }
            - { call: "POST /irops/disruption-events", payload: { event_code: "MECH-9", hub: "AAA", classification: "MECHANICAL", cost_cap_cents: 1000000 }, as: DutyManager, captures: { ev: "$.data.id" } }
            - { call: "POST /irops/bookings", payload: { passenger_id: "${pax}", fare_cents: 22000, cabin: "ECONOMY", party_size: 1, segments: [{ flight_id: "${m1}", seq_no: 1 }, { flight_id: "${m2}", seq_no: 2 }] }, as: ReaccommodationAgent, captures: { bk: "$.data.id" } }
          trigger:
            - { call: "POST /irops/flights/${m1}/delay", payload: { new_sched_dep_utc: "2026-08-10T08:30:00Z", new_sched_arr_utc: "2026-08-10T09:30:00Z", disruption_event_id: "${ev}", expected_flight_version: "${m1v}" }, as: OpsController }
            - { call: "GET /irops/booking-segments?booking_id=${bk}", as: ReaccommodationAgent }
            - { call: "GET /irops/bookings/${bk}", as: ReaccommodationAgent }
            - { call: "GET /irops/reaccommodation-cases?booking_id=${bk}", as: ReaccommodationAgent }
            - { call: "GET /irops/communication-logs?booking_id=${bk}", as: DutyManager }
          assert:
            - "link 1: segment 2 (flight ${m2}) has segment_status == DISRUPTED (new connection 30 min < MIN_CONNECT_MINUTES 45); segment 1 stays CONFIRMED"
            - "link 2: Booking.${bk}.booking_status == DISRUPTED"
            - "link 3: exactly one ReaccommodationCase exists for the booking, case_status == QUEUED"
            - "link 4: a CommunicationLog with template == DISRUPTION_DETECTED exists for the booking"
            - "delay alone grants no compensation: Booking.${bk}.compensation_status == NONE"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (three different category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_voucher_issue
        grounds:
          - validations[priority=12]
          - validations[priority=30]
          - errors[ERR_BOOKING_NOT_DISRUPTED]
          - errors[ERR_EVENT_COST_CAP_EXCEEDED]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: the request violates both
          ERR_BOOKING_NOT_DISRUPTED (priority 12, booking ACTIVE) and
          ERR_EVENT_COST_CAP_EXCEEDED (priority 30, cap 1 < 5000); the state error wins.
        test_recipe:
          setup:
            - "Event E (MECHANICAL) in RECOVERY with cost_cap_cents = 1; healthy flight H; booking B (party 1) ACTIVE on H — never disrupted"
          setup_api_calls:
            - { call: "POST /irops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: OpsAdmin }
            - { call: "POST /irops/passengers", payload: { full_name: "Eve E", contact_email: "eve@x.com" }, as: ReaccommodationAgent, captures: { pax: "$.data.id" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC3000", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T10:00:00Z", sched_arr_utc: "2026-08-10T11:00:00Z", distance_km: 900, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 100 }] }, as: OpsController, captures: { f: "$.data.id" } }
            - { call: "POST /irops/disruption-events", payload: { event_code: "MECH-10", hub: "HUB", classification: "MECHANICAL", cost_cap_cents: 1 }, as: DutyManager, captures: { ev: "$.data.id" } }
            - { call: "POST /irops/disruption-events/${ev}/assess", payload: {}, as: DutyManager }
            - { call: "POST /irops/disruption-events/${ev}/declare-recovery", payload: {}, as: DutyManager }
            - { call: "POST /irops/bookings", payload: { passenger_id: "${pax}", fare_cents: 12000, cabin: "ECONOMY", party_size: 1, segments: [{ flight_id: "${f}", seq_no: 1 }] }, as: ReaccommodationAgent, captures: { bk: "$.data.id" } }
          trigger:
            - { call: "POST /irops/bookings/${bk}/vouchers", payload: { voucher_type: "TRANSPORT" }, as: ReaccommodationAgent, captures: { err: "$.data.error_id" } }
          assert:
            - "response is 409 with error_id == ERR_BOOKING_NOT_DISRUPTED (priority 12 beats priority 30 ERR_EVENT_COST_CAP_EXCEEDED)"

      - name: temporal_beats_fiscal_on_voucher_issue
        grounds:
          - validations[priority=28]
          - validations[priority=30]
          - errors[ERR_VOUCHER_RULE_NOT_MET]
          - errors[ERR_EVENT_COST_CAP_EXCEEDED]
        distinguishing_aspect: |
          Category pair business_temporal vs business_fiscal (different pair than
          state_beats_fiscal_on_voucher_issue): HOTEL request with a 6-hour disruption window
          violates the 8-hour rule (priority 28) AND the event cap (priority 30);
          the temporal error wins.
        test_recipe:
          setup:
            - "Event E (MECHANICAL, cost_cap_cents = 1) RECOVERY; flight F cancelled at 06:00; booking B REBOOKED via committed option onto R dep 12:00 (window exactly 6h < 8h)"
          setup_api_calls:
            - { call: "POST /irops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: OpsAdmin }
            - { call: "POST /irops/passengers", payload: { full_name: "Fox F", contact_email: "fox@x.com" }, as: ReaccommodationAgent, captures: { pax: "$.data.id" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC3100", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T09:00:00Z", sched_arr_utc: "2026-08-10T10:00:00Z", distance_km: 900, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 100 }] }, as: OpsController, captures: { f: "$.data.id", fv: "$.data.version" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC3200", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T12:00:00Z", sched_arr_utc: "2026-08-10T13:00:00Z", distance_km: 900, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 100 }] }, as: OpsController }
            - { call: "POST /irops/disruption-events", payload: { event_code: "MECH-11", hub: "HUB", classification: "MECHANICAL", cost_cap_cents: 1 }, as: DutyManager, captures: { ev: "$.data.id" } }
            - { call: "POST /irops/disruption-events/${ev}/assess", payload: {}, as: DutyManager }
            - { call: "POST /irops/bookings", payload: { passenger_id: "${pax}", fare_cents: 12000, cabin: "ECONOMY", party_size: 1, segments: [{ flight_id: "${f}", seq_no: 1 }] }, as: ReaccommodationAgent, captures: { bk: "$.data.id" } }
            - { call: "POST /irops/flights/${f}/cancel", payload: { disruption_event_id: "${ev}", expected_flight_version: "${fv}" }, as: OpsController }
            - { call: "POST /irops/disruption-events/${ev}/declare-recovery", payload: {}, as: DutyManager }
            - { call: "GET /irops/reaccommodation-cases?booking_id=${bk}", as: ReaccommodationAgent, captures: { cs: "$.data[0].id" } }
            - { call: "POST /irops/reaccommodation-cases/${cs}/generate-options", payload: { include_interline: false }, as: ReaccommodationAgent, captures: { csv: "$.data.version" } }
            - { call: "GET /irops/reaccommodation-cases/${cs}/options", as: ReaccommodationAgent, captures: { opt: "$.data[0].id" } }
            - { call: "POST /irops/reaccommodation-cases/${cs}/commit", payload: { option_id: "${opt}", expected_case_version: "${csv}" }, as: ReaccommodationAgent }
          trigger:
            - { call: "POST /irops/bookings/${bk}/vouchers", payload: { voucher_type: "HOTEL", check_in_date: "2026-08-10" }, as: ReaccommodationAgent, captures: { err: "$.data.error_id" } }
          assert:
            - "response is 422 with error_id == ERR_VOUCHER_RULE_NOT_MET (priority 28 beats priority 30 ERR_EVENT_COST_CAP_EXCEEDED, even though the cap of 1 cent is also breached)"

      - name: existence_beats_state_on_commit
        grounds:
          - validations[priority=6]
          - validations[priority=14]
          - errors[ERR_NOT_FOUND]
          - errors[ERR_CASE_NOT_COMMITTABLE]
        distinguishing_aspect: |
          Category pair existence vs state: the case is already COMMITTED (priority 14 would
          reject) AND the named option_id does not exist (priority 6); the existence error wins.
        test_recipe:
          setup:
            - "Event E (MECHANICAL) RECOVERY; booking disrupted and case already COMMITTED onto recovery flight R"
          setup_api_calls:
            - { call: "POST /irops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: OpsAdmin }
            - { call: "POST /irops/passengers", payload: { full_name: "Gus G", contact_email: "gus@x.com" }, as: ReaccommodationAgent, captures: { pax: "$.data.id" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC3300", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T09:00:00Z", sched_arr_utc: "2026-08-10T10:00:00Z", distance_km: 900, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 100 }] }, as: OpsController, captures: { f: "$.data.id", fv: "$.data.version" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC3400", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T14:00:00Z", sched_arr_utc: "2026-08-10T15:00:00Z", distance_km: 900, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 100 }] }, as: OpsController }
            - { call: "POST /irops/disruption-events", payload: { event_code: "MECH-12", hub: "HUB", classification: "MECHANICAL", cost_cap_cents: 1000000 }, as: DutyManager, captures: { ev: "$.data.id" } }
            - { call: "POST /irops/disruption-events/${ev}/assess", payload: {}, as: DutyManager }
            - { call: "POST /irops/bookings", payload: { passenger_id: "${pax}", fare_cents: 12000, cabin: "ECONOMY", party_size: 1, segments: [{ flight_id: "${f}", seq_no: 1 }] }, as: ReaccommodationAgent, captures: { bk: "$.data.id" } }
            - { call: "POST /irops/flights/${f}/cancel", payload: { disruption_event_id: "${ev}", expected_flight_version: "${fv}" }, as: OpsController }
            - { call: "GET /irops/reaccommodation-cases?booking_id=${bk}", as: ReaccommodationAgent, captures: { cs: "$.data[0].id" } }
            - { call: "POST /irops/reaccommodation-cases/${cs}/generate-options", payload: { include_interline: false }, as: ReaccommodationAgent, captures: { csv: "$.data.version" } }
            - { call: "GET /irops/reaccommodation-cases/${cs}/options", as: ReaccommodationAgent, captures: { opt: "$.data[0].id" } }
            - { call: "POST /irops/reaccommodation-cases/${cs}/commit", payload: { option_id: "${opt}", expected_case_version: "${csv}" }, as: ReaccommodationAgent }
            - { call: "GET /irops/reaccommodation-cases/${cs}", as: ReaccommodationAgent, captures: { csv2: "$.data.version" } }
          trigger:
            - { call: "POST /irops/reaccommodation-cases/${cs}/commit", payload: { option_id: "00000000-0000-4000-8000-000000000000", expected_case_version: "${csv2}" }, as: ReaccommodationAgent, captures: { err: "$.data.error_id" } }
          assert:
            - "response is 404 with error_id == ERR_NOT_FOUND (priority 6 existence beats priority 14 ERR_CASE_NOT_COMMITTED)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: compensation_boundary_180_minutes
        grounds:
          - calculations.compensation_amount
          - validations[priority=20]
          - state_machines.Flight.IN_FLIGHT_to_ARRIVED
        distinguishing_aspect: |
          Metric = arrival-delay minutes vs orig_sched_arr_utc on record-actuals; the rule is
          >= 180 (inclusive). Flight J1 lands exactly 180 min late -> ELIGIBLE_PENDING with
          25000; flight J2 lands 179 min late -> compensation stays NONE with 0.
        test_recipe:
          setup:
            - "Event E (MECHANICAL) ASSESSING; J1 and J2 (both 1200 km, orig sched arr 12:00) each carry one booking; both linked to E via a zero-change delay call (times unchanged, dep 10:00 arr 12:00)"
          setup_api_calls:
            - { call: "POST /irops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: OpsAdmin }
            - { call: "POST /irops/passengers", payload: { full_name: "Hal H", contact_email: "hal@x.com" }, as: ReaccommodationAgent, captures: { p1: "$.data.id" } }
            - { call: "POST /irops/passengers", payload: { full_name: "Ida I", contact_email: "ida@x.com" }, as: ReaccommodationAgent, captures: { p2: "$.data.id" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC41", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T10:00:00Z", sched_arr_utc: "2026-08-10T12:00:00Z", distance_km: 1200, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 50 }] }, as: OpsController, captures: { j1: "$.data.id", j1v: "$.data.version" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC42", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T10:00:00Z", sched_arr_utc: "2026-08-10T12:00:00Z", distance_km: 1200, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 50 }] }, as: OpsController, captures: { j2: "$.data.id", j2v: "$.data.version" } }
            - { call: "POST /irops/disruption-events", payload: { event_code: "MECH-13", hub: "HUB", classification: "MECHANICAL", cost_cap_cents: 1000000 }, as: DutyManager, captures: { ev: "$.data.id" } }
            - { call: "POST /irops/disruption-events/${ev}/assess", payload: {}, as: DutyManager }
            - { call: "POST /irops/bookings", payload: { passenger_id: "${p1}", fare_cents: 12000, cabin: "ECONOMY", party_size: 1, segments: [{ flight_id: "${j1}", seq_no: 1 }] }, as: ReaccommodationAgent, captures: { b1: "$.data.id" } }
            - { call: "POST /irops/bookings", payload: { passenger_id: "${p2}", fare_cents: 12000, cabin: "ECONOMY", party_size: 1, segments: [{ flight_id: "${j2}", seq_no: 1 }] }, as: ReaccommodationAgent, captures: { b2: "$.data.id" } }
            - { call: "POST /irops/flights/${j1}/delay", payload: { new_sched_dep_utc: "2026-08-10T10:00:00Z", new_sched_arr_utc: "2026-08-10T12:00:00Z", disruption_event_id: "${ev}", expected_flight_version: "${j1v}" }, as: OpsController }
            - { call: "POST /irops/flights/${j2}/delay", payload: { new_sched_dep_utc: "2026-08-10T10:00:00Z", new_sched_arr_utc: "2026-08-10T12:00:00Z", disruption_event_id: "${ev}", expected_flight_version: "${j2v}" }, as: OpsController }
          trigger:
            - { call: "POST /irops/flights/${j1}/depart", payload: { act_dep_utc: "2026-08-10T11:05:00Z" }, as: OpsController }
            - { call: "POST /irops/flights/${j1}/record-actuals", payload: { act_arr_utc: "2026-08-10T15:00:00Z" }, as: OpsController }
            - { call: "POST /irops/flights/${j2}/depart", payload: { act_dep_utc: "2026-08-10T11:05:00Z" }, as: OpsController }
            - { call: "POST /irops/flights/${j2}/record-actuals", payload: { act_arr_utc: "2026-08-10T14:59:00Z" }, as: OpsController }
            - { call: "GET /irops/bookings/${b1}", as: ReaccommodationAgent }
            - { call: "GET /irops/bookings/${b2}", as: ReaccommodationAgent }
          assert:
            - "Booking.${b1}.compensation_status == ELIGIBLE_PENDING (180 >= 180, inclusive boundary)"
            - "Booking.${b1}.compensation_amount_cents == 25000 and compensation_basis == FINAL (1200 km tier)"
            - "Booking.${b2}.compensation_status == NONE (179 < 180) and compensation_amount_cents == 0"

      - name: empty_option_set_rejection
        grounds:
          - calculations.recovery_option_selection
          - validations[priority=22]
          - errors[ERR_NO_REACCOM_OPTIONS]
        distinguishing_aspect: |
          Metric = candidate-set cardinality (empty collection) on generate-options — distinct
          from the minute-threshold boundary. Zero eligible flights -> 422
          ERR_NO_REACCOM_OPTIONS and the case stays QUEUED (no OFFERED transition).
        test_recipe:
          setup:
            - "Event E (MECHANICAL) ASSESSING; flight F cancelled; booking B DISRUPTED with a QUEUED case; NO other flights exist in the system"
          setup_api_calls:
            - { call: "POST /irops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: OpsAdmin }
            - { call: "POST /irops/passengers", payload: { full_name: "Jay J", contact_email: "jay@x.com" }, as: ReaccommodationAgent, captures: { pax: "$.data.id" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC5000", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T10:00:00Z", sched_arr_utc: "2026-08-10T11:00:00Z", distance_km: 900, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 100 }] }, as: OpsController, captures: { f: "$.data.id", fv: "$.data.version" } }
            - { call: "POST /irops/disruption-events", payload: { event_code: "MECH-14", hub: "HUB", classification: "MECHANICAL", cost_cap_cents: 1000000 }, as: DutyManager, captures: { ev: "$.data.id" } }
            - { call: "POST /irops/disruption-events/${ev}/assess", payload: {}, as: DutyManager }
            - { call: "POST /irops/bookings", payload: { passenger_id: "${pax}", fare_cents: 12000, cabin: "ECONOMY", party_size: 1, segments: [{ flight_id: "${f}", seq_no: 1 }] }, as: ReaccommodationAgent, captures: { bk: "$.data.id" } }
            - { call: "POST /irops/flights/${f}/cancel", payload: { disruption_event_id: "${ev}", expected_flight_version: "${fv}" }, as: OpsController }
            - { call: "GET /irops/reaccommodation-cases?booking_id=${bk}", as: ReaccommodationAgent, captures: { cs: "$.data[0].id" } }
          trigger:
            - { call: "POST /irops/reaccommodation-cases/${cs}/generate-options", payload: { include_interline: false }, as: ReaccommodationAgent, captures: { err: "$.data.error_id" } }
            - { call: "GET /irops/reaccommodation-cases/${cs}", as: ReaccommodationAgent }
          assert:
            - "response is 422 with error_id == ERR_NO_REACCOM_OPTIONS (empty candidate set)"
            - "ReaccommodationCase.${cs}.case_status == QUEUED afterwards (no state change on the empty fallback)"

      - name: meal_window_floor_boundary
        grounds:
          - calculations.voucher_entitlement
          - validations[priority=28]
        distinguishing_aspect: |
          Metric = disruption-window whole hours feeding floor(window/4) meal counts and the
          8h hotel threshold on the voucher endpoint — a floor/ceil boundary, distinct from the
          >= delay threshold and the empty-set boundary. Window exactly 8h -> 2 meals (3000) and
          hotel eligible (15000); window 7h -> 1 meal (1500) and hotel rejected.
        test_recipe:
          setup:
            - "Event E (MECHANICAL, cap 500000) RECOVERY; flight F cancelled at 06:00 carrying bookings B1 and B2 (different passengers); recovery flights R1 (dep 14:00, 8h window) and R2 (dep 13:00, 7h window); B1 committed to R1, B2 committed to R2 (R2 ranks first: earlier arrival)"
          setup_api_calls:
            - { call: "POST /irops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: OpsAdmin }
            - { call: "POST /irops/passengers", payload: { full_name: "Kim K", contact_email: "kim@x.com" }, as: ReaccommodationAgent, captures: { p1: "$.data.id" } }
            - { call: "POST /irops/passengers", payload: { full_name: "Lee L", contact_email: "lee@x.com" }, as: ReaccommodationAgent, captures: { p2: "$.data.id" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC61", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T09:00:00Z", sched_arr_utc: "2026-08-10T10:00:00Z", distance_km: 900, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 100 }] }, as: OpsController, captures: { f: "$.data.id", fv: "$.data.version" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC62", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T14:00:00Z", sched_arr_utc: "2026-08-10T15:00:00Z", distance_km: 900, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 100 }] }, as: OpsController }
            - { call: "POST /irops/flights", payload: { flight_number: "OC63", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T13:00:00Z", sched_arr_utc: "2026-08-10T14:00:00Z", distance_km: 900, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 100 }] }, as: OpsController }
            - { call: "POST /irops/disruption-events", payload: { event_code: "MECH-15", hub: "HUB", classification: "MECHANICAL", cost_cap_cents: 500000 }, as: DutyManager, captures: { ev: "$.data.id" } }
            - { call: "POST /irops/disruption-events/${ev}/assess", payload: {}, as: DutyManager }
            - { call: "POST /irops/bookings", payload: { passenger_id: "${p1}", fare_cents: 12000, cabin: "ECONOMY", party_size: 1, segments: [{ flight_id: "${f}", seq_no: 1 }] }, as: ReaccommodationAgent, captures: { b1: "$.data.id" } }
            - { call: "POST /irops/bookings", payload: { passenger_id: "${p2}", fare_cents: 12000, cabin: "ECONOMY", party_size: 1, segments: [{ flight_id: "${f}", seq_no: 1 }] }, as: ReaccommodationAgent, captures: { b2: "$.data.id" } }
            - { call: "POST /irops/flights/${f}/cancel", payload: { disruption_event_id: "${ev}", expected_flight_version: "${fv}" }, as: OpsController }
            - { call: "POST /irops/disruption-events/${ev}/declare-recovery", payload: {}, as: DutyManager }
            - { call: "GET /irops/reaccommodation-cases?booking_id=${b1}", as: ReaccommodationAgent, captures: { c1: "$.data[0].id" } }
            - { call: "POST /irops/reaccommodation-cases/${c1}/generate-options", payload: { include_interline: false }, as: ReaccommodationAgent, captures: { c1v: "$.data.version" } }
            - { call: "GET /irops/reaccommodation-cases/${c1}/options", as: ReaccommodationAgent, captures: { o1: "$.data[1].id" } }
            - { call: "POST /irops/reaccommodation-cases/${c1}/commit", payload: { option_id: "${o1}", expected_case_version: "${c1v}" }, as: ReaccommodationAgent }
            - { call: "GET /irops/reaccommodation-cases?booking_id=${b2}", as: ReaccommodationAgent, captures: { c2: "$.data[0].id" } }
            - { call: "POST /irops/reaccommodation-cases/${c2}/generate-options", payload: { include_interline: false }, as: ReaccommodationAgent, captures: { c2v: "$.data.version" } }
            - { call: "GET /irops/reaccommodation-cases/${c2}/options", as: ReaccommodationAgent, captures: { o2: "$.data[0].id" } }
            - { call: "POST /irops/reaccommodation-cases/${c2}/commit", payload: { option_id: "${o2}", expected_case_version: "${c2v}" }, as: ReaccommodationAgent }
          trigger:
            - { call: "POST /irops/bookings/${b1}/vouchers", payload: { voucher_type: "MEAL" }, as: ReaccommodationAgent, captures: { m1: "$.data.id", m1_face: "$.data.face_value_cents", m1_count: "$.data.meals_count" } }
            - { call: "POST /irops/bookings/${b1}/vouchers", payload: { voucher_type: "HOTEL", check_in_date: "2026-08-10" }, as: ReaccommodationAgent, captures: { h1_face: "$.data.face_value_cents" } }
            - { call: "POST /irops/bookings/${b2}/vouchers", payload: { voucher_type: "MEAL" }, as: ReaccommodationAgent, captures: { m2_face: "$.data.face_value_cents", m2_count: "$.data.meals_count" } }
            - { call: "POST /irops/bookings/${b2}/vouchers", payload: { voucher_type: "HOTEL", check_in_date: "2026-08-10" }, as: ReaccommodationAgent, captures: { err: "$.data.error_id" } }
          assert:
            - "B1 MEAL: meals_count == 2 and face_value_cents == 3000 (floor(8/4))"
            - "B1 HOTEL: face_value_cents == 15000 (8h >= 8h threshold, nights = max(1, ceil(8/24)) = 1)"
            - "B2 MEAL: meals_count == 1 and face_value_cents == 1500 (floor(7/4))"
            - "B2 HOTEL: 422 ERR_VOUCHER_RULE_NOT_MET (7h < 8h)"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: commit_requires_target_flight_committable
        grounds:
          - state_machines.ReaccommodationCase.OFFERED_to_COMMITTED
          - state_machines.ReaccommodationOption.PROPOSED_to_EXPIRED
          - validations[priority=15]
        distinguishing_aspect: |
          Pair ReaccommodationCase/Option -> Flight: after option generation the target flight
          F_b is itself cancelled, which auto-expires the option; commit then fails with
          ERR_OPTION_NOT_PROPOSED. The valid transition set of the case depends on Flight state.
        test_recipe:
          setup:
            - "Event E (MECHANICAL) RECOVERY; booking B disrupted (F_a cancelled); case OFFERED with option targeting F_b"
          setup_api_calls:
            - { call: "POST /irops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: OpsAdmin }
            - { call: "POST /irops/passengers", payload: { full_name: "Meg M", contact_email: "meg@x.com" }, as: ReaccommodationAgent, captures: { pax: "$.data.id" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC71", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T09:00:00Z", sched_arr_utc: "2026-08-10T10:00:00Z", distance_km: 900, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 100 }] }, as: OpsController, captures: { fa: "$.data.id", fav: "$.data.version" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC72", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T14:00:00Z", sched_arr_utc: "2026-08-10T15:00:00Z", distance_km: 900, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 100 }] }, as: OpsController, captures: { fb: "$.data.id", fbv: "$.data.version" } }
            - { call: "POST /irops/disruption-events", payload: { event_code: "MECH-16", hub: "HUB", classification: "MECHANICAL", cost_cap_cents: 1000000 }, as: DutyManager, captures: { ev: "$.data.id" } }
            - { call: "POST /irops/disruption-events/${ev}/assess", payload: {}, as: DutyManager }
            - { call: "POST /irops/bookings", payload: { passenger_id: "${pax}", fare_cents: 12000, cabin: "ECONOMY", party_size: 1, segments: [{ flight_id: "${fa}", seq_no: 1 }] }, as: ReaccommodationAgent, captures: { bk: "$.data.id" } }
            - { call: "POST /irops/flights/${fa}/cancel", payload: { disruption_event_id: "${ev}", expected_flight_version: "${fav}" }, as: OpsController }
            - { call: "GET /irops/reaccommodation-cases?booking_id=${bk}", as: ReaccommodationAgent, captures: { cs: "$.data[0].id" } }
            - { call: "POST /irops/reaccommodation-cases/${cs}/generate-options", payload: { include_interline: false }, as: ReaccommodationAgent, captures: { csv: "$.data.version" } }
            - { call: "GET /irops/reaccommodation-cases/${cs}/options", as: ReaccommodationAgent, captures: { opt: "$.data[0].id" } }
          trigger:
            - { call: "POST /irops/flights/${fb}/cancel", payload: { disruption_event_id: "${ev}", expected_flight_version: "${fbv}" }, as: OpsController }
            - { call: "POST /irops/reaccommodation-cases/${cs}/commit", payload: { option_id: "${opt}", expected_case_version: "${csv}" }, as: ReaccommodationAgent, captures: { err: "$.data.error_id" } }
            - { call: "GET /irops/reaccommodation-options/${opt}", as: ReaccommodationAgent }
          assert:
            - "cancelling target flight ${fb} marks the PROPOSED option EXPIRED (cross-entity cascade)"
            - "commit then fails 409 with error_id == ERR_OPTION_NOT_PROPOSED"
            - "ReaccommodationCase.${cs}.case_status remains OFFERED (commit rejected, no booking mutation)"

      - name: voucher_requires_event_recovery
        grounds:
          - validations[priority=10]
          - state_machines.DisruptionEvent
        distinguishing_aspect: |
          Pair Voucher -> DisruptionEvent: voucher issuance is gated on the event being in
          RECOVERY; with the booking legitimately DISRUPTED but the event merely ASSESSING,
          issuance fails ERR_EVENT_INVALID_STATE; after declare-recovery the identical call succeeds.
        test_recipe:
          setup:
            - "Event E (MECHANICAL) ASSESSING; flight F cancelled under E; booking B DISRUPTED"
          setup_api_calls:
            - { call: "POST /irops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: OpsAdmin }
            - { call: "POST /irops/passengers", payload: { full_name: "Ned N", contact_email: "ned@x.com" }, as: ReaccommodationAgent, captures: { pax: "$.data.id" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC81", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T09:00:00Z", sched_arr_utc: "2026-08-10T10:00:00Z", distance_km: 900, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 100 }] }, as: OpsController, captures: { f: "$.data.id", fv: "$.data.version" } }
            - { call: "POST /irops/disruption-events", payload: { event_code: "MECH-17", hub: "HUB", classification: "MECHANICAL", cost_cap_cents: 100000 }, as: DutyManager, captures: { ev: "$.data.id" } }
            - { call: "POST /irops/disruption-events/${ev}/assess", payload: {}, as: DutyManager }
            - { call: "POST /irops/bookings", payload: { passenger_id: "${pax}", fare_cents: 12000, cabin: "ECONOMY", party_size: 1, segments: [{ flight_id: "${f}", seq_no: 1 }] }, as: ReaccommodationAgent, captures: { bk: "$.data.id" } }
            - { call: "POST /irops/flights/${f}/cancel", payload: { disruption_event_id: "${ev}", expected_flight_version: "${fv}" }, as: OpsController }
          trigger:
            - { call: "POST /irops/bookings/${bk}/vouchers", payload: { voucher_type: "TRANSPORT" }, as: ReaccommodationAgent, captures: { err: "$.data.error_id" } }
            - { call: "POST /irops/disruption-events/${ev}/declare-recovery", payload: {}, as: DutyManager }
            - { call: "POST /irops/bookings/${bk}/vouchers", payload: { voucher_type: "TRANSPORT" }, as: ReaccommodationAgent, captures: { vt: "$.data.id" } }
          assert:
            - "while event ASSESSING: 409 ERR_EVENT_INVALID_STATE (booking state alone is insufficient)"
            - "after declare-recovery: identical voucher call returns 201 with face_value_cents == 5000"

      - name: event_close_requires_cases_terminal
        grounds:
          - state_machines.DisruptionEvent.RECOVERY_to_CLOSED
          - validations[priority=11]
          - errors[ERR_EVENT_CLOSE_BLOCKED]
        distinguishing_aspect: |
          Pair DisruptionEvent -> ReaccommodationCase (child-state gate in the opposite
          direction): close is rejected while any case is non-terminal; voiding the case via
          booking cancel unblocks the identical close call.
        test_recipe:
          setup:
            - "Event E (WEATHER, uncontrollable) RECOVERY; flight F cancelled under E; booking B DISRUPTED with case QUEUED"
          setup_api_calls:
            - { call: "POST /irops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: OpsAdmin }
            - { call: "POST /irops/passengers", payload: { full_name: "Ora O", contact_email: "ora@x.com" }, as: ReaccommodationAgent, captures: { pax: "$.data.id" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC91", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T09:00:00Z", sched_arr_utc: "2026-08-10T10:00:00Z", distance_km: 900, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 100 }] }, as: OpsController, captures: { f: "$.data.id", fv: "$.data.version" } }
            - { call: "POST /irops/disruption-events", payload: { event_code: "WX-1", hub: "HUB", classification: "WEATHER", cost_cap_cents: 100000 }, as: DutyManager, captures: { ev: "$.data.id" } }
            - { call: "POST /irops/disruption-events/${ev}/assess", payload: {}, as: DutyManager }
            - { call: "POST /irops/bookings", payload: { passenger_id: "${pax}", fare_cents: 12000, cabin: "ECONOMY", party_size: 1, segments: [{ flight_id: "${f}", seq_no: 1 }] }, as: ReaccommodationAgent, captures: { bk: "$.data.id" } }
            - { call: "POST /irops/flights/${f}/cancel", payload: { disruption_event_id: "${ev}", expected_flight_version: "${fv}" }, as: OpsController }
            - { call: "POST /irops/disruption-events/${ev}/declare-recovery", payload: {}, as: DutyManager }
          trigger:
            - { call: "POST /irops/disruption-events/${ev}/close", payload: {}, as: DutyManager, captures: { err: "$.data.error_id" } }
            - { call: "POST /irops/bookings/${bk}/cancel", payload: {}, as: ReaccommodationAgent }
            - { call: "POST /irops/disruption-events/${ev}/close", payload: {}, as: DutyManager, captures: { st: "$.data.event_status" } }
          assert:
            - "first close: 409 ERR_EVENT_CLOSE_BLOCKED (QUEUED case on the event)"
            - "booking cancel cascades the case to VOIDED"
            - "second close succeeds: event_status == CLOSED"
            - "uncontrollable event: Booking.${bk}.compensation_status stayed NONE throughout"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: crew_duty_overlap_half_open
        grounds:
          - calculations.crew_legality_eval
          - validations[priority=19]
          - errors[ERR_CREW_DUTY_OVERLAP]
        distinguishing_aspect: |
          Resource = crew member, semantics = continuous half-open [duty_start, duty_end) at
          minute precision: a duty starting exactly at the previous duty's end is NOT an
          overlap (14:00 == 14:00 passes); one minute earlier (13:59) collides and is rejected.
        test_recipe:
          setup:
            - "Flight K exists; crew member CM1 has no assignments"
          setup_api_calls:
            - { call: "POST /irops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /irops/flights", payload: { flight_number: "OC95", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T08:00:00Z", sched_arr_utc: "2026-08-10T10:00:00Z", distance_km: 900, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 50 }] }, as: OpsController, captures: { f: "$.data.id" } }
          trigger:
            - { call: "POST /irops/flights/${f}/crew-assignments", payload: { crew_member_ref: "CM1", crew_role: "CAPTAIN", duty_start_utc: "2026-08-10T06:00:00Z", duty_end_utc: "2026-08-10T14:00:00Z" }, as: CrewScheduler, captures: { a1: "$.data.id" } }
            - { call: "POST /irops/flights/${f}/crew-assignments", payload: { crew_member_ref: "CM1", crew_role: "FIRST_OFFICER", duty_start_utc: "2026-08-10T14:00:00Z", duty_end_utc: "2026-08-10T22:00:00Z" }, as: CrewScheduler, captures: { a2: "$.data.id" } }
            - { call: "POST /irops/flights/${f}/crew-assignments", payload: { crew_member_ref: "CM1", crew_role: "FLIGHT_ATTENDANT", duty_start_utc: "2026-08-10T13:59:00Z", duty_end_utc: "2026-08-10T21:00:00Z" }, as: CrewScheduler, captures: { err: "$.data.error_id" } }
          assert:
            - "first assignment 201 (06:00-14:00)"
            - "adjacent assignment 201: start 14:00 == prior end 14:00 is allowed under half-open semantics"
            - "overlapping assignment (start 13:59) rejected 422 ERR_CREW_DUTY_OVERLAP"

      - name: hotel_night_overlap_discrete
        grounds:
          - calculations.voucher_entitlement
          - validations[priority=25]
          - errors[ERR_HOTEL_NIGHT_OVERLAP]
        distinguishing_aspect: |
          Resource = passenger-night set, semantics = discrete calendar-night intersection
          (check_out == check_in shares no night) — a different geometric treatment than the
          continuous crew-duty rule. Voucher A covering nights {10,11} + voucher B from 08-12
          is allowed; voucher C from 08-11 intersects and is rejected.
        test_recipe:
          setup:
            - "Event E (MECHANICAL, cap 500000) RECOVERY; flight F cancelled at 2026-08-10T06:00Z carrying three party-1 bookings of the SAME passenger; recovery flight R dep 2026-08-11T12:00Z (30h window -> 2 nights); all three cases committed to R"
          setup_api_calls:
            - { call: "POST /irops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: OpsAdmin }
            - { call: "POST /irops/passengers", payload: { full_name: "Pat P", contact_email: "pat@x.com" }, as: ReaccommodationAgent, captures: { pax: "$.data.id" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC96", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T09:00:00Z", sched_arr_utc: "2026-08-10T10:00:00Z", distance_km: 900, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 10 }] }, as: OpsController, captures: { f: "$.data.id", fv: "$.data.version" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC97", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-11T12:00:00Z", sched_arr_utc: "2026-08-11T13:00:00Z", distance_km: 900, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 10 }] }, as: OpsController }
            - { call: "POST /irops/disruption-events", payload: { event_code: "MECH-18", hub: "HUB", classification: "MECHANICAL", cost_cap_cents: 500000 }, as: DutyManager, captures: { ev: "$.data.id" } }
            - { call: "POST /irops/disruption-events/${ev}/assess", payload: {}, as: DutyManager }
            - { call: "POST /irops/bookings", payload: { passenger_id: "${pax}", fare_cents: 12000, cabin: "ECONOMY", party_size: 1, segments: [{ flight_id: "${f}", seq_no: 1 }] }, as: ReaccommodationAgent, captures: { b1: "$.data.id" } }
            - { call: "POST /irops/bookings", payload: { passenger_id: "${pax}", fare_cents: 13000, cabin: "ECONOMY", party_size: 1, segments: [{ flight_id: "${f}", seq_no: 1 }] }, as: ReaccommodationAgent, captures: { b2: "$.data.id" } }
            - { call: "POST /irops/bookings", payload: { passenger_id: "${pax}", fare_cents: 14000, cabin: "ECONOMY", party_size: 1, segments: [{ flight_id: "${f}", seq_no: 1 }] }, as: ReaccommodationAgent, captures: { b3: "$.data.id" } }
            - { call: "POST /irops/flights/${f}/cancel", payload: { disruption_event_id: "${ev}", expected_flight_version: "${fv}" }, as: OpsController }
            - { call: "POST /irops/disruption-events/${ev}/declare-recovery", payload: {}, as: DutyManager }
            - { call: "GET /irops/reaccommodation-cases?booking_id=${b1}", as: ReaccommodationAgent, captures: { c1: "$.data[0].id" } }
            - { call: "POST /irops/reaccommodation-cases/${c1}/generate-options", payload: { include_interline: false }, as: ReaccommodationAgent, captures: { c1v: "$.data.version" } }
            - { call: "GET /irops/reaccommodation-cases/${c1}/options", as: ReaccommodationAgent, captures: { o1: "$.data[0].id" } }
            - { call: "POST /irops/reaccommodation-cases/${c1}/commit", payload: { option_id: "${o1}", expected_case_version: "${c1v}" }, as: ReaccommodationAgent }
            - { call: "GET /irops/reaccommodation-cases?booking_id=${b2}", as: ReaccommodationAgent, captures: { c2: "$.data[0].id" } }
            - { call: "POST /irops/reaccommodation-cases/${c2}/generate-options", payload: { include_interline: false }, as: ReaccommodationAgent, captures: { c2v: "$.data.version" } }
            - { call: "GET /irops/reaccommodation-cases/${c2}/options", as: ReaccommodationAgent, captures: { o2: "$.data[0].id" } }
            - { call: "POST /irops/reaccommodation-cases/${c2}/commit", payload: { option_id: "${o2}", expected_case_version: "${c2v}" }, as: ReaccommodationAgent }
            - { call: "GET /irops/reaccommodation-cases?booking_id=${b3}", as: ReaccommodationAgent, captures: { c3: "$.data[0].id" } }
            - { call: "POST /irops/reaccommodation-cases/${c3}/generate-options", payload: { include_interline: false }, as: ReaccommodationAgent, captures: { c3v: "$.data.version" } }
            - { call: "GET /irops/reaccommodation-cases/${c3}/options", as: ReaccommodationAgent, captures: { o3: "$.data[0].id" } }
            - { call: "POST /irops/reaccommodation-cases/${c3}/commit", payload: { option_id: "${o3}", expected_case_version: "${c3v}" }, as: ReaccommodationAgent }
          trigger:
            - { call: "POST /irops/bookings/${b1}/vouchers", payload: { voucher_type: "HOTEL", check_in_date: "2026-08-10" }, as: ReaccommodationAgent, captures: { v1: "$.data.id", v1_nights: "$.data.nights", v1_face: "$.data.face_value_cents" } }
            - { call: "POST /irops/bookings/${b2}/vouchers", payload: { voucher_type: "HOTEL", check_in_date: "2026-08-12" }, as: ReaccommodationAgent, captures: { v2: "$.data.id" } }
            - { call: "POST /irops/bookings/${b3}/vouchers", payload: { voucher_type: "HOTEL", check_in_date: "2026-08-11" }, as: ReaccommodationAgent, captures: { err: "$.data.error_id" } }
          assert:
            - "voucher 1: nights == 2 (ceil(30/24)), face_value_cents == 30000, covers nights {08-10, 08-11}"
            - "voucher 2 (check_in 08-12): 201 — night sets disjoint (voucher 1 valid_through == 2026-08-12)"
            - "voucher 3 (check_in 08-11): 422 ERR_HOTEL_NIGHT_OVERLAP — night 08-11 already covered for this passenger"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: seat_conservation_create_cancel_pair
        grounds:
          - entities.CabinInventory.fields.seats_sold
          - state_machines.Booking.DISRUPTED_to_CANCELLED
          - calculations.recovery_option_selection
        distinguishing_aspect: |
          Conserved quantity = total seats_sold on the cabin. Forward action (booking create,
          party 2) raises it to 2; the compensating action (booking cancel) returns it to 0.
          create + cancel leaves sum(CabinInventory.seats_sold) unchanged.
        test_recipe:
          setup:
            - "Flight L1 ECONOMY capacity 100, empty"
          setup_api_calls:
            - { call: "POST /irops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /irops/passengers", payload: { full_name: "Quinn Q", contact_email: "quinn@x.com" }, as: ReaccommodationAgent, captures: { pax: "$.data.id" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC99", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T10:00:00Z", sched_arr_utc: "2026-08-10T11:00:00Z", distance_km: 900, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 100 }] }, as: OpsController, captures: { f: "$.data.id" } }
            - { call: "GET /irops/flights/${f}/cabin-inventories", as: OpsController, captures: { sold_pre: "$.data[0].seats_sold" } }
          trigger:
            - { call: "POST /irops/bookings", payload: { passenger_id: "${pax}", fare_cents: 12000, cabin: "ECONOMY", party_size: 2, segments: [{ flight_id: "${f}", seq_no: 1 }] }, as: ReaccommodationAgent, captures: { bk: "$.data.id" } }
            - { call: "GET /irops/flights/${f}/cabin-inventories", as: OpsController, captures: { sold_mid: "$.data[0].seats_sold" } }
            - { call: "POST /irops/bookings/${bk}/cancel", payload: {}, as: ReaccommodationAgent }
            - { call: "GET /irops/flights/${f}/cabin-inventories", as: OpsController, captures: { sold_post: "$.data[0].seats_sold" } }
          assert:
            - "before create: seats_sold == 0"
            - "after create (party_size 2): seats_sold == 2"
            - "after cancel: seats_sold == 0 — the create/cancel pair conserves the cabin seat total"

      - name: accrual_invariant_issue_void_pair
        grounds:
          - calculations.event_cost_rollup
          - state_machines.Voucher.ISSUED_to_VOIDED
          - entities.DisruptionEvent.fields.accrual_total_cents
        distinguishing_aspect: |
          Conserved quantity = event accrual_total_cents (money, a different quantity than
          seats). Forward action (voucher issue, +5000 ACCRUAL) paired with its compensating
          action (void, -5000 REVERSAL) returns accrual_total_cents to its prior value while
          settled_total_cents never moves.
        test_recipe:
          setup:
            - "Event E (MECHANICAL, cap 100000) RECOVERY; flight F cancelled under E; booking B DISRUPTED; accrual baseline 0"
          setup_api_calls:
            - { call: "POST /irops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: OpsAdmin }
            - { call: "POST /irops/passengers", payload: { full_name: "Rae R", contact_email: "rae@x.com" }, as: ReaccommodationAgent, captures: { pax: "$.data.id" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC98", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T09:00:00Z", sched_arr_utc: "2026-08-10T10:00:00Z", distance_km: 900, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 100 }] }, as: OpsController, captures: { f: "$.data.id", fv: "$.data.version" } }
            - { call: "POST /irops/disruption-events", payload: { event_code: "MECH-19", hub: "HUB", classification: "MECHANICAL", cost_cap_cents: 100000 }, as: DutyManager, captures: { ev: "$.data.id" } }
            - { call: "POST /irops/disruption-events/${ev}/assess", payload: {}, as: DutyManager }
            - { call: "POST /irops/bookings", payload: { passenger_id: "${pax}", fare_cents: 12000, cabin: "ECONOMY", party_size: 1, segments: [{ flight_id: "${f}", seq_no: 1 }] }, as: ReaccommodationAgent, captures: { bk: "$.data.id" } }
            - { call: "POST /irops/flights/${f}/cancel", payload: { disruption_event_id: "${ev}", expected_flight_version: "${fv}" }, as: OpsController }
            - { call: "POST /irops/disruption-events/${ev}/declare-recovery", payload: {}, as: DutyManager }
            - { call: "GET /irops/disruption-events/${ev}/cost-summary", as: FinanceProcessor, captures: { acc0: "$.data.accrual_total_cents" } }
          trigger:
            - { call: "POST /irops/bookings/${bk}/vouchers", payload: { voucher_type: "TRANSPORT" }, as: ReaccommodationAgent, captures: { v: "$.data.id" } }
            - { call: "GET /irops/disruption-events/${ev}/cost-summary", as: FinanceProcessor, captures: { acc1: "$.data.accrual_total_cents" } }
            - { call: "POST /irops/vouchers/${v}/void", payload: {}, as: FinanceProcessor }
            - { call: "GET /irops/disruption-events/${ev}/cost-summary", as: FinanceProcessor, captures: { acc2: "$.data.accrual_total_cents", set2: "$.data.settled_total_cents" } }
            - { call: "GET /irops/disruption-events/${ev}/cost-entries", as: FinanceProcessor }
          assert:
            - "baseline accrual_total_cents == 0"
            - "after issue: accrual_total_cents == 5000"
            - "after void: accrual_total_cents == 0 (issue + void conserves the accrual total) and settled_total_cents == 0"
            - "ledger contains an ACCRUAL row of 5000 and a REVERSAL row of -5000, both source_type VOUCHER"


