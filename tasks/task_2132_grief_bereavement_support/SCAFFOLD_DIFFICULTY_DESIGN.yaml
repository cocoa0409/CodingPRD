              payload: { source_type: "SELF", decedent_name: "Vic Cerra", date_of_death: "2026-06-07", relationship_to_deceased: "PARENT", loss_type: "SUDDEN_DEATH", contact_name: "Wynn Cerra", contact_email: "wynn.cerra@example.org" }
