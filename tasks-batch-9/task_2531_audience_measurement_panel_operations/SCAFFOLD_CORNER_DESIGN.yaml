              payload: { market_id: "${m52_id}", quota_cell_id: "${c52_id}", recruitment_source: "ADDRESS_SAMPLE", persons_count: 2 }
              as: PanelOperationsManager
              captures: { h52a_id: "$.data.id" }
            - call: "POST /households"
              payload: { market_id: "${m52_id}", quota_cell_id: "${c52_id}", recruitment_source: "ADDRESS_SAMPLE", persons_count: 2 }
              as: PanelOperationsManager
              captures: { h52b_id: "$.data.id" }
            - call: "POST /households"
              payload: { market_id: "${m52_id}", quota_cell_id: "${c52_id}", recruitment_source: "ADDRESS_SAMPLE", persons_count: 2 }
              as: PanelOperationsManager
              captures: { h52c_id: "$.data.id" }
            - call: "POST /households"
              payload: { market_id: "${m52_id}", quota_cell_id: "${c52_id}", recruitment_source: "ADDRESS_SAMPLE", persons_count: 2 }
              as: PanelOperationsManager
              captures: { h52d_id: "$.data.id" }
            - call: "POST /meters"
              payload: { household_id: "${h52a_id}", meter_type: "TV_TUNER", serial_no: "MT-002053" }
              as: FieldTechnician
              captures: { mt52a_id: "$.data.id" }
            - call: "POST /meters"
              payload: { household_id: "${h52b_id}", meter_type: "TV_TUNER", serial_no: "MT-002054" }
              as: FieldTechnician
              captures: { mt52b_id: "$.data.id" }
            - call: "POST /meters"
              payload: { household_id: "${h52c_id}", meter_type: "TV_TUNER", serial_no: "MT-002055" }
