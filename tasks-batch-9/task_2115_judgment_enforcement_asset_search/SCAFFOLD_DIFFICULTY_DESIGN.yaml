            - "${interest2} == 0"
            - "${costs2} == 50000"
            - "${total2} == 9806164"
            - "${exp2} == 2046-01-01"
            - "${rc2} == 1"
            - "Judgment.${jud_id}.accrued_through_on == 2035-07-05"

      - name: payoff_zero_day_segment_produces_zero_interest
        grounds:
          - calculations.judgment_payoff_replay
          - entities.Judgment.fields.entered_on
          - endpoints[GET /judgments/{judgment_id}/payoff]
        distinguishing_aspect: |
          Metric 4 of 4 — the day count of the interest segment set, probed on GET /judgments/{id}/payoff:
          as_of == entered_on produces an EMPTY segment set (segment_count 0, accrued_interest_cents 0,
          total 5045000), while as_of == entered_on + 1 day produces exactly one segment worth 1370 cents.
        test_recipe:
          setup:
            - "A CA judgment entered 2026-01-01 with 5000000 cents principal at 1000 bps and 45000 cents filing costs, and zero payments."
          setup_api_calls:
            - call: "POST /creditors"
              payload: { name: "Harbor Recovery LLC", contact_email: "ops@harbor.example" }
              as: CaseManager
              captures: { cred_id: $.data.id }
            - call: "POST /debtors"
              payload: { full_name: "Dana Reyes", state_code: "CA" }
              as: CaseManager
              captures: { dbt_id: $.data.id }
            - call: "POST /judgments"
              payload: { creditor_id: "${cred_id}", debtor_id: "${dbt_id}", court_case_number: "CV-2026-0606", state_code: "CA", original_principal_cents: 5000000, interest_rate_bps: 1000, entered_on: "2026-01-01", filing_costs_cents: 45000 }
              as: CaseManager
              captures: { jud_id: $.data.id }
          trigger:
            - call: "GET /judgments/${jud_id}/payoff"
              payload: { as_of: "2026-01-01" }
              as: CaseManager
              captures: { i0: $.data.accrued_interest_cents, t0: $.data.total_payoff_cents, s0: $.data.segment_count }
            - call: "GET /judgments/${jud_id}/payoff"
              payload: { as_of: "2026-01-02" }
              as: CaseManager
              captures: { i1: $.data.accrued_interest_cents, t1: $.data.total_payoff_cents, s1: $.data.segment_count }
          assert:
            - "${i0} == 0"
            - "${t0} == 5045000"
            - "${s0} == 0"
            - "${i1} == 1370"
            - "${t1} == 5046370"
            - "${s1} == 1"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: writ_requires_recorded_filing_in_the_debtors_own_state
        grounds:
          - validations[priority=28]
          - errors[ERR_NO_PERFECTED_LIEN]
          - state_machines.Judgment.enforcement_posture.NONE_to_LIEN_PERFECTED
          - state_machines.CountyFiling.SUBMITTED_to_RECORDED
          - entities.Debtor.fields.state_code
        distinguishing_aspect: |
          Entity pair 1 of 3 — EnforcementAction depends on CountyFiling (compared against Debtor.state_code):
          a RECORDED NV filing leaves Judgment.enforcement_posture at NONE and the writ is refused with
          ERR_NO_PERFECTED_LIEN, and only after a CA filing is RECORDED does the same call succeed.
        test_recipe:
          setup:
            - "A CA debtor with a CA judgment and a VERIFIED BANK_ACCOUNT finding of 900000 cents."
            - "One zero-fee NV-CLARK filing RECORDED (wrong state, posture stays NONE) and a DRAFT BANK_LEVY action."
