              as: SupervisorTrainer
              captures: { sup_a: $.data.id }
            - call: "POST /labor-relations/supervisors"
              payload: { petition_id: "${pet_id}", full_name: "Terrence Boyd", job_title: "Shift Supervisor", span_of_control: 14, has_hire_fire_authority: true }
              as: SupervisorTrainer
              captures: { sup_b: $.data.id }
            - call: "POST /labor-relations/supervisors/${sup_a}/train"
              payload: { modules_completed: ["TIPS_BOUNDARIES", "PROHIBITED_CONDUCT", "SOLICITATION_RULES"], quiz_score: 92 }
              as: SupervisorTrainer
            - call: "POST /labor-relations/supervisors/${sup_b}/train"
              payload: { modules_completed: ["TIPS_BOUNDARIES", "PROHIBITED_CONDUCT", "SOLICITATION_RULES"], quiz_score: 88 }
              as: SupervisorTrainer
            - call: "POST /labor-relations/campaign-communications"
              payload: { petition_id: "${pet_id}", presenter_supervisor_id: "${sup_a}", channel: "SMALL_GROUP_MEETING", audience_scope: "CLASSIFICATION", planned_delivery_at: "2026-08-25T10:00:00Z", duration_minutes: 60, message_summary: "Day shift briefing on the election process", threat_statement_count: 0, contains_interrogation: false, contains_promise_of_benefit: false, contains_surveillance_reference: false, material_claim_count: 3, unsupported_material_claim_count: 0 }
              as: LaborRelationsDirector
              as_user_id: "u_dir_1"
              captures: { cc_1: $.data.id }
          trigger:
            - call: "POST /labor-relations/campaign-communications"
              payload: { petition_id: "${pet_id}", presenter_supervisor_id: "${sup_a}", channel: "SMALL_GROUP_MEETING", audience_scope: "CLASSIFICATION", planned_delivery_at: "2026-08-25T13:00:00Z", duration_minutes: 30, message_summary: "Afternoon shift briefing on the election process", threat_statement_count: 0, contains_interrogation: false, contains_promise_of_benefit: false, contains_surveillance_reference: false, material_claim_count: 3, unsupported_material_claim_count: 0 }
              as: LaborRelationsDirector
              as_user_id: "u_dir_1"
            - call: "POST /labor-relations/campaign-communications"
              payload: { petition_id: "${pet_id}", presenter_supervisor_id: "${sup_a}", channel: "SMALL_GROUP_MEETING", audience_scope: "CLASSIFICATION", planned_delivery_at: "2026-08-25T13:00:01Z", duration_minutes: 30, message_summary: "Afternoon shift briefing on the election process, moved by one second", threat_statement_count: 0, contains_interrogation: false, contains_promise_of_benefit: false, contains_surveillance_reference: false, material_claim_count: 3, unsupported_material_claim_count: 0 }
              as: LaborRelationsDirector
              as_user_id: "u_dir_1"
              captures: { cc_2: $.data.id }
            - call: "POST /labor-relations/campaign-communications"
              payload: { petition_id: "${pet_id}", presenter_supervisor_id: "${sup_b}", channel: "SMALL_GROUP_MEETING", audience_scope: "CLASSIFICATION", planned_delivery_at: "2026-08-25T13:00:00Z", duration_minutes: 30, message_summary: "Maintenance crew briefing at the originally requested hour", threat_statement_count: 0, contains_interrogation: false, contains_promise_of_benefit: false, contains_surveillance_reference: false, material_claim_count: 3, unsupported_material_claim_count: 0 }
              as: LaborRelationsDirector
              as_user_id: "u_dir_1"
              captures: { cc_3: $.data.id }
            - call: "POST /labor-relations/campaign-communications"
