      - name: line_day_hours_bucket_admits_exact_equality_then_overflows
        grounds:
          - calculations.line_day_slot_capacity
          - entities.ProductionLine.fields.daily_station_hour_capacity
          - entities.ProductionSlot.fields.station_hours_committed
          - entities.ProductionSlot.fields.sequence_position
          - errors.ERR_LINE_DAY_HOURS_EXCEEDED
          - endpoints["POST /unit-orders/{id}/production-slots"]
        distinguishing_aspect: |
          A different contended resource and different interval semantics: the
          ProductionLine day bucket keyed on a calendar date, where reservations
          never partially overlap but are summed inside a closed bucket whose
          hours ceiling is inclusive. Two 71.24 h units exactly fill a 142.48 h
          day and the third is refused on hours while the unit count 3 is still
          under the cap of 4.
        test_recipe:
