            - { call: "POST /vault/rentals/${rental_id}/activate", payload: {}, as: VaultAdmin }
          trigger:
            - { call: "POST /vault/drilling-orders", payload: { box_id: "${box_id}", rental_id: "${rental_id}", reason: "DELINQUENCY" }, as: VaultAdmin, as_user_id: "admin-1", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_DRILL_NOT_ELIGIBLE"

      - name: invoice_void_with_applied_payment_rejected
        claim_type: Priority Ordering
        grounds:
          - state_machines.Invoice.OPEN_to_VOID
          - "errors[ERR_INVOICE_HAS_PAYMENTS]"
        distinguishing_aspect: "Voiding an invoice that has a cleared payment applied → ERR_INVOICE_HAS_PAYMENTS."
        test_recipe:
          setup: ["Rental ACTIVE, invoice 24000, payment 24000 CLEARED (invoice PAID)."]
          setup_api_calls:
            - { call: "POST /vault/branches", payload: { name: "VoidP", code: "VP1", viewing_room_capacity: 2 }, as: VaultAdmin, captures: { branch_id: "$.data.id" } }
            - { call: "POST /vault/box-types", payload: { size_class: "MEDIUM", annual_rate_cents: 24000, height_mm: 100, width_mm: 250, depth_mm: 500 }, as: VaultAdmin, captures: { bt_id: "$.data.id" } }
            - { call: "POST /vault/boxes", payload: { branch_id: "${branch_id}", box_type_id: "${bt_id}", box_number: "VP-1" }, as: VaultAdmin, captures: { box_id: "$.data.id" } }
            - { call: "POST /vault/renters", payload: { full_name: "Vic Paid", email: "vic@x.com", gov_id_ref: "G-41", date_of_birth: "1986-12-12" }, as: VaultAdmin, captures: { renter_id: "$.data.id" } }
            - { call: "POST /vault/renters/${renter_id}/verify-kyc", payload: {}, as: ComplianceOfficer }
            - { call: "POST /vault/rentals", payload: { box_id: "${box_id}", renter_id: "${renter_id}", plan_term_months: 12 }, as: VaultAdmin, captures: { rental_id: "$.data.id" } }
            - { call: "POST /vault/rentals/${rental_id}/activate", payload: {}, as: VaultAdmin }
            - { call: "GET /vault/invoices?rental_id=${rental_id}", payload: {}, as: VaultAdmin, captures: { inv_id: "$.data[0].id" } }
            - { call: "POST /vault/payments", payload: { rental_id: "${rental_id}", invoice_id: "${inv_id}", amount_cents: 24000, method: "WIRE" }, as: BillingClerk, captures: { pay_id: "$.data.id" } }
            - { call: "POST /vault/payments/${pay_id}/clear", payload: {}, as: BillingClerk }
          trigger:
            - { call: "POST /vault/invoices/${inv_id}/void", payload: {}, as: VaultAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVOICE_HAS_PAYMENTS"

