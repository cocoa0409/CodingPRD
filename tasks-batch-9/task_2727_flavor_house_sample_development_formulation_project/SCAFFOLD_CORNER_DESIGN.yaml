              as: RegulatoryAffairs
              captures: { r1_ver: "$.data.version" }
          trigger:
            - call: "POST /substantiation-records/${r1}/verify"
              payload: {}
              as: RegulatoryAffairs
              captures: { err: "$.data.error_id" }
          assert:
