            - call: "POST /udi/surgical-cases"
              payload: { patient_id: "${pat_id}", case_number: "CASE-1", or_room_code: "OR-3", scheduled_start_utc: "2026-09-20T08:00:00Z", scheduled_end_utc: "2026-09-20T10:00:00Z", surgeon_code: "SURG-9" }
