              payload: { docs_version: 2, tos_version: 1 }
              as: Developer
              as_user_id: "${d1_id}"
            - call: "POST /developers/${d1_id}/onboarding-acknowledgement"
              payload: { docs_version: 3, tos_version: 1 }
              as: Developer
              as_user_id: "${d1_id}"
          assert:
            - "after docs 1: onboarding_state == DOCS_ACKNOWLEDGED, docs_version_acknowledged == 1, tos_version_accepted == 1, trust_score == 50"
            - "after docs 2: onboarding_state == DOCS_ACKNOWLEDGED (self-loop, not advanced), docs_version_acknowledged == 2, trust_score == 56"
            - "after docs 3: docs_version_acknowledged == 3 and trust_score == 56 (DOCS_POINTS is a threshold, not an accumulator)"
            - "the developer's version counter is 4 after the three writes"

      - name: parallel_dimensions_change_independently
        claim_type: Parallel
        excluded_because:
          difficulty_instance: quota_assignment_parallel_dimensions_independent
          rationale: >-
            The parallel-shape claim for QuotaAssignment — entitlement_state and throttle_state
            advancing on independent axes, with suspension preserving the throttle reading and
            reinstatement restoring the combined state — is exactly what that difficulty
            instance drives, including the combined-state matrix after suspend/reinstate.

      - name: standing_cascade_reaches_pool_directory_and_leases
        claim_type: Cascade down
        excluded_because:
          difficulty_instance: upheld_violation_cascades_restriction_suspension_pool_and_delisting
          rationale: >-
            The cascade-down claim (one adjudication moving Developer.standing, then
            QuotaAssignment.entitlement_state, then the product's allocated pool, the directory
            listing and the ACTIVE leases) is the whole subject of that transitive_cascade
            instance, which also pins the non-terminal-children-only restriction.

      - name: sunset_cascade_is_conditional_on_child_state
        claim_type: Conditional cascade
        excluded_because:
          difficulty_instance: checkpoint_sunset_cascades_retirement_then_upgrade_voiding
          rationale: >-
            The conditional-cascade claim — a checkpoint sunset retiring only the assignments
            pinned to the sunsetting version, then voiding only their PENDING upgrade requests
            while already-decided requests are untouched — is that instance's core assertion.

      - name: credit_relief_adjusts_a_second_entity
        claim_type: Cross-entity
        excluded_because:
          difficulty_instance: incident_resolution_credit_relieves_hard_throttle
          rationale: >-
            The cross-entity side-effect claim (resolving a SupportCase mutating each affected
            QuotaAssignment's bonus_call_credit and then re-deriving throttle_state) is driven
            end-to-end by that transitive_cascade instance.

      - name: appeal_dismissal_reverses_every_original_side_effect
        claim_type: Compensation
        excluded_because:
          difficulty_instance: appeal_dismissal_restores_violation_points_ledger
          rationale: >-
            The compensation claim — undoing an upheld adjudication and requiring the points
            ledger, standing, entitlement and pool to return to their pre-adjudication values
            with no drift — is that compensating_invariant instance verbatim.

      - name: guarded_transition_requires_a_second_entity_state
        claim_type: Guarded transitions
        excluded_because:
          difficulty_instance: assignment_activation_requires_developer_good_standing
          rationale: >-
            The guarded-transition claim (PROVISIONED -> ACTIVE permitted only while the owning
            Developer is in standing GOOD_STANDING, refused while UNDER_REVIEW or RESTRICTED)
            is precisely that cross_entity_state_dependency instance.

      - name: revision_cycle_terminates_at_the_declared_cap
        claim_type: Cyclic
        excluded_because:
          difficulty_instance: access_application_revision_cycle_capped_at_three_rounds
          rationale: >-
            The cyclic-shape termination claim for AccessApplication — the
            UNDER_REVIEW / CHANGES_REQUESTED / SUBMITTED loop counting revision_round and
            refusing the fourth round — is that non_linear_state_machine instance's subject.

      - name: appeal_cycle_admits_exactly_one_iteration
        claim_type: Cyclic
        excluded_because:
          difficulty_instance: violation_case_appeal_cycle_single_appeal_only
          rationale: >-
            The single-iteration cycle on ViolationCase (UPHELD -> APPEALED -> UPHELD and no
            second appeal, versus UPHELD -> APPEALED -> DISMISSED) is driven by that
            non_linear_state_machine instance.

  - section: calculations
    instances:
      - name: upgrade_allocation_fills_the_pool_in_priority_order
        claim_type: waterfall_allocation
        grounds:
          - calculations.upgrade_allocation_waterfall
          - endpoints.POST /api-products/{id}/upgrade-allocation-run
          - state_machines.UpgradeRequest
        distinguishing_aspect: >-
          A pool of 3300 spare rpm is drained by three requests that together want 4400, with
          every branch of the three-way min exercised once: the PARTNER request is cut by its
          own headroom (3000 of 3500 wanted), the first STANDARD request is cut by the pool
          remainder (300 of 400 wanted), and the last one meets remaining == 0 and is DEFERRED
          with denial_reason POOL_EXHAUSTED rather than granted zero. The ordering is the
          differentiator: cheapest-first inside a tier makes the 400-delta request beat the
          500-delta one even though the latter was created first.
        test_recipe:
          setup:
            - "product P2 has sustained_rpm_pool 7200 and monthly_call_pool 50000000, one GA version 1.0.0, scope catalog [catalog.read PUBLIC]"
            - "Dp holds a PROFESSIONAL certification (trust 71, band 1.00) and an ACTIVE PARTNER assignment: sustained 3000, ceiling 6000, headroom 3000"
            - "Ds1 and Ds2 are uncertified (trust 56, band 0.75) and hold ACTIVE STANDARD assignments: sustained 450, ceiling 1200, headroom 750"
            - "allocated_sustained_rpm is 3900 and available_sustained_rpm is 3300 before the run"
            - "Rs2 (delta 500) is created BEFORE Rs1 (delta 400) so that created_at ordering would give the opposite result"
