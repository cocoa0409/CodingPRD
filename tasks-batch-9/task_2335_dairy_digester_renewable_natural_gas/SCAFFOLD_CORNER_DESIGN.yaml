          - state_machines.RevenueStatement.transitions.DRAFT_to_APPROVED
        distinguishing_aspect: >
          The override is dimension-scoped and unblocking: DISTRIBUTION turns the LOCKED
          covenant posture into RESTRICTED and lets the previously refused approval through
          on the very next call, while ops_posture is left at STABLE untouched.
        test_recipe:
          setup:
            - "Canonical plant with a DRAFT statement of exactly 1000000 cents gas revenue, which has driven distribution_posture to LOCKED (dscr 0.613)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /facilities"
              payload: { name: "Tulare Digester 1", digester_volume_m3: 6000.000, hydraulic_capacity_tonnes_per_day: 500.000, thermal_regime: "MESOPHILIC", target_temperature_c: 38.0, reserve_target_cents: 4000000, annual_debt_service_cents: 18000000, dscr_minimum: 1.250 }
              as: PlatformAdmin
