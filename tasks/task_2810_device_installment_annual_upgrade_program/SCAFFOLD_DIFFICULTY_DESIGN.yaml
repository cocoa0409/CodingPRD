          Category pair (state, business_fiscal): priority 54 ERR_LOAN_DELINQUENT (409) versus
          priority 100 ERR_UPGRADE_THRESHOLD_NOT_MET (409). One request violates both — the
          loan sits in GRACE at dpd 10 and has only 10 of 24 installments PAID
          (eligibility_ratio_bps 4166 < 5000) — and the state check must win. The two errors
