  - section: validations
    instances:
      - name: pharmacist_role_with_unknown_staff_id_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Entity-backed auth: X-User-ID that resolves to no PharmacyStaff fails priority-1 authentication with 401 before any business check."
        test_recipe:
          setup: ["study + site exist"]
          setup_api_calls:
            - { call: "POST /api/studies", payload: { protocol_number: "P-VAL-1", title: "Val", phase: "PHASE_I", blinding_model: "OPEN_LABEL", max_dose_per_visit_mg: 100 }, as: SponsorAdmin, captures: { study: $.data.id } }
            - { call: "POST /api/sites", payload: { study_id: "${study}", site_number: "S1", name: "Site", principal_investigator: "Dr A" }, as: SponsorAdmin, captures: { site: $.data.id } }
          trigger:
            - { call: "POST /api/temperature-logs", payload: { site_id: "${site}", celsius: 5.0, source: "MANUAL" }, as: Pharmacist, as_user_id: "00000000-0000-0000-0000-000000000000", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHENTICATED and HTTP status 401"
      - name: invalid_role_beats_not_found_in_priority
        claim_type: priority_ordering
        grounds: ["validations[priority=1]", "validations[priority=4]", "errors[ERR_UNAUTHENTICATED]", "errors[ERR_STUDY_NOT_FOUND]"]
        distinguishing_aspect: "Priority conflict: an unknown role AND a non-existent study id in the same request — priority-1 auth error ERR_UNAUTHENTICATED wins over the 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/studies/00000000-0000-0000-0000-000000000000", as: GhostRole, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHENTICATED and HTTP status 401 (auth outranks existence)"
      - name: duplicate_protocol_number_returns_409
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_DUPLICATE_PROTOCOL_NUMBER]"]
        distinguishing_aspect: "Study.protocol_number uniqueness is global; second create with the same value gets ERR_DUPLICATE_PROTOCOL_NUMBER (409)."
        test_recipe:
          setup: ["one study P-DUP exists"]
          setup_api_calls:
            - { call: "POST /api/studies", payload: { protocol_number: "P-DUP", title: "First", phase: "PHASE_I", blinding_model: "OPEN_LABEL", max_dose_per_visit_mg: 100 }, as: SponsorAdmin }
          trigger:
            - { call: "POST /api/studies", payload: { protocol_number: "P-DUP", title: "Second", phase: "PHASE_II", blinding_model: "DOUBLE_BLIND", max_dose_per_visit_mg: 100 }, as: SponsorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_DUPLICATE_PROTOCOL_NUMBER and HTTP status 409"
      - name: duplicate_kit_number_in_shipment_is_all_or_nothing
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_DUPLICATE_KIT_NUMBER]"]
        distinguishing_aspect: "Bulk atomicity: a payload duplicating K-DUP within one shipment is rejected wholesale — no kit from that shipment persists."
        test_recipe:
          setup: ["study + site + lot exist"]
          setup_api_calls:
            - { call: "POST /api/studies", payload: { protocol_number: "P-VAL-4", title: "Val", phase: "PHASE_I", blinding_model: "OPEN_LABEL", max_dose_per_visit_mg: 100 }, as: SponsorAdmin, captures: { study: $.data.id } }
            - { call: "POST /api/sites", payload: { study_id: "${study}", site_number: "S1", name: "Site", principal_investigator: "Dr A" }, as: SponsorAdmin, captures: { site: $.data.id } }
            - { call: "POST /api/lots", payload: { study_id: "${study}", lot_number: "LOT-VAL-4", product_name: "DrugX", strength_mg: 50, dosage_form: "VIAL", expiry_date: "2027-06-01T00:00:00Z", storage_temp_min_celsius: 2, storage_temp_max_celsius: 8, stability_budget_minutes: 600 }, as: SponsorAdmin, captures: { lot: $.data.id } }
          trigger:
            - { call: "POST /api/shipments", payload: { lot_id: "${lot}", site_id: "${site}", kit_numbers: ["K-DUP", "K-DUP", "K-OK"], units_per_kit: 10 }, as: SponsorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_DUPLICATE_KIT_NUMBER and HTTP status 409"
            - "GET /api/kits?lot_id=${lot} afterwards has total_count == 0 (all-or-nothing rollback)"
