              payload: {}
              as: HfaAllocationOfficer
              captures: { pool_v: $.data.version }
          trigger:
            - call: "POST /volume-cap-allocations/00000000-0000-0000-0000-0000000000ff/decision"
              payload: { decision: "AWARD", awarded_amount_cents: 200000000, expiry_date: "2027-06-30T00:00:00Z", expected_cap_pool_version: "${pool_v}" }
              as: HfaComplianceOfficer
              as_user_id: "hfa-comp-1"
              captures: { err: $.data.error_id }
          assert:
            - "the response is HTTP 403 with error_id == ERR_FORBIDDEN_ROLE"
            - "error_id != ERR_ALLOCATION_NOT_FOUND even though the path id does not exist"
            - "CapPool.${pool_id}.reserved_cents stays 0, committed_cents stays 0 and available_cents stays 600000000"
            - "CapPool.${pool_id}.version is unchanged from ${pool_v}"

