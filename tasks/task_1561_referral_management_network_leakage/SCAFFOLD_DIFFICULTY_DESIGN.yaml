          endpoint from sla_expiry_inclusive_boundary's days on aging-sweep).
          start + 15m exactly is allowed; start + 14m59s is rejected.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; full bootstrap; referral R accepted/assigned/booked: appointment A at 2026-08-01T10:00:00Z-11:00:00Z"
          setup_api_calls:
