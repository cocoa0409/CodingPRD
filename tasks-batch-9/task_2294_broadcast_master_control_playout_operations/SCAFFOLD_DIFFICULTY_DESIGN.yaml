      - name: waiver_accepts_score_exactly_40_and_refuses_39
        grounds:
          - calculations.asset_technical_score
          - validations[priority=33]
          - errors[ERR_QC_WAIVER_SCORE_TOO_LOW]
          - state_machines.Asset.QC_FAILED_to_QC_WAIVED
          - entities.Asset.fields.waiver_justification
        distinguishing_aspect: |
          Metric: quality POINTS on the governing QCReport, reached through a
          third endpoint. Asset W40 scores exactly 100 - 18 (BLACK_FRAMES) - 30
          (duration penalty capped, |120-100| == 20 -> ceil(10)*3 == 30) - 12
          (loudness -30.0 LKFS is 6.0 outside the 2.0 tolerance) == 40 and is
          waivable because the test is score >= WAIVER_MIN_SCORE 40; asset W39
          scores 100 - 40 - 9 - 12 == 39, one point lower, and is refused.
        test_recipe:
          setup:
            - "Operators: Quinn QC (role_class QC) inspects; Pat Director (role_class PROGRAM_DIRECTOR, override_authority FULL) signs the waiver, so the segregation-of-duties test (signer != inspector) passes."
            - "Asset W40: expected_duration_seconds 100, required_resolution_class SD_480I, captions_required false; delivered at SD_480I with measured_duration_seconds 120 and audio_loudness_lkfs -30.0."
            - "Asset W40's INGEST QCReport carries defect_codes [BLACK_FRAMES] and measured_duration_seconds 120: defect_penalty_points 18, duration_penalty_points 30, loudness_penalty_points 12, fault_penalty_points 0, technical_score 40, verdict FAIL, so Asset.status == QC_FAILED. AUDIO_LOSS is absent, so the caption/critical-defect gate at priority 32 cannot fire."
            - "Asset W39: expected_duration_seconds 100, same required/delivered resolution, captions_required false; delivered with measured_duration_seconds 106 and audio_loudness_lkfs -30.0."
            - "Asset W39's INGEST QCReport carries defect_codes [LOUDNESS_OUT_OF_SPEC, BLACK_FRAMES, VIDEO_ARTIFACT] and measured_duration_seconds 106: defect_penalty_points 40 (12 + 18 + 10), duration_penalty_points 9 (|106-100| == 6 -> ceil(3)*3), loudness_penalty_points 12, technical_score 39, verdict FAIL, Asset.status == QC_FAILED."
            - "The logical clock stands at 2026-08-01T10:00:00Z."
          setup_api_calls:
            - call: "POST /operators"
              payload: { full_name: "Quinn QC", role_class: "QC", override_authority: "NONE", certification_expires_utc: "2027-01-01T00:00:00Z" }
              as: StationAdmin
              as_user_id: "admin-1"
              captures: { qc_id: "$.data.id" }
            - call: "POST /operators"
              payload: { full_name: "Pat Director", role_class: "PROGRAM_DIRECTOR", override_authority: "FULL", certification_expires_utc: "2027-01-01T00:00:00Z" }
              as: StationAdmin
              as_user_id: "admin-1"
              captures: { pd_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T10:00:00Z" }
              as: StationAdmin
              as_user_id: "admin-1"
            - call: "POST /assets"
              payload: { house_number: "HN-W40", title: "Marginal Master 40", source: "FILE_DELIVERY", expected_duration_seconds: 100, delivery_deadline_utc: "2026-08-05T00:00:00Z", required_resolution_class: "SD_480I", captions_required: false }
              as: TrafficCoordinator
              as_user_id: "traffic-1"
              captures: { asset_w40_id: "$.data.id" }
            - call: "POST /assets/${asset_w40_id}/delivery"
              payload: { received_utc: "2026-08-01T10:00:00Z", measured_duration_seconds: 120, video_codec: "H264", delivered_resolution_class: "SD_480I", frame_rate: 29.97, audio_loudness_lkfs: -30.0, audio_channel_config: "STEREO_2_0", caption_present: false }
              as: QCTechnician
              as_user_id: "${qc_id}"
              captures: { asset_w40_v: "$.data.version" }
            - call: "POST /assets/${asset_w40_id}/qc-reports"
