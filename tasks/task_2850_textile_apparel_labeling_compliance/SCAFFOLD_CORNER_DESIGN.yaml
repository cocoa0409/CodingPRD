        excluded_because:
          difficulty_instance: compensating_invariant / finding_units_are_conserved_across_disposition_and_reopen
          rationale: "That §1.8 instance triggers ERR_DISPOSITION_INCOMPLETE while proving units_affected is conserved, and combinatorial_formula / durability_floor_composes_market_max_class_factor_ceiling_and_evidence_min triggers ERR_DURABILITY_INSUFFICIENT one cycle below the composed floor."

  - section: rbac
    instances:
      - name: only_the_auditor_may_verify_a_remediated_finding
        claim_type: exclusive_operations_allowed
        grounds:
          - roles.Auditor.exclusive_operations
          - endpoints[POST /labeling/audit-findings/{id}/verify]
        distinguishing_aspect: "Verification is the Auditor's single exclusive write, and it is the hinge that lets a finding roll up into its audit: the same call from the ComplianceAdmin who recorded the disposition is refused, so no role can both remediate and bless its own remediation."
        test_recipe:
          setup:
            - "Brand B1 exists with style NL-4410. Audit A1 carries one CARE_UNSUBSTANTIATED finding F1 over 100 units, and a disposition has released all 100 units, so F1 is REMEDIATED."
          setup_api_calls:
            - call: "POST /labeling/market-requirements"
              payload: { market_code: "US", required_languages: ["en"], fiber_tolerance_pp: 3.0, absolute_claim_tolerance_pp: 0.0, min_durability_cycles: 20, marking_duty_rate: 0.100, requires_identity_disclosure: true, requires_origin_statement: true }
              as: ComplianceAdmin
            - call: "POST /labeling/brands"
              payload: { legal_name: "Northline Apparel Co", party_type: "BRAND_OWNER", rn_number: "RN12345", responsibility_mode: "SELF_OF_RECORD" }
              as: ComplianceAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /labeling/styles"
              payload: { brand_id: "${brand_id}", style_code: "NL-4410", product_class: "WOVEN_OUTERWEAR", target_market_codes: ["US"], net_weight_grams: 320.0, declared_fibers: [{ fiber_generic_name: "COTTON", declared_pct: 100.0, ornamentation_exempt: false }] }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { style_id: $.data.id }
            - call: "POST /labeling/compliance-audits"
              payload: { brand_id: "${brand_id}", scope: "STYLE_DOSSIER", audit_window_from: "2026-01-01T00:00:00Z", audit_window_to: "2026-12-31T00:00:00Z" }
              as: Auditor
              as_user_id: "user-audit-1"
              captures: { audit_id: $.data.id }
            - call: "POST /labeling/compliance-audits/${audit_id}/findings"
              payload: { style_id: "${style_id}", finding_code: "CARE_UNSUBSTANTIATED", units_affected: 100 }
              as: Auditor
              as_user_id: "user-audit-1"
              captures: { finding_id: $.data.id }
            - call: "POST /labeling/audit-findings/${finding_id}/disposition"
              payload: { units_relabeled: 0, units_destroyed: 0, units_released: 100 }
              as: ComplianceAdmin
              captures: { f_state: $.data.state, f_unresolved: $.data.units_unresolved }
          trigger:
            - call: "POST /labeling/audit-findings/${finding_id}/verify"
              payload: {}
              as: ComplianceAdmin
              captures: { e_role: $.data.error_id }
            - call: "POST /labeling/audit-findings/${finding_id}/verify"
              payload: {}
              as: Auditor
              as_user_id: "user-audit-1"
              captures: { final_state: $.data.state, verified_at: $.data.verified_at }
            - call: "GET /labeling/compliance-audits/${audit_id}"
              payload: {}
              as: Auditor
              as_user_id: "user-audit-1"
              captures: { open_cnt: $.data.open_finding_count, scope_cnt: $.data.units_in_scope, audit_state: $.data.state }
          assert:
            - "Setup sanity: ${f_state} == \"REMEDIATED\" and ${f_unresolved} == 0"
            - "ComplianceAdmin attempt: HTTP 403 and ${e_role} == \"ERR_ROLE_NOT_PERMITTED\" - verify is not in its shared_operations list"
            - "Auditor attempt: HTTP 200 with ${final_state} == \"CLOSED\" and ${verified_at} == the logical clock instant"
            - "${open_cnt} == 0, ${scope_cnt} == 100 and ${audit_state} == \"PENDING_CLOSURE\" - the rollup counts drop the closed finding while units_in_scope has no state filter"

      - name: a_brand_admin_cannot_approve_a_label_spec
