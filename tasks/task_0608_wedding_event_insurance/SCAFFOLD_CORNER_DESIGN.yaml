          - errors[ERR_NOT_POLICY_OWNER]
        distinguishing_aspect: "A Policyholder whose X-User-ID != Policy.policyholder_id calling cancel → ERR_NOT_POLICY_OWNER (403); policy unchanged."
        test_recipe:
          setup: ["A bound, paid, in-force policy owned by ph-1 with one CANCELLATION coverage."]
          setup_api_calls:
            - call: "POST /coverage-products"
              payload: { coverage_type: "CANCELLATION", tier: "STANDARD", base_premium_cents: 20000, per_guest_premium_cents: 300, coverage_limit_cents: 5000000, deposit_sublimit_pct: 0.5 }
              as: PlatformAdmin
              captures: { canc_prod_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "Grand Hall", category: "VENUE", deposit_paid_cents: 800000 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /policies"
              payload: { policy_form: "SINGLE_EVENT", serves_alcohol: false }
              as: Policyholder
              as_user_id: "ph-1"
              captures: { policy_id: $.data.id }
            - call: "POST /policies/${policy_id}/event-profiles"
