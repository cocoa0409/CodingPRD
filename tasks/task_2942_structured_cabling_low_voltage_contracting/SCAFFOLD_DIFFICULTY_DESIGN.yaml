        grounds:
          - state_machines.Link.install_state.TESTED_PASS_to_CERTIFIED
          - calculations.project_certification_rollup
          - state_machines.WarrantyRegistration.DRAFT_to_READY
          - entities.CablingProject.fields.warranty_status
          - entities.WarrantyRegistration.fields.pinned_project_version
        distinguishing_aspect: |
          Cascade A, depth 4, triggered by POST /cabling/links/{link_id}/certify: hop 1 sets
          install_state CERTIFIED; hop 2 is caused by hop 1 and recomputes the project roll-up
          to completeness_pct_strict 100.00; hop 3 is caused by hop 2 and flips warranty_status
          NOT_ELIGIBLE -> ELIGIBLE; hop 4 is caused by hop 3 and moves the DRAFT
          WarrantyRegistration to READY with pinned_project_version stamped. Nothing but the
          certify call is issued, and each hop reads only the previous hop's output.
