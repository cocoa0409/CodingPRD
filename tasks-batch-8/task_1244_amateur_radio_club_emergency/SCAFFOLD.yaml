  - { method: POST, path: "/check-ins", description: "Member checks in to an OPEN net; member_id = caller; license class/expiry enforced; one check-in per member per net", roles: [Member], code: 201, input: [net_session_id, "has_traffic?", "traffic_count?"], output: CheckIn, side_effects: ["checked_in_at = clock_now", "net checkin_count recompute", "member readiness recompute (optimistic counts immediately; verified counts after net CLOSED)"] }
  - { method: GET, path: "/check-ins", description: "List check-ins (reverse-reachability for CheckIn FKs)", roles: [ClubAdmin, NetControl, Member], code: 200, input: ["net_session_id?", "member_id?", "limit?", "offset?"], output: "CheckIn[]", side_effects: [] }
