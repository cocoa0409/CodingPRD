            - call: "GET /channels/${ch1_id}"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
          assert:
            - "after the first fault (AUDIO_LOSS -> derived MAJOR): open_major_fault_count == 1 and posture == NORMAL, because MAJOR_FAULT_DEGRADE_THRESHOLD is 2"
            - "after the second fault (BLACK_FRAME -> derived MAJOR): open_major_fault_count == 2 and posture == DEGRADED (clause 4)"
            - "after the third fault (ENCODER_FAILURE -> derived CRITICAL): posture == DEGRADED_CRITICAL (clause 3 outranks clause 4)"
            - "after the override activation: posture == EMERGENCY (clause 2 outranks clause 3) while open_critical_fault_count is still 1 and air_status is unchanged by the crawl overlay"
            - "after the transmitter goes OFF_AIR: allocation_state == STARVED and posture == SUSPENDED (clause 1 outranks clause 2), with Multiplex.${mux1_id}.effective_capacity_kbps == 0"
            - "mitigating the two MAJOR faults would drop open_major_fault_count to 0 without changing the posture while the higher clauses still hold — the ladder is evaluated top-down on every recomputation"
            - "Channel.${ch2_id} on the same multiplex is SUSPENDED too (shared transmitter) but has open_fault_count == 0 — fault counts are per channel, derate is per multiplex"

