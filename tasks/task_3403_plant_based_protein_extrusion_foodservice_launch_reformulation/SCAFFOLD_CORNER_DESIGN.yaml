        distinguishing_aspect: "The limited-time test can only open inside its declared window: at clock 2026-09-01 a program whose window starts 2026-10-01 fails IN_WINDOW with 422."
        test_recipe:
          setup: ["Product PROD-K-28 in PILOT; LTO program PROG-K-28 ACTIVE with window 2026-10-01..2026-10-31; clock still at default 2026-09-01T00:00:00Z."]
