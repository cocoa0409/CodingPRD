              as: BrandAdministrator
              captures: { pt2_id: $.data.id }
            - call: "POST /franchise/plan-templates/${pt2_id}/publish"
              payload: {}
              as: BrandAdministrator
            - call: "POST /franchise/promotions"
              payload: { franchisee_id: "${f1_id}", plan_template_id: "${pt1_id}", code: "JULY10", discount_pct: 0.10, starts_on: "2026-07-01", ends_on: "2026-07-31" }
              as: FranchiseOwner
