              as: StateOffice
            - call: "POST /teams"
              payload: { season_id: "${season_id}", school_name: "Northgate High" }
              as: StateOffice
              captures: { team_id: $.data.id }
            - call: "POST /assessors"
              payload: { full_name: "Dana Ruiz", credential_number: "AS-1001", certified_methods: ["SKINFOLD", "BIA"], certification_expires_on: "2027-06-30" }
              as: StateOffice
              captures: { assessor_id: $.data.id }
            - call: "POST /assessors/${assessor_id}/training-records"
