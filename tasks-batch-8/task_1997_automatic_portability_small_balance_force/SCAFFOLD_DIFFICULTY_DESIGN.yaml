            - "While LOCKED: err2 == ERR_DUPLICATE_OPEN_BATCH (409) — occupancy spans the whole non-terminal set"
            - "After REVIEWED (attest cascades RECONCILED -> REVIEWED): a new batch ${b_x2} is created successfully"

  - rule_id: compensating_invariant
    instances:
      - name: ira_money_conservation_transfer_cycle
        grounds:
          - state_machines.SafeHarborIRA.MATCHED_to_TRANSFER_PENDING
          - state_machines.Transfer.SENT_to_RETURNED
          - state_machines.Transfer.SENT_to_RECONCILED
          - calculations.transfer_available_amount
        distinguishing_aspect: |
          Conserved quantity: IRA cents. Invariant at every observable point:
          balance_cents + in_flight_cents + total_transferred_out_cents + total_fees_cents == funded_amount_cents.
          The forward action (transfer initiation: balance -> in_flight) paired with its compensating
          action (rejection: in_flight -> balance) leaves every term unchanged; a subsequent accepted
          transfer moves the value into total_transferred_out_cents without breaking the identity.
