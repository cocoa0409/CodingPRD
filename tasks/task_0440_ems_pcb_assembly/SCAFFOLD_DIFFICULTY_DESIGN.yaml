      - name: kit_zero_shortage_empty_short_set_succeeds
        grounds:
          - calculations.kit_required_qty
          - state_machines.WorkOrder.PLANNED_to_KITTED
          - entities.WorkOrder.fields.kit_shortage_count
        distinguishing_aspect: |
          Empty-set / zero-count boundary on a different metric and endpoint: kitting
          via POST /work-orders/{id}/kit succeeds only when kit_shortage_count == 0
          (empty SHORT set). With AVAILABLE exactly equal to required_qty (4 == 4, not
