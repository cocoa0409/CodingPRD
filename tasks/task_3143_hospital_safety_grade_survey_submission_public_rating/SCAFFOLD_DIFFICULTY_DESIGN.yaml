              as: HospitalRespondent
              as_user_id: "${p5_id}"
            - call: "POST /hospital-safety-rating/hospitals/${p5_id}/survey-measures"
              payload: { survey_id: "${s5_id}", measure_code: "o2", raw_value: 95.0, source_program_id: "CMS_HOSPITAL_COMPARE" }
              as: HospitalRespondent
              as_user_id: "${p5_id}"
            - call: "POST /hospital-safety-rating/hospitals/${p5_id}/survey-measures"
              payload: { survey_id: "${s5_id}", measure_code: "o3", raw_value: 95.0, source_program_id: "CMS_HOSPITAL_COMPARE" }
              as: HospitalRespondent
              as_user_id: "${p5_id}"
            - call: "POST /hospital-safety-rating/hospitals/${p5_id}/survey-measures"
              payload: { survey_id: "${s5_id}", measure_code: "o4", raw_value: 95.0, source_program_id: "CMS_HOSPITAL_COMPARE" }
              as: HospitalRespondent
              as_user_id: "${p5_id}"
            - call: "POST /hospital-safety-rating/surveys/${s5_id}/submit"
              payload: {}
              as: HospitalRespondent
              as_user_id: "${p5_id}"
            - call: "POST /hospital-safety-rating/surveys/${s5_id}/verify"
              payload: { verification_response: "ACCEPT" }
              as: VerificationAnalyst
              as_user_id: "va-owen"
            - call: "POST /hospital-safety-rating/hospitals/${p5_id}/refresh-measures"
              payload: { expected_hospital_version: "${p5_v0}" }
              as: RatingEngine
              captures: { p5_v1: $.data.version }
          trigger:
            - call: "POST /hospital-safety-rating/hospitals/${p5_id}/score-runs"
              payload: { methodology_version_id: "${meth_mg_id}", release_cycle_id: "${rc_mg_id}", expected_hospital_version: "${p5_v1}" }
              as: RatingEngine
              captures: { run5_id: $.data.id, run5_comp: $.data.composite_score, run5_letter: $.data.letter_grade }
            - call: "GET /hospital-safety-rating/hospitals/${p5_id}/composite-preview"
              payload: { methodology_version_id: "${meth_mg_id}" }
