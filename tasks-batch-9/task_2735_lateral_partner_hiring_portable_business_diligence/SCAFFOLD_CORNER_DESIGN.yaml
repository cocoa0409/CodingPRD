      - name: questionnaire_revision_loop_termination_condition_respected
        claim_type: cyclic
        grounds:
          - state_machines.LateralQuestionnaire.UNDER_REVIEW_to_REVISION_REQUESTED
          - entities.LateralQuestionnaire.fields.revision_round
          - errors[ERR_REVISION_LIMIT_EXCEEDED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / questionnaire_revision_loop_is_bounded_at_three_rounds
          rationale: "The bounded revision cycle and its fourth-round refusal are the whole subject of the named §1.8 instance."

      - name: candidate_two_state_dimensions_change_independently
        claim_type: parallel
        grounds:
          - state_machines.Candidate.IN_PROGRESS_to_CLEARED
          - state_machines.Candidate.DILIGENCE_to_WITHDRAWN
          - entities.Candidate.fields.pipeline_status
          - entities.Candidate.fields.clearance_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / candidate_pipeline_and_clearance_dimensions_advance_independently
          rationale: "The named §1.8 instance asserts the pair (pipeline_status, clearance_status) before, between and after both dimension moves."

      - name: integration_plan_create_guarded_by_candidate_pipeline_status
        claim_type: guarded_transitions
        grounds:
          - state_machines.IntegrationPlan.null_to_DRAFT
          - errors[ERR_CANDIDATE_INVALID_STATE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / integration_plan_create_requires_candidate_hired
          rationale: "The cross-entity guard 'plan create only if Candidate is HIRED' is asserted in both directions by the named §1.8 instance."

      - name: waiver_refusal_cascades_down_five_levels
        claim_type: cascade_down
        grounds:
          - state_machines.ConflictWaiver.REQUESTED_to_REFUSED
          - state_machines.ClientBookEntry.VALIDATED_to_DECLINED
          - state_machines.CompensationOffer.COMMITTEE_REVIEW_to_REPRICE_REQUIRED
        excluded_because:
          difficulty_instance: transitive_cascade / waiver_refusal_propagates_five_hops_to_offer_reprice
          rationale: "The named §1.8 instance walks the full five-hop chain end-to-end and pins every intermediate entity."

      - name: declination_rescission_reverses_every_original_side_effect
        claim_type: compensation
        grounds:
          - state_machines.MatterDeclination.ACTIVE_to_RESCINDED
          - state_machines.ClientBookEntry.DECLINED_to_VALIDATED
          - state_machines.ConflictCheck.BLOCKED_to_CLEAR
        excluded_because:
          difficulty_instance: compensating_invariant / declination_rescission_restores_book_identity
          rationale: "The named §1.8 instance asserts the restored book identity with no drift after the undo."

      - name: offer_finalize_fork_reaches_rejected_with_its_own_side_effect_set
        claim_type: valid_transition
        grounds:
          - state_machines.CompensationOffer.COMMITTEE_REVIEW_to_REJECTED
          - state_machines.Candidate.DILIGENCE_to_DECLINED
        excluded_because:
          difficulty_instance: non_linear_state_machine / offer_committee_review_fork_has_divergent_side_effect_sets
          rationale: "The REJECTED branch of the finalize fork, its reserve release and the candidate DECLINED cascade are asserted by the named §1.8 instance."

      - name: engagement_expires_when_the_clock_passes_the_tail_off_end
        claim_type: valid_transition
        grounds:
          - state_machines.SearchFirmEngagement.ACTIVE_to_EXPIRED
          - entities.SearchFirmEngagement.fields.tail_off_days
        excluded_because:
          difficulty_instance: transitive_cascade / waiver_deadline_lapse_on_one_clock_tick_drives_two_disjoint_cascades
          rationale: "The system-event expiry at exactly exclusivity_end_date + tail_off_days is asserted as the second, disjoint cascade of the named §1.8 instance."

