              captures: { guest_id: $.data.id }
            - call: "POST /inns/${inn_id}/bookings"
              payload: { inn_id: "${inn_id}", room_id: "${room_id}", guest_id: "${guest_id}", channel: "DIRECT", checkin_date: "2026-07-10", checkout_date: "2026-07-12", guest_count: 1 }
              as: Innkeeper
              captures: { bk_id: $.data.id }
            - call: "POST /inns/${inn_id}/gift-certificates"
              payload: { inn_id: "${inn_id}", face_value_cents: 20000 }
              as: FinanceManager
              captures: { gc_id: $.data.id, gc_v: $.data.version }
            - call: "POST /inns/${inn_id}/bookings/${bk_id}/redeem-gift"
              payload: { gift_certificate_id: "${gc_id}", amount_cents: 10000, expected_gift_certificate_version: "${gc_v}" }
              as: Innkeeper
            - call: "GET /inns/${inn_id}/rooms/${room_id}"
              as: Innkeeper
              captures: { room_v: $.data.version }
            - call: "POST /inns/${inn_id}/bookings/${bk_id}/confirm"
              payload: { expected_room_version: "${room_v}" }
              as: Innkeeper
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T16:00:00Z" }
              as: Innkeeper
            - call: "POST /inns/${inn_id}/bookings/${bk_id}/check-in"
              payload: {}
              as: Innkeeper
            - call: "GET /inns/${inn_id}/rooms/${room_id}"
              as: Innkeeper
              captures: { room_v_before_checkout: $.data.version }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-12T11:00:00Z" }
              as: Innkeeper
            - call: "POST /inns/${inn_id}/bookings/${bk_id}/check-out"
              payload: {}
              as: Innkeeper
            - call: "GET /inns/${inn_id}/housekeeping-tasks?booking_id=${bk_id}"
              as: Innkeeper
              captures: { hk_status: "$.data[0].status", hk_room: "$.data[0].room_id" }
            - call: "GET /inns/${inn_id}/rooms/${room_id}"
              as: Innkeeper
              captures: { room_v_after_checkout: $.data.version }
          assert:
            - "exactly one HousekeepingTask exists for booking_id ${bk_id} with status == PENDING"
            - "HousekeepingTask for ${bk_id} has room_id == ${room_id}"
            - "Room.${room_id}.version == ${room_v_before_checkout} + 1"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: date_range_beats_occupancy_on_create
        grounds:
          - validations[priority=50]
          - validations[priority=55]
          - errors[ERR_INVALID_DATE_RANGE]
          - errors[ERR_OCCUPANCY_EXCEEDED]
        distinguishing_aspect: |
          A create that BOTH inverts the date range (checkout <= checkin, p50 business_temporal)
          AND exceeds occupancy (p55 business_constraint) returns ERR_INVALID_DATE_RANGE — the
          lower-priority-number temporal check wins over the constraint check.
        test_recipe:
          setup:
            - "Inn; Room max_occupancy 2."
          setup_api_calls:
            - call: "POST /inns"
              payload: { name: "Vale Inn", lodging_tax_rate_bps: 1000 }
              as: Innkeeper
              captures: { inn_id: $.data.id }
            - call: "POST /inns/${inn_id}/rooms"
              payload: { inn_id: "${inn_id}", name: "Wren", base_rate_cents: 10000, max_occupancy: 2 }
              as: Innkeeper
              captures: { room_id: $.data.id }
            - call: "POST /inns/${inn_id}/guests"
              payload: { inn_id: "${inn_id}", full_name: "Iv G", email: "iv@x.com" }
              as: Innkeeper
              captures: { guest_id: $.data.id }
          trigger:
            - call: "POST /inns/${inn_id}/bookings"
              payload: { inn_id: "${inn_id}", room_id: "${room_id}", guest_id: "${guest_id}", channel: "DIRECT", checkin_date: "2026-05-10", checkout_date: "2026-05-10", guest_count: 9 }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_DATE_RANGE"      # p50 beats p55
            - "HTTP status == 422"

      - name: invalid_state_beats_deposit_on_confirm
        grounds:
          - validations[priority=60]
          - validations[priority=80]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_DEPOSIT_NOT_MET]
        distinguishing_aspect: |
          A CANCELLED booking whose deposit was never met violates BOTH the p60 state check
          (CANCELLED is not a valid confirm from-state) and the p80 fiscal deposit check
          (deposit_paid 0 < deposit_due); confirm returns ERR_INVALID_STATE, the lower-priority
          state error, ahead of ERR_DEPOSIT_NOT_MET — a state vs business_fiscal pair distinct
          from p50/p55.
        test_recipe:
          setup:
            - "Inn tax 0; Room base 10000; a PENDING booking (deposit never paid) that was then cancelled."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Innkeeper
            - call: "POST /inns"
              payload: { name: "Dune Inn", lodging_tax_rate_bps: 0 }
              as: Innkeeper
              captures: { inn_id: $.data.id }
            - call: "POST /inns/${inn_id}/rooms"
              payload: { inn_id: "${inn_id}", name: "Coral", base_rate_cents: 10000, max_occupancy: 2 }
              as: Innkeeper
              captures: { room_id: $.data.id }
            - call: "POST /inns/${inn_id}/guests"
              payload: { inn_id: "${inn_id}", full_name: "Jo G", email: "jo@x.com" }
              as: Innkeeper
              captures: { guest_id: $.data.id }
            - call: "POST /inns/${inn_id}/bookings"
              payload: { inn_id: "${inn_id}", room_id: "${room_id}", guest_id: "${guest_id}", channel: "DIRECT", checkin_date: "2026-04-20", checkout_date: "2026-04-22", guest_count: 1 }
              as: Innkeeper
              captures: { bk_id: $.data.id }
            # cancel while PENDING with zero deposit paid -> CANCELLED, deposit still unmet
            - call: "POST /inns/${inn_id}/bookings/${bk_id}/cancel"
              payload: {}
              as: Innkeeper
            - call: "GET /inns/${inn_id}/rooms/${room_id}"
              as: Innkeeper
              captures: { room_v: $.data.version }
          trigger:
            - call: "POST /inns/${inn_id}/bookings/${bk_id}/confirm"
              payload: { expected_room_version: "${room_v}" }
              as: Innkeeper
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"   # p60 beats p80; booking is CANCELLED with unmet deposit
            - "HTTP status == 409"
            - "Booking.${bk_id}.reservation_status == CANCELLED"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: cancellation_tier_14_day_boundary_inclusive
        grounds:
          - calculations.cancellation_refund
          - entities.Booking.fields.refund_cents
        distinguishing_aspect: |
          The full-refund tier uses >= 14 days: cancelling at exactly 14 days before checkin
          refunds 100%, at 13 days refunds 50% — a numeric threshold boundary reached through
          the cancel endpoint.
        test_recipe:
          setup:
            - "Inn tax 0; Room base 10000; DIRECT booking checkin 2026-06-15, deposit_paid 10000 via gift."
            - "Run twice with two clones; clock at exactly 14 days vs 13 days before checkin."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Innkeeper
            - call: "POST /inns"
              payload: { name: "Glen Inn", lodging_tax_rate_bps: 0 }
              as: Innkeeper
              captures: { inn_id: $.data.id }
            - call: "POST /inns/${inn_id}/rooms"
              payload: { inn_id: "${inn_id}", name: "Heath", base_rate_cents: 10000, max_occupancy: 2 }
              as: Innkeeper
              captures: { room_a: $.data.id }
            - call: "POST /inns/${inn_id}/rooms"
              payload: { inn_id: "${inn_id}", name: "Moor", base_rate_cents: 10000, max_occupancy: 2 }
              as: Innkeeper
