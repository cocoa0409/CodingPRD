scenario: |
  Mortgage Servicing: payment posting, Escrow annual analysis, PMI removal
  conditions, tax/insurance disbursement, forbearance/Foreclosure,
  pre-foreclosure mediation (HAMP-style).

domain_name: mortgage-servicing
api_prefix: ""

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - rate_threshold_triggers
    - scheduled_actions

  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Borrower
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Borrower email; unique."
      - name: full_name
        type: string
        source: input
        description: "Borrower legal name."
      - name: ssn_last4
        type: string
        source: input
        description: "Last four digits of SSN; used for identity reference only, never for business decisions."

  - name: Loan
    parent: null
    common_fields: true
    fields:
      - name: borrower_id
        type: string
        source: input
        description: "FK -> Borrower.id"
      - name: origination_date
        type: datetime
        source: input
        description: "Date loan funded; immutable after CREATE."
      - name: original_principal_cents
        type: integer
        source: input
        description: "Original loan amount in cents; immutable."
      - name: original_property_value_cents
        type: integer
        source: input
        description: "Appraised value at origination in cents; baseline for PMI LTV."
      - name: current_appraised_value_cents
        type: integer
        source: input
        description: "Most recent recorded appraised value in cents; defaults to original_property_value_cents."
        default: null
      - name: interest_rate_bps
        type: integer
        source: input
        description: "Annual interest rate in basis points (e.g., 600 = 6.00%)."
      - name: term_months
        type: integer
        source: input
        description: "Original amortization term in months."
      - name: scheduled_monthly_pi_cents
        type: integer
        source: computed
        description: "Scheduled monthly principal+interest payment in cents, computed at loan creation via standard amortization; immutable thereafter."
      - name: principal_balance_cents
        type: integer
        source: computed
        description: "Outstanding principal balance in cents; decremented on each posted payment per the waterfall."
      - name: accrued_interest_cents
        type: integer
        source: computed
        description: "Interest accrued and not yet paid, in cents."
      - name: escrow_monthly_cents
        type: integer
        source: computed
        description: "Monthly escrow installment in cents; updated only by the annual escrow analysis."
      - name: total_monthly_payment_cents
        type: integer
        source: computed
        description: "scheduled_monthly_pi_cents + escrow_monthly_cents; refreshed whenever escrow_monthly_cents changes."
      - name: status
        type: enum
        source: computed
        description: "Loan lifecycle status (see state_machines.Loan)."
        constraints: "One of {CURRENT, DELINQUENT, FORBEARANCE, FORECLOSURE, REINSTATED, PAID_OFF}."
      - name: days_past_due
        type: integer
        source: computed
        description: "Derived from current_utc minus next_due_date; recomputed on every payment posting and on POST /_clock/set_current_utc."
      - name: next_due_date
        type: datetime
        source: computed
        description: "Date the next scheduled payment is due (advances by one calendar month on each fully-cured installment)."
      - name: pmi_required
        type: boolean
        source: computed
        description: "True while LTV >= 80%; recomputed on payment posting, appraisal update, and PMI removal request approval."
      - name: pmi_monthly_cents
        type: integer
        source: input
        description: "Monthly PMI premium in cents; required at CREATE while LTV > 80%."
      - name: pmi_status
        type: enum
        source: computed
        description: "PMI lifecycle status."
        constraints: "One of {ACTIVE, REMOVAL_PENDING, REMOVED, AUTO_TERMINATED, NOT_APPLICABLE}."
      - name: last_payment_posted_at
        type: datetime
        source: computed
        description: "ISO timestamp of the most recently posted payment; null if none."
        default: null

  - name: EscrowAccount
    parent: null
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: input
        description: "FK -> Loan.id; unique (1:1 with Loan)."
      - name: balance_cents
        type: integer
        source: computed
        description: "Current escrow balance in cents; credited on payment posting (escrow portion), debited on disbursement."
      - name: annual_tax_cents
        type: integer
        source: input
        description: "Projected annual property tax in cents (forward-looking input)."
      - name: annual_insurance_cents
        type: integer
        source: input
        description: "Projected annual hazard insurance in cents."
      - name: cushion_months
        type: integer
        source: input
        description: "Permitted cushion months (Federal RESPA cap is 2)."
        default: 2
        constraints: "0 <= cushion_months <= 2."
      - name: shortage_cents
        type: integer
        source: computed
        description: "Most recent escrow analysis shortage in cents (0 if none); refreshed by annual escrow analysis."
      - name: surplus_cents
        type: integer
        source: computed
        description: "Most recent escrow analysis surplus in cents (0 if none)."

  - name: Payment
    parent: null
    common_fields: false
    fields:
      - name: loan_id
        type: string
        source: input
        description: "FK -> Loan.id"
      - name: amount_cents
        type: integer
        source: input
        description: "Borrower remittance in cents."
      - name: received_at
        type: datetime
        source: input
        description: "Wall-clock timestamp the funds arrived (ISO 8601)."
      - name: posting_strategy
        type: enum
        source: input
        description: "Allocation algorithm to apply."
        constraints: "One of {STANDARD_WATERFALL, PRINCIPAL_CURTAILMENT}."
        default: STANDARD_WATERFALL
      - name: allocation
        type: object
        source: computed
        description: "Breakdown {interest_cents, principal_cents, escrow_cents, pmi_cents, late_fee_cents, suspense_cents} produced by §1.3 payment_posting."
      - name: status
        type: enum
        source: computed
        description: "Payment posting result."
        constraints: "One of {POSTED, SUSPENSE, REVERSED}."
      - name: posted_at
        type: datetime
        source: system
        description: "ISO timestamp the server applied the allocation."

  - name: EscrowDisbursement
    parent: null
    common_fields: true
    fields:
      - name: escrow_account_id
        type: string
        source: input
        description: "FK -> EscrowAccount.id"
      - name: kind
        type: enum
        source: input
        description: "Disbursement category."
        constraints: "One of {TAX, INSURANCE}."
      - name: amount_cents
        type: integer
        source: input
        description: "Amount to disburse, in cents."
      - name: scheduled_for
        type: datetime
        source: input
        description: "ISO timestamp the disbursement should fire."
      - name: status
        type: enum
        source: computed
        description: "Disbursement lifecycle."
        constraints: "One of {SCHEDULED, PAID, FAILED, CANCELLED}."
      - name: failure_reason
        type: enum
        source: computed
        description: "Set when status=FAILED."
        constraints: "One of {INSUFFICIENT_FUNDS, NONE}."
        default: NONE
      - name: paid_at
        type: datetime
        source: computed
        description: "ISO timestamp the disbursement actually posted; null otherwise."
        default: null

  - name: EscrowAnalysis
    parent: null
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: input
        description: "FK -> Loan.id"
      - name: as_of_date
        type: datetime
        source: input
        description: "Effective date of the analysis (anniversary date)."
      - name: variant
        type: enum
        source: input
        description: "Which analysis algorithm to run."
        constraints: "One of {ACTUAL_TRAILING_12, FORECAST_NEXT_12}; see §1.3 escrow_analysis."
      - name: projected_low_point_cents
        type: integer
        source: computed
        description: "Lowest projected escrow balance over the next 12 months at completion."
      - name: required_low_point_cents
        type: integer
        source: computed
        description: "cushion_months * (annual_tax + annual_insurance) / 12 (rounded half-up)."
      - name: shortage_cents
        type: integer
        source: computed
        description: "max(0, required_low_point_cents - projected_low_point_cents)."
      - name: surplus_cents
        type: integer
        source: computed
        description: "max(0, projected_low_point_cents - required_low_point_cents)."
      - name: new_escrow_monthly_cents
        type: integer
        source: computed
        description: "Resulting Loan.escrow_monthly_cents after the analysis."

  - name: ForbearancePlan
    parent: null
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: input
        description: "FK -> Loan.id"
      - name: start_date
        type: datetime
        source: input
        description: "Inclusive start of the forbearance window."
      - name: end_date
        type: datetime
        source: input
        description: "Inclusive end; must be > start_date and within MAX_FORBEARANCE_MONTHS (12) of start_date."
      - name: reduced_payment_cents
        type: integer
        source: input
        description: "Reduced monthly payment in cents (may be 0)."
      - name: deferred_total_cents
        type: integer
        source: computed
        description: "Sum of (total_monthly_payment_cents - reduced_payment_cents) over all months in the window; pinned at activation."
      - name: status
        type: enum
        source: computed
        description: "Forbearance plan lifecycle."
        constraints: "One of {PROPOSED, ACTIVE, COMPLETED, TERMINATED_EARLY}."

  - name: ForeclosureCase
    parent: null
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: input
        description: "FK -> Loan.id"
      - name: initiated_at
        type: datetime
        source: system
        description: "ISO timestamp when foreclosure was filed."
      - name: status
        type: enum
        source: computed
        description: "Foreclosure case lifecycle."
        constraints: "One of {FILED, MEDIATION_REQUIRED, IN_MEDIATION, MEDIATION_FAILED, SALE_SCHEDULED, COMPLETED, WITHDRAWN}."
      - name: sale_date
        type: datetime
        source: input
        description: "Scheduled sale date; null until SALE_SCHEDULED."
        default: null
      - name: cure_amount_cents
        type: integer
        source: computed
        description: "Total dollars (principal arrears + interest arrears + late fees + foreclosure costs) needed to reinstate; refreshed on every entry."

  - name: MediationSession
    parent: null
    common_fields: true
    fields:
      - name: foreclosure_case_id
        type: string
        source: input
        description: "FK -> ForeclosureCase.id"
      - name: scheduled_for
        type: datetime
        source: input
        description: "ISO timestamp of the mediation hearing; must lie >= MEDIATION_NOTICE_DAYS (14) after current_utc."
      - name: outcome
        type: enum
        source: input
        description: "Decision recorded by the mediator."
        constraints: "One of {PENDING, MODIFICATION_AGREED, FORBEARANCE_AGREED, NO_AGREEMENT}."
        default: PENDING
      - name: modification_pi_cents
        type: integer
        source: input
        description: "New monthly P&I if outcome=MODIFICATION_AGREED; required in that case."
        default: null

  - name: PMIRemovalRequest
    parent: null
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: input
        description: "FK -> Loan.id"
      - name: requested_at
        type: datetime
        source: system
        description: "Timestamp of submission."
      - name: appraisal_value_cents
        type: integer
        source: input
        description: "Borrower-provided new appraisal in cents; optional (null uses original_property_value_cents)."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Removal request lifecycle."
        constraints: "One of {PENDING, APPROVED, DENIED}."
      - name: denial_reason
        type: enum
        source: computed
        description: "Why the request was denied."
        constraints: "One of {LTV_TOO_HIGH, PAYMENT_HISTORY_NOT_CLEAN, IN_DELINQUENCY, NONE}."
        default: NONE
      - name: computed_ltv_bps
        type: integer
        source: computed
        description: "Recorded LTV at decision time in basis points (e.g., 7950 = 79.50%)."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Loan
    initial_state: CURRENT
    terminal_states: [PAID_OFF]
    transitions:
      - from: CURRENT
        to: DELINQUENT
        trigger: "POST /_clock/set_current_utc advances current_utc beyond next_due_date + GRACE_DAYS (15) without a payment posting"
        actor: system
        preconditions:
          - "loan.status == CURRENT"
          - "days_past_due > GRACE_DAYS (15)"
        side_effects:
          - "Loan.status -> DELINQUENT"
          - "Loan.version += 1"
      - from: DELINQUENT
        to: CURRENT
        trigger: "POST /loans/{id}/payments fully cures the past-due amount"
        actor: LoanServicer
        preconditions:
          - "loan.status == DELINQUENT"
          - "Payment allocation drives days_past_due back to 0"
        side_effects:
          - "Loan.status -> CURRENT"
          - "Loan.next_due_date advances by one month per fully-cured installment"
          - "Loan.version += 1"
      - from: DELINQUENT
        to: FORBEARANCE
        trigger: "POST /loans/{id}/forbearance-plans/{id}/activate"
        actor: LoanServicer
        preconditions:
          - "loan.status == DELINQUENT"
          - "An associated ForbearancePlan exists in PROPOSED state"
          - "current_utc < forbearance_plan.start_date or current_utc within window"
        side_effects:
          - "Loan.status -> FORBEARANCE"
          - "ForbearancePlan.status -> ACTIVE"
          - "ForbearancePlan.deferred_total_cents computed via §1.3 forbearance_deferral_calc"
          - "Loan.version += 1"
      - from: FORBEARANCE
        to: REINSTATED
        trigger: "POST /loans/{id}/forbearance-plans/{id}/complete after end_date"
        actor: LoanServicer
        preconditions:
          - "loan.status == FORBEARANCE"
          - "current_utc >= forbearance_plan.end_date"
        side_effects:
          - "Loan.status -> REINSTATED"
          - "ForbearancePlan.status -> COMPLETED"
          - "Loan.next_due_date set to current_utc + 30 days"
          - "Loan.version += 1"
      - from: FORBEARANCE
        to: DELINQUENT
        trigger: "POST /loans/{id}/forbearance-plans/{id}/terminate"
        actor: LoanServicer
        preconditions:
          - "loan.status == FORBEARANCE"
        side_effects:
          - "Loan.status -> DELINQUENT"
          - "ForbearancePlan.status -> TERMINATED_EARLY"
          - "Loan.version += 1"
      - from: REINSTATED
        to: CURRENT
        trigger: "POST /loans/{id}/payments first post-reinstatement payment posts cleanly"
        actor: LoanServicer
        preconditions:
          - "loan.status == REINSTATED"
          - "days_past_due == 0 after allocation"
        side_effects:
          - "Loan.status -> CURRENT"
          - "Loan.version += 1"
      - from: DELINQUENT
        to: FORECLOSURE
        trigger: "POST /loans/{id}/foreclosure"
        actor: LoanServicer
        preconditions:
          - "loan.status == DELINQUENT"
          - "days_past_due >= FORECLOSURE_THRESHOLD_DAYS (120)"
          - "No ForbearancePlan in ACTIVE state for this loan"
        side_effects:
          - "Loan.status -> FORECLOSURE"
          - "Create ForeclosureCase in MEDIATION_REQUIRED state (HAMP-style mandatory mediation)"
          - "Loan.version += 1"
      - from: FORECLOSURE
        to: REINSTATED
        trigger: "POST /loans/{id}/foreclosure/withdraw or successful mediation modification"
        actor: LoanServicer
        preconditions:
          - "loan.status == FORECLOSURE"
          - "ForeclosureCase.status IN {WITHDRAWN, MEDIATION_FAILED-reversed, COMPLETED-modified}"
        side_effects:
          - "Loan.status -> REINSTATED"
          - "ForeclosureCase.status set per trigger"
          - "Loan.version += 1"
      - from: CURRENT
        to: PAID_OFF
        trigger: "POST /loans/{id}/payments with amount fully retiring principal_balance_cents + accrued_interest_cents"
        actor: LoanServicer
        preconditions:
          - "loan.status == CURRENT"
          - "Payment.amount_cents >= principal_balance_cents + accrued_interest_cents + outstanding fees"
        side_effects:
          - "Loan.status -> PAID_OFF"
          - "Loan.pmi_status -> AUTO_TERMINATED"
          - "Cancel all SCHEDULED EscrowDisbursement rows for this loan's escrow_account"
          - "Loan.version += 1"

  - entity: ForeclosureCase
    initial_state: FILED
    terminal_states: [COMPLETED, WITHDRAWN]
    transitions:
      - from: FILED
        to: MEDIATION_REQUIRED
        trigger: "system, immediately after ForeclosureCase creation (HAMP-style mandatory mediation policy)"
        actor: system
        preconditions:
          - "ForeclosureCase.status == FILED"
        side_effects:
          - "ForeclosureCase.status -> MEDIATION_REQUIRED"
          - "ForeclosureCase.version += 1"
      - from: MEDIATION_REQUIRED
        to: IN_MEDIATION
        trigger: "POST /foreclosure-cases/{id}/mediation-sessions schedules a session"
        actor: LoanServicer
        preconditions:
          - "ForeclosureCase.status == MEDIATION_REQUIRED"
          - "MediationSession.scheduled_for >= current_utc + MEDIATION_NOTICE_DAYS (14)"
        side_effects:
          - "ForeclosureCase.status -> IN_MEDIATION"
          - "ForeclosureCase.version += 1"
      - from: IN_MEDIATION
        to: COMPLETED
        trigger: "POST /mediation-sessions/{id}/record-outcome with outcome=MODIFICATION_AGREED or FORBEARANCE_AGREED"
        actor: LoanServicer
        preconditions:
          - "ForeclosureCase.status == IN_MEDIATION"
          - "MediationSession.outcome IN {MODIFICATION_AGREED, FORBEARANCE_AGREED}"
        side_effects:
          - "ForeclosureCase.status -> COMPLETED"
          - "If outcome=MODIFICATION_AGREED, Loan.scheduled_monthly_pi_cents updated to modification_pi_cents and Loan.status -> REINSTATED; Loan.version += 1"
          - "If outcome=FORBEARANCE_AGREED, server creates an ACTIVE ForbearancePlan and transitions Loan.status -> FORBEARANCE; Loan.version += 1"
          - "ForeclosureCase.version += 1"
      - from: IN_MEDIATION
        to: MEDIATION_FAILED
        trigger: "POST /mediation-sessions/{id}/record-outcome with outcome=NO_AGREEMENT"
        actor: LoanServicer
        preconditions:
          - "ForeclosureCase.status == IN_MEDIATION"
          - "MediationSession.outcome == NO_AGREEMENT"
        side_effects:
          - "ForeclosureCase.status -> MEDIATION_FAILED"
          - "ForeclosureCase.version += 1"
      - from: MEDIATION_FAILED
        to: SALE_SCHEDULED
        trigger: "POST /foreclosure-cases/{id}/schedule-sale"
        actor: LoanServicer
        preconditions:
          - "ForeclosureCase.status == MEDIATION_FAILED"
          - "Provided sale_date >= current_utc + SALE_NOTICE_DAYS (30)"
        side_effects:
          - "ForeclosureCase.status -> SALE_SCHEDULED"
          - "ForeclosureCase.sale_date set"
          - "ForeclosureCase.version += 1"
      - from: SALE_SCHEDULED
        to: COMPLETED
        trigger: "POST /_clock/set_current_utc advances past sale_date with no withdrawal"
        actor: system
        preconditions:
          - "ForeclosureCase.status == SALE_SCHEDULED"
          - "current_utc >= sale_date"
        side_effects:
          - "ForeclosureCase.status -> COMPLETED"
          - "Loan.status remains FORECLOSURE (terminal in this benchmark)"
          - "ForeclosureCase.version += 1"
      - from: MEDIATION_REQUIRED
        to: WITHDRAWN
        trigger: "POST /foreclosure-cases/{id}/withdraw"
        actor: LoanServicer
        preconditions:
          - "ForeclosureCase.status IN {MEDIATION_REQUIRED, IN_MEDIATION, MEDIATION_FAILED, SALE_SCHEDULED}"
        side_effects:
          - "ForeclosureCase.status -> WITHDRAWN"
          - "Loan.status -> REINSTATED"
          - "ForeclosureCase.version += 1"
          - "Loan.version += 1"

  - entity: PMIRemovalRequest
    initial_state: PENDING
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /pmi-removal-requests/{id}/decide; eligibility (LTV<78% OR (LTV<80% AND clean 12-month payment history)) holds"
        actor: ComplianceOfficer
        preconditions:
          - "PMIRemovalRequest.status == PENDING"
          - "Loan.status IN {CURRENT, REINSTATED}"
          - "computed_ltv_bps < 8000 if relying on 12-month clean history; or < 7800 unconditionally"
        side_effects:
          - "PMIRemovalRequest.status -> APPROVED"
          - "Loan.pmi_required -> false; Loan.pmi_status -> REMOVED"
          - "Loan.total_monthly_payment_cents recomputed (drops PMI)"
          - "Loan.version += 1"
      - from: PENDING
        to: DENIED
        trigger: "POST /pmi-removal-requests/{id}/decide; eligibility fails"
        actor: ComplianceOfficer
        preconditions:
          - "PMIRemovalRequest.status == PENDING"
          - "Eligibility check fails per §1.3 pmi_eligibility"
        side_effects:
          - "PMIRemovalRequest.status -> DENIED"
          - "PMIRemovalRequest.denial_reason set per §1.3"

  - entity: ForbearancePlan
    initial_state: PROPOSED
    terminal_states: [COMPLETED, TERMINATED_EARLY]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /loans/{loan_id}/forbearance-plans/{id}/activate"
        actor: LoanServicer
        preconditions:
          - "ForbearancePlan.status == PROPOSED"
          - "Loan.status IN {DELINQUENT, FORECLOSURE}"
        side_effects:
          - "ForbearancePlan.status -> ACTIVE"
          - "ForbearancePlan.deferred_total_cents pinned via §1.3 forbearance_deferral_calc"
          - "Loan.status -> FORBEARANCE (see Loan state machine)"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /loans/{loan_id}/forbearance-plans/{id}/complete"
        actor: LoanServicer
        preconditions:
          - "ForbearancePlan.status == ACTIVE"
          - "current_utc >= forbearance_plan.end_date"
        side_effects:
          - "ForbearancePlan.status -> COMPLETED"
          - "Loan.status -> REINSTATED (see Loan state machine)"
      - from: ACTIVE
        to: TERMINATED_EARLY
        trigger: "POST /loans/{loan_id}/forbearance-plans/{id}/terminate"
        actor: LoanServicer
        preconditions:
          - "ForbearancePlan.status == ACTIVE"
        side_effects:
          - "ForbearancePlan.status -> TERMINATED_EARLY"
          - "Loan.status -> DELINQUENT (see Loan state machine)"

  - entity: EscrowDisbursement
    initial_state: SCHEDULED
    terminal_states: [PAID, FAILED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PAID
        trigger: "POST /_clock/set_current_utc advances current_utc to or past scheduled_for AND escrow_account.balance_cents >= amount_cents"
        actor: system
        preconditions:
          - "EscrowDisbursement.status == SCHEDULED"
          - "current_utc >= scheduled_for"
          - "escrow_account.balance_cents >= amount_cents"
        side_effects:
          - "EscrowDisbursement.status -> PAID; paid_at = current_utc"
          - "escrow_account.balance_cents -= amount_cents"
          - "escrow_account.version += 1"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /_clock/set_current_utc advances current_utc to or past scheduled_for AND escrow_account.balance_cents < amount_cents"
        actor: system
        preconditions:
          - "EscrowDisbursement.status == SCHEDULED"
          - "current_utc >= scheduled_for"
          - "escrow_account.balance_cents < amount_cents"
        side_effects:
          - "EscrowDisbursement.status -> FAILED; failure_reason = INSUFFICIENT_FUNDS"
          - "escrow_account.version += 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /escrow-disbursements/{id}/cancel OR cascade from Loan PAID_OFF"
        actor: LoanServicer | system
        preconditions:
          - "EscrowDisbursement.status == SCHEDULED"
        side_effects:
          - "EscrowDisbursement.status -> CANCELLED"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: loan-occ-on-foreclosure-filing
    parent_entity: Loan
    write_endpoint: "POST /loans/{id}/foreclosure"
    occ_field: "expected_loan_version"
    description: |
      Filing foreclosure against a Loan whose version has advanced since the
      client last observed it is rejected. This captures the case where
      another writer has just posted a payment that legitimately cured the
      delinquency (which would invalidate the foreclosure rationale) and the
      current writer's view of the loan is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: escrow-occ-on-annual-analysis
    parent_entity: EscrowAccount
    write_endpoint: "POST /escrow-accounts/{id}/analyses"
    occ_field: "expected_escrow_account_version"
    description: |
      Running an annual escrow analysis against an EscrowAccount whose version
      has advanced is rejected. This captures the case where another writer
      has just executed a disbursement that legitimately changed the balance
      and the current writer's projected_low_point input is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: payment_posting
    trigger: "POST /loans/{id}/payments"
    algorithm: waterfall_allocation
    formula: |
      # STANDARD_WATERFALL (regulatory order):
      #   1. accrued_interest_cents          (interest first)
      #   2. principal_balance_cents          (then principal of the oldest unpaid installment)
      #   3. escrow_monthly_cents             (escrow installment top-up to bring escrow current)
      #   4. pmi_monthly_cents                (PMI premium for the installment)
      #   5. outstanding late_fees            (latest fee posted first)
      #   6. remainder -> SUSPENSE if < one full installment short; else additional principal curtailment
      #
      # PRINCIPAL_CURTAILMENT variant:
      #   if Loan.status == CURRENT and payment.amount_cents > total_monthly_payment_cents:
      #       extra = payment.amount_cents - total_monthly_payment_cents
      #       first apply the standard installment (steps 1-4), then apply `extra` directly to principal
      #       (skipping late_fees because none exist on a CURRENT loan)
      #
      # Pinned evaluation order: rounding occurs once at the END of the waterfall; partial-cent
      # rounding remainders flow to escrow_cents. Round half_up at the final allocation step.
    input_set: "Payment.amount_cents, Loan.{principal_balance_cents, accrued_interest_cents, escrow_monthly_cents, pmi_monthly_cents}, outstanding LateFee aggregate."
    constants:
      LATE_FEE_PCT_BPS: 500   # 5.00% of scheduled P&I
      MIN_SUSPENSE_THRESHOLD_CENTS: 0
    precision: "Integer cents, no fractional cents. Rounding half_up applied once at final allocation."
    variants:
      - name: STANDARD_WATERFALL
        when: "Posting_strategy == STANDARD_WATERFALL (default)"
        difference: "Surplus over the installment moves to SUSPENSE."
      - name: PRINCIPAL_CURTAILMENT
        when: "Posting_strategy == PRINCIPAL_CURTAILMENT AND Loan.status == CURRENT"
        difference: "Surplus over the installment reduces principal directly (no SUSPENSE)."

  - name: escrow_analysis
    trigger: "POST /escrow-accounts/{id}/analyses"
    algorithm: forward_looking
    formula: |
      # Two variants of the same analysis -- they produce different
      # new_escrow_monthly_cents for identical inputs.
      #
      # ACTUAL_TRAILING_12:
      #   total_disbursements_actual = sum of EscrowDisbursement.amount_cents
      #     where escrow_account_id matches AND status == PAID
      #     AND paid_at IN (as_of_date - 365 days, as_of_date]
      #   new_escrow_monthly_cents = ceil_to_cent( total_disbursements_actual / 12 )
      #   projected_low_point_cents = simulate next 12 months using new_escrow_monthly_cents
      #     and the existing PAID-history pattern (replayed month-by-month)
      #
      # FORECAST_NEXT_12:
      #   total_disbursements_forecast = escrow_account.annual_tax_cents
      #                                  + escrow_account.annual_insurance_cents
      #   new_escrow_monthly_cents = round_half_up( total_disbursements_forecast / 12 )
      #   projected_low_point_cents = simulate next 12 months using:
      #     - new_escrow_monthly_cents inflows
      #     - SCHEDULED EscrowDisbursement rows (kind, amount_cents, scheduled_for)
      #
      # required_low_point_cents = round_half_up(
      #     cushion_months * (annual_tax_cents + annual_insurance_cents) / 12
      # )
      # shortage_cents = max(0, required_low_point_cents - projected_low_point_cents)
      # surplus_cents  = max(0, projected_low_point_cents - required_low_point_cents)
      # if shortage_cents > 0: new_escrow_monthly_cents += ceil(shortage_cents / 12)
    input_set: "EscrowAccount.{annual_tax_cents, annual_insurance_cents, cushion_months, balance_cents}, EscrowDisbursement history filtered as above."
    constants:
      MAX_CUSHION_MONTHS: 2
    precision: "Integer cents. ACTUAL_TRAILING_12 uses ceil_to_cent; FORECAST_NEXT_12 uses round_half_up. Pinned per variant."
    variants:
      - name: ACTUAL_TRAILING_12
        when: "Used at the loan's annual review when trailing 12 months of PAID disbursements form a representative sample."
        difference: "Uses ceil_to_cent on monthly figure; replays trailing-12 PAID rows; produces a conservative (higher) monthly figure."
      - name: FORECAST_NEXT_12
        when: "Used during initial escrow setup or after a tax/insurance bill change."
        difference: "Uses round_half_up on monthly figure; replays SCHEDULED rows over next 12 months; produces a leaner monthly figure."

  - name: pmi_eligibility
    trigger: "POST /pmi-removal-requests AND POST /pmi-removal-requests/{id}/decide"
    algorithm: threshold
    formula: |
      # baseline_value = appraisal_value_cents if provided else original_property_value_cents
      # computed_ltv_bps = round_half_up( principal_balance_cents * 10000 / baseline_value )
      #
      # borrower_requested_path:
      #   eligible if computed_ltv_bps < 8000  (i.e., LTV < 80.00%) AND clean_payment_history_12mo
      # automatic_termination_path:
      #   eligible if computed_ltv_bps < 7800  (i.e., LTV < 78.00%)  (Federal HPA threshold)
      #
      # clean_payment_history_12mo = no Payment.status == SUSPENSE AND
      #                              no day in trailing 12 months where days_past_due > 30
      #
      # Denial reason precedence (first-match wins):
      #   1. Loan.status NOT IN {CURRENT, REINSTATED} -> IN_DELINQUENCY
      #   2. computed_ltv_bps >= 8000               -> LTV_TOO_HIGH
      #   3. clean_payment_history_12mo == false     -> PAYMENT_HISTORY_NOT_CLEAN
    input_set: "Loan.{principal_balance_cents, original_property_value_cents, status, current_appraised_value_cents}, PMIRemovalRequest.appraisal_value_cents, Payment.status history for the loan."
    constants:
      LTV_BORROWER_REQUEST_BPS: 8000   # 80.00%
      LTV_AUTO_TERMINATION_BPS: 7800   # 78.00%
      CLEAN_HISTORY_WINDOW_DAYS: 365
      CLEAN_HISTORY_MAX_DPD: 30

  - name: foreclosure_cure_amount
    trigger: "Recomputed on entry to ForeclosureCase states {FILED, MEDIATION_REQUIRED, IN_MEDIATION, MEDIATION_FAILED, SALE_SCHEDULED} and on GET /foreclosure-cases/{id}"
    algorithm: aggregation
    formula: |
      cure_amount_cents = (
          principal_arrears_cents
          + accrued_interest_cents
          + sum_of_outstanding_late_fees
          + FORECLOSURE_FEE_FLAT_CENTS
      )
      where principal_arrears_cents =
          (months_past_due * scheduled_monthly_pi_cents)
      # NOTE: This is NOT principal_balance_cents -- arrears only counts missed
      # scheduled principal+interest from past installments, not the full balance.
    input_set: "Loan.{days_past_due, scheduled_monthly_pi_cents, accrued_interest_cents}, outstanding LateFee rows."
    constants:
      FORECLOSURE_FEE_FLAT_CENTS: 250000   # $2,500 flat foreclosure cost
      MONTHLY_DAYS: 30
    precision: "Integer cents, no fractional cents. Rounding half_up applied per term."

  - name: forbearance_deferral_calc
    trigger: "ForbearancePlan ACTIVE transition"
    algorithm: aggregation
    formula: |
      # number_of_months = (end_date.year - start_date.year)*12
      #                  + (end_date.month - start_date.month) + 1
      # deferred_per_month = max(0, total_monthly_payment_cents - reduced_payment_cents)
      # deferred_total_cents = deferred_per_month * number_of_months
    input_set: "Loan.total_monthly_payment_cents, ForbearancePlan.{start_date, end_date, reduced_payment_cents}."
    constants: {}
    precision: "Integer cents. Final value pinned at activation, never recomputed."

  - name: amortization_schedule
    trigger: "POST /loans (computes scheduled_monthly_pi_cents at loan creation)"
    algorithm: tiered_pricing
    formula: |
      # Standard fixed-rate mortgage amortization:
      # r = interest_rate_bps / 1_000_000 / 12   (monthly rate as fraction)
      # n = term_months
      # P = original_principal_cents
      # scheduled_monthly_pi_cents = round_half_up( P * r * (1+r)^n / ((1+r)^n - 1) )
      # Edge case: if r == 0, scheduled_monthly_pi_cents = round_half_up(P / n)
    input_set: "Loan.{original_principal_cents, interest_rate_bps, term_months}."
    constants: {}
    precision: "Integer cents. Round half_up at the final monthly figure only -- never round intermediate (1+r)^n."

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "Request includes X-User-Role and X-User-ID headers."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /_clock/set_current_utc"

  - priority: 2
    category: auth
    check: "X-User-Role is allowed for this endpoint per §1.7."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-parameter resource exists; checked left-to-right (Loan → ForeclosureCase → MediationSession, etc.)."
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameterized endpoints"

  - priority: 4
    category: business_referential
    check: "Body-referenced foreign keys (loan_id, escrow_account_id, foreclosure_case_id, borrower_id) resolve to existing rows."
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "all POST/PUT endpoints carrying FK fields"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is permitted per §1.2."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: state
    check: "OCC: when expected_<parent>_version is required (§1.2.1), the provided value equals the current parent version."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /loans/{id}/foreclosure, POST /escrow-accounts/{id}/analyses"

  - priority: 7
    category: business_safety
    check: "HAMP mandatory mediation: a ForeclosureCase cannot transition to SALE_SCHEDULED before MediationSession.outcome is recorded; sale_date must be >= current_utc + SALE_NOTICE_DAYS (30)."
    error_id: ERR_MEDIATION_REQUIRED
    http_status: 422
    applies_to: "POST /foreclosure-cases/{id}/schedule-sale"

  - priority: 8
    category: business_safety
    check: "MediationSession.scheduled_for must lie at least MEDIATION_NOTICE_DAYS (14) after current_utc."
    error_id: ERR_NOTICE_PERIOD_VIOLATED
    http_status: 422
    applies_to: "POST /foreclosure-cases/{id}/mediation-sessions"

  - priority: 9
    category: business_constraint
    check: "ForbearancePlan window: end_date > start_date AND (end_date - start_date).days <= MAX_FORBEARANCE_MONTHS*30 (i.e., <= 360 days)."
    error_id: ERR_FORBEARANCE_WINDOW_EXCEEDED
    http_status: 422
    applies_to: "POST /loans/{id}/forbearance-plans"

  - priority: 10
    category: business_temporal
    check: "EscrowDisbursement.scheduled_for must be in the future (> current_utc)."
    error_id: ERR_DISBURSEMENT_IN_PAST
    http_status: 422
    applies_to: "POST /escrow-accounts/{id}/disbursements"

  - priority: 11
    category: business_constraint
    check: "EscrowAccount.cushion_months must satisfy 0 <= cushion_months <= MAX_CUSHION_MONTHS (2) per RESPA."
    error_id: ERR_CUSHION_OVERLIMIT
    http_status: 422
    applies_to: "POST /escrow-accounts, PUT /escrow-accounts/{id}"

  - priority: 12
    category: business_fiscal
    check: "Payment.amount_cents > 0; PMIRemovalRequest.appraisal_value_cents > 0 if provided."
    error_id: ERR_INVALID_AMOUNT
    http_status: 422
    applies_to: "POST /loans/{id}/payments, POST /pmi-removal-requests"

  - priority: 13
    category: business_fiscal
    check: "PMI removal denied when LTV >= LTV_BORROWER_REQUEST_BPS (8000) per §1.3 pmi_eligibility (LTV_TOO_HIGH precedence)."
    error_id: ERR_PMI_NOT_ELIGIBLE_LTV
    http_status: 422
    applies_to: "POST /pmi-removal-requests/{id}/decide"

  - priority: 14
    category: business_fiscal
    check: "PMI removal denied when payment history is not clean over CLEAN_HISTORY_WINDOW_DAYS (365)."
    error_id: ERR_PMI_NOT_ELIGIBLE_HISTORY
    http_status: 422
    applies_to: "POST /pmi-removal-requests/{id}/decide"

  - priority: 15
    category: business_constraint
    check: "Required input fields present and well-typed (POST /loans body, etc.)."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Borrowers ----
  - method: POST
    path: /borrowers
    description: "Create a borrower."
    roles: [LoanServicer, ComplianceOfficer]
    code: 201
    input: ["email", "full_name", "ssn_last4"]
    output: Borrower
    side_effects: ["Borrower row created with version=1"]

  - method: GET
    path: /borrowers/{id}
    description: "Read a borrower."
    roles: [LoanServicer, ComplianceOfficer, Borrower]
    code: 200
    input: []
    output: Borrower
    side_effects: []

  - method: GET
    path: /borrowers/{id}/loans
    description: "List loans for a borrower (FK reverse-reachability for Loan.borrower_id)."
    roles: [LoanServicer, ComplianceOfficer, Borrower]
    code: 200
    input: ["limit?", "offset?"]
    output: Loan[]
    side_effects: []

  # ---- Loans ----
  - method: POST
    path: /loans
    description: "Originate a loan. Server computes scheduled_monthly_pi_cents via amortization_schedule and sets status=CURRENT."
    roles: [LoanServicer]
    code: 201
    input: ["borrower_id", "origination_date", "original_principal_cents", "original_property_value_cents", "interest_rate_bps", "term_months", "pmi_monthly_cents", "current_appraised_value_cents?"]
    output: Loan
    side_effects:
      - "Loan created with status=CURRENT, principal_balance_cents=original_principal_cents, accrued_interest_cents=0, pmi_status=ACTIVE if LTV>=8000 else NOT_APPLICABLE"
      - "scheduled_monthly_pi_cents computed via §1.3 amortization_schedule"
      - "next_due_date = origination_date + 30 days"
      - "Loan.version=1"

  - method: GET
    path: /loans/{id}
    description: "Read a loan, including computed derived fields."
    roles: [LoanServicer, ComplianceOfficer, Borrower]
    code: 200
    input: []
    output: Loan
    side_effects: []

  - method: GET
    path: /loans
    description: "List loans with optional filters."
    roles: [LoanServicer, ComplianceOfficer]
    code: 200
    input: ["borrower_id?", "status?", "limit?", "offset?"]
    output: Loan[]
    side_effects: []

  - method: POST
    path: /loans/{id}/payments
    description: "Post a payment to a loan, executing §1.3 payment_posting waterfall and refreshing days_past_due, next_due_date, principal_balance_cents."
    roles: [LoanServicer, Borrower]
    code: 201
    input: ["amount_cents", "received_at", "posting_strategy?"]
    output: Payment
    side_effects:
      - "Payment created with status=POSTED or SUSPENSE per §1.3"
      - "Loan.{principal_balance_cents, accrued_interest_cents, last_payment_posted_at, days_past_due, next_due_date} refreshed"
      - "EscrowAccount.balance_cents += allocation.escrow_cents"
      - "If days_past_due returns to 0 and Loan.status==DELINQUENT, transition to CURRENT (cascade per §1.2)"
      - "If payment fully retires balance, Loan.status -> PAID_OFF and all SCHEDULED EscrowDisbursement rows for this loan -> CANCELLED"
      - "Loan.version += 1"
      - "EscrowAccount.version += 1 if escrow_cents > 0"

  - method: GET
    path: /loans/{id}/payments
    description: "List payments for a loan (FK reverse-reachability for Payment.loan_id)."
    roles: [LoanServicer, ComplianceOfficer, Borrower]
    code: 200
    input: ["limit?", "offset?"]
    output: Payment[]
    side_effects: []

  - method: POST
    path: /loans/{id}/foreclosure
    description: "File foreclosure on a delinquent loan. OCC-guarded by expected_loan_version."
    roles: [LoanServicer]
    code: 201
    input: ["expected_loan_version"]
    output: ForeclosureCase
    side_effects:
      - "ForeclosureCase created in FILED state then auto-transitioned to MEDIATION_REQUIRED"
      - "Loan.status -> FORECLOSURE"
      - "Loan.version += 1; ForeclosureCase.version increments through auto-transition"
      - "cure_amount_cents pinned via §1.3 foreclosure_cure_amount"

  - method: GET
    path: /loans/{id}/foreclosure-cases
    description: "List foreclosure cases for a loan (FK reverse-reachability for ForeclosureCase.loan_id)."
    roles: [LoanServicer, ComplianceOfficer, Borrower]
    code: 200
    input: ["limit?", "offset?"]
    output: ForeclosureCase[]
    side_effects: []

  # ---- Forbearance plans ----
  - method: POST
    path: /loans/{id}/forbearance-plans
    description: "Propose a forbearance plan for a delinquent loan."
    roles: [LoanServicer]
    code: 201
    input: ["start_date", "end_date", "reduced_payment_cents"]
    output: ForbearancePlan
    side_effects:
      - "ForbearancePlan created in PROPOSED state"

  - method: GET
    path: /loans/{id}/forbearance-plans
    description: "List forbearance plans for a loan (FK reverse-reachability for ForbearancePlan.loan_id)."
    roles: [LoanServicer, ComplianceOfficer, Borrower]
    code: 200
    input: ["limit?", "offset?"]
    output: ForbearancePlan[]
    side_effects: []

  - method: POST
    path: /forbearance-plans/{id}/activate
    description: "Activate a proposed forbearance plan; transitions the loan to FORBEARANCE."
    roles: [LoanServicer]
    code: 200
    input: []
    output: ForbearancePlan
    side_effects:
      - "ForbearancePlan.status -> ACTIVE"
      - "ForbearancePlan.deferred_total_cents computed via §1.3 forbearance_deferral_calc"
      - "Loan.status -> FORBEARANCE (cascade)"
      - "Loan.version += 1"

  - method: POST
    path: /forbearance-plans/{id}/complete
    description: "Complete a forbearance plan at or after end_date."
    roles: [LoanServicer]
    code: 200
    input: []
    output: ForbearancePlan
    side_effects:
      - "ForbearancePlan.status -> COMPLETED"
      - "Loan.status -> REINSTATED (cascade)"
      - "Loan.next_due_date set to current_utc + 30 days"
      - "Loan.version += 1"

  - method: POST
    path: /forbearance-plans/{id}/terminate
    description: "Terminate an active forbearance plan early."
    roles: [LoanServicer]
    code: 200
    input: []
    output: ForbearancePlan
    side_effects:
      - "ForbearancePlan.status -> TERMINATED_EARLY"
      - "Loan.status -> DELINQUENT (cascade)"
      - "Loan.version += 1"

  - method: GET
    path: /forbearance-plans/{id}
    description: "Read a forbearance plan."
    roles: [LoanServicer, ComplianceOfficer, Borrower]
    code: 200
    input: []
    output: ForbearancePlan
    side_effects: []

  # ---- Escrow accounts and disbursements ----
  - method: POST
    path: /escrow-accounts
    description: "Create an escrow account bound to a loan (1:1)."
    roles: [LoanServicer]
    code: 201
    input: ["loan_id", "annual_tax_cents", "annual_insurance_cents", "cushion_months?"]
    output: EscrowAccount
    side_effects:
      - "EscrowAccount created with balance_cents=0"
      - "Loan.escrow_monthly_cents set to round_half_up((annual_tax+annual_insurance)/12)"
      - "Loan.total_monthly_payment_cents recomputed"
      - "Loan.version += 1"

  - method: GET
    path: /escrow-accounts/{id}
    description: "Read an escrow account."
    roles: [LoanServicer, ComplianceOfficer, Borrower]
    code: 200
    input: []
    output: EscrowAccount
    side_effects: []

  - method: GET
    path: /escrow-accounts
    description: "List escrow accounts, optionally filtered (FK reverse-reachability for EscrowAccount.loan_id)."
    roles: [LoanServicer, ComplianceOfficer]
    code: 200
    input: ["loan_id?", "limit?", "offset?"]
    output: EscrowAccount[]
    side_effects: []

  - method: POST
    path: /escrow-accounts/{id}/disbursements
    description: "Schedule a tax or insurance disbursement against an escrow account."
    roles: [LoanServicer]
    code: 201
    input: ["kind", "amount_cents", "scheduled_for"]
    output: EscrowDisbursement
    side_effects:
      - "EscrowDisbursement created in SCHEDULED state"

  - method: GET
    path: /escrow-accounts/{id}/disbursements
    description: "List disbursements for an escrow account (FK reverse-reachability for EscrowDisbursement.escrow_account_id)."
    roles: [LoanServicer, ComplianceOfficer, Borrower]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: EscrowDisbursement[]
    side_effects: []

  - method: GET
    path: /escrow-disbursements/{id}
    description: "Read a disbursement."
    roles: [LoanServicer, ComplianceOfficer, Borrower]
    code: 200
    input: []
    output: EscrowDisbursement
    side_effects: []

  - method: POST
    path: /escrow-disbursements/{id}/cancel
    description: "Cancel a scheduled disbursement."
    roles: [LoanServicer]
    code: 200
    input: []
    output: EscrowDisbursement
    side_effects:
      - "EscrowDisbursement.status -> CANCELLED"

  - method: POST
    path: /escrow-accounts/{id}/analyses
    description: "Run an escrow analysis (ACTUAL_TRAILING_12 or FORECAST_NEXT_12). OCC-guarded by expected_escrow_account_version."
    roles: [LoanServicer]
    code: 201
    input: ["as_of_date", "variant", "expected_escrow_account_version"]
    output: EscrowAnalysis
    side_effects:
      - "EscrowAnalysis row created via §1.3 escrow_analysis"
      - "EscrowAccount.shortage_cents, surplus_cents refreshed"
      - "Loan.escrow_monthly_cents = analysis.new_escrow_monthly_cents"
      - "Loan.total_monthly_payment_cents recomputed"
      - "EscrowAccount.version += 1"
      - "Loan.version += 1"

  - method: GET
    path: /escrow-accounts/{id}/analyses
    description: "List analyses for an escrow account (FK reverse-reachability for EscrowAnalysis.loan_id is satisfied indirectly; also satisfies direct loan-level filter via the filtered-list endpoint below)."
    roles: [LoanServicer, ComplianceOfficer, Borrower]
    code: 200
    input: ["limit?", "offset?"]
    output: EscrowAnalysis[]
    side_effects: []

  - method: GET
    path: /escrow-analyses
    description: "List escrow analyses, optionally filtered by loan_id (FK reverse-reachability for EscrowAnalysis.loan_id)."
    roles: [LoanServicer, ComplianceOfficer, Borrower]
    code: 200
    input: ["loan_id?", "limit?", "offset?"]
    output: EscrowAnalysis[]
    side_effects: []

  - method: GET
    path: /escrow-analyses/{id}
    description: "Read a single escrow analysis."
    roles: [LoanServicer, ComplianceOfficer, Borrower]
    code: 200
    input: []
    output: EscrowAnalysis
    side_effects: []

  # ---- PMI removal ----
  - method: POST
    path: /pmi-removal-requests
    description: "Submit a PMI removal request."
    roles: [LoanServicer, Borrower]
    code: 201
    input: ["loan_id", "appraisal_value_cents?"]
    output: PMIRemovalRequest
    side_effects:
      - "PMIRemovalRequest created in PENDING; computed_ltv_bps pinned per §1.3 pmi_eligibility"
      - "Loan.pmi_status -> REMOVAL_PENDING"
      - "Loan.version += 1"

  - method: GET
    path: /pmi-removal-requests
    description: "List PMI removal requests, optionally by loan_id (FK reverse-reachability for PMIRemovalRequest.loan_id)."
    roles: [LoanServicer, ComplianceOfficer, Borrower]
    code: 200
    input: ["loan_id?", "status?", "limit?", "offset?"]
    output: PMIRemovalRequest[]
    side_effects: []

  - method: GET
    path: /pmi-removal-requests/{id}
    description: "Read a PMI removal request."
    roles: [LoanServicer, ComplianceOfficer, Borrower]
    code: 200
    input: []
    output: PMIRemovalRequest
    side_effects: []

  - method: POST
    path: /pmi-removal-requests/{id}/decide
    description: "Compliance decision on a pending PMI removal request."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: PMIRemovalRequest
    side_effects:
      - "Re-runs §1.3 pmi_eligibility; sets status APPROVED or DENIED"
      - "On APPROVED: Loan.pmi_required=false, Loan.pmi_status=REMOVED, Loan.total_monthly_payment_cents recomputed, Loan.version += 1"
      - "On DENIED: PMIRemovalRequest.denial_reason set; Loan.pmi_status -> ACTIVE (revert from REMOVAL_PENDING), Loan.version += 1"

  # ---- Foreclosure / mediation ----
  - method: GET
    path: /foreclosure-cases/{id}
    description: "Read a foreclosure case (includes refreshed cure_amount_cents)."
    roles: [LoanServicer, ComplianceOfficer, Borrower]
    code: 200
    input: []
    output: ForeclosureCase
    side_effects:
      - "cure_amount_cents recomputed via §1.3 foreclosure_cure_amount"

  - method: POST
    path: /foreclosure-cases/{id}/mediation-sessions
    description: "Schedule a HAMP-style pre-foreclosure mediation session; transitions case to IN_MEDIATION."
    roles: [LoanServicer]
    code: 201
    input: ["scheduled_for"]
    output: MediationSession
    side_effects:
      - "MediationSession created with outcome=PENDING"
      - "ForeclosureCase.status -> IN_MEDIATION"
      - "ForeclosureCase.version += 1"

  - method: GET
    path: /foreclosure-cases/{id}/mediation-sessions
    description: "List mediation sessions for a foreclosure case (FK reverse-reachability for MediationSession.foreclosure_case_id)."
    roles: [LoanServicer, ComplianceOfficer, Borrower]
    code: 200
    input: ["limit?", "offset?"]
    output: MediationSession[]
    side_effects: []

  - method: GET
    path: /mediation-sessions/{id}
    description: "Read a mediation session."
    roles: [LoanServicer, ComplianceOfficer, Borrower]
    code: 200
    input: []
    output: MediationSession
    side_effects: []

  - method: POST
    path: /mediation-sessions/{id}/record-outcome
    description: "Record the outcome of a mediation session."
    roles: [LoanServicer]
    code: 200
    input: ["outcome", "modification_pi_cents?"]
    output: MediationSession
    side_effects:
      - "MediationSession.outcome set"
      - "If outcome IN {MODIFICATION_AGREED, FORBEARANCE_AGREED}: ForeclosureCase.status -> COMPLETED; Loan transitions per §1.2; Loan.version += 1"
      - "If outcome == NO_AGREEMENT: ForeclosureCase.status -> MEDIATION_FAILED"
      - "ForeclosureCase.version += 1"

  - method: POST
    path: /foreclosure-cases/{id}/schedule-sale
    description: "Schedule the foreclosure sale (only after MEDIATION_FAILED)."
    roles: [LoanServicer]
    code: 200
    input: ["sale_date"]
    output: ForeclosureCase
    side_effects:
      - "ForeclosureCase.status -> SALE_SCHEDULED; sale_date set"
      - "ForeclosureCase.version += 1"

  - method: POST
    path: /foreclosure-cases/{id}/withdraw
    description: "Withdraw the foreclosure (e.g., borrower cured)."
    roles: [LoanServicer]
    code: 200
    input: []
    output: ForeclosureCase
    side_effects:
      - "ForeclosureCase.status -> WITHDRAWN"
      - "Loan.status -> REINSTATED"
      - "ForeclosureCase.version += 1; Loan.version += 1"

  # ---- Test-driving endpoints ----
  - method: POST
    path: /_clock/set_current_utc
    description: "Set the simulated current UTC time. Drives deterministic clock-advancement; triggers auto-transitions: CURRENT->DELINQUENT past grace, SCHEDULED EscrowDisbursement -> PAID/FAILED, SALE_SCHEDULED -> COMPLETED past sale_date."
    roles: [LoanServicer, ComplianceOfficer]
    code: 200
    input: ["to_iso8601"]
    output: "{ current_utc: datetime }"
    side_effects:
      - "All eligible auto-transitions in §1.2 fire deterministically"
      - "Loan.days_past_due recomputed for every loan"
      - "EscrowDisbursement rows past scheduled_for evaluated"
      - "ForeclosureCase rows in SALE_SCHEDULED past sale_date transition to COMPLETED"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted to call this endpoint per §1.7."
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "Path-parameter id does not resolve to a resource."
  - id: ERR_FK_NOT_FOUND
    http: 404
    condition: "Body foreign-key (loan_id, borrower_id, foreclosure_case_id, escrow_account_id) does not resolve."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in a state from which the requested transition is permitted."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC expected_<parent>_version does not match current parent version."
  - id: ERR_MEDIATION_REQUIRED
    http: 422
    condition: "Attempt to schedule sale before mediation completed, or sale_date < current_utc + SALE_NOTICE_DAYS."
  - id: ERR_NOTICE_PERIOD_VIOLATED
    http: 422
    condition: "MediationSession.scheduled_for < current_utc + MEDIATION_NOTICE_DAYS (14)."
  - id: ERR_FORBEARANCE_WINDOW_EXCEEDED
    http: 422
    condition: "ForbearancePlan window > 12 months or end_date <= start_date."
  - id: ERR_DISBURSEMENT_IN_PAST
    http: 422
    condition: "EscrowDisbursement.scheduled_for <= current_utc."
  - id: ERR_CUSHION_OVERLIMIT
    http: 422
    condition: "EscrowAccount.cushion_months > MAX_CUSHION_MONTHS (2)."
  - id: ERR_INVALID_AMOUNT
    http: 422
    condition: "Payment.amount_cents <= 0 or PMIRemovalRequest.appraisal_value_cents <= 0."
  - id: ERR_PMI_NOT_ELIGIBLE_LTV
    http: 422
    condition: "LTV >= LTV_BORROWER_REQUEST_BPS at decision time."
  - id: ERR_PMI_NOT_ELIGIBLE_HISTORY
    http: 422
    condition: "Payment history not clean over CLEAN_HISTORY_WINDOW_DAYS."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required input field missing or malformed type."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: LoanServicer
    description: "Servicing operations team; originates loans, posts payments, manages forbearance and foreclosure workflows, schedules escrow disbursements and analyses."
    identity: opaque
    exclusive_operations:
      - "POST /loans"
      - "POST /loans/{id}/foreclosure"
      - "POST /loans/{id}/forbearance-plans"
      - "POST /forbearance-plans/{id}/activate"
      - "POST /forbearance-plans/{id}/complete"
      - "POST /forbearance-plans/{id}/terminate"
      - "POST /escrow-accounts"
      - "POST /escrow-accounts/{id}/disbursements"
      - "POST /escrow-accounts/{id}/analyses"
      - "POST /escrow-disbursements/{id}/cancel"
      - "POST /foreclosure-cases/{id}/mediation-sessions"
      - "POST /mediation-sessions/{id}/record-outcome"
      - "POST /foreclosure-cases/{id}/schedule-sale"
      - "POST /foreclosure-cases/{id}/withdraw"
    shared_operations:
      - "POST /borrowers"
      - "POST /loans/{id}/payments"
      - "POST /pmi-removal-requests"
      - "POST /_clock/set_current_utc"
      - "All GET endpoints"

  - name: ComplianceOfficer
    description: "Regulatory/compliance reviewer; sole approver of PMI removal decisions; read-only across loans/payments; cannot originate, foreclose, or post payments."
    identity: opaque
    exclusive_operations:
      - "POST /pmi-removal-requests/{id}/decide"
    shared_operations:
      - "POST /borrowers"
      - "POST /_clock/set_current_utc"
      - "All GET endpoints"

  - name: Borrower
    description: "End-user customer; can read own loan/payment/escrow data, post payments to own loans, and submit PMI removal requests for own loans."
    identity: entity_backed:Borrower
    exclusive_operations: []
    shared_operations:
      - "POST /loans/{id}/payments  (only when Loan.borrower_id == X-User-ID)"
      - "POST /pmi-removal-requests  (only when loan_id refers to a Loan with borrower_id == X-User-ID)"
      - "GET /borrowers/{id}, /borrowers/{id}/loans, /loans/{id}, /loans/{id}/payments, /loans/{id}/forbearance-plans, /loans/{id}/foreclosure-cases (only when own borrower_id matches; otherwise ERR_UNAUTHORIZED)"
      - "GET /escrow-accounts/{id}, /escrow-accounts/{id}/disbursements, /escrow-accounts/{id}/analyses (only when escrow.loan_id refers to own loan)"
      - "GET /forbearance-plans/{id}, /escrow-disbursements/{id}, /foreclosure-cases/{id}, /foreclosure-cases/{id}/mediation-sessions, /mediation-sessions/{id} (only when ultimately bound to own loan)"
      - "GET /pmi-removal-requests, GET /pmi-removal-requests/{id} (only when scoped to own loan)"
      - "GET /escrow-analyses (only filtered by own loan_id)"
