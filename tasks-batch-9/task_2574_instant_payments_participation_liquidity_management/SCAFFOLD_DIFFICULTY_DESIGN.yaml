            - "PrefundedPositionAccount.${acct_id}.alert_tier == GREEN and every LiquidityAlert of the account has status CLEARED"
            - "Participant.${pa_id}.operational_posture == NORMAL"
            - "CreditTransfer.${t1_id}.clearing_status == SETTLED (the original is never rewound) and exception_status == RETURN_HONORED"
            - "Exactly 1 compensating CreditTransfer exists with direction INBOUND, clearing_status SETTLED, amount_cents == 250000000 and compensating_for_transfer_id == ${t1_id}"

