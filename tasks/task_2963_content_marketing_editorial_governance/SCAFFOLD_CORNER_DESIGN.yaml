          rationale: "The >= comparison against TIER_HIGH_PCT at exactly 80.00, and the 3-point surcharge it selects, are asserted by the named §1.8 instance."

      - name: decay_with_a_zero_baseline_window_is_covered_by_the_difficulty_design
