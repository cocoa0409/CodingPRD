      - name: account_closure_requires_no_open_orders_and_a_closed_account_cannot_order
        claim_type: violation_to_error
        grounds:
          - validations[priority 9]
          - errors[ERR_ACCOUNT_HAS_OPEN_ORDERS]
          - errors[ERR_ACCOUNT_CLOSED]
          - state_machines.Account.ACTIVE_to_CLOSED
        distinguishing_aspect: |
          Closure is blocked while a SUBMITTED order is live and permitted once it is CANCELLED; the
          closed account then fails a fresh order with ERR_ACCOUNT_CLOSED rather than
          ERR_ACCOUNT_CREDIT_HOLD, even though its credit_used_cents is 0 and its limit is untouched.
        test_recipe:
          setup:
            - "ACTIVE style ST-SD-01 at 4275 cents/yard, Account AC-01 with a 100000000-cent limit and one SUBMITTED 40.0-yard order."
