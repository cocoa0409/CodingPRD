# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over §1.1-§1.7 claims not already covered by §1.8.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_trip_returns_201_with_defaults
        claim_type: Creation
        grounds: ["entities.RiverTrip", "endpoints"]
        distinguishing_aspect: "POST /trips with all required fields returns 201; status=SCHEDULED, committed_guests=0, deposits_held_cents=0, booking_mode=GROUP, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /trips"
              payload: { river_name: "Colorado", difficulty_class: "CLASS_III", trip_date: "2026-08-01T09:00:00Z", end_time: "2026-08-01T15:00:00Z", put_in_location: "Lees", take_out_location: "Phantom", max_capacity: 12, guide_ratio_max: 6, base_rate_cents: 12000, min_age: 12, safe_flow_min: 800, safe_flow_max: 3000, marginal_flow_max: 4000 }
              as: OutfitterManager
              captures: { trip_id: $.data.id, st: $.data.status, cg: $.data.committed_guests, ver: $.data.version }
          assert:
            - "HTTP status == 201"
            - "RiverTrip.${trip_id}.status == SCHEDULED"
            - "RiverTrip.${trip_id}.committed_guests == 0"
            - "RiverTrip.${trip_id}.deposits_held_cents == 0"
            - "RiverTrip.${trip_id}.version == 1"

      - name: get_trip_not_found_returns_404
        claim_type: Not Found
        grounds: ["entities.RiverTrip", "errors[ERR_TRIP_NOT_FOUND]"]
        distinguishing_aspect: "GET /trips/{random uuid} on empty DB returns 404 ERR_TRIP_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /trips/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: OutfitterManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response.data.error_id == ERR_TRIP_NOT_FOUND"

      - name: create_reservation_missing_required_party_size_returns_invalid_request
        claim_type: Required Fields
        grounds: ["entities.Reservation", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /reservations omitting party_size returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["A trip exists."]
          setup_api_calls:
            - call: "POST /trips"
              payload: { river_name: "Green", difficulty_class: "CLASS_II", trip_date: "2026-08-02T09:00:00Z", end_time: "2026-08-02T15:00:00Z", put_in_location: "Gates", take_out_location: "Split", max_capacity: 12, guide_ratio_max: 6, base_rate_cents: 12000, safe_flow_min: 800, safe_flow_max: 3000, marginal_flow_max: 4000 }
              as: OutfitterManager
              captures: { trip_id: $.data.id, trip_v: $.data.version }
          trigger:
            - call: "POST /reservations"
              payload: { trip_id: "${trip_id}", booking_type: "GROUP", deposit_cents: 3000, expected_trip_version: "${trip_v}" }
              as: Reservationist
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_trip_invalid_time_window_rejected
        claim_type: Type Constraints
        grounds: ["entities.RiverTrip.fields.end_time", "errors[ERR_INVALID_TIME_WINDOW]"]
        distinguishing_aspect: "POST /trips with end_time <= trip_date returns 400 ERR_INVALID_TIME_WINDOW."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /trips"
              payload: { river_name: "Bad", difficulty_class: "CLASS_III", trip_date: "2026-08-03T15:00:00Z", end_time: "2026-08-03T09:00:00Z", put_in_location: "X", take_out_location: "Y", max_capacity: 12, guide_ratio_max: 6, base_rate_cents: 12000, safe_flow_min: 800, safe_flow_max: 3000, marginal_flow_max: 4000 }
              as: OutfitterManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response.data.error_id == ERR_INVALID_TIME_WINDOW"

      - name: create_reservation_photo_addon_defaults_false
        claim_type: Defaults
        grounds: ["entities.Reservation.fields.photo_addon"]
        distinguishing_aspect: "POST /reservations without photo_addon defaults it to false; estimated_total excludes the 4000 photo fee (party_size=1, no photo -> 12000)."
        test_recipe:
          setup: ["A trip with base_rate_cents=12000 exists."]
          setup_api_calls:
            - call: "POST /trips"
              payload: { river_name: "Merced", difficulty_class: "CLASS_III", trip_date: "2026-08-04T09:00:00Z", end_time: "2026-08-04T15:00:00Z", put_in_location: "Red", take_out_location: "Bagby", max_capacity: 12, guide_ratio_max: 6, base_rate_cents: 12000, safe_flow_min: 800, safe_flow_max: 3000, marginal_flow_max: 4000 }
              as: OutfitterManager
              captures: { trip_id: $.data.id, trip_v: $.data.version }
          trigger:
            - call: "POST /reservations"
              payload: { trip_id: "${trip_id}", booking_type: "GROUP", party_size: 1, deposit_cents: 3000, expected_trip_version: "${trip_v}" }
              as: Reservationist
              captures: { res_id: $.data.id, addon: $.data.photo_addon, est: $.data.estimated_total_cents }
          assert:
            - "Reservation.${res_id}.photo_addon == false"
            - "Reservation.${res_id}.estimated_total_cents == 12000"

      - name: reservation_list_is_paginated
        claim_type: Listing
        grounds: ["entities.Reservation", "endpoints"]
        distinguishing_aspect: "GET /reservations returns a paginated envelope with total_count and has_more fields."
        test_recipe:
          setup: ["At least one reservation exists."]
          setup_api_calls:
            - call: "POST /trips"
              payload: { river_name: "Rogue2", difficulty_class: "CLASS_II", trip_date: "2026-08-05T09:00:00Z", end_time: "2026-08-05T15:00:00Z", put_in_location: "A", take_out_location: "B", max_capacity: 12, guide_ratio_max: 6, base_rate_cents: 12000, safe_flow_min: 800, safe_flow_max: 3000, marginal_flow_max: 4000 }
              as: OutfitterManager
              captures: { trip_id: $.data.id, trip_v: $.data.version }
            - call: "POST /reservations"
              payload: { trip_id: "${trip_id}", booking_type: "GROUP", party_size: 1, deposit_cents: 3000, expected_trip_version: "${trip_v}" }
              as: Reservationist
          trigger:
            - call: "GET /reservations?trip_id=${trip_id}"
              payload: {}
              as: Reservationist
          assert:
            - "response envelope meta.total_count is present and has_more is present"
            - "response.data is an array containing the reservation"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: initial_trip_status_is_scheduled
        claim_type: Initial State
        grounds: ["state_machines.RiverTrip", "entities.RiverTrip.fields.status"]
        distinguishing_aspect: "A newly created trip starts in initial_state SCHEDULED."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /trips"
              payload: { river_name: "Init", difficulty_class: "CLASS_I", trip_date: "2026-08-06T09:00:00Z", end_time: "2026-08-06T15:00:00Z", put_in_location: "A", take_out_location: "B", max_capacity: 12, guide_ratio_max: 6, base_rate_cents: 12000, safe_flow_min: 800, safe_flow_max: 3000, marginal_flow_max: 4000 }
              as: OutfitterManager
              captures: { trip_id: $.data.id, st: $.data.status }
          assert:
            - "RiverTrip.${trip_id}.status == SCHEDULED"

      - name: open_trip_without_guide_returns_no_guide_assigned
        claim_type: Precondition Enforcement
        grounds: ["state_machines.RiverTrip.SCHEDULED_to_OPEN", "errors[ERR_NO_GUIDE_ASSIGNED]"]
        distinguishing_aspect: "POST /trips/{id}/open with assigned_guide_count=0 fails 409 ERR_NO_GUIDE_ASSIGNED."
        test_recipe:
          setup: ["A SCHEDULED trip with no guide assignments."]
          setup_api_calls:
            - call: "POST /trips"
              payload: { river_name: "NoGuide", difficulty_class: "CLASS_III", trip_date: "2026-08-07T09:00:00Z", end_time: "2026-08-07T15:00:00Z", put_in_location: "A", take_out_location: "B", max_capacity: 12, guide_ratio_max: 6, base_rate_cents: 12000, safe_flow_min: 800, safe_flow_max: 3000, marginal_flow_max: 4000 }
              as: OutfitterManager
              captures: { trip_id: $.data.id }
          trigger:
            - call: "POST /trips/${trip_id}/open"
              payload: {}
              as: OutfitterManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_NO_GUIDE_ASSIGNED"

      - name: sign_waiver_twice_second_returns_not_pending
        claim_type: Idempotency
        grounds: ["state_machines.Waiver.PENDING_to_SIGNED", "errors[ERR_WAIVER_NOT_PENDING]"]
        distinguishing_aspect: "Signing an already SIGNED waiver a second time fails 409 ERR_WAIVER_NOT_PENDING."
        test_recipe:
          setup: ["A reservation with a guest whose waiver has been SIGNED."]
          setup_api_calls:
            - call: "POST /trips"
              payload: { river_name: "W", difficulty_class: "CLASS_II", trip_date: "2026-08-08T09:00:00Z", end_time: "2026-08-08T15:00:00Z", put_in_location: "A", take_out_location: "B", max_capacity: 12, guide_ratio_max: 6, base_rate_cents: 12000, safe_flow_min: 800, safe_flow_max: 3000, marginal_flow_max: 4000 }
              as: OutfitterManager
              captures: { trip_id: $.data.id, trip_v: $.data.version }
            - call: "POST /reservations"
              payload: { trip_id: "${trip_id}", booking_type: "GROUP", party_size: 1, deposit_cents: 3000, expected_trip_version: "${trip_v}" }
              as: Reservationist
              captures: { res_id: $.data.id }
            - call: "POST /guests"
              payload: { reservation_id: "${res_id}", full_name: "Ann", age: 40, weight_lbs: 150 }
              as: Reservationist
              captures: { guest_id: $.data.id }
            - call: "GET /waivers?guest_id=${guest_id}"
              payload: {}
              as: Reservationist
              captures: { waiver_id: "$.data[0].id" }
            - call: "POST /waivers/${waiver_id}/sign"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
          trigger:
            - call: "POST /waivers/${waiver_id}/sign"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_WAIVER_NOT_PENDING"

      - name: retired_gear_cannot_be_assigned
        claim_type: Invalid Transitions
        grounds: ["state_machines.GearItem.AVAILABLE_to_OUT_OF_SERVICE", "errors[ERR_GEAR_UNAVAILABLE]"]
        distinguishing_aspect: "Assigning an OUT_OF_SERVICE gear item fails 409 ERR_GEAR_UNAVAILABLE."
        test_recipe:
          setup: ["A retired PFD, plus a trip/reservation/guest to assign to."]
          setup_api_calls:
            - call: "POST /trips"
              payload: { river_name: "R", difficulty_class: "CLASS_II", trip_date: "2026-08-09T09:00:00Z", end_time: "2026-08-09T15:00:00Z", put_in_location: "A", take_out_location: "B", max_capacity: 12, guide_ratio_max: 6, base_rate_cents: 12000, safe_flow_min: 800, safe_flow_max: 3000, marginal_flow_max: 4000 }
              as: OutfitterManager
              captures: { trip_id: $.data.id, trip_v: $.data.version }
            - call: "POST /gear-items"
              payload: { gear_type: "PFD", size_label: "L", min_weight_lbs: 100, max_weight_lbs: 250 }
              as: OutfitterManager
              captures: { pfd_id: $.data.id }
            - call: "POST /gear-items/${pfd_id}/retire"
              payload: {}
              as: OutfitterManager
            - call: "POST /reservations"
              payload: { trip_id: "${trip_id}", booking_type: "GROUP", party_size: 1, deposit_cents: 3000, expected_trip_version: "${trip_v}" }
              as: Reservationist
              captures: { res_id: $.data.id }
            - call: "POST /guests"
              payload: { reservation_id: "${res_id}", full_name: "Bo", age: 30, weight_lbs: 175 }
              as: Reservationist
              captures: { guest_id: $.data.id }
          trigger:
            - call: "POST /gear-assignments"
              payload: { gear_item_id: "${pfd_id}", guest_id: "${guest_id}", trip_id: "${trip_id}" }
              as: Reservationist
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_GEAR_UNAVAILABLE"

      - name: complete_trip_with_pending_reservation_returns_unresolved
        claim_type: Precondition Enforcement
        grounds: ["state_machines.RiverTrip.OPEN_to_COMPLETED", "errors[ERR_UNRESOLVED_RESERVATIONS]"]
        distinguishing_aspect: "Completing a trip while a reservation is still PENDING fails 409 ERR_UNRESOLVED_RESERVATIONS."
        test_recipe:
          setup: ["An OPEN trip (1 guide) with a PENDING reservation."]
          setup_api_calls:
            - call: "POST /trips"
              payload: { river_name: "C", difficulty_class: "CLASS_III", trip_date: "2026-08-10T09:00:00Z", end_time: "2026-08-10T15:00:00Z", put_in_location: "A", take_out_location: "B", max_capacity: 12, guide_ratio_max: 6, base_rate_cents: 12000, safe_flow_min: 800, safe_flow_max: 3000, marginal_flow_max: 4000 }
              as: OutfitterManager
              captures: { trip_id: $.data.id }
            - call: "POST /guides"
              payload: { full_name: "G", max_class: "CLASS_III" }
              as: OutfitterManager
              captures: { guide_id: $.data.id }
            - call: "POST /guide-assignments"
              payload: { trip_id: "${trip_id}", guide_id: "${guide_id}", role: "LEAD" }
              as: OutfitterManager
            - call: "POST /trips/${trip_id}/open"
              payload: {}
              as: OutfitterManager
            - call: "GET /trips/${trip_id}"
              payload: {}
              as: Reservationist
              captures: { trip_v: $.data.version }
            - call: "POST /reservations"
              payload: { trip_id: "${trip_id}", booking_type: "GROUP", party_size: 1, deposit_cents: 3000, expected_trip_version: "${trip_v}" }
              as: Reservationist
          trigger:
            - call: "POST /trips/${trip_id}/complete"
              payload: {}
              as: OutfitterManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_UNRESOLVED_RESERVATIONS"

      - name: deactivate_guide_in_use_returns_guide_in_use
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Guide.ACTIVE_to_INACTIVE", "errors[ERR_GUIDE_IN_USE]"]
        distinguishing_aspect: "Deactivating a guide with an ASSIGNED assignment on a non-terminal trip fails 409 ERR_GUIDE_IN_USE."
        test_recipe:
          setup: ["A guide ASSIGNED to a non-terminal trip."]
          setup_api_calls:
            - call: "POST /trips"
              payload: { river_name: "D", difficulty_class: "CLASS_III", trip_date: "2026-08-11T09:00:00Z", end_time: "2026-08-11T15:00:00Z", put_in_location: "A", take_out_location: "B", max_capacity: 12, guide_ratio_max: 6, base_rate_cents: 12000, safe_flow_min: 800, safe_flow_max: 3000, marginal_flow_max: 4000 }
              as: OutfitterManager
              captures: { trip_id: $.data.id }
            - call: "POST /guides"
              payload: { full_name: "Busy", max_class: "CLASS_III" }
              as: OutfitterManager
              captures: { guide_id: $.data.id }
            - call: "POST /guide-assignments"
              payload: { trip_id: "${trip_id}", guide_id: "${guide_id}", role: "LEAD" }
              as: OutfitterManager
          trigger:
            - call: "POST /guides/${guide_id}/deactivate"
              payload: {}
              as: OutfitterManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_GUIDE_IN_USE"

      - name: cancel_shuttle_run_from_scheduled_succeeds
        claim_type: Valid Transition
        grounds: ["state_machines.ShuttleRun.SCHEDULED_to_CANCELLED"]
        distinguishing_aspect: "POST /shuttle-runs/{id}/cancel moves a SCHEDULED run to CANCELLED."
        test_recipe:
          setup: ["A SCHEDULED shuttle run."]
          setup_api_calls:
            - call: "POST /trips"
              payload: { river_name: "S", difficulty_class: "CLASS_II", trip_date: "2026-08-12T09:00:00Z", end_time: "2026-08-12T15:00:00Z", put_in_location: "A", take_out_location: "B", max_capacity: 12, guide_ratio_max: 6, base_rate_cents: 12000, safe_flow_min: 800, safe_flow_max: 3000, marginal_flow_max: 4000 }
              as: OutfitterManager
              captures: { trip_id: $.data.id }
            - call: "POST /shuttle-vehicles"
              payload: { name: "Van", seat_capacity: 12 }
              as: OutfitterManager
              captures: { veh_id: $.data.id }
            - call: "POST /shuttle-runs"
              payload: { trip_id: "${trip_id}", shuttle_vehicle_id: "${veh_id}", direction: "TO_PUT_IN", depart_time: "2026-08-12T07:00:00Z", arrive_time: "2026-08-12T08:00:00Z" }
              as: OutfitterManager
              captures: { run_id: $.data.id }
          trigger:
            - call: "POST /shuttle-runs/${run_id}/cancel"
              payload: {}
              as: OutfitterManager
              captures: { st: $.data.status }
          assert:
            - "ShuttleRun.${run_id}.status == CANCELLED"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: flow_band_safe_upper_bound_inclusive_keeps_trip_open
        claim_type: Correct Result
        grounds: ["calculations.flow_safety_band", "entities.RiverConditionReading.fields.resulting_band"]
        distinguishing_aspect: "flow_cfs == safe_flow_max (3000) classifies SAFE (inclusive upper), leaving an OPEN trip OPEN — a boundary metric distinct from the ratio and weight boundaries in §1.8."
        test_recipe:
          setup: ["An OPEN trip (1 guide) with safe_flow_max=3000."]
          setup_api_calls:
            - call: "POST /trips"
              payload: { river_name: "Flow", difficulty_class: "CLASS_III", trip_date: "2026-08-13T09:00:00Z", end_time: "2026-08-13T15:00:00Z", put_in_location: "A", take_out_location: "B", max_capacity: 12, guide_ratio_max: 6, base_rate_cents: 12000, safe_flow_min: 800, safe_flow_max: 3000, marginal_flow_max: 4000 }
              as: OutfitterManager
              captures: { trip_id: $.data.id }
            - call: "POST /guides"
              payload: { full_name: "G", max_class: "CLASS_III" }
              as: OutfitterManager
              captures: { guide_id: $.data.id }
            - call: "POST /guide-assignments"
              payload: { trip_id: "${trip_id}", guide_id: "${guide_id}", role: "LEAD" }
              as: OutfitterManager
            - call: "POST /trips/${trip_id}/open"
              payload: {}
              as: OutfitterManager
          trigger:
            - call: "POST /condition-readings"
              payload: { trip_id: "${trip_id}", flow_cfs: 3000, reading_time: "2026-08-13T07:00:00Z" }
              as: SafetyOfficer
              captures: { band: $.data.resulting_band }
          assert:
            - "RiverConditionReading.resulting_band == SAFE"
            - "RiverTrip.${trip_id}.status == OPEN"

      - name: group_discount_tier_boundary_at_party_four
        claim_type: Constants Applied
        grounds: ["calculations.group_discount_pct", "calculations.reservation_estimated_total"]
        distinguishing_aspect: "party_size=4 selects the 10% tier: estimated_total = round(12000*4*0.90) = 43200 (whereas party_size=3 would be 36000 at 0%)."
        test_recipe:
          setup: ["A trip with base_rate_cents=12000."]
          setup_api_calls:
            - call: "POST /trips"
              payload: { river_name: "Tier", difficulty_class: "CLASS_II", trip_date: "2026-08-14T09:00:00Z", end_time: "2026-08-14T15:00:00Z", put_in_location: "A", take_out_location: "B", max_capacity: 12, guide_ratio_max: 6, base_rate_cents: 12000, safe_flow_min: 800, safe_flow_max: 3000, marginal_flow_max: 4000 }
              as: OutfitterManager
              captures: { trip_id: $.data.id, trip_v: $.data.version }
          trigger:
            - call: "POST /reservations"
              payload: { trip_id: "${trip_id}", booking_type: "GROUP", party_size: 4, deposit_cents: 11000, expected_trip_version: "${trip_v}" }
              as: Reservationist
              captures: { res_id: $.data.id, est: $.data.estimated_total_cents }
          assert:
            - "Reservation.${res_id}.estimated_total_cents == 43200"

      - name: deposit_at_exact_required_threshold_accepted
        claim_type: Correct Result
        grounds: ["state_machines.Reservation.UNPAID_to_DEPOSIT_PAID", "validations[priority=8]"]
        distinguishing_aspect: "deposit_cents exactly equal to round(estimated_total*0.25) (3000 for a 12000 estimate) is accepted (>=, not >): pay-deposit succeeds."
        test_recipe:
          setup: ["A reservation with estimated_total 12000 and deposit_cents=3000 (exactly 25%)."]
          setup_api_calls:
            - call: "POST /trips"
              payload: { river_name: "Exact", difficulty_class: "CLASS_II", trip_date: "2026-08-15T09:00:00Z", end_time: "2026-08-15T15:00:00Z", put_in_location: "A", take_out_location: "B", max_capacity: 12, guide_ratio_max: 6, base_rate_cents: 12000, safe_flow_min: 800, safe_flow_max: 3000, marginal_flow_max: 4000 }
              as: OutfitterManager
              captures: { trip_id: $.data.id, trip_v: $.data.version }
            - call: "POST /reservations"
              payload: { trip_id: "${trip_id}", booking_type: "GROUP", party_size: 1, deposit_cents: 3000, expected_trip_version: "${trip_v}" }
              as: Reservationist
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /reservations/${res_id}/pay-deposit"
              payload: {}
              as: Reservationist
              captures: { ps: $.data.payment_status }
          assert:
            - "HTTP status == 200"
            - "Reservation.${res_id}.payment_status == DEPOSIT_PAID"

      - name: flow_marginal_moves_trip_to_weather_hold
        claim_type: Correct Result
        grounds: ["calculations.flow_safety_band", "state_machines.RiverTrip.OPEN_to_WEATHER_HOLD"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / confirm_blocked_when_trip_in_weather_hold
          rationale: "The MARGINAL->WEATHER_HOLD transition is set up and asserted (trip status == WEATHER_HOLD) inside that §1.8 instance."

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: list_trips_missing_auth_header_returns_401
        claim_type: Violation → Error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_AUTH]"]
        distinguishing_aspect: "A request with no X-User-Role / X-User-ID headers returns 401 ERR_MISSING_AUTH."
        test_recipe:
          setup: ["Empty DB; request sent with no auth headers."]
          setup_api_calls: []
          trigger:
            - call: "GET /trips"
              payload: {}
              as: OutfitterManager
              captures: { err: $.data.error_id }
          assert:
            - "With auth headers omitted, HTTP status == 401"
            - "response.data.error_id == ERR_MISSING_AUTH"

      - name: pay_deposit_below_required_returns_deposit_too_low
