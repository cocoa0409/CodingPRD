# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_3313 — exclusive dealer distribution & color system licensing
# Breadth probe: claims §1.8 does not already exercise. YAML anchors factor
# the repeated region/system/dealer-onboarding setup chains.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: create_region_returns_declared_fields_and_system_counters
        claim_type: Creation
        grounds:
          - entities.Region
          - endpoints.POST_/dealer-network/regions
        distinguishing_aspect: "POST /regions with the four required inputs returns 201 with server-minted id/created_at/updated_at, version 1, and both computed counters at 0."
        test_recipe:
          setup: ["Logical clock at default 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /dealer-network/regions"
              payload: { code: "NE", name: "Northeast", territory_radius_miles: 25, exclusivity_block_threshold_pct: 15 }
              as: PlatformAdmin
              captures: { region_id: $.data.id, region_v: $.data.version }
          assert:
            - "response_type is object and Region.${region_id}.code == \"NE\""
            - "region_v == 1 and Region.${region_id}.active_dealer_count == 0 and pending_application_count == 0"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: create_equipment_missing_serial_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.EquipmentUnit.fields.serial_no
          - validations[priority=22]
        distinguishing_aspect: "Omitting the required serial_no on equipment install yields ERR_INVALID_REQUEST while all other fields are valid."
        test_recipe:
          setup:
            - "Region, system, and an ONBOARDING dealer exist."
          setup_api_calls:
            - &k_clock
              call: "POST /dealer-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { clock_now: $.data.current_utc }
            - &k_region
              call: "POST /dealer-network/regions"
              payload: { code: "NE", name: "Northeast", territory_radius_miles: 25, exclusivity_block_threshold_pct: 15 }
              as: PlatformAdmin
              captures: { region_id: $.data.id }
            - &k_sys
              call: "POST /dealer-network/colorant-systems"
              payload: { code: "G25", name: "Gen-25 Colorant System", generation: 25, annual_license_fee_cents: 2500000, min_initial_inventory_units: 40 }
              as: ColorLabAdmin
              captures: { system_id: $.data.id }
            - &k_dealer
              call: "POST /dealer-network/dealers"
              payload: { region_id: "${region_id}", legal_name: "Beacon Paint Co", latitude: 42.0, longitude: -71.0, exclusivity_attested_on: "2026-08-01T00:00:00Z", branding_compliant: true, coop_accrual_rate: 0.02 }
              as: RegionManager
              captures: { dealer_id: $.data.id }
            - &k_onboard
              call: "POST /dealer-network/dealers/${dealer_id}/begin-onboarding"
              payload: {}
              as: RegionManager
          trigger:
            - call: "POST /dealer-network/equipment"
              payload: { dealer_id: "${dealer_id}", model: "Corob D600", colorant_system_id: "${system_id}", installed_on: "${clock_now}" }
              as: EquipmentTech
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_INVALID_REQUEST\" and no EquipmentUnit is created"

      - name: dealer_default_channel_posture_and_zero_counters
        claim_type: Defaults
        grounds:
          - entities.Dealer.fields.channel_posture
          - entities.Dealer.fields.bigbox_share_pct
        distinguishing_aspect: "A freshly created dealer defaults to channel_posture INDEPENDENT_ONLY, bigbox_share_pct 0, coop balances 0, inventory_minimum_met false."
        test_recipe:
          setup: ["Region exists; clock default."]
          setup_api_calls: [*k_clock, *k_region]
          trigger:
            - call: "POST /dealer-network/dealers"
              payload: { region_id: "${region_id}", legal_name: "Beacon Paint Co", latitude: 42.0, longitude: -71.0, exclusivity_attested_on: "2026-08-01T00:00:00Z", coop_accrual_rate: 0.02 }
              as: RegionManager
              captures: { posture: $.data.channel_posture, share: $.data.bigbox_share_pct, bal: $.data.coop_balance_cents, inv: $.data.inventory_minimum_met, branding: $.data.branding_compliant }
          assert:
            - "posture == \"INDEPENDENT_ONLY\" and share == 0 and bal == 0 and inv == false"
            - "branding == false (default applied when omitted)"

      - name: get_nonexistent_dealer_returns_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET on a random UUID yields ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /dealer-network/dealers/00000000-0000-4000-8000-000000000000"
              as: RegionManager
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_NOT_FOUND\" with http 404"

      - name: formula_code_unique_per_line_but_reusable_across_lines
        claim_type: Type Constraints
        grounds:
          - validations[priority=10]
          - entities.ColorFormula.fields.code
        distinguishing_aspect: "Duplicate formula code within the SAME product line yields ERR_DUPLICATE; the same code under a DIFFERENT line succeeds."
        test_recipe:
          setup: ["Region, system, two lines L1/L2, formula F under L1."]
          setup_api_calls:
            - *k_clock
            - *k_region
            - *k_sys
            - call: "POST /dealer-network/product-lines"
              payload: { colorant_system_id: "${system_id}", code: "L1", name: "Line One", channel_class: "SPECIALTY", base_price_cents: 100 }
              as: ColorLabAdmin
              captures: { l1: $.data.id }
            - call: "POST /dealer-network/product-lines"
              payload: { colorant_system_id: "${system_id}", code: "L2", name: "Line Two", channel_class: "SPECIALTY", base_price_cents: 100 }
              as: ColorLabAdmin
              captures: { l2: $.data.id }
            - call: "POST /dealer-network/formulas"
              payload: { product_line_id: "${l1}", code: "F", display_name: "Gray", effective_from: "2026-08-15T00:00:00Z" }
              as: ColorLabAdmin
          trigger:
            - call: "POST /dealer-network/formulas"
              payload: { product_line_id: "${l1}", code: "F", display_name: "Gray Dup", effective_from: "2026-08-15T00:00:00Z" }
              as: ColorLabAdmin
              captures: { dup_err: $.data.error_id }
            - call: "POST /dealer-network/formulas"
              payload: { product_line_id: "${l2}", code: "F", display_name: "Gray Other Line", effective_from: "2026-08-15T00:00:00Z" }
              as: ColorLabAdmin
              captures: { ok_id: $.data.id }
          assert:
            - "dup_err == \"ERR_DUPLICATE\""
            - "the cross-line reuse succeeded and ColorFormula.${ok_id}.code == \"F\""

      - name: rematch_task_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.RematchTask
        distinguishing_aspect: "RematchTask carries common_fields: false — its read payload exposes id and created_at but no version or updated_at, and no update endpoint exists."
        test_recipe:
          setup:
            - "An EFFECTIVE formulation change has produced a PENDING RematchTask (see §1.8 formulation_change_branching_cancel_vs_complete_paths for the chain)."
          setup_api_calls:
            - *k_clock
            - *k_region
            - *k_sys
            - &k_line_s1
              call: "POST /dealer-network/product-lines"
              payload: { colorant_system_id: "${system_id}", code: "S1", name: "Specialty One", channel_class: "SPECIALTY", base_price_cents: 100 }
              as: ColorLabAdmin
              captures: { line_id: $.data.id }
            - call: "POST /dealer-network/formulas"
              payload: { product_line_id: "${line_id}", code: "F1", display_name: "Harbor Gray", effective_from: "2026-08-15T00:00:00Z" }
              as: ColorLabAdmin
            - *k_dealer
            - *k_onboard
            - &k_equip
              call: "POST /dealer-network/equipment"
              payload: { dealer_id: "${dealer_id}", serial_no: "SN-100", model: "Corob D600", colorant_system_id: "${system_id}", installed_on: "${clock_now}" }
              as: EquipmentTech
              captures: { equip_id: $.data.id }
            - &k_lic
              call: "POST /dealer-network/licenses"
              payload: { dealer_id: "${dealer_id}", colorant_system_id: "${system_id}" }
              as: RegionManager
              captures: { lic_id: $.data.id }
            - &k_pass1
              call: "POST /dealer-network/equipment/${equip_id}/calibrations"
              payload: { performed_on: "${clock_now}", result: "PASS" }
              as: EquipmentTech
            - &k_stock
              call: "POST /dealer-network/orders"
              payload: { dealer_id: "${dealer_id}", product_line_id: "${line_id}", units: 40, purpose: "INITIAL_STOCK" }
              as: DealerPrincipal
              as_user_id: "${dealer_id}"
              captures: { stock_order_id: $.data.id }
            - &k_oapp
              call: "POST /dealer-network/orders/${stock_order_id}/approve"
              payload: {}
              as: RegionManager
            - &k_oful
              call: "POST /dealer-network/orders/${stock_order_id}/fulfill"
              payload: {}
              as: RegionManager
            - &k_oinv
              call: "POST /dealer-network/orders/${stock_order_id}/invoice"
              payload: {}
              as: RegionManager
            - &k_act
              call: "POST /dealer-network/dealers/${dealer_id}/activate"
              payload: {}
              as: RegionManager
            - &k_ch
              call: "POST /dealer-network/formulation-changes"
              payload: { product_line_id: "${line_id}", title: "Binder swap", reason: "resin shortage", effective_date: "2026-09-02T00:00:00Z" }
              as: ColorLabAdmin
              captures: { ch_id: $.data.id, ch_v: $.data.version }
            - &k_chann
              call: "POST /dealer-network/formulation-changes/${ch_id}/announce"
              payload: { expected_change_version: "${ch_v}" }
              as: ColorLabAdmin
            - &k_clock2
              call: "POST /dealer-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - &k_cheff
              call: "POST /dealer-network/formulation-changes/${ch_id}/make-effective"
              payload: {}
              as: ColorLabAdmin
          trigger:
            - call: "GET /dealer-network/rematch-tasks?formulation_change_id=${ch_id}"
              as: ColorLabAdmin
              captures: { task0: "$.data[0].status" }
          assert:
            - "task0 == \"PENDING\" and the RematchTask payload carries id and created_at but no version or updated_at field"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: terminate_terminal_lockdown_blocks_suspend
        claim_type: invalid_transition
        grounds:
          - state_machines.Dealer
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Suspend on a TERMINATED dealer is rejected with ERR_INVALID_STATE; terminal states accept no further transitions."
        test_recipe:
          setup:
            - "Fully onboarded ACTIVE dealer (standard onboarding chain), then terminated."
          setup_api_calls:
            - *k_clock
            - *k_region
            - *k_sys
            - *k_line_s1
            - *k_dealer
            - *k_onboard
            - *k_equip
            - *k_lic
            - *k_pass1
            - *k_stock
            - *k_oapp
            - *k_oful
            - *k_oinv
            - *k_act
            - call: "POST /dealer-network/dealers/${dealer_id}/terminate"
              payload: {}
              as: ChannelDirector
          trigger:
            - call: "POST /dealer-network/dealers/${dealer_id}/suspend"
              payload: {}
              as: ChannelDirector
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_INVALID_STATE\""

      - name: initial_stock_order_creates_in_submitted
        claim_type: Initial State
        grounds:
          - state_machines.DealerOrder
        distinguishing_aspect: "New orders start SUBMITTED with computed unit_price and invoice populated from the line's list price."
        test_recipe:
          setup: ["Region, system, SPECIALTY line S1, ONBOARDING dealer."]
          setup_api_calls: [*k_clock, *k_region, *k_sys, *k_line_s1, *k_dealer, *k_onboard]
          trigger:
            - call: "POST /dealer-network/orders"
              payload: { dealer_id: "${dealer_id}", product_line_id: "${line_id}", units: 40, purpose: "INITIAL_STOCK" }
              as: DealerPrincipal
              as_user_id: "${dealer_id}"
              captures: { st: $.data.status, up: $.data.unit_price_cents, inv: $.data.invoice_cents }
          assert:
            - "st == \"SUBMITTED\" and up == 100 and inv == 4000"

      - name: double_cancel_order_is_idempotency_error
        claim_type: Idempotency
        grounds:
          - state_machines.DealerOrder.SUBMITTED_to_CANCELLED
        distinguishing_aspect: "Cancelling the same SUBMITTED order twice: the first succeeds, the second fails ERR_INVALID_STATE — no silent no-op."
        test_recipe:
          setup: ["Region, system, SPECIALTY line S1, ONBOARDING dealer, one SUBMITTED order."]
          setup_api_calls:
            - *k_clock
            - *k_region
            - *k_sys
            - *k_line_s1
            - *k_dealer
            - *k_onboard
            - *k_stock
          trigger:
            - call: "POST /dealer-network/orders/${stock_order_id}/cancel"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dealer_id}"
              captures: { first: $.data.status }
            - call: "POST /dealer-network/orders/${stock_order_id}/cancel"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dealer_id}"
              captures: { err: $.data.error_id }
          assert:
            - "first == \"CANCELLED\" and err == \"ERR_INVALID_STATE\""

      - name: formulation_change_auto_completes_when_last_task_done
        claim_type: excluded_because_stub
        grounds: ["state_machines.FormulationChange.EFFECTIVE_to_COMPLETED"]
        excluded_because:
          difficulty_instance: non_linear_state_machine / formulation_change_branching_cancel_vs_complete_paths
          rationale: "Asserted as ch_go_final == COMPLETED in the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:

      - name: bigbox_share_rounding_and_empty_denominator
        claim_type: Correct Result
        grounds:
          - calculations.bigbox_share_pct
        distinguishing_aspect: "With only a 1000-cent BIGBOX event and zero INDEPENDENT sales the share is exactly 100.0 (BLOCKED); with no events at all the share is 0 rather than a divide-by-zero."
        test_recipe:
          setup: ["Fully onboarded ACTIVE dealer; no channel events yet."]
          setup_api_calls:
            - *k_clock
            - *k_region
            - *k_sys
            - *k_line_s1
            - *k_dealer
            - *k_onboard
            - *k_equip
            - *k_lic
            - *k_pass1
            - *k_stock
            - *k_oapp
            - *k_oful
            - *k_oinv
            - *k_act
            - call: "GET /dealer-network/dealers/${dealer_id}"
              as: RegionManager
              captures: { share0: $.data.bigbox_share_pct }
          trigger:
            - call: "POST /dealer-network/dealers/${dealer_id}/channel-events"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z", channel: "BIGBOX", sales_cents: 1000 }
              as: ChannelDirector
            - call: "GET /dealer-network/dealers/${dealer_id}"
              as: RegionManager
              captures: { share1: $.data.bigbox_share_pct, posture1: $.data.channel_posture }
          assert:
            - "share0 == 0 (empty denominator yields 0, not an error)"
            - "share1 == 100.0 and posture1 == \"BLOCKED\" (100.0 >= threshold 15)"

      - name: territory_distance_empty_candidate_set
        claim_type: Correct Result
        grounds:
          - calculations.territory_distance
        distinguishing_aspect: "Submitting the first application in an empty region yields distance_to_nearest_miles null and territory_conflict false."
        test_recipe:
          setup: ["Region exists; no dealers."]
          setup_api_calls: [*k_clock, *k_region]
          trigger:
            - call: "POST /dealer-network/applications"
              payload: { region_id: "${region_id}", legal_name: "First Paint", latitude: 42.0, longitude: -71.0, exclusivity_attested_on: "2026-08-01T00:00:00Z", coop_accrual_rate: 0.02 }
              as: RegionManager
              captures: { app_id: $.data.id }
            - call: "POST /dealer-network/applications/${app_id}/submit"
              payload: {}
              as: RegionManager
              captures: { dist: $.data.distance_to_nearest_miles, conflict: $.data.territory_conflict }
          assert:
            - "dist == null and conflict == false"

      - name: coop_accrual_rounding_half_up
        claim_type: Precision
        grounds:
          - calculations.coop_accrual
        distinguishing_aspect: "Invoice 4125 cents at accrual rate 0.02 accrues round_half_up(82.5) == 83 cents, pinning the half-up rounding."
        test_recipe:
          setup: ["Fully onboarded ACTIVE dealer with accrual 0.02 (onboarded via a 25-unit INITIAL_STOCK meeting the system's minimum of 20); the measured order is a 25-unit RESTOCK on the 165-cent line."]
          setup_api_calls:
            - *k_clock
            - *k_region
            - call: "POST /dealer-network/colorant-systems"
              payload: { code: "G26", name: "Gen-26", generation: 26, annual_license_fee_cents: 1000000, min_initial_inventory_units: 20 }
              as: ColorLabAdmin
              captures: { system_id: $.data.id }
            - call: "POST /dealer-network/product-lines"
              payload: { colorant_system_id: "${system_id}", code: "S165", name: "Specialty 165", channel_class: "SPECIALTY", base_price_cents: 165 }
              as: ColorLabAdmin
              captures: { line_id: $.data.id }
            - *k_dealer
            - *k_onboard
            - *k_equip
            - *k_lic
            - *k_pass1
            - call: "POST /dealer-network/orders"
              payload: { dealer_id: "${dealer_id}", product_line_id: "${line_id}", units: 25, purpose: "INITIAL_STOCK" }
              as: DealerPrincipal
              as_user_id: "${dealer_id}"
              captures: { stock_order_id: $.data.id }
            - *k_oapp
            - *k_oful
            - *k_oinv
            - *k_act
          trigger:
            - call: "POST /dealer-network/orders"
              payload: { dealer_id: "${dealer_id}", product_line_id: "${line_id}", units: 25, purpose: "RESTOCK" }
              as: DealerPrincipal
              as_user_id: "${dealer_id}"
              captures: { oid: $.data.id, inv: $.data.invoice_cents }
            - call: "POST /dealer-network/orders/${oid}/approve"
              payload: {}
              as: RegionManager
            - call: "POST /dealer-network/orders/${oid}/fulfill"
              payload: {}
              as: RegionManager
            - call: "POST /dealer-network/orders/${oid}/invoice"
              payload: {}
              as: RegionManager
            - call: "POST /dealer-network/orders/${oid}/pay"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dealer_id}"
              captures: { accr: $.data.coop_accrued_cents }
          assert:
            - "inv == 4125 and accr == 83 (round_half_up of exactly 82.5)"

      - name: rematch_fanout_skips_suspended_licenses_and_archived_formulas
        claim_type: Input Set Filtering
        grounds:
          - calculations.rematch_wave_fanout
        distinguishing_aspect: "Fan-out includes only licenses in {ACTIVE, SUSPENDED} and formulas in ACTIVE: a PENDING-licensed dealer gets no task, and an ARCHIVED formula gets none."
        test_recipe:
          setup:
            - "System, SPECIALTY line with formula F ACTIVE. Dealer D1 fully ACTIVE with ACTIVE license. Dealer D2 ONBOARDING with license PENDING (unit installed, never calibrated). Change goes EFFECTIVE."
          setup_api_calls:
            - *k_clock
            - *k_region
            - *k_sys
            - *k_line_s1
            - call: "POST /dealer-network/formulas"
              payload: { product_line_id: "${line_id}", code: "F1", display_name: "Harbor Gray", effective_from: "2026-08-15T00:00:00Z" }
              as: ColorLabAdmin
            - *k_dealer
            - *k_onboard
            - *k_equip
            - *k_lic
            - *k_pass1
            - *k_stock
            - *k_oapp
            - *k_oful
            - *k_oinv
            - *k_act
            - call: "POST /dealer-network/dealers"
              payload: { region_id: "${region_id}", legal_name: "Second Paint Co", latitude: 43.0, longitude: -72.0, exclusivity_attested_on: "2026-08-01T00:00:00Z", coop_accrual_rate: 0.02 }
              as: RegionManager
              captures: { dealer2_id: $.data.id }
            - call: "POST /dealer-network/dealers/${dealer2_id}/begin-onboarding"
              payload: {}
              as: RegionManager
            - call: "POST /dealer-network/equipment"
              payload: { dealer_id: "${dealer2_id}", serial_no: "SN-200", model: "Corob D600", colorant_system_id: "${system_id}", installed_on: "${clock_now}" }
              as: EquipmentTech
            - call: "POST /dealer-network/licenses"
              payload: { dealer_id: "${dealer2_id}", colorant_system_id: "${system_id}" }
              as: RegionManager
            - *k_ch
            - *k_chann
            - *k_clock2
          trigger:
            - *k_cheff
            - call: "GET /dealer-network/rematch-tasks?formulation_change_id=${ch_id}"
              as: ColorLabAdmin
              captures: { task0_dealer: "$.data[0].dealer_id" }
          assert:
            - "the change produced exactly 1 task and task0_dealer == ${dealer_id} (PENDING-licensed dealer2 excluded)"

  # ===========================================================================
  - section: validations
    instances:

      - name: authenticate_before_any_business_check
        claim_type: Priority Ordering
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with no X-User-Role header fails ERR_UNAUTHENTICATED even when the path id does not exist (auth precedes existence)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /dealer-network/dealers/00000000-0000-4000-8000-000000000000"
              as: ""
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_UNAUTHENTICATED\" with http 401"

      - name: attestation_exactly_366_days_is_fresh_367_is_stale
        claim_type: Violation → Error
        grounds:
          - validations[priority=13]
          - errors[ERR_ATTESTATION_STALE]
        distinguishing_aspect: "Attestation dated 2025-09-01 is exactly 366 days before the 2026-09-01 clock (fresh, approve succeeds); dated 2025-08-31 it is 367 days (ERR_ATTESTATION_STALE) — both applications SUBMITTED in an empty region."
        test_recipe:
          setup: ["Region exists; two applications submitted, one with a 366-day-old attestation, one with 367."]
          setup_api_calls:
            - *k_clock
            - *k_region
            - call: "POST /dealer-network/applications"
              payload: { region_id: "${region_id}", legal_name: "Fresh Attest Co", latitude: 42.0, longitude: -71.0, exclusivity_attested_on: "2025-09-01T00:00:00Z", coop_accrual_rate: 0.02 }
              as: RegionManager
              captures: { app_fresh: $.data.id, app_fresh_v: $.data.version }
            - call: "POST /dealer-network/applications/${app_fresh}/submit"
              payload: {}
              as: RegionManager
              captures: { app_fresh_v2: $.data.version }
            - call: "POST /dealer-network/applications"
              payload: { region_id: "${region_id}", legal_name: "Stale Attest Co", latitude: 44.0, longitude: -73.0, exclusivity_attested_on: "2025-08-31T00:00:00Z", coop_accrual_rate: 0.02 }
              as: RegionManager
              captures: { app_stale: $.data.id, app_stale_v: $.data.version }
            - call: "POST /dealer-network/applications/${app_stale}/submit"
              payload: {}
