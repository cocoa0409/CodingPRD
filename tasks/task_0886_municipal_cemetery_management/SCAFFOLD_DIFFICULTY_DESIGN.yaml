            - { call: "POST /cemetery-mgmt/decedents", payload: { full_name: "Dec A", date_of_death: "2026-04-01" }, as: Registrar, captures: { dec1_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/decedents", payload: { full_name: "Dec B", date_of_death: "2026-04-02" }, as: Registrar, captures: { dec2_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/interments", payload: { plot_id: "${plot_id}", decedent_id: "${dec1_id}", deed_id: "${deed_id}", interment_type: "BURIAL", depth_position: 1, scheduled_date: "2026-06-01", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }, as: Registrar, captures: { int1_id: "$.data.id" } }
          trigger:
            - { call: "POST /cemetery-mgmt/interments", payload: { plot_id: "${plot_id}", decedent_id: "${dec2_id}", deed_id: "${deed_id}", interment_type: "ENTOMBMENT", depth_position: 2, scheduled_date: "2026-06-01", scheduled_start: "2026-06-01T14:00:00Z", scheduled_end: "2026-06-01T16:00:00Z" }, as: Registrar, captures: { err: "$.data.error_id" } }
          assert:
            - "data.error_id == ERR_PLOT_DOUBLE_BOOKED"

      - name: crew_time_window_buffer_collision
        grounds:
          - calculations.crew_time_window_overlap
          - entities.Cemetery.fields.crew_team_count
          - errors[ERR_CREW_UNAVAILABLE]
        distinguishing_aspect: |
          Cemetery crew resource, HALF-OPEN buffered interval: with crew_team_count=1, two
          interments on DIFFERENT plots the same day whose windows are 30 minutes apart (< the
          60-minute buffer) collide with ERR_CREW_UNAVAILABLE — different resource and interval
          semantics than the plot whole-day rule.
        test_recipe:
          setup:
            - "Two ISSUED-deed GRAVE plots in a single-crew cemetery; interment on plot1 09:00-11:00 on 2026-06-01 already SCHEDULED."
          setup_api_calls:
            - { call: "POST /cemetery-mgmt/cemeteries", payload: { name: "Oakwood", timezone: "UTC", crew_team_count: 1 }, as: CemeteryDirector, captures: { cem_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Registrar }
            - { call: "POST /cemetery-mgmt/plots", payload: { cemetery_id: "${cem_id}", section_code: "A", row: "1", plot_number: "1", gis_lat: 1.0, gis_lng: 2.0, plot_type: "GRAVE", interment_capacity: 2 }, as: Registrar, captures: { plot1_id: "$.data.id", plot1_v: "$.data.version" } }
            - { call: "POST /cemetery-mgmt/plots", payload: { cemetery_id: "${cem_id}", section_code: "A", row: "1", plot_number: "2", gis_lat: 1.0, gis_lng: 2.1, plot_type: "GRAVE", interment_capacity: 2 }, as: Registrar, captures: { plot2_id: "$.data.id", plot2_v: "$.data.version" } }
            - { call: "POST /cemetery-mgmt/holders", payload: { full_name: "H One", email: "h1@x.com", phone: "1" }, as: Registrar, captures: { holder_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/deeds", payload: { plot_id: "${plot1_id}", holder_id: "${holder_id}", purchase_price_cents: 1000000, sale_type: "NEW_SALE", expected_plot_version: "${plot1_v}" }, as: Registrar, captures: { deed1_id: "$.data.id", saleInv1_id: "$.data.sale_invoice_id" } }
            - { call: "POST /cemetery-mgmt/payments", payload: { invoice_id: "${saleInv1_id}", amount_cents: 1222500, method: "CARD" }, as: FinanceOfficer }
            - { call: "POST /cemetery-mgmt/deeds", payload: { plot_id: "${plot2_id}", holder_id: "${holder_id}", purchase_price_cents: 1000000, sale_type: "NEW_SALE", expected_plot_version: "${plot2_v}" }, as: Registrar, captures: { deed2_id: "$.data.id", saleInv2_id: "$.data.sale_invoice_id" } }
            - { call: "POST /cemetery-mgmt/payments", payload: { invoice_id: "${saleInv2_id}", amount_cents: 1222500, method: "CARD" }, as: FinanceOfficer }
            - { call: "POST /cemetery-mgmt/decedents", payload: { full_name: "Dec A", date_of_death: "2026-04-01" }, as: Registrar, captures: { dec1_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/decedents", payload: { full_name: "Dec B", date_of_death: "2026-04-02" }, as: Registrar, captures: { dec2_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/interments", payload: { plot_id: "${plot1_id}", decedent_id: "${dec1_id}", deed_id: "${deed1_id}", interment_type: "BURIAL", depth_position: 1, scheduled_date: "2026-06-01", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }, as: Registrar, captures: { int1_id: "$.data.id" } }
          trigger:
            - { call: "POST /cemetery-mgmt/interments", payload: { plot_id: "${plot2_id}", decedent_id: "${dec2_id}", deed_id: "${deed2_id}", interment_type: "BURIAL", depth_position: 1, scheduled_date: "2026-06-01", scheduled_start: "2026-06-01T11:30:00Z", scheduled_end: "2026-06-01T13:00:00Z" }, as: Registrar, captures: { err: "$.data.error_id" } }
          assert:
            - "data.error_id == ERR_CREW_UNAVAILABLE"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: perpetual_care_ledger_balance_conserved
        grounds:
          - calculations.perpetual_care_balance
          - entities.Cemetery.fields.perpetual_care_fund_balance_cents
          - entities.CareFundEntry.fields.entry_type
        distinguishing_aspect: |
          Money conserved: Cemetery.perpetual_care_fund_balance_cents always equals
          SUM(CONTRIBUTION+INTEREST) - SUM(DISBURSEMENT); after a 150000 contribution, +10000
          INTEREST, and a compensating 40000 DISBURSEMENT the balance is exactly 120000.
        test_recipe:
          setup:
            - "Cemetery fund balance 150000 from one NEW_SALE contribution."
          setup_api_calls:
            - { call: "POST /cemetery-mgmt/cemeteries", payload: { name: "Oakwood", timezone: "UTC", crew_team_count: 1 }, as: CemeteryDirector, captures: { cem_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/plots", payload: { cemetery_id: "${cem_id}", section_code: "A", row: "1", plot_number: "1", gis_lat: 1.0, gis_lng: 2.0, plot_type: "GRAVE", interment_capacity: 2 }, as: Registrar, captures: { plot_id: "$.data.id", plot_v: "$.data.version" } }
            - { call: "POST /cemetery-mgmt/holders", payload: { full_name: "H One", email: "h1@x.com", phone: "1" }, as: Registrar, captures: { holder_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/deeds", payload: { plot_id: "${plot_id}", holder_id: "${holder_id}", purchase_price_cents: 1000000, sale_type: "NEW_SALE", expected_plot_version: "${plot_v}" }, as: Registrar, captures: { deed_id: "$.data.id", saleInv_id: "$.data.sale_invoice_id" } }
            - { call: "POST /cemetery-mgmt/payments", payload: { invoice_id: "${saleInv_id}", amount_cents: 1222500, method: "CARD" }, as: FinanceOfficer }
            - { call: "POST /cemetery-mgmt/care-fund-entries", payload: { cemetery_id: "${cem_id}", entry_type: "INTEREST", amount_cents: 10000, note: "q2 interest" }, as: FinanceOfficer }
          trigger:
            - { call: "POST /cemetery-mgmt/care-fund-entries", payload: { cemetery_id: "${cem_id}", entry_type: "DISBURSEMENT", amount_cents: 40000, source_deed_id: "${deed_id}", note: "landscaping" }, as: FinanceOfficer }
          assert:
            - "Cemetery.${cem_id}.perpetual_care_fund_balance_cents == 120000"

      - name: plot_occupancy_count_conserved
        grounds:
          - calculations.plot_occupancy
          - entities.Plot.fields.interments_used
          - state_machines.Interment.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Occupancy count conserved: Plot.interments_used equals COUNT of active interments; two
          schedules take it to 2 and a compensating cancel restores it to exactly 1 (a count, not a
          money quantity).
        test_recipe:
          setup:
            - "GRAVE plot capacity 2 with an ISSUED deed; two interments SCHEDULED on distinct dates."
          setup_api_calls:
            - { call: "POST /cemetery-mgmt/cemeteries", payload: { name: "Oakwood", timezone: "UTC", crew_team_count: 2 }, as: CemeteryDirector, captures: { cem_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Registrar }
            - { call: "POST /cemetery-mgmt/plots", payload: { cemetery_id: "${cem_id}", section_code: "A", row: "1", plot_number: "1", gis_lat: 1.0, gis_lng: 2.0, plot_type: "GRAVE", interment_capacity: 2 }, as: Registrar, captures: { plot_id: "$.data.id", plot_v: "$.data.version" } }
            - { call: "POST /cemetery-mgmt/holders", payload: { full_name: "H One", email: "h1@x.com", phone: "1" }, as: Registrar, captures: { holder_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/deeds", payload: { plot_id: "${plot_id}", holder_id: "${holder_id}", purchase_price_cents: 1000000, sale_type: "NEW_SALE", expected_plot_version: "${plot_v}" }, as: Registrar, captures: { deed_id: "$.data.id", saleInv_id: "$.data.sale_invoice_id" } }
            - { call: "POST /cemetery-mgmt/payments", payload: { invoice_id: "${saleInv_id}", amount_cents: 1222500, method: "CARD" }, as: FinanceOfficer }
            - { call: "POST /cemetery-mgmt/decedents", payload: { full_name: "Dec A", date_of_death: "2026-04-01" }, as: Registrar, captures: { dec1_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/decedents", payload: { full_name: "Dec B", date_of_death: "2026-04-02" }, as: Registrar, captures: { dec2_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/interments", payload: { plot_id: "${plot_id}", decedent_id: "${dec1_id}", deed_id: "${deed_id}", interment_type: "BURIAL", depth_position: 1, scheduled_date: "2026-06-01", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }, as: Registrar, captures: { int1_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/interments", payload: { plot_id: "${plot_id}", decedent_id: "${dec2_id}", deed_id: "${deed_id}", interment_type: "ENTOMBMENT", depth_position: 2, scheduled_date: "2026-06-08", scheduled_start: "2026-06-08T09:00:00Z", scheduled_end: "2026-06-08T11:00:00Z" }, as: Registrar, captures: { int2_id: "$.data.id" } }
          trigger:
            - { call: "POST /cemetery-mgmt/interments/${int1_id}/cancel", payload: {}, as: Registrar }
          assert:
            - "Plot.${plot_id}.interments_used == 1"
            - "Interment.${int1_id}.operational_status == CANCELLED"
