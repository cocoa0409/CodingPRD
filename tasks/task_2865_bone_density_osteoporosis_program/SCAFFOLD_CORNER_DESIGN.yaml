        distinguishing_aspect: "Four independent gates guard the equipment-qualification workflow: 29 patients x 2 scans gives 29 degrees of freedom and is refused at 422, a device whose lsc_g_cm2 is still null cannot start a session at all, adjudicating an OPEN event is refused because the verdict does not exist yet, closing with 1 of the 3 required baseline runs is refused, and closing an already PHANTOM_SET_COMPLETE event is refused with the not-open error rather than recomputing."
