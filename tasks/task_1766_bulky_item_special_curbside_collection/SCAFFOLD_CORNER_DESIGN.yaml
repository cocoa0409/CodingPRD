  # =======================================================================
  # Section: cross_cutting_layers
  # =======================================================================
  - section: cross_cutting_layers
    instances:
      - name: version_increments_on_every_mutation
        claim_type: derived_field_reconciliation
        grounds:
          - "entities.PickupRequest"
          - "concurrency_rules[cancel-stale-request]"
        distinguishing_aspect: "Optimistic-concurrency bookkeeping: create v1 -> item-add v2 -> submit v3 -> schedule v4; each mutation including cascaded counter updates increments version by exactly 1."
        test_recipe:
          setup: ["Clock 2026-08-05; Household H ZONE_NORTH; RouteDay R 2026-08-10"]
          setup_api_calls:
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: Dispatcher
            - call: "POST /curbside/households"
              payload: { street_address: "113 Version Vw", service_zone: "ZONE_NORTH" }
              as: Dispatcher
              captures: { hh_id: $.data.id }
            - call: "POST /curbside/route-days"
              payload: { service_zone: "ZONE_NORTH", route_date: "2026-08-10", max_load_units: 40, max_stops: 25 }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /curbside/pickup-requests"
              payload: { household_id: "${hh_id}" }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { req_id: $.data.id, v1: $.data.version }
          trigger:
            - call: "POST /curbside/pickup-requests/${req_id}/items"
              payload: { sequence_no: 1, category: "TIRES", is_oversize: false, preparation_ack: true }
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/pickup-requests/${req_id}/submit"
              payload: {}
              as: Resident
              as_user_id: "${hh_id}"
              captures: { v3: $.data.version }
            - call: "POST /curbside/pickup-requests/${req_id}/schedule"
              payload: { route_day_id: "${rd_id}", expected_route_day_version: "${rd_v}" }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { v4: $.data.version }
          assert:
            - "version at create == 1, after item-add == 2, after submit == 3, after schedule == 4"
            - "RouteDay.${rd_id}.version == 2 after the schedule cascade"

      - name: cascade_chain_schedule_through_route_and_ledger
        claim_type: cascading_side_effects
        grounds:
          - "state_machines.PickupRequest.SUBMITTED_to_SCHEDULED"
          - "calculations.allowance_ledger"
        distinguishing_aspect: "Single schedule call's fan-out verified end-to-end: request state, route counters, allowance ledger, per-item flags, frozen amnesty, quote rewrite, and notification all land atomically."
        test_recipe:
          setup: ["Clock 2026-08-05; Household H ZONE_SOUTH allowance 2; RouteDay R 2026-08-10; SUBMITTED request with 3 STANDARD_FURNITURE items"]
          setup_api_calls:
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: Dispatcher
            - call: "POST /curbside/households"
              payload: { street_address: "115 Cascade Ct", service_zone: "ZONE_SOUTH", annual_allowance_items: 2 }
              as: Dispatcher
              captures: { hh_id: $.data.id }
            - call: "POST /curbside/route-days"
              payload: { service_zone: "ZONE_SOUTH", route_date: "2026-08-10", max_load_units: 40, max_stops: 25 }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /curbside/pickup-requests"
              payload: { household_id: "${hh_id}" }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { req_id: $.data.id }
            - call: "POST /curbside/pickup-requests/${req_id}/items"
              payload: { sequence_no: 1, category: "STANDARD_FURNITURE", is_oversize: false, preparation_ack: true }
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/pickup-requests/${req_id}/items"
              payload: { sequence_no: 2, category: "STANDARD_FURNITURE", is_oversize: false, preparation_ack: true }
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/pickup-requests/${req_id}/items"
              payload: { sequence_no: 3, category: "STANDARD_FURNITURE", is_oversize: false, preparation_ack: true }
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/pickup-requests/${req_id}/submit"
              payload: {}
              as: Resident
              as_user_id: "${hh_id}"
          trigger:
            - call: "POST /curbside/pickup-requests/${req_id}/schedule"
              payload: { route_day_id: "${rd_id}", expected_route_day_version: "${rd_v}" }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { total: $.data.provisional_total_cents }
            - call: "GET /curbside/route-days/${rd_id}"
              as: Dispatcher
              captures: { rd_load: $.data.committed_load_units, rd_stops: $.data.committed_stops }
            - call: "GET /curbside/households/${hh_id}/allowances"
              as: Inspector
              captures: { consumed: $.data.0.items_consumed, over: $.data.0.over_allowance_items }
            - call: "GET /curbside/pickup-requests/${req_id}/items"
              as: Inspector
              captures: { i1: $.data.0.within_allowance, i2: $.data.1.within_allowance, i3: $.data.2.within_allowance, i3_fee: $.data.2.item_fee_cents }
          assert:
            - "RouteDay committed_load_units == 6 and committed_stops == 1"
            - "allowance items_consumed == 2 and over_allowance_items == 1"
            - "items 1,2 within_allowance == true; item 3 within_allowance == false with item_fee_cents == 2713"
            - "provisional_total_cents == 2713"
            - "exactly one SCHEDULE_CONFIRMATION notification exists"

  # =======================================================================
  # Section: consistency_model
  # =======================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_schedule_effects
        claim_type: immediate_consistency
        grounds:
          - "complexity_profile.consistency_model"
        distinguishing_aspect: "Immediate consistency: the schedule response itself carries the recomputed quote and SCHEDULED status; a follow-up GET shows identical values (no eventual lag)."
        test_recipe:
          setup: ["Clock 2026-08-05; Household H ZONE_WEST allowance 4; RouteDay R 2026-08-10; SUBMITTED 1-item MATTRESS request"]
          setup_api_calls:
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: Dispatcher
            - call: "POST /curbside/households"
              payload: { street_address: "117 Immediate Isle", service_zone: "ZONE_WEST" }
              as: Dispatcher
              captures: { hh_id: $.data.id }
            - call: "POST /curbside/route-days"
              payload: { service_zone: "ZONE_WEST", route_date: "2026-08-10", max_load_units: 40, max_stops: 25 }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /curbside/pickup-requests"
              payload: { household_id: "${hh_id}" }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { req_id: $.data.id }
            - call: "POST /curbside/pickup-requests/${req_id}/items"
              payload: { sequence_no: 1, category: "MATTRESS", is_oversize: false, preparation_ack: true }
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/pickup-requests/${req_id}/submit"
              payload: {}
              as: Resident
              as_user_id: "${hh_id}"
          trigger:
            - call: "POST /curbside/pickup-requests/${req_id}/schedule"
              payload: { route_day_id: "${rd_id}", expected_route_day_version: "${rd_v}" }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { resp_total: $.data.provisional_total_cents, resp_status: $.data.status }
            - call: "GET /curbside/pickup-requests/${req_id}"
              as: Resident
              as_user_id: "${hh_id}"
              captures: { get_total: $.data.provisional_total_cents, get_status: $.data.status }
          assert:
            - "schedule response provisional_total_cents == 1302 and status == SCHEDULED"
            - "follow-up GET returns identical provisional_total_cents == 1302 and status == SCHEDULED"
