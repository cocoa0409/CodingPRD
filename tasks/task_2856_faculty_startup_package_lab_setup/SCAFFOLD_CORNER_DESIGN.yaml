# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml - task 2856 Faculty Startup Package & Lab Setup
#
# Breadth probe over the claims declared by SCAFFOLD.yaml SS1.1-1.7, walking
# references/claim-extraction-guide.md section by section. The nine `section:`
# values and every `claim_type:` value below come verbatim from that guide.
# Depth (the nine SS0.5 difficulty rules) lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# corners already asserted there appear here as `excluded_because:` stubs.
#
# Two short fixture chains recur below; each instance inlines its own copy with
# instance-scoped capture names so that placeholder closure holds per instance.
#
#   MINI-UNITS  = POST /_clock/set_current_utc 2026-08-01T00:00:00Z
#                 -> COLLEGE (pool 900000000) -> DEPARTMENT (parent COLLEGE, pool
#                    400000000) -> DEAN_OFFICE (parent COLLEGE, pool 300000000)
#
#   MINI-ACTIVE = MINI-UNITS
#                 -> POST /faculty (ASSISTANT, planned_start_date 2026-08-15)
#                 -> POST /startup-packages (45/35/20, proposed_total_cents
#                    20000000, spend_deadline_on 2028-06-30)
#                 -> POST .../tranches (EQUIPMENT, FY2027, 20000000,
#                    available_on 2026-07-01, expires_on 2027-07-01, NONE)
#                 -> submit (DeanOffice, X-User-ID U-DEANOFFICE-1)
#                 -> endorse (DepartmentChair, X-User-ID = department unit id)
#                 -> approve (Dean, X-User-ID = college unit id)
#                 -> POST /faculty/{id}/activate -> POST .../activate
#                 == negotiation_status ACTIVE, spend_status SPENDING, one OPEN
#                    EQUIPMENT tranche of 20000000, funder reserved_cents
#                    9000000 / 7000000 / 4000000.
#
# Every literal below was computed with the SS1.3 formulas and their constants:
# cost_share_split(20000000) = 9000000 / 7000000 / 4000000;
# cost_share_split(22500000) = 10125000 / 7875000 / 4500000;
# cost_share_split(12000010) = 5400005 / 4200003 / 2400002 (largest remainder
# with a .5/.5/.0 tie broken by FUNDER_ORDINAL, floors 5400004/4200003/2400002).
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: corner_funding_unit_create_returns_zeroed_ledger_and_derived_pool
        claim_type: Creation
        grounds:
          - entities.FundingUnit
          - entities.FundingUnit.fields.available_pool_cents
          - endpoints.POST_funding_units
        distinguishing_aspect: "POST /funding-units with all four required inputs returns 201 with reserved_cents / committed_cents / disbursed_cents / refunded_cents all 0, available_pool_cents == cost_share_pool_cents == 900000000, and version == 1."
        test_recipe:
          setup:
            - "Empty database; clock set to the default logical instant 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DeanOffice
          trigger:
            - call: "POST /funding-units"
              payload: { name: "College of Natural Sciences", unit_type: "COLLEGE", cost_share_pool_cents: 900000000 }
              as: DeanOffice
              captures: { c1_id: $.data.id }
          assert:
            - "response code is 201 and the envelope carries data with a server-minted id"
            - "FundingUnit.${c1_id}.unit_type == COLLEGE and parent_unit_id == null"
            - "FundingUnit.${c1_id}.cost_share_pool_cents == 900000000 and available_pool_cents == 900000000"
            - "FundingUnit.${c1_id}.reserved_cents == 0 and committed_cents == 0 and disbursed_cents == 0 and refunded_cents == 0"
            - "FundingUnit.${c1_id}.version == 1 and created_at == 2026-08-01T00:00:00Z and updated_at == 2026-08-01T00:00:00Z"

      - name: corner_lab_space_create_defaults_available_with_zero_installed_load
        claim_type: Defaults
        grounds:
          - entities.LabSpace.fields.status
          - entities.LabSpace.fields.allocated_share_pct
          - entities.LabSpace.fields.installed_power_kw
          - state_machines.LabSpace.initial_state
        distinguishing_aspect: "A newly registered room defaults to status AVAILABLE with allocated_share_pct 0, installed_power_kw 0 and installed_fume_hoods 0, none of which are inputs of POST /lab-spaces."
        test_recipe:
          setup:
            - "Empty database, clock 2026-08-01T00:00:00Z; no assignments and no renovation projects exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DeanOffice
          trigger:
            - call: "POST /lab-spaces"
              payload: { building_code: "CHEM", room_number: "101", net_sq_ft: 900, space_class: "WET", power_kw_capacity: 120.00, chilled_water_available: true, fume_hood_count: 3, floor_load_psf: 300 }
              as: FacilitiesManager
              captures: { s1_id: $.data.id }
          assert:
            - "LabSpace.${s1_id}.status == AVAILABLE (the declared initial_state)"
            - "LabSpace.${s1_id}.allocated_share_pct == 0 and installed_power_kw == 0 and installed_fume_hoods == 0"
            - "LabSpace.${s1_id}.power_kw_capacity == 120.00 and fume_hood_count == 3 and floor_load_psf == 300 and chilled_water_available == true"
            - "LabSpace.${s1_id}.version == 1"

      - name: corner_tranche_create_defaults_scheduled_with_null_carryforward_cap
        claim_type: Defaults
        grounds:
          - entities.CommitmentTranche.fields.carryforward_cap_pct
          - entities.CommitmentTranche.fields.status
          - entities.CommitmentTranche.fields.available_balance_cents
        distinguishing_aspect: "Omitting the optional carryforward_cap_pct under policy NONE stores null (not 0), and the new tranche starts SCHEDULED with available_balance_cents == amount_cents and every other balance term 0."
        test_recipe:
          setup:
            - "MINI-UNITS plus one CANDIDATE faculty member and one DRAFT startup package of 20000000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DeanOffice
            - call: "POST /funding-units"
              payload: { name: "College of Natural Sciences", unit_type: "COLLEGE", cost_share_pool_cents: 900000000 }
              as: DeanOffice
              captures: { c2_id: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Department of Chemistry", unit_type: "DEPARTMENT", parent_unit_id: "${c2_id}", cost_share_pool_cents: 400000000 }
              as: DeanOffice
              captures: { d2_id: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Dean Office Strategic Pool", unit_type: "DEAN_OFFICE", parent_unit_id: "${c2_id}", cost_share_pool_cents: 300000000 }
              as: DeanOffice
              captures: { x2_id: $.data.id }
            - call: "POST /faculty"
              payload: { full_name: "Ada Reyes", rank: "ASSISTANT", funding_unit_id: "${d2_id}", planned_start_date: "2026-08-15" }
              as: DeanOffice
              captures: { f2_id: $.data.id }
            - call: "POST /startup-packages"
              payload: { faculty_id: "${f2_id}", package_kind: "INITIAL", dean_unit_id: "${x2_id}", dept_share_pct: 45, college_share_pct: 35, dean_share_pct: 20, proposed_total_cents: 20000000, spend_deadline_on: "2028-06-30" }
              as: DeanOffice
              captures: { p2_id: $.data.id }
          trigger:
            - call: "POST /startup-packages/${p2_id}/tranches"
              payload: { category: "EQUIPMENT", fiscal_year: 2027, amount_cents: 20000000, available_on: "2026-07-01T00:00:00Z", expires_on: "2027-07-01T00:00:00Z", carryforward_policy: "NONE" }
              as: DeanOffice
              captures: { t2_id: $.data.id }
          assert:
            - "CommitmentTranche.${t2_id}.carryforward_cap_pct == null (omitted input defaults to null, not 0)"
            - "CommitmentTranche.${t2_id}.status == SCHEDULED and opened_on == null"
            - "CommitmentTranche.${t2_id}.available_balance_cents == 20000000 and encumbered_cents == 0 and disbursed_cents == 0 and expired_cents == 0 and recaptured_cents == 0 and carried_in_cents == 0 and carried_out_cents == 0"
            - "the tranche balance identity holds at creation: 20000000 + 0 == 20000000 + 0 + 0 + 0 + 0 + 0"
            - "StartupPackage.${p2_id}.total_committed_cents == 20000000 and total_available_cents == 20000000 and spend_down_ratio == 0.0"

      - name: corner_startup_package_computed_totals_derive_from_tranches_only
        claim_type: Computed Fields
        grounds:
          - entities.StartupPackage.fields.total_committed_cents
          - entities.StartupPackage.fields.spend_down_ratio
          - calculations.package_spend_rollup
        distinguishing_aspect: "A DRAFT package created with proposed_total_cents 20000000 but no tranches yet reports total_committed_cents == 0 and spend_down_ratio == 0.0 - the computed totals come from CommitmentTranche rows, never from the proposed_total_cents input."
        test_recipe:
          setup:
            - "MINI-UNITS plus one CANDIDATE faculty member; no tranche has been scheduled yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DeanOffice
            - call: "POST /funding-units"
              payload: { name: "College of Natural Sciences", unit_type: "COLLEGE", cost_share_pool_cents: 900000000 }
              as: DeanOffice
              captures: { c3_id: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Department of Chemistry", unit_type: "DEPARTMENT", parent_unit_id: "${c3_id}", cost_share_pool_cents: 400000000 }
              as: DeanOffice
              captures: { d3_id: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Dean Office Strategic Pool", unit_type: "DEAN_OFFICE", parent_unit_id: "${c3_id}", cost_share_pool_cents: 300000000 }
              as: DeanOffice
              captures: { x3_id: $.data.id }
            - call: "POST /faculty"
              payload: { full_name: "Ada Reyes", rank: "ASSISTANT", funding_unit_id: "${d3_id}", planned_start_date: "2026-08-15" }
              as: DeanOffice
              captures: { f3_id: $.data.id }
          trigger:
            - call: "POST /startup-packages"
              payload: { faculty_id: "${f3_id}", package_kind: "INITIAL", dean_unit_id: "${x3_id}", dept_share_pct: 45, college_share_pct: 35, dean_share_pct: 20, proposed_total_cents: 20000000, spend_deadline_on: "2028-06-30" }
              as: DeanOffice
              captures: { p3_id: $.data.id }
          assert:
            - "StartupPackage.${p3_id}.proposed_total_cents == 20000000 yet total_committed_cents == 0"
            - "StartupPackage.${p3_id}.total_encumbered_cents == 0 and total_disbursed_cents == 0 and total_available_cents == 0 and total_expired_cents == 0 and total_recaptured_cents == 0"
            - "StartupPackage.${p3_id}.spend_down_ratio == 0.0 (the declared 0.0-when-total_committed_cents-is-0 branch)"
            - "StartupPackage.${p3_id}.negotiation_status == DRAFT and spend_status == NOT_YET_AVAILABLE and negotiation_round == 1 and counter_total_cents == null"
            - "StartupPackage.${p3_id}.department_unit_id == ${d3_id} and college_unit_id == ${c3_id} (both derived from the faculty member's unit and its parent, neither supplied in the payload)"
            - "FundingUnit.${d3_id}.reserved_cents == 0 - drafting a package reserves nothing"

      - name: corner_faculty_system_fields_are_server_generated
        claim_type: System Fields
        grounds:
          - entities.Faculty.fields.appointment_status
          - entities.Faculty.fields.activated_on
          - entities.Faculty.fields.retention_round
        distinguishing_aspect: "POST /faculty accepts exactly four inputs; id, created_at, updated_at, version, appointment_status (CANDIDATE), activated_on (null) and retention_round (0) are all server-set and no payload field can influence them."
        test_recipe:
          setup:
            - "MINI-UNITS; the department unit exists and no faculty row exists yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DeanOffice
            - call: "POST /funding-units"
              payload: { name: "College of Natural Sciences", unit_type: "COLLEGE", cost_share_pool_cents: 900000000 }
              as: DeanOffice
              captures: { c4_id: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Department of Chemistry", unit_type: "DEPARTMENT", parent_unit_id: "${c4_id}", cost_share_pool_cents: 400000000 }
              as: DeanOffice
              captures: { d4_id: $.data.id }
          trigger:
            - call: "POST /faculty"
              payload: { full_name: "Ada Reyes", rank: "ASSISTANT", funding_unit_id: "${d4_id}", planned_start_date: "2026-08-15" }
              as: DeanOffice
              captures: { f4_id: $.data.id }
          assert:
            - "Faculty.${f4_id}.appointment_status == CANDIDATE (the declared initial_state)"
            - "Faculty.${f4_id}.activated_on == null and separated_on == null and departure_intent == null and departure_effective_on == null and target_funding_unit_id == null"
            - "Faculty.${f4_id}.retention_round == 0"
            - "Faculty.${f4_id}.created_at == 2026-08-01T00:00:00Z and updated_at == 2026-08-01T00:00:00Z and version == 1"
            - "Faculty.${f4_id}.planned_start_date == 2026-08-15 is stored verbatim and does not activate the row"

      - name: corner_get_startup_package_returns_stored_row
        claim_type: Retrieval
        grounds:
          - endpoints.GET_startup_packages_id
          - entities.StartupPackage
        distinguishing_aspect: "GET /startup-packages/{id} returns exactly the row written by the create call - same id, same proposed_total_cents 20000000, same derived department_unit_id - with no state mutation and no version bump."
        test_recipe:
          setup:
            - "MINI-UNITS plus one CANDIDATE faculty member and one DRAFT package of 20000000 with a single EQUIPMENT tranche."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DeanOffice
            - call: "POST /funding-units"
              payload: { name: "College of Natural Sciences", unit_type: "COLLEGE", cost_share_pool_cents: 900000000 }
              as: DeanOffice
              captures: { c5_id: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Department of Chemistry", unit_type: "DEPARTMENT", parent_unit_id: "${c5_id}", cost_share_pool_cents: 400000000 }
              as: DeanOffice
              captures: { d5_id: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Dean Office Strategic Pool", unit_type: "DEAN_OFFICE", parent_unit_id: "${c5_id}", cost_share_pool_cents: 300000000 }
              as: DeanOffice
              captures: { x5_id: $.data.id }
            - call: "POST /faculty"
              payload: { full_name: "Ada Reyes", rank: "ASSISTANT", funding_unit_id: "${d5_id}", planned_start_date: "2026-08-15" }
              as: DeanOffice
              captures: { f5_id: $.data.id }
            - call: "POST /startup-packages"
              payload: { faculty_id: "${f5_id}", package_kind: "INITIAL", dean_unit_id: "${x5_id}", dept_share_pct: 45, college_share_pct: 35, dean_share_pct: 20, proposed_total_cents: 20000000, spend_deadline_on: "2028-06-30" }
              as: DeanOffice
              captures: { p5_id: $.data.id, p5_v: $.data.version }
            - call: "POST /startup-packages/${p5_id}/tranches"
              payload: { category: "EQUIPMENT", fiscal_year: 2027, amount_cents: 20000000, available_on: "2026-07-01T00:00:00Z", expires_on: "2027-07-01T00:00:00Z", carryforward_policy: "NONE" }
              as: DeanOffice
          trigger:
            - call: "GET /startup-packages/${p5_id}"
              payload: {}
              as: DeanOffice
          assert:
            - "response code is 200 and data.id == ${p5_id}"
            - "data.proposed_total_cents == 20000000 and data.spend_deadline_on == 2028-06-30 and data.package_kind == INITIAL"
            - "data.department_unit_id == ${d5_id} and data.college_unit_id == ${c5_id} and data.dean_unit_id == ${x5_id}"
            - "data.total_committed_cents == 20000000 (the tranche created after the package is reflected in the read)"
            - "data.version == ${p5_v} - a read never bumps version, even though the tranche create did not touch the package row's own version either"

      - name: corner_list_package_tranches_with_category_filter_and_offset
        claim_type: Listing
        grounds:
          - endpoints.GET_startup_packages_id_tranches
          - entities.CommitmentTranche.fields.category
        distinguishing_aspect: "GET /startup-packages/{id}/tranches?category=EQUIPMENT&limit=1&offset=1 returns exactly the second EQUIPMENT tranche by created_at ASC and excludes the RENOVATION tranche entirely, so filter, ordering and pagination compose."
        test_recipe:
          setup:
            - "MINI-UNITS plus one CANDIDATE faculty member and one DRAFT package of 20000000 carrying three tranches created in this order: EQUIPMENT 9000000, EQUIPMENT 6000000, RENOVATION 5000000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DeanOffice
            - call: "POST /funding-units"
              payload: { name: "College of Natural Sciences", unit_type: "COLLEGE", cost_share_pool_cents: 900000000 }
              as: DeanOffice
              captures: { c6_id: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Department of Chemistry", unit_type: "DEPARTMENT", parent_unit_id: "${c6_id}", cost_share_pool_cents: 400000000 }
              as: DeanOffice
              captures: { d6_id: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Dean Office Strategic Pool", unit_type: "DEAN_OFFICE", parent_unit_id: "${c6_id}", cost_share_pool_cents: 300000000 }
              as: DeanOffice
              captures: { x6_id: $.data.id }
            - call: "POST /faculty"
              payload: { full_name: "Ada Reyes", rank: "ASSISTANT", funding_unit_id: "${d6_id}", planned_start_date: "2026-08-15" }
              as: DeanOffice
              captures: { f6_id: $.data.id }
            - call: "POST /startup-packages"
              payload: { faculty_id: "${f6_id}", package_kind: "INITIAL", dean_unit_id: "${x6_id}", dept_share_pct: 45, college_share_pct: 35, dean_share_pct: 20, proposed_total_cents: 20000000, spend_deadline_on: "2028-06-30" }
              as: DeanOffice
              captures: { p6_id: $.data.id }
            - call: "POST /startup-packages/${p6_id}/tranches"
              payload: { category: "EQUIPMENT", fiscal_year: 2027, amount_cents: 9000000, available_on: "2026-07-01T00:00:00Z", expires_on: "2027-07-01T00:00:00Z", carryforward_policy: "NONE" }
              as: DeanOffice
              captures: { t6_a: $.data.id }
            - call: "POST /startup-packages/${p6_id}/tranches"
              payload: { category: "EQUIPMENT", fiscal_year: 2028, amount_cents: 6000000, available_on: "2027-07-01T00:00:00Z", expires_on: "2028-07-01T00:00:00Z", carryforward_policy: "NONE" }
              as: DeanOffice
              captures: { t6_b: $.data.id }
            - call: "POST /startup-packages/${p6_id}/tranches"
              payload: { category: "RENOVATION", fiscal_year: 2027, amount_cents: 5000000, available_on: "2026-07-01T00:00:00Z", expires_on: "2027-07-01T00:00:00Z", carryforward_policy: "NONE" }
              as: DeanOffice
              captures: { t6_c: $.data.id }
          trigger:
            - call: "GET /startup-packages/${p6_id}/tranches"
              payload: { category: "EQUIPMENT", limit: 1, offset: 1 }
              as: DeanOffice
          assert:
            - "the returned array has exactly one element and it is CommitmentTranche.${t6_b} (amount_cents 6000000, fiscal_year 2028)"
            - "CommitmentTranche.${t6_a} is skipped by offset 1 and CommitmentTranche.${t6_c} is excluded by the category filter"
            - "an unfiltered GET /startup-packages/${p6_id}/tranches returns all three rows ordered by created_at ASC: ${t6_a}, ${t6_b}, ${t6_c}"
            - "the filter is applied before pagination: offset counts EQUIPMENT rows only, so offset 1 does not land on the RENOVATION row"

      - name: corner_get_lab_space_unknown_id_returns_space_not_found
        claim_type: Not Found
        grounds:
          - validations.priority_9_ERR_SPACE_NOT_FOUND
          - endpoints.GET_lab_spaces_id
        distinguishing_aspect: "GET /lab-spaces/{id} with a syntactically valid but unknown UUID returns 404 ERR_SPACE_NOT_FOUND, not the generic ERR_RESOURCE_NOT_FOUND."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z and exactly one registered room, whose id is NOT the one requested."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DeanOffice
            - call: "POST /lab-spaces"
              payload: { building_code: "CHEM", room_number: "101", net_sq_ft: 900, space_class: "WET", power_kw_capacity: 120.00, chilled_water_available: true, fume_hood_count: 3, floor_load_psf: 300 }
              as: FacilitiesManager
              captures: { s7_id: $.data.id }
          trigger:
            - call: "GET /lab-spaces/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FacilitiesManager
          assert:
            - "response code is 404 with error_id ERR_SPACE_NOT_FOUND"
            - "the existing LabSpace.${s7_id} is untouched: status == AVAILABLE and version == 1"

      - name: corner_create_tranche_on_unknown_package_returns_package_not_found
        claim_type: Parent Relationships
        grounds:
          - validations.priority_7_ERR_PACKAGE_NOT_FOUND
          - endpoints.POST_startup_packages_id_tranches
        distinguishing_aspect: "A CommitmentTranche cannot exist without its parent package: POST /startup-packages/{unknown}/tranches returns 404 ERR_PACKAGE_NOT_FOUND and writes no row."
        test_recipe:
          setup:
            - "MINI-UNITS only - not a single StartupPackage row exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DeanOffice
            - call: "POST /funding-units"
              payload: { name: "College of Natural Sciences", unit_type: "COLLEGE", cost_share_pool_cents: 900000000 }
              as: DeanOffice
              captures: { c8_id: $.data.id }
          trigger:
            - call: "POST /startup-packages/00000000-0000-4000-8000-0000000000ff/tranches"
              payload: { category: "EQUIPMENT", fiscal_year: 2027, amount_cents: 20000000, available_on: "2026-07-01T00:00:00Z", expires_on: "2027-07-01T00:00:00Z", carryforward_policy: "NONE" }
              as: DeanOffice
          assert:
            - "response code is 404 with error_id ERR_PACKAGE_NOT_FOUND"
            - "no CommitmentTranche row exists after the call"
            - "FundingUnit.${c8_id}.reserved_cents == 0"

      - name: corner_create_startup_package_missing_required_spend_deadline_is_rejected
        claim_type: Required Fields
        grounds:
          - validations.priority_3_ERR_VALIDATION
          - endpoints.POST_startup_packages
        distinguishing_aspect: "spend_deadline_on is a required input of POST /startup-packages with no default, so omitting it returns 400 ERR_VALIDATION and creates nothing - the request is not silently defaulted to the fiscal-year end."
        test_recipe:
          setup:
            - "MINI-UNITS plus one CANDIDATE faculty member."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DeanOffice
            - call: "POST /funding-units"
              payload: { name: "College of Natural Sciences", unit_type: "COLLEGE", cost_share_pool_cents: 900000000 }
              as: DeanOffice
              captures: { c9_id: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Department of Chemistry", unit_type: "DEPARTMENT", parent_unit_id: "${c9_id}", cost_share_pool_cents: 400000000 }
              as: DeanOffice
