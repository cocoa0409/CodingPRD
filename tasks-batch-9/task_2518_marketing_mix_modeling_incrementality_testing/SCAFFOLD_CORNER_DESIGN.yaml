      - name: washout_sweep_with_no_washout_cells_is_a_noop
        claim_type: conditional_action
        grounds:
          - "endpoints POST /mmm/markets/{id}/washout-sweep input [], roles [ExperimentDesigner]"
          - "state_machines GeoCell WASHOUT -> UNASSIGNED preconditions - assignment_state == WASHOUT; cells whose quarantine has not elapsed are SKIPPED, not errored"
          - "entities.Market.held_out_population and held_out_population_pct"
        distinguishing_aspect: |
          The sweep is a conditional action with an empty candidate set here, and it must answer 200 with
          the market untouched rather than 404 or 409: TREATMENT and CONTROL cells are NOT swept (only
          WASHOUT is), so held_out_population stays at 200000 and both cells keep their
          assigned_experiment_id.
          
        test_recipe:
          setup:
            - "Market US_CORE with total_population 10000000 and two geo cells GC01 and GC02 of population 100000 each."
            - "Experiment E1 on A_SEARCH is GEO_HOLDOUT and CELLS_ASSIGNED with GC01 as treatment and GC02 as control, so held_out_population is 200000 and NO cell is in WASHOUT."
            - "release-cells has deliberately not been called, so the sweep has nothing to act on."
          setup_api_calls:
            - call: "POST /mmm/markets"
              payload: { market_code: "US_CORE", name: "US Core Brand Market", total_population: 10000000, annual_budget_ceiling_cents: 5000000000, currency_code: "USD" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { mkt: "$.data.id" }
            - call: "POST /mmm/media-channels"
              payload: { market_id: "${mkt}", channel_code: "A_SEARCH", channel_type: "SEARCH", adstock_decay_rate: 0.50, adstock_max_lag_periods: 2, saturation_half_point_cents: 200000, response_ceiling_units: 1200, min_spend_cents: 200000, max_spend_cents: 3000000, status: "ACTIVE" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { cha: "$.data.id" }
            - call: "POST /mmm/geo-cells"
              payload: { market_id: "${mkt}", cell_code: "GC01", population: 100000 }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { gc1: "$.data.id" }
            - call: "POST /mmm/geo-cells"
              payload: { market_id: "${mkt}", cell_code: "GC02", population: 100000 }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { gc2: "$.data.id" }
            - call: "POST /mmm/experiments"
              payload: { market_id: "${mkt}", channel_id: "${cha}", design_type: "GEO_HOLDOUT", readout_method: "DIFF_IN_DIFF", start_date: "2026-09-07T00:00:00Z", end_date: "2026-10-05T00:00:00Z", washout_days: 7, minimum_detectable_effect_pct: 5.0, baseline_conversion_rate: 0.0200, planned_treatment_population: 245000, planned_control_population: 245000 }
              as: ExperimentDesigner
              as_user_id: "ed-1"
              captures: { exp1: "$.data.id" }
            - call: "POST /mmm/experiments/${exp1}/lock-design"
              as: ExperimentDesigner
              as_user_id: "ed-1"
            - call: "POST /mmm/experiments/${exp1}/assign-cells"
              payload: { treatment_cell_ids: ["${gc1}"], control_cell_ids: ["${gc2}"] }
              as: ExperimentDesigner
              as_user_id: "ed-1"
          trigger:
            - call: "POST /mmm/markets/${mkt}/washout-sweep"
              as: ExperimentDesigner
              as_user_id: "ed-1"
          assert:
            - "HTTP 200 - an empty sweep is a successful no-op, not an error."
            - "data.held_out_population == 200000 and data.held_out_population_pct == 2.00 - unchanged."
            - "GET /mmm/geo-cells/${gc1} still shows assignment_state == TREATMENT with assigned_experiment_id == ${exp1} and washout_until_date == null."
            - "GET /mmm/geo-cells/${gc2} still shows assignment_state == CONTROL with assigned_experiment_id == ${exp1}."
            - "GET /mmm/geo-cells?market_id=${mkt}&assignment_state=UNASSIGNED returns total_count == 0 and the same query for WASHOUT returns total_count == 0."
            - "GET /mmm/experiments/${exp1} still shows status == CELLS_ASSIGNED."
      - name: computed_read_returns_derived_decomposition
        claim_type: computed_read
        grounds:
          - "endpoints GET /mmm/channel-contributions input [model_run_id?, channel_id?, is_current?, attribution_mode_used?, limit?, offset?] - a read over rows that are entirely computed by fit"
          - "entities.ChannelContribution - every field except model_run_id and channel_id is computed"
        excluded_because:
          difficulty_instance: carryover_mode_variant_divergence_on_channel_contribution
          rationale: >-
            That instance reads the computed decomposition back through the same list endpoint under both attribution modes and asserts every derived field on both rows, including the ordering by channel_code and the is_current flag, which is the computed_read claim in full.
  - section: errors
    note: >-
      61 error ids. Table 6 of the guide demands that EVERY id be triggerable, so this section is organised as a coverage sweep rather than one instance per id: the 404 family, ERR_INVALID_REQUEST and ERR_CHANNEL_NOT_IN_MARKET are triggered in the entities section, the four ERR_*_INVALID_STATE ids and ERR_HOLDOUT_NOT_PASSED in state_machines, ERR_MODEL_UNSTABLE in calculations, ERR_DUPLICATE_RESOURCE / ERR_PERIOD_NOT_ALIGNED / ERR_CLOCK_REWIND / ERR_DATA_WINDOW_OVERLAP / ERR_MODEL_BASELINE_NEGATIVE / ERR_HOLDOUT_SHARE_EXCEEDED / ERR_DESIGN_TYPE_MISMATCH / ERR_CELLS_NOT_ASSIGNED / ERR_NO_SPEND_OBSERVATIONS / ERR_LAG_WINDOW_INCOMPLETE in validations, ERR_GEO_CELL_UNAVAILABLE / ERR_CALIBRATION_STALE / ERR_CALIBRATION_NOT_PENDING in endpoints, the three auth ids in rbac and the two 412 ids in complexity_layers. The instances below close the remaining gaps, each one also pinning the priority ladder that decides WHICH id speaks when several conditions are violated at once.
    instances:
      - name: observation_writes_to_sealed_window_rejected
        claim_type: violation_to_error
        grounds:
          - "errors ERR_DATA_WINDOW_SEALED (409) - validations priority 45, applies_to POST /mmm/spend-observations and POST /mmm/sales-observations"
          - "validations priority 45 check - the parent DataWindow.status == OPEN or REOPENED; a SEALED window accepts no new observation and no restatement"
          - "validations priority 30 ERR_STALE_DATA_WINDOW_VERSION and priority 63 ERR_DUPLICATE_RESOURCE bracket this rule on both sides"
          - "state_machines DataWindow SEALED -> REOPENED trigger POST /mmm/data-windows/{id}/reopen input [reason]"
        distinguishing_aspect: |
          The sealed gate sits between the OCC check above it and the duplicate check below it, so proving
          the id requires a CURRENT expected_data_window_version: the post-seal version 14 is read back
          first, otherwise the stale 13 would answer 412 and the sealed rule would never be reached. After
          reopen the very same sales body answers 63 ERR_DUPLICATE_RESOURCE and the very same spend body
          answers 201 - which proves the 409 was about the window's status and not the payload.
          
        test_recipe:
          setup:
            - "Fixture F1 sealed: window W1 [2026-08-03, 2026-08-31) WEEKLY with 4 sales rows and 8 spend rows, SEALED at version 14 (1 create + 4 sales + 8 spend + 1 seal)."
            - "The clock is at 2026-08-31T00:00:00Z."
            - "The post-seal version is captured so the spend attempt carries a fresh OCC token rather than the stale 13 left over from the last setup write."
          setup_api_calls:
            - call: "POST /mmm/markets"
              payload: { market_code: "US_CORE", name: "US Core Brand Market", total_population: 10000000, annual_budget_ceiling_cents: 5000000000, currency_code: "USD" }
              as: DataEngineer
              as_user_id: "de-1"
