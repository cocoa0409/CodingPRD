- rule_id: cross_entity_state_dependency
  rationale: Three gates that read a state living on a DIFFERENT entity from the one being transitioned, with the target entity itself in a perfectly legal state.
  instances:
  - name: cross_entity_session_activate_requires_quiet_plant_not_just_open_posture
    grounds:
    - §1.4 priority 17 ERR_LIFE_SUPPORT_ALARM (applies only to session transitions)
    - §1.2 InteractionSession SCHEDULED -> ACTIVE preconditions
    - §1.1 LifeSupportSystem.alarm_state / redundancy_overdue, §1.1 Exhibit.posture
    - §1.3 water_quality_index, §1.3 exhibit_posture
    - §1.5 POST /aquarium/interaction-sessions/{id}/transitions
    distinguishing_aspect: The session is SCHEDULED, briefed, under capacity, and its exhibit is NOT closed — every condition on the session itself is met. Activation still fails because the gate reads the SERVING PLANT two hops away (session -> exhibit -> life support system), whose alarm_state is WARNING. Checking only exhibit.posture != CLOSED (priority 15) lets the activation through.
    test_recipe:
      setup: One COLD_MARINE plant serving one exhibit with the interaction programme enabled, and one SCHEDULED FEEDING_ENCOUNTER on 2026-08-02 with the safety briefing confirmed and 4 of 6 guest places booked. Clock at 2026-08-01T12:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T12:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-COLD-1, system_type: RECIRCULATING_MARINE, design_habitat: COLD_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
        as: ComplianceDirector
        captures: {lss_id: $.data.id}
      - call: POST /aquarium/exhibits
        payload: {exhibit_code: EX-COLD-1, name: Cold Water Reef, habitat_type: COLD_MARINE, life_support_system_id: '${lss_id}', display_volume_liters: 120000, bioload_capacity_units: 100, interaction_program_enabled: true}
        as: CuratorOfCollections
        captures: {ex_id: $.data.id, ex_v1: $.data.version}
      - call: POST /aquarium/interaction-sessions
        payload: {exhibit_id: '${ex_id}', program_type: FEEDING_ENCOUNTER, starts_at: '2026-08-02T10:00:00Z', ends_at: '2026-08-02T11:00:00Z', max_guests: 6, guest_count: 4, safety_briefing_confirmed: true}
        as: AquaristTechnician
        captures: {ses_id: $.data.id}
      trigger:
      - call: POST /aquarium/life-support-systems/${lss_id}/water-quality-readings
        payload: {taken_at: '2026-08-01T10:00:00Z', temperature_c: 13.6, salinity_ppt: 33.0, ph: 8.1, dissolved_oxygen_mg_l: 7.4, ammonia_mg_l: 0.01, nitrite_mg_l: 0.02}
        as: AquaristTechnician
        captures: {idx: $.data.water_quality_index_snapshot}
      - call: GET /aquarium/exhibits/${ex_id}
        payload: {}
        as: AquaristTechnician
        captures: {ex_v2: $.data.version}
      - call: POST /aquarium/interaction-sessions/${ses_id}/transitions
        payload: {action: ACTIVATE}
        as: AquaristTechnician
        captures: {err: $.data.error_id}
      - call: POST /aquarium/life-support-systems/${lss_id}/water-quality-readings
        payload: {taken_at: '2026-08-01T10:30:00Z', temperature_c: 12.0, salinity_ppt: 33.0, ph: 8.1, dissolved_oxygen_mg_l: 7.4, ammonia_mg_l: 0.01, nitrite_mg_l: 0.02}
        as: AquaristTechnician
      - call: POST /aquarium/life-support-systems/${lss_id}/water-quality-readings
        payload: {taken_at: '2026-08-01T11:00:00Z', temperature_c: 12.0, salinity_ppt: 33.0, ph: 8.1, dissolved_oxygen_mg_l: 7.4, ammonia_mg_l: 0.01, nitrite_mg_l: 0.02}
        as: AquaristTechnician
      - call: POST /aquarium/life-support-systems/${lss_id}/water-quality-readings
        payload: {taken_at: '2026-08-01T11:30:00Z', temperature_c: 12.0, salinity_ppt: 33.0, ph: 8.1, dissolved_oxygen_mg_l: 7.4, ammonia_mg_l: 0.01, nitrite_mg_l: 0.02}
        as: AquaristTechnician
      - call: GET /aquarium/exhibits/${ex_id}
        payload: {}
        as: AquaristTechnician
        captures: {ex_v3: $.data.version}
      - call: POST /aquarium/interaction-sessions/${ses_id}/transitions
        payload: {action: ACTIVATE}
        as: AquaristTechnician
        captures: {st: $.data.status}
      assert:
      - 'trigger[0]: temperature 13.6 gives r_temperature_c == abs(13.6 - 12.0)/1.5 == 1.0666..., the only non-zero ratio, so water_quality_index_snapshot == round_half_up(100 - (6 + 15)*1.0666..., 2) == 77.60 with severity WARNING'
      - the plant is WARNING and the exhibit becomes RESTRICTED with last_posture_reason == 'LSS_WARNING' — NOT closed
      - 'trigger[2]: ACTIVATE returns 409 ERR_LIFE_SUPPORT_ALARM; priority 15 passes (posture != CLOSED) and the session stays SCHEDULED'
      - 'trigger[3] and trigger[4]: NORMAL readings keep alarm_state == WARNING (consecutive_normal_readings 1 then 2, both below ALARM_CLEAR_NORMAL_READINGS 3) and the exhibit stays RESTRICTED, so a repeat ACTIVATE would still fail'
      - 'trigger[5]: the third NORMAL reading clears the plant to alarm_state == NORMAL and the exhibit to posture OPEN with last_posture_reason == null'
      - 'trigger[7]: ACTIVATE now returns InteractionSession.status == ACTIVE'
      - Exhibit.suspended_session_count stays 0 — a WARNING band never suspends sessions, only a CLOSED posture does
  - name: cross_entity_clearance_blocked_until_import_permit_issued
    grounds:
    - §1.4 priority 26 ERR_PERMIT_NOT_ISSUED
    - §1.2 AcquisitionRequest PENDING_PERMIT -> CLEARED preconditions
    - §1.2 Permit DRAFT -> SUBMITTED -> ISSUED
    - §1.3 sustainability_score PERMIT_BONUS 5.00 and QUOTA_PRESSURE_WEIGHT 20.00
    - §1.1 Species.wild_take_quota_reserved, §1.1 AcquisitionRequest.quota_units_reserved
    - §1.5 POST /aquarium/acquisition-requests/{id}/clearance, POST /aquarium/permits/{id}/decisions
    distinguishing_aspect: 'The acquisition request is in exactly the right state (PENDING_PERMIT) with a fresh species version and a passing score, and the permit EXISTS — it is merely SUBMITTED. Clearance must read the permit''s status on the OTHER entity. The same call succeeds once the permit is ISSUED, and the FINAL score jumps by exactly PERMIT_BONUS, proving the permit was consulted twice: once as a gate and once as a score term.'
    test_recipe:
      setup: A wild-collection request for 1 specimen of a GREEN, UNLISTED species with wild_take_quota_annual 10, sourced from an ACCREDITED institution with welfare_audit_score 80.00. The IMPORT permit carries the full base document set and has been submitted but not yet decided.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-COLD-1, system_type: RECIRCULATING_MARINE, design_habitat: COLD_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
        as: ComplianceDirector
        captures: {lss_id: $.data.id}
      - call: POST /aquarium/exhibits
        payload: {exhibit_code: EX-COLD-1, name: Cold Water Reef, habitat_type: COLD_MARINE, life_support_system_id: '${lss_id}', display_volume_liters: 120000, bioload_capacity_units: 100}
        as: CuratorOfCollections
        captures: {ex_id: $.data.id, ex_v1: $.data.version}
      - call: POST /aquarium/species
        payload: {scientific_name: Sebastes ruberrimus, common_name: yelloweye rockfish, taxon_group: TELEOST, protection_status: UNLISTED, sustainability_rating: GREEN, bioload_units_per_specimen: 12, base_quarantine_days: 30, wild_take_quota_annual: 10}
        as: CuratorOfCollections
        captures: {sp_id: $.data.id, sp_v1: $.data.version}
      - call: POST /aquarium/collection-plan-entries
        payload: {exhibit_id: '${ex_id}', species_id: '${sp_id}', planned_count: 2, sustainability_requirement: GREEN_ONLY, expected_exhibit_version: '${ex_v1}'}
        as: CuratorOfCollections
        captures: {cpe_id: $.data.id}
      - call: POST /aquarium/collection-plan-entries/${cpe_id}/status-actions
        payload: {action: APPROVE}
        as: ComplianceDirector
        as_user_id: dir-plan-approver
      - call: POST /aquarium/institutions
        payload: {name: Northport Marine Institute, institution_code: NPM, accreditation_status: ACCREDITED, welfare_audit_score: 80.0, last_audit_at: '2026-05-01T00:00:00Z'}
        as: ComplianceDirector
        captures: {inst_id: $.data.id}
      - call: POST /aquarium/acquisition-requests
        payload: {collection_plan_entry_id: '${cpe_id}', source_type: WILD_COLLECTION, requested_count: 1, source_institution_id: '${inst_id}'}
        as: CuratorOfCollections
        captures: {ar_id: $.data.id, prov_score: $.data.sustainability_score}
      - call: POST /aquarium/acquisition-requests/${ar_id}/submission
        payload: {}
        as: CuratorOfCollections
      - call: POST /aquarium/permits
        payload: {acquisition_request_id: '${ar_id}', permit_type: IMPORT, authority_reference: NMFS-2026-1177, document_codes: [HEALTH_CERTIFICATE, ORIGIN_DECLARATION, IMPORT_LICENSE]}
        as: PermitOfficer
        captures: {pm_id: $.data.id}
      - call: POST /aquarium/permits/${pm_id}/submission
        payload: {}
        as: PermitOfficer
      trigger:
      - call: GET /aquarium/species/${sp_id}
        payload: {}
        as: ComplianceDirector
        captures: {sp_v2: $.data.version}
      - call: POST /aquarium/acquisition-requests/${ar_id}/clearance
        payload: {expected_species_version: '${sp_v2}'}
        as: ComplianceDirector
        as_user_id: dir-clearance-officer
        captures: {err: $.data.error_id}
      - call: GET /aquarium/acquisition-requests/${ar_id}
        payload: {}
        as: ComplianceDirector
        captures: {mid_score: $.data.sustainability_score, mid_variant: $.data.sustainability_score_variant}
      - call: POST /aquarium/permits/${pm_id}/decisions
        payload: {decision: ISSUE, valid_from: '2026-08-01T00:00:00Z', valid_until: '2027-06-01T00:00:00Z'}
        as: ComplianceDirector
        as_user_id: dir-permit-officer
      - call: GET /aquarium/species/${sp_id}
        payload: {}
        as: ComplianceDirector
        captures: {sp_v3: $.data.version}
      - call: POST /aquarium/acquisition-requests/${ar_id}/clearance
        payload: {expected_species_version: '${sp_v3}'}
        as: ComplianceDirector
        as_user_id: dir-clearance-officer
        captures: {final_score: $.data.sustainability_score}
      assert:
      - 'setup: the request is PENDING_PERMIT with permit_deadline_at == ''2026-08-31T00:00:00Z'' (clock 2026-08-01 + PERMIT_DEADLINE_DAYS 30) and sustainability_score == 70.00 / PROVISIONAL (min(100, 40 + 10 + 0.25*80.00) - 0)'
      - 'trigger[1]: clearance returns 409 ERR_PERMIT_NOT_ISSUED while the permit is SUBMITTED'
      - 'trigger[2]: the request is still PENDING_PERMIT, its sustainability_score is still 70.00 with variant PROVISIONAL, quota_units_reserved == 0 and Species.wild_take_quota_reserved == 0 — a rejected clearance recomputes nothing'
      - 'trigger[3]: the permit reaches status ISSUED with issued_at == ''2026-08-01T00:00:00Z'''
      - 'trigger[5]: the identical clearance payload now returns status CLEARED with sustainability_score == 73.00 and variant FINAL (min(100, 40 + 10 + 20.00 + 5) - 0 - 20*((0 + 1)/10))'
      - 'the FINAL score is exactly 3.00 above the PROVISIONAL one: +5.00 PERMIT_BONUS minus 2.00 quota pressure'
      - after clearance quota_units_reserved == 1 and Species.wild_take_quota_reserved == 1, and Species.version has been incremented, so replaying trigger[5] with the stale ${sp_v3} would return 412 ERR_STALE_SPECIES_VERSION
  - name: cross_entity_transfer_approval_requires_issued_transport_permit
    grounds:
    - §1.4 priority 26 ERR_PERMIT_NOT_ISSUED on POST /aquarium/transfer-requests/{id}/decisions
    - §1.2 TransferRequest SUBMITTED -> APPROVED -> COMPLETED
    - §1.2 Specimen CLEARED -> TRANSFER_PENDING -> TRANSFERRED (terminal)
    - §1.3 derived_flag_reconciliation (Species.permit_required from protection_status)
    - §1.3 permit_document_requirement (TRANSPORT base set + CITES_PERMIT), §1.3 transfer_condition_requirement (+ CITES_TRANSPORT_CLEARANCE)
    - §1.3 sustainability_score cap min(100, ...) applied BEFORE the protection penalty
    - §1.5 POST /aquarium/permits, POST /aquarium/transfer-requests, POST /aquarium/transfer-requests/{id}/completion
    - §1.4 priority 36 ERR_TRANSFER_DATE_NOT_REACHED
