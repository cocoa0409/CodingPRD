        distinguishing_aspect: "Accept re-checks enrolled_count < capacity at accept time: after a legal capacity shrink (2 -> 1 with enrolled 1), the OFFERED registration's accept fails with ERR_CLASSROOM_FULL because the seat pool no longer covers it."
        test_recipe:
