              payload: { permit_id: "${permit_a}", pitch_id: "${p1}", start_at: "2026-08-25T10:00:00Z", end_at: "2026-08-25T11:00:00Z", expected_permit_version: "${pv1}", amplification_planned: false }
              as: Performer
              as_user_id: "${perf_a}"
              captures: { bk1: "$.data.id" }
            - call: "POST /busking/session-bookings"
              payload: { permit_id: "${permit_a}", pitch_id: "${p1}", start_at: "2026-08-26T10:00:00Z", end_at: "2026-08-26T11:00:00Z", expected_permit_version: "${pv1}", amplification_planned: false }
