      - name: the_scored_check_runs_before_the_already_ruled_check
        claim_type: Cascading validation
        grounds:
          - validations[priority=12]
          - validations[priority=13]
          - errors.ERR_CLASSIFICATION_NOT_SCORED
          - errors.ERR_CLASSIFICATION_ALREADY_RULED
          - endpoints.POST_classifications_id_reconsider
        distinguishing_aspect: |
          Ruling requires the result of a prior check in a fixed order: an unscored classification answers
          ERR_CLASSIFICATION_NOT_SCORED at priority 13, but once the row has been ruled the priority 12
          status check pre-empts it, and reconsider's status check is the mirror image - it rejects a row
          that is still PENDING with the same error id. The four headcount buckets must stay conserved
          through every one of those attempts.
        test_recipe:
          setup:
            - "petition 07-RC-340314 in SCOPE_ANALYSIS with PROD (60) and MAINT (30) created but not yet scored"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-03T09:00:00Z"}
              as: LaborRelationsDirector
            - call: "POST /labor-relations/petitions"
              payload: {"case_number": "07-RC-340314", "petition_type": "RC", "union_name": "United Plant Workers Local 812", "filed_date": "2026-08-03", "proposed_unit_description": "All production and maintenance employees at Plant 1", "claimed_employee_count": 120, "payroll_period_end": "2026-08-14"}
              as: LaborRelationsDirector
              captures: {"pet_id": "$.data.id"}
            - call: "POST /labor-relations/petitions/${pet_id}/open-scope-analysis"
              payload: {}
              as: LaborRelationsDirector
            - call: "POST /labor-relations/classifications"
              payload: {"petition_id": "${pet_id}", "code": "PROD", "title": "Production Operator", "headcount": 60, "avg_hourly_wage_cents": 2400, "shift_code": "A", "work_location": "PLANT_1", "supervisory_authority_count": 0, "employer_position": "INCLUDE", "union_position": "INCLUDE", "supervision_overlap": 88, "skills_overlap": 90, "functional_integration": 92, "interchange_rate": 74, "work_conditions_overlap": 95}
              as: HRDataAnalyst
              captures: {"cls_prod_id": "$.data.id"}
            - call: "POST /labor-relations/classifications"
              payload: {"petition_id": "${pet_id}", "code": "MAINT", "title": "Maintenance Mechanic", "headcount": 30, "avg_hourly_wage_cents": 3200, "shift_code": "A", "work_location": "PLANT_1", "supervisory_authority_count": 0, "employer_position": "INCLUDE", "union_position": "INCLUDE", "supervision_overlap": 82, "skills_overlap": 78, "functional_integration": 86, "interchange_rate": 61, "work_conditions_overlap": 84}
              as: HRDataAnalyst
              captures: {"cls_maint_id": "$.data.id"}
          trigger:
            - call: "POST /labor-relations/classifications/${cls_prod_id}/rule"
              payload: {"ruling": "INCLUDED", "ruling_rationale": "Core production group"}
              as: BoardAgent
              captures: {"err1": "$.data.error_id"}
            - call: "POST /labor-relations/classifications/${cls_prod_id}/reconsider"
              payload: {"reconsideration_note": "Premature"}
              as: BoardAgent
              captures: {"err2": "$.data.error_id"}
            - call: "POST /labor-relations/classifications/${cls_prod_id}/score"
              payload: {"scoring_standard": "TRADITIONAL"}
              as: EmploymentCounsel
            - call: "POST /labor-relations/classifications/${cls_prod_id}/rule"
              payload: {"ruling": "INCLUDED", "ruling_rationale": "Core production group"}
              as: BoardAgent
            - call: "POST /labor-relations/classifications/${cls_prod_id}/rule"
              payload: {"ruling": "EXCLUDED", "ruling_rationale": "Second thoughts"}
              as: BoardAgent
              captures: {"err3": "$.data.error_id"}
            - call: "GET /labor-relations/petitions/${pet_id}"
              payload: {}
              as: BoardAgent
          assert:
            - "err1 == 'ERR_CLASSIFICATION_NOT_SCORED' with HTTP 409 (coi_score is null, so the ruling has nothing to rest on)"
            - "err2 == 'ERR_CLASSIFICATION_ALREADY_RULED' with HTTP 409 - reconsider rejects a scope_ruling that is still PENDING"
            - "call 4 returns HTTP 200 with Classification.${cls_prod_id}.scope_ruling == 'INCLUDED'"
            - "err3 == 'ERR_CLASSIFICATION_ALREADY_RULED' with HTTP 409, NOT 'ERR_CLASSIFICATION_NOT_SCORED'"
            - "after call 6: Petition.${pet_id}.total_classified_headcount == 90, included_headcount == 60, excluded_headcount == 0, pending_headcount == 30"
            - "Classification.${cls_maint_id}.scope_ruling is still 'PENDING' and its coi_score is null"

      - name: the_reopen_limit_is_inclusive_at_two_per_ballot
        claim_type: Aggregate validation
        grounds:
          - validations[priority=24]
          - constants.MAX_BALLOT_REOPENS
          - errors.ERR_REOPEN_LIMIT_EXCEEDED
          - entities.ChallengedBallot.fields.reopen_count
        distinguishing_aspect: |
          The cap counts a per-row cumulative total, not consecutive attempts: two reopen/resolve cycles are
          permitted and the third reopen is refused once reopen_count has reached MAX_BALLOT_REOPENS (2).
          The refusal must be the loop-limit error and not ERR_BALLOT_STATUS_INVALID, because the ballot is
          legitimately resolved at that moment, and the round's nine buckets must still reconcile to 85.
