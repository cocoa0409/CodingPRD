      - name: stale_release_version_on_score_recalculation_returns_412
        claim_type: violation_to_error
        grounds:
          - concurrency_rules[score-recalc-stale-release]
          - validations[priority=6]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "OCC: a score-recalculation carrying the version observed before an intervening release transition is rejected 412 ERR_STALE_VERSION; carrying the fresh version succeeds."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; Title OPEN; R1 OPEN (version observed v1); an intervening transition CLOSE then... use one intervening mutation: observe version, then CLOSE the release, then recalculate with the stale version."
