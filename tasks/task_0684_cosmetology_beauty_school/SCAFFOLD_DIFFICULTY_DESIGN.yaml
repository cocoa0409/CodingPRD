scaffold_difficulty_design:
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: ledger_posted_vs_projected_on_enrollment
        grounds:
          - calculations.ledger_balance
          - calculations.projected_ledger
          - entities.Enrollment.fields.ledger_balance_cents
          - entities.Enrollment.fields.projected_balance_cents
        distinguishing_aspect: "On the Enrollment domain, ledger_balance_cents counts POSTED disbursement net only while projected_balance_cents also counts a still-SCHEDULED award, so the same enrollment reports 1400000 (final) vs 800000 (provisional)."
        test_recipe:
          setup:
            - "A Program (1500h, tuition 1200000, kit 150000, lab 50000) and an Enrollment with charges 1400000."
            - "One SCHEDULED disbursement (gross 600000, origination 0) that has NOT been posted."
          setup_api_calls:
            - call: "POST /school/programs"
              payload: { name: "Cosmetology 1500", total_clock_hours: 1500, tuition_cents: 1200000, kit_fee_cents: 150000, lab_fee_cents: 50000, clinic_phase_start_hour: 300 }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /school/students"
              payload: { full_name: "Ada Stylist", email: "ada@x.com", ssn_last4: "1234" }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /school/enrollments"
              payload: { student_id: "${stu_id}", program_id: "${prog_id}", enrolled_on_iso: "2026-04-01T00:00:00Z", scheduled_hours_to_date: 450 }
              as: Registrar
              captures: { enr_id: $.data.id }
            - call: "POST /school/disbursements"
              payload: { enrollment_id: "${enr_id}", payment_period: 1, period_hours: 400, period_weeks: 4, gross_amount_cents: 600000, origination_fee_cents: 0 }
              as: FinancialAidOfficer
              captures: { dis_id: $.data.id }
          trigger:
            - call: "GET /school/enrollments/${enr_id}"
              payload: {}
              as: Registrar
              captures: { ledger: $.data.ledger_balance_cents, projected: $.data.projected_balance_cents }
          assert:
            - "Enrollment.${enr_id}.ledger_balance_cents == 1400000"
            - "Enrollment.${enr_id}.projected_balance_cents == 800000"
            - "Enrollment.${enr_id}.ledger_balance_cents != Enrollment.${enr_id}.projected_balance_cents"

      - name: r2t4_scheduled_vs_institutional_actual_on_withdrawal
        grounds:
          - calculations.r2t4_return
          - calculations.institutional_refund
          - entities.Withdrawal.fields.title_iv_return_cents
          - entities.Withdrawal.fields.institutional_refund_cents
        distinguishing_aspect: "On the Withdrawal domain, title_iv_return_cents uses SCHEDULED hours (450/1500=30%) yielding 420000, while institutional_refund_cents uses ACTUAL hours (405/1500=27%) yielding 861000 — two valid bases produce different cents for one withdrawal."
        test_recipe:
          setup:
            - "Program 1500h, tuition 1200000, admin_fee_cap 15000; Enrollment scheduled_hours_to_date 450, actual_hours 405 (one approved attendance of 405h)."
            - "One POSTED disbursement net 600000."
            - "Clock at 2026-06-01 (8 weeks after enrollment)."
          setup_api_calls:
            - call: "POST /school/programs"
              payload: { name: "Cosmetology 1500", total_clock_hours: 1500, tuition_cents: 1200000, kit_fee_cents: 150000, lab_fee_cents: 50000, clinic_phase_start_hour: 300, admin_fee_cap_cents: 15000 }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /school/students"
              payload: { full_name: "Bea Nailtech", email: "bea@x.com", ssn_last4: "2222" }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /school/instructors"
              payload: { full_name: "Ivy Teach", license_number: "INS-1", license_expires_on: "2027-01-01T00:00:00Z", active: true }
              as: Registrar
              captures: { ins_id: $.data.id }
            - call: "POST /school/enrollments"
              payload: { student_id: "${stu_id}", program_id: "${prog_id}", enrolled_on_iso: "2026-04-01T00:00:00Z", scheduled_hours_to_date: 450 }
              as: Registrar
              captures: { enr_id: $.data.id }
            - call: "POST /school/attendance"
              payload: { enrollment_id: "${enr_id}", instructor_id: "${ins_id}", session_date_iso: "2026-05-01T00:00:00Z", scheduled_hours: 405, hours: 405 }
              as: Instructor
              as_user_id: "${ins_id}"
              captures: { att_id: $.data.id }
            - call: "POST /school/attendance/${att_id}/approve"
              payload: {}
              as: Instructor
              as_user_id: "${ins_id}"
              captures: { enr_v_a: $.data.version }
            - call: "POST /school/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FinancialAidOfficer
            - call: "POST /school/disbursements"
              payload: { enrollment_id: "${enr_id}", payment_period: 1, period_hours: 400, period_weeks: 4, gross_amount_cents: 600000, origination_fee_cents: 0 }
              as: FinancialAidOfficer
              captures: { dis_id: $.data.id }
            - call: "GET /school/enrollments/${enr_id}"
              payload: {}
              as: FinancialAidOfficer
              captures: { enr_v: $.data.version }
            - call: "POST /school/disbursements/${dis_id}/post"
              payload: { expected_enrollment_version: "${enr_v}" }
              as: FinancialAidOfficer
          trigger:
            - call: "POST /school/withdrawals"
              payload: { enrollment_id: "${enr_id}", withdrawal_type: "OFFICIAL", last_date_of_attendance_iso: "2026-05-01T00:00:00Z" }
              as: FinancialAidOfficer
              captures: { wd_id: $.data.id }
          assert:
            - "Withdrawal.${wd_id}.pct_completed == 30.00"
            - "Withdrawal.${wd_id}.title_iv_return_cents == 420000"
            - "Withdrawal.${wd_id}.institutional_refund_cents == 861000"
            - "Withdrawal.${wd_id}.title_iv_return_cents != Withdrawal.${wd_id}.institutional_refund_cents"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: clinic_pos_round_per_line_then_sum
        grounds:
          - calculations.clinic_pos_total
          - entities.ClinicTicket.fields.ticket_total_cents
          - state_machines.ClinicTicket.SIGNED_OFF_to_PAID
        distinguishing_aspect: "Mode (b) nested-rounding-order: per-line discount-then-round-then-sum of [4501,3301] at 0.50 yields 3902, whereas sum-then-round yields 3901; the scaffold pins per-line ordering so 3902 is correct."
        test_recipe:
          setup:
            - "An enrollment past clinic phase (actual_hours 320 >= clinic_phase_start_hour 300) so clinic sign-off is permitted."
            - "A HAIR station, supervising instructor with valid license, clock at 2026-06-01."
            - "A clinic ticket with line_items salon prices [4501, 3301] at clinic_discount_pct 0.50, signed off."
          setup_api_calls:
            - call: "POST /school/programs"
              payload: { name: "Cosmetology 1500", total_clock_hours: 1500, tuition_cents: 1200000, kit_fee_cents: 150000, lab_fee_cents: 50000, clinic_phase_start_hour: 300 }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /school/students"
              payload: { full_name: "Cy Clipper", email: "cy@x.com", ssn_last4: "3333" }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /school/instructors"
              payload: { full_name: "Ivy Teach", license_number: "INS-2", license_expires_on: "2027-01-01T00:00:00Z", active: true }
              as: Registrar
              captures: { ins_id: $.data.id }
            - call: "POST /school/stations"
              payload: { label: "Styling-12", station_type: "HAIR" }
              as: Registrar
              captures: { sta_id: $.data.id }
            - call: "POST /school/enrollments"
              payload: { student_id: "${stu_id}", program_id: "${prog_id}", enrolled_on_iso: "2026-04-01T00:00:00Z", scheduled_hours_to_date: 320 }
              as: Registrar
              captures: { enr_id: $.data.id }
            - call: "POST /school/attendance"
              payload: { enrollment_id: "${enr_id}", instructor_id: "${ins_id}", session_date_iso: "2026-05-01T00:00:00Z", scheduled_hours: 320, hours: 320 }
              as: Instructor
              as_user_id: "${ins_id}"
              captures: { att_id: $.data.id }
            - call: "POST /school/attendance/${att_id}/approve"
              payload: {}
              as: Instructor
              as_user_id: "${ins_id}"
            - call: "POST /school/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Registrar
            - call: "POST /school/clinic-tickets"
              payload: { enrollment_id: "${enr_id}", station_id: "${sta_id}", instructor_id: "${ins_id}", client_name: "Walk In", start_iso: "2026-06-01T10:00:00Z", end_iso: "2026-06-01T11:30:00Z", line_items: [ { service_code: "CUT", salon_price_cents: 4501 }, { service_code: "STYLE", salon_price_cents: 3301 } ], clinic_discount_pct: 0.50 }
              as: Instructor
              as_user_id: "${ins_id}"
              captures: { tic_id: $.data.id }
            - call: "POST /school/clinic-tickets/${tic_id}/sign-off"
              payload: {}
              as: Instructor
              as_user_id: "${ins_id}"
          trigger:
            - call: "POST /school/clinic-tickets/${tic_id}/pay"
              payload: {}
              as: Registrar
              captures: { total: $.data.ticket_total_cents }
          assert:
            - "ClinicTicket.${tic_id}.ticket_total_cents == 3902"
            - "ClinicTicket.${tic_id}.status == PAID"

      - name: exam_readiness_three_factor_gated_score
        grounds:
          - calculations.exam_readiness_score
          - entities.ExamApplication.fields.readiness_score
          - state_machines.ExamApplication.DRAFT_to_SUBMITTED
        distinguishing_aspect: "Mode (a) >=3-input non-linear interaction: readiness = 0.40*min(100,hours_pct) + 0.35*mock + 0.25*comp with per-term rounding; (90,85,100) yields exactly 90.75 via 36.00+29.75+25.00, and the min() clamp and per-term rounding distinguish it from a flat weighted average."
        test_recipe:
          setup:
            - "An enrollment with actual_hours 1350 (=90% of 1500) via one approved 1350h attendance record."
            - "A DRAFT exam application with mock_exam_avg 85 and competency_signoff_pct 100, owned by the student."
          setup_api_calls:
            - call: "POST /school/programs"
              payload: { name: "Cosmetology 1500", total_clock_hours: 1500, tuition_cents: 1200000, kit_fee_cents: 150000, lab_fee_cents: 50000, clinic_phase_start_hour: 300 }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /school/students"
              payload: { full_name: "Dot Dye", email: "dot@x.com", ssn_last4: "4444" }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /school/instructors"
              payload: { full_name: "Ivy Teach", license_number: "INS-3", license_expires_on: "2027-01-01T00:00:00Z", active: true }
              as: Registrar
              captures: { ins_id: $.data.id }
            - call: "POST /school/enrollments"
              payload: { student_id: "${stu_id}", program_id: "${prog_id}", enrolled_on_iso: "2026-04-01T00:00:00Z", scheduled_hours_to_date: 1400 }
              as: Registrar
              captures: { enr_id: $.data.id }
            - call: "POST /school/attendance"
              payload: { enrollment_id: "${enr_id}", instructor_id: "${ins_id}", session_date_iso: "2026-05-01T00:00:00Z", scheduled_hours: 1350, hours: 1350 }
              as: Instructor
              as_user_id: "${ins_id}"
              captures: { att_id: $.data.id }
            - call: "POST /school/attendance/${att_id}/approve"
              payload: {}
              as: Instructor
              as_user_id: "${ins_id}"
            - call: "POST /school/exam-applications"
              payload: { enrollment_id: "${enr_id}", exam_type: "WRITTEN", mock_exam_avg: 85, competency_signoff_pct: 100 }
              as: Student
              as_user_id: "${stu_id}"
              captures: { exa_id: $.data.id }
          trigger:
            - call: "POST /school/exam-applications/${exa_id}/submit"
              payload: {}
              as: Student
              as_user_id: "${stu_id}"
              captures: { score: $.data.readiness_score }
          assert:
            - "ExamApplication.${exa_id}.readiness_score == 90.75"
            - "ExamApplication.${exa_id}.status == SUBMITTED"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: exam_application_revision_cycle
        grounds:
          - state_machines.ExamApplication.SUBMITTED_to_RETURNED_FOR_REVISION
          - state_machines.ExamApplication.RETURNED_FOR_REVISION_to_SUBMITTED
        distinguishing_aspect: "ExamApplication is cyclic: SUBMITTED -> RETURNED_FOR_REVISION -> SUBMITTED, and the second submit recomputes readiness_score again, proving the loop reuses the transition rather than running linearly."
        test_recipe:
          setup:
            - "An enrollment with actual_hours 1350; a DRAFT exam application (mock 50, comp 100) owned by the student."
          setup_api_calls:
            - call: "POST /school/programs"
              payload: { name: "Cosmetology 1500", total_clock_hours: 1500, tuition_cents: 1200000, kit_fee_cents: 150000, lab_fee_cents: 50000, clinic_phase_start_hour: 300 }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /school/students"
              payload: { full_name: "Eve Edge", email: "eve@x.com", ssn_last4: "5555" }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /school/instructors"
              payload: { full_name: "Ivy Teach", license_number: "INS-4", license_expires_on: "2027-01-01T00:00:00Z", active: true }
              as: Registrar
              captures: { ins_id: $.data.id }
            - call: "POST /school/enrollments"
              payload: { student_id: "${stu_id}", program_id: "${prog_id}", enrolled_on_iso: "2026-04-01T00:00:00Z", scheduled_hours_to_date: 1400 }
              as: Registrar
              captures: { enr_id: $.data.id }
            - call: "POST /school/attendance"
              payload: { enrollment_id: "${enr_id}", instructor_id: "${ins_id}", session_date_iso: "2026-05-01T00:00:00Z", scheduled_hours: 1350, hours: 1350 }
              as: Instructor
              as_user_id: "${ins_id}"
              captures: { att_id: $.data.id }
            - call: "POST /school/attendance/${att_id}/approve"
              payload: {}
              as: Instructor
              as_user_id: "${ins_id}"
            - call: "POST /school/exam-applications"
              payload: { enrollment_id: "${enr_id}", exam_type: "WRITTEN", mock_exam_avg: 50, competency_signoff_pct: 100 }
              as: Student
              as_user_id: "${stu_id}"
              captures: { exa_id: $.data.id }
            - call: "POST /school/exam-applications/${exa_id}/submit"
              payload: {}
              as: Student
              as_user_id: "${stu_id}"
            - call: "POST /school/exam-applications/${exa_id}/return"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /school/exam-applications/${exa_id}/submit"
              payload: {}
              as: Student
              as_user_id: "${stu_id}"
              captures: { score: $.data.readiness_score }
          assert:
            - "ExamApplication.${exa_id}.status == SUBMITTED"
            - "ExamApplication.${exa_id}.readiness_score == 78.50"

      - name: enrollment_branching_fork_sap_vs_withdrawn
        grounds:
          - state_machines.Enrollment.ACTIVE_to_SAP_WARNING
          - state_machines.Enrollment.ACTIVE_to_WITHDRAWN
          - state_machines.Enrollment.ACTIVE_to_EXAM_PENDING
        distinguishing_aspect: "Enrollment forks from ACTIVE into divergent branches; the SAP_WARNING branch only bumps sap_warning_count while the WITHDRAWN branch cascades disbursement returns and station releases — different side-effect sets per branch on the same entity."
        test_recipe:
          setup:
            - "An ACTIVE enrollment with scheduled_hours_to_date 900 and actual_hours 600 (pace 66.67% < 67%)."
          setup_api_calls:
            - call: "POST /school/programs"
              payload: { name: "Cosmetology 1500", total_clock_hours: 1500, tuition_cents: 1200000, kit_fee_cents: 150000, lab_fee_cents: 50000, clinic_phase_start_hour: 300 }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /school/students"
              payload: { full_name: "Fay Fade", email: "fay@x.com", ssn_last4: "6666" }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /school/instructors"
              payload: { full_name: "Ivy Teach", license_number: "INS-5", license_expires_on: "2027-01-01T00:00:00Z", active: true }
              as: Registrar
              captures: { ins_id: $.data.id }
            - call: "POST /school/enrollments"
              payload: { student_id: "${stu_id}", program_id: "${prog_id}", enrolled_on_iso: "2026-04-01T00:00:00Z", scheduled_hours_to_date: 900 }
              as: Registrar
              captures: { enr_id: $.data.id }
            - call: "POST /school/attendance"
              payload: { enrollment_id: "${enr_id}", instructor_id: "${ins_id}", session_date_iso: "2026-05-01T00:00:00Z", scheduled_hours: 600, hours: 600 }
              as: Instructor
              as_user_id: "${ins_id}"
              captures: { att_id: $.data.id }
            - call: "POST /school/attendance/${att_id}/approve"
              payload: {}
              as: Instructor
              as_user_id: "${ins_id}"
          trigger:
            - call: "POST /school/enrollments/${enr_id}/evaluate-sap"
              payload: {}
              as: Registrar
              captures: { st: $.data.status, warns: $.data.sap_warning_count }
          assert:
            - "Enrollment.${enr_id}.status == SAP_WARNING"
            - "Enrollment.${enr_id}.sap_warning_count == 1"
            - "Enrollment.${enr_id}.pace_pct == 66.67"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: withdrawal_finalize_depth3_cascade
        grounds:
          - state_machines.Withdrawal
          - state_machines.Enrollment.ACTIVE_to_WITHDRAWN
          - state_machines.Disbursement.POSTED_to_RETURNED
          - entities.Enrollment.fields.ledger_balance_cents
        distinguishing_aspect: "Depth-3 chain: finalize Withdrawal -> Enrollment ACTIVE->WITHDRAWN -> that withdrawal causes POSTED Disbursement->RETURNED -> the RETURN itself debits Enrollment.total_credits_cents and recomputes ledger_balance_cents back to 1400000; each link is caused by the previous."
        test_recipe:
          setup:
            - "Enrollment with one POSTED disbursement (net 600000), ledger_balance 800000, clock 2026-06-01."
          setup_api_calls:
            - call: "POST /school/programs"
              payload: { name: "Cosmetology 1500", total_clock_hours: 1500, tuition_cents: 1200000, kit_fee_cents: 150000, lab_fee_cents: 50000, clinic_phase_start_hour: 300 }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /school/students"
              payload: { full_name: "Gus Gel", email: "gus@x.com", ssn_last4: "7777" }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /school/instructors"
              payload: { full_name: "Ivy Teach", license_number: "INS-6", license_expires_on: "2027-01-01T00:00:00Z", active: true }
              as: Registrar
