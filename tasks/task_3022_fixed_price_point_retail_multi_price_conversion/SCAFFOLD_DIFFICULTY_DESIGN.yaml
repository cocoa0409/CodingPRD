              as: StoreOperationsManager
              captures: { store_id: $.data.id }
            - call: "POST /merchandise/stores/${store_id}/conversions"
              payload: { to_price_point_id: "${pp300_id}" }
              as: StoreOperationsManager
            - call: "POST /merchandise/season-windows"
              payload: { season_code: "HARVEST_2026", opens_on: "2026-09-01T00:00:00Z", closes_on: "2026-11-30T00:00:00Z" }
              as: ResetCalendarPlanner
              captures: { window_id: $.data.id }
            - call: "POST /merchandise/season-windows/${window_id}/schedule"
              payload: {}
              as: ResetCalendarPlanner
            - call: "POST /merchandise/aisle-resets"
              payload: { store_id: "${store_id}", price_point_id: "${pp300_id}", season_window_id: "${window_id}", aisle_code: "A14", starts_at: "2026-09-05T00:00:00Z", ends_at: "2026-09-20T00:00:00Z", allocated_shelf_sqft: 200.0, seasonal_changeover: true }
              as: ResetCalendarPlanner
              captures: { reset_existing_id: $.data.id }
          trigger:
            - call: "POST /merchandise/aisle-resets"
              payload: { store_id: "${store_id}", price_point_id: "${pp125_id}", season_window_id: "${window_id}", aisle_code: "A14", starts_at: "2026-09-15T00:00:00Z", ends_at: "2026-09-25T00:00:00Z", allocated_shelf_sqft: 100.0, seasonal_changeover: true }
              as: ResetCalendarPlanner
              captures: { err_both: $.data.error_id }
            - call: "POST /merchandise/aisle-resets"
              payload: { store_id: "${store_id}", price_point_id: "${pp125_id}", season_window_id: "${window_id}", aisle_code: "A15", starts_at: "2026-09-15T00:00:00Z", ends_at: "2026-09-25T00:00:00Z", allocated_shelf_sqft: 100.0, seasonal_changeover: true }
              as: ResetCalendarPlanner
              captures: { err_ref_only: $.data.error_id }
          assert:
            - "the first request returns 409 and err_both == ERR_AISLE_RESET_OVERLAP, never ERR_PRICE_POINT_MIXED_WITHIN_CONVERSION"
            - "the first payload violates priority 12 and priority 19 at once — A14 overlaps an existing PLANNED reset AND 125 cents differs from the store's conversion_price_point_id of ${pp300_id}"
            - "the second request, which removes the overlap by moving to A15, returns 409 and err_ref_only == ERR_PRICE_POINT_MIXED_WITHIN_CONVERSION"
            - "GET /merchandise/stores/${store_id}/aisle-resets returns exactly 1 row — neither rejected request persisted a reset"
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:

      - name: three_scalar_threshold_boundaries_first_true_at_k
        grounds:
          - calculations.landed_cost_target_ceiling
          - calculations.price_integrity_result
          - calculations.conversion_coverage_shortfall
          - entities.PriceIntegrityAudit.fields.result
          - entities.ExclusivePackProgram.fields.target_landed_cost_cents
        distinguishing_aspect: "Three scalar thresholds on three different metrics, each reached through its own endpoint, and each pinned to the pair of values that straddle the branch rather than to a single sample: the pack landing ceiling is inclusive at 123 and rejects at 124, the price-integrity tolerance is inclusive at the ROUNDED 0.052 (5 mismatches over 96 facings) and rejects at 0.063, and the aisle coverage floor is hit by a running store-day sum where 130.0 + 130.0 + 130.0 == 390.0 passes against a 400.0 store ceiling and a fourth 130.0 reset fails at 520.0."
        test_recipe:
          setup:
            - "Logical clock at its 2026-09-01T00:00:00Z default. PricePoint FOUR_DOLLAR at 400 cents with target_landed_cost_ratio 0.35 (ceiling 123). PricePoint DOLLAR_25 at 125 cents with target_landed_cost_ratio 0.90."
