              captures: { cand_id: $.data.id }
            - call: "POST /assets/${footage_id}/select-source"
              payload: { source_candidate_id: "${cand_id}" }
              as: ArchiveResearcher
          trigger:
            - call: "POST /licenses"
              payload: { production_id: "${prod_id}", asset_id: "${music_id}", archive_id: "${arch_id}", rights_leg: "FOOTAGE", media: "BROADCAST", territory: "WORLD", window_class: "ALL_MEDIA_WINDOW", term_months: 12, term_start_date: "2026-08-15", term_end_date: "2027-08-15" }
              as: ClearanceSupervisor
            - call: "POST /licenses"
              payload: { production_id: "${prod_id}", asset_id: "${footage_id}", archive_id: "${arch_id}", rights_leg: "MASTER", media: "BROADCAST", territory: "WORLD", window_class: "ALL_MEDIA_WINDOW", term_months: 12, term_start_date: "2026-08-15", term_end_date: "2027-08-15" }
              as: ClearanceSupervisor
            - call: "POST /licenses"
              payload: { production_id: "${prod_id}", asset_id: "${music_id}", archive_id: "${arch_id}", rights_leg: "MASTER", media: "BROADCAST", territory: "WORLD", window_class: "ALL_MEDIA_WINDOW", term_months: 12, term_start_date: "2026-08-15", term_end_date: "2027-08-15" }
              as: ClearanceSupervisor
          assert:
            - "FOOTAGE leg on the MUSIC asset returns 422 ERR_MUSIC_LEG_REQUIRED"
            - "MASTER leg on the ARCHIVAL_FOOTAGE asset returns 422 ERR_MUSIC_LEG_REQUIRED (the same rule, opposite direction)"
            - "MASTER leg on the MUSIC asset returns 201 — the condition is satisfied and no ERR_NO_SELECTED_SOURCE is raised because priority 13 scopes itself to FOOTAGE legs"
            - "Asset.${music_id}.licensing_status == IN_NEGOTIATION after the accepted call; Asset.${footage_id}.licensing_status is still UNCLEARED"
            - "Production.${prod_id}.committed_fee_cents == 0 — no licence has been executed"

      - name: footage_license_needs_a_selected_source_from_the_named_archive
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=13]
          - entities.SourceCandidate.fields.selection_status
          - entities.Asset.fields.selected_source_candidate_id
        distinguishing_aspect: "Priority 13 is a two-part cross-entity check on a DIFFERENT entity than the request body names: a FOOTAGE leg fails when the asset has no SELECTED candidate at all AND fails again when a SELECTED candidate exists but belongs to a different archive than License.archive_id."
        test_recipe:
          setup: ["A production in CLEARANCE with one 45-second footage asset and two ACTIVE archives, each with an ACTIVE rate card. The asset has one AVAILABLE candidate at archive A only."]
          setup_api_calls:
