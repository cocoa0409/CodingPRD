  # ===================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===================================================================
  - rule_id: compensating_invariant
    instances:
      - name: book_cancel_roundtrip_preserves_capacity
        grounds:
          - entities.CapacityDay.fields.booked_head
          - state_machines.Appointment.PENDING_DEPOSIT_to_CANCELLED
          - state_machines.Appointment.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: kill slots — CapacityDay.booked_head always
          equals the sum of head_count over appointments with status IN
          {PENDING_DEPOSIT, CONFIRMED}; a book-then-cancel round trip leaves
          the day's booked_head identical to before the pair.
        test_recipe:
          setup:
            - "Clock default; c1 ACTIVE; CapacityDay 2026-08-20 cap 3, booked_head 0"
          setup_api_calls:
            - { call: "POST /locker/customers", payload: { name: "Ann Orr", phone: "555-0101", email: "ann@x.com" }, as: PlantOperator, captures: { c1: $.data.id } }
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-20", capacity_head: 3 }, as: PlantManager, captures: { cd1: $.data.id } }
          trigger:
            - { call: "POST /locker/appointments", payload: { customer_id: "${c1}", capacity_day_id: "${cd1}", species: "BEEF", head_count: 2 }, as: Customer, as_user_id: "${c1}", captures: { appt1: $.data.id } }
            - { call: "GET /locker/capacity-days", payload: { date_from: "2026-08-20", date_to: "2026-08-20" }, as: PlantOperator, captures: { booked_mid: "$.data[0].booked_head" } }
            - { call: "POST /locker/appointments/${appt1}/cancel", payload: {}, as: Customer, as_user_id: "${c1}", captures: { refund1: $.data.refund_cents } }
            - { call: "POST /locker/appointments", payload: { customer_id: "${c1}", capacity_day_id: "${cd1}", species: "BEEF", head_count: 3 }, as: Customer, as_user_id: "${c1}", captures: { appt2: $.data.id } }
            - { call: "POST /locker/appointments/${appt2}/pay-deposit", payload: { amount_cents: 45000 }, as: Customer, as_user_id: "${c1}" }
            - { call: "POST /locker/appointments/${appt2}/cancel", payload: {}, as: Customer, as_user_id: "${c1}", captures: { refund2: $.data.refund_cents } }
            - { call: "GET /locker/capacity-days", payload: { date_from: "2026-08-20", date_to: "2026-08-20" }, as: PlantOperator, captures: { booked_end: "$.data[0].booked_head", st_end: "$.data[0].status" } }
          assert:
            - "after first booking booked_head == 2"
            - "after both cancel round trips booked_head == 0 and status == OPEN (invariant: booked_head == sum of head_count over PENDING_DEPOSIT + CONFIRMED == 0)"
            - "PENDING cancel refund_cents == 0; CONFIRMED cancel >= 7 days out refund_cents == 45000 (full deposit returned)"

      - name: share_create_delete_roundtrip_preserves_unallocated_fraction
        grounds:
          - entities.CarcassShare.fields.share_fraction
          - entities.Animal.fields.hanging_weight_lbs
          - errors[ERR_SPLIT_UNDER_ALLOCATED]
        distinguishing_aspect: |
          Conserved quantity: unallocated carcass fraction/weight — creating
          then deleting a PENDING share leaves the animal's allocated fraction
          and hanging_weight_lbs exactly as before; finalize only balances when
          the surviving shares sum to exactly 1.0. Different conserved quantity
          than kill slots.
        test_recipe:
          setup:
            - "Clock default; c1, c2 ACTIVE; CapacityDay 2026-08-20 cap 1; confirmed HOG appointment; animal HANGING at 300.0 lb (live 400.0)"
          setup_api_calls:
            - { call: "POST /locker/customers", payload: { name: "Ann Orr", phone: "555-0101", email: "ann@x.com" }, as: PlantOperator, captures: { c1: $.data.id } }
            - { call: "POST /locker/customers", payload: { name: "Bob Venn", phone: "555-0102", email: "bob@x.com" }, as: PlantOperator, captures: { c2: $.data.id } }
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-20", capacity_head: 1 }, as: PlantManager, captures: { cd1: $.data.id } }
            - { call: "POST /locker/appointments", payload: { customer_id: "${c1}", capacity_day_id: "${cd1}", species: "HOG", head_count: 1 }, as: Customer, as_user_id: "${c1}", captures: { appt: $.data.id } }
            - { call: "POST /locker/appointments/${appt}/pay-deposit", payload: { amount_cents: 7500 }, as: Customer, as_user_id: "${c1}" }
            - { call: "GET /locker/appointments/${appt}/animals", payload: {}, as: PlantOperator, captures: { an1: "$.data[0].id" } }
            - { call: "POST /locker/animals/${an1}/receive", payload: { tag_id: "TAG-H1", live_weight_lbs: 400.0 }, as: PlantOperator }
            - { call: "POST /locker/animals/${an1}/slaughter", payload: {}, as: PlantOperator }
            - { call: "POST /locker/animals/${an1}/weigh", payload: { hanging_weight_lbs: 300.0 }, as: PlantOperator }
          trigger:
            - { call: "POST /locker/animals/${an1}/shares", payload: { owner_customer_id: "${c1}", share_fraction: 0.5, intended_use: "OWNER_USE" }, as: Customer, as_user_id: "${c1}", captures: { s_tmp: $.data.id } }
            - { call: "DELETE /locker/shares/${s_tmp}", payload: {}, as: Customer, as_user_id: "${c1}" }
            - { call: "POST /locker/animals/${an1}/shares/finalize", payload: {}, as: PlantOperator, captures: { err: $.data.error_id } }
            - { call: "POST /locker/animals/${an1}/shares", payload: { owner_customer_id: "${c1}", share_fraction: 0.6, intended_use: "OWNER_USE" }, as: Customer, as_user_id: "${c1}", captures: { s1: $.data.id } }
            - { call: "POST /locker/animals/${an1}/shares", payload: { owner_customer_id: "${c2}", share_fraction: 0.4, intended_use: "OWNER_USE" }, as: Customer, as_user_id: "${c1}", captures: { s2: $.data.id } }
            - { call: "POST /locker/animals/${an1}/shares/finalize", payload: {}, as: PlantOperator }
            - { call: "GET /locker/animals/${an1}", payload: {}, as: PlantOperator, captures: { an_w: $.data.hanging_weight_lbs } }
            - { call: "GET /locker/shares/${s1}", payload: {}, as: PlantOperator, captures: { s1_w: $.data.share_hanging_weight_lbs } }
            - { call: "GET /locker/shares/${s2}", payload: {}, as: PlantOperator, captures: { s2_w: $.data.share_hanging_weight_lbs } }
          assert:
            - "after create+delete round trip, finalize rejected ERR_SPLIT_UNDER_ALLOCATED (allocated fraction back to 0)"
            - "Animal.hanging_weight_lbs == 300.0 throughout (unchanged by share churn)"
            - "after allocating 0.6 + 0.4, finalize succeeds: share weights 180.0 and 120.0, summing exactly to 300.0"
