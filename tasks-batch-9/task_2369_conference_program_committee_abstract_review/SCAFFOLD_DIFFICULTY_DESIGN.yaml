  # ===========================================================================
  # RULE 6 — boundary_precision_check  (3 instances; three DIFFERENT metrics -
  #          score_spread / provisional rounding, CME credit floor, session
  #          packing minutes - on three DIFFERENT endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: score_spread_exactly_at_threshold_versus_one_hundredth_below
        grounds:
          - calculations.abstract_score_spread
          - calculations.review_weighted_score
          - calculations.abstract_consensus_score
          - entities.Abstract.fields.score_spread
          - entities.DiscrepancyCase.fields.spread_at_open
          - endpoints.POST./reviews/{reviewId}/submission
        distinguishing_aspect: |
          Two abstracts differ by one hundredth of a point. On abstract X the
          second review lands at 2.60 against a 4.10 first review: the spread is
          exactly 1.50, which equals discrepancy_threshold, so a DiscrepancyCase
          IS opened (the comparison is >=, not >). On abstract Y the second
          reviewer carries calibration_bias 0.01, so the review lands at 2.61 and
          the spread is 1.49: NO case is opened. Y also pins the rounding mode -
          its provisional mean is exactly 3.355 and must round_half_up to 3.36,
          never truncate to 3.35.
        test_recipe:
          setup:
            - "Clock 2026-01-05T00:00:00Z; Conference GOS26 at REVIEW_OPEN."
            - "Category EDU with min_reviews_required 2 and discrepancy_threshold 1.50."
            - "Reviewer Rui and reviewer Mei carry calibration_bias 0.00; reviewer Nadia carries calibration_bias 0.01."
            - "Abstract X by Ada and abstract Y by Ben each already hold ONE submitted review from Rui scoring 5/4/3/3 HIGH, i.e. weighted_score 4.10, so both abstracts are still UNDER_REVIEW with score_spread null."
            - "Mei is assigned to X and Nadia is assigned to Y, both still ASSIGNED."
