scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: provider_create_returns_all_declared_fields_and_starts_onboarding
        claim_type: Creation
        grounds:
          - entities.Provider
          - endpoints.POST_/clearinghouse/providers
        distinguishing_aspect: "A provider registered with only the four required inputs comes back 201 with status ONBOARDING, version 1, account_balance_cents 0, volume_tier_code TIER_1, and system-generated id / created_at / updated_at — status is never client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /clearinghouse/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClearinghouseOps
          trigger:
            - call: "POST /clearinghouse/providers"
              payload: { legal_name: "Onboard Health", tax_identification_number: "101010101", national_provider_identifier: "1101010105", billing_model: "PROVIDER_FUNDED" }
              as: ClearinghouseOps
              captures: { prov_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Provider.${prov_id}.status == ONBOARDING"
            - "Provider.${prov_id}.version == 1"
            - "Provider.${prov_id}.account_balance_cents == 0"
            - "Provider.${prov_id}.volume_tier_code == TIER_1"
            - "the response data carries non-null id, created_at, updated_at"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: payer_get_returns_stored_configuration_unchanged
        claim_type: Retrieval
        grounds:
          - entities.Payer
          - endpoints.GET_/clearinghouse/payers/{payerId}
        distinguishing_aspect: "Every Payer configuration field round-trips through GET exactly as posted, including the optional shared_provider_pct when pricing_model is SHARED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /clearinghouse/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClearinghouseOps
            - call: "POST /clearinghouse/payers"
              payload: { payer_id_code: "PAYRT", display_name: "Round Trip Payer", claims_lead_time_days: 7, remittance_lead_time_days: 9, eligibility_lead_time_seconds: 90, pricing_model: "SHARED", shared_provider_pct: 0.6, monthly_minimum_cents: 500 }
              as: ClearinghouseOps
              captures: { pay_id: $.data.id }
          trigger:
            - call: "GET /clearinghouse/payers/${pay_id}"
              payload: {}
              as: ClearinghouseOps
          assert:
            - "the response status is 200"
            - "Payer.${pay_id}.payer_id_code == \"PAYRT\""
            - "Payer.${pay_id}.claims_lead_time_days == 7 and remittance_lead_time_days == 9 and eligibility_lead_time_seconds == 90"
            - "Payer.${pay_id}.shared_provider_pct == 0.6"
            - "Payer.${pay_id}.monthly_minimum_cents == 500"
            - "Payer.${pay_id}.connectivity_status == ONLINE (system-initialized)"

      - name: providers_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/clearinghouse/providers
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three providers on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns the remaining 1 row with has_more false; default limit is 10."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Three providers created."
          setup_api_calls:
            - call: "POST /clearinghouse/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClearinghouseOps
            - call: "POST /clearinghouse/providers"
              payload: { legal_name: "P1", tax_identification_number: "111111111", national_provider_identifier: "1111111116", billing_model: "PROVIDER_FUNDED" }
              as: ClearinghouseOps
            - call: "POST /clearinghouse/providers"
              payload: { legal_name: "P2", tax_identification_number: "222222222", national_provider_identifier: "1222222225", billing_model: "PAYER_FUNDED" }
              as: ClearinghouseOps
            - call: "POST /clearinghouse/providers"
              payload: { legal_name: "P3", tax_identification_number: "333333333", national_provider_identifier: "1333333334", billing_model: "HYBRID" }
              as: ClearinghouseOps
          trigger:
            - call: "GET /clearinghouse/providers"
              payload: { limit: 2, offset: 0 }
              as: ClearinghouseOps
          assert:
            - "the response status is 200 and response_type is array"
            - "exactly 2 rows returned with total_count == 3 and has_more == true"
            - "GET /clearinghouse/providers?limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /clearinghouse/providers with no query parameters returns 3 rows"

      - name: claim_get_with_unknown_id_returns_claim_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/clearinghouse/claims/{claimId}
          - errors.ERR_CLAIM_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated claim id produces the entity-specific 404 ERR_CLAIM_NOT_FOUND, not a generic 404."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /clearinghouse/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClearinghouseOps
          trigger:
            - call: "GET /clearinghouse/claims/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ClearinghouseOps
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_CLAIM_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: provider_create_missing_tin_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Provider.fields.tax_identification_number
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "tax_identification_number is a required input with no default; omitting it entirely is a 400 ERR_INVALID_REQUEST from the required-field check."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /clearinghouse/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClearinghouseOps
          trigger:
            - call: "POST /clearinghouse/providers"
              payload: { legal_name: "No TIN", national_provider_identifier: "1101010105", billing_model: "PROVIDER_FUNDED" }
              as: ClearinghouseOps
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /clearinghouse/providers returns 0 rows"

      - name: payer_create_omitting_monthly_minimum_defaults_to_zero
        claim_type: Defaults
        grounds:
          - entities.Payer.fields.monthly_minimum_cents
        distinguishing_aspect: "monthly_minimum_cents declares default 0; omitting it stores 0 rather than null."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /clearinghouse/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClearinghouseOps
          trigger:
            - call: "POST /clearinghouse/payers"
              payload: { payer_id_code: "PAYDF", display_name: "Default Payer", claims_lead_time_days: 5, remittance_lead_time_days: 5, eligibility_lead_time_seconds: 60, pricing_model: "PROVIDER_FUNDED" }
              as: ClearinghouseOps
              captures: { pay_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Payer.${pay_id}.monthly_minimum_cents == 0"

      - name: provider_create_volume_tier_code_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.Provider.fields.volume_tier_code
        distinguishing_aspect: "volume_tier_code is source: computed. A client that supplies it in the create payload is ignored — the server stores TIER_1 regardless."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /clearinghouse/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClearinghouseOps
          trigger:
            - call: "POST /clearinghouse/providers"
              payload: { legal_name: "Computed Provider", tax_identification_number: "454545454", national_provider_identifier: "1454545457", billing_model: "PROVIDER_FUNDED", volume_tier_code: "TIER_3" }
              as: ClearinghouseOps
              captures: { prov_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Provider.${prov_id}.volume_tier_code == TIER_1 — input value ignored"

      - name: payer_create_with_out_of_enum_pricing_model_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Payer.fields.pricing_model
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "pricing_model is a closed enum {PAYER_FUNDED, PROVIDER_FUNDED, SHARED}; a value such as CAPITATED is rejected with 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /clearinghouse/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClearinghouseOps
          trigger:
            - call: "POST /clearinghouse/payers"
              payload: { payer_id_code: "PAYEN", display_name: "Enum Payer", claims_lead_time_days: 5, remittance_lead_time_days: 5, eligibility_lead_time_seconds: 60, pricing_model: "CAPITATED" }
              as: ClearinghouseOps
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /clearinghouse/payers returns 0 rows"

      - name: enrollment_create_requires_provider_in_path_to_exist
        claim_type: Parent Relationships
        grounds:
          - validations.priority_3_existence
          - endpoints.POST_/clearinghouse/providers/{providerId}/enrollments
          - errors.ERR_PROVIDER_NOT_FOUND
        distinguishing_aspect: "Hybrid topology puts provider id in the URL path; an unknown provider id produces 404 ERR_PROVIDER_NOT_FOUND before any body validation runs."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A payer exists."
          setup_api_calls:
            - call: "POST /clearinghouse/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClearinghouseOps
            - call: "POST /clearinghouse/payers"
              payload: { payer_id_code: "PAYPT", display_name: "Parent Payer", claims_lead_time_days: 5, remittance_lead_time_days: 5, eligibility_lead_time_seconds: 60, pricing_model: "PROVIDER_FUNDED" }
              as: ClearinghouseOps
              captures: { pay_id: $.data.id }
          trigger:
            - call: "POST /clearinghouse/providers/00000000-0000-4000-8000-000000000000/enrollments"
              payload: { payer_id: "${pay_id}", transaction_type: "CLAIMS_837" }
              as: ProviderAdmin
              as_user_id: "00000000-0000-4000-8000-000000000000"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_PROVIDER_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: claim_terminal_rejected_clearinghouse_accepts_no_further_transitions
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Claim
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Once a claim reaches REJECTED_CLEARINGHOUSE (terminal), any further state-transition call returns 409 ERR_INVALID_STATE — no transition is defined out of a terminal state."
        test_recipe:
          setup:
            - "Provider prov_a ACTIVE with credential; Payer pay_a APPROVED for CLAIMS_837; payer has a strict edit rule that the claim will fail."
            - "Claim clm has reached REJECTED_CLEARINGHOUSE."
          setup_api_calls:
            - call: "POST /clearinghouse/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClearinghouseOps
            - call: "POST /clearinghouse/providers"
              payload: { legal_name: "Terminal Provider", tax_identification_number: "565656565", national_provider_identifier: "1565656565", billing_model: "PROVIDER_FUNDED" }
              as: ClearinghouseOps
              captures: { prov_a: $.data.id }
            - call: "POST /clearinghouse/providers/${prov_a}/credentials"
              payload: { submitter_id: "SUB-TR1", trading_partner_agreement_ref: "TPA-TR1", effective_at: "2026-09-01T00:00:00Z", expires_at: "2027-09-01T00:00:00Z" }
              as: ProviderAdmin
              as_user_id: "${prov_a}"
              captures: { cred_a: $.data.id }
            - call: "POST /clearinghouse/providers/${prov_a}/credentials/${cred_a}/submit"
              payload: {}
              as: ProviderAdmin
              as_user_id: "${prov_a}"
            - call: "POST /clearinghouse/providers/${prov_a}/activate"
              payload: {}
              as: ClearinghouseOps
            - call: "POST /clearinghouse/payers"
              payload: { payer_id_code: "PAYTM", display_name: "Terminal Payer", claims_lead_time_days: 5, remittance_lead_time_days: 5, eligibility_lead_time_seconds: 60, pricing_model: "PROVIDER_FUNDED" }
              as: ClearinghouseOps
              captures: { pay_a: $.data.id }
            - call: "POST /clearinghouse/payers/${pay_a}/edit-rules"
              payload: { rule_code: "DX_REQUIRED", applies_to: "CLAIM_INTAKE", severity: "ERROR", expression: "diagnosis_codes.nonempty", effective_from: "2026-01-01T00:00:00Z" }
              as: ClearinghouseOps
            - call: "POST /clearinghouse/providers/${prov_a}/enrollments"
              payload: { payer_id: "${pay_a}", transaction_type: "CLAIMS_837" }
              as: ProviderAdmin
              as_user_id: "${prov_a}"
              captures: { enr_a: $.data.id }
            - call: "POST /clearinghouse/providers/${prov_a}/enrollments/${enr_a}/submit"
              payload: {}
              as: ProviderAdmin
              as_user_id: "${prov_a}"
            - call: "POST /clearinghouse/_enrollments/${enr_a}/advance-to-review"
              payload: {}
              as: ClearinghouseOps
            - call: "GET /clearinghouse/providers/${prov_a}/enrollments/${enr_a}"
              payload: {}
              as: ProviderAdmin
              as_user_id: "${prov_a}"
              captures: { enr_v: $.data.version }
            - call: "POST /clearinghouse/enrollments/${enr_a}/payer-decision"
              payload: { decision: "APPROVE", expected_enrollment_version: "${enr_v}" }
              as: PayerOperator
              as_user_id: "${pay_a}"
            - call: "POST /clearinghouse/providers/${prov_a}/claims"
              payload: { payer_id: "${pay_a}", submitter_credential_id: "${cred_a}", patient_control_number: "PCN-TR1", idempotency_key: "IDEM-TR1", service_date: "2026-09-01T00:00:00Z", total_charge_cents: 100, diagnosis_codes: [], rendering_npi: "1565656565", subscriber_id: "MBR-TR", lines: [{ cpt_code: "99213", units: 1, unit_charge_cents: 100 }] }
              as: ProviderAdmin
              as_user_id: "${prov_a}"
              captures: { clm_a: $.data.id, clm_v: $.data.version }
          trigger:
            - call: "POST /clearinghouse/claims/${clm_a}/forward"
              payload: { expected_claim_version: "${clm_v}" }
              as: ClearinghouseOps
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "Claim.${clm_a}.acceptance_status remains REJECTED_CLEARINGHOUSE"

      - name: eligibility_inquiry_responded_accepts_no_second_response
        claim_type: Idempotency
        grounds:
          - state_machines.EligibilityInquiry
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Responding to an inquiry that is already RESPONDED (terminal) is rejected — the same 271 callback replayed does not silently overwrite the response."
        test_recipe:
          setup:
            - "Provider prov_a ACTIVE; Payer pay_a APPROVED for ELIGIBILITY_270; EligibilityInquiry inq is RESPONDED."
          setup_api_calls:
            - call: "POST /clearinghouse/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClearinghouseOps
            - call: "POST /clearinghouse/providers"
              payload: { legal_name: "Idem Provider", tax_identification_number: "676767676", national_provider_identifier: "1676767674", billing_model: "PROVIDER_FUNDED" }
              as: ClearinghouseOps
              captures: { prov_a: $.data.id }
            - call: "POST /clearinghouse/providers/${prov_a}/credentials"
              payload: { submitter_id: "SUB-ID1", trading_partner_agreement_ref: "TPA-ID1", effective_at: "2026-09-01T00:00:00Z", expires_at: "2027-09-01T00:00:00Z" }
              as: ProviderAdmin
              as_user_id: "${prov_a}"
              captures: { cred_a: $.data.id }
            - call: "POST /clearinghouse/providers/${prov_a}/credentials/${cred_a}/submit"
              payload: {}
              as: ProviderAdmin
              as_user_id: "${prov_a}"
            - call: "POST /clearinghouse/providers/${prov_a}/activate"
              payload: {}
              as: ClearinghouseOps
            - call: "POST /clearinghouse/payers"
              payload: { payer_id_code: "PAYID", display_name: "Idem Payer", claims_lead_time_days: 5, remittance_lead_time_days: 5, eligibility_lead_time_seconds: 3600, pricing_model: "PROVIDER_FUNDED" }
              as: ClearinghouseOps
              captures: { pay_a: $.data.id }
            - call: "POST /clearinghouse/providers/${prov_a}/enrollments"
              payload: { payer_id: "${pay_a}", transaction_type: "ELIGIBILITY_270" }
              as: ProviderAdmin
              as_user_id: "${prov_a}"
              captures: { enr_e: $.data.id }
            - call: "POST /clearinghouse/providers/${prov_a}/enrollments/${enr_e}/submit"
              payload: {}
              as: ProviderAdmin
              as_user_id: "${prov_a}"
            - call: "POST /clearinghouse/_enrollments/${enr_e}/advance-to-review"
              payload: {}
              as: ClearinghouseOps
            - call: "GET /clearinghouse/providers/${prov_a}/enrollments/${enr_e}"
              payload: {}
              as: ProviderAdmin
              as_user_id: "${prov_a}"
              captures: { enr_e_v: $.data.version }
            - call: "POST /clearinghouse/enrollments/${enr_e}/payer-decision"
              payload: { decision: "APPROVE", expected_enrollment_version: "${enr_e_v}" }
              as: PayerOperator
              as_user_id: "${pay_a}"
            - call: "POST /clearinghouse/providers/${prov_a}/eligibility"
              payload: { payer_id: "${pay_a}", subscriber_id: "MBR-ID", service_type_code: "30", idempotency_key: "IDEM-EL1" }
              as: ProviderAdmin
              as_user_id: "${prov_a}"
              captures: { inq_a: $.data.id }
            - call: "POST /clearinghouse/eligibility/${inq_a}/respond"
              payload: { benefit_summary: { coverage: "ACTIVE" } }
              as: PayerOperator
              as_user_id: "${pay_a}"
          trigger:
            - call: "POST /clearinghouse/eligibility/${inq_a}/respond"
              payload: { benefit_summary: { coverage: "INACTIVE" } }
              as: PayerOperator
              as_user_id: "${pay_a}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "EligibilityInquiry.${inq_a}.benefit_summary.coverage is still \"ACTIVE\" — the second response did not overwrite the first"

      - name: claim_intake_without_enrollment_never_leaves_validating
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Claim.transitions.VALIDATING_to_ACCEPTED
          - validations.priority_10_business_referential
          - errors.ERR_ENROLLMENT_NOT_APPROVED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / enrollment_referential_trumps_fiscal_total_mismatch
          rationale: "Already exercised as the failure path of the named §1.8 instance."

      - name: claim_rejection_returns_clearinghouse_origin_payload
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Claim.transitions.VALIDATING_to_REJECTED_CLEARINGHOUSE
          - entities.Claim.fields.rejection_payload
        distinguishing_aspect: "A clearinghouse-side rejection writes rejection_payload with origin=CLEARINGHOUSE — distinct from a payer-side rejection (origin=PAYER). The origin field is the rejection-vs-denial distinction the scenario demands."
        test_recipe:
          setup:
            - "Provider, payer, CLAIMS_837 enrollment APPROVED; payer has ERROR edit rule the claim will fail."
          setup_api_calls:
            - call: "POST /clearinghouse/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClearinghouseOps
            - call: "POST /clearinghouse/providers"
              payload: { legal_name: "Origin Provider", tax_identification_number: "787878787", national_provider_identifier: "1787878783", billing_model: "PROVIDER_FUNDED" }
              as: ClearinghouseOps
              captures: { prov_a: $.data.id }
            - call: "POST /clearinghouse/providers/${prov_a}/credentials"
              payload: { submitter_id: "SUB-OR1", trading_partner_agreement_ref: "TPA-OR1", effective_at: "2026-09-01T00:00:00Z", expires_at: "2027-09-01T00:00:00Z" }
              as: ProviderAdmin
              as_user_id: "${prov_a}"
              captures: { cred_a: $.data.id }
            - call: "POST /clearinghouse/providers/${prov_a}/credentials/${cred_a}/submit"
              payload: {}
              as: ProviderAdmin
              as_user_id: "${prov_a}"
            - call: "POST /clearinghouse/providers/${prov_a}/activate"
              payload: {}
              as: ClearinghouseOps
            - call: "POST /clearinghouse/payers"
              payload: { payer_id_code: "PAYOG", display_name: "Origin Payer", claims_lead_time_days: 5, remittance_lead_time_days: 5, eligibility_lead_time_seconds: 60, pricing_model: "PROVIDER_FUNDED" }
              as: ClearinghouseOps
              captures: { pay_a: $.data.id }
            - call: "POST /clearinghouse/payers/${pay_a}/edit-rules"
              payload: { rule_code: "DX_REQUIRED", applies_to: "CLAIM_INTAKE", severity: "ERROR", expression: "diagnosis_codes.nonempty", effective_from: "2026-01-01T00:00:00Z" }
              as: ClearinghouseOps
            - call: "POST /clearinghouse/providers/${prov_a}/enrollments"
              payload: { payer_id: "${pay_a}", transaction_type: "CLAIMS_837" }
              as: ProviderAdmin
              as_user_id: "${prov_a}"
              captures: { enr_a: $.data.id }
            - call: "POST /clearinghouse/providers/${prov_a}/enrollments/${enr_a}/submit"
              payload: {}
              as: ProviderAdmin
              as_user_id: "${prov_a}"
            - call: "POST /clearinghouse/_enrollments/${enr_a}/advance-to-review"
              payload: {}
              as: ClearinghouseOps
            - call: "GET /clearinghouse/providers/${prov_a}/enrollments/${enr_a}"
              payload: {}
              as: ProviderAdmin
              as_user_id: "${prov_a}"
              captures: { enr_v: $.data.version }
            - call: "POST /clearinghouse/enrollments/${enr_a}/payer-decision"
              payload: { decision: "APPROVE", expected_enrollment_version: "${enr_v}" }
              as: PayerOperator
              as_user_id: "${pay_a}"
          trigger:
            - call: "POST /clearinghouse/providers/${prov_a}/claims"
