        claim_type: segregation_of_duties
        grounds: ["validations[priority=4]", "errors[ERR_SEGREGATION_OF_DUTIES]", "entities.ModelVersion.fields.submitted_by_user_id"]
        distinguishing_aspect: "The X-User-ID that submitted the version may not clear it even while presenting the ComplianceOfficer role: approving as user u-7 after submitting as u-7 returns HTTP 403 ERR_SEGREGATION_OF_DUTIES, while a different officer id succeeds."
        test_recipe:
          setup: ["ModelVersion v1 of Model CORE is PENDING_APPROVAL, submitted by X-User-ID u-7"]
          setup_api_calls:
            - call: "POST /sma/securities"
              payload: { ticker: "ALFA", name: "Alfa Industrials", asset_class: "US_EQUITY", last_price_cents: 10000 }
              as: PlatformAdmin
              captures: { sec_alfa: "$.data.id" }
            - call: "POST /sma/models"
              payload: { manager_name: "Cobalt Asset Mgmt", name: "Core Equity", strategy_code: "CORE", asset_class: "US_EQUITY", base_fee_bps: 90 }
              as: PortfolioManager
              captures: { m1: "$.data.id" }
            - call: "POST /sma/model-versions"
              payload: { model_id: "${m1}" }
              as: PortfolioManager
              captures: { mv1: "$.data.id" }
            - call: "POST /sma/model-versions/${mv1}/sleeves"
              payload: { sleeves: [ { security_id: "${sec_alfa}", target_weight_bps: 10000 } ] }
              as: PortfolioManager
            - call: "POST /sma/model-versions/${mv1}/submit"
              payload: {}
              as: PortfolioManager
              as_user_id: "u-7"
          trigger:
            - call: "POST /sma/model-versions/${mv1}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u-7"
              captures: { err: "$.data.error_id" }
            - call: "POST /sma/model-versions/${mv1}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u-9"
          assert:
            - "The u-7 approval returns HTTP 403 with error_id ERR_SEGREGATION_OF_DUTIES"
            - "ModelVersion.${mv1}.status is still PENDING_APPROVAL and approved_by_user_id == null after that rejection"
            - "The u-9 approval succeeds: ModelVersion.${mv1}.status == APPROVED and approved_by_user_id == 'u-9'"
            - "ModelVersion.${mv1}.submitted_by_user_id == 'u-7' throughout"

      - name: request_missing_auth_headers_returns_unauthenticated
        claim_type: exclusive_operation_denied
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Authentication is checked before everything else: a GET /sma/sponsors/{id} sent with neither X-User-Role nor X-User-ID returns HTTP 401 ERR_UNAUTHENTICATED even though the resource exists."
        test_recipe:
          setup: ["Sponsor NRTH exists"]
          setup_api_calls:
            - call: "POST /sma/sponsors"
              payload: { name: "Northline Wealth", platform_code: "NRTH", revenue_share_bps: 3333 }
              as: PlatformAdmin
              captures: { sp1: "$.data.id" }
          trigger:
            - call: "GET /sma/sponsors/${sp1}"
              payload: {}
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "This request is issued with BOTH the X-User-Role and X-User-ID headers omitted entirely"
            - "Response status is 401 with error_id ERR_UNAUTHENTICATED"
            - "The same request with valid PlatformAdmin headers returns 200 and Sponsor.${sp1}.platform_code == NRTH"

