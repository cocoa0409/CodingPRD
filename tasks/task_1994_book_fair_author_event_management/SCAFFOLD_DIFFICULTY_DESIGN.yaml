            - { call: "POST /venue-slots", payload: { fair_id: "${fair_id}", venue_key: "GYM", purpose: FAIR_DAY, start_at: "2026-08-10T08:00:00Z", end_at: "2026-08-14T18:00:00Z", setup_buffer_minutes: 60, teardown_buffer_minutes: 60 }, as: Organizer, captures: { slot_id: "$.data.id" } }
            - { call: "POST /venue-slots/${slot_id}/confirm", payload: {}, as: SchoolCoordinator, as_user_id: "${school_id}" }
            - { call: "POST /consignment-agreements", payload: { fair_id: "${fair_id}", publisher_party_id: "${pub_id}", discount_pct: 0.40, return_cap_pct: 0.25, restocking_fee_pct: 0.10, markdown_allowance_pct: 0.20, freight_responsibility: ORGANIZER, offer_expiry_hours: 72 }, as: Organizer, captures: { agr_id: "$.data.id" } }
            - { call: "POST /consignment-agreements/${agr_id}/accept", payload: {}, as: PublisherRep, as_user_id: "${pub_id}" }
            - { call: "POST /fairs/${fair_id}/schedule", payload: {}, as: Organizer }
            - { call: "POST /fairs/${fair_id}/open-stocking", payload: {}, as: Organizer }
            - { call: "POST /stock-lines", payload: { fair_id: "${fair_id}", agreement_id: "${agr_id}", isbn: "9780000000001", title: "Dragon Tales", list_price_cents: 1000, line_type: FRONTLIST, qty_committed: 10 }, as: Organizer, captures: { line_id: "$.data.id" } }
            - { call: "POST /stock-lines/${line_id}/commit", payload: {}, as: Organizer }
            - { call: "POST /stock-lines/${line_id}/deliver", payload: { qty_delivered: 10 }, as: Organizer }
            - { call: "POST /fairs/${fair_id}/open", payload: {}, as: Organizer }
            - { call: "POST /sales", payload: { fair_id: "${fair_id}", lines: [{ stock_line_id: "${line_id}", qty: 5 }] }, as: Cashier, captures: { sale_id: "$.data.id" } }
            - { call: "POST /sales/${sale_id}/tender", payload: { tendered_amount_cents: 5000 }, as: Cashier }
            - { call: "POST /fairs/${fair_id}/close-sales", payload: {}, as: Organizer, as_user_id: "org_lead_1" }
            - { call: "GET /reconciliations", payload: { fair_id: "${fair_id}" }, as: Organizer, captures: { recon_id: "$.data[0].id", recon_v: "$.data[0].version" } }
            - { call: "POST /reconciliations/${recon_id}/counts", payload: { lines: [{ stock_line_id: "${line_id}", qty_on_hand: 5 }], expected_reconciliation_version: "${recon_v}" }, as: Organizer, captures: { recon_v2: "$.data.version" } }
            - { call: "POST /reconciliations/${recon_id}/submit-review", payload: {}, as: Organizer }
            - { call: "POST /reconciliations/${recon_id}/approve", payload: {}, as: Organizer, as_user_id: "org_lead_2" }
            - { call: "POST /reconciliations/${recon_id}/submit", payload: {}, as: Organizer }
            - { call: "POST /reconciliations/${recon_id}/accept", payload: {}, as: PublisherRep, as_user_id: "${pub_id}" }
            - { call: "POST /profit-share-payouts", payload: { fair_id: "${fair_id}" }, as: Organizer, captures: { payout_id: "$.data.id" } }
          trigger:
            - { call: "POST /profit-share-payouts/${payout_id}/calculate", payload: {}, as: Organizer }
          assert:
            - "ProfitSharePayout.${payout_id}.net_revenue_cents == 2000"
            - "ProfitSharePayout.${payout_id}.share_cents == 400"
            - "ProfitSharePayout.${payout_id}.cash_amount_cents == 400"
            - "ProfitSharePayout.${payout_id}.scrip_amount_cents == 460"
            - "cash_amount_cents != scrip_amount_cents on identical financials"

  - rule_id: combinatorial_formula
    instances:
      - name: payout_tiered_share_marginal_boundary
        grounds:
          - calculations.school_payout
          - entities.ProfitSharePayout.fields.share_cents
        distinguishing_aspect: |
          Mode (a): >= 3 inputs (gross, remittance, honoraria, promo spend) with
          non-linear interaction — nested min/max marginal tier selection. With net
          pinned exactly at TIER1_CAP_CENTS (200000), the tier-2 term contributes
          exactly 0 and share == 40000; one cent more would enter tier 2 at 0.25.
        test_recipe:
          setup:
            - "Fair through RECONCILING, one FRONTLIST line (list 1000, discount 0.40, committed/delivered 600), one TENDERED sale qty 500 (gross 500000)"
            - "Reconciliation ACCEPTED with zero variance (counted 100 == expected 600-500); remittance == 300000; net == 200000 exactly"
