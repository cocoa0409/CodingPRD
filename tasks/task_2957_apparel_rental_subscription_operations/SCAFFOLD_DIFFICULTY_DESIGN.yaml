          - "1.1 Member.damage_risk_score, damage_risk_band, late_return_count"
          - "1.1 DamageClaim.severity and created_at"
          - "1.6 error catalogue band thresholds LOW, ELEVATED, HIGH"
        distinguishing_aspect: >-
          The same member, the same two completed turns and the same single MODERATE DamageClaim yield
          damage_risk_score 40 with band ELEVATED under LIFETIME and damage_risk_score 0 with band LOW under
          ROLLING_12M, because the June 2025 claim and its turn fall outside the twelve months preceding the
          2026-08-25 clock while the August 2026 clean turn falls inside it. The divergence is visible in the
          supporting counters too: claim_count 1 versus 0. An implementation that filters by clock window in only one
          branch, or that always reads the persisted Member.damage_risk_score, cannot report both numbers.
