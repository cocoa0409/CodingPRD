  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: cancelled_session_state_gate_outranks_talent_double_booking
        grounds:
          - validations[priority=13].ERR_SESSION_NOT_BOOKED
          - validations[priority=41].ERR_TALENT_OVERLAP
          - endpoints[POST /studio/talent-bookings]
        distinguishing_aspect: |
          Category pair state (13) vs business_temporal (41): one booking request violates both the
          session-state gate and the talent exclusivity window, and the lower-numbered state check
          must win with ERR_SESSION_NOT_BOOKED even though the overlap is the more expensive defect.
        test_recipe:
          setup:
            - "Two MODEL stations MODEL-1 and MODEL-2, one IN_HOUSE provider, photographer Pia Ren."
            - "Session S1 on MODEL-1 2026-08-03 09:00-13:00 already holds a CONFIRMED booking for Pia Ren over exactly that window."
            - "Session S2 on MODEL-2 covers the identical window but has been CANCELLED; its post-cancel version is captured so no OCC rule is co-violated."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/stations"
              payload: { station_code: "MODEL-1", station_type: "MODEL", daily_capacity_minutes: 1440, buffer_minutes: 0, max_concurrent_sessions: 1, calibrated_until: "2026-12-31T00:00:00Z" }
              as: StudioAdmin
              captures: { st1_id: $.data.id }
            - call: "POST /studio/stations"
              payload: { station_code: "MODEL-2", station_type: "MODEL", daily_capacity_minutes: 1440, buffer_minutes: 0, max_concurrent_sessions: 1, calibrated_until: "2026-12-31T00:00:00Z" }
              as: StudioAdmin
              captures: { st2_id: $.data.id }
            - call: "POST /studio/studio-providers"
