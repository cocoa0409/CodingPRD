        grounds:
          - state_machines.RiskAcceptance.APPROVED_to_EXPIRED
          - state_machines.ExceptionFinding.OPEN_to_CLOSED_ACCEPTED
          - entities.ReassessmentSchedule
        distinguishing_aspect: |
          Depth-3 cascade triggered by the clock sweep: RiskAcceptance EXPIRED
          -> each CLOSED_ACCEPTED exception re-opens (link 1, caused by the
          expiry) -> cycle.open_exception_count increments and
          vendor.next_reassessment_due pulls forward (link 2, caused by the
          exception re-open aggregation) -> a ReassessmentSchedule row is
          appended (link 3, caused by the due-date mutation).
