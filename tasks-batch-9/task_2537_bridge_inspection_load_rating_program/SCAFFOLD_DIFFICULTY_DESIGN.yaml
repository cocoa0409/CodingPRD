  - rule_id: transitive_cascade
    instances:
      - name: inspection_accept_cascade_bridge_interval_candidate_cycle
        grounds:
          - state_machines.Inspection.IN_QA_to_ACCEPTED
          - calculations.element_health_index
          - calculations.bridge_health_index
          - calculations.nbi_component_rating
          - calculations.inspection_interval_months
          - calculations.candidate_estimated_cost_cents
          - calculations.candidate_priority_score
          - calculations.cycle_rollup
        distinguishing_aspect: |
          A single qa-decision ACCEPT propagates five hops: (1) Inspection -> ACCEPTED with its own
          rolled-up element indices, (2) Bridge component ratings and bridge_health_index rewritten
          from the element rows, (3) Bridge inspection_interval_months and next_inspection_due_date
          recomputed from the new min_nbi_rating, (4) a ProjectCandidate auto-created in the single
          PLANNING cycle with its own cost and priority derived from step 2, (5) that cycle's
          identified_count and unprogrammed_cost_cents rolled up from step 4. Every hop's numbers
          depend on the previous hop, so a shallow implementation that stops at hop 2 or 3 fails.
        test_recipe:
          setup:
            - "Baseline staff and Cedar Creek Bridge with a DRAFT ROUTINE inspection carrying the baseline element set."
            - "Exactly one ProgramCycle exists and it is in PLANNING (fiscal_year 2028, authorized_budget_cents 10000000000, ranking_policy CONDITION_BASED, reserve_pct 0.05), which is the precondition that arms hop 4."
            - "No ScourEvaluation exists, which is irrelevant to the CONDITION_BASED ranking policy used here."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /personnel"
              payload: { full_name: "Ivy Inspector", agency: "STATE_DOT", nbis_refresher_expiry_date: "2027-06-30", team_leader_certified: true }
