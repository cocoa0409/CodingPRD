            - "trigger[1] returns insurance_lapses_raised 1, cure_windows_lapsed 0, revaluations_flagged 0, mortgages_extinguished 0, leases_expired 0 and affected_lease_ids exactly [${lease_q}]"
            - "lease Q reports insurance_status LAPSED and lease_status IN_DEFAULT: its expiry equals now, and phase 1 lapses at or before now"
            - "lease P reports insurance_status ACTIVE, insurance_expires_at 2027-09-01T00:00:00Z and lease_status ACTIVE - the renewal filed at 2026-08-15 cancelled the scheduled lapse"
            - "lease R reports insurance_status LAPSED (its creation default), insurance_expires_at null and lease_status ACTIVE, and GET /portfolio/default-notices?lease_id=${lease_r} reports total_count 0 - a null expiry is never overdue"
            - "GET /portfolio/default-notices?lease_id=${lease_q} reports total_count 1 with default_type INSURANCE_LAPSE, status SERVED, served_by_user_id SYSTEM, served_at 2026-09-01T00:00:00Z, lessee_cure_deadline 2026-09-16T00:00:00Z (INSURANCE_CURE_DAYS 15) and mortgagee_cure_deadline null (lease Q carries no mortgage)"
            - "trigger[2], the second sweep at the same logical instant, returns all five counters 0 and an empty affected_lease_ids"
            - "trigger[4], the sweep at exactly the lessee cure deadline, returns cure_windows_lapsed 0 - the lapse comparison is strict - and insurance_lapses_raised 0, because Q is no longer ACTIVE and P is insured"
            - "trigger[6], one second later, returns cure_windows_lapsed 1 and the notice is LESSEE_CURE_LAPSED, while insurance_lapses_raised is still 0: the already-defaulted lease is never served a second INSURANCE_LAPSE notice"

      - name: cascading_side_effects_layer_corner
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: termination_fans_out_to_subleases_statements_certificates_then_mints_new_lease
          rationale: |
            The deepest declared cascade is the termination fan-out, and the named §1.8 instance verifies it
            end to end (subleases TERMINATED_BY_REVERSION, open statements VOID while FINAL_ASSESSED
            survives, certificates REVOKED, mortgages NEW_LEASE_ELIGIBLE, then a minted replacement lease),
            with ordering sensitivity pinned by
            allocation_extinguishes_senior_mortgage_and_shrinks_the_next_waterfall_input_set and reversal
            drift pinned by condemnation_allocation_rescinded_restores_arrears_and_every_mortgage_principal_exactly.

      - name: dual_variant_calculation_layer_corner
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: percentage_rent_provisional_then_audited_final_reconciliation
          rationale: |
            Both declared variant pairs are already owned by §1.8: the named instance runs the
            percentage-rent PROVISIONAL/FINAL pair including the ledger delta on the switch, and
            condemnation_proceeds_bonus_value_vs_pro_rata_share runs the PRO_RATA_SHARE/BONUS_VALUE pair on
            identical data and asserts the divergence between them.

  - section: consistency_model
    instances:
      - name: every_write_response_already_carries_its_derived_fields
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/portfolio/leases/{id}/rent-charges
          - endpoints.POST_/portfolio/percentage-rent-statements/{id}/assess
          - endpoints.POST_/portfolio/alteration-requests/{id}/decision
        distinguishing_aspect: |
          consistency_model is immediate, so there is no reconciliation pass and no lag to tolerate: the
          mutating call's OWN response body must already show the recomputed ledger and envelope, and the
          very next read in the same test must agree with it field for field. The probe deliberately mixes
          the two shapes of derived state - a ledger figure that accumulates across two unrelated writes
          (a charge then an assessment) and an envelope figure derived from a child row's status - and it
          reads the parent lease immediately after each child write rather than at the end, so an
          implementation that recomputes derived fields lazily on the next GET of the parent is caught by
          the response bodies, and one that writes them eagerly but forgets to include them in the response
          envelope is caught too.
        test_recipe:
          setup:
            - "One lease, then a charge, a statement assessment and an alteration approval, reading the parent immediately after each."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Harborline Retail Holdings LLC", notice_email: "notices@harborline.example", credit_rating_code: "A" }
              as: LessorAdmin
              captures: { lessee_id: $.data.id }
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-130", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 20, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
              captures: { lease_id: $.data.id }
          trigger:
            - call: "POST /portfolio/leases/${lease_id}/rent-charges"
              payload: { amount_cents: 5000000, memo: "Q3 2026 base rent" }
              as: LeaseAccountant
              as_user_id: "acct-1"
              captures: { lease_version: $.data.version }
            - call: "GET /portfolio/leases/${lease_id}"
              payload: {}
              as: LessorAdmin
            - call: "POST /portfolio/percentage-rent-statements"
              payload: { lease_id: "${lease_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", reported_gross_sales_cents: 200000000, expected_lease_version: "${lease_version}" }
              as: GroundTenant
              as_user_id: "${lessee_id}"
              captures: { statement_id: $.data.id }
            - call: "POST /portfolio/percentage-rent-statements/${statement_id}/assess"
              payload: {}
              as: LeaseAccountant
              as_user_id: "acct-1"
            - call: "GET /portfolio/leases/${lease_id}/rent-summary"
              payload: {}
              as: LeaseAccountant
              as_user_id: "acct-1"
            - call: "POST /portfolio/leases/${lease_id}/alteration-requests"
              payload: { scope_code: "COSMETIC", proposed_use_code: "RETAIL_MIXED", requested_gfa_sqft: 40000, construction_window_start: "2026-09-01T00:00:00Z", construction_window_end: "2026-10-01T00:00:00Z", estimated_cost_cents: 1000000 }
              as: GroundTenant
              as_user_id: "${lessee_id}"
              captures: { alteration_id: $.data.id }
            - call: "POST /portfolio/alteration-requests/${alteration_id}/decision"
              payload: { decision: "APPROVE" }
              as: AssetManager
              as_user_id: "am-1"
            - call: "GET /portfolio/leases/${lease_id}"
              payload: {}
              as: LessorAdmin
          assert:
            - "trigger[0]'s own response body reports arrears_balance_cents 5000000 - the ledger is not deferred to a later read"
            - "trigger[1] agrees with it exactly: arrears_balance_cents 5000000, gfa_allocated_sqft 0, gfa_unallocated_sqft 200000"
            - "trigger[2] returns 201 with status SUBMITTED and assessed figures still null or zero: filing a statement does not touch the ledger"
            - "trigger[3]'s own response body reports assessment_variant PROVISIONAL, excess_sales_cents 100000000, gross_percentage_rent_cents 6000000, base_rent_offset_credit_cents 2500000 and amount_due_cents 3500000"
            - "trigger[4], read immediately afterwards, reports arrears_balance_cents 8500000 - 5000000 from the charge plus the 3500000 just assessed, with no reconciliation step in between"
            - "trigger[6]'s own response body reports status APPROVED, and trigger[7] reports gfa_allocated_sqft 40000 and gfa_unallocated_sqft 160000 with arrears_balance_cents still 8500000"
            - "no assertion in this instance requires a second read of the same resource to converge: every figure is final in the first response that could carry it"
