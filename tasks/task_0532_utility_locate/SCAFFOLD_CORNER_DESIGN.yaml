              as: CallCenter
              captures: { mem_id: $.data.id }
            - call: "POST /locate-techs"
              payload: { full_name: "Tina", member_utility_id: "${mem_id}", certified_facility_types: ["GAS"] }
              as: CallCenter
              captures: { tech_id: $.data.id }
            - call: "POST /locate-tickets"
              payload: { excavator_id: "${exc_id}", ticket_type: "EMERGENCY", dig_polygon: { min_x: 10, min_y: 10, max_x: 20, max_y: 20 }, work_description: "job" }
              as: Excavator
              as_user_id: "${exc_id}"
              captures: { tid: $.data.id }
            - call: "POST /locate-tickets/${tid}/submit"
              payload: {}
              as: Excavator
              as_user_id: "${exc_id}"
            - call: "GET /utility-notifications"
              payload: { ticket_id: "${tid}" }
              as: FacilityOwner
              as_user_id: "${mem_id}"
              captures: { note_id: $.data.0.id }
            - call: "POST /positive-responses"
              payload: { notification_id: "${note_id}", outcome: "CLEAR" }
              as: FacilityOwner
              as_user_id: "${mem_id}"
            - call: "POST /locate-assignments"
              payload: { ticket_id: "${tid}", notification_id: "${note_id}", locate_tech_id: "${tech_id}" }
              as: FacilityOwner
              as_user_id: "${mem_id}"
              captures: { asg_id: $.data.id }
            - call: "POST /locate-assignments/${asg_id}/en-route"
              payload: {}
              as: LocateTech
              as_user_id: "${tech_id}"
            - call: "POST /mark-outs"
              payload: { assignment_id: "${asg_id}", ticket_id: "${tid}", marks_count: 2 }
              as: LocateTech
              as_user_id: "${tech_id}"
              captures: { mk1_id: $.data.id }
            - call: "POST /mark-outs/${mk1_id}/complete"
              payload: {}
              as: LocateTech
              as_user_id: "${tech_id}"
              captures: { tv_after: $.data.version }
            - call: "GET /locate-tickets/${tid}"
              payload: {}
              as: LocateTech
              as_user_id: "${tech_id}"
              captures: { tv_now: $.data.version }
          trigger:
            - call: "POST /mark-outs"
              payload: { assignment_id: "${asg_id}", ticket_id: "${tid}", marks_count: 4, supersedes_markout_id: "${mk1_id}", expected_ticket_version: "${tv_now} - 1" }
              as: LocateTech
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == 'ERR_STALE_TICKET_VERSION'"

      - name: version_increments_on_each_ticket_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.LocateTicket.fields.version]
        distinguishing_aspect: "LocateTicket.version starts at 1 on create and increments by 1 on submit (a mutation), observable via GET."
        test_recipe:
          setup: ["One member covering site; one white-lined NORMAL ticket."]
          setup_api_calls:
            - call: "POST /excavators"
              payload: { company_name: "DigCo", contact_email: "c26@x.com", state_code: "CA" }
              as: CallCenter
              captures: { exc_id: $.data.id }
