  # =========================================================================
  - section: endpoints
    instances:

      - name: corner_premium_summary_computed_read
        claim_type: Computed read
        grounds:
          - endpoints[GET /inland-marine/policies/{id}/premium-summary]
          - calculations.policy_written_premium
          - calculations.coverage_part_equipment_premium
        distinguishing_aspect: "The premium-summary read returns all ten derived fields for a single-item scheduled part with a blanket limit also on file: sum_of_part_premiums_cents 173318, expense_load_bp 10400, written_premium_cents 180251, scheduled_basis_premium_cents 180251, blanket_basis_premium_cents 188510, minimum_premium_applied false, total_insured_value_cents 8160000, premium_balance_cents 0, incurred_loss_cents 0 and referral_required false."
        test_recipe:
          setup:
            - "Empty database, logical clock at its 2026-08-01T00:00:00Z default."
            - "The part carries BOTH a per_item_limit and a blanket_limit/coinsurance pair, so the blanket variant of coverage_part_equipment_premium is well defined even though rating_basis is SCHEDULED."
          setup_api_calls:
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "EXCAVATOR", territory_code: "T2_URBAN", age_band_min_years: 0, age_band_max_years: 5, base_rate_bp: 180, theft_hazard_grade: "A" }
              as: Actuary
              captures: { rr: $.data.id }
            - call: "POST /inland-marine/rate-rules/${rr}/publish"
              payload: {}
              as: Actuary
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Summary Read Contractors", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "SCHEDULED_EQUIPMENT", valuation_basis: "ACV", rating_basis: "SCHEDULED", deductible_cents: 100000, per_item_limit_cents: 20000000, blanket_limit_cents: 10000000, coinsurance_pct_bp: 9000, aggregate_limit_cents: 200000000 }
              as: Underwriter
              captures: { cp: $.data.id }
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v1: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "Excavator E1", equipment_type: "EXCAVATOR", model_year: 2022, original_cost_cents: 12000000, ownership: "OWNED", expected_policy_version: "${pol_v1}" }
              as: Underwriter
              captures: { it1: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/quote"
              payload: {}
              as: Underwriter
          trigger:
            - call: "GET /inland-marine/policies/${pol}/premium-summary"
              payload: {}
              as: UnderwritingManager
          assert:
            - "trigger[0] HTTP status == 200"
            - "trigger[0] response sum_of_part_premiums_cents == 173318"
            - "trigger[0] response expense_load_bp == 10400 (T2_URBAN)"
            - "trigger[0] response written_premium_cents == 180251"
            - "trigger[0] response scheduled_basis_premium_cents == 180251"
            - "trigger[0] response blanket_basis_premium_cents == 188510 (the blanket variant prices the 10000000 blanket limit at the 180 bp insured-value-weighted rate with the 10600 bp blanket load and the 500 bp coinsurance credit: part 181260, loaded 188510)"
            - "trigger[0] response minimum_premium_applied == false (180251 > 100000)"
            - "trigger[0] response total_insured_value_cents == 8160000"
            - "trigger[0] response premium_balance_cents == 0 (never bound, so no ledger entry exists)"
            - "trigger[0] response incurred_loss_cents == 0"
            - "trigger[0] response referral_required == false (180251 < 5000000 and 8160000 <= 50000000)"
            - "the read is pure: EquipmentItem.${it1}.rated_premium_cents is still 173318 and CoveragePart.${cp}.rated_premium_cents is still 173318 afterwards, and Policy.${pol}.version is unchanged by the GET"
            - "every field in the summary is derived, not stored: blanket_basis_premium_cents 188510 appears in the summary while CoveragePart.${cp}.rated_premium_cents remains the SCHEDULED figure 173318"

      - name: corner_settlement_worksheet_computed_read
        claim_type: Computed read
        grounds:
          - endpoints[GET /inland-marine/claims/{id}/settlement-worksheet]
          - calculations.claim_loss_valuation
          - calculations.claim_settlement_amount
          - calculations.underreporting_penalty_factor
        distinguishing_aspect: "On an inspected-but-not-yet-adjusted equipment claim the worksheet returns all eleven fields side by side: 8160000, 6120000, false, 10000, 20000000, 100000, 0, 2900000, 8060000, true and 200000000."
        test_recipe:
