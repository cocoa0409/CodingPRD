      - name: volunteer_companion_cannot_respond_to_another_volunteers_match
        claim_type: Ownership Denial
        grounds: ["validations[priority=3]", "errors[ERR_NOT_RESOURCE_OWNER]", "roles.VolunteerCompanion"]
        distinguishing_aspect: "A different entity_backed ownership edge from the Participant one: respond compares X-User-ID with CompanionMatch.companion_id, so the wrong volunteer gets ERR_NOT_RESOURCE_OWNER (403) and active_match_count on both volunteers stays 0."
