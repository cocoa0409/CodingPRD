            - "The case's FinancingPlan.status == CANCELLED"
            - "SurgeryCase.${case1}.financial_status == REFUNDED"

      - name: installment_threshold_cascade_to_paid_in_full
        grounds:
          - state_machines.SurgeryCase.financial_status=DEPOSIT_PAID_to_financial_status=PAID_IN_FULL
          - entities.FinancingPlan.fields.amount_settled_cents
          - entities.FinancingPlan.fields.status
          - entities.SurgeryCase.fields.financial_status
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (installment post): posting the final installment pushes amount_settled_cents to
          the base_price threshold (hop1) which sets FinancingPlan.status=SETTLED and bubbles up to case.financial_status=PAID_IN_FULL (hop2).
        test_recipe:
          setup:
            - "A DEPOSIT_PAID case with an OPEN financing plan: base 500000, down 100000, so 400000 outstanding across the plan."
          setup_api_calls:
            - call: "POST /refractive/packages"
              payload: { tier: "STANDARD", base_price_cents: 500000, deposit_cents: 50000, enhancement_window_days: 365, outcome_guarantee_uncorrected_va: 1.0, refund_mode: "PRO_RATA" }
              as: Coordinator
              captures: { pkg: $.data.id }
            - call: "POST /refractive/optometrists"
              payload: { full_name: "OD A" }
              as: Coordinator
              captures: { od_id: $.data.id }
            - call: "POST /refractive/surgeons"
              payload: { full_name: "Dr A", max_daily_cases: 5 }
