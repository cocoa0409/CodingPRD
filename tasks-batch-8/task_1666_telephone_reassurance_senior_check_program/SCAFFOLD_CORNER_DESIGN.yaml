  # ---------------------------------------------------------------------------
  - section: complexity_layers
    instances:
      - name: occ_escalation_create_stale_then_supersede
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[escalation-create-stale-participant]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Participant.version: a second MANUAL escalation carrying the pre-first-create version is rejected 412; with the fresh version it succeeds and supersedes the first case (CLOSED_SUPERSEDED, supersedes_escalation_id set)."
        test_recipe:
          setup: ["Program; ENROLLED participant at a captured version"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AAA", total_capacity: 10, current_policy_version: "v2026.1" }, as: ProgramCoordinator }
            - { call: "POST /api/participants", payload: { full_name: "OCC P", date_of_birth: "1952-09-04", phone: "555-4900", address: "1 CL Rd", referral_source: "SELF", age_band: "AGE_65_74", lives_alone: false, mobility: "NONE", cognitive_concern: false, chronic_conditions_count: 0, recent_hospitalization: false, recent_bereavement: false }, as: IntakeWorker, captures: { p_id: $.data.id } }
            - { call: "POST /api/participants/${p_id}/emergency-contacts", payload: { full_name: "Kin", phone: "555-4901", relationship: "niece", contact_rank: "PRIMARY" }, as: IntakeWorker }
            - { call: "POST /api/participants/${p_id}/submit-review", payload: {}, as: IntakeWorker }
            - { call: "POST /api/participants/${p_id}/approve", payload: {}, as: IntakeWorker }
            - { call: "GET /api/participants/${p_id}", payload: {}, as: ProgramCoordinator, captures: { pv: $.data.version } }
          trigger:
            - { call: "POST /api/escalations", payload: { participant_id: "${p_id}", trigger_type: "MANUAL", expected_participant_version: "${pv}" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { e1: $.data.id } }
            - { call: "POST /api/escalations", payload: { participant_id: "${p_id}", trigger_type: "MANUAL", expected_participant_version: "${pv}" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { err: $.data.error_id } }
            - { call: "GET /api/participants/${p_id}", payload: {}, as: ProgramCoordinator, captures: { pv2: $.data.version } }
            - { call: "POST /api/escalations", payload: { participant_id: "${p_id}", trigger_type: "MANUAL", expected_participant_version: "${pv2}" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { e2: $.data.id, sup: $.data.supersedes_escalation_id } }
            - { call: "GET /api/escalations/${e1}", payload: {}, as: ProgramCoordinator, captures: { e1st: $.data.stage } }
          assert:
            - "First create succeeds at the captured version; the create itself bumps Participant.version"
            - "err == ERR_STALE_VERSION (HTTP 412) for the repeated stale version"
            - "e1st == CLOSED_SUPERSEDED and sup == ${e1} after the fresh-version create"

      - name: occ_promotion_run_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[promotion-run-stale-program]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Program.version: a promotion run replays legally (it is a repeatable batch op), so the stale-version rejection is the only guard — verified by a successful run, a 412 on the replayed version, and a successful run at the fresh version."
        test_recipe:
          setup: ["Program cap 1; filler enrolled then disenrolled; one applicant WAITING"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AAA", total_capacity: 1, current_policy_version: "v2026.1", max_reserve_slots: 0 }, as: ProgramCoordinator, captures: { prog_id: $.data.id } }
            - { call: "POST /api/participants", payload: { full_name: "Fill", date_of_birth: "1952-09-05", phone: "555-4902", address: "2 CL Rd", referral_source: "SELF", age_band: "AGE_65_74", lives_alone: false, mobility: "NONE", cognitive_concern: false, chronic_conditions_count: 0, recent_hospitalization: false, recent_bereavement: false }, as: IntakeWorker, captures: { pf: $.data.id } }
            - { call: "POST /api/participants/${pf}/emergency-contacts", payload: { full_name: "Kin", phone: "555-4903", relationship: "niece", contact_rank: "PRIMARY" }, as: IntakeWorker }
            - { call: "POST /api/participants/${pf}/submit-review", payload: {}, as: IntakeWorker }
            - { call: "POST /api/participants/${pf}/approve", payload: {}, as: IntakeWorker }
            - { call: "POST /api/participants", payload: { full_name: "W P", date_of_birth: "1952-09-06", phone: "555-4904", address: "3 CL Rd", referral_source: "SELF", age_band: "AGE_65_74", lives_alone: false, mobility: "NONE", cognitive_concern: false, chronic_conditions_count: 0, recent_hospitalization: false, recent_bereavement: false }, as: IntakeWorker, captures: { pw: $.data.id } }
            - { call: "POST /api/participants/${pw}/emergency-contacts", payload: { full_name: "Kin", phone: "555-4905", relationship: "niece", contact_rank: "PRIMARY" }, as: IntakeWorker }
            - { call: "POST /api/participants/${pw}/submit-review", payload: {}, as: IntakeWorker }
            - { call: "POST /api/participants/${pw}/approve", payload: {}, as: IntakeWorker }
            - { call: "POST /api/participants/${pf}/disenroll", payload: { reason: "moved" }, as: ProgramCoordinator }
            - { call: "GET /api/programs/${prog_id}", payload: {}, as: IntakeWorker, captures: { pv: $.data.version } }
          trigger:
            - { call: "POST /api/programs/${prog_id}/promotion-runs", payload: { expected_program_version: "${pv}" }, as: IntakeWorker, captures: { ep1: $.data.epoch } }
            - { call: "POST /api/programs/${prog_id}/promotion-runs", payload: { expected_program_version: "${pv}" }, as: IntakeWorker, captures: { err: $.data.error_id } }
            - { call: "GET /api/programs/${prog_id}", payload: {}, as: IntakeWorker, captures: { pv2: $.data.version, epoch2: $.data.promotion_epoch } }
            - { call: "POST /api/programs/${prog_id}/promotion-runs", payload: { expected_program_version: "${pv2}" }, as: IntakeWorker, captures: { ep3: $.data.epoch } }
          assert:
            - "ep1 == 1; err == ERR_STALE_VERSION on the replayed version"
            - "epoch2 == 1 (the rejected run advanced nothing); ep3 == 2 at the fresh version"

      - name: occ_program_config_patch_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[program-config-update-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Program.version for free-form config edits: PATCH at the read version succeeds and bumps version; replaying the same read version is rejected 412."
        test_recipe:
          setup: ["Program created (version 1)"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AAA", total_capacity: 10, current_policy_version: "v2026.1" }, as: ProgramCoordinator, captures: { prog_id: $.data.id } }
            - { call: "GET /api/programs/${prog_id}", payload: {}, as: ProgramCoordinator, captures: { pv: $.data.version } }
          trigger:
            - { call: "PATCH /api/programs/${prog_id}", payload: { expected_program_version: "${pv}", offer_ttl_hours: 96 }, as: ProgramCoordinator, captures: { v_new: $.data.version, ttl: $.data.offer_ttl_hours } }
            - { call: "PATCH /api/programs/${prog_id}", payload: { expected_program_version: "${pv}", survey_valid_days: 14 }, as: ProgramCoordinator, captures: { err: $.data.error_id } }
            - { call: "GET /api/programs/${prog_id}", payload: {}, as: ProgramCoordinator, captures: { svd: $.data.survey_valid_days } }
          assert:
            - "ttl == 96 and v_new == pv + 1 (successful patch increments version)"
