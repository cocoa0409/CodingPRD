              captures: { aid: $.data.id, auth_state: $.data.status }
          assert:
            - "${err} == \"ERR_INSURANCE_NOT_ACTIVE\" with HTTP 402 - the pilot is CERTIFIED and current, the airframe REGISTERED, the ceiling legal; only the policy state blocks the request"
            - "after the rejection no AirspaceAuthorization row exists and AirspaceZone.${zid}.version equals ${zv1}"
            - "${policy_state} == \"ACTIVE\" and the policy's own fields (coverage_limit_cents 5000000, remaining_coverage_cents 5000000) are otherwise unchanged"
            - "${auth_state} == \"REQUESTED\" with granted_ceiling_ft null - approval has not happened yet - and AirspaceAuthorization.${aid}.requested_ceiling_ft == 400"
            - "the second request differs from the first only in the state of the InsurancePolicy row"
            - "Pilot.${pid}.currency_expires_at == \"2026-11-03T00:00:00Z\" on both attempts, so the currency rule at priority 17 never fires here"

      - name: waiver_submission_depends_on_pilot_certification_state
        grounds:
          - validations.priority_16
          - state_machines.Pilot
          - state_machines.Waiver
          - endpoints.POST_/drone-ops/waivers/{id}/submit
          - endpoints.POST_/drone-ops/pilots/{id}/currency-review
        distinguishing_aspect: |
          A third entity pair - Waiver x Pilot - where the dependency is on the applicant's
          certification state rather than on a module or a policy. The waiver row is created
          while the pilot is CERTIFIED and is untouched afterwards; a lapse blocks submission and
          re-certification unblocks it, so the same DRAFT row changes behaviour without itself
          being modified.
        test_recipe:
          setup:
            - "Logical clock at 2026-02-01T00:00:00Z."
            - "One COMMERCIAL pilot CERTIFIED at 2026-02-01T00:00:00Z (currency_expires_at 2026-05-02T00:00:00Z), one REGISTERED 249 g airframe."
            - "One DRAFT NIGHT waiver with one PENDING SafetyCase (ground_risk_class 2, ARC_B, so sail_level 3), created while the pilot was CERTIFIED."
