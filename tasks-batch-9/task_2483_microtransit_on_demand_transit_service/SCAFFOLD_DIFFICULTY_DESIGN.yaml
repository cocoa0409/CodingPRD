  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: block_state_priority_12_outranks_seat_capacity_priority_52
        grounds:
          - validations.priority_12.ERR_INVALID_BLOCK_STATE
          - validations.priority_52.ERR_SEAT_CAPACITY_EXCEEDED
          - endpoints.POST_pool-assignments
        distinguishing_aspect: |
          One single offer request violates BOTH the state gate (priority 12: the target block is
          still SCHEDULED, not OPEN) and the fiscal capacity gate (priority 52: party_size 3 on a
          2-seat vehicle). The cheap state check must answer first with ERR_INVALID_BLOCK_STATE;
          only after the block is opened — leaving the capacity violation untouched — does the same
          payload surface ERR_SEAT_CAPACITY_EXCEEDED. An implementation that evaluates capacity
          eagerly (or that orders validations by table position rather than by declared priority)
          returns the wrong error_id on the first call.
        test_recipe:
          setup:
            - "Zone RBM ACTIVE; stops S0 and S4 approved."
            - "Vehicle V2 has seat_capacity 2 and wav_positions 0; driver D1 is not WAV certified; rider R1 is FULL / mobility_device NONE."
            - "Block B1 (V2/D1) 06:00-10:00Z is created but deliberately LEFT in SCHEDULED — never opened."
            - "Trip T1 (S0->S4, requested 07:00Z which is inside the block window, party_size 3) exceeds V2's 2 seats even on an empty manifest."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: ZoneAdmin
            - call: "POST /service-zones"
              payload: { name: "Riverbend Microtransit", zone_code: "RBM", max_walk_meters: 600, detour_tolerance_pct: 0.25, detour_tolerance_floor_minutes: 6, base_fare_cents: 250, fare_cap_cents_daily: 600, fare_cap_cents_weekly: 2500, on_time_window_minutes: 10, curb_capacity_per_bucket: 2 }
              as: ZoneAdmin
              captures: { z_id: $.data.id }
            - call: "POST /service-zones/${z_id}/activate"
              payload: {}
              as: ZoneAdmin
            - call: "POST /virtual-stops"
              payload: { zone_id: "${z_id}", stop_code: "S0", corridor_index: 0, walk_shed_meters: 400, accessibility: "ACCESSIBLE_PATH" }
              as: ZoneAdmin
              captures: { s0_id: $.data.id }
            - call: "POST /virtual-stops/${s0_id}/approve"
              payload: {}
              as: ZoneAdmin
            - call: "POST /virtual-stops"
              payload: { zone_id: "${z_id}", stop_code: "S4", corridor_index: 4, walk_shed_meters: 400, accessibility: "ACCESSIBLE_PATH" }
              as: ZoneAdmin
              captures: { s4_id: $.data.id }
            - call: "POST /virtual-stops/${s4_id}/approve"
              payload: {}
              as: ZoneAdmin
            - call: "POST /vehicles"
              payload: { zone_id: "${z_id}", vehicle_code: "V2", seat_capacity: 2, wav_positions: 0 }
              as: ZoneAdmin
              captures: { v2_id: $.data.id }
            - call: "POST /drivers"
              payload: { zone_id: "${z_id}", driver_code: "D1", wav_certified: false }
              as: ZoneAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /riders"
              payload: { zone_id: "${z_id}", rider_code: "R1", fare_category: "FULL", mobility_device: "NONE" }
              as: ZoneAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /vehicle-blocks"
              payload: { zone_id: "${z_id}", vehicle_id: "${v2_id}", driver_id: "${d1_id}", block_type: "BASE", start_utc: "2026-08-03T06:00:00Z", end_utc: "2026-08-03T10:00:00Z" }
              as: Dispatcher
              captures: { b1_id: $.data.id, b1_v: $.data.version }
            - call: "POST /trip-requests"
              payload: { zone_id: "${z_id}", rider_id: "${r1_id}", origin_stop_id: "${s0_id}", destination_stop_id: "${s4_id}", requested_pickup_utc: "2026-08-03T07:00:00Z", party_size: 3 }
              as: Rider
              as_user_id: "${r1_id}"
              captures: { t1_id: $.data.id }
          trigger:
            - call: "POST /pool-assignments"
              payload: { trip_request_id: "${t1_id}", block_id: "${b1_id}", expected_vehicle_block_version: "${b1_v}" }
              as: Dispatcher
            - call: "POST /vehicle-blocks/${b1_id}/open"
              payload: {}
              as: Dispatcher
              captures: { b1_v2: $.data.version }
            - call: "POST /pool-assignments"
              payload: { trip_request_id: "${t1_id}", block_id: "${b1_id}", expected_vehicle_block_version: "${b1_v2}" }
              as: Dispatcher
          assert:
            - "the first POST /pool-assignments returns HTTP 409 with error_id == ERR_INVALID_BLOCK_STATE (priority 12 wins; NOT ERR_SEAT_CAPACITY_EXCEEDED)"
            - "the second POST /pool-assignments (block now OPEN, capacity violation unchanged) returns HTTP 409 with error_id == ERR_SEAT_CAPACITY_EXCEEDED"
            - "no PoolAssignment row exists for TripRequest ${t1_id}: GET /pool-assignments?trip_request_id=${t1_id} returns total_count == 0"
            - "TripRequest.${t1_id}.status == RECEIVED"
            - "TripRequest.${t1_id}.match_attempt_count == 0"
            - "TripRequest.${t1_id}.assigned_block_id == null"
            - "TripRequest.${t1_id}.fare_status == UNPRICED"
            - "VehicleBlock.${b1_id}.state == OPEN"
            - "VehicleBlock.${b1_id}.seats_committed == 0"

