          - validations[priority=7]
          - errors.ERR_SITE_RELEASE_FROZEN
        distinguishing_aspect: "Metric: integer count of open CRITICAL deviations, observed via GET /sites/{id} and the disposition endpoint. Count 1 yields CONDITIONAL (release still permitted); reaching exactly the threshold 2 yields FROZEN and the next COMMERCIAL disposition fails with ERR_SITE_RELEASE_FROZEN (>= semantics)."
