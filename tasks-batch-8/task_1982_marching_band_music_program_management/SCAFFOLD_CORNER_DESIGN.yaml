            - { call: "POST /band/instruments", payload: { program_id: "${prog}", serial_number: "SN-TA-2", instrument_type: "TRUMPET", replacement_value_cents: 50000 }, as: EquipmentManager, captures: { t2: $.data.id } }
            - { call: "POST /band/instruments", payload: { program_id: "${prog}", serial_number: "SN-TA-3", instrument_type: "CLARINET", replacement_value_cents: 40000 }, as: EquipmentManager, captures: { c1: $.data.id } }
