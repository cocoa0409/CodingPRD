        claim_type: precondition_enforcement
        grounds: ["validations[priority=8]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Single-failure state gate: punch item creation requires PUNCH_ACTIVE; MOBILIZED alone triggers ERR_INVALID_STATE with no other confounding violation."
