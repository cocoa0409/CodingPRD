scenario: |
  Housing Cooperative Board & Share Transfer (New York housing co-op): share allocation &
  maintenance charge calculation, purchase application & board interview/approval process,
  sublet policy & fee administration, flip tax calculation on transfer, underlying mortgage
  & refinancing decisions, shareholder arrears & termination of proprietary lease,
  alteration agreement & renovation approval, annual meeting & board election.

domain_name: housing-cooperative-board-share-transfer
api_prefix: /cooperatives

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit          # NY co-op law, Business Corporation Law, proprietary lease
  secondary_archetype: multi_party_negotiation # board votes, shareholder quorum, interview panel
  complexity_layers:
    - optimistic_concurrency       # OCC on Cooperative & PurchaseApplication versions
    - cascading_side_effects       # budget approve → charges → arrears → demand letters
    - dual_variant_calculation     # maintenance allocation (pro-rata vs equal); flip tax (gross-% vs per-share)
    - scheduled_deferred_actions   # charge effective dates, meeting dates, sublet windows
    - derived_field_reconciliation # arrears_balance must stay in sync with charges and payments

  entity_topology: hybrid
  # hierarchical: Cooperative → Unit, ChargeSchedule, Meeting, Resolution
  # flat: Shareholder references Unit (via ShareLedgerEntry), PurchaseApplication references Unit & Shareholder,
  #       SubletAgreement & AlterationAgreement reference Unit

  state_machine_shape: compound
  # compound: Meeting.meeting_status derives from child Ballot quorum count
  # branching: PurchaseApplication has cycle (UNDER_REVIEW → INFO_REQUESTED → UNDER_REVIEW)
  # parallel: Meeting has (preparation × quorum) orthogonal dimensions

  relationship_patterns:
    - one_to_many      # Cooperative → Unit, ChargeSchedule, Meeting
    - many_to_many     # Shareholder ↔ Unit via ShareLedgerEntry
    - cross_aggregate  # PurchaseApplication → Unit & Shareholder; ArrearsAction → Shareholder & ChargeSchedule
    - self_referential # Resolution.supersedes_resolution_id (policy versioning)

  role_model: segregation_of_duties
  # BoardOfficer (Managing Agent's counterpart): may certify transfer but NOT conduct interview
  # BoardMember: conducts interviews, votes on resolutions, but cannot certify
  # ManagingAgent: bookkeeping, charge generation, arrears issuance — cannot vote
  # Shareholder: initiates purchase applications, sublets, alterations — cannot vote as board
  # The same natural person (X-User-ID) cannot simultaneously hold BoardOfficer and BoardMember authority over the same Resolution

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Cooperative
    parent: null
    common_fields: true
    fields:
      - { name: name,                    type: string,  source: input,   description: "Legal name of the housing cooperative corporation" }
      - { name: address,                 type: string,  source: input,   description: "Street address of the building" }
      - { name: total_shares,            type: integer, source: computed,description: "Sum of all issued shares across Units; must equal sum over Unit.shares_allocated; invariant INV-SHARES" }
      - { name: underlying_mortgage_principal_cents, type: integer, source: input, description: "Outstanding principal on the building's underlying permanent mortgage" }
      - { name: underlying_mortgage_rate_bps,        type: integer, source: input, description: "Annual interest rate in basis points on the underlying mortgage" }
      - { name: flip_tax_policy,         type: enum,    source: input,   description: "GROSS_PERCENT | PER_SHARE — which flip-tax formula is in effect", default: "GROSS_PERCENT" }
      - { name: flip_tax_percent_bps,    type: integer, source: input,   description: "When policy=GROSS_PERCENT, percent of gross sale price in bps (e.g. 200 = 2%)", default: 200 }
      - { name: flip_tax_per_share_cents, type: integer, source: input,  description: "When policy=PER_SHARE, flip tax in cents per share transferred", default: 50000 }
      - { name: sublet_policy_years_max, type: integer, source: input,   description: "Max consecutive years a unit may be sublet before mandatory owner-occupancy gap", default: 2 }
      - { name: sublet_policy_gap_years, type: integer, source: input,   description: "Required owner-occupied gap in years between sublet terms", default: 1 }
      - { name: arrears_late_fee_flat_cents, type: integer, source: input, description: "Flat late fee charged once a charge becomes past due", default: 5000 }
      - { name: arrears_interest_rate_bps,   type: integer, source: input, description: "APR in bps applied to arrears balance after grace period", default: 600 }
      - { name: arrears_grace_days,          type: integer, source: input, description: "Days after due_date before late fee + interest start", default: 10 }
      - { name: arrears_termination_threshold_cents, type: integer, source: input, description: "If arrears_balance_cents >= threshold, board may issue termination notice", default: 1000000 }
      - { name: annual_meeting_quorum_percent_bps, type: integer, source: input, description: "Quorum as percent of total_shares represented in person or by proxy, in bps (5000 = 50.00%)", default: 5000 }
      - { name: current_utc,                 type: datetime, source: system, description: "Logical clock; defaults to 2026-08-01T00:00:00Z at startup; mutated only via POST /cooperatives/{id}/_clock/set_current_utc" }

  - name: Unit
    parent: Cooperative
    common_fields: true
    fields:
      - { name: cooperative_id,          type: string,  source: system,  description: "FK -> Cooperative.id" }
      - { name: unit_label,              type: string,  source: input,   description: "E.g. '3B', 'PH-A'" }
      - { name: shares_allocated,        type: integer, source: input,   description: "Shares allocated to this unit; must be > 0; mutations must preserve Cooperative.total_shares" }
      - { name: occupancy_status,        type: enum,    source: computed,description: "OWNER_OCCUPIED | SUBLET | VACANT — derived from most recent active SubletAgreement & PurchaseApplication; OWNER_OCCUPIED if no active sublet" }
      - { name: last_sublet_end_date,    type: datetime,source: computed,description: "End date of most recently COMPLETED sublet; null if never sublet; used for sublet-policy gap rule" }

  - name: Shareholder
    parent: Cooperative
    common_fields: true
    fields:
      - { name: cooperative_id,          type: string,  source: system,  description: "FK -> Cooperative.id" }
      - { name: full_name,               type: string,  source: input,   description: "Shareholder legal name" }
      - { name: email,                   type: string,  source: input,   description: "Contact email; unique within cooperative" }
      - { name: standing,                type: enum,    source: computed,description: "GOOD_STANDING | DELINQUENT | TERMINATED — derived from arrears_balance_cents and any ArrearsAction in TERMINATION_ISSUED state" }
      - { name: arrears_balance_cents,   type: integer, source: computed,description: "Sum of MaintenanceCharge.outstanding_cents across all units owned; recomputed on every charge/payment write" }

  - name: ShareLedgerEntry
    parent: Cooperative
    common_fields: true
    fields:
      - { name: cooperative_id,          type: string,  source: system,  description: "FK -> Cooperative.id" }
      - { name: unit_id,                 type: string,  source: input,   description: "FK -> Unit.id" }
      - { name: shareholder_id,          type: string,  source: input,   description: "FK -> Shareholder.id" }
      - { name: shares_held,             type: integer, source: input,   description: "Number of shares this entry assigns; sum across entries for a unit MUST equal Unit.shares_allocated" }
      - { name: entry_status,            type: enum,    source: system,  description: "ACTIVE | SUPERSEDED — SUPERSEDED when a PurchaseApplication in TRANSFERRED state replaces it" }
      - { name: effective_at,            type: datetime,source: system,  description: "UTC timestamp when this entry became ACTIVE" }

  - name: ChargeSchedule
    parent: Cooperative
    common_fields: true
    fields:
      - { name: cooperative_id,          type: string,  source: system,  description: "FK -> Cooperative.id" }
      - { name: fiscal_year,             type: integer, source: input,   description: "Calendar year this schedule applies to (e.g. 2027)" }
      - { name: annual_operating_budget_cents, type: integer, source: input, description: "Total annual operating budget" }
      - { name: allocation_method,       type: enum,    source: input,   description: "PRO_RATA_SHARES | EQUAL_SPLIT — chosen by board resolution" }
      - { name: schedule_status,         type: enum,    source: system,  description: "DRAFT | APPROVED | SUPERSEDED" }
      - { name: effective_from,          type: datetime,source: input,   description: "UTC start of schedule effect" }
      - { name: effective_to,            type: datetime,source: input,   description: "UTC end (exclusive)" }
      - { name: approving_resolution_id, type: string,  source: system,  description: "FK -> Resolution.id; null until approved" }

  - name: MaintenanceCharge
    parent: Cooperative
    common_fields: true
    fields:
      - { name: cooperative_id,          type: string,  source: system,  description: "FK -> Cooperative.id" }
      - { name: unit_id,                 type: string,  source: system,  description: "FK -> Unit.id" }
      - { name: schedule_id,             type: string,  source: system,  description: "FK -> ChargeSchedule.id; which schedule generated this charge" }
      - { name: billing_month,           type: string,  source: system,  description: "YYYY-MM (UTC)" }
      - { name: due_date,                type: datetime,source: system,  description: "UTC due date (typically 1st of month)" }
      - { name: base_amount_cents,       type: integer, source: computed,description: "Base maintenance per allocation formula" }
      - { name: late_fee_cents,          type: integer, source: computed,description: "Flat late fee applied when past grace period" }
      - { name: interest_cents,          type: integer, source: computed,description: "Accrued interest on outstanding balance" }
      - { name: paid_cents,              type: integer, source: computed,description: "Sum of posted Payments against this charge" }
      - { name: outstanding_cents,       type: integer, source: computed,description: "base_amount_cents + late_fee_cents + interest_cents - paid_cents; >= 0" }
      - { name: charge_status,           type: enum,    source: system,  description: "PENDING | ISSUED | PARTIALLY_PAID | PAID | PAST_DUE | WAIVED" }

  - name: Payment
    parent: Cooperative
    common_fields: true
    fields:
      - { name: cooperative_id,          type: string,  source: system,  description: "FK -> Cooperative.id" }
      - { name: shareholder_id,          type: string,  source: input,   description: "FK -> Shareholder.id" }
      - { name: charge_id,               type: string,  source: input,   description: "FK -> MaintenanceCharge.id" }
      - { name: amount_cents,            type: integer, source: input,   description: "Amount being applied to the charge" }
      - { name: posted_at,               type: datetime,source: system,  description: "UTC when posted" }
      - { name: payment_status,          type: enum,    source: system,  description: "POSTED | VOIDED" }

  - name: ArrearsAction
    parent: Cooperative
    common_fields: true
    fields:
      - { name: cooperative_id,          type: string,  source: system,  description: "FK -> Cooperative.id" }
      - { name: shareholder_id,          type: string,  source: system,  description: "FK -> Shareholder.id" }
      - { name: action_type,             type: enum,    source: input,   description: "LATE_NOTICE | DEMAND_LETTER | TERMINATION_NOTICE" }
      - { name: action_status,           type: enum,    source: system,  description: "ISSUED | CURED | ESCALATED | WITHDRAWN" }
      - { name: issued_at,               type: datetime,source: system,  description: "UTC issued" }
      - { name: cure_deadline,           type: datetime,source: computed,description: "UTC by which shareholder must pay to cure; LATE_NOTICE=+30d, DEMAND_LETTER=+15d, TERMINATION_NOTICE=+10d" }
      - { name: cure_amount_cents,       type: integer, source: computed,description: "Snapshot of Shareholder.arrears_balance_cents at issuance" }

  - name: PurchaseApplication
    parent: Cooperative
    common_fields: true
    fields:
      - { name: cooperative_id,          type: string,  source: system,  description: "FK -> Cooperative.id" }
      - { name: unit_id,                 type: string,  source: input,   description: "FK -> Unit.id" }
      - { name: seller_shareholder_id,   type: string,  source: input,   description: "FK -> Shareholder.id (current owner)" }
      - { name: buyer_full_name,         type: string,  source: input,   description: "Buyer's legal name (may not yet be a Shareholder)" }
      - { name: buyer_email,             type: string,  source: input,   description: "Buyer contact email" }
      - { name: gross_sale_price_cents,  type: integer, source: input,   description: "Contract sale price" }
      - { name: financing_percent_bps,   type: integer, source: input,   description: "Portion of price financed by buyer's mortgage, in bps; cooperative caps this (typically 8000 = 80%)" }
      - { name: application_status,      type: enum,    source: system,  description: "DRAFT | SUBMITTED | UNDER_REVIEW | INFO_REQUESTED | INTERVIEW_SCHEDULED | APPROVED | REJECTED | WITHDRAWN | TRANSFERRED" }
      - { name: flip_tax_cents,          type: integer, source: computed,description: "Computed flip tax at TRANSFERRED time using Cooperative.flip_tax_policy in effect at that instant" }
      - { name: debt_to_income_bps,      type: integer, source: input,   description: "Buyer's declared debt-to-income ratio in bps (e.g. 2800 = 28%)" }
      - { name: post_closing_liquidity_cents, type: integer, source: input, description: "Buyer's declared liquid assets post-closing" }
      - { name: submitted_at,            type: datetime,source: system,  description: "UTC submitted; null while DRAFT" }
      - { name: deciding_resolution_id,  type: string,  source: system,  description: "FK -> Resolution.id; set on APPROVED or REJECTED" }
      - { name: transferred_at,          type: datetime,source: system,  description: "UTC transfer completion; null until TRANSFERRED" }

  - name: Interview
    parent: Cooperative
    common_fields: true
    fields:
      - { name: cooperative_id,          type: string,  source: system,  description: "FK -> Cooperative.id" }
      - { name: application_id,          type: string,  source: input,   description: "FK -> PurchaseApplication.id" }
      - { name: scheduled_at,            type: datetime,source: input,   description: "UTC interview time; must be in future" }
      - { name: panel_member_user_ids,   type: array,   source: input,   description: "Array of X-User-IDs of BoardMembers conducting the interview; >=2 members required; must NOT include the BoardOfficer who certified the application" }
      - { name: interview_outcome,       type: enum,    source: system,  description: "PENDING | FAVORABLE | UNFAVORABLE | WAIVED" }
      - { name: interview_status,        type: enum,    source: system,  description: "SCHEDULED | COMPLETED | CANCELLED | NO_SHOW" }
      - { name: completed_at,            type: datetime,source: system,  description: "UTC completion; null until COMPLETED" }

  - name: Resolution
    parent: Cooperative
    common_fields: true
    fields:
      - { name: cooperative_id,          type: string,  source: system,  description: "FK -> Cooperative.id" }
      - { name: resolution_kind,         type: enum,    source: input,   description: "APPROVE_PURCHASE | REJECT_PURCHASE | APPROVE_SCHEDULE | APPROVE_REFINANCE | APPROVE_SUBLET | APPROVE_ALTERATION | ISSUE_ARREARS_ACTION | SET_POLICY" }
      - { name: subject_entity_kind,     type: enum,    source: input,   description: "PurchaseApplication | ChargeSchedule | SubletAgreement | AlterationAgreement | Shareholder | Cooperative" }
      - { name: subject_entity_id,       type: string,  source: input,   description: "id of the entity being decided" }
      - { name: payload_json,            type: object,  source: input,   description: "Kind-specific payload (e.g. new mortgage rate for refinance)" }
      - { name: votes_required,          type: integer, source: computed,description: "Majority of seated board (default 3 of 5) — captured from Cooperative at creation" }
      - { name: votes_for,               type: integer, source: computed,description: "Count of FOR votes cast" }
      - { name: votes_against,           type: integer, source: computed,description: "Count of AGAINST votes cast" }
      - { name: votes_abstain,           type: integer, source: computed,description: "Count of ABSTAIN votes cast" }
      - { name: resolution_status,       type: enum,    source: system,  description: "OPEN | PASSED | FAILED | WITHDRAWN" }
      - { name: supersedes_resolution_id, type: string, source: input,   description: "FK -> Resolution.id; for SET_POLICY resolutions replacing a prior policy; null otherwise" }
      - { name: opened_at,               type: datetime,source: system,  description: "UTC opened" }
      - { name: closed_at,               type: datetime,source: system,  description: "UTC closed (PASSED/FAILED/WITHDRAWN)" }

  - name: ResolutionVote
    parent: Cooperative
    common_fields: true
    fields:
      - { name: cooperative_id,          type: string,  source: system,  description: "FK -> Cooperative.id" }
      - { name: resolution_id,           type: string,  source: input,   description: "FK -> Resolution.id" }
      - { name: voter_user_id,           type: string,  source: input,   description: "X-User-ID of the BoardMember casting the vote" }
      - { name: vote_choice,             type: enum,    source: input,   description: "FOR | AGAINST | ABSTAIN" }
      - { name: cast_at,                 type: datetime,source: system,  description: "UTC when cast" }

  - name: SubletAgreement
    parent: Cooperative
    common_fields: true
    fields:
      - { name: cooperative_id,          type: string,  source: system,  description: "FK -> Cooperative.id" }
      - { name: unit_id,                 type: string,  source: input,   description: "FK -> Unit.id" }
      - { name: shareholder_id,          type: string,  source: input,   description: "FK -> Shareholder.id (owner; must be in GOOD_STANDING)" }
      - { name: subtenant_name,          type: string,  source: input,   description: "Subtenant full name" }
      - { name: sublet_start_date,       type: datetime,source: input,   description: "UTC start of sublet" }
      - { name: sublet_end_date,         type: datetime,source: input,   description: "UTC end of sublet (exclusive)" }
      - { name: monthly_sublet_fee_cents,type: integer, source: computed,description: "Sublet fee per month: 15% of base maintenance at time of approval" }
      - { name: sublet_status,           type: enum,    source: system,  description: "DRAFT | SUBMITTED | APPROVED | ACTIVE | COMPLETED | REJECTED | TERMINATED_EARLY" }

  - name: AlterationAgreement
    parent: Cooperative
    common_fields: true
    fields:
      - { name: cooperative_id,          type: string,  source: system,  description: "FK -> Cooperative.id" }
      - { name: unit_id,                 type: string,  source: input,   description: "FK -> Unit.id" }
      - { name: shareholder_id,          type: string,  source: input,   description: "FK -> Shareholder.id" }
      - { name: scope_description,       type: string,  source: input,   description: "Description of work (e.g. kitchen renovation)" }
      - { name: contractor_name,         type: string,  source: input,   description: "Licensed contractor name" }
      - { name: contractor_insurance_cents, type: integer, source: input, description: "Contractor liability coverage in cents; must be >= cooperative minimum (default 1_000_000_00)" }
      - { name: work_window_start,       type: datetime,source: input,   description: "UTC start of permitted work window" }
      - { name: work_window_end,         type: datetime,source: input,   description: "UTC end of permitted work window" }
      - { name: security_deposit_cents,  type: integer, source: computed,description: "Refundable deposit: max(5% of contractor bid, $5_000)" }
      - { name: contractor_bid_cents,    type: integer, source: input,   description: "Contractor bid amount" }
      - { name: involves_wet_over_dry,   type: boolean, source: input,   description: "true if work involves wet-over-dry plumbing changes (requires board review regardless of bid)" }
      - { name: alteration_status,       type: enum,    source: system,  description: "DRAFT | SUBMITTED | APPROVED | IN_PROGRESS | COMPLETED | REJECTED | ABANDONED" }

  - name: Meeting
    parent: Cooperative
    common_fields: true
    fields:
      - { name: cooperative_id,          type: string,  source: system,  description: "FK -> Cooperative.id" }
      - { name: meeting_kind,            type: enum,    source: input,   description: "ANNUAL | SPECIAL" }
      - { name: scheduled_at,            type: datetime,source: input,   description: "UTC meeting start" }
      - { name: preparation_state,       type: enum,    source: system,  description: "PREPARING | NOTICE_SENT | ADJOURNED — orthogonal to quorum_state" }
      - { name: quorum_state,            type: enum,    source: computed,description: "QUORUM_PENDING | QUORUM_MET | QUORUM_FAILED — derived from Ballot shares represented vs Cooperative.annual_meeting_quorum_percent_bps" }
      - { name: shares_represented,      type: integer, source: computed,description: "Sum of shares represented by submitted Ballots (in person + proxy)" }
      - { name: meeting_status,          type: enum,    source: system,  description: "SCHEDULED | IN_SESSION | ADJOURNED_NO_QUORUM | COMPLETED — derived from (preparation_state × quorum_state)" }

  - name: Ballot
    parent: Cooperative
    common_fields: true
    fields:
      - { name: cooperative_id,          type: string,  source: system,  description: "FK -> Cooperative.id" }
      - { name: meeting_id,              type: string,  source: input,   description: "FK -> Meeting.id" }
      - { name: shareholder_id,          type: string,  source: input,   description: "FK -> Shareholder.id" }
      - { name: ballot_kind,             type: enum,    source: input,   description: "IN_PERSON | PROXY" }
      - { name: shares_voted,            type: integer, source: computed,description: "Sum of shares this shareholder controls at cast time (derived from active ShareLedgerEntry rows)" }
      - { name: candidate_user_ids,      type: array,   source: input,   description: "Array of X-User-IDs for board candidates; cumulative voting — each candidate can receive up to shares_voted votes" }
      - { name: ballot_status,           type: enum,    source: system,  description: "SUBMITTED | COUNTED | INVALIDATED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ChargeSchedule
    field: schedule_status
    initial_state: DRAFT
    terminal_states: [APPROVED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "system (Resolution of kind=APPROVE_SCHEDULE reaches PASSED with subject_entity_id = this schedule)"
        actor: system
        preconditions:
          - "Resolution.resolution_status == PASSED"
          - "Resolution.subject_entity_id == ChargeSchedule.id"
        side_effects:
          - "Sets approving_resolution_id"
          - "If any other ChargeSchedule for same cooperative overlapping [effective_from, effective_to) is APPROVED, that schedule transitions to SUPERSEDED"
          - "Marks all MaintenanceCharge rows already generated from the superseded schedule as WAIVED if their billing_month >= new schedule's effective month"
          - "Triggers generation of MaintenanceCharge rows for each Unit × each billing month within [effective_from, effective_to) using maintenance_monthly_charge calculation"
          - "Increments Cooperative.version"

      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (a later ChargeSchedule covering the same window becomes APPROVED)"
        actor: system
        preconditions:
          - "A newer ChargeSchedule APPROVED overlapping window"
        side_effects:
          - "All MaintenanceCharge rows in PENDING/ISSUED/PARTIALLY_PAID state for this schedule that have billing_month >= new effective month are WAIVED"
          - "Replacement charges are generated from the new schedule"

  - entity: MaintenanceCharge
    field: charge_status
    initial_state: PENDING
    terminal_states: [PAID, WAIVED]
    transitions:
      - from: PENDING
        to: ISSUED
        trigger: "system (logical clock reaches billing_month start)"
        actor: system
        preconditions:
          - "Cooperative.current_utc >= billing_month start"
        side_effects:
          - "Sets due_date"

      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /cooperatives/{cid}/maintenance-charges/{id}/payments with amount < outstanding_cents"
        actor: "ManagingAgent"
        preconditions:
          - "amount_cents > 0"
          - "amount_cents < outstanding_cents"
        side_effects:
          - "paid_cents += amount_cents"
          - "outstanding_cents recomputed"
          - "Shareholder.arrears_balance_cents recomputed"

      - from: [ISSUED, PARTIALLY_PAID, PAST_DUE]
        to: PAID
        trigger: "POST /cooperatives/{cid}/maintenance-charges/{id}/payments with amount >= outstanding_cents, OR system at grace check finds outstanding_cents == 0"
        actor: "ManagingAgent | system"
        preconditions:
          - "Resulting outstanding_cents == 0"
        side_effects:
          - "paid_cents = base + late_fee + interest"
          - "outstanding_cents = 0"
          - "Shareholder.arrears_balance_cents recomputed"
          - "Any open ArrearsAction for that shareholder with action_status == ISSUED is transitioned to CURED if arrears_balance_cents == 0"

      - from: ISSUED
        to: PAST_DUE
        trigger: "system (current_utc > due_date + Cooperative.arrears_grace_days AND outstanding_cents > 0)"
        actor: system
        preconditions:
          - "current_utc > due_date + grace_days"
          - "outstanding_cents > 0"
        side_effects:
          - "late_fee_cents = Cooperative.arrears_late_fee_flat_cents"
          - "interest_cents recomputed per arrears_interest formula"
          - "outstanding_cents recomputed"
          - "Shareholder.arrears_balance_cents recomputed"
          - "If shareholder.standing was GOOD_STANDING, transitions to DELINQUENT"

      - from: PAST_DUE
        to: PAST_DUE
        trigger: "system (daily interest accrual while current_utc advances)"
        actor: system
        preconditions: []
        side_effects:
          - "interest_cents recomputed using compounding daily formula"
          - "outstanding_cents recomputed"
          - "Shareholder.arrears_balance_cents recomputed"

      - from: PARTIALLY_PAID
        to: PAST_DUE
        trigger: "system (current_utc > due_date + grace_days AND outstanding_cents > 0)"
        actor: system
        preconditions:
          - "current_utc > due_date + grace_days"
          - "outstanding_cents > 0"
        side_effects:
          - "late_fee_cents = Cooperative.arrears_late_fee_flat_cents"
          - "interest_cents recomputed"
          - "outstanding_cents recomputed"

      - from: [PENDING, ISSUED, PARTIALLY_PAID]
        to: WAIVED
        trigger: "system (superseding ChargeSchedule becomes APPROVED covering this billing_month)"
        actor: system
        preconditions: []
        side_effects:
          - "outstanding_cents = 0"
          - "Shareholder.arrears_balance_cents recomputed"

  - entity: Payment
    field: payment_status
    initial_state: POSTED
    terminal_states: [VOIDED]
    transitions:
      - from: POSTED
        to: VOIDED
        trigger: "POST /cooperatives/{cid}/payments/{id}/void"
        actor: "ManagingAgent"
        preconditions:
          - "payment_status == POSTED"
          - "The associated MaintenanceCharge is not in PAID state, OR voiding would not make the charge's paid_cents negative"
        side_effects:
          - "MaintenanceCharge.paid_cents -= amount_cents"
          - "MaintenanceCharge.outstanding_cents recomputed"
          - "Shareholder.arrears_balance_cents recomputed"
          - "If charge was PAID and outstanding becomes > 0, charge transitions back to PARTIALLY_PAID (or PAST_DUE if past grace)"

  - entity: ArrearsAction
    field: action_status
    initial_state: ISSUED
    terminal_states: [CURED, ESCALATED, WITHDRAWN]
    transitions:
      - from: ISSUED
        to: CURED
        trigger: "system (shareholder pays all arrears before cure_deadline)"
        actor: system
        preconditions:
          - "Shareholder.arrears_balance_cents == 0"
          - "current_utc <= cure_deadline"
        side_effects: []

      - from: ISSUED
        to: ESCALATED
        trigger: "POST /cooperatives/{cid}/arrears-actions/{id}/escalate OR system (cure_deadline passes without cure)"
        actor: "BoardOfficer | system"
        preconditions:
          - "current_utc > cure_deadline AND shareholder.arrears_balance_cents > 0, OR BoardOfficer manually escalates"
          - "For action_type == TERMINATION_NOTICE, escalation additionally requires a PASSED Resolution of kind=ISSUE_ARREARS_ACTION"
        side_effects:
          - "If action_type == LATE_NOTICE, a new ArrearsAction of type DEMAND_LETTER is created (ISSUED)"
          - "If action_type == DEMAND_LETTER, a new ArrearsAction of type TERMINATION_NOTICE is created (ISSUED)"
          - "If action_type == TERMINATION_NOTICE, shareholder.standing transitions to TERMINATED"

      - from: ISSUED
        to: WITHDRAWN
        trigger: "POST /cooperatives/{cid}/arrears-actions/{id}/withdraw"
        actor: "BoardOfficer"
        preconditions:
          - "action_status == ISSUED"
        side_effects: []

  - entity: Shareholder
    field: standing
    initial_state: GOOD_STANDING
    terminal_states: [TERMINATED]
    transitions:
      - from: GOOD_STANDING
        to: DELINQUENT
        trigger: "system (any MaintenanceCharge transitions to PAST_DUE for a unit this shareholder owns)"
        actor: system
        preconditions:
          - "arrears_balance_cents > 0"
        side_effects: []

      - from: DELINQUENT
        to: GOOD_STANDING
        trigger: "system (arrears_balance_cents returns to 0)"
        actor: system
        preconditions:
          - "arrears_balance_cents == 0"
          - "No ArrearsAction in ISSUED state with action_type == TERMINATION_NOTICE"
        side_effects: []

      - from: DELINQUENT
        to: TERMINATED
        trigger: "system (TERMINATION_NOTICE ArrearsAction escalates)"
        actor: system
        preconditions:
          - "ArrearsAction of type TERMINATION_NOTICE in ESCALATED state for this shareholder"
          - "PASSED Resolution of kind=ISSUE_ARREARS_ACTION with subject_entity_id == shareholder.id"
        side_effects:
          - "All ShareLedgerEntry rows for this shareholder transition to SUPERSEDED"
          - "All SubletAgreement rows owned by this shareholder in APPROVED/ACTIVE state transition to TERMINATED_EARLY"
          - "All AlterationAgreement rows owned by this shareholder in APPROVED/IN_PROGRESS state transition to ABANDONED"
          - "All PurchaseApplication rows where this shareholder is the seller in any non-terminal state transition to WITHDRAWN"

  - entity: PurchaseApplication
    field: application_status
    initial_state: DRAFT
    terminal_states: [REJECTED, WITHDRAWN, TRANSFERRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /cooperatives/{cid}/purchase-applications/{id}/submit"
        actor: "Shareholder"
        preconditions:
          - "X-User-ID == seller_shareholder_id"
          - "Seller Shareholder.standing == GOOD_STANDING"
          - "No other PurchaseApplication for same unit_id in (SUBMITTED, UNDER_REVIEW, INFO_REQUESTED, INTERVIEW_SCHEDULED, APPROVED)"
          - "financing_percent_bps <= 8000 (80% max financing per house rules)"
          - "gross_sale_price_cents > 0"
        side_effects:
          - "Sets submitted_at"

      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /cooperatives/{cid}/purchase-applications/{id}/certify (Managing Agent certifies package completeness)"
        actor: "ManagingAgent"
        preconditions:
          - "application_status == SUBMITTED"
        side_effects:
          - "Increments Cooperative.version (any state change does)"

      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /cooperatives/{cid}/purchase-applications/{id}/request-info"
        actor: "BoardOfficer"
        preconditions:
          - "application_status == UNDER_REVIEW"
        side_effects: []

      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /cooperatives/{cid}/purchase-applications/{id}/submit-info"
        actor: "Shareholder"
        preconditions:
          - "X-User-ID == seller_shareholder_id"
        side_effects: []
        note: "cycle: UNDER_REVIEW → INFO_REQUESTED → UNDER_REVIEW allowed multiple times"

      - from: UNDER_REVIEW
        to: INTERVIEW_SCHEDULED
        trigger: "POST /cooperatives/{cid}/purchase-applications/{id}/schedule-interview (creates Interview)"
        actor: "BoardOfficer"
        preconditions:
          - "application_status == UNDER_REVIEW"
          - "panel_member_user_ids contains >= 2 distinct BoardMember X-User-IDs"
          - "No panel_member_user_ids entry equals the certifying ManagingAgent X-User-ID (segregation of duties)"
          - "scheduled_at > Cooperative.current_utc"
        side_effects:
          - "Creates Interview with interview_status=SCHEDULED, interview_outcome=PENDING"

      - from: INTERVIEW_SCHEDULED
        to: UNDER_REVIEW
        trigger: "system (Interview completed with outcome UNFAVORABLE — allows re-review) OR POST /cooperatives/{cid}/interviews/{id}/cancel"
        actor: "system | BoardOfficer"
        preconditions:
          - "Associated Interview is in COMPLETED or CANCELLED state"
        side_effects: []

      - from: INTERVIEW_SCHEDULED
        to: APPROVED
        trigger: "system (Resolution of kind=APPROVE_PURCHASE with subject_entity_id = this application reaches PASSED)"
        actor: system
        preconditions:
          - "Interview.interview_status == COMPLETED"
          - "Interview.interview_outcome == FAVORABLE"
          - "Resolution PASSED"
          - "Buyer debt_to_income_bps <= 2800 (28%)"
          - "Buyer post_closing_liquidity_cents >= 12 months of (current base maintenance + buyer's mortgage payment)"
        side_effects:
          - "Sets deciding_resolution_id"

      - from: [UNDER_REVIEW, INTERVIEW_SCHEDULED]
        to: REJECTED
        trigger: "system (Resolution of kind=REJECT_PURCHASE reaches PASSED)"
        actor: system
        preconditions:
          - "Resolution PASSED"
        side_effects:
          - "Sets deciding_resolution_id"

      - from: APPROVED
        to: TRANSFERRED
        trigger: "POST /cooperatives/{cid}/purchase-applications/{id}/record-transfer"
        actor: "BoardOfficer"
        preconditions:
          - "application_status == APPROVED"
          - "expected_cooperative_version in body matches Cooperative.version (OCC)"
        side_effects:
          - "Computes flip_tax_cents per flip_tax calculation"
          - "Sets transferred_at"
          - "All ShareLedgerEntry rows with unit_id = this.unit_id and entry_status == ACTIVE transition to SUPERSEDED"
          - "A new ShareLedgerEntry is created with shareholder_id = buyer, unit_id = this.unit_id, shares_held = unit.shares_allocated, entry_status = ACTIVE"
          - "A new Shareholder record is created for the buyer if one with buyer_email does not already exist"
          - "Seller Shareholder.standing recomputed (typically unchanged)"
          - "Increments Cooperative.version"

      - from: [DRAFT, SUBMITTED, UNDER_REVIEW, INFO_REQUESTED, INTERVIEW_SCHEDULED, APPROVED]
        to: WITHDRAWN
        trigger: "POST /cooperatives/{cid}/purchase-applications/{id}/withdraw"
        actor: "Shareholder"
        preconditions:
          - "X-User-ID == seller_shareholder_id"
          - "application_status != TRANSFERRED"
        side_effects:
          - "If INTERVIEW_SCHEDULED: associated Interview transitions to CANCELLED"

  - entity: Interview
    field: interview_status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /cooperatives/{cid}/interviews/{id}/complete with interview_outcome in (FAVORABLE, UNFAVORABLE)"
        actor: "BoardMember"
        preconditions:
          - "X-User-ID is in panel_member_user_ids"
          - "current_utc >= scheduled_at"
          - "interview_outcome in payload"
        side_effects:
          - "Sets completed_at"
          - "Sets interview_outcome"
          - "If UNFAVORABLE: associated PurchaseApplication transitions back to UNDER_REVIEW"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /cooperatives/{cid}/interviews/{id}/cancel OR system (PurchaseApplication withdrawn)"
        actor: "BoardOfficer | system"
        preconditions: []
        side_effects:
          - "Associated PurchaseApplication returns to UNDER_REVIEW if trigger is manual cancel"

      - from: SCHEDULED
        to: NO_SHOW
        trigger: "system (current_utc > scheduled_at + 24h without completion)"
        actor: system
        preconditions:
          - "current_utc > scheduled_at + 86400 seconds"
        side_effects:
          - "Associated PurchaseApplication returns to UNDER_REVIEW"

  - entity: Resolution
    field: resolution_status
    initial_state: OPEN
    terminal_states: [PASSED, FAILED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: PASSED
        trigger: "system (votes_for >= votes_required)"
        actor: system
        preconditions:
          - "votes_for >= votes_required"
        side_effects:
          - "Sets closed_at"
          - "Fires downstream transitions per resolution_kind:"
          - "  APPROVE_PURCHASE: PurchaseApplication → APPROVED"
          - "  REJECT_PURCHASE: PurchaseApplication → REJECTED"
          - "  APPROVE_SCHEDULE: ChargeSchedule → APPROVED (cascades into MaintenanceCharge generation)"
          - "  APPROVE_REFINANCE: Cooperative.underlying_mortgage_rate_bps and principal updated from payload_json; all APPROVED ChargeSchedules remain in place (refinance does not auto-rebudget)"
          - "  APPROVE_SUBLET: SubletAgreement → APPROVED"
          - "  APPROVE_ALTERATION: AlterationAgreement → APPROVED"
          - "  ISSUE_ARREARS_ACTION: referenced ArrearsAction → ESCALATED"
          - "  SET_POLICY: if supersedes_resolution_id present, that Resolution's status set to SUPERSEDED-equivalent (its policy no longer applies); Cooperative fields (flip_tax_*, sublet_policy_*, arrears_*) updated from payload_json"

      - from: OPEN
        to: FAILED
        trigger: "system (votes_against + votes_abstain > (board_size - votes_required), i.e. majority cannot be reached)"
        actor: system
        preconditions:
          - "Even if all remaining unvoted members vote FOR, votes_for still < votes_required"
        side_effects:
          - "Sets closed_at"

      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /cooperatives/{cid}/resolutions/{id}/withdraw"
        actor: "BoardOfficer"
        preconditions:
          - "resolution_status == OPEN"
          - "No ResolutionVote has been cast yet (votes_for+votes_against+votes_abstain == 0)"
        side_effects:
          - "Sets closed_at"

  - entity: SubletAgreement
    field: sublet_status
    initial_state: DRAFT
    terminal_states: [COMPLETED, REJECTED, TERMINATED_EARLY]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /cooperatives/{cid}/sublet-agreements/{id}/submit"
        actor: "Shareholder"
        preconditions:
          - "X-User-ID == shareholder_id"
          - "Shareholder.standing == GOOD_STANDING"
          - "Unit.occupancy_status != SUBLET (no concurrent active sublet)"
          - "sublet_start_date < sublet_end_date"
          - "sublet window length <= Cooperative.sublet_policy_years_max years"
          - "If Unit.last_sublet_end_date non-null: sublet_start_date >= last_sublet_end_date + Cooperative.sublet_policy_gap_years"
          - "No other SubletAgreement for same unit_id in (SUBMITTED, APPROVED, ACTIVE) with overlapping [sublet_start_date, sublet_end_date)"
        side_effects: []

      - from: SUBMITTED
        to: APPROVED
        trigger: "system (Resolution of kind=APPROVE_SUBLET reaches PASSED)"
        actor: system
        preconditions:
          - "Resolution PASSED"
        side_effects:
          - "monthly_sublet_fee_cents computed = ceil(0.15 × current base maintenance for this unit)"

      - from: APPROVED
        to: ACTIVE
        trigger: "system (current_utc >= sublet_start_date)"
        actor: system
        preconditions:
          - "current_utc >= sublet_start_date"
          - "current_utc < sublet_end_date"
        side_effects:
          - "Unit.occupancy_status = SUBLET"

      - from: ACTIVE
        to: COMPLETED
        trigger: "system (current_utc >= sublet_end_date)"
        actor: system
        preconditions:
          - "current_utc >= sublet_end_date"
        side_effects:
          - "Unit.occupancy_status = OWNER_OCCUPIED"
          - "Unit.last_sublet_end_date = sublet_end_date"

      - from: [SUBMITTED, APPROVED]
        to: REJECTED
        trigger: "system (Resolution FAILED) OR POST /cooperatives/{cid}/sublet-agreements/{id}/reject"
        actor: "system | BoardOfficer"
        preconditions: []
        side_effects: []

      - from: [APPROVED, ACTIVE]
        to: TERMINATED_EARLY
        trigger: "POST /cooperatives/{cid}/sublet-agreements/{id}/terminate-early OR system (shareholder TERMINATED)"
        actor: "BoardOfficer | system"
        preconditions: []
        side_effects:
          - "Unit.occupancy_status = OWNER_OCCUPIED"
          - "Unit.last_sublet_end_date = current_utc"

  - entity: AlterationAgreement
    field: alteration_status
    initial_state: DRAFT
    terminal_states: [COMPLETED, REJECTED, ABANDONED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /cooperatives/{cid}/alteration-agreements/{id}/submit"
        actor: "Shareholder"
        preconditions:
          - "X-User-ID == shareholder_id"
          - "Shareholder.standing == GOOD_STANDING"
          - "contractor_insurance_cents >= 100000000 ($1M minimum)"
          - "work_window_start < work_window_end"
          - "No other AlterationAgreement for same unit_id in (APPROVED, IN_PROGRESS) with overlapping [work_window_start, work_window_end)"
        side_effects:
          - "security_deposit_cents = max(ceil(0.05 × contractor_bid_cents), 500000)"

      - from: SUBMITTED
        to: APPROVED
        trigger: "system (Resolution of kind=APPROVE_ALTERATION reaches PASSED)"
        actor: system
        preconditions:
          - "Resolution PASSED"
          - "If involves_wet_over_dry == true, resolution payload_json must include explicit wet_over_dry_ack: true"
        side_effects: []

      - from: SUBMITTED
        to: REJECTED
        trigger: "system (Resolution FAILED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: IN_PROGRESS
        trigger: "POST /cooperatives/{cid}/alteration-agreements/{id}/start-work"
        actor: "Shareholder"
        preconditions:
          - "X-User-ID == shareholder_id"
          - "current_utc >= work_window_start"
          - "current_utc < work_window_end"
        side_effects: []

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /cooperatives/{cid}/alteration-agreements/{id}/complete"
        actor: "Shareholder"
        preconditions:
          - "X-User-ID == shareholder_id"
        side_effects:
          - "security_deposit_cents released (returned to shareholder; not tracked in arrears ledger)"

      - from: [APPROVED, IN_PROGRESS]
        to: ABANDONED
        trigger: "POST /cooperatives/{cid}/alteration-agreements/{id}/abandon OR system (shareholder TERMINATED) OR system (current_utc >= work_window_end and not COMPLETED)"
        actor: "Shareholder | system | BoardOfficer"
        preconditions: []
        side_effects:
          - "If ABANDONED before start: security_deposit_cents released in full"
          - "If ABANDONED after IN_PROGRESS: security_deposit_cents is held for inspection (business decision; not modeled as a transfer here)"

  - entity: Meeting
    field: meeting_status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, ADJOURNED_NO_QUORUM]
    note: "Two orthogonal dimensions: preparation_state (PREPARING/NOTICE_SENT/ADJOURNED) and quorum_state (QUORUM_PENDING/QUORUM_MET/QUORUM_FAILED). meeting_status derives from both."
    transitions:
      - from: SCHEDULED
        to: IN_SESSION
        trigger: "POST /cooperatives/{cid}/meetings/{id}/open"
        actor: "BoardOfficer"
        preconditions:
          - "current_utc >= scheduled_at"
          - "preparation_state == NOTICE_SENT (notice must have been sent first)"
        side_effects: []

      - from: IN_SESSION
        to: COMPLETED
        trigger: "POST /cooperatives/{cid}/meetings/{id}/close"
        actor: "BoardOfficer"
        preconditions:
          - "quorum_state == QUORUM_MET"
        side_effects:
          - "All SUBMITTED Ballots transition to COUNTED"

      - from: IN_SESSION
        to: ADJOURNED_NO_QUORUM
        trigger: "POST /cooperatives/{cid}/meetings/{id}/close when quorum_state != QUORUM_MET, OR system (current_utc > scheduled_at + 24h and QUORUM_PENDING)"
        actor: "BoardOfficer | system"
        preconditions:
          - "quorum_state != QUORUM_MET"
        side_effects:
          - "All SUBMITTED Ballots transition to INVALIDATED"
          - "preparation_state = ADJOURNED"

  - entity: Ballot
    field: ballot_status
    initial_state: SUBMITTED
    terminal_states: [COUNTED, INVALIDATED]
    transitions:
      - from: SUBMITTED
        to: COUNTED
        trigger: "system (Meeting transitions to COMPLETED)"
        actor: system
        preconditions:
          - "Meeting.meeting_status == COMPLETED"
        side_effects: []

      - from: SUBMITTED
        to: INVALIDATED
        trigger: "system (Meeting transitions to ADJOURNED_NO_QUORUM, or another Ballot for same shareholder in same meeting is submitted later and supersedes)"
        actor: system
        preconditions: []
        side_effects:
          - "Meeting.shares_represented recomputed"
          - "Meeting.quorum_state recomputed"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: purchase-record-transfer-stale-coop-version
    parent_entity: Cooperative
    write_endpoint: "POST /cooperatives/{cid}/purchase-applications/{id}/record-transfer"
    occ_field: expected_cooperative_version
    description: |
      Recording a transfer against a Cooperative whose version has advanced since the
      buyer/seller last observed it is rejected. This captures the case where, between
      approval and recording, the cooperative's flip-tax policy or share totals were
      modified by another writer (e.g., a SET_POLICY Resolution PASSED), so the client
      computing flip_tax_cents on a stale view would record the wrong number.
    error_id: ERR_STALE_COOP_VERSION
    http_status: 412

  - rule_id: schedule-supersede-stale-coop-version
    parent_entity: Cooperative
    write_endpoint: "POST /cooperatives/{cid}/charge-schedules"
    occ_field: expected_cooperative_version
    description: |
      Creating a ChargeSchedule against a Cooperative whose version has advanced since
      the client last observed it is rejected. Captures the case where another writer
      has just modified the share allocation or total_shares (which directly feeds the
      maintenance_monthly_charge formula) and the current writer's draft therefore
      encodes a stale fiscal basis.
    error_id: ERR_STALE_COOP_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: maintenance_monthly_charge
    trigger: "ChargeSchedule transitions DRAFT → APPROVED"
    algorithm: aggregation
    formula: |
      Inputs:
        B = ChargeSchedule.annual_operating_budget_cents
        M = 12 (months per year)
        N = number of Units in the Cooperative (always > 0)
        For each unit u:
          s_u = u.shares_allocated
          S_total = Cooperative.total_shares  (sum of s_u over all u)

      If allocation_method == PRO_RATA_SHARES:
        # Pin rounding order: compute annual share first, then divide by 12.
        # Round ONLY the final monthly value to cents.
        monthly_for_unit_u = round_half_up( (B × s_u) / (S_total × M) )
      Else if allocation_method == EQUAL_SPLIT:
        monthly_for_unit_u = round_half_up( B / (N × M) )

      # Reconciliation: the sum across all units × 12 may differ from B by a
      # small rounding residual. The largest unit (by shares_allocated,
      # tie-break created_at ASC) absorbs the residual:
      #   residual_cents = B - 12 × sum(monthly_for_unit_u)
      #   monthly_for_unit_largest += round_half_up(residual_cents / 12)
      # (applied once at schedule approval, not at every billing)
    input_set: "All Units in cooperative (no status filter — all Units participate regardless of occupancy); Cooperative.total_shares; ChargeSchedule"
    constants:
      MONTHS_PER_YEAR: 12
    precision: "0 decimal places (integer cents), round_half_up"
    variants:
      - name: pro_rata
        when: "allocation_method == PRO_RATA_SHARES"
        difference: "Charge proportional to shares_allocated; residual absorbed by largest-share unit"
      - name: equal_split
        when: "allocation_method == EQUAL_SPLIT"
        difference: "Same charge for every unit; residual absorbed by lexicographically-first unit (by created_at ASC)"

  - name: flip_tax
    trigger: "PurchaseApplication transitions APPROVED → TRANSFERRED (record-transfer)"
    algorithm: tiered_pricing
    formula: |
      Look up Cooperative.flip_tax_policy at the moment record-transfer is called.

      If policy == GROSS_PERCENT:
        flip_tax_cents = round_half_up( gross_sale_price_cents × flip_tax_percent_bps / 10000 )
      Else if policy == PER_SHARE:
        flip_tax_cents = unit.shares_allocated × flip_tax_per_share_cents
        # Note: per-share uses the UNIT's allocation, NOT the buyer's financing
        # percent; it is independent of price.

      Boundary: if flip_tax_percent_bps == 0 (or per_share_cents == 0), tax is 0.
      Flip tax is computed ONCE at transfer and stored on the application; later
      policy changes do NOT retroactively modify recorded transfers.
    input_set: "PurchaseApplication (this), Unit, Cooperative (at transfer instant)"
    constants: {}
    precision: "0 decimal places (integer cents), round_half_up"
    variants:
      - name: gross_percent
        when: "Cooperative.flip_tax_policy == GROSS_PERCENT"
        difference: "Tax scales linearly with sale price"
      - name: per_share
        when: "Cooperative.flip_tax_policy == PER_SHARE"
        difference: "Tax is independent of price; depends only on shares_allocated"

  - name: arrears_interest_accrual
    trigger: "system (daily, when current_utc advances past a UTC day boundary while charge is PAST_DUE)"
    algorithm: chronological
    formula: |
      Daily interest accrual on outstanding balance.

      For each MaintenanceCharge in PAST_DUE state:
        days_past_grace = max(0, floor((current_utc - (due_date + grace_days)) / 86400))
        daily_rate_bps = Cooperative.arrears_interest_rate_bps / 365
        # Simple (non-compounding) interest on the (base + late_fee) outstanding
        # at the moment the charge became PAST_DUE. Payments reduce the principal
        # basis on subsequent days.
        interest_cents_for_today =
          round_half_up( outstanding_principal_cents × daily_rate_bps / 10000 )
        # where outstanding_principal_cents = base_amount_cents + late_fee_cents - paid_cents
        # (i.e., interest is NOT computed on prior interest)
      Aggregate interest_cents = sum of daily accruals since PAST_DUE transition.

      Boundary precision: a charge that becomes PAST_DUE at exactly
      current_utc == due_date + grace_days + 1 second accrues 1 day of interest
      on that first tick. If current_utc == due_date + grace_days exactly,
      days_past_grace == 0 and no interest accrues.
    input_set: "MaintenanceCharges in PAST_DUE state; Payments applied"
    constants:
      SECONDS_PER_DAY: 86400
      DAYS_PER_YEAR: 365
    precision: "0 decimal places (integer cents), round_half_up"

  - name: arrears_late_fee
    trigger: "system (MaintenanceCharge transitions ISSUED/PARTIALLY_PAID → PAST_DUE)"
    algorithm: threshold
    formula: |
      On transition to PAST_DUE, exactly one flat late fee is applied:
        late_fee_cents = Cooperative.arrears_late_fee_flat_cents
      This is a one-time charge per MaintenanceCharge (not recurring).
      Boundary: charge at current_utc == due_date + grace_days is NOT yet past due.
      Charge at current_utc == due_date + grace_days + 1 second IS past due.
    input_set: "MaintenanceCharge transitioning to PAST_DUE"
    constants: {}
    precision: "0 decimal places (integer cents)"

  - name: sublet_monthly_fee
    trigger: "SubletAgreement transitions SUBMITTED → APPROVED"
    algorithm: threshold
    formula: |
      monthly_sublet_fee_cents = round_half_up( current_base_maintenance_for_unit × SUBLET_FEE_RATE_BPS / 10000 )
      where current_base_maintenance_for_unit is the base_amount_cents of the
      MaintenanceCharge for this unit in the current billing_month (as of approval),
      or 0 if no such charge exists yet.
    input_set: "SubletAgreement, Unit, MaintenanceCharge (current month)"
    constants:
      SUBLET_FEE_RATE_BPS: 1500    # 15%
    precision: "0 decimal places (integer cents), round_half_up"

  - name: quorum_check
    trigger: "every Ballot submission; every Ballot INVALIDATED transition; Meeting open"
    algorithm: threshold
    formula: |
      shares_represented = sum over Ballots in SUBMITTED or COUNTED state
                           of Ballot.shares_voted
      quorum_threshold_shares =
        ceil( Cooperative.total_shares × annual_meeting_quorum_percent_bps / 10000 )
      quorum_state = QUORUM_MET if shares_represented >= quorum_threshold_shares
                     else QUORUM_PENDING if meeting_status in (SCHEDULED, IN_SESSION)
                     else QUORUM_FAILED (when ADJOURNED_NO_QUORUM)

      Boundary: shares_represented == threshold EXACTLY counts as MET (>=, not >).
      Tie-break when shares_voted changes mid-meeting (e.g. a Ballot is invalidated):
      recompute from scratch over SUBMITTED ∪ COUNTED ballots, never incrementally.
    input_set: "Ballots for the meeting in (SUBMITTED, COUNTED) state"
    constants: {}
    precision: "integer shares; ceiling division"

  - name: election_tally
    trigger: "Meeting transitions IN_SESSION → COMPLETED"
    algorithm: weighted_scoring
    formula: |
      Cumulative voting: each Ballot has shares_voted votes that may be allocated
      across candidate_user_ids in any proportion.

      For benchmark determinism, this scaffold pins a SIMPLIFIED rule: each
      candidate listed in a Ballot receives shares_voted votes (i.e., a Ballot
      with [candA, candB] contributes shares_voted to EACH of candA and candB).

      candidate_total[c] = sum over COUNTED Ballots listing c of Ballot.shares_voted

      Sort candidates by candidate_total DESC.
      Tie-break: candidate whose supporting Ballot with the most shares was cast
      earliest (cast_at ASC). If still tied (same Ballot supports both), the
      candidate whose X-User-ID string is lexicographically smaller wins.

      Top K candidates win, where K = number of open seats (passed in the
      close-meeting payload).
    input_set: "Ballots in COUNTED state for the meeting"
    constants: {}
    precision: "integer votes"

  - name: refinance_payment_estimator
    trigger: "Resolution of kind=APPROVE_REFINANCE transitions OPEN → PASSED"
    algorithm: forward_looking
    formula: |
      Computes new annual mortgage payment based on proposed rate.

      annual_payment_cents_new =
        round_half_up( principal_cents × rate_bps_new / 10000 )
        # Simplified: interest-only approximation for benchmark determinism.

      delta_vs_current_cents =
        annual_payment_cents_new -
        round_half_up( Cooperative.underlying_mortgage_principal_cents ×
                       Cooperative.underlying_mortgage_rate_bps / 10000 )

      Persist delta_vs_current_cents in payload_json for audit.
      Note: this calculation is forward-looking (projects impact); it does NOT
      automatically re-budget the current fiscal year's ChargeSchedule.
    input_set: "Cooperative.underlying_mortgage_principal_cents, Resolution.payload_json.rate_bps_new"
    constants: {}
    precision: "0 decimal places (integer cents), round_half_up"

  - name: buyer_liquidity_requirement
    trigger: "Resolution APPROVE_PURCHASE voting; evaluated at PASSED transition"
    algorithm: threshold
    formula: |
      Buyer must satisfy BOTH:
        (a) debt_to_income_bps <= DTI_MAX_BPS (= 2800, i.e., 28%)
        (b) post_closing_liquidity_cents >= 12 × (monthly_maintenance + monthly_mortgage)
            where monthly_maintenance = base_amount_cents of unit's current month charge
                  (or 0 if no charge exists yet)
                  monthly_mortgage = round_half_up( (gross_sale_price_cents × financing_percent_bps / 10000) × MORTGAGE_RATE_ASSUMPTION_BPS / 10000 / 12 )
                  MORTGAGE_RATE_ASSUMPTION_BPS = 700 (7% APR assumption)
    input_set: "PurchaseApplication, Unit (current month MaintenanceCharge)"
    constants:
      DTI_MAX_BPS: 2800
      MORTGAGE_RATE_ASSUMPTION_BPS: 700
      MONTHS_LIQUIDITY_REQUIRED: 12
    precision: "0 decimal places (integer cents), round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is permitted for the requested endpoint per §1.5 roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "Ownership: where endpoint requires the caller to BE a specific Shareholder (e.g., submit own application), X-User-ID must match the relevant shareholder id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "shareholder-self endpoints (submit/withdraw purchase, submit/complete/abandon alteration, submit sublet, cast ballot)"

  - priority: 4
    category: existence
    check: "Path parameters identify existing resources in the correct cooperative scope (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is permitted"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "state transition endpoints"

  - priority: 6
    category: business_safety
    check: "Alteration safety: contractor insurance minimum, wet-over-dry requires explicit acknowledgment"
    error_id: ERR_ALTERATION_SAFETY_VIOLATION
    http_status: 422
    applies_to: "POST /cooperatives/{cid}/alteration-agreements, POST .../submit, Resolution APPROVE_ALTERATION"

  - priority: 7
    category: business_referential
    check: "Cross-entity referential integrity: referenced entity exists AND is in a compatible state (e.g., buyer seller in GOOD_STANDING, schedule in DRAFT, panel members not certifying agent)"
    error_id: ERR_CROSS_ENTITY_VIOLATION
    http_status: 422
    applies_to: "many"

  - priority: 8
    category: business_temporal
    check: "Temporal consistency: dates/windows ordered, no overlapping intervals where prohibited (sublet overlap, alteration overlap, scheduled_at in future)"
    error_id: ERR_TEMPORAL_CONFLICT
    http_status: 422
    applies_to: "sublet/alteration/interview/meeting scheduling endpoints"

  - priority: 9
    category: business_constraint
    check: "Domain constraints: share conservation (sum of ShareLedgerEntry == Unit.shares_allocated), ballot uniqueness per shareholder per meeting, financing cap, panel quorum size"
    error_id: ERR_BUSINESS_CONSTRAINT
    http_status: 422
    applies_to: "many"

  - priority: 10
    category: business_fiscal
    check: "Fiscal thresholds: buyer DTI <= 2800 bps, buyer liquidity >= 12 months, arrears >= termination threshold"
    error_id: ERR_FISCAL_THRESHOLD_VIOLATION
    http_status: 422
    applies_to: "purchase approval, arrears action issuance"

  - priority: 11
    category: state
    check: "OCC precondition: expected_cooperative_version matches Cooperative.version"
    error_id: ERR_STALE_COOP_VERSION
    http_status: 412
    applies_to: "POST /cooperatives/{cid}/purchase-applications/{id}/record-transfer, POST /cooperatives/{cid}/charge-schedules"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Cooperative ---
  - method: POST
    path: "/cooperatives"
    description: "Create a new housing cooperative"
    roles: [PlatformAdmin]
    code: 201
    input: [name, address, underlying_mortgage_principal_cents, underlying_mortgage_rate_bps, "flip_tax_policy?", "flip_tax_percent_bps?", "flip_tax_per_share_cents?", "sublet_policy_years_max?", "sublet_policy_gap_years?", "arrears_late_fee_flat_cents?", "arrears_interest_rate_bps?", "arrears_grace_days?", "arrears_termination_threshold_cents?", "annual_meeting_quorum_percent_bps?"]
    output: Cooperative
    side_effects: ["current_utc = 2026-08-01T00:00:00Z", "total_shares = 0"]

  - method: GET
    path: "/cooperatives/{cid}"
    description: "Get cooperative by id"
    roles: [PlatformAdmin, BoardOfficer, BoardMember, ManagingAgent, Shareholder]
    code: 200
    input: []
    output: Cooperative
    side_effects: []

  - method: GET
    path: "/cooperatives"
    description: "List cooperatives"
    roles: [PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Cooperative[]
    side_effects: []

  # --- Logical clock (test-driving endpoint per §1.5 ladder) ---
  - method: POST
    path: "/cooperatives/{cid}/_clock/set_current_utc"
    description: "Advance the cooperative's logical clock. Startup default is 2026-08-01T00:00:00Z; the logical clock MUST NOT fall back to wall-clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: Cooperative
    side_effects:
      - "Cooperative.current_utc = to_iso8601"
      - "Fires daily interest accrual, PAST_DUE transitions, sublet/alteration window auto-transitions, Interview NO_SHOW, Meeting auto-adjourn, arrears escalation checks"
      - "Increments Cooperative.version"

  # --- Units ---
  - method: POST
    path: "/cooperatives/{cid}/units"
    description: "Create a unit"
    roles: [PlatformAdmin, BoardOfficer]
    code: 201
    input: [unit_label, shares_allocated]
    output: Unit
    side_effects: ["Cooperative.total_shares += shares_allocated", "Cooperative.version += 1"]

  - method: GET
    path: "/cooperatives/{cid}/units"
    description: "List units"
    roles: [PlatformAdmin, BoardOfficer, BoardMember, ManagingAgent, Shareholder]
    code: 200
    input: ["limit?", "offset?"]
    output: Unit[]
    side_effects: []

  - method: GET
    path: "/cooperatives/{cid}/units/{uid}"
    description: "Get unit by id"
    roles: [PlatformAdmin, BoardOfficer, BoardMember, ManagingAgent, Shareholder]
    code: 200
    input: []
    output: Unit
    side_effects: []

  # --- Shareholders ---
  - method: POST
    path: "/cooperatives/{cid}/shareholders"
    description: "Create a shareholder"
    roles: [PlatformAdmin, BoardOfficer, ManagingAgent]
    code: 201
    input: [full_name, email]
    output: Shareholder
    side_effects: ["standing = GOOD_STANDING", "arrears_balance_cents = 0"]

  - method: GET
    path: "/cooperatives/{cid}/shareholders"
    description: "List shareholders"
    roles: [PlatformAdmin, BoardOfficer, BoardMember, ManagingAgent]
    code: 200
    input: ["limit?", "offset?", "standing?"]
    output: Shareholder[]
    side_effects: []

  - method: GET
    path: "/cooperatives/{cid}/shareholders/{sid}"
    description: "Get shareholder"
    roles: [PlatformAdmin, BoardOfficer, BoardMember, ManagingAgent, Shareholder]
    code: 200
    input: []
    output: Shareholder
    side_effects: []

  # --- Share ledger ---
  - method: POST
    path: "/cooperatives/{cid}/share-ledger-entries"
    description: "Assign shares: link shareholder to unit"
    roles: [PlatformAdmin, BoardOfficer]
    code: 201
    input: [unit_id, shareholder_id, shares_held]
    output: ShareLedgerEntry
    side_effects: ["Validates sum of ACTIVE entries for unit == unit.shares_allocated (after insert)"]

  - method: GET
    path: "/cooperatives/{cid}/share-ledger-entries"
