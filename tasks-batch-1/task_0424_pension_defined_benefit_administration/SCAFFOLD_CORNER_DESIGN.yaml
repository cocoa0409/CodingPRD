# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe: enumerates testable claims of SCAFFOLD.yaml §1.1–§1.7 not already
# covered by §1.8. Same per-instance contract and §1.5 lint gates as §1.8.
# `excluded_because:` stubs cite a §1.8 instance by name (no test_recipe).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_plan_returns_201_with_system_fields_and_open_posture
        claim_type: Creation
        grounds:
          - entities.PensionPlan.fields.funding_posture
          - entities.PensionPlan.fields.status
        distinguishing_aspect: "POST /plans with required fields -> 201; status=ACTIVE, funding_posture=OPEN (no certified filing), version=1, server-minted id."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /plans"
              payload: { plan_name: "Acme New", ein_psn: "99-0000001-001", benefit_formula_type: "FINAL_AVERAGE_PAY", fap_accrual_rate: 0.015, cb_pay_credit_rate: 0.0, cb_interest_crediting_rate: 0.0 }
              as: PlanSponsor
              captures: { plan_id: $.data.id, st: $.data.status, posture: $.data.funding_posture, v: $.data.version }
          assert:
            - "response.status == 201"
            - "PensionPlan.${plan_id}.status == ACTIVE"
            - "PensionPlan.${plan_id}.funding_posture == OPEN"
            - "PensionPlan.${plan_id}.version == 1"

      - name: create_plan_missing_benefit_formula_type_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.PensionPlan.fields.benefit_formula_type
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting required benefit_formula_type -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /plans"
              payload: { plan_name: "Acme Bad", ein_psn: "99-0000002-001", fap_accrual_rate: 0.015 }
              as: PlanSponsor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: get_participant_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_NOT_FOUND]
          - entities.Participant
        distinguishing_aspect: "GET /plans/participants/{nonexistent} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /plans/participants/00000000-0000-4000-8000-0000000000aa"
              payload: {}
              as: BenefitsAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: spousal_consent_immutable_entity_no_version
        claim_type: Immutability
        grounds:
          - entities.SpousalConsent
        distinguishing_aspect: "SpousalConsent is common_fields:false — carries id + created_at only, no version/updated_at; it is append-only with no update endpoint."
        test_recipe:
          setup: ["A J&S election in SPOUSAL_CONSENT_PENDING; record one spousal consent."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Acme SC", ein_psn: "99-0000003-001", benefit_formula_type: "FINAL_AVERAGE_PAY", fap_accrual_rate: 0.015, cb_pay_credit_rate: 0.0, cb_interest_crediting_rate: 0.0 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /plans/participants"
              payload: { plan_id: "${plan_id}", ssn_last4: "2003", date_of_birth: "1962-01-01", hire_date: "2000-01-01" }
              as: BenefitsAdministrator
              captures: { p_id: $.data.id }
            - call: "POST /plans/compensation"
              payload: { participant_id: "${p_id}", plan_year: 2023, gross_comp_cents: 12000000 }
              as: BenefitsAdministrator
            - call: "POST /plans/participants/${p_id}/terminate"
              payload: { termination_date: "2024-01-01" }
              as: BenefitsAdministrator
            - call: "POST /plans/elections"
              payload: { participant_id: "${p_id}", payment_form: "JOINT_AND_SURVIVOR", annuity_start_date: "2024-06-01", js_survivor_pct: 0.50, spouse_date_of_birth: "1965-01-01" }
              as: BenefitsAdministrator
              captures: { e_id: $.data.id }
            - call: "POST /plans/elections/${e_id}/submit"
              payload: {}
              as: BenefitsAdministrator
              as_user_id: "ADM_A"
          trigger:
            - call: "POST /plans/elections/${e_id}/spousal-consent"
              payload: { consenting_spouse_dob: "1965-01-01", notary_reference: "NOTARY-1", waives_qjsa: true }
              as: BenefitsAdministrator
              captures: { sc_id: $.data.id }
          assert:
            - "response.status == 201"
            - "SpousalConsent.${sc_id}.waives_qjsa == true"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: approve_draft_election_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.BenefitElection.SUBMITTED_to_APPROVED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Approving an election still in DRAFT (no submit) -> ERR_INVALID_STATE (409); APPROVE is only defined from SUBMITTED or SPOUSAL_CONSENT_PENDING."
        test_recipe:
          setup: ["A DRAFT SINGLE_LIFE election for a TERMINATED FULLY_VESTED participant."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Acme IS", ein_psn: "99-0000004-001", benefit_formula_type: "FINAL_AVERAGE_PAY", fap_accrual_rate: 0.015, cb_pay_credit_rate: 0.0, cb_interest_crediting_rate: 0.0 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /plans/participants"
              payload: { plan_id: "${plan_id}", ssn_last4: "2004", date_of_birth: "1962-01-01", hire_date: "2000-01-01" }
              as: BenefitsAdministrator
              captures: { p_id: $.data.id }
            - call: "POST /plans/compensation"
              payload: { participant_id: "${p_id}", plan_year: 2023, gross_comp_cents: 12000000 }
              as: BenefitsAdministrator
            - call: "POST /plans/participants/${p_id}/terminate"
              payload: { termination_date: "2024-01-01" }
              as: BenefitsAdministrator
            - call: "POST /plans/elections"
              payload: { participant_id: "${p_id}", payment_form: "SINGLE_LIFE", annuity_start_date: "2024-06-01" }
              as: BenefitsAdministrator
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /plans/elections/${e_id}/approve"
              payload: {}
              as: BenefitsAdministrator
              as_user_id: "ADM_B"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: amend_qualified_qdro_invalid_state_terminal
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.QdroAward.SUBMITTED_to_QUALIFIED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "QUALIFIED is terminal for QdroAward; calling amend (defined only from REJECTED) on a QUALIFIED award -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A PERCENTAGE QDRO QUALIFIED (no commenced election yet, under 1.0 allocation)."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Acme QQ", ein_psn: "99-0000005-001", benefit_formula_type: "FINAL_AVERAGE_PAY", fap_accrual_rate: 0.015, cb_pay_credit_rate: 0.0, cb_interest_crediting_rate: 0.0 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /plans/participants"
              payload: { plan_id: "${plan_id}", ssn_last4: "2005", date_of_birth: "1962-01-01", hire_date: "2000-01-01" }
              as: BenefitsAdministrator
              captures: { p_id: $.data.id }
            - call: "POST /plans/qdros"
              payload: { participant_id: "${p_id}", alternate_payee_kind: "FORMER_SPOUSE", split_method: "PERCENTAGE", award_pct: 0.50 }
              as: BenefitsAdministrator
              captures: { q_id: $.data.id }
            - call: "POST /plans/qdros/${q_id}/submit"
              payload: {}
              as: BenefitsAdministrator
            - call: "POST /plans/qdros/${q_id}/qualify"
              payload: {}
              as: BenefitsAdministrator
          trigger:
            - call: "POST /plans/qdros/${q_id}/amend"
              payload: {}
              as: BenefitsAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: participant_terminate_initial_state_is_active
        claim_type: Initial State
        grounds:
          - state_machines.Participant.ACTIVE_to_TERMINATED
          - entities.Participant.fields.employment_status
        distinguishing_aspect: "A newly created participant starts employment_status=ACTIVE and vesting_status from the schedule; terminating moves ACTIVE->TERMINATED and freezes service."
        test_recipe:
          setup: ["Empty plan."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Acme Init", ein_psn: "99-0000006-001", benefit_formula_type: "FINAL_AVERAGE_PAY", fap_accrual_rate: 0.015, cb_pay_credit_rate: 0.0, cb_interest_crediting_rate: 0.0 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /plans/participants"
              payload: { plan_id: "${plan_id}", ssn_last4: "2006", date_of_birth: "1962-01-01", hire_date: "2000-01-01" }
              as: BenefitsAdministrator
              captures: { p_id: $.data.id, emp: $.data.employment_status, vest: $.data.vesting_status }
          assert:
            - "response.status == 201"
            - "Participant.${p_id}.employment_status == ACTIVE"
            - "Participant.${p_id}.vesting_status == FULLY_VESTED"

      - name: payment_suspend_then_resume_cycle
        claim_type: cyclic
        grounds:
          - state_machines.BenefitPayment.IN_PAY_to_SUSPENDED
          - state_machines.BenefitPayment.SUSPENDED_to_IN_PAY
        distinguishing_aspect: "An IN_PAY payment suspends to SUSPENDED then resumes to IN_PAY — a true suspend/resume loop on the same row; current_monthly_cents is preserved across the cycle (330000)."
        test_recipe:
          setup: ["IN_PAY payment, current 330000, on a no-COLA plan."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Acme Susp", ein_psn: "99-0000028-001", benefit_formula_type: "FINAL_AVERAGE_PAY", cola_pct: 0.0, fap_accrual_rate: 0.015, cb_pay_credit_rate: 0.0, cb_interest_crediting_rate: 0.0 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /plans/participants"
              payload: { plan_id: "${plan_id}", ssn_last4: "2028", date_of_birth: "1962-01-01", hire_date: "2000-01-01" }
              as: BenefitsAdministrator
              captures: { p_id: $.data.id }
            - call: "POST /plans/compensation"
              payload: { participant_id: "${p_id}", plan_year: 2021, gross_comp_cents: 10000000 }
              as: BenefitsAdministrator
            - call: "POST /plans/compensation"
              payload: { participant_id: "${p_id}", plan_year: 2022, gross_comp_cents: 11000000 }
              as: BenefitsAdministrator
            - call: "POST /plans/compensation"
              payload: { participant_id: "${p_id}", plan_year: 2023, gross_comp_cents: 12000000 }
              as: BenefitsAdministrator
            - call: "POST /plans/participants/${p_id}/terminate"
              payload: { termination_date: "2024-01-01" }
              as: BenefitsAdministrator
            - call: "POST /plans/elections"
              payload: { participant_id: "${p_id}", payment_form: "SINGLE_LIFE", annuity_start_date: "2024-06-01" }
              as: BenefitsAdministrator
              captures: { e_id: $.data.id }
            - call: "POST /plans/elections/${e_id}/submit"
              payload: {}
              as: BenefitsAdministrator
              as_user_id: "ADM_A"
            - call: "POST /plans/elections/${e_id}/approve"
              payload: {}
              as: BenefitsAdministrator
              as_user_id: "ADM_B"
            - call: "POST /plans/elections/${e_id}/commence"
              payload: {}
              as: BenefitsAdministrator
              as_user_id: "ADM_B"
            - call: "GET /plans/payments?participant_id=${p_id}"
              payload: {}
              as: BenefitsAdministrator
              captures: { pay_id: "$.data[0].id" }
            - call: "POST /plans/payments/${pay_id}/activate"
              payload: {}
              as: BenefitsAdministrator
            - call: "POST /plans/payments/${pay_id}/suspend"
              payload: {}
              as: BenefitsAdministrator
              captures: { sst: $.data.status }
          trigger:
            - call: "POST /plans/payments/${pay_id}/resume"
              payload: {}
              as: BenefitsAdministrator
              captures: { rst: $.data.status, cm: $.data.current_monthly_cents }
          assert:
            - "after suspend: BenefitPayment.${pay_id}.status == SUSPENDED"
            - "after resume: BenefitPayment.${pay_id}.status == IN_PAY"
            - "BenefitPayment.${pay_id}.current_monthly_cents == 330000"

      - name: election_reject_from_submitted
        claim_type: Valid Transition
        grounds:
          - state_machines.BenefitElection.SUBMITTED_to_REJECTED
        distinguishing_aspect: "A SUBMITTED SINGLE_LIFE election can be rejected to the terminal REJECTED state."
        test_recipe:
          setup: ["A SINGLE_LIFE election SUBMITTED by ADM_A."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Acme Rej", ein_psn: "99-0000029-001", benefit_formula_type: "FINAL_AVERAGE_PAY", fap_accrual_rate: 0.015, cb_pay_credit_rate: 0.0, cb_interest_crediting_rate: 0.0 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /plans/participants"
              payload: { plan_id: "${plan_id}", ssn_last4: "2029", date_of_birth: "1962-01-01", hire_date: "2000-01-01" }
              as: BenefitsAdministrator
              captures: { p_id: $.data.id }
            - call: "POST /plans/compensation"
              payload: { participant_id: "${p_id}", plan_year: 2023, gross_comp_cents: 12000000 }
              as: BenefitsAdministrator
            - call: "POST /plans/participants/${p_id}/terminate"
              payload: { termination_date: "2024-01-01" }
              as: BenefitsAdministrator
            - call: "POST /plans/elections"
              payload: { participant_id: "${p_id}", payment_form: "SINGLE_LIFE", annuity_start_date: "2024-06-01" }
              as: BenefitsAdministrator
              captures: { e_id: $.data.id }
            - call: "POST /plans/elections/${e_id}/submit"
              payload: {}
              as: BenefitsAdministrator
              as_user_id: "ADM_A"
          trigger:
            - call: "POST /plans/elections/${e_id}/reject"
              payload: {}
              as: BenefitsAdministrator
              as_user_id: "ADM_B"
              captures: { st: $.data.status }
          assert:
            - "BenefitElection.${e_id}.status == REJECTED"

      - name: plan_terminate_blocked_when_restricted
        claim_type: guarded transitions
        grounds:
          - state_machines.PensionPlan.ACTIVE_to_TERMINATING
          - validations[priority=10]
          - errors[ERR_FUNDING_RESTRICTED]
        distinguishing_aspect: "A plan whose funding_posture is RESTRICTED (aftap 0.65) cannot be voluntarily terminated -> ERR_FUNDING_RESTRICTED (409)."
        test_recipe:
          setup: ["Plan with a CERTIFIED 2024 filing at aftap 0.65 -> RESTRICTED."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Acme TermBlk", ein_psn: "99-0000030-001", benefit_formula_type: "FINAL_AVERAGE_PAY", fap_accrual_rate: 0.015, cb_pay_credit_rate: 0.0, cb_interest_crediting_rate: 0.0 }
              as: PlanSponsor
              captures: { plan_id: $.data.id, plan_v0: $.data.version }
            - call: "POST /plans/filings"
              payload: { plan_id: "${plan_id}", plan_year: 2024, plan_assets_cents: 6500000000, funding_target_cents: 10000000000 }
              as: PlanActuary
              captures: { f_id: $.data.id }
            - call: "POST /plans/filings/${f_id}/certify"
              payload: { expected_plan_version: "${plan_v0}" }
              as: PlanActuary
          trigger:
            - call: "POST /plans/${plan_id}/terminate"
              payload: {}
              as: PlanSponsor
              captures: { err: $.data.error_id }
          assert:
            - "PensionPlan.${plan_id}.funding_posture == RESTRICTED"
            - "response.status == 409"
            - "response.data.error_id == ERR_FUNDING_RESTRICTED"

      - name: election_revision_cycle
        claim_type: cyclic
        grounds: [state_machines.BenefitElection.APPROVED_to_DRAFT]
        excluded_because:
          difficulty_instance: non_linear_state_machine / election_revision_cycle_approved_back_to_draft
          rationale: "The APPROVED->DRAFT->SUBMITTED revision loop is exercised by the named §1.8 instance."

      - name: record_death_cascade
        claim_type: Cross-entity
        grounds: [state_machines.BenefitPayment.IN_PAY_to_TERMINATED]
        excluded_because:
          difficulty_instance: transitive_cascade / record_death_cascades_inpay_payment_terminated_depth2
          rationale: "DECEASED -> IN_PAY payment TERMINATED cascade asserted by the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: vesting_unvested_below_cliff
        claim_type: threshold
        grounds:
          - calculations.vesting
          - calculations.service_credit
          - entities.Participant.fields.vesting_status
        distinguishing_aspect: "Below the 3-year cliff (service 0.5y) vesting_status=UNVESTED, vested_pct=0.0; threshold boundary on the low side, distinct from the FULLY_VESTED boundary."
        test_recipe:
          setup: ["Participant hired 2022-01-01, terminated 2023-01-01 (~0.5y service)."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Acme Unvest", ein_psn: "99-0000007-001", benefit_formula_type: "FINAL_AVERAGE_PAY", fap_accrual_rate: 0.015, cb_pay_credit_rate: 0.0, cb_interest_crediting_rate: 0.0 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /plans/participants"
              payload: { plan_id: "${plan_id}", ssn_last4: "2007", date_of_birth: "1990-01-01", hire_date: "2022-01-01" }
              as: BenefitsAdministrator
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /plans/participants/${p_id}/terminate"
              payload: { termination_date: "2023-01-01" }
              as: BenefitsAdministrator
              captures: { vest: $.data.vesting_status, vp: $.data.vested_pct }
          assert:
            - "Participant.${p_id}.vesting_status == UNVESTED"
            - "Participant.${p_id}.vested_pct == 0.0"

      - name: service_credit_adjustment_promotes_to_fully_vested
        claim_type: constraint_propagation
        grounds:
          - calculations.service_credit
          - calculations.vesting
          - entities.ServiceCreditAdjustment.fields.delta_service_years
        distinguishing_aspect: "A +1.0 MILITARY_BUYBACK adjustment on a 6.0y participant raises credited_service to 7.0, propagating through vesting to FULLY_VESTED (vested_pct 1.0)."
        test_recipe:
          setup: ["Participant hired 2010-01-01, terminated 2016-07-01 (elapsed 6.0y -> PARTIALLY_VESTED 0.8)."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Acme Buyback", ein_psn: "99-0000008-001", benefit_formula_type: "FINAL_AVERAGE_PAY", fap_accrual_rate: 0.015, cb_pay_credit_rate: 0.0, cb_interest_crediting_rate: 0.0 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /plans/participants"
              payload: { plan_id: "${plan_id}", ssn_last4: "2008", date_of_birth: "1965-01-01", hire_date: "2010-01-01" }
              as: BenefitsAdministrator
              captures: { p_id: $.data.id }
            - call: "POST /plans/participants/${p_id}/terminate"
              payload: { termination_date: "2016-07-01" }
              as: BenefitsAdministrator
              captures: { vest_before: $.data.vesting_status }
          trigger:
            - call: "POST /plans/service-adjustments"
              payload: { participant_id: "${p_id}", adjustment_kind: "MILITARY_BUYBACK", delta_service_years: 1.0 }
              as: BenefitsAdministrator
            - call: "GET /plans/participants/${p_id}"
              payload: {}
              as: BenefitsAdministrator
              captures: { csy: $.data.credited_service_years, vest_after: $.data.vesting_status, vp: $.data.vested_pct }
          assert:
            - "Participant.${p_id}.credited_service_years == 7.0"
            - "Participant.${p_id}.vesting_status == FULLY_VESTED"
            - "Participant.${p_id}.vested_pct == 1.0"

      - name: js_reduction_factor_applied_joint_and_survivor
        claim_type: weighted_scoring
        grounds:
          - calculations.js_reduction
          - entities.BenefitElection.fields.js_reduced_monthly_cents
        distinguishing_aspect: "A 50% J&S election, participant age 62 vs spouse age 59 (age_diff 3): factor = 1.00 - 0.50*0.12 - 3*0.005 = 0.925; gross 330000 -> js_reduced 305250."
        test_recipe:
          setup: ["FAP plan, gross 330000; J&S 0.50, participant DOB 1962-01-01, spouse DOB 1965-01-01, ASD 2024-06-01."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Acme JS", ein_psn: "99-0000009-001", benefit_formula_type: "FINAL_AVERAGE_PAY", fap_accrual_rate: 0.015, cb_pay_credit_rate: 0.0, cb_interest_crediting_rate: 0.0 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /plans/participants"
              payload: { plan_id: "${plan_id}", ssn_last4: "2009", date_of_birth: "1962-01-01", hire_date: "2000-01-01" }
              as: BenefitsAdministrator
              captures: { p_id: $.data.id }
            - call: "POST /plans/compensation"
              payload: { participant_id: "${p_id}", plan_year: 2021, gross_comp_cents: 10000000 }
              as: BenefitsAdministrator
            - call: "POST /plans/compensation"
              payload: { participant_id: "${p_id}", plan_year: 2022, gross_comp_cents: 11000000 }
              as: BenefitsAdministrator
            - call: "POST /plans/compensation"
              payload: { participant_id: "${p_id}", plan_year: 2023, gross_comp_cents: 12000000 }
              as: BenefitsAdministrator
            - call: "POST /plans/participants/${p_id}/terminate"
              payload: { termination_date: "2024-01-01" }
              as: BenefitsAdministrator
            - call: "POST /plans/elections"
              payload: { participant_id: "${p_id}", payment_form: "JOINT_AND_SURVIVOR", annuity_start_date: "2024-06-01", js_survivor_pct: 0.50, spouse_date_of_birth: "1965-01-01" }
              as: BenefitsAdministrator
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /plans/elections/${e_id}/submit"
              payload: {}
              as: BenefitsAdministrator
              as_user_id: "ADM_A"
              captures: { jsr: $.data.js_reduced_monthly_cents }
          assert:
