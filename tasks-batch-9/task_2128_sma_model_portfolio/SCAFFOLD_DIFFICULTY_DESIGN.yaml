            - "TradeOrder.${o_alfa}.status == BLOCKED and block_id == ${b1}"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: block_allocate_then_unwind_conserves_every_share
        grounds:
          - calculations.block_pro_rata_allocation
          - state_machines.Block.FILLED_to_ALLOCATED
          - state_machines.Block.ALLOCATED_to_FILLED
          - state_machines.TradeOrder.ALLOCATED_to_BLOCKED
          - state_machines.TaxLot.OPEN_to_REVERSED
          - entities.Block.fields.unallocated_shares
        distinguishing_aspect: |
          The conserved quantity is SHARES. The identity
          Block.filled_shares == Block.allocated_shares + Block.unallocated_shares
          holds at 1000 == 0 + 1000 before allocation, at 1000 == 1000 + 0 after
          allocation, and at 1000 == 0 + 1000 again after the unwind, and the two
          accounts' settled CETA share counts and cash balances return to their
          exact pre-allocation values with zero drift.
        test_recipe:
          setup:
            - "Accounts ACC-001 and ACC-002 both sit under sponsor NRTH on Model CORE with ModelVersion v1 sleeves ALFA 5000 / BETA 3000 / CETA 2000"
            - "ACC-001 holds 1250 ALFA, 1500 BETA, 1000 CETA and 2,500,000c cash; its rebalance produced a PROPOSED BUY 980 CETA order"
            - "ACC-002 holds 250 ALFA, 300 BETA, no CETA and 5,000,000c cash; its rebalance produced a PROPOSED BUY 712 CETA order"
            - "Both CETA orders were blocked together (requested_shares 1692) and the block was executed for 1000 shares at 2600c"
          setup_api_calls:
            - call: "POST /sma/securities"
              payload: { ticker: "ALFA", name: "Alfa Industrials", asset_class: "US_EQUITY", last_price_cents: 10000 }
              as: PlatformAdmin
              captures: { sec_alfa: "$.data.id" }
            - call: "POST /sma/securities"
              payload: { ticker: "BETA", name: "Beta Materials", asset_class: "US_EQUITY", last_price_cents: 5000 }
              as: PlatformAdmin
              captures: { sec_beta: "$.data.id" }
            - call: "POST /sma/securities"
              payload: { ticker: "CETA", name: "Ceta Utilities", asset_class: "US_EQUITY", last_price_cents: 2500 }
              as: PlatformAdmin
              captures: { sec_ceta: "$.data.id" }
            - call: "POST /sma/sponsors"
              payload: { name: "Northline Wealth", platform_code: "NRTH", revenue_share_bps: 3333 }
              as: PlatformAdmin
              captures: { sp1: "$.data.id" }
            - call: "POST /sma/models"
              payload: { manager_name: "Cobalt Asset Mgmt", name: "Core Equity", strategy_code: "CORE", asset_class: "US_EQUITY", base_fee_bps: 90, drift_threshold_bps: 1000 }
              as: PortfolioManager
              captures: { m1: "$.data.id" }
            - call: "POST /sma/model-versions"
              payload: { model_id: "${m1}" }
              as: PortfolioManager
              captures: { mv1: "$.data.id" }
            - call: "POST /sma/model-versions/${mv1}/sleeves"
              payload: { sleeves: [ { security_id: "${sec_alfa}", target_weight_bps: 5000 }, { security_id: "${sec_beta}", target_weight_bps: 3000 }, { security_id: "${sec_ceta}", target_weight_bps: 2000 } ] }
              as: PortfolioManager
            - call: "POST /sma/model-versions/${mv1}/submit"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-1"
            - call: "POST /sma/model-versions/${mv1}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /sma/model-versions/${mv1}/publish"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-1"
            - call: "POST /sma/accounts"
              payload: { sponsor_id: "${sp1}", model_id: "${m1}", account_number: "ACC-001", cash_reserve_bps: 100 }
              as: SponsorOperator
              as_user_id: "${sp1}"
              captures: { a1: "$.data.id" }
            - call: "POST /sma/accounts/${a1}/deposits"
              payload: { amount_cents: 2500000 }
              as: SponsorOperator
              as_user_id: "${sp1}"
            - call: "POST /sma/accounts/${a1}/transfers-in"
              payload: { security_id: "${sec_alfa}", shares: 1250, cost_basis_cents: 12500000, origin: "TRANSFER_IN" }
              as: SponsorOperator
              as_user_id: "${sp1}"
            - call: "POST /sma/accounts/${a1}/transfers-in"
              payload: { security_id: "${sec_beta}", shares: 1500, cost_basis_cents: 7500000, origin: "TRANSFER_IN" }
              as: SponsorOperator
              as_user_id: "${sp1}"
            - call: "POST /sma/accounts/${a1}/transfers-in"
              payload: { security_id: "${sec_ceta}", shares: 1000, cost_basis_cents: 2500000, origin: "TRANSFER_IN" }
              as: SponsorOperator
              as_user_id: "${sp1}"
            - call: "POST /sma/accounts/${a1}/drift-evaluations"
              payload: { basis: "SETTLED" }
              as: SponsorOperator
              as_user_id: "${sp1}"
            - call: "POST /sma/accounts/${a1}/rebalances"
              payload: {}
              as: SponsorOperator
              as_user_id: "${sp1}"
            - call: "POST /sma/accounts"
              payload: { sponsor_id: "${sp1}", model_id: "${m1}", account_number: "ACC-002", cash_reserve_bps: 100 }
              as: SponsorOperator
              as_user_id: "${sp1}"
              captures: { a2: "$.data.id" }
            - call: "POST /sma/accounts/${a2}/deposits"
              payload: { amount_cents: 5000000 }
              as: SponsorOperator
              as_user_id: "${sp1}"
            - call: "POST /sma/accounts/${a2}/transfers-in"
              payload: { security_id: "${sec_alfa}", shares: 250, cost_basis_cents: 2500000, origin: "TRANSFER_IN" }
              as: SponsorOperator
              as_user_id: "${sp1}"
            - call: "POST /sma/accounts/${a2}/transfers-in"
              payload: { security_id: "${sec_beta}", shares: 300, cost_basis_cents: 1500000, origin: "TRANSFER_IN" }
              as: SponsorOperator
              as_user_id: "${sp1}"
            - call: "POST /sma/accounts/${a2}/drift-evaluations"
              payload: { basis: "SETTLED" }
              as: SponsorOperator
              as_user_id: "${sp1}"
            - call: "POST /sma/accounts/${a2}/rebalances"
              payload: {}
              as: SponsorOperator
              as_user_id: "${sp1}"
            - call: "GET /sma/trade-orders"
              payload: { account_id: "${a1}", security_id: "${sec_ceta}", status: "PROPOSED" }
              as: SponsorOperator
              captures: { o1_ceta: "$.data[0].id" }
            - call: "GET /sma/trade-orders"
              payload: { account_id: "${a2}", security_id: "${sec_ceta}", status: "PROPOSED" }
              as: SponsorOperator
              captures: { o2_ceta: "$.data[0].id" }
            - call: "POST /sma/blocks"
              payload: { trade_order_ids: [ "${o1_ceta}", "${o2_ceta}" ] }
              as: SponsorOperator
              as_user_id: "${sp1}"
              captures: { b1: "$.data.id" }
            - call: "POST /sma/blocks/${b1}/execute"
              payload: { filled_shares: 1000, avg_fill_price_cents: 2600 }
              as: PlatformAdmin
          trigger:
            - call: "POST /sma/blocks/${b1}/allocate"
              payload: {}
              as: PlatformAdmin
              captures: { alloc_total: "$.data.allocated_shares" }
            - call: "POST /sma/blocks/${b1}/unwind"
              payload: {}
              as: PlatformAdmin
              captures: { unwound_alloc: "$.data.allocated_shares", unwound_unalloc: "$.data.unallocated_shares" }
          assert:
            - "Before allocation: Block.${b1}.filled_shares == 1000, allocated_shares == 0, unallocated_shares == 1000, requested_shares == 1692"
            - "After allocation: Block.${b1}.status == ALLOCATED, allocated_shares == 1000, unallocated_shares == 0"
            - "After allocation: TradeOrder.${o1_ceta}.allocated_shares == 580 and TradeOrder.${o2_ceta}.allocated_shares == 420 (floor then largest-request-first remainder)"
            - "After allocation: Account.${a1}.cash_cents == 992000 and Account.${a2}.cash_cents == 3908000"
            - "After allocation: GET /sma/tax-lots?account_id=${a1}&security_id=${sec_ceta}&status=OPEN returns 2 rows totalling 1580 shares_open"
            - "After unwind: Block.${b1}.status == FILLED, filled_shares == 1000, allocated_shares == 0, unallocated_shares == 1000"
            - "After unwind: TradeOrder.${o1_ceta}.status == BLOCKED with allocated_shares == 0 and fill_price_cents == null; same for ${o2_ceta}"
            - "After unwind: Account.${a1}.cash_cents == 2500000 and Account.${a2}.cash_cents == 5000000, exactly the pre-allocation values"
            - "After unwind: the TaxLot opened for ${o1_ceta} has status REVERSED with shares_open == 0, and GET /sma/tax-lots?account_id=${a1}&security_id=${sec_ceta}&status=OPEN returns 1 row with shares_open == 1000"
            - "The identity Block.filled_shares == allocated_shares + unallocated_shares evaluates to 1000 at all three observation points"

      - name: invoice_issue_then_void_conserves_billed_cents
        grounds:
          - calculations.fee_invoice_tiered_split
          - state_machines.FeeInvoice.DRAFT_to_ISSUED
          - state_machines.FeeInvoice.ISSUED_to_VOIDED
          - state_machines.Account.billing_status.INVOICED_to_CURRENT
          - entities.Account.fields.fees_billed_ytd_cents
        distinguishing_aspect: |
          A different conserved quantity — CENTS, not shares. Two identities hold
          together: gross_fee_cents == sponsor_share + manager_share +
          platform_share (289725 == 96565 + 178674 + 14486) at every moment, and
          Account.fees_billed_ytd_cents returns from 289725 to exactly 0 once the
          issue is compensated by the void.
        test_recipe:
          setup:
            - "Account ACC-001 under sponsor NRTH (revenue_share_bps 3333) on Model CORE (base_fee_bps 90), billing_status CURRENT and fees_billed_ytd_cents 0"
            - "One DRAFT invoice for 2026-01-01..2026-04-01 on an average daily value of 150,000,000c"
          setup_api_calls:
            - call: "POST /sma/securities"
              payload: { ticker: "ALFA", name: "Alfa Industrials", asset_class: "US_EQUITY", last_price_cents: 10000 }
              as: PlatformAdmin
              captures: { sec_alfa: "$.data.id" }
            - call: "POST /sma/sponsors"
              payload: { name: "Northline Wealth", platform_code: "NRTH", revenue_share_bps: 3333 }
              as: PlatformAdmin
              captures: { sp1: "$.data.id" }
            - call: "POST /sma/models"
              payload: { manager_name: "Cobalt Asset Mgmt", name: "Core Equity", strategy_code: "CORE", asset_class: "US_EQUITY", base_fee_bps: 90 }
              as: PortfolioManager
              captures: { m1: "$.data.id" }
            - call: "POST /sma/model-versions"
              payload: { model_id: "${m1}" }
              as: PortfolioManager
              captures: { mv1: "$.data.id" }
            - call: "POST /sma/model-versions/${mv1}/sleeves"
              payload: { sleeves: [ { security_id: "${sec_alfa}", target_weight_bps: 10000 } ] }
              as: PortfolioManager
            - call: "POST /sma/model-versions/${mv1}/submit"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-1"
            - call: "POST /sma/model-versions/${mv1}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /sma/model-versions/${mv1}/publish"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-1"
            - call: "POST /sma/accounts"
              payload: { sponsor_id: "${sp1}", model_id: "${m1}", account_number: "ACC-001" }
              as: SponsorOperator
              as_user_id: "${sp1}"
              captures: { a1: "$.data.id" }
            - call: "POST /sma/fee-invoices"
              payload: { account_id: "${a1}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", average_daily_value_cents: 150000000 }
              as: BillingOfficer
              captures: { inv1: "$.data.id" }
          trigger:
            - call: "POST /sma/fee-invoices/${inv1}/issue"
              payload: {}
              as: BillingOfficer
              captures: { issued_gross: "$.data.gross_fee_cents" }
            - call: "POST /sma/fee-invoices/${inv1}/void"
              payload: { void_reason: "Average daily value restated by the sponsor" }
              as: BillingOfficer
          assert:
            - "After issue: Account.${a1}.fees_billed_ytd_cents == 289725 and billing_status == INVOICED"
            - "After issue: FeeInvoice.${inv1}.sponsor_share_cents + manager_share_cents + platform_share_cents == 289725, i.e. 96565 + 178674 + 14486"
            - "After void: FeeInvoice.${inv1}.status == VOIDED and void_reason == 'Average daily value restated by the sponsor'"
            - "After void: Account.${a1}.fees_billed_ytd_cents == 0, exactly the pre-issue value"
            - "After void: Account.${a1}.billing_status == CURRENT"
            - "After void: FeeInvoice.${inv1}.gross_fee_cents is still 289725 and the three share fields are unchanged — the compensation reverses the ledger, not the computation"
            - "Account.${a1}.cash_cents == 0 throughout — neither issue nor void moves cash"
