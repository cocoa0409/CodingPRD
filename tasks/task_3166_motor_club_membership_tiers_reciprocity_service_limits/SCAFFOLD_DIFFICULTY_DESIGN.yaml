              as: Agent
              as_user_id: "agent-1"
              captures: { sale1: $.data.id, sale1_commission: $.data.commission_cents }
            - call: "POST /motor-club/ancillary-sales/${sale1}/refund"
              payload: {}
              as: Agent
              as_user_id: "agent-1"
              captures: { sale1_status: $.data.status }
            - call: "GET /motor-club/memberships/${m1}"
              payload: {}
              as: MemberServicesRep
              captures: { m1_credit_final: $.data.account_credit_cents, m1v_final: $.data.version }
          assert:
            - "AncillarySale.${sale1}.commission_cents == 1200 (round_half_up(12000 x 1000 / 10000))"
            - "after refund: Membership.${m1}.account_credit_cents == ${m1_credit0} (sale debit fully compensated)"
            - "Membership.${m1}.version == ${m1v0} + 2 (one bump per compensated event, no drift)"
            - "AncillarySale.${sale1}.status == REFUNDED"
      - name: dispatch_fail_retry_capacity_invariant
        grounds:
          - state_machines.Dispatch.ASSIGNED_to_FAILED
          - state_machines.ServiceCall.DISPATCHED_to_REQUESTED
          - calculations.dispatch_provider_selection
          - calculations.benefit_cap_check
        distinguishing_aspect: |
          Conserved quantities = provider non-terminal dispatch count and membership
          call-cap consumption: a dispatch that FAILS and is retried leaves the failed
          provider's held-slot count back at 0 and the membership's
          calls_used_current_term unchanged (fail+retry consumes nothing); a different
          conserved quantity than the monetary credit invariant.
        test_recipe:
          setup:
            - "Single provider P1 (cap 2) plus P2; call dispatched to P1, failed, redispatched to P2 and completed"
          setup_api_calls:
            - call: "POST /motor-club/clubs"
              payload: { club_code: "NCA", name: "NorCal Auto", territory_state_codes: ["CA"], default_arrival_target_minutes: 45 }
              as: ClubAdmin
              captures: { club_nca: $.data.id }
            - call: "POST /motor-club/tiers"
              payload: { code: "CLASSIC", annual_dues_cents: 5000, included_tow_miles: 5, annual_call_cap: 4, lockout_benefit_cents: 5500, battery_service_included: false, household_member_price_cents: 2500, overage_rate_cents_per_mile: 650, upgrade_waiting_days: 3, rank: 1 }
              as: ClubAdmin
            - call: "POST /motor-club/memberships"
              payload: { home_club_id: "${club_nca}", primary_member_name: "Pat Primary", primary_member_email: "pat@x.com", tier_code: "CLASSIC" }
              as: MemberServicesRep
              captures: { m1: $.data.id }
            - call: "POST /motor-club/memberships/${m1}/household-members"
              payload: { full_name: "Pat Primary", relationship: "SPOUSE", date_of_birth: "1980-01-01T00:00:00Z", is_primary: true }
              as: MemberServicesRep
              captures: { hm1: $.data.id }
            - call: "POST /motor-club/providers"
              payload: { servicing_club_id: "${club_nca}", name: "NCA Fleet 1", provider_kind: "OWNED", capabilities: ["TOW"], home_base_state_code: "CA", sla_multiplier: 1.0, shift_start_minute: 0, shift_end_minute: 0, max_concurrent_dispatches: 2 }
              as: ClubAdmin
              captures: { p1: $.data.id }
            - call: "POST /motor-club/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:01:00Z" }
              as: ClubAdmin
            - call: "POST /motor-club/providers"
              payload: { servicing_club_id: "${club_nca}", name: "NCA Fleet 2", provider_kind: "OWNED", capabilities: ["TOW"], home_base_state_code: "CA", sla_multiplier: 1.0, shift_start_minute: 0, shift_end_minute: 0, max_concurrent_dispatches: 2 }
              as: ClubAdmin
              captures: { p2: $.data.id }
            - call: "POST /motor-club/service-calls"
              payload: { membership_id: "${m1}", requesting_member_id: "${hm1}", service_type: "TOW", breakdown_location_state: "CA", requested_tow_miles: 5 }
              as: Dispatcher
              captures: { c1: $.data.id, c1v: $.data.version }
            - call: "POST /motor-club/service-calls/${c1}/dispatch"
              payload: { expected_service_call_version: "${c1v}" }
              as: Dispatcher
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /motor-club/dispatches/${d1}/fail"
              payload: { failure_reason: "PROVIDER_DECLINED" }
              as: ProviderOps
            - call: "GET /motor-club/dispatches"
              payload: {}
              as: Dispatcher
              captures: { d1_status: "$.data[0].status" }
            - call: "GET /motor-club/service-calls/${c1}"
              payload: {}
              as: Dispatcher
              captures: { c1v_after_fail: $.data.version }
            - call: "POST /motor-club/service-calls/${c1}/dispatch"
              payload: { expected_service_call_version: "${c1v_after_fail}" }
              as: Dispatcher
              captures: { d2: $.data.id }
            - call: "POST /motor-club/dispatches/${d2}/accept"
              payload: { en_route: true }
              as: ProviderOps
            - call: "POST /motor-club/dispatches/${d2}/arrive"
              payload: {}
              as: ProviderOps
            - call: "POST /motor-club/dispatches/${d2}/complete"
              payload: { actual_tow_miles: 5 }
              as: ProviderOps
            - call: "GET /motor-club/memberships/${m1}"
              payload: {}
              as: MemberServicesRep
              captures: { m1_calls: $.data.calls_used_current_term }
          assert:
            - "after fail: P1 holds 0 non-terminal dispatches (failed dispatch releases the slot — GET /motor-club/dispatches?provider_id shows ${d1} FAILED)"
            - "Dispatch.${d2}.provider_id == ${p2} and sequence_number == 2"
            - "after completion of the retry: Membership.${m1}.calls_used_current_term == 1 (the failed attempt consumed nothing; exactly one consumption for one completed call)"
            - "Membership.${m1}.account_credit_cents reflects exactly one call's charges, not two"
