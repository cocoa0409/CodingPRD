scenario: 'Live Sports Simulcast Rights & Ad-Supported Tier Frequency Management (Peacock):

  sports rights acquisition with simulcast and exclusive streaming windows negotiated

  per property, blackout and territory enforcement mirroring broadcast obligations,

  concurrency planning for streaming spikes at event start with capacity

  provisioning, ad-supported tier inventory management with frequency capping,

  ad pod construction and local ad insertion, exclusive event strategy where a

  marquee event is streaming-only with subscriber acquisition and churn modeling,

  promotional bundling through distribution partners with entitlement provisioning,

  rights fee amortization against subscriber and advertising revenue attribution,

  on-demand availability windows after live events.

  '
domain_name: live-sports-simulcast-rights
api_prefix: /platform
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
  - optimistic_concurrency
  - cascading_side_effects
  - dual_variant_calculation
  - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
  - one_to_many
  - many_to_many
  - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate
response_envelope:
  success: "{ \"meta\": { \"api_request_id\": \"req_xxx\", \"api_request_timestamp\": \"ISO8601\" },\n  \"response_type\": \"object\" | \"array\"\
    , \"data\": {} }\n"
  error: "{ \"meta\": { ... }, \"response_type\": \"error\",\n  \"data\": { \"error_id\": \"ERR_XXX\", \"message\": \"...\" } }\n"
  pagination_fields:
  - limit
  - offset
  - total_count
  - has_more
  pagination_defaults:
    limit: 10
    min: 1
    max: 100
    offset: 0
entities:
- name: RightsProperty
  parent: null
  common_fields: true
  fields:
  - name: property_code
    type: string
    source: input
    description: Unique property code (league/sport slug), unique across properties
  - name: display_name
    type: string
    source: input
    description: Human-readable property name
  - name: sport
    type: enum
    source: input
    description: Sport category
    constraints: NFL | NBA | MLB | SOCCER | GOLF | RACING | TENNIS
  - name: status
    type: enum
    source: system
    description: NEGOTIATION | ACTIVE | SUSPENDED | EXPIRED | TERMINATED
  - name: rights_fee_cents
    type: integer
    source: input
    description: Total rights fee in cents for the full contract term
    constraints: '>= 0'
  - name: term_start
    type: datetime
    source: input
    description: Contract term start (ISO8601 UTC)
  - name: term_end
    type: datetime
    source: input
    description: Contract term end (ISO8601 UTC); must be strictly after term_start
  - name: amortization_method
    type: enum
    source: input
    description: STRAIGHT_LINE | EVENT_WEIGHTED
  - name: simulcast_windows_count
    type: integer
    source: input
    description: Total simulcast windows permitted under the contract
    constraints: '>= 0'
  - name: exclusive_windows_count
    type: integer
    source: input
    description: Total exclusive streaming windows permitted under the contract
    constraints: '>= 0'
  - name: simulcast_windows_consumed
    type: integer
    source: computed
    description: Windows whose rights_mode is SIMULCAST and status is not CANCELLED
  - name: exclusive_windows_consumed
    type: integer
    source: computed
    description: Windows whose rights_mode is EXCLUSIVE and status is not CANCELLED
  - name: minimum_exclusive_ratio_pct
    type: integer
    source: input
    description: 'Contract clause: pct of scheduled non-cancelled windows that must be EXCLUSIVE (0-100)'
  - name: required_local_breaks_per_event
    type: integer
    source: input
    description: 'Contract clause: minimum local ad break inventory per event'
    constraints: '>= 0'
  - name: amortized_fee_cents
    type: integer
    source: computed
    description: Cumulative amortized rights fee via amortization_expense calculation
- name: StreamingWindow
  parent: null
  common_fields: true
  fields:
  - name: property_id
    type: string
    source: input
    description: FK -> RightsProperty.id; owning rights property
  - name: event_code
    type: string
    source: input
    description: Unique event code within property
  - name: rights_mode
    type: enum
    source: input
    description: SIMULCAST | EXCLUSIVE; EXCLUSIVE = streaming-only marquee
  - name: status
    type: enum
    source: system
    description: SCHEDULED | LIVE | COMPLETE | REPLACED | CANCELLED
  - name: scheduled_start
    type: datetime
    source: input
    description: Planned event start (ISO8601 UTC)
  - name: scheduled_end
    type: datetime
    source: input
    description: Planned event end (ISO8601 UTC); strictly after scheduled_start
  - name: live_start
    type: datetime
    source: system
    description: Actual go-live timestamp; null until LIVE
  - name: territory_scope
    type: array
    source: input
    description: Array of DMA region codes where streaming is permitted; non-empty
  - name: regional_block
    type: boolean
    source: input
    description: If true, mirroring broadcast regionalization, view grants split by region
  - name: is_marquee
    type: boolean
    source: input
    description: Marquee flag; exclusive events used for subscriber acquisition strategy
    default: false
  - name: capacity_required_units
    type: integer
    source: input
    description: Peak concurrency capacity units this event must reserve
    constraints: '>= 1'
  - name: replay_hours
    type: integer
    source: input
    description: On-demand availability window length in hours after live end
    constraints: '>= 0'
  - name: replaced_by_id
    type: string
    source: system
    description: FK -> StreamingWindow.id; set when replaced by a reschedule window
  - name: supersedes_id
    type: string
    source: input
    description: FK -> StreamingWindow.id; when set on create, the new window replaces that window
- name: TerritoryRule
  parent: null
  common_fields: true
  fields:
  - name: window_id
    type: string
    source: input
    description: FK -> StreamingWindow.id; window the rule governs
  - name: region_code
    type: string
    source: input
    description: DMA region code the rule applies to
  - name: rule_kind
    type: enum
    source: input
    description: BLACKOUT | OVERFLOW
  - name: rule_status
    type: enum
    source: system
    description: ACTIVE | LIFTED
  - name: effective_start
    type: datetime
    source: input
    description: Rule effective start; must be >= window scheduled_start - 24h
  - name: effective_end
    type: datetime
    source: input
    description: Rule effective end; strictly after effective_start
  - name: broadcast_obligation_ref
    type: string
    source: input
    description: External broadcast obligation reference mirrored by this rule
- name: Viewer
  parent: null
  common_fields: true
  fields:
  - name: email
    type: string
    source: input
    description: Unique viewer email
  - name: home_region
    type: string
    source: input
    description: Viewer DMA home region code
  - name: subscription_tier
    type: enum
    source: input
    description: FREE | AD_SUPPORTED | PREMIUM; chosen at registration or set by bundle redemption
    default: AD_SUPPORTED
  - name: subscription_status
    type: enum
    source: system
    description: ACTIVE | GRACE | SUSPENDED | CANCELLED
  - name: acquisition_source
    type: enum
    source: system
    description: ORGANIC | PARTNER_BUNDLE; set at first ACTIVE activation
  - name: acquisition_window_id
    type: string
    source: system
    description: FK -> StreamingWindow.id; marquee window that acquired the subscriber, if any
  - name: marquee_credit_cents
    type: integer
    source: computed
    description: Cumulative subscriber revenue attributed to marquee acquisition
- name: ViewGrant
  parent: null
  common_fields: false
  fields:
  - name: viewer_id
    type: string
    source: system
    description: FK -> Viewer.id; grant holder
  - name: window_id
    type: string
    source: system
    description: FK -> StreamingWindow.id; granted window
  - name: grant_type
    type: enum
    source: system
    description: LIVE | REPLAY
  - name: region
    type: string
    source: system
    description: Region at grant time
  - name: issued_at
    type: datetime
    source: system
    description: Grant issue timestamp (logical clock)
  - name: revoked
    type: boolean
    source: system
    description: True if revoked by blackout cascade
    default: false
- name: CapacityPool
  parent: null
  common_fields: true
  fields:
  - name: pool_code
    type: string
    source: input
    description: Unique pool code
  - name: scope_kind
    type: enum
    source: input
    description: REGION | EVENT
  - name: region_code
    type: string
    source: input
    description: Region code when scope_kind=REGION; null when EVENT
  - name: window_id
    type: string
    source: input
    description: FK -> StreamingWindow.id; event scope; null when REGION
  - name: total_units
    type: integer
    source: input
    description: Total provisioned stream concurrency units
    constraints: '>= 0'
  - name: committed_units
    type: integer
    source: computed
    description: Sum of non-terminal reservations (HELD + CONFIRMED)
  - name: oversubscribe_pct
    type: integer
    source: input
    description: Allowed oversubscription percent applied at provision commit
    default: 0
    constraints: 0..50
- name: CapacityReservation
  parent: null
  common_fields: true
  fields:
  - name: pool_id
    type: string
    source: input
    description: FK -> CapacityPool.id; reserved pool
  - name: window_id
    type: string
    source: input
    description: FK -> StreamingWindow.id; event the reservation serves
  - name: units
    type: integer
    source: input
    description: Reserved units
    constraints: '>= 1'
  - name: status
    type: enum
    source: system
    description: HELD | CONFIRMED | RELEASED | EXPIRED
  - name: hold_expires_at
    type: datetime
    source: system
    description: HELD reservations expire at creation_time + 900 seconds (logical clock)
  - name: confirmed_at
    type: datetime
    source: system
    description: Confirmation timestamp; null while HELD
- name: AdCampaign
  parent: null
  common_fields: true
  fields:
  - name: advertiser_code
    type: string
    source: input
    description: Advertiser code
  - name: campaign_status
    type: enum
    source: system
    description: DRAFT | BOOKED | PAUSED | COMPLETED
  - name: flight_start
    type: datetime
    source: input
    description: Campaign flight start
  - name: flight_end
    type: datetime
    source: input
    description: Campaign flight end; strictly after flight_start
  - name: frequency_cap_per_viewer
    type: integer
    source: input
    description: Max impressions of this campaign per viewer per frequency_window_hours
    constraints: '>= 1'
  - name: frequency_window_hours
    type: integer
    source: input
    description: Sliding window in hours for frequency cap
    constraints: '>= 1'
  - name: cpm_cents
    type: integer
    source: input
    description: Cost per mille in cents
    constraints: '>= 1'
  - name: region_target
    type: array
    source: input
    description: Targeted DMA region codes; empty array = national
- name: AdSlot
  parent: null
  common_fields: true
  fields:
  - name: window_id
    type: string
    source: input
    description: FK -> StreamingWindow.id; event carrying the break
  - name: break_index
    type: integer
    source: input
    description: Ad break ordinal within the event, >= 1
  - name: pod_index
    type: integer
    source: input
    description: Slot ordinal within the pod, >= 1
  - name: duration_seconds
    type: integer
    source: input
    description: Slot duration; one of 15, 30, 60
    constraints: in {15,30,60}
  - name: slot_scope
    type: enum
    source: input
    description: NATIONAL | LOCAL
  - name: region_code
    type: string
    source: input
    description: Region for LOCAL slots; null for NATIONAL
  - name: booked_campaign_id
    type: string
    source: system
    description: FK -> AdCampaign.id; campaign booked into this slot
  - name: status
    type: enum
    source: system
    description: OPEN | RESERVED | FILLED | UNFILLABLE | CANCELLED
- name: Impression
  parent: null
  common_fields: false
  fields:
  - name: campaign_id
    type: string
    source: system
    description: FK -> AdCampaign.id
  - name: viewer_id
    type: string
    source: system
    description: FK -> Viewer.id
  - name: slot_id
    type: string
    source: system
    description: FK -> AdSlot.id
  - name: served_at
    type: datetime
    source: system
    description: Serve timestamp (logical clock)
  - name: revenue_cents
    type: integer
    source: system
    description: Attributed ad revenue in cents for this impression
  - name: fill_source
    type: enum
    source: system
    description: NATIONAL | LOCAL_INSERTION
- name: DistributionPartner
  parent: null
  common_fields: true
  fields:
  - name: partner_code
    type: string
    source: input
    description: Unique partner code
  - name: display_name
    type: string
    source: input
    description: Partner display name
  - name: partner_status
    type: enum
    source: system
    description: ACTIVE | SUSPENDED | TERMINATED
  - name: bundled_tier
    type: enum
    source: input
    description: 'Tier granted by the bundle: AD_SUPPORTED | PREMIUM'
  - name: max_promo_codes
    type: integer
    source: input
    description: Total promo codes issuable under this partner agreement
    constraints: '>= 0'
  - name: codes_issued
    type: integer
    source: computed
    description: Promo codes issued so far
- name: PromoCode
  parent: null
  common_fields: true
  fields:
  - name: partner_id
    type: string
    source: input
    description: FK -> DistributionPartner.id; issuing partner
  - name: code
    type: string
    source: system
    description: Server-minted promo code string, unique
  - name: code_status
    type: enum
    source: system
    description: ISSUED | REDEEMED | REVOKED | EXPIRED
  - name: issued_at
    type: datetime
    source: system
    description: Issue timestamp
  - name: expires_at
    type: datetime
    source: system
    description: issued_at + 72h (logical clock)
  - name: redeemed_by_viewer_id
    type: string
    source: system
    description: FK -> Viewer.id; redeeming viewer, null until redeemed
- name: Entitlement
  parent: null
  common_fields: false
  fields:
  - name: viewer_id
    type: string
    source: system
    description: FK -> Viewer.id; entitled viewer
  - name: source_type
    type: enum
    source: system
    description: SUBSCRIPTION | PARTNER_BUNDLE
  - name: partner_id
    type: string
    source: system
    description: FK -> DistributionPartner.id; set when PARTNER_BUNDLE
  - name: tier_granted
    type: enum
    source: system
    description: AD_SUPPORTED | PREMIUM
  - name: active_from
    type: datetime
    source: system
    description: Entitlement activation timestamp
  - name: active
    type: boolean
    source: system
    description: True while entitlement grants access
- name: ReplayAsset
  parent: null
  common_fields: true
  fields:
  - name: window_id
    type: string
    source: system
    description: FK -> StreamingWindow.id; source window
  - name: status
    type: enum
    source: system
    description: AVAILABLE | EXPIRED | PULLED
  - name: available_from
    type: datetime
    source: system
    description: Replay availability start = window completion time
  - name: expires_at
    type: datetime
    source: system
    description: available_from + window.replay_hours
  - name: replay_views
    type: integer
    source: computed
    description: Replay ViewGrants issued while AVAILABLE
state_machines:
- entity: RightsProperty
  field: status
  initial_state: NEGOTIATION
  terminal_states:
  - EXPIRED
  - TERMINATED
  transitions:
  - from: NEGOTIATION
    to: ACTIVE
    trigger: POST /platform/properties/{property_id}/activate
    actor: RightsManager
    preconditions:
    - term_start <= current logical time < term_end
    - rights_fee_cents > 0
    side_effects:
    - Increments RightsProperty.version
  - from: ACTIVE
    to: SUSPENDED
    trigger: POST /platform/properties/{property_id}/suspend
    actor: RightsManager
    preconditions:
    - At least one StreamingWindow of this property is in SCHEDULED or LIVE
    side_effects:
    - 'Cascades: every SCHEDULED window of this property transitions to CANCELLED (see StreamingWindow cancel cascade)'
    - Cancels all AdSlots of those windows (AdSlot -> CANCELLED) and frees booked_campaign linkage
    - Increments RightsProperty.version
  - from: SUSPENDED
    to: ACTIVE
    trigger: POST /platform/properties/{property_id}/unsuspend
    actor: RightsManager
    preconditions:
    - No ACTIVE BLACKOUT TerritoryRule with effective window covering current logical time on any remaining window of this property
    side_effects:
    - Increments RightsProperty.version
  - from: ACTIVE
    to: EXPIRED
    trigger: system (current logical time >= term_end)
    actor: system
    preconditions:
    - current logical time >= term_end
    side_effects:
    - 'Cascades: remaining SCHEDULED windows -> CANCELLED; replay assets continue to their own expiry'
    - Increments RightsProperty.version
  - from: NEGOTIATION
    to: TERMINATED
    trigger: POST /platform/properties/{property_id}/terminate
    actor: RightsManager
    preconditions: []
    side_effects:
    - Increments RightsProperty.version
  - from: ACTIVE
    to: TERMINATED
    trigger: POST /platform/properties/{property_id}/terminate
    actor: RightsManager
    preconditions:
    - No window of this property is LIVE
    side_effects:
    - 'Cascades: SCHEDULED windows -> CANCELLED with the same cancel cascade'
    - Increments RightsProperty.version
- entity: StreamingWindow
  field: status
  initial_state: SCHEDULED
  terminal_states:
  - COMPLETE
  - CANCELLED
  - REPLACED
  transitions:
  - from: SCHEDULED
    to: LIVE
    trigger: POST /platform/windows/{window_id}/go-live
    actor: RightsManager
    preconditions:
    - RightsProperty.status == ACTIVE
    - 'Capacity: sum of CONFIRMED CapacityReservation units across pools for this window >= capacity_required_units'
    - 'Ad: count of AdSlot with slot_scope == LOCAL and status == FILLED for this window >= property.required_local_breaks_per_event'
    - No ACTIVE BLACKOUT TerritoryRule covers current logical time for a region in territory_scope when regional_block is false
    side_effects:
    - Sets live_start to current logical time
    - Transitions all HELD CapacityReservations of this window whose hold has not expired -> EXPIRED if past hold_expires_at, else leaves them;
      frees expired units
    - Increments StreamingWindow.version
  - from: LIVE
    to: COMPLETE
    trigger: POST /platform/windows/{window_id}/complete
    actor: RightsManager
    preconditions:
    - At least one Impression may or may not exist (no minimum)
    side_effects:
    - Creates ReplayAsset (status AVAILABLE, available_from = now, expires_at = now + replay_hours)
    - Releases all CONFIRMED CapacityReservations of this window -> RELEASED; decrements pool.committed_units (see capacity conservation invariant)
    - Triggers amortization_expense recompute for the property
    - Increments StreamingWindow.version
  - from: SCHEDULED
    to: CANCELLED
    trigger: POST /platform/windows/{window_id}/cancel or property suspend cascade
    actor: RightsManager or system
    preconditions: []
    side_effects:
    - 'Cascades: every AdSlot of this window -> CANCELLED; if slot was FILLED, Impressions already recorded remain (append-only) but slot is freed'
    - 'Cascades: HELD and CONFIRMED CapacityReservations of this window -> RELEASED; pool.committed_units decremented'
    - Decrements property.simulcast_windows_consumed or exclusive_windows_consumed per rights_mode
    - Increments StreamingWindow.version
  - from: SCHEDULED
    to: REPLACED
    trigger: POST /platform/windows (with supersedes_id pointing at this window)
    actor: RightsManager
    preconditions:
    - This window is SCHEDULED (a LIVE window cannot be superseded)
    - 'OCC: expected_property_version on the owning property must match'
    side_effects:
    - Sets replaced_by_id to the new window id
    - 'Cascades: AdSlots and CapacityReservations of the old window -> CANCELLED/RELEASED as in cancel'
    - Increments StreamingWindow.version
- entity: AdCampaign
  field: campaign_status
  initial_state: DRAFT
  terminal_states:
  - COMPLETED
  transitions:
  - from: DRAFT
    to: BOOKED
    trigger: POST /platform/ad-campaigns/{campaign_id}/book
    actor: AdOps
    preconditions:
    - flight_start < flight_end
    - flight_end >= current logical time
    side_effects:
    - Increments AdCampaign.version
  - from: BOOKED
    to: PAUSED
    trigger: POST /platform/ad-campaigns/{campaign_id}/pause
    actor: AdOps
    preconditions: []
    side_effects:
    - Increments AdCampaign.version
  - from: PAUSED
    to: BOOKED
    trigger: POST /platform/ad-campaigns/{campaign_id}/resume
    actor: AdOps
    preconditions:
    - flight_end >= current logical time
    side_effects:
    - Increments AdCampaign.version
  - from: BOOKED
    to: COMPLETED
    trigger: system (current logical time > flight_end)
    actor: system
    preconditions: []
    side_effects:
    - Increments AdCampaign.version
- entity: AdSlot
  field: status
  initial_state: OPEN
  terminal_states:
  - UNFILLABLE
  - CANCELLED
  transitions:
  - from: OPEN
    to: RESERVED
    trigger: POST /platform/ad-slots/{slot_id}/fill (reservation leg)
    actor: AdOps
    preconditions:
    - Window of this slot is SCHEDULED or LIVE
    - Campaign is BOOKED and not PAUSED
    - If slot_scope == LOCAL, campaign.region_target must include slot.region_code
    side_effects:
    - Sets booked_campaign_id
    - Increments AdSlot.version
  - from: RESERVED
    to: FILLED
    trigger: POST /platform/ad-slots/{slot_id}/fill confirmation leg (idempotent on same campaign)
    actor: AdOps
    preconditions:
    - booked_campaign_id unchanged
    side_effects:
    - Increments AdSlot.version
  - from: OPEN
    to: UNFILLABLE
    trigger: POST /platform/ad-slots/{slot_id}/mark-unfillable
    actor: AdOps
    preconditions:
    - Window is SCHEDULED or LIVE
    side_effects:
    - Increments AdSlot.version
  - from: RESERVED
    to: OPEN
    trigger: POST /platform/ad-slots/{slot_id}/release
    actor: AdOps
    preconditions: []
    side_effects:
    - Clears booked_campaign_id
    - Increments AdSlot.version
  - from: OPEN
    to: CANCELLED
    trigger: window cancel cascade
    actor: system
    preconditions: []
    side_effects: []
  - from: RESERVED
    to: CANCELLED
    trigger: window cancel cascade
    actor: system
    preconditions: []
    side_effects:
    - Clears booked_campaign_id
- entity: CapacityReservation
  field: status
  initial_state: HELD
  terminal_states:
  - RELEASED
  - EXPIRED
  transitions:
  - from: HELD
    to: CONFIRMED
    trigger: POST /platform/capacity-reservations/{reservation_id}/confirm
    actor: StreamOps
    preconditions:
    - current logical time < hold_expires_at
    - Pool capacity check per capacity_commit calculation (with oversubscribe_pct applied at confirm)
    side_effects:
    - Sets confirmed_at
    - Increments CapacityReservation.version
  - from: HELD
    to: EXPIRED
    trigger: system (current logical time >= hold_expires_at) or go-live sweep
    actor: system
    preconditions: []
    side_effects:
    - pool.committed_units decremented by units
  - from: CONFIRMED
    to: RELEASED
    trigger: window complete/cancel cascade or POST /platform/capacity-reservations/{reservation_id}/release
    actor: StreamOps or system
    preconditions: []
    side_effects:
    - pool.committed_units decremented by units
- entity: PromoCode
  field: code_status
  initial_state: ISSUED
  terminal_states:
  - REDEEMED
  - REVOKED
  - EXPIRED
  transitions:
  - from: ISSUED
    to: REDEEMED
    trigger: POST /platform/promo-codes/redeem
    actor: Viewer
    preconditions:
    - current logical time < expires_at
    - Partner partner_status == ACTIVE
    - Viewer has no active Entitlement with source_type == PARTNER_BUNDLE
    side_effects:
    - Sets redeemed_by_viewer_id
    - Creates Entitlement (source_type PARTNER_BUNDLE, tier = partner.bundled_tier, active = true)
    - Viewer.subscription_tier := partner.bundled_tier; subscription_status := ACTIVE
    - 'If viewer acquisition_source unset: acquisition_source := PARTNER_BUNDLE'
  - from: ISSUED
    to: EXPIRED
    trigger: system (current logical time >= expires_at)
    actor: system
    preconditions: []
    side_effects: []
  - from: ISSUED
    to: REVOKED
    trigger: POST /platform/promo-codes/{code_id}/revoke
    actor: PartnerManager
    preconditions: []
    side_effects: []
- entity: Viewer
  field: subscription_status
  initial_state: ACTIVE
  terminal_states:
  - CANCELLED
  transitions:
  - from: ACTIVE
    to: GRACE
    trigger: POST /platform/viewers/{viewer_id}/suspend-billing (missed payment)
    actor: PartnerManager
    preconditions: []
    side_effects: []
  - from: GRACE
    to: ACTIVE
    trigger: POST /platform/viewers/{viewer_id}/reactivate
    actor: PartnerManager
    preconditions: []
    side_effects: []
  - from: GRACE
    to: SUSPENDED
    trigger: system (grace period 72h elapses)
    actor: system
    preconditions: []
    side_effects:
    - All Entitlements of this viewer -> active := false
  - from: SUSPENDED
    to: ACTIVE
    trigger: POST /platform/viewers/{viewer_id}/reactivate
    actor: PartnerManager
    preconditions: []
    side_effects:
    - Entitlements reactivated
  - from: ACTIVE
    to: CANCELLED
    trigger: POST /platform/viewers/{viewer_id}/cancel
    actor: Viewer
    preconditions: []
    side_effects:
    - All Entitlements -> active := false
    - churn attribution recorded (see churn_model calculation)
  - from: SUSPENDED
    to: CANCELLED
    trigger: POST /platform/viewers/{viewer_id}/cancel
    actor: Viewer
    preconditions: []
    side_effects:
    - All Entitlements -> active := false
- entity: ReplayAsset
  field: status
  initial_state: AVAILABLE
  terminal_states:
  - EXPIRED
  - PULLED
  transitions:
  - from: AVAILABLE
    to: EXPIRED
    trigger: system (current logical time >= expires_at)
    actor: system
    preconditions: []
    side_effects: []
  - from: AVAILABLE
    to: PULLED
    trigger: POST /platform/replay-assets/{asset_id}/pull
    actor: RightsManager
    preconditions:
    - Owning property status in {ACTIVE, SUSPENDED}
    side_effects:
    - Increments ReplayAsset.version
- entity: TerritoryRule
  field: rule_status
  initial_state: ACTIVE
  terminal_states:
  - LIFTED
  transitions:
  - from: ACTIVE
    to: LIFTED
    trigger: POST /platform/territory-rules/{rule_id}/lift
    actor: RightsManager
    preconditions:
    - Window is SCHEDULED (a blackout cannot be lifted once live; obligations locked)
    side_effects:
    - Increments TerritoryRule.version
concurrency_rules:
- rule_id: window-supersede-stale-property
  parent_entity: RightsProperty
  write_endpoint: POST /platform/windows
  occ_field: expected_property_version
  description: 'Creating a StreamingWindow that supersedes an existing window against a

    RightsProperty whose version has advanced since the client last observed it

    is rejected. This captures the case where another writer has just scheduled

    a replacement window (which legitimately supersedes the same predecessor

    under the reschedule policy) and the current writer''s view of the property''s

    window counters is therefore stale.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
- rule_id: slot-fill-stale-window
  parent_entity: StreamingWindow
  write_endpoint: POST /platform/ad-slots/{slot_id}/fill
  occ_field: expected_window_version
  description: 'Filling an AdSlot against a StreamingWindow whose version has advanced since

    the client last observed it is rejected. This captures the case where a

    cascade (window cancel, supersede) has just mutated the window and the

    client''s slot-fill plan is therefore stale.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
calculations:
- name: amortization_expense
  trigger: window completes; property activation; report read
  algorithm: tiered_pricing
  formula: "STRAIGHT_LINE variant:\n  periods = number of whole calendar months in [term_start, term_end)\n  per_period = floor(rights_fee_cents\
    \ / periods)\n  amortized_fee_cents = per_period * elapsed_periods(now), capped at rights_fee_cents\n  # rounding order pinned: floor per\
    \ period FIRST, then multiply — never\n  # floor(rights_fee * elapsed / periods)\nEVENT_WEIGHTED variant:\n  weights: EXCLUSIVE window = 3,\
    \ SIMULCAST window = 1\n  total_weight = sum(weights of all non-CANCELLED, non-REPLACED windows of property)\n  done_weight = sum(weights\
    \ of COMPLETE windows)\n  amortized_fee_cents = floor(rights_fee_cents * done_weight / max(total_weight, 1))\n"
  input_set: Windows of property with status != CANCELLED and != REPLACED; COMPLETE subset for done_weight
  constants:
    EXCLUSIVE_WEIGHT: 3
    SIMULCAST_WEIGHT: 1
  precision: integer cents; floor at the pinned step only
  variants:
  - name: straight_line
    when: property.amortization_method == STRAIGHT_LINE
    difference: Time-based; ignores event mix
  - name: event_weighted
    when: property.amortization_method == EVENT_WEIGHTED
    difference: Event-weight-based; exclusive events amortize 3x a simulcast event
- name: frequency_cap_check
  trigger: ad serve request for an AD_SUPPORTED viewer on a slot
  algorithm: threshold
  formula: "window_start = now - campaign.frequency_window_hours * 3600 seconds\nserved = count(Impression where campaign_id = campaign AND viewer_id\
    \ = viewer\n                AND window_start <= served_at < now)   # half-open interval\neligible = (served < campaign.frequency_cap_per_viewer)\n\
    # boundary pinned: strictly less-than. served == cap -> BLOCKED.\n"
  input_set: Impressions (append-only) for (campaign, viewer) pair; only impressions with served_at inside the half-open sliding window
  constants:
    BOUNDARY: served == cap blocks (>= semantics for blocking)
  precision: integer counts; exact
  variants: []
- name: ad_revenue_attribution
  trigger: impression recorded
  algorithm: weighted_scoring
  formula: 'base = cpm_cents * slot.duration_seconds / 30  # normalized 30s unit

    local_multiplier = 1.5 if slot.slot_scope == LOCAL else 1.0

    marquee_multiplier = 2.0 if window.is_marquee and window.rights_mode == EXCLUSIVE else 1.0

    raw = base * local_multiplier * marquee_multiplier / 1000

    revenue_cents = round_half_up(raw)

    # rounding order pinned: compute raw with full precision, round ONCE at the end.

    # Rounding per-factor is forbidden.

    '
  input_set: Single impression context (campaign, slot, window)
  constants:
    LOCAL_MULTIPLIER_NUM: 3
    LOCAL_MULTIPLIER_DEN: 2
    MARQUEE_MULTIPLIER: 2
  precision: integer cents, round_half_up, single final rounding
  variants: []
- name: churn_model
  trigger: marquee exclusive window completes; viewer cancels
  algorithm: forward_looking
  formula: "PROVISIONAL variant (computed at window COMPLETE, stored on window report):\n  cohort = viewers with acquisition_window_id == window\
    \ AND acquisition_source == PARTNER_BUNDLE or ORGANIC\n  provisional_churn_pct = BASELINE_CHURN_PCT + (5 if window.is_marquee else 0)\n  #\
    \ provisional uses baseline only; actual cancels observed later\nFINAL variant (recomputed on each cohort cancel):\n  final_churn_pct = floor(100\
    \ * cancels_in_cohort / max(cohort_size, 1))\n  # diverges from provisional whenever observed cancels differ from baseline\n"
  input_set: Viewers where acquisition_window_id == window.id and subscription_status in {ACTIVE, GRACE, SUSPENDED, CANCELLED}
  constants:
    BASELINE_CHURN_PCT: 12
    MARQUEE_UPLIFT_PCT: 5
  precision: integer percent, floor
  variants:
  - name: provisional
    when: window completion report
    difference: Uses BASELINE_CHURN_PCT + marquee uplift; forward-looking
  - name: final
    when: after cohort cancels observed
    difference: Uses observed cancels; floor(100*cancels/cohort)
- name: capacity_commit
  trigger: reservation confirm; go-live check
  algorithm: waterfall_allocation
  formula: 'effective_pool_units(pool) = floor(pool.total_units * (100 + pool.oversubscribe_pct) / 100)

    # oversubscription applies ONLY at confirm, not at hold.

    confirmable = effective_pool_units(pool) - pool.committed_units

    a CONFIRM of reservation r succeeds iff r.units <= confirmable

    go-live gate: sum(CONFIRMED reservations for window across pools) >= window.capacity_required_units

    # boundary pinned: equality passes (>=).

    '
  input_set: CapacityReservations of pool with status in {HELD, CONFIRMED}; window reservations with status CONFIRMED
  constants:
    HOLD_TTL_SECONDS: 900
  precision: integer units; floor on oversubscribe expansion
  variants: []
- name: pod_construction
  trigger: GET /platform/windows/{window_id}/pods or fill attempts
  algorithm: constraint_propagation
  formula: "For break_index b of a window, pod duration must satisfy:\n  sum(duration_seconds of slots in break b) == 120   # fixed 120s pod\n\
    Slot fill order: pod_index ASC, ties broken by created_at ASC.\nNATIONAL slots must be filled before LOCAL slots in the same break may be\n\
    served nationally; LOCAL slots may only be filled by campaigns whose\nregion_target includes the slot region.\nIf any slot of break b is UNFILLABLE\
    \ and the remaining OPEN slots cannot\nsum to 120 with available {15,30,60} pieces, the whole break is UNFILLABLE.\n"
  input_set: AdSlots of window grouped by break_index
  constants:
    POD_SECONDS: 120
    ALLOWED_DURATIONS: 15,30,60
  precision: integer seconds; exact
  variants: []
- name: exclusive_ratio_gate
  trigger: window create with rights_mode == SIMULCAST
  algorithm: threshold
  formula: "After adding the new SIMULCAST window:\n  exclusive_ratio = 100 * exclusive_windows_consumed / max(1, simulcast_windows_consumed +\
    \ exclusive_windows_consumed)\nReject iff exclusive_ratio < property.minimum_exclusive_ratio_pct\n# boundary pinned: ratio == minimum passes\
    \ (< rejects).\n"
  input_set: Non-CANCELLED, non-REPLACED windows of property
  constants: {}
  precision: integer percent computed as floor(100*num/den); compare on the floored value
  variants: []
- name: blackout_overlap
  trigger: TerritoryRule create; view-grant request
  algorithm: interval_merge
  formula: "A new BLACKOUT rule for (window, region) with [effective_start, effective_end)\nis rejected if it OVERLAPS any existing ACTIVE BLACKOUT\
    \ rule for the same\n(window, region) — half-open interval intersection:\n  overlap iff new.start < existing.end AND existing.start < new.end\n\
    Adjacent intervals (new.start == existing.end) do NOT overlap and are allowed;\ntwo adjacent rules MUST NOT be merged (each mirrors a distinct\
    \ broadcast obligation).\nAn OVERFLOW rule for the same (window, region) overlapping a BLACKOUT is\nallowed only if the OVERFLOW region is\
    \ not in the window.territory_scope.\n"
  input_set: TerritoryRules with rule_status == ACTIVE for the same window
  constants: {}
  precision: datetime compare; strict half-open
  variants: []
validations:
- priority: 1
  category: auth
  check: X-User-Role header present and one of declared roles; X-User-ID present for entity_backed roles
  error_id: ERR_UNAUTHENTICATED
  http_status: 401
  applies_to: all
- priority: 2
  category: auth
  check: Role is permitted for the endpoint per RBAC matrix
  error_id: ERR_FORBIDDEN
  http_status: 403
  applies_to: all
- priority: 3
  category: existence
  check: All path-templated and body-referenced resources exist, validated left-to-right
  error_id: ERR_NOT_FOUND
  http_status: 404
  applies_to: all
- priority: 4
  category: existence
  check: Required request fields present and well-typed (missing/unknown field, bad enum, bad datetime)
  error_id: ERR_INVALID_REQUEST
  http_status: 400
  applies_to: all
- priority: 5
  category: state
  check: OCC expected_*_version matches current parent version
  error_id: ERR_STALE_VERSION
  http_status: 412
  applies_to: POST /platform/windows; POST /platform/ad-slots/{slot_id}/fill
- priority: 6
  category: state
  check: Target resource is in a state that permits the transition per state machine
  error_id: ERR_INVALID_STATE
  http_status: 409
  applies_to: all state-transition endpoints
- priority: 7
  category: business_temporal
  check: 'Territory window: new window scheduled times fall inside property term; replay hours >= 0'
  error_id: ERR_WINDOW_OUTSIDE_TERM
  http_status: 422
  applies_to: POST /platform/windows
- priority: 8
  category: business_temporal
  check: TerritoryRule effective interval valid (start < end; start >= window.scheduled_start - 24h)
  error_id: ERR_RULE_WINDOW_INVALID
  http_status: 422
  applies_to: POST /platform/territory-rules
- priority: 9
  category: business_constraint
  check: BLACKOUT rule overlap with an existing ACTIVE BLACKOUT for same (window, region) per blackout_overlap
  error_id: ERR_BLACKOUT_OVERLAP
  http_status: 409
  applies_to: POST /platform/territory-rules
- priority: 10
  category: business_constraint
  check: Property simulcast/exclusive window quota not exceeded by the new window's rights_mode
  error_id: ERR_WINDOW_QUOTA_EXCEEDED
  http_status: 422
  applies_to: POST /platform/windows
- priority: 11
  category: business_constraint
  check: Exclusive-ratio gate per exclusive_ratio_gate calculation
  error_id: ERR_EXCLUSIVE_RATIO_BREACH
  http_status: 422
  applies_to: POST /platform/windows with rights_mode SIMULCAST
- priority: 12
  category: business_safety
  check: 'View grant: no ACTIVE BLACKOUT TerritoryRule covering now for viewer region on this window'
  error_id: ERR_BLACKOUT_REGION_BLOCKED
  http_status: 403
  applies_to: POST /platform/windows/{window_id}/view-grants
- priority: 13
  category: business_safety
  check: 'View grant: window territory_scope contains viewer region'
  error_id: ERR_TERRITORY_NOT_LICENSED
  http_status: 403
  applies_to: POST /platform/windows/{window_id}/view-grants
- priority: 14
  category: business_referential
  check: 'View grant tier: LIVE grants require subscription tier PREMIUM when window.rights_mode == EXCLUSIVE; REPLAY grants require status ACTIVE/GRACE'
  error_id: ERR_TIER_INSUFFICIENT
  http_status: 402
  applies_to: POST /platform/windows/{window_id}/view-grants
- priority: 15
  category: business_fiscal
  check: 'Ad serve: frequency_cap_check passes for (campaign, viewer)'
  error_id: ERR_FREQUENCY_CAP_EXCEEDED
  http_status: 422
  applies_to: POST /platform/ad-slots/{slot_id}/serve
- priority: 16
  category: business_fiscal
  check: 'Capacity: reservation units available per capacity_commit'
  error_id: ERR_CAPACITY_INSUFFICIENT
  http_status: 422
  applies_to: POST /platform/capacity-reservations; POST /platform/capacity-reservations/{id}/confirm
- priority: 17
  category: business_fiscal
  check: 'Partner promo quota: codes_issued < max_promo_codes'
  error_id: ERR_PROMO_QUOTA_EXHAUSTED
  http_status: 422
  applies_to: POST /platform/partners/{partner_id}/promo-codes
- priority: 18
  category: business_constraint
  check: 'Promo redeem: code ISSUED and unexpired; viewer has no active PARTNER_BUNDLE entitlement'
  error_id: ERR_PROMO_INVALID
  http_status: 422
  applies_to: POST /platform/promo-codes/redeem
- priority: 19
  category: business_constraint
  check: 'Ad slot fill: pod_construction duration feasibility and region targeting satisfied'
  error_id: ERR_POD_INFEASIBLE
  http_status: 422
  applies_to: POST /platform/ad-slots/{slot_id}/fill
- priority: 20
  category: business_constraint
  check: 'Go-live gates: capacity satisfied and local break minimum met'
  error_id: ERR_GOLIVE_GATE_FAILED
  http_status: 409
  applies_to: POST /platform/windows/{window_id}/go-live
- priority: 21
  category: business_temporal
  check: 'Reservation confirm: current logical time < hold_expires_at'
  error_id: ERR_HOLD_EXPIRED
  http_status: 409
  applies_to: POST /platform/capacity-reservations/{id}/confirm
- priority: 22
  category: state
  check: 'Replay grant: ReplayAsset for window is AVAILABLE (not EXPIRED or PULLED)'
  error_id: ERR_REPLAY_EXPIRED
  http_status: 409
  applies_to: POST /platform/windows/{window_id}/view-grants
endpoints:
- method: POST
  path: /platform/properties
  description: Create a rights property in NEGOTIATION
  roles:
  - RightsManager
  code: 201
  input:
  - property_code
  - display_name
  - sport
  - rights_fee_cents
  - term_start
  - term_end
  - amortization_method
  - simulcast_windows_count
  - exclusive_windows_count
  - minimum_exclusive_ratio_pct
  - required_local_breaks_per_event
  output: RightsProperty
  side_effects: []
- method: GET
  path: /platform/properties/{id}
  description: Fetch one property
  roles:
  - RightsManager
  - AdOps
  - StreamOps
  - PartnerManager
  - Viewer
  code: 200
  input: []
  output: RightsProperty
  side_effects: []
- method: GET
  path: /platform/properties
  description: List properties
  roles:
  - RightsManager
  - AdOps
  - StreamOps
  - PartnerManager
  code: 200
  input:
  - limit?
  - offset?
  - status?
  output: RightsProperty[]
  side_effects: []
- method: POST
  path: /platform/properties/{id}/activate
  description: Activate property (NEGOTIATION -> ACTIVE)
  roles:
  - RightsManager
  code: 200
  input: []
  output: RightsProperty
  side_effects:
  - increments RightsProperty.version by 1
- method: POST
  path: /platform/properties/{id}/suspend
  description: Suspend property; cancels scheduled windows with full cascade
  roles:
  - RightsManager
  code: 200
  input: []
  output: RightsProperty
  side_effects:
  - increments RightsProperty.version by 1
  - cascades window cancellations
- method: POST
  path: /platform/properties/{id}/unsuspend
  description: Unsuspend property (SUSPENDED -> ACTIVE)
  roles:
  - RightsManager
  code: 200
  input: []
  output: RightsProperty
  side_effects:
  - increments RightsProperty.version by 1
- method: POST
  path: /platform/properties/{id}/terminate
  description: Terminate property
  roles:
  - RightsManager
  code: 200
  input: []
  output: RightsProperty
  side_effects:
  - increments RightsProperty.version by 1
- method: POST
  path: /platform/windows
  description: Schedule a streaming window; optional supersedes_id replaces an existing SCHEDULED window under OCC on the property
  roles:
  - RightsManager
  code: 201
  input:
  - property_id
  - event_code
  - rights_mode
  - scheduled_start
  - scheduled_end
  - territory_scope
  - regional_block
  - capacity_required_units
  - replay_hours
  - expected_property_version
  - is_marquee?
  - supersedes_id?
  output: StreamingWindow
  side_effects:
  - increments RightsProperty.version by 1
  - supersedes transition when supersedes_id present
  - window counters recompute
- method: GET
  path: /platform/windows/{id}
  description: Fetch one window
  roles:
  - RightsManager
  - AdOps
  - StreamOps
  - PartnerManager
  - Viewer
  code: 200
  input: []
  output: StreamingWindow
  side_effects: []
- method: GET
  path: /platform/windows
  description: List windows, filterable
  roles:
  - RightsManager
  - AdOps
  - StreamOps
  - PartnerManager
  - Viewer
  code: 200
  input:
  - limit?
  - offset?
  - property_id?
  - status?
  - rights_mode?
  - replaced_by_id?
  - supersedes_id?
  output: StreamingWindow[]
  side_effects: []
- method: GET
  path: /platform/properties/{id}/windows
  description: List windows of a property (sub-resource)
  roles:
  - RightsManager
  - AdOps
  - StreamOps
  - PartnerManager
  code: 200
  input:
  - limit?
  - offset?
  output: StreamingWindow[]
  side_effects: []
- method: POST
  path: /platform/windows/{id}/go-live
  description: Transition window SCHEDULED -> LIVE; enforces capacity and local-break gates
  roles:
  - RightsManager
  code: 200
  input: []
  output: StreamingWindow
  side_effects:
  - sets live_start
  - sweeps expired HELD reservations
  - increments StreamingWindow.version by 1
- method: POST
  path: /platform/windows/{id}/complete
  description: Transition LIVE -> COMPLETE; creates ReplayAsset; releases reservations
  roles:
  - RightsManager
  code: 200
  input: []
  output: StreamingWindow
  side_effects:
  - creates ReplayAsset
  - releases CONFIRMED reservations
  - amortization recompute
  - increments StreamingWindow.version by 1
- method: POST
  path: /platform/windows/{id}/cancel
  description: Cancel a SCHEDULED window with cascade
  roles:
  - RightsManager
  code: 200
  input: []
  output: StreamingWindow
  side_effects:
  - cancels AdSlots
  - releases CapacityReservations
  - decrements property window counters
  - increments StreamingWindow.version by 1
- method: POST
  path: /platform/territory-rules
  description: Create a BLACKOUT or OVERFLOW territory rule for a window/region
  roles:
  - RightsManager
  code: 201
  input:
  - window_id
  - region_code
  - rule_kind
  - effective_start
  - effective_end
  - broadcast_obligation_ref
  output: TerritoryRule
  side_effects: []
- method: GET
  path: /platform/territory-rules
  description: List territory rules, filterable by window and region
  roles:
  - RightsManager
  - StreamOps
  code: 200
  input:
  - limit?
  - offset?
  - window_id?
  - region_code?
  - rule_status?
  output: TerritoryRule[]
  side_effects: []
- method: POST
  path: /platform/territory-rules/{id}/lift
  description: Lift an ACTIVE territory rule (window must still be SCHEDULED)
  roles:
  - RightsManager
  code: 200
  input: []
  output: TerritoryRule
  side_effects:
  - increments TerritoryRule.version by 1
- method: POST
  path: /platform/viewers
  description: Register a viewer (subscription ACTIVE, tier AD_SUPPORTED by default)
  roles:
  - Viewer
  code: 201
  input:
  - email
  - home_region
  - subscription_tier?
  output: Viewer
  side_effects: []
- method: GET
  path: /platform/viewers/{id}
  description: Fetch viewer
  roles:
  - PartnerManager
  - Viewer
  code: 200
  input: []
  output: Viewer
  side_effects: []
- method: POST
  path: /platform/viewers/{id}/reactivate
  description: Reactivate viewer from GRACE or SUSPENDED
  roles:
  - PartnerManager
  code: 200
  input: []
  output: Viewer
  side_effects:
  - reactivates entitlements
- method: POST
  path: /platform/viewers/{id}/suspend-billing
  description: Move ACTIVE viewer to GRACE
  roles:
  - PartnerManager
  code: 200
  input: []
  output: Viewer
  side_effects: []
- method: POST
  path: /platform/viewers/{id}/cancel
  description: Cancel viewer subscription
  roles:
  - Viewer
  code: 200
  input: []
  output: Viewer
  side_effects:
  - deactivates entitlements
  - churn attribution
- method: POST
  path: /platform/windows/{id}/view-grants
  description: Issue a LIVE or REPLAY view grant after territory, blackout, and tier checks
  roles:
  - Viewer
  code: 201
  input:
  - viewer_id
  - grant_type
  output: ViewGrant
  side_effects:
  - replay grants increment ReplayAsset.replay_views
- method: GET
  path: /platform/view-grants
  description: List view grants (filtered list form for both FKs)
  roles:
  - StreamOps
  - Viewer
  - RightsManager
  code: 200
  input:
  - limit?
  - offset?
  - viewer_id?
  - window_id?
  output: ViewGrant[]
  side_effects: []
- method: POST
  path: /platform/capacity-pools
  description: Provision a capacity pool (REGION or EVENT scope)
  roles:
  - StreamOps
  code: 201
  input:
  - pool_code
  - scope_kind
  - total_units
  - region_code?
  - window_id?
  - oversubscribe_pct?
  output: CapacityPool
  side_effects: []
- method: GET
  path: /platform/capacity-pools
  description: List capacity pools, filterable (filtered-list reverse reachability for window_id FK)
  roles:
  - StreamOps
  code: 200
  input:
  - limit?
  - offset?
  - window_id?
  - scope_kind?
  - pool_code?
  output: CapacityPool[]
  side_effects: []
- method: GET
  path: /platform/capacity-pools/{id}
  description: Fetch capacity pool
  roles:
  - StreamOps
  code: 200
  input: []
  output: CapacityPool
  side_effects: []
- method: POST
  path: /platform/capacity-reservations
  description: Create a HELD capacity reservation against a pool for a window
  roles:
  - StreamOps
  code: 201
  input:
  - pool_id
  - window_id
  - units
  output: CapacityReservation
  side_effects:
  - sets hold_expires_at = now + 900s
  - increments pool.committed_units
- method: GET
  path: /platform/capacity-reservations
  description: List reservations, filterable
  roles:
  - StreamOps
  code: 200
  input:
  - limit?
  - offset?
  - pool_id?
  - window_id?
  - status?
  output: CapacityReservation[]
  side_effects: []
- method: POST
  path: /platform/capacity-reservations/{id}/confirm
  description: Confirm a HELD reservation (oversubscribe expansion applies here)
  roles:
  - StreamOps
  code: 200
  input: []
  output: CapacityReservation
  side_effects:
  - sets confirmed_at
  - increments CapacityReservation.version by 1
- method: POST
  path: /platform/capacity-reservations/{id}/release
  description: Release a CONFIRMED or HELD reservation
  roles:
  - StreamOps
  code: 200
  input: []
  output: CapacityReservation
  side_effects:
  - decrements pool.committed_units
- method: POST
  path: /platform/ad-campaigns
  description: Create an ad campaign in DRAFT
  roles:
  - AdOps
  code: 201
  input:
  - advertiser_code
  - flight_start
  - flight_end
  - frequency_cap_per_viewer
  - frequency_window_hours
  - cpm_cents
  - region_target
  output: AdCampaign
  side_effects: []
- method: POST
  path: /platform/ad-campaigns/{id}/book
  description: Book campaign (DRAFT -> BOOKED)
  roles:
  - AdOps
  code: 200
  input: []
  output: AdCampaign
  side_effects:
  - increments AdCampaign.version by 1
- method: POST
  path: /platform/ad-campaigns/{id}/pause
  description: Pause campaign (BOOKED -> PAUSED)
  roles:
  - AdOps
  code: 200
  input: []
  output: AdCampaign
  side_effects:
  - increments AdCampaign.version by 1
- method: POST
  path: /platform/ad-campaigns/{id}/resume
  description: Resume campaign (PAUSED -> BOOKED)
  roles:
  - AdOps
  code: 200
  input: []
  output: AdCampaign
  side_effects:
  - increments AdCampaign.version by 1
- method: GET
  path: /platform/ad-campaigns/{id}
  description: Fetch campaign
  roles:
  - AdOps
  code: 200
  input: []
  output: AdCampaign
  side_effects: []
- method: POST
  path: /platform/ad-slots
  description: Create an ad slot on a window break (OPEN)
  roles:
  - AdOps
  code: 201
  input:
  - window_id
  - break_index
  - pod_index
  - duration_seconds
  - slot_scope
  - region_code?
  output: AdSlot
  side_effects: []
- method: GET
  path: /platform/ad-slots
  description: List ad slots, filterable by window
  roles:
  - AdOps
  - RightsManager
  code: 200
  input:
  - limit?
  - offset?
  - window_id?
  - status?
  - booked_campaign_id?
  output: AdSlot[]
  side_effects: []
- method: POST
  path: /platform/ad-slots/{id}/fill
  description: Fill a slot (OPEN -> RESERVED -> FILLED) under OCC on the parent window
  roles:
  - AdOps
  code: 200
  input:
  - campaign_id
  - expected_window_version
  output: AdSlot
  side_effects:
  - increments StreamingWindow.version by 1
  - sets booked_campaign_id
- method: POST
  path: /platform/ad-slots/{id}/release
  description: Release a RESERVED slot back to OPEN
  roles:
  - AdOps
  code: 200
  input: []
  output: AdSlot
  side_effects:
  - clears booked_campaign_id
- method: POST
  path: /platform/ad-slots/{id}/mark-unfillable
  description: Mark an OPEN slot UNFILLABLE
  roles:
  - AdOps
  code: 200
  input: []
  output: AdSlot
  side_effects: []
- method: POST
  path: /platform/ad-slots/{id}/serve
  description: Serve an impression of the slot's booked campaign to an AD_SUPPORTED viewer; frequency-cap enforced; revenue attributed
  roles:
  - AdOps
  code: 201
  input:
  - viewer_id
  output: Impression
  side_effects:
  - ad_revenue_attribution computed and stored on Impression
  - frequency cap checked
- method: GET
  path: /platform/impressions
  description: List impressions, filterable
  roles:
  - AdOps
  code: 200
  input:
  - limit?
  - offset?
  - campaign_id?
  - viewer_id?
  - slot_id?
  output: Impression[]
  side_effects: []
- method: GET
  path: /platform/windows/{id}/pods
  description: 'Computed read: pod construction summary per break for the window'
  roles:
  - AdOps
  - RightsManager
  code: 200
  input: []
  output: '{ breaks: array, total_open_seconds: integer, total_filled_seconds: integer }'
  side_effects: []
- method: POST
  path: /platform/partners
  description: Create a distribution partner
  roles:
  - PartnerManager
  code: 201
  input:
  - partner_code
  - display_name
  - bundled_tier
  - max_promo_codes
  output: DistributionPartner
  side_effects: []
- method: GET
  path: /platform/partners/{id}
  description: Fetch partner
  roles:
  - PartnerManager
  code: 200
  input: []
  output: DistributionPartner
  side_effects: []
- method: POST
  path: /platform/partners/{id}/promo-codes
  description: Issue a promo code under a partner (quota enforced)
  roles:
  - PartnerManager
  code: 201
  input: []
  output: PromoCode
  side_effects:
  - increments partner.codes_issued
  - sets expires_at = now + 72h
- method: GET
  path: /platform/promo-codes
  description: List promo codes, filterable by partner
  roles:
  - PartnerManager
  code: 200
  input:
  - limit?
  - offset?
  - partner_id?
  - code_status?
  - redeemed_by_viewer_id?
  output: PromoCode[]
  side_effects: []
- method: POST
  path: /platform/promo-codes/redeem
  description: Viewer redeems a promo code; entitlement provisioned
  roles:
  - Viewer
  code: 200
  input:
  - code
  - viewer_id
  output: Entitlement
  side_effects:
  - PromoCode -> REDEEMED
  - Entitlement created
  - Viewer tier/status updated
  - acquisition_source set if unset
- method: POST
  path: /platform/promo-codes/{id}/revoke
  description: Revoke an ISSUED promo code
  roles:
  - PartnerManager
  code: 200
  input: []
  output: PromoCode
  side_effects: []
- method: GET
  path: /platform/entitlements
  description: List entitlements (filtered list for both FKs)
  roles:
  - PartnerManager
  - Viewer
  code: 200
  input:
  - limit?
  - offset?
  - viewer_id?
  - partner_id?
  output: Entitlement[]
  side_effects: []
- method: GET
  path: /platform/replay-assets
  description: List replay assets, filterable by window
  roles:
  - RightsManager
  - StreamOps
  - Viewer
  code: 200
  input:
  - limit?
  - offset?
  - window_id?
  - status?
  output: ReplayAsset[]
  side_effects: []
- method: POST
  path: /platform/replay-assets/{id}/pull
  description: Pull a replay asset (AVAILABLE -> PULLED)
  roles:
  - RightsManager
  code: 200
  input: []
  output: ReplayAsset
  side_effects:
  - increments ReplayAsset.version by 1
- method: GET
  path: /platform/reports/property-economics
  description: 'Computed read: amortization vs attributed revenue (subscriber + ad) per property'
  roles:
  - RightsManager
  code: 200
  input:
  - property_id
  output: '{ property_id: string, amortized_fee_cents: integer, ad_revenue_cents: integer, subscriber_revenue_cents: integer, net_cents: integer,
    provisional_churn_pct: integer, final_churn_pct: integer }'
  side_effects: []
- method: POST
  path: /platform/_clock/set_current_utc
  description: Set the logical clock (test-driving endpoint). Server startup default is 2026-09-01T00:00:00Z; before any set call the logical
    clock reads exactly this default and never falls back to wall-clock time.
  roles:
  - StreamOps
  code: 200
  input:
  - to_iso8601
  output: '{ current_utc: string }'
  side_effects:
  - time-driven transitions re-evaluated (expiry sweeps
  - grace lapse
  - campaign completion
  - property expiry)
- method: GET
  path: /platform/viewers
  description: List viewers (filtered-list reverse reachability for acquisition_window_id FK)
  roles:
  - PartnerManager
  code: 200
  input:
  - limit?
  - offset?
  - acquisition_window_id?
  output: Viewer[]
  side_effects: []
- method: GET
  path: /platform/capacity-reservations/{id}
  description: Fetch one CapacityReservation
  roles:
  - StreamOps
  code: 200
  input: []
  output: CapacityReservation
  side_effects: []
- method: GET
  path: /platform/view-grants/{id}
  description: Fetch one ViewGrant
  roles:
  - StreamOps
  - Viewer
  - RightsManager
  code: 200
  input: []
  output: ViewGrant
  side_effects: []
- method: GET
  path: /platform/ad-slots/{id}
  description: Fetch one AdSlot
  roles:
  - AdOps
  - RightsManager
  code: 200
  input: []
  output: AdSlot
  side_effects: []
- method: GET
  path: /platform/impressions/{id}
  description: Fetch one Impression
  roles:
  - AdOps
  code: 200
  input: []
  output: Impression
  side_effects: []
- method: GET
  path: /platform/promo-codes/{id}
  description: Fetch one PromoCode
  roles:
  - PartnerManager
  code: 200
  input: []
  output: PromoCode
  side_effects: []
- method: GET
  path: /platform/entitlements/{id}
  description: Fetch one Entitlement
  roles:
  - PartnerManager
  - Viewer
  code: 200
  input: []
  output: Entitlement
  side_effects: []
- method: GET
  path: /platform/replay-assets/{id}
  description: Fetch one ReplayAsset
  roles:
  - RightsManager
  - StreamOps
  - Viewer
  code: 200
  input: []
  output: ReplayAsset
  side_effects: []
- method: GET
  path: /platform/territory-rules/{id}
  description: Fetch one TerritoryRule
  roles:
  - RightsManager
  - StreamOps
  code: 200
  input: []
  output: TerritoryRule
  side_effects: []
errors:
- id: ERR_UNAUTHENTICATED
  http: 401
  condition: Missing or malformed auth headers
- id: ERR_FORBIDDEN
  http: 403
  condition: Role not permitted for endpoint
- id: ERR_NOT_FOUND
  http: 404
  condition: Referenced resource does not exist
- id: ERR_INVALID_REQUEST
  http: 400
  condition: Missing/unknown field, bad enum or datetime
- id: ERR_STALE_VERSION
  http: 412
  condition: OCC expected_*_version mismatch on parent
- id: ERR_INVALID_STATE
  http: 409
  condition: Transition not permitted from current state
- id: ERR_WINDOW_OUTSIDE_TERM
  http: 422
  condition: Window schedule falls outside property term
- id: ERR_RULE_WINDOW_INVALID
  http: 422
  condition: Territory rule interval invalid
- id: ERR_BLACKOUT_OVERLAP
  http: 409
  condition: BLACKOUT overlaps existing ACTIVE BLACKOUT for same window+region
- id: ERR_WINDOW_QUOTA_EXCEEDED
  http: 422
  condition: Property window quota for the rights_mode exhausted
- id: ERR_EXCLUSIVE_RATIO_BREACH
  http: 422
  condition: Adding a SIMULCAST window would breach minimum exclusive ratio
- id: ERR_BLACKOUT_REGION_BLOCKED
  http: 403
  condition: ACTIVE blackout covers viewer region now
- id: ERR_TERRITORY_NOT_LICENSED
  http: 403
  condition: Viewer region outside window territory_scope
- id: ERR_TIER_INSUFFICIENT
  http: 402
  condition: Viewer tier insufficient for exclusive live grant
- id: ERR_FREQUENCY_CAP_EXCEEDED
  http: 422
  condition: Campaign frequency cap reached for viewer in window
- id: ERR_CAPACITY_INSUFFICIENT
  http: 422
  condition: Pool cannot satisfy reservation units
- id: ERR_PROMO_QUOTA_EXHAUSTED
  http: 422
  condition: Partner promo code quota exhausted
- id: ERR_PROMO_INVALID
  http: 422
  condition: Promo code not redeemable (status, expiry, or duplicate bundle entitlement)
- id: ERR_POD_INFEASIBLE
  http: 422
  condition: Slot fill violates pod construction feasibility or region targeting
- id: ERR_GOLIVE_GATE_FAILED
  http: 409
  condition: Go-live capacity or local-break gate failed
- id: ERR_HOLD_EXPIRED
  http: 409
  condition: Reservation confirm attempted after hold expiry
- id: ERR_REPLAY_EXPIRED
  http: 409
  condition: Replay grant requested for EXPIRED/PULLED asset
roles:
- name: RightsManager
  description: Owns rights properties, streaming windows, territory rules, replay assets
  identity: opaque
  exclusive_operations:
  - POST /platform/properties and property lifecycle actions
  - POST /platform/windows and window lifecycle actions
  - POST /platform/territory-rules and lift
  - POST /platform/replay-assets/{id}/pull
  - GET /platform/reports/property-economics
  shared_operations:
  - GET reads of properties, windows, ad slots, replay assets
- name: AdOps
  description: Owns ad campaigns, ad slots, serves impressions
  identity: opaque
  exclusive_operations:
  - POST /platform/ad-campaigns and lifecycle actions
  - POST /platform/ad-slots and fill/release/mark-unfillable/serve
  - GET /platform/impressions
  shared_operations:
  - GET reads of properties and windows
- name: StreamOps
  description: Owns capacity pools and reservations; operates the logical clock endpoint
  identity: opaque
  exclusive_operations:
  - POST /platform/capacity-pools
  - POST /platform/capacity-reservations and confirm/release
  - POST /platform/_clock/set_current_utc
  shared_operations:
  - GET reads of windows, territory rules, replay assets
- name: PartnerManager
  description: Owns distribution partners, promo codes, viewer billing posture
  identity: opaque
  exclusive_operations:
  - POST /platform/partners and promo-codes issuance/revoke
  - POST /platform/viewers/{id}/reactivate and suspend-billing
  shared_operations:
  - GET reads of viewers, entitlements, properties
- name: Viewer
  description: Entity-backed end user; registers, requests view grants, redeems promo codes, cancels own subscription
  identity: entity_backed:Viewer
  exclusive_operations:
  - POST /platform/viewers (self-registration)
  - POST /platform/windows/{id}/view-grants (own grants only)
  - POST /platform/promo-codes/redeem (own viewer_id only)
  - POST /platform/viewers/{id}/cancel (self only)
  shared_operations:
  - GET reads of own viewer record, windows, replay assets
