              payload: { chamber_id: "${chg1_id}", recipe_id: "${rg_id}", cycle_code: "C-001", scheduled_start_at: "2026-11-04T00:00:00Z", scheduled_end_at: "2026-11-04T06:00:00Z" }
              as: CycleOperator
