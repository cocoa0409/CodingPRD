      - name: margin_band_derived_from_the_preliminary_net_not_the_final_net
        claim_type: constraint_propagation
        grounds:
          - calculations.channel_margin_resolution
        excluded_because:
          difficulty_instance: combinatorial_formula / channel_margin_band_pinned_to_preliminary_net
          rationale: "That instance pins the six-step order at the HIGH band and asserts the invoice that only the preliminary-net reading can produce."

      - name: mdf_match_rounds_each_proof_line_before_summation
        claim_type: precision
        grounds:
          - calculations.mdf_claim_approval
          - calculations.mdf_claim_approval.precision
        excluded_because:
          difficulty_instance: combinatorial_formula / mdf_claim_per_line_rounding_before_summation
          rationale: "That instance uses proof lines with odd half-cent matches so per-line rounding and sum-then-round differ by a cent, and asserts the per-line answer."

      - name: exclusivity_occupancy_is_half_open_on_the_end_instant
        claim_type: interval_merge
        grounds:
          - calculations.exclusivity_window
        excluded_because:
          difficulty_instance: boundary_precision_check / exclusivity_window_end_instant_is_exclusive_on_submit
          rationale: "That instance submits at exclusivity_end_at - 1ms and at exclusivity_end_at and asserts the rejection then the acceptance."

      - name: provisional_and_final_variants_diverge_on_the_same_rows
        claim_type: variant_divergence
        grounds:
          - calculations.partner_tier_scoring.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / provisional_vs_final_tier_divergence_on_performance_review
          rationale: "That instance builds a lapsing certification and a PENDING order so the two variants read the same rows and produce different tiers."

      - name: tier_reconciliation_applies_the_final_variant_at_decision
        claim_type: reconciliation
        grounds:
          - calculations.partner_tier_scoring.variants
          - state_machines.PerformanceReview.PREPARED_to_APPROVED
        excluded_because:
          difficulty_instance: dual_variant_calc / provisional_vs_final_tier_divergence_on_performance_review
          rationale: "The same instance asserts that partner.tier follows approved_tier from the FINAL variant and not recommended_tier from the PROVISIONAL one."

      - name: recommendation_ranks_claims_in_chronological_stake_order
        claim_type: chronological
        grounds:
          - calculations.conflict_recommendation
        excluded_because:
          difficulty_instance: dual_variant_calc / conflict_recommendation_variant_divergence_on_partner_vs_partner_case
          rationale: "That instance stakes the claims out of order so the chronological variant and the coverage variant disagree, and asserts both stored labels."

      - name: margin_conservation_holds_after_a_credit_memo
        claim_type: correct_result
        grounds:
          - calculations.channel_margin_conservation
        excluded_because:
          difficulty_instance: compensating_invariant / credit_memo_preserves_per_invoice_margin_conservation
          rationale: "That instance asserts list == invoice + margin and the recomputed margin_pct on both sides of the credit memo."

      - name: fund_conservation_holds_across_every_bucket_transfer
        claim_type: correct_result
        grounds:
          - calculations.mdf_fund_conservation
        excluded_because:
          difficulty_instance: compensating_invariant / claim_reject_restores_mdf_fund_bucket_conservation
          rationale: "That instance asserts allocated == available + committed + paid + expired before and after the clawback."

      - name: qualified_spend_only_counts_proofs_under_validated_claims
        claim_type: input_set_filtering
        grounds:
          - calculations.marketing_attainment
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_b_claim_clawback_to_marketing_probation_depth_four
          rationale: "That instance rejects a VALIDATED claim so its verified proof leaves the numerator, and asserts the attainment drop that follows."

  # =========================================================================
  # Table 4 - Validations
  # =========================================================================
  - section: validations
    instances:
      - name: platform_suite_certification_gate_is_conditional_on_product_line
        claim_type: conditional_validation
        grounds:
          - validations[priority=23]
          - errors[ERR_CERTIFICATION_REQUIREMENT_NOT_MET]
          - calculations.certification_credit_rollup.constants
        distinguishing_aspect: "With 6 credits from three TECH_ASSOCIATE records and no ACTIVE TECH_EXPERT, a PLATFORM_SUITE submit fails the priority-23 gate while an ANALYTICS_ADDON submit on the same account and partner succeeds - the rule fires on the product line, not on the credit total alone."
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00.000Z; one RESELLER partner with three TECH_ASSOCIATE certifications (cert_credit_total 6, still no TECH_EXPERT); one OPEN_CHANNEL account."
            - "Two DRAFT registrations on that account, one PLATFORM_SUITE and one ANALYTICS_ADDON (different product lines, so the priority-13 duplicate rule never fires)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
            - call: "POST /partners"
              payload: { company_name: "Aster Systems", partner_type: "RESELLER" }
