      - name: measure_surcharge_then_exclusion_recomputes_entry
        claim_type: input_set_filtering
        grounds: [calculations.entry_eligible_duty, entities.ImportEntry.fields.non_drawbackable_cents]
        distinguishing_aspect: "Per-measure rounding then sum, and the EXCLUSION filter: a SECTION_301 measure at 500 bps makes non_drawbackable 25000 (eligible 57500); adding an overlapping ACTIVE EXCLUSION removes SECTION_301 from the input set, restoring eligible to 82500."
