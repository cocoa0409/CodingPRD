  # =========================================================================
  # Cross-Cutting Complexity Layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_upgrade_stale_subscription_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[upgrade-stale-subscription]", endpoints, "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Upgrading with expected_subscription_version one less than the live version (subscription was cancelled to GRACE after the read) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Clock 2026-01-01; ACTIVE BASIC subscription whose version was bumped by a cancel after the client's read."]
          setup_api_calls:
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dna/accounts"
              payload: { email: "occ1@x.com", full_name: "OCC1" }
              as: PlatformAdmin
              captures: { acc: $.data.id }
            - call: "POST /dna/subscriptions"
              payload: { account_id: "${acc}", tier: "BASIC", annual_fee_cents: 9900 }
              as: Account
              as_user_id: "${acc}"
              captures: { sub: $.data.id, subv: $.data.version }
            - call: "POST /dna/subscriptions/${sub}/cancel"
              payload: {}
              as: Account
              as_user_id: "${acc}"
          trigger:
            - call: "POST /dna/subscriptions/${sub}/upgrade"
              payload: { expected_subscription_version: "${subv}" }
              as: Account
              as_user_id: "${acc}"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 412"
            - "error_id == ERR_STALE_VERSION (live version advanced past ${subv} via cancel; also state is GRACE not ACTIVE)"

      - name: occ_finalize_stale_report_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[finalize-stale-report]", endpoints, "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Finalizing a report with expected_report_version that predates a marker addition (which bumped report.version) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A PRELIMINARY BREED_HEALTH report whose version advanced after a marker was attached."]
          setup_api_calls:
            - call: "POST /dna/accounts"
              payload: { email: "occ2@x.com", full_name: "OCC2" }
              as: PlatformAdmin
              captures: { acc: $.data.id }
            - call: "POST /dna/pets"
              payload: { account_id: "${acc}", name: "Of", species: "DOG", birth_year: 2020 }
              as: Account
              as_user_id: "${acc}"
              captures: { pet: $.data.id }
            - call: "POST /dna/kits"
              payload: { account_id: "${acc}", product_tier: "BREED_HEALTH" }
              as: Account
              as_user_id: "${acc}"
              captures: { kit: $.data.id }
            - call: "POST /dna/kits/${kit}/activate"
              payload: { pet_id: "${pet}" }
              as: Account
              as_user_id: "${acc}"
            - call: "POST /dna/samples"
              payload: { kit_id: "${kit}" }
              as: LabTechnician
              captures: { samp: $.data.id }
            - call: "POST /dna/samples/${samp}/genotyping-runs"
              payload: { call_rate: 0.99, het_rate: 0.35, contamination: 0.01, breed_segments: [ { breed: "LABRADOR", match_cm: 1000 } ] }
              as: LabTechnician
            - call: "GET /dna/reports?sample_id=${samp}"
              payload: {}
              as: LabTechnician
              captures: { rep: "$.data[0].id", repv: "$.data[0].version" }
            - call: "POST /dna/reports/${rep}/markers"
              payload: { marker_code: "DM_SOD1", genotype: "CARRIER" }
              as: LabTechnician
          trigger:
            - call: "POST /dna/reports/${rep}/finalize"
              payload: { expected_report_version: "${repv}" }
              as: LabTechnician
              captures: { err: $.data.error_id }
          assert:
            - "response code == 412"
            - "error_id == ERR_STALE_VERSION (marker attach bumped report.version past ${repv})"

      - name: occ_upgrade_correct_version_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[upgrade-stale-subscription]", calculations.subscription_upgrade_proration]
        excluded_because:
          difficulty_instance: compensating_invariant / upgrade_proration_conserves_premium_fee_cents
          rationale: "The happy-path upgrade with correct version and prorated charge is asserted by the named §1.8 instance."

      - name: derived_pet_count_reconciled_on_pet_create
        claim_type: derived_field_reconciliation
        grounds: [entities.Account.fields.pet_count, endpoints]
        distinguishing_aspect: "Account.pet_count is recomputed to 2 after registering two pets; the denormalized count tracks live non-archived pets."
        test_recipe:
          setup: ["An account with no pets."]
          setup_api_calls:
            - call: "POST /dna/accounts"
