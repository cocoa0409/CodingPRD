              as_user_id: "${j1}"
              captures: { ck: $.data.id }
            - call: "POST /surveillance/cases/${ck}/interview"
              payload: {}
              as: CaseInvestigator
              as_user_id: "${j1}"
            - call: "POST /surveillance/cases/${ck}/classify"
              payload: { classification: "PROBABLE" }
              as: CaseInvestigator
              as_user_id: "${j1}"
            - call: "POST /surveillance/contacts"
