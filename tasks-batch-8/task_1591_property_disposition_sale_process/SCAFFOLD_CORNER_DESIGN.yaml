    instances:
      - name: engagement_window_end_before_start_returns_invalid_request
        claim_type: violation_to_error
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "window_end == window_start (empty interval) is a schema violation -> 400 ERR_INVALID_REQUEST before any overlap check runs."
        test_recipe:
          setup: ["Alpha asset exists"]
          setup_api_calls:
            - { call: "POST /disposition/assets", payload: { name: "Alpha", market: "Dallas", asset_type: OFFICE, noi_cents: 250000000, noi_growth_bps: 300, book_value_cents: 4000000000, guidance_price_cents: 5000000000, loan_balance_cents: 0, loan_rate_bps: 0, loan_maturity_date: null, monthly_debt_service_cents: 0, remaining_term_months: 0, prepayment_type: NONE, defeasance_allowed: false }, as: DispositionManager, captures: { a_id: $.data.id } }
          trigger:
            - { call: "POST /disposition/engagements", payload: { asset_id: "${a_id}", broker_firm_name: "BrokerCo", broker_user_id: "broker-1", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }, as: DispositionManager, as_user_id: dm-1, captures: { err: $.data.error_id } }
          assert:
            - "400 err == ERR_INVALID_REQUEST (window_end must be strictly after window_start)"

      - name: missing_auth_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "a call with no X-User-ID / X-User-Role headers is rejected 401 ERR_UNAUTHENTICATED before existence checks — even a bogus id cannot reach ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /disposition/assets/00000000-0000-0000-0000-000000000000", as: "", captures: { err: $.data.error_id } }
          assert:
            - "401 err == ERR_UNAUTHENTICATED (priority 1 auth beats priority 3 existence; note the id does not exist)"

      - name: priority_state_temporal_covered
        claim_type: priority_ordering
        grounds:
          - "validations[priority=6]"
          - "validations[priority=8]"
