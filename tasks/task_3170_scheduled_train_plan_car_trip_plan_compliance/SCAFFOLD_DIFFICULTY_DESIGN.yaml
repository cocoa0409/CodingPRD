  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_finalize
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - errors[ERR_DEPARTURE_NOT_FINALIZABLE]
          - errors[ERR_HOS_EXCEEDED]
        distinguishing_aspect: |
          state (priority 5) beats business_safety (priority 8): a departure
          already DEPARTED whose crew_hours_estimated is 12.5 fails BOTH the
          SCHEDULED-state precondition and the HOS gate; the returned error
          MUST be ERR_DEPARTURE_NOT_FINALIZABLE, never ERR_HOS_EXCEEDED.
        test_recipe:
          setup:
            - "Yards PP-A, PP-B; ACTIVE plan PP-P dep 2026-09-01T08:00:00Z TUE; pool PP-POOL with 2 CONDUCTOR crews; locomotive PP-L1 AVAILABLE at PP-A."
            - "Departure PP-D2 scheduled with crew_hours_estimated 12.5, then cancelled — its state leaves SCHEDULED while the HOS-violating estimate stays on the record."
            - "Clock at 2026-09-01T08:00:00Z (departure time reached, so only the two intended violations remain)."
          setup_api_calls:
            - call: "POST /rail/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T06:00:00Z" }
              as: NetworkPlanner
            - call: "POST /rail/yards"
              payload: { yard_code: "PP-A", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yA: $.data.id }
            - call: "POST /rail/yards"
              payload: { yard_code: "PP-B", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yB: $.data.id }
            - call: "POST /rail/train-plans"
              payload: { train_symbol: "PP-P", origin_yard_id: "${yA}", destination_yard_id: "${yB}", scheduled_departure_utc: "2026-09-01T08:00:00Z", cutoff_minutes: 60, frequency_mask: ["TUE"], route_distance_miles: 300, dwell_benchmark_hours: 10 }
              as: NetworkPlanner
              captures: { p: $.data.id, p_v: $.data.version }
            - call: "POST /rail/train-plans/${p}/activate"
              payload: { expected_train_plan_version: "${p_v}" }
              as: NetworkPlanner
            - call: "POST /rail/crew-pools"
              payload: { home_yard_id: "${yA}", craft: "CONDUCTOR", service_date: "2026-09-01", crews_available: 2 }
              as: CrewDispatcher
              captures: { pool: $.data.id }
            - call: "POST /rail/locomotives"
              payload: { unit_number: "PP-UP9501", current_yard_id: "${yA}", horsepower: 4400 }
              as: PowerPlanner
              captures: { l1: $.data.id }
            - call: "POST /rail/train-departures"
              payload: { train_plan_id: "${p}", service_date: "2026-09-01", crew_pool_id: "${pool}", locomotive_id: "${l1}", car_count_planned: 10, crew_hours_estimated: 12.5 }
              as: TerminalSuperintendent
              captures: { d2: $.data.id }
            - call: "POST /rail/train-departures/${d2}/cancel"
              payload: {}
              as: TerminalSuperintendent
            - call: "POST /rail/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: NetworkPlanner
          trigger:
            - call: "POST /rail/train-departures/${d2}/finalize"
              payload: {}
              as: TerminalSuperintendent
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DEPARTURE_NOT_FINALIZABLE (state priority 5) — NOT ERR_HOS_EXCEEDED (business_safety priority 8), even though crew_hours_estimated 12.5 > 12.0 also violates the HOS gate"
            - "TrainDeparture.${d2}.status == CANCELLED (unchanged by the rejected finalize)"

      - name: business_temporal_vs_business_referential_on_car_event
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_EVENT_SEQUENCE_INVALID]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          A DIFFERENT category pair: request-shape ERR_INVALID_REQUEST
          (priority 1 class) is checked before the business_temporal sequence
          rule ERR_EVENT_SEQUENCE_INVALID (priority 7) — posting a CarEvent
          with a negative car_count AND an occurred_at that mismatches the
          clock returns ERR_INVALID_REQUEST, while the same event with valid
          car_count but clock-mismatched occurred_at returns
          ERR_EVENT_SEQUENCE_INVALID.
        test_recipe:
          setup:
            - "Yards EV-A and EV-B; customer EV-CU; shipment EV-S (2 cars, EV-A -> EV-B) OPEN. Logical clock pinned at 2026-09-01T10:00:00Z."
            - "(A deliberate same-yard shipment attempt is rejected at creation with ERR_SAME_ORIGIN_DESTINATION, confirming the referential guard before the temporal test begins.)"
          setup_api_calls:
            - call: "POST /rail/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T10:00:00Z" }
              as: NetworkPlanner
            - call: "POST /rail/yards"
              payload: { yard_code: "EV-A", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yA: $.data.id }
            - call: "POST /rail/customers"
              payload: { customer_code: "EV-CU", name: "Event Shipper" }
              as: ServiceManager
              captures: { cu: $.data.id }
            - call: "POST /rail/shipments"
              payload: { customer_id: "${cu}", origin_yard_id: "${yA}", destination_yard_id: "${yA}", car_count: 2, first_mile_pickup_by: "2026-09-02T00:00:00Z", last_mile_delivery_by: "2026-09-05T00:00:00Z", committed_route_miles: 300 }
              as: ServiceManager
              captures: { bad_err: $.data.error_id }
            - call: "POST /rail/yards"
              payload: { yard_code: "EV-B", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yB: $.data.id }
            - call: "POST /rail/shipments"
              payload: { customer_id: "${cu}", origin_yard_id: "${yA}", destination_yard_id: "${yB}", car_count: 2, first_mile_pickup_by: "2026-09-02T00:00:00Z", last_mile_delivery_by: "2026-09-05T00:00:00Z", committed_route_miles: 300 }
              as: ServiceManager
              captures: { s: $.data.id }
          trigger:
            - call: "POST /rail/car-events"
              payload: { shipment_id: "${s}", yard_id: "${yA}", event_type: "YARD_ARRIVAL", occurred_at: "2026-09-01T11:00:00Z", car_count: -3 }
              as: TerminalSuperintendent
              captures: { err1: $.data.error_id }
            - call: "POST /rail/car-events"
              payload: { shipment_id: "${s}", yard_id: "${yA}", event_type: "YARD_ARRIVAL", occurred_at: "2026-09-01T11:00:00Z", car_count: 2 }
              as: TerminalSuperintendent
              captures: { err2: $.data.error_id }
          assert:
            - "first trigger: error_id == ERR_INVALID_REQUEST — car_count -3 violates the request-shape rule before any temporal logic runs"
            - "second trigger: error_id == ERR_EVENT_SEQUENCE_INVALID — valid shape, but occurred_at 11:00 != logical clock 10:00 (temporal sequence rule)"
            - "no CarEvent was persisted for shipment ${s} (GET /rail/shipments/${s}/car-events returns total_count 0)"

