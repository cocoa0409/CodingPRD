            - call: "POST /special-servicing/borrower-requests"
              payload: { loan_id: "${loan_id}", request_type: "LEASE_APPROVAL", processing_fee_deposit_usd: 5000, requested_terms_note: "anchor tenant, suite S-300, five year term", suite_code: "S-300", lease_commencement_date: "2027-01-01T00:00:00Z", lease_expiration_date: "2031-12-31T00:00:00Z", lease_base_rent_annual_usd: 480000 }
              as: Borrower
