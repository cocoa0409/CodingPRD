        claim_type: reconciliation
        excluded_because:
          difficulty_instance: project_readiness_intake_forecast_vs_gmp_audit_diverge
          rationale: "The §1.8 dual_variant_calc instance already asserts both readiness variants on identical data and the delta between the lenient forecast population and the effective-as-of-clock audit population."

      - name: committed_minute_aggregation_is_reversed_exactly
        claim_type: aggregation
        excluded_because:
          difficulty_instance: batch_cancellation_restores_component_unit_ledger_exactly
          rationale: "The §1.8 compensating_invariant instance already asserts the running committed_minutes and committed_demand_units totals after an add and after the reversal, with no residue."

      - name: excursion_risk_index_weight_composition
        claim_type: weighted_scoring
        excluded_because:
          difficulty_instance: em_excursion_risk_index_four_factor_interaction
          rationale: "The §1.8 combinatorial_formula instance already varies the ratio, grade weight, type surcharge and batch-exposure term together and asserts that the four factors compose non-linearly through the nested min/max."

      - name: component_demand_constants_and_rounding_order
        claim_type: constants_applied
        excluded_because:
          difficulty_instance: component_demand_per_line_rounding_then_sum
          rationale: "The §1.8 combinatorial_formula instance already asserts the BILL_OF_COMPONENTS, OVERAGE_PCT and PACK_SIZE constants and that per-line ceiling-then-sum yields a different integer from sum-then-ceiling."

      - name: forward_looking_provisional_units_use_the_historical_reject_rate
        claim_type: forward_looking
        excluded_because:
          difficulty_instance: batch_provisional_vs_final_releasable_units_diverge
          rationale: "The same §1.8 instance asserts that the forward-looking variant uses historical_reject_rate_ppm with a ceiling while the chronological variant ignores it entirely in favour of recorded VISUAL_INSPECTION rejects."

