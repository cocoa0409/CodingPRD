            - "${e_assign} == ERR_UNAUTHORIZED_ROLE with HTTP 403 - assignment is PropertyManager-exclusive and the technician who will do the work may not dispatch himself."
            - "${e_start} == ERR_UNAUTHORIZED_ROLE with HTTP 403 - starting work is MaintenanceTech-exclusive; the manager who assigned it cannot also record the labour."
            - "${e_assess} == ERR_UNAUTHORIZED_ROLE with HTTP 403 - only an EnvironmentalSpecialist grades hazard severity."
            - "${e_ack} == ERR_UNAUTHORIZED_ROLE with HTTP 403 - the Tenant Bill of Rights acknowledgment is ServiceMember-exclusive and the landlord may never sign it for the family."
            - "${e_decide} == ERR_UNAUTHORIZED_ROLE with HTTP 403 - the installation decision is InstallationHousingOffice-exclusive; note this is the ROLE rung (P2) firing, not the state rung, even though the dispute is UNDER_REVIEW rather than ESCALATED_INSTALLATION and not the SOD rung P31."
            - "${e_inst} == ERR_UNAUTHORIZED_ROLE with HTTP 403 - installation onboarding is PlatformAdmin-exclusive."
            - "${e_lease} == ERR_UNAUTHORIZED_ROLE with HTTP 403 - only the PropertyManager writes leases; the government housing office co-runs the offer cycle but does not sign the tenancy."
            - "${e_anon} == ERR_UNAUTHENTICATED with HTTP 401 - a request with no role header is refused by rung P1 BEFORE the role rung P2, so the missing-header case and the wrong-role case are distinguishable error ids on the same endpoint."
            - "${wo_status} == SUBMITTED and ${wo_assigned} == null - eight refused calls left the work order untouched."
            - "${dc_status} == UNDER_REVIEW and ${dc_rounds} == 0 - the refused decision advanced no round."
            - "${hz_status} == REPORTED - the refused assessment created no remediation work order and left the unit OCCUPIED rather than HAZARD_HOLD."

