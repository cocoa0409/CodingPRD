scaffold_corner_design:
  - section: entities
    instances:
      - name: distributor_create_applies_defaults
        claim_type: defaults
        grounds: [entities.Distributor.fields.status, entities.Distributor.fields.service_level_tier]
        distinguishing_aspect: "Omitting service_level_tier yields STANDARD, initial status PROSPECT, version 1; server-minted id is a bare UUID."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/distributors", payload: { code: "D1", name: "Dist One" }, as: BrandAdmin, captures: { d1: $.data.id } }
          assert:
            - "Distributor.${d1}.status == PROSPECT and service_level_tier == STANDARD and version == 1"

      - name: distributor_create_duplicate_code_rejected
        claim_type: type_constraints
        grounds: [entities.Distributor.fields.code, 'errors[ERR_DUPLICATE_CODE"]']
        distinguishing_aspect: "Second distributor with the same code is rejected; uniqueness is per entity type."
        test_recipe:
          setup: ["distributor D1 exists"]
          setup_api_calls:
            - { call: "POST /api/distributors", payload: { code: "D1", name: "Dist One" }, as: BrandAdmin }
          trigger:
            - { call: "POST /api/distributors", payload: { code: "D1", name: "Dist Clone" }, as: BrandAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_DUPLICATE_CODE (http 409)"

      - name: product_create_missing_required_base_price
        claim_type: required_fields
        grounds: [entities.Product.fields.base_price_cents, 'errors[ERR_VALIDATION"]']
        distinguishing_aspect: "Omitting required base_price_cents yields 400 ERR_VALIDATION before any existence check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/products", payload: { code: "P1", name: "Item", shelf_life_opened_hours: 72, shelf_life_unopened_days: 30, allergen_tags: [] }, as: BrandAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_VALIDATION"

      - name: account_review_unknown_id_returns_not_found
        claim_type: not_found
        grounds: ['errors[ERR_NOT_FOUND"]', 'validations[priority=5]']
        distinguishing_aspect: "A well-formed but unknown account id in the path resolves to 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/accounts/00000000-0000-0000-0000-000000000000/review", payload: { decision: "APPROVE" }, as: BrandAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND (http 404)"

      - name: promo_program_create_extra_field_rejected
        claim_type: computed_fields
        grounds: [entities.PromoProgram.fields.spent_cents, 'validations[priority=4"]']
        distinguishing_aspect: "Computed field spent_cents supplied as input is an unknown-field shape violation -> ERR_VALIDATION."
        test_recipe:
          setup: ["approved account A1 and product P1 under distributor D1"]
          setup_api_calls:
            - { call: "POST /api/distributors", payload: { code: "D1", name: "Dist One" }, as: BrandAdmin, captures: { d1: $.data.id } }
            - { call: "POST /api/territories", payload: { code: "T1", name: "North", region: "NE" }, as: BrandAdmin, captures: { t1: $.data.id, t1v: $.data.version } }
            - { call: "POST /api/territories/${t1}/grant", payload: { distributor_id: "${d1}", expected_territory_version: "${t1v}" }, as: BrandAdmin }
            - { call: "POST /api/products", payload: { code: "P1", name: "Item", base_price_cents: 1000, shelf_life_opened_hours: 72, shelf_life_unopened_days: 30, allergen_tags: [] }, as: BrandAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/accounts", payload: { name: "Store A", channel: "INDEPENDENT_GROCER", territory_id: "${t1}" }, as: DistributorRep, as_user_id: "${d1}", captures: { a1: $.data.id } }
            - { call: "POST /api/accounts/${a1}/review", payload: { decision: "APPROVE" }, as: BrandAdmin }
          trigger:
            - { call: "POST /api/promo-programs", payload: { account_id: "${a1}", product_id: "${p1}", promo_price_cents: 900, start_date: "2026-10-01", end_date: "2026-10-07", budget_cents: 40000, estimated_units: 10, spent_cents: 5 }, as: DistributorRep, as_user_id: "${d1}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_VALIDATION (computed field input rejected)"

      - name: orderline_immutable_shape_no_version
        claim_type: immutability
        grounds: [entities.OrderLine]
        distinguishing_aspect: "OrderLine has common_fields false: response carries id and created_at but no version/updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["distributor D1 ACTIVE; product P1"]
          setup_api_calls:
            - { call: "POST /api/distributors", payload: { code: "D1", name: "Dist One" }, as: BrandAdmin, captures: { d1: $.data.id } }
            - { call: "POST /api/territories", payload: { code: "T1", name: "North", region: "NE" }, as: BrandAdmin, captures: { t1: $.data.id, t1v: $.data.version } }
            - { call: "POST /api/territories/${t1}/grant", payload: { distributor_id: "${d1}", expected_territory_version: "${t1v}" }, as: BrandAdmin }
            - { call: "POST /api/products", payload: { code: "P1", name: "Item", base_price_cents: 500, shelf_life_opened_hours: 72, shelf_life_unopened_days: 30, allergen_tags: [] }, as: BrandAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/orders", payload: { delivery_week: "2026-09-07", lines: [ { product_id: "${p1}", qty_requested: 5 } ] }, as: DistributorRep, as_user_id: "${d1}", captures: { o1: $.data.id } }
          trigger:
            - { call: "GET /api/order-lines", payload: { order_id: "${o1}" }, as: DistributorRep, as_user_id: "${d1}" }
          assert:
            - "the line of order ${o1} has id and created_at, unit_price_cents == 500 snapshot, qty_allocated == 0, and no version or updated_at field"
            - "Order.${o1}.allocation_status == PENDING and fulfillment_status == UNSHIPPED (initial states)"

      - name: account_create_with_unknown_territory_returns_not_found
        claim_type: parent_relationships
        grounds: [entities.Account.fields.territory_id, 'errors[ERR_NOT_FOUND"]']
        distinguishing_aspect: "A body FK that does not resolve yields 404, not a business error."
        test_recipe:
          setup: ["distributor D1 ACTIVE"]
          setup_api_calls:
            - { call: "POST /api/distributors", payload: { code: "D1", name: "Dist One" }, as: BrandAdmin, captures: { d1: $.data.id } }
            - { call: "POST /api/territories", payload: { code: "T1", name: "North", region: "NE" }, as: BrandAdmin, captures: { t1: $.data.id, t1v: $.data.version } }
            - { call: "POST /api/territories/${t1}/grant", payload: { distributor_id: "${d1}", expected_territory_version: "${t1v}" }, as: BrandAdmin }
          trigger:
            - { call: "POST /api/accounts", payload: { name: "Store X", channel: "INDEPENDENT_GROCER", territory_id: "00000000-0000-0000-0000-000000000000" }, as: DistributorRep, as_user_id: "${d1}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: products_list_pagination_defaults_and_envelope
        claim_type: listing
        grounds: [response_envelope, 'endpoints["GET /products""]']
        distinguishing_aspect: "Default pagination is limit 10 / offset 0 with total_count and has_more; envelope carries meta.api_request_id and response_type array."
        test_recipe:
          setup: ["one product exists"]
          setup_api_calls:
            - { call: "POST /api/products", payload: { code: "P1", name: "Item", base_price_cents: 500, shelf_life_opened_hours: 72, shelf_life_unopened_days: 30, allergen_tags: [] }, as: BrandAdmin }
          trigger:
            - { call: "GET /api/products", payload: {}, as: BrandAdmin }
          assert:
            - "response meta.api_request_id present, response_type == array, data has 1 element"
            - "pagination: limit == 10, offset == 0, total_count == 1, has_more == false"

  - section: state_machines
    instances:
      - name: territory_grant_activates_prospect_distributor
        claim_type: side_effect_execution
        grounds: [state_machines.Distributor.PROSPECT_to_ACTIVE, state_machines.Territory.OPEN_to_GRANTED]
        distinguishing_aspect: "The grant transition itself flips the named distributor PROSPECT -> ACTIVE; no separate activation endpoint exists."
        test_recipe:
          setup: ["distributor D1 PROSPECT; territory T1 OPEN"]
          setup_api_calls:
            - { call: "POST /api/distributors", payload: { code: "D1", name: "Dist One" }, as: BrandAdmin, captures: { d1: $.data.id } }
            - { call: "POST /api/territories", payload: { code: "T1", name: "North", region: "NE" }, as: BrandAdmin, captures: { t1: $.data.id, t1v: $.data.version } }
          trigger:
            - { call: "POST /api/territories/${t1}/grant", payload: { distributor_id: "${d1}", expected_territory_version: "${t1v}" }, as: BrandAdmin }
          assert:
            - "Distributor.${d1}.status == ACTIVE after the grant"
            - "Territory.${t1}.status == GRANTED and granted_distributor_id == ${d1}"

      - name: account_approval_bubbles_requested_authorizations
        claim_type: side_effect_execution
        grounds: [state_machines.Account.UNDER_REVIEW_to_APPROVED, state_machines.AccountProductAuthorization.REQUESTED_to_AUTHORIZED]
        distinguishing_aspect: "Bubble-up: an authorization created while the account is UNDER_REVIEW flips to AUTHORIZED when the account is approved."
        test_recipe:
          setup: ["account A1 UNDER_REVIEW with authorization AUTH1 for product P1"]
          setup_api_calls:
            - { call: "POST /api/distributors", payload: { code: "D1", name: "Dist One" }, as: BrandAdmin, captures: { d1: $.data.id } }
            - { call: "POST /api/territories", payload: { code: "T1", name: "North", region: "NE" }, as: BrandAdmin, captures: { t1: $.data.id, t1v: $.data.version } }
            - { call: "POST /api/territories/${t1}/grant", payload: { distributor_id: "${d1}", expected_territory_version: "${t1v}" }, as: BrandAdmin }
            - { call: "POST /api/products", payload: { code: "P1", name: "Item", base_price_cents: 500, shelf_life_opened_hours: 72, shelf_life_unopened_days: 30, allergen_tags: [] }, as: BrandAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/accounts", payload: { name: "Store A", channel: "INDEPENDENT_GROCER", territory_id: "${t1}" }, as: DistributorRep, as_user_id: "${d1}", captures: { a1: $.data.id } }
            - { call: "POST /api/account-product-authorizations", payload: { account_id: "${a1}", product_id: "${p1}" }, as: BrandAdmin, captures: { auth1: $.data.id } }
          trigger:
            - { call: "POST /api/accounts/${a1}/review", payload: { decision: "APPROVE" }, as: BrandAdmin }
          assert:
            - "AccountProductAuthorization.${auth1}.status was REQUESTED before approval and == AUTHORIZED after"

      - name: revoked_authorization_rejects_further_transitions
        claim_type: terminal_state_lockdown
        grounds: [state_machines.AccountProductAuthorization, 'errors[ERR_ALREADY_TERMINAL"]']
        distinguishing_aspect: "REVOKED is terminal: a second revoke is rejected with ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["approved account A1 with AUTHORIZED authorization AUTH1"]
          setup_api_calls:
            - { call: "POST /api/distributors", payload: { code: "D1", name: "Dist One" }, as: BrandAdmin, captures: { d1: $.data.id } }
            - { call: "POST /api/territories", payload: { code: "T1", name: "North", region: "NE" }, as: BrandAdmin, captures: { t1: $.data.id, t1v: $.data.version } }
            - { call: "POST /api/territories/${t1}/grant", payload: { distributor_id: "${d1}", expected_territory_version: "${t1v}" }, as: BrandAdmin }
            - { call: "POST /api/products", payload: { code: "P1", name: "Item", base_price_cents: 500, shelf_life_opened_hours: 72, shelf_life_unopened_days: 30, allergen_tags: [] }, as: BrandAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/accounts", payload: { name: "Store A", channel: "INDEPENDENT_GROCER", territory_id: "${t1}" }, as: DistributorRep, as_user_id: "${d1}", captures: { a1: $.data.id } }
            - { call: "POST /api/accounts/${a1}/review", payload: { decision: "APPROVE" }, as: BrandAdmin }
            - { call: "POST /api/account-product-authorizations", payload: { account_id: "${a1}", product_id: "${p1}" }, as: BrandAdmin, captures: { auth1: $.data.id } }
            - { call: "POST /api/account-product-authorizations/${auth1}/revoke", payload: {}, as: BrandAdmin }
          trigger:
            - { call: "POST /api/account-product-authorizations/${auth1}/revoke", payload: {}, as: BrandAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_ALREADY_TERMINAL"

      - name: service_visit_rework_resubmit_cycle
        claim_type: valid_transition
        grounds: [state_machines.ServiceVisit.SUBMITTED_to_REWORK, state_machines.ServiceVisit.REWORK_to_SUBMITTED]
        distinguishing_aspect: "The cyclic rework loop REWORK -> SUBMITTED -> VERIFIED succeeds and updates the score on resubmission."
        test_recipe:
          setup: ["approved account A1; visit V1 scheduled"]
          setup_api_calls:
            - { call: "POST /api/distributors", payload: { code: "D1", name: "Dist One" }, as: BrandAdmin, captures: { d1: $.data.id } }
            - { call: "POST /api/territories", payload: { code: "T1", name: "North", region: "NE" }, as: BrandAdmin, captures: { t1: $.data.id, t1v: $.data.version } }
            - { call: "POST /api/territories/${t1}/grant", payload: { distributor_id: "${d1}", expected_territory_version: "${t1v}" }, as: BrandAdmin }
            - { call: "POST /api/accounts", payload: { name: "Store A", channel: "INDEPENDENT_GROCER", territory_id: "${t1}" }, as: DistributorRep, as_user_id: "${d1}", captures: { a1: $.data.id } }
            - { call: "POST /api/accounts/${a1}/review", payload: { decision: "APPROVE" }, as: BrandAdmin }
            - { call: "POST /api/service-visits", payload: { account_id: "${a1}", window_start: "2026-09-02T09:00:00Z", window_end: "2026-09-02T10:00:00Z" }, as: DistributorRep, as_user_id: "${d1}", captures: { v1: $.data.id } }
            - { call: "POST /api/service-visits/${v1}/submit", payload: { score: 70, rotation_compliant: false, slicer_presentation_ok: true }, as: DistributorRep, as_user_id: "${d1}" }
            - { call: "POST /api/service-visits/${v1}/review", payload: { verdict: "REWORK" }, as: SafetyOfficer }
          trigger:
            - { call: "POST /api/service-visits/${v1}/submit", payload: { score: 85, rotation_compliant: true, slicer_presentation_ok: true }, as: DistributorRep, as_user_id: "${d1}" }
            - { call: "POST /api/service-visits/${v1}/review", payload: { verdict: "VERIFY" }, as: SafetyOfficer }
          assert:
            - "ServiceVisit.${v1}.status == SUBMITTED after resubmit, then == VERIFIED after review"
            - "ServiceVisit.${v1}.score == 85 (resubmission overwrote 70)"

      - name: pull_already_pulled_log_is_terminal
        claim_type: invalid_transition
        grounds: [state_machines.OpenedProductLog, 'errors[ERR_ALREADY_TERMINAL"]']
        distinguishing_aspect: "Pulling an already PULLED_ON_TIME log is rejected; pull is not idempotent."
        test_recipe:
          setup: ["approved account A1, slicer S1, log G1 pulled on time"]
          setup_api_calls:
            - { call: "POST /api/distributors", payload: { code: "D1", name: "Dist One" }, as: BrandAdmin, captures: { d1: $.data.id } }
            - { call: "POST /api/territories", payload: { code: "T1", name: "North", region: "NE" }, as: BrandAdmin, captures: { t1: $.data.id, t1v: $.data.version } }
            - { call: "POST /api/territories/${t1}/grant", payload: { distributor_id: "${d1}", expected_territory_version: "${t1v}" }, as: BrandAdmin }
            - { call: "POST /api/products", payload: { code: "P1", name: "Item", base_price_cents: 500, shelf_life_opened_hours: 72, shelf_life_unopened_days: 30, allergen_tags: [] }, as: BrandAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/accounts", payload: { name: "Store A", channel: "INDEPENDENT_GROCER", territory_id: "${t1}" }, as: DistributorRep, as_user_id: "${d1}", captures: { a1: $.data.id } }
            - { call: "POST /api/accounts/${a1}/review", payload: { decision: "APPROVE" }, as: BrandAdmin }
            - { call: "POST /api/slicers", payload: { account_id: "${a1}", label: "S1" }, as: RetailManager, as_user_id: "${a1}", captures: { s1: $.data.id } }
            - { call: "POST /api/opened-product-logs", payload: { product_id: "${p1}", slicer_id: "${s1}", opened_at: "2026-09-01T00:00:00Z" }, as: RetailManager, as_user_id: "${a1}", captures: { g1: $.data.id } }
            - { call: "POST /api/opened-product-logs/${g1}/pull", payload: {}, as: RetailManager, as_user_id: "${a1}" }
          trigger:
            - { call: "POST /api/opened-product-logs/${g1}/pull", payload: {}, as: RetailManager, as_user_id: "${a1}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_ALREADY_TERMINAL"

      - name: closed_incident_rejects_all_transitions
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Incident, 'errors[ERR_ALREADY_TERMINAL"]']
        distinguishing_aspect: "CLOSED is terminal for Incident; any further transition call fails."
        test_recipe:
          setup: ["incident I1 REPORTED -> TRIAGED -> CLOSED (early false alarm)"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { code: "PL1", name: "Plant 1" }, as: BrandAdmin, captures: { pl1: $.data.id } }
            - { call: "POST /api/incidents", payload: { plant_id: "${pl1}", title: "Spoilage report", severity: "LOW", affected_run_ids: [] }, as: SafetyOfficer, captures: { i1: $.data.id } }
            - { call: "POST /api/incidents/${i1}/transition", payload: { to: "TRIAGED" }, as: SafetyOfficer }
            - { call: "POST /api/incidents/${i1}/transition", payload: { to: "CLOSED" }, as: SafetyOfficer }
          trigger:
            - { call: "POST /api/incidents/${i1}/transition", payload: { to: "TRIAGED" }, as: SafetyOfficer, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_ALREADY_TERMINAL"

      - name: rejected_account_is_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Account, 'errors[ERR_ALREADY_TERMINAL"]']
        distinguishing_aspect: "REJECTED accounts cannot be re-reviewed or approved."
        test_recipe:
          setup: ["account A1 rejected"]
          setup_api_calls:
            - { call: "POST /api/distributors", payload: { code: "D1", name: "Dist One" }, as: BrandAdmin, captures: { d1: $.data.id } }
            - { call: "POST /api/territories", payload: { code: "T1", name: "North", region: "NE" }, as: BrandAdmin, captures: { t1: $.data.id, t1v: $.data.version } }
            - { call: "POST /api/territories/${t1}/grant", payload: { distributor_id: "${d1}", expected_territory_version: "${t1v}" }, as: BrandAdmin }
            - { call: "POST /api/accounts", payload: { name: "Store A", channel: "INDEPENDENT_GROCER", territory_id: "${t1}" }, as: DistributorRep, as_user_id: "${d1}", captures: { a1: $.data.id } }
            - { call: "POST /api/accounts/${a1}/review", payload: { decision: "REJECT" }, as: BrandAdmin }
          trigger:
            - { call: "POST /api/accounts/${a1}/review", payload: { decision: "APPROVE" }, as: BrandAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_ALREADY_TERMINAL"

      - name: rejected_promo_cannot_settle
        claim_type: terminal_state_lockdown
        grounds: [state_machines.PromoProgram, 'errors[ERR_ALREADY_TERMINAL"]']
        distinguishing_aspect: "A REJECTED program is terminal; settle is rejected with ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["program PP1 rejected"]
          setup_api_calls:
            - { call: "POST /api/distributors", payload: { code: "D1", name: "Dist One" }, as: BrandAdmin, captures: { d1: $.data.id } }
            - { call: "POST /api/territories", payload: { code: "T1", name: "North", region: "NE" }, as: BrandAdmin, captures: { t1: $.data.id, t1v: $.data.version } }
            - { call: "POST /api/territories/${t1}/grant", payload: { distributor_id: "${d1}", expected_territory_version: "${t1v}" }, as: BrandAdmin }
            - { call: "POST /api/products", payload: { code: "P1", name: "Item", base_price_cents: 1000, shelf_life_opened_hours: 72, shelf_life_unopened_days: 30, allergen_tags: [] }, as: BrandAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/accounts", payload: { name: "Store A", channel: "INDEPENDENT_GROCER", territory_id: "${t1}" }, as: DistributorRep, as_user_id: "${d1}", captures: { a1: $.data.id } }
            - { call: "POST /api/accounts/${a1}/review", payload: { decision: "APPROVE" }, as: BrandAdmin }
            - { call: "POST /api/promo-programs", payload: { account_id: "${a1}", product_id: "${p1}", promo_price_cents: 900, start_date: "2026-10-01", end_date: "2026-10-07", budget_cents: 40000, estimated_units: 10 }, as: DistributorRep, as_user_id: "${d1}", captures: { pp1: $.data.id } }
            - { call: "POST /api/promo-programs/${pp1}/authorize", payload: { decision: "REJECT" }, as: BrandAdmin }
          trigger:
            - { call: "POST /api/promo-programs/${pp1}/settle", payload: { redemption_lines: [ { period: "2026-10-01", units: 5 } ] }, as: BrandAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_ALREADY_TERMINAL"

      - name: distributor_terminate_cascades_territory_and_orders
        claim_type: side_effect_execution
        grounds: [state_machines.Distributor.ACTIVE_to_TERMINATED, state_machines.Territory.GRANTED_to_REVOKED, state_machines.Order.ALLOCATED_to_CANCELLED]
        distinguishing_aspect: "Terminate cascades down: territory revoked, allocated order cancelled, and its 10 allocated lot units released back to available."
        test_recipe:
          setup: ["D1 ACTIVE holding T1; order O1 ALLOCATED 10 units from lot L (available 0 / allocated 10)"]
          setup_api_calls:
            - { call: "POST /api/distributors", payload: { code: "D1", name: "Dist One" }, as: BrandAdmin, captures: { d1: $.data.id } }
            - { call: "POST /api/territories", payload: { code: "T1", name: "North", region: "NE" }, as: BrandAdmin, captures: { t1: $.data.id, t1v: $.data.version } }
            - { call: "POST /api/territories/${t1}/grant", payload: { distributor_id: "${d1}", expected_territory_version: "${t1v}" }, as: BrandAdmin }
            - { call: "POST /api/products", payload: { code: "P1", name: "Item", base_price_cents: 500, shelf_life_opened_hours: 72, shelf_life_unopened_days: 30, allergen_tags: [] }, as: BrandAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/plants", payload: { code: "PL1", name: "Plant 1" }, as: BrandAdmin, captures: { pl1: $.data.id } }
            - { call: "POST /api/production-runs", payload: { plant_id: "${pl1}", line_code: "L1", product_id: "${p1}", window_start: "2026-09-01T06:00:00Z", window_end: "2026-09-01T12:00:00Z", capacity_units: 100, planned_units: 10 }, as: PlantScheduler, as_user_id: "${pl1}", captures: { r1: $.data.id } }
            - { call: "POST /api/production-runs/${r1}/complete", payload: { actual_units: 10, waste_units: 0 }, as: PlantScheduler, as_user_id: "${pl1}" }
            - { call: "POST /api/orders", payload: { delivery_week: "2026-09-07", lines: [ { product_id: "${p1}", qty_requested: 10 } ] }, as: DistributorRep, as_user_id: "${d1}", captures: { o1: $.data.id } }
