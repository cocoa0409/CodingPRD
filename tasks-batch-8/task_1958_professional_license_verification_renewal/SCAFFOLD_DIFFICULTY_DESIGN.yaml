# =============================================================================
# Task 1958 — Scaffold Difficulty Design (section 1.8 Test Targeting Index)
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: ce_progress_reported_vs_required_diverge
        grounds:
          - calculations.ce_progress_pct
          - calculations.ce_tally_cycle
          - calculations.ce_tally_rolling
          - entities.License.fields.ce_progress_reported_pct
          - entities.License.fields.ce_progress_required_pct
        distinguishing_aspect: |
          CE-domain dual variant on License/CEActivity: with the logical clock at
          2027-06-01, the cycle-anchored tally (30.0h since anchor 2026-01-01) and the
          rolling-365-day tally (15.0h) diverge on identical activity data, yielding
          reported 100.0 vs required 50.0 — a different entity domain (CE hours) than
          the reimbursement money variant.
        test_recipe:
          setup:
            - "RN license type (CE 30.0h/cycle, cycle 24mo, freq 180d, grace 45d)"
            - "STAFF_NURSE requires RN in CA; employee Nora holds RN-CA license issued 2026-01-01, expires 2027-06-30, verified ACTIVE at the default clock 2026-08-01"
            - "clock advanced to 2027-06-01; two VALIDATED activities of 15.0h each: 2026-03-01 (in cycle, outside rolling window) and 2026-09-01 (in both)"
          setup_api_calls:
            - call: "POST /licensing/license-types"
              payload: { code: "RN", name: "Registered Nurse", ce_hours_required_per_cycle: 30.0, cycle_length_months: 24, verification_frequency_days: 180, grace_period_days: 45, requires_exclusion_screening: true, reimbursement_mode: "RECEIPT_BASED", reimburse_full_up_to_cents: 200000, reimburse_half_up_to_cents: 500000, flat_schedule_amount_cents: 0, hard_claim_cap_cents: 500000 }
              as: ComplianceAdmin
              captures: { lt_rn: $.data.id }
            - call: "POST /licensing/role-requirements"
              payload: { role_code: "STAFF_NURSE", license_type_id: "${lt_rn}", state_code: "CA", is_required: true }
              as: ComplianceAdmin
            - call: "POST /licensing/employees"
              payload: { full_name: "Nora Nurse", work_email: "nora@example.com", role_code: "STAFF_NURSE" }
              as: HRPartner
              captures: { emp: $.data.id }
            - call: "POST /licensing/licenses"
              payload: { employee_id: "${emp}", license_type_id: "${lt_rn}", state_code: "CA", license_number: "RN-1001", issued_on: "2026-01-01", expires_on: "2027-06-30" }
              as: ComplianceOfficer
              captures: { lic: $.data.id }
            - call: "POST /licensing/licenses/${lic}/verify"
              payload: { verified_on: "2026-08-01", source: "STATE_BOARD_API", outcome: "VERIFIED" }
              as: ComplianceOfficer
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: ComplianceAdmin
            - call: "POST /licensing/licenses/${lic}/ce-activities"
              payload: { provider_name: "CEU Inc", activity_title: "Pharmacology", hours: 15.0, completed_on: "2026-03-01" }
              as: ComplianceOfficer
              captures: { ce1: $.data.id }
            - call: "POST /licensing/licenses/${lic}/ce-activities"
              payload: { provider_name: "CEU Inc", activity_title: "Ethics", hours: 15.0, completed_on: "2026-09-01" }
              as: ComplianceOfficer
              captures: { ce2: $.data.id }
            - call: "POST /licensing/ce-activities/${ce1}/validate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /licensing/ce-activities/${ce2}/validate"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "GET /licensing/licenses/${lic}"
              as: ComplianceOfficer
          assert:
            - "License.${lic}.cycle_ce_hours_validated == 30.0"
            - "License.${lic}.rolling_ce_hours_validated == 15.0"
            - "License.${lic}.ce_progress_reported_pct == 100.0"
            - "License.${lic}.ce_progress_required_pct == 50.0"

      - name: reimbursement_estimate_receipt_vs_flat
        grounds:
          - calculations.reimbursement_estimate
          - entities.LicenseType.fields.reimbursement_mode
          - entities.RenewalRequest.fields.estimated_reimbursable_cents
          - concurrency_rules[renewal-create-stale-license]
        distinguishing_aspect: |
          Money-domain dual variant on RenewalRequest: an identical 500000-cent claim
          estimates to 350000 under RN's RECEIPT_BASED tiers but 100000 under PE's
          FLAT_SCHEDULE — a different entity domain (reimbursement money) than the
          CE-hours variant.
        test_recipe:
          setup:
            - "RN type RECEIPT_BASED (full 200000, half 500000); PE type FLAT_SCHEDULE (flat 100000); both hard caps 500000"
            - "One employee holding an ACTIVE RN-CA license and an ACTIVE PE-CA license, both verified 2026-08-01"
          setup_api_calls:
            - call: "POST /licensing/license-types"
              payload: { code: "RN", name: "Registered Nurse", ce_hours_required_per_cycle: 30.0, cycle_length_months: 24, verification_frequency_days: 180, grace_period_days: 45, requires_exclusion_screening: true, reimbursement_mode: "RECEIPT_BASED", reimburse_full_up_to_cents: 200000, reimburse_half_up_to_cents: 500000, flat_schedule_amount_cents: 0, hard_claim_cap_cents: 500000 }
              as: ComplianceAdmin
              captures: { lt_rn: $.data.id }
            - call: "POST /licensing/license-types"
              payload: { code: "PE", name: "Professional Engineer", ce_hours_required_per_cycle: 0, cycle_length_months: 24, verification_frequency_days: 365, grace_period_days: 30, requires_exclusion_screening: false, reimbursement_mode: "FLAT_SCHEDULE", reimburse_full_up_to_cents: 0, reimburse_half_up_to_cents: 0, flat_schedule_amount_cents: 100000, hard_claim_cap_cents: 500000 }
              as: ComplianceAdmin
              captures: { lt_pe: $.data.id }
            - call: "POST /licensing/employees"
              payload: { full_name: "Eric Engineer", work_email: "eric@example.com", role_code: "FIELD_ENGINEER" }
              as: HRPartner
              captures: { emp: $.data.id }
            - call: "POST /licensing/licenses"
              payload: { employee_id: "${emp}", license_type_id: "${lt_rn}", state_code: "CA", license_number: "RN-4001", issued_on: "2026-01-01", expires_on: "2027-06-30" }
              as: ComplianceOfficer
              captures: { lic_rn: $.data.id }
            - call: "POST /licensing/licenses/${lic_rn}/verify"
              payload: { verified_on: "2026-08-01", source: "STATE_BOARD_API", outcome: "VERIFIED" }
              as: ComplianceOfficer
              captures: { rn_v: $.data.version }
            - call: "POST /licensing/licenses"
              payload: { employee_id: "${emp}", license_type_id: "${lt_pe}", state_code: "CA", license_number: "PE-4001", issued_on: "2026-01-01", expires_on: "2027-06-30" }
              as: ComplianceOfficer
              captures: { lic_pe: $.data.id }
            - call: "POST /licensing/licenses/${lic_pe}/verify"
              payload: { verified_on: "2026-08-01", source: "MANUAL_UPLOAD", outcome: "VERIFIED" }
              as: ComplianceOfficer
              captures: { pe_v: $.data.version }
          trigger:
            - call: "POST /licensing/licenses/${lic_rn}/renewal-requests"
              payload: { claimed_amount_cents: 500000, expected_license_version: "${rn_v}" }
              as: ComplianceOfficer
              captures: { rr_rn_est: $.data.estimated_reimbursable_cents }
            - call: "POST /licensing/licenses/${lic_pe}/renewal-requests"
              payload: { claimed_amount_cents: 500000, expected_license_version: "${pe_v}" }
              as: ComplianceOfficer
              captures: { rr_pe_est: $.data.estimated_reimbursable_cents }
          assert:
            - "rr_rn_est == 350000"
            - "rr_pe_est == 100000"
            - "rr_rn_est != rr_pe_est for the identical 500000-cent claim"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: reimbursement_tiered_estimate_with_paid_cap_waterfall
        grounds:
          - calculations.reimbursement_estimate
          - calculations.reimbursement_approval
          - entities.Employee.fields.reimbursement_paid_cents
        distinguishing_aspect: |
          Mode (a) combinatorial: estimate = min(claim, tier1 + 0.5*tier2 portion) with
          a mode branch, then approval = min(estimate, paid-cap remainder) — four inputs
          with nested min/max interacting across requests through the paid accumulator;
          three 350000-capable claims saturate the 1000000 employer cap and a fourth
          approves at exactly 0.
        test_recipe:
          setup:
            - "RN type RECEIPT_BASED (full 200000, half 500000, cap 500000); employee with ACTIVE RN-CA license (verified 2026-08-01, expires 2027-06-30)"
            - "License version advances by 1 per renewal-request creation; fresh version re-read before each create"
          setup_api_calls:
            - call: "POST /licensing/license-types"
              payload: { code: "RN", name: "Registered Nurse", ce_hours_required_per_cycle: 30.0, cycle_length_months: 24, verification_frequency_days: 180, grace_period_days: 45, requires_exclusion_screening: true, reimbursement_mode: "RECEIPT_BASED", reimburse_full_up_to_cents: 200000, reimburse_half_up_to_cents: 500000, flat_schedule_amount_cents: 0, hard_claim_cap_cents: 500000 }
              as: ComplianceAdmin
              captures: { lt_rn: $.data.id }
            - call: "POST /licensing/employees"
              payload: { full_name: "Nora Nurse", work_email: "nora.tier@example.com", role_code: "STAFF_NURSE" }
              as: HRPartner
              captures: { emp: $.data.id }
            - call: "POST /licensing/licenses"
              payload: { employee_id: "${emp}", license_type_id: "${lt_rn}", state_code: "CA", license_number: "RN-5001", issued_on: "2026-01-01", expires_on: "2027-06-30" }
              as: ComplianceOfficer
              captures: { lic: $.data.id }
            - call: "POST /licensing/licenses/${lic}/verify"
              payload: { verified_on: "2026-08-01", source: "STATE_BOARD_API", outcome: "VERIFIED" }
              as: ComplianceOfficer
              captures: { lic_v: $.data.version }
            - call: "POST /licensing/licenses/${lic}/renewal-requests"
              payload: { claimed_amount_cents: 400000, expected_license_version: "${lic_v}" }
              as: ComplianceOfficer
              captures: { rr1: $.data.id }
            - call: "POST /licensing/renewal-requests/${rr1}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /licensing/renewal-requests/${rr1}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-2"
              captures: { rr1_approved: $.data.approved_amount_cents }
            - call: "POST /licensing/renewal-requests/${rr1}/mark-paid"
              payload: { payment_ref: "PAY-1" }
              as: HRPartner
            - call: "GET /licensing/licenses/${lic}"
              as: ComplianceOfficer
              captures: { lic_v2: $.data.version }
            - call: "POST /licensing/licenses/${lic}/renewal-requests"
              payload: { claimed_amount_cents: 500000, expected_license_version: "${lic_v2}" }
              as: ComplianceOfficer
              captures: { rr2: $.data.id }
            - call: "POST /licensing/renewal-requests/${rr2}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /licensing/renewal-requests/${rr2}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-2"
              captures: { rr2_approved: $.data.approved_amount_cents }
            - call: "POST /licensing/renewal-requests/${rr2}/mark-paid"
              payload: { payment_ref: "PAY-2" }
              as: HRPartner
            - call: "GET /licensing/licenses/${lic}"
              as: ComplianceOfficer
              captures: { lic_v3: $.data.version }
            - call: "POST /licensing/licenses/${lic}/renewal-requests"
              payload: { claimed_amount_cents: 500000, expected_license_version: "${lic_v3}" }
              as: ComplianceOfficer
              captures: { rr3: $.data.id }
            - call: "POST /licensing/renewal-requests/${rr3}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /licensing/renewal-requests/${rr3}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-2"
              captures: { rr3_approved: $.data.approved_amount_cents }
            - call: "POST /licensing/renewal-requests/${rr3}/mark-paid"
              payload: { payment_ref: "PAY-3" }
              as: HRPartner
            - call: "GET /licensing/licenses/${lic}"
              as: ComplianceOfficer
              captures: { lic_v4: $.data.version }
            - call: "POST /licensing/licenses/${lic}/renewal-requests"
              payload: { claimed_amount_cents: 500000, expected_license_version: "${lic_v4}" }
              as: ComplianceOfficer
              captures: { rr4: $.data.id, rr4_est: $.data.estimated_reimbursable_cents }
            - call: "POST /licensing/renewal-requests/${rr4}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /licensing/renewal-requests/${rr4}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-2"
              captures: { rr4_approved: $.data.approved_amount_cents }
            - call: "GET /licensing/employees/${emp}"
              as: ComplianceOfficer
              captures: { emp_paid: $.data.reimbursement_paid_cents, emp_committed: $.data.reimbursement_committed_cents }
          assert:
            - "rr1_approved == 300000  (est min(400000, 200000 + 0.5*200000) = 300000, cap remainder 1000000)"
            - "rr2_approved == 350000  (est 350000, remainder 700000)"
            - "rr3_approved == 350000  (est 350000, remainder 350000 — exact cap landing)"
            - "rr4_est == 350000"
            - "rr4_approved == 0  (paid-cap remainder exhausted)"
            - "emp_paid == 1000000"
            - "emp_committed == 0  (500000 claim released in full at approval)"

      - name: ce_per_activity_rounding_order_pinned
        grounds:
          - calculations.ce_rounding
          - calculations.ce_tally_cycle
          - entities.CEActivity.fields.rounded_hours
        distinguishing_aspect: |
          Mode (b) combinatorial: rounding order is pinned per-activity-then-sum — two
          0.74h activities tally 1.0 (0.5 + 0.5); the forbidden sum-then-round order
          would yield 1.5. Different mode than the tiered/waterfall formula instance.
        test_recipe:
          setup:
            - "RN type (CE 30.0/cycle); employee with ACTIVE RN-CA license (issued 2026-01-01, expires 2027-06-30, verified 2026-08-01)"
            - "Two CE activities of raw 0.74 hours each, completed 2026-03-01, both VALIDATED"
          setup_api_calls:
            - call: "POST /licensing/license-types"
              payload: { code: "RN", name: "Registered Nurse", ce_hours_required_per_cycle: 30.0, cycle_length_months: 24, verification_frequency_days: 180, grace_period_days: 45, requires_exclusion_screening: true, reimbursement_mode: "RECEIPT_BASED", reimburse_full_up_to_cents: 200000, reimburse_half_up_to_cents: 500000, flat_schedule_amount_cents: 0, hard_claim_cap_cents: 500000 }
              as: ComplianceAdmin
              captures: { lt_rn: $.data.id }
            - call: "POST /licensing/employees"
              payload: { full_name: "Nora Nurse", work_email: "nora.round@example.com", role_code: "STAFF_NURSE" }
              as: HRPartner
              captures: { emp: $.data.id }
            - call: "POST /licensing/licenses"
              payload: { employee_id: "${emp}", license_type_id: "${lt_rn}", state_code: "CA", license_number: "RN-6001", issued_on: "2026-01-01", expires_on: "2027-06-30" }
              as: ComplianceOfficer
              captures: { lic: $.data.id }
            - call: "POST /licensing/licenses/${lic}/verify"
              payload: { verified_on: "2026-08-01", source: "STATE_BOARD_API", outcome: "VERIFIED" }
              as: ComplianceOfficer
            - call: "POST /licensing/licenses/${lic}/ce-activities"
              payload: { provider_name: "CEU Inc", activity_title: "Refresher A", hours: 0.74, completed_on: "2026-03-01" }
              as: ComplianceOfficer
              captures: { ce1: $.data.id, ce1_rounded: $.data.rounded_hours }
            - call: "POST /licensing/licenses/${lic}/ce-activities"
              payload: { provider_name: "CEU Inc", activity_title: "Refresher B", hours: 0.74, completed_on: "2026-03-01" }
              as: ComplianceOfficer
              captures: { ce2: $.data.id, ce2_rounded: $.data.rounded_hours }
            - call: "POST /licensing/ce-activities/${ce1}/validate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /licensing/ce-activities/${ce2}/validate"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "GET /licensing/licenses/${lic}"
              as: ComplianceOfficer
              captures: { cycle_total: $.data.cycle_ce_hours_validated }
          assert:
            - "ce1_rounded == 0.5  (round_half_up(0.74 * 2) / 2 = round_half_up(1.48) / 2 = 0.5)"
            - "ce2_rounded == 0.5"
            - "cycle_total == 1.0  (per-activity rounding then sum; sum-then-round would give 1.5)"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: license_cyclic_reinstatement_loop
        grounds:
          - state_machines.License.ACTIVE_to_EXPIRED
          - state_machines.License.EXPIRED_to_LAPSED
          - state_machines.License.LAPSED_to_ACTIVE
          - calculations.license_expiry_sweep
        distinguishing_aspect: |
          Cyclic machine on License: two system auto-transitions (ACTIVE->EXPIRED->LAPSED)
          then a CE-gated reinstatement loop LAPSED->ACTIVE that re-anchors the CE cycle
          and extends expiry — a cycle, on a different entity than the RenewalRequest
          fork-join diamond.
        test_recipe:
          setup:
            - "RN type (CE 30.0, grace 45d); STAFF_NURSE requires RN-CA; employee holds RN-CA license issued 2026-01-01, expires 2026-12-31, verified ACTIVE 2026-08-01"
            - "30.0 VALIDATED cycle CE hours (10.25->10.5, 10.25->10.5, 9.0->9.0)"
            - "clock at 2027-01-05: license EXPIRED (in grace); clock at 2027-03-01: license LAPSED, holder RESTRICTED/LICENSE_LAPSED"
          setup_api_calls:
            - call: "POST /licensing/license-types"
              payload: { code: "RN", name: "Registered Nurse", ce_hours_required_per_cycle: 30.0, cycle_length_months: 24, verification_frequency_days: 180, grace_period_days: 45, requires_exclusion_screening: true, reimbursement_mode: "RECEIPT_BASED", reimburse_full_up_to_cents: 200000, reimburse_half_up_to_cents: 500000, flat_schedule_amount_cents: 0, hard_claim_cap_cents: 500000 }
              as: ComplianceAdmin
              captures: { lt_rn: $.data.id }
            - call: "POST /licensing/role-requirements"
              payload: { role_code: "STAFF_NURSE", license_type_id: "${lt_rn}", state_code: "CA", is_required: true }
              as: ComplianceAdmin
            - call: "POST /licensing/employees"
              payload: { full_name: "Nora Nurse", work_email: "nora.cycle@example.com", role_code: "STAFF_NURSE" }
              as: HRPartner
              captures: { emp: $.data.id }
            - call: "POST /licensing/licenses"
              payload: { employee_id: "${emp}", license_type_id: "${lt_rn}", state_code: "CA", license_number: "RN-2001", issued_on: "2026-01-01", expires_on: "2026-12-31" }
              as: ComplianceOfficer
              captures: { lic: $.data.id }
            - call: "POST /licensing/licenses/${lic}/verify"
              payload: { verified_on: "2026-08-01", source: "STATE_BOARD_API", outcome: "VERIFIED" }
              as: ComplianceOfficer
            - call: "POST /licensing/licenses/${lic}/ce-activities"
              payload: { provider_name: "CEU Inc", activity_title: "Course A", hours: 10.25, completed_on: "2026-06-01" }
              as: ComplianceOfficer
              captures: { ce1: $.data.id }
            - call: "POST /licensing/licenses/${lic}/ce-activities"
              payload: { provider_name: "CEU Inc", activity_title: "Course B", hours: 10.25, completed_on: "2026-06-01" }
              as: ComplianceOfficer
              captures: { ce2: $.data.id }
            - call: "POST /licensing/licenses/${lic}/ce-activities"
              payload: { provider_name: "CEU Inc", activity_title: "Course C", hours: 9.0, completed_on: "2026-06-01" }
              as: ComplianceOfficer
              captures: { ce3: $.data.id }
            - call: "POST /licensing/ce-activities/${ce1}/validate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /licensing/ce-activities/${ce2}/validate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /licensing/ce-activities/${ce3}/validate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ComplianceAdmin
            - call: "GET /licensing/licenses/${lic}"
              as: ComplianceOfficer
              captures: { st_expired: $.data.status }
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: ComplianceAdmin
            - call: "GET /licensing/licenses/${lic}"
              as: ComplianceOfficer
              captures: { st_lapsed: $.data.status }
            - call: "GET /licensing/employees/${emp}"
              as: ComplianceOfficer
              captures: { emp_wr: $.data.work_authorization, emp_rr: $.data.restriction_reason }
          trigger:
            - call: "POST /licensing/licenses/${lic}/verify"
              payload: { verified_on: "2027-03-01", source: "STATE_BOARD_API", outcome: "VERIFIED" }
              as: ComplianceOfficer
              captures: { st_after: $.data.status, exp_after: $.data.expires_on, anchor_after: $.data.ce_cycle_anchor_on, cycle_after: $.data.cycle_ce_hours_validated }
            - call: "GET /licensing/employees/${emp}"
              as: ComplianceOfficer
              captures: { emp_wr_after: $.data.work_authorization, emp_rr_after: $.data.restriction_reason }
          assert:
            - "st_expired == \"EXPIRED\"  (clock 2027-01-05 > expires_on 2026-12-31, within grace)"
            - "st_lapsed == \"LAPSED\"  (clock 2027-03-01 > expires_on + 45d = 2027-02-14)"
            - "emp_wr == \"RESTRICTED\" and emp_rr == \"LICENSE_LAPSED\""
            - "st_after == \"ACTIVE\"  (cyclic reinstatement)"
            - "exp_after == \"2028-02-29\"  (2027-03-01 + 365 days)"
            - "anchor_after == \"2027-03-01\" and cycle_after == 0.0  (cycle window re-anchored)"
            - "emp_wr_after == \"AUTHORIZED\" and emp_rr_after == null"

      - name: renewal_request_diamond_with_info_loop
        grounds:
          - state_machines.RenewalRequest.DRAFT_to_SUBMITTED
          - state_machines.RenewalRequest.SUBMITTED_to_MORE_INFO
          - state_machines.RenewalRequest.MORE_INFO_to_SUBMITTED
          - state_machines.RenewalRequest.SUBMITTED_to_APPROVED
          - state_machines.RenewalRequest.APPROVED_to_PAID
        distinguishing_aspect: |
          Fork-join diamond with a revert loop on RenewalRequest: DRAFT->SUBMITTED forks
          to MORE_INFO (loop back to SUBMITTED) or APPROVED->PAID, with divergent money
          side effects per branch — a different entity than the License cycle.
        test_recipe:
          setup:
            - "RN type (full 200000, half 500000); employee Nora with ACTIVE RN-CA license (expires 2027-06-30)"
            - "Renewal request claiming 300000 (est 250000) walked DRAFT->SUBMITTED->MORE_INFO->SUBMITTED->APPROVED->PAID"
          setup_api_calls:
            - call: "POST /licensing/license-types"
              payload: { code: "RN", name: "Registered Nurse", ce_hours_required_per_cycle: 30.0, cycle_length_months: 24, verification_frequency_days: 180, grace_period_days: 45, requires_exclusion_screening: true, reimbursement_mode: "RECEIPT_BASED", reimburse_full_up_to_cents: 200000, reimburse_half_up_to_cents: 500000, flat_schedule_amount_cents: 0, hard_claim_cap_cents: 500000 }
              as: ComplianceAdmin
              captures: { lt_rn: $.data.id }
            - call: "POST /licensing/employees"
              payload: { full_name: "Nora Nurse", work_email: "nora.diamond@example.com", role_code: "STAFF_NURSE" }
              as: HRPartner
              captures: { emp: $.data.id }
            - call: "POST /licensing/licenses"
              payload: { employee_id: "${emp}", license_type_id: "${lt_rn}", state_code: "CA", license_number: "RN-7001", issued_on: "2026-01-01", expires_on: "2027-06-30" }
              as: ComplianceOfficer
              captures: { lic: $.data.id }
            - call: "POST /licensing/licenses/${lic}/verify"
              payload: { verified_on: "2026-08-01", source: "STATE_BOARD_API", outcome: "VERIFIED" }
              as: ComplianceOfficer
              captures: { lic_v: $.data.version }
            - call: "POST /licensing/licenses/${lic}/renewal-requests"
              payload: { claimed_amount_cents: 300000, expected_license_version: "${lic_v}" }
              as: Employee
              as_user_id: "${emp}"
              captures: { rr: $.data.id, rr_est: $.data.estimated_reimbursable_cents }
          trigger:
            - call: "POST /licensing/renewal-requests/${rr}/submit"
              payload: {}
              as: Employee
              as_user_id: "${emp}"
              captures: { s1: $.data.status }
            - call: "GET /licensing/employees/${emp}"
              as: ComplianceOfficer
              captures: { committed_submitted: $.data.reimbursement_committed_cents }
            - call: "POST /licensing/renewal-requests/${rr}/request-info"
              payload: { info_note: "Attach receipt page 2" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { s2: $.data.status }
            - call: "GET /licensing/employees/${emp}"
              as: ComplianceOfficer
              captures: { committed_moreinfo: $.data.reimbursement_committed_cents }
            - call: "POST /licensing/renewal-requests/${rr}/submit"
              payload: {}
              as: Employee
              as_user_id: "${emp}"
              captures: { s3: $.data.status }
            - call: "POST /licensing/renewal-requests/${rr}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { s4: $.data.status, approved: $.data.approved_amount_cents }
            - call: "POST /licensing/renewal-requests/${rr}/mark-paid"
              payload: { payment_ref: "PAY-D" }
              as: HRPartner
              captures: { s5: $.data.status }
            - call: "GET /licensing/employees/${emp}"
              as: ComplianceOfficer
              captures: { committed_final: $.data.reimbursement_committed_cents, paid_final: $.data.reimbursement_paid_cents }
          assert:
            - "rr_est == 250000  (200000 + 0.5 * (300000 - 200000))"
            - "s1 == \"SUBMITTED\" and committed_submitted == 300000"
            - "s2 == \"MORE_INFO\" and committed_moreinfo == 300000  (info loop holds the commitment)"
            - "s3 == \"SUBMITTED\"  (loop branch re-joins)"
            - "s4 == \"APPROVED\" and approved == 250000"
            - "s5 == \"PAID\""
            - "committed_final == 0 and paid_final == 250000"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: disciplinary_confirm_cascades_license_to_employee
        grounds:
          - state_machines.DisciplinaryEvent.RECEIVED_to_CONFIRMED
          - state_machines.License.ACTIVE_to_SUSPENDED
          - calculations.employee_restriction
        distinguishing_aspect: |
          Depth-3 transitive chain DisciplinaryEvent -> License -> Employee triggered by
          the confirm transition: each link is caused by the previous link's mutation,
          not by the original call; different origin than the clock-sweep cascade.
        test_recipe:
          setup:
            - "RN type; STAFF_NURSE requires RN-CA; employee verified ACTIVE on RN-CA (expires 2027-06-30), currently AUTHORIZED"
            - "SUSPENSION disciplinary event recorded by officer-1, still RECEIVED"
          setup_api_calls:
            - call: "POST /licensing/license-types"
              payload: { code: "RN", name: "Registered Nurse", ce_hours_required_per_cycle: 30.0, cycle_length_months: 24, verification_frequency_days: 180, grace_period_days: 45, requires_exclusion_screening: true, reimbursement_mode: "RECEIPT_BASED", reimburse_full_up_to_cents: 200000, reimburse_half_up_to_cents: 500000, flat_schedule_amount_cents: 0, hard_claim_cap_cents: 500000 }
              as: ComplianceAdmin
              captures: { lt_rn: $.data.id }
            - call: "POST /licensing/role-requirements"
              payload: { role_code: "STAFF_NURSE", license_type_id: "${lt_rn}", state_code: "CA", is_required: true }
              as: ComplianceAdmin
            - call: "POST /licensing/employees"
              payload: { full_name: "Nora Nurse", work_email: "nora.cascade@example.com", role_code: "STAFF_NURSE" }
              as: HRPartner
              captures: { emp: $.data.id }
            - call: "POST /licensing/licenses"
              payload: { employee_id: "${emp}", license_type_id: "${lt_rn}", state_code: "CA", license_number: "RN-8001", issued_on: "2026-01-01", expires_on: "2027-06-30" }
              as: ComplianceOfficer
              captures: { lic: $.data.id }
            - call: "POST /licensing/licenses/${lic}/verify"
              payload: { verified_on: "2026-08-01", source: "STATE_BOARD_API", outcome: "VERIFIED" }
              as: ComplianceOfficer
            - call: "POST /licensing/licenses/${lic}/disciplinary-events"
              payload: { board_case_number: "B-1", event_type: "SUSPENSION", effective_on: "2026-08-01", received_via: "BOARD_FEED" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { de: $.data.id }
          trigger:
            - call: "POST /licensing/disciplinary-events/${de}/confirm"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-2"
              captures: { de_status: $.data.status }
            - call: "GET /licensing/licenses/${lic}"
              as: ComplianceOfficer
              captures: { lic_status: $.data.status, lic_v: $.data.version }
            - call: "GET /licensing/employees/${emp}"
              as: ComplianceOfficer
              captures: { emp_wr: $.data.work_authorization, emp_rr: $.data.restriction_reason, emp_v: $.data.version }
          assert:
            - "de_status == \"CONFIRMED\""
            - "lic_status == \"SUSPENDED\" and lic_v == 3  (create 1, verify 2, suspension cascade 3)"
            - "emp_wr == \"RESTRICTED\" and emp_rr == \"LICENSE_SUSPENDED\""
            - "emp_v == 3  (create 1, verify-driven recompute 2, suspension cascade 3)"

      - name: clock_sweep_lapse_cascades_to_employee
        grounds:
          - state_machines.License.EXPIRED_to_LAPSED
          - calculations.license_expiry_sweep
          - calculations.employee_restriction
        distinguishing_aspect: |
          Depth-2 transitive chain License -> Employee triggered by the clock sweep (a
          different origin than the disciplinary confirm): EXPIRED->LAPSED on the license
          itself triggers the holder's restriction recompute.
        test_recipe:
          setup:
            - "RN type (grace 45d); STAFF_NURSE requires RN-CA; employee verified ACTIVE on RN-CA (expires 2026-12-31)"
          setup_api_calls:
            - call: "POST /licensing/license-types"
              payload: { code: "RN", name: "Registered Nurse", ce_hours_required_per_cycle: 30.0, cycle_length_months: 24, verification_frequency_days: 180, grace_period_days: 45, requires_exclusion_screening: true, reimbursement_mode: "RECEIPT_BASED", reimburse_full_up_to_cents: 200000, reimburse_half_up_to_cents: 500000, flat_schedule_amount_cents: 0, hard_claim_cap_cents: 500000 }
              as: ComplianceAdmin
              captures: { lt_rn: $.data.id }
            - call: "POST /licensing/role-requirements"
              payload: { role_code: "STAFF_NURSE", license_type_id: "${lt_rn}", state_code: "CA", is_required: true }
              as: ComplianceAdmin
            - call: "POST /licensing/employees"
              payload: { full_name: "Nora Nurse", work_email: "nora.sweep@example.com", role_code: "STAFF_NURSE" }
              as: HRPartner
              captures: { emp: $.data.id }
            - call: "POST /licensing/licenses"
              payload: { employee_id: "${emp}", license_type_id: "${lt_rn}", state_code: "CA", license_number: "RN-8002", issued_on: "2026-01-01", expires_on: "2026-12-31" }
              as: ComplianceOfficer
              captures: { lic: $.data.id }
            - call: "POST /licensing/licenses/${lic}/verify"
              payload: { verified_on: "2026-08-01", source: "STATE_BOARD_API", outcome: "VERIFIED" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-15T00:00:00Z" }
              as: ComplianceAdmin
            - call: "GET /licensing/licenses/${lic}"
              as: ComplianceOfficer
              captures: { lic_status: $.data.status, lic_alert: $.data.alert_tier }
            - call: "GET /licensing/employees/${emp}"
              as: ComplianceOfficer
              captures: { emp_wr: $.data.work_authorization, emp_rr: $.data.restriction_reason }
          assert:
            - "lic_status == \"LAPSED\"  (2027-02-15 > 2026-12-31 + 45d = 2027-02-14)"
            - "lic_alert == \"AT_EXPIRY\""
            - "emp_wr == \"RESTRICTED\" and emp_rr == \"LICENSE_LAPSED\""

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: submit_invalid_state_beats_suspension_safety
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_LICENSE_SUSPENDED]
        distinguishing_aspect: |
          Error-category pair state (409, p6) vs business_safety (403, p7) on the submit
          endpoint: a second submit on an already-SUBMITTED request over a SUSPENDED
          license must yield ERR_INVALID_STATE, while the same submit from MORE_INFO
          (state gate passed) must yield ERR_LICENSE_SUSPENDED.
        test_recipe:
          setup:
            - "RN type; employee with ACTIVE RN-CA license (expires 2027-06-30)"
            - "Renewal request created and submitted by officer-1; then the license is suspended via a confirmed SUSPENSION event"
          setup_api_calls:
            - call: "POST /licensing/license-types"
              payload: { code: "RN", name: "Registered Nurse", ce_hours_required_per_cycle: 30.0, cycle_length_months: 24, verification_frequency_days: 180, grace_period_days: 45, requires_exclusion_screening: true, reimbursement_mode: "RECEIPT_BASED", reimburse_full_up_to_cents: 200000, reimburse_half_up_to_cents: 500000, flat_schedule_amount_cents: 0, hard_claim_cap_cents: 500000 }
              as: ComplianceAdmin
              captures: { lt_rn: $.data.id }
            - call: "POST /licensing/employees"
              payload: { full_name: "Nora Nurse", work_email: "nora.prio@example.com", role_code: "STAFF_NURSE" }
              as: HRPartner
              captures: { emp: $.data.id }
            - call: "POST /licensing/licenses"
              payload: { employee_id: "${emp}", license_type_id: "${lt_rn}", state_code: "CA", license_number: "RN-8101", issued_on: "2026-01-01", expires_on: "2027-06-30" }
              as: ComplianceOfficer
              captures: { lic: $.data.id }
            - call: "POST /licensing/licenses/${lic}/verify"
              payload: { verified_on: "2026-08-01", source: "STATE_BOARD_API", outcome: "VERIFIED" }
              as: ComplianceOfficer
              captures: { lic_v: $.data.version }
            - call: "POST /licensing/licenses/${lic}/renewal-requests"
              payload: { claimed_amount_cents: 50000, expected_license_version: "${lic_v}" }
              as: ComplianceOfficer
              captures: { rr: $.data.id }
            - call: "POST /licensing/renewal-requests/${rr}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /licensing/licenses/${lic}/disciplinary-events"
              payload: { board_case_number: "B-9", event_type: "SUSPENSION", effective_on: "2026-08-01", received_via: "MANUAL" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { de: $.data.id }
            - call: "POST /licensing/disciplinary-events/${de}/confirm"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-2"
          trigger:
            - call: "POST /licensing/renewal-requests/${rr}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { err1: $.data.error_id }
            - call: "POST /licensing/renewal-requests/${rr}/request-info"
              payload: { info_note: "Need updated receipt" }
              as: ComplianceOfficer
              as_user_id: "officer-2"
            - call: "POST /licensing/renewal-requests/${rr}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { err2: $.data.error_id }
          assert:
            - "err1 == \"ERR_INVALID_STATE\"  (p6 state gate beats the p7 suspension safety gate)"
            - "err2 == \"ERR_LICENSE_SUSPENDED\"  (MORE_INFO passes p6, so p7 fires)"

      - name: body_fk_not_found_beats_field_domain_validation
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_NOT_FOUND]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Error-category pair existence (404, p4) vs business_constraint field-domain
          (400, p5) on license creation: a payload whose employee_id does not exist AND
          which omits required license_number must yield ERR_NOT_FOUND, proving
          referenced-resource existence is validated before field-domain checks.
        test_recipe:
          setup:
            - "RN license type exists (so only employee_id is dangling)"
          setup_api_calls:
            - call: "POST /licensing/license-types"
              payload: { code: "RN", name: "Registered Nurse", ce_hours_required_per_cycle: 30.0, cycle_length_months: 24, verification_frequency_days: 180, grace_period_days: 45, requires_exclusion_screening: true, reimbursement_mode: "RECEIPT_BASED", reimburse_full_up_to_cents: 200000, reimburse_half_up_to_cents: 500000, flat_schedule_amount_cents: 0, hard_claim_cap_cents: 500000 }
              as: ComplianceAdmin
              captures: { lt_rn: $.data.id }
          trigger:
            - call: "POST /licensing/licenses"
              payload: { employee_id: "00000000-0000-0000-0000-000000000000", license_type_id: "${lt_rn}", state_code: "CA", issued_on: "2026-01-01", expires_on: "2027-01-01" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_NOT_FOUND\"  (p4 body-FK existence beats p5 missing-required license_number)"
            - "HTTP status == 404"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: ce_gate_exactly_at_requirement_passes
        grounds:
          - validations[priority=19]
          - calculations.ce_tally_cycle
          - state_machines.License.EXPIRED_to_ACTIVE
        distinguishing_aspect: |
          Numeric threshold boundary on CE hours via the verify endpoint: a cycle tally
          of exactly 30.0 against a 30.0 requirement passes the >= gate (29.5 would fail);
          different metric and endpoint than the alert-tier day boundary.
        test_recipe:
          setup:
            - "RN type (CE 30.0, grace 45d); employee with RN-CA license issued 2026-01-01, expires 2026-12-31, verified ACTIVE 2026-08-01"
            - "Exactly 30.0 VALIDATED cycle hours (10.25->10.5, 10.25->10.5, 9.0->9.0)"
            - "clock at 2027-01-05: license EXPIRED (inside grace)"
          setup_api_calls:
            - call: "POST /licensing/license-types"
              payload: { code: "RN", name: "Registered Nurse", ce_hours_required_per_cycle: 30.0, cycle_length_months: 24, verification_frequency_days: 180, grace_period_days: 45, requires_exclusion_screening: true, reimbursement_mode: "RECEIPT_BASED", reimburse_full_up_to_cents: 200000, reimburse_half_up_to_cents: 500000, flat_schedule_amount_cents: 0, hard_claim_cap_cents: 500000 }
              as: ComplianceAdmin
              captures: { lt_rn: $.data.id }
            - call: "POST /licensing/employees"
              payload: { full_name: "Nora Nurse", work_email: "nora.cegate@example.com", role_code: "STAFF_NURSE" }
              as: HRPartner
              captures: { emp: $.data.id }
            - call: "POST /licensing/licenses"
              payload: { employee_id: "${emp}", license_type_id: "${lt_rn}", state_code: "CA", license_number: "RN-8201", issued_on: "2026-01-01", expires_on: "2026-12-31" }
              as: ComplianceOfficer
              captures: { lic: $.data.id }
            - call: "POST /licensing/licenses/${lic}/verify"
              payload: { verified_on: "2026-08-01", source: "STATE_BOARD_API", outcome: "VERIFIED" }
              as: ComplianceOfficer
            - call: "POST /licensing/licenses/${lic}/ce-activities"
              payload: { provider_name: "CEU Inc", activity_title: "Course A", hours: 10.25, completed_on: "2026-06-01" }
              as: ComplianceOfficer
              captures: { ce1: $.data.id }
            - call: "POST /licensing/licenses/${lic}/ce-activities"
              payload: { provider_name: "CEU Inc", activity_title: "Course B", hours: 10.25, completed_on: "2026-06-01" }
              as: ComplianceOfficer
              captures: { ce2: $.data.id }
            - call: "POST /licensing/licenses/${lic}/ce-activities"
              payload: { provider_name: "CEU Inc", activity_title: "Course C", hours: 9.0, completed_on: "2026-06-01" }
              as: ComplianceOfficer
              captures: { ce3: $.data.id }
            - call: "POST /licensing/ce-activities/${ce1}/validate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /licensing/ce-activities/${ce2}/validate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /licensing/ce-activities/${ce3}/validate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ComplianceAdmin
          trigger:
            - call: "POST /licensing/licenses/${lic}/verify"
              payload: { verified_on: "2027-01-05", source: "STATE_BOARD_API", outcome: "VERIFIED" }
              as: ComplianceOfficer
              captures: { st: $.data.status, exp: $.data.expires_on, anchor: $.data.ce_cycle_anchor_on }
          assert:
            - "st == \"ACTIVE\"  (cycle tally exactly 30.0 satisfies the >= 30.0 gate)"
            - "exp == \"2028-01-05\"  (2027-01-05 + 365 days)"
            - "anchor == \"2027-01-05\""

      - name: alert_tier_exactly_thirty_days_boundary
        grounds:
          - calculations.alert_tier
          - entities.License.fields.alert_tier
        distinguishing_aspect: |
          Day-count threshold boundary via the clock endpoint: at exactly 30 days before
          expiry the tier is T30, at 31 days it is T60 — a different metric (days-to-
          expiry) and a different driving endpoint than the CE-hours gate.
        test_recipe:
          setup:
            - "PE type (CE 0, freq 365d); employee with ACTIVE PE-CA license issued 2026-01-01, expires 2026-12-31, verified 2026-08-01"
          setup_api_calls:
            - call: "POST /licensing/license-types"
              payload: { code: "PE", name: "Professional Engineer", ce_hours_required_per_cycle: 0, cycle_length_months: 24, verification_frequency_days: 365, grace_period_days: 30, requires_exclusion_screening: false, reimbursement_mode: "FLAT_SCHEDULE", reimburse_full_up_to_cents: 0, reimburse_half_up_to_cents: 0, flat_schedule_amount_cents: 100000, hard_claim_cap_cents: 500000 }
              as: ComplianceAdmin
              captures: { lt_pe: $.data.id }
            - call: "POST /licensing/employees"
              payload: { full_name: "Eric Engineer", work_email: "eric.tier@example.com", role_code: "FIELD_ENGINEER" }
              as: HRPartner
              captures: { emp: $.data.id }
            - call: "POST /licensing/licenses"
              payload: { employee_id: "${emp}", license_type_id: "${lt_pe}", state_code: "CA", license_number: "PE-8201", issued_on: "2026-01-01", expires_on: "2026-12-31" }
              as: ComplianceOfficer
              captures: { lic: $.data.id }
            - call: "POST /licensing/licenses/${lic}/verify"
              payload: { verified_on: "2026-08-01", source: "MANUAL_UPLOAD", outcome: "VERIFIED" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-30T00:00:00Z" }
              as: ComplianceAdmin
            - call: "GET /licensing/licenses/${lic}"
              as: ComplianceOfficer
              captures: { tier31: $.data.alert_tier }
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: ComplianceAdmin
            - call: "GET /licensing/licenses/${lic}"
              as: ComplianceOfficer
              captures: { tier30: $.data.alert_tier }
          assert:
            - "tier31 == \"T60\"  (31 days until expiry stays in the 31..60 band)"
            - "tier30 == \"T30\"  (exactly 30 days enters the 1..30 band)"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: renewal_submit_gated_by_license_revocation
        grounds:
          - validations[priority=17]
          - state_machines.RenewalRequest.DRAFT_to_SUBMITTED
          - state_machines.License.ACTIVE_to_REVOKED
          - errors[ERR_LICENSE_NOT_RENEWABLE]
        distinguishing_aspect: |
          RenewalRequest's submit transition is gated by License state: after a confirmed
          REVOCATION drives the license REVOKED, submit fails ERR_LICENSE_NOT_RENEWABLE —
          entity pair RenewalRequest -> License.
        test_recipe:
          setup:
            - "RN type; employee with RN-CA license verified ACTIVE (expires 2027-06-30)"
            - "DRAFT renewal request exists; a REVOCATION event has been confirmed, driving the license REVOKED"
          setup_api_calls:
