    side_effects: []
  - method: GET
    path: /uro/conflicts/{id}/prior-rights
    description: List the prior-rights determinations raised on one conflict
    roles: [ProgramAdmin, UtilityCoordinator, RightOfWayAdjudicator, AgreementOfficer, UtilityOwnerRep]
