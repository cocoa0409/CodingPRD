# =============================================================================
# task_0817_weights_measures_device — SCAFFOLD (§1.0–§1.7)
# Weights & Measures Device Inspection program
# =============================================================================

scenario: |
  Weights & Measures Device Inspection: device registration (scale/fuel pump/scanner),
  accuracy test & tolerance, price-verification/scanner audit, seal vs condemnation,
  complaint re-test, registration fee, penalty, reporting

domain_name: weights-measures-device
api_prefix: "/"

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Workflow orchestration"
  complexity_layers:
    - "Cascading side effects"
    - "Dual-variant calculation"
    - "Optimistic concurrency"
    - "Rate / threshold triggers"
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Establishment
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Legal name of the business location holding devices" }
      - { name: jurisdiction, type: string, source: input, description: "County/city inspection jurisdiction code" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED — SUSPENDED blocks new sealing", constraints: "one of ACTIVE, SUSPENDED; initial ACTIVE" }
      - { name: balance_due_cents, type: integer, source: computed, description: "Sum of unpaid FeeInvoice.amount_due_cents (status DUE) plus unpaid Penalty.amount_cents (status ASSESSED); see calculations.establishment_balance" }
      - { name: sealed_device_count, type: integer, source: computed, description: "Count of this establishment's Devices whose status == SEALED; see calculations.sealed_device_count" }

  - name: Inspector
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Inspector full name" }
      - { name: badge_number, type: string, source: input, description: "Unique inspector badge identifier" }
      - { name: region, type: string, source: input, description: "Assigned region label", default: "UNASSIGNED" }

  - name: Device
    parent: null
    common_fields: true
    fields:
      - { name: establishment_id, type: string, source: input, description: "FK -> Establishment.id; the location that owns this device" }
      - { name: device_type, type: enum, source: input, description: "SCALE | FUEL_PUMP | SCANNER", constraints: "one of SCALE, FUEL_PUMP, SCANNER" }
      - { name: device_class, type: enum, source: input, description: "Accuracy class used for tolerance tiers: CLASS_III | CLASS_IIIL", default: "CLASS_III", constraints: "one of CLASS_III, CLASS_IIIL" }
      - { name: serial_number, type: string, source: input, description: "Manufacturer serial number" }
      - { name: status, type: enum, source: system, description: "REGISTERED | SEALED | CONDEMNED | OUT_OF_SERVICE | RETIRED", constraints: "one of REGISTERED, SEALED, CONDEMNED, OUT_OF_SERVICE, RETIRED; initial REGISTERED" }

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - { name: device_id, type: string, source: input, description: "FK -> Device.id; device under inspection" }
      - { name: inspector_id, type: string, source: input, description: "FK -> Inspector.id; assigned inspector" }
      - { name: complaint_id, type: string, source: input, description: "FK -> Complaint.id; required only when inspection_type == COMPLAINT_RETEST, else null", default: null }
      - { name: inspection_type, type: enum, source: input, description: "ACCURACY_TEST | PRICE_VERIFICATION | COMPLAINT_RETEST", constraints: "one of ACCURACY_TEST, PRICE_VERIFICATION, COMPLAINT_RETEST" }
      - { name: scheduled_start, type: datetime, source: input, description: "ISO8601 UTC start of the inspection window" }
      - { name: scheduled_end, type: datetime, source: input, description: "ISO8601 UTC end of the inspection window; must be strictly after scheduled_start" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | PASSED | FAILED", constraints: "one of SCHEDULED, IN_PROGRESS, PASSED, FAILED; initial SCHEDULED" }
      - { name: outcome, type: enum, source: computed, description: "PASS | FAIL | null — computed at finalize from readings (accuracy) or audit items (price verification)", default: null, constraints: "one of PASS, FAIL, null" }

  - name: TestReading
    parent: Inspection
    common_fields: false
    fields:
      - { name: inspection_id, type: string, source: input, description: "FK -> Inspection.id; the accuracy inspection this reading belongs to" }
      - { name: applied_load, type: number, source: input, description: "Certified test load applied to the device, in grams" }
      - { name: indicated_value, type: number, source: input, description: "Value the device displayed for the applied load, in grams" }
      - { name: error_grams, type: number, source: computed, description: "abs(indicated_value - applied_load); see calculations.accuracy_tolerance" }

  - name: ScannerAuditItem
    parent: Inspection
    common_fields: false
    fields:
      - { name: inspection_id, type: string, source: input, description: "FK -> Inspection.id; the price-verification inspection this item belongs to" }
      - { name: item_sku, type: string, source: input, description: "Scanned item SKU" }
      - { name: posted_price_cents, type: integer, source: input, description: "Shelf/posted price in cents" }
      - { name: scanned_price_cents, type: integer, source: input, description: "Price the scanner rang up, in cents" }
      - { name: overcharge_cents, type: integer, source: computed, description: "max(0, scanned_price_cents - posted_price_cents); see calculations.scanner_audit_evaluation" }

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - { name: device_id, type: string, source: input, description: "FK -> Device.id; device the complaint targets" }
      - { name: complainant_name, type: string, source: input, description: "Name of the consumer who filed the complaint" }
      - { name: description, type: string, source: input, description: "Free-text complaint description" }
      - { name: status, type: enum, source: system, description: "FILED | UPHELD | DISMISSED", constraints: "one of FILED, UPHELD, DISMISSED; initial FILED" }

  - name: Seal
    parent: null
    common_fields: true
    fields:
      - { name: device_id, type: string, source: input, description: "FK -> Device.id; device this seal certifies" }
      - { name: inspection_id, type: string, source: input, description: "FK -> Inspection.id; passing inspection that produced this seal" }
      - { name: seal_number, type: string, source: system, description: "Server-minted sequential seal certificate number" }
      - { name: status, type: enum, source: system, description: "ACTIVE | VOIDED", constraints: "one of ACTIVE, VOIDED; initial ACTIVE" }

  - name: CondemnationOrder
    parent: null
    common_fields: true
    fields:
      - { name: device_id, type: string, source: input, description: "FK -> Device.id; condemned device (red-tag)" }
      - { name: inspection_id, type: string, source: input, description: "FK -> Inspection.id; failing inspection that produced this order" }
      - { name: reason, type: string, source: system, description: "Human-readable condemnation reason derived from the failing inspection_type" }
      - { name: status, type: enum, source: system, description: "ISSUED | LIFTED", constraints: "one of ISSUED, LIFTED; initial ISSUED" }

  - name: Penalty
    parent: null
    common_fields: true
    fields:
      - { name: establishment_id, type: string, source: input, description: "FK -> Establishment.id; establishment liable for the penalty" }
      - { name: device_id, type: string, source: input, description: "FK -> Device.id; device whose violation triggered the penalty" }
      - { name: violation_type, type: enum, source: system, description: "OUT_OF_TOLERANCE | PRICE_ERROR | OPERATING_CONDEMNED", constraints: "one of OUT_OF_TOLERANCE, PRICE_ERROR, OPERATING_CONDEMNED" }
      - { name: amount_cents, type: integer, source: computed, description: "Assessed penalty amount in cents; see calculations.penalty_amount" }
      - { name: status, type: enum, source: system, description: "ASSESSED | PAID | WAIVED", constraints: "one of ASSESSED, PAID, WAIVED; initial ASSESSED" }

  - name: FeeInvoice
    parent: null
    common_fields: true
    fields:
      - { name: establishment_id, type: string, source: input, description: "FK -> Establishment.id; payer of the invoice" }
      - { name: device_id, type: string, source: input, description: "FK -> Device.id; device this registration fee is for" }
      - { name: fee_type, type: enum, source: system, description: "REGISTRATION", constraints: "one of REGISTRATION" }
      - { name: base_amount_cents, type: integer, source: system, description: "Full annual base fee for the device_type before proration" }
      - { name: amount_due_cents, type: integer, source: computed, description: "Prorated amount owed in cents; see calculations.registration_fee" }
      - { name: proration_applied, type: boolean, source: computed, description: "True when the quarter factor applied to base_amount_cents was < 1.0" }
      - { name: status, type: enum, source: system, description: "DUE | PAID", constraints: "one of DUE, PAID; initial DUE" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Establishment
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /establishments/{id}/suspend"
        actor: ProgramAdmin
        preconditions:
          - "balance_due_cents > 0 (ERR_SUSPEND_REQUIRES_BALANCE) — suspension is a non-payment sanction"
        side_effects:
          - "CASCADE link 1: every Device of this establishment whose status == SEALED transitions SEALED -> OUT_OF_SERVICE"
          - "CASCADE link 2: each such Device's ACTIVE Seal transitions ACTIVE -> VOIDED"
          - "CASCADE link 3: recompute Establishment.sealed_device_count (drops by the number of devices taken OUT_OF_SERVICE)"
          - "refresh updated_at; increments Establishment.version by 1"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /establishments/{id}/reinstate"
        actor: ProgramAdmin
        preconditions:
          - "balance_due_cents == 0 (ERR_OUTSTANDING_BALANCE)"
        side_effects:
          - "Devices left OUT_OF_SERVICE stay OUT_OF_SERVICE until re-tested; refresh updated_at; increments Establishment.version by 1"

  - entity: Device
    initial_state: REGISTERED
    terminal_states: [RETIRED]
    transitions:
      - from: REGISTERED
        to: SEALED
        trigger: "POST /inspections/{id}/finalize (outcome PASS)"
        actor: system
        preconditions:
          - "owning Establishment.status == ACTIVE (ERR_ESTABLISHMENT_SUSPENDED)"
        side_effects:
          - "create Seal (status ACTIVE) linking device_id + inspection_id"
          - "Establishment.sealed_device_count += 1 (compensating_invariant: sealed_count)"

      - from: REGISTERED
        to: CONDEMNED
        trigger: "POST /inspections/{id}/finalize (outcome FAIL)"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE link 1 (origin: inspection failure mutates device)"
          - "create CondemnationOrder (status ISSUED) — CASCADE link 2 (device condemnation creates the order)"
          - "create Penalty (status ASSESSED) — CASCADE link 2 (device condemnation creates the penalty)"
          - "CASCADE link 3: Penalty creation recomputes Establishment.balance_due_cents (+= Penalty.amount_cents)"

      - from: SEALED
        to: CONDEMNED
        trigger: "POST /inspections/{id}/finalize (outcome FAIL)"
        actor: system
        preconditions: []
        side_effects:
          - "the device's ACTIVE Seal transitions ACTIVE -> VOIDED; Establishment.sealed_device_count -= 1 (compensating_invariant: sealed_count)"
          - "create CondemnationOrder (status ISSUED)"
          - "create Penalty (status ASSESSED); recompute Establishment.balance_due_cents"

      - from: CONDEMNED
        to: SEALED
        trigger: "POST /inspections/{id}/finalize (outcome PASS)"
        actor: system
        preconditions:
          - "owning Establishment.status == ACTIVE (ERR_ESTABLISHMENT_SUSPENDED)"
        note: "cyclic re-seal after repair + passing re-test"
        side_effects:
          - "create Seal (status ACTIVE); Establishment.sealed_device_count += 1"
          - "the device's ISSUED CondemnationOrder transitions ISSUED -> LIFTED"

      - from: OUT_OF_SERVICE
        to: SEALED
        trigger: "POST /inspections/{id}/finalize (outcome PASS)"
        actor: system
        preconditions:
          - "owning Establishment.status == ACTIVE (ERR_ESTABLISHMENT_SUSPENDED)"
        side_effects:
          - "create Seal (status ACTIVE); Establishment.sealed_device_count += 1"

      - from: OUT_OF_SERVICE
        to: CONDEMNED
        trigger: "POST /inspections/{id}/finalize (outcome FAIL)"
        actor: system
        preconditions: []
        side_effects:
          - "create CondemnationOrder (status ISSUED); create Penalty (status ASSESSED); recompute Establishment.balance_due_cents"

      - from: SEALED
        to: OUT_OF_SERVICE
        trigger: "system cascade from POST /establishments/{id}/suspend"
        actor: system
        preconditions: []
        side_effects:
          - "the device's ACTIVE Seal transitions ACTIVE -> VOIDED; Establishment.sealed_device_count -= 1"

      - from: REGISTERED
        to: RETIRED
        trigger: "POST /devices/{id}/retire"
        actor: ProgramAdmin
        preconditions:
          - "device has no Inspection in status IN_PROGRESS (ERR_DEVICE_HAS_ACTIVE_INSPECTION)"
        side_effects: ["refresh updated_at; increments Device.version by 1"]

      - from: SEALED
        to: RETIRED
        trigger: "POST /devices/{id}/retire"
        actor: ProgramAdmin
        preconditions:
          - "device has no Inspection in status IN_PROGRESS (ERR_DEVICE_HAS_ACTIVE_INSPECTION)"
        side_effects:
          - "the device's ACTIVE Seal transitions ACTIVE -> VOIDED; Establishment.sealed_device_count -= 1"

      - from: CONDEMNED
        to: RETIRED
        trigger: "POST /devices/{id}/retire"
        actor: ProgramAdmin
        preconditions:
          - "device has no Inspection in status IN_PROGRESS (ERR_DEVICE_HAS_ACTIVE_INSPECTION)"
        side_effects: ["refresh updated_at; increments Device.version by 1"]

      - from: OUT_OF_SERVICE
        to: RETIRED
        trigger: "POST /devices/{id}/retire"
        actor: ProgramAdmin
        preconditions:
          - "device has no Inspection in status IN_PROGRESS (ERR_DEVICE_HAS_ACTIVE_INSPECTION)"
        side_effects: ["refresh updated_at; increments Device.version by 1"]

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /inspections/{id}/start"
        actor: Inspector
        preconditions:
          - "Device.status IN {REGISTERED, SEALED, CONDEMNED, OUT_OF_SERVICE} (ERR_DEVICE_NOT_TESTABLE) — cross-entity dependency Inspection->Device"
        side_effects: ["refresh updated_at; increments Inspection.version by 1"]

      - from: IN_PROGRESS
        to: PASSED
        trigger: "POST /inspections/{id}/finalize"
        actor: Inspector
        note: "branch A of finalize fork — taken when computed outcome == PASS"
        preconditions:
          - "for ACCURACY_TEST/COMPLAINT_RETEST: at least one TestReading exists (ERR_NO_READINGS)"
          - "for PRICE_VERIFICATION: at least one ScannerAuditItem exists (ERR_INSUFFICIENT_SAMPLE)"
          - "computed outcome == PASS (all readings within tolerance / audit error_count <= MAX_ERRORS)"
          - "owning Establishment.status == ACTIVE (ERR_ESTABLISHMENT_SUSPENDED) — cross-entity dependency Device->Establishment for the SEAL side effect"
        side_effects:
          - "set outcome = PASS; drive Device PASS transition (-> SEALED, creating Seal + LIFTING any ISSUED CondemnationOrder)"

      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /inspections/{id}/finalize"
        actor: Inspector
        note: "branch B of finalize fork — taken when computed outcome == FAIL; divergent side-effect set from branch A"
        preconditions:
          - "for ACCURACY_TEST/COMPLAINT_RETEST: at least one TestReading exists (ERR_NO_READINGS)"
          - "for PRICE_VERIFICATION: at least one ScannerAuditItem exists (ERR_INSUFFICIENT_SAMPLE)"
          - "computed outcome == FAIL"
        side_effects:
          - "set outcome = FAIL; drive Device FAIL transition (-> CONDEMNED, creating CondemnationOrder + Penalty, recomputing Establishment.balance_due_cents)"

  - entity: Complaint
    initial_state: FILED
    terminal_states: [UPHELD, DISMISSED]
    transitions:
      - from: FILED
        to: UPHELD
        trigger: "POST /complaints/{id}/resolve (disposition UPHELD)"
        actor: ProgramAdmin
        preconditions:
          - "the targeted Device.status == CONDEMNED (ERR_INVALID_STATE) — a re-test must have confirmed the complaint before it can be upheld; cross-entity dependency Complaint->Device"
        side_effects: ["refresh updated_at; increments Complaint.version by 1"]

      - from: FILED
        to: DISMISSED
        trigger: "POST /complaints/{id}/resolve (disposition DISMISSED)"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["refresh updated_at; increments Complaint.version by 1"]

  - entity: Penalty
    initial_state: ASSESSED
    terminal_states: [PAID, WAIVED]
    transitions:
      - from: ASSESSED
        to: PAID
        trigger: "POST /penalties/{id}/pay"
        actor: Establishment
        preconditions:
          - "acting Establishment owns this penalty (ERR_OWNERSHIP_VIOLATION)"
        side_effects:
          - "recompute Establishment.balance_due_cents (-= amount_cents) — compensating_invariant: balance"

      - from: ASSESSED
        to: WAIVED
        trigger: "POST /penalties/{id}/waive"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "recompute Establishment.balance_due_cents (-= amount_cents) — compensating_invariant: balance"

  - entity: FeeInvoice
    initial_state: DUE
    terminal_states: [PAID]
    transitions:
      - from: DUE
        to: PAID
        trigger: "POST /fee-invoices/{id}/pay"
        actor: Establishment
        preconditions:
          - "acting Establishment owns this invoice (ERR_OWNERSHIP_VIOLATION)"
        side_effects:
          - "recompute Establishment.balance_due_cents (-= amount_due_cents) — compensating_invariant: balance"

  - entity: Seal
    initial_state: ACTIVE
    terminal_states: [VOIDED]
    transitions:
      - from: ACTIVE
        to: VOIDED
        trigger: "system side-effect of Device leaving SEALED (fail re-test, retire, or establishment suspend cascade)"
        actor: system
        preconditions: []
        side_effects: ["refresh updated_at; increments Seal.version by 1"]

  - entity: CondemnationOrder
    initial_state: ISSUED
    terminal_states: [LIFTED]
    transitions:
      - from: ISSUED
        to: LIFTED
        trigger: "system side-effect of Device transition CONDEMNED -> SEALED on a passing re-test"
        actor: system
        preconditions: []
        side_effects: ["refresh updated_at; increments CondemnationOrder.version by 1"]

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: inspection-schedule-stale-device
    parent_entity: Device
    write_endpoint: "POST /inspections"
    occ_field: "expected_device_version"
    description: |
      Scheduling an Inspection against a Device whose version has advanced since
      the client last observed it is rejected. A new inspection scheduling reserves
      the device (bumping its version); a writer whose expected_device_version is
      behind the current Device.version is working from a stale view — for example
      the device may have just been retired or condemned by another writer whose
      write already advanced the version — and the schedule is refused.
    error_id: ERR_STALE_DEVICE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: registration_fee
    trigger: "POST /devices (device registration) — creates the REGISTRATION FeeInvoice"
    algorithm: tiered_pricing
    formula: |
      base = BASE_FEE_CENTS[device.device_type]
      month = month-of-year of the logical clock at registration time (created_at)
      quarter_factor =
        1.00 if month in {1,2,3}    (Q1)
        0.75 if month in {4,5,6}    (Q2)
        0.50 if month in {7,8,9}    (Q3)
        0.25 if month in {10,11,12} (Q4)
      amount_due_cents = round_half_up(base * quarter_factor)   # PRORATED variant (the system rule)
      proration_applied = (quarter_factor < 1.00)
    input_set: "single device at registration; clock month decides the quarter"
    constants:
      BASE_FEE_CENTS: { SCALE: 12000, FUEL_PUMP: 8000, SCANNER: 15000 }
    precision: "amount in whole cents, round_half_up"
    variants:
      - name: FULL_YEAR
        when: "naive alternative interpretation that ignores registration date"
        difference: "amount_due_cents = base (no quarter factor); diverges from PRORATED whenever quarter_factor < 1.00"
      - name: PRORATED
        when: "the system rule — applies the quarter factor keyed on registration month"
        difference: "amount_due_cents = round_half_up(base * quarter_factor)"

  - name: accuracy_tolerance
    trigger: "POST /inspections/{id}/finalize for ACCURACY_TEST or COMPLAINT_RETEST — evaluates every TestReading"
    algorithm: threshold
    formula: |
      for each reading:
        error_grams = abs(indicated_value - applied_load)
        maintenance_tol = MAINT_TOL[device.device_class][ tier-of(applied_load, device.device_class) ]
        acceptance_tol  = maintenance_tol / 2                # constants are even, so this is exact
        applicable_tol  = acceptance_tol  if device.status == REGISTERED   (ACCEPTANCE variant)
                          maintenance_tol otherwise                        (MAINTENANCE variant)
        reading passes  iff error_grams <= applicable_tol    # boundary: <= (equal passes)
      inspection outcome = PASS iff every reading passes, else FAIL
    input_set: "all TestReadings for the inspection; device_class and device.status select the tolerance"
    constants:
      MAINT_TOL:
        CLASS_III:  { "load<=5000": 6, "5000<load<=20000": 12, "load>20000": 20 }
        CLASS_IIIL: { "load<=10000": 10, "10000<load<=50000": 20, "load>50000": 40 }
    precision: "grams compared as exact numbers"
    variants:
      - name: ACCEPTANCE
        when: "device.status == REGISTERED (never-sealed / brand-new device)"
        difference: "uses the tighter acceptance_tol = maintenance_tol / 2"
      - name: MAINTENANCE
        when: "device.status in {SEALED, CONDEMNED, OUT_OF_SERVICE} (in-service device)"
        difference: "uses the looser maintenance_tol; identical reading data can PASS here yet FAIL under ACCEPTANCE"

  - name: scanner_audit_evaluation
    trigger: "POST /inspections/{id}/finalize for PRICE_VERIFICATION — evaluates every ScannerAuditItem"
    algorithm: threshold
    formula: |
      for each item: overcharge_cents = max(0, scanned_price_cents - posted_price_cents)
      error_count = count of items where scanned_price_cents != posted_price_cents
      inspection outcome = FAIL iff error_count > MAX_ERRORS, else PASS   # boundary: strictly greater
    input_set: "all ScannerAuditItems for the inspection (must be >= MIN_SAMPLE, else ERR_INSUFFICIENT_SAMPLE)"
    constants:
      MAX_ERRORS: 2
      MIN_SAMPLE: 1
    precision: "counts are integers; overcharge in whole cents"

  - name: penalty_amount
    trigger: "Device FAIL transition (a Penalty is created ASSESSED)"
    algorithm: weighted_scoring
    formula: |
      repeat_multiplier keyed on prior_condemnation_count for the establishment:
        prior_condemnation_count = count of CondemnationOrders whose device.establishment_id == this establishment
          AND created_at < this order's created_at (status ISSUED or LIFTED both count), ordered by created_at ASC
        multiplier = 1.0 if prior_condemnation_count == 0
                     1.5 if 1 <= prior_condemnation_count <= 2
                     2.0 if prior_condemnation_count >= 3
      if violation_type == PRICE_ERROR:
        # nested rounding — order is PINNED: round each item first, THEN sum, THEN multiply, THEN round
        per_item = [ round_half_up(item.overcharge_cents * PENALTY_RATE) for each item with overcharge_cents > 0 ]
        subtotal = sum(per_item)
        amount_cents = round_half_up(subtotal * multiplier)
      else:   # OUT_OF_TOLERANCE or OPERATING_CONDEMNED
        amount_cents = round_half_up(BASE_PENALTY_CENTS[violation_type] * multiplier)
    input_set: "the failing inspection's items (PRICE_ERROR) plus the establishment's prior condemnation history"
    constants:
      PENALTY_RATE: 1.5
      BASE_PENALTY_CENTS: { OUT_OF_TOLERANCE: 5000, PRICE_ERROR: 0, OPERATING_CONDEMNED: 20000 }
    precision: "whole cents, round_half_up; per-item-then-sum order is authoritative"

  - name: establishment_balance
    trigger: "any FeeInvoice or Penalty create/pay/waive"
    algorithm: aggregation
    formula: |
      balance_due_cents =
        sum(FeeInvoice.amount_due_cents for invoices of this establishment with status == DUE)
        + sum(Penalty.amount_cents for penalties of this establishment with status == ASSESSED)
    input_set: "FeeInvoices with status DUE and Penalties with status ASSESSED for the establishment"
    precision: "whole cents"

  - name: sealed_device_count
    trigger: "any Device status change into or out of SEALED"
    algorithm: aggregation
    formula: |
      sealed_device_count = count(Device where establishment_id == this establishment AND status == SEALED)
    input_set: "Devices of the establishment currently in status SEALED"
    precision: "integer count"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and valid"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "role permitted for this operation per §1.7 RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "request body well-formed: required fields present, enum values legal, and for POST /inspections scheduled_end strictly after scheduled_start"
    error_id: "ERR_VALIDATION / ERR_SCHEDULE_WINDOW_INVALID"
    http_status: 400
    applies_to: "all mutating endpoints"

  - priority: 4
    category: existence
    check: "path and FK-referenced resources exist, validated left-to-right"
    error_id: "ERR_ESTABLISHMENT_NOT_FOUND / ERR_INSPECTOR_NOT_FOUND / ERR_DEVICE_NOT_FOUND / ERR_INSPECTION_NOT_FOUND / ERR_COMPLAINT_NOT_FOUND / ERR_PENALTY_NOT_FOUND / ERR_FEE_INVOICE_NOT_FOUND / ERR_NOT_FOUND"
    http_status: 404
    applies_to: all

  - priority: 5
    category: business_referential
    check: "acting Establishment (entity_backed) owns the Penalty / FeeInvoice it is paying"
    error_id: ERR_OWNERSHIP_VIOLATION
    http_status: 403
    applies_to: "POST /penalties/{id}/pay, POST /fee-invoices/{id}/pay"

  - priority: 6
    category: state
    check: "target resource is in a legal state for the requested transition. Device must be testable (status IN {REGISTERED, SEALED, CONDEMNED, OUT_OF_SERVICE}, i.e. not RETIRED) both when scheduling (POST /inspections) and when starting; inspection in progress; establishment active for sealing; penalty/invoice payable; etc."
    error_id: "ERR_DEVICE_NOT_TESTABLE / ERR_DEVICE_RETIRED / ERR_INSPECTION_NOT_IN_PROGRESS / ERR_ESTABLISHMENT_SUSPENDED / ERR_PENALTY_NOT_PAYABLE / ERR_INVOICE_NOT_PAYABLE / ERR_INVALID_STATE"
    http_status: 409
    applies_to: "POST /inspections, all state-transition endpoints"

  - priority: 7
    category: business_constraint
    check: "OCC — expected_device_version equals current Device.version"
    error_id: ERR_STALE_DEVICE_VERSION
    http_status: 412
    applies_to: "POST /inspections"

  - priority: 8
    category: business_referential
    check: "inspection_type == COMPLAINT_RETEST requires a complaint_id referencing a FILED Complaint whose device_id == the inspection's device_id"
    error_id: ERR_COMPLAINT_REQUIRED
    http_status: 409
    applies_to: "POST /inspections"

  - priority: 9
    category: business_temporal
    check: "the inspector has no other non-terminal (SCHEDULED/IN_PROGRESS) inspection whose [scheduled_start, scheduled_end) HALF-OPEN window overlaps this one; touching endpoints (end == next start) do NOT conflict"
    error_id: ERR_INSPECTOR_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /inspections"

  - priority: 10
    category: business_temporal
    check: "the device has no other non-terminal inspection whose CLOSED window, expanded by a DEVICE_BUFFER_MINUTES=60 buffer on each side, contains any point of this window (gap < 60 min conflicts; gap >= 60 min allowed)"
    error_id: ERR_DEVICE_RETEST_BUFFER
    http_status: 409
    applies_to: "POST /inspections"

  - priority: 11
    category: business_safety
    check: "finalize has sufficient evidence: >=1 TestReading for accuracy/complaint-retest, or >= MIN_SAMPLE ScannerAuditItems for price verification"
    error_id: "ERR_NO_READINGS / ERR_INSUFFICIENT_SAMPLE"
    http_status: 422
    applies_to: "POST /inspections/{id}/finalize"

  - priority: 12
    category: business_constraint
    check: "device with an IN_PROGRESS inspection cannot be retired"
    error_id: ERR_DEVICE_HAS_ACTIVE_INSPECTION
    http_status: 409
    applies_to: "POST /devices/{id}/retire"

  - priority: 13
    category: business_fiscal
    check: "suspend requires balance_due_cents > 0; reinstate requires balance_due_cents == 0"
    error_id: "ERR_SUSPEND_REQUIRES_BALANCE / ERR_OUTSTANDING_BALANCE"
    http_status: 409
    applies_to: "POST /establishments/{id}/suspend, POST /establishments/{id}/reinstate"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Establishment ----
  - method: POST
    path: "/establishments"
    description: "Register an establishment (business location)"
    roles: [ProgramAdmin]
    code: 201
    input: [name, jurisdiction]
    output: Establishment
    side_effects: ["status=ACTIVE, balance_due_cents=0, sealed_device_count=0"]

  - method: GET
    path: "/establishments/{id}"
    description: "Get an establishment"
    roles: [ProgramAdmin, Establishment, Inspector]
    code: 200
    input: []
    output: Establishment
    side_effects: []

  - method: POST
    path: "/establishments/{id}/suspend"
    description: "Suspend an establishment for non-payment; cascades to seal voiding"
    roles: [ProgramAdmin]
    code: 200
    input: ["reason?"]
    output: Establishment
    side_effects: ["ACTIVE->SUSPENDED cascade per §1.2 (devices OUT_OF_SERVICE, seals VOIDED, sealed_device_count recompute)"]

  - method: POST
    path: "/establishments/{id}/reinstate"
    description: "Reinstate a suspended establishment once its balance is clear"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Establishment
    side_effects: ["SUSPENDED->ACTIVE"]

  # ---- Inspector ----
  - method: POST
    path: "/inspectors"
    description: "Create an inspector"
    roles: [ProgramAdmin]
    code: 201
    input: [full_name, badge_number, "region?"]
    output: Inspector
    side_effects: []

  # ---- Device ----
  - method: POST
    path: "/devices"
    description: "Register a device; assesses the prorated registration fee"
    roles: [ProgramAdmin]
    code: 201
    input: [establishment_id, device_type, serial_number, "device_class?"]
    output: Device
    side_effects:
      - "status=REGISTERED"
      - "create FeeInvoice (fee_type REGISTRATION, status DUE) via calculations.registration_fee; recompute Establishment.balance_due_cents"

  - method: GET
    path: "/devices/{id}"
    description: "Get a device"
    roles: [ProgramAdmin, Establishment, Inspector]
    code: 200
    input: []
    output: Device
    side_effects: []

  - method: GET
    path: "/devices"
    description: "List devices (reverse lookup by establishment)"
    roles: [ProgramAdmin, Establishment, Inspector]
    code: 200
    input: ["establishment_id?", "status?", "limit?", "offset?"]
    output: Device[]
    side_effects: []

  - method: POST
    path: "/devices/{id}/retire"
    description: "Retire (decommission) a device"
    roles: [ProgramAdmin]
    code: 200
    input: ["reason?"]
    output: Device
    side_effects: ["-> RETIRED; voids ACTIVE seal if any; sealed_device_count recompute"]

  # ---- Inspection ----
  - method: POST
    path: "/inspections"
    description: "Schedule an inspection on a device (OCC-guarded on the device version)"
    roles: [Inspector, ProgramAdmin]
    code: 201
    input: [device_id, inspector_id, inspection_type, scheduled_start, scheduled_end, expected_device_version, "complaint_id?"]
    output: Inspection
    side_effects:
      - "status=SCHEDULED, outcome=null"
      - "increments Device.version by 1 (reserves the device for the OCC contract)"

  - method: GET
    path: "/inspections/{id}"
    description: "Get an inspection"
    roles: [ProgramAdmin, Inspector, Establishment]
    code: 200
    input: []
    output: Inspection
    side_effects: []

  - method: GET
    path: "/inspections"
    description: "List inspections (reverse lookup by device, inspector, or complaint)"
    roles: [ProgramAdmin, Inspector, Establishment]
    code: 200
    input: ["device_id?", "inspector_id?", "complaint_id?", "status?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []

  - method: POST
    path: "/inspections/{id}/start"
    description: "Begin conducting a scheduled inspection"
    roles: [Inspector]
    code: 200
    input: []
    output: Inspection
    side_effects: ["SCHEDULED->IN_PROGRESS"]

  - method: POST
    path: "/inspections/{id}/finalize"
    description: "Finalize an inspection; computes PASS/FAIL and drives the device transition + cascades"
    roles: [Inspector]
    code: 200
    input: []
    output: Inspection
    side_effects: ["IN_PROGRESS->PASSED or ->FAILED; device seal/condemn cascade per §1.2"]

  - method: POST
    path: "/inspections/{id}/test-readings"
    description: "Record an accuracy test reading under an inspection"
    roles: [Inspector]
    code: 201
    input: [applied_load, indicated_value]
    output: TestReading
    side_effects: ["compute error_grams"]

  - method: GET
    path: "/inspections/{id}/test-readings"
    description: "List test readings for an inspection (reverse lookup)"
    roles: [ProgramAdmin, Inspector, Establishment]
    code: 200
    input: ["limit?", "offset?"]
    output: TestReading[]
    side_effects: []

  - method: POST
    path: "/inspections/{id}/audit-items"
    description: "Record a scanner price-verification audit item under an inspection"
    roles: [Inspector]
    code: 201
    input: [item_sku, posted_price_cents, scanned_price_cents]
    output: ScannerAuditItem
    side_effects: ["compute overcharge_cents"]

  - method: GET
    path: "/inspections/{id}/audit-items"
    description: "List audit items for an inspection (reverse lookup)"
    roles: [ProgramAdmin, Inspector, Establishment]
    code: 200
    input: ["limit?", "offset?"]
    output: ScannerAuditItem[]
    side_effects: []

  # ---- Complaint ----
  - method: POST
    path: "/complaints"
    description: "File a consumer complaint against a device"
    roles: [ProgramAdmin]
    code: 201
    input: [device_id, complainant_name, description]
    output: Complaint
    side_effects: ["status=FILED"]

  - method: GET
    path: "/complaints/{id}"
    description: "Get a complaint"
    roles: [ProgramAdmin, Inspector]
    code: 200
    input: []
    output: Complaint
    side_effects: []

  - method: GET
    path: "/complaints"
    description: "List complaints (reverse lookup by device)"
    roles: [ProgramAdmin, Inspector]
    code: 200
    input: ["device_id?", "status?", "limit?", "offset?"]
    output: Complaint[]
    side_effects: []

  - method: POST
    path: "/complaints/{id}/resolve"
    description: "Resolve a complaint as UPHELD or DISMISSED"
    roles: [ProgramAdmin]
    code: 200
    input: [disposition]
    output: Complaint
    side_effects: ["FILED->UPHELD or ->DISMISSED"]

  # ---- Seal ----
  - method: GET
    path: "/seals/{id}"
    description: "Get a seal"
    roles: [ProgramAdmin, Inspector, Establishment]
    code: 200
    input: []
    output: Seal
    side_effects: []

  - method: GET
    path: "/seals"
    description: "List seals (reverse lookup by device or inspection)"
    roles: [ProgramAdmin, Inspector, Establishment]
    code: 200
    input: ["device_id?", "inspection_id?", "status?", "limit?", "offset?"]
    output: Seal[]
    side_effects: []

  # ---- CondemnationOrder ----
  - method: GET
    path: "/condemnations/{id}"
    description: "Get a condemnation order"
    roles: [ProgramAdmin, Inspector, Establishment]
    code: 200
    input: []
    output: CondemnationOrder
    side_effects: []

  - method: GET
    path: "/condemnations"
    description: "List condemnation orders (reverse lookup by device or inspection)"
    roles: [ProgramAdmin, Inspector, Establishment]
    code: 200
    input: ["device_id?", "inspection_id?", "status?", "limit?", "offset?"]
    output: CondemnationOrder[]
    side_effects: []

  # ---- Penalty ----
  - method: GET
    path: "/penalties/{id}"
    description: "Get a penalty"
    roles: [ProgramAdmin, Establishment]
    code: 200
    input: []
    output: Penalty
    side_effects: []

  - method: GET
    path: "/penalties"
    description: "List penalties (reverse lookup by establishment or device)"
    roles: [ProgramAdmin, Establishment]
    code: 200
    input: ["establishment_id?", "device_id?", "status?", "limit?", "offset?"]
    output: Penalty[]
    side_effects: []

  - method: POST
    path: "/penalties/{id}/pay"
    description: "Pay an assessed penalty"
    roles: [Establishment, ProgramAdmin]
    code: 200
    input: []
    output: Penalty
    side_effects: ["ASSESSED->PAID; recompute Establishment.balance_due_cents"]

  - method: POST
    path: "/penalties/{id}/waive"
    description: "Waive an assessed penalty (administrative)"
    roles: [ProgramAdmin]
    code: 200
    input: ["reason?"]
    output: Penalty
    side_effects: ["ASSESSED->WAIVED; recompute Establishment.balance_due_cents"]

  # ---- FeeInvoice ----
  - method: GET
    path: "/fee-invoices/{id}"
    description: "Get a fee invoice"
    roles: [ProgramAdmin, Establishment]
    code: 200
    input: []
    output: FeeInvoice
    side_effects: []

  - method: GET
    path: "/fee-invoices"
    description: "List fee invoices (reverse lookup by establishment or device)"
    roles: [ProgramAdmin, Establishment]
    code: 200
    input: ["establishment_id?", "device_id?", "status?", "limit?", "offset?"]
    output: FeeInvoice[]
    side_effects: []

  - method: POST
    path: "/fee-invoices/{id}/pay"
    description: "Pay a due registration fee invoice"
    roles: [Establishment, ProgramAdmin]
    code: 200
    input: []
    output: FeeInvoice
    side_effects: ["DUE->PAID; recompute Establishment.balance_due_cents"]

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock (ISO8601 UTC). Server startup default is 2026-03-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time. The clock month decides registration-fee proration."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["advances the logical clock used for registration_fee proration"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for the operation" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field or illegal enum value" }
  - { id: ERR_SCHEDULE_WINDOW_INVALID, http: 400, condition: "scheduled_end is not strictly after scheduled_start" }
  - { id: ERR_ESTABLISHMENT_NOT_FOUND, http: 404, condition: "Referenced establishment does not exist" }
  - { id: ERR_INSPECTOR_NOT_FOUND, http: 404, condition: "Referenced inspector does not exist" }
  - { id: ERR_DEVICE_NOT_FOUND, http: 404, condition: "Referenced device does not exist" }
  - { id: ERR_INSPECTION_NOT_FOUND, http: 404, condition: "Referenced inspection does not exist" }
  - { id: ERR_COMPLAINT_NOT_FOUND, http: 404, condition: "Referenced complaint does not exist" }
  - { id: ERR_PENALTY_NOT_FOUND, http: 404, condition: "Referenced penalty does not exist" }
  - { id: ERR_FEE_INVOICE_NOT_FOUND, http: 404, condition: "Referenced fee invoice does not exist" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced seal or condemnation order does not exist" }
  - { id: ERR_OWNERSHIP_VIOLATION, http: 403, condition: "Acting establishment does not own the penalty/invoice being paid" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic wrong-state transition (e.g., resolving a complaint whose device is not CONDEMNED)" }
  - { id: ERR_DEVICE_NOT_TESTABLE, http: 409, condition: "Device is RETIRED (or otherwise not in a testable state) for inspection scheduling/start" }
  - { id: ERR_DEVICE_RETIRED, http: 409, condition: "Device is already RETIRED (terminal) for the requested action" }
  - { id: ERR_INSPECTION_NOT_IN_PROGRESS, http: 409, condition: "start/finalize called on an inspection not in the required state" }
  - { id: ERR_ESTABLISHMENT_SUSPENDED, http: 409, condition: "Owning establishment is SUSPENDED, so a passing inspection cannot seal the device" }
  - { id: ERR_PENALTY_NOT_PAYABLE, http: 409, condition: "Penalty is not in ASSESSED state" }
  - { id: ERR_INVOICE_NOT_PAYABLE, http: 409, condition: "Fee invoice is not in DUE state" }
  - { id: ERR_STALE_DEVICE_VERSION, http: 412, condition: "expected_device_version does not match current Device.version (OCC)" }
  - { id: ERR_COMPLAINT_REQUIRED, http: 409, condition: "COMPLAINT_RETEST scheduled without a valid FILED complaint for the device" }
  - { id: ERR_INSPECTOR_SCHEDULE_CONFLICT, http: 409, condition: "Inspector already has an overlapping non-terminal inspection window (half-open)" }
  - { id: ERR_DEVICE_RETEST_BUFFER, http: 409, condition: "Device already has a non-terminal inspection within the 60-minute buffer" }
  - { id: ERR_NO_READINGS, http: 422, condition: "Accuracy/complaint-retest finalize with zero TestReadings" }
  - { id: ERR_INSUFFICIENT_SAMPLE, http: 422, condition: "Price-verification finalize with fewer than MIN_SAMPLE audit items" }
  - { id: ERR_DEVICE_HAS_ACTIVE_INSPECTION, http: 409, condition: "Retire attempted while an inspection is IN_PROGRESS" }
  - { id: ERR_SUSPEND_REQUIRES_BALANCE, http: 409, condition: "Suspend attempted while balance_due_cents == 0" }
  - { id: ERR_OUTSTANDING_BALANCE, http: 409, condition: "Reinstate attempted while balance_due_cents > 0" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Weights & Measures program operator: registers establishments, inspectors, and devices; manages complaints, fees, and penalties; suspends/reinstates establishments; sets the test clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /establishments"
      - "POST /establishments/{id}/suspend"
      - "POST /establishments/{id}/reinstate"
      - "POST /inspectors"
      - "POST /devices"
      - "POST /devices/{id}/retire"
      - "POST /complaints"
      - "POST /complaints/{id}/resolve"
      - "POST /penalties/{id}/waive"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /inspections (shared with Inspector)"
      - "POST /penalties/{id}/pay (shared with Establishment)"
      - "POST /fee-invoices/{id}/pay (shared with Establishment)"
      - "all GET reads"

  - name: Inspector
    description: "Field inspector who conducts device inspections, records readings/audit items, and finalizes results."
    identity: "entity_backed:Inspector"
    exclusive_operations:
      - "POST /inspections/{id}/start"
      - "POST /inspections/{id}/finalize"
      - "POST /inspections/{id}/test-readings"
      - "POST /inspections/{id}/audit-items"
    shared_operations:
      - "POST /inspections (shared with ProgramAdmin)"
      - "GET reads on establishments, devices, inspections, seals, condemnations, complaints"

  - name: Establishment
    description: "The regulated business; pays its own fee invoices and penalties and reads its own devices/inspections."
    identity: "entity_backed:Establishment"
    exclusive_operations: []
    shared_operations:
      - "POST /penalties/{id}/pay (own penalties only; shared with ProgramAdmin)"
      - "POST /fee-invoices/{id}/pay (own invoices only; shared with ProgramAdmin)"
      - "GET reads on own establishment, devices, inspections, seals, condemnations, penalties, fee-invoices"
