          trigger:
            - call: "POST /consultants/${c1_id}/utilization-periods"
              payload: { period_start_on: "2026-08-14", period_end_on: "2026-08-28" }
              as: FinanceController
              captures: { err_id: $.data.error_id }
            - call: "POST /consultants/${c1_id}/utilization-periods"
              payload: { period_start_on: "2026-08-15", period_end_on: "2026-08-28" }
              as: FinanceController
              captures: { up2_id: $.data.id }
          assert:
            - "the 2026-08-14 start returned 409 with ${err_id} == ERR_PERIOD_OVERLAP — sharing the single boundary day 2026-08-14 is enough"
            - "the 2026-08-15 start returned 201 and UtilizationPeriod.${up2_id}.status == OPEN"
            - "UtilizationPeriod.${up1_id}.period_workdays == 10 and capacity_hours == 80.00"
            - "UtilizationPeriod.${up2_id}.period_workdays == 10 and capacity_hours == 80.00 (2026-08-15 and 2026-08-16 are a weekend and contribute nothing)"
            - "UtilizationPeriod.${up2_id}.billable_hours == 0.00, investment_hours == 0.00, bench_hours == 80.00, utilization_pct_available_basis == 0.00"
            - "UtilizationPeriod.${up2_id}.target_utilization_pct == 75.00 and variance_pp == -75.00"
            - "GET /consultants/${c1_id}/utilization-periods returns total_count == 2 — the rejected request created nothing"

  - rule_id: cross_entity_state_dependency
