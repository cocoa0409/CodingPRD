  # ===========================================================================
  # RULE 4 — transitive_cascade
  # Two chains of different depth and different shape: a compliance chain that
  # fans OUT from one child record to sibling visits and contracts, and a
  # funding chain that fans out ACROSS accounts through a shared program.
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: failed_cycle_takes_line_out_then_suspends_account_contract_and_abandons_scheduled_visit
        grounds:
          - state_machines.CleaningCycle.ABSENT_to_POSTED
          - state_machines.BeerLine.IN_SERVICE_to_OUT_OF_SERVICE
          - state_machines.ServiceAccount.ACTIVE_to_SUSPENDED
          - state_machines.ServiceContract.ACTIVE_to_SUSPENDED
          - state_machines.ServiceVisit.work_status.SCHEDULED_to_ABANDONED
          - calculations.chemical_cycle_dosing
          - calculations.line_compliance_projection
          - entities.ServiceAccount.fields.suspended_reason
          - entities.ServiceAccount.fields.billing_mode
        distinguishing_aspect: |
          Four-hop chain fanning out from a single child-record POST inside one
          account: cycle FAIL_CONCENTRATION -> line #1 OUT_OF_SERVICE ->
          lines_out_of_service_count 1 with 1 * 2 >= contracted_line_count 2, so
          the account flips SUSPENDED/LINE_COMPLIANCE_THRESHOLD -> the ACTIVE
          contract flips SUSPENDED and drags billing_mode PROGRAM_BILL ->
          DIRECT_BILL, and the FUTURE SCHEDULED visit is ABANDONED with
          abandon_reason ACCOUNT_SUSPENDED while the IN_PROGRESS visit that
          carried the failing cycle is deliberately left untouched.
        test_recipe:
          setup:
            - "Clock at 2026-08-05T09:00:00Z."
            - "BrewerProgram 'Southside Brewing' ACTIVE, funded_scope CLEANING_ONLY, co_pay_bps 0, funding_cap_cents 100000."
            - "ServiceAccount ACTIVE with billing_mode PROGRAM_BILL; ServiceContract ACTIVE naming that program with contracted_line_count 2 and funding_status BREWER_FUNDED."
            - "Two BeerLine rows IN_SERVICE, both 32ft/4ft/0.375in, lines_out_of_service_count 0."
            - "ServiceVisit A on 2026-08-05 540-660 IN_PROGRESS; ServiceVisit B on 2026-08-12 540-660 still SCHEDULED."
            - "ChemicalLot C-6001 CAUSTIC AVAILABLE, concentration_pct_stock 45.0, liters_remaining 20.0."
          setup_api_calls:
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
