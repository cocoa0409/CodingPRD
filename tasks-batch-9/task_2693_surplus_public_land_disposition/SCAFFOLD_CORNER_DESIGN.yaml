              as: RealPropertyOfficer
          trigger:
            - call: "POST /declarations/${decl_id}/re-offer"
              payload: {}
              as: RealPropertyOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-30T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /declarations/${decl_id}/re-offer"
              payload: {}
              as: RealPropertyOfficer
          assert:
            - "after close-bidding DispositionOffering.${offering_id}.status == FAILED_NO_QUALIFYING_BID and qualified_bid_count == 0"
            - "SurplusDeclaration.${decl_id}.status == UNSUCCESSFUL, reoffer_count == 1, authorized_disposition_type null and reoffer_eligible_at == 2027-01-30T00:00:00Z"
            - "the first re-offer is HTTP 409 with data.error_id == ERR_REOFFER_COOLING_OFF and GET /notices filtered by declaration_id ${decl_id} still returns total_count == 1"
            - "the second re-offer is HTTP 200 with data.status == NOTICED and data.notice_issued_at == 2027-01-30T00:00:00Z"
            - "GET /notices filtered by declaration_id ${decl_id} and notice_round 2 returns total_count == 1 with recipient_agency_id ${nbr_agency_id}, response_window_days 60 and response_deadline_at 2027-03-31T00:00:00Z"
            - "Appraisal.${appraisal_id}.status == SUPERSEDED with revaluation_required true, and Parcel.${parcel_id}.valuation_status == STALE with disposition_ready false"

      - name: recirculate_environmental_review_within_buffer_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=57]
          - calculations.environmental_recirculation_window
          - errors[ERR_RECIRCULATION_BUFFER_VIOLATION]
        distinguishing_aspect: "The 30-day recirculation buffer is inclusive at its boundary: with circulation_end_on 2026-10-01T00:00:00Z a restart at 2026-10-30T00:00:00Z is HTTP 422 ERR_RECIRCULATION_BUFFER_VIOLATION while 2026-10-31T00:00:00Z is accepted, and the rejected attempt leaves circulation_round at 1 with the original window intact."
        test_recipe:
          setup:
            - "One Agency, one Parcel and one ADOPTED declaration."
            - "A NEGATIVE_DECLARATION EnvironmentalReview circulating over [2026-09-01T00:00:00Z, 2026-10-01T00:00:00Z], so the earliest legal recirculation start is 2026-10-31T00:00:00Z."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "City of Riverbend", agency_type: "MUNICIPAL", contact_email: "realproperty@riverbend.gov" }
              as: SystemAdministrator
              captures: { cust_agency_id: "$.data.id" }
            - call: "POST /parcels"
              payload: { apn: "APN-2693-164", address: "9 Canal Street", acreage: 3.1, zoning_code: "M-1", book_value_cents: 70000000, custodian_agency_id: "${cust_agency_id}" }
              as: RealPropertyOfficer
              captures: { parcel_id: "$.data.id" }
            - call: "POST /declarations"
              payload: { parcel_id: "${parcel_id}", justification: "Canal Street yard is surplus after depot consolidation." }
              as: RealPropertyOfficer
              captures: { decl_id: "$.data.id" }
            - call: "POST /declarations/${decl_id}/adopt"
              payload: { resolution_number: "RES-2026-264" }
              as: BoardClerk
              as_user_id: "clerk-adopt-1"
            - call: "POST /declarations/${decl_id}/environmental-reviews"
              payload: { determination_class: "NEGATIVE_DECLARATION", circulation_start_on: "2026-09-01T00:00:00Z", circulation_end_on: "2026-10-01T00:00:00Z" }
              as: RealPropertyOfficer
              captures: { env_id: "$.data.id" }
          trigger:
            - call: "POST /environmental-reviews/${env_id}/recirculate"
              payload: { recirculation_reason: "Traffic study revised after the initial circulation closed", circulation_start_on: "2026-10-30T00:00:00Z", circulation_end_on: "2026-12-01T00:00:00Z" }
              as: RealPropertyOfficer
            - call: "POST /environmental-reviews/${env_id}/recirculate"
              payload: { recirculation_reason: "Traffic study revised after the initial circulation closed", circulation_start_on: "2026-10-31T00:00:00Z", circulation_end_on: "2026-12-01T00:00:00Z" }
              as: RealPropertyOfficer
          assert:
            - "the first recirculate is HTTP 422 with data.error_id == ERR_RECIRCULATION_BUFFER_VIOLATION"
            - "after that rejection EnvironmentalReview.${env_id}.circulation_round == 1, circulation_start_on == 2026-09-01T00:00:00Z, circulation_end_on == 2026-10-01T00:00:00Z and recirculation_reason is null"
            - "the second recirculate is HTTP 200 with data.circulation_round == 2 and data.circulation_start_on == 2026-10-31T00:00:00Z"
            - "GET /declarations/${decl_id}/environmental-reviews returns total_count == 1"

  - section: rbac
    instances:
      - name: bidder_cannot_publish_offering_returns_unauthorized
        claim_type: exclusive_operations
        grounds:
          - roles.RealPropertyOfficer.exclusive_operations
          - validations[priority=3]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "POST /offerings/{id}/publish is exclusive to RealPropertyOfficer, and the role gate (priority 3) runs BEFORE path-resource existence (priority 9): a Bidder publishing a fabricated offering id gets HTTP 403 ERR_UNAUTHORIZED, while the RealPropertyOfficer issuing the identical call against the identical fabricated id gets HTTP 404 ERR_OFFERING_NOT_FOUND - so the 403 is proven to come from RBAC rather than from the missing row."
        test_recipe:
          setup:
            - "One Bidder so the Bidder role's entity-backed identity resolves."
            - "No DispositionOffering rows at all; the offering id used below is a fabricated UUID."
          setup_api_calls:
            - call: "POST /bidders"
              payload: { legal_name: "Canal Yard Holdings LLC", entity_type: "CORPORATION", contact_email: "deals@canalyard.example" }
              as: SystemAdministrator
              captures: { bidder_id: "$.data.id" }
          trigger:
            - call: "POST /offerings/00000000-0000-0000-0000-0000000000ff/publish"
              payload: {}
              as: Bidder
              as_user_id: "${bidder_id}"
            - call: "POST /offerings/00000000-0000-0000-0000-0000000000ff/publish"
              payload: {}
              as: RealPropertyOfficer
          assert:
            - "the Bidder attempt is HTTP 403 with data.error_id == ERR_UNAUTHORIZED"
            - "the RealPropertyOfficer attempt is HTTP 404 with data.error_id == ERR_OFFERING_NOT_FOUND"
            - "GET /offerings returns total_count == 0"

      - name: agency_representative_cannot_respond_to_another_agencys_notice
        claim_type: peer_roles
        grounds:
          - roles.AgencyRepresentative.identity
          - validations[priority=5]
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: "Two AgencyRepresentative principals hold the same role and the same endpoint grant, yet each is confined to its own agency's notice: agency B answering agency A's notice is HTTP 403 ERR_NOT_RESOURCE_OWNER even though B is itself a preference entity with a matching category, and A's own answer on the same notice then succeeds and mints the PreferenceOffer."
        test_recipe:
          setup:
            - "One custodian Agency plus two HOUSING_AUTHORITY preference agencies A and B, both is_preference_entity true with preference_category AFFORDABLE_HOUSING."
            - "One Parcel, one ADOPTED declaration and a notice round served to BOTH preference agencies with response_window_days 60."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "City of Riverbend", agency_type: "MUNICIPAL", contact_email: "realproperty@riverbend.gov" }
              as: SystemAdministrator
              captures: { cust_agency_id: "$.data.id" }
            - call: "POST /agencies"
              payload: { name: "Riverbend Housing Authority", agency_type: "HOUSING_AUTHORITY", contact_email: "clerk@rbha.gov", is_preference_entity: true, preference_category: "AFFORDABLE_HOUSING" }
              as: SystemAdministrator
              captures: { agency_a_id: "$.data.id" }
            - call: "POST /agencies"
              payload: { name: "Northside Housing Commission", agency_type: "HOUSING_AUTHORITY", contact_email: "clerk@northside.gov", is_preference_entity: true, preference_category: "AFFORDABLE_HOUSING" }
              as: SystemAdministrator
              captures: { agency_b_id: "$.data.id" }
            - call: "POST /parcels"
              payload: { apn: "APN-2693-171", address: "9 Canal Street", acreage: 3.1, zoning_code: "M-1", book_value_cents: 70000000, custodian_agency_id: "${cust_agency_id}" }
              as: RealPropertyOfficer
              captures: { parcel_id: "$.data.id" }
            - call: "POST /declarations"
              payload: { parcel_id: "${parcel_id}", justification: "Canal Street yard is surplus after depot consolidation." }
              as: RealPropertyOfficer
              captures: { decl_id: "$.data.id" }
            - call: "POST /declarations/${decl_id}/adopt"
              payload: { resolution_number: "RES-2026-271" }
              as: BoardClerk
              as_user_id: "clerk-adopt-1"
            - call: "POST /declarations/${decl_id}/issue-notices"
              payload:
                recipient_agency_ids: ["${agency_a_id}", "${agency_b_id}"]
                response_window_days: 60
              as: RealPropertyOfficer
            - call: "GET /notices"
              payload: { declaration_id: "${decl_id}", recipient_agency_id: "${agency_a_id}" }
              as: RealPropertyOfficer
              captures: { notice_a_id: "$.data[0].id" }
          trigger:
            - call: "POST /notices/${notice_a_id}/respond"
              payload: { response_type: "EXPRESS_INTEREST", claimed_preference_category: "AFFORDABLE_HOUSING", intended_use: "48-unit affordable rental development" }
              as: AgencyRepresentative
              as_user_id: "${agency_b_id}"
            - call: "POST /notices/${notice_a_id}/respond"
              payload: { response_type: "EXPRESS_INTEREST", claimed_preference_category: "AFFORDABLE_HOUSING", intended_use: "62-unit affordable rental development" }
              as: AgencyRepresentative
              as_user_id: "${agency_a_id}"
          assert:
            - "agency B's attempt is HTTP 403 with data.error_id == ERR_NOT_RESOURCE_OWNER"
            - "after that rejection StatutoryNotice.${notice_a_id}.status is still ISSUED and GET /preference-offers filtered by declaration_id ${decl_id} returns total_count == 0"
            - "agency A's attempt is HTTP 200 with data.status == INTEREST_EXPRESSED and data.intended_use == 62-unit affordable rental development"
            - "GET /preference-offers filtered by declaration_id ${decl_id} now returns total_count == 1 with offeror_agency_id ${agency_a_id}"
            - "SurplusDeclaration.${decl_id}.preference_offer_count == 1"

      - name: appraiser_cannot_report_on_an_engagement_of_another_appraiser
        claim_type: peer_roles
        grounds:
          - roles.Appraiser.identity
          - validations[priority=6]
          - errors[ERR_NOT_ENGAGED_APPRAISER]
        distinguishing_aspect: "The Appraiser role grant is per-engagement, not per-role: a second licensed Appraiser with the identical role and an identical ACTIVE licence cannot report on an appraisal engaged to the first, returning HTTP 403 ERR_NOT_ENGAGED_APPRAISER and leaving the appraisal ORDERED with appraised_value_cents null; the engaged appraiser's identical payload then succeeds."
        test_recipe:
          setup:
            - "One Agency, one Parcel and two Appraisers, both with ACTIVE licences."
