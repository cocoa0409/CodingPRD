      - name: typing_request_depends_on_donor_registry_cooperation_state
        grounds:
          - validations.priority_40_ERR_REGISTRY_NOT_COOPERATING
          - state_machines.MatchCandidate.IDENTIFIED_to_TYPING_REQUESTED
          - entities.Registry.fields.cooperation_status
          - endpoints.PATCH_registry_registries_id
        distinguishing_aspect: |
          A different entity pair (MatchCandidate, Registry) reached through DonorProfile: whether a
          candidate may be engaged at all depends on a mutable field two hops away. The same POST is
          rejected while the donor's home registry is SUSPENDED and accepted after the registry is
          patched back to ACTIVE, and the already-materialized candidate row is not rewritten by the
          suspension - only the transition is blocked.
        test_recipe:
          setup:
            - "international registry created ACTIVE, donor D2 registered under it, a patient and a DOMESTIC_AND_INTERNATIONAL search that materialized D2 as PRIMARY"
            - "the registry then patched to cooperation_status SUSPENDED after materialization"
            - "clock left at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /registry/registries"
              payload: { code: "ZKRD-DE", name: "German Bone Marrow Donor Registry", country_code: "DE", currency_code: "EUR", fx_rate_to_usd: 1.0850, is_domestic: false, cooperation_tier: 2, ct_response_deadline_hours: 168, cooperation_status: "ACTIVE" }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { reg_intl_id: "$.data.id" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_intl_id}", donor_code: "D-0002", age_years: 41, sex: "M", weight_kg: 84.0, cmv_status: "NEGATIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "11:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"], DQB1: ["06", "02"] }, consented_methods: ["PBSC", "MARROW"], ambiguous_loci: ["DQB1"], prior_donation_count: 1 }
              as: DonorRegistryLiaison
              as_user_id: "${reg_intl_id}"
              captures: { d2_id: "$.data.id" }
            - call: "POST /registry/patients"
              payload: { mrn: "MRN-0001", transplant_center_code: "TC-01", country_code: "US", diagnosis_code: "AML", urgency_tier: "HIGH", weight_kg: 70.0, cmv_status: "POSITIVE", hla_typing: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "02:01"] }, case_budget_cents: 5000000 }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { p_id: "$.data.id" }
            - call: "POST /registry/search-requests"
              payload: { patient_id: "${p_id}", search_scope: "DOMESTIC_AND_INTERNATIONAL" }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { sr_id: "$.data.id" }
            - call: "GET /registry/match-candidates"
              payload: { search_request_id: "${sr_id}" }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { mc2_id: "$.data[0].id", mc2_prelim: "$.data[0].preliminary_score" }
            - call: "PATCH /registry/registries/${reg_intl_id}"
              payload: { cooperation_status: "SUSPENDED" }
              as: RegistryOperations
              as_user_id: "ops-1"
          trigger:
            - call: "POST /registry/match-candidates/${mc2_id}/typing-requests"
              payload: { priority_flag: false }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { err_suspended: "$.data.error_id" }
            - call: "PATCH /registry/registries/${reg_intl_id}"
              payload: { cooperation_status: "ACTIVE" }
              as: RegistryOperations
              as_user_id: "ops-1"
            - call: "POST /registry/match-candidates/${mc2_id}/typing-requests"
              payload: { priority_flag: false }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { ct2_id: "$.data.id" }
          assert:
            - "the first typing request returns HTTP 422 with error_id ERR_REGISTRY_NOT_COOPERATING"
            - "the rejected call leaves MatchCandidate.${mc2_id}.status == IDENTIFIED with ct_attempt_count == 0 and creates no ConfirmatoryTypingRequest row"
            - "SearchRequest.${sr_id}.status is still SEARCHING after the rejection (it never reached PRIMARY_ENGAGED)"
            - "the suspension did not rewrite the candidate: MatchCandidate.${mc2_id}.preliminary_score is still 86.58 and candidate_role is still PRIMARY"
            - "after the registry returns to ACTIVE the identical request returns 201, ct_attempt_count becomes 1 and SearchRequest.${sr_id}.status becomes PRIMARY_ENGAGED"
            - "ConfirmatoryTypingRequest.${ct2_id}.deadline_at == \"2026-08-10T00:00:00Z\" (168h + 48h international grace from the unchanged clock)"

      - name: deferral_window_release_depends_on_donor_deferral_until_date
        grounds:
          - validations.priority_32_ERR_WINDOW_NOT_RELEASABLE
          - state_machines.DonorProfile.TEMPORARILY_DEFERRED_to_AVAILABLE
          - entities.DonorUnavailability.fields.reason
          - entities.DonorProfile.fields.deferral_until
          - endpoints.DELETE_registry_donors_id_unavailability_windows_windowId
        distinguishing_aspect: |
          A third distinct entity pair (DonorUnavailability, DonorProfile) with a temporal guard: a
          system-created DEFERRAL window may only be released once the current logical date is strictly
          later than the donor's deferral_until, so the same DELETE is a 409 on 2026-08-01 and a 204 on
          2026-10-01, and only the successful release flips the donor back to AVAILABLE and clears
          deferral_until.
