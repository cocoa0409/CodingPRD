            - "SettlementStatement.${s1_id}.gross_pay_cents == 0"
            - "len(SettlementStatement.${s1_id}.lines) == 0"
            - "SettlementStatement.${s2_id}.status == DRAFT"
            - "SettlementStatement.${s2_id}.period_start == 2026-08-15"

      - name: rehaul_selector_prefers_net_yield_over_the_higher_base_rate
        claim_type: selector_policy
        grounds:
          - calculations.rehaul_alternate_selection
          - entities.Load.fields.rehaul_of_load_id
          - entities.Load.fields.rehaul_status
          - state_machines.Load.AT_MILL_to_REJECTED
          - endpoints[GET /loads]
        distinguishing_aspect: |
          The ranking expression is net yield, not mill price: Mill B pays 4400 cents/ton at
          40 miles for 4400*28.32 - 40*85 = 121208 cents, while Mill C pays a higher 4600
          cents/ton but sits 130 miles out for 4600*28.32 - 130*85 = 119222 cents. The selector
          must therefore create the rehaul against Mill B's contract, and the naive
          highest-base-rate reading (Mill C) is wrong.
