            - call: "POST /lessors/${lessor_id}/leases/${lease1_id}/equipment"
              payload: { serial_number: "DUP-1", description: "Press", original_cost_cents: 500000 }
              as: FundingOfficer
              captures: { unit1_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/leases/${lease1_id}/book"
              payload: { expected_lease_version: "${lease1_v}" }
              as: FundingOfficer
            - call: "POST /lessors/${lessor_id}/leases/${lease1_id}/fund"
