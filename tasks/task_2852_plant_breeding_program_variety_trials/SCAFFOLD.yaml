scenario: |
  2852. Plant Breeding Program & Variety Trials (seed company research and development): breeding objective definition by market with yield, disease resistance and quality traits, crossing block planning, nursery management and generation advancement across winter and summer nurseries, phenotyping data collection with plot design, replication and statistical analysis, multi-location yield trial networks with environment classification and stability analysis, trait integration through marker-assisted selection and backcrossing programs, regulatory and stewardship requirements for traited varieties with grower agreements, advancement decisions at each stage with resource allocation and pipeline reporting, pre-commercial seed increase and launch volume planning

domain_name: plant-breeding-variety-trials

# Endpoints are declared at the API root; there is no version or tenant path
# prefix. Every path below is absolute and complete.
api_prefix: ""

# DATE/TIME WIRE FORMAT (applies to every field typed `datetime` below).
# Two shapes only, and each field uses exactly one of them:
#   * date-only fields  - `YYYY-MM-DD`, no time part, no zone. All agronomic
#     calendar fields are date-only: NurseryPlanting.sow_date /
#     expected_harvest_date / occupancy_end_date / actual_harvest_date,
#     TrialSite.season_start_date / season_end_date,
#     TrialEntry.planting_window_start / planting_window_end,
#     StewardshipAgreement.effective_from / effective_to.
#   * instants - `YYYY-MM-DDTHH:MM:SSZ` (UTC, second precision, no fractional
#     seconds). Only the common `created_at` / `updated_at` fields and the
#     logical clock's `current_utc` use this shape.
# A date-only field is compared against the logical clock by taking the
# clock's UTC calendar date.

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: posture-driven gating
  difficulty_level: expert
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: graph
  # BreedingLine references itself twice (female_parent_line_id,
  # male_parent_line_id) forming a pedigree DAG; TrialEntry is a junction
  # entity joining TrialSeries x BreedingLine x TrialSite; BackcrossProject
  # joins two BreedingLine rows. No URL nesting expresses ownership except for
  # true containment (objectives under programs, entries under series).

  state_machine_shape: parallel
  # BreedingLine carries two independent state dimensions on one row
  # (pipeline_stage x stewardship_status). StewardshipAgreement is cyclic
  # (SUBMITTED -> CHANGES_REQUESTED -> SUBMITTED, revision_round++).
  # NurseryPlanting branches (PLANTED -> HARVESTED | FAILED) with divergent
  # side-effect sets. TrialSeries is compound (PLANTED -> DATA_COMPLETE is
  # derived from the aggregate state of its TrialEntry children).

  relationship_patterns:
    - one_to_many          # BreedingProgram -> BreedingObjective / TrialSeries
    - many_to_many         # TrialEntry joins TrialSeries x BreedingLine x TrialSite
    - self_referential     # BreedingLine.female_parent_line_id / male_parent_line_id
    - cross_aggregate      # BackcrossProject conversion writes BreedingLine trait scores

  role_model: peer_roles
  # Seven peer roles own disjoint resource families. One segregation-of-duties
  # constraint is layered on top: the RegulatoryOfficer X-User-ID that approved
  # a StewardshipAgreement may not be the X-User-ID that suspends it.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: BreedingProgram
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: program display name
        constraints: 1..120 chars
      - name: crop_code
        type: enum
        source: input
        description: crop the program breeds
        constraints: "one of MAIZE, SOYBEAN, WHEAT, CANOLA"
      - name: market_zone
        type: string
        source: input
        description: commercial zone the program serves (e.g. US_MIDWEST)
      - name: total_plot_budget
        type: integer
        source: input
        description: total field plots the program may commit across nurseries and trials in a season
        constraints: ">= 1"
      - name: total_budget_usd
        type: number
        source: input
        description: total trialing budget in USD available to the program
        constraints: "> 0, 2 decimals"
      - name: committed_plot_count
        type: integer
        source: computed
        description: "conserved plot commitment, summed over exactly three sources: (1) plot_count over TrialEntry rows whose trial_series_id belongs to this program and whose status IN {ENTERED, PLANTED, HARVESTED}; (2) plot_count over NurseryPlanting rows whose line_id belongs to this program and whose status IN {SCHEDULED, PLANTED}; (3) granted_plots over AdvancementDecision rows whose line_id belongs to this program, whose decision = ADVANCE, whose is_superseded = false and whose line's pipeline_stage != DISCARDED"
        default: 0
      - name: plot_budget_remaining
        type: integer
        source: computed
        description: total_plot_budget - committed_plot_count
      - name: committed_budget_usd
        type: number
        source: computed
        description: "sum of total_trial_cost_usd over TrialSeries rows of this program whose status IN {PLANTED, DATA_COMPLETE, ANALYZED, CLOSED}"
        default: 0
      - name: active_line_count
        type: integer
        source: computed
        description: "count of BreedingLine rows with this program_id whose pipeline_stage NOT IN {DISCARDED, COMMERCIAL}"
        default: 0
      - name: pre_commercial_units_bags
        type: integer
        source: computed
        description: "sum of planned_units_bags over SeedIncreaseLot rows whose line_id belongs to this program and whose status IN {RESERVED, IN_PRODUCTION, COMPLETED}; ON_HOLD and CANCELLED lots are excluded"
        default: 0
      - name: status
        type: enum
        source: system
        description: program lifecycle
        default: ACTIVE
        constraints: "one of ACTIVE, CLOSED"

  - name: BreedingObjective
    parent: BreedingProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> BreedingProgram.id; owning program, taken from the path"
      - name: market_segment
        type: string
        source: input
        description: market segment this objective targets (e.g. MX_NORTH)
      - name: target_yield_kg_per_ha
        type: number
        source: input
        description: yield the market segment requires, in kg/ha
        constraints: "> 0"
      - name: required_disease_resistances
        type: array
        source: input
        description: "trait codes a line must resist; each element one of GLS, NCLB, SCLB, RUST, SDS, PHYTOPHTHORA; may be empty"
      - name: min_resistance_score
        type: integer
        source: input
        description: minimum 1-9 resistance score that counts as resistant
        constraints: "1..9"
      - name: quality_trait_specs
        type: object
        source: input
        description: "map of quality spec code to numeric threshold; spec codes are TEST_WEIGHT_MIN, PROTEIN_MIN, OIL_MIN, MOISTURE_MAX; may be empty"
      - name: yield_weight
        type: number
        source: input
        description: weight of the yield component in the advancement index
        constraints: "0..1, 2 decimals"
      - name: disease_weight
        type: number
        source: input
        description: weight of the disease component in the advancement index
        constraints: "0..1, 2 decimals"
      - name: quality_weight
        type: number
        source: input
        description: weight of the quality component in the advancement index
        constraints: "0..1, 2 decimals; yield_weight + disease_weight + quality_weight MUST equal exactly 1.00"
      - name: min_advancement_index
        type: number
        source: input
        description: CUMULATIVE advancement index a line must reach to be advanced against this objective
      - name: min_generation_number
        type: integer
        source: input
        description: earliest generation number that may enter a yield trial
        constraints: ">= 2"

  - name: NurseryBlock
    parent: null
    common_fields: true
    fields:
      - name: block_code
        type: string
        source: input
        description: unique block code
        constraints: unique across NurseryBlock
      - name: nursery_type
        type: enum
        source: input
        description: "WINTER = counter-season off-shore nursery, sow month IN {10, 11, 12, 1, 2}; SUMMER = home-season nursery, sow month IN {4, 5, 6, 7, 8}"
        constraints: "one of WINTER, SUMMER"
      - name: location_code
        type: string
        source: input
        description: physical nursery location code (e.g. CL_QUILLOTA)
      - name: plot_count
        type: integer
        source: input
        description: number of plots physically available in the block
        constraints: ">= 1"
      - name: fallow_buffer_days
        type: integer
        source: input
        description: mandatory fallow days after a planting's expected_harvest_date before the block may be re-sown
        default: 14
        constraints: ">= 0"
      - name: occupancy_status
        type: enum
        source: computed
        description: "AVAILABLE unless the logical clock date falls inside an occupancy interval of a NurseryPlanting on this block with status IN {SCHEDULED, PLANTED, HARVESTED, FAILED}: OCCUPIED when clock_date IN [sow_date, expected_harvest_date), FALLOW when clock_date IN [expected_harvest_date, occupancy_end_date). When intervals of several plantings match, the one with the smallest sow_date wins (ties broken by created_at ASC)."
        default: AVAILABLE
        constraints: "one of AVAILABLE, OCCUPIED, FALLOW"

  - name: CrossingBlock
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> BreedingProgram.id; program that planned this crossing block"
      - name: nursery_block_id
        type: string
        source: input
        description: "FK -> NurseryBlock.id; nursery block where the crosses are made"
      - name: season_code
        type: string
        source: input
        description: nursery season label (e.g. 2026W)
      - name: planned_cross_count
        type: integer
        source: input
        description: number of crosses planned in this block
        constraints: ">= 1"
      - name: realized_cross_count
        type: integer
        source: system
        description: crosses actually made, set by the pollinate transition
        default: 0
      - name: progeny_line_count
        type: integer
        source: computed
        description: "count of BreedingLine rows whose origin_block_id equals this block's id and whose pipeline_stage != DISCARDED"
        default: 0
      - name: status
        type: enum
        source: system
        description: crossing block lifecycle
        default: PLANNED
        constraints: "one of PLANNED, POLLINATED, CLOSED"

  - name: BreedingLine
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> BreedingProgram.id; owning program"
      - name: objective_id
        type: string
        source: input
        description: "FK -> BreedingObjective.id; objective this line is bred against; MUST belong to the same program_id"
      - name: origin_block_id
        type: string
        source: system
        description: "FK -> CrossingBlock.id; crossing block that produced this line; null for founder lines created via POST /breeding-lines"
        default: null
      - name: female_parent_line_id
        type: string
        source: input
        description: "FK -> BreedingLine.id; female parent; null for founder lines"
        default: null
      - name: male_parent_line_id
        type: string
        source: input
        description: "FK -> BreedingLine.id; male parent; null for founder lines"
        default: null
      - name: designation
        type: string
        source: input
        description: breeder designation of the line
        constraints: unique within program_id
      - name: generation_number
        type: integer
        source: input
        description: selfing generation (2 = F2, 3 = F3, ...); advanced by successful nursery harvests
        constraints: ">= 2"
      - name: pipeline_stage
        type: enum
        source: system
        description: "state dimension 1 - pipeline position, independent of stewardship_status"
        default: NURSERY
        constraints: "one of NURSERY, STAGE_1, STAGE_2, STAGE_3, PRE_COMMERCIAL, COMMERCIAL, DISCARDED"
      - name: stewardship_status
        type: enum
        source: system
        description: "state dimension 2 - regulatory/stewardship posture, mirrors the line's StewardshipAgreement and evolves independently of pipeline_stage"
        default: NOT_REQUIRED
        constraints: "one of NOT_REQUIRED, PENDING, APPROVED, SUSPENDED"
      - name: disease_resistance_scores
        type: object
        source: input
        description: "map of disease trait code to integer 1-9 score; may be empty; BackcrossProject conversion writes entries into this map"
        default: {}
      - name: quality_trait_values
        type: object
        source: input
        description: "map of quality trait code (TEST_WEIGHT, PROTEIN, OIL, MOISTURE) to measured numeric value; may be empty"
        default: {}
      - name: seed_inventory_g
        type: integer
        source: input
        description: unallocated seed on hand in grams; debited by seed increase reservations, credited by nursery harvests
        default: 0
        constraints: ">= 0"
      - name: cumulative_seed_produced_g
        type: integer
        source: computed
        description: "conserved total = seed_inventory_g at creation plus every harvested_seed_g ever credited to this line; never decreases"
        default: 0
      - name: nursery_cycles_completed
        type: integer
        source: computed
        description: count of NurseryPlanting rows for this line with status HARVESTED
        default: 0
      - name: advancement_readiness
        type: enum
        source: computed
        description: "READY when generation_number >= objective.min_generation_number, else NOT_READY"
        default: NOT_READY
        constraints: "one of NOT_READY, READY"
      - name: advancement_index_provisional
        type: number
        source: computed
        description: "PROVISIONAL variant of calculations.line_advancement_index; null until the line has at least one of the three components available; recomputed on analysis creation, on disease_resistance_scores change and on quality_trait_values change"
        default: null
      - name: reserved_seed_g
        type: integer
        source: computed
        description: "sum of allocated_seed_g over SeedIncreaseLot rows of this line whose status IN {RESERVED, IN_PRODUCTION, ON_HOLD}; COMPLETED and CANCELLED lots are excluded"
        default: 0
      - name: consumed_seed_g
        type: integer
        source: computed
        description: "sum of allocated_seed_g over SeedIncreaseLot rows of this line whose status = COMPLETED, i.e. parent seed physically sown out in a finished increase. Together with the two fields above it closes the seed-mass conservation invariant: seed_inventory_g + reserved_seed_g + consumed_seed_g == cumulative_seed_produced_g at every observable moment"
        default: 0
      - name: planned_launch_units_bags
        type: integer
        source: computed
        description: "sum of planned_units_bags over SeedIncreaseLot rows of this line whose status IN {RESERVED, IN_PRODUCTION, COMPLETED}; ON_HOLD and CANCELLED excluded"
        default: 0

  - name: NurseryPlanting
    parent: null
    common_fields: true
    fields:
      - name: nursery_block_id
        type: string
        source: input
        description: "FK -> NurseryBlock.id; block the planting occupies"
      - name: line_id
        type: string
        source: input
        description: "FK -> BreedingLine.id; line being advanced"
      - name: sow_date
        type: datetime
        source: input
        description: "sowing date, date-only ISO 8601 (YYYY-MM-DD)"
      - name: expected_harvest_date
        type: datetime
        source: input
        description: "planned harvest date, date-only ISO 8601; MUST be strictly after sow_date"
      - name: occupancy_end_date
        type: datetime
        source: computed
        description: "expected_harvest_date + NurseryBlock.fallow_buffer_days, date-only; exclusive end of the block occupancy interval"
      - name: plot_count
        type: integer
        source: input
        description: plots the planting occupies in the block
        constraints: ">= 1"
      - name: actual_harvest_date
        type: datetime
        source: input
        description: "date-only ISO 8601, set by the harvest transition"
        default: null
      - name: harvested_seed_g
        type: integer
        source: input
        description: grams of seed harvested, set by the harvest transition
        default: null
      - name: generation_advanced_to
        type: integer
        source: computed
        description: "generation_number the line reached because of this planting; null when the harvest did not advance the generation"
        default: null
      - name: status
        type: enum
        source: system
        description: planting lifecycle
        default: SCHEDULED
        constraints: "one of SCHEDULED, PLANTED, HARVESTED, FAILED"

  - name: TrialSite
    parent: null
    common_fields: true
    fields:
      - name: site_code
        type: string
        source: input
        description: unique site code
        constraints: unique across TrialSite
      - name: environment_class
        type: enum
        source: input
        description: environment classification used by the stability analysis
        constraints: "one of HIGH_YIELD_IRRIGATED, RAINFED_TEMPERATE, DROUGHT_STRESS, DISEASE_NURSERY"
      - name: total_plot_capacity
        type: integer
        source: input
        description: plots the site can host on any single day
        constraints: ">= 1"
      - name: plot_cost_usd
        type: number
        source: input
        description: cost of one plot at this site in USD
        constraints: "> 0, 2 decimals"
      - name: season_start_date
        type: datetime
        source: input
        description: "first date of the site's trialing season, date-only ISO 8601"
      - name: season_end_date
        type: datetime
        source: input
        description: "last date of the site's trialing season, date-only ISO 8601; MUST be strictly after season_start_date"
      - name: peak_committed_plot_count
        type: integer
        source: computed
        description: "maximum, over every date d in [season_start_date, season_end_date], of the sum of plot_count over TrialEntry rows at this site whose status IN {ENTERED, PLANTED, HARVESTED} and whose closed interval [planting_window_start, planting_window_end] contains d; 0 when no such entry exists"
        default: 0
      - name: available_plot_count
        type: integer
        source: computed
        description: total_plot_capacity - peak_committed_plot_count; never negative because entry creation rejects any insertion that would push the peak above capacity
      - name: capacity_posture
        type: enum
        source: computed
        description: "FROZEN when peak_committed_plot_count / total_plot_capacity >= 1.00; RESTRICTED when the ratio >= 0.85 and < 1.00; OPEN otherwise. Ratio compared as an exact decimal, never as a float."
        default: OPEN
        constraints: "one of OPEN, RESTRICTED, FROZEN"

  - name: TrialSeries
    parent: BreedingProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> BreedingProgram.id; program running this trial network"
      - name: stage
        type: enum
        source: input
        description: pipeline stage this trial network serves
        constraints: "one of STAGE_1, STAGE_2, STAGE_3"
      - name: season_year
        type: integer
        source: input
        description: harvest year of the trialing season
      - name: plot_design
        type: enum
        source: input
        description: experimental design used at every location
        constraints: "one of RCBD, AUGMENTED, ALPHA_LATTICE"
      - name: replication_count
        type: integer
        source: input
        description: replications per entry per location
        constraints: ">= 2"
      - name: min_locations
        type: integer
        source: input
        description: distinct TrialSite count required before the network may be planted; 1 is legal for a single-location screening nursery series
        constraints: ">= 1"
      - name: entry_count
        type: integer
        source: computed
        description: "count of TrialEntry rows of this series whose status IN {ENTERED, PLANTED, HARVESTED}"
        default: 0
      - name: location_count
        type: integer
        source: computed
        description: "count of distinct trial_site_id values over TrialEntry rows of this series whose status IN {ENTERED, PLANTED, HARVESTED}"
        default: 0
      - name: plot_cost_subtotal_usd
        type: number
        source: computed
        description: "calculations.trial_series_cost_allocation step 1; null until the series is planted"
        default: null
      - name: management_fee_usd
        type: number
        source: computed
        description: "calculations.trial_series_cost_allocation step 3; null until the series is planted"
        default: null
      - name: total_trial_cost_usd
        type: number
        source: computed
        description: "calculations.trial_series_cost_allocation step 4; null until the series is planted"
        default: null
      - name: status
        type: enum
        source: system
        description: trial network lifecycle; DATA_COMPLETE is derived from the aggregate state of the series' TrialEntry children
        default: PLANNING
        constraints: "one of PLANNING, PLANTED, DATA_COMPLETE, ANALYZED, CLOSED"

  - name: TrialEntry
    parent: TrialSeries
    common_fields: true
    fields:
      - name: trial_series_id
        type: string
        source: input
        description: "FK -> TrialSeries.id; series this entry belongs to, taken from the path"
      - name: line_id
        type: string
        source: input
        description: "FK -> BreedingLine.id; line under test"
      - name: trial_site_id
        type: string
        source: input
        description: "FK -> TrialSite.id; location hosting this entry"
      - name: plot_count
        type: integer
        source: input
        description: plots this entry occupies at the site
        constraints: ">= 1; MUST be an exact multiple of TrialSeries.replication_count"
      - name: planting_window_start
        type: datetime
        source: input
        description: "first date the entry occupies plots, date-only ISO 8601; MUST be >= TrialSite.season_start_date"
      - name: planting_window_end
        type: datetime
        source: input
        description: "last date the entry occupies plots, date-only ISO 8601, inclusive; MUST be >= planting_window_start and <= TrialSite.season_end_date"
      - name: valid_rep_count
        type: integer
        source: computed
        description: "count of PhenotypeObservation rows on this entry with trait_code = YIELD_KG_PLOT, qc_status = ACCEPTED and is_outlier = false"
        default: 0
      - name: plot_mean_yield_kg
        type: number
        source: computed
        description: "calculations.entry_yield_rollup step 2, 3 decimals; null before finalize"
        default: null
      - name: yield_kg_per_ha
        type: number
        source: computed
        description: "calculations.entry_yield_rollup step 3, 2 decimals; null before finalize"
        default: null
      - name: withdrawal_reason
        type: string
        source: input
        description: free-text reason recorded by withdraw or invalidate
        default: null
      - name: status
        type: enum
        source: system
        description: entry lifecycle
        default: ENTERED
        constraints: "one of ENTERED, PLANTED, HARVESTED, WITHDRAWN, INVALIDATED"

  - name: PhenotypeObservation
    parent: TrialEntry
    common_fields: false
    fields:
      - name: trial_entry_id
        type: string
        source: input
        description: "FK -> TrialEntry.id; entry the plot observation belongs to, taken from the path"
      - name: trait_code
        type: enum
        source: input
        description: measured trait
        constraints: "one of YIELD_KG_PLOT, TEST_WEIGHT, PROTEIN_PCT, OIL_PCT, MOISTURE_PCT, DISEASE_SEVERITY"
      - name: rep_number
        type: integer
        source: input
        description: replication this observation belongs to
        constraints: "1..TrialSeries.replication_count; (trial_entry_id, trait_code, rep_number) MUST be unique"
      - name: value
        type: number
        source: input
        description: measured value, 3 decimals
        constraints: ">= 0"
      - name: qc_status
        type: enum
        source: input
        description: quality-control verdict assigned at capture time
        default: ACCEPTED
        constraints: "one of ACCEPTED, REJECTED"
      - name: is_outlier
        type: boolean
        source: input
        description: analyst flag excluding the plot from every rollup
        default: false
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the TrialManager that recorded the observation

  - name: TrialSeriesAnalysis
    parent: TrialSeries
    common_fields: true
    fields:
      - name: trial_series_id
        type: string
        source: input
        description: "FK -> TrialSeries.id; series analysed, taken from the path"
      - name: variant
        type: enum
        source: input
        description: inclusion-set variant of calculations.series_adjusted_entry_mean
        constraints: "one of UNBALANCED_INCLUSIVE, BALANCED_CORE"
      - name: included_location_count
        type: integer
        source: computed
        description: number of distinct TrialSite ids in the variant's inclusion set
      - name: included_line_count
        type: integer
        source: computed
        description: number of distinct BreedingLine ids with at least one included entry
      - name: entry_means
        type: array
        source: computed
        description: "one object per included line: { line_id, adjusted_mean_kg_per_ha, included_location_count, stability_regression_b, deviation_mse, stability_class }; ordered by adjusted_mean_kg_per_ha DESC, ties broken by the line's created_at ASC"
      - name: environment_index
        type: array
        source: computed
        description: "one object per included site: { trial_site_id, environment_class, index_kg_per_ha }; ordered by index_kg_per_ha DESC, ties broken by the site's created_at ASC"
      - name: is_superseded
        type: boolean
        source: computed
        description: true once a later analysis of the same variant supersedes this row
        default: false
      - name: run_by_user_id
        type: string
        source: system
        description: X-User-ID of the TrialManager that ran the analysis

  - name: AdvancementDecision
    parent: null
    common_fields: true
    fields:
      - name: line_id
        type: string
        source: input
        description: "FK -> BreedingLine.id; line the decision applies to"
      - name: trial_series_id
        type: string
        source: input
        description: "FK -> TrialSeries.id; analysed series the decision is based on"
      - name: decision
        type: enum
        source: input
        description: branch taken by the committee
        constraints: "one of ADVANCE, HOLD, DISCARD"
      - name: granted_plots
        type: integer
        source: input
        description: plots allocated to the line for the next stage; MUST be 0 unless decision = ADVANCE
        constraints: ">= 0"
      - name: decision_index_value
        type: number
        source: computed
        description: "CUMULATIVE variant of calculations.line_advancement_index frozen at decision time"
      - name: from_stage
        type: enum
        source: computed
        description: line's pipeline_stage immediately before the decision
      - name: to_stage
        type: enum
        source: computed
        description: line's pipeline_stage immediately after the decision
      - name: rationale
        type: string
        source: input
        description: committee note
        default: null
      - name: is_superseded
        type: boolean
        source: computed
        description: true once a later decision for the same (line_id, trial_series_id) pair is recorded
        default: false
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the PipelineCommittee member that recorded the decision

  - name: StewardshipAgreement
    parent: BreedingLine
    common_fields: true
    fields:
      - name: line_id
        type: string
        source: input
        description: "FK -> BreedingLine.id; traited line the agreement covers, taken from the path"
      - name: approved_markets
        type: array
        source: input
        description: "market codes the traited line may be sold into; non-empty array of strings"
      - name: regulatory_dossier_ref
        type: string
        source: input
        description: regulatory dossier reference number
      - name: grower_agreement_ref
        type: string
        source: input
        description: grower stewardship agreement template reference
      - name: effective_from
        type: datetime
        source: input
        description: "first date the agreement is effective, date-only ISO 8601; MUST be >= the logical clock date at creation"
      - name: effective_to
        type: datetime
        source: input
        description: "last date the agreement is effective, date-only ISO 8601; MUST be strictly after effective_from"
      - name: revision_round
        type: integer
        source: computed
        description: incremented every time the agreement re-enters SUBMITTED from CHANGES_REQUESTED
        default: 0
      - name: requested_changes
        type: string
        source: input
        description: change request text recorded by a CHANGES_REQUESTED review
        default: null
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProgramLead that last submitted the agreement
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the RegulatoryOfficer that approved the agreement
        default: null
      - name: suspension_reason
        type: string
        source: input
        description: reason captured by the suspend transition
        default: null
      - name: status
        type: enum
        source: system
        description: regulatory review lifecycle, cyclic between SUBMITTED and CHANGES_REQUESTED
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, CHANGES_REQUESTED, APPROVED, SUSPENDED"

  - name: SeedIncreaseLot
    parent: BreedingLine
    common_fields: true
    fields:
      - name: line_id
        type: string
        source: input
        description: "FK -> BreedingLine.id; line being increased"
      - name: target_market
        type: string
        source: input
        description: market code the launch volume is destined for; MUST appear in the line's APPROVED StewardshipAgreement.approved_markets
      - name: market_allocations
        type: array
        source: input
        description: "non-empty array of { market_code: string, demand_kg: number } objects; drives calculations.seed_increase_volume_plan"
      - name: launch_year
        type: integer
        source: input
        description: commercial launch year
      - name: planned_units_bags
        type: integer
        source: computed
        description: "calculations.seed_increase_volume_plan step 2 - per-allocation ceil, then sum"
      - name: allocated_seed_g
        type: integer
        source: computed
        description: "calculations.seed_increase_volume_plan step 3 - parent seed debited from BreedingLine.seed_inventory_g"
      - name: hold_reason
        type: string
        source: input
        description: reason captured when the lot is put ON_HOLD or CANCELLED
        default: null
      - name: status
        type: enum
        source: system
        description: seed increase lifecycle
        default: RESERVED
        constraints: "one of RESERVED, IN_PRODUCTION, ON_HOLD, COMPLETED, CANCELLED"

  - name: BackcrossProject
    parent: null
    common_fields: true
    fields:
      - name: recurrent_line_id
        type: string
        source: input
        description: "FK -> BreedingLine.id; recurrent parent that receives the trait"
      - name: donor_line_id
        type: string
        source: input
        description: "FK -> BreedingLine.id; donor of the target trait; MUST differ from recurrent_line_id"
      - name: target_trait_code
        type: enum
        source: input
        description: trait being introgressed
        constraints: "one of GLS, NCLB, SCLB, RUST, SDS, PHYTOPHTHORA"
      - name: marker_assisted
        type: boolean
        source: input
        description: whether marker-assisted selection is applied at each cycle
      - name: bc_generation
        type: integer
        source: computed
        description: backcross generation; 1 at creation, incremented by every marker cycle
        default: 1
      - name: target_marker_present
        type: boolean
        source: input
        description: whether the target-trait marker was detected in the latest cycle
        default: false
      - name: recurrent_genome_pct
        type: number
        source: computed
        description: "calculations.marker_recovery_pct, 3 decimals"
      - name: status
        type: enum
        source: system
        description: introgression lifecycle
        default: ACTIVE
        constraints: "one of ACTIVE, CONVERTED, TERMINATED"

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:

  # ---- PARALLEL DIMENSIONS on one row: pipeline_stage x stewardship_status ----
  - entity: BreedingLine
    initial_state: "pipeline_stage=NURSERY, stewardship_status=NOT_REQUIRED"
    terminal_states: [DISCARDED]
    note: |
      Two independent state dimensions live on the same BreedingLine row.
      Dimension A (pipeline_stage) is driven only by AdvancementDecision rows.
      Dimension B (stewardship_status) is driven only by StewardshipAgreement
      transitions. Neither dimension gates the other's transitions, and the
      pairs (STAGE_2, SUSPENDED), (PRE_COMMERCIAL, NOT_REQUIRED) and
      (STAGE_1, APPROVED) are all legal combined states. The only coupling is
      that pipeline_stage = DISCARDED is terminal for BOTH dimensions:
      stewardship_status is frozen at whatever value it held.
    transitions:
      # --- dimension A: pipeline_stage ---
      - from: "pipeline_stage=NURSERY"
        to: "pipeline_stage=STAGE_1"
        trigger: "POST /advancement-decisions with decision=ADVANCE"
        actor: PipelineDirector
        preconditions:
          - "line.pipeline_stage = NURSERY"
          - "line.advancement_readiness = READY"
          - "referenced TrialSeries.status = ANALYZED and TrialSeries.stage = STAGE_1"
          - "the line has >= 1 TrialEntry with status = HARVESTED in that series"
          - "calculations.line_advancement_index CUMULATIVE >= objective.min_advancement_index"
          - "granted_plots <= program.plot_budget_remaining"
        side_effects:
          - "sets AdvancementDecision.from_stage=NURSERY, to_stage=STAGE_1, decision_index_value = CUMULATIVE index"
          - "increments BreedingLine.version by 1 and refreshes BreedingLine.updated_at"
          - "any earlier AdvancementDecision for the same (line_id, trial_series_id) is set is_superseded=true, releasing its granted_plots from BreedingProgram.committed_plot_count"
          - "BreedingProgram.committed_plot_count increases by granted_plots; plot_budget_remaining recomputed"
      - from: "pipeline_stage=STAGE_1"
        to: "pipeline_stage=STAGE_2"
        trigger: "POST /advancement-decisions with decision=ADVANCE"
        actor: PipelineDirector
        preconditions:
          - "line.pipeline_stage = STAGE_1"
          - "referenced TrialSeries.status = ANALYZED and TrialSeries.stage = STAGE_1"
          - "calculations.line_advancement_index CUMULATIVE >= objective.min_advancement_index"
          - "granted_plots <= program.plot_budget_remaining"
        side_effects:
          - "same four side effects as NURSERY -> STAGE_1, with from_stage=STAGE_1, to_stage=STAGE_2"
      - from: "pipeline_stage=STAGE_2"
        to: "pipeline_stage=STAGE_3"
        trigger: "POST /advancement-decisions with decision=ADVANCE"
        actor: PipelineDirector
        preconditions:
          - "line.pipeline_stage = STAGE_2"
          - "referenced TrialSeries.status = ANALYZED and TrialSeries.stage = STAGE_2"
          - "calculations.line_advancement_index CUMULATIVE >= objective.min_advancement_index"
          - "granted_plots <= program.plot_budget_remaining"
        side_effects:
          - "same four side effects, with from_stage=STAGE_2, to_stage=STAGE_3"
      - from: "pipeline_stage=STAGE_3"
        to: "pipeline_stage=PRE_COMMERCIAL"
        trigger: "POST /advancement-decisions with decision=ADVANCE"
        actor: PipelineDirector
        preconditions:
          - "line.pipeline_stage = STAGE_3"
          - "referenced TrialSeries.status = ANALYZED and TrialSeries.stage = STAGE_3"
          - "calculations.line_advancement_index CUMULATIVE >= objective.min_advancement_index"
          - "granted_plots <= program.plot_budget_remaining"
        side_effects:
          - "same four side effects, with from_stage=STAGE_3, to_stage=PRE_COMMERCIAL"
      - from: "pipeline_stage=PRE_COMMERCIAL"
        to: "pipeline_stage=COMMERCIAL"
        trigger: "POST /advancement-decisions with decision=ADVANCE"
        actor: PipelineDirector
        preconditions:
          - "line.pipeline_stage = PRE_COMMERCIAL"
          - "referenced TrialSeries.status = ANALYZED and TrialSeries.stage = STAGE_3"
          - "line.stewardship_status = APPROVED"
          - "line.planned_launch_units_bags >= 1"
          - "calculations.line_advancement_index CUMULATIVE >= objective.min_advancement_index"
        side_effects:
          - "same four side effects, with from_stage=PRE_COMMERCIAL, to_stage=COMMERCIAL"
          - "BreedingProgram.active_line_count decreases by 1 because COMMERCIAL lines leave the active pipeline"
      - from: "pipeline_stage IN {NURSERY, STAGE_1, STAGE_2, STAGE_3, PRE_COMMERCIAL}"
        to: "pipeline_stage unchanged"
        trigger: "POST /advancement-decisions with decision=HOLD"
        actor: PipelineDirector
        preconditions:
          - "line.pipeline_stage != DISCARDED"
          - "referenced TrialSeries.status = ANALYZED"
          - "granted_plots = 0"
        side_effects:
          - "records the decision with from_stage = to_stage = the current stage; no stage change"
          - "increments BreedingLine.version by 1"
          - "any earlier decision for the same (line_id, trial_series_id) is superseded and its granted_plots released from BreedingProgram.committed_plot_count"
        note: "HOLD is the branch that keeps the line in the pipeline without allocating plots."
      - from: "pipeline_stage IN {NURSERY, STAGE_1, STAGE_2, STAGE_3, PRE_COMMERCIAL}"
        to: "pipeline_stage=DISCARDED"
        trigger: "POST /advancement-decisions with decision=DISCARD"
        actor: PipelineDirector
        preconditions:
          - "line.pipeline_stage != DISCARDED"
          - "referenced TrialSeries.status = ANALYZED"
          - "granted_plots = 0"
        side_effects:
          - "L1: BreedingLine.pipeline_stage becomes DISCARDED, version += 1; stewardship_status is frozen at its current value"
          - "L2 (caused by L1): every TrialEntry of this line with status IN {ENTERED, PLANTED} becomes WITHDRAWN with withdrawal_reason = 'LINE_DISCARDED', processed in created_at ASC order; each entry's version += 1"
          - "L3 (caused by each L2 withdrawal): the entry's TrialSite.peak_committed_plot_count is recomputed over the remaining active entries, available_plot_count is recomputed, and capacity_posture is re-derived (may relax FROZEN -> RESTRICTED -> OPEN)"
          - "L4 (caused by L3): BreedingProgram.committed_plot_count drops by the withdrawn plot_count, plot_budget_remaining is recomputed, and active_line_count decreases by 1"
          - "L2b (caused by L1): every SeedIncreaseLot of this line with status IN {RESERVED, IN_PRODUCTION, ON_HOLD} becomes CANCELLED with hold_reason = 'LINE_DISCARDED', processed in created_at ASC order"
          - "L3b (caused by each L2b cancellation): BreedingLine.seed_inventory_g is credited back by that lot's allocated_seed_g, and reserved_seed_g / planned_launch_units_bags are recomputed"
          - "L4b (caused by L3b): BreedingProgram.pre_commercial_units_bags is recomputed"
          - "L2c (caused by L1): every BackcrossProject with recurrent_line_id = this line and status = ACTIVE becomes TERMINATED"
          - "any non-superseded AdvancementDecision with decision=ADVANCE on this line is set is_superseded=true and its granted_plots released from BreedingProgram.committed_plot_count"
        note: "Ordering is pinned: L2/L3/L4 (trial entries) run to completion before L2b/L3b/L4b (seed lots), which run before L2c (backcross projects)."

      # --- dimension B: stewardship_status ---
      - from: "stewardship_status=NOT_REQUIRED"
        to: "stewardship_status=PENDING"
        trigger: "POST /breeding-lines/{id}/stewardship-agreements"
        actor: RegulatoryOfficer
        preconditions:
          - "line.pipeline_stage != DISCARDED"
          - "the line has no StewardshipAgreement with status IN {DRAFT, SUBMITTED, CHANGES_REQUESTED, APPROVED}"
        side_effects:
          - "creates the StewardshipAgreement in DRAFT and sets BreedingLine.stewardship_status = PENDING, version += 1"
      - from: "stewardship_status=PENDING"
        to: "stewardship_status=APPROVED"
        trigger: "POST /stewardship-agreements/{id}/review with outcome=APPROVE"
        actor: RegulatoryOfficer
        preconditions:
          - "agreement.status = SUBMITTED"
        side_effects:
          - "sets BreedingLine.stewardship_status = APPROVED, version += 1"
      - from: "stewardship_status=APPROVED"
        to: "stewardship_status=SUSPENDED"
        trigger: "POST /stewardship-agreements/{id}/suspend"
        actor: RegulatoryOfficer
        preconditions:
          - "agreement.status = APPROVED"
          - "X-User-ID != agreement.approved_by_user_id"
        side_effects:
          - "L2 (caused by the agreement's APPROVED -> SUSPENDED transition): BreedingLine.stewardship_status = SUSPENDED, version += 1"
          - "L3 (caused by L2): every SeedIncreaseLot of this line with status IN {RESERVED, IN_PRODUCTION} becomes ON_HOLD with hold_reason = 'STEWARDSHIP_SUSPENDED', processed in created_at ASC order; allocated_seed_g stays debited"
          - "L4 (caused by L3): BreedingLine.planned_launch_units_bags is recomputed (ON_HOLD lots drop out) and BreedingProgram.pre_commercial_units_bags is recomputed"

  - entity: CrossingBlock
    initial_state: PLANNED
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNED
        to: POLLINATED
        trigger: "POST /crossing-blocks/{id}/pollinate"
        actor: BreedingScientist
        preconditions:
          - "block.status = PLANNED"
          - "program.status = ACTIVE"
          - "realized_cross_count >= 1 and <= planned_cross_count"
        side_effects:
          - "stores realized_cross_count; the block may now accept progeny lines"
      - from: POLLINATED
        to: CLOSED
        trigger: "system: automatic, evaluated after every POST /crossing-blocks/{id}/progenies"
        actor: system
        preconditions:
          - "block.status = POLLINATED"
          - "block.progeny_line_count = block.realized_cross_count after the progeny was created"
        side_effects:
          - "block auto-closes; further progeny creation is rejected with ERR_BLOCK_NOT_POLLINATED"

  - entity: NurseryPlanting
    initial_state: SCHEDULED
    terminal_states: [HARVESTED, FAILED]
    note: "Branching fork: PLANTED forks to HARVESTED or FAILED with divergent side-effect sets."
    transitions:
      - from: SCHEDULED
        to: PLANTED
        trigger: "POST /nursery-plantings/{id}/plant"
        actor: BreedingScientist
        preconditions:
          - "planting.status = SCHEDULED"
          - "line.pipeline_stage != DISCARDED"
        side_effects:
          - "planting.status = PLANTED; NurseryBlock.occupancy_status is re-derived"
      - from: PLANTED
        to: HARVESTED
        trigger: "POST /nursery-plantings/{id}/harvest with harvested_seed_g >= 250"
        actor: BreedingScientist
        preconditions:
          - "planting.status = PLANTED"
          - "actual_harvest_date >= sow_date"
        side_effects:
          - "L1: planting.status = HARVESTED, stores harvested_seed_g and actual_harvest_date"
          - "L2 (caused by L1): BreedingLine.seed_inventory_g += harvested_seed_g, cumulative_seed_produced_g += harvested_seed_g, generation_number += 1, nursery_cycles_completed += 1, generation_advanced_to = the new generation_number, line.version += 1"
          - "L3 (caused by the generation_number change in L2): BreedingLine.advancement_readiness is re-derived against objective.min_generation_number and may flip NOT_READY -> READY"
          - "L4 (caused by L2): BreedingProgram.committed_plot_count drops by planting.plot_count because the planting left the {SCHEDULED, PLANTED} set; plot_budget_remaining recomputed"
      - from: PLANTED
        to: FAILED
        trigger: "POST /nursery-plantings/{id}/harvest with harvested_seed_g < 250"
        actor: BreedingScientist
        preconditions:
          - "planting.status = PLANTED"
          - "actual_harvest_date >= sow_date"
        side_effects:
          - "planting.status = FAILED, stores harvested_seed_g and actual_harvest_date, generation_advanced_to stays null"
          - "BreedingLine.seed_inventory_g += harvested_seed_g and cumulative_seed_produced_g += harvested_seed_g (the seed is still banked)"
          - "BreedingLine.generation_number is NOT incremented and nursery_cycles_completed is NOT incremented, so advancement_readiness cannot flip on this branch"
          - "BreedingProgram.committed_plot_count drops by planting.plot_count; plot_budget_remaining recomputed"
        note: "The 250 g threshold is MIN_ADVANCE_SEED_G in calculations.nursery_harvest_credit."

  - entity: TrialSeries
    initial_state: PLANNING
    terminal_states: [CLOSED]
    note: "Compound: PLANTED -> DATA_COMPLETE is derived from the aggregate state of the series' TrialEntry children."
    transitions:
      - from: PLANNING
        to: PLANTED
        trigger: "POST /trial-series/{id}/plant"
        actor: TrialAgronomist
        preconditions:
          - "series.status = PLANNING"
          - "series.location_count >= series.min_locations"
          - "series.entry_count >= 2"
          - "program.status = ACTIVE"
          - "calculations.trial_series_cost_allocation total_trial_cost_usd <= program.total_budget_usd - program.committed_budget_usd"
        side_effects:
          - "runs calculations.trial_series_cost_allocation and stores plot_cost_subtotal_usd, management_fee_usd, total_trial_cost_usd"
          - "every TrialEntry of this series with status = ENTERED becomes PLANTED, processed in created_at ASC order"
          - "BreedingProgram.committed_budget_usd increases by total_trial_cost_usd"
      - from: PLANTED
        to: DATA_COMPLETE
        trigger: "system: automatic, evaluated after every POST /trial-entries/{id}/finalize, /withdraw and /invalidate"
        actor: system
        preconditions:
          - "series.status = PLANTED"
          - "no TrialEntry of this series is left in status PLANTED"
          - "at least one TrialEntry of this series has status HARVESTED"
        side_effects:
          - "series.status = DATA_COMPLETE, version += 1; analyses may now be run"
      - from: DATA_COMPLETE
        to: ANALYZED
        trigger: "POST /trial-series/{id}/analyses"
        actor: DataAnalyst
        preconditions:
          - "series.status IN {DATA_COMPLETE, ANALYZED}"
          - "expected_series_version matches series.version"
        side_effects:
          - "creates the TrialSeriesAnalysis row, supersedes the previous non-superseded analysis of the same variant, sets series.status = ANALYZED and increments series.version by 1"
          - "recomputes BreedingLine.advancement_index_provisional for every line included in the analysis, in entry_means order"
      - from: ANALYZED
        to: CLOSED
        trigger: "POST /trial-series/{id}/close"
        actor: PipelineDirector
        preconditions:
          - "series.status = ANALYZED"
          - "every BreedingLine with a HARVESTED TrialEntry in this series has a non-superseded AdvancementDecision for this series"
        side_effects:
          - "series.status = CLOSED; no further analyses or entries are accepted"

  - entity: TrialEntry
    initial_state: ENTERED
    terminal_states: [HARVESTED, WITHDRAWN, INVALIDATED]
    transitions:
      - from: ENTERED
        to: PLANTED
        trigger: "system: cascade of POST /trial-series/{id}/plant"
        actor: system
        preconditions:
          - "entry.status = ENTERED"
        side_effects:
          - "entry.status = PLANTED; observations may now be recorded"
      - from: PLANTED
        to: HARVESTED
        trigger: "POST /trial-entries/{id}/finalize"
        actor: TrialAgronomist
        preconditions:
          - "entry.status = PLANTED"
          - "entry.valid_rep_count >= 3 (MIN_VALID_REPS)"
        side_effects:
          - "runs calculations.entry_yield_rollup and stores valid_rep_count, plot_mean_yield_kg, yield_kg_per_ha"
          - "may bubble the parent TrialSeries PLANTED -> DATA_COMPLETE when no sibling entry is left in PLANTED"
      - from: "ENTERED or PLANTED"
        to: WITHDRAWN
        trigger: "POST /trial-entries/{id}/withdraw, or cascade of a DISCARD AdvancementDecision on the entry's line"
        actor: "TrialAgronomist or system"
        preconditions:
          - "entry.status IN {ENTERED, PLANTED}"
          - "the entry's TrialSeries.status != CLOSED"
        side_effects:
          - "entry.status = WITHDRAWN, withdrawal_reason stored, version += 1"
          - "TrialSite.peak_committed_plot_count, available_plot_count and capacity_posture are recomputed over the remaining active entries"
          - "BreedingProgram.committed_plot_count drops by entry.plot_count; plot_budget_remaining recomputed"
          - "may bubble the parent TrialSeries PLANTED -> DATA_COMPLETE"
      - from: PLANTED
        to: INVALIDATED
        trigger: "POST /trial-entries/{id}/invalidate"
        actor: TrialAgronomist
        preconditions:
          - "entry.status = PLANTED"
        side_effects:
          - "entry.status = INVALIDATED, withdrawal_reason stored; the entry is excluded from every analysis inclusion set"
          - "TrialSite.peak_committed_plot_count, available_plot_count and capacity_posture are recomputed"
          - "BreedingProgram.committed_plot_count drops by entry.plot_count"
          - "may bubble the parent TrialSeries PLANTED -> DATA_COMPLETE"

  - entity: StewardshipAgreement
    initial_state: DRAFT
    terminal_states: [SUSPENDED]
    note: "Cyclic: SUBMITTED -> CHANGES_REQUESTED -> SUBMITTED, revision_round incremented on every re-entry."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /stewardship-agreements/{id}/submit"
        actor: RegulatoryOfficer
        preconditions:
          - "agreement.status = DRAFT"
          - "line.pipeline_stage != DISCARDED"
        side_effects:
          - "stores submitted_by_user_id = X-User-ID; revision_round stays 0"
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /stewardship-agreements/{id}/submit"
        actor: RegulatoryOfficer
        preconditions:
          - "agreement.status = CHANGES_REQUESTED"
          - "line.pipeline_stage != DISCARDED"
        side_effects:
          - "revision_round += 1; requested_changes cleared to null; submitted_by_user_id refreshed"
        note: "This is the cycle edge; there is no cap on revision_round."
      - from: SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /stewardship-agreements/{id}/review with outcome=REQUEST_CHANGES"
        actor: RegulatoryOfficer
        preconditions:
          - "agreement.status = SUBMITTED"
          - "requested_changes is a non-empty string"
        side_effects:
          - "stores requested_changes; BreedingLine.stewardship_status stays PENDING"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /stewardship-agreements/{id}/review with outcome=APPROVE"
        actor: RegulatoryOfficer
        preconditions:
          - "agreement.status = SUBMITTED"
        side_effects:
          - "stores approved_by_user_id = X-User-ID"
          - "BreedingLine.stewardship_status = APPROVED, line.version += 1"
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /stewardship-agreements/{id}/suspend"
        actor: RegulatoryOfficer
        preconditions:
          - "agreement.status = APPROVED"
          - "X-User-ID != agreement.approved_by_user_id (segregation of duties)"
        side_effects:
          - "L1: agreement.status = SUSPENDED, suspension_reason stored"
          - "L2 (caused by L1): BreedingLine.stewardship_status = SUSPENDED, line.version += 1"
          - "L3 (caused by L2): every SeedIncreaseLot of the line with status IN {RESERVED, IN_PRODUCTION} becomes ON_HOLD in created_at ASC order"
          - "L4 (caused by L3): BreedingLine.planned_launch_units_bags and BreedingProgram.pre_commercial_units_bags are recomputed"

  - entity: SeedIncreaseLot
    initial_state: RESERVED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: RESERVED
        to: IN_PRODUCTION
        trigger: "POST /seed-increase-lots/{id}/start-production"
        actor: SupplyPlanner
        preconditions:
          - "lot.status = RESERVED"
          - "line.stewardship_status = APPROVED"
        side_effects:
          - "lot.status = IN_PRODUCTION; allocated_seed_g stays debited from the line"
      - from: IN_PRODUCTION
        to: COMPLETED
        trigger: "POST /seed-increase-lots/{id}/complete"
        actor: SupplyPlanner
        preconditions:
          - "lot.status = IN_PRODUCTION"
        side_effects:
          - "lot.status = COMPLETED; the allocated parent seed moves from reserved_seed_g to consumed_seed_g (it stays out of seed_inventory_g permanently)"
          - "the multiplied harvest is credited: line.seed_inventory_g and line.cumulative_seed_produced_g both rise by allocated_seed_g * FIELD_MULTIPLICATION_FACTOR, so the seed-mass invariant still closes"
      - from: "RESERVED or IN_PRODUCTION"
        to: ON_HOLD
        trigger: "system: cascade of POST /stewardship-agreements/{id}/suspend"
        actor: system
        preconditions:
          - "lot.status IN {RESERVED, IN_PRODUCTION}"
        side_effects:
          - "lot.status = ON_HOLD, hold_reason = 'STEWARDSHIP_SUSPENDED'; allocated_seed_g stays debited so the seed-mass invariant holds"
      - from: "RESERVED, IN_PRODUCTION or ON_HOLD"
        to: CANCELLED
        trigger: "POST /seed-increase-lots/{id}/cancel, or cascade of a DISCARD AdvancementDecision on the lot's line"
        actor: "SupplyPlanner or system"
        preconditions:
          - "lot.status IN {RESERVED, IN_PRODUCTION, ON_HOLD}"
        side_effects:
          - "lot.status = CANCELLED, hold_reason stored"
          - "BreedingLine.seed_inventory_g += lot.allocated_seed_g (compensating credit), reserved_seed_g and planned_launch_units_bags recomputed, line.version += 1"
          - "BreedingProgram.pre_commercial_units_bags recomputed"

  - entity: BackcrossProject
    initial_state: ACTIVE
    terminal_states: [CONVERTED, TERMINATED]
    note: "Cyclic self-loop: ACTIVE -> ACTIVE on every marker cycle until the recovery threshold is crossed."
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /backcross-projects/{id}/marker-cycle producing recurrent_genome_pct < 99.0 or target_marker_present=false"
        actor: BreedingScientist
        preconditions:
          - "project.status = ACTIVE"
          - "recurrent line.pipeline_stage != DISCARDED"
        side_effects:
          - "bc_generation += 1, target_marker_present stored, recurrent_genome_pct recomputed by calculations.marker_recovery_pct"
      - from: ACTIVE
        to: CONVERTED
        trigger: "POST /backcross-projects/{id}/marker-cycle producing recurrent_genome_pct >= 99.0 with target_marker_present=true"
        actor: BreedingScientist
        preconditions:
          - "project.status = ACTIVE"
          - "recurrent line.pipeline_stage != DISCARDED"
        side_effects:
          - "L1: bc_generation += 1, recurrent_genome_pct recomputed, status = CONVERTED"
          - "L2 (caused by L1): the recurrent BreedingLine's disease_resistance_scores gains the entry target_trait_code -> 8 (CONVERTED_TRAIT_SCORE), overwriting any lower score; line.version += 1"
          - "L3 (caused by the L2 score change): the recurrent line's advancement_index_provisional is recomputed"
      - from: ACTIVE
        to: TERMINATED
        trigger: "system: cascade of a DISCARD AdvancementDecision on the recurrent line"
        actor: system
        preconditions:
          - "project.status = ACTIVE"
        side_effects:
          - "status = TERMINATED; no trait score is written to the recurrent line"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC on the parent's version - the only sanctioned
#       write-write conflict mechanism)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: decision-create-stale-line
    parent_entity: BreedingLine
    write_endpoint: "POST /advancement-decisions"
    occ_field: "expected_line_version"
    description: |
      Recording an AdvancementDecision against a BreedingLine whose version has
      advanced since the client last read it is rejected. A new decision for the
      same (line_id, trial_series_id) pair legitimately supersedes the previous
      one under the ADVANCE/HOLD/DISCARD transitions, so a writer holding a
      stale view of the line would otherwise supersede a decision it never saw.
      The stale-version check makes that rejection deterministic.
    error_id: ERR_STALE_LINE_VERSION
    http_status: 412

  - rule_id: analysis-create-stale-series
    parent_entity: TrialSeries
    write_endpoint: "POST /trial-series/{id}/analyses"
    occ_field: "expected_series_version"
    description: |
      Creating a TrialSeriesAnalysis against a TrialSeries whose version has
      advanced since the client last read it is rejected. A new analysis of the
      same variant legitimately supersedes the prior analysis row, so a writer
      whose view of the series predates a data change (a late finalize, a
      withdrawal, or another analysis run) would supersede results computed on
      a different inclusion set. The stale-version check rejects it.
    error_id: ERR_STALE_SERIES_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
#
# GLOBAL PRECISION RULE (applies to every formula below): all arithmetic is
# performed on exact decimals (Python decimal.Decimal or equivalent) and every
# rounding step uses ROUND_HALF_UP at the decimal place named by that step.
# Binary floating point is forbidden because several pinned literals land
# exactly on a half (e.g. 72.455 -> 72.46).
# ---------------------------------------------------------------------------
calculations:

  - name: entry_yield_rollup
    trigger: "POST /trial-entries/{id}/finalize (TrialEntry PLANTED -> HARVESTED)"
    algorithm: aggregation
    formula: |
      # step 1 - inclusion set
      obs = PhenotypeObservation rows where trial_entry_id = entry.id
                                      AND trait_code = 'YIELD_KG_PLOT'
                                      AND qc_status = 'ACCEPTED'
                                      AND is_outlier = false
      valid_rep_count = count(obs)
      if valid_rep_count < MIN_VALID_REPS: reject ERR_INSUFFICIENT_REPLICATION

      # step 2 - plot mean, rounded to 3 decimals BEFORE scaling
      plot_mean_yield_kg = round_half_up(sum(obs.value) / valid_rep_count, 3)

      # step 3 - scale the ALREADY ROUNDED mean to per-hectare, then round to 2
      yield_kg_per_ha = round_half_up(plot_mean_yield_kg * HA_PER_PLOT_FACTOR, 2)
    input_set: "only ACCEPTED, non-outlier YIELD_KG_PLOT observations of this entry; REJECTED rows and is_outlier=true rows are excluded from both the count and the sum"
    constants:
      MIN_VALID_REPS: 3
      PLOT_AREA_M2: 12.5
      HA_PER_PLOT_FACTOR: 800    # 10000 m2 / 12.5 m2
    precision: "plot_mean_yield_kg 3 decimals round_half_up; yield_kg_per_ha 2 decimals round_half_up; the rounding ORDER is pinned - round the mean first, then scale"

  - name: series_adjusted_entry_mean
    trigger: "POST /trial-series/{id}/analyses (TrialSeries DATA_COMPLETE/ANALYZED -> ANALYZED)"
    algorithm: weighted_scoring
    formula: |
      # step 1 - candidate entries
      cand = TrialEntry rows of this series with status = 'HARVESTED'
             (ENTERED, PLANTED, WITHDRAWN and INVALIDATED entries are excluded)

      # step 2 - inclusion set depends on the variant (see variants below)
      included = variant_filter(cand)
      if distinct(included.trial_site_id) == 0: reject ERR_EMPTY_BALANCED_CORE

      # step 3 - per-line adjusted mean, weighted by valid_rep_count
      for each line L with >= 1 included entry:
        adjusted_mean_kg_per_ha[L] =
            round_half_up( sum(e.yield_kg_per_ha * e.valid_rep_count for e in included where e.line_id = L)
                           / sum(e.valid_rep_count for e in included where e.line_id = L), 2 )

      # step 4 - environment index per included site (UNWEIGHTED site mean)
      for each site S in distinct(included.trial_site_id):
        index_kg_per_ha[S] = round_half_up( sum(e.yield_kg_per_ha for e in included where e.trial_site_id = S)
                                            / count(included where e.trial_site_id = S), 2 )

      # step 5 - Finlay-Wilkinson stability regression per line, over that
      #          line's included sites; x = index_kg_per_ha[S], y = e.yield_kg_per_ha
      n = count of included entries of line L
      if n < 2:
        stability_regression_b = null; deviation_mse = null; stability_class = 'UNCLASSIFIED'
      else:
        b = sum((x_i - mean_x) * (y_i - mean_y)) / sum((x_i - mean_x) ^ 2)
        stability_regression_b = round_half_up(b, 4)
        if n >= 3:
          deviation_mse = round_half_up( sum((y_i - (mean_y + b * (x_i - mean_x))) ^ 2) / (n - 2), 2 )
        else:
          deviation_mse = null
        stability_class = 'STABLE'     if STABLE_B_MIN <= stability_regression_b <= STABLE_B_MAX
                          'RESPONSIVE' if stability_regression_b > STABLE_B_MAX
                          'BUFFERED'   otherwise
      # step 6 - ordering of entry_means: adjusted_mean_kg_per_ha DESC, ties
      #          broken by the BreedingLine's created_at ASC. environment_index
      #          is ordered by index_kg_per_ha DESC, ties by TrialSite.created_at ASC.
    input_set: "HARVESTED TrialEntry rows of the series only; the variant then narrows the site set"
    constants:
      STABLE_B_MIN: 0.80
      STABLE_B_MAX: 1.20
    precision: "adjusted_mean_kg_per_ha and index_kg_per_ha 2 decimals round_half_up; stability_regression_b 4 decimals round_half_up; deviation_mse 2 decimals round_half_up; b is computed from the ALREADY ROUNDED yield_kg_per_ha and index_kg_per_ha values"
    variants:
      - name: UNBALANCED_INCLUSIVE
        when: "variant = 'UNBALANCED_INCLUSIVE' in the POST body"
        difference: "included = cand, i.e. every HARVESTED entry at every site, even sites where some lines of the series are missing. Lines tested at a stress site are dragged down relative to the balanced view."
      - name: BALANCED_CORE
        when: "variant = 'BALANCED_CORE' in the POST body"
        difference: "core_sites = { S : every BreedingLine with >= 1 HARVESTED entry in this series also has a HARVESTED entry at S }; included = cand restricted to core_sites. When core_sites is empty the analysis is rejected with ERR_EMPTY_BALANCED_CORE."

  - name: line_advancement_index
    trigger: "POST /trial-series/{id}/analyses recomputes the PROVISIONAL variant onto BreedingLine.advancement_index_provisional; POST /advancement-decisions computes the CUMULATIVE variant into AdvancementDecision.decision_index_value; a BackcrossProject CONVERTED transition recomputes the PROVISIONAL variant after writing the trait score"
    algorithm: weighted_scoring
    formula: |
      obj = the line's BreedingObjective

      # component 1 - yield. src = adjusted_mean_kg_per_ha of this line taken
      # from the line's series analysis: prefer the non-superseded
      # BALANCED_CORE analysis of the series; if none exists use the
      # non-superseded UNBALANCED_INCLUSIVE analysis; if neither exists the
      # yield component is MISSING. The ALREADY ROUNDED 2-decimal stored value
      # is used, never a re-derived one.
      yield_component = min(YIELD_COMPONENT_CAP,
                            round_half_up(100 * src / obj.target_yield_kg_per_ha, 2))

      # component 2 - disease. MISSING when line.disease_resistance_scores == {}
      req = obj.required_disease_resistances
      matched = count(t in req where line.disease_resistance_scores[t] exists
                                 AND line.disease_resistance_scores[t] >= obj.min_resistance_score)
      disease_component = 100.00 if len(req) == 0
                          else round_half_up(100 * matched / len(req), 2)

      # component 3 - quality. MISSING when line.quality_trait_values == {}
      # spec semantics: *_MIN specs pass when the measured value >= threshold;
      # MOISTURE_MAX passes when the measured value <= threshold. A spec whose
      # measured trait is absent from quality_trait_values counts as a miss.
      miss = count of obj.quality_trait_specs entries the line fails
      quality_component = max(0, 100 - QUALITY_MISS_PENALTY * miss)

      # step 4 - variant-specific handling of MISSING components, then weights
      index_base = round_half_up(obj.yield_weight   * yield_component
                               + obj.disease_weight * disease_component
                               + obj.quality_weight * quality_component, 2)
    input_set: "the line's own trait maps plus the single winning analysis row of the referenced series; entries of other series never contribute"
    constants:
      YIELD_COMPONENT_CAP: 120
      QUALITY_MISS_PENALTY: 15
      IMPUTED_COMPONENT_VALUE: 60
      STAGE_CONFIDENCE: { NURSERY: 0.90, STAGE_1: 0.95, STAGE_2: 1.00, STAGE_3: 1.00, PRE_COMMERCIAL: 1.00 }
    precision: "each component 2 decimals round_half_up; index_base rounded to 2 decimals BEFORE the stage-confidence multiplication; the final CUMULATIVE value rounded again to 2 decimals"
    variants:
      - name: PROVISIONAL
        when: "recomputed onto BreedingLine.advancement_index_provisional whenever an analysis is created or the line's trait maps change"
        difference: "every MISSING component is imputed at IMPUTED_COMPONENT_VALUE = 60 and NO stage-confidence multiplier is applied: result = index_base. Optimistic - it credits a line for data it has not produced."
      - name: CUMULATIVE
        when: "computed into AdvancementDecision.decision_index_value at POST /advancement-decisions and compared against obj.min_advancement_index"
        difference: "every MISSING component is forced to 0.00 and the result is round_half_up(index_base * STAGE_CONFIDENCE[line.pipeline_stage], 2). Pessimistic - identical inputs yield a strictly lower number than PROVISIONAL whenever a component is missing or the stage confidence is below 1.00."

  - name: trial_series_cost_allocation
    trigger: "POST /trial-series/{id}/plant (TrialSeries PLANNING -> PLANTED)"
    algorithm: tiered_pricing
    formula: |
      # step 1 - plot cost subtotal over the entries that will actually be planted
      plot_cost_subtotal_usd = round_half_up(
          sum(e.plot_count * site_of(e).plot_cost_usd
              for e in TrialEntry of this series where e.status = 'ENTERED'), 2)

      # step 2 - EVALUATION ORDER IS PINNED. The management tier is selected
      #          from plot_cost_subtotal_usd ONLY, never from the total. The
      #          dependency looks circular (total = subtotal + fee, fee = rate
      #          (tier(total)) * subtotal) and is resolved by fixing the tier
      #          input to the PRE-FEE subtotal.
      rate = MGMT_RATE_TIER_1 if plot_cost_subtotal_usd <  MGMT_TIER_1_CEILING
             MGMT_RATE_TIER_2 if plot_cost_subtotal_usd <  MGMT_TIER_2_CEILING
             MGMT_RATE_TIER_3 otherwise

      # step 3 - fee, step 4 - total
      management_fee_usd  = round_half_up(plot_cost_subtotal_usd * rate, 2)
      total_trial_cost_usd = round_half_up(plot_cost_subtotal_usd + management_fee_usd, 2)
    input_set: "TrialEntry rows of this series with status = ENTERED at the moment of the plant call; WITHDRAWN entries are excluded and never re-enter the cost even if the series is re-planted"
    constants:
      MGMT_TIER_1_CEILING: 10000.00
      MGMT_TIER_2_CEILING: 50000.00
      MGMT_RATE_TIER_1: 0.12
      MGMT_RATE_TIER_2: 0.09
      MGMT_RATE_TIER_3: 0.07
    precision: "2 decimals round_half_up at steps 1, 3 and 4; tier comparisons are strict `<` against the ceilings, so a subtotal of exactly 10000.00 selects MGMT_RATE_TIER_2"

  - name: seed_increase_volume_plan
    trigger: "POST /seed-increase-lots"
    algorithm: waterfall_allocation
    formula: |
      # step 1 - ROUNDING ORDER IS PINNED: ceil PER ALLOCATION first, then sum.
      #          Summing the demand first and ceiling once produces a different
      #          (smaller) bag count and is WRONG.
      for each a in lot.market_allocations:
        bags[a] = ceil( (a.demand_kg * (1 + SEED_LOSS_PCT)) / BAG_SIZE_KG )

      # step 2
      planned_units_bags = sum(bags[a] for a in lot.market_allocations)

      # step 3 - parent seed needed, in grams, ceiled once at the end
      allocated_seed_g = ceil( planned_units_bags * BAG_SIZE_KG * 1000 / FIELD_MULTIPLICATION_FACTOR )

      # step 4 - fiscal gate and debit
      if allocated_seed_g > line.seed_inventory_g: reject ERR_INSUFFICIENT_SEED_INVENTORY
      line.seed_inventory_g -= allocated_seed_g
    input_set: "every element of lot.market_allocations; the array must be non-empty and every demand_kg must be > 0"
    constants:
      BAG_SIZE_KG: 25
      SEED_LOSS_PCT: 0.08
      FIELD_MULTIPLICATION_FACTOR: 40
    precision: "ceil (ROUND_CEILING) at step 1 per allocation and once again at step 3; no other rounding. planned_units_bags and allocated_seed_g are integers."

  - name: nursery_harvest_credit
    trigger: "POST /nursery-plantings/{id}/harvest (NurseryPlanting PLANTED -> HARVESTED or PLANTED -> FAILED)"
    algorithm: threshold
    formula: |
      line.seed_inventory_g            += harvested_seed_g
      line.cumulative_seed_produced_g  += harvested_seed_g
      if harvested_seed_g >= MIN_ADVANCE_SEED_G:
        planting.status = 'HARVESTED'
        line.generation_number += 1
        line.nursery_cycles_completed += 1
        planting.generation_advanced_to = line.generation_number
      else:
        planting.status = 'FAILED'
        planting.generation_advanced_to = null   # generation and cycle count untouched
      line.advancement_readiness = 'READY' if line.generation_number >= obj.min_generation_number else 'NOT_READY'
    input_set: "the single harvest call's harvested_seed_g; the branch is decided by a >= comparison, so exactly 250 g advances the generation"
    constants:
      MIN_ADVANCE_SEED_G: 250
    precision: "integer grams; no rounding"

  - name: marker_recovery_pct
    trigger: "POST /backcross-projects (creation) and POST /backcross-projects/{id}/marker-cycle"
    algorithm: decay_function
    formula: |
      # theoretical recurrent-genome recovery after g backcrosses, plus a
      # marker-assisted selection bonus that only applies once the marker has
      # actually been detected in the current cycle.
      base = 100 * (1 - 0.5 ^ (bc_generation + 1))
      bonus = MAS_BONUS_PCT if (project.marker_assisted AND project.target_marker_present) else 0
      recurrent_genome_pct = min(RECOVERY_CAP_PCT, round_half_up(base + bonus, 3))
      # conversion gate
      if recurrent_genome_pct >= CONVERSION_THRESHOLD_PCT AND project.target_marker_present:
        project.status = 'CONVERTED'
    input_set: "the project's own bc_generation, marker_assisted flag and the target_marker_present value supplied by the current cycle; at creation bc_generation = 1 and target_marker_present = false"
    constants:
      MAS_BONUS_PCT: 2.5
      RECOVERY_CAP_PCT: 99.900
      CONVERSION_THRESHOLD_PCT: 99.0
      CONVERTED_TRAIT_SCORE: 8
    precision: "3 decimals round_half_up, then capped at RECOVERY_CAP_PCT; the >= comparison against CONVERSION_THRESHOLD_PCT uses the rounded, capped value"

  - name: site_capacity_peak_and_posture
    trigger: "recomputed on POST /trial-series/{id}/entries, POST /trial-entries/{id}/withdraw, POST /trial-entries/{id}/invalidate, and on the WITHDRAWN cascade of a DISCARD AdvancementDecision"
    algorithm: interval_merge
    formula: |
      active = TrialEntry rows at this site with status IN {ENTERED, PLANTED, HARVESTED}
      # daily sweep over CLOSED intervals - both endpoints occupy the site, so
      # two entries sharing a single boundary date DO compete for plots.
      for each date d in [site.season_start_date, site.season_end_date]:
        load[d] = sum(e.plot_count for e in active
                      where e.planting_window_start <= d <= e.planting_window_end)
      peak_committed_plot_count = max(load[d]) over the season, or 0 when active is empty
      available_plot_count      = total_plot_capacity - peak_committed_plot_count
      utilisation               = peak_committed_plot_count / total_plot_capacity
      capacity_posture = 'FROZEN'     if utilisation >= FROZEN_RATIO
                         'RESTRICTED' if utilisation >= RESTRICTED_RATIO
                         'OPEN'       otherwise
      # admission test on entry creation, evaluated on the post-insertion sweep
      if peak_after_insertion > total_plot_capacity: reject ERR_SITE_PLOT_CAPACITY_EXCEEDED
    input_set: "TrialEntry rows at this site in {ENTERED, PLANTED, HARVESTED}; WITHDRAWN and INVALIDATED entries release their plots immediately"
    constants:
      RESTRICTED_RATIO: 0.85
      FROZEN_RATIO: 1.00
    precision: "utilisation compared as an exact decimal ratio; a site at exactly 0.85 is RESTRICTED and a site at exactly 1.00 is FROZEN"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#     the FIRST failing rule decides the response)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the seven roles declared in 1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list in 1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "request body and query parameters parse; required fields present; enum members valid; numbers in range; date-only fields are YYYY-MM-DD; pagination limit in 1..100 and offset >= 0; cross-field body rules that need no other entity (granted_plots MUST be 0 unless decision=ADVANCE; donor_line_id != recurrent_line_id; market_allocations non-empty with every demand_kg > 0; approved_markets non-empty; yield_weight + disease_weight + quality_weight == 1.00; expected_harvest_date > sow_date)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 4
    category: existence
    check: "every path id resolves, validated left to right"
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_CROSSING_BLOCK_NOT_FOUND | ERR_LINE_NOT_FOUND | ERR_NURSERY_BLOCK_NOT_FOUND | ERR_PLANTING_NOT_FOUND | ERR_TRIAL_SITE_NOT_FOUND | ERR_TRIAL_SERIES_NOT_FOUND | ERR_TRIAL_ENTRY_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_SEED_LOT_NOT_FOUND | ERR_BACKCROSS_NOT_FOUND | ERR_DECISION_NOT_FOUND | ERR_OBJECTIVE_NOT_FOUND"
    http_status: 404
    applies_to: all
  - priority: 5
    category: auth
    check: "when the acting role is ProgramLead, X-User-ID equals the BreedingProgram.id that owns every resource named in the path and in the body (program_id of the objective, line, series, crossing block, or the line behind an agreement / lot / planting / entry / backcross project)"
    error_id: ERR_PROGRAM_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all endpoints whose roles include ProgramLead"
  - priority: 6
    category: existence
    check: "every foreign key supplied in the body resolves, validated in the order the endpoint's input list declares them"
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_OBJECTIVE_NOT_FOUND | ERR_LINE_NOT_FOUND | ERR_NURSERY_BLOCK_NOT_FOUND | ERR_TRIAL_SITE_NOT_FOUND | ERR_TRIAL_SERIES_NOT_FOUND"
    http_status: 404
    applies_to: "POST /crossing-blocks, POST /breeding-lines, POST /crossing-blocks/{id}/progenies, POST /nursery-plantings, POST /trial-series, POST /trial-series/{id}/entries, POST /advancement-decisions, POST /seed-increase-lots, POST /backcross-projects"
  - priority: 7
    category: state
    check: "expected_line_version equals BreedingLine.version"
    error_id: ERR_STALE_LINE_VERSION
    http_status: 412
    applies_to: "POST /advancement-decisions"
  - priority: 8
    category: state
    check: "expected_series_version equals TrialSeries.version"
    error_id: ERR_STALE_SERIES_VERSION
    http_status: 412
    applies_to: "POST /trial-series/{id}/analyses"
  - priority: 9
    category: state
    check: "the BreedingProgram behind the mutated resource has status = ACTIVE"
    error_id: ERR_PROGRAM_CLOSED
    http_status: 409
    applies_to: "every POST that creates or mutates a resource owned by a program"
  - priority: 10
    category: state
    check: "the target resource is in the state its transition requires (planting SCHEDULED for /plant, PLANTED for /harvest)"
    error_id: ERR_PLANTING_INVALID_STATE
    http_status: 409
    applies_to: "POST /nursery-plantings/{id}/plant, POST /nursery-plantings/{id}/harvest"
  - priority: 11
    category: state
    check: "series is PLANNING for /plant and for /entries; DATA_COMPLETE or ANALYZED for /analyses; ANALYZED for /close; never CLOSED for any mutation"
    error_id: ERR_SERIES_INVALID_STATE
    http_status: 409
    applies_to: "POST /trial-series/{id}/entries, POST /trial-series/{id}/plant, POST /trial-series/{id}/analyses, POST /trial-series/{id}/close"
  - priority: 12
    category: state
    check: "entry is PLANTED for /finalize and /invalidate, and IN {ENTERED, PLANTED} for /withdraw and for /observations"
    error_id: ERR_ENTRY_INVALID_STATE
    http_status: 409
    applies_to: "POST /trial-entries/{id}/finalize, POST /trial-entries/{id}/withdraw, POST /trial-entries/{id}/invalidate, POST /trial-entries/{id}/observations"
  - priority: 13
    category: state
    check: "agreement is DRAFT or CHANGES_REQUESTED for /submit, SUBMITTED for /review, APPROVED for /suspend"
    error_id: ERR_AGREEMENT_INVALID_STATE
    http_status: 409
    applies_to: "POST /stewardship-agreements/{id}/submit, POST /stewardship-agreements/{id}/review, POST /stewardship-agreements/{id}/suspend"
  - priority: 14
    category: state
    check: "lot is RESERVED for /start-production, IN_PRODUCTION for /complete, and IN {RESERVED, IN_PRODUCTION, ON_HOLD} for /cancel"
    error_id: ERR_LOT_INVALID_STATE
    http_status: 409
    applies_to: "POST /seed-increase-lots/{id}/start-production, POST /seed-increase-lots/{id}/complete, POST /seed-increase-lots/{id}/cancel"
  - priority: 15
    category: state
    check: "backcross project status = ACTIVE"
    error_id: ERR_PROJECT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /backcross-projects/{id}/marker-cycle"
  - priority: 16
    category: state
    check: "cross-entity: every BreedingLine referenced by the mutation has pipeline_stage != DISCARDED"
    error_id: ERR_LINE_DISCARDED
    http_status: 409
    applies_to: "POST /nursery-plantings, POST /nursery-plantings/{id}/plant, POST /trial-series/{id}/entries, POST /breeding-lines/{id}/stewardship-agreements, POST /stewardship-agreements/{id}/submit, POST /seed-increase-lots, POST /backcross-projects, POST /backcross-projects/{id}/marker-cycle"
  - priority: 17
    category: state
    check: "cross-entity: the CrossingBlock in the path has status = POLLINATED before a progeny line may be created"
    error_id: ERR_BLOCK_NOT_POLLINATED
    http_status: 409
    applies_to: "POST /crossing-blocks/{id}/progenies"
  - priority: 18
    category: state
    check: "cross-entity: the TrialSeries named by an advancement decision has status = ANALYZED"
    error_id: ERR_SERIES_INVALID_STATE
    http_status: 409
    applies_to: "POST /advancement-decisions"
  - priority: 19
    category: business_safety
    check: "regulatory gate: the lot's BreedingLine has a StewardshipAgreement whose status = APPROVED (line.stewardship_status = APPROVED); NOT_REQUIRED and PENDING both fail"
    error_id: ERR_STEWARDSHIP_NOT_APPROVED
    http_status: 422
    applies_to: "POST /seed-increase-lots, POST /seed-increase-lots/{id}/start-production"
  - priority: 20
    category: business_safety
    check: "regulatory gate: the line's stewardship_status is not SUSPENDED"
    error_id: ERR_STEWARDSHIP_SUSPENDED
    http_status: 409
    applies_to: "POST /seed-increase-lots, POST /seed-increase-lots/{id}/start-production, POST /advancement-decisions with decision=ADVANCE from PRE_COMMERCIAL"
  - priority: 21
    category: business_safety
    check: "segregation of duties: X-User-ID differs from agreement.approved_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /stewardship-agreements/{id}/suspend"
  - priority: 22
    category: business_referential
    check: "target_market appears in the approved_markets array of the line's APPROVED StewardshipAgreement"
    error_id: ERR_MARKET_NOT_IN_AGREEMENT
    http_status: 422
    applies_to: "POST /seed-increase-lots"
  - priority: 23
    category: business_referential
    check: "the referenced BreedingObjective.program_id equals the line's program_id"
    error_id: ERR_OBJECTIVE_PROGRAM_MISMATCH
    http_status: 422
    applies_to: "POST /breeding-lines, POST /crossing-blocks/{id}/progenies"
  - priority: 24
    category: business_referential
    check: "female_parent_line_id and male_parent_line_id both belong to the same program_id as the new line; a backcross donor_line_id belongs to the recurrent line's program"
    error_id: ERR_PARENT_LINE_PROGRAM_MISMATCH
    http_status: 422
    applies_to: "POST /crossing-blocks/{id}/progenies, POST /breeding-lines, POST /backcross-projects"
  - priority: 25
    category: business_constraint
    check: "posture gate: the target TrialSite.capacity_posture is not FROZEN"
    error_id: ERR_SITE_CAPACITY_FROZEN
    http_status: 409
    applies_to: "POST /trial-series/{id}/entries"
  - priority: 26
    category: business_constraint
    check: "posture gate: when TrialSite.capacity_posture = RESTRICTED, only a series whose stage IN {STAGE_2, STAGE_3} may add an entry"
    error_id: ERR_SITE_RESTRICTED_STAGE
    http_status: 409
    applies_to: "POST /trial-series/{id}/entries"
  - priority: 27
    category: business_temporal
    check: "block occupancy: the new planting's half-open interval [sow_date, occupancy_end_date) must not intersect the interval of any NurseryPlanting on the same block whose status IN {SCHEDULED, PLANTED, HARVESTED, FAILED}; touching endpoints (new.sow_date == existing.occupancy_end_date) do NOT conflict"
    error_id: ERR_BLOCK_OCCUPANCY_CONFLICT
    http_status: 409
    applies_to: "POST /nursery-plantings"
  - priority: 28
    category: business_temporal
    check: "the sow_date month is admissible for the block's nursery_type (WINTER: {10,11,12,1,2}; SUMMER: {4,5,6,7,8})"
    error_id: ERR_NURSERY_SEASON_MISMATCH
    http_status: 422
    applies_to: "POST /nursery-plantings"
  - priority: 29
    category: business_temporal
    check: "sow_date is not before the logical clock's current date"
    error_id: ERR_SOW_DATE_IN_PAST
    http_status: 422
    applies_to: "POST /nursery-plantings"
  - priority: 30
    category: business_temporal
    check: "planting_window_start >= site.season_start_date, planting_window_end <= site.season_end_date, and planting_window_end >= planting_window_start"
    error_id: ERR_ENTRY_WINDOW_OUTSIDE_SEASON
    http_status: 422
    applies_to: "POST /trial-series/{id}/entries"
  - priority: 31
    category: business_temporal
    check: "effective_from >= the logical clock's current date and effective_to > effective_from"
    error_id: ERR_AGREEMENT_DATES_INVALID
    http_status: 422
    applies_to: "POST /breeding-lines/{id}/stewardship-agreements"
  - priority: 32
    category: business_constraint
    check: "no existing TrialEntry with status IN {ENTERED, PLANTED, HARVESTED} has the same (trial_series_id, line_id, trial_site_id) triple"
    error_id: ERR_DUPLICATE_TRIAL_ENTRY
    http_status: 409
    applies_to: "POST /trial-series/{id}/entries"
  - priority: 33
    category: business_constraint
    check: "plot_count is an exact multiple of the series' replication_count"
    error_id: ERR_PLOT_COUNT_NOT_DIVISIBLE
    http_status: 422
    applies_to: "POST /trial-series/{id}/entries"
  - priority: 34
    category: business_constraint
    check: "no PhenotypeObservation with the same (trial_entry_id, trait_code, rep_number) exists, and rep_number is in 1..series.replication_count"
    error_id: ERR_DUPLICATE_OBSERVATION
    http_status: 409
    applies_to: "POST /trial-entries/{id}/observations"
  - priority: 35
    category: business_constraint
    check: "the entry's valid_rep_count is >= MIN_VALID_REPS (3)"
    error_id: ERR_INSUFFICIENT_REPLICATION
    http_status: 422
    applies_to: "POST /trial-entries/{id}/finalize"
  - priority: 36
    category: business_constraint
    check: "series.location_count >= series.min_locations and series.entry_count >= 2"
    error_id: ERR_INSUFFICIENT_LOCATIONS
    http_status: 422
    applies_to: "POST /trial-series/{id}/plant"
  - priority: 37
    category: business_constraint
    check: "for variant = BALANCED_CORE the core site set is non-empty; for either variant at least one HARVESTED entry exists"
    error_id: ERR_EMPTY_BALANCED_CORE
    http_status: 422
    applies_to: "POST /trial-series/{id}/analyses"
  - priority: 38
    category: business_constraint
    check: "the decision's line has at least one TrialEntry with status = HARVESTED in the referenced series"
    error_id: ERR_NO_TRIAL_DATA
    http_status: 422
    applies_to: "POST /advancement-decisions"
  - priority: 39
    category: business_constraint
    check: "for decision = ADVANCE out of NURSERY, line.advancement_readiness = READY"
    error_id: ERR_LINE_NOT_READY
    http_status: 422
    applies_to: "POST /advancement-decisions"
  - priority: 40
    category: business_constraint
    check: "for decision = ADVANCE, the CUMULATIVE line_advancement_index >= objective.min_advancement_index"
    error_id: ERR_INDEX_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST /advancement-decisions"
  - priority: 41
    category: business_constraint
    check: "the line has no StewardshipAgreement with status IN {DRAFT, SUBMITTED, CHANGES_REQUESTED, APPROVED}"
    error_id: ERR_AGREEMENT_ALREADY_ACTIVE
    http_status: 409
    applies_to: "POST /breeding-lines/{id}/stewardship-agreements"
  - priority: 42
    category: business_constraint
    check: "code uniqueness: NurseryBlock.block_code and TrialSite.site_code are globally unique; BreedingLine.designation is unique within its program_id"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /nursery-blocks, POST /trial-sites, POST /breeding-lines, POST /crossing-blocks/{id}/progenies"
  - priority: 43
    category: business_fiscal
    check: "planting.plot_count <= NurseryBlock.plot_count"
    error_id: ERR_BLOCK_PLOT_COUNT_EXCEEDED
    http_status: 422
    applies_to: "POST /nursery-plantings"
  - priority: 44
    category: business_fiscal
    check: "the post-insertion daily peak at the site is <= TrialSite.total_plot_capacity"
    error_id: ERR_SITE_PLOT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /trial-series/{id}/entries"
  - priority: 45
    category: business_fiscal
    check: "the plots the request commits (entry.plot_count, planting.plot_count, or decision.granted_plots) are <= BreedingProgram.plot_budget_remaining"
    error_id: ERR_PROGRAM_PLOT_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /trial-series/{id}/entries, POST /nursery-plantings, POST /advancement-decisions"
  - priority: 46
    category: business_fiscal
    check: "total_trial_cost_usd <= program.total_budget_usd - program.committed_budget_usd"
    error_id: ERR_PROGRAM_BUDGET_USD_EXCEEDED
    http_status: 409
    applies_to: "POST /trial-series/{id}/plant"
  - priority: 47
    category: business_fiscal
    check: "allocated_seed_g <= BreedingLine.seed_inventory_g"
    error_id: ERR_INSUFFICIENT_SEED_INVENTORY
    http_status: 409
    applies_to: "POST /seed-increase-lots"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- BreedingProgram -----------------------------------------------------
  - method: POST
    path: "/breeding-programs"
    description: "Register a breeding program with its plot and cash budgets."
    roles: [PipelineDirector]
    code: 201
    input: [name, crop_code, market_zone, total_plot_budget, total_budget_usd]
    output: BreedingProgram
    side_effects:
      - "status = ACTIVE; committed_plot_count = 0; committed_budget_usd = 0.00; active_line_count = 0; pre_commercial_units_bags = 0"
      - "plot_budget_remaining = total_plot_budget - committed_plot_count"
  - method: GET
    path: "/breeding-programs/{id}"
    description: "Read one breeding program with its live derived counters."
    roles: [PipelineDirector, ProgramLead, DataAnalyst]
    code: 200
    input: []
    output: BreedingProgram
    side_effects: []
  - method: POST
    path: "/breeding-programs/{id}/close"
    description: "Close a program; no further resources may be created or mutated under it."
    roles: [PipelineDirector]
    code: 200
    input: []
    output: BreedingProgram
    side_effects:
      - "status = CLOSED"
  - method: POST
    path: "/breeding-programs/{id}/objectives"
    description: "Define a market-specific breeding objective (yield, disease, quality weights and advancement bar)."
    roles: [ProgramLead, PipelineDirector]
    code: 201
    input: [market_segment, target_yield_kg_per_ha, required_disease_resistances, min_resistance_score, quality_trait_specs, yield_weight, disease_weight, quality_weight, min_advancement_index, min_generation_number]
    output: BreedingObjective
    side_effects:
      - "program_id = the path program"
  - method: GET
    path: "/breeding-programs/{id}/objectives"
    description: "List the objectives of one program (reverse-reachability for BreedingObjective.program_id)."
    roles: [PipelineDirector, ProgramLead, DataAnalyst, BreedingScientist]
    code: 200
    input: ["limit?", "offset?"]
    output: BreedingObjective[]
    side_effects: []
  - method: GET
    path: "/breeding-objectives/{id}"
    description: "Read one breeding objective."
    roles: [PipelineDirector, ProgramLead, DataAnalyst, BreedingScientist]
    code: 200
    input: []
    output: BreedingObjective
    side_effects: []
  - method: GET
    path: "/breeding-programs/{id}/trial-series"
    description: "List the trial series of one program (reverse-reachability for TrialSeries.program_id)."
    roles: [PipelineDirector, ProgramLead, DataAnalyst, TrialAgronomist]
    code: 200
    input: ["stage?", "status?", "limit?", "offset?"]
    output: TrialSeries[]
    side_effects: []
  - method: GET
    path: "/breeding-programs/{id}/pipeline-report"
    description: "Computed read: pipeline census and resource commitment for one program, derived live from the program's lines, entries, plantings and decisions."
    roles: [PipelineDirector, ProgramLead, DataAnalyst]
    code: 200
    input: []
    output:
      program_id: string
      status: string
      lines_by_stage: object
      active_line_count: integer
      discarded_line_count: integer
      committed_plot_count: integer
      plot_budget_remaining: integer
      total_plot_budget: integer
      committed_budget_usd: number
      budget_remaining_usd: number
      pre_commercial_units_bags: integer
      stewardship_approved_line_count: integer
      stewardship_suspended_line_count: integer
    side_effects: []
  # --- NurseryBlock --------------------------------------------------------
  - method: POST
    path: "/nursery-blocks"
    description: "Register a winter or summer nursery block with its plot count and fallow buffer."
    roles: [BreedingScientist]
    code: 201
    input: [block_code, nursery_type, location_code, plot_count, "fallow_buffer_days?"]
    output: NurseryBlock
    side_effects:
      - "occupancy_status = AVAILABLE; fallow_buffer_days defaults to 14 when omitted"
  - method: GET
    path: "/nursery-blocks/{id}"
    description: "Read one nursery block."
    roles: [PipelineDirector, BreedingScientist, DataAnalyst]
    code: 200
    input: []
    output: NurseryBlock
    side_effects: []
  # --- CrossingBlock -------------------------------------------------------
  - method: POST
    path: "/crossing-blocks"
    description: "Plan a crossing block inside a nursery block for one season."
    roles: [BreedingScientist, ProgramLead]
    code: 201
    input: [program_id, nursery_block_id, season_code, planned_cross_count]
    output: CrossingBlock
    side_effects:
      - "status = PLANNED; realized_cross_count = 0; progeny_line_count = 0"
  - method: GET
    path: "/crossing-blocks/{id}"
    description: "Read one crossing block."
    roles: [PipelineDirector, BreedingScientist, ProgramLead, DataAnalyst]
    code: 200
    input: []
    output: CrossingBlock
    side_effects: []
  - method: GET
    path: "/crossing-blocks"
    description: "Filtered list of crossing blocks (reverse-reachability for program_id and nursery_block_id)."
    roles: [PipelineDirector, BreedingScientist, ProgramLead, DataAnalyst]
    code: 200
    input: ["program_id?", "nursery_block_id?", "status?", "season_code?", "limit?", "offset?"]
    output: CrossingBlock[]
    side_effects: []
  - method: POST
    path: "/crossing-blocks/{id}/pollinate"
    description: "Record realized crosses; opens the block for progeny line registration."
    roles: [BreedingScientist]
    code: 200
    input: [realized_cross_count]
    output: CrossingBlock
    side_effects:
      - "status = POLLINATED; realized_cross_count stored"
  - method: POST
    path: "/crossing-blocks/{id}/progenies"
    description: "Register a progeny breeding line produced by this crossing block; auto-closes the block once progeny_line_count reaches realized_cross_count."
    roles: [BreedingScientist]
    code: 201
    input: [objective_id, designation, generation_number, female_parent_line_id, male_parent_line_id, "seed_inventory_g?", "disease_resistance_scores?", "quality_trait_values?"]
    output: BreedingLine
    side_effects:
      - "new BreedingLine with program_id = block.program_id, origin_block_id = the path block, pipeline_stage = NURSERY, stewardship_status = NOT_REQUIRED, advancement_readiness derived from the submitted generation_number exactly as on POST /breeding-lines"
      - "block.progeny_line_count += 1; block auto-transitions to CLOSED when progeny_line_count == realized_cross_count"
      - "program.active_line_count += 1"
      - "line.cumulative_seed_produced_g = seed_inventory_g at creation"
  # --- BreedingLine --------------------------------------------------------
  - method: POST
    path: "/breeding-lines"
    description: "Register a breeding line directly (introduction, check variety, or externally sourced germplasm)."
    roles: [BreedingScientist, ProgramLead]
    code: 201
    input: [program_id, objective_id, designation, generation_number, "female_parent_line_id?", "male_parent_line_id?", "seed_inventory_g?", "disease_resistance_scores?", "quality_trait_values?"]
    output: BreedingLine
    side_effects:
      - "pipeline_stage = NURSERY; stewardship_status = NOT_REQUIRED; origin_block_id = null"
      - "advancement_readiness is derived immediately from the submitted generation_number against objective.min_generation_number, so a line registered at or above that generation is READY at creation and one below it is NOT_READY"
      - "program.active_line_count += 1"
      - "line.cumulative_seed_produced_g = seed_inventory_g at creation"
  - method: GET
    path: "/breeding-lines/{id}"
    description: "Read one breeding line with both state dimensions and its derived indices."
    roles: [PipelineDirector, BreedingScientist, ProgramLead, DataAnalyst, RegulatoryOfficer, SupplyPlanner, TrialAgronomist]
    code: 200
    input: []
    output: BreedingLine
    side_effects: []
  - method: GET
    path: "/breeding-lines"
    description: "Filtered list of breeding lines (reverse-reachability for program_id, objective_id, origin_block_id and both parent self-references)."
    roles: [PipelineDirector, BreedingScientist, ProgramLead, DataAnalyst, RegulatoryOfficer, SupplyPlanner]
    code: 200
    input: ["program_id?", "objective_id?", "origin_block_id?", "female_parent_line_id?", "male_parent_line_id?", "pipeline_stage?", "stewardship_status?", "limit?", "offset?"]
    output: BreedingLine[]
    side_effects: []
  # --- NurseryPlanting -----------------------------------------------------
  - method: POST
    path: "/nursery-plantings"
    description: "Schedule a generation-advancement planting of one line in one nursery block."
    roles: [BreedingScientist]
    code: 201
    input: [nursery_block_id, line_id, sow_date, expected_harvest_date, plot_count]
    output: NurseryPlanting
    side_effects:
      - "status = SCHEDULED; occupancy_end_date = expected_harvest_date + block.fallow_buffer_days days"
      - "program.committed_plot_count += plot_count; plot_budget_remaining recomputed"
  - method: GET
    path: "/nursery-plantings/{id}"
    description: "Read one nursery planting."
    roles: [PipelineDirector, BreedingScientist, DataAnalyst]
    code: 200
    input: []
    output: NurseryPlanting
    side_effects: []
  - method: GET
    path: "/nursery-plantings"
    description: "Filtered list of nursery plantings (reverse-reachability for nursery_block_id and line_id)."
    roles: [PipelineDirector, BreedingScientist, DataAnalyst]
    code: 200
    input: ["nursery_block_id?", "line_id?", "status?", "limit?", "offset?"]
    output: NurseryPlanting[]
    side_effects: []
  - method: POST
    path: "/nursery-plantings/{id}/plant"
    description: "Mark a scheduled planting as sown; the block becomes OCCUPIED."
    roles: [BreedingScientist]
    code: 200
    input: []
    output: NurseryPlanting
    side_effects:
      - "status = PLANTED; block.occupancy_status = OCCUPIED"
  - method: POST
    path: "/nursery-plantings/{id}/harvest"
    description: "Record the harvest; branches to HARVESTED or FAILED at the MIN_ADVANCE_SEED_G threshold (nursery_harvest_credit)."
    roles: [BreedingScientist]
    code: 200
    input: [actual_harvest_date, harvested_seed_g]
    output: NurseryPlanting
    side_effects:
      - "runs nursery_harvest_credit"
      - "harvested_seed_g >= 250: status = HARVESTED; generation_advanced_to = line.generation_number + 1; line.generation_number, line.seed_inventory_g, line.cumulative_seed_produced_g and line.nursery_cycles_completed all updated; line.advancement_readiness re-derived"
      - "harvested_seed_g < 250: status = FAILED; generation_advanced_to = null; line fields unchanged"
      - "either branch: block.occupancy_status = FALLOW; program.committed_plot_count -= plot_count"
  # --- TrialSite -----------------------------------------------------------
  - method: POST
    path: "/trial-sites"
    description: "Register a multi-location trial site with its environment class, plot capacity and season window."
    roles: [TrialAgronomist]
    code: 201
    input: [site_code, environment_class, total_plot_capacity, plot_cost_usd, season_start_date, season_end_date]
    output: TrialSite
    side_effects:
      - "peak_committed_plot_count = 0; available_plot_count = total_plot_capacity; capacity_posture = OPEN"
  - method: GET
    path: "/trial-sites/{id}"
    description: "Read one trial site including its live peak occupancy and capacity posture."
    roles: [PipelineDirector, TrialAgronomist, ProgramLead, DataAnalyst]
    code: 200
    input: []
    output: TrialSite
    side_effects: []
  # --- TrialSeries ---------------------------------------------------------
  - method: POST
    path: "/trial-series"
    description: "Open a staged yield-trial series (network of entries across sites) for one program."
    roles: [ProgramLead, TrialAgronomist]
    code: 201
    input: [program_id, stage, season_year, plot_design, replication_count, min_locations]
    output: TrialSeries
    side_effects:
      - "status = PLANNING; entry_count = 0; location_count = 0; all three cost fields null"
  - method: GET
    path: "/trial-series/{id}"
    description: "Read one trial series with its entry/location census and cost breakdown."
    roles: [PipelineDirector, TrialAgronomist, ProgramLead, DataAnalyst]
    code: 200
    input: []
    output: TrialSeries
    side_effects: []
  - method: POST
    path: "/trial-series/{id}/entries"
    description: "Add one line-at-site entry to a planning series; runs the posture gate then the post-insertion peak capacity admission test."
    roles: [TrialAgronomist]
    code: 201
    input: [line_id, trial_site_id, plot_count, planting_window_start, planting_window_end]
    output: TrialEntry
    side_effects:
      - "status = ENTERED; valid_rep_count = 0; plot_mean_yield_kg = null; yield_kg_per_ha = null"
      - "series.entry_count += 1; series.location_count = the distinct trial_site_id count over non-terminal entries"
      - "runs site_capacity_peak_and_posture for the site: peak_committed_plot_count, available_plot_count and capacity_posture all re-derived"
      - "program.committed_plot_count += plot_count; plot_budget_remaining recomputed"
  - method: POST
    path: "/trial-series/{id}/plant"
    description: "Commit the series to the ground: locks the entry set, prices the trial and cascades PLANTED to every ENTERED entry."
    roles: [TrialAgronomist]
    code: 200
    input: []
    output: TrialSeries
    side_effects:
      - "status = PLANTED"
      - "runs trial_series_cost_allocation: plot_cost_subtotal_usd, management_fee_usd, total_trial_cost_usd"
      - "program.committed_budget_usd += total_trial_cost_usd"
      - "cascade: every entry with status = ENTERED becomes PLANTED"
  - method: POST
    path: "/trial-series/{id}/close"
    description: "Close an analyzed series; releases nothing but blocks all further mutation."
    roles: [PipelineDirector]
    code: 200
    input: []
    output: TrialSeries
    side_effects:
      - "status = CLOSED"
  - method: POST
    path: "/trial-series/{id}/analyses"
    description: "Run a stability analysis over the series under one inclusion variant; supersedes the previous analysis of the same variant."
    roles: [DataAnalyst]
    code: 201
    input: [variant, expected_series_version]
    output: TrialSeriesAnalysis
    side_effects:
      - "runs series_adjusted_entry_mean under the requested variant; writes entry_means and environment_index"
      - "every earlier TrialSeriesAnalysis of this series with the same variant gets is_superseded = true"
      - "series.status = ANALYZED (from DATA_COMPLETE); series.version += 1"
      - "for every line with an entry_means row: line.advancement_index_provisional re-derived"
  - method: GET
    path: "/trial-series/{id}/analyses"
    description: "List the analyses of one series (reverse-reachability for TrialSeriesAnalysis.trial_series_id)."
    roles: [PipelineDirector, DataAnalyst, ProgramLead, TrialAgronomist]
    code: 200
    input: ["variant?", "is_superseded?", "limit?", "offset?"]
    output: TrialSeriesAnalysis[]
    side_effects: []
  # --- TrialEntry and PhenotypeObservation ---------------------------------
  - method: GET
    path: "/trial-entries/{id}"
    description: "Read one trial entry with its replication census and yield rollup."
    roles: [PipelineDirector, TrialAgronomist, ProgramLead, DataAnalyst]
    code: 200
    input: []
    output: TrialEntry
    side_effects: []
  - method: GET
    path: "/trial-entries"
    description: "Filtered list of trial entries (reverse-reachability for trial_series_id, line_id and trial_site_id)."
    roles: [PipelineDirector, TrialAgronomist, ProgramLead, DataAnalyst]
    code: 200
    input: ["trial_series_id?", "line_id?", "trial_site_id?", "status?", "limit?", "offset?"]
    output: TrialEntry[]
    side_effects: []
  - method: POST
    path: "/trial-entries/{id}/observations"
    description: "Record one phenotype observation for one replicate of one trait on this entry."
    roles: [TrialAgronomist]
    code: 201
    input: [trait_code, rep_number, value, "qc_status?", "is_outlier?"]
    output: PhenotypeObservation
    side_effects:
      - "recorded_by_user_id = X-User-ID; qc_status defaults to ACCEPTED; is_outlier defaults to false"
      - "entry.valid_rep_count re-derived from the entry's YIELD observations per entry_yield_rollup"
  - method: GET
    path: "/trial-entries/{id}/observations"
    description: "List the observations of one entry (reverse-reachability for PhenotypeObservation.trial_entry_id)."
    roles: [PipelineDirector, TrialAgronomist, DataAnalyst]
    code: 200
    input: ["trait_code?", "qc_status?", "limit?", "offset?"]
    output: PhenotypeObservation[]
    side_effects: []
  - method: POST
    path: "/trial-entries/{id}/finalize"
    description: "Close data collection on one entry: computes the plot mean and hectare yield, then may bubble the series to DATA_COMPLETE."
    roles: [TrialAgronomist]
    code: 200
    input: []
    output: TrialEntry
    side_effects:
      - "runs entry_yield_rollup: plot_mean_yield_kg and yield_kg_per_ha written; status = HARVESTED"
      - "series auto-transitions PLANTED -> DATA_COMPLETE when no entry remains in status PLANTED"
  - method: POST
    path: "/trial-entries/{id}/withdraw"
    description: "Withdraw an entry before harvest; returns its plots to the program budget and the site's occupancy sweep."
    roles: [TrialAgronomist]
    code: 200
    input: [withdrawal_reason]
    output: TrialEntry
    side_effects:
      - "status = WITHDRAWN; program.committed_plot_count -= plot_count"
      - "site peak_committed_plot_count, available_plot_count and capacity_posture re-derived"
      - "series.entry_count -= 1; series.location_count re-derived"
      - "series auto-transitions PLANTED -> DATA_COMPLETE when no entry remains in status PLANTED"
  - method: POST
    path: "/trial-entries/{id}/invalidate"
    description: "Invalidate a planted entry whose plot data failed QC; the plots stay committed because the ground was used."
    roles: [TrialAgronomist]
    code: 200
    input: [withdrawal_reason]
    output: TrialEntry
    side_effects:
      - "status = INVALIDATED; plot_mean_yield_kg = null; yield_kg_per_ha = null"
      - "program.committed_plot_count -= plot_count (INVALIDATED entries leave the commitment set exactly as WITHDRAWN ones do)"
      - "site peak_committed_plot_count, available_plot_count and capacity_posture re-derived"
      - "series.entry_count and series.location_count unchanged (the entry was planted, so it still counts as a location that was sown)"
      - "series auto-transitions PLANTED -> DATA_COMPLETE when no entry remains in status PLANTED"
  # --- AdvancementDecision -------------------------------------------------
  - method: POST
    path: "/advancement-decisions"
    description: "Record a stage-gate decision (ADVANCE / HOLD / DISCARD) for one line against one analyzed series, with the plot resources granted for the next stage. Guarded by optimistic concurrency on the line."
    roles: [PipelineDirector]
    code: 201
    input: [line_id, trial_series_id, decision, granted_plots, expected_line_version, "rationale?"]
    output: AdvancementDecision
    side_effects:
      - "runs line_advancement_index in CUMULATIVE variant; decision_index_value = that value; from_stage / to_stage recorded"
      - "every earlier AdvancementDecision for the same (line_id, trial_series_id) pair gets is_superseded = true"
      - "decision = ADVANCE: line.pipeline_stage moves one step; program.committed_plot_count += granted_plots; line.advancement_readiness = NOT_READY; entering PRE_COMMERCIAL also requires stewardship_status = APPROVED"
      - "decision = HOLD: line.pipeline_stage unchanged; granted_plots must be 0"
      - "decision = DISCARD: the four-level discard cascade of the BreedingLine state machine runs"
      - "line.version += 1 in every branch"
  - method: GET
    path: "/advancement-decisions/{id}"
    description: "Read one advancement decision."
    roles: [PipelineDirector, ProgramLead, DataAnalyst]
    code: 200
    input: []
    output: AdvancementDecision
    side_effects: []
  - method: GET
    path: "/advancement-decisions"
    description: "Filtered list of advancement decisions (reverse-reachability for line_id and trial_series_id)."
    roles: [PipelineDirector, ProgramLead, DataAnalyst]
    code: 200
    input: ["line_id?", "trial_series_id?", "decision?", "is_superseded?", "limit?", "offset?"]
    output: AdvancementDecision[]
    side_effects: []
  # --- StewardshipAgreement ------------------------------------------------
  - method: POST
    path: "/breeding-lines/{id}/stewardship-agreements"
    description: "Draft the regulatory and grower stewardship package for a traited line."
    roles: [RegulatoryOfficer]
    code: 201
    input: [approved_markets, regulatory_dossier_ref, grower_agreement_ref, effective_from, effective_to]
    output: StewardshipAgreement
    side_effects:
      - "status = DRAFT; revision_round = 0; line.stewardship_status = PENDING"
  - method: GET
    path: "/breeding-lines/{id}/stewardship-agreements"
    description: "List the stewardship agreements of one line (reverse-reachability for StewardshipAgreement.line_id)."
    roles: [PipelineDirector, RegulatoryOfficer, ProgramLead, SupplyPlanner, DataAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: StewardshipAgreement[]
    side_effects: []
  - method: GET
    path: "/stewardship-agreements/{id}"
    description: "Read one stewardship agreement including its revision round and reviewer identities."
    roles: [PipelineDirector, RegulatoryOfficer, ProgramLead, SupplyPlanner, DataAnalyst]
    code: 200
    input: []
    output: StewardshipAgreement
    side_effects: []
  - method: POST
    path: "/stewardship-agreements/{id}/submit"
    description: "Submit a draft or revised agreement for review."
    roles: [RegulatoryOfficer]
    code: 200
    input: []
    output: StewardshipAgreement
    side_effects:
      - "status = SUBMITTED; submitted_by_user_id = X-User-ID; requested_changes = null"
  - method: POST
    path: "/stewardship-agreements/{id}/review"
    description: "Approve the agreement or send it back for changes; approval flips the line's stewardship dimension to APPROVED."
    roles: [RegulatoryOfficer, PipelineDirector]
    code: 200
    input: [outcome, "requested_changes?"]
    output: StewardshipAgreement
    side_effects:
      - "outcome = APPROVE: status = APPROVED; approved_by_user_id = X-User-ID; line.stewardship_status = APPROVED"
      - "outcome = REQUEST_CHANGES: status = CHANGES_REQUESTED; revision_round += 1; requested_changes stored; line.stewardship_status stays PENDING"
  - method: POST
    path: "/stewardship-agreements/{id}/suspend"
    description: "Suspend an approved agreement; segregation of duties forbids the approver from suspending their own approval. Cascades a production stop through the line's seed increase lots."
    roles: [RegulatoryOfficer, PipelineDirector]
    code: 200
    input: [suspension_reason]
    output: StewardshipAgreement
    side_effects:
      - "status = SUSPENDED; suspension_reason stored"
      - "the four-level suspend cascade of the StewardshipAgreement state machine runs"
  # --- SeedIncreaseLot -----------------------------------------------------
  - method: POST
    path: "/seed-increase-lots"
    description: "Reserve a pre-commercial seed increase lot for one market of one stewardship-approved line; plans launch volume with per-market ceil-then-sum bag arithmetic."
    roles: [SupplyPlanner]
    code: 201
    input: [line_id, target_market, market_allocations, launch_year]
    output: SeedIncreaseLot
    side_effects:
      - "runs seed_increase_volume_plan: planned_units_bags and allocated_seed_g"
      - "status = RESERVED; line.reserved_seed_g += allocated_seed_g; line.seed_inventory_g -= allocated_seed_g"
      - "line.planned_launch_units_bags and program.pre_commercial_units_bags re-derived"
  - method: GET
    path: "/seed-increase-lots/{id}"
    description: "Read one seed increase lot with its bag plan."
    roles: [PipelineDirector, SupplyPlanner, ProgramLead, DataAnalyst]
    code: 200
    input: []
    output: SeedIncreaseLot
    side_effects: []
  - method: GET
    path: "/breeding-lines/{id}/seed-increase-lots"
    description: "List the seed increase lots of one line (reverse-reachability for SeedIncreaseLot.line_id)."
    roles: [PipelineDirector, SupplyPlanner, ProgramLead, DataAnalyst]
    code: 200
    input: ["status?", "launch_year?", "limit?", "offset?"]
    output: SeedIncreaseLot[]
    side_effects: []
  - method: POST
    path: "/seed-increase-lots/{id}/start-production"
    description: "Move a reserved lot into field multiplication; re-checks the stewardship gate at the moment of production."
    roles: [SupplyPlanner]
    code: 200
    input: []
    output: SeedIncreaseLot
    side_effects:
      - "status = IN_PRODUCTION"
  - method: POST
    path: "/seed-increase-lots/{id}/complete"
    description: "Complete field multiplication; the reserved seed is consumed and the produced volume is credited to the line."
    roles: [SupplyPlanner]
    code: 200
    input: []
    output: SeedIncreaseLot
    side_effects:
      - "status = COMPLETED; line.reserved_seed_g -= allocated_seed_g; line.consumed_seed_g += allocated_seed_g"
      - "line.cumulative_seed_produced_g += allocated_seed_g * FIELD_MULTIPLICATION_FACTOR; line.seed_inventory_g += allocated_seed_g * FIELD_MULTIPLICATION_FACTOR"
  - method: POST
    path: "/seed-increase-lots/{id}/cancel"
    description: "Cancel a lot and compensate the line's seed ledger exactly, leaving no drift."
    roles: [SupplyPlanner]
    code: 200
    input: ["hold_reason?"]
    output: SeedIncreaseLot
    side_effects:
      - "status = CANCELLED; compensating credit: line.reserved_seed_g -= allocated_seed_g and line.seed_inventory_g += allocated_seed_g"
      - "line.planned_launch_units_bags and program.pre_commercial_units_bags re-derived"
  # --- BackcrossProject ----------------------------------------------------
  - method: POST
    path: "/backcross-projects"
    description: "Open a trait-integration backcross program from a donor line into a recurrent line."
    roles: [BreedingScientist]
    code: 201
    input: [recurrent_line_id, donor_line_id, target_trait_code, marker_assisted]
    output: BackcrossProject
    side_effects:
      - "status = ACTIVE; bc_generation = 1; target_marker_present = false; runs marker_recovery_pct for the initial recurrent_genome_pct"
  - method: GET
    path: "/backcross-projects/{id}"
    description: "Read one backcross project with its current generation and genome recovery."
    roles: [PipelineDirector, BreedingScientist, ProgramLead, DataAnalyst]
    code: 200
    input: []
    output: BackcrossProject
    side_effects: []
  - method: GET
    path: "/backcross-projects"
    description: "Filtered list of backcross projects (reverse-reachability for recurrent_line_id and donor_line_id)."
    roles: [PipelineDirector, BreedingScientist, ProgramLead, DataAnalyst]
    code: 200
    input: ["recurrent_line_id?", "donor_line_id?", "status?", "target_trait_code?", "limit?", "offset?"]
    output: BackcrossProject[]
    side_effects: []
  - method: POST
    path: "/backcross-projects/{id}/marker-cycle"
    description: "Advance one backcross generation and re-screen for the target marker; converts the project once the capped genome recovery clears the conversion threshold with the marker present."
    roles: [BreedingScientist]
    code: 200
    input: [target_marker_present]
    output: BackcrossProject
    side_effects:
      - "bc_generation += 1; runs marker_recovery_pct; recurrent_genome_pct rewritten"
      - "conversion branch: status = CONVERTED and the recurrent line's disease_resistance_scores[target_trait_code] is set to CONVERTED_TRAIT_SCORE (8), which re-derives that line's advancement_index_provisional"
      - "non-conversion branch: status stays ACTIVE"
  # --- test-driving surface ------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time. Every date comparison in 1.4 and every window rule in 1.3 reads this clock."
    roles: [PipelineDirector, ProgramLead, BreedingScientist, TrialAgronomist, DataAnalyst, RegulatoryOfficer, SupplyPlanner]
    code: 200
    input: [current_utc]
    output:
      current_utc: string
    side_effects:
      - "the logical clock is set; no entity is recomputed by this call alone"

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # --- authentication / authorization --------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing, or X-User-Role is not one of the seven declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_PROGRAM_SCOPE_VIOLATION
    http: 403
    condition: "a ProgramLead acts on a resource whose owning BreedingProgram.id differs from X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the user suspending a stewardship agreement is the same user recorded in approved_by_user_id"
  # --- request shape --------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, missing required field, unknown enum member, out-of-range number, malformed date, bad pagination, or a body-local cross-field rule violated (granted_plots non-zero on a HOLD/DISCARD decision, donor_line_id equal to recurrent_line_id, empty market_allocations, non-positive demand_kg, weights that do not sum to 1.00, expected_harvest_date <= sow_date)"
  # --- existence ------------------------------------------------------------
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "no BreedingProgram with the given id"
  - id: ERR_OBJECTIVE_NOT_FOUND
    http: 404
    condition: "no BreedingObjective with the given id"
  - id: ERR_NURSERY_BLOCK_NOT_FOUND
    http: 404
    condition: "no NurseryBlock with the given id"
  - id: ERR_CROSSING_BLOCK_NOT_FOUND
    http: 404
    condition: "no CrossingBlock with the given id"
  - id: ERR_LINE_NOT_FOUND
    http: 404
    condition: "no BreedingLine with the given id (path id, line_id, parent line id, recurrent_line_id or donor_line_id)"
  - id: ERR_PLANTING_NOT_FOUND
    http: 404
    condition: "no NurseryPlanting with the given id"
  - id: ERR_TRIAL_SITE_NOT_FOUND
    http: 404
    condition: "no TrialSite with the given id"
  - id: ERR_TRIAL_SERIES_NOT_FOUND
    http: 404
    condition: "no TrialSeries with the given id"
  - id: ERR_TRIAL_ENTRY_NOT_FOUND
    http: 404
    condition: "no TrialEntry with the given id"
  - id: ERR_DECISION_NOT_FOUND
    http: 404
    condition: "no AdvancementDecision with the given id"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "no StewardshipAgreement with the given id"
  - id: ERR_SEED_LOT_NOT_FOUND
    http: 404
    condition: "no SeedIncreaseLot with the given id"
  - id: ERR_BACKCROSS_NOT_FOUND
    http: 404
    condition: "no BackcrossProject with the given id"
  # --- optimistic concurrency ----------------------------------------------
  - id: ERR_STALE_LINE_VERSION
    http: 412
    condition: "expected_line_version does not equal the BreedingLine's current version"
  - id: ERR_STALE_SERIES_VERSION
    http: 412
    condition: "expected_series_version does not equal the TrialSeries' current version"
  # --- state ----------------------------------------------------------------
  - id: ERR_PROGRAM_CLOSED
    http: 409
    condition: "the owning BreedingProgram has status = CLOSED"
  - id: ERR_PLANTING_INVALID_STATE
    http: 409
    condition: "the NurseryPlanting is not in the state the requested transition needs (SCHEDULED for plant, PLANTED for harvest)"
  - id: ERR_SERIES_INVALID_STATE
    http: 409
    condition: "the TrialSeries is not in the state the operation needs (PLANNING for entries and plant, DATA_COMPLETE or ANALYZED for analyses, ANALYZED for close, ANALYZED for being cited by an advancement decision)"
  - id: ERR_ENTRY_INVALID_STATE
    http: 409
    condition: "the TrialEntry is not in the state the operation needs (PLANTED for finalize and invalidate, ENTERED or PLANTED for withdraw and observations)"
  - id: ERR_AGREEMENT_INVALID_STATE
    http: 409
    condition: "the StewardshipAgreement is not in the state the operation needs (DRAFT or CHANGES_REQUESTED for submit, SUBMITTED for review, APPROVED for suspend)"
  - id: ERR_LOT_INVALID_STATE
    http: 409
    condition: "the SeedIncreaseLot is not in the state the operation needs (RESERVED for start-production, IN_PRODUCTION for complete, RESERVED/IN_PRODUCTION/ON_HOLD for cancel)"
  - id: ERR_PROJECT_NOT_ACTIVE
    http: 409
    condition: "the BackcrossProject is CONVERTED or TERMINATED and cannot run another marker cycle"
  - id: ERR_LINE_DISCARDED
    http: 409
    condition: "a BreedingLine referenced by the operation has pipeline_stage = DISCARDED"
  - id: ERR_BLOCK_NOT_POLLINATED
    http: 409
    condition: "a progeny line is registered against a CrossingBlock that is still PLANNED or already CLOSED"
  # --- regulatory / stewardship safety --------------------------------------
  - id: ERR_STEWARDSHIP_NOT_APPROVED
    http: 422
    condition: "seed increase or PRE_COMMERCIAL advancement attempted on a line whose stewardship_status is NOT_REQUIRED or PENDING"
  - id: ERR_STEWARDSHIP_SUSPENDED
    http: 409
    condition: "seed increase or PRE_COMMERCIAL advancement attempted on a line whose stewardship_status is SUSPENDED"
  # --- referential integrity beyond existence -------------------------------
  - id: ERR_MARKET_NOT_IN_AGREEMENT
    http: 422
    condition: "target_market is absent from the approved_markets array of the line's APPROVED stewardship agreement"
  - id: ERR_OBJECTIVE_PROGRAM_MISMATCH
    http: 422
    condition: "the referenced BreedingObjective belongs to a different program than the line being created"
  - id: ERR_PARENT_LINE_PROGRAM_MISMATCH
    http: 422
    condition: "a parent line, or a backcross donor line, belongs to a different program than the line being created or converted"
  # --- capacity posture gates ----------------------------------------------
  - id: ERR_SITE_CAPACITY_FROZEN
    http: 409
    condition: "the target TrialSite's capacity_posture is FROZEN"
  - id: ERR_SITE_RESTRICTED_STAGE
    http: 409
    condition: "the target TrialSite's capacity_posture is RESTRICTED and the series stage is not STAGE_2 or STAGE_3"
  # --- temporal -------------------------------------------------------------
  - id: ERR_BLOCK_OCCUPANCY_CONFLICT
    http: 409
    condition: "the requested [sow_date, occupancy_end_date) interval intersects an existing planting interval on the same nursery block"
  - id: ERR_NURSERY_SEASON_MISMATCH
    http: 422
    condition: "the sow_date month is outside the admissible months of the block's nursery_type"
  - id: ERR_SOW_DATE_IN_PAST
    http: 422
    condition: "sow_date is earlier than the logical clock's current date"
  - id: ERR_ENTRY_WINDOW_OUTSIDE_SEASON
    http: 422
    condition: "the entry's planting window falls outside the site's season window, or ends before it starts"
  - id: ERR_AGREEMENT_DATES_INVALID
    http: 422
    condition: "effective_from is earlier than the logical clock's current date, or effective_to is not strictly after effective_from"
  # --- business constraints -------------------------------------------------
  - id: ERR_DUPLICATE_TRIAL_ENTRY
    http: 409
    condition: "a non-withdrawn TrialEntry already exists for the same (trial_series_id, line_id, trial_site_id) triple"
  - id: ERR_PLOT_COUNT_NOT_DIVISIBLE
    http: 422
    condition: "the entry's plot_count is not an exact multiple of the series' replication_count"
  - id: ERR_DUPLICATE_OBSERVATION
    http: 409
    condition: "an observation already exists for the same (trial_entry_id, trait_code, rep_number), or rep_number is outside 1..replication_count"
  - id: ERR_INSUFFICIENT_REPLICATION
    http: 422
    condition: "finalize attempted with valid_rep_count below MIN_VALID_REPS (3)"
  - id: ERR_INSUFFICIENT_LOCATIONS
    http: 422
    condition: "plant attempted with location_count below the series' min_locations, or with fewer than two entries"
  - id: ERR_EMPTY_BALANCED_CORE
    http: 422
    condition: "the requested analysis variant yields an empty inclusion set (no balanced core site, or no harvested entry at all)"
  - id: ERR_NO_TRIAL_DATA
    http: 422
    condition: "an advancement decision cites a series in which the line has no HARVESTED entry"
  - id: ERR_LINE_NOT_READY
    http: 422
    condition: "ADVANCE out of NURSERY attempted while advancement_readiness = NOT_READY"
  - id: ERR_INDEX_BELOW_THRESHOLD
    http: 422
    condition: "ADVANCE attempted while the CUMULATIVE line_advancement_index is below the objective's min_advancement_index"
  - id: ERR_AGREEMENT_ALREADY_ACTIVE
    http: 409
    condition: "the line already has a stewardship agreement in DRAFT, SUBMITTED, CHANGES_REQUESTED or APPROVED"
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "block_code or site_code is already taken, or the line designation is already used inside the same program"
  # --- fiscal / capacity ----------------------------------------------------
  - id: ERR_BLOCK_PLOT_COUNT_EXCEEDED
    http: 422
    condition: "the planting's plot_count exceeds the nursery block's physical plot_count"
  - id: ERR_SITE_PLOT_CAPACITY_EXCEEDED
    http: 409
    condition: "admitting the entry would push the site's daily peak occupancy above total_plot_capacity"
  - id: ERR_PROGRAM_PLOT_BUDGET_EXCEEDED
    http: 409
    condition: "the plots the request would commit exceed the program's plot_budget_remaining"
  - id: ERR_PROGRAM_BUDGET_USD_EXCEEDED
    http: 409
    condition: "the series' total_trial_cost_usd exceeds the program's uncommitted cash budget"
  - id: ERR_INSUFFICIENT_SEED_INVENTORY
    http: 409
    condition: "the lot's allocated_seed_g exceeds the line's seed_inventory_g"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix (peer_roles: each role owns a disjoint slice of the pipeline;
#     PipelineDirector owns the stage gates, not the specialists' day work)
# ---------------------------------------------------------------------------
roles:
  - name: PipelineDirector
    description: "Owns the R&D portfolio: creates and closes programs, records every stage-gate advancement decision, and closes analyzed series. Global scope, not tied to one program."
    identity: "opaque"
    exclusive_operations:
      - "POST /breeding-programs"
      - "POST /breeding-programs/{id}/close"
      - "POST /advancement-decisions"
      - "POST /trial-series/{id}/close"
    shared_operations:
      - "POST /breeding-programs/{id}/objectives (with ProgramLead)"
      - "POST /stewardship-agreements/{id}/review (with RegulatoryOfficer)"
      - "POST /stewardship-agreements/{id}/suspend (with RegulatoryOfficer)"
      - "every GET in 1.5"
      - "POST /_clock/set_current_utc"
  - name: ProgramLead
    description: "Runs one breeding program. X-User-ID is that program's id, and every resource the lead touches must belong to it (1.4 priority 5)."
    identity: "entity_backed:BreedingProgram"
    exclusive_operations: []
    shared_operations:
      - "POST /breeding-programs/{id}/objectives (with PipelineDirector)"
      - "POST /crossing-blocks (with BreedingScientist)"
      - "POST /breeding-lines (with BreedingScientist)"
      - "POST /trial-series (with TrialAgronomist)"
      - "GET reads scoped to the lead's own program"
      - "POST /_clock/set_current_utc"
