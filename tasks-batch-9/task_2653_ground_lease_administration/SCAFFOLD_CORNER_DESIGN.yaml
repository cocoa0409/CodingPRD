              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-97", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
              captures: { lease_id: $.data.id }
            - call: "POST /portfolio/leases/${lease_id}/rent-revaluations"
              payload: { valuation_date: "2027-06-01T00:00:00Z" }
              as: LessorAdmin
              captures: { reval_id: $.data.id }
            - call: "POST /portfolio/rent-revaluations/${reval_id}/appraisals"
              payload: { appointed_by: "LESSOR", appraised_annual_rent_cents: 12000000, valuation_method_code: "COMPARABLE_LAND" }
              as: LessorAdmin
              as_user_id: "appraiser-lessor-1"
            - call: "POST /portfolio/rent-revaluations/${reval_id}/appraisals"
              payload: { appointed_by: "LESSEE", appraised_annual_rent_cents: 10500000, valuation_method_code: "INCOME_CAP" }
              as: GroundTenant
              as_user_id: "${lessee_id}"
            - call: "POST /portfolio/rent-revaluations/${reval_id}/exchange"
              payload: {}
              as: LessorAdmin
          trigger:
            - call: "POST /portfolio/rent-revaluations/${reval_id}/settle"
              payload: {}
              as: LessorAdmin
            - call: "GET /portfolio/leases/${lease_id}/rent-summary"
              payload: {}
              as: MortgageeAgent
              as_user_id: "agent-keystone-1"
          assert:
            - "after setup: divergence_bps == 1429 (round_half_up of 1428.571)"
            - "trigger[0] returns 200 with resolved_annual_base_rent_cents == 11250000, resolution_method MIDPOINT_SETTLEMENT, status RESOLVED"
            - "trigger[1] reports current_annual_base_rent_cents 11250000"
            - "Lease.${lease_id}.next_revaluation_date == 2030-01-01T00:00:00Z (the interval advances off the prior schedule, not off the settlement date)"

      - name: sublease_inclusion_base_counts_only_active_subleases
        claim_type: input_set_filtering
        grounds:
          - calculations.sublease_inclusion_base
          - endpoints.POST_/portfolio/transfer-requests/{id}/fee-payments
        distinguishing_aspect: |
          Three subleases on one lease in three different statuses, and only the ACTIVE one belongs to
          the inclusion base: a CONSENT_GRANTED sublease whose fee is unpaid and a CONSENT_DENIED one
          must both contribute 0. Summing every row would give 12500000 of inclusion instead of 6000000,
          and the derived active_sublease_count would read 3 instead of 1.
        test_recipe:
          setup:
            - "One lease with S1 (UNIT-A, ACTIVE, rent 12000000), S2 (UNIT-B, CONSENT_GRANTED, unpaid, rent 8000000) and S3 (UNIT-C, CONSENT_DENIED, rent 5000000)."
