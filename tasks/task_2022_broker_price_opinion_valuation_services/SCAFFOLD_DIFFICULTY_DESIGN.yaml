            - call: "POST /bpo/brokers/${brk_o}/activate"
              payload: {}
              as: ComplianceOfficer
            # Pre-existing batch — for simplicity assume broker has no orders yet; an empty batch is allowed to be created (order_count >= 1 only enforced at approve)
            - call: "POST /bpo/payout-batches"
              payload: { broker_id: "${brk_o}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-15T00:00:00Z" }
