  - section: cross_cutting_complexity_layers
    instances:
      - name: corner_occ_stale_contributor_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[payout-create-stale-contributor]", "errors[ERR_STALE_CONTRIBUTOR_VERSION]"]
        distinguishing_aspect: "Two sequential payout creates with the SAME captured expected_contributor_version: the first succeeds (version advances), the second is rejected ERR_STALE_CONTRIBUTOR_VERSION (412)."
        test_recipe:
          setup: ["US/W9 ACTIVE contributor with +20000 adjustment (available 20000 >= threshold twice? no — first payout drains to 0). Capture version v0 after the adjustment."]
          setup_api_calls:
            - call: "POST /contributors"
              payload: { display_name: "Oc", country_code: "US" }
              as: Contributor
              captures: { c_id: $.data.id }
            - call: "POST /contributors/${c_id}/tax-forms"
              payload: { form_type: "W9", tax_id: "US-12" }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { tf_id: $.data.id }
            - call: "POST /tax-forms/${tf_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
            - call: "POST /contributors/${c_id}/earning-adjustments"
              payload: { amount_cents: 20000, reason: "s" }
              as: FinanceAdmin
            - call: "GET /contributors/${c_id}"
              payload: {}
              as: FinanceAdmin
              captures: { v0: $.data.version }
          trigger:
            - call: "POST /contributors/${c_id}/payouts"
              payload: { expected_contributor_version: "${v0}" }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { p1: $.data.id }
            - call: "POST /contributors/${c_id}/payouts"
              payload: { expected_contributor_version: "${v0}" }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "first payout ${p1} created (status REQUESTED); contributor.version advanced past ${v0}"
            - "second trigger error_id == ERR_STALE_CONTRIBUTOR_VERSION (412) because ${v0} is now stale"

      - name: corner_version_increments_on_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.Contributor]
        distinguishing_aspect: "Each Contributor mutation increments version by exactly 1: create (1) -> submit tax (2) -> verify+activate (3)."
