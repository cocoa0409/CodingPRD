          assert:
            - "required_amount_cents == 900001"

      - name: five_fifty_ignores_entity_holders
        claim_type: input_set_filtering
        grounds: [calculations.calc_five_fifty]
        distinguishing_aspect: "Only INDIVIDUAL holders feed the top-5 sum: one INDIVIDUAL at 45% plus one ENTITY at 55% yields top5_individual_pct == 45.0 and five_fifty_passed == true."
        test_recipe:
          setup: ["Reit R1 ACTIVE; INDIVIDUAL holder 450/1000, ENTITY holder 550/1000; snapshot 2026-06-30"]
