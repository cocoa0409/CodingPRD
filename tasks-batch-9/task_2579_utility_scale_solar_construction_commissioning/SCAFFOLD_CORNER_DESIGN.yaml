            - call: "POST /solar/string-circuits/${sc}/test-results"
              payload: { insulation_resistance_mohm: 39.9, measured_voc_v: 705.00, ambient_c: 40, polarity_ok: true }
              as: InstallationForeman
              captures: { r1: $.data.test_failure_reason, s1: $.data.status, ev: $.data.expected_voc_v }
            - call: "POST /solar/string-circuits/${sc}/test-results"
