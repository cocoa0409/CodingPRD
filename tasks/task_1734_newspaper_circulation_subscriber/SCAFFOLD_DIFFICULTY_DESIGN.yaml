scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — dual_variant_calc: two dual-variant calculations on DIFFERENT
  # entity domains (VacationHold/subscriber-billing vs Carrier settlement).
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: proration_per_day_vs_per_issue_divergence
        grounds:
          - calculations.vacation_proration_credit
          - entities.SubscriptionPlan.fields.proration_method
          - entities.VacationHold.fields.credit_amount_cents
        distinguishing_aspect: |
          Same hold window and same weekly rate produce different credits depending
          on plan.proration_method: PER_DAY rounds once after multiplying (571),
          PER_ISSUE rounds the per-issue rate first then multiplies (572). Entity
          domain: subscriber billing (VacationHold/CreditMemo).
        test_recipe:
          setup:
            - "Two print plans identical except proration_method (PER_DAY vs PER_ISSUE), base_weekly_rate_cents 1000, issues_per_week 7"
            - "Two ACTIVE subscriptions started 2026-08-03, each with a weekly 1000-cent charge (due 2026-08-17)"
            - "Each subscription has a CREDIT hold over [2026-08-10, 2026-08-14) = 4 held days, completed on 2026-08-14"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CirculationDirector }
            - call: "POST /api/subscription-plans"
              payload: { name: "PD", plan_type: "PRINT", issues_per_week: 7, base_weekly_rate_cents: 1000, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_pd: $.data.id }
            - call: "POST /api/subscription-plans"
              payload: { name: "PI", plan_type: "PRINT", issues_per_week: 7, base_weekly_rate_cents: 1000, proration_method: "PER_ISSUE", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_pi: $.data.id }
            - call: "POST /api/subscribers"
              payload: { display_name: "A", email: "a@x.com", service_address: "1 Main St" }
              as: ServiceRep
              captures: { sub_a: $.data.id }
            - call: "POST /api/subscribers"
              payload: { display_name: "B", email: "b@x.com", service_address: "2 Main St" }
              as: ServiceRep
              captures: { sub_b: $.data.id }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_a}", plan_id: "${plan_pd}", start_date: "2026-08-03" }
              as: ServiceRep
              captures: { subsc_a: $.data.id }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_b}", plan_id: "${plan_pi}", start_date: "2026-08-03" }
              as: ServiceRep
              captures: { subsc_b: $.data.id }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "POST /api/subscriptions/${subsc_a}/vacation-holds"
              payload: { start_date: "2026-08-10", end_date: "2026-08-14", resolution: "CREDIT" }
              as: ServiceRep
              captures: { hold_a: $.data.id }
            - call: "POST /api/subscriptions/${subsc_b}/vacation-holds"
              payload: { start_date: "2026-08-10", end_date: "2026-08-14", resolution: "CREDIT" }
              as: ServiceRep
              captures: { hold_b: $.data.id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: CirculationDirector }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-14T00:00:00Z" }, as: CirculationDirector }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
          trigger:
            - call: "GET /api/credit-memos"
              payload: { hold_id: "${hold_a}" }
              as: ServiceRep
              captures: { cm_a_amt: "$.data[0].amount_cents" }
            - call: "GET /api/credit-memos"
              payload: { hold_id: "${hold_b}" }
              as: ServiceRep
              captures: { cm_b_amt: "$.data[0].amount_cents" }
          assert:
            - "CreditMemo for ${hold_a} (PER_DAY) has amount_cents == 571 (round_half_up(1000*4/7) = 571)"
            - "CreditMemo for ${hold_b} (PER_ISSUE) has amount_cents == 572 (round_half_up(1000/7)=143, 143*4=572)"
            - "${cm_a_amt} != ${cm_b_amt} for identical hold windows and weekly rates"

      - name: carrier_settlement_gross_vs_net_divergence
        grounds:
          - calculations.carrier_settlement
          - entities.Carrier.fields.compensation_model
        distinguishing_aspect: |
          Same delivered copies, rate, and complaint count produce different
          net_cents depending on carrier.compensation_model: PER_COPY_GROSS forces
          deduction to 0 (368), PER_COPY_NET_OF_COMPLAINTS deducts 150 (218).
          Entity domain: Carrier compensation — distinct from instance 1's
          subscriber-billing domain.
        test_recipe:
          setup:
            - "Two carriers (GROSS vs NET_OF_COMPLAINTS), per_copy_rate_cents 50, each with one route and one full-week (7-day) assignment from 2026-07-27"
            - "One OPEN complaint with service_date 2026-08-05 on each carrier's route"
            - "Settlement week under test: Monday 2026-08-03 .. 2026-08-09"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-27T00:00:00Z" }, as: CirculationDirector }
            - call: "POST /api/subscription-plans"
              payload: { name: "P", plan_type: "PRINT", issues_per_week: 7, base_weekly_rate_cents: 700, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_p: $.data.id }
            - call: "POST /api/carriers"
              payload: { display_name: "G", compensation_model: "PER_COPY_GROSS", per_copy_rate_cents: 50 }
              as: DistrictManager
              captures: { car_g: $.data.id }
            - call: "POST /api/carriers"
              payload: { display_name: "N", compensation_model: "PER_COPY_NET_OF_COMPLAINTS", per_copy_rate_cents: 50 }
              as: DistrictManager
              captures: { car_n: $.data.id }
            - call: "POST /api/routes"
              payload: { route_code: "RG", carrier_id: "${car_g}", max_stops: 10 }
              as: DistrictManager
              captures: { route_g: $.data.id }
            - call: "POST /api/routes"
              payload: { route_code: "RN", carrier_id: "${car_n}", max_stops: 10 }
              as: DistrictManager
              captures: { route_n: $.data.id }
            - call: "POST /api/subscribers"
              payload: { display_name: "SG", email: "sg@x.com", service_address: "3 Main St" }
              as: ServiceRep
              captures: { sub_g: $.data.id }
            - call: "POST /api/subscribers"
              payload: { display_name: "SN", email: "sn@x.com", service_address: "4 Main St" }
              as: ServiceRep
              captures: { sub_n: $.data.id }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_g}", plan_id: "${plan_p}", start_date: "2026-07-27" }
              as: ServiceRep
              captures: { subsc_g: $.data.id }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_n}", plan_id: "${plan_p}", start_date: "2026-07-27" }
              as: ServiceRep
              captures: { subsc_n: $.data.id }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "POST /api/route-assignments"
              payload: { subscription_id: "${subsc_g}", route_id: "${route_g}", start_date: "2026-07-27" }
              as: DistrictManager
            - call: "POST /api/route-assignments"
              payload: { subscription_id: "${subsc_n}", route_id: "${route_n}", start_date: "2026-07-27" }
              as: DistrictManager
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: CirculationDirector }
            - call: "POST /api/complaints"
              payload: { subscription_id: "${subsc_g}", service_date: "2026-08-05", complaint_type: "MISSED" }
              as: ServiceRep
            - call: "POST /api/complaints"
              payload: { subscription_id: "${subsc_n}", service_date: "2026-08-05", complaint_type: "MISSED" }
              as: ServiceRep
          trigger:
            - call: "GET /api/carriers/${car_g}/settlement"
              payload: { week_start_date: "2026-08-03" }
              as: DistrictManager
              captures: { g_net: $.data.net_cents, g_bonus: $.data.bonus_cents, g_ded: $.data.deduction_cents }
            - call: "GET /api/carriers/${car_n}/settlement"
              payload: { week_start_date: "2026-08-03" }
              as: DistrictManager
              captures: { n_net: $.data.net_cents, n_ded: $.data.deduction_cents }
          assert:
            - "GROSS settlement: delivered_copies == 7, gross_cents == 350, bonus_cents == 18 (1 complaint <= BONUS_MAX_COMPLAINTS 2; round_half_up(350*0.05)=18), deduction_cents == 0, net_cents == 368"
            - "NET settlement: gross_cents == 350, bonus_cents == 18, deduction_cents == 150 (min(1*150, 3000)), net_cents == 218"
            - "${g_net} == 368 and ${n_net} == 218 — identical operational inputs, divergent variants"

  # =====================================================================
  # Rule 2 — combinatorial_formula: mode (b) nested rounding vs mode (a)
  # >=3-input non-linear formula.
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: proration_nested_rounding_order_pinned
        grounds:
          - calculations.vacation_proration_credit
        distinguishing_aspect: |
          Mode (b) nested rounding: PER_ISSUE rounds the per-issue rate BEFORE
          multiplying (round(1000/7)=143, then 143*4=572); the reverse order
          (round(1000*4/7)=571) yields a different cent value — the pinned order
          is observable and load-bearing.
        test_recipe:
          setup:
            - "One PER_ISSUE print plan, base 1000, issues_per_week 7; one ACTIVE subscription started 2026-08-03 with a CREDIT hold over [2026-08-10, 2026-08-14)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CirculationDirector }
            - call: "POST /api/subscription-plans"
              payload: { name: "PI2", plan_type: "PRINT", issues_per_week: 7, base_weekly_rate_cents: 1000, proration_method: "PER_ISSUE", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_pi2: $.data.id }
            - call: "POST /api/subscribers"
              payload: { display_name: "R", email: "r@x.com", service_address: "5 Main St" }
              as: ServiceRep
              captures: { sub_r: $.data.id }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_r}", plan_id: "${plan_pi2}", start_date: "2026-08-03" }
              as: ServiceRep
              captures: { subsc_r: $.data.id }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "POST /api/subscriptions/${subsc_r}/vacation-holds"
              payload: { start_date: "2026-08-10", end_date: "2026-08-14", resolution: "CREDIT" }
              as: ServiceRep
              captures: { hold_r: $.data.id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: CirculationDirector }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-14T00:00:00Z" }, as: CirculationDirector }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
          trigger:
            - call: "GET /api/credit-memos"
              payload: { hold_id: "${hold_r}" }
              as: ServiceRep
              captures: { cm_r_amt: "$.data[0].amount_cents" }
          assert:
            - "CreditMemo.amount_cents == 572 — per-issue rate rounded first (143), then multiplied by 4 held days"
            - "CreditMemo.amount_cents != 571 — the multiply-then-round order is rejected"
            - "Hold ${hold_r}.credit_amount_cents == 572 (same pinned value echoed on the hold)"

      - name: save_discount_floor_and_tiered_step_interaction
        grounds:
          - calculations.effective_weekly_rate
          - entities.Subscription.fields.save_discount_pct
          - entities.SubscriptionPlan.fields.min_weekly_rate_cents
        distinguishing_aspect: |
          Mode (a) >=3 inputs with non-linear interaction: tiered step selection
          (base 600 -> step 800 at week 4), a conditional save-discount branch
          (0.50 off), and a max() floor at min_weekly_rate_cents 500 — the
          discounted 400 is floored to 500, proving all three inputs interacted.
        test_recipe:
          setup:
            - "Print plan: base 600, step_up_schedule [{after_weeks: 4, weekly_rate_cents: 800}], min_weekly_rate_cents 500"
            - "Subscription started 2026-08-03, kept current (every weekly charge paid in full) through week 5"
            - "RETENTION_REP save offer (0.50, 8 weeks) accepted on 2026-08-31"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CirculationDirector }
            - call: "POST /api/subscription-plans"
              payload: { name: "STEP", plan_type: "PRINT", issues_per_week: 7, base_weekly_rate_cents: 600, step_up_schedule: [{ after_weeks: 4, weekly_rate_cents: 800 }], proration_method: "PER_DAY", min_weekly_rate_cents: 500 }
              as: CirculationDirector
              captures: { plan_step: $.data.id }
            - call: "POST /api/subscribers"
              payload: { display_name: "S", email: "s@x.com", service_address: "6 Main St" }
              as: ServiceRep
              captures: { sub_s: $.data.id }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_s}", plan_id: "${plan_step}", start_date: "2026-08-03" }
              as: ServiceRep
              captures: { subsc_s: $.data.id }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "POST /api/payments"
              payload: { subscriber_id: "${sub_s}", amount_cents: 600, method: "CARD" }
              as: ServiceRep
              captures: { pay1: $.data.id }
            - { call: "POST /api/payments/${pay1}/mark-cleared", payload: {}, as: ServiceRep }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: CirculationDirector }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "POST /api/payments"
              payload: { subscriber_id: "${sub_s}", amount_cents: 600, method: "CARD" }
              as: ServiceRep
              captures: { pay2: $.data.id }
            - { call: "POST /api/payments/${pay2}/mark-cleared", payload: {}, as: ServiceRep }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-17T00:00:00Z" }, as: CirculationDirector }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "POST /api/payments"
              payload: { subscriber_id: "${sub_s}", amount_cents: 600, method: "CARD" }
              as: ServiceRep
              captures: { pay3: $.data.id }
            - { call: "POST /api/payments/${pay3}/mark-cleared", payload: {}, as: ServiceRep }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-24T00:00:00Z" }, as: CirculationDirector }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "POST /api/payments"
              payload: { subscriber_id: "${sub_s}", amount_cents: 600, method: "CARD" }
              as: ServiceRep
              captures: { pay4: $.data.id }
            - { call: "POST /api/payments/${pay4}/mark-cleared", payload: {}, as: ServiceRep }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: CirculationDirector }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "POST /api/payments"
              payload: { subscriber_id: "${sub_s}", amount_cents: 800, method: "CARD" }
              as: ServiceRep
              captures: { pay5: $.data.id }
            - { call: "POST /api/payments/${pay5}/mark-cleared", payload: {}, as: ServiceRep }
            - call: "GET /api/subscriptions/${subsc_s}"
              as: ServiceRep
              captures: { subsc_s_v: $.data.version }
            - call: "POST /api/subscriptions/${subsc_s}/save-offers"
              payload: { discount_pct: 0.5, duration_weeks: 8, expected_subscription_version: "${subsc_s_v}" }
              as: ServiceRep
              captures: { offer_s: $.data.id }
            - { call: "POST /api/save-offers/${offer_s}/accept", payload: {}, as: ServiceRep }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-07T00:00:00Z" }, as: CirculationDirector }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "GET /api/billing-charges"
              payload: { subscription_id: "${subsc_s}" }
              as: ServiceRep
              captures: { ch6_amt: "$.data[5].amount_cents" }
          assert:
            - "BillingCharge[5] (period_start 2026-09-07, tenure week 5) amount_cents == 500"
            - "Stepped rate 800 (not base 600) fed the discount: round_half_up(800*0.5) = 400, floored by max(400, min_weekly_rate_cents 500) = 500"
            - "Subscription.save_discount_until == 2026-10-26 (2026-08-31 + 8*7 days), so 2026-09-07 is inside the discount window"

  # =====================================================================
  # Rule 3 — non_linear_state_machine: parallel axes (Subscription) vs
  # revert cycle (BillingCharge).
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: subscription_parallel_billing_delivery_axes
        grounds:
          - state_machines.Subscription
          - entities.Subscription.fields.billing_status
          - entities.Subscription.fields.delivery_status
        distinguishing_aspect: |
          Subscription carries two independent state axes: billing_status moves
          ACTIVE -> GRACE -> ACTIVE while delivery_status stays HELD throughout —
          neither axis forces the other on these transitions (parallel shape).
        test_recipe:
          setup:
            - "Print subscription ACTIVE since 2026-08-03 (600/week); ACTIVE vacation hold [2026-08-10, 2026-08-31) REDELIVER (21 days, at the per-hold max) keeps delivery HELD"
            - "First charge (due 2026-08-17) is 9 days past due on 2026-08-26 -> billing GRACE"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CirculationDirector }
            - call: "POST /api/subscription-plans"
              payload: { name: "PAR", plan_type: "PRINT", issues_per_week: 7, base_weekly_rate_cents: 600, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_par: $.data.id }
            - call: "POST /api/subscribers"
              payload: { display_name: "P", email: "p@x.com", service_address: "7 Main St" }
              as: ServiceRep
              captures: { sub_p: $.data.id }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_p}", plan_id: "${plan_par}", start_date: "2026-08-03" }
              as: ServiceRep
              captures: { subsc_p: $.data.id }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "POST /api/subscriptions/${subsc_p}/vacation-holds"
              payload: { start_date: "2026-08-10", end_date: "2026-08-31", resolution: "REDELIVER" }
              as: ServiceRep
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: CirculationDirector }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-26T00:00:00Z" }, as: CirculationDirector }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "GET /api/subscriptions/${subsc_p}"
              as: ServiceRep
              captures: { par_billing: $.data.billing_status, par_delivery: $.data.delivery_status }
          trigger:
            - call: "POST /api/payments"
              payload: { subscriber_id: "${sub_p}", amount_cents: 2400, method: "CARD" }
              as: ServiceRep
              captures: { pay_p: $.data.id }
            - { call: "POST /api/payments/${pay_p}/mark-cleared", payload: {}, as: ServiceRep }
            - call: "GET /api/subscriptions/${subsc_p}"
              as: ServiceRep
              captures: { par_billing2: $.data.billing_status, par_delivery2: $.data.delivery_status }
          assert:
            - "Before payment: billing_status == GRACE AND delivery_status == HELD (both axes observable at once)"
            - "After clearing 2400 (4 weekly charges of 600): billing_status == ACTIVE"
            - "delivery_status == HELD unchanged — billing transitions do not touch the delivery axis"

      - name: billing_charge_paid_to_open_reversal_loop
        grounds:
          - state_machines.BillingCharge.PAID_to_OPEN
          - state_machines.Payment.CLEARED_to_REVERSED
        distinguishing_aspect: |
          BillingCharge is cyclic: OPEN -> PAID on clearing, then PAID -> OPEN on
          payment reversal — a revision loop on a different entity than instance
          1's parallel Subscription axes.
        test_recipe:
          setup:
            - "Subscription ACTIVE since 2026-08-03 with one 600-cent charge; payment of 600 cleared (charge PAID)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CirculationDirector }
            - call: "POST /api/subscription-plans"
              payload: { name: "LOOP", plan_type: "DIGITAL", issues_per_week: 0, base_weekly_rate_cents: 600, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_loop: $.data.id }
            - call: "POST /api/subscribers"
              payload: { display_name: "L", email: "l@x.com" }
              as: ServiceRep
              captures: { sub_l: $.data.id }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_l}", plan_id: "${plan_loop}", start_date: "2026-08-03" }
              as: ServiceRep
              captures: { subsc_l: $.data.id }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "POST /api/payments"
              payload: { subscriber_id: "${sub_l}", amount_cents: 600, method: "ACH" }
              as: ServiceRep
              captures: { pay_l: $.data.id }
            - { call: "POST /api/payments/${pay_l}/mark-cleared", payload: {}, as: ServiceRep }
            - call: "GET /api/billing-charges"
              payload: { subscription_id: "${subsc_l}" }
              as: ServiceRep
              captures: { ch_l_id: "$.data[0].id", ch_l_paid: "$.data[0].status" }
          trigger:
            - { call: "POST /api/payments/${pay_l}/reverse", payload: {}, as: CirculationDirector }
            - call: "GET /api/billing-charges/${ch_l_id}"
              as: ServiceRep
              captures: { ch_l_after: $.data.status, ch_l_paid_amt: $.data.paid_amount_cents }
          assert:
            - "After mark-cleared: charge status == PAID, paid_amount_cents == 600"
            - "After reverse: charge status == OPEN again (cycle), paid_amount_cents == 0"
            - "Payment ${pay_l}.status == REVERSED (terminal)"

  # =====================================================================
  # Rule 4 — transitive_cascade: two depth-3 cascades from DIFFERENT
  # triggers (payment reversal vs complaint credit).
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: payment_reversal_depth3_cascade
        grounds:
          - state_machines.Payment.CLEARED_to_REVERSED
          - state_machines.BillingCharge.PAID_to_OPEN
          - entities.Subscriber.fields.balance_due_cents
          - calculations.lapse_cycle_evaluation
        distinguishing_aspect: |
          Depth-3 cascade from POST /api/payments/{id}/reverse: (1) reversal
          restores charge paid amounts (PAID/PARTIALLY_PAID -> OPEN); (2) the
          charge restoration recomputes Subscriber.balance_due_cents upward;
          (3) the balance recompute re-evaluates lapse thresholds and flips the
          Subscription ACTIVE -> GRACE. Each link is caused by the previous one.
        test_recipe:
          setup:
            - "Subscription ACTIVE since 2026-08-03, two weekly 600-cent charges (due 2026-08-17, 2026-08-24)"
            - "Payment of 900 CLEARED: charge1 PAID, charge2 PARTIALLY_PAID (300); balance 300"
            - "Logical clock advanced to 2026-08-26 WITHOUT running the daily cycle, so billing_status is still ACTIVE when the reversal fires"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CirculationDirector }
            - call: "POST /api/subscription-plans"
              payload: { name: "REV", plan_type: "DIGITAL", issues_per_week: 0, base_weekly_rate_cents: 600, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_rev: $.data.id }
            - call: "POST /api/subscribers"
              payload: { display_name: "V", email: "v@x.com" }
              as: ServiceRep
              captures: { sub_v: $.data.id }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_v}", plan_id: "${plan_rev}", start_date: "2026-08-03" }
              as: ServiceRep
              captures: { subsc_v: $.data.id }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: CirculationDirector }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "POST /api/payments"
              payload: { subscriber_id: "${sub_v}", amount_cents: 900, method: "CARD" }
              as: ServiceRep
              captures: { pay_v: $.data.id }
            - { call: "POST /api/payments/${pay_v}/mark-cleared", payload: {}, as: ServiceRep }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-26T00:00:00Z" }, as: CirculationDirector }
          trigger:
            - { call: "POST /api/payments/${pay_v}/reverse", payload: {}, as: CirculationDirector }
            - call: "GET /api/subscribers/${sub_v}"
              as: ServiceRep
              captures: { bal_v: $.data.balance_due_cents }
            - call: "GET /api/billing-charges"
              payload: { subscription_id: "${subsc_v}" }
              as: ServiceRep
              captures: { ch1_status: "$.data[0].status", ch1_paid: "$.data[0].paid_amount_cents", ch2_status: "$.data[1].status", ch2_paid: "$.data[1].paid_amount_cents" }
            - call: "GET /api/subscriptions/${subsc_v}"
              as: ServiceRep
              captures: { bill_v: $.data.billing_status }
          assert:
            - "Link 1: both charges reverted — status OPEN, paid_amount_cents 0 (allocations undone)"
            - "Link 2: Subscriber.balance_due_cents == 1200 (300 -> 1200 upward recompute, unapplied clawed back)"
            - "Link 3: Subscription.billing_status == GRACE (oldest unpaid charge 9 days past due > GRACE_DAYS 7) — flipped by the reversal's re-evaluation without any daily-cycle run"

      - name: complaint_credit_depth3_cascade
        grounds:
          - state_machines.DeliveryComplaint.OPEN_to_CREDITED
          - calculations.payment_waterfall_allocation
          - entities.Subscriber.fields.balance_due_cents
          - state_machines.Subscription.GRACE_to_ACTIVE
        distinguishing_aspect: |
          Depth-3 cascade from a DIFFERENT trigger (POST /api/complaints/{id}/credit):
          (1) credit creates a COMPLAINT CreditMemo; (2) memo auto-apply waterfall
          covers the oldest charge (credit_applied_cents 600, charge -> PAID);
          (3) the balance drop re-evaluates lapse thresholds and rescues the
          Subscription GRACE -> ACTIVE.
        test_recipe:
          setup:
            - "Print subscription ACTIVE since 2026-08-03; on 2026-08-25 the oldest charge (due 2026-08-17) is 8 days past due -> billing GRACE; four unpaid 600-cent charges outstanding (balance 2400)"
            - "OPEN complaint for service_date 2026-08-20 (inside the 7-day filing window)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CirculationDirector }
            - call: "POST /api/subscription-plans"
              payload: { name: "CC", plan_type: "PRINT", issues_per_week: 7, base_weekly_rate_cents: 600, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_cc: $.data.id }
            - call: "POST /api/subscribers"
              payload: { display_name: "C", email: "c@x.com", service_address: "8 Main St" }
              as: ServiceRep
              captures: { sub_c: $.data.id }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_c}", plan_id: "${plan_cc}", start_date: "2026-08-03" }
              as: ServiceRep
              captures: { subsc_c: $.data.id }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-25T00:00:00Z" }, as: CirculationDirector }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "POST /api/complaints"
              payload: { subscription_id: "${subsc_c}", service_date: "2026-08-20", complaint_type: "MISSED" }
              as: ServiceRep
              captures: { complaint_c: $.data.id }
            - call: "GET /api/subscriptions/${subsc_c}"
              as: ServiceRep
              captures: { bill_c_pre: $.data.billing_status }
          trigger:
            - call: "POST /api/complaints/${complaint_c}/credit"
              payload: { amount_cents: 600 }
              as: ServiceRep
              captures: { cm_c: $.data.id, cm_c_applied: $.data.applied_cents }
            - call: "GET /api/billing-charges"
              payload: { subscription_id: "${subsc_c}" }
              as: ServiceRep
              captures: { chc1_status: "$.data[0].status", chc1_credit: "$.data[0].credit_applied_cents" }
            - call: "GET /api/subscribers/${sub_c}"
              as: ServiceRep
              captures: { bal_c: $.data.balance_due_cents }
            - call: "GET /api/subscriptions/${subsc_c}"
              as: ServiceRep
              captures: { bill_c_post: $.data.billing_status }
          assert:
            - "Precondition held: ${bill_c_pre} == GRACE before the credit"
            - "Link 1: Complaint CREDITED; CreditMemo (source COMPLAINT) amount_cents 600 created"
            - "Link 2: oldest charge credit_applied_cents == 600 and status == PAID (full coverage via waterfall)"
            - "Link 3: Subscriber.balance_due_cents == 1800 and Subscription.billing_status == ACTIVE (oldest remaining unpaid charge only 1 day past due)"

  # =====================================================================
  # Rule 5 — priority_pair_validation_conflict: (state vs business_temporal)
  # and (business_temporal vs business_fiscal).
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: hold_state_error_beats_temporal_overlap
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - state_machines.Subscription.GRACE_to_SUSPENDED
        distinguishing_aspect: |
          Category pair state (p6) vs business_temporal (p8): a hold request on a
          SUSPENDED subscription whose dates ALSO overlap an existing SCHEDULED
          hold must return ERR_SUBSCRIPTION_NOT_ACTIVE, not ERR_HOLD_OVERLAP.
        test_recipe:
          setup:
            - "Subscription started 2026-08-03; SCHEDULED hold over [2026-10-05, 2026-10-09) exists"
            - "On 2026-09-08 the oldest unpaid charge is 22 days past due -> billing SUSPENDED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CirculationDirector }
            - call: "POST /api/subscription-plans"
              payload: { name: "SV", plan_type: "PRINT", issues_per_week: 7, base_weekly_rate_cents: 600, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_sv: $.data.id }
            - call: "POST /api/subscribers"
              payload: { display_name: "SV", email: "sv@x.com", service_address: "9 Main St" }
              as: ServiceRep
              captures: { sub_sv: $.data.id }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_sv}", plan_id: "${plan_sv}", start_date: "2026-08-03" }
              as: ServiceRep
              captures: { subsc_sv: $.data.id }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "POST /api/subscriptions/${subsc_sv}/vacation-holds"
              payload: { start_date: "2026-10-05", end_date: "2026-10-09", resolution: "CREDIT" }
              as: ServiceRep
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-08T00:00:00Z" }, as: CirculationDirector }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
          trigger:
            - call: "POST /api/subscriptions/${subsc_sv}/vacation-holds"
              payload: { start_date: "2026-10-06", end_date: "2026-10-08", resolution: "CREDIT" }
              as: ServiceRep
              captures: { err_sv: $.data.error_id }
          assert:
            - "error_id == ERR_SUBSCRIPTION_NOT_ACTIVE (state, priority 6)"
            - "error_id != ERR_HOLD_OVERLAP even though [2026-10-06, 2026-10-08) overlaps the SCHEDULED hold — the temporal check is never reached"

      - name: hold_temporal_error_beats_fiscal_annual_cap
        grounds:
          - validations[priority=8]
          - validations[priority=11]
        distinguishing_aspect: |
          Category pair business_temporal (p8) vs business_fiscal (p11): a hold
          whose start_date is in the past on a subscription that has ALSO
          exhausted its 30-day annual hold budget must return
          ERR_HOLD_WINDOW_INVALID, not ERR_HOLD_LIMIT_EXCEEDED — a different
          error-category pair than instance 1's state-vs-temporal.
        test_recipe:
          setup:
            - "Subscription ACTIVE/GRACE since 2026-08-03; two completed REDELIVER holds [2026-08-03, 2026-08-18) and [2026-08-19, 2026-09-03) consumed exactly 30 annual hold days"
            - "Logical clock at 2026-09-04"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CirculationDirector }
            - call: "POST /api/subscription-plans"
              payload: { name: "TF", plan_type: "PRINT", issues_per_week: 7, base_weekly_rate_cents: 600, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_tf: $.data.id }
            - call: "POST /api/subscribers"
              payload: { display_name: "TF", email: "tf@x.com", service_address: "10 Main St" }
              as: ServiceRep
              captures: { sub_tf: $.data.id }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_tf}", plan_id: "${plan_tf}", start_date: "2026-08-03" }
              as: ServiceRep
              captures: { subsc_tf: $.data.id }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "POST /api/subscriptions/${subsc_tf}/vacation-holds"
              payload: { start_date: "2026-08-03", end_date: "2026-08-18", resolution: "REDELIVER" }
              as: ServiceRep
            - call: "POST /api/subscriptions/${subsc_tf}/vacation-holds"
              payload: { start_date: "2026-08-19", end_date: "2026-09-03", resolution: "REDELIVER" }
              as: ServiceRep
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-04T00:00:00Z" }, as: CirculationDirector }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
          trigger:
            - call: "POST /api/subscriptions/${subsc_tf}/vacation-holds"
              payload: { start_date: "2026-09-01", end_date: "2026-09-03", resolution: "CREDIT" }
              as: ServiceRep
              captures: { err_tf: $.data.error_id }
          assert:
            - "error_id == ERR_HOLD_WINDOW_INVALID (business_temporal, priority 8: start 2026-09-01 < today 2026-09-04)"
            - "error_id != ERR_HOLD_LIMIT_EXCEEDED even though 30 + 2 > 30 annual days — the fiscal check is never reached"

  # =====================================================================
  # Rule 6 — boundary_precision_check: tenure-week threshold (ops cycle) vs
  # copy-variance tolerance (report submit). Different metrics, different
  # endpoints.
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: rate_stepup_inclusive_week_boundary
        grounds:
          - calculations.effective_weekly_rate
          - entities.SubscriptionPlan.fields.step_up_schedule
        distinguishing_aspect: |
          Tenure boundary is inclusive (>=): at exactly 12 weeks the 800 step
          applies and at exactly 26 weeks the 1000 step applies, while one week
          earlier stays on the lower rate. Metric: tenure weeks; observed via
          the daily-cycle charge generation endpoint.
        test_recipe:
          setup:
            - "Backdated subscription started 2026-01-05 (Monday) on a plan with base 600 and steps [{12 -> 800}, {26 -> 1000}]"
            - "One daily cycle at the default clock 2026-08-01 generates all 30 catch-up charges (periods 2026-01-05 .. 2026-07-27)"
          setup_api_calls:
            - call: "POST /api/subscription-plans"
              payload: { name: "STEPB", plan_type: "DIGITAL", issues_per_week: 0, base_weekly_rate_cents: 600, step_up_schedule: [{ after_weeks: 12, weekly_rate_cents: 800 }, { after_weeks: 26, weekly_rate_cents: 1000 }], proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_sb: $.data.id }
            - call: "POST /api/subscribers"
              payload: { display_name: "B1", email: "b1@x.com" }
              as: ServiceRep
              captures: { sub_b1: $.data.id }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_b1}", plan_id: "${plan_sb}", start_date: "2026-01-05" }
              as: ServiceRep
              captures: { subsc_b1: $.data.id }
          trigger:
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "GET /api/billing-charges"
              payload: { subscription_id: "${subsc_b1}" }
              as: ServiceRep
              captures: { b1_w11: "$.data[11].amount_cents", b1_w12: "$.data[12].amount_cents", b1_w25: "$.data[25].amount_cents", b1_w26: "$.data[26].amount_cents" }
          assert:
            - "Charge index 11 (period 2026-03-23, tenure 11 weeks): amount_cents == 600 — below the step"
            - "Charge index 12 (period 2026-03-30, tenure exactly 12 weeks): amount_cents == 800 — >= is inclusive"
            - "Charge index 25 (period 2026-06-29, tenure 25 weeks): amount_cents == 800"
            - "Charge index 26 (period 2026-07-06, tenure exactly 26 weeks): amount_cents == 1000"

      - name: rack_variance_exactly_at_tolerance
        grounds:
          - calculations.rack_sales_reconciliation
          - entities.RackSalesReport.fields.variance_flag
        distinguishing_aspect: |
          Copy-count variance boundary is exclusive (>): abs(variance) == 2 is NOT
          flagged, abs(variance) == 3 IS flagged. Metric: copy-count variance;
          reached via POST /api/rack-sales-reports/{id}/submit — a distinct
          endpoint and metric from instance 1's tenure-week boundary.
        test_recipe:
          setup:
            - "One ACTIVE rack (price 150); two DRAFT reports for weeks 2026-08-03 and 2026-08-10, each with copies_delivered 50, copies_returned 8 (computed sold 42)"
            - "Report 1 reported_sold_copies 44 (variance +2); report 2 reported_sold_copies 45 (variance +3)"
          setup_api_calls:
            - call: "POST /api/rack-locations"
              payload: { location_name: "GasMart", address: "1 Rt 9", price_per_copy_cents: 150 }
              as: DistrictManager
              captures: { rack_v: $.data.id }
            - call: "POST /api/rack-sales-reports"
              payload: { rack_location_id: "${rack_v}", week_start_date: "2026-08-03", copies_delivered: 50, copies_returned: 8, reported_sold_copies: 44 }
              as: DistrictManager
              captures: { rep_v1: $.data.id }
            - call: "POST /api/rack-sales-reports"
              payload: { rack_location_id: "${rack_v}", week_start_date: "2026-08-10", copies_delivered: 50, copies_returned: 8, reported_sold_copies: 45 }
              as: DistrictManager
              captures: { rep_v2: $.data.id }
          trigger:
            - call: "POST /api/rack-sales-reports/${rep_v1}/submit"
              payload: {}
              as: DistrictManager
              captures: { rep_v1_flag: $.data.variance_flag }
            - call: "POST /api/rack-sales-reports/${rep_v2}/submit"
              payload: {}
              as: DistrictManager
              captures: { rep_v2_flag: $.data.variance_flag }
          assert:
            - "Report 1: variance_copies == 2 and variance_flag == false (exactly at VARIANCE_TOLERANCE 2 — '>' does not fire)"
            - "Report 2: variance_copies == 3 and variance_flag == true"
            - "Both: copies_sold == 42 and amount_due_cents == 6300 (42 * 150) regardless of the flag"

  # =====================================================================
  # Rule 7 — cross_entity_state_dependency: RouteAssignment->Subscription
  # and AuditReport->RackSalesReport (different entity pairs).
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: route_assignment_requires_subscription_active
        grounds:
          - validations[priority=6]
          - entities.RouteAssignment.fields.subscription_id
          - state_machines.Subscription.GRACE_to_SUSPENDED
        distinguishing_aspect: |
          Entity pair RouteAssignment -> Subscription: assignment creation is
          gated on the SUBSCRIPTION's billing_status (ACTIVE/GRACE only); a
          SUSPENDED subscription rejects with ERR_SUBSCRIPTION_NOT_ACTIVE while
          an ACTIVE one succeeds against the same route.
        test_recipe:
          setup:
            - "Subscription BAD started 2026-08-03, SUSPENDED on 2026-09-08 (oldest charge 22 days past due)"
            - "Subscription GOOD started 2026-09-08, ACTIVE after the same daily cycle"
            - "One ACTIVE route with capacity 10"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CirculationDirector }
            - call: "POST /api/subscription-plans"
              payload: { name: "RA", plan_type: "PRINT", issues_per_week: 7, base_weekly_rate_cents: 600, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_ra: $.data.id }
            - call: "POST /api/subscribers"
              payload: { display_name: "Bad", email: "bad@x.com", service_address: "11 Main St" }
              as: ServiceRep
              captures: { sub_bad: $.data.id }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_bad}", plan_id: "${plan_ra}", start_date: "2026-08-03" }
              as: ServiceRep
              captures: { subsc_bad: $.data.id }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-08T00:00:00Z" }, as: CirculationDirector }
            - call: "POST /api/subscribers"
              payload: { display_name: "Good", email: "good@x.com", service_address: "12 Main St" }
              as: ServiceRep
              captures: { sub_good: $.data.id }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_good}", plan_id: "${plan_ra}", start_date: "2026-09-08" }
              as: ServiceRep
              captures: { subsc_good: $.data.id }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "POST /api/routes"
              payload: { route_code: "R1", max_stops: 10 }
              as: DistrictManager
              captures: { route_1: $.data.id }
          trigger:
            - call: "POST /api/route-assignments"
              payload: { subscription_id: "${subsc_bad}", route_id: "${route_1}", start_date: "2026-09-09" }
              as: DistrictManager
              captures: { err_ra: $.data.error_id }
            - call: "POST /api/route-assignments"
              payload: { subscription_id: "${subsc_good}", route_id: "${route_1}", start_date: "2026-09-09" }
              as: DistrictManager
              captures: { asg_good: $.data.id }
          assert:
            - "BAD subscription assignment rejected: error_id == ERR_SUBSCRIPTION_NOT_ACTIVE"
            - "GOOD subscription assignment succeeds (201) and DeliveryRoute.assigned_stop_count == 1"

      - name: audit_certify_requires_reconciled_rack_reports
        grounds:
          - state_machines.AuditReport.DRAFT_to_CERTIFIED
          - entities.AuditReport.fields.single_copy_copies
          - state_machines.RackSalesReport.SUBMITTED_to_RECONCILED
        distinguishing_aspect: |
          Entity pair AuditReport -> RackSalesReport: certification is gated on
          EVERY in-period rack report being RECONCILED; a SUBMITTED-but-
          unreconciled report blocks with ERR_UNRECONCILED_RACK_VARIANCE, and
          only after reconcile does certify succeed with single_copy_copies
          recomputed to 42.
        test_recipe:
          setup:
            - "Rack report for week 2026-08-03 SUBMITTED (50 delivered, 8 returned -> sold 42), not yet reconciled"
            - "DRAFT AuditReport covering [2026-08-01, 2026-08-31] with a stale single_copy_copies == 0 snapshot"
          setup_api_calls:
            - call: "POST /api/rack-locations"
              payload: { location_name: "QuickStop", address: "5 Rt 9", price_per_copy_cents: 150 }
              as: DistrictManager
              captures: { rack_a: $.data.id }
            - call: "POST /api/rack-sales-reports"
              payload: { rack_location_id: "${rack_a}", week_start_date: "2026-08-03", copies_delivered: 50, copies_returned: 8 }
              as: DistrictManager
              captures: { rep_a: $.data.id }
            - { call: "POST /api/rack-sales-reports/${rep_a}/submit", payload: {}, as: DistrictManager }
            - call: "POST /api/audit-reports"
              payload: { period_start: "2026-08-01", period_end: "2026-08-31" }
              as: CirculationDirector
              captures: { aud_a: $.data.id, aud_a_presc: $.data.single_copy_copies }
          trigger:
            - call: "POST /api/audit-reports/${aud_a}/certify"
              payload: {}
              as: CirculationDirector
              captures: { err_aud: $.data.error_id }
            - { call: "POST /api/rack-sales-reports/${rep_a}/reconcile", payload: {}, as: CirculationDirector }
            - call: "POST /api/audit-reports/${aud_a}/certify"
              payload: {}
              as: CirculationDirector
              captures: { aud_a_post: $.data.status, aud_a_sold: $.data.single_copy_copies }
          assert:
            - "First certify rejected: error_id == ERR_UNRECONCILED_RACK_VARIANCE; report still DRAFT"
            - "Draft snapshot had single_copy_copies == 0 (SUBMITTED reports excluded from the aggregation)"
            - "After reconcile: certify succeeds, status == CERTIFIED, single_copy_copies == 42 (recomputed at certification)"

  # =====================================================================
  # Rule 8 — resource_temporal_overlap: half-open hold intervals vs
  # closed-inclusive assignment intervals (different semantics, different
  # resource entities).
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: vacation_hold_half_open_adjacency
        grounds:
          - validations[priority=8]
          - entities.VacationHold.fields.start_date
          - entities.VacationHold.fields.end_date
        distinguishing_aspect: |
          Half-open [start, end) semantics on the subscription's vacation
          calendar: an overlapping hold is rejected with ERR_HOLD_OVERLAP, but a
          hold whose start_date equals the existing hold's end_date (adjacent)
          is ACCEPTED — touching is allowed under half-open intervals.
        test_recipe:
          setup:
            - "ACTIVE print subscription since 2026-08-03 with an existing SCHEDULED hold [2026-08-10, 2026-08-14)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CirculationDirector }
            - call: "POST /api/subscription-plans"
              payload: { name: "HO", plan_type: "PRINT", issues_per_week: 7, base_weekly_rate_cents: 600, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_ho: $.data.id }
            - call: "POST /api/subscribers"
              payload: { display_name: "HO", email: "ho@x.com", service_address: "13 Main St" }
              as: ServiceRep
              captures: { sub_ho: $.data.id }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_ho}", plan_id: "${plan_ho}", start_date: "2026-08-03" }
              as: ServiceRep
              captures: { subsc_ho: $.data.id }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "POST /api/subscriptions/${subsc_ho}/vacation-holds"
              payload: { start_date: "2026-08-10", end_date: "2026-08-14", resolution: "CREDIT" }
              as: ServiceRep
              captures: { hold_ho: $.data.id }
          trigger:
            - call: "POST /api/subscriptions/${subsc_ho}/vacation-holds"
              payload: { start_date: "2026-08-13", end_date: "2026-08-15", resolution: "CREDIT" }
              as: ServiceRep
              captures: { err_ho: $.data.error_id }
            - call: "POST /api/subscriptions/${subsc_ho}/vacation-holds"
              payload: { start_date: "2026-08-14", end_date: "2026-08-17", resolution: "CREDIT" }
              as: ServiceRep
              captures: { hold_ho2: $.data.id }
          assert:
            - "Overlap attempt [2026-08-13, 2026-08-15) rejected: error_id == ERR_HOLD_OVERLAP"
            - "Adjacent hold [2026-08-14, 2026-08-17) succeeds (201) — new.start == existing.end does not collide under half-open semantics"

      - name: route_assignment_closed_interval_touching_collides
        grounds:
          - validations[priority=8]
          - entities.RouteAssignment.fields.start_date
          - entities.RouteAssignment.fields.end_date
        distinguishing_aspect: |
          Closed-inclusive [start, end] semantics on RouteAssignment (a different
          resource than holds): a new assignment starting on the existing
          assignment's end_date COLLIDES (both intervals include that date),
          while starting the day after succeeds — opposite adjacency behavior
          from the half-open hold rule.
        test_recipe:
          setup:
            - "ACTIVE print subscription since 2026-08-03; ACTIVE route (capacity 10) with an existing assignment [2026-08-03, 2026-08-09] (inclusive ends)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CirculationDirector }
            - call: "POST /api/subscription-plans"
              payload: { name: "CI", plan_type: "PRINT", issues_per_week: 7, base_weekly_rate_cents: 600, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_ci: $.data.id }
            - call: "POST /api/subscribers"
              payload: { display_name: "CI", email: "ci@x.com", service_address: "14 Main St" }
              as: ServiceRep
              captures: { sub_ci: $.data.id }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_ci}", plan_id: "${plan_ci}", start_date: "2026-08-03" }
              as: ServiceRep
              captures: { subsc_ci: $.data.id }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "POST /api/routes"
              payload: { route_code: "RC", max_stops: 10 }
              as: DistrictManager
              captures: { route_ci: $.data.id }
            - call: "POST /api/route-assignments"
              payload: { subscription_id: "${subsc_ci}", route_id: "${route_ci}", start_date: "2026-08-03", end_date: "2026-08-09" }
              as: DistrictManager
              captures: { asg_ci1: $.data.id }
          trigger:
            - call: "POST /api/route-assignments"
              payload: { subscription_id: "${subsc_ci}", route_id: "${route_ci}", start_date: "2026-08-09" }
              as: DistrictManager
              captures: { err_ci: $.data.error_id }
            - call: "POST /api/route-assignments"
              payload: { subscription_id: "${subsc_ci}", route_id: "${route_ci}", start_date: "2026-08-10" }
              as: DistrictManager
              captures: { asg_ci2: $.data.id }
          assert:
            - "Touching assignment (start 2026-08-09 == existing inclusive end 2026-08-09) rejected: error_id == ERR_ASSIGNMENT_OVERLAP"
            - "Gap-start assignment (2026-08-10) succeeds (201) — closed intervals require a strictly later start"

  # =====================================================================
  # Rule 9 — compensating_invariant: subscriber ledger cents vs physical
  # copy count (different conserved quantities).
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: payment_clear_reverse_ledger_conservation
        grounds:
          - calculations.payment_waterfall_allocation
          - entities.Subscriber.fields.balance_due_cents
          - state_machines.Payment.CLEARED_to_REVERSED
        distinguishing_aspect: |
          Conserved quantity: subscriber ledger cents. balance_due_cents ==
          sum(amount - paid - credit_applied over non-written-off charges) -
          unapplied_cash_cents must hold before and after a clear->reverse
          round trip: 1200 -> 300 -> 1200 with zero drift on any charge.
        test_recipe:
          setup:
            - "Subscription ACTIVE since 2026-08-03; two unpaid 600-cent charges (balance_due_cents 1200, unapplied 0)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CirculationDirector }
            - call: "POST /api/subscription-plans"
              payload: { name: "INV", plan_type: "DIGITAL", issues_per_week: 0, base_weekly_rate_cents: 600, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_inv: $.data.id }
            - call: "POST /api/subscribers"
              payload: { display_name: "I", email: "i@x.com" }
              as: ServiceRep
              captures: { sub_i: $.data.id }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_i}", plan_id: "${plan_inv}", start_date: "2026-08-03" }
              as: ServiceRep
              captures: { subsc_i: $.data.id }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: CirculationDirector }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "GET /api/subscribers/${sub_i}"
              as: ServiceRep
              captures: { inv_bal0: $.data.balance_due_cents }
            - call: "POST /api/payments"
              payload: { subscriber_id: "${sub_i}", amount_cents: 900, method: "CARD" }
              as: ServiceRep
              captures: { pay_i: $.data.id }
            - { call: "POST /api/payments/${pay_i}/mark-cleared", payload: {}, as: ServiceRep }
            - call: "GET /api/subscribers/${sub_i}"
              as: ServiceRep
              captures: { inv_bal1: $.data.balance_due_cents }
          trigger:
            - { call: "POST /api/payments/${pay_i}/reverse", payload: {}, as: CirculationDirector }
            - call: "GET /api/subscribers/${sub_i}"
              as: ServiceRep
              captures: { inv_bal2: $.data.balance_due_cents, inv_unap2: $.data.unapplied_cash_cents }
            - call: "GET /api/billing-charges"
              payload: { subscription_id: "${subsc_i}" }
              as: ServiceRep
              captures: { inv_ch1_paid: "$.data[0].paid_amount_cents", inv_ch2_paid: "$.data[1].paid_amount_cents" }
          assert:
            - "Forward action: clear 900 -> balance 1200 -> 300 (${inv_bal0} == 1200, ${inv_bal1} == 300)"
            - "Compensating action: reverse -> balance restored exactly (${inv_bal2} == 1200), unapplied_cash_cents == 0"
            - "No drift: both charges paid_amount_cents == 0 after reversal — conservation formula sum(600-0-0) + sum(600-0-0) - 0 == 1200 holds at every step"

      - name: rack_copies_conservation_through_dispute_cycle
        grounds:
          - calculations.rack_sales_reconciliation
          - entities.RackSalesReport.fields.copies_delivered
          - entities.RackSalesReport.fields.copies_sold
        distinguishing_aspect: |
          Conserved quantity: physical copies (not money). copies_sold +
          copies_returned == copies_delivered at every mutation, and the
          dispute -> correct -> resubmit cycle changes copies_returned while
          copies_delivered stays pinned at 50 — a different conserved quantity
          than instance 1's ledger cents.
        test_recipe:
          setup:
            - "SUBMITTED rack report (week 2026-08-03, price 150): delivered 50, returned 8, sold 42, amount_due 6300"
          setup_api_calls:
            - call: "POST /api/rack-locations"
              payload: { location_name: "Deli", address: "9 Rt 9", price_per_copy_cents: 150 }
              as: DistrictManager
              captures: { rack_i: $.data.id }
            - call: "POST /api/rack-sales-reports"
              payload: { rack_location_id: "${rack_i}", week_start_date: "2026-08-03", copies_delivered: 50, copies_returned: 8 }
              as: DistrictManager
              captures: { rep_i: $.data.id }
            - call: "POST /api/rack-sales-reports/${rep_i}/submit"
              payload: {}
              as: DistrictManager
              captures: { rep_i_sold0: $.data.copies_sold, rep_i_due0: $.data.amount_due_cents }
          trigger:
            - { call: "POST /api/rack-sales-reports/${rep_i}/dispute", payload: {}, as: CirculationDirector }
            - call: "PATCH /api/rack-sales-reports/${rep_i}"
              payload: { copies_returned: 10 }
              as: DistrictManager
            - call: "POST /api/rack-sales-reports/${rep_i}/submit"
              payload: {}
              as: DistrictManager
              captures: { rep_i_sold1: $.data.copies_sold, rep_i_due1: $.data.amount_due_cents, rep_i_del1: $.data.copies_delivered, rep_i_ret1: $.data.copies_returned }
          assert:
            - "Initial submit: copies_sold == 42, amount_due_cents == 6300; conservation 42 + 8 == 50"
            - "After dispute + correction + resubmit: copies_delivered == 50 (unchanged), copies_returned == 10, copies_sold == 40, amount_due_cents == 6000 (40 * 150)"
            - "Conservation holds again: 40 + 10 == 50 — delivered count is invariant across the compensation cycle"

  # Note: the two OCC stale-version rejections (§1.2.1 concurrency_rules) are
  # exercised as corner instances under the cross_cutting_layers section in
  # SCAFFOLD_CORNER_DESIGN.yaml (plan_change_stale_version_rejected,
  # save_offer_create_stale_version_rejected).
