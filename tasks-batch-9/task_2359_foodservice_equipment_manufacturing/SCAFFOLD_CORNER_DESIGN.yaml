      - name: health_score_applies_fault_and_heartbeat_weights_and_clamps_at_zero
        claim_type: weighted_scoring
        grounds:
          - calculations.connected_unit_health_score
          - endpoints["POST /connected-units/{id}/telemetry"]
        distinguishing_aspect: "With no COMPLETED campaign for the model there is no firmware bonus, so 3 faults and 4 missed heartbeats give exactly 100 - 21 - 12 = 67, and 20 faults give a raw -40 that is clamped once to 0 rather than stored negative."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ELECTRIC model FRY-900 (no FirmwareCampaign rows); two registered units SN-1 and SN-2, both still on firmware 1.0.0 with health_score 100."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /equipment-models"
              payload: { model_code: "FRY-900", name: "Fryer 900", category: "FRYER", energy_type: "ELECTRIC", base_price_cents: 1850020, supported_controls_packages: ["CONNECT_PLUS"], rated_throughput_units_per_hour: 120 }
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { model_id: $.data.id }
            - call: "POST /connected-units"
              payload: { equipment_model_id: "${model_id}", serial_number: "SN-1", service_tier: "BASE" }
              as: ConnectedOpsEngineer
              captures: { u1: $.data.id }
            - call: "POST /connected-units"
              payload: { equipment_model_id: "${model_id}", serial_number: "SN-2", service_tier: "BASE" }
              as: ConnectedOpsEngineer
              captures: { u2: $.data.id }
          trigger:
            - call: "POST /connected-units/${u1}/telemetry"
              payload: { fault_count_30d: 3, missed_heartbeat_count: 4 }
              as: ConnectedOpsEngineer
              captures: { h1: $.data.health_score }
            - call: "POST /connected-units/${u2}/telemetry"
              payload: { fault_count_30d: 20, missed_heartbeat_count: 0 }
              as: ConnectedOpsEngineer
              captures: { h2: $.data.health_score }
          assert:
            - "${h1} == 67"
            - "${h2} == 0"
            - "ConnectedUnit.${u1}.fault_count_30d == 3"
            - "ConnectedUnit.${u1}.missed_heartbeat_count == 4"
            - "ConnectedUnit.${u2}.health_score == 0"

