            - "second call: data.quantity_units == 6, data.unit_price_cents_snapshot == 599, data.line_value_cents == 3594, data.line_credit_cents == 0"
            - "DonationPickup.${pickup_id}.assignment_count == 1 and provisional_value_cents == 3594"
            - "DateCodeLot.${lot_id}.status == 'DONATION_PENDING' and quantity_on_hand == 10 (assignment reserves, it does not move units)"
            - "list read: total_count == 1 and the row's id == ${line_id}"

      - name: store_margin_rollup_is_the_exact_sum_of_its_department_reports
        claim_type: computed_read
        grounds:
          - endpoints[GET /fresh/departments/{departmentId}/margin-report]
          - endpoints[GET /fresh/stores/{storeId}/margin-rollup]
          - calculations.gross_margin_impact
        distinguishing_aspect: |
          Only the cent lines are additive. The rollup's revenue, cogs, shrink and margin equal
          the two department reports added (5990 + 2495, 4347 + 1553, 869 + 0, 774 + 942), while
          its percentages are recomputed from the summed totals: 20.22 is not 12.92 + 37.76 and
          12.84 is not 16.66 + 0.
        test_recipe:
          setup:
            - "Clock 2026-08-10T08:00:00.000Z; store 0412 with a MEAT department (ladder MEAT-STD-2026, shelf_life 10) and a DELI department (ladder DELI-STD-2026, shelf_life 6)."
            - "MEAT item 599c retail / 420c cost with a 24-unit lot; DELI item 499c retail / 300c cost with a 12-unit lot; both lots created at the 2026-08-10T08:00:00.000Z clock."
