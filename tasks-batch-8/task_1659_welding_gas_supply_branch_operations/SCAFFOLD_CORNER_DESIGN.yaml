  # ===========================================================================
  - section: calculations
    instances:
      - name: delivery_fee_threshold_exact_vs_one_cent_under
        claim_type: correct_result
        grounds: [calculations.order_total_aggregation]
        distinguishing_aspect: "Free-delivery threshold is strict <: subtotal 20000 waives the 2500 fee (total 20000); subtotal 19999 keeps it (total 22499)."
        test_recipe:
          setup: ["CASH customer; products P20000 (10000) and P19999 (19999), stock 5 each; route cap 10"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_no: "ACC-CA1", name: "Fee Co", terms: "CASH" }
              as: CounterRep
              captures: { cid: $.data.id }
            - call: "POST /products"
              payload: { sku: "HG-CA1A", name: "Table", category: "HARDGOOD", retail_price_cents: 10000 }
              as: BranchManager
              captures: { p20: $.data.id }
            - call: "POST /products"
              payload: { sku: "HG-CA1B", name: "Odd Tool", category: "HARDGOOD", retail_price_cents: 19999 }
              as: BranchManager
              captures: { p19: $.data.id }
            - call: "POST /products/${p20}/receive"
              payload: { qty: 5 }
              as: BranchManager
            - call: "POST /products/${p19}/receive"
              payload: { qty: 5 }
              as: BranchManager
            - call: "POST /delivery-routes"
              payload: { route_date: "2026-08-05", truck_capacity_units: 10 }
              as: CounterRep
              captures: { rid: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cid}", order_type: "RETAIL", fulfillment: "ROUTE", route_id: "${rid}", lines: [{ product_id: "${p20}", qty: 2 }] }
              as: CounterRep
              captures: { o1: $.data.id }
            - call: "POST /orders/${o1}/confirm"
              payload: {}
              as: CounterRep
              captures: { o1_fee: $.data.delivery_fee_cents, o1_total: $.data.total_cents }
            - call: "POST /orders"
              payload: { customer_id: "${cid}", order_type: "RETAIL", fulfillment: "ROUTE", route_id: "${rid}", lines: [{ product_id: "${p19}", qty: 1 }] }
              as: CounterRep
              captures: { o2: $.data.id }
            - call: "POST /orders/${o2}/confirm"
              payload: {}
              as: CounterRep
              captures: { o2_fee: $.data.delivery_fee_cents, o2_total: $.data.total_cents }
          assert:
            - "o1_fee == 0 and o1_total == 20000  (subtotal == 20000 threshold waives fee)"
            - "o2_fee == 2500 and o2_total == 22499  (19999 < 20000)"

      - name: hazmat_fee_flat_once_per_order
        claim_type: constants_applied
        grounds: [calculations.order_total_aggregation]
        distinguishing_aspect: "HAZMAT_FEE_CENTS 1500 applies once per order even with two hazmat lines — not per line."
        test_recipe:
          setup: ["CASH customer; two hazmat HARDGOOD products (1000, 2000), stock 5 each"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_no: "ACC-CA2", name: "Haz Co", terms: "CASH" }
              as: CounterRep
              captures: { cid: $.data.id }
            - call: "POST /products"
              payload: { sku: "HG-CA2A", name: "Flux (haz)", category: "HARDGOOD", retail_price_cents: 1000, hazmat: true }
              as: BranchManager
              captures: { pa: $.data.id }
            - call: "POST /products"
              payload: { sku: "HG-CA2B", name: "Cleaner (haz)", category: "HARDGOOD", retail_price_cents: 2000, hazmat: true }
              as: BranchManager
              captures: { pb: $.data.id }
            - call: "POST /products/${pa}/receive"
              payload: { qty: 5 }
              as: BranchManager
            - call: "POST /products/${pb}/receive"
              payload: { qty: 5 }
              as: BranchManager
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cid}", order_type: "RETAIL", fulfillment: "WILL_CALL", lines: [{ product_id: "${pa}", qty: 1 }, { product_id: "${pb}", qty: 1 }] }
              as: CounterRep
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/confirm"
              payload: {}
              as: CounterRep
              captures: { haz: $.data.hazmat_fee_cents, sub: $.data.subtotal_cents, tot: $.data.total_cents }
          assert:
            - "haz == 1500  (flat per order, two hazmat lines do not double it)"
            - "sub == 3000 and tot == 4500"

      - name: demurrage_grace_day_boundary
        claim_type: correct_result
        grounds: [calculations.rental_accrual]
        distinguishing_aspect: "chargeable = max(0, held - grace): at exactly grace days held the accrual is 0; one day later a full period is owed (ceil)."
        test_recipe:
          setup: ["CASH customer; DEMURRAGE rental start 2026-08-01, grace 5"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BranchManager
            - call: "POST /customers"
              payload: { account_no: "ACC-CA3", name: "Grace Co", terms: "CASH" }
              as: CounterRep
              captures: { cid: $.data.id }
            - call: "POST /cylinder-assets"
              payload: { serial_no: "CYL-CA3", gas_grade: "ACETYLENE", size: "MEDIUM" }
              as: BranchManager
              captures: { aid: $.data.id }
            - call: "POST /rental-agreements"
              payload: { customer_id: "${cid}", item_type: "CYLINDER", cylinder_asset_id: "${aid}", rate_plan: "DEMURRAGE", start_date: "2026-08-01", grace_days: 5 }
              as: CounterRep
              captures: { ra: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: BranchManager
            - call: "GET /rental-agreements/${ra}"
              as: CounterRep
              captures: { acc_d5: $.data.accrued_unbilled_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-07T00:00:00Z" }
              as: BranchManager
            - call: "GET /rental-agreements/${ra}"
              as: CounterRep
              captures: { acc_d6: $.data.accrued_unbilled_cents }
          assert:
            - "acc_d5 == 0  (5 days held - 5 grace = 0 chargeable)"
            - "acc_d6 == 1200  (1 chargeable day -> ceil(1/30)=1 period x 1200)"

      - name: machine_weekly_plan_ceil_accrual
        claim_type: correct_result
        grounds: [calculations.rental_accrual]
        distinguishing_aspect: "WEEKLY machine plan: 8 chargeable days -> ceil(8/7)=2 weeks x 20000 = 40000 provisional accrual."
        test_recipe:
          setup: ["CASH customer; machine weekly 20000; rental start 2026-08-01 grace 0; clock 2026-08-09"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BranchManager
            - call: "POST /customers"
              payload: { account_no: "ACC-CA4", name: "Weekly Co", terms: "CASH" }
              as: CounterRep
              captures: { cid: $.data.id }
            - call: "POST /machines"
              payload: { model: "Lincoln 210", serial_no: "M-CA4", daily_rate_cents: 4000, weekly_rate_cents: 20000, monthly_rate_cents: 55000 }
              as: BranchManager
              captures: { mid: $.data.id }
            - call: "POST /rental-agreements"
              payload: { customer_id: "${cid}", item_type: "MACHINE", machine_id: "${mid}", rate_plan: "WEEKLY", start_date: "2026-08-01", grace_days: 0 }
              as: CounterRep
              captures: { ra: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-09T00:00:00Z" }
              as: BranchManager
          trigger:
            - call: "GET /rental-agreements/${ra}"
              as: CounterRep
              captures: { acc: $.data.accrued_unbilled_cents }
          assert:
            - "acc == 40000  (ceil(8/7)=2 x 20000)"

      - name: billing_run_aggregates_one_invoice_per_customer
        claim_type: input_set_filtering
        grounds: [calculations.rental_accrual, endpoints]
        distinguishing_aspect: "Two ACTIVE demurrage agreements for the same customer roll up into a single RENTAL_CYCLE invoice of 2400 at the run; the other customer's agreement gets its own invoice."
        test_recipe:
          setup:
            - "Customer A (CASH) with two DEMURRAGE rentals (cylinders N1, N2), customer B (CASH) with one (N3); all start 2026-08-01 grace 5"
            - "clock 2026-09-15: each agreement floors to 1 period = 1200"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BranchManager
            - call: "POST /customers"
              payload: { account_no: "ACC-CA5A", name: "Multi Co", terms: "CASH" }
              as: CounterRep
              captures: { ca: $.data.id }
            - call: "POST /customers"
              payload: { account_no: "ACC-CA5B", name: "Solo Co", terms: "CASH" }
              as: CounterRep
              captures: { cb: $.data.id }
            - call: "POST /cylinder-assets"
              payload: { serial_no: "CYL-CA5-1", gas_grade: "NITROGEN", size: "SMALL" }
              as: BranchManager
              captures: { n1: $.data.id }
            - call: "POST /cylinder-assets"
              payload: { serial_no: "CYL-CA5-2", gas_grade: "NITROGEN", size: "SMALL" }
              as: BranchManager
              captures: { n2: $.data.id }
            - call: "POST /cylinder-assets"
              payload: { serial_no: "CYL-CA5-3", gas_grade: "NITROGEN", size: "SMALL" }
              as: BranchManager
              captures: { n3: $.data.id }
            - call: "POST /rental-agreements"
              payload: { customer_id: "${ca}", item_type: "CYLINDER", cylinder_asset_id: "${n1}", rate_plan: "DEMURRAGE", start_date: "2026-08-01", grace_days: 5 }
              as: CounterRep
            - call: "POST /rental-agreements"
              payload: { customer_id: "${ca}", item_type: "CYLINDER", cylinder_asset_id: "${n2}", rate_plan: "DEMURRAGE", start_date: "2026-08-01", grace_days: 5 }
              as: CounterRep
            - call: "POST /rental-agreements"
              payload: { customer_id: "${cb}", item_type: "CYLINDER", cylinder_asset_id: "${n3}", rate_plan: "DEMURRAGE", start_date: "2026-08-01", grace_days: 5 }
              as: CounterRep
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: BranchManager
          trigger:
            - call: "POST /billing/run-rental-cycle"
              payload: {}
              as: BranchManager
              captures: { n_inv: $.data.invoices_created, tot: $.data.total_billed_cents }
            - call: "GET /invoices"
              payload: { customer_id: "${ca}" }
              as: BranchManager
              captures: { a_amount: "$.data[0].amount_cents", a_source: "$.data[0].source" }
          assert:
            - "n_inv == 2  (one per customer, not one per agreement)"
            - "tot == 3600  (1200 x 3 agreements)"
            - "a_amount == 2400 and a_source == RENTAL_CYCLE  (two agreements aggregated)"

      - name: route_capacity_equality_then_overflow
        claim_type: correct_result
        grounds: [calculations.route_load, "errors[ERR_ROUTE_CAPACITY_EXCEEDED]"]
        distinguishing_aspect: "reserved + units == capacity passes (2+2 == 4); the next 1-unit order (5 > 4) fails ERR_ROUTE_CAPACITY_EXCEEDED."
        test_recipe:
          setup: ["CASH customer; product stock 10; route cap 4"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_no: "ACC-CA6", name: "Truck Co", terms: "CASH" }
              as: CounterRep
              captures: { cid: $.data.id }
            - call: "POST /products"
              payload: { sku: "HG-CA6", name: "Gloves", category: "HARDGOOD", retail_price_cents: 1000 }
              as: BranchManager
              captures: { pid: $.data.id }
            - call: "POST /products/${pid}/receive"
              payload: { qty: 10 }
              as: BranchManager
            - call: "POST /delivery-routes"
              payload: { route_date: "2026-08-06", truck_capacity_units: 4 }
              as: CounterRep
              captures: { rid: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cid}", order_type: "RETAIL", fulfillment: "ROUTE", route_id: "${rid}", lines: [{ product_id: "${pid}", qty: 2 }] }
              as: CounterRep
              captures: { o1: $.data.id }
            - call: "POST /orders/${o1}/confirm"
              payload: {}
              as: CounterRep
            - call: "POST /orders"
              payload: { customer_id: "${cid}", order_type: "RETAIL", fulfillment: "ROUTE", route_id: "${rid}", lines: [{ product_id: "${pid}", qty: 2 }] }
              as: CounterRep
              captures: { o2: $.data.id }
            - call: "POST /orders/${o2}/confirm"
              payload: {}
              as: CounterRep
              captures: { o2_status: $.data.fulfillment_status }
            - call: "POST /orders"
              payload: { customer_id: "${cid}", order_type: "RETAIL", fulfillment: "ROUTE", route_id: "${rid}", lines: [{ product_id: "${pid}", qty: 1 }] }
              as: CounterRep
              captures: { o3: $.data.id }
            - call: "POST /orders/${o3}/confirm"
              payload: {}
              as: CounterRep
              captures: { err: $.data.error_id }
            - call: "GET /delivery-routes/${rid}"
              as: CounterRep
              captures: { reserved: $.data.reserved_units }
          assert:
            - "o2_status == CONFIRMED  (2 + 2 == 4 capacity: equality allowed)"
            - "err == ERR_ROUTE_CAPACITY_EXCEEDED  (4 + 1 > 4)"
            - "reserved == 4"

      - name: expired_price_book_falls_back_to_retail
        claim_type: input_set_filtering
        grounds: [calculations.contract_price_resolution, state_machines.PriceBook.ACTIVE_to_EXPIRED]
        distinguishing_aspect: "After the clock passes effective_to the book sweeps to EXPIRED and confirm prices at full retail (10000), no discount."
        test_recipe:
          setup: ["CASH customer with CONTRACT book window [2026-01-01, 2026-08-01) default 0.50; product 10000 stock 5; clock walks 2026-07-15 -> 2026-08-10"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
