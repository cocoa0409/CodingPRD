              as_user_id: "po-1"
              captures: { as_id: $.data.id, as_status: $.data.status }
            - call: "GET /jurisdictions/${il_id}"
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { il_v_final: $.data.version }
          assert:
            - "${il_v_after_patch} == ${il_v_stale} + 1"
            - "First trigger: HTTP 412 with data.error_id == ERR_STALE_JURISDICTION_VERSION and GET /exposure-assessments with program_id ${prog_id} returns total_count 0"
            - "Second trigger: HTTP 201 with ${as_status} == DRAFT, exposure_cents 0 and created_by_user_id po-1"
