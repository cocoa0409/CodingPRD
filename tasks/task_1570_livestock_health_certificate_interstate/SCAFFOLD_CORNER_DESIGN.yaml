              as: AccreditedVet
              as_user_id: "${vet_id}"
            - call: "POST /api/certificates/${cert_id}/issue"
              as: StateVetOfficer
          trigger:
            - call: "POST /api/certificates/${cert_id}/void"
              payload: { reason: "DISEASE_SUSPECT" }
              as: StateVetOfficer
              captures: { st: $.data.status, vreason: $.data.void_reason }
            - call: "POST /api/certificates/${cert_id}/submit"
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { err_s: $.data.error_id }
            - call: "POST /api/certificates/${cert_id}/issue"
