        claim_type: precondition_enforcement
        grounds:
          - "state_machines.FestivalEdition.SCREENING_to_DELIBERATION"
          - "errors[ERR_SCORING_INCOMPLETE]"
        distinguishing_aspect: "Advance to DELIBERATION blocked while an IN_SCREENING film has fewer SCORED assignments than its category's screener_count_required (1 of 2)."
