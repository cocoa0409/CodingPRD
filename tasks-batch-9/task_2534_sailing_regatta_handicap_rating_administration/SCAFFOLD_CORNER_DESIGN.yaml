# Scaffold Corner Design (breadth probe) - SKILL.md 1.9
# Task 2534 - Sailing Regatta & Handicap Rating Administration
#
# Walked row-by-row from references/claim-extraction-guide.md against this
# scaffold's 1.1-1.7 surface. Every `section:` is one of the guide's nine
# sections and every `claim_type:` is a row of that section's table.
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an
# `excluded_because:` stub instead of a test_recipe.
#
# Shared world conventions (identical to SCAFFOLD_DIFFICULTY_DESIGN.yaml):
#   * the logical clock starts at 2026-08-01T00:00:00Z and is moved only with
#     POST /regatta-ops/_clock/set_current_utc
#   * ClubAdmin is an opaque role and always acts with the audit id "ops-desk-1"
#   * certificates are measured valid_from 2026-01-01 / valid_until 2026-12-31
#   * regattas race on 2026-08-05 with series_start_utc 2026-08-05T00:00:00Z
#   * fleet_minimum 2 with Division.min_entries 2 is the smallest legal fleet
#   * jury_quorum_required 2, so one POST /jury-panels/{id}/seats seats a quorum
#   * safety_category CAT_4 plus course_code DISTANCE_COASTAL keeps the required
#     duty positions at PRO / TIMEKEEPER / SIGNALS only
#   * measured boats reused across instances:
#       A  USA-4410  68.0 / 11.0 / 5200 / 2.10 MONOHULL -> raw 0.6545, TOD 171.3
#       B  USA-3308  52.0 /  9.4 / 4100 / 1.95 MONOHULL -> raw 0.5294, TOD 218.8
#   * "light RACING world" means: division CONFIRMED on two ASSIGNED entries and
#     a SEATED jury panel, which is all POST /regattas/{id}/open-racing needs -
#     no acceptance, no duty assignment and no race row are required for it
scaffold_corner_design:

  # =========================================================================
  # From Table 1 (Entities)
  # =========================================================================
  - section: entities
    instances:

      - name: club_member_creation_returns_declared_defaults
        claim_type: creation
        grounds:
          - endpoints[POST /regatta-ops/club-members]
          - entities.ClubMember.fields.measurer_license_id
          - entities.ClubMember.fields.judge_certification_level
          - entities.ClubMember.fields.safety_course_expiry_utc
          - entities.ClubMember.fields.assigned_duty_minutes
        distinguishing_aspect: |
          A ClubMember created with only the two required inputs comes back 201 with
          measurer_license_id null, judge_certification_level NONE, safety_course_expiry_utc
          null, assigned_duty_minutes 0 and version 1, while a second member created with all
          three optional credentials echoes them verbatim - so the defaults are row defaults,
          not a server that ignores the optional inputs.
        test_recipe:
          setup:
            - "Empty database with the logical clock parked at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - { call: "POST /regatta-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ClubAdmin, as_user_id: "ops-desk-1" }
          trigger:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Owen Clay", email: "owen.clay@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_plain: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Mara Vance", email: "mara.vance@yc.test", measurer_license_id: "M-101", judge_certification_level: "REGIONAL", safety_course_expiry_utc: "2027-06-30T00:00:00Z" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_full: $.data.id } }
          assert:
            - "trigger call 1 returns HTTP 201"
            - "ClubMember.${m_plain}.measurer_license_id == null and ClubMember.${m_plain}.judge_certification_level == NONE"
            - "ClubMember.${m_plain}.safety_course_expiry_utc == null and ClubMember.${m_plain}.assigned_duty_minutes == 0"
            - "ClubMember.${m_plain}.version == 1 and ClubMember.${m_plain}.created_at is non-null and ClubMember.${m_plain}.updated_at is non-null"
            - "ClubMember.${m_full}.measurer_license_id == M-101 and ClubMember.${m_full}.judge_certification_level == REGIONAL"
            - "ClubMember.${m_full}.safety_course_expiry_utc == 2027-06-30T00:00:00Z and ClubMember.${m_full}.assigned_duty_minutes == 0"

      - name: boat_retrieval_returns_stored_measurement_owner_and_version
        claim_type: retrieval
        grounds:
          - endpoints[GET /regatta-ops/boats/{id}]
          - entities.Boat.fields.sail_number
          - entities.Boat.fields.owner_member_id
          - entities.Boat.fields.loa_meters
        distinguishing_aspect: |
          GET /regatta-ops/boats/{id} returns exactly the row POST /regatta-ops/boats stored -
          sail_number USA-4410, boat_type MONOHULL, loa_meters 11.3, owner_member_id equal to the
          enrolling member - and version 1, the value POST /rating-certificates must echo in
          expected_boat_version.
        test_recipe:
          setup:
            - "One club member owns one registered MONOHULL boat; no certificate exists yet, so Boat.version is still 1."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Owen Clay", email: "owen.clay@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_h1: $.data.id } }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-4410", boat_name: "Windward Rose", owner_member_id: "${m_h1}", boat_type: "MONOHULL", loa_meters: 11.3 }, as: Competitor, as_user_id: "${m_h1}", captures: { b_a: $.data.id } }
          trigger:
            - { call: "GET /regatta-ops/boats/${b_a}", payload: {}, as: ClubAdmin, as_user_id: "ops-desk-1" }
          assert:
            - "trigger call 1 returns HTTP 200 with response_type object"
            - "Boat.${b_a}.sail_number == USA-4410 and Boat.${b_a}.boat_name == Windward Rose"
            - "Boat.${b_a}.owner_member_id == ${m_h1} and Boat.${b_a}.boat_type == MONOHULL"
            - "Boat.${b_a}.loa_meters == 11.3 and Boat.${b_a}.version == 1"

      - name: boats_listing_paginates_and_filters_by_hull_type
        claim_type: listing
        grounds:
          - endpoints[GET /regatta-ops/boats]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          With three boats registered, GET /regatta-ops/boats?limit=2&offset=0 returns 2 rows with
          total_count 3 and has_more true, the same read at offset=2 returns 1 row with has_more
          false, and boat_type=MULTIHULL narrows total_count to 1 - so total_count counts the
          filtered set, not the page.
        test_recipe:
          setup:
            - "Two members own three boats between them: two MONOHULL and one MULTIHULL."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Owen Clay", email: "owen.clay@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_h1: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Rhea Voss", email: "rhea.voss@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_h2: $.data.id } }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-4410", boat_name: "Windward Rose", owner_member_id: "${m_h1}", boat_type: "MONOHULL", loa_meters: 11.3 }, as: Competitor, as_user_id: "${m_h1}", captures: { b_a: $.data.id } }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-3308", boat_name: "Sea Fable", owner_member_id: "${m_h2}", boat_type: "MONOHULL", loa_meters: 9.6 }, as: Competitor, as_user_id: "${m_h2}", captures: { b_b: $.data.id } }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-7712", boat_name: "Kite Runner", owner_member_id: "${m_h1}", boat_type: "MULTIHULL", loa_meters: 12.0 }, as: Competitor, as_user_id: "${m_h1}", captures: { b_c: $.data.id } }
          trigger:
            - { call: "GET /regatta-ops/boats?limit=2&offset=0", payload: { limit: 2, offset: 0 }, as: ClubAdmin, as_user_id: "ops-desk-1" }
            - { call: "GET /regatta-ops/boats?limit=2&offset=2", payload: { limit: 2, offset: 2 }, as: ClubAdmin, as_user_id: "ops-desk-1" }
            - { call: "GET /regatta-ops/boats?boat_type=MULTIHULL&limit=10&offset=0", payload: { boat_type: "MULTIHULL", limit: 10, offset: 0 }, as: ClubAdmin, as_user_id: "ops-desk-1" }
            - { call: "GET /regatta-ops/boats?owner_member_id=${m_h1}&limit=10&offset=0", payload: { owner_member_id: "${m_h1}", limit: 10, offset: 0 }, as: ClubAdmin, as_user_id: "ops-desk-1" }
          assert:
            - "trigger call 1 returns 2 rows with total_count 3, limit 2, offset 0 and has_more true"
            - "trigger call 2 returns 1 row with total_count 3, offset 2 and has_more false"
            - "trigger call 3 returns exactly one row, ${b_c}, with total_count 1 and has_more false"
            - "trigger call 4 returns total_count 2, the rows ${b_a} and ${b_c}, and has_more false"

      - name: rating_certificate_not_found_returns_404
        claim_type: not_found
        grounds:
          - endpoints[GET /regatta-ops/rating-certificates/{id}]
          - validations[priority=8]
          - errors[ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: |
          A GET on a syntactically valid but unknown certificate id returns 404 with error_id
          ERR_RESOURCE_NOT_FOUND, while the same read on the id minted moments earlier returns
          200 - the 404 is row absence, not a broken route.
        test_recipe:
          setup:
            - "One licensed measurer, one boat and one DRAFT certificate exist; no row carries the id 00000000-0000-4000-8000-0000000000ff."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Owen Clay", email: "owen.clay@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_h1: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Mara Vance", email: "mara.vance@yc.test", measurer_license_id: "M-101" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_mea: $.data.id } }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-4410", boat_name: "Windward Rose", owner_member_id: "${m_h1}", boat_type: "MONOHULL", loa_meters: 11.3 }, as: Competitor, as_user_id: "${m_h1}", captures: { b_a: $.data.id, b_a_v: $.data.version } }
            - { call: "POST /regatta-ops/rating-certificates", payload: { boat_id: "${b_a}", rule_code: "TOD_PHRF", sail_area_m2: 68.0, hull_length_m: 11.0, displacement_kg: 5200, draft_m: 2.10, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z", expected_boat_version: "${b_a_v}" }, as: Measurer, as_user_id: "${m_mea}", captures: { c_a: $.data.id } }
          trigger:
            - { call: "GET /regatta-ops/rating-certificates/00000000-0000-4000-8000-0000000000ff", payload: {}, as: ClubAdmin, as_user_id: "ops-desk-1" }
            - { call: "GET /regatta-ops/rating-certificates/${c_a}", payload: {}, as: ClubAdmin, as_user_id: "ops-desk-1" }
          assert:
            - "trigger call 1 returns HTTP 404 with error_id ERR_RESOURCE_NOT_FOUND and response_type error"
            - "trigger call 2 returns HTTP 200 with data.id == ${c_a} and data.status == DRAFT"

      - name: division_missing_rating_band_high_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints[POST /regatta-ops/divisions]
          - validations[priority=6]
          - errors[ERR_INVALID_REQUEST]
          - entities.Division.fields.rating_band_high
        distinguishing_aspect: |
          rating_band_high has source input and no default, so omitting it returns 400
          ERR_INVALID_REQUEST, and an unknown body field (fleet_minimum, which lives on Regatta
          and not on Division) returns the same 400 - both from priority 6, which is evaluated
          before the priority-12 regatta-phase check, so the DRAFT regatta never masks the
          shape error.
        test_recipe:
          setup:
            - "One regatta chair and one DRAFT regatta; no division exists."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Piers Holt", email: "piers.holt@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_ch: $.data.id } }
            - { call: "POST /regatta-ops/regattas", payload: { name: "Autumn Handicap Series", host_club_name: "Harbor Yacht Club", scoring_system: "LOW_POINT", discard_policy: "NONE", handicap_basis: "PER_CERTIFICATE", planned_race_count: 6, fleet_minimum: 2, protest_time_limit_minutes: 90, jury_quorum_required: 2, safety_category: "CAT_4", series_start_utc: "2026-08-05T00:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { reg: $.data.id } }
          trigger:
            - { call: "POST /regatta-ops/divisions", payload: { regatta_id: "${reg}", code: "A", boat_type_filter: "MONOHULL", rating_band_low: 150.0 }, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/divisions", payload: { regatta_id: "${reg}", code: "A", boat_type_filter: "MONOHULL", rating_band_low: 150.0, rating_band_high: 230.0, fleet_minimum: 2 }, as: RegattaChair, as_user_id: "${m_ch}" }
          assert:
            - "trigger call 1 returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "trigger call 2 returns HTTP 400 with error_id ERR_INVALID_REQUEST because fleet_minimum is not a declared input of POST /regatta-ops/divisions"
            - "GET /regatta-ops/divisions?regatta_id=${reg} returns total_count 0: neither rejected call created a row"
            - "Regatta.${reg}.status == DRAFT and Regatta.${reg}.version == 1"

      - name: mark_boat_defaults_apply_limit_two_and_buffer_twenty
        claim_type: defaults
        grounds:
          - endpoints[POST /regatta-ops/mark-boats]
          - entities.MarkBoat.fields.concurrent_assignment_limit
          - entities.MarkBoat.fields.turnaround_buffer_minutes
          - entities.MarkBoat.fields.committed_minutes
        distinguishing_aspect: |
          A mark boat chartered without the two optional inputs comes back with
          concurrent_assignment_limit 2, turnaround_buffer_minutes 20 and committed_minutes 0,
          while a second boat that supplies 1 and 0 keeps those values - so the defaults are not
          hard-wired constants in the overlap rule.
        test_recipe:
          setup:
            - "One regatta chair and one DRAFT regatta; POST /regatta-ops/mark-boats carries no regatta-phase precondition."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Piers Holt", email: "piers.holt@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_ch: $.data.id } }
            - { call: "POST /regatta-ops/regattas", payload: { name: "Autumn Handicap Series", host_club_name: "Harbor Yacht Club", scoring_system: "LOW_POINT", discard_policy: "NONE", handicap_basis: "PER_CERTIFICATE", planned_race_count: 6, fleet_minimum: 2, protest_time_limit_minutes: 90, jury_quorum_required: 2, safety_category: "CAT_4", series_start_utc: "2026-08-05T00:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { reg: $.data.id } }
          trigger:
            - { call: "POST /regatta-ops/mark-boats", payload: { regatta_id: "${reg}", call_sign: "MB-1", crew_capacity: 4 }, as: RegattaChair, as_user_id: "${m_ch}", captures: { mb_def: $.data.id } }
            - { call: "POST /regatta-ops/mark-boats", payload: { regatta_id: "${reg}", call_sign: "MB-2", crew_capacity: 3, concurrent_assignment_limit: 1, turnaround_buffer_minutes: 0 }, as: RegattaChair, as_user_id: "${m_ch}", captures: { mb_exp: $.data.id } }
          assert:
            - "trigger call 1 returns HTTP 201"
            - "MarkBoat.${mb_def}.concurrent_assignment_limit == 2 and MarkBoat.${mb_def}.turnaround_buffer_minutes == 20"
            - "MarkBoat.${mb_def}.committed_minutes == 0 and MarkBoat.${mb_def}.version == 1"
            - "MarkBoat.${mb_exp}.concurrent_assignment_limit == 1 and MarkBoat.${mb_exp}.turnaround_buffer_minutes == 0"

      - name: crew_weight_recomputed_from_manifest_and_extra_field_rejected
        claim_type: computed_fields
        grounds:
          - endpoints[POST /regatta-ops/entries/{id}/crew]
          - entities.Entry.fields.crew_weight_kg
          - entities.Entry.fields.registered_crew_count
          - validations[priority=6]
        distinguishing_aspect: |
          crew_weight_kg has source computed: after weights 84.5 and 79.25 it reads 163.8 (sum
          163.75 rounded HALF_UP to 1 decimal, never 163.7 and never 163.75), and a crew call
          that tries to carry crew_weight_kg itself is refused 400 ERR_INVALID_REQUEST with the
          manifest, the count and Entry.version all unchanged.
        test_recipe:
          setup:
            - "A regatta with the notice of race published, one MONOHULL boat with a DRAFT certificate, and one entry declaring three crew."
            - "Two crew registrations already on the manifest: the helm at 84.5 kg and a trimmer at 79.25 kg."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Piers Holt", email: "piers.holt@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_ch: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Mara Vance", email: "mara.vance@yc.test", measurer_license_id: "M-101" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_mea: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Owen Clay", email: "owen.clay@yc.test", safety_course_expiry_utc: "2027-06-30T00:00:00Z" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_h1: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Lena Fisk", email: "lena.fisk@yc.test", safety_course_expiry_utc: "2027-06-30T00:00:00Z" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_c1: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Iris Vale", email: "iris.vale@yc.test", safety_course_expiry_utc: "2027-06-30T00:00:00Z" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_c2: $.data.id } }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-4410", boat_name: "Windward Rose", owner_member_id: "${m_h1}", boat_type: "MONOHULL", loa_meters: 11.3 }, as: Competitor, as_user_id: "${m_h1}", captures: { b_a: $.data.id, b_a_v: $.data.version } }
            - { call: "POST /regatta-ops/rating-certificates", payload: { boat_id: "${b_a}", rule_code: "TOD_PHRF", sail_area_m2: 68.0, hull_length_m: 11.0, displacement_kg: 5200, draft_m: 2.10, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z", expected_boat_version: "${b_a_v}" }, as: Measurer, as_user_id: "${m_mea}", captures: { c_a: $.data.id } }
            - { call: "POST /regatta-ops/regattas", payload: { name: "Autumn Handicap Series", host_club_name: "Harbor Yacht Club", scoring_system: "LOW_POINT", discard_policy: "NONE", handicap_basis: "PER_CERTIFICATE", planned_race_count: 6, fleet_minimum: 2, protest_time_limit_minutes: 90, jury_quorum_required: 2, safety_category: "CAT_4", series_start_utc: "2026-08-05T00:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { reg: $.data.id, reg_v1: $.data.version } }
            - { call: "POST /regatta-ops/race-documents", payload: { regatta_id: "${reg}", doc_type: "NOR", body_summary: "Notice of race revision 1", effective_utc: "2026-07-10T00:00:00Z", expected_regatta_version: "${reg_v1}" }, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/entries", payload: { regatta_id: "${reg}", boat_id: "${b_a}", certificate_id: "${c_a}", helm_member_id: "${m_h1}", declared_crew_count: 3 }, as: Competitor, as_user_id: "${m_h1}", captures: { e_a: $.data.id } }
            - { call: "POST /regatta-ops/entries/${e_a}/crew", payload: { member_id: "${m_h1}", position: "HELM", weight_kg: 84.5 }, as: Competitor, as_user_id: "${m_h1}" }
            - { call: "POST /regatta-ops/entries/${e_a}/crew", payload: { member_id: "${m_c1}", position: "TRIM", weight_kg: 79.25 }, as: Competitor, as_user_id: "${m_h1}" }
          trigger:
            - { call: "POST /regatta-ops/entries/${e_a}/crew", payload: { member_id: "${m_c2}", position: "BOW", weight_kg: 70.0, crew_weight_kg: 500.0 }, as: Competitor, as_user_id: "${m_h1}" }
          assert:
            - "the trigger call returns HTTP 400 with error_id ERR_INVALID_REQUEST because crew_weight_kg is a computed field and not a declared input"
            - "Entry.${e_a}.crew_weight_kg == 163.8, the HALF_UP 1-decimal rounding of 84.5 + 79.25 = 163.75"
            - "Entry.${e_a}.registered_crew_count == 2 and Entry.${e_a}.declared_crew_count == 3"
            - "Entry.${e_a}.crew_manifest holds exactly two elements, ${m_h1} as HELM and ${m_c1} as TRIM"
            - "Entry.${e_a}.version == 3: one at submission plus one per accepted crew call, with no increment from the rejected call"

      - name: certificate_measured_by_member_id_taken_from_actor_header
        claim_type: system_fields
        grounds:
          - endpoints[POST /regatta-ops/rating-certificates]
          - entities.RatingCertificate.fields.measured_by_member_id
          - entities.RatingCertificate.fields.status
          - calculations.certificate_rating_value
        distinguishing_aspect: |
          measured_by_member_id has source system and is written from the acting Measurer's
          X-User-ID, not from the body: the created row carries measured_by_member_id equal to
          the measurer who called, status DRAFT, version 1, and the boat's version has advanced
          from 1 to 2 - so the certificate create is also the OCC bump the next create must echo.
        test_recipe:
          setup:
            - "One licensed measurer (M-101), one owner and one MONOHULL boat at version 1."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Owen Clay", email: "owen.clay@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_h1: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Mara Vance", email: "mara.vance@yc.test", measurer_license_id: "M-101" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_mea: $.data.id } }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-4410", boat_name: "Windward Rose", owner_member_id: "${m_h1}", boat_type: "MONOHULL", loa_meters: 11.3 }, as: Competitor, as_user_id: "${m_h1}", captures: { b_a: $.data.id, b_a_v: $.data.version } }
          trigger:
            - { call: "POST /regatta-ops/rating-certificates", payload: { boat_id: "${b_a}", rule_code: "TOD_PHRF", sail_area_m2: 68.0, hull_length_m: 11.0, displacement_kg: 5200, draft_m: 2.10, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z", expected_boat_version: "${b_a_v}" }, as: Measurer, as_user_id: "${m_mea}", captures: { c_a: $.data.id } }
          assert:
            - "the trigger call returns HTTP 201"
            - "RatingCertificate.${c_a}.measured_by_member_id == ${m_mea}, copied from the X-User-ID header"
            - "RatingCertificate.${c_a}.status == DRAFT and RatingCertificate.${c_a}.supersedes_certificate_id == null"
            - "RatingCertificate.${c_a}.raw_speed_index == 0.6545, rating_value == 171.3 and band_key_spm == 171.3"
            - "RatingCertificate.${c_a}.version == 1 and Boat.${b_a}.version == 2"

      - name: boat_type_invalid_enum_rejected
        claim_type: type_constraints
        grounds:
          - endpoints[POST /regatta-ops/boats]
          - entities.Boat.fields.boat_type
          - entities.Boat.fields.loa_meters
          - validations[priority=6]
        distinguishing_aspect: |
          boat_type accepts only MONOHULL, MULTIHULL and KEELBOAT_SPORT, so TRIMARAN is 400
          ERR_INVALID_REQUEST, and loa_meters 45.0 breaks the declared range 0 < loa <= 40 for
          the same 400 - two different constraint kinds on one endpoint, with the legal 11.3
          request proving the endpoint itself works.
        test_recipe:
          setup:
            - "One club member who will own the boat; no boat exists."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Owen Clay", email: "owen.clay@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_h1: $.data.id } }
          trigger:
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-4410", boat_name: "Windward Rose", owner_member_id: "${m_h1}", boat_type: "TRIMARAN", loa_meters: 11.3 }, as: Competitor, as_user_id: "${m_h1}" }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-4410", boat_name: "Windward Rose", owner_member_id: "${m_h1}", boat_type: "MONOHULL", loa_meters: 45.0 }, as: Competitor, as_user_id: "${m_h1}" }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-4410", boat_name: "Windward Rose", owner_member_id: "${m_h1}", boat_type: "MONOHULL", loa_meters: 11.3 }, as: Competitor, as_user_id: "${m_h1}", captures: { b_a: $.data.id } }
          assert:
            - "trigger call 1 returns HTTP 400 with error_id ERR_INVALID_REQUEST for the undeclared enum member TRIMARAN"
            - "trigger call 2 returns HTTP 400 with error_id ERR_INVALID_REQUEST for loa_meters 45.0 above the declared ceiling 40"
            - "trigger call 3 returns HTTP 201 with Boat.${b_a}.loa_meters == 11.3"
            - "GET /regatta-ops/boats?owner_member_id=${m_h1} returns total_count 1: the two rejected calls created nothing"

      - name: recall_event_rows_are_immutable_and_carry_no_version
        claim_type: immutability
        grounds:
          - entities.RecallEvent
          - endpoints[GET /regatta-ops/recall-events]
          - endpoints[GET /regatta-ops/recall-events/{id}]
        excluded_because:
          difficulty_instance: non_linear_state_machine / race_general_recall_cycle_reaches_black_flag_then_ocs
          rationale: "That instance mints three RecallEvent rows through the only endpoint that creates them and reads each one back field by field (resulting_start_status, black_flag_applied, recorded_by_member_id); RecallEvent declares common_fields false, and §1.5 exposes no update or delete route for the collection, so the immutability claim is fully asserted there."

      - name: entry_certificate_of_another_boat_rejected
        claim_type: parent_relationships
        grounds:
          - endpoints[POST /regatta-ops/entries]
          - validations[priority=23]
          - errors[ERR_CROSS_REGATTA_REFERENCE]
          - entities.Entry.fields.certificate_id
        distinguishing_aspect: |
          The scaffold's topology is flat, so Entry.certificate_id is checked for cross-reference
          coherence rather than by URL nesting: an entry naming boat A but the certificate
          measured on boat B returns 409 ERR_CROSS_REGATTA_REFERENCE, while the same request with
          boat A's own certificate returns 201.
        test_recipe:
          setup:
            - "A regatta with the notice of race published, two owners, two MONOHULL boats and one DRAFT certificate per boat."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Piers Holt", email: "piers.holt@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_ch: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Mara Vance", email: "mara.vance@yc.test", measurer_license_id: "M-101" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_mea: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Owen Clay", email: "owen.clay@yc.test", safety_course_expiry_utc: "2027-06-30T00:00:00Z" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_h1: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Rhea Voss", email: "rhea.voss@yc.test", safety_course_expiry_utc: "2027-06-30T00:00:00Z" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_h2: $.data.id } }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-4410", boat_name: "Windward Rose", owner_member_id: "${m_h1}", boat_type: "MONOHULL", loa_meters: 11.3 }, as: Competitor, as_user_id: "${m_h1}", captures: { b_a: $.data.id, b_a_v: $.data.version } }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-3308", boat_name: "Sea Fable", owner_member_id: "${m_h2}", boat_type: "MONOHULL", loa_meters: 9.6 }, as: Competitor, as_user_id: "${m_h2}", captures: { b_b: $.data.id, b_b_v: $.data.version } }
            - { call: "POST /regatta-ops/rating-certificates", payload: { boat_id: "${b_a}", rule_code: "TOD_PHRF", sail_area_m2: 68.0, hull_length_m: 11.0, displacement_kg: 5200, draft_m: 2.10, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z", expected_boat_version: "${b_a_v}" }, as: Measurer, as_user_id: "${m_mea}", captures: { c_a: $.data.id } }
            - { call: "POST /regatta-ops/rating-certificates", payload: { boat_id: "${b_b}", rule_code: "TOD_PHRF", sail_area_m2: 52.0, hull_length_m: 9.4, displacement_kg: 4100, draft_m: 1.95, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z", expected_boat_version: "${b_b_v}" }, as: Measurer, as_user_id: "${m_mea}", captures: { c_b: $.data.id } }
            - { call: "POST /regatta-ops/regattas", payload: { name: "Autumn Handicap Series", host_club_name: "Harbor Yacht Club", scoring_system: "LOW_POINT", discard_policy: "NONE", handicap_basis: "PER_CERTIFICATE", planned_race_count: 6, fleet_minimum: 2, protest_time_limit_minutes: 90, jury_quorum_required: 2, safety_category: "CAT_4", series_start_utc: "2026-08-05T00:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { reg: $.data.id, reg_v1: $.data.version } }
            - { call: "POST /regatta-ops/race-documents", payload: { regatta_id: "${reg}", doc_type: "NOR", body_summary: "Notice of race revision 1", effective_utc: "2026-07-10T00:00:00Z", expected_regatta_version: "${reg_v1}" }, as: RegattaChair, as_user_id: "${m_ch}" }
          trigger:
            - { call: "POST /regatta-ops/entries", payload: { regatta_id: "${reg}", boat_id: "${b_a}", certificate_id: "${c_b}", helm_member_id: "${m_h1}", declared_crew_count: 1 }, as: Competitor, as_user_id: "${m_h1}" }
            - { call: "POST /regatta-ops/entries", payload: { regatta_id: "${reg}", boat_id: "${b_a}", certificate_id: "${c_a}", helm_member_id: "${m_h1}", declared_crew_count: 1 }, as: Competitor, as_user_id: "${m_h1}", captures: { e_a: $.data.id } }
          assert:
            - "trigger call 1 returns HTTP 409 with error_id ERR_CROSS_REGATTA_REFERENCE: ${c_b} was measured on boat ${b_b}"
            - "trigger call 2 returns HTTP 201 with Entry.${e_a}.certificate_id == ${c_a}"
            - "Entry.${e_a}.registration_status == SUBMITTED, inspection_status == NOT_INSPECTED and division_id == null"
            - "GET /regatta-ops/entries?regatta_id=${reg} returns total_count 1"

  # =========================================================================
  # From Table 2 (State Machines)
  # =========================================================================
  - section: state_machines
    instances:

      - name: certificate_issue_supersedes_prior_issued_certificate_of_same_boat
        claim_type: valid_transition
        grounds:
          - state_machines.RatingCertificate.DRAFT_to_ISSUED
          - state_machines.RatingCertificate.ISSUED_to_SUPERSEDED
          - endpoints[POST /regatta-ops/rating-certificates/{id}/issue]
        distinguishing_aspect: |
          Issuing a second certificate for the same boat runs the two declared hops in order: the
          new row goes ISSUED with supersedes_certificate_id pointing at the old row, the old row
          goes SUPERSEDED (its terminal state) and keeps its own supersedes_certificate_id null,
          and Boat.version has climbed 1 -> 5 across the four writes.
        test_recipe:
          setup:
            - "One licensed measurer and one MONOHULL boat carrying one ISSUED TOD_PHRF certificate; Boat.version is 3 after that create-plus-issue pair."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Owen Clay", email: "owen.clay@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_h1: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Mara Vance", email: "mara.vance@yc.test", measurer_license_id: "M-101" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_mea: $.data.id } }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-4410", boat_name: "Windward Rose", owner_member_id: "${m_h1}", boat_type: "MONOHULL", loa_meters: 11.3 }, as: Competitor, as_user_id: "${m_h1}", captures: { b_a: $.data.id, b_a_v1: $.data.version } }
            - { call: "POST /regatta-ops/rating-certificates", payload: { boat_id: "${b_a}", rule_code: "TOD_PHRF", sail_area_m2: 68.0, hull_length_m: 11.0, displacement_kg: 5200, draft_m: 2.10, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z", expected_boat_version: "${b_a_v1}" }, as: Measurer, as_user_id: "${m_mea}", captures: { c_old: $.data.id } }
            - { call: "POST /regatta-ops/rating-certificates/${c_old}/issue", payload: {}, as: Measurer, as_user_id: "${m_mea}" }
            - { call: "GET /regatta-ops/boats/${b_a}", payload: {}, as: Measurer, as_user_id: "${m_mea}", captures: { b_a_v3: $.data.version } }
          trigger:
            - { call: "POST /regatta-ops/rating-certificates", payload: { boat_id: "${b_a}", rule_code: "TOT_ORC", sail_area_m2: 68.0, hull_length_m: 11.0, displacement_kg: 5200, draft_m: 2.10, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z", expected_boat_version: "${b_a_v3}" }, as: Measurer, as_user_id: "${m_mea}", captures: { c_new: $.data.id } }
            - { call: "POST /regatta-ops/rating-certificates/${c_new}/issue", payload: {}, as: Measurer, as_user_id: "${m_mea}" }
          assert:
            - "trigger call 2 returns HTTP 200"
            - "RatingCertificate.${c_new}.status == ISSUED and RatingCertificate.${c_new}.supersedes_certificate_id == ${c_old}"
            - "RatingCertificate.${c_new}.rule_code == TOT_ORC, rating_value == 0.8582 and band_key_spm == 171.3"
            - "RatingCertificate.${c_old}.status == SUPERSEDED and RatingCertificate.${c_old}.supersedes_certificate_id == null"
            - "Boat.${b_a}.version == 5: create 1, first certificate create 2, first issue 3, second certificate create 4, second issue 5"
            - "GET /regatta-ops/rating-certificates?boat_id=${b_a}&status=ISSUED returns total_count 1, the row ${c_new}"

      - name: regatta_initial_state_is_draft_with_zero_derived_counters
        claim_type: initial_state
        grounds:
          - state_machines.Regatta.initial_state
          - entities.Regatta.fields.nor_revision
          - entities.Regatta.fields.si_revision
          - entities.Regatta.fields.confirmed_division_count
          - entities.Regatta.fields.final_race_count
        distinguishing_aspect: |
          A freshly created regatta starts at status DRAFT with all four derived counters at 0 and
          version 1, and the optional discard_policy, handicap_basis, fleet_minimum,
          protest_time_limit_minutes and jury_quorum_required fall back to NONE,
          PER_CERTIFICATE, 3, 90 and 3 - the scaffold's own defaults, not the values other
          instances pass in.
        test_recipe:
          setup:
            - "One regatta chair exists; no regatta exists."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Piers Holt", email: "piers.holt@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_ch: $.data.id } }
          trigger:
            - { call: "POST /regatta-ops/regattas", payload: { name: "Autumn Handicap Series", host_club_name: "Harbor Yacht Club", scoring_system: "LOW_POINT", planned_race_count: 6, safety_category: "CAT_4", series_start_utc: "2026-08-05T00:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { reg: $.data.id } }
          assert:
            - "the trigger call returns HTTP 201"
            - "Regatta.${reg}.status == DRAFT and Regatta.${reg}.version == 1"
            - "Regatta.${reg}.nor_revision == 0, si_revision == 0, confirmed_division_count == 0 and final_race_count == 0"
            - "Regatta.${reg}.discard_policy == NONE and Regatta.${reg}.handicap_basis == PER_CERTIFICATE"
            - "Regatta.${reg}.fleet_minimum == 3, protest_time_limit_minutes == 90 and jury_quorum_required == 3"

      - name: certificate_second_issue_returns_409_invalid_state
        claim_type: idempotency
        grounds:
          - state_machines.RatingCertificate.DRAFT_to_ISSUED
          - validations[priority=11]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          The issue verb is not idempotent: the second POST on an already ISSUED certificate is
          refused 409 ERR_INVALID_STATE because no ISSUED -> ISSUED transition exists, and
          Boat.version stays at 3 - a rejected action leaves no OCS bump behind.
        test_recipe:
          setup:
            - "One licensed measurer, one boat and one certificate already moved DRAFT -> ISSUED."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Owen Clay", email: "owen.clay@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_h1: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Mara Vance", email: "mara.vance@yc.test", measurer_license_id: "M-101" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_mea: $.data.id } }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-4410", boat_name: "Windward Rose", owner_member_id: "${m_h1}", boat_type: "MONOHULL", loa_meters: 11.3 }, as: Competitor, as_user_id: "${m_h1}", captures: { b_a: $.data.id, b_a_v: $.data.version } }
            - { call: "POST /regatta-ops/rating-certificates", payload: { boat_id: "${b_a}", rule_code: "TOD_PHRF", sail_area_m2: 68.0, hull_length_m: 11.0, displacement_kg: 5200, draft_m: 2.10, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z", expected_boat_version: "${b_a_v}" }, as: Measurer, as_user_id: "${m_mea}", captures: { c_a: $.data.id } }
            - { call: "POST /regatta-ops/rating-certificates/${c_a}/issue", payload: {}, as: Measurer, as_user_id: "${m_mea}" }
          trigger:
            - { call: "POST /regatta-ops/rating-certificates/${c_a}/issue", payload: {}, as: Measurer, as_user_id: "${m_mea}" }
          assert:
            - "the trigger call returns HTTP 409 with error_id ERR_INVALID_STATE"
            - "RatingCertificate.${c_a}.status == ISSUED and RatingCertificate.${c_a}.version == 2"
            - "RatingCertificate.${c_a}.supersedes_certificate_id == null"
            - "Boat.${b_a}.version == 3: the rejected issue added no version bump"

      - name: withdrawn_entry_cannot_be_accepted_or_withdrawn_again
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Entry.registration_status.terminal_states
          - validations[priority=11]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          WITHDRAWN is the terminal state of Entry.registration_status: both accept and a second
          withdraw are refused 409 ERR_INVALID_STATE by priority 11, before the accept endpoint's
          own priority-19, -25 and -27 checks could ever speak, and Entry.version stops at 2.
        test_recipe:
          setup:
            - "A regatta with the notice of race published, one boat with a DRAFT certificate and one SUBMITTED entry that has then been withdrawn by the chair."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Piers Holt", email: "piers.holt@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_ch: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Mara Vance", email: "mara.vance@yc.test", measurer_license_id: "M-101" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_mea: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Owen Clay", email: "owen.clay@yc.test", safety_course_expiry_utc: "2027-06-30T00:00:00Z" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_h1: $.data.id } }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-4410", boat_name: "Windward Rose", owner_member_id: "${m_h1}", boat_type: "MONOHULL", loa_meters: 11.3 }, as: Competitor, as_user_id: "${m_h1}", captures: { b_a: $.data.id, b_a_v: $.data.version } }
            - { call: "POST /regatta-ops/rating-certificates", payload: { boat_id: "${b_a}", rule_code: "TOD_PHRF", sail_area_m2: 68.0, hull_length_m: 11.0, displacement_kg: 5200, draft_m: 2.10, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z", expected_boat_version: "${b_a_v}" }, as: Measurer, as_user_id: "${m_mea}", captures: { c_a: $.data.id } }
            - { call: "POST /regatta-ops/regattas", payload: { name: "Autumn Handicap Series", host_club_name: "Harbor Yacht Club", scoring_system: "LOW_POINT", discard_policy: "NONE", handicap_basis: "PER_CERTIFICATE", planned_race_count: 6, fleet_minimum: 2, protest_time_limit_minutes: 90, jury_quorum_required: 2, safety_category: "CAT_4", series_start_utc: "2026-08-05T00:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { reg: $.data.id, reg_v1: $.data.version } }
            - { call: "POST /regatta-ops/race-documents", payload: { regatta_id: "${reg}", doc_type: "NOR", body_summary: "Notice of race revision 1", effective_utc: "2026-07-10T00:00:00Z", expected_regatta_version: "${reg_v1}" }, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/entries", payload: { regatta_id: "${reg}", boat_id: "${b_a}", certificate_id: "${c_a}", helm_member_id: "${m_h1}", declared_crew_count: 1 }, as: Competitor, as_user_id: "${m_h1}", captures: { e_a: $.data.id } }
            - { call: "POST /regatta-ops/entries/${e_a}/withdraw", payload: {}, as: RegattaChair, as_user_id: "${m_ch}" }
          trigger:
            - { call: "POST /regatta-ops/entries/${e_a}/accept", payload: {}, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/entries/${e_a}/withdraw", payload: {}, as: RegattaChair, as_user_id: "${m_ch}" }
          assert:
            - "trigger call 1 returns HTTP 409 with error_id ERR_INVALID_STATE"
            - "trigger call 2 returns HTTP 409 with error_id ERR_INVALID_STATE"
            - "Entry.${e_a}.registration_status == WITHDRAWN and Entry.${e_a}.version == 2"
            - "Entry.${e_a}.division_id == null: withdrawal kept the assignment field as it stood for audit"

      - name: division_confirm_under_effective_floor_returns_fleet_minimum_not_met
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Division.PROVISIONAL_to_CONFIRMED
          - validations[priority=30]
          - errors[ERR_FLEET_MINIMUM_NOT_MET]
        distinguishing_aspect: |
          The confirm floor is max(Division.min_entries, Regatta.fleet_minimum): a division created
          with min_entries 3 inside a regatta with fleet_minimum 2 needs three assigned entries and
          not two, so confirming on one assigned entry is 409 ERR_FLEET_MINIMUM_NOT_MET and
          Regatta.confirmed_division_count stays 0.
        test_recipe:
          setup:
            - "A regatta with fleet_minimum 2 and the notice of race published; one division with min_entries 3 covering 150.0-230.0 MONOHULL."
            - "One boat with an ISSUED certificate (band 171.3) submitted and assigned into that division, so assigned_entry_count is 1."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Piers Holt", email: "piers.holt@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_ch: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Mara Vance", email: "mara.vance@yc.test", measurer_license_id: "M-101" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_mea: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Owen Clay", email: "owen.clay@yc.test", safety_course_expiry_utc: "2027-06-30T00:00:00Z" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_h1: $.data.id } }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-4410", boat_name: "Windward Rose", owner_member_id: "${m_h1}", boat_type: "MONOHULL", loa_meters: 11.3 }, as: Competitor, as_user_id: "${m_h1}", captures: { b_a: $.data.id, b_a_v: $.data.version } }
            - { call: "POST /regatta-ops/rating-certificates", payload: { boat_id: "${b_a}", rule_code: "TOD_PHRF", sail_area_m2: 68.0, hull_length_m: 11.0, displacement_kg: 5200, draft_m: 2.10, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z", expected_boat_version: "${b_a_v}" }, as: Measurer, as_user_id: "${m_mea}", captures: { c_a: $.data.id } }
            - { call: "POST /regatta-ops/rating-certificates/${c_a}/issue", payload: {}, as: Measurer, as_user_id: "${m_mea}" }
