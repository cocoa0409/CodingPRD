          encumbrance is refused purely because the source's OWN period (not the current
          one) has left OPEN.
        test_recipe:
          setup:
            - "Two operating periods: P_OLD covering 2026-01-01..2026-03-31 and P_CUR covering 2026-04-01..2026-12-31; the 2026-05-01 clock makes P_CUR the current period, so the global write gate stays open."
            - "A funding source with 20000 cents budget sitting in P_OLD."
            - "One ACTIVE participant with a REQUESTED enrollment and a PROPOSED 3000-cent award drawn on that source; no cents have moved."
