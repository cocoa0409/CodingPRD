# SCAFFOLD_DIFFICULTY_DESIGN.yaml — task_2620_domain_name_dispute_resolution
# Test-targeting index for §0.5's nine Difficulty Rules. Every instance grounds only in
# elements already declared in SCAFFOLD.yaml §1.1-§1.7. Logical clock default 2026-08-01T00:00:00Z.
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: filing_fee_provisional_at_filing_vs_final_at_respondent_election
        grounds:
          - calculations.filing_fee_assessment
          - entities.Case.fields.fee_variant_applied
          - entities.Case.fields.assessed_fee_cents
          - entities.Case.fields.complainant_share_cents
          - entities.Case.fields.respondent_share_cents
          - entities.Case.fields.honoraria_pool_cents
          - state_machines.Case.COMMENCED_to_RESPONSE_RECEIVED
        distinguishing_aspect: |
          One Case row is assessed twice by the same calculation with no change to any input the
          complainant controls: variant PROVISIONAL_AT_FILING yields assessed_fee_cents 150000 /
          complainant_share_cents 150000 / respondent_share_cents 0 / honoraria_pool_cents 105000,
          and variant FINAL_AT_ELECTION - triggered solely by the respondent setting
          requests_three_member_panel true - yields 400000 / 275000 / 125000 / 280000, so the
          complainant's own share RISES by 125000 at the same moment a share is moved onto the
          respondent.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Registrar IANA-1001 ACTIVE with verification_response_hours 48; domain disputed.example registered under it."
            - "Complainant Marque SA (country_code FR) files a TRANSFER case on that domain with mutual_jurisdiction US and panel_election SINGLE."
            - "All three ComplaintGround rows present and SUFFICIENT; 150000 cents paid by COMPLAINANT."
            - "Compliance cleared by cm-002, registrar verification answered with lock_applied true, respondent notified by EMAIL and delivery recorded."
            - "Case is COMMENCED with required_seat_count 1 and fee_variant_applied PROVISIONAL."
          setup_api_calls:
            - call: "POST /udrp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAdmin
            - call: "POST /udrp/registrars"
              payload: { name: "Regis One", iana_id: "IANA-1001", contact_email: "abuse@regisone.example", verification_response_hours: 48 }
              as: ProviderAdmin
              captures: { reg_id: "$.data.id" }
            - call: "POST /udrp/domains"
              payload: { domain_name: "disputed.example", registrar_id: "${reg_id}", registrant_name_public: "Privacy Proxy", registrant_email_public: "proxy@privacy.example", registration_date: "2024-03-01T00:00:00Z", expiry_date: "2027-03-01T00:00:00Z" }
              as: ProviderAdmin
              captures: { dom_id: "$.data.id" }
            - call: "POST /udrp/complainants"
              payload: { legal_name: "Marque SA", country_code: "FR", email: "legal@marque.example" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { cpl_id: "$.data.id" }
            - call: "POST /udrp/cases"
              payload: { complainant_id: "${cpl_id}", domain_id: "${dom_id}", mutual_jurisdiction: "US", remedy_requested: "TRANSFER", panel_election: "SINGLE" }
              as: Complainant
              as_user_id: "${cpl_id}"
              captures: { case_id: "$.data.id", prov_assessed: "$.data.assessed_fee_cents", prov_variant: "$.data.fee_variant_applied" }
            - call: "POST /udrp/cases/${case_id}/grounds"
              payload: { ground_type: "TRADEMARK_RIGHTS", assertion_text: "MARQUE is a registered word mark in the EU and the domain is identical to it.", evidence_count: 3, mark_registration_number: "EU0181234", mark_jurisdiction: "EU", similarity_claim: "IDENTICAL" }
              as: Complainant
              as_user_id: "${cpl_id}"
            - call: "POST /udrp/cases/${case_id}/grounds"
              payload: { ground_type: "NO_LEGITIMATE_INTEREST", assertion_text: "The registrant has never been commonly known by the name and holds no licence.", evidence_count: 2 }
              as: Complainant
              as_user_id: "${cpl_id}"
            - call: "POST /udrp/cases/${case_id}/grounds"
              payload: { ground_type: "BAD_FAITH", assertion_text: "The domain was offered for sale to the complainant for far above out-of-pocket costs.", evidence_count: 4 }
              as: Complainant
              as_user_id: "${cpl_id}"
            - call: "POST /udrp/cases/${case_id}/fee-transactions"
              payload: { kind: "FILING_FEE", payer: "COMPLAINANT", amount_cents: 150000, reference: "WIRE-0001" }
              as: CaseManager
              as_user_id: "cm-001"
            - call: "POST /udrp/cases/${case_id}/compliance-clearance"
              payload: { reviewer_notes: "All three grounds pleaded and evidenced." }
              as: CaseManager
              as_user_id: "cm-002"
            - call: "GET /udrp/cases/${case_id}/registrar-verifications"
              payload: {}
              as: CaseManager
              as_user_id: "cm-002"
              captures: { ver_id: "$.data[0].id" }
            - call: "POST /udrp/cases/${case_id}/registrar-verifications/${ver_id}/response"
              payload: { lock_applied: true, verified_registrant_name: "Real Registrant", verified_registrant_email: "registrant@disputed.example", registrar_remarks: "Whois disclosed, transfer lock applied." }
              as: RegistrarAgent
              as_user_id: "${reg_id}"
            - call: "POST /udrp/cases/${case_id}/notifications"
              payload: { channel: "EMAIL", address: "registrant@disputed.example" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { notif_id: "$.data.id" }
            - call: "POST /udrp/cases/${case_id}/notifications/${notif_id}/delivery"
              payload: { outcome: "DELIVERED", deemed_received_at: "2026-08-01T00:00:00Z" }
              as: CaseManager
              as_user_id: "cm-001"
          trigger:
            - call: "GET /udrp/cases/${case_id}"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
              captures: { pre_assessed: "$.data.assessed_fee_cents", pre_variant: "$.data.fee_variant_applied" }
            - call: "POST /udrp/cases/${case_id}/responses"
              payload: { respondent_email: "registrant@disputed.example", content_summary: "The registrant elects a three-member panel and denies bad faith.", requests_three_member_panel: true }
              as: Respondent
              as_user_id: "resp-001"
            - call: "GET /udrp/cases/${case_id}"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
              captures: { post_assessed: "$.data.assessed_fee_cents", post_variant: "$.data.fee_variant_applied" }
          assert:
            - "Before the response: Case.${case_id}.fee_variant_applied == PROVISIONAL"
            - "Before the response: Case.${case_id}.assessed_fee_cents == 150000"
            - "Before the response: Case.${case_id}.complainant_share_cents == 150000"
            - "Before the response: Case.${case_id}.respondent_share_cents == 0"
            - "Before the response: Case.${case_id}.honoraria_pool_cents == 105000"
            - "Before the response: Case.${case_id}.required_seat_count == 1"
            - "After the response: Case.${case_id}.fee_variant_applied == FINAL"
            - "After the response: Case.${case_id}.assessed_fee_cents == 400000"
            - "After the response: Case.${case_id}.complainant_share_cents == 275000"
            - "After the response: Case.${case_id}.respondent_share_cents == 125000"
            - "After the response: Case.${case_id}.honoraria_pool_cents == 280000"
            - "After the response: Case.${case_id}.required_seat_count == 3"
            - "After the response: Case.${case_id}.respondent_panel_election == THREE"
            - "After the response: Case.${case_id}.status == RESPONSE_RECEIVED"
            - "The delta on the complainant's own share is exactly 275000 - 150000 == 125000, and the delta on the assessed total is exactly 250000"
            - "Case.${case_id}.paid_cents == 150000, so paid_cents < assessed_fee_cents and the next POST /udrp/cases/${case_id}/appointments must fail with ERR_PANEL_SUPPLEMENT_UNPAID (402)"

      - name: response_deadline_provisional_at_dispatch_vs_final_at_delivery_moves_backwards
        grounds:
          - calculations.response_deadline_projection
          - entities.Case.fields.provisional_response_due_at
          - entities.Case.fields.response_due_at
          - entities.Case.fields.deadline_variant_applied
          - entities.RespondentNotification.fields.transmission_allowance_days
          - state_machines.RespondentNotification.SENT_to_DELIVERED
        distinguishing_aspect: |
          The second variant of this calculation moves a deadline EARLIER, not later: a POSTAL
          notification dispatched 2026-08-05T00:00:00Z projects provisional_response_due_at
          2026-08-30T00:00:00Z from the channel's 5-day transmission allowance, and recording actual
          receipt on 2026-08-07T00:00:00Z re-anchors response_due_at to 2026-08-27T00:00:00Z - three
          days sooner - while provisional_response_due_at is retained unchanged on the same row, so
          both variants stay observable on the one row and the final value is provably not clamped
          to the provisional one.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z for setup, advanced to 2026-08-05T00:00:00Z before dispatch."
            - "Registrar IANA-2002 ACTIVE; domain postalcase.example under it."
            - "Complainant Nordwind GmbH (country_code FR) files a CANCELLATION case, mutual_jurisdiction US."
            - "All three grounds SUFFICIENT, 150000 cents paid by COMPLAINANT, compliance cleared by cm-002, verification answered with lock_applied true."
            - "Case is NOTIFICATION_PENDING with the domain LOCKED."
          setup_api_calls:
            - call: "POST /udrp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAdmin
            - call: "POST /udrp/registrars"
              payload: { name: "Regis Two", iana_id: "IANA-2002", contact_email: "abuse@registwo.example", verification_response_hours: 72 }
              as: ProviderAdmin
              captures: { reg_id: "$.data.id" }
            - call: "POST /udrp/domains"
              payload: { domain_name: "postalcase.example", registrar_id: "${reg_id}", registrant_name_public: "Hidden Holder", registrant_email_public: "hidden@proxy.example", registration_date: "2023-11-20T00:00:00Z", expiry_date: "2026-11-20T00:00:00Z" }
              as: ProviderAdmin
              captures: { dom_id: "$.data.id" }
            - call: "POST /udrp/complainants"
              payload: { legal_name: "Nordwind GmbH", country_code: "FR", email: "ip@nordwind.example" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { cpl_id: "$.data.id" }
            - call: "POST /udrp/cases"
              payload: { complainant_id: "${cpl_id}", domain_id: "${dom_id}", mutual_jurisdiction: "US", remedy_requested: "CANCELLATION", panel_election: "SINGLE" }
              as: Complainant
              as_user_id: "${cpl_id}"
              captures: { case_id: "$.data.id" }
            - call: "POST /udrp/cases/${case_id}/grounds"
              payload: { ground_type: "TRADEMARK_RIGHTS", assertion_text: "NORDWIND is a registered mark and the domain is confusingly similar.", evidence_count: 2, similarity_claim: "CONFUSINGLY_SIMILAR" }
              as: Complainant
              as_user_id: "${cpl_id}"
            - call: "POST /udrp/cases/${case_id}/grounds"
              payload: { ground_type: "NO_LEGITIMATE_INTEREST", assertion_text: "No licence, no trade name, no bona fide offering at the domain.", evidence_count: 1 }
              as: Complainant
              as_user_id: "${cpl_id}"
            - call: "POST /udrp/cases/${case_id}/grounds"
              payload: { ground_type: "BAD_FAITH", assertion_text: "The site redirects to a competitor storefront for commercial gain.", evidence_count: 3 }
              as: Complainant
              as_user_id: "${cpl_id}"
            - call: "POST /udrp/cases/${case_id}/fee-transactions"
              payload: { kind: "FILING_FEE", payer: "COMPLAINANT", amount_cents: 150000, reference: "WIRE-0002" }
              as: CaseManager
              as_user_id: "cm-001"
            - call: "POST /udrp/cases/${case_id}/compliance-clearance"
              payload: { reviewer_notes: "Complete on the face of the record." }
              as: CaseManager
              as_user_id: "cm-002"
            - call: "GET /udrp/cases/${case_id}/registrar-verifications"
              payload: {}
              as: CaseManager
              as_user_id: "cm-002"
              captures: { ver_id: "$.data[0].id" }
            - call: "POST /udrp/cases/${case_id}/registrar-verifications/${ver_id}/response"
              payload: { lock_applied: true, verified_registrant_name: "Postal Registrant", verified_registrant_email: "registrant@postalcase.example", registrar_remarks: "No email of record, postal address only." }
              as: RegistrarAgent
              as_user_id: "${reg_id}"
            - call: "POST /udrp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: ProviderAdmin
          trigger:
            - call: "POST /udrp/cases/${case_id}/notifications"
              payload: { channel: "POSTAL", address: "12 Rue Cachee, 75001 Paris, FR" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { notif_id: "$.data.id", allowance: "$.data.transmission_allowance_days" }
            - call: "GET /udrp/cases/${case_id}"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
              captures: { prov_due: "$.data.provisional_response_due_at", prov_operative: "$.data.response_due_at", prov_variant: "$.data.deadline_variant_applied" }
            - call: "POST /udrp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-07T00:00:00Z" }
              as: ProviderAdmin
            - call: "POST /udrp/cases/${case_id}/notifications/${notif_id}/delivery"
              payload: { outcome: "DELIVERED", deemed_received_at: "2026-08-07T00:00:00Z" }
              as: CaseManager
              as_user_id: "cm-001"
            - call: "GET /udrp/cases/${case_id}"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
              captures: { final_due: "$.data.provisional_response_due_at", final_operative: "$.data.response_due_at", final_variant: "$.data.deadline_variant_applied" }
          assert:
            - "RespondentNotification.${notif_id}.transmission_allowance_days == 5"
            - "RespondentNotification.${notif_id}.dispatched_at == 2026-08-05T00:00:00Z"
            - "After dispatch: Case.${case_id}.provisional_response_due_at == 2026-08-30T00:00:00Z"
            - "After dispatch: Case.${case_id}.response_due_at == 2026-08-30T00:00:00Z"
            - "After dispatch: Case.${case_id}.deadline_variant_applied == PROVISIONAL"
            - "After dispatch: Case.${case_id}.status == COMMENCED and Case.${case_id}.commenced_at == 2026-08-05T00:00:00Z"
            - "After the DELIVERED outcome: Case.${case_id}.response_due_at == 2026-08-27T00:00:00Z"
            - "After the DELIVERED outcome: Case.${case_id}.deadline_variant_applied == FINAL"
            - "After the DELIVERED outcome: Case.${case_id}.provisional_response_due_at is still 2026-08-30T00:00:00Z, unchanged"
            - "The final deadline is 3 days EARLIER than the provisional one, proving no clamp to max(provisional, final)"
            - "RespondentNotification.${notif_id}.status == DELIVERED and deemed_received_at == 2026-08-07T00:00:00Z"

      - name: panel_outcome_strict_majority_vs_presiding_casting_on_three_way_split
        grounds:
          - calculations.panel_outcome_tally
          - calculations.filing_fee_assessment
          - calculations.panelist_honoraria_allocation
          - entities.Decision.fields.outcome
          - entities.Decision.fields.outcome_basis
          - entities.Decision.fields.dissent_present
          - entities.PanelVote.fields.vote
          - state_machines.Case.PANEL_CONSTITUTED_to_IMPLEMENTATION_WAITING
        distinguishing_aspect: |
          A three-member panel casts one TRANSFER, one CANCELLATION and one DENY vote, so
          leader_count is 1 and 1*2 > 3 is false: variant STRICT_MAJORITY has no answer at all and
          variant PRESIDING_CASTING resolves the case to the PRESIDING seat's own vote, giving
          Decision.outcome CANCELLATION with outcome_basis PRESIDING_CASTING while
          transfer_votes == cancellation_votes == deny_votes == 1 - the two co-panelists' votes have
          demonstrably zero effect on the outcome.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z throughout."
            - "Registrar IANA-3003 ACTIVE; domain splitpanel.example under it."
            - "Complainant Trois SARL (country_code FR), mutual_jurisdiction US, remedy TRANSFER, panel_election SINGLE at filing."
            - "150000 paid by COMPLAINANT, compliance cleared by cm-002, verification answered lock_applied true, EMAIL notification delivered."
            - "Respondent files a response electing a three-member panel, so required_seat_count becomes 3 and assessed_fee_cents 400000."
            - "The complainant tops up 125000 and the respondent pays its 125000 supplement, so paid_cents reaches 400000."
            - "Three panelists (DE, IT, ES) are nominated to PRESIDING, CO_PANELIST_1 and CO_PANELIST_2 and all three screen clean, constituting the panel."
          setup_api_calls:
            - call: "POST /udrp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAdmin
            - call: "POST /udrp/registrars"
              payload: { name: "Regis Three", iana_id: "IANA-3003", contact_email: "abuse@registhree.example", verification_response_hours: 48 }
              as: ProviderAdmin
              captures: { reg_id: "$.data.id" }
            - call: "POST /udrp/domains"
              payload: { domain_name: "splitpanel.example", registrar_id: "${reg_id}", registrant_name_public: "Split Holder", registrant_email_public: "holder@proxy.example", registration_date: "2022-06-01T00:00:00Z", expiry_date: "2027-06-01T00:00:00Z" }
              as: ProviderAdmin
              captures: { dom_id: "$.data.id" }
            - call: "POST /udrp/complainants"
              payload: { legal_name: "Trois SARL", country_code: "FR", email: "ip@trois.example" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { cpl_id: "$.data.id" }
            - call: "POST /udrp/cases"
              payload: { complainant_id: "${cpl_id}", domain_id: "${dom_id}", mutual_jurisdiction: "US", remedy_requested: "TRANSFER", panel_election: "SINGLE" }
              as: Complainant
              as_user_id: "${cpl_id}"
              captures: { case_id: "$.data.id" }
            - call: "POST /udrp/cases/${case_id}/grounds"
              payload: { ground_type: "TRADEMARK_RIGHTS", assertion_text: "TROIS is registered in France and the EU for retail services.", evidence_count: 3, mark_registration_number: "FR3311", mark_jurisdiction: "FR", similarity_claim: "IDENTICAL" }
              as: Complainant
              as_user_id: "${cpl_id}"
            - call: "POST /udrp/cases/${case_id}/grounds"
              payload: { ground_type: "NO_LEGITIMATE_INTEREST", assertion_text: "The registrant is not commonly known by the disputed string.", evidence_count: 2 }
              as: Complainant
              as_user_id: "${cpl_id}"
            - call: "POST /udrp/cases/${case_id}/grounds"
              payload: { ground_type: "BAD_FAITH", assertion_text: "A pattern of eleven prior abusive registrations is shown.", evidence_count: 5 }
              as: Complainant
              as_user_id: "${cpl_id}"
            - call: "POST /udrp/cases/${case_id}/fee-transactions"
              payload: { kind: "FILING_FEE", payer: "COMPLAINANT", amount_cents: 150000, reference: "WIRE-0003" }
              as: CaseManager
              as_user_id: "cm-001"
            - call: "POST /udrp/cases/${case_id}/compliance-clearance"
              payload: { reviewer_notes: "Compliant." }
              as: CaseManager
              as_user_id: "cm-002"
            - call: "GET /udrp/cases/${case_id}/registrar-verifications"
              payload: {}
              as: CaseManager
              as_user_id: "cm-002"
              captures: { ver_id: "$.data[0].id" }
            - call: "POST /udrp/cases/${case_id}/registrar-verifications/${ver_id}/response"
              payload: { lock_applied: true, verified_registrant_name: "Split Registrant", verified_registrant_email: "registrant@splitpanel.example" }
              as: RegistrarAgent
              as_user_id: "${reg_id}"
            - call: "POST /udrp/cases/${case_id}/notifications"
              payload: { channel: "EMAIL", address: "registrant@splitpanel.example" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { notif_id: "$.data.id" }
            - call: "POST /udrp/cases/${case_id}/notifications/${notif_id}/delivery"
              payload: { outcome: "DELIVERED", deemed_received_at: "2026-08-01T00:00:00Z" }
              as: CaseManager
              as_user_id: "cm-001"
            - call: "POST /udrp/cases/${case_id}/responses"
              payload: { respondent_email: "registrant@splitpanel.example", content_summary: "The respondent elects a three-member panel and contests all three grounds.", requests_three_member_panel: true }
              as: Respondent
              as_user_id: "resp-001"
            - call: "POST /udrp/cases/${case_id}/fee-transactions"
              payload: { kind: "FILING_FEE", payer: "COMPLAINANT", amount_cents: 125000, reference: "WIRE-0003-TOPUP" }
