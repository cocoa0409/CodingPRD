        distinguishing_aspect: "A three-hour interval submitted with only two hourly volumes is refused with 422 ERR_BATCH_INTERVAL_MISMATCH and no InjectionBatch row is created."
        test_recipe:
          setup: ["One LandfillSite and one ProcessingPlant."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectAdmin
            - call: "POST /sites"
              payload: { name: "Rolling Hills Landfill", state_code: "CA", host_royalty_pct: 0.12, royalty_variant: "GROSS_REVENUE_SHARE", permit_nmoc_limit_lb_per_hr: 3.5 }
              as: ProjectAdmin
              captures: { site_id: $.data.id }
            - call: "POST /plants"
              payload: { site_id: "${site_id}", plant_code: "P1", receipt_point_code: "RP-7", receipt_point_mdq_dth_per_day: 4800.0, min_feed_scfm: 900.0 }
              as: ProjectAdmin
              captures: { plant_id: $.data.id }
          trigger:
            - call: "POST /injection-batches"
              payload: { plant_id: "${plant_id}", interval_start: "2026-08-10T02:00:00Z", interval_end: "2026-08-10T05:00:00Z", hourly_volumes_mscf: [115.0, 115.0], methane_pct: 97.4, oxygen_pct: 0.1, co2_pct: 1.4 }
