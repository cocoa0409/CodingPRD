            - { call: "POST /closeout/punch-walks", payload: { project_id: "${pa}", trade_package_id: "${ta}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: GCProjectManager, captures: { wa: $.data.id } }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks/${wa}/complete", as: GCInspector }
            - { call: "POST /closeout/punch-items", payload: { project_id: "${pa}", trade_package_id: "${ta}", title: "Paint", severity: "MINOR", location_building: "B1", location_floor: "L2", location_area: "R201", photo_ref: "img-1" }, as: GCInspector, captures: { it: $.data.id } }
            - { call: "POST /closeout/projects/${pa}/request-sc-review", as: GCProjectManager }
            - { call: "POST /closeout/projects/${pa}/determine-substantial-completion", payload: { approved: true }, as: OwnerRep }
