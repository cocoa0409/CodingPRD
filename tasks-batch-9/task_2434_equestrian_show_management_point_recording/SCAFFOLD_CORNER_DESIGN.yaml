              captures: { ring_v_snapshot: $.data.version }
          trigger:
            - call: "POST /ring-slots"
              payload: { ring_id: "${ring_a_id}", class_id: "${class101_id}", start_utc: "2026-09-10T14:00:00Z", expected_ring_version: "${ring_v_snapshot}" }
              as: RingMaster
