scaffold_corner_design:
  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_member_success_defaults_basic
        claim_type: Defaults
        grounds: [entities.Member.membership_tier, entities.Member.join_fee_cents]
        distinguishing_aspect: "Registering without membership_tier applies default BASIC and join_fee_cents=3000; membership_status starts PENDING."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /coop/members"
              payload: { email: "def@x.com", full_name: "Default Member" }
              as: Anonymous
              captures: { m_id: $.data.id, tier: $.data.membership_tier, fee: $.data.join_fee_cents, st: $.data.membership_status }
          assert:
            - "Member.${m_id}.membership_tier == BASIC"
            - "Member.${m_id}.join_fee_cents == 3000"
            - "Member.${m_id}.membership_status == PENDING"

      - name: create_member_premier_join_fee
        claim_type: Creation
        grounds: [entities.Member.membership_tier, entities.Member.join_fee_cents]
        distinguishing_aspect: "Registering with membership_tier=PREMIER pins join_fee_cents=12000."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /coop/members"
              payload: { email: "prem@x.com", full_name: "Premier Member", membership_tier: "PREMIER" }
              as: Anonymous
              captures: { m_id: $.data.id, fee: $.data.join_fee_cents }
          assert:
            - "Member.${m_id}.join_fee_cents == 12000"

      - name: member_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_MEMBER_NOT_FOUND]"]
        distinguishing_aspect: "GET a non-existent member id returns ERR_MEMBER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /coop/members/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CoopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_MEMBER_NOT_FOUND"
            - "HTTP status == 404"

      - name: product_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds: ["errors[ERR_VALIDATION]", entities.Product.sku]
        distinguishing_aspect: "Creating a product without the required sku field returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /coop/products"
              payload: { name: "No SKU", category: "TENT", retail_price_cents: 1000, tax_rate: 0.05, replacement_value_cents: 2000 }
              as: CoopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"
            - "HTTP status == 400"

      - name: rental_unit_reverse_reachable_by_product
        claim_type: Retrieval
        grounds: [entities.RentalUnit.product_id]
        distinguishing_aspect: "GET /coop/rental-units?product_id=... returns the units created for that product (FK reverse-reachability)."
        test_recipe:
          setup: ["A rentable product with one unit."]
          setup_api_calls:
            - call: "POST /coop/products"
              payload: { sku: "RR-TENT", name: "RR Tent", category: "TENT", retail_price_cents: 90000, tax_rate: 0.05, replacement_value_cents: 100000, is_rentable: true, base_daily_rate_cents: 3000 }
              as: CoopAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /coop/rental-units"
              payload: { product_id: "${prod_id}", asset_tag: "RR-001" }
              as: CoopAdmin
              captures: { unit_id: $.data.id }
          trigger:
            - call: "GET /coop/rental-units?product_id=${prod_id}"
              payload: {}
              as: CoopAdmin
          assert:
            - "GET /coop/rental-units?product_id=${prod_id} returns total_count == 1 with data[0].id == ${unit_id}"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: cancel_reservation_from_cancelled_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.RentalReservation.RESERVED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling an already-CANCELLED reservation returns ERR_INVALID_STATE; no further side effects."
        test_recipe:
          setup: ["Clock 2026-07-01; ACTIVE member; rentable product with one unit; a reservation already CANCELLED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/products"
              payload: { sku: "IC-TENT", name: "IC Tent", category: "TENT", retail_price_cents: 90000, tax_rate: 0.05, replacement_value_cents: 100000, is_rentable: true, base_daily_rate_cents: 3000 }
              as: CoopAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /coop/rental-units"
              payload: { product_id: "${prod_id}", asset_tag: "IC-001" }
              as: CoopAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /coop/members"
              payload: { email: "ic@x.com", full_name: "IC Member" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: StoreStaff
            - call: "POST /coop/reservations"
              payload: { member_id: "${m_id}", rental_unit_id: "${unit_id}", start_date: "2026-07-10T00:00:00Z", end_date: "2026-07-12T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { res_id: $.data.id }
            - call: "POST /coop/reservations/${res_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /coop/reservations/${res_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: tradein_accept_from_submitted_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.TradeIn.OFFERED_to_ACCEPTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Accepting a trade-in still in SUBMITTED (no offer yet) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE member; product; a SUBMITTED trade-in (never offered)."]
          setup_api_calls:
            - call: "POST /coop/products"
              payload: { sku: "TA-AXE", name: "TA Axe", category: "CLIMBING", retail_price_cents: 80000, tax_rate: 0.05, replacement_value_cents: 90000 }
              as: CoopAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /coop/members"
              payload: { email: "ta@x.com", full_name: "TA Member" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: StoreStaff
            - call: "POST /coop/trade-ins"
              payload: { member_id: "${m_id}", product_id: "${prod_id}", condition_grade: "A" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ti_id: $.data.id }
          trigger:
            - call: "POST /coop/trade-ins/${ti_id}/accept"
              payload: { accepted_payout_type: "CASH" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: tradein_counter_exceeds_max_rounds_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.TradeIn.OFFERED_to_COUNTERED, "errors[ERR_TRADE_IN_ROUNDS_EXCEEDED]"]
        distinguishing_aspect: "After MAX_TRADE_IN_ROUNDS=3 completed counters, a 4th counter is rejected with ERR_TRADE_IN_ROUNDS_EXCEEDED."
        test_recipe:
          setup: ["ACTIVE member; product; a trade-in that has looped offer/counter three times (rounds=3), currently OFFERED."]
          setup_api_calls:
            - call: "POST /coop/products"
              payload: { sku: "TR-ROPE", name: "TR Rope", category: "CLIMBING", retail_price_cents: 60000, tax_rate: 0.05, replacement_value_cents: 70000 }
              as: CoopAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /coop/members"
              payload: { email: "tr@x.com", full_name: "TR Member" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: StoreStaff
            - call: "POST /coop/trade-ins"
              payload: { member_id: "${m_id}", product_id: "${prod_id}", condition_grade: "B" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ti_id: $.data.id }
            - call: "POST /coop/trade-ins/${ti_id}/offer"
              payload: {}
              as: StoreStaff
            - call: "POST /coop/trade-ins/${ti_id}/counter"
              payload: { counter_ask_cents: 30000 }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /coop/trade-ins/${ti_id}/offer"
              payload: {}
              as: StoreStaff
            - call: "POST /coop/trade-ins/${ti_id}/counter"
              payload: { counter_ask_cents: 31000 }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /coop/trade-ins/${ti_id}/offer"
              payload: {}
              as: StoreStaff
            - call: "POST /coop/trade-ins/${ti_id}/counter"
              payload: { counter_ask_cents: 32000 }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /coop/trade-ins/${ti_id}/offer"
              payload: {}
              as: StoreStaff
          trigger:
            - call: "POST /coop/trade-ins/${ti_id}/counter"
              payload: { counter_ask_cents: 33000 }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_TRADE_IN_ROUNDS_EXCEEDED"
            - "HTTP status == 409"

      - name: repair_pickup_before_settled_returns_repair_unsettled
        claim_type: Precondition Enforcement
        grounds: [state_machines.RepairOrder.READY_to_PICKED_UP, "errors[ERR_REPAIR_UNSETTLED]"]
        distinguishing_aspect: "Picking up a READY repair whose billed_cents>0 while billing_stage != SETTLED returns ERR_REPAIR_UNSETTLED."
        test_recipe:
          setup: ["Clock 2026-07-01; ACTIVE member; product; a repair diagnosed out-of-warranty (billed 5000), started (INVOICED), and marked READY, but not settled."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/products"
              payload: { sku: "RU-STOVE", name: "RU Stove", category: "COOKING", retail_price_cents: 40000, tax_rate: 0.05, replacement_value_cents: 45000 }
              as: CoopAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /coop/members"
              payload: { email: "ru@x.com", full_name: "RU Member" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: StoreStaff
            - call: "POST /coop/repair-orders"
              payload: { member_id: "${m_id}", product_id: "${prod_id}", purchase_date: "2019-01-01T00:00:00Z" }
              as: StoreStaff
              captures: { ro_id: $.data.id }
            - call: "POST /coop/repair-orders/${ro_id}/diagnose"
              payload: { labor_cents: 5000, parts_cents: 0 }
              as: StoreStaff
            - call: "POST /coop/repair-orders/${ro_id}/start"
              payload: {}
              as: StoreStaff
            - call: "POST /coop/repair-orders/${ro_id}/ready"
              payload: {}
              as: StoreStaff
          trigger:
            - call: "POST /coop/repair-orders/${ro_id}/pickup"
              payload: {}
              as: StoreStaff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_REPAIR_UNSETTLED"
            - "HTTP status == 409"

      - name: member_activate_from_active_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.Member.PENDING_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Activating an already-ACTIVE member returns ERR_INVALID_STATE (activate is not idempotent)."
        test_recipe:
          setup: ["An ACTIVE member."]
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { email: "ac@x.com", full_name: "AC Member" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: StoreStaff
          trigger:
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: StoreStaff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: special_order_confirm_from_requested_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.SpecialOrder.QUOTED_to_CONFIRMED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Confirming a special order still in REQUESTED (no quote yet) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE member; product; a REQUESTED special order (never quoted)."]
          setup_api_calls:
            - call: "POST /coop/products"
              payload: { sku: "SC-BOOT", name: "SC Boot", category: "APPAREL", retail_price_cents: 50000, tax_rate: 0.05, replacement_value_cents: 55000 }
              as: CoopAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /coop/members"
              payload: { email: "sc@x.com", full_name: "SC Member" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: StoreStaff
            - call: "POST /coop/special-orders"
              payload: { member_id: "${m_id}", product_id: "${prod_id}", quantity: 1 }
              as: Member
              as_user_id: "${m_id}"
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /coop/special-orders/${so_id}/confirm"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

  # =========================================================================
  # Validations
  # =========================================================================
  - section: validations
    instances:
      - name: reservation_invalid_interval_returns_422
        claim_type: Violation → Error
        grounds: ["validations[priority=6]", "errors[ERR_INVALID_INTERVAL]"]
        distinguishing_aspect: "A reservation with end_date <= start_date returns ERR_INVALID_INTERVAL (422)."
        test_recipe:
          setup: ["Clock 2026-07-01; ACTIVE member; rentable product with one unit."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/products"
              payload: { sku: "II-TENT", name: "II Tent", category: "TENT", retail_price_cents: 90000, tax_rate: 0.05, replacement_value_cents: 100000, is_rentable: true, base_daily_rate_cents: 3000 }
              as: CoopAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /coop/rental-units"
              payload: { product_id: "${prod_id}", asset_tag: "II-001" }
              as: CoopAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /coop/members"
              payload: { email: "ii@x.com", full_name: "II Member" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: StoreStaff
          trigger:
            - call: "POST /coop/reservations"
              payload: { member_id: "${m_id}", rental_unit_id: "${unit_id}", start_date: "2026-07-10T00:00:00Z", end_date: "2026-07-08T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_INTERVAL"
            - "HTTP status == 422"

      - name: special_order_invalid_quantity_returns_422
        claim_type: Violation → Error
        grounds: ["validations[priority=7]", "errors[ERR_INVALID_QUANTITY]"]
        distinguishing_aspect: "A special order with quantity 0 returns ERR_INVALID_QUANTITY (422)."
        test_recipe:
          setup: ["ACTIVE member; product."]
          setup_api_calls:
            - call: "POST /coop/products"
              payload: { sku: "IQ-BOOT", name: "IQ Boot", category: "APPAREL", retail_price_cents: 50000, tax_rate: 0.05, replacement_value_cents: 55000 }
              as: CoopAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /coop/members"
              payload: { email: "iq@x.com", full_name: "IQ Member" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: StoreStaff
          trigger:
            - call: "POST /coop/special-orders"
              payload: { member_id: "${m_id}", product_id: "${prod_id}", quantity: 0 }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_QUANTITY"
            - "HTTP status == 422"

  # =========================================================================
  # Errors
  # =========================================================================
  - section: errors
    instances:
      - name: purchase_insufficient_points_returns_402
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_INSUFFICIENT_POINTS]"]
        distinguishing_aspect: "A purchase redeeming more points than the member's loyalty_points_balance returns ERR_INSUFFICIENT_POINTS (402)."
        test_recipe:
          setup: ["ACTIVE member with 0 loyalty points; a product."]
          setup_api_calls:
            - call: "POST /coop/products"
              payload: { sku: "IP-CUP", name: "IP Cup", category: "COOKING", retail_price_cents: 5000, tax_rate: 0.05, replacement_value_cents: 6000 }
              as: CoopAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /coop/members"
              payload: { email: "ip@x.com", full_name: "IP Member" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: StoreStaff
          trigger:
            - call: "POST /coop/purchases"
              payload: { member_id: "${m_id}", line_items: [ { product_id: "${prod_id}", quantity: 1, unit_price_cents: 5000 } ], points_redeemed: 100 }
              as: StoreStaff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INSUFFICIENT_POINTS"
            - "HTTP status == 402"

      - name: special_order_confirm_insufficient_wallet_returns_402
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_INSUFFICIENT_WALLET]", calculations.special_order_deposit]
        distinguishing_aspect: "Confirming a quoted special order when wallet_credit_cents (0) is below deposit floor(50000*0.20)=10000 returns ERR_INSUFFICIENT_WALLET (402)."
        test_recipe:
          setup: ["ACTIVE member with 0 wallet credit; a special order quoted at 50000 (QUOTED)."]
          setup_api_calls:
            - call: "POST /coop/products"
              payload: { sku: "IW-BOOT", name: "IW Boot", category: "APPAREL", retail_price_cents: 50000, tax_rate: 0.05, replacement_value_cents: 55000 }
              as: CoopAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /coop/members"
              payload: { email: "iw@x.com", full_name: "IW Member" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: StoreStaff
            - call: "POST /coop/special-orders"
              payload: { member_id: "${m_id}", product_id: "${prod_id}", quantity: 1 }
              as: Member
              as_user_id: "${m_id}"
              captures: { so_id: $.data.id, so_v0: $.data.version }
            - call: "POST /coop/special-orders/${so_id}/quotes"
              payload: { quoted_price_cents: 50000, expected_special_order_version: "${so_v0}" }
              as: StoreStaff
          trigger:
            - call: "POST /coop/special-orders/${so_id}/confirm"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INSUFFICIENT_WALLET"
            - "HTTP status == 402"

      - name: assign_guide_guide_not_found_returns_404
        claim_type: violation_to_error
        grounds: ["errors[ERR_GUIDE_NOT_FOUND]"]
        distinguishing_aspect: "Assigning a non-existent guide id to a trip returns ERR_GUIDE_NOT_FOUND (404)."
        test_recipe:
          setup: ["A DRAFT trip."]
          setup_api_calls:
            - call: "POST /coop/trips"
              payload: { title: "GN Trip", start_time: "2026-08-05T09:00:00Z", end_time: "2026-08-05T17:00:00Z", capacity: 3, price_cents: 4000, required_certification: "NONE" }
              as: CoopAdmin
              captures: { trip_id: $.data.id }
          trigger:
            - call: "POST /coop/trips/${trip_id}/assign-guide"
              payload: { guide_id: "00000000-0000-0000-0000-000000000000" }
              as: CoopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_GUIDE_NOT_FOUND"
            - "HTTP status == 404"

  # =========================================================================
  # RBAC
  # =========================================================================
  - section: rbac
    instances:
      - name: member_cannot_create_product_forbidden
        claim_type: exclusive_denied
        grounds: [roles.Member, roles.CoopAdmin, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A Member calling POST /coop/products (CoopAdmin-exclusive) is denied with ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["An ACTIVE member."]
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { email: "rb@x.com", full_name: "RB Member" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: StoreStaff
          trigger:
            - call: "POST /coop/products"
              payload: { sku: "RB-TENT", name: "RB Tent", category: "TENT", retail_price_cents: 1000, tax_rate: 0.05, replacement_value_cents: 2000 }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED"
            - "HTTP status == 403"

      - name: staff_cannot_finalize_dividend_forbidden
        claim_type: exclusive_denied
        grounds: [roles.StoreStaff, roles.CoopAdmin, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "StoreStaff calling POST /coop/dividend-declarations/{id}/finalize (CoopAdmin-exclusive) is denied with ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["A DRAFT dividend declaration for 2026."]
          setup_api_calls:
            - call: "POST /coop/dividend-declarations"
              payload: { year: 2026, declared_rate: 0.08 }
              as: CoopAdmin
              captures: { decl_id: $.data.id }
          trigger:
            - call: "POST /coop/dividend-declarations/${decl_id}/finalize"
              payload: {}
              as: StoreStaff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED"
            - "HTTP status == 403"

  # =========================================================================
  # Cross-Cutting Complexity Layers
  # =========================================================================
  - section: cross_cutting
    instances:
      - name: special_order_requote_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[special-order-requote-stale]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A second quote carrying the pre-first-quote SpecialOrder.version (stale) is rejected with ERR_STALE_VERSION (412); the first quote advanced version so the stale re-quote fails."
        test_recipe:
          setup: ["ACTIVE member; product; a REQUESTED special order (version captured); a first successful quote that advanced the version."]
          setup_api_calls:
            - call: "POST /coop/products"
              payload: { sku: "OC-BOOT", name: "OC Boot", category: "APPAREL", retail_price_cents: 50000, tax_rate: 0.05, replacement_value_cents: 55000 }
              as: CoopAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /coop/members"
              payload: { email: "oc@x.com", full_name: "OC Member" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: StoreStaff
            - call: "POST /coop/special-orders"
              payload: { member_id: "${m_id}", product_id: "${prod_id}", quantity: 1 }
              as: Member
              as_user_id: "${m_id}"
              captures: { so_id: $.data.id, so_v0: $.data.version }
            - call: "POST /coop/special-orders/${so_id}/quotes"
              payload: { quoted_price_cents: 50000, expected_special_order_version: "${so_v0}" }
              as: StoreStaff
          trigger:
            - call: "POST /coop/special-orders/${so_id}/quotes"
              payload: { quoted_price_cents: 52000, expected_special_order_version: "${so_v0}" }
              as: StoreStaff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION"
            - "HTTP status == 412"

      - name: wallet_credited_on_tradein_credit_accept
        claim_type: derived_field_reconciliation
        grounds: [state_machines.TradeIn.OFFERED_to_ACCEPTED, entities.Member.wallet_credit_cents]
        distinguishing_aspect: "Accepting a grade-A trade-in with payout CREDIT (offered_credit_cents=50000) raises Member.wallet_credit_cents from 0 to 50000."
        test_recipe:
          setup: ["ACTIVE member with 0 wallet; product retail 100000; a trade-in grade A advanced to OFFERED."]
          setup_api_calls:
            - call: "POST /coop/products"
              payload: { sku: "WC-AXE", name: "WC Axe", category: "CLIMBING", retail_price_cents: 100000, tax_rate: 0.05, replacement_value_cents: 120000 }
              as: CoopAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /coop/members"
              payload: { email: "wc@x.com", full_name: "WC Member" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: StoreStaff
            - call: "POST /coop/trade-ins"
              payload: { member_id: "${m_id}", product_id: "${prod_id}", condition_grade: "A" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ti_id: $.data.id }
            - call: "POST /coop/trade-ins/${ti_id}/offer"
              payload: {}
              as: StoreStaff
          trigger:
            - call: "POST /coop/trade-ins/${ti_id}/accept"
              payload: { accepted_payout_type: "CREDIT" }
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "TradeIn.${ti_id}.accepted_payout_cents == 50000"
            - "Member.${m_id}.wallet_credit_cents == 50000"

  # =========================================================================
  # Endpoints
  # =========================================================================
  - section: endpoints
    instances:
      - name: members_list_pagination_has_more
        claim_type: Listing
        grounds: [endpoints]
        distinguishing_aspect: "With two members registered, GET /coop/members?limit=1 returns one row, total_count=2, has_more=true."
        test_recipe:
          setup: ["Two registered members."]
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { email: "pg1@x.com", full_name: "PG One" }
              as: Anonymous
            - call: "POST /coop/members"
              payload: { email: "pg2@x.com", full_name: "PG Two" }
              as: Anonymous
          trigger:
            - call: "GET /coop/members?limit=1"
              payload: {}
              as: CoopAdmin
          assert:
            - "response data length == 1"
            - "response total_count == 2"
            - "response has_more == true"

  # =========================================================================
  # Consistency Model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: reservation_immediately_readable
        claim_type: immediate
        grounds: [endpoints]
        distinguishing_aspect: "A created reservation is immediately readable via GET /coop/reservations/{id} in the same session with matching rental_fee_cents."
        test_recipe:
          setup: ["Clock 2026-07-01; ACTIVE member; rentable product base 3000 with one unit."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/products"
              payload: { sku: "IM-TENT", name: "IM Tent", category: "TENT", retail_price_cents: 90000, tax_rate: 0.05, replacement_value_cents: 100000, is_rentable: true, base_daily_rate_cents: 3000 }
              as: CoopAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /coop/rental-units"
              payload: { product_id: "${prod_id}", asset_tag: "IM-001" }
              as: CoopAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /coop/members"
              payload: { email: "im@x.com", full_name: "IM Member" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: StoreStaff
          trigger:
            - call: "POST /coop/reservations"
              payload: { member_id: "${m_id}", rental_unit_id: "${unit_id}", start_date: "2026-07-10T00:00:00Z", end_date: "2026-07-13T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { res_id: $.data.id, fee: $.data.rental_fee_cents }
            - call: "GET /coop/reservations/${res_id}"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { fee2: $.data.rental_fee_cents }
          assert:
            - "GET /coop/reservations/${res_id} status == RESERVED"
            - "GET /coop/reservations/${res_id} rental_fee_cents == 11250"

      # ---- excluded_because stubs: corners already exercised by §1.8 ----
      - name: dividend_final_variant_excluded
        claim_type: violation_to_error
        grounds: [calculations.dividend_payout]
        excluded_because:
          difficulty_instance: dual_variant_calc / dividend_provisional_vs_final_on_member
          rationale: "Final dividend variant and eligible-spend threshold are asserted by the named §1.8 instance."
