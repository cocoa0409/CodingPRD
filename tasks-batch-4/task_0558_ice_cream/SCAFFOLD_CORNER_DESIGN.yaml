# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage of non-difficulty claims)
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_flavor_success_envelope_system_fields
        claim_type: Creation
        grounds: [entities.Flavor.fields.id, entities.Flavor.fields.stock_status, entities.Flavor.fields.version]
        distinguishing_aspect: "POST /flavors -> 201; response.data has server-minted id, version==1, created_at, and computed stock_status==OUT_OF_STOCK (no batches)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /flavors"
              payload: { name: "Vanilla", standard_cost_cents_per_ml: 1.80, par_level_ml: 500 }
              as: Manager
              captures: { van: $.data.id }
          assert:
            - "response_type == object; response.data.id is a non-prefixed UUID"
            - "Flavor.${van}.version == 1"
            - "Flavor.${van}.stock_status == OUT_OF_STOCK"
            - "Flavor.${van}.total_available_ml == 0"

      - name: order_line_quantity_defaults_to_one
        claim_type: Defaults
        grounds: [entities.OrderLine.fields.quantity, entities.OrderLine.fields.scoops]
        distinguishing_aspect: "Omitting quantity on a DOUBLE line yields quantity=1 and scoops=2 (scoop_count*1)."
        test_recipe:
          setup: ["Vanilla flavor par 500; DOUBLE size; batch 500 AVAILABLE; OPEN drawer + order"]
          setup_api_calls:
            - call: "POST /flavors"
              payload: { name: "Vanilla", standard_cost_cents_per_ml: 1.80, par_level_ml: 500 }
              as: Manager
              captures: { van: $.data.id }
            - call: "POST /size-options"
              payload: { code: "DOUBLE", scoop_count: 2, base_price_cents: 550 }
              as: Manager
              captures: { dbl: $.data.id }
            - call: "POST /batches"
              payload: { flavor_id: "${van}", initial_volume_ml: 500, unit_cost_cents_per_ml: 1.80, produced_at: "2026-05-01T00:00:00Z", expiry_at: "2026-05-20T00:00:00Z" }
              as: Baker
              captures: { b: $.data.id }
            - call: "POST /batches/${b}/release"
              payload: {}
              as: Baker
            - call: "POST /cash-drawer-sessions"
              payload: { opening_float_cents: 10000 }
              as: ShiftLead
              captures: { dr: $.data.id }
            - call: "POST /orders"
              payload: { drawer_id: "${dr}" }
              as: Scooper
              captures: { ord: $.data.id }
          trigger:
            - call: "POST /orders/${ord}/lines"
              payload: { size_option_id: "${dbl}", flavor_id: "${van}" }
              as: Scooper
              captures: { ln: $.data.id }
          assert:
            - "OrderLine.${ln}.quantity == 1"
            - "OrderLine.${ln}.scoops == 2"

      - name: orderline_allergen_label_is_union_of_flavor_and_toppings
        claim_type: Computed Fields
        grounds: [entities.OrderLine.fields.allergen_label, entities.Topping.fields.allergens, entities.Flavor.fields.allergens]
        distinguishing_aspect: "A Pistachio line (MILK,NUTS,PISTACHIO) with Hot Fudge (MILK,SOY) has allergen_label = {MILK,NUTS,PISTACHIO,SOY}."
        test_recipe:
          setup: ["Pistachio flavor allergens [MILK,NUTS,PISTACHIO]; Hot Fudge topping [MILK,SOY]; DOUBLE size; batch 500; OPEN drawer+order"]
          setup_api_calls:
            - call: "POST /flavors"
              payload: { name: "Pistachio", allergens: ["MILK","NUTS","PISTACHIO"], standard_cost_cents_per_ml: 2.20, par_level_ml: 300 }
              as: Manager
              captures: { pis: $.data.id }
            - call: "POST /size-options"
              payload: { code: "DOUBLE", scoop_count: 2, base_price_cents: 550 }
              as: Manager
              captures: { dbl: $.data.id }
            - call: "POST /toppings"
              payload: { name: "Hot Fudge", price_cents: 100, allergens: ["MILK","SOY"] }
              as: Manager
              captures: { fudge: $.data.id }
            - call: "POST /batches"
              payload: { flavor_id: "${pis}", initial_volume_ml: 500, unit_cost_cents_per_ml: 2.20, produced_at: "2026-05-01T00:00:00Z", expiry_at: "2026-05-20T00:00:00Z" }
              as: Baker
              captures: { b: $.data.id }
            - call: "POST /batches/${b}/release"
              payload: {}
              as: Baker
            - call: "POST /cash-drawer-sessions"
              payload: { opening_float_cents: 10000 }
              as: ShiftLead
              captures: { dr: $.data.id }
            - call: "POST /orders"
              payload: { drawer_id: "${dr}" }
              as: Scooper
              captures: { ord: $.data.id }
          trigger:
            - call: "POST /orders/${ord}/lines"
              payload: { size_option_id: "${dbl}", flavor_id: "${pis}", topping_ids: ["${fudge}"] }
              as: Scooper
              captures: { ln: $.data.id }
          assert:
            - "OrderLine.${ln}.allergen_label contains all of {MILK, NUTS, PISTACHIO, SOY}"
            - "OrderLine.${ln}.allergen_label has exactly 4 distinct members"

      - name: preorder_deposit_computed_on_confirm
        claim_type: Computed Fields
        grounds: [entities.PreOrder.fields.deposit_cents, state_machines.PreOrder.QUOTED_to_CONFIRMED]
        distinguishing_aspect: "Confirming a PreOrder quoted at 4000 sets deposit_cents = round_half_up(4000*0.5) = 2000."
        test_recipe:
          setup: ["Vanilla flavor; DecoratingStation; PreOrder QUOTED at 4000"]
          setup_api_calls:
            - call: "POST /flavors"
              payload: { name: "Vanilla", standard_cost_cents_per_ml: 1.80, par_level_ml: 300 }
              as: Manager
              captures: { van: $.data.id }
            - call: "POST /decorating-stations"
              payload: { name: "Station 1" }
              as: Manager
              captures: { st: $.data.id }
            - call: "POST /pre-orders"
              payload: { flavor_id: "${van}", decorating_station_id: "${st}", customer_name: "Rey", decorate_start_utc: "2026-05-03T10:00:00Z", decorate_end_utc: "2026-05-03T12:00:00Z", pickup_utc: "2026-05-04T09:00:00Z", quoted_price_cents: 4000 }
              as: Scooper
              captures: { po: $.data.id }
          trigger:
            - call: "POST /pre-orders/${po}/confirm"
              payload: {}
              as: Scooper
          assert:
            - "PreOrder.${po}.status == CONFIRMED"
            - "PreOrder.${po}.deposit_cents == 2000"

      - name: order_change_cents_computed_on_cash_pay
        claim_type: Computed Fields
        grounds: [entities.Order.fields.change_cents, entities.Order.fields.tendered_cash_cents]
        distinguishing_aspect: "CASH pay of a 381-total order tendering 400 yields change_cents=19 and payment_method=CASH."
        test_recipe:
          setup: ["Vanilla par 500; SINGLE size; batch 500 AVAILABLE; OPEN drawer; order with one SINGLE line (total 381)"]
          setup_api_calls:
            - call: "POST /flavors"
              payload: { name: "Vanilla", standard_cost_cents_per_ml: 1.80, par_level_ml: 500 }
              as: Manager
              captures: { van: $.data.id }
            - call: "POST /size-options"
              payload: { code: "SINGLE", scoop_count: 1, base_price_cents: 350 }
              as: Manager
              captures: { sng: $.data.id }
            - call: "POST /batches"
              payload: { flavor_id: "${van}", initial_volume_ml: 500, unit_cost_cents_per_ml: 1.80, produced_at: "2026-05-01T00:00:00Z", expiry_at: "2026-05-20T00:00:00Z" }
              as: Baker
              captures: { b: $.data.id }
            - call: "POST /batches/${b}/release"
              payload: {}
              as: Baker
            - call: "POST /cash-drawer-sessions"
              payload: { opening_float_cents: 10000 }
              as: ShiftLead
              captures: { dr: $.data.id }
            - call: "POST /orders"
              payload: { drawer_id: "${dr}" }
              as: Scooper
              captures: { ord: $.data.id }
            - call: "POST /orders/${ord}/lines"
              payload: { size_option_id: "${sng}", flavor_id: "${van}" }
              as: Scooper
          trigger:
            - call: "POST /orders/${ord}/pay"
              payload: { payment_method: "CASH", tendered_cash_cents: 400 }
              as: Scooper
          assert:
            - "Order.${ord}.total_cents == 381"
            - "Order.${ord}.change_cents == 19"
            - "Order.${ord}.payment_method == CASH"
            - "Order.${ord}.cash_collected_cents == 381"

      - name: flavor_not_found_on_get
        claim_type: Not Found
        grounds: ["errors[ERR_FLAVOR_NOT_FOUND]"]
        distinguishing_aspect: "GET /flavors/{unknown uuid} -> 404 ERR_FLAVOR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /flavors/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Manager
              captures: { err: $.data.error_id }
          assert: ["response.data.error_id == ERR_FLAVOR_NOT_FOUND"]

      - name: order_not_found_on_get
        claim_type: Not Found
        grounds: ["errors[ERR_ORDER_NOT_FOUND]"]
        distinguishing_aspect: "GET /orders/{unknown} -> 404 ERR_ORDER_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Scooper
              captures: { err: $.data.error_id }
          assert: ["response.data.error_id == ERR_ORDER_NOT_FOUND"]

      - name: batch_not_found_on_release
        claim_type: Not Found
        grounds: ["errors[ERR_BATCH_NOT_FOUND]"]
        distinguishing_aspect: "POST /batches/{unknown}/release -> 404 ERR_BATCH_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /batches/00000000-0000-4000-8000-000000000000/release"
              payload: {}
              as: Baker
              captures: { err: $.data.error_id }
          assert: ["response.data.error_id == ERR_BATCH_NOT_FOUND"]

      - name: drawer_not_found_on_get
        claim_type: Not Found
        grounds: ["errors[ERR_DRAWER_NOT_FOUND]"]
        distinguishing_aspect: "GET /cash-drawer-sessions/{unknown} -> 404 ERR_DRAWER_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
