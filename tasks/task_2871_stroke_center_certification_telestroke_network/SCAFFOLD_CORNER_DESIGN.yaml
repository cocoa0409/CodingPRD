  - name: hub_suspension_cascades_down_to_agreements_consults_and_neurologists
    claim_type: cascade_down
    grounds:
    - state_machines.StrokeCenter PROVISIONAL -> SUSPENDED four-hop cascade
    - complexity_profile.complexity_layers cascading_side_effects
    excluded_because:
      difficulty_instance: center_suspension_cascades_agreement_consult_and_neurologist_release
      rationale: The §1.8 transitive_cascade instance already drives the full four-hop hub-suspension chain end to end (posture -> agreement -> consult -> neurologist release plus the SYSTEM_DETECTED CONSULT_UNFILLED deviation) and asserts every intermediate hop, including that only non-terminal consults are cancelled. A separate corner test would be a strict subset of it.
  - name: retracting_an_abstraction_reverses_its_ledger_side_effects_without_drift
    claim_type: compensation
    grounds:
    - state_machines.QualityMeasureAbstraction FINALIZED -> RETRACTED
    - calculations.measure_compliance_rate
    excluded_because:
      difficulty_instance: abstraction_retraction_restores_report_ledger_without_drift
      rationale: The §1.8 compensating_invariant instance already pins the exact before/perturb/restore triple on the report ledger (included_abstraction_count, all three rates and mean_dtn_excess_pct) and proves the restored values are byte-identical to the baseline, which is precisely the compensation claim.
  - name: aborting_a_case_cancels_its_live_consult_and_releases_the_neurologist
    claim_type: cross_entity
    grounds:
    - state_machines.CodeStrokeCase ELIGIBILITY_DETERMINED -> ABORTED side effects
    - state_machines.TelestrokeConsult IN_SESSION -> CANCELLED
    - state_machines.Neurologist IN_CONSULT -> ON_CALL
    distinguishing_aspect: 'The abort is written on the CASE but the observable damage is on two OTHER entities: the IN_SESSION consult must become CANCELLED with a cancellation_reason, and the neurologist must be released from IN_CONSULT back to ON_CALL with active_consult_count back to 0 — without being credited a completed consult or a cooldown anchor.'
