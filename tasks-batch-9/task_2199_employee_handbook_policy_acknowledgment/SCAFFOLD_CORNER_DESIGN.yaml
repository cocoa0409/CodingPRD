        grounds: ["validations[priority=38]", "errors[ERR_DUPLICATE_RESOURCE]", "endpoints[POST /jurisdictions]", "endpoints[POST /employees]", "endpoints[POST /policy-versions/{policy_version_id}/translations]", "endpoints[POST /legal-reviewers]"]
        distinguishing_aspect: "The priority-38 rule carries three different key shapes and each must be enforced on its own terms: Jurisdiction.state_code is globally unique, Employee.work_email is globally unique, Translation is unique on the composite (policy_version_id, language_code) so the same language is reusable on a different version, and LegalReviewer.bar_number is unique only per jurisdiction so the same bar number is accepted in a second state."
        test_recipe:
          setup: ["Jurisdictions CA and NY; one CA employee; one CA reviewer with bar_number SHARED-1; a PolicyDocument with two DRAFT versions, the first already carrying an en Translation."]
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { state_code: "CA", display_name: "California", min_legal_review_days: 5, ack_deadline_days: 30, retention_years: 5, required_language_codes: ["en"], ack_window_buffer_days: 3 }, as: HRComplianceAdmin, captures: { j_ca: "$.data.id" } }
            - { call: "POST /jurisdictions", payload: { state_code: "NY", display_name: "New York", min_legal_review_days: 5, ack_deadline_days: 30, retention_years: 7, required_language_codes: ["en"], ack_window_buffer_days: 3 }, as: HRComplianceAdmin, captures: { j_ny: "$.data.id" } }
            - { call: "POST /employees", payload: { jurisdiction_id: "${j_ca}", work_email: "e1@ex.com", full_name: "Emp One" }, as: HRComplianceAdmin, captures: { e1: "$.data.id" } }
            - { call: "POST /legal-reviewers", payload: { jurisdiction_id: "${j_ca}", full_name: "Reviewer CA", bar_number: "SHARED-1", concurrent_review_limit: 3 }, as: HRComplianceAdmin, captures: { r_ca: "$.data.id" } }
            - { call: "POST /policy-documents", payload: { title: "Code of Conduct 2026", category: "CODE_OF_CONDUCT" }, as: PolicyAuthor, captures: { d1: "$.data.id", d1v: "$.data.version" } }
            - { call: "POST /policy-documents/${d1}/versions", payload: { body_text: "S1 S2", section_count: 2, required_jurisdiction_ids: ["${j_ca}"], expected_policy_document_version: "${d1v}" }, as: PolicyAuthor, captures: { v1: "$.data.id" } }
            - { call: "GET /policy-documents/${d1}", payload: {}, as: PolicyAuthor, captures: { d1v2: "$.data.version" } }
            - { call: "POST /policy-documents/${d1}/versions", payload: { body_text: "S1 S2 rev", section_count: 2, required_jurisdiction_ids: ["${j_ca}"], expected_policy_document_version: "${d1v2}" }, as: PolicyAuthor, captures: { v2: "$.data.id" } }
            - { call: "POST /policy-versions/${v1}/translations", payload: { language_code: "en" }, as: LocalizationSpecialist, captures: { t1: "$.data.id" } }
          trigger:
            - { call: "POST /jurisdictions", payload: { state_code: "CA", display_name: "California Duplicate", min_legal_review_days: 9, ack_deadline_days: 20, retention_years: 4, required_language_codes: ["en"] }, as: HRComplianceAdmin }
            - { call: "POST /employees", payload: { jurisdiction_id: "${j_ny}", work_email: "e1@ex.com", full_name: "Emp One Clone" }, as: HRComplianceAdmin }
            - { call: "POST /policy-versions/${v1}/translations", payload: { language_code: "en" }, as: LocalizationSpecialist }
            - { call: "POST /policy-versions/${v2}/translations", payload: { language_code: "en" }, as: LocalizationSpecialist, captures: { t2: "$.data.id" } }
            - { call: "POST /legal-reviewers", payload: { jurisdiction_id: "${j_ny}", full_name: "Reviewer NY", bar_number: "SHARED-1", concurrent_review_limit: 3 }, as: HRComplianceAdmin, captures: { r_ny: "$.data.id" } }
          assert:
            - "the first trigger call returns http_status == 409 with error.error_id == ERR_DUPLICATE_RESOURCE"
            - "the second trigger call returns http_status == 409 with error.error_id == ERR_DUPLICATE_RESOURCE even though the jurisdiction differs"
            - "the third trigger call returns http_status == 409 with error.error_id == ERR_DUPLICATE_RESOURCE"
            - "the fourth trigger call returns http_status == 201 because the composite key differs on policy_version_id"
            - "the fifth trigger call returns http_status == 201 because bar_number is unique only within a jurisdiction"
            - "GET /jurisdictions?state_code=CA returns exactly 1 row"
            - "GET /translations?policy_version_id=${v1} returns exactly 1 row and GET /translations?policy_version_id=${v2} returns exactly 1 row"
            - "Jurisdiction.${j_ca}.min_legal_review_days == 5 (the rejected duplicate did not overwrite it)"
      - name: corner_pagination_bounds_and_clock_monotonicity_guards
        claim_type: Violation → Error
        grounds: ["validations[priority=8]", "validations[priority=49]", "errors[ERR_INVALID_PAGINATION]", "errors[ERR_CLOCK_REWIND]", "response_envelope.pagination_defaults", "endpoints[GET /jurisdictions]", "endpoints[POST /_clock/set_current_utc]"]
        distinguishing_aspect: "Two infrastructure guards with unusual statuses: pagination violations are 400 (not 422) on both edges of the declared [1, 100] limit range and on a negative offset, while the logical clock refuses to move backwards with 409 but accepts an equal-instant set, so the clock is monotonic non-decreasing rather than strictly increasing."
        test_recipe:
          setup: ["Three Jurisdictions exist and the clock has been advanced once to 2026-08-10T00:00:00Z."]
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { state_code: "CA", display_name: "California", min_legal_review_days: 5, ack_deadline_days: 30, retention_years: 5, required_language_codes: ["en"] }, as: HRComplianceAdmin, captures: { j_ca: "$.data.id" } }
            - { call: "POST /jurisdictions", payload: { state_code: "NY", display_name: "New York", min_legal_review_days: 5, ack_deadline_days: 30, retention_years: 7, required_language_codes: ["en"] }, as: HRComplianceAdmin, captures: { j_ny: "$.data.id" } }
            - { call: "POST /jurisdictions", payload: { state_code: "TX", display_name: "Texas", min_legal_review_days: 5, ack_deadline_days: 30, retention_years: 5, required_language_codes: ["en"] }, as: HRComplianceAdmin, captures: { j_tx: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: HRComplianceAdmin }
          trigger:
            - { call: "GET /jurisdictions", payload: { limit: 0 }, as: HRComplianceAdmin }
            - { call: "GET /jurisdictions", payload: { limit: 101 }, as: HRComplianceAdmin }
            - { call: "GET /jurisdictions", payload: { offset: -1 }, as: HRComplianceAdmin }
            - { call: "GET /jurisdictions", payload: { limit: 100, offset: 0 }, as: HRComplianceAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T23:59:59Z" }, as: HRComplianceAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: HRComplianceAdmin }
            - { call: "POST /employees", payload: { jurisdiction_id: "${j_ca}", work_email: "e1@ex.com", full_name: "Emp One" }, as: HRComplianceAdmin, captures: { e1: "$.data.id" } }
          assert:
            - "the first three trigger calls each return http_status == 400 with error.error_id == ERR_INVALID_PAGINATION"
            - "the fourth trigger call returns http_status == 200 with meta.limit == 100, meta.offset == 0, meta.total_count == 3 and meta.has_more == false"
            - "the fifth trigger call returns http_status == 409 with error.error_id == ERR_CLOCK_REWIND"
            - "the sixth trigger call succeeds because the guard admits an equal instant"
            - "Employee.${e1}.created_at == 2026-08-10T00:00:00.000Z, proving the rejected rewind left the clock untouched"
      - name: corner_reviewer_capacity_interval_touching_and_inactivity
        claim_type: Violation → Error
        grounds: ["validations[priority=41]", "validations[priority=48]", "errors[ERR_REVIEWER_CAPACITY_EXCEEDED]", "errors[ERR_REVIEWER_INACTIVE]", "endpoints[POST /policy-versions/{policy_version_id}/legal-reviews]"]
        distinguishing_aspect: "Reviewer capacity is measured on CLOSED intervals where touching counts as overlap: with concurrent_review_limit 1 a second request overlapping [2026-08-01, 2026-08-20] is refused, and so is one whose assigned_at is exactly the incumbent's due_at 2026-08-20. Only the incumbent leaving {REQUESTED, IN_PROGRESS} frees the slot, whereas an is_active false reviewer with zero load is refused for an entirely different reason at priority 48."
        test_recipe:
          setup: ["Jurisdiction CA; reviewer r1 with concurrent_review_limit 1 and reviewer r_off with is_active false; one PolicyDocument with two DRAFT versions; a REQUESTED LegalReview lr1 on v1 for r1 due 2026-08-20 created at the 2026-08-01 clock, and v1 submitted for review."]
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { state_code: "CA", display_name: "California", min_legal_review_days: 5, ack_deadline_days: 30, retention_years: 5, required_language_codes: ["en"] }, as: HRComplianceAdmin, captures: { j_ca: "$.data.id" } }
            - { call: "POST /legal-reviewers", payload: { jurisdiction_id: "${j_ca}", full_name: "Reviewer One", bar_number: "CA-1001", concurrent_review_limit: 1, is_active: true }, as: HRComplianceAdmin, captures: { r1: "$.data.id" } }
            - { call: "POST /legal-reviewers", payload: { jurisdiction_id: "${j_ca}", full_name: "Reviewer Off", bar_number: "CA-1002", concurrent_review_limit: 5, is_active: false }, as: HRComplianceAdmin, captures: { r_off: "$.data.id" } }
            - { call: "POST /policy-documents", payload: { title: "Code of Conduct 2026", category: "CODE_OF_CONDUCT" }, as: PolicyAuthor, captures: { d1: "$.data.id", d1v: "$.data.version" } }
            - { call: "POST /policy-documents/${d1}/versions", payload: { body_text: "S1 S2", section_count: 2, required_jurisdiction_ids: ["${j_ca}"], expected_policy_document_version: "${d1v}" }, as: PolicyAuthor, captures: { v1: "$.data.id" } }
            - { call: "GET /policy-documents/${d1}", payload: {}, as: PolicyAuthor, captures: { d1v2: "$.data.version" } }
            - { call: "POST /policy-documents/${d1}/versions", payload: { body_text: "S1 S2 rev", section_count: 2, required_jurisdiction_ids: ["${j_ca}"], expected_policy_document_version: "${d1v2}" }, as: PolicyAuthor, captures: { v2: "$.data.id" } }
            - { call: "POST /policy-versions/${v1}/legal-reviews", payload: { jurisdiction_id: "${j_ca}", reviewer_id: "${r1}", due_at: "2026-08-20T00:00:00Z" }, as: PolicyAuthor, captures: { lr1: "$.data.id" } }
            - { call: "POST /policy-versions/${v1}/submit-for-review", payload: {}, as: PolicyAuthor }
          trigger:
            - { call: "POST /policy-versions/${v2}/legal-reviews", payload: { jurisdiction_id: "${j_ca}", reviewer_id: "${r1}", due_at: "2026-08-25T00:00:00Z" }, as: PolicyAuthor }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: HRComplianceAdmin }
            - { call: "POST /policy-versions/${v2}/legal-reviews", payload: { jurisdiction_id: "${j_ca}", reviewer_id: "${r1}", due_at: "2026-08-30T00:00:00Z" }, as: PolicyAuthor }
            - { call: "POST /policy-versions/${v2}/legal-reviews", payload: { jurisdiction_id: "${j_ca}", reviewer_id: "${r_off}", due_at: "2026-08-30T00:00:00Z" }, as: PolicyAuthor }
            - { call: "POST /legal-reviews/${lr1}/start", payload: {}, as: LegalCounsel, as_user_id: "${r1}" }
            - { call: "POST /legal-reviews/${lr1}/decision", payload: { verdict: "APPROVE" }, as: LegalCounsel, as_user_id: "${r1}" }
            - { call: "POST /policy-versions/${v2}/legal-reviews", payload: { jurisdiction_id: "${j_ca}", reviewer_id: "${r1}", due_at: "2026-08-30T00:00:00Z" }, as: PolicyAuthor, captures: { lr2: "$.data.id" } }
          assert:
            - "the first trigger call returns http_status == 409 with error.error_id == ERR_REVIEWER_CAPACITY_EXCEEDED"
            - "the third trigger call returns http_status == 409 with error.error_id == ERR_REVIEWER_CAPACITY_EXCEEDED because assigned_at 2026-08-20 touches the incumbent due_at 2026-08-20"
            - "the fourth trigger call returns http_status == 409 with error.error_id == ERR_REVIEWER_INACTIVE, not a capacity error, since r_off carries zero open reviews"
            - "after the sixth trigger call LegalReview.${lr1}.status == APPROVED and decided_at == 2026-08-20T00:00:00.000Z"
            - "the seventh trigger call returns http_status == 201 with LegalReview.${lr2}.status == REQUESTED and assigned_at == 2026-08-20T00:00:00.000Z"
            - "GET /legal-reviews?reviewer_id=${r1} returns exactly 2 rows"
            - "GET /legal-reviews?reviewer_id=${r_off} returns 0 rows"
      - name: corner_exception_request_without_a_pending_assignment_is_refused
        claim_type: Violation → Error
        grounds: ["validations[priority=36]", "errors[ERR_NO_PENDING_ASSIGNMENT]", "entities.PolicyException.fields.assignment_id", "endpoints[POST /policy-exceptions]"]
        distinguishing_aspect: "PolicyException.assignment_id is resolved by the server from the requester's own PENDING assignment on the named version, so an employee who has no assignment at all on that version cannot open an exception even though the version and the employee both exist and the OCC token is correct -- the refusal is ERR_NO_PENDING_ASSIGNMENT at 409, not a 404 on either identifier."
        test_recipe:
          setup: ["Jurisdiction CA, one ACTIVE Employee with no assignments, and one DRAFT PolicyVersion that was never released."]
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { state_code: "CA", display_name: "California", min_legal_review_days: 5, ack_deadline_days: 30, retention_years: 5, required_language_codes: ["en"] }, as: HRComplianceAdmin, captures: { j_ca: "$.data.id" } }
            - { call: "POST /employees", payload: { jurisdiction_id: "${j_ca}", work_email: "e1@ex.com", full_name: "Emp One" }, as: HRComplianceAdmin, captures: { e1: "$.data.id", e1v: "$.data.version" } }
            - { call: "POST /policy-documents", payload: { title: "Code of Conduct 2026", category: "CODE_OF_CONDUCT" }, as: PolicyAuthor, captures: { d1: "$.data.id", d1v: "$.data.version" } }
            - { call: "POST /policy-documents/${d1}/versions", payload: { body_text: "S1 S2", section_count: 2, required_jurisdiction_ids: ["${j_ca}"], expected_policy_document_version: "${d1v}" }, as: PolicyAuthor, captures: { v1: "$.data.id" } }
          trigger:
            - { call: "POST /policy-exceptions", payload: { policy_version_id: "${v1}", reason_code: "MEDICAL", justification: "Extended medical absence", requested_days: 30, expected_employee_version: "${e1v}" }, as: Employee, as_user_id: "${e1}" }
          assert:
            - "http_status == 409 with error.error_id == ERR_NO_PENDING_ASSIGNMENT"
            - "GET /policy-exceptions?employee_id=${e1} returns 0 rows"
            - "Employee.${e1}.version == ${e1v}, so the rejected request did not consume the OCC token"
            - "Employee.${e1}.open_ack_count == 0"
      - name: corner_priority_ordering_release_gate_before_effective_date
        claim_type: Priority Ordering
        excluded_because:
          difficulty_instance: release_state_gate_outranks_effective_date_not_reached
          rationale: "That §1.8 instance already constructs the doubly-violating release call where priority 22 and priority 47 both apply and asserts that only ERR_RELEASE_NOT_SCHEDULED surfaces, then repairs one violation at a time to show the second error appearing. A corner probe would assert the same single error_id with less discrimination."
      - name: corner_priority_ordering_legal_review_before_addendum
        claim_type: Priority Ordering
        excluded_because:
          difficulty_instance: legal_review_completeness_outranks_addendum_approval
          rationale: "The 27-before-33 ordering on POST /policy-versions/{policy_version_id}/approve is pinned by that §1.8 instance, including the repaired follow-up where the addendum error becomes observable once the legal-review gate is satisfied. Repeating it here would add no new discrimination."

  - section: endpoints
    instances:
      - name: corner_employee_patch_is_partial_and_bounded_to_declared_inputs
        claim_type: Standard CRUD
        grounds: ["endpoints[PATCH /employees/{employee_id}]", "endpoints[GET /employees/{employee_id}]", "entities.Employee"]
        distinguishing_aspect: "The only PATCH in the surface accepts exactly four optional fields, so a single-field update must leave the other three and every system field alone while still incrementing version and refreshing updated_at to the logical clock; identity fields such as work_email and jurisdiction_id are not patchable at all."
        test_recipe:
          setup: ["Jurisdiction CA, a manager Employee, and a subordinate Employee created with preferred_language_code es and needs_accessible_format true; the clock then advanced to 2026-08-05T00:00:00Z."]
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { state_code: "CA", display_name: "California", min_legal_review_days: 5, ack_deadline_days: 30, retention_years: 5, required_language_codes: ["en", "es"] }, as: HRComplianceAdmin, captures: { j_ca: "$.data.id" } }
            - { call: "POST /employees", payload: { jurisdiction_id: "${j_ca}", work_email: "mgr@ex.com", full_name: "Mgr Zero" }, as: HRComplianceAdmin, captures: { e_mgr: "$.data.id" } }
            - { call: "POST /employees", payload: { jurisdiction_id: "${j_ca}", work_email: "e1@ex.com", full_name: "Emp One", preferred_language_code: "es", needs_accessible_format: true, manager_id: "${e_mgr}" }, as: HRComplianceAdmin, captures: { e1: "$.data.id", e1v: "$.data.version" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: HRComplianceAdmin }
          trigger:
            - { call: "PATCH /employees/${e1}", payload: { employment_status: "ON_LEAVE" }, as: HRComplianceAdmin }
            - { call: "GET /employees/${e1}", payload: {}, as: HRComplianceAdmin }
          assert:
            - "http_status == 200 on the PATCH"
            - "Employee.${e1}.employment_status == ON_LEAVE"
            - "Employee.${e1}.preferred_language_code == es"
            - "Employee.${e1}.needs_accessible_format == true"
            - "Employee.${e1}.manager_id == ${e_mgr}"
            - "Employee.${e1}.work_email == e1@ex.com and jurisdiction_id == ${j_ca}"
            - "Employee.${e1}.open_ack_count == 0 and open_escalation_count == 0"
            - "Employee.${e1}.version == ${e1v} + 1"
            - "Employee.${e1}.updated_at == 2026-08-05T00:00:00.000Z"
            - "the GET returns exactly the same representation as the PATCH response"
      - name: corner_addendum_link_navigates_from_both_parents
        claim_type: Cross-reference link
        grounds: ["endpoints[POST /policy-versions/{policy_version_id}/addenda]", "endpoints[GET /addenda]", "entities.JurisdictionAddendum", "validations[priority=38]"]
        distinguishing_aspect: "JurisdictionAddendum is the link row between a PolicyVersion and a Jurisdiction: one version may carry one addendum per jurisdiction and one jurisdiction may be addressed by addenda on several versions, so the same list endpoint must reverse-navigate by policy_version_id and by jurisdiction_id and by approved_by_reviewer_id, and the composite key blocks only the exact repeat."
        test_recipe:
          setup: ["Jurisdictions CA and NY, one CA reviewer, and one PolicyDocument with two DRAFT versions."]
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { state_code: "CA", display_name: "California", min_legal_review_days: 5, ack_deadline_days: 30, retention_years: 5, required_language_codes: ["en"] }, as: HRComplianceAdmin, captures: { j_ca: "$.data.id" } }
            - { call: "POST /jurisdictions", payload: { state_code: "NY", display_name: "New York", min_legal_review_days: 5, ack_deadline_days: 30, retention_years: 7, required_language_codes: ["en"] }, as: HRComplianceAdmin, captures: { j_ny: "$.data.id" } }
            - { call: "POST /legal-reviewers", payload: { jurisdiction_id: "${j_ca}", full_name: "Reviewer CA", bar_number: "CA-1001", concurrent_review_limit: 3 }, as: HRComplianceAdmin, captures: { r_ca: "$.data.id" } }
            - { call: "POST /policy-documents", payload: { title: "Code of Conduct 2026", category: "CODE_OF_CONDUCT" }, as: PolicyAuthor, captures: { d1: "$.data.id", d1v: "$.data.version" } }
