            - "GET /esa/applications?program_year_id=${py_b_id} returns 0 rows"

      - name: adjacent_service_windows_coexist_while_overlapping_ones_collide
        grounds:
          - validations[priority=30]
          - errors.ERR_DUPLICATE_SERVICE_PERIOD
          - entities.PurchaseRequest.fields.service_start_at
          - entities.PurchaseRequest.fields.service_end_at
          - entities.ExpenseCategory.fields.requires_service_period
        distinguishing_aspect: |
          The same scarce-interval idea one layer down, but on a HALF-OPEN interval, which is the
          opposite convention from the sibling instance: a request starting exactly at the held
          window's end instant (2026-11-01) is accepted because [a, b) excludes b, while a request
          nested strictly inside the held window is refused 409 - so a single interval helper reused
          for both entities cannot satisfy both instances.
        test_recipe:
          setup:
            - "ProgramYear 2026-27 is ACTIVE with current_quarter 1; Account ACCT1 is ACTIVE with balance_cents 229088."
            - "ExpenseCategory TUTORING (per_year_cap_cents 200000, requires_service_period true) is published; Provider P1 is APPROVED for [TUTORING]."
            - "PR1 (TUTORING, PREAPPROVAL, 150000) is APPROVED over [2026-10-01, 2026-11-01), holding 150000 and leaving balance_cents 79088."
          setup_api_calls:
            - call: "POST /esa/program-years"
