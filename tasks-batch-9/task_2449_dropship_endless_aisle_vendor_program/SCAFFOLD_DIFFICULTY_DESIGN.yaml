      - Vendor V1 is ACTIVE, COMMISSION at 1500 bps, with no blackout windows recorded.
      - The logical clock is at 2026-08-01T00:00:00Z, well before every window below, so no window is in the past.
      - Blackout A will cover 2026-08-10 through 2026-08-12 inclusive with reopen_buffer_days 2, so the buffered
        exclusion runs to 2026-08-14 inclusive.
      - Candidate B starts 2026-08-14, which leaves a gap of exactly 2 days after A's end (2026-08-13 and 2026-08-14)
        - equal to the buffer, not greater than it.
      - Candidate C starts 2026-08-15, leaving a gap of 3 days, which clears the buffer.
