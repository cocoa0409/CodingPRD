# =============================================================================
# Scaffold: Family Location Sharing, Place Alerts & Crash Detection
# task_3276_family_location_sharing_place_alerts_crash_detection
# =============================================================================
# Core challenge: a posture-driven safety network where (1) a per-member privacy
# mode lattice and per-subscription history window gate every location read and
# alert evaluation, (2) geofence enter/exit events fire on dwell-time buckets
# whose evaluation depends on the member's adaptive sampling interval at the
# moment of the fix, (3) crash detection fans out a transitive cascade
# (CrashEvent -> WellnessCheck -> EmergencyDispatch -> circle notifications +
# subscription entitlement consumption) with a compensating invariant on the
# circle's assistance-unit budget, and (4) consent revocation and minor aging
# transitions retroactively re-filter the visible location history.

scenario: |
  Family Location Sharing, Place Alerts & Crash Detection (Life360): circle
  creation with member invitations, role permissions and shared location
  visibility settings, location sampling frequency balanced against battery
  consumption with adaptive intervals, place definition with arrival and
  departure alerts and geofence accuracy tolerance, driving detection with
  trip reports, speed events and phone usage flags shared with the circle,
  crash detection triggering an automated wellness check and emergency
  dispatch escalation, subscription tiers unlocking history depth, roadside
  assistance and identity protection, minor member consent and privacy
  controls with parent and teen tension handling, data sharing policies and
  location data monetization disclosures.

domain_name: family-safety-network
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - rate_threshold_triggers
    - derived_field_reconciliation
    - cascading_side_effects
    - optimistic_concurrency
  entity_topology: hybrid            # Circle tree + flat member-centric resources
  state_machine_shape: parallel      # Member privacy_mode x consent_state x sampling_mode evolve independently; CrashEvent has cyclic resolution loop
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: hierarchical_override  # Owner ⊃ Admin ⊃ Member ⊃ Minor; System is opaque operator role
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Circle
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Display name of the family circle" }
      - { name: owner_member_id, type: string, source: system, description: "FK -> Member.id; the member holding OWNER role, set at circle activation" }
      - { name: subscription_tier, type: enum, source: input, description: "FREE | PLUS | PROTECT; governs history retention depth, roadside assistance units, identity protection", constraints: "one of FREE, PLUS, PROTECT" }
      - { name: subscription_status, type: enum, source: system, description: "TRIALING | ACTIVE | PAST_DUE | SUSPENDED | CANCELLED" }
      - { name: billing_anchor_day, type: integer, source: input, description: "Day-of-month the 30-day billing window anchors to", constraints: "integer in 1..28" }
      - { name: circle_posture, type: enum, source: computed, description: "OPEN | RESTRICTED | FROZEN — derived: RESTRICTED when subscription PAST_DUE or any OPEN ComplianceHold exists; FROZEN when subscription SUSPENDED or CANCELLED, else OPEN" }
      - { name: assistance_units_balance, type: integer, source: computed, description: "Roadside-assistance units remaining in the current billing window; replenished at each billing anchor by tier (FREE=0, PLUS=2, PROTECT=4); never negative" }
      - { name: identity_protection_credits, type: integer, source: computed, description: "PROTECT-only identity-protection credit balance, starts at 1 per billing window; 0 on other tiers" }
      - { name: history_retention_days, type: integer, source: computed, description: "Effective retention window in days: FREE=7, PLUS=30, PROTECT=60; recomputed on subscription_tier change" }

  - name: Member
    parent: Circle
    common_fields: true
    fields:
      - { name: circle_id, type: string, source: system, description: "FK -> Circle.id" }
      - { name: display_name, type: string, source: input, description: "Member display name" }
      - { name: birthdate, type: datetime, source: input, description: "ISO-8601 date; used for age computation (minor when < 18 as of current UTC date)" }
      - { name: role, type: enum, source: input, description: "OWNER | ADMIN | MEMBER | MINOR", constraints: "exactly one OWNER per circle; MINOR role auto-assigned when computed age < 16, auto-promoted to MEMBER on 16th birthday" }
      - { name: age_years, type: integer, source: computed, description: "floor((current_utc - birthdate) / 365.25 days), recomputed on every read and on the daily age sweep" }
      - { name: consent_state, type: enum, source: system, description: "PENDING | GRANTED | REVOKED | EXPIRED — MINOR members start PENDING and require a parental GRANT before sharing; adults start GRANTED on join; REVOKED when member (or parent for MINOR) revokes" }
      - { name: privacy_mode, type: enum, source: input, description: "PRECISE | BLURRED | HIDDEN — PRECISE shares exact coordinates; BLURRED shares a 1.6 km radius jittered centroid; HIDDEN suppresses location sharing entirely", default: PRECISE }
      - { name: sampling_profile, type: enum, source: input, description: "HIGH | BALANCED | SAVER — desired sampling aggressiveness", default: BALANCED }
      - { name: effective_sample_interval_seconds, type: integer, source: computed, description: "Adaptive interval actually applied — see calculations.effective_sample_interval; combines sampling_profile, motion context, battery level, and tier cap" }
      - { name: current_battery_pct, type: integer, source: input, description: "Last reported battery level 0-100, updated on every location fix" }
      - { name: last_known_fix_id, type: string, source: system, description: "FK -> LocationFix.id; most recent accepted fix, null until first fix" }
      - { name: tension_flag, type: boolean, source: system, description: "True while a parent-imposed privacy override is being contested by a MINOR/MEMBER — see MemberStateMachine TENSION_OPEN/TENSION_RESOLVED", default: false }

  - name: Place
    parent: Circle
    common_fields: true
    fields:
      - { name: circle_id, type: string, source: system, description: "FK -> Circle.id" }
      - { name: label, type: string, source: input, description: "Human label, e.g. Home, School" }
      - { name: center_lat, type: number, source: input, description: "Latitude in degrees, -90..90" }
      - { name: center_lng, type: number, source: input, description: "Longitude in degrees, -180..180" }
      - { name: radius_m, type: integer, source: input, description: "Geofence radius in metres", constraints: "50 <= radius_m <= 5000" }
      - { name: accuracy_floor_m, type: integer, source: input, description: "Fix accuracy worse than this floor cannot trigger alerts", constraints: "10 <= accuracy_floor_m <= 500", default: 100 }
      - { name: notify_on_arrive, type: boolean, source: input, default: true }
      - { name: notify_on_depart, type: boolean, source: input, default: true }
      - { name: dwell_bucket_seconds, type: integer, source: input, description: "Minimum dwell duration before an ARRIVAL is confirmed: one of 60 | 180 | 300", constraints: "60 | 180 | 300", default: 180 }
      - { name: place_status, type: enum, source: system, description: "ACTIVE | ARCHIVED" }

  - name: LocationFix
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id" }
      - { name: recorded_at, type: datetime, source: input, description: "Client-stamped capture time; must be within ±300s of server logical clock else ERR_FIX_CLOCK_SKEW" }
      - { name: lat, type: number, source: input, description: "-90..90" }
      - { name: lng, type: number, source: input, description: "-180..180" }
      - { name: accuracy_m, type: number, source: input, description: "Reported accuracy radius in metres, must be > 0" }
      - { name: speed_mps, type: number, source: input, description: "Ground speed in m/s, >= 0" }
      - { name: battery_pct, type: integer, source: input, description: "0..100" }
      - { name: phone_in_use, type: boolean, source: input, description: "Device reports active foreground phone interaction at capture" }
      - { name: motion_context, type: enum, source: input, description: "STILL | WALKING | DRIVING | UNKNOWN" }
      - { name: fix_status, type: enum, source: system, description: "ACCEPTED | REJECTED_ACCURACY | REJECTED_STALE | REJECTED_CONSENT | RETIRED" }
      - { name: place_ids_inside, type: array, source: computed, description: "List of Place.id whose geofence (with accuracy-tolerance math, see calculations.geofence_membership) contained this fix at acceptance time; frozen thereafter" }

  - name: PlaceAlert
    parent: Place
    common_fields: true
    fields:
      - { name: place_id, type: string, source: system, description: "FK -> Place.id" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id" }
      - { name: event_kind, type: enum, source: system, description: "ARRIVAL | DEPARTURE" }
      - { name: alert_status, type: enum, source: system, description: "PENDING_DWELL | CONFIRMED | SUPPRESSED | CANCELLED" }
      - { name: window_open_fix_id, type: string, source: system, description: "FK -> LocationFix.id; the fix that opened the candidate window" }
      - { name: window_close_fix_id, type: string, source: system, description: "FK -> LocationFix.id; the fix that confirmed (or cancelled) the candidate; null while PENDING_DWELL" }
      - { name: suppressed_reason, type: enum, source: system, description: "null | PRIVACY_HIDDEN | TIER_HISTORY | DUPLICATE_EVENT", required: false }
      - { name: visible_to_owner, type: boolean, source: computed, description: "True when the member's privacy_mode at confirmation time is PRECISE or BLURRED; false under HIDDEN — computed at confirmation and frozen" }

  - name: TripReport
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id" }
      - { name: started_at, type: datetime, source: system, description: "Timestamp of first DRIVING fix in the trip chain" }
      - { name: ended_at, type: datetime, source: system, description: "Timestamp of the last DRIVING fix before trip close" }
      - { name: trip_status, type: enum, source: system, description: "OPEN | CLOSED | ABANDONED" }
      - { name: distance_m, type: integer, source: computed, description: "Sum of haversine segments between consecutive ACCEPTED DRIVING fixes, integer metres, rounded per-segment (see calculations.trip_distance)" }
      - { name: max_speed_mps, type: number, source: computed, description: "Max speed_mps over the trip's fixes" }
      - { name: speed_event_count, type: integer, source: computed, description: "Count of consecutive-fix pairs whose average speed exceeds the tier threshold; see calculations.speed_event_count" }
      - { name: phone_use_event_count, type: integer, source: computed, description: "Count of ACCEPTED DRIVING fixes with phone_in_use == true and speed_mps >= 1.0" }
      - { name: driver_score, type: integer, source: computed, description: "0..100, computed on trip close; see calculations.driver_score (dual variant: trip-level vs rolling-30d)" }

  - name: CrashEvent
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id" }
      - { name: trip_report_id, type: string, source: system, description: "FK -> TripReport.id; the OPEN trip at detection time" }
      - { name: detected_at, type: datetime, source: system, description: "Logical-clock time of detection" }
      - { name: severity, type: enum, source: system, description: "MINOR | MAJOR | SEVERE — derived from deceleration delta; see calculations.crash_severity" }
      - { name: crash_status, type: enum, source: system, description: "DETECTED | WELLNESS_PENDING | CONFIRMED_OK | ESCALATED | DISPATCHED | RESOLVED | FALSE_ALARM" }
      - { name: wellness_check_id, type: string, source: system, description: "FK -> WellnessCheck.id; created with the crash event" }
      - { name: dispatch_id, type: string, source: system, description: "FK -> EmergencyDispatch.id; null until escalated" }
      - { name: false_alarm_reason, type: string, source: input, required: false, description: "Free-text reason supplied when a member or owner marks FALSE_ALARM" }

  - name: WellnessCheck
    parent: CrashEvent
    common_fields: true
    fields:
      - { name: crash_event_id, type: string, source: system, description: "FK -> CrashEvent.id" }
      - { name: check_status, type: enum, source: system, description: "SENT | ACKNOWLEDGED | UNANSWERED | CANCELLED" }
      - { name: deadline_at, type: datetime, source: system, description: "detected_at + 300s for SEVERE, +600s otherwise" }
      - { name: acknowledged_by_member_id, type: string, source: system, description: "FK -> Member.id; null until ACKNOWLEDGED" }

  - name: EmergencyDispatch
    parent: CrashEvent
    common_fields: true
    fields:
      - { name: crash_event_id, type: string, source: system, description: "FK -> CrashEvent.id" }
      - { name: dispatch_status, type: enum, source: system, description: "PENDING_VERIFICATION | VERIFIED | STAGED | COMPLETED | CANCELLED" }
      - { name: verification_note, type: string, source: input, required: false, description: "Operator note captured at verification" }
      - { name: staged_at, type: datetime, source: system, description: "Timestamp the dispatch was staged with the responder; null until STAGED" }

  - name: SubscriptionEvent
    parent: Circle
    common_fields: true
    fields:
      - { name: circle_id, type: string, source: system, description: "FK -> Circle.id" }
      - { name: event_kind, type: enum, source: system, description: "TIER_CHANGE | RENEWAL | PAYMENT_FAILED | SUSPENDED | REACTIVATED | CANCELLED | ASSISTANCE_GRANT | ASSISTANCE_CONSUME | IDENTITY_CREDIT_CONSUME" }
      - { name: from_tier, type: enum, source: system, description: "null on first event; else previous tier", required: false }
      - { name: to_tier, type: enum, source: system, description: "null unless TIER_CHANGE", required: false }
      - { name: effective_at, type: datetime, source: system, description: "Logical-clock time at which the change takes effect" }
      - { name: units_delta, type: integer, source: system, description: "Change applied to assistance_units_balance or identity_protection_credits" }
      - { name: billing_period_index, type: integer, source: system, description: "Monotonic billing window counter, 0 = creation window" }

  - name: ConsentRecord
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id" }
      - { name: granted_by_member_id, type: string, source: system, description: "FK -> Member.id; OWNER/ADMIN who granted on a MINOR's behalf, or self for adults" }
      - { name: scope, type: enum, source: input, description: "LOCATION | DRIVING | CRASH | FULL", constraints: "FULL implies all other scopes" }
      - { name: consent_action, type: enum, source: system, description: "GRANT | REVOKE | EXPIRE" }
      - { name: effective_at, type: datetime, source: system, description: "Logical-clock time the action takes effect" }
      - { name: monetization_opt_in, type: boolean, source: input, description: "Whether the member consents to anonymized location-data monetization under the circle's data-sharing disclosure", default: false }

  - name: ComplianceHold
    parent: Circle
    common_fields: true
    fields:
      - { name: circle_id, type: string, source: system, description: "FK -> Circle.id" }
      - { name: hold_kind, type: enum, source: input, description: "DATA_SHARING_DISCLOSURE | MONETIZATION_OPT_OUT_SWEEP | MINOR_PRIVACY_AUDIT" }
      - { name: hold_status, type: enum, source: system, description: "OPEN | RESOLVED" }
      - { name: opened_reason, type: string, source: system, description: "Machine-readable cause, e.g. disclosure_version_bump" }
      - { name: resolved_by_member_id, type: string, source: system, description: "FK -> Member.id; the OWNER who acknowledged/resolved", required: false }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Circle
    field: circle_posture
    initial_state: OPEN
    terminal_states: []
    note: "Compound/posture-driven: derived from subscription_status and open ComplianceHold set; recomputed on every mutation of either."
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system (subscription_status becomes PAST_DUE, or a ComplianceHold becomes OPEN)"
        actor: system
        preconditions: []
        side_effects:
          - "New LocationFix ingestion continues but PlaceAlert confirmation is withheld (alerts stay PENDING_DWELL)"
          - "Roadside assistance consumption blocked (ERR_CIRCLE_RESTRICTED)"

      - from: [OPEN, RESTRICTED]
        to: FROZEN
        trigger: "system (subscription_status becomes SUSPENDED or CANCELLED)"
        actor: system
        preconditions: []
        side_effects:
          - "All location-sharing reads to non-OWNER members return ERR_CIRCLE_FROZEN"
          - "OPEN TripReports are closed ABANDONED with no driver_score computed"
          - "PENDING_DWELL PlaceAlerts -> SUPPRESSED with suppressed_reason=TIER_HISTORY"

      - from: RESTRICTED
        to: OPEN
        trigger: "system (subscription re-ACTIVE and no OPEN ComplianceHold remains)"
        actor: system
        preconditions:
          - "subscription_status == ACTIVE or TRIALING"
          - "no ComplianceHold with hold_status == OPEN for this circle"
        side_effects:
          - "PENDING_DWELL PlaceAlerts resume evaluation against their original window_open_fix_id (no reset)"

      - from: FROZEN
        to: OPEN
        trigger: "POST /api/circles/{circle_id}/subscription/reactivate"
        actor: Owner
        preconditions:
          - "subscription_status transitions back to ACTIVE"
        side_effects:
          - "circle_posture recomputed; if a ComplianceHold is still OPEN, posture lands on RESTRICTED instead of OPEN"

  - entity: Member
    field: role
    initial_state: MEMBER
    terminal_states: []
    note: "Parallel dimensions: role, consent_state and privacy_mode evolve independently. Role is the aging dimension; consent_state and privacy_mode are the privacy dimensions."
    transitions:
      - from: MEMBER
        to: ADMIN
        trigger: "POST /api/circles/{circle_id}/members/{member_id}/promote"
        actor: Owner
        preconditions:
          - "Member.consent_state == GRANTED"
          - "Circle.circle_posture != FROZEN"
        side_effects: []

      - from: ADMIN
        to: MEMBER
        trigger: "POST /api/circles/{circle_id}/members/{member_id}/demote"
        actor: Owner
        preconditions: []
        side_effects: []

      - from: MINOR
        to: MEMBER
        trigger: "system (daily age sweep detects age_years >= 16)"
        actor: system
        preconditions: []
        side_effects:
          - "tension_flag cleared (parent override is retired on aging out)"
          - "privacy_mode preserved, but the parent-imposed override lock is released"

      - from: [MEMBER, ADMIN, MINOR]
        to: OWNER
        trigger: "POST /api/circles/{circle_id}/transfer-ownership"
        actor: Owner
        preconditions:
          - "Target member consent_state == GRANTED"
          - "Target member role != MINOR"
        side_effects:
          - "Prior OWNER demoted to ADMIN"
          - "Circle.owner_member_id updated (increments Circle.version)"

  - entity: Member
    field: consent_state
    initial_state: PENDING
    terminal_states: []
    note: "Adults transition PENDING->GRANTED automatically on join (server-side); MINOR members require an explicit GRANT from OWNER/ADMIN. REVOKED->GRANTED re-entry is allowed (cyclic) but EXPIRED requires a fresh GRANT with a new ConsentRecord."
    transitions:
      - from: PENDING
        to: GRANTED
        trigger: "POST /api/circles/{circle_id}/members/{member_id}/consent/grant"
        actor: "Owner | Admin | self (adult only)"
        preconditions:
          - "If target is MINOR: actor must be OWNER or ADMIN and actor.id != target.id"
          - "If target is adult: actor must be target (self-grant) or OWNER"
          - "scope == FULL implies every narrower scope is also granted"
        side_effects:
          - "ConsentRecord appended (consent_action=GRANT)"
          - "Member.effective_sample_interval_seconds recomputed"
          - "increments Member.version"

      - from: GRANTED
        to: REVOKED
        trigger: "POST /api/circles/{circle_id}/members/{member_id}/consent/revoke"
        actor: "Owner | Admin | self"
        preconditions:
          - "If target is MINOR: only OWNER may revoke; ADMIN/self revoke rejected with ERR_MINOR_CONSENT_LOCKED"
        side_effects:
          - "ConsentRecord appended (consent_action=REVOKE)"
          - "LocationFix ingestion for this member -> REJECTED_CONSENT until re-GRANT"
          - "OPEN CrashEvents for this member transition to FALSE_ALARM (compensation)"
          - "OPEN WellnessChecks for this member -> CANCELLED"
          - "increments Member.version"

      - from: REVOKED
        to: GRANTED
        trigger: "POST /api/circles/{circle_id}/members/{member_id}/consent/grant"
        actor: "Owner | Admin | self (adult only)"
        preconditions:
          - "Same actor rules as PENDING->GRANTED"
        side_effects:
          - "ConsentRecord appended (consent_action=GRANT)"

      - from: GRANTED
        to: EXPIRED
        trigger: "system (data-sharing disclosure version bump: every GRANTED member with monetization_opt_in=true and no acknowledgment of the new disclosure within 30 days)"
        actor: system
        preconditions:
          - "A ComplianceHold of kind DATA_SHARING_DISCLOSURE is OPEN on the circle"
          - "Member has not acknowledged the new disclosure"
        side_effects:
          - "Opens a MINOR_PRIVACY_AUDIT ComplianceHold if member role == MINOR"
          - "Member privacy_mode forced to HIDDEN until re-GRANT"

      - from: EXPIRED
        to: GRANTED
        trigger: "POST /api/circles/{circle_id}/members/{member_id}/consent/grant"
        actor: "Owner | Admin | self (adult only)"
        preconditions:
          - "scope must be FULL (a partial re-grant is not accepted from EXPIRED)"
        side_effects:
          - "ConsentRecord appended (consent_action=GRANT)"

  - entity: Member
    field: privacy_mode
    initial_state: PRECISE
    terminal_states: []
    note: "Parallel dimension on Member. Changing privacy_mode on a MINOR from PRECISE/BLURRED to HIDDEN by an OWNER/ADMIN raises tension_flag=true (parent-teen tension handling)."
    transitions:
      - from: PRECISE
        to: BLURRED
        trigger: "PATCH /api/circles/{circle_id}/members/{member_id}/privacy"
        actor: "Owner | Admin | self"
        preconditions:
          - "If target is MINOR and actor != target: sets tension_flag=true"
        side_effects:
          - "increments Member.version"
          - "Future PlaceAlert confirmations for this member set visible_to_owner=true (BLURRED still reveals presence, only coordinates are jittered)"

      - from: [PRECISE, BLURRED]
        to: HIDDEN
        trigger: "PATCH /api/circles/{circle_id}/members/{member_id}/privacy"
        actor: "Owner | Admin | self"
        preconditions:
          - "consent_state == GRANTED (HIDDEN under REVOKED/EXPIRED is a no-op rejection ERR_CONSENT_NOT_GRANTED)"
        side_effects:
          - "increments Member.version"
          - "If target is MINOR and actor != target: tension_flag=true"
          - "OPEN CrashEvents for this member stay OPEN (safety override) but visible_to_owner on subsequent alerts becomes false"

      - from: HIDDEN
        to: PRECISE
        trigger: "PATCH /api/circles/{circle_id}/members/{member_id}/privacy"
        actor: "self only"
        preconditions:
          - "Only the member themselves may lift HIDDEN back to PRECISE (anti-coercion rule)"
        side_effects:
          - "increments Member.version"
          - "tension_flag cleared"

  - entity: TripReport
    field: trip_status
    initial_state: OPEN
    terminal_states: [CLOSED, ABANDONED]
    note: "A trip opens when a Member in consent_state==GRANTED posts a fix with motion_context==DRIVING and no OPEN trip exists. The trip closes on the first non-DRIVING fix OR after 600s without a DRIVING fix (timeout sweep), OR abandons if the member's circle FROZENs or consent is revoked mid-trip."
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "system (non-DRIVING fix accepted OR 600s gap)"
        actor: system
        preconditions: []
        side_effects:
          - "driver_score computed via calculations.driver_score (trip-level variant)"
          - "speed_event_count and phone_use_event_count finalized"
          - "Member rolling driver_score recomputed via calculations.driver_score (rolling variant)"

      - from: OPEN
        to: ABANDONED
        trigger: "system (circle posture -> FROZEN, or member consent_state leaves GRANTED)"
        actor: system
        preconditions: []
        side_effects:
          - "driver_score NOT computed (left null)"
          - "Does not contribute to rolling driver score"

  - entity: PlaceAlert
    field: alert_status
    initial_state: PENDING_DWELL
    terminal_states: [CONFIRMED, SUPPRESSED, CANCELLED]
    transitions:
      - from: PENDING_DWELL
        to: CONFIRMED
        trigger: "system (subsequent fix from same member in same Place with elapsed dwell >= place.dwell_bucket_seconds and circle posture == OPEN)"
        actor: system
        preconditions:
          - "window_close fix is ACCEPTED and inside the same geofence under calculations.geofence_membership"
          - "elapsed dwell (window_close.recorded_at - window_open.recorded_at) >= place.dwell_bucket_seconds"
          - "Circle.circle_posture == OPEN at confirmation time"
        side_effects:
          - "visible_to_owner computed from member.privacy_mode at confirmation"

      - from: PENDING_DWELL
        to: SUPPRESSED
        trigger: "system (window closes without meeting dwell, or posture leaves OPEN before confirmation, or privacy HIDDEN at confirmation time and notify flag would otherwise fire)"
        actor: system
        preconditions: []
        side_effects:
          - "suppressed_reason recorded: DUPLICATE_EVENT (window closed by an opposite-direction fix), TIER_HISTORY (posture froze), or PRIVACY_HIDDEN (member flipped to HIDDEN mid-window)"

      - from: PENDING_DWELL
        to: CANCELLED
        trigger: "system (member consent_state leaves GRANTED before confirmation)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CrashEvent
    field: crash_status
    initial_state: DETECTED
    terminal_states: [CONFIRMED_OK, RESOLVED, FALSE_ALARM]
    note: "Cyclic: DETECTED -> WELLNESS_PENDING -> ESCALATED -> DISPATCHED -> RESOLVED is the forward path; WELLNESS_PENDING -> CONFIRMED_OK (member ack) is the escape; any non-terminal state -> FALSE_ALARM is the compensation path; RESOLVED -> ESCALATED is FORBIDDEN."
    transitions:
      - from: DETECTED
        to: WELLNESS_PENDING
        trigger: "system (immediately on CrashEvent creation)"
        actor: system
        preconditions: []
        side_effects:
          - "WellnessCheck created with check_status=SENT and deadline_at per severity"
          - "increments CrashEvent.version"

      - from: WELLNESS_PENDING
        to: CONFIRMED_OK
        trigger: "POST /api/crash-events/{crash_event_id}/wellness-checks/{check_id}/acknowledge"
        actor: "self (member on whom crash was detected)"
        preconditions:
          - "now < WellnessCheck.deadline_at"
          - "actor member_id == CrashEvent.member_id"
        side_effects:
          - "WellnessCheck.check_status -> ACKNOWLEDGED"
          - "If an EmergencyDispatch exists with dispatch_status == PENDING_VERIFICATION, it transitions to CANCELLED (compensation)"
          - "increments CrashEvent.version"

      - from: WELLNESS_PENDING
        to: ESCALATED
        trigger: "system (wellness deadline passes with check_status == SENT, i.e. UNANSWERED)"
        actor: system
        preconditions:
          - "now >= WellnessCheck.deadline_at"
        side_effects:
          - "WellnessCheck.check_status -> UNANSWERED"
          - "EmergencyDispatch created with dispatch_status=PENDING_VERIFICATION"
          - "Circle assistance_units_balance decremented by 1 (roadside assistance / emergency response unit) — ERR_ASSISTANCE_UNITS_EXHAUSTED blocks escalation if balance is 0 and tier != PROTECT"
          - "increments CrashEvent.version"
          - "increments Circle.version"

      - from: ESCALATED
        to: DISPATCHED
        trigger: "POST /api/emergency-dispatches/{dispatch_id}/verify"
        actor: Owner
        preconditions:
          - "Actor is OWNER of the circle that owns the crash member"
          - "verification_note present (length >= 10 chars)"
        side_effects:
          - "EmergencyDispatch.dispatch_status -> VERIFIED -> STAGED atomically (staged_at set)"
          - "increments CrashEvent.version"

      - from: DISPATCHED
        to: RESOLVED
        trigger: "POST /api/emergency-dispatches/{dispatch_id}/complete"
        actor: Owner
        preconditions: []
        side_effects:
          - "EmergencyDispatch.dispatch_status -> COMPLETED"
          - "increments CrashEvent.version"

      - from: [DETECTED, WELLNESS_PENDING, ESCALATED]
        to: FALSE_ALARM
        trigger: "POST /api/crash-events/{crash_event_id}/mark-false-alarm"
        actor: "Owner | Admin | self"
        preconditions:
          - "false_alarm_reason required, length >= 5"
          - "Cannot mark FALSE_ALARM from DISPATCHED (units already consumed)"
        side_effects:
          - "WellnessCheck.check_status -> CANCELLED if still SENT"
          - "EmergencyDispatch.dispatch_status -> CANCELLED if PENDING_VERIFICATION or VERIFIED"
          - "If the crash had consumed an assistance unit (state >= ESCALATED before marking), refund: assistance_units_balance += 1 (compensating invariant, see calculations.assistance_unit_invariant)"
          - "increments CrashEvent.version"

  - entity: EmergencyDispatch
    field: dispatch_status
    initial_state: PENDING_VERIFICATION
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /api/emergency-dispatches/{dispatch_id}/verify"
        actor: Owner
        preconditions: ["verification_note >= 10 chars"]
        side_effects: []

      - from: VERIFIED
        to: STAGED
        trigger: "system (atomic follow-on to verify)"
        actor: system
        preconditions: []
        side_effects: ["staged_at = now"]

      - from: STAGED
        to: COMPLETED
        trigger: "POST /api/emergency-dispatches/{dispatch_id}/complete"
        actor: Owner
        preconditions: []
        side_effects: []

      - from: [PENDING_VERIFICATION, VERIFIED]
        to: CANCELLED
        trigger: "system (crash marked FALSE_ALARM) or POST /api/emergency-dispatches/{dispatch_id}/cancel"
        actor: "system | Owner"
        preconditions:
          - "Cannot cancel from STAGED or COMPLETED (ERR_DISPATCH_ALREADY_STAGED)"
        side_effects: []

  - entity: SubscriptionEvent
    field: event_kind
    initial_state: TIER_CHANGE
    terminal_states: []
    note: "Append-only ledger; each entry records a tier/assistance/identity-credit mutation on the owning Circle. There is no per-event state machine; the state machine lives on Circle.subscription_status (TRIALING -> ACTIVE -> PAST_DUE -> ACTIVE | SUSPENDED -> ACTIVE | CANCELLED) and is exercised via the subscription endpoints."

# =============================================================================
# §1.2.1 Concurrency Rules (OCC)
# =============================================================================
concurrency_rules:
  - rule_id: circle-subscription-stale-version
    parent_entity: Circle
    write_endpoint: "POST /api/circles/{circle_id}/subscription/change-tier"
    occ_field: "expected_circle_version"
    description: |
      Changing a Circle's subscription tier against a stale observed version is
      rejected. A subscription change legitimately mutates assistance-unit
      balances, history retention, and posture; two writers who each observed
      version V and both submit change-tier against V must not both succeed.
      The loser's request is rejected as ERR_STALE_VERSION.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: member-privacy-stale-version
    parent_entity: Member
    write_endpoint: "PATCH /api/circles/{circle_id}/members/{member_id}/privacy"
    occ_field: "expected_member_version"
    description: |
      Mutating a Member's privacy_mode requires expected_member_version equal
      to the member's current version. Privacy flips are observable and
      audit-relevant; a request carrying a version the member has already
      advanced past is rejected with ERR_STALE_VERSION.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: geofence_membership
    trigger: "On every ACCEPTED LocationFix; evaluated once per ACTIVE Place of the member's circle"
    algorithm: threshold
    formula: |
      # Boundary-precision: a fix is INSIDE the place iff:
      #   effective_radius_m = place.radius_m + min(fix.accuracy_m, place.accuracy_floor_m)
      #   haversine_m(fix, place.center) <= effective_radius_m
      # Accuracy contribution is CAPPED at place.accuracy_floor_m; a fix whose
      # reported accuracy_m > place.accuracy_floor_m is REJECTED_ACCURACY for
      # that place's purposes only (the fix itself may still be ACCEPTED for
      # trip purposes — acceptance and per-place evaluation are separate).
      # Boundary: `<=` (inclusive). A fix exactly at effective_radius_m is INSIDE.
      inside = haversine_m(fix, place.center) <= place.radius_m + min(fix.accuracy_m, place.accuracy_floor_m)
    input_set: "ACTIVE Places of the circle; the just-ACCEPTED LocationFix"
    constants:
      EARTH_RADIUS_M: 6371000
      BOUNDARY_OP: "<="
    precision: "haversine computed in metres to 0.1 m; comparison is exact"

  - name: effective_sample_interval
    trigger: "On every ACCEPTED LocationFix for the member; also on sampling_profile change and on tier change of the owning circle"
    algorithm: constraint_propagation
    formula: |
      # Combinatorial (mode a): 3+ inputs, non-linear interaction, tier cap.
      # base(profile): HIGH=15s, BALANCED=60s, SAVER=300s
      # motion modifier: DRIVING -> x0.25; WALKING -> x0.5; STILL -> x2.0; UNKNOWN -> x1.0
      # battery modifier: battery_pct <= 15 -> x2.0 (SAVER floor); 16..30 -> x1.5; >30 -> x1.0
      # tier floor (the CAP): FREE -> minimum 60s; PLUS -> minimum 30s; PROTECT -> minimum 15s
      # Evaluation order (pinned): compute raw = base * motion * battery; then
      # interval = max(raw, tier_floor); then clamp to [15, 900].
      # Nested rounding is forbidden — interval is integer seconds; the
      # multiplication chain uses round_half_up at the FINAL step only.
      raw = base_seconds(profile) * motion_multiplier(motion) * battery_multiplier(battery_pct)
      interval = clamp(round_half_up(max(raw, tier_floor(tier))), 15, 900)
    input_set: "Member.sampling_profile, current fix's motion_context and battery_pct, circle.subscription_tier"
    constants:
      BASE_HIGH: 15
      BASE_BALANCED: 60
      BASE_SAVER: 300
      MOTION_DRIVING: 0.25
      MOTION_WALKING: 0.5
      MOTION_STILL: 2.0
      MOTION_UNKNOWN: 1.0
      BATT_LOW_MULT: 2.0
      BATT_MID_MULT: 1.5
      TIER_FLOOR_FREE: 60
      TIER_FLOOR_PLUS: 30
      TIER_FLOOR_PROTECT: 15
      CLAMP_MIN: 15
      CLAMP_MAX: 900
    precision: "integer seconds, round_half_up applied once at final step"

  - name: crash_severity
    trigger: "On POST /api/crash-events (crash candidate reported with sensor summary)"
    algorithm: threshold
    formula: |
      # Boundary-precision: severity is a strict-threshold ladder on the
      # deceleration delta (in m/s^2) observed across the final trip segment.
      #   delta_v < 8  -> reject (ERR_CRASH_BELOW_THRESHOLD; no CrashEvent created)
      #   8  <= delta_v < 16 -> MINOR
      #   16 <= delta_v < 24 -> MAJOR
      #   24 <= delta_v      -> SEVERE
      # Boundary: `>=` on the lower edge, `<` on the upper edge. A delta of
      # exactly 16.0 is MAJOR (not MINOR); exactly 8.0 is MINOR; exactly 7.99
      # is rejected.
      if delta_v < 8.0: reject
      elif delta_v < 16.0: severity = MINOR
      elif delta_v < 24.0: severity = MAJOR
      else: severity = SEVERE
    input_set: "delta_v reported by the client, trip_report_id at OPEN state"
    constants:
      MINOR_FLOOR: 8.0
      MAJOR_FLOOR: 16.0
      SEVERE_FLOOR: 24.0
    precision: "delta_v compared at 2 decimal places"

  - name: trip_distance
    trigger: "On trip CLOSE transition"
    algorithm: aggregation
    formula: |
      # Combinatorial (mode b): NESTED ROUNDING, ORDER PINNED.
      # distance_m = sum over consecutive fix pairs of round_half_up(haversine_m(a, b))
      # The per-segment round to integer metres happens BEFORE summing.
      # Computing haversine on the full polyline and rounding once at the end
      # is FORBIDDEN and produces a different value.
      distance_m = sum(round_half_up(haversine_m(fix[i], fix[i+1])) for each consecutive ACCEPTED DRIVING fix pair)
    input_set: "ACCEPTED LocationFix rows of the member with motion_context == DRIVING and fix_status == ACCEPTED within [trip.started_at, trip.ended_at], ordered by recorded_at ASC; ties broken by created_at ASC"
    constants:
      EARTH_RADIUS_M: 6371000
    precision: "per-segment round_half_up to integer metre, then integer sum"

  - name: driver_score
    trigger: "On trip CLOSE (trip-level variant) AND on the daily rolling recompute (rolling variant)"
    algorithm: weighted_scoring
    formula: |
      # Dual-variant calculation. Two valid interpretations of "the driver's score":
      #   - trip variant: scored on THIS trip alone.
      #   - rolling variant: scored over the last 30 days of CLOSED trips.
      # Both use the same weighted formula; they differ ONLY in input set.
      # score = 100
      #       - 8 * min(speed_event_count, 5)
      #       - 5 * min(phone_use_event_count, 6)
      #       - 1 * floor(distance_m / 1609)  [per-mile wear component]
      # Clamped to [0, 100]. Integer arithmetic.
      score = clamp(100 - 8*min(speed_event_count,5) - 5*min(phone_use_event_count,6) - floor(distance_m/1609), 0, 100)
    input_set: "trip variant: single CLOSED TripReport. rolling variant: all CLOSED TripReports of the member with ended_at >= now - 30 days AND consent_state == GRANTED at end time; ABANDONED trips are excluded from both variants"
    constants:
      SPEED_EVENT_PENALTY: 8
      SPEED_EVENT_CAP: 5
      PHONE_EVENT_PENALTY: 5
      PHONE_EVENT_CAP: 6
      MILE_METRES: 1609
    precision: "integer 0..100"
    variants:
      - name: trip_level
        when: "On trip CLOSE; written to TripReport.driver_score"
        difference: "input set is exactly one trip"
      - name: rolling_30d
        when: "Computed on read of Member driver profile; never persisted on the trip row"
        difference: "input set is all CLOSED trips within the 30-day window; the same physical trips can produce a different score than the trip-level view"

  - name: assistance_unit_invariant
    trigger: "On every ESCALATED transition and every FALSE_ALARM compensation"
    algorithm: aggregation
    formula: |
      # Compensating invariant: a forward action paired with its compensation
      # leaves the named global quantity unchanged.
      #   CONSERVED: circle.assistance_units_balance at end of a compensated
      #   escalation equals the balance at start of the escalation.
      # Forward: ESCALATED  -> balance -= 1
      # Compensate: FALSE_ALARM from ESCALATED -> balance += 1
      # FALSE_ALARM from DISPATCHED (or beyond) does NOT compensate — units
      # already burned with the responder.
      invariant: balance_after(ESCALATED;FALSE_ALARM) == balance_before(ESCALATED)
    input_set: "the Circle owning the crash member"
    constants:
      UNIT_COST_ESCALATION: 1
    precision: "integer"

  - name: identity_credit_invariant
    trigger: "On identity_protection consumption and replenishment at billing anchor"
    algorithm: aggregation
    formula: |
      # Compensating invariant over identity_protection_credits within one
      # billing window: consumed + replenished - starting == 0 at anchor roll.
      #   start_of_window = tier_start (PROTECT=1, else 0)
      #   consumed_this_window = count of IDENTITY_CREDIT_CONSUME events with
      #     billing_period_index == current index
      #   invariant: identity_protection_credits == start_of_window - consumed_this_window
      # A consumption rejected with ERR_NO_IDENTITY_CREDIT does NOT append a
      # SubscriptionEvent and leaves the balance unchanged.
      invariant: identity_protection_credits == start_of_window - consumed_this_window
    input_set: "SubscriptionEvent rows of the circle in the current billing_period_index"
    constants:
      PROTECT_START_CREDITS: 1
    precision: "integer"

  - name: dwell_bucket_assignment
    trigger: "On PlaceAlert confirmation"
    algorithm: chronological
    formula: |
      # Combinatorial (mode c): CIRCULAR-LOOKING dependency, evaluation order
      # pinned. Place.dwell_bucket_seconds is one of {60, 180, 300}; the
      # dwell must be >= the bucket AND the fix pair's inter-arrival must be
      # compatible with the member's effective_sample_interval at window-open
      # (a window whose two fixes are separated by less than half the
      # effective sample interval cannot confirm, because the device could
      # not have resampled). But effective_sample_interval depends on
      # battery/motion which depends on the fixes in the window. Evaluation
      # order (PINNED):
      #   1. compute effective_sample_interval at window-open fix
      #   2. if (window_close.recorded_at - window_open.recorded_at) <
      #      0.5 * effective_sample_interval -> SUPPRESSED DUPLICATE_EVENT
      #   3. else if dwell >= place.dwell_bucket_seconds -> CONFIRMED
      #   4. else -> SUPPRESSED (dwell too short; suppressed_reason stays null)
      confirmable = (t_close - t_open) >= 0.5 * eff_interval AND (t_close - t_open) >= dwell_bucket
    input_set: "the window_open and window_close fixes; the Place row; the Member row at window-open time"
    constants:
      MIN_INTERVAL_FACTOR: 0.5
    precision: "integer seconds"

  - name: retention_window_cutoff
    trigger: "On every GET that lists LocationFix or TripReport history"
    algorithm: projection
    formula: |
      # visible history = rows with recorded_at >= now - history_retention_days
      # Boundary: `>=` (a row exactly at the cutoff is INCLUDED).
      # Rows older than the cutoff are not deleted but are excluded from list
      # responses; their fix_status is flipped to RETIRED by the daily sweep
      # (which is when the exclusion becomes observable on direct GET).
      cutoff = now - circle.history_retention_days * 86400
      visible = fix.recorded_at >= cutoff
    input_set: "LocationFix or TripReport rows of the circle"
    constants:
      DAY_SECONDS: 86400
    precision: "second precision"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role in {Owner, Admin, Member, Minor, System}; role names match the RBAC matrix"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Actor role is permitted by the endpoint's `roles:` list AND, for entity-backed roles, X-User-ID references a Member whose id matches the path-implied subject (or, for Owner/Admin, a Member of the same circle with role OWNER/ADMIN)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every path-templated id resolves: circle_id -> Circle, member_id -> Member of that circle, place_id -> Place of that circle, fix_id -> LocationFix of that member, crash_event_id -> CrashEvent, dispatch_id -> EmergencyDispatch of that crash"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: state
    check: "Target entity is in a state from which the requested transition is declared in §1.2 (e.g., wellness acknowledge from WELLNESS_PENDING only, mark-false-alarm not from DISPATCHED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 5
    category: state
    check: "Circle.circle_posture != FROZEN for any mutation other than subscription/reactivate or ComplianceHold resolve"
    error_id: ERR_CIRCLE_FROZEN
    http_status: 409
    applies_to: "all mutation endpoints under /api/circles/{circle_id}/... except subscription/reactivate and compliance-holds/{id}/resolve"

  - priority: 6
    category: state
    check: "Circle.circle_posture != RESTRICTED for assistance-unit-consuming operations (crash escalation, roadside assistance request)"
    error_id: ERR_CIRCLE_RESTRICTED
    http_status: 409
    applies_to: "POST /api/circles/{circle_id}/roadside-assistance; system escalation path"

  - priority: 7
    category: business_safety
    check: "Consent gate: any location-sharing, trip-scoring, crash-detection, or place-alert operation on a member requires consent_state == GRANTED; MINOR consent operations follow the stricter actor matrix in §1.2"
    error_id: ERR_CONSENT_NOT_GRANTED
    http_status: 409
    applies_to: "POST /api/circles/{circle_id}/members/{member_id}/fixes; POST /api/circles/{circle_id}/members/{member_id}/crash-events; GET history endpoints"

  - priority: 8
    category: business_safety
    check: "MINOR consent lock: a MINOR's GRANTED consent may be revoked only by the circle OWNER; ADMIN, other members, or the MINOR themselves receive ERR_MINOR_CONSENT_LOCKED"
    error_id: ERR_MINOR_CONSENT_LOCKED
    http_status: 403
    applies_to: "POST /api/circles/{circle_id}/members/{member_id}/consent/revoke"

  - priority: 9
    category: business_safety
    check: "Anti-coercion: privacy_mode HIDDEN -> PRECISE may only be performed by the member themselves (X-User-ID == member_id)"
    error_id: ERR_PRIVACY_SELF_ONLY
    http_status: 403
    applies_to: "PATCH /api/circles/{circle_id}/members/{member_id}/privacy"

  - priority: 10
    category: business_constraint
    check: "Place.radius_m within [50, 5000]; accuracy_floor_m within [10, 500]; dwell_bucket_seconds in {60, 180, 300}; notify flags boolean; lat/lng in range"
    error_id: ERR_PLACE_CONFIG_INVALID
    http_status: 422
    applies_to: "POST /api/circles/{circle_id}/places; PATCH /api/circles/{circle_id}/places/{place_id}"

  - priority: 11
    category: business_constraint
    check: "LocationFix.recorded_at within ±300s of server logical clock; accuracy_m > 0; speed_mps >= 0; battery_pct in 0..100; motion_context in enum"
    error_id: ERR_FIX_CLOCK_SKEW
    http_status: 422
    applies_to: "POST /api/circles/{circle_id}/members/{member_id}/fixes"

  - priority: 12
    category: business_temporal
    check: "Geofence overlap: a new or updated Place whose circle-radius (center, radius_m) intersects an existing ACTIVE Place of the same circle by more than 50% of the smaller radius area is rejected (treats two Places as covering the same physical fence)"
    error_id: ERR_PLACE_OVERLAP
    http_status: 409
    applies_to: "POST /api/circles/{circle_id}/places; PATCH /api/circles/{circle_id}/places/{place_id}"

  - priority: 13
    category: business_temporal
    check: "Wellness deadline: acknowledge is accepted only while now < deadline_at; at or after deadline, the system has already transitioned to ESCALATED and acknowledge returns ERR_WELLNESS_EXPIRED"
    error_id: ERR_WELLNESS_EXPIRED
    http_status: 409
    applies_to: "POST /api/crash-events/{crash_event_id}/wellness-checks/{check_id}/acknowledge"

  - priority: 14
    category: business_referential
    check: "Circle has at most one OWNER; transfer-ownership requires target consent GRANTED and role != MINOR; promoting a MINOR to ADMIN is rejected"
    error_id: ERR_ROLE_INCOMPATIBLE
    http_status: 409
    applies_to: "POST /api/circles/{circle_id}/transfer-ownership; POST /api/circles/{circle_id}/members/{member_id}/promote"

  - priority: 15
    category: business_referential
    check: "A CrashEvent may only be opened against an OPEN TripReport of the same member; a CLOSED or ABANDONED trip rejects the crash with ERR_TRIP_NOT_OPEN"
    error_id: ERR_TRIP_NOT_OPEN
    http_status: 409
    applies_to: "POST /api/circles/{circle_id}/members/{member_id}/crash-events"

  - priority: 16
    category: business_fiscal
    check: "assistance_units_balance > 0 required to consume a roadside-assistance unit (PROTECT tier may overdraw to -1 within the current window as a safety valve; FREE/PLUS may not)"
    error_id: ERR_ASSISTANCE_UNITS_EXHAUSTED
    http_status: 402
    applies_to: "POST /api/circles/{circle_id}/roadside-assistance; system escalation path"

  - priority: 17
    category: business_fiscal
    check: "identity_protection_credits > 0 required to consume an identity-protection credit (PROTECT only; other tiers have balance 0)"
    error_id: ERR_NO_IDENTITY_CREDIT
    http_status: 402
    applies_to: "POST /api/circles/{circle_id}/identity-protection/consume"

  - priority: 18
    category: business_fiscal
    check: "CrashEvent delta_v >= 8.0 (below threshold: no event created)"
    error_id: ERR_CRASH_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST /api/circles/{circle_id}/members/{member_id}/crash-events"

  - priority: 19
    category: business_constraint
    check: "OCC: expected_circle_version / expected_member_version matches current entity version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/circles/{circle_id}/subscription/change-tier; PATCH /api/circles/{circle_id}/members/{member_id}/privacy"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server logical clock. Server boots at 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock."
    roles: [System]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: ["triggers daily sweeps that are due (age sweep, retention sweep, wellness deadline sweep)"]

  # --- Circle ---
  - method: POST
    path: "/api/circles"
    description: "Create a circle; creating user becomes first Member with role OWNER and consent_state GRANTED (self-granted, scope FULL)"
    roles: [Owner]
    code: 201
    input: [name, subscription_tier, billing_anchor_day, owner_display_name, owner_birthdate, owner_email]
    output: Circle
    side_effects:
      - "Circle created with subscription_status=TRIALING, circle_posture=OPEN"
      - "First Member created with role=OWNER, consent_state=GRANTED"
      - "Circle.owner_member_id set to the new Member"
      - "assistance_units_balance initialized by tier (FREE=0, PLUS=2, PROTECT=4)"
      - "identity_protection_credits initialized (PROTECT=1 else 0)"
      - "history_retention_days initialized by tier (FREE=7, PLUS=30, PROTECT=60)"

  - method: GET
    path: "/api/circles/{id}"
    description: "Read a circle"
    roles: [Owner, Admin, Member, Minor, System]
    code: 200
    input: []
    output: Circle
    side_effects: []

  - method: GET
    path: "/api/circles"
    description: "List circles (paginated; owner_member_id filter supports FK reverse-reachability for Circle.owner_member_id)"
