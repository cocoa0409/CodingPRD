            - call: "POST /plan/applications/${app1_id}/market-rejections"
              payload: { rejecting_carrier_naic_code: "11111", rejection_date: "2026-08-10T00:00:00Z", reason_code: "UNACCEPTABLE_DRIVING_RECORD", document_reference: "DEC-29-1" }
              as: ProducerAgent
              as_user_id: "${p1_id}"
            - call: "POST /plan/applications/${app1_id}/market-rejections"
              payload: { rejecting_carrier_naic_code: "22222", rejection_date: "2026-08-12T00:00:00Z", reason_code: "UNDERWRITING_GUIDELINES", document_reference: "DEC-29-2" }
              as: ProducerAgent
              as_user_id: "${p1_id}"
            - call: "POST /plan/applications/${app1_id}/mvr-verification"
              payload: { verified_violations: [] }
              as: ComplianceExaminer
              as_user_id: "EX-1"
            - call: "POST /plan/applications/${app1_id}/deposit"
              payload: { amount_cents: 38939 }
              as: ProducerAgent
              as_user_id: "${p1_id}"
            - call: "POST /plan/applications/${app1_id}/certification"
              payload: { decision: "CERTIFY" }
              as: ComplianceExaminer
              as_user_id: "EX-1"
            - call: "POST /plan/assignment-cycles"
              payload: { plan_period_id: "${pp_id}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z" }
              as: PlanAdministrator
              captures: { cyc1_id: $.data.id }
            - call: "POST /plan/assignment-cycles/${cyc1_id}/run"
              as: PlanAdministrator
            - call: "GET /plan/assignments?application_id=${app1_id}"
              as: PlanAdministrator
              captures: { asg1_id: "$.data[0].id" }
          trigger:
            - call: "POST /plan/assignments/${asg1_id}/rescission"
              payload: { reason_code: "ASSIGNMENT_ERROR" }
              as: PlanAdministrator
          assert:
            - "Assignment.${asg1_id}.status == RESCINDED and Assignment.${asg1_id}.rescission_reason_code == ASSIGNMENT_ERROR"
            - "Carrier.${c1_id}.assigned_risk_count == 0 and Carrier.${c2_id}.assigned_risk_count == 0"
            - "the sum of assigned_risk_count over all carriers (0) equals the number of Assignment rows whose status is not in {RESCINDED, REASSIGNED, CLOSED} (0)"
            - "Carrier.${c1_id}.quota_variance_units == -1.0 and Carrier.${c1_id}.overallocated == false and Carrier.${c1_id}.posture == OPEN"
            - "Carrier.${c1_id}.performance_score == 100 (ASSIGNMENT_ERROR carries no score deduction)"
            - "Application.${app1_id}.status == CERTIFIED_AWAITING_ASSIGNMENT"
            - "AssignmentCycle.${cyc1_id}.assigned_count == 1 (historical counter is not rewound) and AssignmentCycle.${cyc1_id}.status == COMPLETED"
            - "PlanPeriod.${pp_id}.total_assignable_units == 1"
