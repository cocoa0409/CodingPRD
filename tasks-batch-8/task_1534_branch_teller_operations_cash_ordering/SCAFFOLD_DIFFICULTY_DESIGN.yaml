  - rule_id: cross_entity_state_dependency
    instances:
      - name: withdrawal_blocked_when_account_closed
        grounds:
          - state_machines.Account.OPEN_to_CLOSED
          - validations[priority=4]
          - errors[ERR_ACCOUNT_CLOSED]
        distinguishing_aspect: |
          TellerTransaction creation depends on the Account entity's state:
          after the account is closed, even a deposit is rejected with
          ERR_ACCOUNT_CLOSED — the transaction's valid set is gated by a
          different entity's lifecycle.
        test_recipe:
          setup:
            - "Branch B; teller T with OPEN drawer; account A with balance 0 that has been CLOSED"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id }
            - call: "POST /api/branches/${b_id}/tellers"
              payload: { display_name: "T" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { t_id: $.data.id }
            - call: "POST /api/branches/${b_id}/accounts"
              payload: { owner_name: "A", balance_cents: 0 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { a_id: $.data.id }
            - call: "POST /api/tellers/${t_id}/drawers"
              payload: {}
              as: HeadTeller
              as_user_id: "ht-1"
              captures: { d_id: $.data.id }
            - call: "POST /api/accounts/${a_id}/close"
              payload: {}
              as: BranchManager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /api/drawers/${d_id}/transactions"
              payload: { account_id: "${a_id}", type: "CASH_DEPOSIT", amount_cents: 100 }
              as: Teller
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ACCOUNT_CLOSED"
            - "Account.${a_id}.balance_cents == 0 (no side effects leaked through the rejected call)"

      - name: cash_order_deliver_blocked_while_branch_frozen
        grounds:
          - state_machines.Branch.OPEN_to_AUDIT_FROZEN
          - state_machines.CashOrder.APPROVED_to_DELIVERED
          - errors[ERR_BRANCH_FROZEN]
        distinguishing_aspect: |
          CashOrder DELIVERED depends on the Branch entity's state: an approved
          order whose delivery date has arrived still cannot deliver while a
          surprise audit holds the branch AUDIT_FROZEN — a different entity
          pair (CashOrder <- Branch) than the Account-gated transaction rule.
        test_recipe:
          setup:
            - "Branch B (vault 50000000); head teller places an order for 2026-08-31 with requested 500000; manager approves it"
            - "A SURPRISE audit freezes the branch; the clock is then advanced to the delivery date"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id, b_ver: $.data.version }
            - call: "POST /api/branches/${b_id}/tellers"
              payload: { display_name: "T" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { t_id: $.data.id }
            - call: "POST /api/branches/${b_id}/cash-orders"
              payload: { delivery_date: "2026-08-31", expected_branch_version: "${b_ver}", requested_amount_cents: 500000 }
              as: Teller
              as_user_id: "${t_id}"
              captures: { o_id: $.data.id, o_ordered: $.data.ordered_amount_cents }
            - call: "POST /api/cash-orders/${o_id}/approve"
              payload: {}
              as: BranchManager
              as_user_id: "mgr-1"
            - call: "POST /api/branches/${b_id}/audits"
              payload: { type: "SURPRISE" }
              as: Auditor
              as_user_id: "aud-1"
              captures: { au_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: BranchManager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /api/cash-orders/${o_id}/deliver"
              payload: {}
              as: HeadTeller
              as_user_id: "ht-1"
              captures: { err: $.data.error_id }
            - call: "POST /api/audits/${au_id}/complete"
              payload: { vault_counted_cents: 50000000, drawer_counts: [] }
              as: Auditor
              as_user_id: "aud-1"
            - call: "POST /api/cash-orders/${o_id}/deliver"
              payload: {}
              as: HeadTeller
              as_user_id: "ht-1"
              captures: { o_status: $.data.status }
            - call: "GET /api/branches/${b_id}"
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { vault: $.data.vault_cash_cents }
          assert:
            - "${o_ordered} == 500000"
            - "${err} == ERR_BRANCH_FROZEN (delivery date equality is necessary but not sufficient — the branch state gates it)"
            - "${o_status} == DELIVERED (once the audit completes and lifts the freeze)"
            - "${vault} == 50500000"

  - rule_id: resource_temporal_overlap
    instances:
      - name: cash_order_delivery_date_exclusion
        grounds:
          - validations[priority=6]
          - errors[ERR_DUPLICATE_CASH_ORDER]
          - entities.CashOrder.fields.delivery_date
        distinguishing_aspect: |
          Point-in-time interval semantics on CashOrder: a delivery_date is
          occupied by any order in PENDING or APPROVED; a second order for the
          same date is rejected, but rejecting the first order frees the date
          (status-scoped occupation, not history-scoped).
        test_recipe:
          setup:
            - "Branch B (vault 50000000); teller T exists"
            - "Order 1 for delivery 2026-08-31 exists and is PENDING"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id, b_ver: $.data.version }
            - call: "POST /api/branches/${b_id}/tellers"
              payload: { display_name: "T" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { t_id: $.data.id }
            - call: "POST /api/branches/${b_id}/cash-orders"
              payload: { delivery_date: "2026-08-31", expected_branch_version: "${b_ver}", requested_amount_cents: 100000 }
              as: Teller
              as_user_id: "${t_id}"
              captures: { o1: $.data.id }
            - call: "GET /api/branches/${b_id}"
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_ver2: $.data.version }
          trigger:
            - call: "POST /api/branches/${b_id}/cash-orders"
              payload: { delivery_date: "2026-08-31", expected_branch_version: "${b_ver2}", requested_amount_cents: 200000 }
              as: Teller
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
            - call: "POST /api/cash-orders/${o1}/reject"
              payload: {}
              as: BranchManager
              as_user_id: "mgr-1"
            - call: "GET /api/branches/${b_id}"
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_ver3: $.data.version }
            - call: "POST /api/branches/${b_id}/cash-orders"
              payload: { delivery_date: "2026-08-31", expected_branch_version: "${b_ver3}", requested_amount_cents: 200000 }
              as: Teller
              as_user_id: "${t_id}"
              captures: { o2_status: $.data.status, o2_ordered: $.data.ordered_amount_cents }
          assert:
            - "${err} == ERR_DUPLICATE_CASH_ORDER (date occupied by a PENDING order)"
            - "${o2_status} == PENDING (the date is free once order 1 is REJECTED)"
            - "${o2_ordered} == 200000"

      - name: audit_session_lifecycle_overlap_exclusion
        grounds:
          - validations[priority=6]
          - errors[ERR_AUDIT_IN_PROGRESS]
          - state_machines.AuditSession
        distinguishing_aspect: |
          Open-interval semantics on AuditSession (different from the
          delivery-date point semantics): a branch tolerates only one audit in
          PLANNED or IN_PROGRESS; completing the in-progress audit closes the
          interval and a SCHEDULED audit for a future weekday then succeeds.
        test_recipe:
          setup:
            - "Branch B (vault 50000000, no drawers)"
            - "A SURPRISE audit is IN_PROGRESS (branch frozen)"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id }
            - call: "POST /api/branches/${b_id}/audits"
              payload: { type: "SURPRISE" }
              as: Auditor
              as_user_id: "aud-1"
              captures: { au1: $.data.id, au1_status: $.data.status }
          trigger:
            - call: "POST /api/branches/${b_id}/audits"
              payload: { type: "SCHEDULED", scheduled_date: "2026-08-07" }
              as: Auditor
              as_user_id: "aud-1"
              captures: { err: $.data.error_id }
            - call: "POST /api/audits/${au1}/complete"
              payload: { vault_counted_cents: 50000000, drawer_counts: [] }
              as: Auditor
              as_user_id: "aud-1"
            - call: "POST /api/branches/${b_id}/audits"
              payload: { type: "SCHEDULED", scheduled_date: "2026-08-07" }
              as: Auditor
              as_user_id: "aud-1"
              captures: { au2_status: $.data.status, au2_date: $.data.scheduled_date }
          assert:
            - "${au1_status} == IN_PROGRESS (surprise audits are created in progress)"
            - "${err} == ERR_AUDIT_IN_PROGRESS (the PLANNED/IN_PROGRESS interval is occupied)"
            - "${au2_status} == PLANNED"
            - "${au2_date} == 2026-08-07"

  - rule_id: compensating_invariant
    instances:
      - name: buy_sell_movements_conserve_branch_cash_total
        grounds:
          - calculations.expected_drawer_cash
          - validations[priority=9]
        distinguishing_aspect: |
          Conserved quantity: physical branch cash (Branch.vault_cash_cents +
          sum of drawer cash_balance_cents). Buy and sell move cash between
          vault and drawer with zero drift — only customer transactions change
          the total.
        test_recipe:
          setup:
            - "Branch B (vault 50000000, drawer_limit 1000000); teller T with OPEN drawer; account A balance 0"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id }
            - call: "POST /api/branches/${b_id}/tellers"
              payload: { display_name: "T" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { t_id: $.data.id }
            - call: "POST /api/branches/${b_id}/accounts"
              payload: { owner_name: "A", balance_cents: 0 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { a_id: $.data.id }
            - call: "POST /api/tellers/${t_id}/drawers"
              payload: {}
              as: HeadTeller
              as_user_id: "ht-1"
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /api/drawers/${d_id}/buy-from-vault"
              payload: { amount_cents: 120000 }
              as: Teller
              as_user_id: "${t_id}"
              captures: { d_after_buy: $.data.cash_balance_cents }
            - call: "GET /api/branches/${b_id}"
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { v_after_buy: $.data.vault_cash_cents }
            - call: "POST /api/drawers/${d_id}/transactions"
              payload: { account_id: "${a_id}", type: "CASH_DEPOSIT", amount_cents: 900000 }
              as: Teller
              as_user_id: "${t_id}"
            - call: "POST /api/drawers/${d_id}/sell-to-vault"
              payload: { amount_cents: 60000 }
              as: Teller
              as_user_id: "${t_id}"
              captures: { d_after_sell: $.data.cash_balance_cents }
            - call: "GET /api/branches/${b_id}"
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { v_after_sell: $.data.vault_cash_cents }
          assert:
            - "${d_after_buy} == 120000 and ${v_after_buy} == 49880000 (sum 50000000 — buy conserved the total)"
            - "${d_after_sell} == 960000 and ${v_after_sell} == 49940000 (sum 50900000 — exactly the 900000 customer deposit above the original 50000000; the sell itself conserved the total)"

      - name: check_deposit_post_then_void_conserves_account_balance
        grounds:
          - calculations.hold_capture_amount
          - state_machines.TellerTransaction.POSTED_to_VOIDED
          - state_machines.Hold
        distinguishing_aspect: |
          Conserved quantity: the account ledger balance (a different
          conserved quantity than physical cash). Posting a 700000 check
          deposit splits credit into 20000 immediate + 680000 held
          (20000 + 680000 == 700000), and voiding before release restores the
          exact pre-deposit balance with no drift.
        test_recipe:
          setup:
            - "Branch B; teller T with OPEN drawer; account A with balance 100000"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id }
            - call: "POST /api/branches/${b_id}/tellers"
              payload: { display_name: "T" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { t_id: $.data.id }
            - call: "POST /api/branches/${b_id}/accounts"
              payload: { owner_name: "A", balance_cents: 100000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { a_id: $.data.id }
            - call: "POST /api/tellers/${t_id}/drawers"
              payload: {}
              as: HeadTeller
              as_user_id: "ht-1"
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /api/drawers/${d_id}/transactions"
              payload: { account_id: "${a_id}", type: "CHECK_DEPOSIT", amount_cents: 700000 }
              as: Teller
              as_user_id: "${t_id}"
              captures: { tx: $.data.id }
            - call: "GET /api/accounts/${a_id}"
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { bal_posted: $.data.balance_cents }
            - call: "GET /api/holds"
              payload: { transaction_id: "${tx}" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { h_id: "$.data[0].id", h_amt: "$.data[0].amount_cents", h_type: "$.data[0].hold_type", h_off: "$.data[0].release_day_offset" }
            - call: "POST /api/transactions/${tx}/void"
              payload: {}
              as: BranchManager
              as_user_id: "mgr-1"
            - call: "GET /api/accounts/${a_id}"
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { bal_voided: $.data.balance_cents }
            - call: "GET /api/holds/${h_id}"
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { h_status: $.data.status }
          assert:
            - "${bal_posted} == 120000 (only min(700000, 20000) credited at posting)"
            - "${h_amt} == 680000 and ${h_type} == LARGE_CHECK and ${h_off} == 7 (immediate + held == face: 20000 + 680000 == 700000)"
            - "${bal_voided} == 100000 (the void restores the exact pre-deposit balance — zero drift)"
            - "${h_status} == RELEASED (released WITHOUT crediting the held amount)"
