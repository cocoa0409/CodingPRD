            - "Student's one exclusive operation, POST /grade-disputes, succeeds under its own instance (errors/an_open_dispute_blocks_the_term_from_closing_until_it_is_resolved); every other role is refused there at HTTP 403"

      - name: no_role_can_reach_another_roles_exclusive_operations
        claim_type: exclusive_operations
        grounds:
          - roles[Registrar].exclusive_operations
          - roles[LmsAdmin].exclusive_operations
          - roles[Instructor].exclusive_operations
          - roles[Student].exclusive_operations
          - validations[2]
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "The negative half of the exclusivity matrix, and it is deliberately adversarial: the denied caller always holds a role that is legitimate SOMEWHERE (Registrar owns terms but not shells, LmsAdmin owns shells but not terms, Instructor owns content but not the clock, LmsAdmin may POST /content-items but may not DELETE one). An implementation that checks 'is this caller privileged at all' rather than 'is this caller's role in THIS endpoint's roles list' passes the positive instance and fails all ten of these."
