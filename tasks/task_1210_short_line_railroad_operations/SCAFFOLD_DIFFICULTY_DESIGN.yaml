  - rule_id: resource_temporal_overlap
    instances:
      - name: crew_call_half_open_window_overlap
        grounds:
          - validations[priority=6]
          - errors[ERR_CALL_WINDOW_OVERLAP]
          - entities.CrewCall.fields.scheduled_start_at
        distinguishing_aspect: |
          Half-open interval semantics on the CrewMember resource: a call starting exactly at the
          previous call's end (18:00 after [06:00, 18:00)) is ADJACENT and allowed, while a window
          starting at 17:00 overlaps and is rejected — [start, end) geometry, not closed intervals.
        test_recipe:
          setup:
            - "crew member with an existing call occupying [2026-05-02T06:00:00Z, 2026-05-02T18:00:00Z)"
            - "a movement exists as call target"
          setup_api_calls:
            - call: "POST /rail/crew-members"
              payload: { name: "K. Engineer", craft: ENGINEER }
              as: SystemAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /rail/track-segments"
              payload: { name: "Main MP 80-84", milepost_start: 80, milepost_end: 84, fra_class: CLASS_3 }
              as: SystemAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /rail/train-movements"
              payload: { symbol: "GW-801", route_segment_ids: ["${seg_id}"] }
              as: Dispatcher
              captures: { mov_id: $.data.id }
            - call: "POST /rail/crew-calls"
              payload: { crew_member_id: "${mem_id}", movement_id: "${mov_id}", scheduled_start_at: "2026-05-02T06:00:00Z", scheduled_end_at: "2026-05-02T18:00:00Z" }
              as: CrewCaller
              captures: { call1_id: $.data.id }
          trigger:
            - call: "POST /rail/crew-calls"
              payload: { crew_member_id: "${mem_id}", movement_id: "${mov_id}", scheduled_start_at: "2026-05-02T18:00:00Z", scheduled_end_at: "2026-05-03T06:00:00Z" }
              as: CrewCaller
              captures: { call2_id: $.data.id }
            - call: "POST /rail/crew-calls"
              payload: { crew_member_id: "${mem_id}", movement_id: "${mov_id}", scheduled_start_at: "2026-05-02T17:00:00Z", scheduled_end_at: "2026-05-03T05:00:00Z" }
              as: CrewCaller
              captures: { err3: $.data.error_id }
          assert:
            - "call1_id and call2_id are non-null UUIDs (adjacency at 18:00 allowed under half-open semantics)"
            - "captured err3 == ERR_CALL_WINDOW_OVERLAP ([17:00, +12h) intersects [06:00, 18:00))"

      - name: inspection_closed_day_buffer_overlap
        grounds:
          - validations[priority=6]
          - errors[ERR_INSPECTION_OVERLAP]
          - entities.TrackInspection.fields.scheduled_date
        distinguishing_aspect: |
          Closed day-interval semantics WITH a mandatory buffer on the TrackSegment resource (different
          resource and different geometry than the crew-call half-open rule): an inspection the very next
          day (gap < 1 full day) is rejected, and the first legal date is two days later — adjacency is
          forbidden here, whereas it is allowed for crew calls.
        test_recipe:
          setup:
            - "track segment with an inspection already scheduled for 2026-05-10"
          setup_api_calls:
            - call: "POST /rail/track-segments"
              payload: { name: "Branch MP 2-6", milepost_start: 2, milepost_end: 6, fra_class: CLASS_2 }
              as: SystemAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /rail/track-inspections"
              payload: { segment_id: "${seg_id}", scheduled_date: "2026-05-10" }
              as: TrackInspector
              captures: { insp1_id: $.data.id }
          trigger:
            - call: "POST /rail/track-inspections"
              payload: { segment_id: "${seg_id}", scheduled_date: "2026-05-11" }
              as: TrackInspector
              captures: { err_next_day: $.data.error_id }
            - call: "POST /rail/track-inspections"
              payload: { segment_id: "${seg_id}", scheduled_date: "2026-05-12" }
              as: TrackInspector
              captures: { insp2_id: $.data.id }
          assert:
            - "captured err_next_day == ERR_INSPECTION_OVERLAP (gap of 1 day < required 2-day date difference)"
            - "insp2_id is a non-null UUID (2026-05-12 differs from 2026-05-10 by exactly 2 days, the first legal slot)"

  - rule_id: compensating_invariant
    instances:
      - name: railcar_fleet_conservation
        grounds:
          - state_machines.Railcar
          - state_machines.CarOrder.FURNISHED_to_CANCELLED
          - entities.CarOrder.fields.cars_furnished_count
        distinguishing_aspect: |
          Conserved quantity = physical fleet count: furnish assigns 2 of 3 cars (AVAILABLE 3 -> 1),
          and the compensating cancel returns exactly those cars (AVAILABLE 1 -> 3); the pair of actions
          leaves count(Railcar by status summed over all statuses) == 3 with zero drift.
        test_recipe:
          setup:
            - "customer + siding; 3 HOME BOX railcars; an ACCEPTED order for 2 BOX cars, then furnished with count 2"
          setup_api_calls:
            - call: "POST /rail/customers"
              payload: { name: "Canal Aggregates", billing_email: "ap@canalagg.example" }
              as: SystemAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /rail/track-segments"
              payload: { name: "Main MP 90-93", milepost_start: 90, milepost_end: 93, fra_class: CLASS_2 }
              as: SystemAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /rail/industry-sidings"
              payload: { customer_id: "${cust_id}", name: "Canal Agg Siding", capacity_cars: 5, serving_track_segment_id: "${seg_id}", agreement_expires_on: "2027-01-01T00:00:00Z" }
              as: SystemAdmin
              captures: { sid_id: $.data.id }
            - call: "POST /rail/railcars"
              payload: { reporting_mark: "GNWR 8001", car_type: BOX, ownership: HOME, hire_rate_per_hour_cents: 0, hire_rate_per_mile_cents: 0 }
              as: SystemAdmin
            - call: "POST /rail/railcars"
              payload: { reporting_mark: "GNWR 8002", car_type: BOX, ownership: HOME, hire_rate_per_hour_cents: 0, hire_rate_per_mile_cents: 0 }
              as: SystemAdmin
            - call: "POST /rail/railcars"
              payload: { reporting_mark: "GNWR 8003", car_type: BOX, ownership: HOME, hire_rate_per_hour_cents: 0, hire_rate_per_mile_cents: 0 }
              as: SystemAdmin
            - call: "POST /rail/car-orders"
              payload: { customer_id: "${cust_id}", siding_id: "${sid_id}", car_type: BOX, quantity: 2, needed_by_date: "2026-05-20T00:00:00Z" }
              as: CustomerRep
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /rail/car-orders/${ord_id}/accept"
              payload: {}
              as: Dispatcher
            - call: "POST /rail/car-orders/${ord_id}/furnish"
              payload: { count: 2 }
              as: Dispatcher
              captures: { ord_furnished: $.data.cars_furnished_count }
          trigger:
            - call: "POST /rail/car-orders/${ord_id}/cancel"
              payload: {}
              as: CustomerRep
              as_user_id: "${cust_id}"
              captures: { ord_status: $.data.status }
            - call: "GET /rail/railcars"
              payload: { status: AVAILABLE }
              as: Dispatcher
          assert:
            - "captured ord_furnished == 2 (forward action assigned 2 cars)"
            - "captured ord_status == CANCELLED"
            - "GET /rail/railcars?status=AVAILABLE returns total_count == 3 (compensating action restored all cars)"
            - "GET /rail/railcars (unfiltered) returns total_count == 3 (fleet size invariant: furnish+cancel pair conserves car count)"

      - name: grant_award_conservation
        grounds:
          - calculations.grant_drawdown
          - calculations.project_percent_complete
          - state_machines.GrantMilestone
          - entities.GrantProject.fields.remaining_cents
        distinguishing_aspect: |
          Conserved quantity = award dollars (different quantity than physical car count): across approve,
          pay, reject, and resubmit, committed_cents + drawn_cents + remaining_cents == award_amount_cents
          == 1000000 at every step; the reject path compensates by never entering the committed pool.
        test_recipe:
          setup:
            - "ACTIVE project award 1000000 match 20; milestone A (value 400000, cost 500000) APPROVED then PAID"
            - "milestone B (value 400000, cost 200000) APPROVED; milestone C (value 200000, cost 100000) SUBMITTED then REJECTED"
          setup_api_calls:
            - call: "POST /rail/grant-projects"
              payload: { title: "Siding Renewal Program", grantor: "FRA CRISI", award_amount_cents: 1000000, required_match_pct: 20 }
              as: GrantManager
              captures: { proj_id: $.data.id }
            - call: "POST /rail/grant-projects/${proj_id}/activate"
              payload: {}
              as: GrantManager
            - call: "POST /rail/grant-projects/${proj_id}/milestones"
              payload: { name: "Phase A rail", milestone_value_cents: 400000 }
              as: GrantManager
              captures: { mA_id: $.data.id }
            - call: "POST /rail/grant-milestones/${mA_id}/submit"
              payload: { actual_cost_cents: 500000 }
              as: GrantManager
            - call: "POST /rail/grant-milestones/${mA_id}/approve"
              payload: {}
              as: RegulatorOfficer
            - call: "POST /rail/grant-milestones/${mA_id}/pay"
              payload: {}
              as: SettlementClerk
            - call: "POST /rail/grant-projects/${proj_id}/milestones"
              payload: { name: "Phase B ties", milestone_value_cents: 400000 }
              as: GrantManager
              captures: { mB_id: $.data.id }
            - call: "POST /rail/grant-milestones/${mB_id}/submit"
              payload: { actual_cost_cents: 200000 }
              as: GrantManager
            - call: "POST /rail/grant-milestones/${mB_id}/approve"
              payload: {}
              as: RegulatorOfficer
              captures: { mB_dd: $.data.drawdown_cents }
            - call: "POST /rail/grant-projects/${proj_id}/milestones"
              payload: { name: "Phase C ballast", milestone_value_cents: 200000 }
              as: GrantManager
              captures: { mC_id: $.data.id }
            - call: "POST /rail/grant-milestones/${mC_id}/submit"
              payload: { actual_cost_cents: 100000 }
              as: GrantManager
            - call: "POST /rail/grant-milestones/${mC_id}/reject"
              payload: {}
              as: RegulatorOfficer
          trigger:
            - call: "GET /rail/grant-projects/${proj_id}"
              payload: {}
              as: GrantManager
              captures: { p_committed: $.data.committed_cents, p_drawn: $.data.drawn_cents, p_remaining: $.data.remaining_cents, p_award: $.data.award_amount_cents, p_pct: $.data.percent_complete }
          assert:
            - "captured mB_dd == 160000"
            - "captured p_drawn == 400000 (milestone A PAID)"
            - "captured p_committed == 160000 (milestone B APPROVED; rejected C contributes 0)"
            - "captured p_remaining == 440000"
            - "p_committed + p_drawn + p_remaining == p_award == 1000000 (award-dollar conservation across approve/pay/reject)"
            - "captured p_pct == 80.00 (rejected milestone excluded from percent_complete)"
