  - rule_id: resource_temporal_overlap
    instances:
      - name: credential_coverage_closed_interval_touching_endpoints_collide
        grounds:
          - validations[priority=65]
          - errors[ERR_CREDENTIAL_COVERAGE_OVERLAP]
          - entities.ComplianceCredential.fields.effective_on
          - entities.ComplianceCredential.fields.expires_on
        distinguishing_aspect: |
          Resource entity: the Advisor's registration coverage, keyed by
          (advisor_id, credential_type, coverage key). Interval semantics: CLOSED on both ends,
          so a new period starting exactly on the day an existing one expires IS a collision —
          the opposite convention from the travel-window instance below. The coverage key is
          part of the resource identity, so a fully time-overlapping period for a different
          jurisdiction is accepted while a same-key touching period is refused, and a
          PENDING_REVIEW row occupies the resource just as a VERIFIED one does.
        test_recipe:
          setup:
            - "One advisor in NY, left in DRAFT (credential filing does not require activation)."
            - "A VERIFIED SELLER_OF_TRAVEL credential for NY covering 2026-01-01..2026-06-30."
            - "A PENDING_REVIEW EO_POLICY credential covering 2026-01-01..2027-01-01, undecided on purpose."
          setup_api_calls:
            - call: "POST /host-agency/advisors"
              payload: { legal_name: "Dana Reyes", email: "dana.reyes@example.com", seller_of_travel_state: "NY" }
              as: HostOperations
              captures: { adv_id: $.data.id }
            - call: "POST /host-agency/advisors/${adv_id}/credentials"
              payload: { credential_type: "SELLER_OF_TRAVEL", credential_number: "NY-SOT-40118", effective_on: "2026-01-01", expires_on: "2026-06-30", jurisdiction_state_code: "NY" }
              as: HostOperations
              captures: { cr_ny_h1_id: $.data.id }
            - call: "POST /host-agency/compliance-credentials/${cr_ny_h1_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /host-agency/advisors/${adv_id}/credentials"
              payload: { credential_type: "EO_POLICY", credential_number: "EO-99881", effective_on: "2026-01-01", expires_on: "2027-01-01", coverage_amount_cents: 100000000 }
              as: HostOperations
              captures: { cr_eo_id: $.data.id }
          trigger:
            - call: "POST /host-agency/advisors/${adv_id}/credentials"
              payload: { credential_type: "SELLER_OF_TRAVEL", credential_number: "NY-SOT-40119", effective_on: "2026-06-30", expires_on: "2026-12-31", jurisdiction_state_code: "NY" }
              as: HostOperations
              captures: { err_touch: $.data.error_id }
            - call: "POST /host-agency/advisors/${adv_id}/credentials"
              payload: { credential_type: "SELLER_OF_TRAVEL", credential_number: "NY-SOT-40120", effective_on: "2026-07-01", expires_on: "2026-12-31", jurisdiction_state_code: "NY" }
              as: HostOperations
              captures: { cr_ny_h2_id: $.data.id }
            - call: "POST /host-agency/advisors/${adv_id}/credentials"
              payload: { credential_type: "SELLER_OF_TRAVEL", credential_number: "FL-ST-88120", effective_on: "2026-01-01", expires_on: "2026-12-31", jurisdiction_state_code: "FL" }
              as: HostOperations
              captures: { cr_fl_id: $.data.id }
            - call: "POST /host-agency/advisors/${adv_id}/credentials"
              payload: { credential_type: "EO_POLICY", credential_number: "EO-99882", effective_on: "2026-06-01", expires_on: "2026-12-31", coverage_amount_cents: 100000000 }
              as: HostOperations
              captures: { err_eo: $.data.error_id }
          assert:
            - "TOUCHING SAME KEY: the 2026-06-30..2026-12-31 NY filing returns HTTP 409 with error_id == ERR_CREDENTIAL_COVERAGE_OVERLAP"
            - "STRICT HANDOVER: the 2026-07-01..2026-12-31 NY filing returns HTTP 201 and ComplianceCredential.${cr_ny_h2_id}.status == PENDING_REVIEW"
            - "DIFFERENT COVERAGE KEY: the fully time-overlapping FL filing returns HTTP 201 and ComplianceCredential.${cr_fl_id}.jurisdiction_state_code == FL"
            - "PENDING ROW STILL OCCUPIES: the second EO_POLICY filing returns HTTP 409 with error_id == ERR_CREDENTIAL_COVERAGE_OVERLAP even though ComplianceCredential.${cr_eo_id}.status == PENDING_REVIEW"
            - "GET /host-agency/compliance-credentials filtered by advisor_id == ${adv_id} returns exactly 4 rows"
            - "Advisor.${adv_id}.status == DRAFT throughout"

      - name: client_travel_window_half_open_aggregate_capacity
        grounds:
          - validations[priority=66]
          - errors[ERR_TRAVEL_WINDOW_CONFLICT]
          - entities.Client.fields.max_concurrent_trips
          - entities.Booking.fields.travel_start_date
          - entities.Booking.fields.travel_end_date
