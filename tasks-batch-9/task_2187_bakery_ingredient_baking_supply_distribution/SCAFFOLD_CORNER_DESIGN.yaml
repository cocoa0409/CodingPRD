  - section: cross_cutting_complexity_layers
    instances:
      - name: corner_layer_occ_order_version_stale_after_supersede_then_retry_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency.expected_order_version
          - endpoints.POST_substitution_requests
        distinguishing_aspect: "Raising a substitution supersedes the earlier REQUESTED one and bumps Order.version, so the specialist's second attempt with the pre-supersede token is a 412; re-reading the order and replaying with the fresh version succeeds and withdraws nothing further."
        test_recipe:
          setup:
            - "An ALLOCATED order with one line; a first substitution request already raised at version ${ov0} and superseded by a second one."
          setup_api_calls:
            - call: "POST /bakery-distribution/customers"
              payload: { legal_name: "OCC Order Bakery", allergen_program: "STANDARD", credit_limit_cents: 10000000, min_drop_cents: 1000 }
