# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Retail Checking & Savings Account — Expert band
# Breadth probe over §1.1–§1.7 per references/claim-extraction-guide.md.
# Every active instance's setup_api_calls is reachable from empty-DB via §1.5.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_customer_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Customer, endpoints./customers]
        distinguishing_aspect: "POST /customers with all required fields -> 201, response carries legal_name, date_of_birth, tax_id_last4, and computed cip_status == UNVERIFIED."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { legal_name: "New Person", date_of_birth: "1991-03-03", tax_id_last4: "2468", country_of_residence: "US" }
              as: Teller
              captures: { cid: $.data.id }
          assert:
            - "response status == 201"
            - "Customer.${cid}.legal_name == New Person"
            - "Customer.${cid}.cip_status == UNVERIFIED"

      - name: get_customer_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Customer, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /customers/{id} with a non-existent UUID -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /customers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Teller
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "$.data.error_id == ERR_NOT_FOUND"

      - name: create_customer_missing_required_field_rejected
        claim_type: Required Fields
        grounds: [entities.Customer.fields.legal_name, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /customers omitting legal_name -> 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { date_of_birth: "1991-03-03", tax_id_last4: "2468" }
              as: Teller
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "$.data.error_id == ERR_INVALID_REQUEST"

      - name: customer_country_default_us_applied
        claim_type: Defaults
        grounds: [entities.Customer.fields.country_of_residence]
        distinguishing_aspect: "Omitting country_of_residence defaults to US (kyc non-US weight not added)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { legal_name: "Default Country", date_of_birth: "1991-03-03", tax_id_last4: "2468" }
              as: Teller
              captures: { cid: $.data.id }
          assert:
            - "Customer.${cid}.country_of_residence == US"

      - name: account_system_balances_initialize_to_zero
        claim_type: Computed Fields
        grounds: [entities.Account.fields.ledger_balance_cents, entities.Account.fields.available_balance_cents]
        distinguishing_aspect: "A freshly opened Account has ledger_balance_cents == 0, hold_total_cents == 0, available_balance_cents == 0, od_nsf_items_today == 0."
        test_recipe:
          setup: ["A newly approved CHECKING account."]
          setup_api_calls:
            - call: "POST /apy-tiers"
              payload: { code: "CHK_STD", product_type: "CHECKING", min_balance_cents: 0, annual_rate_bps: 0 }
              as: ComplianceOfficer
            - call: "POST /customers"
              payload: { legal_name: "Zero Owner", date_of_birth: "1990-01-01", tax_id_last4: "2121", country_of_residence: "US" }
              as: Teller
              captures: { c0: $.data.id }
            - call: "POST /applications"
              payload: { customer_id: "${c0}", product_type: "CHECKING", requested_apy_tier_code: "CHK_STD" }
              as: Teller
              captures: { a0: $.data.id }
            - call: "POST /applications/${a0}/submit"
              payload: {}
              as: Teller
              as_user_id: "teller-1"
            - call: "POST /applications/${a0}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { acct0: $.data.opened_account_id }
          trigger:
            - call: "GET /accounts/${acct0}"
              payload: {}
              as: AccountHolder
              as_user_id: "${c0}"
          assert:
            - "Account.${acct0}.ledger_balance_cents == 0"
            - "Account.${acct0}.available_balance_cents == 0"
            - "Account.${acct0}.od_nsf_items_today == 0"

      - name: apy_tier_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.ApyTier]
        distinguishing_aspect: "ApyTier has common_fields:false — only id and created_at; no version field and no update endpoint exist in §1.5."
        test_recipe:
          setup: ["One APY tier created."]
          setup_api_calls:
            - call: "POST /apy-tiers"
              payload: { code: "CHK_STD", product_type: "CHECKING", min_balance_cents: 0, annual_rate_bps: 0 }
              as: ComplianceOfficer
              captures: { tc: $.data.code }
          trigger:
            - call: "GET /apy-tiers"
              payload: { product_type: "CHECKING" }
              as: ComplianceOfficer
          assert:
            - "the listed ApyTier carries id and created_at but no version field"
            - "no PUT/PATCH/DELETE endpoint for /apy-tiers exists in §1.5"

      - name: list_accounts_pagination_envelope
        claim_type: Listing
        grounds: [endpoints./accounts]
        distinguishing_aspect: "GET /accounts returns a paginated array envelope with total_count and has_more in meta-level pagination fields."
        test_recipe:
          setup: ["Two approved accounts exist."]
          setup_api_calls:
            - call: "POST /apy-tiers"
              payload: { code: "CHK_STD", product_type: "CHECKING", min_balance_cents: 0, annual_rate_bps: 0 }
              as: ComplianceOfficer
            - call: "POST /customers"
              payload: { legal_name: "L1", date_of_birth: "1990-01-01", tax_id_last4: "3131", country_of_residence: "US" }
              as: Teller
              captures: { cl1: $.data.id }
            - call: "POST /applications"
              payload: { customer_id: "${cl1}", product_type: "CHECKING", requested_apy_tier_code: "CHK_STD" }
              as: Teller
              captures: { al1: $.data.id }
            - call: "POST /applications/${al1}/submit"
              payload: {}
              as: Teller
              as_user_id: "teller-1"
            - call: "POST /applications/${al1}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "GET /accounts"
              payload: { limit: 10, offset: 0 }
              as: ComplianceOfficer
          assert:
            - "response_type == array"
            - "pagination total_count >= 1 and has_more == false"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: approve_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Application.SUBMITTED_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / invalid_state_beats_kyc_risk_on_approve
          rationale: "That §1.8 instance triggers approve on a DRAFT application and asserts ERR_INVALID_STATE."

      - name: double_submit_application_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Application.DRAFT_to_SUBMITTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Submitting an already-SUBMITTED application a second time -> 409 ERR_INVALID_STATE (DRAFT precondition fails)."
        test_recipe:
          setup: ["A SUBMITTED application."]
          setup_api_calls:
            - call: "POST /apy-tiers"
              payload: { code: "CHK_STD", product_type: "CHECKING", min_balance_cents: 0, annual_rate_bps: 0 }
              as: ComplianceOfficer
            - call: "POST /customers"
              payload: { legal_name: "Resub", date_of_birth: "1990-01-01", tax_id_last4: "4141", country_of_residence: "US" }
              as: Teller
              captures: { cr: $.data.id }
            - call: "POST /applications"
              payload: { customer_id: "${cr}", product_type: "CHECKING", requested_apy_tier_code: "CHK_STD" }
              as: Teller
              captures: { ar: $.data.id }
            - call: "POST /applications/${ar}/submit"
              payload: {}
              as: Teller
              as_user_id: "teller-1"
          trigger:
            - call: "POST /applications/${ar}/submit"
              payload: {}
              as: Teller
              as_user_id: "teller-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "$.data.error_id == ERR_INVALID_STATE"

      - name: terminal_rejected_application_cannot_approve
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Application.SUBMITTED_to_REJECTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A REJECTED application is terminal — a subsequent approve -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["A REJECTED application."]
          setup_api_calls:
            - call: "POST /apy-tiers"
              payload: { code: "CHK_STD", product_type: "CHECKING", min_balance_cents: 0, annual_rate_bps: 0 }
              as: ComplianceOfficer
            - call: "POST /customers"
              payload: { legal_name: "Rej Owner", date_of_birth: "1990-01-01", tax_id_last4: "5151", country_of_residence: "US" }
              as: Teller
              captures: { crj: $.data.id }
            - call: "POST /applications"
              payload: { customer_id: "${crj}", product_type: "CHECKING", requested_apy_tier_code: "CHK_STD" }
              as: Teller
              captures: { arj: $.data.id }
            - call: "POST /applications/${arj}/submit"
              payload: {}
              as: Teller
              as_user_id: "teller-1"
            - call: "POST /applications/${arj}/reject"
              payload: { rejection_reason_code: "DUPLICATE" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /applications/${arj}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-2"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "$.data.error_id == ERR_INVALID_STATE"

      - name: reject_sets_customer_cip_rejected
        claim_type: Side Effect Execution
        grounds: [state_machines.Application.SUBMITTED_to_REJECTED, calculations.cip_status_derivation, entities.Application.fields.rejection_reason_code]
        distinguishing_aspect: "Rejecting a SUBMITTED application sets rejection_reason_code and drives Customer.cip_status -> REJECTED."
        test_recipe:
          setup: ["A SUBMITTED application by teller-1."]
          setup_api_calls:
            - call: "POST /apy-tiers"
              payload: { code: "CHK_STD", product_type: "CHECKING", min_balance_cents: 0, annual_rate_bps: 0 }
              as: ComplianceOfficer
            - call: "POST /customers"
              payload: { legal_name: "CIP Rej", date_of_birth: "1990-01-01", tax_id_last4: "6161", country_of_residence: "US" }
              as: Teller
              captures: { ccr: $.data.id }
            - call: "POST /applications"
              payload: { customer_id: "${ccr}", product_type: "CHECKING", requested_apy_tier_code: "CHK_STD" }
              as: Teller
              captures: { acr: $.data.id }
            - call: "POST /applications/${acr}/submit"
              payload: {}
              as: Teller
              as_user_id: "teller-1"
          trigger:
            - call: "POST /applications/${acr}/reject"
              payload: { rejection_reason_code: "CIP_MISMATCH" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          assert:
            - "Application.${acr}.status == REJECTED"
            - "Application.${acr}.rejection_reason_code == CIP_MISMATCH"
            - "GET /customers/${ccr} -> Customer.cip_status == REJECTED"

      - name: close_nonzero_balance_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Account.ACTIVE_to_CLOSED, "validations[priority=11]", "errors[ERR_NONZERO_BALANCE]"]
        distinguishing_aspect: "Closing an account with ledger_balance_cents 5000 -> 409 ERR_NONZERO_BALANCE."
        test_recipe:
          setup: ["An ACTIVE account with ledger 5000."]
          setup_api_calls:
            - call: "POST /apy-tiers"
              payload: { code: "CHK_STD", product_type: "CHECKING", min_balance_cents: 0, annual_rate_bps: 0 }
              as: ComplianceOfficer
            - call: "POST /customers"
              payload: { legal_name: "Cl Owner", date_of_birth: "1990-01-01", tax_id_last4: "7171", country_of_residence: "US" }
              as: Teller
              captures: { ccl: $.data.id }
            - call: "POST /applications"
              payload: { customer_id: "${ccl}", product_type: "CHECKING", requested_apy_tier_code: "CHK_STD" }
              as: Teller
              captures: { acl: $.data.id }
            - call: "POST /applications/${acl}/submit"
              payload: {}
              as: Teller
              as_user_id: "teller-1"
            - call: "POST /applications/${acl}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { acctcl: $.data.opened_account_id }
            - call: "POST /accounts/${acctcl}/transactions"
              payload: { txn_type: "DEPOSIT", amount_cents: 5000 }
              as: AccountHolder
              as_user_id: "${ccl}"
          trigger:
            - call: "POST /accounts/${acctcl}/close"
              payload: {}
              as: AccountHolder
              as_user_id: "${ccl}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "$.data.error_id == ERR_NONZERO_BALANCE"

      - name: unfreeze_from_active_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Account.FROZEN_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Calling unfreeze on an ACTIVE (never frozen) account -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["A fresh ACTIVE account."]
          setup_api_calls:
            - call: "POST /apy-tiers"
              payload: { code: "CHK_STD", product_type: "CHECKING", min_balance_cents: 0, annual_rate_bps: 0 }
              as: ComplianceOfficer
            - call: "POST /customers"
              payload: { legal_name: "Uf Owner", date_of_birth: "1990-01-01", tax_id_last4: "8282", country_of_residence: "US" }
              as: Teller
              captures: { cuf: $.data.id }
            - call: "POST /applications"
              payload: { customer_id: "${cuf}", product_type: "CHECKING", requested_apy_tier_code: "CHK_STD" }
              as: Teller
              captures: { auf: $.data.id }
            - call: "POST /applications/${auf}/submit"
              payload: {}
              as: Teller
              as_user_id: "teller-1"
            - call: "POST /applications/${auf}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { acctuf: $.data.opened_account_id }
          trigger:
            - call: "POST /accounts/${acctuf}/unfreeze"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "$.data.error_id == ERR_INVALID_STATE"

      - name: dormant_to_active_revert_via_deposit
        claim_type: cyclic
        grounds: [state_machines.Account.DORMANT_to_ACTIVE]
        excluded_because:
          difficulty_instance: non_linear_state_machine / account_dormant_reactivation_cycle
          rationale: "That §1.8 instance drives ACTIVE->DORMANT->ACTIVE and asserts reactivation + last_activity_date reset."

  # ===========================================================================
  - section: calculations
    instances:
      - name: kyc_prior_rejection_weight_accumulates
        claim_type: Correct Result
        grounds: [calculations.kyc_risk_scoring, entities.Application.fields.kyc_risk_score]
        distinguishing_aspect: "A US adult applicant with 2 prior REJECTED applications scores 20 (min(2,3)*10) at submit."
        test_recipe:
          setup: ["A customer with 2 prior REJECTED applications, submitting a 3rd."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /apy-tiers"
              payload: { code: "CHK_STD", product_type: "CHECKING", min_balance_cents: 0, annual_rate_bps: 0 }
              as: ComplianceOfficer
            - call: "POST /customers"
              payload: { legal_name: "Repeat App", date_of_birth: "1985-01-01", tax_id_last4: "1818", country_of_residence: "US" }
              as: Teller
              captures: { crp: $.data.id }
            - call: "POST /applications"
              payload: { customer_id: "${crp}", product_type: "CHECKING", requested_apy_tier_code: "CHK_STD" }
              as: Teller
              captures: { ap1: $.data.id }
            - call: "POST /applications/${ap1}/submit"
              payload: {}
              as: Teller
              as_user_id: "teller-1"
            - call: "POST /applications/${ap1}/reject"
              payload: { rejection_reason_code: "DUPLICATE" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /applications"
              payload: { customer_id: "${crp}", product_type: "CHECKING", requested_apy_tier_code: "CHK_STD" }
              as: Teller
              captures: { ap2: $.data.id }
            - call: "POST /applications/${ap2}/submit"
              payload: {}
              as: Teller
              as_user_id: "teller-1"
            - call: "POST /applications/${ap2}/reject"
              payload: { rejection_reason_code: "DUPLICATE" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /applications"
              payload: { customer_id: "${crp}", product_type: "CHECKING", requested_apy_tier_code: "CHK_STD" }
              as: Teller
              captures: { ap3: $.data.id }
          trigger:
            - call: "POST /applications/${ap3}/submit"
              payload: {}
              as: Teller
              as_user_id: "teller-1"
              captures: { score: $.data.kyc_risk_score }
          assert:
            - "Application.${ap3}.kyc_risk_score == 20"

      - name: interest_truncates_subdollar_to_zero
        claim_type: Precision
        grounds: [calculations.interest_accrual_apy, entities.InterestPosting.fields.posted_interest_cents]
        distinguishing_aspect: "Interest on ledger 100 at 100 bps for 1 day floors to 0 cents (raw 0.0027 -> floor 0)."
        test_recipe:
          setup: ["Savings account ledger 100, tier code LOW (100 bps)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /apy-tiers"
              payload: { code: "LOW", product_type: "SAVINGS", min_balance_cents: 0, annual_rate_bps: 100 }
              as: ComplianceOfficer
            - call: "POST /customers"
              payload: { legal_name: "Tiny Saver", date_of_birth: "1980-01-01", tax_id_last4: "1919", country_of_residence: "US" }
              as: Teller
              captures: { cts: $.data.id }
            - call: "POST /applications"
              payload: { customer_id: "${cts}", product_type: "SAVINGS", requested_apy_tier_code: "LOW" }
              as: Teller
              captures: { ats: $.data.id }
            - call: "POST /applications/${ats}/submit"
              payload: {}
              as: Teller
              as_user_id: "teller-1"
            - call: "POST /applications/${ats}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { acctts: $.data.opened_account_id }
            - call: "POST /accounts/${acctts}/transactions"
              payload: { txn_type: "DEPOSIT", amount_cents: 100 }
              as: AccountHolder
              as_user_id: "${cts}"
          trigger:
            - call: "POST /accounts/${acctts}/post-interest"
              payload: { period_start_date: "2026-01-01", period_end_date: "2026-01-02" }
              as: ComplianceOfficer
              captures: { pid: $.data.id, posted: $.data.posted_interest_cents }
          assert:
            - "InterestPosting.${pid}.posted_interest_cents == 0"
            - "GET /accounts/${acctts} -> Account.ledger_balance_cents == 100"

      - name: fee_tier_daily_cap_fifth_item_zero
        claim_type: Constants Applied
        grounds: [calculations.overdraft_nsf_fee_tier, entities.FeeAssessment.fields.tier_ordinal]
        distinguishing_aspect: "The 5th fee-bearing item in one ledger day is charged 0 (daily cap of 4); tier ordinals 1..5 yield fees 3000,3500,3500,3500,0."
        test_recipe:
          setup: ["Account ledger 10000, courtesy opted in with limit 1000000; five sequential withdrawals each overdrawing."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /apy-tiers"
              payload: { code: "CHK_STD", product_type: "CHECKING", min_balance_cents: 0, annual_rate_bps: 0 }
              as: ComplianceOfficer
            - call: "POST /customers"
              payload: { legal_name: "Cap Owner", date_of_birth: "1990-01-01", tax_id_last4: "2323", country_of_residence: "US" }
              as: Teller
              captures: { ccap: $.data.id }
            - call: "POST /applications"
              payload: { customer_id: "${ccap}", product_type: "CHECKING", requested_apy_tier_code: "CHK_STD" }
              as: Teller
              captures: { acap: $.data.id }
            - call: "POST /applications/${acap}/submit"
              payload: {}
              as: Teller
              as_user_id: "teller-1"
            - call: "POST /applications/${acap}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { acctcap: $.data.opened_account_id }
            - call: "POST /accounts/${acctcap}/courtesy-pay"
              payload: { courtesy_pay_opted_in: true, courtesy_pay_limit_cents: 1000000 }
              as: AccountHolder
              as_user_id: "${ccap}"
            - call: "POST /accounts/${acctcap}/transactions"
              payload: { txn_type: "DEPOSIT", amount_cents: 10000 }
              as: AccountHolder
              as_user_id: "${ccap}"
            - call: "POST /accounts/${acctcap}/transactions"
              payload: { txn_type: "WITHDRAWAL", amount_cents: 11000 }
              as: AccountHolder
              as_user_id: "${ccap}"
            - call: "POST /accounts/${acctcap}/transactions"
              payload: { txn_type: "WITHDRAWAL", amount_cents: 1000 }
              as: AccountHolder
              as_user_id: "${ccap}"
            - call: "POST /accounts/${acctcap}/transactions"
              payload: { txn_type: "WITHDRAWAL", amount_cents: 1000 }
              as: AccountHolder
              as_user_id: "${ccap}"
            - call: "POST /accounts/${acctcap}/transactions"
              payload: { txn_type: "WITHDRAWAL", amount_cents: 1000 }
              as: AccountHolder
              as_user_id: "${ccap}"
          trigger:
            - call: "POST /accounts/${acctcap}/transactions"
              payload: { txn_type: "WITHDRAWAL", amount_cents: 1000 }
              as: AccountHolder
              as_user_id: "${ccap}"
              captures: { fifth_txn: $.data.id }
          assert:
            - "GET /accounts/${acctcap}/fee-assessments -> exactly 5 FeeAssessment rows with tier_ordinal 1..5"
            - "the tier_ordinal==5 FeeAssessment has fee_amount_cents == 0"
            - "sum of FeeAssessment.fee_amount_cents == 13500"

      - name: apy_tier_resolution_uses_account_tier_code
        claim_type: Input Set Filtering
