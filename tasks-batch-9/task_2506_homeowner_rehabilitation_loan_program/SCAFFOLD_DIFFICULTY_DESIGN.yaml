          trigger:
            - call: "POST /rehab/loans/${loan_id}/record-lien"
              payload: { lien_position: 2, recorded_instrument_number: "INS-2026-0D1" }
              as: LoanOfficer
              as_user_id: "lo-1"
            - call: "POST /rehab/draw-requests"
