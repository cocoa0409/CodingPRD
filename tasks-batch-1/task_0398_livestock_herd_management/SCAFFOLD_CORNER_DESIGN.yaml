              as: HerdManager
            - call: "POST /herds"
              payload: { name: "HO3", species: "CATTLE", premises_id: "PRO-3" }
              as: HerdManager
              captures: { ho3: $.data.id }
            - call: "POST /pastures"
              payload: { name: "OC", kind: "PEN", capacity_au: 10 }
