        distinguishing_aspect: |
          Empty-set/count boundary on a different metric (seat count) reached through a different
          endpoint (POST /author-events/{id}/tickets): with capacity==1 and tickets_sold==1, the
          available-seat set is empty, so the next booking fails ERR_EVENT_SOLD_OUT (tickets_sold < capacity
          is false at exactly capacity).
        test_recipe:
          setup:
            - "Clock default. Title T, future event E capacity 1, base 1000. M1 holds the only seat (tickets_sold=1). M2 tries to book."
          setup_api_calls:
            - call: "POST /members"
