# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3388_low_income_student_college_match_partner_placement
# 9 rules x 2 instances = 18 instances. Every instance grounds in SCAFFOLD.yaml
# §1.1–§1.7 and its setup chain replays only declared §1.5 endpoints.
# Canonical Cycle A window literals used throughout:
#   app     [2026-09-01T00:00:00Z, 2026-09-30T23:59:59Z]
#   ranking [2026-10-15T00:00:00Z, 2026-10-31T23:59:59Z]
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: efc_provisional_vs_verified_same_application
        grounds:
          - calculations.expected_family_contribution
          - entities.AidPackage.fields.aid_variant
          - state_machines.AidPackage.PROVISIONAL_to_FINALIZED
        distinguishing_aspect: |
          One application with fixed figures yields efc_cents 340000 under the
          PROVISIONAL variant and 453200 under the VERIFIED variant (finance /
          AidPackage domain) — the two variants are both valid algorithms over
          the same applicant and produce different money.
        test_recipe:
          setup:
            - "Cycle A in MATCH_RUN phase with match executed; one NO_LOAN college (coa 8000000, 1 slot, min_academic_index 0); student (income 6500000, size 4, assets 0, gpa 390, sat 1450) MATCHED with a PROVISIONAL package."
            - "A counselor-submitted IncomeVerification (verified income 6200000, assets 500000, size 4) decided VERIFY by an unrelated partner: |6200000-6500000|=300000 <= 10% of 6500000, so outcome VERIFIED."
          setup_api_calls:
            - &clock0
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - &mkcycle
              call: "POST /cycles"
              payload: { name: "Cycle A", app_opens_at: "2026-09-01T00:00:00Z", app_closes_at: "2026-09-30T23:59:59Z", ranking_opens_at: "2026-10-15T00:00:00Z", ranking_closes_at: "2026-10-31T23:59:59Z" }
              as: ProgramAdmin
              captures: { cyc: $.data.id }
            - &adv
              call: "POST /cycles/${cyc}/advance"
              as: ProgramAdmin
            - *adv
            - &mkcol_nl
              call: "POST /colleges"
              payload: { name: "NoLoan U", aid_policy: "NO_LOAN", min_academic_index: 0, match_slots: 1, coa_cents: 8000000 }
              as: ProgramAdmin
              captures: { col: $.data.id }
            - &mkcns
              call: "POST /counselors"
              payload: { full_name: "C One", school_name: "East High", state_code: "TX" }
              as: ProgramAdmin
              captures: { cns: $.data.id }
            - &mkprt
              call: "POST /community-partners"
              payload: { org_name: "Bridge Org", state_code: "TX", contact_email: "b@x.com" }
              as: ProgramAdmin
              captures: { prt: $.data.id }
            - &mkstu
              call: "POST /students"
              payload: { email: "s1@x.com", full_name: "Stu One", state_code: "TX", source: "SELF" }
              as: Anonymous
              captures: { stu: $.data.id }
            - &mkapp
              call: "POST /applications"
              payload: { cycle_id: "${cyc}", household_income_cents: 6500000, household_size: 4, self_reported_assets_cents: 0, gpa_scaled: 390, test_score: 1450 }
              as: Student
              as_user_id: "${stu}"
              captures: { app: $.data.id }
            - &submit
              call: "POST /applications/${app}/submit"
              as: Student
              as_user_id: "${stu}"
            - *adv
            - &review_fin
              call: "POST /applications/${app}/review"
              payload: { decision: "FINALIST" }
              as: ProgramAdmin
              captures: { app_v: $.data.version }
            - *adv
            - &clock_rank
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-16T00:00:00Z" }
              as: ProgramAdmin
            - &rank1
              call: "POST /applications/${app}/rankings"
              payload: { entries: [{ college_id: "${col}", rank_position: 1 }], expected_application_version: "${app_v}" }
              as: Student
              as_user_id: "${stu}"
            - &clock_nov
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: ProgramAdmin
            - *adv
            - &runmatch
              call: "POST /cycles/${cyc}/run-match"
              as: ProgramAdmin
            - &getmatch
              call: "GET /matches"
              payload: { application_id: "${app}" }
              as: ProgramAdmin
              captures: { m_id: "$.data[0].id" }
            - &getpkg
              call: "GET /aid-packages"
              payload: { match_id: "${m_id}" }
              as: ProgramAdmin
              captures: { pkg: "$.data[0].id" }
            - &mkiv
              call: "POST /income-verifications"
              payload: { application_id: "${app}", verified_income_cents: 6200000, verified_assets_cents: 500000, verified_household_size: 4 }
              as: Counselor
              as_user_id: "${cns}"
              captures: { iv: $.data.id }
            - &decide_verify
              call: "POST /income-verifications/${iv}/decide"
              payload: { decision: "VERIFY" }
              as: PartnerStaff
              as_user_id: "${prt}"
          trigger:
            - call: "GET /aid-packages/${pkg}"
              as: ProgramAdmin
              captures: { p_efc: $.data.efc_cents, p_grant: $.data.grant_cents, p_var: $.data.aid_variant }
            - call: "POST /aid-packages/${pkg}/finalize"
              as: CollegeOfficer
              as_user_id: "${col}"
            - call: "GET /aid-packages/${pkg}"
              as: ProgramAdmin
              captures: { f_efc: $.data.efc_cents, f_need: $.data.need_cents, f_grant: $.data.grant_cents, f_var: $.data.aid_variant, f_status: $.data.status }
          assert:
            - "before finalize: AidPackage.${pkg}.aid_variant == PROVISIONAL, efc_cents == 340000, grant_cents == 7360000 (captured p_var/p_efc/p_grant)"
            - "after finalize: aid_variant == VERIFIED, efc_cents == 453200, need_cents == 7546800, grant_cents == 7246800, status == FINALIZED (captured f_*)"
            - "AidPackage.${pkg}.work_study_cents == 300000 and loan_cents == 0 under both variants"
            - "the VERIFIED efc 453200 differs from the PROVISIONAL efc 340000 for identical applicant figures"

      - name: persistence_on_track_vs_cohort150
        grounds:
          - calculations.persistence_rates
          - entities.OutcomeRecord.fields.status
          - endpoints.GET_/cycles/{id}/outcome-summary
        distinguishing_aspect: |
          The same four OutcomeRecords (GRADUATED, PERSISTED_Y3, PERSISTED_Y2,
          STOPPED_OUT) yield on_track_rate_bp 7500 but cohort150_rate_bp 2500 —
          a dual-variant divergence in the OutcomeRecord domain, a different
          entity domain from the EFC instance.
        test_recipe:
          setup:
            - "Cycle A completed through match and enrollment: four students all matched at one NO_LOAN college with 4 slots, all enrolled, cycle advanced to OUTCOME_TRACKING."
            - "Outcome checkpoints applied: record 0 -> PERSISTED_Y2 -> PERSISTED_Y3 -> GRADUATED; record 1 -> PERSISTED_Y2; record 2 -> PERSISTED_Y2 -> PERSISTED_Y3; record 3 -> STOPPED_OUT."
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - call: "POST /colleges"
              payload: { name: "Four Slot College", aid_policy: "NO_LOAN", min_academic_index: 0, match_slots: 4, coa_cents: 8000000 }
              as: ProgramAdmin
              captures: { col: $.data.id }
            - call: "POST /students"
              payload: { email: "p1@x.com", full_name: "P One", state_code: "TX", source: "SELF" }
              as: Anonymous
              captures: { stu1: $.data.id }
            - call: "POST /students"
              payload: { email: "p2@x.com", full_name: "P Two", state_code: "TX", source: "SELF" }
              as: Anonymous
              captures: { stu2: $.data.id }
            - call: "POST /students"
              payload: { email: "p3@x.com", full_name: "P Three", state_code: "TX", source: "SELF" }
              as: Anonymous
              captures: { stu3: $.data.id }
            - call: "POST /students"
              payload: { email: "p4@x.com", full_name: "P Four", state_code: "TX", source: "SELF" }
              as: Anonymous
              captures: { stu4: $.data.id }
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", household_income_cents: 6500000, household_size: 4, gpa_scaled: 390, test_score: 1450 }
              as: Student
              as_user_id: "${stu1}"
              captures: { app1: $.data.id }
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", household_income_cents: 6500000, household_size: 4, gpa_scaled: 390, test_score: 1450 }
              as: Student
              as_user_id: "${stu2}"
              captures: { app2: $.data.id }
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", household_income_cents: 6500000, household_size: 4, gpa_scaled: 390, test_score: 1450 }
              as: Student
              as_user_id: "${stu3}"
              captures: { app3: $.data.id }
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", household_income_cents: 6500000, household_size: 4, gpa_scaled: 390, test_score: 1450 }
              as: Student
              as_user_id: "${stu4}"
              captures: { app4: $.data.id }
            - call: "POST /applications/${app1}/submit"
              as: Student
              as_user_id: "${stu1}"
            - call: "POST /applications/${app2}/submit"
              as: Student
              as_user_id: "${stu2}"
            - call: "POST /applications/${app3}/submit"
              as: Student
              as_user_id: "${stu3}"
            - call: "POST /applications/${app4}/submit"
              as: Student
              as_user_id: "${stu4}"
            - *adv
            - call: "POST /applications/${app1}/review"
              payload: { decision: "FINALIST" }
              as: ProgramAdmin
              captures: { av1: $.data.version }
            - call: "POST /applications/${app2}/review"
              payload: { decision: "FINALIST" }
              as: ProgramAdmin
              captures: { av2: $.data.version }
            - call: "POST /applications/${app3}/review"
              payload: { decision: "FINALIST" }
              as: ProgramAdmin
              captures: { av3: $.data.version }
            - call: "POST /applications/${app4}/review"
              payload: { decision: "FINALIST" }
              as: ProgramAdmin
              captures: { av4: $.data.version }
            - *adv
            - *clock_rank
            - call: "POST /applications/${app1}/rankings"
              payload: { entries: [{ college_id: "${col}", rank_position: 1 }], expected_application_version: "${av1}" }
              as: Student
              as_user_id: "${stu1}"
            - call: "POST /applications/${app2}/rankings"
              payload: { entries: [{ college_id: "${col}", rank_position: 1 }], expected_application_version: "${av2}" }
              as: Student
              as_user_id: "${stu2}"
            - call: "POST /applications/${app3}/rankings"
              payload: { entries: [{ college_id: "${col}", rank_position: 1 }], expected_application_version: "${av3}" }
              as: Student
              as_user_id: "${stu3}"
            - call: "POST /applications/${app4}/rankings"
              payload: { entries: [{ college_id: "${col}", rank_position: 1 }], expected_application_version: "${av4}" }
              as: Student
              as_user_id: "${stu4}"
            - *clock_nov
            - *adv
            - *runmatch
            - *adv
            - call: "GET /matches"
              payload: { cycle_id: "${cyc}" }
              as: ProgramAdmin
              captures: { m0: "$.data[0].id", m1: "$.data[1].id", m2: "$.data[2].id", m3: "$.data[3].id" }
            - call: "POST /matches/${m0}/enroll"
              as: CollegeOfficer
              as_user_id: "${col}"
            - call: "POST /matches/${m1}/enroll"
              as: CollegeOfficer
              as_user_id: "${col}"
            - call: "POST /matches/${m2}/enroll"
              as: CollegeOfficer
              as_user_id: "${col}"
            - call: "POST /matches/${m3}/enroll"
              as: CollegeOfficer
              as_user_id: "${col}"
            - *adv
            - call: "GET /outcomes"
              payload: { cycle_id: "${cyc}" }
              as: ProgramAdmin
              captures: { o0: "$.data[0].id", o1: "$.data[1].id", o2: "$.data[2].id", o3: "$.data[3].id" }
            - call: "POST /outcomes/${o0}/checkpoint"
              payload: { to_status: "PERSISTED_Y2" }
              as: CollegeOfficer
              as_user_id: "${col}"
            - call: "POST /outcomes/${o0}/checkpoint"
              payload: { to_status: "PERSISTED_Y3" }
              as: CollegeOfficer
              as_user_id: "${col}"
            - call: "POST /outcomes/${o0}/checkpoint"
              payload: { to_status: "GRADUATED" }
              as: CollegeOfficer
              as_user_id: "${col}"
            - call: "POST /outcomes/${o1}/checkpoint"
              payload: { to_status: "PERSISTED_Y2" }
              as: CollegeOfficer
              as_user_id: "${col}"
            - call: "POST /outcomes/${o2}/checkpoint"
              payload: { to_status: "PERSISTED_Y2" }
              as: CollegeOfficer
              as_user_id: "${col}"
            - call: "POST /outcomes/${o2}/checkpoint"
              payload: { to_status: "PERSISTED_Y3" }
              as: CollegeOfficer
              as_user_id: "${col}"
            - call: "POST /outcomes/${o3}/checkpoint"
              payload: { to_status: "STOPPED_OUT" }
              as: CollegeOfficer
              as_user_id: "${col}"
          trigger:
            - call: "GET /cycles/${cyc}/outcome-summary"
              as: ProgramAdmin
              captures: { den: $.data.on_track_denominator, ot: $.data.on_track_rate_bp, c150: $.data.cohort150_rate_bp, enr: $.data.enrolled_count }
          assert:
            - "enrolled_count == 4 and on_track_denominator == 4"
            - "on_track_numerator == 3 (PERSISTED_Y2 + PERSISTED_Y3 + GRADUATED) so on_track_rate_bp == 7500"
            - "cohort150_numerator == 1 (only GRADUATED) so cohort150_rate_bp == 2500"
            - "the two rates diverge on identical records: 7500 != 2500"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: priority_score_need_aware_branch_flips_regular_pool_order
        grounds:
          - calculations.match_priority_score
          - endpoints.GET_/colleges/{id}/regular-pool
          - entities.PartnerCollege.fields.aid_policy
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with a state-conditional branch. Applicant A
          (academic_index 985 + prep 40 + referral 25 = 1050; HIGH need) and
          applicant B (academic_index 1060, no bonuses) swap order purely on the
          viewing college's aid_policy: at the NO_LOAN college A scores 1065
          (first); at the MINIMAL_LOAN college A stays 1050 and B leads 1060.
        test_recipe:
          setup:
            - "Cycle A; two colleges: colN NO_LOAN and colM MINIMAL_LOAN. Student A is a prep-program alum (COMPLETED) with a counselor referral (CONVERTED), income 3000000 size 4 (need_tier HIGH), gpa 355 sat 1100 (academic_index 985). Student B: income 6500000 size 4 (STANDARD), gpa 375 sat 1240 (academic_index 1060), no prep, no referral."
            - "Both are FINALIST with no ranking submission; advancing RANKING -> MATCH_RUN moves both to REGULAR_POOL."
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - call: "POST /colleges"
              payload: { name: "NoLoan College", aid_policy: "NO_LOAN", min_academic_index: 0, match_slots: 1, coa_cents: 8000000 }
              as: ProgramAdmin
              captures: { colN: $.data.id }
            - call: "POST /colleges"
              payload: { name: "MinLoan College", aid_policy: "MINIMAL_LOAN", min_academic_index: 0, match_slots: 1, coa_cents: 8000000 }
              as: ProgramAdmin
              captures: { colM: $.data.id }
            - *mkcns
            - call: "POST /students"
              payload: { email: "a@x.com", full_name: "A Applicant", state_code: "TX", source: "COUNSELOR" }
              as: Anonymous
              captures: { stuA: $.data.id }
            - call: "POST /students"
              payload: { email: "b@x.com", full_name: "B Applicant", state_code: "TX", source: "SELF" }
              as: Anonymous
              captures: { stuB: $.data.id }
            - call: "POST /referrals"
              payload: { student_id: "${stuA}", cycle_id: "${cyc}", note: "nominated" }
              as: Counselor
              as_user_id: "${cns}"
              captures: { refA: $.data.id }
            - call: "POST /prep-programs"
              payload: { student_id: "${stuA}", program_type: "SUMMER", cohort_label: "summer-2026", starts_on: "2026-06-01T00:00:00Z", ends_on: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { prepA: $.data.id }
            - call: "POST /prep-programs/${prepA}/close"
              payload: { outcome: "COMPLETED" }
              as: ProgramAdmin
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", referral_id: "${refA}", household_income_cents: 3000000, household_size: 4, gpa_scaled: 355, test_score: 1100 }
              as: Student
              as_user_id: "${stuA}"
              captures: { appA: $.data.id }
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", household_income_cents: 6500000, household_size: 4, gpa_scaled: 375, test_score: 1240 }
              as: Student
              as_user_id: "${stuB}"
              captures: { appB: $.data.id }
            - call: "POST /applications/${appA}/submit"
              as: Student
              as_user_id: "${stuA}"
            - call: "POST /applications/${appB}/submit"
              as: Student
              as_user_id: "${stuB}"
            - *adv
            - call: "POST /applications/${appA}/review"
              payload: { decision: "FINALIST" }
              as: ProgramAdmin
            - call: "POST /applications/${appB}/review"
              payload: { decision: "FINALIST" }
              as: ProgramAdmin
            - *adv
            - *clock_nov
            - *adv
          trigger:
            - call: "GET /colleges/${colN}/regular-pool"
              payload: { cycle_id: "${cyc}" }
              as: CollegeOfficer
              as_user_id: "${colN}"
              captures: { n_first: "$.data[0].id", n_second: "$.data[1].id" }
            - call: "GET /colleges/${colM}/regular-pool"
              payload: { cycle_id: "${cyc}" }
              as: CollegeOfficer
              as_user_id: "${colM}"
              captures: { m_first: "$.data[0].id", m_second: "$.data[1].id" }
          assert:
            - "at the NO_LOAN college the first row is ${appA} and the second is ${appB} (A: 985+40+25+15 == 1065 > B: 1060)"
            - "at the MINIMAL_LOAN college the first row is ${appB} and the second is ${appA} (B: 1060 > A: 985+40+25 == 1050)"
            - "Application.${appA}.academic_index == 985 and Application.${appB}.academic_index == 1060 (sanity on the base score)"

      - name: aid_composition_per_component_rounding
        grounds:
          - calculations.aid_package_composition
          - entities.AidPackage.fields.grant_cents
          - entities.AidPackage.fields.work_study_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order. With need_cents 1000005 the pinned
          per-component order rounds work_study first (round_half_up(100000.5)
          == 100001) and grant absorbs the remainder (1000005 - 100001 ==
          900004); the sum-then-round alternative would report grant 900005.
          Different mode from the priority-score instance (mode a).
        test_recipe:
          setup:
            - "Cycle A through match run; one NO_LOAN college with coa_cents 1000005, 1 slot, min_academic_index 0; student income 1000000 size 4 (efc 0), gpa 390 sat 1450; matched, package PROVISIONAL."
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - call: "POST /colleges"
              payload: { name: "Round College", aid_policy: "NO_LOAN", min_academic_index: 0, match_slots: 1, coa_cents: 1000005 }
              as: ProgramAdmin
              captures: { col: $.data.id }
            - *mkstu
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", household_income_cents: 1000000, household_size: 4, gpa_scaled: 390, test_score: 1450 }
              as: Student
              as_user_id: "${stu}"
              captures: { app: $.data.id }
            - *submit
            - *adv
            - *review_fin
            - *adv
            - *clock_rank
            - *rank1
            - *clock_nov
            - *adv
            - *runmatch
            - *getmatch
            - *getpkg
          trigger:
            - call: "GET /aid-packages/${pkg}"
              as: ProgramAdmin
              captures: { r_efc: $.data.efc_cents, r_need: $.data.need_cents, r_work: $.data.work_study_cents, r_loan: $.data.loan_cents, r_grant: $.data.grant_cents }
          assert:
            - "efc_cents == 0 (income 1000000 is below the provisional allowance 4800000)"
            - "need_cents == 1000005"
            - "work_study_cents == 100001 (round_half_up(1000005 * 0.10) = round_half_up(100000.5), below the 300000 cap)"
            - "grant_cents == 900004 (unrounded remainder 1000005 - 100001 - 0), not the 900005 a sum-then-round order would give"
            - "loan_cents == 0 (NO_LOAN policy)"
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: application_revision_loop_and_release_reentry
        grounds:
          - state_machines.Application.RANKING_SUBMITTED_to_RANKING_SUBMITTED
          - state_machines.Application.MATCHED_to_REGULAR_POOL
          - state_machines.Application.REGULAR_POOL_to_ADMITTED_REGULAR
        distinguishing_aspect: |
          The Application machine is non-linear: a RANKING_SUBMITTED ->
          RANKING_SUBMITTED revision self-loop, a MATCHED | UNMATCHED fork, and
          a release-driven MATCHED -> REGULAR_POOL re-entry that returns the
          application to an earlier branching state. The companion instance is
          on AidPackage, a different entity.
        test_recipe:
          setup:
            - "Cycle A; two ACTIVE NO_LOAN colleges c1 and c2 (1 slot each, min_academic_index 0); one finalist who has submitted a first ranking list [c1] (list_seq 1)."
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - call: "POST /colleges"
              payload: { name: "College One", aid_policy: "NO_LOAN", min_academic_index: 0, match_slots: 1, coa_cents: 8000000 }
              as: ProgramAdmin
              captures: { c1: $.data.id }
            - call: "POST /colleges"
              payload: { name: "College Two", aid_policy: "NO_LOAN", min_academic_index: 0, match_slots: 1, coa_cents: 8000000 }
              as: ProgramAdmin
              captures: { c2: $.data.id }
            - *mkstu
            - *mkapp
            - *submit
            - *adv
            - *review_fin
            - *adv
            - *clock_rank
            - call: "POST /applications/${app}/rankings"
              payload: { entries: [{ college_id: "${c1}", rank_position: 1 }], expected_application_version: "${app_v}" }
              as: Student
              as_user_id: "${stu}"
              captures: { app_v: $.data.version }
          trigger:
            - call: "POST /applications/${app}/rankings"
              payload: { entries: [{ college_id: "${c2}", rank_position: 1 }, { college_id: "${c1}", rank_position: 2 }], expected_application_version: "${app_v}" }
              as: Student
              as_user_id: "${stu}"
              captures: { app_v2: $.data.version, app_status2: $.data.status }
            - call: "GET /applications/${app}/rankings"
              as: Student
              as_user_id: "${stu}"
              captures: { seq_seen: "$.data[0].list_seq", first_col: "$.data[0].college_id" }
            - *clock_nov
            - *adv
            - *runmatch
            - call: "GET /applications/${app}"
              as: ProgramAdmin
              captures: { st_matched: $.data.status, mc: $.data.matched_college_id }
            - *getmatch
            - call: "POST /matches/${m_id}/release"
              payload: { reason: "extenuating circumstances" }
              as: ProgramAdmin
            - call: "GET /applications/${app}"
              as: ProgramAdmin
              captures: { st_pool: $.data.status, mc_after: $.data.matched_college_id }
            - *adv
            - call: "POST /applications/${app}/regular-decision"
              payload: { decision: "ADMIT" }
              as: CollegeOfficer
              as_user_id: "${c1}"
              captures: { st_admit: $.data.status }
          assert:
            - "resubmission succeeds from RANKING_SUBMITTED: app_status2 == RANKING_SUBMITTED and the version advanced (${app_v2} == ${app_v} + 1)"
            - "the second list replaced the first: latest RankingEntry rows carry list_seq 2 and the row at rank_position 1 names college ${c2}"
            - "run-match matched the student to ${c2} (st_matched == MATCHED, matched_college_id == ${c2}, rank_position_awarded == 1)"
            - "after release: st_pool == REGULAR_POOL and matched_college_id is null (release-driven re-entry)"
            - "after a college ADMIT in REGULAR_DECISION: st_admit == ADMITTED_REGULAR"

      - name: aid_package_finalize_revise_finalize_cycle
        grounds:
          - state_machines.AidPackage.FINALIZED_to_REVISED
          - state_machines.AidPackage.REVISED_to_FINALIZED
          - concurrency_rules[aid-revise-occ]
        distinguishing_aspect: |
          The AidPackage machine cycles FINALIZED -> REVISED -> FINALIZED with
          recomputation at each pass — a revision loop on a different entity
          from the Application machine of the companion instance.
        test_recipe:
          setup:
            - "Cycle A; one matched student at a NO_LOAN college (coa 8000000) whose package is FINALIZED under the VERIFIED variant (efc 453200, grant 7246800)."
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - *mkcol_nl
            - *mkcns
            - *mkprt
            - *mkstu
            - *mkapp
            - *submit
            - *adv
            - *review_fin
            - *adv
            - *clock_rank
            - *rank1
            - *clock_nov
            - *adv
            - *runmatch
            - *getmatch
            - *getpkg
            - *mkiv
            - *decide_verify
            - call: "POST /aid-packages/${pkg}/finalize"
              as: CollegeOfficer
              as_user_id: "${col}"
              captures: { pkg_v: $.data.version }
          trigger:
            - call: "POST /aid-packages/${pkg}/revise"
              payload: { coa_cents: 8100000, expected_aid_package_version: "${pkg_v}" }
              as: CollegeOfficer
              as_user_id: "${col}"
              captures: { rev_status: $.data.status, rev_grant: $.data.grant_cents, rev_v: $.data.version }
            - call: "POST /aid-packages/${pkg}/finalize"
              as: CollegeOfficer
              as_user_id: "${col}"
              captures: { fin_status: $.data.status, fin_grant: $.data.grant_cents, fin_var: $.data.aid_variant }
          assert:
            - "after revise: status == REVISED, grant_cents == 7346800 (need 7646800 = 8100000 - 453200; work 300000; grant = 7646800 - 300000)"
            - "after the second finalize: status == FINALIZED and aid_variant == VERIFIED (revision kept the variant)"
            - "AidPackage.${pkg}.efc_cents == 453200 throughout (revision changed coa only)"
            - "the loop is legal: REVISED -> FINALIZED is a declared transition, completing the cycle FINALIZED -> REVISED -> FINALIZED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: run_match_four_hop_cascade
        grounds:
          - state_machines.Application.RANKING_LOCKED_to_MATCHED
          - calculations.binding_match_assignment
          - entities.PartnerCollege.fields.slots_committed
          - entities.AidPackage.fields.guaranteed_full_need
          - entities.Student.fields.student_stage
        distinguishing_aspect: |
          Depth-4 cascade from run-match: application transition (hop 1) creates
          the Match (hop 2), Match creation creates the PROVISIONAL AidPackage
          and bumps college.slots_committed (hop 3), and the same chain advances
          student_stage to MATCHED (hop 4) — each hop caused by the previous one.
        test_recipe:
          setup:
            - "Cycle A in RANKING phase with one finalist whose ranking list [col] is submitted and the clock advanced past ranking_closes_at; college is a NO_LOAN partner with coa 8000000 and 1 slot."
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - *mkcol_nl
            - *mkstu
            - *mkapp
            - *submit
            - *adv
            - *review_fin
            - *adv
            - *clock_rank
            - *rank1
            - *clock_nov
          trigger:
            - *adv
            - *runmatch
            - call: "GET /applications/${app}"
              as: ProgramAdmin
              captures: { h1_status: $.data.status, h1_col: $.data.matched_college_id }
            - *getmatch
            - call: "GET /matches/${m_id}"
              as: ProgramAdmin
              captures: { h2_status: $.data.status, h2_rank: $.data.rank_position_awarded }
            - *getpkg
            - call: "GET /aid-packages/${pkg}"
              as: ProgramAdmin
              captures: { h3_status: $.data.status, h3_gfn: $.data.guaranteed_full_need, h3_coa: $.data.coa_cents }
            - call: "GET /colleges/${col}"
              as: ProgramAdmin
              captures: { h3_slots: $.data.slots_committed }
            - call: "GET /students/${stu}"
              as: ProgramAdmin
              captures: { h4_stage: $.data.student_stage }
          assert:
            - "hop 1: Application.${app}.status == MATCHED and matched_college_id == ${col}"
            - "hop 2: Match.${m_id}.status == BINDING and rank_position_awarded == 1"
            - "hop 3: AidPackage.${pkg} exists with status PROVISIONAL, guaranteed_full_need == true, coa_cents == 8000000 (copied), and PartnerCollege.${col}.slots_committed == 1"
            - "hop 4: Student.${stu}.student_stage == MATCHED"

      - name: match_release_compensation_cascade
        grounds:
          - state_machines.Match.BINDING_to_RELEASED
          - state_machines.AidPackage
          - state_machines.Application.MATCHED_to_REGULAR_POOL
          - entities.PartnerCollege.fields.slots_committed
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger (POST /matches/{id}/release,
          not run-match): the release transition (hop 1) voids the AidPackage
          and frees the slot (hop 2), which returns the Application to
          REGULAR_POOL (hop 3) and demotes the student stage.
        test_recipe:
          setup:
            - "Cycle A with the match run complete: one student MATCHED at a NO_LOAN college (slots_committed 1), AidPackage PROVISIONAL in place."
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - *mkcol_nl
            - *mkstu
            - *mkapp
            - *submit
            - *adv
            - *review_fin
            - *adv
            - *clock_rank
            - *rank1
            - *clock_nov
            - *adv
            - *runmatch
            - *getmatch
            - *getpkg
          trigger:
            - call: "POST /matches/${m_id}/release"
              payload: { reason: "family relocation" }
              as: ProgramAdmin
              captures: { r_status: $.data.status }
            - call: "GET /aid-packages/${pkg}"
              as: ProgramAdmin
              captures: { r_pkg: $.data.status }
            - call: "GET /colleges/${col}"
              as: ProgramAdmin
              captures: { r_slots: $.data.slots_committed }
            - call: "GET /applications/${app}"
              as: ProgramAdmin
              captures: { r_app: $.data.status, r_mc: $.data.matched_college_id }
            - call: "GET /students/${stu}"
              as: ProgramAdmin
              captures: { r_stage: $.data.student_stage }
          assert:
            - "hop 1: Match.${m_id}.status == RELEASED"
            - "hop 2: AidPackage.${pkg}.status == VOID and PartnerCollege.${col}.slots_committed == 0 (slot returned exactly)"
            - "hop 3: Application.${app}.status == REGULAR_POOL with matched_college_id null, and Student.${stu}.student_stage == FINALIST"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_error_beats_window_closed_on_rankings
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_WINDOW_CLOSED]
        distinguishing_aspect: |
          Category pair state vs business_temporal: a rankings submission whose
          application is UNDER_REVIEW (state violation, priority 5) while the
          ranking window has also closed (temporal violation, priority 7) must
          return ERR_INVALID_STATE, not ERR_WINDOW_CLOSED.
        test_recipe:
          setup:
            - "Cycle A in RANKING phase; one ACTIVE college; one application stuck in UNDER_REVIEW (submitted but never reviewed); logical clock at 2026-11-05T00:00:00Z, past ranking_closes_at (2026-10-31T23:59:59Z)."
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - *mkcol_nl
            - *mkstu
            - *mkapp
            - call: "POST /applications/${app}/submit"
              as: Student
              as_user_id: "${stu}"
              captures: { app_v: $.data.version }
            - *adv
            - *adv
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-05T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /applications/${app}/rankings"
              payload: { entries: [{ college_id: "${col}", rank_position: 1 }], expected_application_version: "${app_v}" }
              as: Student
              as_user_id: "${stu}"
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id is ERR_INVALID_STATE (application not FINALIST/RANKING_SUBMITTED), proving priority 5 state beats priority 7 business_temporal"
            - "the response status is 409 and no RankingEntry rows were created"

      - name: referential_beats_constraint_on_application_create
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_REFERRAL_NOT_FOUND]
          - errors[ERR_DUPLICATE_APPLICATION]
        distinguishing_aspect: |
          Category pair business_referential vs business_constraint: creating an
          application that cites a nonexistent referral_id (referential,
          priority 8) while the student already holds a non-WITHDRAWN
          application in the cycle (constraint, priority 9) must return
          ERR_REFERRAL_NOT_FOUND, not ERR_DUPLICATE_APPLICATION. Different
          category pair from the state-vs-temporal instance.
        test_recipe:
          setup:
            - "Cycle A in APPLICATION_OPEN phase (clock 2026-09-05 inside the window); one student with an existing UNDER_REVIEW application in the cycle."
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - *mkstu
            - *mkapp
            - *submit
          trigger:
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", referral_id: "00000000-0000-4000-8000-000000000000", household_income_cents: 6500000, household_size: 4, gpa_scaled: 390, test_score: 1450 }
              as: Student
              as_user_id: "${stu}"
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id is ERR_REFERRAL_NOT_FOUND (priority 8), not ERR_DUPLICATE_APPLICATION (priority 9)"
            - "the response status is 422"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: income_exactly_at_cap_eligible_one_cent_over_rejected
        grounds:
          - calculations.household_income_cap
          - errors[ERR_INCOME_INELIGIBLE]
        distinguishing_aspect: |
          Metric: money in cents on POST /applications/{id}/submit. The cap for
          a household of 4 is exactly 6500000; income 6500000 is eligible (<=)
          while 6500001 is rejected — the boundary sits on the inclusive side.
        test_recipe:
          setup:
            - "Cycle A in APPLICATION_OPEN phase; logical clock at the window open; student A registered with an application at income exactly 6500000 (household size 4)."
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - *mkstu
            - *mkapp
          trigger:
            - call: "POST /applications/${app}/submit"
              as: Student
              as_user_id: "${stu}"
              captures: { ok_status: $.data.status }
            - call: "POST /students"
              payload: { email: "s2@x.com", full_name: "Stu Two", state_code: "TX", source: "SELF" }
              as: Anonymous
              captures: { stu2: $.data.id }
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", household_income_cents: 6500001, household_size: 4, gpa_scaled: 390, test_score: 1450 }
              as: Student
              as_user_id: "${stu2}"
              captures: { app2: $.data.id }
            - call: "POST /applications/${app2}/submit"
              as: Student
              as_user_id: "${stu2}"
              captures: { err: $.data.error_id }
          assert:
            - "student A at exactly the cap: submit succeeds, Application.${app}.status == UNDER_REVIEW"
            - "student B one cent over: submit rejected with ERR_INCOME_INELIGIBLE (422)"
            - "cap arithmetic check: 6500000 == BASE_CAP_CENTS + (4 - 4) * PER_MEMBER_ADJUST_CENTS"

