  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: tool_launch_gated_by_pack_certification_state
        grounds:
          - state_machines.ToolModel.ENGINEERING_VALIDATION_to_LAUNCHED
          - calculations.pack_compatibility_set
          - errors.ERR_CERTIFICATION_REQUIRED
        distinguishing_aspect: |
          Entity pair ToolModel -> BatteryPack: the LAUNCHED transition's validity
          depends on the state of OTHER entities (at least one CERTIFIED,
          unheld, in-window pack). The identical transition call fails while the
          pack is SUBMITTED and succeeds after the pack's own state machine moves
          to CERTIFIED — nothing about the tool changed in between.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Platform; one gen-1 pack stuck at SUBMITTED; tool (window [1,2], not a corded conversion) fully research-gated and staged to ENGINEERING_VALIDATION (version 7)."
          setup_api_calls:
            - *d_clock_sep
            - *d_platform
            - call: "POST /battery-ecosystem/battery-packs"
              payload: { platform_id: "${pf}", sku: "P-GATE", pack_generation: 1, cell_supplier_code: "SAM", cell_format: "C21700", rated_capacity_wh: 100, max_charge_rate_w: 200, replacement_price_cents: 20000, warranty_days: 720, free_replacement_days: 90 }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { pk: $.data.id }
            - *d_submit_pk
            - call: "POST /battery-ecosystem/tool-models"
              payload: { platform_id: "${pf}", model_code: "T-GATE", trade: "HVAC", category: "DRILL", tier: "PROFESSIONAL", corded_conversion: false, avg_power_draw_w: 300, min_pack_generation: 1, max_pack_generation: 2, replacement_price_cents: 20000, warranty_days: 360, free_replacement_days: 60, torque_min_nm: 5, torque_max_nm: 120 }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { tm: $.data.id }
            - call: "POST /battery-ecosystem/insights"
              payload: { tool_model_id: "${tm}", kind: "FIELD_RESEARCH", summary: "fr1", severity: "HIGH" }
              as: FieldResearcher
              as_user_id: "fr-kim"
              captures: { i1: $.data.id }
            - call: "POST /battery-ecosystem/insights"
              payload: { tool_model_id: "${tm}", kind: "FIELD_RESEARCH", summary: "fr2", severity: "LOW" }
              as: FieldResearcher
              as_user_id: "fr-kim"
              captures: { i2: $.data.id }
            - call: "POST /battery-ecosystem/insights"
              payload: { tool_model_id: "${tm}", kind: "JOBSITE_OBSERVATION", summary: "jo1", severity: "MEDIUM" }
              as: FieldResearcher
              as_user_id: "fr-kim"
              captures: { i3: $.data.id }
            - call: "POST /battery-ecosystem/insights/${i1}/decide"
              payload: { decision: "ADOPTED" }
              as: ProductEngineer
              as_user_id: "pe-ana"
            - call: "POST /battery-ecosystem/insights/${i2}/decide"
              payload: { decision: "ADOPTED" }
              as: ProductEngineer
              as_user_id: "pe-ana"
            - call: "POST /battery-ecosystem/insights/${i3}/decide"
              payload: { decision: "ADOPTED" }
              as: ProductEngineer
              as_user_id: "pe-ana"
            - call: "GET /battery-ecosystem/tool-models/${tm}"
              payload: {}
              as: ProductEngineer
              captures: { tv: $.data.version }
            - call: "POST /battery-ecosystem/tool-models/${tm}/transition"
              payload: { to_stage: "FIELD_RESEARCH", expected_tool_model_version: "${tv}" }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { tv2: $.data.version }
            - call: "POST /battery-ecosystem/tool-models/${tm}/transition"
              payload: { to_stage: "PROTOTYPE", expected_tool_model_version: "${tv2}" }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { tv3: $.data.version }
            - call: "POST /battery-ecosystem/tool-models/${tm}/transition"
              payload: { to_stage: "ENGINEERING_VALIDATION", expected_tool_model_version: "${tv3}" }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { tv4: $.data.version }
          trigger:
            - call: "POST /battery-ecosystem/tool-models/${tm}/transition"
              payload: { to_stage: "LAUNCHED", expected_tool_model_version: "${tv4}" }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { err_launch: $.data.error_id }
            - call: "POST /battery-ecosystem/battery-packs/${pk}/decide-certification"
              payload: { decision: "CERTIFIED" }
              as: ComplianceEngineer
              as_user_id: "ce-bob"
            - call: "POST /battery-ecosystem/tool-models/${tm}/transition"
              payload: { to_stage: "LAUNCHED", expected_tool_model_version: "${tv4}" }
              as: ProductEngineer
              as_user_id: "pe-ana"
          assert:
            - "first launch attempt fails with error_id ERR_CERTIFICATION_REQUIRED while the pack is SUBMITTED (REGULATORY set empty)"
            - "the failed attempt did not mutate the tool: the retry carries the same expected_tool_model_version ${tv4} and is accepted"
            - "after the pack reaches CERTIFIED, the identical transition succeeds: ToolModel.${tm}.stage == LAUNCHED"
            - "ToolModel.${tm}.regulatory_compatible_pack_count == 1 at launch time"

      - name: listing_activation_gated_by_pack_certification_state
        grounds:
          - state_machines.DistributionListing.PROPOSED_to_ACTIVE
          - errors.ERR_CERTIFICATION_REQUIRED
        distinguishing_aspect: |
          Entity pair DistributionListing -> BatteryPack (distinct from the
          sibling's ToolModel -> BatteryPack pair): the listing's own state
          machine edge PROPOSED -> ACTIVE is closed until the referenced pack's
          state machine reaches CERTIFIED; the same transition call flips from
          rejected to accepted purely because the pack entity moved.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Platform; pack still in DESIGN; INDUSTRIAL partner with a PROPOSED listing of the pack."
          setup_api_calls:
            - *d_clock_sep
            - *d_platform
            - call: "POST /battery-ecosystem/battery-packs"
              payload: { platform_id: "${pf}", sku: "P-LG", pack_generation: 1, cell_supplier_code: "SAM", cell_format: "C21700", rated_capacity_wh: 100, max_charge_rate_w: 200, replacement_price_cents: 20000, warranty_days: 720, free_replacement_days: 90 }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { pk: $.data.id }
            - *d_partner_ind
            - call: "POST /battery-ecosystem/listings"
              payload: { channel_partner_id: "${cp}", battery_pack_id: "${pk}", wholesale_price_cents: 12000, allocation_qty: 40, expected_channel_partner_version: "${cp_v}" }
              as: ChannelManager
              as_user_id: "${cp}"
              captures: { li: $.data.id }
          trigger:
            - call: "POST /battery-ecosystem/listings/${li}/transition"
              payload: { to_status: "ACTIVE" }
              as: ChannelManager
              as_user_id: "${cp}"
              captures: { err_act: $.data.error_id }
            - call: "POST /battery-ecosystem/battery-packs/${pk}/submit-certification"
              payload: {}
              as: ProductEngineer
              as_user_id: "pe-ana"
            - call: "POST /battery-ecosystem/battery-packs/${pk}/decide-certification"
              payload: { decision: "CERTIFIED" }
              as: ComplianceEngineer
              as_user_id: "ce-bob"
            - call: "POST /battery-ecosystem/listings/${li}/transition"
              payload: { to_status: "ACTIVE" }
              as: ChannelManager
              as_user_id: "${cp}"
          assert:
            - "first activation fails with error_id ERR_CERTIFICATION_REQUIRED (pack DESIGN)"
            - "after the pack's own transitions (DESIGN -> SUBMITTED -> CERTIFIED), the identical activation succeeds"
            - "DistributionListing.${li}.status == ACTIVE and requires_relist_ack == false"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: service_center_daily_capacity_aggregate_semantics
        grounds:
          - calculations.service_center_selection
          - errors.ERR_NO_SERVICE_CAPACITY
          - validations.priority_21
        distinguishing_aspect: |
          Aggregate-capacity interval semantics on the ServiceCenter resource: a
          (center, service_date) pair holds at most daily_capacity claims, counted
          as a scalar, not geometric intervals. Bookings at count 0 and 1 succeed,
          count == 2 == capacity rejects, and the same claim on the NEXT day is
          accepted — the day bucket, not any time-of-day interval, is the resource.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. CERTIFIED pack; one center (BATTERY_SERVICE, daily_capacity 2); account with three ACTIVE battery assets."
          setup_api_calls:
            - *d_clock_sep
            - *d_platform
            - call: "POST /battery-ecosystem/battery-packs"
              payload: { platform_id: "${pf}", sku: "P-CAP", pack_generation: 1, cell_supplier_code: "SAM", cell_format: "C21700", rated_capacity_wh: 100, max_charge_rate_w: 200, replacement_price_cents: 20000, warranty_days: 720, free_replacement_days: 90 }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { pk: $.data.id }
            - *d_submit_pk
            - *d_certify_pk
            - call: "POST /battery-ecosystem/service-centers"
              payload: { code: "SC-CAP2", region: "MW", capabilities: ["BATTERY_SERVICE"], daily_capacity: 2 }
              as: PlatformAdmin
              captures: { sc: $.data.id }
            - *d_account
            - call: "POST /battery-ecosystem/tracked-assets"
              payload: { account_id: "${ac}", subject_type: "BATTERY", battery_pack_id: "${pk}", serial_number: "SN-CAP-1", manufactured_at: "2026-06-01T00:00:00Z" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { a1: $.data.id }
            - call: "POST /battery-ecosystem/tracked-assets"
              payload: { account_id: "${ac}", subject_type: "BATTERY", battery_pack_id: "${pk}", serial_number: "SN-CAP-2", manufactured_at: "2026-06-01T00:00:00Z" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { a2: $.data.id }
            - call: "POST /battery-ecosystem/tracked-assets"
              payload: { account_id: "${ac}", subject_type: "BATTERY", battery_pack_id: "${pk}", serial_number: "SN-CAP-3", manufactured_at: "2026-06-01T00:00:00Z" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { a3: $.data.id }
          trigger:
            - call: "POST /battery-ecosystem/warranty-claims"
              payload: { tracked_asset_id: "${a1}", claim_type: "BATTERY_REPLACEMENT", fault_code: "F1", service_date: "2026-09-10" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { c1: $.data.id, c1_center: $.data.service_center_id }
            - call: "POST /battery-ecosystem/warranty-claims"
              payload: { tracked_asset_id: "${a2}", claim_type: "BATTERY_REPLACEMENT", fault_code: "F2", service_date: "2026-09-10" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { c2: $.data.id }
            - call: "POST /battery-ecosystem/warranty-claims"
              payload: { tracked_asset_id: "${a3}", claim_type: "BATTERY_REPLACEMENT", fault_code: "F3", service_date: "2026-09-10" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { err_full: $.data.error_id }
            - call: "POST /battery-ecosystem/warranty-claims"
              payload: { tracked_asset_id: "${a3}", claim_type: "BATTERY_REPLACEMENT", fault_code: "F3", service_date: "2026-09-11" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { c3: $.data.id, c3_center: $.data.service_center_id }
          assert:
            - "claims 1 and 2 book (center, 2026-09-10) successfully: service_center_id == ${sc} for both"
            - "claim 3 on the same date is rejected with error_id ERR_NO_SERVICE_CAPACITY (booked_count 2 == daily_capacity 2)"
            - "the identical claim moved one day later (2026-09-11) succeeds: WarrantyClaim.${c3}.id exists with service_center_id == ${sc}"
            - "GET /warranty-claims?service_center_id=${sc} returns exactly 3 rows after the retry"

      - name: bulletin_window_half_open_adjacency_vs_overlap
        grounds:
          - validations.priority_15
          - state_machines.SafetyBulletin.ISSUED_to_SUPERSEDED
          - errors.ERR_BULLETIN_WINDOW_OVERLAP
        distinguishing_aspect: |
          Half-open interval semantics on the (platform) bulletin channel — a
          different resource and different geometry from the sibling's aggregate
          day-capacity count: [from, to) windows touching at an endpoint do NOT
          overlap (adjacency allowed), while a true intersection is rejected
          unless the new bulletin supersedes the intersecting one.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. One platform. Bulletin B1 ISSUED with window [2026-10-01, 2026-11-01)."
          setup_api_calls:
            - *d_clock_sep
            - *d_platform
            - call: "POST /battery-ecosystem/safety-bulletins"
              payload: { platform_id: "${pf}", severity: "ADVISORY", title: "B1", effective_from: "2026-10-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z" }
              as: ComplianceEngineer
              as_user_id: "ce-bob"
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /battery-ecosystem/safety-bulletins"
              payload: { platform_id: "${pf}", severity: "ADVISORY", title: "B2 adjacent-before", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-10-01T00:00:00Z" }
              as: ComplianceEngineer
              as_user_id: "ce-bob"
              captures: { b2: $.data.id }
            - call: "POST /battery-ecosystem/safety-bulletins"
              payload: { platform_id: "${pf}", severity: "URGENT", title: "B3 overlapping", effective_from: "2026-10-15T00:00:00Z", effective_to: "2026-12-01T00:00:00Z" }
              as: ComplianceEngineer
              as_user_id: "ce-bob"
              captures: { err_ov: $.data.error_id }
            - call: "POST /battery-ecosystem/safety-bulletins"
              payload: { platform_id: "${pf}", severity: "URGENT", title: "B3 superseding", effective_from: "2026-10-15T00:00:00Z", effective_to: "2026-12-01T00:00:00Z", supersedes_bulletin_id: "${b1}" }
              as: ComplianceEngineer
              as_user_id: "ce-bob"
              captures: { b3: $.data.id }
          assert:
            - "B2 is created ISSUED: its window [2026-09-01, 2026-10-01) touches B1's [2026-10-01, 2026-11-01) at exactly one endpoint and half-open semantics treat that as non-overlapping"
            - "B3 without supersedes_bulletin_id is rejected with error_id ERR_BULLETIN_WINDOW_OVERLAP ([2026-10-15, 2026-12-01) intersects B1's window)"
            - "B3 naming supersedes_bulletin_id=${b1} is created ISSUED"
            - "SafetyBulletin.${b1}.status == SUPERSEDED and SafetyBulletin.${b3}.status == ISSUED"

