      - name: second_special_election_nomination_in_one_cycle_rejected
        claim_type: triggerable
        grounds:
          - errors[ERR_SPECIAL_ELECTION_QUOTA_EXHAUSTED]
          - validations[priority=51]
          - calculations.career_eligibility_assessment.constants.SPECIAL_MAX_PER_CYCLE
          - entities.InductionCycle.fields.special_election_used
        distinguishing_aspect: |
          SPECIAL_MAX_PER_CYCLE is 1, and the quota is consumed by the first live SPECIAL candidacy of
          the cycle. The second SPECIAL nomination names a different, fully eligible candidate and
          carries a non-empty justification, so priorities 50 and 52 both pass and only the quota can
          fail: 409 ERR_SPECIAL_ELECTION_QUOTA_EXHAUSTED with special_election_used pinned at 1.
        test_recipe:
          setup:
            - "EligibilityRule rows exist for (PLAYER, MODERN) and (PLAYER, SPECIAL)."
            - "A NOMINATIONS_OPEN 2026 cycle already holds one SUBMITTED SPECIAL candidacy, so special_election_used is 1."
            - "A second eligible PLAYER candidate has never been nominated."
          setup_api_calls:
            - call: "POST /eligibility-rules"
              payload: { category: "PLAYER", pathway: "MODERN", waiting_period_years: 5, min_career_seasons: 10, min_career_metric: 2000, max_ballot_appearances: 3, election_threshold_pct: 0.75, carryover_min_pct: 0.05, runoff_floor_pct: 0.25 }
