    side_effects: ["Sets status = WITHDRAWN (terminal)", "Frees the docket seat and may reopen a CLOSED_FOR_SCHEDULING docket", "FalseAlarmIncident APPEALED -> COUNTED and dunning resumes", "Increments FalseAlarmIncident.version by 1"]

