          Depth ≥ 3 chain: POST /containers/{id}/receive (trigger A) → sets
          InventoryLot fields (mutation 1) → those lot mutations re-evaluate
          Project.allocated_value_cents for affected projects (mutation 2) →
          if fulfillment transitions to SHIPPED, a PROGRESS Invoice is created
