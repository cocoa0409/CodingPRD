  - creates Tower rows
- method: GET
  path: /farm/racks
  description: List racks
  roles:
  - FarmManager
  - Grower
  - SanitationLead
  - QualityAssurance
  - ContractsManager
  - LaborPlanner
  - Worker
  code: 200
  input:
  - water_loop_id?
  - rack_posture?
  - zone?
  - limit?
  - offset?
  output: Rack[]
  side_effects: []
- method: GET
  path: /farm/racks/{id}
  description: Get a rack
  roles:
  - FarmManager
  - Grower
  - SanitationLead
  - QualityAssurance
  - ContractsManager
  - LaborPlanner
  - Worker
  code: 200
