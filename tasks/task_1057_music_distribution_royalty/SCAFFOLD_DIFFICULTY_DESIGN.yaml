              as_user_id: "admin-1"
              captures: { artist_id: $.data.id }
            - call: "POST /api/subscriptions"
              payload: { artist_id: "${artist_id}", plan_id: "${plan_id}", auto_renew: true }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { sub_id: $.data.id }
            - call: "POST /api/subscriptions/${sub_id}/activate"
              payload: { payment_reference: "pay-fornax-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /api/releases"
              payload: { artist_id: "${artist_id}", title: "One", release_date: "2026-09-01T00:00:00Z", primary_genre: "Pop", label_name: "Fornax Rec", upc: "112345678977" }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { rel_one: $.data.id }
            - call: "POST /api/releases/${rel_one}/tracks"
              payload: { title: "Kiln", duration_seconds: 190, track_number: 1, isrc: "USFOR2600001", explicit: false }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { track_one: $.data.id }
            - call: "POST /api/releases"
              payload: { artist_id: "${artist_id}", title: "Two", release_date: "2026-09-01T00:00:00Z", primary_genre: "Pop", label_name: "Fornax Rec", upc: "112345678984" }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { rel_two: $.data.id }
            - call: "POST /api/releases/${rel_two}/tracks"
              payload: { title: "Forge", duration_seconds: 205, track_number: 1, isrc: "USFOR2600002", explicit: false }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { track_two: $.data.id }
            - call: "POST /api/releases/${rel_one}/submit"
              payload: {}
              as: Artist
