              as_user_id: "admin-001"
              captures: { est_id: $.data.id }
            - call: "POST /cosmetology/inspections"
              payload: { establishment_id: "${est_id}", inspection_type: "ROUTINE", window_start_at: "2026-08-02T09:00:00Z", window_end_at: "2026-08-02T17:00:00Z", inspector_user_id: "insp-012" }
              as: Inspector
              as_user_id: "insp-012"
              captures: { insp_0_id: $.data.id }
            - call: "POST /cosmetology/inspections/${insp_0_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "insp-012"
            - call: "POST /cosmetology/inspections/${insp_0_id}/findings"
              payload: { violation_code_id: "${vc_id}", observed_count: 1, corrected_on_site: false }
              as: Inspector
              as_user_id: "insp-012"
            - call: "POST /cosmetology/inspections/${insp_0_id}/submit"
              payload: {}
              as: Inspector
              as_user_id: "insp-012"
            - call: "POST /cosmetology/inspections/${insp_0_id}/finalize"
              payload: {}
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /cosmetology/inspections"
              payload: { establishment_id: "${est_id}", inspection_type: "ROUTINE", window_start_at: "2026-08-10T09:00:00Z", window_end_at: "2026-08-10T17:00:00Z", inspector_user_id: "insp-012" }
              as: Inspector
              as_user_id: "insp-012"
              captures: { insp_1_id: $.data.id }
          trigger:
            - call: "POST /cosmetology/inspections"
              payload: { establishment_id: "${est_id}", inspection_type: "ROUTINE", window_start_at: "2026-08-11T10:00:00Z", window_end_at: "2026-08-11T12:00:00Z", inspector_user_id: "insp-013" }
              as: Inspector
              as_user_id: "insp-013"
            - call: "POST /cosmetology/inspections"
              payload: { establishment_id: "${est_id}", inspection_type: "REINSPECTION", reinspection_of_id: "${insp_0_id}", window_start_at: "2026-08-11T10:00:00Z", window_end_at: "2026-08-11T12:00:00Z", inspector_user_id: "insp-013" }
              as: Inspector
              as_user_id: "insp-013"
              captures: { insp_3_id: $.data.id }
            - call: "POST /cosmetology/inspections"
              payload: { establishment_id: "${est_id}", inspection_type: "REINSPECTION", reinspection_of_id: "${insp_0_id}", window_start_at: "2026-08-10T17:00:00Z", window_end_at: "2026-08-10T18:00:00Z", inspector_user_id: "insp-013" }
              as: Inspector
