            - { call: "POST /psm/personnel", payload: { full_name: "App", employee_ref: "E-APP" }, as: PsmAdmin, captures: { app_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "Lead", employee_ref: "E-LEAD", qualifications: ["PSSR_CERTIFIED"] }, as: PsmAdmin, captures: { lead_id: $.data.id } }
            - { call: "POST /psm/units/${u_id}/action-items", payload: { title: "m1", priority: "P1", assignee_id: "${req_id}", due_in_days: 1 }, as: PsmManager }
            - { call: "POST /psm/units/${u_id}/action-items", payload: { title: "m2", priority: "P1", assignee_id: "${req_id}", due_in_days: 1 }, as: PsmManager }
            - { call: "POST /psm/units/${u_id}/moc-requests", payload: { title: "T", description: "d", discipline: "CHEMICAL" }, as: Requester, as_user_id: "${req_id}", captures: { m_id: $.data.id } }
            - { call: "POST /psm/moc-requests/${m_id}/classify", payload: { change_class: "TEMPORARY", screening_severity: 1, screening_likelihood: 1, temporary_start_date: "2026-05-01", temporary_duration_days: 5 }, as: PsmManager }
            - { call: "POST /psm/moc-requests/${m_id}/submit", payload: {}, as: Requester, as_user_id: "${req_id}" }
            - { call: "GET /psm/moc-requests/${m_id}/technical-reviews", as: PsmManager, captures: { r_id: "$.data[0].id" } }
            - { call: "POST /psm/technical-reviews/${r_id}/submit-verdict", payload: { design_basis_ok: true, codes_standards_ok: true, relief_systems_ok: true, materials_compat_ok: true, severity_score: 1, likelihood_score: 1, detection_score: 1, verdict: "ACCEPT" }, as: TechnicalReviewer, as_user_id: "${rev_id}" }
            - { call: "POST /psm/moc-requests/${m_id}/approve", payload: {}, as: OpsApprover, as_user_id: "${app_id}" }
            - { call: "POST /psm/moc-requests/${m_id}/procedure-updates", payload: { document_ref: "SOP-1" }, as: TrainingCoordinator, captures: { pu: $.data.id } }
            - { call: "POST /psm/procedure-updates/${pu}/training-assignments", payload: { personnel_id: "${req_id}" }, as: TrainingCoordinator, captures: { ta: $.data.id } }
            - { call: "POST /psm/procedure-updates/${pu}/publish", payload: {}, as: TrainingCoordinator }
