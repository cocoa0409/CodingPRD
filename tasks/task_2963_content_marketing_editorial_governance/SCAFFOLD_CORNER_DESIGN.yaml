          - validations[priority=2]
        distinguishing_aspect: "The role check is per-endpoint, not a seniority ladder: ManagingEditor is the busiest role and is still refused on the three endpoints it does not appear on (claim decisions, brief approval and snapshot writes), and every refusal is the same 403 ERR_UNAUTHORIZED at priority 2 — ahead of any existence check, so a denied role never learns whether the path id exists."
