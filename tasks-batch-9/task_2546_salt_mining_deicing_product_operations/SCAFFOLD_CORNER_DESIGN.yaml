            - call: "POST /salt/panels/${panel_id}/start-production"
              payload: {}
              as: MinePlanner
            - call: "GET /salt/mines/${mine_id}"
              payload: {}
              as: MinePlanner
              captures: { mine_v: "$.data.version" }
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${mine_id}", panel_id: "${panel_id}", planned_tons: 2003, hoist_window_start: "2026-08-02T00:00:00Z", hoist_window_end: "2026-08-03T00:00:00Z", expected_mine_version: "${mine_v}" }
              as: MinePlanner
              captures: { run_id: "$.data.id" }
            - call: "POST /salt/production-runs/${run_id}/hoist"
              payload: { hoisted_tons: 2003 }
              as: MinePlanner
            - call: "POST /salt/depots"
              payload: { name: "Syracuse Depot", state_code: "NY", covered_capacity_tons: 5000, open_pad_capacity_tons: 5000, loadout_rate_tons_per_hour: 500, outbound_freight_rate_per_ton: 12.500 }
              as: LogisticsPlanner
              captures: { depot_a: "$.data.id" }
          trigger:
            - call: "POST /salt/treatment-batches"
              payload: { production_run_id: "${run_id}", depot_id: "${depot_a}", product_line: "HIGHWAY_DEICING", screen_spec: "COARSE", anticaking_ppm: 20.00, corrosion_inhibitor_pct: 0.50, input_tons: 1003, moisture_pct: 2.50, storage_kind: "COVERED" }
              as: QualityLab
              as_user_id: "ql-maker-1"
              captures: { b1: "$.data.id", y1: "$.data.yield_tons", p1: "$.data.purity_pct_nacl" }
            - call: "POST /salt/treatment-batches"
              payload: { production_run_id: "${run_id}", depot_id: "${depot_a}", product_line: "HIGHWAY_DEICING", screen_spec: "COARSE", anticaking_ppm: 20.00, corrosion_inhibitor_pct: 0.50, input_tons: 1000, moisture_pct: 3.33, storage_kind: "COVERED" }
              as: QualityLab
              as_user_id: "ql-maker-1"
              captures: { b2: "$.data.id", y2: "$.data.yield_tons" }
          assert:
            - "both calls HTTP 201"
            - "${y1} == 919.25 (exact product 919.2495, half-up at 2 decimals)"
            - "${y2} == 908.70 (exact product 908.698)"
            - "${p1} == 96.500 — purity keeps 3 decimals and is not collapsed to 96.50"
            - "TreatmentBatch.${b1}.rework_count == 0 and TreatmentBatch.${b2}.rework_count == 0"

