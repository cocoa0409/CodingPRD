              captures: { cu_storm: $.data.id, cu_storm_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /alerts/products"
              payload: { product_level: "WARNING", hazard_type: "SEVERE_THUNDERSTORM", issuing_office_id: "${cu_off}", storm_event_id: "${cu_storm}", polygon: { vertices: [ { lat: 0.0, lon: 0.0 }, { lat: 0.0, lon: 0.1 }, { lat: 0.1, lon: 0.1 }, { lat: 0.1, lon: 0.0 } ] }, expires_at: "2026-09-01T10:45:00Z" }
              as: Forecaster
              as_user_id: "${cu_fc}"
              captures: { cu_w: $.data.id, cu_wv: $.data.version }
          trigger:
            - call: "POST /alerts/products/${cu_w}/issue"
              payload: { expected_product_version: "${cu_wv}" }
              as: Forecaster
              as_user_id: "${cu_fc}"
              captures: { cu_err: $.data.error_id }
            - call: "PUT /alerts/storm-events/${cu_storm}"
              payload: { expected_storm_event_version: "${cu_storm_v1}", max_wind_mph: 60 }
              as: Forecaster
              as_user_id: "${cu_fc}"
              captures: { cu_storm_v2: $.data.version }
            - call: "POST /alerts/products/${cu_w}/issue"
