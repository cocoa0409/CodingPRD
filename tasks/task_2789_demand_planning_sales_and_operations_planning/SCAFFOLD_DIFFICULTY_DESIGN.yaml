          assert:
            - "SupplyPlan.${plan_id}.constrained_units == 1000 and shortfall_units == 6330 and constraint_type == \"CAPACITY\""
            - "Scenario.${scen_id}.incremental_units == 5200 — min(floor(52 * 100), 6330)"
            - "Scenario.${scen_id}.gross_uplift_cents == 5200000 and investment_cost_cents == 1300000 (52 * CAPACITY_HOURLY_COST_CENTS 25000)"
            - "Scenario.${scen_id}.pre_trade_closure_cents == 3900000"
            - "Scenario.${scen_id}.trade_rate_pct == 6.0 — the tier is read from 3_900_000 (>= TRADE_TIER_1_CENTS, < TRADE_TIER_2_CENTS); tiering off gross_uplift_cents 5_200_000 would wrongly give 8.0"
            - "Scenario.${scen_id}.trade_spend_cents == 312000 (6.0% of GROSS 5_200_000, not of the pre-trade figure) and net_gap_closure_cents == 3588000; the 8.0% mistake would yield 416000 and 3484000"
            - "Scenario.${scen_id}.status == \"EVALUATED\" and the cycle is untouched: PlanningCycle.${cycle_id}.plan_value_cents == 1000000, gross_gap_cents == 9000000, selected_closure_cents == 0, residual_gap_cents == 9000000"

  - rule_id: non_linear_state_machine
    instances:
      - name: cycle_reopen_loop_from_executive_review_back_to_demand_review
        grounds:
          - state_machines.PlanningCycle.EXECUTIVE_REVIEW_to_DEMAND_REVIEW
          - state_machines.PlanningCycle.SCENARIO_REVIEW_to_EXECUTIVE_REVIEW
          - state_machines.Scenario.SELECTED_to_SUPERSEDED
          - entities.PlanningCycle.fields.reopen_count
          - validations[priority=160]
        distinguishing_aspect: |
          This is the WORKFLOW-LEVEL backward edge: the cycle re-enters a state it has already
          left (EXECUTIVE_REVIEW -> DEMAND_REVIEW), so the same status is occupied twice in one
          entity's history, and the loop is bounded by a counter (reopen_count vs MAX_REOPENS = 2)
          rather than by a linear terminal state. Re-entering DEMAND_REVIEW is not a no-op: it
          demotes locked forecasts, staleness-marks supply plans and supersedes selected
          scenarios, so the second visit starts from a different data state than the first.
        test_recipe:
          setup:
            - "The 10_000_000-cent gap fixture: family at 100 units/hour, MATURE item priced 1000 cents with safety_stock_units 330, one 10-hour CapacityBlock in the 2026-09 window, one CONSENSUS_LOCKED forecast of 7000 units, a SupplyPlan constrained to 1000 units with shortfall 6330."
            - "One CAPACITY_INVESTMENT Scenario for 52 hours, EVALUATED at net_gap_closure_cents 3_588_000 and SELECTED, so the cycle sits in EXECUTIVE_REVIEW with residual_gap_cents 5_412_000."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-FROZ", name: "Frozen", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-PIZZA-1", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, service_level_target_pct: 95.0, demand_cv: 0.20, lead_time_days: 30, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-A", name: "Alpha Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/capacity-blocks"
              payload: { family_id: "${fam_id}", start_date: "2026-09-01", end_date: "2026-09-30", available_hours: 10 }
              as: SupplyPlanner
              as_user_id: "supply-1"
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "SOP-LOOP-09", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 10000000, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-09", level_units: 7000, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_id: $.data.id }
            - call: "POST /sop/demand-forecasts/${fc_id}/transitions"
              payload: { target_status: "UNDER_CONSENSUS" }
              as: DemandPlanner
              as_user_id: "planner-1"
            - call: "POST /sop/demand-forecasts/${fc_id}/transitions"
              payload: { target_status: "CONSENSUS_LOCKED" }
              as: DemandReviewLead
              as_user_id: "lead-1"
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SUPPLY_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/supply-plans"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}" }
              as: SupplyPlanner
              as_user_id: "supply-1"
              captures: { plan_id: $.data.id }
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SCENARIO_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/scenarios"
              payload: { cycle_id: "${cycle_id}", scenario_type: "CAPACITY_INVESTMENT", name: "Add second shift", target_item_id: "${item_id}", added_capacity_hours: 52 }
              as: SupplyPlanner
              as_user_id: "supply-1"
              captures: { scen_id: $.data.id }
            - call: "POST /sop/scenarios/${scen_id}/evaluate"
              payload: {}
              as: SupplyPlanner
              as_user_id: "supply-1"
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "EXECUTIVE_REVIEW" }
              as: SopAdmin
              captures: { cyc_v_exec: $.data.version }
            - call: "POST /sop/scenarios/${scen_id}/select"
              payload: { expected_cycle_version: "${cyc_v_exec}" }
              as: ExecutiveSponsor
              as_user_id: "exec-1"
          trigger:
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "DEMAND_REVIEW", reopen_reason: "Sales withdrew the club channel commitment" }
              as: ExecutiveSponsor
              as_user_id: "exec-1"
          assert:
            - "Before the trigger: PlanningCycle.${cycle_id}.residual_gap_cents == 5412000 and selected_closure_cents == 3588000 and reopen_count == 0"
            - "After the trigger: PlanningCycle.${cycle_id}.status == \"DEMAND_REVIEW\" — the same status the cycle occupied at creation, reached by a backward edge"
            - "PlanningCycle.${cycle_id}.reopen_count == 1 (the loop counter, bounded by MAX_REOPENS 2)"
            - "DemandForecast.${fc_id}.status == \"UNDER_CONSENSUS\" — the reopen demoted the locked line rather than leaving it locked"
            - "SupplyPlan.${plan_id}.status == \"STALE\" and requires_replan == true"
            - "Scenario.${scen_id}.status == \"SUPERSEDED\" while its own net_gap_closure_cents remains 3588000"
            - "PlanningCycle.${cycle_id}.plan_value_cents == 0, gross_gap_cents == 10000000, selected_closure_cents == 0, residual_gap_cents == 10000000, constrained_plan_count == 0, posture == \"AT_RISK\""

      - name: adjustment_revision_loop_proposed_revision_requested_proposed
        grounds:
          - state_machines.ConsensusAdjustment.PROPOSED_to_REVISION_REQUESTED
          - state_machines.ConsensusAdjustment.REVISION_REQUESTED_to_PROPOSED
          - entities.ConsensusAdjustment.fields.revision_round
          - validations[priority=160]
          - concurrency_rules[adjustment-create-stale-forecast]
        distinguishing_aspect: |
          This is the RECORD-LEVEL backward edge inside a review sub-workflow: a single
          ConsensusAdjustment re-enters PROPOSED after REVISION_REQUESTED and can do so up to
          MAX_REVISION_ROUNDS = 3 times, with revision_round as the termination condition. Unlike
          the cycle reopen loop, the loop here runs entirely inside one DEMAND_REVIEW phase, never
          touches consensus_units (the row is never ENDORSED), and each re-entry CLEARS the
          reviewer fields — so the state is the same but the row is provably not the same.
        test_recipe:
          setup:
            - "One ProductFamily, one MATURE Item, one Customer, one PlanningCycle in DEMAND_REVIEW over 2026-09..2026-09."
            - "One DemandForecast with baseline_units == 333 carrying one PROPOSED SALES_INTELLIGENCE adjustment of +20 units that has already been sent back once with decision REQUEST_REVISION."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-CANDY", name: "Confections", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-BAR-1", family_id: "${fam_id}", unit_price_cents: 500, unit_cost_cents: 200, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, service_level_target_pct: 95.0, demand_cv: 0.20, lead_time_days: 30, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-A", name: "Alpha Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "SOP-REV-09", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-09", level_units: 333, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_id: $.data.id, fc_v1: $.data.version }
            - call: "POST /sop/consensus-adjustments"
              payload: { demand_forecast_id: "${fc_id}", adjustment_type: "SALES_INTELLIGENCE", delta_units: 20, rationale: "distribution gain rumour", expected_demand_forecast_version: "${fc_v1}" }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { adj_id: $.data.id }
            - call: "POST /sop/consensus-adjustments/${adj_id}/reviews"
              payload: { decision: "REQUEST_REVISION", review_note: "attach the customer confirmation" }
              as: DemandReviewLead
              as_user_id: "lead-1"
          trigger:
            - call: "GET /sop/demand-forecasts/${fc_id}"
              payload: {}
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_v2: $.data.version }
            - call: "POST /sop/consensus-adjustments/${adj_id}/resubmit"
              payload: { rationale: "confirmation attached", delta_units: 25, expected_demand_forecast_version: "${fc_v2}" }
              as: DemandPlanner
              as_user_id: "planner-1"
            - call: "POST /sop/consensus-adjustments/${adj_id}/reviews"
              payload: { decision: "REQUEST_REVISION", review_note: "quantity still unsupported" }
              as: DemandReviewLead
              as_user_id: "lead-1"
            - call: "GET /sop/demand-forecasts/${fc_id}"
              payload: {}
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_v3: $.data.version }
            - call: "POST /sop/consensus-adjustments/${adj_id}/resubmit"
              payload: { rationale: "trimmed to the confirmed volume", delta_units: 30, expected_demand_forecast_version: "${fc_v3}" }
              as: DemandPlanner
              as_user_id: "planner-1"
          assert:
            - "ConsensusAdjustment.${adj_id}.status == \"PROPOSED\" after two full loops through REVISION_REQUESTED"
            - "ConsensusAdjustment.${adj_id}.revision_round == 2 (MAX_REVISION_ROUNDS is 3, so one more loop remains)"
            - "ConsensusAdjustment.${adj_id}.delta_units == 30 and applied_delta_units == 30 — the resubmitted quantity replaced the original 20"
            - "ConsensusAdjustment.${adj_id}.reviewed_by_user_id == null and review_note == null — each re-entry into PROPOSED clears the reviewer fields"
            - "DemandForecast.${fc_id}.consensus_units == 333 and endorsed_adjustment_count == 0 — a looping adjustment never contributes to consensus until ENDORSED"
            - "DemandForecast.${fc_id}.status == \"UNDER_CONSENSUS\" throughout"

  - rule_id: transitive_cascade
    instances:
      - name: item_runout_cascades_to_promotion_then_adjustment_then_consensus
        grounds:
          - state_machines.Item.MATURE_to_RUNOUT
          - state_machines.Promotion.APPROVED_to_CANCELLED_RUNOUT
          - state_machines.ConsensusAdjustment.COMMITTED_to_VOIDED
          - state_machines.SupplyPlan.RATIONED_to_STALE
          - calculations.calc_consensus_units
          - calculations.calc_cycle_posture
        distinguishing_aspect: |
          Trigger: POST /sop/items/{item_id}/lifecycle-transitions with target_state RUNOUT.
          Depth 4: (1) DemandForecast rows for months after runout_end_month become
          RUNOUT_TRUNCATED with consensus_units 0; (2) the APPROVED Promotions covering those
          truncated months become CANCELLED_RUNOUT; (3) the ConsensusAdjustments attached to the
          truncated forecasts become VOIDED and calc_consensus_units re-runs; (4) the item's
          SupplyPlan becomes STALE, which re-derives the cycle's plan_value_cents and flips its
          posture. Hops 2, 3 and 4 each touch a different entity than the one before it.
        test_recipe:
          setup:
            - "One ProductFamily at 100 units/hour with a 9-hour CapacityBlock inside the horizon (900 available units); one MATURE Item priced 1000 cents with on_hand_units 0, safety_stock_units 330 and material_supply_cap_units 100000; one Customer."
            - "One PlanningCycle over 2026-09..2026-11 with financial_commitment_cents = 0."
            - "Three forecast lines of 1000 baseline units each for 2026-09, 2026-10 and 2026-11; an APPROVED Promotion for 2026-11 with lift_pct 10 and cannibalization_pct 0; one ENDORSED PROMOTION adjustment on the 2026-11 line lifting it to consensus 1100."
            - "All three lines CONSENSUS_LOCKED (which commits the adjustment), the cycle advanced to SUPPLY_REVIEW and a PLANNED SupplyPlan created and rationed."
