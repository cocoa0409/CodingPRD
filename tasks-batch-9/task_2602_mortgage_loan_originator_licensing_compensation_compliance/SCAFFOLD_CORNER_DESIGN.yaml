            - "HTTP status is 422 on SUBSTANTIATED with 0"
            - "${err1} == ERR_RESTITUTION_MISMATCH"
            - "HTTP status is 422 on UNSUBSTANTIATED with 500"
            - "${err2} == ERR_RESTITUTION_MISMATCH"
