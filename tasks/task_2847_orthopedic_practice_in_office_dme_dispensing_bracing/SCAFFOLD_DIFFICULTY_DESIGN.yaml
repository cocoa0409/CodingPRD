        distinguishing_aspect: |
          Mode (c), a circular-looking dependency with a pinned evaluation
          order: restock_fee_cents is defined as charged - refund_cents while
          refund_cents is itself the sum of two bucket refunds that were each
          discounted by restock_fee_pct, so "the fee" appears on both sides.
