          - errors[ERR_APPLICATION_NOT_UNDER_REVIEW]
        distinguishing_aspect: |
          A DepartmentReview PENDING -> APPROVED is gated on the parent
          PermitApplication being UNDER_REVIEW; once a sibling veto flips the app
          to DENIED, a still-PENDING review's approve fails ERR_APPLICATION_NOT_UNDER_REVIEW
          — the DepartmentReview -> PermitApplication pair, distinct from the pair above.
        test_recipe:
          setup:
            - "A submitted app UNDER_REVIEW; FIRE vetoes (app -> DENIED); POLICE review is still PENDING and tries to approve."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V11", venue_type: "PARK", max_capacity: 6000, setup_buffer_minutes: 60 }
              as: PermitOfficer
              captures: { venue_id: $.data.id, venue_v0: $.data.version }
            - call: "POST /closure-schedules"
              payload: { corridor_name: "L St", min_gap_minutes: 30 }
              as: PermitOfficer
              captures: { sched_id: $.data.id }
            - call: "POST /applicants"
              payload: { org_name: "Org L", contact_email: "l2@x.com" }
              as: PermitOfficer
              captures: { app_user_id: $.data.id }
            - call: "POST /permit-applications"
              payload: { applicant_org: "Org L", venue_id: "${venue_id}", event_kind: "PARADE", expected_attendance: 3000, occupy_start: "2026-06-15T10:00:00Z", occupy_end: "2026-06-15T14:00:00Z" }
              as: Applicant
              as_user_id: "${app_user_id}"
              captures: { app_id: $.data.id }
            - call: "POST /permit-applications/${app_id}/route-segments"
              payload: { closure_schedule_id: "${sched_id}", segment_label: "L 1-4", closure_start: "2026-06-15T09:00:00Z", closure_end: "2026-06-15T15:00:00Z" }
              as: Applicant
              as_user_id: "${app_user_id}"
            - call: "POST /permit-applications/${app_id}/submit-for-review"
              payload: { expected_venue_version: "${venue_v0}" }
              as: Applicant
              as_user_id: "${app_user_id}"
            - call: "GET /permit-applications/${app_id}/reviews"
              payload: {}
              as: PermitOfficer
              captures: { rev_police: "$.data[0].id", rev_fire: "$.data[1].id" }
            - call: "POST /permit-applications/${app_id}/reviews/${rev_fire}/veto"
              payload: { note: "No hydrant clearance" }
              as: DepartmentReviewer
              as_user_id: "FIRE"
          trigger:
            - call: "POST /permit-applications/${app_id}/reviews/${rev_police}/approve"
              payload: { planned_personnel: 4, planned_hours: 8, hourly_rate: 50 }
              as: DepartmentReviewer
              as_user_id: "POLICE"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_APPLICATION_NOT_UNDER_REVIEW"
            - "PermitApplication.${app_id}.status == DENIED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: venue_buffered_interval_double_booking
        grounds:
          - validations[priority=9]
          - errors[ERR_VENUE_DOUBLE_BOOKED]
          - entities.Venue.fields.setup_buffer_minutes
        distinguishing_aspect: |
          Venue overlap uses a CLOSED buffer expansion: window [start-buffer,
          end+buffer]. App1 [10:00,14:00]+60m => [09:00,15:00]; App2 [14:30,18:00]+60m
          => [13:30,19:00] collides at 13:30<15:00 -> ERR_VENUE_DOUBLE_BOOKED.
          Buffer-expanded closed-interval geometry on the Venue resource.
        test_recipe:
          setup:
            - "Venue cap 5000 buffer 60; App1 (cap-fitting) submitted booking [10:00,14:00]; App2 window [14:30,18:00] on same venue, capacity fine, about to submit."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Shared Park", venue_type: "PARK", max_capacity: 5000, setup_buffer_minutes: 60 }
              as: PermitOfficer
              captures: { venue_id: $.data.id, venue_v0: $.data.version }
            - call: "POST /closure-schedules"
              payload: { corridor_name: "M1 St", min_gap_minutes: 30 }
              as: PermitOfficer
              captures: { sched1: $.data.id }
            - call: "POST /closure-schedules"
              payload: { corridor_name: "M2 St", min_gap_minutes: 30 }
              as: PermitOfficer
              captures: { sched2: $.data.id }
            - call: "POST /applicants"
              payload: { org_name: "Org M1", contact_email: "m1@x.com" }
              as: PermitOfficer
              captures: { u1: $.data.id }
            - call: "POST /applicants"
              payload: { org_name: "Org M2", contact_email: "m2@x.com" }
              as: PermitOfficer
              captures: { u2: $.data.id }
            - call: "POST /permit-applications"
              payload: { applicant_org: "Org M1", venue_id: "${venue_id}", event_kind: "PARADE", expected_attendance: 2000, occupy_start: "2026-06-16T10:00:00Z", occupy_end: "2026-06-16T14:00:00Z" }
              as: Applicant
              as_user_id: "${u1}"
              captures: { app1: $.data.id }
            - call: "POST /permit-applications/${app1}/route-segments"
              payload: { closure_schedule_id: "${sched1}", segment_label: "M1 1-3", closure_start: "2026-06-16T09:00:00Z", closure_end: "2026-06-16T15:00:00Z" }
              as: Applicant
              as_user_id: "${u1}"
            - call: "POST /permit-applications/${app1}/submit-for-review"
              payload: { expected_venue_version: "${venue_v0}" }
              as: Applicant
              as_user_id: "${u1}"
            - call: "GET /venues/${venue_id}"
              payload: {}
              as: PermitOfficer
              captures: { venue_v1: $.data.version }
            - call: "POST /permit-applications"
              payload: { applicant_org: "Org M2", venue_id: "${venue_id}", event_kind: "FESTIVAL", expected_attendance: 2000, occupy_start: "2026-06-16T14:30:00Z", occupy_end: "2026-06-16T18:00:00Z" }
              as: Applicant
              as_user_id: "${u2}"
              captures: { app2: $.data.id }
            - call: "POST /permit-applications/${app2}/route-segments"
              payload: { closure_schedule_id: "${sched2}", segment_label: "M2 1-3", closure_start: "2026-06-16T13:30:00Z", closure_end: "2026-06-16T19:00:00Z" }
              as: Applicant
              as_user_id: "${u2}"
          trigger:
            - call: "POST /permit-applications/${app2}/submit-for-review"
              payload: { expected_venue_version: "${venue_v1}" }
              as: Applicant
              as_user_id: "${u2}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VENUE_DOUBLE_BOOKED"
            - "PermitApplication.${app2}.status == DRAFT (unchanged)"

      - name: closure_min_gap_half_open_conflict
        grounds:
          - validations[priority=10]
          - errors[ERR_CLOSURE_CONFLICT]
          - entities.ClosureSchedule.fields.min_gap_minutes
        distinguishing_aspect: |
          ClosureSchedule overlap uses HALF-OPEN intervals with a min-gap of 30m:
          closure1 [10:00,12:00); closure2 [12:20,13:00) leaves only 20m clear <
          30m -> ERR_CLOSURE_CONFLICT. Gap-based half-open geometry on the
          ClosureSchedule resource, distinct from the buffered venue interval above.
        test_recipe:
          setup:
            - "A DRAFT app; one route segment already on schedule S closing [10:00,12:00); a second segment [12:20,13:00) on the same schedule about to be added."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V12", venue_type: "STREET_CORRIDOR", max_capacity: 6000 }
              as: PermitOfficer
              captures: { venue_id: $.data.id }
            - call: "POST /closure-schedules"
              payload: { corridor_name: "N St", min_gap_minutes: 30 }
              as: PermitOfficer
              captures: { sched_id: $.data.id }
            - call: "POST /applicants"
              payload: { org_name: "Org N", contact_email: "n@x.com" }
              as: PermitOfficer
              captures: { app_user_id: $.data.id }
            - call: "POST /permit-applications"
              payload: { applicant_org: "Org N", venue_id: "${venue_id}", event_kind: "RACE", expected_attendance: 3000, occupy_start: "2026-06-17T09:00:00Z", occupy_end: "2026-06-17T14:00:00Z" }
              as: Applicant
              as_user_id: "${app_user_id}"
              captures: { app_id: $.data.id }
            - call: "POST /permit-applications/${app_id}/route-segments"
              payload: { closure_schedule_id: "${sched_id}", segment_label: "N first", closure_start: "2026-06-17T10:00:00Z", closure_end: "2026-06-17T12:00:00Z" }
              as: Applicant
              as_user_id: "${app_user_id}"
          trigger:
            - call: "POST /permit-applications/${app_id}/route-segments"
              payload: { closure_schedule_id: "${sched_id}", segment_label: "N second", closure_start: "2026-06-17T12:20:00Z", closure_end: "2026-06-17T13:00:00Z" }
              as: Applicant
              as_user_id: "${app_user_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CLOSURE_CONFLICT (gap 20m < 30m min_gap)"
            - "HTTP status == 409"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: deposit_conservation_forfeit_plus_refund
        grounds:
          - calculations.deposit_reconciliation
          - entities.Deposit.fields.forfeited_amount
          - entities.Deposit.fields.refunded_amount
          - entities.Deposit.fields.amount
        distinguishing_aspect: |
          Conserved money quantity: for the Deposit, forfeited_amount +
          refunded_amount == amount is pinned exactly after debrief-finalize
          (120.00 + 380.00 == 500.00); no cents drift. Conserved quantity = deposit dollars.
        test_recipe:
          setup:
            - "A fully issued MEDIUM app with HELD deposit 500, debrief opened cleanup_charges 120, finalized."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: PermitOfficer
            - call: "POST /venues"
              payload: { name: "V13", venue_type: "PLAZA", max_capacity: 5000, setup_buffer_minutes: 60 }
              as: PermitOfficer
              captures: { venue_id: $.data.id, venue_v0: $.data.version }
            - call: "POST /closure-schedules"
              payload: { corridor_name: "O St", min_gap_minutes: 30 }
              as: PermitOfficer
              captures: { sched_id: $.data.id }
            - call: "POST /applicants"
              payload: { org_name: "Org O", contact_email: "o@x.com" }
              as: PermitOfficer
              captures: { app_user_id: $.data.id }
            - call: "POST /permit-applications"
              payload: { applicant_org: "Org O", venue_id: "${venue_id}", event_kind: "FESTIVAL", expected_attendance: 3000, occupy_start: "2026-06-18T10:00:00Z", occupy_end: "2026-06-18T14:00:00Z" }
              as: Applicant
              as_user_id: "${app_user_id}"
              captures: { app_id: $.data.id }
            - call: "POST /permit-applications/${app_id}/route-segments"
              payload: { closure_schedule_id: "${sched_id}", segment_label: "O 1-4", closure_start: "2026-06-18T09:00:00Z", closure_end: "2026-06-18T15:00:00Z" }
              as: Applicant
              as_user_id: "${app_user_id}"
            - call: "POST /permit-applications/${app_id}/submit-for-review"
              payload: { expected_venue_version: "${venue_v0}" }
              as: Applicant
              as_user_id: "${app_user_id}"
            - call: "GET /permit-applications/${app_id}/reviews"
              payload: {}
              as: PermitOfficer
              captures: { rev_police: "$.data[0].id", rev_fire: "$.data[1].id", rev_ems: "$.data[2].id", rev_pw: "$.data[3].id" }
            - call: "POST /permit-applications/${app_id}/reviews/${rev_police}/approve"
              payload: { planned_personnel: 4, planned_hours: 8, hourly_rate: 50 }
              as: DepartmentReviewer
              as_user_id: "POLICE"
            - call: "POST /permit-applications/${app_id}/reviews/${rev_fire}/approve"
              payload: { planned_personnel: 2, planned_hours: 6, hourly_rate: 60 }
              as: DepartmentReviewer
              as_user_id: "FIRE"
            - call: "POST /permit-applications/${app_id}/reviews/${rev_ems}/approve"
              payload: { planned_personnel: 1, planned_hours: 8, hourly_rate: 45 }
              as: DepartmentReviewer
              as_user_id: "EMS"
            - call: "POST /permit-applications/${app_id}/reviews/${rev_pw}/approve"
              payload: { planned_personnel: 3, planned_hours: 4, hourly_rate: 40 }
              as: DepartmentReviewer
              as_user_id: "PUBLIC_WORKS"
            - call: "POST /permit-applications/${app_id}/coi"
              payload: { carrier: "Acme", coverage_amount: 1200000, expires_at: "2027-01-01T00:00:00Z" }
              as: Applicant
              as_user_id: "${app_user_id}"
              captures: { coi_id: $.data.id }
            - call: "POST /permit-applications/${app_id}/coi/${coi_id}/accept"
              payload: {}
              as: PermitOfficer
            - call: "POST /permit-applications/${app_id}/deposit"
              payload: { amount: 500 }
              as: Applicant
              as_user_id: "${app_user_id}"
              captures: { deposit_id: $.data.id }
            - call: "POST /permit-applications/${app_id}/issue"
              payload: {}
              as: PermitOfficer
            - call: "POST /permit-applications/${app_id}/debrief"
              payload: { actual_attendance: 3000, cleanup_charges: 120, incident_count: 0 }
              as: PermitOfficer
              captures: { debrief_id: $.data.id }
          trigger:
            - call: "POST /permit-applications/${app_id}/debrief/${debrief_id}/finalize"
              payload: {}
              as: PermitOfficer
          assert:
            - "Deposit.${deposit_id}.forfeited_amount == 120.00"
            - "Deposit.${deposit_id}.refunded_amount == 380.00"
            - "Deposit.${deposit_id}.forfeited_amount + Deposit.${deposit_id}.refunded_amount == 500.00 (== amount, conserved)"

      - name: venue_version_reserve_release_balance
        grounds:
          - state_machines.PermitApplication.DRAFT_to_UNDER_REVIEW
          - state_machines.PermitApplication.UNDER_REVIEW_to_CANCELLED
          - entities.Venue.fields.version
        distinguishing_aspect: |
          Conserved reservation quantity: submit reserves the venue window
          (Venue.version += 1) and cancel releases it (Venue.version += 1); the
          net effect returns the venue to a state where a new application can book
          the same window — the conserved quantity is venue occupancy availability,
          a different type than deposit dollars.
        test_recipe:
          setup:
            - "Venue cap 5000 buffer 60; App1 submitted booking [10:00,14:00] then cancelled; App2 wants the same window."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V14", venue_type: "PARK", max_capacity: 5000, setup_buffer_minutes: 60 }
              as: PermitOfficer
              captures: { venue_id: $.data.id, venue_v0: $.data.version }
            - call: "POST /closure-schedules"
              payload: { corridor_name: "P1 St", min_gap_minutes: 30 }
              as: PermitOfficer
              captures: { sched1: $.data.id }
            - call: "POST /closure-schedules"
              payload: { corridor_name: "P2 St", min_gap_minutes: 30 }
              as: PermitOfficer
              captures: { sched2: $.data.id }
            - call: "POST /applicants"
              payload: { org_name: "Org P1", contact_email: "p1@x.com" }
              as: PermitOfficer
              captures: { u1: $.data.id }
            - call: "POST /applicants"
              payload: { org_name: "Org P2", contact_email: "p2@x.com" }
              as: PermitOfficer
              captures: { u2: $.data.id }
            - call: "POST /permit-applications"
              payload: { applicant_org: "Org P1", venue_id: "${venue_id}", event_kind: "PARADE", expected_attendance: 2000, occupy_start: "2026-06-19T10:00:00Z", occupy_end: "2026-06-19T14:00:00Z" }
              as: Applicant
              as_user_id: "${u1}"
              captures: { app1: $.data.id }
            - call: "POST /permit-applications/${app1}/route-segments"
              payload: { closure_schedule_id: "${sched1}", segment_label: "P1 1-3", closure_start: "2026-06-19T09:00:00Z", closure_end: "2026-06-19T15:00:00Z" }
              as: Applicant
              as_user_id: "${u1}"
            - call: "POST /permit-applications/${app1}/submit-for-review"
              payload: { expected_venue_version: "${venue_v0}" }
              as: Applicant
              as_user_id: "${u1}"
            - call: "POST /permit-applications/${app1}/cancel"
              payload: {}
              as: Applicant
              as_user_id: "${u1}"
            - call: "GET /venues/${venue_id}"
              payload: {}
              as: PermitOfficer
              captures: { venue_v_after_cancel: $.data.version }
            - call: "POST /permit-applications"
              payload: { applicant_org: "Org P2", venue_id: "${venue_id}", event_kind: "FESTIVAL", expected_attendance: 2000, occupy_start: "2026-06-19T10:00:00Z", occupy_end: "2026-06-19T14:00:00Z" }
              as: Applicant
              as_user_id: "${u2}"
              captures: { app2: $.data.id }
            - call: "POST /permit-applications/${app2}/route-segments"
              payload: { closure_schedule_id: "${sched2}", segment_label: "P2 1-3", closure_start: "2026-06-19T09:00:00Z", closure_end: "2026-06-19T15:00:00Z" }
              as: Applicant
              as_user_id: "${u2}"
          trigger:
            - call: "POST /permit-applications/${app2}/submit-for-review"
              payload: { expected_venue_version: "${venue_v_after_cancel}" }
              as: Applicant
              as_user_id: "${u2}"
          assert:
            - "PermitApplication.${app2}.status == UNDER_REVIEW (same window bookable again after App1 cancel released the reservation)"
            - "PermitApplication.${app1}.status == CANCELLED"
