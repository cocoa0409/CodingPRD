            - { call: "POST /api/projects/${proj}/quote", payload: { expected_project_version: "${p_v}" }, as: ProjectManager, captures: { q_price: $.data.quote_price_cents } }
            - { call: "POST /api/projects/${proj}/quote/send", payload: {}, as: ProjectManager }
