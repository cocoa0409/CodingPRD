              as: AgencyReviewer
              as_user_id: "u_agency"
              captures: { err: $.data.error_id }
          assert:
            - "${fw_after_1} == IN_PROGRESS and ${rv_after_1} == ADDITIONAL_REQUIRED and ${rounds_after_1} == 1"
            - "${rounds_after_2} == 2"
            - "${err} == ERR_STUDY_STATE_INVALID with HTTP 409"
            - "ResourceStudy.${study}.additional_round_count == 2 (unchanged by the refused third round)"
            - "ResourceStudy.${study}.review_status == UNDER_REVIEW and fieldwork_status == COMPLETED"

      - name: settlement_negotiation_rounds_exhaust_into_failed_and_supersede_measures
        grounds:
          - state_machines.Settlement.CIRCULATED_to_NEGOTIATING
          - state_machines.Settlement.CIRCULATED_to_FAILED
          - state_machines.PmeMeasure.PROPOSED_to_SUPERSEDED
          - calculations.settlement_support_tally
        distinguishing_aspect: |
          Settlement loops NEGOTIATING -> CIRCULATED -> NEGOTIATING through round_number 1, 2 and 3
          and only the CLOSE_ROUND taken at round 3 lands in FAILED; the round-1 signature is
          retained but excluded from the round-2 tally (support_pct 0.00), and reaching FAILED
          cascades the settlement's PROPOSED measure to SUPERSEDED while leaving the project ledger
          at 0.00 because PROPOSED measures were never counted.
        test_recipe:
          setup:
            - "Project at STUDY_PHASE with an APPROVED study plan, pad_year 2026, base_annual_generation_mwh 250000."
            - "Two parties, both vote_weight 1: an AGENCY with conditioning authority (u_agency) and an NGO (u_ngo)."
            - "One Settlement in CIRCULATED at round 1 with a single SUPPORT signature from the NGO, and one PROPOSED SETTLEMENT-sourced PmeMeasure attached to it."
