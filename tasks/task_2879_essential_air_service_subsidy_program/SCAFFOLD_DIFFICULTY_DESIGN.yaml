  - rule_id: non_linear_state_machine
    instances:
      - name: solicitation_reopen_cycle_expires_candidacy_permanently
        grounds:
          - state_machines.Solicitation
          - entities.Solicitation.fields.round_number
          - state_machines.Proposal.evaluation_state
          - validations.priority_27
        non_linear_feature: "cycle — Solicitation loops CLOSED -> OPEN -> CLOSED an unbounded number of times, but the loop is not idempotent: each REOPEN pushes the round's candidates into the terminal EXPIRED evaluation state, so re-closing cannot resurrect them"
        distinguishing_aspect: |
          The non-linearity here is a revisitable cycle on the Solicitation entity whose side effects
          are irreversible on a *different* entity. Re-entering CLOSED with the same proposal set
          leaves the candidate pool empty and the selection order fails, which distinguishes it from
          the parallel-dimension instance (same entity, two independent dimensions) and from the
          bounded negotiation cycle (loop counter caps the number of laps).
        test_recipe:
          setup:
            - "Community HYS ELIGIBLE; solicitation OPEN with closes_at 2026-08-20T00:00:00Z; clock 2026-08-01T00:00:00Z."
            - "Prairie Air proposal P1 SUBMITTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /eas/communities"
              payload: { code: "HYS", name: "Hays", state_code: "KS", driving_miles_to_nearest_hub: 165.0, enplanements_prior_year: 6200, min_required_weekly_round_trips: 12, min_required_weekly_seats: 400 }
              as: ProgramAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /eas/communities/${comm_id}/eligibility-determinations"
              payload: { waiver_requested: false }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
            - call: "POST /eas/aircraft-types"
              payload: { code: "B190", name: "Beechcraft 1900D", seats: 19, is_jet: false, fuel_burn_gal_per_hour: 68.0, hourly_operating_cost_usd: 1450.00 }
              as: ProgramAdmin
              captures: { ac_b190_id: $.data.id }
            - call: "POST /eas/carriers"
              payload: { name: "Prairie Air", certificate_number: "CERT-1001" }
              as: ProgramAdmin
              captures: { car1_id: $.data.id }
            - call: "POST /eas/carriers"
              payload: { name: "Frontier Regional", certificate_number: "CERT-1002" }
              as: ProgramAdmin
              captures: { car2_id: $.data.id }
            - call: "POST /eas/solicitations"
              payload: { community_id: "${comm_id}", closes_at: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              captures: { sol_id: $.data.id }
            - call: "POST /eas/proposals"
              payload: { solicitation_id: "${sol_id}", carrier_id: "${car1_id}", aircraft_type_id: "${ac_b190_id}", service_level: "ESSENTIAL_MINIMUM", weekly_round_trips: 12, seats_per_departure: 19, annual_subsidy_request_usd: 1600000.00, term_months: 24, payment_basis: "COMPLETED_FLIGHT_PRORATION" }
              as: Carrier
              as_user_id: "${car1_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /eas/proposals/${p1_id}/actions"
              payload: { action: "SUBMIT" }
              as: Carrier
              as_user_id: "${car1_id}"
          trigger:
            - call: "POST /eas/solicitations/${sol_id}/actions"
              payload: { action: "CLOSE", note: "round 1 closed" }
              as: ProgramAdmin
            - call: "POST /eas/solicitations/${sol_id}/actions"
              payload: { action: "REOPEN", note: "insufficient competition" }
              as: ProgramAdmin
            - call: "POST /eas/solicitations/${sol_id}/actions"
              payload: { action: "CLOSE", note: "round 2 closed with no new entrants" }
              as: ProgramAdmin
            - call: "POST /eas/solicitations/${sol_id}/selection-order"
              payload: { order_note: "attempt award on an all-expired pool" }
              as: SelectionOfficer
              as_user_id: "officer-1"
              captures: { no_candidates_error_id: $.data.error_id }
            - call: "POST /eas/solicitations/${sol_id}/actions"
              payload: { action: "REOPEN", note: "reopen for round 3" }
              as: ProgramAdmin
            - call: "POST /eas/proposals"
              payload: { solicitation_id: "${sol_id}", carrier_id: "${car2_id}", aircraft_type_id: "${ac_b190_id}", service_level: "ESSENTIAL_MINIMUM", weekly_round_trips: 13, seats_per_departure: 19, annual_subsidy_request_usd: 1700000.00, term_months: 24, payment_basis: "COMPLETED_FLIGHT_PRORATION" }
              as: Carrier
