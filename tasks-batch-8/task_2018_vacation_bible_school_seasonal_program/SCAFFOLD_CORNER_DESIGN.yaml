            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000 }, as: ProgramDirector, captures: { prog_id: $.data.id } }
            - { call: "POST /vbs/supply-orders", payload: { program_id: "${prog_id}", kit_name: "Starter Kit", vendor: "Cokesbury", quantity: 4, unit_cost_cents: 5000 }, as: ProgramDirector, captures: { ord: $.data.id } }
            - { call: "POST /vbs/supply-orders/${ord}/submit", payload: {}, as: ProgramDirector, captures: { s1: $.data.status } }
          trigger:
            - { call: "POST /vbs/supply-orders/${ord}/return-for-revision", payload: {}, as: ProgramDirector, captures: { s2: $.data.status } }
            - { call: "PATCH /vbs/supply-orders/${ord}", payload: { quantity: 5 }, as: ProgramDirector, captures: { total: $.data.total_cost_cents } }
            - { call: "POST /vbs/supply-orders/${ord}/submit", payload: {}, as: ProgramDirector, captures: { s3: $.data.status } }
            - { call: "POST /vbs/supply-orders/${ord}/approve", payload: {}, as: ProgramDirector, captures: { s4: $.data.status } }
            - { call: "GET /vbs/programs/${prog_id}/supply-plan", payload: {}, as: ProgramDirector, captures: { budget_left: $.data.budget_remaining_cents } }
          assert:
            - "${s1} == SUBMITTED and ${s2} == DRAFT and ${s3} == SUBMITTED and ${s4} == APPROVED  (revision loop cycles legally)"
            - "${total} == 25000  (edit while DRAFT took effect: 5 * 5000)"
            - "${budget_left} == 75000  (100000 - 25000 debited at approval)"
      - name: accept_from_enrolled_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.Registration.OFFERED_to_ENROLLED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "accept is defined only from OFFERED; calling it on an already-ENROLLED registration fails with ERR_INVALID_STATE (idempotency guard: no double-enroll, no extra seat consumption)."
        test_recipe:
          setup: ["Program Alpha REGISTRATION_OPEN; Koalas (cap 2); child A ENROLLED"]
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000, child_staff_ratio: 4, waitlist_offer_ttl_hours: 48, pickup_cutoff_time: "12:00" }, as: ProgramDirector, captures: { prog_id: $.data.id } }
            - { call: "POST /vbs/classrooms", payload: { program_id: "${prog_id}", name: "Koalas", age_min: 4, age_max: 6, capacity: 2 }, as: RegistrationCoordinator, captures: { cls_k: $.data.id } }
            - { call: "POST /vbs/programs/${prog_id}/open-registration", payload: {}, as: ProgramDirector }
            - { call: "POST /vbs/families", payload: { household_name: "Alvarez", primary_contact_name: "Maria Alvarez", email: "alvarez@example.com", phone: "555-0101" }, as: Anonymous, captures: { fam_id: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "A", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { ka: $.data.id } }
            - { call: "POST /vbs/registrations", payload: { child_id: "${ka}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}", captures: { reg_a: $.data.id } }
          trigger:
            - { call: "POST /vbs/registrations/${reg_a}/accept", payload: {}, as: Parent, as_user_id: "${fam_id}", captures: { err: $.data.error_id } }
            - { call: "GET /vbs/classrooms/${cls_k}", payload: {}, as: RegistrationCoordinator, captures: { k_enr: $.data.enrolled_count } }
          assert:
            - "${err} == ERR_INVALID_STATE"
            - "${k_enr} == 1  (no double-enroll side effect)"

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: age_boundary_birthday_on_start_date_counted
        claim_type: correct_result
        grounds:
          - "calculations.age_at_registration"
          - "errors[ERR_AGE_OUT_OF_RANGE]"
        distinguishing_aspect: "The age formula treats a birthday exactly on start_date as turned: born 2020-08-17 is age 6 on 2026-08-17 (inside band 4-6, enrolls); born 2019-08-16 is age 7 (outside, ERR_AGE_OUT_OF_RANGE)."
        test_recipe:
          setup: ["Program Alpha REGISTRATION_OPEN; Koalas (4-6, cap 10); family with children born 2020-08-17 and 2019-08-16"]
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000, child_staff_ratio: 4 }, as: ProgramDirector, captures: { prog_id: $.data.id } }
            - { call: "POST /vbs/classrooms", payload: { program_id: "${prog_id}", name: "Koalas", age_min: 4, age_max: 6, capacity: 10 }, as: RegistrationCoordinator, captures: { cls_k: $.data.id } }
            - { call: "POST /vbs/programs/${prog_id}/open-registration", payload: {}, as: ProgramDirector }
            - { call: "POST /vbs/families", payload: { household_name: "Alvarez", primary_contact_name: "Maria Alvarez", email: "alvarez@example.com", phone: "555-0101" }, as: Anonymous, captures: { fam_id: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "OnDay", last_name: "A", birth_date: "2020-08-17", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { k_in: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "DayBefore", last_name: "B", birth_date: "2019-08-16", grade_completed: "GRADE_1" }, as: Parent, as_user_id: "${fam_id}", captures: { k_out: $.data.id } }
          trigger:
            - { call: "POST /vbs/registrations", payload: { child_id: "${k_in}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}", captures: { st_in: $.data.status, age_in: $.data.age_at_registration } }
            - { call: "POST /vbs/registrations", payload: { child_id: "${k_out}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}", captures: { err: $.data.error_id } }
          assert:
            - "${age_in} == 6 and ${st_in} == ENROLLED  (birthday on start_date counts as turned)"
            - "${err} == ERR_AGE_OUT_OF_RANGE  (one day earlier makes the child 7, outside the inclusive band)"
      - name: budget_remaining_excludes_unapproved_orders
        claim_type: input_set_filtering
        grounds: [calculations.budget_remaining]
        distinguishing_aspect: "budget_remaining_cents sums ONLY APPROVED orders: DRAFT, SUBMITTED and CANCELLED orders with identical totals are excluded, so with one APPROVED 6000 order the remaining is 94000, not lower."
        test_recipe:
          setup:
            - "Program Alpha (budget 100000, no classrooms); orders: A 2x3000 APPROVED; B 5x3000 SUBMITTED; C 7x3000 DRAFT; D 1x3000 created then CANCELLED"
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000 }, as: ProgramDirector, captures: { prog_id: $.data.id } }
            - { call: "POST /vbs/supply-orders", payload: { program_id: "${prog_id}", kit_name: "Kit A", vendor: "Cokesbury", quantity: 2, unit_cost_cents: 3000 }, as: ProgramDirector, captures: { ord_a: $.data.id } }
            - { call: "POST /vbs/supply-orders/${ord_a}/submit", payload: {}, as: ProgramDirector }
            - { call: "POST /vbs/supply-orders/${ord_a}/approve", payload: {}, as: ProgramDirector }
            - { call: "POST /vbs/supply-orders", payload: { program_id: "${prog_id}", kit_name: "Kit B", vendor: "Cokesbury", quantity: 5, unit_cost_cents: 3000 }, as: ProgramDirector, captures: { ord_b: $.data.id } }
            - { call: "POST /vbs/supply-orders/${ord_b}/submit", payload: {}, as: ProgramDirector }
            - { call: "POST /vbs/supply-orders", payload: { program_id: "${prog_id}", kit_name: "Kit C", vendor: "Cokesbury", quantity: 7, unit_cost_cents: 3000 }, as: ProgramDirector }
            - { call: "POST /vbs/supply-orders", payload: { program_id: "${prog_id}", kit_name: "Kit D", vendor: "Cokesbury", quantity: 1, unit_cost_cents: 3000 }, as: ProgramDirector, captures: { ord_d: $.data.id } }
            - { call: "POST /vbs/supply-orders/${ord_d}/cancel", payload: {}, as: ProgramDirector }
          trigger:
            - { call: "GET /vbs/programs/${prog_id}/supply-plan", payload: {}, as: ProgramDirector, captures: { budget_left: $.data.budget_remaining_cents } }
          assert:
            - "${budget_left} == 94000  (only the APPROVED order A's 6000 is deducted; SUBMITTED/DRAFT/CANCELLED excluded)"
      - name: waitlist_position_fcfs_recompute
        claim_type: constants_applied
        grounds: [calculations.waitlist_position_ordering]
        distinguishing_aspect: "Positions are dense 1-based ranks by created_at ASC: after the head withdraws, the remaining registrations recompute to 1 and 2 with no gaps."
        test_recipe:
          setup: ["Program Alpha REGISTRATION_OPEN; Koalas (cap 1): A ENROLLED; B, C, D WAITLISTED at positions 1, 2, 3"]
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000, child_staff_ratio: 4 }, as: ProgramDirector, captures: { prog_id: $.data.id } }
            - { call: "POST /vbs/classrooms", payload: { program_id: "${prog_id}", name: "Koalas", age_min: 4, age_max: 6, capacity: 1 }, as: RegistrationCoordinator, captures: { cls_k: $.data.id } }
            - { call: "POST /vbs/programs/${prog_id}/open-registration", payload: {}, as: ProgramDirector }
            - { call: "POST /vbs/families", payload: { household_name: "Alvarez", primary_contact_name: "Maria Alvarez", email: "alvarez@example.com", phone: "555-0101" }, as: Anonymous, captures: { fam_id: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "A", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { ka: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "B", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { kb: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "C", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { kc: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "D", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { kd: $.data.id } }
            - { call: "POST /vbs/registrations", payload: { child_id: "${ka}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}" }
            - { call: "POST /vbs/registrations", payload: { child_id: "${kb}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}", captures: { reg_b: $.data.id, pb: $.data.waitlist_position } }
            - { call: "POST /vbs/registrations", payload: { child_id: "${kc}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}", captures: { reg_c: $.data.id, pc: $.data.waitlist_position } }
            - { call: "POST /vbs/registrations", payload: { child_id: "${kd}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}", captures: { reg_d: $.data.id, pd: $.data.waitlist_position } }
          trigger:
            - { call: "POST /vbs/registrations/${reg_b}/cancel", payload: {}, as: Parent, as_user_id: "${fam_id}" }
            - { call: "GET /vbs/registrations/${reg_c}", payload: {}, as: RegistrationCoordinator, captures: { pc2: $.data.waitlist_position } }
            - { call: "GET /vbs/registrations/${reg_d}", payload: {}, as: RegistrationCoordinator, captures: { pd2: $.data.waitlist_position } }
          assert:
            - "${pb} == 1 and ${pc} == 2 and ${pd} == 3  (FCFS by created_at at creation)"
            - "${pc2} == 1 and ${pd2} == 2  (dense recompute after the head withdraws; created_at order preserved, id never consulted)"
      - name: recipient_count_dedups_families
        claim_type: correct_result
        grounds: [calculations.recipient_count_resolution, entities.FamilyMessage.fields.recipient_count]
        distinguishing_aspect: "Recipient resolution dedups by family: 3 enrolled children across 2 families yields recipient_count 2 for ALL_FAMILIES; ALLERGY_ALERT counts only families with an APPROVED FOOD_ALLERGY plan (1)."
