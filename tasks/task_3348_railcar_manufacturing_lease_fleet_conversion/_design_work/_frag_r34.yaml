scaffold_difficulty_design:
  - rule_id: non_linear_state_machine
    instances:
      - name: car_assignment_suspend_reassign_fork
        grounds:
          - state_machines.CarAssignment.ACTIVE_to_SUSPENDED
          - state_machines.CarAssignment.SUSPENDED_to_ACTIVE
          - state_machines.CarAssignment.ACTIVE_to_REASSIGNED
          - state_machines.CarAssignment.REASSIGNED_to_ACTIVE
          - entities.CarAssignment.fields.status
          - entities.LeaseFleetCar.fields.status
          - calculations.assignment_per_diem_accrual
          - validations[priority=11]
        distinguishing_aspect: |
          CarAssignment is non-linear by a branching fork at ACTIVE into two branches with
          divergent side-effect sets: the SUSPENDED branch pulls the parent LeaseFleetCar to
          HELD and rejoins ACTIVE through POST /car-assignments/{id}/resume without minting a
          row, while the REASSIGNED branch instead mints a replacement CarAssignment on a
          second car and leaves the source placement retired - a fork with two cycles, not a
          linear A->B->C pipeline.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z; a BOXCAR car type BOX-100 (build_hours 4) whose bill of materials is one WHEELSET and one CASTING row, both in stock, with no COATING row."
            - "A lessee with utilization_threshold_pct 60 and credit_ceiling_cents 50000000, and an ACTIVE FULL_SERVICE contract with per_diem_rate_cents 45000, liability_bearer LESSOR and fleet_car_cap 3."
            - "A RETAINED production order of 3 cars is component-reserved, released against that contract and completed on 2026-06-01, producing 3 HELD fleet cars that are interchangeable for this recipe."
            - "All three cars are placed under the contract from 2026-06-01; the third placement is suspended so its car sits HELD with the same lease_contract_id and is a legal reassign target."
            - "The clock is advanced to 2026-06-11 so the suspension of the first placement accrues exactly 10 days."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
              payload: { model_code: "BOX-100", car_class: "BOXCAR", build_hours: 4, regulatory_life_years: 25, line_count_family: "BOX_LINE" }
              as: ProductionPlanner
              captures: { ct_id: "$.data.id" }
            - call: "POST /api/v1/components"
              payload: { part_number: "WS-1000", component_class: "WHEELSET", unit_cost_cents: 250000, lead_time_days: 40, on_hand_qty: 4 }
              as: SupplyChainCoordinator
              captures: { comp_ws_id: "$.data.id" }
            - call: "POST /api/v1/components"
              payload: { part_number: "CS-2000", component_class: "CASTING", unit_cost_cents: 180000, lead_time_days: 20, on_hand_qty: 4 }
              as: SupplyChainCoordinator
              captures: { comp_cs_id: "$.data.id" }
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_id}", component_id: "${comp_ws_id}", qty_per_car: 1 }
              as: ProductionPlanner
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_id}", component_id: "${comp_cs_id}", qty_per_car: 1 }
              as: ProductionPlanner
            - call: "POST /api/v1/lessees"
              payload: { legal_name: "Fork Rail Lessee", credit_tier: "A", utilization_threshold_pct: 60, credit_ceiling_cents: 50000000 }
              as: LeaseAdministrator
              captures: { lessee_id: "$.data.id" }
            - call: "POST /api/v1/lease-contracts"
              payload: { lessee_id: "${lessee_id}", lease_type: "FULL_SERVICE", per_diem_rate_cents: 45000, liability_bearer: "LESSOR", term_start_date: "2026-01-01", term_end_date: "2027-12-31", fleet_car_cap: 3 }
              as: LeaseAdministrator
              captures: { contract_id: "$.data.id" }
            - call: "POST /api/v1/lease-contracts/${contract_id}/activate"
              payload: {}
              as: LeaseAdministrator
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_id}", quantity: 3, planned_shop_days: 12, disposition: "RETAINED", priority_rank: 1, order_date: "2026-05-25", required_delivery_date: "2026-08-31", lessee_id: "${lessee_id}" }
              as: ProductionPlanner
              captures: { order_id: "$.data.id" }
            - call: "POST /api/v1/production-orders/${order_id}/reserve-components"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${order_id}/release"
              payload: { lease_contract_id: "${contract_id}" }
              as: ProductionPlanner
            - call: "POST /api/v1/production-lines/BOX_LINE/changeover"
              payload: { production_order_id: "${order_id}", scheduled_start_date: "2026-06-01", scheduled_end_date: "2026-06-13" }
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${order_id}/complete"
              payload: { completed_qty: 3, completion_date: "2026-06-01" }
              as: ProductionPlanner
            - call: "GET /api/v1/lease-fleet-cars?production_order_id=${order_id}"
              as: PlatformAdmin
              captures: { car_a_id: "$.data[0].id", car_b_id: "$.data[1].id", car_c_id: "$.data[2].id" }
            - call: "POST /api/v1/car-assignments"
              payload: { lease_fleet_car_id: "${car_a_id}", lease_contract_id: "${contract_id}", lessee_id: "${lessee_id}", start_date: "2026-06-01", end_date: "2026-06-30", mileage_allowance: 3000 }
              as: LeaseAdministrator
              captures: { asg_a_id: "$.data.id" }
            - call: "POST /api/v1/car-assignments"
              payload: { lease_fleet_car_id: "${car_b_id}", lease_contract_id: "${contract_id}", lessee_id: "${lessee_id}", start_date: "2026-06-01", end_date: "2026-06-10", mileage_allowance: 3000 }
              as: LeaseAdministrator
              captures: { asg_b_id: "$.data.id" }
            - call: "POST /api/v1/car-assignments"
              payload: { lease_fleet_car_id: "${car_c_id}", lease_contract_id: "${contract_id}", lessee_id: "${lessee_id}", start_date: "2026-06-01", end_date: "2026-06-05", mileage_allowance: 3000 }
              as: LeaseAdministrator
              captures: { asg_c_id: "$.data.id" }
            - call: "POST /api/v1/car-assignments/${asg_c_id}/suspend"
              payload: { suspend_date: "2026-06-01" }
              as: LeaseAdministrator
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-11T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/v1/car-assignments/${asg_a_id}/suspend"
              payload: { suspend_date: "2026-06-11" }
              as: LeaseAdministrator
            - call: "POST /api/v1/car-assignments/${asg_a_id}/resume"
              payload: {}
              as: LeaseAdministrator
            - call: "POST /api/v1/car-assignments/${asg_b_id}/reassign"
              payload: { target_lease_fleet_car_id: "${car_c_id}", effective_date: "2026-06-10" }
              as: LeaseAdministrator
          assert:
            - "SUSPENDED branch rejoins ACTIVE: CarAssignment ${asg_a_id}.status == ACTIVE and LeaseFleetCar ${car_a_id}.status == ASSIGNED"
            - "SUSPENDED branch mints nothing: GET /api/v1/car-assignments?lease_fleet_car_id=${car_a_id} returns exactly 1 CarAssignment"
            - "REASSIGNED branch mints a row: GET /api/v1/car-assignments?lease_fleet_car_id=${car_c_id} returns exactly 2 CarAssignments, the added one ACTIVE with start_date == 2026-06-10 and per_diem_rate_cents == 45000 snapshotted from contract ${contract_id}"
            - "Divergence: CarAssignment ${asg_b_id}.status == REASSIGNED while ${asg_a_id} sits ACTIVE, so the two branches leave different row sets behind"
            - "CarAssignment ${asg_a_id}.per_diem_accrued_cents == 450000 (10 days from 2026-06-01 to the 2026-06-11 suspension at per_diem_rate_cents 45000, with mileage_used 0 so the 12 percent utilization credit is 0)"

      - name: lease_fleet_car_sold_held_void_cycle
        grounds:
          - state_machines.LeaseFleetCar.HELD_to_SOLD
          - state_machines.LeaseFleetCar.SOLD_to_HELD
          - state_machines.LeaseFleetSale.PENDING_SETTLEMENT_to_VOIDED
          - state_machines.LeaseFleetCar.HELD_to_UNDER_REPAIR
          - state_machines.LeaseFleetCar.UNDER_REPAIR_to_HELD
          - entities.LeaseFleetCar.fields.status
          - validations[priority=6]
        distinguishing_aspect: |
          LeaseFleetCar is non-linear by a compensating re-entry cycle rather than a fork:
          HELD -> SOLD is a declared terminal_state, yet SOLD -> HELD exists through
          POST /lease-fleet-sales/{id}/void, so the machine cycles HELD -> SOLD -> HELD ->
          SOLD while §1.4 priority 6 (ERR_ALREADY_TERMINAL) deliberately omits the void
          endpoint from its applies_to list.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z; a BOXCAR car type BOX-100 (build_hours 4, regulatory_life_years 25) with a one-row WHEELSET and one-row CASTING bill of materials, both in stock."
            - "A lessee and a contract with fleet_car_cap 1, activated, then a RETAINED production order of 1 car is component-reserved, released against the contract, scheduled on BOX_LINE and completed on 2026-06-01."
            - "The completion produces exactly one HELD LeaseFleetCar with acquisition_cost_cents == 660000; it is never assigned, so its lease_contract_id stays null and the settlement precondition (contract TERMINATED or null) is already satisfied."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
              payload: { model_code: "BOX-100", car_class: "BOXCAR", build_hours: 4, regulatory_life_years: 25, line_count_family: "BOX_LINE" }
              as: ProductionPlanner
              captures: { ct_id: "$.data.id" }
            - call: "POST /api/v1/components"
              payload: { part_number: "WS-1000", component_class: "WHEELSET", unit_cost_cents: 250000, lead_time_days: 40, on_hand_qty: 2 }
              as: SupplyChainCoordinator
              captures: { comp_ws_id: "$.data.id" }
            - call: "POST /api/v1/components"
              payload: { part_number: "CS-2000", component_class: "CASTING", unit_cost_cents: 180000, lead_time_days: 20, on_hand_qty: 2 }
              as: SupplyChainCoordinator
              captures: { comp_cs_id: "$.data.id" }
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_id}", component_id: "${comp_ws_id}", qty_per_car: 1 }
              as: ProductionPlanner
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_id}", component_id: "${comp_cs_id}", qty_per_car: 1 }
              as: ProductionPlanner
            - call: "POST /api/v1/lessees"
              payload: { legal_name: "Void Cycle Lessee", credit_tier: "A", utilization_threshold_pct: 60, credit_ceiling_cents: 50000000 }
              as: LeaseAdministrator
              captures: { lessee_id: "$.data.id" }
            - call: "POST /api/v1/lease-contracts"
              payload: { lessee_id: "${lessee_id}", lease_type: "FULL_SERVICE", per_diem_rate_cents: 45000, liability_bearer: "LESSOR", term_start_date: "2026-01-01", term_end_date: "2027-12-31", fleet_car_cap: 1 }
              as: LeaseAdministrator
              captures: { contract_id: "$.data.id" }
            - call: "POST /api/v1/lease-contracts/${contract_id}/activate"
              payload: {}
              as: LeaseAdministrator
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_id}", quantity: 1, planned_shop_days: 4, disposition: "RETAINED", priority_rank: 1, order_date: "2026-05-25", required_delivery_date: "2026-08-31", lessee_id: "${lessee_id}" }
              as: ProductionPlanner
              captures: { order_id: "$.data.id" }
            - call: "POST /api/v1/production-orders/${order_id}/reserve-components"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${order_id}/release"
              payload: { lease_contract_id: "${contract_id}" }
              as: ProductionPlanner
            - call: "POST /api/v1/production-lines/BOX_LINE/changeover"
              payload: { production_order_id: "${order_id}", scheduled_start_date: "2026-06-01", scheduled_end_date: "2026-06-05" }
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${order_id}/complete"
              payload: { completed_qty: 1, completion_date: "2026-06-01" }
              as: ProductionPlanner
            - call: "GET /api/v1/lease-fleet-cars?production_order_id=${order_id}"
              as: PlatformAdmin
              captures: { car_id: "$.data[0].id" }
          trigger:
            - call: "POST /api/v1/lease-fleet-sales"
              payload: { lease_fleet_car_id: "${car_id}", buyer_name: "Midwest Rail Holdings", sale_price_cents: 900000, writeback_liability_cents: 0, sale_date: "2026-06-02" }
              as: PortfolioManager
              captures: { sale_1_id: "$.data.id" }
            - call: "POST /api/v1/lease-fleet-sales/${sale_1_id}/void"
              payload: { reason: "buyer withdrew financing" }
              as: PortfolioManager
            - call: "POST /api/v1/lease-fleet-sales"
              payload: { lease_fleet_car_id: "${car_id}", buyer_name: "Great Lakes Freight", sale_price_cents: 880000, writeback_liability_cents: 0, sale_date: "2026-06-03" }
              as: PortfolioManager
              captures: { sale_2_id: "$.data.id" }
          assert:
            - "Cycle re-entered: LeaseFleetCar ${car_id}.status == SOLD again after the void returned it to HELD, so HELD -> SOLD -> HELD -> SOLD is a real cycle and not a one-way pipeline"
            - "LeaseFleetSale ${sale_1_id}.status == VOIDED and the second sale is a distinct row: ${sale_2_id} != ${sale_1_id} with status PENDING_SETTLEMENT"
            - "Compensating step is ledger-neutral: PortfolioLedger.realized_gain_cents == 0 because no sale ever settled, matching the SOLD_to_HELD side effect that leaves the realized gain where it stood"
            - "LeaseFleetCar ${car_id}.regulatory_life_end_date == 2051-06-01 (built_date 2026-06-01 plus regulatory_life_years 25) so the 2026-06-02 and 2026-06-03 sale dates clear §1.4 priority 8"

  - rule_id: transitive_cascade
    instances:
      - name: retained_completion_fleet_capital_cascade
        grounds:
          - state_machines.ProductionOrder.IN_PRODUCTION_to_COMPLETED
          - calculations.lease_fleet_capital_allocation
          - calculations.order_price_quote
          - calculations.fleet_capital_reconciliation
          - entities.LeaseFleetCar.fields.acquisition_cost_cents
          - entities.LeaseContract.fields.capital_allocation_cents
          - state_machines.PortfolioLedger.OPEN_to_OPEN
        distinguishing_aspect: |
          A depth-3 chain in which each hop is caused by the previous hop rather than by the
          trigger: ProductionOrder IN_PRODUCTION -> COMPLETED creates the LeaseFleetCar rows,
          and only then does lease_fleet_capital_allocation re-derive
          LeaseContract.capital_allocation_cents from the count of those new rows (2 x 660000),
          with PortfolioLedger.fleet_nbv_cents as the terminal hop over the same live-car set -
          no hop is a parallel mutation of the original action.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z; a BOXCAR car type BOX-100 (build_hours 4) whose bill of materials is one WHEELSET row (part WS-1000, unit_cost_cents 250000) and one CASTING row (part CS-2000, unit_cost_cents 180000), each qty_per_car 1, with on_hand_qty 4 each and no COATING row."
            - "A lessee and an ACTIVE FULL_SERVICE contract with per_diem_rate_cents 45000, liability_bearer LESSOR and fleet_car_cap 2, so the 2-car retention fits validation priority 19."
            - "A RETAINED production order of 2 cars is component-reserved, released against that contract and scheduled on BOX_LINE with a 8-day window, leaving the order IN_PRODUCTION and the fleet empty."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
              payload: { model_code: "BOX-100", car_class: "BOXCAR", build_hours: 4, regulatory_life_years: 25, line_count_family: "BOX_LINE" }
              as: ProductionPlanner
              captures: { ct_id: "$.data.id" }
            - call: "POST /api/v1/components"
              payload: { part_number: "WS-1000", component_class: "WHEELSET", unit_cost_cents: 250000, lead_time_days: 40, on_hand_qty: 4 }
              as: SupplyChainCoordinator
              captures: { comp_ws_id: "$.data.id" }
            - call: "POST /api/v1/components"
              payload: { part_number: "CS-2000", component_class: "CASTING", unit_cost_cents: 180000, lead_time_days: 20, on_hand_qty: 4 }
              as: SupplyChainCoordinator
              captures: { comp_cs_id: "$.data.id" }
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_id}", component_id: "${comp_ws_id}", qty_per_car: 1 }
              as: ProductionPlanner
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_id}", component_id: "${comp_cs_id}", qty_per_car: 1 }
              as: ProductionPlanner
            - call: "POST /api/v1/lessees"
              payload: { legal_name: "Capital Cascade Lessee", credit_tier: "A", utilization_threshold_pct: 60, credit_ceiling_cents: 50000000 }
              as: LeaseAdministrator
              captures: { lessee_id: "$.data.id" }
            - call: "POST /api/v1/lease-contracts"
              payload: { lessee_id: "${lessee_id}", lease_type: "FULL_SERVICE", per_diem_rate_cents: 45000, liability_bearer: "LESSOR", term_start_date: "2026-01-01", term_end_date: "2027-12-31", fleet_car_cap: 2 }
              as: LeaseAdministrator
              captures: { contract_id: "$.data.id" }
            - call: "POST /api/v1/lease-contracts/${contract_id}/activate"
              payload: {}
              as: LeaseAdministrator
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_id}", quantity: 2, planned_shop_days: 8, disposition: "RETAINED", priority_rank: 1, order_date: "2026-05-30", required_delivery_date: "2026-08-31", lessee_id: "${lessee_id}" }
              as: ProductionPlanner
              captures: { order_id: "$.data.id" }
            - call: "POST /api/v1/production-orders/${order_id}/reserve-components"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${order_id}/release"
              payload: { lease_contract_id: "${contract_id}" }
              as: ProductionPlanner
            - call: "POST /api/v1/production-lines/BOX_LINE/changeover"
              payload: { production_order_id: "${order_id}", scheduled_start_date: "2026-06-01", scheduled_end_date: "2026-06-09" }
              as: ProductionPlanner
          trigger:
            - call: "POST /api/v1/production-orders/${order_id}/complete"
              payload: { completed_qty: 2, completion_date: "2026-06-01" }
              as: ProductionPlanner
          assert:
            - "Hop 1: ProductionOrder ${order_id}.status == COMPLETED and completed_qty == 2"
            - "Hop 2 (caused by hop 1): GET /api/v1/lease-fleet-cars?production_order_id=${order_id} returns exactly 2 LeaseFleetCars, each status == HELD with production_order_id == ${order_id} and acquisition_cost_cents == 660000 (the committed order_price_quote: ceil((1*180000+25000)/100)*100 + ceil((1*250000+25000)/100)*100 + 4*45000 = 205000 + 275000 + 180000, zero change fee)"
            - "Hop 3 (caused by hop 2): LeaseContract ${contract_id}.capital_allocation_cents == 1320000, re-derived as count(live cars of the order) 2 x unit_price_cents 660000, so the derived lessor equity is floor(1320000 * min(700, 900) / 10000) == 92400"
            - "Terminal hop over the same live-car set: PortfolioLedger.fleet_nbv_cents == 1320000 and PortfolioLedger.committed_capital_cents == 1320000 (age 0 on 2026-06-01, so max(0, 660000 - 0*2500) twice)"

      - name: sale_settlement_realized_gain_cascade
        grounds:
          - state_machines.LeaseFleetSale.PENDING_SETTLEMENT_to_SETTLED
          - calculations.sale_gain_loss
          - calculations.fleet_capital_reconciliation
          - state_machines.PortfolioLedger.OPEN_to_OPEN
          - entities.LeaseFleetSale.fields.gain_loss_cents
          - entities.LeaseFleetCar.fields.status
        distinguishing_aspect: |
          A depth-2 chain from a different trigger than the completion cascade: settling the
          LeaseFleetSale (PENDING_SETTLEMENT -> SETTLED) is what moves PortfolioLedger
          .realized_gain_cents, and the size of that move is exactly the gain_loss_cents the
          sale computed at creation (700000 - 660000 - 0), so the ledger hop is caused by the
          settled sale rather than fanned out from the sale's own creation.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z; a BOXCAR car type BOX-100 (build_hours 4) with a one-row WHEELSET and one-row CASTING bill of materials, both in stock."
            - "A lessee and a contract with fleet_car_cap 1, activated; a RETAINED production order of 1 car is component-reserved, released against the contract, scheduled on BOX_LINE and completed on 2026-06-01, producing one HELD car with acquisition_cost_cents == 660000 and committed_capital_cents == 660000 on the ledger."
            - "The contract is then terminated (no CarAssignment references it, so the cascade list is empty) leaving the car HELD and its contract TERMINATED, which is the precondition the settle step reads."
            - "A secondary-market sale of that car is created with sale_price_cents 700000 and writeback_liability_cents 0 on sale_date 2026-06-01, so gain_loss_cents == 40000 and the sale sits PENDING_SETTLEMENT."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
              payload: { model_code: "BOX-100", car_class: "BOXCAR", build_hours: 4, regulatory_life_years: 25, line_count_family: "BOX_LINE" }
              as: ProductionPlanner
              captures: { ct_id: "$.data.id" }
            - call: "POST /api/v1/components"
              payload: { part_number: "WS-1000", component_class: "WHEELSET", unit_cost_cents: 250000, lead_time_days: 40, on_hand_qty: 2 }
              as: SupplyChainCoordinator
              captures: { comp_ws_id: "$.data.id" }
            - call: "POST /api/v1/components"
              payload: { part_number: "CS-2000", component_class: "CASTING", unit_cost_cents: 180000, lead_time_days: 20, on_hand_qty: 2 }
              as: SupplyChainCoordinator
              captures: { comp_cs_id: "$.data.id" }
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_id}", component_id: "${comp_ws_id}", qty_per_car: 1 }
              as: ProductionPlanner
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_id}", component_id: "${comp_cs_id}", qty_per_car: 1 }
              as: ProductionPlanner
            - call: "POST /api/v1/lessees"
              payload: { legal_name: "Settlement Cascade Lessee", credit_tier: "A", utilization_threshold_pct: 60, credit_ceiling_cents: 50000000 }
              as: LeaseAdministrator
              captures: { lessee_id: "$.data.id" }
            - call: "POST /api/v1/lease-contracts"
              payload: { lessee_id: "${lessee_id}", lease_type: "FULL_SERVICE", per_diem_rate_cents: 45000, liability_bearer: "LESSOR", term_start_date: "2026-01-01", term_end_date: "2027-12-31", fleet_car_cap: 1 }
              as: LeaseAdministrator
              captures: { contract_id: "$.data.id" }
            - call: "POST /api/v1/lease-contracts/${contract_id}/activate"
              payload: {}
              as: LeaseAdministrator
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_id}", quantity: 1, planned_shop_days: 4, disposition: "RETAINED", priority_rank: 1, order_date: "2026-05-30", required_delivery_date: "2026-08-31", lessee_id: "${lessee_id}" }
              as: ProductionPlanner
              captures: { order_id: "$.data.id" }
            - call: "POST /api/v1/production-orders/${order_id}/reserve-components"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${order_id}/release"
              payload: { lease_contract_id: "${contract_id}" }
              as: ProductionPlanner
            - call: "POST /api/v1/production-lines/BOX_LINE/changeover"
              payload: { production_order_id: "${order_id}", scheduled_start_date: "2026-06-01", scheduled_end_date: "2026-06-05" }
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${order_id}/complete"
              payload: { completed_qty: 1, completion_date: "2026-06-01" }
              as: ProductionPlanner
            - call: "POST /api/v1/lease-contracts/${contract_id}/terminate"
              payload: {}
              as: LeaseAdministrator
            - call: "GET /api/v1/lease-fleet-cars?production_order_id=${order_id}"
              as: PlatformAdmin
              captures: { car_id: "$.data[0].id" }
            - call: "POST /api/v1/lease-fleet-sales"
              payload: { lease_fleet_car_id: "${car_id}", buyer_name: "Great Lakes Freight", sale_price_cents: 700000, writeback_liability_cents: 0, sale_date: "2026-06-01" }
              as: PortfolioManager
              captures: { sale_id: "$.data.id" }
          trigger:
            - call: "POST /api/v1/lease-fleet-sales/${sale_id}/settle"
              payload: {}
              as: PortfolioManager
          assert:
            - "Hop 1: LeaseFleetSale ${sale_id}.status == SETTLED"
            - "Hop 2 (caused by hop 1): PortfolioLedger.realized_gain_cents == 40000, the settled sale's own gain_loss_cents from sale_gain_loss (sale_price_cents 700000 - book_cents 660000 - writeback_liability_cents 0, with age_days 0 from built_date 2026-06-01 to sale_date 2026-06-01 and DAILY_DEPRECIATION_CENTS 2500 applying zero times)"
            - "Ledger re-derivation on the same hop: PortfolioLedger.fleet_nbv_cents == 0 because the only car left the live set when it was marked SOLD, so the newest basis sums over zero cars"
            - "Boundary of the chain: LeaseFleetCar ${car_id}.status == SOLD both before and after the settle, so the ledger hop is the only mutation the settlement causes"
