              as: PlantAdmin
              captures: { gp_corn_id: $.data.id }
            - call: "POST /coating-specs"
              payload: { coating_code: "G115", zinc_mass_g_per_m2: 350, coating_cost_per_kg_cents: 42, changeover_minutes: 120, max_ambient_moisture_pct: 18.0 }
              as: PlantAdmin
              captures: { cs_g115_id: $.data.id }
            - call: "POST /roll-forming-lines"
              payload: { line_code: "LINE_LOW", max_gauge_mm: 1.3 }
              as: PlantAdmin
              captures: { rl_low_id: $.data.id }
            - call: "POST /roll-forming-lines"
              payload: { line_code: "LINE_A", max_gauge_mm: 3.0 }
              as: PlantAdmin
              captures: { rl_a_id: $.data.id }
            - call: "POST /engineers"
              payload: { name: "Dana Author", license_number: "PE-1001", licensed_jurisdiction_codes: ["IA-CENTRAL", "NE-WEST", "CA-VALLEY"] }
              as: PlantAdmin
              captures: { eng_a_id: $.data.id }
            - call: "POST /dealers"
              payload: { name: "Alpha Grain Systems", region_code: "NE-01", jurisdiction_id: "${j_ns_id}", credit_limit_cents: 900000000, program_tier: "BASE", staging_slots: 2, high_cube_access: true }
              as: PlantAdmin
              captures: { dlr_a_id: $.data.id }
            - call: "POST /bin-designs"
              payload: { dealer_id: "${dlr_a_id}", jurisdiction_id: "${j_ns_id}", grain_profile_id: "${gp_corn_id}", coating_spec_id: "${cs_g115_id}", diameter_m: 12.0, eave_height_m: 9.6, roof_pitch_deg: 30, design_wind_speed_mph: 105, moisture_pct: 14.0, design_method: "ASD" }
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { d1_id: $.data.id, d1_gauge: $.data.sheet_gauge_mm }
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${dlr_a_id}", bin_design_id: "${d1_id}", order_season: "OFFSEASON", aeration_package: "NONE", unload_system: "GRAVITY" }
              as: DealerPrincipal
              as_user_id: "${dlr_a_id}"
              captures: { o1_id: $.data.id }
            - call: "POST /coil-lots"
              payload: { coating_spec_id: "${cs_g115_id}", heat_number: "H-70001", gauge_mm: 2.0, received_kg: 20000.0 }
              as: ProductionPlanner
              captures: { cl_thick_id: $.data.id }
            - call: "POST /coil-lots"
              payload: { coating_spec_id: "${cs_g115_id}", heat_number: "H-70002", gauge_mm: 1.6, received_kg: 20000.0 }
              as: ProductionPlanner
              captures: { cl_match_id: $.data.id, cl_match_rem: $.data.remaining_kg }
          trigger:
            - call: "POST /roll-forming-runs"
              payload: { roll_forming_line_id: "${rl_low_id}", coil_lot_id: "${cl_thick_id}", dealer_order_id: "${o1_id}", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T14:00:00Z", planned_kg: 6600.0 }
              as: ProductionPlanner
