  # ---- HireRecord ----------------------------------------------------------
  - method: POST
    path: "/hire-records"
    description: "Hires a QUALIFIED application into a funded requisition seat under OCC on the carrier version."
    roles: [SafetyDirector]
    code: 201
    input: [application_id, hired_on, expected_carrier_version]
    output: HireRecord
    side_effects:
      - "sets applicant_id, carrier_id and prior_hire_id (the most recent TERMINATED hire of the same applicant at the same carrier, ordered by terminated_on DESC then created_at DESC, else null)"
      - "advances DriverApplication.qualification_status QUALIFIED -> HIRED"
      - "recomputes Carrier.filled_requisitions, deficiency_ratio and posture"
      - "increments Carrier.version by 1"

  - method: GET
    path: "/hire-records/{hire_record_id}"
    description: "Reads one hire record."
    roles: [Recruiter, DER, SafetyDirector, ComplianceAuditor, SchoolCoordinator, Applicant]
    code: 200
    input: []
    output: HireRecord
    side_effects: []

  - method: GET
    path: "/hire-records"
    description: "Lists hire records; application_id, applicant_id, carrier_id and prior_hire_id are the reverse-reachability filters."
    roles: [Recruiter, DER, SafetyDirector, ComplianceAuditor, SchoolCoordinator, Applicant]
    code: 200
    input: ["application_id?", "applicant_id?", "carrier_id?", "prior_hire_id?", "status?", "limit?", "offset?"]
    output: HireRecord[]
    side_effects: []

  - method: POST
    path: "/hire-records/{hire_record_id}/terminate"
    description: "ACTIVE -> TERMINATED; origin of the four-hop turnover cascade."
    roles: [SafetyDirector]
    code: 200
    input: [terminated_on, termination_type, rehire_flag]
    output: HireRecord
    side_effects:
      - "HOP 1: sets terminated_on, termination_type, rehire_flag and tenure_days"
      - "HOP 2: every ACTIVE TuitionAgreement of the applicant becomes TERMINATED_CLAWBACK with clawback_cents = outstanding_cents"
      - "HOP 3: DriverApplicant.outstanding_clawback_cents and rehire_eligibility are recomputed"
      - "HOP 4: when rehire_eligibility becomes PERMANENTLY_INELIGIBLE, every non-terminal DriverApplication of that applicant becomes DISQUALIFIED with reason REHIRE_INELIGIBLE"
      - "recomputes Carrier.filled_requisitions, deficiency_ratio and posture; increments Carrier.version by 1"

  - method: POST
    path: "/hire-records/{hire_record_id}/rescind"
    description: "ACTIVE -> RESCINDED; the exact compensating inverse of POST /hire-records."
    roles: [SafetyDirector]
    code: 200
    input: [reason]
    output: HireRecord
    side_effects:
      - "returns DriverApplication.qualification_status HIRED -> QUALIFIED"
      - "recomputes Carrier.filled_requisitions, deficiency_ratio and posture; increments Carrier.version by 1"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing/empty, or X-User-Role is not one of the six declared roles."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role is not listed in the endpoint's roles."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An Applicant acts on a Clearinghouse consent decision or a screening dispute that does not belong to their own DriverApplicant record."
  - id: ERR_VALIDATION
    http: 422
    condition: "Missing required body field, undeclared enum member, out-of-range integer, unparseable date, bad pagination limit/offset, employed_to <= employed_from, ends_at <= starts_at, or terminated_on < hired_on."
  - id: ERR_CARRIER_NOT_FOUND
    http: 404
    condition: "carrier_id in path or body does not resolve."
  - id: ERR_APPLICANT_NOT_FOUND
    http: 404
    condition: "applicant_id in path or body does not resolve."
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "application_id or prior_application_id in path or body does not resolve."
  - id: ERR_VERIFICATION_NOT_FOUND
    http: 404
    condition: "verification_id in path does not resolve."
  - id: ERR_SCREENING_CHECK_NOT_FOUND
    http: 404
    condition: "screening_check_id in path does not resolve."
  - id: ERR_CLEARINGHOUSE_QUERY_NOT_FOUND
    http: 404
    condition: "clearinghouse_query_id in path does not resolve."
  - id: ERR_DRUG_TEST_NOT_FOUND
    http: 404
    condition: "drug_test_order_id in path does not resolve."
  - id: ERR_ROAD_TEST_NOT_FOUND
    http: 404
    condition: "road_test_id in path does not resolve."
  - id: ERR_SESSION_NOT_FOUND
    http: 404
    condition: "session_id in path or body does not resolve."
  - id: ERR_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "enrollment_id in path, or a member of attended_enrollment_ids, does not resolve."
  - id: ERR_DQ_FILE_NOT_FOUND
    http: 404
    condition: "dq_file_id in path does not resolve."
  - id: ERR_DQ_DOCUMENT_NOT_FOUND
    http: 404
    condition: "document_id in path does not resolve."
  - id: ERR_TUITION_AGREEMENT_NOT_FOUND
    http: 404
    condition: "tuition_agreement_id in path does not resolve."
  - id: ERR_HIRE_RECORD_NOT_FOUND
    http: 404
    condition: "hire_record_id in path does not resolve."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_carrier_version, expected_session_version, expected_dq_file_version or expected_application_version does not equal the parent's current version."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target row is not in a declared `from:` state for the requested transition (e.g. record-collection on a LAB_DILUTE order whose dilute_recollect_count is already 1, or resubmit-info on an application that is not INFO_REQUESTED)."
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "The target row is already in one of its terminal states (e.g. cancelling a CANCELLED enrollment, adjudicating an ADVERSE_FINAL check, terminating a TERMINATED hire)."
  - id: ERR_DUPLICATE_DOT_NUMBER
    http: 409
    condition: "POST /carriers with an already-registered dot_number, or POST /driver-applicants with an email already used at that carrier."
  - id: ERR_DUPLICATE_ACTIVE_APPLICATION
    http: 409
    condition: "The applicant already holds a DriverApplication whose qualification_status is not HIRED and not DISQUALIFIED at the same carrier."
  - id: ERR_APPLICATION_NOT_QUALIFIED
    http: 409
    condition: "The application behind the operation is DISQUALIFIED or SCREEN_FAILED, or has not reached the qualification_status the operation requires (ROAD_TEST_PASSED for enrollment, QUALIFIED for hire)."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "The acting X-User-ID equals the application's recruiter_user_id on an annual review / revocation, or does not equal RoadTest.examiner_user_id on a road-test result, or the examiner is the recruiter."
  - id: ERR_CLEARINGHOUSE_PROHIBITED
    http: 409
    condition: "A ClearinghouseQuery of the application is in RESULT_PROHIBITED or CONSENT_DENIED, or a LIMITED query is still in RESULT_INFO_EXISTS with follow_up_full_query_id null."
  - id: ERR_CONSENT_NOT_GRANTED
    http: 409
    condition: "record-result called on a query whose own status is not CONSENT_GRANTED (checked at priority 12, ahead of the generic state check)."
  - id: ERR_CONSENT_EXPIRED
    http: 409
    condition: "The current logical clock date is after ClearinghouseQuery.consent_expires_on."
  - id: ERR_DRUG_TEST_NOT_NEGATIVE
    http: 409
    condition: "No PRE_EMPLOYMENT DrugTestOrder of the application is in MRO_VERIFIED_NEGATIVE."
  - id: ERR_MVR_POINTS_EXCEEDED
    http: 409
    condition: "adjudicate PASS on an MVR check whose adjudication_score >= Carrier.mvr_point_threshold (equality is disqualifying)."
  - id: ERR_MVR_EXPIRED
    http: 409
    condition: "The annual review finds no ADJUDICATED_PASS MVR check whose expires_on >= the current logical clock date."
  - id: ERR_MEDICAL_CERT_INVALID
    http: 409
    condition: "The applicant's cdl_downgrade_risk is DOWNGRADED at enrollment time, or is DOWNGRADED or NO_CERTIFICATE at hire time."
  - id: ERR_EMPLOYMENT_HISTORY_INCOMPLETE
    http: 409
    condition: "DriverApplication.gap_days_unexplained under the strict_verified variant exceeds MAX_UNEXPLAINED_GAP_DAYS (30) at hire time."
  - id: ERR_REVIEW_NOT_DUE
    http: 409
    condition: "annual-review called while the DqFile.review_state is NOT_DUE."
  - id: ERR_ORIENTATION_OVERLAP
    http: 409
    condition: "The candidate session's 12-hour-buffered half-open interval intersects a session the same application already occupies."
  - id: ERR_EXAMINER_SLOT_CONFLICT
    http: 409
    condition: "The candidate 180-minute closed examiner slot intersects (including touching endpoints) another SCHEDULED road test of the same examiner_user_id."
  - id: ERR_SESSION_AT_CAPACITY
    http: 409
    condition: "OrientationSession.enrolled_count already equals capacity."
  - id: ERR_ROAD_TEST_ATTEMPTS_EXHAUSTED
    http: 409
    condition: "reschedule called on a road test whose attempt_number is already 3."
  - id: ERR_DQ_FILE_INCOMPLETE
    http: 409
    condition: "POST /hire-records with a DqFile whose status is not COMPLETE."
  - id: ERR_REHIRE_INELIGIBLE
    http: 409
    condition: "The applicant's rehire_eligibility is COOLDOWN or PERMANENTLY_INELIGIBLE when opening, submitting or hiring an application."
  - id: ERR_CARRIER_POSTURE_BLOCKED
    http: 409
    condition: "Carrier.posture is FROZEN for a hire, or not in {OPEN, RESTRICTED} for a submit."
  - id: ERR_NO_OPEN_REQUISITION
    http: 409
    condition: "Carrier.filled_requisitions already equals Carrier.open_requisitions when the seat would be consumed."
  - id: ERR_NO_CLAWBACK_TO_REVERSE
    http: 409
    condition: "reverse-clawback called on an agreement whose clawback_cents is 0 (checked at priority 19, ahead of the generic state check)."
  - id: ERR_COMMITMENT_ALREADY_FULFILLED
    http: 409
    condition: "accrue-month called when months_served already equals commitment_months, including on a FULFILLED agreement (checked at priority 18, ahead of the terminal check)."

# =============================================================================
# §1.7 RBAC Matrix — segregation of duties
# =============================================================================
roles:
  - name: Recruiter
    description: "Sourcing desk. Owns applicants, applications, employment verifications, screening orders, road-test scheduling, orientation logistics and manual DQ document filing. Never adjudicates, never certifies, never hires."
    identity: opaque
    exclusive_operations:
      - "POST /driver-applicants"
      - "POST /driver-applications"
      - "POST /driver-applications/{application_id}/submit"
      - "POST /driver-applications/{application_id}/resubmit-info"
      - "POST /driver-applications/{application_id}/reapply"
      - "POST /employment-verifications"
      - "POST /employment-verifications/{verification_id}/send-request"
      - "POST /employment-verifications/{verification_id}/record-response"
      - "POST /employment-verifications/{verification_id}/mark-no-response"
      - "POST /screening-checks"
      - "POST /screening-checks/{screening_check_id}/record-result"
      - "POST /road-tests"
      - "POST /road-tests/{road_test_id}/reschedule"
      - "POST /orientation-sessions"
      - "POST /orientation-sessions/{session_id}/open"
      - "POST /orientation-sessions/{session_id}/complete"
      - "POST /orientation-enrollments"
      - "POST /orientation-enrollments/{enrollment_id}/cancel"
      - "PUT /dq-documents/{document_id}"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "all GET endpoints"

  - name: DER
    description: "Designated Employer Representative. Sole owner of Clearinghouse queries and of the drug & alcohol testing chain, from specimen collection through MRO verification."
    identity: opaque
    exclusive_operations:
      - "POST /clearinghouse-queries"
      - "POST /clearinghouse-queries/{clearinghouse_query_id}/record-result"
      - "POST /drug-test-orders"
      - "POST /drug-test-orders/{drug_test_order_id}/record-collection"
      - "POST /drug-test-orders/{drug_test_order_id}/record-lab-result"
      - "POST /drug-test-orders/{drug_test_order_id}/record-mro-verification"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "all GET endpoints"

  - name: SafetyDirector
    description: "Adjudicates screening reports, examines road tests, configures the carrier, and makes hire / terminate / rescind decisions. Cannot create the applications it later judges."
    identity: opaque
    exclusive_operations:
      - "POST /carriers"
      - "PATCH /carriers/{carrier_id}"
      - "POST /driver-applications/{application_id}/request-info"
      - "POST /driver-applications/{application_id}/disqualify"
      - "POST /screening-checks/{screening_check_id}/adjudicate"
      - "POST /road-tests/{road_test_id}/record-result"
      - "POST /hire-records"
      - "POST /hire-records/{hire_record_id}/terminate"
      - "POST /hire-records/{hire_record_id}/rescind"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "all GET endpoints"

  - name: ComplianceAuditor
    description: "Independent DQ-file auditor. Certifies and revokes annual reviews and nothing else; may never certify a file whose recruiter_user_id equals their own X-User-ID."
    identity: opaque
    exclusive_operations:
      - "POST /dq-files/{dq_file_id}/annual-review"
      - "POST /dq-files/{dq_file_id}/revoke-certification"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "all GET endpoints"

  - name: SchoolCoordinator
    description: "Training-school partnership desk. Owns tuition agreements, monthly accruals and clawback reversals."
    identity: opaque
    exclusive_operations:
      - "POST /tuition-agreements"
      - "POST /tuition-agreements/{tuition_agreement_id}/activate"
      - "POST /tuition-agreements/{tuition_agreement_id}/accrue-month"
      - "POST /tuition-agreements/{tuition_agreement_id}/reverse-clawback"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "all GET endpoints"

  - name: Applicant
    description: "The driver themselves. X-User-ID is the DriverApplicant.id. May grant or deny Clearinghouse consent on their own queries and dispute a pre-adverse screening finding; may read everything."
    identity: "entity_backed:DriverApplicant"
    exclusive_operations:
      - "POST /clearinghouse-queries/{clearinghouse_query_id}/consent-decision"
      - "POST /screening-checks/{screening_check_id}/dispute"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "all GET endpoints"
