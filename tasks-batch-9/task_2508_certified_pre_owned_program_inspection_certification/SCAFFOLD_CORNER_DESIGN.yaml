            - "the arithmetic: miles_over == 15000, blocks == floor(15000 / 10000) == 1, mileage term == 9000; age_over is still 0"
            - "fee_discount_cents == 0 and Dealer.${d1}.fee_billed_cents_total == 98900"
            - "Certification.${c1}.warranty_end_miles == 67000, computed from odometer_at_inspection 55000 plus the 12000-mile extension"

      - name: volume_discount_tier_boundary_at_first_activation
        claim_type: tiered_pricing
        grounds:
          - calculations.certification_fee
          - entities.ProgramConfig.fields.volume_discount_tiers
        distinguishing_aspect: |
          The tier is chosen on lifetime_activated_count as read BEFORE the current activation, so a
          reconfigured ladder whose second rung starts at min_count 1 gives the dealer's first
          certification no discount and its second the full 5 percent. An implementation that reads
          the counter after incrementing discounts the very first activation.
        test_recipe:
          setup:
