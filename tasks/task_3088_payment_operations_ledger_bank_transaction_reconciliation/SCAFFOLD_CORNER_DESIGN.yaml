  instances:
  - name: waive_is_a_conditional_action_gated_on_age_and_escalation
    claim_type: Conditional action
    grounds:
    - state_machines.ExceptionItem.transitions.ESCALATED_to_WAIVED
    - validations[priority=21]
    - calculations.exception_aging_bucket
    - errors[ERR_EXCEPTION_NOT_AGED]
    distinguishing_aspect: 'Waive is not a blanket action: it is refused with ERR_EXCEPTION_NOT_AGED while the item
      is CURRENT and admitted once the aging pass has pushed it into AGING, so the conditional gate is the derived
      bucket rather than the status alone.'
