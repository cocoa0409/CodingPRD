              captures: { bd16: $.data.id }
            - call: "POST /api/infrastructure-bonds/${bd16}/award-bid"
              payload: { awarded_bid_cents: 9000000 }
              as: DeveloperOperator
            - call: "POST /api/infrastructure-bonds/${bd16}/post-bond"
              payload: { posted_amount_cents: 9900000 }
              as: DeveloperOperator
            - call: "POST /api/phases/${ph16}/activate"
              payload: {}
              as: DeveloperOperator
            - call: "POST /api/utility-providers"
              payload: { provider_name: "City Water", utility_type: "WATER", max_connections_per_day: 2 }
              as: MunicipalClerk
