            - "The pair is not reducible to one rule: call 1 and call 4 return the same error for different observer counts, while call 2 returns a different error for the same observer count as call 1, so only the priority ordering explains call 1."

      - name: pp_lot_referential_beats_fiscal_quantity
        grounds:
          - validations.lot-matches-precinct-style
          - validations.issue-quantity-within-receipt
          - state_machines.BallotLot.RECEIVED_to_ISSUED
          - entities.Precinct.fields.assigned_style_id
