            - "ComplianceReport.${rep_id}.type_attainments[FIRE].spacing_compliant == false"
            - "ComplianceReport.${rep_id}.type_attainments[FIRE].attainment_count_only == true"
            - "ComplianceReport.${rep_id}.type_attainments[FIRE].attainment_strict == false"

      - name: overall_score_rounding_order_pinned
        grounds:
          - calculations.overall_compliance_score
        distinguishing_aspect: |
          Mode (b) nested rounding: with completed/required = FIRE 3/4,
          EVACUATION 1/7, EARTHQUAKE 3/7, the PINNED order (round each ratio to
          4dp HALF_UP, average, x100, round 1dp HALF_UP) yields 44.1
          (0.7500+0.1429+0.4286 = 1.3215; /3 = 0.4405; x100 = 44.05 -> 44.1),
          whereas averaging unrounded ratios yields 44.0 — rounding order
          changes the published score.
        test_recipe:
          setup:
            - "Site with ACTIVE EOP and three requirements: FIRE (required 4, spacing 0, target 300), EVACUATION (required 7, spacing 0, target 240), EARTHQUAKE (required 7, spacing 0, target 300)"
            - "Completed drills: 3 FIRE (2026-09-01, 2026-09-08, 2026-09-15), 1 EVACUATION (2026-09-02), 3 EARTHQUAKE (2026-09-03, 2026-09-10, 2026-09-17)"
