scenario: |
  Generate task harder than expert level!

  2632. Hotel Loyalty Program & Owner Reimbursement (hotel brand loyalty program): point earning
  rules by rate type, stay qualification and elite bonus multipliers with exclusion of certain
  rates, program fee assessment to hotels as a percentage of qualifying revenue, redemption
  reimbursement to the property using a formula tied to occupancy and average rate, blackout
  policy, standard versus peak redemption pricing and inventory access rules, elite benefit
  delivery obligations including upgrades, breakfast and late checkout with cost recovery,
  co-brand credit card point purchases and partner point sales revenue, point liability
  accounting, breakage estimation and program fund solvency, member complaint and benefit denial
  escalation

domain_name: hotel-loyalty-owner-reimbursement
api_prefix: /loyalty

complexity_profile:
  primary_archetype: Ledger reconciliation
  secondary_archetype: Pricing engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: flat
  # Every entity is a peer addressed at /loyalty/<collection>; parent-child linkage is by
  # foreign key, never by nesting the child's own identity in the URL. Only three
  # configuration children (RatePlan, RedemptionPricing, BlackoutWindow) are created under a
  # /hotels/{hotelId}/... creation path, and even they are then addressed flatly by their own id.

  state_machine_shape: cyclic
  # Hotel cycles ACTIVE <-> FEE_DELINQUENT; MemberComplaint cycles UNDER_REVIEW <->
  # INFO_REQUESTED; EliteBenefitDelivery cycles DENIED -> ESCALATED -> DELIVERED/DENIED_FINAL.
  # Redemption additionally carries two independent state dimensions (fulfillment_status x
  # reimbursement_status) and Stay branches PENDING_POSTING -> {POSTED_QUALIFYING,
  # POSTED_NON_QUALIFYING} with divergent side-effect sets.

  relationship_patterns:
    - one_to_many          # Hotel -> Stay/Redemption/ReimbursementBatch; Member -> Stay/Redemption
    - self_referential     # PointLedgerEntry.reversal_of_entry_id -> PointLedgerEntry.id
    - cross_aggregate      # Redemption.batch_id crosses the Member aggregate into the Hotel aggregate
    - polymorphic          # PointLedgerEntry carries four mutually exclusive source_* foreign keys

  role_model: segregation_of_duties
  # The ProgramAuditor who released a ReimbursementBatch may not approve it (X-User-ID compared
  # against ReimbursementBatch.released_by_user_id); the MemberCareAgent who resolved a complaint
  # cannot adjudicate its escalation (only ProgramAuditor may).

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Hotel
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: property trade name
        constraints: "1..120 chars, non-empty"
      - name: brand_code
        type: string
        source: input
        description: three-letter brand chain code the property flies
        constraints: "exactly 3 uppercase letters"
      - name: market_tier
        type: enum
        source: input
        description: market classification driving the peak redemption surcharge percentage
        constraints: "one of {URBAN, RESORT, SELECT}"
      - name: program_fee_pct
        type: number
        source: input
        description: fraction of qualifying room revenue assessed to the property as program fee
        constraints: "0.0 <= program_fee_pct <= 0.20, at most 4 decimal places"
      - name: rooms_count
        type: integer
        source: input
        description: sellable room inventory of the property
        constraints: ">= 1"
      - name: trailing_12m_occupancy_pct
        type: number
        source: input
        description: trailing twelve month occupancy used by the owner reimbursement formula
        constraints: "0.0 <= value <= 1.0, at most 4 decimal places"
      - name: trailing_12m_adr_cents
        type: integer
        source: input
        description: trailing twelve month average daily rate in cents, used by the reimbursement formula
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: property lifecycle state
        default: ONBOARDING
        constraints: "one of {ONBOARDING, ACTIVE, FEE_DELINQUENT, TERMINATED}"
      - name: fee_ledger_balance_cents
        type: integer
        source: computed
        description: outstanding program fee the property owes the program; see calculations.program_fee_assessment
        default: 0
      - name: reimbursement_owed_cents
        type: integer
        source: computed
        description: sum of settled_reimbursement_cents over this hotel's Redemptions whose reimbursement_status IN {ACCRUED, BATCHED}
        default: 0
      - name: benefit_recovery_owed_cents
        type: integer
        source: computed
        description: sum of cost_recovery_cents over EliteBenefitDelivery rows of this hotel's Stays whose status == DELIVERED
        default: 0
      - name: benefit_denial_count
        type: integer
        source: computed
        description: count of EliteBenefitDelivery rows of this hotel's Stays whose status IN {DENIED, ESCALATED, DENIED_FINAL}
        default: 0
      - name: blackout_days_used_current_year
        type: integer
        source: computed
        description: sum of day_count over this hotel's BlackoutWindow rows with status == ACTIVE whose start_date year equals the logical clock year
        default: 0
      - name: termination_reason
        type: string
        source: system
        description: reason captured by POST /loyalty/hotels/{hotelId}/terminate; null until terminated
        default: null

  - name: RatePlan
    parent: null
    common_fields: false
    fields:
      - name: hotel_id
        type: string
        source: input
        description: "FK -> Hotel.id; the property that publishes this rate plan"
      - name: rate_code
        type: string
        source: input
        description: property-unique rate code such as BAR or CORP01
        constraints: "1..16 chars, unique per (hotel_id, rate_code)"
      - name: rate_category
        type: enum
        source: input
        description: rate family that decides earning, qualification and fee eligibility
        constraints: "one of {TRANSIENT, CORPORATE_NEGOTIATED, GROUP, OPAQUE_WHOLESALE, EMPLOYEE_COMP, AWARD}"
      - name: base_earn_rate_per_dollar
        type: number
        source: computed
        description: base points earned per whole dollar of room revenue; see calculations.rate_plan_derivation
      - name: is_qualifying
        type: boolean
        source: computed
        description: true when rate_category IN {TRANSIENT, CORPORATE_NEGOTIATED, GROUP}; false for the excluded rate families
      - name: counts_toward_elite
        type: boolean
        source: computed
        description: true when rate_category IN {TRANSIENT, CORPORATE_NEGOTIATED}; GROUP earns points but never elite nights
      - name: program_fee_eligible
        type: boolean
        source: computed
        description: true when rate_category IN {TRANSIENT, CORPORATE_NEGOTIATED, GROUP}; excluded families are never fee-assessed

  - name: RedemptionPricing
    parent: null
    common_fields: false
    fields:
      - name: hotel_id
        type: string
        source: input
        description: "FK -> Hotel.id; the property this award price applies to"
      - name: season
        type: enum
        source: input
        description: award season band this row prices
        constraints: "one of {STANDARD, PEAK}"
      - name: window_start_date
        type: string
        source: input
        description: inclusive first calendar date this row applies to (YYYY-MM-DD)
      - name: window_end_date
        type: string
        source: input
        description: inclusive last calendar date this row applies to (YYYY-MM-DD)
        constraints: "window_end_date >= window_start_date"
      - name: points_per_night
        type: integer
        source: input
        description: list award price per night before elite discount and peak surcharge
        constraints: ">= 1000"
      - name: cash_copay_cents
        type: integer
        source: input
        description: per-night cash copay the member pays the property in addition to points
        constraints: ">= 0"
      - name: min_tier_required
        type: enum
        source: input
        description: lowest elite tier permitted to book this row's award inventory
        constraints: "one of {BASE, SILVER, GOLD, PLATINUM}"
      - name: award_allotment_per_night
        type: integer
        source: input
        description: maximum concurrently occupied award room-nights per calendar date under this row
        constraints: ">= 0"

  - name: BlackoutWindow
    parent: null
    common_fields: true
    fields:
      - name: hotel_id
        type: string
        source: input
        description: "FK -> Hotel.id; the property whose award calendar is blacked out"
      - name: start_date
        type: string
        source: input
        description: inclusive first blacked-out calendar date (YYYY-MM-DD)
      - name: end_date
        type: string
        source: input
        description: inclusive last blacked-out calendar date (YYYY-MM-DD)
        constraints: "end_date >= start_date"
      - name: scope
        type: enum
        source: input
        description: which award seasons this window blocks
        constraints: "one of {ALL_REDEMPTIONS, STANDARD_ONLY}"
      - name: status
        type: enum
        source: system
        description: window lifecycle; only ACTIVE windows block redemptions and consume the annual cap
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, REVOKED}"
      - name: day_count
        type: integer
        source: computed
        description: "(end_date - start_date).days + 1; both endpoints inclusive"
      - name: revoke_reason
        type: string
        source: system
        description: reason captured by POST /loyalty/blackout-windows/{windowId}/revoke; null until revoked
        default: null

  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: member login address
        constraints: "globally unique, contains '@'"
      - name: full_name
        type: string
        source: input
        description: member display name
      - name: enrollment_date
        type: string
        source: input
        description: calendar date the member joined the program (YYYY-MM-DD); optional on create
        default: "the logical clock's current date, i.e. the date part of the current logical UTC timestamp"
      - name: elite_tier
        type: enum
        source: computed
        description: current elite tier; see calculations.elite_tier_recompute
        default: BASE
        constraints: "one of {BASE, SILVER, GOLD, PLATINUM}"
      - name: qualifying_nights_ytd
        type: integer
        source: computed
        description: elite-qualifying nights in the logical clock's calendar year; see calculations.elite_tier_recompute
        default: 0
      - name: qualifying_revenue_cents_ytd
        type: integer
        source: computed
        description: sum of room_revenue_cents over this member's Stays with status == POSTED_QUALIFYING whose checkin_date falls in the logical clock's calendar year
        default: 0
      - name: point_balance
        type: integer
        source: computed
        description: signed sum of PointLedgerEntry.points for this member; conserved quantity of calculations.point_conservation
        default: 0
      - name: lifetime_points_earned
        type: integer
        source: computed
        description: sum of PointLedgerEntry.points for this member restricted to points > 0
        default: 0
      - name: points_purchased_current_year
        type: integer
        source: computed
        description: sum of PointPurchase.points_quantity for this member with status == SETTLED whose created_at year equals the logical clock year
        default: 0

  - name: Stay
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the guest who stayed"
      - name: hotel_id
        type: string
        source: input
        description: "FK -> Hotel.id; the property that hosted the stay"
      - name: rate_plan_id
        type: string
        source: input
        description: "FK -> RatePlan.id; must belong to the same hotel_id (see validations priority 25)"
      - name: checkin_date
        type: string
        source: input
        description: arrival calendar date (YYYY-MM-DD)
      - name: checkout_date
        type: string
        source: input
        description: departure calendar date (YYYY-MM-DD)
        constraints: "checkout_date > checkin_date"
      - name: nights
        type: integer
        source: computed
        description: "(checkout_date - checkin_date).days; half-open interval [checkin_date, checkout_date)"
      - name: room_revenue_cents
        type: integer
        source: input
        description: room-only revenue of the stay in cents; the sole base for earning and fee assessment
        constraints: ">= 0"
      - name: incidental_revenue_cents
        type: integer
        source: input
        description: food, beverage and other incidental revenue; never earns points and never fee-assessed
        default: 0
        constraints: ">= 0"
      - name: tier_at_checkin
        type: enum
        source: computed
        description: snapshot of Member.elite_tier taken when the Stay row is created; the provisional variant's multiplier input
        constraints: "one of {BASE, SILVER, GOLD, PLATINUM}"
      - name: status
        type: enum
        source: system
        description: stay posting lifecycle
        default: PENDING_POSTING
        constraints: "one of {PENDING_POSTING, POSTED_QUALIFYING, POSTED_NON_QUALIFYING, DISPUTED, ADJUSTED, VOID}"
      - name: base_points_awarded
        type: integer
        source: computed
        description: base points credited for this stay; see calculations.stay_base_points
        default: 0
      - name: bonus_points_awarded
        type: integer
        source: computed
        description: elite bonus points credited for this stay; see calculations.stay_elite_bonus_points
        default: 0
      - name: program_fee_assessed_cents
        type: integer
        source: computed
        description: program fee charged to the hotel for this stay; see calculations.program_fee_assessment
        default: 0
      - name: bonus_multiplier_applied
        type: number
        source: computed
        description: the elite bonus multiplier actually used for bonus_points_awarded; 0.00 until posted
        default: 0.00
      - name: dispute_reason
        type: string
        source: system
        description: reason captured by POST /loyalty/stays/{stayId}/dispute; null until disputed
        default: null
      - name: void_reason
        type: string
        source: system
        description: reason captured by POST /loyalty/stays/{stayId}/void; null until voided
        default: null

  - name: EliteBenefitDelivery
    parent: null
    common_fields: true
    fields:
      - name: stay_id
        type: string
        source: input
        description: "FK -> Stay.id; the stay that created this benefit obligation"
      - name: benefit_type
        type: enum
        source: system
        description: benefit owed to the elite guest, synthesized by POST /loyalty/stays/{stayId}/post
        constraints: "one of {UPGRADE, BREAKFAST, LATE_CHECKOUT}; unique per (stay_id, benefit_type)"
      - name: status
        type: enum
        source: system
        description: delivery lifecycle including the denial escalation loop
        default: OBLIGATED
        constraints: "one of {OBLIGATED, DELIVERED, DENIED, ESCALATED, DENIED_FINAL, WAIVED}"
      - name: cost_recovery_cents
        type: integer
        source: computed
        description: cash the program owes the property for delivering this benefit; see calculations.benefit_cost_recovery
        default: 0
      - name: denial_reason
        type: string
        source: system
        description: reason captured by POST /loyalty/elite-benefit-deliveries/{deliveryId}/deny; null unless denied
        default: null

  - name: Redemption
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the redeeming member"
      - name: hotel_id
        type: string
        source: input
        description: "FK -> Hotel.id; the property being redeemed at"
      - name: batch_id
        type: string
        source: system
        description: "FK -> ReimbursementBatch.id; set when the batch is released; null while reimbursement_status IN {NOT_DUE, ACCRUED}"
        default: null
      - name: checkin_date
        type: string
        source: input
        description: award arrival calendar date (YYYY-MM-DD)
      - name: checkout_date
        type: string
        source: input
        description: award departure calendar date (YYYY-MM-DD)
        constraints: "checkout_date > checkin_date"
      - name: nights
        type: integer
        source: computed
        description: "(checkout_date - checkin_date).days; half-open occupancy interval [checkin_date, checkout_date)"
      - name: season
        type: enum
        source: computed
        description: season of the RedemptionPricing row selected by calculations.redemption_pricing_selection
        constraints: "one of {STANDARD, PEAK}"
      - name: points_per_night_applied
        type: integer
        source: computed
        description: points_per_night of the selected RedemptionPricing row, snapshotted at creation
      - name: award_allotment_applied
        type: integer
        source: computed
        description: award_allotment_per_night of the selected RedemptionPricing row, snapshotted at creation
      - name: points_charged
        type: integer
        source: computed
        description: total points debited from the member at creation; see calculations.redemption_points_price
        default: 0
      - name: cash_copay_cents
        type: integer
        source: computed
        description: "cash_copay_cents of the selected pricing row multiplied by nights; collected by the property, never by the program"
        default: 0
      - name: fulfillment_status
        type: enum
        source: system
        description: first independent state dimension - what happened to the award booking
        default: HELD
        constraints: "one of {HELD, CONFIRMED, STAYED, NO_SHOW, CANCELLED}"
      - name: reimbursement_status
        type: enum
        source: system
        description: second independent state dimension - where the owner reimbursement stands
        default: NOT_DUE
        constraints: "one of {NOT_DUE, ACCRUED, BATCHED, PAID, VOIDED}"
      - name: estimated_reimbursement_cents
        type: integer
        source: computed
        description: accrual variant of calculations.owner_reimbursement, written when fulfillment_status becomes STAYED
        default: 0
      - name: settled_reimbursement_cents
        type: integer
        source: computed
        description: settlement variant of calculations.owner_reimbursement, written when the batch is released
        default: 0
      - name: cancel_reason
        type: string
        source: system
        description: reason captured by POST /loyalty/redemptions/{redemptionId}/cancel; null unless cancelled
        default: null

  - name: ReimbursementBatch
    parent: null
    common_fields: true
    fields:
      - name: hotel_id
        type: string
        source: input
        description: "FK -> Hotel.id; the property being reimbursed"
      - name: period_month
        type: string
        source: input
        description: settlement period in YYYY-MM form
        constraints: "matches ^\\d{4}-(0[1-9]|1[0-2])$"
      - name: status
        type: enum
        source: system
        description: batch settlement lifecycle
        default: OPEN
        constraints: "one of {OPEN, RELEASED, APPROVED, REJECTED, PAID}"
      - name: item_count
        type: integer
        source: computed
        description: number of Redemption rows attached at release; see calculations.batch_item_selection
        default: 0
      - name: gross_reimbursement_cents
        type: integer
        source: computed
        description: sum of settled_reimbursement_cents over the batch's Redemption rows
        default: 0
      - name: fee_offset_base_cents
        type: integer
        source: computed
        description: hotel.fee_ledger_balance_cents snapshotted at release
        default: 0
      - name: delinquency_surcharge_cents
        type: integer
        source: computed
        description: surcharge on the fee offset; see calculations.batch_net_payable step 4
        default: 0
      - name: total_fee_offset_cents
        type: integer
        source: computed
        description: fee_offset_base_cents + delinquency_surcharge_cents
        default: 0
      - name: net_payable_cents
        type: integer
        source: computed
        description: signed amount the program owes the property; negative means the property owes the program
        default: 0
      - name: occupancy_pct_at_release
        type: number
        source: computed
        description: hotel.trailing_12m_occupancy_pct snapshotted at release; the settlement variant's occupancy input
        default: 0.0
      - name: adr_cents_at_release
        type: integer
        source: computed
        description: hotel.trailing_12m_adr_cents snapshotted at release; the settlement variant's rate input
        default: 0
      - name: released_by_user_id
        type: string
        source: system
        description: X-User-ID of the operator who released the batch; compared for segregation of duties
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the auditor who approved the batch
        default: null
      - name: rejection_reason
        type: string
        source: system
        description: reason captured by POST /loyalty/reimbursement-batches/{batchId}/reject; null unless rejected
        default: null

  - name: PointLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the member whose balance this entry moves"
      - name: entry_type
        type: enum
        source: system
        description: what produced this entry
        constraints: "one of {EARN_BASE, EARN_BONUS, PURCHASE, PARTNER_SALE, REDEEM, REVERSAL, GOODWILL}"
      - name: points
        type: integer
        source: system
        description: signed point delta; negative for REDEEM and for reversals of positive entries
      - name: source_stay_id
        type: string
        source: system
        description: "FK -> Stay.id; set for EARN_BASE and EARN_BONUS entries produced by a stay posting or adjustment"
        default: null
      - name: source_redemption_id
        type: string
        source: system
        description: "FK -> Redemption.id; set for REDEEM entries and their reversals"
        default: null
      - name: source_purchase_id
        type: string
        source: system
        description: "FK -> PointPurchase.id; set for PURCHASE, PARTNER_SALE and co-brand EARN_BONUS entries"
        default: null
      - name: reversal_of_entry_id
        type: string
        source: system
        description: "FK -> PointLedgerEntry.id; self-referential link set only on REVERSAL entries"
        default: null
      - name: adjustment_reason
        type: string
        source: input
        description: free-text justification supplied on POST /loyalty/point-adjustments; null for system-produced entries
        default: null
      - name: liability_unit_cost_cents_per_1000
        type: integer
        source: system
        description: unit liability cost snapshotted from constants at write time; always 600
        default: 600

  - name: PointPurchase
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the buying member"
      - name: partner_id
        type: string
        source: input
        description: "FK -> Partner.id; required when channel == PARTNER_SALE, otherwise null"
        default: null
      - name: channel
        type: enum
        source: input
        description: sales channel that originated the point sale
        constraints: "one of {CO_BRAND_CARD, DIRECT_PURCHASE, PARTNER_SALE}"
      - name: points_quantity
        type: integer
        source: input
        description: points the member is buying
        constraints: "multiple of 1000, >= 1000"
      - name: volume_discount_pct
        type: number
        source: computed
        description: tier discount selected by calculations.point_purchase_pricing
        default: 0.0
      - name: cash_due_cents
        type: integer
        source: computed
        description: cash the program collects for this sale; see calculations.point_purchase_pricing
        default: 0
      - name: bonus_points
        type: integer
        source: computed
        description: co-brand bonus points; 10 percent of points_quantity for CO_BRAND_CARD, 0 otherwise
        default: 0
      - name: status
        type: enum
        source: system
        description: settlement lifecycle of the point sale
        default: PENDING
        constraints: "one of {PENDING, SETTLED, REFUNDED}"
      - name: refund_reason
        type: string
        source: system
        description: reason captured by POST /loyalty/point-purchases/{purchaseId}/refund; null unless refunded
        default: null

  - name: Partner
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: partner trade name
      - name: partner_type
        type: enum
        source: input
        description: partner category
        constraints: "one of {CO_BRAND_ISSUER, AIRLINE, RETAIL}"
      - name: points_cost_per_1000_cents
        type: integer
        source: input
        description: list price in cents the partner pays the program per 1000 points before volume discount
        constraints: ">= 1"
      - name: monthly_cap_points
        type: integer
        source: input
        description: maximum points this partner may buy in one calendar month
        constraints: ">= 1000"
      - name: purchased_points_mtd
        type: integer
        source: computed
        description: sum of points_quantity over this partner's PointPurchase rows with status == SETTLED whose created_at month equals the logical clock month
        default: 0

  - name: ProgramFund
    parent: null
    common_fields: true
    fields:
      - name: cash_balance_cents
        type: integer
        source: computed
        description: program cash on hand; see calculations.fund_cash_conservation
        default: 0
      - name: outstanding_points
        type: integer
        source: computed
        description: signed sum of PointLedgerEntry.points across every member
        default: 0
      - name: breakage_rate_pct
        type: number
        source: input
        description: estimated fraction of outstanding points that will never be redeemed; set by POST /loyalty/program-fund/revalue
        default: 0.20
        constraints: "0.0 <= breakage_rate_pct <= 0.35"
      - name: point_liability_cents
        type: integer
        source: computed
        description: booked liability for outstanding points net of breakage; see calculations.point_liability_valuation
        default: 0
      - name: solvency_ratio
        type: number
        source: computed
        description: cash_balance_cents / point_liability_cents rounded to 4 decimals; 999.0000 when liability is 0
        default: 999.0
      - name: status
        type: enum
        source: computed
        description: solvency posture derived from solvency_ratio; IMPAIRED blocks PEAK award bookings program-wide
        default: HEALTHY
        constraints: "one of {HEALTHY, WATCH, IMPAIRED}"
      - name: last_revalued_at
        type: datetime
        source: system
        description: logical-clock timestamp of the most recent POST /loyalty/program-fund/revalue; null before the first revalue
        default: null

  - name: MemberComplaint
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the complaining member"
      - name: related_delivery_id
        type: string
        source: input
        description: "FK -> EliteBenefitDelivery.id; required when subject_type == BENEFIT_DENIAL, otherwise null"
        default: null
      - name: subject_type
        type: enum
        source: input
        description: what the member is complaining about
        constraints: "one of {BENEFIT_DENIAL, POINT_SHORTFALL, BLACKOUT_DISPUTE}"
      - name: description
        type: string
        source: input
        description: member's narrative
        constraints: "1..2000 chars"
      - name: status
        type: enum
        source: system
        description: complaint lifecycle including the information-request loop and the escalation branch
        default: OPEN
        constraints: "one of {OPEN, UNDER_REVIEW, INFO_REQUESTED, RESOLVED_GOODWILL, RESOLVED_UPHELD, ESCALATED, CLOSED}"
      - name: info_request_count
        type: integer
        source: computed
        description: number of completed UNDER_REVIEW -> INFO_REQUESTED transitions; caps the review loop at 2
        default: 0
      - name: goodwill_points_granted
        type: integer
        source: computed
        description: total GOODWILL points granted by resolve plus adjudicate on this complaint
        default: 0
      - name: resolution
        type: string
        source: system
        description: resolution narrative captured by POST /loyalty/member-complaints/{complaintId}/resolve
        default: null
      - name: adjudication_outcome
        type: enum
        source: system
        description: auditor's escalation verdict
        default: null
        constraints: "one of {DELIVERY_ORDERED, DENIAL_UPHELD}; null until adjudicated"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Hotel
    initial_state: ONBOARDING
    terminal_states: [TERMINATED]
    shape: "cyclic (ACTIVE <-> FEE_DELINQUENT) with a terminal absorbing state"
    transitions:
      - from: ONBOARDING
        to: ACTIVE
        trigger: "POST /loyalty/hotels/{hotelId}/activate"
        actor: ProgramAdministrator
        preconditions:
          - "hotel.status == ONBOARDING"
          - "count(RatePlan WHERE hotel_id == hotel.id) >= 1, else ERR_HOTEL_ONBOARDING_INCOMPLETE"
        side_effects:
          - "hotel.status = ACTIVE"
          - "increments Hotel.version by 1"
      - from: ACTIVE
        to: FEE_DELINQUENT
        trigger: "system, evaluated at the end of POST /loyalty/stays/{stayId}/post and POST /loyalty/stays/{stayId}/adjust"
        actor: system
        preconditions:
          - "hotel.fee_ledger_balance_cents > FEE_DELINQUENCY_THRESHOLD_CENTS (250000) after the fee assessment of this request"
        side_effects:
          - "hotel.status = FEE_DELINQUENT"
          - "PEAK award inventory access is withdrawn program-side: validations priority 50 rejects POST /loyalty/redemptions whose selected season == PEAK for this hotel, while STANDARD bookings and reimbursement batching continue"
          - "increments Hotel.version by 1"
        note: "Threshold is strict greater-than: a balance of exactly 250000 leaves the hotel ACTIVE."
      - from: FEE_DELINQUENT
        to: ACTIVE
        trigger: "system, evaluated at the end of POST /loyalty/reimbursement-batches/{batchId}/pay"
        actor: system
        preconditions:
          - "hotel.fee_ledger_balance_cents <= 0 after the batch settlement of this request"
        side_effects:
          - "hotel.status = ACTIVE"
          - "increments Hotel.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /loyalty/hotels/{hotelId}/terminate"
        actor: ProgramAdministrator
        preconditions:
          - "hotel.status IN {ACTIVE, FEE_DELINQUENT}"
        side_effects:
          - "hotel.status = TERMINATED; hotel.termination_reason = request reason"
          - "every Redemption WHERE hotel_id == hotel.id AND reimbursement_status == ACCRUED moves reimbursement_status to VOIDED"
          - "because those redemptions left the {ACCRUED, BATCHED} set, hotel.reimbursement_owed_cents is recomputed and becomes 0"
          - "every ReimbursementBatch WHERE hotel_id == hotel.id AND status IN {OPEN, RELEASED} moves to REJECTED with rejection_reason = 'HOTEL_TERMINATED'; redemptions attached to a REJECTED batch revert reimbursement_status BATCHED -> VOIDED and batch_id = null"
          - "every EliteBenefitDelivery whose Stay.hotel_id == hotel.id and whose status == OBLIGATED moves to WAIVED"
          - "increments Hotel.version by 1"
      - from: FEE_DELINQUENT
        to: TERMINATED
        trigger: "POST /loyalty/hotels/{hotelId}/terminate"
        actor: ProgramAdministrator
        preconditions:
          - "hotel.status IN {ACTIVE, FEE_DELINQUENT}"
        side_effects:
          - "identical to the ACTIVE -> TERMINATED side-effect set; the outstanding fee_ledger_balance_cents is retained as recorded"
          - "increments Hotel.version by 1"

  - entity: Stay
    initial_state: PENDING_POSTING
    terminal_states: [ADJUSTED, VOID]
    shape: "branching fork (PENDING_POSTING -> {POSTED_QUALIFYING, POSTED_NON_QUALIFYING}) with divergent side-effect sets, then a dispute/adjust arm and a void arm"
    transitions:
      - from: PENDING_POSTING
        to: POSTED_QUALIFYING
        trigger: "POST /loyalty/stays/{stayId}/post"
        actor: HotelOwner
        preconditions:
          - "stay.status == PENDING_POSTING"
          - "hotel.status IN {ACTIVE, FEE_DELINQUENT}, else ERR_HOTEL_NOT_ACTIVE"
          - "current logical clock date >= stay.checkout_date, else ERR_STAY_NOT_COMPLETED"
          - "rate_plan.is_qualifying == true AND stay.room_revenue_cents > 0"
        side_effects:
          - "stay.status = POSTED_QUALIFYING; stay.base_points_awarded = calculations.stay_base_points; stay.bonus_points_awarded and stay.bonus_multiplier_applied = calculations.stay_elite_bonus_points variant provisional_tier_at_checkin"
          - "one EARN_BASE PointLedgerEntry with points = base_points_awarded and source_stay_id = stay.id; one EARN_BONUS PointLedgerEntry with points = bonus_points_awarded and source_stay_id = stay.id, emitted only when bonus_points_awarded > 0"
          - "because those ledger entries were written, Member.point_balance and Member.lifetime_points_earned are recomputed"
          - "because the stay entered POSTED_QUALIFYING, Member.qualifying_revenue_cents_ytd is recomputed, and Member.qualifying_nights_ytd is recomputed when rate_plan.counts_toward_elite == true; because qualifying_nights_ytd changed, Member.elite_tier is recomputed by calculations.elite_tier_recompute"
          - "stay.program_fee_assessed_cents = calculations.program_fee_assessment; hotel.fee_ledger_balance_cents += stay.program_fee_assessed_cents; because that balance changed, the Hotel ACTIVE -> FEE_DELINQUENT transition is evaluated"
          - "one EliteBenefitDelivery row in status OBLIGATED is synthesized per benefit_type entitled at stay.tier_at_checkin per calculations.benefit_entitlement_matrix"
          - "because the ledger changed, ProgramFund.outstanding_points, point_liability_cents, solvency_ratio and status are recomputed"
      - from: PENDING_POSTING
        to: POSTED_NON_QUALIFYING
        trigger: "POST /loyalty/stays/{stayId}/post"
        actor: HotelOwner
        preconditions:
          - "stay.status == PENDING_POSTING"
          - "hotel.status IN {ACTIVE, FEE_DELINQUENT}, else ERR_HOTEL_NOT_ACTIVE"
          - "current logical clock date >= stay.checkout_date, else ERR_STAY_NOT_COMPLETED"
          - "rate_plan.is_qualifying == false OR stay.room_revenue_cents == 0"
        side_effects:
          - "stay.status = POSTED_NON_QUALIFYING; base_points_awarded = 0; bonus_points_awarded = 0; bonus_multiplier_applied = 0.00; program_fee_assessed_cents = 0"
          - "no PointLedgerEntry is written, no EliteBenefitDelivery is synthesized, Member.elite_tier is unchanged, hotel.fee_ledger_balance_cents is unchanged and ProgramFund is unchanged"
        note: "This is the divergent arm of the fork - same trigger, same actor, disjoint side-effect set."
      - from: POSTED_QUALIFYING
        to: DISPUTED
        trigger: "POST /loyalty/stays/{stayId}/dispute"
        actor: MemberCareAgent | HotelOwner
        preconditions:
          - "stay.status IN {POSTED_QUALIFYING, POSTED_NON_QUALIFYING}"
        side_effects:
          - "stay.status = DISPUTED; stay.dispute_reason = request dispute_reason"
          - "awarded points, fee assessment and benefit deliveries are left exactly as posted"
      - from: POSTED_NON_QUALIFYING
        to: DISPUTED
        trigger: "POST /loyalty/stays/{stayId}/dispute"
        actor: MemberCareAgent | HotelOwner
        preconditions:
          - "stay.status IN {POSTED_QUALIFYING, POSTED_NON_QUALIFYING}"
        side_effects:
          - "stay.status = DISPUTED; stay.dispute_reason = request dispute_reason"
      - from: DISPUTED
        to: ADJUSTED
        trigger: "POST /loyalty/stays/{stayId}/adjust"
        actor: ProgramAdministrator
        preconditions:
          - "stay.status == DISPUTED"
          - "hotel.status != TERMINATED, else ERR_HOTEL_NOT_ACTIVE"
        side_effects:
          - "stay.room_revenue_cents = request room_revenue_cents when that optional field is present, otherwise it keeps its posted value; stay.status = ADJUSTED"
          - "stay.base_points_awarded is recomputed on the revised revenue; stay.bonus_points_awarded and stay.bonus_multiplier_applied are recomputed by calculations.stay_elite_bonus_points variant final_tier_at_adjustment"
          - "delta PointLedgerEntry rows are written for the differences: an EARN_BASE entry with points = new_base - old_base when that delta is non-zero, and an EARN_BONUS entry with points = new_bonus - old_bonus when that delta is non-zero; both carry source_stay_id = stay.id"
          - "because those ledger entries were written, Member.point_balance and Member.lifetime_points_earned are recomputed; because qualifying revenue changed, Member.qualifying_revenue_cents_ytd and Member.elite_tier are recomputed"
          - "stay.program_fee_assessed_cents is recomputed and hotel.fee_ledger_balance_cents is moved by the fee delta; because that balance changed, the Hotel ACTIVE -> FEE_DELINQUENT transition is evaluated"
          - "because the ledger changed, ProgramFund.point_liability_cents, solvency_ratio and status are recomputed"
        note: "Qualification is re-derived: if rate_plan.is_qualifying == false or revised revenue == 0 the awards collapse to 0 and the deltas are negative."
      - from: PENDING_POSTING
        to: VOID
        trigger: "POST /loyalty/stays/{stayId}/void"
        actor: ProgramAdministrator
        preconditions:
          - "stay.status IN {PENDING_POSTING, POSTED_QUALIFYING, POSTED_NON_QUALIFYING, DISPUTED}"
        side_effects:
          - "stay.status = VOID; stay.void_reason = request void_reason; no ledger entry exists to reverse"
      - from: POSTED_QUALIFYING
        to: VOID
        trigger: "POST /loyalty/stays/{stayId}/void"
        actor: ProgramAdministrator
        preconditions:
          - "stay.status IN {PENDING_POSTING, POSTED_QUALIFYING, POSTED_NON_QUALIFYING, DISPUTED}"
        side_effects:
          - "hop 1: stay.status = VOID; stay.void_reason = request void_reason"
          - "hop 2: because the stay went VOID, one REVERSAL PointLedgerEntry is written per existing entry with source_stay_id == stay.id, each carrying points = -original.points and reversal_of_entry_id = original.id; and stay.program_fee_assessed_cents is credited back so hotel.fee_ledger_balance_cents -= stay.program_fee_assessed_cents"
          - "hop 3: because those REVERSAL entries were written, Member.point_balance, Member.lifetime_points_earned, Member.qualifying_revenue_cents_ytd and Member.qualifying_nights_ytd are recomputed, and the recomputed qualifying_nights_ytd re-derives Member.elite_tier - which may drop"
          - "hop 4: because Member.elite_tier dropped, every EliteBenefitDelivery in status OBLIGATED belonging to any Stay of that member whose benefit_type is not entitled at the new Member.elite_tier per calculations.benefit_entitlement_matrix moves to WAIVED"
          - "hop 5: independently of the tier outcome, every EliteBenefitDelivery whose stay_id == stay.id and whose status is OBLIGATED or ESCALATED moves to WAIVED - an obligation cannot outlive the stay that created it, and an escalated denial loses the fact pattern it was arguing about"
          - "also because the REVERSAL entries were written, ProgramFund.outstanding_points, point_liability_cents, solvency_ratio and status are recomputed"
        note: "Depth-4 transitive cascade: void -> reversal entries -> tier re-derivation -> benefit waiver. Each hop is caused by the preceding hop, not by the original request."
      - from: POSTED_NON_QUALIFYING
        to: VOID
        trigger: "POST /loyalty/stays/{stayId}/void"
        actor: ProgramAdministrator
        preconditions:
          - "stay.status IN {PENDING_POSTING, POSTED_QUALIFYING, POSTED_NON_QUALIFYING, DISPUTED}"
        side_effects:
          - "stay.status = VOID; stay.void_reason = request void_reason; nothing to reverse because the non-qualifying arm wrote no ledger entries and assessed no fee"
      - from: DISPUTED
        to: VOID
        trigger: "POST /loyalty/stays/{stayId}/void"
        actor: ProgramAdministrator
        preconditions:
          - "stay.status IN {PENDING_POSTING, POSTED_QUALIFYING, POSTED_NON_QUALIFYING, DISPUTED}"
        side_effects:
          - "identical to the POSTED_QUALIFYING -> VOID cascade when the disputed stay had posted as qualifying; otherwise identical to the POSTED_NON_QUALIFYING -> VOID arm"

  - entity: EliteBenefitDelivery
    initial_state: OBLIGATED
    terminal_states: [DELIVERED, DENIED_FINAL, WAIVED]
    shape: "cyclic denial loop: OBLIGATED -> DENIED -> ESCALATED -> {DELIVERED, DENIED_FINAL}"
    transitions:
      - from: OBLIGATED
        to: DELIVERED
        trigger: "POST /loyalty/elite-benefit-deliveries/{deliveryId}/deliver"
        actor: HotelOwner
        preconditions:
          - "delivery.status == OBLIGATED"
          - "Stay.status == POSTED_QUALIFYING for the delivery's stay_id, else ERR_STAY_INVALID_STATE"
        side_effects:
          - "delivery.status = DELIVERED; delivery.cost_recovery_cents = calculations.benefit_cost_recovery"
          - "because the delivery entered DELIVERED, hotel.benefit_recovery_owed_cents is recomputed"
      - from: OBLIGATED
        to: DENIED
        trigger: "POST /loyalty/elite-benefit-deliveries/{deliveryId}/deny"
        actor: HotelOwner
        preconditions:
          - "delivery.status == OBLIGATED"
          - "Stay.status == POSTED_QUALIFYING for the delivery's stay_id, else ERR_STAY_INVALID_STATE"
          - "hotel.benefit_denial_count < BENEFIT_DENIAL_LIMIT (3), else ERR_BENEFIT_DENIAL_LIMIT_EXCEEDED"
        side_effects:
          - "delivery.status = DENIED; delivery.denial_reason = request denial_reason; delivery.cost_recovery_cents stays 0"
          - "because the delivery entered DENIED, hotel.benefit_denial_count is recomputed"
      - from: DENIED
        to: ESCALATED
        trigger: "system, caused by POST /loyalty/member-complaints/{complaintId}/escalate on a complaint whose related_delivery_id == delivery.id"
        actor: system
        preconditions:
          - "delivery.status == DENIED"
          - "complaint.subject_type == BENEFIT_DENIAL"
        side_effects:
          - "delivery.status = ESCALATED; hotel.benefit_denial_count is recomputed (ESCALATED remains inside the counted set)"
      - from: ESCALATED
        to: DELIVERED
        trigger: "system, caused by POST /loyalty/member-complaints/{complaintId}/adjudicate with adjudication_outcome == DELIVERY_ORDERED"
        actor: system
        preconditions:
          - "delivery.status == ESCALATED"
        side_effects:
          - "delivery.status = DELIVERED; delivery.cost_recovery_cents = calculations.benefit_cost_recovery"
          - "because the delivery left the denied set and entered DELIVERED, hotel.benefit_denial_count and hotel.benefit_recovery_owed_cents are both recomputed"
      - from: ESCALATED
        to: DENIED_FINAL
        trigger: "system, caused by POST /loyalty/member-complaints/{complaintId}/adjudicate with adjudication_outcome == DENIAL_UPHELD"
        actor: system
        preconditions:
          - "delivery.status == ESCALATED"
        side_effects:
          - "delivery.status = DENIED_FINAL; cost_recovery_cents stays 0; hotel.benefit_denial_count is recomputed (DENIED_FINAL remains inside the counted set)"
      - from: OBLIGATED
        to: WAIVED
        trigger: "system, caused by (a) the Member.elite_tier drop in the POSTED_QUALIFYING -> VOID cascade, (b) POST /loyalty/hotels/{hotelId}/terminate, or (c) the void of the delivery's own Stay"
        actor: system
        preconditions:
          - "delivery.status == OBLIGATED"
        side_effects:
          - "delivery.status = WAIVED; cost_recovery_cents stays 0; hotel.benefit_recovery_owed_cents and hotel.benefit_denial_count are unaffected"
      - from: ESCALATED
        to: WAIVED
        trigger: "system, caused by POST /loyalty/stays/{stayId}/void on the delivery's own Stay (hop 5 of the POSTED_QUALIFYING -> VOID cascade)"
        actor: system
        preconditions:
          - "delivery.status == ESCALATED"
          - "the voided Stay is the delivery's own stay_id"
        side_effects:
          - "delivery.status = WAIVED; cost_recovery_cents stays 0; hotel.benefit_denial_count is recomputed, and because WAIVED sits outside the counted set the count falls by 1"
          - "any MemberComplaint in status ESCALATED whose related_delivery_id == delivery.id keeps its status, but validations priority 53 now rejects its adjudication with ERR_DELIVERY_NOT_ESCALATED - there is no longer a live denial to rule on"

  - entity: Redemption
    dimension: fulfillment_status
    initial_state: HELD
    terminal_states: [STAYED, NO_SHOW, CANCELLED]
    shape: "first of two independent state dimensions on the same row; evolves without reference to reimbursement_status"
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /loyalty/redemptions/{redemptionId}/confirm"
        actor: HotelOwner
        preconditions:
          - "redemption.fulfillment_status == HELD"
          - "hotel.status IN {ACTIVE, FEE_DELINQUENT}, else ERR_HOTEL_NOT_ACTIVE"
        side_effects:
          - "redemption.fulfillment_status = CONFIRMED; reimbursement_status stays NOT_DUE; no ledger movement (points were already debited at creation)"
      - from: CONFIRMED
        to: STAYED
        trigger: "POST /loyalty/redemptions/{redemptionId}/complete-stay"
        actor: HotelOwner
        preconditions:
          - "redemption.fulfillment_status == CONFIRMED"
          - "current logical clock date >= redemption.checkout_date, else ERR_REDEMPTION_NOT_ELAPSED"
        side_effects:
          - "redemption.fulfillment_status = STAYED"
          - "because the award stay was consumed, the reimbursement dimension advances NOT_DUE -> ACCRUED and redemption.estimated_reimbursement_cents = calculations.owner_reimbursement variant accrual_estimate"
          - "because that redemption entered the {ACCRUED, BATCHED} set, hotel.reimbursement_owed_cents is recomputed"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /loyalty/redemptions/{redemptionId}/no-show"
        actor: HotelOwner
        preconditions:
          - "redemption.fulfillment_status == CONFIRMED"
          - "current logical clock date >= redemption.checkin_date, else ERR_REDEMPTION_NOT_ARRIVED"
        side_effects:
          - "redemption.fulfillment_status = NO_SHOW; the debited points are forfeited, so no REVERSAL entry is written and Member.point_balance is unchanged"
          - "reimbursement_status stays NOT_DUE forever - a no-show never becomes reimbursable"
          - "the occupied award room-nights are released, so calculations.award_inventory_check no longer counts this row"
      - from: HELD
        to: CANCELLED
        trigger: "POST /loyalty/redemptions/{redemptionId}/cancel"
        actor: Member | MemberCareAgent
        preconditions:
          - "redemption.fulfillment_status IN {HELD, CONFIRMED}"
        side_effects:
          - "redemption.fulfillment_status = CANCELLED; redemption.cancel_reason = request cancel_reason"
          - "one REVERSAL PointLedgerEntry with points = +redemption.points_charged, source_redemption_id = redemption.id and reversal_of_entry_id = the original REDEEM entry id"
          - "because that entry was written, Member.point_balance is recomputed and ProgramFund.outstanding_points, point_liability_cents, solvency_ratio and status are recomputed"
          - "the occupied award room-nights are released"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /loyalty/redemptions/{redemptionId}/cancel"
        actor: Member | MemberCareAgent
        preconditions:
          - "redemption.fulfillment_status IN {HELD, CONFIRMED}"
        side_effects:
          - "identical to the HELD -> CANCELLED side-effect set"

  - entity: Redemption
    dimension: reimbursement_status
    initial_state: NOT_DUE
    terminal_states: [PAID, VOIDED]
    shape: "second of two independent state dimensions on the same row; every transition is system-driven and can only be observed after fulfillment_status reached STAYED"
    transitions:
      - from: NOT_DUE
        to: ACCRUED
        trigger: "system, caused by the fulfillment CONFIRMED -> STAYED transition"
        actor: system
        preconditions:
          - "redemption.fulfillment_status == STAYED"
        side_effects:
          - "redemption.estimated_reimbursement_cents = calculations.owner_reimbursement variant accrual_estimate; hotel.reimbursement_owed_cents recomputed"
      - from: ACCRUED
        to: BATCHED
        trigger: "system, caused by POST /loyalty/reimbursement-batches/{batchId}/release"
        actor: system
        preconditions:
          - "redemption.reimbursement_status == ACCRUED"
          - "redemption is selected by calculations.batch_item_selection for that batch"
        side_effects:
          - "redemption.batch_id = batch.id; redemption.settled_reimbursement_cents = calculations.owner_reimbursement variant settlement_actual"
      - from: BATCHED
        to: ACCRUED
        trigger: "system, caused by POST /loyalty/reimbursement-batches/{batchId}/reject"
        actor: system
        preconditions:
          - "redemption.reimbursement_status == BATCHED"
        side_effects:
          - "redemption.batch_id = null; redemption.settled_reimbursement_cents = 0 (the settlement figure is discarded and only the batch retains it for audit)"
        note: "Compensating transition - the reimbursement dimension returns to the exact state it held before release."
      - from: BATCHED
        to: PAID
        trigger: "system, caused by POST /loyalty/reimbursement-batches/{batchId}/pay"
        actor: system
        preconditions:
          - "redemption.reimbursement_status == BATCHED"
        side_effects:
          - "redemption.reimbursement_status = PAID; because it left the {ACCRUED, BATCHED} set, hotel.reimbursement_owed_cents is recomputed"
      - from: ACCRUED
        to: VOIDED
        trigger: "system, caused by POST /loyalty/hotels/{hotelId}/terminate"
        actor: system
        preconditions:
          - "redemption.reimbursement_status == ACCRUED"
        side_effects:
          - "redemption.reimbursement_status = VOIDED; hotel.reimbursement_owed_cents recomputed"
      - from: BATCHED
        to: VOIDED
        trigger: "system, caused by POST /loyalty/hotels/{hotelId}/terminate rejecting the batch the row was attached to"
        actor: system
        preconditions:
          - "redemption.reimbursement_status == BATCHED"
        side_effects:
          - "redemption.batch_id = null; redemption.reimbursement_status = VOIDED; hotel.reimbursement_owed_cents recomputed"

  - entity: ReimbursementBatch
    initial_state: OPEN
    terminal_states: [PAID, REJECTED]
    shape: "branching: OPEN -> RELEASED -> {APPROVED -> PAID, REJECTED}"
    transitions:
      - from: OPEN
        to: RELEASED
        trigger: "POST /loyalty/reimbursement-batches/{batchId}/release"
        actor: ProgramAdministrator
        preconditions:
          - "batch.status == OPEN"
          - "hotel.status != TERMINATED, else ERR_HOTEL_NOT_ACTIVE"
          - "calculations.batch_item_selection yields at least one Redemption, else ERR_BATCH_NO_ELIGIBLE_ITEMS"
        side_effects:
          - "batch.occupancy_pct_at_release = hotel.trailing_12m_occupancy_pct; batch.adr_cents_at_release = hotel.trailing_12m_adr_cents"
          - "every selected Redemption advances reimbursement_status ACCRUED -> BATCHED with batch_id = batch.id and settled_reimbursement_cents = calculations.owner_reimbursement variant settlement_actual"
          - "batch.item_count, batch.gross_reimbursement_cents, batch.fee_offset_base_cents, batch.delinquency_surcharge_cents, batch.total_fee_offset_cents and batch.net_payable_cents = calculations.batch_net_payable"
          - "batch.released_by_user_id = X-User-ID of the caller; batch.status = RELEASED"
          - "because the selected redemptions changed reimbursement_status, hotel.reimbursement_owed_cents is recomputed (BATCHED stays inside the owed set, so the figure is unchanged in value)"
      - from: RELEASED
        to: APPROVED
        trigger: "POST /loyalty/reimbursement-batches/{batchId}/approve"
        actor: ProgramAdministrator
        preconditions:
          - "batch.status == RELEASED"
          - "X-User-ID != batch.released_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "batch.status = APPROVED; batch.approved_by_user_id = X-User-ID of the caller; no monetary field moves"
      - from: RELEASED
        to: REJECTED
        trigger: "POST /loyalty/reimbursement-batches/{batchId}/reject"
        actor: ProgramAdministrator
        preconditions:
          - "batch.status == RELEASED"
        side_effects:
          - "batch.status = REJECTED; batch.rejection_reason = request rejection_reason; the recorded item_count and monetary snapshot fields are retained for audit"
          - "every Redemption WHERE batch_id == batch.id reverts reimbursement_status BATCHED -> ACCRUED with batch_id = null and settled_reimbursement_cents = 0"
      - from: APPROVED
        to: PAID
        trigger: "POST /loyalty/reimbursement-batches/{batchId}/pay"
        actor: ProgramAdministrator
        preconditions:
          - "batch.status == APPROVED"
        side_effects:
          - "hop 1: batch.status = PAID"
          - "hop 2: because the batch went PAID, every Redemption WHERE batch_id == batch.id advances reimbursement_status BATCHED -> PAID; ProgramFund.cash_balance_cents -= batch.net_payable_cents (a negative net_payable therefore increases program cash); hotel.reimbursement_owed_cents is recomputed to 0 for those rows; hotel.fee_ledger_balance_cents is recomputed by calculations.program_fee_assessment step 2, which now subtracts this batch's fee_offset_base_cents and therefore lands at 0 when no stay was posted between release and payment"
          - "hop 3: because hotel.fee_ledger_balance_cents dropped to 0, the Hotel FEE_DELINQUENT -> ACTIVE transition fires when the hotel was FEE_DELINQUENT"
          - "also because ProgramFund.cash_balance_cents changed, ProgramFund.solvency_ratio and ProgramFund.status are recomputed"
        note: "Depth-3 transitive cascade with a different trigger from the Stay void cascade: pay -> hotel fee ledger cleared -> hotel status restored."

  - entity: MemberComplaint
    initial_state: OPEN
    terminal_states: [RESOLVED_GOODWILL, CLOSED]
    shape: "cyclic review loop UNDER_REVIEW <-> INFO_REQUESTED, bounded at 2 iterations, then a branch to goodwill or upheld with an escalation arm"
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /loyalty/member-complaints/{complaintId}/review"
        actor: MemberCareAgent
        preconditions:
          - "complaint.status == OPEN"
        side_effects:
          - "complaint.status = UNDER_REVIEW"
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /loyalty/member-complaints/{complaintId}/request-info"
        actor: MemberCareAgent
        preconditions:
          - "complaint.status == UNDER_REVIEW"
          - "complaint.info_request_count < INFO_REQUEST_LIMIT (2), else ERR_INFO_REQUEST_LIMIT"
        side_effects:
          - "complaint.status = INFO_REQUESTED; complaint.info_request_count += 1"
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /loyalty/member-complaints/{complaintId}/provide-info"
        actor: Member
        preconditions:
          - "complaint.status == INFO_REQUESTED"
          - "X-User-ID == complaint.member_id, else ERR_FORBIDDEN_RESOURCE_OWNER"
        side_effects:
          - "complaint.status = UNDER_REVIEW; info_request_count is NOT decremented, which is what bounds the loop"
        note: "Closes the cycle. The second INFO_REQUESTED is reachable; a third request-info is rejected."
      - from: UNDER_REVIEW
        to: RESOLVED_GOODWILL
        trigger: "POST /loyalty/member-complaints/{complaintId}/resolve with goodwill_points > 0"
        actor: MemberCareAgent
        preconditions:
          - "complaint.status == UNDER_REVIEW"
        side_effects:
          - "complaint.status = RESOLVED_GOODWILL; complaint.resolution = request resolution; complaint.goodwill_points_granted = request goodwill_points"
          - "one GOODWILL PointLedgerEntry with points = request goodwill_points and member_id = complaint.member_id"
          - "because that entry was written, Member.point_balance and Member.lifetime_points_earned are recomputed, and ProgramFund.outstanding_points, point_liability_cents, solvency_ratio and status are recomputed"
      - from: UNDER_REVIEW
        to: RESOLVED_UPHELD
        trigger: "POST /loyalty/member-complaints/{complaintId}/resolve with goodwill_points omitted or 0"
        actor: MemberCareAgent
        preconditions:
          - "complaint.status == UNDER_REVIEW"
        side_effects:
          - "complaint.status = RESOLVED_UPHELD; complaint.resolution = request resolution; no ledger entry is written"
      - from: RESOLVED_UPHELD
        to: ESCALATED
        trigger: "POST /loyalty/member-complaints/{complaintId}/escalate"
        actor: Member
        preconditions:
          - "complaint.status == RESOLVED_UPHELD"
          - "X-User-ID == complaint.member_id, else ERR_FORBIDDEN_RESOURCE_OWNER"
        side_effects:
          - "complaint.status = ESCALATED"
          - "when complaint.subject_type == BENEFIT_DENIAL and the related EliteBenefitDelivery is in status DENIED, that delivery advances DENIED -> ESCALATED"
      - from: ESCALATED
        to: CLOSED
        trigger: "POST /loyalty/member-complaints/{complaintId}/adjudicate"
        actor: ProgramAdministrator
        preconditions:
          - "complaint.status == ESCALATED"
        side_effects:
          - "complaint.status = CLOSED; complaint.adjudication_outcome = request adjudication_outcome"
          - "when adjudication_outcome == DELIVERY_ORDERED and a related delivery is ESCALATED, that delivery advances ESCALATED -> DELIVERED; when adjudication_outcome == DENIAL_UPHELD it advances ESCALATED -> DENIED_FINAL"
          - "no point movement occurs on adjudication: goodwill is granted only through POST /loyalty/member-complaints/{complaintId}/resolve or POST /loyalty/point-adjustments, so complaint.goodwill_points_granted is unchanged here"

  - entity: PointPurchase
    initial_state: PENDING
    terminal_states: [REFUNDED]
    shape: "linear with a compensating final hop"
    transitions:
      - from: PENDING
        to: SETTLED
        trigger: "POST /loyalty/point-purchases/{purchaseId}/settle"
        actor: ProgramAdministrator
        preconditions:
          - "purchase.status == PENDING"
        side_effects:
          - "purchase.status = SETTLED"
          - "one PointLedgerEntry with points = purchase.points_quantity, source_purchase_id = purchase.id and entry_type = PARTNER_SALE when channel == PARTNER_SALE else PURCHASE"
          - "when purchase.bonus_points > 0 (CO_BRAND_CARD only), one additional EARN_BONUS PointLedgerEntry with points = purchase.bonus_points and source_purchase_id = purchase.id"
          - "ProgramFund.cash_balance_cents += purchase.cash_due_cents"
          - "because those ledger entries and the cash movement happened, Member.point_balance, Member.lifetime_points_earned, Member.points_purchased_current_year, Partner.purchased_points_mtd (when partner_id is set), ProgramFund.outstanding_points, ProgramFund.point_liability_cents, ProgramFund.solvency_ratio and ProgramFund.status are recomputed"
      - from: SETTLED
        to: REFUNDED
        trigger: "POST /loyalty/point-purchases/{purchaseId}/refund"
        actor: ProgramAdministrator
        preconditions:
          - "purchase.status == SETTLED"
        side_effects:
          - "purchase.status = REFUNDED; purchase.refund_reason = request refund_reason"
          - "one REVERSAL PointLedgerEntry per existing entry with source_purchase_id == purchase.id, each with points = -original.points and reversal_of_entry_id = original.id"
          - "ProgramFund.cash_balance_cents -= purchase.cash_due_cents"
          - "because those reversals and the cash movement happened, Member.point_balance, Member.points_purchased_current_year, Partner.purchased_points_mtd, ProgramFund.outstanding_points, point_liability_cents, solvency_ratio and status are recomputed"
        note: "Compensating action for calculations.fund_cash_conservation - cash and points both return to their pre-settlement values."

  - entity: ProgramFund
    initial_state: HEALTHY
    terminal_states: []
    shape: "cyclic posture derived from solvency_ratio; recomputed at the end of every request that moves the ledger or program cash"
    transitions:
      - from: ANY
        to: HEALTHY
        trigger: "system, at the end of any request that writes a PointLedgerEntry, moves ProgramFund.cash_balance_cents, or calls POST /loyalty/program-fund/revalue"
        actor: system
        preconditions:
          - "recomputed solvency_ratio >= SOLVENCY_HEALTHY_MIN (1.0000)"
        side_effects:
          - "fund.status = HEALTHY; PEAK award bookings are permitted again"
      - from: ANY
        to: WATCH
        trigger: "system, same evaluation point as ANY -> HEALTHY"
        actor: system
        preconditions:
          - "SOLVENCY_WATCH_MIN (0.7500) <= recomputed solvency_ratio < SOLVENCY_HEALTHY_MIN (1.0000)"
        side_effects:
          - "fund.status = WATCH; no operation is gated, but the posture is reported"
      - from: ANY
        to: IMPAIRED
        trigger: "system, same evaluation point as ANY -> HEALTHY"
        actor: system
        preconditions:
          - "recomputed solvency_ratio < SOLVENCY_WATCH_MIN (0.7500)"
        side_effects:
          - "fund.status = IMPAIRED"
          - "validations priority 84 now rejects POST /loyalty/redemptions whose selected season == PEAK with ERR_FUND_IMPAIRED_PEAK_BLOCKED, program-wide"
        note: "from: ANY means the posture is re-derived from scratch, so HEALTHY -> IMPAIRED, WATCH -> IMPAIRED and IMPAIRED -> IMPAIRED are all legal evaluations."

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: redemption-create-stale-hotel
    parent_entity: Hotel
    write_endpoint: "POST /loyalty/redemptions"
    occ_field: "expected_hotel_version"
    description: |
      Creating a Redemption against a Hotel whose version has advanced since the client last
      read it is rejected. Award pricing, blackout activation, award allotment consumption and
      the FEE_DELINQUENT posture all live on the Hotel row and all bump its version, so a
      request carrying an outdated expected_hotel_version was priced against a property state
      that no longer exists. A second create with a refreshed version is legitimate business
      (award inventory permits more than one booking), which is why this cannot be reduced to a
      state precondition.
    error_id: ERR_STALE_HOTEL_VERSION
    http_status: 412
  - rule_id: point-adjustment-stale-member
    parent_entity: Member
    write_endpoint: "POST /loyalty/point-adjustments"
    occ_field: "expected_member_version"
    description: |
      Writing a goodwill point adjustment against a Member whose version has advanced since the
      operator read the account is rejected. A duplicate adjustment is otherwise perfectly legal
      product behaviour - two goodwill grants of the same size to the same member both succeed -
      so nothing in the state machine would stop the second write; the stale version is the only
      signal that the operator was looking at a balance and tier that have since moved.
    error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: rate_plan_derivation
    trigger: "POST /loyalty/hotels/{hotelId}/rate-plans, at row creation"
    algorithm: threshold
    formula: |
      base_earn_rate_per_dollar = EARN_RATE_BY_CATEGORY[rate_category]
      is_qualifying          = rate_category IN {TRANSIENT, CORPORATE_NEGOTIATED, GROUP}
      counts_toward_elite    = rate_category IN {TRANSIENT, CORPORATE_NEGOTIATED}
      program_fee_eligible   = rate_category IN {TRANSIENT, CORPORATE_NEGOTIATED, GROUP}
    input_set: "the request's rate_category alone; no other entity is consulted"
    constants:
      EARN_RATE_BY_CATEGORY: { TRANSIENT: 10, CORPORATE_NEGOTIATED: 8, GROUP: 6, OPAQUE_WHOLESALE: 0, EMPLOYEE_COMP: 0, AWARD: 0 }
    precision: "integers; the three booleans are exact set memberships"
    note: "GROUP earns points and is fee-assessed but never accrues elite nights - the asymmetry that makes counts_toward_elite a separate flag from is_qualifying."

  - name: stay_base_points
    trigger: "POST /loyalty/stays/{stayId}/post (PENDING_POSTING -> POSTED_QUALIFYING) and POST /loyalty/stays/{stayId}/adjust (DISPUTED -> ADJUSTED)"
    algorithm: aggregation
    formula: |
      if rate_plan.is_qualifying == false or stay.room_revenue_cents == 0:
          base_points = 0
      else:
          base_points = floor(stay.room_revenue_cents * rate_plan.base_earn_rate_per_dollar / 100)
    input_set: "stay.room_revenue_cents only; stay.incidental_revenue_cents is excluded from earning under every rate category"
    constants: {}
    precision: "floor to whole points; never rounds up, so 12345 cents at 10 points per dollar earns 1234 points, not 1235"

  - name: stay_elite_bonus_points
    trigger: "POST /loyalty/stays/{stayId}/post (PENDING_POSTING -> POSTED_QUALIFYING) and POST /loyalty/stays/{stayId}/adjust (DISPUTED -> ADJUSTED)"
    algorithm: weighted_scoring
    formula: |
      multiplier = ELITE_BONUS_MULTIPLIER[tier_input]      # tier_input differs per variant
      bonus_points = floor(stay.base_points_awarded * multiplier)
      stay.bonus_multiplier_applied = multiplier
    input_set: "the stay's own base_points_awarded, multiplied by the elite multiplier of exactly one tier - which tier is the whole point of the two variants"
    constants:
      ELITE_BONUS_MULTIPLIER: { BASE: 0.00, SILVER: 0.20, GOLD: 0.50, PLATINUM: 0.75 }
    precision: "floor to whole points after multiplying; 123450 * 0.75 = 92587.5 becomes 92587"
    variants:
      - name: provisional_tier_at_checkin
        when: "POST /loyalty/stays/{stayId}/post - the immediate award at posting time"
        difference: "tier_input = stay.tier_at_checkin, the snapshot of Member.elite_tier taken when the Stay row was created. Retroactive tier movement between arrival and posting is ignored."
      - name: final_tier_at_adjustment
        when: "POST /loyalty/stays/{stayId}/adjust - the corrected award at adjustment time"
        difference: "tier_input = Member.elite_tier as read at the moment of adjustment, after every intervening posting has re-derived it. The delta (new_bonus - old_bonus) is written as an additional EARN_BONUS ledger entry."
    note: "Identical stay data therefore yields two different bonus figures: a 123450-base stay awards 0 bonus points under provisional_tier_at_checkin for a BASE guest and 92587 bonus points under final_tier_at_adjustment once that same guest has reached PLATINUM."

  - name: program_fee_assessment
    trigger: "POST /loyalty/stays/{stayId}/post (POSTED_QUALIFYING arm only) and POST /loyalty/stays/{stayId}/adjust"
    algorithm: aggregation
    formula: |
      # step 1 - per stay, rounded to the cent
      if rate_plan.program_fee_eligible == false or rate_plan.is_qualifying == false:
          stay.program_fee_assessed_cents = 0
      else:
          stay.program_fee_assessed_cents = round_half_up(stay.room_revenue_cents * hotel.program_fee_pct)

      # step 2 - the hotel balance is the SUM OF THE ALREADY-ROUNDED per-stay figures
      hotel.fee_ledger_balance_cents = sum(s.program_fee_assessed_cents
                                           for s in Stay
                                           where s.hotel_id == hotel.id
                                             and s.status IN {POSTED_QUALIFYING, POSTED_NON_QUALIFYING, DISPUTED, ADJUSTED})
                                       - sum(b.fee_offset_base_cents
                                             for b in ReimbursementBatch
                                             where b.hotel_id == hotel.id and b.status == PAID)
      # only the BASE offset credits the property's ledger. b.delinquency_surcharge_cents is a
      # penalty retained by the program fund, so it reduces the cash disbursed but never drives the
      # ledger below zero: a 700000 ledger settled by a batch with a 7000 surcharge lands at exactly 0.
    input_set: "Stays of this hotel whose status is in {POSTED_QUALIFYING, POSTED_NON_QUALIFYING, DISPUTED, ADJUSTED}; PENDING_POSTING and VOID stays are excluded. Only room_revenue_cents is fee-bearing; incidental_revenue_cents never is."
    constants:
      FEE_DELINQUENCY_THRESHOLD_CENTS: 250000
    precision: |
      2 decimal places implied by cents, round_half_up. ROUNDING ORDER IS PINNED: round each stay's
      fee to the cent FIRST, then sum the rounded per-stay figures. The alternative order (sum the raw
      revenue, then apply the percentage once, then round) is explicitly NOT the rule and gives a
      different answer: three 12345-cent stays at 0.0475 give 586 + 586 + 586 = 1758 under the pinned
      order and round_half_up(37035 * 0.0475) = 1759 under the rejected order.
    note: "Aggregate selection is pinned: source entity Stay with the explicit status filter above, window = all time (there is no monthly window on the fee ledger), and the sum is order-insensitive so no tie-break is needed."

  - name: elite_tier_recompute
    trigger: "any request that changes a Stay's status into or out of POSTED_QUALIFYING - namely POST /loyalty/stays/{stayId}/post, /adjust and /void"
    algorithm: threshold
    formula: |
      qualifying_nights_ytd = sum(s.nights
                                  for s in Stay
                                  where s.member_id == member.id
                                    and s.status == POSTED_QUALIFYING
                                    and RatePlan(s.rate_plan_id).counts_toward_elite == true
                                    and year(s.checkin_date) == year(current logical clock date))
      if   qualifying_nights_ytd >= TIER_NIGHTS_PLATINUM: elite_tier = PLATINUM
      elif qualifying_nights_ytd >= TIER_NIGHTS_GOLD:     elite_tier = GOLD
      elif qualifying_nights_ytd >= TIER_NIGHTS_SILVER:   elite_tier = SILVER
      else:                                               elite_tier = BASE
    input_set: "Stays of this member with status exactly POSTED_QUALIFYING on an elite-counting rate plan whose checkin_date year equals the logical clock's year; DISPUTED, ADJUSTED, VOID, PENDING_POSTING and POSTED_NON_QUALIFYING stays are all excluded"
    constants:
      TIER_NIGHTS_PLATINUM: 50
      TIER_NIGHTS_GOLD: 30
      TIER_NIGHTS_SILVER: 10
    precision: "integer night counts; every comparison is >= so exactly 50 qualifying nights is PLATINUM and 49 is GOLD"

  - name: benefit_entitlement_matrix
    trigger: "POST /loyalty/stays/{stayId}/post (POSTED_QUALIFYING arm) to synthesize obligations, and the Stay void cascade to decide which OBLIGATED rows are waived"
    algorithm: threshold
    formula: |
      entitled(tier) = { UPGRADE        if tier IN {SILVER, GOLD, PLATINUM} }
                     U { BREAKFAST      if tier IN {GOLD, PLATINUM} }
                     U { LATE_CHECKOUT  if tier == PLATINUM }
      at posting:  one OBLIGATED EliteBenefitDelivery per benefit_type in entitled(stay.tier_at_checkin)
      at waiver:   every OBLIGATED row of this member whose benefit_type is NOT in
                   entitled(Member.elite_tier as recomputed) moves to WAIVED
    input_set: "stay.tier_at_checkin at synthesis time; Member.elite_tier at waiver time - deliberately two different tier readings"
    constants: {}
    precision: "exact set membership; a BASE guest is entitled to nothing, so a downgrade to BASE waives all three benefit types"

  - name: benefit_cost_recovery
    trigger: "POST /loyalty/elite-benefit-deliveries/{deliveryId}/deliver and the ESCALATED -> DELIVERED adjudication hop"
    algorithm: threshold
    formula: |
      if benefit_type == UPGRADE:
          cost_recovery_cents = min(round_half_up(hotel.trailing_12m_adr_cents * UPGRADE_RECOVERY_PCT),
                                    UPGRADE_RECOVERY_CAP_CENTS)
      elif benefit_type == BREAKFAST:
          cost_recovery_cents = BREAKFAST_RECOVERY_CENTS_PER_NIGHT * stay.nights
      else:  # LATE_CHECKOUT
          cost_recovery_cents = LATE_CHECKOUT_RECOVERY_CENTS
    input_set: "the delivery's benefit_type, its Stay's nights, and the hotel's trailing_12m_adr_cents as read at delivery time"
    constants:
      UPGRADE_RECOVERY_PCT: 0.15
      UPGRADE_RECOVERY_CAP_CENTS: 9000
      BREAKFAST_RECOVERY_CENTS_PER_NIGHT: 1800
      LATE_CHECKOUT_RECOVERY_CENTS: 1200
    precision: "cents, round_half_up before the cap is applied; the cap is a hard min() so an ADR of 30000 recovers 4500 and an ADR of 80000 recovers 9000 rather than 12000"

  - name: redemption_pricing_selection
    trigger: "POST /loyalty/redemptions, before any business validation that depends on season"
    algorithm: chronological
    formula: |
      candidates = [ p for p in RedemptionPricing
                     where p.hotel_id == redemption.hotel_id
                       and p.window_start_date <= redemption.checkin_date <= p.window_end_date ]
      # ranking expression over entity fields, highest first
      rank(p) = SEASON_RANK[p.season]        # PEAK = 1, STANDARD = 0
      selected = the candidate with the greatest rank(p)
      tie-break: when two candidates share the greatest rank, take the one with the smaller created_at
                 (created_at ASC); if created_at also ties, the row created first in insertion order wins
      empty candidate set: reject the request with ERR_NO_REDEMPTION_PRICING (validations priority 28)
      redemption.season                   = selected.season
      redemption.points_per_night_applied = selected.points_per_night
      redemption.award_allotment_applied  = selected.award_allotment_per_night
      redemption.cash_copay_cents         = selected.cash_copay_cents * redemption.nights
    input_set: "RedemptionPricing rows of the target hotel whose inclusive [window_start_date, window_end_date] date range contains redemption.checkin_date; the checkout date does not participate in selection"
    constants:
      SEASON_RANK: { PEAK: 1, STANDARD: 0 }
    precision: "exact date comparison on YYYY-MM-DD strings; both window endpoints inclusive"
    note: "Selector is fully pinned: eligibility filter, ranking expression, created_at ASC tie-break and empty-set error. Row id never participates."

  - name: redemption_points_price
    trigger: "POST /loyalty/redemptions, after redemption_pricing_selection"
    algorithm: tiered_pricing
    formula: |
      nightly            = redemption.points_per_night_applied
      tier_discount_pct  = TIER_DISCOUNT_PCT[member.elite_tier]
      discount_per_night = min(floor(nightly * tier_discount_pct), MAX_TIER_DISCOUNT_POINTS)
      chargeable_nights  = redemption.nights - 1 if (redemption.season == STANDARD and redemption.nights >= FREE_NIGHT_MIN_NIGHTS)
                           else redemption.nights
      gross              = (nightly - discount_per_night) * chargeable_nights
      surcharge          = ceil(gross * PEAK_SURCHARGE_PCT[hotel.market_tier]) if redemption.season == PEAK else 0
      points_charged     = max(gross + surcharge, MIN_POINTS_FLOOR_PER_NIGHT * chargeable_nights)
    input_set: "the selected pricing row's points_per_night, the member's elite_tier, the hotel's market_tier, the redemption's season and its night count - five inputs interacting non-linearly through a capped discount, a conditional free night, a market-keyed surcharge and an absolute floor"
    constants:
      TIER_DISCOUNT_PCT: { BASE: 0.00, SILVER: 0.00, GOLD: 0.05, PLATINUM: 0.10 }
      MAX_TIER_DISCOUNT_POINTS: 3000
      FREE_NIGHT_MIN_NIGHTS: 5
      PEAK_SURCHARGE_PCT: { URBAN: 0.25, RESORT: 0.35, SELECT: 0.15 }
      MIN_POINTS_FLOOR_PER_NIGHT: 6000
    precision: |
      whole points throughout. The discount is floored then capped (both directions matter: a PLATINUM
      guest at 40000 points per night computes floor(4000) and is then capped to 3000). The peak
      surcharge is ceil, not round. The floor is applied to the post-surcharge total, once, against
      chargeable_nights rather than nights.
    note: "Evaluation order is pinned: discount -> free night -> gross -> surcharge -> floor. Applying the free night before the discount, or the floor before the surcharge, changes the answer."

  - name: award_inventory_check
    trigger: "POST /loyalty/redemptions, after redemption_pricing_selection"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN per-night occupancy with AGGREGATE CAPACITY
      for d in dates(redemption.checkin_date, redemption.checkout_date):     # [checkin, checkout), checkout excluded
          occupied = count(r for r in Redemption
                           where r.hotel_id == redemption.hotel_id
                             and r.fulfillment_status IN {HELD, CONFIRMED, STAYED}
                             and r.checkin_date <= d < r.checkout_date)
          if occupied + 1 > redemption.award_allotment_applied:
              reject ERR_AWARD_INVENTORY_UNAVAILABLE
    input_set: "Redemption rows of the same hotel whose fulfillment_status is in {HELD, CONFIRMED, STAYED}; CANCELLED and NO_SHOW rows release their nights and are excluded. The allotment compared against is the one snapshotted on the incoming row."
    constants: {}
    precision: "half-open interval arithmetic: a departure on 2026-09-15 does not occupy 2026-09-15, so a back-to-back arrival that same day never collides"
    note: "Aggregate-capacity geometry - collision is a per-date count against a capacity, not a pairwise interval test."

  - name: blackout_conflict_check
    trigger: "POST /loyalty/blackout-windows/{windowId}/activate"
    algorithm: interval_merge
    formula: |
      # CLOSED intervals on both endpoints, separated by a MANDATORY BUFFER
      for w in BlackoutWindow where w.hotel_id == window.hotel_id and w.status == ACTIVE and w.id != window.id:
          earlier, later = the two windows ordered by start_date ASC (tie-break: created_at ASC)
          gap_days = (later.start_date - earlier.end_date).days - 1
          if gap_days < BLACKOUT_MIN_GAP_DAYS:
              reject ERR_BLACKOUT_WINDOW_BUFFER_CONFLICT
      if hotel.blackout_days_used_current_year + window.day_count > BLACKOUT_MAX_DAYS_PER_YEAR:
          reject ERR_BLACKOUT_ANNUAL_CAP_EXCEEDED
    input_set: "BlackoutWindow rows of the same hotel with status == ACTIVE only; DRAFT and REVOKED windows neither block activation nor consume the annual cap"
    constants:
      BLACKOUT_MIN_GAP_DAYS: 7
      BLACKOUT_MAX_DAYS_PER_YEAR: 60
    precision: |
      both endpoints inclusive, so a window 2026-12-01..2026-12-05 has day_count 5. gap_days counts the
      clear days strictly between the two windows: end 2026-12-05 followed by start 2026-12-13 gives
      gap_days = 7 and is accepted, while a start of 2026-12-12 gives gap_days = 6 and is rejected.
      Direct adjacency (gap_days == 0) and any overlap (gap_days < 0) are therefore both rejected.
    note: "Buffered-closed geometry, deliberately different from award_inventory_check's touching-allowed half-open geometry and from member_redemption_overlap_check."

  - name: member_redemption_overlap_check
    trigger: "POST /loyalty/redemptions"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN pairwise exclusivity on the MEMBER as the occupied resource
      for r in Redemption where r.member_id == redemption.member_id
                            and r.fulfillment_status IN {HELD, CONFIRMED, STAYED}:
          if redemption.checkin_date < r.checkout_date and r.checkin_date < redemption.checkout_date:
              reject ERR_MEMBER_REDEMPTION_OVERLAP
    input_set: "the member's own Redemption rows with fulfillment_status in {HELD, CONFIRMED, STAYED} at any hotel; CANCELLED and NO_SHOW rows are excluded"
    constants: {}
    precision: "strict less-than on both sides, so checkout 2026-09-15 followed by checkin 2026-09-15 does not overlap - one guest cannot occupy two properties on the same night, but may check out and in on the same day"
    note: "Pairwise exclusivity on a single-capacity resource (the member), versus award_inventory_check's per-date aggregate capacity on a hotel."

  - name: owner_reimbursement
    trigger: "the fulfillment CONFIRMED -> STAYED transition (accrual) and POST /loyalty/reimbursement-batches/{batchId}/release (settlement)"
    algorithm: threshold
    formula: |
      occ = occupancy_input      # variant-dependent
      adr = adr_input            # variant-dependent
      if   occ >= COMPRESSION_OCCUPANCY: rate_per_night = adr
      elif occ >= STRONG_OCCUPANCY:      rate_per_night = round_half_up(adr * STRONG_RATE_PCT)
      else:                              rate_per_night = max(round_half_up(adr * SOFT_RATE_PCT),
                                                              FLOOR_REIMBURSEMENT_CENTS_PER_NIGHT)
      amount_cents = rate_per_night * redemption.nights
    input_set: "one Redemption row's nights, plus an occupancy and an ADR figure whose provenance is exactly what separates the two variants"
    constants:
      COMPRESSION_OCCUPANCY: 0.95
      STRONG_OCCUPANCY: 0.80
      STRONG_RATE_PCT: 0.75
      SOFT_RATE_PCT: 0.50
      FLOOR_REIMBURSEMENT_CENTS_PER_NIGHT: 3000
    precision: "cents, round_half_up on the per-night rate BEFORE multiplying by nights; the floor applies per night, not per stay"
    variants:
      - name: accrual_estimate
        when: "written to Redemption.estimated_reimbursement_cents when fulfillment_status becomes STAYED"
        difference: "occupancy_input = hotel.trailing_12m_occupancy_pct and adr_input = hotel.trailing_12m_adr_cents as they read at completion time"
      - name: settlement_actual
        when: "written to Redemption.settled_reimbursement_cents when the batch is released, and summed into batch.gross_reimbursement_cents"
        difference: "occupancy_input = batch.occupancy_pct_at_release and adr_input = batch.adr_cents_at_release, both snapshotted from the hotel at release time - after any intervening POST /loyalty/hotels/{hotelId}/performance-refresh"
    note: "Same redemption, two defensible figures: a 2-night award at ADR 30000 accrues 45000 while occupancy reads 0.82 and settles at 60000 once occupancy has been refreshed to 0.96."

  - name: batch_item_selection
    trigger: "POST /loyalty/reimbursement-batches/{batchId}/release"
    algorithm: chronological
    formula: |
      items = [ r for r in Redemption
                where r.hotel_id == batch.hotel_id
                  and r.fulfillment_status == STAYED
                  and r.reimbursement_status == ACCRUED
                  and month_of(r.checkout_date) == batch.period_month ]
      ordered by r.created_at ASC (tie-break: insertion order, never by id)
      if len(items) == 0: reject ERR_BATCH_NO_ELIGIBLE_ITEMS
      batch.item_count = len(items)
    input_set: "Redemptions of the batch's hotel with fulfillment_status == STAYED and reimbursement_status == ACCRUED whose checkout_date falls inside the inclusive calendar month window [period_month-01, last day of period_month]; NOT_DUE, BATCHED, PAID and VOIDED rows are excluded"
    constants: {}
    precision: "calendar-month window with both endpoints inclusive; a checkout on the first day of the following month belongs to the following period"

  - name: batch_net_payable
    trigger: "POST /loyalty/reimbursement-batches/{batchId}/release, after batch_item_selection"
    algorithm: waterfall_allocation
    formula: |
      # PINNED EVALUATION ORDER - the surcharge tier is keyed on the step-3 figure, never on the step-6 result
      step 1: gross_reimbursement_cents = sum(r.settled_reimbursement_cents for r in items)
      step 2: fee_offset_base_cents     = hotel.fee_ledger_balance_cents as read at release
      step 3: net_before_surcharge      = gross_reimbursement_cents - fee_offset_base_cents
      step 4: surcharge_pct = DELINQUENCY_SURCHARGE_PCT_NEGATIVE  if net_before_surcharge < 0
                              DELINQUENCY_SURCHARGE_PCT_LOW       if 0 <= net_before_surcharge < DELINQUENCY_TIER_CENTS
                              DELINQUENCY_SURCHARGE_PCT_HIGH      otherwise
              delinquency_surcharge_cents = round_half_up(fee_offset_base_cents * surcharge_pct)
      step 5: total_fee_offset_cents = fee_offset_base_cents + delinquency_surcharge_cents
      step 6: net_payable_cents      = gross_reimbursement_cents - total_fee_offset_cents
    input_set: "the batch's own selected items for step 1 and the hotel's live fee ledger for step 2; nothing else"
    constants:
      DELINQUENCY_TIER_CENTS: 500000
      DELINQUENCY_SURCHARGE_PCT_NEGATIVE: 0.05
      DELINQUENCY_SURCHARGE_PCT_LOW: 0.02
      DELINQUENCY_SURCHARGE_PCT_HIGH: 0.01
    precision: |
      cents, round_half_up once at step 4. net_payable_cents is SIGNED - a negative value means the
      property owes the program. The circularity is only apparent: net_payable depends on the fee
      offset, which depends on a tier keyed on the net figure. The pin resolves it in a single pass -
      the tier is read off net_before_surcharge from step 3. With gross 1205000 and fee base 700000,
      step 3 gives 505000 so the HIGH (0.01) tier applies, the surcharge is 7000 and net_payable is
      498000. Keying the tier on the step-6 result instead would see 498000, select the LOW (0.02)
      tier, and produce 491000 - a different, wrong answer.

  - name: point_purchase_pricing
    trigger: "POST /loyalty/point-purchases, at row creation"
    algorithm: tiered_pricing
    formula: |
      discount_pct = VOLUME_DISCOUNT_PCT_HIGH if points_quantity >= VOLUME_TIER_HIGH_POINTS
                     VOLUME_DISCOUNT_PCT_MID  if points_quantity >= VOLUME_TIER_MID_POINTS
                     0.00 otherwise
      list_price_source = Partner(partner_id).points_cost_per_1000_cents if channel == PARTNER_SALE
                          else DIRECT_LIST_PRICE_PER_1000_CENTS
      cash_due_cents = round_half_up(points_quantity / 1000 * list_price_source * (1 - discount_pct))
      bonus_points   = floor(points_quantity * COBRAND_BONUS_PCT) if channel == CO_BRAND_CARD else 0
    input_set: "the request's points_quantity and channel, plus the referenced Partner's list price for PARTNER_SALE only"
    constants:
      VOLUME_TIER_HIGH_POINTS: 100000
      VOLUME_TIER_MID_POINTS: 25000
      VOLUME_DISCOUNT_PCT_HIGH: 0.12
      VOLUME_DISCOUNT_PCT_MID: 0.05
      DIRECT_LIST_PRICE_PER_1000_CENTS: 1250
      COBRAND_BONUS_PCT: 0.10
      MEMBER_ANNUAL_PURCHASE_CAP_POINTS: 200000
    precision: "cents, round_half_up applied once to the fully discounted amount; tier comparisons are >= so exactly 100000 points takes the HIGH tier and 99000 takes the MID tier"

  - name: point_liability_valuation
    trigger: "the end of any request that writes a PointLedgerEntry or moves ProgramFund.cash_balance_cents, and POST /loyalty/program-fund/revalue"
    algorithm: aggregation
    formula: |
      outstanding_points   = sum(e.points for e in PointLedgerEntry)          # every member, every entry type
      point_liability_cents = round_half_up(outstanding_points
                                            * POINT_UNIT_COST_CENTS_PER_1000 / 1000
                                            * (1 - fund.breakage_rate_pct))
      solvency_ratio = 999.0000 if point_liability_cents == 0
                       else round_half_up_to_4dp(fund.cash_balance_cents / point_liability_cents)
      status = HEALTHY  if solvency_ratio >= SOLVENCY_HEALTHY_MIN
               WATCH    if SOLVENCY_WATCH_MIN <= solvency_ratio < SOLVENCY_HEALTHY_MIN
               IMPAIRED otherwise
    input_set: "every PointLedgerEntry row in the system with no status filter - reversals already carry negative points, so no exclusion list is needed; the sum is order-insensitive"
    constants:
      POINT_UNIT_COST_CENTS_PER_1000: 600
      SOLVENCY_HEALTHY_MIN: 1.0
      SOLVENCY_WATCH_MIN: 0.75
    precision: "liability in whole cents, round_half_up; solvency_ratio to 4 decimals, round_half_up; the empty-ledger case is pinned to 999.0000 / HEALTHY rather than a division by zero"

  - name: point_conservation
    trigger: "invariant - asserted after every request that writes or reverses a PointLedgerEntry"
    algorithm: aggregation
    formula: |
      # conserved quantity 1: member points
      Member.point_balance == sum(e.points for e in PointLedgerEntry where e.member_id == Member.id)

      # and after a forward action is paired with its compensating action, the scoped sum returns to zero:
      after POST /loyalty/stays/{stayId}/void of a previously posted stay:
          sum(e.points for e in PointLedgerEntry where e.source_stay_id == stay.id) == 0
      after POST /loyalty/redemptions/{redemptionId}/cancel:
          sum(e.points for e in PointLedgerEntry where e.source_redemption_id == redemption.id) == 0
      after POST /loyalty/point-purchases/{purchaseId}/refund:
          sum(e.points for e in PointLedgerEntry where e.source_purchase_id == purchase.id) == 0
    input_set: "all PointLedgerEntry rows, optionally scoped by one source_* foreign key"
    constants: {}
    precision: "exact integer equality; no rounding participates, which is why the floors inside the earning formulas must be applied once at award time and never re-derived at reversal time"

  - name: fund_cash_conservation
    trigger: "invariant - asserted after every request that moves ProgramFund.cash_balance_cents"
    algorithm: aggregation
    formula: |
      # conserved quantity 2: program cash
      ProgramFund.cash_balance_cents == sum(p.cash_due_cents for p in PointPurchase where p.status == SETTLED)
                                       - sum(b.net_payable_cents for b in ReimbursementBatch where b.status == PAID)
    input_set: "PointPurchase rows with status == SETTLED (PENDING and REFUNDED excluded) and ReimbursementBatch rows with status == PAID (every other status excluded)"
    constants: {}
    precision: "exact integer equality in cents; a refund removes the purchase from the SETTLED set so the identity re-balances without any separate reversal term, and a negative net_payable_cents on a PAID batch increases program cash"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority - lowest number wins)
# =============================================================================
validations:
  # --- authentication / authorization / segregation of duties -----------------
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "resource ownership: a HotelOwner's X-User-ID equals the hotel_id reached by the request (directly, or via the stay / redemption / batch / blackout window / rate plan named in the path), and a Member's X-User-ID equals the member_id reached by the request"
    error_id: ERR_FORBIDDEN_RESOURCE_OWNER
    http_status: 403
    applies_to: "every endpoint whose roles list includes HotelOwner or Member"

  - priority: 4
    category: auth
    check: "segregation of duties on the reimbursement batch: the X-User-ID approving or rejecting a batch differs from batch.released_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /loyalty/reimbursement-batches/{batchId}/approve, POST /loyalty/reimbursement-batches/{batchId}/reject"

  - priority: 5
    category: auth
    check: "segregation of duties on disbursement: the X-User-ID paying a batch differs from both batch.released_by_user_id and batch.approved_by_user_id, so no single operator can carry a payment from release to cash-out"
    error_id: ERR_PAYER_CONFLICT
    http_status: 403
    applies_to: "POST /loyalty/reimbursement-batches/{batchId}/pay"

  # --- existence, validated left-to-right along the path ----------------------
  - priority: 10
    category: existence
    check: "the hotel named by hotelId (or by the request body's hotel_id) exists"
    error_id: ERR_HOTEL_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint carrying hotelId or hotel_id"

  - priority: 11
    category: existence
    check: "the rate plan named by rate_plan_id exists"
    error_id: ERR_RATE_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "POST /loyalty/stays, GET /loyalty/rate-plans/{ratePlanId}"

  - priority: 12
    category: existence
    check: "the member named by memberId or member_id exists"
    error_id: ERR_MEMBER_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint carrying memberId or member_id"

  - priority: 13
    category: existence
    check: "the stay named by stayId or stay_id exists"
    error_id: ERR_STAY_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint carrying stayId"

  - priority: 14
    category: existence
    check: "the redemption named by redemptionId exists"
    error_id: ERR_REDEMPTION_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint carrying redemptionId"

  - priority: 15
    category: existence
    check: "the elite benefit delivery named by deliveryId (or by a complaint's related_delivery_id) exists"
    error_id: ERR_DELIVERY_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint carrying deliveryId, and POST /loyalty/member-complaints when related_delivery_id is supplied"

  - priority: 16
    category: existence
    check: "the reimbursement batch named by batchId exists"
    error_id: ERR_BATCH_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint carrying batchId"

  - priority: 17
    category: existence
    check: "the blackout window named by windowId exists"
    error_id: ERR_BLACKOUT_WINDOW_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint carrying windowId"

  - priority: 18
    category: existence
    check: "the partner named by partnerId or partner_id exists"
    error_id: ERR_PARTNER_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint carrying partnerId or partner_id"

  - priority: 19
    category: existence
    check: "the point purchase named by purchaseId exists"
    error_id: ERR_PURCHASE_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint carrying purchaseId"

  - priority: 20
    category: existence
    check: "the member complaint named by complaintId exists"
    error_id: ERR_COMPLAINT_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint carrying complaintId"

  - priority: 21
    category: existence
    check: "the redemption pricing row named by pricingId exists"
    error_id: ERR_PRICING_ROW_NOT_FOUND
    http_status: 404
    applies_to: "GET /loyalty/redemption-pricing/{pricingId}"

  # --- request shape ---------------------------------------------------------
  - priority: 22
    category: business_referential
    check: "every field declared required in the endpoint's input is present, of the declared type, and every enum-valued field carries a value from that field's declared enum set"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 23
    category: business_temporal
    check: "date ranges are strictly increasing: a stay's and a redemption's checkout_date is strictly after its checkin_date, and a blackout window's and a pricing row's end date is on or after its start date"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /loyalty/stays, POST /loyalty/redemptions, POST /loyalty/hotels/{hotelId}/blackout-windows, POST /loyalty/hotels/{hotelId}/redemption-pricing"

  - priority: 24
    category: business_referential
    check: "monetary and point quantities are in range: room_revenue_cents and incidental_revenue_cents are >= 0, points_quantity is a multiple of 1000 and >= 1000, program_fee_pct is between 0.0 and 0.20 inclusive with at most 4 decimal places, trailing_12m_occupancy_pct is between 0.0 and 1.0 inclusive, rooms_count is >= 1, trailing_12m_adr_cents is >= 0, breakage_rate_pct is between 0.0 and 0.35 inclusive, and a goodwill point adjustment's points is non-zero"
    error_id: ERR_AMOUNT_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /loyalty/hotels, POST /loyalty/hotels/{hotelId}/performance-refresh, POST /loyalty/stays, POST /loyalty/point-purchases, POST /loyalty/point-adjustments, POST /loyalty/program-fund/breakage-rate"

  # --- cross-reference integrity --------------------------------------------
  - priority: 25
    category: business_referential
    check: "the rate plan referenced by a new stay belongs to the same hotel as the stay"
    error_id: ERR_RATE_PLAN_HOTEL_MISMATCH
    http_status: 422
    applies_to: "POST /loyalty/stays"

  - priority: 26
    category: business_referential
    check: "a complaint's related_delivery_id names a delivery whose Stay belongs to the complaining member"
    error_id: ERR_DELIVERY_MEMBER_MISMATCH
    http_status: 422
    applies_to: "POST /loyalty/member-complaints"

  - priority: 27
    category: business_referential
    check: "partner_id is present when channel == PARTNER_SALE and absent for the CO_BRAND_CARD and DIRECT_PURCHASE channels"
    error_id: ERR_PARTNER_CHANNEL_MISMATCH
    http_status: 422
    applies_to: "POST /loyalty/point-purchases"

  - priority: 28
    category: business_referential
    check: "at least one RedemptionPricing row of the target hotel covers the requested checkin_date; this check runs before every season-dependent check below because it is what assigns redemption.season"
    error_id: ERR_NO_REDEMPTION_PRICING
    http_status: 422
    applies_to: "POST /loyalty/redemptions"

  # --- optimistic concurrency ------------------------------------------------
  - priority: 30
    category: state
    check: "expected_hotel_version equals the target hotel's current version"
    error_id: ERR_STALE_HOTEL_VERSION
    http_status: 412
    applies_to: "POST /loyalty/redemptions"

  - priority: 31
    category: state
    check: "expected_member_version equals the target member's current version"
    error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412
    applies_to: "POST /loyalty/point-adjustments"

  # --- state preconditions ---------------------------------------------------
  - priority: 40
    category: state
    check: "the hotel's status permits the operation. Stay capture and blackout drafting require status == ACTIVE exactly (ONBOARDING, FEE_DELINQUENT and TERMINATED are all rejected). Award booking and reimbursement-batch creation require status IN {ACTIVE, FEE_DELINQUENT} (only ONBOARDING and TERMINATED are rejected), because a delinquent property still owes redemption reimbursement and its arrears are collected through the batch fee offset; PEAK inventory is separately withheld from delinquent properties by priority 50. Activation requires status == ONBOARDING exactly, so a second activate is refused rather than repeated. Termination requires status IN {ACTIVE, FEE_DELINQUENT}, so an ONBOARDING property cannot be terminated and a TERMINATED one cannot be terminated twice. Rate-plan creation and performance refresh require status != TERMINATED"
    error_id: ERR_HOTEL_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /loyalty/stays, POST /loyalty/hotels/{hotelId}/blackout-windows (ACTIVE only); POST /loyalty/redemptions, POST /loyalty/reimbursement-batches (ACTIVE or FEE_DELINQUENT); POST /loyalty/hotels/{hotelId}/activate (ONBOARDING only); POST /loyalty/hotels/{hotelId}/terminate (ACTIVE or FEE_DELINQUENT); POST /loyalty/hotels/{hotelId}/rate-plans, POST /loyalty/hotels/{hotelId}/performance-refresh (any status except TERMINATED)"

  - priority: 41
    category: state
    check: "the stay's status permits the requested transition: PENDING_POSTING to post, POSTED_QUALIFYING or POSTED_NON_QUALIFYING to dispute, DISPUTED to adjust, and anything except VOID to void"
    error_id: ERR_STAY_INVALID_STATE
    http_status: 409
    applies_to: "POST /loyalty/stays/{stayId}/post, /dispute, /adjust, /void; also POST /loyalty/elite-benefit-deliveries/{deliveryId}/deliver and /deny, which require the delivery's Stay to still be POSTED_QUALIFYING"

  - priority: 42
    category: state
    check: "the delivery's status is OBLIGATED - the only status from which a property may record delivery or denial"
    error_id: ERR_DELIVERY_INVALID_STATE
    http_status: 409
    applies_to: "POST /loyalty/elite-benefit-deliveries/{deliveryId}/deliver, POST /loyalty/elite-benefit-deliveries/{deliveryId}/deny"

  - priority: 43
    category: state
    check: "the batch's status permits the requested transition: OPEN to release, RELEASED to approve or reject, APPROVED to pay"
    error_id: ERR_BATCH_INVALID_STATE
    http_status: 409
    applies_to: "POST /loyalty/reimbursement-batches/{batchId}/release, /approve, /reject, /pay"

  - priority: 44
    category: state
    check: "the redemption's fulfillment_status permits the requested transition: HELD to confirm, CONFIRMED to complete-stay or mark no-show, HELD or CONFIRMED to cancel"
    error_id: ERR_REDEMPTION_INVALID_STATE
    http_status: 409
    applies_to: "POST /loyalty/redemptions/{redemptionId}/confirm, /complete-stay, /no-show, /cancel"

  - priority: 45
    category: state
    check: "the point purchase's status permits the requested transition: PENDING to settle, SETTLED to refund"
    error_id: ERR_PURCHASE_INVALID_STATE
    http_status: 409
    applies_to: "POST /loyalty/point-purchases/{purchaseId}/settle, /refund"

  - priority: 46
    category: state
    check: "the complaint's status permits the requested transition: OPEN to review, UNDER_REVIEW to request-info or resolve, INFO_REQUESTED to provide-info, RESOLVED_UPHELD to escalate, ESCALATED to adjudicate; the terminal statuses RESOLVED_GOODWILL and CLOSED admit nothing"
    error_id: ERR_COMPLAINT_INVALID_STATE
    http_status: 409
    applies_to: "POST /loyalty/member-complaints/{complaintId}/review, /request-info, /provide-info, /resolve, /escalate, /adjudicate"

  - priority: 47
    category: state
    check: "the blackout window's status permits the requested transition: DRAFT to activate, ACTIVE to revoke"
    error_id: ERR_BLACKOUT_WINDOW_INVALID_STATE
    http_status: 409
    applies_to: "POST /loyalty/blackout-windows/{windowId}/activate, /revoke"

  - priority: 48
    category: state
    check: "a property may only be activated once its commercial setup exists: at least one RatePlan belongs to the hotel"
    error_id: ERR_HOTEL_ONBOARDING_INCOMPLETE
    http_status: 409
    applies_to: "POST /loyalty/hotels/{hotelId}/activate"

  # --- program safety / policy ----------------------------------------------
  - priority: 50
    category: business_safety
    check: "PEAK-season award inventory is withheld from properties whose fee ledger is delinquent: when the selected pricing row's season is PEAK, hotel.status must not be FEE_DELINQUENT"
    error_id: ERR_PEAK_INVENTORY_WITHHELD
    http_status: 409
    applies_to: "POST /loyalty/redemptions"

  - priority: 51
    category: business_safety
    check: "a complaint may be sent back for member information at most twice: complaint.info_request_count is below 2"
    error_id: ERR_INFO_REQUEST_LIMIT
    http_status: 409
    applies_to: "POST /loyalty/member-complaints/{complaintId}/request-info"

  - priority: 52
    category: business_safety
    check: "cross-entity precondition on escalation: when complaint.subject_type == BENEFIT_DENIAL, the delivery named by complaint.related_delivery_id must be in status DENIED - a delivery the property has since honoured cannot be escalated"
    error_id: ERR_DELIVERY_NOT_DENIED
    http_status: 409
    applies_to: "POST /loyalty/member-complaints/{complaintId}/escalate"

  - priority: 53
    category: business_safety
    check: "cross-entity precondition on adjudication: when complaint.subject_type == BENEFIT_DENIAL, the delivery named by complaint.related_delivery_id must still be in status ESCALATED - if the underlying Stay was voided in the meantime the delivery is WAIVED and there is nothing left to adjudicate"
    error_id: ERR_DELIVERY_NOT_ESCALATED
    http_status: 409
    applies_to: "POST /loyalty/member-complaints/{complaintId}/adjudicate"

  - priority: 54
    category: business_safety
    check: "a property may not deny more than 3 elite benefits in total: hotel.benefit_denial_count is below 3 before the denial is recorded"
    error_id: ERR_BENEFIT_DENIAL_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /loyalty/elite-benefit-deliveries/{deliveryId}/deny"

  # --- temporal --------------------------------------------------------------
  - priority: 60
    category: business_temporal
    check: "no ACTIVE BlackoutWindow of the target hotel covers any night in [checkin_date, checkout_date); a window with scope ALL_REDEMPTIONS blocks every season, while a window with scope STANDARD_ONLY blocks only redemptions whose selected season is STANDARD"
    error_id: ERR_BLACKOUT_DATE_UNAVAILABLE
    http_status: 422
    applies_to: "POST /loyalty/redemptions"

  - priority: 61
    category: business_temporal
    check: "activating a blackout window leaves at least 7 clear days between it and every other ACTIVE window of the same hotel (closed intervals; direct adjacency and overlap both rejected)"
    error_id: ERR_BLACKOUT_WINDOW_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /loyalty/blackout-windows/{windowId}/activate"

  - priority: 62
    category: business_temporal
    check: "the member holds no other HELD, CONFIRMED or STAYED redemption whose half-open [checkin_date, checkout_date) interval intersects the requested one; a checkout and a same-day checkin do not intersect"
    error_id: ERR_MEMBER_REDEMPTION_OVERLAP
    http_status: 409
    applies_to: "POST /loyalty/redemptions"

  - priority: 63
    category: business_temporal
    check: "a stay may only be posted once it has ended: stay.checkout_date is on or before the logical clock's current date"
    error_id: ERR_STAY_NOT_COMPLETED
    http_status: 422
    applies_to: "POST /loyalty/stays/{stayId}/post"

  - priority: 64
    category: business_temporal
    check: "an award stay may only be completed once it has ended: redemption.checkout_date is on or before the logical clock's current date"
    error_id: ERR_REDEMPTION_NOT_ELAPSED
    http_status: 422
    applies_to: "POST /loyalty/redemptions/{redemptionId}/complete-stay"

  - priority: 65
    category: business_temporal
    check: "a no-show may only be recorded once the arrival date has come: redemption.checkin_date is on or before the logical clock's current date"
    error_id: ERR_REDEMPTION_NOT_ARRIVED
    http_status: 422
    applies_to: "POST /loyalty/redemptions/{redemptionId}/no-show"

  # --- constraint satisfaction ----------------------------------------------
  - priority: 70
    category: business_constraint
    check: "for every night in [checkin_date, checkout_date), the count of the hotel's HELD, CONFIRMED and STAYED redemptions occupying that night plus one does not exceed the selected pricing row's award_allotment_per_night"
    error_id: ERR_AWARD_INVENTORY_UNAVAILABLE
    http_status: 409
    applies_to: "POST /loyalty/redemptions"

  - priority: 71
    category: business_constraint
    check: "the member's elite_tier is at or above the selected pricing row's min_tier_required, ranked BASE < SILVER < GOLD < PLATINUM"
    error_id: ERR_TIER_BELOW_INVENTORY_MINIMUM
    http_status: 422
    applies_to: "POST /loyalty/redemptions"

  - priority: 72
    category: business_constraint
    check: "hotel.blackout_days_used_current_year plus the window's day_count does not exceed 60"
    error_id: ERR_BLACKOUT_ANNUAL_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /loyalty/blackout-windows/{windowId}/activate"

  - priority: 73
    category: business_constraint
    check: "rate_code is unique within the hotel"
    error_id: ERR_DUPLICATE_RATE_CODE
    http_status: 409
    applies_to: "POST /loyalty/hotels/{hotelId}/rate-plans"

  - priority: 74
    category: business_constraint
    check: "a new pricing row's [window_start_date, window_end_date] does not overlap an existing row of the same hotel and the same season"
    error_id: ERR_PRICING_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /loyalty/hotels/{hotelId}/redemption-pricing"

  - priority: 75
    category: business_constraint
    check: "no other non-PAID, non-REJECTED reimbursement batch exists for the same hotel and period_month"
    error_id: ERR_DUPLICATE_BATCH_PERIOD
    http_status: 409
    applies_to: "POST /loyalty/reimbursement-batches"

  - priority: 76
    category: business_constraint
    check: "the batch's item selection is non-empty: at least one STAYED redemption of this hotel with reimbursement_status == ACCRUED has a checkout_date inside the batch's period_month"
    error_id: ERR_BATCH_NO_ELIGIBLE_ITEMS
    http_status: 422
    applies_to: "POST /loyalty/reimbursement-batches/{batchId}/release"

  - priority: 77
    category: business_constraint
    check: "partner.purchased_points_mtd plus points_quantity does not exceed partner.monthly_cap_points"
    error_id: ERR_PARTNER_MONTHLY_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /loyalty/point-purchases when channel == PARTNER_SALE"

  # --- fiscal (last) ---------------------------------------------------------
  - priority: 80
    category: business_fiscal
    check: "member.point_balance is greater than or equal to the computed points_charged"
    error_id: ERR_INSUFFICIENT_POINTS
    http_status: 402
    applies_to: "POST /loyalty/redemptions"

  - priority: 81
    category: business_fiscal
    check: "member.points_purchased_current_year plus points_quantity does not exceed 200000"
    error_id: ERR_PURCHASE_CAP_EXCEEDED
    http_status: 402
    applies_to: "POST /loyalty/point-purchases"

  - priority: 82
    category: business_fiscal
    check: "the program fund can fund the disbursement: fund.cash_balance_cents is greater than or equal to batch.net_payable_cents (a batch with a negative net_payable_cents always passes, since paying it collects cash)"
    error_id: ERR_FUND_INSUFFICIENT_CASH
    http_status: 402
    applies_to: "POST /loyalty/reimbursement-batches/{batchId}/pay"

  - priority: 83
    category: business_fiscal
    check: "goodwill point grants are blocked while the program fund's status is IMPAIRED"
    error_id: ERR_FUND_IMPAIRED
    http_status: 402
    applies_to: "POST /loyalty/point-adjustments, POST /loyalty/member-complaints/{complaintId}/resolve when goodwill_points > 0"

  - priority: 84
    category: business_fiscal
    check: "peak-season award inventory is closed program-wide while the program fund's status is IMPAIRED: when the selected pricing row's season is PEAK, ProgramFund.status must not be IMPAIRED"
    error_id: ERR_FUND_IMPAIRED_PEAK_BLOCKED
    http_status: 402
    applies_to: "POST /loyalty/redemptions"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving: logical clock -------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock to an explicit instant. The clock's startup default is exactly 2026-08-01T00:00:00Z: before any call to this endpoint the logical clock reads that value and never falls back to real wall-clock time. Every date comparison in §1.3 and §1.4 (stay completion, award-stay elapse, YTD tier windows, blackout coverage, batch period membership) reads this clock."
    roles: [ProgramAdministrator, ProgramAuditor, HotelOwner, Member, MemberCareAgent]
    code: 200
    input: [current_utc]
    output: "null"
    side_effects: ["logical clock advances or rewinds to the supplied instant; no entity is written"]

  # --- hotels ----------------------------------------------------------------
  - method: POST
    path: "/loyalty/hotels"
    description: "Enrolls a property into the loyalty program in ONBOARDING status."
    roles: [ProgramAdministrator]
    code: 201
    input: [name, brand_code, market_tier, program_fee_pct, rooms_count, trailing_12m_occupancy_pct, trailing_12m_adr_cents]
    output: Hotel
    side_effects:
      - "status initialised to ONBOARDING"
      - "fee_ledger_balance_cents, reimbursement_owed_cents, benefit_recovery_owed_cents, benefit_denial_count and blackout_days_used_current_year initialised to 0"
      - "version initialised to 1"

  - method: GET
    path: "/loyalty/hotels/{hotelId}"
    description: "Reads one property including its derived fee, reimbursement and recovery balances, and its current version for optimistic-concurrency use."
    roles: [ProgramAdministrator, ProgramAuditor, HotelOwner, MemberCareAgent]
    code: 200
    input: []
    output: Hotel
    side_effects: []

  - method: GET
    path: "/loyalty/hotels"
    description: "Lists properties with optional status and market filters."
    roles: [ProgramAdministrator, ProgramAuditor]
    code: 200
    input: ["status?", "market_tier?", "limit?", "offset?"]
    output: Hotel[]
    side_effects: []

  - method: POST
    path: "/loyalty/hotels/{hotelId}/activate"
    description: "Moves a property from ONBOARDING to ACTIVE, opening it for stay posting and award redemption."
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: Hotel
    side_effects: ["status ONBOARDING -> ACTIVE", "increments Hotel.version by 1"]

  - method: POST
    path: "/loyalty/hotels/{hotelId}/performance-refresh"
    description: "Restates the property's trailing-twelve-month occupancy and average daily rate. These two figures are the inputs to the owner-reimbursement formula, so refreshing them between accrual and batch release is what makes the accrual_estimate and settlement_actual variants diverge."
    roles: [ProgramAdministrator, HotelOwner]
    code: 200
    input: [trailing_12m_occupancy_pct, trailing_12m_adr_cents]
    output: Hotel
    side_effects:
      - "overwrites trailing_12m_occupancy_pct and trailing_12m_adr_cents"
      - "does NOT restate any already-accrued Redemption.estimated_reimbursement_cents"
      - "increments Hotel.version by 1"

  - method: POST
    path: "/loyalty/hotels/{hotelId}/terminate"
    description: "Exits a property from the program, unwinding every obligation that has not yet been paid."
    roles: [ProgramAdministrator]
    code: 200
    input: [termination_reason]
    output: Hotel
    side_effects:
      - "status ACTIVE or FEE_DELINQUENT -> TERMINATED"
      - "every OBLIGATED EliteBenefitDelivery on a Stay of this hotel moves to WAIVED"
      - "every HELD or CONFIRMED Redemption of this hotel moves to CANCELLED and its points are refunded by a REVERSAL PointLedgerEntry"
      - "every Redemption of this hotel with reimbursement_status ACCRUED or BATCHED moves to VOIDED"
      - "every OPEN or RELEASED ReimbursementBatch of this hotel moves to REJECTED"
      - "re-runs point_liability_valuation and re-derives ProgramFund.status"
      - "increments Hotel.version by 1"

  # --- rate plans ------------------------------------------------------------
  - method: POST
    path: "/loyalty/hotels/{hotelId}/rate-plans"
    description: "Registers a rate plan at the property; the earn rate and the three eligibility flags are derived from rate_category by rate_plan_derivation and are never accepted from the request."
    roles: [ProgramAdministrator, HotelOwner]
    code: 201
    input: [rate_code, rate_category]
    output: RatePlan
    side_effects: ["runs rate_plan_derivation to set base_earn_rate_per_dollar, is_qualifying, counts_toward_elite and program_fee_eligible"]

  - method: GET
    path: "/loyalty/rate-plans/{ratePlanId}"
    description: "Reads one rate plan."
    roles: [ProgramAdministrator, ProgramAuditor, HotelOwner]
    code: 200
    input: []
    output: RatePlan
    side_effects: []

  - method: GET
    path: "/loyalty/rate-plans"
    description: "Lists rate plans, filterable by owning hotel and category."
    roles: [ProgramAdministrator, ProgramAuditor, HotelOwner]
    code: 200
    input: ["hotel_id?", "rate_category?", "limit?", "offset?"]
    output: RatePlan[]
    side_effects: []

  # --- redemption pricing ----------------------------------------------------
  - method: POST
    path: "/loyalty/hotels/{hotelId}/redemption-pricing"
    description: "Publishes a standard- or peak-season award price window for the property, together with the tier gate and the nightly award allotment that govern inventory access."
    roles: [ProgramAdministrator]
    code: 201
    input: [season, window_start_date, window_end_date, points_per_night, cash_copay_cents, min_tier_required, award_allotment_per_night]
    output: RedemptionPricing
    side_effects: []

  - method: GET
    path: "/loyalty/redemption-pricing/{pricingId}"
    description: "Reads one award price window."
    roles: [ProgramAdministrator, ProgramAuditor, HotelOwner, Member, MemberCareAgent]
    code: 200
    input: []
    output: RedemptionPricing
    side_effects: []

  - method: GET
    path: "/loyalty/redemption-pricing"
    description: "Lists award price windows, filterable by owning hotel and season."
    roles: [ProgramAdministrator, ProgramAuditor, HotelOwner, Member, MemberCareAgent]
    code: 200
    input: ["hotel_id?", "season?", "limit?", "offset?"]
    output: RedemptionPricing[]
    side_effects: []

  # --- blackout windows ------------------------------------------------------
  - method: POST
    path: "/loyalty/hotels/{hotelId}/blackout-windows"
    description: "Drafts a blackout window at the property. A DRAFT window neither blocks redemptions nor consumes the annual blackout allowance."
    roles: [ProgramAdministrator, HotelOwner]
    code: 201
    input: [start_date, end_date, scope]
    output: BlackoutWindow
    side_effects: ["status initialised to DRAFT", "day_count computed inclusively as (end_date - start_date) + 1 days"]

  - method: POST
    path: "/loyalty/blackout-windows/{windowId}/activate"
    description: "Activates a drafted blackout window after the 7-clear-day buffer check and the 60-day annual cap check."
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: BlackoutWindow
    side_effects:
      - "status DRAFT -> ACTIVE"
      - "runs blackout_conflict_check"
      - "adds day_count to Hotel.blackout_days_used_current_year"
      - "increments BlackoutWindow.version by 1"

  - method: POST
    path: "/loyalty/blackout-windows/{windowId}/revoke"
    description: "Withdraws an active blackout window and returns its days to the property's annual allowance."
    roles: [ProgramAdministrator]
    code: 200
    input: [revoke_reason]
    output: BlackoutWindow
    side_effects:
      - "status ACTIVE -> REVOKED"
      - "subtracts day_count from Hotel.blackout_days_used_current_year"
      - "increments BlackoutWindow.version by 1"

  - method: GET
    path: "/loyalty/blackout-windows/{windowId}"
    description: "Reads one blackout window."
    roles: [ProgramAdministrator, ProgramAuditor, HotelOwner, Member, MemberCareAgent]
    code: 200
    input: []
    output: BlackoutWindow
    side_effects: []

  - method: GET
    path: "/loyalty/blackout-windows"
    description: "Lists blackout windows, filterable by owning hotel and status."
    roles: [ProgramAdministrator, ProgramAuditor, HotelOwner, Member, MemberCareAgent]
    code: 200
    input: ["hotel_id?", "status?", "limit?", "offset?"]
    output: BlackoutWindow[]
    side_effects: []

  # --- members ---------------------------------------------------------------
  - method: POST
    path: "/loyalty/members"
    description: "Enrolls a loyalty member at BASE tier with a zero point balance."
    roles: [ProgramAdministrator, MemberCareAgent]
    code: 201
    input: [email, full_name, "enrollment_date?"]
    output: Member
    side_effects:
      - "elite_tier initialised to BASE"
      - "qualifying_nights_ytd, qualifying_revenue_cents_ytd, point_balance, lifetime_points_earned and points_purchased_current_year initialised to 0"
      - "enrollment_date defaults to the logical clock's current date when omitted"

  - method: GET
    path: "/loyalty/members/{memberId}"
    description: "Reads one member including elite tier, point balance and current version for optimistic-concurrency use."
    roles: [ProgramAdministrator, ProgramAuditor, MemberCareAgent, Member]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: GET
    path: "/loyalty/members"
    description: "Lists members with optional tier and email filters."
    roles: [ProgramAdministrator, ProgramAuditor, MemberCareAgent]
    code: 200
    input: ["elite_tier?", "email?", "limit?", "offset?"]
    output: Member[]
    side_effects: []

  - method: POST
    path: "/loyalty/point-adjustments"
    description: "Records a goodwill point grant or clawback against a member's balance as an explicit ledger entry. Guarded by optimistic concurrency on the member's version."
    roles: [ProgramAdministrator, MemberCareAgent]
    code: 201
    input: [member_id, points, adjustment_reason, expected_member_version]
    output: PointLedgerEntry
    side_effects:
      - "writes a GOODWILL PointLedgerEntry with the signed points value"
      - "adds points to Member.point_balance"
      - "increments Member.version by 1"
      - "re-runs point_liability_valuation and re-derives ProgramFund.status"

  # --- stays -----------------------------------------------------------------
  - method: POST
    path: "/loyalty/stays"
    description: "Records a completed or in-progress paid stay in PENDING_POSTING status, snapshotting the member's tier at arrival."
    roles: [ProgramAdministrator, HotelOwner]
    code: 201
    input: [member_id, hotel_id, rate_plan_id, checkin_date, checkout_date, room_revenue_cents, "incidental_revenue_cents?"]
    output: Stay
    side_effects:
      - "nights computed as (checkout_date - checkin_date) in days"
      - "tier_at_checkin snapshotted from Member.elite_tier"
      - "status initialised to PENDING_POSTING; base_points_awarded, bonus_points_awarded, program_fee_assessed_cents and bonus_multiplier_applied initialised to 0"
      - "incidental_revenue_cents defaults to 0"

  - method: POST
    path: "/loyalty/stays/{stayId}/post"
    description: "Posts the stay to the member's account, awarding points, assessing the program fee, re-deriving the member's tier and synthesizing the property's elite-benefit obligations."
    roles: [ProgramAdministrator, HotelOwner]
    code: 200
    input: []
    output: Stay
    side_effects:
      - "status PENDING_POSTING -> POSTED_QUALIFYING when the rate plan is qualifying, otherwise -> POSTED_NON_QUALIFYING"
      - "runs stay_base_points and writes an EARN_BASE PointLedgerEntry (qualifying arm only)"
      - "runs stay_elite_bonus_points under the provisional_tier_at_checkin variant and writes an EARN_BONUS PointLedgerEntry (qualifying arm only)"
      - "adds both awards to Member.point_balance and Member.lifetime_points_earned"
      - "runs program_fee_assessment and updates Hotel.fee_ledger_balance_cents"
      - "runs elite_tier_recompute on the member (qualifying arm only)"
      - "runs benefit_entitlement_matrix and creates one OBLIGATED EliteBenefitDelivery per entitled benefit type (qualifying arm only)"
      - "moves Hotel.status ACTIVE -> FEE_DELINQUENT when fee_ledger_balance_cents exceeds 250000"
      - "re-runs point_liability_valuation and re-derives ProgramFund.status"

  - method: POST
    path: "/loyalty/stays/{stayId}/dispute"
    description: "Opens a member dispute on a posted stay, freezing its earnings until an adjustment is made."
    roles: [Member, MemberCareAgent, ProgramAdministrator]
    code: 200
    input: [dispute_reason]
    output: Stay
    side_effects:
      - "status POSTED_QUALIFYING or POSTED_NON_QUALIFYING -> DISPUTED"
      - "re-runs elite_tier_recompute on the member, which may lower the tier because DISPUTED nights no longer count"
      - "increments Stay.version by 1"

  - method: POST
    path: "/loyalty/stays/{stayId}/adjust"
    description: "Settles a disputed stay, optionally restating its room revenue, and recomputes the award under the final_tier_at_adjustment variant."
    roles: [ProgramAdministrator]
    code: 200
    input: ["room_revenue_cents?"]
    output: Stay
    side_effects:
      - "status DISPUTED -> ADJUSTED"
      - "overwrites room_revenue_cents when supplied"
      - "re-runs stay_base_points and writes the base delta as an additional EARN_BASE PointLedgerEntry"
      - "runs stay_elite_bonus_points under the final_tier_at_adjustment variant and writes the bonus delta as an additional EARN_BONUS PointLedgerEntry"
      - "re-runs program_fee_assessment and updates Hotel.fee_ledger_balance_cents"
      - "re-runs point_liability_valuation and re-derives ProgramFund.status"

  - method: POST
    path: "/loyalty/stays/{stayId}/void"
    description: "Voids a stay and compensates every consequence it caused: points, fee, tier and outstanding benefit obligations."
    roles: [ProgramAdministrator]
    code: 200
    input: [void_reason]
    output: Stay
    side_effects:
      - "status -> VOID from any non-VOID status"
      - "writes one REVERSAL PointLedgerEntry per EARN_BASE and EARN_BONUS entry sourced from this stay, each carrying the negated points and reversal_of_entry_id"
      - "subtracts the reversed points from Member.point_balance and Member.lifetime_points_earned"
      - "sets program_fee_assessed_cents to 0 and re-runs program_fee_assessment, lowering Hotel.fee_ledger_balance_cents"
      - "re-runs elite_tier_recompute, which may lower Member.elite_tier"
      - "moves every OBLIGATED EliteBenefitDelivery of this stay to WAIVED, and additionally waives the member's OBLIGATED deliveries whose benefit_type is no longer entitled at the recomputed tier"
      - "re-runs point_liability_valuation and re-derives ProgramFund.status"

  - method: GET
    path: "/loyalty/stays/{stayId}"
    description: "Reads one stay including its awarded points, applied multiplier and assessed fee."
    roles: [ProgramAdministrator, ProgramAuditor, HotelOwner, Member, MemberCareAgent]
    code: 200
    input: []
    output: Stay
    side_effects: []

  - method: GET
    path: "/loyalty/stays"
    description: "Lists stays, filterable by member, hotel, rate plan and status."
    roles: [ProgramAdministrator, ProgramAuditor, HotelOwner, Member, MemberCareAgent]
    code: 200
    input: ["member_id?", "hotel_id?", "rate_plan_id?", "status?", "limit?", "offset?"]
    output: Stay[]
    side_effects: []

  # --- elite benefit deliveries ---------------------------------------------
  - method: GET
    path: "/loyalty/elite-benefit-deliveries/{deliveryId}"
    description: "Reads one elite-benefit obligation, including the cost recovery credited to the property once delivered. Deliveries are synthesized by the stay-posting cascade, so this read is their only discovery channel besides the filtered list."
    roles: [ProgramAdministrator, ProgramAuditor, HotelOwner, Member, MemberCareAgent]
    code: 200
    input: []
    output: EliteBenefitDelivery
    side_effects: []

  - method: GET
    path: "/loyalty/elite-benefit-deliveries"
    description: "Lists elite-benefit obligations, filterable by originating stay, status and benefit type."
    roles: [ProgramAdministrator, ProgramAuditor, HotelOwner, Member, MemberCareAgent]
    code: 200
    input: ["stay_id?", "status?", "benefit_type?", "limit?", "offset?"]
    output: EliteBenefitDelivery[]
    side_effects: []

  - method: POST
    path: "/loyalty/elite-benefit-deliveries/{deliveryId}/deliver"
    description: "Records that the property honoured the benefit and credits it the cost recovery."
    roles: [ProgramAdministrator, HotelOwner]
    code: 200
    input: []
    output: EliteBenefitDelivery
    side_effects:
      - "status OBLIGATED -> DELIVERED"
      - "runs benefit_cost_recovery to set cost_recovery_cents"
      - "adds cost_recovery_cents to Hotel.benefit_recovery_owed_cents"
      - "increments EliteBenefitDelivery.version by 1"

  - method: POST
    path: "/loyalty/elite-benefit-deliveries/{deliveryId}/deny"
    description: "Records that the property refused the benefit, which counts against the property and opens the member's escalation path."
    roles: [ProgramAdministrator, HotelOwner]
    code: 200
    input: [denial_reason]
    output: EliteBenefitDelivery
    side_effects:
      - "status OBLIGATED -> DENIED"
      - "cost_recovery_cents stays 0"
      - "increments Hotel.benefit_denial_count by 1"
      - "increments EliteBenefitDelivery.version by 1"

  # --- redemptions -----------------------------------------------------------
  - method: POST
    path: "/loyalty/redemptions"
    description: "Books an award stay. Selects the governing price window, prices the award in points, debits the member, and holds the nightly award inventory. Guarded by optimistic concurrency on the property's version because the property's status, fee posture and inventory all bear on the price and the accept/reject decision."
    roles: [ProgramAdministrator, MemberCareAgent, Member]
    code: 201
    input: [member_id, hotel_id, checkin_date, checkout_date, expected_hotel_version]
    output: Redemption
    side_effects:
      - "nights computed as (checkout_date - checkin_date) in days"
      - "runs redemption_pricing_selection to set season, points_per_night_applied, award_allotment_applied and cash_copay_cents"
      - "runs redemption_points_price to set points_charged"
      - "writes a REDEEM PointLedgerEntry carrying the negated points_charged and subtracts it from Member.point_balance"
      - "fulfillment_status initialised to HELD and reimbursement_status to NOT_DUE"
      - "increments Hotel.version by 1"
      - "re-runs point_liability_valuation and re-derives ProgramFund.status"

  - method: POST
    path: "/loyalty/redemptions/{redemptionId}/confirm"
    description: "Confirms the held award booking."
    roles: [ProgramAdministrator, MemberCareAgent, Member]
    code: 200
    input: []
    output: Redemption
    side_effects: ["fulfillment_status HELD -> CONFIRMED", "increments Redemption.version by 1"]

  - method: POST
    path: "/loyalty/redemptions/{redemptionId}/complete-stay"
    description: "Records that the member actually stayed on the award booking, which accrues the owner reimbursement under the accrual_estimate variant."
    roles: [ProgramAdministrator, HotelOwner]
    code: 200
    input: []
    output: Redemption
    side_effects:
      - "fulfillment_status CONFIRMED -> STAYED"
      - "reimbursement_status NOT_DUE -> ACCRUED"
      - "runs owner_reimbursement under the accrual_estimate variant to set estimated_reimbursement_cents"
      - "adds estimated_reimbursement_cents to Hotel.reimbursement_owed_cents"
      - "increments Redemption.version by 1"

  - method: POST
    path: "/loyalty/redemptions/{redemptionId}/no-show"
    description: "Records that the member never arrived. The points stay spent and no reimbursement is ever owed, so the award night is released back to inventory without any compensating ledger entry."
    roles: [ProgramAdministrator, HotelOwner]
    code: 200
    input: []
    output: Redemption
    side_effects:
      - "fulfillment_status CONFIRMED -> NO_SHOW"
      - "reimbursement_status stays NOT_DUE"
      - "the booking's nights stop occupying award inventory"
      - "increments Redemption.version by 1"

  - method: POST
    path: "/loyalty/redemptions/{redemptionId}/cancel"
    description: "Cancels a held or confirmed award booking and refunds exactly the points that were charged."
    roles: [ProgramAdministrator, MemberCareAgent, Member]
    code: 200
    input: [cancel_reason]
    output: Redemption
    side_effects:
      - "fulfillment_status HELD or CONFIRMED -> CANCELLED"
      - "writes a REVERSAL PointLedgerEntry carrying +points_charged and reversal_of_entry_id pointing at the REDEEM entry"
      - "adds points_charged back to Member.point_balance"
      - "the booking's nights stop occupying award inventory"
      - "increments Redemption.version by 1"
      - "re-runs point_liability_valuation and re-derives ProgramFund.status"

  - method: GET
    path: "/loyalty/redemptions/{redemptionId}"
    description: "Reads one award booking including its two independent status dimensions and both reimbursement figures."
    roles: [ProgramAdministrator, ProgramAuditor, HotelOwner, Member, MemberCareAgent]
    code: 200
    input: []
    output: Redemption
    side_effects: []

  - method: GET
    path: "/loyalty/redemptions"
    description: "Lists award bookings, filterable by member, hotel, attached batch and either status dimension."
    roles: [ProgramAdministrator, ProgramAuditor, HotelOwner, Member, MemberCareAgent]
    code: 200
    input: ["member_id?", "hotel_id?", "batch_id?", "fulfillment_status?", "reimbursement_status?", "limit?", "offset?"]
    output: Redemption[]
    side_effects: []

  # --- reimbursement batches -------------------------------------------------
  - method: POST
    path: "/loyalty/reimbursement-batches"
    description: "Opens a monthly reimbursement batch for one property. Nothing is selected or priced until the batch is released."
    roles: [ProgramAdministrator, HotelOwner]
    code: 201
    input: [hotel_id, period_month]
    output: ReimbursementBatch
    side_effects:
      - "status initialised to OPEN"
      - "item_count, gross_reimbursement_cents, fee_offset_base_cents, delinquency_surcharge_cents, total_fee_offset_cents and net_payable_cents initialised to 0"

  - method: POST
    path: "/loyalty/reimbursement-batches/{batchId}/release"
    description: "Selects the period's accrued award stays, snapshots the property's occupancy and ADR, settles every item under the settlement_actual variant, and computes the net payable after the fee offset and any delinquency surcharge."
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: ReimbursementBatch
    side_effects:
      - "status OPEN -> RELEASED"
      - "snapshots occupancy_pct_at_release and adr_cents_at_release from the hotel"
      - "runs batch_item_selection and sets item_count"
      - "attaches each selected Redemption by setting its batch_id and moving reimbursement_status ACCRUED -> BATCHED"
      - "runs owner_reimbursement under the settlement_actual variant per item to set settled_reimbursement_cents"
      - "runs batch_net_payable to set gross_reimbursement_cents, fee_offset_base_cents, delinquency_surcharge_cents, total_fee_offset_cents and net_payable_cents"
      - "records released_by_user_id from the X-User-ID header"
      - "increments ReimbursementBatch.version by 1"

  - method: POST
    path: "/loyalty/reimbursement-batches/{batchId}/approve"
    description: "Approves a released batch for disbursement. Must be performed by an operator other than the one who released it."
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: ReimbursementBatch
    side_effects:
      - "status RELEASED -> APPROVED"
      - "records approved_by_user_id from the X-User-ID header"
      - "increments ReimbursementBatch.version by 1"

  - method: POST
    path: "/loyalty/reimbursement-batches/{batchId}/reject"
    description: "Rejects a released batch, returning its items to the accrued pool so a later batch can pick them up."
    roles: [ProgramAdministrator]
    code: 200
    input: [rejection_reason]
    output: ReimbursementBatch
    side_effects:
      - "status RELEASED -> REJECTED"
      - "every attached Redemption moves reimbursement_status BATCHED -> ACCRUED, clears batch_id and clears settled_reimbursement_cents to 0"
      - "resets item_count, gross_reimbursement_cents, fee_offset_base_cents, delinquency_surcharge_cents, total_fee_offset_cents and net_payable_cents to 0"
      - "increments ReimbursementBatch.version by 1"

  - method: POST
    path: "/loyalty/reimbursement-batches/{batchId}/pay"
    description: "Disburses the approved batch: moves program cash, clears the offset portion of the property's fee ledger, and restores a delinquent property to good standing. Must be performed by an operator other than the releaser and the approver."
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: ReimbursementBatch
    side_effects:
      - "status APPROVED -> PAID"
      - "subtracts net_payable_cents from ProgramFund.cash_balance_cents (a negative net_payable_cents therefore increases program cash)"
      - "subtracts total_fee_offset_cents from Hotel.fee_ledger_balance_cents"
      - "subtracts gross_reimbursement_cents from Hotel.reimbursement_owed_cents"
      - "every attached Redemption moves reimbursement_status BATCHED -> PAID"
      - "moves Hotel.status FEE_DELINQUENT -> ACTIVE when the remaining fee_ledger_balance_cents is at or below 250000"
      - "re-runs point_liability_valuation and re-derives ProgramFund.status"
      - "increments ReimbursementBatch.version by 1"

  - method: GET
    path: "/loyalty/reimbursement-batches/{batchId}"
    description: "Reads one reimbursement batch including every intermediate figure of the net-payable waterfall."
    roles: [ProgramAdministrator, ProgramAuditor, HotelOwner]
    code: 200
    input: []
    output: ReimbursementBatch
    side_effects: []

  - method: GET
    path: "/loyalty/reimbursement-batches"
    description: "Lists reimbursement batches, filterable by property, period and status."
    roles: [ProgramAdministrator, ProgramAuditor, HotelOwner]
    code: 200
    input: ["hotel_id?", "period_month?", "status?", "limit?", "offset?"]
    output: ReimbursementBatch[]
    side_effects: []

  # --- point ledger ----------------------------------------------------------
  - method: GET
    path: "/loyalty/point-ledger-entries/{entryId}"
    description: "Reads one point ledger entry. Entries are written by cascades (posting, redemption, reversal), so this read and the filtered list are their only discovery channels."
    roles: [ProgramAdministrator, ProgramAuditor, MemberCareAgent, Member]
    code: 200
    input: []
    output: PointLedgerEntry
    side_effects: []

  - method: GET
    path: "/loyalty/point-ledger-entries"
    description: "Lists point ledger entries, filterable by member, by any of the three source documents, by the entry a reversal compensates, and by entry type."
    roles: [ProgramAdministrator, ProgramAuditor, MemberCareAgent, Member]
    code: 200
    input: ["member_id?", "source_stay_id?", "source_redemption_id?", "source_purchase_id?", "reversal_of_entry_id?", "entry_type?", "limit?", "offset?"]
    output: PointLedgerEntry[]
    side_effects: []

  # --- partners and point sales ---------------------------------------------
  - method: POST
    path: "/loyalty/partners"
    description: "Registers a point-sale partner with its wholesale price per thousand points and its monthly volume cap."
    roles: [ProgramAdministrator]
    code: 201
    input: [name, partner_type, points_cost_per_1000_cents, monthly_cap_points]
    output: Partner
    side_effects: ["purchased_points_mtd initialised to 0"]

  - method: GET
    path: "/loyalty/partners/{partnerId}"
    description: "Reads one point-sale partner."
    roles: [ProgramAdministrator, ProgramAuditor]
    code: 200
    input: []
    output: Partner
    side_effects: []

  - method: GET
    path: "/loyalty/partners"
    description: "Lists point-sale partners."
    roles: [ProgramAdministrator, ProgramAuditor]
    code: 200
    input: ["partner_type?", "limit?", "offset?"]
    output: Partner[]
    side_effects: []

  - method: POST
    path: "/loyalty/point-purchases"
    description: "Records a co-brand card point purchase, a direct member purchase, or a wholesale partner point sale, priced by the volume-tier schedule."
    roles: [ProgramAdministrator, MemberCareAgent, Member]
    code: 201
    input: [member_id, channel, points_quantity, "partner_id?"]
    output: PointPurchase
    side_effects:
      - "runs point_purchase_pricing to set volume_discount_pct, cash_due_cents and bonus_points"
      - "status initialised to PENDING; no points are credited and no cash moves yet"
      - "adds points_quantity to Partner.purchased_points_mtd when channel == PARTNER_SALE"
      - "adds points_quantity to Member.points_purchased_current_year"

  - method: POST
    path: "/loyalty/point-purchases/{purchaseId}/settle"
    description: "Settles a pending purchase: cash enters the program fund and the points enter the member's balance."
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: PointPurchase
    side_effects:
      - "status PENDING -> SETTLED"
      - "writes a PURCHASE PointLedgerEntry for points_quantity, plus a second PURCHASE entry for bonus_points when bonus_points is greater than 0, for the CO_BRAND_CARD and DIRECT_PURCHASE channels; writes a PARTNER_SALE PointLedgerEntry for points_quantity when channel == PARTNER_SALE"
      - "adds points_quantity plus bonus_points to Member.point_balance"
      - "adds cash_due_cents to ProgramFund.cash_balance_cents"
      - "re-runs point_liability_valuation and re-derives ProgramFund.status"
      - "increments PointPurchase.version by 1"

  - method: POST
    path: "/loyalty/point-purchases/{purchaseId}/refund"
    description: "Refunds a settled purchase, compensating every consequence of settlement so both conserved quantities return to their pre-purchase relationship."
    roles: [ProgramAdministrator, MemberCareAgent]
    code: 200
    input: [refund_reason]
    output: PointPurchase
    side_effects:
      - "status SETTLED -> REFUNDED"
      - "writes one REVERSAL PointLedgerEntry per entry sourced from this purchase, each carrying the negated points and reversal_of_entry_id"
      - "subtracts points_quantity plus bonus_points from Member.point_balance"
      - "subtracts cash_due_cents from ProgramFund.cash_balance_cents"
      - "subtracts points_quantity from Partner.purchased_points_mtd when channel == PARTNER_SALE, and from Member.points_purchased_current_year"
      - "re-runs point_liability_valuation and re-derives ProgramFund.status"
      - "increments PointPurchase.version by 1"

  - method: GET
    path: "/loyalty/point-purchases/{purchaseId}"
    description: "Reads one point purchase including its derived price and bonus."
    roles: [ProgramAdministrator, ProgramAuditor, MemberCareAgent, Member]
    code: 200
    input: []
    output: PointPurchase
    side_effects: []

  - method: GET
    path: "/loyalty/point-purchases"
    description: "Lists point purchases, filterable by member, partner, channel and status."
    roles: [ProgramAdministrator, ProgramAuditor, MemberCareAgent, Member]
    code: 200
    input: ["member_id?", "partner_id?", "channel?", "status?", "limit?", "offset?"]
    output: PointPurchase[]
    side_effects: []

  # --- program fund ----------------------------------------------------------
  - method: GET
    path: "/loyalty/program-fund"
    description: "Reads the singleton program fund: cash on hand, outstanding points, the breakage assumption, the resulting point liability, the solvency ratio and the derived posture. The row exists from server start with cash_balance_cents 0, breakage_rate_pct 0.20 and status HEALTHY."
    roles: [ProgramAdministrator, ProgramAuditor]
    code: 200
    input: []
    output: ProgramFund
    side_effects: []

  - method: POST
    path: "/loyalty/program-fund/revalue"
    description: "Re-runs the liability valuation and the solvency posture derivation without any other business change."
    roles: [ProgramAdministrator, ProgramAuditor]
    code: 200
    input: []
    output: ProgramFund
    side_effects:
      - "runs point_liability_valuation to set outstanding_points, point_liability_cents and solvency_ratio"
      - "re-derives status across HEALTHY, WATCH and IMPAIRED"
      - "sets last_revalued_at to the logical clock's current instant"
      - "increments ProgramFund.version by 1"

  - method: POST
    path: "/loyalty/program-fund/breakage-rate"
    description: "Restates the breakage assumption used to value outstanding points, then immediately revalues."
    roles: [ProgramAdministrator]
    code: 200
    input: [breakage_rate_pct]
    output: ProgramFund
    side_effects:
      - "overwrites breakage_rate_pct"
      - "runs point_liability_valuation and re-derives status"
      - "increments ProgramFund.version by 1"

  # --- member complaints -----------------------------------------------------
  - method: POST
    path: "/loyalty/member-complaints"
    description: "Files a member complaint, optionally attached to a specific benefit denial."
    roles: [Member, MemberCareAgent, ProgramAdministrator]
    code: 201
    input: [member_id, subject_type, description, "related_delivery_id?"]
    output: MemberComplaint
    side_effects: ["status initialised to OPEN", "info_request_count and goodwill_points_granted initialised to 0"]

  - method: POST
    path: "/loyalty/member-complaints/{complaintId}/review"
    description: "Takes the complaint under review."
    roles: [MemberCareAgent, ProgramAdministrator]
    code: 200
    input: []
    output: MemberComplaint
    side_effects: ["status OPEN -> UNDER_REVIEW", "increments MemberComplaint.version by 1"]

  - method: POST
    path: "/loyalty/member-complaints/{complaintId}/request-info"
    description: "Sends the complaint back to the member for more information. Permitted at most twice per complaint. MemberCareAgent only - the program administrator adjudicates, it does not run the care queue."
    roles: [MemberCareAgent]
    code: 200
    input: []
    output: MemberComplaint
    side_effects:
      - "status UNDER_REVIEW -> INFO_REQUESTED"
      - "increments info_request_count by 1"
      - "increments MemberComplaint.version by 1"

  - method: POST
    path: "/loyalty/member-complaints/{complaintId}/provide-info"
    description: "Returns the member's additional information and puts the complaint back under review."
    roles: [Member, MemberCareAgent]
    code: 200
    input: ["description?"]
    output: MemberComplaint
    side_effects:
      - "status INFO_REQUESTED -> UNDER_REVIEW"
      - "overwrites description when supplied"
      - "increments MemberComplaint.version by 1"

  - method: POST
    path: "/loyalty/member-complaints/{complaintId}/resolve"
    description: "Closes out the review, either with a goodwill point grant or by upholding the program's position."
    roles: [MemberCareAgent, ProgramAdministrator]
    code: 200
    input: [resolution, "goodwill_points?"]
    output: MemberComplaint
    side_effects:
      - "status UNDER_REVIEW -> RESOLVED_GOODWILL when goodwill_points is greater than 0, otherwise -> RESOLVED_UPHELD"
      - "records goodwill_points_granted and writes a GOODWILL PointLedgerEntry crediting the member (goodwill arm only)"
      - "adds goodwill_points_granted to Member.point_balance (goodwill arm only)"
      - "re-runs point_liability_valuation and re-derives ProgramFund.status"
      - "increments MemberComplaint.version by 1"

  - method: POST
    path: "/loyalty/member-complaints/{complaintId}/escalate"
    description: "Escalates an upheld complaint to program adjudication, which also moves the disputed benefit denial into ESCALATED."
    roles: [Member, MemberCareAgent]
    code: 200
    input: []
    output: MemberComplaint
    side_effects:
      - "status RESOLVED_UPHELD -> ESCALATED"
      - "the delivery named by related_delivery_id moves DENIED -> ESCALATED (BENEFIT_DENIAL complaints only)"
      - "increments MemberComplaint.version by 1"

  - method: POST
    path: "/loyalty/member-complaints/{complaintId}/adjudicate"
    description: "Program adjudication of an escalated complaint: either orders the benefit delivered at the property's cost or upholds the denial for good."
    roles: [ProgramAdministrator]
    code: 200
    input: [adjudication_outcome]
    output: MemberComplaint
    side_effects:
      - "status ESCALATED -> CLOSED"
      - "records adjudication_outcome"
      - "when adjudication_outcome == DELIVERY_ORDERED the delivery moves ESCALATED -> DELIVERED, benefit_cost_recovery runs, and Hotel.benefit_recovery_owed_cents increases"
      - "when adjudication_outcome == DENIAL_UPHELD the delivery moves ESCALATED -> DENIED_FINAL and no cost recovery is credited"
      - "increments MemberComplaint.version by 1"

  - method: GET
    path: "/loyalty/member-complaints/{complaintId}"
    description: "Reads one member complaint."
    roles: [ProgramAdministrator, ProgramAuditor, MemberCareAgent, Member]
    code: 200
    input: []
    output: MemberComplaint
    side_effects: []

  - method: GET
    path: "/loyalty/member-complaints"
    description: "Lists member complaints, filterable by member, by the benefit denial they contest, by status and by subject type."
    roles: [ProgramAdministrator, ProgramAuditor, MemberCareAgent, Member]
    code: 200
    input: ["member_id?", "related_delivery_id?", "status?", "subject_type?", "limit?", "offset?"]
    output: MemberComplaint[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- authentication / authorization ---------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the five declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed for the target endpoint"
  - id: ERR_FORBIDDEN_RESOURCE_OWNER
    http: 403
    condition: "a HotelOwner acts on a property other than the one its X-User-ID names, or a Member acts on another member's stay, redemption, purchase or complaint"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the X-User-ID approving or rejecting a reimbursement batch equals batch.released_by_user_id"
  - id: ERR_PAYER_CONFLICT
    http: 403
    condition: "the X-User-ID paying a reimbursement batch equals batch.released_by_user_id or batch.approved_by_user_id"

  # --- existence -------------------------------------------------------------
  - id: ERR_HOTEL_NOT_FOUND
    http: 404
    condition: "no Hotel matches the hotelId path segment or the hotel_id body field"
  - id: ERR_RATE_PLAN_NOT_FOUND
    http: 404
    condition: "no RatePlan matches the ratePlanId path segment or the rate_plan_id body field"
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "no Member matches the memberId path segment or the member_id body field"
  - id: ERR_STAY_NOT_FOUND
    http: 404
    condition: "no Stay matches the stayId path segment"
  - id: ERR_REDEMPTION_NOT_FOUND
    http: 404
    condition: "no Redemption matches the redemptionId path segment"
  - id: ERR_DELIVERY_NOT_FOUND
    http: 404
    condition: "no EliteBenefitDelivery matches the deliveryId path segment or the related_delivery_id body field"
  - id: ERR_BATCH_NOT_FOUND
    http: 404
    condition: "no ReimbursementBatch matches the batchId path segment"
  - id: ERR_BLACKOUT_WINDOW_NOT_FOUND
    http: 404
    condition: "no BlackoutWindow matches the windowId path segment"
  - id: ERR_PARTNER_NOT_FOUND
    http: 404
    condition: "no Partner matches the partnerId path segment or the partner_id body field"
  - id: ERR_PURCHASE_NOT_FOUND
    http: 404
    condition: "no PointPurchase matches the purchaseId path segment"
  - id: ERR_COMPLAINT_NOT_FOUND
    http: 404
    condition: "no MemberComplaint matches the complaintId path segment"
  - id: ERR_PRICING_ROW_NOT_FOUND
    http: 404
    condition: "no RedemptionPricing matches the pricingId path segment"

  # --- request shape ---------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required input field is absent, has the wrong type, or carries a value outside its declared enum set"
  - id: ERR_INVALID_DATE_RANGE
    http: 422
    condition: "checkout_date is on or before checkin_date, or a window's end date precedes its start date"
  - id: ERR_AMOUNT_OUT_OF_RANGE
    http: 422
    condition: "a revenue field is negative, points_quantity is below 1, program_fee_pct is outside [0, 1], or a goodwill adjustment's points is 0"

  # --- cross-reference integrity --------------------------------------------
  - id: ERR_RATE_PLAN_HOTEL_MISMATCH
    http: 422
    condition: "the rate plan named by a new stay belongs to a different hotel than the stay"
  - id: ERR_DELIVERY_MEMBER_MISMATCH
    http: 422
    condition: "a complaint's related_delivery_id names a delivery whose Stay belongs to a different member"
  - id: ERR_PARTNER_CHANNEL_MISMATCH
    http: 422
    condition: "partner_id is absent for a PARTNER_SALE purchase, or present for a CO_BRAND_CARD or DIRECT_PURCHASE purchase"
  - id: ERR_NO_REDEMPTION_PRICING
    http: 422
    condition: "no RedemptionPricing window of the target hotel covers the requested checkin_date, so no season can be assigned"

  # --- optimistic concurrency ------------------------------------------------
  - id: ERR_STALE_HOTEL_VERSION
    http: 412
    condition: "expected_hotel_version does not equal the target hotel's current version"
  - id: ERR_STALE_MEMBER_VERSION
    http: 412
    condition: "expected_member_version does not equal the target member's current version"

  # --- state preconditions ---------------------------------------------------
  - id: ERR_HOTEL_NOT_ACTIVE
    http: 409
    condition: "the property's status is ONBOARDING, FEE_DELINQUENT or TERMINATED where the operation requires ACTIVE"
  - id: ERR_HOTEL_ONBOARDING_INCOMPLETE
    http: 409
    condition: "activation attempted on a property that has no rate plan"
  - id: ERR_STAY_INVALID_STATE
    http: 409
    condition: "the stay's status does not admit the requested transition, or a benefit delivery is being recorded against a stay that is no longer POSTED_QUALIFYING"
  - id: ERR_DELIVERY_INVALID_STATE
    http: 409
    condition: "delivery or denial recorded against a delivery whose status is not OBLIGATED"
  - id: ERR_BATCH_INVALID_STATE
    http: 409
    condition: "the batch's status does not admit the requested transition (release needs OPEN, approve and reject need RELEASED, pay needs APPROVED)"
  - id: ERR_REDEMPTION_INVALID_STATE
    http: 409
    condition: "the redemption's fulfillment_status does not admit the requested transition (confirm needs HELD, complete-stay and no-show need CONFIRMED, cancel needs HELD or CONFIRMED)"
  - id: ERR_PURCHASE_INVALID_STATE
    http: 409
    condition: "settle attempted on a non-PENDING purchase, or refund attempted on a non-SETTLED purchase"
  - id: ERR_COMPLAINT_INVALID_STATE
    http: 409
    condition: "the complaint's status does not admit the requested transition, including any action on a terminal RESOLVED_GOODWILL or CLOSED complaint"
  - id: ERR_BLACKOUT_WINDOW_INVALID_STATE
    http: 409
    condition: "activate attempted on a non-DRAFT window, or revoke attempted on a non-ACTIVE window"

  # --- program safety / policy ----------------------------------------------
  - id: ERR_PEAK_INVENTORY_WITHHELD
    http: 409
    condition: "a redemption whose selected season is PEAK targets a property whose status is FEE_DELINQUENT"
  - id: ERR_INFO_REQUEST_LIMIT
    http: 409
    condition: "a third information request attempted on a complaint whose info_request_count already reads 2"
  - id: ERR_DELIVERY_NOT_DENIED
    http: 409
    condition: "escalation attempted on a BENEFIT_DENIAL complaint whose related delivery is not in status DENIED"
  - id: ERR_DELIVERY_NOT_ESCALATED
    http: 409
    condition: "adjudication attempted on a BENEFIT_DENIAL complaint whose related delivery is no longer in status ESCALATED, typically because the underlying stay was voided and the delivery was waived"
  - id: ERR_BENEFIT_DENIAL_LIMIT_EXCEEDED
    http: 409
    condition: "a fourth benefit denial attempted at a property whose benefit_denial_count already reads 3"

  # --- temporal --------------------------------------------------------------
  - id: ERR_BLACKOUT_DATE_UNAVAILABLE
    http: 422
    condition: "a night of the requested award stay falls inside an ACTIVE blackout window whose scope covers the selected season"
  - id: ERR_BLACKOUT_WINDOW_BUFFER_CONFLICT
    http: 409
    condition: "activating the window would leave fewer than 7 clear days between it and another ACTIVE window of the same property, including direct adjacency and any overlap"
  - id: ERR_MEMBER_REDEMPTION_OVERLAP
    http: 409
    condition: "the member already holds a HELD, CONFIRMED or STAYED redemption whose half-open date interval intersects the requested one"
  - id: ERR_STAY_NOT_COMPLETED
    http: 422
    condition: "posting attempted on a stay whose checkout_date is after the logical clock's current date"
  - id: ERR_REDEMPTION_NOT_ELAPSED
    http: 422
    condition: "complete-stay attempted on an award booking whose checkout_date is after the logical clock's current date"
  - id: ERR_REDEMPTION_NOT_ARRIVED
    http: 422
    condition: "no-show attempted on an award booking whose checkin_date is after the logical clock's current date"

  # --- constraint satisfaction ----------------------------------------------
  - id: ERR_AWARD_INVENTORY_UNAVAILABLE
    http: 409
    condition: "on at least one requested night the property's occupied award rooms already equal the selected pricing row's award_allotment_per_night"
  - id: ERR_TIER_BELOW_INVENTORY_MINIMUM
    http: 422
    condition: "the member's elite_tier ranks below the selected pricing row's min_tier_required"
  - id: ERR_BLACKOUT_ANNUAL_CAP_EXCEEDED
    http: 422
    condition: "activating the window would push the property's blackout_days_used_current_year above 60"
  - id: ERR_DUPLICATE_RATE_CODE
    http: 409
    condition: "the rate_code already exists at that property"
  - id: ERR_PRICING_WINDOW_OVERLAP
    http: 409
    condition: "the new price window overlaps an existing window of the same property and the same season"
  - id: ERR_DUPLICATE_BATCH_PERIOD
    http: 409
    condition: "an OPEN, RELEASED or APPROVED batch already exists for that property and period_month"
  - id: ERR_BATCH_NO_ELIGIBLE_ITEMS
    http: 422
    condition: "release attempted on a batch whose item selection is empty"
  - id: ERR_PARTNER_MONTHLY_CAP_EXCEEDED
    http: 422
    condition: "the partner sale would push partner.purchased_points_mtd above partner.monthly_cap_points"

  # --- fiscal ----------------------------------------------------------------
  - id: ERR_INSUFFICIENT_POINTS
    http: 402
    condition: "the member's point_balance is below the computed points_charged for the award booking"
  - id: ERR_PURCHASE_CAP_EXCEEDED
    http: 402
    condition: "the purchase would push the member's points_purchased_current_year above 200000"
  - id: ERR_FUND_INSUFFICIENT_CASH
    http: 402
    condition: "paying the batch would drive ProgramFund.cash_balance_cents below zero"
  - id: ERR_FUND_IMPAIRED
    http: 402
    condition: "a goodwill point grant attempted while ProgramFund.status is IMPAIRED"
  - id: ERR_FUND_IMPAIRED_PEAK_BLOCKED
    http: 402
    condition: "a PEAK-season redemption attempted while ProgramFund.status is IMPAIRED"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdministrator
    description: "Brand-side program operator. Owns the program's configuration (properties, award pricing, partners, breakage assumption) and every irreversible money or point movement."
    identity: "opaque"
    exclusive_operations:
      - "POST /loyalty/hotels"
      - "POST /loyalty/hotels/{hotelId}/activate"
      - "POST /loyalty/hotels/{hotelId}/terminate"
      - "POST /loyalty/hotels/{hotelId}/redemption-pricing"
      - "POST /loyalty/blackout-windows/{windowId}/activate"
      - "POST /loyalty/blackout-windows/{windowId}/revoke"
      - "POST /loyalty/stays/{stayId}/adjust"
      - "POST /loyalty/stays/{stayId}/void"
      - "POST /loyalty/reimbursement-batches/{batchId}/release"
      - "POST /loyalty/reimbursement-batches/{batchId}/approve"
      - "POST /loyalty/reimbursement-batches/{batchId}/reject"
      - "POST /loyalty/reimbursement-batches/{batchId}/pay"
      - "POST /loyalty/partners"
      - "POST /loyalty/point-purchases/{purchaseId}/settle"
      - "POST /loyalty/program-fund/breakage-rate"
      - "POST /loyalty/member-complaints/{complaintId}/adjudicate"
    shared_operations:
      - "POST /loyalty/hotels/{hotelId}/performance-refresh (with HotelOwner)"
      - "POST /loyalty/hotels/{hotelId}/rate-plans (with HotelOwner)"
      - "POST /loyalty/hotels/{hotelId}/blackout-windows (with HotelOwner)"
      - "POST /loyalty/stays and POST /loyalty/stays/{stayId}/post (with HotelOwner)"
      - "POST /loyalty/elite-benefit-deliveries/{deliveryId}/deliver and /deny (with HotelOwner)"
      - "POST /loyalty/redemptions, /confirm and /cancel (with Member and MemberCareAgent)"
      - "POST /loyalty/redemptions/{redemptionId}/complete-stay and /no-show (with HotelOwner)"
      - "POST /loyalty/reimbursement-batches (with HotelOwner)"
      - "POST /loyalty/members and POST /loyalty/point-adjustments (with MemberCareAgent)"
      - "POST /loyalty/point-purchases (with Member and MemberCareAgent)"
      - "POST /loyalty/point-purchases/{purchaseId}/refund (with MemberCareAgent)"
      - "POST /loyalty/stays/{stayId}/dispute, POST /loyalty/member-complaints and the review and resolve actions (with MemberCareAgent and Member)"
      - "GET /loyalty/program-fund and POST /loyalty/program-fund/revalue (with ProgramAuditor)"
      - "every GET listed in §1.5"
      - "POST /_clock/set_current_utc (with every role)"

  - name: HotelOwner
    description: "Franchisee or property operator. Acts only on its own property: posts paid stays, records or denies elite benefits, delivers award stays, and requests reimbursement."
    identity: "entity_backed:Hotel"
    exclusive_operations: []
    shared_operations:
      - "POST /loyalty/hotels/{hotelId}/rate-plans (with ProgramAdministrator)"
      - "POST /loyalty/hotels/{hotelId}/performance-refresh (with ProgramAdministrator)"
      - "POST /loyalty/hotels/{hotelId}/blackout-windows (with ProgramAdministrator)"
      - "POST /loyalty/stays and POST /loyalty/stays/{stayId}/post (with ProgramAdministrator)"
      - "POST /loyalty/elite-benefit-deliveries/{deliveryId}/deliver and /deny (with ProgramAdministrator)"
      - "POST /loyalty/redemptions/{redemptionId}/complete-stay and /no-show (with ProgramAdministrator)"
      - "POST /loyalty/reimbursement-batches (with ProgramAdministrator)"
      - "GET on its own hotel, rate plans, pricing, blackout windows, stays, deliveries, redemptions and batches"
      - "POST /_clock/set_current_utc (with every role)"
    note: "X-User-ID is a Hotel.id. Validation priority 3 rejects any request that reaches a different hotel_id with ERR_FORBIDDEN_RESOURCE_OWNER. A HotelOwner can never release, approve, reject or pay a batch - that is the segregation-of-duties boundary between the property that requests money and the program that disburses it."

  - name: Member
    description: "Loyalty member. Books and cancels award stays, buys points, disputes stays, files and escalates complaints."
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "POST /loyalty/member-complaints/{complaintId}/provide-info (with MemberCareAgent)"
      - "POST /loyalty/redemptions, /confirm and /cancel (with MemberCareAgent and ProgramAdministrator)"
      - "POST /loyalty/point-purchases (with MemberCareAgent and ProgramAdministrator)"
      - "POST /loyalty/stays/{stayId}/dispute (with MemberCareAgent and ProgramAdministrator)"
      - "POST /loyalty/member-complaints (with MemberCareAgent and ProgramAdministrator)"
      - "POST /loyalty/member-complaints/{complaintId}/escalate (with MemberCareAgent)"
      - "GET on its own member record, stays, redemptions, purchases, ledger entries and complaints"
      - "POST /_clock/set_current_utc (with every role)"
    note: "X-User-ID is a Member.id. Validation priority 3 rejects any request that reaches a different member_id with ERR_FORBIDDEN_RESOURCE_OWNER."

  - name: MemberCareAgent
    description: "Brand-side care operator. Enrolls members, transacts on their behalf, and runs the complaint workflow up to but not including program adjudication."
    identity: "opaque"
    exclusive_operations:
      - "POST /loyalty/member-complaints/{complaintId}/request-info"
    shared_operations:
      - "POST /loyalty/members and POST /loyalty/point-adjustments (with ProgramAdministrator)"
      - "POST /loyalty/redemptions, /confirm and /cancel (with Member and ProgramAdministrator)"
      - "POST /loyalty/point-purchases (with Member and ProgramAdministrator)"
      - "POST /loyalty/point-purchases/{purchaseId}/refund (with ProgramAdministrator)"
      - "POST /loyalty/stays/{stayId}/dispute (with Member and ProgramAdministrator)"
      - "POST /loyalty/member-complaints, /review and /resolve (with ProgramAdministrator)"
      - "POST /loyalty/member-complaints/{complaintId}/provide-info and /escalate (with Member)"
      - "GET on members, stays, redemptions, purchases, ledger entries, deliveries and complaints"
      - "POST /_clock/set_current_utc (with every role)"
    note: "Opaque operator id. A MemberCareAgent may grant goodwill points but may never settle a purchase, release a batch, or adjudicate an escalated complaint."

  - name: ProgramAuditor
    description: "Read-only assurance role over the program's books: point liability, breakage, fund solvency and every reimbursement figure. May force a revaluation but may change nothing else."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "GET /loyalty/program-fund and POST /loyalty/program-fund/revalue (with ProgramAdministrator)"
      - "every GET listed in §1.5"
      - "POST /_clock/set_current_utc (with every role)"
    note: "Opaque operator id. POST /loyalty/program-fund/revalue is the single non-GET action the auditor holds; it recomputes derived figures and writes no business state. Every other POST returns ERR_UNAUTHORIZED for this role."
