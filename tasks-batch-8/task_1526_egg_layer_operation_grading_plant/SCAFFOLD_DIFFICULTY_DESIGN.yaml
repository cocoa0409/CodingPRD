        distinguishing_aspect: |
          Depth-4 chain, trigger = record-result POSITIVE (different trigger from the sibling
          instance's disposition complete). Each link is caused by the previous one:
          POSITIVE -> (L1) Flock.quarantine_status QUARANTINED -> (L2) its non-terminal lots
          become HELD -> (L3) a contract whose ALLOCATED lot turned HELD (held_allocated_dozen
          > 0) auto-SUSPENDS -> (L4) that contract's DRAFT settlement auto-VOIDS. Plus L5/L6:
          a Recall (INITIATED) is auto-created and farm posture becomes SUSPENDED.
