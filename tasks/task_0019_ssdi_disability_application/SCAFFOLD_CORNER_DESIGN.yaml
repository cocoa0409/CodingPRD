scaffold_corner_design:

  # =========================================================================
  # Section: entities — required fields, defaults, parent relations
  # =========================================================================
  - section: entities
    instances:

      - name: create_claimant_missing_full_name_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Claimant.fields.full_name
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /ssdi/claimants without full_name → 400 ERR_INVALID_REQUEST; required input field omitted."
        test_recipe:
          setup:
            - "Empty DB, clock at 2026-01-15."
          setup_api_calls:
            - call: "POST /ssdi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: SSAAdmin
          trigger:
            - call: "POST /ssdi/claimants"
              payload: { ssn_last4: "0001", date_of_birth: "1980-01-01T00:00:00Z", filing_state: "TX" }
              as: SSAAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status_code == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_claimant_default_monthly_income_zero
        claim_type: defaults
        grounds:
          - entities.Claimant.fields.monthly_income_cents
        distinguishing_aspect: "POST /ssdi/claimants without monthly_income_cents → field defaults to 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /ssdi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: SSAAdmin
          trigger:
            - call: "POST /ssdi/claimants"
              payload: { ssn_last4: "0002", full_name: "Default Income", date_of_birth: "1985-01-01T00:00:00Z", filing_state: "TX" }
              as: SSAAdmin
              captures: { c_id: "$.data.id" }
          assert:
            - "Claimant.${c_id}.monthly_income_cents == 0"
            - "Claimant.${c_id}.countable_resources_cents == 0"

      - name: create_application_default_claim_type_ssdi_only
        claim_type: defaults
        grounds:
          - entities.Application.fields.claim_type
        distinguishing_aspect: "POST /ssdi/applications without claim_type → defaults to SSDI_ONLY."
        test_recipe:
          setup: ["Claimant exists."]
          setup_api_calls:
            - call: "POST /ssdi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: SSAAdmin
            - call: "POST /ssdi/claimants"
              payload: { ssn_last4: "0003", full_name: "Def Claim", date_of_birth: "1985-01-01T00:00:00Z", filing_state: "TX" }
              as: SSAAdmin
              captures: { dc_id: "$.data.id" }
          trigger:
            - call: "POST /ssdi/applications"
              payload: { claimant_id: "${dc_id}", alleged_onset_date: "2024-01-01T00:00:00Z", protective_filing_date: "2026-01-15T00:00:00Z" }
              as: SSAAdmin
              captures: { dapp_id: "$.data.id" }
          assert:
            - "Application.${dapp_id}.claim_type == SSDI_ONLY"
            - "Application.${dapp_id}.status == DRAFT"
            - "Application.${dapp_id}.version == 1"

      - name: create_claimant_invalid_state_code_returns_422
        claim_type: type_constraints
        grounds:
          - entities.Claimant.fields.filing_state
          - validations[priority=18]
          - errors[ERR_INVALID_STATE_CODE]
        distinguishing_aspect: "filing_state must be a 2-letter USPS code; 'XYZ' returns 422 ERR_INVALID_STATE_CODE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /ssdi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: SSAAdmin
          trigger:
            - call: "POST /ssdi/claimants"
              payload: { ssn_last4: "0004", full_name: "Bad State", date_of_birth: "1985-01-01T00:00:00Z", filing_state: "XYZ" }
              as: SSAAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status_code == 422"
            - "response.data.error_id == ERR_INVALID_STATE_CODE"

      - name: get_claimant_not_found_returns_404
        claim_type: not_found
        grounds:
          - endpoints[GET /ssdi/claimants/{id}]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /ssdi/claimants/{nonexistent-id} → 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /ssdi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: SSAAdmin
          trigger:
            - call: "GET /ssdi/claimants/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: SSAAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status_code == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: list_claimants_pagination_meta_present
        claim_type: listing
        grounds:
          - endpoints[GET /ssdi/claimants]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /ssdi/claimants returns paginated list with limit/offset/total_count/has_more."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /ssdi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: SSAAdmin
            - call: "POST /ssdi/claimants"
              payload: { ssn_last4: "0005", full_name: "Page A", date_of_birth: "1980-01-01T00:00:00Z", filing_state: "TX" }
              as: SSAAdmin
            - call: "POST /ssdi/claimants"
              payload: { ssn_last4: "0006", full_name: "Page B", date_of_birth: "1980-01-01T00:00:00Z", filing_state: "TX" }
              as: SSAAdmin
          trigger:
            - call: "GET /ssdi/claimants"
              payload: { limit: 1, offset: 0 }
              as: SSAAdmin
          assert:
            - "response.data.total_count >= 2"
            - "response.data.has_more == true"
            - "len(response.data.items) == 1"

      - name: workcredit_duplicate_year_returns_409
        claim_type: type_constraints
        grounds:
          - validations[priority=17]
          - errors[ERR_DUPLICATE_CREDIT_YEAR]
        distinguishing_aspect: "Posting two WorkCreditRecord rows with same (claimant_id, year) → second returns 409 ERR_DUPLICATE_CREDIT_YEAR."
        test_recipe:
          setup: ["Claimant created."]
          setup_api_calls:
            - call: "POST /ssdi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: SSAAdmin
            - call: "POST /ssdi/claimants"
              payload: { ssn_last4: "0007", full_name: "Dup Year", date_of_birth: "1980-01-01T00:00:00Z", filing_state: "TX" }
              as: SSAAdmin
              captures: { dy_id: "$.data.id" }
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${dy_id}", year: 2020, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
          trigger:
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${dy_id}", year: 2020, credits_earned: 2, earnings_cents: 2000000 }
              as: SSAAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == ERR_DUPLICATE_CREDIT_YEAR"

      - name: create_application_with_nonexistent_claimant_returns_reference_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=4]
          - errors[ERR_REFERENCE_NOT_FOUND]
        distinguishing_aspect: "POST /ssdi/applications with claimant_id pointing to non-existent claimant → 404 ERR_REFERENCE_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /ssdi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: SSAAdmin
          trigger:
            - call: "POST /ssdi/applications"
              payload: { claimant_id: "00000000-0000-0000-0000-000000000000", alleged_onset_date: "2024-01-01T00:00:00Z", protective_filing_date: "2026-01-15T00:00:00Z", claim_type: "SSDI_ONLY" }
              as: SSAAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status_code == 404"
            - "response.data.error_id == ERR_REFERENCE_NOT_FOUND"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:

      - name: submit_application_in_qc_review_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Application.transitions.DRAFT_to_QC_REVIEW
          - errors[ERR_INVALID_APPLICATION_STATE]
        distinguishing_aspect: "Submitting an application that is already past DRAFT (e.g., in MEDICAL_REVIEW or DENIED_QC) → 409 ERR_INVALID_APPLICATION_STATE."
        test_recipe:
          setup: ["Claimant created with credits passing QC; application submitted once already (now in MEDICAL_REVIEW)."]
          setup_api_calls:
            - call: "POST /ssdi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: SSAAdmin
            - call: "POST /ssdi/claimants"
              payload: { ssn_last4: "1001", full_name: "Resub", date_of_birth: "1980-01-01T00:00:00Z", filing_state: "TX" }
              as: SSAAdmin
              captures: { rs_id: "$.data.id" }
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${rs_id}", year: 2014, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${rs_id}", year: 2015, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${rs_id}", year: 2016, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${rs_id}", year: 2017, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${rs_id}", year: 2018, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${rs_id}", year: 2019, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${rs_id}", year: 2020, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${rs_id}", year: 2021, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${rs_id}", year: 2022, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${rs_id}", year: 2023, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${rs_id}", year: 2024, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${rs_id}", year: 2025, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/applications"
              payload: { claimant_id: "${rs_id}", alleged_onset_date: "2024-01-01T00:00:00Z", protective_filing_date: "2026-01-15T00:00:00Z", claim_type: "SSDI_ONLY" }
              as: SSAAdmin
              captures: { ars_id: "$.data.id" }
            - call: "POST /ssdi/applications/${ars_id}/submit"
              payload: {}
              as: Claimant
              as_user_id: "${rs_id}"
          trigger:
            - call: "POST /ssdi/applications/${ars_id}/submit"
              payload: {}
              as: Claimant
              as_user_id: "${rs_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == ERR_INVALID_APPLICATION_STATE"

      - name: new_application_starts_in_draft
        claim_type: initial_state
        grounds:
          - state_machines.Application.initial_state
        distinguishing_aspect: "POST /ssdi/applications → new Application.status == DRAFT."
        test_recipe:
          setup: ["Claimant exists."]
          setup_api_calls:
            - call: "POST /ssdi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: SSAAdmin
            - call: "POST /ssdi/claimants"
              payload: { ssn_last4: "1002", full_name: "Init State", date_of_birth: "1985-01-01T00:00:00Z", filing_state: "TX" }
              as: SSAAdmin
              captures: { is_id: "$.data.id" }
          trigger:
            - call: "POST /ssdi/applications"
              payload: { claimant_id: "${is_id}", alleged_onset_date: "2024-01-01T00:00:00Z", protective_filing_date: "2026-01-15T00:00:00Z", claim_type: "SSDI_ONLY" }
              as: SSAAdmin
              captures: { is_app: "$.data.id" }
          assert:
            - "Application.${is_app}.status == DRAFT"

      - name: terminal_denied_qc_no_further_transitions
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Application.terminal_states
          - state_machines.Application.transitions.QC_REVIEW_to_DENIED_QC
          - errors[ERR_INVALID_APPLICATION_STATE]
        distinguishing_aspect: "Application in DENIED_QC (terminal) cannot be transitioned by any further /submit, /medical-decision, etc."
        test_recipe:
          setup: ["Young claimant with insufficient QC → DENIED_QC after submit."]
          setup_api_calls:
            - call: "POST /ssdi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: SSAAdmin
            - call: "POST /ssdi/claimants"
              payload: { ssn_last4: "1003", full_name: "Term DQ", date_of_birth: "2002-06-01T00:00:00Z", filing_state: "TX" }
              as: SSAAdmin
              captures: { td_id: "$.data.id" }
            - call: "POST /ssdi/applications"
              payload: { claimant_id: "${td_id}", alleged_onset_date: "2025-01-01T00:00:00Z", protective_filing_date: "2026-01-15T00:00:00Z", claim_type: "SSDI_ONLY" }
              as: SSAAdmin
              captures: { td_app: "$.data.id", td_v: "$.data.version" }
            - call: "POST /ssdi/applications/${td_app}/submit"
              payload: {}
              as: Claimant
              as_user_id: "${td_id}"
              captures: { td_v_post: "$.data.version" }
            - call: "POST /ssdi/applications/${td_app}/evidence"
              payload: { source_type: "TREATING_PHYSICIAN", report_date: "2025-02-01T00:00:00Z", diagnosis_code: "M54.5", severity_score: 60 }
              as: DDSExaminer
          trigger:
            - call: "POST /ssdi/applications/${td_app}/medical-decision"
              payload: { decision_type: "RFC_DISABLED", established_onset_date: "2025-01-15T00:00:00Z", rfc_score: 30, expected_application_version: "${td_v_post}" }
              as: DDSExaminer
              captures: { err: "$.data.error_id" }
          assert:
            - "Application.${td_app}.status == DENIED_QC"
            - "response.status_code == 409"
            - "response.data.error_id == ERR_INVALID_APPLICATION_STATE"

      - name: schedule_hearing_already_scheduled_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.HearingRequest.transitions.REQUESTED_to_SCHEDULED
          - errors[ERR_INVALID_HEARING_STATE]
        distinguishing_aspect: "POST /ssdi/hearings/{id}/schedule when HearingRequest.status==SCHEDULED → 409 ERR_INVALID_HEARING_STATE."
        test_recipe:
          setup: ["Hearing already SCHEDULED."]
          setup_api_calls:
            - call: "POST /ssdi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: SSAAdmin
            - call: "POST /ssdi/claimants"
              payload: { ssn_last4: "1004", full_name: "Sch Twice", date_of_birth: "1980-01-01T00:00:00Z", filing_state: "TX" }
              as: SSAAdmin
              captures: { st_id: "$.data.id" }
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${st_id}", year: 2014, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${st_id}", year: 2015, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${st_id}", year: 2016, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${st_id}", year: 2017, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${st_id}", year: 2018, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${st_id}", year: 2019, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${st_id}", year: 2020, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${st_id}", year: 2021, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${st_id}", year: 2022, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${st_id}", year: 2023, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${st_id}", year: 2024, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${st_id}", year: 2025, credits_earned: 4, earnings_cents: 4800000 }
