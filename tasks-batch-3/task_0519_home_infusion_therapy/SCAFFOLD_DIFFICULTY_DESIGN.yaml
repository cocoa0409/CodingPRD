  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: inventory_conserved_on_compound_then_discontinue
        grounds:
          - invariants.inv_drug_inventory
          - state_machines.Compound.ORDERED_to_COMPOUNDED
          - state_machines.Compound.COMPOUNDED_to_WASTED
          - entities.DrugCatalog.fields.on_hand_vials
        distinguishing_aspect: |
          Conserved quantity #1 = vials: on_hand_vials + sum(vials_reserved for COMPOUNDED/DELIVERED) ==
          lot_total_vials at all times. Forward action (compound reserves 14 -> on_hand 86) paired with its
          compensating action (discontinue -> WASTED returns 14 -> on_hand 100) leaves the lot total 100
          unchanged.
        test_recipe:
          setup:
            - "vanco order ACTIVE (one visit done) with one COMPOUNDED compound reserving 14 vials; lot_total_vials=100, on_hand_vials=86"
          setup_api_calls:
