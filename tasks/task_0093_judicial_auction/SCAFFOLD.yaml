# =============================================================================
# Judicial Auction Platform — Scaffold
# =============================================================================

scenario: |
  Online judicial auction platform: lot registration with court-order intake,
  asset-profile (real-estate/vehicle/equity/movable-asset), assessment-report
  attachment, encumbrance disclosure (mortgage/liens/tenancy),
  auction-announcement publication with statutory notice period, and
  inspection-arrangement scheduling; bidding rules with starting price
  (assessment-based with discount), bid-increment configuration, bid-cap rules
  where applicable, soft-close extension on last-minute bids, anti-collusion
  observation rules, and bidder-real-name authentication; deposit management
  with deposit-amount configuration (fixed or percentage of starting price),
  deposit-payment deadline, escrow account holding, refund to non-winners
  after auction close, forfeiture rules on winner default, and dispute handling
  on refund delays; bidding process with real-time bid feed, bidder-identity
  masking for public view, bid-validity and same-time-bid arbitration,
  system-fault rollback rules, full-process audio-and-log archiving for
  judicial review, and observer-mode for non-participants; transaction
  confirmation with court-issued confirmation ruling, win-notice to highest
  bidder, transaction-record sealing for the court file, and re-auction
  trigger on confirmation failure; balance-payment collection with
  payment-deadline enforcement, partial-payment rejection, late-payment
  penalty and deposit forfeiture, second-highest-bidder offer rules where
  allowed, and full-payment receipt issuance; ownership-transfer assistance
  with handover-of-property arrangement, transfer-document preparation
  (court ruling, transfer instrument), counterpart-agency coordination
  (vehicle authority, real-estate registry, equity registry),
  tenancy-and-occupant clearance handling, and transfer-completion
  confirmation; event-driven synchronization with payment, court
  case-management, asset-registry authorities, and public-announcement
  channels; audit logging for bidding events and transfer records.

domain_name: judicial-auction
api_prefix: /lots

# =============================================================================
# Complexity Profile (§0.3)
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - scheduled_deferred_actions      # soft-close extension, statutory notice, deadlines
    - cascading_side_effects          # auction close → escrow refunds, winner-notice, re-auction trigger
    - rate_threshold_triggers         # bid increment ladder, late-payment penalty cap, anti-collusion thresholds
    - event_sourcing                  # full audit_event log; current state derivable from event replay

  entity_topology: flat
  # All nine entities are peer-level resources connected by foreign keys.
  # Lot, Auction, Bid, Deposit, Confirmation, Payment, TransferOrder,
  # AuditEvent, BidderAccount sit at /lots, /auctions, /bids, /deposits,
  # /confirmations, /payments, /transfer-orders, /audit-events,
  # /bidder-accounts — no nesting in URL paths.

  state_machine_shape: branching
  # Lot machine forks REGISTERED → {ANNOUNCED→AUCTIONED, WITHDRAWN};
  # Auction machine forks SCHEDULED → {LIVE→{SOLD,UNSOLD}, CANCELLED};
  # Payment machine cycles PENDING→OVERDUE→PENDING (after grace extension);
  # branch-specific side-effect sets per outcome (re-auction trigger vs.
  # forfeiture vs. second-bidder offer).

  relationship_patterns:
    - one_to_many        # Lot → Auctions (re-auction rounds), Auction → Bids, Auction → Deposits
    - cross_aggregate    # Confirmation references Auction + Lot + winning Bid;
                         # TransferOrder references Confirmation + Payment

  role_model: segregation_of_duties
  # CourtClerk drafts confirmation ruling but cannot place bids;
  # AuctionAdmin operates the live session but cannot issue rulings;
  # Bidder participates but cannot self-confirm; Observer reads-only.

  consistency_model: immediate
  # All state changes and side effects atomic per request; soft-close
  # extension and refund cascades execute synchronously within the
  # triggering call.

# =============================================================================
# Response Envelope (§1.0 — FIXED, EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Lot
    parent: null
    common_fields: true
    fields:
      - name: court_order_no
        type: string
        source: input
        description: Identifier of the court order authorizing the auction; unique per lot.
        constraints: "non-empty; uniqueness on (court_order_no)"
      - name: asset_profile
        type: enum
        source: input
        description: Category of the asset being auctioned.
        constraints: "one of {REAL_ESTATE, VEHICLE, EQUITY, MOVABLE_ASSET}"
      - name: assessment_value_cents
        type: integer
        source: input
        description: Court-appointed assessor's valuation, in cents.
        constraints: ">= 1; integer cents"
      - name: assessment_report_uri
        type: string
        source: input
        description: URI of the attached assessment report PDF.
        constraints: "non-empty; required at registration"
      - name: encumbrances
        type: array
        source: input
        description: Array of encumbrance disclosure objects, each {kind in (MORTGAGE, LIEN, TENANCY), description}.
        default: []
      - name: status
        type: enum
        source: computed
        description: Lifecycle status of the lot.
        constraints: "one of {DRAFT, REGISTERED, ANNOUNCED, AUCTIONED, WITHDRAWN, TRANSFERRED}"
        default: DRAFT
      - name: announcement_published_at
        type: datetime
        source: computed
        description: Timestamp when the auction announcement was published (statutory notice clock starts here).
        default: null
      - name: auction_scheduled_start_at
        type: datetime
        source: input
        description: Scheduled UTC start time of the auction; must respect statutory notice period after announcement.
      - name: inspection_window_start_at
        type: datetime
        source: input
        description: Start of the on-site/asset inspection window.
      - name: inspection_window_end_at
        type: datetime
        source: input
        description: End of the inspection window; must be strictly before auction_scheduled_start_at.
      - name: round_number
        type: integer
        source: computed
        description: 1 for first auction; increments on each re-auction trigger.
        default: 1

  - name: BidderAccount
    parent: null
    common_fields: true
    fields:
      - name: real_name
        type: string
        source: input
        description: Legal real name of the bidder (real-name authentication).
        constraints: "non-empty"
      - name: id_document_no
        type: string
        source: input
        description: Government-issued ID document number; unique per active account.
        constraints: "non-empty; uniqueness on (id_document_no) where status = ACTIVE"
      - name: ip_fingerprint
        type: string
        source: input
        description: Server-recorded IP fingerprint captured on last login; used as input to anti-collusion risk scoring.
      - name: account_age_days
        type: integer
        source: computed
        description: Days since created_at (rounded down); used by anti-collusion scoring.
      - name: status
        type: enum
        source: computed
        description: Account status.
        constraints: "one of {ACTIVE, SUSPENDED, BLOCKED}"
        default: ACTIVE
      - name: collusion_risk_score
        type: integer
        source: computed
        description: Most recent risk score from anti-collusion observation; 0–100.
        default: 0

  - name: Auction
    parent: null
    common_fields: true
    fields:
      - name: lot_id
        type: string
        source: input
        description: Foreign key to Lot.id.
      - name: starting_price_cents
        type: integer
        source: computed
        description: Starting price for this auction round, in cents; computed by starting_price_calc.
      - name: bid_increment_cents
        type: integer
        source: computed
        description: Minimum bid increment for the next bid; recomputed per current_high after each bid via bid_increment_ladder.
      - name: bid_cap_cents
        type: integer
        source: input
        description: Optional bid cap; null means no cap. When non-null, no bid above this is accepted.
        default: null
      - name: deposit_mode
        type: enum
        source: input
        description: Whether deposit is a fixed cents amount or a percentage of starting price.
        constraints: "one of {FIXED, PERCENT}"
      - name: deposit_fixed_cents
        type: integer
        source: input
        description: Fixed deposit amount in cents when deposit_mode = FIXED.
        default: null
      - name: deposit_percent_bps
        type: integer
        source: input
        description: Deposit percentage of starting price, in basis points (10000 = 100%), when deposit_mode = PERCENT.
        default: null
      - name: deposit_amount_cents
        type: integer
        source: computed
        description: Resolved deposit amount, computed once at auction publication via deposit_amount_calc.
      - name: deposit_deadline_at
        type: datetime
        source: input
        description: UTC deadline by which a bidder must have a PAID deposit to bid.
      - name: payment_deadline_days
        type: integer
        source: input
        description: Number of calendar days after Confirmation.issued_at within which the winner must pay the balance.
        constraints: ">= 1"
      - name: scheduled_end_at
        type: datetime
        source: input
        description: Originally scheduled auction end time.
      - name: effective_end_at
        type: datetime
        source: computed
        description: Current effective end time including soft-close extensions; updated by soft_close_extension.
      - name: soft_close_window_seconds
        type: integer
        source: input
        description: Length of the soft-close window in seconds.
        default: 300
        constraints: ">= 1"
      - name: soft_close_extension_seconds
        type: integer
        source: input
        description: Extension applied when a qualifying late bid arrives.
        default: 300
        constraints: ">= 1"
      - name: current_high_cents
        type: integer
        source: computed
        description: Highest valid bid amount so far; null if no bids.
        default: null
      - name: highest_bid_id
        type: string
        source: computed
        description: Foreign key to the current highest valid Bid.id; null if no bids.
        default: null
      - name: second_highest_bid_id
        type: string
        source: computed
        description: Foreign key to the second-highest valid Bid.id, used for the second-bidder offer flow on forfeiture.
        default: null
      - name: status
        type: enum
        source: computed
        description: Auction lifecycle status.
        constraints: "one of {SCHEDULED, LIVE, SOLD, UNSOLD, CANCELLED}"
        default: SCHEDULED
      - name: outcome_winner_account_id
        type: string
        source: computed
        description: BidderAccount.id of the highest valid bidder at close; null if UNSOLD.
        default: null

  - name: Bid
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: Server-minted bid identifier.
      - name: created_at
        type: datetime
        source: system
        description: Server timestamp when bid was accepted. Append-only.
      - name: auction_id
        type: string
        source: input
        description: Foreign key to Auction.id.
      - name: bidder_account_id
        type: string
        source: input
        description: Foreign key to BidderAccount.id (must have PAID deposit on this auction).
      - name: amount_cents
        type: integer
        source: input
        description: Bid amount, in cents.
        constraints: ">= current_high + bid_increment; <= bid_cap if set"
      - name: client_seq_no
        type: integer
        source: input
        description: Monotonic client-supplied sequence per bidder; used as tie-breaker among same-amount, same-timestamp bids.
      - name: validity
        type: enum
        source: computed
        description: Server validity verdict.
        constraints: "one of {VALID, REJECTED, ROLLED_BACK}"
        default: VALID
      - name: masked_handle
        type: string
        source: computed
        description: Public-facing identity mask (e.g., "Bidder #042"); never reveals bidder_account_id.

  - name: Deposit
    parent: null
    common_fields: true
    fields:
      - name: auction_id
        type: string
        source: input
        description: Foreign key to Auction.id.
      - name: bidder_account_id
        type: string
        source: input
        description: Foreign key to BidderAccount.id.
        constraints: "uniqueness on (auction_id, bidder_account_id)"
      - name: amount_cents
        type: integer
        source: computed
        description: Required deposit amount snapshotted from Auction.deposit_amount_cents at posting time.
      - name: status
        type: enum
        source: computed
        description: Deposit lifecycle.
        constraints: "one of {PENDING, PAID, REFUNDED, FORFEITED, DISPUTED}"
        default: PENDING
      - name: paid_at
        type: datetime
        source: computed
        description: Timestamp when escrow received the funds.
        default: null
      - name: refunded_at
        type: datetime
        source: computed
        description: Timestamp when refund was issued.
        default: null
      - name: refund_due_at
        type: datetime
        source: computed
        description: Refund SLA deadline; auction close + 72h. Used by dispute handling.
        default: null
      - name: dispute_opened_at
        type: datetime
        source: computed
        description: Set when refund-delay dispute is raised.
        default: null

  - name: Confirmation
    parent: null
    common_fields: true
    fields:
      - name: auction_id
        type: string
        source: input
        description: Foreign key to the SOLD Auction being confirmed.
        constraints: "uniqueness on (auction_id) where status != FAILED"
      - name: winning_bid_id
        type: string
        source: input
        description: Foreign key to the Bid being confirmed (must equal Auction.highest_bid_id at issuance).
      - name: ruling_document_uri
        type: string
        source: input
        description: URI of the court's confirmation-ruling document.
      - name: status
        type: enum
        source: computed
        description: Confirmation lifecycle.
        constraints: "one of {DRAFT, ISSUED, SEALED, FAILED}"
        default: DRAFT
      - name: issued_at
        type: datetime
        source: computed
        description: Timestamp when the ruling was issued; payment deadline clock starts here.
        default: null
      - name: sealed_at
        type: datetime
        source: computed
        description: Timestamp when the transaction record was sealed for the court file.
        default: null
      - name: failure_reason
        type: enum
        source: computed
        description: Why confirmation failed.
        constraints: "one of {COLLUSION_FOUND, BIDDER_DISQUALIFIED, COURT_OVERRIDE} when status = FAILED"
        default: null

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - name: confirmation_id
        type: string
        source: input
        description: Foreign key to the Confirmation triggering this balance-payment obligation.
        constraints: "uniqueness on (confirmation_id)"
      - name: balance_due_cents
        type: integer
        source: computed
        description: winning_bid.amount_cents minus the matched Deposit.amount_cents; pinned at Confirmation issuance.
      - name: penalty_accrued_cents
        type: integer
        source: computed
        description: Late-payment penalty accrued so far per late_payment_penalty calc.
        default: 0
      - name: amount_paid_cents
        type: integer
        source: computed
        description: Sum of accepted full-payment receipts.
        default: 0
      - name: status
        type: enum
        source: computed
        description: Payment lifecycle.
        constraints: "one of {PENDING, OVERDUE, PAID, FORFEITED}"
        default: PENDING
      - name: due_at
        type: datetime
        source: computed
        description: confirmation.issued_at + auction.payment_deadline_days; pinned at issuance.
      - name: receipt_no
        type: string
        source: computed
        description: Receipt identifier issued when status flips to PAID.
        default: null

  - name: TransferOrder
    parent: null
    common_fields: true
    fields:
      - name: confirmation_id
        type: string
        source: input
        description: Foreign key to the Confirmation; uniqueness on (confirmation_id).
      - name: counterpart_agency
        type: enum
        source: computed
        description: Registry the order coordinates with, derived from Lot.asset_profile.
        constraints: "REAL_ESTATE→REAL_ESTATE_REGISTRY; VEHICLE→VEHICLE_AUTHORITY; EQUITY→EQUITY_REGISTRY; MOVABLE_ASSET→COURT_BAILIFF"
      - name: handover_scheduled_at
        type: datetime
        source: input
        description: Scheduled property-handover timestamp.
      - name: transfer_instrument_uri
        type: string
        source: input
        description: URI of prepared transfer instrument document.
      - name: tenancy_cleared
        type: boolean
        source: input
        description: Whether tenancy/occupant clearance has been completed; required for REAL_ESTATE before COMPLETED.
        default: false
      - name: status
        type: enum
        source: computed
        description: Transfer lifecycle.
        constraints: "one of {INITIATED, AGENCY_NOTIFIED, HANDOVER_DONE, COMPLETED, BLOCKED}"
        default: INITIATED

  - name: AuditEvent
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: Server-minted event identifier.
      - name: created_at
        type: datetime
        source: system
        description: Server timestamp at event emission.
      - name: kind
        type: enum
        source: system
        description: Event category.
        constraints: "one of {BID_PLACED, BID_REJECTED, BID_ROLLED_BACK, SOFT_CLOSE_EXTENSION, AUCTION_CLOSED, DEPOSIT_PAID, DEPOSIT_REFUNDED, DEPOSIT_FORFEITED, CONFIRMATION_ISSUED, CONFIRMATION_SEALED, CONFIRMATION_FAILED, PAYMENT_RECEIVED, PAYMENT_OVERDUE, TRANSFER_NOTIFIED, TRANSFER_COMPLETED, COLLUSION_FLAGGED, REAUCTION_TRIGGERED, SYSTEM_FAULT_ROLLBACK}"
      - name: actor_role
        type: enum
        source: system
        description: Role that emitted the event.
        constraints: "one of {CourtClerk, AuctionAdmin, Bidder, Observer, system}"
      - name: actor_id
        type: string
        source: system
        description: X-User-ID at emission; "system" for automatic transitions.
      - name: subject_entity
        type: enum
        source: system
        description: Which entity this event concerns.
        constraints: "one of {Lot, Auction, Bid, Deposit, Confirmation, Payment, TransferOrder, BidderAccount}"
      - name: subject_id
        type: string
        source: system
        description: Id of the subject entity.
      - name: payload
        type: object
        source: system
        description: Structured event payload (key fields and old→new values).

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Lot
    initial_state: DRAFT
    terminal_states: [WITHDRAWN, TRANSFERRED]
    transitions:
      - from: DRAFT
        to: REGISTERED
        trigger: "POST /lots — court order intake"
        actor: CourtClerk
        preconditions:
          - "court_order_no is unique"
          - "assessment_report_uri non-empty"
          - "inspection_window_end_at < auction_scheduled_start_at"
        side_effects:
          - "Lot.status = REGISTERED"

      - from: REGISTERED
        to: ANNOUNCED
        trigger: "POST /lots/{id}/announce — publish auction announcement"
        actor: CourtClerk
        preconditions:
          - "auction_scheduled_start_at - now >= STATUTORY_NOTICE_DAYS (15 days)"
          - "Auction sibling for round_number must exist with status = SCHEDULED"
        side_effects:
          - "Lot.announcement_published_at = now"
          - "Lot.status = ANNOUNCED"
          - "Emit AuditEvent.kind = CONFIRMATION_ISSUED is NOT used here; emit no audit-event here"

      - from: REGISTERED
        to: WITHDRAWN
        trigger: "POST /lots/{id}/withdraw"
        actor: CourtClerk
        preconditions:
          - "no Auction exists with status IN {LIVE, SOLD}"
        side_effects:
          - "Lot.status = WITHDRAWN"

      - from: ANNOUNCED
        to: AUCTIONED
        trigger: "system — sibling Auction reaches SOLD or UNSOLD"
        actor: system
        preconditions:
          - "Auction.status IN {SOLD, UNSOLD}"
        side_effects:
          - "Lot.status = AUCTIONED"

      - from: AUCTIONED
        to: ANNOUNCED
        trigger: "system — re-auction triggered by Confirmation FAILED, Auction UNSOLD, or Payment FORFEITED with no eligible second bidder"
        actor: system
        preconditions:
          - "round_number < 3 (max two re-auctions)"
        side_effects:
          - "Lot.round_number += 1"
          - "Create new Auction with starting_price discounted by REAUCTION_DISCOUNT_BPS (2000 = 20%) from prior round's starting_price"
          - "Lot.status = ANNOUNCED"
          - "Emit AuditEvent.kind = REAUCTION_TRIGGERED"

      - from: AUCTIONED
        to: TRANSFERRED
        trigger: "system — TransferOrder reaches COMPLETED"
        actor: system
        preconditions:
          - "TransferOrder.status = COMPLETED"
        side_effects:
          - "Lot.status = TRANSFERRED"

  - entity: Auction
    initial_state: SCHEDULED
    terminal_states: [SOLD, UNSOLD, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: LIVE
        trigger: "POST /auctions/{id}/open"
        actor: AuctionAdmin
        preconditions:
          - "now >= scheduled_start_at"
          - "parent Lot.status = ANNOUNCED"
          - "Auction.starting_price_cents and deposit_amount_cents are pinned"
        side_effects:
          - "Auction.status = LIVE"
          - "Auction.effective_end_at = scheduled_end_at"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /auctions/{id}/cancel"
        actor: CourtClerk
        preconditions:
          - "no Bid has been placed (no Auction.current_high_cents yet)"
        side_effects:
          - "Auction.status = CANCELLED"
          - "All Deposit rows with status = PAID for this auction → REFUNDED (cascade depth 2: AuctionCancel → Deposit.refund → BidderAccount no-op)"

      - from: LIVE
        to: SOLD
        trigger: "system — clock advances past effective_end_at with at least one VALID bid"
        actor: system
        preconditions:
          - "now >= effective_end_at"
          - "Auction.current_high_cents is not null"
        side_effects:
          - "Auction.status = SOLD"
          - "Auction.outcome_winner_account_id = highest_bid.bidder_account_id"
          - "Lot.status = AUCTIONED (parent bubble-up)"
          - "All Deposit rows where bidder_account_id != outcome_winner_account_id and status = PAID → REFUNDED (cascade hop 1 from auction close)"
          - "Set Deposit.refund_due_at = now + 72h on each refunded deposit"
          - "Emit AuditEvent.kind = AUCTION_CLOSED"

      - from: LIVE
        to: UNSOLD
        trigger: "system — clock advances past effective_end_at with no VALID bids"
        actor: system
        preconditions:
          - "now >= effective_end_at"
          - "Auction.current_high_cents is null"
        side_effects:
          - "Auction.status = UNSOLD"
          - "Lot.status = AUCTIONED, then system schedules re-auction (cascade hop 2: AUCTIONED → re-auction creation)"
          - "All Deposit rows with status = PAID for this auction → REFUNDED"

  - entity: Deposit
    initial_state: PENDING
    terminal_states: [REFUNDED, FORFEITED]
    transitions:
      - from: PENDING
        to: PAID
        trigger: "POST /deposits/{id}/pay — escrow account receives funds"
        actor: Bidder
        preconditions:
          - "now <= Auction.deposit_deadline_at"
          - "Auction.status = SCHEDULED OR Auction.status = LIVE"
          - "BidderAccount.status = ACTIVE"
        side_effects:
          - "Deposit.status = PAID"
          - "Deposit.paid_at = now"

      - from: PAID
        to: REFUNDED
        trigger: "system — auction close cascade (LIVE→{SOLD,UNSOLD} or SCHEDULED→CANCELLED) for non-winning bidder"
        actor: system
        preconditions:
          - "Auction.status IN {SOLD, UNSOLD, CANCELLED}"
          - "bidder_account_id != Auction.outcome_winner_account_id"
        side_effects:
          - "Deposit.status = REFUNDED"
          - "Deposit.refunded_at = now"
          - "Emit AuditEvent.kind = DEPOSIT_REFUNDED"

      - from: PAID
        to: FORFEITED
        trigger: "system — winner Payment status flips to FORFEITED"
        actor: system
        preconditions:
          - "this Deposit.bidder_account_id == Auction.outcome_winner_account_id"
          - "Payment.status = FORFEITED"
        side_effects:
          - "Deposit.status = FORFEITED"
          - "Lot.round_number increment + new Auction creation (cascade hop 2: PAID→FORFEITED → Lot.round_number++ → new Auction row) UNLESS second-bidder offer is invoked first"
          - "Emit AuditEvent.kind = DEPOSIT_FORFEITED"

      - from: PAID
        to: DISPUTED
        trigger: "POST /deposits/{id}/raise-dispute"
        actor: Bidder
        preconditions:
          - "now > Deposit.refund_due_at"
          - "Deposit.status is still PAID (refund overdue)"
        side_effects:
          - "Deposit.status = DISPUTED"
          - "Deposit.dispute_opened_at = now"

      - from: DISPUTED
        to: REFUNDED
        trigger: "POST /deposits/{id}/resolve-dispute"
        actor: CourtClerk
        preconditions:
          - "Deposit.status = DISPUTED"
        side_effects:
          - "Deposit.status = REFUNDED"
          - "Deposit.refunded_at = now"

  - entity: Confirmation
    initial_state: DRAFT
    terminal_states: [SEALED, FAILED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /confirmations/{id}/issue — court issues confirmation ruling"
        actor: CourtClerk
        preconditions:
          - "Auction.status = SOLD"
          - "winning_bid_id == Auction.highest_bid_id"
          - "winner's BidderAccount.status = ACTIVE"
          - "ruling_document_uri non-empty"
        side_effects:
          - "Confirmation.status = ISSUED"
          - "Confirmation.issued_at = now"
          - "Create Payment row with balance_due_cents = Auction.current_high_cents - matched_deposit.amount_cents, due_at = now + Auction.payment_deadline_days, status = PENDING (cascade hop 2: ISSUE → Payment row spawn)"
          - "Emit AuditEvent.kind = CONFIRMATION_ISSUED"

      - from: DRAFT
        to: FAILED
        trigger: "POST /confirmations/{id}/fail — collusion confirmed or bidder disqualified"
        actor: CourtClerk
        preconditions:
          - "Auction.status = SOLD"
          - "failure_reason in {COLLUSION_FOUND, BIDDER_DISQUALIFIED, COURT_OVERRIDE}"
        side_effects:
          - "Confirmation.status = FAILED"
          - "Trigger re-auction via Lot.AUCTIONED→ANNOUNCED if round_number < 3 (cascade hop 3: Confirmation.FAIL → Lot.round_number++ → new Auction row → Lot back to ANNOUNCED)"
          - "Forfeit winning bidder's deposit if failure_reason = COLLUSION_FOUND or BIDDER_DISQUALIFIED"
          - "Emit AuditEvent.kind = CONFIRMATION_FAILED"

      - from: ISSUED
        to: SEALED
        trigger: "POST /confirmations/{id}/seal — transaction record sealed for court file"
        actor: CourtClerk
        preconditions:
          - "Payment.status = PAID"
          - "TransferOrder exists with status != BLOCKED"
        side_effects:
          - "Confirmation.status = SEALED"
          - "Confirmation.sealed_at = now"
          - "Emit AuditEvent.kind = CONFIRMATION_SEALED"

  - entity: Payment
    initial_state: PENDING
    terminal_states: [PAID, FORFEITED]
    transitions:
      - from: PENDING
        to: PAID
        trigger: "POST /payments/{id}/settle — full-payment receipt issued"
        actor: Bidder
        preconditions:
          - "amount_paid_cents + incoming_payment_cents >= balance_due_cents + penalty_accrued_cents"
          - "Payment.status IN {PENDING, OVERDUE}"
          - "partial payments rejected: single settle call must clear total"
        side_effects:
          - "Payment.amount_paid_cents += incoming_payment_cents"
          - "Payment.status = PAID"
          - "Generate receipt_no"

      - from: PENDING
        to: OVERDUE
        trigger: "system — clock advances past due_at"
        actor: system
        preconditions:
          - "now > Payment.due_at"
          - "Payment.status = PENDING"
        side_effects:
          - "Payment.status = OVERDUE"
          - "Begin penalty accrual via late_payment_penalty calc"
          - "Emit AuditEvent.kind = PAYMENT_OVERDUE"

      - from: OVERDUE
        to: PENDING
        trigger: "POST /payments/{id}/extend — court grants grace extension"
        actor: CourtClerk
        preconditions:
          - "extension_days >= 1 and <= 14"
        side_effects:
          - "Payment.due_at = now + extension_days days"
          - "Payment.status = PENDING"
          - "Penalty accrual paused but accrued amount retained"
        note: "Cycle: PENDING→OVERDUE→PENDING constitutes the cyclic state-machine shape on Payment."

      - from: OVERDUE
        to: FORFEITED
        trigger: "POST /payments/{id}/forfeit"
        actor: CourtClerk
        preconditions:
          - "now > Payment.due_at + GRACE_FORFEITURE_DAYS (7 days)"
          - "Payment.status = OVERDUE"
        side_effects:
          - "Payment.status = FORFEITED"
          - "Cascade: Deposit (winner's) PAID → FORFEITED → Lot.round_number++ → new Auction row (cascade depth 3, originating from Payment.forfeit)"
          - "Emit AuditEvent.kind = DEPOSIT_FORFEITED"

  - entity: TransferOrder
    initial_state: INITIATED
    terminal_states: [COMPLETED, BLOCKED]
    transitions:
      - from: INITIATED
        to: AGENCY_NOTIFIED
        trigger: "POST /transfer-orders/{id}/notify-agency"
        actor: AuctionAdmin
        preconditions:
          - "parent Confirmation.status = ISSUED OR SEALED"
          - "Payment.status = PAID"
          - "transfer_instrument_uri non-empty"
        side_effects:
          - "TransferOrder.status = AGENCY_NOTIFIED"
          - "Emit AuditEvent.kind = TRANSFER_NOTIFIED with counterpart_agency"

      - from: AGENCY_NOTIFIED
        to: HANDOVER_DONE
        trigger: "POST /transfer-orders/{id}/complete-handover"
        actor: AuctionAdmin
        preconditions:
          - "now >= handover_scheduled_at"
          - "if Lot.asset_profile = REAL_ESTATE, tenancy_cleared = true"
        side_effects:
          - "TransferOrder.status = HANDOVER_DONE"

      - from: HANDOVER_DONE
        to: COMPLETED
        trigger: "POST /transfer-orders/{id}/confirm-completion"
        actor: CourtClerk
        preconditions:
          - "TransferOrder.status = HANDOVER_DONE"
        side_effects:
          - "TransferOrder.status = COMPLETED"
          - "Lot.status = TRANSFERRED (bubble-up to parent Lot)"
          - "Emit AuditEvent.kind = TRANSFER_COMPLETED"

      - from: AGENCY_NOTIFIED
        to: BLOCKED
        trigger: "POST /transfer-orders/{id}/block — counterpart-agency rejection or tenancy issue"
        actor: AuctionAdmin
        preconditions:
          - "blocked_reason non-empty"
        side_effects:
          - "TransferOrder.status = BLOCKED"

  - entity: BidderAccount
    initial_state: ACTIVE
    terminal_states: [BLOCKED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system — collusion_risk_score >= COLLUSION_SUSPECT_THRESHOLD (60) after collusion_risk_score calc"
        actor: system
        preconditions:
          - "collusion_risk_score in [60, 79]"
        side_effects:
          - "BidderAccount.status = SUSPENDED"
          - "Account cannot place new bids; existing bids remain VALID"
          - "Emit AuditEvent.kind = COLLUSION_FLAGGED"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /bidder-accounts/{id}/clear"
        actor: CourtClerk
        preconditions:
          - "investigation_resolved = true"
        side_effects:
          - "BidderAccount.status = ACTIVE"

      - from: ACTIVE
        to: BLOCKED
        trigger: "system — collusion_risk_score >= COLLUSION_BLOCK_THRESHOLD (80)"
        actor: system
        preconditions:
          - "collusion_risk_score >= 80"
        side_effects:
          - "BidderAccount.status = BLOCKED"
          - "All open bids by this account on LIVE auctions → validity = ROLLED_BACK (cascade hop 2: BLOCK → Bid.ROLLED_BACK → Auction.current_high recomputed → potentially new highest_bid)"
          - "Emit AuditEvent.kind = COLLUSION_FLAGGED"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:

  - scenario: "Two bidders place a bid with identical amount_cents at the same server-recorded second on the same auction"
    guarantee: "Exactly one bid wins as current_high; the other is rejected as not-strictly-greater after serialization"
    error_id: ERR_BID_NOT_ABOVE_HIGH
    http_status: 409
    serialization: "First-writer-wins on Auction.current_high_cents; tie-break = lower (client_seq_no, created_at) wins; loser sees current_high already at their amount and is rejected for not strictly exceeding it"

  - scenario: "Two bidders both attempt to bid the bid_cap exactly at the same instant"
    guarantee: "First-writer-wins on bid acceptance; second bid sees current_high == bid_cap and is rejected"
    error_id: ERR_BID_AT_OR_ABOVE_CAP
    http_status: 409
    serialization: "First-writer-wins on Auction.current_high_cents"

  - scenario: "CourtClerk issues confirmation while CourtClerk on another terminal marks it FAILED simultaneously"
    guarantee: "Exactly one transition wins on Confirmation.status; loser rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Confirmation.status (DRAFT → {ISSUED, FAILED})"

  - scenario: "Bidder settles balance while clock-advance is flipping Payment to FORFEITED"
    guarantee: "If Payment.status already advanced to FORFEITED, settlement rejected"
    error_id: ERR_PAYMENT_FORFEITED
    http_status: 409
    serialization: "First-writer-wins on Payment.status"

  - scenario: "Bidder raises a refund-delay dispute while system asynchronously completes the refund"
    guarantee: "If Deposit.status already advanced to REFUNDED, dispute creation rejected"
    error_id: ERR_DEPOSIT_ALREADY_REFUNDED
    http_status: 409
    serialization: "First-writer-wins on Deposit.status"

  - scenario: "Two deposits posted concurrently by the same bidder on the same auction"
    guarantee: "Uniqueness on (auction_id, bidder_account_id) — second rejected"
    error_id: ERR_DEPOSIT_DUPLICATE
    http_status: 409
    serialization: "First-writer-wins on (auction_id, bidder_account_id)"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: starting_price_calc
    trigger: "On Auction row creation (initial round on Lot registration, and on each re-auction trigger)"
    algorithm: tiered_pricing
    formula: |
      if round_number == 1:
        starting_price_cents = round_half_up(
          Lot.assessment_value_cents * (10000 - FIRST_AUCTION_DISCOUNT_BPS) / 10000
        )
      else:
        starting_price_cents = round_half_up(
          prior_auction.starting_price_cents * (10000 - REAUCTION_DISCOUNT_BPS) / 10000
        )
      # Rounding order is pinned: multiply first to integer-cents intermediate,
      # then round_half_up to integer cents. Do NOT divide first.
    input_set: "Lot.assessment_value_cents (cents) for round 1; prior Auction.starting_price_cents for subsequent rounds. Excludes encumbrance valuations."
    constants:
      FIRST_AUCTION_DISCOUNT_BPS: 3000     # 30% discount on first auction
      REAUCTION_DISCOUNT_BPS: 2000         # 20% per re-auction round
    precision: "integer cents; round_half_up applied AFTER multiplication, then no further rounding."
    variants:
      - name: first_auction
        when: "Auction.round_number == 1"
        difference: "Uses assessment value × (1 - FIRST_AUCTION_DISCOUNT_BPS/10000); operates on Lot.assessment_value_cents."
      - name: reauction
        when: "Auction.round_number > 1"
        difference: "Uses prior auction's starting_price × (1 - REAUCTION_DISCOUNT_BPS/10000); operates on prior Auction.starting_price_cents — compounds across rounds."

  - name: deposit_amount_calc
    trigger: "On Auction publication (announce step) — pins Auction.deposit_amount_cents"
    algorithm: threshold
    formula: |
      if Auction.deposit_mode == FIXED:
        deposit_amount_cents = Auction.deposit_fixed_cents
      else:  # PERCENT
        deposit_amount_cents = round_half_up(
          Auction.starting_price_cents * Auction.deposit_percent_bps / 10000
        )
      # Boundary: PERCENT mode requires deposit_percent_bps in [500, 3000]
      # (5%–30%); FIXED mode requires deposit_fixed_cents <= starting_price.
    input_set: "Auction.deposit_mode, deposit_fixed_cents OR deposit_percent_bps, and Auction.starting_price_cents (already pinned by starting_price_calc)."
    constants:
      MIN_PERCENT_BPS: 500
      MAX_PERCENT_BPS: 3000
    precision: "integer cents; round_half_up."
    variants:
      - name: fixed_mode
        when: "deposit_mode == FIXED"
        difference: "Deposit is the literal deposit_fixed_cents; does not scale with starting_price."
      - name: percent_mode
        when: "deposit_mode == PERCENT"
        difference: "Deposit derived from starting_price × percent_bps; scales with re-auction discounting."

  - name: bid_increment_ladder
    trigger: "Computed on each POST /bids — minimum next bid for the current_high"
    algorithm: threshold
    formula: |
      base = Auction.current_high_cents if Auction.current_high_cents is not None
             else Auction.starting_price_cents
      # Ladder tiers, applied via base in cents:
      if base < 50_000_000:           # < 500,000.00
        increment = 100_000           # 1,000.00
      elif base < 200_000_000:        # < 2,000,000.00
        increment = 500_000           # 5,000.00
      elif base < 1_000_000_000:      # < 10,000,000.00
        increment = 1_000_000         # 10,000.00
      else:
        increment = 5_000_000         # 50,000.00
      min_next_bid = base + increment if Auction.current_high_cents is not None
                     else base   # first bid may equal starting_price
      # Bidder amount_cents must be >= min_next_bid AND (bid_cap_cents is null
      # OR amount_cents <= bid_cap_cents). Boundary: '>=' on min_next_bid is
      # strict — equality counts as valid.
    input_set: "Auction.current_high_cents and Auction.starting_price_cents (cents). Excludes bids with validity != VALID."
    constants:
      TIER_1_MAX_CENTS: 50000000
      TIER_2_MAX_CENTS: 200000000
      TIER_3_MAX_CENTS: 1000000000
      INC_TIER_1_CENTS: 100000
      INC_TIER_2_CENTS: 500000
      INC_TIER_3_CENTS: 1000000
      INC_TIER_4_CENTS: 5000000
    precision: "integer cents; no rounding (constants are exact)."

  - name: soft_close_extension
    trigger: "On every accepted Bid — checks whether to extend Auction.effective_end_at"
    algorithm: threshold
    formula: |
      if (Auction.effective_end_at - now) < soft_close_window_seconds:
        Auction.effective_end_at = now + soft_close_extension_seconds
      # Boundary: strict '<'. A bid arriving exactly at the boundary (delta ==
      # soft_close_window_seconds) does NOT extend. A bid at delta - 1 second
      # extends. Repeated triggers compound — each qualifying bid resets the
      # end to now + soft_close_extension_seconds.
    input_set: "Auction.effective_end_at, Auction.soft_close_window_seconds, Auction.soft_close_extension_seconds, now."
    constants: {}
    precision: "seconds (integer)."

  - name: late_payment_penalty
    trigger: "On any state-affecting read of Payment while status IN {OVERDUE} — accrued amount recomputed"
    algorithm: chronological
    formula: |
      if Payment.status == OVERDUE:
        days_overdue = ceil((now - Payment.due_at).total_seconds() / 86400)
      else:
        days_overdue = 0
      uncapped = Payment.balance_due_cents * DAILY_PENALTY_BPS / 10000 * days_overdue
      cap = Payment.balance_due_cents * MAX_PENALTY_BPS / 10000
      Payment.penalty_accrued_cents = round_half_up(min(uncapped, cap))
      # Order of operations pinned: multiply balance_due_cents × bps × days
      # (full precision), divide by 10000, THEN round_half_up. Cap comparison
      # uses the pre-round full-precision values.
    input_set: "Payment.balance_due_cents, Payment.due_at, Payment.status, now."
    constants:
      DAILY_PENALTY_BPS: 50            # 0.50% per calendar day
      MAX_PENALTY_BPS: 1000            # 10% of balance_due_cents — hard cap
    precision: "integer cents; round_half_up after multiplication and division; cap applied to full-precision intermediate."
    variants:
      - name: linear_accrual
        when: "days_overdue * DAILY_PENALTY_BPS < MAX_PENALTY_BPS (i.e., days_overdue < 20)"
        difference: "Linear accrual: penalty grows by balance × 0.005 per day."
      - name: capped
        when: "days_overdue * DAILY_PENALTY_BPS >= MAX_PENALTY_BPS (i.e., days_overdue >= 20)"
        difference: "Flat cap: penalty = balance × 0.10 regardless of further delay."

  - name: collusion_risk_score
    trigger: "On every POST /bids — recomputed for the bidding account against all VALID bids of co-bidders in the same Auction"
    algorithm: weighted_scoring
    formula: |
      # Pairwise signals against every other ACTIVE bidder on this auction.
      # For each peer p, compute the indicator set:
      shared_ip = 1 if peer.ip_fingerprint == self.ip_fingerprint else 0
      alternating_pattern = 1 if last 4 VALID bids on this auction alternate
        strictly between {self, p} (i.e., self,p,self,p OR p,self,p,self) else 0
      identical_increment = 1 if last 3 VALID bid deltas by self and p are
        all equal to bid_increment_ladder's current increment else 0
      young_account = 1 if self.account_age_days < YOUNG_ACCOUNT_DAYS else 0
      # Per-peer signal score:
      peer_score = (W_SHARED_IP * shared_ip
                  + W_ALTERNATING * alternating_pattern
                  + W_IDENTICAL_INC * identical_increment
                  + W_YOUNG_ACCOUNT * young_account)
      # Self's risk score is the MAX peer_score across peers (not the sum
      # — pin this explicitly to avoid double-counting peers).
      collusion_risk_score = max(peer_scores) if peer_scores else 0
      # Thresholds (used by BidderAccount transitions):
      if collusion_risk_score >= COLLUSION_BLOCK_THRESHOLD: → BLOCKED
      elif collusion_risk_score >= COLLUSION_SUSPECT_THRESHOLD: → SUSPENDED
    input_set: "All VALID Bid rows on this Auction by ACTIVE BidderAccounts; the acting bidder's IP fingerprint and account_age_days."
    constants:
      W_SHARED_IP: 40
      W_ALTERNATING: 30
      W_IDENTICAL_INC: 20
      W_YOUNG_ACCOUNT: 10
      YOUNG_ACCOUNT_DAYS: 30
      COLLUSION_SUSPECT_THRESHOLD: 60
      COLLUSION_BLOCK_THRESHOLD: 80
    precision: "integer score in [0, 100]; no rounding."

  - name: balance_due_calc
    trigger: "On Confirmation.DRAFT→ISSUED — pins Payment.balance_due_cents"
    algorithm: aggregation
    formula: |
      matched_deposit = Deposit row with
        auction_id = Confirmation.auction_id
        AND bidder_account_id = Auction.outcome_winner_account_id
        AND status = PAID
      Payment.balance_due_cents = (
        Auction.current_high_cents - matched_deposit.amount_cents
      )
      # Negative result not possible: deposit_amount_calc and bid_increment_ladder
      # together guarantee winning_bid >= starting_price >= deposit_amount.
      # Equality (balance_due_cents == 0) is allowed for edge case of bid ==
      # deposit; in that case Payment is auto-marked PAID on creation.
    input_set: "Auction.current_high_cents and the single matched winner Deposit.amount_cents (status = PAID)."
    constants: {}
    precision: "integer cents; no rounding (subtraction of integers)."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_AUTH_MISSING
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role must permit the requested operation per §1.7 RBAC matrix"
    error_id: ERR_AUTH_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path parameter ids (lot_id, auction_id, bid_id, deposit_id, confirmation_id, payment_id, transfer_order_id, bidder_account_id) must reference existing rows, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameterized endpoints"

  - priority: 4
    category: existence
    check: "Referenced foreign-key ids in request body (lot_id on Auction; auction_id on Bid/Deposit; winning_bid_id on Confirmation; etc.) must exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all POST/PATCH endpoints accepting foreign keys"

  - priority: 5
    category: state
    check: "Target resource must be in a valid state for the requested transition (see §1.2 preconditions)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 6
    category: business_safety
    check: "BidderAccount.status must be ACTIVE for POST /bids and POST /deposits/{id}/pay"
    error_id: ERR_BIDDER_NOT_ACTIVE
    http_status: 403
    applies_to: "POST /bids, POST /deposits/{id}/pay"

  - priority: 7
    category: business_safety
    check: "Auction announcement must precede auction_scheduled_start_at by at least STATUTORY_NOTICE_DAYS (15) — statutory notice period"
    error_id: ERR_STATUTORY_NOTICE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /lots/{id}/announce"

  - priority: 8
    category: business_safety
    check: "Confirmation cannot reference a winning_bid_id whose bidder's account is BLOCKED or has collusion_risk_score >= COLLUSION_BLOCK_THRESHOLD at issuance time"
    error_id: ERR_WINNER_DISQUALIFIED
    http_status: 422
    applies_to: "POST /confirmations/{id}/issue"

  - priority: 9
    category: business_temporal
    check: "Inspection window must end strictly before auction_scheduled_start_at"
    error_id: ERR_INSPECTION_OVERLAPS_AUCTION
    http_status: 422
    applies_to: "POST /lots, PATCH /lots/{id}"

  - priority: 10
    category: business_temporal
    check: "Two inspection windows on the same lot must not overlap; back-to-back windows where end_at == next.start_at are NOT allowed (closed-interval semantics — adjacency counts as overlap)"
    error_id: ERR_INSPECTION_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /lots/{id}/inspection-windows"

  - priority: 11
    category: business_temporal
    check: "Two TransferOrder.handover_scheduled_at on the same counterpart_agency on the same calendar day must be separated by at least HANDOVER_BUFFER_HOURS (4h); half-open interval semantics — touching is allowed iff gap >= buffer"
    error_id: ERR_HANDOVER_AGENCY_BUSY
    http_status: 409
    applies_to: "POST /transfer-orders, PATCH /transfer-orders/{id}"

  - priority: 12
    category: business_constraint
    check: "bid.amount_cents must be >= bid_increment_ladder.min_next_bid"
    error_id: ERR_BID_NOT_ABOVE_HIGH
    http_status: 422
    applies_to: "POST /bids"

  - priority: 13
    category: business_constraint
    check: "If Auction.bid_cap_cents is not null, bid.amount_cents must be strictly < bid_cap_cents OR equal it (closed cap: equality allowed, exceedance rejected). Bids strictly greater than bid_cap rejected"
    error_id: ERR_BID_AT_OR_ABOVE_CAP
    http_status: 422
    applies_to: "POST /bids"
    description: "Boundary: equality allowed; >= bid_cap + 1 cent rejected."

  - priority: 14
    category: business_constraint
    check: "Bidder must have a PAID Deposit on this Auction before POST /bids is accepted; non-zero balance bidders rejected"
    error_id: ERR_DEPOSIT_NOT_PAID
    http_status: 422
    applies_to: "POST /bids"

  - priority: 15
    category: business_fiscal
    check: "Payment.settle must clear the full balance_due + accrued penalty in a single call; partial amounts rejected"
    error_id: ERR_PARTIAL_PAYMENT_REJECTED
    http_status: 422
    applies_to: "POST /payments/{id}/settle"

  - priority: 16
    category: business_fiscal
    check: "POST /deposits/{id}/pay must arrive before Auction.deposit_deadline_at"
    error_id: ERR_DEPOSIT_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /deposits/{id}/pay"

  - priority: 17
    category: business_referential
    check: "TransferOrder COMPLETION for asset_profile = REAL_ESTATE requires tenancy_cleared = true"
    error_id: ERR_TENANCY_NOT_CLEARED
    http_status: 422
    applies_to: "POST /transfer-orders/{id}/complete-handover"

  - priority: 18
    category: business_referential
    check: "Re-auction may not be triggered when Lot.round_number == 3 (max two re-auctions); the Lot is closed UNSOLD"
    error_id: ERR_REAUCTION_LIMIT_REACHED
    http_status: 409
    applies_to: "system; POST /lots/{id}/reauction"

  - priority: 19
    category: business_constraint
    check: "Empty-set guard: GET /auctions/{id}/bids returns an empty array when no VALID bids exist; POST /confirmations against an Auction with current_high_cents == null rejected"
    error_id: ERR_NO_VALID_BIDS
    http_status: 422
    applies_to: "POST /confirmations"

  - priority: 20
    category: business_constraint
    check: "Second-bidder offer (POST /confirmations with use_second_bidder=true) requires Auction.second_highest_bid_id != null AND that bidder's account.status = ACTIVE"
    error_id: ERR_NO_ELIGIBLE_SECOND_BIDDER
    http_status: 422
    applies_to: "POST /confirmations"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- Lots ----
  - method: POST
    path: "/lots"
    description: "Register a new lot from court-order intake."
    roles: [CourtClerk]
    code: 201
    input: ["court_order_no", "asset_profile", "assessment_value_cents", "assessment_report_uri", "encumbrances?", "auction_scheduled_start_at", "inspection_window_start_at", "inspection_window_end_at"]
    output: Lot
    side_effects:
      - "Lot row created with status = REGISTERED; first sibling Auction row created with starting_price via starting_price_calc(round_number=1)."

  - method: GET
    path: "/lots/{lot_id}"
    description: "Fetch a lot."
    roles: [CourtClerk, AuctionAdmin, Bidder, Observer]
    code: 200
    input: []
    output: Lot
    side_effects: []

  - method: GET
    path: "/lots"
    description: "List lots with pagination."
    roles: [CourtClerk, AuctionAdmin, Bidder, Observer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Lot[]"
    side_effects: []

  - method: POST
    path: "/lots/{lot_id}/announce"
    description: "Publish auction announcement; starts statutory notice clock."
    roles: [CourtClerk]
    code: 200
    input: []
    output: Lot
    side_effects:
      - "Lot.status DRAFT/REGISTERED → ANNOUNCED."
      - "Auction.deposit_amount_cents pinned via deposit_amount_calc."

  - method: POST
    path: "/lots/{lot_id}/inspection-windows"
    description: "Add an additional inspection window."
    roles: [CourtClerk, AuctionAdmin]
    code: 201
    input: [start_at, end_at]
    output: Lot
    side_effects: []

  - method: POST
    path: "/lots/{lot_id}/withdraw"
    description: "Withdraw the lot before any LIVE auction."
    roles: [CourtClerk]
    code: 200
    input: ["reason?"]
    output: Lot
    side_effects:
      - "Lot.status → WITHDRAWN."

  # ---- Bidder accounts ----
  - method: POST
    path: "/bidder-accounts"
    description: "Register a bidder with real-name authentication."
    roles: [AuctionAdmin]
    code: 201
    input: ["real_name", "id_document_no", "ip_fingerprint?"]
    output: BidderAccount
    side_effects: []

  - method: GET
    path: "/bidder-accounts/{account_id}"
    description: "Fetch a bidder account."
    roles: [AuctionAdmin, CourtClerk, Bidder]
    code: 200
    input: []
    output: BidderAccount
    side_effects: []

  - method: POST
    path: "/bidder-accounts/{account_id}/clear"
    description: "Clear a SUSPENDED account after investigation."
    roles: [CourtClerk]
    code: 200
    input: [investigation_resolved]
    output: BidderAccount
    side_effects:
      - "BidderAccount.status SUSPENDED → ACTIVE."

  # ---- Auctions ----
  - method: GET
    path: "/auctions/{auction_id}"
    description: "Fetch an auction; bidder identities masked unless caller is CourtClerk."
    roles: [CourtClerk, AuctionAdmin, Bidder, Observer]
    code: 200
    input: []
    output: Auction
    side_effects: []

  - method: POST
    path: "/auctions/{auction_id}/open"
    description: "Open the auction for live bidding."
    roles: [AuctionAdmin]
    code: 200
    input: []
    output: Auction
    side_effects:
      - "Auction.status SCHEDULED → LIVE; Auction.effective_end_at = scheduled_end_at."

  - method: POST
    path: "/auctions/{auction_id}/cancel"
    description: "Cancel a SCHEDULED auction with no bids."
    roles: [CourtClerk]
    code: 200
    input: [reason]
    output: Auction
    side_effects:
      - "Auction.status SCHEDULED → CANCELLED; cascade refund all PAID deposits."

  - method: GET
    path: "/auctions/{auction_id}/bids"
    description: "List bids on an auction; masks bidder identity for non-CourtClerk callers."
    roles: [CourtClerk, AuctionAdmin, Bidder, Observer]
    code: 200
    input: ["limit?", "offset?", "validity?"]
    output: "Bid[]"
    side_effects: []

  - method: POST
    path: "/auctions/{auction_id}/system-rollback"
    description: "Operator-invoked system-fault rollback: marks the most-recent N bids as ROLLED_BACK and recomputes current_high."
    roles: [AuctionAdmin]
    code: 200
    input: [last_n_bids, fault_reason]
    output: Auction
    side_effects:
      - "Bids in last_n_bids → validity = ROLLED_BACK; current_high_cents and highest_bid_id recomputed from remaining VALID bids; soft_close_extension NOT applied for rolled-back triggers; emit AuditEvent.kind = SYSTEM_FAULT_ROLLBACK."

  # ---- Deposits ----
  - method: POST
    path: "/deposits"
    description: "Post a deposit (PENDING) for a bidder on an auction."
    roles: [Bidder, AuctionAdmin]
    code: 201
    input: [auction_id, bidder_account_id]
    output: Deposit
    side_effects:
      - "Deposit row created with amount_cents = Auction.deposit_amount_cents."

  - method: POST
    path: "/deposits/{deposit_id}/pay"
    description: "Mark deposit PAID (escrow received funds)."
    roles: [Bidder]
    code: 200
    input: []
    output: Deposit
    side_effects:
      - "Deposit.status PENDING → PAID."

  - method: POST
    path: "/deposits/{deposit_id}/raise-dispute"
    description: "Raise refund-delay dispute after refund_due_at elapsed."
    roles: [Bidder]
    code: 200
    input: ["dispute_note?"]
    output: Deposit
    side_effects:
      - "Deposit.status PAID → DISPUTED."

  - method: POST
    path: "/deposits/{deposit_id}/resolve-dispute"
    description: "Resolve dispute and complete refund."
    roles: [CourtClerk]
    code: 200
    input: ["resolution_note?"]
    output: Deposit
    side_effects:
      - "Deposit.status DISPUTED → REFUNDED."

  # ---- Bids ----
  - method: POST
    path: "/bids"
    description: "Place a bid; runs bid_increment_ladder, soft_close_extension, collusion_risk_score, and may auto-suspend/block the bidder."
    roles: [Bidder]
    code: 201
    input: [auction_id, amount_cents, client_seq_no]
    output: Bid
    side_effects:
      - "Bid row created with validity = VALID; Auction.current_high_cents, highest_bid_id, second_highest_bid_id updated."
      - "soft_close_extension may push Auction.effective_end_at."
      - "collusion_risk_score recomputed on bidder; may flip BidderAccount.status to SUSPENDED or BLOCKED."
      - "Emit AuditEvent.kind = BID_PLACED."

  # ---- Confirmations ----
  - method: POST
    path: "/confirmations"
    description: "Create a DRAFT confirmation for a SOLD auction; supports use_second_bidder flag for forfeiture-fallback flow."
    roles: [CourtClerk]
    code: 201
    input: ["auction_id", "ruling_document_uri", "use_second_bidder?"]
    output: Confirmation
    side_effects:
      - "Confirmation row created with winning_bid_id resolved from Auction.highest_bid_id (or second_highest_bid_id when use_second_bidder = true)."

  - method: POST
    path: "/confirmations/{confirmation_id}/issue"
    description: "Issue the court confirmation ruling."
    roles: [CourtClerk]
    code: 200
    input: []
    output: Confirmation
    side_effects:
      - "Confirmation.status DRAFT → ISSUED; Payment row created (balance_due_calc); win-notice queued in AuditEvent."

  - method: POST
    path: "/confirmations/{confirmation_id}/fail"
    description: "Fail the confirmation (collusion/disqualification/court override) — triggers re-auction."
    roles: [CourtClerk]
    code: 200
    input: [failure_reason]
    output: Confirmation
    side_effects:
      - "Confirmation.status DRAFT → FAILED; Lot.round_number increments and new Auction row created (subject to ERR_REAUCTION_LIMIT_REACHED)."

  - method: POST
    path: "/confirmations/{confirmation_id}/seal"
    description: "Seal the confirmation into the court file."
    roles: [CourtClerk]
    code: 200
    input: []
    output: Confirmation
    side_effects:
      - "Confirmation.status ISSUED → SEALED."

  # ---- Payments ----
  - method: GET
    path: "/payments/{payment_id}"
    description: "Fetch payment; on read, penalty_accrued_cents recomputed from current clock."
    roles: [CourtClerk, AuctionAdmin, Bidder]
    code: 200
    input: []
    output: Payment
    side_effects:
      - "Refresh Payment.penalty_accrued_cents via late_payment_penalty."

  - method: POST
    path: "/payments/{payment_id}/settle"
    description: "Settle balance + accrued penalty in full; partial payments rejected."
    roles: [Bidder]
    code: 200
    input: [amount_cents]
    output: Payment
    side_effects:
      - "Payment.status → PAID; receipt_no minted."

  - method: POST
    path: "/payments/{payment_id}/extend"
    description: "Court grants grace extension on an OVERDUE payment."
    roles: [CourtClerk]
    code: 200
    input: [extension_days]
    output: Payment
    side_effects:
      - "Payment.status OVERDUE → PENDING; due_at = now + extension_days."

  - method: POST
    path: "/payments/{payment_id}/forfeit"
    description: "Forfeit an OVERDUE payment past GRACE_FORFEITURE_DAYS."
    roles: [CourtClerk]
    code: 200
    input: []
    output: Payment
    side_effects:
      - "Payment.status OVERDUE → FORFEITED; winner Deposit → FORFEITED; new Auction round created."

  # ---- Transfer orders ----
  - method: POST
    path: "/transfer-orders"
    description: "Initiate a transfer order against a paid Confirmation."
    roles: [AuctionAdmin]
    code: 201
    input: ["confirmation_id", "handover_scheduled_at", "transfer_instrument_uri", "tenancy_cleared?"]
    output: TransferOrder
    side_effects:
      - "TransferOrder row created with counterpart_agency derived from Lot.asset_profile."

  - method: POST
    path: "/transfer-orders/{transfer_order_id}/notify-agency"
    description: "Notify counterpart registry of pending transfer."
    roles: [AuctionAdmin]
    code: 200
    input: []
    output: TransferOrder
    side_effects:
      - "TransferOrder.status INITIATED → AGENCY_NOTIFIED."

  - method: POST
    path: "/transfer-orders/{transfer_order_id}/complete-handover"
    description: "Mark physical handover done."
    roles: [AuctionAdmin]
    code: 200
    input: ["tenancy_cleared?"]
    output: TransferOrder
    side_effects:
      - "TransferOrder.status AGENCY_NOTIFIED → HANDOVER_DONE."

  - method: POST
    path: "/transfer-orders/{transfer_order_id}/confirm-completion"
    description: "Court confirms transfer is complete; cascades Lot → TRANSFERRED."
    roles: [CourtClerk]
    code: 200
    input: []
    output: TransferOrder
    side_effects:
      - "TransferOrder.status HANDOVER_DONE → COMPLETED; Lot.status AUCTIONED → TRANSFERRED."

  - method: POST
    path: "/transfer-orders/{transfer_order_id}/block"
    description: "Block transfer with reason (e.g., agency rejection, tenancy issue)."
    roles: [AuctionAdmin]
    code: 200
    input: [blocked_reason]
    output: TransferOrder
    side_effects:
      - "TransferOrder.status AGENCY_NOTIFIED → BLOCKED."

  # ---- Audit events ----
  - method: GET
    path: "/audit-events"
    description: "Query audit events; filter by subject_entity, kind, time range."
    roles: [CourtClerk]
    code: 200
    input: ["subject_entity?", "subject_id?", "kind?", "since?", "until?", "limit?", "offset?"]
    output: "AuditEvent[]"
    side_effects: []

  # ---- Test-driving / time control ----
  - method: POST
    path: "/_clock/advance"
    description: "Advance simulated server clock to the given ISO 8601 UTC instant (test/automation only). Triggers any time-gated auto-transitions (auction close, payment OVERDUE)."
    roles: [AuctionAdmin, CourtClerk]
    code: 200
    input: [to]
    output: null
    side_effects:
      - "Drive any clock-gated transitions: LIVE→{SOLD,UNSOLD} when now >= effective_end_at; PENDING→OVERDUE on Payment when now > due_at."

  - method: POST
    path: "/_sweep/refunds"
    description: "Run the periodic refund sweep that finalizes pending REFUNDED state for non-winners (test/automation only)."
    roles: [AuctionAdmin]
    code: 200
    input: []
    output: null
    side_effects:
      - "Cascade-refund any PAID deposits whose Auction is in SOLD/UNSOLD/CANCELLED but whose Deposit.status is still PAID."

  - method: POST
    path: "/_events/emit"
    description: "External-event ingestion endpoint (test/automation only) — used by tests to simulate counterpart-agency callback, payment-gateway callback, or court-system event."
    roles: [AuctionAdmin]
    code: 202
    input: [source, kind, payload]
    output: null
    side_effects:
      - "Routed to internal handler keyed on (source, kind); e.g., payment-gateway 'received' callback flips Payment via internal settle path."

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  - id: ERR_AUTH_MISSING
    http: 401
    condition: "X-User-ID or X-User-Role header missing or empty."
  - id: ERR_AUTH_FORBIDDEN
    http: 403
    condition: "Acting role is not authorized for this endpoint per RBAC matrix."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource id does not exist."
  - id: ERR_VALIDATION
    http: 422
    condition: "Generic request-body validation failure (missing required field, wrong type, malformed enum)."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a valid state for this transition."
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Optimistic concurrency control — supplied version does not match server version."
  - id: ERR_DUPLICATE
    http: 409
    condition: "Uniqueness constraint violated (e.g., duplicate court_order_no, id_document_no)."
  - id: ERR_BIDDER_NOT_ACTIVE
    http: 403
    condition: "Acting BidderAccount.status is not ACTIVE."
  - id: ERR_STATUTORY_NOTICE_INSUFFICIENT
    http: 422
    condition: "Auction announcement issued less than 15 days before auction_scheduled_start_at."
  - id: ERR_WINNER_DISQUALIFIED
    http: 422
    condition: "Confirmation target winner is BLOCKED or risk score >= COLLUSION_BLOCK_THRESHOLD."
  - id: ERR_INSPECTION_OVERLAPS_AUCTION
    http: 422
    condition: "inspection_window_end_at >= auction_scheduled_start_at."
  - id: ERR_INSPECTION_WINDOW_CONFLICT
    http: 409
    condition: "New inspection window touches or overlaps an existing one (closed-interval semantics)."
  - id: ERR_HANDOVER_AGENCY_BUSY
    http: 409
    condition: "Another handover on same counterpart_agency within HANDOVER_BUFFER_HOURS (half-open interval semantics)."
  - id: ERR_BID_NOT_ABOVE_HIGH
    http: 422
    condition: "Bid amount below current_high + bid_increment_ladder.min_next_bid."
  - id: ERR_BID_AT_OR_ABOVE_CAP
    http: 422
    condition: "Bid amount strictly above Auction.bid_cap_cents."
  - id: ERR_DEPOSIT_NOT_PAID
    http: 422
    condition: "Bidder has no PAID Deposit on this Auction."
  - id: ERR_PARTIAL_PAYMENT_REJECTED
    http: 422
    condition: "Settle amount less than balance_due_cents + penalty_accrued_cents."
  - id: ERR_DEPOSIT_DEADLINE_PASSED
    http: 422
    condition: "POST /deposits/{id}/pay after Auction.deposit_deadline_at."
  - id: ERR_TENANCY_NOT_CLEARED
    http: 422
    condition: "TransferOrder.complete-handover on REAL_ESTATE without tenancy_cleared = true."
  - id: ERR_REAUCTION_LIMIT_REACHED
    http: 409
    condition: "Lot.round_number already at 3; no further re-auction allowed."
  - id: ERR_NO_VALID_BIDS
    http: 422
    condition: "POST /confirmations against Auction whose current_high_cents is null."
  - id: ERR_NO_ELIGIBLE_SECOND_BIDDER
    http: 422
    condition: "use_second_bidder=true but second_highest_bid_id null or bidder not ACTIVE."
  - id: ERR_PAYMENT_FORFEITED
    http: 409
    condition: "Settlement attempted on a FORFEITED Payment."
  - id: ERR_DEPOSIT_ALREADY_REFUNDED
    http: 409
    condition: "Dispute raised on a Deposit whose status already advanced to REFUNDED."
  - id: ERR_DEPOSIT_DUPLICATE
    http: 409
    condition: "(auction_id, bidder_account_id) uniqueness violated."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:

  - name: CourtClerk
    description: "Judicial officer of the court. Performs intake, announcement, confirmation, sealing, and grace/forfeit decisions. May not place bids."
    identity: "opaque"
    exclusive_operations:
      - "POST /lots"
      - "POST /lots/{id}/announce"
      - "POST /lots/{id}/withdraw"
      - "POST /auctions/{id}/cancel"
      - "POST /confirmations"
      - "POST /confirmations/{id}/issue"
      - "POST /confirmations/{id}/fail"
      - "POST /confirmations/{id}/seal"
      - "POST /payments/{id}/extend"
      - "POST /payments/{id}/forfeit"
      - "POST /deposits/{id}/resolve-dispute"
      - "POST /transfer-orders/{id}/confirm-completion"
      - "POST /bidder-accounts/{id}/clear"
      - "GET  /audit-events"
    shared_operations:
      - "GET /lots, GET /lots/{id}"
      - "GET /auctions/{id}, GET /auctions/{id}/bids (un-masked view)"
      - "POST /lots/{id}/inspection-windows"
      - "GET /bidder-accounts/{id}"
      - "GET /payments/{id}"
      - "POST /_clock/advance"

  - name: AuctionAdmin
    description: "Platform operator running live auction sessions, deposit posting, transfer-order orchestration, and audit-event ingestion. May not issue or fail rulings."
    identity: "opaque"
    exclusive_operations:
      - "POST /bidder-accounts"
      - "POST /auctions/{id}/open"
      - "POST /auctions/{id}/system-rollback"
      - "POST /transfer-orders"
      - "POST /transfer-orders/{id}/notify-agency"
      - "POST /transfer-orders/{id}/complete-handover"
      - "POST /transfer-orders/{id}/block"
      - "POST /_sweep/refunds"
      - "POST /_events/emit"
    shared_operations:
      - "GET /lots, GET /lots/{id}"
      - "POST /lots/{id}/inspection-windows"
      - "GET /auctions/{id}, GET /auctions/{id}/bids (masked view)"
      - "POST /deposits"
      - "GET /bidder-accounts/{id}"
      - "GET /payments/{id}"
      - "POST /_clock/advance"

  - name: Bidder
    description: "Authenticated participant with a real-name-authenticated BidderAccount. Places bids, pays/refunds/disputes deposits, settles balance payments. May not perform court or operator actions."
    identity: "entity_backed:BidderAccount"
    exclusive_operations:
      - "POST /bids"
      - "POST /deposits/{id}/pay"
      - "POST /deposits/{id}/raise-dispute"
      - "POST /payments/{id}/settle"
    shared_operations:
      - "GET /lots, GET /lots/{id}"
      - "GET /auctions/{id}, GET /auctions/{id}/bids (masked view — bidder sees only own un-masked bid)"
      - "POST /deposits (only for own bidder_account_id; ownership check via X-User-ID == BidderAccount.id)"
      - "GET /bidder-accounts/{id} (only own)"
      - "GET /payments/{id} (only own)"

  - name: Observer
    description: "Non-participant read-only viewer (e.g., press, public). Sees the masked bid feed and lot listings but cannot bid, deposit, settle, or see bidder identities."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "GET /lots, GET /lots/{id}"
      - "GET /auctions/{id}, GET /auctions/{id}/bids (masked view)"

# =============================================================================
# Segregation-of-duties invariants (cross-role guarantees)
# =============================================================================
# - CourtClerk MUST NOT appear on POST /bids, POST /deposits/{id}/pay, or
#   POST /payments/{id}/settle. AuctionAdmin MUST NOT appear on POST
#   /confirmations/* or POST /payments/{id}/forfeit. The test layer asserts
#   ERR_AUTH_FORBIDDEN on the prohibited pairings.
