      - name: abort_payout_multiply_then_floor_then_minfloor_rounding_order
        grounds:
          - calculations.abort_compensation_cents
          - state_machines.DonationVisit.OBSERVATION_to_ABORTED_REACTION
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. The scaffold pins
          "multiply first, then floor, then apply the minimum-payout floor":
          floor(3000 * 200/690) == 869 (NOT 870 from round-half-up, NOT 800 from
          floor-division-first 3000//690=4 then *200), and floor(3000 * 100/690) == 434
          which is then lifted to the MIN_ABORT_PAYOUT_CENTS floor of 500. Two aborted
          visits of the same donor pin both rounding artifacts.
