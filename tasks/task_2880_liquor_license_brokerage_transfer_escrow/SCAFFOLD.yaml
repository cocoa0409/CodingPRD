scenario: |
  2880. Liquor License Brokerage & Transfer Escrow (liquor license brokerage): license inventory by county quota and market pricing, buyer qualification and premises suitability pre-check, purchase agreement with escrow deposit and contingency on regulator approval, application preparation, publication/posting and protest response, landlord consent, zoning conditional-use and distance-restriction verification, escrow release conditioned on license transfer approval, failed-transfer refund and safekeeping/nonuse extension filing, brokerage commission and dual-agency disclosure

domain_name: liquor-license-brokerage
api_prefix: ""          # flat topology: every collection is a root-level path (/licenses, /listings, /purchase-agreements, ...)

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked purely by foreign keys in request bodies; no entity is
  # nested inside another entity's URL path. The only sub-resource paths are
  # read-only reverse-reachability lists (escrow ledger, protests, disclosures,
  # safekeeping filings).

  state_machine_shape: parallel
  # PurchaseAgreement carries two independent dimensions (agreement_status x
  # escrow_status). TransferApplication is cyclic (UNDER_REVIEW -> DEFICIENT ->
  # SUBMITTED revision rounds). Protest is branching (OPEN -> RESPONDED ->
  # {SUSTAINED, OVERRULED}) driven entirely by a cascade from the regulator
  # decision.

  relationship_patterns:
    - one_to_many          # County -> License, PurchaseAgreement -> EscrowLedgerEntry
    - cross_aggregate      # TransferApplication reaches License, Premises and County state
    - polymorphic_actor    # opaque analyst / escrow-officer ids stored beside entity-backed party ids

  role_model: segregation_of_duties
  # The analyst who accepts an application for review may never issue its
  # decision; the broker who drafts the agreement may never settle escrow.

  consistency_model: saga
  # Escrow deposit -> transfer application -> regulator decision -> escrow
  # settlement is a long-running saga whose compensation (refund / forfeit)
  # must leave named conserved quantities exactly where they started.

  difficulty_level: expert_plus

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# 1.1 Entity-Relationship Table
# =====================================================================
entities:

  - name: County
    parent: null
    common_fields: true
    fields:
      - name: county_code
        type: string
        source: input
        description: "Short county identifier used on filings"
        constraints: "2-8 chars, unique across County"
      - name: name
        type: string
        source: input
        description: "County display name"
      - name: state_code
        type: string
        source: input
        description: "Two-letter state code; compared against BuyerProfile.residency_state in the qualification score"
        constraints: "exactly 2 uppercase letters"
      - name: quota_licenses_total
        type: integer
        source: input
        description: "Statutory ceiling on how many quota-counted licenses may exist in this county"
        constraints: ">= 1"
      - name: permitted_zoning_codes
        type: array
        source: input
        description: "Zoning codes in which a licensed premises may operate without rezoning"
        default: ["C1", "C2", "MU1"]
      - name: distance_min_feet_school
        type: integer
        source: input
        description: "Minimum lawful distance in feet from the nearest school"
        default: 600
      - name: distance_min_feet_church
        type: integer
        source: input
        description: "Minimum lawful distance in feet from the nearest place of worship"
        default: 600
      - name: posting_period_days
        type: integer
        source: input
        description: "Length in days of the statutory publication/posting window opened by post-notice"
        default: 30
      - name: protest_window_days
        type: integer
        source: input
        description: "Days after posting starts during which a protest may still be accepted; protest_deadline_at is derived from posting_started_at plus min(posting_period_days, protest_window_days)"
        default: 30
      - name: transfer_fee_bps
        type: integer
        source: input
        description: "County transfer fee in basis points of purchase_price_cents, taken first in the escrow disbursement waterfall"
        default: 150
      - name: default_valuation_basis
        type: enum
        source: input
        description: "Valuation variant applied by listing activation when the caller omits valuation_basis"
        default: COMPARABLE_SALES
        constraints: "one of {COMPARABLE_SALES, INCOME_MULTIPLE}"
      - name: quota_licenses_counted
        type: integer
        source: computed
        description: "count(License where county_id == this.id AND counts_against_quota == true AND status IN {ACTIVE, IN_ESCROW, SAFEKEEPING, TRANSFERRED}); recomputed on every License create and every License.status change"
      - name: quota_available
        type: integer
        source: computed
        description: "max(0, quota_licenses_total - quota_licenses_counted)"
      - name: quota_utilization_bps
        type: integer
        source: computed
        description: "round_half_up(quota_licenses_counted * 10000 / quota_licenses_total); 10000 when quota_licenses_total == 0"
      - name: escrow_committed_count
        type: integer
        source: computed
        description: "count(License where county_id == this.id AND status == IN_ESCROW); conserved quantity of the execute/refund compensating pair"

  - name: SellerProfile
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered name of the selling licensee"
      - name: contact_email
        type: string
        source: input
        description: "Contact address for escrow and regulator correspondence"
      - name: tax_clearance_status
        type: enum
        source: input
        description: "State tax clearance standing of the seller; must be CLEARED before a transfer application may be filed"
        default: PENDING
        constraints: "one of {PENDING, CLEARED, DELINQUENT}"

  - name: BuyerProfile
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered name of the applicant buyer"
      - name: entity_type
        type: enum
        source: input
        description: "Legal form of the buyer"
        constraints: "one of {INDIVIDUAL, LLC, CORP}"
      - name: residency_state
        type: string
        source: input
        description: "Two-letter state code of buyer residency/registration"
        constraints: "exactly 2 uppercase letters"
      - name: felony_disclosure
        type: boolean
        source: input
        description: "True when the buyer disclosed a felony conviction"
        default: false
      - name: prior_revocation_count
        type: integer
        source: input
        description: "Number of previously revoked licenses held by this buyer"
        default: 0
        constraints: ">= 0"
      - name: citizenship_verified
        type: boolean
        source: input
        description: "True when citizenship/lawful-presence documents are on file"
        default: false
      - name: qualification_score
        type: integer
        source: computed
        description: "Output of the buyer_qualification_score calculation for the most recent review; null until the first qualification review"
      - name: qualification_status
        type: enum
        source: computed
        description: "Band derived from qualification_score, with the DISQUALIFIED override"
        default: NOT_REVIEWED
        constraints: "one of {NOT_REVIEWED, QUALIFIED, PROVISIONALLY_QUALIFIED, UNQUALIFIED, DISQUALIFIED}"
      - name: qualification_mode
        type: enum
        source: computed
        description: "Which variant produced the stored score"
        default: null
        constraints: "one of {PRE_CHECK, FINAL_REVIEW} or null"
      - name: qualification_reviewed_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the most recent qualification review; null until first review"

  - name: Brokerage
    parent: null
    common_fields: true
    fields:
      - name: firm_name
        type: string
        source: input
        description: "Brokerage firm name"
      - name: state_broker_license_no
        type: string
        source: input
        description: "State broker license number of the firm"
        constraints: "unique across Brokerage"
      - name: commission_rate_bps
        type: integer
        source: input
        description: "Commission in basis points of purchase_price_cents"
        constraints: "100 <= commission_rate_bps <= 1500"
      - name: dual_agency_policy
        type: enum
        source: input
        description: "Whether this firm may represent both sides of one agreement"
        default: ALLOWED_WITH_DISCLOSURE
        constraints: "one of {PROHIBITED, ALLOWED_WITH_DISCLOSURE}"

  - name: License
    parent: null
    common_fields: true
    fields:
      - name: county_id
        type: string
        source: input
        description: "FK -> County.id; the county whose quota, distance minima and fees govern this license"
      - name: owner_seller_id
        type: string
        source: input
        description: "FK -> SellerProfile.id; current licensee of record"
      - name: transferred_to_buyer_id
        type: string
        source: computed
        description: "FK -> BuyerProfile.id; set only by the APPROVED-decision cascade when ownership moves; null otherwise"
        default: null
      - name: license_number
        type: string
        source: input
        description: "State license number"
        constraints: "unique across License"
      - name: license_class
        type: enum
        source: input
        description: "License class; drives class filing fee and escrow deposit surcharge"
        constraints: "one of {CLASS_47_ONSALE_GENERAL, CLASS_21_OFFSALE_GENERAL, CLASS_41_ONSALE_BEER_WINE}"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state; see the License state machine"
        default: ACTIVE
        constraints: "one of {ACTIVE, IN_ESCROW, SAFEKEEPING, TRANSFERRED}"
      - name: annual_gross_receipts_cents
        type: integer
        source: input
        description: "Trailing-twelve-month gross receipts of the licensed business; sole input of the INCOME_MULTIPLE valuation variant"
        constraints: ">= 0"
      - name: last_transfer_price_cents
        type: integer
        source: input
        description: "Price the license last changed hands for; a license with a non-null value is a comparable for the COMPARABLE_SALES valuation variant"
        default: null
      - name: last_active_date
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD, UTC) the licensed premises last operated; start of the nonuse clock"
      - name: counts_against_quota
        type: boolean
        source: input
        description: "False only for grandfathered non-quota licenses; quota arithmetic ignores those rows"
        default: true
      - name: safekeeping_expires_at
        type: datetime
        source: computed
        description: "End of the currently granted safekeeping window; null when the license has never been placed in safekeeping"
        default: null
      - name: safekeeping_extensions_count
        type: integer
        source: computed
        description: "Number of GRANTED EXTENSION filings applied to this license"
        default: 0
      - name: safekeeping_filing_pending
        type: boolean
        source: computed
        description: "True while a SafekeepingFiling on this license is PENDING; blocks listing activation"
        default: false

  - name: Premises
    parent: null
    common_fields: true
    fields:
      - name: buyer_id
        type: string
        source: input
        description: "FK -> BuyerProfile.id; prospective operator of this location"
      - name: county_id
        type: string
        source: input
        description: "FK -> County.id; supplies the distance minima and permitted zoning codes used by the suitability evaluation"
      - name: address_line
        type: string
        source: input
        description: "Street address of the proposed premises"
      - name: zoning_code
        type: string
        source: input
        description: "Current zoning designation of the parcel"
      - name: distance_to_nearest_school_feet
        type: integer
        source: input
        description: "Measured walking distance in feet to the nearest school"
        constraints: ">= 0"
      - name: distance_to_nearest_church_feet
        type: integer
        source: input
        description: "Measured walking distance in feet to the nearest place of worship"
        constraints: ">= 0"
      - name: census_tract_undue_concentration
        type: boolean
        source: input
        description: "True when the census tract already exceeds the per-capita license concentration ratio"
        default: false
      - name: conditional_use_permit_status
        type: enum
        source: system
        description: "Local conditional-use permit standing; only zoning verification may change it"
        default: REQUIRED_NOT_FILED
        constraints: "one of {NOT_REQUIRED, REQUIRED_NOT_FILED, PENDING, GRANTED, DENIED}"
      - name: landlord_consent_status
        type: enum
        source: system
        description: "Landlord consent standing; only the landlord-consent endpoint may change it"
        default: PENDING
        constraints: "one of {NOT_REQUIRED, PENDING, GRANTED, REFUSED}"
      - name: consent_document_ref
        type: string
        source: input
        description: "Opaque reference to the stored landlord consent instrument"
        default: null
      - name: suitability_status
        type: enum
        source: computed
        description: "Output of premises_suitability_evaluation; recomputed on create, zoning verification and landlord consent"
        constraints: "one of {SUITABLE, CONDITIONAL, UNSUITABLE}"
      - name: suitability_reason_code
        type: enum
        source: computed
        description: "First rule in the pinned suitability ladder that fired; NONE when SUITABLE"
        constraints: "one of {NONE, SCHOOL_DISTANCE, CHURCH_DISTANCE, CUP_DENIED, ZONING_NOT_PERMITTED, LANDLORD_REFUSED, CUP_OUTSTANDING, UNDUE_CONCENTRATION, LANDLORD_PENDING}"

  - name: Listing
    parent: null
    common_fields: true
    fields:
      - name: license_id
        type: string
        source: input
        description: "FK -> License.id; the license offered for sale"
      - name: brokerage_id
        type: string
        source: input
        description: "FK -> Brokerage.id; listing firm"
      - name: ask_price_cents
        type: integer
        source: input
        description: "Seller's asking price"
        constraints: ">= 100000"
      - name: status
        type: enum
        source: system
        description: "Listing lifecycle state; see the Listing state machine"
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, UNDER_CONTRACT, WITHDRAWN, SOLD}"
      - name: valuation_basis
        type: enum
        source: computed
        description: "Variant actually applied at activation; null while DRAFT"
        default: null
        constraints: "one of {COMPARABLE_SALES, INCOME_MULTIPLE} or null"
      - name: market_price_cents
        type: integer
        source: computed
        description: "Output of listing_market_valuation under valuation_basis, frozen at activation"
        default: null
      - name: scarcity_bps_at_activation
        type: integer
        source: computed
        description: "quota_scarcity_multiplier of the license's county, snapshotted at activation and reused by escrow_deposit_requirement"
        default: null
      - name: comp_count_at_activation
        type: integer
        source: computed
        description: "Size of the comparable set used at activation; 0 means the COMP_FLOOR_CENTS fallback was applied"
        default: null
      - name: open_offer_count
        type: integer
        source: computed
        description: "count(PurchaseAgreement where listing_id == this.id AND agreement_status == DRAFT); competing offers are legitimate, so this counter (and Listing.version) advances on every agreement create"
        default: 0
      - name: activated_at
        type: datetime
        source: computed
        description: "Logical-clock instant of activation; null while DRAFT"
        default: null

  - name: PurchaseAgreement
    parent: null
    common_fields: true
    fields:
      - name: listing_id
        type: string
        source: input
        description: "FK -> Listing.id; the listing being offered on"
      - name: buyer_id
        type: string
        source: input
        description: "FK -> BuyerProfile.id; offering buyer"
      - name: premises_id
        type: string
        source: input
        description: "FK -> Premises.id; the location the license would be transferred to"
      - name: brokerage_id
        type: string
        source: computed
        description: "FK -> Brokerage.id; copied from Listing[listing_id].brokerage_id at create"
      - name: license_id
        type: string
        source: computed
        description: "FK -> License.id; copied from Listing[listing_id].license_id at create"
      - name: seller_id
        type: string
        source: computed
        description: "FK -> SellerProfile.id; copied from License[license_id].owner_seller_id at create"
      - name: purchase_price_cents
        type: integer
        source: input
        description: "Agreed price for the license"
        constraints: ">= 100000"
      - name: deposit_pct_bps
        type: integer
        source: input
        description: "Buyer's offered deposit rate in basis points, before class surcharge and scarcity uplift"
        constraints: "500 <= deposit_pct_bps <= 3500 (the raw request rate; the class surcharge and scarcity uplift may push the effective rate above this, which is why escrow_deposit_requirement clamps at EFFECTIVE_BPS_CAP)"
      - name: required_deposit_cents
        type: integer
        source: computed
        description: "Output of escrow_deposit_requirement, frozen at create; the escrow deposit must match it to the cent"
      - name: closing_window_start
        type: datetime
        source: input
        description: "Start of the transfer window this agreement reserves on License[license_id]"
      - name: contingency_days
        type: integer
        source: input
        description: "Length in days of the regulator-approval contingency window"
        default: 120
        constraints: "30 <= contingency_days <= 365"
      - name: contingency_deadline_at
        type: datetime
        source: computed
        description: "closing_window_start + contingency_days days; end (exclusive) of the reserved window on the license"
      - name: agreement_status
        type: enum
        source: system
        description: "Contract dimension of the parallel state machine"
        default: DRAFT
        constraints: "one of {DRAFT, EXECUTED, CLOSED, TERMINATED}"
      - name: escrow_status
        type: enum
        source: system
        description: "Money dimension of the parallel state machine; evolves independently of agreement_status"
        default: AWAITING_DEPOSIT
        constraints: "one of {AWAITING_DEPOSIT, HELD, RELEASED, REFUNDED, FORFEITED}"
      - name: escrow_balance_cents
        type: integer
        source: computed
        description: "sum(EscrowLedgerEntry.amount_cents where agreement_id == this.id); 0 before the deposit and 0 again after any settlement"
        default: 0
      - name: commission_mode
        type: enum
        source: computed
        description: "Frozen at execute from the FULLY_ACKED DualAgencyDisclosure: DUAL_AGENCY when represents_seller AND represents_buyer, else SINGLE_AGENCY"
        default: null
        constraints: "one of {SINGLE_AGENCY, DUAL_AGENCY} or null"
      - name: commission_total_cents
        type: integer
        source: computed
        description: "Output of commission_disbursement, written only by the RELEASE settlement branch"
        default: null
      - name: county_transfer_fee_cents
        type: integer
        source: computed
        description: "First bucket of the disbursement waterfall, written only by the RELEASE settlement branch"
        default: null
      - name: seller_net_cents
        type: integer
        source: computed
        description: "Residual bucket of the disbursement waterfall, written only by the RELEASE settlement branch"
        default: null
      - name: executed_at
        type: datetime
        source: computed
        description: "Logical-clock instant of execution; null while DRAFT"
        default: null
      - name: settled_at
        type: datetime
        source: computed
        description: "Logical-clock instant escrow left HELD; null until settlement"
        default: null
      - name: termination_reason
        type: string
        source: computed
        description: "Free text recorded by terminate, or the cascade label written by a REFUND/FORFEIT settlement"
        default: null

  - name: DualAgencyDisclosure
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> PurchaseAgreement.id; the agreement this disclosure covers"
      - name: represents_seller
        type: boolean
        source: input
        description: "True when the listing brokerage represents the seller on this agreement"
      - name: represents_buyer
        type: boolean
        source: input
        description: "True when the same brokerage also represents the buyer"
      - name: disclosure_text_ref
        type: string
        source: input
        description: "Opaque reference to the signed disclosure instrument"
        default: null
      - name: seller_ack_at
        type: datetime
        source: computed
        description: "Logical-clock instant the seller acknowledged; null until then"
        default: null
      - name: buyer_ack_at
        type: datetime
        source: computed
        description: "Logical-clock instant the buyer acknowledged; null until then"
        default: null
      - name: status
        type: enum
        source: computed
        description: "FULLY_ACKED once every represented party has acknowledged; VOID once the covered agreement reaches TERMINATED"
        default: PENDING_ACKS
        constraints: "one of {PENDING_ACKS, FULLY_ACKED, VOID}"

  - name: TransferApplication
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> PurchaseAgreement.id; the executed agreement this application implements"
      - name: license_id
        type: string
        source: computed
        description: "FK -> License.id; copied from PurchaseAgreement[agreement_id].license_id at create"
      - name: premises_id
        type: string
        source: computed
        description: "FK -> Premises.id; copied from PurchaseAgreement[agreement_id].premises_id at create"
      - name: status
        type: enum
        source: system
        description: "Application lifecycle; cyclic through DEFICIENT"
        default: SUBMITTED
        constraints: "one of {SUBMITTED, UNDER_REVIEW, DEFICIENT, POSTED, PROTESTED, APPROVED, DENIED}"
      - name: applicant_statement_ref
        type: string
        source: input
        description: "Opaque reference to the prepared application packet"
        default: null
      - name: filing_fee_cents
        type: integer
        source: computed
        description: "Output of transfer_filing_fee, recomputed on every create and resubmit"
      - name: fee_paid_cents
        type: integer
        source: input
        description: "Amount the broker tenders with this filing; must equal filing_fee_cents exactly"
      - name: fee_paid_total_cents
        type: integer
        source: computed
        description: "Running sum of accepted fee_paid_cents across the create and every resubmit"
      - name: deficiency_round_count
        type: integer
        source: computed
        description: "Number of deficiency notices issued so far; feeds transfer_filing_fee and is capped by MAX_DEFICIENCY_ROUNDS"
        default: 0
      - name: accepted_by_analyst_id
        type: string
        source: computed
        description: "Opaque X-User-ID of the RegulatorAnalyst who accepted the application for review; the segregation-of-duties comparand at decision time"
        default: null
      - name: last_deficiency_codes
        type: array
        source: computed
        description: "Codes from the most recent deficiency notice"
        default: null
      - name: posting_started_at
        type: datetime
        source: computed
        description: "Logical-clock instant post-notice opened the publication window; null before posting"
        default: null
      - name: posting_ends_at
        type: datetime
        source: computed
        description: "posting_started_at + County.posting_period_days days; the decision requires the clock to be strictly past it"
        default: null
      - name: protest_deadline_at
        type: datetime
        source: computed
        description: "posting_started_at + min(County.posting_period_days, County.protest_window_days) days; last instant a protest is accepted"
        default: null
      - name: decision
        type: enum
        source: computed
        description: "Regulator outcome; null until decided"
        default: null
        constraints: "one of {APPROVED, DENIED} or null"
      - name: decided_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the decision; null until decided"
        default: null
      - name: decision_note
        type: string
        source: input
        description: "Analyst note recorded with the decision"
        default: null

  - name: Protest
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> TransferApplication.id; the posted application being protested"
      - name: protestant_name
        type: string
        source: input
        description: "Name of the protesting party of record"
      - name: grounds
        type: enum
        source: input
        description: "Statutory ground asserted by the protestant"
        constraints: "one of {UNDUE_CONCENTRATION, DISTANCE_RESTRICTION, PUBLIC_WELFARE, ZONING}"
      - name: filed_at
        type: datetime
        source: computed
        description: "Logical-clock instant the protest was accepted"
      - name: response_due_at
        type: datetime
        source: computed
        description: "filed_at + response_due_days days; the broker response must land at or before it"
      - name: response_text_ref
        type: string
        source: input
        description: "Opaque reference to the broker's filed response"
        default: null
      - name: response_submitted_at
        type: datetime
        source: computed
        description: "Logical-clock instant the response was accepted; null while OPEN"
        default: null
      - name: status
        type: enum
        source: system
        description: "OPEN on filing, RESPONDED once answered, then resolved by the decision cascade"
        default: OPEN
        constraints: "one of {OPEN, RESPONDED, SUSTAINED, OVERRULED}"

  - name: EscrowLedgerEntry
    parent: PurchaseAgreement
    common_fields: false
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> PurchaseAgreement.id; the escrow this movement belongs to"
      - name: entry_type
        type: enum
        source: system
        description: "Which escrow movement this row records"
        constraints: "one of {DEPOSIT, RELEASE_COUNTY_FEE, RELEASE_COMMISSION, RELEASE_SELLER, REFUND_BUYER, FORFEIT_SELLER}"
      - name: amount_cents
        type: integer
        source: system
        description: "Signed movement: positive for DEPOSIT, negative for every disbursement, refund and forfeit row"
      - name: balance_after_cents
        type: integer
        source: system
        description: "Escrow balance after this row, in append order (occurred_at ASC, created_at ASC)"
      - name: memo
        type: string
        source: system
        description: "Human-readable label of the movement"
      - name: occurred_at
        type: datetime
        source: system
        description: "Logical-clock instant the movement was booked"

  - name: SafekeepingFiling
    parent: null
    common_fields: true
    fields:
      - name: license_id
        type: string
        source: input
        description: "FK -> License.id; the license to be held in safekeeping"
      - name: filing_type
        type: enum
        source: input
        description: "INITIAL places an idle license into safekeeping; EXTENSION prolongs an existing window"
        constraints: "one of {INITIAL, EXTENSION}"
      - name: requested_months
        type: integer
        source: input
        description: "Months of safekeeping requested by the filer"
        constraints: "1 <= requested_months <= 24"
      - name: extension_index
        type: integer
        source: computed
        description: "0 for INITIAL, else License.safekeeping_extensions_count + 1 at filing time; selects the doubling fee step"
      - name: granted_months
        type: integer
        source: computed
        description: "min(requested_months, SAFEKEEPING_INITIAL_MAX_MONTHS or EXTENSION_MAX_MONTHS); computed at filing, applied on GRANTED"
      - name: effective_from
        type: datetime
        source: computed
        description: "Clock instant of filing for INITIAL; License.safekeeping_expires_at for EXTENSION"
      - name: expires_at
        type: datetime
        source: computed
        description: "effective_from plus granted_months calendar months"
      - name: fee_cents
        type: integer
        source: computed
        description: "SAFEKEEPING_BASE_FEE_CENTS * 2^extension_index"
      - name: status
        type: enum
        source: system
        description: "PENDING on filing, then the analyst decision"
        default: PENDING
        constraints: "one of {PENDING, GRANTED, DENIED}"
      - name: decided_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the analyst decision; null while PENDING"
        default: null

# =====================================================================
# 1.2 State Machine Table
# =====================================================================
state_machines:

  - entity: License
    initial_state: ACTIVE
    terminal_states: [TRANSFERRED]
    transitions:
      - from: ACTIVE
        to: IN_ESCROW
        trigger: "POST /purchase-agreements/{agreement_id}/execute"
        actor: system
        preconditions:
          - "License[agreement.license_id].status == ACTIVE"
          - "agreement.escrow_status == HELD"
        side_effects:
          - "County[license.county_id].escrow_committed_count recomputed (rises by 1 for a counted license)"
          - "License.version incremented by 1"
        note: "Direct effect of execute, alongside Listing -> UNDER_CONTRACT; not a chained hop."
      - from: SAFEKEEPING
        to: IN_ESCROW
        trigger: "POST /purchase-agreements/{agreement_id}/execute"
        actor: system
        preconditions:
          - "License[agreement.license_id].status == SAFEKEEPING"
          - "License.safekeeping_filing_pending == false"
          - "agreement.escrow_status == HELD"
        side_effects:
          - "County[license.county_id].escrow_committed_count recomputed (rises by 1)"
          - "License.safekeeping_expires_at retained unchanged so the window can be restored if the transfer fails"
          - "License.version incremented by 1"
      - from: IN_ESCROW
        to: TRANSFERRED
        trigger: "APPROVED-decision cascade hop 2 (fires because hop 1 set TransferApplication.status = APPROVED)"
        actor: system
        preconditions:
          - "TransferApplication[application.id].status == APPROVED (written by hop 1)"
          - "License.status == IN_ESCROW"
        side_effects:
          - "License.transferred_to_buyer_id := agreement.buyer_id"
          - "License.last_transfer_price_cents := agreement.purchase_price_cents (the license becomes a comparable for future COMPARABLE_SALES valuations in its county and class)"
          - "County[license.county_id].escrow_committed_count recomputed (falls by 1); quota_licenses_counted unchanged because TRANSFERRED still counts against quota"
          - "License.version incremented by 1"
          - "hop 3 follows: because License.status is now TRANSFERRED, Listing[agreement.listing_id] moves UNDER_CONTRACT -> SOLD"
      - from: IN_ESCROW
        to: ACTIVE
        trigger: "REFUND/FORFEIT settlement cascade hop 3 (fires because hop 2 set PurchaseAgreement.agreement_status = TERMINATED)"
        actor: system
        preconditions:
          - "PurchaseAgreement[agreement.id].agreement_status == TERMINATED (written by hop 2)"
          - "License.safekeeping_expires_at IS NULL OR clock_now >= License.safekeeping_expires_at"
        side_effects:
          - "County[license.county_id].escrow_committed_count recomputed (falls by 1)"
          - "License.version incremented by 1"
          - "hop 4 follows: because License.status returned to ACTIVE, Listing[agreement.listing_id] moves UNDER_CONTRACT -> ACTIVE"
      - from: IN_ESCROW
        to: SAFEKEEPING
        trigger: "REFUND/FORFEIT settlement cascade hop 3 (conditional variant)"
        actor: system
        preconditions:
          - "PurchaseAgreement[agreement.id].agreement_status == TERMINATED (written by hop 2)"
          - "License.safekeeping_expires_at IS NOT NULL AND clock_now < License.safekeeping_expires_at"
        side_effects:
          - "County[license.county_id].escrow_committed_count recomputed (falls by 1)"
          - "License.version incremented by 1"
          - "hop 4 follows: because License.status returned to SAFEKEEPING, Listing[agreement.listing_id] moves UNDER_CONTRACT -> ACTIVE"
        note: "Conditional cascade: the pre-escrow safekeeping window is restored only while it has not yet lapsed on the logical clock."
      - from: ACTIVE
        to: SAFEKEEPING
        trigger: "POST /safekeeping-filings/{filing_id}/decide with decision=GRANT on an INITIAL filing"
        actor: system
        preconditions:
          - "SafekeepingFiling.status transitions PENDING -> GRANTED"
          - "SafekeepingFiling.filing_type == INITIAL"
          - "License.status == ACTIVE"
        side_effects:
          - "License.safekeeping_expires_at := filing.expires_at"
          - "License.safekeeping_filing_pending := false"
          - "License.version incremented by 1"
      - from: SAFEKEEPING
        to: SAFEKEEPING
        trigger: "POST /safekeeping-filings/{filing_id}/decide with decision=GRANT on an EXTENSION filing"
        actor: system
        preconditions:
          - "SafekeepingFiling.filing_type == EXTENSION"
          - "License.status == SAFEKEEPING"
          - "License.safekeeping_extensions_count < 2"
        side_effects:
          - "License.safekeeping_expires_at := filing.expires_at (filing.effective_from was the prior expiry, so windows are chained, never overlapped)"
          - "License.safekeeping_extensions_count incremented by 1"
          - "License.safekeeping_filing_pending := false"
          - "License.version incremented by 1"
        note: "Self-loop: the safekeeping window is prolonged without leaving the state."

  - entity: Listing
    initial_state: DRAFT
    terminal_states: [WITHDRAWN, SOLD]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /listings/{listing_id}/activate"
        actor: Broker
        preconditions:
          - "License[listing.license_id].status IN {ACTIVE, SAFEKEEPING}"
          - "License.safekeeping_filing_pending == false"
          - "SellerProfile[license.owner_seller_id].tax_clearance_status == CLEARED"
          - "no other Listing with the same license_id has status IN {ACTIVE, UNDER_CONTRACT}"
        side_effects:
          - "Listing.valuation_basis := request valuation_basis, else County.default_valuation_basis"
          - "Listing.scarcity_bps_at_activation := quota_scarcity_multiplier(County[license.county_id])"
          - "Listing.comp_count_at_activation and Listing.market_price_cents := listing_market_valuation output"
          - "Listing.activated_at := clock_now; Listing.version incremented by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /listings/{listing_id}/withdraw"
        actor: Broker
        preconditions:
          - "Listing.open_offer_count == 0"
        side_effects:
          - "Listing.version incremented by 1"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /listings/{listing_id}/withdraw"
        actor: Broker
        preconditions:
          - "Listing.open_offer_count == 0"
        side_effects:
          - "Listing.version incremented by 1"
      - from: ACTIVE
        to: UNDER_CONTRACT
        trigger: "POST /purchase-agreements/{agreement_id}/execute"
        actor: system
        preconditions:
          - "Listing.status == ACTIVE"
          - "agreement.listing_id == Listing.id"
        side_effects:
          - "Listing.version incremented by 1"
          - "sibling DRAFT agreements on this listing stay DRAFT and can no longer execute because this precondition now fails"
      - from: UNDER_CONTRACT
        to: SOLD
        trigger: "APPROVED-decision cascade hop 3 (fires because hop 2 set License.status = TRANSFERRED)"
        actor: system
        preconditions:
          - "License[listing.license_id].status == TRANSFERRED (written by hop 2)"
        side_effects:
          - "Listing.version incremented by 1"
          - "hop 4 follows: because Listing.status is now SOLD, PurchaseAgreement moves EXECUTED -> CLOSED"
      - from: UNDER_CONTRACT
        to: ACTIVE
        trigger: "REFUND/FORFEIT settlement cascade hop 4 (fires because hop 3 returned License.status to ACTIVE or SAFEKEEPING)"
        actor: system
        preconditions:
          - "License[listing.license_id].status IN {ACTIVE, SAFEKEEPING} (written by hop 3)"
        side_effects:
          - "Listing.open_offer_count recomputed over remaining DRAFT agreements"
          - "Listing.version incremented by 1"

  - entity: PurchaseAgreement
    dimension: agreement_status
    initial_state: DRAFT
    terminal_states: [CLOSED, TERMINATED]
    transitions:
      - from: DRAFT
        to: EXECUTED
        trigger: "POST /purchase-agreements/{agreement_id}/execute"
        actor: Broker
        preconditions:
          - "PurchaseAgreement.escrow_status == HELD (cross-dimension guard inside the same row)"
          - "DualAgencyDisclosure with agreement_id == this.id exists and status == FULLY_ACKED"
          - "BuyerProfile[buyer_id].qualification_status IN {QUALIFIED, PROVISIONALLY_QUALIFIED}"
          - "Premises[premises_id].suitability_status IN {SUITABLE, CONDITIONAL}"
          - "Listing[listing_id].status == ACTIVE"
          - "License[license_id].status IN {ACTIVE, SAFEKEEPING}"
          - "clock_now < PurchaseAgreement.contingency_deadline_at"
        side_effects:
          - "PurchaseAgreement.executed_at := clock_now"
          - "PurchaseAgreement.commission_mode := DUAL_AGENCY when the FULLY_ACKED disclosure has represents_seller AND represents_buyer, else SINGLE_AGENCY"
          - "License[license_id] moves ACTIVE|SAFEKEEPING -> IN_ESCROW"
          - "Listing[listing_id] moves ACTIVE -> UNDER_CONTRACT"
          - "PurchaseAgreement.version incremented by 1"
      - from: DRAFT
        to: TERMINATED
        trigger: "POST /purchase-agreements/{agreement_id}/terminate"
        actor: Broker
        preconditions:
          - "PurchaseAgreement.escrow_status == AWAITING_DEPOSIT (nothing is held, so no settlement is owed)"
        side_effects:
          - "PurchaseAgreement.termination_reason := request reason"
          - "every DualAgencyDisclosure with agreement_id == this.id and status IN {PENDING_ACKS, FULLY_ACKED} moves to VOID"
          - "Listing[listing_id].open_offer_count recomputed (falls by 1); Listing.version incremented by 1"
          - "PurchaseAgreement.version incremented by 1"
      - from: EXECUTED
        to: CLOSED
        trigger: "APPROVED-decision cascade hop 4 (fires because hop 3 set Listing.status = SOLD)"
        actor: system
        preconditions:
          - "Listing[listing_id].status == SOLD (written by hop 3)"
        side_effects:
          - "PurchaseAgreement.version incremented by 1"
          - "hop 5 follows: because the agreement is now CLOSED, every Protest on the application with status IN {OPEN, RESPONDED} moves to OVERRULED"
        note: "escrow_status is deliberately still HELD here - the money dimension only moves when the escrow officer settles."
      - from: EXECUTED
        to: TERMINATED
        trigger: "REFUND/FORFEIT settlement cascade hop 2 (fires because hop 1 moved escrow_status out of HELD)"
        actor: system
        preconditions:
          - "PurchaseAgreement.escrow_status IN {REFUNDED, FORFEITED} (written by hop 1)"
        side_effects:
          - "PurchaseAgreement.termination_reason := 'ESCROW_REFUNDED' for REFUND, 'ESCROW_FORFEITED' for FORFEIT"
          - "every DualAgencyDisclosure with agreement_id == this.id and status IN {PENDING_ACKS, FULLY_ACKED} moves to VOID"
          - "PurchaseAgreement.version incremented by 1"
          - "hop 3 follows: because the agreement is now TERMINATED, License[license_id] leaves IN_ESCROW for ACTIVE or SAFEKEEPING"

  - entity: PurchaseAgreement
    dimension: escrow_status
    initial_state: AWAITING_DEPOSIT
    terminal_states: [RELEASED, REFUNDED, FORFEITED]
    transitions:
      - from: AWAITING_DEPOSIT
        to: HELD
        trigger: "POST /purchase-agreements/{agreement_id}/escrow-deposit"
        actor: Buyer
        preconditions:
          - "PurchaseAgreement.agreement_status == DRAFT"
          - "request amount_cents == PurchaseAgreement.required_deposit_cents"
        side_effects:
          - "EscrowLedgerEntry appended: entry_type DEPOSIT, amount_cents = +amount, balance_after_cents = amount, occurred_at = clock_now"
          - "PurchaseAgreement.escrow_balance_cents recomputed from the ledger"
          - "PurchaseAgreement.version incremented by 1"
        note: "The money dimension advances while agreement_status is still DRAFT - the two dimensions are independent."
      - from: HELD
        to: RELEASED
        trigger: "POST /purchase-agreements/{agreement_id}/escrow-settlement with disposition=RELEASE"
        actor: EscrowOfficer
        preconditions:
          - "PurchaseAgreement.agreement_status == CLOSED"
          - "TransferApplication with agreement_id == this.id has status == APPROVED"
          - "seller_net_cents computed by commission_disbursement is >= 0"
        side_effects:
          - "PurchaseAgreement.county_transfer_fee_cents, commission_total_cents and seller_net_cents := commission_disbursement outputs"
          - "three EscrowLedgerEntry rows appended in this pinned order: RELEASE_COUNTY_FEE, RELEASE_COMMISSION, RELEASE_SELLER, each with a negative amount_cents and a decreasing balance_after_cents"
          - "PurchaseAgreement.escrow_balance_cents recomputed to 0; settled_at := clock_now"
          - "PurchaseAgreement.version incremented by 1"
      - from: HELD
        to: REFUNDED
        trigger: "POST /purchase-agreements/{agreement_id}/escrow-settlement with disposition=REFUND"
        actor: EscrowOfficer
        preconditions:
          - "TransferApplication with agreement_id == this.id has status == DENIED"
        side_effects:
          - "EscrowLedgerEntry appended: entry_type REFUND_BUYER, amount_cents = -escrow_balance_cents, balance_after_cents = 0"
          - "PurchaseAgreement.escrow_balance_cents recomputed to 0; settled_at := clock_now"
          - "commission_total_cents, county_transfer_fee_cents and seller_net_cents stay null - no commission is earned on a failed transfer"
          - "PurchaseAgreement.version incremented by 1"
          - "hop 2 follows: because escrow_status left HELD for REFUNDED, agreement_status moves EXECUTED -> TERMINATED"
      - from: HELD
        to: FORFEITED
        trigger: "POST /purchase-agreements/{agreement_id}/escrow-settlement with disposition=FORFEIT"
        actor: EscrowOfficer
        preconditions:
          - "clock_now > PurchaseAgreement.contingency_deadline_at"
          - "TransferApplication with agreement_id == this.id has status IN {SUBMITTED, UNDER_REVIEW, DEFICIENT, POSTED, PROTESTED}"
        side_effects:
          - "EscrowLedgerEntry appended: entry_type FORFEIT_SELLER, amount_cents = -escrow_balance_cents, balance_after_cents = 0"
          - "PurchaseAgreement.escrow_balance_cents recomputed to 0; settled_at := clock_now"
          - "PurchaseAgreement.version incremented by 1"
          - "hop 2 follows: because escrow_status left HELD for FORFEITED, agreement_status moves EXECUTED -> TERMINATED"
        note: "Divergent branch of the same fork: the buyer loses the deposit to the seller instead of recovering it, and no commission line is ever written."

  - entity: TransferApplication
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /transfer-applications/{application_id}/accept-review"
        actor: RegulatorAnalyst
        preconditions:
          - "TransferApplication.status == SUBMITTED"
        side_effects:
          - "TransferApplication.accepted_by_analyst_id := X-User-ID of the accepting analyst"
          - "TransferApplication.version incremented by 1"
      - from: UNDER_REVIEW
        to: DEFICIENT
        trigger: "POST /transfer-applications/{application_id}/deficiency"
        actor: RegulatorAnalyst
        preconditions:
          - "TransferApplication.deficiency_round_count < 2"
        side_effects:
          - "TransferApplication.deficiency_round_count incremented by 1"
          - "TransferApplication.last_deficiency_codes := request deficiency_codes"
          - "TransferApplication.version incremented by 1"
      - from: DEFICIENT
        to: SUBMITTED
        trigger: "POST /transfer-applications/{application_id}/resubmit"
        actor: Broker
        preconditions:
          - "clock_now <= PurchaseAgreement[agreement_id].contingency_deadline_at"
          - "request fee_paid_cents == transfer_filing_fee recomputed at the current deficiency_round_count"
        side_effects:
          - "TransferApplication.filing_fee_cents := recomputed fee"
          - "TransferApplication.fee_paid_total_cents += request fee_paid_cents"
          - "TransferApplication.accepted_by_analyst_id retained, so the segregation-of-duties comparand survives the revision loop"
          - "TransferApplication.version incremented by 1"
        note: "Revision cycle: SUBMITTED -> UNDER_REVIEW -> DEFICIENT -> SUBMITTED, at most twice."
      - from: UNDER_REVIEW
        to: POSTED
        trigger: "POST /transfer-applications/{application_id}/post-notice"
        actor: RegulatorAnalyst
        preconditions:
          - "Premises[premises_id].suitability_status IN {SUITABLE, CONDITIONAL}"
          - "Premises[premises_id].conditional_use_permit_status IN {NOT_REQUIRED, GRANTED}"
          - "Premises.distance_to_nearest_school_feet >= County.distance_min_feet_school AND Premises.distance_to_nearest_church_feet >= County.distance_min_feet_church"
          - "no other TransferApplication on the same premises_id with status IN {POSTED, PROTESTED, APPROVED} has a posting interval colliding under the buffered rule"
        side_effects:
          - "TransferApplication.posting_started_at := clock_now"
          - "TransferApplication.posting_ends_at := posting_started_at + County.posting_period_days days"
          - "TransferApplication.protest_deadline_at := posting_started_at + min(County.posting_period_days, County.protest_window_days) days"
          - "TransferApplication.version incremented by 1"
      - from: POSTED
        to: PROTESTED
        trigger: "POST /protests (side effect of accepting a protest against this application)"
        actor: system
        preconditions:
          - "TransferApplication.status == POSTED"
          - "clock_now <= TransferApplication.protest_deadline_at"
        side_effects:
          - "TransferApplication.version incremented by 1"
      - from: POSTED
        to: APPROVED
        trigger: "POST /transfer-applications/{application_id}/decision with decision=APPROVED"
        actor: RegulatorAnalyst
        preconditions:
          - "clock_now > TransferApplication.posting_ends_at"
          - "X-User-ID != TransferApplication.accepted_by_analyst_id"
        side_effects:
          - "TransferApplication.decision := APPROVED; decided_at := clock_now"
          - "hop 2 follows: because the application is now APPROVED, License[license_id] moves IN_ESCROW -> TRANSFERRED"
          - "TransferApplication.version incremented by 1"
      - from: PROTESTED
        to: APPROVED
        trigger: "POST /transfer-applications/{application_id}/decision with decision=APPROVED"
        actor: RegulatorAnalyst
        preconditions:
          - "clock_now > TransferApplication.posting_ends_at"
          - "X-User-ID != TransferApplication.accepted_by_analyst_id"
          - "every Protest with application_id == this.id has status == RESPONDED"
        side_effects:
          - "TransferApplication.decision := APPROVED; decided_at := clock_now"
          - "hop 2 follows: because the application is now APPROVED, License[license_id] moves IN_ESCROW -> TRANSFERRED"
          - "TransferApplication.version incremented by 1"
      - from: POSTED
        to: DENIED
        trigger: "POST /transfer-applications/{application_id}/decision with decision=DENIED"
        actor: RegulatorAnalyst
        preconditions:
          - "clock_now > TransferApplication.posting_ends_at"
          - "X-User-ID != TransferApplication.accepted_by_analyst_id"
        side_effects:
          - "TransferApplication.decision := DENIED; decided_at := clock_now"
          - "License[license_id] stays IN_ESCROW until the escrow officer refunds - denial alone never moves the license"
          - "TransferApplication.version incremented by 1"
      - from: PROTESTED
        to: DENIED
        trigger: "POST /transfer-applications/{application_id}/decision with decision=DENIED"
        actor: RegulatorAnalyst
        preconditions:
          - "clock_now > TransferApplication.posting_ends_at"
          - "X-User-ID != TransferApplication.accepted_by_analyst_id"
          - "every Protest with application_id == this.id has status == RESPONDED, OR at least one is OPEN with clock_now > its response_due_at"
        side_effects:
          - "TransferApplication.decision := DENIED; decided_at := clock_now"
          - "every Protest with application_id == this.id and status IN {OPEN, RESPONDED} moves to SUSTAINED"
          - "TransferApplication.version incremented by 1"
        note: "Divergent fork branch: the DENIED side sustains the protests and writes no License, Listing or agreement change."

  - entity: Protest
    initial_state: OPEN
    terminal_states: [SUSTAINED, OVERRULED]
    transitions:
      - from: OPEN
        to: RESPONDED
        trigger: "POST /protests/{protest_id}/response"
        actor: Broker
        preconditions:
          - "clock_now <= Protest.response_due_at"
          - "TransferApplication[application_id].status == PROTESTED"
        side_effects:
          - "Protest.response_submitted_at := clock_now; response_text_ref := request value"
          - "Protest.version incremented by 1"
      - from: RESPONDED
        to: OVERRULED
        trigger: "APPROVED-decision cascade hop 5 (fires because hop 4 set PurchaseAgreement.agreement_status = CLOSED)"
        actor: system
        preconditions:
          - "PurchaseAgreement[application.agreement_id].agreement_status == CLOSED (written by hop 4)"
        side_effects:
          - "Protest.version incremented by 1"
      - from: RESPONDED
        to: SUSTAINED
        trigger: "DENIED-decision side effect"
        actor: system
        preconditions:
          - "TransferApplication[application_id].decision == DENIED"
        side_effects:
          - "Protest.version incremented by 1"
      - from: OPEN
        to: SUSTAINED
        trigger: "DENIED-decision side effect on an unanswered protest"
        actor: system
        preconditions:
          - "TransferApplication[application_id].decision == DENIED"
          - "clock_now > Protest.response_due_at"
        side_effects:
          - "Protest.version incremented by 1"

  - entity: SafekeepingFiling
    initial_state: PENDING
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: PENDING
        to: GRANTED
        trigger: "POST /safekeeping-filings/{filing_id}/decide with decision=GRANT"
        actor: RegulatorAnalyst
        preconditions:
          - "SafekeepingFiling.status == PENDING"
          - "License[license_id].status == ACTIVE for INITIAL, or == SAFEKEEPING for EXTENSION"
        side_effects:
          - "SafekeepingFiling.decided_at := clock_now"
          - "License[license_id] applies the granted window (ACTIVE -> SAFEKEEPING for INITIAL, SAFEKEEPING self-loop for EXTENSION)"
          - "License.safekeeping_filing_pending := false; License.version incremented by 1"
      - from: PENDING
        to: DENIED
        trigger: "POST /safekeeping-filings/{filing_id}/decide with decision=DENY"
        actor: RegulatorAnalyst
        preconditions:
          - "SafekeepingFiling.status == PENDING"
        side_effects:
          - "SafekeepingFiling.decided_at := clock_now"
          - "License.safekeeping_filing_pending := false; License.safekeeping_expires_at unchanged; License.version incremented by 1"

# =====================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's version only)
# =====================================================================
concurrency_rules:
  - rule_id: agreement-create-stale-listing
    parent_entity: Listing
    write_endpoint: "POST /purchase-agreements"
    occ_field: "expected_listing_version"
    description: |
      Creating a PurchaseAgreement against a Listing whose version has advanced
      since the client last read it is rejected. Competing DRAFT offers on one
      ACTIVE listing are legitimate product behaviour, so the second create is
      not blocked by any state precondition; it is blocked only because the
      caller's view of the listing (its open_offer_count, market_price_cents and
      scarcity snapshot, all of which feed the deposit requirement) is stale.
    error_id: ERR_STALE_LISTING_VERSION
    http_status: 412

  - rule_id: safekeeping-filing-stale-license
    parent_entity: License
    write_endpoint: "POST /safekeeping-filings"
    occ_field: "expected_license_version"
    description: |
      Filing a SafekeepingFiling against a License whose version has advanced
      since the client last read it is rejected. An EXTENSION filing legitimately
      supersedes the window installed by the prior filing, so a second filing is
      valid product behaviour; it is rejected only when the filer's view of the
      license - its safekeeping_expires_at, extensions_count and pending flag,
      which decide the fee step and the chained effective_from - is stale.
    error_id: ERR_STALE_LICENSE_VERSION
    http_status: 412

# =====================================================================
# 1.3 Calculation Rules Table
# =====================================================================
calculations:

  - name: county_quota_position
    trigger: "On POST /licenses (creation) and on every License.status change (execute, decision cascade, refund/forfeit cascade, safekeeping grant)"
    algorithm: aggregation
    formula: |
      counted = count(License L where L.county_id == C.id
                                 AND L.counts_against_quota == true
                                 AND L.status IN {ACTIVE, IN_ESCROW, SAFEKEEPING, TRANSFERRED})
      C.quota_licenses_counted   = counted
      C.quota_available          = max(0, C.quota_licenses_total - counted)
      C.quota_utilization_bps    = 10000 if C.quota_licenses_total == 0
                                   else round_half_up(counted * 10000 / C.quota_licenses_total)
      C.escrow_committed_count   = count(License L where L.county_id == C.id AND L.status == IN_ESCROW)
    input_set: "All License rows of the county. Rows with counts_against_quota == false are excluded from counted/available/utilization but still counted by escrow_committed_count."
    constants: {}
    precision: "integer counts; quota_utilization_bps is an integer basis-point value, round_half_up"
    variants: []
    note: "TRANSFERRED still occupies quota - a transfer never frees a quota slot, which is why the approval cascade leaves quota_licenses_counted flat while escrow_committed_count falls."

  - name: quota_scarcity_multiplier
    trigger: "Read inside listing_market_valuation and escrow_deposit_requirement; snapshotted into Listing.scarcity_bps_at_activation by POST /listings/{listing_id}/activate"
    algorithm: threshold
    formula: |
      u = County.quota_utilization_bps
      if   u >= 9000: scarcity_bps = 2500
      elif u >= 7500: scarcity_bps = 1200
      elif u >= 5000: scarcity_bps = 500
      else:           scarcity_bps = 0
    input_set: "The county of the subject license only."
    constants:
      TIER_3_MIN_BPS: 9000
      TIER_3_UPLIFT_BPS: 2500
      TIER_2_MIN_BPS: 7500
      TIER_2_UPLIFT_BPS: 1200
      TIER_1_MIN_BPS: 5000
      TIER_1_UPLIFT_BPS: 500
    precision: "integer basis points"
    variants: []
    note: "Inclusive lower bounds: utilization of exactly 9000 bps (9 counted of 10) selects 2500, not 1200."

  - name: listing_market_valuation
    trigger: "POST /listings/{listing_id}/activate (writes Listing.market_price_cents, comp_count_at_activation, scarcity_bps_at_activation) and GET /listings/{listing_id}/valuation-preview (computes both variants without writing)"
    algorithm: comparable_valuation
    formula: |
      sc = quota_scarcity_multiplier(County[license.county_id])

      # comparable set: same county, same class, priced history, excluding the subject
      comps = [L.last_transfer_price_cents for L in License
               where L.county_id == subject.county_id
                 AND L.license_class == subject.license_class
                 AND L.last_transfer_price_cents IS NOT NULL
                 AND L.id != subject.id
                 AND L.status IN {ACTIVE, IN_ESCROW, SAFEKEEPING, TRANSFERRED}]
      sorted_comps = sort(comps) ASC          # numeric sort on the price itself
      n = len(sorted_comps)
      if n == 0:      comp_median_cents = COMP_FLOOR_CENTS
      elif n odd:     comp_median_cents = sorted_comps[(n-1)//2]
      else:           comp_median_cents = round_half_up((sorted_comps[n//2 - 1] + sorted_comps[n//2]) / 2)

      # VARIANT A
      comparable_sales_price_cents = round_half_up(comp_median_cents * (10000 + sc) / 10000)
      # VARIANT B  (single rounding at the very end; multiple first, scarcity second)
      income_multiple_price_cents  = round_half_up(license.annual_gross_receipts_cents
                                                  * AGR_MULTIPLE_BPS / 10000
                                                  * (10000 + sc) / 10000)

      Listing.market_price_cents = comparable_sales_price_cents if basis == COMPARABLE_SALES
                                   else income_multiple_price_cents
      Listing.comp_count_at_activation = n
    input_set: "License rows of the same county and class with a non-null last_transfer_price_cents in a non-retired status; the subject license is always excluded even when it has its own last_transfer_price_cents."
    constants:
      COMP_FLOOR_CENTS: 4500000
      AGR_MULTIPLE_BPS: 1800
    precision: "whole cents, round_half_up; exactly one rounding per variant (plus one for the even-count median)"
    variants:
      - name: COMPARABLE_SALES
        when: "basis resolves to COMPARABLE_SALES (request valuation_basis, else County.default_valuation_basis)"
        difference: "Prices from the median of peer transfer prices; ignores the subject's own receipts entirely, so two licenses with wildly different revenue price identically."
      - name: INCOME_MULTIPLE
        when: "basis resolves to INCOME_MULTIPLE"
        difference: "Prices from 18% of the subject's annual_gross_receipts_cents; ignores every peer sale, so it diverges from COMPARABLE_SALES on identical inventory."
    note: "Dual-variant instance #1 - entity domain: Listing/License market pricing."

  - name: buyer_qualification_score
    trigger: "POST /buyer-profiles/{buyer_id}/qualification-review (writes BuyerProfile.qualification_score, qualification_status, qualification_mode, qualification_reviewed_at)"
    algorithm: weighted_scoring
    formula: |
      base = 100
      base -= REVOCATION_PENALTY * min(BuyerProfile.prior_revocation_count, REVOCATION_PENALTY_CAP_COUNT)
      base -= FELONY_PENALTY        if BuyerProfile.felony_disclosure       else 0
      base -= NO_CITIZENSHIP_PENALTY if not BuyerProfile.citizenship_verified else 0
      base -= NONRESIDENT_PENALTY   if BuyerProfile.residency_state != County[premises.county_id].state_code else 0
      # premises component - the only place the two variants differ
      if mode == PRE_CHECK:
          premises_component = 0
      else:  # FINAL_REVIEW
          premises_component  = -CUP_OUTSTANDING_PENALTY      if Premises.conditional_use_permit_status NOT IN {NOT_REQUIRED, GRANTED} else 0
          premises_component -= LANDLORD_OUTSTANDING_PENALTY  if Premises.landlord_consent_status      NOT IN {NOT_REQUIRED, GRANTED} else 0
      score = max(0, min(100, base + premises_component))

      if BuyerProfile.prior_revocation_count >= DISQUALIFYING_REVOCATIONS
         OR (BuyerProfile.felony_disclosure AND not BuyerProfile.citizenship_verified):
          status = DISQUALIFIED
      elif score >= QUALIFIED_MIN_SCORE:                 status = QUALIFIED
      elif score >= PROVISIONAL_MIN_SCORE:               status = PROVISIONALLY_QUALIFIED
      else:                                              status = UNQUALIFIED
    input_set: "The buyer row plus the Premises named by the required request premises_id (which MUST satisfy Premises.buyer_id == buyer_id) and that premises' county. Both modes read County.state_code for the residency comparison; only FINAL_REVIEW reads the premises' conditional_use_permit_status and landlord_consent_status."
    constants:
      REVOCATION_PENALTY: 25
      REVOCATION_PENALTY_CAP_COUNT: 2
      FELONY_PENALTY: 30
      NO_CITIZENSHIP_PENALTY: 20
      NONRESIDENT_PENALTY: 10
      CUP_OUTSTANDING_PENALTY: 15
      LANDLORD_OUTSTANDING_PENALTY: 15
      QUALIFIED_MIN_SCORE: 70
      PROVISIONAL_MIN_SCORE: 50
      DISQUALIFYING_REVOCATIONS: 2
    precision: "integer score in [0, 100]; band comparisons are inclusive lower bounds (a score of exactly 70 is QUALIFIED)"
    variants:
      - name: PRE_CHECK
        when: "review_mode == PRE_CHECK - the marketing-stage pre-qualification the broker runs before a premises is verified"
        difference: "Treats every unresolved premises condition as neutral (0), so an identical buyer scores strictly higher than under FINAL_REVIEW whenever a permit or consent is outstanding."
      - name: FINAL_REVIEW
        when: "review_mode == FINAL_REVIEW - the regulator's pre-execution review"
        difference: "Charges 15 points for an outstanding conditional-use permit and 15 more for outstanding landlord consent, which can drop the same buyer two bands."
    note: "Dual-variant instance #2 - entity domain: BuyerProfile regulatory risk scoring (not money, not the Listing)."

  - name: premises_suitability_evaluation
    trigger: "POST /premises (create), POST /premises/{premises_id}/zoning-verification, POST /premises/{premises_id}/landlord-consent - each writes Premises.suitability_status and suitability_reason_code"
    algorithm: constraint_propagation
    formula: |
      C = County[premises.county_id]
      # PINNED ladder - the first matching rule wins and sets suitability_reason_code
      1. distance_to_nearest_school_feet < C.distance_min_feet_school -> (UNSUITABLE, SCHOOL_DISTANCE)
      2. distance_to_nearest_church_feet < C.distance_min_feet_church -> (UNSUITABLE, CHURCH_DISTANCE)
      3. conditional_use_permit_status == DENIED                     -> (UNSUITABLE, CUP_DENIED)
      4. zoning_code NOT IN C.permitted_zoning_codes                 -> (UNSUITABLE, ZONING_NOT_PERMITTED)
      5. landlord_consent_status == REFUSED                          -> (UNSUITABLE, LANDLORD_REFUSED)
      6. conditional_use_permit_status IN {REQUIRED_NOT_FILED, PENDING} -> (CONDITIONAL, CUP_OUTSTANDING)
      7. census_tract_undue_concentration == true                    -> (CONDITIONAL, UNDUE_CONCENTRATION)
      8. landlord_consent_status == PENDING                          -> (CONDITIONAL, LANDLORD_PENDING)
      9. otherwise                                                   -> (SUITABLE, NONE)
    input_set: "The premises row and its county's thresholds only; no aggregation over other premises."
    constants: {}
    precision: "n/a (enum output); distance comparisons use strict < against an inclusive minimum, so distance == minimum is lawful"
    variants: []

  - name: escrow_deposit_requirement
    trigger: "POST /purchase-agreements (writes PurchaseAgreement.required_deposit_cents, frozen for the life of the agreement)"
    algorithm: threshold
    formula: |
      class_sur = CLASS_SURCHARGE_BPS[License[listing.license_id].license_class]
      sc        = Listing.scarcity_bps_at_activation        # snapshot, not a live recompute
      effective_bps = min(EFFECTIVE_BPS_CAP,
                          request.deposit_pct_bps + class_sur + floor(sc / SCARCITY_DIVISOR))
      raw_cents     = purchase_price_cents * effective_bps / 10000
      required_deposit_cents = max(DEPOSIT_FLOOR_CENTS,
                                   min(DEPOSIT_CAP_CENTS, round_half_up(raw_cents)))
    input_set: "The request price and deposit rate, the license class of the listed license, and the scarcity value frozen on the listing at activation."
    constants:
      DEPOSIT_FLOOR_CENTS: 500000
      DEPOSIT_CAP_CENTS: 7500000
      EFFECTIVE_BPS_CAP: 3500
      SCARCITY_DIVISOR: 5
      CLASS_SURCHARGE_BPS: { CLASS_47_ONSALE_GENERAL: 300, CLASS_21_OFFSALE_GENERAL: 200, CLASS_41_ONSALE_BEER_WINE: 0 }
    precision: "whole cents, round_half_up applied to raw_cents BEFORE the floor/cap clamp"
    variants: []
    note: "Combinatorial mode (a): four interacting inputs, an enum-keyed branch, an integer division and a nested min/max clamp; the rounding happens inside the clamp, never after it."

  - name: transfer_filing_fee
    trigger: "POST /transfer-applications and POST /transfer-applications/{application_id}/resubmit (both write TransferApplication.filing_fee_cents)"
    algorithm: tiered_pricing
    formula: |
      # PINNED three-step evaluation order. The surcharge tier is keyed on the
      # step-1 subtotal, NOT on the step-3 total, even though the surcharge is a
      # percentage of the fee itself. Any implementation that tiers on the final
      # total produces a different number whenever the subtotal sits just under a
      # tier edge (e.g. subtotal 195000 -> 204750 here vs 210600 under the naive
      # reading).
      step 1: subtotal_cents = FILING_BASE_CENTS
                             + CLASS_FEE_CENTS[License.license_class]
                             + POSTING_FEE_CENTS
                             + RESUBMIT_FEE_CENTS * TransferApplication.deficiency_round_count
      step 2: surcharge_bps  = 800 if subtotal_cents >= EXPEDITE_TIER_2_MIN_CENTS
                          else 500 if subtotal_cents >= EXPEDITE_TIER_1_MIN_CENTS
                          else 200
      step 3: filing_fee_cents = subtotal_cents
                               + round_half_up(subtotal_cents * surcharge_bps / 10000)
    input_set: "The license class of the license under transfer and the application's deficiency_round_count AS IT STANDS WHEN THE FEE IS COMPUTED (0 on create; 1 after the first deficiency notice; 2 after the second)."
    constants:
      FILING_BASE_CENTS: 30000
      POSTING_FEE_CENTS: 15000
      RESUBMIT_FEE_CENTS: 30000
      CLASS_FEE_CENTS: { CLASS_47_ONSALE_GENERAL: 120000, CLASS_21_OFFSALE_GENERAL: 90000, CLASS_41_ONSALE_BEER_WINE: 45000 }
      EXPEDITE_TIER_2_MIN_CENTS: 200000
      EXPEDITE_TIER_1_MIN_CENTS: 120000
    precision: "whole cents, round_half_up on the surcharge only; the subtotal is exact integer arithmetic"
    variants: []
    note: "Combinatorial mode (c): the fee looks self-referential (a percentage of the fee, tiered by the fee) and is made well-defined only by pinning the evaluation order."

  - name: commission_disbursement
    trigger: "POST /purchase-agreements/{agreement_id}/escrow-settlement with disposition=RELEASE (writes county_transfer_fee_cents, commission_total_cents, seller_net_cents and the three RELEASE_* ledger rows)"
    algorithm: waterfall_allocation
    formula: |
      gross_commission = purchase_price_cents * Brokerage.commission_rate_bps / 10000   # exact rational, NOT yet rounded

      # PINNED rounding order: round EACH commission line to whole cents, THEN sum.
      if commission_mode == DUAL_AGENCY:
          seller_side_line_cents = round_half_up(gross_commission * (10000 - DUAL_AGENCY_SPLIT_BPS) / 10000)
          buyer_side_line_cents  = round_half_up(gross_commission * DUAL_AGENCY_SPLIT_BPS / 10000)
          commission_total_cents = seller_side_line_cents + buyer_side_line_cents
      else:  # SINGLE_AGENCY - one line only
          seller_side_line_cents = round_half_up(gross_commission)
          buyer_side_line_cents  = 0
          commission_total_cents = seller_side_line_cents

      county_transfer_fee_cents = round_half_up(purchase_price_cents * County.transfer_fee_bps / 10000)

      # waterfall over the held escrow balance, in this fixed bucket order
      bucket 1 (county fee):   county_transfer_fee_cents
      bucket 2 (commission):   commission_total_cents
      bucket 3 (seller net):   seller_net_cents = escrow_balance_cents
                                                - county_transfer_fee_cents
                                                - commission_total_cents
      if seller_net_cents < 0: reject with ERR_ESCROW_INSUFFICIENT_FOR_DISBURSEMENT (no ledger row is written)
    input_set: "The agreement's frozen purchase_price_cents and commission_mode, the listing brokerage's commission_rate_bps, the county's transfer_fee_bps, and the escrow balance held at settlement time."
    constants:
      DUAL_AGENCY_SPLIT_BPS: 4000
    precision: "whole cents, round_half_up; round-per-line-then-sum is normative. Sum-then-round is the wrong reading and differs by one cent whenever both split lines land on a half cent."
    variants: []
    note: "Combinatorial mode (b): DUAL_AGENCY and SINGLE_AGENCY on the same price can differ by exactly one cent purely because of where the rounding happens."

  - name: escrow_balance_projection
    trigger: "Recomputed after every EscrowLedgerEntry append (deposit, and each RELEASE_*/REFUND_BUYER/FORFEIT_SELLER row)"
    algorithm: projection
    formula: |
      rows = EscrowLedgerEntry where agreement_id == A.id
             ordered by occurred_at ASC, created_at ASC
      running = 0
      for r in rows:
          running += r.amount_cents
          r.balance_after_cents = running
      A.escrow_balance_cents = running
    input_set: "Every ledger row of the agreement, in append order; no row is ever mutated or deleted, so the projection is a pure replay."
    constants: {}
    precision: "whole cents; signed integers"
    variants: []
    note: "Conserved-quantity anchor: sum(amount_cents) over an agreement's ledger always equals escrow_balance_cents, and equals 0 after any settlement."

  - name: safekeeping_grant
    trigger: "POST /safekeeping-filings (writes extension_index, granted_months, effective_from, expires_at, fee_cents) and applied to the License by POST /safekeeping-filings/{filing_id}/decide with decision=GRANT"
    algorithm: decay_function
    formula: |
      nonuse_days = (date(clock_now) - date(License.last_active_date)) in whole days

      if filing_type == INITIAL:
          require nonuse_days >= NONUSE_GRACE_DAYS      # inclusive: exactly 180 qualifies
          extension_index = 0
          granted_months  = min(requested_months, SAFEKEEPING_INITIAL_MAX_MONTHS)
          effective_from  = clock_now
      else:  # EXTENSION
          require License.safekeeping_extensions_count < MAX_EXTENSIONS
          extension_index = License.safekeeping_extensions_count + 1
          granted_months  = min(requested_months, EXTENSION_MAX_MONTHS)
          effective_from  = License.safekeeping_expires_at      # windows chain, never overlap

      expires_at = effective_from + granted_months calendar months
                   (same day-of-month, clamped to the last day of the target month)
      fee_cents  = SAFEKEEPING_BASE_FEE_CENTS * (2 ** extension_index)
    input_set: "The license's nonuse clock and safekeeping history only."
    constants:
      NONUSE_GRACE_DAYS: 180
      SAFEKEEPING_INITIAL_MAX_MONTHS: 12
      EXTENSION_MAX_MONTHS: 6
      MAX_EXTENSIONS: 2
      SAFEKEEPING_BASE_FEE_CENTS: 20000
    precision: "integer months and whole cents; the day difference is a whole-day UTC date difference, not an hour count"
    variants: []
    note: "Doubling fee steps: 20000 (INITIAL), 40000 (first extension), 80000 (second extension)."

# =====================================================================
# 1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =====================================================================
validations:

  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty (a header whose value is the empty string counts as absent)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 12
    category: auth
    check: "X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 14
    category: auth
    check: "The role is listed in the endpoint's roles set"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 16
    category: business_constraint
    check: "Request body schema: every required field present, every enum value inside its declared set, every integer within its declared range, every datetime a valid ISO-8601 UTC instant, every date a valid YYYY-MM-DD. Also rejects unknown-typed values (string where integer is declared)."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 18
    category: existence
    check: "Every id in the URL path exists, validated left to right"
    error_id: "ERR_<RESOURCE>_NOT_FOUND (ERR_COUNTY_NOT_FOUND, ERR_BUYER_NOT_FOUND, ERR_LICENSE_NOT_FOUND, ERR_LISTING_NOT_FOUND, ERR_AGREEMENT_NOT_FOUND, ERR_DISCLOSURE_NOT_FOUND, ERR_APPLICATION_NOT_FOUND, ERR_PROTEST_NOT_FOUND, ERR_FILING_NOT_FOUND, ERR_PREMISES_NOT_FOUND)"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 20
    category: existence
    check: "Every foreign key in the request body resolves to an existing row, validated in the field order declared by the endpoint's input list"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all write endpoints carrying FK fields"

  - priority: 22
    category: auth
    check: "Ownership for entity-backed roles: Broker's X-User-ID equals the brokerage_id of the listing/agreement/protest being acted on; Buyer's X-User-ID equals the agreement's buyer_id or the premises' buyer_id; Seller's X-User-ID equals the license's owner_seller_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /listings/{listing_id}/activate, POST /listings/{listing_id}/withdraw, POST /purchase-agreements, POST /purchase-agreements/{agreement_id}/execute, POST /purchase-agreements/{agreement_id}/escrow-deposit, POST /purchase-agreements/{agreement_id}/terminate, POST /dual-agency-disclosures, POST /dual-agency-disclosures/{disclosure_id}/acknowledge, POST /transfer-applications, POST /transfer-applications/{application_id}/resubmit, POST /protests/{protest_id}/response, POST /safekeeping-filings"

  - priority: 24
    category: auth
    check: "Segregation of duties: the RegulatorAnalyst issuing a decision must not be the analyst recorded in TransferApplication.accepted_by_analyst_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /transfer-applications/{application_id}/decision"

  - priority: 30
    category: state
    check: "OCC: expected_listing_version equals Listing.version / expected_license_version equals License.version"
    error_id: "ERR_STALE_LISTING_VERSION, ERR_STALE_LICENSE_VERSION"
    http_status: 412
    applies_to: "POST /purchase-agreements, POST /safekeeping-filings"

  - priority: 32
    category: state
    check: "The target row is in a non-terminal state from which this trigger is declared in 1.2 (including the parallel-dimension guards: escrow_status == HELD for execute, agreement_status == CLOSED for RELEASE, escrow_status == AWAITING_DEPOSIT for terminate). Rows already in a terminal state are out of scope here and are refused by priority 34 instead, so this row never returns ERR_ALREADY_TERMINAL and priority 34 is always reachable."
    error_id: "ERR_INVALID_LISTING_STATE, ERR_INVALID_AGREEMENT_STATE, ERR_INVALID_APPLICATION_STATE, ERR_INVALID_PROTEST_STATE, ERR_INVALID_LICENSE_STATE, ERR_ESCROW_NOT_HELD, ERR_ESCROW_ALREADY_SETTLED, ERR_ESCROW_MUST_BE_SETTLED_FIRST"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 34
    category: state
    check: "A row already in a terminal state accepts no further transition (License TRANSFERRED, Listing SOLD/WITHDRAWN, agreement CLOSED/TERMINATED, application APPROVED/DENIED, protest SUSTAINED/OVERRULED, filing GRANTED/DENIED)"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 40
    category: business_safety
    check: "Distance restriction: Premises.distance_to_nearest_school_feet >= County.distance_min_feet_school AND Premises.distance_to_nearest_church_feet >= County.distance_min_feet_church"
    error_id: ERR_DISTANCE_RESTRICTION_VIOLATION
    http_status: 422
    applies_to: "POST /transfer-applications, POST /transfer-applications/{application_id}/post-notice"

  - priority: 42
    category: business_safety
    check: "Premises.suitability_status != UNSUITABLE, and for posting also conditional_use_permit_status IN {NOT_REQUIRED, GRANTED}"
    error_id: ERR_PREMISES_UNSUITABLE
    http_status: 422
    applies_to: "POST /purchase-agreements/{agreement_id}/execute, POST /transfer-applications, POST /transfer-applications/{application_id}/post-notice"

  - priority: 44
    category: business_safety
    check: "BuyerProfile.qualification_status IN {QUALIFIED, PROVISIONALLY_QUALIFIED} (NOT_REVIEWED, UNQUALIFIED and DISQUALIFIED all fail)"
    error_id: ERR_BUYER_NOT_QUALIFIED
    http_status: 422
    applies_to: "POST /purchase-agreements/{agreement_id}/execute, POST /transfer-applications"

  - priority: 50
    category: business_referential
    check: "A DualAgencyDisclosure with this agreement_id exists with status == FULLY_ACKED, and when Brokerage.dual_agency_policy == PROHIBITED it must not have both represents_seller and represents_buyer set"
    error_id: "ERR_DUAL_AGENCY_DISCLOSURE_REQUIRED, ERR_DUAL_AGENCY_PROHIBITED"
    http_status: 422
    applies_to: "POST /purchase-agreements/{agreement_id}/execute, POST /transfer-applications, POST /dual-agency-disclosures"

  - priority: 52
    category: business_referential
    check: "Cross-entity dependency on the settlement disposition: RELEASE requires the agreement's TransferApplication.status == APPROVED; REFUND requires it == DENIED"
    error_id: ERR_TRANSFER_NOT_APPROVED
    http_status: 409
    applies_to: "POST /purchase-agreements/{agreement_id}/escrow-settlement"

  - priority: 54
    category: business_referential
    check: "SellerProfile[license.owner_seller_id].tax_clearance_status == CLEARED"
    error_id: ERR_SELLER_TAX_CLEARANCE_MISSING
    http_status: 422
    applies_to: "POST /listings/{listing_id}/activate, POST /transfer-applications"

  - priority: 56
    category: business_referential
    check: "Acknowledgement party must be represented by the disclosure (party == BUYER requires represents_buyer == true; party == SELLER requires represents_seller == true) and must not have acknowledged already"
    error_id: "ERR_PARTY_NOT_REPRESENTED, ERR_ALREADY_ACKNOWLEDGED"
    http_status: 422
    applies_to: "POST /dual-agency-disclosures/{disclosure_id}/acknowledge"

  - priority: 60
    category: business_constraint
    check: "County.quota_available >= 1 before a new quota-counted License is created"
    error_id: ERR_COUNTY_QUOTA_EXHAUSTED
    http_status: 409
    applies_to: "POST /licenses"

  - priority: 62
    category: business_constraint
    check: "License contract-window overlap: the proposed [closing_window_start, closing_window_start + contingency_days) interval must not intersect the same interval of any other PurchaseAgreement on the same license_id whose agreement_status IN {DRAFT, EXECUTED}. Half-open arithmetic: touching endpoints do not intersect."
    error_id: ERR_LICENSE_CONTRACT_OVERLAP
    http_status: 409
    applies_to: "POST /purchase-agreements"

  - priority: 64
    category: business_constraint
    check: "Premises posting-window collision: for every other TransferApplication on the same premises_id with status IN {POSTED, PROTESTED, APPROVED}, the new posting interval [clock_now, clock_now + posting_period_days] must satisfy clock_now > other.posting_ends_at + POSTING_QUIET_BUFFER_DAYS (30). Closed intervals plus a statutory quiet buffer: equality collides."
    error_id: ERR_POSTING_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /transfer-applications/{application_id}/post-notice"

  - priority: 66
    category: business_constraint
    check: "Deficiency rounds: TransferApplication.deficiency_round_count < 2 before a new deficiency notice is issued"
    error_id: ERR_DEFICIENCY_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /transfer-applications/{application_id}/deficiency"

  - priority: 68
    category: business_constraint
    check: "Safekeeping extensions: License.safekeeping_extensions_count < 2 for an EXTENSION filing; a listing may not be activated while License.safekeeping_filing_pending == true; only one PENDING filing per license"
    error_id: "ERR_SAFEKEEPING_EXTENSION_LIMIT, ERR_SAFEKEEPING_FILING_PENDING"
    http_status: 409
    applies_to: "POST /safekeeping-filings, POST /listings/{listing_id}/activate"

  - priority: 69
    category: business_constraint
    check: "Withdrawing a listing requires Listing.open_offer_count == 0"
    error_id: ERR_LISTING_HAS_OPEN_OFFERS
    http_status: 409
    applies_to: "POST /listings/{listing_id}/withdraw"

  - priority: 70
    category: business_temporal
    check: "Protest acceptance requires clock_now <= TransferApplication.protest_deadline_at; protest response requires clock_now <= Protest.response_due_at"
    error_id: "ERR_PROTEST_WINDOW_CLOSED, ERR_PROTEST_RESPONSE_WINDOW_CLOSED"
    http_status: 409
    applies_to: "POST /protests, POST /protests/{protest_id}/response"

  - priority: 72
    category: business_temporal
    check: "A decision requires clock_now strictly greater than TransferApplication.posting_ends_at (equality is not elapsed)"
    error_id: ERR_POSTING_PERIOD_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /transfer-applications/{application_id}/decision"

  - priority: 73
    category: business_temporal
    check: "Unanswered protest: if any Protest on the application is OPEN and clock_now <= its response_due_at the decision is premature; if any is OPEN and clock_now > its response_due_at the only lawful decision is DENIED"
    error_id: "ERR_PROTEST_RESPONSE_PENDING, ERR_UNANSWERED_PROTEST_REQUIRES_DENIAL"
    http_status: 409
    applies_to: "POST /transfer-applications/{application_id}/decision"

  - priority: 74
    category: business_temporal
    check: "Contingency window: execute and resubmit require clock_now < (execute) or <= (resubmit) PurchaseAgreement.contingency_deadline_at; FORFEIT requires clock_now strictly past it"
    error_id: "ERR_CONTINGENCY_DEADLINE_PASSED, ERR_CONTINGENCY_STILL_OPEN"
    http_status: 409
    applies_to: "POST /purchase-agreements/{agreement_id}/execute, POST /transfer-applications/{application_id}/resubmit, POST /purchase-agreements/{agreement_id}/escrow-settlement"

  - priority: 76
    category: business_temporal
    check: "An INITIAL safekeeping filing requires nonuse_days >= 180 measured from License.last_active_date on the logical clock"
    error_id: ERR_NONUSE_PERIOD_NOT_REACHED
    http_status: 422
    applies_to: "POST /safekeeping-filings"

  - priority: 80
    category: business_fiscal
    check: "The escrow deposit amount_cents must equal PurchaseAgreement.required_deposit_cents exactly"
    error_id: ERR_DEPOSIT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /purchase-agreements/{agreement_id}/escrow-deposit"

  - priority: 82
    category: business_fiscal
    check: "fee_paid_cents must equal the transfer_filing_fee computed for the current deficiency_round_count"
    error_id: ERR_FILING_FEE_MISMATCH
    http_status: 422
    applies_to: "POST /transfer-applications, POST /transfer-applications/{application_id}/resubmit"

  - priority: 84
    category: business_fiscal
    check: "RELEASE disbursement requires seller_net_cents >= 0 after the county fee and commission buckets are taken"
    error_id: ERR_ESCROW_INSUFFICIENT_FOR_DISBURSEMENT
    http_status: 422
    applies_to: "POST /purchase-agreements/{agreement_id}/escrow-settlement"

# =====================================================================
# 1.5 API Endpoint Table
# =====================================================================
# api_prefix is "" so every path below is also the literal URL. Optional
# request fields are suffixed with "?" (quoted, because "?" is a YAML flow
# indicator). Every FK declared in 1.1 is reverse-reachable: single-entity
# GET /<collection>/{id} plus either a filtered list (License, Premises,
# Listing, PurchaseAgreement, TransferApplication) or a parent sub-resource
# list (SafekeepingFiling, DualAgencyDisclosure, EscrowLedgerEntry, Protest).
endpoints:

  # ---------------- County ----------------
  - method: POST
    path: "/counties"
    description: "Register a licensing county: quota ceiling, permitted zoning codes, distance minima, posting/protest windows and the county transfer-fee rate."
    roles: [PlatformAdmin]
    code: 201
    input: [county_code, name, state_code, quota_licenses_total, "permitted_zoning_codes?", "distance_min_feet_school?", "distance_min_feet_church?", "posting_period_days?", "protest_window_days?", "transfer_fee_bps?", "default_valuation_basis?"]
    output: County
    side_effects:
      - "runs county_quota_position with zero licenses: quota_licenses_counted=0, quota_available=quota_licenses_total, quota_utilization_bps=0, escrow_committed_count=0"

  - method: GET
    path: "/counties/{county_id}"
    description: "Read one county including its live quota counters."
    roles: [PlatformAdmin, Broker, Buyer, Seller, RegulatorAnalyst, EscrowOfficer]
    code: 200
    input: []
    output: County
    side_effects: []

  # ---------------- SellerProfile ----------------
  - method: POST
    path: "/seller-profiles"
    description: "Register a selling licensee party. tax_clearance_status defaults to PENDING and gates transfer-application filing."
    roles: [PlatformAdmin, Broker]
    code: 201
    input: [legal_name, contact_email, "tax_clearance_status?"]
    output: SellerProfile
    side_effects: []

  - method: GET
    path: "/seller-profiles/{seller_id}"
    description: "Read one seller profile."
    roles: [PlatformAdmin, Broker, Seller, RegulatorAnalyst, EscrowOfficer]
    code: 200
    input: []
    output: SellerProfile
    side_effects: []

  # ---------------- BuyerProfile ----------------
  - method: POST
    path: "/buyer-profiles"
    description: "Register a prospective transferee. qualification_status starts NOT_REVIEWED; no agreement may be executed until a FINAL_REVIEW qualification lands."
    roles: [PlatformAdmin, Broker]
    code: 201
    input: [legal_name, entity_type, residency_state, "felony_disclosure?", "prior_revocation_count?", "citizenship_verified?"]
    output: BuyerProfile
    side_effects:
      - "sets qualification_status=NOT_REVIEWED, qualification_score=null, qualification_mode=null"

  - method: GET
    path: "/buyer-profiles/{buyer_id}"
    description: "Read one buyer profile including its latest qualification score, mode and status."
    roles: [PlatformAdmin, Broker, Buyer, RegulatorAnalyst, EscrowOfficer]
    code: 200
    input: []
    output: BuyerProfile
    side_effects: []

  - method: POST
    path: "/buyer-profiles/{buyer_id}/qualification-review"
    description: "Regulator scores the buyer against a named premises. review_mode is PRE_CHECK (advisory, statutory disqualifiers only) or FINAL_REVIEW (adds premises-readiness deductions and is the mode agreement execution requires)."
    roles: [RegulatorAnalyst]
    code: 200
    input: [review_mode, premises_id]
    output: BuyerProfile
    side_effects:
      - "runs buyer_qualification_score in the requested variant"
      - "writes qualification_score, qualification_status, qualification_mode, qualification_reviewed_at=clock_now"
      - "increments BuyerProfile.version by 1"

  # ---------------- Brokerage ----------------
  - method: POST
    path: "/brokerages"
    description: "Register a brokerage firm with its commission rate in bps and its dual-agency policy."
    roles: [PlatformAdmin]
    code: 201
    input: [firm_name, state_broker_license_no, commission_rate_bps, "dual_agency_policy?"]
    output: Brokerage
    side_effects: []

  - method: GET
    path: "/brokerages/{brokerage_id}"
    description: "Read one brokerage."
    roles: [PlatformAdmin, Broker, Buyer, Seller, RegulatorAnalyst, EscrowOfficer]
    code: 200
    input: []
    output: Brokerage
    side_effects: []

  # ---------------- License ----------------
  - method: POST
    path: "/licenses"
    description: "Add a license to a county's inventory in ACTIVE status. Rejected when the county's counted licenses would exceed quota_licenses_total."
    roles: [PlatformAdmin]
    code: 201
    input: [county_id, owner_seller_id, license_number, license_class, annual_gross_receipts_cents, last_active_date, "last_transfer_price_cents?", "counts_against_quota?"]
    output: License
    side_effects:
      - "sets status=ACTIVE, transferred_to_buyer_id=null, safekeeping_extensions_count=0, safekeeping_filing_pending=false"
      - "re-runs county_quota_position on County.county_id and rewrites its four quota counters"
      - "increments County.version by 1"

  - method: GET
    path: "/licenses/{license_id}"
    description: "Read one license including safekeeping expiry and extension count."
    roles: [PlatformAdmin, Broker, Buyer, Seller, RegulatorAnalyst, EscrowOfficer]
    code: 200
    input: []
    output: License
    side_effects: []

  - method: GET
    path: "/licenses"
    description: "Filtered, paginated license inventory. Reverse-reachability list for County.id, SellerProfile.id (owner_seller_id) and BuyerProfile.id (transferred_to_buyer_id)."
    roles: [PlatformAdmin, Broker, Buyer, Seller, RegulatorAnalyst, EscrowOfficer]
    code: 200
    input: ["county_id?", "owner_seller_id?", "transferred_to_buyer_id?", "status?", "license_class?", "limit?", "offset?"]
    output: License[]
    side_effects: []

  - method: GET
    path: "/licenses/{license_id}/safekeeping-filings"
    description: "All safekeeping / nonuse-extension filings on one license, created_at ASC. Reverse-reachability list for SafekeepingFiling.license_id."
    roles: [PlatformAdmin, Broker, Seller, RegulatorAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SafekeepingFiling[]
    side_effects: []

  # ---------------- Premises ----------------
  - method: POST
    path: "/premises"
    description: "Register a candidate premises for one buyer in one county with its zoning code and measured distances. conditional_use_permit_status starts REQUIRED_NOT_FILED and landlord_consent_status starts PENDING, so a lawfully-sited premises is computed as (CONDITIONAL, CUP_OUTSTANDING) at creation while a too-close one is (UNSUITABLE, SCHOOL_DISTANCE|CHURCH_DISTANCE) immediately."
    roles: [Broker, Buyer]
    code: 201
    input: [buyer_id, county_id, address_line, zoning_code, distance_to_nearest_school_feet, distance_to_nearest_church_feet, "census_tract_undue_concentration?"]
    output: Premises
    side_effects:
      - "runs premises_suitability_evaluation and writes suitability_status + suitability_reason_code"

  - method: GET
    path: "/premises/{premises_id}"
    description: "Read one premises with its current suitability verdict and reason code."
    roles: [PlatformAdmin, Broker, Buyer, RegulatorAnalyst, EscrowOfficer]
    code: 200
    input: []
    output: Premises
    side_effects: []

  - method: GET
    path: "/premises"
    description: "Filtered, paginated premises list. Reverse-reachability list for BuyerProfile.id (buyer_id) and County.id (county_id)."
    roles: [PlatformAdmin, Broker, Buyer, RegulatorAnalyst, EscrowOfficer]
    code: 200
    input: ["buyer_id?", "county_id?", "suitability_status?", "limit?", "offset?"]
    output: Premises[]
    side_effects: []

  - method: POST
    path: "/premises/{premises_id}/zoning-verification"
    description: "Regulator records the zoning conditional-use outcome and may correct the surveyed zoning code, distances and concentration flag from the field inspection."
    roles: [RegulatorAnalyst]
    code: 200
    input: [conditional_use_permit_status, "zoning_code?", "distance_to_nearest_school_feet?", "distance_to_nearest_church_feet?", "census_tract_undue_concentration?"]
    output: Premises
    side_effects:
      - "overwrites conditional_use_permit_status and any supplied survey fields"
      - "re-runs premises_suitability_evaluation and rewrites suitability_status + suitability_reason_code"
      - "increments Premises.version by 1"

  - method: POST
    path: "/premises/{premises_id}/landlord-consent"
    description: "Record the landlord's written consent decision for the premises lease assignment."
    roles: [Broker, Buyer]
    code: 200
    input: [landlord_consent_status, "consent_document_ref?"]
    output: Premises
    side_effects:
      - "writes landlord_consent_status and consent_document_ref"
      - "re-runs premises_suitability_evaluation and rewrites suitability_status + suitability_reason_code"
      - "increments Premises.version by 1"

  # ---------------- Listing ----------------
  - method: POST
    path: "/listings"
    description: "Create a DRAFT brokerage listing for one license at an ask price. No valuation is computed until activation."
    roles: [Broker]
    code: 201
    input: [license_id, brokerage_id, ask_price_cents]
    output: Listing
    side_effects:
      - "sets status=DRAFT, open_offer_count=0, market_price_cents=null, valuation_basis=null"

  - method: GET
    path: "/listings/{listing_id}"
    description: "Read one listing including its frozen activation-time valuation inputs."
    roles: [PlatformAdmin, Broker, Buyer, Seller, RegulatorAnalyst, EscrowOfficer]
    code: 200
    input: []
    output: Listing
    side_effects: []

  - method: GET
    path: "/listings"
    description: "Filtered, paginated listing list. Reverse-reachability list for License.id (license_id) and Brokerage.id (brokerage_id)."
    roles: [PlatformAdmin, Broker, Buyer, Seller, RegulatorAnalyst, EscrowOfficer]
    code: 200
    input: ["license_id?", "brokerage_id?", "status?", "limit?", "offset?"]
    output: Listing[]
    side_effects: []

  - method: GET
    path: "/listings/{listing_id}/valuation-preview"
    description: "Computed read: runs listing_market_valuation in BOTH variants against the current comparable-sales set and the license's annual gross receipts, without writing anything to the listing. default_valuation_basis echoes the county's configured basis and divergence_cents is exactly income_multiple_price_cents - comparable_sales_price_cents (signed)."
    roles: [PlatformAdmin, Broker, RegulatorAnalyst]
    code: 200
    input: []
    output:
      listing_id: string
      license_id: string
      default_valuation_basis: enum
      comp_count: integer
      comp_median_cents: integer
      scarcity_bps: integer
      comparable_sales_price_cents: integer
      income_multiple_price_cents: integer
      divergence_cents: integer
    side_effects: []

  - method: POST
    path: "/listings/{listing_id}/activate"
    description: "Publish the listing to the market. Freezes the market valuation using valuation_basis (defaulting to the county's default_valuation_basis) together with the county scarcity multiplier in force at this instant."
    roles: [Broker]
    code: 200
    input: ["valuation_basis?"]
    output: Listing
    side_effects:
      - "runs quota_scarcity_multiplier then listing_market_valuation in the selected variant"
      - "sets status=ACTIVE, valuation_basis, market_price_cents, scarcity_bps_at_activation, comp_count_at_activation, activated_at=clock_now"
      - "increments Listing.version by 1"

  - method: POST
    path: "/listings/{listing_id}/withdraw"
    description: "Pull the listing off the market. Refused while open_offer_count > 0."
    roles: [Broker]
    code: 200
    input: ["reason?"]
    output: Listing
    side_effects:
      - "sets status=WITHDRAWN"
      - "increments Listing.version by 1"

  # ---------------- PurchaseAgreement ----------------
  - method: POST
    path: "/purchase-agreements"
    description: "Draft a purchase agreement against an ACTIVE listing. expected_listing_version is the mandatory optimistic-concurrency token for the parent listing (see 1.2.1 rule agreement-create-stale-listing). Freezes required_deposit_cents and contingency_deadline_at at draft time and copies brokerage_id, license_id and seller_id off the listing chain."
    roles: [Broker]
    code: 201
    input: [listing_id, buyer_id, premises_id, purchase_price_cents, deposit_pct_bps, closing_window_start, expected_listing_version, "contingency_days?"]
    output: PurchaseAgreement
    side_effects:
      - "denormalises brokerage_id := Listing.brokerage_id, license_id := Listing.license_id, seller_id := License.owner_seller_id"
      - "runs escrow_deposit_requirement and writes required_deposit_cents"
      - "sets contingency_deadline_at := closing_window_start + contingency_days days"
      - "sets agreement_status=DRAFT, escrow_status=AWAITING_DEPOSIT, escrow_balance_cents=0"
      - "increments Listing.open_offer_count by 1"
      - "increments Listing.version by 1 (so a second create replaying the same expected_listing_version is rejected 412)"

  - method: GET
    path: "/purchase-agreements/{agreement_id}"
    description: "Read one agreement: both status dimensions, the frozen deposit requirement, the live escrow balance and the settlement buckets."
    roles: [PlatformAdmin, Broker, Buyer, Seller, RegulatorAnalyst, EscrowOfficer]
    code: 200
    input: []
    output: PurchaseAgreement
    side_effects: []

  - method: GET
    path: "/purchase-agreements"
    description: "Filtered, paginated agreement list. Reverse-reachability list for Listing.id, BuyerProfile.id, Premises.id, Brokerage.id, License.id and SellerProfile.id."
    roles: [PlatformAdmin, Broker, Buyer, Seller, RegulatorAnalyst, EscrowOfficer]
    code: 200
    input: ["listing_id?", "buyer_id?", "premises_id?", "brokerage_id?", "license_id?", "seller_id?", "agreement_status?", "escrow_status?", "limit?", "offset?"]
    output: PurchaseAgreement[]
    side_effects: []

  - method: GET
    path: "/purchase-agreements/{agreement_id}/escrow-ledger"
    description: "Immutable escrow ledger for one agreement in append order (occurred_at ASC, created_at ASC as tie-break). Reverse-reachability list for EscrowLedgerEntry.agreement_id and the only discovery channel for cascade-created ledger rows."
    roles: [PlatformAdmin, Broker, Buyer, Seller, RegulatorAnalyst, EscrowOfficer]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: EscrowLedgerEntry[]
    side_effects: []

  - method: GET
    path: "/escrow-ledger-entries/{entry_id}"
    description: "Read one immutable escrow ledger row by its own id (id and created_at only - EscrowLedgerEntry declares common_fields false, so there is no version and no update path)."
    roles: [PlatformAdmin, Broker, Buyer, Seller, RegulatorAnalyst, EscrowOfficer]
    code: 200
    input: []
    output: EscrowLedgerEntry
    side_effects: []

  - method: GET
    path: "/escrow-ledger-entries"
    description: "Filtered, paginated ledger list across agreements in append order (occurred_at ASC, created_at ASC as tie-break). Reverse-reachability list for EscrowLedgerEntry.agreement_id."
    roles: [PlatformAdmin, Broker, Buyer, Seller, RegulatorAnalyst, EscrowOfficer]
    code: 200
    input: ["agreement_id?", "entry_type?", "limit?", "offset?"]
    output: EscrowLedgerEntry[]
    side_effects: []

  - method: GET
    path: "/purchase-agreements/{agreement_id}/dual-agency-disclosures"
    description: "Every dual-agency disclosure filed on one agreement, created_at ASC. Reverse-reachability list for DualAgencyDisclosure.agreement_id."
    roles: [PlatformAdmin, Broker, Buyer, Seller, RegulatorAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DualAgencyDisclosure[]
    side_effects: []

  - method: POST
    path: "/purchase-agreements/{agreement_id}/escrow-deposit"
    description: "Buyer or escrow officer funds the escrow. amount_cents must equal required_deposit_cents exactly - partial and over-funding are both rejected. Advances the escrow dimension to HELD while the agreement dimension is still DRAFT."
    roles: [Buyer, EscrowOfficer]
    code: 200
    input: [amount_cents, "deposit_reference?"]
    output: PurchaseAgreement
    side_effects:
      - "appends an EscrowLedgerEntry with entry_type=DEPOSIT, amount_cents=+amount_cents, balance_after_cents=amount_cents, memo=deposit_reference, occurred_at=clock_now"
      - "moves escrow_status AWAITING_DEPOSIT -> HELD and recomputes escrow_balance_cents from the ledger"
      - "increments PurchaseAgreement.version by 1"
      - "touches no County counter: the license only becomes IN_ESCROW at execution, so County.escrow_committed_count is unchanged by funding"

  - method: POST
    path: "/purchase-agreements/{agreement_id}/execute"
    description: "Execute the agreement. Takes no body: every gate is read from the linked disclosure, buyer qualification, premises suitability, listing and license state. Cascades the license into IN_ESCROW and the listing into UNDER_CONTRACT."
    roles: [Broker]
    code: 200
    input: []
    output: PurchaseAgreement
    side_effects:
      - "sets executed_at=clock_now and commission_mode (DUAL_AGENCY when the FULLY_ACKED disclosure represents both parties, else SINGLE_AGENCY)"
      - "moves agreement_status DRAFT -> EXECUTED"
      - "moves License ACTIVE|SAFEKEEPING -> IN_ESCROW and increments License.version by 1"
      - "moves Listing ACTIVE -> UNDER_CONTRACT and increments Listing.version by 1"
      - "increments PurchaseAgreement.version by 1"

  - method: POST
    path: "/purchase-agreements/{agreement_id}/terminate"
    description: "Broker abandons a DRAFT agreement before any money is held. Voids its disclosures and frees the listing's offer counter."
    roles: [Broker]
    code: 200
    input: [reason]
    output: PurchaseAgreement
    side_effects:
      - "sets termination_reason=reason and agreement_status=TERMINATED"
      - "moves every PENDING_ACKS|FULLY_ACKED DualAgencyDisclosure on this agreement to VOID"
      - "recomputes Listing.open_offer_count and increments Listing.version by 1"
      - "increments PurchaseAgreement.version by 1"

  - method: POST
    path: "/purchase-agreements/{agreement_id}/escrow-settlement"
    description: "Escrow officer disposes of the held funds. disposition RELEASE requires an APPROVED transfer application and a CLOSED agreement; REFUND requires a DENIED application; FORFEIT requires an expired contingency deadline with the application still in flight. Each branch writes a different ledger shape and a different compensation cascade."
    roles: [EscrowOfficer]
    code: 200
    input: [disposition, "memo?"]
    output: PurchaseAgreement
    side_effects:
      - "RELEASE: runs commission_disbursement, writes county_transfer_fee_cents / commission_total_cents / seller_net_cents and appends RELEASE_COUNTY_FEE, RELEASE_COMMISSION, RELEASE_SELLER ledger rows in that pinned order"
      - "REFUND: appends one REFUND_BUYER row for the whole balance and leaves the three settlement buckets null"
      - "FORFEIT: appends one FORFEIT_SELLER row for the whole balance and leaves the three settlement buckets null"
      - "every branch drives escrow_balance_cents to 0, sets settled_at=clock_now and increments PurchaseAgreement.version by 1"
      - "REFUND/FORFEIT additionally cascade agreement_status EXECUTED -> TERMINATED, License IN_ESCROW -> ACTIVE|SAFEKEEPING, Listing UNDER_CONTRACT -> ACTIVE and void the disclosures"
      - "REFUND/FORFEIT hop 3 re-runs county_quota_position, so County.escrow_committed_count falls by 1 and County.version increments by 1; RELEASE touches no County counter because the license already left IN_ESCROW at the APPROVED decision"

  # ---------------- DualAgencyDisclosure ----------------
  - method: POST
    path: "/dual-agency-disclosures"
    description: "File the brokerage's agency-representation disclosure on an agreement. represents_seller AND represents_buyer both true is dual agency and is refused outright when the brokerage's dual_agency_policy is PROHIBITED; both false is rejected as unrepresented."
    roles: [Broker]
    code: 201
    input: [agreement_id, represents_seller, represents_buyer, "disclosure_text_ref?"]
    output: DualAgencyDisclosure
    side_effects:
      - "sets status=PENDING_ACKS, seller_ack_at=null, buyer_ack_at=null"

  - method: GET
    path: "/dual-agency-disclosures/{disclosure_id}"
    description: "Read one disclosure with its acknowledgement timestamps."
    roles: [PlatformAdmin, Broker, Buyer, Seller, RegulatorAnalyst]
    code: 200
    input: []
    output: DualAgencyDisclosure
    side_effects: []

  - method: GET
    path: "/dual-agency-disclosures"
    description: "Filtered, paginated disclosure list in created_at ASC order. Reverse-reachability list for DualAgencyDisclosure.agreement_id."
    roles: [PlatformAdmin, Broker, Buyer, Seller, RegulatorAnalyst]
    code: 200
    input: ["agreement_id?", "status?", "limit?", "offset?"]
    output: DualAgencyDisclosure[]
    side_effects: []

  - method: POST
    path: "/dual-agency-disclosures/{disclosure_id}/acknowledge"
    description: "A represented party signs the disclosure. party is BUYER or SELLER and must be a party the disclosure actually represents; a second acknowledgement by the same party is rejected. status becomes FULLY_ACKED once every represented party has signed."
    roles: [Buyer, Seller]
    code: 200
    input: [party]
    output: DualAgencyDisclosure
    side_effects:
      - "sets buyer_ack_at or seller_ack_at to clock_now"
      - "promotes status PENDING_ACKS -> FULLY_ACKED when every represented party has an ack timestamp"
      - "increments DualAgencyDisclosure.version by 1"

  # ---------------- TransferApplication ----------------
  - method: POST
    path: "/transfer-applications"
    description: "File the license-transfer application for an EXECUTED agreement whose escrow is HELD. Lands directly in SUBMITTED. fee_paid_cents must equal the transfer_filing_fee computed at deficiency_round_count = 0; license_id and premises_id are copied off the agreement."
    roles: [Broker]
    code: 201
    input: [agreement_id, fee_paid_cents, "applicant_statement_ref?"]
    output: TransferApplication
    side_effects:
      - "denormalises license_id := agreement.license_id, premises_id := agreement.premises_id"
      - "runs transfer_filing_fee at deficiency_round_count=0 and writes filing_fee_cents; fee_paid_total_cents := fee_paid_cents"
      - "sets status=SUBMITTED, deficiency_round_count=0, decision=null"

  - method: GET
    path: "/transfer-applications/{application_id}"
    description: "Read one application: revision-round counter, accepting analyst, posting window, protest deadline and decision."
    roles: [PlatformAdmin, Broker, Buyer, Seller, RegulatorAnalyst, EscrowOfficer]
    code: 200
    input: []
    output: TransferApplication
    side_effects: []

  - method: GET
    path: "/transfer-applications"
    description: "Filtered, paginated application list. Reverse-reachability list for PurchaseAgreement.id (agreement_id), License.id (license_id) and Premises.id (premises_id)."
    roles: [PlatformAdmin, Broker, Buyer, Seller, RegulatorAnalyst, EscrowOfficer]
    code: 200
    input: ["agreement_id?", "license_id?", "premises_id?", "status?", "limit?", "offset?"]
    output: TransferApplication[]
    side_effects: []

  - method: GET
    path: "/transfer-applications/{application_id}/protests"
    description: "Every protest filed against one application, created_at ASC. Reverse-reachability list for Protest.application_id."
    roles: [PlatformAdmin, Broker, Seller, RegulatorAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Protest[]
    side_effects: []

  - method: POST
    path: "/transfer-applications/{application_id}/accept-review"
    description: "Analyst takes the application into review. Records the caller's X-User-ID as accepted_by_analyst_id, which permanently bars that same analyst from issuing the decision."
    roles: [RegulatorAnalyst]
    code: 200
    input: []
    output: TransferApplication
    side_effects:
      - "moves status SUBMITTED -> UNDER_REVIEW"
      - "sets accepted_by_analyst_id := caller X-User-ID"
      - "increments TransferApplication.version by 1"

  - method: POST
    path: "/transfer-applications/{application_id}/deficiency"
    description: "Analyst kicks the application back for correction. Allowed for at most two rounds; the third attempt is refused."
    roles: [RegulatorAnalyst]
    code: 200
    input: [deficiency_codes]
    output: TransferApplication
    side_effects:
      - "moves status UNDER_REVIEW -> DEFICIENT"
      - "increments deficiency_round_count by 1 and sets last_deficiency_codes := deficiency_codes"
      - "increments TransferApplication.version by 1"

  - method: POST
    path: "/transfer-applications/{application_id}/resubmit"
    description: "Broker refiles a DEFICIENT application. fee_paid_cents must equal the transfer_filing_fee recomputed at the CURRENT deficiency_round_count, which is strictly larger than the original filing fee."
    roles: [Broker]
    code: 200
    input: [fee_paid_cents, "applicant_statement_ref?"]
    output: TransferApplication
    side_effects:
      - "re-runs transfer_filing_fee at the current deficiency_round_count and rewrites filing_fee_cents"
      - "adds fee_paid_cents to fee_paid_total_cents"
      - "moves status DEFICIENT -> SUBMITTED, retaining accepted_by_analyst_id"
      - "increments TransferApplication.version by 1"

  - method: POST
    path: "/transfer-applications/{application_id}/post-notice"
    description: "Analyst publishes the statutory notice. Opens the posting period and the protest window, and enforces the buffered posting-overlap rule against other live applications on the same premises."
    roles: [RegulatorAnalyst]
    code: 200
    input: []
    output: TransferApplication
    side_effects:
      - "moves status UNDER_REVIEW -> POSTED"
      - "sets posting_started_at=clock_now, posting_ends_at=posting_started_at + County.posting_period_days days, protest_deadline_at=posting_started_at + min(County.posting_period_days, County.protest_window_days) days"
      - "increments TransferApplication.version by 1"

  - method: POST
    path: "/transfer-applications/{application_id}/decision"
    description: "Analyst approves or denies the transfer after the posting period has fully elapsed. The caller may not be the analyst who accepted the application for review. APPROVED runs the five-hop closing cascade; DENIED sustains every outstanding protest and leaves the license in escrow for the refund."
    roles: [RegulatorAnalyst]
    code: 200
    input: [decision, "decision_note?"]
    output: TransferApplication
    side_effects:
      - "sets decision, decided_at=clock_now and moves status POSTED|PROTESTED -> APPROVED|DENIED"
      - "APPROVED hop 2: License IN_ESCROW -> TRANSFERRED, transferred_to_buyer_id := agreement.buyer_id, License.version +1"
      - "APPROVED hop 3: Listing UNDER_CONTRACT -> SOLD, Listing.version +1"
      - "APPROVED hop 4: PurchaseAgreement EXECUTED -> CLOSED, version +1 (escrow_status deliberately stays HELD)"
      - "APPROVED hop 5: every OPEN|RESPONDED Protest on this application -> OVERRULED, version +1 each"
      - "APPROVED also re-runs county_quota_position on the county (the license is still counted, now owned by the buyer) and increments County.version by 1"
      - "DENIED: every OPEN|RESPONDED Protest on this application -> SUSTAINED; no License, Listing or agreement field is touched"
      - "increments TransferApplication.version by 1"

  # ---------------- Protest ----------------
  - method: POST
    path: "/protests"
    description: "Regulator records a third-party protest against a POSTED application. Refused once clock_now passes the application's protest_deadline_at. response_due_days defaults to 15."
    roles: [RegulatorAnalyst]
    code: 201
    input: [application_id, protestant_name, grounds, "response_due_days?"]
    output: Protest
    side_effects:
      - "sets status=OPEN, filed_at=clock_now, response_due_at=filed_at + response_due_days days"
      - "moves TransferApplication POSTED -> PROTESTED and increments TransferApplication.version by 1"

  - method: GET
    path: "/protests/{protest_id}"
    description: "Read one protest with its response deadline and response timestamp."
    roles: [PlatformAdmin, Broker, Seller, RegulatorAnalyst]
    code: 200
    input: []
    output: Protest
    side_effects: []

  - method: GET
    path: "/protests"
    description: "Filtered, paginated protest list in created_at ASC order. Reverse-reachability list for Protest.application_id."
    roles: [PlatformAdmin, Broker, Seller, RegulatorAnalyst]
    code: 200
    input: ["application_id?", "status?", "grounds?", "limit?", "offset?"]
    output: Protest[]
    side_effects: []

  - method: POST
    path: "/protests/{protest_id}/response"
    description: "Broker answers an OPEN protest on or before response_due_at. An unanswered protest past its deadline can no longer be answered and forces the regulator's hand to DENIED."
    roles: [Broker]
    code: 200
    input: [response_text_ref]
    output: Protest
    side_effects:
      - "moves status OPEN -> RESPONDED, sets response_submitted_at=clock_now and response_text_ref"
      - "increments Protest.version by 1"

  # ---------------- SafekeepingFiling ----------------
  - method: POST
    path: "/safekeeping-filings"
    description: "File an initial safekeeping (nonuse) petition or a nonuse extension on a license. expected_license_version is the mandatory optimistic-concurrency token for the parent license (see 1.2.1 rule safekeeping-filing-stale-license). INITIAL requires at least 180 elapsed nonuse days since last_active_date; each EXTENSION is capped and priced by its extension_index."
    roles: [Broker, Seller]
    code: 201
    input: [license_id, filing_type, requested_months, expected_license_version]
    output: SafekeepingFiling
    side_effects:
      - "runs safekeeping_grant and writes extension_index, granted_months, effective_from, expires_at and fee_cents"
      - "sets status=PENDING"
      - "sets License.safekeeping_filing_pending := true and increments License.version by 1 (so a replay of the same expected_license_version is rejected 412)"

  - method: GET
    path: "/safekeeping-filings/{filing_id}"
    description: "Read one safekeeping filing including its granted window and fee."
    roles: [PlatformAdmin, Broker, Seller, RegulatorAnalyst]
    code: 200
    input: []
    output: SafekeepingFiling
    side_effects: []

  - method: GET
    path: "/safekeeping-filings"
    description: "Filtered, paginated safekeeping-filing list in created_at ASC order. Reverse-reachability list for SafekeepingFiling.license_id."
    roles: [PlatformAdmin, Broker, Seller, RegulatorAnalyst]
    code: 200
    input: ["license_id?", "filing_type?", "status?", "limit?", "offset?"]
    output: SafekeepingFiling[]
    side_effects: []

  - method: POST
    path: "/safekeeping-filings/{filing_id}/decide"
    description: "Regulator grants or denies the filing. decision is GRANT or DENY. A grant applies the computed window to the license; a denial only clears the pending flag."
    roles: [RegulatorAnalyst]
    code: 200
    input: [decision]
    output: SafekeepingFiling
    side_effects:
      - "sets decided_at=clock_now and moves status PENDING -> GRANTED|DENIED"
      - "GRANT: License.status ACTIVE -> SAFEKEEPING (INITIAL) or SAFEKEEPING self-loop (EXTENSION), safekeeping_expires_at := filing.expires_at, safekeeping_extensions_count := filing.extension_index"
      - "both branches clear License.safekeeping_filing_pending and increment License.version by 1"
      - "increments SafekeepingFiling.version by 1"

  # ---------------- Test-driving endpoint ----------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock, which every deadline, posting window, protest deadline, contingency expiry and nonuse computation reads. The startup default is exactly 2026-08-01T00:00:00Z: before any call to this endpoint the logical clock reads 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output:
      current_utc: datetime
    side_effects:
      - "all subsequent clock_now reads return to_iso8601; no stored entity is recomputed retroactively"

# =====================================================================
# 1.6 Error Code Catalog
# =====================================================================
errors:

  # --- auth / role / ownership ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty-string, or a role outside the six declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "Caller's role is not in the target endpoint's roles set"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Entity-backed caller acting on someone else's listing, agreement, premises, protest or license"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The analyst issuing the transfer decision is the same X-User-ID recorded as accepted_by_analyst_id"

  # --- schema ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unknown enum value, wrong scalar type, out-of-range integer, or malformed ISO-8601 / YYYY-MM-DD value"

  # --- existence ---
  - id: ERR_COUNTY_NOT_FOUND
    http: 404
    condition: "county_id in the path or body matches no County"
  - id: ERR_SELLER_NOT_FOUND
    http: 404
    condition: "owner_seller_id in the path or body matches no SellerProfile"
  - id: ERR_BUYER_NOT_FOUND
    http: 404
    condition: "buyer_id in the path or body matches no BuyerProfile"
  - id: ERR_BROKERAGE_NOT_FOUND
    http: 404
    condition: "brokerage_id in the path or body matches no Brokerage"
  - id: ERR_LICENSE_NOT_FOUND
    http: 404
    condition: "license_id in the path or body matches no License"
  - id: ERR_PREMISES_NOT_FOUND
    http: 404
    condition: "premises_id in the path or body matches no Premises"
  - id: ERR_LISTING_NOT_FOUND
    http: 404
    condition: "listing_id in the path or body matches no Listing"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "agreement_id in the path or body matches no PurchaseAgreement"
  - id: ERR_DISCLOSURE_NOT_FOUND
    http: 404
    condition: "disclosure_id in the path matches no DualAgencyDisclosure"
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "application_id in the path or body matches no TransferApplication"
  - id: ERR_PROTEST_NOT_FOUND
    http: 404
    condition: "protest_id in the path matches no Protest"
  - id: ERR_FILING_NOT_FOUND
    http: 404
    condition: "filing_id in the path matches no SafekeepingFiling"

  # --- optimistic concurrency ---
  - id: ERR_STALE_LISTING_VERSION
    http: 412
    condition: "expected_listing_version on POST /purchase-agreements does not equal the listing's current version"
  - id: ERR_STALE_LICENSE_VERSION
    http: 412
    condition: "expected_license_version on POST /safekeeping-filings does not equal the license's current version"

  # --- state preconditions ---
  - id: ERR_INVALID_LICENSE_STATE
    http: 409
    condition: "License is not in a status the requested operation allows (e.g. IN_ESCROW license listed or petitioned for safekeeping)"
  - id: ERR_INVALID_LISTING_STATE
    http: 409
    condition: "Listing is not ACTIVE when an offer is drafted, or not DRAFT/ACTIVE when activated or withdrawn"
  - id: ERR_INVALID_AGREEMENT_STATE
    http: 409
    condition: "agreement_status forbids the operation (execute on a non-DRAFT row, terminate on an EXECUTED row, release before CLOSED)"
  - id: ERR_ESCROW_NOT_HELD
    http: 409
    condition: "Settlement or execution attempted while escrow_status is AWAITING_DEPOSIT"
  - id: ERR_ESCROW_ALREADY_SETTLED
    http: 409
    condition: "Deposit or settlement attempted while escrow_status is already RELEASED, REFUNDED or FORFEITED"
  - id: ERR_ESCROW_MUST_BE_SETTLED_FIRST
    http: 409
    condition: "An operation that assumes a clean escrow ledger is attempted while funds are still HELD"
  - id: ERR_INVALID_APPLICATION_STATE
    http: 409
    condition: "TransferApplication is not in the status the requested review step requires"
  - id: ERR_INVALID_PROTEST_STATE
    http: 409
    condition: "Protest response attempted on a protest that is not OPEN"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "Any write against a row already in a terminal state (License TRANSFERRED, Listing SOLD/WITHDRAWN, agreement CLOSED/TERMINATED, application APPROVED/DENIED, protest SUSTAINED/OVERRULED, filing GRANTED/DENIED); checked at priority 34, before which priority 32 has already excluded terminal rows from its own scope"

  # --- regulatory / safety ---
  - id: ERR_DISTANCE_RESTRICTION_VIOLATION
    http: 422
    condition: "Premises is closer to a school or church than the county's inclusive minimum at agreement execution or notice posting"
  - id: ERR_PREMISES_UNSUITABLE
    http: 422
    condition: "Premises suitability_status is UNSUITABLE, or posting is attempted while the conditional-use permit is neither NOT_REQUIRED nor GRANTED"
  - id: ERR_BUYER_NOT_QUALIFIED
    http: 422
    condition: "Buyer qualification_status is NOT_REVIEWED or DISQUALIFIED, or the qualifying review was only a PRE_CHECK"
  - id: ERR_SELLER_TAX_CLEARANCE_MISSING
    http: 422
    condition: "Transfer application filed while the selling licensee's tax_clearance_status is not CLEARED"

  # --- dual agency ---
  - id: ERR_DUAL_AGENCY_DISCLOSURE_REQUIRED
    http: 422
    condition: "Agreement execution attempted with no FULLY_ACKED DualAgencyDisclosure on the agreement"
  - id: ERR_DUAL_AGENCY_PROHIBITED
    http: 422
    condition: "A disclosure representing both parties is filed for a brokerage whose dual_agency_policy is PROHIBITED"
  - id: ERR_PARTY_NOT_REPRESENTED
    http: 422
    condition: "Acknowledging party is not represented by the disclosure, or the disclosure represents neither party"
  - id: ERR_ALREADY_ACKNOWLEDGED
    http: 422
    condition: "The same party acknowledges the same disclosure twice"

  # --- constraint / temporal ---
  - id: ERR_COUNTY_QUOTA_EXHAUSTED
    http: 409
    condition: "Adding a quota-counted license would push quota_licenses_counted above quota_licenses_total"
  - id: ERR_LICENSE_CONTRACT_OVERLAP
    http: 409
    condition: "A draft agreement's half-open closing interval overlaps a live agreement's interval on the same license"
  - id: ERR_POSTING_WINDOW_CONFLICT
    http: 409
    condition: "A notice posting's closed interval, widened by the 30-day buffer, collides with another live application's posting interval on the same premises"
  - id: ERR_DEFICIENCY_LIMIT_EXCEEDED
    http: 409
    condition: "A third deficiency round is requested on the same application"
  - id: ERR_LISTING_HAS_OPEN_OFFERS
    http: 409
    condition: "Withdrawal attempted while open_offer_count is greater than zero"
  - id: ERR_PROTEST_WINDOW_CLOSED
    http: 409
    condition: "Protest filed after the application's protest_deadline_at"
  - id: ERR_PROTEST_RESPONSE_WINDOW_CLOSED
    http: 409
    condition: "Protest response submitted after that protest's response_due_at"
  - id: ERR_POSTING_PERIOD_NOT_ELAPSED
    http: 409
    condition: "Decision issued at or before posting_ends_at"
  - id: ERR_PROTEST_RESPONSE_PENDING
    http: 409
    condition: "Decision issued while an OPEN protest still has time left to answer"
  - id: ERR_UNANSWERED_PROTEST_REQUIRES_DENIAL
    http: 409
    condition: "APPROVED decision issued while a protest remains unanswered past its response_due_at"
  - id: ERR_CONTINGENCY_DEADLINE_PASSED
    http: 409
    condition: "Execution, resubmission or RELEASE attempted after the agreement's contingency_deadline_at"
  - id: ERR_CONTINGENCY_STILL_OPEN
    http: 409
    condition: "FORFEIT attempted at or before the agreement's contingency_deadline_at"
  - id: ERR_TRANSFER_NOT_APPROVED
    http: 409
    condition: "RELEASE without an APPROVED application, or REFUND without a DENIED application"
  - id: ERR_SAFEKEEPING_EXTENSION_LIMIT
    http: 409
    condition: "A fourth safekeeping window is petitioned, or requested_months exceeds the cap for that extension_index"
  - id: ERR_SAFEKEEPING_FILING_PENDING
    http: 409
    condition: "A second safekeeping filing is opened while License.safekeeping_filing_pending is true"
  - id: ERR_NONUSE_PERIOD_NOT_REACHED
    http: 422
    condition: "INITIAL safekeeping filed before 180 nonuse days have elapsed since last_active_date"

  # --- fiscal ---
  - id: ERR_DEPOSIT_AMOUNT_MISMATCH
    http: 422
    condition: "Deposit amount_cents differs from the agreement's frozen required_deposit_cents by even one cent"
  - id: ERR_FILING_FEE_MISMATCH
    http: 422
    condition: "fee_paid_cents differs from the filing fee computed at the application's current deficiency_round_count"
  - id: ERR_ESCROW_INSUFFICIENT_FOR_DISBURSEMENT
    http: 422
    condition: "RELEASE would leave seller_net_cents below zero after the county fee and commission buckets"

# =====================================================================
# 1.7 RBAC Matrix
# =====================================================================
roles:

  - name: PlatformAdmin
    description: "Reference-data operator: counties, licence inventory, brokerage registration, party profiles and the logical clock. Never a party to a transaction."
    identity: opaque
    exclusive_operations:
      - "POST /counties"
      - "POST /brokerages"
      - "POST /licenses"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /seller-profiles and POST /buyer-profiles (with Broker)"
      - "every GET in 1.5 except GET /purchase-agreements/{id}/escrow-ledger detail filtering, which it also reads"

  - name: Broker
    description: "Licensed brokerage acting for the parties: lists licences, drafts and executes agreements, files disclosures, files and refiles transfer applications, answers protests, petitions safekeeping. X-User-ID is a Brokerage id."
    identity: "entity_backed:Brokerage"
    exclusive_operations:
      - "POST /listings"
      - "POST /listings/{listing_id}/activate"
      - "POST /listings/{listing_id}/withdraw"
      - "POST /purchase-agreements"
      - "POST /purchase-agreements/{agreement_id}/execute"
      - "POST /purchase-agreements/{agreement_id}/terminate"
      - "POST /dual-agency-disclosures"
      - "POST /transfer-applications"
      - "POST /transfer-applications/{application_id}/resubmit"
      - "POST /protests/{protest_id}/response"
    shared_operations:
      - "POST /seller-profiles and POST /buyer-profiles (with PlatformAdmin)"
      - "POST /premises (with Buyer)"
      - "POST /premises/{premises_id}/landlord-consent (with Buyer)"
      - "POST /safekeeping-filings (with Seller)"
      - "read access to counties, brokerages, licences, premises, listings, agreements, applications, protests, filings, ledgers and disclosures"

  - name: Buyer
    description: "Prospective transferee. Registers premises, obtains landlord consent, funds escrow and acknowledges the agency disclosure. X-User-ID is a BuyerProfile id."
    identity: "entity_backed:BuyerProfile"
    exclusive_operations: []
    shared_operations:
      - "POST /premises (with Broker)"
      - "POST /premises/{premises_id}/landlord-consent (with Broker)"
      - "POST /purchase-agreements/{agreement_id}/escrow-deposit (with EscrowOfficer)"
      - "POST /dual-agency-disclosures/{disclosure_id}/acknowledge (with Seller, party=BUYER)"
      - "read access to counties, brokerages, buyer profiles, licences, premises, listings, agreements, applications and escrow ledgers"

  - name: Seller
    description: "Selling licensee. Acknowledges the agency disclosure and may petition safekeeping on its own licence. X-User-ID is a SellerProfile id."
    identity: "entity_backed:SellerProfile"
    exclusive_operations: []
    shared_operations:
      - "POST /dual-agency-disclosures/{disclosure_id}/acknowledge (with Buyer, party=SELLER)"
      - "POST /safekeeping-filings (with Broker)"
      - "read access to counties, brokerages, seller profiles, licences, listings, agreements, applications, protests, filings, ledgers and disclosures"

  - name: RegulatorAnalyst
    description: "Licensing-authority analyst: buyer qualification reviews, zoning verification, application review lifecycle, protest intake, transfer decisions and safekeeping decisions. Segregation of duties applies - the analyst who accepts an application may never decide it. X-User-ID is an opaque analyst identifier stored as accepted_by_analyst_id."
    identity: opaque
    exclusive_operations:
      - "POST /buyer-profiles/{buyer_id}/qualification-review"
      - "POST /premises/{premises_id}/zoning-verification"
      - "POST /transfer-applications/{application_id}/accept-review"
      - "POST /transfer-applications/{application_id}/deficiency"
      - "POST /transfer-applications/{application_id}/post-notice"
      - "POST /transfer-applications/{application_id}/decision"
      - "POST /protests"
      - "POST /safekeeping-filings/{filing_id}/decide"
    shared_operations:
      - "read access to counties, brokerages, party profiles, licences, premises, listings, agreements, applications, protests, filings, ledgers and disclosures"

  - name: EscrowOfficer
    description: "Independent escrow holder. Sole operator of settlement: releases funds on an approved transfer, refunds a denied one, forfeits an expired one. May never draft, execute or terminate an agreement."
    identity: opaque
    exclusive_operations:
      - "POST /purchase-agreements/{agreement_id}/escrow-settlement"
    shared_operations:
      - "POST /purchase-agreements/{agreement_id}/escrow-deposit (with Buyer)"
      - "read access to counties, brokerages, party profiles, licences, premises, listings, agreements, applications and escrow ledgers"
