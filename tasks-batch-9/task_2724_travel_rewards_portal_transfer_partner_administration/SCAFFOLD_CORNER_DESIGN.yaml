            - "ProgramChangeNotice.${pn_id}.status == DRAFT"
            - "ProgramChangeNotice.${pn_id}.version == 1"

      - name: announcing_a_superseding_notice_withdraws_the_prior_notice
        claim_type: side_effect_execution
        grounds:
          - state_machines.ProgramChangeNotice.PENDING_APPROVAL_to_ANNOUNCED
          - state_machines.ProgramChangeNotice.ANNOUNCED_to_WITHDRAWN
          - entities.ProgramChangeNotice.fields.supersedes_notice_id
        distinguishing_aspect: "Announcing a notice whose supersedes_notice_id points at an ANNOUNCED notice moves that prior notice to WITHDRAWN with withdrawn_reason SUPERSEDED in the same request, and the superseding notice records approved_by_user_id from the announcing approver."
        test_recipe:
          setup:
            - "The clock sits at 2026-08-01T00:00:00Z, so any effective_at from 2026-09-15T00:00:00Z onward satisfies the 45-day notice period."
            - "One ANNOUNCED notice NB-2026-10 effective 2026-10-01, and one DRAFT notice NB-2026-11 effective 2026-11-01 that supersedes it."
          setup_api_calls:
            - call: "POST /rewards/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/change-notices"
              payload: { notice_code: "NB-2026-10", change_type: "EARN_MULTIPLIER_CUT", effective_at: "2026-10-01T00:00:00Z", grandfather_window_days: 30, cohort_enrolled_before: "2025-01-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pn_old_id: $.data.id }
            - call: "POST /rewards/change-notices/${pn_old_id}/submit"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/change-notices/${pn_old_id}/announce"
              as: ProgramApprover
              as_user_id: "approver-1"
            - call: "POST /rewards/change-notices"
              payload: { notice_code: "NB-2026-11", change_type: "EARN_MULTIPLIER_CUT", effective_at: "2026-11-01T00:00:00Z", grandfather_window_days: 30, cohort_enrolled_before: "2025-01-01T00:00:00Z", supersedes_notice_id: "${pn_old_id}" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pn_new_id: $.data.id }
            - call: "POST /rewards/change-notices/${pn_new_id}/submit"
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /rewards/change-notices/${pn_new_id}/announce"
              as: ProgramApprover
              as_user_id: "approver-2"
          assert:
            - "the response status is 200"
            - "ProgramChangeNotice.${pn_new_id}.status == ANNOUNCED"
            - "ProgramChangeNotice.${pn_new_id}.announced_at == 2026-08-01T00:00:00Z"
            - "ProgramChangeNotice.${pn_new_id}.approved_by_user_id == approver-2"
            - "ProgramChangeNotice.${pn_new_id}.supersedes_notice_id == ${pn_old_id}"
            - "ProgramChangeNotice.${pn_old_id}.status == WITHDRAWN"
            - "ProgramChangeNotice.${pn_old_id}.withdrawn_reason == SUPERSEDED"

      - name: queued_transfer_completes_on_ops_run_then_reversal_after_window_rejected
