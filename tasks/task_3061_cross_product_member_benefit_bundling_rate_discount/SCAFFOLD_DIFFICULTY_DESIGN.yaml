            - "hop 4 (caused by hop 3): LoanAccount.${la7_id}.pricing_status == STEPPED_DOWN"
            - "end state: LoanAccount.${la7_id}.discount_stack_bps == 0 and effective_apr_bps == 1200, up from 50 / 1150"
            - "end state: a QUEUED ChurnNotice exists for ${m7_id} with notice_type == RATE_STEP_DOWN and reason_code == DEPOSIT_STOPPED"

      - name: holding_close_cascade_benefit_revoked_application_rolled_back_loan_repriced
        grounds:
          - state_machines.ProductHolding.ADOPTED_to_CLOSED
          - state_machines.BenefitEntitlement.GRANTED_to_REVOKED
          - state_machines.LoanAccount.FINAL_to_STEPPED_DOWN
          - calculations.reunderwriting_permitted
        distinguishing_aspect: |
          Depth 3 originating from a different triggering transition than the deposit
          lapse: the holding close revokes the benefit, the revocation is what rolls the
          discount application back, and the rollback is what reprices the loan and clears
          re-underwriting permission on the holding.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member m8 holds an ADOPTED CAREER holding and an ADOPTED LENDING holding carrying LoanAccount la8 (base_apr_bps 1300)."
