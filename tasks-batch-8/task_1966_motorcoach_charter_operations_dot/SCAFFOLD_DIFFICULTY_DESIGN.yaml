scaffold_difficulty_design:
  # ==========================================================================
  # Rule 1: dual_variant_calc — Two dual-variant calculations on different entity domains
  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: quote_pricing_mileage_vs_hourly_variant
        grounds:
          - calculations.calc_quote_pricing
          - entities.CharterQuote.fields.pricing_variant
          - entities.CharterQuote.fields.subtotal_cents
          - entities.CharterQuote.fields.total_cents
        distinguishing_aspect: |
          The same STANDARD-class vehicle produces different subtotal_cents and total_cents
          depending on whether MILEAGE_PRIMARY or HOURLY_PRIMARY variant is selected;
          the variant is chosen by the miles/hours ratio threshold (>=55.0 vs <55.0).
        test_recipe:
          setup:
            - "Customer account exists (ACTIVE, not tax-exempt)"
            - "Clock set to 2026-08-01T00:00:00Z"
            - "Quote A: 600 miles, 8 hours, STANDARD class — ratio 75 >= 55 -> MILEAGE_PRIMARY"
            - "Quote B: 80 miles, 12 hours, STANDARD class — ratio 6.67 < 55 -> HOURLY_PRIMARY"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/customers"
              payload: { company_name: "Acme Corp", contact_email: "acme@x.com", contact_phone: "555-0100", billing_address: "100 Main St" }
              as: QuoteAgent
              captures: { cust_id: $.data.id }
            - call: "POST /api/v1/quotes"
              payload: { customer_id: "${cust_id}", trip_date: "2026-09-01T08:00:00Z", return_date: "2026-09-01T16:00:00Z", origin: "Dallas TX", destination: "Austin TX", passenger_count: 40, estimated_miles: 600, estimated_hours: 8, vehicle_class_requested: "STANDARD" }
              as: QuoteAgent
              captures: { quote_a_id: $.data.id }
            - call: "POST /api/v1/quotes"
              payload: { customer_id: "${cust_id}", trip_date: "2026-09-05T08:00:00Z", return_date: "2026-09-05T20:00:00Z", origin: "Houston TX", destination: "Houston TX", passenger_count: 30, estimated_miles: 80, estimated_hours: 12, vehicle_class_requested: "STANDARD" }
              as: QuoteAgent
              captures: { quote_b_id: $.data.id }
          trigger:
            - call: "POST /api/v1/quotes/${quote_a_id}/price"
              payload: {}
              as: QuoteAgent
            - call: "POST /api/v1/quotes/${quote_b_id}/price"
              payload: {}
              as: QuoteAgent
          assert:
            - "CharterQuote.${quote_a_id}.pricing_variant == MILEAGE_PRIMARY"
            - "CharterQuote.${quote_a_id}.subtotal_cents == 172500"
            - "CharterQuote.${quote_a_id}.tax_cents == 14231"
            - "CharterQuote.${quote_a_id}.total_cents == 186731"
            - "CharterQuote.${quote_b_id}.pricing_variant == HOURLY_PRIMARY"
            - "CharterQuote.${quote_b_id}.subtotal_cents == 250000"
            - "CharterQuote.${quote_b_id}.tax_cents == 20625"
            - "CharterQuote.${quote_b_id}.total_cents == 270625"
            - "CharterQuote.${quote_a_id}.subtotal_cents != CharterQuote.${quote_b_id}.subtotal_cents"

      - name: safety_score_driver_vs_customer_domain
        grounds:
          - calculations.calc_safety_score
          - calculations.calc_customer_safety_audit_score
          - entities.Driver.fields.safety_score
          - entities.CustomerAccount.fields.safety_audit_score
        distinguishing_aspect: |
          calc_safety_score operates on the Driver entity domain (flat deduction model),
          while calc_customer_safety_audit_score operates on the CustomerAccount entity domain
          (recency-weighted composite model); identical incident data produces different scores
          because the algorithms and aggregation scopes differ.
        test_recipe:
          setup:
            - "Customer, vehicle, driver, completed order with 1 MINOR ACCIDENT incident"
            - "Clock set to 2026-08-01T00:00:00Z; trip completed on 2026-07-22"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/customers"
              payload: { company_name: "Beta Group", contact_email: "beta@x.com", contact_phone: "555-0200", billing_address: "200 Oak Ave" }
              as: QuoteAgent
              captures: { cust2_id: $.data.id }
            - call: "POST /api/v1/vehicles"
              payload: { unit_number: "MC-201", make_model: "Prevost H3-45", year: 2023, seating_capacity: 56, vehicle_class: "STANDARD", dot_inspection_expiry: "2027-01-01T00:00:00Z", maintenance_due_miles: 50000, insurance_policy_number: "INS-001", insurance_expiry: "2027-01-01T00:00:00Z" }
              as: FleetManager
              captures: { veh2_id: $.data.id }
            - call: "POST /api/v1/drivers"
              payload: { full_name: "John Smith", cdl_number: "CDL-001", cdl_class: "CLASS_B", endorsements: ["P", "S"], hire_date: "2020-01-15T00:00:00Z" }
              as: FleetManager
              captures: { drv2_id: $.data.id }
            - call: "POST /api/v1/quotes"
              payload: { customer_id: "${cust2_id}", trip_date: "2026-07-10T08:00:00Z", return_date: "2026-07-10T16:00:00Z", origin: "Dallas TX", destination: "Fort Worth TX", passenger_count: 40, estimated_miles: 200, estimated_hours: 6, vehicle_class_requested: "STANDARD" }
              as: QuoteAgent
              captures: { quote2_id: $.data.id }
            - call: "POST /api/v1/quotes/${quote2_id}/price"
              payload: {}
              as: QuoteAgent
              captures: { quote2_v: $.data.version }
            - call: "POST /api/v1/quotes/${quote2_id}/accept"
              payload: { expected_quote_version: "${quote2_v}" }
              as: Customer
              as_user_id: "${cust2_id}"
              captures: { order2_id: $.data.id, order2_v: $.data.version }
            - call: "POST /api/v1/orders/${order2_id}/pay-deposit"
              payload: { amount_cents: 50000 }
              as: Customer
              as_user_id: "${cust2_id}"
            - call: "GET /api/v1/orders/${order2_id}"
              payload: {}
              as: DispatchManager
              captures: { order2_v2: $.data.version }
            - call: "POST /api/v1/orders/${order2_id}/assign"
              payload: { vehicle_id: "${veh2_id}", driver_id: "${drv2_id}", expected_order_version: "${order2_v2}" }
              as: DispatchManager
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T07:30:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/orders/${order2_id}/start-trip"
              payload: {}
              as: DispatchManager
            - call: "POST /api/v1/orders/${order2_id}/complete-trip"
              payload: { actual_miles: 200, actual_hours: 6 }
              as: DispatchManager
            - call: "POST /api/v1/orders/${order2_id}/incidents"
              payload: { driver_id: "${drv2_id}", vehicle_id: "${veh2_id}", incident_type: "ACCIDENT", severity: "MINOR", description: "Minor fender bender in parking lot", occurred_at: "2026-07-10T14:00:00Z", reported_by: "John Smith" }
              as: DispatchManager
          trigger:
            - call: "GET /api/v1/drivers/${drv2_id}"
              payload: {}
              as: DispatchManager
            - call: "GET /api/v1/customers/${cust2_id}"
              payload: {}
              as: QuoteAgent
          assert:
            - "Driver.${drv2_id}.safety_score == 97.0"
            - "CustomerAccount.${cust2_id}.safety_audit_score != Driver.${drv2_id}.safety_score or CustomerAccount.${cust2_id}.safety_audit_score == 97.0"
            - "Driver.${drv2_id}.safety_score < 100.0"

  # ==========================================================================
  # Rule 2: combinatorial_formula — Two combinatorial formulas in different modes
  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: quote_pricing_multi_input_tiered_rates
        grounds:
          - calculations.calc_quote_pricing
          - entities.CharterQuote.fields.subtotal_cents
        distinguishing_aspect: |
          Mode (a) — formula with >=3 inputs and non-linear interaction: subtotal depends on
          vehicle_class rate table lookup, pricing variant branch, overnight threshold,
          relief driver threshold, and ADA percentage surcharge; each input interacts
          conditionally with the others (tiered-rate selection + conditional branches).
        test_recipe:
          setup:
            - "Customer exists (not tax-exempt, ACTIVE)"
            - "Quote: 400 miles, 14 hours, EXECUTIVE class, ada_required=true"
            - "Clock set to 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/customers"
              payload: { company_name: "Exec Travel", contact_email: "exec@x.com", contact_phone: "555-0300", billing_address: "300 Pine St" }
              as: QuoteAgent
              captures: { cust3_id: $.data.id }
            - call: "POST /api/v1/quotes"
              payload: { customer_id: "${cust3_id}", trip_date: "2026-09-10T06:00:00Z", return_date: "2026-09-10T20:00:00Z", origin: "Dallas TX", destination: "San Antonio TX", passenger_count: 30, estimated_miles: 400, estimated_hours: 14, ada_required: true, vehicle_class_requested: "EXECUTIVE" }
              as: QuoteAgent
              captures: { quote3_id: $.data.id }
          trigger:
            - call: "POST /api/v1/quotes/${quote3_id}/price"
              payload: {}
              as: QuoteAgent
          assert:
            - "CharterQuote.${quote3_id}.pricing_variant == MILEAGE_PRIMARY"
            - "CharterQuote.${quote3_id}.mileage_rate_cents == 500"
            - "CharterQuote.${quote3_id}.hourly_rate_cents == 30000"
            - "CharterQuote.${quote3_id}.requires_overnight == true"
            - "CharterQuote.${quote3_id}.requires_relief_driver == true"
            - "CharterQuote.${quote3_id}.overnight_fee_cents == 25000"
            - "CharterQuote.${quote3_id}.relief_driver_fee_cents == 45000"

      - name: quote_tax_rounding_order_sum_then_round
        grounds:
          - calculations.calc_quote_pricing
          - entities.CharterQuote.fields.subtotal_cents
          - entities.CharterQuote.fields.tax_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: the scaffold pins
          compute-all-components-then-sum-then-round for tax (tax = round(subtotal * rate)),
          NOT round-each-component-then-sum. With subtotal_before_fees=172500 and
          overnight=25000, per-component tax sums to 16293 while sum-then-round yields 16294.
        test_recipe:
          setup:
            - "Customer exists (not tax-exempt, ACTIVE)"
            - "Quote: 600 miles, 8 hours, STANDARD class — MILEAGE_PRIMARY, no overnight"
            - "Second quote: 80 miles, 12 hours, STANDARD — HOURLY_PRIMARY with overnight"
            - "Clock set to 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/customers"
              payload: { company_name: "Round Test Co", contact_email: "round@x.com", contact_phone: "555-0400", billing_address: "400 Elm St" }
              as: QuoteAgent
              captures: { cust4_id: $.data.id }
            - call: "POST /api/v1/quotes"
              payload: { customer_id: "${cust4_id}", trip_date: "2026-09-15T08:00:00Z", return_date: "2026-09-15T16:00:00Z", origin: "Dallas TX", destination: "Austin TX", passenger_count: 40, estimated_miles: 600, estimated_hours: 8, vehicle_class_requested: "STANDARD" }
              as: QuoteAgent
              captures: { quote4_id: $.data.id }
          trigger:
            - call: "POST /api/v1/quotes/${quote4_id}/price"
              payload: {}
              as: QuoteAgent
          assert:
            - "CharterQuote.${quote4_id}.subtotal_cents == 172500"
            - "CharterQuote.${quote4_id}.tax_cents == 14231"
            - "CharterQuote.${quote4_id}.total_cents == 186731"

  # ==========================================================================
  # Rule 3: non_linear_state_machine — Two non-linear machines on different entities
  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: charter_order_branching_with_dispute_cycle
        grounds:
          - state_machines.CharterOrder
          - state_machines.CharterOrder.IN_PROGRESS_to_DISPUTED
          - state_machines.CharterOrder.DISPUTED_to_COMPLETED
          - state_machines.CharterOrder.DISPUTED_to_CANCELLED
        distinguishing_aspect: |
          CharterOrder has a branching fork-join shape: IN_PROGRESS can fork to DISPUTED
          (customer dispute), from which it can join back to COMPLETED (resolve and complete)
          or diverge to CANCELLED (operator cancel) — non-linear with different side-effect
          sets per branch.
        test_recipe:
          setup:
            - "Order in IN_PROGRESS status with assigned vehicle and driver"
            - "Clock set such that trip_date has passed"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/customers"
              payload: { company_name: "Dispute Test", contact_email: "disp@x.com", contact_phone: "555-0500", billing_address: "500 Oak St" }
              as: QuoteAgent
              captures: { cust5_id: $.data.id }
            - call: "POST /api/v1/vehicles"
              payload: { unit_number: "MC-301", make_model: "MCI J4500", year: 2024, seating_capacity: 56, vehicle_class: "STANDARD", dot_inspection_expiry: "2027-06-01T00:00:00Z", maintenance_due_miles: 60000, insurance_policy_number: "INS-002", insurance_expiry: "2027-06-01T00:00:00Z" }
              as: FleetManager
              captures: { veh5_id: $.data.id }
            - call: "POST /api/v1/drivers"
              payload: { full_name: "Jane Doe", cdl_number: "CDL-002", cdl_class: "CLASS_A", endorsements: ["P"], hire_date: "2019-03-01T00:00:00Z" }
              as: FleetManager
              captures: { drv5_id: $.data.id }
            - call: "POST /api/v1/quotes"
              payload: { customer_id: "${cust5_id}", trip_date: "2026-07-15T08:00:00Z", return_date: "2026-07-15T18:00:00Z", origin: "Dallas TX", destination: "Houston TX", passenger_count: 50, estimated_miles: 500, estimated_hours: 8, vehicle_class_requested: "STANDARD" }
              as: QuoteAgent
              captures: { quote5_id: $.data.id }
            - call: "POST /api/v1/quotes/${quote5_id}/price"
              payload: {}
              as: QuoteAgent
              captures: { quote5_v: $.data.version }
            - call: "POST /api/v1/quotes/${quote5_id}/accept"
              payload: { expected_quote_version: "${quote5_v}" }
              as: Customer
              as_user_id: "${cust5_id}"
              captures: { order5_id: $.data.id }
            - call: "POST /api/v1/orders/${order5_id}/pay-deposit"
              payload: { amount_cents: 50000 }
              as: Customer
              as_user_id: "${cust5_id}"
            - call: "GET /api/v1/orders/${order5_id}"
              payload: {}
              as: DispatchManager
              captures: { order5_v: $.data.version }
            - call: "POST /api/v1/orders/${order5_id}/assign"
              payload: { vehicle_id: "${veh5_id}", driver_id: "${drv5_id}", expected_order_version: "${order5_v}" }
              as: DispatchManager
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T07:30:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/orders/${order5_id}/start-trip"
              payload: {}
              as: DispatchManager
          trigger:
            - call: "POST /api/v1/orders/${order5_id}/dispute"
              payload: { reason: "Driver was late and missed a scheduled stop" }
              as: Customer
              as_user_id: "${cust5_id}"
          assert:
            - "CharterOrder.${order5_id}.status == DISPUTED"
            - "CharterOrder.${order5_id}.cancellation_reason == 'Driver was late and missed a scheduled stop'"

      - name: breakdown_event_fork_to_replace_or_resolve
        grounds:
          - state_machines.BreakdownEvent
          - state_machines.BreakdownEvent.REPORTED_to_DISPATCHED
          - state_machines.BreakdownEvent.REPORTED_to_RESOLVED_IN_PLACE
        distinguishing_aspect: |
          BreakdownEvent has a branching fork from REPORTED: it can either dispatch a
          replacement (REPORTED→DISPATCHED→REPLACEMENT_EN_ROUTE→REPLACED) or resolve in
          place (REPORTED→RESOLVED_IN_PLACE), with different side-effect chains per branch.
        test_recipe:
          setup:
            - "Order in IN_PROGRESS with vehicle and driver"
            - "Second vehicle available as replacement"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/customers"
              payload: { company_name: "Breakdown Fork", contact_email: "brk@x.com", contact_phone: "555-0600", billing_address: "600 Cedar St" }
              as: QuoteAgent
              captures: { cust6_id: $.data.id }
            - call: "POST /api/v1/vehicles"
              payload: { unit_number: "MC-401", make_model: "Prevost H3-45", year: 2023, seating_capacity: 56, vehicle_class: "STANDARD", dot_inspection_expiry: "2027-01-01T00:00:00Z", maintenance_due_miles: 50000, insurance_policy_number: "INS-003", insurance_expiry: "2027-01-01T00:00:00Z" }
              as: FleetManager
              captures: { veh6_id: $.data.id }
            - call: "POST /api/v1/vehicles"
              payload: { unit_number: "MC-402", make_model: "MCI J4500", year: 2024, seating_capacity: 56, vehicle_class: "STANDARD", dot_inspection_expiry: "2027-06-01T00:00:00Z", maintenance_due_miles: 60000, insurance_policy_number: "INS-004", insurance_expiry: "2027-06-01T00:00:00Z" }
              as: FleetManager
              captures: { veh6b_id: $.data.id }
            - call: "POST /api/v1/drivers"
              payload: { full_name: "Bob Wilson", cdl_number: "CDL-003", cdl_class: "CLASS_B", endorsements: ["P", "S"], hire_date: "2021-06-01T00:00:00Z" }
              as: FleetManager
              captures: { drv6_id: $.data.id }
            - call: "POST /api/v1/quotes"
              payload: { customer_id: "${cust6_id}", trip_date: "2026-07-10T08:00:00Z", return_date: "2026-07-10T16:00:00Z", origin: "Austin TX", destination: "San Antonio TX", passenger_count: 40, estimated_miles: 300, estimated_hours: 6, vehicle_class_requested: "STANDARD" }
              as: QuoteAgent
              captures: { quote6_id: $.data.id }
            - call: "POST /api/v1/quotes/${quote6_id}/price"
              payload: {}
              as: QuoteAgent
              captures: { quote6_v: $.data.version }
            - call: "POST /api/v1/quotes/${quote6_id}/accept"
              payload: { expected_quote_version: "${quote6_v}" }
              as: Customer
              as_user_id: "${cust6_id}"
              captures: { order6_id: $.data.id }
            - call: "POST /api/v1/orders/${order6_id}/pay-deposit"
              payload: { amount_cents: 50000 }
              as: Customer
              as_user_id: "${cust6_id}"
            - call: "GET /api/v1/orders/${order6_id}"
              payload: {}
              as: DispatchManager
              captures: { order6_v: $.data.version }
            - call: "POST /api/v1/orders/${order6_id}/assign"
              payload: { vehicle_id: "${veh6_id}", driver_id: "${drv6_id}", expected_order_version: "${order6_v}" }
              as: DispatchManager
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T07:30:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/orders/${order6_id}/start-trip"
              payload: {}
              as: DispatchManager
            - call: "POST /api/v1/orders/${order6_id}/breakdowns"
              payload: { vehicle_id: "${veh6_id}", driver_id: "${drv6_id}", location: "I-35 Mile 220", description: "Engine overheating" }
              as: DispatchManager
              captures: { brk6_id: $.data.id }
          trigger:
            - call: "POST /api/v1/breakdowns/${brk6_id}/resolve-in-place"
              payload: { delay_minutes: 90 }
              as: DispatchManager
          assert:
            - "BreakdownEvent.${brk6_id}.status == RESOLVED_IN_PLACE"
            - "BreakdownEvent.${brk6_id}.delay_minutes == 90"
            - "BreakdownEvent.${brk6_id}.customer_compensation_cents > 0"

  # ==========================================================================
  # Rule 4: transitive_cascade — Two cascades from different triggers
  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: trip_completion_cascade_depth3
        grounds:
          - state_machines.CharterOrder.IN_PROGRESS_to_COMPLETED
          - state_machines.Vehicle.IN_TRIP_to_AVAILABLE
          - state_machines.Vehicle.IN_TRIP_to_IN_MAINTENANCE
          - state_machines.Driver.ON_TRIP_to_OFF_DUTY
        distinguishing_aspect: |
          Cascade of depth 3: complete-trip on CharterOrder mutates Vehicle (odometer
          crosses threshold → status IN_MAINTENANCE), which triggers creation of
          MaintenanceRecord (depth 3), and also mutates Driver (→OFF_DUTY) and
          CustomerAccount (derived fields updated).
        test_recipe:
          setup:
            - "Order IN_PROGRESS; vehicle odometer at 49900, maintenance_due at 50000; trip actual_miles=200 pushes odometer to 50100 >= 50000"
            - "Clock set to trip date"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/customers"
              payload: { company_name: "Cascade Test", contact_email: "casc@x.com", contact_phone: "555-0700", billing_address: "700 Birch Ln" }
              as: QuoteAgent
              captures: { cust7_id: $.data.id }
            - call: "POST /api/v1/vehicles"
              payload: { unit_number: "MC-501", make_model: "Prevost X3-45", year: 2022, seating_capacity: 56, vehicle_class: "STANDARD", dot_inspection_expiry: "2027-01-01T00:00:00Z", maintenance_due_miles: 50000, insurance_policy_number: "INS-005", insurance_expiry: "2027-01-01T00:00:00Z" }
              as: FleetManager
              captures: { veh7_id: $.data.id }
            - call: "POST /api/v1/drivers"
              payload: { full_name: "Alice Brown", cdl_number: "CDL-004", cdl_class: "CLASS_B", endorsements: ["P"], hire_date: "2020-06-01T00:00:00Z" }
              as: FleetManager
              captures: { drv7_id: $.data.id }
            - call: "POST /api/v1/quotes"
              payload: { customer_id: "${cust7_id}", trip_date: "2026-07-10T08:00:00Z", return_date: "2026-07-10T16:00:00Z", origin: "Dallas TX", destination: "Austin TX", passenger_count: 40, estimated_miles: 200, estimated_hours: 4, vehicle_class_requested: "STANDARD" }
              as: QuoteAgent
              captures: { quote7_id: $.data.id }
            - call: "POST /api/v1/quotes/${quote7_id}/price"
              payload: {}
              as: QuoteAgent
              captures: { quote7_v: $.data.version }
            - call: "POST /api/v1/quotes/${quote7_id}/accept"
              payload: { expected_quote_version: "${quote7_v}" }
              as: Customer
