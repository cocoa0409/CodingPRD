# =============================================================================
# task_0534_traffic_enforcement — §1.9 Scaffold Corner Design
# Breadth coverage of every testable claim not covered by §1.8.
# Standard program config identical to §1.8 unless noted.
# Logical clock startup default: 2026-05-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_program_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Program, endpoints]
        distinguishing_aspect: "POST /programs with all required fields returns 201 and echoes jurisdiction_name + fee fields; id/created_at/version system-minted (version==1)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /programs"
              payload: { jurisdiction_name: "Metro", base_red_light_fine_cents: 10000, base_speed_fine_cents: 8000, admin_fee_cents: 2500, late_fee_cents: 4000, response_window_days: 30, repeat_offender_window_days: 365, repeat_offender_surcharge_pct: 0.5 }
              as: SystemAdmin
              captures: { pid: $.data.id }
          assert:
            - "response code == 201"
            - "Program.${pid}.jurisdiction_name == Metro"
            - "Program.${pid}.version == 1"

      - name: get_program_not_found
        claim_type: Not Found
        grounds: [entities.Program, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /programs/{nonexistent-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /programs/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: SystemAdmin
          assert:
            - "response.error_id == ERR_NOT_FOUND"
            - "response code == 404"

      - name: list_cameras_paginated_envelope
        claim_type: Listing
        grounds: [entities.Camera, endpoints, response_envelope]
        distinguishing_aspect: "GET /cameras returns array response_type with total_count and has_more pagination fields."
        test_recipe:
          setup: ["Program with one RED_LIGHT camera."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { jurisdiction_name: "Metro", base_red_light_fine_cents: 10000, base_speed_fine_cents: 8000, admin_fee_cents: 2500, late_fee_cents: 4000 }
              as: SystemAdmin
              captures: { pid: $.data.id }
            - call: "POST /cameras"
              payload: { program_id: "${pid}", intersection_code: "INT-1", camera_type: "RED_LIGHT" }
              as: ProgramAdmin
              captures: { cam: $.data.id }
          trigger:
            - call: "GET /cameras"
              payload: { limit: 10, offset: 0 }
              as: ProgramAdmin
          assert:
            - "response.total_count == 1"
            - "response.has_more == false"

      - name: create_camera_missing_required_field
        claim_type: Required Fields
        grounds: [entities.Camera.fields.camera_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /cameras without camera_type returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Program created."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { jurisdiction_name: "Metro", base_red_light_fine_cents: 10000, base_speed_fine_cents: 8000, admin_fee_cents: 2500, late_fee_cents: 4000 }
              as: SystemAdmin
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /cameras"
              payload: { program_id: "${pid}", intersection_code: "INT-1" }
              as: ProgramAdmin
          assert:
            - "response.error_id == ERR_INVALID_REQUEST"

      - name: response_window_days_default_applied
        claim_type: Defaults
        grounds: [entities.Program.fields.response_window_days]
        distinguishing_aspect: "Omitting response_window_days on program create applies default 30 and repeat_offender_surcharge_pct 0.5."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /programs"
              payload: { jurisdiction_name: "Metro", base_red_light_fine_cents: 10000, base_speed_fine_cents: 8000, admin_fee_cents: 2500, late_fee_cents: 4000 }
              as: SystemAdmin
              captures: { pid: $.data.id }
          assert:
            - "Program.${pid}.response_window_days == 30"
            - "Program.${pid}.repeat_offender_surcharge_pct == 0.5"

      - name: assessed_amount_is_computed_input_ignored
        claim_type: Computed Fields
        grounds: [entities.Citation.fields.assessed_amount_cents, calculations.fine_schedule_statutory]
        distinguishing_aspect: "assessed_amount_cents is server-computed on CITED (12500 for RED first offense); client cannot set it via capture payload."
        test_recipe:
          setup: ["RED_LIGHT camera ACTIVE with PASS calibration; owner registered."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { jurisdiction_name: "Metro", base_red_light_fine_cents: 10000, base_speed_fine_cents: 8000, admin_fee_cents: 2500, late_fee_cents: 4000 }
              as: SystemAdmin
              captures: { pid: $.data.id }
            - call: "POST /cameras"
              payload: { program_id: "${pid}", intersection_code: "INT-1", camera_type: "RED_LIGHT" }
              as: ProgramAdmin
              captures: { cam: $.data.id }
            - call: "POST /cameras/${cam}/calibrations"
              payload: { performed_at_utc: "2026-04-01T00:00:00Z", valid_until_utc: "2026-12-01T00:00:00Z", technician_ref: "T1", result: "PASS" }
              as: ProgramAdmin
            - call: "POST /owners"
              payload: { program_id: "${pid}", plate_number: "ABC123", full_name: "Pat Owner", mailing_address: "1 St" }
              as: ProgramAdmin
              captures: { owner: $.data.id }
            - call: "POST /citations"
              payload: { program_id: "${pid}", camera_id: "${cam}", captured_plate_number: "ABC123", event_at_utc: "2026-05-01T08:00:00Z" }
              as: ReviewOfficer
              as_user_id: "ro-1"
              captures: { cit: $.data.id }
          trigger:
            - call: "POST /citations/${cit}/review"
              payload: { decision: "APPROVE" }
              as: ReviewOfficer
              as_user_id: "ro-1"
          assert:
            - "Citation.${cit}.assessed_amount_cents == 12500"

      - name: owner_portal_pin_is_system_minted
        claim_type: System Fields
        grounds: [entities.RegisteredOwner.fields.portal_access_pin]
        distinguishing_aspect: "portal_access_pin is server-minted on owner create and returned in the create response (non-null)."
        test_recipe:
          setup: ["Program created."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { jurisdiction_name: "Metro", base_red_light_fine_cents: 10000, base_speed_fine_cents: 8000, admin_fee_cents: 2500, late_fee_cents: 4000 }
              as: SystemAdmin
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /owners"
              payload: { program_id: "${pid}", plate_number: "ABC123", full_name: "Pat Owner", mailing_address: "1 St" }
              as: ProgramAdmin
              captures: { owner: $.data.id, pin: $.data.portal_access_pin }
          assert:
            - "RegisteredOwner.${owner}.portal_access_pin is non-null"

      - name: camera_type_invalid_enum_rejected
        claim_type: Type Constraints
        grounds: [entities.Camera.fields.camera_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "camera_type outside {RED_LIGHT, SPEED} returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Program created."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { jurisdiction_name: "Metro", base_red_light_fine_cents: 10000, base_speed_fine_cents: 8000, admin_fee_cents: 2500, late_fee_cents: 4000 }
              as: SystemAdmin
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /cameras"
              payload: { program_id: "${pid}", intersection_code: "INT-1", camera_type: "LIDAR" }
              as: ProgramAdmin
          assert:
            - "response.error_id == ERR_INVALID_REQUEST"

      - name: red_light_camera_with_speed_limit_rejected
        claim_type: Type Constraints
        grounds: [entities.Camera.fields.speed_limit_mph, "validations[priority=15]"]
        distinguishing_aspect: "RED_LIGHT camera supplying speed_limit_mph is rejected with ERR_INVALID_REQUEST (must be null for RED_LIGHT)."
        test_recipe:
          setup: ["Program created."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { jurisdiction_name: "Metro", base_red_light_fine_cents: 10000, base_speed_fine_cents: 8000, admin_fee_cents: 2500, late_fee_cents: 4000 }
              as: SystemAdmin
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /cameras"
              payload: { program_id: "${pid}", intersection_code: "INT-1", camera_type: "RED_LIGHT", speed_limit_mph: 40 }
              as: ProgramAdmin
          assert:
            - "response.error_id == ERR_INVALID_REQUEST"

      - name: citation_capture_wrong_program_camera_not_found
        claim_type: Parent Relationships
        grounds: [entities.Citation.fields.camera_id, "validations[priority=6]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Capture citing a camera_id from a DIFFERENT program returns ERR_NOT_FOUND (cross-program FK integrity)."
        test_recipe:
          setup: ["Program A with a camera; Program B (capture attempted under B with A's camera)."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { jurisdiction_name: "A", base_red_light_fine_cents: 10000, base_speed_fine_cents: 8000, admin_fee_cents: 2500, late_fee_cents: 4000 }
              as: SystemAdmin
              captures: { pidA: $.data.id }
            - call: "POST /cameras"
              payload: { program_id: "${pidA}", intersection_code: "INT-A", camera_type: "RED_LIGHT" }
              as: ProgramAdmin
              captures: { camA: $.data.id }
            - call: "POST /programs"
              payload: { jurisdiction_name: "B", base_red_light_fine_cents: 10000, base_speed_fine_cents: 8000, admin_fee_cents: 2500, late_fee_cents: 4000 }
              as: SystemAdmin
              captures: { pidB: $.data.id }
          trigger:
            - call: "POST /citations"
              payload: { program_id: "${pidB}", camera_id: "${camA}", captured_plate_number: "X", event_at_utc: "2026-05-01T08:00:00Z" }
              as: ReviewOfficer
              as_user_id: "ro-1"
          assert:
            - "response.error_id == ERR_NOT_FOUND"

      - name: notice_record_appended_on_citation_issuance
        claim_type: Creation
        grounds: [entities.NoticeRecord, endpoints]
        distinguishing_aspect: "On CITED, an INITIAL NoticeRecord is appended (audit log) discoverable via GET /citations/{id}/notices with amount_owed_snapshot_cents==12500."
        test_recipe:
          setup: ["RED_LIGHT citation reviewed to CITED (assessed 12500)."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { jurisdiction_name: "Metro", base_red_light_fine_cents: 10000, base_speed_fine_cents: 8000, admin_fee_cents: 2500, late_fee_cents: 4000 }
              as: SystemAdmin
              captures: { pid: $.data.id }
            - call: "POST /cameras"
              payload: { program_id: "${pid}", intersection_code: "INT-1", camera_type: "RED_LIGHT" }
              as: ProgramAdmin
              captures: { cam: $.data.id }
            - call: "POST /cameras/${cam}/calibrations"
              payload: { performed_at_utc: "2026-04-01T00:00:00Z", valid_until_utc: "2026-12-01T00:00:00Z", technician_ref: "T1", result: "PASS" }
              as: ProgramAdmin
            - call: "POST /owners"
              payload: { program_id: "${pid}", plate_number: "ABC123", full_name: "Pat", mailing_address: "1 St" }
              as: ProgramAdmin
              captures: { owner: $.data.id }
            - call: "POST /citations"
              payload: { program_id: "${pid}", camera_id: "${cam}", captured_plate_number: "ABC123", event_at_utc: "2026-05-01T08:00:00Z" }
              as: ReviewOfficer
              as_user_id: "ro-1"
              captures: { cit: $.data.id }
            - call: "POST /citations/${cit}/review"
              payload: { decision: "APPROVE" }
              as: ReviewOfficer
              as_user_id: "ro-1"
          trigger:
            - call: "GET /citations/${cit}/notices"
              payload: {}
              as: Auditor
              as_user_id: "aud-1"
          assert:
            - "response.total_count == 1"
            - "NoticeRecord[0].notice_type == INITIAL"
            - "NoticeRecord[0].amount_owed_snapshot_cents == 12500"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: review_already_reviewed_citation_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Citation.PENDING_REVIEW_to_CITED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Reviewing a citation already CITED returns ERR_INVALID_STATE; no second notice issued."
        test_recipe:
          setup: ["RED_LIGHT citation already reviewed to CITED."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { jurisdiction_name: "Metro", base_red_light_fine_cents: 10000, base_speed_fine_cents: 8000, admin_fee_cents: 2500, late_fee_cents: 4000 }
              as: SystemAdmin
              captures: { pid: $.data.id }
            - call: "POST /cameras"
              payload: { program_id: "${pid}", intersection_code: "INT-1", camera_type: "RED_LIGHT" }
              as: ProgramAdmin
              captures: { cam: $.data.id }
            - call: "POST /cameras/${cam}/calibrations"
              payload: { performed_at_utc: "2026-04-01T00:00:00Z", valid_until_utc: "2026-12-01T00:00:00Z", technician_ref: "T1", result: "PASS" }
              as: ProgramAdmin
            - call: "POST /owners"
              payload: { program_id: "${pid}", plate_number: "ABC123", full_name: "Pat", mailing_address: "1 St" }
              as: ProgramAdmin
              captures: { owner: $.data.id }
            - call: "POST /citations"
              payload: { program_id: "${pid}", camera_id: "${cam}", captured_plate_number: "ABC123", event_at_utc: "2026-05-01T08:00:00Z" }
              as: ReviewOfficer
              as_user_id: "ro-1"
              captures: { cit: $.data.id }
            - call: "POST /citations/${cit}/review"
              payload: { decision: "APPROVE" }
              as: ReviewOfficer
              as_user_id: "ro-1"
          trigger:
            - call: "POST /citations/${cit}/review"
              payload: { decision: "REJECT" }
              as: ReviewOfficer
              as_user_id: "ro-1"
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "Citation.${cit}.status == CITED"

      - name: new_citation_initial_state_pending_review
        claim_type: Initial State
        grounds: [state_machines.Citation, entities.Citation.fields.status]
        distinguishing_aspect: "A freshly captured citation starts in PENDING_REVIEW."
        test_recipe:
          setup: ["RED_LIGHT camera ACTIVE."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { jurisdiction_name: "Metro", base_red_light_fine_cents: 10000, base_speed_fine_cents: 8000, admin_fee_cents: 2500, late_fee_cents: 4000 }
              as: SystemAdmin
              captures: { pid: $.data.id }
            - call: "POST /cameras"
              payload: { program_id: "${pid}", intersection_code: "INT-1", camera_type: "RED_LIGHT" }
              as: ProgramAdmin
              captures: { cam: $.data.id }
          trigger:
            - call: "POST /citations"
              payload: { program_id: "${pid}", camera_id: "${cam}", captured_plate_number: "ABC123", event_at_utc: "2026-05-01T08:00:00Z" }
              as: ReviewOfficer
              as_user_id: "ro-1"
              captures: { cit: $.data.id }
          assert:
            - "Citation.${cit}.status == PENDING_REVIEW"

      - name: terminal_rejected_citation_no_transitions
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Citation, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A REJECTED (terminal) citation cannot be voided -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["RED_LIGHT citation reviewed with REJECT (terminal)."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { jurisdiction_name: "Metro", base_red_light_fine_cents: 10000, base_speed_fine_cents: 8000, admin_fee_cents: 2500, late_fee_cents: 4000 }
              as: SystemAdmin
              captures: { pid: $.data.id }
            - call: "POST /cameras"
              payload: { program_id: "${pid}", intersection_code: "INT-1", camera_type: "RED_LIGHT" }
              as: ProgramAdmin
              captures: { cam: $.data.id }
            - call: "POST /citations"
              payload: { program_id: "${pid}", camera_id: "${cam}", captured_plate_number: "ABC123", event_at_utc: "2026-05-01T08:00:00Z" }
              as: ReviewOfficer
              as_user_id: "ro-1"
              captures: { cit: $.data.id }
            - call: "POST /citations/${cit}/review"
              payload: { decision: "REJECT" }
              as: ReviewOfficer
              as_user_id: "ro-1"
          trigger:
            - call: "POST /citations/${cit}/void"
              payload: {}
              as: ProgramAdmin
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "Citation.${cit}.status == REJECTED"

      - name: reactivate_active_camera_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Camera.SUSPENDED_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Reactivating a camera already ACTIVE returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE camera."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { jurisdiction_name: "Metro", base_red_light_fine_cents: 10000, base_speed_fine_cents: 8000, admin_fee_cents: 2500, late_fee_cents: 4000 }
              as: SystemAdmin
              captures: { pid: $.data.id }
            - call: "POST /cameras"
              payload: { program_id: "${pid}", intersection_code: "INT-1", camera_type: "RED_LIGHT" }
              as: ProgramAdmin
              captures: { cam: $.data.id }
          trigger:
            - call: "POST /cameras/${cam}/reactivate"
              payload: {}
              as: ProgramAdmin
          assert:
            - "response.error_id == ERR_INVALID_STATE"

      - name: capture_on_suspended_camera_no_violation
        claim_type: guarded transitions
        grounds: ["validations[priority=10]", entities.Camera.fields.status, "errors[ERR_NO_VIOLATION]"]
        distinguishing_aspect: "Capture on a SUSPENDED camera returns ERR_NO_VIOLATION (capture only while ACTIVE) — cross-entity guard."
        test_recipe:
          setup: ["RED_LIGHT camera suspended."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { jurisdiction_name: "Metro", base_red_light_fine_cents: 10000, base_speed_fine_cents: 8000, admin_fee_cents: 2500, late_fee_cents: 4000 }
              as: SystemAdmin
              captures: { pid: $.data.id }
            - call: "POST /cameras"
              payload: { program_id: "${pid}", intersection_code: "INT-1", camera_type: "RED_LIGHT" }
              as: ProgramAdmin
              captures: { cam: $.data.id }
            - call: "POST /cameras/${cam}/suspend"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /citations"
              payload: { program_id: "${pid}", camera_id: "${cam}", captured_plate_number: "ABC123", event_at_utc: "2026-05-01T08:00:00Z" }
              as: ReviewOfficer
              as_user_id: "ro-1"
          assert:
            - "response.error_id == ERR_NO_VIOLATION"

      - name: calibration_recompute_certified_until
        claim_type: Side Effect Execution
        grounds: [entities.Camera.fields.certified_until_clock, endpoints]
        distinguishing_aspect: "Logging a PASS calibration recomputes camera.certified_until_clock to that record's valid_until_utc."
        test_recipe:
          setup: ["RED_LIGHT camera."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { jurisdiction_name: "Metro", base_red_light_fine_cents: 10000, base_speed_fine_cents: 8000, admin_fee_cents: 2500, late_fee_cents: 4000 }
              as: SystemAdmin
              captures: { pid: $.data.id }
            - call: "POST /cameras"
              payload: { program_id: "${pid}", intersection_code: "INT-1", camera_type: "RED_LIGHT" }
              as: ProgramAdmin
              captures: { cam: $.data.id }
          trigger:
            - call: "POST /cameras/${cam}/calibrations"
              payload: { performed_at_utc: "2026-04-01T00:00:00Z", valid_until_utc: "2026-12-01T00:00:00Z", technician_ref: "T1", result: "PASS" }
              as: ProgramAdmin
          assert:
            - "Camera.${cam}.certified_until_clock == 2026-12-01T00:00:00.000Z"

  # ===========================================================================
  - section: calculations
    instances:
      - name: speed_band3_over_20_multiplier
        claim_type: Correct Result
        grounds: [calculations.fine_schedule_statutory]
        distinguishing_aspect: "SPEED over=25 (measured 65, limit 40) selects band 2.5 -> base round(8000*2.5)=20000, assessed 22500."
        test_recipe:
          setup: ["SPEED camera limit=40 ACTIVE with PASS calibration; owner registered."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { jurisdiction_name: "Metro", base_red_light_fine_cents: 10000, base_speed_fine_cents: 8000, admin_fee_cents: 2500, late_fee_cents: 4000 }
              as: SystemAdmin
              captures: { pid: $.data.id }
            - call: "POST /cameras"
              payload: { program_id: "${pid}", intersection_code: "SPD-1", camera_type: "SPEED", speed_limit_mph: 40 }
              as: ProgramAdmin
              captures: { cam: $.data.id }
            - call: "POST /cameras/${cam}/calibrations"
              payload: { performed_at_utc: "2026-04-01T00:00:00Z", valid_until_utc: "2026-12-01T00:00:00Z", technician_ref: "T1", result: "PASS" }
              as: ProgramAdmin
            - call: "POST /owners"
              payload: { program_id: "${pid}", plate_number: "FAST1", full_name: "Sam", mailing_address: "9 St" }
              as: ProgramAdmin
              captures: { owner: $.data.id }
            - call: "POST /citations"
              payload: { program_id: "${pid}", camera_id: "${cam}", captured_plate_number: "FAST1", event_at_utc: "2026-05-01T08:00:00Z", measured_speed_mph: 65 }
              as: ReviewOfficer
              as_user_id: "ro-1"
              captures: { cit: $.data.id }
          trigger:
            - call: "POST /citations/${cit}/review"
              payload: { decision: "APPROVE" }
              as: ReviewOfficer
              as_user_id: "ro-1"
          assert:
            - "Citation.${cit}.assessed_amount_cents == 22500"

      - name: amount_owed_includes_late_fee_after_sweep
        claim_type: Correct Result
        grounds: [calculations.amount_owed_total, state_machines.Citation.CITED_to_DELINQUENT]
        distinguishing_aspect: "After escalation sweep past the delinquency deadline, citation becomes DELINQUENT with escalation_stage DELINQUENT (late fee 4000 enters amount_owed_total = 16500)."
        test_recipe:
          setup: ["RED_LIGHT citation CITED with notice at default clock; clock advanced beyond due + one window; sweep run."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { jurisdiction_name: "Metro", base_red_light_fine_cents: 10000, base_speed_fine_cents: 8000, admin_fee_cents: 2500, late_fee_cents: 4000, response_window_days: 30 }
              as: SystemAdmin
              captures: { pid: $.data.id }
            - call: "POST /cameras"
              payload: { program_id: "${pid}", intersection_code: "INT-1", camera_type: "RED_LIGHT" }
              as: ProgramAdmin
              captures: { cam: $.data.id }
            - call: "POST /cameras/${cam}/calibrations"
              payload: { performed_at_utc: "2026-04-01T00:00:00Z", valid_until_utc: "2026-12-01T00:00:00Z", technician_ref: "T1", result: "PASS" }
              as: ProgramAdmin
            - call: "POST /owners"
              payload: { program_id: "${pid}", plate_number: "ABC123", full_name: "Pat", mailing_address: "1 St" }
              as: ProgramAdmin
              captures: { owner: $.data.id }
            - call: "POST /citations"
              payload: { program_id: "${pid}", camera_id: "${cam}", captured_plate_number: "ABC123", event_at_utc: "2026-05-01T00:00:00Z" }
              as: ReviewOfficer
              as_user_id: "ro-1"
              captures: { cit: $.data.id }
            - call: "POST /citations/${cit}/review"
              payload: { decision: "APPROVE" }
              as: ReviewOfficer
              as_user_id: "ro-1"
            - call: "POST /_clock/set_current_utc"
