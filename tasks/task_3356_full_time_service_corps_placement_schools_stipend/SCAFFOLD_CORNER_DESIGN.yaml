            - "${asg2_bf} == true (created while UNDERSTAFFED => backfill)"
            - "${team_after} == DEPLOYED and ${team_bc} == 1 and ${team_cnt} == 1 (backfill auto-restores deployment)"

      - name: enroll_creates_member_side_effect
        claim_type: side_effect
        grounds:
          - state_machines.CorpsMemberApplication.ACCEPTED_to_ENROLLED
          - entities.CorpsMemberApplication.fields.enrolled_member_id
        distinguishing_aspect: "ENROLLED is the only pipeline state that spawns a resource: the new CorpsMember appears in the site's member list with service ENROLLED, stipend NOT_STARTED, award NOT_EARNED, and the application back-references it."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Site ACTIVE. Application ACCEPTED."
          setup_api_calls:
            - *c_clock
            - *c_site
            - *c_site_on
            - *c_app
            - *c_screen
            - *c_interview
            - *c_offer
            - *c_accept
          trigger:
            - call: "POST /corps/applications/${app_id}/state"
              payload: { to_status: "ENROLLED" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { new_member: $.data.enrolled_member_id, app_st: $.data.status }
            - call: "GET /corps/sites/${site_id}/members"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { m0_id: "$.data[0].id", m0_svc: "$.data[0].service_status", m0_stip: "$.data[0].stipend_status", m0_award: "$.data[0].award_status" }
          assert:
            - "${app_st} == ENROLLED (terminal)"
            - "${m0_id} == ${new_member} and ${m0_svc} == ENROLLED and ${m0_stip} == NOT_STARTED and ${m0_award} == NOT_EARNED"
            - "The site's member list reports total_count == 1"

      - name: member_activation_cascades_stipend_active
        claim_type: side_effect
        grounds:
          - state_machines.CorpsMember.service_status.ENROLLED_to_ACTIVE
          - entities.CorpsMember.fields.stipend_status
        distinguishing_aspect: "The ENROLLED -> ACTIVE service transition carries an intra-entity cascade: stipend_status flips NOT_STARTED -> ACTIVE in the same response."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Site ACTIVE. Member ENROLLED (stipend NOT_STARTED)."
          setup_api_calls:
            - *c_clock
            - *c_site
            - *c_site_on
            - *c_app
            - *c_screen
            - *c_interview
            - *c_offer
            - *c_accept
            - *c_enroll
          trigger:
            - call: "POST /corps/members/${member_id}/state"
              payload: { to_status: "ACTIVE", dimension: "SERVICE" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { svc: $.data.service_status, stip: $.data.stipend_status }
          assert:
            - "${svc} == ACTIVE and ${stip} == ACTIVE (single request, both dimensions)"

      - name: site_close_blocked_with_live_members
        claim_type: precondition
        grounds:
          - state_machines.Site.status
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "CLOSED is gated on aggregate child state: any member still ENROLLED/ACTIVE/SUSPENDED blocks the close; once the last member exits, the same close succeeds."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Site ACTIVE with one ACTIVE member (no teams)."
          setup_api_calls:
            - *c_clock
            - *c_site
            - *c_site_on
            - *c_app
            - *c_screen
            - *c_interview
            - *c_offer
            - *c_accept
            - *c_enroll
            - *c_activate
            - call: "GET /corps/members/${member_id}"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { m_v: $.data.version }
          trigger:
            - call: "POST /corps/sites/${site_id}/state"
              payload: { to_status: "CLOSED" }
              as: SiteDirector
              as_user_id: "sd-1"
              captures: { close_err: $.data.error_id }
            - call: "POST /corps/members/${member_id}/exit"
              payload: { expected_member_version: "${m_v}", exit_type: "FOR_CAUSE" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { exit_st: $.data.service_status }
            - call: "POST /corps/sites/${site_id}/state"
              payload: { to_status: "CLOSED" }
              as: SiteDirector
              as_user_id: "sd-1"
              captures: { site_st: $.data.status }
          assert:
            - "${close_err} == ERR_INVALID_STATE (live member blocks CLOSED)"
            - "${exit_st} == EXITED_EARLY"
            - "${site_st} == CLOSED (same call succeeds once no member is live)"

  # ===========================================================================
  - section: calculations
    instances:

      - name: funding_posture_threshold_walk
        claim_type: Correct Result
        grounds:
          - calculations.site_funding_posture
          - entities.Site.fields.funding_posture
        distinguishing_aspect: "Posture walks all three bands on exact boundaries: headroom -1300000 -> DEFICIT, exactly 0 -> TIGHT (lower bound inclusive), exactly 500000 -> FUNDED (upper bound inclusive)."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Site ACTIVE with one ACTIVE member (projected obligations 1300000) and no funding received."
          setup_api_calls:
            - *c_clock
            - *c_site
            - *c_site_on
            - *c_app
            - *c_screen
            - *c_interview
            - *c_offer
            - *c_accept
            - *c_enroll
            - *c_activate
            - call: "GET /corps/sites/${site_id}"
              payload: {}
              as: StipendAdministrator
              as_user_id: "sa-1"
              captures: { post0: $.data.funding_posture, head0: $.data.funding_headroom_cents }
          trigger:
            - call: "POST /corps/sites/${site_id}/funding/receive"
              payload: { funding_type: "DISTRICT", amount_cents: 1300000 }
              as: SiteDirector
              as_user_id: "sd-1"
              captures: { post1: $.data.funding_posture, head1: $.data.funding_headroom_cents }
            - call: "POST /corps/sites/${site_id}/funding/receive"
              payload: { funding_type: "FEDERAL", amount_cents: 500000 }
              as: SiteDirector
              as_user_id: "sd-1"
              captures: { post2: $.data.funding_posture, head2: $.data.funding_headroom_cents }
          assert:
            - "${post0} == DEFICIT and ${head0} == -1300000 (0 received - 0 outlay - 1300000 obligations)"
            - "${post1} == TIGHT and ${head1} == 0 (0 is inside the TIGHT band: 0 <= 0 < 500000)"
            - "${post2} == FUNDED and ${head2} == 500000 (500000 is NOT < 500000 — upper boundary lands in FUNDED)"

      - name: evaluation_metrics_empty_set_zero_pct
        claim_type: Input Set Filtering
        grounds:
          - calculations.evaluation_metrics
          - entities.EvaluationReport.fields.pct_improved
        distinguishing_aspect: "Empty eligible set: a school with no students yields eligible 0, improved 0 and pct_improved exactly 0.0 — the pinned empty-set rule, not an error and not null."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Site ACTIVE, school ACTIVE with data sharing SIGNED. No students."
          setup_api_calls:
            - *c_clock
            - *c_site
            - *c_site_on
            - *c_school
            - *c_ds_sign
            - *c_agr_sign
            - *c_agr_active
          trigger:
            - call: "POST /corps/evaluation-reports"
              payload: { school_id: "${school_id}", period_start: "2026-09-01", period_end: "2026-10-31" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { rep_el: $.data.eligible_student_count, rep_im: $.data.improved_student_count, rep_pct: $.data.pct_improved, rep_st: $.data.status }
          assert:
            - "${rep_el} == 0 and ${rep_im} == 0"
            - "${rep_pct} == 0.0 (division-by-zero guarded by the pinned empty-set rule)"
            - "${rep_st} == DRAFT"

      - name: report_metrics_pct_and_improvement_boundary
        claim_type: Correct Result
        grounds:
          - calculations.evaluation_metrics
          - entities.Student.fields.current_attendance_pct
        distinguishing_aspect: "Improvement threshold is inclusive: +5.0 points counts as improved while +4.9 does not; pct_improved = round_half_up(100 x 1 / 2, 1) = 50.0. Caseload overlap with the period defines eligibility."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Full world: Team Alpha DEPLOYED with the member. Student A (baseline 80.0, current 85.0) and student B (baseline 80.0, current 84.9), both ASSIGNED to the member on 2026-09-01."
          setup_api_calls:
            - *c_clock
            - *c_site
            - *c_site_on
            - *c_school
            - *c_ds_sign
            - *c_agr_sign
            - *c_agr_active
            - *c_team
            - *c_app
            - *c_screen
            - *c_interview
            - *c_offer
            - *c_accept
            - *c_enroll
            - *c_activate
            - *c_assign
            - *c_deploy
            - call: "POST /corps/students"
              payload: { school_id: "${school_id}", external_student_ref: "SA", grade_level: 4, focus_list_type: "ATTENDANCE", baseline_attendance_pct: 80.0 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { stu_a: $.data.id }
            - call: "POST /corps/students/${stu_a}/caseload"
              payload: { action: "ASSIGN", corps_member_id: "${member_id}" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /corps/students/${stu_a}/metrics"
              payload: { current_attendance_pct: 85.0 }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /corps/students"
              payload: { school_id: "${school_id}", external_student_ref: "SB", grade_level: 4, focus_list_type: "ATTENDANCE", baseline_attendance_pct: 80.0 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { stu_b: $.data.id }
            - call: "POST /corps/students/${stu_b}/caseload"
              payload: { action: "ASSIGN", corps_member_id: "${member_id}" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /corps/students/${stu_b}/metrics"
              payload: { current_attendance_pct: 84.9 }
              as: ProgramManager
              as_user_id: "pm-1"
          trigger:
            - call: "POST /corps/evaluation-reports"
              payload: { school_id: "${school_id}", period_start: "2026-09-01", period_end: "2026-10-31" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { rep_el: $.data.eligible_student_count, rep_im: $.data.improved_student_count, rep_pct: $.data.pct_improved }
          assert:
            - "${rep_el} == 2 (both caseloads overlap the period)"
            - "${rep_im} == 1 (85.0 - 80.0 == 5.0 meets the inclusive threshold; 84.9 - 80.0 == 4.9 does not)"
            - "${rep_pct} == 50.0"

      - name: hour_totals_exclude_nonverified
        claim_type: Input Set Filtering
        grounds:
          - calculations.verified_hour_aggregation
          - entities.CorpsMember.fields.verified_hours_total
        distinguishing_aspect: "Only VERIFIED entries enter the totals: PENDING (4.0), REJECTED (3.0) and a verified-then-VOIDED entry (2.0) all contribute 0; the lone 5.0 VERIFIED entry is the whole total."
        test_recipe:
          setup:
            - "Clock 2026-09-09T00:00:00Z. Site ACTIVE, member ACTIVE. Entries: 5.0 DIRECT on 09-01 verified; 4.0 TRAINING on 09-02 left PENDING; 3.0 DIRECT on 09-03 rejected; 2.0 FUNDRAISING on 09-04 verified then voided."
          setup_api_calls:
            - *c_clock
            - *c_site
            - *c_site_on
            - *c_app
            - *c_screen
            - *c_interview
            - *c_offer
            - *c_accept
            - *c_enroll
            - *c_activate
            - call: "POST /corps/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T00:00:00Z" }
              as: SiteDirector
              as_user_id: "sd-1"
            - call: "POST /corps/hour-entries"
              payload: { corps_member_id: "${member_id}", service_date: "2026-09-01", hours: 5.0, category: "DIRECT_SERVICE" }
              as: CorpsMember
              as_user_id: "${member_id}"
              captures: { h1: $.data.id }
            - call: "POST /corps/hour-entries/${h1}/review"
              payload: { decision: "VERIFY" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /corps/hour-entries"
              payload: { corps_member_id: "${member_id}", service_date: "2026-09-02", hours: 4.0, category: "TRAINING" }
              as: CorpsMember
              as_user_id: "${member_id}"
            - call: "POST /corps/hour-entries"
              payload: { corps_member_id: "${member_id}", service_date: "2026-09-03", hours: 3.0, category: "DIRECT_SERVICE" }
              as: CorpsMember
              as_user_id: "${member_id}"
              captures: { h3: $.data.id }
            - call: "POST /corps/hour-entries/${h3}/review"
              payload: { decision: "REJECT", reason: "unverifiable" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /corps/hour-entries"
              payload: { corps_member_id: "${member_id}", service_date: "2026-09-04", hours: 2.0, category: "FUNDRAISING" }
              as: CorpsMember
              as_user_id: "${member_id}"
              captures: { h4: $.data.id }
            - call: "POST /corps/hour-entries/${h4}/review"
              payload: { decision: "VERIFY" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /corps/hour-entries/${h4}/review"
              payload: { decision: "VOID", reason: "logged to wrong member" }
              as: ProgramManager
              as_user_id: "pm-1"
          trigger:
            - call: "GET /corps/members/${member_id}"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { tot: $.data.verified_hours_total, fund: $.data.verified_fundraising_hours }
          assert:
            - "${tot} == 5.0 (PENDING 4.0, REJECTED 3.0 and VOIDED 2.0 all excluded)"
            - "${fund} == 0.0 (the voided FUNDRAISING entry left the fundraising ledger too)"

      - name: award_projection_partial_at_year_end
        claim_type: Correct Result
        grounds:
          - calculations.education_award
          - entities.CorpsMember.fields.award_projected_cents
        distinguishing_aspect: "At the service year end the projection has zero remaining days, so it collapses onto verified hours: 60.0 verified -> projected 60.0 -> pro-rata round_half_up(739500 x 60 / 120) = 369750, not the full award."
