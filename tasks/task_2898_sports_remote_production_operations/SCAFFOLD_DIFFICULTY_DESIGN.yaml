# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2898 — Sports Remote Production Operations
#
# Shared fixture conventions used by every instance below (all literals, no wall clock):
#   logical clock startup default            2026-08-01T00:00:00Z
#   operator ids                             pm-001 (ProductionManager), td-001 (TechnicalDirector),
#                                            lo-001 (LeagueOperations), us-001 (UnionSteward)
#   canonical TIER_3 production window       2026-08-15T18:00:00Z .. 2026-08-15T22:00:00Z,
#                                            curfew 2026-08-16T06:00:00Z, venue power 400 A
#   TIER_3 gate counts                       required_crew_positions = 2, required_validated_preps = 1
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: crew_call_provisional_versus_settled_labor_cost_diverge
        grounds:
          - calculations.crew_call_labor_cost
          - entities.CrewCall.fields.provisional_total_cents
          - entities.CrewCall.fields.settled_total_cents
          - entities.CrewCall.fields.meal_penalty_units
          - state_machines.CrewCall.ACCEPTED_to_RELEASED
        distinguishing_aspect: |
          Dual-variant cost accounting on the CrewCall entity domain: identical call data produces
          provisional_total_cents == 131000 (projected off scheduled_release_utc, assuming NO meal
          break, 4 capped penalty units) and settled_total_cents == 96750 (chronological, off
          actual_release_utc with a meal break taken at +300 min, 0 penalty units).
        test_recipe:
          setup:
            - "One TIER_3 production with labor_budget_total_cents = 2000000 and no other crew calls."
            - "One STAFF crew member certified for TIER_3 at hourly_rate_cents = 9000."
            - "One ACCEPTED crew call called at 2026-08-15T16:00:00Z with scheduled_release_utc 12 hours later (720 worked minutes projected)."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_id: $.data.id }
            - call: "POST /broadcast-ops/crew-members"
              payload: { full_name: "Dana Reyes", position: "TD", employment_type: "STAFF", union_local: "L600", certified_tiers: ["TIER_3"], hourly_rate_cents: 9000, home_base_code: "SEA" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { cm1_id: $.data.id }
            - call: "GET /broadcast-ops/productions/${prod_id}"
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { pv1: $.data.version }
            - call: "POST /broadcast-ops/crew-calls"
              payload: { production_id: "${prod_id}", crew_member_id: "${cm1_id}", call_time_utc: "2026-08-15T16:00:00Z", scheduled_release_utc: "2026-08-16T04:00:00Z", expected_production_version: "${pv1}" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { call1_id: $.data.id, prov_cents: $.data.provisional_total_cents }
            - call: "POST /broadcast-ops/crew-calls/${call1_id}/respond"
              payload: { decision: "ACCEPT" }
              as: CrewMember
              as_user_id: "${cm1_id}"
          trigger:
            - call: "POST /broadcast-ops/crew-calls/${call1_id}/release"
              payload: { actual_release_utc: "2026-08-16T02:30:00Z", meal_break_start_utc: "2026-08-15T21:00:00Z" }
              as: ProductionManager
              as_user_id: "pm-001"
          assert:
            - "CrewCall.${call1_id}.provisional_total_cents == 131000"
            - "CrewCall.${call1_id}.settled_total_cents == 96750"
            - "CrewCall.${call1_id}.meal_penalty_units == 0"
            - "CrewCall.${call1_id}.status == RELEASED"
            - "CrewMember.${cm1_id}.lifetime_meal_penalty_units == 0"
            - "Production.${prod_id}.labor_committed_cents == 96750"
            - "Production.${prod_id}.labor_available_cents == 1903250"

      - name: production_readiness_preflight_versus_certified_diverge
        grounds:
          - calculations.production_readiness_score
          - entities.Production.fields.readiness_score_preflight
          - entities.Production.fields.readiness_score_certified
          - entities.Production.fields.required_crew_positions
          - state_machines.VenueSurvey.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Dual-variant readiness scoring on the Production entity domain (a different subject and a
          different metric from the CrewCall cost variants): with one RESERVED primary booking, one
          PENDING prep and one of two crew calls accepted, readiness_score_preflight == 100.00 while
          readiness_score_certified == 47.50 on the same row in the same response.
        test_recipe:
          setup:
            - "TIER_3 production with an APPROVED 2-position venue survey (cable runs 150 ft and 250 ft)."
            - "One PRIMARY PathBooking still in RESERVED (no test scheduled, no test result)."
            - "One SystemPrep still in PENDING (validate-feed never called)."
            - "Two crew calls: one ACCEPTED, one still OFFERED. No truck assigned."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_id: $.data.id }
            - call: "POST /broadcast-ops/venue-surveys"
              payload: { production_id: "${prod_id}", surveyor_name: "R. Ito", fiber_drops_required: 2 }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { survey_id: $.data.id }
            - call: "POST /broadcast-ops/venue-surveys/${survey_id}/camera-positions"
              payload: { label: "HIGH_HOME", position_type: "HARD", cable_run_feet: 150, power_draw_amps: 20 }
              as: TechnicalDirector
              as_user_id: "td-001"
            - call: "POST /broadcast-ops/venue-surveys/${survey_id}/camera-positions"
              payload: { label: "LOW_FIRST", position_type: "HANDHELD", cable_run_feet: 250, power_draw_amps: 20 }
              as: TechnicalDirector
              as_user_id: "td-001"
            - call: "POST /broadcast-ops/venue-surveys/${survey_id}/submit"
              as: TechnicalDirector
              as_user_id: "td-001"
            - call: "POST /broadcast-ops/venue-surveys/${survey_id}/review"
              payload: { decision: "APPROVE" }
              as: LeagueOperations
              as_user_id: "lo-001"
            - call: "POST /broadcast-ops/transmission-paths"
              payload: { path_code: "FIB-A", path_type: "FIBER", carrier_code: "CARR1", capacity_mbps: 300, redundancy_class: "PRIMARY_ELIGIBLE" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { path_a_id: $.data.id }
            - call: "GET /broadcast-ops/productions/${prod_id}"
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { pv1: $.data.version }
            - call: "POST /broadcast-ops/path-bookings"
              payload: { production_id: "${prod_id}", path_id: "${path_a_id}", booking_role: "PRIMARY", window_start_utc: "2026-08-15T16:00:00Z", window_end_utc: "2026-08-15T23:00:00Z", requested_mbps: 100, expected_production_version: "${pv1}" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { booking_id: $.data.id }
            - call: "POST /broadcast-ops/data-feeds"
              payload: { provider_code: "STATSCO", feed_kind: "LIVE_STATS", latency_ms: 120, contract_expiry_utc: "2026-12-31T00:00:00Z", max_concurrent_consumers: 2 }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { feed_id: $.data.id }
            - call: "POST /broadcast-ops/system-preps"
              payload: { production_id: "${prod_id}", data_feed_id: "${feed_id}", system_kind: "GRAPHICS" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { prep_id: $.data.id }
            - call: "POST /broadcast-ops/crew-members"
              payload: { full_name: "Dana Reyes", position: "TD", employment_type: "STAFF", union_local: "L600", certified_tiers: ["TIER_3"], hourly_rate_cents: 9000, home_base_code: "SEA" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { cm1_id: $.data.id }
            - call: "POST /broadcast-ops/crew-members"
              payload: { full_name: "Ellis Park", position: "EIC", employment_type: "STAFF", union_local: "L600", certified_tiers: ["TIER_3"], hourly_rate_cents: 9000, home_base_code: "SEA" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { cm2_id: $.data.id }
            - call: "GET /broadcast-ops/productions/${prod_id}"
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { pv2: $.data.version }
            - call: "POST /broadcast-ops/crew-calls"
              payload: { production_id: "${prod_id}", crew_member_id: "${cm1_id}", call_time_utc: "2026-08-15T16:00:00Z", scheduled_release_utc: "2026-08-16T02:00:00Z", expected_production_version: "${pv2}" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { call1_id: $.data.id }
            - call: "POST /broadcast-ops/crew-calls/${call1_id}/respond"
              payload: { decision: "ACCEPT" }
              as: CrewMember
              as_user_id: "${cm1_id}"
            - call: "GET /broadcast-ops/productions/${prod_id}"
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { pv3: $.data.version }
            - call: "POST /broadcast-ops/crew-calls"
              payload: { production_id: "${prod_id}", crew_member_id: "${cm2_id}", call_time_utc: "2026-08-15T16:00:00Z", scheduled_release_utc: "2026-08-16T02:00:00Z", expected_production_version: "${pv3}" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { call2_id: $.data.id }
          trigger:
            - call: "GET /broadcast-ops/productions/${prod_id}"
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { preflight: $.data.readiness_score_preflight, certified: $.data.readiness_score_certified }
          assert:
            - "Production.${prod_id}.readiness_score_preflight == 100.00"
            - "Production.${prod_id}.readiness_score_certified == 47.50"
            - "Production.${prod_id}.status == SURVEYED"
            - "PathBooking.${booking_id}.status == RESERVED"
            - "SystemPrep.${prep_id}.status == PENDING"
            - "CrewCall.${call2_id}.status == OFFERED"
            - "VenueSurvey.${survey_id}.total_signal_loss_db == 5.41"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: crew_call_double_time_band_crossing_nonlinear_rate_selection
        grounds:
          - calculations.crew_call_labor_cost
          - entities.CrewCall.fields.effective_rate_cents
          - entities.CrewCall.fields.provisional_total_cents
          - validations[priority=3]
        distinguishing_aspect: |
          Mode (a) — four interacting inputs (effective rate, worked minutes, two nested band caps via
          min/max, and the capped penalty-unit count) with straight/overtime/double-time bands each
          rounded before summation: 780 worked minutes at 12000 cents/h freelance offer rate yields
          exactly 149000+ cents, not rate x hours, and not a single-band multiplication.
        test_recipe:
          setup:
            - "One TIER_3 production with labor_budget_total_cents = 2000000."
            - "One FREELANCE crew member whose card rate is 5000 but whose crew call carries offer_rate_cents = 9000, so the offer rate wins."
            - "The call spans 780 minutes: 600 straight + 120 overtime at 1.5x + 60 double time at 2.0x."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_id: $.data.id }
            - call: "POST /broadcast-ops/crew-members"
              payload: { full_name: "Kai Moreno", position: "REPLAY_OP", employment_type: "FREELANCE", union_local: "L600", certified_tiers: ["TIER_3"], hourly_rate_cents: 5000, home_base_code: "PDX" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { cm1_id: $.data.id }
            - call: "GET /broadcast-ops/productions/${prod_id}"
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { pv1: $.data.version }
          trigger:
            - call: "POST /broadcast-ops/crew-calls"
              payload: { production_id: "${prod_id}", crew_member_id: "${cm1_id}", call_time_utc: "2026-08-15T16:00:00Z", scheduled_release_utc: "2026-08-16T05:00:00Z", offer_rate_cents: 9000, expected_production_version: "${pv1}" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { call1_id: $.data.id }
          assert:
            - "CrewCall.${call1_id}.effective_rate_cents == 9000"
            - "CrewCall.${call1_id}.meal_penalty_units == 4"
            - "CrewCall.${call1_id}.provisional_total_cents == 149000"
            - "Production.${prod_id}.labor_committed_cents == 149000"
            - "Production.${prod_id}.labor_available_cents == 1851000"
            - "A flat 9000 x 13h computation would yield 117000 and a single-band 1.5x computation 175500; both are wrong."

      - name: survey_signal_loss_rounds_per_position_before_summing
        grounds:
          - calculations.survey_signal_loss_budget
          - entities.CameraPosition.fields.signal_loss_db
          - entities.VenueSurvey.fields.total_signal_loss_db
          - validations[priority=41]
          - errors[ERR_SIGNAL_LOSS_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Mode (b) — nested rounding whose order changes the verdict: rounding each of the 150 ft,
          250 ft and 350 ft runs to 2 dp first (2.03 + 3.38 + 4.73) totals 10.14 and MUST reject the
          submit, whereas summing the raw products (10.125) and rounding once yields 10.13 and would
          wrongly admit it.
        test_recipe:
          setup:
            - "TIER_3 production with venue_power_capacity_amps = 400."
            - "One DRAFT venue survey carrying exactly three camera positions with cable runs of 150, 250 and 350 feet and 20 A draw each (total 60 A, so power headroom is not the binding constraint)."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_id: $.data.id }
            - call: "POST /broadcast-ops/venue-surveys"
              payload: { production_id: "${prod_id}", surveyor_name: "R. Ito", fiber_drops_required: 2 }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { survey_id: $.data.id }
            - call: "POST /broadcast-ops/venue-surveys/${survey_id}/camera-positions"
              payload: { label: "HIGH_HOME", position_type: "HARD", cable_run_feet: 150, power_draw_amps: 20 }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { pos1_id: $.data.id, pos1_loss: $.data.signal_loss_db }
            - call: "POST /broadcast-ops/venue-surveys/${survey_id}/camera-positions"
              payload: { label: "LOW_FIRST", position_type: "HANDHELD", cable_run_feet: 250, power_draw_amps: 20 }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { pos2_id: $.data.id }
            - call: "POST /broadcast-ops/venue-surveys/${survey_id}/camera-positions"
              payload: { label: "CENTER_FIELD", position_type: "ROBO", cable_run_feet: 350, power_draw_amps: 20 }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { pos3_id: $.data.id }
          trigger:
            - call: "POST /broadcast-ops/venue-surveys/${survey_id}/submit"
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with error_id == ERR_SIGNAL_LOSS_BUDGET_EXCEEDED"
            - "CameraPosition.${pos1_id}.signal_loss_db == 2.03"
            - "CameraPosition.${pos2_id}.signal_loss_db == 3.38"
            - "CameraPosition.${pos3_id}.signal_loss_db == 4.73"
            - "VenueSurvey.${survey_id}.total_signal_loss_db == 10.14"
            - "VenueSurvey.${survey_id}.status == DRAFT"
            - "VenueSurvey.${survey_id}.total_cable_run_feet == 750"
            - "VenueSurvey.${survey_id}.power_headroom_amps == 340"
            - "The sum-then-round order would produce 10.13, which is <= MAX_SIGNAL_LOSS_BUDGET_DB and would have returned 200."

      - name: settlement_overrun_bracket_keyed_on_labor_subtotal_not_total
        grounds:
          - calculations.production_settlement
          - entities.Production.fields.overrun_fee_cents
          - entities.Production.fields.settlement_total_cents
          - entities.Production.fields.labor_variance_cents
          - state_machines.Production.WRAPPED_to_SETTLED
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency pinned by evaluation order: settlement_total_cents
          = labor_subtotal + overrun_fee, but the overrun rate bracket is read off the labor subtotal
          (480000 -> 1200 cents/min -> fee 24000 -> total 504000). Reading the bracket off the total
          (504000 >= 500000 -> 1800 cents/min) would give 36000 and 516000.
        test_recipe:
          setup:
            - "A fully provisioned, rehearsed TIER_3 production that went ON_AIR at 2026-08-15T18:00:00Z and OFF_AIR at 2026-08-15T21:00:00Z."
            - "Two crew calls at 24000 cents/h, each worked 600 minutes and each released with a meal break 300 minutes into the call: provisional 254000 each, settled 240000 each."
            - "Incidents: one 8-minute WEATHER_HOLD and one 12-minute EXTENDED_PLAY (20 fee-bearing overrun minutes); no technical downtime."
            - "The production has been WRAPPED by operator pm-001."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_id: $.data.id }
            - call: "POST /broadcast-ops/trucks"
              payload: { truck_code: "TRK-01", tier_rating: "TIER_3", camera_channel_capacity: 4, power_draw_amps: 60, home_base_code: "SEA", engine_hours_since_service: 100, service_interval_hours: 500 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { truck_id: $.data.id }
            - call: "POST /broadcast-ops/venue-surveys"
              payload: { production_id: "${prod_id}", surveyor_name: "R. Ito", fiber_drops_required: 2 }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { survey_id: $.data.id }
            - call: "POST /broadcast-ops/venue-surveys/${survey_id}/camera-positions"
              payload: { label: "HIGH_HOME", position_type: "HARD", cable_run_feet: 150, power_draw_amps: 20 }
              as: TechnicalDirector
              as_user_id: "td-001"
            - call: "POST /broadcast-ops/venue-surveys/${survey_id}/camera-positions"
              payload: { label: "LOW_FIRST", position_type: "HANDHELD", cable_run_feet: 250, power_draw_amps: 20 }
              as: TechnicalDirector
              as_user_id: "td-001"
            - call: "POST /broadcast-ops/venue-surveys/${survey_id}/submit"
              as: TechnicalDirector
              as_user_id: "td-001"
            - call: "POST /broadcast-ops/venue-surveys/${survey_id}/review"
              payload: { decision: "APPROVE" }
              as: LeagueOperations
              as_user_id: "lo-001"
            - call: "GET /broadcast-ops/productions/${prod_id}"
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { pv1: $.data.version }
            - call: "POST /broadcast-ops/productions/${prod_id}/truck-assignment"
              payload: { truck_id: "${truck_id}", expected_production_version: "${pv1}" }
              as: ProductionManager
              as_user_id: "pm-001"
            - call: "POST /broadcast-ops/transmission-paths"
              payload: { path_code: "FIB-A", path_type: "FIBER", carrier_code: "CARR1", capacity_mbps: 300, redundancy_class: "PRIMARY_ELIGIBLE" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { path_a_id: $.data.id }
            - call: "GET /broadcast-ops/productions/${prod_id}"
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { pv2: $.data.version }
            - call: "POST /broadcast-ops/path-bookings"
              payload: { production_id: "${prod_id}", path_id: "${path_a_id}", booking_role: "PRIMARY", window_start_utc: "2026-08-15T16:00:00Z", window_end_utc: "2026-08-15T23:00:00Z", requested_mbps: 100, expected_production_version: "${pv2}" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { booking_id: $.data.id }
            - call: "POST /broadcast-ops/path-bookings/${booking_id}/schedule-test"
              payload: { test_window_start_utc: "2026-08-15T16:00:00Z", test_window_end_utc: "2026-08-15T17:00:00Z" }
              as: TechnicalDirector
              as_user_id: "td-001"
            - call: "POST /broadcast-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T16:30:00Z" }
              as: TechnicalDirector
              as_user_id: "td-001"
            - call: "POST /broadcast-ops/path-bookings/${booking_id}/test-result"
              payload: { outcome: "PASS" }
              as: TechnicalDirector
              as_user_id: "td-001"
            - call: "POST /broadcast-ops/data-feeds"
              payload: { provider_code: "STATSCO", feed_kind: "LIVE_STATS", latency_ms: 120, contract_expiry_utc: "2026-12-31T00:00:00Z", max_concurrent_consumers: 2 }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { feed_id: $.data.id }
            - call: "POST /broadcast-ops/system-preps"
              payload: { production_id: "${prod_id}", data_feed_id: "${feed_id}", system_kind: "GRAPHICS" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { prep_id: $.data.id }
            - call: "POST /broadcast-ops/system-preps/${prep_id}/validate-feed"
