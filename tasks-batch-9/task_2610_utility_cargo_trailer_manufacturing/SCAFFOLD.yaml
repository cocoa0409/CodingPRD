scenario: |
  Generate task harder than expert level!

  2610. Utility & Cargo Trailer Manufacturing (trailer manufacturing plant): model configuration
  with axle capacity, frame design and gross vehicle weight rating certification, jig-based frame
  welding with dimensional control and weld inspection, axle, brake and lighting system
  installation with regulatory compliance for lighting and braking requirements, certification
  label and vehicle identification number assignment with title documentation for dealers, custom
  option installation such as ramps, cabinets and specialty flooring, dealer ordering, allocation
  and stocking programs with floor plan support, quality inspection and road test protocols,
  warranty administration with dealer labor rates and part shipment

domain_name: utility-cargo-trailer-manufacturing
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - derived_field_reconciliation
    - selector_policy

  entity_topology: flat
  # Every entity is addressed by its own top-level collection (`/trailer-units/{id}`,
  # `/dealer-orders/{id}`, `/warranty-claims/{id}`); parent context travels in FK body
  # fields, never in a nested URL chain. Sub-resource GETs exist only as reverse-lookup
  # read channels, never as the authoritative address of a resource.

  state_machine_shape: parallel
  # TrailerUnit carries TWO independent state dimensions on one row —
  # `build_status` (physical build progression) and `compliance_status` (FMVSS
  # lighting/braking verification) — which advance on different endpoints and are
  # re-coupled only at labeling. TrailerModel and WarrantyClaim are additionally
  # cyclic (revision / info-request loops); RoadTest result is a derived branch.

  relationship_patterns:
    - one_to_many          # TrailerModel -> TrailerUnit, Dealer -> DealerOrder, WarrantyClaim -> part lines
    - cross_aggregate      # DealerOrder.allocated_unit_id crosses the sales aggregate into the plant aggregate
    - polymorphic: false

  role_model: segregation_of_duties
  # The CertificationOfficer user who signs a TrailerModel's GVWR certification is barred
  # from issuing the VIN/certification label of any unit built to that model.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: TrailerModel
    parent: null
    common_fields: true
    fields:
      - name: model_code
        type: string
        source: input
        description: "Plant model designation, unique across all models"
        constraints: "4-16 chars, uppercase A-Z0-9 and '-' only; unique (case-sensitive)"
      - name: description
        type: string
        source: input
        description: "Marketing description of the configuration"
      - name: axle_count
        type: integer
        source: input
        description: "Number of axles under the frame"
        constraints: "1 <= axle_count <= 3"
      - name: axle_rating_lbs
        type: integer
        source: input
        description: "Manufacturer rating of ONE axle assembly in pounds"
        constraints: "> 0"
      - name: design_braked_axle_count
        type: integer
        source: input
        description: "Number of axles the design specifies as braked; feeds the GVWR brake derate"
        constraints: "0 <= design_braked_axle_count <= axle_count"
      - name: tire_load_rating_lbs
        type: integer
        source: input
        description: "Load rating of ONE tire in pounds; two tires are mounted per axle"
        constraints: "> 0"
      - name: frame_design_code
        type: string
        source: input
        description: "Frame family code; a WeldJig only accepts units whose model carries the same code"
        constraints: "exactly 2 chars, uppercase A-Z"
      - name: frame_design_rated_lbs
        type: integer
        source: input
        description: "Structural rating of the frame design in pounds"
        constraints: "> 0"
      - name: coupler_rating_lbs
        type: integer
        source: input
        description: "Rating of the coupler / tongue assembly in pounds"
        constraints: "> 0"
      - name: overall_width_in
        type: number
        source: input
        description: "Overall trailer width in inches; >= 80.0 pulls in wide-load lamp requirements"
        constraints: "> 0, one decimal place"
      - name: nominal_length_mm
        type: integer
        source: input
        description: "Engineering nominal frame length in millimetres, compared against FrameInspection measurements"
        constraints: "> 0"
      - name: nominal_width_mm
        type: integer
        source: input
        description: "Engineering nominal frame width in millimetres, compared against FrameInspection measurements"
        constraints: "> 0"
      - name: base_curb_weight_lbs
        type: integer
        source: input
        description: "Curb weight of the base configuration with no options installed"
        constraints: "> 0"
      - name: base_dealer_price_cents
        type: integer
        source: input
        description: "Dealer net price of the base configuration in cents"
        constraints: "> 0"
      - name: provisional_gvwr_lbs
        type: integer
        source: computed
        description: "Engineering-estimate GVWR written by the certification-submission transition (calculations.gvwr_rating variant provisional_engineering_estimate)"
        default: null
      - name: certified_gvwr_lbs
        type: integer
        source: computed
        description: "Certified GVWR written by the CERTIFIED decision (calculations.gvwr_rating variant certified_final); retained verbatim while the model cycles back through review"
        default: null
      - name: certification_status
        type: enum
        source: system
        description: "GVWR certification lifecycle state"
        default: DRAFT
        constraints: "one of {DRAFT, IN_ENGINEERING_REVIEW, CERTIFIED, WITHDRAWN}"
      - name: revision_round
        type: integer
        source: system
        description: "Count of REVISION_REQUESTED decisions taken on this model"
        default: 0
      - name: certified_by_user_id
        type: string
        source: system
        description: "X-User-ID of the CertificationOfficer who issued the most recent CERTIFIED decision; barred from issuing labels for this model's units (segregation of duties)"
        default: null
      - name: certified_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent CERTIFIED decision"
        default: null
      - name: active_unit_count
        type: integer
        source: computed
        description: "Count of TrailerUnit rows with this model_id whose build_status NOT IN {SHIPPED, SCRAPPED}; recomputed on every unit build_status change"
        default: 0

  - name: Dealer
    parent: null
    common_fields: true
    fields:
      - name: dealer_code
        type: string
        source: input
        description: "Dealer account code, unique across all dealers"
        constraints: "4-16 chars, uppercase A-Z0-9 and '-'; unique"
      - name: name
        type: string
        source: input
        description: "Legal dealership name"
      - name: labor_rate_cents_per_hour
        type: integer
        source: input
        description: "Warranty labor reimbursement rate in cents per hour for this dealer"
        constraints: "> 0"
      - name: floor_plan_limit_cents
        type: integer
        source: input
        description: "Floor-plan credit line ceiling in cents"
        default: 0
        constraints: ">= 0"
      - name: floor_plan_outstanding_cents
        type: integer
        source: computed
        description: "Conserved quantity: equals SUM(DealerOrder.floor_plan_draw_cents) over orders with this dealer_id and floor_plan_status == DRAWN"
        default: 0
      - name: floor_plan_available_cents
        type: integer
        source: computed
        description: "floor_plan_limit_cents - floor_plan_outstanding_cents; may be negative after a LIMIT_DECREASE"
        default: 0
      - name: allocation_quota_per_month
        type: integer
        source: input
        description: "Maximum DealerOrder allocations this dealer may receive within one logical-clock calendar month (UTC)"
        constraints: ">= 0"
      - name: allocations_current_month_count
        type: integer
        source: computed
        description: "Count of DealerOrder rows with this dealer_id whose allocated_at falls in the logical clock's current UTC calendar month AND whose status IN {ALLOCATED, DELIVERED}"
        default: 0
      - name: allocations_ytd_count
        type: integer
        source: computed
        description: "Count of DealerOrder rows with this dealer_id whose allocated_at falls in the logical clock's current UTC calendar year AND whose status IN {ALLOCATED, DELIVERED}; drives the volume-discount tier"
        default: 0
      - name: warranty_receivable_cents
        type: integer
        source: computed
        description: "Conserved quantity: equals SUM(WarrantyClaim.reimbursement_total_cents) over claims with this dealer_id and status == CLOSED"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Credit standing; CREDIT_HOLD blocks any further allocation"
        default: ACTIVE
        constraints: "one of {ACTIVE, CREDIT_HOLD}"

  - name: WeldJig
    parent: null
    common_fields: true
    fields:
      - name: jig_code
        type: string
        source: input
        description: "Jig identifier on the weld floor, unique across all jigs"
        constraints: "4-16 chars, uppercase A-Z0-9 and '-'; unique"
      - name: frame_design_code
        type: string
        source: input
        description: "Frame family this jig is tooled for; must equal the model's frame_design_code to reserve"
        constraints: "exactly 2 chars, uppercase A-Z"
      - name: changeover_buffer_min
        type: integer
        source: input
        description: "Minutes of tear-down/set-up that follow every reservation; folded into the occupancy interval"
        default: 45
        constraints: ">= 0"
      - name: reserved_minutes_total
        type: integer
        source: computed
        description: "Conserved quantity: equals SUM(JigReservation.duration_minutes) over reservations with this jig_id and status IN {RESERVED, CONSUMED}"
        default: 0

  - name: TestLane
    parent: null
    common_fields: true
    fields:
      - name: lane_code
        type: string
        source: input
        description: "Road-test lane identifier, unique across all lanes"
        constraints: "4-16 chars, uppercase A-Z0-9 and '-'; unique"
      - name: max_concurrent_tests
        type: integer
        source: input
        description: "How many SCHEDULED road tests may occupy overlapping windows on this lane"
        default: 2
        constraints: ">= 1"
      - name: surface_type
        type: enum
        source: input
        description: "Lane surface"
        constraints: "one of {ASPHALT, GRAVEL, WASHBOARD}"

  - name: TrailerUnit
    parent: null
    common_fields: true
    fields:
      - name: serial_number
        type: string
        source: input
        description: "Plant serial stamped on the frame rail, unique across all units; also the final tie-break key of the allocation selector"
        constraints: "6-20 chars, uppercase A-Z0-9 and '-'; unique"
      - name: model_id
        type: string
        source: input
        description: "FK -> TrailerModel.id; the configuration this unit is built to"
      - name: dealer_order_id
        type: string
        source: system
        description: "FK -> DealerOrder.id; set when the unit is allocated, cleared to null when the order is cancelled"
        default: null
      - name: planned_start_date
        type: datetime
        source: input
        description: "Planned weld-floor start date; advisory only"
        default: null
      - name: model_version_pinned
        type: integer
        source: system
        description: "TrailerModel.version observed at the moment the jig reservation pinned this unit; never re-read afterwards"
        default: null
      - name: gvwr_lbs
        type: integer
        source: system
        description: "Snapshot of TrailerModel.certified_gvwr_lbs taken at jig-reservation time; the unit's own rating for all downstream weight and brake rules"
        default: null
      - name: curb_weight_lbs
        type: integer
        source: computed
        description: "model.base_curb_weight_lbs + SUM(OptionInstall.total_weight_lbs) over installs with status IN {PENDING, COMPLETED}"
        default: null
      - name: payload_capacity_lbs
        type: integer
        source: computed
        description: "gvwr_lbs - curb_weight_lbs; the invariant curb_weight_lbs + payload_capacity_lbs == gvwr_lbs holds after every mutation"
        default: null
      - name: build_status
        type: enum
        source: system
        description: "Physical build dimension; advances on weld/assembly/test/label/sales endpoints"
        default: PLANNED
        constraints: "one of {PLANNED, BUILD_HOLD, JIG_RESERVED, FRAME_REWORK, FRAME_WELDED, SYSTEMS_INSTALLED, ROAD_TEST_PENDING, SYSTEMS_REWORK, ROAD_TEST_PASSED, LABELED, RELEASED_TO_STOCK, ALLOCATED, SHIPPED, SCRAPPED}"
      - name: compliance_status
        type: enum
        source: system
        description: "Regulatory verification dimension; advances independently of build_status on POST /trailer-units/{id}/systems-install"
        default: NOT_VERIFIED
        constraints: "one of {NOT_VERIFIED, LIGHTING_VERIFIED, FULLY_COMPLIANT, NON_COMPLIANT}"
      - name: installed_braked_axle_count
        type: integer
        source: system
        description: "Braked axles actually installed, recorded by the BRAKE_AND_AXLE stage"
        default: null
      - name: breakaway_kit_installed
        type: boolean
        source: system
        description: "Whether a breakaway kit was recorded by the BRAKE_AND_AXLE stage"
        default: false
      - name: clearance_lamp_count
        type: integer
        source: system
        description: "Clearance lamps recorded by the LIGHTING stage"
        default: null
      - name: frame_fail_count
        type: integer
        source: computed
        description: "Count of FrameInspection rows for this unit with result == FAIL; at 3 the unit is scrapped"
        default: 0
      - name: rework_cycle_count
        type: integer
        source: computed
        description: "Count of road tests for this unit that resulted FAILED"
        default: 0
      - name: released_to_stock_at
        type: datetime
        source: system
        description: "Logical-clock instant the unit entered RELEASED_TO_STOCK; primary ranking key of the allocation selector"
        default: null
      - name: warranty_start_date
        type: datetime
        source: system
        description: "Logical-clock instant of DealerOrder delivery; warranty expiry is this instant + 730 days"
        default: null
      - name: vin
        type: string
        source: computed
        description: "VIN of the unit's CertificationLabel with status == ISSUED, else null"
        default: null

  - name: JigReservation
    parent: null
    common_fields: true
    fields:
      - name: jig_id
        type: string
        source: input
        description: "FK -> WeldJig.id; supplied in the path"
      - name: unit_id
        type: string
        source: input
        description: "FK -> TrailerUnit.id; the unit that occupies the jig"
      - name: window_start_at
        type: datetime
        source: input
        description: "Start of the weld window (inclusive)"
      - name: window_end_at
        type: datetime
        source: input
        description: "End of the weld window (exclusive); must be strictly after window_start_at"
      - name: duration_minutes
        type: integer
        source: computed
        description: "Whole minutes between window_start_at and window_end_at, excluding the changeover buffer"
      - name: occupancy_end_at
        type: datetime
        source: computed
        description: "window_end_at + WeldJig.changeover_buffer_min minutes; the exclusive end of the interval used for conflict detection"
      - name: status
        type: enum
        source: system
        description: "RESERVED on create, CONSUMED when a PASS frame inspection lands, RELEASED when the unit is held or scrapped"
        default: RESERVED
        constraints: "one of {RESERVED, CONSUMED, RELEASED}"

  - name: FrameInspection
    parent: null
    common_fields: false
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> TrailerUnit.id; supplied in the path"
      - name: inspection_seq
        type: integer
        source: computed
        description: "1-based ordinal of this inspection within the unit, ordered by created_at ASC"
      - name: measured_length_mm
        type: integer
        source: input
        description: "Measured frame length in millimetres"
      - name: measured_width_mm
        type: integer
        source: input
        description: "Measured frame width in millimetres"
      - name: diagonal_a_mm
        type: integer
        source: input
        description: "First corner-to-corner diagonal in millimetres"
      - name: diagonal_b_mm
        type: integer
        source: input
        description: "Second corner-to-corner diagonal in millimetres"
      - name: critical_weld_defect_count
        type: integer
        source: input
        description: "Defects found on safety-critical welds (coupler, axle hanger, A-frame)"
        constraints: ">= 0"
      - name: non_critical_weld_defect_count
        type: integer
        source: input
        description: "Defects found on non-critical welds"
        constraints: ">= 0"
      - name: length_deviation_mm
        type: number
        source: computed
        description: "abs(measured_length_mm - model.nominal_length_mm)"
      - name: width_deviation_mm
        type: number
        source: computed
        description: "abs(measured_width_mm - model.nominal_width_mm)"
      - name: max_deviation_mm
        type: number
        source: computed
        description: "max(length_deviation_mm, width_deviation_mm)"
      - name: squareness_delta_mm
        type: number
        source: computed
        description: "abs(diagonal_a_mm - diagonal_b_mm)"
      - name: result
        type: enum
        source: computed
        description: "PASS only when every dimensional and weld criterion in calculations.frame_dimensional_verdict holds"
        constraints: "one of {PASS, FAIL}"
      - name: failure_reasons
        type: array
        source: computed
        description: "Sorted array of the criterion codes that failed; empty array when result == PASS"
        constraints: "subset of [CRITICAL_WELD_DEFECT, MAX_DEVIATION, NON_CRITICAL_WELD_DEFECT, SQUARENESS], ascending alphabetical"
      - name: inspector_user_id
        type: string
        source: system
        description: "X-User-ID of the WeldSupervisor who recorded the inspection"

  - name: OptionInstall
    parent: null
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> TrailerUnit.id; supplied in the path"
      - name: option_code
        type: enum
        source: input
        description: "Custom option being installed"
        constraints: "one of {REAR_RAMP_GATE, SIDE_CABINET_PKG, SPECIALTY_FLOORING, SPARE_TIRE_CARRIER, E_TRACK_KIT}"
      - name: quantity
        type: integer
        source: input
        description: "Units of the option installed"
        constraints: ">= 1"
      - name: unit_weight_lbs
        type: integer
        source: input
        description: "Installed weight of one unit of the option in pounds"
        constraints: ">= 0"
      - name: unit_price_cents
        type: integer
        source: input
        description: "Dealer net price of one unit of the option in cents"
        constraints: ">= 0"
      - name: labor_hours
        type: number
        source: input
        description: "Installation labor in hours, one decimal place"
        constraints: ">= 0"
      - name: total_weight_lbs
        type: integer
        source: computed
        description: "quantity * unit_weight_lbs"
      - name: total_price_cents
        type: integer
        source: computed
        description: "quantity * unit_price_cents"
      - name: status
        type: enum
        source: system
        description: "PENDING on create, COMPLETED when signed off, REMOVED on soft delete (weight and price reversed)"
        default: PENDING
        constraints: "one of {PENDING, COMPLETED, REMOVED}"

  - name: RoadTest
    parent: null
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> TrailerUnit.id; supplied in the path"
      - name: lane_id
        type: string
        source: input
        description: "FK -> TestLane.id; the lane the window is booked on"
      - name: window_start_at
        type: datetime
        source: input
        description: "Start of the booked lane window (inclusive)"
      - name: window_end_at
        type: datetime
        source: input
        description: "End of the booked lane window (inclusive); must be strictly after window_start_at"
      - name: protocol_code
        type: enum
        source: input
        description: "Road-test protocol"
        constraints: "one of {STANDARD_20MI, LOADED_50MI, BRAKE_FADE}"
      - name: brake_stop_distance_ft
        type: number
        source: system
        description: "Measured stopping distance recorded at result time, one decimal place"
        default: null
      - name: lighting_check_passed
        type: boolean
        source: system
        description: "Whether the lamp walk-around passed at result time"
        default: null
      - name: status
        type: enum
        source: system
        description: "SCHEDULED on create; PASSED or FAILED derived from the recorded measurements"
        default: SCHEDULED
        constraints: "one of {SCHEDULED, PASSED, FAILED}"
      - name: result_notes
        type: string
        source: system
        description: "Free-text note captured with the result"
        default: null
      - name: inspector_user_id
        type: string
        source: system
        description: "X-User-ID of the QualityInspector who recorded the result"
        default: null

  - name: CertificationLabel
    parent: null
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> TrailerUnit.id; supplied in the path"
      - name: vin
        type: string
        source: computed
        description: "17-character VIN minted by calculations.vin_assignment; unique across all labels including voided ones"
      - name: vin_sequence
        type: integer
        source: computed
        description: "Plant-wide monotonic sequence consumed by this label; never reused, not even after a void"
      - name: gvwr_lbs
        type: integer
        source: computed
        description: "Snapshot of TrailerUnit.gvwr_lbs at issuance, stamped on the label"
      - name: gawr_per_axle_lbs
        type: integer
        source: computed
        description: "Snapshot of TrailerModel.axle_rating_lbs at issuance, stamped as the per-axle GAWR"
      - name: tire_size_code
        type: string
        source: input
        description: "Tire size printed on the certification label"
      - name: model_version_pinned
        type: integer
        source: computed
        description: "Copy of TrailerUnit.model_version_pinned at issuance; the model revision the label certifies"
      - name: mco_number
        type: string
        source: computed
        description: "Manufacturer's Certificate of Origin number handed to the dealer for titling; 'MCO-' + vin_sequence zero-padded to 6 digits"
      - name: issued_by_user_id
        type: string
        source: system
        description: "X-User-ID of the issuing CertificationOfficer; must differ from the model's certified_by_user_id"
      - name: issued_at
        type: datetime
        source: system
        description: "Logical-clock instant of issuance"
      - name: status
        type: enum
        source: system
        description: "ISSUED on creation; VOIDED when a later road test on the unit fails"
        default: ISSUED
        constraints: "one of {ISSUED, VOIDED}"
      - name: voided_reason
        type: string
        source: system
        description: "Reason code recorded when the label is voided"
        default: null
        constraints: "one of {ROAD_TEST_FAILED, null}"

  - name: DealerOrder
    parent: null
    common_fields: true
    fields:
      - name: dealer_id
        type: string
        source: input
        description: "FK -> Dealer.id; the ordering dealer"
      - name: model_id
        type: string
        source: input
        description: "FK -> TrailerModel.id; the configuration ordered"
      - name: po_ref
        type: string
        source: input
        description: "Dealer purchase-order reference"
        constraints: "4-24 chars"
      - name: stocking_program
        type: enum
        source: input
        description: "Which stocking program the order sits in; DEMO orders never draw floor plan"
        constraints: "one of {STOCK, SOLD_ORDER, DEMO}"
      - name: status
        type: enum
        source: system
        description: "Order lifecycle state"
        default: PENDING
        constraints: "one of {PENDING, ALLOCATED, DELIVERED, CANCELLED}"
      - name: allocated_unit_id
        type: string
        source: system
        description: "FK -> TrailerUnit.id; the unit chosen by the allocation selector, cleared to null on cancellation"
        default: null
      - name: invoice_subtotal_cents
        type: integer
        source: computed
        description: "Step 2 of calculations.order_invoice_and_draw: base_dealer_price_cents + options_total_cents"
        default: null
      - name: volume_discount_pct
        type: number
        source: computed
        description: "Step 3 tier rate selected from the dealer's allocations_ytd_count as observed BEFORE this allocation"
        default: null
      - name: volume_discount_cents
        type: integer
        source: computed
        description: "Step 4 rounded discount amount"
        default: null
      - name: freight_cents
        type: integer
        source: computed
        description: "Step 5 freight, waived to 0 when volume_discount_pct >= 0.05"
        default: null
      - name: invoice_total_cents
        type: integer
        source: computed
        description: "Step 6 invoice_subtotal_cents - volume_discount_cents + freight_cents"
        default: null
      - name: floor_plan_draw_cents
        type: integer
        source: computed
        description: "Step 7 draw against the dealer's floor plan; 0 for stocking_program == DEMO"
        default: 0
      - name: floor_plan_status
        type: enum
        source: system
        description: "NONE before allocation, DRAWN while the draw counts against the dealer, RELEASED on cancellation, REPAID on a PAYOFF adjustment"
        default: NONE
        constraints: "one of {NONE, DRAWN, RELEASED, REPAID}"
      - name: allocated_at
        type: datetime
        source: system
        description: "Logical-clock instant of allocation; drives the dealer's monthly and YTD allocation counters"
        default: null
      - name: delivered_at
        type: datetime
        source: system
        description: "Logical-clock instant of delivery"
        default: null
      - name: cancelled_at
        type: datetime
        source: system
        description: "Logical-clock instant of cancellation"
        default: null

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - name: claim_ref
        type: string
        source: input
        description: "Dealer claim reference, unique across all claims"
        constraints: "4-24 chars; unique"
      - name: unit_id
        type: string
        source: input
        description: "FK -> TrailerUnit.id; the failed unit, which must already be SHIPPED"
      - name: dealer_id
        type: string
        source: input
        description: "FK -> Dealer.id; must equal the dealer of the unit's DealerOrder"
      - name: complaint_code
        type: enum
        source: input
        description: "Failed system; selects the published flat-rate labor allowance"
        constraints: "one of {AXLE, BRAKE, LIGHTING, FRAME, FLOORING, COUPLER}"
      - name: labor_hours
        type: number
        source: input
        description: "Labor hours claimed by the dealer, one decimal place"
        constraints: ">= 0.1"
      - name: part_lines
        type: array
        source: input
        description: "Array of { part_number: string, quantity: integer >= 1, unit_cost_cents: integer >= 0 }; may be empty for a labor-only claim"
      - name: part_line_count
        type: integer
        source: computed
        description: "Length of part_lines as accepted on the most recent submission or resubmission"
      - name: failure_date
        type: datetime
        source: input
        description: "Instant the failure occurred; compared against the unit's warranty expiry"
      - name: status
        type: enum
        source: system
        description: "Claim lifecycle state"
        default: SUBMITTED
        constraints: "one of {SUBMITTED, INFO_REQUESTED, APPROVED, DENIED, PARTS_SHIPPED, CLOSED}"
      - name: info_request_round
        type: integer
        source: system
        description: "Count of REQUEST_INFO decisions taken on this claim; the third one denies the claim automatically"
        default: 0
      - name: coverage_variant
        type: enum
        source: computed
        description: "Which calculations.warranty_reimbursement variant was applied at approval"
        default: null
        constraints: "one of {IN_WARRANTY_FULL, GOODWILL_PRORATED, null}"
      - name: coverage_factor
        type: number
        source: computed
        description: "Multiplier applied to the gross reimbursement, from the variant's coverage table"
        default: null
      - name: labor_cents
        type: integer
        source: computed
        description: "round_half_up(labor_hours * Dealer.labor_rate_cents_per_hour) evaluated at approval"
        default: null
      - name: parts_subtotal_cents
        type: integer
        source: computed
        description: "Sum of the per-line marked-up part amounts, each line rounded before the sum"
        default: null
      - name: freight_cents
        type: integer
        source: computed
        description: "Part freight allowance; 0 when parts_subtotal_cents == 0 or >= 50000"
        default: null
      - name: reimbursement_total_cents
        type: integer
        source: computed
        description: "round_half_up((labor_cents + parts_subtotal_cents + freight_cents) * coverage_factor)"
        default: null
      - name: shipped_line_count
        type: integer
        source: computed
        description: "Cumulative part lines shipped across all part-shipment calls"
        default: 0
      - name: tracking_number
        type: string
        source: system
        description: "Carrier tracking number of the most recent part shipment"
        default: null
      - name: reviewed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the SalesAdmin who took the most recent review decision"
        default: null
      - name: denial_reason
        type: string
        source: system
        description: "Reason recorded on denial"
        default: null
        constraints: "one of {REVIEWER_DENIED, INFO_REQUEST_LIMIT_REACHED, null}"

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: TrailerModel
    state_field: certification_status
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DRAFT
        to: IN_ENGINEERING_REVIEW
        trigger: "POST /trailer-models/{id}/certification-submission"
        actor: PlantEngineer
        preconditions:
          - "certification_status == DRAFT"
        side_effects:
          - "provisional_gvwr_lbs = calculations.gvwr_rating variant provisional_engineering_estimate"
          - "increments TrailerModel.version by 1"
      - from: CERTIFIED
        to: IN_ENGINEERING_REVIEW
        trigger: "POST /trailer-models/{id}/certification-submission (engineering change on a certified model)"
        actor: PlantEngineer
        preconditions:
          - "certification_status == CERTIFIED"
        side_effects:
          - "provisional_gvwr_lbs = calculations.gvwr_rating variant provisional_engineering_estimate"
          - "certified_gvwr_lbs, certified_by_user_id and certified_at are retained unchanged (units already pinned keep their snapshot)"
          - "increments TrailerModel.version by 1"
        note: "This edge is what makes the model machine cyclic: CERTIFIED -> IN_ENGINEERING_REVIEW -> DRAFT -> IN_ENGINEERING_REVIEW -> CERTIFIED."
      - from: IN_ENGINEERING_REVIEW
        to: CERTIFIED
        trigger: "POST /trailer-models/{id}/certification-decision with decision == CERTIFIED"
        actor: CertificationOfficer
        preconditions:
          - "certification_status == IN_ENGINEERING_REVIEW"
        side_effects:
          - "certified_gvwr_lbs = calculations.gvwr_rating variant certified_final"
          - "certified_by_user_id = X-User-ID; certified_at = logical clock now"
          - "CASCADE hop 1: every TrailerUnit with this model_id and build_status == BUILD_HOLD moves BUILD_HOLD -> PLANNED"
          - "CASCADE hop 2: because those units left BUILD_HOLD, TrailerModel.active_unit_count is recomputed"
          - "increments TrailerModel.version by 1"
      - from: IN_ENGINEERING_REVIEW
        to: DRAFT
        trigger: "POST /trailer-models/{id}/certification-decision with decision == REVISION_REQUESTED"
        actor: CertificationOfficer
        preconditions:
          - "certification_status == IN_ENGINEERING_REVIEW"
        side_effects:
          - "revision_round += 1"
          - "CASCADE hop 1: every TrailerUnit with this model_id whose build_status IN {PLANNED, JIG_RESERVED, FRAME_REWORK} moves to BUILD_HOLD"
          - "CASCADE hop 2: because those units entered BUILD_HOLD, every JigReservation with unit_id in that set and status == RESERVED moves RESERVED -> RELEASED"
          - "CASCADE hop 3: because those reservations were released, each affected WeldJig.reserved_minutes_total is decremented by the released reservation's duration_minutes and the jig's version increments by 1"
          - "TrailerModel.active_unit_count recomputed (BUILD_HOLD units still count as active)"
          - "increments TrailerModel.version by 1"
      - from: IN_ENGINEERING_REVIEW
        to: WITHDRAWN
        trigger: "POST /trailer-models/{id}/certification-decision with decision == WITHDRAWN"
        actor: CertificationOfficer
        preconditions:
          - "certification_status == IN_ENGINEERING_REVIEW"
        side_effects:
          - "CASCADE hop 1: every TrailerUnit with this model_id whose build_status IN {PLANNED, BUILD_HOLD} moves to SCRAPPED"
          - "CASCADE hop 2: because those units were scrapped, every JigReservation with unit_id in that set and status == RESERVED moves RESERVED -> RELEASED"
          - "CASCADE hop 3: each affected WeldJig.reserved_minutes_total decremented accordingly; jig version increments by 1"
          - "TrailerModel.active_unit_count recomputed"
          - "increments TrailerModel.version by 1"
        note: "Units already past PLANNED/BUILD_HOLD (i.e. welded or later) are deliberately left alone — withdrawal stops future builds, it does not destroy work in process."

  - entity: TrailerUnit
    state_field: build_status
    initial_state: PLANNED
    terminal_states: [SHIPPED, SCRAPPED]
    transitions:
      - from: PLANNED
        to: JIG_RESERVED
        trigger: "POST /weld-jigs/{id}/jig-reservations"
        actor: WeldSupervisor
        preconditions:
          - "unit.build_status == PLANNED"
          - "TrailerModel(unit.model_id).certification_status == CERTIFIED  # cross-entity guard"
          - "WeldJig.frame_design_code == TrailerModel(unit.model_id).frame_design_code"
          - "no jig-window conflict per validations[priority=80]"
        side_effects:
          - "JigReservation created with status RESERVED and computed duration_minutes / occupancy_end_at"
          - "unit.model_version_pinned = TrailerModel.version; unit.gvwr_lbs = TrailerModel.certified_gvwr_lbs"
          - "unit.curb_weight_lbs = TrailerModel.base_curb_weight_lbs; unit.payload_capacity_lbs = unit.gvwr_lbs - unit.curb_weight_lbs"
          - "WeldJig.reserved_minutes_total += duration_minutes; increments WeldJig.version by 1"
      - from: BUILD_HOLD
        to: PLANNED
        trigger: "system: TrailerModel IN_ENGINEERING_REVIEW -> CERTIFIED cascade"
        actor: system
        preconditions:
          - "unit.build_status == BUILD_HOLD"
        side_effects:
          - "TrailerModel.active_unit_count recomputed"
      - from: PLANNED
        to: BUILD_HOLD
        trigger: "system: TrailerModel IN_ENGINEERING_REVIEW -> DRAFT cascade"
        actor: system
        preconditions:
          - "unit.build_status IN {PLANNED, JIG_RESERVED, FRAME_REWORK}"
        side_effects:
          - "any RESERVED JigReservation of this unit moves to RELEASED (see the model cascade)"
      - from: JIG_RESERVED
        to: BUILD_HOLD
        trigger: "system: TrailerModel IN_ENGINEERING_REVIEW -> DRAFT cascade"
        actor: system
        preconditions:
          - "unit.build_status == JIG_RESERVED"
        side_effects:
          - "the unit's RESERVED JigReservation moves to RELEASED and the jig's reserved_minutes_total is decremented"
      - from: PLANNED
        to: SCRAPPED
        trigger: "system: TrailerModel IN_ENGINEERING_REVIEW -> WITHDRAWN cascade"
        actor: system
        preconditions:
          - "unit.build_status IN {PLANNED, BUILD_HOLD}"
        side_effects:
          - "any RESERVED JigReservation of this unit moves to RELEASED"
          - "TrailerModel.active_unit_count recomputed"
      - from: BUILD_HOLD
        to: SCRAPPED
        trigger: "system: TrailerModel IN_ENGINEERING_REVIEW -> WITHDRAWN cascade"
        actor: system
        preconditions:
          - "unit.build_status == BUILD_HOLD"
        side_effects:
          - "any RESERVED JigReservation of this unit moves to RELEASED"
          - "TrailerModel.active_unit_count recomputed"
      - from: JIG_RESERVED
        to: FRAME_WELDED
        trigger: "POST /trailer-units/{id}/frame-inspections whose computed result == PASS"
        actor: WeldSupervisor
        preconditions:
          - "unit.build_status IN {JIG_RESERVED, FRAME_REWORK}"
        side_effects:
          - "FrameInspection appended with result PASS and empty failure_reasons"
          - "the unit's RESERVED JigReservation moves RESERVED -> CONSUMED (reserved_minutes_total unchanged; CONSUMED still occupies the jig window)"
      - from: JIG_RESERVED
        to: FRAME_REWORK
        trigger: "POST /trailer-units/{id}/frame-inspections whose computed result == FAIL and unit.frame_fail_count after append < 3"
        actor: WeldSupervisor
        preconditions:
          - "unit.build_status IN {JIG_RESERVED, FRAME_REWORK}"
        side_effects:
          - "FrameInspection appended with result FAIL and a non-empty failure_reasons array"
          - "unit.frame_fail_count recomputed"
      - from: FRAME_REWORK
        to: FRAME_WELDED
        trigger: "POST /trailer-units/{id}/frame-inspections whose computed result == PASS"
        actor: WeldSupervisor
        preconditions:
          - "unit.build_status == FRAME_REWORK"
        side_effects:
          - "the unit's RESERVED JigReservation moves RESERVED -> CONSUMED"
        note: "FRAME_REWORK <-> JIG_RESERVED/FRAME_WELDED is the weld-floor revision loop."
      - from: FRAME_REWORK
        to: SCRAPPED
        trigger: "POST /trailer-units/{id}/frame-inspections whose computed result == FAIL and unit.frame_fail_count after append == 3"
        actor: WeldSupervisor
        preconditions:
          - "unit.build_status IN {JIG_RESERVED, FRAME_REWORK}"
          - "frame_fail_count after appending this inspection == FRAME_SCRAP_THRESHOLD (3)"
        side_effects:
          - "CASCADE hop 1: unit.build_status = SCRAPPED"
          - "CASCADE hop 2: because the unit was scrapped, its JigReservation with status IN {RESERVED, CONSUMED} moves to RELEASED"
          - "CASCADE hop 3: because that reservation was released, WeldJig.reserved_minutes_total -= duration_minutes and the jig's version increments by 1"
          - "TrailerModel.active_unit_count recomputed"
      - from: FRAME_WELDED
        to: SYSTEMS_INSTALLED
        trigger: "POST /trailer-units/{id}/systems-install with stage == BRAKE_AND_AXLE"
        actor: AssemblyTech
        preconditions:
          - "unit.build_status IN {FRAME_WELDED, SYSTEMS_REWORK}"
          - "unit.compliance_status == LIGHTING_VERIFIED  # the parallel dimension must already be at the lighting gate"
          - "brake requirements of validations[priority=63] satisfied"
        side_effects:
          - "unit.installed_braked_axle_count and unit.breakaway_kit_installed recorded"
          - "unit.compliance_status LIGHTING_VERIFIED -> FULLY_COMPLIANT (parallel dimension advances on the same call)"
      - from: SYSTEMS_REWORK
        to: SYSTEMS_INSTALLED
        trigger: "POST /trailer-units/{id}/systems-install with stage == BRAKE_AND_AXLE"
        actor: AssemblyTech
        preconditions:
          - "unit.build_status == SYSTEMS_REWORK"
          - "unit.compliance_status == LIGHTING_VERIFIED"
        side_effects:
          - "unit.installed_braked_axle_count and unit.breakaway_kit_installed re-recorded"
          - "unit.compliance_status LIGHTING_VERIFIED -> FULLY_COMPLIANT"
      - from: SYSTEMS_INSTALLED
        to: ROAD_TEST_PENDING
        trigger: "POST /trailer-units/{id}/road-tests"
        actor: QualityInspector
        preconditions:
          - "unit.build_status IN {SYSTEMS_INSTALLED, SYSTEMS_REWORK, ROAD_TEST_PASSED, LABELED, RELEASED_TO_STOCK, ALLOCATED}"
          - "unit.compliance_status == FULLY_COMPLIANT"
          - "lane capacity of validations[priority=81] satisfied"
        side_effects:
          - "RoadTest created with status SCHEDULED"
      - from: ROAD_TEST_PENDING
        to: ROAD_TEST_PASSED
        trigger: "POST /road-tests/{id}/result whose derived status == PASSED"
        actor: QualityInspector
        preconditions:
          - "road_test.status == SCHEDULED"
          - "unit.build_status == ROAD_TEST_PENDING"
        side_effects:
          - "RoadTest.status = PASSED; inspector_user_id recorded"
      - from: ROAD_TEST_PENDING
        to: SYSTEMS_REWORK
        trigger: "POST /road-tests/{id}/result whose derived status == FAILED"
        actor: QualityInspector
        preconditions:
          - "road_test.status == SCHEDULED"
          - "unit.build_status == ROAD_TEST_PENDING"
        side_effects:
          - "RoadTest.status = FAILED; unit.rework_cycle_count recomputed"
          - "unit.compliance_status FULLY_COMPLIANT -> NON_COMPLIANT (parallel dimension)"
          - "CASCADE hop 1: because the unit left the tested state, its CertificationLabel with status == ISSUED (if any) moves ISSUED -> VOIDED with voided_reason ROAD_TEST_FAILED and unit.vin becomes null"
          - "CASCADE hop 2: because the label was voided, if the unit had a DealerOrder in status ALLOCATED that order moves ALLOCATED -> PENDING, order.allocated_unit_id and unit.dealer_order_id are cleared, order.floor_plan_status DRAWN -> RELEASED"
          - "CASCADE hop 3: because the draw was released, Dealer.floor_plan_outstanding_cents is decremented by that order's floor_plan_draw_cents, floor_plan_available_cents is recomputed, and the dealer's version increments by 1"
      - from: ROAD_TEST_PASSED
        to: LABELED
        trigger: "POST /trailer-units/{id}/certification-label"
        actor: CertificationOfficer
        preconditions:
          - "unit.build_status == ROAD_TEST_PASSED"
          - "unit.compliance_status == FULLY_COMPLIANT"
          - "no CertificationLabel for this unit with status == ISSUED"
          - "X-User-ID != TrailerModel(unit.model_id).certified_by_user_id"
        side_effects:
          - "CertificationLabel created with status ISSUED, a freshly consumed vin_sequence, computed vin and mco_number, and snapshots of gvwr / gawr / model_version_pinned"
          - "unit.vin = label.vin"
      - from: LABELED
        to: RELEASED_TO_STOCK
        trigger: "system: auto-transition evaluated immediately after label issuance and after every OptionInstall completion"
        actor: system
        preconditions:
          - "unit.build_status == LABELED"
          - "count of OptionInstall rows for this unit with status == PENDING is exactly 0"
        side_effects:
          - "unit.released_to_stock_at = logical clock now; the unit becomes visible to the allocation selector"
      - from: RELEASED_TO_STOCK
        to: ALLOCATED
        trigger: "POST /dealer-orders/{id}/allocation"
        actor: SalesAdmin
        preconditions:
          - "unit.build_status == RELEASED_TO_STOCK"
          - "unit.dealer_order_id == null"
          - "the unit's CertificationLabel has status == ISSUED"
        side_effects:
          - "unit.dealer_order_id = order.id; order.allocated_unit_id = unit.id"
          - "order invoice fields and floor_plan_draw_cents computed; Dealer.floor_plan_outstanding_cents increased"
      - from: ALLOCATED
        to: RELEASED_TO_STOCK
        trigger: "POST /dealer-orders/{id}/cancellation (compensating action)"
        actor: SalesAdmin, Dealer
        preconditions:
          - "order.status == ALLOCATED"
        side_effects:
          - "unit.dealer_order_id = null; unit.released_to_stock_at is NOT rewritten (the unit keeps its original stock age)"
          - "order.floor_plan_status DRAWN -> RELEASED and the dealer's outstanding balance is restored"
      - from: ALLOCATED
        to: SHIPPED
        trigger: "POST /dealer-orders/{id}/delivery"
        actor: SalesAdmin
        preconditions:
          - "order.status == ALLOCATED"
          - "unit.build_status == ALLOCATED"
        side_effects:
          - "unit.warranty_start_date = logical clock now; warranty expiry is that instant + 730 days"
          - "TrailerModel.active_unit_count recomputed (SHIPPED units drop out)"

  - entity: TrailerUnit
    state_field: compliance_status
    initial_state: NOT_VERIFIED
    terminal_states: []
    transitions:
      - from: NOT_VERIFIED
        to: LIGHTING_VERIFIED
        trigger: "POST /trailer-units/{id}/systems-install with stage == LIGHTING"
        actor: AssemblyTech
        preconditions:
          - "unit.build_status IN {FRAME_WELDED, SYSTEMS_REWORK}"
          - "unit.compliance_status IN {NOT_VERIFIED, NON_COMPLIANT}"
          - "lamp requirements of validations[priority=62] satisfied"
        side_effects:
          - "unit.clearance_lamp_count recorded"
          - "unit.build_status is deliberately NOT changed by this call — the two dimensions move independently"
      - from: NON_COMPLIANT
        to: LIGHTING_VERIFIED
        trigger: "POST /trailer-units/{id}/systems-install with stage == LIGHTING (re-verification after a failed road test)"
        actor: AssemblyTech
        preconditions:
          - "unit.build_status IN {FRAME_WELDED, SYSTEMS_REWORK}"
          - "unit.compliance_status == NON_COMPLIANT"
        side_effects:
          - "unit.clearance_lamp_count re-recorded"
      - from: LIGHTING_VERIFIED
        to: FULLY_COMPLIANT
        trigger: "POST /trailer-units/{id}/systems-install with stage == BRAKE_AND_AXLE"
        actor: AssemblyTech
        preconditions:
          - "unit.compliance_status == LIGHTING_VERIFIED"
          - "brake requirements of validations[priority=63] satisfied"
        side_effects:
          - "unit.build_status moves to SYSTEMS_INSTALLED on the same call (the dimensions re-couple here)"
      - from: FULLY_COMPLIANT
        to: NON_COMPLIANT
        trigger: "POST /road-tests/{id}/result whose derived status == FAILED"
        actor: QualityInspector
        preconditions:
          - "unit.compliance_status == FULLY_COMPLIANT"
        side_effects:
          - "see the build_status ROAD_TEST_PENDING -> SYSTEMS_REWORK cascade"

  - entity: RoadTest
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /road-tests/{id}/result with brake_stop_distance_ft <= 40.0 AND lighting_check_passed == true"
        actor: QualityInspector
        preconditions:
          - "road_test.status == SCHEDULED"
        side_effects:
          - "unit.build_status ROAD_TEST_PENDING -> ROAD_TEST_PASSED"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /road-tests/{id}/result with brake_stop_distance_ft > 40.0 OR lighting_check_passed == false"
        actor: QualityInspector
        preconditions:
          - "road_test.status == SCHEDULED"
        side_effects:
          - "unit.build_status ROAD_TEST_PENDING -> SYSTEMS_REWORK plus the label/order/floor-plan cascade"
        note: "The branch is derived from the measurements, not requested by the caller; the two branches have disjoint side-effect sets."

  - entity: DealerOrder
    state_field: status
    initial_state: PENDING
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: PENDING
        to: ALLOCATED
        trigger: "POST /dealer-orders/{id}/allocation"
        actor: SalesAdmin
        preconditions:
          - "order.status == PENDING"
          - "expected_dealer_version == Dealer.version (concurrency_rules.order-allocation-stale-dealer)"
          - "Dealer.status == ACTIVE"
          - "a unit is selectable per calculations.allocation_unit_selector (else ERR_NO_ALLOCATABLE_UNIT)"
          - "Dealer.allocations_current_month_count + 1 <= Dealer.allocation_quota_per_month"
          - "for stocking_program != DEMO: Dealer.floor_plan_outstanding_cents + floor_plan_draw_cents <= Dealer.floor_plan_limit_cents"
        side_effects:
          - "order.allocated_unit_id set; order.allocated_at = logical clock now"
          - "invoice_subtotal_cents, volume_discount_pct, volume_discount_cents, freight_cents, invoice_total_cents, floor_plan_draw_cents computed per calculations.order_invoice_and_draw"
          - "for stocking_program != DEMO: order.floor_plan_status NONE -> DRAWN and Dealer.floor_plan_outstanding_cents += floor_plan_draw_cents"
          - "selected unit.build_status RELEASED_TO_STOCK -> ALLOCATED and unit.dealer_order_id = order.id"
          - "Dealer.allocations_current_month_count / allocations_ytd_count / floor_plan_available_cents recomputed; increments Dealer.version by 1"
      - from: ALLOCATED
        to: DELIVERED
        trigger: "POST /dealer-orders/{id}/delivery"
        actor: SalesAdmin
        preconditions:
          - "order.status == ALLOCATED"
        side_effects:
          - "order.delivered_at = logical clock now"
          - "allocated unit.build_status ALLOCATED -> SHIPPED and unit.warranty_start_date = logical clock now"
          - "order.floor_plan_status stays DRAWN — delivery does not repay the floor plan"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /dealer-orders/{id}/cancellation"
        actor: SalesAdmin, Dealer
        preconditions:
          - "order.status == PENDING"
        side_effects:
          - "order.cancelled_at = logical clock now; no floor-plan or unit effects (nothing was drawn)"
      - from: ALLOCATED
        to: CANCELLED
        trigger: "POST /dealer-orders/{id}/cancellation (compensating action)"
        actor: SalesAdmin, Dealer
        preconditions:
          - "order.status == ALLOCATED"
        side_effects:
          - "CASCADE hop 1: order.status = CANCELLED, cancelled_at = logical clock now, order.allocated_unit_id cleared"
          - "CASCADE hop 2: because the order released the unit, unit.build_status ALLOCATED -> RELEASED_TO_STOCK and unit.dealer_order_id = null"
          - "CASCADE hop 3: order.floor_plan_status DRAWN -> RELEASED, Dealer.floor_plan_outstanding_cents -= order.floor_plan_draw_cents, floor_plan_available_cents recomputed, Dealer.version += 1"
          - "Dealer.allocations_current_month_count and allocations_ytd_count recomputed (CANCELLED orders drop out of both counters)"
        note: "order.floor_plan_draw_cents and the invoice fields are retained for audit; only floor_plan_status changes, which is what removes them from the conserved sum."

  - entity: WarrantyClaim
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [DENIED, CLOSED]
    transitions:
      - from: SUBMITTED
        to: INFO_REQUESTED
        trigger: "POST /warranty-claims/{id}/review with decision == REQUEST_INFO and info_request_round < 2"
        actor: SalesAdmin
        preconditions:
          - "claim.status == SUBMITTED"
          - "claim.info_request_round < 2"
        side_effects:
          - "info_request_round += 1; reviewed_by_user_id = X-User-ID"
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /warranty-claims/{id}/resubmission"
        actor: Dealer
        preconditions:
          - "claim.status == INFO_REQUESTED"
          - "X-User-ID == claim.dealer_id"
        side_effects:
          - "labor_hours and part_lines replaced when supplied; part_line_count recomputed"
        note: "SUBMITTED -> INFO_REQUESTED -> SUBMITTED is the negotiation loop; the loop terminates at the third REQUEST_INFO."
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /warranty-claims/{id}/review with decision == REQUEST_INFO and info_request_round == 2"
        actor: SalesAdmin
        preconditions:
          - "claim.status == SUBMITTED"
          - "claim.info_request_round == 2"
        side_effects:
          - "info_request_round += 1 (to 3); denial_reason = INFO_REQUEST_LIMIT_REACHED"
          - "no reimbursement fields are computed"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /warranty-claims/{id}/review with decision == DENY"
        actor: SalesAdmin
        preconditions:
          - "claim.status == SUBMITTED"
        side_effects:
          - "denial_reason = REVIEWER_DENIED; reviewed_by_user_id = X-User-ID"
          - "no reimbursement fields are computed; Dealer.warranty_receivable_cents unchanged"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /warranty-claims/{id}/review with decision == APPROVE and part_line_count > 0"
        actor: SalesAdmin
        preconditions:
          - "claim.status == SUBMITTED"
        side_effects:
          - "coverage_variant, coverage_factor, labor_cents, parts_subtotal_cents, freight_cents and reimbursement_total_cents computed per calculations.warranty_reimbursement"
          - "reviewed_by_user_id = X-User-ID"
      - from: APPROVED
        to: CLOSED
        trigger: "system: auto-transition evaluated at approval when part_line_count == 0 (labor-only claim, nothing to ship)"
        actor: system
        preconditions:
          - "claim.status == APPROVED"
          - "claim.part_line_count == 0"
        side_effects:
          - "Dealer.warranty_receivable_cents += reimbursement_total_cents; increments Dealer.version by 1"
      - from: APPROVED
        to: PARTS_SHIPPED
        trigger: "POST /warranty-claims/{id}/part-shipment with shipped_line_count + already shipped < part_line_count"
        actor: SalesAdmin
        preconditions:
          - "claim.status == APPROVED"
          - "claim.part_line_count > 0"
          - "claim.shipped_line_count + request.line_count <= claim.part_line_count"
        side_effects:
          - "claim.shipped_line_count += request.line_count; tracking_number recorded"
      - from: PARTS_SHIPPED
        to: PARTS_SHIPPED
        trigger: "POST /warranty-claims/{id}/part-shipment (further partial shipment)"
        actor: SalesAdmin
        preconditions:
          - "claim.status == PARTS_SHIPPED"
          - "claim.shipped_line_count + request.line_count <= claim.part_line_count"
        side_effects:
          - "claim.shipped_line_count += request.line_count; tracking_number overwritten with the newest shipment's number"
      - from: PARTS_SHIPPED
        to: CLOSED
        trigger: "system: auto-transition evaluated after every part shipment once shipped_line_count == part_line_count"
        actor: system
        preconditions:
          - "claim.shipped_line_count == claim.part_line_count"
        side_effects:
          - "Dealer.warranty_receivable_cents += reimbursement_total_cents; floor_plan fields untouched; increments Dealer.version by 1"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: order-allocation-stale-dealer
    parent_entity: Dealer
    write_endpoint: "POST /dealer-orders/{id}/allocation"
    occ_field: "expected_dealer_version"
    description: |
      Allocating a DealerOrder consumes two shared dealer-level quantities — the
      floor-plan balance and the monthly allocation quota — and, under §1.3's
      volume tier, the price of THIS order depends on the dealer's allocation
      count at the moment of the draw. A caller whose expected_dealer_version is
      older than Dealer.version has therefore priced and credit-checked the order
      against a superseded view of the dealer (an earlier allocation, a
      cancellation that released a draw, a limit adjustment, or a warranty
      receivable credit has landed since) and is rejected so it can re-read and
      re-decide. The same allocation retried with the fresh version succeeds.
    error_id: ERR_STALE_DEALER_VERSION
    http_status: 412
  - rule_id: jig-reservation-stale-jig
    parent_entity: WeldJig
    write_endpoint: "POST /weld-jigs/{id}/jig-reservations"
    occ_field: "expected_weld_jig_version"
    description: |
      A weld-jig reservation is accepted or rejected against the jig's whole
      occupancy calendar and its aggregate reserved_minutes_total. A caller whose
      expected_weld_jig_version is older than WeldJig.version booked its window
      against a superseded calendar — another reservation has been added, or a
      model revision released one and gave the minutes back — so the request is
      rejected rather than silently squeezed into a calendar the caller never saw.
    error_id: ERR_STALE_JIG_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
# round_half_up(x) below always means: round the exact decimal value of x to the
# nearest integer, with exact .5 going away from zero. No binary float shortcuts.
calculations:
  - name: gvwr_rating
    trigger: "POST /trailer-models/{id}/certification-submission (provisional variant) and POST /trailer-models/{id}/certification-decision with decision == CERTIFIED (certified variant)"
    algorithm: threshold
    formula: |
      axle_capacity_lbs   = axle_count * axle_rating_lbs
      tire_capacity_lbs   = axle_count * TIRES_PER_AXLE * tire_load_rating_lbs
      frame_capacity_lbs  = frame_design_rated_lbs
      coupler_capacity_lbs = coupler_rating_lbs

      # variant provisional_engineering_estimate — the tire circuit is not yet
      # sourced at submission time, so tires are NOT in the min() set and no
      # brake derate is applied:
      provisional_gvwr_lbs = min(axle_capacity_lbs, frame_capacity_lbs, coupler_capacity_lbs)

      # variant certified_final — evaluation order is pinned: (1) take the min
      # over ALL FOUR capacities, (2) apply the brake derate, (3) round DOWN to
      # the nearest 10 lb. Rounding after the derate, never before.
      raw = min(axle_capacity_lbs, tire_capacity_lbs, frame_capacity_lbs, coupler_capacity_lbs)
      if design_braked_axle_count < axle_count:
          derated = raw * UNBRAKED_AXLE_DERATE          # 0.90
      else:
          derated = raw
      certified_gvwr_lbs = floor(derated / GVWR_ROUND_STEP_LBS) * GVWR_ROUND_STEP_LBS
    input_set: "Only the TrailerModel's own input fields; no unit, option or dealer data participates. Runs on the model row only, regardless of how many units reference it."
    constants:
      TIRES_PER_AXLE: 2
      UNBRAKED_AXLE_DERATE: 0.90
      GVWR_ROUND_STEP_LBS: 10
    precision: "integer pounds; the derate result is truncated DOWN to a multiple of 10"
    variants:
      - name: provisional_engineering_estimate
        when: "written to provisional_gvwr_lbs on every DRAFT->IN_ENGINEERING_REVIEW and CERTIFIED->IN_ENGINEERING_REVIEW transition"
        difference: "tire_capacity_lbs is excluded from the min() set and the unbraked-axle derate is not applied, so it is >= certified_gvwr_lbs for identical inputs"
      - name: certified_final
        when: "written to certified_gvwr_lbs on the IN_ENGINEERING_REVIEW->CERTIFIED transition, and snapshotted onto TrailerUnit.gvwr_lbs at jig-reservation time"
        difference: "includes tire_capacity_lbs, applies UNBRAKED_AXLE_DERATE when any axle is unbraked, then floors to a 10 lb step"

  - name: frame_dimensional_verdict
    trigger: "POST /trailer-units/{id}/frame-inspections"
    algorithm: threshold
    formula: |
      length_deviation_mm = abs(measured_length_mm - model.nominal_length_mm)
      width_deviation_mm  = abs(measured_width_mm  - model.nominal_width_mm)
      max_deviation_mm    = max(length_deviation_mm, width_deviation_mm)
      squareness_delta_mm = abs(diagonal_a_mm - diagonal_b_mm)

      failure_reasons = []
      if critical_weld_defect_count > 0:                     failure_reasons += [CRITICAL_WELD_DEFECT]
      if max_deviation_mm > FRAME_TOL_MM:                    failure_reasons += [MAX_DEVIATION]
      if non_critical_weld_defect_count > NON_CRITICAL_MAX:  failure_reasons += [NON_CRITICAL_WELD_DEFECT]
      if squareness_delta_mm > SQUARENESS_TOL_MM:            failure_reasons += [SQUARENESS]
      failure_reasons = sorted(failure_reasons)              # ascending alphabetical, stable output order
      result = PASS if failure_reasons == [] else FAIL
    input_set: "This inspection's measurements plus the nominal dimensions of TrailerModel(unit.model_id) as of now; earlier inspections of the same unit do not affect the verdict, only unit.frame_fail_count."
    constants:
      FRAME_TOL_MM: 3.0
      SQUARENESS_TOL_MM: 6.0
      NON_CRITICAL_MAX: 2
      FRAME_SCRAP_THRESHOLD: 3
    precision: "deviations carried to one decimal place; comparisons are inclusive (a deviation exactly equal to the tolerance PASSES)"

  - name: regulatory_equipment_requirements
    trigger: "POST /trailer-units/{id}/systems-install, evaluated per stage"
    algorithm: threshold
    formula: |
      # stage == LIGHTING (validations[priority=62])
      required_lighting_ok =
          stop_tail_turn_lamp_count   >= 2
          and license_plate_lamp_count >= 1
          and reflex_reflector_count   >= 4
          and (model.overall_width_in <  WIDE_BODY_WIDTH_IN
               or (clearance_lamp_count >= WIDE_BODY_CLEARANCE_LAMPS
                   and side_marker_lamp_count >= WIDE_BODY_SIDE_MARKERS))

      # stage == BRAKE_AND_AXLE (validations[priority=63]) — thresholds read the
      # UNIT's pinned gvwr_lbs, never the model's live certified_gvwr_lbs
      brake_ok = true
      if unit.gvwr_lbs >= BRAKE_REQUIRED_GVWR_LBS:
          brake_ok = installed_braked_axle_count >= 1 and breakaway_kit_installed == true
      if unit.gvwr_lbs >= ALL_AXLE_BRAKE_GVWR_LBS:
          brake_ok = brake_ok and installed_braked_axle_count == model.axle_count
    input_set: "The request body of this stage plus TrailerModel(unit.model_id).overall_width_in / axle_count and the unit's pinned gvwr_lbs."
    constants:
      WIDE_BODY_WIDTH_IN: 80.0
      WIDE_BODY_CLEARANCE_LAMPS: 5
      WIDE_BODY_SIDE_MARKERS: 4
      BRAKE_REQUIRED_GVWR_LBS: 3000
      ALL_AXLE_BRAKE_GVWR_LBS: 10000
    precision: "all comparisons are inclusive at the boundary: gvwr_lbs exactly 3000 DOES require brakes; overall_width_in exactly 80.0 DOES pull in the wide-body lamp set"

  - name: unit_weight_budget
    trigger: "OptionInstall creation, completion and removal; jig-reservation pinning"
    algorithm: aggregation
    formula: |
      options_weight_lbs   = SUM(OptionInstall.total_weight_lbs)
                             over installs with this unit_id and status IN {PENDING, COMPLETED}
      curb_weight_lbs      = model.base_curb_weight_lbs + options_weight_lbs
      payload_capacity_lbs = unit.gvwr_lbs - curb_weight_lbs
      # Conserved quantity (checked after every mutation, including cascades):
      #     curb_weight_lbs + payload_capacity_lbs == unit.gvwr_lbs
      # Admission rule (validations[priority=74]): an install is rejected when it
      # would make payload_capacity_lbs negative; exactly 0 is admissible.
    input_set: "OptionInstall rows with status IN {PENDING, COMPLETED} only — REMOVED installs are excluded from both the weight and the price aggregate. model.base_curb_weight_lbs is read live, but unit.gvwr_lbs is the value pinned at jig-reservation time."
    constants:
      MIN_PAYLOAD_CAPACITY_LBS: 0
    precision: "integer pounds"

  - name: order_invoice_and_draw
    trigger: "POST /dealer-orders/{id}/allocation, after the unit selector has resolved"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is PINNED 1..7. Step 5 depends on step 3, and step 6
      # depends on step 5, so the apparent circularity (total <- freight <- tier
      # <- dealer history) is resolved in exactly this sequence and no other.
      # 1
      options_total_cents = SUM(OptionInstall.total_price_cents)
                            over installs with unit_id == selected_unit.id
                            and status IN {PENDING, COMPLETED}
      # 2
      invoice_subtotal_cents = model.base_dealer_price_cents + options_total_cents
      # 3  — dealer.allocations_ytd_count as observed BEFORE this allocation
      n = dealer.allocations_ytd_count
      volume_discount_pct = 0.00 if n <= TIER_1_MAX_YTD else (0.03 if n <= TIER_2_MAX_YTD else 0.05)
      # With TIER_1_MAX_YTD = 0 and TIER_2_MAX_YTD = 1: a dealer's FIRST allocation
      # of the calendar year is undiscounted, its SECOND takes 3%, its third and
      # every later one takes 5%.
      # 4
      volume_discount_cents = round_half_up(invoice_subtotal_cents * volume_discount_pct)
      # 5  — freight is waived exactly when ANY volume tier applies, which is why
      #      step 5 cannot be evaluated before step 3
      freight_cents = 0 if volume_discount_pct >= TIER_2_PCT else ORDER_FREIGHT_FLAT_CENTS
      # 6
      invoice_total_cents = invoice_subtotal_cents - volume_discount_cents + freight_cents
      # 7
      floor_plan_draw_cents = 0 if order.stocking_program == DEMO
                              else round_half_up(invoice_total_cents * FLOOR_PLAN_DRAW_PCT)
    input_set: "TrailerModel(order.model_id).base_dealer_price_cents, the selected unit's non-REMOVED OptionInstall rows, and Dealer.allocations_ytd_count evaluated BEFORE this allocation is counted."
    constants:
      ORDER_FREIGHT_FLAT_CENTS: 89500
      FLOOR_PLAN_DRAW_PCT: 0.90
      TIER_1_MAX_YTD: 0
      TIER_2_MAX_YTD: 1
      TIER_2_PCT: 0.03
      TIER_3_PCT: 0.05
    precision: "integer cents, round_half_up at steps 4 and 7 only; no intermediate rounding anywhere else"

  - name: allocation_unit_selector
    trigger: "POST /dealer-orders/{id}/allocation when the request omits unit_id"
    algorithm: chronological
    formula: |
      candidates = TrailerUnit rows where
          unit.model_id      == order.model_id
          and unit.build_status  == RELEASED_TO_STOCK
          and unit.dealer_order_id IS NULL
          and EXISTS CertificationLabel with unit_id == unit.id and status == ISSUED
      # ranking, applied in this order:
      #   1. released_to_stock_at ASC      (oldest stock unit is allocated first)
      #   2. created_at ASC                (tie-break when timestamps are equal)
      #   3. serial_number ASC             (lexicographic final tie-break)
      # `id` is NEVER consulted at any level.
      if candidates is empty: reject with ERR_NO_ALLOCATABLE_UNIT
      selected_unit = first(sort(candidates, [released_to_stock_at ASC, created_at ASC, serial_number ASC]))
    input_set: "Only units of the order's own model that are in RELEASED_TO_STOCK with a null dealer_order_id and an ISSUED label. Units whose label was VOIDED, units on hold, and units already allocated are all excluded."
    constants: {}
    precision: "timestamps compared at millisecond resolution as stored (ISO 8601 UTC, three fractional digits)"
    variants:
      - name: explicit_unit_override
        when: "the request supplies unit_id"
        difference: "no ranking runs; the named unit must itself satisfy the eligibility predicate (else ERR_UNIT_NOT_ALLOCATABLE) and must belong to the order's model (else ERR_UNIT_MODEL_MISMATCH, which is checked at the earlier priority 73)"

  - name: vin_assignment
    trigger: "POST /trailer-units/{id}/certification-label"
    algorithm: chronological
    formula: |
      vin_sequence = plant_vin_counter_next()   # starts at 1, +1 per ISSUED label,
                                                # never reused — a VOIDED label does
                                                # NOT return its number to the pool
      brake_code = "E" if unit.installed_braked_axle_count >= 1 else "N"
      vin = VIN_WMI                                   # 3 chars, "5XY"
            + model.frame_design_code                 # 2 chars
            + str(model.axle_count)                   # 1 char
            + brake_code                              # 1 char
            + "A"                                     # 1 char body-style filler
            + "0"                                     # 1 char check placeholder
            + VIN_YEAR_CODE[year(clock_now)]           # 1 char
            + VIN_PLANT_CODE                          # 1 char, "P"
            + zero_pad(vin_sequence, 6)               # 6 chars
      mco_number = "MCO-" + zero_pad(vin_sequence, 6)
      gvwr_lbs           = unit.gvwr_lbs                 # snapshot, not the model's live value
      gawr_per_axle_lbs  = model.axle_rating_lbs
      model_version_pinned = unit.model_version_pinned
    input_set: "The unit's pinned snapshot fields plus the model's frame_design_code / axle_count / axle_rating_lbs read live at issuance, and the logical clock's calendar year."
    constants:
      VIN_WMI: "5XY"
      VIN_PLANT_CODE: "P"
      VIN_YEAR_CODE: { 2026: "T", 2027: "V", 2028: "W", 2029: "X", 2030: "Y" }
    precision: "vin is exactly 17 characters; vin_sequence and the MCO suffix are zero-padded to 6 digits"

  - name: warranty_reimbursement
    trigger: "POST /warranty-claims/{id}/review with decision == APPROVE"
    algorithm: weighted_scoring
    formula: |
      # --- rounding order is PINNED: mark up ONE part line, round THAT line to
      # whole cents, THEN multiply by quantity, THEN sum the lines. Summing the
      # raw marked-up values and rounding once at the end is explicitly WRONG.
      parts_subtotal_cents = 0
      for line in claim.part_lines:
          line_cents = round_half_up(line.unit_cost_cents * (1 + PARTS_MARKUP_PCT)) * line.quantity
          parts_subtotal_cents += line_cents

      labor_cents = round_half_up(claim.labor_hours * dealer.labor_rate_cents_per_hour)

      if parts_subtotal_cents == 0:                        freight_cents = 0
      elif parts_subtotal_cents >= FREIGHT_WAIVER_CENTS:   freight_cents = 0
      else:                                                freight_cents = PART_FREIGHT_FLAT_CENTS

      gross_cents = labor_cents + parts_subtotal_cents + freight_cents

      # coverage window, measured in whole days on the logical calendar
      expiry_at  = unit.warranty_start_date + WARRANTY_DAYS days
      days_past  = floor((claim.failure_date - expiry_at) / 1 day)
      if days_past <= 0:            coverage_variant = IN_WARRANTY_FULL;  coverage_factor = 1.00
      elif days_past <= 30:         coverage_variant = GOODWILL_PRORATED; coverage_factor = 0.75
      elif days_past <= 60:         coverage_variant = GOODWILL_PRORATED; coverage_factor = 0.50
      elif days_past <= 90:         coverage_variant = GOODWILL_PRORATED; coverage_factor = 0.25
      else:                         reject with ERR_WARRANTY_WINDOW_EXPIRED (validations[priority=82], checked at submission)

      reimbursement_total_cents = round_half_up(gross_cents * coverage_factor)
    input_set: "The claim's part_lines and labor_hours as of the most recent submission or resubmission, Dealer.labor_rate_cents_per_hour read live at approval time, and TrailerUnit.warranty_start_date."
    constants:
      PARTS_MARKUP_PCT: 0.30
      PART_FREIGHT_FLAT_CENTS: 4500
      FREIGHT_WAIVER_CENTS: 50000
      WARRANTY_DAYS: 730
    precision: "integer cents; round_half_up per part line and once more on the coverage multiplication — nowhere else"
    variants:
      - name: in_warranty_full
        when: "failure_date <= unit.warranty_start_date + 730 days"
        difference: "coverage_factor 1.00, so reimbursement_total_cents == gross_cents"
      - name: goodwill_prorated
        when: "failure_date is 1..90 days past the 730-day expiry"
        difference: "coverage_factor steps down 0.75 / 0.50 / 0.25 across 30-day bands, so the SAME labor hours and part lines reimburse strictly less than in_warranty_full"

  - name: jig_occupancy_conflict
    trigger: "POST /weld-jigs/{id}/jig-reservations"
    algorithm: interval_merge
    formula: |
      buffer = WeldJig.changeover_buffer_min minutes (read live at request time)
      # Half-open geometry with a TRAILING buffer folded onto each interval:
      #   occupancy(X) = [ X.window_start_at , X.window_end_at + buffer )
      new_occ_end      = request.window_end_at + buffer
      for R in JigReservation where R.jig_id == jig.id and R.status IN {RESERVED, CONSUMED}:
          existing_occ_end = R.window_end_at + buffer
          if request.window_start_at < existing_occ_end and R.window_start_at < new_occ_end:
              reject with ERR_JIG_WINDOW_CONFLICT
      duration_minutes = whole minutes between window_start_at and window_end_at   # buffer excluded
      occupancy_end_at = new_occ_end
    input_set: "Reservations on the SAME jig with status IN {RESERVED, CONSUMED}. RELEASED reservations are ignored entirely, which is what lets a revision-released window be rebooked."
    constants:
      DEFAULT_CHANGEOVER_BUFFER_MIN: 45
    precision: "minute resolution; the comparison is strict `<`, so a gap of exactly `buffer` minutes between one window's end and the next window's start is ACCEPTED, and a gap of buffer-1 minutes is rejected"

  - name: lane_capacity_conflict
    trigger: "POST /trailer-units/{id}/road-tests"
    algorithm: interval_merge
    formula: |
      # CLOSED geometry, no buffer, aggregate capacity — deliberately different
      # arithmetic from jig_occupancy_conflict:
      #   occupancy(X) = [ X.window_start_at , X.window_end_at ]   (endpoints INCLUDED)
      overlapping = COUNT of RoadTest R where
          R.lane_id == request.lane_id
          and R.status == SCHEDULED
          and R.window_start_at <= request.window_end_at
          and request.window_start_at <= R.window_end_at
      if overlapping >= TestLane.max_concurrent_tests:
          reject with ERR_LANE_CAPACITY_EXCEEDED
    input_set: "Only RoadTest rows on the same lane with status == SCHEDULED. PASSED and FAILED tests have vacated the lane and never count, no matter how recent."
    constants:
      DEFAULT_MAX_CONCURRENT_TESTS: 2
    precision: "second resolution; endpoints are inclusive, so two windows that merely touch (one ends exactly when the next begins) DO count as overlapping"

  - name: floor_plan_conservation
    trigger: "Recomputed on allocation, cancellation, delivery, and every floor-plan adjustment"
    algorithm: aggregation
    formula: |
      floor_plan_outstanding_cents = SUM(DealerOrder.floor_plan_draw_cents)
          over orders with this dealer_id and floor_plan_status == DRAWN
      floor_plan_available_cents   = floor_plan_limit_cents - floor_plan_outstanding_cents
      # Compensation invariant: allocate-then-cancel must leave
      # floor_plan_outstanding_cents byte-identical to its pre-allocation value.
      # Admission rule (validations[priority=90], non-DEMO orders only):
      #     floor_plan_outstanding_cents + floor_plan_draw_cents <= floor_plan_limit_cents
      # Derived status rule: after a LIMIT_DECREASE that leaves
      # floor_plan_outstanding_cents > floor_plan_limit_cents, Dealer.status
      # becomes CREDIT_HOLD.
    input_set: "DealerOrder rows with floor_plan_status == DRAWN only. RELEASED (cancelled) and REPAID (paid off) draws are excluded, and DEMO orders never contribute because their draw is 0."
    constants: {}
    precision: "integer cents; the admission comparison is inclusive, so a draw that lands exactly on the limit is accepted"

  - name: dealer_allocation_counters
    trigger: "Recomputed on allocation, cancellation and delivery"
    algorithm: aggregation
    formula: |
      allocations_current_month_count = COUNT(DealerOrder) where
          dealer_id == dealer.id
          and status IN {ALLOCATED, DELIVERED}
          and allocated_at falls inside the logical clock's current UTC calendar month
      allocations_ytd_count = COUNT(DealerOrder) where
          dealer_id == dealer.id
          and status IN {ALLOCATED, DELIVERED}
          and allocated_at falls inside the logical clock's current UTC calendar year
      # Admission rule (validations[priority=85]):
      #     allocations_current_month_count + 1 <= allocation_quota_per_month
    input_set: "Orders in status ALLOCATED or DELIVERED only; CANCELLED orders are excluded from both counters even though allocated_at is retained on the row."
    constants: {}
    precision: "calendar month and year boundaries are UTC and read from the logical clock, not from wall-clock time"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
# The ladder below is total: whenever two rules are violated by one request the
# numerically smaller priority is the response, and every §1.8 priority-conflict
# instance is grounded in a pair drawn from this table.
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID are both present and X-User-Role is one of the seven roles of §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 20
    category: auth
    check: "The role in X-User-Role appears in the called endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 25
    category: auth
    check: "For X-User-Role == Dealer, X-User-ID must equal the dealer the request touches: body dealer_id on POST /dealer-orders and POST /warranty-claims, order.dealer_id on POST /dealer-orders/{id}/cancellation, claim.dealer_id on POST /warranty-claims/{id}/resubmission, {id} on GET /dealers/{id}, and the dealer_id filter on GET /dealer-orders and GET /warranty-claims"
    error_id: ERR_DEALER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /dealer-orders, POST /dealer-orders/{id}/cancellation, POST /warranty-claims, POST /warranty-claims/{id}/resubmission, GET /dealers/{id}, GET /dealer-orders, GET /warranty-claims"
  - priority: 30
    category: existence
    check: "Every resource named in the path exists, checked left to right"
    error_id: "ERR_MODEL_NOT_FOUND | ERR_DEALER_NOT_FOUND | ERR_UNIT_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_RESOURCE_NOT_FOUND"
    http_status: 404
    applies_to: all
  - priority: 35
    category: existence
    check: "Every foreign key in the request body resolves: model_id, unit_id, dealer_id, lane_id, order_id"
    error_id: "ERR_MODEL_NOT_FOUND | ERR_UNIT_NOT_FOUND | ERR_DEALER_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_RESOURCE_NOT_FOUND"
    http_status: 404
    applies_to: "POST /trailer-units, POST /weld-jigs/{id}/jig-reservations, POST /trailer-units/{id}/road-tests, POST /dealer-orders, POST /dealer-orders/{id}/allocation, POST /warranty-claims, POST /dealers/{id}/floor-plan-adjustments"
  - priority: 40
    category: business_constraint
    check: "Body conforms to the endpoint's input schema: required fields present, enum members recognized, numeric constraints of §1.1 respected (including design_braked_axle_count <= axle_count and quantity >= 1), window_end_at strictly after window_start_at, part_lines entries carrying a positive integer unit_cost_cents and quantity, timestamps parseable as ISO 8601 UTC"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 45
    category: state
    check: "expected_dealer_version equals Dealer.version (concurrency_rules.order-allocation-stale-dealer)"
    error_id: ERR_STALE_DEALER_VERSION
    http_status: 412
    applies_to: "POST /dealer-orders/{id}/allocation"
  - priority: 46
    category: state
    check: "expected_weld_jig_version equals WeldJig.version (concurrency_rules.jig-reservation-stale-jig)"
    error_id: ERR_STALE_JIG_VERSION
    http_status: 412
    applies_to: "POST /weld-jigs/{id}/jig-reservations"
  - priority: 50
    category: state
    check: "TrailerUnit.build_status is in the set the requested step allows: PLANNED for a jig reservation; {JIG_RESERVED, FRAME_REWORK} for a frame inspection; {FRAME_WELDED, SYSTEMS_REWORK} for a systems stage; {SYSTEMS_INSTALLED, SYSTEMS_REWORK, ROAD_TEST_PASSED, LABELED, RELEASED_TO_STOCK, ALLOCATED} for booking a road test; ROAD_TEST_PASSED for a certification label; {FRAME_WELDED, SYSTEMS_INSTALLED, SYSTEMS_REWORK, ROAD_TEST_PENDING, ROAD_TEST_PASSED, LABELED} for an option install"
    error_id: ERR_UNIT_BUILD_STATE_INVALID
    http_status: 409
    applies_to: "POST /weld-jigs/{id}/jig-reservations, POST /trailer-units/{id}/frame-inspections, POST /trailer-units/{id}/systems-install, POST /trailer-units/{id}/road-tests, POST /trailer-units/{id}/certification-label, POST /trailer-units/{id}/option-installs"
  - priority: 51
    category: state
    check: "Systems stages run in order on the parallel compliance dimension: stage LIGHTING requires compliance_status IN {NOT_VERIFIED, NON_COMPLIANT}; stage BRAKE_AND_AXLE requires compliance_status == LIGHTING_VERIFIED"
    error_id: ERR_COMPLIANCE_STAGE_OUT_OF_ORDER
    http_status: 409
    applies_to: "POST /trailer-units/{id}/systems-install"
  - priority: 52
    category: state
    check: "TrailerModel.certification_status permits the transition: DRAFT or CERTIFIED for a certification submission, IN_ENGINEERING_REVIEW for a certification decision"
    error_id: ERR_MODEL_STATE_INVALID
    http_status: 409
    applies_to: "POST /trailer-models/{id}/certification-submission, POST /trailer-models/{id}/certification-decision"
  - priority: 53
    category: state
    check: "DealerOrder.status permits the transition: PENDING for allocation, ALLOCATED for delivery, PENDING or ALLOCATED for cancellation"
    error_id: ERR_ORDER_STATE_INVALID
    http_status: 409
    applies_to: "POST /dealer-orders/{id}/allocation, POST /dealer-orders/{id}/delivery, POST /dealer-orders/{id}/cancellation"
  - priority: 54
    category: state
    check: "WarrantyClaim.status permits the transition: SUBMITTED for review, INFO_REQUESTED for resubmission, APPROVED or PARTS_SHIPPED for a part shipment; and for a part shipment shipped_line_count + line_count <= part_line_count"
    error_id: ERR_CLAIM_STATE_INVALID
    http_status: 409
    applies_to: "POST /warranty-claims/{id}/review, POST /warranty-claims/{id}/resubmission, POST /warranty-claims/{id}/part-shipment"
  - priority: 55
    category: state
    check: "The unit has no CertificationLabel with status == ISSUED"
    error_id: ERR_LABEL_ALREADY_ISSUED
    http_status: 409
    applies_to: "POST /trailer-units/{id}/certification-label"
  - priority: 56
    category: state
    check: "RoadTest.status == SCHEDULED"
    error_id: ERR_ROAD_TEST_ALREADY_RESULTED
    http_status: 409
    applies_to: "POST /road-tests/{id}/result"
  - priority: 57
    category: state
    check: "OptionInstall.status == PENDING (a COMPLETED or REMOVED line can be neither signed off again nor removed)"
    error_id: ERR_OPTION_NOT_REMOVABLE
    http_status: 409
    applies_to: "POST /option-installs/{id}/completion, DELETE /option-installs/{id}"
  - priority: 58
    category: business_referential
    check: "TrailerModel(model_id).certification_status IN {DRAFT, IN_ENGINEERING_REVIEW, CERTIFIED} — a WITHDRAWN model may not receive new units"
    error_id: ERR_MODEL_NOT_BUILDABLE
    http_status: 409
    applies_to: "POST /trailer-units"
  - priority: 59
    category: business_referential
    check: "TrailerModel(unit.model_id).certification_status == CERTIFIED — a unit may not enter a weld jig until its model's GVWR is certified (cross-entity state dependency)"
    error_id: ERR_MODEL_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /weld-jigs/{id}/jig-reservations"
  - priority: 60
    category: business_safety
    check: "Segregation of duties: X-User-ID != TrailerModel(unit.model_id).certified_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /trailer-units/{id}/certification-label"
  - priority: 62
    category: business_safety
    check: "The lighting branch of calculations.regulatory_equipment_requirements holds for stage LIGHTING"
    error_id: ERR_LIGHTING_NOT_COMPLIANT
    http_status: 422
    applies_to: "POST /trailer-units/{id}/systems-install"
  - priority: 63
    category: business_safety
    check: "The brake branch of calculations.regulatory_equipment_requirements holds for stage BRAKE_AND_AXLE, evaluated against the UNIT's pinned gvwr_lbs and never the model's live certified_gvwr_lbs"
    error_id: ERR_BRAKE_REQUIREMENT_UNMET
    http_status: 422
    applies_to: "POST /trailer-units/{id}/systems-install"
  - priority: 64
    category: business_safety
    check: "TrailerUnit.compliance_status == FULLY_COMPLIANT before a road test may be booked or a certification label issued"
    error_id: ERR_UNIT_NOT_COMPLIANT
    http_status: 422
    applies_to: "POST /trailer-units/{id}/road-tests, POST /trailer-units/{id}/certification-label"
  - priority: 70
    category: business_constraint
    check: "Uniqueness of TrailerModel.model_code, Dealer.dealer_code, WeldJig.jig_code, TestLane.lane_code, TrailerUnit.serial_number and WarrantyClaim.claim_ref"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /trailer-models, POST /dealers, POST /weld-jigs, POST /test-lanes, POST /trailer-units, POST /warranty-claims"
  - priority: 72
    category: business_constraint
    check: "WeldJig.frame_design_code == TrailerModel(unit.model_id).frame_design_code"
    error_id: ERR_JIG_DESIGN_MISMATCH
    http_status: 422
    applies_to: "POST /weld-jigs/{id}/jig-reservations"
  - priority: 73
    category: business_constraint
    check: "When the allocation request supplies unit_id, TrailerUnit(unit_id).model_id == DealerOrder.model_id"
    error_id: ERR_UNIT_MODEL_MISMATCH
    http_status: 422
    applies_to: "POST /dealer-orders/{id}/allocation"
  - priority: 74
    category: business_constraint
    check: "After charging this install, unit.payload_capacity_lbs >= 0 per calculations.unit_weight_budget (exactly 0 is admissible)"
    error_id: ERR_PAYLOAD_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /trailer-units/{id}/option-installs"
  - priority: 75
    category: business_constraint
    check: "labor_hours <= FLAT_RATE_HOURS[complaint_code] * 1.25, with FLAT_RATE_HOURS = {AXLE: 3.5, BRAKE: 2.5, LIGHTING: 1.5, FRAME: 6.0, FLOORING: 4.0, COUPLER: 2.0}; the comparison is inclusive"
    error_id: ERR_LABOR_HOURS_EXCEED_FLAT_RATE
    http_status: 422
    applies_to: "POST /warranty-claims, POST /warranty-claims/{id}/resubmission"
  - priority: 76
    category: business_referential
    check: "When the allocation request supplies unit_id, that unit satisfies the eligibility predicate of calculations.allocation_unit_selector: build_status == RELEASED_TO_STOCK, dealer_order_id null, and an ISSUED CertificationLabel"
    error_id: ERR_UNIT_NOT_ALLOCATABLE
    http_status: 409
    applies_to: "POST /dealer-orders/{id}/allocation"
  - priority: 77
    category: business_referential
    check: "When the allocation request omits unit_id, the selector's candidate set is non-empty"
    error_id: ERR_NO_ALLOCATABLE_UNIT
    http_status: 409
    applies_to: "POST /dealer-orders/{id}/allocation"
  - priority: 78
    category: business_referential
    check: "TrailerUnit(unit_id).build_status == SHIPPED and warranty_start_date is not null — a claim may only be filed against a delivered trailer"
    error_id: ERR_UNIT_NOT_DELIVERED
    http_status: 409
    applies_to: "POST /warranty-claims"
  - priority: 79
    category: business_referential
    check: "Dealer.status == ACTIVE"
    error_id: ERR_DEALER_CREDIT_HOLD
    http_status: 409
    applies_to: "POST /dealer-orders/{id}/allocation"
  - priority: 80
    category: business_temporal
    check: "No jig-window conflict per calculations.jig_occupancy_conflict — half-open windows each extended by the jig's trailing changeover buffer, single occupancy, only RESERVED and CONSUMED reservations considered"
    error_id: ERR_JIG_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /weld-jigs/{id}/jig-reservations"
  - priority: 81
    category: business_temporal
    check: "No lane-capacity breach per calculations.lane_capacity_conflict — closed windows, no buffer, aggregate capacity TestLane.max_concurrent_tests, only SCHEDULED tests considered"
    error_id: ERR_LANE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /trailer-units/{id}/road-tests"
  - priority: 82
    category: business_temporal
    check: "failure_date is at most 90 days past the unit's warranty expiry (warranty_start_date + 730 days)"
    error_id: ERR_WARRANTY_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /warranty-claims, POST /warranty-claims/{id}/resubmission"
  - priority: 85
    category: business_fiscal
    check: "Dealer.allocations_current_month_count + 1 <= Dealer.allocation_quota_per_month"
    error_id: ERR_ALLOCATION_QUOTA_EXCEEDED
    http_status: 409
    applies_to: "POST /dealer-orders/{id}/allocation"
  - priority: 90
    category: business_fiscal
    check: "For orders whose stocking_program != DEMO: Dealer.floor_plan_outstanding_cents + this order's computed floor_plan_draw_cents <= Dealer.floor_plan_limit_cents (inclusive). DEMO orders draw 0 and skip the check entirely."
    error_id: ERR_FLOOR_PLAN_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /dealer-orders/{id}/allocation"

# ---------------------------------------------------------------------------
# §1.5 API Endpoints
# ---------------------------------------------------------------------------
endpoints:
  - method: POST
    path: /_clock/set_current_utc
    purpose: "Move the logical clock that every window, month, year and warranty-day computation reads. Until it is called the logical now is 2026-08-01T00:00:00Z."
    input: [to_iso8601]
    output: "{ current_utc: string }"
    success_status: 200
    roles: [PlantEngineer, CertificationOfficer, WeldSupervisor, QualityInspector, AssemblyTech, SalesAdmin, Dealer]
    side_effects: ["Logical now becomes to_iso8601 for every subsequent request"]
  - method: POST
    path: /trailer-models
    purpose: "Register a trailer model configuration: axle, tire, frame and coupler capacities plus nominal frame geometry and dealer price."
    input: [model_code, description, axle_count, axle_rating_lbs, design_braked_axle_count, tire_load_rating_lbs, frame_design_code, frame_design_rated_lbs, coupler_rating_lbs, overall_width_in, nominal_length_mm, nominal_width_mm, base_curb_weight_lbs, base_dealer_price_cents]
    output: "TrailerModel"
    success_status: 201
    roles: [PlantEngineer]
    side_effects: ["certification_status = DRAFT, revision_round = 0, active_unit_count = 0", "provisional_gvwr_lbs and certified_gvwr_lbs stay null until the model enters review"]
  - method: POST
    path: /trailer-models/{id}/certification-submission
    purpose: "Submit a model for GVWR certification review, or reopen a certified model for an engineering change."
    input: [engineering_note]
    output: "TrailerModel"
    success_status: 200
    roles: [PlantEngineer]
    side_effects: ["certification_status = IN_ENGINEERING_REVIEW", "provisional_gvwr_lbs = calculations.gvwr_rating variant provisional_engineering_estimate", "From CERTIFIED: certified_gvwr_lbs, certified_by_user_id and certified_at are retained", "version increments"]
  - method: POST
    path: /trailer-models/{id}/certification-decision
    purpose: "Certify, send back for revision, or withdraw a model under engineering review."
    input: [decision, decision_note]
    output: "TrailerModel"
    success_status: 200
    roles: [CertificationOfficer]
    side_effects: ["CERTIFIED: certified_gvwr_lbs = calculations.gvwr_rating variant certified_final, certified_by_user_id = X-User-ID, certified_at = logical now, and BUILD_HOLD units of this model return to PLANNED", "REVISION_REQUESTED: revision_round += 1, certification_status = DRAFT, and the 3-hop cascade of state_machines.TrailerModel.certification_status runs (units to BUILD_HOLD, their RESERVED JigReservations to RELEASED, each WeldJig.reserved_minutes_total decremented and its version bumped)", "WITHDRAWN: PLANNED and BUILD_HOLD units are SCRAPPED and their reservations RELEASED", "active_unit_count recomputed; version increments"]
  - method: POST
    path: /dealers
    purpose: "Enroll a dealer with its warranty labor rate, floor plan limit and monthly allocation quota."
    input: [dealer_code, name, labor_rate_cents_per_hour, floor_plan_limit_cents, allocation_quota_per_month]
    output: "Dealer"
    success_status: 201
    roles: [SalesAdmin]
    side_effects: ["status = ACTIVE", "floor_plan_outstanding_cents = 0 and floor_plan_available_cents = floor_plan_limit_cents", "allocations_current_month_count = allocations_ytd_count = warranty_receivable_cents = 0"]
  - method: POST
    path: /dealers/{id}/floor-plan-adjustments
    purpose: "Raise or lower a dealer's floor plan limit, repay an allocated order's draw, or place and release a credit hold."
    input: [adjustment_type, amount_cents, "order_id?", "note?"]
    output: "Dealer"
    success_status: 200
    roles: [SalesAdmin]
    side_effects: ["LIMIT_INCREASE / LIMIT_DECREASE: floor_plan_limit_cents moves by amount_cents and floor_plan_available_cents is recomputed; a decrease that leaves outstanding above the limit also sets status = CREDIT_HOLD", "PAYOFF: DealerOrder(order_id).floor_plan_status DRAWN -> REPAID, so that draw leaves the conserved sum of calculations.floor_plan_conservation and floor_plan_outstanding_cents drops by its floor_plan_draw_cents", "CREDIT_HOLD / CREDIT_RELEASE: status set directly", "version increments"]
  - method: POST
    path: /weld-jigs
    purpose: "Commission a frame welding jig dedicated to one frame design, with its changeover buffer."
    input: [jig_code, frame_design_code, "changeover_buffer_min?"]
    output: "WeldJig"
    success_status: 201
    roles: [PlantEngineer]
    side_effects: ["reserved_minutes_total = 0", "changeover_buffer_min defaults to 45 when omitted"]
  - method: POST
    path: /test-lanes
    purpose: "Commission a road test lane with a concurrent-test capacity."
    input: [lane_code, surface_type, "max_concurrent_tests?"]
    output: "TestLane"
    success_status: 201
    roles: [PlantEngineer]
    side_effects: ["max_concurrent_tests defaults to 2 when omitted"]
  - method: POST
    path: /trailer-units
    purpose: "Open a build record for one physical trailer against a model."
    input: [serial_number, model_id, planned_start_date]
    output: "TrailerUnit"
    success_status: 201
    roles: [WeldSupervisor]
    side_effects: ["build_status = PLANNED and compliance_status = NOT_VERIFIED (the two dimensions start independently)", "gvwr_lbs, curb_weight_lbs, payload_capacity_lbs and model_version_pinned stay null until the jig reservation pins them", "TrailerModel.active_unit_count recomputed"]
  - method: POST
    path: /weld-jigs/{id}/jig-reservations
    purpose: "Reserve a welding window for a unit on this jig. Optimistic concurrency on the jig's calendar."
    input: [unit_id, window_start_at, window_end_at, expected_weld_jig_version]
    output: "JigReservation"
    success_status: 201
    roles: [WeldSupervisor]
    side_effects: ["status = RESERVED, duration_minutes and occupancy_end_at computed per calculations.jig_occupancy_conflict", "WeldJig.reserved_minutes_total += duration_minutes and WeldJig.version increments", "TrailerUnit.build_status PLANNED -> JIG_RESERVED", "The unit pins model_version_pinned, gvwr_lbs = model.certified_gvwr_lbs, curb_weight_lbs = model.base_curb_weight_lbs and payload_capacity_lbs = gvwr_lbs - curb_weight_lbs"]
  - method: POST
    path: /trailer-units/{id}/frame-inspections
    purpose: "Record jig dimensional-control readings and weld defect counts for the unit's frame."
    input: [measured_length_mm, measured_width_mm, diagonal_a_mm, diagonal_b_mm, critical_weld_defect_count, non_critical_weld_defect_count]
    output: "FrameInspection"
    success_status: 201
    roles: [WeldSupervisor]
    side_effects: ["inspection_seq assigned 1, 2, 3 ... per unit; deviations, squareness_delta_mm, result and failure_reasons computed per calculations.frame_dimensional_verdict", "result PASS: TrailerUnit.build_status -> FRAME_WELDED and the unit's RESERVED JigReservation -> CONSUMED (reserved_minutes_total unchanged)", "result FAIL with frame_fail_count < 3: TrailerUnit.build_status -> FRAME_REWORK", "result FAIL with frame_fail_count == 3: the 3-hop scrap cascade (unit SCRAPPED, reservation RELEASED, WeldJig.reserved_minutes_total decremented and its version bumped)", "FrameInspection is immutable: common_fields false, no version, no update or delete endpoint"]
  - method: POST
    path: /trailer-units/{id}/systems-install
    purpose: "Record one regulatory systems stage. LIGHTING installs the lamp and reflector set; BRAKE_AND_AXLE installs axles, brakes and the breakaway kit."
    input: [stage, "stop_tail_turn_lamp_count?", "clearance_lamp_count?", "side_marker_lamp_count?", "license_plate_lamp_count?", "reflex_reflector_count?", "installed_braked_axle_count?", "breakaway_kit_installed?"]
    # The five lamp counts are required for stage LIGHTING and ignored otherwise;
    # installed_braked_axle_count and breakaway_kit_installed are required for stage
    # BRAKE_AND_AXLE and ignored otherwise. A stage that omits its own fields fails
    # validations[priority=40].
    output: "TrailerUnit"
    success_status: 200
    roles: [AssemblyTech]
    side_effects: ["stage LIGHTING satisfying calculations.regulatory_equipment_requirements: clearance_lamp_count recorded and compliance_status -> LIGHTING_VERIFIED with build_status deliberately unchanged", "stage BRAKE_AND_AXLE satisfying it: installed_braked_axle_count and breakaway_kit_installed recorded, compliance_status -> FULLY_COMPLIANT and build_status -> SYSTEMS_INSTALLED on the same call", "A failing stage returns its 422 and leaves BOTH status dimensions untouched", "version increments only on success"]
  - method: POST
    path: /trailer-units/{id}/option-installs
    purpose: "Add a custom option (rear ramp gate, cabinet package, specialty flooring, spare carrier, E-track) and charge its weight and price to the unit."
    input: [option_code, quantity, unit_weight_lbs, unit_price_cents, labor_hours]
    output: "OptionInstall"
    success_status: 201
    roles: [AssemblyTech]
    side_effects: ["status = PENDING, total_weight_lbs = unit_weight_lbs * quantity, total_price_cents = unit_price_cents * quantity", "TrailerUnit.curb_weight_lbs and payload_capacity_lbs re-derived per calculations.unit_weight_budget so that curb + payload == gvwr still holds", "TrailerUnit.version increments"]
  - method: POST
    path: /option-installs/{id}/completion
    purpose: "Sign off an option install as physically complete."
    input: [signoff_note]
    output: "OptionInstall"
    success_status: 200
    roles: [AssemblyTech]
    side_effects: ["status PENDING -> COMPLETED; the weight and price aggregates do not move (COMPLETED and PENDING are both inside the aggregate's input set)", "If the unit is in LABELED and this was its last PENDING install, the unit auto-transitions LABELED -> RELEASED_TO_STOCK with released_to_stock_at = logical now", "version increments"]
  - method: DELETE
    path: /option-installs/{id}
    purpose: "Remove a still-pending option install and reverse its weight and price charge exactly."
    input: [removal_reason]
    output: "OptionInstall"
    success_status: 200
    roles: [AssemblyTech]
    side_effects: ["status PENDING -> REMOVED, which drops the line out of the input set of calculations.unit_weight_budget and calculations.order_invoice_and_draw", "TrailerUnit.curb_weight_lbs and payload_capacity_lbs re-derived — a create-then-remove pair must return both to their exact prior values with no drift", "If the unit is in LABELED and this was its last PENDING install, the unit auto-transitions to RELEASED_TO_STOCK", "TrailerUnit.version increments"]
  - method: POST
    path: /trailer-units/{id}/road-tests
    purpose: "Book a road test window for a fully compliant unit on a lane."
    input: [lane_id, window_start_at, window_end_at, protocol_code]
    output: "RoadTest"
    success_status: 201
    roles: [QualityInspector]
    side_effects: ["status = SCHEDULED", "TrailerUnit.build_status -> ROAD_TEST_PENDING (a re-test may therefore be booked on an already RELEASED_TO_STOCK or ALLOCATED unit, pulling it back out of stock)"]
  - method: POST
    path: /road-tests/{id}/result
    purpose: "Record brake stopping distance and the lighting walkaround; pass or fail is derived, never requested."
    input: [brake_stop_distance_ft, lighting_check_passed, "result_notes?"]
    output: "RoadTest"
    success_status: 200
    roles: [QualityInspector]
    side_effects: ["status derived PASSED when brake_stop_distance_ft <= 40.0 AND lighting_check_passed, else FAILED; inspector_user_id recorded", "PASSED: TrailerUnit.build_status -> ROAD_TEST_PASSED", "FAILED: the 4-hop cascade of state_machines.RoadTest.status — unit to SYSTEMS_REWORK with compliance_status FULLY_COMPLIANT -> NON_COMPLIANT, its ISSUED CertificationLabel -> VOIDED with unit.vin nulled, any ALLOCATED DealerOrder back to PENDING with floor_plan_status DRAWN -> RELEASED, and Dealer.floor_plan_outstanding_cents / allocations counters / version adjusted", "version increments"]
  - method: POST
    path: /trailer-units/{id}/certification-label
    purpose: "Mint the VIN and issue the federal certification label and the dealer title document (MCO) for a road-tested unit."
    input: [tire_size_code]
    output: "CertificationLabel"
    success_status: 201
    roles: [CertificationOfficer]
    side_effects: ["vin_sequence drawn from the plant counter (never reused, not returned by a later void), vin and mco_number computed per calculations.vin_assignment", "status = ISSUED with gvwr_lbs, gawr_per_axle_lbs and model_version_pinned snapshotted; issued_by_user_id and issued_at recorded; unit.vin set", "TrailerUnit.build_status -> LABELED, then immediately -> RELEASED_TO_STOCK when the unit has zero PENDING option installs"]
  - method: POST
    path: /dealer-orders
    purpose: "Place a dealer order for a model under a stocking program."
    input: [dealer_id, model_id, po_ref, stocking_program]
    output: "DealerOrder"
    success_status: 201
    roles: [SalesAdmin, Dealer]
    side_effects: ["status = PENDING, floor_plan_status = NONE, floor_plan_draw_cents = 0", "allocated_unit_id and all invoice fields stay null until allocation"]
  - method: POST
    path: /dealer-orders/{id}/allocation
    purpose: "Allocate a stocked unit to the order, invoice it and draw the dealer's floor plan. Optimistic concurrency on the dealer."
    input: [expected_dealer_version, "unit_id?"]
    # unit_id present selects calculations.allocation_unit_selector's
    # explicit_unit_override variant; omitted runs the ranked default variant.
    output: "DealerOrder"
    success_status: 200
    roles: [SalesAdmin]
    side_effects: ["Unit resolved by calculations.allocation_unit_selector, or by its explicit_unit_override variant when unit_id is supplied", "status = ALLOCATED, allocated_unit_id and allocated_at set", "invoice_subtotal_cents, volume_discount_pct, volume_discount_cents, freight_cents, invoice_total_cents and floor_plan_draw_cents computed in the pinned 7-step order of calculations.order_invoice_and_draw", "Non-DEMO orders: floor_plan_status NONE -> DRAWN and Dealer.floor_plan_outstanding_cents += floor_plan_draw_cents", "Unit build_status RELEASED_TO_STOCK -> ALLOCATED with dealer_order_id set", "Dealer.allocations_current_month_count / allocations_ytd_count / floor_plan_available_cents recomputed and Dealer.version increments"]
  - method: POST
    path: /dealer-orders/{id}/cancellation
    purpose: "Cancel a pending or allocated order, releasing any allocated unit and floor plan draw."
    input: [cancellation_reason]
    output: "DealerOrder"
    success_status: 200
    roles: [SalesAdmin, Dealer]
    side_effects: ["status = CANCELLED with cancelled_at set", "From ALLOCATED, the compensating cascade of state_machines.DealerOrder.status: allocated_unit_id cleared, unit back to RELEASED_TO_STOCK with dealer_order_id null and released_to_stock_at NOT rewritten, floor_plan_status DRAWN -> RELEASED, Dealer.floor_plan_outstanding_cents restored and both allocation counters recomputed", "invoice fields and floor_plan_draw_cents are retained for audit; only floor_plan_status removes them from the conserved sum", "version increments"]
  - method: POST
    path: /dealer-orders/{id}/delivery
    purpose: "Deliver the allocated trailer to the dealer, starting its 730-day warranty clock."
    input: [delivery_note]
    output: "DealerOrder"
    success_status: 200
    roles: [SalesAdmin]
    side_effects: ["status = DELIVERED with delivered_at set", "Unit build_status ALLOCATED -> SHIPPED and warranty_start_date = logical now", "floor_plan_status stays DRAWN — delivery does not repay the floor plan, only a PAYOFF adjustment does", "TrailerModel.active_unit_count recomputed; version increments"]
  - method: POST
    path: /warranty-claims
    purpose: "File a warranty claim against a delivered trailer with labor hours and replacement part lines."
    input: [claim_ref, unit_id, dealer_id, complaint_code, labor_hours, part_lines, failure_date]
    output: "WarrantyClaim"
    success_status: 201
    roles: [Dealer, SalesAdmin]
    side_effects: ["status = SUBMITTED, part_line_count = number of part_lines entries, shipped_line_count = 0, info_request_round = 0", "No money is computed at submission: coverage_variant, coverage_factor and every *_cents field stay null until approval"]
  - method: POST
    path: /warranty-claims/{id}/review
    purpose: "Adjudicate a submitted claim: approve, deny, or request more information."
    input: [decision, review_note]
    output: "WarrantyClaim"
    success_status: 200
    roles: [SalesAdmin]
    side_effects: ["APPROVE: coverage_variant, coverage_factor, labor_cents, parts_subtotal_cents, freight_cents and reimbursement_total_cents computed per calculations.warranty_reimbursement; status = APPROVED, or straight to CLOSED with Dealer.warranty_receivable_cents credited when part_line_count == 0", "DENY: status = DENIED, denial_reason = REVIEWER_DENIED, no money computed", "REQUEST_INFO with info_request_round < 2: info_request_round += 1 and status = INFO_REQUESTED; with info_request_round == 2 the loop terminates in DENIED with denial_reason = INFO_REQUEST_LIMIT_REACHED", "reviewed_by_user_id recorded; version increments"]
  - method: POST
    path: /warranty-claims/{id}/resubmission
    purpose: "Answer an information request, optionally revising labor hours and part lines."
    input: [response_note, "labor_hours?", "part_lines?"]
    # Omitting labor_hours / part_lines resubmits the claim unchanged; supplying
    # either replaces it and re-arms validations[priority=75] and [priority=82].
    output: "WarrantyClaim"
    success_status: 200
    roles: [Dealer]
    side_effects: ["status INFO_REQUESTED -> SUBMITTED with info_request_round retained (the loop counter never resets)", "labor_hours and part_lines replaced when supplied and part_line_count recomputed; money is still deferred to approval", "version increments"]
  - method: POST
    path: /warranty-claims/{id}/part-shipment
    purpose: "Ship approved replacement part lines to the dealer, in one or several shipments."
    input: ["line_count?", tracking_number]
    output: "WarrantyClaim"
    success_status: 200
    roles: [SalesAdmin]
    side_effects: ["shipped_line_count += line_count and tracking_number overwritten with the newest shipment", "status -> PARTS_SHIPPED while lines remain, then -> CLOSED once shipped_line_count == part_line_count, crediting Dealer.warranty_receivable_cents by reimbursement_total_cents exactly once and bumping Dealer.version", "version increments"]
  - method: GET
    path: /trailer-models/{id}
