              as: PlatformAdmin
              captures: { site_b: $.data.id }
            - call: "GET /testing-sites/${site_a}"
              payload: {}
              as: PlatformAdmin
              captures: { read_name: $.data.name, read_seats: $.data.seat_count }
            - call: "GET /testing-sites?jurisdiction_id=${jur_a}&limit=10&offset=0"
              payload: {}
              as: PlatformAdmin
              captures: { first_id: "$.data[0].id" }
            - call: "GET /testing-sites?limit=10&offset=0"
