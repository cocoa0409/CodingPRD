      - name: the_dust_settling_buffer_takes_the_larger_of_the_constant_and_the_zone_override
        grounds:
          - calculations.zone_window_conflict_geometry.constants.SETTLING_BUFFER_MIN
          - entities.GalleryZone.fields.dust_settling_buffer_minutes
          - validations.priority_88
        distinguishing_aspect: |
          DUST_GENERATING is the one work class whose settling buffer is not a
          constant: it is max(120, zone.dust_settling_buffer_minutes). The two
          zones below differ only in that field - 240 on Z-A, 60 on Z-B - and the
          identical 08:00-10:00 dust window therefore blocks until 14:00 on one
          zone and until 12:00 on the other. Implementations that always use the
          constant let the 13:45 window through on Z-A; implementations that always
          use the zone field let the 11:45 window through on Z-B. Both refusals are
          engineered to touch the neighbouring approved window rather than overlap
          it, so the only thing that can be colliding is the settling buffer.
