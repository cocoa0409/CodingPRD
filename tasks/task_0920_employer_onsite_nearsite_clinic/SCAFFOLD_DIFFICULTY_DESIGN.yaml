      - name: employer_disclosure_occ_health_conclusion_vs_wellness_participation_only
        grounds:
          - calculations.visit_disclosure_payload
          - state_machines.Visit.RELEASE_PENDING_to_FITNESS_RELEASED
          - state_machines.Visit.RELEASE_PENDING_to_PARTICIPATION_RELEASED
          - endpoints[GET /visits/{visit_id}/employer-disclosure]
        distinguishing_aspect: |
          This dual variant lives on the Visit disclosure domain: the same endpoint returns a populated
          fitness_conclusion for the OCC_HEALTH visit and a null fitness_conclusion with
          participation_recorded true for the WELLNESS visit, so one projection cannot serve both tracks.
        test_recipe:
          setup:
            - "One participant with disclosure authorization GRANTED and two completed visits on the same day, one OCC_HEALTH with fitness_conclusion FIT_WITH_RESTRICTIONS and one WELLNESS."
            - "Both visits released, so their disclosure axes read FITNESS_RELEASED and PARTICIPATION_RELEASED."
