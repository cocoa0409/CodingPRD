              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { lic_id: $.data.id }
            - call: "POST /license-registrations/${lic_id}/activations"
              payload: {}
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { lic_v: $.data.version }
            - call: "POST /license-registrations/${lic_id}/sponsorship-transfers"
