              payload: { tier: "WASH", base_price_cents: 4000, prep_minutes: 10, service_minutes: 30, cure_minutes: 0, guarantee_days: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_FORBIDDEN_ROLE"
            - "response.http_status == 403"

      - name: customer_cannot_act_on_another_customers_appointment
        claim_type: ownership_denied
