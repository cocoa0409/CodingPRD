    side_effects: ["compliance_posture = FROZEN", "Cascades every BOOKED/CONFIRMED appointment at the store to CANCELLED"]

  - method: POST
    path: "/piercing-services/stores/{storeId}/posture/unfreeze"
    description: "Unfreeze a store back to RESTRICTED"
    roles: [ComplianceOfficer]
    code: 200
    input: []
