              captures: { fw_err: $.data.error_id }
          assert:
            - "response status 409 and error_id == ERR_FORECAST_WINDOW_INSUFFICIENT (only 2 closed periods with usage; window_periods default 3)"

  # ===========================================================================
  - section: validations
    instances:

      - name: tier_thresholds_must_be_strictly_increasing_per_family
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_TIER_THRESHOLD_NOT_INCREASING]"]
        distinguishing_aspect: "Adding a tier with threshold equal to an existing threshold for the same (agreement, family) is rejected 422 ERR_TIER_THRESHOLD_NOT_INCREASING; a lower threshold is equally rejected."
        test_recipe:
          setup:
            - "Clock at default. Org; agreement NEGOTIATION with COMPUTE tier threshold 1000."
          setup_api_calls:
            - call: "POST /api/billing-orgs"
              payload: { name: "Ti Org", max_hourly_commitment_cents: 1000, capacity_quota_units: 100 }
              as: PlatformBillingOperator
              captures: { ti_org: $.data.id }
            - call: "POST /api/enterprise-agreements"
              payload: { org_id: "${ti_org}", name: "A", committed_spend_cents: 1000000, term_start: "2026-09-01T00:00:00Z", term_end: "2027-09-01T00:00:00Z" }
              as: OrgAdmin
              captures: { ti_agr: $.data.id }
            - call: "POST /api/discount-tiers"
              payload: { agreement_id: "${ti_agr}", service_family: "COMPUTE", threshold_cents: 1000, rate: 0.10 }
              as: OrgAdmin
          trigger:
            - call: "POST /api/discount-tiers"
              payload: { agreement_id: "${ti_agr}", service_family: "COMPUTE", threshold_cents: 1000, rate: 0.20 }
              as: OrgAdmin
              captures: { ti_err: $.data.error_id }
          assert:
            - "response status 422 and error_id == ERR_TIER_THRESHOLD_NOT_INCREASING"

      - name: duplicate_usage_record_same_account_family_hour_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_DUPLICATE_USAGE_RECORD]"]
        distinguishing_aspect: "Second ingest on the same (linked_account_id, service_family, usage_hour_start) triple is rejected 422 ERR_DUPLICATE_USAGE_RECORD; a different hour is accepted."
        test_recipe:
          setup:
            - "Clock at default. Org; account; one usage record at hour 00."
          setup_api_calls:
            - call: "POST /api/billing-orgs"
              payload: { name: "Du Org", max_hourly_commitment_cents: 1000, capacity_quota_units: 100 }
              as: PlatformBillingOperator
              captures: { du_org: $.data.id }
            - call: "POST /api/linked-accounts"
              payload: { org_id: "${du_org}", name: "a1", external_ref: "e1" }
              as: OrgAdmin
              captures: { du_acct: $.data.id }
            - call: "POST /api/usage-records"
              payload: { linked_account_id: "${du_acct}", service_family: "COMPUTE", usage_hour_start: "2026-09-01T00:00:00Z", list_price_cents: 100 }
              as: LinkedAccountManager
              as_user_id: "${du_acct}"
          trigger:
            - call: "POST /api/usage-records"
              payload: { linked_account_id: "${du_acct}", service_family: "COMPUTE", usage_hour_start: "2026-09-01T00:00:00Z", list_price_cents: 200 }
              as: LinkedAccountManager
              as_user_id: "${du_acct}"
              captures: { du_err: $.data.error_id }
          assert:
            - "response status 422 and error_id == ERR_DUPLICATE_USAGE_RECORD"
            - "the original record keeps list_price_cents == 100"

      - name: settle_amount_mismatch_rejected_fiscal_check
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_SETTLEMENT_AMOUNT_MISMATCH]"]
        distinguishing_aspect: "Settle with amount_cents off by one cent from total_due_cents is rejected 422 ERR_SETTLEMENT_AMOUNT_MISMATCH; exact amount succeeds."
        test_recipe:
          setup:
            - "Clock at default. Org; account; usage 1000; invoice generated and finalized (total_due 1000, no agreement/credits)."
          setup_api_calls:
            - call: "POST /api/billing-orgs"
              payload: { name: "Se Org", max_hourly_commitment_cents: 1000, capacity_quota_units: 100 }
              as: PlatformBillingOperator
              captures: { se_org: $.data.id }
            - call: "POST /api/linked-accounts"
              payload: { org_id: "${se_org}", name: "a1", external_ref: "e1" }
              as: OrgAdmin
              captures: { se_acct: $.data.id }
            - call: "POST /api/usage-records"
              payload: { linked_account_id: "${se_acct}", service_family: "COMPUTE", usage_hour_start: "2026-09-01T00:00:00Z", list_price_cents: 1000 }
              as: LinkedAccountManager
              as_user_id: "${se_acct}"
            - call: "POST /api/invoices/generate"
              payload: { org_id: "${se_org}", period_index: 0 }
              as: OrgAdmin
              captures: { se_inv: $.data.id }
            - call: "POST /api/invoices/${se_inv}/finalize"
              payload: {}
              as: OrgAdmin
          trigger:
            - call: "POST /api/invoices/${se_inv}/settle"
              payload: { amount_cents: 999 }
              as: OrgAdmin
              captures: { se_err: $.data.error_id }
            - call: "POST /api/invoices/${se_inv}/settle"
              payload: { amount_cents: 1000 }
              as: OrgAdmin
              captures: { se_status: $.data.status }
          assert:
            - "settle of 999 -> 422 ERR_SETTLEMENT_AMOUNT_MISMATCH; invoice stays FINALIZED"
            - "settle of exactly 1000 -> 200 status SETTLED"

      - name: invoice_period_already_billed_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_INVOICE_PERIOD_ALREADY_BILLED]"]
        distinguishing_aspect: "Generating a second invoice for the same org and period while the first is non-VOIDED is rejected 422 ERR_INVOICE_PERIOD_ALREADY_BILLED."
        test_recipe:
          setup:
            - "Clock at default. Org; account; usage 100; invoice generated for period 0 (still DRAFT)."
          setup_api_calls:
            - call: "POST /api/billing-orgs"
              payload: { name: "Pb Org", max_hourly_commitment_cents: 1000, capacity_quota_units: 100 }
              as: PlatformBillingOperator
              captures: { pb_org: $.data.id }
            - call: "POST /api/linked-accounts"
              payload: { org_id: "${pb_org}", name: "a1", external_ref: "e1" }
              as: OrgAdmin
              captures: { pb_acct: $.data.id }
            - call: "POST /api/usage-records"
              payload: { linked_account_id: "${pb_acct}", service_family: "COMPUTE", usage_hour_start: "2026-09-01T00:00:00Z", list_price_cents: 100 }
              as: LinkedAccountManager
              as_user_id: "${pb_acct}"
            - call: "POST /api/invoices/generate"
              payload: { org_id: "${pb_org}", period_index: 0 }
              as: OrgAdmin
          trigger:
            - call: "POST /api/invoices/generate"
              payload: { org_id: "${pb_org}", period_index: 0 }
              as: OrgAdmin
              captures: { pb_err: $.data.error_id }
          assert:
            - "response status 422 and error_id == ERR_INVOICE_PERIOD_ALREADY_BILLED"

      - name: second_active_agreement_per_org_rejected
        claim_type: violation_to_error
        grounds: [state_machines.EnterpriseAgreement, "errors[ERR_ORG_HAS_ACTIVE_AGREEMENT]"]
        distinguishing_aspect: "Activating a second agreement while the org already has an ACTIVE one is rejected 409 ERR_ORG_HAS_ACTIVE_AGREEMENT — the org-level singleton selector stays deterministic."
        test_recipe:
          setup:
            - "Clock at default. Org; agreement A ACTIVE with tier; agreement B NEGOTIATION with tier."
          setup_api_calls:
            - call: "POST /api/billing-orgs"
              payload: { name: "Sg Org", max_hourly_commitment_cents: 1000, capacity_quota_units: 100 }
              as: PlatformBillingOperator
              captures: { sg_org: $.data.id }
            - call: "POST /api/enterprise-agreements"
              payload: { org_id: "${sg_org}", name: "A", committed_spend_cents: 1000000, term_start: "2026-09-01T00:00:00Z", term_end: "2027-09-01T00:00:00Z" }
              as: OrgAdmin
              captures: { sg_a: $.data.id }
            - call: "POST /api/discount-tiers"
              payload: { agreement_id: "${sg_a}", service_family: "COMPUTE", threshold_cents: 0, rate: 0.10 }
              as: OrgAdmin
            - call: "POST /api/enterprise-agreements"
              payload: { org_id: "${sg_org}", name: "B", committed_spend_cents: 500000, term_start: "2026-09-01T00:00:00Z", term_end: "2027-09-01T00:00:00Z" }
              as: OrgAdmin
              captures: { sg_b: $.data.id }
            - call: "POST /api/discount-tiers"
              payload: { agreement_id: "${sg_b}", service_family: "COMPUTE", threshold_cents: 0, rate: 0.15 }
              as: OrgAdmin
            - call: "POST /api/enterprise-agreements/${sg_a}/activate"
              payload: {}
              as: OrgAdmin
          trigger:
            - call: "POST /api/enterprise-agreements/${sg_b}/activate"
              payload: {}
              as: OrgAdmin
              captures: { sg_err: $.data.error_id }
          assert:
            - "response status 409 and error_id == ERR_ORG_HAS_ACTIVE_AGREEMENT"
            - "agreement B remains NEGOTIATION"

      - name: commitment_ceiling_boundary_exactly_at_cap_succeeds
        claim_type: satisfaction_pass
        grounds: ["validations[priority=9]", "errors[ERR_COMMITMENT_CEILING_EXCEEDED]"]
        distinguishing_aspect: "Ceiling check is > not >=: plans summing exactly to max_hourly_commitment_cents are accepted; one cent over is rejected 422."
        test_recipe:
          setup:
            - "Clock at default. Org ceiling 150; agreement ACTIVE with tier; plan p1 hourly 100 ACTIVE."
          setup_api_calls:
            - call: "POST /api/billing-orgs"
              payload: { name: "Ce Org", max_hourly_commitment_cents: 150, capacity_quota_units: 100 }
              as: PlatformBillingOperator
              captures: { ce_org: $.data.id }
            - call: "POST /api/enterprise-agreements"
              payload: { org_id: "${ce_org}", name: "A", committed_spend_cents: 1000000, term_start: "2026-09-01T00:00:00Z", term_end: "2027-09-01T00:00:00Z" }
              as: OrgAdmin
              captures: { ce_agr: $.data.id }
            - call: "POST /api/discount-tiers"
              payload: { agreement_id: "${ce_agr}", service_family: "COMPUTE", threshold_cents: 0, rate: 0.10 }
              as: OrgAdmin
            - call: "POST /api/enterprise-agreements/${ce_agr}/activate"
              payload: {}
              as: OrgAdmin
            - call: "POST /api/commitment-plans"
              payload: { org_id: "${ce_org}", agreement_id: "${ce_agr}", type: "SAVINGS_PLAN", instance_family: "COMPUTE", units: 0, hourly_commitment_cents: 100, plan_discount_rate: 0.30, term_start: "2026-09-01T00:00:00Z", term_end: "2026-10-01T00:00:00Z" }
              as: OrgAdmin
          trigger:
            - call: "POST /api/commitment-plans"
              payload: { org_id: "${ce_org}", agreement_id: "${ce_agr}", type: "SAVINGS_PLAN", instance_family: "STORAGE", units: 0, hourly_commitment_cents: 50, plan_discount_rate: 0.30, term_start: "2026-09-01T00:00:00Z", term_end: "2026-10-01T00:00:00Z" }
              as: OrgAdmin
              captures: { ce_p2: $.data.id }
            - call: "POST /api/commitment-plans"
              payload: { org_id: "${ce_org}", agreement_id: "${ce_agr}", type: "SAVINGS_PLAN", instance_family: "DATABASE", units: 0, hourly_commitment_cents: 1, plan_discount_rate: 0.30, term_start: "2026-09-01T00:00:00Z", term_end: "2026-10-01T00:00:00Z" }
              as: OrgAdmin
              captures: { ce_err: $.data.error_id }
          assert:
            - "second plan (sum 100+50 == 150, exactly at ceiling) succeeds with 201"
            - "third plan (sum 151 > 150) rejected 422 ERR_COMMITMENT_CEILING_EXCEEDED"

      - name: trueup_assess_before_term_end_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_TERM_NOT_ENDED]"]
        distinguishing_aspect: "Assessing SHORTFALL while the agreement is still ACTIVE (term not ended) is rejected 409 ERR_TERM_NOT_ENDED — the term-end gate precedes any computation."
        test_recipe:
          setup:
            - "Clock at default (inside term). Org; agreement ACTIVE with tier."
          setup_api_calls:
            - call: "POST /api/billing-orgs"
              payload: { name: "Tu Org", max_hourly_commitment_cents: 1000, capacity_quota_units: 100 }
              as: PlatformBillingOperator
