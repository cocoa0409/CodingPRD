  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: ppv_state_agreement_not_active_wins_over_business_constraint_solids_minimum
        grounds:
          - "validations[priority=100]"
          - "validations[priority=140]"
          - errors.ERR_AGREEMENT_NOT_ACTIVE
          - errors.ERR_SOLIDS_BELOW_MINIMUM
        distinguishing_aspect: |
          A booking that violates BOTH the state check at priority 100 (agreement still
          DRAFT) and the business_constraint check at priority 140 (5.0 percent solids
          against an 8.0 percent floor) must answer ERR_AGREEMENT_NOT_ACTIVE with HTTP 409,
          never ERR_SOLIDS_BELOW_MINIMUM with 422; the paired control booking on an ACTIVE
          agreement with the same 5.0 percent solids proves the lower-priority rule is live.
        test_recipe:
          setup:
            - "One facility with hydraulic_capacity_tonnes_per_day 500.000."
            - "Agreement A1 for dairy1 is left in DRAFT and never offered; minimum_total_solids_pct 8.0."
            - "Agreement A2 for dairy2 is offered and signed so it is ACTIVE; minimum_total_solids_pct is also 8.0."
            - "One OPEN operations day 2026-08-03 inside both agreement terms."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
