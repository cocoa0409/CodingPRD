  # Rule 8 — resource temporal-overlap conflicts across DIFFERENT interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: postal_code_live_set_overlap_on_territory_creation
        grounds:
          - state_machines.Territory.DEFINED_to_OFFERED
          - entities.Territory.fields.postal_codes
          - errors.ERR_TERRITORY_POSTAL_OVERLAP
          - validations[priority=9]
        distinguishing_aspect: "Interval semantics: EXACT MEMBERSHIP over a live set with a zero-width boundary — a single shared postal code collides, and there is no buffer zone, so adjacency of numeric codes such as 75002 and 75003 means nothing."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Brand MS exists. Franchisee Mosaic Central LLC holds territory MS-01 with postal_codes [75001, 75002], status ACTIVE."
          setup_api_calls:
            - *c_clock
            - *c_ms_brand
            - *c_fr_ms
            - &ro_ter1
              call: "POST /franchise/territories"
              payload: { territory_code: "MS-01", brand_id: "${ms_brand_id}", household_count: 30000, postal_codes: ["75001", "75002"], expansion_right_households: 40000, protected: true, franchisee_id: "${fr_ms_id}" }
              as: FranchiseAdmin
              captures: { ter1_id: $.data.id }
            - &ro_agt1
              call: "POST /franchise/agreements"
              payload: { agreement_number: "A-MS-01", franchisee_id: "${fr_ms_id}", brand_id: "${ms_brand_id}", territory_id: "${ter1_id}", signed_on: "2026-09-01T00:00:00Z", initial_term_months: 120, certification_level: "JOURNEYMAN" }
              as: FranchiseAdmin
              captures: { agt1_id: $.data.id }
            - call: "POST /franchise/territories/${ter1_id}/offer"
              payload: { franchisee_id: "${fr_ms_id}" }
              as: FranchiseAdmin
            - call: "GET /franchise/territories/${ter1_id}"
              payload: {}
              as: FranchiseAdmin
              captures: { ter1_v: $.data.version }
            - call: "POST /franchise/territories/${ter1_id}/award"
              payload: { expected_territory_version: "${ter1_v}" }
              as: FranchiseAdmin
            - call: "POST /franchise/agreements/${agt1_id}/offer"
              payload: {}
              as: FranchiseAdmin
            - call: "POST /franchise/agreements/${agt1_id}/activate"
              payload: {}
              as: FranchiseAdmin
          trigger:
            - call: "POST /franchise/territories"
              payload: { territory_code: "MS-02", brand_id: "${ms_brand_id}", household_count: 12000, postal_codes: ["75002", "75009"], expansion_right_households: 20000, protected: true }
              as: FranchiseAdmin
              captures: { overlap_error: $.data.error_id }
            - call: "POST /franchise/territories"
              payload: { territory_code: "MS-03", brand_id: "${ms_brand_id}", household_count: 12000, postal_codes: ["75009", "75010"], expansion_right_households: 20000, protected: true }
              as: FranchiseAdmin
              captures: { clean_id: $.data.id }
          assert:
            - "the overlapping create returns 409 with overlap_error == ERR_TERRITORY_POSTAL_OVERLAP"
            - "the shared code is exactly one member of the set: [75002, 75009] intersects the live set [75001, 75002]"
            - "the clean create returns 201 and Territory.${clean_id}.postal_codes == [\"75009\", \"75010\"]"
            - "GET /franchise/territories?brand_id=${ms_brand_id}&status=DEFINED returns exactly 1 row"
            - "the live set is unchanged: GET /franchise/territories/${ter1_id} still reports postal_codes [\"75001\", \"75002\"]"

      - name: statement_period_half_open_overlap_on_posting
        grounds:
          - errors.ERR_STATEMENT_PERIOD_OVERLAP
          - entities.RoyaltyStatement.fields.period_start
          - entities.RoyaltyStatement.fields.period_end
          - validations[priority=11]
        distinguishing_aspect: "Interval semantics on a different resource: HALF-OPEN [period_start, period_end), so adjacency at a shared endpoint is legal while any genuine interior collision is refused, and a voided statement leaves the window free again."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Agreement A1 on brand MS, ACTIVE, with royalty_rate_override 0.06."
          setup_api_calls:
            - *c_clock
            - *c_ms_brand
            - *c_fr_ms
            - *c_ter_ms
            - *c_agt_a1
            - *c_off_ms
            - call: "GET /franchise/territories/${ter_ms_id}"
              payload: {}
              as: FranchiseAdmin
              captures: { ter_ms_v: $.data.version }
            - call: "POST /franchise/territories/${ter_ms_id}/award"
              payload: { expected_territory_version: "${ter_ms_v}" }
              as: FranchiseAdmin
            - *c_off_a1
            - call: "POST /franchise/agreements/${agt_a1_id}/activate"
              payload: {}
              as: FranchiseAdmin
          trigger:
            - call: "POST /franchise/royalty-statements"
              payload: { agreement_id: "${agt_a1_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-15T00:00:00Z", gross_revenue_cents: 500000 }
              as: FranchiseAdmin
              captures: { st1_id: $.data.id }
            - call: "POST /franchise/royalty-statements"
              payload: { agreement_id: "${agt_a1_id}", period_start: "2026-09-15T00:00:00Z", period_end: "2026-10-01T00:00:00Z", gross_revenue_cents: 500000 }
              as: FranchiseAdmin
              captures: { st2_id: $.data.id }
            - call: "POST /franchise/royalty-statements"
              payload: { agreement_id: "${agt_a1_id}", period_start: "2026-09-10T00:00:00Z", period_end: "2026-09-20T00:00:00Z", gross_revenue_cents: 100000 }
              as: FranchiseAdmin
              captures: { overlap_error: $.data.error_id }
          assert:
            - "the first posting returns 201 with period [2026-09-01, 2026-09-15)"
            - "the adjacent posting returns 201 — [2026-09-15, 2026-10-01) shares no interior with the first because the window is half-open"
            - "the interior-colliding posting returns 422 with overlap_error == ERR_STATEMENT_PERIOD_OVERLAP"
            - "GET /franchise/royalty-statements?agreement_id=${agt_a1_id} returns exactly 2 rows"
            - "after POST /franchise/royalty-statements/${st1_id}/issue and then /void, a posting of [2026-09-01, 2026-09-15) returns 201 because a VOIDED statement no longer reserves its window"

  # ===========================================================================
  # Rule 9 — compensating-action invariants across DIFFERENT conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: lead_allocate_and_release_conserve_cost_balance
        grounds:
          - state_machines.Lead.RECEIVED_to_ALLOCATED
          - state_machines.Lead.ALLOCATED_to_RELEASED
          - entities.Franchisee.fields.lead_cost_balance_cents
          - calculations.lead_cost_calculation
        distinguishing_aspect: "Conserved quantity: a cents-denominated SPEND BALANCE. lead_cost_balance_cents is pinned as (sum of lead_cost_cents over ALLOCATED leads) - (sum over released leads), and the allocate-then-release pair returns it exactly to its starting value."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Franchisee Mosaic Central LLC is enrolled in shared services and holds TWO agreements, A1 on brand MS and A2 on brand IL, so active_brand_count is 2 and the multi-brand discount applies."
            - "Lead L1 for brand MS, source CALL_CENTER, band BAND_2, estimated_value_cents 150000, status RECEIVED."
            - "Franchisee.lead_cost_balance_cents is 0 before allocation."
          setup_api_calls:
            - *c_clock
            - *c_ms_brand
            - *c_il_brand
            - *c_fr_ms
            - *c_ter_ms
            - call: "POST /franchise/territories"
              payload: { territory_code: "IL-01", brand_id: "${il_brand_id}", household_count: 30000, postal_codes: ["77001", "77002"], expansion_right_households: 40000, protected: true, franchisee_id: "${fr_ms_id}" }
