              payload: {}
              as: InventorySupervisor
              as_user_id: "u_super_1"
          assert:
            - "the setup pause returned 200 with data.status \"PAUSED\""
            - "response status 200, data.status == \"ACTIVE\", data.next_due_date == \"2026-08-01\" and data.completed_cycle_count == 0"
            - "a second resume returns 409 ERR_COUNT_SCHEDULE_NOT_ACTIVE, and so does a second pause once paused"
            - "a count task opened after the resume succeeds, where the same request against the paused schedule returned ERR_COUNT_SCHEDULE_NOT_ACTIVE"

      - name: adjustment_investigation_link_requires_an_existing_investigation
