  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: inventory_reserve_release_conserved
        grounds:
          - state_machines.Order.DRAFT_to_PLACED
          - state_machines.Order.PLACED_to_CANCELLED
          - calculations.sku_reserved_count
          - entities.SKU.fields.available_units
        distinguishing_aspect: "Conserved quantity SKU.available_units (physical inventory units): place reserves 2 (5->3) and the compensating cancel releases them (3->5), leaving stock_on_hand and available_units unchanged from before place."
        test_recipe:
          setup:
            - "A SKU with initial_stock 5; an order with one line of quantity 2 placed (available 3)."
          setup_api_calls:
            - call: "POST /boutique/customers"
              payload: { full_name: "Val Inv", email: "val.inv@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id }
