        grounds:
          - roles.CreditVerifier.shared_operations
          - roles.FinanceController.shared_operations
          - endpoints[GET /credit-pathways/{id}/credit-ledger]
          - endpoints[GET /facilities/{id}/financial-summary]
        distinguishing_aspect: >
          The two computed reads are not symmetric: the verifier may read the credit
          ledger but is forbidden the money view, while FinanceController may read both -
          so a single role cannot be assumed to see every derived read.
        test_recipe:
          setup:
            - "Canonical plant with one PROVISIONAL LCFS pathway and no batches."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
