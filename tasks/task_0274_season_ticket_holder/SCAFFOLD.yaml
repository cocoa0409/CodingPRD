scenario: "274. Season Ticket Holder Management: seat/section inventory, full/partial-season plans, renewal & price changes, seat relocation/upgrade, payment plan, ticket forwarding/resale, playoff/priority points, parking add-on"
domain_name: "season-ticket-holder"
api_prefix: "/"

complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Pricing engine"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  # Peer collections (Section, Account, SeasonPlan, Subscription, ...) linked by
  # FK fields in bodies; no nested ownership URLs. Sub-resource GETs are reverse
  # lookups, not ownership chains.

  state_machine_shape: cyclic
  # Subscription cycles (ACTIVE <-> RELOCATING, ACTIVE <-> RENEWAL_OFFERED);
  # TicketTransfer branches (PENDING -> {FORWARDED, LISTED} -> SOLD).

  relationship_patterns:
    - one_to_many        # Section->Seat, Subscription->SeatAssignment, PaymentPlan->Installment
    - many_to_many       # Subscription<->Seat via SeatAssignment junction
    - cross_aggregate    # ParkingAddOn references Subscription and ParkingZone across aggregates

  role_model: peer_roles
  # AccountHolder owns Account/Subscription resources; BoxOfficeAgent operates
  # inventory + administrative price changes; FinanceClerk owns payment plans /
  # refunds. Non-overlapping resource ownership with a few shared reads.

  consistency_model: immediate
  # All seat releases, refunds, points clawbacks, and derived-counter updates are
  # atomic within the triggering request.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Section
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no type prefix. Identity only."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "Refreshed on every mutation including cascaded side effects."
      - name: version
        type: integer
        source: system
        description: "Starts at 1, increments by 1 on every mutation."
      - name: name
        type: string
        source: input
        description: "Human-readable section label, e.g. 'Lower Bowl 101'."
      - name: tier
        type: enum
        source: input
        description: "Price tier band of this section."
        constraints: "one of {PREMIUM, STANDARD, VALUE}"
      - name: base_price_cents
        type: integer
        source: input
        description: "Full-season list price per seat in this section, in integer cents."
        constraints: ">= 0"
      - name: total_seats
        type: integer
        source: computed
        description: "Count of Seat rows whose section_id == this Section.id (any status)."
      - name: available_seats
        type: integer
        source: computed
        description: "Count of Seat rows whose section_id == this Section.id AND status == AVAILABLE. Derived field reconciled on every Seat status change."

  - name: Seat
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no type prefix. Identity only."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "Refreshed on every mutation including cascaded side effects."
      - name: version
        type: integer
        source: system
        description: "Starts at 1, increments by 1 on every mutation."
      - name: section_id
        type: string
        source: input
        description: "FK -> Section.id; the section this seat belongs to."
      - name: row_label
        type: string
        source: input
        description: "Row identifier within the section, e.g. 'A'."
      - name: seat_number
        type: integer
        source: input
        description: "Seat number within the row."
        constraints: ">= 1"
      - name: season_start_date
        type: datetime
        source: input
        description: "Inclusive start (ISO 8601 UTC) of the season window this seat is sold for."
      - name: season_end_date
        type: datetime
        source: input
        description: "Inclusive end (ISO 8601 UTC) of the season window this seat is sold for."
      - name: status
        type: enum
        source: system
        description: "Allocation status of the seat."
        default: AVAILABLE
        constraints: "one of {AVAILABLE, SOLD}"

  - name: Account
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no type prefix. Identity only."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "Refreshed on every mutation including cascaded side effects."
      - name: version
        type: integer
        source: system
        description: "Starts at 1, increments by 1 on every mutation."
      - name: full_name
        type: string
        source: input
        description: "Account holder display name."
      - name: email
        type: string
        source: input
        description: "Contact email; unique across Accounts."
        constraints: "unique"
      - name: consecutive_seasons
        type: integer
        source: input
        description: "Number of prior consecutive seasons held; drives tenure points and may be adjusted by the box office."
        default: 0
        constraints: ">= 0"
      - name: priority_points
        type: integer
        source: system
        description: "Running priority/loyalty points balance. Mutated by accrual on subscription activation/renewal and clawed back on cancellation."
        default: 0
      - name: loyalty_tier
        type: enum
        source: computed
        description: "Derived from priority_points: BRONZE if priority_points < 500, SILVER if 500 <= priority_points < 1000, GOLD if priority_points >= 1000."
        constraints: "one of {BRONZE, SILVER, GOLD}"
      - name: status
        type: enum
        source: system
        description: "Account standing."
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"

  - name: SeasonPlan
    parent: null
    common_fields: true
    fields:
