            - { call: "POST /lab/orders", payload: { customer_id: "${cust_id}", warehouse_id: "${wh_id}", shipping_service: "EXPRESS", requested_ship_date: "2026-05-10", lines: [ { product_id: "${prod_id}", quantity: 2, fulfillment_mode: "ANY" } ] }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: "$.data.id" } }
            - { call: "POST /lab/orders/${order_id}/submit", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /lab/shipments", payload: { order_id: "${order_id}", coolant_type: "DRY_ICE", coolant_units: 2, declared_weight_grams: 3000 }, as: InventoryClerk, captures: { ship_id: "$.data.id" } }
            - { call: "POST /lab/shipments/${ship_id}/pack", payload: {}, as: InventoryClerk }
            - { call: "POST /lab/shipments/${ship_id}/dispatch", payload: { actual_weight_grams: 3000 }, as: InventoryClerk }
