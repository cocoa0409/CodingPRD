            - "Booking.${bk_id}.status == CANCELLED"

      - name: hobbs_meter_conservation_post_advances_exactly
        grounds:
          - calculations.hobbs_meter_conservation
          - entities.Aircraft.fields.current_hobbs
          - state_machines.FlightLog.DRAFT_to_POSTED
        distinguishing_aspect: |
          Different conserved quantity = aircraft Hobbs hours (physical, not money).
          Posting a flight log advances current_hobbs by exactly the logged delta:
          initial 100.0 + (101.7-100.0) == 101.7, satisfying
          current_hobbs == initial_hobbs + sum(POSTED hobbs deltas) with no drift.
        test_recipe:
          setup:
            - "Aircraft initial_hobbs 100.0, initial_tach 200.0; a dispatched DUAL booking; DRAFT flight log hobbs 100.0->101.7, tach 200.0->201.4."
          setup_api_calls:
            - call: "POST /flight-school/students"
              payload: { full_name: "Mel Meter", email: "mel@x.com" }
              as: SchoolAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /flight-school/students/${stu_id}/deposits"
              payload: { amount_cents: 100000 }
              as: SchoolAdmin
            - call: "POST /flight-school/syllabi"
              payload: { name: "PRIVATE_PILOT", required_dual_hours: 40, required_solo_hours: 10, stage_count: 3, min_deposit_cents: 50000 }
              as: SchoolAdmin
              captures: { syl_id: $.data.id }
            - call: "POST /flight-school/instructors"
              payload: { full_name: "Iris CFI", email: "iris@x.com", cfi_rate_cents_per_hour: 6000, authorized_endorsement_codes: ["SOLO"] }
              as: SchoolAdmin
              captures: { instr_id: $.data.id }
            - call: "POST /flight-school/aircraft"
              payload: { tail_number: "NXMTR", model: "C172", rental_rate_cents_per_hour: 15000, billing_basis: "HOBBS", initial_hobbs: 100.0, initial_tach: 200.0 }
              as: SchoolAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /flight-school/enrollments"
              payload: { student_id: "${stu_id}", syllabus_id: "${syl_id}" }
              as: SchoolAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /flight-school/enrollments/${enr_id}/clearance"
              payload: { clearance_type: "MEDICAL", decision: "CLEARED", medical_expiry_date: "2027-06-14T00:00:00.000Z" }
              as: SchoolAdmin
            - call: "POST /flight-school/enrollments/${enr_id}/clearance"
              payload: { clearance_type: "TSA", decision: "CLEARED" }
              as: SchoolAdmin
            - call: "POST /flight-school/enrollments/${enr_id}/activate"
              payload: {}
              as: SchoolAdmin
            - call: "GET /flight-school/aircraft/${ac_id}"
              payload: {}
              as: Dispatcher
              captures: { acv_ac_id_23: $.data.version }
            - call: "POST /flight-school/bookings"
              payload: { enrollment_id: "${enr_id}", aircraft_id: "${ac_id}", instructor_id: "${instr_id}", lesson_type: "DUAL", start_at: "2026-07-01T14:00:00.000Z", end_at: "2026-07-01T16:00:00.000Z", estimated_hours: 2.0, expected_aircraft_version: "${acv_ac_id_23}" }
              as: Dispatcher
              captures: { bk_id: $.data.id }
            - call: "POST /flight-school/bookings/${bk_id}/confirm"
              payload: {}
              as: Dispatcher
            - call: "POST /flight-school/bookings/${bk_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /flight-school/flight-logs"
              payload: { booking_id: "${bk_id}", hobbs_start: 100.0, hobbs_end: 101.7, tach_start: 200.0, tach_end: 201.4, landings: 1 }
              as: Instructor
              as_user_id: "${instr_id}"
              captures: { fl_id: $.data.id }
          trigger:
            - call: "POST /flight-school/flight-logs/${fl_id}/post"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
          assert:
            - "Aircraft.${ac_id}.current_hobbs == 101.7"
            - "Aircraft.${ac_id}.current_tach == 201.4"
            - "FlightLog.${fl_id}.status == POSTED and billed_hours == 1.7"
