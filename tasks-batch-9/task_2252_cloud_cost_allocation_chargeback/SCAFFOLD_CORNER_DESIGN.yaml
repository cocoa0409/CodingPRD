                as: PlatformAdmin
                as_user_id: "admin-1"
                captures: { cr_id: "$.data.id" }
              - call: "POST /finops/allocation-runs"
                payload: { mode: "CHARGEBACK", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
