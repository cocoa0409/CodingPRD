          assert:
            - "ROOT: DistributionDeal.${deal_id}.status == TERMINATION_NOTICE, termination_effective_date == 2026-08-01, post_term_collection_end_date == 2026-10-30"
            - "HOP 1: Release.${rel1_id}.status == REVERSION_PENDING with reversion_eligible_date == 2026-10-30, and Release.${rel2_id}.status == REVERTED (the PLANNED release skips straight to reversion)"
            - "HOP 2 (caused by hop 1): ArtistAgreement.${agr1_id}.status == POST_TERM with post_term_collection_end_date == 2026-10-30, and ArtistAgreement.${agr2_id}.status == POST_TERM"
            - "HOP 3 (caused by hop 2): ArtistStatement.${stmt_prepared_id}.status == VOIDED and ArtistStatement.${stmt_draft_id}.status == VOIDED"
            - "hop 3 reached both statements only via hop 2: an implementation that voided statements by deal_id alone would be indistinguishable here, so also assert that ArtistStatement.${stmt_prepared_id}.net_payable_cents is unchanged from its PREPARED value — voiding must not recompute figures"
            - "Distributor.${dist_id}.active_deal_count == 0 after the termination"

      - name: accept_cascades_lines_to_release_to_deal_to_recoupment_to_royalty_rate
        grounds:
          - state_machines.DspRevenueReport.SUBMITTED_to_ACCEPTED
          - calculations.advance_recoupment_waterfall
          - calculations.artist_royalty_rate_selection
          - entities.DspRevenueLine.fields.net_receipts_cents
          - entities.Release.fields.release_advance_recouped_cents
          - entities.DistributionDeal.fields.recoupment_status
          - entities.ArtistAgreement.fields.active_royalty_rate_pct
        distinguishing_aspect: |
          Depth-5 chain rooted at report ACCEPTANCE, one hop deeper than the termination instance and
          through an entirely different entity path: line allocation (hop 1) -> release and deal ledgers
          (hop 2) -> advance waterfall (hop 3) -> recoupment_status flip (hop 4) -> escalated royalty
          rate on the agreement (hop 5). Hop 5 is only reachable because hop 3 drove
          unrecouped_advance_cents to exactly 0; with advance_amount_cents 50001 the chain would stop at
          hop 3.
