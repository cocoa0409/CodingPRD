  - section: errors
    instances:
      - name: triggerable_the_four_remaining_not_found_codes
        claim_type: triggerable
        grounds:
          - errors.ERR_DECON_ORDER_NOT_FOUND
          - errors.ERR_QUARANTINE_ORDER_NOT_FOUND
          - errors.ERR_DETECTION_REPORT_NOT_FOUND
          - errors.ERR_CAMPAIGN_NOT_FOUND
          - response_envelope.error
        distinguishing_aspect: "Closes the §1.6 coverage audit: the four workflow entities whose 404 codes no other corner or depth instance reaches each return their OWN code - never a generic ERR_INSPECTION_RECORD_NOT_FOUND and never a 200 with a null body - and the path lookup precedes any state check, so an action endpoint on a missing id is a 404 rather than a 409."
        test_recipe:
          setup:
            - "Empty database - no decon order, quarantine order, detection report or campaign has ever been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /decon-orders/00000000-0000-0000-0000-0000000000d1"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns 404 with error_id ERR_DECON_ORDER_NOT_FOUND and an envelope carrying error_id and message, with no entity fields"
            - "GET /quarantine-orders/00000000-0000-0000-0000-0000000000a1 returns 404 ERR_QUARANTINE_ORDER_NOT_FOUND"
            - "GET /detection-reports/00000000-0000-0000-0000-0000000000b1 returns 404 ERR_DETECTION_REPORT_NOT_FOUND"
            - "GET /education-campaigns/00000000-0000-0000-0000-0000000000c1 returns 404 ERR_CAMPAIGN_NOT_FOUND"
            - "POST /education-campaigns/00000000-0000-0000-0000-0000000000c1/status with target_status LAUNCHED as ProgramAdmin returns 404 ERR_CAMPAIGN_NOT_FOUND, not 409 ERR_INVALID_CAMPAIGN_STATE - existence is settled before state"
            - "POST /decon-orders/00000000-0000-0000-0000-0000000000d1/dry-verification with outcome VERIFIED returns 404 ERR_DECON_ORDER_NOT_FOUND, not 409 ERR_DECON_NOT_TREATED"
            - "GET /decon-orders, GET /quarantine-orders, GET /detection-reports and GET /education-campaigns each return 200 with meta.total_count == 0, confirming the store really is empty and the 404s are the not-found path"

      - name: triggerable_unauthenticated_covers_missing_empty_and_unknown_role
        claim_type: triggerable
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations.priority_1
        distinguishing_aspect: "The 401 code has four distinct triggers that must not be confused with the 403 codes: no X-User-Role header at all, an empty-string role, a role of a single space, and a syntactically fine but undeclared role string such as Auditor - all 401 ERR_UNAUTHENTICATED, never 403 ERR_UNAUTHORIZED, and the same for a missing X-User-ID."
        test_recipe:
          setup:
            - "One water body exists, so the read being attempted would otherwise succeed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /water-bodies"
              payload: { name: "Flathead Lake", state_code: "MT", water_body_class: "LAKE", risk_tier: "HIGH" }
              as: ProgramAdmin
              captures: { wb_id: $.data.id }
          trigger:
            - call: "GET /water-bodies/${wb_id}"
              payload: {}
              as: NO_ROLE_HEADER_AT_ALL
              captures: { err: $.data.error_id }
          assert:
            - "the trigger, sent with no X-User-Role header at all, returns 401 with error_id ERR_UNAUTHENTICATED"
            - "control: X-User-Role sent as the empty string \"\" returns 401 ERR_UNAUTHENTICATED"
            - "control: X-User-Role sent as a single space \" \" returns 401 ERR_UNAUTHENTICATED - whitespace-only is not a role"
            - "control: X-User-Role Auditor, a well-formed but undeclared role, returns 401 ERR_UNAUTHENTICATED and NOT 403 ERR_UNAUTHORIZED, because 403 is reserved for a real role attempting an endpoint outside its matrix row"
            - "control: X-User-Role ProgramAdmin with X-User-ID omitted returns 401 ERR_UNAUTHENTICATED even though the role is opaque - the identity header is mandatory for every caller"
            - "control: the same GET with X-User-Role ProgramAdmin and any non-empty X-User-ID returns 200 with data.id == ${wb_id}, so the resource itself was always readable"

