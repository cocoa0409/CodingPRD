          - state_machines.Account.transitions.UNDER_HOLD_to_ACTIVE
        distinguishing_aspect: "Withdrawing an S2 incident from INVESTIGATING both seals the incident and returns the account to ACTIVE, and no enforcement action is produced — a legal but unusual escape from the hold posture."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. R1 policy with sd_floor_severity S3. One ACTIVE driver account with one S2 incident raised to S3 by an aggravator and then held."
