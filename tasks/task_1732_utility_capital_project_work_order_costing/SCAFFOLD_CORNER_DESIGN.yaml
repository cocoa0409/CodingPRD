            - "RateAnalyst catalog create: ${e5} == ERR_FORBIDDEN"

      - name: auditor_read_access_allowed
        claim_type: role_allowed
        grounds: ["endpoints[GET /ucp/capital-programs/{program_id}]"]
        distinguishing_aspect: "The read-only Auditor role may perform every GET (shared read operations) — proven by a 200 on a single-resource read."
