# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# task_1157 Water Meter Replacement Capital Program
# Breadth enumeration per references/claim-extraction-guide.md taxonomy.
# Instance names are unique across this file AND SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: program_create_defaults_and_system_fields
        claim_type: creation_defaults_system_fields
        grounds: ["entities.Program"]
        distinguishing_aspect: "A newly created program starts PLANNING with zeroed budget counters, FUNDED posture, notice_days default 3, version 1, and server-stamped id/created_at/updated_at."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AMI-2027", fiscal_year: "FY2027", budget_total_cents: 1000000, target_meter_count: 100, rate_per_ccf_cents: 450, default_unit_allowance_cents: 20000 }, as: ProgramManager, captures: { prog: $.data.id } }
          trigger:
            - { call: "GET /api/programs/${prog}", payload: {}, as: ProgramManager }
          assert:
            - "status == PLANNING (initial state)"
            - "budget_committed_cents == 0 and budget_spent_cents == 0"
            - "budget_available_cents == 1000000 and budget_posture == FUNDED"
            - "notice_days == 3 (default applied when omitted)"
            - "completed_meter_count == 0; version == 1; id is a server UUID; created_at/updated_at stamped"

      - name: account_priority_tier_default
        claim_type: defaults
        grounds: ["entities.ServiceAccount.fields.priority_tier"]
        distinguishing_aspect: "Omitting priority_tier on account creation yields STANDARD."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { account_number: "A-0001", service_address: "1 Test Way", meter_location: "INSIDE", customer_name: "Te", customer_phone: "555-0001", avg_daily_usage_ccf: 1.5, last_billed_read_value: 500, last_billed_read_at: "2026-04-01T00:00:00Z" }, as: Scheduler, captures: { acct: $.data.id } }
          trigger:
            - { call: "GET /api/accounts/${acct}", payload: {}, as: Scheduler }
          assert:
            - "priority_tier == STANDARD (default)"
            - "status == ELIGIBLE (initial state)"

      - name: program_create_computed_input_ignored
        claim_type: computed_fields
        grounds: ["entities.Program.fields.budget_committed_cents"]
        distinguishing_aspect: "Client-supplied values for computed fields are ignored: posting budget_committed_cents: 999999 still yields 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/programs", payload: { name: "AMI-2027", fiscal_year: "FY2027", budget_total_cents: 1000000, target_meter_count: 100, rate_per_ccf_cents: 450, default_unit_allowance_cents: 20000, budget_committed_cents: 999999 }, as: ProgramManager }
          assert:
            - "response budget_committed_cents == 0 (client input for computed field ignored)"
            - "budget_available_cents == 1000000"

      - name: work_order_get_not_found_returns_error_envelope
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "response_envelope"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns 404 ERR_NOT_FOUND in the fixed error envelope (response_type error, data.error_id, data.message, meta.api_request_id)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/work-orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: Scheduler, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 404 and error_id == ERR_NOT_FOUND"
            - "envelope: response_type == 'error'; data.message present; meta.api_request_id present"

      - name: meter_reading_immutable_and_filtered_by_meter
        claim_type: immutability
        grounds: ["entities.MeterReading"]
        distinguishing_aspect: "MeterReading is append-only (common_fields false): the create response carries id + created_at but no version/updated_at, and no update/delete endpoint exists; FK reverse-reachability via GET /api/readings?meter_id= works."
        test_recipe:
          setup: ["program ACTIVE; wave OPEN; account with legacy meter; work order created"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AMI-2027", fiscal_year: "FY2027", budget_total_cents: 1000000, target_meter_count: 100, rate_per_ccf_cents: 450, default_unit_allowance_cents: 20000 }, as: ProgramManager, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: ProgramManager }
            - { call: "POST /api/waves", payload: { program_id: "${prog}", wave_number: 1, window_start: "2026-05-01T00:00:00Z", window_end: "2026-06-01T00:00:00Z", capacity: 10 }, as: ProgramManager, captures: { wave: $.data.id } }
            - { call: "POST /api/waves/${wave}/open", payload: {}, as: ProgramManager }
            - { call: "POST /api/accounts", payload: { account_number: "A-0002", service_address: "2 Test Way", meter_location: "OUTSIDE", customer_name: "Ty", customer_phone: "555-0002", avg_daily_usage_ccf: 1.5, last_billed_read_value: 500, last_billed_read_at: "2026-04-01T00:00:00Z" }, as: Scheduler, captures: { acct: $.data.id } }
            - { call: "POST /api/meters", payload: { serial_number: "L-0002", size_code: "S_3_4", technology: "LEGACY" }, as: Scheduler, captures: { oldm: $.data.id } }
            - { call: "POST /api/meters/${oldm}/install", payload: { service_account_id: "${acct}", initial_read_value: 500, installed_at: "2026-04-02T00:00:00Z" }, as: Scheduler }
            - { call: "POST /api/work-orders", payload: { wave_id: "${wave}", service_account_id: "${acct}" }, as: Scheduler, captures: { wo: $.data.id } }
          trigger:
            - { call: "POST /api/readings", payload: { work_order_id: "${wo}", meter_id: "${oldm}", read_type: "VERIFICATION", value: 505, source: "CUSTOMER", read_at: "2026-05-03T08:00:00Z" }, as: Scheduler, captures: { rdg: $.data.id } }
            - { call: "GET /api/readings?meter_id=${oldm}", payload: {}, as: Scheduler }
          assert:
            - "create response: has id and created_at; has NO version and NO updated_at (common_fields false)"
            - "GET /api/readings?meter_id=${oldm} -> total_count == 1 and data[0].id == ${rdg}"
            - "data[0].read_type == VERIFICATION, value == 505, source == CUSTOMER"

      - name: duplicate_meter_serial_rejected
        claim_type: type_constraints
        grounds: ["errors[ERR_METER_SERIAL_CONFLICT]", "validations", "priority=6"]
        distinguishing_aspect: "Second meter with the same serial_number is rejected with 409 ERR_METER_SERIAL_CONFLICT."
        test_recipe:
          setup: ["one meter L-DUP registered"]
          setup_api_calls:
            - { call: "POST /api/meters", payload: { serial_number: "L-DUP", size_code: "S_1", technology: "LEGACY" }, as: Scheduler }
          trigger:
            - { call: "POST /api/meters", payload: { serial_number: "L-DUP", size_code: "S_2", technology: "AMI" }, as: Scheduler, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_METER_SERIAL_CONFLICT (HTTP 409)"

      - name: wave_list_pagination_limit_offset
        claim_type: listing
        grounds: ["response_envelope", "endpoints"]
        distinguishing_aspect: "Pagination envelope honors limit/offset: 3 DRAFT waves, limit=2 -> 2 items with total_count 3 and has_more true; offset=2 -> 1 item with has_more false."
        test_recipe:
          setup: ["program with three DRAFT waves"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AMI-2027", fiscal_year: "FY2027", budget_total_cents: 1000000, target_meter_count: 100, rate_per_ccf_cents: 450, default_unit_allowance_cents: 20000 }, as: ProgramManager, captures: { prog: $.data.id } }
            - { call: "POST /api/waves", payload: { program_id: "${prog}", wave_number: 1, window_start: "2026-05-01T00:00:00Z", window_end: "2026-06-01T00:00:00Z", capacity: 5 }, as: ProgramManager }
            - { call: "POST /api/waves", payload: { program_id: "${prog}", wave_number: 2, window_start: "2026-06-01T00:00:00Z", window_end: "2026-07-01T00:00:00Z", capacity: 5 }, as: ProgramManager }
            - { call: "POST /api/waves", payload: { program_id: "${prog}", wave_number: 3, window_start: "2026-07-01T00:00:00Z", window_end: "2026-08-01T00:00:00Z", capacity: 5 }, as: ProgramManager }
          trigger:
            - { call: "GET /api/waves?program_id=${prog}&limit=2", payload: {}, as: ProgramManager }
            - { call: "GET /api/waves?program_id=${prog}&limit=2&offset=2", payload: {}, as: ProgramManager }
          assert:
            - "page 1: response_type == 'array'; len(data) == 2; total_count == 3; has_more == true"
            - "page 2 (offset 2): len(data) == 1; total_count == 3; has_more == false"

      - name: work_order_create_bogus_wave_rejected
        claim_type: parent_relationships
        grounds: ["entities.WorkOrder.fields.wave_id", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Creating a work order against a non-existent wave id fails existence validation with 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/work-orders", payload: { wave_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", service_account_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2" }, as: Scheduler, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 404 and error_id == ERR_NOT_FOUND (path/FK existence before any business rule)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: work_order_initial_state
        claim_type: initial_state
        grounds: ["state_machines.WorkOrder", "entities.WorkOrder.fields.committed_amount_cents"]
        distinguishing_aspect: "A new work order starts CREATED with hold_status CLEAR, no_access_strikes 0, committed_amount_cents equal to the program default allowance, and old_meter_id captured from the account's INSTALLED meter."
        test_recipe:
          setup: ["program ACTIVE (allowance 20000); wave OPEN; account with legacy meter INSTALLED"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AMI-2027", fiscal_year: "FY2027", budget_total_cents: 1000000, target_meter_count: 100, rate_per_ccf_cents: 450, default_unit_allowance_cents: 20000 }, as: ProgramManager, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: ProgramManager }
            - { call: "POST /api/waves", payload: { program_id: "${prog}", wave_number: 1, window_start: "2026-05-01T00:00:00Z", window_end: "2026-06-01T00:00:00Z", capacity: 10 }, as: ProgramManager, captures: { wave: $.data.id } }
            - { call: "POST /api/waves/${wave}/open", payload: {}, as: ProgramManager }
            - { call: "POST /api/accounts", payload: { account_number: "A-0003", service_address: "3 Test Way", meter_location: "INSIDE", customer_name: "Ux", customer_phone: "555-0003", avg_daily_usage_ccf: 1.5, last_billed_read_value: 500, last_billed_read_at: "2026-04-01T00:00:00Z" }, as: Scheduler, captures: { acct: $.data.id } }
            - { call: "POST /api/meters", payload: { serial_number: "L-0003", size_code: "S_5_8", technology: "LEGACY" }, as: Scheduler, captures: { oldm: $.data.id } }
            - { call: "POST /api/meters/${oldm}/install", payload: { service_account_id: "${acct}", initial_read_value: 500, installed_at: "2026-04-02T00:00:00Z" }, as: Scheduler }
          trigger:
            - { call: "POST /api/work-orders", payload: { wave_id: "${wave}", service_account_id: "${acct}" }, as: Scheduler, captures: { wo: $.data.id } }
          assert:
            - "lifecycle_status == CREATED and hold_status == CLEAR"
            - "no_access_strikes == 0; committed_amount_cents == 20000"
            - "old_meter_id == ${oldm}; new_meter_id == null; contractor_id == null"
            - "ServiceAccount.${acct}.status == IN_PROGRAM (auto-transition)"

      - name: cancelled_work_order_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.WorkOrder.CREATED_to_CANCELLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A CANCELLED work order rejects all further transitions: assign with the current version fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["work order created then cancelled"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AMI-2027", fiscal_year: "FY2027", budget_total_cents: 1000000, target_meter_count: 100, rate_per_ccf_cents: 450, default_unit_allowance_cents: 20000 }, as: ProgramManager, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: ProgramManager }
            - { call: "POST /api/contractors", payload: { program_id: "${prog}", name: "AquaWorks", crew_capacity_per_window: 2, unit_price_cents: 18500 }, as: ProgramManager, captures: { contr: $.data.id } }
            - { call: "POST /api/waves", payload: { program_id: "${prog}", wave_number: 1, window_start: "2026-05-01T00:00:00Z", window_end: "2026-06-01T00:00:00Z", capacity: 10 }, as: ProgramManager, captures: { wave: $.data.id } }
            - { call: "POST /api/waves/${wave}/open", payload: {}, as: ProgramManager }
            - { call: "POST /api/accounts", payload: { account_number: "A-0004", service_address: "4 Test Way", meter_location: "OUTSIDE", customer_name: "Vi", customer_phone: "555-0004", avg_daily_usage_ccf: 1.5, last_billed_read_value: 500, last_billed_read_at: "2026-04-01T00:00:00Z" }, as: Scheduler, captures: { acct: $.data.id } }
            - { call: "POST /api/meters", payload: { serial_number: "L-0004", size_code: "S_5_8", technology: "LEGACY" }, as: Scheduler, captures: { oldm: $.data.id } }
            - { call: "POST /api/meters/${oldm}/install", payload: { service_account_id: "${acct}", initial_read_value: 500, installed_at: "2026-04-02T00:00:00Z" }, as: Scheduler }
            - { call: "POST /api/work-orders", payload: { wave_id: "${wave}", service_account_id: "${acct}" }, as: Scheduler, captures: { wo: $.data.id } }
            - { call: "POST /api/work-orders/${wo}/cancel", payload: {}, as: Scheduler }
            - { call: "GET /api/work-orders/${wo}", payload: {}, as: Scheduler, captures: { wo_v: $.data.version } }
          trigger:
            - { call: "POST /api/work-orders/${wo}/assign", payload: { contractor_id: "${contr}", expected_work_order_version: "${wo_v}" }, as: Scheduler, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (terminal lockdown; current version used so OCC is not the rejection cause)"
            - "WorkOrder.${wo}.lifecycle_status == CANCELLED (unchanged)"

      - name: completed_appointment_rejects_no_access
        claim_type: invalid_transition
        grounds: ["state_machines.Appointment"]
        distinguishing_aspect: "From COMPLETED (terminal), no-access is not a listed transition -> ERR_INVALID_STATE, and no strike is recorded."
        test_recipe:
          setup: ["work order SCHEDULED; appointment COMPLETED"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AMI-2027", fiscal_year: "FY2027", budget_total_cents: 1000000, target_meter_count: 100, rate_per_ccf_cents: 450, default_unit_allowance_cents: 20000 }, as: ProgramManager, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: ProgramManager }
            - { call: "POST /api/contractors", payload: { program_id: "${prog}", name: "AquaWorks", crew_capacity_per_window: 2, unit_price_cents: 18500 }, as: ProgramManager, captures: { contr: $.data.id } }
            - { call: "POST /api/waves", payload: { program_id: "${prog}", wave_number: 1, window_start: "2026-05-01T00:00:00Z", window_end: "2026-06-01T00:00:00Z", capacity: 10 }, as: ProgramManager, captures: { wave: $.data.id } }
            - { call: "POST /api/waves/${wave}/open", payload: {}, as: ProgramManager }
            - { call: "POST /api/accounts", payload: { account_number: "A-0005", service_address: "5 Test Way", meter_location: "OUTSIDE", customer_name: "Wi", customer_phone: "555-0005", avg_daily_usage_ccf: 1.5, last_billed_read_value: 500, last_billed_read_at: "2026-04-01T00:00:00Z" }, as: Scheduler, captures: { acct: $.data.id } }
            - { call: "POST /api/meters", payload: { serial_number: "L-0005", size_code: "S_5_8", technology: "LEGACY" }, as: Scheduler, captures: { oldm: $.data.id } }
            - { call: "POST /api/meters/${oldm}/install", payload: { service_account_id: "${acct}", initial_read_value: 500, installed_at: "2026-04-02T00:00:00Z" }, as: Scheduler }
            - { call: "POST /api/work-orders", payload: { wave_id: "${wave}", service_account_id: "${acct}" }, as: Scheduler, captures: { wo: $.data.id, wo_v: $.data.version } }
            - { call: "POST /api/work-orders/${wo}/assign", payload: { contractor_id: "${contr}", expected_work_order_version: "${wo_v}" }, as: Scheduler }
            - { call: "POST /api/notifications", payload: { work_order_id: "${wo}", channel: "USPS_MAIL" }, as: Scheduler, captures: { notif: $.data.id } }
            - { call: "POST /api/notifications/${notif}/confirm-delivery", payload: { outcome: "DELIVERED", delivered_at: "2026-05-02T10:00:00Z" }, as: Scheduler }
            - { call: "GET /api/work-orders/${wo}", payload: {}, as: Scheduler, captures: { wo_v3: $.data.version } }
            - { call: "POST /api/appointments", payload: { work_order_id: "${wo}", slot_date: "2026-05-06", window: "AM", expected_work_order_version: "${wo_v3}" }, as: Scheduler, captures: { appt: $.data.id } }
            - { call: "POST /api/appointments/${appt}/complete", payload: {}, as: FieldContractor, as_user_id: "${contr}" }
          trigger:
            - { call: "POST /api/appointments/${appt}/no-access", payload: {}, as: FieldContractor, as_user_id: "${contr}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "Appointment.${appt}.status == COMPLETED (unchanged)"
            - "WorkOrder.${wo}.no_access_strikes == 0 (no side effects fired)"

      - name: notification_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.CustomerNotification", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A DELIVERED notification rejects a second confirm-delivery (FAILED) with ERR_INVALID_STATE."
        test_recipe:
          setup: ["work order CREATED; notification DELIVERED"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AMI-2027", fiscal_year: "FY2027", budget_total_cents: 1000000, target_meter_count: 100, rate_per_ccf_cents: 450, default_unit_allowance_cents: 20000 }, as: ProgramManager, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: ProgramManager }
            - { call: "POST /api/waves", payload: { program_id: "${prog}", wave_number: 1, window_start: "2026-05-01T00:00:00Z", window_end: "2026-06-01T00:00:00Z", capacity: 10 }, as: ProgramManager, captures: { wave: $.data.id } }
            - { call: "POST /api/waves/${wave}/open", payload: {}, as: ProgramManager }
            - { call: "POST /api/accounts", payload: { account_number: "A-0006", service_address: "6 Test Way", meter_location: "OUTSIDE", customer_name: "Xi", customer_phone: "555-0006", avg_daily_usage_ccf: 1.5, last_billed_read_value: 500, last_billed_read_at: "2026-04-01T00:00:00Z" }, as: Scheduler, captures: { acct: $.data.id } }
            - { call: "POST /api/meters", payload: { serial_number: "L-0006", size_code: "S_5_8", technology: "LEGACY" }, as: Scheduler, captures: { oldm: $.data.id } }
            - { call: "POST /api/meters/${oldm}/install", payload: { service_account_id: "${acct}", initial_read_value: 500, installed_at: "2026-04-02T00:00:00Z" }, as: Scheduler }
            - { call: "POST /api/work-orders", payload: { wave_id: "${wave}", service_account_id: "${acct}" }, as: Scheduler, captures: { wo: $.data.id } }
            - { call: "POST /api/notifications", payload: { work_order_id: "${wo}", channel: "USPS_MAIL" }, as: Scheduler, captures: { notif: $.data.id } }
            - { call: "POST /api/notifications/${notif}/confirm-delivery", payload: { outcome: "DELIVERED", delivered_at: "2026-05-02T10:00:00Z" }, as: Scheduler }
          trigger:
            - { call: "POST /api/notifications/${notif}/confirm-delivery", payload: { outcome: "FAILED" }, as: Scheduler, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (DELIVERED is terminal)"
            - "CustomerNotification.${notif}.status == DELIVERED (unchanged)"

      - name: wave_open_requires_active_program
        claim_type: precondition_enforcement
        grounds: ["state_machines.Wave.DRAFT_to_OPEN", "errors[ERR_PROGRAM_NOT_ACTIVE]", "validations", "priority=8"]
        distinguishing_aspect: "Opening a wave while its program is still PLANNING fails with ERR_PROGRAM_NOT_ACTIVE."
        test_recipe:
          setup: ["program PLANNING; wave DRAFT"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AMI-2027", fiscal_year: "FY2027", budget_total_cents: 1000000, target_meter_count: 100, rate_per_ccf_cents: 450, default_unit_allowance_cents: 20000 }, as: ProgramManager, captures: { prog: $.data.id } }
            - { call: "POST /api/waves", payload: { program_id: "${prog}", wave_number: 1, window_start: "2026-05-01T00:00:00Z", window_end: "2026-06-01T00:00:00Z", capacity: 10 }, as: ProgramManager, captures: { wave: $.data.id } }
          trigger:
            - { call: "POST /api/waves/${wave}/open", payload: {}, as: ProgramManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PROGRAM_NOT_ACTIVE (HTTP 422)"
            - "Wave.${wave}.status == DRAFT (unchanged)"

      - name: no_access_advance_requires_stage_delivery
        claim_type: precondition_enforcement
        grounds: ["state_machines.NoAccessCase", "errors[ERR_ESCALATION_STEP_REQUIRED]", "validations", "priority=20"]
        distinguishing_aspect: "Advance from STAGE_1 is rejected while the stage's DOOR_HANGER notification is only SENT (not DELIVERED) -> ERR_ESCALATION_STEP_REQUIRED."
        test_recipe:
          setup: ["work order with 3 no-access strikes; NoAccessCase OPEN at STAGE_1 with auto-created DOOR_HANGER still SENT"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AMI-2027", fiscal_year: "FY2027", budget_total_cents: 1000000, target_meter_count: 100, rate_per_ccf_cents: 450, default_unit_allowance_cents: 20000, notice_days: 3 }, as: ProgramManager, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: ProgramManager }
            - { call: "POST /api/contractors", payload: { program_id: "${prog}", name: "AquaWorks", crew_capacity_per_window: 3, unit_price_cents: 18500 }, as: ProgramManager, captures: { contr: $.data.id } }
            - { call: "POST /api/waves", payload: { program_id: "${prog}", wave_number: 1, window_start: "2026-05-01T00:00:00Z", window_end: "2026-06-01T00:00:00Z", capacity: 10 }, as: ProgramManager, captures: { wave: $.data.id } }
            - { call: "POST /api/waves/${wave}/open", payload: {}, as: ProgramManager }
