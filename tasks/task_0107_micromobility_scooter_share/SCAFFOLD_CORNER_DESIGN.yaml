scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_plan_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.Plan, endpoints]
        distinguishing_aspect: "POST /api/plans with all required fields returns 201 and a Plan whose code, unlock_fee_cents, per_minute_cents, daily_cap_cents echo the input and whose id/created_at/version are server-minted."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/plans"
              payload: { code: "STANDARD", unlock_fee_cents: 100, per_minute_cents: 30, daily_cap_cents: 0, slow_zone_discount_pct: 0.25, active: true }
              as: PlatformAdmin
              captures: { plan_id: $.data.id, v: $.data.version }
          assert:
            - "response code == 201"
            - "data.code == STANDARD; data.unlock_fee_cents == 100; data.per_minute_cents == 30; data.daily_cap_cents == 0"
            - "data.version == 1; data.id is a UUID without a type prefix"

      - name: get_vehicle_not_found_returns_404
        claim_type: Not Found
        grounds: ["entities.Vehicle", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /api/vehicles/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/vehicles/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND (404)"

      - name: create_vehicle_missing_required_qr_code_returns_invalid_request
        claim_type: Required Fields
        grounds: ["entities.Vehicle.fields.qr_code", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /api/vehicles omitting the required qr_code field returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["a zone exists for current_zone_id"]
          setup_api_calls:
            - call: "POST /api/zones"
              payload: { name: "Z", zone_type: "RIDE_OK", priority: 5 }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
          trigger:
            - call: "POST /api/vehicles"
              payload: { vehicle_type: "SCOOTER", current_zone_id: "${zone_id}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST (400)"

      - name: create_zone_invalid_enum_zone_type_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["entities.Zone.fields.zone_type", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /api/zones with zone_type not in {RIDE_OK, SLOW, NO_RIDE, NO_PARK} returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/zones"
              payload: { name: "Bad", zone_type: "TELEPORT", priority: 1 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST (400)"

      - name: vehicle_battery_pct_defaults_to_100_when_omitted
        claim_type: Defaults
        grounds: [entities.Vehicle.fields.battery_pct]
        distinguishing_aspect: "Omitting battery_pct on POST /api/vehicles applies the default 100."
        test_recipe:
          setup: ["a zone exists"]
          setup_api_calls:
            - call: "POST /api/zones"
              payload: { name: "Z2", zone_type: "RIDE_OK", priority: 5 }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
          trigger:
            - call: "POST /api/vehicles"
              payload: { vehicle_type: "EBIKE", qr_code: "QR-DEF1", current_zone_id: "${zone_id}" }
              as: PlatformAdmin
              captures: { batt: $.data.battery_pct, status: $.data.status }
          assert:
            - "data.battery_pct == 100"
            - "data.status == AVAILABLE (initial state)"

      - name: rider_wallet_and_status_system_initialized
        claim_type: System Fields
        grounds: [entities.Rider.fields.wallet_balance_cents, entities.Rider.fields.status]
        distinguishing_aspect: "A newly registered Rider has wallet_balance_cents == 0, outstanding_fine_cents == 0, and status == ACTIVE regardless of input."
        test_recipe:
          setup: ["a plan exists"]
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { code: "STANDARD", unlock_fee_cents: 100, per_minute_cents: 30, daily_cap_cents: 0, slow_zone_discount_pct: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /api/riders"
              payload: { email: "sys@x.com", full_name: "Sys", plan_id: "${plan_id}" }
              as: Anonymous
              captures: { wallet: $.data.wallet_balance_cents, status: $.data.status }
          assert:
            - "data.wallet_balance_cents == 0"
            - "data.outstanding_fine_cents == 0"
            - "data.status == ACTIVE"

      - name: list_vehicles_pagination_envelope_fields_present
        claim_type: Listing
        grounds: [entities.Vehicle, response_envelope]
        distinguishing_aspect: "GET /api/vehicles returns an array response with pagination fields total_count and has_more in meta/envelope."
        test_recipe:
          setup: ["a zone and one vehicle exist"]
          setup_api_calls:
            - call: "POST /api/zones"
              payload: { name: "Z3", zone_type: "RIDE_OK", priority: 5 }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /api/vehicles"
              payload: { vehicle_type: "SCOOTER", qr_code: "QR-PG1", current_zone_id: "${zone_id}" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/vehicles?limit=10&offset=0"
              payload: {}
              as: PlatformAdmin
              captures: { total: $.total_count }
          assert:
            - "response_type == array; total_count == 1; has_more == false"

      - name: create_rider_with_nonexistent_plan_returns_reference_not_found
        claim_type: Parent Relationships
        grounds: ["entities.Rider.fields.plan_id", "errors[ERR_REFERENCE_NOT_FOUND]"]
        distinguishing_aspect: "POST /api/riders with a plan_id that references no Plan returns ERR_REFERENCE_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/riders"
              payload: { email: "nope@x.com", full_name: "Nope", plan_id: "00000000-0000-4000-8000-000000000abc" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_REFERENCE_NOT_FOUND (404)"

  # =========================================================================
  - section: state_machines
    instances:
      - name: pause_already_completed_trip_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Trip.ACTIVE_to_PAUSED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Pausing a COMPLETED trip is not a defined transition and returns ERR_INVALID_STATE (409); no segment is opened."
        test_recipe:
          setup: ["a COMPLETED trip"]
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { code: "STANDARD", unlock_fee_cents: 100, per_minute_cents: 30, daily_cap_cents: 0, slow_zone_discount_pct: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /api/zones"
              payload: { name: "Z4", zone_type: "RIDE_OK", priority: 5 }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /api/vehicles"
              payload: { vehicle_type: "SCOOTER", qr_code: "QR-S1", battery_pct: 100, current_zone_id: "${zone_id}" }
              as: PlatformAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /api/riders"
              payload: { email: "s1@x.com", full_name: "S1", plan_id: "${plan_id}" }
              as: Anonymous
              captures: { rider_id: $.data.id }
            - call: "POST /api/riders/${rider_id}/topup"
              payload: { amount_cents: 5000 }
              as: Rider
              as_user_id: "${rider_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/trips"
              payload: { rider_id: "${rider_id}", vehicle_id: "${veh_id}" }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:05:00Z" }
              as: PlatformAdmin
            - call: "POST /api/trips/${trip_id}/end"
              payload: { end_zone_id: "${zone_id}" }
              as: Rider
              as_user_id: "${rider_id}"
          trigger:
            - call: "POST /api/trips/${trip_id}/pause"
              payload: {}
              as: Rider
              as_user_id: "${rider_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (409)"

      - name: resume_active_trip_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Trip.PAUSED_to_ACTIVE", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Resuming an ACTIVE (not PAUSED) trip is undefined and returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["an ACTIVE trip"]
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { code: "STANDARD", unlock_fee_cents: 100, per_minute_cents: 30, daily_cap_cents: 0, slow_zone_discount_pct: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /api/zones"
              payload: { name: "Z5", zone_type: "RIDE_OK", priority: 5 }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /api/vehicles"
              payload: { vehicle_type: "SCOOTER", qr_code: "QR-S2", battery_pct: 100, current_zone_id: "${zone_id}" }
              as: PlatformAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /api/riders"
              payload: { email: "s2@x.com", full_name: "S2", plan_id: "${plan_id}" }
              as: Anonymous
              captures: { rider_id: $.data.id }
            - call: "POST /api/riders/${rider_id}/topup"
              payload: { amount_cents: 5000 }
              as: Rider
              as_user_id: "${rider_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/trips"
              payload: { rider_id: "${rider_id}", vehicle_id: "${veh_id}" }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { trip_id: $.data.id }
          trigger:
            - call: "POST /api/trips/${trip_id}/resume"
              payload: {}
              as: Rider
              as_user_id: "${rider_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (409)"

      - name: retired_vehicle_terminal_no_further_transitions
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Vehicle.MAINTENANCE_to_RETIRED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A RETIRED vehicle is terminal; return-to-service returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["a vehicle in MAINTENANCE then RETIRED"]
          setup_api_calls:
            - call: "POST /api/zones"
              payload: { name: "Z6", zone_type: "RIDE_OK", priority: 5 }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /api/vehicles"
              payload: { vehicle_type: "SCOOTER", qr_code: "QR-S3", battery_pct: 100, current_zone_id: "${zone_id}" }
              as: PlatformAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /api/vehicles/${veh_id}/maintenance"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/vehicles/${veh_id}/retire"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /api/vehicles/${veh_id}/return-to-service"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (409)"

      - name: cancel_after_grace_window_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Trip.ACTIVE_to_CANCELLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a trip more than GRACE_SECONDS (120) after start fails the cancel precondition and returns ERR_INVALID_STATE (409); the trip remains ACTIVE and uncharged."
        test_recipe:
          setup: ["an ACTIVE trip started at 00:00:00; clock advanced to 00:03:00 (180s > 120s grace)"]
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { code: "STANDARD", unlock_fee_cents: 100, per_minute_cents: 30, daily_cap_cents: 0, slow_zone_discount_pct: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /api/zones"
              payload: { name: "Z7", zone_type: "RIDE_OK", priority: 5 }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /api/vehicles"
              payload: { vehicle_type: "SCOOTER", qr_code: "QR-S4", battery_pct: 100, current_zone_id: "${zone_id}" }
              as: PlatformAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /api/riders"
              payload: { email: "s4@x.com", full_name: "S4", plan_id: "${plan_id}" }
              as: Anonymous
              captures: { rider_id: $.data.id }
            - call: "POST /api/riders/${rider_id}/topup"
              payload: { amount_cents: 5000 }
              as: Rider
              as_user_id: "${rider_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/trips"
              payload: { rider_id: "${rider_id}", vehicle_id: "${veh_id}" }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-03T00:03:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/trips/${trip_id}/cancel"
              payload: {}
              as: Rider
              as_user_id: "${rider_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (409); Trip.${trip_id}.status remains ACTIVE"

      - name: cancel_within_grace_succeeds_no_charge
        claim_type: Side Effect Execution
        grounds: [state_machines.Trip.ACTIVE_to_CANCELLED, entities.Trip.fields.final_fare_cents]
        distinguishing_aspect: "Cancelling within GRACE_SECONDS sets final_fare_cents to 0, leaves the wallet untouched, and returns the vehicle to AVAILABLE."
        test_recipe:
          setup: ["an ACTIVE trip started at 00:00:00; clock at 00:01:00 (60s <= 120s grace)"]
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { code: "STANDARD", unlock_fee_cents: 100, per_minute_cents: 30, daily_cap_cents: 0, slow_zone_discount_pct: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /api/zones"
              payload: { name: "Z8", zone_type: "RIDE_OK", priority: 5 }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /api/vehicles"
              payload: { vehicle_type: "SCOOTER", qr_code: "QR-S5", battery_pct: 100, current_zone_id: "${zone_id}" }
              as: PlatformAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /api/riders"
              payload: { email: "s5@x.com", full_name: "S5", plan_id: "${plan_id}" }
              as: Anonymous
              captures: { rider_id: $.data.id }
            - call: "POST /api/riders/${rider_id}/topup"
              payload: { amount_cents: 5000 }
              as: Rider
              as_user_id: "${rider_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-04T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/trips"
              payload: { rider_id: "${rider_id}", vehicle_id: "${veh_id}" }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-04T00:01:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/trips/${trip_id}/cancel"
              payload: {}
              as: Rider
              as_user_id: "${rider_id}"
              captures: { status: $.data.status, fare: $.data.final_fare_cents }
            - call: "GET /api/riders/${rider_id}"
              payload: {}
              as: Rider
              as_user_id: "${rider_id}"
              captures: { wallet: $.data.wallet_balance_cents }
            - call: "GET /api/vehicles/${veh_id}"
              payload: {}
              as: PlatformAdmin
              captures: { vstatus: $.data.status }
          assert:
            - "Trip.${trip_id}.status == CANCELLED; final_fare_cents == 0"
            - "Rider.${rider_id}.wallet_balance_cents == 5000 (no charge)"
            - "Vehicle.${veh_id}.status == AVAILABLE"

      - name: low_income_application_approve_rejected_when_income_over_ceiling
        claim_type: Precondition Enforcement
        grounds: ["state_machines.LowIncomeApplication.SUBMITTED_to_APPROVED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approving an application whose annual_income_cents exceeds INCOME_CEILING_PER_PERSON_CENTS*household_size violates the approve precondition; 7,000,000 with household 2 (ceiling 6,000,000) is rejected with ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["a SUBMITTED application with income 7,000,000 and household 2"]
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { code: "STANDARD", unlock_fee_cents: 100, per_minute_cents: 30, daily_cap_cents: 0, slow_zone_discount_pct: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /api/riders"
              payload: { email: "over@x.com", full_name: "Over", plan_id: "${plan_id}" }
              as: Anonymous
              captures: { rider_id: $.data.id }
            - call: "POST /api/low-income-applications"
              payload: { rider_id: "${rider_id}", household_size: 2, annual_income_cents: 7000000 }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /api/low-income-applications/${app_id}/approve"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (409); application stays SUBMITTED"

      - name: reinstate_with_outstanding_fines_rejected
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Rider.SUSPENDED_to_ACTIVE", "errors[ERR_OUTSTANDING_FINES]"]
        distinguishing_aspect: "Reinstating a SUSPENDED rider whose outstanding_fine_cents != 0 violates the reinstate precondition and returns ERR_OUTSTANDING_FINES (422)."
        test_recipe:
          setup: ["a rider with a PENDING NO_PARK fine (outstanding 2500) who is then SUSPENDED"]
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { code: "STANDARD", unlock_fee_cents: 100, per_minute_cents: 30, daily_cap_cents: 0, slow_zone_discount_pct: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /api/zones"
              payload: { name: "Z9", zone_type: "RIDE_OK", priority: 5 }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /api/zones"
              payload: { name: "NP9", zone_type: "NO_PARK", priority: 3 }
              as: PlatformAdmin
              captures: { np_id: $.data.id }
            - call: "POST /api/vehicles"
              payload: { vehicle_type: "SCOOTER", qr_code: "QR-S6", battery_pct: 100, current_zone_id: "${zone_id}" }
              as: PlatformAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /api/riders"
              payload: { email: "s6@x.com", full_name: "S6", plan_id: "${plan_id}" }
              as: Anonymous
              captures: { rider_id: $.data.id }
            - call: "POST /api/riders/${rider_id}/topup"
              payload: { amount_cents: 5000 }
              as: Rider
              as_user_id: "${rider_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/trips"
              payload: { rider_id: "${rider_id}", vehicle_id: "${veh_id}" }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:01:30Z" }
              as: PlatformAdmin
            - call: "POST /api/trips/${trip_id}/end"
              payload: { end_zone_id: "${np_id}" }
              as: Rider
              as_user_id: "${rider_id}"
            - call: "POST /api/riders/${rider_id}/suspend"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /api/riders/${rider_id}/reinstate"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_OUTSTANDING_FINES (422); Rider.${rider_id}.status remains SUSPENDED"

      - name: end_active_trip_in_no_ride_zone_returns_422
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Trip.ACTIVE_to_COMPLETED", "errors[ERR_END_IN_NO_RIDE_ZONE]"]
        distinguishing_aspect: "Ending an ACTIVE trip (state precondition satisfied) in a NO_RIDE end zone violates the priority-8 safety check and returns ERR_END_IN_NO_RIDE_ZONE (422); the trip stays ACTIVE and no charge fires."
        test_recipe:
          setup: ["an ACTIVE trip; a NO_RIDE zone exists"]
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { code: "STANDARD", unlock_fee_cents: 100, per_minute_cents: 30, daily_cap_cents: 0, slow_zone_discount_pct: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /api/zones"
              payload: { name: "Z4b", zone_type: "RIDE_OK", priority: 5 }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /api/zones"
              payload: { name: "NR4b", zone_type: "NO_RIDE", priority: 2 }
              as: PlatformAdmin
              captures: { nr_id: $.data.id }
            - call: "POST /api/vehicles"
              payload: { vehicle_type: "SCOOTER", qr_code: "QR-S1b", battery_pct: 100, current_zone_id: "${zone_id}" }
              as: PlatformAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /api/riders"
              payload: { email: "s1b@x.com", full_name: "S1b", plan_id: "${plan_id}" }
              as: Anonymous
              captures: { rider_id: $.data.id }
            - call: "POST /api/riders/${rider_id}/topup"
              payload: { amount_cents: 5000 }
              as: Rider
              as_user_id: "${rider_id}"
            - call: "POST /api/_clock/set_current_utc"
