            - "${err_sod_counsel} == ERR_SEGREGATION_OF_DUTIES with HTTP 403"
            - "${sub_cs_status} == PRODUCED"
            - "${responder_cs} == counsel-2"
            - "${late_cs} == false"

  # =========================================================================
  # Cross-cutting complexity layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_check_hold_version_on_override_review_creation_is_refused
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[override-review-create-stale-hold]
          - errors[ERR_STALE_CHECK_HOLD_VERSION]
          - state_machines.HoldOverrideReview.DRAFT_to_SUPERSEDED
        distinguishing_aspect: "The first create advances CheckHold.version, so replaying the same expected_check_hold_version is refused with 412 ERR_STALE_CHECK_HOLD_VERSION before any window or state check runs; re-reading the hold and using the fresh version succeeds and supersedes the earlier review."
        test_recipe:
          setup:
            - "One ACTIVE DepositAccount with one CHECK deposit of 30000 cents and its ACTIVE 7500-cent hold at version 1."
          setup_api_calls:
            - call: "POST /deposit-fraud/customers"
              payload: { legal_name: "Occ Hold Depositor", tin_last4: "0043" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { cust_oc1: "$.data.id" }
            - call: "POST /deposit-fraud/accounts"
              payload: { customer_id: "${cust_oc1}", product_type: "CHECKING", open_channel: "BRANCH" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { acct_oc1: "$.data.id" }
            - call: "POST /deposit-fraud/accounts/${acct_oc1}/funding-sources"
              payload: { source_type: "EXTERNAL_ACH", routing_last4: "1029" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { fs_oc1: "$.data.id", md_oc1: "$.data.micro_deposit_cents" }
            - call: "POST /deposit-fraud/funding-sources/${fs_oc1}/verification-attempts"
              payload: { micro_deposit_cents: "${md_oc1}" }
              as: OperationsAdmin
              as_user_id: "ops-1"
            - call: "POST /deposit-fraud/accounts/${acct_oc1}/deposit-items"
              payload: { item_type: "CHECK", amount_cents: 30000 }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { item_oc1: "$.data.id" }
            - call: "GET /deposit-fraud/deposit-items/${item_oc1}/holds"
              payload: {}
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { hold_oc1: "$.data[0].id", hold_oc1_v: "$.data[0].version" }
          trigger:
            - call: "POST /deposit-fraud/check-holds/${hold_oc1}/override-reviews"
              payload: { requested_release_cents: 7500, release_effective_at: "2026-08-01T00:00:00Z", release_window_end_at: "2026-08-02T00:00:00Z", justification: "First review", expected_check_hold_version: "${hold_oc1_v}" }
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { rev_oc1a: "$.data.id" }
            - call: "POST /deposit-fraud/check-holds/${hold_oc1}/override-reviews"
              payload: { requested_release_cents: 7500, release_effective_at: "2026-08-01T00:00:00Z", release_window_end_at: "2026-08-02T00:00:00Z", justification: "Replay with a stale hold version", expected_check_hold_version: "${hold_oc1_v}" }
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { err_stale_hold: "$.data.error_id" }
            - call: "GET /deposit-fraud/check-holds/${hold_oc1}"
              payload: {}
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { hold_oc1_v2: "$.data.version" }
            - call: "POST /deposit-fraud/check-holds/${hold_oc1}/override-reviews"
              payload: { requested_release_cents: 7500, release_effective_at: "2026-08-03T00:00:00Z", release_window_end_at: "2026-08-04T00:00:00Z", justification: "Revised review on a fresh hold version", expected_check_hold_version: "${hold_oc1_v2}" }
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { rev_oc1b: "$.data.id" }
          assert:
            - "${hold_oc1_v} == 1"
            - "${err_stale_hold} == ERR_STALE_CHECK_HOLD_VERSION with HTTP 412, taking precedence over the release-window overlap the replayed window would otherwise have hit"
            - "${hold_oc1_v2} == 2"
            - "GET /deposit-fraud/hold-override-reviews/${rev_oc1a} returns status == SUPERSEDED"
            - "GET /deposit-fraud/hold-override-reviews/${rev_oc1b} returns status == DRAFT"
            - "GET /deposit-fraud/check-holds/${hold_oc1}/override-reviews returns total_count == 2"

      - name: stale_account_version_on_charge_off_creation_is_refused
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[charge-off-create-stale-account]
          - errors[ERR_STALE_ACCOUNT_VERSION]
          - state_machines.ChargeOff.PROPOSED_to_SUPERSEDED
        distinguishing_aspect: "The second concurrency rule, on a different parent entity: the first proposal advances DepositAccount.version, so replaying the same expected_account_version is refused with 412 ERR_STALE_ACCOUNT_VERSION, and a re-read version lets the revised proposal supersede its predecessor."
        test_recipe:
          setup:
            - "One ACTIVE DepositAccount with zero balances and no existing ChargeOff."
          setup_api_calls:
            - call: "POST /deposit-fraud/customers"
              payload: { legal_name: "Occ Account Depositor", tin_last4: "0044" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { cust_oc2: "$.data.id" }
            - call: "POST /deposit-fraud/accounts"
              payload: { customer_id: "${cust_oc2}", product_type: "CHECKING", open_channel: "BRANCH" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { acct_oc2: "$.data.id" }
            - call: "POST /deposit-fraud/accounts/${acct_oc2}/funding-sources"
              payload: { source_type: "EXTERNAL_ACH", routing_last4: "1030" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { fs_oc2: "$.data.id", md_oc2: "$.data.micro_deposit_cents" }
            - call: "POST /deposit-fraud/funding-sources/${fs_oc2}/verification-attempts"
              payload: { micro_deposit_cents: "${md_oc2}" }
              as: OperationsAdmin
              as_user_id: "ops-1"
            - call: "GET /deposit-fraud/accounts/${acct_oc2}"
              payload: {}
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { v_oc2a: "$.data.version" }
          trigger:
            - call: "POST /deposit-fraud/accounts/${acct_oc2}/charge-offs"
              payload: { gross_loss_cents: 80000, collateral_offset_cents: 0, expected_account_version: "${v_oc2a}" }
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { co_oc2a: "$.data.id" }
            - call: "POST /deposit-fraud/accounts/${acct_oc2}/charge-offs"
              payload: { gross_loss_cents: 90000, collateral_offset_cents: 0, expected_account_version: "${v_oc2a}" }
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { err_stale_acct: "$.data.error_id" }
            - call: "GET /deposit-fraud/accounts/${acct_oc2}"
              payload: {}
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { v_oc2b: "$.data.version" }
            - call: "POST /deposit-fraud/accounts/${acct_oc2}/charge-offs"
              payload: { gross_loss_cents: 90000, collateral_offset_cents: 0, expected_account_version: "${v_oc2b}" }
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { co_oc2b: "$.data.id", net_oc2b: "$.data.net_charge_off_cents" }
          assert:
            - "${err_stale_acct} == ERR_STALE_ACCOUNT_VERSION with HTTP 412"
            - "${v_oc2b} > ${v_oc2a}"
            - "GET /deposit-fraud/charge-offs/${co_oc2a} returns status == SUPERSEDED"
            - "${net_oc2b} == 94500, from base_net 90000 at tier 1 500 bps giving a 4500-cent fee"
            - "GET /deposit-fraud/accounts/${acct_oc2}/charge-offs returns total_count == 2"

      - name: deposit_account_version_advances_on_every_mutating_request
        claim_type: optimistic_concurrency
        grounds:
          - entities.DepositAccount.fields.customer_id
          - state_machines.DepositAccount.PENDING_FUNDING_to_ACTIVE
          - calculations.new_account_risk_score
        distinguishing_aspect: "DepositAccount.version starts at 1 on creation and strictly increases on each of the three subsequent mutations that touch it — funding-source declaration, verification, and a deposit — because each rewrites risk or balance fields on the row."
        test_recipe:
          setup:
            - "Empty database, logical clock at its default."
          setup_api_calls:
            - call: "POST /deposit-fraud/customers"
              payload: { legal_name: "Version Trail Depositor", tin_last4: "0045" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { cust_vt: "$.data.id" }
          trigger:
            - call: "POST /deposit-fraud/accounts"
              payload: { customer_id: "${cust_vt}", product_type: "CHECKING", open_channel: "BRANCH" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { acct_vt: "$.data.id", v_create: "$.data.version" }
            - call: "POST /deposit-fraud/accounts/${acct_vt}/funding-sources"
              payload: { source_type: "EXTERNAL_ACH", routing_last4: "1031" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { fs_vt: "$.data.id", md_vt: "$.data.micro_deposit_cents" }
            - call: "GET /deposit-fraud/accounts/${acct_vt}"
              payload: {}
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { v_after_fs: "$.data.version" }
            - call: "POST /deposit-fraud/funding-sources/${fs_vt}/verification-attempts"
              payload: { micro_deposit_cents: "${md_vt}" }
              as: OperationsAdmin
              as_user_id: "ops-1"
            - call: "GET /deposit-fraud/accounts/${acct_vt}"
              payload: {}
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { v_after_verify: "$.data.version" }
            - call: "POST /deposit-fraud/accounts/${acct_vt}/deposit-items"
              payload: { item_type: "CHECK", amount_cents: 30000 }
              as: OperationsAdmin
              as_user_id: "ops-1"
            - call: "GET /deposit-fraud/accounts/${acct_vt}"
              payload: {}
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { v_after_deposit: "$.data.version", updated_after_deposit: "$.data.updated_at" }
          assert:
            - "${v_create} == 1"
            - "${v_after_fs} > ${v_create}"
            - "${v_after_verify} > ${v_after_fs}"
            - "${v_after_deposit} > ${v_after_verify}"
            - "${updated_after_deposit} == 2026-08-01T00:00:00.000Z, refreshed by the cascaded balance write"

