  # =========================================================================
  # Cross-cutting complexity layers. complexity_profile.complexity_layers
  # declares exactly four: dual_variant_calculation, cascading_side_effects,
  # optimistic_concurrency and derived_field_reconciliation. Layers absent
  # from the profile (soft_delete, idempotency keys, bulk_operations,
  # multi_tenancy, conditional_feature_flags) have no rows here.
  # The OCC layer has four §1.2.1 rules; reserve-entry-create-stale-claim and
  # enrollment-create-stale-insured are already closed by the errors-section
  # instances reserve_entry_carrying_the_pre_decision_claim_version_returns_412
  # and enrollment_carrying_the_pre_credentialing_insured_version_returns_412,
  # so only the negotiation rule needs a fresh instance here.
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: negotiation_create_occ_rejects_the_claim_version_a_reserve_posting_invalidated
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.negotiation-create-stale-claim
          - validations[priority=30]
          - errors[ERR_STALE_CLAIM_VERSION]
        distinguishing_aspect: "Two writes guarded by the SAME claim version interfere: the reserve posting bumps it, so the negotiation carrying the pre-posting version is 412 and the identical payload succeeds after one re-read. The 412 itself consumes no version."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; OBSTETRICS_GYNECOLOGY class, COOK_IL insured CREDENTIALED to 2028-01-01, IN_FORCE claims-made term."
            - "Claim COVERED, version read once as ${clm_a_v1}, then a CASE_BASIS reserve entry posted with that version, which bumps the claim to ${clm_a_v1} + 1."
          setup_api_calls:
            - call: "POST /mpl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
            - call: "POST /mpl/specialty-classes"
              payload: { specialty_code: "OBSTETRICS_GYNECOLOGY", base_class_code: "CLASS_6", base_rate_per_million: 38000.00, hazard_index: 7.0, benchmark_severity: 640000.00 }
              as: ActuarialAnalyst
              as_user_id: "act-1"
              captures: { sc_obgyn: $.data.id }
            - call: "POST /mpl/insureds"
              payload: { entity_type: "PHYSICIAN", legal_name: "Rivera OBGYN PC", specialty_class_id: "${sc_obgyn}", venue_code: "COOK_IL", high_severity_procedure_pct: 40, years_in_practice: 12, board_certified: true }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
              captures: { ins_a: $.data.id }
            - call: "POST /mpl/insureds/${ins_a}/credentialing-decision"
              payload: { credentialing_status: "CREDENTIALED", credentialing_expires_on: "2028-01-01" }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
            - call: "POST /mpl/policies"
              payload: { insured_id: "${ins_a}", coverage_form: "CLAIMS_MADE", limit_per_claim: 1000000.00, limit_aggregate: 3000000.00, retroactive_date: "2026-08-01", prior_acts_step_credit: 0, consent_to_settle_clause: "NONE" }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
              captures: { pol_a: $.data.id, pol_a_v0: $.data.version }
            - call: "POST /mpl/policies/${pol_a}/terms"
              payload: { effective_date: "2026-08-01", expiration_date: "2027-08-01", expected_policy_version: "${pol_a_v0}" }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
              captures: { term_a1: $.data.id }
            - call: "POST /mpl/policy-terms/${term_a1}/issuance"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-1"
            - call: "POST /mpl/claims"
              payload: { insured_id: "${ins_a}", incident_date: "2026-08-05", report_date: "2026-09-01", venue_code: "COOK_IL", allegation_category: "OBSTETRIC_INJURY", demand_amount: 800000.00 }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
              captures: { clm_a: $.data.id }
            - call: "POST /mpl/claims/${clm_a}/coverage-decision"
              payload: { coverage_status: "COVERED" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - call: "GET /mpl/claims/${clm_a}"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-1"
              captures: { clm_a_v1: $.data.version }
            - call: "POST /mpl/claims/${clm_a}/reserve-entries"
              payload: { method: "CASE_BASIS", indemnity_amount: 300000.00, expense_amount: 90000.00, effective_at: "2026-09-02T00:00:00Z", rationale: "initial case reserve", expected_claim_version: "${clm_a_v1}" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
              captures: { res_a: $.data.id }
          trigger:
            - call: "POST /mpl/claims/${clm_a}/settlement-negotiations"
              payload: { proposed_amount: 250000.00, authority_requested: 250000.00, expected_claim_version: "${clm_a_v1}" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
              captures: { err_id: $.data.error_id }
            - call: "GET /mpl/claims/${clm_a}"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-1"
              captures: { clm_a_v2: $.data.version }
            - call: "POST /mpl/claims/${clm_a}/settlement-negotiations"
              payload: { proposed_amount: 250000.00, authority_requested: 250000.00, expected_claim_version: "${clm_a_v2}" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
              captures: { neg_a: $.data.id }
          assert:
            - "stale attempt response.status == 412 and error_id == ERR_STALE_CLAIM_VERSION"
            - "${clm_a_v2} == ${clm_a_v1} + 1, the reserve posting having bumped the claim exactly once"
            - "retry response.status == 201"
            - "SettlementNegotiation.${neg_a}.status == AUTHORITY_REQUESTED"
            - "SettlementNegotiation.${neg_a}.proposed_amount == 250000.00"
            - "SettlementNegotiation.${neg_a}.round_index == 1"
            - "Claim.${clm_a}.version == ${clm_a_v2} + 1, the accepted negotiation bumping it again"
            - "Claim.${clm_a}.indemnity_reserve == 300000.00"
            - "ReserveEntry.${res_a}.method == CASE_BASIS"
            - "SettlementNegotiation rows for claim ${clm_a} count == 1"

      - name: term_create_occ_stale_version_is_covered_by_the_difficulty_design
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.term-create-stale-policy
          - errors[ERR_STALE_POLICY_VERSION]
        excluded_because:
          difficulty_instance: stale_policy_version_on_overlapping_term_returns_412_not_overlap_conflict
          rationale: "That instance carries a stale expected_policy_version into POST /mpl/policies/{id}/terms and asserts the 412 wins over the overlap conflict the same payload would otherwise have raised, which is strictly stronger than a bare OCC round trip."

      - name: one_clock_advance_promotes_and_then_expires_the_same_term_in_pinned_order
        claim_type: cascading_side_effects
        grounds:
          - endpoints[POST /mpl/_clock/set_current_utc]
          - state_machines.PolicyTerm.ISSUED_to_IN_FORCE
          - state_machines.PolicyTerm.IN_FORCE_to_EXPIRED
          - state_machines.Policy.ACTIVE_to_EXPIRED
          - state_machines.Claim.RESOLVED_to_CLOSED
        distinguishing_aspect: "Ordering sensitivity made observable: one jump past a future term's whole period must promote it at step 2 and expire it at step 3, so its id appears in BOTH promoted_term_ids and expired_term_ids; if the steps ran in the other order the term would still be ISSUED."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; OBSTETRICS_GYNECOLOGY class, COOK_IL insured CREDENTIALED with credentialing_expires_on 2028-01-01."
            - "Term A 2026-08-01 to 2027-08-01 issued at inception so it is IN_FORCE, and renewal term B 2027-08-01 to 2028-08-01 issued while still future so it is ISSUED."
            - "A COVERED claim on term A dismissed with resolved_on 2026-09-01, so it is RESOLVED and past its 30-day closure window."
          setup_api_calls:
            - call: "POST /mpl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
            - call: "POST /mpl/specialty-classes"
              payload: { specialty_code: "OBSTETRICS_GYNECOLOGY", base_class_code: "CLASS_6", base_rate_per_million: 38000.00, hazard_index: 7.0, benchmark_severity: 640000.00 }
              as: ActuarialAnalyst
              as_user_id: "act-1"
              captures: { sc_obgyn: $.data.id }
            - call: "POST /mpl/insureds"
              payload: { entity_type: "PHYSICIAN", legal_name: "Rivera OBGYN PC", specialty_class_id: "${sc_obgyn}", venue_code: "COOK_IL", high_severity_procedure_pct: 40, years_in_practice: 12, board_certified: true }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
              captures: { ins_a: $.data.id }
            - call: "POST /mpl/insureds/${ins_a}/credentialing-decision"
              payload: { credentialing_status: "CREDENTIALED", credentialing_expires_on: "2028-01-01" }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
            - call: "POST /mpl/policies"
              payload: { insured_id: "${ins_a}", coverage_form: "CLAIMS_MADE", limit_per_claim: 1000000.00, limit_aggregate: 3000000.00, retroactive_date: "2026-08-01", prior_acts_step_credit: 0, consent_to_settle_clause: "NONE" }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
              captures: { pol_a: $.data.id, pol_a_v0: $.data.version }
            - call: "POST /mpl/policies/${pol_a}/terms"
              payload: { effective_date: "2026-08-01", expiration_date: "2027-08-01", expected_policy_version: "${pol_a_v0}" }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
              captures: { term_a: $.data.id }
            - call: "POST /mpl/policy-terms/${term_a}/issuance"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-1"
            - call: "GET /mpl/policies/${pol_a}"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-1"
              captures: { pol_a_v1: $.data.version }
            - call: "POST /mpl/policies/${pol_a}/terms"
              payload: { effective_date: "2027-08-01", expiration_date: "2028-08-01", predecessor_term_id: "${term_a}", expected_policy_version: "${pol_a_v1}" }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
              captures: { term_b: $.data.id }
            - call: "POST /mpl/policy-terms/${term_b}/issuance"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-1"
            - call: "POST /mpl/claims"
              payload: { insured_id: "${ins_a}", incident_date: "2026-08-05", report_date: "2026-08-20", venue_code: "COOK_IL", allegation_category: "OBSTETRIC_INJURY", demand_amount: 400000.00 }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
              captures: { clm_a: $.data.id }
            - call: "POST /mpl/claims/${clm_a}/coverage-decision"
              payload: { coverage_status: "COVERED" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - call: "POST /mpl/claims/${clm_a}/disposition"
              payload: { disposition: "DISMISSED", resolved_on: "2026-09-01" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
          trigger:
            - call: "POST /mpl/_clock/set_current_utc"
              payload: { to_iso8601: "2028-09-01T00:00:00Z" }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
          assert:
            - "response.status == 200"
            - "response.data.promoted_term_ids contains ${term_b}"
            - "response.data.expired_term_ids contains ${term_a} and ${term_b}"
            - "response.data.lapsed_insured_ids contains ${ins_a}"
            - "response.data.closed_claim_ids contains ${clm_a}"
