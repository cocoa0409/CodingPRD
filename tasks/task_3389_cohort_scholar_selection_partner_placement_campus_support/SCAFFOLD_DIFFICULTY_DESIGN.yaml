          - entities.Scholar.fields.standing
          - entities.Scholar.fields.enrollment_status
          - errors[ERR_SCHOLAR_NOT_ELIGIBLE]
        distinguishing_aspect: |
          Entity pair Internship -> Scholar (different pair from Offer ->
          Cohort): internship creation reads the scholar's two independent state
          axes — enrollment_status must be in {MATRICULATED, RETAINED} AND
          standing must be GOOD_STANDING. A MATRICULATED scholar on PROBATION
          standing is rejected with ERR_SCHOLAR_NOT_ELIGIBLE even though the
          enrollment axis alone would pass.
        test_recipe:
          setup:
            - "Cohort size 3 matriculated with only scholar s1 fully trained (s1 MATRICULATED; s2,s3 WITHDRAWN pre-matriculation); s1's standing then set to PROBATION"
