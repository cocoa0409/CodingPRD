# =============================================================================
# Scaffold: Buy-Nothing & Neighborhood Gifting Network (task 0957)
# Flat-topology gifting network: members, geo-groups, gift posts with claim
# queues (FIFO / fairness-draw / giver-pick), porch-pickup negotiation,
# moderation with strike thresholds, wishlists, curb alerts, reputation events.
# =============================================================================

scenario: |
  generate task hard than expert level! 957. Buy-Nothing & Neighborhood Gifting
  Network: member & geo-group, item post & claim/queue, porch-pickup coordination,
  moderation & fairness rule, wishlist & fulfilled, reputation, curb-alert/event,
  reporting

domain_name: buy-nothing-gifting-network
api_prefix: /v1

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Complexity Profile (§0.1–§0.4)
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation        # single-unit item pool competed for by a claim queue
  secondary_archetype: temporal_windowing    # pickup windows + curb-alert intervals
  complexity_layers:
    - cascading_side_effects                 # strike -> suspension -> claim withdrawal -> queue promotion
    - rate_threshold_triggers                # strike points >= 3 suspend, >= 6 ban
    - selector_policy                        # queue head promotion under 3 claim modes
    - optimistic_concurrency                 # OCC on GiftPost.version / NeighborhoodGroup.version
  entity_topology: flat                      # peer entities, FK references, no nested URLs
  state_machine_shape: cyclic                # GiftPost OPEN<->RESERVED, Wishlist ACTIVE<->MATCHED, Member ACTIVE<->SUSPENDED, PickupPlan counter loop
  relationship_patterns:
    - many_to_many                           # Member x NeighborhoodGroup via GroupMembership
    - cross_aggregate                        # Claim -> GiftPost, PickupPlan -> Claim, ModerationAction -> Report/Member
  role_model: hierarchical_override          # Member < GroupModerator (member with moderator membership) < PlatformAdmin (opaque)
  consistency_model: immediate               # all side effects atomic within the triggering request / clock sweep

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Unique email address (case-insensitive uniqueness)" }
      - { name: display_name, type: string, source: input, description: "Public display name" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | BANNED", constraints: "initial ACTIVE" }
      - { name: reputation_score, type: number, source: computed, description: "Official reputation: per-event rounded points summed over SETTLED ReputationEvents only (see calc_reputation_score)" }
      - { name: pending_reputation_score, type: number, source: computed, description: "Provisional reputation: same formula over PENDING + SETTLED ReputationEvents" }
      - { name: fairness_score, type: integer, source: computed, description: "Queue priority score 0..100 (see calc_fairness_score)" }
      - { name: active_strike_points, type: integer, source: computed, description: "Sum of severity_points over ModerationActions with action_type=STRIKE and status=ACTIVE for this member" }
      - { name: given_count_90d, type: integer, source: computed, description: "Count of GiftPosts with giver_id = this member reaching FULFILLED within the trailing 90 whole days" }
      - { name: received_count_90d, type: integer, source: computed, description: "Count of Claims with claimer_id = this member reaching FULFILLED within the trailing 90 whole days" }
      - { name: suspension_ends_at, type: datetime, source: system, description: "When status=SUSPENDED, the instant at which the clock sweep reinstates the member; null otherwise" }

  - name: NeighborhoodGroup
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Group name" }
      - { name: zip_code, type: string, source: input, description: "5-digit ZIP code anchoring the geo-group" }
      - { name: join_policy, type: enum, source: input, description: "OPEN | APPROVAL_REQUIRED", default: OPEN }
      - { name: capacity, type: integer, source: input, description: "Maximum approved members, 2..10000", default: 150 }
      - { name: member_count, type: integer, source: computed, description: "Count of GroupMemberships with group_id = this group and status = APPROVED" }
      - { name: roster_status, type: enum, source: computed, description: "ACCEPTING | FULL; FULL exactly when member_count >= capacity" }
      - { name: health_score, type: integer, source: computed, description: "2*completed_gifts_30d - 5*open_reports - 10*overdue_resolutions_30d (see calc_group_health)" }
      - { name: health_tier, type: enum, source: computed, description: "GREEN | YELLOW | RED; GREEN when health_score >= 20, YELLOW when 0..19, RED when < 0" }

  - name: GroupMembership
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the joining member" }
      - { name: group_id, type: string, source: input, description: "FK -> NeighborhoodGroup.id; the target group" }
      - { name: role, type: enum, source: system, description: "MEMBER | MODERATOR; MEMBER at creation/auto-approve, settable at approve time", default: MEMBER }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | REJECTED | LEFT | REMOVED", constraints: "at most one membership per (member_id, group_id) with status IN {REQUESTED, APPROVED}" }

  - name: GiftPost
    parent: null
    common_fields: true
    fields:
      - { name: group_id, type: string, source: input, description: "FK -> NeighborhoodGroup.id; group the item is offered in" }
      - { name: giver_id, type: string, source: system, description: "FK -> Member.id; the acting member at creation" }
      - { name: title, type: string, source: input, description: "Item title (wishlist keyword matching target)" }
      - { name: description, type: string, source: input, description: "Free-text description", default: "" }
      - { name: category, type: enum, source: input, description: "FURNITURE | CLOTHING | FOOD | HOUSEHOLD | ELECTRONICS | OTHER" }
      - { name: claim_mode, type: enum, source: input, description: "FIRST_COME | FAIRNESS_DRAW | GIVER_PICK; selects the queue promotion variant (calc_claim_queue_rank)" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | RESERVED | FULFILLED | WITHDRAWN | EXPIRED", constraints: "initial DRAFT" }
      - { name: expires_at, type: datetime, source: input, description: "Post auto-expires when status=OPEN and logical now >= expires_at; must be > now at creation" }
      - { name: current_claim_id, type: string, source: system, description: "id of the claim currently holding the offer (status IN {OFFERED, ACCEPTED}); null when none. Dereference via GET /v1/claims/{id}; reverse lookup via GET /v1/claims?post_id=" }
      - { name: current_offer_expires_at, type: datetime, source: system, description: "Mirror of the head claim's offer_expires_at; null when no live offer" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: post_id, type: string, source: input, description: "FK -> GiftPost.id; the claimed post" }
      - { name: claimer_id, type: string, source: system, description: "FK -> Member.id; the acting member at creation" }
      - { name: status, type: enum, source: system, description: "QUEUED | OFFERED | ACCEPTED | FULFILLED | DECLINED | EXPIRED | WITHDRAWN | NO_SHOW", constraints: "initial QUEUED; auto-promoted to OFFERED in the same request when the head slot is vacant and claim_mode != GIVER_PICK" }
      - { name: claim_seq, type: integer, source: system, description: "Per-post monotonic sequence starting at 1; final tie-break after created_at (never id)" }
      - { name: offered_at, type: datetime, source: system, description: "Instant the claim entered OFFERED; null while never offered" }
      - { name: offer_expires_at, type: datetime, source: system, description: "offered_at + 24h; accept requires logical now < offer_expires_at" }

  - name: PickupPlan
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; the accepted claim being coordinated" }
      - { name: proposer_id, type: string, source: system, description: "FK -> Member.id; member who created the plan (giver or claimer)" }
      - { name: last_proposer_id, type: string, source: system, description: "id of the member who made the most recent proposal/counter on this plan (Member.id); confirm/counter must come from the other party" }
      - { name: window_start, type: datetime, source: input, description: "Porch-pickup window start (closed interval bound)" }
      - { name: window_end, type: datetime, source: input, description: "Porch-pickup window end; must be > window_start" }
      - { name: location_note, type: string, source: input, description: "Porch/doorstep instructions", default: "" }
      - { name: round_number, type: integer, source: system, description: "Negotiation round, starts at 1, +1 per counter; counter rejected when round_number >= 3" }
      - { name: status, type: enum, source: system, description: "PROPOSED | COUNTERED | CONFIRMED | COMPLETED | MISSED | CANCELLED", constraints: "initial PROPOSED" }

  - name: Wishlist
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; the wishing member (actor at creation)" }
      - { name: group_id, type: string, source: input, description: "FK -> NeighborhoodGroup.id; scope of the wish" }
      - { name: keyword, type: string, source: input, description: "Case-insensitive substring matched against GiftPost.title" }
      - { name: category, type: enum, source: input, description: "Optional category filter: FURNITURE | CLOTHING | FOOD | HOUSEHOLD | ELECTRONICS | OTHER; null matches any" }
      - { name: status, type: enum, source: system, description: "ACTIVE | MATCHED | FULFILLED | CANCELLED | EXPIRED", constraints: "initial ACTIVE" }
      - { name: matched_post_id, type: string, source: system, description: "FK -> GiftPost.id; nullable. Set when a matching post is published; cleared when that post is WITHDRAWN or EXPIRED" }
      - { name: expires_at, type: datetime, source: system, description: "created_at + 30 days; clock sweep expires ACTIVE/MATCHED wishlists at this instant" }

  - name: CurbAlert
    parent: null
    common_fields: true
    fields:
      - { name: group_id, type: string, source: input, description: "FK -> NeighborhoodGroup.id" }
      - { name: creator_id, type: string, source: system, description: "FK -> Member.id; the acting member at creation" }
      - { name: zone, type: string, source: input, description: "Free-form block/zone label; capacity rule scopes on (group_id, zone)" }
      - { name: starts_at, type: datetime, source: input, description: "Half-open interval start [starts_at, ends_at)" }
      - { name: ends_at, type: datetime, source: input, description: "Half-open interval end; must be > starts_at" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ACTIVE | ENDED | CANCELLED", constraints: "initial SCHEDULED; sweep flips SCHEDULED->ACTIVE at starts_at and ACTIVE->ENDED at ends_at" }

  - name: Report
    parent: null
    common_fields: true
    fields:
      - { name: group_id, type: string, source: input, description: "FK -> NeighborhoodGroup.id; group whose moderators review the report" }
      - { name: reporter_id, type: string, source: system, description: "FK -> Member.id; the acting member at creation" }
      - { name: target_type, type: enum, source: input, description: "MEMBER | GIFT_POST | CLAIM | CURB_ALERT" }
      - { name: target_id, type: string, source: input, description: "Polymorphic target id, interpreted per target_type: Member.id | GiftPost.id | Claim.id | CurbAlert.id (existence validated against the matching collection)" }
      - { name: category, type: enum, source: input, description: "NO_SHOW | SAFETY | SPAM | PROHIBITED_ITEM | HARASSMENT | OTHER" }
      - { name: details, type: string, source: input, description: "Free-text details", default: "" }
      - { name: status, type: enum, source: system, description: "OPEN | UNDER_REVIEW | RESOLVED_ACTION | RESOLVED_DISMISSED", constraints: "initial OPEN" }
      - { name: reviewed_by, type: string, source: system, description: "Member.id of the reviewing moderator, or the opaque PlatformAdmin id; null until UNDER_REVIEW" }
      - { name: sla_due_at, type: datetime, source: computed, description: "created_at + sla hours keyed on the group health_tier IN EFFECT AT CREATION (GREEN 96h, YELLOW 72h, RED 48h); never recomputed for this report afterwards" }
      - { name: resolved_at, type: datetime, source: system, description: "Instant of resolution; null until terminal. A resolution with resolved_at > sla_due_at counts as an overdue resolution in calc_group_health" }

  - name: ModerationAction
    parent: null
    common_fields: true
    fields:
      - { name: report_id, type: string, source: system, description: "FK -> Report.id; the report whose resolution produced this action" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; subject member, derived from the report target: MEMBER->target_id, GIFT_POST->GiftPost.giver_id, CLAIM->Claim.claimer_id, CURB_ALERT->CurbAlert.creator_id" }
      - { name: action_type, type: enum, source: input, description: "WARNING | STRIKE | CONTENT_REMOVAL; CONTENT_REMOVAL valid only when the report target_type = GIFT_POST" }
      - { name: severity_points, type: integer, source: input, description: "1..3, required iff action_type = STRIKE; feeds Member.active_strike_points" }
      - { name: rationale, type: string, source: input, description: "Moderator rationale", default: "" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXPIRED | OVERTURNED", constraints: "initial ACTIVE; sweep expires at active_until" }
      - { name: active_until, type: datetime, source: system, description: "created_at + 90 days; strikes stop counting toward active_strike_points at this instant" }

  - name: ReputationEvent
    parent: null
    common_fields: false
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; event subject" }
      - { name: event_type, type: enum, source: system, description: "WELCOME_BONUS | GIFT_COMPLETED | RECEIVE_COMPLETED | NO_SHOW_PENALTY | STRIKE_APPLIED" }
      - { name: base_points, type: number, source: system, description: "Pre-weight points: WELCOME_BONUS 5, GIFT_COMPLETED 10, RECEIVE_COMPLETED 3, NO_SHOW_PENALTY -8, STRIKE_APPLIED -2*severity_points" }
      - { name: status, type: enum, source: system, description: "PENDING | SETTLED; sweep settles PENDING events once age >= 7 days", constraints: "initial PENDING" }
      - { name: settled_at, type: datetime, source: system, description: "Instant of settlement; null while PENDING" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Member
    initial_state: ACTIVE
    terminal_states: [BANNED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: strike cascade when active_strike_points crosses >= 3 (on POST /v1/reports/{id}/resolve with STRIKE, or on clock sweep expiring/activating strikes)"
        actor: system
        preconditions: ["active_strike_points >= 3", "active_strike_points < 6"]
        side_effects:
          - "suspension_ends_at := now + 14 days"
          - "cascade: every Claim with claimer_id = member and status IN {QUEUED, OFFERED} -> WITHDRAWN; each OFFERED withdrawal triggers the vacancy cascade on its GiftPost (promote next QUEUED claim per the post's claim_mode, or post RESERVED -> OPEN when no QUEUED claim remains / mode = GIVER_PICK)"
        note: "cyclic with SUSPENDED -> ACTIVE"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system: clock sweep when now >= suspension_ends_at, or POST /v1/moderation-actions/{id}/overturn dropping active_strike_points < 3"
        actor: system
        preconditions: ["now >= suspension_ends_at OR active_strike_points < 3 after overturn"]
        side_effects: ["suspension_ends_at := null", "withdrawn claims/memberships are NOT restored"]
      - from: ACTIVE
        to: BANNED
        trigger: "system: strike cascade when active_strike_points crosses >= 6"
        actor: system
        preconditions: ["active_strike_points >= 6"]
        side_effects:
          - "all GroupMemberships with status IN {REQUESTED, APPROVED} -> REMOVED; each owning group's member_count and roster_status recomputed"
          - "every live claim (QUEUED | OFFERED) -> WITHDRAWN with the same vacancy cascade as suspension"
      - from: SUSPENDED
        to: BANNED
        trigger: "system: strike cascade when active_strike_points crosses >= 6 while suspended"
        actor: system
        preconditions: ["active_strike_points >= 6"]
        side_effects: ["same cascade as ACTIVE -> BANNED"]

  - entity: GroupMembership
    initial_state: REQUESTED
    terminal_states: [REJECTED, LEFT, REMOVED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /v1/memberships/{id}/approve (or inline auto-approve inside POST /v1/memberships when group join_policy = OPEN)"
        actor: GroupModerator
        preconditions: ["membership.status = REQUESTED", "group.roster_status = ACCEPTING (member_count < capacity)"]
        side_effects: ["role := request input role (default MEMBER)", "group.member_count += 1", "group.roster_status recomputed"]
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /v1/memberships/{id}/reject"
        actor: GroupModerator
        preconditions: ["membership.status = REQUESTED"]
        side_effects: []
      - from: APPROVED
        to: LEFT
        trigger: "POST /v1/memberships/{id}/leave"
        actor: Member
        preconditions: ["membership.status = APPROVED", "actor is the membership's member"]
        side_effects:
          - "group.member_count -= 1; roster_status recomputed"
          - "cascade: member's Claims in this group with status IN {QUEUED, OFFERED} -> WITHDRAWN (vacancy cascade per post as on suspension)"
      - from: APPROVED
        to: REMOVED
        trigger: "POST /v1/memberships/{id}/remove, or Member -> BANNED cascade"
        actor: GroupModerator
        preconditions: ["membership.status = APPROVED"]
        side_effects: ["same cascade as APPROVED -> LEFT"]

  - entity: GiftPost
    initial_state: DRAFT
    terminal_states: [WITHDRAWN, EXPIRED, FULFILLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /v1/gift-posts/{id}/publish"
        actor: Member
        preconditions: ["post.status = DRAFT", "actor = post.giver_id", "giver.status = ACTIVE"]
        side_effects: ["wishlist match sweep: every Wishlist in this group with status = ACTIVE whose keyword is a case-insensitive substring of title and (category is null or equals post.category) -> MATCHED with matched_post_id := post.id"]
      - from: OPEN
        to: RESERVED
        trigger: "system: a claim enters OFFERED (auto-promotion on POST /v1/claims, vacancy promotion, or POST /v1/gift-posts/{id}/offer under GIVER_PICK)"
        actor: system
        preconditions: ["exactly one claim of this post in OFFERED"]
        side_effects: ["current_claim_id := offered claim id", "current_offer_expires_at := offered claim's offer_expires_at"]
      - from: RESERVED
        to: OPEN
        trigger: "system: head slot vacated (OFFERED claim DECLINED/EXPIRED/WITHDRAWN, or ACCEPTED claim -> NO_SHOW) AND no QUEUED claim promoted (queue empty or claim_mode = GIVER_PICK)"
        actor: system
        preconditions: ["no claim of this post in {OFFERED, ACCEPTED}"]
        side_effects: ["current_claim_id := null", "current_offer_expires_at := null"]
        note: "RESERVED -> OPEN -> RESERVED cycle is the post's re-offer loop"
      - from: RESERVED
        to: FULFILLED
        trigger: "system: POST /v1/pickup-plans/{id}/complete on a CONFIRMED plan whose claim belongs to this post"
        actor: system
        preconditions: ["head claim ACCEPTED", "pickup plan CONFIRMED"]
        side_effects: ["head claim -> FULFILLED; see PickupPlan COMPLETED side effects for reputation/wishlist cascades"]
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /v1/gift-posts/{id}/withdraw"
        actor: Member
        preconditions: ["actor = giver_id", "status = DRAFT"]
        side_effects: []
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /v1/gift-posts/{id}/withdraw"
        actor: Member
        preconditions: ["actor = giver_id", "status = OPEN"]
        side_effects: ["QUEUED claims -> WITHDRAWN", "Wishlists with matched_post_id = post -> ACTIVE, matched_post_id := null"]
      - from: RESERVED
        to: WITHDRAWN
        trigger: "POST /v1/gift-posts/{id}/withdraw, or CONTENT_REMOVAL ModerationAction targeting this post"
        actor: Member
        preconditions: ["no claim of this post in ACCEPTED status"]
        side_effects: ["QUEUED and OFFERED claims -> WITHDRAWN", "current_claim_id := null", "matched Wishlists -> ACTIVE with matched_post_id := null"]
      - from: OPEN
        to: EXPIRED
        trigger: "system: clock sweep when now >= expires_at"
        actor: system
        preconditions: ["status = OPEN", "now >= expires_at"]
        side_effects: ["QUEUED claims -> WITHDRAWN", "matched Wishlists -> ACTIVE with matched_post_id := null"]

  - entity: Claim
    initial_state: QUEUED
    terminal_states: [FULFILLED, DECLINED, EXPIRED, WITHDRAWN, NO_SHOW]
    transitions:
      - from: QUEUED
        to: OFFERED
        trigger: "system: head-slot vacancy promotion (on claim create, decline/expire/withdraw/no-show of the previous head), or POST /v1/gift-posts/{id}/offer under GIVER_PICK"
        actor: system
        preconditions: ["post has no claim in {OFFERED, ACCEPTED}", "claim is rank 1 among QUEUED claims per post.claim_mode ordering (calc_claim_queue_rank)"]
        side_effects: ["offered_at := now", "offer_expires_at := now + 24h", "post -> RESERVED with current_claim_id / current_offer_expires_at set"]
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /v1/claims/{id}/accept"
        actor: Member
        preconditions: ["actor = claimer_id", "status = OFFERED", "now < offer_expires_at"]
        side_effects: []
      - from: OFFERED
        to: DECLINED
        trigger: "POST /v1/claims/{id}/decline"
        actor: Member
        preconditions: ["actor = claimer_id", "status = OFFERED"]
        side_effects: ["vacancy cascade: promote rank-1 QUEUED claim (FIRST_COME / FAIRNESS_DRAW) or none (GIVER_PICK); if no promotion, post RESERVED -> OPEN"]
      - from: OFFERED
        to: EXPIRED
        trigger: "system: clock sweep when now >= offer_expires_at"
        actor: system
        preconditions: ["status = OFFERED", "now >= offer_expires_at"]
        side_effects: ["same vacancy cascade as DECLINED"]
      - from: OFFERED
        to: WITHDRAWN
        trigger: "POST /v1/claims/{id}/withdraw, or suspension/ban/leave/remove cascade"
        actor: Member
        preconditions: ["status = OFFERED"]
        side_effects: ["same vacancy cascade as DECLINED"]
      - from: QUEUED
        to: WITHDRAWN
        trigger: "POST /v1/claims/{id}/withdraw, or suspension/ban/leave/remove cascade"
        actor: Member
        preconditions: ["status = QUEUED"]
        side_effects: []
      - from: ACCEPTED
        to: FULFILLED
        trigger: "system: POST /v1/pickup-plans/{id}/complete"
        actor: system
        preconditions: ["pickup plan CONFIRMED"]
        side_effects: ["post -> FULFILLED", "ReputationEvents created (see PickupPlan COMPLETED)", "claimer's matching Wishlists (keyword substring of post title, category match) in this group with status IN {ACTIVE, MATCHED} -> FULFILLED", "giver.given_count_90d / claimer.received_count_90d recomputed", "group.health_score recomputed (completed_gifts_30d)"]
      - from: ACCEPTED
        to: NO_SHOW
        trigger: "system: POST /v1/pickup-plans/{id}/miss"
        actor: system
        preconditions: ["pickup plan CONFIRMED", "now > window_end"]
        side_effects: ["NO_SHOW_PENALTY ReputationEvent (-8, PENDING) for claimer", "vacancy cascade as on DECLINED (item returns to the queue)"]

  - entity: PickupPlan
    initial_state: PROPOSED
    terminal_states: [COMPLETED, MISSED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /v1/pickup-plans/{id}/counter"
        actor: Member
        preconditions: ["actor is giver or claimer of the claim", "actor != last_proposer_id", "round_number < 3", "window_end > window_start", "new window passes the giver porch overlap rule (val_pickup_window_overlap)"]
        side_effects: ["round_number += 1", "last_proposer_id := actor", "window_start/window_end replaced"]
        note: "PROPOSED -> COUNTERED -> COUNTERED -> ... is the negotiation loop (max 3 rounds)"
      - from: COUNTERED
        to: COUNTERED
        trigger: "POST /v1/pickup-plans/{id}/counter"
        actor: Member
        preconditions: ["same as PROPOSED -> COUNTERED"]
        side_effects: ["same as PROPOSED -> COUNTERED"]
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /v1/pickup-plans/{id}/confirm"
        actor: Member
        preconditions: ["actor is giver or claimer of the claim", "actor != last_proposer_id", "window passes the giver porch overlap rule"]
        side_effects: []
      - from: COUNTERED
        to: CONFIRMED
        trigger: "POST /v1/pickup-plans/{id}/confirm"
        actor: Member
        preconditions: ["same as PROPOSED -> CONFIRMED"]
        side_effects: []
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /v1/pickup-plans/{id}/cancel"
        actor: Member
        preconditions: ["actor is giver or claimer"]
        side_effects: []
      - from: COUNTERED
        to: CANCELLED
        trigger: "POST /v1/pickup-plans/{id}/cancel"
        actor: Member
        preconditions: ["actor is giver or claimer"]
        side_effects: []
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /v1/pickup-plans/{id}/complete"
        actor: Member
        preconditions: ["actor = giver of the claim's post", "status = CONFIRMED"]
        side_effects:
          - "claim ACCEPTED -> FULFILLED (and its side effects)"
          - "ReputationEvent GIFT_COMPLETED (+10, PENDING) for the giver; RECEIVE_COMPLETED (+3, PENDING) for the claimer"
      - from: CONFIRMED
        to: MISSED
        trigger: "POST /v1/pickup-plans/{id}/miss"
        actor: Member
        preconditions: ["actor = giver of the claim's post", "status = CONFIRMED", "now > window_end"]
        side_effects: ["claim ACCEPTED -> NO_SHOW (and its side effects, including vacancy cascade)"]

  - entity: Wishlist
    initial_state: ACTIVE
    terminal_states: [FULFILLED, CANCELLED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: MATCHED
        trigger: "system: a GiftPost in the same group is published matching (keyword case-insensitive substring of title) AND (wishlist.category null OR = post.category)"
        actor: system
        preconditions: ["status = ACTIVE"]
        side_effects: ["matched_post_id := post.id"]
        note: "ACTIVE -> MATCHED -> ACTIVE is the rematch cycle"
      - from: MATCHED
        to: ACTIVE
        trigger: "system: the matched post becomes WITHDRAWN or EXPIRED"
        actor: system
        preconditions: ["matched_post.status IN {WITHDRAWN, EXPIRED}"]
        side_effects: ["matched_post_id := null"]
      - from: ACTIVE
        to: FULFILLED
        trigger: "system: a claim by this wishlist's member in this group reaches FULFILLED on a post matching keyword/category"
        actor: system
        preconditions: ["fulfilled claim's post matches"]
        side_effects: []
      - from: MATCHED
        to: FULFILLED
        trigger: "system: same as ACTIVE -> FULFILLED"
        actor: system
        preconditions: ["fulfilled claim's post matches"]
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /v1/wishlists/{id}/cancel"
        actor: Member
        preconditions: ["actor = member_id", "status IN {ACTIVE, MATCHED}"]
        side_effects: []
      - from: MATCHED
        to: CANCELLED
        trigger: "POST /v1/wishlists/{id}/cancel"
        actor: Member
        preconditions: ["actor = member_id", "status IN {ACTIVE, MATCHED}"]
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: clock sweep when now >= expires_at"
        actor: system
        preconditions: ["now >= expires_at"]
        side_effects: []
      - from: MATCHED
        to: EXPIRED
        trigger: "system: clock sweep when now >= expires_at"
        actor: system
        preconditions: ["now >= expires_at"]
        side_effects: ["matched_post_id := null"]

  - entity: CurbAlert
    initial_state: SCHEDULED
    terminal_states: [ENDED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "system: clock sweep when now >= starts_at"
        actor: system
        preconditions: ["status = SCHEDULED", "now >= starts_at"]
        side_effects: []
      - from: ACTIVE
        to: ENDED
        trigger: "system: clock sweep when now >= ends_at"
        actor: system
        preconditions: ["status = ACTIVE", "now >= ends_at"]
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /v1/curb-alerts/{id}/cancel"
        actor: Member
        preconditions: ["actor = creator_id OR actor holds MODERATOR membership in the group"]
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /v1/curb-alerts/{id}/cancel"
        actor: Member
        preconditions: ["actor = creator_id OR actor holds MODERATOR membership in the group"]
        side_effects: []

  - entity: Report
    initial_state: OPEN
    terminal_states: [RESOLVED_ACTION, RESOLVED_DISMISSED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /v1/reports/{id}/start-review"
        actor: GroupModerator
        preconditions: ["status = OPEN", "actor moderates report.group_id (or PlatformAdmin)"]
        side_effects: ["reviewed_by := actor id"]
      - from: UNDER_REVIEW
        to: RESOLVED_DISMISSED
        trigger: "POST /v1/reports/{id}/resolve with resolution = DISMISS"
        actor: GroupModerator
        preconditions: ["status = UNDER_REVIEW"]
        side_effects: ["resolved_at := now", "group.health_score recomputed (one fewer open report; overdue if resolved_at > sla_due_at)"]
      - from: UNDER_REVIEW
        to: RESOLVED_ACTION
        trigger: "POST /v1/reports/{id}/resolve with resolution = ACTION"
        actor: GroupModerator
        preconditions: ["status = UNDER_REVIEW", "action_type present; severity_points present iff action_type = STRIKE; CONTENT_REMOVAL only when target_type = GIFT_POST"]
        side_effects:
          - "create ModerationAction (subject member derived from target per ModerationAction.member_id)"
          - "if STRIKE: STRIKE_APPLIED ReputationEvent (-2*severity_points, PENDING) for subject; subject.active_strike_points recomputed -> possible Member ACTIVE->SUSPENDED / ->BANNED cascade (which itself withdraws live claims and triggers queue promotions on affected posts)"
          - "if CONTENT_REMOVAL: target GiftPost -> WITHDRAWN per its RESERVED/OPEN->WITHDRAWN transition side effects"
          - "resolved_at := now; group.health_score recomputed"

  - entity: ModerationAction
    initial_state: ACTIVE
    terminal_states: [EXPIRED, OVERTURNED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: clock sweep when now >= active_until"
        actor: system
        preconditions: ["now >= active_until"]
        side_effects: ["subject.active_strike_points recomputed (expired strikes stop counting); if subject SUSPENDED and points < 3 -> reinstate per Member SUSPENDED -> ACTIVE"]
      - from: ACTIVE
        to: OVERTURNED
        trigger: "POST /v1/moderation-actions/{id}/overturn"
        actor: PlatformAdmin
        preconditions: ["status = ACTIVE"]
        side_effects: ["subject.active_strike_points recomputed; if subject SUSPENDED and points < 3 -> ACTIVE with suspension_ends_at := null; if subject BANNED and points < 6 -> SUSPENDED (points >= 3) or ACTIVE (points < 3)"]

  - entity: ReputationEvent
    initial_state: PENDING
    terminal_states: [SETTLED]
    transitions:
      - from: PENDING
        to: SETTLED
        trigger: "system: clock sweep when age >= 7 days"
        actor: system
        preconditions: ["now >= created_at + 7 days"]
        side_effects: ["settled_at := now", "member.reputation_score / pending_reputation_score reflect the new SETTLED set on next read"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: gift-post-update-stale-version
    parent_entity: GiftPost
    write_endpoint: "PUT /v1/gift-posts/{id}"
    occ_field: expected_gift_post_version
    description: |
      Updating a GiftPost whose version has advanced since the client last
      observed it is rejected. This captures the case where another write
      (an edit, or a cascade that bumped the post) legitimately moved the
      post forward and the current writer's view of the post is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: group-policy-update-stale-version
    parent_entity: NeighborhoodGroup
    write_endpoint: "PUT /v1/groups/{id}"
    occ_field: expected_group_version
    description: |
      Updating a NeighborhoodGroup's policy whose version has advanced since
      the client last observed it is rejected; the writer must re-read the
      group and resubmit against the fresh version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: calc_reputation_score
    trigger: "on every read of Member (reputation_score / pending_reputation_score), and conceptually after any ReputationEvent creation or settlement sweep"
    algorithm: aggregation
    formula: |
      weight(days_old) = 1.0 if days_old <= 30; 0.75 if 31 <= days_old <= 90; 0.5 if days_old > 90
        where days_old = floor((now - event.created_at) / 86400 seconds)
      event_points(e) = round_half_up(e.base_points * weight(days_old(e)), 1 decimal)
      ORDER PINNED: round each event FIRST to 1 decimal, THEN sum.
      official  = sum(event_points(e) for e in ReputationEvent where e.member_id = member AND e.status = SETTLED)
      pending   = sum(event_points(e) for e in ReputationEvent where e.member_id = member AND e.status IN {PENDING, SETTLED})
      Empty input set sums to 0.0.
    input_set: "ReputationEvents of the member; official includes only status=SETTLED, pending includes PENDING+SETTLED"
    constants:
      WELCOME_BONUS_POINTS: 5
      GIFT_COMPLETED_POINTS: 10
      RECEIVE_COMPLETED_POINTS: 3
      NO_SHOW_PENALTY_POINTS: -8
      STRIKE_APPLIED_MULTIPLIER: -2
      SETTLE_AFTER_DAYS: 7
      WEIGHT_FULL_MAX_DAYS: 30
      WEIGHT_MID_MAX_DAYS: 90
      WEIGHT_MID: 0.75
      WEIGHT_OLD: 0.5
    precision: "1 decimal place per event, round_half_up, per-event rounding before summation"
    variants:
      - name: official
        when: "Member.reputation_score"
        difference: "sums SETTLED events only"
      - name: provisional
        when: "Member.pending_reputation_score"
        difference: "sums PENDING + SETTLED events; diverges from official whenever any event is PENDING"

  - name: calc_claim_queue_rank
    trigger: "on claim creation (head-slot check) and on every head-slot vacancy (decline / offer expiry sweep / withdraw / no-show / suspension cascade)"
    algorithm: weighted_scoring
    formula: |
      eligibility: claims of the post with status = QUEUED
      FIRST_COME:    order by created_at ASC, tie-break claim_seq ASC
      FAIRNESS_DRAW: order by claimer.fairness_score DESC, tie-break created_at ASC, then claim_seq ASC
      GIVER_PICK:    no automatic promotion; the giver selects any QUEUED claim via POST /v1/gift-posts/{id}/offer
      Promotion fires only when no claim of the post is in {OFFERED, ACCEPTED}.
      Empty eligible set under FIRST_COME / FAIRNESS_DRAW -> post RESERVED -> OPEN.
    input_set: "Claims with post_id = post and status = QUEUED"
    constants:
      OFFER_WINDOW_HOURS: 24
    precision: "integer scores; timestamps at 1-second granularity"
    variants:
      - name: first_come
        when: "post.claim_mode = FIRST_COME"
        difference: "pure chronological order; claimer attributes ignored"
      - name: fairness_draw
        when: "post.claim_mode = FAIRNESS_DRAW"
        difference: "fairness_score DESC dominates created_at; identical queue contents can promote a different claimer than first_come"
      - name: giver_pick
        when: "post.claim_mode = GIVER_PICK"
        difference: "no automatic promotion at all; selection is explicit by the giver"

  - name: calc_fairness_score
    trigger: "on every read of Member.fairness_score and inside calc_claim_queue_rank under FAIRNESS_DRAW"
    algorithm: weighted_scoring
    formula: |
      raw = 50
          + 2 * member.given_count_90d
          - 3 * member.received_count_90d
          - 10 * member.active_strike_points
          + (5 if floor((now - member.created_at)/86400) >= 180 else 0)
      fairness_score = min(100, max(0, raw))
    input_set: "the single Member row; given/received counts include only FULFILLED posts/claims whose fulfillment instant falls within the trailing 90 whole days"
    constants:
      BASE: 50
      GIVEN_WEIGHT: 2
      RECEIVED_WEIGHT: -3
      STRIKE_WEIGHT: -10
      SENIORITY_BONUS: 5
      SENIORITY_MIN_DAYS: 180
      FLOOR: 0
      CEILING: 100
    precision: "integer arithmetic, no rounding"

  - name: calc_group_health
    trigger: "after each report creation, each report resolution, each gift completion, and each clock sweep"
    algorithm: aggregation
    formula: |
      completed_gifts_30d   = count(GiftPost in group reaching FULFILLED within trailing 30 whole days)
      open_reports          = count(Report in group with status IN {OPEN, UNDER_REVIEW})
      overdue_resolutions_30d = count(Report in group resolved within trailing 30 whole days with resolved_at > sla_due_at)
      health_score = 2*completed_gifts_30d - 5*open_reports - 10*overdue_resolutions_30d
      health_tier  = GREEN if health_score >= 20; YELLOW if 0 <= health_score <= 19; RED if health_score < 0
      EVALUATION ORDER PINNED (breaks the apparent circle): a report's sla_due_at is
      computed ONCE at creation from the tier in effect at that instant; tier changes
      caused by resolving reports apply only to reports created afterwards.
      sla_hours(tier) = GREEN: 96, YELLOW: 72, RED: 48
    input_set: "GiftPosts, Reports of the group with the status filters above"
    constants:
      GIFT_POINTS: 2
      OPEN_REPORT_PENALTY: 5
      OVERDUE_PENALTY: 10
      GREEN_MIN: 20
      RED_MAX: -1
      SLA_GREEN_HOURS: 96
      SLA_YELLOW_HOURS: 72
      SLA_RED_HOURS: 48
    precision: "integer arithmetic"

  - name: calc_offer_expiry
    trigger: "on claim promotion (OFFERED) and checked inline on POST /v1/claims/{id}/accept"
    algorithm: threshold
    formula: |
      offer_expires_at = offered_at + 24 hours
      accept is valid iff now < offer_expires_at; at now >= offer_expires_at the clock sweep
      moves the claim OFFERED -> EXPIRED and accept then fails state validation.
    input_set: "the single head claim"
    constants:
      OFFER_WINDOW_HOURS: 24
    precision: "1-second granularity; boundary now == offer_expires_at is EXPIRED (strict < for acceptance)"

  - name: calc_strike_thresholds
    trigger: "after any ModerationAction creation, overturn, or expiry sweep"
    algorithm: threshold
    formula: |
      active_strike_points = sum(severity_points of ModerationAction where member_id = member
                                 AND action_type = STRIKE AND status = ACTIVE)
      points >= 6               -> Member -> BANNED
      3 <= points < 6           -> Member ACTIVE -> SUSPENDED (suspension_ends_at = now + 14 days)
      points < 3 and SUSPENDED  -> reinstate to ACTIVE (only via sweep at suspension_ends_at or via overturn/expiry recompute)
      Boundary pinned: suspension fires at points == 3 exactly (>=, not >).
    input_set: "ModerationActions of the member with the filters above"
    constants:
      SUSPEND_THRESHOLD_POINTS: 3
      BAN_THRESHOLD_POINTS: 6
      STRIKE_TTL_DAYS: 90
      SUSPENSION_DAYS: 14
    precision: "integer points"

  - name: calc_pickup_window_overlap
    trigger: "on POST /v1/pickup-plans (create), POST /v1/pickup-plans/{id}/counter, POST /v1/pickup-plans/{id}/confirm"
    algorithm: interval_merge
    formula: |
      Resource: the GIVER's porch, keyed by giver_id of the claim's post.
      Competing set: PickupPlans with status = CONFIRMED whose claim's post.giver_id = giver_id.
      Closed-interval semantics with a 15-minute buffer on BOTH sides:
        conflict iff new_start < existing_end + 15min AND new_end > existing_start - 15min
      Strict inequalities pin the boundary: a new window starting exactly at
      existing_end + 15min does NOT conflict.
    input_set: "giver's CONFIRMED PickupPlans only (PROPOSED/COUNTERED/COMPLETED/MISSED/CANCELLED do not block)"
    constants:
      PICKUP_BUFFER_MINUTES: 15
    precision: "1-second granularity"

  - name: calc_curb_alert_capacity
    trigger: "on POST /v1/curb-alerts"
    algorithm: interval_merge
    formula: |
      Resource: (group_id, zone) pair.
      Half-open interval semantics: [starts_at, ends_at); two intervals overlap iff
        a.starts_at < b.ends_at AND b.starts_at < a.ends_at
      Adjacent intervals (a.ends_at == b.starts_at) do NOT overlap.
      Aggregate capacity: reject when the count of existing alerts in the same
      (group_id, zone) with status IN {SCHEDULED, ACTIVE} that overlap the new
      interval is >= 3. (I.e., at most 3 mutually overlapping live alerts per zone;
      the 4th overlapping one is rejected.)
    input_set: "CurbAlerts with same (group_id, zone), status IN {SCHEDULED, ACTIVE}"
    constants:
      CURB_ZONE_MAX_OVERLAP: 3
    precision: "1-second granularity"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed; X-User-ID required for entity-backed roles, omitted for Anonymous/PlatformAdmin"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "role permitted for this endpoint per §1.5 roles; GroupModerator additionally requires an APPROVED GroupMembership with role=MODERATOR in the target group"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "request body schema: required fields present, types valid, enum values in range, email format valid; unknown fields rejected"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"
  - priority: 4
    category: existence
    check: "referenced resources exist, validated left-to-right: path ids first, then body FKs (group_id, post_id, claim_id, target_id interpreted per target_type)"
    error_id: "ERR_MEMBER_NOT_FOUND | ERR_GROUP_NOT_FOUND | ERR_MEMBERSHIP_NOT_FOUND | ERR_GIFT_POST_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_PICKUP_PLAN_NOT_FOUND | ERR_WISHLIST_NOT_FOUND | ERR_CURB_ALERT_NOT_FOUND | ERR_REPORT_NOT_FOUND | ERR_MODERATION_ACTION_NOT_FOUND"
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: state
    check: "OCC: expected_gift_post_version == GiftPost.version / expected_group_version == NeighborhoodGroup.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PUT /v1/gift-posts/{id}, PUT /v1/groups/{id}"
  - priority: 6
    category: state
    check: "target resource in a valid state for the operation (per §1.2 preconditions): post DRAFT for publish, post OPEN for claim/offer, post withdrawable, claim OFFERED for accept/decline, claim ACCEPTED for pickup create, claim QUEUED/OFFERED for withdraw, plan negotiable for counter/confirm, plan CONFIRMED for complete/miss, membership REQUESTED for approve/reject, membership APPROVED for leave/remove, wishlist ACTIVE/MATCHED for cancel, alert SCHEDULED/ACTIVE for cancel, report OPEN for start-review, report UNDER_REVIEW for resolve, action ACTIVE for overturn"
    error_id: "ERR_POST_NOT_DRAFT | ERR_POST_NOT_OPEN | ERR_POST_NOT_WITHDRAWABLE | ERR_CLAIM_NOT_OFFERED | ERR_CLAIM_NOT_ACCEPTED | ERR_CLAIM_NOT_WITHDRAWABLE | ERR_PICKUP_NOT_NEGOTIABLE | ERR_PICKUP_NOT_CONFIRMED | ERR_PICKUP_WINDOW_NOT_PASSED | ERR_CURB_ALERT_NOT_CANCELLABLE | ERR_WISHLIST_NOT_ACTIVE | ERR_REPORT_NOT_OPEN | ERR_REPORT_NOT_UNDER_REVIEW | ERR_ACTION_NOT_OVERTURNABLE | ERR_MEMBERSHIP_NOT_REQUESTED | ERR_MEMBERSHIP_NOT_APPROVED"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: business_safety
    check: "actor member.status = ACTIVE for content-creating operations (memberships, gift-posts, claims, pickup-plans, wishlists, curb-alerts, reports)"
    error_id: "ERR_MEMBER_SUSPENDED | ERR_MEMBER_BANNED"
    http_status: 403
    applies_to: "POST /v1/memberships, POST /v1/gift-posts, POST /v1/claims, POST /v1/pickup-plans, POST /v1/wishlists, POST /v1/curb-alerts, POST /v1/reports"
  - priority: 8
    category: business_referential
    check: "relationship rules: actor holds APPROVED membership in the target group (ERR_NOT_GROUP_MEMBER); actor owns the resource (ERR_NOT_RESOURCE_OWNER); counter/confirm actor != last_proposer_id (ERR_NOT_COUNTERPARTY); no second live claim per (post_id, claimer_id) (ERR_DUPLICATE_CLAIM); claimer != giver (ERR_SELF_CLAIM); no second live membership per (member_id, group_id) (ERR_MEMBERSHIP_EXISTS); giver-offer target claim belongs to the post and is QUEUED (ERR_CLAIM_NOT_QUEUED); negotiation round_number < 3 (ERR_MAX_NEGOTIATION_ROUNDS)"
    error_id: "ERR_NOT_GROUP_MEMBER | ERR_NOT_RESOURCE_OWNER | ERR_NOT_COUNTERPARTY | ERR_DUPLICATE_CLAIM | ERR_SELF_CLAIM | ERR_MEMBERSHIP_EXISTS | ERR_CLAIM_NOT_QUEUED | ERR_MAX_NEGOTIATION_ROUNDS"
    http_status: 409
    applies_to: "membership, claim, pickup-plan, offer endpoints (ERR_SELF_CLAIM and ERR_MAX_NEGOTIATION_ROUNDS return 422; ERR_NOT_GROUP_MEMBER, ERR_NOT_RESOURCE_OWNER, ERR_NOT_COUNTERPARTY return 403)"
  - priority: 9
    category: business_temporal
    check: "time rules: window_end > window_start / ends_at > starts_at / expires_at > now (ERR_INVALID_TIME_RANGE); giver porch overlap per calc_pickup_window_overlap (ERR_PICKUP_WINDOW_CONFLICT); zone overlap capacity per calc_curb_alert_capacity (ERR_CURB_ALERT_CAPACITY)"
    error_id: "ERR_INVALID_TIME_RANGE | ERR_PICKUP_WINDOW_CONFLICT | ERR_CURB_ALERT_CAPACITY"
    http_status: 409
    applies_to: "POST /v1/gift-posts (expires_at), POST /v1/pickup-plans, POST /v1/pickup-plans/{id}/counter, POST /v1/pickup-plans/{id}/confirm, POST /v1/curb-alerts (ERR_INVALID_TIME_RANGE returns 422)"
  - priority: 10
    category: business_constraint
    check: "capacity: group roster has room (member_count < capacity) before membership approve"
    error_id: ERR_GROUP_FULL
    http_status: 409
    applies_to: "POST /v1/memberships, POST /v1/memberships/{id}/approve"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/v1/members", description: "Register a member; creates WELCOME_BONUS reputation event (+5, PENDING)", roles: [Anonymous], code: 201, input: [email, display_name], output: Member, side_effects: [create ReputationEvent WELCOME_BONUS] }
  - { method: GET, path: "/v1/members/{id}", description: "Read a member incl. computed reputation/fairness/strike fields", roles: [Member, GroupModerator, PlatformAdmin], code: 200, input: [], output: Member, side_effects: [] }
  - { method: GET, path: "/v1/members/{id}/reputation-events", description: "Reverse-reachability: reputation events of a member", roles: [Member, GroupModerator, PlatformAdmin], code: 200, input: ["status?", "limit?", "offset?"], output: "ReputationEvent[]", side_effects: [] }

  - { method: POST, path: "/v1/groups", description: "Create a neighborhood geo-group", roles: [PlatformAdmin], code: 201, input: [name, zip_code, "join_policy?", "capacity?"], output: NeighborhoodGroup, side_effects: [] }
  - { method: GET, path: "/v1/groups/{id}", description: "Read a group incl. member_count, roster_status, health", roles: [Member, GroupModerator, PlatformAdmin], code: 200, input: [], output: NeighborhoodGroup, side_effects: [] }
  - { method: PUT, path: "/v1/groups/{id}", description: "Update group policy (OCC on group version)", roles: [GroupModerator, PlatformAdmin], code: 200, input: ["name?", "join_policy?", "capacity?", expected_group_version], output: NeighborhoodGroup, side_effects: ["increments NeighborhoodGroup.version by 1", "roster_status recomputed on capacity change"] }

  - { method: POST, path: "/v1/memberships", description: "Request to join a group; OPEN policy auto-approves inline", roles: [Member], code: 201, input: [group_id], output: GroupMembership, side_effects: ["if group.join_policy = OPEN: status APPROVED, member_count += 1, roster_status recomputed"] }
  - { method: GET, path: "/v1/memberships/{id}", description: "Read a membership", roles: [Member, GroupModerator, PlatformAdmin], code: 200, input: [], output: GroupMembership, side_effects: [] }
  - { method: GET, path: "/v1/memberships", description: "Filtered list of memberships", roles: [Member, GroupModerator, PlatformAdmin], code: 200, input: ["member_id?", "group_id?", "status?", "role?", "limit?", "offset?"], output: "GroupMembership[]", side_effects: [] }
  - { method: POST, path: "/v1/memberships/{id}/approve", description: "Approve a REQUESTED membership; optional role assignment", roles: [GroupModerator, PlatformAdmin], code: 200, input: ["role?"], output: GroupMembership, side_effects: ["member_count += 1", "roster_status recomputed"] }
  - { method: POST, path: "/v1/memberships/{id}/reject", description: "Reject a REQUESTED membership", roles: [GroupModerator, PlatformAdmin], code: 200, input: [], output: GroupMembership, side_effects: [] }
  - { method: POST, path: "/v1/memberships/{id}/leave", description: "Member leaves a group", roles: [Member], code: 200, input: [], output: GroupMembership, side_effects: ["member_count -= 1", "roster_status recomputed", "member's QUEUED/OFFERED claims in the group -> WITHDRAWN with vacancy cascade"] }
  - { method: POST, path: "/v1/memberships/{id}/remove", description: "Moderator removes a member from the group", roles: [GroupModerator, PlatformAdmin], code: 200, input: [], output: GroupMembership, side_effects: ["same cascade as leave"] }

  - { method: POST, path: "/v1/gift-posts", description: "Create a gift post in DRAFT", roles: [Member], code: 201, input: [group_id, title, category, claim_mode, expires_at, "description?"], output: GiftPost, side_effects: [] }
  - { method: GET, path: "/v1/gift-posts/{id}", description: "Read a gift post", roles: [Member, GroupModerator, PlatformAdmin], code: 200, input: [], output: GiftPost, side_effects: [] }
  - { method: GET, path: "/v1/gift-posts", description: "Filtered list of gift posts", roles: [Member, GroupModerator, PlatformAdmin], code: 200, input: ["group_id?", "giver_id?", "status?", "category?", "limit?", "offset?"], output: "GiftPost[]", side_effects: [] }
  - { method: PUT, path: "/v1/gift-posts/{id}", description: "Edit a DRAFT/OPEN post (OCC on post version)", roles: [Member], code: 200, input: ["title?", "description?", "category?", "expires_at?", expected_gift_post_version], output: GiftPost, side_effects: ["increments GiftPost.version by 1"] }
  - { method: POST, path: "/v1/gift-posts/{id}/publish", description: "Publish DRAFT -> OPEN; triggers wishlist match sweep", roles: [Member], code: 200, input: [], output: GiftPost, side_effects: ["matching ACTIVE wishlists in group -> MATCHED"] }
  - { method: POST, path: "/v1/gift-posts/{id}/withdraw", description: "Withdraw a post (blocked while a claim is ACCEPTED)", roles: [Member], code: 200, input: [], output: GiftPost, side_effects: ["live claims -> WITHDRAWN", "matched wishlists -> ACTIVE"] }
  - { method: POST, path: "/v1/gift-posts/{id}/offer", description: "GIVER_PICK: giver offers the item to a specific QUEUED claim", roles: [Member], code: 200, input: [claim_id], output: Claim, side_effects: ["claim QUEUED -> OFFERED (offered_at, offer_expires_at set)", "post OPEN -> RESERVED"] }

  - { method: POST, path: "/v1/claims", description: "Claim an OPEN post; auto-promotes to OFFERED when the head slot is vacant and mode != GIVER_PICK", roles: [Member], code: 201, input: [post_id], output: Claim, side_effects: ["claim_seq assigned", "possible QUEUED -> OFFERED promotion and post OPEN -> RESERVED"] }
  - { method: GET, path: "/v1/claims/{id}", description: "Read a claim", roles: [Member, GroupModerator, PlatformAdmin], code: 200, input: [], output: Claim, side_effects: [] }
  - { method: GET, path: "/v1/claims", description: "Filtered list of claims", roles: [Member, GroupModerator, PlatformAdmin], code: 200, input: ["post_id?", "claimer_id?", "status?", "limit?", "offset?"], output: "Claim[]", side_effects: [] }
  - { method: POST, path: "/v1/claims/{id}/accept", description: "Claimer accepts an offer (requires now < offer_expires_at)", roles: [Member], code: 200, input: [], output: Claim, side_effects: [] }
  - { method: POST, path: "/v1/claims/{id}/decline", description: "Claimer declines an offer; triggers vacancy cascade", roles: [Member], code: 200, input: [], output: Claim, side_effects: ["promote rank-1 QUEUED claim or post RESERVED -> OPEN"] }
  - { method: POST, path: "/v1/claims/{id}/withdraw", description: "Claimer withdraws a QUEUED/OFFERED claim; vacancy cascade when head", roles: [Member], code: 200, input: [], output: Claim, side_effects: ["same vacancy cascade as decline when the claim was OFFERED"] }

  - { method: POST, path: "/v1/pickup-plans", description: "Propose a porch-pickup window for an ACCEPTED claim", roles: [Member], code: 201, input: [claim_id, window_start, window_end, "location_note?"], output: PickupPlan, side_effects: [] }
  - { method: GET, path: "/v1/pickup-plans/{id}", description: "Read a pickup plan", roles: [Member, GroupModerator, PlatformAdmin], code: 200, input: [], output: PickupPlan, side_effects: [] }
  - { method: GET, path: "/v1/pickup-plans", description: "Filtered list of pickup plans", roles: [Member, GroupModerator, PlatformAdmin], code: 200, input: ["claim_id?", "proposer_id?", "status?", "limit?", "offset?"], output: "PickupPlan[]", side_effects: [] }
  - { method: POST, path: "/v1/pickup-plans/{id}/counter", description: "Counter-propose a new window (max 3 rounds, alternating parties)", roles: [Member], code: 200, input: [window_start, window_end, "location_note?"], output: PickupPlan, side_effects: ["round_number += 1", "last_proposer_id := actor"] }
  - { method: POST, path: "/v1/pickup-plans/{id}/confirm", description: "Confirm the latest proposal (by the party who did not propose it)", roles: [Member], code: 200, input: [], output: PickupPlan, side_effects: [] }
  - { method: POST, path: "/v1/pickup-plans/{id}/cancel", description: "Cancel a negotiable plan", roles: [Member], code: 200, input: [], output: PickupPlan, side_effects: [] }
  - { method: POST, path: "/v1/pickup-plans/{id}/complete", description: "Giver confirms the porch pickup happened", roles: [Member], code: 200, input: [], output: PickupPlan, side_effects: ["claim -> FULFILLED", "post -> FULFILLED", "GIFT_COMPLETED/RECEIVE_COMPLETED reputation events", "wishlist fulfillment sweep", "health recompute"] }
  - { method: POST, path: "/v1/pickup-plans/{id}/miss", description: "Giver reports a no-show after the window has passed", roles: [Member], code: 200, input: [], output: PickupPlan, side_effects: ["claim -> NO_SHOW", "NO_SHOW_PENALTY reputation event", "vacancy cascade"] }

  - { method: POST, path: "/v1/wishlists", description: "Create a wishlist entry (expires at created_at + 30d)", roles: [Member], code: 201, input: [group_id, keyword, "category?"], output: Wishlist, side_effects: [] }
  - { method: GET, path: "/v1/wishlists/{id}", description: "Read a wishlist", roles: [Member, GroupModerator, PlatformAdmin], code: 200, input: [], output: Wishlist, side_effects: [] }
  - { method: GET, path: "/v1/wishlists", description: "Filtered list of wishlists", roles: [Member, GroupModerator, PlatformAdmin], code: 200, input: ["member_id?", "group_id?", "matched_post_id?", "status?", "limit?", "offset?"], output: "Wishlist[]", side_effects: [] }
  - { method: POST, path: "/v1/wishlists/{id}/cancel", description: "Cancel an ACTIVE/MATCHED wishlist", roles: [Member], code: 200, input: [], output: Wishlist, side_effects: [] }

  - { method: POST, path: "/v1/curb-alerts", description: "Create a curb-alert event window (zone overlap capacity 3, half-open intervals)", roles: [Member], code: 201, input: [group_id, zone, starts_at, ends_at], output: CurbAlert, side_effects: [] }
  - { method: GET, path: "/v1/curb-alerts/{id}", description: "Read a curb alert", roles: [Member, GroupModerator, PlatformAdmin], code: 200, input: [], output: CurbAlert, side_effects: [] }
  - { method: GET, path: "/v1/curb-alerts", description: "Filtered list of curb alerts", roles: [Member, GroupModerator, PlatformAdmin], code: 200, input: ["group_id?", "creator_id?", "zone?", "status?", "limit?", "offset?"], output: "CurbAlert[]", side_effects: [] }
  - { method: POST, path: "/v1/curb-alerts/{id}/cancel", description: "Cancel a SCHEDULED/ACTIVE curb alert (creator or group moderator)", roles: [Member, GroupModerator], code: 200, input: [], output: CurbAlert, side_effects: [] }

  - { method: POST, path: "/v1/reports", description: "File a moderation report; sla_due_at from the group's health tier at creation", roles: [Member], code: 201, input: [group_id, target_type, target_id, category, "details?"], output: Report, side_effects: ["group.health_score recomputed (one more open report)"] }
  - { method: GET, path: "/v1/reports/{id}", description: "Read a report (reporter, group moderator, or admin)", roles: [Member, GroupModerator, PlatformAdmin], code: 200, input: [], output: Report, side_effects: [] }
  - { method: GET, path: "/v1/reports", description: "Filtered list of reports", roles: [GroupModerator, PlatformAdmin], code: 200, input: ["group_id?", "reporter_id?", "status?", "limit?", "offset?"], output: "Report[]", side_effects: [] }
  - { method: POST, path: "/v1/reports/{id}/start-review", description: "OPEN -> UNDER_REVIEW", roles: [GroupModerator, PlatformAdmin], code: 200, input: [], output: Report, side_effects: ["reviewed_by := actor"] }
  - { method: POST, path: "/v1/reports/{id}/resolve", description: "Resolve with DISMISS or ACTION (WARNING | STRIKE | CONTENT_REMOVAL)", roles: [GroupModerator, PlatformAdmin], code: 200, input: [resolution, "action_type?", "severity_points?", "rationale?"], output: Report, side_effects: ["on ACTION: create ModerationAction", "on STRIKE: strike cascade (possible suspension/ban with claim withdrawals and queue promotions)", "on CONTENT_REMOVAL: target post withdrawn", "health recompute"] }

  - { method: GET, path: "/v1/moderation-actions/{id}", description: "Read a moderation action", roles: [Member, GroupModerator, PlatformAdmin], code: 200, input: [], output: ModerationAction, side_effects: [] }
  - { method: GET, path: "/v1/moderation-actions", description: "Filtered list of moderation actions", roles: [Member, GroupModerator, PlatformAdmin], code: 200, input: ["report_id?", "member_id?", "status?", "limit?", "offset?"], output: "ModerationAction[]", side_effects: [] }
  - { method: POST, path: "/v1/moderation-actions/{id}/overturn", description: "Overturn an ACTIVE action; strike recompute may reinstate the member", roles: [PlatformAdmin], code: 200, input: [], output: ModerationAction, side_effects: ["active_strike_points recompute", "possible SUSPENDED -> ACTIVE / BANNED -> SUSPENDED|ACTIVE"] }

  - { method: GET, path: "/v1/reputation-events/{id}", description: "Read a reputation event", roles: [Member, GroupModerator, PlatformAdmin], code: 200, input: [], output: ReputationEvent, side_effects: [] }

  - method: POST
    path: "/v1/_clock/set_current_utc"
    description: "Test-driving logical clock. Sets the server logical time and runs the epoch sweep: offer expiry (OFFERED -> EXPIRED + vacancy cascade), post expiry (OPEN -> EXPIRED at expires_at), curb-alert activation/ending, reputation settlement (age >= 7d), strike expiry (age >= 90d, with reinstatement recompute), suspension reinstatement (now >= suspension_ends_at), wishlist expiry (now >= expires_at). Startup default before any call: the logical clock reads exactly 2026-05-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["all epoch sweeps listed in the description"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/malformed X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for the endpoint, or GroupModerator lacks a MODERATOR membership in the target group" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, bad type, unknown field, invalid enum value, malformed email/datetime" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "No Member with the given id" }
  - { id: ERR_GROUP_NOT_FOUND, http: 404, condition: "No NeighborhoodGroup with the given id" }
  - { id: ERR_MEMBERSHIP_NOT_FOUND, http: 404, condition: "No GroupMembership with the given id" }
  - { id: ERR_GIFT_POST_NOT_FOUND, http: 404, condition: "No GiftPost with the given id (or report target_type=GIFT_POST target missing)" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "No Claim with the given id (or report target_type=CLAIM target missing)" }
  - { id: ERR_PICKUP_PLAN_NOT_FOUND, http: 404, condition: "No PickupPlan with the given id" }
  - { id: ERR_WISHLIST_NOT_FOUND, http: 404, condition: "No Wishlist with the given id" }
  - { id: ERR_CURB_ALERT_NOT_FOUND, http: 404, condition: "No CurbAlert with the given id (or report target_type=CURB_ALERT target missing)" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "No Report with the given id" }
  - { id: ERR_MODERATION_ACTION_NOT_FOUND, http: 404, condition: "No ModerationAction with the given id" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_MEMBER_SUSPENDED, http: 403, condition: "Content-creating operation attempted by a SUSPENDED member" }
  - { id: ERR_MEMBER_BANNED, http: 403, condition: "Content-creating operation attempted by a BANNED member" }
  - { id: ERR_NOT_GROUP_MEMBER, http: 403, condition: "Actor lacks an APPROVED membership in the target group" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Actor is not the owner of the target resource (giver for post ops, claimer for claim ops, member for wishlist cancel)" }
  - { id: ERR_NOT_COUNTERPARTY, http: 403, condition: "Pickup counter/confirm attempted by the member who made the latest proposal, or by a non-party" }
  - { id: ERR_MEMBERSHIP_EXISTS, http: 409, condition: "A live (REQUESTED or APPROVED) membership already exists for (member_id, group_id)" }
  - { id: ERR_MEMBERSHIP_NOT_REQUESTED, http: 409, condition: "Approve/reject attempted on a membership not in REQUESTED" }
  - { id: ERR_MEMBERSHIP_NOT_APPROVED, http: 409, condition: "Leave/remove attempted on a membership not in APPROVED" }
  - { id: ERR_GROUP_FULL, http: 409, condition: "Approve would push member_count beyond capacity (member_count >= capacity)" }
  - { id: ERR_POST_NOT_DRAFT, http: 409, condition: "Publish attempted on a post not in DRAFT" }
  - { id: ERR_POST_NOT_OPEN, http: 409, condition: "Claim/offer attempted on a post not in OPEN, or claim attempted on a WITHDRAWN/EXPIRED/DRAFT/RESERVED/fulfilled post" }
  - { id: ERR_POST_NOT_WITHDRAWABLE, http: 409, condition: "Withdraw attempted on a terminal post or while a claim is ACCEPTED" }
  - { id: ERR_CLAIM_NOT_OFFERED, http: 409, condition: "Accept/decline attempted on a claim not in OFFERED (includes claims already EXPIRED by the clock sweep)" }
  - { id: ERR_CLAIM_NOT_ACCEPTED, http: 409, condition: "Pickup-plan creation attempted on a claim not in ACCEPTED" }
  - { id: ERR_CLAIM_NOT_WITHDRAWABLE, http: 409, condition: "Withdraw attempted on a claim in a terminal state or ACCEPTED" }
  - { id: ERR_CLAIM_NOT_QUEUED, http: 409, condition: "Giver offer attempted on a claim not QUEUED on this post" }
  - { id: ERR_DUPLICATE_CLAIM, http: 409, condition: "A live (QUEUED/OFFERED/ACCEPTED) claim by this member already exists on the post" }
  - { id: ERR_SELF_CLAIM, http: 422, condition: "Giver attempts to claim their own post" }
  - { id: ERR_PICKUP_NOT_NEGOTIABLE, http: 409, condition: "Counter/confirm/cancel attempted on a plan not in PROPOSED/COUNTERED (counter/confirm) or already terminal" }
  - { id: ERR_PICKUP_NOT_CONFIRMED, http: 409, condition: "Complete/miss attempted on a plan not in CONFIRMED" }
  - { id: ERR_PICKUP_WINDOW_NOT_PASSED, http: 409, condition: "Miss reported before window_end has passed" }
  - { id: ERR_PICKUP_WINDOW_CONFLICT, http: 409, condition: "New/updated window collides with the giver's CONFIRMED windows under the 15-minute buffer rule" }
  - { id: ERR_MAX_NEGOTIATION_ROUNDS, http: 422, condition: "Counter attempted when round_number >= 3" }
  - { id: ERR_INVALID_TIME_RANGE, http: 422, condition: "window_end <= window_start, ends_at <= starts_at, or expires_at <= now" }
  - { id: ERR_CURB_ALERT_CAPACITY, http: 409, condition: "New alert would overlap 3 or more live alerts in the same (group_id, zone)" }
  - { id: ERR_CURB_ALERT_NOT_CANCELLABLE, http: 409, condition: "Cancel attempted on an ENDED/CANCELLED alert" }
  - { id: ERR_WISHLIST_NOT_ACTIVE, http: 409, condition: "Cancel attempted on a wishlist in a terminal state" }
  - { id: ERR_REPORT_NOT_OPEN, http: 409, condition: "start-review attempted on a report not in OPEN" }
  - { id: ERR_REPORT_NOT_UNDER_REVIEW, http: 409, condition: "resolve attempted on a report not in UNDER_REVIEW" }
  - { id: ERR_ACTION_NOT_OVERTURNABLE, http: 409, condition: "overturn attempted on an action not in ACTIVE" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated visitor; may only register"
    identity: opaque
    exclusive_operations: ["POST /v1/members"]
    shared_operations: []
  - name: Member
    description: "Registered member acting as themselves; X-User-ID = Member.id"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /v1/memberships, POST /v1/memberships/{id}/leave"
      - "POST /v1/gift-posts, PUT /v1/gift-posts/{id}, POST /v1/gift-posts/{id}/publish, POST /v1/gift-posts/{id}/withdraw, POST /v1/gift-posts/{id}/offer"
      - "POST /v1/claims, POST /v1/claims/{id}/accept, POST /v1/claims/{id}/decline, POST /v1/claims/{id}/withdraw"
      - "POST /v1/pickup-plans and plan counter/confirm/cancel/complete/miss"
      - "POST /v1/wishlists, POST /v1/wishlists/{id}/cancel"
      - "POST /v1/curb-alerts, POST /v1/curb-alerts/{id}/cancel (as creator)"
      - "POST /v1/reports"
    shared_operations: ["all GET read endpoints", "POST /v1/curb-alerts/{id}/cancel (shared with GroupModerator)"]
  - name: GroupModerator
    description: "Member holding an APPROVED GroupMembership with role=MODERATOR in the target group; X-User-ID = Member.id of that membership's member"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /v1/reports/{id}/start-review, POST /v1/reports/{id}/resolve (shared with PlatformAdmin)"
      - "POST /v1/memberships/{id}/remove"
    shared_operations:
      - "POST /v1/memberships/{id}/approve, POST /v1/memberships/{id}/reject (with PlatformAdmin)"
      - "PUT /v1/groups/{id} (with PlatformAdmin)"
      - "POST /v1/curb-alerts/{id}/cancel (moderating the group)"
      - "all GET read endpoints incl. GET /v1/reports"
  - name: PlatformAdmin
    description: "Opaque operator; creates groups, appoints first moderators, overturns actions, drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /v1/groups"
      - "POST /v1/moderation-actions/{id}/overturn"
      - "POST /v1/_clock/set_current_utc"
    shared_operations:
      - "POST /v1/memberships/{id}/approve, POST /v1/memberships/{id}/reject, POST /v1/memberships/{id}/remove"
      - "POST /v1/reports/{id}/start-review, POST /v1/reports/{id}/resolve"
      - "PUT /v1/groups/{id}"
      - "all GET read endpoints"
