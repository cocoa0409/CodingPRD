      - name: five_fetal_escalation_ids_separate_across_the_14_1_8_10_11_2_and_11_3_rungs
        claim_type: Error Triggerability
        grounds: |
          §1.6 ERR_ASSESSMENT_TIMESTAMP_OUT_OF_RANGE (400), ERR_ESCALATION_NOT_STARTED (409),
          ERR_ESCALATION_TARGET_INELIGIBLE (422), ERR_ESCALATION_CATEGORY_INSUFFICIENT (422) and
          ERR_FETAL_ESCALATION_UNRESOLVED (422); §1.5 POST /fetal-monitoring-assessments (14.1 window
          encounter.admitted_at <= assessed_at <= clock_now), POST /fetal-monitoring-assessments/{id}/escalate
          (11.2 tier-1 target must hold an ACTIVE CHARGE-slot shift, 11.3 tier 3 needs category CATEGORY_III),
          POST /fetal-monitoring-assessments/{id}/resolve (declared only from TIER_1|TIER_2|TIER_3_ACTIVATED,
          carve-out (i) of the §1.4 priority-8 note yields ERR_ESCALATION_NOT_STARTED while
          escalation_tier_high_water == 0) and POST /labor-encounters/{id}/advance-phase; §1.3
          escalation_deadline_derivation (ESCALATION_DUE_MINUTES CATEGORY_II 20) and
          care_assignment_unit_debit (a RATIO_SHARED debit is re-priced in place when the tier floor moves).
        distinguishing_aspect: |
          Five error ids on ONE assessment chain, each isolated on a different validation rung: a
          pre-admission assessed_at is a 400 from the timestamp rung, resolve-before-escalate is a 409 from
          the state rung, an eligible-looking but BEDSIDE-slot notified_staff_id is a 422 from the
          credential rung, tier 3 on a CATEGORY_II reading is a 422 from the fetal rung, and the phase
          advance is a 422 because the chain is still notified. An implementation that treats any two of
          these as the same failure, or that lets resolve fall through to
          ERR_INVALID_STATE_TRANSITION, or that lets a CATEGORY_II chain reach tier 3, is caught. The
          instance also pins that the CATEGORY_II unresolved chain lifted the tier floor to TIER_III and
          that the RATIO_SHARED debit followed it to 2.0 rather than manufacturing a coverage breach.
        test_recipe:
          setup: |
            Clock 2026-08-01T06:00:00Z and never moved, so every deadline stays open and every assessment
            stays fresh. One unit with two LDR beds. Three staff, each on an ACTIVE shift so priority-12
            performer-on-case and priority-11.1 credential checks all pass: rn_charge (RN, ADVANCED cert) on
            a CHARGE shift - the interpreter and the only legal tier-1 target; rn_bedside (RN, ADVANCED) on a
            BEDSIDE shift - a real staff member on a real ACTIVE shift who is nonetheless an illegal tier-1
            target because the slot is not CHARGE; ob_attending (OB_ATTENDING) on a TRIAGE shift - a legal
            tier-2 target. One encounter (admitted_at 06:00) holding LDR-01 with a RATIO_SHARED assignment
            off the BEDSIDE shift, advanced to LATENT while the tier is still TIER_I.
