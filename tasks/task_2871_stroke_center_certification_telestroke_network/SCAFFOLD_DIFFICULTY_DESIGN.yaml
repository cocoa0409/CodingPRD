  instances:
  - name: closed_case_outranks_absolute_contraindication_on_administer
    grounds:
    - validations priority 40 category state -> ERR_CASE_NOT_ACTIVE (409)
    - validations priority 50 category business_safety -> ERR_ABSOLUTE_CONTRAINDICATION (422)
    - validations priority 51 category business_safety -> ERR_ELIGIBILITY_NOT_DETERMINED (409)
    - endpoints.POST /stroke-network/code-strokes/{id}/administer-thrombolytic
    distinguishing_aspect: 'Pairs category `state` (priority 40) against category `business_safety` (priority 50) on POST .../administer-thrombolytic. THREE rules are violated at once and the ordering is deliberately counter-intuitive: the clinical safety rule is the scary one, yet the lifecycle rule outranks it, so the response must be ERR_CASE_NOT_ACTIVE (409) and NOT ERR_ABSOLUTE_CONTRAINDICATION (422) nor ERR_ELIGIBILITY_NOT_DETERMINED (409). Note that the two candidate losers even carry different HTTP statuses, so an implementation that orders by severity or by status code lands on the wrong one.'
