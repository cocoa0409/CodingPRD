  - rule_id: compensating_invariant
    instances:

      - name: component_lot_piece_count_is_conserved_across_install_and_reverse
        grounds:
          - state_machines.ComponentInstallation.INSTALLED_to_REVERSED
          - state_machines.ComponentLot.AVAILABLE_to_DEPLETED
          - state_machines.ComponentLot.DEPLETED_to_AVAILABLE
          - entities.ComponentLot.fields.quantity_available
          - entities.ComponentLot.fields.quantity_installed
          - entities.ComponentLot.fields.quantity_quarantined
          - endpoints["POST /component-installations/{id}/reverse"]
        distinguishing_aspect: |
          The conserved quantity is physical pieces of a ComponentLot: available
          plus installed plus quarantined always equals quantity_received 40,
          before the depleting install, after it, and after the reversal that
          brings the lot back to AVAILABLE with no drift in quantity_installed.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Supplier SUP-CH (CHASSIS) and SUP-APP (APPLIANCE) ACTIVE; FloorPlan FP-3410 with option OPT-WASH; Dealer D-BIG (credit limit 100000000); LINE-A."
            - "One CLASS_A chassis and one APPLIANCE lot L-2211 with quantity_received 40."
            - "The order is submitted, slotted for 2026-08-05, matched and released, and the build is advanced to APPLIANCE_INSTALL."
            - "A first installation of 25 pieces leaves the lot AVAILABLE with 15 available and 25 installed."
          setup_api_calls:
            - call: "POST /suppliers"
              payload: { supplier_code: "SUP-CH", name: "Cascade Chassis Works", component_categories: ["CHASSIS"] }
              as: PlantAdmin
              captures: { sup_ch_id: $.data.id }
            - call: "POST /suppliers"
              payload: { supplier_code: "SUP-APP", name: "Northline Appliance", component_categories: ["APPLIANCE"] }
              as: PlantAdmin
              captures: { sup_app_id: $.data.id }
            - call: "POST /floor-plans"
              payload: { model_code: "FP-3410", chassis_class: "CLASS_A", length_ft: 34, base_msrp_cents: 18500000, base_station_hours: 46.00, base_dry_weight_lbs: 22400, gvwr_lbs: 26000, required_wheelbase_in: 242, electrical_service_amps: 50, fresh_water_capacity_gal: 90 }
              as: PlantAdmin
              captures: { fp_a_id: $.data.id }
            - call: "POST /option-items"
              payload: { option_code: "OPT-WASH", category: "APPLIANCE", install_station: "APPLIANCE_INSTALL", price_cents: 245500, weight_lbs: 180, added_station_hours: 3.00, amp_draw: 12, water_demand_gal: 0 }
              as: PlantAdmin
              captures: { opt_wash_id: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-BIG", region: "WEST", allocation_share_bp: 1500, floor_plan_credit_limit_cents: 100000000, goodwill_budget_cents: 500000 }
              as: PlantAdmin
              captures: { dlr_id: $.data.id }
            - call: "POST /production-lines"
              payload: { line_code: "LINE-A", chassis_class_supported: "CLASS_A", daily_station_hour_capacity: 240.00, max_units_per_day: 4 }
              as: PlantAdmin
              captures: { line_a_id: $.data.id }
            - call: "POST /chassis-receipts"
              payload: { supplier_id: "${sup_ch_id}", chassis_serial: "CH-0001", chassis_class: "CLASS_A", gvwr_lbs: 26000, wheelbase_in: 242 }
              as: PlantAdmin
              captures: { ch1_id: $.data.id }
            - call: "POST /component-lots"
              payload: { supplier_id: "${sup_app_id}", part_number: "WH-6G-2026", lot_code: "L-2211", category: "APPLIANCE", quantity_received: 40 }
              as: PlantAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /unit-orders"
              payload: { dealer_id: "${dlr_id}", floor_plan_id: "${fp_a_id}", order_type: "SOLD", selected_option_ids: ["${opt_wash_id}"], requested_delivery_date: "2026-09-15T00:00:00Z" }
              as: DealerPrincipal
              as_user_id: "${dlr_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /unit-orders/${ord_id}/submit"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dlr_id}"
              captures: { ord_v: $.data.version }
            - call: "POST /unit-orders/${ord_id}/production-slots"
              payload: { line_id: "${line_a_id}", slot_date: "2026-08-05T00:00:00Z", expected_unit_order_version: "${ord_v}" }
              as: ProductionScheduler
            - call: "POST /unit-orders/${ord_id}/match-chassis"
              payload: {}
              as: ProductionScheduler
            - call: "POST /unit-orders/${ord_id}/release-to-line"
              payload: {}
              as: ProductionScheduler
              captures: { build_id: $.data.id }
            - call: "POST /unit-builds/${build_id}/advance"
              payload: { to_station: "SIDEWALL_LAM", station_hours_used: 1.00 }
              as: LineSupervisor
            - call: "POST /unit-builds/${build_id}/advance"
              payload: { to_station: "ROOF_SET", station_hours_used: 1.00 }
              as: LineSupervisor
            - call: "POST /unit-builds/${build_id}/advance"
              payload: { to_station: "ROUGH_IN", station_hours_used: 1.00 }
              as: LineSupervisor
            - call: "POST /unit-builds/${build_id}/advance"
              payload: { to_station: "APPLIANCE_INSTALL", station_hours_used: 1.00 }
              as: LineSupervisor
            - call: "POST /component-installations"
              payload: { unit_build_id: "${build_id}", component_lot_id: "${lot_id}", station: "APPLIANCE_INSTALL", quantity: 25 }
              as: LineSupervisor
              captures: { inst1_id: $.data.id }
          trigger:
            - call: "POST /component-installations"
              payload: { unit_build_id: "${build_id}", component_lot_id: "${lot_id}", station: "APPLIANCE_INSTALL", quantity: 15 }
              as: LineSupervisor
              captures: { inst2_id: $.data.id }
            - call: "POST /component-installations/${inst2_id}/reverse"
              payload: { reversal_reason: "Wrong part revision staged at the station" }
              as: LineSupervisor
          assert:
            - "ComponentLot.${lot_id}.quantity_available == 15 and quantity_installed == 25 and quantity_quarantined == 0"
            - "ComponentLot.${lot_id}.quantity_available + quantity_installed + quantity_quarantined == 40 == quantity_received"
            - "ComponentLot.${lot_id}.status == AVAILABLE (it passed through DEPLETED when the second install took the last 15 pieces and came back)"
            - "ComponentInstallation.${inst1_id}.status == INSTALLED and quantity == 25"
            - "ComponentInstallation.${inst2_id}.status == REVERSED and quantity == 15"
            - "GET /component-installations?component_lot_id=${lot_id} returns total_count 2"
            - "UnitBuild.${build_id}.current_station == APPLIANCE_INSTALL and actual_station_hours == 4.00"

      - name: floor_plan_principal_is_conserved_across_curtailment_and_payoff
        grounds:
          - calculations.floor_plan_curtailment_due
          - calculations.dealer_credit_utilization
          - state_machines.UnitOrder.FLOOR_PLAN_FUNDED_to_CURTAILED
          - state_machines.UnitOrder.CURTAILED_to_FLOOR_PLAN_FUNDED
          - state_machines.UnitOrder.FLOOR_PLAN_FUNDED_to_PAID_OFF
          - entities.UnitOrder.fields.curtailment_paid_cents
          - entities.Dealer.fields.financed_exposure_cents
        distinguishing_aspect: |
          A different conserved quantity in a different unit — cents of floor-plan
          principal rather than pieces of inventory. Across a curtailment sweep, a
          partial payment and a final payoff, curtailment_paid_cents plus the
          dealer's remaining exposure always reconstructs financed_principal_cents
          14510453 exactly, and the exposure reaches zero only on payoff.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "FloorPlan FP-3410 and the five canonical options; Dealer D-WEST with floor_plan_credit_limit_cents 15274000."
            - "The canonical STOCK order is submitted at provisional 16122725 and funded at 2026-08-01, giving financed_principal_cents 14510453 and 9500 bp of utilisation."
            - "The clock is then moved to 2027-01-28T00:00:00Z, exactly 180 days after funding, so stage 1 curtailment of 1000 bp is due."
