  - rule_id: priority_pair_validation_conflict
    instances:
      - name: draw_create_state_precedes_commitment_fiscal_check
        grounds:
          - validations[priority=20].ERR_LOAN_NOT_IN_DRAW_PHASE
          - validations[priority=49].ERR_DRAW_EXCEEDS_COMMITMENT
          - state_machines.Loan.dimension.servicing_status.transitions["PENDING_FIRST_DRAW -> AMORTIZING"]
          - endpoints["POST /draw-requests"]
        distinguishing_aspect: |
          The SAME request body (500000000 requested against a 225000000 commitment) is
          sent twice to the same loan. While the loan is still PENDING_FIRST_DRAW only the
          fiscal rule is violated, so the response is ERR_DRAW_EXCEEDS_COMMITMENT (422,
          priority 49). After construction-completion the loan is AMORTIZING with
          undrawn_commitment_cents 0, so BOTH rules are violated and the response must
          switch to the higher-priority ERR_LOAN_NOT_IN_DRAW_PHASE (409, priority 20).
