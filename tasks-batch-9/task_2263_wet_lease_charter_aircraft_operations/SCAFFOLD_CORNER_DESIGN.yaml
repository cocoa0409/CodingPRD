          rationale: "The pinned round-per-leg-then-sum order at 4 dp, and its 0.0001-hour divergence from sum-then-divide, are asserted by the named difficulty instance."

      - name: provisional_versus_final_divergence_covered_by_difficulty_instance
        claim_type: Variant Divergence
        grounds:
          - calculations.monthly_utilization_charge.variants
