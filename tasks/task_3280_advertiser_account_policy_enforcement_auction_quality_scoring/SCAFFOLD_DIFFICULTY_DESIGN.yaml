              captures: { ver: $.data.id }
            - call: "POST /identity-verifications/${ver}/decide"
              payload: { outcome: "APPROVED" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { account_id: "${acct}", name: "CB", daily_budget_cents: 1000, start_date: "2026-09-01", end_date: "2026-12-31" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/activate"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
          trigger:
            - call: "POST /advertiser-accounts/${acct}/suspend"
              payload: { reason_code: "POLICY_VIOLATION" }
              as: PlatformAdmin
            - call: "POST /advertiser-accounts/${acct}/appeals"
              payload: { argument_text: "false positive" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ap1: $.data.id, ap1_st: $.data.status }
            - call: "POST /appeals/${ap1}/decide"
              payload: { outcome: "OVERTURNED" }
              as: PlatformAdmin
            - call: "GET /campaigns/${camp}"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
              captures: { camp_st1: $.data.status, camp_po1: $.data.pause_origin }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advertiser-accounts/${acct}/suspend"
              payload: { reason_code: "CIRCUMVENTION" }
              as: PlatformAdmin
            - call: "POST /advertiser-accounts/${acct}/appeals"
              payload: { argument_text: "still wrong" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ap2: $.data.id }
            - call: "POST /appeals/${ap2}/decide"
              payload: { outcome: "UPHELD" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advertiser-accounts/${acct}/appeals"
              payload: { argument_text: "second try after cooldown" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ap3: $.data.id }
            - call: "POST /appeals/${ap3}/decide"
              payload: { outcome: "UPHELD" }
              as: PlatformAdmin
            - call: "GET /advertiser-accounts/${acct}"
              payload: {}
              as: PlatformAdmin
              captures: { fin: $.data.status, upheld: $.data.upheld_appeal_count }
          assert:
            - "ap1_st == UNDER_REVIEW (intake auto-transition at creation)"
            - "camp_st1 == ACTIVE and camp_po1 == NONE after OVERTURNED (SUSPENSION-paused campaign auto-resumed)"
            - "second suspension (2026-09-02) resets the appeal window for the new episode"
            - "fin == SUSPENDED_FINAL (second UPHELD on the same episode)"
            - "upheld == 2"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: policy_violation_cascade_review_to_ad_to_campaign
        grounds:
          - state_machines.PolicyReview.NEEDS_HUMAN_to_HUMAN_VIOLATION
          - state_machines.Ad.UNDER_REVIEW_to_DISAPPROVED
          - state_machines.Campaign.ACTIVE_to_PAUSED
          - entities.Campaign.fields.pause_origin
        distinguishing_aspect: |
          Depth-3 chain triggered by the review decision: PolicyReview.outcome ->
          HUMAN_VIOLATION mutates the Ad to DISAPPROVED (link 2, caused by link 1),
          whose eligible_ad_count drop to 0 itself pauses the still-ACTIVE campaign
          with pause_origin=NO_ELIGIBLE_ADS (link 3, caused by link 2) — the
          campaign mutation is not addressed by the reviewer's request.
        test_recipe:
          setup:
            - "Clock 2026-09-01. Verified ACTIVE account; ACTIVE campaign C with exactly ONE ELIGIBLE ad (certified GAMBLING ad that passed one human review), now edited and resubmitted into a second NEEDS_HUMAN review round."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advertiser-accounts"
              payload: { business_name: "Cascade Corp", country_code: "US" }
              as: Anonymous
              captures: { acct: $.data.id, acct_v: $.data.version }
            - call: "POST /advertiser-accounts/${acct}/billing-profile"
              payload: { payment_method_type: "CARD" }
              as: Advertiser
              as_user_id: "${acct}"
            - call: "POST /advertiser-accounts/${acct}/identity-verifications"
              payload: { legal_business_name: "Cascade Corp LLC", registration_number: "RN-7", document_type: "BUSINESS_LICENSE", disclosure_consent: true, expected_account_version: "${acct_v}" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ver: $.data.id }
            - call: "POST /identity-verifications/${ver}/decide"
              payload: { outcome: "APPROVED" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { account_id: "${acct}", name: "CX", daily_budget_cents: 1000, start_date: "2026-09-01", end_date: "2026-12-31" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/activate"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
            - call: "POST /campaigns/${camp}/ad-groups"
              payload: { name: "AG" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ag: $.data.id }
            - call: "POST /ad-groups/${ag}/ads"
              payload: { headline: "Poker Night", final_url: "https://x.example/poker", category: "GAMBLING", restricted_category_certified: true, quality_ectr_score: 5, quality_relevance_score: 5, quality_lp_score: 5 }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ad: $.data.id }
            - call: "POST /ads/${ad}/submit-review"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
              captures: { rev1: $.data.id }
            - call: "POST /policy-reviews/${rev1}/decide"
              payload: { outcome: "HUMAN_APPROVED" }
              as: PolicyReviewer
            - call: "PUT /ads/${ad}"
              payload: { headline: "Poker Night Bonus" }
              as: Advertiser
              as_user_id: "${acct}"
            - call: "POST /ads/${ad}/submit-review"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
              captures: { rev2: $.data.id }
            - call: "GET /campaigns/${camp}"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
              captures: { pre_cnt: $.data.eligible_ad_count, pre_st: $.data.status }
          trigger:
            - call: "POST /policy-reviews/${rev2}/decide"
              payload: { outcome: "HUMAN_VIOLATION", reviewer_note: "unlicensed bonus offer" }
              as: PolicyReviewer
            - call: "GET /ads/${ad}"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ad_st: $.data.status }
            - call: "GET /campaigns/${camp}"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
              captures: { cnt: $.data.eligible_ad_count, cst: $.data.status, cpo: $.data.pause_origin }
          assert:
            - "pre_cnt == 0 and pre_st == ACTIVE (the resubmission already dropped the only eligible ad)"
            - "ad_st == DISAPPROVED (link 2 fired from the review outcome)"
            - "cnt == 0"
            - "cst == PAUSED and cpo == NO_ELIGIBLE_ADS (link 3: campaign auto-paused because the ad mutation emptied the eligible pool, not because the reviewer named the campaign)"

      - name: appeal_overturned_cascade_appeal_to_account_to_campaigns
        grounds:
          - state_machines.Appeal.UNDER_REVIEW_to_OVERTURNED
          - state_machines.AdvertiserAccount.APPEAL_PENDING_to_ACTIVE
          - state_machines.Campaign.PAUSED_to_ACTIVE
        distinguishing_aspect: |
          Different trigger (appeal decision, not review decision) and opposite
          direction: Appeal OVERTURNED (link 1) flips the account APPEAL_PENDING
          -> ACTIVE (link 2, caused by link 1), which itself auto-resumes only the
          campaigns paused with pause_origin=SUSPENSION (link 3, caused by link 2);
          a campaign paused with pause_origin=ADVERTISER stays PAUSED.
        test_recipe:
          setup:
            - "Clock 2026-09-01. Verified ACTIVE account with two ACTIVE campaigns: K1 and K2. K2 is manually paused by the advertiser (pause_origin=ADVERTISER). Account then suspended (K1 -> PAUSED/SUSPENSION) and appealed."
