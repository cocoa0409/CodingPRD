  # =========================================================================
  # Section 4 — Validations
  # =========================================================================
  - section: validations
    instances:

      - name: request_missing_auth_headers_returns_unauthenticated
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "The request is dispatched with the X-User-ID header omitted entirely (X-User-Role is still PlatformAdmin), which rung 1 rejects with ERR_UNAUTHENTICATED (401) before any existence check runs."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /accounts"
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Sent with no X-User-ID header at all, the call returns HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "The same call with an unrecognised X-User-Role value also returns ERR_UNAUTHENTICATED (rung 2), not ERR_ROLE_NOT_PERMITTED"

      - name: auditor_cannot_create_a_scan_run
        claim_type: Violation → Error
        grounds:
          - validations[priority=3]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - roles.Auditor
        distinguishing_aspect: "Auditor is declared read-only and is absent from POST /scan-runs's roles list, so rung 3 returns ERR_ROLE_NOT_PERMITTED (403) even though the profile and quota would otherwise allow the scan."
        test_recipe:
          setup:
            - "FAMILY plan, ACTIVE account, one ACTIVE profile with an identifier and 12 SCAN units free."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "FAMILY", name: "Family Shield", monthly_fee_cents: 2200, max_members: 4, profile_quota_per_cycle: 4, scan_quota_per_cycle: 12, removal_quota_per_cycle: 60, per_member_removal_subcap: 25 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_family_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_family_id}", primary_member_email: "owner@example.com", primary_member_full_name: "Dana Owner" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct_id: $.data.id, owner_id: $.data.primary_member_id }
            - call: "POST /monitored-profiles"
              payload: { member_id: "${owner_id}", full_name: "Dana Owner", date_of_birth: "1984-03-02", primary_address: "12 Elm St, Springfield" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { prof_id: $.data.id, prof_v1: $.data.version }
            - call: "POST /monitored-profiles/${prof_id}/identifiers"
              payload: { identifier_type: "EMAIL", identifier_value: "dana@example.com", expected_profile_version: "${prof_v1}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
            - call: "POST /monitored-profiles/${prof_id}/activate"
              payload: {}
              as: AccountOwner
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /scan-runs"
              payload: { profile_id: "${prof_id}", kind: "INITIAL" }
              as: Auditor
              as_user_id: "auditor-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 403 and data.error_id == ERR_ROLE_NOT_PERMITTED"
            - "GET /scan-runs?profile_id=${prof_id} as Auditor returns HTTP 200 with total_count == 0 — reads are permitted, writes are not"

      - name: accountowner_header_on_a_non_primary_member_returns_forbidden
        claim_type: Violation → Error
        grounds:
          - validations[priority=4]
          - errors[ERR_IDENTITY_UNRESOLVED]
          - roles.AccountOwner
        distinguishing_aspect: "AccountOwner is entity_backed:Member with the extra requirement is_primary true; presenting a real but non-primary Member id in X-User-ID fails rung 4 with ERR_IDENTITY_UNRESOLVED, distinct from rung 12's ERR_NOT_RESOURCE_OWNER."
        test_recipe:
          setup:
            - "FAMILY plan, ACTIVE account, primary member plus one activated MINOR member."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "FAMILY", name: "Family Shield", monthly_fee_cents: 2200, max_members: 4, profile_quota_per_cycle: 4, scan_quota_per_cycle: 12, removal_quota_per_cycle: 60, per_member_removal_subcap: 25 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_family_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_family_id}", primary_member_email: "owner@example.com", primary_member_full_name: "Dana Owner" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct_id: $.data.id, owner_id: $.data.primary_member_id, acct_v1: $.data.version }
            - call: "POST /accounts/${acct_id}/members"
              payload: { email: "kid@example.com", full_name: "Robin Kid", role_in_family: "MINOR", expected_account_version: "${acct_v1}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { kid_id: $.data.id, kid_token: $.data.invitation_token }
            - call: "POST /members/${kid_id}/activate"
              payload: { invitation_token: "${kid_token}" }
              as: Member
              as_user_id: "${kid_id}"
            - call: "GET /accounts/${acct_id}"
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct_v2: $.data.version }
          trigger:
            - call: "POST /accounts/${acct_id}/members"
              payload: { email: "kid2@example.com", full_name: "Sam Kid", role_in_family: "MINOR", expected_account_version: "${acct_v2}" }
              as: AccountOwner
              as_user_id: "${kid_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 403 and data.error_id == ERR_IDENTITY_UNRESOLVED"
            - "GET /accounts/${acct_id}/members still returns total_count == 2"
            - "The same call presented with X-User-ID ${owner_id} succeeds, proving only the identity rung blocked it"

      - name: member_cannot_read_another_accounts_profile
        claim_type: Violation → Error
        grounds:
          - validations[priority=12]
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: "Rung 12 scopes Member and AccountOwner callers to their own Account: the primary member of account B reading account A's profile is ERR_NOT_RESOURCE_OWNER (403), not ERR_PROFILE_NOT_FOUND (404), because the row does exist."
        test_recipe:
          setup:
            - "One FAMILY plan and two independent accounts A and B, each with a primary member."
