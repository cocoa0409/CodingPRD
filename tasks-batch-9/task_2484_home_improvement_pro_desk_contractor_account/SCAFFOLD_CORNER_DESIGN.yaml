            - "http_status == 201"
            - "JobQuote.${quote_id}.status == DRAFT"
            - "JobQuote.${quote_id}.round_count == 0"
            - "JobQuote.${quote_id}.revision_count == 0"
            - "JobQuote.${quote_id}.list_subtotal_cents == null"
            - "JobQuote.${quote_id}.negotiated_total_cents == null"
            - "JobQuote.${quote_id}.discount_depth_pct == null"
            - "JobQuote.${quote_id}.term_start == null"
            - "JobQuote.${quote_id}.term_end == null"
            - "JobQuote.${quote_id}.version == 1"

      - name: quote_submit_snapshots_list_prices_and_advances_to_submitted
        claim_type: valid_transition
        grounds:
          - state_machines.JobQuote.transitions[DRAFT->SUBMITTED]
          - calculations.quote_negotiation_rollup
        distinguishing_aspect: "Submit both moves DRAFT -> SUBMITTED and executes every declared side effect: the line's list price is snapshotted from the originating store (1999), line_list_subtotal_cents becomes 15992 for 8 units, the quote's list_subtotal_cents becomes 15992 and version increments to 2."
        test_recipe:
          setup:
            - "Store HD-101 stocks SHINGLE-BUNDLE at 1999; one MEMBER account; one DRAFT quote with an 8-unit line."
          setup_api_calls:
            - call: "POST /pro/stores"
              payload: { store_code: "HD-101", region_code: "MIDWEST", state_code: "IL", distance_rank: 1, will_call_bay_slots: 2, lift_gate_available: true, tax_rate_pct: 0.0825, max_stage_hours: 48 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id" }
            - call: "POST /pro/store-stocks"
              payload: { store_id: "${store_id}", sku: "SHINGLE-BUNDLE", on_hand_units: 600, list_unit_price_cents: 1999 }
              as: PlatformAdmin
            - call: "POST /pro/pro-accounts"
              payload: { business_name: "Cycle Roofing", home_store_id: "${store_id}" }
              as: PlatformAdmin
              captures: { acct_id: "$.data.id" }
            - call: "POST /pro/job-quotes"
              payload: { pro_account_id: "${acct_id}", originating_store_id: "${store_id}", job_name: "ROOF-A", requested_term_days: 30 }
              as: ContractorAdmin
