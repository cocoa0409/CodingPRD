        grounds:
          - response_envelope.error
          - errors
        distinguishing_aspect: "Every failure — 400, 401, 403, 404, 409 and 422 alike — must come back with response_type \"error\", a data object holding exactly error_id and message, a fresh meta.api_request_id per request, and NO resource fields leaking into data. An implementation that returns bare text for 401, or that echoes the attempted row alongside the error for 409, fails here even though the error_id is right."
        test_recipe:
          setup:
            - "Railroads BN/CX and junction JCT-CHI exist; the clock is 2026-08-26T00:00:00Z. Each trigger below is the cheapest reachable representative of one status class."
