  - rule_id: transitive_cascade
    instances:

      - name: final_qc_rejection_cascades_four_levels_from_package_to_margin_call
        grounds:
          - state_machines.PreSaleContract.SUBMITTED_to_REJECTED
          - state_machines.PreSaleContract.EXECUTED_to_LAPSED
          - state_machines.Film.SOLD_OUT_to_IN_MARKET
          - state_machines.BankingFacility.DRAWN_to_MARGIN_CALL
          - calculations.deliverable_completeness.constants.MAX_REVISION_ROUNDS
          - calculations.presale_discounted_advance
          - entities.DeliverablePackage.fields.status
          - entities.PaymentMilestone.fields.status
        distinguishing_aspect: |
          A STATE-COLLAPSE cascade of depth 4 fired by one buyer call: qc-result FAIL on a
          revision_round == 2 package -> (1) package REJECTED_FINAL, (2) contract EXECUTED ->
          LAPSED with all four milestones WRITTEN_OFF and collection_status WRITTEN_OFF, (3) the
          LICENSED valuation returns to PUBLISHED so the film falls SOLD_OUT -> IN_MARKET and
          financing_gap_usd jumps from 22000000.00 to 24000000.00, (4) the written-off milestones
          empty the lender's collateral so eligible_collateral_usd goes 1343649.60 -> 0.00,
          advance_amount_usd 1000000.00 -> 0.00 and the DRAWN facility trips to MARGIN_CALL while
          drawn_amount_usd stays 1000000.00. Stopping at level 3 leaves the facility DRAWN, which is
          the falsifier.
