      - name: fingerprint_screening_validity_spans_seven_hundred_thirty_days_across_a_leap_day
        claim_type: threshold
        grounds:
          - calculations.screening_validity_window
          - calculations.screening_validity_window.constants.SCREENING_VALIDITY_DAYS_FINGERPRINT
        distinguishing_aspect: "A FINGERPRINT clearance decided 2026-07-01 is valid until 2028-06-30 (730 calendar days, absorbing the 2028 leap day) and screening_status flips ACTIVE -> EXPIRED only once the clock's date passes that day, not on 2028-07-01 minus one second."
        test_recipe:
          setup:
            - "One presenter with a FINGERPRINT screening request and a CLEAR result decided 2026-07-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/presenters"
              payload: { legal_name: "Marisol Vega", presenter_type: "INDIVIDUAL", insurance_certificate_expires_on: "2029-01-01", quoted_fee_cents: 50000 }
              as: ProgramCoordinator
              captures: { pres: $.data.id }
            - call: "POST /library/presenters/${pres}/screening-requests"
              payload: { screening_tier: "FINGERPRINT" }
              as: ScreeningOfficer
            - call: "POST /library/presenters/${pres}/screening-results"
              payload: { result: "CLEAR", decided_on: "2026-07-01" }
              as: ScreeningOfficer
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2028-06-30T23:59:59.000Z" }
              as: ScreeningOfficer
            - call: "GET /library/presenters/${pres}"
              payload: {}
              as: ScreeningOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2028-07-01T00:00:00.000Z" }
              as: ScreeningOfficer
            - call: "GET /library/presenters/${pres}"
              payload: {}
              as: ScreeningOfficer
          assert:
            - "Presenter.${pres}.screening_valid_until == 2028-06-30 (not 2028-07-01, which would ignore the leap day)"
            - "At clock 2028-06-30T23:59:59.000Z the read reports screening_status == ACTIVE"
            - "At clock 2028-07-01T00:00:00.000Z the same read reports screening_status == EXPIRED"
            - "Presenter.${pres}.screening_decision is still CLEAR in both reads — only the derived status moves"

      - name: branch_overlap_load_counts_a_peer_that_only_touches_at_the_boundary_instant
        claim_type: aggregation
