  - rule_id: priority_pair_validation_conflict
    instances:
      - name: confirm_proof_vs_blank_state_vs_fiscal
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_PROOF_NOT_APPROVED]
          - errors[ERR_BLANK_INSUFFICIENT]
        distinguishing_aspect: "On confirm, error-category pair is business_referential (ERR_PROOF_NOT_APPROVED, priority 7) vs business_fiscal (ERR_BLANK_INSUFFICIENT, priority 9); an order with both an unapproved proof AND insufficient blanks must return ERR_PROOF_NOT_APPROVED because priority 7 < 9."
        test_recipe:
          setup:
            - "Order with line {L:50} (needs 53 blanks); BlankSku stock only 10 (insufficient); proof only SUBMITTED (not approved)."
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "Ink Co" }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", name: "Acme", email: "a@x.com" }
              as: ShopManager
