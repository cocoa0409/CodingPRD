# =============================================================================
# PRD Benchmark Seed Tables — Pet Licensing & Animal Control (Expert tier)
# §1.0–§1.7 only. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml; §1.9 in
# SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Pet Licensing & Animal Control: license application, rabies-vaccination proof,
  altered/unaltered fee, kennel/multi-pet, tag issuance/renewal, lost/found match,
  dangerous-dog designation, late penalty

domain_name: pet-licensing-animal-control
api_prefix: ""   # flat top-level collections (/owners, /pets, /licenses, ...); no single nesting prefix

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation        # provisional fee at application vs final fee at issuance
    - cascading_side_effects          # dangerous-dog designation + license-revocation cascades
    - derived_field_reconciliation    # owner.active_license_count, kennel.occupied_slots
    - rate_threshold_triggers         # late-penalty tier boundary, kennel-discount floor, match-score gate
  # NOTE on concurrency: every write-write conflict in this domain reduces to a state precondition
  # (a second sequential request observes a flipped status/flag and is rejected by §1.2/§1.4) — e.g.
  # a second issue-tag sees ACTIVE (ERR_INVALID_STATE), a second pay-penalty sees penalty_paid=true,
  # a second match sees MATCHED. Per §1.2.1's mandatory serial-observability filter none of these is a
  # true race, so the scaffold declares NO concurrency_rules and uses NO OCC version inputs.

  entity_topology: flat
  # Peer entities (Owner, Pet, License, Kennel, Tag, ...) linked by FK fields in
  # the body; URLs are flat collections, not deeply nested ownership trees.

  state_machine_shape: branching
  # License: DRAFT → {SUBMITTED → UNDER_REVIEW → (APPROVED|REJECTED)} with revert
  #   UNDER_REVIEW → NEEDS_VACCINATION_PROOF → UNDER_REVIEW (cycle).
  # DangerousDogCase: branching with appeal cycle.
  # LostFoundReport: branching MATCHED fork.

  relationship_patterns:
    - one_to_many        # Owner → Pet, Owner → License, Kennel → License
    - cross_aggregate    # License references Pet, Owner, Kennel, VaccinationRecord across FK
    - self_referential   # LostFoundReport.matched_report_id -> LostFoundReport.id

  role_model: peer_roles
  # Owner (entity_backed) owns own pets/licenses; LicensingClerk (opaque) reviews
  # applications & issues tags; AnimalControlOfficer (opaque) designates dangerous
  # dogs & resolves lost/found.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Owner
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Owner full name" }
      - { name: email, type: string, source: input, description: "Owner email; unique across owners" }
      - { name: address_zip, type: string, source: input, description: "Residential ZIP; jurisdiction check uses it" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DELINQUENT — DELINQUENT when owner has >=1 license in EXPIRED with unpaid late penalty", default: ACTIVE, constraints: "ACTIVE | DELINQUENT" }
      - { name: active_license_count, type: integer, source: computed, description: "Count of this owner's licenses whose status IN {ACTIVE}", default: 0 }
      - { name: outstanding_penalty_cents, type: integer, source: computed, description: "Sum of License.late_penalty_cents over this owner's licenses whose status IN {EXPIRED, GRACE} and penalty_paid=false", default: 0 }

  - name: Pet
    parent: null
    common_fields: true
    fields:
      - { name: owner_id, type: string, source: input, description: "FK -> Owner.id; the owning Owner" }
      - { name: name, type: string, source: input, description: "Pet name" }
      - { name: species, type: enum, source: input, description: "DOG | CAT", constraints: "DOG | CAT" }
      - { name: breed, type: string, source: input, description: "Breed label" }
      - { name: is_altered, type: boolean, source: input, description: "True if spayed/neutered (altered); drives fee tier", default: false }
      - { name: birth_date, type: datetime, source: input, description: "ISO8601 date of birth" }
      - { name: is_dangerous, type: boolean, source: computed, description: "True once a DangerousDogCase for this pet reaches DESIGNATED", default: false }
      - { name: status, type: enum, source: system, description: "ACTIVE | DECEASED — DECEASED is terminal", default: ACTIVE, constraints: "ACTIVE | DECEASED" }

  - name: VaccinationRecord
    parent: null
    common_fields: false   # immutable proof artifact: only id + created_at
    fields:
      - { name: pet_id, type: string, source: input, description: "FK -> Pet.id; the vaccinated pet" }
      - { name: vaccine_type, type: enum, source: input, description: "RABIES | DHPP | FVRCP", constraints: "RABIES | DHPP | FVRCP" }
      - { name: administered_on, type: datetime, source: input, description: "ISO8601 date the vaccine was administered" }
      - { name: expires_on, type: datetime, source: input, description: "ISO8601 date the vaccine protection expires" }
      - { name: vet_license_no, type: string, source: input, description: "Administering veterinarian license number" }

  - name: Kennel
    parent: null
    common_fields: true
    fields:
      - { name: owner_id, type: string, source: input, description: "FK -> Owner.id; the kennel operator" }
      - { name: facility_name, type: string, source: input, description: "Kennel facility name" }
      - { name: slot_capacity, type: integer, source: input, description: "Maximum number of pets licensable under this kennel license", constraints: ">= 1" }
      - { name: occupied_slots, type: integer, source: computed, description: "Count of this kennel's licenses whose status IN {ACTIVE, GRACE}", default: 0 }
      - { name: status, type: enum, source: system, description: "OPEN | SUSPENDED — SUSPENDED blocks new license attachment", default: OPEN, constraints: "OPEN | SUSPENDED" }

  - name: License
    parent: null
    common_fields: true
    fields:
      - { name: owner_id, type: string, source: input, description: "FK -> Owner.id; license holder" }
      - { name: pet_id, type: string, source: input, description: "FK -> Pet.id; the licensed pet" }
      - { name: kennel_id, type: string, source: input, description: "FK -> Kennel.id; null for an individual license, set for a kennel/multi-pet license", default: null }
      - { name: license_kind, type: enum, source: input, description: "INDIVIDUAL | KENNEL — INDIVIDUAL requires kennel_id null; KENNEL requires kennel_id set", constraints: "INDIVIDUAL | KENNEL" }
      - { name: term_years, type: integer, source: input, description: "License term in whole years (1 or 3)", constraints: "1 | 3" }
      - { name: vaccination_record_id, type: string, source: input, description: "FK -> VaccinationRecord.id; the RABIES proof supplied during review; null until supplied", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | UNDER_REVIEW | NEEDS_VACCINATION_PROOF | APPROVED | ACTIVE | GRACE | EXPIRED | REJECTED | REVOKED", default: DRAFT, constraints: "DRAFT | SUBMITTED | UNDER_REVIEW | NEEDS_VACCINATION_PROOF | APPROVED | ACTIVE | GRACE | EXPIRED | REJECTED | REVOKED" }
      - { name: provisional_fee_cents, type: integer, source: computed, description: "Fee estimate stamped at SUBMITTED from application inputs (is_altered as declared, no dangerous surcharge); see calc license_fee variant=provisional", default: 0 }
      - { name: final_fee_cents, type: integer, source: computed, description: "Fee recomputed at APPROVED using verified pet state (verified is_altered, dangerous surcharge if pet.is_dangerous); see calc license_fee variant=final", default: 0 }
      - { name: late_penalty_cents, type: integer, source: computed, description: "Penalty accrued when renewal lapses past grace; see calc late_penalty", default: 0 }
      - { name: penalty_paid, type: boolean, source: system, description: "True once late_penalty settled at renewal", default: false }
      - { name: issued_on, type: datetime, source: system, description: "Set when ACTIVE first reached (tag issuance)", default: null }
      - { name: expires_on, type: datetime, source: computed, description: "issued_on + term_years; recomputed on renewal", default: null }
      - { name: tag_serial, type: string, source: system, description: "Serial of the currently-issued Tag; null until issuance", default: null }

  - name: Tag
    parent: null
    common_fields: true
    fields:
      - { name: license_id, type: string, source: input, description: "FK -> License.id; the license this tag belongs to" }
      - { name: serial, type: string, source: system, description: "Server-minted tag serial, monotonic per issuance order" }
      - { name: status, type: enum, source: system, description: "ISSUED | SUPERSEDED | VOID — SUPERSEDED when a renewal mints a replacement; VOID on license revocation", default: ISSUED, constraints: "ISSUED | SUPERSEDED | VOID" }
      - { name: issued_on, type: datetime, source: system, description: "Issuance timestamp" }

  - name: DangerousDogCase
    parent: null
    common_fields: true
    fields:
      - { name: pet_id, type: string, source: input, description: "FK -> Pet.id; subject of the case" }
      - { name: incident_summary, type: string, source: input, description: "Free-text incident description" }
      - { name: severity, type: enum, source: input, description: "BITE | ATTACK | NUISANCE — drives surcharge multiplier", constraints: "BITE | ATTACK | NUISANCE" }
      - { name: status, type: enum, source: system, description: "REPORTED | INVESTIGATING | DESIGNATED | APPEALED | OVERTURNED | DISMISSED", default: REPORTED, constraints: "REPORTED | INVESTIGATING | DESIGNATED | APPEALED | OVERTURNED | DISMISSED" }
      - { name: surcharge_cents, type: integer, source: computed, description: "Designation surcharge applied to the pet's active licenses; see calc dangerous_surcharge", default: 0 }

  - name: LostFoundReport
    parent: null
    common_fields: true
    fields:
      - { name: report_type, type: enum, source: input, description: "LOST | FOUND", constraints: "LOST | FOUND" }
      - { name: pet_id, type: string, source: input, description: "FK -> Pet.id; set for LOST reports filed by the owner; null for FOUND reports", default: null }
      - { name: tag_serial_seen, type: string, source: input, description: "Tag serial read off the found animal; null if none", default: null }
      - { name: species, type: enum, source: input, description: "DOG | CAT", constraints: "DOG | CAT" }
      - { name: zip_seen, type: string, source: input, description: "ZIP where lost/found" }
      - { name: reported_at, type: datetime, source: input, description: "ISO8601 timestamp of sighting/loss" }
      - { name: status, type: enum, source: system, description: "OPEN | MATCHED | RESOLVED | CLOSED", default: OPEN, constraints: "OPEN | MATCHED | RESOLVED | CLOSED" }
      - { name: matched_report_id, type: string, source: system, description: "FK -> LostFoundReport.id; the counterpart report this one is matched to (self-referential)", default: null }
      - { name: match_score, type: integer, source: computed, description: "Score of the chosen counterpart at MATCH time; see calc lost_found_match", default: 0 }

  - name: AuditEvent
    parent: null
    common_fields: false   # append-only: id + created_at only
    fields:
      - { name: subject_entity, type: enum, source: system, description: "LICENSE | DANGEROUS_DOG_CASE | LOST_FOUND_REPORT", constraints: "LICENSE | DANGEROUS_DOG_CASE | LOST_FOUND_REPORT" }
      - { name: subject_id, type: string, source: system, description: "Id of the subject row (polymorphic; not declared as FK because target entity varies)" }
      - { name: action, type: string, source: system, description: "Transition or operation name recorded (e.g. LICENSE_APPROVED, DOG_DESIGNATED)" }
      - { name: actor_role, type: string, source: system, description: "Role that performed the action" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: License
    initial_state: DRAFT
    terminal_states: [REJECTED, REVOKED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /licenses/{id}/submit"
        actor: Owner
        preconditions:
          - "Acting Owner owns the License (License.owner_id == X-User-ID) else ERR_UNAUTHORIZED"
          - "Pet.status == ACTIVE (ERR_PET_NOT_ACTIVE)"
          - "Owner.status == ACTIVE — a DELINQUENT owner may not submit new applications (ERR_OWNER_DELINQUENT)"
          - "If license_kind == KENNEL: kennel_id set, Kennel.status == OPEN, and Kennel.occupied_slots < Kennel.slot_capacity (ERR_KENNEL_FULL)"
          - "If license_kind == INDIVIDUAL: kennel_id is null (ERR_LICENSE_KIND_MISMATCH)"
        side_effects:
          - "Compute and stamp License.provisional_fee_cents via calc license_fee variant=provisional"
          - "Append AuditEvent {subject_entity: LICENSE, action: LICENSE_SUBMITTED}"

      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /licenses/{id}/start-review"
        actor: LicensingClerk
        preconditions:
          - "License.status == SUBMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "Append AuditEvent {action: LICENSE_REVIEW_STARTED}"

      - from: UNDER_REVIEW
        to: NEEDS_VACCINATION_PROOF
        trigger: "POST /licenses/{id}/request-vaccination-proof"
        actor: LicensingClerk
        preconditions:
          - "License.status == UNDER_REVIEW (ERR_INVALID_STATE)"
        side_effects:
          - "Append AuditEvent {action: VACCINATION_PROOF_REQUESTED}"

      - from: NEEDS_VACCINATION_PROOF
        to: UNDER_REVIEW
        trigger: "POST /licenses/{id}/attach-vaccination"
        actor: Owner
        preconditions:
          - "Acting Owner owns the License (ERR_UNAUTHORIZED)"
          - "Referenced VaccinationRecord exists and VaccinationRecord.pet_id == License.pet_id (ERR_VACCINATION_MISMATCH)"
          - "VaccinationRecord.vaccine_type == RABIES (ERR_RABIES_PROOF_REQUIRED)"
          - "VaccinationRecord.expires_on > current_utc (ERR_VACCINATION_EXPIRED)"
        side_effects:
          - "Set License.vaccination_record_id"
          - "Append AuditEvent {action: VACCINATION_ATTACHED}"
        note: "cycle: NEEDS_VACCINATION_PROOF → UNDER_REVIEW returns the application to the clerk's queue"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /licenses/{id}/approve"
        actor: LicensingClerk
        preconditions:
          - "License.status == UNDER_REVIEW (ERR_INVALID_STATE)"
          - "License.vaccination_record_id is set AND its RABIES proof is unexpired vs current_utc (ERR_RABIES_PROOF_REQUIRED)"
          - "Pet.status == ACTIVE (ERR_PET_NOT_ACTIVE)"
        side_effects:
          - "Recompute and stamp License.final_fee_cents via calc license_fee variant=final (uses verified Pet.is_altered and Pet.is_dangerous)"
          - "Append AuditEvent {action: LICENSE_APPROVED}"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /licenses/{id}/reject"
        actor: LicensingClerk
        preconditions:
          - "License.status == UNDER_REVIEW (ERR_INVALID_STATE)"
        side_effects:
          - "Append AuditEvent {action: LICENSE_REJECTED}"

      - from: APPROVED
        to: ACTIVE
        trigger: "POST /licenses/{id}/issue-tag"
        actor: LicensingClerk
        preconditions:
          - "License.status == APPROVED (ERR_INVALID_STATE)"
          - "Pet.is_dangerous == false OR a DangerousDogCase for the pet in {OVERTURNED, DISMISSED} — a pet under an open DESIGNATED case cannot have a tag issued (ERR_DANGEROUS_DOG_HOLD)"
          - "No other License of the same pet with status IN {ACTIVE, GRACE} whose validity interval [issued_on, expires_on) overlaps the interval this issuance would create [current_utc, current_utc + term_years); half-open, so a prior license expiring exactly at current_utc does NOT overlap (ERR_LICENSE_PERIOD_OVERLAP)"
        side_effects:
          - "Mint a Tag {license_id, serial, status: ISSUED}; set License.tag_serial = Tag.serial"
          - "Set License.issued_on = current_utc; set License.expires_on = issued_on + term_years"
          - "Recompute Owner.active_license_count (this license now ACTIVE)"
          - "If kennel license: recompute Kennel.occupied_slots"
          - "Append AuditEvent {action: TAG_ISSUED}"

      - from: ACTIVE
        to: GRACE
        trigger: "POST /_clock/advance (system: expires_on passes)"
        actor: system
        preconditions:
          - "current_utc >= License.expires_on AND current_utc < License.expires_on + GRACE_DAYS"
        side_effects:
          - "Append AuditEvent {action: LICENSE_ENTERED_GRACE}"
        note: "auto-transition evaluated whenever the clock advances"

      - from: GRACE
        to: EXPIRED
        trigger: "POST /_clock/advance (system: grace window passes)"
        actor: system
        preconditions:
          - "current_utc >= License.expires_on + GRACE_DAYS"
        side_effects:
          - "Compute and stamp License.late_penalty_cents via calc late_penalty"
          - "Set License.penalty_paid = false"
          - "Recompute Owner.outstanding_penalty_cents; if > 0 set Owner.status = DELINQUENT"
          - "Recompute Owner.active_license_count (license no longer ACTIVE)"
          - "If kennel license: recompute Kennel.occupied_slots"
          - "Append AuditEvent {action: LICENSE_EXPIRED}"

      - from: GRACE
        to: ACTIVE
        trigger: "POST /licenses/{id}/renew"
        actor: Owner
        preconditions:
          - "Acting Owner owns the License (ERR_UNAUTHORIZED)"
          - "License.status == GRACE (ERR_INVALID_STATE)"
          - "A current RABIES VaccinationRecord for the pet is unexpired vs current_utc (ERR_RABIES_PROOF_REQUIRED)"
        side_effects:
          - "Mint replacement Tag; set prior Tag.status = SUPERSEDED; set License.tag_serial to new serial"
          - "Set License.expires_on = current_utc + term_years"
          - "Append AuditEvent {action: LICENSE_RENEWED_FROM_GRACE}"
        note: "renewal from GRACE incurs no late penalty (penalty only accrues at EXPIRED)"

      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /licenses/{id}/renew"
        actor: Owner
        preconditions:
          - "Acting Owner owns the License (ERR_UNAUTHORIZED)"
          - "License.status == EXPIRED (ERR_INVALID_STATE)"
          - "Penalty already settled: License.penalty_paid == true OR the request settles it in full (pay_penalty_cents == License.late_penalty_cents) (ERR_PENALTY_UNPAID)"
          - "A current RABIES VaccinationRecord for the pet is unexpired vs current_utc (ERR_RABIES_PROOF_REQUIRED)"
        side_effects:
          - "Set License.penalty_paid = true"
          - "Mint replacement Tag; set prior Tag.status = SUPERSEDED; set License.tag_serial to new serial"
          - "Set License.expires_on = current_utc + term_years"
          - "Recompute Owner.outstanding_penalty_cents; if 0 set Owner.status = ACTIVE"
          - "Recompute Owner.active_license_count (license ACTIVE again)"
          - "If kennel license: recompute Kennel.occupied_slots"
          - "Append AuditEvent {action: LICENSE_RENEWED_FROM_EXPIRED}"

      - from: EXPIRED
        to: EXPIRED
        trigger: "POST /licenses/{id}/pay-penalty"
        actor: Owner
        preconditions:
          - "Acting Owner owns the License (ERR_UNAUTHORIZED)"
          - "License.status == EXPIRED (ERR_INVALID_STATE)"
          - "License.penalty_paid == false (ERR_INVALID_STATE)"
          - "Request settles the late penalty in full: pay_penalty_cents == License.late_penalty_cents (ERR_PENALTY_UNPAID)"
        side_effects:
          - "Set License.penalty_paid = true (license stays EXPIRED — fine settled without renewing)"
          - "Recompute Owner.outstanding_penalty_cents via calc owner_outstanding_penalty (this license now excluded by the NET reading because penalty_paid==true while still EXPIRED)"
          - "If Owner.outstanding_penalty_cents == 0 set Owner.status = ACTIVE"
          - "Append AuditEvent {action: PENALTY_SETTLED}"
        note: "self-loop: settling the fine flips penalty_paid while the license remains EXPIRED, which is exactly where the NET vs GROSS readings of owner_outstanding_penalty diverge"

      - from: ACTIVE
        to: REVOKED
        trigger: "POST /licenses/{id}/revoke"
        actor: AnimalControlOfficer
        preconditions:
          - "License.status IN {ACTIVE, GRACE} (ERR_INVALID_STATE)"
        side_effects:
          - "Set current Tag.status = VOID"
          - "Recompute Owner.active_license_count"
          - "If kennel license: recompute Kennel.occupied_slots"
          - "Append AuditEvent {action: LICENSE_REVOKED}"

      - from: GRACE
        to: REVOKED
        trigger: "POST /licenses/{id}/revoke"
        actor: AnimalControlOfficer
        preconditions:
          - "License.status IN {ACTIVE, GRACE} (ERR_INVALID_STATE)"
        side_effects:
          - "Set current Tag.status = VOID"
          - "Recompute Owner.active_license_count"
          - "If kennel license: recompute Kennel.occupied_slots"
          - "Append AuditEvent {action: LICENSE_REVOKED}"

  - entity: DangerousDogCase
    initial_state: REPORTED
    terminal_states: [OVERTURNED, DISMISSED]
    transitions:
      - from: REPORTED
        to: INVESTIGATING
        trigger: "POST /dangerous-dog-cases/{id}/investigate"
        actor: AnimalControlOfficer
        preconditions:
          - "DangerousDogCase.status == REPORTED (ERR_INVALID_STATE)"
        side_effects:
          - "Append AuditEvent {subject_entity: DANGEROUS_DOG_CASE, action: DOG_INVESTIGATION_STARTED}"

      - from: INVESTIGATING
        to: DESIGNATED
        trigger: "POST /dangerous-dog-cases/{id}/designate"
        actor: AnimalControlOfficer
        preconditions:
          - "DangerousDogCase.status == INVESTIGATING (ERR_INVALID_STATE)"
          - "No other DangerousDogCase for the same pet already in DESIGNATED (ERR_ALREADY_DESIGNATED)"
        side_effects:
          - "Compute DangerousDogCase.surcharge_cents via calc dangerous_surcharge"
          - "Set Pet.is_dangerous = true   (cascade hop 1)"
          - "For each License of this pet with status IN {ACTIVE, GRACE}: add surcharge_cents to License.final_fee_cents and recompute that License's expires_on is unchanged  (cascade hop 2, fan-out across the pet's active licenses)"
          - "For each such License now carrying an unpaid surcharge, the License is flagged but remains ACTIVE; the surcharge becomes payable at next renewal"
          - "Append AuditEvent {action: DOG_DESIGNATED}"
        note: "designation cascade: case→pet→licenses"

      - from: INVESTIGATING
        to: DISMISSED
        trigger: "POST /dangerous-dog-cases/{id}/dismiss"
        actor: AnimalControlOfficer
        preconditions:
          - "DangerousDogCase.status == INVESTIGATING (ERR_INVALID_STATE)"
        side_effects:
          - "Append AuditEvent {action: DOG_CASE_DISMISSED}"

      - from: DESIGNATED
        to: APPEALED
        trigger: "POST /dangerous-dog-cases/{id}/appeal"
        actor: Owner
        preconditions:
          - "Acting Owner owns the Pet (Pet.owner_id == X-User-ID) else ERR_UNAUTHORIZED"
          - "DangerousDogCase.status == DESIGNATED (ERR_INVALID_STATE)"
        side_effects:
          - "Append AuditEvent {action: DOG_DESIGNATION_APPEALED}"
        note: "cycle entry: DESIGNATED → APPEALED → (OVERTURNED back to clear, or DESIGNATED if upheld)"

      - from: APPEALED
        to: OVERTURNED
        trigger: "POST /dangerous-dog-cases/{id}/overturn"
        actor: AnimalControlOfficer
        preconditions:
          - "DangerousDogCase.status == APPEALED (ERR_INVALID_STATE)"
        side_effects:
          - "If no OTHER DangerousDogCase for the pet is DESIGNATED: set Pet.is_dangerous = false  (cascade hop 1)"
          - "For each License of this pet with status IN {ACTIVE, GRACE} carrying this case's surcharge: subtract surcharge_cents from License.final_fee_cents (compensating reversal — net surcharge contribution returns to zero)  (cascade hop 2)"
          - "Append AuditEvent {action: DOG_DESIGNATION_OVERTURNED}"
        note: "compensating action: must exactly reverse the DESIGNATED cascade's fee contribution"

      - from: APPEALED
        to: DESIGNATED
        trigger: "POST /dangerous-dog-cases/{id}/uphold"
        actor: AnimalControlOfficer
        preconditions:
          - "DangerousDogCase.status == APPEALED (ERR_INVALID_STATE)"
        side_effects:
          - "Append AuditEvent {action: DOG_DESIGNATION_UPHELD}"
        note: "cycle: APPEALED → DESIGNATED; surcharge already applied, no double-apply"

  - entity: LostFoundReport
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: MATCHED
        trigger: "POST /lost-found-reports/{id}/match"
        actor: AnimalControlOfficer
        preconditions:
          - "LostFoundReport.status == OPEN (ERR_INVALID_STATE)"
          - "A counterpart OPEN report of the opposite report_type exists with a non-zero match score (ERR_NO_MATCH_CANDIDATE)"
        side_effects:
          - "Select counterpart via calc lost_found_match; set this.matched_report_id and counterpart.matched_report_id (mutual)"
          - "Set counterpart.status = MATCHED; set this.match_score and counterpart.match_score"
          - "Append AuditEvent {subject_entity: LOST_FOUND_REPORT, action: REPORTS_MATCHED}"

      - from: MATCHED
        to: RESOLVED
        trigger: "POST /lost-found-reports/{id}/resolve"
        actor: AnimalControlOfficer
        preconditions:
          - "LostFoundReport.status == MATCHED (ERR_INVALID_STATE)"
        side_effects:
          - "Set the matched counterpart report.status = RESOLVED as well (cascade across the matched pair)"
          - "Append AuditEvent {action: REPORT_RESOLVED}"

      - from: MATCHED
        to: OPEN
        trigger: "POST /lost-found-reports/{id}/unmatch"
        actor: AnimalControlOfficer
        preconditions:
          - "LostFoundReport.status == MATCHED (ERR_INVALID_STATE)"
        side_effects:
          - "Reset this.matched_report_id = null and this.match_score = 0"
          - "Reset the counterpart report back to OPEN, counterpart.matched_report_id = null, counterpart.match_score = 0 (compensating reversal of the match)"
          - "Append AuditEvent {action: REPORTS_UNMATCHED}"
        note: "cycle: OPEN → MATCHED → OPEN (re-matchable)"

      - from: OPEN
        to: CLOSED
        trigger: "POST /lost-found-reports/{id}/close"
        actor: AnimalControlOfficer
        preconditions:
          - "LostFoundReport.status == OPEN (ERR_INVALID_STATE)"
        side_effects:
          - "Append AuditEvent {action: REPORT_CLOSED}"

      - from: RESOLVED
        to: CLOSED
        trigger: "POST /lost-found-reports/{id}/close"
        actor: AnimalControlOfficer
        preconditions:
          - "LostFoundReport.status == RESOLVED (ERR_INVALID_STATE)"
        side_effects:
          - "Append AuditEvent {action: REPORT_CLOSED}"

  - entity: Pet
    initial_state: ACTIVE
    terminal_states: [DECEASED]
    transitions:
      - from: ACTIVE
        to: DECEASED
        trigger: "POST /pets/{id}/mark-deceased"
        actor: Owner
        preconditions:
          - "Acting Owner owns the Pet (ERR_UNAUTHORIZED)"
          - "Pet.status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "For each License of this pet with status IN {ACTIVE, GRACE, APPROVED}: set License.status = REVOKED and VOID its current Tag (cascade)"
          - "Recompute Owner.active_license_count and any affected Kennel.occupied_slots"
          - "Append AuditEvent {subject_entity: LICENSE, action: PET_DECEASED_LICENSES_REVOKED}"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
# None. Every candidate write-write conflict in this domain reduces to a state
# precondition under §1.2.1's mandatory serial-observability filter (a strictly
# sequential second request observes a flipped status/flag — ACTIVE after the
# first issue-tag, penalty_paid=true after the first pay-penalty, MATCHED after
# the first match — and is rejected by §1.2/§1.4). There is no CREATE-with-
# supersede race, so OCC on a parent `version` is neither needed nor declared.

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: license_fee
    trigger: "provisional: License DRAFT→SUBMITTED; final: License UNDER_REVIEW→APPROVED"
    algorithm: tiered_pricing
    formula: |
      # base rate selected by (species, license_kind), then altered/unaltered
      # multiplier, then per-pet kennel discount, then dangerous surcharge (final only).
      base = BASE_RATE[license_kind]            # cents
      alter_factor = ALTERED_FACTOR if is_altered else UNALTERED_FACTOR
      fee = round_half_up(base * alter_factor)  # round AFTER multiplying base by alter_factor
      if license_kind == KENNEL:
        # multi-pet discount: each occupied slot beyond the first shaves KENNEL_DISCOUNT_PCT,
        # capped at KENNEL_DISCOUNT_FLOOR_PCT of the un-discounted fee
        discount_pct = min(KENNEL_DISCOUNT_PCT * max(occupied_slots, 0), 1 - KENNEL_DISCOUNT_FLOOR_PCT)
        fee = round_half_up(fee * (1 - discount_pct))   # round AGAIN after discount (rounding order pinned)
      if variant == final and pet.is_dangerous:
        fee = fee + dangerous_surcharge_cents   # surcharge added as flat cents AFTER all rounding
      return fee
    input_set: |
      provisional: uses is_altered AS DECLARED on the application at SUBMITTED time,
        occupied_slots as of SUBMITTED, NEVER the dangerous surcharge.
      final: uses Pet.is_altered as VERIFIED at APPROVED time and adds the dangerous
        surcharge when Pet.is_dangerous is true at APPROVED time.
    constants:
      BASE_RATE_INDIVIDUAL: 4000      # cents, license_kind INDIVIDUAL
      BASE_RATE_KENNEL: 12000         # cents, license_kind KENNEL (per-pet base before discount)
      ALTERED_FACTOR: 0.5             # altered pets pay half
      UNALTERED_FACTOR: 1.0           # unaltered pets pay full
      KENNEL_DISCOUNT_PCT: 0.05       # 5% per occupied slot
      KENNEL_DISCOUNT_FLOOR_PCT: 0.6  # discounted fee may never fall below 60% of un-discounted fee
    precision: "integer cents, round_half_up; rounding applied after base*alter_factor and again after kennel discount; flat surcharge added last with no further rounding"
    variants:
      - name: provisional
        when: "stamped at DRAFT→SUBMITTED"
        difference: "uses declared is_altered + current occupied_slots; omits dangerous surcharge entirely"
      - name: final
        when: "stamped at UNDER_REVIEW→APPROVED"
        difference: "uses verified Pet.is_altered and adds dangerous surcharge when Pet.is_dangerous; may diverge from provisional when alteration was mis-declared or a designation landed in between"

  - name: dangerous_surcharge
    trigger: "DangerousDogCase INVESTIGATING→DESIGNATED"
    algorithm: weighted_scoring
    formula: |
      # surcharge = base surcharge scaled by severity multiplier, floored
      raw = SURCHARGE_BASE_CENTS * SEVERITY_MULT[severity]
      surcharge = max(round_half_up(raw), SURCHARGE_MIN_CENTS)
      return surcharge
    input_set: "computed once at DESIGNATED from the case's severity"
    constants:
      SURCHARGE_BASE_CENTS: 5000
      SEVERITY_MULT_BITE: 1.0
      SEVERITY_MULT_ATTACK: 2.0
      SEVERITY_MULT_NUISANCE: 0.5
      SURCHARGE_MIN_CENTS: 3000      # floor: never less than 3000 cents even for NUISANCE
    precision: "integer cents, round_half_up; then floor at SURCHARGE_MIN_CENTS"

  - name: late_penalty
    trigger: "License GRACE→EXPIRED (auto on clock advance)"
    algorithm: threshold
    formula: |
      # days late counted from the END of the grace window, capped
      days_late = floor((current_utc - (expires_on + GRACE_DAYS)) / 1 day)
      tier_rate = PENALTY_TIER_1 if days_late <= PENALTY_TIER_1_MAX_DAYS else PENALTY_TIER_2
      raw = days_late * tier_rate
      penalty = min(round_half_up(raw), final_fee_cents)   # penalty capped at the license's own final fee
      return penalty
    input_set: "computed at the moment GRACE→EXPIRED fires; days_late measured from grace-window end (expires_on + GRACE_DAYS)"
    constants:
      GRACE_DAYS: 30
      PENALTY_TIER_1: 200             # cents/day for the first tier
      PENALTY_TIER_1_MAX_DAYS: 30     # days_late <= 30 uses TIER_1; > 30 uses TIER_2
      PENALTY_TIER_2: 500             # cents/day once days_late exceeds 30
    precision: "integer cents, round_half_up; penalty capped at License.final_fee_cents; boundary at days_late == PENALTY_TIER_1_MAX_DAYS uses TIER_1 (<=), one day later uses TIER_2"

  - name: lost_found_match
    trigger: "LostFoundReport OPEN→MATCHED"
    algorithm: weighted_scoring
    formula: |
      # score each OPEN counterpart report of the OPPOSITE report_type; pick the best.
      for each candidate counterpart c (opposite report_type, status OPEN):
        score = 0
        if c.species == this.species:        score += W_SPECIES
        if c.zip_seen == this.zip_seen:       score += W_ZIP
        if c.tag_serial_seen != null AND c.tag_serial_seen == this.tag_serial_seen:
                                              score += W_TAG_EXACT
        # an exact tag-serial agreement is decisive on its own; without it,
        # species+zip agreement is the next-best signal
      candidate_set = {c : score >= MATCH_MIN_SCORE}
      if candidate_set empty: ERR_NO_MATCH_CANDIDATE
      winner = argmax(score) over candidate_set;
        tie-break: smaller (reported_at) wins; if still tied, smaller created_at wins
      return winner, winner.score
    input_set: "candidate set = OPEN reports of the opposite report_type; this report excluded"
    constants:
      W_SPECIES: 10
      W_ZIP: 20
      W_TAG_EXACT: 100
      MATCH_MIN_SCORE: 20             # must match at least ZIP-level signal (>= 20) to be a candidate
    precision: "integer score; winner = highest score; tie-break reported_at ASC then created_at ASC (never id)"

  - name: owner_outstanding_penalty
    trigger: "recomputed whenever a License of the owner enters EXPIRED, settles via pay-penalty (EXPIRED self-loop), or renews from EXPIRED"
    algorithm: aggregation
    formula: |
      # Owner.outstanding_penalty_cents — two valid readings; the scaffold PINS the NET reading.
      # NET (authoritative): sum over the owner's licenses whose status IN {EXPIRED, GRACE}
      #   AND penalty_paid == false, of License.late_penalty_cents.
      # GROSS (rejected reading): sum over the owner's licenses whose status IN {EXPIRED, GRACE}
      #   of License.late_penalty_cents, IGNORING penalty_paid — would still count penalties
      #   already settled in-place and therefore over-state the balance.
      outstanding_net = sum(L.late_penalty_cents
                            for L in owner.licenses
                            if L.status in {EXPIRED, GRACE} and L.penalty_paid == false)
      return outstanding_net
    input_set: |
      Owner's own licenses only; status filter {EXPIRED, GRACE}; NET reading additionally
      filters penalty_paid == false. The owner is flagged DELINQUENT iff outstanding_net > 0.
    constants: {}
    precision: "integer cents; status filter {EXPIRED, GRACE}; NET excludes penalty_paid==true rows"
    variants:
      - name: net
        when: "authoritative reading used for Owner.outstanding_penalty_cents and DELINQUENT flag"
        difference: "excludes licenses whose penalty_paid==true even while still in {EXPIRED,GRACE} for a moment during settlement"
      - name: gross
        when: "naive reading that ignores penalty_paid"
        difference: "includes already-settled penalties; over-states the balance for identical data — diverges from net whenever any in-window license has penalty_paid==true"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7 RBAC; entity_backed Owner must own the target resource (License.owner_id / Pet.owner_id == X-User-ID)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path and FK-referenced resources exist (Owner, Pet, License, Kennel, VaccinationRecord, DangerousDogCase, LostFoundReport), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums in range, term_years IN {1,3}, slot_capacity >= 1"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create/transition endpoints"

  - priority: 4.5
    category: business_constraint
    check: "Pagination params in range: 1 <= limit <= 100, offset >= 0"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all list (GET collection) endpoints"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined (§1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: business_referential
    check: "License kind/kennel coherence: INDIVIDUAL requires kennel_id null; KENNEL requires kennel_id set and Kennel.status==OPEN"
    error_id: ERR_LICENSE_KIND_MISMATCH
    http_status: 422
    applies_to: "POST /licenses, POST /licenses/{id}/submit"

  - priority: 7
    category: business_referential
    check: "Attached VaccinationRecord.pet_id matches License.pet_id"
    error_id: ERR_VACCINATION_MISMATCH
    http_status: 422
    applies_to: "POST /licenses/{id}/attach-vaccination"

  - priority: 8
    category: business_safety
    check: "Rabies proof present, of vaccine_type RABIES, and unexpired vs current_utc before approval/renewal/attach"
    error_id: ERR_RABIES_PROOF_REQUIRED
    http_status: 422
    applies_to: "POST /licenses/{id}/approve, POST /licenses/{id}/renew, POST /licenses/{id}/attach-vaccination"

  - priority: 9
    category: business_safety
    check: "A pet with an open DESIGNATED dangerous-dog case cannot have a tag issued"
    error_id: ERR_DANGEROUS_DOG_HOLD
    http_status: 422
    applies_to: "POST /licenses/{id}/issue-tag"

  - priority: 10
    category: business_temporal
    check: "Pet license-period overlap: no other License of the same pet in {ACTIVE, GRACE} whose validity interval [issued_on, expires_on) overlaps the new issuance interval [current_utc, current_utc + term_years); half-open — a prior license expiring exactly at current_utc is adjacent, not overlapping"
    error_id: ERR_LICENSE_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /licenses/{id}/issue-tag"

  - priority: 11
    category: business_constraint
    check: "Kennel slot-capacity overlap: the count of this kennel's licenses in {ACTIVE, GRACE} (occupied_slots) must stay below slot_capacity when attaching a new kennel license — aggregate-capacity overlap, not a time interval"
    error_id: ERR_KENNEL_FULL
    http_status: 409
    applies_to: "POST /licenses/{id}/submit"

  - priority: 12
    category: business_fiscal
    check: "Renewal from EXPIRED must settle the late penalty in full: pay_penalty_cents == License.late_penalty_cents"
    error_id: ERR_PENALTY_UNPAID
    http_status: 402
    applies_to: "POST /licenses/{id}/renew"

  - priority: 13
    category: business_constraint
    check: "Owner.status must be ACTIVE to submit a new application (DELINQUENT owner blocked)"
    error_id: ERR_OWNER_DELINQUENT
    http_status: 409
    applies_to: "POST /licenses/{id}/submit"

