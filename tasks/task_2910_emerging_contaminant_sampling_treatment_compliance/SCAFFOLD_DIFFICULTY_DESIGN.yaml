      - name: capital_project_funding_and_construction_dimensions_advance_independently
        grounds:
          - state_machines.CapitalProject.funding_status
          - state_machines.CapitalProject.construction_status
          - state_machines.FundingApplication.SUBMITTED_to_AWARDED
          - entities.CapitalProject.fields.funding_status
          - entities.CapitalProject.fields.construction_status
          - validations[priority=78]
          - concurrency_rules[capital-project-funding-supersede]
        distinguishing_aspect: |
          Two orthogonal state dimensions on the same CapitalProject row: funding_status walks
          NOT_APPLIED -> APPLIED -> AWARDED while construction_status stays PLANNED, and the later
          PLANNED -> BIDDING move changes nothing in the funding ledger. The combined state
          (AWARDED, BIDDING) is only reachable in that order because BIDDING is guarded on
          funding_status == AWARDED (priority 78), which is exactly the parallel-with-one-guard shape;
          there is no state revisited anywhere, so this cannot be satisfied by the cyclic instance (a).
        test_recipe:
          setup:
            - "EntryPoint EPTDS-01, population 45000, GAC and IX pilots completed, SELECT decision taken, so a CapitalProject exists at capital_cost_cents 680000000 / annual_om_cost_cents 31000000, funding_status NOT_APPLIED, construction_status PLANNED, rate_impact_pct 7.18."
            - "GAC was selected, so required_disposal_method is REACTIVATION and concentrate_permit_required is false — no concentrate permit is needed to reach BIDDING."
            - "A standard SRF_LOAN application for 400000000 is submitted with the project's current version and awarded in full by the StateRegulator; a standard (non-disadvantaged) loan is fully repayable, so grant_equivalent_cents stays 0 and borrowed_cents stays 680000000, leaving rate_impact_pct at 7.18."
          setup_api_calls:
            - call: "POST /entry-points"
              payload: { label: "EPTDS-01", source_type: "GROUNDWATER", population_served: 45000 }
              as: UtilityAdmin
              captures: { ep_id: "$.data.id" }
            - call: "POST /treatment-evaluations"
              payload: { entry_point_id: "${ep_id}" }
              as: TreatmentEngineer
              captures: { eval_id: "$.data.id" }
            - call: "POST /pilot-tests"
              payload: { treatment_evaluation_id: "${eval_id}", technology: "GAC", window_start_at: "2026-05-01T00:00:00.000Z", window_end_at: "2026-05-15T00:00:00.000Z", ebct_min: 10.00, lifecycle_cost_cents: 2550000000, capital_cost_estimate_cents: 680000000, annual_om_estimate_cents: 31000000, residuals_burden_score: 62.00, footprint_score: 71.00, om_complexity_score: 83.00 }
              as: TreatmentEngineer
              captures: { gac_id: "$.data.id" }
            - call: "POST /pilot-tests"
