          assert:
            - "HTTP 200; status == APPROVED; response version == ${v_oc2} + 1 == 3"
      - name: conditional_cascade_only_future_appointments
        claim_type: conditional_cascade
        grounds:
          - "state_machines.AuthorizationRequest.APPROVED_to_SUPERSEDED"
          - "state_machines.InfusionAppointment.SCHEDULED_to_CANCELLED"
        distinguishing_aspect: "The supersede cascade cancels only appointments whose scheduled_start is after the current clock: a past COMPLETED appointment (2026-08-05, clock at 2026-08-06) is untouched while a future one (2026-08-20) is CANCELLED."
        test_recipe:
          setup:
            - "Approved request; CLEARED clearance; appointment A 2026-08-05T10:00-11:00 CONFIRMED then COMPLETED via clock 2026-08-06; appointment B 2026-08-20T10:00-11:00 SCHEDULED"
