              as: Guest
              as_user_id: "${guest_id}"
            - call: "GET /entry-windows/${window_id}"
              payload: {}
              as: ParkManager
              captures: { window_v_now: $.data.version }
          trigger:
            - call: "POST /cabana-rentals"
              payload: { cabana_id: "${cabana_id}", order_id: "${order_id}", entry_window_id: "${window_id}", starts_at: "2026-07-01T13:00:00Z", ends_at: "2026-07-01T15:00:00Z", expected_entry_window_version: "${window_v_now} - 1" }
