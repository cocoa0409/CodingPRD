# =============================================================================
# Task 0091 — Big Brothers Big Sisters One-on-One Mentorship Matching
# Scaffold seed tables (§1.0–§1.7). Difficulty: EXPERT.
# =============================================================================

scenario: "Big Brothers Big Sisters One-on-One Mentorship Matching: volunteer background check, child profile, interest matching, match meeting, monthly activity tracking, supervisor follow-up, exit transition, Outcome Survey"

domain_name: bbbs-mentorship-matching
api_prefix: /

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - selector_policy            # rank eligible Volunteers for a Child's MatchProposal
    - cascading_side_effects     # match closure cascades through meetings/contacts/survey
    - derived_field_reconciliation  # Match.health_posture derived from contact cadence + activity recency
    - optimistic_concurrency     # OCC on Child.version for the supersede-proposal race

  entity_topology: flat
  # Peer entities linked by FK; Match is a junction of Volunteer×Child. No deep URL nesting.

  state_machine_shape: parallel
  # Match carries two independent state axes (relationship_status × compliance_status);
  # BackgroundCheck is cyclic (renew loop); ExitTransition is branching (closure vs termination).

  relationship_patterns:
    - one_to_many        # Guardian -> Child[], Match -> ActivityLog[]/SupervisionContact[]
    - many_to_many       # Match is the Volunteer x Child junction
    - cross_aggregate    # Match transitions depend on Volunteer & BackgroundCheck & Child state

  role_model: segregation_of_duties
  # The MatchSpecialist who confirms a Match cannot be the Supervisor who signs off its closure;
  # the BackgroundScreener who clears a check cannot be a MatchSpecialist who proposes matches.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMITTED VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Volunteer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Volunteer (Big) legal name" }
      - { name: email, type: string, source: input, description: "Contact email; unique among Volunteers" }
      - { name: gender, type: enum, source: input, description: "MALE | FEMALE | NONBINARY — used for gender-pairing eligibility" }
      - { name: home_zip, type: string, source: input, description: "5-digit ZIP; first 3 digits form the geo cluster for proximity scoring" }
      - { name: interest_tags, type: array, source: input, description: "List of interest tag strings from the controlled vocabulary, e.g. [SPORTS, ARTS, STEM, OUTDOORS, MUSIC, COOKING, READING]" }
      - { name: max_weekly_hours, type: integer, source: input, description: "Capacity the volunteer pledges per week; must be >= 1", constraints: "integer >= 1" }
      - { name: status, type: enum, source: system, description: "APPLIED -> SCREENING -> ELIGIBLE -> MATCHED -> INACTIVE; SCREENING_FAILED is terminal", default: APPLIED }
      - { name: active_match_count, type: integer, source: computed, description: "Count of Matches referencing this Volunteer whose relationship_status IN {INTRODUCED, ACTIVE}; gates one-on-one exclusivity", default: 0 }
      - { name: cleared_check_id, type: string, source: computed, description: "id of the single BackgroundCheck for this Volunteer currently in CLEARED with valid_until in the future; null if none" }

  - name: BackgroundCheck
    parent: null
    common_fields: true
    fields:
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; the screened volunteer" }
      - { name: check_type, type: enum, source: input, description: "CRIMINAL | DMV | CHILD_ABUSE_REGISTRY — three independent screens" }
      - { name: submitted_at, type: datetime, source: system, description: "When the screen was ordered" }
      - { name: valid_until, type: datetime, source: computed, description: "= adjudicated_at + VALIDITY_MONTHS months, set when status becomes CLEARED; null otherwise" }
      - { name: adjudicated_at, type: datetime, source: system, description: "When the screen was cleared or flagged; null while PENDING" }
      - { name: adverse_findings, type: integer, source: input, description: "Count of adverse records returned by the screen; supplied at adjudication", default: 0 }
      - { name: status, type: enum, source: system, description: "PENDING -> CLEARED | FLAGGED; CLEARED -> EXPIRED (system); FLAGGED is terminal", default: PENDING }

  - name: Guardian
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Guardian/parent legal name" }
      - { name: email, type: string, source: input, description: "Contact email; unique among Guardians" }
      - { name: consent_on_file, type: boolean, source: input, description: "Whether signed program-consent form is on file", default: false }

  - name: Child
    parent: null
    common_fields: true
    fields:
      - { name: guardian_id, type: string, source: input, description: "FK -> Guardian.id; the enrolling guardian" }
      - { name: first_name, type: string, source: input, description: "Child (Little) first name" }
      - { name: age, type: integer, source: input, description: "Child age in years; must be 6..16 inclusive at enrollment", constraints: "6 <= age <= 16" }
      - { name: gender, type: enum, source: input, description: "MALE | FEMALE | NONBINARY — used for gender-pairing eligibility" }
      - { name: home_zip, type: string, source: input, description: "5-digit ZIP; first 3 digits form the geo cluster for proximity scoring" }
      - { name: interest_tags, type: array, source: input, description: "List of interest tag strings from the controlled vocabulary (same vocabulary as Volunteer.interest_tags)" }
      - { name: requires_same_gender, type: boolean, source: input, description: "Guardian preference: if true, only same-gender Volunteers are eligible", default: false }
      - { name: status, type: enum, source: system, description: "WAITLISTED -> PROPOSED -> MATCHED -> INACTIVE; PROPOSED reverts to WAITLISTED on proposal decline", default: WAITLISTED }
      - { name: open_proposal_id, type: string, source: computed, description: "id of this Child's single MatchProposal currently in OFFERED, or null" }

  - name: MatchProposal
    parent: null
    common_fields: true
    fields:
      - { name: child_id, type: string, source: input, description: "FK -> Child.id; the Little this proposal is for" }
      - { name: volunteer_id, type: string, source: computed, description: "FK -> Volunteer.id; the top-ranked eligible Big selected by the matching algorithm at proposal time" }
      - { name: compatibility_score, type: number, source: computed, description: "Score of the selected volunteer per interest-matching calculation; 2 decimals" }
      - { name: candidate_pool_size, type: integer, source: computed, description: "Number of eligible Volunteers considered when the proposal was generated" }
      - { name: status, type: enum, source: system, description: "OFFERED -> ACCEPTED | DECLINED; OFFERED -> SUPERSEDED (system, on re-propose)", default: OFFERED }
      - { name: decline_reason, type: enum, source: input, description: "VOLUNTEER_UNAVAILABLE | GUARDIAN_DECLINED | POOR_FIT — set on DECLINE; null otherwise" }

  - name: Match
    parent: null
    common_fields: true
    fields:
      - { name: child_id, type: string, source: input, description: "FK -> Child.id; the Little" }
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; the Big" }
      - { name: proposal_id, type: string, source: input, description: "FK -> MatchProposal.id; the accepted proposal that produced this match" }
      - { name: relationship_status, type: enum, source: system, description: "Axis 1: CONFIRMED -> INTRODUCED -> ACTIVE -> CLOSED (terminal). Independent of compliance_status.", default: CONFIRMED }
      - { name: compliance_status, type: enum, source: computed, description: "Axis 2: GREEN | AMBER | RED — derived from supervision cadence and activity recency; independent of relationship_status" }
      - { name: confirmed_at, type: datetime, source: system, description: "When relationship_status became CONFIRMED" }
      - { name: activated_at, type: datetime, source: system, description: "When relationship_status became ACTIVE (the match meeting concluded successfully); null until then" }
      - { name: last_activity_at, type: datetime, source: computed, description: "occurred_at of the latest ActivityLog under this Match; null if none" }
      - { name: last_contact_at, type: datetime, source: computed, description: "contacted_at of the latest COMPLETED SupervisionContact under this Match; null if none" }
      - { name: total_mentoring_minutes, type: integer, source: computed, description: "Sum of duration_minutes over ActivityLog rows with status LOGGED under this Match", default: 0 }
      - { name: closure_reason, type: enum, source: system, description: "SUCCESSFUL_CLOSURE | EARLY_TERMINATION — set when relationship_status becomes CLOSED; null otherwise" }

  - name: MatchMeeting
    parent: null
    common_fields: true
    fields:
      - { name: match_id, type: string, source: input, description: "FK -> Match.id; the match being introduced" }
      - { name: scheduled_start, type: datetime, source: input, description: "Planned meeting start (UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Planned meeting end (UTC); must be strictly after scheduled_start" }
      - { name: location, type: string, source: input, description: "Free-text meeting location" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> HELD | NO_SHOW; HELD -> AFFIRMED | RESCINDED (all three parties confirm fit or not)", default: SCHEDULED }
      - { name: outcome_notes, type: string, source: input, description: "Specialist notes recorded at the HELD transition", default: null }

  - name: ActivityLog
    parent: null
    common_fields: false
    fields:
      - { name: match_id, type: string, source: input, description: "FK -> Match.id; the match this activity belongs to" }
      - { name: occurred_at, type: datetime, source: input, description: "When the mentoring activity took place (UTC)" }
      - { name: duration_minutes, type: integer, source: input, description: "Activity duration in minutes; must be >= 1", constraints: "integer >= 1" }
      - { name: activity_type, type: enum, source: input, description: "OUTING | CALL | MEAL | TUTORING | EVENT" }
      - { name: status, type: enum, source: system, description: "LOGGED — the only state; ActivityLog is append-only (no void/edit)", default: LOGGED }

  - name: SupervisionContact
    parent: null
    common_fields: true
    fields:
      - { name: match_id, type: string, source: input, description: "FK -> Match.id; the supervised match" }
      - { name: due_at, type: datetime, source: system, description: "When this monthly follow-up is due; the next due_at is contacted_at + CONTACT_INTERVAL_DAYS on completion" }
      - { name: contacted_at, type: datetime, source: input, description: "When the supervisor actually reached the parties; set at COMPLETE; null while OPEN" }
      - { name: party, type: enum, source: input, description: "BIG | LITTLE | GUARDIAN — which party the supervisor contacted" }
      - { name: concern_flag, type: boolean, source: input, description: "Whether the supervisor recorded a safety/fit concern at this contact", default: false }
      - { name: status, type: enum, source: system, description: "OPEN -> COMPLETED | MISSED (system, when overdue and a newer contact opens)", default: OPEN }

  - name: ExitTransition
    parent: null
    common_fields: true
    fields:
      - { name: match_id, type: string, source: input, description: "FK -> Match.id; the match being exited" }
      - { name: exit_type, type: enum, source: input, description: "SUCCESSFUL_CLOSURE | EARLY_TERMINATION — drives divergent side-effect branches" }
      - { name: initiated_by, type: enum, source: input, description: "BIG | LITTLE | GUARDIAN | AGENCY — who requested the exit" }
      - { name: reason_code, type: enum, source: input, description: "GRADUATION | RELOCATION | LOST_INTEREST | SAFETY_CONCERN | PROGRAM_VIOLATION" }
      - { name: status, type: enum, source: system, description: "DRAFT -> FINALIZED (terminal); FINALIZED closes the Match", default: DRAFT }
      - { name: survey_required, type: boolean, source: computed, description: "true iff exit_type == SUCCESSFUL_CLOSURE OR the match reached relationship_status ACTIVE before exit; pins whether an OutcomeSurvey must follow" }

  - name: OutcomeSurvey
    parent: null
    common_fields: true
    fields:
      - { name: match_id, type: string, source: input, description: "FK -> Match.id; the closed match being surveyed" }
      - { name: exit_transition_id, type: string, source: input, description: "FK -> ExitTransition.id; the finalized exit this survey closes out" }
      - { name: relationship_quality, type: integer, source: input, description: "Likert 1..5 on relationship quality", constraints: "1 <= relationship_quality <= 5" }
      - { name: child_outcome, type: integer, source: input, description: "Likert 1..5 on child outcome", constraints: "1 <= child_outcome <= 5" }
      - { name: would_rematch, type: boolean, source: input, description: "Whether respondent would participate again" }
      - { name: composite_score, type: number, source: computed, description: "Weighted Strength-of-Relationship index; 2 decimals" }
      - { name: outcome_band, type: enum, source: computed, description: "STRONG | MODERATE | WEAK — banded from composite_score" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Volunteer
    initial_state: APPLIED
    terminal_states: [SCREENING_FAILED]
    transitions:
      - from: APPLIED
        to: SCREENING
        trigger: "POST /volunteers/{id}/submit-screening"
        actor: BackgroundScreener
        preconditions:
          - "Volunteer.status == APPLIED"
          - "At least one BackgroundCheck for this volunteer is PENDING (created by the same call's cascade)"
        side_effects:
          - "Creates three PENDING BackgroundCheck rows (CRIMINAL, DMV, CHILD_ABUSE_REGISTRY) for this volunteer"

      - from: SCREENING
        to: ELIGIBLE
        trigger: "system: all three BackgroundCheck rows reach CLEARED"
        actor: system
        preconditions:
          - "All three BackgroundCheck rows for this volunteer are CLEARED with valid_until in the future"
        side_effects:
          - "Sets Volunteer.cleared_check_id to the CRIMINAL check id"
        note: "Bubble-up: fired by the third BackgroundCheck CLEARED transition, not by a direct volunteer call."

      - from: SCREENING
        to: SCREENING_FAILED
        trigger: "system: any BackgroundCheck for this volunteer reaches FLAGGED"
        actor: system
        preconditions:
          - "At least one BackgroundCheck for this volunteer is FLAGGED"
        side_effects:
          - "Cancels (DECLINES) any OFFERED MatchProposal whose volunteer_id is this volunteer, reverting that Child to WAITLISTED"
        note: "Compensation cascade across MatchProposal and Child."

      - from: ELIGIBLE
        to: SCREENING
        trigger: "POST /volunteers/{id}/submit-screening"
        actor: BackgroundScreener
        preconditions:
          - "Volunteer.status == ELIGIBLE"
          - "Volunteer.active_match_count == 0"
        side_effects:
          - "Creates three fresh PENDING BackgroundCheck rows (CRIMINAL, DMV, CHILD_ABUSE_REGISTRY); clears cleared_check_id"
        note: "Re-screening loop (cyclic): an ELIGIBLE volunteer can be re-screened, e.g. after expiry or for an adverse-record recheck. Any FLAG during this cycle drives SCREENING_FAILED, declining a still-OFFERED proposal."

      - from: ELIGIBLE
        to: MATCHED
        trigger: "system: Match.relationship_status reaches CONFIRMED"
        actor: system
        preconditions:
          - "Volunteer.status == ELIGIBLE"
        side_effects:
          - "active_match_count incremented to 1"

      - from: MATCHED
        to: ELIGIBLE
        trigger: "system: the Volunteer's only active Match reaches CLOSED"
        actor: system
        preconditions:
          - "Volunteer.active_match_count drops to 0 after the closing cascade"
        side_effects: []
        note: "Bubble-up from Match closure; lets a Big be re-matched."

      - from: ELIGIBLE
        to: INACTIVE
        trigger: "POST /volunteers/{id}/deactivate"
        actor: MatchSpecialist
        preconditions:
          - "Volunteer.active_match_count == 0"
        side_effects: []

  - entity: BackgroundCheck
    initial_state: PENDING
    terminal_states: [FLAGGED]
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /background-checks/{id}/adjudicate with decision=CLEAR"
        actor: BackgroundScreener
        preconditions:
          - "BackgroundCheck.status == PENDING"
          - "adverse_findings == 0 for CRIMINAL and CHILD_ABUSE_REGISTRY checks; <= DMV_ADVERSE_TOLERANCE for DMV (ERR_ADVERSE_FINDING_BLOCKS_CLEAR)"
        side_effects:
          - "Sets adjudicated_at = clock now; valid_until = adjudicated_at + VALIDITY_MONTHS months"
          - "If this is the third CLEARED check for the volunteer, bubbles the Volunteer SCREENING -> ELIGIBLE transition"

      - from: PENDING
        to: FLAGGED
        trigger: "POST /background-checks/{id}/adjudicate with decision=FLAG"
        actor: BackgroundScreener
        preconditions:
          - "BackgroundCheck.status == PENDING"
        side_effects:
          - "Sets adjudicated_at = clock now; valid_until stays null"
          - "Bubbles the Volunteer SCREENING -> SCREENING_FAILED transition (compensation cascade)"

      - from: CLEARED
        to: EXPIRED
        trigger: "system: clock advances past valid_until"
        actor: system
        preconditions:
          - "clock now >= valid_until"
        side_effects:
          - "Clears Volunteer.cleared_check_id when it pointed at this check"
        note: "Re-screening loop: a new submit-screening cycle re-opens PENDING checks (cyclic shape)."

  - entity: Child
    initial_state: WAITLISTED
    terminal_states: [INACTIVE]
    transitions:
      - from: WAITLISTED
        to: PROPOSED
        trigger: "POST /children/{id}/propose-match"
        actor: MatchSpecialist
        preconditions:
          - "Child.status == WAITLISTED"
          - "Guardian.consent_on_file == true for this child's guardian (ERR_CONSENT_NOT_ON_FILE)"
          - "Candidate pool of eligible Volunteers is non-empty (ERR_NO_ELIGIBLE_VOLUNTEER)"
        side_effects:
          - "Creates a MatchProposal in OFFERED with the selected volunteer and compatibility_score"
          - "Sets Child.open_proposal_id to the new proposal id"

      - from: PROPOSED
        to: WAITLISTED
        trigger: "system: the Child's OFFERED MatchProposal reaches DECLINED or SUPERSEDED"
        actor: system
        preconditions:
          - "Child has no OFFERED MatchProposal after the decline/supersede"
        side_effects:
          - "Clears Child.open_proposal_id"
        note: "Cyclic: WAITLISTED <-> PROPOSED revision loop until a proposal is accepted."

      - from: PROPOSED
        to: MATCHED
        trigger: "system: a Match reaches CONFIRMED for this Child"
        actor: system
        preconditions:
          - "Child.status == PROPOSED"
        side_effects:
          - "Clears Child.open_proposal_id"

      - from: MATCHED
        to: WAITLISTED
        trigger: "system: the Child's Match reaches CLOSED with closure_reason EARLY_TERMINATION"
        actor: system
        preconditions:
          - "Match.closure_reason == EARLY_TERMINATION"
        side_effects: []
        note: "Early termination returns the Little to the waitlist; successful closure does not."

      - from: MATCHED
        to: INACTIVE
        trigger: "system: the Child's Match reaches CLOSED with closure_reason SUCCESSFUL_CLOSURE"
        actor: system
        preconditions:
          - "Match.closure_reason == SUCCESSFUL_CLOSURE"
        side_effects: []

  - entity: MatchProposal
    initial_state: OFFERED
    terminal_states: [ACCEPTED, DECLINED, SUPERSEDED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /match-proposals/{id}/accept"
        actor: MatchSpecialist
        preconditions:
          - "MatchProposal.status == OFFERED"
          - "Selected Volunteer.status == ELIGIBLE (ERR_VOLUNTEER_NOT_ELIGIBLE)"
          - "Selected Volunteer.active_match_count == 0 (ERR_VOLUNTEER_AT_CAPACITY)"
        side_effects:
          - "Creates a Match in relationship_status CONFIRMED for (child_id, volunteer_id)"
          - "Bubbles Child PROPOSED -> MATCHED and Volunteer ELIGIBLE -> MATCHED"

      - from: OFFERED
        to: DECLINED
        trigger: "POST /match-proposals/{id}/decline"
        actor: MatchSpecialist
        preconditions:
          - "MatchProposal.status == OFFERED"
          - "decline_reason supplied"
        side_effects:
          - "Bubbles Child PROPOSED -> WAITLISTED"

      - from: OFFERED
        to: SUPERSEDED
        trigger: "system: a new propose-match call creates a fresher OFFERED proposal for the same Child"
        actor: system
        preconditions:
          - "A new MatchProposal in OFFERED now exists for the same child_id"
        side_effects:
          - "Bubbles Child PROPOSED -> WAITLISTED then back to PROPOSED on the new proposal"
        note: "True-race target: guarded by OCC on Child.version (see concurrency_rules)."

  - entity: Match
    initial_state: CONFIRMED
    terminal_states: [CLOSED]
    transitions:
      - from: CONFIRMED
        to: INTRODUCED
        trigger: "POST /match-meetings/{id}/hold"
        actor: MatchSpecialist
        preconditions:
          - "Match.relationship_status == CONFIRMED"
          - "The MatchMeeting being held belongs to this Match and is in SCHEDULED"
        side_effects:
          - "MatchMeeting -> HELD"
        note: "Cross-entity: the Match advances only via its meeting's HELD transition."

      - from: INTRODUCED
        to: ACTIVE
        trigger: "POST /match-meetings/{id}/affirm"
        actor: MatchSpecialist
        preconditions:
          - "Match.relationship_status == INTRODUCED"
          - "The MatchMeeting is in HELD"
        side_effects:
          - "MatchMeeting -> AFFIRMED"
          - "Sets Match.activated_at = clock now"
          - "Opens the first SupervisionContact (status OPEN) with due_at = activated_at + CONTACT_INTERVAL_DAYS"

      - from: INTRODUCED
        to: CLOSED
        trigger: "POST /exit-transitions/{id}/finalize"
        actor: Supervisor
        preconditions:
          - "Match.relationship_status == INTRODUCED"
          - "The ExitTransition belongs to this Match and is in DRAFT"
          - "Acting Supervisor is not the MatchSpecialist who confirmed the Match (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "ExitTransition -> FINALIZED; sets Match.closure_reason from exit_type"
          - "Cascade: any OPEN SupervisionContact -> MISSED; any SCHEDULED MatchMeeting -> NO_SHOW"
          - "Bubbles Child MATCHED -> WAITLISTED (EARLY_TERMINATION) or INACTIVE (SUCCESSFUL_CLOSURE), and Volunteer MATCHED -> ELIGIBLE"

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /exit-transitions/{id}/finalize"
        actor: Supervisor
        preconditions:
          - "Match.relationship_status == ACTIVE"
          - "The ExitTransition belongs to this Match and is in DRAFT"
          - "Acting Supervisor is not the MatchSpecialist who confirmed the Match (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "ExitTransition -> FINALIZED; sets Match.closure_reason from exit_type"
          - "Cascade: any OPEN SupervisionContact -> MISSED"
          - "Bubbles Child MATCHED -> WAITLISTED or INACTIVE per closure_reason, and Volunteer MATCHED -> ELIGIBLE"

  - entity: MatchMeeting
    initial_state: SCHEDULED
    terminal_states: [NO_SHOW, AFFIRMED, RESCINDED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /match-meetings/{id}/hold"
        actor: MatchSpecialist
        preconditions:
          - "MatchMeeting.status == SCHEDULED"
          - "Parent Match.relationship_status == CONFIRMED (ERR_MATCH_NOT_READY_FOR_MEETING)"
        side_effects:
          - "Advances parent Match CONFIRMED -> INTRODUCED"

      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /match-meetings/{id}/no-show"
        actor: MatchSpecialist
        preconditions:
          - "MatchMeeting.status == SCHEDULED"
        side_effects: []

      - from: HELD
        to: AFFIRMED
        trigger: "POST /match-meetings/{id}/affirm"
        actor: MatchSpecialist
        preconditions:
          - "MatchMeeting.status == HELD"
        side_effects:
          - "Advances parent Match INTRODUCED -> ACTIVE"

      - from: HELD
        to: RESCINDED
        trigger: "POST /match-meetings/{id}/rescind"
        actor: MatchSpecialist
        preconditions:
          - "MatchMeeting.status == HELD"
        side_effects:
          - "Parent Match stays INTRODUCED; a new MatchMeeting may be scheduled"
        note: "Branching off HELD: affirm vs rescind diverge in side effects."

  - entity: SupervisionContact
    initial_state: OPEN
    terminal_states: [COMPLETED, MISSED]
    transitions:
      - from: OPEN
        to: COMPLETED
        trigger: "POST /supervision-contacts/{id}/complete"
        actor: Supervisor
        preconditions:
          - "SupervisionContact.status == OPEN"
          - "Parent Match.relationship_status == ACTIVE (ERR_MATCH_NOT_ACTIVE)"
          - "contacted_at and party supplied"
        side_effects:
          - "Sets contacted_at; opens the next SupervisionContact OPEN with due_at = contacted_at + CONTACT_INTERVAL_DAYS"
          - "Recomputes Match.compliance_status and Match.last_contact_at"

      - from: OPEN
        to: MISSED
        trigger: "system: a newer SupervisionContact opens while this one is past due_at and still OPEN"
        actor: system
        preconditions:
          - "clock now > this contact's due_at AND a newer OPEN contact exists for the Match"
        side_effects:
          - "Recomputes Match.compliance_status"

  - entity: ExitTransition
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /exit-transitions/{id}/finalize"
        actor: Supervisor
        preconditions:
          - "ExitTransition.status == DRAFT"
          - "Parent Match.relationship_status IN {INTRODUCED, ACTIVE} (ERR_INVALID_STATE)"
          - "Acting Supervisor is not the MatchSpecialist who confirmed the Match (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Closes the parent Match (relationship_status -> CLOSED, closure_reason = exit_type)"
          - "Branch SUCCESSFUL_CLOSURE: survey_required computed true; Child -> INACTIVE"
          - "Branch EARLY_TERMINATION: survey_required true only if Match reached ACTIVE; Child -> WAITLISTED"

  - entity: OutcomeSurvey
    initial_state: SUBMITTED
    terminal_states: [SUBMITTED]
    transitions:
      - from: SUBMITTED
        to: SUBMITTED
        trigger: "POST /outcome-surveys (creation only; immutable thereafter)"
        actor: Supervisor
        preconditions:
          - "Parent Match.relationship_status == CLOSED"
          - "Referenced ExitTransition.survey_required == true (ERR_SURVEY_NOT_REQUIRED)"
          - "No prior OutcomeSurvey exists for this match_id (ERR_SURVEY_ALREADY_EXISTS)"
        side_effects:
          - "Computes composite_score and outcome_band"
        note: "Append-only single-row entity; no further transitions."

# -----------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: propose-match-stale-child
    parent_entity: Child
    write_endpoint: "POST /children/{id}/propose-match"
    occ_field: "expected_child_version"
    description: |
      Generating a new MatchProposal against a Child whose version has advanced
      since the client last observed it is rejected. A previously issued proposal
      that legitimately supersedes the prior one bumps the Child's version (the
      Child cycles PROPOSED state and open_proposal_id changes); a propose-match
      carrying the stale version is therefore rejected as out of date.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: accept-proposal-stale-volunteer
    parent_entity: Volunteer
    write_endpoint: "POST /match-proposals/{id}/accept"
    occ_field: "expected_volunteer_version"
    description: |
      Accepting a MatchProposal binds a Volunteer into a one-on-one Match. If the
      Volunteer's version has advanced since the specialist last observed it (the
      Big was already bound into another confirmed Match, bumping its version and
      active_match_count), the accept carrying the stale version is rejected,
      protecting the one-on-one exclusivity invariant.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: interest_compatibility_score
    trigger: "POST /children/{id}/propose-match (selector ranks the candidate pool)"
    algorithm: weighted_scoring
    formula: |
      For each eligible Volunteer v against Child c:
        shared = count(tag in v.interest_tags AND tag in c.interest_tags)
        union  = count(distinct tags in v.interest_tags OR c.interest_tags)
        interest_component = (shared / union) if union > 0 else 0          # Jaccard, 0..1
        geo_component = 1.0 if v.home_zip[:3] == c.home_zip[:3] else 0.0   # same 3-digit cluster
        capacity_component = min(v.max_weekly_hours, CAPACITY_CAP) / CAPACITY_CAP   # 0..1, clamped
        score = W_INTEREST*interest_component + W_GEO*geo_component + W_CAPACITY*capacity_component
      Round score HALF_UP to 2 decimals AFTER summing the three weighted terms (sum-then-round).
    input_set: |
      Candidate pool = Volunteers where status == ELIGIBLE AND active_match_count == 0
      AND cleared_check_id != null AND (c.requires_same_gender == false OR v.gender == c.gender).
      The selected Volunteer is the one with the highest rounded score; ties broken by earliest
      v.created_at (never by id). If the pool is empty -> ERR_NO_ELIGIBLE_VOLUNTEER.
    constants:
      W_INTEREST: 0.6
      W_GEO: 0.25
      W_CAPACITY: 0.15
      CAPACITY_CAP: 10
    precision: "2 decimal places, round_half_up, applied once to the final weighted sum (NOT per-component)"
    variants:
      - name: ranking_score
        when: "selecting the single top Volunteer for the proposal"
        difference: "rounded 2-decimal score is stored on the proposal as compatibility_score"
      - name: tie_break_order
        when: "two or more eligible Volunteers tie on rounded score"
        difference: "select the Volunteer with the earliest created_at; never by id"

  - name: match_compliance_status
    trigger: "SupervisionContact complete/miss; ActivityLog append; clock advance evaluated at read"
    algorithm: threshold
    formula: |
      Let now = clock now (UTC).
      days_since_contact  = floor((now - Match.last_contact_at) / 1 day)  ; if last_contact_at null, use (now - Match.activated_at)
      days_since_activity = floor((now - Match.last_activity_at) / 1 day) ; if last_activity_at null, use (now - Match.activated_at)
      if relationship_status != ACTIVE: compliance_status = GREEN
      else if days_since_contact > RED_CONTACT_DAYS OR Match has any SupervisionContact in MISSED:
        compliance_status = RED
      else if days_since_contact > AMBER_CONTACT_DAYS OR days_since_activity > AMBER_ACTIVITY_DAYS:
        compliance_status = AMBER
      else:
        compliance_status = GREEN
    input_set: "SupervisionContact rows (COMPLETED for recency, MISSED for the RED gate) and ActivityLog rows (LOGGED only) under the Match."
    constants:
      AMBER_CONTACT_DAYS: 30
      RED_CONTACT_DAYS: 60
      AMBER_ACTIVITY_DAYS: 45
      CONTACT_INTERVAL_DAYS: 30
    precision: "integer day counts via floor; strict > comparison at each boundary. CONTACT_INTERVAL_DAYS is the monthly cadence used to set each SupervisionContact.due_at = (previous contacted_at or activated_at) + CONTACT_INTERVAL_DAYS."

  - name: outcome_composite_score
    trigger: "POST /outcome-surveys"
    algorithm: weighted_scoring
    formula: |
      base = SOR_W_REL*relationship_quality + SOR_W_OUT*child_outcome   # each Likert 1..5
      rematch_bonus = REMATCH_BONUS if would_rematch else 0
      composite_score = round_half_up(base + rematch_bonus, 2)
      outcome_band = STRONG if composite_score >= STRONG_CUTOFF
                     else MODERATE if composite_score >= MODERATE_CUTOFF
                     else WEAK
    input_set: "The single OutcomeSurvey row's own Likert fields and would_rematch flag."
    constants:
      SOR_W_REL: 0.5
      SOR_W_OUT: 0.5
      REMATCH_BONUS: 0.5
      STRONG_CUTOFF: 4.0
      MODERATE_CUTOFF: 2.5
    precision: "2 decimal places, round_half_up; band boundaries use >= (inclusive lower edge)"

  - name: background_check_validity
    trigger: "BackgroundCheck PENDING -> CLEARED adjudication"
    algorithm: threshold
    formula: |
      valid_until = adjudicated_at + VALIDITY_MONTHS calendar months.
      A check is currently valid iff status == CLEARED AND clock now < valid_until.
      Volunteer.cleared_check_id points at the CRIMINAL check only while all three
      checks are jointly valid; if ANY of the three is EXPIRED or FLAGGED,
      cleared_check_id is null and the volunteer is not eligible to be proposed.
    input_set: "The three BackgroundCheck rows for the volunteer (one per check_type)."
    constants:
      VALIDITY_MONTHS: 24
      DMV_ADVERSE_TOLERANCE: 1
    precision: "calendar-month arithmetic; comparison is strict < against valid_until"

  - name: meeting_overlap_check
    trigger: "POST /matches/{id}/meetings (before persisting the new SCHEDULED meeting)"
    algorithm: interval_merge
    formula: |
      Let N = [new.scheduled_start, new.scheduled_end).
      PER-MATCH (half-open, no buffer):
        For each existing meeting M on the SAME Match with status IN {SCHEDULED, HELD}:
          overlap iff (new.scheduled_start < M.scheduled_end) AND (M.scheduled_start < new.scheduled_end).
          Equality at a single shared endpoint (M.scheduled_end == new.scheduled_start, or
          new.scheduled_end == M.scheduled_start) is NOT an overlap (back-to-back allowed).
          On overlap -> ERR_MEETING_OVERLAP.
      PER-GUARDIAN (closed + buffer):
        Resolve guardian G = Child(of this Match).guardian_id. Gather every meeting M with
        status IN {SCHEDULED, HELD} across all Matches whose Child.guardian_id == G (including
        meetings on other children's matches). Inflate each side by MEETING_BUFFER_MINUTES:
          collide iff new.scheduled_start < (M.scheduled_end + buffer)
                   AND M.scheduled_start < (new.scheduled_end + buffer).
          Because intervals are CLOSED and buffer-inflated, a shared endpoint OR any gap
          strictly smaller than MEETING_BUFFER_MINUTES collides. On collision -> ERR_GUARDIAN_DOUBLE_BOOKED.
    input_set: "Non-terminal (SCHEDULED, HELD) MatchMeetings of the same Match (per-Match) and of all sibling Matches under the same Guardian (per-Guardian)."
    constants:
      MEETING_BUFFER_MINUTES: 60
    precision: "minute-resolution datetime comparison; per-Match uses strict < (half-open), per-Guardian uses buffer-inflated closed intervals"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7 RBAC"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body-referenced resources exist (validated left-to-right in path, then body FKs)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Required body fields present and well-typed; enum members valid; numeric ranges (age 6..16, duration_minutes>=1, max_weekly_hours>=1, Likert 1..5)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST/PATCH"

  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version matches the parent's current version on guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /children/{id}/propose-match, POST /match-proposals/{id}/accept"

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_safety
    check: "Background screening gate: adverse_findings exceed tolerance for the check type at CLEAR adjudication"
    error_id: ERR_ADVERSE_FINDING_BLOCKS_CLEAR
    http_status: 409
    applies_to: "POST /background-checks/{id}/adjudicate"

  - priority: 8
    category: business_safety
    check: "Segregation of duties: the Supervisor finalizing an exit must differ from the MatchSpecialist (X-User-ID) who confirmed the Match"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /exit-transitions/{id}/finalize"

  - priority: 9
    category: business_referential
    check: "Guardian consent must be on file before a Child can be proposed"
    error_id: ERR_CONSENT_NOT_ON_FILE
    http_status: 409
    applies_to: "POST /children/{id}/propose-match"

  - priority: 10
    category: business_constraint
    check: "Selected Volunteer must be ELIGIBLE when a proposal is accepted"
    error_id: ERR_VOLUNTEER_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /match-proposals/{id}/accept"

  - priority: 11
    category: business_constraint
    check: "One-on-one exclusivity: selected Volunteer must have active_match_count == 0 when a proposal is accepted"
    error_id: ERR_VOLUNTEER_AT_CAPACITY
    http_status: 409
    applies_to: "POST /match-proposals/{id}/accept"

  - priority: 12
    category: business_constraint
    check: "Candidate pool of eligible Volunteers must be non-empty when proposing (after gender/eligibility filters)"
    error_id: ERR_NO_ELIGIBLE_VOLUNTEER
    http_status: 409
    applies_to: "POST /children/{id}/propose-match"

  - priority: 13
    category: business_referential
    check: "OutcomeSurvey: referenced ExitTransition.survey_required must be true"
    error_id: ERR_SURVEY_NOT_REQUIRED
    http_status: 409
    applies_to: "POST /outcome-surveys"

  - priority: 14
    category: business_referential
    check: "OutcomeSurvey: at most one survey per match_id"
    error_id: ERR_SURVEY_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /outcome-surveys"

  - priority: 15
    category: business_temporal
    check: "MatchMeeting scheduled_end must be strictly after scheduled_start"
    error_id: ERR_MEETING_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /matches/{id}/meetings"

  - priority: 16
    category: business_temporal
    check: "Per-Match meeting overlap: the new meeting's [scheduled_start, scheduled_end) half-open interval must not overlap any non-terminal (SCHEDULED or HELD) meeting on the SAME Match. Back-to-back (prev.scheduled_end == new.scheduled_start) is allowed."
    error_id: ERR_MEETING_OVERLAP
    http_status: 409
    applies_to: "POST /matches/{id}/meetings"

  - priority: 17
    category: business_temporal
    check: "Per-Guardian double-booking: across ALL meetings of every Match belonging to any Child of this meeting's Guardian, the new meeting must be separated by >= MEETING_BUFFER_MINUTES from each existing non-terminal (SCHEDULED or HELD) meeting. Intervals are treated as CLOSED and inflated by the buffer on both sides, so even a positive gap smaller than the buffer collides."
    error_id: ERR_GUARDIAN_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /matches/{id}/meetings"

  - priority: 18
    category: business_constraint
    check: "Pagination params within bounds (limit 1..100, offset >= 0)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all list endpoints"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving clock control ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server clock to a fixed UTC instant; also fires due-date/expiry sweeps (BackgroundCheck CLEARED->EXPIRED, SupervisionContact OPEN->MISSED evaluation)"
    roles: [Coordinator]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "Advances clock; sweeps CLEARED BackgroundCheck rows past valid_until to EXPIRED (clearing cleared_check_id)"

  # --- Volunteer ---
  - method: POST
    path: "/volunteers"
    description: "Register a Volunteer (Big) in APPLIED"
    roles: [Coordinator, MatchSpecialist]
    code: 201
    input: [full_name, email, gender, home_zip, interest_tags, max_weekly_hours]
    output: Volunteer
    side_effects: ["status=APPLIED, active_match_count=0, cleared_check_id=null"]

  - method: GET
    path: "/volunteers/{id}"
    description: "Get a Volunteer"
    roles: [Coordinator, MatchSpecialist, BackgroundScreener, Supervisor]
    code: 200
    input: []
    output: Volunteer
    side_effects: []

  - method: GET
    path: "/volunteers"
    description: "List Volunteers (filterable)"
    roles: [Coordinator, MatchSpecialist, BackgroundScreener, Supervisor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Volunteer[]
    side_effects: []

  - method: POST
    path: "/volunteers/{id}/submit-screening"
    description: "Move Volunteer APPLIED -> SCREENING (initial) or ELIGIBLE -> SCREENING (re-screen, requires active_match_count==0); cascades three fresh PENDING BackgroundCheck rows"
    roles: [BackgroundScreener]
    code: 200
    input: []
    output: Volunteer
    side_effects: ["Creates CRIMINAL, DMV, CHILD_ABUSE_REGISTRY PENDING checks; on re-screen clears cleared_check_id"]

  - method: POST
    path: "/volunteers/{id}/deactivate"
    description: "Move an unmatched ELIGIBLE Volunteer to INACTIVE"
    roles: [MatchSpecialist]
    code: 200
    input: []
    output: Volunteer
    side_effects: ["status=INACTIVE"]

  - method: GET
    path: "/volunteers/{id}/background-checks"
    description: "Reverse-reachability: list BackgroundCheck rows for a Volunteer"
    roles: [Coordinator, MatchSpecialist, BackgroundScreener, Supervisor]
    code: 200
    input: []
    output: BackgroundCheck[]
    side_effects: []

  # --- BackgroundCheck ---
  - method: GET
    path: "/background-checks/{id}"
    description: "Get a BackgroundCheck"
    roles: [Coordinator, BackgroundScreener, MatchSpecialist, Supervisor]
    code: 200
    input: []
    output: BackgroundCheck
    side_effects: []

  - method: POST
    path: "/background-checks/{id}/adjudicate"
    description: "Adjudicate a PENDING check to CLEARED or FLAGGED"
    roles: [BackgroundScreener]
    code: 200
    input: [decision, adverse_findings]
    output: BackgroundCheck
    side_effects:
      - "decision=CLEAR -> CLEARED, sets valid_until; third clear bubbles Volunteer ELIGIBLE"
      - "decision=FLAG -> FLAGGED; bubbles Volunteer SCREENING_FAILED and declines any OFFERED proposal"

  # --- Guardian ---
  - method: POST
    path: "/guardians"
    description: "Register a Guardian"
    roles: [Coordinator, MatchSpecialist]
    code: 201
    input: [full_name, email, "consent_on_file?"]
    output: Guardian
    side_effects: []

  - method: GET
    path: "/guardians/{id}"
    description: "Get a Guardian"
    roles: [Coordinator, MatchSpecialist, Supervisor]
    code: 200
    input: []
    output: Guardian
    side_effects: []

  - method: PATCH
    path: "/guardians/{id}"
    description: "Update Guardian; chiefly to record consent_on_file"
    roles: [Coordinator, MatchSpecialist]
    code: 200
    input: ["consent_on_file?", "expected_guardian_version"]
    output: Guardian
    side_effects: ["increments Guardian.version by 1"]

  - method: GET
    path: "/guardians/{id}/children"
    description: "Reverse-reachability: list Children of a Guardian"
    roles: [Coordinator, MatchSpecialist, Supervisor]
    code: 200
    input: []
    output: Child[]
    side_effects: []

  # --- Child ---
  - method: POST
    path: "/children"
    description: "Enroll a Child (Little) in WAITLISTED"
    roles: [Coordinator, MatchSpecialist]
    code: 201
    input: [guardian_id, first_name, age, gender, home_zip, interest_tags, "requires_same_gender?"]
    output: Child
    side_effects: ["status=WAITLISTED"]

  - method: GET
    path: "/children/{id}"
    description: "Get a Child"
    roles: [Coordinator, MatchSpecialist, Supervisor]
    code: 200
    input: []
    output: Child
    side_effects: []

  - method: GET
    path: "/children"
    description: "List Children (filterable)"
    roles: [Coordinator, MatchSpecialist, Supervisor]
    code: 200
    input: ["status?", "guardian_id?", "limit?", "offset?"]
    output: Child[]
    side_effects: []

  - method: POST
    path: "/children/{id}/propose-match"
    description: "Run the interest-matching selector and create an OFFERED MatchProposal for this Child"
    roles: [MatchSpecialist]
    code: 201
    input: [expected_child_version]
    output: MatchProposal
    side_effects:
      - "Selects top-ranked eligible Volunteer; creates OFFERED MatchProposal; Child WAITLISTED -> PROPOSED"
      - "Supersedes any prior OFFERED proposal for the Child; increments Child.version by 1"

  - method: GET
    path: "/children/{id}/proposals"
    description: "Reverse-reachability: list MatchProposals for a Child"
    roles: [Coordinator, MatchSpecialist, Supervisor]
    code: 200
    input: []
    output: MatchProposal[]
    side_effects: []

  - method: GET
    path: "/children/{id}/match"
    description: "Reverse-reachability: list Matches for a Child (0 or 1)"
    roles: [Coordinator, MatchSpecialist, Supervisor]
    code: 200
    input: []
    output: Match[]
    side_effects: []

  # --- MatchProposal ---
  - method: GET
    path: "/match-proposals/{id}"
    description: "Get a MatchProposal"
    roles: [Coordinator, MatchSpecialist, Supervisor]
    code: 200
    input: []
    output: MatchProposal
    side_effects: []

  - method: GET
    path: "/match-proposals"
    description: "List MatchProposals; filterable by child_id or volunteer_id (reverse-reachability for MatchProposal.volunteer_id)"
    roles: [Coordinator, MatchSpecialist, Supervisor]
    code: 200
    input: ["child_id?", "volunteer_id?", "status?", "limit?", "offset?"]
    output: MatchProposal[]
    side_effects: []

  - method: POST
    path: "/match-proposals/{id}/accept"
    description: "Accept an OFFERED proposal; creates a Match in CONFIRMED"
    roles: [MatchSpecialist]
    code: 201
    input: [expected_volunteer_version]
    output: Match
    side_effects:
      - "Creates Match CONFIRMED; bubbles Child -> MATCHED, Volunteer -> MATCHED; increments Volunteer.version by 1"

  - method: POST
    path: "/match-proposals/{id}/decline"
    description: "Decline an OFFERED proposal; Child reverts to WAITLISTED"
    roles: [MatchSpecialist]
    code: 200
    input: [decline_reason]
    output: MatchProposal
    side_effects: ["proposal -> DECLINED; Child PROPOSED -> WAITLISTED"]

  - method: GET
    path: "/match-proposals/{id}/match"
    description: "Reverse-reachability: list Matches produced by a proposal (0 or 1)"
    roles: [Coordinator, MatchSpecialist, Supervisor]
    code: 200
    input: []
    output: Match[]
    side_effects: []

  # --- Match ---
  - method: GET
    path: "/matches/{id}"
    description: "Get a Match (includes derived compliance_status, total_mentoring_minutes)"
    roles: [Coordinator, MatchSpecialist, Supervisor]
    code: 200
    input: []
    output: Match
    side_effects: []

  - method: GET
    path: "/matches"
    description: "List Matches (filterable by relationship_status / compliance_status)"
    roles: [Coordinator, MatchSpecialist, Supervisor]
    code: 200
    input: ["relationship_status?", "compliance_status?", "volunteer_id?", "limit?", "offset?"]
    output: Match[]
    side_effects: []

  - method: POST
    path: "/matches/{id}/meetings"
    description: "Schedule a MatchMeeting (introduction) for a Match; enforces per-Match overlap and per-Guardian buffer (see meeting_overlap_check)"
    roles: [MatchSpecialist]
    code: 201
    input: [scheduled_start, scheduled_end, location]
    output: MatchMeeting
    side_effects: ["status=SCHEDULED"]

  - method: GET
    path: "/matches/{id}/meetings"
    description: "Reverse-reachability: list MatchMeetings for a Match"
    roles: [Coordinator, MatchSpecialist, Supervisor]
    code: 200
    input: []
    output: MatchMeeting[]
    side_effects: []

  - method: POST
    path: "/matches/{id}/activities"
    description: "Append an ActivityLog entry (monthly activity tracking) to an ACTIVE Match"
    roles: [MatchSpecialist, Supervisor]
    code: 201
    input: [occurred_at, duration_minutes, activity_type]
    output: ActivityLog
    side_effects: ["status=LOGGED; recomputes Match.total_mentoring_minutes and last_activity_at; recomputes compliance_status"]

  - method: GET
    path: "/matches/{id}/activities"
    description: "Reverse-reachability: list ActivityLog entries for a Match"
    roles: [Coordinator, MatchSpecialist, Supervisor]
    code: 200
    input: ["limit?", "offset?"]
    output: ActivityLog[]
    side_effects: []

  - method: POST
    path: "/matches/{id}/exit-transitions"
