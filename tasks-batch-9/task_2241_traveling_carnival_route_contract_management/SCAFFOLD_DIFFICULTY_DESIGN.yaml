              as: PlatformAdmin
              captures: { venue_p3: $.data.id }
            - call: "POST /routes"
              payload: { name: "2026 Midwest Swing", season_year: 2026, home_base_state: "OH" }
              as: RouteManager
              captures: { route_p3: $.data.id }
            - call: "POST /route-stops"
              payload: { route_id: "${route_p3}", venue_id: "${venue_p3}", load_in_start: "2026-09-01T06:00:00Z", open_date: "2026-09-04T12:00:00Z", close_date: "2026-09-07T12:00:00Z", teardown_deadline: "2026-09-08T12:00:00Z" }
              as: RouteManager
              captures: { stop_p3: $.data.id }
            - call: "POST /permit-applications"
              payload: { route_stop_id: "${stop_p3}", permit_type: "EVENT", valid_from: "2026-09-04T00:00:00Z", valid_until: "2026-09-08T00:00:00Z" }
              as: ComplianceClerk
              captures: { permit_p3: $.data.id }
            - call: "POST /permit-applications/${permit_p3}/submit"
              payload: {}
              as: ComplianceClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /permit-applications/${permit_p3}/submit"
              payload: {}
              as: ComplianceClerk
              captures: { pair_error_3: $.data.error_id }
          assert:
            - "Before the trigger: PermitApplication.${permit_p3}.status == SUBMITTED and submitted_at == 2026-08-01T00:00:00Z"
            - "At trigger time floor((2026-09-04T12:00:00Z - 2026-09-02T00:00:00Z) / 86400) == 2, which is less than permit_lead_days 10"
            - "The trigger returns HTTP 409 with error_id == ERR_PERMIT_STATE_INVALID"
            - "The trigger does NOT return ERR_PERMIT_LEAD_TIME_VIOLATION even though rule 72 is independently violated"
            - "After the trigger: PermitApplication.${permit_p3}.status is still SUBMITTED and submitted_at is still 2026-08-01T00:00:00Z"

  # ===========================================================================
  # RULE 6 — boundary_precision_check
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: split_tier_lower_bound_is_inclusive_at_exactly_two_million_net_cents
        grounds:
          - calculations.stop_settlement
          - entities.Settlement.fields.effective_operator_pct
          - entities.Settlement.fields.split_share_cents
          - state_machines.Settlement.DISPUTED_to_PROVISIONAL
        distinguishing_aspect: |
          The boundary is a MONEY THRESHOLD tested on the same settlement row across a reconcile: at
          taxable_net_cents == 1999999 (one cent below SPLIT_TIER_1_CENTS) the bonus is 0.0 pp so the split is
          round_half_up(1999999 * 65 / 100) == 1299999, and at exactly 2000000 the inclusive `>=` fires, the bonus
          becomes 2.5 pp and the split jumps to 1350000. A strict `>` implementation would leave 1299999 in place
          after the one-cent sale is added.
        test_recipe:
          setup:
            - "Jurisdiction IN with amusement_tax_pct 0 (so gross == taxable_net and the boundary is exact), permit_lead_days 0, max_consecutive_work_days 6."
            - "Venue V4 in IN, one FLAT ride, one operator certified for FLAT rated 2000 cents/hour."
            - "Contract C1 EXECUTED with revenue_split_pct_operator 65, guarantee_cents 0, ride_minimum_count 0, settlement_basis SPLIT_ONLY."
            - "Stop A is OPEN with TicketSale rows WRISTBAND 400x4999 (1999600) and SINGLE 399x1 (399), i.e. gross 1999999."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
