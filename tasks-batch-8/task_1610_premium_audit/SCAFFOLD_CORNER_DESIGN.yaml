          setup_api_calls:
            - { call: "POST /classification-codes", payload: { code: "8810", description: "Clerical", state_code: "CA", coverage_line: "WC", rate_per_100_cents: 40, high_hazard: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: Underwriter, captures: { cc_a: "$.data.id" } }
            - { call: "POST /policies", payload: { policy_number: "WC-O2", insured_name: "OCC2 Co", coverage_line: "WC", state_code: "CA", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-07-31T00:00:00Z", estimated_annual_premium_cents: 600000, minimum_premium_cents: 10000, payroll_estimate_dollars: 100000, experience_mod_factor: 1.00, class_code_ids: ["${cc_a}"] }, as: Underwriter, captures: { pol: "$.data.id" } }
            - { call: "POST /auditors", payload: { full_name: "Ada Auditor", territory_states: ["CA"], level: "SENIOR" }, as: AuditManager, captures: { aud: "$.data.id" } }
            - { call: "POST /audit-selection-runs", payload: {}, as: AuditManager }
            - { call: "GET /audit-work-orders", payload: { policy_id: "${pol}" }, as: AuditManager, captures: { wo: "$.data[0].id" } }
            - { call: "POST /audit-work-orders/${wo}/assign", payload: { auditor_id: "${aud}" }, as: AuditManager }
            - { call: "POST /audit-work-orders/${wo}/records-requests", payload: { request_type: "PAYROLL_SUMMARY" }, as: AuditManager }
            - { call: "GET /audit-work-orders/${wo}", payload: {}, as: AuditManager, captures: { wo_v: "$.data.version" } }
            - { call: "POST /audit-work-orders/${wo}/records-requests", payload: { request_type: "TAX_FILINGS" }, as: AuditManager }
          trigger:
            - { call: "POST /audit-work-orders/${wo}/payroll-allocations", payload: { class_code_id: "${cc_a}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", gross_payroll_dollars: 40000, expected_work_order_version: "${wo_v}" }, as: Auditor, as_user_id: "${aud}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_STALE_VERSION (the records-request creation bumped the work-order version after the client read it)"

      - name: version_increments_on_each_mutation
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[appointment-create-stale-work-order]", entities.AuditWorkOrder]
        distinguishing_aspect: "AuditWorkOrder.version starts at 1 at selection and increments by exactly 1 per mutation: assign -> 2, records request -> 3."
        test_recipe:
          setup: ["WC policy WC-O3 -> VOLUNTARY_REPORT work order"]
          setup_api_calls:
            - { call: "POST /classification-codes", payload: { code: "8810", description: "Clerical", state_code: "CA", coverage_line: "WC", rate_per_100_cents: 40, high_hazard: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: Underwriter, captures: { cc_a: "$.data.id" } }
            - { call: "POST /policies", payload: { policy_number: "WC-O3", insured_name: "Version Co", coverage_line: "WC", state_code: "CA", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-07-31T00:00:00Z", estimated_annual_premium_cents: 600000, minimum_premium_cents: 10000, payroll_estimate_dollars: 100000, experience_mod_factor: 1.00, class_code_ids: ["${cc_a}"] }, as: Underwriter, captures: { pol: "$.data.id" } }
            - { call: "POST /auditors", payload: { full_name: "Ada Auditor", territory_states: ["CA"], level: "SENIOR" }, as: AuditManager, captures: { aud: "$.data.id" } }
            - { call: "POST /audit-selection-runs", payload: {}, as: AuditManager }
            - { call: "GET /audit-work-orders", payload: { policy_id: "${pol}" }, as: AuditManager, captures: { wo: "$.data[0].id", v0: "$.data[0].version" } }
          trigger:
            - { call: "POST /audit-work-orders/${wo}/assign", payload: { auditor_id: "${aud}" }, as: AuditManager, captures: { v1: "$.data.version" } }
            - { call: "POST /audit-work-orders/${wo}/records-requests", payload: { request_type: "PAYROLL_SUMMARY" }, as: AuditManager }
            - { call: "GET /audit-work-orders/${wo}", payload: {}, as: AuditManager, captures: { v2: "$.data.version" } }
          assert:
            - "version at creation == 1"
            - "after assign: version == 2"
            - "after records-request creation: version == 3"

      - name: cascading_side_effects_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds: [complexity_profile]
        excluded_because:
          difficulty_instance: records_overdue_to_policy_cancellation_chain
          rationale: "The N-level cascade (clock -> request OVERDUE -> NONCOMPLIANT_PENDING -> estimated billing -> PAST_DUE -> policy CANCELLED) is asserted hop-by-hop there."

      - name: dual_variant_layer_covered_by_difficulty
        claim_type: dual_variant_calculation
        grounds: [complexity_profile]
        excluded_because:
          difficulty_instance: audit_result_provisional_vs_final_payroll_inclusion
          rationale: "Provisional vs final input sets produce different manual/earned figures on identical data."

      - name: rate_threshold_layer_covered_by_difficulty
        claim_type: rate_threshold_triggers
        grounds: [complexity_profile]
        excluded_because:
          difficulty_instance: selection_tier_premium_threshold_exact
          rationale: "The >= 1000000 / >= 500000 tier thresholds and their exact boundaries are asserted there."

      - name: filtered_list_status_and_policy_interplay
        claim_type: pagination_with_filtering
        grounds: [entities.AuditWorkOrder]
        distinguishing_aspect: "GET /audit-work-orders composes filters: status=SELECTED returns both work orders; policy_id narrows to exactly one; the pair composes."
        test_recipe:
          setup: ["policies WC-O4A (est 2000000 -> PHYSICAL) and WC-O4B (est 600000 -> VOLUNTARY_REPORT) both selected"]
          setup_api_calls:
            - { call: "POST /classification-codes", payload: { code: "8810", description: "Clerical", state_code: "CA", coverage_line: "WC", rate_per_100_cents: 40, high_hazard: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: Underwriter, captures: { cc_a: "$.data.id" } }
            - { call: "POST /policies", payload: { policy_number: "WC-O4A", insured_name: "Filter A", coverage_line: "WC", state_code: "CA", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-07-31T00:00:00Z", estimated_annual_premium_cents: 2000000, minimum_premium_cents: 100000, payroll_estimate_dollars: 100000, experience_mod_factor: 1.00, class_code_ids: ["${cc_a}"] }, as: Underwriter, captures: { pol_a: "$.data.id" } }
            - { call: "POST /policies", payload: { policy_number: "WC-O4B", insured_name: "Filter B", coverage_line: "WC", state_code: "CA", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-07-31T00:00:00Z", estimated_annual_premium_cents: 600000, minimum_premium_cents: 10000, payroll_estimate_dollars: 100000, experience_mod_factor: 1.00, class_code_ids: ["${cc_a}"] }, as: Underwriter, captures: { pol_b: "$.data.id" } }
            - { call: "POST /audit-selection-runs", payload: {}, as: AuditManager }
          trigger:
            - { call: "GET /audit-work-orders", payload: { status: "SELECTED" }, as: AuditManager }
            - { call: "GET /audit-work-orders", payload: { status: "SELECTED", policy_id: "${pol_a}" }, as: AuditManager }
            - { call: "GET /audit-work-orders", payload: { status: "CLOSED" }, as: AuditManager }
          assert:
            - "status=SELECTED: total_count == 2"
            - "status=SELECTED + policy_id=${pol_a}: total_count == 1 and the item's audit_type == PHYSICAL"
            - "status=CLOSED: total_count == 0 (empty set is a valid result, not an error)"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_consistency_derived_total
        claim_type: immediate_consistency
        grounds: [complexity_profile, entities.AuditWorkOrder.fields.total_premium_base_dollars]
        distinguishing_aspect: "Immediate consistency: a GET issued right after verify reflects the recomputed total_premium_base_dollars in the same request sequence — no lag, no recompute endpoint."
        test_recipe:
          setup: ["WC policy WC-M1 -> VOLUNTARY_REPORT work order with one VERIFIED allocation 40000 on 8810"]
          setup_api_calls:
            - { call: "POST /classification-codes", payload: { code: "8810", description: "Clerical", state_code: "CA", coverage_line: "WC", rate_per_100_cents: 40, high_hazard: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: Underwriter, captures: { cc_a: "$.data.id" } }
            - { call: "POST /policies", payload: { policy_number: "WC-M1", insured_name: "Now Co", coverage_line: "WC", state_code: "CA", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-07-31T00:00:00Z", estimated_annual_premium_cents: 600000, minimum_premium_cents: 10000, payroll_estimate_dollars: 100000, experience_mod_factor: 1.00, class_code_ids: ["${cc_a}"] }, as: Underwriter, captures: { pol: "$.data.id" } }
            - { call: "POST /auditors", payload: { full_name: "Ada Auditor", territory_states: ["CA"], level: "SENIOR" }, as: AuditManager, captures: { aud: "$.data.id" } }
            - { call: "POST /audit-selection-runs", payload: {}, as: AuditManager }
            - { call: "GET /audit-work-orders", payload: { policy_id: "${pol}" }, as: AuditManager, captures: { wo: "$.data[0].id" } }
            - { call: "POST /audit-work-orders/${wo}/assign", payload: { auditor_id: "${aud}" }, as: AuditManager }
            - { call: "POST /audit-work-orders/${wo}/records-requests", payload: { request_type: "PAYROLL_SUMMARY" }, as: AuditManager }
            - { call: "GET /audit-work-orders/${wo}", payload: {}, as: AuditManager, captures: { wo_v: "$.data.version" } }
            - { call: "POST /audit-work-orders/${wo}/payroll-allocations", payload: { class_code_id: "${cc_a}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", gross_payroll_dollars: 40000, expected_work_order_version: "${wo_v}" }, as: Auditor, as_user_id: "${aud}", captures: { al1: "$.data.id" } }
            - { call: "GET /audit-work-orders/${wo}", payload: {}, as: AuditManager, captures: { tot_before: "$.data.total_premium_base_dollars" } }
          trigger:
            - { call: "POST /payroll-allocations/${al1}/verify", payload: {}, as: Auditor, as_user_id: "${aud}" }
            - { call: "GET /audit-work-orders/${wo}", payload: {}, as: AuditManager, captures: { tot_after: "$.data.total_premium_base_dollars" } }
          assert:
            - "before verify: total_premium_base_dollars == 0 (DRAFT allocation excluded)"
            - "immediately after verify: total_premium_base_dollars == 40000 in the next GET"
