          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "WITHDRAWN is a declared terminal state, so PUBLIC_COMMENT, APPROVED and a repeat WITHDRAWN are all rejected with 409 ERR_INVALID_STATE and the row's status never moves."
        test_recipe:
          setup:
            - "Watershed SCR with one mainstem reach and one INVENTORIED POINT source on TMDL-P-2026."
