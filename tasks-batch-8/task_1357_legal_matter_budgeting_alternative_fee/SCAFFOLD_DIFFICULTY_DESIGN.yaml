  # -------------------------------------------------------------------------
  # Rule 4 — Transitive cascade chains from different triggers
  # -------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: time_entry_approve_cascade_to_alert_level
        grounds:
          - state_machines.TimeEntry
          - calculations.matter_budget_variance
          - entities.Matter.fields.variance_alert_level
        distinguishing_aspect: |
          Cascade chain of depth 3 originating from TimeEntry APPROVED:
          (1) TimeEntry.SUBMITTED→APPROVED triggers (2) recompute
          Matter.actual_fees_cents / variance_cents / variance_pct_bp, which
          (3) triggers variance_alert_level transition NONE → WATCH → WARNING
          → BREACH based on thresholds. The third link is caused by the
          second, not the original action.
        test_recipe:
          setup:
            - "Matter M1 with budget_total_cents=100000 (single phase PB1)"
            - "No time entries yet; variance_alert_level = NONE"
          setup_api_calls:
