  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_stale_version_is_rejected_on_each_declared_concurrency_rule
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[recount-create-stale-contest]
          - concurrency_rules[round-create-stale-audit]
          - concurrency_rules[batch-retrieve-stale-ballot-batch]
          - errors[ERR_STALE_CONTEST_VERSION]
          - errors[ERR_STALE_AUDIT_VERSION]
          - errors[ERR_STALE_BALLOT_BATCH_VERSION]
        distinguishing_aspect: |
          All three declared guards are exercised through their own write endpoint and occ_field, each with
          the version the client observed one step too early: the audit version read at creation, the ballot
          batch version read before the round authorised it, and the contest version read before the first
          recount was filed - and each retry with the re-read version succeeds, so the guard is about staleness
          and not about the request.
        test_recipe:
          setup:
            - "E1 with C1 canvassed at contest version 2 and audit A1 created (version 1) then seeded"
            - "(version 2). The six batches are at version 1 because no round has authorised them yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-05T09:00:00Z" }
              as: ElectionsDirector
            - call: "POST /elections"
              payload: { jurisdiction_code: "ST-01", election_name: "2026 General Election", election_date: "2026-11-03", certification_deadline_at: "2026-11-24T17:00:00Z" }
              as: ElectionsDirector
              captures: { e1_id: "$.data.id" }
