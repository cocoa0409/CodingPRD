            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "MOBILIZED" }
              as: CONTRACTOR_PM
            - call: "POST /crews"
              payload: { crew_code: "CR-C1", crew_type: "OVERHEAD", base_rate_per_hour: 55.00 }
              as: CONTRACTOR_PM
              captures: { crew_id: $.data.id }
            - call: "POST /equipment"
              payload: { equipment_code: "EQ-C1", kind: "REEL_TRAILER", daily_rate: 90.00 }
              as: CONTRACTOR_PM
              captures: { eq_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/assignments"
              payload: { crew_id: "${crew_id}", equipment_id: "${eq_id}", start_date: "2026-08-03", end_date: "2026-08-07" }
              as: FOREMAN
              captures: { asg_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "IN_PROGRESS" }
              as: CONTRACTOR_PM
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T12:00:00Z" }
              as: CONTRACTOR_PM
            - call: "POST /assignments/${asg_id}/transition"
              payload: { to: "ACTIVE" }
              as: FOREMAN
              captures: { asg_v: $.data.version }
            - call: "POST /assignments/${asg_id}/production-entries"
              payload: { bid_item_id: "${bid_id}", work_date: "2026-08-03", quantity_reported: 100, expected_assignment_version: "${asg_v}" }
              as: FOREMAN
              captures: { e1: $.data.id }
            - call: "GET /assignments/${asg_id}"
              payload: {}
              as: FOREMAN
              captures: { asg_v2: $.data.version }
          trigger:
            - call: "POST /assignments/${asg_id}/production-entries"
              payload: { bid_item_id: "${bid_id}", work_date: "2026-08-04", quantity_reported: 25, expected_assignment_version: "${asg_v2}" }
              as: FOREMAN
              captures: { e2: $.data.id }
            - call: "GET /assignments/${asg_id}"
              payload: {}
              as: FOREMAN
              captures: { asg_v3: $.data.version }
            - call: "POST /assignments/${asg_id}/production-entries"
              payload: { bid_item_id: "${bid_id}", work_date: "2026-08-05", quantity_reported: 1, expected_assignment_version: "${asg_v3}" }
              as: FOREMAN
              captures: { err: $.data.error_id }
          assert:
            - "entry of 25 units succeeds (201): cumulative 100+25 = 125 == estimated 100 x 1.25 exactly, equality allowed"
            - "entry of 1 more unit fails with error_id == ERR_QUANTITY_CAP_EXCEEDED (126 > 125)"
            - "ProductionEntry.${e2}.status == SUBMITTED"

  # ------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency
  # ------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: production_requires_in_effect_outage
        grounds:
          - validations[priority=8]
          - state_machines.OutageRequest.APPROVED_to_IN_EFFECT
          - entities.ProductionEntry.fields.work_date
        distinguishing_aspect: |
          Entity pair ProductionEntry x OutageRequest: on a requires_outage
          work package, entry creation is rejected with ERR_OUTAGE_REQUIRED
          until an OutageRequest of the same work package is IN_EFFECT with a
          window covering work_date; once approved and the logical clock enters
          the window, the same creation succeeds.
        test_recipe:
          setup:
            - "Contract ACTIVE; work package requires_outage=true, IN_PROGRESS; ACTIVE assignment, clock 2026-08-03T12:00:00Z"
            - "No outage request exists yet"
          setup_api_calls:
            - call: "POST /contracts"
              payload: { utility_name: "City Power", contract_number: "C-800", effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }
              as: CONTRACTOR_PM
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/bid-items"
              payload: { item_code: "UG-SPLICE", description: "Cable splice", unit: "EACH", unit_price: 75.00, estimated_quantity: 60 }
              as: CONTRACTOR_PM
              captures: { bid_id: $.data.id }
            - call: "POST /contracts/${cid}/transition"
              payload: { to: "ACTIVE" }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/work-packages"
              payload: { name: "Splice pit S-4", location: "River crossing", requires_outage: true }
              as: CONTRACTOR_PM
              captures: { wp_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "MOBILIZED" }
              as: CONTRACTOR_PM
            - call: "POST /crews"
              payload: { crew_code: "CR-O", crew_type: "UNDERGROUND", base_rate_per_hour: 58.00 }
              as: CONTRACTOR_PM
              captures: { crew_id: $.data.id }
            - call: "POST /equipment"
              payload: { equipment_code: "EQ-O", kind: "TRENCHER", daily_rate: 180.00 }
              as: CONTRACTOR_PM
              captures: { eq_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/assignments"
              payload: { crew_id: "${crew_id}", equipment_id: "${eq_id}", start_date: "2026-08-03", end_date: "2026-08-07" }
              as: FOREMAN
              captures: { asg_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "IN_PROGRESS" }
              as: CONTRACTOR_PM
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T12:00:00Z" }
              as: CONTRACTOR_PM
            - call: "POST /assignments/${asg_id}/transition"
              payload: { to: "ACTIVE" }
              as: FOREMAN
              captures: { asg_v: $.data.version }
          trigger:
            - call: "POST /assignments/${asg_id}/production-entries"
              payload: { bid_item_id: "${bid_id}", work_date: "2026-08-03", quantity_reported: 5, expected_assignment_version: "${asg_v}" }
              as: FOREMAN
              captures: { err: $.data.error_id }
            - call: "POST /work-packages/${wp_id}/outage-requests"
              payload: { circuit_id: "CKT-4", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T17:00:00Z" }
              as: CONTRACTOR_PM
              captures: { o1: $.data.id }
            - call: "POST /outage-requests/${o1}/decide"
              payload: { decision: "APPROVED" }
              as: UTILITY_DISPATCHER
            - call: "POST /assignments/${asg_id}/production-entries"
              payload: { bid_item_id: "${bid_id}", work_date: "2026-08-03", quantity_reported: 5, expected_assignment_version: "${asg_v}" }
              as: FOREMAN
              captures: { e1: $.data.id }
          assert:
            - "first creation fails with error_id == ERR_OUTAGE_REQUIRED (no IN_EFFECT outage covers 2026-08-03)"
            - "after approval, OutageRequest.${o1}.status evaluates to IN_EFFECT because the logical clock 2026-08-03T12:00:00Z is inside its window"
            - "second creation succeeds (201) and ProductionEntry.${e1}.status == SUBMITTED"

      - name: completion_requires_material_reconciliation
        grounds:
          - validations[priority=9l]
          - state_machines.MaterialIssue.OPEN_to_RECONCILED
          - entities.WorkPackage.fields.open_material_issue_count
        distinguishing_aspect: |
          Entity pair WorkPackage x MaterialIssue (different pair than
          ProductionEntry x OutageRequest): the PUNCH -> COMPLETED transition is
          rejected with ERR_OPEN_MATERIAL_ISSUES while any MaterialIssue of the
          work package is OPEN; after a return of 4 and reconcile of 6
          installed (6 + 4 == 10 issued) the same transition succeeds.
        test_recipe:
          setup:
            - "Contract ACTIVE; work package IN_PROGRESS with one ACTIVE assignment"
            - "StockItem with on_hand 10; MaterialIssue mi1 of 10 units OPEN against the work package"
            - "Work package advanced to PUNCH"
          setup_api_calls:
            - call: "POST /contracts"
              payload: { utility_name: "City Power", contract_number: "C-801", effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }
              as: CONTRACTOR_PM
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/bid-items"
              payload: { item_code: "OH-POLE-40", description: "40ft pole", unit: "EACH", unit_price: 90.00, estimated_quantity: 30 }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/transition"
              payload: { to: "ACTIVE" }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/work-packages"
              payload: { name: "Pole repl P-8", location: "Feeder F-8", requires_outage: false }
              as: CONTRACTOR_PM
              captures: { wp_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "MOBILIZED" }
              as: CONTRACTOR_PM
            - call: "POST /crews"
              payload: { crew_code: "CR-W", crew_type: "OVERHEAD", base_rate_per_hour: 55.00 }
              as: CONTRACTOR_PM
              captures: { crew_id: $.data.id }
            - call: "POST /equipment"
              payload: { equipment_code: "EQ-W", kind: "DIGGER_DERRICK", daily_rate: 200.00 }
              as: CONTRACTOR_PM
              captures: { eq_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/assignments"
              payload: { crew_id: "${crew_id}", equipment_id: "${eq_id}", start_date: "2026-08-03", end_date: "2026-08-07" }
              as: FOREMAN
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "IN_PROGRESS" }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/stock-items"
              payload: { material_code: "POLE-40", description: "40ft wood pole", uom: "EACH", initial_on_hand: 10 }
              as: UTILITY_DISPATCHER
              captures: { stock_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/material-issues"
              payload: { stock_item_id: "${stock_id}", quantity_issued: 10 }
              as: FOREMAN
              captures: { mi1: $.data.id }
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "PUNCH" }
              as: CONTRACTOR_PM
          trigger:
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "COMPLETED" }
              as: CONTRACTOR_PM
              captures: { err: $.data.error_id }
            - call: "POST /material-issues/${mi1}/return"
              payload: { quantity: 4 }
              as: FOREMAN
            - call: "POST /material-issues/${mi1}/reconcile"
              payload: { quantity_installed: 6 }
              as: FOREMAN
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "COMPLETED" }
              as: CONTRACTOR_PM
          assert:
            - "first COMPLETED attempt fails with error_id == ERR_OPEN_MATERIAL_ISSUES"
            - "after return of 4 and reconcile of quantity_installed=6 (6+4==10): MaterialIssue.${mi1}.status == RECONCILED and variance == 0"
            - "WorkPackage.${wp_id}.open_material_issue_count == 0"
            - "second COMPLETED attempt succeeds; WorkPackage.${wp_id}.status == COMPLETED"

  # ------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap
  # ------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: crew_assignment_closed_interval_overlap
        grounds:
          - validations[priority=9]
          - entities.Assignment.fields.start_date
          - entities.Assignment.fields.end_date
        distinguishing_aspect: |
          Interval semantics: CLOSED day-intervals on the CREW resource. An
          existing assignment 2026-08-03..2026-08-07 conflicts with a new one
          starting 2026-08-07 (shared endpoint day), while 2026-08-08..2026-08-10
          is adjacent-disjoint and allowed.
        test_recipe:
          setup:
            - "Contract ACTIVE; work package MOBILIZED (assignments allowed)"
            - "Assignment a1 for crew CR-D over 2026-08-03..2026-08-07 (PLANNED)"
            - "Spare equipment EQ-D2 available"
          setup_api_calls:
            - call: "POST /contracts"
              payload: { utility_name: "City Power", contract_number: "C-900", effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }
              as: CONTRACTOR_PM
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/bid-items"
              payload: { item_code: "OH-GUY", description: "Guy wire install", unit: "EACH", unit_price: 45.00, estimated_quantity: 80 }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/transition"
              payload: { to: "ACTIVE" }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/work-packages"
              payload: { name: "Guarding G-1", location: "Feeder F-2", requires_outage: false }
              as: CONTRACTOR_PM
              captures: { wp_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "MOBILIZED" }
              as: CONTRACTOR_PM
            - call: "POST /crews"
              payload: { crew_code: "CR-D", crew_type: "OVERHEAD", base_rate_per_hour: 55.00 }
              as: CONTRACTOR_PM
              captures: { crew_id: $.data.id }
            - call: "POST /equipment"
              payload: { equipment_code: "EQ-D1", kind: "BUCKET_TRUCK", daily_rate: 120.00 }
              as: CONTRACTOR_PM
              captures: { eq1: $.data.id }
            - call: "POST /equipment"
              payload: { equipment_code: "EQ-D2", kind: "DIGGER_DERRICK", daily_rate: 200.00 }
              as: CONTRACTOR_PM
              captures: { eq2: $.data.id }
            - call: "POST /work-packages/${wp_id}/assignments"
              payload: { crew_id: "${crew_id}", equipment_id: "${eq1}", start_date: "2026-08-03", end_date: "2026-08-07" }
              as: FOREMAN
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /work-packages/${wp_id}/assignments"
              payload: { crew_id: "${crew_id}", equipment_id: "${eq2}", start_date: "2026-08-07", end_date: "2026-08-10" }
              as: FOREMAN
              captures: { err: $.data.error_id }
            - call: "POST /work-packages/${wp_id}/assignments"
              payload: { crew_id: "${crew_id}", equipment_id: "${eq2}", start_date: "2026-08-08", end_date: "2026-08-10" }
              as: FOREMAN
              captures: { a2: $.data.id }
          assert:
            - "2026-08-07..2026-08-10 fails with error_id == ERR_CREW_SCHEDULE_CONFLICT (shares the closed-interval endpoint day 2026-08-07)"
            - "2026-08-08..2026-08-10 succeeds (201): adjacency after the prior end date is allowed"
            - "Assignment.${a2}.status == PLANNED"

      - name: outage_window_sixty_minute_buffer
        grounds:
          - validations[priority=9c]
          - state_machines.OutageRequest.REQUESTED_to_APPROVED
        distinguishing_aspect: |
          Different interval semantics on a different resource (circuit windows
          on OutageRequest vs crew day-intervals): approval of an outage 30
          minutes after another APPROVED outage on circuit CKT-9 is rejected
          (inside the 60-minute clearance buffer), while a gap of exactly 60
          minutes is allowed (>= buffer).
        test_recipe:
          setup:
            - "Contract ACTIVE; work package IN_PROGRESS (outage requests allowed on non-terminal packages)"
            - "OutageRequest o1 on circuit CKT-9 APPROVED for 2026-08-10T10:00:00Z..2026-08-10T12:00:00Z"
          setup_api_calls:
            - call: "POST /contracts"
              payload: { utility_name: "City Power", contract_number: "C-901", effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }
              as: CONTRACTOR_PM
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/bid-items"
              payload: { item_code: "OH-RECLOSER", description: "Recloser install", unit: "EACH", unit_price: 400.00, estimated_quantity: 12 }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/transition"
              payload: { to: "ACTIVE" }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/work-packages"
              payload: { name: "Recloser program", location: "CKT-9 corridor", requires_outage: true }
              as: CONTRACTOR_PM
              captures: { wp_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "MOBILIZED" }
              as: CONTRACTOR_PM
            - call: "POST /work-packages/${wp_id}/outage-requests"
              payload: { circuit_id: "CKT-9", window_start: "2026-08-10T10:00:00Z", window_end: "2026-08-10T12:00:00Z" }
              as: CONTRACTOR_PM
              captures: { o1: $.data.id }
            - call: "POST /outage-requests/${o1}/decide"
              payload: { decision: "APPROVED" }
              as: UTILITY_DISPATCHER
            - call: "POST /work-packages/${wp_id}/outage-requests"
              payload: { circuit_id: "CKT-9", window_start: "2026-08-10T12:30:00Z", window_end: "2026-08-10T14:00:00Z" }
              as: CONTRACTOR_PM
              captures: { o2: $.data.id }
            - call: "POST /work-packages/${wp_id}/outage-requests"
              payload: { circuit_id: "CKT-9", window_start: "2026-08-10T13:00:00Z", window_end: "2026-08-10T15:00:00Z" }
              as: CONTRACTOR_PM
              captures: { o3: $.data.id }
          trigger:
            - call: "POST /outage-requests/${o2}/decide"
              payload: { decision: "APPROVED" }
              as: UTILITY_DISPATCHER
              captures: { err: $.data.error_id }
            - call: "POST /outage-requests/${o3}/decide"
              payload: { decision: "APPROVED" }
              as: UTILITY_DISPATCHER
          assert:
            - "o2 approval fails with error_id == ERR_OUTAGE_WINDOW_CONFLICT (12:30 start is only 30 minutes after o1's 12:00 end, inside the 60-minute buffer)"
            - "OutageRequest.${o2}.status remains REQUESTED"
            - "o3 approval succeeds (gap of exactly 60 minutes satisfies >= buffer) and OutageRequest.${o3}.status == APPROVED"

  # ------------------------------------------------------------------
  # Rule 9 — compensating_invariant
  # ------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: stock_issue_return_conservation
        grounds:
          - calculations.material_reconciliation
          - entities.StockItem.fields.on_hand
        distinguishing_aspect: |
          Conserved quantity: STOCK UNITS. on_hand = initial_on_hand +
          receipts - issued + returned; an issue of 30 paired with a return of
          30 restores on_hand from 100 to 70 and back to exactly 100.
        test_recipe:
          setup:
            - "Contract ACTIVE; work package IN_PROGRESS with assignment"
            - "StockItem 'WIRE-1/0' initial_on_hand 0 plus receipt of 100 (on_hand 100)"
          setup_api_calls:
            - call: "POST /contracts"
              payload: { utility_name: "City Power", contract_number: "C-1000", effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }
              as: CONTRACTOR_PM
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/bid-items"
              payload: { item_code: "OH-WIRE-1/0", description: "1/0 ACSR", unit: "LF", unit_price: 6.00, estimated_quantity: 500 }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/transition"
              payload: { to: "ACTIVE" }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/work-packages"
              payload: { name: "Reconductor R-5", location: "Feeder F-6", requires_outage: false }
              as: CONTRACTOR_PM
              captures: { wp_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "MOBILIZED" }
              as: CONTRACTOR_PM
            - call: "POST /crews"
              payload: { crew_code: "CR-S1", crew_type: "OVERHEAD", base_rate_per_hour: 55.00 }
              as: CONTRACTOR_PM
              captures: { crew_id: $.data.id }
            - call: "POST /equipment"
              payload: { equipment_code: "EQ-S1", kind: "REEL_TRAILER", daily_rate: 90.00 }
              as: CONTRACTOR_PM
              captures: { eq_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/assignments"
              payload: { crew_id: "${crew_id}", equipment_id: "${eq_id}", start_date: "2026-08-03", end_date: "2026-08-07" }
              as: FOREMAN
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "IN_PROGRESS" }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/stock-items"
              payload: { material_code: "WIRE-1/0", description: "1/0 ACSR wire", uom: "LF", initial_on_hand: 0 }
              as: UTILITY_DISPATCHER
              captures: { stock_id: $.data.id }
            - call: "POST /stock-items/${stock_id}/receipts"
              payload: { quantity: 100 }
              as: UTILITY_DISPATCHER
          trigger:
            - call: "POST /work-packages/${wp_id}/material-issues"
              payload: { stock_item_id: "${stock_id}", quantity_issued: 30 }
              as: FOREMAN
              captures: { mi1: $.data.id }
            - call: "POST /material-issues/${mi1}/return"
              payload: { quantity: 30 }
              as: FOREMAN
          assert:
            - "after receipt: StockItem.${stock_id}.on_hand == 100"
            - "after issue of 30: StockItem.${stock_id}.on_hand == 70"
            - "after return of 30: StockItem.${stock_id}.on_hand == 100 — the issue/return pair conserves stock units exactly"

      - name: invoice_submit_void_pool_conservation
        grounds:
          - calculations.billing_pool_reconciliation
          - state_machines.Invoice.SUBMITTED_to_VOID
          - entities.BidItem.fields.billed_quantity
        distinguishing_aspect: |
          Conserved quantity: BILLABLE UNITS (different quantity than stock).
          Submitting an invoice billing 50 units moves billed_quantity 0 -> 50
          and drains the remaining billable pool to 0; voiding the SUBMITTED
          invoice restores billed_quantity to 0 and remaining billable units to
          50, so billed + remaining == accepted (50) at every step.
        test_recipe:
          setup:
            - "Contract ACTIVE, bid item est=100 price=20.00; work package IN_PROGRESS"
            - "One ACCEPTED entry of 50 units (work_date 2026-08-04) in period 2026-08-01..2026-08-31"
          setup_api_calls:
            - call: "POST /contracts"
              payload: { utility_name: "City Power", contract_number: "C-1001", effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }
              as: CONTRACTOR_PM
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/bid-items"
              payload: { item_code: "OH-ANCHOR", description: "Anchor install", unit: "EACH", unit_price: 20.00, estimated_quantity: 100 }
              as: CONTRACTOR_PM
              captures: { bid_id: $.data.id }
            - call: "POST /contracts/${cid}/transition"
              payload: { to: "ACTIVE" }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/work-packages"
              payload: { name: "Anchor program", location: "Feeder F-10", requires_outage: false }
              as: CONTRACTOR_PM
              captures: { wp_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "MOBILIZED" }
              as: CONTRACTOR_PM
            - call: "POST /crews"
              payload: { crew_code: "CR-V", crew_type: "OVERHEAD", base_rate_per_hour: 55.00 }
              as: CONTRACTOR_PM
              captures: { crew_id: $.data.id }
            - call: "POST /equipment"
              payload: { equipment_code: "EQ-V", kind: "DIGGER_DERRICK", daily_rate: 200.00 }
              as: CONTRACTOR_PM
              captures: { eq_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/assignments"
              payload: { crew_id: "${crew_id}", equipment_id: "${eq_id}", start_date: "2026-08-03", end_date: "2026-08-07" }
              as: FOREMAN
              captures: { asg_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "IN_PROGRESS" }
              as: CONTRACTOR_PM
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T12:00:00Z" }
              as: CONTRACTOR_PM
            - call: "POST /assignments/${asg_id}/transition"
              payload: { to: "ACTIVE" }
              as: FOREMAN
              captures: { asg_v: $.data.version }
            - call: "POST /assignments/${asg_id}/production-entries"
              payload: { bid_item_id: "${bid_id}", work_date: "2026-08-04", quantity_reported: 50, expected_assignment_version: "${asg_v}" }
              as: FOREMAN
              captures: { e1: $.data.id }
            - call: "POST /work-packages/${wp_id}/inspections"
              payload: { production_entry_id: "${e1}", standard_code: "UTIL-OH-9.3" }
              as: UTILITY_INSPECTOR
              captures: { insp1: $.data.id }
            - call: "POST /inspections/${insp1}/submit"
              payload: { result: "PASS" }
              as: UTILITY_INSPECTOR
            - call: "GET /work-packages/${wp_id}"
              payload: {}
              as: CONTRACTOR_PM
              captures: { wp_v: $.data.version }
            - call: "POST /work-packages/${wp_id}/invoices"
              payload: { period_start: "2026-08-01", period_end: "2026-08-31", expected_work_package_version: "${wp_v}" }
              as: CONTRACTOR_PM
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /invoices/${inv_id}/transition"
              payload: { to: "SUBMITTED" }
              as: CONTRACTOR_PM
            - call: "POST /invoices/${inv_id}/transition"
              payload: { to: "VOID" }
              as: CONTRACTOR_PM
          assert:
            - "after SUBMITTED: BidItem.${bid_id}.billed_quantity == 50 and remaining billable units == 0 (billing preview final for the same period shows subtotal 0.00)"
            - "Invoice.${inv_id} at submit: subtotal == 1000.00, retainage_amount == 100.00, amount_due == 900.00"
            - "after VOID: BidItem.${bid_id}.billed_quantity == 0 and billing preview final for 2026-08-01..2026-08-31 shows subtotal == 1000.00 again — billed + remaining == accepted (50) throughout"
