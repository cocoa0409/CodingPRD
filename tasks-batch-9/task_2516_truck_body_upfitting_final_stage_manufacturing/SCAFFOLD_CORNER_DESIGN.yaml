      - name: cascading_side_effect_chain_is_verified_to_its_last_hop
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: equipment_remove_cascades_four_hops_to_slot_reopen
          rationale: |
            The §1.8 instance already drives the longest chain in the scaffold end-to-end and asserts
            every hop plus the ordering sensitivity the guide asks for: removing a commissioned crane
            releases its PTO flow, re-runs the hydraulic waterfall for the surviving duty, rewrites
            the order's committed_pto_flow_gpm and aux draw ledgers, voids the standing AS_DESIGNED
            certification, drops compliance_status back to NOT_STARTED and reopens the CLOSED bay slot
            (with the order sliding BUILD_COMPLETE -> IN_BUILD). Its companion
            chassis_return_cascades_four_hops_into_queue_promotion covers the second four-hop chain
            (unit return -> order cancel -> slot cancel -> QUEUED slot promotion) and the partial-failure
            case where a hop is refused and the whole chain is rolled back. A §1.9 duplicate would add
            no distinct claim.

