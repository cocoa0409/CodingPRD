  # =========================================================================
  # Rule 8: Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: policy_period_overlap_same_line_of_business
        grounds:
          - validations[priority=14]
          - errors[ERR_POLICY_PERIOD_OVERLAP]
          - entities.InsuranceProgram.fields.policy_period_start
          - entities.InsuranceProgram.fields.policy_period_end
        distinguishing_aspect: |
          Interval semantics: half-open overlap on InsuranceProgram.policy_period.
          Two programs for the same captive + same line_of_business with overlapping
          [start, end) periods are rejected. Adjacent periods (end == start) do NOT
          overlap. This is a temporal overlap on the InsuranceProgram resource.
        test_recipe:
          setup:
            - "CaptiveEntity CAPITALIZED"
            - "Existing program with period 2026-06-01 to 2027-05-31"
            - "New program same line_of_business with period 2026-12-01 to 2027-11-30 (overlapping)"
          setup_api_calls:
            - call: "POST /api/captives"
              payload: { captive_name: "Test Captive O", domicile_jurisdiction: "VERMONT", formation_date: "2026-01-15T00:00:00Z", capitalization_amount: 500000 }
              as: CaptiveManager
              captures: { captive_id: $.data.id, captive_ver: $.data.version }
            - call: "POST /api/captives/${captive_id}/domicile-filings"
              payload: { filing_type: "INITIAL_FORMATION", jurisdiction: "VERMONT", supporting_documents: [{document_type: "ARTICLES", document_url: "https://docs.example.com/a.pdf", uploaded_at: "2026-01-15T00:00:00Z"}] }
              as: CaptiveManager
              captures: { filing_id: $.data.id }
            - call: "POST /api/captives/${captive_id}/domicile-filings/${filing_id}/submit"
              payload: {}
              as: CaptiveManager
            - call: "POST /api/captives/${captive_id}/domicile-filings/${filing_id}/acknowledge"
              payload: {}
              as: DomicileRegulator
            - call: "POST /api/captives/${captive_id}/domicile-filings/${filing_id}/approve"
              payload: {}
              as: DomicileRegulator
            - call: "POST /api/captives/${captive_id}/programs"
              payload: { program_name: "GL Prog O1", line_of_business: "GENERAL_LIABILITY", policy_period_start: "2026-06-01T00:00:00Z", policy_period_end: "2027-05-31T23:59:59Z", aggregate_limit_cents: 1000000, per_occurrence_limit_cents: 250000, attachment_point_cents: 10000, premium_budget_cents: 200000, expected_captive_version: "${captive_ver}" }
              as: Underwriter
              captures: { program1_id: $.data.id }
            - call: "GET /api/captives/${captive_id}"
              as: CaptiveManager
              captures: { captive_ver_2: $.data.version }
          trigger:
            - call: "POST /api/captives/${captive_id}/programs"
              payload: { program_name: "GL Prog O2", line_of_business: "GENERAL_LIABILITY", policy_period_start: "2026-12-01T00:00:00Z", policy_period_end: "2027-11-30T23:59:59Z", aggregate_limit_cents: 1000000, per_occurrence_limit_cents: 250000, attachment_point_cents: 10000, premium_budget_cents: 200000, expected_captive_version: "${captive_ver_2}" }
              as: Underwriter
          assert:
            - "Response error_id == ERR_POLICY_PERIOD_OVERLAP"

      - name: collateral_expiry_before_policy_end
        grounds:
          - entities.CollateralPosting.fields.expiry_date
          - entities.InsuranceProgram.fields.policy_period_end
          - validations[priority=15]
        distinguishing_aspect: |
          Interval semantics: containment check. CollateralPosting.expiry_date must
          extend beyond the parent program's policy_period_end. Unlike policy period
          overlap (which checks intersection), this checks containment/coverage.
          A collateral that expires before the policy ends leaves uncovered tail risk.
          Different interval semantics from the half-open overlap.
        test_recipe:
          setup:
            - "CaptiveEntity CAPITALIZED, program with fronting, period ending 2027-05-31"
            - "Collateral posting with expiry_date before policy_period_end"
          setup_api_calls:
