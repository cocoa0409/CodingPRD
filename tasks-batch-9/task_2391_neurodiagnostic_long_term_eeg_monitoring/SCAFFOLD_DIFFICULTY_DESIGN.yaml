            - "Unit with exactly one Bed, so both admissions compete for the same physical resource."
            - "Patient P1 admitted into the bed 2026-08-02T00:00:00Z with planned_days 2 and no studies, then discharged 2026-08-04T12:00:00Z with disposition ROUTINE -> Bed.released_at 12:00, turnover_clear_at 13:30, status TURNOVER."
