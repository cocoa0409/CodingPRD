        test_recipe:
          setup:
            - "Society BMI (repertoire_share_bp 4600) has an EFFECTIVE BAR_GRILL schedule at default adjustment_bp 10000, min 30000, max 4500000"
            - "Venue T1 has occupancy 100 and Venue T2 occupancy 101; both are MIXED with zero live nights and zero cover revenue, so only the tier constants differ"
            - "Each venue holds an ACTIVE BMI license created from a declaration that matches its verified survey exactly"
          setup_api_calls:
            - call: "POST /licensing/societies"
              payload: { society_code: "BMI", display_name: "Broadcast Music Inc", repertoire_share_bp: 4600 }
              as: LicensingAdmin
              captures: { bmi_id: "$.data.id" }
            - call: "POST /licensing/rate-schedules"
