          - validations[priority=43]
        distinguishing_aspect: |
          AGREED is terminal: neither a counter nor a second resolve may reopen it, and the rejection
          is priority 43's ERR_INVALID_TERM_STATE rather than priority 42's actor-sequence error — the
          probes deliberately act as the Underwriter, whose role differs from the last actor, so the
