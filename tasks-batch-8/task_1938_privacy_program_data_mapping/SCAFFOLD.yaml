# =============================================================================
# PRD Benchmark Seed Tables — task_1938_privacy_program_data_mapping
# Corporate privacy office: privacy program & data mapping.
# =============================================================================

scenario: |
  1938. Privacy Program & Data Mapping (corporate privacy office): processing activity inventory & data element classification, purpose/legal basis documentation & retention linkage, vendor/processor register & contract clause verification, privacy impact assessment trigger & review, consumer rights request routing across systems, cross-border transfer assessment, notice/policy version management, state-law applicability determination & threshold monitoring

domain_name: privacy-program-data-mapping
api_prefix: /privacy

# =============================================================================
# Complexity Profile (Step 0)
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table (§1.1)
# =============================================================================
entities:
  - name: RetentionPolicy
    parent: null
    common_fields: true
    fields:
      - { name: policy_code, type: string, source: input, description: "Unique human-readable policy code", constraints: "unique across all RetentionPolicy rows" }
      - { name: duration_days, type: integer, source: input, description: "Retention duration in days from Purpose creation", constraints: "> 0" }
      - { name: disposal_action, type: enum, source: input, description: "Action at retention expiry", constraints: "one of ANONYMIZE | DELETE | ARCHIVE" }

  - name: DataElement
    parent: null
    common_fields: true
    fields:
      - { name: element_key, type: string, source: input, description: "Unique element key", constraints: "unique across all DataElement rows" }
      - { name: category, type: enum, source: input, description: "Data category driving risk weight", constraints: "one of BASIC_CONTACT | IDENTIFIER | FINANCIAL | HEALTH | BIOMETRIC | PRECISE_LOCATION | MINOR_DATA" }
      - { name: classification, type: enum, source: input, description: "Classification driving risk multiplier", constraints: "one of PUBLIC | INTERNAL | CONFIDENTIAL | RESTRICTED" }
      - { name: status, type: enum, source: system, description: "ACTIVE on creation; RETIRED via retire action", constraints: "ACTIVE | RETIRED" }

  - name: DataSystem
    parent: null
    common_fields: true
    fields:
      - { name: system_key, type: string, source: input, description: "Unique system key", constraints: "unique across all DataSystem rows" }
      - { name: hosting_region, type: enum, source: input, description: "Region where data is hosted", constraints: "one of US | EU | UK | BR | APAC" }
      - { name: stores_categories, type: array, source: input, description: "Data categories this system stores; may be empty", constraints: "each member one of the DataElement category enum" }
      - { name: status, type: enum, source: system, description: "ACTIVE on creation; DECOMMISSIONED via decommission action", constraints: "ACTIVE | DECOMMISSIONED" }

  - name: Notice
    parent: null
    common_fields: true
    fields:
      - { name: scope, type: enum, source: input, description: "Audience scope; publication uniqueness is per scope", constraints: "one of WEBSITE | MOBILE_APP | EMPLOYEE | LOYALTY_PROGRAM" }
      - { name: title, type: string, source: input, description: "Notice title" }
      - { name: body, type: string, source: input, description: "Notice body text" }
      - { name: effective_from, type: datetime, source: input, description: "Start of effectiveness window (half-open, inclusive)" }
      - { name: effective_to, type: datetime, source: input, description: "End of effectiveness window (exclusive); null = open-ended", default: null }
      - { name: supersedes_notice_id, type: string, source: input, description: "FK -> Notice.id; declared supersede target that must be PUBLISHED, same scope, window-overlapping", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT on creation", constraints: "DRAFT | PUBLISHED | SUPERSEDED | RETRACTED" }
      - { name: published_at, type: datetime, source: system, description: "Logical-clock timestamp of publication; null until published", default: null }
      - { name: superseded_by_notice_id, type: string, source: system, description: "FK -> Notice.id; set when another notice's publication supersedes this one", default: null }

  - name: StateLawRule
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "2-letter US state code this rule governs", constraints: "unique across all StateLawRule rows" }
      - { name: law_name, type: string, source: input, description: "Short statute name (e.g. CCPA)" }
      - { name: resident_records_threshold, type: integer, source: input, description: "Law applies when resident consumer count >= this value", constraints: "> 0" }
      - { name: revenue_share_threshold_pct, type: number, source: input, description: "Law applies when state revenue share pct >= this value", constraints: "0 < value <= 100" }
      - { name: request_deadline_days, type: integer, source: input, description: "Base rights-request deadline in days", constraints: "> 0" }
      - { name: extension_days, type: integer, source: input, description: "Extension added for DELETION and PORTABILITY requests", constraints: ">= 0" }

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: vendor_name, type: string, source: input, description: "Vendor/processor legal name" }
      - { name: home_region, type: enum, source: input, description: "Vendor home region", constraints: "one of US | EU | UK | BR | APAC" }
      - { name: processes_categories, type: array, source: input, description: "Data categories the vendor processes; may be empty", constraints: "each member one of the DataElement category enum" }
      - { name: risk_tier, type: enum, source: computed, description: "Computed at creation from processes_categories per calculations.vendor_risk_tier", constraints: "LOW | STANDARD | HIGH" }
      - { name: status, type: enum, source: system, description: "ONBOARDING on creation", constraints: "ONBOARDING | ASSESSMENT | APPROVED | REJECTED | OFFBOARDED" }

  - name: VendorContract
    parent: Vendor
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: system, description: "FK -> Vendor.id; owning vendor" }
      - { name: provided_clauses, type: array, source: input, description: "Clause codes present in the uploaded contract", constraints: "each member one of DPA | BREACH_NOTICE_72H | DELETION_ON_EXIT | SUBPROCESSOR_CONSENT | AUDIT_RIGHTS" }
      - { name: required_clauses, type: array, source: computed, description: "Clause set required by the vendor's risk_tier per calculations.contract_clause_gap" }
      - { name: missing_clauses, type: array, source: computed, description: "required_clauses minus provided_clauses, sorted by clause code ASC" }
      - { name: verification_status, type: enum, source: system, description: "UNVERIFIED at creation; PASSED/FAILED after verify action", constraints: "UNVERIFIED | PASSED | FAILED" }
      - { name: status, type: enum, source: system, description: "DRAFT on creation", constraints: "DRAFT | VERIFIED | EXECUTED | SUPERSEDED" }

  - name: ProcessingActivity
    parent: null
    common_fields: true
    fields:
      - { name: activity_name, type: string, source: input, description: "Name of the processing activity" }
      - { name: business_unit, type: string, source: input, description: "Owning business unit" }
      - { name: notice_scope, type: enum, source: input, description: "Notice scope whose published notices back CONSENT purposes", constraints: "one of WEBSITE | MOBILE_APP | EMPLOYEE | LOYALTY_PROGRAM" }
      - { name: data_element_ids, type: array, source: input, description: "Ids of linked DataElement rows; may be empty", constraints: "each id must resolve to a DataElement with status ACTIVE" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; processing vendor, if any", default: null }
      - { name: risk_score, type: integer, source: computed, description: "Screening-variant risk score per calculations.activity_risk_score; 0..1000" }
      - { name: pia_required, type: boolean, source: computed, description: "true iff risk_score >= 500; evaluated ONLY from the screening variant at creation and reclassification (see calculations.pia_gating_order)" }
      - { name: status, type: enum, source: system, description: "DRAFT on creation", constraints: "DRAFT | ACTIVE | COMPLIANCE_HOLD | RETIRED" }

  - name: Purpose
    parent: ProcessingActivity
    common_fields: true
    fields:
      - { name: activity_id, type: string, source: system, description: "FK -> ProcessingActivity.id; owning activity" }
      - { name: purpose_type, type: enum, source: input, description: "Purpose of processing", constraints: "one of MARKETING | ANALYTICS | SERVICE_DELIVERY | EMPLOYMENT | LEGAL_COMPLIANCE | RESEARCH" }
      - { name: legal_basis, type: enum, source: input, description: "Documented legal basis", constraints: "one of CONSENT | CONTRACT | LEGAL_OBLIGATION | LEGITIMATE_INTEREST | VITAL_INTEREST | PUBLIC_TASK" }
      - { name: retention_policy_id, type: string, source: input, description: "FK -> RetentionPolicy.id; retention linkage" }
      - { name: pinned_notice_id, type: string, source: system, description: "FK -> Notice.id; version-pinned PUBLISHED notice captured at DOCUMENTED time when legal_basis == CONSENT; null otherwise", default: null }
      - { name: retention_expires_at, type: datetime, source: computed, description: "created_at + RetentionPolicy.duration_days" }
      - { name: status, type: enum, source: system, description: "DOCUMENTED on creation", constraints: "DOCUMENTED | CONSENT_STALE | RETIRED" }

  - name: PrivacyImpactAssessment
    parent: ProcessingActivity
    common_fields: true
    fields:
      - { name: activity_id, type: string, source: system, description: "FK -> ProcessingActivity.id; assessed activity" }
      - { name: trigger_reason, type: enum, source: system, description: "MANUAL when created via endpoint; RISK_THRESHOLD when auto-created at activity creation; RECLASSIFICATION when auto-created by element reclassification", constraints: "MANUAL | RISK_THRESHOLD | RECLASSIFICATION" }
      - { name: screening_score, type: integer, source: computed, description: "Copy of the activity's screening risk_score at assessment creation" }
      - { name: final_score, type: integer, source: computed, description: "Comprehensive-variant score computed at approval; null until APPROVED", default: null }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the most recent submitter; basis of the segregation-of-duties check", default: null }
      - { name: status, type: enum, source: system, description: "TRIGGERED on creation", constraints: "TRIGGERED | IN_REVIEW | CHANGES_REQUESTED | APPROVED | REJECTED" }

  - name: Consumer
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Consumer email", constraints: "unique across all Consumer rows" }
      - { name: full_name, type: string, source: input, description: "Consumer full name" }
      - { name: state_code, type: string, source: input, description: "2-letter US state of residence; feeds applicability counting", constraints: "2-letter code" }

  - name: RightsRequest
    parent: Consumer
    common_fields: true
    fields:
      - { name: consumer_id, type: string, source: system, description: "FK -> Consumer.id; requesting consumer" }
      - { name: request_type, type: enum, source: input, description: "Right being exercised", constraints: "one of ACCESS | DELETION | CORRECTION | PORTABILITY | OPT_OUT" }
      - { name: requested_categories, type: array, source: input, description: "Data categories in scope for system routing; must be non-empty", constraints: "non-empty; each member one of the DataElement category enum" }
      - { name: applicable_state_code, type: string, source: computed, description: "consumer.state_code when an applicable StateLawRule governs it at creation; null otherwise", default: null }
      - { name: provisional_due_at, type: datetime, source: computed, description: "Provisional deadline per calculations.request_deadline (base only), set at creation" }
      - { name: final_due_at, type: datetime, source: computed, description: "Final deadline per calculations.request_deadline (base + conditional extension), set at verification; null until VERIFIED", default: null }
      - { name: is_overdue, type: boolean, source: computed, description: "true iff logical clock > effective due date (final_due_at when VERIFIED else provisional_due_at) and fulfillment_status not in {COMPLETED, DENIED}" }
      - { name: verification_status, type: enum, source: system, description: "UNVERIFIED on creation", constraints: "UNVERIFIED | VERIFIED | VERIFICATION_FAILED" }
      - { name: fulfillment_status, type: enum, source: system, description: "INTAKE on creation", constraints: "INTAKE | ROUTED | IN_PROGRESS | READY_TO_RESPOND | COMPLETED | DENIED" }

  - name: RequestTask
    parent: RightsRequest
    common_fields: true
    fields:
      - { name: request_id, type: string, source: system, description: "FK -> RightsRequest.id; parent request" }
      - { name: data_system_id, type: string, source: system, description: "FK -> DataSystem.id; system this task fulfills against" }
      - { name: status, type: enum, source: system, description: "PENDING on creation", constraints: "PENDING | IN_PROGRESS | COMPLETED | CANCELLED" }
      - { name: outcome_notes, type: string, source: input, description: "Optional completion notes", default: null }

  - name: CrossBorderTransfer
    parent: null
    common_fields: true
    fields:
      - { name: source_system_id, type: string, source: input, description: "FK -> DataSystem.id; exporting system" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; receiving processor" }
      - { name: vendor_contract_id, type: string, source: input, description: "FK -> VendorContract.id; contract authorizing the transfer" }
      - { name: activity_id, type: string, source: input, description: "FK -> ProcessingActivity.id; processing activity served" }
      - { name: dest_region, type: enum, source: input, description: "Destination region", constraints: "one of US | EU | UK | BR | APAC" }
      - { name: mechanism, type: enum, source: input, description: "Legal transfer mechanism", constraints: "one of SCC_2021 | ADEQUACY | BCR | DEROGATION" }
      - { name: effective_from, type: datetime, source: input, description: "Window start (inclusive)" }
      - { name: effective_to, type: datetime, source: input, description: "Window end (exclusive); must be > effective_from" }
      - { name: suspension_reason, type: enum, source: system, description: "Why the transfer is SUSPENDED; null when not suspended", constraints: "ACTIVITY_HOLD | CONTRACT_SUPERSEDED | null", default: null }
      - { name: status, type: enum, source: system, description: "PROPOSED on creation", constraints: "PROPOSED | UNDER_ASSESSMENT | APPROVED | REJECTED | SUSPENDED" }

  - name: ApplicabilityEvaluation
    parent: null
    common_fields: false
    fields:
      - { name: state_law_rule_id, type: string, source: system, description: "FK -> StateLawRule.id; rule evaluated" }
      - { name: evaluation_run_id, type: string, source: system, description: "Server-minted id grouping all evaluations of one run" }
      - { name: resident_consumer_count, type: integer, source: computed, description: "Count of Consumer rows with state_code == rule.state_code at run time" }
      - { name: revenue_share_pct, type: number, source: computed, description: "round_half_up(100 * state_revenue_cents / total_revenue_cents, 2); 0.0 when state absent from input revenues" }
      - { name: applies, type: boolean, source: computed, description: "count >= resident_records_threshold OR revenue_share_pct >= revenue_share_threshold_pct" }
      - { name: margin_to_threshold, type: integer, source: computed, description: "resident_consumer_count - resident_records_threshold (negative when below)" }

# =============================================================================
# Table 2: State Machine Table (§1.2)
# =============================================================================
state_machines:
  - entity: DataElement
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /privacy/data-elements/{id}/retire"
        actor: DataSteward
        preconditions:
          - "element status == ACTIVE (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "status -> RETIRED; element version +1"
          - "RETIRED elements are rejected by ERR_ELEMENT_RETIRED on new ProcessingActivity links; already-linked activities are NOT modified"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /privacy/data-elements/{id}/reclassify"
        actor: DataSteward
        preconditions:
          - "element status == ACTIVE (else ERR_INVALID_STATE_TRANSITION)"
          - "OCC: payload expected_element_version == element.version (else ERR_STALE_VERSION)"
        side_effects:
          - "category/classification overwritten; element version +1"
          - "cascade hop 1: every ProcessingActivity whose data_element_ids contains this element AND status in {DRAFT, ACTIVE, COMPLIANCE_HOLD} recomputes risk_score/pia_required (screening variant), processing activities in created_at ASC order; each touched activity version +1"
          - "cascade hop 2: any activity whose pia_required flips false -> true gets a PrivacyImpactAssessment auto-created (status TRIGGERED, trigger_reason RECLASSIFICATION) when no open assessment (status in {TRIGGERED, IN_REVIEW, CHANGES_REQUESTED}) exists for that activity"
          - "cascade hop 3: any such activity in status ACTIVE transitions ACTIVE -> COMPLIANCE_HOLD"

  - entity: Notice
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, RETRACTED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /privacy/notices/{id}/publish"
        actor: PrivacyAdmin
        preconditions:
          - "notice status == DRAFT (else ERR_INVALID_STATE_TRANSITION)"
          - "effective_to null or effective_to > effective_from (else ERR_INVALID_WINDOW)"
          - "no other PUBLISHED notice in the same scope whose half-open window [effective_from, effective_to) overlaps this window, UNLESS that notice is the declared supersedes_notice_id target (else ERR_NOTICE_WINDOW_OVERLAP); adjacency (shared boundary instant) is NOT overlap"
          - "if supersedes_notice_id is non-null: target must be PUBLISHED, same scope, and window-overlapping this notice (else ERR_NOTICE_WINDOW_OVERLAP)"
        side_effects:
          - "status -> PUBLISHED; published_at = logical clock; notice version +1"
          - "hop 1: if supersedes_notice_id non-null, that notice -> SUPERSEDED with superseded_by_notice_id = this notice id (its version +1)"
          - "hop 2: every Purpose with pinned_notice_id == superseded notice id AND status == DOCUMENTED -> CONSENT_STALE (version +1 each), processed in created_at ASC order"
          - "hop 3: every ProcessingActivity owning >= 1 such stale purpose AND status == ACTIVE -> COMPLIANCE_HOLD (version +1)"
          - "hop 4: every CrossBorderTransfer with activity_id in those held activities AND status == APPROVED -> SUSPENDED with suspension_reason ACTIVITY_HOLD (version +1)"
      - from: PUBLISHED
        to: RETRACTED
        trigger: "POST /privacy/notices/{id}/retract"
        actor: PrivacyAdmin
        preconditions:
          - "notice status == PUBLISHED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "status -> RETRACTED; notice version +1"
          - "hop 1: the notice T this one superseded (T.superseded_by_notice_id == this id), if still SUPERSEDED, -> PUBLISHED (version +1)"
          - "hop 2: every Purpose in CONSENT_STALE with pinned_notice_id == T.id -> DOCUMENTED (version +1 each), in created_at ASC order"
          - "hop 3: every ProcessingActivity in COMPLIANCE_HOLD with zero purposes in CONSENT_STALE and zero assessments in {TRIGGERED, IN_REVIEW, CHANGES_REQUESTED} -> ACTIVE (version +1)"
          - "hop 4: every CrossBorderTransfer in SUSPENDED with suspension_reason == ACTIVITY_HOLD whose activity resumed -> APPROVED with suspension_reason = null (version +1)"

  - entity: Vendor
    initial_state: ONBOARDING
    terminal_states: [REJECTED, OFFBOARDED]
    transitions:
      - from: ONBOARDING
        to: ASSESSMENT
        trigger: "POST /privacy/vendors/{id}/submit-assessment"
        actor: VendorManager
        preconditions: ["vendor status == ONBOARDING (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["status -> ASSESSMENT; version +1"]
      - from: ASSESSMENT
        to: APPROVED
        trigger: "POST /privacy/vendors/{id}/approve"
        actor: PrivacyAdmin
        preconditions:
          - "vendor status == ASSESSMENT (else ERR_INVALID_STATE_TRANSITION)"
          - "vendor has >= 1 VendorContract with status == EXECUTED (else ERR_NO_EXECUTED_CONTRACT)"
        side_effects: ["status -> APPROVED; version +1"]
      - from: ASSESSMENT
        to: REJECTED
        trigger: "POST /privacy/vendors/{id}/reject"
        actor: PrivacyAdmin
        preconditions: ["vendor status == ASSESSMENT (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["status -> REJECTED; version +1"]
      - from: APPROVED
        to: OFFBOARDED
        trigger: "POST /privacy/vendors/{id}/offboard"
        actor: PrivacyAdmin
        preconditions: ["vendor status == APPROVED (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects:
          - "status -> OFFBOARDED; version +1"
          - "hop 1: every VendorContract of this vendor with status in {DRAFT, VERIFIED, EXECUTED} -> SUPERSEDED (version +1 each), in created_at ASC order"
          - "hop 2: every CrossBorderTransfer whose vendor_contract_id is one of those formerly-EXECUTED contracts AND status == APPROVED -> SUSPENDED with suspension_reason CONTRACT_SUPERSEDED (version +1)"
          - "direct fan-out (not part of the hop chain): every CrossBorderTransfer with vendor_id == this vendor AND status in {PROPOSED, UNDER_ASSESSMENT} -> REJECTED (version +1)"

  - entity: VendorContract
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: VERIFIED
        trigger: "POST /privacy/contracts/{id}/verify (when missing_clauses is empty)"
        actor: LegalCounsel
        preconditions: ["contract status == DRAFT (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["verification_status -> PASSED; status -> VERIFIED; version +1"]
      - from: DRAFT
        to: DRAFT
        trigger: "POST /privacy/contracts/{id}/verify (when missing_clauses is non-empty)"
        actor: LegalCounsel
        preconditions: ["contract status == DRAFT (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["verification_status -> FAILED; status stays DRAFT; version +1"]
      - from: VERIFIED
        to: EXECUTED
        trigger: "POST /privacy/contracts/{id}/execute"
        actor: VendorManager
        preconditions:
          - "contract status == VERIFIED (else ERR_INVALID_STATE_TRANSITION)"
          - "owning vendor status not in {REJECTED, OFFBOARDED} (else ERR_INVALID_STATE_TRANSITION)"
        side_effects: ["status -> EXECUTED; version +1"]
      - from: EXECUTED
        to: SUPERSEDED
        trigger: "system: vendor offboard cascade, or creation of a newer contract superseding DRAFT/VERIFIED predecessors"
        actor: system
        preconditions: []
        side_effects: ["status -> SUPERSEDED; version +1"]
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system: creation of a newer VendorContract for the same vendor supersedes DRAFT/VERIFIED predecessors"
        actor: system
        preconditions: []
        side_effects: ["status -> SUPERSEDED; version +1"]
      - from: VERIFIED
        to: SUPERSEDED
        trigger: "system: creation of a newer VendorContract for the same vendor supersedes DRAFT/VERIFIED predecessors"
        actor: system
        preconditions: []
        side_effects: ["status -> SUPERSEDED; version +1"]

  - entity: ProcessingActivity
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /privacy/processing-activities/{id}/activate"
        actor: DataSteward
        preconditions:
          - "activity status == DRAFT (else ERR_INVALID_STATE_TRANSITION)"
          - "if pia_required == true, an APPROVED PrivacyImpactAssessment exists for this activity (else ERR_PIA_NOT_APPROVED)"
          - ">= 1 Purpose with status == DOCUMENTED exists for this activity (else ERR_NO_DOCUMENTED_PURPOSE)"
        side_effects: ["status -> ACTIVE; version +1"]
      - from: ACTIVE
        to: COMPLIANCE_HOLD
        trigger: "system: purpose staleness cascade or reclassification cascade"
        actor: system
        preconditions: []
        side_effects: ["status -> COMPLIANCE_HOLD; version +1"]
      - from: COMPLIANCE_HOLD
        to: ACTIVE
        trigger: "POST /privacy/processing-activities/{id}/resume"
        actor: DataSteward
        preconditions:
          - "activity status == COMPLIANCE_HOLD (else ERR_INVALID_STATE_TRANSITION)"
          - "no Purpose of this activity in CONSENT_STALE (else ERR_INVALID_STATE_TRANSITION)"
          - "no open assessment (status in {TRIGGERED, IN_REVIEW, CHANGES_REQUESTED}) for this activity (else ERR_PIA_NOT_APPROVED)"
        side_effects:
          - "status -> ACTIVE; version +1"
          - "hop 1: every CrossBorderTransfer with activity_id == this id AND status == SUSPENDED AND suspension_reason == ACTIVITY_HOLD -> APPROVED, suspension_reason = null (version +1)"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /privacy/processing-activities/{id}/retire"
        actor: DataSteward
        preconditions: ["activity status in {ACTIVE, COMPLIANCE_HOLD} (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects:
          - "status -> RETIRED; version +1"
          - "hop 1: every CrossBorderTransfer with activity_id == this id AND status == APPROVED -> SUSPENDED with suspension_reason ACTIVITY_HOLD (version +1)"
      - from: COMPLIANCE_HOLD
        to: RETIRED
        trigger: "POST /privacy/processing-activities/{id}/retire"
        actor: DataSteward
        preconditions: ["activity status in {ACTIVE, COMPLIANCE_HOLD} (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects:
          - "status -> RETIRED; version +1"
          - "hop 1: every CrossBorderTransfer with activity_id == this id AND status == APPROVED -> SUSPENDED with suspension_reason ACTIVITY_HOLD (version +1)"

  - entity: Purpose
    initial_state: DOCUMENTED
    terminal_states: [RETIRED]
    transitions:
      - from: CONSENT_STALE
        to: DOCUMENTED
        trigger: "POST /privacy/purposes/{id}/relink"
        actor: DataSteward
        preconditions:
          - "purpose status == CONSENT_STALE (else ERR_INVALID_STATE_TRANSITION)"
          - "a PUBLISHED Notice exists with scope == purpose.activity.notice_scope (else ERR_NO_PUBLISHED_NOTICE)"
        side_effects:
          - "status -> DOCUMENTED; pinned_notice_id re-pinned to the current PUBLISHED notice in scope (if several PUBLISHED notices in scope have disjoint windows, pick the one whose window contains the logical clock; if none contains it, pick the one with the latest effective_from; tie-break created_at ASC); version +1"
          - "hop 1: owning activity in COMPLIANCE_HOLD with zero remaining CONSENT_STALE purposes and zero assessments in {TRIGGERED, IN_REVIEW, CHANGES_REQUESTED} -> ACTIVE (version +1), reinstating its ACTIVITY_HOLD-suspended transfers"
      - from: DOCUMENTED
        to: RETIRED
        trigger: "POST /privacy/purposes/{id}/retire"
        actor: DataSteward
        preconditions: ["purpose status in {DOCUMENTED, CONSENT_STALE} (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["status -> RETIRED; version +1"]
      - from: CONSENT_STALE
        to: RETIRED
        trigger: "POST /privacy/purposes/{id}/retire"
        actor: DataSteward
        preconditions: ["purpose status in {DOCUMENTED, CONSENT_STALE} (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["status -> RETIRED; version +1"]

  - entity: PrivacyImpactAssessment
    initial_state: TRIGGERED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: TRIGGERED
        to: IN_REVIEW
        trigger: "POST /privacy/assessments/{id}/submit"
        actor: BusinessOwner
        preconditions: ["assessment status in {TRIGGERED, CHANGES_REQUESTED} (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["status -> IN_REVIEW; submitted_by_user_id = X-User-ID of caller; version +1"]
      - from: CHANGES_REQUESTED
        to: IN_REVIEW
        trigger: "POST /privacy/assessments/{id}/submit"
        actor: BusinessOwner
        preconditions: ["assessment status in {TRIGGERED, CHANGES_REQUESTED} (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["status -> IN_REVIEW; submitted_by_user_id = X-User-ID of caller; version +1"]
      - from: IN_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /privacy/assessments/{id}/request-changes"
        actor: LegalCounsel
        preconditions:
          - "assessment status == IN_REVIEW (else ERR_INVALID_STATE_TRANSITION)"
          - "SoD: X-User-ID != submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["status -> CHANGES_REQUESTED; version +1"]
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /privacy/assessments/{id}/approve"
        actor: LegalCounsel
        preconditions:
          - "assessment status == IN_REVIEW (else ERR_INVALID_STATE_TRANSITION)"
          - "SoD: X-User-ID != submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "final_score computed (comprehensive variant of calculations.activity_risk_score over the activity's CURRENT linked elements, vendor, and DOCUMENTED purposes); status -> APPROVED; version +1"
          - "hop 1: owning activity in COMPLIANCE_HOLD with zero CONSENT_STALE purposes and zero other assessments in {TRIGGERED, IN_REVIEW, CHANGES_REQUESTED} -> ACTIVE (version +1), reinstating its ACTIVITY_HOLD-suspended transfers"
      - from: IN_REVIEW
        to: REJECTED
        trigger: "POST /privacy/assessments/{id}/reject"
        actor: LegalCounsel
        preconditions:
          - "assessment status == IN_REVIEW (else ERR_INVALID_STATE_TRANSITION)"
          - "SoD: X-User-ID != submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["status -> REJECTED; version +1"]

  - entity: RightsRequest
    initial_state: "verification_status=UNVERIFIED, fulfillment_status=INTAKE (parallel dimensions)"
    terminal_states: ["verification: VERIFICATION_FAILED", "fulfillment: COMPLETED, DENIED"]
    transitions:
      - from: UNVERIFIED
        to: VERIFIED
        trigger: "POST /privacy/rights-requests/{id}/verify"
        actor: DataSteward
        preconditions: ["verification_status == UNVERIFIED (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects:
          - "verification_status -> VERIFIED; final_due_at computed per calculations.request_deadline final variant; version +1"
      - from: UNVERIFIED
        to: VERIFICATION_FAILED
        trigger: "POST /privacy/rights-requests/{id}/fail-verification"
        actor: DataSteward
        preconditions: ["verification_status == UNVERIFIED (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects:
          - "verification_status -> VERIFICATION_FAILED; version +1"
          - "cross-dimension: fulfillment_status INTAKE -> DENIED (no tasks exist yet at INTAKE)"
      - from: INTAKE
        to: ROUTED
        trigger: "POST /privacy/rights-requests/{id}/route"
        actor: DataSteward
        preconditions:
          - "fulfillment_status == INTAKE (else ERR_INVALID_STATE_TRANSITION)"
          - "verification_status == VERIFIED (else ERR_REQUEST_NOT_VERIFIED)"
          - "routing selector pool non-empty per calculations.request_routing_selection (else ERR_NO_SYSTEMS_IN_SCOPE)"
        side_effects:
          - "one RequestTask created per selected DataSystem (status PENDING), selection order per calculations.request_routing_selection"
          - "fulfillment_status -> ROUTED; version +1"
      - from: INTAKE
        to: DENIED
        trigger: "POST /privacy/rights-requests/{id}/deny"
        actor: LegalCounsel
        preconditions: ["fulfillment_status in {INTAKE, ROUTED, IN_PROGRESS} (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects:
          - "fulfillment_status -> DENIED; version +1"
          - "cascade down: every RequestTask of this request in {PENDING, IN_PROGRESS} -> CANCELLED (version +1 each), in created_at ASC order"
      - from: ROUTED
        to: DENIED
        trigger: "POST /privacy/rights-requests/{id}/deny"
        actor: LegalCounsel
        preconditions: ["fulfillment_status in {INTAKE, ROUTED, IN_PROGRESS} (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects:
          - "fulfillment_status -> DENIED; version +1"
          - "cascade down: every RequestTask of this request in {PENDING, IN_PROGRESS} -> CANCELLED (version +1 each), in created_at ASC order"
      - from: IN_PROGRESS
        to: DENIED
        trigger: "POST /privacy/rights-requests/{id}/deny"
        actor: LegalCounsel
        preconditions: ["fulfillment_status in {INTAKE, ROUTED, IN_PROGRESS} (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects:
          - "fulfillment_status -> DENIED; version +1"
          - "cascade down: every RequestTask of this request in {PENDING, IN_PROGRESS} -> CANCELLED (version +1 each), in created_at ASC order"
      - from: ROUTED
        to: IN_PROGRESS
        trigger: "system: first RequestTask of this request enters IN_PROGRESS (bubble up)"
        actor: system
        preconditions: []
        side_effects: ["fulfillment_status -> IN_PROGRESS; version +1"]
      - from: IN_PROGRESS
        to: READY_TO_RESPOND
        trigger: "system: every RequestTask of this request reaches a terminal status (COMPLETED or CANCELLED) (bubble up)"
        actor: system
        preconditions: []
        side_effects: ["fulfillment_status -> READY_TO_RESPOND; version +1"]
      - from: READY_TO_RESPOND
        to: COMPLETED
        trigger: "POST /privacy/rights-requests/{id}/respond"
        actor: DataSteward
        preconditions: ["fulfillment_status == READY_TO_RESPOND (else ERR_TASKS_OUTSTANDING)"]
        side_effects: ["fulfillment_status -> COMPLETED; version +1"]

  - entity: RequestTask
    initial_state: PENDING
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PENDING
        to: IN_PROGRESS
        trigger: "POST /privacy/tasks/{id}/start"
        actor: DataSteward
        preconditions: ["task status == PENDING (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects:
          - "status -> IN_PROGRESS; version +1"
          - "bubble up: parent RightsRequest in ROUTED -> IN_PROGRESS"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /privacy/tasks/{id}/complete"
        actor: DataSteward
        preconditions: ["task status == IN_PROGRESS (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects:
          - "status -> COMPLETED; outcome_notes stored; version +1"
          - "bubble up: if all sibling tasks terminal (COMPLETED or CANCELLED), parent RightsRequest IN_PROGRESS -> READY_TO_RESPOND"
      - from: PENDING
        to: CANCELLED
        trigger: "system: parent request denied"
        actor: system
        preconditions: []
        side_effects: ["status -> CANCELLED; version +1"]
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "system: parent request denied"
        actor: system
        preconditions: []
        side_effects: ["status -> CANCELLED; version +1"]

  - entity: CrossBorderTransfer
    initial_state: PROPOSED
    terminal_states: [REJECTED]
    transitions:
      - from: PROPOSED
        to: UNDER_ASSESSMENT
        trigger: "POST /privacy/transfers/{id}/assess"
        actor: LegalCounsel
        preconditions: ["transfer status == PROPOSED (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["status -> UNDER_ASSESSMENT; version +1"]
      - from: UNDER_ASSESSMENT
        to: APPROVED
        trigger: "POST /privacy/transfers/{id}/approve"
        actor: LegalCounsel
        preconditions:
          - "transfer status == UNDER_ASSESSMENT (else ERR_INVALID_STATE_TRANSITION)"
          - "mechanism adequacy: if source system hosting_region in {EU, UK} and dest_region == US then mechanism must be in {SCC_2021, BCR} (else ERR_MECHANISM_NOT_ADEQUATE)"
          - "vendor_contract referenced by vendor_contract_id has status == EXECUTED (else ERR_CONTRACT_NOT_EXECUTED)"
          - "buffer rule: no other transfer with same (source_system_id, vendor_id) AND status in {APPROVED, SUSPENDED} whose [effective_from, effective_to) window is within 30 days of this window on either side; new.effective_from must be >= existing.effective_to + 30 days OR new.effective_to <= existing.effective_from - 30 days (else ERR_TRANSFER_WINDOW_CONFLICT)"
        side_effects: ["status -> APPROVED; version +1"]
      - from: UNDER_ASSESSMENT
        to: REJECTED
        trigger: "POST /privacy/transfers/{id}/reject"
        actor: LegalCounsel
        preconditions: ["transfer status == UNDER_ASSESSMENT (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["status -> REJECTED; version +1"]
      - from: APPROVED
        to: SUSPENDED
        trigger: "system: activity hold cascade, activity retire cascade, or vendor offboard cascade"
        actor: system
        preconditions: []
        side_effects: ["status -> SUSPENDED; suspension_reason set (ACTIVITY_HOLD or CONTRACT_SUPERSEDED); version +1"]
      - from: SUSPENDED
        to: APPROVED
        trigger: "system: owning activity resumes to ACTIVE (only when suspension_reason == ACTIVITY_HOLD)"
        actor: system
        preconditions: []
        side_effects: ["status -> APPROVED; suspension_reason = null; version +1"]

# =============================================================================
# Concurrency Rules (§1.2.1) — OCC only
# =============================================================================
concurrency_rules:
  - rule_id: element-reclassify-stale-version
    parent_entity: DataElement
    write_endpoint: "POST /privacy/data-elements/{id}/reclassify"
    occ_field: expected_element_version
    description: |
      Reclassifying a DataElement whose version has advanced since the client
      last observed it is rejected. This captures the case where another writer
      has already reclassified the element (which legitimately overwrites
      category/classification and cascades into activity risk) and the current
      writer's view of the element is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: contract-create-stale-vendor
    parent_entity: Vendor
    write_endpoint: "POST /privacy/vendors/{id}/contracts"
    occ_field: expected_vendor_version
    description: |
      Creating a VendorContract against a Vendor whose version has advanced
      since the client last observed it is rejected. Contract creation
      legitimately supersedes the vendor's existing DRAFT/VERIFIED contracts,
      so a writer holding a stale vendor version would supersede contracts it
      never observed.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table (§1.3)
# =============================================================================
calculations:
  - name: activity_risk_score
    trigger: "ProcessingActivity creation; DataElement reclassification cascade; PrivacyImpactAssessment approval (comprehensive variant only)"
    algorithm: weighted_scoring
    formula: |
      Per linked element e (status any — links are immutable once created):
        element_value(e) = CATEGORY_WEIGHT[e.category] * CLASSIFICATION_MULTIPLIER[e.classification]
      screening variant (stored on ProcessingActivity.risk_score at creation and on reclassification):
        risk_score = min(RISK_CAP, round_half_up(max(element_value)) + PER_EXTRA_ELEMENT * (n_elements - 1) + VENDOR_EXPOSURE[vendor.risk_tier or 0])
        where n_elements = count of linked elements; max over empty set = 0
      comprehensive variant (stored on PrivacyImpactAssessment.final_score at approval):
        final_score = min(RISK_CAP, round_half_up(sum(element_value)) + VENDOR_EXPOSURE[vendor.risk_tier or 0] + (CONSENT_LEGAL_BASIS_ADJUSTMENT if any Purpose of the activity has status DOCUMENTED and legal_basis CONSENT else 0))
    input_set: "linked DataElements (any status), linked Vendor.risk_tier (null vendor -> exposure 0), DOCUMENTED purposes (comprehensive only)"
    constants:
      CATEGORY_WEIGHT: { BASIC_CONTACT: 50, IDENTIFIER: 100, FINANCIAL: 200, HEALTH: 300, BIOMETRIC: 400, PRECISE_LOCATION: 250, MINOR_DATA: 350 }
      CLASSIFICATION_MULTIPLIER: { PUBLIC: 0.5, INTERNAL: 1.0, CONFIDENTIAL: 1.5, RESTRICTED: 2.0 }
      VENDOR_EXPOSURE: { LOW: 0, STANDARD: 75, HIGH: 150 }
      PER_EXTRA_ELEMENT: 25
      CONSENT_LEGAL_BASIS_ADJUSTMENT: 50
      RISK_CAP: 1000
      PIA_RISK_THRESHOLD: 500
    precision: "integers throughout; products exact (weights x multipliers give .0 or .5 values; round_half_up applied once to the max/sum term)"
    variants:
      - name: screening
        when: "activity creation and reclassification cascade"
        difference: "max() of element values + per-extra-element surcharge; ignores purposes; governs pia_required"
      - name: comprehensive
        when: "PIA approval"
        difference: "sum() of element values + consent adjustment; NEVER re-evaluates pia_required (see calculations.pia_gating_order)"

  - name: pia_gating_order
    trigger: "whenever risk inputs change"
    algorithm: constraint_propagation
    formula: |
      pia_required = (screening risk_score >= PIA_RISK_THRESHOLD)
      Evaluation order is pinned to break the circular-looking dependency
      (approval changes final_score -> final_score looks like risk -> risk looks like it gates PIA -> PIA gates activation):
      (1) screening score computed ONLY at activity creation and during the reclassification cascade;
      (2) pia_required derived ONLY from that screening score at those same moments;
      (3) comprehensive final_score computed ONLY at PIA approval and written ONLY to PrivacyImpactAssessment.final_score;
      (4) final_score NEVER feeds back into risk_score, pia_required, or activation gating.
    input_set: "ProcessingActivity.risk_score (screening), PrivacyImpactAssessment.final_score (comprehensive)"
    constants:
      PIA_RISK_THRESHOLD: 500
    precision: "boolean derivation; no rounding"

  - name: vendor_risk_tier
    trigger: "Vendor creation"
    algorithm: threshold
    formula: |
      if processes_categories intersects {HEALTH, BIOMETRIC, MINOR_DATA}: tier = HIGH
      elif processes_categories intersects {FINANCIAL, PRECISE_LOCATION, IDENTIFIER}: tier = STANDARD
      else (empty set or only BASIC_CONTACT): tier = LOW
    input_set: "Vendor.processes_categories at creation"
    precision: "enum; no rounding"

  - name: contract_clause_gap
    trigger: "VendorContract creation and verification"
    algorithm: aggregation
    formula: |
      required_clauses = REQUIRED_BY_TIER[vendor.risk_tier]
      missing_clauses = required_clauses - provided_clauses, sorted by clause code ASC
      verification PASSES iff missing_clauses is empty
    input_set: "Vendor.risk_tier, VendorContract.provided_clauses"
    constants:
      REQUIRED_BY_TIER:
        LOW: [DPA]
        STANDARD: [DPA, BREACH_NOTICE_72H, DELETION_ON_EXIT]
        HIGH: [DPA, BREACH_NOTICE_72H, DELETION_ON_EXIT, SUBPROCESSOR_CONSENT, AUDIT_RIGHTS]
    precision: "set difference; deterministic ASC ordering by clause code"

  - name: state_law_applicability
    trigger: "POST /privacy/applicability-evaluations/run"
    algorithm: threshold
    formula: |
      For each StateLawRule r (evaluation order: r.created_at ASC, tie-break r.state_code ASC):
        resident_consumer_count = count of Consumer rows with state_code == r.state_code (ALL consumers; no status filter exists)
        state_rev = state_revenues[r.state_code] if present else 0
        revenue_share_pct = round_half_up(100 * state_rev / total_revenue_cents, 2)
        ROUNDING ORDER PINNED: divide the raw annual cent totals first, multiply by 100, then round_half_up once to 2 decimals.
        Do NOT round per-quarter or per-line values first; do NOT truncate.
        applies = (resident_consumer_count >= r.resident_records_threshold) OR (revenue_share_pct >= r.revenue_share_threshold_pct)
        margin_to_threshold = resident_consumer_count - r.resident_records_threshold
      One ApplicabilityEvaluation row per rule, all sharing one server-minted evaluation_run_id.
    input_set: "all StateLawRule rows; all Consumer rows; request payload state_revenues and total_revenue_cents"
    precision: "revenue_share_pct: 2 decimal places, round_half_up, computed from annual totals then rounded once"

  - name: request_deadline
    trigger: "RightsRequest creation (provisional) and verification (final)"
    algorithm: forward_looking
    formula: |
      Resolve governing rule at creation: StateLawRule r with state_code == consumer.state_code AND the latest ApplicabilityEvaluation for r (by created_at DESC) has applies == true.
      If no rule exists, or no evaluation exists for it, or latest evaluation has applies == false -> use defaults.
      provisional variant (at creation):
        provisional_due_at = created_at + (r.request_deadline_days or DEFAULT_DEADLINE_DAYS) days
      final variant (at verification):
        final_due_at = created_at + base_days + (extension_days if request_type in {DELETION, PORTABILITY} else 0)
        where base_days = r.request_deadline_days or DEFAULT_DEADLINE_DAYS, extension_days = r.extension_days or DEFAULT_EXTENSION_DAYS
      Both anchored to created_at (the logical clock at creation), never to the verification time.
      applicable_state_code = r.state_code when r governs, else null.
    input_set: "Consumer.state_code, StateLawRule rows, latest ApplicabilityEvaluation per rule, request_type, created_at"
    constants:
      DEFAULT_DEADLINE_DAYS: 45
      DEFAULT_EXTENSION_DAYS: 30
    precision: "datetime; day arithmetic on the created_at timestamp"
    variants:
      - name: provisional
        when: "request creation, before identity verification"
        difference: "base days only; never includes extension"
      - name: final
        when: "request verification"
        difference: "adds extension_days for DELETION and PORTABILITY; identical to provisional for ACCESS, CORRECTION, OPT_OUT"

  - name: retention_expiry
    trigger: "Purpose creation"
    algorithm: aggregation
    formula: |
      purpose.retention_expires_at = purpose.created_at + RetentionPolicy.duration_days days
      Activity-level earliest purge (derived on read where needed): min(retention_expires_at) over purposes with status != RETIRED; null when no such purposes.
    input_set: "Purpose.created_at, RetentionPolicy.duration_days"
    precision: "datetime; day arithmetic"

  - name: request_routing_selection
    trigger: "POST /privacy/rights-requests/{id}/route"
    algorithm: selector
    formula: |
      Eligibility filter: DataSystem rows with status == ACTIVE AND stores_categories intersects request.requested_categories (non-empty intersection).
      Ranking: created_at ASC.
      Tie-break (equal created_at, possible under a fixed logical clock): system_key ASC.
      Fallback: empty pool -> ERR_NO_SYSTEMS_IN_SCOPE (422); no partial routing.
      One RequestTask per selected system is created in that order.
    input_set: "all DataSystem rows; request.requested_categories"
    precision: "deterministic total order; id is NEVER used as tie-break"

# =============================================================================
# Table 4: Validation Rules Table (§1.4, ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role value is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "caller role is in the endpoint's roles list; ownership rules (Consumer self-access) enforced"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "path ids exist, validated left-to-right; body-supplied FK ids (retention_policy_id, data_element_ids, vendor_id, source_system_id, vendor_contract_id, activity_id, supersedes_notice_id) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: state
    check: "OCC: expected_<parent>_version matches the parent's current version on OCC-guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /privacy/data-elements/{id}/reclassify; POST /privacy/vendors/{id}/contracts"
  - priority: 5
    category: state
    check: "target resource lifecycle state permits the requested transition (covers invalid-from and terminal lockdown for every machine)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: state
    check: "cross-dimension / parent state gates: route requires verification_status VERIFIED (ERR_REQUEST_NOT_VERIFIED); child create on RETIRED activity (ERR_ACTIVITY_RETIRED); respond requires READY_TO_RESPOND (ERR_TASKS_OUTSTANDING)"
    error_id: "ERR_REQUEST_NOT_VERIFIED | ERR_ACTIVITY_RETIRED | ERR_TASKS_OUTSTANDING"
    http_status: 409
    applies_to: "POST /privacy/rights-requests/{id}/route; POST /privacy/processing-activities/{id}/purposes; POST /privacy/processing-activities/{id}/assessments; POST /privacy/rights-requests/{id}/respond"
  - priority: 7
    category: business_safety
    check: "segregation of duties: reviewer X-User-ID must differ from submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /privacy/assessments/{id}/approve; POST /privacy/assessments/{id}/reject; POST /privacy/assessments/{id}/request-changes"
  - priority: 8
    category: business_safety
    check: "mechanism adequacy: EU/UK source region transferring to US requires mechanism in {SCC_2021, BCR}"
    error_id: ERR_MECHANISM_NOT_ADEQUATE
    http_status: 422
    applies_to: "POST /privacy/transfers/{id}/approve"
  - priority: 9
    category: business_safety
    check: "activation gating: pia_required activity needs an APPROVED assessment; resume requires no open assessment"
    error_id: ERR_PIA_NOT_APPROVED
    http_status: 409
    applies_to: "POST /privacy/processing-activities/{id}/activate; POST /privacy/processing-activities/{id}/resume"
  - priority: 10
    category: business_referential
    check: "referenced entity states: CONSENT purpose needs a PUBLISHED notice in the activity's notice_scope (ERR_NO_PUBLISHED_NOTICE); linked elements must be ACTIVE (ERR_ELEMENT_RETIRED); transfer vendor must be APPROVED (ERR_VENDOR_NOT_APPROVED); transfer source system must be ACTIVE (ERR_SYSTEM_DECOMMISSIONED); transfer approve needs EXECUTED contract (ERR_CONTRACT_NOT_EXECUTED); vendor approve needs >= 1 EXECUTED contract (ERR_NO_EXECUTED_CONTRACT)"
    error_id: "ERR_NO_PUBLISHED_NOTICE | ERR_ELEMENT_RETIRED | ERR_VENDOR_NOT_APPROVED | ERR_SYSTEM_DECOMMISSIONED | ERR_CONTRACT_NOT_EXECUTED | ERR_NO_EXECUTED_CONTRACT"
    http_status: 422
    applies_to: "POST /privacy/processing-activities/{id}/purposes; POST /privacy/purposes/{id}/relink; POST /privacy/processing-activities; POST /privacy/transfers; POST /privacy/transfers/{id}/approve; POST /privacy/vendors/{id}/approve"
  - priority: 11
    category: business_temporal
    check: "window validity and overlap: effective_to must be > effective_from when present (ERR_INVALID_WINDOW); notice publication must not overlap a PUBLISHED same-scope notice other than the declared supersede target, half-open semantics with adjacency allowed (ERR_NOTICE_WINDOW_OVERLAP)"
    error_id: "ERR_INVALID_WINDOW | ERR_NOTICE_WINDOW_OVERLAP"
    http_status: 422
    applies_to: "POST /privacy/notices/{id}/publish; POST /privacy/transfers"
  - priority: 12
    category: business_constraint
    check: "uniqueness and pool constraints: unique keys (ERR_DUPLICATE_KEY); transfer 30-day buffer gap vs APPROVED/SUSPENDED siblings (ERR_TRANSFER_WINDOW_CONFLICT, 409); at most one assessment per activity in {TRIGGERED, IN_REVIEW, CHANGES_REQUESTED} (ERR_OPEN_ASSESSMENT_EXISTS, 409); routing pool non-empty (ERR_NO_SYSTEMS_IN_SCOPE); activation needs >= 1 DOCUMENTED purpose (ERR_NO_DOCUMENTED_PURPOSE)"
    error_id: "ERR_DUPLICATE_KEY | ERR_TRANSFER_WINDOW_CONFLICT | ERR_OPEN_ASSESSMENT_EXISTS | ERR_NO_SYSTEMS_IN_SCOPE | ERR_NO_DOCUMENTED_PURPOSE"
    http_status: 409
    applies_to: "creation endpoints; POST /privacy/transfers/{id}/approve; POST /privacy/processing-activities/{id}/assessments; POST /privacy/rights-requests/{id}/route; POST /privacy/processing-activities/{id}/activate"
  - priority: 13
    category: business_constraint
    check: "request body shape: required fields present, enum members valid, array element types valid, numeric ranges respected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

