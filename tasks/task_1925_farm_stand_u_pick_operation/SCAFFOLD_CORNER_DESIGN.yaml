            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:30:00Z" }, as: FarmManager }
            - { call: "POST /farm/sales-days/${day_id}/open-day", payload: {}, as: FarmManager }
            - { call: "POST /farm/fields/${f_id}/open", payload: {}, as: FarmManager }
            - { call: "POST /farm/field-day-windows", payload: { field_id: "${f_id}", date: "2026-08-04", open_time: "09:00", close_time: "17:00", picking_capacity_slots: 30 }, as: FarmManager, captures: { w_id: $.data.id } }
            - { call: "POST /farm/field-day-windows/${w_id}/open", payload: {}, as: FarmManager }
            - { call: "POST /farm/waivers", payload: { season_id: "${s_id}", signer_name: "Ann", signer_email: "ann@x.com", party_member_names: ["Ann"] }, as: Anonymous, captures: { wv_id: $.data.id } }
            - { call: "POST /farm/visit-sessions", payload: { window_id: "${w_id}", waiver_id: "${wv_id}", party_size: 1, container_count: 1, parking_spaces: 0, origin: "ONLINE" }, as: GateStaff, captures: { vs_id: $.data.id } }
            - { call: "POST /farm/payments", payload: { session_id: "${vs_id}", kind: "CHARGE", method: "CASH", amount_cents: 850, idempotency_key: "k1" }, as: GateStaff, captures: { pay_id: $.data.id } }
