          difficulty_instance: priority_pair_validation_conflict / path_existence_priority_3_outranks_ownership_priority_4
          rationale: "That instance has a Taxpayer-role caller address a non-existent id and asserts 404 rather than 403."

      - name: priority_conflict_segregation_before_statute
        claim_type: Priority Ordering
        grounds: [validations.priority_8, validations.priority_12]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / segregation_priority_8_outranks_statute_expired_priority_12
          rationale: "That instance has the lead auditor close their own fieldwork on an audit whose statute has run and asserts ERR_SEGREGATION_OF_DUTIES."

      - name: cross_entity_validation_depends_on_the_audits_projection_status
        claim_type: Cross-entity validation
        grounds: [validations.priority_10, errors.ERR_PROJECTION_STALE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / recompute_depends_on_the_audits_projection_status
          rationale: "That instance drives the audit STALE and CURRENT and asserts recompute is refused and then allowed on the same assessment row."

      - name: temporal_validation_at_the_protest_deadline
        claim_type: Temporal validation
        grounds: [validations.priority_12, errors.ERR_PROTEST_WINDOW_CLOSED]
        excluded_because:
          difficulty_instance: boundary_precision_check / protest_deadline_day_60_inclusive
          rationale: "That instance files on day 60 and day 61 relative to notice_mailed_date and asserts inclusive-then-closed."

      - name: aggregate_validation_on_the_selection_quota
        claim_type: Aggregate validation
        grounds: [validations.priority_14, entities.IndustryProject.fields.selections_remaining]
        excluded_because:
          difficulty_instance: compensating_invariant / lead_decline_promotion_preserves_the_quota_identity
          rationale: "That instance asserts selection_quota == selections_used + selections_remaining survives a decline and the promotion it triggers."

  # ===========================================================================
  - section: endpoints
    instances:
      - name: liability_preview_agrees_with_the_assessment_it_would_create
        claim_type: Computed read
        grounds: ["endpoints.GET /audits/{id}/liability-preview", endpoints.POST /assessments, calculations.assessment_liability_rollup]
        distinguishing_aspect: |
          The preview is a pure read: it must run the identical five-step rollup and
          return the identical nine numbers the subsequent POST /assessments writes
          (tax 4762, penalty_rate_bp 500, penalty_cents 0 after the small-balance
          waiver, interest_days 0, provisional 5000, waived true, total 4762), and it
          must not create an Assessment, change Audit.status or move
          Audit.version. A preview that reports the pre-waiver penalty 238 while the
          assessment stores 0 fails the claim.
        test_recipe:
          setup:
            - "MINI carried to REVIEW_COMPLETE (permit P-2710-P1) with the clock on 2026-06-30 and one CONSUMABLE purchase of 76192 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-30T00:00:00Z" }
              as: AuditSupervisor
              as_user_id: "supervisor-1"
