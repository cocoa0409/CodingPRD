            - "TravelAgencyPartner.${ag_id}.status == SUSPENDED"
            - "TravelAgencyPartner.${ag_id}.suspended_reason == FIRST_SUSPENSION"
            - "PortalInventoryOffer.${o_id}.status == SUSPENDED"
            - "PortalInventoryOffer.${o_id}.suspension_reason == AGENCY_SUSPENDED"

      - name: revising_a_draft_notice_returns_409
        claim_type: invalid_transitions
        grounds:
          - state_machines.ProgramChangeNotice.PENDING_APPROVAL_to_DRAFT
          - validations[priority=40]
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: "revise is declared only from PENDING_APPROVAL, so invoking it on a DRAFT notice returns 409 ERR_INVALID_STATE_TRANSITION and does not bump the notice's version."
        test_recipe:
          setup:
            - "One DRAFT change notice that has never been submitted."
          setup_api_calls:
            - call: "POST /rewards/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
