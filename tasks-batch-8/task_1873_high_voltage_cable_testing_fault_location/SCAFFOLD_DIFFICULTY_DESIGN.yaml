  # ------------------------------------------------------------------ Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_error_masks_safety_error_on_job_complete
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - state_machines.TestJob.EVALUATION_to_COMPLETED
        distinguishing_aspect: |
          Error-category pair state vs business_safety: completing an IN_PROGRESS job whose
          permit is merely GROUNDING_VERIFIED violates both the from-state rule (priority 6,
          ERR_INVALID_STATE) and the permit-released safety rule (priority 9,
          ERR_PERMIT_NOT_RELEASED); the state error MUST win.
        test_recipe:
          setup:
            - "Job IN_PROGRESS; permit GROUNDING_VERIFIED (never released); no series yet, so the EVALUATION auto-gate has not fired."
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-PP1", voltage_class: "KV_15", length_m: 1000, installation_year: 2015 }, as: SystemAdmin, captures: { c: "$.data.id" } }
            - { call: "POST /cable-diagnostics/outage-windows", payload: { circuit_id: "${c}", kind: "PLANNED_DIAGNOSTIC", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-12T12:00:00Z" }, as: NetworkPlanner, captures: { w: "$.data.id" } }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/approve", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/test-jobs", payload: { circuit_id: "${c}", outage_window_id: "${w}", requested_methods: ["VLF_TAN_DELTA"], approved_budget_cents: 800000 }, as: NetworkPlanner, captures: { j: "$.data.id" } }
