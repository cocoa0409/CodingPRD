            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: CONTROL, outcome: ORIGINATED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 700, dti_pct: 36.0, application_date: "2026-01-05", decision_date: "2026-01-20" }, as: LendingDataOps, captures: { c1: $.data.id } }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: PROTECTED_1, outcome: DENIED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 720, dti_pct: 40.0, application_date: "2026-02-01", decision_date: "2026-02-10" }, as: LendingDataOps, captures: { p1: $.data.id } }
            - { call: "POST /fair-lending/applications/${c1}/validate", payload: {}, as: LendingDataOps }
            - { call: "POST /fair-lending/applications/${p1}/validate", payload: {}, as: LendingDataOps }
            - { call: "POST /fair-lending/analysis-runs", payload: { market_id: "${m1}", product_type: CONVENTIONAL, prohibited_basis: RACE, period_start: "2026-01-01", period_end: "2026-04-01" }, as: FairLendingAnalyst, captures: { r1: $.data.id } }
            - { call: "POST /fair-lending/analysis-runs/${r1}/lock", payload: {}, as: FairLendingAnalyst }
            - { call: "POST /fair-lending/analysis-runs/${r1}/compute", payload: {}, as: FairLendingAnalyst }
            - { call: "POST /fair-lending/findings", payload: { analysis_run_id: "${r1}", kind: DENIAL_DISPARITY, notes: "manual" }, as: FairLendingAnalyst, as_user_id: "analyst-creator", captures: { f1: $.data.id } }
            - { call: "POST /fair-lending/findings/${f1}/begin-review", payload: {}, as: FairLendingAnalyst, captures: { f_v: $.data.version } }
            - { call: "POST /fair-lending/matched-pair-reviews", payload: { finding_id: "${f1}", target_application_id: "${p1}", control_application_id: "${c1}", expected_finding_version: "${f_v}" }, as: FairLendingAnalyst, captures: { mp1: $.data.id } }
            - { call: "POST /fair-lending/matched-pair-reviews/${mp1}/submit-initial", payload: { outcome: DIFFERENTIAL_TREATMENT, notes: "file shows weaker documentation accepted for control" }, as: FairLendingAnalyst, as_user_id: "analyst-1", captures: { mp_status1: $.data.status } }
          trigger:
            - { call: "POST /fair-lending/matched-pair-reviews/${mp1}/dispute", payload: { reason: "officer contests comparability of documentation standard" }, as: LoanOfficer, as_user_id: "${o1}", captures: { mp_status2: $.data.status } }
            - { call: "POST /fair-lending/matched-pair-reviews/${mp1}/submit-initial", payload: { outcome: COMPARABLE_TREATMENT, notes: "second look: documentation equivalent" }, as: FairLendingAnalyst, as_user_id: "analyst-2", captures: { mp_status3: $.data.status, mp_outcome: $.data.initial_outcome, mp_reviewer: $.data.initial_reviewer_user_id, mp_dispute: $.data.dispute_reason } }
            - { call: "POST /fair-lending/matched-pair-reviews/${mp1}/confirm", payload: {}, as: FairLendingOfficer, as_user_id: "officer-1", captures: { mp_status4: $.data.status, mp_confirmer: $.data.confirmed_by_user_id } }
          assert:
            - "after first submit-initial: status == INITIAL_REVIEWED, initial_reviewer_user_id == analyst-1"
            - "after dispute: status == DISPUTED, dispute_reason == officer's reason"
            - "after re-review (cycle edge DISPUTED -> INITIAL_REVIEWED): status == INITIAL_REVIEWED, initial_outcome == COMPARABLE_TREATMENT (overwritten), initial_reviewer_user_id == analyst-2 (overwritten), dispute_reason preserved"
            - "after confirm: status == CONFIRMED (terminal), confirmed_by_user_id == officer-1"

      - name: cap_return_revise_cycle_and_auto_complete
        grounds:
          - state_machines.CorrectiveActionPlan.RETURNED_to_DRAFT
          - state_machines.CorrectiveActionPlan.EXECUTING_to_COMPLETED
          - state_machines.DisparityFinding.SUBSTANTIATED_to_CLOSED
        distinguishing_aspect: |
          CorrectiveActionPlan exhibits both a revision cycle (DRAFT ->
          SUBMITTED -> RETURNED -> DRAFT) and aggregate-driven
          auto-completion (EXECUTING -> COMPLETED only when all child payments
          reach terminal states with >= 1 DISBURSED) — a non-linear,
          child-state-gated machine on CorrectiveActionPlan, a different
          entity than MatchedPairReview.
        test_recipe:
          setup:
            - "Run R COMPUTED over 2 VALIDATED ORIGINATED apps (1 CONTROL, 1 PROTECTED_1)"
            - "Manual finding F kind=PRICING_DISPARITY SUBSTANTIATED with harmed_application_ids [p1]"
            - "CAP C pool_cents=3000 due 2026-06-30 created, then cycled DRAFT->SUBMITTED->RETURNED->DRAFT->SUBMITTED"
          setup_api_calls:
            - { call: "POST /fair-lending/markets", payload: { name: "Metro One", msa_code: "M001", protected_group_population_share: 0.40, peer_group_code: "PG7" }, as: BankAdmin, captures: { m1: $.data.id } }
            - { call: "POST /fair-lending/branches", payload: { market_id: "${m1}", name: "Main", tract_minority_pct: 55.0, opened_on: "2020-01-15" }, as: BankAdmin, captures: { b1: $.data.id } }
            - { call: "POST /fair-lending/loan-officers", payload: { branch_id: "${b1}", full_name: "Officer One" }, as: BankAdmin, captures: { o1: $.data.id } }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: CONTROL, outcome: ORIGINATED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 720, dti_pct: 36.0, application_date: "2026-01-05", decision_date: "2026-01-20" }, as: LendingDataOps, captures: { c1: $.data.id } }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: PROTECTED_1, outcome: ORIGINATED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 715, dti_pct: 36.0, application_date: "2026-02-01", decision_date: "2026-02-10" }, as: LendingDataOps, captures: { p1: $.data.id } }
            - { call: "POST /fair-lending/applications/${c1}/validate", payload: {}, as: LendingDataOps }
            - { call: "POST /fair-lending/applications/${p1}/validate", payload: {}, as: LendingDataOps }
            - { call: "POST /fair-lending/analysis-runs", payload: { market_id: "${m1}", product_type: CONVENTIONAL, prohibited_basis: RACE, period_start: "2026-01-01", period_end: "2026-04-01" }, as: FairLendingAnalyst, captures: { r1: $.data.id } }
            - { call: "POST /fair-lending/analysis-runs/${r1}/lock", payload: {}, as: FairLendingAnalyst }
            - { call: "POST /fair-lending/analysis-runs/${r1}/compute", payload: {}, as: FairLendingAnalyst }
            - { call: "POST /fair-lending/findings", payload: { analysis_run_id: "${r1}", kind: PRICING_DISPARITY, notes: "manual" }, as: FairLendingAnalyst, as_user_id: "analyst-creator", captures: { f1: $.data.id } }
            - { call: "POST /fair-lending/findings/${f1}/begin-review", payload: {}, as: FairLendingAnalyst }
            - { call: "POST /fair-lending/findings/${f1}/substantiate", payload: { harmed_application_ids: ["${p1}"] }, as: FairLendingOfficer, as_user_id: "officer-sub", captures: { f_v: $.data.version } }
            - { call: "POST /fair-lending/corrective-action-plans", payload: { finding_id: "${f1}", title: "pricing remediation", pool_cents: 3000, due_date: "2026-06-30", expected_finding_version: "${f_v}" }, as: FairLendingAnalyst, captures: { cap1: $.data.id } }
            - { call: "POST /fair-lending/corrective-action-plans/${cap1}/submit", payload: {}, as: FairLendingAnalyst, captures: { cap_s1: $.data.status } }
            - { call: "POST /fair-lending/corrective-action-plans/${cap1}/return", payload: { reason: "strengthen monitoring milestone" }, as: FairLendingOfficer, captures: { cap_s2: $.data.status } }
            - { call: "POST /fair-lending/corrective-action-plans/${cap1}/revise", payload: {}, as: FairLendingAnalyst, captures: { cap_s3: $.data.status } }
            - { call: "POST /fair-lending/corrective-action-plans/${cap1}/submit", payload: {}, as: FairLendingAnalyst, captures: { cap_s4: $.data.status } }
          trigger:
            - { call: "POST /fair-lending/corrective-action-plans/${cap1}/approve", payload: {}, as: FairLendingOfficer, as_user_id: "officer-1", captures: { cap_s5: $.data.status } }
            - { call: "GET /fair-lending/remediation-payments", payload: { corrective_action_plan_id: "${cap1}", application_id: "${p1}" }, as: RemediationSpecialist, captures: { pay1: "$.data[0].id", pay1_amt: "$.data[0].amount_cents" } }
            - { call: "POST /fair-lending/remediation-payments/${pay1}/disburse", payload: {}, as: RemediationSpecialist, as_user_id: "specialist-1", captures: { pay1_status: $.data.status } }
            - { call: "GET /fair-lending/corrective-action-plans/${cap1}", payload: {}, as: RemediationSpecialist, captures: { cap_final: $.data.status, cap_disbursed: $.data.disbursed_cents } }
