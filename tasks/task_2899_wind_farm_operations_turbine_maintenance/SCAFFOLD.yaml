scenario: |
  2899. Wind Farm Operations & Turbine Maintenance (wind farm operator): supervisory control
  monitoring with fault code triage, remote reset and dispatch decisions, scheduled maintenance
  intervals by turbine model with technician crew planning and weather windows, major component
  failure management including gearbox, blade and generator replacement with crane mobilization,
  blade inspection programs using drones and rope access with damage classification and repair
  prioritization, availability and performance guarantee tracking under service agreements with
  liquidated damages, curtailment management for grid, noise, icing and wildlife protection
  requirements, spare parts inventory strategy for long-lead major components, landowner
  payments, road maintenance and community relations
domain_name: wind-farm-operations-turbine-maintenance
api_prefix: "/wind-ops"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  difficulty_level: expert_plus
  entity_topology: graph
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate
  notes: |
    Turbine carries two independent state dimensions (availability_state x curtailment_state)
    that evolve on the same row; WorkOrder is cyclic (SUBMITTED -> REVISION_REQUESTED ->
    SUBMITTED) with a bounded revision_round; ComponentReplacement is a branching fork-join
    (PLANNED -> {CRANE_RESERVED | UPTOWER_READY} -> EXECUTED) whose join step fires divergent
    side-effect sets per branch. The ledger half is the availability guarantee: identical
    downtime and telemetry data settle to different liquidated damages under TIME_BASED vs
    ENERGY_BASED bases.

entities:
  - name: WindFarm
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: site name
        constraints: "1..120 chars, non-blank"
      - name: region_code
        type: string
        source: input
        description: regulatory region code used for noise/wildlife rule lookup
        constraints: "2..8 chars uppercase"
      - name: grid_operator_code
        type: string
        source: input
        description: grid operator issuing curtailment instructions
      - name: road_levy_pct
        type: number
        source: input
        description: percent of each approved landowner payment accrued to the road-maintenance reserve
        default: 2.5
        constraints: ">= 0 and <= 20"
      - name: community_levy_pct
        type: number
        source: input
        description: percent of each approved landowner payment accrued to the community fund
        default: 1.5
        constraints: ">= 0 and <= 20"
      - name: landowner_budget_cap_cents
        type: integer
        source: input
        description: hard cap on the sum of minimum_payment_cents across the farm's DRAFT and APPROVED settlements
        constraints: ">= 0"
      - name: turbine_count
        type: integer
        source: computed
        description: count of Turbine rows on this farm whose availability_state != 'DECOMMISSIONED'
        default: 0
      - name: installed_capacity_kw
        type: integer
        source: computed
        description: sum of TurbineModel.rated_power_kw over this farm's turbines whose availability_state != 'DECOMMISSIONED'
        default: 0
      - name: landowner_payable_cents
        type: integer
        source: system
        description: cumulative payment_cents of this farm's LandownerSettlement rows in state APPROVED
        default: 0
      - name: road_maintenance_reserve_cents
        type: integer
        source: system
        description: cumulative road_levy_cents of this farm's APPROVED settlements
        default: 0
      - name: community_fund_balance_cents
        type: integer
        source: system
        description: cumulative community_levy_cents of this farm's APPROVED settlements
        default: 0
      - name: maintenance_spend_cents
        type: integer
        source: system
        description: cumulative WorkOrder.labor_cost_cents of COMPLETED work orders plus CraneMobilization.total_crane_cost_cents charged on this farm
        default: 0
      - name: opex_accrued_cents
        type: integer
        source: computed
        description: "conserved-ledger total; MUST always equal landowner_payable_cents + road_maintenance_reserve_cents + community_fund_balance_cents + maintenance_spend_cents"
        default: 0

  - name: TurbineModel
    parent: null
    common_fields: true
    fields:
      - name: model_code
        type: string
        source: input
        description: manufacturer model code
        constraints: "unique across TurbineModel, 1..40 chars"
      - name: rated_power_kw
        type: integer
        source: input
        description: nameplate rating in kW
        constraints: "> 0"
      - name: hub_height_m
        type: number
        source: input
        description: hub height in metres
        constraints: "> 0"
      - name: rotor_diameter_m
        type: number
        source: input
        description: rotor diameter in metres
        constraints: "> 0"
      - name: service_interval_hours
        type: integer
        source: input
        description: scheduled-maintenance interval expressed in turbine operating hours
        constraints: "> 0"
      - name: service_interval_tolerance_hours
        type: integer
        source: input
        description: operating hours past the due point that are still tolerated before the interval is breached
        constraints: ">= 0"
      - name: gearbox_lead_time_days
        type: integer
        source: input
        description: procurement lead time for a gearbox on this model
        constraints: ">= 0"
      - name: blade_lead_time_days
        type: integer
        source: input
        description: procurement lead time for a blade on this model
        constraints: ">= 0"
      - name: generator_lead_time_days
        type: integer
        source: input
        description: procurement lead time for a generator on this model
        constraints: ">= 0"

  - name: Turbine
    parent: WindFarm
    common_fields: true
    fields:
      - name: wind_farm_id
        type: string
        source: input
        description: "FK -> WindFarm.id; taken from the creation path segment"
      - name: turbine_model_id
        type: string
        source: input
        description: "FK -> TurbineModel.id; pins the service interval and lead times"
      - name: asset_tag
        type: string
        source: input
        description: operator asset tag
        constraints: "unique within the wind farm"
      - name: commissioning_date
        type: string
        source: input
        description: "commissioning date, YYYY-MM-DD"
      - name: expected_kwh_per_hour
        type: number
        source: input
        description: contractual expected production rate used for lost-energy and deemed-energy arithmetic
        constraints: "> 0"
      - name: operating_hours
        type: number
        source: system
        description: cumulative operating hours advanced only by scada-sync
        default: 0
      - name: last_service_operating_hours
        type: number
        source: system
        description: operating_hours reading at the last COMPLETED SCHEDULED_SERVICE work order
        default: 0
      - name: service_due_operating_hours
        type: number
        source: computed
        description: last_service_operating_hours + TurbineModel.service_interval_hours
      - name: service_due_flag
        type: boolean
        source: computed
        description: "true when operating_hours >= service_due_operating_hours"
        default: false
      - name: service_interval_breached
        type: boolean
        source: computed
        description: "true when operating_hours > service_due_operating_hours + TurbineModel.service_interval_tolerance_hours (strict >)"
        default: false
      - name: availability_state
        type: enum
        source: system
        description: availability dimension of the turbine's parallel state machine
        default: ONLINE
        constraints: "ONLINE | FAULTED | DOWN_DISPATCH | DOWN_SERVICE | DOWN_MAJOR | DECOMMISSIONED"
      - name: curtailment_state
        type: enum
        source: system
        description: curtailment dimension of the turbine's parallel state machine; evolves independently of availability_state
        default: UNCONSTRAINED
        constraints: "UNCONSTRAINED | CURTAILED | FORCED_STOP"
      - name: active_fault_code
        type: string
        source: system
        description: fault_code of the FaultEvent currently holding the turbine down; null when none
        default: null
      - name: remote_reset_count_24h
        type: integer
        source: system
        description: remote resets attempted since reset_window_start_utc
        default: 0
      - name: reset_window_start_utc
        type: datetime
        source: system
        description: start of the rolling 24h remote-reset counting window; null until the first reset
        default: null
      - name: active_curtailment_count
        type: integer
        source: computed
        description: count of CurtailmentOrder rows on this turbine in state ACTIVE
        default: 0
      - name: effective_power_limit_kw
        type: number
        source: computed
        description: minimum power_limit_kw over this turbine's ACTIVE CurtailmentOrder rows; TurbineModel.rated_power_kw whenever active_curtailment_count == 0, both at creation and after the last ACTIVE order is released
      - name: period_actual_energy_kwh
        type: number
        source: system
        description: metered production accumulated by scada-sync since turbine creation
        default: 0
      - name: period_potential_energy_kwh
        type: number
        source: system
        description: loss-free potential production accumulated by scada-sync since turbine creation
        default: 0
      - name: counted_downtime_hours_period
        type: number
        source: system
        description: cumulative downtime hours from CLOSED FaultEvent rows whose contractual_exclusion_pinned is false
        default: 0
      - name: cumulative_lost_energy_kwh
        type: number
        source: system
        description: cumulative FaultEvent.lost_energy_kwh over this turbine's CLOSED fault events
        default: 0

  - name: FaultCodeRule
    parent: null
    common_fields: true
    fields:
      - name: fault_code
        type: string
        source: input
        description: SCADA fault code this rule governs
        constraints: "unique across FaultCodeRule, 1..24 chars"
      - name: severity_class
        type: enum
        source: input
        description: triage class driving reset eligibility and work-order severity weight
        constraints: "ADVISORY | RESETTABLE | LOCKOUT"
      - name: max_remote_resets_per_24h
        type: integer
        source: input
        description: remote resets permitted per turbine per rolling 24h window for this code
        constraints: ">= 0"
      - name: requires_dispatch
        type: boolean
        source: input
        description: when true a triage disposition of REMOTE_RESET is rejected
      - name: contractual_exclusion
        type: boolean
        source: input
        description: when true downtime from this code does NOT count against the availability guarantee

  - name: FaultEvent
    parent: Turbine
    common_fields: true
    fields:
      - name: turbine_id
        type: string
        source: input
        description: "FK -> Turbine.id; taken from the creation path segment"
      - name: fault_code_rule_id
        type: string
        source: system
        description: "FK -> FaultCodeRule.id; resolved from the submitted fault_code at raise time"
      - name: fault_code
        type: string
        source: input
        description: SCADA fault code as reported by supervisory control
      - name: raised_at
        type: datetime
        source: input
        description: instant the fault was raised in supervisory control
      - name: cleared_at
        type: datetime
        source: system
        description: instant the fault entered CLEARED; null before that
        default: null
      - name: triage_state
        type: enum
        source: system
        description: triage lifecycle state
        default: RAISED
        constraints: "RAISED | RESET_PENDING | DISPATCH_REQUIRED | DISPATCHED | CLEARED | CLOSED"
      - name: severity_class_pinned
        type: enum
        source: system
        description: copy of FaultCodeRule.severity_class taken at raise time; later rule edits do not change it
        constraints: "ADVISORY | RESETTABLE | LOCKOUT"
      - name: max_remote_resets_pinned
        type: integer
        source: system
        description: copy of FaultCodeRule.max_remote_resets_per_24h taken at raise time
      - name: requires_dispatch_pinned
        type: boolean
        source: system
        description: copy of FaultCodeRule.requires_dispatch taken at raise time; a triage disposition of REMOTE_RESET is refused when it is true, and a later PATCH of the rule does not change it
      - name: contractual_exclusion_pinned
        type: boolean
        source: system
        description: copy of FaultCodeRule.contractual_exclusion taken at raise time
      - name: fault_code_rule_version_pinned
        type: integer
        source: system
        description: FaultCodeRule.version observed at raise time
      - name: reset_attempt_count
        type: integer
        source: system
        description: remote reset attempts made against this fault event
        default: 0
      - name: downtime_hours
        type: number
        source: computed
        description: "(cleared_at - raised_at) / 3600, computed when the event enters CLOSED; null before that"
        default: null
      - name: lost_energy_kwh
        type: number
        source: computed
        description: "round_half_up(downtime_hours * Turbine.expected_kwh_per_hour, 2), computed when the event enters CLOSED"
        default: null

  - name: Crew
    parent: WindFarm
    common_fields: true
    fields:
      - name: wind_farm_id
        type: string
        source: input
        description: "FK -> WindFarm.id; the crew is rostered at this site only"
      - name: crew_code
        type: string
        source: input
        description: crew identifier
        constraints: "unique within the wind farm"
      - name: technician_count
        type: integer
        source: input
        description: technicians on the crew
        constraints: ">= 1"
      - name: certifications
        type: array
        source: input
        description: certifications held by the crew
        constraints: "non-empty subset of {GWO_BASIC, ROPE_ACCESS, HV_SWITCHING, CRANE_BANKSMAN, BLADE_COMPOSITE}"
      - name: max_work_wind_speed_ms
        type: number
        source: input
        description: highest forecast wind speed at which this crew may work at height
        constraints: "> 0"
      - name: daily_hours_capacity
        type: number
        source: input
        description: hours the crew may commit on a single UTC calendar date
        constraints: "> 0"
      - name: hourly_rate_cents
        type: integer
        source: input
        description: fully burdened crew rate per hour in cents
        constraints: ">= 0"
      - name: status
        type: enum
        source: input
        description: rostering status; ON_SHIFT is set by cascade while one of the crew's work orders is IN_PROGRESS
        default: AVAILABLE
        constraints: "AVAILABLE | ON_SHIFT | OFF_ROTATION (only AVAILABLE and OFF_ROTATION accepted as input)"

  - name: WeatherWindow
    parent: WindFarm
    common_fields: true
    fields:
      - name: wind_farm_id
        type: string
        source: input
        description: "FK -> WindFarm.id; the window is site-specific"
      - name: start_utc
        type: datetime
        source: input
        description: inclusive start of the forecast window
      - name: end_utc
        type: datetime
        source: input
        description: "exclusive end of the forecast window; interval semantics are half-open [start_utc, end_utc)"
        constraints: "> start_utc"
      - name: forecast_wind_speed_ms
        type: number
        source: input
        description: forecast mean wind speed over the window
        constraints: ">= 0"
      - name: forecast_gust_ms
        type: number
        source: input
        description: forecast gust speed over the window
        constraints: ">= forecast_wind_speed_ms"
      - name: icing_risk
        type: boolean
        source: input
        description: true when the forecast carries an icing risk for this window
      - name: state
        type: enum
        source: system
        description: window lifecycle state
        default: FORECAST
        constraints: "FORECAST | CONFIRMED | CONSUMED | EXPIRED"
      - name: active_work_order_count
        type: integer
        source: system
        description: "number of WorkOrder rows in state SCHEDULED or IN_PROGRESS that name this window; a CONFIRMED window is SHARED and may back several crews at once, so crew occupancy is policed by the crew rules and not by window exclusivity"
        default: 0

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - name: turbine_id
        type: string
        source: input
        description: "FK -> Turbine.id; the turbine the work is performed on"
      - name: fault_event_id
        type: string
        source: input
        description: "FK -> FaultEvent.id; required when work_type == 'FAULT_DISPATCH', otherwise MUST be omitted"
        default: null
      - name: blade_damage_id
        type: string
        source: input
        description: "FK -> BladeDamage.id; required when work_type == 'BLADE_REPAIR', otherwise MUST be omitted"
        default: null
      - name: parent_work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; self-referential link for follow-up work raised out of an earlier order"
        default: null
      - name: crew_id
        type: string
        source: system
        description: "FK -> Crew.id; set by schedule, cleared when the order returns to REVISION_REQUESTED"
        default: null
      - name: weather_window_id
        type: string
        source: system
        description: "FK -> WeatherWindow.id; set by schedule, cleared when the order returns to REVISION_REQUESTED"
        default: null
      - name: work_type
        type: enum
        source: input
        description: nature of the work
        constraints: "SCHEDULED_SERVICE | FAULT_DISPATCH | BLADE_REPAIR | MAJOR_COMPONENT"
      - name: required_certification
        type: enum
        source: input
        description: certification the assigned crew MUST hold
        constraints: "GWO_BASIC | ROPE_ACCESS | HV_SWITCHING | CRANE_BANKSMAN | BLADE_COMPOSITE"
      - name: estimated_hours
        type: number
        source: input
        description: planned crew hours; drives crew capacity and projected lost energy
        constraints: "> 0"
      - name: actual_hours
        type: number
        source: input
        description: hours actually worked, supplied at completion
        default: null
        constraints: "> 0 when supplied"
      - name: state
        type: enum
        source: system
        description: cyclic work-order lifecycle state
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | REVISION_REQUESTED | SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED"
      - name: revision_round
        type: integer
        source: system
        description: number of completed SUBMITTED -> REVISION_REQUESTED loops
        default: 0
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor that last submitted the order; segregation-of-duties key
        default: null
      - name: planned_start_utc
        type: datetime
        source: input
        description: "inclusive start of the planned execution interval; set by schedule"
        default: null
      - name: planned_end_utc
        type: datetime
        source: input
        description: "exclusive end of the planned execution interval; crew occupancy is half-open [planned_start_utc, planned_end_utc)"
        default: null
      - name: priority_score
        type: number
        source: computed
        description: weighted repair-prioritization score, recomputed on submit and on any farm availability-risk change
        default: null
      - name: labor_cost_cents
        type: integer
        source: computed
        description: "round_half_up(actual_hours * Crew.hourly_rate_cents) computed at completion"
        default: null

  - name: CraneMobilization
    parent: WindFarm
    common_fields: true
    fields:
      - name: wind_farm_id
        type: string
        source: input
        description: "FK -> WindFarm.id; a crane occupies one site slot for its whole mobilization"
      - name: crane_class
        type: enum
        source: input
        description: crane class; only CRAWLER_600T may lift a GEARBOX or a BLADE
        constraints: "CRAWLER_600T | TOWER_ASSIST | SELF_ERECTING"
      - name: mobilization_start_utc
        type: datetime
        source: input
        description: instant the crane arrives on site
      - name: demobilization_end_utc
        type: datetime
        source: input
        description: instant the crane leaves site
        constraints: "> mobilization_start_utc"
      - name: day_rate_cents
        type: integer
        source: input
        description: crane day rate in cents
        constraints: ">= 0"
      - name: mobilization_fee_cents
        type: integer
        source: input
        description: one-off mobilization fee in cents
        constraints: ">= 0"
      - name: max_lift_wind_speed_ms
        type: number
        source: input
        description: highest forecast wind speed at which this crane may lift
        constraints: "> 0"
      - name: state
        type: enum
        source: system
        description: mobilization lifecycle state
        default: REQUESTED
        constraints: "REQUESTED | MOBILIZED | DEMOBILIZED | CANCELLED"
      - name: reserved_replacement_count
        type: integer
        source: computed
        description: count of ComponentReplacement rows whose crane_mobilization_id is this crane and whose state is in {CRANE_RESERVED, EXECUTED, CLOSED}
        default: 0
      - name: lift_days
        type: integer
        source: computed
        description: "ceil(sum of estimated_lift_hours over reserved replacements / CRANE_SHIFT_HOURS)"
        default: 0
      - name: standby_days
        type: integer
        source: computed
        description: whole UTC days in the mobilization interval whose covering CONFIRMED WeatherWindow forecasts wind above max_lift_wind_speed_ms
        default: 0
      - name: billable_days
        type: integer
        source: computed
        description: lift_days + standby_days
        default: 0
      - name: subtotal_cents
        type: integer
        source: computed
        description: mobilization_fee_cents + day_rate_cents * billable_days
        default: 0
      - name: volume_credit_cents
        type: integer
        source: computed
        description: credit derived from the tier of subtotal_cents
        default: 0
      - name: total_crane_cost_cents
        type: integer
        source: computed
        description: subtotal_cents - volume_credit_cents, or the cancellation fee once state is CANCELLED
        default: 0

  - name: SparePart
    parent: null
    common_fields: true
    fields:
      - name: component_type
        type: enum
        source: input
        description: major component this stock line covers
        constraints: "GEARBOX | BLADE | GENERATOR"
      - name: part_number
        type: string
        source: input
        description: manufacturer part number
        constraints: "unique across SparePart"
      - name: quantity_on_hand
        type: integer
        source: input
        description: "unreserved units physically in stock; supplied as the opening balance at creation and thereafter maintained only by goods receipts, reservations and cancellations"
        constraints: ">= 0"
      - name: quantity_reserved
        type: integer
        source: system
        description: units held by ComponentReplacement rows in state PLANNED, CRANE_RESERVED or UPTOWER_READY
        default: 0
      - name: quantity_consumed
        type: integer
        source: system
        description: units consumed by EXECUTED or CLOSED replacements
        default: 0
      - name: total_units_accounted
        type: integer
        source: computed
        description: "conserved quantity; MUST always equal quantity_on_hand + quantity_reserved + quantity_consumed"
        default: 0
      - name: lead_time_days
        type: integer
        source: input
        description: procurement lead time for this long-lead line
        constraints: ">= 0"
      - name: reorder_point
        type: integer
        source: input
        description: quantity_on_hand at or above which the line is considered IN_STOCK
        constraints: ">= 0"
      - name: unit_cost_cents
        type: integer
        source: input
        description: unit cost in cents
        constraints: ">= 0"
      - name: uptower_repairable
        type: boolean
        source: input
        description: true when this line supports an up-tower repair path that needs no crane
      - name: status
        type: enum
        source: computed
        description: "IN_STOCK when quantity_on_hand >= reorder_point; BELOW_REORDER_POINT when 0 < quantity_on_hand < reorder_point; OUT_OF_STOCK when quantity_on_hand == 0"
        default: IN_STOCK
        constraints: "IN_STOCK | BELOW_REORDER_POINT | OUT_OF_STOCK"
      - name: procurement_flag
        type: boolean
        source: computed
        description: "true exactly when status != 'IN_STOCK'"
        default: false

  - name: ComponentReplacement
    parent: WorkOrder
    common_fields: true
    fields:
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; the MAJOR_COMPONENT order this replacement executes under"
      - name: spare_part_id
        type: string
        source: input
        description: "FK -> SparePart.id; the stock line the unit is drawn from"
      - name: crane_mobilization_id
        type: string
        source: system
        description: "FK -> CraneMobilization.id; set by reserve-crane, null on the up-tower branch"
        default: null
      - name: component_type
        type: enum
        source: input
        description: component being replaced
        constraints: "GEARBOX | BLADE | GENERATOR"
      - name: estimated_lift_hours
        type: number
        source: input
        description: crane hours the lift is expected to occupy
        constraints: ">= 0"
      - name: uptower_labor_hours
        type: number
        source: input
        description: additional crew hours booked when the up-tower branch is taken
        default: null
        constraints: "> 0 when supplied"
      - name: execution_path
        type: enum
        source: system
        description: branch actually taken; null while state is PLANNED
        default: null
        constraints: "CRANE_LIFT | UPTOWER_REPAIR"
      - name: state
        type: enum
        source: system
        description: branching fork-join replacement lifecycle state
        default: PLANNED
        constraints: "PLANNED | CRANE_RESERVED | UPTOWER_READY | EXECUTED | CLOSED | CANCELLED"
      - name: allocated_crane_cost_cents
        type: integer
        source: computed
        description: this replacement's share of its crane's total_crane_cost_cents; 0 on the up-tower branch
        default: 0

  - name: BladeDamage
    parent: Turbine
    common_fields: true
    fields:
      - name: turbine_id
        type: string
        source: input
        description: "FK -> Turbine.id; taken from the creation path segment"
      - name: inspection_method
        type: enum
        source: input
        description: how the finding was observed
        constraints: "DRONE | ROPE_ACCESS | GROUND_OPTICAL"
      - name: blade_position
        type: enum
        source: input
        description: which blade carries the damage
        constraints: "A | B | C"
      - name: inspected_at
        type: datetime
        source: input
        description: instant of the inspection that produced this finding
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor that recorded the finding; segregation-of-duties key for prioritization
      - name: damage_category
        type: integer
        source: input
        description: IEC-style damage category
        constraints: ">= 1 and <= 5"
      - name: damage_type
        type: enum
        source: input
        description: damage mechanism
        constraints: "LEADING_EDGE_EROSION | CRACK_TRANSVERSE | LIGHTNING_STRIKE | DELAMINATION"
      - name: chord_position_pct
        type: number
        source: input
        description: chordwise position of the damage as a percent of chord
        constraints: ">= 0 and <= 100"
      - name: damage_length_mm
        type: number
        source: input
        description: longest dimension of the damage in millimetres
        constraints: ">= 0"
      - name: exposed_area_cm2
        type: number
        source: input
        description: exposed laminate area in square centimetres
        constraints: ">= 0"
      - name: severity_score
        type: number
        source: computed
        description: weighted damage severity on a 0..100 scale, rounded per factor then summed
      - name: repair_priority_band
        type: enum
        source: computed
        description: "CRITICAL when severity_score >= 80; HIGH when >= 60; MEDIUM when >= 40; LOW otherwise"
        constraints: "CRITICAL | HIGH | MEDIUM | LOW"
      - name: repair_due_days
        type: integer
        source: computed
        description: "14 for CRITICAL, 45 for HIGH, 120 for MEDIUM, 365 for LOW"
      - name: state
        type: enum
        source: system
        description: damage lifecycle state
        default: OPEN
        constraints: "OPEN | PRIORITIZED | REPAIR_SCHEDULED | REPAIRED | WAIVED"
      - name: waiver_rationale
        type: string
        source: input
        description: engineering rationale recorded when the finding is waived
        default: null

  - name: ServiceAgreement
    parent: WindFarm
    common_fields: true
    fields:
      - name: wind_farm_id
        type: string
        source: input
        description: "FK -> WindFarm.id; the site whose availability the guarantee covers"
      - name: guaranteed_availability_pct
        type: number
        source: input
        description: guaranteed availability percentage, four decimal places
        constraints: "> 0 and <= 100"
      - name: availability_basis
        type: enum
        source: input
        description: which of the two computed availability figures the liquidated-damages assessment is taken from
        constraints: "TIME_BASED | ENERGY_BASED"
      - name: lda_rate_cents_per_pct_point
        type: integer
        source: input
        description: liquidated damages charged per whole percentage point of shortfall
        constraints: ">= 0"
      - name: lda_cap_cents
        type: integer
        source: input
        description: cap on assessed liquidated damages for the measurement period
        constraints: ">= 0"
      - name: period_start_utc
        type: datetime
        source: input
        description: inclusive start of the measurement period
      - name: period_end_utc
        type: datetime
        source: input
        description: "exclusive end of the measurement period; half-open [period_start_utc, period_end_utc)"
        constraints: "> period_start_utc"
      - name: time_based_availability_pct
        type: number
        source: computed
        description: time-based availability figure produced by the settlement run, 4 decimal places
        default: null
      - name: energy_based_availability_pct
        type: number
        source: computed
        description: energy-based availability figure produced by the same settlement run, 4 decimal places
        default: null
      - name: assessed_lda_cents
        type: integer
        source: computed
        description: liquidated damages assessed from the basis figure, capped at lda_cap_cents
        default: 0
      - name: projected_shortfall_pct
        type: number
        source: computed
        description: live shortfall projection recomputed whenever a turbine's counted downtime or telemetry changes
        default: 0
      - name: at_risk_flag
        type: boolean
        source: computed
        description: "true exactly when projected_shortfall_pct > 0; adds the LDA term to every open work order's priority_score"
        default: false
      - name: state
        type: enum
        source: system
        description: agreement lifecycle state
        default: ACTIVE
        constraints: "ACTIVE | IN_SETTLEMENT | SETTLED"

  - name: CurtailmentOrder
    parent: Turbine
    common_fields: true
    fields:
      - name: turbine_id
        type: string
        source: input
        description: "FK -> Turbine.id; taken from the creation path segment"
      - name: reason
        type: enum
        source: input
        description: curtailment driver
        constraints: "GRID | NOISE | ICING | WILDLIFE"
      - name: compensable
        type: boolean
        source: computed
        description: "true exactly when reason == 'GRID'; compensable curtailment is excluded from counted downtime and earns deemed energy for landowners"
      - name: start_utc
        type: datetime
        source: input
        description: inclusive start of the curtailment interval
      - name: end_utc
        type: datetime
        source: input
        description: "exclusive end of the curtailment interval; half-open [start_utc, end_utc)"
        constraints: "> start_utc"
      - name: power_limit_kw
        type: number
        source: input
        description: "power cap while active; 0 means a forced stop"
        constraints: ">= 0"
      - name: deemed_kwh_per_hour
        type: number
        source: input
        description: deemed generation rate used for landowner royalty on compensable curtailment
        constraints: ">= 0"
      - name: state
        type: enum
        source: system
        description: curtailment lifecycle state
        default: PENDING
        constraints: "PENDING | ACTIVE | RELEASED | CANCELLED"
      - name: curtailed_hours
        type: number
        source: computed
        description: "(end_utc - start_utc) / 3600, materialised when the order is RELEASED"
        default: null
      - name: lost_energy_kwh
        type: number
        source: computed
        description: "round_half_up(curtailed_hours * (Turbine.expected_kwh_per_hour - power_limit_kw), 2) when RELEASED, floored at 0"
        default: null

  - name: LandownerSettlement
    parent: WindFarm
    common_fields: true
    fields:
      - name: wind_farm_id
        type: string
        source: input
        description: "FK -> WindFarm.id; taken from the creation path segment"
      - name: parcel_code
        type: string
        source: input
        description: landowner parcel this settlement pays
        constraints: "1..40 chars"
      - name: royalty_basis
        type: enum
        source: input
        description: which royalty base the lease for this parcel uses
        constraints: "METERED_ONLY | DEEMED_INCLUSIVE"
      - name: period_start_utc
        type: datetime
        source: input
        description: inclusive start of the settlement period
      - name: period_end_utc
        type: datetime
        source: input
        description: "exclusive end of the settlement period; half-open [period_start_utc, period_end_utc)"
        constraints: "> period_start_utc"
      - name: royalty_pct
        type: number
        source: input
        description: royalty percentage applied to the royalty base revenue
        constraints: "> 0 and <= 100"
      - name: minimum_payment_cents
        type: integer
        source: input
        description: floor payment guaranteed to the landowner for the period
        constraints: ">= 0"
      - name: energy_price_cents_per_kwh
        type: number
        source: input
        description: settlement energy price in cents per kWh
        constraints: "> 0"
      - name: road_damage_assessment_cents
        type: integer
        source: input
        description: assessed haul-road damage for the period, recorded for community relations reporting
        constraints: ">= 0"
      - name: metered_kwh
        type: number
        source: computed
        description: sum of period_actual_energy_kwh over the farm's turbines whose availability_state != 'DECOMMISSIONED'
        default: 0
      - name: deemed_kwh
        type: number
        source: computed
        description: deemed generation from compensable curtailment clipped to the settlement period; 0 under METERED_ONLY
        default: 0
      - name: royalty_cents
        type: integer
        source: computed
        description: royalty before the minimum-payment floor is applied
        default: 0
      - name: payment_cents
        type: integer
        source: computed
        description: "max(minimum_payment_cents, royalty_cents)"
        default: 0
      - name: road_levy_cents
        type: integer
        source: computed
        description: "round_half_up(payment_cents * WindFarm.road_levy_pct / 100)"
        default: 0
      - name: community_levy_cents
        type: integer
        source: computed
        description: "round_half_up(payment_cents * WindFarm.community_levy_pct / 100)"
        default: 0
      - name: state
        type: enum
        source: system
        description: settlement lifecycle state
        default: DRAFT
        constraints: "DRAFT | APPROVED | VOID"
      - name: void_reason
        type: string
        source: input
        description: reason recorded when an approved settlement is reversed
        default: null

state_machines:
  - entity: Turbine
    initial_state: "availability_state=ONLINE, curtailment_state=UNCONSTRAINED"
    terminal_states: [DECOMMISSIONED]
    note: |
      Turbine carries TWO independent state dimensions on the same row. Dimension A is
      availability_state; dimension B is curtailment_state. A transition on one dimension
      NEVER writes the other dimension. Transition ids below are namespaced by dimension.
    transitions:
      - from: ONLINE
        to: FAULTED
        trigger: "POST /wind-ops/turbines/{id}/fault-events"
        actor: ControlRoomOperator
        preconditions:
          - "availability_state == 'ONLINE'"
          - "a FaultCodeRule with the submitted fault_code exists"
        side_effects:
          - "sets active_fault_code to the submitted fault_code"
          - "creates a FaultEvent in triage_state RAISED with severity_class_pinned, max_remote_resets_pinned, requires_dispatch_pinned, contractual_exclusion_pinned and fault_code_rule_version_pinned copied from the FaultCodeRule"
          - "curtailment_state is left untouched"
      - from: FAULTED
        to: ONLINE
        trigger: "POST /wind-ops/fault-events/{id}/remote-reset with reset_outcome=SUCCEEDED"
        actor: ControlRoomOperator
        preconditions:
          - "availability_state == 'FAULTED'"
          - "the fault event is in triage_state RESET_PENDING"
        side_effects:
          - "clears active_fault_code to null"
          - "moves the FaultEvent to CLEARED and stamps cleared_at with the logical clock"
          - "curtailment_state is left untouched"
      - from: FAULTED
        to: DOWN_DISPATCH
        trigger: "POST /wind-ops/work-orders/{id}/start on a FAULT_DISPATCH order"
        actor: CrewLead
        preconditions:
          - "availability_state == 'FAULTED'"
          - "the work order is SCHEDULED and its work_type == 'FAULT_DISPATCH'"
        side_effects:
          - "sets the assigned Crew.status to ON_SHIFT"
      - from: DOWN_DISPATCH
        to: ONLINE
        trigger: "POST /wind-ops/work-orders/{id}/complete on a FAULT_DISPATCH order"
        actor: ReliabilityEngineer | CrewLead
        preconditions:
          - "availability_state == 'DOWN_DISPATCH'"
        side_effects:
          - "clears active_fault_code to null"
          - "cascade link 2: the linked FaultEvent moves DISPATCHED -> CLEARED with cleared_at stamped from the logical clock"
          - "cascade link 3: the FaultEvent then moves CLEARED -> CLOSED, computing downtime_hours and lost_energy_kwh"
          - "cascade link 4: because the event closed, counted_downtime_hours_period += downtime_hours when contractual_exclusion_pinned is false, and cumulative_lost_energy_kwh += lost_energy_kwh"
      - from: ONLINE
        to: DOWN_SERVICE
        trigger: "POST /wind-ops/work-orders/{id}/start on a SCHEDULED_SERVICE or BLADE_REPAIR order"
        actor: CrewLead
        preconditions:
          - "availability_state == 'ONLINE'"
          - "the work order is SCHEDULED and its work_type is in {SCHEDULED_SERVICE, BLADE_REPAIR}"
        side_effects:
          - "sets the assigned Crew.status to ON_SHIFT"
      - from: DOWN_SERVICE
        to: ONLINE
        trigger: "POST /wind-ops/work-orders/{id}/complete on a SCHEDULED_SERVICE or BLADE_REPAIR order"
        actor: ReliabilityEngineer | CrewLead
        preconditions:
          - "availability_state == 'DOWN_SERVICE'"
        side_effects:
          - "for SCHEDULED_SERVICE: last_service_operating_hours := operating_hours, which recomputes service_due_operating_hours, service_due_flag and service_interval_breached"
          - "for BLADE_REPAIR: the linked BladeDamage moves REPAIR_SCHEDULED -> REPAIRED"
      - from: ONLINE
        to: DOWN_MAJOR
        trigger: "POST /wind-ops/work-orders/{id}/start on a MAJOR_COMPONENT order"
        actor: CrewLead
        preconditions:
          - "availability_state == 'ONLINE'"
          - "the work order is SCHEDULED and its work_type == 'MAJOR_COMPONENT'"
        side_effects:
          - "sets the assigned Crew.status to ON_SHIFT"
      - from: DOWN_MAJOR
        to: ONLINE
        trigger: "POST /wind-ops/work-orders/{id}/complete on a MAJOR_COMPONENT order"
        actor: ReliabilityEngineer | CrewLead
        preconditions:
          - "availability_state == 'DOWN_MAJOR'"
        side_effects:
          - "every ComponentReplacement of this work order in state EXECUTED moves to CLOSED"
      - from: ONLINE
        to: DECOMMISSIONED
        trigger: "POST /wind-ops/turbines/{id}/decommission"
        actor: SiteAdmin
        preconditions:
          - "availability_state == 'ONLINE'"
          - "no WorkOrder on this turbine is in state SUBMITTED, REVISION_REQUESTED, SCHEDULED or IN_PROGRESS"
        side_effects:
          - "WindFarm.turbine_count and WindFarm.installed_capacity_kw are recomputed excluding this turbine"
          - "every ACTIVE CurtailmentOrder on this turbine moves to RELEASED and curtailment_state returns to UNCONSTRAINED"
      - from: UNCONSTRAINED
        to: CURTAILED
        trigger: "POST /wind-ops/curtailment-orders/{id}/activate with power_limit_kw > 0"
        actor: ControlRoomOperator
        preconditions:
          - "the curtailment order is PENDING"
          - "active_curtailment_count < 2 (curtailment stack limit)"
        side_effects:
          - "active_curtailment_count += 1 and effective_power_limit_kw := min over the turbine's ACTIVE orders of power_limit_kw"
          - "availability_state is left untouched"
      - from: UNCONSTRAINED
        to: FORCED_STOP
        trigger: "POST /wind-ops/curtailment-orders/{id}/activate with power_limit_kw == 0"
        actor: ControlRoomOperator
        preconditions:
          - "the curtailment order is PENDING"
          - "active_curtailment_count < 2"
        side_effects:
          - "active_curtailment_count += 1 and effective_power_limit_kw := 0"
          - "availability_state is left untouched; a FORCED_STOP turbine may still be FAULTED, DOWN_SERVICE or ONLINE"
      - from: CURTAILED
        to: FORCED_STOP
        trigger: "POST /wind-ops/curtailment-orders/{id}/activate with power_limit_kw == 0"
        actor: ControlRoomOperator
        preconditions:
          - "the curtailment order is PENDING"
          - "active_curtailment_count < 2"
        side_effects:
          - "effective_power_limit_kw := 0 because the minimum over ACTIVE orders is now 0"
      - from: FORCED_STOP
        to: UNCONSTRAINED
        trigger: "POST /wind-ops/curtailment-orders/{id}/release"
        actor: ControlRoomOperator
        preconditions:
          - "the curtailment order is ACTIVE"
          - "after release, active_curtailment_count == 0"
        side_effects:
          - "effective_power_limit_kw := TurbineModel.rated_power_kw, the uncurtailed nameplate ceiling"
          - "the released order materialises curtailed_hours and lost_energy_kwh"
      - from: CURTAILED
        to: UNCONSTRAINED
        trigger: "POST /wind-ops/curtailment-orders/{id}/release"
        actor: ControlRoomOperator
        preconditions:
          - "the curtailment order is ACTIVE"
          - "after release, active_curtailment_count == 0"
        side_effects:
          - "effective_power_limit_kw := TurbineModel.rated_power_kw, the uncurtailed nameplate ceiling"
          - "the released order materialises curtailed_hours and lost_energy_kwh"

  - entity: WorkOrder
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    note: |
      Cyclic machine: SUBMITTED -> REVISION_REQUESTED -> SUBMITTED may repeat, bounded by
      revision_round <= MAX_REVISION_ROUNDS (3). The loop is also entered by cascade when a
      crane mobilization backing the order is cancelled.
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /wind-ops/work-orders/{id}/submit"
        actor: MaintenancePlanner
        preconditions:
          - "state == 'DRAFT'"
          - "Turbine.availability_state != 'DECOMMISSIONED'"
        side_effects:
          - "submitted_by_user_id := X-User-ID"
          - "priority_score computed by calculations.work_order_priority_score"
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /wind-ops/work-orders/{id}/request-revision"
        actor: ReliabilityEngineer
        preconditions:
          - "state == 'SUBMITTED'"
          - "revision_round < 3"
        side_effects:
          - "revision_round += 1"
      - from: SCHEDULED
        to: REVISION_REQUESTED
        trigger: "POST /wind-ops/work-orders/{id}/request-revision, or cascade from POST /wind-ops/component-replacements/{id}/cancel"
        actor: ReliabilityEngineer | system
        preconditions:
          - "state == 'SCHEDULED'"
          - "revision_round < 3"
        side_effects:
          - "revision_round += 1"
          - "crew_id := null and weather_window_id := null"
          - "the WeatherWindow's active_work_order_count -= 1 and its state is left unchanged"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /wind-ops/work-orders/{id}/submit"
        actor: MaintenancePlanner
        preconditions:
          - "state == 'REVISION_REQUESTED'"
        side_effects:
          - "submitted_by_user_id := X-User-ID"
          - "priority_score recomputed"
          - "re-submission is NEVER gated by revision_round; only the request-revision back-edge is bounded, so an order that has exhausted its three revisions is still re-submittable and schedulable"
      - from: SUBMITTED
        to: SCHEDULED
        trigger: "POST /wind-ops/work-orders/{id}/schedule"
        actor: MaintenancePlanner
        preconditions:
          - "state == 'SUBMITTED'"
          - "the WeatherWindow is in state CONFIRMED"
          - "the Crew holds required_certification and Crew.status != 'OFF_ROTATION'"
          - "Crew.wind_farm_id == Turbine.wind_farm_id and WeatherWindow.wind_farm_id == Turbine.wind_farm_id"
          - "WeatherWindow.forecast_wind_speed_ms <= Crew.max_work_wind_speed_ms"
          - "[planned_start_utc, planned_end_utc) is contained in [WeatherWindow.start_utc, WeatherWindow.end_utc)"
          - "the crew has no other SCHEDULED or IN_PROGRESS order whose half-open planned interval overlaps"
          - "crew same-UTC-date committed hours plus estimated_hours <= Crew.daily_hours_capacity"
        side_effects:
          - "crew_id and weather_window_id are set; planned_start_utc and planned_end_utc are stored"
          - "the WeatherWindow stays CONFIRMED and its active_work_order_count += 1, so a second crew may be scheduled into the same window"
          - "for a BLADE_REPAIR order the linked BladeDamage moves PRIORITIZED -> REPAIR_SCHEDULED"
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /wind-ops/work-orders/{id}/start"
        actor: CrewLead
        preconditions:
          - "state == 'SCHEDULED'"
          - "X-User-ID == crew_id"
          - "Turbine.availability_state is ONLINE for SCHEDULED_SERVICE, BLADE_REPAIR and MAJOR_COMPONENT orders, or FAULTED for FAULT_DISPATCH orders"
        side_effects:
          - "Crew.status := ON_SHIFT"
          - "Turbine.availability_state advances per the Turbine machine"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /wind-ops/work-orders/{id}/complete"
        actor: ReliabilityEngineer | CrewLead
        preconditions:
          - "state == 'IN_PROGRESS'"
          - "X-User-ID != submitted_by_user_id (segregation of duties)"
        side_effects:
          - "labor_cost_cents := round_half_up(actual_hours * Crew.hourly_rate_cents)"
          - "WindFarm.maintenance_spend_cents += labor_cost_cents and WindFarm.opex_accrued_cents += labor_cost_cents"
          - "Crew.status := AVAILABLE"
          - "the WeatherWindow's active_work_order_count -= 1; when it reaches 0 the window moves CONSUMED -> EXPIRED"
          - "Turbine.availability_state returns per the Turbine machine, driving the fault/damage/replacement cascades"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /wind-ops/work-orders/{id}/cancel"
        actor: MaintenancePlanner
        preconditions:
          - "state is in {DRAFT, SUBMITTED, REVISION_REQUESTED}"
        side_effects:
          - "every ComponentReplacement of this order in state PLANNED, CRANE_RESERVED or UPTOWER_READY moves to CANCELLED, releasing its spare-part reservation"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /wind-ops/work-orders/{id}/cancel"
        actor: MaintenancePlanner
        preconditions:
          - "state == 'SCHEDULED'"
        side_effects:
          - "crew_id := null and the WeatherWindow's active_work_order_count -= 1, leaving the window's state unchanged"
          - "every ComponentReplacement of this order in state PLANNED, CRANE_RESERVED or UPTOWER_READY moves to CANCELLED"

  - entity: FaultEvent
    initial_state: RAISED
    terminal_states: [CLOSED]
    transitions:
      - from: RAISED
        to: RESET_PENDING
        trigger: "POST /wind-ops/fault-events/{id}/triage with disposition=REMOTE_RESET"
        actor: ControlRoomOperator
        preconditions:
          - "triage_state == 'RAISED'"
          - "severity_class_pinned == 'RESETTABLE', else ERR_RESET_NOT_PERMITTED"
          - "requires_dispatch_pinned is false, else ERR_RESET_NOT_PERMITTED"
        side_effects:
          - "no turbine state change; the turbine stays FAULTED"
      - from: RAISED
        to: DISPATCH_REQUIRED
        trigger: "POST /wind-ops/fault-events/{id}/triage with disposition=DISPATCH"
        actor: ControlRoomOperator
        preconditions:
          - "triage_state == 'RAISED'"
        side_effects:
          - "no turbine state change; the turbine stays FAULTED"
      - from: RESET_PENDING
        to: CLEARED
        trigger: "POST /wind-ops/fault-events/{id}/remote-reset with reset_outcome=SUCCEEDED"
        actor: ControlRoomOperator
        preconditions:
          - "triage_state == 'RESET_PENDING'"
          - "reset_attempt_count < max_remote_resets_pinned"
          - "Turbine.curtailment_state != 'FORCED_STOP'"
        side_effects:
          - "reset_attempt_count += 1 and Turbine.remote_reset_count_24h += 1"
          - "cleared_at := logical clock now"
          - "Turbine.availability_state FAULTED -> ONLINE and active_fault_code := null"
      - from: RESET_PENDING
        to: RESET_PENDING
        trigger: "POST /wind-ops/fault-events/{id}/remote-reset with reset_outcome=FAILED"
        actor: ControlRoomOperator
        preconditions:
          - "triage_state == 'RESET_PENDING'"
          - "reset_attempt_count < max_remote_resets_pinned, else ERR_RESET_QUOTA_EXHAUSTED"
          - "Turbine.curtailment_state != 'FORCED_STOP'"
        side_effects:
          - "reset_attempt_count += 1 and Turbine.remote_reset_count_24h += 1"
          - "the event STAYS in RESET_PENDING so any remaining quota can be spent on a further attempt; the turbine stays FAULTED"
      - from: RESET_PENDING
        to: DISPATCH_REQUIRED
        trigger: "POST /wind-ops/fault-events/{id}/triage with disposition=DISPATCH"
        actor: ControlRoomOperator
        preconditions:
          - "triage_state == 'RESET_PENDING'"
        side_effects:
          - "no reset attempt is consumed; the event leaves the reset track and now requires a technician dispatch"
      - from: DISPATCH_REQUIRED
        to: DISPATCHED
        trigger: "POST /wind-ops/work-orders (work_type=FAULT_DISPATCH with fault_event_id set)"
        actor: MaintenancePlanner
        preconditions:
          - "triage_state == 'DISPATCH_REQUIRED'"
        side_effects:
          - "the created WorkOrder holds fault_event_id; no other FaultEvent field changes"
      - from: DISPATCHED
        to: CLEARED
        trigger: "cascade from POST /wind-ops/work-orders/{id}/complete"
        actor: system
        preconditions:
          - "triage_state == 'DISPATCHED'"
          - "the completing work order's fault_event_id is this event"
        side_effects:
          - "cleared_at := logical clock now"
      - from: CLEARED
        to: CLOSED
        trigger: "POST /wind-ops/fault-events/{id}/close, or the same cascade that produced CLEARED from DISPATCHED"
        actor: ControlRoomOperator | system
        preconditions:
          - "triage_state == 'CLEARED'"
        side_effects:
          - "downtime_hours := (cleared_at - raised_at) / 3600"
          - "lost_energy_kwh := round_half_up(downtime_hours * Turbine.expected_kwh_per_hour, 2)"
          - "cascade hop A: Turbine.cumulative_lost_energy_kwh += lost_energy_kwh, and when contractual_exclusion_pinned is false Turbine.counted_downtime_hours_period += downtime_hours"
          - "cascade hop B: because the turbine's counted downtime changed, every ACTIVE ServiceAgreement on the turbine's farm recomputes projected_shortfall_pct and at_risk_flag"
          - "cascade hop C: every WorkOrder on that farm's turbines in state SUBMITTED, REVISION_REQUESTED or SCHEDULED recomputes priority_score in full at the current logical clock, so an at_risk_flag flip is observable on orders this request never named"
      - from: DISPATCHED
        to: DISPATCH_REQUIRED
        trigger: "cascade from POST /wind-ops/work-orders/{id}/cancel on the FAULT_DISPATCH order that dispatched it"
        actor: system
        preconditions:
          - "triage_state == 'DISPATCHED'"
          - "the cancelled work order's fault_event_id is this event"
        side_effects:
          - "the event becomes eligible to back a fresh FAULT_DISPATCH work order; cleared_at, downtime_hours and lost_energy_kwh stay null and zero"

  - entity: ComponentReplacement
    initial_state: PLANNED
    terminal_states: [CLOSED, CANCELLED]
    note: |
      Branching fork-join. PLANNED forks into CRANE_RESERVED or UPTOWER_READY; the two branches
      rejoin at EXECUTED with DIVERGENT side-effect sets, then CLOSED by the parent work order's
      completion.
    transitions:
      - from: PLANNED
        to: CRANE_RESERVED
        trigger: "POST /wind-ops/component-replacements/{id}/reserve-crane"
        actor: MaintenancePlanner
        preconditions:
          - "state == 'PLANNED'"
          - "the CraneMobilization is in state REQUESTED or MOBILIZED"
          - "CraneMobilization.wind_farm_id == the replacement's Turbine.wind_farm_id"
          - "crane_class == 'CRAWLER_600T' when component_type is GEARBOX or BLADE"
          - "the mobilization window's workable-day count, i.e. the whole UTC dates in [mobilization_start_utc, demobilization_end_utc) that are NOT standby dates, is >= the resulting lift_days, else ERR_LIFT_WIND_LIMIT_EXCEEDED; a date is a standby date only when a CONFIRMED WeatherWindow of the same farm covers it and forecasts forecast_wind_speed_ms above max_lift_wind_speed_ms"
        side_effects:
          - "crane_mobilization_id and execution_path := 'CRANE_LIFT'"
          - "CraneMobilization moves REQUESTED -> MOBILIZED when it was REQUESTED"
          - "CraneMobilization.reserved_replacement_count += 1, then lift_days, standby_days, billable_days, subtotal_cents, volume_credit_cents and total_crane_cost_cents are recomputed"
          - "allocated_crane_cost_cents is redistributed across every reserved replacement of that crane"
      - from: PLANNED
        to: UPTOWER_READY
        trigger: "POST /wind-ops/component-replacements/{id}/plan-uptower"
        actor: MaintenancePlanner
        preconditions:
          - "state == 'PLANNED'"
          - "component_type == 'GENERATOR' and SparePart.uptower_repairable is true"
        side_effects:
          - "execution_path := 'UPTOWER_REPAIR'; crane_mobilization_id stays null"
          - "estimated_lift_hours := 0 and allocated_crane_cost_cents := 0"
          - "uptower_labor_hours is stored and added to the parent WorkOrder.estimated_hours"
      - from: CRANE_RESERVED
        to: EXECUTED
        trigger: "POST /wind-ops/component-replacements/{id}/execute"
        actor: CrewLead | ReliabilityEngineer
        preconditions:
          - "state == 'CRANE_RESERVED'"
          - "the parent MAJOR_COMPONENT WorkOrder is IN_PROGRESS, else ERR_WORK_ORDER_INVALID_STATE"
        side_effects:
          - "SparePart.quantity_reserved -= 1 and SparePart.quantity_consumed += 1"
          - "branch-specific: WindFarm.maintenance_spend_cents += allocated_crane_cost_cents and WindFarm.opex_accrued_cents += the same amount"
      - from: UPTOWER_READY
        to: EXECUTED
        trigger: "POST /wind-ops/component-replacements/{id}/execute"
        actor: CrewLead | ReliabilityEngineer
        preconditions:
          - "state == 'UPTOWER_READY'"
          - "the parent MAJOR_COMPONENT WorkOrder is IN_PROGRESS, else ERR_WORK_ORDER_INVALID_STATE"
        side_effects:
          - "SparePart.quantity_reserved -= 1 and SparePart.quantity_consumed += 1"
          - "branch-specific: NO crane cost is charged and allocated_crane_cost_cents stays 0; instead WindFarm.maintenance_spend_cents and WindFarm.opex_accrued_cents each rise by round_half_up(uptower_labor_hours * UPTOWER_LABOR_RATE_CENTS_PER_HOUR)"
      - from: EXECUTED
        to: CLOSED
        trigger: "cascade from POST /wind-ops/work-orders/{id}/complete on the parent MAJOR_COMPONENT order"
        actor: system
        preconditions:
          - "state == 'EXECUTED'"
        side_effects:
          - "no stock movement; the unit is already consumed"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /wind-ops/component-replacements/{id}/cancel"
        actor: MaintenancePlanner
        preconditions:
          - "state is in {PLANNED, CRANE_RESERVED, UPTOWER_READY}"
        side_effects:
          - "cascade hop 1: SparePart.quantity_reserved -= 1 and SparePart.quantity_on_hand += 1"
          - "cascade hop 2: because quantity_on_hand changed, SparePart.status and procurement_flag are recomputed"
          - "cascade hop 3: when the cancelled replacement held the crane's last reservation, CraneMobilization.reserved_replacement_count drops to 0, the crane moves MOBILIZED -> CANCELLED, billable_days := 0 and total_crane_cost_cents := round_half_up(mobilization_fee_cents * 40 / 100), which is charged to WindFarm.maintenance_spend_cents and WindFarm.opex_accrued_cents"
          - "cascade hop 4: whenever the parent WorkOrder is in state SCHEDULED it moves SCHEDULED -> REVISION_REQUESTED with revision_round += 1, crew_id := null, weather_window_id := null, and the WeatherWindow's active_work_order_count -= 1 with its state unchanged; when the parent is in any other state hop 4 is a no-op. This hop does NOT depend on whether the crane itself cancelled"
      - from: CRANE_RESERVED
        to: CANCELLED
        trigger: "POST /wind-ops/component-replacements/{id}/cancel"
        actor: MaintenancePlanner
        preconditions:
          - "state == 'CRANE_RESERVED'"
        side_effects:
          - "identical four-hop cascade as PLANNED -> CANCELLED"

  - entity: CraneMobilization
    initial_state: REQUESTED
    terminal_states: [DEMOBILIZED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: MOBILIZED
        trigger: "cascade from POST /wind-ops/component-replacements/{id}/reserve-crane"
        actor: system
        preconditions:
          - "state == 'REQUESTED'"
        side_effects:
          - "reserved_replacement_count, lift_days, standby_days, billable_days and cost fields are recomputed"
      - from: MOBILIZED
        to: DEMOBILIZED
        trigger: "POST /wind-ops/crane-mobilizations/{id}/demobilize"
        actor: MaintenancePlanner
        preconditions:
          - "state == 'MOBILIZED'"
          - "every ComponentReplacement holding this crane is in state EXECUTED, CLOSED or CANCELLED"
        side_effects:
          - "WindFarm.maintenance_spend_cents and WindFarm.opex_accrued_cents are unchanged; the crane cost was charged at execute time"
      - from: MOBILIZED
        to: CANCELLED
        trigger: "cascade from POST /wind-ops/component-replacements/{id}/cancel when the last reservation is released"
        actor: system
        preconditions:
          - "state == 'MOBILIZED'"
          - "reserved_replacement_count reaches 0"
        side_effects:
          - "billable_days := 0 and total_crane_cost_cents := round_half_up(mobilization_fee_cents * 40 / 100)"
          - "the cancellation fee is charged to WindFarm.maintenance_spend_cents and WindFarm.opex_accrued_cents"

  - entity: WeatherWindow
    initial_state: FORECAST
    terminal_states: [EXPIRED]
    transitions:
      - from: FORECAST
        to: CONFIRMED
        trigger: "POST /wind-ops/weather-windows/{id}/confirm"
        actor: MaintenancePlanner
        preconditions:
          - "state == 'FORECAST'"
          - "end_utc > the logical clock now"
        side_effects:
          - "the window becomes eligible to back a work-order schedule and to count toward crane workable/standby days"
      - from: CONFIRMED
        to: CONSUMED
        trigger: "cascade from the FIRST POST /wind-ops/work-orders/{id}/start naming this window"
        actor: system
        preconditions:
          - "state == 'CONFIRMED'"
        side_effects:
          - "the window stops backing NEW schedules and stops counting toward crane standby days; active_work_order_count is unchanged by this transition"
      - from: CONSUMED
        to: EXPIRED
        trigger: "cascade from POST /wind-ops/work-orders/{id}/complete or /cancel when active_work_order_count reaches 0"
        actor: system
        preconditions:
          - "state == 'CONSUMED'"
          - "active_work_order_count == 0 after the decrement"
        side_effects:
          - "the window can no longer be scheduled against and stops counting toward crane workable days"
      - from: CONFIRMED
        to: EXPIRED
        trigger: "POST /wind-ops/_clock/set_current_utc advancing the clock to or past end_utc"
        actor: system
        preconditions:
          - "state is in {FORECAST, CONFIRMED}"
          - "the new logical clock value is >= end_utc"
        side_effects:
          - "every FORECAST or CONFIRMED window whose end_utc <= the new clock value moves to EXPIRED"

  - entity: CurtailmentOrder
    initial_state: PENDING
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /wind-ops/curtailment-orders/{id}/activate"
        actor: ControlRoomOperator
        preconditions:
          - "state == 'PENDING'"
          - "Turbine.availability_state != 'DECOMMISSIONED'"
          - "the turbine's ACTIVE curtailment count is < 2"
        side_effects:
          - "Turbine.active_curtailment_count += 1 and Turbine.effective_power_limit_kw := min over ACTIVE orders of power_limit_kw"
          - "Turbine.curtailment_state := 'FORCED_STOP' when the minimum is 0, otherwise 'CURTAILED'"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /wind-ops/curtailment-orders/{id}/release"
        actor: ControlRoomOperator
        preconditions:
          - "state == 'ACTIVE'"
        side_effects:
          - "curtailed_hours := (released_at - start_utc) / 3600, measured from the ACTUAL release instant and NOT from the planned end_utc, so an early release accrues less than the order asked for"
          - "lost_energy_kwh := round_half_up(curtailed_hours * deemed_kwh_per_hour, 2)"
          - "Turbine.active_curtailment_count -= 1; effective_power_limit_kw := min power_limit_kw over the remaining ACTIVE orders, or TurbineModel.rated_power_kw when none remain"
          - "Turbine.curtailment_state := UNCONSTRAINED when no ACTIVE order remains, FORCED_STOP when any remaining ACTIVE order has power_limit_kw 0, otherwise CURTAILED"
          - "when compensable is false, Turbine.counted_downtime_hours_period += curtailed_hours, which then recomputes every ACTIVE ServiceAgreement's projected_shortfall_pct and at_risk_flag"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /wind-ops/curtailment-orders/{id}/cancel-pending is NOT offered; cancellation happens by cascade from POST /wind-ops/turbines/{id}/decommission"
        actor: system
        preconditions:
          - "state == 'PENDING'"
        side_effects:
          - "the order can never be activated afterwards"

  - entity: ServiceAgreement
    initial_state: ACTIVE
    terminal_states: [SETTLED]
    transitions:
      - from: ACTIVE
        to: IN_SETTLEMENT
        trigger: "POST /wind-ops/service-agreements/{id}/settle"
        actor: CommercialManager
        preconditions:
          - "state == 'ACTIVE'"
          - "the logical clock is >= period_end_utc"
          - "at least one Turbine on the farm has availability_state != 'DECOMMISSIONED'"
        side_effects:
          - "time_based_availability_pct and energy_based_availability_pct are BOTH computed from the same period data"
          - "assessed_lda_cents is computed from the availability_basis figure and capped at lda_cap_cents"
      - from: IN_SETTLEMENT
        to: SETTLED
        trigger: "POST /wind-ops/service-agreements/{id}/finalize"
        actor: CommercialManager
        preconditions:
          - "state == 'IN_SETTLEMENT'"
        side_effects:
          - "the computed availability figures and assessed_lda_cents become immutable"
          - "projected_shortfall_pct and at_risk_flag stop being recomputed by turbine cascades"

  - entity: LandownerSettlement
    initial_state: DRAFT
    terminal_states: [VOID]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /wind-ops/landowner-settlements/{id}/approve"
        actor: CommercialManager
        preconditions:
          - "state == 'DRAFT'"
          - "no ServiceAgreement on the same farm is in state IN_SETTLEMENT"
        side_effects:
          - "WindFarm.landowner_payable_cents += payment_cents"
          - "WindFarm.road_maintenance_reserve_cents += road_levy_cents"
          - "WindFarm.community_fund_balance_cents += community_levy_cents"
          - "WindFarm.opex_accrued_cents += payment_cents + road_levy_cents + community_levy_cents, preserving the conserved-ledger identity"
      - from: APPROVED
        to: VOID
        trigger: "POST /wind-ops/landowner-settlements/{id}/void"
        actor: CommercialManager
        preconditions:
          - "state == 'APPROVED'"
        side_effects:
          - "compensating action: all four WindFarm ledger fields are decremented by exactly the amounts the approve credited"
          - "void_reason is stored"

  - entity: BladeDamage
    initial_state: OPEN
    terminal_states: [REPAIRED, WAIVED]
    transitions:
      - from: OPEN
        to: PRIORITIZED
        trigger: "POST /wind-ops/blade-damages/{id}/prioritize"
        actor: ReliabilityEngineer | CrewLead
        preconditions:
          - "state == 'OPEN'"
          - "X-User-ID != recorded_by_user_id (segregation of duties)"
        side_effects:
          - "the finding becomes eligible to back a BLADE_REPAIR work order"
      - from: PRIORITIZED
        to: REPAIR_SCHEDULED
        trigger: "cascade from POST /wind-ops/work-orders/{id}/schedule on the BLADE_REPAIR order that references it"
        actor: system
        preconditions:
          - "state == 'PRIORITIZED'"
        side_effects:
          - "no further BLADE_REPAIR work order may reference this finding"
      - from: REPAIR_SCHEDULED
        to: REPAIRED
        trigger: "cascade from POST /wind-ops/work-orders/{id}/complete on the BLADE_REPAIR order"
        actor: system
        preconditions:
          - "state == 'REPAIR_SCHEDULED'"
        side_effects:
          - "terminal; the finding is closed out"
      - from: REPAIR_SCHEDULED
        to: PRIORITIZED
        trigger: "cascade from POST /wind-ops/work-orders/{id}/cancel or POST /wind-ops/work-orders/{id}/request-revision on the BLADE_REPAIR order that reserved it"
        actor: system
        preconditions:
          - "state == 'REPAIR_SCHEDULED'"
          - "the cancelled or revised work order's blade_damage_id is this finding"
        side_effects:
          - "the finding becomes eligible to back a fresh BLADE_REPAIR work order; severity_score, repair_priority_band and repair_due_days are unchanged"
      - from: OPEN
        to: WAIVED
        trigger: "POST /wind-ops/blade-damages/{id}/waive"
        actor: ReliabilityEngineer
        preconditions:
          - "state == 'OPEN'"
          - "repair_priority_band is in {MEDIUM, LOW}"
        side_effects:
          - "waiver_rationale is stored; terminal"

concurrency_rules:
  - rule_id: landowner-settlement-create-stale-farm
    parent_entity: WindFarm
    write_endpoint: "POST /wind-ops/farms/{id}/landowner-settlements"
    occ_field: "expected_wind_farm_version"
    description: |
      Creating a LandownerSettlement against a WindFarm whose version has advanced since the
      client last read it is rejected. A new settlement legitimately supersedes an earlier DRAFT
      settlement for the same parcel and period, and it also consumes headroom under
      landowner_budget_cap_cents, so a writer working from a stale view of the farm's ledger
      would silently overcommit the cap. The stale-version check makes that view mismatch
      explicit instead.
    error_id: ERR_STALE_FARM_VERSION
    http_status: 412
  - rule_id: curtailment-order-create-stale-turbine
    parent_entity: Turbine
    write_endpoint: "POST /wind-ops/turbines/{id}/curtailment-orders"
    occ_field: "expected_turbine_version"
    description: |
      Creating a CurtailmentOrder against a Turbine whose version has advanced since the client
      last read it is rejected. A newer grid or environmental instruction legitimately supersedes
      an earlier PENDING order for the same reason, and the curtailment stack limit is evaluated
      against the turbine's live ACTIVE count, so a writer holding a stale turbine view would
      stack an order on top of state it never observed.
    error_id: ERR_STALE_TURBINE_VERSION
    http_status: 412

calculations:
  - name: availability_and_liquidated_damages
    trigger: "POST /wind-ops/service-agreements/{id}/settle (ACTIVE -> IN_SETTLEMENT)"
    algorithm: aggregation + interval_merge_free_summation + threshold
    formula: |
      # helper, half-open on BOTH intervals
      overlap_hours(a_start, a_end, b_start, b_end) =
          max(0, min(a_end, b_end) - max(a_start, b_start)) / 3600

      turbine_set = every Turbine T with
          T.wind_farm_id == agreement.wind_farm_id
          AND T.availability_state != 'DECOMMISSIONED'

      counted_downtime_hours =
          SUM over FaultEvent F with F.turbine_id in turbine_set
                                AND F.triage_state == 'CLOSED'
                                AND F.contractual_exclusion_pinned == false
              of overlap_hours(F.raised_at, F.cleared_at,
                               agreement.period_start_utc, agreement.period_end_utc)
        + SUM over CurtailmentOrder C with C.turbine_id in turbine_set
                                     AND C.state == 'RELEASED'
                                     AND C.compensable == false
              of overlap_hours(C.start_utc, C.end_utc,
                               agreement.period_start_utc, agreement.period_end_utc)
      # NO union or merge is performed. An interval that is covered by a counted fault event
      # and by a counted curtailment order accrues downtime under BOTH sources. Summation is
      # pure addition, so the result is order-independent and needs no tie-break.

      period_hours      = (agreement.period_end_utc - agreement.period_start_utc) / 3600
      denominator_hours = period_hours * count(turbine_set)
      # denominator_hours == 0 is rejected with ERR_NO_TURBINES_IN_SERVICE before any division

      time_based_availability_pct =
          round_half_up(100 * (1 - counted_downtime_hours / denominator_hours), 4)

      actual_sum    = SUM over turbine_set of T.period_actual_energy_kwh
      potential_sum = SUM over turbine_set of T.period_potential_energy_kwh
      energy_based_availability_pct =
          potential_sum == 0 ? 100.0000
                             : round_half_up(100 * actual_sum / potential_sum, 4)

      basis_pct = agreement.availability_basis == 'TIME_BASED'
                    ? time_based_availability_pct
                    : energy_based_availability_pct
      # shortfall is taken from the ALREADY 4-dp-rounded basis figure, never from the raw quotient
      shortfall_pct = round_half_up(max(0, agreement.guaranteed_availability_pct - basis_pct), 4)
      assessed_lda_cents = min(agreement.lda_cap_cents,
                               round_half_up(shortfall_pct * agreement.lda_rate_cents_per_pct_point))
    input_set: |
      Turbines on the agreement's farm whose availability_state != 'DECOMMISSIONED'. FaultEvent
      rows are included only in triage_state CLOSED with contractual_exclusion_pinned false;
      CurtailmentOrder rows only in state RELEASED with compensable false. Both interval sets are
      clipped to the half-open measurement period. Energy figures are read from the live turbine
      counters period_actual_energy_kwh and period_potential_energy_kwh.
    constants:
      PCT_DECIMALS: 4
      ROUNDING: round_half_up
    precision: "availability percentages 4 decimal places round_half_up; cents are integers, round_half_up"
    variants:
      - name: TIME_BASED_SETTLEMENT
        when: "agreement.availability_basis == 'TIME_BASED'"
        difference: "assessed_lda_cents is driven by time_based_availability_pct, which ignores telemetry entirely and depends only on counted downtime hours and the turbine count"
      - name: ENERGY_BASED_SETTLEMENT
        when: "agreement.availability_basis == 'ENERGY_BASED'"
        difference: "assessed_lda_cents is driven by energy_based_availability_pct, which ignores downtime intervals entirely and depends only on metered vs potential energy; for identical period data the two figures differ and so do the resulting liquidated damages"
      - name: LIVE_PROJECTION
        when: "any turbine cascade changes counted_downtime_hours_period or the telemetry counters while the agreement is ACTIVE"
        difference: "projected_shortfall_pct uses the SAME shortfall formula but reads counted downtime from SUM over turbine_set of Turbine.counted_downtime_hours_period (the un-clipped live counter) instead of re-clipping interval rows, and writes only projected_shortfall_pct and at_risk_flag — never assessed_lda_cents"

  - name: landowner_royalty_settlement
    trigger: "POST /wind-ops/farms/{id}/landowner-settlements (settlement creation)"
    algorithm: threshold + waterfall_allocation
    formula: |
      turbine_set = every Turbine T with T.wind_farm_id == farm.id
                                    AND T.availability_state != 'DECOMMISSIONED'

      metered_kwh = SUM over turbine_set of T.period_actual_energy_kwh

      deemed_kwh  = settlement.royalty_basis == 'METERED_ONLY'
        ? 0
        : SUM over CurtailmentOrder C with C.turbine_id in turbine_set
                                     AND C.state == 'RELEASED'
                                     AND C.compensable == true
              of overlap_hours(C.start_utc, C.end_utc,
                               settlement.period_start_utc, settlement.period_end_utc)
                 * C.deemed_kwh_per_hour

      royalty_base_kwh = metered_kwh + deemed_kwh
      royalty_cents = round_half_up(royalty_base_kwh
                                    * settlement.energy_price_cents_per_kwh
                                    * settlement.royalty_pct / 100)
      payment_cents = max(settlement.minimum_payment_cents, royalty_cents)

      road_levy_cents      = round_half_up(payment_cents * farm.road_levy_pct / 100)
      community_levy_cents = round_half_up(payment_cents * farm.community_levy_pct / 100)
    input_set: |
      Turbines on the farm whose availability_state != 'DECOMMISSIONED' supply metered energy.
      Deemed energy comes only from CurtailmentOrder rows in state RELEASED with compensable
      true, clipped to the half-open settlement period. DRAFT and VOID settlements contribute
      nothing to the farm ledger; only APPROVED ones do.
    constants:
      ROUNDING: round_half_up
    precision: "all money is integer cents, round_half_up; energy figures keep full precision until the single cents rounding"
    variants:
      - name: METERED_ONLY
        when: "settlement.royalty_basis == 'METERED_ONLY'"
        difference: "deemed_kwh is forced to 0, so compensable grid curtailment earns the landowner nothing even though the operator was compensated for it"
      - name: DEEMED_INCLUSIVE
        when: "settlement.royalty_basis == 'DEEMED_INCLUSIVE'"
        difference: "deemed_kwh from compensable curtailment is added to the royalty base, producing a strictly larger royalty_cents than METERED_ONLY for identical farm telemetry"

  - name: work_order_priority_score
    trigger: "POST /wind-ops/work-orders/{id}/submit, and cascade hop C of the FaultEvent CLEARED -> CLOSED transition and of the CurtailmentOrder ACTIVE -> RELEASED transition"
    algorithm: weighted_scoring
    formula: |
      severity_weight =
          work_type == 'MAJOR_COMPONENT'  -> 1.00
        | work_type == 'FAULT_DISPATCH'   -> { LOCKOUT: 0.90, RESETTABLE: 0.60, ADVISORY: 0.20 }
                                             keyed on FaultEvent.severity_class_pinned
        | work_type == 'BLADE_REPAIR'     -> BladeDamage.damage_category / 5
        | work_type == 'SCHEDULED_SERVICE'-> 0.30

      projected_lost_energy_kwh = estimated_hours * Turbine.expected_kwh_per_hour
      energy_term_factor        = min(1.0, projected_lost_energy_kwh / ENERGY_NORMALIZER_KWH)

      lda_term_factor = 1.0 when SOME ServiceAgreement A exists with
                            A.wind_farm_id == Turbine.wind_farm_id
                            AND A.state == 'ACTIVE'
                            AND A.at_risk_flag == true
                        else 0.0

      days_open  = floor((clock_now - work_order.created_at) / 86400)
      age_factor = min(1.0, days_open / AGE_NORMALIZER_DAYS)

      # The four weighted terms are summed at FULL precision and the SUM is rounded ONCE.
      # This is deliberately the opposite order from blade_damage_severity_score.
      priority_score = round_half_up(
            W_SEVERITY * severity_weight
          + W_ENERGY   * energy_term_factor
          + W_LDA      * lda_term_factor
          + W_AGE      * age_factor, 2)
    input_set: |
      A single WorkOrder plus its Turbine, its linked FaultEvent or BladeDamage when the
      work_type demands one, and the farm's ServiceAgreement rows in state ACTIVE. Agreements in
      IN_SETTLEMENT or SETTLED never contribute the LDA term.
    constants:
      W_SEVERITY: 40
      W_ENERGY: 30
      W_LDA: 20
      W_AGE: 10
      ENERGY_NORMALIZER_KWH: 5000
      AGE_NORMALIZER_DAYS: 30
      MAX_REVISION_ROUNDS: 3
    precision: "2 decimal places, round_half_up, applied once to the sum of the four weighted terms"

  - name: blade_damage_severity_score
    trigger: "POST /wind-ops/turbines/{id}/blade-damages (damage classification)"
    algorithm: weighted_scoring + threshold
    formula: |
      category_factor = damage_category / 5
      type_factor     = { LEADING_EDGE_EROSION: 0.30, CRACK_TRANSVERSE: 1.00,
                          LIGHTNING_STRIKE: 0.70, DELAMINATION: 0.85 }[damage_type]
      length_factor   = min(1.0, damage_length_mm / LENGTH_NORMALIZER_MM)
      exposure_factor = min(1.0, exposed_area_cm2 / AREA_NORMALIZER_CM2)

      # ROUNDING ORDER IS PINNED: each weighted factor is rounded to 2 decimals FIRST,
      # then the four rounded terms are summed, then the sum is rounded to 2 decimals.
      # "sum at full precision then round once" is the WRONG order and yields different cents.
      term_category = round_half_up(W_CATEGORY * category_factor, 2)
      term_type     = round_half_up(W_TYPE     * type_factor,     2)
      term_length   = round_half_up(W_LENGTH   * length_factor,   2)
      term_exposure = round_half_up(W_EXPOSURE * exposure_factor, 2)
      severity_score = round_half_up(term_category + term_type + term_length + term_exposure, 2)

      repair_priority_band = severity_score >= 80 -> 'CRITICAL'
                           | severity_score >= 60 -> 'HIGH'
                           | severity_score >= 40 -> 'MEDIUM'
                           | otherwise            -> 'LOW'
      repair_due_days = { CRITICAL: 14, HIGH: 45, MEDIUM: 120, LOW: 365 }[repair_priority_band]
    input_set: "the four classification inputs of the single BladeDamage row being recorded; no cross-entity data participates"
    constants:
      W_CATEGORY: 30
      W_TYPE: 30
      W_LENGTH: 20
      W_EXPOSURE: 20
      LENGTH_NORMALIZER_MM: 3000
      AREA_NORMALIZER_CM2: 3000
      BAND_CRITICAL_MIN: 80
      BAND_HIGH_MIN: 60
      BAND_MEDIUM_MIN: 40
    precision: "2 decimal places, round_half_up, applied per weighted factor AND again to their sum"

  - name: crane_cost_and_allocation
    trigger: "POST /wind-ops/component-replacements/{id}/reserve-crane, and the cascade that cancels a replacement holding a crane"
    algorithm: tiered_pricing + waterfall_allocation
    formula: |
      reserved = every ComponentReplacement R with R.crane_mobilization_id == crane.id
                 AND R.state in {CRANE_RESERVED, EXECUTED, CLOSED}

      # STEP 1
      lift_days = ceil(SUM over reserved of R.estimated_lift_hours / CRANE_SHIFT_HOURS)
      # STEP 2 — one whole UTC day per calendar date D in [mobilization_start_utc,
      # demobilization_end_utc). D is a STANDBY day when SOME WeatherWindow W exists with
      # W.wind_farm_id == crane.wind_farm_id, W.state == 'CONFIRMED',
      # [D 00:00Z, D+1 00:00Z) contained in [W.start_utc, W.end_utc), and
      # W.forecast_wind_speed_ms > crane.max_lift_wind_speed_ms.
      # Every other date, including a date with no covering CONFIRMED window, is WORKABLE.
      standby_days  = count of standby dates
      workable_days = count of dates in the window - standby_days
      # GATE: lift_days must not exceed workable_days, else ERR_LIFT_WIND_LIMIT_EXCEEDED.
      # Equality is permitted; this is the boundary the reservation gate is pinned on.
      # STEP 3
      billable_days = lift_days + standby_days
      # STEP 4
      subtotal_cents = mobilization_fee_cents + day_rate_cents * billable_days
      # STEP 5 — the tier is keyed on subtotal_cents from STEP 4 and NEVER on
      # total_crane_cost_cents from STEP 7. Keying the tier on the post-credit total is the
      # circular reading and yields a different credit.
      volume_credit_pct = subtotal_cents <  TIER_1_MIN_CENTS -> 0
                        | subtotal_cents <  TIER_2_MIN_CENTS -> 3
                        | otherwise                          -> 6
      # STEP 6
      volume_credit_cents = round_half_up(subtotal_cents * volume_credit_pct / 100)
      # STEP 7
      total_crane_cost_cents = subtotal_cents - volume_credit_cents
      # STEP 8 — waterfall over the reserved replacements ordered by created_at ASC
      lift_hours_total = SUM over reserved of R.estimated_lift_hours
      for each R in reserved:
          share(R) = lift_hours_total == 0
                       ? floor(total_crane_cost_cents / count(reserved))
                       : floor(total_crane_cost_cents * R.estimated_lift_hours / lift_hours_total)
      remainder = total_crane_cost_cents - SUM of share(R)
      # the entire remainder goes to the reserved replacement with the EARLIEST created_at
      allocated_crane_cost_cents(R) = share(R) + (R is the earliest by created_at ? remainder : 0)
      # cancellation path
      cancelled_total_crane_cost_cents = round_half_up(mobilization_fee_cents
                                                       * CRANE_CANCELLATION_PCT / 100)
    input_set: "the CraneMobilization plus its reserved ComponentReplacement rows in state CRANE_RESERVED, EXECUTED or CLOSED, plus the farm's CONFIRMED WeatherWindow rows covering the mobilization interval"
    constants:
      CRANE_SHIFT_HOURS: 10
      TIER_1_MIN_CENTS: 5000000
      TIER_2_MIN_CENTS: 15000000
      TIER_1_CREDIT_PCT: 3
      TIER_2_CREDIT_PCT: 6
      CRANE_CANCELLATION_PCT: 40
      CRANE_BUFFER_HOURS: 48
      UPTOWER_LABOR_RATE_CENTS_PER_HOUR: 950000
    precision: "integer cents throughout; the tier credit is round_half_up, per-replacement shares use floor with the remainder assigned by created_at ASC"

  - name: scheduled_service_due
    trigger: "POST /wind-ops/turbines/{id}/scada-sync (recompute) and POST /wind-ops/work-orders with work_type=SCHEDULED_SERVICE (gate)"
    algorithm: threshold
    formula: |
      service_due_operating_hours = Turbine.last_service_operating_hours
                                  + TurbineModel.service_interval_hours
      service_due_flag            = Turbine.operating_hours >= service_due_operating_hours
      service_interval_breached   = Turbine.operating_hours
                                  >  service_due_operating_hours
                                   + TurbineModel.service_interval_tolerance_hours
      earliest_creation_hours     = service_due_operating_hours - PRE_SERVICE_WINDOW_HOURS
      # gate is inclusive: operating_hours exactly equal to earliest_creation_hours is allowed
      may_create_scheduled_service = Turbine.operating_hours >= earliest_creation_hours
    input_set: "a single Turbine and its TurbineModel; no other rows participate"
    constants:
      PRE_SERVICE_WINDOW_HOURS: 200
    precision: "operating hours carry one decimal place; comparisons are exact, >= for the due and creation gates, strict > for the tolerance breach"

  - name: remote_reset_eligibility
    trigger: "POST /wind-ops/fault-events/{id}/remote-reset"
    algorithm: threshold
    formula: |
      # rolling window bookkeeping happens BEFORE the quota comparison
      if Turbine.reset_window_start_utc is null
         OR clock_now >= Turbine.reset_window_start_utc + RESET_WINDOW_HOURS * 3600:
             Turbine.reset_window_start_utc := clock_now
             Turbine.remote_reset_count_24h := 0

      eligible = FaultEvent.severity_class_pinned == 'RESETTABLE'
             AND FaultEvent.reset_attempt_count < FaultEvent.max_remote_resets_pinned
             AND Turbine.curtailment_state != 'FORCED_STOP'
      # reset_attempt_count exactly equal to max_remote_resets_pinned is NOT eligible
    input_set: "the FaultEvent's pinned rule snapshot plus its Turbine's reset window counters and curtailment dimension"
    constants:
      RESET_WINDOW_HOURS: 24
    precision: "integer counters; the quota comparison is strict <"

  - name: crew_daily_committed_hours
    trigger: "POST /wind-ops/work-orders/{id}/schedule"
    algorithm: aggregation
    formula: |
      target_date = the UTC calendar date of the proposed planned_start_utc
      committed   = SUM over WorkOrder W with W.crew_id == the proposed crew
                                        AND W.state in {SCHEDULED, IN_PROGRESS}
                                        AND the UTC calendar date of W.planned_start_utc
                                            == target_date
                        of W.estimated_hours
      # strict > is the rejection condition; landing exactly on capacity is permitted
      capacity_exceeded = (committed + this_order.estimated_hours) > Crew.daily_hours_capacity

      # crew interval occupancy, half-open, adjacency ALLOWED
      overlaps = SOME WorkOrder W with W.crew_id == the proposed crew
                                 AND W.state in {SCHEDULED, IN_PROGRESS}
                                 AND W.planned_start_utc <  proposed_planned_end_utc
                                 AND W.planned_end_utc   >  proposed_planned_start_utc
    input_set: "WorkOrder rows assigned to the candidate crew in state SCHEDULED or IN_PROGRESS only; DRAFT, SUBMITTED, REVISION_REQUESTED, COMPLETED and CANCELLED orders never consume capacity or occupancy"
    constants:
      ROUNDING: none
    precision: "hours carry one decimal place; capacity uses strict >, occupancy uses half-open interval arithmetic with adjacency allowed"

  - name: crane_slot_buffer_conflict
    trigger: "POST /wind-ops/crane-mobilizations"
    algorithm: interval_merge
    formula: |
      # a wind farm has exactly one crane slot, and every mobilization reserves that slot plus a
      # symmetric CRANE_BUFFER_HOURS pad on BOTH sides for haul-road access and assembly
      buf = CRANE_BUFFER_HOURS * 3600
      conflict = SOME CraneMobilization X with
                     X.wind_farm_id == new.wind_farm_id
                     AND X.state in {REQUESTED, MOBILIZED}
                     AND (new.mobilization_start_utc - buf) <  (X.demobilization_end_utc + buf)
                     AND (new.demobilization_end_utc + buf) >  (X.mobilization_start_utc - buf)
      # unlike crew occupancy, exact adjacency CONFLICTS here: a mobilization starting the
      # instant another ends is 96h inside the combined pad
    input_set: "CraneMobilization rows on the same farm in state REQUESTED or MOBILIZED; DEMOBILIZED and CANCELLED mobilizations release the slot"
    constants:
      CRANE_BUFFER_HOURS: 48
    precision: "exact instant arithmetic; the buffered comparison uses strict < and > on padded bounds"

validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty; X-User-Role is one of the six roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 20
    category: auth
    check: "the acting X-User-Role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 22
    category: auth
    check: "segregation of duties — on POST /wind-ops/work-orders/{id}/complete the acting X-User-ID differs from WorkOrder.submitted_by_user_id; on POST /wind-ops/blade-damages/{id}/prioritize the acting X-User-ID differs from BladeDamage.recorded_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /wind-ops/work-orders/{id}/complete, POST /wind-ops/blade-damages/{id}/prioritize"
  - priority: 24
    category: auth
    check: "when X-User-Role is CrewLead, the acting X-User-ID equals the target WorkOrder.crew_id (CrewLead identity is entity_backed:Crew)"
    error_id: ERR_CREW_NOT_ASSIGNED
    http_status: 403
    applies_to: "POST /wind-ops/work-orders/{id}/start, POST /wind-ops/work-orders/{id}/complete"
  - priority: 30
    category: existence
    check: "request body parses as JSON; every required input field is present and non-null; every enum field carries a declared member; every numeric field is within its declared range; every timestamp is a valid ISO-8601 instant with a Z offset; end bound is strictly after start bound on every interval field pair"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 32
    category: existence
    check: "path identifiers resolve left-to-right: /farms/{id} -> ERR_FARM_NOT_FOUND, /turbines/{id} -> ERR_TURBINE_NOT_FOUND, /work-orders/{id} -> ERR_WORK_ORDER_NOT_FOUND, /fault-events/{id} -> ERR_FAULT_EVENT_NOT_FOUND, every other single-resource path segment -> ERR_PATH_RESOURCE_NOT_FOUND"
    error_id: ERR_PATH_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path identifier"
  - priority: 34
    category: existence
    check: "every foreign-key identifier supplied in a request body resolves to an existing row (turbine_id, turbine_model_id, fault_code_rule_id, crew_id, weather_window_id, spare_part_id, crane_mobilization_id, blade_damage_id, fault_event_id, parent_work_order_id)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints accepting a foreign-key field in the body"
  - priority: 38
    category: state
    check: "expected_wind_farm_version equals the current WindFarm.version"
    error_id: ERR_STALE_FARM_VERSION
    http_status: 412
    applies_to: "POST /wind-ops/farms/{id}/landowner-settlements"
  - priority: 39
    category: state
    check: "expected_turbine_version equals the current Turbine.version"
    error_id: ERR_STALE_TURBINE_VERSION
    http_status: 412
    applies_to: "POST /wind-ops/turbines/{id}/curtailment-orders"
  - priority: 40
    category: state
    check: "the target WorkOrder is in a state from which the requested transition is declared in §1.2"
    error_id: ERR_WORK_ORDER_INVALID_STATE
    http_status: 409
    applies_to: "POST /wind-ops/work-orders/{id}/submit, .../request-revision, .../schedule, .../start, .../complete, .../cancel"
  - priority: 40
    category: state
    check: "the target FaultEvent is in a state from which the requested transition is declared in §1.2"
    error_id: ERR_FAULT_EVENT_INVALID_STATE
    http_status: 409
    applies_to: "POST /wind-ops/fault-events/{id}/triage, .../remote-reset, .../close"
  - priority: 40
    category: state
    check: "the target CraneMobilization, ComponentReplacement, WeatherWindow, CurtailmentOrder, ServiceAgreement, BladeDamage or LandownerSettlement is in a state from which the requested transition is declared in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all remaining action endpoints"
  - priority: 41
    category: state
    check: "the parent MAJOR_COMPONENT WorkOrder of the ComponentReplacement being executed is in state IN_PROGRESS"
    error_id: ERR_WORK_ORDER_INVALID_STATE
    http_status: 409
    applies_to: "POST /wind-ops/component-replacements/{id}/execute"
  - priority: 42
    category: state
    check: "the Turbine referenced by the operation has availability_state != 'DECOMMISSIONED'"
    error_id: ERR_TURBINE_DECOMMISSIONED
    http_status: 409
    applies_to: "POST /wind-ops/turbines/{id}/fault-events, POST /wind-ops/turbines/{id}/blade-damages, POST /wind-ops/turbines/{id}/curtailment-orders, POST /wind-ops/turbines/{id}/scada-sync, POST /wind-ops/work-orders"
  - priority: 43
    category: state
    check: "the ServiceAgreement is in state ACTIVE before a LandownerSettlement may be created against the same farm period; an agreement in IN_SETTLEMENT freezes the farm's period figures"
    error_id: ERR_AGREEMENT_IN_SETTLEMENT
    http_status: 409
    applies_to: "POST /wind-ops/farms/{id}/landowner-settlements, POST /wind-ops/turbines/{id}/scada-sync"
  - priority: 44
    category: state
    check: "the WeatherWindow named on a schedule request is in state CONFIRMED (FORECAST, CONSUMED and EXPIRED windows are all refused)"
    error_id: ERR_WEATHER_WINDOW_NOT_CONFIRMED
    http_status: 409
    applies_to: "POST /wind-ops/work-orders/{id}/schedule"
  - priority: 50
    category: business_safety
    check: "the mobilization window offers at least lift_days workable days. A calendar date in [mobilization_start_utc, demobilization_end_utc) is a STANDBY day when a CONFIRMED WeatherWindow of the same farm covers it and forecasts forecast_wind_speed_ms above the crane's max_lift_wind_speed_ms, and a WORKABLE day otherwise. A reservation whose recomputed lift_days exceeds the count of workable days is refused; equality is permitted."
    error_id: ERR_LIFT_WIND_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /wind-ops/component-replacements/{id}/reserve-crane"
  - priority: 52
    category: business_safety
    check: "the assigned Crew's max_work_wind_speed_ms is greater than or equal to the WeatherWindow's forecast_wind_speed_ms"
    error_id: ERR_CREW_WIND_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /wind-ops/work-orders/{id}/schedule"
  - priority: 54
    category: business_safety
    check: "the assigned Crew's certifications contain the WorkOrder's required_certification"
    error_id: ERR_CREW_CERTIFICATION_MISSING
    http_status: 422
    applies_to: "POST /wind-ops/work-orders/{id}/schedule"
  - priority: 56
    category: business_safety
    check: "the Turbine's curtailment_state is not FORCED_STOP — a force-stopped turbine (icing or wildlife protection) may not be remotely reset or have work started on it"
    error_id: ERR_TURBINE_FORCE_STOPPED
    http_status: 409
    applies_to: "POST /wind-ops/fault-events/{id}/remote-reset, POST /wind-ops/work-orders/{id}/start"
  - priority: 60
    category: business_temporal
    check: "the new LandownerSettlement's half-open period does not overlap any non-VOID settlement for the same farm and parcel_code"
    error_id: ERR_SETTLEMENT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /wind-ops/farms/{id}/landowner-settlements"
  - priority: 61
    category: business_temporal
    check: "the new WeatherWindow's half-open interval does not overlap any FORECAST or CONFIRMED window on the same farm; adjacency (new.start == existing.end) is permitted"
    error_id: ERR_WEATHER_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /wind-ops/weather-windows"
  - priority: 62
    category: business_temporal
    check: "the proposed planned interval does not overlap, half-open with adjacency permitted, any other WorkOrder assigned to the same crew in state SCHEDULED or IN_PROGRESS"
    error_id: ERR_CREW_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /wind-ops/work-orders/{id}/schedule"
  - priority: 63
    category: business_temporal
    check: "the new CraneMobilization's interval, padded by CRANE_BUFFER_HOURS on both sides, does not overlap the equally padded interval of any REQUESTED or MOBILIZED mobilization on the same farm; exact adjacency conflicts here"
    error_id: ERR_CRANE_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /wind-ops/crane-mobilizations"
  - priority: 64
    category: business_temporal
    check: "the proposed planned interval is contained inside the named WeatherWindow's half-open interval (planned_start_utc >= window.start_utc AND planned_end_utc <= window.end_utc)"
    error_id: ERR_WORK_ORDER_OUTSIDE_WINDOW
    http_status: 422
    applies_to: "POST /wind-ops/work-orders/{id}/schedule"
  - priority: 65
    category: business_constraint
    check: "activating this CurtailmentOrder would leave the turbine with more than MAX_ACTIVE_CURTAILMENTS (2) orders in state ACTIVE"
    error_id: ERR_CURTAILMENT_STACK_LIMIT
    http_status: 409
    applies_to: "POST /wind-ops/curtailment-orders/{id}/activate"
  - priority: 66
    category: business_referential
    check: "the assigned Crew's wind_farm_id equals the WorkOrder's turbine's wind_farm_id"
    error_id: ERR_CREW_FARM_MISMATCH
    http_status: 422
    applies_to: "POST /wind-ops/work-orders/{id}/schedule"
  - priority: 67
    category: business_referential
    check: "the named CraneMobilization's wind_farm_id equals the wind_farm_id of the replacement's work order's turbine"
    error_id: ERR_CRANE_FARM_MISMATCH
    http_status: 422
    applies_to: "POST /wind-ops/component-replacements/{id}/reserve-crane"
  - priority: 68
    category: business_referential
    check: "the named SparePart's component_type equals the ComponentReplacement's component_type"
    error_id: ERR_SPARE_PART_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /wind-ops/component-replacements"
  - priority: 69
    category: business_referential
    check: "the reserved SparePart has uptower_repairable true before an uptower execution path may be planned"
    error_id: ERR_UPTOWER_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /wind-ops/component-replacements/{id}/plan-uptower"
  - priority: 70
    category: business_fiscal
    check: "the FaultEvent's severity_class_pinned is RESETTABLE and, when the requested triage disposition is REMOTE_RESET, its requires_dispatch_pinned is false — ADVISORY and LOCKOUT codes are never remotely resettable, and neither is a code the rule marks as dispatch-only"
    error_id: ERR_RESET_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /wind-ops/fault-events/{id}/triage with disposition REMOTE_RESET, POST /wind-ops/fault-events/{id}/remote-reset"
  - priority: 71
    category: business_fiscal
    check: "reset_attempt_count is strictly less than max_remote_resets_pinned inside the current rolling 24 hour window"
    error_id: ERR_RESET_QUOTA_EXHAUSTED
    http_status: 422
    applies_to: "POST /wind-ops/fault-events/{id}/remote-reset"
  - priority: 72
    category: business_fiscal
    check: "the crew's already-committed estimated_hours for the target UTC calendar date plus this order's estimated_hours does not exceed daily_hours_capacity"
    error_id: ERR_CREW_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /wind-ops/work-orders/{id}/schedule"
  - priority: 73
    category: business_fiscal
    check: "the named SparePart has quantity_on_hand of at least 1 available to reserve"
    error_id: ERR_SPARE_PART_UNAVAILABLE
    http_status: 422
    applies_to: "POST /wind-ops/component-replacements"
  - priority: 74
    category: business_fiscal
    check: "minimum_payment_cents does not exceed the farm's remaining landowner_budget_cap_cents minus landowner_payable_cents"
    error_id: ERR_MINIMUM_PAYMENT_ABOVE_CAP
    http_status: 422
    applies_to: "POST /wind-ops/farms/{id}/landowner-settlements"
  - priority: 75
    category: business_fiscal
    check: "for work_type SCHEDULED_SERVICE the turbine's operating_hours is at least service_due_operating_hours minus PRE_SERVICE_WINDOW_HOURS"
    error_id: ERR_SERVICE_NOT_DUE
    http_status: 422
    applies_to: "POST /wind-ops/work-orders"
  - priority: 76
    category: business_fiscal
    check: "the WorkOrder's revision_round is strictly less than MAX_REVISION_ROUNDS before another revision may be requested"
    error_id: ERR_REVISION_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /wind-ops/work-orders/{id}/request-revision"
  - priority: 77
    category: business_fiscal
    check: "the agreement's farm has at least one turbine whose availability_state is not DECOMMISSIONED, so the availability denominator is non-zero"
    error_id: ERR_NO_TURBINES_IN_SERVICE
    http_status: 422
    applies_to: "POST /wind-ops/service-agreements/{id}/settle"

endpoints:
  - method: POST
    path: "/wind-ops/_clock/set_current_utc"
    description: "Test-driving endpoint. Sets the server's logical clock to an arbitrary instant so that rolling reset windows, weather-window expiry, work-order ageing and settlement periods are deterministic. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; the server MUST NOT fall back to real wall-clock time."
    roles: [SiteAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: datetime }"
    side_effects:
      - "every CONFIRMED WeatherWindow whose end_utc is at or before the new clock value moves to EXPIRED"
      - "recomputes days_open for the work-order priority score on the next scoring trigger"
      - "a Turbine whose reset_window_start_utc is more than RESET_WINDOW_HOURS behind the new clock value has its remote_reset_count_24h reset to 0 on the next remote-reset attempt"

  - method: POST
    path: "/wind-ops/farms"
    description: "Register a wind farm with its levy percentages and landowner budget cap."
    roles: [SiteAdmin]
    code: 201
    input: [name, region_code, grid_operator_code, "road_levy_pct?", "community_levy_pct?", landowner_budget_cap_cents]
    output: WindFarm
    side_effects:
