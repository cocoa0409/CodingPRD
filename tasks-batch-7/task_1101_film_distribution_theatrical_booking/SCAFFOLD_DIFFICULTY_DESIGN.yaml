          which is set only by DCPShipment transitioning to DELIVERED. Attempting
          to issue KDM while print_status == DCP_SHIPPED fails.
          Different entity pair from booking→film above.
        test_recipe:
          setup:
            - "BookingAgreement BA1 ACCEPTED"
            - "DCPShipment created (IN_TRANSIT) but not yet delivered"
            - "print_status == DCP_SHIPPED"
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "D", territory: "US" }
              as: PlatformAdmin
              captures: { did: $.data.id }
            - call: "POST /distributors/${did}/films"
              payload: { title: "F", genre: "NARRATIVE", runtime_minutes: 90, rating: "R", release_pattern: "LIMITED", target_release_date: "2026-05-08T00:00:00Z", min_screens_for_wide: 0 }
              as: Booker
              captures: { fid: $.data.id }
            - call: "POST /distributors/${did}/theatres"
              payload: { name: "T", circuit: "X", market_code: "NYC", house_allowance_cents: 100 }
              as: PlatformAdmin
              captures: { tid: $.data.id }
            - call: "POST /distributors/${did}/theatres/${tid}/screens"
              payload: { auditorium_label: "A", seat_count: 100, projection_format: "DCP_2K" }
              as: PlatformAdmin
              captures: { sid: $.data.id }
            - call: "POST /distributors/${did}/booking-agreements"
              payload: { film_id: "${fid}", theatre_id: "${tid}", screen_id: "${sid}", opening_date: "2026-05-08T00:00:00Z", min_weeks_committed: 1, week_one_rental_pct: 0.60, rental_decay_per_week: 0.05, floor_pct: 0.30, per_capita_floor_cents: 100 }
              as: Booker
              captures: { baid: $.data.id, ba_v0: $.data.version }
            - call: "POST /distributors/${did}/booking-agreements/${baid}/accept"
              payload: { expected_booking_agreement_version: "${ba_v0}" }
              as: Exhibitor
            - call: "POST /distributors/${did}/booking-agreements/${baid}/dcp-shipments"
              payload: { content_format: "DCP_2K", tracking_number: "TN-1" }
              as: Booker
          trigger:
            - call: "POST /distributors/${did}/booking-agreements/${baid}/kdm-keys"
              payload: { valid_from_utc: "2026-05-08T00:00:00Z", valid_until_utc: "2026-05-15T00:00:00Z", screen_cert_fingerprint: "FP" }
              as: Booker
              captures: { err: $.data.error_id }
          assert:
            - "DCPShipment.status == IN_TRANSIT (not yet DELIVERED)"
            - "BookingAgreement.print_status == DCP_SHIPPED"
            - "KDM issuance returns 409 with error_id == ERR_PRINT_NOT_READY"
            - "Cross-entity dependency: KDMKey creation reads DCPShipment's state via print_status rollup"

  # ---------------------------------------------------------------------------
  # Rule 8: resource_temporal_overlap (≥ 2 instances, different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: zone_clearance_closed_interval_adjacency_conflicts
        grounds:
          - calculations.zone_clearance_overlap
          - entities.ZoneClearance.fields.effective_until_utc
        distinguishing_aspect: |
          Resource: Theatre (zone clearance).
          Semantics: CLOSED interval [from, until] — both endpoints INCLUSIVE.
          Two clearances where one ends at T and the other starts at T DO
          conflict (adjacency = overlap on closed intervals).
          Different semantics from KDM half-open below.
        test_recipe:
          setup:
            - "Market M1, Film F1"
            - "ZoneClearance ZC1 for Theatre T1 with effective_from=2026-06-01, effective_until=2026-06-30 (UPHELD)"
            - "Attempt to grant ZoneClearance ZC2 for Theatre T2 (within radius) with effective_from=2026-06-30, effective_until=2026-07-15"
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "D", territory: "US" }
              as: PlatformAdmin
              captures: { did: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /distributors/${did}/markets"
              payload: { code: "NYC", population_tier: "TIER_1", weekly_coop_budget_cents: 100000 }
              as: PlatformAdmin
              captures: { mid: $.data.id }
            - call: "POST /distributors/${did}/films"
              payload: { title: "F", genre: "NARRATIVE", runtime_minutes: 90, rating: "R", release_pattern: "LIMITED", target_release_date: "2026-06-01T00:00:00Z", min_screens_for_wide: 0 }
              as: Booker
              captures: { fid: $.data.id }
            - call: "POST /distributors/${did}/theatres"
              payload: { name: "T1", circuit: "X", market_code: "NYC", house_allowance_cents: 100 }
              as: PlatformAdmin
              captures: { t1id: $.data.id }
            - call: "POST /distributors/${did}/theatres"
              payload: { name: "T2", circuit: "Y", market_code: "NYC", house_allowance_cents: 100 }
              as: PlatformAdmin
              captures: { t2id: $.data.id }
            - call: "POST /distributors/${did}/markets/${mid}/zone-clearances"
              payload: { film_id: "${fid}", theatre_id: "${t1id}", clearance_radius_km: 5.0, effective_from_utc: "2026-06-01T00:00:00Z", effective_until_utc: "2026-06-30T00:00:00Z" }
              as: Booker
              captures: { zc1id: $.data.id }
            - call: "POST /distributors/${did}/markets/${mid}/zone-clearances/${zc1id}/challenge"
              payload: {}
              as: Exhibitor
            - call: "POST /distributors/${did}/markets/${mid}/zone-clearances/${zc1id}/rule"
              payload: { ruling: "UPHELD" }
              as: Booker
          trigger:
            - call: "POST /distributors/${did}/markets/${mid}/zone-clearances"
              payload: { film_id: "${fid}", theatre_id: "${t2id}", clearance_radius_km: 3.0, effective_from_utc: "2026-06-30T00:00:00Z", effective_until_utc: "2026-07-15T00:00:00Z" }
              as: Booker
              captures: { err: $.data.error_id }
          assert:
            - "ZC1 closed interval [06-01, 06-30]; ZC2 closed interval [06-30, 07-15]"
            - "Closed-interval overlap: zc1.effective_from <= zc2.effective_until AND zc2.effective_from <= zc1.effective_until"
            - "2026-06-01 <= 2026-07-15 AND 2026-06-30 <= 2026-06-30 → TRUE (conflict)"
            - "Adjacency at exactly 2026-06-30 IS a conflict for closed intervals"
            - "Response 409 with error_id == ERR_ZONE_CLEARANCE_CONFLICT"

      - name: kdm_half_open_interval_adjacency_does_not_conflict
        grounds:
          - calculations.kdm_window_validity
          - entities.KDMKey.fields.valid_until_utc
        distinguishing_aspect: |
          Resource: Screen certificate fingerprint (KDM key).
          Semantics: HALF-OPEN interval [valid_from, valid_until) — start
          inclusive, end EXCLUSIVE.
          Two KDMs where one ends at T and the other starts at T do NOT conflict.
          Different interval semantics from zone clearance above.
        test_recipe:
          setup:
            - "BookingAgreement BA1 ACCEPTED, DCPShipment DELIVERED"
            - "KDM K1 issued on screen FP-1 with [05-08, 05-15)"
            - "Attempt to issue KDM K2 on same screen FP-1 with [05-15, 05-22)"
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "D", territory: "US" }
              as: PlatformAdmin
              captures: { did: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /distributors/${did}/films"
              payload: { title: "F", genre: "NARRATIVE", runtime_minutes: 90, rating: "R", release_pattern: "LIMITED", target_release_date: "2026-05-08T00:00:00Z", min_screens_for_wide: 0 }
              as: Booker
              captures: { fid: $.data.id }
            - call: "POST /distributors/${did}/theatres"
              payload: { name: "T", circuit: "X", market_code: "NYC", house_allowance_cents: 100 }
              as: PlatformAdmin
              captures: { tid: $.data.id }
            - call: "POST /distributors/${did}/theatres/${tid}/screens"
              payload: { auditorium_label: "A", seat_count: 100, projection_format: "DCP_2K" }
              as: PlatformAdmin
              captures: { sid: $.data.id }
            - call: "POST /distributors/${did}/booking-agreements"
              payload: { film_id: "${fid}", theatre_id: "${tid}", screen_id: "${sid}", opening_date: "2026-05-08T00:00:00Z", min_weeks_committed: 1, week_one_rental_pct: 0.60, rental_decay_per_week: 0.05, floor_pct: 0.30, per_capita_floor_cents: 100 }
              as: Booker
              captures: { baid: $.data.id, ba_v0: $.data.version }
            - call: "POST /distributors/${did}/booking-agreements/${baid}/accept"
              payload: { expected_booking_agreement_version: "${ba_v0}" }
              as: Exhibitor
            - call: "POST /distributors/${did}/booking-agreements/${baid}/dcp-shipments"
              payload: { content_format: "DCP_2K", tracking_number: "TN-1" }
              as: Booker
              captures: { shipid: $.data.id }
            - call: "POST /distributors/${did}/booking-agreements/${baid}/dcp-shipments/${shipid}/mark_delivered"
              payload: {}
              as: Exhibitor
            - call: "POST /distributors/${did}/booking-agreements/${baid}/kdm-keys"
              payload: { valid_from_utc: "2026-05-08T00:00:00Z", valid_until_utc: "2026-05-15T00:00:00Z", screen_cert_fingerprint: "FP-1" }
              as: Booker
              captures: { k1id: $.data.id }
          trigger:
            - call: "POST /distributors/${did}/booking-agreements/${baid}/kdm-keys"
              payload: { valid_from_utc: "2026-05-15T00:00:00Z", valid_until_utc: "2026-05-22T00:00:00Z", screen_cert_fingerprint: "FP-1" }
              as: Booker
              captures: { k2id: $.data.id }
          assert:
            - "K1 half-open [05-08, 05-15); K2 half-open [05-15, 05-22)"
            - "Half-open overlap: k1.valid_from < k2.valid_until AND k2.valid_from < k1.valid_until"
            - "2026-05-08 < 2026-05-22 AND 2026-05-15 < 2026-05-15 → FALSE (no conflict)"
            - "Adjacency at exactly 2026-05-15 is NOT a conflict for half-open intervals"
            - "K2 creation succeeds; k2id is a valid UUID"
            - "Contrast with zone_clearance closed-interval adjacency which DOES conflict"

  # ---------------------------------------------------------------------------
  # Rule 9: compensating_invariant (≥ 2 instances, different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: cancel_accept_conserves_screens_committed_and_screen_status
        grounds:
          - state_machines.BookingAgreement.PROPOSED_to_ACCEPTED
          - state_machines.BookingAgreement.ACCEPTED_to_CANCELLED
          - entities.Film.fields.screens_committed
          - entities.Screen.fields.status
        distinguishing_aspect: |
          Conserved quantity: Film.screens_committed (integer count) and
          Screen.status (enum).
          Forward action: POST /accept → screens_committed += 1, screen → BOOKED.
          Compensating action: POST /cancel → screens_committed -= 1, screen → AVAILABLE.
          Invariant: screens_committed_after_cancel == screens_committed_before_accept
          AND screen_status_after_cancel == AVAILABLE.
        test_recipe:
          setup:
            - "Film F1 with screens_committed=0"
            - "Screen S1 AVAILABLE"
            - "BookingAgreement BA1 PROPOSED"
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "D", territory: "US" }
              as: PlatformAdmin
              captures: { did: $.data.id }
            - call: "POST /distributors/${did}/films"
              payload: { title: "F", genre: "NARRATIVE", runtime_minutes: 90, rating: "R", release_pattern: "LIMITED", target_release_date: "2026-05-08T00:00:00Z", min_screens_for_wide: 0 }
              as: Booker
              captures: { fid: $.data.id }
            - call: "POST /distributors/${did}/theatres"
              payload: { name: "T", circuit: "X", market_code: "NYC", house_allowance_cents: 100 }
              as: PlatformAdmin
              captures: { tid: $.data.id }
            - call: "POST /distributors/${did}/theatres/${tid}/screens"
              payload: { auditorium_label: "A", seat_count: 100, projection_format: "DCP_2K" }
              as: PlatformAdmin
              captures: { sid: $.data.id }
            - call: "POST /distributors/${did}/booking-agreements"
              payload: { film_id: "${fid}", theatre_id: "${tid}", screen_id: "${sid}", opening_date: "2026-05-08T00:00:00Z", min_weeks_committed: 1, week_one_rental_pct: 0.60, rental_decay_per_week: 0.05, floor_pct: 0.30, per_capita_floor_cents: 100 }
              as: Booker
              captures: { baid: $.data.id, ba_v0: $.data.version }
            - call: "GET /distributors/${did}/films/${fid}"
              payload: {}
              as: Booker
              captures: { committed_before: $.data.screens_committed }
          trigger:
            - call: "POST /distributors/${did}/booking-agreements/${baid}/accept"
              payload: { expected_booking_agreement_version: "${ba_v0}" }
              as: Exhibitor
            - call: "GET /distributors/${did}/films/${fid}"
              payload: {}
              as: Booker
              captures: { committed_after_accept: $.data.screens_committed }
            - call: "POST /distributors/${did}/booking-agreements/${baid}/cancel"
              payload: {}
              as: Booker
            - call: "GET /distributors/${did}/films/${fid}"
              payload: {}
              as: Booker
              captures: { committed_after_cancel: $.data.screens_committed }
            - call: "GET /distributors/${did}/theatres/${tid}/screens/${sid}"
              payload: {}
              as: Booker
              captures: { screen_status_after: $.data.status }
          assert:
            - "committed_before == 0"
            - "committed_after_accept == 1 (forward action: screens_committed incremented)"
            - "committed_after_cancel == 0 (compensating action: screens_committed decremented)"
            - "screen_status_after == AVAILABLE (compensating action reverted BOOKED → AVAILABLE)"
            - "Invariant holds: accept + cancel leaves screens_committed and screen.status unchanged"

      - name: void_report_conserves_settlement_gross
        grounds:
          - state_machines.BoxOfficeReport.SUBMITTED_to_VOIDED
          - calculations.settlement_distributor_share
          - entities.Settlement.fields.gross_cents
        distinguishing_aspect: |
          Conserved quantity: Settlement.gross_cents for a given (booking, week).
          Forward action: BoxOfficeReport SUBMITTED (gross included in PROVISIONAL settlement).
          Compensating action: BoxOfficeReport VOIDED (gross excluded; settlement recomputed).
          Invariant: settlement.gross_cents after void == settlement.gross_cents
          as if the report never existed. Different conserved quantity from
          screens_committed above.
