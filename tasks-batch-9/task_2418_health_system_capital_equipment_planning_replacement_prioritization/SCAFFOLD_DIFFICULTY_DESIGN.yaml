          trigger:
            - call: "POST /capital/requests/${r1_id}/screen"
              payload: { decision: "MAYBE" }
              as: ClinicalRequester
              as_user_id: "${dept_a1_id}"
              captures: { err_auth: $.data.error_id }
            - call: "POST /capital/requests/${r1_id}/screen"
              payload: { decision: "MAYBE" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { err_shape: $.data.error_id }
          assert:
            - "Trigger step 1 returns HTTP 403 with error_id == ERR_UNAUTHORIZED, NOT 422 / ERR_VALIDATION"
            - "Trigger step 2 (same body, allowed role) returns HTTP 422 with error_id == ERR_VALIDATION, proving the enum really is out of set"
            - "ReplacementRequest.${r1_id}.status == SUBMITTED after both rejected calls"
            - "ReplacementRequest.${r1_id}.return_count == 0 and revision_count == 0"

      - name: request_state_beats_allocation_capacity_on_fund
        grounds:
          - validations[priority=52]
          - validations[priority=77]
          - calculations.request_funded_amount
          - errors.ERR_REQUEST_INVALID_STATE
          - errors.ERR_ALLOCATION_INSUFFICIENT
        distinguishing_aspect: >-
          Category pair = state (V15, priority 52) vs capacity (V40, priority 77) on
          POST /capital/requests/{id}/fund: the target request is DEFERRED *and* its
          80000000 draw exceeds the 50000000 left in its facility allocation, so the 409 must
          name ERR_REQUEST_INVALID_STATE; the control step funds an APPROVED request whose draw
          also overruns, which does return ERR_ALLOCATION_INSUFFICIENT.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Facilities NRH and SMC; department DEPT-A1 at NRH, DEPT-B1 at SMC."
            - "Three assets installed 2020-08-02 with expected_life_years 8 and OEM support 2029-06-01 (adjusted RULS 25.00 each, all eligible): Aa and Ab in DEPT-A1, Ac in DEPT-B1."
            - "Cycle C5 plan_year 2031 with total_capital_cents 200000000 and both contingency percentages 0.00 -> distributable_cents 200000000."
