    distinguishing_aspect: The entity_backed Lessee role reads the ledger breakdown through GET /lessees/{id}/outstanding-balance
      only when X-User-ID equals the path's lessee id, and the response carries all three declared components
      with literal zeros for a freshly minted account.
    test_recipe:
      setup:
      - Empty DB; logical clock pinned to 2026-09-01T00:00:00Z.
      - Two lessee accounts exist, A and B, both minted by LeaseAdministrator; neither has any settled
        return, completed SOLD order or settled sale, so both balances are structurally zero.
      - §1.7 declares Lessee as entity_backed:Lessee whose shared_operations grant GET /lessees/{id}/outstanding-balance
        for its own id only.
      setup_api_calls:
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/v1/lessees
        payload:
          legal_name: LESS-OWN-A
          credit_tier: A
          utilization_threshold_pct: 50
          credit_ceiling_cents: 4000000
        as: LeaseAdministrator
        captures:
          ls_a_id: $.data.id
      - call: POST /api/v1/lessees
        payload:
          legal_name: LESS-OWN-B
          credit_tier: B
          utilization_threshold_pct: 60
          credit_ceiling_cents: 4000000
        as: LeaseAdministrator
        captures:
          ls_b_id: $.data.id
      trigger:
