            - call: "POST /clinicians"
              payload: { npi: "1000000001", full_name: "Dr Ada Ng", clinician_type: "ENDOSCOPIST", adr_benchmark_pct: 0.25 }
              as: PracticeAdmin
              captures: { endo_id: $.data.id }
            - call: "POST /clinicians"
              payload: { npi: "2000000001", full_name: "Dr Bo Reyes", clinician_type: "ANESTHESIA", max_overlapping_rooms: 1 }
              as: PracticeAdmin
              captures: { anes_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", birth_date: "1975-04-10", insurance_plan_id: "${plan_id}", asa_class: 2 }
              as: PracticeAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /endoscopy-sessions"
              payload: { room_code: "ENDO-1", session_date: "2026-09-15", window_start_utc: "2026-09-15T13:00:00Z", window_end_utc: "2026-09-15T21:00:00Z", lead_endoscopist_id: "${endo_id}", anesthesia_mode: "MAC", turnover_minutes: 15, max_procedures: 8 }
              as: PracticeAdmin
              captures: { sess_id: $.data.id, cap: $.data.capacity_minutes }
            - call: "POST /endoscopy-sessions/${sess_id}/status-actions"
              payload: { action: "PUBLISH" }
              as: PracticeAdmin
            - call: "POST /endoscopy-sessions/${sess_id}/anesthesia-coverage"
              payload: { anesthesia_clinician_id: "${anes_id}", coverage_start_utc: "2026-09-15T13:00:00Z", coverage_end_utc: "2026-09-15T21:00:00Z" }
              as: PracticeAdmin
              captures: { cov_id: $.data.id }
            - call: "POST /screening-episodes"
              payload: { patient_id: "${pt_id}", indication: "SCREENING_AVERAGE_RISK" }
              as: ReferralCoordinator
              captures: { ep_id: $.data.id, nav0: $.data.navigation_status, clin0: $.data.clinical_status }
            - call: "GET /endoscopy-sessions/${sess_id}"
              payload: {}
              as: PracticeAdmin
              captures: { sess_v: $.data.version }
            - call: "POST /endoscopy-sessions/${sess_id}/procedure-bookings"
              payload: { episode_id: "${ep_id}", performing_endoscopist_id: "${endo_id}", slot_start_utc: "2026-09-15T13:00:00Z", duration_minutes: 45, expected_session_version: "${sess_v}" }
              as: ReferralCoordinator
              captures: { bk_id: $.data.id }
            - call: "POST /screening-episodes/${ep_id}/outreach"
              payload: { channel: "PHONE", acknowledged: true }
              as: PatientNavigator
              captures: { nav1: $.data.navigation_status, score1: $.data.prep_adherence_score, clin1: $.data.clinical_status }
            - call: "POST /screening-episodes/${ep_id}/prep-attestation"
              payload: { regimen_completed: true }
              as: Patient
              as_user_id: "${pt_id}"
              captures: { nav2: $.data.navigation_status, score2: $.data.prep_adherence_score }
            - call: "POST /procedure-bookings/${bk_id}/check-in"
              payload: {}
