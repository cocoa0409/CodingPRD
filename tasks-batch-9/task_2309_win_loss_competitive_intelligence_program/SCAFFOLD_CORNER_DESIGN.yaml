# =============================================================================
# §1.9 Scaffold Corner Design — breadth probe for
#   tasks/task_2309_win_loss_competitive_intelligence_program
#
# Taxonomy source: skills/prd-bench-scaffold-generator/references/
#                  claim-extraction-guide.md
#   The nine guide sections are the `section:` values; the per-section table
#   rows are the `claim_type:` values. No categories are invented here.
#
# Every `test_recipe` drives an empty database through §1.5 calls only. The
# logical clock is pinned with POST /_clock/set_current_utc as the first call
# of every chain so that certification windows, cooling-off windows, evidence
# recency and due dates are deterministic.
#
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8) appear as
# `excluded_because:` stubs naming the covering instance.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # Guide section 1 — From Table 1 (Entities)
  # ===========================================================================
  - section: entities
    instances:

      - name: program_creation_echoes_supplied_optional_inputs
        claim_type: creation
        grounds:
          - entities.Program
          - endpoints.POST /programs
        distinguishing_aspect: "All three optional inputs are supplied explicitly, so the response must echo them rather than the declared defaults; system and computed fields are still server-minted."
        test_recipe:
          setup: ["empty database; logical clock pinned to 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramAdmin
              as_user_id: admin-1
          trigger:
            - call: POST /programs
              payload: { name: "Q3 Win-Loss", fiscal_quarter: "2026-Q3", incentive_budget_usd: 10000.00, interview_incentive_cap_usd: 500.00, min_deal_value_usd: 50000.00, required_question_keys: ["EVALUATION_CRITERIA", "COMPETITOR_POSITIONING", "PRICING_PERCEPTION", "LOSS_REASON"], max_open_interviews_per_analyst: 5, independence_mode: "ADVISORY" }
              as: ProgramAdmin
              as_user_id: admin-1
          assert:
            - "HTTP 201"
            - "data.name == \"Q3 Win-Loss\""
            - "data.fiscal_quarter == \"2026-Q3\""
            - "data.incentive_budget_usd == 10000.00"
            - "data.interview_incentive_cap_usd == 500.00"
            - "data.min_deal_value_usd == 50000.00"
            - "len(data.required_question_keys) == 4"
            - "data.max_open_interviews_per_analyst == 5"
            - "data.independence_mode == \"ADVISORY\""
            - "data.status == \"DRAFT\""
            - "data.posture == \"OPEN\""
            - "data.guide_version == 1"
            - "data.incentive_committed_usd == 0.00"
            - "data.incentive_paid_usd == 0.00"
            - "data.version == 1"
            - "data.id is a UUID with no type prefix; data.created_at and data.updated_at are ISO-8601 UTC with three fractional digits"
            - "meta.api_request_id and meta.api_request_timestamp are present; response_type == \"object\""

      - name: program_and_analyst_defaults_applied_when_optionals_omitted
        claim_type: defaults
        grounds:
          - entities.Program.fields.required_question_keys
          - entities.Program.fields.max_open_interviews_per_analyst
          - entities.Program.fields.independence_mode
          - entities.Analyst.fields.sales_org_member
        distinguishing_aspect: "Every optional input is omitted; the declared defaults (3 guide keys, 3 open interviews, STRICT, sales_org_member false) must materialise, and the computed counters must start at zero."
        test_recipe:
          setup: ["a DRAFT program created with only its required inputs"]
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramAdmin
              as_user_id: admin-1
            - call: POST /programs
              payload: { name: "Defaults Program", fiscal_quarter: "2026-Q3", incentive_budget_usd: 10000.00, interview_incentive_cap_usd: 500.00, min_deal_value_usd: 50000.00 }
              as: ProgramAdmin
              as_user_id: admin-1
              captures: { p_id: $.data.id }
          trigger:
            - call: POST /analysts
              payload: { program_id: "${p_id}", full_name: "Ana One", linked_user_ref: "user-ana-1", employment_type: "INTERNAL", certified_until: "2027-01-01T00:00:00.000Z" }
              as: ProgramAdmin
              as_user_id: admin-1
            - call: GET /programs/${p_id}
              payload: {}
              as: ProgramAdmin
              as_user_id: admin-1
          assert:
            - "POST /analysts -> HTTP 201; data.sales_org_member == false"
            - "POST /analysts -> data.status == \"ACTIVE\""
            - "POST /analysts -> data.open_interview_count == 0"
            - "POST /analysts -> data.committed_minutes == 0"
            - "GET /programs -> data.required_question_keys == [\"EVALUATION_CRITERIA\", \"COMPETITOR_POSITIONING\", \"PRICING_PERCEPTION\"]"
            - "GET /programs -> data.max_open_interviews_per_analyst == 3"
            - "GET /programs -> data.independence_mode == \"STRICT\""

      - name: program_retrieval_returns_stored_entity_unchanged
        claim_type: retrieval
        grounds:
          - endpoints.GET /programs/{program_id}
        distinguishing_aspect: "A read-only GET must return the persisted row byte-for-byte and must NOT bump version."
        test_recipe:
          setup: ["one DRAFT program"]
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramAdmin
              as_user_id: admin-1
            - call: POST /programs
              payload: { name: "Q3 Win-Loss", fiscal_quarter: "2026-Q3", incentive_budget_usd: 10000.00, interview_incentive_cap_usd: 500.00, min_deal_value_usd: 50000.00 }
              as: ProgramAdmin
              as_user_id: admin-1
              captures: { p_id: $.data.id }
          trigger:
            - call: GET /programs/${p_id}
              payload: {}
              as: ResearchAnalyst
              as_user_id: reader-1
          assert:
            - "HTTP 200"
            - "data.id == the captured p_id"
            - "data.name == \"Q3 Win-Loss\""
            - "data.status == \"DRAFT\""
            - "data.version == 1 (a GET performs no mutation)"

      - name: deals_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET /deals
          - response_envelope.pagination_fields
        distinguishing_aspect: "Three deals exist and limit is 2, so the page carries exactly 2 rows while total_count stays 3 and has_more is true — proving total_count counts the filtered set, not the page."
        test_recipe:
          setup: ["one program with three LOST deals"]
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramAdmin
              as_user_id: admin-1
            - call: POST /programs
              payload: { name: "Q3 Win-Loss", fiscal_quarter: "2026-Q3", incentive_budget_usd: 10000.00, interview_incentive_cap_usd: 500.00, min_deal_value_usd: 50000.00 }
              as: ProgramAdmin
              as_user_id: admin-1
              captures: { p_id: $.data.id }
            - call: POST /deals
              payload: { program_id: "${p_id}", crm_deal_ref: "CRM-1001", outcome: "LOST", acr_usd: 300000.00, close_date: "2026-06-15T00:00:00.000Z", segment: "ENTERPRISE", sales_rep_user_ref: "rep-77" }
              as: ProgramAdmin
              as_user_id: admin-1
            - call: POST /deals
              payload: { program_id: "${p_id}", crm_deal_ref: "CRM-1002", outcome: "LOST", acr_usd: 120000.00, close_date: "2026-06-16T00:00:00.000Z", segment: "MIDMARKET", sales_rep_user_ref: "rep-78" }
              as: ProgramAdmin
              as_user_id: admin-1
            - call: POST /deals
              payload: { program_id: "${p_id}", crm_deal_ref: "CRM-1003", outcome: "WON", acr_usd: 90000.00, close_date: "2026-06-17T00:00:00.000Z", segment: "SMB", sales_rep_user_ref: "rep-79" }
              as: ProgramAdmin
              as_user_id: admin-1
          trigger:
            - call: GET /deals
              payload: { program_id: "${p_id}", limit: 2, offset: 0 }
              as: ProgramAdmin
              as_user_id: admin-1
          assert:
            - "HTTP 200; response_type == \"array\""
            - "len(data) == 2"
            - "total_count == 3"
            - "has_more == true"
            - "limit == 2 and offset == 0 are echoed"

      - name: deal_retrieval_with_unknown_id_returns_deal_not_found
        claim_type: not_found
        grounds:
          - validations.priority_5
          - errors.ERR_DEAL_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unknown UUID must produce the entity-specific 404 code, not a generic 400."
        test_recipe:
          setup: ["empty database except the pinned clock"]
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramAdmin
              as_user_id: admin-1
          trigger:
            - call: GET /deals/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2
              payload: {}
              as: ProgramAdmin
              as_user_id: admin-1
          assert:
            - "HTTP 404"
            - "data.error_id == \"ERR_DEAL_NOT_FOUND\""
            - "response_type == \"error\""

      - name: program_creation_missing_required_min_deal_value_rejected
        claim_type: required_fields
        grounds:
          - validations.priority_7
          - errors.ERR_INVALID_REQUEST
          - endpoints.POST /programs.input
        distinguishing_aspect: "min_deal_value_usd has source input and no default, so omitting it is a schema violation (400) rather than a business-range violation (422)."
        test_recipe:
          setup: ["empty database except the pinned clock"]
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramAdmin
              as_user_id: admin-1
          trigger:
            - call: POST /programs
              payload: { name: "Q3 Win-Loss", fiscal_quarter: "2026-Q3", incentive_budget_usd: 10000.00, interview_incentive_cap_usd: 500.00 }
              as: ProgramAdmin
              as_user_id: admin-1
          assert:
            - "HTTP 400"
            - "data.error_id == \"ERR_INVALID_REQUEST\""
            - "no Program row is created"

      - name: deal_creation_with_undeclared_outcome_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.Deal.fields.outcome.constraints
          - validations.priority_7
        distinguishing_aspect: "PENDING is not a declared member of {WON, LOST, NO_DECISION}; enum membership is a priority-7 schema check (400), evaluated before any numeric-domain check."
        test_recipe:
          setup: ["one DRAFT program"]
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramAdmin
              as_user_id: admin-1
            - call: POST /programs
              payload: { name: "Q3 Win-Loss", fiscal_quarter: "2026-Q3", incentive_budget_usd: 10000.00, interview_incentive_cap_usd: 500.00, min_deal_value_usd: 50000.00 }
              as: ProgramAdmin
              as_user_id: admin-1
              captures: { p_id: $.data.id }
          trigger:
            - call: POST /deals
              payload: { program_id: "${p_id}", crm_deal_ref: "CRM-1001", outcome: "PENDING", acr_usd: 300000.00, close_date: "2026-06-15T00:00:00.000Z", segment: "ENTERPRISE", sales_rep_user_ref: "rep-77" }
              as: ProgramAdmin
              as_user_id: admin-1
          assert:
            - "HTTP 400"
            - "data.error_id == \"ERR_INVALID_REQUEST\""

      - name: deal_creation_with_negative_acr_rejected
        claim_type: type_constraints
        grounds:
          - validations.priority_8
          - errors.ERR_VALUE_OUT_OF_RANGE
        distinguishing_aspect: "The JSON type is correct (a number) so priority 7 passes; only the numeric-domain rule acr_usd > 0 fires, which is a 422 with a different code than the enum case."
        test_recipe:
          setup: ["one DRAFT program"]
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramAdmin
              as_user_id: admin-1
            - call: POST /programs
              payload: { name: "Q3 Win-Loss", fiscal_quarter: "2026-Q3", incentive_budget_usd: 10000.00, interview_incentive_cap_usd: 500.00, min_deal_value_usd: 50000.00 }
              as: ProgramAdmin
              as_user_id: admin-1
              captures: { p_id: $.data.id }
          trigger:
            - call: POST /deals
              payload: { program_id: "${p_id}", crm_deal_ref: "CRM-1001", outcome: "LOST", acr_usd: -5000.00, close_date: "2026-06-15T00:00:00.000Z", segment: "ENTERPRISE", sales_rep_user_ref: "rep-77" }
              as: ProgramAdmin
              as_user_id: admin-1
          assert:
            - "HTTP 422"
            - "data.error_id == \"ERR_VALUE_OUT_OF_RANGE\""

      - name: deal_selection_rank_score_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Deal.fields.selection_rank_score
          - entities.Deal.fields.stratum
          - endpoints.POST /deals.input
        distinguishing_aspect: "selection_rank_score and stratum are computed at draw time only; a client-supplied value must be discarded, leaving both null on a freshly created deal."
        test_recipe:
          setup: ["one DRAFT program"]
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramAdmin
              as_user_id: admin-1
            - call: POST /programs
              payload: { name: "Q3 Win-Loss", fiscal_quarter: "2026-Q3", incentive_budget_usd: 10000.00, interview_incentive_cap_usd: 500.00, min_deal_value_usd: 50000.00 }
              as: ProgramAdmin
              as_user_id: admin-1
              captures: { p_id: $.data.id }
          trigger:
            - call: POST /deals
              payload: { program_id: "${p_id}", crm_deal_ref: "CRM-1001", outcome: "LOST", acr_usd: 300000.00, close_date: "2026-06-15T00:00:00.000Z", segment: "ENTERPRISE", sales_rep_user_ref: "rep-77", selection_rank_score: 0.9999, stratum: "WON" }
              as: ProgramAdmin
              as_user_id: admin-1
          assert:
            - "HTTP 201"
            - "data.selection_rank_score == null"
            - "data.stratum == null"
            - "data.research_status == \"NOT_SELECTED\""
            - "data.attribution_status == \"UNATTRIBUTED\""
            - "data.sampling_frame_id == null"
            - "data.interview_coverage_count == 0"

      - name: program_status_and_guide_version_are_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Program.fields.status
          - entities.Program.fields.guide_version
          - entities.Program.fields.incentive_paid_usd
        distinguishing_aspect: "Client-supplied status/guide_version/ledger values must be ignored: a program can only ever be born DRAFT with guide_version 1 and a zero ledger, no matter what the body says."
        test_recipe:
          setup: ["empty database except the pinned clock"]
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramAdmin
              as_user_id: admin-1
          trigger:
            - call: POST /programs
              payload: { name: "Q3 Win-Loss", fiscal_quarter: "2026-Q3", incentive_budget_usd: 10000.00, interview_incentive_cap_usd: 500.00, min_deal_value_usd: 50000.00, status: "ACTIVE", guide_version: 9, incentive_paid_usd: 4000.00, version: 7 }
              as: ProgramAdmin
              as_user_id: admin-1
          assert:
            - "HTTP 201"
            - "data.status == \"DRAFT\""
            - "data.guide_version == 1"
            - "data.incentive_paid_usd == 0.00"
            - "data.incentive_committed_usd == 0.00"
            - "data.posture == \"OPEN\""
            - "data.version == 1"

      - name: buyer_contact_creation_under_unknown_deal_returns_deal_not_found
        claim_type: parent_relationships
        grounds:
          - entities.BuyerContact.parent
          - validations.priority_5
        distinguishing_aspect: "BuyerContact is a sub-resource of Deal; an unresolvable parent path segment must fail with the parent's 404 code before any body validation runs."
        test_recipe:
          setup: ["empty database except the pinned clock"]
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramAdmin
              as_user_id: admin-1
          trigger:
            - call: POST /deals/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/buyer-contacts
              payload: { email: "buyer1@acme.test", full_name: "Bea Buyer", title_band: "ECONOMIC_BUYER" }
              as: ResearchAnalyst
              as_user_id: analyst-1
          assert:
            - "HTTP 404"
            - "data.error_id == \"ERR_DEAL_NOT_FOUND\""

      - name: interview_response_is_immutable_and_carries_no_version_field
        claim_type: immutability
        grounds:
          - entities.InterviewResponse.common_fields
          - endpoints.GET /interview-responses/{response_id}
        distinguishing_aspect: "InterviewResponse is declared common_fields: false — the read model exposes only id and created_at alongside its own fields, and §1.5 declares no PATCH or DELETE for it, so a recorded verbatim can never be edited."
        test_recipe:
          setup: ["a SCHEDULED interview on a drawn LOST deal, with one EVALUATION_CRITERIA response recorded"]
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramAdmin
              as_user_id: admin-1
            - call: POST /programs
              payload: { name: "Q3 Win-Loss", fiscal_quarter: "2026-Q3", incentive_budget_usd: 10000.00, interview_incentive_cap_usd: 500.00, min_deal_value_usd: 50000.00 }
              as: ProgramAdmin
              as_user_id: admin-1
              captures: { p_id: $.data.id }
            - call: POST /programs/${p_id}/activate
              payload: {}
              as: ProgramAdmin
              as_user_id: admin-1
            - call: POST /competitors
              payload: { program_id: "${p_id}", name: "Northwind", tier: "PRIMARY" }
              as: ProgramAdmin
              as_user_id: admin-1
              captures: { c1_id: $.data.id }
            - call: POST /analysts
              payload: { program_id: "${p_id}", full_name: "Ana One", linked_user_ref: "user-ana-1", employment_type: "INTERNAL", certified_until: "2027-01-01T00:00:00.000Z", sales_org_member: false }
              as: ProgramAdmin
              as_user_id: admin-1
              captures: { a1_id: $.data.id }
            - call: POST /deals
              payload: { program_id: "${p_id}", crm_deal_ref: "CRM-1001", outcome: "LOST", acr_usd: 300000.00, close_date: "2026-06-15T00:00:00.000Z", segment: "ENTERPRISE", sales_rep_user_ref: "rep-77", primary_competitor_id: "${c1_id}" }
              as: ProgramAdmin
              as_user_id: admin-1
              captures: { d1_id: $.data.id }
            - call: POST /deals/${d1_id}/buyer-contacts
              payload: { email: "buyer1@acme.test", full_name: "Bea Buyer", title_band: "ECONOMIC_BUYER", incentive_eligibility: "ELIGIBLE" }
              as: ResearchAnalyst
              as_user_id: ${a1_id}
              captures: { b1_id: $.data.id }
            - call: POST /deals/${d1_id}/buyer-contacts/${b1_id}/consent
              payload: { consent_status: "GRANTED" }
              as: ResearchAnalyst
              as_user_id: ${a1_id}
            - call: POST /sampling-frames
              payload: { program_id: "${p_id}", label: "Wave 1", window_start: "2026-04-01T00:00:00.000Z", window_end: "2026-07-01T00:00:00.000Z", quota_won: 2, quota_lost: 2, quota_no_decision: 1, selection_basis: "STRATIFIED_BY_SEGMENT" }
              as: ResearchAnalyst
              as_user_id: ${a1_id}
              captures: { f1_id: $.data.id }
            - call: POST /sampling-frames/${f1_id}/seal
              payload: {}
              as: ResearchAnalyst
              as_user_id: ${a1_id}
            - call: POST /sampling-frames/${f1_id}/draw
              payload: { stratum: "LOST", requested_count: 1 }
              as: ResearchAnalyst
              as_user_id: ${a1_id}
            - call: POST /interviews
              payload: { deal_id: "${d1_id}", buyer_contact_id: "${b1_id}", analyst_id: "${a1_id}", scheduled_start_at: "2026-08-10T14:00:00.000Z", scheduled_end_at: "2026-08-10T15:00:00.000Z" }
              as: ResearchAnalyst
              as_user_id: ${a1_id}
              captures: { i1_id: $.data.id }
            - call: POST /interviews/${i1_id}/responses
              payload: { question_key: "EVALUATION_CRITERIA", verbatim_text: "Ranked security first", recorded_at: "2026-08-01T10:00:00.000Z", rating: 3 }
              as: ResearchAnalyst
              as_user_id: ${a1_id}
              captures: { r_eval_id: $.data.id }
          trigger:
            - call: GET /interview-responses/${r_eval_id}
              payload: {}
              as: ResearchAnalyst
              as_user_id: ${a1_id}
          assert:
            - "HTTP 200"
            - "data.id and data.created_at are present"
            - "data has NO version field and NO updated_at field"
            - "data.question_key == \"EVALUATION_CRITERIA\""
            - "data.rating == 3"
            - "data.recorded_at == \"2026-08-01T10:00:00.000Z\""
            - "§1.5 declares no PATCH, PUT or DELETE endpoint whose path resolves an InterviewResponse"

      - name: loss_reason_reparent_to_own_descendant_rejected
        claim_type: graph
        grounds:
          - entities.LossReason.fields.parent_reason_id
          - validations.priority_29
          - errors.ERR_TAXONOMY_CYCLE
        distinguishing_aspect: "The self-referential taxonomy edge is the graph topology's cycle risk: reparenting a root under its own child would create a cycle and must be refused with 409, leaving both rows' depth unchanged."
        test_recipe:
          setup: ["an ACTIVE program with a two-level loss-reason taxonomy PRICE -> PRICE_DISCOUNT"]
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramAdmin
              as_user_id: admin-1
            - call: POST /programs
              payload: { name: "Q3 Win-Loss", fiscal_quarter: "2026-Q3", incentive_budget_usd: 10000.00, interview_incentive_cap_usd: 500.00, min_deal_value_usd: 50000.00 }
              as: ProgramAdmin
              as_user_id: admin-1
              captures: { p_id: $.data.id }
            - call: POST /loss-reasons
              payload: { program_id: "${p_id}", code: "PRICE", label: "Price" }
              as: ProgramAdmin
              as_user_id: admin-1
              captures: { lr_root_id: $.data.id }
            - call: POST /loss-reasons
              payload: { program_id: "${p_id}", code: "PRICE_DISCOUNT", label: "Discount depth", parent_reason_id: "${lr_root_id}" }
              as: ProgramAdmin
              as_user_id: admin-1
              captures: { lr_child_id: $.data.id }
          trigger:
            - call: PATCH /loss-reasons/${lr_root_id}
              payload: { parent_reason_id: "${lr_child_id}" }
              as: ProgramAdmin
              as_user_id: admin-1
          assert:
            - "HTTP 409"
            - "data.error_id == \"ERR_TAXONOMY_CYCLE\""
