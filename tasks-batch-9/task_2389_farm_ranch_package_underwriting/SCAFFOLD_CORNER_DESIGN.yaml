      - name: corner_agent_cannot_reach_another_producers_book
        claim_type: forbidden_operations
        grounds: ["errors.ERR_NOT_ACCOUNT_AGENT", "validations[priority=6]", "complexity_profile.role_model"]
        distinguishing_aspect: "Ownership is scoped to the Agent role only: agent A1 gets ERR_NOT_ACCOUNT_AGENT (403) on both a read and a write against A2's book, while an Underwriter reads the very same rows successfully."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, two Agents, each with its own FarmAccount and DRAFT policy"
          setup_api_calls:
            - *k_clock
            - *k_agent
            - *k_acct
            - *k_policy
            - call: "POST /agents"
              payload: { agency_name: "Second Producer LLC", license_state: "KS", appointment_status: "ACTIVE", authority_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { ag2_id: $.data.id }
            - call: "POST /farm-accounts"
              payload: { legal_name: "Foreign Book Farms", state_code: "KS", county_name: "Rice", cat_zone_code: "ZN-1", acreage: 900, operation_type: "CROP" }
              as: Agent
              as_user_id: "${ag2_id}"
              captures: { acct2_id: $.data.id }
            - call: "POST /farm-policies"
              payload: { account_id: "${acct2_id}", term_start_date: "2026-09-01", term_end_date: "2027-08-31", deductible_cents: 500000 }
              as: Agent
              as_user_id: "${ag2_id}"
              captures: { pol2_id: $.data.id }
          trigger:
            - call: "GET /farm-accounts/${acct2_id}"
              as: Agent
              as_user_id: "${ag_id}"
              captures: { e_own1: $.data.error_id }
            - call: "POST /farm-policies/${pol2_id}/scheduled-items"
              payload: { item_class: "DWELLING", description: "Injected dwelling", valuation_basis: "RC", stated_value_cents: 40000000, age_years: 22, condition_grade: "B" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { e_own2: $.data.error_id }
            - call: "POST /farm-policies"
              payload: { account_id: "${acct2_id}", term_start_date: "2027-09-01", term_end_date: "2028-08-31", deductible_cents: 500000 }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { e_own3: $.data.error_id }
            - call: "GET /farm-policies/${pol2_id}"
