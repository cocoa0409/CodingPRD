      - name: shortfall_liability_rounds_the_unit_cost_once_before_multiplying
        claim_type: precision
        grounds: >-
          calculations.rights_deal_minimum_liability constant
          SHORTFALL_LIABILITY_PCT 0.60 and its precision note
          ("shortfall_unit_cost_cents rounded half-up once, then multiplied by
          shortfall_units — round-then-multiply, NOT multiply-then-round");
          state_machines.RightsDeal DRAFT -> COMMITTED and
          PENDING -> CONFIRMED side effects (recompute
          minimum_liability_cents).
        distinguishing_aspect: >-
          unit_cost_cents 8333 makes the two orderings disagree: round(8333 *
          0.60) = round(4999.8) = 5000 per unit gives 20 * 5000 = 100000, while
          multiplying first gives round(20 * 8333 * 0.60) = 99996 — a 4-cent
          gap that a fixture with a round unit cost like 8000 cannot expose. The
          second observation, taken after 10 of the 20 guaranteed units are
          actually released, mixes both terms (10 * 8333 + 10 * 5000 = 133330 vs
          the wrong 133328) so the rounding rule is pinned on the shortfall term
          only, while released units are charged at their exact cost.
        test_recipe:
          setup: >-
            Canonical event with a 40-unit TICKET deal guaranteeing 20 units at
            unit_cost_cents 8333, left in DRAFT — the commit itself is the first
            observation, and the tranche can only be promised after it, because
            validations[priority=41] restricts tranche creation to deal_status IN
            {COMMITTED, PARTIALLY_RELEASED, SHORTFALL_DECLARED}.
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
            - { call: "POST /rights-deals", payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 40, guaranteed_minimum_units: 20, unit_cost_cents: 8333 }, as: RightsManager, as_user_id: u_rights, captures: { deal_id: "$.data.id" } }
          trigger:
            - { call: "POST /rights-deals/${deal_id}/commit", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { ml1: "$.data.minimum_liability_cents", sf1: "$.data.shortfall_units", st1: "$.data.deal_status" } }
            - { call: "POST /release-tranches", payload: { rights_deal_id: "${deal_id}", promised_units: 10, promised_release_at: "2026-10-01T00:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { tr_id: "$.data.id" } }
            - { call: "GET /rights-deals/${deal_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { deal_v: "$.data.version" } }
            - { call: "POST /release-tranches/${tr_id}/confirm", payload: { confirmed_units: 10, expected_rights_deal_version: "${deal_v}" }, as: RightsManager, as_user_id: u_rights, captures: { tr_st: "$.data.tranche_state" } }
            - { call: "GET /rights-deals/${deal_id}", payload: {}, as: FinanceController, as_user_id: u_fin, captures: { ml2: "$.data.minimum_liability_cents", sf2: "$.data.shortfall_units", rel2: "$.data.released_units", st2: "$.data.deal_status" } }
          assert: >-
            After the commit: ${st1} == "COMMITTED" (the DRAFT -> COMMITTED
            transition sets the status outright, so a guaranteed-minimum deal does
            not declare shortfall before any tranche has resolved),
            ${sf1} == 20 (nothing released against a 20-unit
            guarantee) and ${ml1} == 100000
            (= 0 * 8333 + 20 * round_half_up(8333 * 0.60) = 20 * 5000), NOT
            99996 (= round_half_up(20 * 8333 * 0.60)).
            After confirming 10 units: ${tr_st} == "CONFIRMED", ${rel2} == 10,
            ${sf2} == 10 and ${ml2} == 133330
            (= 10 * 8333 exact + 10 * 5000 rounded), NOT 133328.
            ${st2} == "SHORTFALL_DECLARED", because released 10 plus 0 pending is
            below the 20-unit guarantee.

      - name: tier_schedule_fee_pct_switches_at_the_ninety_sixty_thirty_and_seven_day_marks
        claim_type: constants_applied
        grounds: >-
          calculations.booking_cancellation_settlement constants
          TIER_SCHEDULE_PCT {D90: 0.10, D60: 0.25, D30: 0.50, D7: 0.80,
          LATE: 1.00} and the TIER_SCHEDULE variant's pinned boundary comment
          ("every comparison is `>=`"), plus the conserved identity
          cancellation_fee_cents == pre_paid_cents - refund_cents +
          balance_due_cents; endpoints "POST /bookings/{id}/cancel".
        distinguishing_aspect: >-
