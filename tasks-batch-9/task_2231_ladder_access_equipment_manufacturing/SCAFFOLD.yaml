    side_effects: []
    errors: [ERR_INVALID_PAGINATION]

  - method: POST
    path: /ladder-ops/corrective-actions/{id}/verify
    roles: [DesignApprover]
    input: []
    output: CorrectiveAction
    side_effects:
      - "status OPEN -> VERIFIED; sets verified_at = logical clock and verified_by_user_id = X-User-ID"
      - "cascade depth 4: the incident moves CAPA_OPENED -> CLOSED with closed_at set; product.risk_score_mitigated is recomputed with CAPA_CREDIT_FACTOR and dhf_retention_until re-anchors to INCIDENT_CLOSURE; when the recomputed risk_score_mitigated drops below RISK_CLEAR_THRESHOLD the product moves STOP_SHIP -> RETAIL_RELEASED and its SUSPENDED listings move back to LISTED with audit_due_at re-stamped"
    errors: [ERR_CORRECTIVE_ACTION_NOT_FOUND, ERR_CORRECTIVE_ACTION_NOT_OPEN, ERR_SEGREGATION_OF_DUTIES, ERR_REVISION_NOT_APPROVED]

