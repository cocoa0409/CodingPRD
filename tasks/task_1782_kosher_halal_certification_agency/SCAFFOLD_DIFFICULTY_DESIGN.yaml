            - { call: "POST /api/visits", payload: { facility_id: "${fN}", visit_type: "INITIAL", inspector_user_id: "sup-1", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T12:00:00Z" }, as: AccountManager, captures: { vN: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /api/visits/${vN}/start", as: FieldSupervisor, as_user_id: "sup-1" }
            - { call: "POST /api/visits/${vN}/complete", as: FieldSupervisor, as_user_id: "sup-1" }
            - { call: "POST /api/facilities/${fN}/approve", as: CertificationReviewer }
            - { call: "POST /api/agreements", payload: { client_id: "${cN}", scheme: "KOSHER", billing_cycle: "ANNIVERSARY", term_start_date: "2026-04-01", per_product_fee_cents: 73000, expected_client_version: "${cN_v}" }, as: AccountManager, captures: { aN: $.data.id } }
            - { call: "POST /api/agreements/${aN}/activate", as: AccountManager }
            - { call: "POST /api/invoices", payload: { client_id: "${cN}", invoice_type: "ANNUAL_CERTIFICATION", agreement_id: "${aN}" }, as: AccountManager, captures: { invN: $.data.id } }
            - { call: "POST /api/invoices/${invN}/record-payment", as: AccountManager, as_user_id: "am-1" }
            - { call: "POST /api/ingredients", payload: { client_id: "${cN}", name: "IngN1", manufacturer: "M1", source_category: "PLANT" }, as: ClientContact, as_user_id: "${cN}", captures: { iN1: $.data.id } }
            - { call: "POST /api/ingredients/${iN1}/start-review", as: CertificationReviewer }
            - { call: "POST /api/ingredients/${iN1}/approve", as: CertificationReviewer }
            - { call: "POST /api/ingredients", payload: { client_id: "${cN}", name: "IngN2", manufacturer: "M2", source_category: "MINERAL" }, as: ClientContact, as_user_id: "${cN}", captures: { iN2: $.data.id } }
            - { call: "POST /api/ingredients/${iN2}/start-review", as: CertificationReviewer }
            - { call: "POST /api/ingredients/${iN2}/approve", as: CertificationReviewer }
            - { call: "POST /api/products", payload: { client_id: "${cN}", brand: "BN", name: "PN1", ingredient_ids: ["${iN1}"] }, as: ClientContact, as_user_id: "${cN}", captures: { pN1: $.data.id } }
            - { call: "POST /api/products/${pN1}/submit-review", as: ClientContact, as_user_id: "${cN}" }
            - { call: "POST /api/products/${pN1}/certify-eligible", as: CertificationReviewer }
            - { call: "POST /api/products", payload: { client_id: "${cN}", brand: "BN", name: "PN2", ingredient_ids: ["${iN2}"] }, as: ClientContact, as_user_id: "${cN}", captures: { pN2: $.data.id } }
            - { call: "POST /api/products/${pN2}/submit-review", as: ClientContact, as_user_id: "${cN}" }
            - { call: "POST /api/products/${pN2}/certify-eligible", as: CertificationReviewer }
            - { call: "POST /api/certificates", payload: { client_id: "${cN}", scheme: "KOSHER", term_type: "ANNUAL", facility_ids: ["${fN}"], product_ids: ["${pN1}", "${pN2}"] }, as: CertificateOfficer, captures: { certN: $.data.id } }
            - { call: "POST /api/certificates/${certN}/issue", as: CertificateOfficer, as_user_id: "co-1" }
          trigger:
            - { call: "POST /api/ingredients/${iN1}/change-notices", payload: { change_summary: "supplier swap" }, as: ClientContact, as_user_id: "${cN}" }
            - { call: "GET /api/certificates/${certN}", as: CertificateOfficer, captures: { cntN_mid: $.data.active_product_count, scopeN_mid: $.data.scope_status } }
            - { call: "POST /api/ingredients/${iN1}/resubmit", as: ClientContact, as_user_id: "${cN}" }
            - { call: "POST /api/ingredients/${iN1}/approve", as: CertificationReviewer }
            - { call: "GET /api/certificates/${certN}", as: CertificateOfficer, captures: { cntN_end: $.data.active_product_count, scopeN_end: $.data.scope_status } }
          assert:
            - "Initial: active_product_count == 2, scope_status == FULL"
            - "After change notice: cntN_mid == 1 and scopeN_mid == PARTIAL_FROZEN (forward cascade)"
            - "After resubmit + re-approve: cntN_end == 2 and scopeN_end == FULL (compensating cascade restores the conserved count exactly)"
            - "Certificate.${certN}.status == ACTIVE throughout (freeze never suspends)"

      - name: nc_score_conserved_under_remediation_submit_and_verify_fail
        grounds:
          - calculations.open_nc_score_and_risk_tier
          - state_machines.InspectionFinding.OPEN_to_REMEDIATION_SUBMITTED
          - state_machines.InspectionFinding.REMEDIATION_SUBMITTED_to_REOPENED
        distinguishing_aspect: "Conserved quantity is RISK POINTS (client.open_nc_score, distinct from money and cardinality): submit-remediation removes the finding from the counted set (3 -> 0) and a FAILED verify re-enters it (0 -> 3) with a new deadline — the forward+compensating pair leaves the score exactly unchanged."
        test_recipe:
          setup:
            - "Client with facility PENDING_REVIEW; ROUTINE visit IN_PROGRESS under inspector sup-1; one OPEN MAJOR finding (weight 3) with deadline 2026-09-01"
          setup_api_calls:
            - { call: "POST /api/clients", payload: { legal_name: "Score Co", certification_scheme: "HALAL", contact_email: "sc@x.com" }, as: AccountManager, captures: { cSC: $.data.id } }
            - { call: "POST /api/facilities", payload: { client_id: "${cSC}", name: "SC Plant", address: "23 Rd", facility_role: "OWNED" }, as: ClientContact, as_user_id: "${cSC}", captures: { fSC: $.data.id } }
            - { call: "POST /api/visits", payload: { facility_id: "${fSC}", visit_type: "ROUTINE", inspector_user_id: "sup-1", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T12:00:00Z" }, as: AccountManager, captures: { vSC: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /api/visits/${vSC}/start", as: FieldSupervisor, as_user_id: "sup-1" }
            - { call: "POST /api/visits/${vSC}/findings", payload: { severity: "MAJOR", description: "missing halal slaughter log", remediation_deadline: "2026-09-01T00:00:00Z" }, as: FieldSupervisor, as_user_id: "sup-1", captures: { fndSC: $.data.id } }
            - { call: "GET /api/clients/${cSC}", as: AccountManager, captures: { sc0: $.data.open_nc_score, tier0: $.data.risk_tier } }
          trigger:
            - { call: "POST /api/findings/${fndSC}/submit-remediation", payload: { remediation_notes: "logs reconstructed and countersigned" }, as: ClientContact, as_user_id: "${cSC}", captures: { fndSC_st1: $.data.status } }
            - { call: "GET /api/clients/${cSC}", as: AccountManager, captures: { sc1: $.data.open_nc_score, tier1: $.data.risk_tier } }
            - { call: "POST /api/findings/${fndSC}/verify", payload: { outcome: "FAILED", new_remediation_deadline: "2026-12-01T00:00:00Z" }, as: FieldSupervisor, as_user_id: "sup-2", captures: { fndSC_st2: $.data.status } }
            - { call: "GET /api/clients/${cSC}", as: AccountManager, captures: { sc2: $.data.open_nc_score, tier2: $.data.risk_tier } }
          assert:
            - "sc0 == 3 and tier0 == MEDIUM (MAJOR weight 3, >= 3 boundary)"
            - "After submit-remediation: fndSC_st1 == REMEDIATION_SUBMITTED, sc1 == 0, tier1 == LOW (REMEDIATION_SUBMITTED excluded from the counted set)"
            - "After verify FAILED (verifier sup-2 != inspector sup-1): fndSC_st2 == REOPENED, sc2 == 3 == sc0, tier2 == MEDIUM == tier0 (exact conservation), remediation_deadline == 2026-12-01T00:00:00Z"
