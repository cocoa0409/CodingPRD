  - section: calculations
    instances:
      - name: statement_budget_variance_with_approved_budget
        claim_type: correct_result
        grounds: [calculations.budget_variance]
        distinguishing_aspect: "With an APPROVED FY2026 budget totalling 5880000, the monthly share is round_half_up(5880000/12) == 490000 and the variance on a 250000 accrual month is exactly -240000."
        test_recipe:
          setup:
            - "Agreement ACTIVE; APPROVED budget FY2026 (1200000+960000+2400000+600000+480000+240000 == 5880000)"
            - "Expense E1 FUEL 250000 (service 2026-08-05, paid 2026-08-07)"
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Aeris Holdings LLC", contact_email: "owner@aeris.example" }
              as: AccountExecutive
              captures: { o_id: $.data.id }
            - call: "POST /aircraft"
              payload: { owner_id: "${o_id}", tail_number: "N330JX", model: "G650", home_base_icao: "KTEB" }
              as: AccountExecutive
              captures: { a_id: $.data.id }
