              as_user_id: "op_alm"
              captures: { lim_id: $.data.id }
            - call: "POST /brokers"
              payload: { legal_name: "Conserve Deposit Brokers LLC", broker_type: "DEPOSIT_BROKER", has_placement_discretion: true, fee_structure: "FLAT_FEE", fee_flat_cents: 25000 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { brk_id: $.data.id }
            - call: "POST /brokers/${brk_id}/agreements"
              payload: { agreement_ref: "AGR-2834-21", fee_structure: "FLAT_FEE", fee_flat_cents: 25000, termination_notice_days: 30, effective_date: "2026-07-01", aml_program_score: 80, financial_condition_score: 75, insurance_coverage_score: 70, recordkeeping_score: 65 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { agr_id: $.data.id }
            - call: "POST /broker-agreements/${agr_id}/diligence-actions"
              payload: { action: "START_DILIGENCE" }
              as: ComplianceReviewer
              as_user_id: "op_comp"
            - call: "POST /broker-agreements/${agr_id}/diligence-actions"
              payload: { action: "APPROVE" }
              as: ComplianceReviewer
              as_user_id: "op_comp"
            - call: "POST /deposit-programs"
              payload: { institution_id: "${inst_id}", broker_id: "${brk_id}", agreement_id: "${agr_id}", program_name: "Conserve Brokered CD", funding_channel_claim: "BROKERED", product_type: "TIME_DEPOSIT", tenor_days: 60, offered_rate_bps: 470, early_withdrawal_penalty_days: 30, principal_erosion_allowed: false, titling_convention: "DIRECT_TITLED" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { prog_id: $.data.id, prog_v: $.data.version }
            - call: "POST /deposit-classifications"
