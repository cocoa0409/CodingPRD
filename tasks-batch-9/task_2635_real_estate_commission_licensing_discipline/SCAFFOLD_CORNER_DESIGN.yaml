# Scaffold Corner Design (SKILL.md §1.9) - breadth coverage of every testable claim
# the §1.1-§1.7 surface of SCAFFOLD.yaml declares that SCAFFOLD_DIFFICULTY_DESIGN.yaml
# (§1.8) does not already cover. Section and claim_type values are taken verbatim from
# references/claim-extraction-guide.md. Logical clock default: 2026-08-01T00:00:00Z.
scaffold_corner_design:
  - section: entities
    instances:
      - name: licensee_creation_returns_201_with_a_generated_license_number_and_applicant_defaults
        claim_type: creation
        grounds:
          - entities.Licensee.fields.license_number
          - entities.Licensee.fields.license_status
          - endpoints[POST /commission/licensees]
        distinguishing_aspect: |
          The three input fields are the only client-supplied values; license_number is a
          per-person_type counter with a class prefix (SP- for SALESPERSON, BR- for BROKER) and the
          two lifecycle dimensions both start at their own initial_state. A second SALESPERSON must
          take SP-000002 while the first BROKER still takes BR-000001 - the counters are per class,
          not global.
        test_recipe:
          setup:
            - "empty database, clock at the 2026-08-01T00:00:00Z default"
          setup_api_calls: []
          trigger:
            - call: "POST /commission/licensees"
              payload: { person_type: "SALESPERSON", full_name: "Sam Sales", prelicense_hours: 90 }
              as: LicensingAnalyst
              captures: { sam_id: $.data.id }
            - call: "POST /commission/licensees"
              payload: { person_type: "SALESPERSON", full_name: "Sue Second", prelicense_hours: 120 }
              as: LicensingAnalyst
            - call: "POST /commission/licensees"
              payload: { person_type: "BROKER", full_name: "Dana Broker", prelicense_hours: 180 }
              as: LicensingAnalyst
          assert:
            - "each call returns 201 with the envelope { meta: { api_request_id, api_request_timestamp }, response_type: \"object\", data: {...} }"
            - "the first response has license_number == SP-000001, the second SP-000002 and the third BR-000001 - the counter is per person_type"
            - "Licensee.${sam_id}.license_status == APPLICANT and discipline_status == NONE"
            - "exam_attempt_count == 0, exam_best_score == 0, exam_passed_at == null, prior_sanction_count == 0, recovery_paid_cents == 0, ce_hours_valid == 0"
            - "sponsoring_brokerage_id == null, supervising_broker_id == null, license_issued_at == null, license_expires_at == null, inactive_since == null"
            - "version == 1 and created_at == updated_at == 2026-08-01T00:00:00Z"
      - name: licensee_retrieval_returns_the_stored_row_with_recomputed_read_only_fields
        claim_type: retrieval
        grounds:
          - endpoints[GET /commission/licensees/{id}]
          - entities.Licensee.fields.ce_hours_required
          - entities.Licensee.fields.ce_deficient
        distinguishing_aspect: |
          GET is not a dumb row dump: ce_hours_required, ce_deficient, ce_hours_valid,
          prior_sanction_count and recovery_paid_cents are `source: computed` and must be derived on
          every read. An ACTIVE licensee with no course completions therefore reads
          ce_hours_required == 12 (the ACTIVE branch of ce_requirement_hours) and ce_deficient == true
          even though nothing wrote those fields.
        test_recipe:
          setup:
            - "Dana Broker is ACTIVE, self-supervising at Harbor Realty Group, licensed at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /commission/licensees"
              payload: { person_type: "BROKER", full_name: "Dana Broker", prelicense_hours: 180 }
              as: LicensingAnalyst
              captures: { br_id: $.data.id }
            - call: "POST /commission/licensees/${br_id}/exam-results"
              payload: { score: 88, taken_on: "2026-07-01" }
              as: LicensingAnalyst
            - call: "POST /commission/brokerages"
              payload: { name: "Harbor Realty Group", designated_broker_id: "${br_id}", trust_account_required: false, record_retention_years: 5 }
              as: LicensingAnalyst
              captures: { bkg_id: $.data.id }
            - call: "POST /commission/brokerages/${bkg_id}/activation"
              payload: { attestation_note: "no trust account required" }
              as: LicensingAnalyst
              captures: { bkg_v1: $.data.version }
            - call: "POST /commission/licensees/${br_id}/affiliations"
              payload: { brokerage_id: "${bkg_id}", supervising_broker_id: "${br_id}", expected_brokerage_version: "${bkg_v1}" }
              as: LicensingAnalyst
          trigger:
            - call: "GET /commission/licensees/${br_id}"
              payload: {}
              as: LicensingAnalyst
          assert:
            - "200 with response_type == \"object\" and data.id == ${br_id}"
            - "license_status == ACTIVE, discipline_status == NONE, license_number == BR-000001"
            - "exam_attempt_count == 1, exam_best_score == 88, exam_passed_at == 2026-08-01T00:00:00Z"
            - "license_issued_at == 2026-08-01T00:00:00Z and license_expires_at == 2028-07-31T00:00:00Z (issued_at + 730 days)"
            - "ce_period_start_on == 2026-08-01, ce_hours_valid == 0, ce_hours_required == 12 and ce_deficient == true - all four are recomputed on read"
            - "sponsoring_brokerage_id == ${bkg_id} and supervising_broker_id == ${br_id} (self-supervision by the designated broker)"
      - name: licensee_listing_filters_by_status_and_paginates_with_default_limit_ten
        claim_type: listing
        grounds:
          - endpoints[GET /commission/licensees]
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Filter, sort and paginate must compose: the license_status filter is applied before the
          window, total_count reports the filtered population (not the table size), has_more is
          derived from offset + returned vs total_count, and the ordering is created_at ASC. A default
          limit of 10 must be applied when the client sends none.
        test_recipe:
          setup:
            - "three APPLICANT salespersons (Sam Sales, Sue Second, Sid Third) and one EXAM_PASSED broker (Dana Broker) exist, created in that order"
          setup_api_calls:
            - call: "POST /commission/licensees"
              payload: { person_type: "SALESPERSON", full_name: "Sam Sales", prelicense_hours: 90 }
              as: LicensingAnalyst
              captures: { sam_id: $.data.id }
            - call: "POST /commission/licensees"
              payload: { person_type: "SALESPERSON", full_name: "Sue Second", prelicense_hours: 90 }
              as: LicensingAnalyst
              captures: { sue_id: $.data.id }
            - call: "POST /commission/licensees"
              payload: { person_type: "SALESPERSON", full_name: "Sid Third", prelicense_hours: 90 }
              as: LicensingAnalyst
              captures: { sid_id: $.data.id }
            - call: "POST /commission/licensees"
              payload: { person_type: "BROKER", full_name: "Dana Broker", prelicense_hours: 180 }
              as: LicensingAnalyst
              captures: { br_id: $.data.id }
            - call: "POST /commission/licensees/${br_id}/exam-results"
              payload: { score: 88, taken_on: "2026-07-01" }
              as: LicensingAnalyst
          trigger:
            - call: "GET /commission/licensees"
              payload: {}
              as: LicensingAnalyst
            - call: "GET /commission/licensees"
              payload: { license_status: "APPLICANT", limit: 2, offset: 0 }
              as: LicensingAnalyst
            - call: "GET /commission/licensees"
              payload: { license_status: "APPLICANT", limit: 2, offset: 2 }
              as: LicensingAnalyst
            - call: "GET /commission/licensees"
              payload: { person_type: "BROKER" }
              as: LicensingAnalyst
          assert:
            - "the unfiltered call returns 200, response_type == \"array\", 4 rows, total_count == 4, limit == 10, offset == 0, has_more == false"
            - "the rows are ordered created_at ASC: ${sam_id}, ${sue_id}, ${sid_id}, ${br_id}"
            - "the first APPLICANT page returns ${sam_id} and ${sue_id} with total_count == 3 and has_more == true"
            - "the second APPLICANT page returns only ${sid_id} with total_count == 3 and has_more == false"
            - "the BROKER filter returns 1 row (${br_id}) with total_count == 1 - the filter is applied before the window, so total_count is the filtered population"
      - name: every_entity_family_answers_a_bad_path_id_with_its_own_not_found_code
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - errors.ERR_LICENSEE_NOT_FOUND
          - errors.ERR_COURSE_COMPLETION_NOT_FOUND
        distinguishing_aspect: |
          Twelve distinct 404 codes, one per entity family - a single generic ERR_NOT_FOUND is wrong,
          and so is answering with the wrong family's code. The unknown id is syntactically valid, so
          the failure must be a lookup miss (404) and never a 400.
        test_recipe:
          setup:
            - "empty database; UNKNOWN = 00000000-0000-0000-0000-0000000000ff is a well-formed id that matches no row"
          setup_api_calls: []
          trigger:
            - call: "GET /commission/licensees/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: LicensingAnalyst
              captures: { e1: $.data.error_id }
            - call: "GET /commission/brokerages/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: LicensingAnalyst
              captures: { e2: $.data.error_id }
            - call: "GET /commission/trust-accounts/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: LicensingAnalyst
              captures: { e3: $.data.error_id }
            - call: "GET /commission/trust-audits/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: LicensingAnalyst
              captures: { e4: $.data.error_id }
            - call: "GET /commission/complaints/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: LicensingAnalyst
              captures: { e5: $.data.error_id }
            - call: "GET /commission/consent-agreements/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: LicensingAnalyst
              captures: { e6: $.data.error_id }
            - call: "GET /commission/hearings/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: LicensingAnalyst
              captures: { e7: $.data.error_id }
            - call: "GET /commission/sanction-orders/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: LicensingAnalyst
              captures: { e8: $.data.error_id }
            - call: "GET /commission/education-providers/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: LicensingAnalyst
              captures: { e9: $.data.error_id }
            - call: "GET /commission/instructors/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: LicensingAnalyst
              captures: { e10: $.data.error_id }
            - call: "GET /commission/course-completions/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: LicensingAnalyst
              captures: { e11: $.data.error_id }
            - call: "GET /commission/advertising-names/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: LicensingAnalyst
              captures: { e12: $.data.error_id }
          assert:
            - "all twelve calls return HTTP 404 with response_type == \"error\" and a non-empty data.message"
            - "the error_ids are, in order: ERR_LICENSEE_NOT_FOUND, ERR_BROKERAGE_NOT_FOUND, ERR_TRUST_ACCOUNT_NOT_FOUND, ERR_TRUST_AUDIT_NOT_FOUND, ERR_COMPLAINT_NOT_FOUND, ERR_CONSENT_AGREEMENT_NOT_FOUND, ERR_HEARING_NOT_FOUND, ERR_SANCTION_ORDER_NOT_FOUND, ERR_EDUCATION_PROVIDER_NOT_FOUND, ERR_INSTRUCTOR_NOT_FOUND, ERR_COURSE_COMPLETION_NOT_FOUND, ERR_ADVERTISING_NAME_NOT_FOUND"
            - "no call returns 400 - a well-formed unknown id is a lookup miss, not a malformed request"
      - name: write_calls_missing_required_fields_return_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=3]
          - errors.ERR_INVALID_REQUEST
          - endpoints[POST /commission/licensees]
        distinguishing_aspect: |
          Every field in an endpoint's `input:` without a trailing `?` is required, and its absence is
          a 400 at priority 3 - before any existence (4/5) or state (9) check runs. The negative cases
          below each omit exactly one required field, so an implementation that defaults a missing
          field (prelicense_hours -> 0, expected_brokerage_version -> current) is caught.
        test_recipe:
          setup:
            - "Dana Broker is EXAM_PASSED and Harbor Realty Group is ACTIVE"
          setup_api_calls:
            - call: "POST /commission/licensees"
              payload: { person_type: "BROKER", full_name: "Dana Broker", prelicense_hours: 180 }
              as: LicensingAnalyst
              captures: { br_id: $.data.id }
            - call: "POST /commission/licensees/${br_id}/exam-results"
              payload: { score: 88, taken_on: "2026-07-01" }
              as: LicensingAnalyst
            - call: "POST /commission/brokerages"
              payload: { name: "Harbor Realty Group", designated_broker_id: "${br_id}", trust_account_required: false, record_retention_years: 5 }
              as: LicensingAnalyst
              captures: { bkg_id: $.data.id }
            - call: "POST /commission/brokerages/${bkg_id}/activation"
              payload: { attestation_note: "no trust account required" }
              as: LicensingAnalyst
              captures: { bkg_v1: $.data.version }
          trigger:
            - call: "POST /commission/licensees"
              payload: { person_type: "SALESPERSON", full_name: "Nora NoHours" }
              as: LicensingAnalyst
              captures: { e1: $.data.error_id }
            - call: "POST /commission/licensees/${br_id}/exam-results"
              payload: { score: 80 }
              as: LicensingAnalyst
              captures: { e2: $.data.error_id }
            - call: "POST /commission/licensees/${br_id}/affiliations"
              payload: { brokerage_id: "${bkg_id}", supervising_broker_id: "${br_id}" }
              as: LicensingAnalyst
              captures: { e3: $.data.error_id }
            - call: "POST /commission/complaints"
              payload: { complainant_name: "Ora Buyer", respondent_licensee_id: "${br_id}", alleged_loss_cents: 100000 }
              as: Public
              captures: { e4: $.data.error_id }
          assert:
            - "all four calls return 400 ERR_INVALID_REQUEST with response_type == \"error\""
            - "no row is created or mutated: GET /commission/licensees returns 1 row and Licensee.${br_id}.exam_attempt_count is still 1 and sponsoring_brokerage_id is still null"
            - "the missing affiliation OCC field is a 400, not a 412 - the version check at priority 14 never runs because the body never passed priority 3"
            - "Brokerage.${bkg_id}.version is still ${bkg_v1} and affiliated_licensee_count is still 0"
      - name: omitted_optional_inputs_take_their_declared_defaults
        claim_type: defaults
        grounds:
          - endpoints[POST /commission/education-providers/{id}/approval]
          - entities.AdvertisingName.fields.team_lead_licensee_id
          - entities.TrustAccount.fields.book_available_cents
        distinguishing_aspect: |
          Three different default shapes in one instance: an omitted approval_years falls back to 2
          (so approval_expires_at is stamped 730 days out, not 1095), an omitted
          team_lead_licensee_id stays null for a non-TEAM kind, and a freshly opened trust account
          starts with all three money fields at 0 rather than null.
        test_recipe:
          setup:
            - "Dana Broker is ACTIVE and self-supervising at Harbor Realty Group (trust_account_required true, escrow account TA opened), clock at 2026-08-01T00:00:00Z"
            - "Coastal Institute is a PENDING education provider"
          setup_api_calls:
            - call: "POST /commission/licensees"
              payload: { person_type: "BROKER", full_name: "Dana Broker", prelicense_hours: 180 }
              as: LicensingAnalyst
              captures: { br_id: $.data.id }
            - call: "POST /commission/licensees/${br_id}/exam-results"
              payload: { score: 88, taken_on: "2026-07-01" }
              as: LicensingAnalyst
            - call: "POST /commission/brokerages"
              payload: { name: "Harbor Realty Group", designated_broker_id: "${br_id}", trust_account_required: true, record_retention_years: 5 }
              as: LicensingAnalyst
              captures: { bkg_id: $.data.id }
            - call: "POST /commission/education-providers"
              payload: { name: "Coastal Institute" }
              as: LicensingAnalyst
              captures: { prov_id: $.data.id }
          trigger:
            - call: "POST /commission/brokerages/${bkg_id}/trust-accounts"
              payload: { bank_name: "Seaside Bank", account_type: "ESCROW" }
              as: LicensingAnalyst
              captures: { ta_id: $.data.id }
            - call: "POST /commission/brokerages/${bkg_id}/activation"
              payload: { attestation_note: "escrow account opened" }
              as: LicensingAnalyst
              captures: { bkg_v1: $.data.version }
            - call: "POST /commission/licensees/${br_id}/affiliations"
              payload: { brokerage_id: "${bkg_id}", supervising_broker_id: "${br_id}", expected_brokerage_version: "${bkg_v1}" }
              as: LicensingAnalyst
            - call: "POST /commission/education-providers/${prov_id}/approval"
              payload: {}
              as: LicensingAnalyst
            - call: "POST /commission/advertising-names"
              payload: { brokerage_id: "${bkg_id}", kind: "DBA", name_text: "Harbor Homes" }
              as: LicensingAnalyst
              captures: { adv_id: $.data.id }
          assert:
            - "TrustAccount.${ta_id} is created with status == OPEN and book_obligation_cents == 0, book_available_cents == 0, shortage_cents == 0, last_audited_at == null"
            - "EducationProvider.${prov_id}.status == APPROVED with approved_at == 2026-08-01T00:00:00Z and approval_expires_at == 2028-07-31T00:00:00Z (approval_years defaulted to 2, i.e. 730 days)"
            - "AdvertisingName.${adv_id}.team_lead_licensee_id == null, status == SUBMITTED, rejection_reason == null and reviewed_by_user_id == null"
            - "AdvertisingName.${adv_id}.prohibited_term_hits == 0 (HARBORHOMES contains no PROHIBITED_TERMS)"
      - name: advertising_name_normalization_recomputed_and_client_normalized_name_input_ignored
        claim_type: computed_fields
        grounds:
          - calculations.advertising_name_normalization
          - entities.AdvertisingName.fields.normalized_name
          - entities.AdvertisingName.fields.prohibited_term_hits
        distinguishing_aspect: |
          normalized_name and prohibited_term_hits are `source: computed`. A client that ships its own
          normalized_name (and a zero hit count) for a name containing REALTOR must be ignored on both
          counts: the server uppercases, strips every non-alphanumeric character and counts the
          prohibited substrings itself.
        test_recipe:
          setup:
            - "Harbor Realty Group is ACTIVE with Dana Broker ACTIVE and self-supervising"
          setup_api_calls:
            - call: "POST /commission/licensees"
              payload: { person_type: "BROKER", full_name: "Dana Broker", prelicense_hours: 180 }
              as: LicensingAnalyst
              captures: { br_id: $.data.id }
            - call: "POST /commission/licensees/${br_id}/exam-results"
              payload: { score: 88, taken_on: "2026-07-01" }
              as: LicensingAnalyst
            - call: "POST /commission/brokerages"
              payload: { name: "Harbor Realty Group", designated_broker_id: "${br_id}", trust_account_required: false, record_retention_years: 5 }
              as: LicensingAnalyst
              captures: { bkg_id: $.data.id }
            - call: "POST /commission/brokerages/${bkg_id}/activation"
              payload: { attestation_note: "no trust account required" }
              as: LicensingAnalyst
              captures: { bkg_v1: $.data.version }
            - call: "POST /commission/licensees/${br_id}/affiliations"
              payload: { brokerage_id: "${bkg_id}", supervising_broker_id: "${br_id}", expected_brokerage_version: "${bkg_v1}" }
              as: LicensingAnalyst
          trigger:
            - call: "POST /commission/advertising-names"
              payload: { brokerage_id: "${bkg_id}", kind: "DBA", name_text: "Bay & Coast Realtor's MLS Group", normalized_name: "SOMETHINGELSE", prohibited_term_hits: 0, status: "APPROVED" }
              as: LicensingAnalyst
              captures: { adv_id: $.data.id, e1: $.data.error_id }
          assert:
            - "the undeclared normalized_name, prohibited_term_hits and status keys are ignored (no 400 is required for extra keys; the row is created with 201)"
            - "AdvertisingName.${adv_id}.normalized_name == BAYCOASTREALTORSMLSGROUP - uppercased with every space, ampersand and apostrophe stripped, never the client's SOMETHINGELSE"
            - "AdvertisingName.${adv_id}.prohibited_term_hits == 2 (REALTOR and MLS both appear as substrings), not the client's 0"
            - "AdvertisingName.${adv_id}.status == SUBMITTED - the initial_state, not the client's APPROVED"
      - name: licensee_system_fields_are_server_generated_and_client_status_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Licensee.fields.license_status
          - entities.Licensee.fields.exam_best_score
          - response_envelope.success
        distinguishing_aspect: |
          id, created_at, updated_at, version and every `source: system` field are server-owned. A
          create that ships license_status ACTIVE, exam_best_score 99, a chosen id and a back-dated
          created_at must still produce an APPLICANT with a server id, a clock-stamped created_at and
          version 1 - otherwise the whole licensing gate is bypassable from the request body.
        test_recipe:
          setup:
            - "empty database, clock at 2026-08-01T00:00:00Z"
          setup_api_calls: []
          trigger:
            - call: "POST /commission/licensees"
              payload: { person_type: "SALESPERSON", full_name: "Sam Sales", prelicense_hours: 90, id: "11111111-1111-1111-1111-111111111111", license_status: "ACTIVE", exam_best_score: 99, license_number: "SP-999999", created_at: "2020-01-01T00:00:00Z", version: 7 }
              as: LicensingAnalyst
              captures: { sam_id: $.data.id, e1: $.data.error_id }
          assert:
            - "201; data.id != 11111111-1111-1111-1111-111111111111 (a server-generated id)"
            - "license_status == APPLICANT, exam_best_score == 0, exam_attempt_count == 0"
            - "license_number == SP-000001 - the counter, not the client's SP-999999"
            - "created_at == updated_at == 2026-08-01T00:00:00Z and version == 1"
            - "a follow-up GET /commission/licensees/${sam_id} returns exactly the same values - nothing from the client's system-field payload was persisted"
      - name: out_of_range_integers_and_undeclared_enum_members_are_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=3]
          - entities.CourseCompletion.fields.credit_hours
          - entities.Brokerage.fields.record_retention_years
        distinguishing_aspect: |
          Priority 3 covers three distinct shape failures with one error id: an undeclared enum member,
          an integer outside its declared `constraints:` band (credit_hours 1..12,
          record_retention_years 3..10, amount_cents > 0, alleged_loss_cents >= 0) and an unparseable
          datetime. Each must be a 400 before any business rule is consulted.
        test_recipe:
          setup:
            - "Dana Broker is EXAM_PASSED; no brokerage exists yet"
          setup_api_calls:
            - call: "POST /commission/licensees"
              payload: { person_type: "BROKER", full_name: "Dana Broker", prelicense_hours: 180 }
              as: LicensingAnalyst
              captures: { br_id: $.data.id }
            - call: "POST /commission/licensees/${br_id}/exam-results"
              payload: { score: 88, taken_on: "2026-07-01" }
              as: LicensingAnalyst
          trigger:
            - call: "POST /commission/licensees"
              payload: { person_type: "APPRAISER", full_name: "Ann Appraiser", prelicense_hours: 90 }
              as: LicensingAnalyst
              captures: { e1: $.data.error_id }
            - call: "POST /commission/brokerages"
              payload: { name: "Harbor Realty Group", designated_broker_id: "${br_id}", trust_account_required: false, record_retention_years: 2 }
              as: LicensingAnalyst
              captures: { e2: $.data.error_id }
            - call: "POST /commission/brokerages"
              payload: { name: "Harbor Realty Group", designated_broker_id: "${br_id}", trust_account_required: false, record_retention_years: 11 }
              as: LicensingAnalyst
              captures: { e3: $.data.error_id }
            - call: "POST /commission/complaints"
              payload: { complainant_name: "Ora Buyer", respondent_licensee_id: "${br_id}", allegation_type: "MISREPRESENTATION", alleged_loss_cents: -1 }
              as: Public
              captures: { e4: $.data.error_id }
          assert:
            - "all four calls return 400 ERR_INVALID_REQUEST"
