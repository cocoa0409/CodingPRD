              as: PlatformAdmin
              captures: { dasher_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cara" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", restaurant_id: "${rest_id}", line_items: [ { menu_item_id: "${item_id}", quantity: 1 } ], tip_cents: 0 }
