        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.code-assignment-stale-batch
          - concurrency_rules.session-reschedule-stale-session
          - validations[priority=8]
          - errors.ERR_STALE_BATCH_VERSION
          - errors.ERR_STALE_SESSION_VERSION
        distinguishing_aspect: |
          Both §1.2.1 rules are exercised on writes that pass every state precondition, so the 412 can only
          come from the version check: a second assignment out of a still-ACTIVE batch that still has codes,
          and a second reschedule of a still-SCHEDULED sitting. Each stale attempt must leave the parent's
          version and every derived counter untouched (no half-write), and re-reading the parent then retrying
          with the fresh version must succeed — proving the version advances by exactly 1 per accepted write
          and by 0 per rejected one.
        test_recipe:
          setup:
            - "One jurisdiction / provider prepaid 500000 / ACTIVE EN form / 2-seat EN site / REGISTERED EN proctor."
            - "Two candidates C1 and C2 under the same provider, and one ACTIVE batch of 3 EXAM_ONLY units (total_price_cents 11286) with all 3 codes AVAILABLE."
