  - rule_id: transitive_cascade
    instances:

      - name: block_quarantine_cascades_four_levels_to_crew_wage_ledger
        grounds:
          - state_machines.Block.CLEARED_to_QUARANTINED
          - state_machines.HarvestWindow.OPEN_to_SUSPENDED
          - state_machines.PickSession.APPROVED_to_DISPUTED
          - state_machines.PickSession.OPEN_to_VOIDED
          - calculations.crew_wage_ledger
          - calculations.picker_productivity
        distinguishing_aspect: |
          One quarantine call propagates through FOUR distinct entity levels —
          Block posture -> HarvestWindow SUSPENDED -> PickSession
          VOIDED/DISPUTED -> Crew.accrued_wage_cents and Picker productivity —
          and the third level is CONDITIONAL on the child's state: the APPROVED
          session becomes DISPUTED and reverses 4950 cents off the crew ledger
          while the untallied OPEN session becomes VOIDED and moves the ledger by
          nothing.
