    code: 201
    input: [patient_id, conducted_by_clinician_id, expected_admission_at, intensive_therapy_documented, expected_functional_improvement_documented, prior_functional_level_documented, medical_supervision_documented]
    output: PreadmissionScreening
    side_effects: ["status = DRAFT; conducted_at = current logical clock; revision_count = 0"]

  - method: GET
    path: "/screenings/{screeningId}"
    description: "Read one preadmission screening"
    roles: [ComplianceOfficer, RehabPhysician, NurseCaseManager, TherapyLead, HimCoder]
    code: 200
    input: []
    output: PreadmissionScreening
    side_effects: []

  - method: GET
    path: "/screenings"
    description: "List preadmission screenings, filterable by patient, screener, reviewer and status"
    roles: [ComplianceOfficer, RehabPhysician, NurseCaseManager, TherapyLead, HimCoder]
    code: 200
    input: ["patient_id?", "conducted_by_clinician_id?", "reviewed_by_clinician_id?", "status?", "limit?", "offset?"]
    output: PreadmissionScreening[]
    side_effects: []

  - method: PATCH
    path: "/screenings/{screeningId}"
    description: "Revise a screening; a screening in CHANGES_REQUESTED returns to DRAFT and increments revision_count"
    roles: [NurseCaseManager]
    code: 200
    input: ["expected_admission_at?", "intensive_therapy_documented?", "expected_functional_improvement_documented?", "prior_functional_level_documented?", "medical_supervision_documented?"]
    output: PreadmissionScreening
    side_effects: ["CHANGES_REQUESTED -> DRAFT with revision_count += 1 and reviewer fields cleared"]

  - method: POST
    path: "/screenings/{screeningId}/submit"
    description: "Submit a screening for rehab physician review"
    roles: [NurseCaseManager]
    code: 200
    input: []
    output: PreadmissionScreening
    side_effects: ["DRAFT -> SUBMITTED"]

  - method: POST
    path: "/screenings/{screeningId}/review"
    description: "Record the rehab physician review decision (concurrence or change request)"
    roles: [RehabPhysician]
    code: 200
    input: [decision, "reviewer_note?"]
    output: PreadmissionScreening
    side_effects: ["SUBMITTED -> PHYSICIAN_CONCURRED or SUBMITTED -> CHANGES_REQUESTED; reviewed_by_clinician_id and reviewed_at set"]

  # ------------------------------------------------------------ Admission ----
  - method: POST
    path: "/admissions"
    description: "Open a pending admission bound to a concurred screening"
    roles: [NurseCaseManager]
    code: 201
    input: [patient_id, screening_id, "predecessor_admission_id?"]
    output: Admission
    side_effects:
      - "stay_status = PENDING; payment_status = NOT_PRICED; documentation_status = INCOMPLETE; compliance_class = PENDING_EVALUATION"
      - "facility_id copied from Patient.facility_id"

  - method: GET
    path: "/admissions/{admissionId}"
    description: "Read one admission with its three status dimensions and derived compliance fields"
    roles: [ComplianceOfficer, RehabPhysician, NurseCaseManager, TherapyLead, HimCoder]
    code: 200
    input: []
    output: Admission
    side_effects: []

  - method: GET
    path: "/admissions"
    description: "List admissions, filterable by facility, patient, screening, interrupted-stay linkage and status dimensions"
    roles: [ComplianceOfficer, RehabPhysician, NurseCaseManager, TherapyLead, HimCoder]
    code: 200
    input: ["facility_id?", "patient_id?", "screening_id?", "predecessor_admission_id?", "payment_consolidated_into_admission_id?", "stay_status?", "payment_status?", "compliance_class?", "limit?", "offset?"]
    output: Admission[]
    side_effects: []

  - method: POST
    path: "/admissions/{admissionId}/admit"
    description: "Admit the patient; enforces the 48-hour screening window, facility posture and interrupted-stay linkage, and pins the QRP penalty snapshot"
    roles: [NurseCaseManager]
    code: 200
    input: [admitted_at]
    output: Admission
    side_effects:
      - "stay_status PENDING -> ADMITTED; screening_window_hours, screening_compliant, cmg_tier, qrp_penalty_pct_snapshot set"
      - "When a predecessor is linked: this admission's payment_status NOT_PRICED -> CONSOLIDATED, chain head PRICED -> REOPENED with total_payment_cents 0, Facility.settled_payment_cents recomputed, COMPUTED reviews covering the head -> STALE, Facility.version += 1"

  - method: POST
    path: "/admissions/{admissionId}/deny"
    description: "Deny a pending admission after physician review"
    roles: [RehabPhysician]
    code: 200
    input: [denial_reason]
    output: Admission
    side_effects: ["stay_status PENDING -> ADMISSION_DENIED; compliance_class = EXCLUDED"]

  - method: POST
    path: "/admissions/{admissionId}/discharge"
    description: "Discharge the patient to a destination; runs the four-hop compliance cascade and prices the stay"
    roles: [NurseCaseManager]
    code: 200
    input: [discharged_at, discharge_destination, discharge_planned]
    output: Admission
    side_effects:
      - "stay_status ADMITTED -> DISCHARGED; OPEN weeks evaluated; compliance_class finalized; facility cohort, provisional percentage and posture recomputed; SUBMITTED screenings frozen or released"
      - "payment_status NOT_PRICED -> PRICED (or chain head REOPENED -> PRICED) with effective_los_days and total_payment_cents"
      - "Facility.settled_payment_cents recomputed; Facility.version += 1"

  - method: POST
    path: "/admissions/{admissionId}/rescind-interruption"
    description: "Unlink an interrupted-stay continuation that was attached in error and restore both stays' standalone pricing"
    roles: [ComplianceOfficer]
    code: 200
    input: [rescind_reason]
    output: Admission
    side_effects:
      - "payment_status CONSOLIDATED -> NOT_PRICED; interrupted_stay_flag = false; predecessor and consolidation links cleared"
      - "Chain head payment_status REOPENED -> PRICED with its standalone total_payment_cents restored"

  # ---------------------------------------------------- OverallPlanOfCare ----
  - method: POST
    path: "/plans-of-care"
    description: "Sign an individualized overall plan of care; supersedes any earlier plan for the admission (OCC on Admission.version)"
    roles: [RehabPhysician]
    code: 201
    input: [admission_id, expected_admission_version, target_los_days, weekly_minutes_target, disciplines, "three_hour_rule_mode?"]
    output: OverallPlanOfCare
    side_effects:
      - "status = ACTIVE; authored_by_clinician_id = X-User-ID; signed_at = current clock"
      - "Prior ACTIVE plan of the admission -> SUPERSEDED"
      - "Admission.documentation_status INCOMPLETE -> POC_SIGNED; Admission.poc_signed_within_deadline recomputed; increments Admission.version by 1"

  - method: GET
    path: "/plans-of-care/{planId}"
    description: "Read one plan of care"
    roles: [ComplianceOfficer, RehabPhysician, NurseCaseManager, TherapyLead, HimCoder]
    code: 200
    input: []
    output: OverallPlanOfCare
    side_effects: []

  - method: GET
    path: "/plans-of-care"
    description: "List plans of care, filterable by admission, author and status"
    roles: [ComplianceOfficer, RehabPhysician, NurseCaseManager, TherapyLead, HimCoder]
    code: 200
    input: ["admission_id?", "authored_by_clinician_id?", "status?", "limit?", "offset?"]
    output: OverallPlanOfCare[]
    side_effects: []

  # --------------------------------------------------------- TherapyWeek ----
  - method: POST
    path: "/therapy-weeks"
    description: "Open a 7-day therapy measurement window; pins evaluation_mode from the ACTIVE plan of care"
    roles: [TherapyLead]
    code: 201
    input: [admission_id, week_index, week_start_date]
    output: TherapyWeek
    side_effects: ["status = OPEN; week_end_date = week_start_date + 6 days; evaluation_mode pinned; counters 0"]

  - method: GET
    path: "/therapy-weeks/{weekId}"
    description: "Read one therapy week with its delivered minutes and qualifying-day count"
    roles: [ComplianceOfficer, RehabPhysician, NurseCaseManager, TherapyLead, HimCoder]
    code: 200
    input: []
    output: TherapyWeek
    side_effects: []

  - method: GET
    path: "/therapy-weeks"
    description: "List therapy weeks, filterable by admission, status, index and exception grantor"
    roles: [ComplianceOfficer, RehabPhysician, NurseCaseManager, TherapyLead, HimCoder]
    code: 200
    input: ["admission_id?", "exception_granted_by_clinician_id?", "status?", "week_index?", "limit?", "offset?"]
    output: TherapyWeek[]
    side_effects: []

  - method: POST
    path: "/therapy-weeks/{weekId}/evaluate"
    description: "Evaluate the three-hour rule for the week under its pinned mode"
    roles: [TherapyLead]
    code: 200
    input: []
    output: TherapyWeek
    side_effects: ["OPEN -> MET or NOT_MET; admission therapy_weeks_satisfied and total_credited_minutes recomputed"]

  - method: POST
    path: "/therapy-weeks/{weekId}/exception"
    description: "Grant a documented physician exception to a week that failed the three-hour rule"
    roles: [RehabPhysician]
    code: 200
    input: [exception_reason]
    output: TherapyWeek
    side_effects:
      - "NOT_MET -> EXCEPTION_GRANTED; exception_granted_by_clinician_id = X-User-ID"
      - "Admission.therapy_weeks_satisfied recomputed; when the admission is DISCHARGED its compliance_class and the facility posture are recomputed"

  # ------------------------------------------------------ TherapySession ----
  - method: POST
    path: "/therapy-sessions"
    description: "Schedule a therapy session; resolves its therapy week, credits minutes by modality and enforces overlap, rest-buffer and daily-cap rules"
    roles: [TherapyLead]
    code: 201
    input: [admission_id, clinician_id, discipline, modality, start_at, end_at, "group_size?"]
    output: TherapySession
    side_effects: ["status = SCHEDULED; therapy_week_id resolved; session_date, raw_minutes and credited_minutes computed"]

  - method: GET
    path: "/therapy-sessions/{sessionId}"
    description: "Read one therapy session with its credited minutes"
    roles: [ComplianceOfficer, RehabPhysician, NurseCaseManager, TherapyLead, HimCoder]
    code: 200
    input: []
    output: TherapySession
    side_effects: []

  - method: GET
    path: "/therapy-sessions"
    description: "List therapy sessions, filterable by admission, week, clinician, status and calendar date"
    roles: [ComplianceOfficer, RehabPhysician, NurseCaseManager, TherapyLead, HimCoder]
    code: 200
    input: ["admission_id?", "therapy_week_id?", "clinician_id?", "status?", "session_date?", "limit?", "offset?"]
    output: TherapySession[]
    side_effects: []

  - method: POST
    path: "/therapy-sessions/{sessionId}/deliver"
    description: "Document a scheduled session as delivered, crediting its minutes to the week"
    roles: [TherapyLead]
    code: 200
    input: []
    output: TherapySession
    side_effects: ["SCHEDULED -> DELIVERED; week delivered_credited_minutes += credited_minutes; week re-evaluated when already MET or NOT_MET"]

  - method: POST
    path: "/therapy-sessions/{sessionId}/void"
    description: "Void a session; a delivered session's minutes are removed from the week exactly"
    roles: [TherapyLead]
    code: 200
    input: [void_reason]
    output: TherapySession
    side_effects: ["-> VOIDED; when the session was DELIVERED the week's delivered_credited_minutes -= credited_minutes and the week is re-evaluated"]

  # ------------------------------------------------------- TeamConference ----
  - method: POST
    path: "/team-conferences"
    description: "Record the weekly interdisciplinary team conference for a therapy week"
    roles: [NurseCaseManager]
    code: 201
    input: [admission_id, therapy_week_id, led_by_clinician_id, participant_clinician_ids, held_at]
    output: TeamConference
    side_effects: ["status = RECORDED when the current clock date <= week_end_date, else LATE_RECORDED; Admission.conference_compliant recomputed"]

  - method: GET
    path: "/team-conferences/{conferenceId}"
    description: "Read one team conference record"
    roles: [ComplianceOfficer, RehabPhysician, NurseCaseManager, TherapyLead, HimCoder]
    code: 200
    input: []
    output: TeamConference
    side_effects: []

  - method: GET
    path: "/team-conferences"
    description: "List team conferences, filterable by admission, therapy week, lead physician and status"
    roles: [ComplianceOfficer, RehabPhysician, NurseCaseManager, TherapyLead, HimCoder]
    code: 200
    input: ["admission_id?", "therapy_week_id?", "led_by_clinician_id?", "status?", "limit?", "offset?"]
    output: TeamConference[]
    side_effects: []

  # ----------------------------------------- PatientAssessmentInstrument ----
  - method: POST
    path: "/assessments"
