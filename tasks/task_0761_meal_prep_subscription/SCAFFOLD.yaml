# =============================================================================
# PRD Benchmark Seed Tables — task_0761_meal_prep_subscription
# Difficulty: Expert
# =============================================================================

scenario: |
  Meal-Prep & Macro-Meal Subscription (Factor/Trifecta style): plan & meals-per-week,
  menu selection & dietary/macro filter, recurring billing & skip/pause, cold-pack shipping
  zone & cutoff, allergen/nutrition labeling, kitchen production & par, swap/credit & refund,
  referral

domain_name: meal-prep-subscription
api_prefix: ""   # flat topology: every resource is a top-level absolute path

complexity_profile:
  primary_archetype: quota_allocation          # kitchen production par competed for across subscribers per delivery date
  secondary_archetype: pricing_engine          # tiered plan pricing, cold-pack/shipping fees, credits, dual-variant refunds
  complexity_layers:
    - scheduled_deferred_actions               # weekly delivery cycle gated by a per-box cutoff on a logical clock
    - rate_threshold_triggers                  # free-ship meal threshold, par exhaustion, buffer-gap boundary
    - optimistic_concurrency                   # OCC on Subscription.version for plan-change supersede
    - derived_field_reconciliation             # par_remaining, wallet_credit_cents, box money fields kept consistent

  entity_topology: flat                         # peer entities linked by FK fields; no nested ownership URLs beyond convenience sub-resources
  state_machine_shape: parallel                 # Box carries independent fulfillment_status x billing_status; ProductionRun is cyclic
  relationship_patterns:
    - one_to_many                               # Subscription -> Box, Box -> BoxItem, Customer -> Subscription
    - many_to_many                              # Referral is a junction of two Customers (referrer, referee)
    - cross_aggregate                           # BoxItem selection reaches across to ProductionRun capacity
  role_model: peer_roles                        # PlatformAdmin owns config/ops; Customer owns their own subscription surface
  consistency_model: immediate                  # all cascades resolve inside the triggering request

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: ShippingZone
    parent: null
    common_fields: true
    fields:
      - { name: zone_code, type: string, source: input, description: "Human code, unique across zones (e.g. WEST)", constraints: "unique; non-empty" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: requires_cold_pack, type: boolean, source: input, default: true, description: "Whether shipments to this zone need a cold pack (adds cold_pack_fee_cents)" }
      - { name: base_shipping_fee_cents, type: integer, source: input, description: "Shipping fee charged when a box does not meet the free-ship meal threshold", constraints: ">= 0" }
      - { name: cold_pack_fee_cents, type: integer, source: input, description: "Flat cold-pack surcharge applied when requires_cold_pack is true", constraints: ">= 0" }
      - { name: order_lead_days, type: integer, source: input, description: "Days before a box delivery_date that its selection cutoff falls", constraints: ">= 0" }
      - { name: cutoff_time_utc, type: string, source: input, description: "Wall-clock UTC time-of-day (HH:MM) at which selection closes on the cutoff day", constraints: "matches ^[0-2][0-9]:[0-5][0-9]$" }

  - name: Plan
    parent: null
    common_fields: true
    fields:
      - { name: plan_code, type: string, source: input, description: "Human code, unique across plans (e.g. PRO)", constraints: "unique; non-empty" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: meals_per_week, type: integer, source: input, description: "Target meals delivered per weekly box", constraints: ">= 1" }
      - { name: price_per_meal_cents, type: integer, source: input, description: "Per-meal list price in cents for this tier", constraints: ">= 1" }

  - name: Meal
    parent: null
    common_fields: true
    fields:
      - { name: meal_code, type: string, source: input, description: "Human code, unique across meals", constraints: "unique; non-empty" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: protein_g, type: integer, source: input, description: "Grams of protein (nutrition label)", constraints: ">= 0" }
      - { name: carb_g, type: integer, source: input, description: "Grams of carbohydrate (nutrition label)", constraints: ">= 0" }
      - { name: fat_g, type: integer, source: input, description: "Grams of fat (nutrition label)", constraints: ">= 0" }
      - { name: calories, type: integer, source: input, description: "Calories (nutrition label)", constraints: ">= 0" }
      - { name: allergens, type: array, source: input, default: [], description: "Allergen tokens present in the meal (e.g. PEANUT, DAIRY, GLUTEN, SOY, EGG, SHELLFISH)" }
      - { name: dietary_tags, type: array, source: input, default: [], description: "Dietary/macro tags for menu filtering (e.g. KETO, VEGAN, HIGH_PROTEIN, LOW_CARB)" }

  - name: ProductionRun
    parent: null
    common_fields: true
    fields:
      - { name: meal_id, type: string, source: input, description: "FK -> Meal.id; the meal this kitchen run produces" }
      - { name: delivery_date, type: string, source: input, description: "ISO date (YYYY-MM-DD) of the delivery week this run's servings are available for; must equal a Box.delivery_date to be selectable" }
      - { name: line_code, type: string, source: input, description: "Kitchen production line identifier; runs on the same line must not overlap within the cleaning buffer" }
      - { name: window_start, type: datetime, source: input, description: "ISO 8601 UTC start of the prep window on line_code" }
      - { name: window_end, type: datetime, source: input, description: "ISO 8601 UTC end of the prep window on line_code", constraints: "window_end > window_start" }
      - { name: par_total, type: integer, source: input, description: "Total servings produced by this run", constraints: ">= 0" }
      - { name: par_reserved, type: integer, source: computed, default: 0, description: "Servings reserved by SELECTED BoxItems referencing this run; never exceeds par_total" }
      - { name: par_remaining, type: integer, source: computed, description: "par_total - par_reserved; never negative" }
      - { name: status, type: enum, source: system, description: "Lifecycle state", constraints: "SCHEDULED | AVAILABLE | SOLD_OUT | COMPLETED | CANCELLED" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Account email, unique across customers", constraints: "unique; non-empty" }
      - { name: full_name, type: string, source: input, description: "Customer display name" }
      - { name: shipping_zone_id, type: string, source: input, description: "FK -> ShippingZone.id; determines cutoff lead and cold-pack/shipping fees for this customer's boxes" }
      - { name: allergen_exclusions, type: array, source: input, default: [], description: "Allergen tokens the customer must never receive; a meal sharing any token is blocked at selection" }
      - { name: referral_code, type: string, source: system, description: "This customer's own shareable referral code (server-minted, unique)", constraints: "unique" }
      - { name: referred_by_code, type: string, source: input, required: false, description: "Another customer's referral_code supplied at signup; creates a PENDING Referral" }
      - { name: wallet_credit_cents, type: integer, source: computed, default: 0, description: "Signed sum of all CreditLedger.amount_cents for this customer; never negative" }
      - { name: status, type: enum, source: system, description: "Account lifecycle", constraints: "ACTIVE | CANCELLED" }

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; owner of this subscription" }
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; the currently effective plan" }
      - { name: meals_per_week, type: integer, source: computed, description: "Snapshot of the effective Plan.meals_per_week; re-snapshotted when a PlanChange applies" }
      - { name: status, type: enum, source: system, description: "Subscription lifecycle", constraints: "ACTIVE | CANCELLED" }
      # common_fields supplies `version` — the OCC parent field guarded by plan-change creation (§1.2.1)

  - name: PauseWindow
    parent: Subscription
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id; the paused subscription" }
      - { name: start_date, type: string, source: input, description: "ISO date (YYYY-MM-DD), inclusive start of the pause interval" }
      - { name: end_date, type: string, source: input, description: "ISO date (YYYY-MM-DD), EXCLUSIVE end of the pause interval; a box whose delivery_date is in [start_date, end_date) is auto-skipped", constraints: "end_date > start_date" }
      - { name: status, type: enum, source: system, description: "Pause lifecycle; only SCHEDULED windows participate in overlap checks", constraints: "SCHEDULED | CANCELLED" }

  - name: PlanChange
    parent: Subscription
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id; the subscription being re-tiered" }
      - { name: from_plan_id, type: string, source: system, description: "FK -> Plan.id; the plan effective when this change was requested" }
      - { name: to_plan_id, type: string, source: input, description: "FK -> Plan.id; the requested target plan" }
      - { name: effective_date, type: string, source: input, description: "ISO date (YYYY-MM-DD); the change applies to boxes with delivery_date on or after this date" }
      - { name: status, type: enum, source: system, description: "Change lifecycle", constraints: "PENDING | APPLIED | SUPERSEDED | CANCELLED" }

  - name: Box
    parent: Subscription
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id; the subscription this weekly box belongs to" }
      - { name: delivery_date, type: string, source: input, description: "ISO date (YYYY-MM-DD) of delivery; unique per subscription" }
      - { name: cutoff_at, type: datetime, source: computed, description: "ISO 8601 UTC instant selection closes; = delivery_date minus zone.order_lead_days at zone.cutoff_time_utc" }
      - { name: plan_price_per_meal_cents, type: integer, source: computed, description: "Snapshot of the effective Plan.price_per_meal_cents at box creation" }
      - { name: meals_target, type: integer, source: computed, description: "Snapshot of Subscription.meals_per_week at box creation" }
      - { name: base_shipping_fee_cents, type: integer, source: computed, description: "Snapshot of the customer's ShippingZone.base_shipping_fee_cents" }
      - { name: cold_pack_fee_snapshot_cents, type: integer, source: computed, description: "zone.cold_pack_fee_cents if zone.requires_cold_pack else 0, snapshotted at creation" }
      - { name: is_first_box, type: boolean, source: computed, description: "True iff no Box for this customer has an earlier created_at (customer's chronologically first box); drives referee discount and referral reward" }
      - { name: fulfillment_status, type: enum, source: system, description: "Fulfillment dimension", constraints: "OPEN | LOCKED | SHIPPED | DELIVERED | SKIPPED | CANCELLED" }
      - { name: billing_status, type: enum, source: system, description: "Billing dimension, evolves independently of fulfillment", constraints: "UNCHARGED | PENDING | CHARGED | CHARGE_FAILED | REFUNDED | WAIVED" }
      - { name: subtotal_cents, type: integer, source: computed, description: "plan_price_per_meal_cents * sum(SELECTED BoxItem.quantity)" }
      - { name: discount_cents, type: integer, source: computed, default: 0, description: "First-box referee discount, per-line-rounded then summed (see referee_first_box_discount)" }
      - { name: shipping_fee_cents, type: integer, source: computed, default: 0, description: "0 if meals_count >= FREE_SHIP_MIN_MEALS else base_shipping_fee_cents" }
      - { name: cold_pack_fee_cents, type: integer, source: computed, default: 0, description: "cold_pack_fee_snapshot_cents applied to the charge" }
      - { name: credit_applied_cents, type: integer, source: computed, default: 0, description: "min(gross, customer.wallet_credit_cents) consumed at charge time" }
      - { name: total_charged_cents, type: integer, source: computed, default: 0, description: "Final amount billed to original payment; gross minus credit_applied" }
      - { name: refund_cents, type: integer, source: computed, default: 0, description: "Amount returned on cancel; variant depends on pre-ship vs post-ship (see box_refund)" }
      - { name: refund_destination, type: enum, source: system, default: NONE, description: "Where a refund went", constraints: "NONE | ORIGINAL_PAYMENT | WALLET_CREDIT" }

  - name: BoxItem
    parent: Box
    common_fields: true
    fields:
      - { name: box_id, type: string, source: system, description: "FK -> Box.id; the box this selection line belongs to" }
      - { name: meal_id, type: string, source: input, description: "FK -> Meal.id; the selected meal" }
      - { name: quantity, type: integer, source: input, default: 1, description: "Servings of this meal in the box", constraints: ">= 1" }
      - { name: reserved_run_id, type: string, source: system, description: "FK -> ProductionRun.id; the run whose par this line reserves (resolved at selection; null once SWAPPED_OUT/REMOVED)" }
      - { name: line_gross_cents, type: integer, source: computed, description: "box.plan_price_per_meal_cents * quantity" }
      - { name: status, type: enum, source: system, description: "Line lifecycle; only SELECTED lines reserve par and enter subtotal", constraints: "SELECTED | SWAPPED_OUT | REMOVED" }

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: referrer_customer_id, type: string, source: system, description: "FK -> Customer.id; the customer whose code was used" }
      - { name: referee_customer_id, type: string, source: system, description: "FK -> Customer.id; the newly-signed-up customer" }
      - { name: code, type: string, source: system, description: "The referral_code presented at signup" }
      - { name: reward_cents, type: integer, source: computed, default: 0, description: "Referrer reward granted at qualification (see referral_reward)" }
      - { name: status, type: enum, source: system, description: "Referral lifecycle", constraints: "PENDING | REWARDED | EXPIRED" }

  - name: CreditLedger
    parent: null
    common_fields: false   # append-only event: carries only id + created_at, never mutated
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; wallet owner this entry adjusts" }
      - { name: box_id, type: string, source: system, required: false, description: "FK -> Box.id; the box that generated or consumed this credit (null for referral rewards)" }
      - { name: amount_cents, type: integer, source: system, description: "Signed adjustment: positive grants wallet credit, negative consumes it" }
      - { name: reason, type: enum, source: system, description: "Why the entry exists", constraints: "REFERRAL_REWARD | SWAP_CREDIT | REFUND_CREDIT | CREDIT_APPLIED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  # --- Subscription: simple lifecycle (pausing is scheduled via PauseWindow, not a status) ---
  - entity: Subscription
    field: status
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: Customer
        preconditions:
          - "acting Customer (X-User-ID) owns the subscription"
        side_effects:
          - "every non-terminal Box of this subscription (fulfillment_status IN {OPEN}) transitions OPEN->CANCELLED via the box cancel cascade"
          - "every SCHEDULED PauseWindow of this subscription -> CANCELLED"
          - "every PENDING PlanChange of this subscription -> CANCELLED"
          - "increments Subscription.version by 1"

  # --- ProductionRun: CYCLIC availability (non-linear instance A for rule_id non_linear_state_machine) ---
  - entity: ProductionRun
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: AVAILABLE
        trigger: "POST /production-runs/{id}/open"
        actor: PlatformAdmin
        preconditions:
          - "no other ProductionRun on the same line_code overlaps [window_start, window_end] widened by LINE_BUFFER_MINUTES (checked at create, re-affirmed here)"
        side_effects:
          - "run becomes selectable by BoxItems for its (meal_id, delivery_date)"
      - from: AVAILABLE
        to: SOLD_OUT
        trigger: "system: par_remaining reaches 0 after a BoxItem reserves the last serving"
        actor: system
        preconditions:
          - "par_remaining == 0"
        side_effects: []
        note: "auto-transition inside POST /boxes/{id}/items when the reservation drives par_remaining to exactly 0"
      - from: SOLD_OUT
        to: AVAILABLE
        trigger: "system: par_remaining rises above 0 after a SELECTED BoxItem releases servings"
        actor: system
        preconditions:
          - "par_remaining > 0"
        side_effects: []
        note: "auto-transition inside item removal / swap / box cancel / box skip when a release frees a serving — closes the cycle SOLD_OUT->AVAILABLE->SOLD_OUT"
      - from: AVAILABLE
        to: CANCELLED
        trigger: "POST /production-runs/{id}/cancel"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "for each SELECTED BoxItem whose reserved_run_id == this run AND whose Box.fulfillment_status == OPEN: BoxItem -> REMOVED, release its par, and grant the customer a SWAP_CREDIT CreditLedger entry of amount = line_gross_cents"
      - from: SOLD_OUT
        to: CANCELLED
        trigger: "POST /production-runs/{id}/cancel"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "same cascade as AVAILABLE->CANCELLED"
      - from: AVAILABLE
        to: COMPLETED
        trigger: "POST /production-runs/{id}/complete"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "run frozen; no further reservations accepted"

  # --- Box fulfillment dimension (parallel dimension 1 — non-linear instance B: parallel x billing) ---
  - entity: Box
    field: fulfillment_status
    initial_state: OPEN
    terminal_states: [DELIVERED, SKIPPED, CANCELLED]
    transitions:
      - from: OPEN
        to: SKIPPED
        trigger: "POST /boxes/{id}/skip  (or auto at creation if delivery_date falls inside a SCHEDULED PauseWindow)"
        actor: Customer
        preconditions:
          - "logical clock < box.cutoff_at (strictly before cutoff)"
          - "box.fulfillment_status == OPEN"
        side_effects:
          - "billing_status -> WAIVED"
          - "for each SELECTED BoxItem: BoxItem -> REMOVED and its reserved run's par_reserved decremented (each release may flip that run SOLD_OUT->AVAILABLE)"
      - from: OPEN
        to: LOCKED
        trigger: "POST /boxes/{id}/lock  (system/ops at cutoff)"
        actor: PlatformAdmin
        preconditions:
          - "logical clock >= box.cutoff_at (cutoff is inclusive)"
          - "Subscription.status == ACTIVE"
          - "at least one SELECTED BoxItem exists"
        side_effects:
          - "compute box_charge fields (subtotal_cents, discount_cents, shipping_fee_cents, cold_pack_fee_cents, credit_applied_cents, total_charged_cents)"
          - "billing_status UNCHARGED -> PENDING"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /boxes/{id}/cancel"
        actor: Customer
        preconditions:
          - "box.fulfillment_status == OPEN"
        side_effects:
          - "billing_status -> WAIVED (nothing was charged)"
          - "for each SELECTED BoxItem: BoxItem -> REMOVED and release par (may flip run SOLD_OUT->AVAILABLE)"
          - "refund_cents = 0; refund_destination = NONE"
      - from: LOCKED
        to: SHIPPED
        trigger: "POST /boxes/{id}/ship"
        actor: PlatformAdmin
        preconditions:
          - "billing_status == CHARGED"
        side_effects:
          - "if box.is_first_box AND the customer is the referee of a PENDING Referral: that Referral -> REWARDED (fires referral_reward cascade — see §1.2 Referral)"
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /boxes/{id}/deliver"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: LOCKED
        to: CANCELLED
        trigger: "POST /boxes/{id}/cancel  (pre-ship)"
        actor: PlatformAdmin
        preconditions:
          - "billing_status IN {CHARGED, PENDING, CHARGE_FAILED}"
        side_effects:
          - "box_refund variant = pre_ship: refund_cents = total_charged_cents; refund_destination = ORIGINAL_PAYMENT"
          - "if billing_status == CHARGED: billing_status -> REFUNDED and any credit_applied_cents is restored to the wallet via a positive REFUND_CREDIT CreditLedger entry"
          - "for each SELECTED BoxItem: BoxItem -> REMOVED and release par (may flip run SOLD_OUT->AVAILABLE)"
      - from: SHIPPED
        to: CANCELLED
        trigger: "POST /boxes/{id}/cancel  (post-ship)"
        actor: PlatformAdmin
        preconditions:
          - "billing_status == CHARGED"
        side_effects:
          - "box_refund variant = post_ship: refund_cents = total_charged_cents - shipping_fee_cents - cold_pack_fee_cents (meal value only)"
          - "refund_destination = WALLET_CREDIT: a positive REFUND_CREDIT CreditLedger entry of refund_cents is written and wallet_credit_cents recomputes upward"
          - "billing_status -> REFUNDED"

  # --- Box billing dimension (parallel dimension 2) ---
  - entity: Box
    field: billing_status
    initial_state: UNCHARGED
    terminal_states: [WAIVED, REFUNDED]
    transitions:
      - from: UNCHARGED
        to: PENDING
        trigger: "POST /boxes/{id}/lock"
        actor: PlatformAdmin
        preconditions:
          - "fulfillment_status transitions OPEN->LOCKED in the same request"
        side_effects:
          - "charge amounts pinned onto the box"
      - from: PENDING
        to: CHARGED
        trigger: "POST /_payments/simulate  with outcome == SUCCEEDED"
        actor: PlatformAdmin
        preconditions:
          - "box.billing_status == PENDING"
        side_effects:
          - "credit_applied_cents consumed from wallet: a negative CREDIT_APPLIED CreditLedger entry of -credit_applied_cents is written (only if credit_applied_cents > 0)"
      - from: PENDING
        to: CHARGE_FAILED
        trigger: "POST /_payments/simulate  with outcome == DECLINED"
        actor: PlatformAdmin
        preconditions:
          - "box.billing_status == PENDING"
        side_effects:
          - "no wallet consumption; box remains LOCKED (fulfillment) and cannot ship — POST /boxes/{id}/ship on a CHARGE_FAILED box returns ERR_PAYMENT_DECLINED"
      - from: UNCHARGED
        to: WAIVED
        trigger: "POST /boxes/{id}/skip or OPEN->CANCELLED"
        actor: Customer
        preconditions: []
        side_effects: []
      - from: CHARGED
        to: REFUNDED
        trigger: "POST /boxes/{id}/cancel  (pre-ship or post-ship on a CHARGED box)"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "refund written per box_refund variant"

  # --- PlanChange: branching lifecycle ---
  - entity: PlanChange
    field: status
    initial_state: PENDING
    terminal_states: [APPLIED, SUPERSEDED, CANCELLED]
    transitions:
      - from: PENDING
        to: SUPERSEDED
        trigger: "system: a newer PlanChange is created for the same subscription"
        actor: system
        preconditions: []
        side_effects: []
        note: "fires inside POST /subscriptions/{id}/plan-changes as the OCC-guarded supersede cascade (§1.2.1)"
      - from: PENDING
        to: APPLIED
        trigger: "POST /subscriptions/{id}/boxes  when the new box's delivery_date >= effective_date"
        actor: system
        preconditions:
          - "PlanChange.status == PENDING"
          - "new Box.delivery_date >= PlanChange.effective_date"
        side_effects:
          - "Subscription.plan_id -> to_plan_id; Subscription.meals_per_week re-snapshotted from the new plan; increments Subscription.version by 1"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: Customer
        preconditions: []
        side_effects: []

  # --- Referral: qualify-or-expire ---
  - entity: Referral
    field: status
    initial_state: PENDING
    terminal_states: [REWARDED, EXPIRED]
    transitions:
      - from: PENDING
        to: REWARDED
        trigger: "system: the referee's is_first_box Box transitions LOCKED->SHIPPED"
        actor: system
        preconditions:
          - "referee Customer.status == ACTIVE"
          - "the shipped Box.is_first_box == true and belongs to the referee"
        side_effects:
          - "reward_cents = referral_reward(referee's effective plan)"
          - "write a positive REFERRAL_REWARD CreditLedger entry of reward_cents to the referrer; referrer.wallet_credit_cents recomputes upward"
      - from: PENDING
        to: EXPIRED
        trigger: "POST /subscriptions/{id}/cancel  when the referee cancels before any box ships (or referee never ships within REFERRAL_EXPIRY_DAYS)"
        actor: system
        preconditions:
          - "no is_first_box Box of the referee has reached SHIPPED"
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: plan-change-supersede-stale-subscription
    parent_entity: Subscription
    write_endpoint: "POST /subscriptions/{id}/plan-changes"
    occ_field: "expected_subscription_version"
    description: |
      Creating a PlanChange against a Subscription whose version has advanced
      since the client last observed it is rejected with a stale-version error.
      A new PlanChange legitimately supersedes any prior PENDING PlanChange (a
      subscriber may re-decide their target tier), so a second sequential create
      that still carries the previously-observed version — which the first
      create advanced when it superseded the prior change — is a stale write.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  # ---- Combinatorial mode (a): >=3 inputs, nested min/max, conditional branches ----
  - name: box_charge
    trigger: "POST /boxes/{id}/lock (OPEN->LOCKED)"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is PINNED (values are well-defined):
      meals_count   = sum(BoxItem.quantity for items with status == SELECTED on this box)
      subtotal      = box.plan_price_per_meal_cents * meals_count
      discount      = referee_first_box_discount(box)            # 0 unless first-box referee
      shipping_fee  = 0 if meals_count >= FREE_SHIP_MIN_MEALS else box.base_shipping_fee_cents
      cold_pack_fee = box.cold_pack_fee_snapshot_cents           # already 0 if zone did not require it
      gross         = subtotal - discount + shipping_fee + cold_pack_fee   # gross floored at 0
      credit_applied = min(gross, customer.wallet_credit_cents)  # never exceeds gross nor wallet
      total_charged  = gross - credit_applied
      # credit_applied is only CONSUMED (ledgered) when billing reaches CHARGED, not at LOCK.
    input_set: "BoxItems on this box with status == SELECTED; the box's own snapshot fields; the owning Customer.wallet_credit_cents at lock time"
    constants:
      FREE_SHIP_MIN_MEALS: 12
    precision: "integer cents; no rounding needed here (discount already rounded per-line by referee_first_box_discount)"
    variants: []
    note: "Rule combinatorial_formula mode (a): three-plus inputs (meals_count, zone fees, wallet) with conditional shipping branch and nested min for credit."

  # ---- Combinatorial mode (b): nested rounding where order matters ----
  - name: referee_first_box_discount
    trigger: "POST /boxes/{id}/lock, and re-previewed on selection changes"
    algorithm: aggregation
    formula: |
      # Applies ONLY when box.is_first_box AND owning Customer.referred_by_code is non-null.
      # ROUNDING ORDER IS PINNED: round EACH line's discount to whole cents, THEN sum.
      # (round-per-line-then-sum, NOT sum-then-round — the two diverge in cents.)
      for each BoxItem with status == SELECTED:
        line_gross    = box.plan_price_per_meal_cents * quantity
        line_discount = round_half_up(line_gross * REFEREE_DISCOUNT_PCT)   # per-line rounding
      discount = sum(line_discount over SELECTED items)
      # if not first-box referee: discount = 0
    input_set: "SELECTED BoxItems on the box; box.is_first_box; Customer.referred_by_code"
    constants:
      REFEREE_DISCOUNT_PCT: 0.15
    precision: "round_half_up to whole cents, applied PER LINE before summing"
    variants: []
    note: "Rule combinatorial_formula mode (b): 6 lines of 1099c -> per-line 165c each -> sum 990c; sum-then-round would give 989c. Order is pinned to per-line-then-sum = 990."

  # ---- Dual-variant instance 1 (Box domain) ----
  - name: box_refund
    trigger: "POST /boxes/{id}/cancel on a charged/locked box"
    algorithm: forward_looking
    formula: |
      # See variants — same charged box yields different refund amount AND destination.
    input_set: "the box's charge fields (total_charged_cents, shipping_fee_cents, cold_pack_fee_cents) and fulfillment_status at cancel time"
    constants: {}
    precision: "integer cents"
    variants:
      - name: pre_ship
        when: "fulfillment_status == LOCKED (charged but not yet shipped)"
        difference: "refund_cents = total_charged_cents (full charge returned); refund_destination = ORIGINAL_PAYMENT; consumed wallet credit is also restored via REFUND_CREDIT"
      - name: post_ship
        when: "fulfillment_status == SHIPPED (meals already dispatched)"
        difference: "refund_cents = total_charged_cents - shipping_fee_cents - cold_pack_fee_cents (meal value only; shipping and cold-pack are non-refundable); refund_destination = WALLET_CREDIT"

  # ---- Dual-variant instance 2 (Referral/Customer domain — DIFFERENT entity domain than box_refund) ----
  - name: referral_reward
    trigger: "Referral PENDING->REWARDED (referee's first box ships)"
    algorithm: threshold
    formula: |
      # Reward paid to the REFERRER, keyed on the REFEREE's effective plan tier.
    input_set: "referee's Subscription.meals_per_week (effective plan tier) at the moment their first box ships"
    constants:
      REFERRAL_BASE_CENTS: 2000
      PREMIUM_BONUS_CENTS: 1500
      PREMIUM_MIN_MEALS: 12
    precision: "integer cents"
    variants:
      - name: standard
        when: "referee effective plan meals_per_week < PREMIUM_MIN_MEALS"
        difference: "reward_cents = REFERRAL_BASE_CENTS = 2000"
      - name: premium_bonus
        when: "referee effective plan meals_per_week >= PREMIUM_MIN_MEALS"
        difference: "reward_cents = REFERRAL_BASE_CENTS + PREMIUM_BONUS_CENTS = 3500"

  # ---- Cutoff derivation (scheduled/deferred) ----
  - name: box_cutoff_at
    trigger: "POST /subscriptions/{id}/boxes (box creation)"
    algorithm: interval_merge
    formula: |
      cutoff_date = delivery_date - zone.order_lead_days days
      cutoff_at   = ISO8601(cutoff_date @ zone.cutoff_time_utc, UTC)
      # A box is OPEN while logical_clock < cutoff_at; lock is allowed once logical_clock >= cutoff_at (INCLUSIVE).
    input_set: "the box's delivery_date and the owning Customer's ShippingZone (order_lead_days, cutoff_time_utc)"
    constants: {}
    precision: "second-resolution ISO 8601 UTC"
    variants: []

  # ---- Wallet reconciliation (derived field) ----
  - name: wallet_credit_balance
    trigger: "any CreditLedger insert; read on any Customer fetch"
    algorithm: aggregation
    formula: |
      wallet_credit_cents = sum(CreditLedger.amount_cents for entries where customer_id == this customer)
      # Signed sum: REFERRAL_REWARD/SWAP_CREDIT/REFUND_CREDIT add, CREDIT_APPLIED subtracts.
      # Invariant: always == the signed ledger sum; never negative.
    input_set: "all CreditLedger rows for the customer (no status filter — the ledger is append-only)"
    constants: {}
    precision: "integer cents"
    variants: []

  # ---- Par reconciliation (derived field, quota) ----
  - name: run_par_remaining
    trigger: "any BoxItem reserve/release affecting the run"
    algorithm: aggregation
    formula: |
      par_reserved  = sum(BoxItem.quantity for items with status == SELECTED AND reserved_run_id == run.id)
      par_remaining = par_total - par_reserved      # never negative; a reservation that would drive it below 0 is rejected
    input_set: "SELECTED BoxItems whose reserved_run_id == run.id"
    constants: {}
    precision: "integer servings"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lower number wins on conflict)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /customers and GET /meals"

  - priority: 2
    category: auth
    check: "role is permitted for this operation per §1.7; entity_backed Customer must own the targeted resource (X-User-ID == owning Customer.id)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all role-restricted endpoints"

  - priority: 3
    category: existence
    check: "every id in the path (and required FK ids in the body) resolves to an existing resource, validated left-to-right"
    error_id: "ERR_ZONE_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_MEAL_NOT_FOUND | ERR_RUN_NOT_FOUND | ERR_CUSTOMER_NOT_FOUND | ERR_SUBSCRIPTION_NOT_FOUND | ERR_BOX_NOT_FOUND | ERR_BOX_ITEM_NOT_FOUND | ERR_PLAN_CHANGE_NOT_FOUND | ERR_REFERRAL_NOT_FOUND | ERR_CREDIT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path params or FK body fields"

  - priority: 4
    category: state
    check: "target resource is in a state from which the requested transition is defined in §1.2 (e.g. box.fulfillment_status == OPEN for skip/select; run.status == AVAILABLE for select; subscription.status == ACTIVE for plan-change)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: business_temporal
    check: "for selection-affecting operations (add item, swap, skip) the logical clock is strictly before box.cutoff_at; at or after cutoff_at the selection window is closed"
    error_id: ERR_CUTOFF_PASSED
    http_status: 409
    applies_to: "POST /boxes/{id}/items, POST /box-items/{id}/swap, POST /boxes/{id}/skip"

  - priority: 6
    category: business_safety
    check: "selected Meal.allergens shares no token with the owning Customer.allergen_exclusions"
    error_id: ERR_ALLERGEN_CONFLICT
    http_status: 422
    applies_to: "POST /boxes/{id}/items, POST /box-items/{id}/swap"

  - priority: 7
    category: business_constraint
    check: "for the (meal_id, box.delivery_date) there exists an AVAILABLE ProductionRun with par_remaining >= quantity; kitchen line runs do not violate the LINE_BUFFER_MINUTES buffer; pause windows do not overlap"
    error_id: "ERR_MEAL_SOLD_OUT | ERR_LINE_CONFLICT | ERR_PAUSE_OVERLAP"
    http_status: 409
    applies_to: "POST /boxes/{id}/items, POST /box-items/{id}/swap, POST /production-runs, POST /subscriptions/{id}/pause-windows"

  - priority: 8
    category: business_referential
    check: "the box's owning Subscription.status == ACTIVE for box creation and any selection change"
    error_id: ERR_SUBSCRIPTION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /subscriptions/{id}/boxes, POST /boxes/{id}/items, POST /box-items/{id}/swap"

  - priority: 9
    category: business_fiscal
    check: "OCC guard: expected_subscription_version equals the current Subscription.version on plan-change creation"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /subscriptions/{id}/plan-changes"

  - priority: 10
    category: business_fiscal
    check: "charge succeeds; a box whose payment_outcome_override is DECLINED cannot reach CHARGED and cannot ship"
    error_id: ERR_PAYMENT_DECLINED
    http_status: 402
    applies_to: "POST /_payments/simulate, POST /boxes/{id}/ship"

  - priority: 11
    category: business_constraint
    check: "request body well-formed: required fields present, enum members valid, integers within declared constraints, uniqueness (zone_code, plan_code, meal_code, email, box delivery_date per subscription) respected"
    error_id: "ERR_INVALID_REQUEST | ERR_INVALID_ENUM | ERR_DUPLICATE"
    http_status: 422
    applies_to: "all create/update endpoints"

  - priority: 12
    category: business_constraint
    check: "pagination params within bounds (1 <= limit <= 100, offset >= 0)"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"

# =============================================================================
# 1.5 API Endpoint Table  (paths are absolute; api_prefix == "")
# =============================================================================
endpoints:

  # ---------------- ShippingZone / Plan / Meal (config) ----------------
  - method: POST
    path: "/shipping-zones"
    description: "Create a shipping zone (cutoff lead + cold-pack/shipping fees)"
    roles: [PlatformAdmin]
    code: 201
    input: [zone_code, name, "requires_cold_pack?", base_shipping_fee_cents, cold_pack_fee_cents, order_lead_days, cutoff_time_utc]
    output: ShippingZone
    side_effects: []

  - method: POST
    path: "/plans"
    description: "Create a subscription plan tier"
    roles: [PlatformAdmin]
    code: 201
    input: [plan_code, name, meals_per_week, price_per_meal_cents]
    output: Plan
    side_effects: []

  - method: POST
    path: "/meals"
    description: "Create a menu meal with nutrition + allergen labeling"
    roles: [PlatformAdmin]
    code: 201
    input: [meal_code, name, protein_g, carb_g, fat_g, calories, "allergens?", "dietary_tags?"]
    output: Meal
    side_effects: []

  - method: GET
    path: "/meals"
    description: "Menu list with dietary/macro filter (public). exclude_allergen filters out meals containing the token; dietary_tag requires the tag; min_protein filters protein_g >= value"
    roles: [Anonymous, Customer, PlatformAdmin]
    code: 200
    input: ["dietary_tag?", "exclude_allergen?", "min_protein?", "limit?", "offset?"]
    output: Meal[]
    side_effects: []

  # ---------------- ProductionRun (kitchen + par + temporal) ----------------
  - method: POST
    path: "/production-runs"
    description: "Schedule a kitchen production run; validates line buffer/overlap and initializes par"
    roles: [PlatformAdmin]
    code: 201
    input: [meal_id, delivery_date, line_code, window_start, window_end, par_total]
    output: ProductionRun
    side_effects: ["status set to SCHEDULED", "reject with ERR_LINE_CONFLICT if a run on line_code overlaps [window_start,window_end] widened by LINE_BUFFER_MINUTES"]

  - method: POST
    path: "/production-runs/{id}/open"
    description: "Open a scheduled run for selection (SCHEDULED->AVAILABLE)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["status SCHEDULED->AVAILABLE"]

  - method: POST
    path: "/production-runs/{id}/cancel"
    description: "Cancel a run; removes affected open-box selections with SWAP_CREDIT compensation"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["status ->CANCELLED", "cascade: SELECTED BoxItems on OPEN boxes -> REMOVED + par release + SWAP_CREDIT ledger entry per affected customer"]

  - method: POST
    path: "/production-runs/{id}/complete"
    description: "Freeze a run (AVAILABLE->COMPLETED)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["status AVAILABLE->COMPLETED"]

  - method: GET
    path: "/production-runs/{id}"
    description: "Fetch a production run"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ProductionRun
    side_effects: []

  - method: GET
    path: "/production-runs"
    description: "List production runs, filterable by meal and delivery date (reverse-reach for ProductionRun.meal_id)"
    roles: [PlatformAdmin]
    code: 200
    input: ["meal_id?", "delivery_date?", "limit?", "offset?"]
    output: ProductionRun[]
    side_effects: []

  # ---------------- Customer ----------------
  - method: POST
    path: "/customers"
    description: "Register a customer; mints referral_code and, if referred_by_code is valid, creates a PENDING Referral"
    roles: [Anonymous]
    code: 201
    input: [email, full_name, shipping_zone_id, "allergen_exclusions?", "referred_by_code?"]
    output: Customer
    side_effects: ["mint unique referral_code", "if referred_by_code resolves to a Customer: create PENDING Referral(referrer, referee=this)"]

  - method: GET
    path: "/customers/{id}"
    description: "Fetch a customer (exposes referral_code and wallet_credit_cents)"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: GET
    path: "/customers"
    description: "List customers, filterable by shipping zone (reverse-reach for Customer.shipping_zone_id)"
    roles: [PlatformAdmin]
    code: 200
    input: ["shipping_zone_id?", "limit?", "offset?"]
    output: Customer[]
    side_effects: []

  - method: POST
    path: "/customers/{id}/credits"
    description: "Admin issues a goodwill/swap credit to a customer's wallet"
    roles: [PlatformAdmin]
    code: 201
    input: [amount_cents, reason]
    output: CreditLedger
    side_effects: ["append CreditLedger(reason=SWAP_CREDIT, amount_cents)", "recompute customer.wallet_credit_cents"]
    note: "reason is constrained to SWAP_CREDIT on this endpoint; other reasons are system-only"

  # ---------------- Subscription ----------------
  - method: POST
    path: "/subscriptions"
    description: "Create a subscription for the acting customer on a plan"
    roles: [Customer]
    code: 201
    input: [customer_id, plan_id]
    output: Subscription
    side_effects: ["status ACTIVE", "meals_per_week snapshotted from plan", "version = 1"]

  - method: GET
    path: "/subscriptions/{id}"
    description: "Fetch a subscription"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: []

  - method: GET
    path: "/subscriptions"
    description: "List subscriptions, filterable by customer and plan (reverse-reach for Subscription.customer_id and Subscription.plan_id)"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: ["customer_id?", "plan_id?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []

  - method: POST
    path: "/subscriptions/{id}/cancel"
    description: "Cancel a subscription and cascade to open boxes, scheduled pauses, pending plan-changes, and referral expiry"
    roles: [Customer]
    code: 200
    input: []
    output: Subscription
    side_effects: ["status ACTIVE->CANCELLED", "cascade per §1.2 Subscription", "version += 1"]

  - method: POST
    path: "/subscriptions/{id}/pause-windows"
    description: "Schedule a pause interval; rejects overlaps with existing SCHEDULED windows (adjacency allowed)"
    roles: [Customer]
    code: 201
    input: [start_date, end_date]
    output: PauseWindow
    side_effects: ["status SCHEDULED", "reject ERR_PAUSE_OVERLAP if [start_date,end_date) overlaps any SCHEDULED window of the subscription"]

  - method: GET
    path: "/subscriptions/{id}/pause-windows"
    description: "List a subscription's pause windows (reverse-reach for PauseWindow.subscription_id)"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: PauseWindow[]
    side_effects: []

  - method: POST
    path: "/subscriptions/{id}/plan-changes"
    description: "Request a plan tier change; supersedes any prior PENDING change. OCC-guarded on Subscription.version"
    roles: [Customer]
    code: 201
    input: [to_plan_id, effective_date, expected_subscription_version]
    output: PlanChange
    side_effects: ["prior PENDING PlanChange of this subscription -> SUPERSEDED", "increments Subscription.version by 1"]

  - method: GET
    path: "/plan-changes/{id}"
    description: "Fetch a plan change"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: PlanChange
    side_effects: []

  - method: GET
    path: "/plan-changes"
    description: "List plan changes, filterable by subscription and by from/to plan (reverse-reach for PlanChange.subscription_id, from_plan_id, to_plan_id)"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: ["subscription_id?", "from_plan_id?", "to_plan_id?", "limit?", "offset?"]
    output: PlanChange[]
    side_effects: []

  # ---------------- Box + selection ----------------
  - method: POST
    path: "/subscriptions/{id}/boxes"
    description: "Generate the weekly box for a delivery_date; snapshots pricing/zone/cutoff, applies any due plan-change, and auto-skips if the date falls in a scheduled pause"
    roles: [Customer, PlatformAdmin]
    code: 201
    input: [delivery_date]
    output: Box
    side_effects: ["reject ERR_SUBSCRIPTION_NOT_ACTIVE if subscription not ACTIVE", "apply PENDING PlanChange if delivery_date >= effective_date (bumps Subscription.version)", "snapshot plan_price_per_meal_cents/meals_target/zone fees/cutoff_at", "set is_first_box", "fulfillment OPEN, or SKIPPED+WAIVED if delivery_date in a SCHEDULED PauseWindow"]

  - method: GET
    path: "/boxes/{id}"
    description: "Fetch a box with all computed money fields"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: Box
    side_effects: []

  - method: GET
    path: "/boxes"
    description: "List boxes, filterable by subscription (reverse-reach for Box.subscription_id)"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: ["subscription_id?", "limit?", "offset?"]
    output: Box[]
    side_effects: []

  - method: POST
    path: "/boxes/{id}/items"
    description: "Select a meal into an OPEN box; enforces allergen exclusion and reserves kitchen par"
    roles: [Customer]
    code: 201
    input: [meal_id, "quantity?"]
    output: BoxItem
    side_effects: ["resolve AVAILABLE ProductionRun for (meal_id, box.delivery_date); reserve par (par_reserved += quantity)", "if par_remaining hits 0: run AVAILABLE->SOLD_OUT", "status SELECTED", "line_gross_cents computed"]

  - method: GET
    path: "/box-items/{id}"
    description: "Fetch a box item"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: BoxItem
    side_effects: []

  - method: GET
    path: "/box-items"
    description: "List box items, filterable by box, meal, and reserved run (reverse-reach for BoxItem.box_id, meal_id, reserved_run_id)"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: ["box_id?", "meal_id?", "reserved_run_id?", "limit?", "offset?"]
    output: BoxItem[]
    side_effects: []

  - method: POST
    path: "/box-items/{id}/swap"
    description: "Swap a SELECTED item to a different meal before cutoff; releases old par and reserves new"
    roles: [Customer]
    code: 201
    input: [new_meal_id, "quantity?"]
    output: BoxItem
    side_effects: ["old item -> SWAPPED_OUT + release its par (may flip old run SOLD_OUT->AVAILABLE)", "create new SELECTED BoxItem for new_meal_id + reserve par", "allergen + par + cutoff checks apply to the new meal"]

  - method: POST
    path: "/boxes/{id}/skip"
    description: "Skip the week's box before cutoff (fulfillment OPEN->SKIPPED, billing WAIVED)"
    roles: [Customer]
    code: 200
    input: []
    output: Box
    side_effects: ["OPEN->SKIPPED", "billing->WAIVED", "release par of all SELECTED items"]

  - method: POST
    path: "/boxes/{id}/lock"
    description: "Lock a box at/after cutoff; computes charge fields and moves billing UNCHARGED->PENDING"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Box
    side_effects: ["require clock >= cutoff_at, subscription ACTIVE, >=1 SELECTED item", "compute box_charge", "fulfillment OPEN->LOCKED, billing UNCHARGED->PENDING"]

  - method: POST
    path: "/boxes/{id}/ship"
    description: "Ship a charged box; fires referral reward when it is the referee's first box"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Box
    side_effects: ["require billing CHARGED (else ERR_PAYMENT_DECLINED on CHARGE_FAILED)", "fulfillment LOCKED->SHIPPED", "cascade: PENDING Referral of referee -> REWARDED + referral_reward credit"]

  - method: POST
    path: "/boxes/{id}/deliver"
    description: "Mark a shipped box delivered (SHIPPED->DELIVERED)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Box
    side_effects: ["fulfillment SHIPPED->DELIVERED"]

  - method: POST
    path: "/boxes/{id}/cancel"
    description: "Cancel a box; refund variant depends on pre-ship vs post-ship state; releases par"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: Box
    side_effects: ["fulfillment ->CANCELLED", "box_refund per variant (pre_ship -> ORIGINAL_PAYMENT full; post_ship -> WALLET_CREDIT meal-value)", "release par of SELECTED items", "billing REFUNDED/WAIVED accordingly"]

  # ---------------- Referral + credit ledger ----------------
  - method: GET
    path: "/referrals/{id}"
    description: "Fetch a referral"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: Referral
    side_effects: []

  - method: GET
    path: "/referrals"
    description: "List referrals, filterable by referrer/referee (reverse-reach for Referral.referrer_customer_id and referee_customer_id)"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: ["referrer_customer_id?", "referee_customer_id?", "limit?", "offset?"]
    output: Referral[]
    side_effects: []

  - method: GET
    path: "/credit-ledger/{id}"
    description: "Fetch a credit ledger entry"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: CreditLedger
    side_effects: []

  - method: GET
    path: "/credit-ledger"
    description: "List credit ledger entries, filterable by customer and box (reverse-reach for CreditLedger.customer_id and box_id)"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: ["customer_id?", "box_id?", "limit?", "offset?"]
    output: CreditLedger[]
    side_effects: []

  # ---------------- Test-driving (/_ namespace) ----------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time"
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["logical clock set to to_iso8601"]

  - method: POST
    path: "/_payments/simulate"
    description: "Execute the pending charge on a locked box (PENDING->CHARGED on SUCCEEDED, PENDING->CHARGE_FAILED on DECLINED)"
    roles: [PlatformAdmin]
    code: 200
    input: [box_id, outcome]
    output: Box
    side_effects: ["SUCCEEDED: billing PENDING->CHARGED + consume credit_applied via CREDIT_APPLIED ledger", "DECLINED: billing PENDING->CHARGE_FAILED"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED,       http: 401, condition: "Missing/unknown X-User-Role or missing X-User-ID on an authenticated endpoint" }
  - { id: ERR_UNAUTHORIZED,          http: 403, condition: "Role not permitted for the operation, or entity_backed Customer acting on a resource it does not own" }
  - { id: ERR_ZONE_NOT_FOUND,        http: 404, condition: "shipping_zone_id does not resolve to a ShippingZone" }
  - { id: ERR_PLAN_NOT_FOUND,        http: 404, condition: "plan_id / to_plan_id does not resolve to a Plan" }
  - { id: ERR_MEAL_NOT_FOUND,        http: 404, condition: "meal_id / new_meal_id does not resolve to a Meal" }
  - { id: ERR_RUN_NOT_FOUND,         http: 404, condition: "production run id in path does not resolve to a ProductionRun" }
  - { id: ERR_CUSTOMER_NOT_FOUND,    http: 404, condition: "customer id does not resolve to a Customer" }
  - { id: ERR_SUBSCRIPTION_NOT_FOUND,http: 404, condition: "subscription id does not resolve to a Subscription" }
  - { id: ERR_BOX_NOT_FOUND,         http: 404, condition: "box id / box_id does not resolve to a Box" }
  - { id: ERR_BOX_ITEM_NOT_FOUND,    http: 404, condition: "box item id does not resolve to a BoxItem" }
  - { id: ERR_PLAN_CHANGE_NOT_FOUND, http: 404, condition: "plan change id does not resolve to a PlanChange" }
  - { id: ERR_REFERRAL_NOT_FOUND,    http: 404, condition: "referral id does not resolve to a Referral" }
  - { id: ERR_CREDIT_NOT_FOUND,      http: 404, condition: "credit ledger id does not resolve to a CreditLedger" }
  - { id: ERR_INVALID_STATE,         http: 409, condition: "Requested transition not defined from the resource's current state (wrong fulfillment/billing/run/subscription/plan-change state)" }
  - { id: ERR_CUTOFF_PASSED,         http: 409, condition: "Selection-affecting op (add item/swap/skip) attempted when logical clock >= box.cutoff_at" }
  - { id: ERR_ALLERGEN_CONFLICT,     http: 422, condition: "Selected meal's allergens intersect the customer's allergen_exclusions" }
  - { id: ERR_MEAL_SOLD_OUT,         http: 409, condition: "No AVAILABLE ProductionRun for (meal_id, delivery_date) has par_remaining >= quantity" }
  - { id: ERR_LINE_CONFLICT,         http: 409, condition: "A new ProductionRun overlaps an existing run on the same line_code within LINE_BUFFER_MINUTES" }
  - { id: ERR_PAUSE_OVERLAP,         http: 409, condition: "A new PauseWindow [start_date,end_date) overlaps an existing SCHEDULED window on the subscription (adjacency permitted)" }
  - { id: ERR_SUBSCRIPTION_NOT_ACTIVE,http: 409, condition: "Box creation or selection change on a subscription whose status != ACTIVE" }
  - { id: ERR_STALE_VERSION,         http: 412, condition: "expected_subscription_version != current Subscription.version on plan-change creation" }
  - { id: ERR_PAYMENT_DECLINED,      http: 402, condition: "Charge simulated DECLINED, or ship attempted on a CHARGE_FAILED box" }
  - { id: ERR_INVALID_REQUEST,       http: 422, condition: "Missing required field, or numeric value violates a declared constraint" }
  - { id: ERR_INVALID_ENUM,          http: 422, condition: "Enum-typed field carries a value outside its declared set (e.g. reason, outcome)" }
  - { id: ERR_DUPLICATE,             http: 422, condition: "Uniqueness violation (zone_code/plan_code/meal_code/email, or duplicate Box.delivery_date for a subscription)" }
  - { id: ERR_INVALID_PAGINATION,    http: 400, condition: "limit outside [1,100] or offset < 0" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator: manages config (zones/plans/meals), kitchen production runs, box lock/ship/deliver, charge simulation, goodwill credits, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /shipping-zones, POST /plans, POST /meals"
      - "POST /production-runs (+ /open, /cancel, /complete)"
      - "POST /customers/{id}/credits"
      - "POST /boxes/{id}/lock, POST /boxes/{id}/ship, POST /boxes/{id}/deliver"
      - "POST /_clock/set_current_utc, POST /_payments/simulate"
      - "GET /customers (list), GET /production-runs (list/read)"
    shared_operations:
      - "POST /subscriptions/{id}/boxes (system generation), POST /boxes/{id}/cancel"
      - "all GET reads of subscriptions, boxes, box-items, plan-changes, referrals, credit-ledger, pause-windows"

  - name: Customer
    description: "Subscriber acting on their own subscription surface; X-User-ID is their Customer.id"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /subscriptions"
      - "POST /subscriptions/{id}/cancel, POST /subscriptions/{id}/pause-windows, POST /subscriptions/{id}/plan-changes"
      - "POST /boxes/{id}/items, POST /box-items/{id}/swap, POST /boxes/{id}/skip"
    shared_operations:
      - "POST /subscriptions/{id}/boxes, POST /boxes/{id}/cancel"
      - "GET reads of their own customer, subscriptions, boxes, box-items, plan-changes, pause-windows, referrals, credit-ledger"

  - name: Anonymous
    description: "Unauthenticated public surface: customer self-registration and public menu browsing"
    identity: opaque
    exclusive_operations:
      - "POST /customers"
    shared_operations:
      - "GET /meals (public menu with dietary/macro filter)"
