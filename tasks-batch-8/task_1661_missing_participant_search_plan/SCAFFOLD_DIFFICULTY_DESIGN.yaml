  - rule_id: compensating_invariant
    instances:
      - name: forfeiture_restoration_money_conservation
        grounds:
          - calculations.fund_conservation
          - state_machines.Participant.PENDING_ELECTION_to_FORFEITED
          - state_machines.Forfeiture.RECORDED_to_RESTORED
        distinguishing_aspect: |
          Conserved quantity = money (cents): the forfeiture (remaining ->
          forfeited) paired with its compensating restoration (forfeited ->
          remaining) leaves paid_out_cents + pbgc_transferred_cents +
          forfeited_cents + expense_paid_cents + remaining_undistributed_cents
          == total_plan_assets_cents == 1000000 at every stage, with zero drift.
        test_recipe:
          setup:
            - "Case (NOMINAL) in DISTRIBUTION_IN_PROGRESS with p1 800000 and p2 200000 vested 100%. p2's rollover payout has CLEARED (paid_out 200000, remaining 800000). p1 is MISSING with an exhausted, documented search."
