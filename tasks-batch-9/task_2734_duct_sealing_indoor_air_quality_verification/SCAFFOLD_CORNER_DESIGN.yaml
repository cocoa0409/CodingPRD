            - "${post_committed} == 307230 and ${post_remaining} == 4692770 == 5000000 - 307230, with ${post_paid} == 0: the commitment is visible in the read taken immediately after, with no lag"
            - "${again_committed} == 307230 and ${again_remaining} == 4692770: a second identical read returns the same numbers, so nothing is being recomputed differently on read (and the role of the reader does not change the values)"
            - "${listed_id} == ${claim_id} and ${listed_payable} == 307230: the new claim is in the filtered list on the very next call, with total_count == 1"
            - "${p_ds_count} == 1 and ${p_elig_count} == 1: duct_system_count was raised by the duct-system create and eligible_duct_system_count only by the screening that cleared it — neither waits for a later sweep"
            - "${t_open} == 0: complete-seal already decremented Technician.open_seal_job_count, so the counter matches its declared definition (SCHEDULED | MASKING | INJECTING | PAUSED) in the same instant the run closed"
