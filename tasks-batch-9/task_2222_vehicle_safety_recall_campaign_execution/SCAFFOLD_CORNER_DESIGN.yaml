          - validations.priority_44
        excluded_because:
          difficulty_instance: claim_state_beats_fiscal_returns_vehicle_not_repairable
          rationale: |
            Cross-category precedence on POST /repair-claims is proved by the two difficulty instances
            that construct simultaneous violations and pin which single error_id wins -- state over
            fiscal, and referential over temporal. A corner-case ordering check would need the same
            doubly-invalid payloads and would assert the same winning codes.

      - name: claim_priority_conflict_between_referential_and_temporal_checks
        claim_type: priority_conflict
        grounds:
          - validations.priority_25
          - validations.priority_27
        excluded_because:
          difficulty_instance: claim_referential_beats_temporal_returns_labor_op_not_effective
          rationale: |
            The only interesting conflict pair on this endpoint -- a labor operation that is both out
            of its effective window and (in the sibling case) owned by another campaign -- is already
            constructed there with the winning code pinned. Repeating it as a corner case would assert
            the identical single error_id from the identical payload.

      - name: wave_scheduled_thirteen_days_from_a_sibling_returns_mailing_too_close
