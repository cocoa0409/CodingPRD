              payload: { measured_egress_width_cm: 400, findings_count: 0, severity: "NONE" }
              as: SafetyOfficer
              as_user_id: "officer-2"
            - call: "POST /experience-runs/${run_id}/lift-suspension"
              payload: { clearing_inspection_id: "${insp_pass}", note: "corridor cleared and re-measured" }
              as: SafetyOfficer
              as_user_id: "officer-2"
            - call: "GET /safety-inspections"
              payload: { run_id: "${run_id}", status: "VOIDED" }
              as: SafetyOfficer
              as_user_id: "officer-2"
            - call: "GET /timed-entry-slots/${slot_id}"
              payload: {}
              as: ExperienceProducer
              as_user_id: "producer-1"
          assert:
            - "trigger 1 responds 200 with status VOIDED, outcome null, allowed_occupancy_cap 0, measured_egress_width_cm 0, severity NONE, findings_note 'inspector unavailable; reinspection rebooked', finalized_by_user_id null, finalized_at null and version 2"
            - "trigger 1 changed nothing outside the inspection: run.clearance_status is still SUSPENDED with suspending_inspection_id ${insp_fail}, and the run version is unchanged"
            - "trigger 2 responds 409 with data.error_id == ERR_INSPECTION_INVALID_STATE and findings_note still reads the FIRST note: VOIDED is terminal and the second void is inert"
            - "trigger 3 responds 409 with data.error_id == ERR_INSPECTION_INVALID_STATE and the row still has outcome null: a voided inspection can never be finalized into evidence"
            - "trigger 4 responds 409 with data.error_id == ERR_INSPECTION_PASS_MISSING - the VOIDED inspection is of the right run and the right type but is neither FINALIZED nor PASS - and afterwards run.clearance_status is still SUSPENDED, suspending_inspection_id is still ${insp_fail} and the slot is still SUSPENDED"
            - "trigger 5 responds 409 with data.error_id == ERR_INSPECTION_INVALID_STATE: FINALIZED is terminal too, so void cannot be used to retract a failure or its cascade"
            - "trigger 7 responds 200 with outcome PASS and allowed_occupancy_cap 197 (floor(400 / 2.03)), and PASS leaves run.effective_capacity at 120 and run.effective_capacity_cap at 0"
            - "trigger 8 responds 200: suspending_inspection_id and suspended_at are null and clearance_status is UNCLEARED, not CLEARED, because the approval-plus-staffing gate does not hold on this run"
            - "trigger 9 responds 200 with total_count == 1 and the single VOIDED row: the void is visible as a filterable record rather than a deletion"
            - "trigger 10 shows the slot back at status OPEN with released_capacity 20 and available_capacity 20: the lift reopened the slot because slot_start_utc is still in the future"

      - name: shift_room_link_resolves_only_within_the_shifts_own_run
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /staff-shifts]
          - endpoints[GET /staff-shifts]
          - entities.StaffShift
          - validations[priority 50]
          - errors[ERR_ROOM_NOT_FOUND]
        distinguishing_aspect: |
          StaffShift carries the only scoped optional link in the API: themed_room_id may be null, and
          when present it must name a room of the shift's OWN run - a run the caller never supplies,
          because run_id is copied from the staff member. So a room id that resolves perfectly well
          globally must still be refused, and the refusal is a 404 rather than a 409, because a room
          outside the scope is not visible to this shift at all. An implementation that validates
          themed_room_id with a plain existence lookup silently staffs one city's technician into
          another city's room; one that returns 409 instead of 404 leaks the existence of the other
          run's room. GET /staff-shifts?themed_room_id= is then the only reverse channel for the link.
        test_recipe:
          setup:
            - "One venue, one ACTIVE agreement whose territory_city_codes is ['NYC'], two kits and TWO runs on that venue: run_a with room_a (room_sequence 1) and run_b with room_b (room_sequence 1). Both runs are PLANNED."
            - "One PERFORMER staff member on run_a carrying both required certifications, trained to training_score 90 with 4 completed rehearsals, so readiness_score_audit is 96.00 and the member is CLEARED."
