              as: DataOps
              captures: { b_corr: $.data.id }
            - call: "POST /batches/${b_corr}/validate"
              payload: {}
              as: DataOps
            - call: "POST /batches/${b_corr}/accept"
              payload: {}
              as: DataOps
            - call: "POST /valuation-series"
              payload: { configuration_id: "${cfg_corr}", region_id: "${r_corr}", effective_from: "2026-09-01T00:00:00Z", cadence: "WEEKLY", external_key: "ser-corr" }
              as: ValuationAdmin
              captures: { s_corr: $.data.id }
            - call: "POST /valuation-series/${s_corr}/activate"
              payload: {}
              as: ValuationAdmin
            - call: "POST /valuation-editions"
              payload: { series_id: "${s_corr}", effective_at: "2026-09-01T00:00:00Z" }
              as: ValuationAdmin
              captures: { e_corr: $.data.id }
            - call: "POST /valuation-editions/${e_corr}/publish"
              payload: {}
              as: ValuationAdmin
          trigger:
            - call: "POST /corrections"
              payload: { batch_id: "${b_corr}", corrected_price_cents: 2400000 }
