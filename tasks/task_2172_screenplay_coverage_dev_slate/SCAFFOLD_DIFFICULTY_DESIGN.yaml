          SUBMITTED -> APPROVED: approval completes the assignment (link 1), which is what moves the
          submission to TRACKED (link 2), which is what mints the TrackingBoardEntry with
          heat_score 130.00 (link 3), which is what raises LiteraryProperty.tracking_tier to
          PRIORITY (link 4).
