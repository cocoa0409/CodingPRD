  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: photo_head_fraction_upper_boundary_069_pass_070_fail
        grounds:
          - calculations.photo_validation
          - entities.Photo.fields.validation_result
          - entities.Photo.fields.head_height_fraction
        distinguishing_aspect: |
          Numeric inclusive-boundary on the head_height_fraction metric via POST /applications/{id}/photos:
          head_height_fraction == 0.69 yields validation_result PASS (inclusive upper bound), 0.70 yields FAIL
          with failure_reasons HEAD_OUT_OF_RANGE.
        test_recipe:
          setup:
            - "An application exists to attach photos to."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_legal_name: "Pat Adult", date_of_birth: "1990-01-01", email: "pat9@x.com" }
              as: Applicant
              captures: { appl_id: "$.data.id" }
