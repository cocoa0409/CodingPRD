              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
            - call: "POST /direct-selling/enrollment-applications/${app_c_id}/pay-starter-kit"
              payload: { amount_cents: 11129, payment_reference: "KIT-PAY-CARA" }
              as: PlatformAdmin
            - call: "POST /direct-selling/enrollment-applications/${app_c_id}/approve"
