          assert:
            - "HTTP 400 and ${err} == ERR_INVALID_REQUEST (start_minute 1440 is outside 0..1439)"
            - "${err} != ERR_WINDOW_BOUNDS_INVALID — the shape check at priority 6 runs before the bounds check at priority 18"
            - "GET /drive-thru/daypart-profiles?restaurant_id=${r_id} returns total_count 0"

