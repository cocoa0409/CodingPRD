              as: BillingAnalyst
              captures: { e_stale_agreement: $.data.error_id }
            - call: "GET /district-energy/connection-agreements/${cg1_id}"
              payload: {}
              as: BillingAnalyst
              captures: { cg1_v_fresh: $.data.version }
            - call: "POST /district-energy/invoices"
              payload: { agreement_id: "${cg1_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", variant: "ACTUAL_TRUE_UP", expected_agreement_version: "${cg1_v_fresh}" }
