              as: Operator
              as_user_id: "${op_id}"
              captures: { ev_id: $.data.id, ev_rate: $.data.rate_gal_per_acre, ev_n: $.data.n_applied_lbs }
            - call: "GET /cafo/field-budgets/${bd_id}"
              payload: {}
              as: CertifiedPlanner
              as_user_id: "planner-1"
              captures: { bd_applied: $.data.applied_gallons_to_date, bd_left: $.data.remaining_gallons }
            - call: "GET /cafo/manure-storages/${st_id}"
              payload: {}
              as: Operator
              as_user_id: "${op_id}"
              captures: { st_vol: $.data.current_volume_gallons, st_days: $.data.days_of_storage_available }
            - call: "GET /cafo/operations/${op_id}"
              payload: {}
              as: StateReviewer
              as_user_id: "reviewer-1"
              captures: { op_recorded: $.data.recorded_annual_manure_gallons }
