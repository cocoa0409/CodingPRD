scenario: |
  2874. Landscape Supply Yard & Bulk Material Delivery (SiteOne Landscape Supply): bulk material inventory by cubic yard with moisture and shrinkage factors, contractor account credit line and job-based purchase order tagging, delivery truck sizing, load limits and driveway access restrictions, will-call loading queue and equipment safety rules, seasonal price change and pre-buy contracts on mulch and salt, split of bulk vs bagged pricing and minimum load fees, damage/spillage claims and driveway protection, return of unused pallets and reusable containers

domain_name: landscape-supply-yard
api_prefix: ""

complexity_profile:
  difficulty_level: expert_plus
  primary_archetype: pricing_engine
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate
  notes: |
    Flat topology: every collection sits at the URL root and children point at parents through
    explicit FK body fields (no nested creation paths). MaterialOrder carries two independent
    state dimensions (fulfillment_status x settlement_status). ClaimCase is cyclic
    (UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW). DeliveryLoad is fork-join
    (DISPATCHED -> {DELIVERED, REFUSED}) with divergent side-effect sets, and REFUSED reverts to
    PLANNED via replan. ClaimCase decisions are segregated from the dispatcher who ran the load.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Material
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: Yard stock keeping unit; unique across all Materials.
        constraints: "1-32 chars; uniqueness violation -> ERR_DUPLICATE_SKU"
      - name: name
        type: string
        source: input
        description: Human-readable material name.
      - name: offered_forms
        type: array
        source: input
        description: Sale forms this material is offered in.
        constraints: "non-empty subset of {BULK, BAGGED}; an OrderLine form outside this set -> ERR_FORM_NOT_OFFERED"
      - name: seasonal_category
        type: enum
        source: input
        description: Seasonal family driving container type and pre-buy eligibility narrative.
        constraints: "one of {MULCH, SALT, AGGREGATE, SOIL}"
      - name: density_lb_per_cubic_yard
        type: number
        source: input
        description: Dry-basis bulk density used for truck payload arithmetic.
        constraints: "> 0"
      - name: shrinkage_factor
        type: number
        source: input
        description: Fraction of stockpile volume lost to compaction/settling when sold.
        constraints: "0 <= shrinkage_factor <= 0.5"
      - name: moisture_pct
        type: number
        source: input
        description: Current yard-wide moisture percentage for this material; drives effective density.
        default: 15.0
        constraints: "0 <= moisture_pct <= 60"
      - name: unit_bag_cubic_yards
        type: number
        source: input
        description: Loose volume one bag occupies, used to convert BAGGED quantities into cubic yards for inventory reservation.
        default: 0.037
        constraints: "> 0"
      - name: prebuy_eligible
        type: boolean
        source: input
        description: Whether PreBuyContracts may be written against this material.
        default: false
      - name: status
        type: enum
        source: system
        description: Sellability status of the material.
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED, DISCONTINUED}; set by PATCH /materials/{materialId}"
      - name: effective_density_lb_per_cubic_yard
        type: number
        source: computed
        description: "Computed by calculations.truck_load_fit: density_lb_per_cubic_yard * (1 + (moisture_pct - 15.0)/100), ROUND_HALF_UP to 2 decimals."
      - name: available_net_cubic_yards
        type: number
        source: computed
        description: "Cross-entity roll-up: sum over InventoryLot rows of this material with status == AVAILABLE of (net_sellable_cubic_yards - reserved_cubic_yards), ROUND_HALF_UP to 2 decimals."

  - name: PriceSchedule
    parent: null
    common_fields: true
    fields:
      - name: material_id
        type: string
        source: input
        description: "FK -> Material.id; the material this price row prices."
      - name: effective_from
        type: datetime
        source: input
        description: ISO 8601 UTC instant (three fractional digits) at which this row becomes EFFECTIVE.
      - name: bulk_price_per_cubic_yard_cents
        type: integer
        source: input
        description: List price per cubic yard for BULK lines, before seasonal surcharge.
        constraints: "> 0"
      - name: bagged_price_per_bag_cents
        type: integer
        source: input
        description: List price per bag for BAGGED lines; seasonal surcharge never applies to bagged.
        constraints: "> 0"
      - name: seasonal_surcharge_pct
        type: number
        source: input
        description: Percentage uplift applied to BULK unit price only (0 = none).
        default: 0.0
        constraints: "0 <= seasonal_surcharge_pct <= 50"
      - name: status
        type: enum
        source: system
        description: Lifecycle of the price row.
        default: SCHEDULED
        constraints: "one of {SCHEDULED, EFFECTIVE, SUPERSEDED}"

  - name: InventoryLot
    parent: null
    common_fields: true
    fields:
      - name: material_id
        type: string
        source: input
        description: "FK -> Material.id; the material stockpiled in this lot."
      - name: gross_cubic_yards
        type: number
        source: input
        description: Scaled-in gross volume of the lot as received; NEVER mutated after intake.
        constraints: "> 0"
      - name: moisture_pct_at_intake
        type: number
        source: input
        description: Moisture percentage measured on the truck scale at intake.
        constraints: "0 <= moisture_pct_at_intake <= 60"
      - name: current_moisture_pct
        type: number
        source: system
        description: Latest moisture reading; equals moisture_pct_at_intake until POST /inventory-lots/{inventoryLotId}/moisture-readings overwrites it.
      - name: basis
        type: enum
        source: system
        description: Which variant of calculations.inventory_net_sellable_volume produced net_sellable_cubic_yards.
        default: INTAKE
        constraints: "one of {INTAKE, SETTLEMENT}; flips to SETTLEMENT on the first moisture reading"
      - name: withdrawn_gross_cubic_yards
        type: number
        source: computed
        description: "Sum over DeliveryLoad rows with status == DELIVERED whose inventory_lot_id == this lot of (actual_net_cubic_yards + spillage_cubic_yards), plus sum over WillCallTicket rows with status IN {LOADED, RELEASED} allocated to this lot of loaded_cubic_yards; ROUND_HALF_UP to 2 decimals."
        default: 0.0
      - name: net_sellable_cubic_yards
        type: number
        source: computed
        description: "Computed by calculations.inventory_net_sellable_volume under the variant named by basis."
      - name: reserved_cubic_yards
        type: number
        source: computed
        description: "Sum over OrderLine rows with inventory_lot_id == this lot whose MaterialOrder.fulfillment_status IN {CONFIRMED, ALLOCATED} of (line_volume_cubic_yards - delivered_volume_cubic_yards); ROUND_HALF_UP to 2 decimals."
        default: 0.0
      - name: status
        type: enum
        source: system
        description: Lot availability.
        default: AVAILABLE
        constraints: "one of {AVAILABLE, QUARANTINED, DEPLETED}; QUARANTINED set/cleared by moisture-readings, DEPLETED set when net_sellable_cubic_yards - withdrawn_gross_cubic_yards <= 0 after a delivery"

  - name: ContractorAccount
    parent: null
    common_fields: true
    fields:
      - name: business_name
        type: string
        source: input
        description: Contractor legal/business name.
      - name: credit_limit_cents
        type: integer
        source: input
        description: Approved revolving credit line in cents.
        constraints: ">= 0"
      - name: po_required
        type: boolean
        source: input
        description: Conditional-configuration flag; when true every MaterialOrder must carry a job_purchase_order_id.
        default: false
      - name: driveway_protection_required
        type: boolean
        source: input
        description: Conditional-configuration flag; when true a DELIVERY load must report driveway_protection_used == true at delivery.
        default: false
      - name: credit_used_cents
        type: integer
        source: computed
        description: "Computed by calculations.account_credit_position over this account's MaterialOrder rows."
        default: 0
      - name: credit_available_cents
        type: integer
        source: computed
        description: "Computed by calculations.account_credit_position: credit_limit_cents - credit_used_cents (may be negative)."
      - name: pallet_deposit_balance_cents
        type: integer
        source: computed
        description: "Outstanding reusable-container deposit liability: sum over ContainerReturn rows of this account's MaterialOrders of (issued_count * deposit_per_unit_cents - refund_cents - forfeited_cents)."
        default: 0
      - name: account_status
        type: enum
        source: system
        description: Credit posture gating order confirmation and will-call staging.
        default: ACTIVE
        constraints: "one of {ACTIVE, CREDIT_HOLD}; transitions per state_machines.ContractorAccount"

  - name: JobPurchaseOrder
    parent: null
    common_fields: true
    fields:
      - name: contractor_account_id
        type: string
        source: input
        description: "FK -> ContractorAccount.id; owner of this purchase order."
      - name: po_number
        type: string
        source: input
        description: Contractor-supplied PO number; unique within the owning account.
        constraints: "uniqueness violation within account -> ERR_DUPLICATE_PO_NUMBER"
      - name: job_code
        type: string
        source: input
        description: Job-site code used to tag every order billed to this PO.
      - name: po_limit_cents
        type: integer
        source: input
        description: Maximum cents that may be committed against this PO.
        constraints: "> 0"
      - name: committed_cents
        type: integer
        source: computed
        description: "Sum over MaterialOrder rows with job_purchase_order_id == this PO and fulfillment_status IN {CONFIRMED, ALLOCATED, FULFILLED} of COALESCE(final_total_cents, quoted_total_cents) - credit_memo_cents."
        default: 0
      - name: status
        type: enum
        source: system
        description: PO lifecycle.
        default: OPEN
        constraints: "one of {OPEN, EXHAUSTED, CLOSED}; EXHAUSTED auto-set when committed_cents >= po_limit_cents, CLOSED only via POST /job-purchase-orders/{jobPurchaseOrderId}/close"

  - name: PreBuyContract
    parent: null
    common_fields: true
    fields:
      - name: contractor_account_id
        type: string
        source: input
        description: "FK -> ContractorAccount.id; account that pre-bought the season volume."
      - name: material_id
        type: string
        source: input
        description: "FK -> Material.id; material whose price is locked; Material.prebuy_eligible must be true."
      - name: locked_price_per_cubic_yard_cents
        type: integer
        source: input
        description: Season-locked BULK unit price, immune to PriceSchedule changes and seasonal surcharge.
        constraints: "> 0"
      - name: contracted_cubic_yards
        type: number
        source: input
        description: Total cubic yards purchased up front.
        constraints: "> 0"
      - name: season_start_date
        type: string
        source: input
        description: "Inclusive first calendar date (YYYY-MM-DD) of the pre-buy season."
      - name: season_end_date
        type: string
        source: input
        description: "Inclusive last calendar date (YYYY-MM-DD) of the pre-buy season; must be >= season_start_date."
      - name: drawn_cubic_yards
        type: number
        source: computed
        description: "Sum of line_volume_cubic_yards over OrderLine rows with prebuy_contract_id == this contract whose MaterialOrder.fulfillment_status IN {CONFIRMED, ALLOCATED, FULFILLED}; ROUND_HALF_UP to 2 decimals."
        default: 0.0
      - name: remaining_cubic_yards
        type: number
        source: computed
        description: "contracted_cubic_yards - drawn_cubic_yards, ROUND_HALF_UP to 2 decimals."
      - name: status
        type: enum
        source: system
        description: Contract lifecycle.
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, EXHAUSTED, EXPIRED}"

  - name: MaterialOrder
    parent: null
    common_fields: true
    fields:
      - name: contractor_account_id
        type: string
        source: input
        description: "FK -> ContractorAccount.id; buying account (Contractor role identity)."
      - name: job_purchase_order_id
        type: string
        source: input
        description: "FK -> JobPurchaseOrder.id; nullable job tag, mandatory when ContractorAccount.po_required is true."
        default: null
      - name: fulfillment_mode
        type: enum
        source: input
        description: How the material leaves the yard.
        constraints: "one of {DELIVERY, WILL_CALL}"
      - name: delivery_address
        type: string
        source: input
        description: Job-site address; required when fulfillment_mode == DELIVERY.
        default: null
      - name: driveway_access_class
        type: enum
        source: input
        description: Site access grade limiting truck size; required when fulfillment_mode == DELIVERY.
        default: null
        constraints: "one of {CLASS_A, CLASS_B, CLASS_C}; access rank CLASS_A=3, CLASS_B=2, CLASS_C=1"
      - name: delivery_distance_miles
        type: number
        source: input
        description: One-way haul distance used by the delivery fee term; required when fulfillment_mode == DELIVERY.
        default: null
        constraints: ">= 0"
      - name: bulk_subtotal_cents
        type: integer
        source: computed
        description: "Step 1 of calculations.order_charge_assembly: sum of line_price_cents over OrderLine rows with form == BULK."
        default: 0
      - name: bagged_subtotal_cents
        type: integer
        source: computed
        description: "Step 2 of calculations.order_charge_assembly: sum of line_price_cents over OrderLine rows with form == BAGGED."
        default: 0
      - name: volume_discount_pct
        type: number
        source: computed
        description: "Step 3 of calculations.order_charge_assembly: tier selected on the PRE-discount bulk_subtotal_cents."
        default: 0.0
      - name: volume_discount_cents
        type: integer
        source: computed
        description: "Step 4 of calculations.order_charge_assembly: ROUND_HALF_UP(bulk_subtotal_cents * volume_discount_pct / 100)."
        default: 0
      - name: min_load_fee_cents
        type: integer
        source: computed
        description: "Step 6 of calculations.order_charge_assembly: MIN_LOAD_FEE_CENTS when mode is DELIVERY and post-discount bulk is under MIN_LOAD_SUBTOTAL_CENTS, else 0."
        default: 0
      - name: delivery_fee_cents
        type: integer
        source: computed
        description: "Step 7 of calculations.order_charge_assembly: axle base + per-mile term; 0 for WILL_CALL."
        default: 0
      - name: quoted_total_cents
        type: integer
        source: computed
        description: "Step 8 of calculations.order_charge_assembly under variant quoted_at_confirm."
        default: 0
      - name: final_total_cents
        type: integer
        source: computed
        description: "Step 8 of calculations.order_charge_assembly under variant final_at_delivery; null until the order reaches fulfillment_status FULFILLED."
        default: null
      - name: credit_memo_cents
        type: integer
        source: computed
        description: "Sum of payable_cents over ClaimCase rows against this order with status == SETTLED."
        default: 0
      - name: paid_amount_cents
        type: integer
        source: system
        description: Cents received via POST /material-orders/{materialOrderId}/settle.
        default: 0
      - name: quote_locked_at
        type: datetime
        source: system
        description: Logical-clock instant at which quoted_total_cents was frozen by confirm; null while DRAFT.
        default: null
      - name: fulfillment_status
        type: enum
        source: system
        description: Fulfillment dimension of the parallel state machine.
        default: DRAFT
        constraints: "one of {DRAFT, CONFIRMED, ALLOCATED, FULFILLED, CANCELLED}"
      - name: settlement_status
        type: enum
        source: system
        description: Billing dimension of the parallel state machine; evolves independently of fulfillment_status.
        default: UNBILLED
        constraints: "one of {UNBILLED, INVOICED, SETTLED, CREDIT_MEMO_ISSUED}"

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - name: material_order_id
        type: string
        source: input
        description: "FK -> MaterialOrder.id; owning order."
      - name: material_id
        type: string
        source: input
        description: "FK -> Material.id; material sold on this line."
      - name: prebuy_contract_id
        type: string
        source: system
        description: "FK -> PreBuyContract.id; set when the line was priced off a pre-buy contract (use_prebuy == true), else null."
        default: null
      - name: inventory_lot_id
        type: string
        source: system
        description: "FK -> InventoryLot.id; single lot allocated to this line at order confirm; null while the order is DRAFT."
        default: null
      - name: form
        type: enum
        source: input
        description: Sale form of this line.
        constraints: "one of {BULK, BAGGED}; must appear in Material.offered_forms"
      - name: quantity
        type: number
        source: input
        description: Cubic yards when form == BULK, whole bag count when form == BAGGED.
        constraints: "> 0; BAGGED quantity must be an integer"
      - name: unit_price_cents
        type: integer
        source: computed
        description: "Per-unit price frozen at confirm by calculations.order_line_pricing variant quoted_at_confirm."
      - name: line_price_cents
        type: integer
        source: computed
        description: "Quoted line extension, ROUND_HALF_UP once at line level (per-line-then-sum order is pinned)."
      - name: line_volume_cubic_yards
        type: number
        source: computed
        description: "quantity when form == BULK, ROUND_HALF_UP(quantity * Material.unit_bag_cubic_yards, 2) when form == BAGGED."
      - name: delivered_volume_cubic_yards
        type: number
        source: computed
        description: "Cubic yards of this line already withdrawn, assigned by the delivery waterfall in calculations.order_line_pricing variant final_at_delivery."
        default: 0.0
      - name: final_line_price_cents
        type: integer
        source: computed
        description: "Line extension recomputed at delivery under variant final_at_delivery; null until the parent order is FULFILLED."
        default: null

  - name: DeliveryTruck
    parent: null
    common_fields: true
    fields:
      - name: truck_code
        type: string
        source: input
        description: Fleet identifier painted on the door.
      - name: axle_class
        type: enum
        source: input
        description: Axle configuration selecting the delivery fee base.
        constraints: "one of {SINGLE, TANDEM, TRI_AXLE}"
      - name: max_payload_lb
        type: integer
        source: input
        description: Legal payload ceiling in pounds.
        constraints: "> 0"
      - name: bed_capacity_cubic_yards
        type: number
        source: input
        description: Geometric bed volume in cubic yards.
        constraints: "> 0"
      - name: min_driveway_access_class
        type: enum
        source: input
        description: Least permissive driveway grade this truck may enter; order access rank must be >= this rank.
        constraints: "one of {CLASS_A, CLASS_B, CLASS_C}"
      - name: status
        type: enum
        source: system
        description: Fleet availability.
        default: AVAILABLE
        constraints: "one of {AVAILABLE, IN_SERVICE, OUT_OF_SERVICE}"

  - name: DeliveryLoad
    parent: null
    common_fields: true
    fields:
      - name: material_order_id
        type: string
        source: input
        description: "FK -> MaterialOrder.id; order being hauled."
      - name: delivery_truck_id
        type: string
        source: input
        description: "FK -> DeliveryTruck.id; truck occupying the window."
      - name: inventory_lot_id
        type: string
        source: system
        description: "FK -> InventoryLot.id; lot pinned at load creation as the lot allocated to the order's earliest-created BULK OrderLine (created_at ASC)."
        default: null
      - name: planned_cubic_yards
        type: number
        source: input
        description: Cubic yards planned onto the truck for this trip.
        constraints: "> 0"
      - name: window_start
        type: datetime
        source: input
        description: ISO 8601 UTC start of the truck occupation window (inclusive).
      - name: window_end
        type: datetime
        source: input
        description: ISO 8601 UTC end of the truck occupation window (exclusive); must be > window_start.
      - name: planned_payload_lb
        type: integer
        source: computed
        description: "ROUND_HALF_UP(planned_cubic_yards * Material.effective_density_lb_per_cubic_yard) for the pinned lot's material."
      - name: max_allowed_cubic_yards
        type: number
        source: computed
        description: "Computed by calculations.truck_load_fit; advisory ceiling combining bed volume, payload headroom and driveway cap."
      - name: actual_net_cubic_yards
        type: number
        source: system
        description: Net cubic yards actually tipped at the job site, reported at delivery.
        default: null
      - name: spillage_cubic_yards
        type: number
        source: system
        description: Cubic yards lost to spillage on site; consumed from inventory but never charged to the contractor.
        default: 0.0
      - name: driveway_protection_used
        type: boolean
        source: system
        description: Whether plywood/mat driveway protection was laid; reported at delivery.
        default: null
      - name: dispatched_by_user_id
        type: string
        source: system
        description: X-User-ID of the DispatchPlanner who dispatched this load; used by the segregation-of-duties check on claim decisions.
        default: null
      - name: refusal_reason
        type: enum
        source: system
        description: Why the site refused the load.
        default: null
        constraints: "one of {ACCESS_BLOCKED, CUSTOMER_REFUSED, EQUIPMENT_FAILURE}"
      - name: status
        type: enum
        source: system
        description: Load lifecycle (fork-join with revert).
        default: PLANNED
        constraints: "one of {PLANNED, DISPATCHED, DELIVERED, REFUSED, CANCELLED}"

  - name: WillCallTicket
    parent: null
    common_fields: true
    fields:
      - name: material_order_id
        type: string
        source: input
        description: "FK -> MaterialOrder.id; WILL_CALL order being picked up."
      - name: requested_pickup_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant the contractor intends to arrive; a ticket is only eligible for staging once the logical clock reaches it.
      - name: inventory_lot_id
        type: string
        source: system
        description: "FK -> InventoryLot.id; lot pinned at staging as the lot allocated to the order's earliest-created BULK OrderLine (created_at ASC)."
        default: null
      - name: priority_class
        type: integer
        source: computed
        description: "2 when the ticket's order has at least one OrderLine with prebuy_contract_id != null, else 1."
      - name: queue_position
        type: integer
        source: computed
        description: "1-based rank of this ticket among all WillCallTicket rows with status == QUEUED ordered by priority_class DESC, requested_pickup_at ASC, created_at ASC; null once status leaves QUEUED."
      - name: staging_window_start
        type: datetime
        source: system
        description: Inclusive start of the bay occupation granted at staging.
        default: null
      - name: staging_window_end
        type: datetime
        source: system
        description: Inclusive end of the bay occupation granted at staging.
        default: null
      - name: safety_briefing_code
        type: string
        source: system
        description: Equipment-safety briefing code recorded by the loader.
        default: null
      - name: ppe_confirmed
        type: boolean
        source: system
        description: Whether the contractor's PPE was confirmed at the loading bay.
        default: false
      - name: loaded_cubic_yards
        type: number
        source: system
        description: Cubic yards actually loaded onto the contractor's vehicle.
        default: null
      - name: staged_by_user_id
        type: string
        source: system
        description: X-User-ID of the YardLoader who staged the ticket.
        default: null
      - name: status
        type: enum
        source: system
        description: Will-call queue lifecycle.
        default: QUEUED
        constraints: "one of {QUEUED, STAGED, LOADING, LOADED, RELEASED, CANCELLED}"

  - name: ClaimCase
    parent: null
    common_fields: true
    fields:
      - name: material_order_id
        type: string
        source: input
        description: "FK -> MaterialOrder.id; order the claim is billed against."
      - name: delivery_load_id
        type: string
        source: input
        description: "FK -> DeliveryLoad.id; nullable target load, must belong to material_order_id when present."
        default: null
      - name: will_call_ticket_id
        type: string
        source: input
        description: "FK -> WillCallTicket.id; nullable target ticket, must belong to material_order_id when present."
        default: null
      - name: claim_type
        type: enum
        source: input
        description: Claim family selecting the payable cap rule.
        constraints: "one of {DRIVEWAY_DAMAGE, SPILLAGE, SHORT_LOAD}"
      - name: claimed_amount_cents
        type: integer
        source: input
        description: Cents the contractor claims.
        constraints: "> 0"
      - name: description
        type: string
        source: input
        description: Free-text narrative of the damage or shortage.
      - name: review_round
        type: integer
        source: computed
        description: "Number of times the case has entered UNDER_REVIEW; starts at 0 and increments on every SUBMITTED->UNDER_REVIEW and INFO_REQUESTED->UNDER_REVIEW transition."
        default: 0
      - name: approved_amount_cents
        type: integer
        source: system
        description: Cents the adjuster approved; must be <= claimed_amount_cents.
        default: null
      - name: payable_cents
        type: integer
        source: computed
        description: "Computed by calculations.claim_settlement_waterfall; the capped amount actually payable."
        default: null
      - name: invoice_offset_cents
        type: integer
        source: computed
        description: "Waterfall bucket 1 of calculations.claim_settlement_waterfall."
        default: 0
      - name: deposit_offset_cents
        type: integer
        source: computed
        description: "Waterfall bucket 2 of calculations.claim_settlement_waterfall."
        default: 0
      - name: goodwill_credit_cents
        type: integer
        source: computed
        description: "Waterfall bucket 3 (remainder) of calculations.claim_settlement_waterfall."
        default: 0
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the ClaimsAdjuster who approved or denied.
        default: null
      - name: denial_reason
        type: string
        source: system
        description: Reason recorded when the case is denied.
        default: null
      - name: info_request_note
        type: string
        source: system
        description: Latest note the adjuster sent when requesting more information.
        default: null
      - name: status
        type: enum
        source: system
        description: Cyclic claim lifecycle.
        default: SUBMITTED
        constraints: "one of {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED, APPROVED, DENIED, SETTLED}"

  - name: ContainerReturn
    parent: null
    common_fields: true
    fields:
      - name: material_order_id
        type: string
        source: input
        description: "FK -> MaterialOrder.id; order the reusable containers went out on. Rows are cascade-created by delivery/loading, never by a direct POST."
      - name: container_type
        type: enum
        source: system
        description: "Derived from the seasonal_category of the material on the order's earliest-created BAGGED OrderLine (created_at ASC) via CONTAINER_TYPE_BY_CATEGORY."
        constraints: "one of {PALLET, SUPER_SACK, SALT_TOTE}"
      - name: issued_count
        type: integer
        source: system
        description: Number of reusable containers issued with the load.
        constraints: "> 0"
      - name: returned_count
        type: integer
        source: system
        description: Cumulative containers received back.
        default: 0
      - name: deposit_per_unit_cents
        type: integer
        source: system
        description: "Per-container deposit from CONTAINER_DEPOSIT_BY_TYPE at issue time."
      - name: issued_at
        type: datetime
        source: system
        description: Logical-clock instant the containers left the yard; the grace window is measured from here.
      - name: last_received_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent receive call.
        default: null
      - name: refund_cents
        type: integer
        source: computed
        description: "Cumulative deposit refunded, computed by calculations.container_deposit_refund."
        default: 0
      - name: forfeited_cents
        type: integer
        source: computed
        description: "Deposit permanently retained by the yard: issued_count * deposit_per_unit_cents - refund_cents once the row reaches CLOSED or FORFEITED, else 0."
        default: 0
      - name: status
        type: enum
        source: system
        description: Container return lifecycle.
        default: OUTSTANDING
        constraints: "one of {OUTSTANDING, PARTIALLY_RETURNED, CLOSED, FORFEITED}"

state_machines:
  - entity: MaterialOrder
    dimension: fulfillment_status
    initial_state: DRAFT
    terminal_states: [FULFILLED, CANCELLED]
    note: |
      Parallel dimension 1 of 2 on MaterialOrder. This axis and settlement_status are stored and
      transitioned independently: a claim settlement moves settlement_status while
      fulfillment_status stays FULFILLED, and the ALLOCATED->CONFIRMED revert leaves
      settlement_status untouched.
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /material-orders/{materialOrderId}/confirm"
        actor: Contractor
        preconditions:
          - "order has >= 1 OrderLine, else ERR_ORDER_HAS_NO_LINES"
          - "ContractorAccount.account_status == ACTIVE, else ERR_ACCOUNT_CREDIT_HOLD"
          - "when ContractorAccount.po_required is true: job_purchase_order_id != null, else ERR_PO_REQUIRED"
          - "when job_purchase_order_id != null: JobPurchaseOrder.status == OPEN, else ERR_PO_NOT_OPEN"
          - "every line's Material.status == ACTIVE, else ERR_MATERIAL_NOT_SELLABLE"
          - "for every line with prebuy_contract_id != null: PreBuyContract.status == ACTIVE (else ERR_PREBUY_NOT_ACTIVE), current_utc date within [season_start_date, season_end_date] (else ERR_PREBUY_OUT_OF_SEASON), and remaining_cubic_yards >= line_volume_cubic_yards (else ERR_PREBUY_BALANCE_EXCEEDED)"
          - "for every line exactly one InventoryLot of that material with status == AVAILABLE and (net_sellable_cubic_yards - reserved_cubic_yards) >= line_volume_cubic_yards exists, choosing the earliest created_at; no lot splitting, else ERR_INSUFFICIENT_INVENTORY"
          - "ContractorAccount.credit_available_cents >= quoted_total_cents (>= is inclusive), else ERR_CREDIT_LIMIT_EXCEEDED"
          - "when job_purchase_order_id != null: JobPurchaseOrder.committed_cents + quoted_total_cents <= po_limit_cents, else ERR_PO_LIMIT_EXCEEDED"
        side_effects:
          - "hop 1: for every OrderLine run calculations.order_line_pricing variant quoted_at_confirm, writing unit_price_cents, line_price_cents, line_volume_cubic_yards, and inventory_lot_id (earliest-created eligible AVAILABLE lot, created_at ASC)"
          - "hop 1: run calculations.order_charge_assembly variant quoted_at_confirm, writing bulk_subtotal_cents, bagged_subtotal_cents, volume_discount_pct, volume_discount_cents, min_load_fee_cents, delivery_fee_cents, quoted_total_cents; set quote_locked_at = current logical clock"
          - "hop 2 (caused by hop 1 writing inventory_lot_id): each allocated InventoryLot.reserved_cubic_yards is recomputed and its updated_at/version advance"
          - "hop 2 (caused by hop 1 writing prebuy_contract_id draws): each referenced PreBuyContract.drawn_cubic_yards / remaining_cubic_yards recomputed"
          - "hop 3 (caused by hop 2's drawn_cubic_yards change): PreBuyContract with remaining_cubic_yards <= 0 auto-transitions ACTIVE -> EXHAUSTED"
          - "hop 2 (caused by hop 1 writing quoted_total_cents): ContractorAccount.credit_used_cents / credit_available_cents recomputed per calculations.account_credit_position"
          - "hop 2 (caused by hop 1 writing quoted_total_cents): JobPurchaseOrder.committed_cents recomputed when job_purchase_order_id != null"
          - "hop 3 (caused by hop 2's committed_cents change): JobPurchaseOrder with committed_cents >= po_limit_cents auto-transitions OPEN -> EXHAUSTED"
          - "increments MaterialOrder.version by 1"
      - from: CONFIRMED
        to: ALLOCATED
        trigger: "POST /delivery-loads (first load for this order) or POST /will-call-tickets/stage-next (first ticket staged for this order)"
        actor: system
        preconditions:
          - "order fulfillment_status == CONFIRMED"
        side_effects:
          - "MaterialOrder.fulfillment_status = ALLOCATED; increments MaterialOrder.version by 1"
      - from: ALLOCATED
        to: CONFIRMED
        trigger: "POST /delivery-loads/{deliveryLoadId}/refuse or POST /delivery-loads/{deliveryLoadId}/cancel or POST /will-call-tickets/{willCallTicketId}/cancel"
        actor: system
        preconditions:
          - "after the triggering transition the order has zero DeliveryLoad rows in {PLANNED, DISPATCHED} and zero WillCallTicket rows in {STAGED, LOADING, LOADED}"
        side_effects:
          - "MaterialOrder.fulfillment_status = CONFIRMED (revert cycle; settlement_status untouched); increments MaterialOrder.version by 1"
      - from: ALLOCATED
        to: FULFILLED
        trigger: "POST /delivery-loads/{deliveryLoadId}/deliver or POST /will-call-tickets/{willCallTicketId}/release"
        actor: system
        preconditions:
          - "after the delivery waterfall every OrderLine with form == BULK satisfies delivered_volume_cubic_yards >= line_volume_cubic_yards"
        side_effects:
          - "run calculations.order_charge_assembly variant final_at_delivery, writing final_total_cents and every OrderLine.final_line_price_cents"
          - "increments MaterialOrder.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /material-orders/{materialOrderId}/cancel"
        actor: Contractor | YardAdmin
        preconditions: []
        side_effects:
          - "MaterialOrder.fulfillment_status = CANCELLED; increments MaterialOrder.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /material-orders/{materialOrderId}/cancel"
        actor: Contractor | YardAdmin
        preconditions:
          - "no DeliveryLoad of this order in status DISPATCHED, else ERR_ORDER_HAS_DISPATCHED_LOAD"
        side_effects:
          - "hop 1: MaterialOrder.fulfillment_status = CANCELLED (compensating action for the confirm reservation)"
          - "hop 2 (caused by hop 1 leaving the {CONFIRMED, ALLOCATED} reservation set): every allocated InventoryLot.reserved_cubic_yards recomputed back to its pre-confirm value"
          - "hop 2: every referenced PreBuyContract.drawn_cubic_yards recomputed downward; a contract in EXHAUSTED with remaining_cubic_yards > 0 reverts to ACTIVE"
          - "hop 2: ContractorAccount.credit_used_cents recomputed downward; JobPurchaseOrder.committed_cents recomputed downward and an EXHAUSTED PO with committed_cents < po_limit_cents reverts to OPEN"
          - "hop 3 (caused by hop 2's credit_used_cents change): ContractorAccount in CREDIT_HOLD with credit_used_cents <= ROUND_HALF_UP(credit_limit_cents * 0.90) auto-transitions to ACTIVE"
          - "every PLANNED DeliveryLoad of this order transitions to CANCELLED and every QUEUED/STAGED WillCallTicket to CANCELLED"
          - "increments MaterialOrder.version by 1"
      - from: ALLOCATED
        to: CANCELLED
        trigger: "POST /material-orders/{materialOrderId}/cancel"
        actor: Contractor | YardAdmin
        preconditions:
          - "no DeliveryLoad of this order in status DISPATCHED, else ERR_ORDER_HAS_DISPATCHED_LOAD"
        side_effects:
          - "identical compensating cascade to the CONFIRMED -> CANCELLED transition"
          - "increments MaterialOrder.version by 1"

  - entity: MaterialOrder
    dimension: settlement_status
    initial_state: UNBILLED
    terminal_states: []
    note: "Parallel dimension 2 of 2; guarded by the fulfillment axis only at the UNBILLED -> INVOICED step."
    transitions:
      - from: UNBILLED
        to: INVOICED
        trigger: "POST /material-orders/{materialOrderId}/invoice"
        actor: CreditManager
        preconditions:
          - "fulfillment_status == FULFILLED, else ERR_ORDER_NOT_FULFILLED"
        side_effects:
          - "settlement_status = INVOICED; fulfillment_status untouched; increments MaterialOrder.version by 1"
      - from: INVOICED
        to: SETTLED
        trigger: "POST /material-orders/{materialOrderId}/settle"
        actor: CreditManager
        preconditions:
          - "paid_amount_cents >= final_total_cents - credit_memo_cents, else ERR_UNDERPAYMENT"
        side_effects:
          - "hop 1: paid_amount_cents = request paid_amount_cents; settlement_status = SETTLED"
          - "hop 2 (caused by hop 1 leaving the {UNBILLED, INVOICED} credit set): ContractorAccount.credit_used_cents recomputed downward, freeing the line"
          - "hop 3 (caused by hop 2): ContractorAccount in CREDIT_HOLD with credit_used_cents <= ROUND_HALF_UP(credit_limit_cents * 0.90) auto-transitions to ACTIVE"
          - "increments MaterialOrder.version by 1"
      - from: INVOICED
        to: CREDIT_MEMO_ISSUED
        trigger: "POST /claim-cases/{claimCaseId}/settle"
        actor: system
        preconditions:
          - "the settling ClaimCase has payable_cents > 0"
        side_effects:
          - "credit_memo_cents recomputed as the sum of payable_cents over SETTLED ClaimCase rows of this order; settlement_status = CREDIT_MEMO_ISSUED; fulfillment_status untouched; increments MaterialOrder.version by 1"
      - from: SETTLED
        to: CREDIT_MEMO_ISSUED
        trigger: "POST /claim-cases/{claimCaseId}/settle"
        actor: system
        preconditions:
          - "the settling ClaimCase has payable_cents > 0"
        side_effects:
          - "credit_memo_cents recomputed; settlement_status = CREDIT_MEMO_ISSUED; increments MaterialOrder.version by 1"
      - from: CREDIT_MEMO_ISSUED
        to: SETTLED
        trigger: "POST /material-orders/{materialOrderId}/settle"
        actor: CreditManager
        preconditions:
          - "paid_amount_cents >= final_total_cents - credit_memo_cents, else ERR_UNDERPAYMENT"
        side_effects:
          - "paid_amount_cents set; settlement_status = SETTLED; ContractorAccount.credit_used_cents recomputed downward; increments MaterialOrder.version by 1"

  - entity: ContractorAccount
    initial_state: ACTIVE
    terminal_states: []
    note: "Cyclic credit posture with hysteresis: entry at strictly-greater-than the limit, exit only at or below 90% of the limit."
    transitions:
      - from: ACTIVE
        to: CREDIT_HOLD
        trigger: "system, on any recompute of credit_used_cents (order confirm, delivery final pricing, claim settlement, credit adjustment)"
        actor: system
        preconditions:
          - "credit_used_cents > credit_limit_cents (strictly greater)"
        side_effects:
          - "account_status = CREDIT_HOLD; increments ContractorAccount.version by 1"
          - "every WillCallTicket in status QUEUED whose MaterialOrder belongs to this account transitions to CANCELLED with the credit-hold reason"
      - from: CREDIT_HOLD
        to: ACTIVE
        trigger: "system, on any recompute of credit_used_cents"
        actor: system
        preconditions:
          - "credit_used_cents <= ROUND_HALF_UP(credit_limit_cents * 0.90)"
        side_effects:
          - "account_status = ACTIVE; increments ContractorAccount.version by 1"
      - from: CREDIT_HOLD
        to: ACTIVE
        trigger: "POST /contractor-accounts/{contractorAccountId}/credit-adjustments"
        actor: CreditManager
        preconditions:
          - "expected_contractor_account_version matches ContractorAccount.version, else ERR_STALE_ACCOUNT_VERSION"
          - "after applying new_credit_limit_cents, credit_used_cents <= ROUND_HALF_UP(new_credit_limit_cents * 0.90)"
        side_effects:
          - "credit_limit_cents = new_credit_limit_cents; credit_available_cents recomputed; account_status = ACTIVE; increments ContractorAccount.version by 1"

  - entity: DeliveryLoad
    initial_state: PLANNED
    terminal_states: [DELIVERED, CANCELLED]
    note: "Fork-join with revert: DISPATCHED forks to DELIVERED or REFUSED with disjoint side-effect sets, and REFUSED rejoins PLANNED via replan."
    transitions:
      - from: PLANNED
        to: DISPATCHED
        trigger: "POST /delivery-loads/{deliveryLoadId}/dispatch"
        actor: DispatchPlanner
        preconditions:
          - "DeliveryTruck.status == AVAILABLE, else ERR_TRUCK_UNAVAILABLE"
          - "InventoryLot.status == AVAILABLE for the pinned inventory_lot_id, else ERR_LOT_QUARANTINED"
          - "MaterialOrder's ContractorAccount.account_status == ACTIVE, else ERR_ACCOUNT_CREDIT_HOLD"
        side_effects:
          - "status = DISPATCHED; dispatched_by_user_id = X-User-ID of the caller"
          - "DeliveryTruck.status = IN_SERVICE; increments DeliveryTruck.version by 1"
          - "increments DeliveryLoad.version by 1"
      - from: DISPATCHED
        to: DELIVERED
        trigger: "POST /delivery-loads/{deliveryLoadId}/deliver"
        actor: DispatchPlanner
        preconditions:
          - "when the order's ContractorAccount.driveway_protection_required is true, driveway_protection_used must be true, else ERR_DRIVEWAY_PROTECTION_REQUIRED"
          - "actual_net_cubic_yards + spillage_cubic_yards <= planned_cubic_yards, else ERR_DELIVERED_EXCEEDS_PLANNED"
        side_effects:
          - "hop 1: status = DELIVERED; actual_net_cubic_yards, spillage_cubic_yards, driveway_protection_used stored; DeliveryTruck.status = AVAILABLE"
          - "hop 1: calculations.order_line_pricing variant final_at_delivery allocates actual_net_cubic_yards across the order's BULK OrderLine rows (created_at ASC waterfall) writing delivered_volume_cubic_yards and final_line_price_cents; calculations.order_charge_assembly variant final_at_delivery writes MaterialOrder.final_total_cents; MaterialOrder.fulfillment_status = FULFILLED when every BULK line is fully delivered"
          - "hop 1: InventoryLot.withdrawn_gross_cubic_yards += (actual_net_cubic_yards + spillage_cubic_yards); InventoryLot.reserved_cubic_yards recomputed; lot auto-transitions to DEPLETED when net_sellable_cubic_yards - withdrawn_gross_cubic_yards <= 0"
          - "hop 1: when the order has >= 1 BAGGED OrderLine and no ContainerReturn row exists yet for the order, a ContainerReturn is cascade-created with container_type from CONTAINER_TYPE_BY_CATEGORY, issued_count = CEIL(sum of BAGGED quantity / BAGS_PER_CONTAINER), deposit_per_unit_cents from CONTAINER_DEPOSIT_BY_TYPE, issued_at = current logical clock, status OUTSTANDING"
          - "hop 2 (caused by hop 1 writing final_total_cents): ContractorAccount.credit_used_cents recomputed per calculations.account_credit_position"
          - "hop 2 (caused by hop 1 writing final_total_cents): JobPurchaseOrder.committed_cents recomputed, auto-transitioning OPEN -> EXHAUSTED at committed_cents >= po_limit_cents"
          - "hop 2 (caused by hop 1 creating the ContainerReturn): ContractorAccount.pallet_deposit_balance_cents recomputed upward by issued_count * deposit_per_unit_cents"
          - "hop 3 (caused by hop 2's credit_used_cents change): ContractorAccount auto-transitions ACTIVE -> CREDIT_HOLD when credit_used_cents > credit_limit_cents"
          - "hop 4 (caused by hop 3's account_status change): every WillCallTicket in QUEUED belonging to that account's MaterialOrder rows transitions to CANCELLED"
          - "hop 5 (caused by hop 4's ticket cancellations): each cancelled ticket's order re-evaluates the ALLOCATED -> CONFIRMED revert and the affected InventoryLot.reserved_cubic_yards figures are recomputed"
          - "increments DeliveryLoad.version by 1"
      - from: DISPATCHED
        to: REFUSED
        trigger: "POST /delivery-loads/{deliveryLoadId}/refuse"
        actor: DispatchPlanner
        preconditions: []
        side_effects:
          - "status = REFUSED; refusal_reason stored; actual_net_cubic_yards stays null and no inventory is withdrawn (disjoint from the DELIVERED branch: no pricing recompute, no ContainerReturn, no credit recompute)"
          - "DeliveryTruck.status = AVAILABLE when refusal_reason != EQUIPMENT_FAILURE, else DeliveryTruck.status = OUT_OF_SERVICE"
          - "MaterialOrder re-evaluates the ALLOCATED -> CONFIRMED revert"
          - "increments DeliveryLoad.version by 1"
      - from: REFUSED
        to: PLANNED
        trigger: "POST /delivery-loads/{deliveryLoadId}/replan"
        actor: DispatchPlanner
        preconditions:
          - "the new delivery_truck_id's DeliveryTruck.status == AVAILABLE, else ERR_TRUCK_UNAVAILABLE"
          - "the new window passes the truck-window overlap rule (validations priority 20)"
          - "the new truck passes the driveway access and axle weight rules"
        side_effects:
          - "status = PLANNED; delivery_truck_id, window_start, window_end replaced; refusal_reason cleared to null; planned_payload_lb and max_allowed_cubic_yards recomputed"
          - "MaterialOrder re-evaluates CONFIRMED -> ALLOCATED"
          - "increments DeliveryLoad.version by 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /delivery-loads/{deliveryLoadId}/cancel"
        actor: DispatchPlanner
        preconditions: []
        side_effects:
          - "status = CANCELLED; the truck window is released so a later load may occupy it"
          - "no inventory withdrawal occurs, so InventoryLot.gross_cubic_yards and reserved_cubic_yards are unchanged by this transition"
          - "MaterialOrder re-evaluates the ALLOCATED -> CONFIRMED revert"
          - "increments DeliveryLoad.version by 1"

  - entity: WillCallTicket
    initial_state: QUEUED
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: QUEUED
        to: STAGED
        trigger: "POST /will-call-tickets/stage-next"
        actor: YardLoader
        preconditions:
          - "the selector in calculations.will_call_queue_ranking returns a candidate; empty candidate set -> ERR_WILL_CALL_QUEUE_EMPTY"
          - "count of WillCallTicket rows in status IN {STAGED, LOADING} whose [staging_window_start, staging_window_end] closed interval intersects the requested window is < WILL_CALL_STAGING_CAPACITY, else ERR_STAGING_CAPACITY_FULL"
          - "the selected ticket's MaterialOrder's ContractorAccount.account_status == ACTIVE (part of the eligibility filter)"
        side_effects:
          - "status = STAGED; staging_window_start / staging_window_end stored; staged_by_user_id = X-User-ID; inventory_lot_id pinned from the order's earliest-created BULK OrderLine"
          - "queue_position set to null on this ticket and recomputed for every remaining QUEUED ticket"
          - "MaterialOrder transitions CONFIRMED -> ALLOCATED when this is its first staged ticket"
          - "increments WillCallTicket.version by 1"
      - from: STAGED
        to: LOADING
        trigger: "POST /will-call-tickets/{willCallTicketId}/safety-ack"
        actor: YardLoader
        preconditions:
          - "ppe_confirmed in the request body is true, else ERR_SAFETY_ACK_REQUIRED"
        side_effects:
          - "status = LOADING; safety_briefing_code and ppe_confirmed stored; increments WillCallTicket.version by 1"
      - from: LOADING
        to: LOADED
        trigger: "POST /will-call-tickets/{willCallTicketId}/load"
        actor: YardLoader
        preconditions:
          - "ppe_confirmed == true on the ticket, else ERR_SAFETY_ACK_REQUIRED"
          - "loaded_cubic_yards <= sum over the order's BULK OrderLine rows of (line_volume_cubic_yards - delivered_volume_cubic_yards), else ERR_LOAD_EXCEEDS_ORDER_BALANCE"
        side_effects:
          - "status = LOADED; loaded_cubic_yards stored"
          - "the order's BULK OrderLine rows receive delivered_volume_cubic_yards through the created_at ASC waterfall; InventoryLot.withdrawn_gross_cubic_yards += loaded_cubic_yards and reserved_cubic_yards recomputed"
          - "when the order has >= 1 BAGGED OrderLine and no ContainerReturn exists for it, a ContainerReturn row is cascade-created with issued_count = pallet_count from the request"
          - "increments WillCallTicket.version by 1"
      - from: LOADED
        to: RELEASED
        trigger: "POST /will-call-tickets/{willCallTicketId}/release"
        actor: YardLoader
        preconditions:
          - "status == LOADED, else ERR_TICKET_NOT_LOADED"
        side_effects:
          - "status = RELEASED"
          - "MaterialOrder runs calculations.order_charge_assembly variant final_at_delivery and transitions ALLOCATED -> FULFILLED when every BULK line is fully delivered; ContractorAccount.credit_used_cents recomputed"
          - "increments WillCallTicket.version by 1"
      - from: QUEUED
        to: CANCELLED
        trigger: "POST /will-call-tickets/{willCallTicketId}/cancel, or system cascade when the owning ContractorAccount enters CREDIT_HOLD, or system cascade when the order is cancelled"
        actor: Contractor | YardLoader | system
        preconditions: []
        side_effects:
          - "status = CANCELLED; queue_position set to null and recomputed for every remaining QUEUED ticket; increments WillCallTicket.version by 1"
      - from: STAGED
        to: CANCELLED
        trigger: "POST /will-call-tickets/{willCallTicketId}/cancel"
        actor: Contractor | YardLoader
        preconditions: []
        side_effects:
          - "status = CANCELLED; the staging window is released; MaterialOrder re-evaluates the ALLOCATED -> CONFIRMED revert; increments WillCallTicket.version by 1"

  - entity: ClaimCase
    initial_state: SUBMITTED
    terminal_states: [DENIED, SETTLED]
    note: "Cyclic: UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW may repeat, incrementing review_round each time the case re-enters UNDER_REVIEW."
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /claim-cases/{claimCaseId}/start-review"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects:
          - "status = UNDER_REVIEW; review_round += 1; increments ClaimCase.version by 1"
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /claim-cases/{claimCaseId}/request-info"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects:
          - "status = INFO_REQUESTED; info_request_note stored; increments ClaimCase.version by 1"
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /claim-cases/{claimCaseId}/provide-info"
        actor: Contractor
        preconditions:
          - "the acting Contractor's X-User-ID equals the claim's MaterialOrder.contractor_account_id, else ERR_ACCOUNT_SCOPE_VIOLATION"
        side_effects:
          - "status = UNDER_REVIEW (cycle closure); review_round += 1; increments ClaimCase.version by 1"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /claim-cases/{claimCaseId}/decide with decision == APPROVE"
        actor: ClaimsAdjuster
        preconditions:
          - "approved_amount_cents present and <= claimed_amount_cents, else ERR_APPROVED_EXCEEDS_CLAIM"
          - "when delivery_load_id != null, the load's dispatched_by_user_id != the acting X-User-ID, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "status = APPROVED; approved_amount_cents and decided_by_user_id stored; calculations.claim_settlement_waterfall computes payable_cents, invoice_offset_cents, deposit_offset_cents, goodwill_credit_cents; increments ClaimCase.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /claim-cases/{claimCaseId}/decide with decision == DENY"
        actor: ClaimsAdjuster
        preconditions:
          - "denial_reason present, else ERR_INVALID_REQUEST"
          - "when delivery_load_id != null, the load's dispatched_by_user_id != the acting X-User-ID, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "status = DENIED; denial_reason and decided_by_user_id stored; payable_cents stays null and no ledger field on any other entity moves (disjoint from the APPROVED branch); increments ClaimCase.version by 1"
      - from: APPROVED
        to: SETTLED
        trigger: "POST /claim-cases/{claimCaseId}/settle"
        actor: CreditManager
        preconditions:
          - "payable_cents > 0, else ERR_CLAIM_NOT_PAYABLE"
        side_effects:
          - "hop 1: status = SETTLED"
          - "hop 2 (caused by hop 1 entering the SETTLED claim set): MaterialOrder.credit_memo_cents recomputed as the sum of payable_cents over SETTLED claims of that order, and settlement_status transitions INVOICED|SETTLED -> CREDIT_MEMO_ISSUED"
          - "hop 3 (caused by hop 2's credit_memo_cents change): ContractorAccount.credit_used_cents recomputed downward per calculations.account_credit_position"
          - "hop 4 (caused by hop 3's credit_used_cents change): ContractorAccount in CREDIT_HOLD with credit_used_cents <= ROUND_HALF_UP(credit_limit_cents * 0.90) auto-transitions to ACTIVE"
          - "when deposit_offset_cents > 0 the targeted ContainerReturn.forfeited_cents is reduced by deposit_offset_cents and ContractorAccount.pallet_deposit_balance_cents recomputed"
          - "increments ClaimCase.version by 1"

  - entity: PreBuyContract
    initial_state: DRAFT
    terminal_states: [EXHAUSTED, EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /prebuy-contracts/{preBuyContractId}/activate"
        actor: YardAdmin
        preconditions:
          - "Material.prebuy_eligible == true, else ERR_MATERIAL_NOT_PREBUY_ELIGIBLE"
          - "ContractorAccount.account_status == ACTIVE, else ERR_ACCOUNT_CREDIT_HOLD"
          - "current logical-clock date <= season_end_date, else ERR_PREBUY_OUT_OF_SEASON"
        side_effects:
          - "status = ACTIVE; increments PreBuyContract.version by 1"
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system, on recompute of drawn_cubic_yards after a MaterialOrder confirm"
        actor: system
        preconditions:
          - "remaining_cubic_yards <= 0"
        side_effects:
          - "status = EXHAUSTED; increments PreBuyContract.version by 1"
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system, on recompute of drawn_cubic_yards after a MaterialOrder cancel"
        actor: system
        preconditions:
          - "remaining_cubic_yards > 0 and current logical-clock date <= season_end_date"
        side_effects:
          - "status = ACTIVE; increments PreBuyContract.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc advancing the clock past season_end_date"
        actor: system
        preconditions:
          - "current logical-clock date > season_end_date"
        side_effects:
          - "status = EXPIRED; the contract id is returned in the clock endpoint's expired_prebuy_contract_ids; increments PreBuyContract.version by 1"
      - from: DRAFT
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc advancing the clock past season_end_date"
        actor: system
        preconditions:
          - "current logical-clock date > season_end_date"
        side_effects:
          - "status = EXPIRED; increments PreBuyContract.version by 1"

  - entity: PriceSchedule
    initial_state: SCHEDULED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: SCHEDULED
        to: EFFECTIVE
        trigger: "POST /price-schedules with effective_from <= current logical clock, or POST /_clock/set_current_utc advancing the clock to or past effective_from"
        actor: system
        preconditions:
          - "effective_from <= current logical clock"
        side_effects:
          - "status = EFFECTIVE; the id is listed in the clock endpoint's promoted_price_schedule_ids when the promotion came from a clock advance"
          - "the previously EFFECTIVE row for the same material_id transitions EFFECTIVE -> SUPERSEDED"
          - "increments PriceSchedule.version by 1"
      - from: EFFECTIVE
        to: SUPERSEDED
        trigger: "system, when a later-dated PriceSchedule for the same material becomes EFFECTIVE"
        actor: system
        preconditions:
          - "another PriceSchedule of the same material_id with a strictly greater effective_from has become EFFECTIVE"
        side_effects:
          - "status = SUPERSEDED; increments PriceSchedule.version by 1"

  - entity: InventoryLot
    initial_state: AVAILABLE
    terminal_states: [DEPLETED]
    transitions:
      - from: AVAILABLE
        to: QUARANTINED
        trigger: "POST /inventory-lots/{inventoryLotId}/moisture-readings with set_quarantine == true"
        actor: YardAdmin
        preconditions: []
        side_effects:
          - "status = QUARANTINED; current_moisture_pct = remeasured_moisture_pct; basis = SETTLEMENT; net_sellable_cubic_yards recomputed under the settlement_basis variant"
          - "Material.available_net_cubic_yards recomputed (a QUARANTINED lot contributes 0)"
          - "increments InventoryLot.version by 1"
      - from: QUARANTINED
        to: AVAILABLE
        trigger: "POST /inventory-lots/{inventoryLotId}/moisture-readings with set_quarantine == false"
        actor: YardAdmin
        preconditions: []
        side_effects:
          - "status = AVAILABLE; current_moisture_pct = remeasured_moisture_pct; basis = SETTLEMENT; net_sellable_cubic_yards recomputed under the settlement_basis variant; Material.available_net_cubic_yards recomputed"
          - "increments InventoryLot.version by 1"
      - from: AVAILABLE
        to: DEPLETED
        trigger: "system, on POST /delivery-loads/{deliveryLoadId}/deliver or POST /will-call-tickets/{willCallTicketId}/load"
        actor: system
        preconditions:
          - "net_sellable_cubic_yards - withdrawn_gross_cubic_yards <= 0"
        side_effects:
          - "status = DEPLETED; the lot is excluded from future confirm-time allocation; increments InventoryLot.version by 1"

  - entity: ContainerReturn
    initial_state: OUTSTANDING
    terminal_states: [CLOSED, FORFEITED]
    transitions:
      - from: OUTSTANDING
        to: PARTIALLY_RETURNED
        trigger: "POST /container-returns/{containerReturnId}/receive with returned_count < issued_count"
        actor: YardLoader
        preconditions:
          - "returned_count >= 1 and returned_count <= issued_count - current returned_count, else ERR_RETURN_COUNT_EXCEEDS_ISSUED"
        side_effects:
          - "hop 1: returned_count += request returned_count; last_received_at = current logical clock; refund_cents recomputed by calculations.container_deposit_refund; status = PARTIALLY_RETURNED"
          - "hop 2 (caused by hop 1's refund_cents change): ContractorAccount.pallet_deposit_balance_cents recomputed downward by the refund delta"
          - "increments ContainerReturn.version by 1"
      - from: PARTIALLY_RETURNED
        to: PARTIALLY_RETURNED
        trigger: "POST /container-returns/{containerReturnId}/receive with cumulative returned_count still < issued_count"
        actor: YardLoader
        preconditions:
          - "returned_count >= 1 and cumulative returned_count < issued_count"
        side_effects:
          - "self-loop: returned_count and refund_cents grow; ContractorAccount.pallet_deposit_balance_cents recomputed; increments ContainerReturn.version by 1"
      - from: OUTSTANDING
        to: CLOSED
        trigger: "POST /container-returns/{containerReturnId}/receive bringing cumulative returned_count == issued_count"
        actor: YardLoader
        preconditions:
          - "cumulative returned_count == issued_count"
        side_effects:
          - "hop 1: refund_cents recomputed; forfeited_cents = issued_count * deposit_per_unit_cents - refund_cents; status = CLOSED"
          - "hop 2 (caused by hop 1): ContractorAccount.pallet_deposit_balance_cents recomputed to 0 for this row (refund + forfeited exactly retire the issued liability)"
          - "increments ContainerReturn.version by 1"
      - from: PARTIALLY_RETURNED
        to: CLOSED
        trigger: "POST /container-returns/{containerReturnId}/receive bringing cumulative returned_count == issued_count"
        actor: YardLoader
        preconditions:
          - "cumulative returned_count == issued_count"
        side_effects:
          - "identical to OUTSTANDING -> CLOSED; increments ContainerReturn.version by 1"
      - from: OUTSTANDING
        to: FORFEITED
        trigger: "POST /container-returns/{containerReturnId}/forfeit"
        actor: YardAdmin
        preconditions: []
        side_effects:
          - "hop 1: forfeited_cents = issued_count * deposit_per_unit_cents - refund_cents; status = FORFEITED"
          - "hop 2 (caused by hop 1): ContractorAccount.pallet_deposit_balance_cents recomputed to 0 for this row"
          - "increments ContainerReturn.version by 1"
      - from: PARTIALLY_RETURNED
        to: FORFEITED
        trigger: "POST /container-returns/{containerReturnId}/forfeit"
        actor: YardAdmin
        preconditions: []
        side_effects:
          - "identical to OUTSTANDING -> FORFEITED: the unreturned remainder is retained and the deposit liability for this row reaches 0; increments ContainerReturn.version by 1"

  - entity: JobPurchaseOrder
    initial_state: OPEN
    terminal_states: [CLOSED]
    note: "The EXHAUSTED state is a reversible commitment ceiling, not a terminal state: it is entered and left by committed_cents crossing po_limit_cents in either direction."
    transitions:
      - from: OPEN
        to: EXHAUSTED
        trigger: "system, on POST /material-orders/{materialOrderId}/confirm when the recomputed committed_cents reaches po_limit_cents"
        actor: system
        preconditions:
          - "committed_cents + MaterialOrder.quoted_total_cents <= po_limit_cents at confirm time, else ERR_PO_LIMIT_EXCEEDED and no transition occurs"
          - "committed_cents >= po_limit_cents after the recomputation"
        side_effects:
          - "committed_cents recomputed as the sum of COALESCE(final_total_cents, quoted_total_cents) - credit_memo_cents over this PO's MaterialOrder rows whose fulfillment_status IN {CONFIRMED, ALLOCATED, FULFILLED}"
          - "status = EXHAUSTED; further orders tagged to this PO cannot confirm (ERR_PO_LIMIT_EXCEEDED)"
          - "increments JobPurchaseOrder.version by 1"
      - from: EXHAUSTED
        to: OPEN
        trigger: "system, on POST /material-orders/{materialOrderId}/cancel or on POST /delivery-loads/{deliveryLoadId}/deliver or POST /claim-cases/{claimCaseId}/settle lowering committed_cents"
        actor: system
        preconditions:
          - "committed_cents < po_limit_cents after the recomputation"
        side_effects:
          - "committed_cents recomputed by the same expression; status = OPEN, restoring headroom for later orders"
          - "increments JobPurchaseOrder.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /job-purchase-orders/{jobPurchaseOrderId}/close"
        actor: Contractor | YardAdmin
        preconditions:
          - "status == OPEN, else ERR_PO_NOT_OPEN (an EXHAUSTED purchase order must first fall back to OPEN)"
        side_effects:
          - "status = CLOSED; committed_cents is frozen at its current value"
          - "increments JobPurchaseOrder.version by 1"

concurrency_rules:
  - rule_id: price-schedule-create-stale-material
    parent_entity: Material
    write_endpoint: "POST /price-schedules"
    occ_field: "expected_material_version"
    description: |
      Creating a PriceSchedule against a Material whose version has advanced since the client
      last observed it is rejected with a stale-version error. A new schedule legitimately
      supersedes the material's currently EFFECTIVE row, so a writer holding an outdated view of
      the material would silently retire a price row it never saw.
    error_id: ERR_STALE_MATERIAL_VERSION
    http_status: 412
  - rule_id: credit-adjustment-stale-account
    parent_entity: ContractorAccount
    write_endpoint: "POST /contractor-accounts/{contractorAccountId}/credit-adjustments"
    occ_field: "expected_contractor_account_version"
    description: |
      Setting a new credit limit on a ContractorAccount whose version has advanced since the
      client last observed it is rejected with a stale-version error. A credit adjustment
      legitimately supersedes the prior limit, so a writer whose view of credit_used_cents is
      stale would approve a line against a balance that no longer exists.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

calculations:
  - name: inventory_net_sellable_volume
    trigger: "On POST /inventory-lots (intake) and on every POST /inventory-lots/{inventoryLotId}/moisture-readings; writes InventoryLot.net_sellable_cubic_yards and Material.available_net_cubic_yards."
    algorithm: threshold
    formula: |
      # Shared moisture normaliser, clamped on both ends.
      moisture_adjust(m) = CLAMP(1 - (m - MOISTURE_REFERENCE_PCT) / 100,
                                 MOISTURE_ADJUST_FLOOR, MOISTURE_ADJUST_CEIL)

      # variant intake_basis (basis == INTAKE): full shrinkage on the whole gross pile
      net_sellable_cubic_yards = ROUND_HALF_UP(
          gross_cubic_yards
          * (1 - shrinkage_factor)
          * moisture_adjust(moisture_pct_at_intake), 2)

      # variant settlement_basis (basis == SETTLEMENT): the pile has already settled, so only
      # HALF the shrinkage factor is charged, and the arithmetic runs on the volume that is
      # still on the ground.
      net_sellable_cubic_yards = ROUND_HALF_UP(
          (gross_cubic_yards - withdrawn_gross_cubic_yards)
          * (1 - shrinkage_factor / 2)
          * moisture_adjust(current_moisture_pct), 2)

      # Material roll-up (AVAILABLE lots only; QUARANTINED and DEPLETED lots contribute 0)
      Material.available_net_cubic_yards = ROUND_HALF_UP(SUM over InventoryLot rows of this
          material with status == AVAILABLE of (net_sellable_cubic_yards - reserved_cubic_yards), 2)
    input_set: "The lot itself; the Material roll-up includes only lots with status == AVAILABLE, ordered irrelevant because the operation is a sum."
    constants:
      MOISTURE_REFERENCE_PCT: 15.0
      MOISTURE_ADJUST_FLOOR: 0.80
      MOISTURE_ADJUST_CEIL: 1.00
    precision: "cubic yards, 2 decimal places, round_half_up; the clamp is applied to the multiplier BEFORE the volume multiplication"
    variants:
      - name: intake_basis
        when: "InventoryLot.basis == INTAKE, i.e. no moisture reading has been filed since intake"
        difference: "Charges the full shrinkage_factor against the full gross_cubic_yards using moisture_pct_at_intake."
      - name: settlement_basis
        when: "InventoryLot.basis == SETTLEMENT, i.e. at least one moisture reading has been filed"
        difference: "Charges only shrinkage_factor/2 and works from (gross - withdrawn) using current_moisture_pct, so the same physical lot yields a different sellable volume than intake_basis."

  - name: order_line_pricing
    trigger: "On POST /material-orders/{materialOrderId}/confirm (variant quoted_at_confirm) and on POST /delivery-loads/{deliveryLoadId}/deliver or POST /will-call-tickets/{willCallTicketId}/release (variant final_at_delivery); writes OrderLine.unit_price_cents, line_price_cents, line_volume_cubic_yards, delivered_volume_cubic_yards, final_line_price_cents."
    algorithm: tiered_pricing
    formula: |
      # ---- unit price selection -------------------------------------------------
      # PS(t) = the PriceSchedule row of the line's material_id whose status was EFFECTIVE at
      # instant t; formally the row with the greatest effective_from <= t. Exactly one such row
      # exists because promotions supersede predecessors.
      if OrderLine.prebuy_contract_id != null:
          bulk_unit_basis_cents = PreBuyContract.locked_price_per_cubic_yard_cents
          surcharge_pct         = 0.0            # locked price is immune to seasonal surcharge
      else:
          bulk_unit_basis_cents = PS(t).bulk_price_per_cubic_yard_cents
          surcharge_pct         = PS(t).seasonal_surcharge_pct

      # ---- line extension, ONE rounding at line level ---------------------------
      if form == BULK:
          unit_price_cents  = ROUND_HALF_UP(bulk_unit_basis_cents * (1 + surcharge_pct / 100))
          line_price_cents  = ROUND_HALF_UP(billable_quantity * bulk_unit_basis_cents
                                            * (1 + surcharge_pct / 100))
          # NOTE: line_price_cents is computed from the UNROUNDED unit basis; unit_price_cents is
          # a display field and is NEVER multiplied by quantity. Rounding order is pinned as
          # "extend the line at full precision, round the line, THEN sum the lines" -- summing
          # first and rounding once at order level is explicitly NOT the rule.
      if form == BAGGED:
          unit_price_cents  = PS(t).bagged_price_per_bag_cents      # no surcharge on bagged
          line_price_cents  = unit_price_cents * billable_quantity  # integer bags, exact
      line_volume_cubic_yards = quantity                            if form == BULK
                              = ROUND_HALF_UP(quantity * Material.unit_bag_cubic_yards, 2) if BAGGED

      # ---- delivered-volume waterfall (variant final_at_delivery only) ----------
      # Distribute actual_net_cubic_yards (or WillCallTicket.loaded_cubic_yards) across the
      # order's BULK OrderLine rows sorted by created_at ASC:
      remaining = actual_net_cubic_yards
      for line in bulk_lines sorted by created_at ASC:
          take = MIN(remaining, line.line_volume_cubic_yards - line.delivered_volume_cubic_yards)
          line.delivered_volume_cubic_yards += take
          remaining -= take
      if remaining > 0:                      # overflow lands on the LAST line by created_at ASC
          last_bulk_line.delivered_volume_cubic_yards += remaining
    input_set: "All OrderLine rows of the order. quoted_at_confirm bills the ordered quantity; final_at_delivery bills only delivered_volume_cubic_yards for BULK lines and leaves BAGGED lines at their quoted line_price_cents."
    constants: {}
    precision: "cents, integer, round_half_up; per-line rounding first, order-level summation second (pinned)"
    variants:
      - name: quoted_at_confirm
        when: "MaterialOrder DRAFT -> CONFIRMED"
        difference: "t = MaterialOrder.quote_locked_at (the confirm instant); billable_quantity = OrderLine.quantity."
      - name: final_at_delivery
        when: "DeliveryLoad DISPATCHED -> DELIVERED or WillCallTicket LOADED -> RELEASED"
        difference: "t = the delivering DeliveryLoad's dispatch instant (or the ticket's staging_window_start for will-call); billable_quantity = delivered_volume_cubic_yards for BULK lines, so a seasonal price promotion between confirm and dispatch makes final_line_price_cents diverge from line_price_cents for identical order data. BAGGED lines are NOT repriced."

  - name: order_charge_assembly
    trigger: "Immediately after order_line_pricing on POST /material-orders/{materialOrderId}/confirm (quoted_at_confirm), and on POST /delivery-loads/{deliveryLoadId}/deliver or POST /will-call-tickets/{willCallTicketId}/release (final_at_delivery); writes MaterialOrder.bulk_subtotal_cents, bagged_subtotal_cents, volume_discount_pct, volume_discount_cents, min_load_fee_cents, delivery_fee_cents, quoted_total_cents / final_total_cents."
    algorithm: waterfall_allocation
    formula: |
      # The evaluation order below is PINNED. The dependency looks circular -- the minimum-load
      # fee is decided on the POST-discount bulk figure while the discount tier is decided on the
      # PRE-discount bulk figure -- so the sequence, not the algebra, defines the value.
      step 1: bulk_subtotal_cents   = SUM(line_price_cents) over OrderLine WHERE form == BULK
      step 2: bagged_subtotal_cents = SUM(line_price_cents) over OrderLine WHERE form == BAGGED
      step 3: volume_discount_pct   = tier of VOLUME_DISCOUNT_TIERS containing
                                      bulk_subtotal_cents  (lower bound inclusive, upper bound
                                      exclusive) -- selected on the PRE-discount figure
      step 4: volume_discount_cents = ROUND_HALF_UP(bulk_subtotal_cents * volume_discount_pct / 100)
      step 5: discounted_bulk_cents = bulk_subtotal_cents - volume_discount_cents
      step 6: min_load_fee_cents    = MIN_LOAD_FEE_CENTS
                                      IF fulfillment_mode == DELIVERY
                                         AND bulk_subtotal_cents > 0
                                         AND discounted_bulk_cents < MIN_LOAD_SUBTOTAL_CENTS
                                      ELSE 0        # WILL_CALL is always exempt
      step 7: delivery_fee_cents    = 0 IF fulfillment_mode == WILL_CALL ELSE
                                      DELIVERY_BASE_CENTS_BY_AXLE[axle] +
                                      ROUND_HALF_UP(delivery_distance_miles * DELIVERY_PER_MILE_CENTS)
              # axle = MAX_AXLE_BY_ACCESS_CLASS[driveway_access_class] under quoted_at_confirm
              # axle = the DELIVERED load's DeliveryTruck.axle_class under final_at_delivery
      step 8: total_cents           = discounted_bulk_cents + bagged_subtotal_cents
                                      + min_load_fee_cents + delivery_fee_cents
    input_set: "Every OrderLine of the order (no status filter -- lines cannot be deleted). Steps 3 and 6 read the figures produced by the immediately preceding steps only."
    constants:
      MIN_LOAD_SUBTOTAL_CENTS: 25000
      MIN_LOAD_FEE_CENTS: 7500
      VOLUME_DISCOUNT_TIERS: "[0, 100000) -> 0.0 ; [100000, 250000) -> 3.0 ; [250000, inf) -> 6.0"
      DELIVERY_BASE_CENTS_BY_AXLE: { SINGLE: 6500, TANDEM: 9500, TRI_AXLE: 13500 }
      DELIVERY_PER_MILE_CENTS: 425
      MAX_AXLE_BY_ACCESS_CLASS: { CLASS_A: TRI_AXLE, CLASS_B: TANDEM, CLASS_C: SINGLE }
    precision: "cents, integer, round_half_up at steps 4 and 7 only"
    variants:
      - name: quoted_at_confirm
        when: "MaterialOrder DRAFT -> CONFIRMED; result stored in quoted_total_cents"
        difference: "Uses ordered quantities and the largest axle class the driveway_access_class admits, because no truck is assigned yet."
      - name: final_at_delivery
        when: "DeliveryLoad DISPATCHED -> DELIVERED / WillCallTicket LOADED -> RELEASED; result stored in final_total_cents"
        difference: "Uses delivered volumes, the dispatch-instant PriceSchedule, and the actual truck's axle_class, so final_total_cents differs from quoted_total_cents for identical order input."

  - name: truck_load_fit
    trigger: "On POST /delivery-loads and POST /delivery-loads/{deliveryLoadId}/replan; writes DeliveryLoad.planned_payload_lb, DeliveryLoad.max_allowed_cubic_yards and Material.effective_density_lb_per_cubic_yard."
    algorithm: constraint_propagation
    formula: |
      effective_density_lb_per_cubic_yard = ROUND_HALF_UP(
          Material.density_lb_per_cubic_yard
          * (1 + (Material.moisture_pct - MOISTURE_REFERENCE_PCT) / 100), 2)

      planned_payload_lb = ROUND_HALF_UP(planned_cubic_yards
                                         * effective_density_lb_per_cubic_yard)

      # Non-linear three-input ceiling: geometry, legal weight, and site access interact.
      payload_headroom_cy   = FLOOR_2DP(DeliveryTruck.max_payload_lb
                                        / effective_density_lb_per_cubic_yard)
      max_allowed_cubic_yards = MIN(DeliveryTruck.bed_capacity_cubic_yards,
                                    payload_headroom_cy,
                                    DRIVEWAY_CAP_CUBIC_YARDS[MaterialOrder.driveway_access_class])

      # Gate ordering is fixed by validations: the weight gate (business_safety, priority 20)
      # is evaluated BEFORE the volume gate (business_constraint, priority 23).
      gate A (safety):     planned_payload_lb <= DeliveryTruck.max_payload_lb
                           else ERR_AXLE_WEIGHT_LIMIT_EXCEEDED
      gate B (safety):     ACCESS_RANK[MaterialOrder.driveway_access_class]
                           >= ACCESS_RANK[DeliveryTruck.min_driveway_access_class]
                           else ERR_DRIVEWAY_ACCESS_RESTRICTED
      gate C (constraint): planned_cubic_yards <= MIN(bed_capacity_cubic_yards,
                              DRIVEWAY_CAP_CUBIC_YARDS[driveway_access_class])
                           else ERR_LOAD_EXCEEDS_TRUCK_CAPACITY
    input_set: "The material of the load's pinned inventory_lot_id, the load's DeliveryTruck, and the order's driveway_access_class."
    constants:
      MOISTURE_REFERENCE_PCT: 15.0
      DRIVEWAY_CAP_CUBIC_YARDS: { CLASS_A: 999.0, CLASS_B: 12.0, CLASS_C: 6.0 }
      ACCESS_RANK: { CLASS_A: 3, CLASS_B: 2, CLASS_C: 1 }
    precision: "effective density 2 decimals round_half_up; payload integer pounds round_half_up; payload_headroom_cy truncated DOWN to 2 decimals (FLOOR_2DP) so a rounding-up never authorises an overweight load"
    variants: []

  - name: account_credit_position
    trigger: "On every mutation that changes a MaterialOrder total, settlement_status, fulfillment_status or credit_memo_cents, and on POST /contractor-accounts/{contractorAccountId}/credit-adjustments; writes ContractorAccount.credit_used_cents and credit_available_cents."
    algorithm: aggregation
    formula: |
      credit_used_cents = SUM over MaterialOrder rows WHERE contractor_account_id == account.id
                            AND fulfillment_status IN {CONFIRMED, ALLOCATED, FULFILLED}
                            AND settlement_status IN {UNBILLED, INVOICED, CREDIT_MEMO_ISSUED}
                          OF (COALESCE(final_total_cents, quoted_total_cents) - credit_memo_cents)

      credit_available_cents = credit_limit_cents - credit_used_cents   # may go negative

      # Hysteresis band (asymmetric on purpose):
      enter CREDIT_HOLD  when credit_used_cents >  credit_limit_cents          (strict)
      leave CREDIT_HOLD  when credit_used_cents <= ROUND_HALF_UP(
                                credit_limit_cents * CREDIT_HOLD_RELEASE_RATIO)
      # Confirm-time gate uses the inclusive form:
      confirm allowed when credit_available_cents >= quoted_total_cents
    input_set: "Orders in fulfillment_status {CONFIRMED, ALLOCATED, FULFILLED}; DRAFT and CANCELLED orders never consume credit, and settlement_status == SETTLED releases it."
    constants:
      CREDIT_HOLD_RELEASE_RATIO: 0.90
    precision: "cents, integer; the release threshold is ROUND_HALF_UP of the ratio product"
    variants: []

  - name: claim_settlement_waterfall
    trigger: "On POST /claim-cases/{claimCaseId}/decide with decision == APPROVE; writes ClaimCase.payable_cents, invoice_offset_cents, deposit_offset_cents, goodwill_credit_cents."
    algorithm: waterfall_allocation
    formula: |
      # ---- stage 1: cap the approved amount by claim family ---------------------
      if claim_type == DRIVEWAY_DAMAGE:
          deductible = 0 IF (delivery_load_id != null
                             AND DeliveryLoad.driveway_protection_used == false)
                        ELSE DRIVEWAY_DEDUCTIBLE_CENTS
          payable_cents = MAX(0, approved_amount_cents - deductible)
      if claim_type == SPILLAGE:
          payable_cents = MIN(approved_amount_cents, SPILLAGE_CLEANUP_CAP_CENTS)
      if claim_type == SHORT_LOAD:
          payable_cents = MIN(approved_amount_cents,
                              COALESCE(MaterialOrder.final_total_cents,
                                       MaterialOrder.quoted_total_cents))

      # ---- stage 2: pour payable_cents through three ordered buckets ------------
      remaining = payable_cents
      bucket 1  outstanding_invoice = MAX(0, COALESCE(final_total_cents, quoted_total_cents)
                                             - credit_memo_cents - paid_amount_cents)
                invoice_offset_cents = MIN(remaining, outstanding_invoice)
                remaining -= invoice_offset_cents
      bucket 2  deposit_exposure = SUM over ContainerReturn rows of this MaterialOrder,
                                   ordered by created_at ASC, of forfeited_cents
                deposit_offset_cents = MIN(remaining, deposit_exposure)
                remaining -= deposit_offset_cents
      bucket 3  goodwill_credit_cents = remaining          # remainder, never negative
      # invoice_offset_cents + deposit_offset_cents + goodwill_credit_cents == payable_cents
    input_set: "The claim, its MaterialOrder, its optional DeliveryLoad, and every ContainerReturn of that order (created_at ASC for the bucket-2 sweep)."
    constants:
      DRIVEWAY_DEDUCTIBLE_CENTS: 15000
      SPILLAGE_CLEANUP_CAP_CENTS: 40000
    precision: "cents, integer; no rounding required because every term is already integral"
    variants: []

  - name: container_deposit_refund
    trigger: "On POST /container-returns/{containerReturnId}/receive; writes ContainerReturn.refund_cents and forfeited_cents, then ContractorAccount.pallet_deposit_balance_cents."
    algorithm: decay_function
    formula: |
      seconds_late   = MAX(0, EPOCH(received_at) - EPOCH(issued_at)
                              - CONTAINER_GRACE_DAYS * 86400)
      weeks_late     = CEIL(seconds_late / 604800)          # any part-week counts as a full week
      decay_multiplier = MAX(0, 1 - CONTAINER_LATE_DECAY_PCT_PER_WEEK / 100 * weeks_late)

      refund_delta_cents = ROUND_HALF_UP(request.returned_count * deposit_per_unit_cents
                                         * decay_multiplier)
      refund_cents      = refund_cents + refund_delta_cents        # cumulative across receives
      # forfeited_cents is written only when the row reaches CLOSED or FORFEITED:
      forfeited_cents   = issued_count * deposit_per_unit_cents - refund_cents
    input_set: "The ContainerReturn row plus the logical clock; received_at is always the current logical clock, never a client value."
    constants:
      CONTAINER_GRACE_DAYS: 30
      CONTAINER_LATE_DECAY_PCT_PER_WEEK: 25
      BAGS_PER_CONTAINER: 48
      CONTAINER_TYPE_BY_CATEGORY: { MULCH: PALLET, AGGREGATE: PALLET, SOIL: SUPER_SACK, SALT: SALT_TOTE }
      CONTAINER_DEPOSIT_BY_TYPE: { PALLET: 2500, SUPER_SACK: 6000, SALT_TOTE: 4500 }
    precision: "cents, integer, round_half_up per receive call; the decay boundary is exact -- at exactly CONTAINER_GRACE_DAYS the multiplier is 1.0, one second later it is 0.75"
    variants: []

  - name: will_call_queue_ranking
    trigger: "On POST /will-call-tickets (assigns queue_position), on POST /will-call-tickets/stage-next (selects the ticket to stage), and on every ticket status change (renumbers the queue)."
    algorithm: chronological
    formula: |
      priority_class(ticket) = 2 IF the ticket's MaterialOrder has >= 1 OrderLine with
                                    prebuy_contract_id != null ELSE 1

      # (a) eligibility filter -- explicit predicate, no fuzzy adjectives:
      candidates = WillCallTicket rows WHERE status == QUEUED
                     AND MaterialOrder.fulfillment_status IN {CONFIRMED, ALLOCATED}
                     AND MaterialOrder's ContractorAccount.account_status == ACTIVE
                     AND requested_pickup_at <= current logical clock
      # (b) ranking expression:
      sort candidates BY priority_class DESC, requested_pickup_at ASC, created_at ASC
      # (c) tie-break: created_at ASC is the final discriminator (id is NEVER consulted)
      # (d) empty candidate set -> ERR_WILL_CALL_QUEUE_EMPTY (409); nothing is staged
      selected = first row of the sorted candidates

      # queue_position is the 1-based index of a QUEUED ticket in the same ordering, computed
      # over ALL QUEUED tickets of the yard (not only the eligible ones).
    input_set: "All WillCallTicket rows with status == QUEUED; the eligibility filter additionally reads each ticket's MaterialOrder and ContractorAccount."
    constants:
      WILL_CALL_STAGING_CAPACITY: 2
    precision: "integer positions, 1-based"
    variants: []

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and non-empty; X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the called endpoint's roles list in section 1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "when the acting role is Contractor, X-User-ID equals the contractor_account_id reachable from the target resource (order, PO, pre-buy contract, ticket, claim, container return)"
    error_id: ERR_ACCOUNT_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all Contractor-callable endpoints"
  - priority: 4
    category: auth
    check: "when the acting role is ClaimsAdjuster and the claim carries a delivery_load_id, the load's dispatched_by_user_id differs from the acting X-User-ID (the dispatcher of a load may not judge its claim)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /claim-cases/{claimCaseId}/decide"
  - priority: 5
    category: business_constraint
    check: "request body shape: required fields present, enums within their declared sets, numeric fields positive where declared, BAGGED quantity integral, pagination limit within [1,100] and offset >= 0, decision one of {APPROVE, DENY} with the matching companion field"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 6
    category: existence
    check: "path-parameter resources exist, validated left-to-right"
    error_id: "ERR_MATERIAL_NOT_FOUND | ERR_PRICE_SCHEDULE_NOT_FOUND | ERR_INVENTORY_LOT_NOT_FOUND | ERR_ACCOUNT_NOT_FOUND | ERR_PO_NOT_FOUND | ERR_PREBUY_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_ORDER_LINE_NOT_FOUND | ERR_TRUCK_NOT_FOUND | ERR_LOAD_NOT_FOUND | ERR_TICKET_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_CONTAINER_RETURN_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 7
    category: existence
    check: "body foreign keys exist, validated in the field order declared by the endpoint's input list"
    error_id: "ERR_MATERIAL_NOT_FOUND | ERR_ACCOUNT_NOT_FOUND | ERR_PO_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_TRUCK_NOT_FOUND | ERR_LOAD_NOT_FOUND | ERR_TICKET_NOT_FOUND"
    http_status: 404
    applies_to: "all POST endpoints carrying FK fields"
  - priority: 8
    category: state
    check: "OCC: expected_material_version equals Material.version"
    error_id: ERR_STALE_MATERIAL_VERSION
    http_status: 412
    applies_to: "POST /price-schedules"
  - priority: 9
    category: state
    check: "OCC: expected_contractor_account_version equals ContractorAccount.version"
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412
    applies_to: "POST /contractor-accounts/{contractorAccountId}/credit-adjustments"
  - priority: 10
    category: state
    check: "MaterialOrder.fulfillment_status == DRAFT for line creation and for confirm"
    error_id: ERR_ORDER_NOT_DRAFT
    http_status: 409
    applies_to: "POST /order-lines, POST /material-orders/{materialOrderId}/confirm"
  - priority: 11
    category: state
    check: "MaterialOrder.fulfillment_status NOT IN {FULFILLED, CANCELLED} for cancel"
    error_id: ERR_ORDER_ALREADY_TERMINAL
    http_status: 409
    applies_to: "POST /material-orders/{materialOrderId}/cancel"
  - priority: 12
    category: state
    check: "MaterialOrder.fulfillment_status == FULFILLED for invoice; settlement_status IN {INVOICED, CREDIT_MEMO_ISSUED} for settle"
    error_id: ERR_ORDER_NOT_FULFILLED
    http_status: 409
    applies_to: "POST /material-orders/{materialOrderId}/invoice, POST /material-orders/{materialOrderId}/settle"
  - priority: 13
    category: state
    check: "no DeliveryLoad of the order is in status DISPATCHED when cancelling the order"
    error_id: ERR_ORDER_HAS_DISPATCHED_LOAD
    http_status: 409
    applies_to: "POST /material-orders/{materialOrderId}/cancel"
  - priority: 14
    category: state
    check: "DeliveryLoad.status == PLANNED for dispatch and cancel; == DISPATCHED for deliver and refuse; == REFUSED for replan; the order's fulfillment_status IN {CONFIRMED, ALLOCATED} for load creation"
    error_id: "ERR_LOAD_NOT_PLANNED | ERR_LOAD_NOT_DISPATCHED | ERR_LOAD_NOT_REFUSED | ERR_ORDER_NOT_ALLOCATABLE"
    http_status: 409
    applies_to: "POST /delivery-loads and all POST /delivery-loads/{deliveryLoadId}/* actions"
  - priority: 15
    category: state
    check: "WillCallTicket.status == STAGED for safety-ack; == LOADING for load; == LOADED for release; IN {QUEUED, STAGED} for cancel"
    error_id: "ERR_TICKET_NOT_STAGED | ERR_TICKET_NOT_LOADING | ERR_TICKET_NOT_LOADED | ERR_TICKET_NOT_CANCELLABLE"
    http_status: 409
    applies_to: "all POST /will-call-tickets/{willCallTicketId}/* actions"
  - priority: 16
    category: state
    check: "ClaimCase.status == SUBMITTED for start-review; == UNDER_REVIEW for request-info and decide; == INFO_REQUESTED for provide-info; == APPROVED for settle"
    error_id: "ERR_CLAIM_NOT_REVIEWABLE | ERR_CLAIM_NOT_APPROVED"
    http_status: 409
    applies_to: "all POST /claim-cases/{claimCaseId}/* actions"
  - priority: 17
    category: state
    check: "PreBuyContract.status == DRAFT for activate; ContainerReturn.status NOT IN {CLOSED, FORFEITED} for receive and forfeit; JobPurchaseOrder.status == OPEN for close"
    error_id: "ERR_PREBUY_NOT_DRAFT | ERR_CONTAINER_RETURN_CLOSED | ERR_PO_NOT_OPEN"
    http_status: 409
    applies_to: "POST /prebuy-contracts/{preBuyContractId}/activate, POST /container-returns/{containerReturnId}/receive, POST /container-returns/{containerReturnId}/forfeit, POST /job-purchase-orders/{jobPurchaseOrderId}/close"
  - priority: 18
    category: state
    check: "cross-entity state: every line's Material.status == ACTIVE at confirm; the pinned InventoryLot.status == AVAILABLE at dispatch; DeliveryTruck.status == AVAILABLE at load creation, dispatch and replan; the order's ContractorAccount.account_status == ACTIVE at confirm, dispatch and staging; a referenced PreBuyContract.status == ACTIVE at confirm"
    error_id: "ERR_MATERIAL_NOT_SELLABLE | ERR_LOT_QUARANTINED | ERR_TRUCK_UNAVAILABLE | ERR_ACCOUNT_CREDIT_HOLD | ERR_PREBUY_NOT_ACTIVE"
    http_status: 409
    applies_to: "POST /material-orders/{materialOrderId}/confirm, POST /delivery-loads, POST /delivery-loads/{deliveryLoadId}/dispatch, POST /delivery-loads/{deliveryLoadId}/replan, POST /will-call-tickets/stage-next"
  - priority: 19
    category: business_safety
    check: "WillCallTicket.ppe_confirmed is true (request body at safety-ack, stored value at load) before any material moves at the loading bay"
    error_id: ERR_SAFETY_ACK_REQUIRED
    http_status: 422
    applies_to: "POST /will-call-tickets/{willCallTicketId}/safety-ack, POST /will-call-tickets/{willCallTicketId}/load"
  - priority: 20
    category: business_safety
    check: "planned_payload_lb <= DeliveryTruck.max_payload_lb (inclusive; equality is legal)"
    error_id: ERR_AXLE_WEIGHT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /delivery-loads, POST /delivery-loads/{deliveryLoadId}/replan"
  - priority: 21
    category: business_safety
    check: "ACCESS_RANK[order.driveway_access_class] >= ACCESS_RANK[truck.min_driveway_access_class]"
    error_id: ERR_DRIVEWAY_ACCESS_RESTRICTED
    http_status: 422
    applies_to: "POST /delivery-loads, POST /delivery-loads/{deliveryLoadId}/replan"
  - priority: 22
    category: business_safety
    check: "when the order's ContractorAccount.driveway_protection_required is true, the delivery report must carry driveway_protection_used == true"
    error_id: ERR_DRIVEWAY_PROTECTION_REQUIRED
    http_status: 422
    applies_to: "POST /delivery-loads/{deliveryLoadId}/deliver"
  - priority: 23
    category: business_constraint
    check: "planned_cubic_yards <= MIN(bed_capacity_cubic_yards, DRIVEWAY_CAP_CUBIC_YARDS[driveway_access_class])"
    error_id: ERR_LOAD_EXCEEDS_TRUCK_CAPACITY
    http_status: 422
    applies_to: "POST /delivery-loads, POST /delivery-loads/{deliveryLoadId}/replan"
  - priority: 24
    category: business_constraint
    check: "truck window semantics (half-open plus symmetric turnaround buffer): for every other DeliveryLoad of the same delivery_truck_id with status IN {PLANNED, DISPATCHED}, reject when new.window_start < other.window_end + 45min AND other.window_start < new.window_end + 45min; a new window starting exactly at other.window_end + 45min is accepted"
    error_id: ERR_TRUCK_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /delivery-loads, POST /delivery-loads/{deliveryLoadId}/replan"
  - priority: 25
    category: business_constraint
    check: "pre-buy season semantics (fully closed date intervals, no buffer, day granularity): for every other PreBuyContract with the same contractor_account_id and material_id in status IN {DRAFT, ACTIVE}, reject when NOT (new.season_end_date < other.season_start_date OR other.season_end_date < new.season_start_date); seasons that merely touch on a single shared day therefore conflict"
    error_id: ERR_PREBUY_SEASON_OVERLAP
    http_status: 409
    applies_to: "POST /prebuy-contracts"
  - priority: 26
    category: business_constraint
    check: "count of WillCallTicket rows in status IN {STAGED, LOADING} whose closed [staging_window_start, staging_window_end] interval intersects the requested staging window is < WILL_CALL_STAGING_CAPACITY (2)"
    error_id: ERR_STAGING_CAPACITY_FULL
    http_status: 409
    applies_to: "POST /will-call-tickets/stage-next"
  - priority: 27
    category: business_constraint
    check: "the will_call_queue_ranking candidate set is non-empty (empty-collection edge)"
    error_id: ERR_WILL_CALL_QUEUE_EMPTY
    http_status: 409
    applies_to: "POST /will-call-tickets/stage-next"
  - priority: 28
    category: business_constraint
    check: "order carries >= 1 OrderLine at confirm; Material.sku unique; JobPurchaseOrder.po_number unique within its account; OrderLine.form appears in Material.offered_forms; a WillCallTicket requires fulfillment_mode == WILL_CALL and a DeliveryLoad requires fulfillment_mode == DELIVERY"
    error_id: "ERR_ORDER_HAS_NO_LINES | ERR_DUPLICATE_SKU | ERR_DUPLICATE_PO_NUMBER | ERR_FORM_NOT_OFFERED | ERR_WILL_CALL_MODE_REQUIRED | ERR_DELIVERY_MODE_REQUIRED"
    http_status: 422
    applies_to: "POST /materials, POST /job-purchase-orders, POST /order-lines, POST /material-orders/{materialOrderId}/confirm, POST /will-call-tickets, POST /delivery-loads"
  - priority: 29
    category: business_referential
    check: "when ContractorAccount.po_required is true the order must carry job_purchase_order_id; a supplied PO must belong to the same account; a claim's delivery_load_id / will_call_ticket_id must belong to the claim's material_order_id; a pre-buy contract requires Material.prebuy_eligible == true"
    error_id: "ERR_PO_REQUIRED | ERR_PO_ACCOUNT_MISMATCH | ERR_CLAIM_TARGET_MISMATCH | ERR_MATERIAL_NOT_PREBUY_ELIGIBLE"
    http_status: 422
    applies_to: "POST /material-orders, POST /material-orders/{materialOrderId}/confirm, POST /claim-cases, POST /prebuy-contracts/{preBuyContractId}/activate"
  - priority: 30
    category: business_temporal
    check: "window_end > window_start on delivery loads and staging windows; a new PriceSchedule.effective_from must be strictly greater than the effective_from of the material's currently EFFECTIVE row; the clock may only move forward"
    error_id: "ERR_INVALID_WINDOW | ERR_PRICE_SCHEDULE_BACKDATED | ERR_CLOCK_MUST_ADVANCE"
    http_status: 422
    applies_to: "POST /delivery-loads, POST /delivery-loads/{deliveryLoadId}/replan, POST /will-call-tickets/stage-next, POST /price-schedules, POST /_clock/set_current_utc"
  - priority: 31
    category: business_temporal
    check: "a pre-buy-priced line requires the current logical-clock date to fall inside the contract's inclusive [season_start_date, season_end_date] window, and activation requires the clock date to be <= season_end_date"
    error_id: ERR_PREBUY_OUT_OF_SEASON
    http_status: 422
    applies_to: "POST /order-lines, POST /material-orders/{materialOrderId}/confirm, POST /prebuy-contracts/{preBuyContractId}/activate"
  - priority: 32
    category: business_fiscal
    check: "for every line a single AVAILABLE InventoryLot of that material has (net_sellable_cubic_yards - reserved_cubic_yards) >= line_volume_cubic_yards; lots are never split"
    error_id: ERR_INSUFFICIENT_INVENTORY
    http_status: 409
    applies_to: "POST /material-orders/{materialOrderId}/confirm"
  - priority: 33
    category: business_fiscal
    check: "a referenced PreBuyContract has remaining_cubic_yards >= the line's line_volume_cubic_yards"
    error_id: ERR_PREBUY_BALANCE_EXCEEDED
    http_status: 422
    applies_to: "POST /material-orders/{materialOrderId}/confirm"
  - priority: 34
    category: business_fiscal
    check: "ContractorAccount.credit_available_cents >= quoted_total_cents (inclusive; exact equality is accepted)"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /material-orders/{materialOrderId}/confirm"
  - priority: 35
    category: business_fiscal
    check: "JobPurchaseOrder.committed_cents + quoted_total_cents <= po_limit_cents (inclusive)"
    error_id: ERR_PO_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /material-orders/{materialOrderId}/confirm"
  - priority: 36
    category: business_fiscal
    check: "delivered volume never exceeds what was planned or what the order still owes: actual_net_cubic_yards + spillage_cubic_yards <= planned_cubic_yards, and planned_cubic_yards / loaded_cubic_yards <= the order's undelivered BULK balance minus volume already planned on other live loads"
    error_id: "ERR_DELIVERED_EXCEEDS_PLANNED | ERR_LOAD_EXCEEDS_ORDER_BALANCE"
    http_status: 422
    applies_to: "POST /delivery-loads, POST /delivery-loads/{deliveryLoadId}/deliver, POST /will-call-tickets/{willCallTicketId}/load"
  - priority: 37
    category: business_fiscal
    check: "approved_amount_cents <= claimed_amount_cents; a settled claim must have payable_cents > 0"
    error_id: "ERR_APPROVED_EXCEEDS_CLAIM | ERR_CLAIM_NOT_PAYABLE"
    http_status: 422
    applies_to: "POST /claim-cases/{claimCaseId}/decide, POST /claim-cases/{claimCaseId}/settle"
  - priority: 38
    category: business_fiscal
    check: "cumulative returned_count + request returned_count <= issued_count"
    error_id: ERR_RETURN_COUNT_EXCEEDS_ISSUED
    http_status: 422
    applies_to: "POST /container-returns/{containerReturnId}/receive"
  - priority: 39
    category: business_fiscal
    check: "paid_amount_cents >= final_total_cents - credit_memo_cents"
    error_id: ERR_UNDERPAYMENT
    http_status: 402
    applies_to: "POST /material-orders/{materialOrderId}/settle"

endpoints:
  # ---------------- Materials, price schedules, inventory ----------------
  - method: POST
    path: "/materials"
    description: "Register a sellable yard material with its density, shrinkage and moisture profile."
    roles: [YardAdmin]
    code: 201
    input: [sku, name, offered_forms, seasonal_category, density_lb_per_cubic_yard, shrinkage_factor, "moisture_pct?", "unit_bag_cubic_yards?", "prebuy_eligible?"]
    output: Material
    side_effects: ["status = ACTIVE", "effective_density_lb_per_cubic_yard computed from moisture_pct", "available_net_cubic_yards = 0.0"]
  - method: GET
    path: "/materials"
    description: "List yard materials, filterable by status and seasonal family."
    roles: [YardAdmin, CreditManager, DispatchPlanner, YardLoader, ClaimsAdjuster, Contractor]
    code: 200
    input: ["status?", "seasonal_category?", "prebuy_eligible?", "limit?", "offset?"]
    output: Material[]
    side_effects: []
  - method: GET
    path: "/materials/{materialId}"
    description: "Read one material including its effective density and available net volume."
    roles: [YardAdmin, CreditManager, DispatchPlanner, YardLoader, ClaimsAdjuster, Contractor]
    code: 200
    input: []
    output: Material
    side_effects: []
  - method: PATCH
    path: "/materials/{materialId}"
    description: "Adjust a material's sellability status or its yard-wide moisture percentage."
    roles: [YardAdmin]
    code: 200
    input: ["status?", "moisture_pct?"]
    output: Material
    side_effects: ["status and/or moisture_pct updated", "effective_density_lb_per_cubic_yard recomputed", "increments Material.version by 1"]
  - method: POST
    path: "/price-schedules"
    description: "File a dated price row for a material. OCC-guarded on the parent Material because the new row retires the material's currently EFFECTIVE row."
    roles: [YardAdmin]
    code: 201
    input: [material_id, effective_from, bulk_price_per_cubic_yard_cents, bagged_price_per_bag_cents, "seasonal_surcharge_pct?", expected_material_version]
    output: PriceSchedule
    side_effects: ["status = EFFECTIVE when effective_from <= the current logical clock, else SCHEDULED", "the material's prior EFFECTIVE row transitions to SUPERSEDED when this row becomes EFFECTIVE", "increments Material.version by 1"]
  - method: GET
    path: "/price-schedules"
    description: "List price rows, filterable by material and lifecycle status."
    roles: [YardAdmin, CreditManager, Contractor]
    code: 200
    input: ["material_id?", "status?", "limit?", "offset?"]
    output: PriceSchedule[]
    side_effects: []
  - method: GET
    path: "/price-schedules/{priceScheduleId}"
    description: "Read one price row."
    roles: [YardAdmin, CreditManager, Contractor]
    code: 200
    input: []
    output: PriceSchedule
    side_effects: []
  - method: POST
    path: "/inventory-lots"
    description: "Scale in a stockpile lot; net sellable volume is computed on the intake basis."
    roles: [YardAdmin]
    code: 201
    input: [material_id, gross_cubic_yards, moisture_pct_at_intake]
    output: InventoryLot
    side_effects: ["basis = INTAKE and current_moisture_pct = moisture_pct_at_intake", "net_sellable_cubic_yards computed by calculations.inventory_net_sellable_volume variant intake_basis", "status = AVAILABLE", "Material.available_net_cubic_yards recomputed"]
  - method: GET
    path: "/inventory-lots"
    description: "List stockpile lots, filterable by material and lot status."
    roles: [YardAdmin, DispatchPlanner, YardLoader, CreditManager]
    code: 200
    input: ["material_id?", "status?", "basis?", "limit?", "offset?"]
    output: InventoryLot[]
    side_effects: []
  - method: GET
    path: "/inventory-lots/{inventoryLotId}"
    description: "Read one stockpile lot with its net sellable, reserved and withdrawn volumes."
    roles: [YardAdmin, DispatchPlanner, YardLoader, CreditManager]
    code: 200
    input: []
    output: InventoryLot
    side_effects: []
  - method: POST
    path: "/inventory-lots/{inventoryLotId}/moisture-readings"
    description: "File a fresh moisture reading, flipping the lot onto the settlement basis and optionally quarantining it."
    roles: [YardAdmin]
    code: 200
    input: [current_moisture_pct, set_quarantine]
    output: InventoryLot
    side_effects: ["current_moisture_pct updated", "basis = SETTLEMENT", "net_sellable_cubic_yards recomputed by calculations.inventory_net_sellable_volume variant settlement_basis", "status = QUARANTINED when set_quarantine is true, else AVAILABLE", "Material.available_net_cubic_yards recomputed", "increments InventoryLot.version by 1"]

  # ---------------- Accounts, purchase orders, pre-buy ----------------
  - method: POST
    path: "/contractor-accounts"
    description: "Open a contractor trade account with a credit line and its site-policy flags."
    roles: [YardAdmin]
    code: 201
    input: [business_name, credit_limit_cents, "po_required?", "driveway_protection_required?"]
    output: ContractorAccount
    side_effects: ["account_status = ACTIVE", "credit_used_cents = 0 and credit_available_cents = credit_limit_cents", "pallet_deposit_balance_cents = 0"]
  - method: GET
    path: "/contractor-accounts"
    description: "List contractor accounts, filterable by credit posture."
    roles: [YardAdmin, CreditManager, ClaimsAdjuster]
    code: 200
    input: ["account_status?", "limit?", "offset?"]
    output: ContractorAccount[]
    side_effects: []
  - method: GET
    path: "/contractor-accounts/{contractorAccountId}"
    description: "Read one contractor account with its computed credit and deposit position."
    roles: [YardAdmin, CreditManager, ClaimsAdjuster, Contractor]
    code: 200
    input: []
    output: ContractorAccount
    side_effects: []
  - method: POST
    path: "/contractor-accounts/{contractorAccountId}/credit-adjustments"
    description: "Reset the account credit line. OCC-guarded on the account because the new limit supersedes the limit the caller last read."
    roles: [CreditManager]
    code: 200
    input: [new_credit_limit_cents, memo, expected_contractor_account_version]
    output: ContractorAccount
    side_effects: ["credit_limit_cents replaced and credit_available_cents recomputed", "account_status CREDIT_HOLD -> ACTIVE when credit_used_cents <= ROUND_HALF_UP(new_credit_limit_cents * 0.90)", "increments ContractorAccount.version by 1"]
  - method: POST
    path: "/job-purchase-orders"
    description: "Register a job-site purchase order that material orders can be tagged to."
    roles: [Contractor, YardAdmin]
    code: 201
    input: [contractor_account_id, po_number, job_code, po_limit_cents]
    output: JobPurchaseOrder
    side_effects: ["status = OPEN", "committed_cents = 0"]
  - method: GET
    path: "/job-purchase-orders"
    description: "List purchase orders, filterable by owning account and status."
    roles: [Contractor, YardAdmin, CreditManager]
    code: 200
    input: ["contractor_account_id?", "status?", "job_code?", "limit?", "offset?"]
    output: JobPurchaseOrder[]
    side_effects: []
  - method: GET
    path: "/job-purchase-orders/{jobPurchaseOrderId}"
    description: "Read one purchase order with its committed total."
    roles: [Contractor, YardAdmin, CreditManager]
    code: 200
    input: []
    output: JobPurchaseOrder
    side_effects: []
  - method: POST
    path: "/job-purchase-orders/{jobPurchaseOrderId}/close"
    description: "Close a purchase order so no further orders may be tagged to it."
    roles: [Contractor, YardAdmin]
    code: 200
    input: []
    output: JobPurchaseOrder
    side_effects: ["status = CLOSED", "increments JobPurchaseOrder.version by 1"]
  - method: POST
    path: "/prebuy-contracts"
    description: "Write a season pre-buy contract locking a bulk price for a contractor."
    roles: [Contractor, YardAdmin]
    code: 201
    input: [contractor_account_id, material_id, locked_price_per_cubic_yard_cents, contracted_cubic_yards, season_start_date, season_end_date]
    output: PreBuyContract
    side_effects: ["status = DRAFT", "drawn_cubic_yards = 0.0 and remaining_cubic_yards = contracted_cubic_yards"]
  - method: GET
    path: "/prebuy-contracts"
    description: "List pre-buy contracts, filterable by account, material and status."
    roles: [Contractor, YardAdmin, CreditManager]
    code: 200
    input: ["contractor_account_id?", "material_id?", "status?", "limit?", "offset?"]
    output: PreBuyContract[]
    side_effects: []
  - method: GET
    path: "/prebuy-contracts/{preBuyContractId}"
    description: "Read one pre-buy contract with its drawn and remaining volume."
    roles: [Contractor, YardAdmin, CreditManager]
    code: 200
    input: []
    output: PreBuyContract
    side_effects: []
  - method: POST
    path: "/prebuy-contracts/{preBuyContractId}/activate"
    description: "Activate a DRAFT pre-buy contract so order lines may draw against it."
    roles: [YardAdmin]
    code: 200
    input: []
    output: PreBuyContract
    side_effects: ["status = ACTIVE", "increments PreBuyContract.version by 1"]

  # ---------------- Orders and lines ----------------
  - method: POST
    path: "/material-orders"
    description: "Open a DRAFT material order for delivery or will-call pickup."
    roles: [Contractor]
    code: 201
    input: [contractor_account_id, fulfillment_mode, "job_purchase_order_id?", "delivery_address?", "driveway_access_class?", "delivery_distance_miles?"]
    output: MaterialOrder
    side_effects: ["fulfillment_status = DRAFT and settlement_status = UNBILLED", "every money field 0, final_total_cents null, quote_locked_at null"]
  - method: GET
    path: "/material-orders"
    description: "List orders, filterable by account, purchase order and either state dimension."
    roles: [Contractor, YardAdmin, CreditManager, DispatchPlanner, ClaimsAdjuster]
    code: 200
    input: ["contractor_account_id?", "job_purchase_order_id?", "fulfillment_status?", "settlement_status?", "fulfillment_mode?", "limit?", "offset?"]
    output: MaterialOrder[]
    side_effects: []
  - method: GET
    path: "/material-orders/{materialOrderId}"
    description: "Read one order with both state dimensions and the full money breakdown."
    roles: [Contractor, YardAdmin, CreditManager, DispatchPlanner, ClaimsAdjuster, YardLoader]
    code: 200
    input: []
    output: MaterialOrder
    side_effects: []
  - method: POST
    path: "/order-lines"
    description: "Add a bulk or bagged line to a DRAFT order, optionally drawing on the account's ACTIVE pre-buy contract for that material."
    roles: [Contractor]
    code: 201
    input: [material_order_id, material_id, form, quantity, "use_prebuy?"]
    output: OrderLine
    side_effects: ["line_volume_cubic_yards computed from form and Material.unit_bag_cubic_yards", "prebuy_contract_id set to the account's ACTIVE PreBuyContract for that material when use_prebuy is true, else null", "unit_price_cents, line_price_cents and inventory_lot_id stay null until the order is confirmed"]
  - method: GET
    path: "/order-lines"
    description: "List order lines, filterable by order, material, pre-buy contract or allocated lot."
    roles: [Contractor, YardAdmin, CreditManager, DispatchPlanner, YardLoader, ClaimsAdjuster]
    code: 200
    input: ["material_order_id?", "material_id?", "prebuy_contract_id?", "inventory_lot_id?", "form?", "limit?", "offset?"]
    output: OrderLine[]
    side_effects: []
  - method: GET
    path: "/order-lines/{orderLineId}"
    description: "Read one order line with its quoted and final money and delivered volume."
    roles: [Contractor, YardAdmin, CreditManager, DispatchPlanner, YardLoader, ClaimsAdjuster]
    code: 200
    input: []
    output: OrderLine
    side_effects: []
  - method: POST
    path: "/material-orders/{materialOrderId}/confirm"
    description: "Freeze the quote, allocate one inventory lot per line, and commit credit plus purchase-order capacity."
    roles: [Contractor]
    code: 200
    input: []
    output: MaterialOrder
    side_effects: ["runs calculations.order_line_pricing variant quoted_at_confirm then calculations.order_charge_assembly variant quoted_at_confirm", "fulfillment_status DRAFT -> CONFIRMED and quote_locked_at set to the current logical clock", "each line's inventory_lot_id pinned and every touched InventoryLot.reserved_cubic_yards recomputed", "PreBuyContract.drawn_cubic_yards / remaining_cubic_yards recomputed, auto-transitioning ACTIVE -> EXHAUSTED at remaining_cubic_yards <= 0", "ContractorAccount.credit_used_cents / credit_available_cents and JobPurchaseOrder.committed_cents recomputed, auto-transitioning the PO OPEN -> EXHAUSTED at committed_cents >= po_limit_cents", "increments MaterialOrder.version by 1"]
  - method: POST
    path: "/material-orders/{materialOrderId}/cancel"
    description: "Cancel an order and compensate every reservation the confirm made."
    roles: [Contractor, YardAdmin]
    code: 200
    input: []
    output: MaterialOrder
    side_effects: ["fulfillment_status = CANCELLED; settlement_status untouched", "reserved lot volume, pre-buy draw, account credit usage and purchase-order commitment all recomputed downward, reverting EXHAUSTED PreBuyContract and JobPurchaseOrder rows", "ContractorAccount CREDIT_HOLD -> ACTIVE when credit_used_cents <= ROUND_HALF_UP(credit_limit_cents * 0.90)", "every PLANNED DeliveryLoad and every QUEUED or STAGED WillCallTicket of this order transitions to CANCELLED", "increments MaterialOrder.version by 1"]
  - method: POST
    path: "/material-orders/{materialOrderId}/invoice"
    description: "Invoice a fulfilled order on the settlement dimension."
    roles: [CreditManager]
    code: 200
    input: []
    output: MaterialOrder
    side_effects: ["settlement_status UNBILLED -> INVOICED", "fulfillment_status untouched", "increments MaterialOrder.version by 1"]
  - method: POST
    path: "/material-orders/{materialOrderId}/settle"
    description: "Record payment against an invoiced or credit-memoed order and free the credit line."
    roles: [CreditManager]
    code: 200
    input: [paid_amount_cents]
    output: MaterialOrder
    side_effects: ["paid_amount_cents stored and settlement_status = SETTLED", "ContractorAccount.credit_used_cents recomputed downward, possibly releasing a credit hold", "increments MaterialOrder.version by 1"]

  # ---------------- Trucks, loads, delivery ----------------
  - method: POST
    path: "/delivery-trucks"
    description: "Commission a delivery truck with its axle class, payload ceiling, bed volume and least permissive driveway grade."
    roles: [DispatchPlanner]
    code: 201
    input: [truck_code, axle_class, max_payload_lb, bed_capacity_cubic_yards, min_driveway_access_class]
    output: DeliveryTruck
    side_effects: ["status = AVAILABLE"]
  - method: GET
    path: "/delivery-trucks"
    description: "List trucks, filterable by axle class and fleet status."
    roles: [DispatchPlanner, YardAdmin, YardLoader]
    code: 200
    input: ["axle_class?", "status?", "min_driveway_access_class?", "limit?", "offset?"]
    output: DeliveryTruck[]
    side_effects: []
  - method: GET
    path: "/delivery-trucks/{deliveryTruckId}"
    description: "Read one truck with its payload and volume limits."
    roles: [DispatchPlanner, YardAdmin, YardLoader]
    code: 200
    input: []
    output: DeliveryTruck
    side_effects: []
  - method: PATCH
    path: "/delivery-trucks/{deliveryTruckId}"
    description: "Take a truck out of service or return it to service."
    roles: [DispatchPlanner]
    code: 200
    input: [status]
    output: DeliveryTruck
    side_effects: ["status updated", "increments DeliveryTruck.version by 1"]
  - method: POST
    path: "/delivery-loads"
    description: "Plan a truck load against a confirmed delivery order inside a booked time window."
    roles: [DispatchPlanner]
    code: 201
    input: [material_order_id, delivery_truck_id, planned_cubic_yards, window_start, window_end]
    output: DeliveryLoad
    side_effects: ["status = PLANNED", "inventory_lot_id pinned from the order's earliest-created BULK OrderLine", "planned_payload_lb and max_allowed_cubic_yards computed by calculations.truck_load_fit", "MaterialOrder CONFIRMED -> ALLOCATED when this is the order's first load"]
  - method: GET
    path: "/delivery-loads"
    description: "List loads, filterable by order, truck, pinned lot and load status."
    roles: [DispatchPlanner, YardAdmin, ClaimsAdjuster, Contractor]
    code: 200
    input: ["material_order_id?", "delivery_truck_id?", "inventory_lot_id?", "status?", "limit?", "offset?"]
    output: DeliveryLoad[]
    side_effects: []
  - method: GET
    path: "/delivery-loads/{deliveryLoadId}"
    description: "Read one load with its planned and actual volumes and its computed fit ceiling."
    roles: [DispatchPlanner, YardAdmin, ClaimsAdjuster, Contractor, YardLoader]
    code: 200
    input: []
    output: DeliveryLoad
    side_effects: []
  - method: POST
    path: "/delivery-loads/{deliveryLoadId}/dispatch"
    description: "Release a planned load to the road, recording the dispatching planner for the later segregation-of-duties check."
    roles: [DispatchPlanner]
    code: 200
    input: []
    output: DeliveryLoad
    side_effects: ["status = DISPATCHED and dispatched_by_user_id = the caller's X-User-ID", "DeliveryTruck.status = IN_SERVICE and its version increments", "increments DeliveryLoad.version by 1"]
  - method: POST
    path: "/delivery-loads/{deliveryLoadId}/deliver"
    description: "Close out a delivered load: reprice on the final basis, draw the stockpile down, and roll the order forward."
    roles: [DispatchPlanner]
    code: 200
    input: [actual_net_cubic_yards, driveway_protection_used, "spillage_cubic_yards?"]
    output: DeliveryLoad
    side_effects: ["status = DELIVERED with actual_net_cubic_yards, spillage_cubic_yards and driveway_protection_used stored", "calculations.order_line_pricing variant final_at_delivery distributes actual_net_cubic_yards across BULK lines by the created_at ASC waterfall, then calculations.order_charge_assembly variant final_at_delivery writes final_total_cents", "InventoryLot.withdrawn_gross_cubic_yards grows by actual_net_cubic_yards + spillage_cubic_yards, reserved_cubic_yards recomputed, lot auto-transitions to DEPLETED at zero remaining", "a ContainerReturn row is cascade-created when the order has a BAGGED line and none exists yet", "MaterialOrder ALLOCATED -> FULFILLED once every BULK line is fully delivered", "ContractorAccount.credit_used_cents, pallet_deposit_balance_cents and JobPurchaseOrder.committed_cents recomputed, possibly forcing ACTIVE -> CREDIT_HOLD and cancelling that account's QUEUED will-call tickets", "DeliveryTruck.status = AVAILABLE", "increments DeliveryLoad.version by 1"]
  - method: POST
    path: "/delivery-loads/{deliveryLoadId}/refuse"
    description: "Record a refused delivery at the job site so the load can be replanned; no inventory or money moves."
    roles: [DispatchPlanner]
    code: 200
    input: [refusal_reason]
    output: DeliveryLoad
    side_effects: ["status = REFUSED and refusal_reason stored", "DeliveryTruck.status = OUT_OF_SERVICE when refusal_reason == EQUIPMENT_FAILURE, else AVAILABLE", "MaterialOrder re-evaluates the ALLOCATED -> CONFIRMED revert", "increments DeliveryLoad.version by 1"]
  - method: POST
    path: "/delivery-loads/{deliveryLoadId}/replan"
    description: "Re-book a refused load onto a truck and window, re-running every truck-fit and access check."
    roles: [DispatchPlanner]
    code: 200
    input: [delivery_truck_id, window_start, window_end, planned_cubic_yards]
    output: DeliveryLoad
    side_effects: ["status = PLANNED with delivery_truck_id, window_start, window_end and planned_cubic_yards replaced and refusal_reason cleared", "planned_payload_lb and max_allowed_cubic_yards recomputed by calculations.truck_load_fit", "MaterialOrder re-evaluates CONFIRMED -> ALLOCATED", "increments DeliveryLoad.version by 1"]
  - method: POST
    path: "/delivery-loads/{deliveryLoadId}/cancel"
    description: "Drop a planned load; the order's reservations are deliberately left untouched."
    roles: [DispatchPlanner]
    code: 200
    input: []
    output: DeliveryLoad
    side_effects: ["status = CANCELLED and the truck window is released", "DeliveryTruck.status = AVAILABLE", "InventoryLot.reserved_cubic_yards and withdrawn_gross_cubic_yards unchanged", "MaterialOrder re-evaluates the ALLOCATED -> CONFIRMED revert", "increments DeliveryLoad.version by 1"]

  # ---------------- Will-call queue ----------------
  - method: POST
    path: "/will-call-tickets"
    description: "Issue a will-call ticket that joins the yard loading queue for a confirmed pickup order."
    roles: [Contractor]
    code: 201
    input: [material_order_id, requested_pickup_at]
    output: WillCallTicket
    side_effects: ["status = QUEUED", "priority_class derived from whether the order draws on a pre-buy contract", "queue_position computed across all QUEUED tickets"]
  - method: GET
    path: "/will-call-tickets"
    description: "List will-call tickets, filterable by order, pinned lot and ticket status."
    roles: [YardLoader, YardAdmin, Contractor]
    code: 200
    input: ["material_order_id?", "inventory_lot_id?", "status?", "limit?", "offset?"]
    output: WillCallTicket[]
    side_effects: []
  - method: GET
    path: "/will-call-tickets/{willCallTicketId}"
    description: "Read one will-call ticket with its queue position and staging window."
    roles: [YardLoader, YardAdmin, Contractor]
    code: 200
    input: []
    output: WillCallTicket
    side_effects: []
  - method: POST
    path: "/will-call-tickets/stage-next"
    description: "Pull the next eligible ticket into a staging bay for the requested window using calculations.will_call_queue_ranking."
    roles: [YardLoader]
    code: 200
    input: [staging_window_start, staging_window_end]
    output: WillCallTicket
    side_effects: ["the selected ticket moves QUEUED -> STAGED with staging_window_start / staging_window_end stored and staged_by_user_id = the caller's X-User-ID", "inventory_lot_id pinned from the order's earliest-created BULK OrderLine", "queue_position nulled on the staged ticket and recomputed for every remaining QUEUED ticket", "MaterialOrder CONFIRMED -> ALLOCATED when this is the order's first staged ticket", "increments WillCallTicket.version by 1"]
  - method: POST
    path: "/will-call-tickets/{willCallTicketId}/safety-ack"
    description: "Record the equipment-safety briefing and PPE confirmation that unlock loading."
    roles: [YardLoader]
    code: 200
    input: [safety_briefing_code, ppe_confirmed]
    output: WillCallTicket
    side_effects: ["status STAGED -> LOADING", "safety_briefing_code and ppe_confirmed stored", "increments WillCallTicket.version by 1"]
  - method: POST
    path: "/will-call-tickets/{willCallTicketId}/load"
    description: "Load a briefed ticket, drawing the stockpile down through the delivery waterfall."
    roles: [YardLoader]
    code: 200
    input: [loaded_cubic_yards, "pallet_count?"]
    output: WillCallTicket
    side_effects: ["status LOADING -> LOADED with loaded_cubic_yards stored", "the order's BULK lines receive delivered_volume_cubic_yards through the created_at ASC waterfall", "InventoryLot.withdrawn_gross_cubic_yards grows by loaded_cubic_yards and reserved_cubic_yards is recomputed", "a ContainerReturn row is cascade-created with issued_count = pallet_count when the order has a BAGGED line and none exists yet", "increments WillCallTicket.version by 1"]
  - method: POST
    path: "/will-call-tickets/{willCallTicketId}/release"
    description: "Release the loaded contractor vehicle from the yard and settle the order's final money."
    roles: [YardLoader]
    code: 200
    input: []
    output: WillCallTicket
    side_effects: ["status LOADED -> RELEASED and the staging bay is freed", "calculations.order_charge_assembly variant final_at_delivery writes final_total_cents and MaterialOrder ALLOCATED -> FULFILLED once every BULK line is fully delivered", "ContractorAccount.credit_used_cents recomputed", "increments WillCallTicket.version by 1"]
  - method: POST
    path: "/will-call-tickets/{willCallTicketId}/cancel"
    description: "Cancel a queued or staged ticket, freeing its staging bay and its queue slot."
    roles: [Contractor, YardLoader]
    code: 200
    input: []
    output: WillCallTicket
    side_effects: ["status = CANCELLED and queue_position nulled, with the remaining QUEUED tickets renumbered", "the staging bay is released when the ticket was STAGED", "MaterialOrder re-evaluates the ALLOCATED -> CONFIRMED revert", "increments WillCallTicket.version by 1"]

  # ---------------- Claims ----------------
  - method: POST
    path: "/claim-cases"
    description: "File a driveway-damage, spillage or short-load claim against a delivered load or a released will-call ticket."
    roles: [Contractor]
    code: 201
    input: [material_order_id, claim_type, claimed_amount_cents, description, "delivery_load_id?", "will_call_ticket_id?"]
    output: ClaimCase
    side_effects: ["status = SUBMITTED", "review_round = 0 and approved_amount_cents / payable_cents null"]
  - method: GET
    path: "/claim-cases"
    description: "List claims, filterable by order, target load or ticket, family and status."
    roles: [ClaimsAdjuster, YardAdmin, Contractor]
    code: 200
    input: ["material_order_id?", "delivery_load_id?", "will_call_ticket_id?", "claim_type?", "status?", "limit?", "offset?"]
    output: ClaimCase[]
    side_effects: []
  - method: GET
    path: "/claim-cases/{claimCaseId}"
    description: "Read one claim with its approved amount and the three waterfall buckets."
    roles: [ClaimsAdjuster, YardAdmin, Contractor]
    code: 200
    input: []
    output: ClaimCase
    side_effects: []
  - method: POST
    path: "/claim-cases/{claimCaseId}/start-review"
    description: "Take a submitted claim under adjuster review."
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: ClaimCase
    side_effects: ["status = UNDER_REVIEW", "review_round incremented by 1", "increments ClaimCase.version by 1"]
  - method: POST
    path: "/claim-cases/{claimCaseId}/request-info"
    description: "Bounce a claim back to the contractor for more information."
    roles: [ClaimsAdjuster]
    code: 200
    input: [info_request_note]
    output: ClaimCase
    side_effects: ["status = INFO_REQUESTED and info_request_note stored", "increments ClaimCase.version by 1"]
  - method: POST
    path: "/claim-cases/{claimCaseId}/provide-info"
    description: "Supply the requested information and return the claim to review."
    roles: [Contractor]
    code: 200
    input: [description]
    output: ClaimCase
    side_effects: ["status = UNDER_REVIEW with description replaced by the supplied narrative", "review_round incremented by 1", "increments ClaimCase.version by 1"]
  - method: POST
    path: "/claim-cases/{claimCaseId}/decide"
    description: "Approve or deny a reviewed claim; approval computes the payable amount through calculations.claim_settlement_waterfall."
    roles: [ClaimsAdjuster]
    code: 200
    input: [decision, "approved_amount_cents?", "denial_reason?"]
    output: ClaimCase
    side_effects: ["status = APPROVED or DENIED and decided_by_user_id = the caller's X-User-ID", "on approval approved_amount_cents is stored and payable_cents, invoice_offset_cents, deposit_offset_cents and goodwill_credit_cents are written by calculations.claim_settlement_waterfall", "on denial denial_reason is stored and payable_cents = 0", "increments ClaimCase.version by 1"]
  - method: POST
    path: "/claim-cases/{claimCaseId}/settle"
    description: "Issue the credit memo for an approved claim and relieve the contractor's balance."
    roles: [CreditManager]
    code: 200
    input: []
    output: ClaimCase
    side_effects: ["status = SETTLED", "MaterialOrder.credit_memo_cents recomputed and settlement_status -> CREDIT_MEMO_ISSUED with fulfillment_status untouched", "ContractorAccount.credit_used_cents recomputed downward, possibly releasing a credit hold", "increments ClaimCase.version by 1"]

  # ---------------- Container returns ----------------
  - method: GET
    path: "/container-returns"
    description: "List container returns, filterable by order and status."
    roles: [YardLoader, YardAdmin, CreditManager, Contractor]
    code: 200
    input: ["material_order_id?", "container_type?", "status?", "limit?", "offset?"]
    output: ContainerReturn[]
    side_effects: []
  - method: GET
    path: "/container-returns/{containerReturnId}"
    description: "Read one container return with its deposit, refund and forfeited figures."
    roles: [YardLoader, YardAdmin, CreditManager, Contractor]
    code: 200
    input: []
    output: ContainerReturn
    side_effects: []
  - method: POST
    path: "/container-returns/{containerReturnId}/receive"
    description: "Receive returned pallets, super sacks or salt totes and refund the deposit under the decay schedule."
    roles: [YardLoader]
    code: 200
    input: [returned_count]
    output: ContainerReturn
    side_effects: ["returned_count grows and last_received_at = the current logical clock", "refund_cents recomputed by calculations.container_deposit_refund", "status = PARTIALLY_RETURNED while returned_count < issued_count, CLOSED once they are equal (writing forfeited_cents)", "ContractorAccount.pallet_deposit_balance_cents recomputed", "increments ContainerReturn.version by 1"]
  - method: POST
    path: "/container-returns/{containerReturnId}/forfeit"
    description: "Forfeit the remaining deposit on containers that were never brought back."
    roles: [YardAdmin]
    code: 200
    input: []
    output: ContainerReturn
    side_effects: ["status = FORFEITED and forfeited_cents = issued_count * deposit_per_unit_cents - refund_cents", "ContractorAccount.pallet_deposit_balance_cents recomputed to retire this row's liability", "increments ContainerReturn.version by 1"]

  # ---------------- Test-driving endpoint ----------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the yard's logical clock, which every timestamp side effect and every date-window comparison reads. The clock defaults to 2026-08-01T00:00:00Z when it has never been set. Advancing it promotes SCHEDULED price rows whose effective_from has passed and expires pre-buy contracts whose season has ended."
    roles: [YardAdmin]
    code: 200
    input: [to_iso8601]
    output:
      current_utc: string
      promoted_price_schedule_ids: array
      expired_prebuy_contract_ids: array
    side_effects: ["the logical clock is set to to_iso8601", "SCHEDULED PriceSchedule rows with effective_from <= to_iso8601 become EFFECTIVE and their predecessors SUPERSEDED", "DRAFT or ACTIVE PreBuyContract rows whose season_end_date is before the clock date become EXPIRED"]

errors:
  # ---- auth ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or carrying a role outside the six declared roles."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role does not appear in the called endpoint's roles list."
  - id: ERR_ACCOUNT_SCOPE_VIOLATION
    http: 403
    condition: "A Contractor acts on a resource whose owning contractor_account_id differs from the caller's X-User-ID."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The ClaimsAdjuster deciding a claim is the same X-User-ID that dispatched the claim's DeliveryLoad."
  # ---- request shape ----
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, enum value outside its declared set, non-positive quantity, non-integral BAGGED quantity, pagination limit outside [1,100] or negative offset, or a decide call whose decision is neither APPROVE nor DENY."
  # ---- existence ----
  - id: ERR_MATERIAL_NOT_FOUND
    http: 404
    condition: "materialId path parameter or material_id body field references no Material."
  - id: ERR_PRICE_SCHEDULE_NOT_FOUND
    http: 404
    condition: "priceScheduleId path parameter references no PriceSchedule."
  - id: ERR_INVENTORY_LOT_NOT_FOUND
    http: 404
    condition: "inventoryLotId path parameter references no InventoryLot."
  - id: ERR_ACCOUNT_NOT_FOUND
    http: 404
    condition: "contractorAccountId path parameter or contractor_account_id body field references no ContractorAccount."
  - id: ERR_PO_NOT_FOUND
    http: 404
    condition: "jobPurchaseOrderId path parameter or job_purchase_order_id body field references no JobPurchaseOrder."
  - id: ERR_PREBUY_NOT_FOUND
    http: 404
    condition: "preBuyContractId path parameter references no PreBuyContract."
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "materialOrderId path parameter or material_order_id body field references no MaterialOrder."
  - id: ERR_ORDER_LINE_NOT_FOUND
    http: 404
    condition: "orderLineId path parameter references no OrderLine."
  - id: ERR_TRUCK_NOT_FOUND
    http: 404
    condition: "deliveryTruckId path parameter or delivery_truck_id body field references no DeliveryTruck."
  - id: ERR_LOAD_NOT_FOUND
    http: 404
    condition: "deliveryLoadId path parameter or delivery_load_id body field references no DeliveryLoad."
  - id: ERR_TICKET_NOT_FOUND
    http: 404
    condition: "willCallTicketId path parameter or will_call_ticket_id body field references no WillCallTicket."
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "claimCaseId path parameter references no ClaimCase."
  - id: ERR_CONTAINER_RETURN_NOT_FOUND
    http: 404
    condition: "containerReturnId path parameter references no ContainerReturn."
  # ---- optimistic concurrency ----
  - id: ERR_STALE_MATERIAL_VERSION
    http: 412
    condition: "expected_material_version on POST /price-schedules does not equal the Material's current version."
  - id: ERR_STALE_ACCOUNT_VERSION
    http: 412
    condition: "expected_contractor_account_version on a credit adjustment does not equal the ContractorAccount's current version."
  # ---- state ----
  - id: ERR_ORDER_NOT_DRAFT
    http: 409
    condition: "A line is added to, or confirm is called on, a MaterialOrder whose fulfillment_status is not DRAFT."
  - id: ERR_ORDER_ALREADY_TERMINAL
    http: 409
    condition: "Cancel is called on a MaterialOrder already in FULFILLED or CANCELLED."
  - id: ERR_ORDER_NOT_FULFILLED
    http: 409
    condition: "Invoice is called before fulfillment_status is FULFILLED, or settle is called while settlement_status is UNBILLED or SETTLED."
  - id: ERR_ORDER_HAS_DISPATCHED_LOAD
    http: 409
    condition: "Cancel is called on an order that still has a DeliveryLoad in status DISPATCHED."
  - id: ERR_ORDER_NOT_ALLOCATABLE
    http: 409
    condition: "A DeliveryLoad or WillCallTicket staging is attempted against an order whose fulfillment_status is not CONFIRMED or ALLOCATED."
  - id: ERR_LOAD_NOT_PLANNED
    http: 409
    condition: "Dispatch or cancel is called on a DeliveryLoad that is not in PLANNED."
  - id: ERR_LOAD_NOT_DISPATCHED
    http: 409
    condition: "Deliver or refuse is called on a DeliveryLoad that is not in DISPATCHED."
  - id: ERR_LOAD_NOT_REFUSED
    http: 409
    condition: "Replan is called on a DeliveryLoad that is not in REFUSED."
  - id: ERR_TICKET_NOT_STAGED
    http: 409
    condition: "safety-ack is called on a WillCallTicket that is not in STAGED."
  - id: ERR_TICKET_NOT_LOADING
    http: 409
    condition: "load is called on a WillCallTicket that is not in LOADING."
  - id: ERR_TICKET_NOT_LOADED
    http: 409
    condition: "release is called on a WillCallTicket that is not in LOADED."
  - id: ERR_TICKET_NOT_CANCELLABLE
    http: 409
    condition: "cancel is called on a WillCallTicket that is not in QUEUED or STAGED."
  - id: ERR_CLAIM_NOT_REVIEWABLE
    http: 409
    condition: "A claim action is called from the wrong status: start-review outside SUBMITTED, request-info or decide outside UNDER_REVIEW, provide-info outside INFO_REQUESTED."
  - id: ERR_CLAIM_NOT_APPROVED
    http: 409
    condition: "settle is called on a ClaimCase that is not in APPROVED."
  - id: ERR_PREBUY_NOT_DRAFT
    http: 409
    condition: "activate is called on a PreBuyContract that is not in DRAFT."
  - id: ERR_CONTAINER_RETURN_CLOSED
    http: 409
    condition: "receive or forfeit is called on a ContainerReturn already in CLOSED or FORFEITED."
  - id: ERR_PO_NOT_OPEN
    http: 409
    condition: "close is called on a JobPurchaseOrder that is not OPEN, or an order is confirmed against a PO that is not OPEN."
  # ---- cross-entity state ----
  - id: ERR_MATERIAL_NOT_SELLABLE
    http: 409
    condition: "An order is confirmed while one of its lines references a Material in SUSPENDED or DISCONTINUED."
  - id: ERR_LOT_QUARANTINED
    http: 409
    condition: "A load is dispatched while its pinned InventoryLot is QUARANTINED or DEPLETED."
  - id: ERR_TRUCK_UNAVAILABLE
    http: 409
    condition: "A load is planned, dispatched or replanned onto a DeliveryTruck that is not AVAILABLE."
  - id: ERR_ACCOUNT_CREDIT_HOLD
    http: 409
    condition: "An order is confirmed, a load is dispatched, or a ticket is staged while the owning ContractorAccount is in CREDIT_HOLD."
  - id: ERR_PREBUY_NOT_ACTIVE
    http: 409
    condition: "A line drawing on a PreBuyContract is confirmed while that contract is not ACTIVE."
  # ---- safety ----
  - id: ERR_SAFETY_ACK_REQUIRED
    http: 422
    condition: "safety-ack is called with ppe_confirmed false, or load is called on a ticket whose stored ppe_confirmed is false."
  - id: ERR_AXLE_WEIGHT_LIMIT_EXCEEDED
    http: 422
    condition: "planned_cubic_yards times the material's effective density exceeds DeliveryTruck.max_payload_lb (equality is legal)."
  - id: ERR_DRIVEWAY_ACCESS_RESTRICTED
    http: 422
    condition: "ACCESS_RANK of the order's driveway_access_class is below ACCESS_RANK of the truck's min_driveway_access_class."
  - id: ERR_DRIVEWAY_PROTECTION_REQUIRED
    http: 422
    condition: "A delivery is closed out with driveway_protection_used false while the account requires driveway protection."
  # ---- capacity, windows and queue ----
  - id: ERR_LOAD_EXCEEDS_TRUCK_CAPACITY
    http: 422
    condition: "planned_cubic_yards exceeds the lesser of the truck's bed_capacity_cubic_yards and the driveway cap for the order's access class."
  - id: ERR_TRUCK_WINDOW_CONFLICT
    http: 409
    condition: "The requested truck window overlaps another PLANNED or DISPATCHED load of the same truck once the 45-minute symmetric turnaround buffer is applied."
  - id: ERR_PREBUY_SEASON_OVERLAP
    http: 409
    condition: "A new pre-buy season shares at least one calendar day with another DRAFT or ACTIVE contract for the same account and material."
  - id: ERR_STAGING_CAPACITY_FULL
    http: 409
    condition: "Both staging bays are already occupied by STAGED or LOADING tickets whose closed windows intersect the requested window."
  - id: ERR_WILL_CALL_QUEUE_EMPTY
    http: 409
    condition: "stage-next runs with no eligible QUEUED ticket at all (empty-collection edge)."
  # ---- business constraints ----
  - id: ERR_ORDER_HAS_NO_LINES
    http: 422
    condition: "confirm is called on an order carrying zero OrderLine rows."
  - id: ERR_DUPLICATE_SKU
    http: 422
    condition: "A Material is registered with an sku that already exists."
  - id: ERR_DUPLICATE_PO_NUMBER
    http: 422
    condition: "A JobPurchaseOrder is registered with a po_number already used inside the same account."
  - id: ERR_FORM_NOT_OFFERED
    http: 422
    condition: "An OrderLine names a form absent from the Material's offered_forms."
  - id: ERR_WILL_CALL_MODE_REQUIRED
    http: 422
    condition: "A will-call ticket is issued against an order whose fulfillment_mode is DELIVERY."
  - id: ERR_DELIVERY_MODE_REQUIRED
    http: 422
    condition: "A delivery load is planned against an order whose fulfillment_mode is WILL_CALL."
  # ---- referential ----
  - id: ERR_PO_REQUIRED
    http: 422
    condition: "An order is created or confirmed without job_purchase_order_id while the account has po_required true."
  - id: ERR_PO_ACCOUNT_MISMATCH
    http: 422
    condition: "The supplied JobPurchaseOrder belongs to a different ContractorAccount than the order."
  - id: ERR_CLAIM_TARGET_MISMATCH
    http: 422
    condition: "The claim's delivery_load_id or will_call_ticket_id does not belong to the claim's material_order_id."
  - id: ERR_MATERIAL_NOT_PREBUY_ELIGIBLE
    http: 422
    condition: "A pre-buy contract is written or activated against a Material whose prebuy_eligible is false."
  # ---- temporal ----
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "window_end is not strictly after window_start on a delivery load or staging window."
  - id: ERR_PRICE_SCHEDULE_BACKDATED
    http: 422
    condition: "A new PriceSchedule.effective_from is not strictly later than the effective_from of the material's currently EFFECTIVE row."
  - id: ERR_CLOCK_MUST_ADVANCE
    http: 422
    condition: "POST /_clock/set_current_utc is called with an instant at or before the current logical clock."
  - id: ERR_PREBUY_OUT_OF_SEASON
    http: 422
    condition: "A pre-buy-priced line is confirmed, or a contract activated, when the logical-clock date falls outside the contract's inclusive season window."
  # ---- fiscal ----
  - id: ERR_INSUFFICIENT_INVENTORY
    http: 409
    condition: "No single AVAILABLE InventoryLot of the line's material has enough unreserved net sellable volume for the whole line (lots are never split)."
  - id: ERR_PREBUY_BALANCE_EXCEEDED
    http: 422
    condition: "A line draws more cubic yards than its PreBuyContract's remaining_cubic_yards."
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 402
    condition: "quoted_total_cents exceeds the account's credit_available_cents at confirm (exact equality is accepted)."
  - id: ERR_PO_LIMIT_EXCEEDED
    http: 402
    condition: "committed_cents plus quoted_total_cents would exceed the purchase order's po_limit_cents."
  - id: ERR_DELIVERED_EXCEEDS_PLANNED
    http: 422
    condition: "actual_net_cubic_yards plus spillage_cubic_yards exceeds the load's planned_cubic_yards."
  - id: ERR_LOAD_EXCEEDS_ORDER_BALANCE
    http: 422
    condition: "Planned or loaded volume exceeds the order's undelivered BULK balance net of volume already planned on other live loads."
  - id: ERR_APPROVED_EXCEEDS_CLAIM
    http: 422
    condition: "approved_amount_cents on a decide call exceeds claimed_amount_cents."
  - id: ERR_CLAIM_NOT_PAYABLE
    http: 422
    condition: "settle is called on an approved claim whose payable_cents computed to 0."
  - id: ERR_RETURN_COUNT_EXCEEDS_ISSUED
    http: 422
    condition: "Cumulative returned_count plus the request's returned_count exceeds issued_count, or returned_count is below 1."
  - id: ERR_UNDERPAYMENT
    http: 402
    condition: "paid_amount_cents is less than final_total_cents minus credit_memo_cents."

roles:
  - name: Contractor
    description: "Landscape contractor buying bulk and bagged material on a trade account; owns its orders, purchase orders, pre-buy contracts, will-call tickets and claims."
    identity: "entity_backed:ContractorAccount"
    exclusive_operations:
      - "POST /material-orders"
      - "POST /order-lines"
      - "POST /material-orders/{materialOrderId}/confirm"
      - "POST /will-call-tickets"
      - "POST /claim-cases"
      - "POST /claim-cases/{claimCaseId}/provide-info"
    shared_operations:
      - "POST /job-purchase-orders and POST /job-purchase-orders/{jobPurchaseOrderId}/close (with YardAdmin)"
      - "POST /prebuy-contracts (with YardAdmin)"
      - "POST /material-orders/{materialOrderId}/cancel (with YardAdmin)"
      - "POST /will-call-tickets/{willCallTicketId}/cancel (with YardLoader)"
      - "all GET reads scoped to its own account plus the material and price catalogue"
  - name: YardAdmin
    description: "Yard operations administrator: material catalogue, price schedules, stockpile intake and moisture readings, account opening, pre-buy activation, container forfeiture and the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /materials and PATCH /materials/{materialId}"
      - "POST /price-schedules"
      - "POST /inventory-lots and POST /inventory-lots/{inventoryLotId}/moisture-readings"
      - "POST /contractor-accounts"
      - "POST /prebuy-contracts/{preBuyContractId}/activate"
      - "POST /container-returns/{containerReturnId}/forfeit"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /job-purchase-orders and POST /job-purchase-orders/{jobPurchaseOrderId}/close (with Contractor)"
      - "POST /prebuy-contracts (with Contractor)"
      - "POST /material-orders/{materialOrderId}/cancel (with Contractor)"
      - "all GET reads across every account"
  - name: CreditManager
    description: "Credit desk: sets credit lines, invoices fulfilled orders, records payment and issues claim credit memos. Never touches fulfillment."
    identity: "opaque"
    exclusive_operations:
      - "POST /contractor-accounts/{contractorAccountId}/credit-adjustments"
      - "POST /material-orders/{materialOrderId}/invoice"
      - "POST /material-orders/{materialOrderId}/settle"
      - "POST /claim-cases/{claimCaseId}/settle"
    shared_operations:
      - "GET reads on accounts, purchase orders, pre-buy contracts, orders, lines, price schedules, inventory lots and container returns"
  - name: DispatchPlanner
    description: "Delivery dispatcher: commissions trucks, books windows, and dispatches, delivers, refuses, replans or cancels loads. Its X-User-ID is recorded on dispatch and is barred from judging that load's claim."
    identity: "opaque"
    exclusive_operations:
      - "POST /delivery-trucks and PATCH /delivery-trucks/{deliveryTruckId}"
      - "POST /delivery-loads"
      - "POST /delivery-loads/{deliveryLoadId}/dispatch"
      - "POST /delivery-loads/{deliveryLoadId}/deliver"
      - "POST /delivery-loads/{deliveryLoadId}/refuse"
      - "POST /delivery-loads/{deliveryLoadId}/replan"
      - "POST /delivery-loads/{deliveryLoadId}/cancel"
    shared_operations:
      - "GET reads on materials, inventory lots, trucks, loads, orders and lines"
  - name: YardLoader
    description: "Loading-yard operator: works the will-call queue, runs the equipment-safety briefing, loads and releases contractor vehicles, and receives returned containers."
    identity: "opaque"
    exclusive_operations:
      - "POST /will-call-tickets/stage-next"
      - "POST /will-call-tickets/{willCallTicketId}/safety-ack"
      - "POST /will-call-tickets/{willCallTicketId}/load"
      - "POST /will-call-tickets/{willCallTicketId}/release"
      - "POST /container-returns/{containerReturnId}/receive"
    shared_operations:
      - "POST /will-call-tickets/{willCallTicketId}/cancel (with Contractor)"
      - "GET reads on materials, inventory lots, trucks, orders, lines, tickets and container returns"
  - name: ClaimsAdjuster
    description: "Damage and spillage adjuster: reviews, requests information on, and approves or denies claims. May not decide a claim on a load it dispatched (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /claim-cases/{claimCaseId}/start-review"
      - "POST /claim-cases/{claimCaseId}/request-info"
      - "POST /claim-cases/{claimCaseId}/decide"
    shared_operations:
      - "GET reads on claims, orders, lines, loads, accounts and materials"
