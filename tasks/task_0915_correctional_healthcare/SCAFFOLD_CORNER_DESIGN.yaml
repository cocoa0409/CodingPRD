              as_user_id: "${inm}"
              captures: { sc: $.data.id }
            - call: "POST /sick-call-requests/${sc}/triage"
              payload: { acuity: "ROUTINE" }
              as: Nurse
              as_user_id: "u-nurse-1"
            - call: "POST /sick-call-requests/${sc}/schedule"
              payload: {}
              as: Nurse
              as_user_id: "u-nurse-1"
            - call: "POST /sick-call-requests/${sc}/see"
