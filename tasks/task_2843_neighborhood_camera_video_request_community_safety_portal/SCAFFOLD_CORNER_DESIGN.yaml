  - section: rbac
    instances:
      - name: non_officer_roles_calling_officer_and_platform_operations_returns_unauthorized
        claim_type: cannot_perform_other_roles_exclusive_operations
        grounds:
          - roles.AgencyAdmin.exclusive_operations
          - roles.Officer.exclusive_operations
          - roles.PlatformAdmin.exclusive_operations
          - roles.Moderator.exclusive_operations
          - errors.ERR_UNAUTHORIZED
          - validations[priority=2]
        distinguishing_aspect: "Every exclusive operation is fenced by the endpoint's roles list and nothing else: an AgencyAdmin — the closest neighbour to an officer — cannot open a canvass area, a Moderator cannot either, a Resident cannot onboard an agency, and an Officer cannot compile a transparency report. All four are 403 ERR_UNAUTHORIZED and none of them creates a row."
        test_recipe:
          setup:
            - "Clock pinned at 2026-08-12T00:00:00Z; one ONBOARDED agency with one REQUESTER officer; one resident. No RequestArea and no TransparencyReport exist yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /neighborhood-safety/agencies"
              payload: { name: "Riverbend Police Department", jurisdiction_code: "RB-001", min_device_threshold: 3 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ag_id: "$.data.id" }
            - call: "POST /neighborhood-safety/agencies/${ag_id}/onboarding-review"
              payload: { decision: "APPROVE", reviewer_note: "MOU on file.", onboarding_agreement_version: "MOU-2026.3" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ag_v: "$.data.version" }
            - call: "POST /neighborhood-safety/officers"
              payload: { agency_id: "${ag_id}", badge_number: "B-100", full_name: "Officer Vale", duty_role: "REQUESTER" }
              as: AgencyAdmin
              as_user_id: "${ag_id}"
              captures: { off_id: "$.data.id" }
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "R1", email: "r1@example.test", home_x_m: 0, home_y_m: 10, alert_radius_m: 0 }
              as: Anonymous
              captures: { r1_id: "$.data.id" }
          trigger:
            - call: "POST /neighborhood-safety/request-areas"
              payload: { agency_id: "${ag_id}", center_x_m: 0, center_y_m: 0, radius_m: 500, window_start_utc: "2026-08-08T00:00:00Z", window_end_utc: "2026-08-08T06:00:00Z", area_label: "Attempt by admin" }
              as: AgencyAdmin
              as_user_id: "${ag_id}"
              captures: { e_admin: "$.data.error_id" }
            - call: "POST /neighborhood-safety/request-areas"
              payload: { agency_id: "${ag_id}", center_x_m: 0, center_y_m: 0, radius_m: 500, window_start_utc: "2026-08-08T00:00:00Z", window_end_utc: "2026-08-08T06:00:00Z", area_label: "Attempt by moderator" }
              as: Moderator
              as_user_id: "mod-1"
              captures: { e_mod: "$.data.error_id" }
            - call: "POST /neighborhood-safety/agencies"
              payload: { name: "Resident's Own Police Force", jurisdiction_code: "RB-999" }
              as: Resident
              as_user_id: "${r1_id}"
              captures: { e_res: "$.data.error_id" }
            - call: "POST /neighborhood-safety/transparency-reports"
              payload: { agency_id: "${ag_id}", period_start_utc: "2026-08-01T00:00:00Z", period_end_utc: "2026-08-12T00:00:00Z", expected_agency_version: "${ag_v}" }
              as: Officer
              as_user_id: "${off_id}"
              captures: { e_off: "$.data.error_id" }
            - call: "GET /neighborhood-safety/request-areas"
              payload: { agency_id: "${ag_id}", limit: 10, offset: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { area_total: "$.meta.total_count" }
            - call: "GET /neighborhood-safety/transparency-reports"
              payload: { agency_id: "${ag_id}", limit: 10, offset: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { rep_total: "$.meta.total_count" }
          assert:
            - "${e_admin} == ERR_UNAUTHORIZED with HTTP 403"
            - "${e_mod} == ERR_UNAUTHORIZED with HTTP 403"
            - "${e_res} == ERR_UNAUTHORIZED with HTTP 403"
            - "${e_off} == ERR_UNAUTHORIZED with HTTP 403"
            - "${e_admin} != ERR_IDENTITY_MISMATCH — the role gate at priority 2 is reached before the ownership gate at priority 6, even though the AgencyAdmin's X-User-ID does own the agency in the body"
            - "${area_total} == 0 and ${rep_total} == 0"
            - "Agency.${ag_id}.version == ${ag_v} — the refused report creation did not repoint latest_report_id"

      - name: resident_exclusive_account_device_and_post_operations_are_allowed
        claim_type: can_perform_exclusive_and_shared_operations
        grounds:
          - roles.Resident.exclusive_operations
