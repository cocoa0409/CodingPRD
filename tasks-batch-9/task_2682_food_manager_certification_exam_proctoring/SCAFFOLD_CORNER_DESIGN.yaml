        excluded_because:
          difficulty_instance: transitive_cascade / incident_substantiation_depth4_cascade_to_local_registration_withdrawal
          rationale: "That §1.8 instance walks the depth-4 chain end-to-end and asserts every level — sitting INVALIDATED, ScoreReport VOIDED, Certificate REVOKED with the issuance fee credited back, LocalRegistration WITHDRAWN — in one trigger."
      - name: both_scoring_variants_are_computed_and_only_the_final_one_decides_the_pass_flag
        claim_type: dual_variant_calculation
        grounds:
          - calculations.scaled_score
