            - call: "GET /tickets/${t1_id}"
              payload: {}
              as: CertificationOfficer
              captures: { t1_status: $.data.validation_status }
            - call: "GET /scorecard_periods/${period_id}"
              payload: {}
              as: CertificationOfficer
              captures: { cert_total: $.data.total_waste_lbs_validated, cert_rate: $.data.diversion_rate_certified_pct, rebate_est: $.data.rebate_estimate_cents }
            - call: "GET /sites/${site_id}"
              payload: {}
              as: CertificationOfficer
              captures: { standing: $.data.program_standing }
          assert:
            - "sev == CRITICAL  (15 >= 10)"
