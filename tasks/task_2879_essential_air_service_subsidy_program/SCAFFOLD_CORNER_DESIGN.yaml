        distinguishing_aspect: "An accepted renegotiation starts a 180-day cooling-off measured from its effective_at: a request on 2027-01-27 is refused and the identical request on 2027-01-28 — exactly 180 days after the 2026-08-01 acceptance — is admitted, so the bound is inclusive on the later side."
