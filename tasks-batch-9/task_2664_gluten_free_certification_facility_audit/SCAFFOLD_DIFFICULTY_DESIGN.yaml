  - rule_id: resource_temporal_overlap
    instances:
      - name: audit_window_half_open_so_touching_is_free_and_one_second_overlap_is_not
        grounds:
          - validations.priority_35
          - errors.ERR_AUDIT_WINDOW_CONFLICT
          - entities.Audit.fields.onsite_start_at
          - entities.Audit.fields.onsite_end_at
          - endpoints."POST /gfco/audits"
          - state_machines.Audit.SCHEDULED_to_IN_PROGRESS
        distinguishing_aspect: |
          The facility's on-site capacity is a reserved half-open interval, so the accept/reject
          line sits between two windows that share an endpoint and two windows that overlap by a
          single second. Setup books three audits on one facility that all touch but never
          overlap - [06:00,08:00), [08:00,16:00), [16:00,18:00) - plus a fourth on a DIFFERENT
          facility occupying the identical [08:00,16:00) window, proving the reservation is scoped
          per facility. The trigger then asks for [15:59:59,16:30:00) on the busy facility, a
          one-second intrusion into an audit that is by then IN_PROGRESS rather than merely
          SCHEDULED. An implementation using closed intervals rejects the setup; one comparing
          only start times, only SCHEDULED rows, or ignoring facility_id accepts the trigger.
        test_recipe:
          setup:
            - "One applicant with two facilities."
            - "Facility A holds three audits that tile the day without overlapping: FOR_CAUSE [06:00,08:00), INITIAL [08:00,16:00) and SURVEILLANCE [16:00,18:00) on 2026-08-10 - each accepted because the interval is half-open."
            - "Facility B holds one INITIAL audit over exactly [08:00,16:00) on 2026-08-10, the same window as facility A's, and is accepted."
            - "The clock is moved to 2026-08-10T08:30:00Z and facility A's INITIAL audit is started, so it is IN_PROGRESS when the trigger runs."
          setup_api_calls:
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/applicants"
              payload: { legal_name: "Northgate Bakehouse Ltd", contact_email: "qa@northgate.example", country_code: "US" }
              as: ProgramAdministrator
              captures: { app_id: $.data.id }
            - call: "POST /gfco/facilities"
