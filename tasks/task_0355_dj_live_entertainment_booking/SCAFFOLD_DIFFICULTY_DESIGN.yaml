  # =====================================================================
  # RULE 8 — resource temporal-overlap conflicts across different interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: blackout_overlap_half_open_on_performer
        grounds:
          - validations[priority=13]
          - errors[ERR_BLACKOUT_OVERLAP]
          - entities.BlackoutWindow.fields.start_utc
          - entities.BlackoutWindow.fields.end_utc
        distinguishing_aspect: |
          BlackoutWindow uses half-open [start,end) semantics: a new window
          [2026-08-01T12:00Z, 2026-08-01T18:00Z) overlapping an existing
          [2026-08-01T10:00Z, 2026-08-01T14:00Z) on the same performer is rejected with
          ERR_BLACKOUT_OVERLAP; an exactly-adjacent window starting at the prior end would NOT collide.
        test_recipe:
          setup:
            - "Performer with one BlackoutWindow [2026-08-01T10:00Z, 2026-08-01T14:00Z)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-14T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /travel-zones"
