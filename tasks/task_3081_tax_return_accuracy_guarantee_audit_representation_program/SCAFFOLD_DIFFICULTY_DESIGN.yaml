      - name: agent_capacity_boundary
        grounds:
          - validations[priority=15]
          - entities.EnrolledAgent.fields.max_parallel
          - errors[ERR_AGENT_CAPACITY]
        distinguishing_aspect: |
          Metric: integer REPRESENTING count with strict < semantics on POST
