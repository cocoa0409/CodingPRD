# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3057_exclusive_agent_appointment_book_ownership_agency_transfer
#
# Nine §0.5 difficulty rules, two instances each (18 total). Every instance
# grounds in an element declared in SCAFFOLD.yaml §1.1-§1.7 and is drivable
# from empty-DB using only §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: agency_performance_ordered_elif_performance_status
    grounds:
    - calculations.agency_performance_measurement
    - calculations.loss_ratio
    - entities.Agency.fields.performance_status
    - validations[priority=8]
    distinguishing_aspect: On the Agency domain the ordered IF/ELIF pins performance_status to AT_RISK whenever loss_ratio > 70, even though growth_new_pct is negative; the independent-metrics variant would emit BEHIND for the same Agency, so the two variants disagree on the identical inputs.
    test_recipe:
      setup:
      - "Logical clock 2026-09-01T00:00:00Z. Cali (region W) ACTIVE; agent Cal with LICENSED license; Agreements exists; policy P with 50,000,000 cents AUTO new; a claim of 5,000,000 cents settles so agency_paid_claims_cents = 5,000,000.00 exactly, giving loss_ratio = 83.33 (flag set). annualized_commission_cents is 1,000,000.00 versus a term-start base of 4,000,000.00, giving growth_new_pct = -75.00."
      setup_api_calls:
      - call: POST /agency-network/agencies
        payload:
          agency_code: CA-001
          name: Cali Agency
          region_code: W
          market_need_score: 55
        as: AppointingExecutive
        captures:
          cali_id: $.data.id
          cali_v0: $.data.version
      - call: POST /agency-network/agencies/${cali_id}/activate
        payload:
          expected_agency_version: ${cali_v0}
        as: AppointingExecutive
        captures:
          cali_v1: $.data.version
      - call: POST /agency-network/_inject/agent
        payload:
          full_name: Cal Keeper
          state_code: CA
          license_status: LICENSED
          is_new_agent: false
          status: ACTIVE
        as: PlatformAdmin
        captures:
          cal_id: $.data.id
      - call: POST /agency-network/agreements
        payload:
          agent_id: ${cal_id}
          agency_id: ${cali_id}
          agreement_type: EXCLUSIVE_AGENT
          commission_schedule:
            AUTO:
              new: 0.15
              renewal: 0.1
            HOME:
              new: 0.12
              renewal: 0.08
            LIFE:
              new: 0.25
              renewal: 0.15
        as: FieldManager
      - call: POST /agency-network/policies
        payload:
          policy_number: CA-P1
          product_line: AUTO
          annual_premium_cents: 50000000
          is_new_business: true
          holder_agent_id: ${cal_id}
          owner_agency_id: ${cali_id}
        as: FieldManager
        captures:
          p_ca: $.data.id
      - call: POST /agency-network/claims
        payload:
          policy_id: ${p_ca}
          claim_amount_cents: 5000000
        as: ClaimsAdjuster
        captures:
          cl_ca: $.data.id
      - call: POST /agency-network/claims/${cl_ca}/settle
        payload: {}
        as: ClaimsAdjuster
      - call: POST /agency-network/agencies/${cali_id}/book-settlement
        payload:
          annualized_commission_cents: 1000000
        as: PlatformAdmin
      trigger:
      - call: POST /agency-network/agencies/${cali_id}/run_ops
        payload: {}
        as: PlatformAdmin
      - call: GET /agency-network/agencies/${cali_id}/performance
        payload: {}
        as: AppointingExecutive
        captures:
          perf: $.data.performance_status
          lr: $.data.loss_ratio
          gr: $.data.growth_new_pct
      assert:
      - Agency.${cali_id}.loss_ratio == 83.33 and Agency.${cali_id}.growth_new_pct == -75.00
      - Agency.${cali_id}.performance_status == AT_RISK
      - the independent-metrics variant would have emitted BEHIND, so asserting ON_TRACK or BEHIND fails
  - name: book_transfer_cause_forfeiture_settlement
    grounds:
    - calculations.book_transfer_settlement
    - calculations.retention_threshold_check
    - state_machines.Agent.APPOINTED_to_TRANSITIONING
    - endpoints.POST_/agency-network/agents/{id}/book-transfer
    distinguishing_aspect: On the BookTransfer domain the cause_forfeiture variant drops settlement_payable_cents to 0 whenever a transferred policy was written less than 24 months before the settlement clock, whereas the standard variant pays 90% of the transfer commission on the identical book; the two variants disagree.
    test_recipe:
      setup:
      - "Logical clock 2026-09-01T00:00:00Z. Successor agency Oak (region W) ACTIVE; LICENSED successor agent Cato; LICENSED ceasing agent Vera, APPOINTED, then transitioned onto Oak; policy P1 written 2020-03-01 (recent, under 24 months), 600,000 cents AUTO new."
      setup_api_calls:
      - call: POST /agency-network/agencies
        payload:
          agency_code: OAK-01
          name: Oak Agency
          region_code: W
          market_need_score: 60
        as: AppointingExecutive
        captures:
          oak_id: $.data.id
          oak_v0: $.data.version
      - call: POST /agency-network/agencies/${oak_id}/activate
        payload:
          expected_agency_version: ${oak_v0}
        as: AppointingExecutive
        captures:
          oak_v1: $.data.version
      - call: POST /agency-network/_inject/agent
        payload:
          full_name: Cato Successor
          state_code: CA
          license_status: LICENSED
          is_new_agent: false
          status: ACTIVE
        as: PlatformAdmin
        captures:
          cato_id: $.data.id
      - call: POST /agency-network/agreements
        payload:
          agent_id: ${cato_id}
          agency_id: ${oak_id}
          agreement_type: EXCLUSIVE_AGENT
          commission_schedule:
            AUTO:
              new: 0.15
              renewal: 0.1
            HOME:
              new: 0.12
              renewal: 0.08
            LIFE:
              new: 0.25
              renewal: 0.15
        as: FieldManager
      - call: POST /agency-network/appointment-applications
        payload:
          state_code: CA
          market_need_score: 55
          candidate_assessment_score: 80
          market_odds_score: 80
          creation_channel: FIELD
        as: FieldManager
        captures:
          vapp_id: $.data.id
      - call: POST /agency-network/appointment-applications/${vapp_id}/assess
        payload: {}
        as: FieldManager
      - call: POST /agency-network/appointment-applications/${vapp_id}/approve
        payload: {}
        as: AppointingExecutive
      - call: POST /agency-network/appointment-applications/${vapp_id}/appoint
        payload: {}
        as: FieldManager
        captures:
          vera_id: $.data.id
          vera_v0: $.data.version
      - call: POST /agency-network/agents/${vera_id}/read-license
        payload:
          license_expiry_date: "2028-01-01T00:00:00Z"
          product_lines:
          - AUTO
          - HOME
          - LIFE
        as: FieldManager
      - call: POST /agency-network/agents/${vera_id}/transition-book
        payload:
          agency_id: ${oak_id}
          expected_agent_version: ${vera_v0}
        as: FieldManager
        captures:
          vera_v1: $.data.version
      - call: POST /agency-network/policies
        payload:
          policy_number: V-P1
          product_line: AUTO
          annual_premium_cents: 600000
          is_new_business: true
          holder_agent_id: ${vera_id}
          owner_agency_id: ${oak_id}
        as: FieldManager
      trigger:
      - call: POST /agency-network/agents/${vera_id}/book-transfer
        payload:
          from_agency_id: ${oak_id}
          to_agency_id: ${oak_id}
        as: AgencyPrincipal
        as_user_id: ${oak_id}
        captures:
          xfer_id: $.data.id
      - call: GET /agency-network/book-transfers/${xfer_id}
        payload: {}
        as: FieldManager
        captures:
          pay_std: $.data.settlement_payable_cents
          pay_cause: $.data.status
      assert:
      - BookTransfer.${xfer_id}.settlement_payable_cents == 1800.00 under the cause_forfeiture variant (early-written policy dropped)
      - the standard variant on the identical book would emit 5400.00, so asserting 5400.00 fails
- rule_id: combinatorial_formula
  instances:
  - name: application_value_tier_score_boundary_at_eighty
    grounds:
    - calculations.application_value_tier
    - calculations.appointment_priority
    - state_machines.AppointmentApplication.SCORED_to_SCORED
    - errors[ERR_MARKET_NEED_EXISTS]
    distinguishing_aspect: "Mode (a): the tier is a non-linear nested selection over the priority score, and an application whose weighted priority lands on exactly 80 takes PREMIUM while one point lower takes STANDARD — the boundary is inclusive (>=), not strict."
    test_recipe:
      setup:
      - "Logical clock 2026-09-01T00:00:00Z. App X with market_odds 80, candidate_assessment 80, market_need 80, channel FIELD; App Y with market_odds 79, candidate_assessment 80, market_need 80, channel FIELD."
      setup_api_calls:
      - call: POST /agency-network/appointment-applications
        payload:
          state_code: CA
          market_need_score: 80
          candidate_assessment_score: 80
          market_odds_score: 80
          creation_channel: FIELD
        as: FieldManager
        captures:
          ax_id: $.data.id
      - call: POST /agency-network/appointment-applications
        payload:
          state_code: CA
          market_need_score: 80
          candidate_assessment_score: 80
          market_odds_score: 79
          creation_channel: FIELD
        as: FieldManager
        captures:
          ay_id: $.data.id
      trigger:
      - call: POST /agency-network/appointment-applications/${ax_id}/assess
        payload: {}
        as: FieldManager
        captures:
          ax_prio: $.data.appointment_priority
          ax_tier: $.data.application_value_tier
      - call: POST /agency-network/appointment-applications/${ay_id}/assess
        payload: {}
        as: FieldManager
        captures:
          ay_prio: $.data.appointment_priority
          ay_tier: $.data.application_value_tier
      assert:
      - AppointmentApplication.${ax_id}.appointment_priority == 80 and application_value_tier == PREMIUM
      - AppointmentApplication.${ay_id}.appointment_priority == 80 and application_value_tier == PREMIUM
      - an application with market_odds 79, assessment 79, market_need 79 (priority 79) is STANDARD
  - name: staffing_reimbursement_per_member_rounding_then_cap
    grounds:
    - calculations.staffing_reimbursement
    - state_machines.StaffMember.PENDING_to_ACTIVE
    - state_machines.StaffMember.ACTIVE_to_TERMINATED
    - entities.Agency.fields.agency_level_units
    distinguishing_aspect: "Mode (b): the total is built by rounding each member's line (allocation_units * 1.00) then summing, and the sum is capped at 500.00 after summation — sum-then-round and cap-per-member diverge once fractional rates are combined with the cap."
    test_recipe:
      setup:
      - "Logical clock 2026-09-01T00:00:00Z. Agency Oak ACTIVE with a LICENSED owner agent Cato and an ACTIVE sponsoring agreement; two StaffMembers nominated. Before appointment no member is ACTIVE, so staffing_reimbursement is 0.00."
      setup_api_calls:
      - call: POST /agency-network/agencies
        payload:
          agency_code: OAK-02
          name: Oak Two
          region_code: W
          market_need_score: 60
        as: AppointingExecutive
        captures:
          oak_id: $.data.id
          oak_v0: $.data.version
      - call: POST /agency-network/agencies/${oak_id}/activate
        payload:
          expected_agency_version: ${oak_v0}
        as: AppointingExecutive
        captures:
          oak_v1: $.data.version
      - call: POST /agency-network/_inject/agent
        payload:
          full_name: Cato Owner
          state_code: CA
          license_status: LICENSED
          is_new_agent: false
          status: ACTIVE
        as: PlatformAdmin
        captures:
          cato_id: $.data.id
      - call: POST /agency-network/agreements
        payload:
          agent_id: ${cato_id}
          agency_id: ${oak_id}
          agreement_type: EXCLUSIVE_AGENT
          commission_schedule:
            AUTO:
              new: 0.15
              renewal: 0.1
            HOME:
              new: 0.12
              renewal: 0.08
            LIFE:
              new: 0.25
              renewal: 0.15
        as: FieldManager
        captures:
          ag_id: $.data.id
      - call: POST /agency-network/staff
        payload:
          full_name: Sam Member
          role_title: CSR
          allocation_units: 5
          sponsoring_agreement_id: ${ag_id}
        as: AgencyPrincipal
        as_user_id: ${oak_id}
        captures:
          sam_id: $.data.id
      - call: POST /agency-network/staff
        payload:
          full_name: Tess Member
          role_title: Producer
          allocation_units: 10
          sponsoring_agreement_id: ${ag_id}
        as: AgencyPrincipal
        as_user_id: ${oak_id}
        captures:
          tess_id: $.data.id
      trigger:
      - call: POST /agency-network/staff/${sam_id}/appoint
        payload: {}
        as: AgencyPrincipal
        as_user_id: ${oak_id}
      - call: POST /agency-network/staff/${tess_id}/appoint
        payload: {}
        as: AgencyPrincipal
        as_user_id: ${oak_id}
      - call: GET /agency-network/agencies/${oak_id}
        payload: {}
        as: AgencyPrincipal
        as_user_id: ${oak_id}
      assert:
      - after two appointments the sum of rounded lines is 5.00 + 10.00 == 15.00, below the 500.00 cap
      - with 400 units of active staff the capped total is exactly 500.00, not 400.00 or a per-member cap
- rule_id: non_linear_state_machine
  instances:
  - name: appointment_application_assess_self_loop_reassessment
    grounds:
    - state_machines.AppointmentApplication.SCORED_to_SCORED
    - state_machines.AppointmentApplication.SUBMITTED_to_SCORED
    - state_machines.AppointmentApplication.SCORED_to_APPROVED
    - validations[priority=4]
    distinguishing_aspect: "The AppointmentApplication machine is cyclic: SCORED→SCORED re-assessment is a self-loop that recomputes priority/action/tier in place, unlike the acyclic Agent and Agreement machines."
    test_recipe:
      setup:
      - "Logical clock 2026-09-01T00:00:00Z. App X SUBMITTED, not yet assessed."
      setup_api_calls:
      - call: POST /agency-network/appointment-applications
        payload:
          state_code: CA
          market_need_score: 90
          candidate_assessment_score: 90
          market_odds_score: 90
          creation_channel: DIGITAL
        as: FieldManager
        captures:
          ax_id: $.data.id
      trigger:
      - call: POST /agency-network/appointment-applications/${ax_id}/assess
        payload: {}
        as: FieldManager
        captures:
          v1: $.data.version
          p1: $.data.appointment_priority
      - call: POST /agency-network/appointment-applications/${ax_id}/assess
        payload: {}
        as: FieldManager
        captures:
          p2: $.data.appointment_priority
          v2: $.data.version
      assert:
      - the first assess moves SUBMITTED→SCORED; the second assess leaves status == SCORED (self-loop, not a new state)
      - AppointmentApplication.${ax_id}.appointment_priority == 90 after both assessments (idempotent derived value)
      - AppointmentApplication.${ax_id}.required_action == PROCEED and version advances on each assess
  - name: claim_settle_resolve_reopen_cycle
    grounds:
    - state_machines.Claim.OPEN_to_PAID
    - state_machines.Claim.PAID_to_OPEN
    - calculations.resolution_chargeback
    - calculations.loss_ratio
    distinguishing_aspect: The Claim machine is cyclic (OPEN→PAID→OPEN) so a settled claim can re-open and drive the loss-ratio cascade in reverse, unlike the linear StaffMember PENDING→ACTIVE→TERMINATED machine.
    test_recipe:
      setup:
      - "Logical clock 2026-09-01T00:00:00Z. Agency Cali ACTIVE; open policy 300,000 cents AUTO; a 40,000-cent claim filed."
      setup_api_calls:
      - call: POST /agency-network/agencies
        payload:
          agency_code: CA-002
          name: Cali Two
          region_code: W
          market_need_score: 55
        as: AppointingExecutive
        captures:
          cali_id: $.data.id
          cali_v0: $.data.version
      - call: POST /agency-network/agencies/${cali_id}/activate
        payload:
          expected_agency_version: ${cali_v0}
        as: AppointingExecutive
        captures:
          cali_v1: $.data.version
      - call: POST /agency-network/_inject/agent
        payload:
          full_name: Cal Two Keeper
          state_code: CA
          license_status: LICENSED
          is_new_agent: false
          status: ACTIVE
        as: PlatformAdmin
        captures:
          cal_id: $.data.id
      - call: POST /agency-network/policies
        payload:
          policy_number: CA-P3
          product_line: AUTO
          annual_premium_cents: 300000
          is_new_business: false
          holder_agent_id: ${cal_id}
          owner_agency_id: ${cali_id}
        as: FieldManager
        captures:
          p3: $.data.id
      - call: POST /agency-network/claims
        payload:
          policy_id: ${p3}
          claim_amount_cents: 40000
        as: ClaimsAdjuster
        captures:
          cl3: $.data.id
      trigger:
      - call: POST /agency-network/claims/${cl3}/settle
        payload: {}
        as: ClaimsAdjuster
        captures:
          s1: $.data.status
          pc1: $.data.policy_paid_cents
      - call: POST /agency-network/claims/${cl3}/resolve
        payload: {}
        as: ClaimsAdjuster
        captures:
          s2: $.data.status
      assert:
      - after settle Claim.${cl3}.status == PAID and policy_paid_cents == 40000.00
      - after resolve Claim.${cl3}.status == OPEN again (the cycle closed) and the §1.3 loss-ratio cascade runs in reverse
      - a second resolve from OPEN is refused with ERR_INVALID_STATE
- rule_id: transitive_cascade
  instances:
  - name: claim_settle_cascade_loss_ratio_performance
    grounds:
    - state_machines.Claim.OPEN_to_PAID
    - calculations.loss_ratio
    - state_machines.Agency.APPROVED_to_ACTIVE
    - calculations.agency_performance_measurement
    distinguishing_aspect: "A depth-4 transitive chain: settling a Claim recomputes the owning Policy's paid fields (hop 1), which recomputes Agency.agency_paid_claims_cents (hop 2), which recomputes Agency.loss_ratio (hop 3), which flips Agency.performance_status (hop 4) — each hop caused by the previous one, and the trigger is the Claim.settle transition."
    test_recipe:
      setup:
      - "Logical clock 2026-09-01T00:00:00Z. Agency Cali ACTIVE with an OPEN 500,000-cent AUTO policy and agency_paid_claims_cents == 0.00 (loss_ratio 0.00); 10,000,000.00 of trailing new-business commission so growth is positive."
      setup_api_calls:
      - call: POST /agency-network/agencies
        payload:
          agency_code: CA-003
          name: Cali Three
          region_code: W
          market_need_score: 60
        as: AppointingExecutive
        captures:
          cali_id: $.data.id
          cali_v0: $.data.version
      - call: POST /agency-network/agencies/${cali_id}/activate
        payload:
          expected_agency_version: ${cali_v0}
        as: AppointingExecutive
        captures:
          cali_v1: $.data.version
      - call: POST /agency-network/_inject/agent
        payload:
          full_name: Cal Three Keeper
          state_code: CA
          license_status: LICENSED
          is_new_agent: false
          status: ACTIVE
        as: PlatformAdmin
        captures:
          cal_id: $.data.id
      - call: POST /agency-network/policies
        payload:
          policy_number: CA-P4
          product_line: AUTO
          annual_premium_cents: 500000
          is_new_business: false
          holder_agent_id: ${cal_id}
          owner_agency_id: ${cali_id}
        as: FieldManager
        captures:
          p4: $.data.id
      - call: POST /agency-network/claims
        payload:
          policy_id: ${p4}
          claim_amount_cents: 45000
        as: ClaimsAdjuster
        captures:
          cl4: $.data.id
      - call: POST /agency-network/agencies/${cali_id}/book-settlement
        payload:
          annualized_commission_cents: 10000000
        as: PlatformAdmin
      trigger:
      - call: POST /agency-network/claims/${cl4}/settle
        payload: {}
        as: ClaimsAdjuster
      - call: GET /agency-network/policies/${p4}
        payload: {}
        as: ClaimsAdjuster
        captures:
          hop1: $.data.paid_claims_cents
      - call: GET /agency-network/agencies/${cali_id}
        payload: {}
        as: AppointingExecutive
        captures:
          hop2: $.data.agency_paid_claims_cents
          hop3: $.data.loss_ratio
          hop4: $.data.performance_status
      assert:
      - "hop 1: Policy.${p4}.paid_claims_cents == 45000.00"
      - "hop 2: Agency.${cali_id}.agency_paid_claims_cents == 45000.00"
      - "hop 3: Agency.${cali_id}.loss_ratio == 75.00 (45000 / (500000 * 0.12) * 100)"
      - "hop 4: Agency.${cali_id}.performance_status == AT_RISK because loss_ratio > 70 now outranks positive growth"
  - name: staff_termination_cascade_reimbursement
    grounds:
    - state_machines.StaffMember.ACTIVE_to_TERMINATED
    - calculations.staffing_reimbursement
    - state_machines.Agency.ACTIVE_to_TERMINATED
    - state_machines.Agreement.SUSPENDED_to_TERMINATED
    distinguishing_aspect: "A depth-2 transitive chain: terminating the agency's agreement cascades StaffMembers to TERMINATED (link 1), and that staff change itself forces agency_level_units and staffing_reimbursement to be recomputed (link 2) — the second link is caused by the first, not by the agency termination directly."
    test_recipe:
      setup:
      - "Logical clock 2026-09-01T00:00:00Z. Agency Oak ACTIVE with one ACTIVE staffer of 8 units, and a suspended agreement after the owner agent ceased."
