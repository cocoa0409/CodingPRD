# =============================================================================
# SCAFFOLD — task_3456_accident_investigation_party_system_probable_cause_determination
# NTSB-style accident investigation: launch decisions, party system, investigative
# groups, factual record / public docket, recorder readout protection, safety
# recommendations with response tracking, board-meeting probable-cause adoption.
# =============================================================================

scenario: |
  Accident Investigation Party System & Probable Cause Determination (National Transportation Safety Board): notification and launch decisions determining which accidents receive a full investigation with go-team assembly, party system designation inviting operators, manufacturers and unions to assist while excluding litigants and insurers, group formation across operations, structures, human performance and recorders with party participant conduct rules, factual record development with public docket release separate from analysis, recorder readout with data protection and constraints on premature release, safety recommendation issuance to regulators and industry with response tracking and acceptable classification, probable cause adoption at a board meeting with member deliberation and dissent, party expulsion for premature public statements

domain_name: accident-investigation-party-system
api_prefix: "/"
# Flat multi-root API: collections live at /accident-cases, /investigations,
# /party-organizations, /party-designations, /groups, /recorders,
# /safety-recommendations, /board-meetings. The only platform endpoint outside
# the business surface is POST /_clock/set_current_utc.

# =============================================================================
# Complexity Profile (§0)
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation   # board deliberation, voting, dissent
  complexity_layers:
    - optimistic_concurrency        # OCC on AccidentCase.version (propose) and BoardMeeting.version (votes)
    - cascading_side_effects        # expulsion chain; board-adoption chain; docket release chain
    - dual_variant_calculation      # statutory vs risk-adjusted launch score; calendar vs business-day recommendation aging
    - scheduled_actions             # logical clock; lazy completion of readout sessions; lazy meeting session opening
  entity_topology: graph            # flat collections with FK references + junction entities (PartyDesignation, seats)
  state_machine_shape: cyclic       # LaunchDecision PROPOSED↔ADOPTED reconsider loop; phase FACTUAL↔ANALYSIS; recommendation reclassification loop; Investigation carries two independent state dimensions (phase × docket_status)
  relationship_patterns:
    - many_to_many                  # PartyDesignation joins Investigation × PartyOrganization; GroupSeat joins PartyDesignation × InvestigativeGroup
    - cross_aggregate               # SafetyRecommendation → PartyOrganization (addressee outside the investigation aggregate)
  role_model: segregation_of_duties # proposer ≠ adopter; chairman ≠ IIC; IIC barred from board sitting; ownership-scoped actions
  consistency_model: immediate      # all mutations visible in the same response envelope

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# Embedded sub-records (LaunchDecision, GroupSeat, FactualReport, ReadoutSession)
# are stored inside their parent document; they are addressed by sub-path ids and
# carry no independent reverse-GET surface.
# =============================================================================
entities:
  - name: AccidentCase
    parent: null
    common_fields: true
    fields:
      - { name: report_number, type: string, source: input, description: "Unique external report number, e.g. NTSB-2026-0001; duplicates rejected with ERR_DUPLICATE_REPORT_NUMBER" }
      - { name: category, type: enum, source: input, description: "AVIATION | RAIL | HIGHWAY | MARINE | PIPELINE | HAZMAT" }
      - { name: occurred_at, type: datetime, source: input, description: "ISO8601 UTC timestamp of the accident" }
      - { name: location_state, type: string, source: input, description: "Two-letter state/territory code" }
      - { name: fatalities_count, type: integer, source: input, description: "Reported fatalities; >= 0" }
      - { name: injuries_count, type: integer, source: input, description: "Reported injuries; >= 0" }
      - { name: damage_estimate_cents, type: integer, source: input, description: "Reported property damage estimate in cents; >= 0" }
      - { name: is_public_transport, type: boolean, source: input, description: "Whether a public-conveyance operation was involved" }
      - { name: statutory_score, type: number, source: computed, description: "Launch score per calculations.statutory_launch_score; recomputed at create and whenever a launch-decision proposal or reconsideration carries severity overrides" }
      - { name: risk_adjusted_score, type: number, source: computed, description: "Risk-weighted variant per calculations.risk_adjusted_launch_score (per-component rounding, then sum); observability only, never gates adoption" }
      - { name: suggested_mode, type: enum, source: computed, description: "FULL_GO_TEAM | LIMITED | DECLINED derived from statutory_score thresholds" }
      - { name: status, type: enum, source: system, description: "SCREENING | LAUNCHED | LIMITED_TRACK | DECLINED | CLOSED_ADOPTED" }
      - { name: launch_decisions, type: array, source: system, description: "Embedded LaunchDecision sub-records in creation order; see entity LaunchDecision" }

  - name: LaunchDecision
    parent: AccidentCase
    common_fields: false
    fields:
      - { name: decision_id, type: string, source: system, description: "Server-minted UUID identifying the embedded decision within AccidentCase.launch_decisions" }
      - { name: mode, type: enum, source: input, description: "FULL_GO_TEAM | LIMITED | DECLINED; the disposition this decision proposes" }
      - { name: status, type: enum, source: system, description: "PROPOSED | ADOPTED | SUPERSEDED" }
      - { name: proposed_by_user_id, type: string, source: system, description: "X-User-ID of the ManagingDirector who proposed; used by the proposer-cannot-adopt segregation-of-duties check" }
      - { name: proposed_at, type: datetime, source: system, description: "Logical-clock timestamp of proposal" }
      - { name: adopted_at, type: datetime, source: system, description: "Logical-clock timestamp of adoption; null until adopted" }
      - { name: snapshot_statutory_score, type: number, source: system, description: "AccidentCase.statutory_score at proposal time (after any severity overrides of that proposal were applied)" }
      - { name: snapshot_risk_adjusted_score, type: number, source: system, description: "AccidentCase.risk_adjusted_score at proposal time" }
      - { name: rationale, type: string, source: input, description: "Free-text decision rationale; optional" }

  - name: Investigation
    parent: AccidentCase
    common_fields: true
    fields:
      - { name: accident_case_id, type: string, source: system, description: "FK -> AccidentCase.id; the launched case; at most one Investigation ever exists per AccidentCase" }
      - { name: iic_user_id, type: string, source: input, description: "Investigator-in-charge operator id, supplied at adoption of a FULL_GO_TEAM decision; scopes all IIC actions" }
      - { name: phase, type: enum, source: system, description: "GO_TEAM_ASSEMBLED | ON_SCENE | FACTUAL | ANALYSIS | BOARD_REVIEW | ADOPTED" }
      - { name: docket_status, type: enum, source: system, description: "SEALED | OPEN | FINAL — an independent state dimension from phase" }
      - { name: docket_completeness_pct, type: integer, source: computed, description: "Per calculations.docket_completeness_pct; recomputed whenever a group completes, reverts, or a seat/report change alters satisfaction" }

  - name: PartyOrganization
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered legal name of the organization" }
      - { name: org_type, type: enum, source: input, description: "OPERATOR | MANUFACTURER | UNION | REGULATOR | INDUSTRY_OTHER may be designated as parties; CLAIMANT_COUNSEL | INSURER are statutorily excluded from party status" }

  - name: PartyDesignation
    parent: null
    common_fields: true
    fields:
      - { name: investigation_id, type: string, source: input, description: "FK -> Investigation.id; the investigation the organization is designated to assist" }
      - { name: organization_id, type: string, source: input, description: "FK -> PartyOrganization.id; the designated organization" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXPELLED" }
      - { name: designated_at, type: datetime, source: system, description: "Logical-clock timestamp of designation" }
      - { name: expulsion_reason, type: string, source: input, description: "Free-text reason recorded at expulsion; null until expelled" }
      - { name: group_seats, type: array, source: system, description: "Embedded GroupSeat sub-records; see entity GroupSeat" }

  - name: GroupSeat
    parent: PartyDesignation
    common_fields: false
    fields:
      - { name: seat_id, type: string, source: system, description: "Server-minted UUID identifying the embedded seat within PartyDesignation.group_seats" }
      - { name: group_id, type: string, source: input, description: "Embedded reference to InvestigativeGroup.id (validated at seat-creation time)" }
      - { name: status, type: enum, source: system, description: "SEATED | SUSPENDED | REMOVED" }
      - { name: strike_count, type: integer, source: computed, description: "Length of conduct_log; reaching 2 auto-suspends the seat" }
      - { name: conduct_log, type: array, source: system, description: "Append-only array of {violation_kind, detail, recorded_at}; violation_kind in PREMATURE_PUBLIC_STATEMENT | UNAUTHORIZED_ANALYSIS_DISCLOSURE | EX_PARTE_CONTACT" }

  - name: InvestigativeGroup
    parent: null
    common_fields: true
    fields:
      - { name: investigation_id, type: string, source: input, description: "FK -> Investigation.id" }
      - { name: specialty, type: enum, source: input, description: "OPERATIONS | STRUCTURES | HUMAN_PERFORMANCE | RECORDERS" }
      - { name: chairman_user_id, type: string, source: input, description: "Operator id of the group chairman; must differ from the investigation's iic_user_id (segregation of duties)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | COMPLETE | DISBANDED" }
      - { name: seated_count, type: integer, source: computed, description: "Count of GroupSeat sub-records across ALL PartyDesignations whose group_id equals this group and whose status == SEATED; recomputed on seat creation, suspension, and expulsion" }
      - { name: factual_reports, type: array, source: system, description: "Embedded FactualReport sub-records; see entity FactualReport" }

  - name: FactualReport
    parent: InvestigativeGroup
    common_fields: false
    fields:
      - { name: report_id, type: string, source: system, description: "Server-minted UUID identifying the embedded report within InvestigativeGroup.factual_reports" }
      - { name: report_kind, type: enum, source: input, description: "GROUP_FACTUAL | RECORDER_TRANSCRIPT | SPECIALIST" }
      - { name: content, type: string, source: input, description: "Factual narrative; factual material only, never analysis" }
      - { name: recorder_id, type: string, source: input, description: "Embedded reference to RecorderPackage.id; required iff report_kind == RECORDER_TRANSCRIPT, otherwise must be absent (ERR_INVALID_REQUEST)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | VERIFIED | DOCKETED" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the authoring GroupChairman" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of submission" }
      - { name: verified_at, type: datetime, source: system, description: "Logical-clock timestamp of IIC verification; null until verified" }

  - name: RecorderPackage
    parent: null
    common_fields: true
    fields:
      - { name: investigation_id, type: string, source: input, description: "FK -> Investigation.id" }
      - { name: recorder_type, type: enum, source: input, description: "CVR | FDR | OTHER" }
      - { name: condition, type: enum, source: input, description: "INTACT | DAMAGED | SEVERELY_DAMAGED" }
      - { name: status, type: enum, source: system, description: "SECURED | IN_READOUT | READOUT_COMPLETE | RELEASED; READOUT_COMPLETE is evaluated lazily from the logical clock (see state machine)" }
      - { name: readout_sessions, type: array, source: system, description: "Embedded ReadoutSession sub-records; see entity ReadoutSession" }

  - name: ReadoutSession
    parent: RecorderPackage
    common_fields: false
    fields:
      - { name: session_id, type: string, source: system, description: "Server-minted UUID identifying the embedded session within RecorderPackage.readout_sessions" }
      - { name: bench_id, type: string, source: input, description: "Lab bench resource label; half-open session windows on the same bench_id must not overlap" }
      - { name: window_start_utc, type: datetime, source: input, description: "Session start; must be strictly after the current logical clock" }
      - { name: window_end_utc, type: datetime, source: input, description: "Session end; must be strictly after window_start_utc" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETE; COMPLETE is evaluated lazily when the logical clock reaches window_end_utc" }

  - name: SafetyRecommendation
    parent: null
    common_fields: true
    fields:
      - { name: investigation_id, type: string, source: input, description: "FK -> Investigation.id" }
      - { name: addressee_org_id, type: string, source: input, description: "FK -> PartyOrganization.id; regulator or industry organization obligated to respond" }
      - { name: recommendation_text, type: string, source: input, description: "Recommendation text" }
      - { name: status, type: enum, source: system, description: "OPEN_AWAITING_RESPONSE | OPEN_UNCLASSIFIED | OPEN_ACCEPTABLE | OPEN_UNACCEPTABLE | CLOSED_ACCEPTABLE | CLOSED_UNACCEPTABLE | CLOSED_EXCEEDS" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp of issuance" }
      - { name: response_log, type: array, source: system, description: "Append-only array of {response_id, response_text, responded_at, classification_pending, classification, classified_at}; classification in ACCEPTABLE | UNACCEPTABLE, null while pending" }
      - { name: unacceptable_streak, type: integer, source: computed, description: "Count of consecutive classified-UNACCEPTABLE responses at the tail of response_log; resets to 0 on any ACCEPTABLE classification" }
      - { name: calendar_elapsed_days, type: integer, source: computed, description: "Whole calendar days from issued_at to the current logical clock, computed on read" }
      - { name: business_elapsed_days, type: integer, source: computed, description: "Days in (issued_at, now] whose weekday is Monday–Friday, computed on read; no holiday calendar" }
      - { name: overdue, type: boolean, source: computed, description: "true iff calendar_elapsed_days > 90 and status is not one of CLOSED_ACCEPTABLE | CLOSED_UNACCEPTABLE | CLOSED_EXCEEDS" }
      - { name: aging_bucket, type: enum, source: computed, description: "GREEN if business_elapsed_days < 60; AMBER if 60 <= business_elapsed_days <= 89; RED if >= 90" }

  - name: BoardMeeting
    parent: null
    common_fields: true
    fields:
      - { name: investigation_id, type: string, source: input, description: "FK -> Investigation.id" }
      - { name: room_id, type: string, source: input, description: "Hearing-room resource label; meeting windows on the same room_id must not overlap, with a 60-minute turnaround buffer after each meeting" }
      - { name: window_start_utc, type: datetime, source: input, description: "Meeting start; must be strictly after the current logical clock at creation" }
      - { name: window_end_utc, type: datetime, source: input, description: "Meeting end; must be strictly after window_start_utc" }
      - { name: sitting_member_ids, type: array, source: input, description: "Array of BoardMember X-User-ID strings; must contain at least 3 distinct members and must not contain the investigation's iic_user_id" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_SESSION | COMPLETED; IN_SESSION is evaluated lazily when the logical clock reaches window_start_utc" }
      - { name: member_votes, type: array, source: system, description: "Array of {member_user_id, position, dissent_text, cast_at}; at most one entry per member (re-voting upserts); position in ADOPT | REJECT | ABSTAIN" }
      - { name: adopt_count, type: integer, source: computed, description: "Count of member_votes with position ADOPT" }
      - { name: reject_count, type: integer, source: computed, description: "Count of member_votes with position REJECT" }
      - { name: abstain_count, type: integer, source: computed, description: "Count of member_votes with position ABSTAIN" }
      - { name: dissenting_member_ids, type: array, source: computed, description: "member_user_id values whose current position is REJECT, ordered by cast_at ascending with ties broken by member_votes append order" }
      - { name: outcome, type: enum, source: system, description: "ADOPTED | NOT_ADOPTED; null until the meeting closes; ADOPTED iff adopt_count > reject_count strictly" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: AccidentCase
    initial_state: SCREENING
    terminal_states: [CLOSED_ADOPTED]
    transitions:
      - from: SCREENING
        to: LAUNCHED
        trigger: "system — adoption of an embedded LaunchDecision with mode FULL_GO_TEAM"
        actor: system
        preconditions: ["the adopted decision is PROPOSED and mode == FULL_GO_TEAM"]
        side_effects:
          - "Investigation created (accident_case_id = this case, iic_user_id from the adopt payload, phase GO_TEAM_ASSEMBLED, docket_status SEALED, docket_completeness_pct 0)"
          - "increments AccidentCase.version by 1"
      - from: SCREENING
        to: LIMITED_TRACK
        trigger: "system — adoption of an embedded LaunchDecision with mode LIMITED"
        actor: system
        preconditions: ["the adopted decision is PROPOSED and mode == LIMITED"]
        side_effects: ["increments AccidentCase.version by 1"]
      - from: SCREENING
        to: DECLINED
        trigger: "system — adoption of an embedded LaunchDecision with mode DECLINED"
        actor: system
        preconditions: ["the adopted decision is PROPOSED and mode == DECLINED"]
        side_effects: ["increments AccidentCase.version by 1"]
      - from: LIMITED_TRACK
        to: SCREENING
        trigger: "system — reconsideration of the ADOPTED decision"
        actor: system
        preconditions: ["the reconsidered decision is ADOPTED"]
        side_effects:
          - "severity overrides from the reconsider payload are applied to the case"
          - "recompute statutory_score, risk_adjusted_score, suggested_mode"
          - "increments AccidentCase.version by 1"
      - from: DECLINED
        to: SCREENING
        trigger: "system — reconsideration of the ADOPTED decision"
        actor: system
        preconditions: ["the reconsidered decision is ADOPTED"]
        side_effects:
          - "severity overrides from the reconsider payload are applied to the case"
          - "recompute statutory_score, risk_adjusted_score, suggested_mode"
          - "increments AccidentCase.version by 1"
      - from: LAUNCHED
        to: CLOSED_ADOPTED
        trigger: "system — cascade from a BoardMeeting closing with outcome ADOPTED"
        actor: system
        preconditions: ["the case's Investigation reaches phase ADOPTED"]
        side_effects: ["increments AccidentCase.version by 1"]

  - entity: LaunchDecision
    initial_state: PROPOSED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: ADOPTED
        trigger: "POST /accident-cases/{id}/launch-decisions/{decision_id}/adopt"
        actor: ManagingDirector
        preconditions:
          - "AccidentCase.status == SCREENING (ERR_CASE_NOT_SCREENING)"
          - "decision.status == PROPOSED (ERR_DECISION_STATE_INVALID)"
          - "caller X-User-ID != decision.proposed_by_user_id (ERR_SOD_PROPOSER_CANNOT_ADOPT)"
          - "mode FULL_GO_TEAM requires AccidentCase.statutory_score >= 60; mode LIMITED requires >= 20; DECLINED has no threshold (ERR_LAUNCH_THRESHOLD_NOT_MET)"
          - "payload iic_user_id present iff mode == FULL_GO_TEAM (ERR_INVALID_REQUEST)"
        side_effects:
          - "decision.adopted_at = logical clock"
          - "AccidentCase transitions per mode (LAUNCHED | LIMITED_TRACK | DECLINED) with the side effects declared there"
      - from: PROPOSED
        to: SUPERSEDED
        trigger: "system — a new launch decision is proposed on the same AccidentCase"
        actor: system
        preconditions: []
        side_effects: []
        note: "at most one PROPOSED decision exists per AccidentCase; proposing supersedes the previous PROPOSED decision"
      - from: ADOPTED
        to: PROPOSED
        trigger: "POST /accident-cases/{id}/launch-decisions/{decision_id}/reconsider"
        actor: ManagingDirector
        preconditions:
          - "decision.status == ADOPTED (ERR_DECISION_STATE_INVALID)"
          - "AccidentCase.status in {LIMITED_TRACK, DECLINED}; LAUNCHED or CLOSED_ADOPTED cases reject with ERR_CASE_ALREADY_LAUNCHED"
        side_effects:
          - "AccidentCase returns to SCREENING (with the side effects declared on that transition)"
          - "decision.snapshot_* scores refreshed from the recomputed case scores"

  - entity: Investigation
    initial_state: GO_TEAM_ASSEMBLED
    terminal_states: [ADOPTED]
    note: "phase and docket_status are independent state dimensions; docket transitions are declared in the docket machine below"
    transitions:
      - from: GO_TEAM_ASSEMBLED
        to: ON_SCENE
        trigger: "POST /investigations/{id}/advance-phase {to_phase: ON_SCENE}"
        actor: IIC
        preconditions:
          - "caller X-User-ID == investigation.iic_user_id (ERR_INSUFFICIENT_PERMISSIONS)"
          - "at least one InvestigativeGroup of this investigation has status == ACTIVE (ERR_PHASE_GATE_UNSATISFIED)"
        side_effects: ["increments Investigation.version by 1"]
      - from: ON_SCENE
        to: FACTUAL
        trigger: "POST /investigations/{id}/advance-phase {to_phase: FACTUAL}"
        actor: IIC
        preconditions:
          - "caller X-User-ID == investigation.iic_user_id (ERR_INSUFFICIENT_PERMISSIONS)"
          - "every InvestigativeGroup with status == ACTIVE has seated_count >= 1 (ERR_PHASE_GATE_UNSATISFIED)"
        side_effects: ["increments Investigation.version by 1"]
      - from: FACTUAL
        to: ANALYSIS
        trigger: "POST /investigations/{id}/advance-phase {to_phase: ANALYSIS}"
        actor: IIC
        preconditions:
          - "caller X-User-ID == investigation.iic_user_id (ERR_INSUFFICIENT_PERMISSIONS)"
          - "docket_status == OPEN (ERR_DOCKET_NOT_OPEN)"
          - "every InvestigativeGroup has status in {COMPLETE, DISBANDED} (ERR_PHASE_GATE_UNSATISFIED)"
        side_effects: ["increments Investigation.version by 1"]
      - from: ANALYSIS
        to: BOARD_REVIEW
        trigger: "POST /investigations/{id}/advance-phase {to_phase: BOARD_REVIEW}"
        actor: IIC
        preconditions:
          - "caller X-User-ID == investigation.iic_user_id (ERR_INSUFFICIENT_PERMISSIONS)"
          - "at least one BoardMeeting of this investigation has effective status SCHEDULED (ERR_PHASE_GATE_UNSATISFIED)"
        side_effects: ["increments Investigation.version by 1"]
      - from: ANALYSIS
        to: FACTUAL
        trigger: "POST /investigations/{id}/reopen-factual"
        actor: IIC
        preconditions:
          - "caller X-User-ID == investigation.iic_user_id (ERR_INSUFFICIENT_PERMISSIONS)"
        side_effects:
          - "every InvestigativeGroup with status == COMPLETE reverts to ACTIVE"
          - "recompute docket_completeness_pct"
          - "docket_status is unchanged (an OPEN docket stays OPEN)"
          - "increments Investigation.version by 1"
      - from: BOARD_REVIEW
        to: ANALYSIS
        trigger: "system — cascade from a BoardMeeting closing with outcome NOT_ADOPTED"
        actor: system
        preconditions: []
        side_effects: ["increments Investigation.version by 1"]
      - from: BOARD_REVIEW
        to: ADOPTED
        trigger: "system — cascade from a BoardMeeting closing with outcome ADOPTED"
        actor: system
        preconditions: []
        side_effects:
          - "docket_status OPEN -> FINAL"
          - "every InvestigativeGroup with status in {ACTIVE, COMPLETE} -> DISBANDED"
          - "AccidentCase LAUNCHED -> CLOSED_ADOPTED"
          - "increments Investigation.version by 1"
      - from: GO_TEAM_ASSEMBLED
        to: FACTUAL
        trigger: "any advance-phase hop not listed above"
        actor: IIC
        preconditions: []
        side_effects: []
        note: "rejected with ERR_INVESTIGATION_PHASE_INVALID — hops must follow the declared order; this row documents the rejection, no transition occurs"

  - entity: Investigation.docket_status
    initial_state: SEALED
    terminal_states: [FINAL]
    transitions:
      - from: SEALED
        to: OPEN
        trigger: "POST /investigations/{id}/release-docket"
        actor: DocketOfficer
        preconditions:
          - "phase == FACTUAL (ERR_INVESTIGATION_PHASE_INVALID)"
          - "docket_status == SEALED (ERR_DOCKET_STATE_INVALID)"
          - "business_safety: no ReadoutSession embedded in any RecorderPackage of this investigation has window_end_utc strictly after the current logical clock (ERR_RECORDER_READOUT_INCOMPLETE)"
          - "business_constraint: every InvestigativeGroup has status == COMPLETE and holds at least one embedded FactualReport with status in {VERIFIED, DOCKETED} (ERR_DOCKET_INCOMPLETE)"
        side_effects:
          - "every embedded FactualReport with status VERIFIED across the investigation's groups -> DOCKETED"
          - "every RecorderPackage whose status == READOUT_COMPLETE -> RELEASED"
          - "recompute docket_completeness_pct (== 100 at this point by construction)"
          - "increments Investigation.version by 1"
      - from: OPEN
        to: FINAL
        trigger: "system — cascade from investigation phase reaching ADOPTED"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PartyDesignation
    initial_state: ACTIVE
    terminal_states: [EXPELLED]
    transitions:
      - from: ACTIVE
        to: EXPELLED
        trigger: "POST /party-designations/{id}/expel"
        actor: ManagingDirector
        preconditions:
          - "designation.status == ACTIVE (ERR_DESIGNATION_NOT_ACTIVE)"
          - "at least one conduct_log entry with violation_kind == PREMATURE_PUBLIC_STATEMENT exists across the designation's embedded GroupSeats (ERR_EXPULSION_WITHOUT_QUALIFYING_VIOLATION)"
        side_effects:
          - "expulsion_reason recorded from payload"
          - "CASCADE link 2: every embedded GroupSeat with status in {SEATED, SUSPENDED} -> REMOVED"
          - "CASCADE link 3: every InvestigativeGroup referenced by a removed seat whose seated_count drops to 0 AND whose status == COMPLETE reverts to ACTIVE"
          - "CASCADE link 4: recompute docket_completeness_pct on the Investigation and bump Investigation.updated_at/version"
          - "increments PartyDesignation.version by 1"

  - entity: GroupSeat
    initial_state: SEATED
    terminal_states: [REMOVED]
    note: "embedded in PartyDesignation.group_seats"
    transitions:
      - from: SEATED
        to: SUSPENDED
        trigger: "system — strike_count reaches 2 after a conduct violation is recorded"
        actor: system
        preconditions: []
        side_effects: ["recompute seated_count on the referenced InvestigativeGroup"]
      - from: SEATED
        to: REMOVED
        trigger: "system — cascade from party expulsion"
        actor: system
        preconditions: []
        side_effects: ["recompute seated_count on the referenced InvestigativeGroup"]
      - from: SUSPENDED
        to: REMOVED
        trigger: "system — cascade from party expulsion"
        actor: system
        preconditions: []
        side_effects: ["recompute seated_count on the referenced InvestigativeGroup"]

  - entity: InvestigativeGroup
    initial_state: ACTIVE
    terminal_states: [DISBANDED]
    transitions:
      - from: ACTIVE
        to: COMPLETE
        trigger: "POST /groups/{id}/complete"
        actor: GroupChairman
        preconditions:
          - "group.status == ACTIVE (ERR_GROUP_NOT_ACTIVE)"
          - "caller X-User-ID == group.chairman_user_id (ERR_CHAIRMAN_OWNERSHIP)"
          - "investigation.phase == FACTUAL (ERR_INVESTIGATION_PHASE_INVALID)"
          - "group.seated_count >= 1 (ERR_GROUP_NOT_COMPLETABLE)"
          - "at least one embedded FactualReport has status in {VERIFIED, DOCKETED} (ERR_GROUP_NOT_COMPLETABLE); a DOCKETED report still satisfies this so a group can re-complete after reopen-factual"
        side_effects:
          - "recompute docket_completeness_pct on the Investigation"
          - "increments InvestigativeGroup.version by 1"
      - from: COMPLETE
        to: ACTIVE
        trigger: "system — reopen-factual on the investigation, OR expulsion cascade leaving seated_count == 0"
        actor: system
        preconditions: []
        side_effects:
          - "recompute docket_completeness_pct on the Investigation"
          - "increments InvestigativeGroup.version by 1"
      - from: ACTIVE
        to: DISBANDED
        trigger: "system — investigation reaches ADOPTED"
        actor: system
        preconditions: []
        side_effects: []
      - from: COMPLETE
        to: DISBANDED
        trigger: "system — investigation reaches ADOPTED"
        actor: system
        preconditions: []
        side_effects: []

  - entity: FactualReport
    initial_state: SUBMITTED
    terminal_states: [DOCKETED]
    note: "embedded in InvestigativeGroup.factual_reports"
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /groups/{id}/factual-reports/{report_id}/verify"
        actor: IIC
        preconditions:
          - "group.status == ACTIVE (ERR_GROUP_NOT_ACTIVE)"
          - "investigation.phase == FACTUAL (ERR_INVESTIGATION_PHASE_INVALID)"
          - "report.status == SUBMITTED (ERR_REPORT_STATE_INVALID)"
          - "caller X-User-ID == investigation.iic_user_id (ERR_INSUFFICIENT_PERMISSIONS)"
          - "business_safety: if report_kind == RECORDER_TRANSCRIPT, the referenced RecorderPackage.status must be READOUT_COMPLETE or RELEASED (ERR_RECORDER_READOUT_INCOMPLETE)"
        side_effects: ["report.verified_at = logical clock"]
      - from: VERIFIED
        to: DOCKETED
        trigger: "system — release-docket on the investigation"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RecorderPackage
    initial_state: SECURED
    terminal_states: [RELEASED]
    transitions:
      - from: SECURED
        to: IN_READOUT
        trigger: "system — first ReadoutSession scheduled on this recorder"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_READOUT
        to: READOUT_COMPLETE
        trigger: "system — lazy evaluation on any read or write of the recorder: at least one embedded ReadoutSession exists and every session has window_end_utc <= current logical clock"
        actor: system
        preconditions: []
        side_effects: []
      - from: READOUT_COMPLETE
        to: RELEASED
        trigger: "system — release-docket on the investigation"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ReadoutSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETE]
    note: "embedded in RecorderPackage.readout_sessions"
    transitions:
      - from: SCHEDULED
        to: COMPLETE
        trigger: "system — lazy evaluation when the current logical clock reaches window_end_utc"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SafetyRecommendation
    initial_state: OPEN_AWAITING_RESPONSE
    terminal_states: [CLOSED_ACCEPTABLE, CLOSED_UNACCEPTABLE, CLOSED_EXCEEDS]
    transitions:
      - from: OPEN_AWAITING_RESPONSE
        to: OPEN_UNCLASSIFIED
        trigger: "POST /safety-recommendations/{id}/responses"
        actor: AddresseeContact
        preconditions:
          - "caller X-User-ID == recommendation.addressee_org_id (ERR_NOT_ADDRESSEE)"
          - "status in {OPEN_AWAITING_RESPONSE, OPEN_ACCEPTABLE, OPEN_UNACCEPTABLE}; a response while OPEN_UNCLASSIFIED is rejected with ERR_RECOMMENDATION_STATE_INVALID (the outstanding response must be classified before another is accepted — this keeps classification_pending unique), and any CLOSED_* status rejects with the same error"
        side_effects:
          - "append {response_id, response_text, responded_at = logical clock, classification_pending: true, classification: null, classified_at: null} to response_log"
          - "increments SafetyRecommendation.version by 1"
      - from: OPEN_ACCEPTABLE
        to: OPEN_UNCLASSIFIED
        trigger: "POST /safety-recommendations/{id}/responses"
        actor: AddresseeContact
        preconditions: ["same as OPEN_AWAITING_RESPONSE -> OPEN_UNCLASSIFIED"]
        side_effects: ["same response_log append; this is the reclassification loop"]
      - from: OPEN_UNACCEPTABLE
        to: OPEN_UNCLASSIFIED
        trigger: "POST /safety-recommendations/{id}/responses"
        actor: AddresseeContact
        preconditions: ["same as OPEN_AWAITING_RESPONSE -> OPEN_UNCLASSIFIED"]
        side_effects: ["same response_log append; this is the reclassification loop"]
      - from: OPEN_UNCLASSIFIED
        to: OPEN_ACCEPTABLE
        trigger: "POST /safety-recommendations/{id}/classify {classification: ACCEPTABLE}"
        actor: ManagingDirector
        preconditions:
          - "status == OPEN_UNCLASSIFIED (ERR_RECOMMENDATION_STATE_INVALID)"
        side_effects:
          - "the pending response (the unique response_log entry with classification_pending == true) is marked classification ACCEPTABLE, classification_pending false, classified_at = logical clock"
          - "unacceptable_streak reset to 0"
          - "increments SafetyRecommendation.version by 1"
      - from: OPEN_UNCLASSIFIED
        to: OPEN_UNACCEPTABLE
        trigger: "POST /safety-recommendations/{id}/classify {classification: UNACCEPTABLE}"
        actor: ManagingDirector
        preconditions:
          - "status == OPEN_UNCLASSIFIED (ERR_RECOMMENDATION_STATE_INVALID)"
        side_effects:
          - "the pending response is marked classification UNACCEPTABLE, classification_pending false, classified_at = logical clock"
          - "unacceptable_streak recomputed as the count of consecutive UNACCEPTABLE classifications at the tail of response_log"
          - "increments SafetyRecommendation.version by 1"
      - from: OPEN_ACCEPTABLE
        to: CLOSED_ACCEPTABLE
        trigger: "POST /safety-recommendations/{id}/close {outcome: CLOSED_ACCEPTABLE}"
        actor: ManagingDirector
        preconditions: ["status == OPEN_ACCEPTABLE (ERR_RECOMMENDATION_STATE_INVALID)"]
        side_effects: ["increments SafetyRecommendation.version by 1"]
      - from: OPEN_ACCEPTABLE
        to: CLOSED_EXCEEDS
        trigger: "POST /safety-recommendations/{id}/close {outcome: CLOSED_EXCEEDS}"
        actor: ManagingDirector
        preconditions: ["status == OPEN_ACCEPTABLE (ERR_RECOMMENDATION_STATE_INVALID)"]
        side_effects: ["increments SafetyRecommendation.version by 1"]
      - from: OPEN_UNACCEPTABLE
        to: CLOSED_UNACCEPTABLE
        trigger: "POST /safety-recommendations/{id}/close {outcome: CLOSED_UNACCEPTABLE}"
        actor: ManagingDirector
        preconditions:
          - "status == OPEN_UNACCEPTABLE (ERR_RECOMMENDATION_STATE_INVALID)"
          - "unacceptable_streak >= 2 (ERR_UNACCEPTABLE_STREAK_INSUFFICIENT)"
        side_effects: ["increments SafetyRecommendation.version by 1"]

  - entity: BoardMeeting
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: IN_SESSION
        trigger: "system — lazy evaluation when the current logical clock reaches window_start_utc"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_SESSION
        to: COMPLETED
        trigger: "POST /board-meetings/{id}/close"
        actor: BoardAdmin
        preconditions:
          - "effective status == IN_SESSION: current logical clock >= window_start_utc and status not yet COMPLETED (ERR_MEETING_NOT_IN_SESSION)"
          - "the meeting's investigation has phase == BOARD_REVIEW (ERR_INVESTIGATION_PHASE_INVALID) — a meeting can only close into a deliberation that is actually before the board"
        side_effects:
          - "outcome computed per calculations.adoption_outcome (ADOPTED iff adopt_count > reject_count strictly)"
          - "dissenting_member_ids materialized from current member_votes"
          - "CASCADE link 2: on ADOPTED, the Investigation BOARD_REVIEW -> ADOPTED with its declared side effects (docket FINAL, groups DISBANDED); on NOT_ADOPTED, the Investigation BOARD_REVIEW -> ANALYSIS"
          - "CASCADE link 3: on ADOPTED, AccidentCase LAUNCHED -> CLOSED_ADOPTED"
          - "increments BoardMeeting.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; all other apparent conflicts are state
# preconditions declared above and are rejected on sequential replay)
# =============================================================================
concurrency_rules:
  - rule_id: propose-stale-case-version
    parent_entity: AccidentCase
    write_endpoint: "POST /accident-cases/{id}/launch-decisions"
    occ_field: expected_accident_case_version
    description: |
      Proposing a launch decision against an AccidentCase whose version has
      advanced beyond the version the caller last observed is rejected. The
      product semantics legitimately allow a new proposal to supersede an
      existing PROPOSED decision, so a writer holding a stale case version
      would otherwise supersede a proposal it never saw; the OCC check reduces
      this to a deterministic stale-version rejection.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: vote-stale-meeting-version
    parent_entity: BoardMeeting
    write_endpoint: "POST /board-meetings/{id}/votes"
    occ_field: expected_meeting_version
    description: |
      Casting or changing a vote with an expected_meeting_version that does not
      match the meeting's current version is rejected. Vote changes are
      legitimately permitted while the meeting is in session, so a member
      acting on a stale tally view must refresh before voting.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: statutory_launch_score
    trigger: "AccidentCase creation; launch-decision proposal or reconsideration carrying severity overrides"
    algorithm: threshold
    formula: |
      fatality_points = 0 if fatalities_count == 0
                      else 40 + (15 if fatalities_count >= 5 else 0)
      damage_points   = 0  if damage_estimate_cents == 0
                      else 5  if damage_estimate_cents <  1000000
                      else 15 if damage_estimate_cents <  10000000
                      else 25          # damage_estimate_cents >= 10000000
      injury_points   = min(injuries_count, 10)
      public_points   = (20 if is_public_transport else 0)
                      + (10 if category in {AVIATION, RAIL} else 0)
      statutory_score = clamp(fatality_points + damage_points + injury_points + public_points, 0, 100)
      suggested_mode  = FULL_GO_TEAM if statutory_score >= 60
                        else LIMITED if statutory_score >= 20
                        else DECLINED
    input_set: "the AccidentCase's current severity fields"
    constants:
      FATALITY_BASE_POINTS: 40
      CATASTROPHIC_FATALITY_THRESHOLD: 5
      CATASTROPHIC_FATALITY_BONUS: 15
      DAMAGE_TIER_MID_MIN_CENTS: 1000000
      DAMAGE_TIER_HIGH_MIN_CENTS: 10000000
      DAMAGE_POINTS_LOW: 5
      DAMAGE_POINTS_MID: 15
      DAMAGE_POINTS_HIGH: 25
      INJURY_CAP: 10
      PUBLIC_TRANSPORT_POINTS: 20
      MODAL_BUMP_POINTS: 10
      MODAL_BUMP_CATEGORIES: [AVIATION, RAIL]
      SCORE_MAX: 100
      FULL_LAUNCH_THRESHOLD: 60
      LIMITED_LAUNCH_THRESHOLD: 20
    precision: "integer arithmetic; tier lower bounds are inclusive (>=), i.e. exactly 1000000 cents scores 15"
    variants:
      - name: risk_adjusted_launch_score
        when: "stored alongside as AccidentCase.risk_adjusted_score for go-team prioritization reporting; NEVER gates adoption"
        difference: "replaces the flat sum with weighted components, per-component 1-decimal rounding, then summation — see calculations.risk_adjusted_launch_score; identical inputs yield a different number"

  - name: risk_adjusted_launch_score
    trigger: "same instants as statutory_launch_score"
    algorithm: weighted_scoring
    formula: |
      components (each rounded round_half_up to 1 decimal BEFORE summation — this order is pinned):
        c_fatality = round1(fatality_points * 1.0)
        c_damage   = round1(damage_points * CATEGORY_DAMAGE_MULTIPLIER[category])
        c_injury   = round1(injury_points * 1.25)
        c_public   = round1(public_points * 0.5)
      risk_adjusted_score = clamp(c_fatality + c_damage + c_injury + c_public, 0, 100)
      (fatality_points / damage_points / injury_points / public_points are the
      unrounded components of statutory_launch_score computed from the same inputs)
    input_set: "the AccidentCase's current severity fields"
    constants:
      FATALITY_WEIGHT: 1.0
      INJURY_WEIGHT: 1.25
      PUBLIC_INTEREST_WEIGHT: 0.5
      CATEGORY_DAMAGE_MULTIPLIER: { AVIATION: 1.0, RAIL: 1.0, HIGHWAY: 1.0, MARINE: 1.25, PIPELINE: 1.5, HAZMAT: 2.0 }
      SCORE_MAX: 100
    precision: "1 decimal place per component, round_half_up, components rounded BEFORE summation"
    variants:
      - name: statutory_launch_score
        when: "gates launch-mode eligibility at adoption"
        difference: "flat unweighted integer sum with clamp; the gating variant"

  - name: docket_completeness_pct
    trigger: "group completion, group revert (reopen-factual or expulsion cascade), seat suspension or removal on a group, docket release"
    algorithm: aggregation
    formula: |
      Two-pass evaluation, order pinned to defuse the group<->report reference loop:
      pass 1: for each InvestigativeGroup of the investigation, read the group's
              STORED status (never recompute it from reports) and its embedded
              factual_reports:
                satisfied(g) = (g.status == COMPLETE) AND
                               exists r in g.factual_reports with r.status in {VERIFIED, DOCKETED}
      pass 2: total = count of groups with status in {ACTIVE, COMPLETE}
              docket_completeness_pct = 0 if total == 0
                                      else round_half_up(100 * count(satisfied) / total, 0 decimals)
    input_set: "InvestigativeGroups of the investigation with status in {ACTIVE, COMPLETE}; DISBANDED groups excluded"
    constants: {}
    precision: "integer percent, round_half_up"

  - name: recommendation_aging
    trigger: "on every read of a SafetyRecommendation (computed fields)"
    algorithm: chronological
    formula: |
      calendar_elapsed_days = floor((now - issued_at) / 86400 seconds)
      business_elapsed_days = count of days d with issued_at < d <= now (date granularity)
                              whose weekday is Monday..Friday (no holiday calendar)
      overdue   = calendar_elapsed_days > 90 AND status not in {CLOSED_ACCEPTABLE, CLOSED_UNACCEPTABLE, CLOSED_EXCEEDS}
      aging_bucket = GREEN if business_elapsed_days < 60
                     else AMBER if business_elapsed_days <= 89
                     else RED
    input_set: "the SafetyRecommendation's issued_at and the current logical clock"
    constants:
      RESPONSE_WINDOW_DAYS: 90
      AGING_AMBER_MIN_BUSINESS_DAYS: 60
      AGING_RED_MIN_BUSINESS_DAYS: 90
    precision: "whole days; overdue uses a STRICTLY-GREATER comparison (exactly 90 days is not overdue); AMBER lower bound is inclusive"
    variants:
      - name: calendar_variant
        when: "drives the statutory 90-day overdue flag"
        difference: "counts every calendar day including weekends"
      - name: business_day_variant
        when: "drives the aging_bucket triage classification"
        difference: "counts Monday–Friday days only; identical issued_at and now yield a smaller day count than the calendar variant"

  - name: adoption_outcome
    trigger: "POST /board-meetings/{id}/close"
    algorithm: threshold
    formula: |
      adopt_count   = count of member_votes with position ADOPT
      reject_count  = count of member_votes with position REJECT
      abstain_count = count of member_votes with position ABSTAIN
      outcome = ADOPTED if adopt_count > reject_count (strict) else NOT_ADOPTED
      ABSTAIN entries count toward neither side; a tie (adopt_count == reject_count)
      and the zero-vote case both resolve to NOT_ADOPTED.
      dissenting_member_ids = member_user_id of votes with position REJECT, cast_at ascending
    input_set: "BoardMeeting.member_votes at close time (at most one entry per sitting member)"
    constants: {}
    precision: "integer counts; strict > comparison"

  - name: strike_accumulation
    trigger: "POST /party-designations/{id}/seats/{seat_id}/conduct-violations"
    algorithm: threshold
    formula: |
      append {violation_kind, detail, recorded_at = logical clock} to the seat's conduct_log
      strike_count = length(conduct_log)
      if strike_count >= 2 and seat.status == SEATED: seat.status -> SUSPENDED
    input_set: "the addressed embedded GroupSeat"
    constants:
      SUSPENSION_STRIKE_THRESHOLD: 2
    precision: "integer count; threshold is inclusive (>= 2 suspends)"

  - name: seated_count
    trigger: "seat creation, seat suspension, seat removal (expulsion cascade)"
    algorithm: aggregation
    formula: |
      seated_count(group) = count of embedded GroupSeats across ALL PartyDesignations
                            of the same investigation with group_id == group.id
                            and status == SEATED
    input_set: "all PartyDesignations whose investigation_id equals the group's investigation_id"
    constants: {}
    precision: "integer count"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and name a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role must be permitted on the endpoint; ownership-scoped roles must satisfy the ownership rule: IIC actions require X-User-ID == investigation.iic_user_id; GroupChairman actions require X-User-ID == group.chairman_user_id (ERR_CHAIRMAN_OWNERSHIP); AddresseeContact responses require X-User-ID == recommendation.addressee_org_id (ERR_NOT_ADDRESSEE); BoardMember votes require X-User-ID in meeting.sitting_member_ids (ERR_NOT_SITTING_MEMBER); otherwise ERR_INSUFFICIENT_PERMISSIONS"
    error_id: "ERR_INSUFFICIENT_PERMISSIONS / ERR_CHAIRMAN_OWNERSHIP / ERR_NOT_ADDRESSEE / ERR_NOT_SITTING_MEMBER"
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path ids resolve left-to-right (including embedded sub-path ids: decision_id, seat_id, report_id); then request-body foreign keys in the endpoint's declared input order"
    error_id: "ERR_ACCIDENT_CASE_NOT_FOUND / ERR_LAUNCH_DECISION_NOT_FOUND / ERR_INVESTIGATION_NOT_FOUND / ERR_PARTY_ORGANIZATION_NOT_FOUND / ERR_PARTY_DESIGNATION_NOT_FOUND / ERR_GROUP_NOT_FOUND / ERR_SEAT_NOT_FOUND / ERR_FACTUAL_REPORT_NOT_FOUND / ERR_RECORDER_NOT_FOUND / ERR_SAFETY_RECOMMENDATION_NOT_FOUND / ERR_BOARD_MEETING_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path or body references"

  - priority: 4
    category: state
    check: "Target resource(s) must be in the required lifecycle state; within a request, the path-addressed entity is checked before body-referenced entities (e.g. PartyDesignation before InvestigativeGroup on seat creation), and for nested paths the outer resource's state check precedes the inner resource's (AccidentCase before embedded LaunchDecision, InvestigativeGroup before embedded FactualReport, PartyDesignation before embedded GroupSeat)"
    error_id: "ERR_CASE_NOT_SCREENING / ERR_CASE_ALREADY_LAUNCHED / ERR_DECISION_STATE_INVALID / ERR_INVESTIGATION_PHASE_INVALID / ERR_PHASE_GATE_UNSATISFIED / ERR_DOCKET_NOT_OPEN / ERR_DOCKET_STATE_INVALID / ERR_DESIGNATION_NOT_ACTIVE / ERR_GROUP_NOT_ACTIVE / ERR_SEAT_NOT_SEATED / ERR_RECORDER_STATE_INVALID / ERR_REPORT_STATE_INVALID / ERR_RECOMMENDATION_STATE_INVALID / ERR_MEETING_NOT_IN_SESSION / ERR_NO_VOTE_TO_RETRACT"
    http_status: 409
    applies_to: "state transition and state-gated endpoints"

  - priority: 5
    category: business_constraint
    check: "Optimistic concurrency: expected_accident_case_version must equal AccidentCase.version on launch-decision proposals; expected_meeting_version must equal BoardMeeting.version on votes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /accident-cases/{id}/launch-decisions; POST /board-meetings/{id}/votes"

  - priority: 6
    category: business_safety
    check: "Recorder data protection: docket release rejects when any embedded ReadoutSession of the investigation's recorders has window_end_utc strictly after the current logical clock; verification of a RECORDER_TRANSCRIPT report rejects unless the referenced recorder is READOUT_COMPLETE or RELEASED"
    error_id: ERR_RECORDER_READOUT_INCOMPLETE
    http_status: 409
    applies_to: "POST /investigations/{id}/release-docket; POST /groups/{id}/factual-reports/{report_id}/verify"

  - priority: 7
    category: business_constraint
    check: "Domain rules: launch-mode thresholds (ERR_LAUNCH_THRESHOLD_NOT_MET); party-type exclusion for CLAIMANT_COUNSEL and INSURER organizations (ERR_PARTY_TYPE_EXCLUDED); expulsion requires a qualifying PREMATURE_PUBLIC_STATEMENT violation (ERR_EXPULSION_WITHOUT_QUALIFYING_VIOLATION); group completion requires seated_count >= 1 and at least one report with status in {VERIFIED, DOCKETED} (ERR_GROUP_NOT_COMPLETABLE); docket release requires every group COMPLETE with a VERIFIED or DOCKETED report (ERR_DOCKET_INCOMPLETE); duplicate report_number (ERR_DUPLICATE_REPORT_NUMBER); duplicate ACTIVE designation for (investigation_id, organization_id) (ERR_DUPLICATE_DESIGNATION); duplicate SEATED seat for (designation, group) (ERR_DUPLICATE_SEAT); quorum of >= 3 distinct sitting members (ERR_QUORUM_NOT_MET); CLOSED_UNACCEPTABLE requires unacceptable_streak >= 2 (ERR_UNACCEPTABLE_STREAK_INSUFFICIENT)"
    error_id: "ERR_LAUNCH_THRESHOLD_NOT_MET / ERR_PARTY_TYPE_EXCLUDED / ERR_EXPULSION_WITHOUT_QUALIFYING_VIOLATION / ERR_GROUP_NOT_COMPLETABLE / ERR_DOCKET_INCOMPLETE / ERR_DUPLICATE_REPORT_NUMBER / ERR_DUPLICATE_DESIGNATION / ERR_DUPLICATE_SEAT / ERR_QUORUM_NOT_MET / ERR_UNACCEPTABLE_STREAK_INSUFFICIENT"
    http_status: 422
    applies_to: "business-rule endpoints"
    note: "ERR_DUPLICATE_REPORT_NUMBER, ERR_DUPLICATE_DESIGNATION and ERR_DUPLICATE_SEAT return http 409; the remaining constraints return 422"

  - priority: 8
    category: business_temporal
    check: "Window rules: window_end_utc must be strictly after window_start_utc and window_start_utc strictly after the current logical clock (ERR_WINDOW_IN_PAST / ERR_INVALID_REQUEST); readout sessions on the same bench_id are half-open [start, end) and must not overlap another SCHEDULED session on that bench (ERR_BENCH_WINDOW_CONFLICT); board meetings on the same room_id must not overlap any SCHEDULED or IN_SESSION meeting window expanded by a 60-minute post-meeting buffer (ERR_ROOM_WINDOW_CONFLICT)"
    error_id: "ERR_WINDOW_IN_PAST / ERR_BENCH_WINDOW_CONFLICT / ERR_ROOM_WINDOW_CONFLICT"
    http_status: 409
    applies_to: "POST /recorders/{id}/readout-sessions; POST /board-meetings"
    note: "ERR_WINDOW_IN_PAST returns 422; overlap conflicts return 409"

  - priority: 9
    category: business_referential
    check: "Segregation of duties across actors: launch proposer may not adopt their own proposal (ERR_SOD_PROPOSER_CANNOT_ADOPT); group chairman may not be the investigation's IIC (ERR_SOD_IIC_CANNOT_CHAIR); the IIC may not sit on the board meeting for their own investigation (ERR_SOD_IIC_ON_BOARD)"
    error_id: "ERR_SOD_PROPOSER_CANNOT_ADOPT / ERR_SOD_IIC_CANNOT_CHAIR / ERR_SOD_IIC_ON_BOARD"
    http_status: 403
    applies_to: "POST /accident-cases/{id}/launch-decisions/{decision_id}/adopt; POST /groups; POST /board-meetings"

  - priority: 10
    category: business_constraint
    check: "Pagination parameters on list endpoints must satisfy limit in 1..100 and offset >= 0 (defaults limit 10, offset 0 when omitted)"
    error_id: ERR_INVALID_PAGINATION_PARAMETERS
    http_status: 400
    applies_to: "all GET list endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- platform ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: sets the server's logical clock. Before any set_current_utc call the logical clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time. Arbitrary values are accepted (not monotonicity-enforced)."
    roles: [BoardAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["lazy state evaluations keyed on the logical clock (ReadoutSession COMPLETE, RecorderPackage READOUT_COMPLETE, BoardMeeting IN_SESSION) resolve on subsequent reads/writes"]

  # --- AccidentCase ---
  - method: POST
    path: "/accident-cases"
    description: "Register an accident notification; computes statutory_score, risk_adjusted_score, suggested_mode; status SCREENING"
    roles: [DutyOfficer]
    code: 201
    input: [report_number, category, occurred_at, location_state, fatalities_count, injuries_count, damage_estimate_cents, is_public_transport]
    output: AccidentCase
    side_effects: ["compute statutory_launch_score and risk_adjusted_launch_score", "suggested_mode derived from statutory_score"]

  - method: GET
    path: "/accident-cases"
    description: "List accident cases"
    roles: &read_roles [DutyOfficer, ManagingDirector, IIC, GroupChairman, PartyCoordinator, AddresseeContact, RecorderCustodian, DocketOfficer, BoardAdmin, BoardMember]
    code: 200
    input: ["status?", "category?", "limit?", "offset?"]
    output: "AccidentCase[]"
    side_effects: []

  - method: GET
    path: "/accident-cases/{id}"
    description: "Get one accident case including embedded launch_decisions"
    roles: *read_roles
    code: 200
    input: []
    output: AccidentCase
    side_effects: []

  - method: POST
    path: "/accident-cases/{id}/launch-decisions"
    description: "Propose a launch decision (OCC on expected_accident_case_version). Supersedes any existing PROPOSED decision. Optional severity override fields, when present, update the case severity and recompute both scores before the snapshot is taken."
    roles: [ManagingDirector]
    code: 201
    input: [mode, expected_accident_case_version, "rationale?", "fatalities_count?", "injuries_count?", "damage_estimate_cents?", "is_public_transport?"]
    output: AccidentCase
    side_effects:
      - "case must be SCREENING (ERR_CASE_NOT_SCREENING)"
      - "if any severity override present: update severity fields and recompute statutory_score, risk_adjusted_score, suggested_mode"
      - "existing PROPOSED embedded decision -> SUPERSEDED"
      - "append new LaunchDecision {status PROPOSED, proposed_by_user_id = X-User-ID, snapshot_* = current scores}"
      - "increments AccidentCase.version by 1"

  - method: POST
    path: "/accident-cases/{id}/launch-decisions/{decision_id}/adopt"
    description: "Adopt a PROPOSED launch decision; FULL_GO_TEAM adoption creates the Investigation"
    roles: [ManagingDirector]
    code: 200
    input: ["iic_user_id?"]
    output: AccidentCase
    side_effects:
      - "decision PROPOSED -> ADOPTED (guards per state machine: case SCREENING, proposer != adopter, statutory threshold, iic_user_id required iff mode FULL_GO_TEAM)"
      - "AccidentCase transitions per mode; FULL_GO_TEAM creates the Investigation (phase GO_TEAM_ASSEMBLED, docket_status SEALED)"

  - method: POST
    path: "/accident-cases/{id}/launch-decisions/{decision_id}/reconsider"
    description: "Reopen an ADOPTED decision for reconsideration (only while the case is LIMITED_TRACK or DECLINED); applies optional severity overrides and returns the case to SCREENING"
    roles: [ManagingDirector]
    code: 200
    input: ["rationale?", "fatalities_count?", "injuries_count?", "damage_estimate_cents?", "is_public_transport?"]
    output: AccidentCase
    side_effects:
      - "decision ADOPTED -> PROPOSED"
      - "severity overrides applied; scores and suggested_mode recomputed; snapshot_* refreshed"
      - "AccidentCase LIMITED_TRACK/DECLINED -> SCREENING"
      - "increments AccidentCase.version by 1"

  # --- Investigation ---
  - method: GET
    path: "/investigations"
    description: "List investigations (accident_case_id filter returns an array of length 0 or 1 — investigations are cascade-created by FULL_GO_TEAM adoption)"
    roles: *read_roles
    code: 200
    input: ["accident_case_id?", "phase?", "limit?", "offset?"]
    output: "Investigation[]"
    side_effects: []

  - method: GET
    path: "/investigations/{id}"
    description: "Get one investigation"
    roles: *read_roles
    code: 200
    input: []
    output: Investigation
    side_effects: []

  - method: POST
    path: "/investigations/{id}/advance-phase"
    description: "Advance the investigation phase along the declared order (GO_TEAM_ASSEMBLED -> ON_SCENE -> FACTUAL -> ANALYSIS -> BOARD_REVIEW); gates per state machine"
    roles: [IIC]
    code: 200
    input: [to_phase]
    output: Investigation
    side_effects: ["phase transition per state machine", "increments Investigation.version by 1"]

  - method: POST
    path: "/investigations/{id}/reopen-factual"
    description: "Revert ANALYSIS -> FACTUAL; every COMPLETE group reverts to ACTIVE; docket stays OPEN"
    roles: [IIC]
    code: 200
    input: []
    output: Investigation
    side_effects: ["COMPLETE groups -> ACTIVE", "recompute docket_completeness_pct", "increments Investigation.version by 1"]

  - method: POST
    path: "/investigations/{id}/release-docket"
    description: "Release the public docket (SEALED -> OPEN): publishes VERIFIED factual reports as DOCKETED and releases completed recorder readouts; blocked by incomplete recorder readouts (safety) and by incomplete groups (constraint)"
    roles: [DocketOfficer]
    code: 200
    input: []
    output: Investigation
    side_effects: ["VERIFIED reports -> DOCKETED", "READOUT_COMPLETE recorders -> RELEASED", "docket_status -> OPEN", "recompute docket_completeness_pct", "increments Investigation.version by 1"]

  # --- PartyOrganization ---
  - method: POST
    path: "/party-organizations"
    description: "Register a party organization (operator, manufacturer, union, regulator, industry, claimant counsel, insurer)"
    roles: [PartyCoordinator]
    code: 201
    input: [legal_name, org_type]
    output: PartyOrganization
    side_effects: []

  - method: GET
    path: "/party-organizations/{id}"
    description: "Get one party organization"
    roles: *read_roles
    code: 200
    input: []
    output: PartyOrganization
    side_effects: []

  # --- PartyDesignation ---
  - method: POST
    path: "/party-designations"
    description: "Designate an organization as a party to an investigation; organizations of type CLAIMANT_COUNSEL or INSURER are excluded"
    roles: [PartyCoordinator]
    code: 201
    input: [investigation_id, organization_id]
    output: PartyDesignation
    side_effects: ["status ACTIVE", "designated_at = logical clock"]

  - method: GET
    path: "/party-designations"
    description: "List party designations (reverse lookup for both foreign keys)"
    roles: *read_roles
    code: 200
    input: ["investigation_id?", "organization_id?", "status?", "limit?", "offset?"]
    output: "PartyDesignation[]"
    side_effects: []

  - method: GET
    path: "/party-designations/{id}"
    description: "Get one party designation including embedded group_seats"
    roles: *read_roles
    code: 200
    input: []
    output: PartyDesignation
    side_effects: []

  - method: POST
    path: "/party-designations/{id}/expel"
    description: "Expel a party for premature public statements; cascades seat removals, group reverts, and docket completeness recomputation"
    roles: [ManagingDirector]
    code: 200
    input: ["reason?"]
    output: PartyDesignation
    side_effects: ["designation ACTIVE -> EXPELLED with the declared cascade", "increments PartyDesignation.version by 1"]

  - method: POST
    path: "/party-designations/{id}/seats"
    description: "Seat the designated party on an investigative group"
    roles: [IIC]
    code: 201
    input: [group_id]
    output: PartyDesignation
    side_effects: ["append embedded GroupSeat {status SEATED, strike_count 0, conduct_log []}", "recompute seated_count on the group", "increments PartyDesignation.version by 1"]

  - method: POST
    path: "/party-designations/{id}/seats/{seat_id}/conduct-violations"
    description: "Record a party-participant conduct violation; the second strike auto-suspends the seat"
    roles: [IIC]
    code: 201
    input: [violation_kind, detail]
    output: PartyDesignation
    side_effects: ["append to the seat's conduct_log", "strike_count recomputed", "seat SEATED -> SUSPENDED at strike_count >= 2", "recompute seated_count on the group", "increments PartyDesignation.version by 1"]

  # --- InvestigativeGroup ---
  - method: POST
    path: "/groups"
    description: "Form an investigative group (operations, structures, human performance, recorders); chairman must not be the investigation's IIC"
    roles: [IIC]
    code: 201
    input: [investigation_id, specialty, chairman_user_id]
    output: InvestigativeGroup
    side_effects: ["status ACTIVE", "seated_count 0", "factual_reports []"]

  - method: GET
    path: "/groups"
    description: "List investigative groups"
    roles: *read_roles
    code: 200
    input: ["investigation_id?", "specialty?", "status?", "limit?", "offset?"]
    output: "InvestigativeGroup[]"
    side_effects: []

  - method: GET
    path: "/groups/{id}"
    description: "Get one investigative group including embedded factual_reports"
    roles: *read_roles
    code: 200
    input: []
    output: InvestigativeGroup
    side_effects: []

  - method: POST
    path: "/groups/{id}/complete"
    description: "Mark a group COMPLETE; requires the chairman, FACTUAL phase, at least one SEATED seat, and at least one VERIFIED factual report"
    roles: [GroupChairman]
    code: 200
    input: []
    output: InvestigativeGroup
    side_effects: ["status ACTIVE -> COMPLETE", "recompute docket_completeness_pct", "increments InvestigativeGroup.version by 1"]

  - method: POST
    path: "/groups/{id}/factual-reports"
    description: "Author a factual report (SUBMITTED) on an ACTIVE group during ON_SCENE or FACTUAL phase; recorder_id required iff report_kind == RECORDER_TRANSCRIPT"
    roles: [GroupChairman]
    code: 201
    input: [report_kind, content, "recorder_id?"]
    output: InvestigativeGroup
    side_effects: ["append embedded FactualReport {status SUBMITTED, submitted_by_user_id = X-User-ID, submitted_at = logical clock}", "increments InvestigativeGroup.version by 1"]

  - method: POST
    path: "/groups/{id}/factual-reports/{report_id}/verify"
    description: "IIC verifies a SUBMITTED factual report; RECORDER_TRANSCRIPT reports additionally require the recorder's readout to be complete"
    roles: [IIC]
    code: 200
    input: []
    output: InvestigativeGroup
    side_effects: ["report SUBMITTED -> VERIFIED", "increments InvestigativeGroup.version by 1"]

  # --- RecorderPackage ---
  - method: POST
    path: "/recorders"
    description: "Register a recovered recorder package (CVR/FDR/other) for an investigation"
    roles: [RecorderCustodian]
    code: 201
    input: [investigation_id, recorder_type, condition]
    output: RecorderPackage
    side_effects: ["status SECURED", "readout_sessions []"]

  - method: GET
    path: "/recorders"
    description: "List recorder packages"
    roles: *read_roles
    code: 200
    input: ["investigation_id?", "status?", "limit?", "offset?"]
    output: "RecorderPackage[]"
    side_effects: []

  - method: GET
    path: "/recorders/{id}"
    description: "Get one recorder package including embedded readout_sessions (lazy session/status evaluation applies)"
    roles: *read_roles
    code: 200
    input: []
    output: RecorderPackage
    side_effects: []

  - method: POST
    path: "/recorders/{id}/readout-sessions"
    description: "Schedule a readout session on a lab bench; half-open windows on the same bench must not overlap"
    roles: [RecorderCustodian]
    code: 201
    input: [bench_id, window_start_utc, window_end_utc]
    output: RecorderPackage
    side_effects: ["append embedded ReadoutSession {status SCHEDULED}", "recorder SECURED -> IN_READOUT on first session", "increments RecorderPackage.version by 1"]

  # --- SafetyRecommendation ---
  - method: POST
    path: "/safety-recommendations"
    description: "Issue a safety recommendation to a regulator or industry organization during ANALYSIS or BOARD_REVIEW"
    roles: [IIC]
    code: 201
    input: [investigation_id, addressee_org_id, recommendation_text]
    output: SafetyRecommendation
    side_effects: ["status OPEN_AWAITING_RESPONSE", "issued_at = logical clock", "response_log []", "unacceptable_streak 0"]

  - method: GET
    path: "/safety-recommendations"
    description: "List safety recommendations (reverse lookup for both foreign keys); computed aging fields resolved at read"
    roles: *read_roles
    code: 200
    input: ["investigation_id?", "addressee_org_id?", "status?", "limit?", "offset?"]
    output: "SafetyRecommendation[]"
    side_effects: []

  - method: GET
    path: "/safety-recommendations/{id}"
    description: "Get one safety recommendation; computed aging fields resolved at read"
    roles: *read_roles
    code: 200
    input: []
    output: SafetyRecommendation
    side_effects: []

  - method: POST
    path: "/safety-recommendations/{id}/responses"
    description: "Addressee organization submits a response; moves the recommendation to OPEN_UNCLASSIFIED (the reclassification loop)"
    roles: [AddresseeContact]
    code: 201
    input: [response_text]
    output: SafetyRecommendation
    side_effects: ["append response to response_log with classification_pending true", "status -> OPEN_UNCLASSIFIED", "increments SafetyRecommendation.version by 1"]

  - method: POST
    path: "/safety-recommendations/{id}/classify"
    description: "Classify the pending response ACCEPTABLE or UNACCEPTABLE"
    roles: [ManagingDirector]
    code: 200
    input: [classification]
    output: SafetyRecommendation
    side_effects: ["pending response classified", "status -> OPEN_ACCEPTABLE or OPEN_UNACCEPTABLE", "unacceptable_streak recomputed", "increments SafetyRecommendation.version by 1"]

  - method: POST
    path: "/safety-recommendations/{id}/close"
    description: "Close a recommendation: CLOSED_ACCEPTABLE or CLOSED_EXCEEDS from OPEN_ACCEPTABLE; CLOSED_UNACCEPTABLE from OPEN_UNACCEPTABLE with unacceptable_streak >= 2"
    roles: [ManagingDirector]
    code: 200
    input: [outcome]
    output: SafetyRecommendation
    side_effects: ["status -> closed outcome", "increments SafetyRecommendation.version by 1"]

  # --- BoardMeeting ---
  - method: POST
    path: "/board-meetings"
    description: "Schedule a board meeting for probable-cause deliberation; quorum >= 3 sitting members; the investigation's IIC may not sit; same-room windows require a 60-minute turnaround buffer"
    roles: [BoardAdmin]
    code: 201
    input: [investigation_id, room_id, window_start_utc, window_end_utc, sitting_member_ids]
    output: BoardMeeting
    side_effects: ["status SCHEDULED", "member_votes []", "tallies 0", "outcome null"]

  - method: GET
    path: "/board-meetings"
    description: "List board meetings"
    roles: *read_roles
    code: 200
    input: ["investigation_id?", "status?", "limit?", "offset?"]
    output: "BoardMeeting[]"
    side_effects: []

  - method: GET
    path: "/board-meetings/{id}"
    description: "Get one board meeting including member_votes and tallies (lazy IN_SESSION evaluation applies)"
    roles: *read_roles
    code: 200
    input: []
    output: BoardMeeting
    side_effects: []

  - method: POST
    path: "/board-meetings/{id}/votes"
    description: "Cast, change, or retract the caller's vote while the meeting is in session (OCC on expected_meeting_version); position RETRACT removes the caller's existing vote"
    roles: [BoardMember]
    code: 200
    input: [position, expected_meeting_version, "dissent_text?"]
    output: BoardMeeting
    side_effects:
      - "upsert or remove the caller's member_votes entry; dissent_text permitted only with position REJECT (ERR_INVALID_REQUEST)"
      - "RETRACT with no existing vote is rejected (ERR_NO_VOTE_TO_RETRACT)"
      - "recompute adopt_count, reject_count, abstain_count"
      - "increments BoardMeeting.version by 1"

  - method: POST
    path: "/board-meetings/{id}/close"
    description: "Close an in-session meeting; computes the adoption outcome and cascades to the investigation (ADOPTED -> phase ADOPTED with docket FINAL and groups DISBANDED, then case CLOSED_ADOPTED; NOT_ADOPTED -> phase back to ANALYSIS)"
    roles: [BoardAdmin]
    code: 200
    input: []
    output: BoardMeeting
    side_effects: ["status IN_SESSION -> COMPLETED", "outcome and dissenting_member_ids computed", "investigation and accident-case cascade per state machine", "increments BoardMeeting.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth / envelope ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not declared" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted on the endpoint, or IIC-scope rule violated (X-User-ID != investigation.iic_user_id on IIC actions)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, enum value outside the declared set, conditional-field rule violated (iic_user_id required iff mode FULL_GO_TEAM; recorder_id required iff report_kind RECORDER_TRANSCRIPT and absent otherwise; dissent_text only with REJECT), or numeric range violated" }
  - { id: ERR_INVALID_PAGINATION_PARAMETERS, http: 400, condition: "limit outside 1..100 or offset negative" }

  # --- existence ---
  - { id: ERR_ACCIDENT_CASE_NOT_FOUND, http: 404, condition: "accident case id does not exist" }
  - { id: ERR_LAUNCH_DECISION_NOT_FOUND, http: 404, condition: "decision_id not found within the addressed case's launch_decisions" }
  - { id: ERR_INVESTIGATION_NOT_FOUND, http: 404, condition: "investigation id does not exist" }
  - { id: ERR_PARTY_ORGANIZATION_NOT_FOUND, http: 404, condition: "party organization id does not exist" }
  - { id: ERR_PARTY_DESIGNATION_NOT_FOUND, http: 404, condition: "party designation id does not exist" }
  - { id: ERR_GROUP_NOT_FOUND, http: 404, condition: "investigative group id does not exist" }
  - { id: ERR_SEAT_NOT_FOUND, http: 404, condition: "seat_id not found within the addressed designation's group_seats" }
  - { id: ERR_FACTUAL_REPORT_NOT_FOUND, http: 404, condition: "report_id not found within the addressed group's factual_reports" }
  - { id: ERR_RECORDER_NOT_FOUND, http: 404, condition: "recorder package id does not exist" }
  - { id: ERR_SAFETY_RECOMMENDATION_NOT_FOUND, http: 404, condition: "safety recommendation id does not exist" }
  - { id: ERR_BOARD_MEETING_NOT_FOUND, http: 404, condition: "board meeting id does not exist" }

  # --- state ---
  - { id: ERR_CASE_NOT_SCREENING, http: 409, condition: "operation requires AccidentCase.status == SCREENING" }
  - { id: ERR_CASE_ALREADY_LAUNCHED, http: 409, condition: "reconsideration blocked because the case is LAUNCHED or CLOSED_ADOPTED" }
  - { id: ERR_DECISION_STATE_INVALID, http: 409, condition: "adopt requires PROPOSED; reconsider requires ADOPTED" }
  - { id: ERR_INVESTIGATION_PHASE_INVALID, http: 409, condition: "phase hop not in the declared order, or operation not permitted in the current phase" }
  - { id: ERR_PHASE_GATE_UNSATISFIED, http: 409, condition: "phase-advance gate unmet (no ACTIVE group; an ACTIVE group without a SEATED seat; groups not all COMPLETE; no SCHEDULED board meeting)" }
  - { id: ERR_DOCKET_NOT_OPEN, http: 409, condition: "FACTUAL -> ANALYSIS advance requires docket_status == OPEN" }
  - { id: ERR_DOCKET_STATE_INVALID, http: 409, condition: "release-docket requires docket_status == SEALED" }
  - { id: ERR_DESIGNATION_NOT_ACTIVE, http: 409, condition: "operation requires PartyDesignation.status == ACTIVE" }
  - { id: ERR_GROUP_NOT_ACTIVE, http: 409, condition: "operation requires InvestigativeGroup.status == ACTIVE" }
  - { id: ERR_SEAT_NOT_SEATED, http: 409, condition: "conduct-violation recording requires seat status == SEATED" }
  - { id: ERR_RECORDER_STATE_INVALID, http: 409, condition: "readout-session scheduling requires recorder status SECURED or IN_READOUT" }
  - { id: ERR_REPORT_STATE_INVALID, http: 409, condition: "verify requires report status == SUBMITTED" }
  - { id: ERR_RECOMMENDATION_STATE_INVALID, http: 409, condition: "classify requires OPEN_UNCLASSIFIED; close requires the matching OPEN_* state; responses on a CLOSED recommendation or while a previous response still awaits classification (OPEN_UNCLASSIFIED) are rejected" }
  - { id: ERR_MEETING_NOT_IN_SESSION, http: 409, condition: "votes and close require the meeting's effective status to be IN_SESSION (logical clock >= window_start_utc, not yet COMPLETED)" }
  - { id: ERR_NO_VOTE_TO_RETRACT, http: 409, condition: "position RETRACT without an existing vote from the caller" }

  # --- optimistic concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version" }

  # --- business safety ---
  - { id: ERR_RECORDER_READOUT_INCOMPLETE, http: 409, condition: "docket release blocked by a readout session whose window_end_utc is still in the future, or RECORDER_TRANSCRIPT verification blocked because the recorder's readout is not complete" }

  # --- business constraint ---
  - { id: ERR_LAUNCH_THRESHOLD_NOT_MET, http: 422, condition: "adopting FULL_GO_TEAM requires statutory_score >= 60; adopting LIMITED requires >= 20" }
  - { id: ERR_PARTY_TYPE_EXCLUDED, http: 422, condition: "organizations of type CLAIMANT_COUNSEL or INSURER may not be designated as parties" }
  - { id: ERR_EXPULSION_WITHOUT_QUALIFYING_VIOLATION, http: 422, condition: "expulsion requires at least one PREMATURE_PUBLIC_STATEMENT conduct violation on the designation's seats" }
  - { id: ERR_GROUP_NOT_COMPLETABLE, http: 422, condition: "group completion requires seated_count >= 1 and at least one factual report with status in {VERIFIED, DOCKETED}" }
  - { id: ERR_DOCKET_INCOMPLETE, http: 422, condition: "docket release requires every group COMPLETE, each holding a VERIFIED or DOCKETED report" }
  - { id: ERR_DUPLICATE_REPORT_NUMBER, http: 409, condition: "an AccidentCase with the same report_number already exists" }
  - { id: ERR_DUPLICATE_DESIGNATION, http: 409, condition: "an ACTIVE designation already exists for (investigation_id, organization_id)" }
  - { id: ERR_DUPLICATE_SEAT, http: 409, condition: "the designation already holds a SEATED seat on this group" }
  - { id: ERR_QUORUM_NOT_MET, http: 422, condition: "sitting_member_ids must contain at least 3 distinct members" }
  - { id: ERR_UNACCEPTABLE_STREAK_INSUFFICIENT, http: 422, condition: "CLOSED_UNACCEPTABLE requires unacceptable_streak >= 2" }

  # --- business temporal ---
  - { id: ERR_WINDOW_IN_PAST, http: 422, condition: "window_start_utc is not strictly after the current logical clock" }
  - { id: ERR_BENCH_WINDOW_CONFLICT, http: 409, condition: "half-open session window on the same bench_id overlaps another SCHEDULED session; touching endpoints (start == other end) are allowed" }
  - { id: ERR_ROOM_WINDOW_CONFLICT, http: 409, condition: "meeting window on the same room_id overlaps another SCHEDULED/IN_SESSION meeting window expanded by a 60-minute post-meeting buffer" }

  # --- segregation of duties / ownership ---
  - { id: ERR_SOD_PROPOSER_CANNOT_ADOPT, http: 403, condition: "the ManagingDirector who proposed a launch decision may not adopt it" }
  - { id: ERR_SOD_IIC_CANNOT_CHAIR, http: 403, condition: "group chairman_user_id equals the investigation's iic_user_id" }
  - { id: ERR_SOD_IIC_ON_BOARD, http: 403, condition: "sitting_member_ids contains the investigation's iic_user_id" }
  - { id: ERR_NOT_ADDRESSEE, http: 403, condition: "response submitted by an X-User-ID other than the recommendation's addressee_org_id" }
  - { id: ERR_NOT_SITTING_MEMBER, http: 403, condition: "vote cast by an X-User-ID not in sitting_member_ids" }
  - { id: ERR_CHAIRMAN_OWNERSHIP, http: 403, condition: "GroupChairman action by an X-User-ID other than the group's chairman_user_id" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: DutyOfficer
    description: "Receives accident notifications and registers accident cases"
    identity: opaque
    exclusive_operations:
      - "POST /accident-cases"
    shared_operations: ["read endpoints"]

  - name: ManagingDirector
    description: "Decides launch disposition (propose/adopt/reconsider), expels parties, classifies and closes safety recommendations"
    identity: opaque
    exclusive_operations:
      - "POST /accident-cases/{id}/launch-decisions"
      - "POST /accident-cases/{id}/launch-decisions/{decision_id}/adopt"
      - "POST /accident-cases/{id}/launch-decisions/{decision_id}/reconsider"
      - "POST /party-designations/{id}/expel"
      - "POST /safety-recommendations/{id}/classify"
      - "POST /safety-recommendations/{id}/close"
    shared_operations: ["read endpoints"]

  - name: IIC
    description: "Investigator-in-charge of one investigation; scoped by X-User-ID == investigation.iic_user_id. Forms groups, seats parties, records conduct violations, verifies factual reports, issues recommendations, advances or reopens phases"
    identity: opaque
    exclusive_operations:
      - "POST /groups"
      - "POST /party-designations/{id}/seats"
      - "POST /party-designations/{id}/seats/{seat_id}/conduct-violations"
      - "POST /groups/{id}/factual-reports/{report_id}/verify"
      - "POST /safety-recommendations"
      - "POST /investigations/{id}/advance-phase"
      - "POST /investigations/{id}/reopen-factual"
    shared_operations: ["read endpoints"]

  - name: GroupChairman
    description: "Chairs one investigative group; scoped by X-User-ID == group.chairman_user_id. Authors factual reports and marks the group complete"
    identity: opaque
    exclusive_operations:
      - "POST /groups/{id}/factual-reports"
      - "POST /groups/{id}/complete"
    shared_operations: ["read endpoints"]

  - name: PartyCoordinator
    description: "Registers party organizations and designates parties to investigations (excluding litigants and insurers)"
    identity: opaque
    exclusive_operations:
      - "POST /party-organizations"
      - "POST /party-designations"
    shared_operations: ["read endpoints"]

  - name: AddresseeContact
    description: "Contact for an organization that received a safety recommendation; X-User-ID equals the PartyOrganization id and must match recommendation.addressee_org_id when responding"
    identity: "entity_backed:PartyOrganization"
    exclusive_operations:
      - "POST /safety-recommendations/{id}/responses"
    shared_operations: ["read endpoints"]

  - name: RecorderCustodian
    description: "Custodian of recovered recorders; registers packages and schedules lab-bench readout sessions under data-protection rules"
    identity: opaque
    exclusive_operations:
      - "POST /recorders"
      - "POST /recorders/{id}/readout-sessions"
    shared_operations: ["read endpoints"]

  - name: DocketOfficer
    description: "Public docket officer; releases the factual record to the public docket, a step deliberately separate from analysis"
    identity: opaque
    exclusive_operations:
      - "POST /investigations/{id}/release-docket"
    shared_operations: ["read endpoints"]

  - name: BoardAdmin
    description: "Board operations administrator; sets the logical clock, schedules and closes board meetings"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /board-meetings"
      - "POST /board-meetings/{id}/close"
    shared_operations: ["read endpoints"]

  - name: BoardMember
    description: "Sitting board member; casts, changes, or retracts a vote (with optional dissent) while a meeting is in session; X-User-ID must appear in sitting_member_ids"
    identity: opaque
    exclusive_operations:
      - "POST /board-meetings/{id}/votes"
    shared_operations: ["read endpoints"]
