            - "Candidate.${cand_q_id}.status == \"SLATE_ELIGIBLE\" (unchanged) and NominationSlate.${slate_id}.nominee_count == 1"
            - "A further POST /governance/external-directorships for candidate Q on a fifth public company is itself rejected with ERR_OVERBOARDING_LIMIT_EXCEEDED (4 + 1 == 5), which is why 4 is the largest reachable board count"

      - name: empty_set_denominator_boundaries_gap_index_and_slate_independence_pct
        grounds:
          - calculations.skills_gap_analysis
          - calculations.slate_independence_pct
          - validations.priority_65.ERR_INDEPENDENCE_SHORTFALL
          - endpoints.GET_/governance/skills-matrix/gap-analysis
          - entities.NominationSlate.fields.independent_nominee_pct
        distinguishing_aspect: |
          Both aggregates are exercised with an empty denominator before any rows exist: zero SkillCategory
          rows must yield board_gap_index 0.00 with priority_category_code null (not a division error and not
          an arbitrary first code), and a slate with zero nominees must yield independent_nominee_pct 0.00
          with independence_shortfall false while still being blocked from review by the nominee_count >= 1
          precondition. Adding a single category with zero seated directors then pins the maximum-gap edge,
          where the coverage count is 0 and the full required_min_directors becomes the gap.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026 only. No Director rows, no SkillCategory rows, no candidates."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
          trigger:
            - call: "GET /governance/skills-matrix/gap-analysis"
              payload: {}
              as: GovernanceStaff
              captures: { index_empty: $.data.board_gap_index }
            - call: "POST /governance/skill-categories"
              payload: { code: "CYBER_RISK", name: "Cybersecurity Risk Oversight", strategic_weight: 0.75, required_min_directors: 2, risk_oversight: true, criticality: "CORE" }
              as: GovernanceStaff
              captures: { cat_id: $.data.id }
            - call: "GET /governance/skills-matrix/gap-analysis"
              payload: { variant: "VALIDATED_ONLY" }
              as: GovernanceStaff
              captures: { index_one_cat: $.data.board_gap_index }
            - call: "POST /governance/slates"
              payload: { cycle_year: 2026, seat_count: 9 }
              as: CorporateSecretary
              captures: { slate_id: $.data.id }
            - call: "POST /governance/slates/${slate_id}/submit-for-review"
              payload: {}
              as: GovernanceStaff
              captures: { empty_slate_error_id: $.data.error_id }
          assert:
            - "The first gap-analysis call returns variant \"SELF_REPORTED\", seated_director_count == 0, category_count == 0, board_gap_index == 0.00, priority_category_code == null, categories == []"
            - "The second gap-analysis call returns seated_director_count == 0, category_count == 1, board_gap_index == 2.25 (gap 2 * strategic_weight 0.75 * risk multiplier 1.5)"
            - "That category row reports covered_director_count 0, gap 2, weighted_gap 2.25, severity \"CRITICAL_GAP\", and priority_category_code == \"CYBER_RISK\""
            - "Immediately after creation, NominationSlate.${slate_id}.nominee_count == 0, independent_nominee_count == 0, independent_nominee_pct == 0.00, independence_shortfall == false, committed_search_fee_cents == 0"
            - "The submit-for-review call returns HTTP 422 with error_id == \"ERR_INDEPENDENCE_SHORTFALL\" (blocked by the nominee_count >= 1 leg, not by the 66.67 floor)"
            - "NominationSlate.${slate_id}.status is still \"DRAFT\""

  - rule_id: cross_entity_state_dependency
    instances:
      - name: seating_a_director_requires_every_required_onboarding_item_complete
        grounds:
          - validations.priority_45.ERR_ONBOARDING_INCOMPLETE
          - state_machines.Director.ONBOARDING_to_SEATED
          - state_machines.OnboardingItem.PENDING_to_COMPLETED
          - calculations.director_onboarding_rollup
          - entities.Director.fields.onboarding_completion_pct
        distinguishing_aspect: |
          The legality of an operation on Director depends entirely on the state of a different entity's rows:
          POST /governance/directors/{id}/seat is rejected while any required OnboardingItem is still PENDING,
          and the very same call succeeds once the last required item flips to COMPLETED. Nothing about the
          Director row itself changes between the two attempts.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026."
            - "One Director in service_status ONBOARDING with no outside boards, so compliance is COMPLIANT."
            - "Two required OnboardingItem rows (BUSINESS_ORIENTATION and COMMITTEE_ONBOARDING) plus one optional CONTINUING_EDUCATION item that must not affect the gate."
            - "The first required item is completed, leaving the rollup at IN_PROGRESS."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Owen Onboard", email: "owen@issuer.example", birth_date: "1974-09-09", appointed_on: "2026-07-01" }
              as: CorporateSecretary
              captures: { dir_id: $.data.id }
            - call: "POST /governance/directors/${dir_id}/onboarding-items"
              payload: { module_code: "BUSINESS_ORIENTATION_101", category: "BUSINESS_ORIENTATION", is_required: true, credit_hours: 2.0, due_on: "2026-09-30" }
              as: GovernanceStaff
              captures: { item1_id: $.data.id }
            - call: "POST /governance/directors/${dir_id}/onboarding-items"
              payload: { module_code: "AUDIT_COMMITTEE_ONBOARDING", category: "COMMITTEE_ONBOARDING", is_required: true, credit_hours: 2.0, due_on: "2026-09-30" }
              as: GovernanceStaff
              captures: { item2_id: $.data.id }
            - call: "POST /governance/directors/${dir_id}/onboarding-items"
              payload: { module_code: "ESG_ELECTIVE", category: "CONTINUING_EDUCATION", is_required: false, credit_hours: 4.0, due_on: "2026-12-31" }
              as: GovernanceStaff
              captures: { item3_id: $.data.id }
            - call: "POST /governance/onboarding-items/${item1_id}/complete"
              payload: {}
              as: GovernanceStaff
          trigger:
            - call: "POST /governance/directors/${dir_id}/seat"
              payload: {}
              as: CorporateSecretary
              captures: { seat_error_id: $.data.error_id }
            - call: "POST /governance/onboarding-items/${item2_id}/complete"
              payload: {}
              as: GovernanceStaff
            - call: "POST /governance/directors/${dir_id}/seat"
              payload: {}
              as: CorporateSecretary
          assert:
            - "Before the first seat attempt: Director.${dir_id}.onboarding_status == \"IN_PROGRESS\" and onboarding_completion_pct == 50.00 (the optional item is excluded from both numerator and denominator)"
            - "The first seat call returns HTTP 409 with error_id == \"ERR_ONBOARDING_INCOMPLETE\""
            - "After the rejected call Director.${dir_id}.service_status is still \"ONBOARDING\" and onboarding_completion_pct is still 50.00"
            - "After completing item2: onboarding_status == \"COMPLETE\", onboarding_completion_pct == 100.00, while OnboardingItem.${item3_id}.status is still \"PENDING\""
            - "The second seat call returns HTTP 200 and Director.${dir_id}.service_status == \"SEATED\""

      - name: incumbent_renomination_requires_a_seated_director_not_a_resigned_one
        grounds:
          - validations.priority_45.ERR_DIRECTOR_NOT_SEATABLE
          - state_machines.Director.SEATED_to_RESIGNED
          - state_machines.SlateNominee.initial_state_PROPOSED
          - entities.SlateNominee.fields.incumbent_director_id
        distinguishing_aspect: |
          Whether a SlateNominee row may be created depends on the service_status of the referenced Director,
          a different entity entirely: a RESIGNED incumbent is rejected with a 409 while a SEATED incumbent on
          the identical slate and ballot_order succeeds. The slate itself is in the same state for both calls,
          so only the cross-entity dependency can explain the difference.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026."
            - "Director R, seated then given a RESIGNATION departure notice, so service_status is RESIGNED."
            - "Director S, still SEATED, appointed 2021-01-01 and born 1968-04-04, so neither the tenure nor the retirement guideline blocks renomination."
            - "A DRAFT NominationSlate for cycle 2026 with seat_count 9 and no nominees."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Rhea Resigned", email: "rhea@issuer.example", birth_date: "1969-01-01", appointed_on: "2021-06-01", initial_service_status: "SEATED", is_independent: true }
              as: CorporateSecretary
              captures: { dir_r_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Sana Seated", email: "sana@issuer.example", birth_date: "1968-04-04", appointed_on: "2021-01-01", initial_service_status: "SEATED", is_independent: true }
              as: CorporateSecretary
              captures: { dir_s_id: $.data.id }
            - call: "POST /governance/directors/${dir_r_id}/departure-notice"
              payload: { notice_type: "RESIGNATION", effective_on: "2026-07-15" }
              as: CorporateSecretary
            - call: "POST /governance/slates"
              payload: { cycle_year: 2026, seat_count: 9 }
              as: CorporateSecretary
              captures: { slate_id: $.data.id, slate_v1: $.data.version }
          trigger:
            - call: "POST /governance/slates/${slate_id}/nominees"
              payload: { ballot_order: 1, incumbent_director_id: "${dir_r_id}", expected_slate_version: "${slate_v1}" }
              as: GovernanceStaff
              captures: { not_seatable_error_id: $.data.error_id }
            - call: "POST /governance/slates/${slate_id}/nominees"
              payload: { ballot_order: 1, incumbent_director_id: "${dir_s_id}", expected_slate_version: "${slate_v1}" }
              as: GovernanceStaff
              captures: { nom_s_id: $.data.id }
          assert:
            - "Director.${dir_r_id}.service_status == \"RESIGNED\" and Director.${dir_s_id}.service_status == \"SEATED\""
            - "The first trigger call returns HTTP 409 with error_id == \"ERR_DIRECTOR_NOT_SEATABLE\""
            - "After the rejected call NominationSlate.${slate_id}.nominee_count == 0 and version is still ${slate_v1}"
            - "The second trigger call returns HTTP 201 with SlateNominee.${nom_s_id}.status == \"PROPOSED\", is_independent == true, placement_fee_cents == 0 (no search firm)"
            - "NominationSlate.${slate_id}.nominee_count == 1, independent_nominee_count == 1, independent_nominee_pct == 100.00, independence_shortfall == false"
            - "The second call consumed the same expected_slate_version ${slate_v1}, proving the rejected call left the version untouched"

  - rule_id: resource_temporal_overlap
    instances:
      - name: interviewer_calendar_half_open_adjacency_allowed_but_overlap_rejected
        grounds:
          - validations.priority_62.ERR_INTERVIEWER_DOUBLE_BOOKED
          - entities.InterviewSession.fields.start_at
          - entities.InterviewSession.fields.end_at
          - endpoints.POST_/governance/interviews
