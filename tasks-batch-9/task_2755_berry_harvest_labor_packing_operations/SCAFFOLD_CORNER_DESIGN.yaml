              as: HarvestManager
              as_user_id: "hm-1"
              captures: { crew_r: $.data.id }
            - call: "POST /berry-ops/pickers"
              payload: { crew_id: "${crew_r}", full_name: "Picker V17 R", hygiene_training_on: "2026-06-01" }
              as: CrewSupervisor
              as_user_id: "sup-1"
            - call: "POST /berry-ops/crews/${crew_r}/support-plan"
              payload: { housing_unit_code: "H-V17R", beds_confirmed: 1, transport_route_code: "R-V17R", vehicle_seats: 1 }
              as: HarvestManager
              as_user_id: "hm-1"
            - call: "POST /berry-ops/crews/${crew_r}/certify"
              payload: {}
              as: HarvestManager
              as_user_id: "hm-1"
            - call: "POST /berry-ops/crews/${crew_r}/release"
              payload: {}
              as: HarvestManager
              as_user_id: "hm-1"
            - call: "POST /berry-ops/crews"
              payload: { name: "CREW-V17-C", labor_program: "DOMESTIC", supervisor_user_id: "sup-2", planned_head_count: 1, contract_start_date: "2026-07-01", contract_end_date: "2026-09-30" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { crew_c: $.data.id }
            - call: "POST /berry-ops/pickers"
              payload: { crew_id: "${crew_c}", full_name: "Picker V17 C", hygiene_training_on: "2026-06-01" }
              as: CrewSupervisor
              as_user_id: "sup-2"
            - call: "POST /berry-ops/crews/${crew_c}/support-plan"
              payload: { housing_unit_code: "H-V17C", beds_confirmed: 1, transport_route_code: "R-V17C", vehicle_seats: 1 }
              as: HarvestManager
              as_user_id: "hm-1"
            - call: "POST /berry-ops/crews/${crew_c}/certify"
              payload: {}
              as: HarvestManager
              as_user_id: "hm-1"
          trigger:
            - call: "POST /berry-ops/harvest-windows"
              payload: { block_id: "${blk}", crew_id: "${crew_r}", start_at: "2026-08-03T06:00:00Z", end_at: "2026-08-03T14:00:00Z", forecast_brix: 8.5, planned_volume_lbs: 150.00, piece_rate_cents_per_clamshell: 45, clamshell_net_weight_lbs: 1.00 }
              as: HarvestManager
