            - { call: "POST /employees", payload: { employer_group_id: "${g8}", employee_ref: "E8B", full_name: "Emp 8B", hire_date: "2026-01-01T00:00:00Z" }, as: GroupAdmin, captures: { e8b: $.data.id } }
