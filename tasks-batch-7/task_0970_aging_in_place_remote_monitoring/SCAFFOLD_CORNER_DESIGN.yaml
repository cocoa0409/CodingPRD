          setup: ["Senior with kit and installer; clock default"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: "ESSENTIAL", monthly_fee_cents: 3000, included_motion_sensors: 1, extra_sensor_fee_cents: 99, max_contacts: 3, checkin_interval_hours: 72, medication_reminders_enabled: false, wellness_report_enabled: false, wellness_report_cadence: "NONE" }, as: PlatformAdmin, captures: { plan_ws: $.data.id } }
