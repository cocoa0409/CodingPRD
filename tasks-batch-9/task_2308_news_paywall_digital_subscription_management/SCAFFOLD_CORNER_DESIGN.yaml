            - "Seat.${seat_dm}.status == INVITED"
            - "Seat.${seat_dm}.claimed_on == null"
            - "Reader.${rd_dm_out}.entitlement_source == NONE"

      - name: non_monotonic_step_up_schedule_rejected
        claim_type: Violation to Error
        grounds:
          - validations[priority=36]
          - errors[ERR_STEP_UP_SCHEDULE_INVALID]
        distinguishing_aspect: "A step rung at from_cycle 5 sits outside the open window intro_cycles < from_cycle < standard_from_cycle (1 < from_cycle < 4), so plan authoring must fail 422 even though the prices themselves rise monotonically."
        test_recipe:
