        distinguishing_aspect: "The DELETE unassigns a link, it does not delete the PurchaseAgreement: the
          agreement survives at contract_status SIGNED with closing_batch_id back to null and is still
          listed by GET /purchase-agreements. The batch counters are RE-DERIVED (assigned back to 0) but
