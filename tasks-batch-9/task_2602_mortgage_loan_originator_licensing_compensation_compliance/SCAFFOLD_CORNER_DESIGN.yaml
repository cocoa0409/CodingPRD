      - name: closed_unit_index_follows_close_order_not_funded_at_order
        claim_type: chronological
        grounds:
          - state_machines.LoanApplication.LOCKED_to_CLOSED
          - entities.LoanApplication.fields.closed_unit_index
          - calculations.originator_compensation_accrual
        distinguishing_aspect: |
          closed_unit_index is 1 + the count of loans ALREADY in CLOSED or PAID_OFF at the
          moment of the close, so it follows the order the closes were reported, not the
          funded_at values. Loan X (funded_at 2026-08-25) is closed first and gets index 1;
          loan Y (funded_at 2026-08-10, chronologically earlier) is closed second and gets
          index 2. Sorting the closed set by funded_at to assign the index would invert them.
