  # =====================================================================
  # Rule 5: validation priority conflicts across DIFFERENT category pairs.
  # Pair A: business_referential (priority 5) vs business_temporal (priority 8).
  # Pair B: state (priority 6) vs business_safety (priority 7).
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: priority_referential_beats_temporal_on_post_claim
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - errors[ERR_ITEM_NOT_ON_CONTRACT]
          - errors[ERR_OUT_OF_COVERAGE]
        distinguishing_aspect: |
          Category pair: business_referential (priority 5) vs business_temporal
          (priority 8). A POST /claims with covered_item_id belonging to a
          DIFFERENT Contract AND a contract_id whose Contract is in EXPIRED
          status violates both rules; ERR_ITEM_NOT_ON_CONTRACT (priority 5)
          wins over ERR_OUT_OF_COVERAGE (priority 8).
        test_recipe:
          setup:
            - "Two ACTIVE Contracts (A, B) on PLUS package; each has one CoveredItem (itemA on Contract A, itemB on Contract B)."
            - "Contract A then advanced past its coverage_end_utc → status EXPIRED (via /_clock/set + /_clock/tick)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /contract-packages"
              payload: { code: "PLUS", name: "Plus", annual_premium_cents: 50000, service_fee_cents: 7500, copay_cap_cents: 25000, copay_share_pct: 0.20, return_visit_window_days: 30, max_covered_items: 5 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "i@example.com", full_name: "I", home_address: "1 Ash" }
              as: Anonymous
              captures: { iA: $.data.id }
            - call: "POST /customers"
              payload: { email: "j@example.com", full_name: "J", home_address: "2 Ash" }
              as: Anonymous
              captures: { jB: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${iA}", package_id: "${pkg_id}" }
              as: Customer
              as_user_id: "${iA}"
              captures: { contract_a: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${jB}", package_id: "${pkg_id}" }
              as: Customer
              as_user_id: "${jB}"
              captures: { contract_b: $.data.id }
            - call: "POST /contracts/${contract_a}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /contracts/${contract_b}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /covered-items"
              payload: { contract_id: "${contract_a}", category: "HVAC", brand: "X", model: "Y", install_year: 2022 }
              as: Customer
              as_user_id: "${iA}"
              captures: { itemA: $.data.id }
            - call: "POST /covered-items"
              payload: { contract_id: "${contract_b}", category: "DRYER", brand: "X", model: "Y", install_year: 2022 }
              as: Customer
              as_user_id: "${jB}"
              captures: { itemB: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_clock/tick"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /claims"
              payload: { contract_id: "${contract_a}", covered_item_id: "${itemB}", issue_summary: "Cross-contract item attempt against expired contract" }
              as: Customer
              as_user_id: "${iA}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == 'ERR_ITEM_NOT_ON_CONTRACT' (priority 5 wins over priority 8 even though Contract A is also EXPIRED)"
            - "Response HTTP status == 422"

      - name: priority_state_beats_safety_on_assess
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_PRE_EXISTING_EXCLUDED]
        distinguishing_aspect: |
          Category pair: state (priority 6) vs business_safety (priority 7).
          POST /claims/{id}/assess on a claim already in ASSESSED status AND
          whose CoveredItem has pre_existing_flag=true violates both rules.
          ERR_INVALID_STATE (priority 6) wins over ERR_PRE_EXISTING_EXCLUDED
          (priority 7). Distinct category pair from instance A.
        test_recipe:
          setup:
            - "An ACTIVE Contract whose CoveredItem has pre_existing_flag=true… NO, the assess on such an item rejects with PRE_EXISTING_EXCLUDED — so we first need the claim in ASSESSED. The setup uses a CoveredItem whose pre_existing_flag was FALSE at registration, then we /assess to put the claim in ASSESSED, THEN we want to construct a SECOND claim where the item flag is TRUE and the first assess transitions it but we need both predicates true simultaneously. CORRECTION: pre_existing_flag is immutable. We need TWO separate items — but the test must hit one assess endpoint and have BOTH violations at once. Solution: claim is on an item with pre_existing_flag=true and the FIRST assess succeeds → REJECTED path is taken via /reject, not /assess. So /assess with pre_existing_flag=true always rejects with PRE_EXISTING_EXCLUDED in priority 7. To force a state-conflict overlay, we need the same claim to be in ASSESSED already → impossible if first /assess always rejects. Re-examining: the validation says POST /claims/{id}/assess against pre_existing_flag=true is rejected. So if the claim is in ASSESSED (passed assess already → meaning pre_existing_flag was false when first /assess ran)… but pre_existing_flag is immutable. Therefore: the priority conflict happens only when assess is tried twice — first /assess fires PRE_EXISTING_EXCLUDED, and a second /assess on the now-still-SUBMITTED claim (rejection didn't change status — actually /reject is a separate endpoint, /assess that fails does NOT transition). After a rejected /assess attempt, claim is still SUBMITTED. So /assess again hits SAME priorities; no state conflict yet. Alternative wiring: assess on a CoveredItem with pre_existing_flag=true returns ERR_PRE_EXISTING_EXCLUDED priority 7 (claim stays SUBMITTED). Operator runs /reject with rejection_reason=PRE_EXISTING_EXCLUDED → status=REJECTED (terminal). Now /assess on a REJECTED claim — priority 6 invalid_state hits AND priority 7 still applicable. State wins."
            - "Final setup: a CoveredItem with pre_existing_flag=true on an ACTIVE Contract; ClaimTicket filed and then /reject called with rejection_reason=PRE_EXISTING_EXCLUDED → status REJECTED (terminal)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /contract-packages"
              payload: { code: "PLUS", name: "Plus", annual_premium_cents: 50000, service_fee_cents: 7500, copay_cap_cents: 25000, copay_share_pct: 0.20, return_visit_window_days: 30, max_covered_items: 5 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "k@example.com", full_name: "K", home_address: "1 Birch" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", package_id: "${pkg_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /covered-items"
              payload: { contract_id: "${contract_id}", category: "WASHER", brand: "B", model: "M", install_year: 2010, pre_existing_flag: true }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { item_id: $.data.id }
            - call: "POST /claims"
              payload: { contract_id: "${contract_id}", covered_item_id: "${item_id}", issue_summary: "Always was broken" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/reject"
              payload: { rejection_reason: "PRE_EXISTING_EXCLUDED" }
              as: Dispatcher
          trigger:
            - call: "POST /claims/${claim_id}/assess"
              payload: { estimated_repair_cost_cents: 5000 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == 'ERR_INVALID_STATE' (priority 6 state precondition wins over priority 7 safety; the claim is REJECTED/terminal so the state check fires first)"
            - "Response HTTP status == 409"

  # =====================================================================
  # Rule 6: boundary precision on DIFFERENT metrics + endpoints.
  # Boundary A: return_visit_window time boundary (strict <) on /claims/{id}/dispatch.
  # Boundary B: max_covered_items count boundary (<=) on /covered-items.
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: return_visit_window_exact_boundary_closed
        grounds:
          - calculations.is_return_visit
          - entities.ClaimTicket.fields.is_return_visit
        distinguishing_aspect: |
          Boundary metric: time difference T - L. Endpoint: POST
          /claims/{id}/dispatch. The window is half-open
          [L, L + W*86400) — at EXACTLY T = L + W*86400 (W=30 days), the
          condition `T < L + W*86400` is FALSE, so is_return_visit pins to
          false and SF pins to ContractPackage.service_fee_cents. Strict
          less-than is the rule.
        test_recipe:
          setup:
            - "ContractPackage with return_visit_window_days = 30. A CoveredItem whose last_dispatch_completed_utc is exactly 2026-02-01T10:00:00Z. A second ClaimTicket ready to dispatch at clock_now = 2026-03-03T10:00:00Z (= L + 30*86400 seconds EXACTLY)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /contract-packages"
              payload: { code: "PLUS", name: "Plus", annual_premium_cents: 50000, service_fee_cents: 7500, copay_cap_cents: 25000, copay_share_pct: 0.20, return_visit_window_days: 30, max_covered_items: 5 }
