            - "CirculationLine.${l_hi}: allocation_rank == 1, unit_cost_cents == 228, allocated_quantity == 8000, committed_cost_cents == 1824000  # HOUSEFILE first, rfm 1000 before rfm 660, clamped by the 8000-name audience cap even though 12000 were requested"
            - "CirculationLine.${l_lo}: allocation_rank == 2, unit_cost_cents == 228, allocated_quantity == 30000, committed_cost_cents == 6840000  # the full request, funded from the 8176000 the first line left"
