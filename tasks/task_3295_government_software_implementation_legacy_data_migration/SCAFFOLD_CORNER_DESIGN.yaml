        captures:
          ph1: $.data.id
      - call: POST /programs/contracts/${co_id}/start-implementation
        payload: {}
        as: ImplementationManager
      - call: POST /programs/contracts/${co_id}/go-live-events
        payload:
          planned_date: '2026-12-01'
        as: ImplementationManager
        captures:
          gl1: $.data.id
      trigger:
      - call: POST /programs/contracts/${co_id}/go-live-events
        payload:
          planned_date: '2027-01-05'
        as: ImplementationManager
        captures:
          err: $.data.error_id
      assert:
      - second create rejected with ERR_GO_LIVE_EXISTS (409)
- section: calculations
  instances:
  - name: maintenance_escalation_compounded_per_renewal
    claim_type: correct_result
    grounds:
    - calculations.maintenance_fee_escalation
    distinguishing_aspect: 'annual_fee 12,000,000 with 3% escalator: renewal_index 0 -> 12000000; after first renew the successor''s escalated_fee_cents == 12360000
      (round_half_up once at the end, compounding on the successor).'
    test_recipe:
      setup:
      - SupportTransition STEADY_STATE; agreement activated then renewed once (OCC-happy).
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /programs/agencies
        payload:
          agency_code: REV
          display_name: Dept of Revenue
        as: PlatformAdmin
        captures:
          ag_id: $.data.id
      - call: POST /programs/contracts
        payload:
          agency_id: ${ag_id}
          solicitation_number: RFP-2026-001
