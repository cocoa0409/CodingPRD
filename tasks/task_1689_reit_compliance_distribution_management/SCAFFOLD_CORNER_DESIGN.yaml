              as: ComplianceOfficer
              captures: { rep_a: $.data.id }
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "TRB", ticker: "TRBB", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
              as: TaxDirector
              captures: { rb: $.data.id }
            - call: "POST /reit-compliance/quarters"
              payload: { reit_id: "${rb}", label: "2026-Q1", period_start: "2026-01-01", period_end: "2026-03-31" }
              as: ComplianceOfficer
              captures: { qb: $.data.id }
            - call: "POST /reit-compliance/asset-holdings"
              payload: { reit_id: "${rb}", asset_name: "TRS Annex", asset_class: "REAL_ESTATE", held_by_trs: true, is_dealer_inventory: false, acquisition_date: "2024-01-01", value_cents: 20000100 }
              as: ComplianceOfficer
            - call: "POST /reit-compliance/asset-holdings"
              payload: { reit_id: "${rb}", asset_name: "Direct Annex", asset_class: "REAL_ESTATE", held_by_trs: false, is_dealer_inventory: false, acquisition_date: "2024-01-01", value_cents: 79999900 }
              as: ComplianceOfficer
