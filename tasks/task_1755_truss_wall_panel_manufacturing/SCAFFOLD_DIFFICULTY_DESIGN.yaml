      - name: seal_state_beats_safety
        grounds:
          - validations[priority=8]
          - validations[priority=15]
          - errors[ERR_DESIGN_NOT_AWAITING_SEAL]
        distinguishing_aspect: |
          Category pair state (priority 8) vs business_safety (priority 15): sealing a
          DRAFT design with an expired-license engineer must return
          ERR_DESIGN_NOT_AWAITING_SEAL, never ERR_ENGINEER_LICENSE_EXPIRED.
        test_recipe:
          setup:
            - "Job confirmed; design TR-S in DRAFT (never submitted); engineer engX with license_expiry 2026-01-01T00:00:00Z (expired vs default clock 2026-08-01)"
