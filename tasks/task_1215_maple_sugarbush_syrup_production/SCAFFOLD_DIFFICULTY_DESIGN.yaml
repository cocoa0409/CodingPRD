        as: CertInspector
        captures:
          audit1_id: $.data.id
      trigger:
      - call: POST /sugarhouse/sugarbushes/${bush_id}/cert-audits
        payload:
          audit_type: WOODS
          scheduled_for: '2027-02-23'
        as: CertInspector
        captures:
