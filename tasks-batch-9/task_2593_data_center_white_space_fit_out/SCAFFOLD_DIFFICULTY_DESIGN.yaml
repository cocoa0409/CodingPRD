            - "trigger call 3 returns 200; CommissioningPackage.${pkg_l1_id}.witness_status == WITNESSED, package_state == CERTIFIED and witnessed_by_user_id == u-wa-1"
            - "Hall.${hall_id}.status == COMMISSIONING (the LIVE evaluation still needs L4 and L5) and Hall.${hall_id}.release_posture == OPEN"
            - "ContainmentZone.${zone2_id}.test_count == 1 (remediation does not add a test)"

  - rule_id: resource_temporal_overlap
    instances:

      - name: mop_window_buffer_collision_on_same_busway
        grounds:
          - calculations.mop_window_collision_set
          - validations[priority=21]
          - state_machines.MethodOfProcedure.APPROVED_to_SCHEDULED
          - entities.Hall.fields.open_mop_count
        distinguishing_aspect: |
          Two MOPs may not occupy overlapping windows on the SAME target_resource_id, and the window is
          widened by MOP_SETTLE_BUFFER_MIN (60 min) on both sides with a STRICT comparison: a MOP starting
          at 04:59 collides with a 02:00-04:00 MOP purely through the buffer, while one starting at exactly
          05:00 (a gap of exactly 60 minutes) does not. A fourth MOP with a window identical to MOP-1 but a
          different target busway is unaffected, proving the exclusion is per-resource, not per-hall.
        test_recipe:
          setup:
            - "The logical clock is at 2026-08-01T00:00:00Z."
            - "Hall HQ1 (SINGLE_TENANT) holds PDU-A1 -> BW-A1 and PDU-B1 -> BW-B1."
            - "MOP-1 (MEDIUM, target BW-A1, window 2026-08-05T02:00:00Z -> 04:00:00Z) is SCHEDULED."
            - "MOP-2 (MEDIUM, target BW-A1, window 2026-08-05T04:59:00Z -> 05:30:00Z) is APPROVED — its raw window is disjoint from MOP-1's, only the 60-minute settle buffer overlaps."
            - "MOP-3 (MEDIUM, target BW-A1, window 2026-08-05T05:00:00Z -> 06:00:00Z) is APPROVED — exactly 60 minutes after MOP-1's end."
            - "MOP-4 (MEDIUM, target BW-B1, window 2026-08-05T02:00:00Z -> 04:00:00Z) is APPROVED — same window as MOP-1 but a different target resource."
            - "Hall.open_mop_count == 1 before the trigger."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ChangeManager
            - call: "POST /halls"
              payload: { name: "Data Hall Q", code: "HQ1", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 8 }
              as: FacilityPlanner
              captures: { hall_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-A1", feed_side: "A", rated_kw: 300.00 }
              as: ElectricalContractor
              captures: { pdu_a_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-B1", feed_side: "B", rated_kw: 300.00 }
              as: ElectricalContractor
              captures: { pdu_b_id: $.data.id }
            - call: "POST /busways"
              payload: { pdu_id: "${pdu_a_id}", name: "BW-A1", rated_amps: 400, voltage_v: 415, redundancy_topology: "N_PLUS_1" }
              as: ElectricalContractor
              captures: { bw_a_id: $.data.id }
            - call: "POST /busways"
              payload: { pdu_id: "${pdu_b_id}", name: "BW-B1", rated_amps: 400, voltage_v: 415, redundancy_topology: "N_PLUS_1" }
              as: ElectricalContractor
              captures: { bw_b_id: $.data.id }
            - call: "POST /mops"
              payload: { hall_id: "${hall_id}", target_resource_type: "BUSWAY", target_resource_id: "${bw_a_id}", title: "BW-A1 IR scan", risk_class: "MEDIUM", backout_plan: "Close covers, re-energize BW-A1.", window_start: "2026-08-05T02:00:00Z", window_end: "2026-08-05T04:00:00Z" }
              as: ElectricalContractor
              as_user_id: "u-elec-1"
              captures: { mop1_id: $.data.id }
            - call: "POST /mops/${mop1_id}/submit"
              payload: {}
              as: ElectricalContractor
              as_user_id: "u-elec-1"
            - call: "POST /mops/${mop1_id}/approvals"
              payload: { decision: "APPROVE" }
              as: ChangeManager
              as_user_id: "u-cm-1"
            - call: "POST /mops/${mop1_id}/schedule"
              payload: {}
              as: ChangeManager
              as_user_id: "u-cm-1"
            - call: "POST /mops"
              payload: { hall_id: "${hall_id}", target_resource_type: "BUSWAY", target_resource_id: "${bw_a_id}", title: "BW-A1 torque audit", risk_class: "MEDIUM", backout_plan: "Restore covers, re-energize BW-A1.", window_start: "2026-08-05T04:59:00Z", window_end: "2026-08-05T05:30:00Z" }
              as: ElectricalContractor
              as_user_id: "u-elec-1"
              captures: { mop2_id: $.data.id }
            - call: "POST /mops/${mop2_id}/submit"
              payload: {}
              as: ElectricalContractor
              as_user_id: "u-elec-1"
            - call: "POST /mops/${mop2_id}/approvals"
              payload: { decision: "APPROVE" }
              as: ChangeManager
              as_user_id: "u-cm-1"
            - call: "POST /mops"
              payload: { hall_id: "${hall_id}", target_resource_type: "BUSWAY", target_resource_id: "${bw_a_id}", title: "BW-A1 label update", risk_class: "MEDIUM", backout_plan: "Restore original labels.", window_start: "2026-08-05T05:00:00Z", window_end: "2026-08-05T06:00:00Z" }
              as: ElectricalContractor
              as_user_id: "u-elec-1"
              captures: { mop3_id: $.data.id }
            - call: "POST /mops/${mop3_id}/submit"
              payload: {}
              as: ElectricalContractor
              as_user_id: "u-elec-1"
            - call: "POST /mops/${mop3_id}/approvals"
              payload: { decision: "APPROVE" }
              as: ChangeManager
              as_user_id: "u-cm-1"
            - call: "POST /mops"
              payload: { hall_id: "${hall_id}", target_resource_type: "BUSWAY", target_resource_id: "${bw_b_id}", title: "BW-B1 IR scan", risk_class: "MEDIUM", backout_plan: "Close covers, re-energize BW-B1.", window_start: "2026-08-05T02:00:00Z", window_end: "2026-08-05T04:00:00Z" }
              as: ElectricalContractor
              as_user_id: "u-elec-1"
              captures: { mop4_id: $.data.id }
            - call: "POST /mops/${mop4_id}/submit"
              payload: {}
              as: ElectricalContractor
              as_user_id: "u-elec-1"
            - call: "POST /mops/${mop4_id}/approvals"
              payload: { decision: "APPROVE" }
              as: ChangeManager
              as_user_id: "u-cm-1"
          trigger:
            - call: "POST /mops/${mop2_id}/schedule"
              payload: {}
              as: ChangeManager
              as_user_id: "u-cm-1"
            - call: "POST /mops/${mop3_id}/schedule"
              payload: {}
              as: ChangeManager
              as_user_id: "u-cm-1"
            - call: "POST /mops/${mop4_id}/schedule"
              payload: {}
              as: ChangeManager
              as_user_id: "u-cm-1"
          assert:
            - "trigger call 1 returns 409 with error.code == ERR_MOP_WINDOW_CONFLICT — 04:59 < 04:00 + 60 min, so the buffered windows touch"
            - "trigger call 2 returns 200 — a gap of exactly 60 minutes does not collide (the comparison is strict <)"
            - "trigger call 3 returns 200 — MOP-4 shares MOP-1's window but not its target_resource_id"
            - "MethodOfProcedure.${mop2_id}.status == APPROVED (unchanged by the rejection)"
            - "MethodOfProcedure.${mop3_id}.status == SCHEDULED and MethodOfProcedure.${mop4_id}.status == SCHEDULED"
            - "Hall.${hall_id}.open_mop_count == 3 (MOP-1, MOP-3 and MOP-4; MOP-2 never entered SCHEDULED)"
            - "Hall.${hall_id}.release_posture == OPEN (SCHEDULED MOPs do not lock the hall; only IN_EXECUTION does)"

      - name: loadbank_aggregate_reserve_and_concurrency_on_hall
        grounds:
          - calculations.load_bank_window_occupancy
          - validations[priority=22]
          - validations[priority=46]
          - calculations.hall_power_ledger
          - entities.Hall.fields.commissioning_reserve_kw
        distinguishing_aspect: |
          Load bank runs contend for the hall's commissioning reserve over CLOSED windows, so touching
          endpoints DO overlap (unlike the half-open MOP rule), and two independent ceilings apply to the
          same overlap set: a count ceiling of 2 concurrent runs (priority 22, 409) and an aggregate kW
          ceiling equal to Hall.commissioning_reserve_kw of 50.00 (priority 46, 422). A third run touching
          two others at exactly 04:00 is refused on count even though its 5.00 kW would fit the reserve,
          and a later run is refused on kW at 51.00 while an otherwise identical 35.00 kW run reaching
          exactly 50.00 is admitted.
        test_recipe:
          setup:
            - "The logical clock is at 2026-08-01T00:00:00Z."
            - "Hall HR1 (SINGLE_TENANT, design_kw_capacity 400.00, cooling_redundancy N) is in COMMISSIONING; CU-1 (200.00 kW, 40000 cfm, dT 18.0 F) is IN_SERVICE and containment zone CA-1 is PASS at 5.00 %."
            - "Rack R-1-1 (design_kw 150.00, required_feed_count 2) is POWERED on two 75.00 kW feeds, so Hall.committed_kw == 150.00, Hall.commissioning_reserve_kw == 50.00 (tier 2) and Hall.spare_kw == 200.00."
            - "thermal_load_kw == 127.50 against cooling_capacity_kw 200.00 (the nameplate variant binds; the airflow variant is 216.51), so thermal_posture == NOMINAL."
            - "Package PKG-L1 (target_load_kw 10.00) has script_status SCRIPT_APPROVED, which is the precondition for creating load bank runs."
            - "Run A (20.00 kW, 2026-08-10T02:00:00Z -> 04:00:00Z) and run B (20.00 kW, 03:00:00Z -> 05:00:00Z) are SCHEDULED: 2 concurrent runs demanding 40.00 kW of the 50.00 kW reserve."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CommissioningAgent
            - call: "POST /halls"
              payload: { name: "Data Hall R", code: "HR1", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 8 }
              as: FacilityPlanner
              captures: { hall_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-A1", feed_side: "A", rated_kw: 300.00 }
              as: ElectricalContractor
              captures: { pdu_a_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-B1", feed_side: "B", rated_kw: 300.00 }
              as: ElectricalContractor
              captures: { pdu_b_id: $.data.id }
            - call: "POST /busways"
              payload: { pdu_id: "${pdu_a_id}", name: "BW-A1", rated_amps: 400, voltage_v: 415, redundancy_topology: "N_PLUS_1" }
              as: ElectricalContractor
              captures: { bw_a_id: $.data.id }
            - call: "POST /busways"
              payload: { pdu_id: "${pdu_b_id}", name: "BW-B1", rated_amps: 400, voltage_v: 415, redundancy_topology: "N_PLUS_1" }
              as: ElectricalContractor
              captures: { bw_b_id: $.data.id }
            - call: "POST /containment-zones"
              payload: { hall_id: "${hall_id}", label: "CA-1", zone_type: "COLD_AISLE", containment_kind: "RIGID_ROOF", target_leakage_pct: 5.00, design_static_pressure_pa: 20.00 }
