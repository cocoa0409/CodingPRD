          ERR_PRINCIPAL_NON_POSITIVE): an origination that BOTH is run by the appraising user AND would compute
          principal 0 returns ERR_SEGREGATION_OF_DUTIES (403), proving safety outranks fiscal.
        test_recipe:
          setup:
