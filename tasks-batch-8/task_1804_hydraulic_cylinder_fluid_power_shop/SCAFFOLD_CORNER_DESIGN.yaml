        grounds: ["entities.WorkOrder.fields.cylinder_id", "entities.WorkOrder.fields.customer_id"]
        distinguishing_aspect: "GET /fluid-power/work-orders?customer_id=X returns exactly X's orders (2), and adding cylinder_id narrows to 1 — FK reverse-reachability filters compose."
        test_recipe:
          setup: ["two customers; customer A has two cylinders each with a work order; customer B has one"]
          setup_api_calls:
            - { call: "POST /fluid-power/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ShopAdmin }
            - { call: "POST /fluid-power/shops", payload: { name: "FP Shop" }, as: ShopAdmin }
            - { call: "POST /fluid-power/seal-kits", payload: { kit_code: "SK-80-NBR", bore_min_mm: 60, bore_max_mm: 100, pressure_class_max: "CLASS_5000", fluid_compat: ["MINERAL_OIL", "WATER_GLYCOL"], price_cents: 18500, material: "NBR" }, as: ShopAdmin, captures: { kit_id: "$.data.id" } }
            - { call: "POST /fluid-power/customers", payload: { full_name: "Acme", email: "a@a.com", credit_limit_cents: 10000000 }, as: ServiceAdvisor, captures: { cust_a: "$.data.id" } }
            - { call: "POST /fluid-power/customers", payload: { full_name: "Beta", email: "b@b.com", credit_limit_cents: 10000000 }, as: ServiceAdvisor, captures: { cust_b: "$.data.id" } }
            - { call: "POST /fluid-power/cylinders", payload: { customer_id: "${cust_a}", serial_number: "A-1", bore_mm: 80, stroke_mm: 500, rod_diameter_mm: 45, pressure_class: "CLASS_3000", fluid_type: "MINERAL_OIL", seal_kit_id: "${kit_id}" }, as: ServiceAdvisor, captures: { cyl_a1: "$.data.id" } }
            - { call: "POST /fluid-power/cylinders", payload: { customer_id: "${cust_a}", serial_number: "A-2", bore_mm: 80, stroke_mm: 500, rod_diameter_mm: 45, pressure_class: "CLASS_3000", fluid_type: "MINERAL_OIL", seal_kit_id: "${kit_id}" }, as: ServiceAdvisor, captures: { cyl_a2: "$.data.id" } }
            - { call: "POST /fluid-power/cylinders", payload: { customer_id: "${cust_b}", serial_number: "B-1", bore_mm: 80, stroke_mm: 500, rod_diameter_mm: 45, pressure_class: "CLASS_3000", fluid_type: "MINERAL_OIL", seal_kit_id: "${kit_id}" }, as: ServiceAdvisor, captures: { cyl_b1: "$.data.id" } }
            - { call: "POST /fluid-power/work-orders", payload: { cylinder_id: "${cyl_a1}", tier: "STANDARD", promised_hours: 96, complaint: "leak" }, as: ServiceAdvisor }
            - { call: "POST /fluid-power/work-orders", payload: { cylinder_id: "${cyl_a2}", tier: "STANDARD", promised_hours: 96, complaint: "drift" }, as: ServiceAdvisor }
            - { call: "POST /fluid-power/work-orders", payload: { cylinder_id: "${cyl_b1}", tier: "STANDARD", promised_hours: 96, complaint: "scored rod" }, as: ServiceAdvisor }
          trigger:
            - { call: "GET /fluid-power/work-orders?customer_id=${cust_a}", payload: {}, as: ServiceAdvisor }
            - { call: "GET /fluid-power/work-orders?customer_id=${cust_a}&cylinder_id=${cyl_a2}", payload: {}, as: ServiceAdvisor }
          assert:
            - "customer filter returns total_count == 2, both with customer_id == ${cust_a}"
            - "customer+cylinder filter returns total_count == 1 with cylinder_id == ${cyl_a2}"

