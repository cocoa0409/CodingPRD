          - calculations.custody_position_servicing
        distinguishing_aspect: "The custody-accounts read exposes the nested positions array whose quantity and last_corporate_action_applied_id are the servicing outputs, so a reversed action is observable through the nested read alone."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-05T00:00:00Z. Participant CU2 is ACTIVE, class BANK, with one SEGREGATED account; a CASH_DIVIDEND on its security has been announced, applied and then reversed."
