        claim_type: cascading_side_effects
        grounds: [state_machines.Bundle.ACTIVE_to_DISSOLVED, calculations.premium_calculation, entities.Bundle.fields.status]
        distinguishing_aspect: "Cancelling one of exactly two ACTIVE bundle members drops active_member_count to 1, dissolves the bundle, and recomputes the surviving member's annual_premium_cents from 30015 back to 33350 (loses the 0.90 factor)."
