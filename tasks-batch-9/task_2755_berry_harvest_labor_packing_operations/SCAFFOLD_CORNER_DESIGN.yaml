              as_user_id: "fso-1"
            - call: "POST /berry-ops/crews"
              payload: { name: "CREW-V14", labor_program: "DOMESTIC", supervisor_user_id: "sup-1", planned_head_count: 1, contract_start_date: "2026-07-01", contract_end_date: "2026-09-30" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { crew: $.data.id }
            - call: "POST /berry-ops/harvest-windows"
              payload: { block_id: "${blk}", crew_id: "${crew}", start_at: "2026-08-03T06:00:00Z", end_at: "2026-08-03T14:00:00Z", forecast_brix: 8.5, planned_volume_lbs: 150.00, piece_rate_cents_per_clamshell: 45, clamshell_net_weight_lbs: 1.00 }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { win: $.data.id }
            - call: "POST /berry-ops/cooling-tunnels"
              payload: { name: "TUN-V14", slot_capacity: 2, target_pulp_temp_f: 34.0 }
              as: PackhouseOperator
              as_user_id: "pack-1"
              captures: { tun: $.data.id, tv: $.data.version }
            - call: "POST /berry-ops/fruit-lots"
              payload: { harvest_window_id: "${win}", block_id: "${blk}", pick_date: "2026-08-03", variety: "STRAWBERRY", grade: "A", clamshell_count: 50, clamshell_net_weight_lbs: 1.00, pack_completed_at: "2026-08-03T12:00:00Z", field_pulp_temp_f: 62.0 }
              as: PackhouseOperator
