            - "response.data.error_id == ERR_TRANSFER_NOT_RESOLVABLE"

      - name: condition_code_unknown_in_program_on_case_open
        claim_type: Violation to Error
        grounds:
          - errors[ERR_CONDITION_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: |
          Opening a case with a condition_code that no ReportableCondition in the program defines
          returns 404 ERR_CONDITION_NOT_FOUND (FK by business key, priority 4).
        test_recipe:
          setup:
            - "Program P with jurisdiction J1 and condition COVID19 only."
          setup_api_calls:
            - call: "POST /surveillance/programs"
              payload: { name: "State PH" }
              as: JurisdictionAdmin
              captures: { prog: $.data.id }
            - call: "POST /surveillance/jurisdictions"
              payload: { program_id: "${prog}", name: "County 1", fips_code: "06001" }
