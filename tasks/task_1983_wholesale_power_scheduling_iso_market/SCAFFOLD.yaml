  # --- AncillaryServiceAward ---
  - method: POST
    path: "/market/operating-days/{operatingDayId}/awards"
    description: "Award ancillary service to a generator for a window of the operating day"
    roles: [IsoOperator]
    code: 201
    input: [generator_asset_id, service_type, awarded_mw, capacity_price_cents, "performance_price_cents?", "mileage_ratio?", start_interval, end_interval]
    output: AncillaryServiceAward
    side_effects: ["status AWARDED", "day must be DA_OPEN or DA_GATED (ERR_MARKET_NOT_OPEN)", "award window must not intersect any APPROVED outage of the generator (ERR_AWARD_OVERLAPS_OUTAGE)"]
