            - call: "POST /family-planning/affiliates/${c_aff_id}/stock-lots"
              payload: { device_code: "IMPLANT", lot_number: "LOT-E", unit_cost_cents: 40000, on_hand: 2, expires_on: "2026-09-20" }
              as: SupplyCoordinator
              captures: { c_lote_id: $.data.id }
          trigger:
            - call: "POST /family-planning/encounters/${c_encl_id}/device-reservations"
              payload: { lot_id: "${c_lote_id}" }
              as: SupplyCoordinator
              captures: { err_id: $.data.error_id }
            - call: "POST /family-planning/encounters/${c_encl_id}/device-reservations"
              payload: { lot_id: "${c_lote_id}", is_rapid_reinsertion: true, expulsion_recorded_at: "2026-09-15T10:00:00Z" }
              as: SupplyCoordinator
              captures: { c_resr_id: $.data.id }
          assert:
            - "normal reservation: status 422 and error_id == ERR_LOT_EXPIRED"
            - "rapid reinsertion within window and grace: succeeds, DeviceReservation.${c_resr_id}.status == RESERVED"
            - "ContraceptiveStockLot.${c_lote_id}.reserved_out == 1 after both calls"

      - name: rapid_reinsertion_beyond_thirty_days_rejected
        claim_type: Violation → Error
        grounds:
          - calculations.rapid_reinsertion_eligibility
          - errors.ERR_REINSERTION_WINDOW_EXCEEDED
        distinguishing_aspect: "The 30-day window is inclusive: expulsion exactly 30 days before the encounter is eligible; 30 days and 1 second is ERR_REINSERTION_WINDOW_EXCEEDED."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Standard setup with LARC_INSERTION; adult tier-D patient with two SCHEDULED encounters (2026-10-10T10:00 and 2026-10-10T11:00); fresh lot expires 2027-01-01 on_hand 2."
          setup_api_calls:
            - *c_clock
            - *c_aff
            - *c_tier_d
            - call: "POST /family-planning/affiliates/${c_aff_id}/service-catalog"
              payload: { service_code: "LARC_INSERTION", in_scope: true, telehealth_eligible: false, full_fee_cents: 50000 }
              as: GrantAdministrator
            - *c_prov
            - *c_lic
            - *c_pat
            - *c_asm
            - call: "POST /family-planning/patients/${c_pat_id}/encounters"
              payload: { service_code: "LARC_INSERTION", provider_id: "${c_prov_id}", channel: "IN_PERSON", scheduled_start: "2026-10-10T10:00:00Z", scheduled_end: "2026-10-10T10:30:00Z" }
              as: FrontDeskStaff
              captures: { c_encw1: $.data.id }
            - call: "POST /family-planning/patients/${c_pat_id}/encounters"
              payload: { service_code: "LARC_INSERTION", provider_id: "${c_prov_id}", channel: "IN_PERSON", scheduled_start: "2026-10-10T11:00:00Z", scheduled_end: "2026-10-10T11:30:00Z" }
              as: FrontDeskStaff
              captures: { c_encw2: $.data.id }
            - call: "POST /family-planning/affiliates/${c_aff_id}/stock-lots"
              payload: { device_code: "IMPLANT", lot_number: "LOT-W", unit_cost_cents: 40000, on_hand: 2, expires_on: "2027-01-01" }
              as: SupplyCoordinator
              captures: { c_lotw_id: $.data.id }
          trigger:
            - call: "POST /family-planning/encounters/${c_encw1}/device-reservations"
              payload: { lot_id: "${c_lotw_id}", is_rapid_reinsertion: true, expulsion_recorded_at: "2026-09-10T10:00:00Z" }
              as: SupplyCoordinator
              captures: { c_resw_id: $.data.id }
            - call: "POST /family-planning/encounters/${c_encw2}/device-reservations"
              payload: { lot_id: "${c_lotw_id}", is_rapid_reinsertion: true, expulsion_recorded_at: "2026-09-10T10:59:59Z" }
              as: SupplyCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "exactly 30 days (2026-09-10T10:00 -> 2026-10-10T10:00): succeeds, RESERVED"
            - "30 days + 59 minutes 59 seconds beyond: status 422 and error_id == ERR_REINSERTION_WINDOW_EXCEEDED"
            - "ContraceptiveStockLot.${c_lotw_id}.reserved_out == 1 (only the eligible reservation holds)"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: encounter_create_without_current_assessment_rejected
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/family-planning/patients/{patientId}/encounters
          - errors.ERR_NO_CURRENT_ASSESSMENT
        distinguishing_aspect: "Encounter creation pins the patient's CURRENT HouseholdAssessment; a patient with no assessment at all gets 422 ERR_NO_CURRENT_ASSESSMENT — the pin is mandatory, not best-effort."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Standard setup; patient registered but NEVER assessed."
          setup_api_calls:
            - *c_clock
            - *c_aff
            - *c_tier_d
            - *c_cat
            - *c_prov
            - *c_lic
            - *c_pat
          trigger:
            - call: "POST /family-planning/patients/${c_pat_id}/encounters"
              payload: { service_code: "CONTRACEPTIVE_COUNSELING", provider_id: "${c_prov_id}", channel: "IN_PERSON", scheduled_start: "2026-09-10T10:00:00Z", scheduled_end: "2026-09-10T10:30:00Z" }
              as: FrontDeskStaff
              captures: { err_id: $.data.error_id }
          assert:
            - "status 422 and error_id == ERR_NO_CURRENT_ASSESSMENT"
            - "GET /family-planning/patients/${c_pat_id}/encounters returns 0 rows"

      - name: waive_billing_only_for_confidential_or_minor
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/family-planning/encounters/{encounterId}/waive-billing
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "waive-billing is legal only when the patient is a minor at encounter time or carries confidentiality_flag; a non-confidential adult's completed encounter is rejected and remains UNBILLED."
        test_recipe:
          setup:
            - "Logical clock at encounter time. Standard setup; NON-confidential adult patient; encounter completed."
          setup_api_calls:
            - *c_clock
            - *c_aff
            - *c_tier_d
            - *c_cat
            - *c_prov
            - *c_lic
            - *c_pat
            - *c_asm
            - *c_enc
            - call: "POST /family-planning/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T10:00:00Z" }
              as: GrantAdministrator
            - call: "POST /family-planning/encounters/${c_enc_id}/start"
              payload: {}
              as: Clinician
            - call: "POST /family-planning/encounters/${c_enc_id}/complete"
              payload: {}
              as: Clinician
          trigger:
            - call: "POST /family-planning/encounters/${c_enc_id}/waive-billing"
              payload: {}
              as: BillingSpecialist
              captures: { err_id: $.data.error_id }
          assert:
            - "status 409 and error_id == ERR_INVALID_STATE"
            - "Encounter.${c_enc_id}.billing_status == UNBILLED"

      - name: settle_requires_zero_net_or_denial
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/family-planning/claims/{claimId}/settle
          - errors.ERR_CLAIM_NOT_SETTLEABLE
        distinguishing_aspect: "settle on a PAID claim with residual net_receivable > 0 is 409 ERR_CLAIM_NOT_SETTLEABLE; the same claim settles once the residual is recouped to zero."
        test_recipe:
          setup:
            - "Logical clock at encounter time. Standard setup; adult insured tier-C patient; claim SUBMITTED with billed 10000, partially adjudicated 6000 (net 4000)."
          setup_api_calls:
            - *c_clock
            - *c_aff
            - *c_tier_a
            - *c_tier_b
            - *c_tier_c
            - *c_tier_d
            - *c_cat
            - *c_prov
            - *c_lic
            - *c_pat
            - call: "POST /family-planning/patients/${c_pat_id}/household-assessments"
              payload: { household_size: 1, annual_income_cents: 2635500, income_basis: "DOCUMENTED", expected_patient_version: "${c_pat_v}" }
              as: FrontDeskStaff
            - *c_enc
            - call: "POST /family-planning/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T10:00:00Z" }
              as: GrantAdministrator
            - call: "POST /family-planning/encounters/${c_enc_id}/start"
              payload: {}
              as: Clinician
            - call: "POST /family-planning/encounters/${c_enc_id}/complete"
              payload: {}
              as: Clinician
            - call: "POST /family-planning/encounters/${c_enc_id}/claims"
              payload: {}
              as: BillingSpecialist
              captures: { c_claims_id: $.data.id }
            - call: "POST /family-planning/claims/${c_claims_id}/submit"
              payload: {}
              as: BillingSpecialist
            - call: "POST /family-planning/claims/${c_claims_id}/adjudicate"
              payload: { amount_cents: 6000 }
              as: BillingSpecialist
          trigger:
            - call: "POST /family-planning/claims/${c_claims_id}/settle"
              payload: {}
              as: BillingSpecialist
              captures: { err_id: $.data.error_id }
            - call: "POST /family-planning/claims/${c_claims_id}/recoup"
              payload: { amount_cents: 4000 }
              as: BillingSpecialist
            - call: "POST /family-planning/claims/${c_claims_id}/settle"
              payload: {}
              as: BillingSpecialist
          assert:
            - "first settle: status 409 and error_id == ERR_CLAIM_NOT_SETTLEABLE (net_receivable 4000 != 0)"
            - "recoup of 4000 RAISES net_receivable to 8000 (10000 - 6000 + 4000), so the second settle is also 409 ERR_CLAIM_NOT_SETTLEABLE — recoupment moves the claim away from settleable"
            - "Encounter.${c_enc_id}.billing_status == CLAIMED throughout (never SETTLED with residual)"

      - name: affiliate_suspend_cascade_blocks_new_encounters
        claim_type: Cross-entity
        grounds:
          - state_machines.Affiliate.ACTIVE_to_SUSPENDED
          - errors.ERR_SERVICE_OUT_OF_SCOPE
          - errors.ERR_AFFILIATE_NOT_ACTIVE
        distinguishing_aspect: "Suspending an affiliate flips its catalog entries to SUSPENDED (cascade down), so new encounter creation on an existing patient of that affiliate fails ERR_SERVICE_OUT_OF_SCOPE — the child entity's derived state, not a flag on the request, drives the rejection."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Standard setup; patient assessed; no encounter yet. Affiliate then SUSPENDED."
          setup_api_calls:
            - *c_clock
            - *c_aff
            - *c_tier_d
            - *c_cat
            - *c_prov
            - *c_lic
            - *c_pat
            - *c_asm
            - call: "POST /family-planning/affiliates/${c_aff_id}/suspend"
              payload: {}
              as: GrantAdministrator
          trigger:
            - call: "POST /family-planning/patients/${c_pat_id}/encounters"
              payload: { service_code: "CONTRACEPTIVE_COUNSELING", provider_id: "${c_prov_id}", channel: "IN_PERSON", scheduled_start: "2026-09-10T10:00:00Z", scheduled_end: "2026-09-10T10:30:00Z" }
              as: FrontDeskStaff
              captures: { err_id: $.data.error_id }
          assert:
            - "status 422 and error_id == ERR_SERVICE_OUT_OF_SCOPE (catalog entry cascaded to SUSPENDED)"
            - "GET /family-planning/affiliates/${c_aff_id}/service-catalog shows the entry status == SUSPENDED"

      - name: stock_lot_list_filters_by_device_code
        claim_type: Standard CRUD
        grounds:
          - endpoints.GET_/family-planning/affiliates/{affiliateId}/stock-lots
        distinguishing_aspect: "The device_code query filter narrows the list to matching lots only; unfiltered list returns all lots of the affiliate."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Affiliate with three lots: two IUD_COPPER, one IMPLANT."
          setup_api_calls:
            - *c_clock
            - *c_aff
            - call: "POST /family-planning/affiliates/${c_aff_id}/stock-lots"
              payload: { device_code: "IUD_COPPER", lot_number: "F-1", unit_cost_cents: 10000, on_hand: 5, expires_on: "2027-01-01" }
              as: SupplyCoordinator
            - call: "POST /family-planning/affiliates/${c_aff_id}/stock-lots"
              payload: { device_code: "IUD_COPPER", lot_number: "F-2", unit_cost_cents: 11000, on_hand: 5, expires_on: "2027-01-01" }
              as: SupplyCoordinator
            - call: "POST /family-planning/affiliates/${c_aff_id}/stock-lots"
              payload: { device_code: "IMPLANT", lot_number: "F-3", unit_cost_cents: 40000, on_hand: 3, expires_on: "2027-01-01" }
              as: SupplyCoordinator
          trigger:
            - call: "GET /family-planning/affiliates/${c_aff_id}/stock-lots"
              payload: { device_code: "IUD_COPPER" }
              as: SupplyCoordinator
          assert:
            - "filtered list returns exactly 2 rows, both IUD_COPPER, total_count == 2"
            - "unfiltered list returns 3 rows"

  # ===========================================================================
  - section: errors
    instances:
      - name: error_missing_auth_headers
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
        distinguishing_aspect: "A request with neither X-User-ID nor X-User-Role is a 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER on any endpoint, and auth outranks every other failure including 404."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /family-planning/affiliates/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ""
              captures: { err_id: $.data.error_id }
          assert:
            - "status 400 and error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (not 404 — priority 1 beats priority 3)"

      - name: error_insufficient_permissions_for_role
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - errors.ERR_INSUFFICIENT_PERMISSIONS
        distinguishing_aspect: "A well-formed request from a role outside the endpoint's roles list is 403 ERR_INSUFFICIENT_PERMISSIONS — e.g. Clinician attempting to create fee tiers."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. One affiliate."
          setup_api_calls:
            - *c_clock
            - *c_aff
          trigger:
            - call: "POST /family-planning/affiliates/${c_aff_id}/fee-tiers"
              payload: { tier_code: "X", fpl_pct_min_inclusive: 0, fpl_pct_max_exclusive: 100, discount_pct: 50, requires_documentation: false }
              as: Clinician
              captures: { err_id: $.data.error_id }
          assert:
            - "status 403 and error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "GET /family-planning/affiliates/${c_aff_id}/fee-tiers returns 0 rows"

      - name: error_stale_version_on_assessment_create
        claim_type: violation_to_error
        grounds:
          - concurrency_rules[assessment-create-stale-patient]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "OCC: a second assessment carrying the pre-first-assessment patient version is 412 ERR_STALE_VERSION — deterministic with two strictly sequential requests; the current version succeeds."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Affiliate with tier D; patient at version 1; first assessment created (patient version advances to 2)."
          setup_api_calls:
            - *c_clock
            - *c_aff
            - *c_tier_d
            - *c_pat
            - call: "POST /family-planning/patients/${c_pat_id}/household-assessments"
              payload: { household_size: 1, annual_income_cents: 4000000, income_basis: "DOCUMENTED", expected_patient_version: "${c_pat_v}" }
              as: FrontDeskStaff
          trigger:
            - call: "POST /family-planning/patients/${c_pat_id}/household-assessments"
              payload: { household_size: 2, annual_income_cents: 4000000, income_basis: "DOCUMENTED", expected_patient_version: "${c_pat_v}" }
              as: FrontDeskStaff
              captures: { err_id: $.data.error_id }
            - call: "GET /family-planning/patients/${c_pat_id}"
              payload: {}
              as: FrontDeskStaff
              captures: { c_pat_v2: $.data.version }
            - call: "POST /family-planning/patients/${c_pat_id}/household-assessments"
              payload: { household_size: 2, annual_income_cents: 4000000, income_basis: "DOCUMENTED", expected_patient_version: "${c_pat_v2}" }
              as: FrontDeskStaff
              captures: { c_asm2: $.data.id }
          assert:
            - "stale expected_patient_version: status 412 and error_id == ERR_STALE_VERSION"
            - "retry with the re-read version succeeds: HouseholdAssessment.${c_asm2}.status == CURRENT"
            - "GET /family-planning/patients/${c_pat_id}/household-assessments returns 2 rows (one SUPERSEDED, one CURRENT)"

      - name: error_no_eligible_tier
        claim_type: violation_to_error
        grounds:
          - errors.ERR_NO_ELIGIBLE_TIER
        excluded_because:
          difficulty_instance: calculations / no_eligible_tier_returns_domain_error
          rationale: "Asserted as the failure path of the calculations-section corner instance no_eligible_tier_returns_domain_error."

