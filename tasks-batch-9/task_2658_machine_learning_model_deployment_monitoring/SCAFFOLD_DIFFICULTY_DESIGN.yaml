            - "second APPROVE with the byte-identical body: HTTP 422 with error_id 'ERR_DATASET_NOT_APPROVED' — the priority-40 rule was violated all along"
            - "after the second rejected call approval_state is still 'PENDING_REVIEW', approved_at is still null and revalidation_due_at is still null"

