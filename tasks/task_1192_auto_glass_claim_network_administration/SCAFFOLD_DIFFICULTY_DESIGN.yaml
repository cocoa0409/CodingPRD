        distinguishing_aspect: |
          Interval semantics: IN_SHOP overlap is an AGGREGATE daily-minutes sum
          against bay_count x operating_minutes_per_day, not pairwise interval
          intersection: two 300-minute in-shop jobs on the same calendar date
