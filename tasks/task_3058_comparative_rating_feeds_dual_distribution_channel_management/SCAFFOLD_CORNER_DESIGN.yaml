            - "take-action by ur-2 succeeds: PortfolioReview.${rev_id}.status == ACTION_TAKEN, action == CONTINUE, actioned_by_user_id == \"ur-2\""
            - "Agent.${agent_a}.status remains APPOINTED (CONTINUE changes nothing)"

