      - name: unknown_role_and_missing_identity_headers_are_unauthorized_before_anything_else
        claim_type: cannot_perform_others_exclusive_operations
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_UNAUTHORIZED]
          - validations[priority=10]
          - validations[priority=20]
          - endpoints[GET /_clock/current]
        distinguishing_aspect: >-
          An UNDECLARED role value is 403, not 401 — the headers are present, they just do not name a
          role. Absent or empty headers are 401. And GET /_clock/current is the single declared
          exception: it answers 200 with no identity headers at all, so the auth layer cannot be
          implemented as a blanket filter.
        test_recipe:
          setup:
            - "One property P1 exists so the reads have something to return."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
