          The duty dimension has no OFFLINE -> AVAILABLE shortcut, so MAKE_AVAILABLE on a freshly
          registered robot is 409 ERR_INVALID_STATE_TRANSITION and the fleet must pass through STAGING;
          replaying STAGE once the robot is AVAILABLE is refused for the same reason, which distinguishes
          this instance from the segment one by proving both a forward skip and a backward replay fail on
