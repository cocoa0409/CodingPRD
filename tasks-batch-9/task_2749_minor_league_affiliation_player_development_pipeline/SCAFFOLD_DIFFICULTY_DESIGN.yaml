              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { oy17b: $.data.option_year_charged }
            - call: "GET /players/${p17}"
              payload: {}
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { ou17c: $.data.option_years_used, or17c: $.data.option_years_remaining }
            - call: "POST /assignments/${asg17b}/disposition"
              payload: { action: "REVOKE", note: "second option rescinded" }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { st17b: $.data.status, oy17c: $.data.option_year_charged }
            - call: "GET /players/${p17}"
              payload: {}
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { ou17d: $.data.option_years_used, or17d: $.data.option_years_remaining }
            - call: "GET /assignments/${asg17b}/option-years"
              payload: {}
              as: FarmDirector
              as_user_id: "u-farm-1"
          assert:
            - "Checkpoint 0 (no activation): option_years_used == 0, option_years_remaining == 3, sum == 3"
            - "Checkpoint 1 (first activation): option_years_used == 1, option_years_remaining == 2, sum == 3"
            - "Checkpoint 2 (second activation): option_years_used == 2, option_years_remaining == 1, sum == 3"
            - "Checkpoint 3 (revocation of the second assignment): option_years_used == 1, option_years_remaining == 2, sum == 3"
            - "PlayerAssignment.${asg17a}.option_year_charged == true and PlayerAssignment.${asg17b}.option_year_charged flips from true to false"
            - "GET /assignments/${asg17b}/option-years still returns total_count == 1 with status RESCINDED and optional_days == 59 (the row is retained, not deleted)"
            - "The retained OptionYearRecord for ${asg17a} has optional_days == 30 and status CHARGED"
            - "PlayerAssignment.${asg17a}.status is still ACTIVE and Affiliate.${aff17}.active_roster_count == 1 after the revocation"

      - name: signing_pool_allocated_and_remaining_conserved_across_approve_and_void
        grounds:
          - calculations.signing_pool_charge
          - state_machines.InternationalSigning.APPROVED_to_VOIDED
          - entities.SigningPool.fields.allocated_cents
          - entities.SigningPool.fields.remaining_cents
          - entities.SigningPool.fields.effective_pool_cents
          - "concurrency_rules[signing-create-stale-pool]"
        distinguishing_aspect: |
          The conserved quantity here is a MONETARY identity across a ledger
          pair (allocated_cents + remaining_cents == effective_pool_cents) held
          at four checkpoints, and the compensation is a subtraction on VOID
          rather than the exclusion of a row from a count; the forfeit and tax
          accumulators are deliberately kept at zero so the identity is clean.
        test_recipe:
          setup:
            - "A DOMINICAN_ACADEMY affiliate with an ACTIVE agreement (minimum_active_players 0) and housing_beds 40, so posture is OPEN and no housing cap interferes."
            - "A 2026 SigningPool with base_pool_cents 5000000 and trade_adjustment_cents 0."
            - "Two INTERNATIONAL_FA players; the total of the two bonuses (2000000) stays well below the pool, so no overage, tax or forfeit is ever generated."
            - "expected_pool_version is re-read from GET /signing-pools/{id} before each create, as required by concurrency_rules[signing-create-stale-pool]."
          setup_api_calls:
            - call: "POST /affiliates"
              payload: { name: "San Pedro Academy", level: "DOMINICAN_ACADEMY", market_city: "San Pedro de Macoris", meal_stipend_cents_per_day: 2500, housing_beds: 40 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { aff18: $.data.id }
            - call: "POST /affiliates/${aff18}/agreements"
              payload: { term_start_date: "2026-01-01", term_end_date: "2026-12-31", facility_standard_tier: "TIER_3", club_reimbursement_cap_cents: 100000, minimum_active_players: 0 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { agr18: $.data.id }
            - call: "POST /agreements/${agr18}/disposition"
              payload: { action: "SUBMIT" }
              as: AffiliateOperator
              as_user_id: "${aff18}"
            - call: "POST /agreements/${agr18}/disposition"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
            - call: "POST /signing-pools"
              payload: { season_year: 2026, base_pool_cents: 5000000, trade_adjustment_cents: 0 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { pool18: $.data.id, pv18a: $.data.version, alloc18a: $.data.allocated_cents, rem18a: $.data.remaining_cents, eff18a: $.data.effective_pool_cents }
            - call: "POST /players"
              payload: { full_name: "Wilkin Peralta", origin: "INTERNATIONAL_FA", signed_date: "2026-01-15" }
              as: InternationalScout
              as_user_id: "u-scout-1"
              captures: { ipa: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Junior Almonte", origin: "INTERNATIONAL_FA", signed_date: "2026-01-15" }
              as: InternationalScout
              as_user_id: "u-scout-1"
              captures: { ipb: $.data.id }
            - call: "POST /international-signings"
              payload: { pool_id: "${pool18}", player_id: "${ipa}", academy_affiliate_id: "${aff18}", bonus_cents: 1200000, expected_pool_version: "${pv18a}" }
              as: InternationalScout
              as_user_id: "u-scout-1"
              captures: { s18a: $.data.id }
            - call: "GET /signing-pools/${pool18}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { pv18b: $.data.version }
            - call: "POST /international-signings"
              payload: { pool_id: "${pool18}", player_id: "${ipb}", academy_affiliate_id: "${aff18}", bonus_cents: 800000, expected_pool_version: "${pv18b}" }
              as: InternationalScout
              as_user_id: "u-scout-1"
              captures: { s18b: $.data.id }
          trigger:
            - call: "POST /international-signings/${s18a}/disposition"
              payload: { action: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { ch18a: $.data.pool_charge_cents }
            - call: "GET /signing-pools/${pool18}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { alloc18b: $.data.allocated_cents, rem18b: $.data.remaining_cents }
            - call: "POST /international-signings/${s18b}/disposition"
              payload: { action: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { ch18b: $.data.pool_charge_cents }
            - call: "GET /signing-pools/${pool18}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { alloc18c: $.data.allocated_cents, rem18c: $.data.remaining_cents }
            - call: "POST /international-signings/${s18b}/disposition"
              payload: { action: "VOID", note: "medical review failed after approval" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { sst18b: $.data.status }
            - call: "GET /signing-pools/${pool18}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { alloc18d: $.data.allocated_cents, rem18d: $.data.remaining_cents, eff18d: $.data.effective_pool_cents, forf18d: $.data.forfeited_cents, tax18d: $.data.overage_tax_accrued_cents, pst18d: $.data.status }
          assert:
            - "Checkpoint 0 (pool created): allocated_cents == 0, remaining_cents == 5000000, effective_pool_cents == 5000000, and 0 + 5000000 == 5000000"
            - "Checkpoint 1 (first approval): allocated_cents == 1200000, remaining_cents == 3800000, and 1200000 + 3800000 == 5000000"
            - "Checkpoint 2 (second approval): allocated_cents == 2000000, remaining_cents == 3000000, and 2000000 + 3000000 == 5000000"
            - "Checkpoint 3 (void of the second signing): allocated_cents == 1200000, remaining_cents == 3800000, and 1200000 + 3800000 == 5000000"
            - "The void restores the ledger exactly to its checkpoint-1 values, with no drift of a single cent"
            - "InternationalSigning.${s18b}.status == VOIDED while InternationalSigning.${s18a}.status is still APPROVED (the void is not a cascade)"
            - "InternationalSigning.${s18a}.pool_charge_cents == 1200000 and InternationalSigning.${s18b}.pool_charge_cents == 800000, both with overage_tax_cents == 0 and tier3_breach == false"
            - "SigningPool.${pool18}.forfeited_cents == 0, overage_tax_accrued_cents == 0 and status == OPEN at every checkpoint"
