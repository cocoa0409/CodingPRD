# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# University Registrar & Course Registration
#
# Nine §0.5 rules × ≥2 instances each. Every grounds[] ref resolves into
# SCAFFOLD.yaml §1.1–§1.7. setup_api_calls/trigger chains are executable from
# empty-DB using only §1.5 endpoints; assert literals are pre-computed.
#
# Canonical fixture conventions reused across instances (each instance rebinds
# its own ${vars}):
#   Term: per_credit_cost_cents=50000, refund_full_pct=1.0, refund_partial_pct=0.5
#         registration_opens_at=2026-01-01T00:00:00Z, add_deadline=2026-02-01T00:00:00Z
#         drop_deadline=2026-02-15T00:00:00Z, withdraw_deadline=2026-03-15T00:00:00Z
#   Clock during registration: 2026-01-10T00:00:00Z (>= window_opens_at, <= add_deadline)
#   Courses: CS101 3cr, CS201 4cr (prereq CS101 min 2.0), CS301 3cr (coreq CS201)
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: refund_drop_full_vs_withdraw_partial
        grounds:
          - calculations.enrollment_refund
          - state_machines.Enrollment.ENROLLED_to_DROPPED
          - state_machines.Enrollment.ENROLLED_to_WITHDRAWN
          - entities.Enrollment.fields.refund_cents
        distinguishing_aspect: "On the Enrollment/RefundTransaction domain: a DROP at/before drop_deadline refunds 100% (150000) while a WITHDRAW after drop_deadline refunds 50% (75000) of the same frozen tuition_charged_cents."
        test_recipe:
          setup:
            - "Term T1 with the canonical deadlines; Program, Instructor, Course CS101(3cr), one OPEN Section seat_cap>=2."
            - "Two students each with an appointment open; clock at 2026-01-10 (registration); each enrolls into the section (tuition_charged_cents=150000)."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "BS CS", required_credit_hours: 120, min_gpa: 2.0 }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Dr A", email: "a@u.edu", gap_minutes: 0 }
              as: Registrar
              captures: { instr_id: $.data.id }
            - call: "POST /terms"
              payload: { name: "Fall 2026", registration_opens_at: "2026-01-01T00:00:00Z", add_deadline: "2026-02-01T00:00:00Z", drop_deadline: "2026-02-15T00:00:00Z", withdraw_deadline: "2026-03-15T00:00:00Z", per_credit_cost_cents: 50000, refund_full_pct: 1.0, refund_partial_pct: 0.5 }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /courses"
              payload: { code: "CS101", title: "Intro", credit_hours: 3, program_id: "${prog_id}" }
              as: Registrar
              captures: { cs101_id: $.data.id }
            - call: "POST /sections"
              payload: { term_id: "${term_id}", course_id: "${cs101_id}", instructor_id: "${instr_id}", section_code: "001", seat_capacity: 2, waitlist_capacity: 0, meeting_days: "MWF", meeting_start_min: 540, meeting_end_min: 590 }
              as: Registrar
              captures: { sec_id: $.data.id }
            - call: "POST /terms/${term_id}/status"
              payload: { to_status: "REGISTRATION_OPEN" }
              as: Registrar
            - call: "POST /students"
              payload: { full_name: "Stu Drop", email: "drop@u.edu", program_id: "${prog_id}" }
              as: Registrar
              captures: { stu_drop_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Stu Wd", email: "wd@u.edu", program_id: "${prog_id}" }
              as: Registrar
              captures: { stu_wd_id: $.data.id }
            - call: "POST /appointments"
              payload: { term_id: "${term_id}", student_id: "${stu_drop_id}", priority_tier: 1, window_opens_at: "2026-01-05T00:00:00Z", max_credit_hours: 12 }
              as: Registrar
            - call: "POST /appointments"
              payload: { term_id: "${term_id}", student_id: "${stu_wd_id}", priority_tier: 1, window_opens_at: "2026-01-05T00:00:00Z", max_credit_hours: 12 }
              as: Registrar
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-01-10T00:00:00Z" }
              as: Registrar
            - call: "GET /sections/${sec_id}"
              payload: {}
              as: Registrar
              captures: { sec_v0: $.data.version }
            - call: "POST /enrollments"
              payload: { term_id: "${term_id}", section_id: "${sec_id}", expected_section_version: "${sec_v0}" }
              as: Student
              as_user_id: "${stu_drop_id}"
              captures: { enr_drop_id: $.data.id }
            - call: "GET /sections/${sec_id}"
              payload: {}
              as: Registrar
              captures: { sec_v1: $.data.version }
            - call: "POST /enrollments"
              payload: { term_id: "${term_id}", section_id: "${sec_id}", expected_section_version: "${sec_v1}" }
              as: Student
              as_user_id: "${stu_wd_id}"
              captures: { enr_wd_id: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr_drop_id}/drop"
              payload: {}
              as: Student
              as_user_id: "${stu_drop_id}"
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-02-20T00:00:00Z" }
              as: Registrar
            - call: "POST /enrollments/${enr_wd_id}/withdraw"
              payload: {}
              as: Student
              as_user_id: "${stu_wd_id}"
          assert:
            - "Enrollment.${enr_drop_id}.refund_cents == 150000"
            - "Enrollment.${enr_drop_id}.registration_status == DROPPED"
            - "Enrollment.${enr_wd_id}.refund_cents == 75000"
            - "Enrollment.${enr_wd_id}.registration_status == WITHDRAWN"

      - name: gpa_cumulative_vs_term_scope
        grounds:
          - calculations.cumulative_gpa
          - entities.Student.fields.gpa
          - state_machines.Enrollment.ENROLLED_to_ENROLLED
        distinguishing_aspect: "On the Student domain: cumulative GPA over A(4cr)+B(3cr)+F(3cr) across two terms is 2.50 while the term-scoped GPA for the term holding only A(4cr) is 4.00 — same weighting formula, different considered set."
        test_recipe:
          setup:
            - "One student graded A in CS101(3cr equiv 4cr course) and B in a 3cr course in Term TA, and F in a 3cr course in Term TB; both terms CLOSED-or-IN_SESSION so grades can be entered."
            - "Per the canonical model: build TermA with two sections (4cr course graded A, 3cr course graded B) and TermB with one 3cr section graded F."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "BS CS", required_credit_hours: 120, min_gpa: 2.0 }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Dr A", email: "a2@u.edu", gap_minutes: 0 }
              as: Registrar
              captures: { instr_id: $.data.id }
            - call: "POST /courses"
              payload: { code: "C4", title: "Four", credit_hours: 4, program_id: "${prog_id}" }
              as: Registrar
              captures: { c4_id: $.data.id }
            - call: "POST /courses"
              payload: { code: "C3", title: "Three", credit_hours: 3, program_id: "${prog_id}" }
              as: Registrar
              captures: { c3_id: $.data.id }
            - call: "POST /courses"
              payload: { code: "CF", title: "Fail", credit_hours: 3, program_id: "${prog_id}" }
              as: Registrar
              captures: { cf_id: $.data.id }
            - call: "POST /terms"
              payload: { name: "Term A", registration_opens_at: "2025-08-01T00:00:00Z", add_deadline: "2025-09-01T00:00:00Z", drop_deadline: "2025-09-15T00:00:00Z", withdraw_deadline: "2025-10-15T00:00:00Z", per_credit_cost_cents: 50000 }
              as: Registrar
              captures: { termA_id: $.data.id }
            - call: "POST /sections"
              payload: { term_id: "${termA_id}", course_id: "${c4_id}", instructor_id: "${instr_id}", section_code: "A4", seat_capacity: 5, meeting_days: "MWF", meeting_start_min: 540, meeting_end_min: 590 }
              as: Registrar
              captures: { secA4_id: $.data.id }
            - call: "POST /sections"
              payload: { term_id: "${termA_id}", course_id: "${c3_id}", instructor_id: "${instr_id}", section_code: "A3", seat_capacity: 5, meeting_days: "TR", meeting_start_min: 600, meeting_end_min: 650 }
              as: Registrar
              captures: { secA3_id: $.data.id }
            - call: "POST /terms/${termA_id}/status"
              payload: { to_status: "REGISTRATION_OPEN" }
              as: Registrar
            - call: "POST /students"
              payload: { full_name: "Stu G", email: "g@u.edu", program_id: "${prog_id}" }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /appointments"
              payload: { term_id: "${termA_id}", student_id: "${stu_id}", priority_tier: 1, window_opens_at: "2025-08-05T00:00:00Z", max_credit_hours: 18 }
              as: Registrar
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2025-08-10T00:00:00Z" }
              as: Registrar
            - call: "GET /sections/${secA4_id}"
              payload: {}
              as: Registrar
              captures: { vA4: $.data.version }
            - call: "POST /enrollments"
              payload: { term_id: "${termA_id}", section_id: "${secA4_id}", expected_section_version: "${vA4}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { enrA4_id: $.data.id }
            - call: "GET /sections/${secA3_id}"
              payload: {}
              as: Registrar
              captures: { vA3: $.data.version }
            - call: "POST /enrollments"
              payload: { term_id: "${termA_id}", section_id: "${secA3_id}", expected_section_version: "${vA3}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { enrA3_id: $.data.id }
            - call: "POST /terms/${termA_id}/status"
              payload: { to_status: "IN_SESSION" }
              as: Registrar
            - call: "POST /enrollments/${enrA4_id}/grade"
              payload: { letter_grade: "A" }
              as: Advisor
            - call: "POST /enrollments/${enrA3_id}/grade"
              payload: { letter_grade: "B" }
              as: Advisor
            - call: "POST /terms"
              payload: { name: "Term B", registration_opens_at: "2026-01-01T00:00:00Z", add_deadline: "2026-02-01T00:00:00Z", drop_deadline: "2026-02-15T00:00:00Z", withdraw_deadline: "2026-03-15T00:00:00Z", per_credit_cost_cents: 50000 }
              as: Registrar
              captures: { termB_id: $.data.id }
            - call: "POST /sections"
              payload: { term_id: "${termB_id}", course_id: "${cf_id}", instructor_id: "${instr_id}", section_code: "B3", seat_capacity: 5, meeting_days: "MWF", meeting_start_min: 540, meeting_end_min: 590 }
              as: Registrar
              captures: { secB3_id: $.data.id }
            - call: "POST /terms/${termB_id}/status"
              payload: { to_status: "REGISTRATION_OPEN" }
              as: Registrar
            - call: "POST /appointments"
              payload: { term_id: "${termB_id}", student_id: "${stu_id}", priority_tier: 1, window_opens_at: "2026-01-05T00:00:00Z", max_credit_hours: 18 }
              as: Registrar
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-01-10T00:00:00Z" }
              as: Registrar
            - call: "GET /sections/${secB3_id}"
              payload: {}
              as: Registrar
              captures: { vB3: $.data.version }
            - call: "POST /enrollments"
              payload: { term_id: "${termB_id}", section_id: "${secB3_id}", expected_section_version: "${vB3}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { enrB3_id: $.data.id }
            - call: "POST /terms/${termB_id}/status"
              payload: { to_status: "IN_SESSION" }
              as: Registrar
            - call: "POST /enrollments/${enrB3_id}/grade"
              payload: { letter_grade: "F" }
              as: Advisor
          trigger:
            - call: "GET /students/${stu_id}"
              payload: {}
              as: Registrar
              captures: { cum: $.data.gpa }
            - call: "GET /students/${stu_id}/transcript?term_id=${termA_id}"
              payload: {}
              as: Registrar
          assert:
            - "Student.${stu_id}.gpa == 2.50"
            - "GET /students/${stu_id}/transcript?term_id=${termA_id} -> data.term_gpa == 4.00"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: gpa_credit_weighted_nonlinear
        grounds:
          - calculations.cumulative_gpa
          - entities.Student.fields.gpa
          - entities.Course.fields.credit_hours
        distinguishing_aspect: "Mode (a): GPA is a credit-weighted ratio over >=3 graded enrollments where an F contributes 0 quality but its credits DO enter the denominator (nonlinear), so A(4cr)+B(3cr)+F(3cr)=2.50 not the unweighted mean."
        test_recipe:
          setup:
            - "Same graded state as gpa_cumulative_vs_term_scope: A(4cr), B(3cr), F(3cr) for one student."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "BS CS", required_credit_hours: 120, min_gpa: 2.0 }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Dr A", email: "a3@u.edu", gap_minutes: 0 }
              as: Registrar
              captures: { instr_id: $.data.id }
            - call: "POST /courses"
              payload: { code: "C4", title: "Four", credit_hours: 4, program_id: "${prog_id}" }
              as: Registrar
              captures: { c4_id: $.data.id }
            - call: "POST /courses"
              payload: { code: "C3", title: "Three", credit_hours: 3, program_id: "${prog_id}" }
              as: Registrar
              captures: { c3_id: $.data.id }
            - call: "POST /courses"
              payload: { code: "CF", title: "Fail", credit_hours: 3, program_id: "${prog_id}" }
              as: Registrar
              captures: { cf_id: $.data.id }
            - call: "POST /terms"
              payload: { name: "Term A", registration_opens_at: "2025-08-01T00:00:00Z", add_deadline: "2025-09-01T00:00:00Z", drop_deadline: "2025-09-15T00:00:00Z", withdraw_deadline: "2025-10-15T00:00:00Z", per_credit_cost_cents: 50000 }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /sections"
              payload: { term_id: "${term_id}", course_id: "${c4_id}", instructor_id: "${instr_id}", section_code: "S4", seat_capacity: 5, meeting_days: "MWF", meeting_start_min: 540, meeting_end_min: 590 }
              as: Registrar
              captures: { s4_id: $.data.id }
            - call: "POST /sections"
              payload: { term_id: "${term_id}", course_id: "${c3_id}", instructor_id: "${instr_id}", section_code: "S3", seat_capacity: 5, meeting_days: "TR", meeting_start_min: 600, meeting_end_min: 650 }
              as: Registrar
              captures: { s3_id: $.data.id }
            - call: "POST /sections"
              payload: { term_id: "${term_id}", course_id: "${cf_id}", instructor_id: "${instr_id}", section_code: "SF", seat_capacity: 5, meeting_days: "S", meeting_start_min: 600, meeting_end_min: 650 }
              as: Registrar
              captures: { sf_id: $.data.id }
            - call: "POST /terms/${term_id}/status"
              payload: { to_status: "REGISTRATION_OPEN" }
              as: Registrar
            - call: "POST /students"
              payload: { full_name: "Stu W", email: "w@u.edu", program_id: "${prog_id}" }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /appointments"
              payload: { term_id: "${term_id}", student_id: "${stu_id}", priority_tier: 1, window_opens_at: "2025-08-05T00:00:00Z", max_credit_hours: 18 }
              as: Registrar
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2025-08-10T00:00:00Z" }
              as: Registrar
            - call: "GET /sections/${s4_id}"
              payload: {}
              as: Registrar
              captures: { v4: $.data.version }
            - call: "POST /enrollments"
              payload: { term_id: "${term_id}", section_id: "${s4_id}", expected_section_version: "${v4}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { e4_id: $.data.id }
            - call: "GET /sections/${s3_id}"
              payload: {}
              as: Registrar
              captures: { v3: $.data.version }
            - call: "POST /enrollments"
              payload: { term_id: "${term_id}", section_id: "${s3_id}", expected_section_version: "${v3}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { e3_id: $.data.id }
            - call: "GET /sections/${sf_id}"
              payload: {}
              as: Registrar
              captures: { vf: $.data.version }
            - call: "POST /enrollments"
              payload: { term_id: "${term_id}", section_id: "${sf_id}", expected_section_version: "${vf}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { ef_id: $.data.id }
            - call: "POST /terms/${term_id}/status"
              payload: { to_status: "IN_SESSION" }
              as: Registrar
            - call: "POST /enrollments/${e4_id}/grade"
              payload: { letter_grade: "A" }
              as: Advisor
            - call: "POST /enrollments/${e3_id}/grade"
              payload: { letter_grade: "B" }
              as: Advisor
          trigger:
            - call: "POST /enrollments/${ef_id}/grade"
              payload: { letter_grade: "F" }
              as: Advisor
            - call: "GET /students/${stu_id}"
              payload: {}
              as: Registrar
          assert:
            - "Student.${stu_id}.gpa == 2.50"
            - "Student.${stu_id}.earned_credit_hours == 7"
            - "Student.${stu_id}.academic_standing == GOOD"

      - name: refund_per_item_round_then_sum_order
        grounds:
          - calculations.enrollment_refund
          - calculations.tuition_owed
          - entities.RefundTransaction.fields.amount_cents
        distinguishing_aspect: "Mode (b): refund rounding order is pinned — each RefundTransaction is rounded to integer cents independently (round_half_up) before entering the tuition_owed sum; a 99999-cent charge at 0.5 yields 49999.5 -> 50000, so owed = 99999 - 50000 = 49999."
        test_recipe:
          setup:
            - "Term with per_credit_cost_cents=33333 (odd cents); Course 3cr -> tuition 99999; student enrolled then withdrawn in the partial window."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "BS CS", required_credit_hours: 120, min_gpa: 2.0 }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Dr A", email: "a4@u.edu", gap_minutes: 0 }
              as: Registrar
              captures: { instr_id: $.data.id }
            - call: "POST /terms"
              payload: { name: "Odd Term", registration_opens_at: "2026-01-01T00:00:00Z", add_deadline: "2026-02-01T00:00:00Z", drop_deadline: "2026-02-15T00:00:00Z", withdraw_deadline: "2026-03-15T00:00:00Z", per_credit_cost_cents: 33333, refund_full_pct: 1.0, refund_partial_pct: 0.5 }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /courses"
              payload: { code: "OC3", title: "Odd", credit_hours: 3, program_id: "${prog_id}" }
              as: Registrar
              captures: { c_id: $.data.id }
            - call: "POST /sections"
              payload: { term_id: "${term_id}", course_id: "${c_id}", instructor_id: "${instr_id}", section_code: "001", seat_capacity: 5, meeting_days: "MWF", meeting_start_min: 540, meeting_end_min: 590 }
              as: Registrar
              captures: { sec_id: $.data.id }
            - call: "POST /terms/${term_id}/status"
              payload: { to_status: "REGISTRATION_OPEN" }
              as: Registrar
            - call: "POST /students"
              payload: { full_name: "Stu Odd", email: "odd@u.edu", program_id: "${prog_id}" }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /appointments"
              payload: { term_id: "${term_id}", student_id: "${stu_id}", priority_tier: 1, window_opens_at: "2026-01-05T00:00:00Z", max_credit_hours: 12 }
              as: Registrar
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-01-10T00:00:00Z" }
              as: Registrar
            - call: "GET /sections/${sec_id}"
              payload: {}
              as: Registrar
              captures: { sv: $.data.version }
            - call: "POST /enrollments"
              payload: { term_id: "${term_id}", section_id: "${sec_id}", expected_section_version: "${sv}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { enr_id: $.data.id }
          trigger:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-02-20T00:00:00Z" }
              as: Registrar
            - call: "POST /enrollments/${enr_id}/withdraw"
              payload: {}
              as: Student
              as_user_id: "${stu_id}"
            - call: "GET /students/${stu_id}"
              payload: {}
              as: Registrar
          assert:
            - "Enrollment.${enr_id}.refund_cents == 50000"
            - "Student.${stu_id}.tuition_owed_cents == 49999"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: enrollment_parallel_registration_x_grade
        grounds:
          - state_machines.Enrollment.ENROLLED_to_ENROLLED
          - entities.Enrollment.fields.registration_status
          - entities.Enrollment.fields.grade_status
        distinguishing_aspect: "On Enrollment: the grade_status axis advances UNGRADED->GRADED via the ENROLLED->ENROLLED self-loop while registration_status stays ENROLLED — two independent state dimensions on one row."
        test_recipe:
          setup:
            - "One student ENROLLED in a 3cr section, term IN_SESSION so grade entry is allowed."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "BS CS", required_credit_hours: 120, min_gpa: 2.0 }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Dr A", email: "a5@u.edu", gap_minutes: 0 }
              as: Registrar
              captures: { instr_id: $.data.id }
            - call: "POST /terms"
              payload: { name: "T", registration_opens_at: "2026-01-01T00:00:00Z", add_deadline: "2026-02-01T00:00:00Z", drop_deadline: "2026-02-15T00:00:00Z", withdraw_deadline: "2026-03-15T00:00:00Z", per_credit_cost_cents: 50000 }
              as: Registrar
              captures: { term_id: $.data.id }
