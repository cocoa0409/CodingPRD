  # ===========================================================================
  - section: calculations
    instances:

      - name: grade_assignment_exact_cut_off_boundaries
        claim_type: Correct Result
        grounds:
          - calculations.grade_assignment
          - constants.CUT_B
          - calculations.composite_score
        distinguishing_aspect: "Two hospitals scored under a methodology whose standardization span equals its peer_sd land exactly on the B cut-off: composite 62.50 reports B because the comparison is >=, while composite 62.49 reports C."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Two hospitals are pinned to a cut-off methodology M_CUT whose single measure has peer_sd 15.00, so the standardized value equals the domain score; each has 600 completed responses against 1000 sampled discharges."
          setup_api_calls:
            - *c_clock
            - *c_meth_b0
            - *c_meth_mg
            - *c_hp0
            - *c_pin_b0
            - *c_hp1
            - *c_rc_b0
            - &c_meth_cut
              call: "POST /hospital-safety-rating/methodology-versions"
              payload:
                label: "Cut-Off Methodology"
                publication_date: "2026-05-01T00:00:00Z"
                measure_definitions:
                  - { measure_code: "o1", domain: "PATIENT_SAFETY", scale_factor: 1.0, weight: 1.00, multiplier: 1.00, peer_mean: 50.00, peer_sd: 15.00, higher_is_better: true, derivation_rule: "NONE" }
              as: RatingAdmin
              captures: { meth_cut_id: $.data.id }
            - &c_hp_cut_hi
              call: "POST /hospital-safety-rating/hospitals"
              payload: { name: "Cut Hi Hospital", ccn: "262001", state_code: "MO", bed_count: 40, teaching_status: "NON_TEACHING", annual_discharges: 500, survey_contact_email: "cuthi@example.org" }
              as: RatingAdmin
              captures: { hi_id: $.data.id, hi_v0: $.data.version }
            - &c_hp_cut_lo
              call: "POST /hospital-safety-rating/hospitals"
              payload: { name: "Cut Lo Hospital", ccn: "262002", state_code: "MO", bed_count: 40, teaching_status: "NON_TEACHING", annual_discharges: 500, survey_contact_email: "cutlo@example.org" }
              as: RatingAdmin
              captures: { lo_id: $.data.id, lo_v0: $.data.version }
            - call: "POST /hospital-safety-rating/hospitals/${hi_id}/methodology-versions"
              payload: { methodology_version_id: "${meth_cut_id}" }
              as: RatingAdmin
            - call: "POST /hospital-safety-rating/hospitals/${lo_id}/methodology-versions"
              payload: { methodology_version_id: "${meth_cut_id}" }
              as: RatingAdmin
            - &c_rc_cut
              call: "POST /hospital-safety-rating/release-cycles"
              payload: { label: "Cut-Off Grades", methodology_version_id: "${meth_cut_id}", preliminary_release_date: "2026-06-01T00:00:00Z", correction_window_ends_at: "2026-06-30T00:00:00Z", publication_date: "2026-09-15T00:00:00Z" }
              as: RatingAdmin
              captures: { rc_cut_id: $.data.id }
            - call: "POST /hospital-safety-rating/hospitals/${hi_id}/surveys"
              payload: { started_survey_count: 800, completed_survey_count: 600, entity_annual_discharges: 1000, validation_method: "SOURCE_DOCUMENT" }
              as: HospitalRespondent
              as_user_id: "${hi_id}"
              captures: { shi_id: $.data.id }
            - call: "POST /hospital-safety-rating/hospitals/${hi_id}/survey-measures"
              payload: { survey_id: "${shi_id}", measure_code: "o1", raw_value: 62.50, source_program_id: "CMS_HOSPITAL_COMPARE" }
              as: HospitalRespondent
              as_user_id: "${hi_id}"
            - call: "POST /hospital-safety-rating/surveys/${shi_id}/submit"
              payload: {}
              as: HospitalRespondent
              as_user_id: "${hi_id}"
            - call: "POST /hospital-safety-rating/surveys/${shi_id}/verify"
              payload: { verification_response: "ACCEPT" }
              as: VerificationAnalyst
