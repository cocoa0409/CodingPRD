scaffold_corner_design:

  - section: entities
    instances:

      - name: create_borrower_applies_system_defaults_and_common_fields
        claim_type: creation
        grounds:
          - entities.Borrower
          - endpoints[POST /chattel/borrowers]
        distinguishing_aspect: "A bare borrower registration returns 201 with the four inputs echoed and every system/computed field seeded: status ACTIVE, total_outstanding_principal_cents 0, units_under_recovery_hold_count 0, version 1."
        test_recipe:
          setup:
            - "Empty database; the logical clock reads its 2026-08-01T00:00:00Z startup default."
          setup_api_calls: []
          trigger:
            - call: "POST /chattel/borrowers"
              payload: { full_name: "Dana Whitfield", credit_score: 705, monthly_income_cents: 520000, state_code: "GA" }
              as: PlatformAdmin
              captures: { b: "$.data.id" }
          assert:
            - "HTTP 201"
            - "Borrower.${b}.full_name == \"Dana Whitfield\" and credit_score == 705 and monthly_income_cents == 520000 and state_code == \"GA\""
            - "Borrower.${b}.status == ACTIVE"
            - "Borrower.${b}.total_outstanding_principal_cents == 0"
            - "Borrower.${b}.units_under_recovery_hold_count == 0"
            - "Borrower.${b}.version == 1 and id is a bare UUID with no type prefix and created_at is an ISO 8601 UTC instant with three fractional digits"
            - "the response envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == \"object\""

      - name: get_unit_returns_stored_inputs_and_system_defaults
        claim_type: retrieval
        grounds:
          - entities.ManufacturedUnit
          - endpoints[GET /chattel/units/{unit_id}]
          - endpoints[POST /chattel/units]
        distinguishing_aspect: "A freshly registered community unit reads back with all nine required inputs plus its placement fields intact, and with the four system flags at their declared seeds: deed_recorded false, affixation_affidavit_recorded false, classification PERSONAL_PROPERTY, title_status ACTIVE_TITLE, recovery_hold false."
        test_recipe:
          setup:
            - "One Community exists; one unit is placed on lot A-14 of that community."
          setup_api_calls:
            - call: "POST /chattel/communities"
              payload: { name: "Pine Ridge MHC", state_code: "GA", lot_count: 180, monthly_lot_rent_cents: 52000, sales_commission_bps: 150 }
              as: PlatformAdmin
              captures: { c: "$.data.id" }
            - call: "POST /chattel/units"
              payload: { hud_label_number: "ALB0412345", manufacturer: "Clayton", model_year: 2018, width_class: "MULTI_WIDE", square_feet: 1440, condition_grade: "GOOD", installation_type: "PIER_AND_ANCHOR", wind_zone: 2, placement_type: "COMMUNITY", community_id: "${c}", lot_number: "A-14", placement_start_date: "2026-08-01T00:00:00Z" }
              as: ClosingAgent
              captures: { u: "$.data.id" }
          trigger:
            - call: "GET /chattel/units/${u}"
              payload: {}
              as: Servicer
          assert:
            - "HTTP 200"
            - "ManufacturedUnit.${u}.hud_label_number == \"ALB0412345\" and square_feet == 1440 and wind_zone == 2 and width_class == MULTI_WIDE and condition_grade == GOOD and installation_type == PIER_AND_ANCHOR"
            - "ManufacturedUnit.${u}.placement_type == COMMUNITY and community_id == ${c} and lot_number == \"A-14\" and placement_start_date == 2026-08-01T00:00:00Z"
            - "ManufacturedUnit.${u}.placement_end_date == null and land_owner_borrower_id == null and land_parcel_apn == null and land_county == null and land_value_cents == null"
            - "ManufacturedUnit.${u}.deed_recorded == false and affixation_affidavit_recorded == false"
            - "ManufacturedUnit.${u}.classification == PERSONAL_PROPERTY and title_status == ACTIVE_TITLE and recovery_hold == false"
            - "ManufacturedUnit.${u}.version == 1"

      - name: list_units_by_community_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /chattel/units]
          - response_envelope.pagination_fields
        distinguishing_aspect: "Three units in one community and one in another: the community_id filter narrows total_count to 3, limit 2 / offset 0 returns 2 rows with has_more true, and offset 2 returns the last row with has_more false."
        test_recipe:
          setup:
            - "Two Communities; three units on distinct lots of the first, one unit on the second."
          setup_api_calls:
            - call: "POST /chattel/communities"
              payload: { name: "Pine Ridge MHC", state_code: "GA", lot_count: 180, monthly_lot_rent_cents: 52000, sales_commission_bps: 150 }
              as: PlatformAdmin
              captures: { c1: "$.data.id" }
            - call: "POST /chattel/communities"
              payload: { name: "Cypress Landing MHC", state_code: "GA", lot_count: 96, monthly_lot_rent_cents: 48000, sales_commission_bps: 200 }
              as: PlatformAdmin
              captures: { c2: "$.data.id" }
            - call: "POST /chattel/units"
              payload: { hud_label_number: "ALB0500001", manufacturer: "Clayton", model_year: 2018, width_class: "MULTI_WIDE", square_feet: 1440, condition_grade: "GOOD", installation_type: "PIER_AND_ANCHOR", wind_zone: 2, placement_type: "COMMUNITY", community_id: "${c1}", lot_number: "A-01", placement_start_date: "2026-08-01T00:00:00Z" }
              as: ClosingAgent
              captures: { ua: "$.data.id" }
            - call: "POST /chattel/units"
              payload: { hud_label_number: "ALB0500002", manufacturer: "Clayton", model_year: 2019, width_class: "MULTI_WIDE", square_feet: 1440, condition_grade: "GOOD", installation_type: "PIER_AND_ANCHOR", wind_zone: 2, placement_type: "COMMUNITY", community_id: "${c1}", lot_number: "A-02", placement_start_date: "2026-08-01T00:00:00Z" }
              as: ClosingAgent
              captures: { ub: "$.data.id" }
            - call: "POST /chattel/units"
              payload: { hud_label_number: "ALB0500003", manufacturer: "Fleetwood", model_year: 2015, width_class: "SINGLE_WIDE", square_feet: 1080, condition_grade: "FAIR", installation_type: "PIER_AND_ANCHOR", wind_zone: 2, placement_type: "COMMUNITY", community_id: "${c1}", lot_number: "A-03", placement_start_date: "2026-08-01T00:00:00Z" }
              as: ClosingAgent
              captures: { uc: "$.data.id" }
            - call: "POST /chattel/units"
              payload: { hud_label_number: "ALB0500004", manufacturer: "Champion", model_year: 2020, width_class: "MULTI_WIDE", square_feet: 1600, condition_grade: "GOOD", installation_type: "PIER_AND_ANCHOR", wind_zone: 2, placement_type: "COMMUNITY", community_id: "${c2}", lot_number: "B-01", placement_start_date: "2026-08-01T00:00:00Z" }
              as: ClosingAgent
              captures: { ud: "$.data.id" }
          trigger:
            - call: "GET /chattel/units"
              payload: { community_id: "${c1}", limit: 2, offset: 0 }
              as: PlatformAdmin
            - call: "GET /chattel/units"
              payload: { community_id: "${c1}", limit: 2, offset: 2 }
              as: PlatformAdmin
          assert:
            - "first page: HTTP 200, response_type == \"array\", total_count == 3, has_more == true, limit == 2, offset == 0, and exactly 2 rows are returned"
            - "second page: total_count == 3, has_more == false, offset == 2, and exactly 1 row is returned"
            - "${ud} never appears in either page (the community_id filter excludes the other community's unit)"
            - "the union of both pages is exactly {${ua}, ${ub}, ${uc}}"

      - name: get_loan_with_unknown_uuid_returns_loan_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_LOAN_NOT_FOUND]
          - endpoints[GET /chattel/loans/{loan_id}]
        distinguishing_aspect: "A syntactically valid UUID that names no Loan returns ERR_LOAN_NOT_FOUND with HTTP 404 in the error envelope, not an empty 200 body."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /chattel/loans/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Servicer
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_LOAN_NOT_FOUND with HTTP 404"
            - "the body is the error envelope: response_type == \"error\", data.error_id and data.message present, no entity fields"

      - name: create_unit_missing_required_square_feet_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.ManufacturedUnit.fields.square_feet
          - validations[priority=6]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "square_feet has source input with no default, so omitting it is a request-shape failure at priority 6 (ERR_INVALID_REQUEST, 422) and no ManufacturedUnit row is created."
        test_recipe:
          setup:
            - "One Community exists to host the placement."
          setup_api_calls:
            - call: "POST /chattel/communities"
              payload: { name: "Pine Ridge MHC", state_code: "GA", lot_count: 180, monthly_lot_rent_cents: 52000, sales_commission_bps: 150 }
              as: PlatformAdmin
              captures: { c: "$.data.id" }
          trigger:
            - call: "POST /chattel/units"
              payload: { hud_label_number: "ALB0512345", manufacturer: "Clayton", model_year: 2018, width_class: "MULTI_WIDE", condition_grade: "GOOD", installation_type: "PIER_AND_ANCHOR", wind_zone: 2, placement_type: "COMMUNITY", community_id: "${c}", lot_number: "A-14", placement_start_date: "2026-08-01T00:00:00Z" }
              as: ClosingAgent
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_INVALID_REQUEST with HTTP 422"
            - "GET /chattel/units?community_id=${c} has total_count 0"

      - name: create_community_omitting_sales_commission_bps_applies_zero_default
        claim_type: defaults
        grounds:
          - endpoints[POST /chattel/communities]
          - entities.Community.fields.sales_commission_bps
          - entities.Community.fields.operator_agreement_status
          - entities.Community.fields.lender_access_rights
        distinguishing_aspect: "sales_commission_bps is the only optional input on the community registration; omitting it stores 0 (not null), which is what calculations.deficiency_settlement adds to the commission tier, while operator_agreement_status seeds to NONE, lender_access_rights to false and agreement_executed_at to null."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /chattel/communities"
              payload: { name: "Riverbend Estates", state_code: "GA", lot_count: 64, monthly_lot_rent_cents: 45000 }
              as: PlatformAdmin
              captures: { c: "$.data.id" }
          assert:
            - "HTTP 201"
            - "Community.${c}.sales_commission_bps == 0"
            - "Community.${c}.operator_agreement_status == NONE"
            - "Community.${c}.lender_access_rights == false"
            - "Community.${c}.agreement_executed_at == null"
            - "Community.${c}.version == 1"

      - name: book_value_guide_carries_no_version_field_and_no_mutation_endpoint
        claim_type: immutability
        grounds:
          - entities.BookValueGuide
          - endpoints[POST /chattel/book-value-guides]
          - endpoints[GET /chattel/book-value-guides/{guide_id}]
        distinguishing_aspect: "BookValueGuide is declared common_fields: false, so the created edition exposes only id and created_at as common fields - no version, no updated_at - and §1.5 declares no update or delete endpoint for it, so a published edition can only be superseded by publishing another."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /chattel/book-value-guides"
              payload: { guide_edition: "NADA-2026-SPRING", region_code: "SOUTH_ATLANTIC", effective_date: "2026-01-01T00:00:00Z", base_value_per_sqft_cents: 4500, single_wide_multiplier_bps: 10000, multi_wide_multiplier_bps: 11500, annual_depreciation_bps: 350 }
              as: PlatformAdmin
              captures: { g: "$.data.id" }
          trigger:
            - call: "GET /chattel/book-value-guides/${g}"
              payload: {}
              as: CreditAnalyst
          assert:
            - "HTTP 200"
            - "BookValueGuide.${g} exposes id and created_at but NO version field and NO updated_at field"
            - "BookValueGuide.${g}.base_value_per_sqft_cents == 4500 and annual_depreciation_bps == 350 and effective_date == 2026-01-01T00:00:00Z"
            - "§1.5 declares no PATCH, PUT or DELETE on /chattel/book-value-guides/{guide_id}"

      - name: create_loan_with_unknown_borrower_id_returns_borrower_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Loan.fields.borrower_id
          - errors[ERR_BORROWER_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "The loan's borrower_id is an FK -> Borrower.id: a well-formed UUID that resolves to no Borrower is caught at priority 4 with ERR_BORROWER_NOT_FOUND (404), ahead of every ERR_INVALID_REQUEST shape rule and ahead of the valuation checks, even though unit_id and origination_valuation_id are perfectly valid."
        test_recipe:
          setup:
            - "A community unit with a CERTIFIED ORIGINATION valuation exists, so only borrower_id is unresolvable."
          setup_api_calls:
            - call: "POST /chattel/book-value-guides"
              payload: { guide_edition: "NADA-2026-SPRING", region_code: "SOUTH_ATLANTIC", effective_date: "2026-01-01T00:00:00Z", base_value_per_sqft_cents: 4500, single_wide_multiplier_bps: 10000, multi_wide_multiplier_bps: 11500, annual_depreciation_bps: 350 }
              as: PlatformAdmin
              captures: { g: "$.data.id" }
            - call: "POST /chattel/communities"
              payload: { name: "Pine Ridge MHC", state_code: "GA", lot_count: 180, monthly_lot_rent_cents: 52000, sales_commission_bps: 150 }
              as: PlatformAdmin
              captures: { c: "$.data.id" }
            - call: "POST /chattel/units"
              payload: { hud_label_number: "ALB0412345", manufacturer: "Clayton", model_year: 2018, width_class: "MULTI_WIDE", square_feet: 1440, condition_grade: "GOOD", installation_type: "PIER_AND_ANCHOR", wind_zone: 2, placement_type: "COMMUNITY", community_id: "${c}", lot_number: "A-14", placement_start_date: "2026-08-01T00:00:00Z" }
              as: ClosingAgent
              captures: { u: "$.data.id", u_v: "$.data.version" }
            - call: "POST /chattel/valuations"
              payload: { unit_id: "${u}", guide_id: "${g}", variant: "ORIGINATION", expected_unit_version: "${u_v}" }
              as: CreditAnalyst
              captures: { v: "$.data.id" }
            - call: "POST /chattel/valuations/${v}/certify"
              payload: {}
              as: CreditAnalyst
              as_user_id: "analyst-val-01"
          trigger:
            - call: "POST /chattel/loans"
              payload: { borrower_id: "00000000-0000-4000-8000-0000000000bb", unit_id: "${u}", origination_valuation_id: "${v}", principal_cents: 4600000, requested_term_months: 240 }
              as: CreditAnalyst
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_BORROWER_NOT_FOUND with HTTP 404"
            - "GET /chattel/loans?unit_id=${u} has total_count 0"
            - "Valuation.${v}.status == CERTIFIED is untouched by the rejected application"

      - name: create_unit_with_undeclared_width_class_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.ManufacturedUnit.fields.width_class
          - validations[priority=6]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "width_class constrains to {SINGLE_WIDE, MULTI_WIDE}; the plausible-looking value TRIPLE_WIDE is an undeclared enum member, which priority 6 refuses with ERR_INVALID_REQUEST rather than silently falling back to the single-wide multiplier."
        test_recipe:
          setup:
            - "One Community exists to host the placement."
          setup_api_calls:
            - call: "POST /chattel/communities"
              payload: { name: "Pine Ridge MHC", state_code: "GA", lot_count: 180, monthly_lot_rent_cents: 52000, sales_commission_bps: 150 }
              as: PlatformAdmin
              captures: { c: "$.data.id" }
          trigger:
            - call: "POST /chattel/units"
              payload: { hud_label_number: "ALB0512399", manufacturer: "Clayton", model_year: 2018, width_class: "TRIPLE_WIDE", square_feet: 2100, condition_grade: "GOOD", installation_type: "PIER_AND_ANCHOR", wind_zone: 2, placement_type: "COMMUNITY", community_id: "${c}", lot_number: "A-15", placement_start_date: "2026-08-01T00:00:00Z" }
              as: ClosingAgent
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_INVALID_REQUEST with HTTP 422"
            - "GET /chattel/units?community_id=${c} has total_count 0"

      - name: create_unit_rejects_client_supplied_system_field_classification
        claim_type: system_fields
        grounds:
          - entities.ManufacturedUnit.fields.classification
          - endpoints[POST /chattel/units]
          - validations[priority=6]
        distinguishing_aspect: "classification is source: system and is NOT in the endpoint's declared input list, so a client attempting to open the unit straight into REAL_PROPERTY is refused with ERR_INVALID_REQUEST - the only route to REAL_PROPERTY is the convert-classification state machine."
        test_recipe:
          setup:
            - "One Community exists to host the placement."
          setup_api_calls:
            - call: "POST /chattel/communities"
              payload: { name: "Pine Ridge MHC", state_code: "GA", lot_count: 180, monthly_lot_rent_cents: 52000, sales_commission_bps: 150 }
              as: PlatformAdmin
              captures: { c: "$.data.id" }
          trigger:
            - call: "POST /chattel/units"
              payload: { hud_label_number: "ALB0512400", manufacturer: "Clayton", model_year: 2018, width_class: "MULTI_WIDE", square_feet: 1440, condition_grade: "GOOD", installation_type: "PERMANENT_FOUNDATION", wind_zone: 2, placement_type: "COMMUNITY", community_id: "${c}", lot_number: "A-16", placement_start_date: "2026-08-01T00:00:00Z", classification: "REAL_PROPERTY" }
              as: ClosingAgent
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_INVALID_REQUEST with HTTP 422 (undeclared payload key for this endpoint)"
            - "GET /chattel/units?community_id=${c} has total_count 0"
            - "no ManufacturedUnit exists with classification == REAL_PROPERTY at any point in this test"

      - name: valuation_computed_breakdown_fields_are_derived_not_supplied
        claim_type: computed_fields
        grounds:
          - entities.Valuation.fields.book_base_cents
          - entities.Valuation.fields.certified_value_cents
        excluded_because:
          difficulty_instance: dual_variant_calc / valuation_origination_vs_recovery_liquidation_on_one_unit
          rationale: "That §1.8 instance asserts book_base_cents, all three adjustment fields, both liquidation deductions and certified_value_cents as literals for both variants on one unit, with only unit_id/guide_id/variant supplied by the client."

      - name: unit_placement_fk_integrity_across_flat_topology
        claim_type: parent_relationships
        grounds:
          - entities.ManufacturedUnit.fields.community_id
          - entities.ManufacturedUnit.fields.land_owner_borrower_id
          - validations[priority=13]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / lot_occupancy_turnover_buffer_boundary
          rationale: "That §1.8 instance drives four unit creations against one community, proving the (community_id, lot_number) association is resolved and enforced per parent rather than globally."

  - section: state_machines
    instances:

      - name: new_loan_starts_draft_not_servicing_unperfected
        claim_type: initial_state
        grounds:
          - state_machines[Loan.underwriting_state].initial_state
          - state_machines[Loan.servicing_state].initial_state
          - state_machines[Loan.perfection_state].initial_state
          - endpoints[POST /chattel/loans]
        distinguishing_aspect: "All three of the Loan's independent state dimensions are seeded on creation - DRAFT / NOT_SERVICING / UNPERFECTED - and the priced fields ltv_bps, apr_bps and term_months stay null because loan_rate_and_term is triggered by submit-underwriting, not by creation."
        test_recipe:
          setup:
            - "A CERTIFIED ORIGINATION valuation exists on a community unit; the borrower is ACTIVE; no loan exists yet."
          setup_api_calls:
            - call: "POST /chattel/book-value-guides"
              payload: { guide_edition: "NADA-2026-SPRING", region_code: "SOUTH_ATLANTIC", effective_date: "2026-01-01T00:00:00Z", base_value_per_sqft_cents: 4500, single_wide_multiplier_bps: 10000, multi_wide_multiplier_bps: 11500, annual_depreciation_bps: 350 }
              as: PlatformAdmin
              captures: { g: "$.data.id" }
            - call: "POST /chattel/borrowers"
              payload: { full_name: "Dana Whitfield", credit_score: 705, monthly_income_cents: 520000, state_code: "GA" }
              as: PlatformAdmin
              captures: { b: "$.data.id" }
            - call: "POST /chattel/communities"
              payload: { name: "Pine Ridge MHC", state_code: "GA", lot_count: 180, monthly_lot_rent_cents: 52000, sales_commission_bps: 150 }
              as: PlatformAdmin
              captures: { c: "$.data.id" }
            - call: "POST /chattel/units"
              payload: { hud_label_number: "ALB0412345", manufacturer: "Clayton", model_year: 2018, width_class: "MULTI_WIDE", square_feet: 1440, condition_grade: "GOOD", installation_type: "PIER_AND_ANCHOR", wind_zone: 2, placement_type: "COMMUNITY", community_id: "${c}", lot_number: "A-14", placement_start_date: "2026-08-01T00:00:00Z" }
              as: ClosingAgent
              captures: { u: "$.data.id", u_v: "$.data.version" }
            - call: "POST /chattel/valuations"
              payload: { unit_id: "${u}", guide_id: "${g}", variant: "ORIGINATION", expected_unit_version: "${u_v}" }
              as: CreditAnalyst
              captures: { v: "$.data.id" }
            - call: "POST /chattel/valuations/${v}/certify"
              payload: {}
              as: CreditAnalyst
              as_user_id: "analyst-val-01"
              captures: { v_cert: "$.data.certified_value_cents" }
          trigger:
            - call: "POST /chattel/loans"
              payload: { borrower_id: "${b}", unit_id: "${u}", origination_valuation_id: "${v}", principal_cents: 4600000, requested_term_months: 240 }
              as: CreditAnalyst
              captures: { l: "$.data.id" }
          assert:
            - "HTTP 201"
            - "Loan.${l}.underwriting_state == DRAFT"
            - "Loan.${l}.servicing_state == NOT_SERVICING"
            - "Loan.${l}.perfection_state == UNPERFECTED"
            - "Loan.${l}.collateral_classification == PERSONAL_PROPERTY and placement_type == COMMUNITY (snapshotted from the unit)"
            - "Loan.${l}.ltv_bps == null and apr_bps == null and term_months == null"
            - "Loan.${l}.principal_balance_cents == 0 and interest_accrued_unpaid_cents == 0 and fees_outstanding_cents == 0 and escrow_balance_cents == 0 and force_placed_premium_outstanding_cents == 0"
            - "Loan.${l}.insurance_compliance == UNKNOWN and lot_rent_months_delinquent == 0 and lot_rent_state == CURRENT and delinquent_days == 0"
            - "Loan.${l}.next_due_date == null and last_accrual_date == null and funded_at == null and approved_by_user_id == null"
            - "Loan.${l}.version == 1"
            - "Borrower.${b}.total_outstanding_principal_cents == 0 (an unfunded loan contributes nothing)"

      - name: decline_moves_underwriting_state_to_declined
        claim_type: valid_transition
        grounds:
          - state_machines[Loan.underwriting_state].transitions[UNDERWRITING -> DECLINED]
          - endpoints[POST /chattel/loans/{loan_id}/decline]
        distinguishing_aspect: "The UNDERWRITING -> DECLINED arm of the underwriting fork fires without touching the other two dimensions: servicing_state stays NOT_SERVICING and perfection_state stays UNPERFECTED, while the ltv/apr/term already computed at submit-underwriting (8779 / 1350 / 240) are preserved on the declined record."
        test_recipe:
          setup:
            - "A loan on a community unit whose community has NO executed operator agreement, so location_key is COMMUNITY_WITHOUT_AGREEMENT and certified_value_cents is 5239859; principal 4600000 gives ltv_bps 8779 (inside the 9500 cap) so submit-underwriting succeeds."
          setup_api_calls:
            - call: "POST /chattel/book-value-guides"
