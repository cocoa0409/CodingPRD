  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: no_show_forfeits_its_seat_credit_while_withdrawal_returns_one_to_the_balance
        grounds:
          - state_machines.Enrollment.REGISTERED_to_NO_SHOW
          - state_machines.Enrollment.REGISTERED_to_WITHDRAWN
          - calculations.seat_credit_ledger
          - entities.EmployerAccount.fields.seat_credits_refunded_total
        distinguishing_aspect: |
          Two structurally identical sponsored seats end in opposite ledger outcomes from
          the same locked roster: the NO_SHOW keeps seat_credit_charged true and returns
          nothing, while the WITHDRAWN seat flips seat_credit_charged to false and adds one
          back. The invariant balance == purchased - consumed + refunded therefore has to
          reconcile with a non-zero forfeit term (81 - 2 + 1 == 80), which a blanket
          "release the seat on any exit" implementation would break.
        test_recipe:
          setup:
            - "TX jurisdiction, one published+APPROVED ON_PREMISE course, one CERTIFIED trainer, one class session on 2026-08-10."
            - "Employer Lone Star Taverns LLC bought 80 seats at 2500 cents each, receiving one bonus seat, so seat_credit_balance is 81."
            - "The employer sponsored Ari Cole and Bo Nakamura into the session (balance 79, consumed 2) and the trainer locked the roster."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ProgramAdmin
