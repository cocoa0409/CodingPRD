      - call: POST /wound-care/patients
        payload:
          mrn: M5
          full_name: Pat 5
          payer_policy_id: ${policy_id}
          center_id: ${center_id}
        as: IntakeCoordinator
        captures:
          patient_id: $.data.id
      - call: POST /wound-care/wound-assessments
        payload:
          stage: STAGE_2
          length_cm: 2
          width_cm: 2
          tissue_type: GRANULATION
          patient_id: ${patient_id}
        as: WoundClinician
        as_user_id: ${wc_id}
        captures:
          base_asm_id: $.data.id
      - call: POST /wound-care/treatment-plans
        payload:
          baseline_assessment_id: ${base_asm_id}
          debridement_supply_budget_cents: 100000
          patient_id: ${patient_id}
        as: WoundClinician
        as_user_id: ${wc_id}
        captures:
          plan_id: $.data.id
      - call: POST /wound-care/prior-authorizations
        payload:
          requested_hbo_sessions: 3
          clinical_justification: need HBO
          treatment_plan_id: ${plan_id}
        as: PayerLiaison
        captures:
          auth_id: $.data.id
      - call: POST /wound-care/prior-authorizations/${auth_id}/request-info
