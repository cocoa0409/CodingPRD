scenario: |
  generate task hard than expert level! 1183. School Counseling & Master Schedule Building
  (high school counseling office): course request collection & tally, section count &
  teacher/room allocation, conflict resolution & singleton course placement, balancing
  class size & special-program cohorts, schedule change request window & rules, counselor
  caseload & appointment scheduling, credit-deficiency detection & recovery placement,
  mid-year rebalancing

domain_name: school-counseling-master-schedule
api_prefix: /scheduling

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - ops_run_checkpoint
    - optimistic_concurrency
  entity_topology: graph
  state_machine_shape: compound
  relationship_patterns:
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: AcademicTerm
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Unique term code, e.g. '2026-FALL'."
        constraints: "Unique across all AcademicTerm rows."
      - name: posture
        type: enum
        source: computed
        description: "Aggregate lifecycle posture gating every child operation: COLLECTING, TALLYING, BUILDING, PUBLISHED, CHANGE_WINDOW, LOCKED, REBALANCING."
        default: COLLECTING
        constraints: "One of COLLECTING | TALLYING | BUILDING | PUBLISHED | CHANGE_WINDOW | LOCKED | REBALANCING."
      - name: periods_per_day
        type: integer
        source: input
        description: "Number of bell periods in the school day; the master grid has exactly this many period slots."
        constraints: "4 <= periods_per_day <= 10. Immutable once posture leaves COLLECTING."
      - name: max_students_per_section
        type: integer
        source: input
        description: "Hard seat ceiling for every Section in this term."
        constraints: "1 <= max_students_per_section <= 40."
      - name: class_size_target
        type: integer
        source: input
        description: "Soft balancing target used by rebalance scoring; must be < max_students_per_section."
        constraints: "1 <= class_size_target < max_students_per_section."
      - name: singleton_section_cap
        type: integer
        source: input
        description: "Maximum number of singleton sections (courses with exactly one section) a student may hold. 0 means singletons unrestricted."
        constraints: "0 <= singleton_section_cap <= periods_per_day."
        default: 2
      - name: change_window_open
        type: boolean
        source: system
        description: "Derived: true iff posture == CHANGE_WINDOW."
        default: false
      - name: change_request_max_per_student
        type: integer
        source: input
        description: "Cap on ScheduleChangeRequest rows in state APPROVED per student per term."
        constraints: ">= 1."
        default: 3
      - name: rebalance_epoch
        type: integer
        source: system
        description: "Monotonically increasing epoch bumped by each RebalanceRun; ScheduleEntry rows record the epoch that last moved them."
        default: 0
      - name: total_requested_seats
        type: integer
        source: computed
        description: "Tally of CourseRequest rows in state SUBMITTED or LOCKED for this term. Recomputed on every request mutation."
        default: 0

  - name: Student
    parent: null
    common_fields: true
    fields:
      - name: external_ref
        type: string
        source: input
        description: "District student number; unique."
        constraints: "Unique; 4-32 chars."
      - name: full_name
        type: string
        source: input
        description: "Display name."
      - name: grade_level
        type: integer
        source: input
        description: "Grade for the current year: 9, 10, 11, or 12."
        constraints: "grade_level IN {9,10,11,12}."
      - name: special_program
        type: enum
        source: input
        description: "Cohort tag controlling cohort-balancing rules."
        default: NONE
        constraints: "One of NONE | IEP | ELL | GIFTED | ATHLETE."
      - name: counselor_id
        type: string
        source: input
        description: "FK -> Counselor.id; the counselor who owns this student's caseload."
      - name: earned_credits
        type: number
        source: input
        description: "Lifetime credits earned before this term, 2-decimal fixed precision."
        default: 0
        constraints: ">= 0, 2 decimal places."
      - name: planned_credit_load
        type: number
        source: computed
        description: "Sum of Course.credits over the student's ScheduleEntry rows in state ENROLLED for the active term, recomputed on every enrollment mutation."
        default: 0
      - name: credit_deficient
        type: boolean
        source: computed
        description: "Derived from the latest CreditAudit for this student: true iff that audit's deficiency_credits > 0."
        default: false

  - name: Counselor
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Display name."
      - name: max_caseload
        type: integer
        source: input
        description: "Maximum students this counselor may own."
        constraints: ">= 1."
      - name: caseload_count
        type: integer
        source: computed
        description: "Count of Student rows with counselor_id == this Counselor and student status not WITHDRAWN. Recomputed on assignment and withdrawal."
        default: 0

  - name: Teacher
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Display name."
      - name: max_sections
        type: integer
        source: input
        description: "Maximum sections this teacher may teach per term."
        constraints: ">= 1."
      - name: assigned_section_count
        type: integer
        source: computed
        description: "Count of Section rows in state SCHEDULED or PUBLISHED with teacher_id == this Teacher in the active term. Recomputed on section create/cancel/rebalance."
        default: 0

  - name: TeacherQualification
    parent: null
    common_fields: false
    fields:
      - name: teacher_id
        type: string
        source: input
        description: "FK -> Teacher.id; qualified teacher."
      - name: course_id
        type: string
        source: input
        description: "FK -> Course.id; course the teacher is qualified to teach."
      - name: qualified_at
        type: datetime
        source: input
        description: "ISO8601 timestamp when qualification was recorded; used as deterministic tie-break when multiple teachers are eligible for the same section."

  - name: Room
    parent: null
    common_fields: true
    fields:
      - name: room_number
        type: string
        source: input
        description: "Unique room identifier, e.g. 'B-204'."
        constraints: "Unique."
      - name: capacity
        type: integer
        source: input
        description: "Physical seat count; a section's capacity may not exceed its room's capacity."
        constraints: ">= 1."
      - name: room_type
        type: enum
        source: input
        description: "Room category controlling course-to-room compatibility."
        default: STANDARD
        constraints: "One of STANDARD | LAB | GYM | STUDIO."

  - name: Course
    parent: null
    common_fields: true
    fields:
      - name: course_code
        type: string
        source: input
        description: "Catalog code, e.g. 'MATH-301'. Unique."
        constraints: "Unique."
      - name: title
        type: string
        source: input
        description: "Display title."
      - name: credits
        type: number
        source: input
        description: "Credit value awarded on completion, 2-decimal fixed precision."
        constraints: "0.25 <= credits <= 2.00, in 0.25 steps."
      - name: subject_area
        type: enum
        source: input
        description: "Graduation bucket used by credit-deficiency detection."
        constraints: "One of ENGLISH | MATH | SCIENCE | SOCIAL_STUDIES | WORLD_LANGUAGE | PE_HEALTH | ARTS | ELECTIVE."
      - name: required_room_type
        type: enum
        source: input
        description: "Room category this course's sections must occupy."
        default: STANDARD
        constraints: "One of STANDARD | LAB | GYM | STUDIO."
      - name: singleton
        type: boolean
        source: input
        description: "True iff the school offers exactly one section of this course per term (singleton placement rules apply)."
        default: false
      - name: grade_band_min
        type: integer
        source: input
        description: "Lowest grade_level allowed to request this course."
        constraints: "9 <= grade_band_min <= 12."
      - name: grade_band_max
        type: integer
        source: input
        description: "Highest grade_level allowed to request this course."
        constraints: "grade_band_min <= grade_band_max <= 12."
      - name: special_program_exclusive
        type: enum
        source: input
        description: "If not NONE, only students whose special_program equals this value may enroll."
        default: NONE
        constraints: "One of NONE | IEP | ELL | GIFTED | ATHLETE."
      - name: prerequisite_course_id
        type: string
        source: input
        description: "FK -> Course.id; optional single-prerequisite chain head (self-referential). Null for entry courses."
        default: null

  - name: CourseRequest
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; requesting student."
      - name: course_id
        type: string
        source: input
        description: "FK -> Course.id; requested course."
      - name: term_id
        type: string
        source: input
        description: "FK -> AcademicTerm.id; term the request applies to."
      - name: priority_rank
        type: integer
        source: input
        description: "1 = highest. Ranks must form a contiguous 1..N sequence per (student_id, term_id) over non-alternate requests."
        constraints: ">= 1."
      - name: is_alternate
        type: boolean
        source: input
        description: "True iff this is an alternate used only when a higher-ranked primary cannot be placed."
        default: false
      - name: state
        type: enum
        source: system
        description: "Lifecycle: DRAFT, SUBMITTED, LOCKED, PLACED, UNPLACED, WITHDRAWN."
        default: DRAFT
        constraints: "One of DRAFT | SUBMITTED | LOCKED | PLACED | UNPLACED | WITHDRAWN."
      - name: tally_weight
        type: number
        source: computed
        description: "Weight contributed to the course tally: 1.0 for primary SUBMITTED/LOCKED requests, 0.5 for alternates, 0 otherwise."
        default: 0

  - name: Section
    parent: null
    common_fields: true
    fields:
      - name: term_id
        type: string
        source: input
        description: "FK -> AcademicTerm.id; owning term."
      - name: course_id
        type: string
        source: input
        description: "FK -> Course.id; course taught."
      - name: teacher_id
        type: string
        source: input
        description: "FK -> Teacher.id; assigned teacher. Null only while state == DRAFT."
        default: null
      - name: room_id
        type: string
        source: input
        description: "FK -> Room.id; assigned room. Null only while state == DRAFT."
        default: null
      - name: period
        type: integer
        source: input
        description: "Bell period occupied on the master grid, 1-indexed."
        constraints: "1 <= period <= term.periods_per_day."
      - name: capacity
        type: integer
        source: input
        description: "Seat ceiling for this section; <= min(term.max_students_per_section, room.capacity)."
        constraints: ">= 1."
      - name: enrolled_count
        type: integer
        source: computed
        description: "Count of ScheduleEntry rows in state ENROLLED for this section. Recomputed on enrollment mutations."
        default: 0
      - name: cohort_counts
        type: object
        source: computed
        description: "Map special_program -> enrolled count for cohort balancing. Keys from {NONE, IEP, ELL, GIFTED, ATHLETE}."
        default: {}
      - name: state
        type: enum
        source: system
        description: "Lifecycle: DRAFT, SCHEDULED, PUBLISHED, CANCELLED."
        default: DRAFT
        constraints: "One of DRAFT | SCHEDULED | PUBLISHED | CANCELLED."
      - name: under_enrolled
        type: boolean
        source: computed
        description: "True iff enrolled_count < ceil(0.5 * capacity). Drives mid-year consolidation candidacy."
        default: false

  - name: ScheduleEntry
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; enrolled student."
      - name: section_id
        type: string
        source: input
        description: "FK -> Section.id; assigned section."
      - name: term_id
        type: string
        source: input
        description: "FK -> AcademicTerm.id; denormalized from Section.term_id for query locality."
      - name: state
        type: enum
        source: system
        description: "Lifecycle: ENROLLED, DROPPED, MOVED."
        default: ENROLLED
        constraints: "One of ENROLLED | DROPPED | MOVED."
      - name: origin
        type: enum
        source: system
        description: "How the entry was created: AUTO_PLACEMENT, CHANGE_REQUEST, RECOVERY_PLACEMENT, REBALANCE."
        constraints: "One of AUTO_PLACEMENT | CHANGE_REQUEST | RECOVERY_PLACEMENT | REBALANCE."
      - name: moved_to_section_id
        type: string
        source: system
        description: "FK -> Section.id; set only when state == MOVED — the section the student was moved to."
        default: null
      - name: epoch_placed
        type: integer
        source: system
        description: "AcademicTerm.rebalance_epoch at the moment this entry became ENROLLED; used by mid-year rebalancing to avoid moving students twice in one epoch."
        default: 0

  - name: ScheduleChangeRequest
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; requesting student."
      - name: term_id
        type: string
        source: input
        description: "FK -> AcademicTerm.id; owning term."
      - name: kind
        type: enum
        source: input
        description: "DROP = leave a section; ADD = join a section; SWAP = drop one and add another atomically."
        constraints: "One of DROP | ADD | SWAP."
      - name: drop_entry_id
        type: string
        source: input
        description: "FK -> ScheduleEntry.id; entry to drop. Required for DROP and SWAP; forbidden for ADD."
        default: null
      - name: add_section_id
        type: string
        source: input
        description: "FK -> Section.id; section to join. Required for ADD and SWAP; forbidden for DROP."
        default: null
      - name: reason
        type: string
        source: input
        description: "Free-text justification; required, 10-500 chars."
      - name: state
        type: enum
        source: system
        description: "Lifecycle: SUBMITTED, COUNSELOR_REVIEW, REVISED, APPROVED, REJECTED, EXECUTED, CANCELLED."
        default: SUBMITTED
        constraints: "One of SUBMITTED | COUNSELOR_REVIEW | REVISED | APPROVED | REJECTED | EXECUTED | CANCELLED."
      - name: reviewed_by_counselor_id
        type: string
        source: system
        description: "FK -> Counselor.id; counselor who advanced the request out of SUBMITTED."
        default: null
      - name: decided_by_admin
        type: boolean
        source: system
        description: "True iff APPROVED/REJECTED was performed by an Administrator (segregation of duties marker)."
        default: false

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - name: counselor_id
        type: string
        source: input
        description: "FK -> Counselor.id; attending counselor."
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; attending student."
      - name: start_at
        type: datetime
        source: input
        description: "ISO8601 UTC start."
      - name: end_at
        type: datetime
        source: input
        description: "ISO8601 UTC end; must be after start_at and within the same UTC day."
      - name: state
        type: enum
        source: system
        description: "Lifecycle: BOOKED, COMPLETED, NO_SHOW, CANCELLED."
        default: BOOKED
        constraints: "One of BOOKED | COMPLETED | NO_SHOW | CANCELLED."
      - name: no_show_count_snapshot
        type: integer
        source: computed
        description: "Student's trailing no-show count at booking time (used by the 3-strike booking freeze)."
        default: 0

  - name: CreditAudit
    parent: null
    common_fields: false
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; audited student."
      - name: term_id
        type: string
        source: input
        description: "FK -> AcademicTerm.id; audit term."
      - name: required_credits
        type: number
        source: computed
        description: "Graduation pace requirement for the student's grade at this audit: per calculations.credit_pace_requirement."
        default: 0
      - name: projected_credits
        type: number
        source: computed
        description: "earned_credits + planned_credit_load at audit time."
        default: 0
      - name: deficiency_credits
        type: number
        source: computed
        description: "max(0, required_credits - projected_credits), 2-decimal."
        default: 0
      - name: deficient_subjects
        type: array
        source: computed
        description: "Subject areas where the student is behind pace, from calculations.credit_pace_requirement."
        default: []
      - name: audit_epoch
        type: integer
        source: system
        description: "AcademicTerm.rebalance_epoch when the audit ran; audits are idempotent within an epoch."
        default: 0

  - name: RecoveryPlacement
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; deficient student."
      - name: term_id
        type: string
        source: input
        description: "FK -> AcademicTerm.id; owning term."
      - name: target_course_id
        type: string
        source: input
        description: "FK -> Course.id; recovery course selected to close the deficiency."
      - name: section_id
        type: string
        source: system
        description: "FK -> Section.id; section chosen by the recovery selector. Null until placed."
        default: null
      - name: state
        type: enum
        source: system
        description: "Lifecycle: PENDING, PLACED, EXPIRED, WAIVED."
        default: PENDING
        constraints: "One of PENDING | PLACED | EXPIRED | WAIVED."
      - name: priority_score
        type: number
        source: computed
        description: "Placement priority from calculations.recovery_priority; higher places first."
        default: 0

  - name: RebalanceRun
    parent: null
    common_fields: false
    fields:
      - name: term_id
        type: string
        source: input
        description: "FK -> AcademicTerm.id; term being rebalanced."
      - name: epoch
        type: integer
        source: system
        description: "The new rebalance_epoch this run stamps on the term (term.rebalance_epoch + 1)."
      - name: moves_proposed
        type: integer
        source: computed
        description: "Count of ScheduleEntry rows moved by this run."
        default: 0
      - name: imbalance_score_before
        type: number
        source: computed
        description: "Term-wide imbalance metric before moves, per calculations.rebalance_imbalance."
        default: 0
      - name: imbalance_score_after
        type: number
        source: computed
        description: "Term-wide imbalance metric after moves."
        default: 0
      - name: executed_at
        type: datetime
        source: system
        description: "Server timestamp when the run executed."

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: AcademicTerm
    initial_state: COLLECTING
    terminal_states: [LOCKED]
    transitions:
      - from: COLLECTING
        to: TALLYING
        trigger: "POST /scheduling/terms/{id}/close-collection"
        actor: Administrator
        preconditions:
          - "term.posture == COLLECTING"
        side_effects:
          - "Every CourseRequest of this term in state DRAFT transitions to WITHDRAWN (side effect: its tally_weight recomputes to 0)."
          - "term.total_requested_seats recomputed over SUBMITTED/LOCKED requests."
          - "increments AcademicTerm.version by 1"
      - from: TALLYING
        to: BUILDING
        trigger: "POST /scheduling/terms/{id}/generate-sections"
        actor: Administrator
        preconditions:
          - "term.posture == TALLYING"
        side_effects:
          - "calculation.section_count_tally runs per course; for each course with tally > 0 and zero existing non-CANCELLED sections, the computed number of DRAFT sections is created (teacher/room unassigned)."
          - "Every CourseRequest in SUBMITTED transitions to LOCKED."
          - "increments AcademicTerm.version by 1"
      - from: BUILDING
        to: PUBLISHED
        trigger: "POST /scheduling/terms/{id}/publish"
        actor: Administrator
        preconditions:
          - "term.posture == BUILDING"
          - "Every non-CANCELLED Section of this term has state == SCHEDULED (teacher_id and room_id non-null)."
          - "No two non-CANCELLED sections share the same (teacher_id, period) or (room_id, period)."
        side_effects:
          - "Every SCHEDULED Section of this term transitions to PUBLISHED."
          - "Auto-placement runs: for each student, CourseRequests are walked by priority_rank ASC (tie-break: CourseRequest.created_at ASC) and placed into sections by calculations.placement_selector; each placement creates a ScheduleEntry(origin=AUTO_PLACEMENT, state=ENROLLED) and recomputes Section.enrolled_count, Section.cohort_counts, Section.under_enrolled, Student.planned_credit_load."
          - "Placed requests transition to PLACED; unplaceable requests transition to UNPLACED."
          - "calculation.credit_pace_requirement runs for every student with at least one request; a CreditAudit row is written per student."
          - "increments AcademicTerm.version by 1"
      - from: PUBLISHED
        to: CHANGE_WINDOW
        trigger: "POST /scheduling/terms/{id}/open-change-window"
        actor: Administrator
        preconditions:
          - "term.posture == PUBLISHED"
        side_effects:
          - "term.change_window_open becomes true."
          - "increments AcademicTerm.version by 1"
      - from: CHANGE_WINDOW
        to: LOCKED
        trigger: "POST /scheduling/terms/{id}/close-change-window"
        actor: Administrator
        preconditions:
          - "term.posture == CHANGE_WINDOW"
          - "No ScheduleChangeRequest of this term is in state SUBMITTED, COUNSELOR_REVIEW, REVISED, or APPROVED."
        side_effects:
          - "term.change_window_open becomes false."
          - "Every ScheduleChangeRequest still in SUBMITTED/COUNSELOR_REVIEW/REVISED transitions to CANCELLED."
          - "increments AcademicTerm.version by 1"
      - from: LOCKED
        to: REBALANCING
        trigger: "POST /scheduling/terms/{id}/rebalance-runs"
        actor: Administrator
        preconditions:
          - "term.posture == LOCKED"
        side_effects:
          - "term.rebalance_epoch increments by 1; a RebalanceRun row is created."
          - "calculation.rebalance_imbalance runs before and after the move sweep."
          - "Under-enrolled sections (under_enrolled == true) with enrolled_count == 0 transition to CANCELLED and their teacher.assigned_section_count recomputes."
          - "calculation.rebalance_move_selector moves students from over-target to under-target sections of the same course; each move sets the old ScheduleEntry to MOVED (moved_to_section_id set) and creates a new ENROLLED entry with origin=REBALANCE and epoch_placed = new epoch; Section.enrolled_count/cohort_counts/under_enrolled and Student.planned_credit_load recompute per move."
          - "term posture returns to LOCKED at run completion (REBALANCING is observable only inside the run)."
          - "increments AcademicTerm.version by 1"

  - entity: CourseRequest
    initial_state: DRAFT
    terminal_states: [PLACED, UNPLACED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /scheduling/course-requests/{id}/submit"
        actor: Student
        preconditions:
          - "request.state == DRAFT"
          - "request's term posture == COLLECTING"
          - "acting Student.id == request.student_id"
          - "validation set for requests passes (grade band, prerequisite, program exclusivity, duplicate-course, rank contiguity, max 8 primaries)"
        side_effects:
          - "request.tally_weight recomputed (1.0 primary, 0.5 alternate)."
          - "term.total_requested_seats recomputed."
          - "increments CourseRequest.version by 1"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /scheduling/course-requests/{id}/unsubmit"
        actor: Student
        preconditions:
          - "request.state == SUBMITTED"
          - "request's term posture == COLLECTING"
          - "acting Student.id == request.student_id"
        side_effects:
          - "request.tally_weight recomputed to 0."
          - "term.total_requested_seats recomputed."
          - "increments CourseRequest.version by 1"
      - from: SUBMITTED
        to: LOCKED
        trigger: "system: term generate-sections transition"
        actor: system
        preconditions:
          - "request.state == SUBMITTED"
        side_effects:
          - "request.tally_weight stays 1.0/0.5 (still counted)."
      - from: DRAFT
        to: WITHDRAWN
        trigger: "system: term close-collection transition, or DELETE /scheduling/course-requests/{id}"
        actor: system
        preconditions:
          - "request.state == DRAFT"
        side_effects:
          - "request.tally_weight recomputed to 0."
          - "term.total_requested_seats recomputed."
      - from: LOCKED
        to: PLACED
        trigger: "system: publish auto-placement"
        actor: system
        preconditions:
          - "request.state == LOCKED"
          - "calculations.placement_selector returned a section for this request"
        side_effects:
          - "ScheduleEntry created (state=ENROLLED, origin=AUTO_PLACEMENT, epoch_placed=0)."
          - "Section.enrolled_count, cohort_counts, under_enrolled recomputed."
          - "Student.planned_credit_load recomputed."
      - from: LOCKED
        to: UNPLACED
        trigger: "system: publish auto-placement"
        actor: system
        preconditions:
          - "request.state == LOCKED"
          - "calculations.placement_selector returned the empty set for this request AND (for primaries) every lower-ranked alternate also failed"
        side_effects:
          - "No ScheduleEntry created."

  - entity: Section
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "PATCH /scheduling/sections/{id}"
        actor: Administrator
        preconditions:
          - "section.state == DRAFT"
          - "term posture == BUILDING"
          - "teacher_id, room_id, period all supplied and non-null"
          - "teacher qualified for section.course_id (TeacherQualification row exists)"
          - "teacher.assigned_section_count < teacher.max_sections (strict: count AFTER this assignment would be <= max)"
          - "room.room_type == course.required_room_type"
          - "capacity <= min(term.max_students_per_section, room.capacity)"
          - "no other non-CANCELLED section in this term with same (teacher_id, period)"
          - "no other non-CANCELLED section in this term with same (room_id, period)"
        side_effects:
          - "teacher.assigned_section_count recomputed."
          - "increments Section.version by 1"
      - from: SCHEDULED
        to: PUBLISHED
        trigger: "system: term publish transition"
        actor: system
        preconditions:
          - "section.state == SCHEDULED"
        side_effects:
          - "section becomes visible to placement and change requests."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /scheduling/sections/{id}/cancel"
        actor: Administrator
        preconditions:
          - "section.state == SCHEDULED"
          - "section.enrolled_count == 0"
          - "term posture == BUILDING"
        side_effects:
          - "teacher.assigned_section_count recomputed."
      - from: PUBLISHED
        to: CANCELLED
        trigger: "system: rebalance run (empty-section consolidation)"
        actor: system
        preconditions:
          - "section.state == PUBLISHED"
          - "section.enrolled_count == 0"
          - "term posture == LOCKED and a RebalanceRun is executing"
        side_effects:
          - "teacher.assigned_section_count recomputed."
          - "RebalanceRun.moves_proposed unaffected by pure cancellations."

  - entity: ScheduleEntry
    initial_state: ENROLLED
    terminal_states: [DROPPED, MOVED]
    transitions:
      - from: ENROLLED
        to: DROPPED
        trigger: "system: ScheduleChangeRequest EXECUTED with kind in {DROP, SWAP}"
        actor: system
        preconditions:
          - "entry.state == ENROLLED"
        side_effects:
          - "Section.enrolled_count, cohort_counts, under_enrolled recomputed."
          - "Student.planned_credit_load recomputed."
      - from: ENROLLED
        to: MOVED
        trigger: "system: rebalance move, or SWAP execution creates the target entry and marks this one MOVED"
        actor: system
        preconditions:
          - "entry.state == ENROLLED"
          - "a replacement ENROLLED entry for the same student was created atomically in the same operation"
        side_effects:
          - "entry.moved_to_section_id set to the replacement section."
          - "Source and target Section enrolled_count/cohort_counts/under_enrolled recomputed."

  - entity: ScheduleChangeRequest
    initial_state: SUBMITTED
    terminal_states: [EXECUTED, REJECTED, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: COUNSELOR_REVIEW
        trigger: "POST /scheduling/change-requests/{id}/claim"
        actor: Counselor
        preconditions:
          - "request.state == SUBMITTED"
          - "term.change_window_open == true"
          - "acting Counselor.id == Student(request.student_id).counselor_id"
        side_effects:
          - "reviewed_by_counselor_id := acting counselor id."
          - "increments ScheduleChangeRequest.version by 1"
      - from: COUNSELOR_REVIEW
        to: REVISED
        trigger: "POST /scheduling/change-requests/{id}/return-for-revision"
        actor: Counselor
        preconditions:
          - "request.state == COUNSELOR_REVIEW"
          - "acting Counselor.id == reviewed_by_counselor_id"
        side_effects:
          - "increments ScheduleChangeRequest.version by 1"
      - from: REVISED
        to: SUBMITTED
        trigger: "POST /scheduling/change-requests/{id}/resubmit"
        actor: Student
        preconditions:
          - "request.state == REVISED"
          - "acting Student.id == request.student_id"
          - "term.change_window_open == true"
        side_effects:
          - "reviewed_by_counselor_id reset to null."
          - "increments ScheduleChangeRequest.version by 1"
      - from: COUNSELOR_REVIEW
        to: APPROVED
        trigger: "POST /scheduling/change-requests/{id}/decide"
        actor: Administrator
        preconditions:
          - "request.state == COUNSELOR_REVIEW"
          - "payload.decision == 'APPROVE'"
          - "segregation of duties: the acting Administrator's X-User-ID MUST differ from reviewed_by_counselor_id (counselor review and admin decision are distinct actors)"
          - "student's count of APPROVED-but-not-EXECUTED change requests this term < term.change_request_max_per_student"
          - "business checks on the requested change pass (capacity, overlap, singleton cap, program exclusivity, credit-load ceiling)"
        side_effects:
          - "decided_by_admin := true."
          - "increments ScheduleChangeRequest.version by 1"
      - from: COUNSELOR_REVIEW
        to: REJECTED
        trigger: "POST /scheduling/change-requests/{id}/decide"
        actor: Administrator
        preconditions:
          - "request.state == COUNSELOR_REVIEW"
          - "payload.decision == 'REJECT'"
          - "segregation of duties: acting Administrator X-User-ID MUST differ from reviewed_by_counselor_id"
        side_effects:
          - "decided_by_admin := true."
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /scheduling/change-requests/{id}/execute"
        actor: Administrator
        preconditions:
          - "request.state == APPROVED"
          - "term.change_window_open == true"
          - "Re-validates all business checks at execution time (capacity, overlap, singleton cap, credit ceiling) — approval does not freeze the world"
        side_effects:
          - "For DROP/SWAP: the drop ScheduleEntry transitions ENROLLED -> DROPPED (kind=DROP) or ENROLLED -> MOVED (kind=SWAP, moved_to_section_id := add_section_id)."
          - "For ADD/SWAP: a new ScheduleEntry(state=ENROLLED, origin=CHANGE_REQUEST, epoch_placed=term.rebalance_epoch) is created on the add section."
          - "Affected Section enrolled_count/cohort_counts/under_enrolled recompute; Student.planned_credit_load recomputes."
          - "increments ScheduleChangeRequest.version by 1"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /scheduling/change-requests/{id}/cancel, or system close-change-window sweep"
        actor: Student
        preconditions:
          - "request.state in {SUBMITTED, REVISED} for actor=Student; system sweep cancels SUBMITTED/COUNSELOR_REVIEW/REVISED on window close"
        side_effects:
          - "increments ScheduleChangeRequest.version by 1"

  - entity: Appointment
    initial_state: BOOKED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: BOOKED
        to: COMPLETED
        trigger: "POST /scheduling/appointments/{id}/complete"
        actor: Counselor
        preconditions:
          - "appointment.state == BOOKED"
          - "acting Counselor.id == appointment.counselor_id"
        side_effects:
          - "increments Appointment.version by 1"
      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /scheduling/appointments/{id}/mark-no-show"
        actor: Counselor
        preconditions:
          - "appointment.state == BOOKED"
          - "acting Counselor.id == appointment.counselor_id"
        side_effects:
          - "Student trailing no-show count recomputes; when the count reaches 3 the student's future bookings are frozen (validation ERR_NO_SHOW_FREEZE on create)."
          - "increments Appointment.version by 1"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /scheduling/appointments/{id}/cancel"
        actor: Counselor
        preconditions:
          - "appointment.state == BOOKED"
          - "acting Counselor.id == appointment.counselor_id OR acting Student.id == appointment.student_id (either party may cancel)"
        side_effects:
          - "increments Appointment.version by 1"

  - entity: RecoveryPlacement
    initial_state: PENDING
    terminal_states: [PLACED, EXPIRED, WAIVED]
    transitions:
      - from: PENDING
        to: PLACED
        trigger: "POST /scheduling/recovery-placements/{id}/place"
        actor: Counselor
        preconditions:
          - "placement.state == PENDING"
          - "acting Counselor.id == Student(placement.student_id).counselor_id"
          - "term posture in {PUBLISHED, CHANGE_WINDOW, LOCKED}"
          - "calculations.recovery_section_selector returns a non-null section for target_course_id"
          - "student.planned_credit_load + target course credits <= 8.0 credit ceiling"
        side_effects:
          - "placement.section_id set to the selected section."
          - "ScheduleEntry(state=ENROLLED, origin=RECOVERY_PLACEMENT, epoch_placed=term.rebalance_epoch) created."
          - "Section enrolled_count/cohort_counts/under_enrolled recompute; Student.planned_credit_load recomputes; a fresh CreditAudit is written for the student."
          - "Student.credit_deficient recomputed from the fresh audit."
          - "increments RecoveryPlacement.version by 1"
      - from: PENDING
        to: WAIVED
        trigger: "POST /scheduling/recovery-placements/{id}/waive"
        actor: Administrator
        preconditions:
          - "placement.state == PENDING"
          - "payload.waiver_reason present (10-500 chars)"
        side_effects:
          - "Student.credit_deficient recomputed (remains whatever the latest CreditAudit says; waiving the placement does not waive the deficiency flag)."
      - from: PENDING
        to: EXPIRED
        trigger: "system: term close-change-window sweep or lock transition"
        actor: system
        preconditions:
          - "placement.state == PENDING"
          - "term posture transitions away from CHANGE_WINDOW into LOCKED"
        side_effects:
          - "none beyond the state flip."

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: change-request-decide-stale-term
    parent_entity: AcademicTerm
    write_endpoint: "POST /scheduling/change-requests/{id}/decide"
    occ_field: "expected_term_version"
    description: |
      Deciding a ScheduleChangeRequest against an AcademicTerm whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just executed a change or closed the window
      (advancing term.version) and the decider's view of window caps and seat
      tallies is therefore stale.
    error_id: ERR_STALE_TERM_VERSION
    http_status: 412
  - rule_id: section-patch-stale-term
    parent_entity: AcademicTerm
    write_endpoint: "PATCH /scheduling/sections/{id}"
    occ_field: "expected_term_version"
    description: |
      Scheduling a Section (assigning teacher/room/period) against an AcademicTerm
      whose version has advanced since the client last observed it is rejected,
      because a rebalance run or another section assignment may have invalidated
      the client's conflict map.
    error_id: ERR_STALE_TERM_VERSION
    http_status: 412
  - rule_id: rebalance-run-stale-term
    parent_entity: AcademicTerm
    write_endpoint: "POST /scheduling/terms/{id}/rebalance-runs"
    occ_field: "expected_term_version"
    description: |
      Launching a RebalanceRun against an AcademicTerm whose version has advanced
      since the client last observed it is rejected: the client's epoch expectation
      is stale, and the run would double-apply moves against a newer epoch.
    error_id: ERR_STALE_TERM_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: section_count_tally
    trigger: "POST /scheduling/terms/{id}/generate-sections (TALLYING -> BUILDING)"
    algorithm: threshold
    formula: |
      For each Course c:
        demand(c) = sum of tally_weight over CourseRequest rows where
                    course_id == c.id AND term_id == term AND state IN {SUBMITTED, LOCKED}
                    (primary requests contribute 1.0, alternates 0.5 — see CourseRequest.tally_weight)
        raw_sections(c) = demand(c) / term.class_size_target
        If c.singleton: sections(c) = 1 when demand(c) > 0 else 0
        Else: sections(c) = ceil(raw_sections(c)) when demand(c) > 0 else 0
        Cap: sections(c) <= term.periods_per_day (a course may not occupy every period of the day).
      Rounding order is pinned: compute demand as an exact 1-decimal value first
      (weights are multiples of 0.5), THEN divide, THEN ceil — never round demand
      before division.
    input_set: "CourseRequest rows of the term in state SUBMITTED or LOCKED; Courses of the catalog; AcademicTerm constants."
    constants:
      ALTERNATE_WEIGHT: 0.5
      PRIMARY_WEIGHT: 1.0
    precision: "demand exact to 0.5; sections integer via ceil"
    variants:
      - name: optimistic_tally
        when: "Preview mode: GET /scheduling/terms/{id}/tally-preview while posture == COLLECTING counts DRAFT requests at half weight (0.5 primary, 0.25 alternate) in addition to SUBMITTED."
        difference: "Preview demand includes DRAFT rows at halved weight, so preview section counts are >= final counts for identical submitted data whenever drafts exist."
      - name: final_tally
        when: "Generation mode at TALLYING -> BUILDING: DRAFT rows excluded entirely (they were WITHDRAWN by close-collection)."
        difference: "Final demand counts only SUBMITTED/LOCKED rows at full/alternate weight."

  - name: placement_selector
    trigger: "system during AcademicTerm PUBLISHED transition (auto-placement), and again per ADD/SWAP execution and recovery placement"
    algorithm: constraint_propagation
    formula: |
      For a student s and course c (request r), candidate sections are:
        Section rows where term_id == r.term_id AND course_id == c.id
          AND state == PUBLISHED
          AND enrolled_count < capacity  (strict: a section at exactly capacity is ineligible)
          AND period NOT IN {periods of s's ENROLLED entries in this term}
          AND (c.special_program_exclusive == NONE OR s.special_program == c.special_program_exclusive)
      Ranking expression (lexicographic):
        1. enrolled_count ASC  (fill the emptiest section first — load leveling)
        2. cohort_penalty ASC, where cohort_penalty = 1 if s.special_program != NONE
           and cohort_counts[s.special_program] >= ceil(0.5 * capacity), else 0
           (cohort concentration guard: no special-program cohort may exceed half the section)
        3. section.created_at ASC  (deterministic tie-break; NEVER id)
      Fallback when the candidate set is empty:
        - For a primary request: try the student's next-higher-ranked alternate
          (is_alternate == true, lowest priority_rank among SUBMITTED/LOCKED alternates
          not yet tried, tie-break created_at ASC). If no alternate succeeds, the
          primary and its alternates are UNPLACED.
        - For ADD/SWAP execution: reject with ERR_NO_ELIGIBLE_SECTION.
        - For recovery: reject with ERR_RECOVERY_NO_SECTION.
      Evaluation order pinned: eligibility filter -> rank -> tie-break -> fallback.
    input_set: "PUBLISHED sections of the request's course in the term; student's ENROLLED ScheduleEntry periods; CourseRequest alternates."
    constants:
      COHORT_HALF_CAP_DIVISOR: 2
    precision: "integer comparisons only"
    variants: []

  - name: credit_pace_requirement
    trigger: "AcademicTerm publish transition (per student), RecoveryPlacement placement, and GET /scheduling/students/{id}/credit-audit recompute"
    algorithm: aggregation
    formula: |
      required_credits(s, term) = grade_pace_base[s.grade_level]
      where grade_pace_base = {9: 6.0, 10: 12.0, 11: 18.0, 12: 22.0}
      (cumulative credits a student must be on pace to hold by end of that grade's fall term)
      projected_credits(s) = s.earned_credits + s.planned_credit_load
      deficiency_credits = max(0, required_credits - projected_credits), 2-decimal round_half_up
      deficient_subjects: for each subject_area in GRAD_REQ (ENGLISH, MATH, SCIENCE,
        SOCIAL_STUDIES each requiring per-grade minimum credits
        {ENGLISH: 1.0, MATH: 1.0, SCIENCE: 0.5, SOCIAL_STUDIES: 0.5} per grade_level year),
        the subject is deficient iff the student's earned+planned credits in that
        subject < per-grade minimum * (grade_level - 8).
      Evaluation order pinned: compute planned_credit_load FIRST (sum of credits over
      ENROLLED entries), then projected, then deficiency, then subject sweep. Never
      recompute planned_credit_load inside the subject sweep (it is an input, not a
      re-derived value).
    input_set: "Student row; ScheduleEntry rows state ENROLLED for the term joined to Course.credits and Course.subject_area."
    constants:
      GRADE_9_PACE: 6.0
      GRADE_10_PACE: 12.0
      GRADE_11_PACE: 18.0
      GRADE_12_PACE: 22.0
      ENGLISH_PER_YEAR: 1.0
      MATH_PER_YEAR: 1.0
      SCIENCE_PER_YEAR: 0.5
      SOCIAL_STUDIES_PER_YEAR: 0.5
      CREDIT_LOAD_CEILING: 8.0
    precision: "2 decimal places, round_half_up; pace constants exact to 0.5"
    variants:
      - name: provisional_projection
        when: "Computed at request time (GET /scheduling/students/{id}/credit-projection) while term posture == COLLECTING: planned_credit_load is replaced by requested credits over SUBMITTED requests (primaries full, alternates excluded)."
        difference: "Uses requested (not enrolled) credits, so a student with unplaced requests shows a different (typically higher) projected total than the final audit for identical earned credits."
      - name: final_audit
        when: "Written to CreditAudit at publish / recovery placement: planned_credit_load over ENROLLED entries only."
        difference: "Unplaced requests contribute zero; final projected_credits <= provisional whenever any request went UNPLACED."

  - name: recovery_priority
    trigger: "RecoveryPlacement creation (POST /scheduling/recovery-placements) and rebalance sweeps"
    algorithm: weighted_scoring
    formula: |
      priority_score = 10 * deficiency_credits
                     + 2 * (grade_level - 8)
                     + 3 * (1 if 'ENGLISH' in deficient_subjects else 0)
                     + 3 * (1 if 'MATH' in deficient_subjects else 0)
      where deficiency_credits and deficient_subjects come from the LATEST CreditAudit
      (greatest audit_epoch; tie-break created_at DESC) for the student+term.
      Non-linear interaction: the grade multiplier grows the weight of the
      deficiency term for upperclassmen (via additive grade term), and core-subject
      flags stack multiplicatively with nothing else — inputs: deficiency_credits,
      grade_level, ENGLISH flag, MATH flag (4 inputs).
      Higher priority_score places first when recovery sections are scarce.
    input_set: "Latest CreditAudit per (student, term); Student.grade_level."
    constants:
      W_DEFICIENCY: 10
      W_GRADE: 2
      W_CORE_SUBJECT: 3
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: rebalance_imbalance
    trigger: "RebalanceRun execution (before and after the move sweep)"
    algorithm: aggregation
    formula: |
      Let P = term.periods_per_day. For each period p in 1..P:
        load(p) = sum of enrolled_count over non-CANCELLED PUBLISHED sections with period == p
        target(p) = total_enrolled_seats / P   (total_enrolled_seats = sum of enrolled_count over all non-CANCELLED PUBLISHED sections)
        imbalance = sum over p of abs(load(p) - target(p)), 2-decimal round_half_up
      Order pinned: compute total_enrolled_seats first, then per-period target
      (identical target for all p), then the abs-deviation sum.
    input_set: "Non-CANCELLED PUBLISHED sections of the term."
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: rebalance_move_selector
    trigger: "RebalanceRun execution after imbalance_before is computed"
    algorithm: waterfall_allocation
    formula: |
      Goal: move students from sections whose enrolled_count > term.class_size_target
      to under-target sections OF THE SAME COURSE, without creating conflicts.
      Sweep order pinned:
        1. Donor sections sorted by over_target DESC where over_target = enrolled_count - class_size_target;
           tie-break section.created_at ASC.
        2. Within a donor, candidate students sorted by:
           a. special_program == NONE first (move neutrals before cohort members), then
           b. epoch_placed ASC (students placed in earlier epochs move first), then
           c. ScheduleEntry.created_at ASC.
           A student whose epoch_placed == term.rebalance_epoch (already moved this
           epoch) is SKIPPED — no student moves twice in one run.
        3. Receiver sections (same course, enrolled_count < class_size_target,
           state == PUBLISHED) ranked by enrolled_count ASC, tie-break created_at ASC.
      A move is executed only if ALL hold:
        - receiver.period does not collide with the student's other ENROLLED periods
          (excluding the donor entry being moved),
        - cohort guard: after the move, receiver.cohort_counts[s.special_program] <=
          ceil(0.5 * receiver.capacity) when s.special_program != NONE,
        - receiver.enrolled_count + 1 <= receiver.capacity.
      Waterfall: each donor drains students into the single best receiver until the
      donor hits class_size_target or runs out of movable students; the remainder
      (students who cannot move) stays. The sweep halts when no donor has
      over_target > 0 or no legal moves remain.
    input_set: "PUBLISHED non-CANCELLED sections grouped by course; ENROLLED entries; term.rebalance_epoch."
    constants: {}
    precision: "integer counts; deterministic order pinned above"
    variants: []

  - name: counselor_utilization
    trigger: "GET /scheduling/counselors/{id}/utilization"
    algorithm: aggregation
    formula: |
      utilization(counselor, window_start, window_end) =
        booked_minutes / available_minutes, 4-decimal round_half_up, capped at 1.0000
      booked_minutes = sum over Appointment rows with counselor_id == counselor,
        state == BOOKED, and start_at >= window_start AND end_at <= window_end of
        (end_at - start_at) in whole minutes. Half-open boundary: an appointment
        whose start_at == window_end is EXCLUDED; one whose end_at == window_start
        is EXCLUDED (the interval [window_start, window_end) governs).
      available_minutes = (number of weekdays (Mon-Fri) whose date overlaps
        [window_start, window_end)) * 360  (6 counselor hours per weekday).
      Nested rounding pinned: per-appointment durations are computed as whole
      minutes FIRST (seconds truncated, not rounded), THEN summed, THEN divided,
      THEN rounded to 4 decimals. Summing fractional minutes then rounding would
      produce different results and is forbidden.
    input_set: "Appointment rows state BOOKED for the counselor inside the window."
    constants:
      WEEKDAY_MINUTES: 360
    precision: "4 decimal places, round_half_up; durations truncated to whole minutes before summing"
    variants: []

  - name: no_show_freeze_check
    trigger: "POST /scheduling/appointments (booking) and Appointment NO_SHOW transition"
    algorithm: threshold
    formula: |
      trailing_no_shows(s) = count of Appointment rows with student_id == s AND
        state == NO_SHOW AND start_at >= (logical_now - 90 days), chronological by
        start_at ASC.
      Booking freeze engages iff trailing_no_shows(s) >= 3 at request time.
      Boundary pinned: exactly 3 no-shows freezes (>= 3, NOT > 3). The 90-day lookback
      is a closed lower bound: an appointment with start_at exactly 90*24h before
      logical_now IS counted.
    input_set: "Appointment rows for the student."
    constants:
      FREEZE_THRESHOLD: 3
      LOOKBACK_DAYS: 90
    precision: "integer count; threshold >= 3"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a declared role; X-User-ID header present."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted to invoke the endpoint per §1.5 roles."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path-template resources exist, validated left-to-right (term, then section/entry/request, etc.)."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Body-referenced FK resources exist (student_id, course_id, section_id, drop_entry_id, add_section_id, target_course_id)."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: state
    check: "Term posture permits the operation (e.g., request submission requires COLLECTING; section scheduling requires BUILDING; change requests require CHANGE_WINDOW; rebalance requires LOCKED)."
    error_id: ERR_INVALID_TERM_POSTURE
    http_status: 409
    applies_to: "all posture-gated endpoints"
  - priority: 6
    category: state
    check: "Target entity is in a legal from-state for the requested transition (e.g., only SUBMITTED requests can be claimed; only BOOKED appointments can be completed; only APPROVED change requests can be executed)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: state
    check: "Ownership: acting Student.id == resource.student_id, or acting Counselor.id == Student(resource.student_id).counselor_id where required."
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "student/counselor-scoped endpoints"
  - priority: 8
    category: business_safety
    check: "Segregation of duties on change-request decide: acting Administrator X-User-ID != reviewed_by_counselor_id of the request."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /scheduling/change-requests/{id}/decide"
  - priority: 9
    category: business_safety
    check: "No-show freeze: trailing_no_shows(student) >= 3 forbids new appointment booking."
    error_id: ERR_NO_SHOW_FREEZE
    http_status: 422
    applies_to: "POST /scheduling/appointments"
  - priority: 10
    category: business_constraint
    check: "Request payload shape: required fields present, enums valid, reason length 10-500, credit values in 0.25 steps, rank contiguity per (student, term) over non-alternate requests."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 11
    category: business_constraint
    check: "Course eligibility: student grade_level within [grade_band_min, grade_band_max]; prerequisite chain satisfied (student earned credit for prerequisite course OR has an ENROLLED entry in it this term); special_program_exclusive match; course not already requested (non-alternate) this term."
    error_id: ERR_COURSE_INELIGIBLE
    http_status: 422
    applies_to: "POST /scheduling/course-requests, POST /scheduling/course-requests/{id}/submit"
  - priority: 12
    category: business_constraint
    check: "Request caps: student has fewer than 8 non-alternate SUBMITTED/DRAFT requests this term and total requested credit load (primaries) <= 8.0."
    error_id: ERR_REQUEST_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /scheduling/course-requests/{id}/submit"
  - priority: 13
    category: business_referential
    check: "Section scheduling referential integrity: TeacherQualification row exists for (teacher_id, course_id); room.room_type == course.required_room_type."
    error_id: ERR_SECTION_ASSIGNMENT_INVALID
    http_status: 422
    applies_to: "PATCH /scheduling/sections/{id}"
  - priority: 14
    category: business_temporal
    check: "Teacher/room grid conflicts: no non-CANCELLED section in the term shares (teacher_id, period) or (room_id, period). Interval semantics: point-slot occupation on the discrete period grid — two sections collide iff they occupy the SAME period integer for the same resource (adjacency is NOT a conflict; period p and p+1 coexist)."
    error_id: ERR_GRID_CONFLICT
    http_status: 409
    applies_to: "PATCH /scheduling/sections/{id}"
  - priority: 15
    category: business_temporal
    check: "Appointment overlap: for the counselor, the new [start_at, end_at) must not overlap any BOOKED appointment's [start_at, end_at), and must respect a 10-minute buffer: gap between the new interval and every existing BOOKED interval must be >= 10 minutes on both sides (adjacency WITHOUT the buffer is a conflict — back-to-back appointments are forbidden). Also, student double-booking (same student, overlapping BOOKED intervals, no buffer) is forbidden."
    error_id: ERR_APPOINTMENT_CONFLICT
    http_status: 409
    applies_to: "POST /scheduling/appointments"
  - priority: 16
    category: business_temporal
    check: "Student period conflict on placement/change/recovery: target section's period must not equal any period of the student's other ENROLLED entries this term."
    error_id: ERR_STUDENT_PERIOD_CONFLICT
    http_status: 409
    applies_to: "POST /scheduling/change-requests/{id}/execute, POST /scheduling/recovery-placements/{id}/place"
  - priority: 17
    category: business_fiscal
    check: "Seat capacity: target section enrolled_count < capacity (strict — a section at exactly capacity rejects the placement)."
    error_id: ERR_SECTION_FULL
    http_status: 422
    applies_to: "POST /scheduling/change-requests/{id}/execute, POST /scheduling/recovery-placements/{id}/place"
  - priority: 18
    category: business_fiscal
    check: "Credit-load ceiling: student.planned_credit_load + incoming course credits <= 8.0 (change-request ADD/SWAP and recovery placement)."
    error_id: ERR_CREDIT_CEILING_EXCEEDED
    http_status: 422
    applies_to: "POST /scheduling/change-requests/{id}/execute, POST /scheduling/recovery-placements/{id}/place"
  - priority: 19
    category: business_fiscal
    check: "Singleton cap: count of student's ENROLLED entries whose course is singleton must remain <= term.singleton_section_cap after the change (applies when cap > 0)."
    error_id: ERR_SINGLETON_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /scheduling/change-requests/{id}/execute, POST /scheduling/recovery-placements/{id}/place"
  - priority: 20
    category: business_fiscal
    check: "Change-request quota: student's APPROVED-not-EXECUTED change requests this term < term.change_request_max_per_student."
    error_id: ERR_CHANGE_QUOTA_EXCEEDED
    http_status: 422
    applies_to: "POST /scheduling/change-requests/{id}/decide"
  - priority: 21
    category: business_constraint
    check: "Cohort concentration guard: adding the student must not push the target section's cohort_counts[student.special_program] above ceil(0.5 * capacity) when special_program != NONE."
    error_id: ERR_COHORT_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /scheduling/change-requests/{id}/execute, POST /scheduling/recovery-placements/{id}/place"
  - priority: 22
    category: business_safety
    check: "Counselor caseload: assigning a student to a counselor requires counselor.caseload_count < counselor.max_caseload."
    error_id: ERR_CASELOAD_FULL
    http_status: 422
    applies_to: "POST /scheduling/students, PATCH /scheduling/students/{id}"
  - priority: 23
    category: state
    check: "Publish precondition: no DRAFT (unscheduled) sections remain in the term and no grid conflicts exist among non-CANCELLED sections."
    error_id: ERR_PUBLISH_BLOCKED
    http_status: 409
    applies_to: "POST /scheduling/terms/{id}/publish"
  - priority: 24
    category: state
    check: "Close-window precondition: no ScheduleChangeRequest of the term is in SUBMITTED, COUNSELOR_REVIEW, REVISED, or APPROVED."
    error_id: ERR_CLOSE_WINDOW_BLOCKED
    http_status: 409
    applies_to: "POST /scheduling/terms/{id}/close-change-window"
  - priority: 25
    category: business_constraint
    check: "Selector emptiness: the placement selector's candidate set for the target course is empty (all candidates period-conflict, full, cohort-capped, or program-mismatched)."
    error_id: ERR_NO_ELIGIBLE_SECTION
    http_status: 422
    applies_to: "POST /scheduling/change-requests/{id}/execute"
  - priority: 26
    category: business_constraint
    check: "Recovery selector emptiness: no PUBLISHED section of the target course passes the placement selector."
    error_id: ERR_RECOVERY_NO_SECTION
    http_status: 422
    applies_to: "POST /scheduling/recovery-placements/{id}/place"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Terms & posture -------------------------------------------------------
  - method: POST
    path: "/scheduling/terms"
    description: "Create an AcademicTerm in posture COLLECTING."
    roles: [Administrator]
    code: 201
    input: [code, periods_per_day, max_students_per_section, class_size_target, "singleton_section_cap?", "change_request_max_per_student?"]
    output: AcademicTerm
    side_effects: []
  - method: GET
    path: "/scheduling/terms"
    description: "List terms (pagination + optional posture filter)."
    roles: [Administrator, Counselor, Student]
    code: 200
    input: ["posture?", "limit?", "offset?"]
    output: AcademicTerm[]
    side_effects: []
  - method: GET
    path: "/scheduling/terms/{id}"
    description: "Read one term."
    roles: [Administrator, Counselor, Student]
    code: 200
    input: []
    output: AcademicTerm
    side_effects: []
  - method: POST
    path: "/scheduling/terms/{id}/close-collection"
    description: "COLLECTING -> TALLYING; withdraws DRAFT requests."
    roles: [Administrator]
    code: 200
    input: []
    output: AcademicTerm
    side_effects: ["CourseRequest DRAFT -> WITHDRAWN sweep", "total_requested_seats recompute", "increments AcademicTerm.version by 1"]
  - method: POST
    path: "/scheduling/terms/{id}/generate-sections"
    description: "TALLYING -> BUILDING; runs section_count_tally and creates DRAFT sections; SUBMITTED requests lock."
    roles: [Administrator]
    code: 200
    input: []
    output: AcademicTerm
    side_effects: ["calculation section_count_tally", "Section DRAFT rows created", "CourseRequest SUBMITTED -> LOCKED", "increments AcademicTerm.version by 1"]
  - method: POST
    path: "/scheduling/terms/{id}/publish"
    description: "BUILDING -> PUBLISHED; sections publish, auto-placement runs, credit audits written."
    roles: [Administrator]
    code: 200
    input: []
    output: AcademicTerm
    side_effects: ["Section SCHEDULED -> PUBLISHED", "auto-placement via placement_selector", "ScheduleEntry rows created", "CourseRequest LOCKED -> PLACED/UNPLACED", "CreditAudit rows written", "increments AcademicTerm.version by 1"]
  - method: POST
    path: "/scheduling/terms/{id}/open-change-window"
    description: "PUBLISHED -> CHANGE_WINDOW."
    roles: [Administrator]
    code: 200
    input: []
    output: AcademicTerm
    side_effects: ["change_window_open := true", "increments AcademicTerm.version by 1"]
  - method: POST
    path: "/scheduling/terms/{id}/close-change-window"
    description: "CHANGE_WINDOW -> LOCKED; cancels in-flight change requests, expires PENDING recovery placements."
    roles: [Administrator]
    code: 200
    input: []
    output: AcademicTerm
    side_effects: ["change_window_open := false", "ScheduleChangeRequest in-flight -> CANCELLED", "RecoveryPlacement PENDING -> EXPIRED", "increments AcademicTerm.version by 1"]
  - method: GET
    path: "/scheduling/terms/{id}/tally-preview"
    description: "Optimistic tally preview (includes DRAFT at halved weight) while COLLECTING."
    roles: [Administrator, Counselor]
    code: 200
    input: []
    output: "{ rows: array }"
    output_note: "rows is an array of { course_id, course_code, demand, projected_sections } objects, one per course with demand > 0"
    side_effects: ["calculation section_count_tally (optimistic_tally variant)"]
  - method: POST
    path: "/scheduling/terms/{id}/rebalance-runs"
    description: "LOCKED -> REBALANCING -> LOCKED; executes a rebalance epoch with OCC on the term version."
    roles: [Administrator]
    code: 201
    input: [expected_term_version]
    output: RebalanceRun
    side_effects: ["term.rebalance_epoch += 1", "empty PUBLISHED sections -> CANCELLED", "rebalance_move_selector sweep", "ScheduleEntry ENROLLED -> MOVED + new ENROLLED rows", "increments AcademicTerm.version by 1"]
  - method: GET
    path: "/scheduling/terms/{id}/rebalance-runs"
    description: "List RebalanceRun rows of a term."
    roles: [Administrator, Counselor]
    code: 200
    input: ["limit?", "offset?"]
    output: RebalanceRun[]
    side_effects: []

  # --- Catalog ---------------------------------------------------------------
  - method: POST
    path: "/scheduling/courses"
    description: "Create a Course."
    roles: [Administrator]
    code: 201
    input: [course_code, title, credits, subject_area, "required_room_type?", "singleton?", grade_band_min, grade_band_max, "special_program_exclusive?", "prerequisite_course_id?"]
    output: Course
    side_effects: []
  - method: GET
    path: "/scheduling/courses"
    description: "List courses (filters: subject_area?, singleton?)."
    roles: [Administrator, Counselor, Student]
    code: 200
    input: ["subject_area?", "singleton?", "prerequisite_course_id?", "limit?", "offset?"]
    output: Course[]
    side_effects: []
  - method: GET
    path: "/scheduling/courses/{id}"
    description: "Read one course."
    roles: [Administrator, Counselor, Student]
    code: 200
    input: []
    output: Course
    side_effects: []

  # --- People ----------------------------------------------------------------
  - method: POST
    path: "/scheduling/counselors"
    description: "Create a Counselor."
    roles: [Administrator]
    code: 201
    input: [full_name, max_caseload]
    output: Counselor
    side_effects: []
  - method: GET
    path: "/scheduling/counselors/{id}"
    description: "Read one counselor."
    roles: [Administrator, Counselor]
    code: 200
    input: []
    output: Counselor
    side_effects: []
  - method: GET
    path: "/scheduling/counselors/{id}/students"
    description: "Reverse lookup: students on this counselor's caseload."
    roles: [Administrator, Counselor]
    code: 200
    input: ["limit?", "offset?"]
    output: Student[]
    side_effects: []
  - method: GET
    path: "/scheduling/counselors/{id}/utilization"
    description: "Computed read: counselor_utilization over a window."
    roles: [Administrator, Counselor]
    code: 200
    input: ["window_start?", "window_end?"]
    output: "{ counselor_id: string, booked_minutes: integer, available_minutes: integer, utilization: number }"
    side_effects: ["calculation counselor_utilization"]
  - method: POST
    path: "/scheduling/teachers"
    description: "Create a Teacher."
    roles: [Administrator]
    code: 201
    input: [full_name, max_sections]
    output: Teacher
    side_effects: []
  - method: GET
    path: "/scheduling/teachers/{id}"
    description: "Read one teacher."
    roles: [Administrator, Counselor]
    code: 200
    input: []
    output: Teacher
    side_effects: []
  - method: POST
    path: "/scheduling/teachers/{id}/qualifications"
    description: "Record a TeacherQualification (teacher qualified for a course)."
    roles: [Administrator]
    code: 201
    input: [course_id, qualified_at]
    output: TeacherQualification
    side_effects: []
  - method: GET
    path: "/scheduling/teachers/{id}/qualifications"
    description: "List a teacher's qualifications."
    roles: [Administrator, Counselor]
    code: 200
    input: ["limit?", "offset?"]
    output: TeacherQualification[]
    side_effects: []
  - method: POST
    path: "/scheduling/rooms"
    description: "Create a Room."
    roles: [Administrator]
    code: 201
    input: [room_number, capacity, "room_type?"]
    output: Room
    side_effects: []
  - method: GET
    path: "/scheduling/rooms/{id}"
    description: "Read one room."
    roles: [Administrator, Counselor]
    code: 200
    input: []
    output: Room
    side_effects: []
  - method: POST
    path: "/scheduling/students"
    description: "Create a Student and assign to a counselor (caseload check applies)."
    roles: [Administrator]
    code: 201
    input: [external_ref, full_name, grade_level, "special_program?", counselor_id, "earned_credits?"]
    output: Student
    side_effects: ["Counselor.caseload_count recompute"]
  - method: GET
    path: "/scheduling/students"
    description: "List students (filters: counselor_id?, grade_level?, credit_deficient?)."
    roles: [Administrator, Counselor]
    code: 200
    input: ["counselor_id?", "grade_level?", "credit_deficient?", "limit?", "offset?"]
    output: Student[]
    side_effects: []
  - method: GET
    path: "/scheduling/students/{id}"
    description: "Read one student."
    roles: [Administrator, Counselor, Student]
    code: 200
    input: []
    output: Student
    side_effects: []
  - method: GET
    path: "/scheduling/students/{id}/schedule"
    description: "Student's ScheduleEntry rows for a term (any state)."
    roles: [Administrator, Counselor, Student]
    code: 200
    input: ["term_id?", "state?", "limit?", "offset?"]
    output: ScheduleEntry[]
    side_effects: []
  - method: GET
    path: "/scheduling/students/{id}/credit-audit"
    description: "Latest CreditAudit for the student in a term, recomputed on read."
    roles: [Administrator, Counselor, Student]
    code: 200
    input: ["term_id?"]
    output: CreditAudit
    side_effects: ["calculation credit_pace_requirement (final_audit variant)"]
  - method: GET
    path: "/scheduling/students/{id}/credit-projection"
    description: "Provisional projection (provisional_projection variant) while COLLECTING."
    roles: [Administrator, Counselor, Student]
    code: 200
    input: ["term_id?"]
    output: "{ student_id: string, projected_credits: number, required_credits: number, deficiency_credits: number, deficient_subjects: string[] }"
    side_effects: ["calculation credit_pace_requirement (provisional_projection variant)"]

  # --- Course requests ---------------------------------------------------------
  - method: POST
    path: "/scheduling/course-requests"
    description: "Student creates a DRAFT CourseRequest."
    roles: [Student]
    code: 201
    input: [student_id, course_id, term_id, priority_rank, "is_alternate?"]
    output: CourseRequest
    side_effects: []
  - method: GET
    path: "/scheduling/course-requests"
    description: "Filtered list: student_id?, term_id?, state?, course_id?."
    roles: [Administrator, Counselor, Student]
    code: 200
    input: ["student_id?", "term_id?", "state?", "course_id?", "limit?", "offset?"]
    output: CourseRequest[]
    side_effects: []
  - method: GET
    path: "/scheduling/course-requests/{id}"
    description: "Read one request."
    roles: [Administrator, Counselor, Student]
    code: 200
    input: []
    output: CourseRequest
    side_effects: []
  - method: POST
    path: "/scheduling/course-requests/{id}/submit"
    description: "DRAFT -> SUBMITTED with full eligibility validation."
    roles: [Student]
    code: 200
    input: []
    output: CourseRequest
    side_effects: ["tally_weight recompute", "term.total_requested_seats recompute", "increments CourseRequest.version by 1"]
  - method: POST
    path: "/scheduling/course-requests/{id}/unsubmit"
    description: "SUBMITTED -> DRAFT while COLLECTING."
    roles: [Student]
    code: 200
    input: []
    output: CourseRequest
    side_effects: ["tally_weight recompute", "term.total_requested_seats recompute", "increments CourseRequest.version by 1"]
  - method: DELETE
    path: "/scheduling/course-requests/{id}"
    description: "Withdraw a DRAFT request (hard delete of the DRAFT row; SUBMITTED rows must unsubmit first)."
    roles: [Student]
    code: 204
    input: []
    output: null
    side_effects: ["term.total_requested_seats recompute"]

  # --- Sections ----------------------------------------------------------------
  - method: GET
    path: "/scheduling/sections"
    description: "Filtered list: term_id?, course_id?, teacher_id?, room_id?, state?."
    roles: [Administrator, Counselor, Student]
    code: 200
    input: ["term_id?", "course_id?", "teacher_id?", "room_id?", "state?", "limit?", "offset?"]
    output: Section[]
    side_effects: []
  - method: GET
    path: "/scheduling/sections/{id}"
    description: "Read one section."
    roles: [Administrator, Counselor, Student]
    code: 200
    input: []
    output: Section
    side_effects: []
  - method: PATCH
    path: "/scheduling/sections/{id}"
    description: "Assign teacher/room/period/capacity to a DRAFT section (transitions it to SCHEDULED) with OCC on the term."
    roles: [Administrator]
    code: 200
    input: [teacher_id, room_id, period, capacity, expected_term_version]
    output: Section
    side_effects: ["Section DRAFT -> SCHEDULED", "Teacher.assigned_section_count recompute", "increments Section.version by 1", "increments AcademicTerm.version by 1"]
  - method: POST
    path: "/scheduling/sections/{id}/cancel"
    description: "Cancel an empty SCHEDULED section during BUILDING."
    roles: [Administrator]
    code: 200
    input: []
    output: Section
    side_effects: ["Section SCHEDULED -> CANCELLED", "Teacher.assigned_section_count recompute"]
  - method: GET
    path: "/scheduling/sections/{id}/roster"
    description: "Section's ScheduleEntry rows."
    roles: [Administrator, Counselor]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: ScheduleEntry[]
    side_effects: []

  # --- Change requests -----------------------------------------------------------
  - method: POST
    path: "/scheduling/change-requests"
    description: "Student files a DROP/ADD/SWAP change request during CHANGE_WINDOW."
    roles: [Student]
    code: 201
    input: [student_id, term_id, kind, "drop_entry_id?", "add_section_id?", reason]
    output: ScheduleChangeRequest
    side_effects: []
  - method: GET
    path: "/scheduling/change-requests"
    description: "Filtered list: student_id?, term_id?, state?, kind?."
    roles: [Administrator, Counselor, Student]
    code: 200
    input: ["student_id?", "term_id?", "state?", "kind?", "drop_entry_id?", "add_section_id?", "reviewed_by_counselor_id?", "limit?", "offset?"]
    output: ScheduleChangeRequest[]
    side_effects: []
  - method: GET
    path: "/scheduling/change-requests/{id}"
    description: "Read one change request."
    roles: [Administrator, Counselor, Student]
    code: 200
    input: []
    output: ScheduleChangeRequest
    side_effects: []
  - method: POST
    path: "/scheduling/change-requests/{id}/claim"
    description: "Counselor claims a SUBMITTED request (SUBMITTED -> COUNSELOR_REVIEW)."
    roles: [Counselor]
    code: 200
    input: []
    output: ScheduleChangeRequest
    side_effects: ["reviewed_by_counselor_id set", "increments ScheduleChangeRequest.version by 1"]
  - method: POST
    path: "/scheduling/change-requests/{id}/return-for-revision"
    description: "Counselor returns the request to the student (COUNSELOR_REVIEW -> REVISED)."
    roles: [Counselor]
    code: 200
    input: [revision_note]
    output: ScheduleChangeRequest
    side_effects: ["increments ScheduleChangeRequest.version by 1"]
  - method: POST
    path: "/scheduling/change-requests/{id}/resubmit"
    description: "Student resubmits a REVISED request (REVISED -> SUBMITTED)."
    roles: [Student]
    code: 200
    input: []
    output: ScheduleChangeRequest
    side_effects: ["reviewed_by_counselor_id reset to null", "increments ScheduleChangeRequest.version by 1"]
  - method: POST
    path: "/scheduling/change-requests/{id}/decide"
    description: "Administrator approves or rejects a COUNSELOR_REVIEW request, with OCC on the term and segregation of duties."
    roles: [Administrator]
    code: 200
    input: [decision, expected_term_version]
    output: ScheduleChangeRequest
    side_effects: ["decided_by_admin := true", "increments ScheduleChangeRequest.version by 1"]
  - method: POST
    path: "/scheduling/change-requests/{id}/execute"
    description: "Execute an APPROVED request: applies drop/add/swap atomically, re-validating business checks."
    roles: [Administrator]
    code: 200
    input: []
    output: ScheduleChangeRequest
    side_effects: ["ScheduleEntry DROPPED/MOVED + new ENROLLED row", "Section counters recompute", "Student.planned_credit_load recompute", "increments ScheduleChangeRequest.version by 1"]
  - method: POST
    path: "/scheduling/change-requests/{id}/cancel"
    description: "Student cancels own SUBMITTED/REVISED request."
    roles: [Student]
    code: 200
    input: []
    output: ScheduleChangeRequest
    side_effects: ["increments ScheduleChangeRequest.version by 1"]

  # --- Appointments ----------------------------------------------------------------
  - method: POST
    path: "/scheduling/appointments"
    description: "Book an appointment (counselor buffer + student overlap + no-show freeze checks)."
    roles: [Counselor, Student]
    code: 201
    input: [counselor_id, student_id, start_at, end_at]
    output: Appointment
    side_effects: ["no_show_count_snapshot computed"]
  - method: GET
    path: "/scheduling/appointments"
    description: "Filtered list: counselor_id?, student_id?, state?."
    roles: [Administrator, Counselor, Student]
    code: 200
    input: ["counselor_id?", "student_id?", "state?", "limit?", "offset?"]
    output: Appointment[]
    side_effects: []
  - method: GET
    path: "/scheduling/appointments/{id}"
    description: "Read one appointment."
    roles: [Administrator, Counselor, Student]
    code: 200
    input: []
    output: Appointment
    side_effects: []
  - method: POST
    path: "/scheduling/appointments/{id}/complete"
    description: "BOOKED -> COMPLETED (attending counselor only)."
    roles: [Counselor]
    code: 200
    input: []
    output: Appointment
    side_effects: ["increments Appointment.version by 1"]
  - method: POST
    path: "/scheduling/appointments/{id}/mark-no-show"
    description: "BOOKED -> NO_SHOW (attending counselor only); may trip the 3-strike freeze."
    roles: [Counselor]
    code: 200
    input: []
    output: Appointment
    side_effects: ["no-show count recompute", "increments Appointment.version by 1"]
  - method: POST
    path: "/scheduling/appointments/{id}/cancel"
    description: "BOOKED -> CANCELLED (attending counselor or the student)."
    roles: [Counselor, Student]
    code: 200
    input: []
    output: Appointment
    side_effects: ["increments Appointment.version by 1"]

  # --- Recovery placements -----------------------------------------------------------
  - method: POST
    path: "/scheduling/recovery-placements"
    description: "Counselor creates a recovery placement for a credit-deficient student on their caseload."
    roles: [Counselor]
    code: 201
    input: [student_id, term_id, target_course_id]
    output: RecoveryPlacement
    side_effects: ["priority_score computed via recovery_priority"]
  - method: GET
    path: "/scheduling/recovery-placements"
    description: "Filtered list: student_id?, term_id?, state?."
    roles: [Administrator, Counselor, Student]
    code: 200
    input: ["student_id?", "term_id?", "state?", "target_course_id?", "section_id?", "limit?", "offset?"]
    output: RecoveryPlacement[]
    side_effects: []
  - method: GET
    path: "/scheduling/recovery-placements/{id}"
    description: "Read one recovery placement."
    roles: [Administrator, Counselor, Student]
    code: 200
    input: []
    output: RecoveryPlacement
    side_effects: []
  - method: POST
    path: "/scheduling/recovery-placements/{id}/place"
    description: "Place the deficient student into a selected recovery section."
    roles: [Counselor]
    code: 200
    input: []
    output: RecoveryPlacement
    side_effects: ["section_id set", "ScheduleEntry created (origin=RECOVERY_PLACEMENT)", "Section counters recompute", "fresh CreditAudit written", "Student.credit_deficient recompute", "increments RecoveryPlacement.version by 1"]
  - method: POST
    path: "/scheduling/recovery-placements/{id}/waive"
    description: "Administrator waives a PENDING recovery placement."
    roles: [Administrator]
    code: 200
    input: [waiver_reason]
    output: RecoveryPlacement
    side_effects: ["Student.credit_deficient recompute"]

  # --- Test-driving clock --------------------------------------------------------
  # --- Single-resource reads (also anchor the collection-segment heuristic) ----
  - method: GET
    path: "/scheduling/schedule-entries/{id}"
    description: "Read one ScheduleEntry."
    roles: [Administrator, Counselor, Student]
    code: 200
    input: []
    output: ScheduleEntry
    side_effects: []
  - method: GET
    path: "/scheduling/credit-audits/{id}"
    description: "Read one CreditAudit by id."
    roles: [Administrator, Counselor]
    code: 200
    input: []
    output: CreditAudit
    side_effects: []
  - method: GET
    path: "/scheduling/qualifications/{id}"
    description: "Read one TeacherQualification by id."
    roles: [Administrator, Counselor]
    code: 200
    input: []
    output: TeacherQualification
    side_effects: []

  # --- Filtered-list reads required for FK reverse-reachability ----------------
  - method: GET
    path: "/scheduling/schedule-entries"
    description: "Filtered list of ScheduleEntry rows: term_id?, section_id?, student_id?, state?."
    roles: [Administrator, Counselor]
    code: 200
    input: ["term_id?", "section_id?", "student_id?", "state?", "limit?", "offset?"]
    output: ScheduleEntry[]
    side_effects: []
  - method: GET
    path: "/scheduling/credit-audits"
    description: "Filtered list of CreditAudit rows: student_id?, term_id?."
    roles: [Administrator, Counselor]
    code: 200
    input: ["student_id?", "term_id?", "limit?", "offset?"]
    output: CreditAudit[]
    side_effects: []
  - method: GET
    path: "/scheduling/qualifications"
    description: "Filtered list of TeacherQualification rows: teacher_id?, course_id?."
    roles: [Administrator, Counselor]
    code: 200
    input: ["teacher_id?", "course_id?", "limit?", "offset?"]
    output: TeacherQualification[]
    side_effects: []

  # --- Test-driving clock --------------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default (before any set call) is exactly 2026-05-01T00:00:00Z; the clock MUST NOT fall back to wall-clock time."
    roles: [Administrator]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/unknown X-User-Role or X-User-ID."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not in the endpoint's allowed roles."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path or body-referenced resource does not exist."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Payload shape violation: missing required field, invalid enum, bad rank sequence, reason out of 10-500 chars, credits not a 0.25 step."
  - id: ERR_INVALID_TERM_POSTURE
    http: 409
    condition: "Term posture does not permit the operation (request outside COLLECTING, section edit outside BUILDING, change request outside CHANGE_WINDOW, rebalance outside LOCKED)."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Entity not in a legal from-state for the requested transition."
  - id: ERR_FORBIDDEN_OWNERSHIP
    http: 403
    condition: "Acting student/counselor does not own (or is not assigned to) the target resource."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Change-request decider's X-User-ID equals the reviewing counselor's id — the same person may not review and decide."
  - id: ERR_NO_SHOW_FREEZE
    http: 422
    condition: "Student has >= 3 NO_SHOW appointments inside the trailing 90-day window; new bookings frozen."
  - id: ERR_COURSE_INELIGIBLE
    http: 422
    condition: "Grade band, prerequisite, program exclusivity, or duplicate-course rule violated."
  - id: ERR_REQUEST_CAP_EXCEEDED
    http: 422
    condition: "More than 8 non-alternate requests, or requested primary credit load > 8.0."
  - id: ERR_SECTION_ASSIGNMENT_INVALID
    http: 422
    condition: "Teacher not qualified for the course, or room type mismatch with course.required_room_type."
  - id: ERR_GRID_CONFLICT
    http: 409
    condition: "Another non-CANCELLED section already occupies the same (teacher, period) or (room, period) slot in the term."
  - id: ERR_APPOINTMENT_CONFLICT
    http: 409
    condition: "Counselor buffer (10-minute) or overlap violated, or student double-booked."
  - id: ERR_STUDENT_PERIOD_CONFLICT
    http: 409
    condition: "Target section's period collides with another ENROLLED entry of the student."
  - id: ERR_SECTION_FULL
    http: 422
    condition: "Target section's enrolled_count == capacity (boundary: at capacity rejects)."
  - id: ERR_CREDIT_CEILING_EXCEEDED
    http: 422
    condition: "Change or recovery would push planned_credit_load above 8.0."
  - id: ERR_SINGLETON_CAP_EXCEEDED
    http: 422
    condition: "Change or recovery would exceed term.singleton_section_cap for singleton-course enrollments."
  - id: ERR_CHANGE_QUOTA_EXCEEDED
    http: 422
    condition: "Student already holds change_request_max_per_student APPROVED-not-EXECUTED change requests."
  - id: ERR_COHORT_CAP_EXCEEDED
    http: 422
    condition: "Placement would push the section's special-program cohort above ceil(0.5 * capacity)."
  - id: ERR_CASELOAD_FULL
    http: 422
    condition: "Counselor caseload_count == max_caseload; new assignment rejected."
  - id: ERR_NO_ELIGIBLE_SECTION
    http: 422
    condition: "ADD/SWAP execution found no PUBLISHED section passing the placement selector."
  - id: ERR_RECOVERY_NO_SECTION
    http: 422
    condition: "Recovery placement found no eligible section for the target course."
  - id: ERR_STALE_TERM_VERSION
    http: 412
    condition: "expected_term_version does not match the term's current version (OCC)."
  - id: ERR_PUBLISH_BLOCKED
    http: 409
    condition: "Publish precondition failed: unscheduled DRAFT sections remain or grid conflicts exist."
  - id: ERR_CLOSE_WINDOW_BLOCKED
    http: 409
    condition: "Close-change-window precondition failed: in-flight change requests exist."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Administrator
    description: "District scheduler/admin operator. Owns term lifecycle, catalog, people, section scheduling, publish, rebalance, change-request decisions, recovery waivers, and the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "term lifecycle transitions (close-collection, generate-sections, publish, open/close-change-window, rebalance-runs)"
      - "catalog/people CRUD (courses, counselors, teachers, rooms, students, qualifications)"
      - "section PATCH and cancel"
      - "change-request decide + execute"
      - "recovery-placement waive"
      - "logical clock set"
    shared_operations:
      - "read endpoints (terms, courses, students, sections, requests, appointments, recovery-placements, tally, audits)"
  - name: Counselor
    description: "Guidance counselor. Owns caseload-scoped workflows: claim/return change requests, book/manage appointments for caseload students, create/place recovery placements."
    identity: "entity_backed:Counselor"
    exclusive_operations:
      - "change-request claim and return-for-revision"
      - "appointment complete and mark-no-show"
      - "recovery-placement create and place"
    shared_operations:
      - "appointment book and cancel"
      - "read endpoints"
  - name: Student
    description: "High-school student. Owns course-request draft/submit/unsubmit/withdraw, change-request create/resubmit/cancel, and appointment booking/cancel for self."
    identity: "entity_backed:Student"
    exclusive_operations:
      - "course-request create/submit/unsubmit/delete"
      - "change-request create/resubmit/cancel"
    shared_operations:
      - "appointment book and cancel (self only)"
      - "read own schedule, credit audit, projection"
