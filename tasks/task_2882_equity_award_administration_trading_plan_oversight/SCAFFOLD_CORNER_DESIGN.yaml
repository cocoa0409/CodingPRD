          - calculations.share_reserve_ledger
          - entities.EquityPlan.fields.burn_rate_limit_bps
        distinguishing_aspect: |
          The summary is a pure read: with burn_rate_limit_bps 500 on 1000000 outstanding
          shares and 30000 shares granted it reports gross 300 bps, net 300 bps and
          headroom_shares 20000 (floor(500 * 1000000 / 10000) - 30000), all mirroring the plan
          row without mutating it or bumping its version.
        test_recipe:
          setup:
            - "Logical clock 2026-01-05T09:00:00Z; ACTIVE plan with 1000000 authorized shares, 1000000 common shares outstanding and burn_rate_limit_bps 500."
            - "One APPROVED NSO grant of 30000 shares."
