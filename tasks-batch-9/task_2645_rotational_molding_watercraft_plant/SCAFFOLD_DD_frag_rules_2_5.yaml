            - "ProductionOrder.${po}.status == \"COMPLETE\" with completed_qty == 1, material_cost_cents == 2520 == round_half_up(12.000 * 210), oven_energy_cost_cents == 6000 == round_half_up(60 * 100), overhead_cents == 1534 == round_half_up(8520 * 18.00 / 100), total_cost_cents == 10054 and unit_cost_cents == 10054 == floor(10054 / 1)"
