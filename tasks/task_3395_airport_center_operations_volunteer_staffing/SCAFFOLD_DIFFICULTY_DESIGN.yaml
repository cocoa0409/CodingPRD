              payload: { guest_id: "${g_id}" }
              as: CenterManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CENTER_CLOSED (state, priority 6, beats business_safety priority 7)"
            - "Guest.${g_id}.eligibility_status == ELIGIBLE still (the safety check that would flip it never runs)"
