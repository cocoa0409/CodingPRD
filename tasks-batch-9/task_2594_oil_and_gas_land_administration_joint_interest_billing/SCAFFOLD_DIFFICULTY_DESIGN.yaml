          - state_machines.OwnerDisbursement.ACCRUED_to_SUSPENDED
          - calculations.afe_consent_tally
        depth: 4
        chain: "Afe.afe_status -> synthesized AfeElection rows -> WellInterest.non_consent_flag -> Well.consent_working_interest_pct and OwnerDisbursement.disbursement_status -> InterestOwner.suspense_balance_cents"
