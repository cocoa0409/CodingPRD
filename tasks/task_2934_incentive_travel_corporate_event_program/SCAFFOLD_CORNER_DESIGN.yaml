      - Both cross-qualifier reads return ERR_NOT_RESOURCE_OWNER with HTTP 403 — the ownership rule applies
        to GET /registrations/{registration_id} and GET /qualifiers/{qualifier_id} exactly as it does
        to the write endpoints listed at priority 6.
      - 'Creating a GUEST seat for Ana''s qualifier_id while authenticated as Ben returns ERR_NOT_RESOURCE_OWNER
