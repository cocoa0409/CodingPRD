# =============================================================================
# Example: pet-grooming benchmark seed tables (v1)
# Pet Grooming Services API
# =============================================================================

scenario: |
  Pet grooming salon management system within a veterinary clinic. Manages daily
  scheduling through GroomingDays, SessionBlocks, GroomingJobs, GroomerStations,
  and JobAssignments. Considerations: role-based access (ClinicManager,
  GroomingTechnician, BillingAdmin), pet allergy safety (NUT_ALLERGY, GRASS_ALLERGY),
  station capability matching, groomer break period enforcement (15 min),
  pet conflict validation (cannot_be_groomed_with_pet_ids), peak session pricing
  (1.5x when 5+ active assignments), allergy exposure scoring with thresholds
  (50 points), override penalties (25 points), supply budget ledger tracking
  (provisional and finalized costs), cascading cancellations, and atomic invoice
  generation with budget validation.

domain_name: pet-grooming
api_prefix: /grooming-days

# =============================================================================
# Table 1: Complexity Profile
# =============================================================================
complexity_profile:
  entity_count: 5
  state_machine_count: 4
  calculation_count: 7
  validation_layers: 8
  endpoint_count: 23
  error_code_count: 26
  role_count: 4

# =============================================================================
# Table 2: Entity Relationship Table
# =============================================================================
entities:
  - name: GroomingDay
    parent: null
    common_fields: true  # id, created_at, updated_at
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: schedule_name, type: string, source: input, description: "Day template name" }
      - { name: total_supply_budget, type: number, source: input, description: "Monetary allocation for supplies" }
      - { name: supply_stock_balance, type: number, source: computed, description: "Remaining budget = total_budget - provisional_costs - finalized_costs" }
      - { name: allergy_exposure_score, type: integer, source: computed, description: "Accumulated risk level from AllergyExposureLedger, starts at 0" }
      - { name: status, type: enum, source: system, description: "PLANNING | ACTIVE | INVOICING_PENDING | CLOSED" }

  - name: SessionBlock
    parent: GroomingDay
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: grooming_day_id, type: string, source: system, description: "Parent day reference" }
      - { name: name, type: string, source: input, description: "Block name (e.g., Morning Appointments)" }
      - { name: start_time, type: integer, source: input, description: "Unix timestamp in seconds" }
      - { name: end_time, type: integer, source: input, description: "Unix timestamp in seconds, must > start_time" }
      - { name: status, type: enum, source: system, description: "PLANNING | READY_FOR_GROOMING | CANCELLED" }

  - name: GroomingJob
    parent: SessionBlock
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: grooming_day_id, type: string, source: system, description: "Parent day reference (for simplified querying)" }
      - { name: session_block_id, type: string, source: system, description: "Parent block reference" }
      - { name: pet_id, type: string, source: input, description: "UUID of the pet" }
      - { name: job_type, type: string, source: input, description: "Type of grooming (e.g., Full Groom)" }
      - { name: required_allergen_type, type: enum, source: input, default: "NONE", description: "NUT_ALLERGY | GRASS_ALLERGY | NONE" }
      - { name: cannot_be_groomed_with_pet_ids, type: array, source: input, description: "Array of pet UUIDs that conflict" }
      - { name: start_time, type: integer, source: input, description: "Unix timestamp in seconds" }
      - { name: end_time, type: integer, source: input, description: "Unix timestamp in seconds" }
      - { name: duration_minutes, type: number, source: computed, description: "Read-only: (end_time - start_time) / 60" }
      - { name: status, type: enum, source: system, description: "PENDING | SCHEDULED | CONFIRMED | CANCELLED" }

  - name: GroomerStation
    parent: GroomingDay
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: grooming_day_id, type: string, source: system, description: "Parent day reference" }
      - { name: station_name, type: string, source: input, description: "Station name" }
      - { name: station_type, type: string, source: input, description: "Station type" }
      - { name: supply_cost_per_hour, type: number, source: input, description: "Hourly supply cost rate" }
      - { name: special_capabilities, type: array, source: system, description: "Array of {id, name, enabled_date}; name from NUT_ALLERGY_SAFE | GRASS_ALLERGY_SAFE" }

  - name: JobAssignment
    parent: GroomingDay
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: grooming_day_id, type: string, source: system, description: "Parent day reference" }
      - { name: job_id, type: string, source: input, description: "Associated grooming job" }
      - { name: station_id, type: string, source: input, description: "Associated groomer station" }
      - { name: override_allergy_check, type: boolean, source: input, default: false, description: "Whether allergy threshold override was requested" }
      - { name: is_peak_session, type: boolean, source: computed, description: "True if this assignment contributes to peak pricing" }
      - { name: provisional_supply_cost, type: number, source: computed, description: "Estimated cost including peak multiplier" }
      - { name: final_supply_cost, type: number, source: computed, description: "Finalized cost (set during invoice generation)" }
      - { name: allergy_override_penalty_applied, type: boolean, source: computed, description: "True when peak + threshold breach + override authorized" }
      - { name: status, type: enum, source: system, description: "PROPOSED | CONFIRMED | ON_HOLD | TERMINATED | COMPLETE" }

# =============================================================================
# Table 3: State Machine Table
# =============================================================================
state_machines:
  - entity: GroomingDay
    field: status
    initial_state: PLANNING
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNING
        to: ACTIVE
        trigger: "POST /grooming-days/{dayId}/activate"
        actor: ClinicManager
        preconditions: []
        side_effects:
          - "Locks fundamental structure"
          - "Enables SessionBlock and assignment creation"

      - from: ACTIVE
        to: INVOICING_PENDING
        trigger: "POST /grooming-days/{dayId}/initiate-invoicing"
        actor: ClinicManager
        preconditions:
          - "No assignments in PROPOSED status (ERR_UNRESOLVED_ASSIGNMENTS_EXIST)"
        side_effects: []

      - from: INVOICING_PENDING
        to: CLOSED
        trigger: "POST /grooming-days/{dayId}/generate-invoice-report"
        actor: BillingAdmin
        preconditions:
          - "Total finalized costs must not exceed total_supply_budget (ERR_INVOICING_EXCEEDS_BUDGET)"
        side_effects:
          - "All CONFIRMED assignments finalized → COMPLETE"
          - "final_supply_cost set for each assignment"
          - "SupplyStockLedger: provisional_costs → 0, finalized_costs updated"
          - "Prevents further modifications"

  - entity: SessionBlock
    field: status
    initial_state: PLANNING
    terminal_states: [CANCELLED]
    transitions:
      - from: PLANNING
        to: READY_FOR_GROOMING
        trigger: "PUT /grooming-days/{dayId}/session-blocks/{blockId}"
        actor: ClinicManager
        preconditions:
          - "At least one GroomingJob exists in the block"
          - "All GroomingJobs in the block must be in CONFIRMED status (ERR_JOBS_NOT_CONFIRMED)"
        side_effects: []

      - from: READY_FOR_GROOMING
        to: PLANNING
        trigger: "system (automatic demotion when a confirmed assignment is terminated)"
        actor: system
        preconditions:
          - "A confirmed assignment in this block was terminated"
        side_effects: []

      - from: [PLANNING, READY_FOR_GROOMING]
        to: CANCELLED
        trigger: "PUT /grooming-days/{dayId}/session-blocks/{blockId}"
        actor: ClinicManager
        preconditions: []
        side_effects:
          - "All non-CANCELLED jobs → CANCELLED"
          - "All PROPOSED/CONFIRMED assignments → TERMINATED with ledger reversal"

  - entity: GroomingJob
    field: status
    initial_state: PENDING
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING
        to: SCHEDULED
        trigger: "system (assignment proposed for this job)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SCHEDULED
        to: CONFIRMED
        trigger: "system (assignment confirmed)"
        actor: system
        preconditions: []
        side_effects: []

      - from: [SCHEDULED, CONFIRMED]
        to: PENDING
        trigger: "system (assignment terminated)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PENDING
        to: CANCELLED
        trigger: "POST .../grooming-jobs/{jobId}/cancel"
        actor: GroomingTechnician
        preconditions:
          - "Job must be in PENDING status (ERR_JOB_NOT_PENDING_FOR_CANCEL)"
        side_effects: []

      - from: [PENDING, SCHEDULED, CONFIRMED]
        to: CANCELLED
        trigger: "system (parent SessionBlock cancelled)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: JobAssignment
    field: status
    initial_state: PROPOSED
    terminal_states: [TERMINATED, COMPLETE]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST .../job-assignments/{assignmentId}/confirm"
        actor: ClinicManager
        preconditions: []
        side_effects:
          - "Associated GroomingJob → CONFIRMED"

      - from: CONFIRMED
        to: ON_HOLD
        trigger: "system or manual"
        actor: ClinicManager
        preconditions: []
        side_effects: []

      - from: ON_HOLD
        to: CONFIRMED
        trigger: "system or manual"
        actor: ClinicManager
        preconditions: []
        side_effects: []

      - from: [PROPOSED, CONFIRMED]
        to: TERMINATED
        trigger: "POST .../job-assignments/{assignmentId}/terminate"
        actor: ClinicManager
        preconditions:
          - "Assignment must be in PROPOSED or CONFIRMED status (ERR_ASSIGNMENT_NOT_TERMINABLE)"
        side_effects:
          - "Associated GroomingJob → PENDING"
          - "SupplyStockLedger: provisional_supply_cost reversed"
          - "AllergyExposureLedger: peak and override penalties reversed"
          - "If parent SessionBlock was READY_FOR_GROOMING → PLANNING"

      - from: CONFIRMED
        to: COMPLETE
        trigger: "system (invoice generation)"
        actor: system
        preconditions: []
        side_effects:
          - "final_supply_cost set"
          - "SupplyStockLedger: provisional decremented, finalized incremented"

# =============================================================================
# Table 4: Calculation Rules Table
# =============================================================================
calculations:
  - name: provisional_supply_cost
    trigger: "assignment proposal"
    algorithm: rate_based
    formula: |
      base_cost = station.supply_cost_per_hour * job.duration_minutes / 60
      if is_peak_session:
        provisional_supply_cost = base_cost * PEAK_MULTIPLIER
      else:
        provisional_supply_cost = base_cost
    constants:
      PEAK_MULTIPLIER: 1.5

  - name: is_peak_session
    trigger: "assignment proposal"
    algorithm: count_threshold
    formula: |
      Count active assignments (PROPOSED or CONFIRMED) in the same SessionBlock.
      if count >= PEAK_THRESHOLD:
        is_peak_session = true
      else:
        is_peak_session = false
    constants:
      PEAK_THRESHOLD: 5
    note: "Count includes only PROPOSED and CONFIRMED (not COMPLETE or TERMINATED)"

  - name: allergy_exposure_score
    trigger: "assignment proposal, termination, cancellation cascade"
    algorithm: ledger
    formula: |
      Assignment proposal:
        if is_peak_session: allergy_score += PEAK_PENALTY
        if allergy_override_penalty_applied: allergy_score += OVERRIDE_PENALTY
      Termination/cancellation:
        reverse all penalties from the terminated assignment
      Score never goes below 0.
    constants:
      PEAK_PENALTY: 10
      OVERRIDE_PENALTY: 25
      THRESHOLD: 50
    note: "Threshold check: if projected score (after peak penalty) >= 50 AND is_peak, requires override"

  - name: supply_stock_balance
    trigger: "assignment proposal, termination, cancellation, invoice generation"
    algorithm: ledger
    formula: |
      supply_stock_balance = total_supply_budget - provisional_costs - finalized_costs
      provisional_costs = sum(provisional_supply_cost for PROPOSED/CONFIRMED assignments)
      finalized_costs = sum(final_supply_cost for COMPLETE assignments)

  - name: groomer_break_check
    trigger: "assignment proposal"
    algorithm: time_gap
    formula: |
      For each existing assignment (PROPOSED, CONFIRMED, COMPLETE) on the same station:
        gap = later_job.start_time - earlier_job.end_time
        if gap < BREAK_MINUTES * 60:
          reject with ERR_BREAK_PERIOD_VIOLATION
      Check applies bidirectionally.
    constants:
      BREAK_MINUTES: 15

  - name: pet_allergy_conflict_check
    trigger: "assignment proposal"
    algorithm: set_intersection
    formula: |
      Collect all pet_ids with assignments (PROPOSED, CONFIRMED, COMPLETE) in the same SessionBlock.
      If any of those pet_ids appear in the proposed job's cannot_be_groomed_with_pet_ids:
        reject with ERR_PET_ALLERGY_CONFLICT

  - name: final_supply_cost
    trigger: "invoice generation"
    algorithm: copy
    formula: |
      final_supply_cost = provisional_supply_cost
      (simplified in v1 to match provisional costs)

# =============================================================================
# Table 5: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "Role must have permission for this operation"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "Resource IDs in path must exist (validated left-to-right: dayId, then blockId, then jobId/stationId/assignmentId)"
    error_id: "ERR_DAY_NOT_FOUND / ERR_BLOCK_NOT_FOUND / ERR_JOB_NOT_FOUND / ERR_STATION_NOT_FOUND / ERR_ASSIGNMENT_NOT_FOUND"
    http_status: 404
    applies_to: all nested resource endpoints

  - priority: 4
    category: state
    check: "Parent GroomingDay must be in ACTIVE state for assignment/scheduling operations"
    error_id: ERR_DAY_NOT_ACTIVE
    http_status: 409
    applies_to: "Create SessionBlocks, GroomingJobs, JobAssignments, station capabilities"

  - priority: 5
    category: state
    check: "Target resource must be in correct state for operation"
    error_id: "ERR_JOB_NOT_PENDING / ERR_ASSIGNMENT_NOT_PROPOSED / ERR_ASSIGNMENT_NOT_TERMINABLE / etc."
    http_status: 409
    applies_to: state transition endpoints

  - priority: 6
    category: capability
    check: "Station must have matching safety capability for job's required_allergen_type"
    error_id: ERR_CAPABILITY_MISMATCH
    http_status: 400
    applies_to: "POST /job-assignments (proposal)"

  - priority: 7a
    category: scheduling
    check: "Groomer break: minimum 15 minutes between jobs on same station"
    error_id: ERR_BREAK_PERIOD_VIOLATION
    http_status: 409
    applies_to: "POST /job-assignments (proposal)"

  - priority: 7b
    category: safety
    check: "Pet allergy conflict: incompatible pets cannot be in same SessionBlock"
    error_id: ERR_PET_ALLERGY_CONFLICT
    http_status: 409
    applies_to: "POST /job-assignments (proposal)"

  - priority: 8
    category: safety
    check: "Allergy threshold: peak session assignment would push score >= 50 without override"
    error_id: ERR_ALLERGY_THRESHOLD_BREACHED
    http_status: 403
    applies_to: "POST /job-assignments (proposal, peak sessions only)"

  - priority: 9
    category: financial
    check: "Supply budget must be sufficient for provisional cost"
    error_id: ERR_INSUFFICIENT_SUPPLIES
    http_status: 402
    applies_to: "POST /job-assignments (proposal)"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 6: API Endpoint Table (18 endpoints)
# =============================================================================
endpoints:
  # --- GroomingDay ---
  - method: POST
    path: "/grooming-days"
    description: "Create a new GroomingDay"
    roles: [ClinicManager]
    code: 201
    input: [schedule_name, total_supply_budget]
    output: GroomingDay
    side_effects: ["status=PLANNING, supply_stock_balance=total_supply_budget, allergy_exposure_score=0"]

  - method: GET
    path: "/grooming-days"
    description: "List all GroomingDays"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "GroomingDay[]"
    side_effects: []

  - method: GET
    path: "/grooming-days/{dayId}"
    description: "Get a specific GroomingDay"
    roles: [Any]
    code: 200
    input: []
    output: GroomingDay
    side_effects: []

  - method: POST
    path: "/grooming-days/{dayId}/activate"
    description: "Activate a GroomingDay"
    roles: [ClinicManager]
    code: 200
    input: []
    output: GroomingDay
    side_effects: ["status → ACTIVE"]

  # --- SessionBlock ---
  - method: POST
    path: "/grooming-days/{dayId}/session-blocks"
    description: "Create a SessionBlock"
    roles: [GroomingTechnician]
    code: 201
    input: [name, start_time, end_time]
    output: SessionBlock
    side_effects: ["status=PLANNING"]

  - method: GET
    path: "/grooming-days/{dayId}/session-blocks"
    description: "List SessionBlocks for a day"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "SessionBlock[]"
    side_effects: []

  - method: GET
    path: "/grooming-days/{dayId}/session-blocks/{blockId}"
    description: "Get a specific SessionBlock"
    roles: [Any]
    code: 200
    input: []
    output: SessionBlock
    side_effects: []

  - method: PUT
    path: "/grooming-days/{dayId}/session-blocks/{blockId}"
    description: "Update SessionBlock status"
    roles: [ClinicManager]
    code: 200
    input: [status]
    output: SessionBlock
    side_effects: ["State transition + possible cascade cancellation"]

  # --- GroomingJob ---
  - method: POST
    path: "/grooming-days/{dayId}/session-blocks/{blockId}/grooming-jobs"
    description: "Create a GroomingJob"
    roles: [GroomingTechnician]
    code: 201
    input: [pet_id, job_type, "required_allergen_type?", "cannot_be_groomed_with_pet_ids?", start_time, end_time]
    output: GroomingJob
    side_effects: ["status=PENDING, duration_minutes auto-calculated"]

  - method: GET
    path: "/grooming-days/{dayId}/session-blocks/{blockId}/grooming-jobs"
    description: "List GroomingJobs for a block"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "GroomingJob[]"
    side_effects: []

  - method: GET
    path: "/grooming-days/{dayId}/session-blocks/{blockId}/grooming-jobs/{jobId}"
    description: "Get a specific GroomingJob"
    roles: [Any]
    code: 200
    input: []
    output: GroomingJob
    side_effects: []

  - method: POST
    path: "/grooming-days/{dayId}/session-blocks/{blockId}/grooming-jobs/{jobId}/cancel"
    description: "Cancel a GroomingJob"
    roles: [GroomingTechnician]
    code: 200
    input: []
    output: GroomingJob
    side_effects: ["status → CANCELLED (only PENDING jobs)"]

  # --- JobAssignment ---
  - method: POST
    path: "/grooming-days/{dayId}/job-assignments"
    description: "Propose a JobAssignment"
    roles: [GroomingTechnician]
    code: 201
    input: [job_id, station_id, "override_allergy_check?"]
    output: JobAssignment
    side_effects:
      - "Full validation cascade: day active, job pending, capability match, break check, pet conflict, allergy threshold, budget"
      - "Job → SCHEDULED"
      - "SupplyStockLedger updated"
      - "AllergyExposureLedger updated (if peak)"

  - method: GET
    path: "/grooming-days/{dayId}/job-assignments"
    description: "List JobAssignments for a day"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "JobAssignment[]"
    side_effects: []

  - method: GET
    path: "/grooming-days/{dayId}/job-assignments/{assignmentId}"
    description: "Get a specific JobAssignment"
    roles: [Any]
    code: 200
    input: []
    output: JobAssignment
    side_effects: []

  - method: POST
    path: "/grooming-days/{dayId}/job-assignments/{assignmentId}/confirm"
    description: "Confirm a proposed assignment"
    roles: [ClinicManager]
    code: 200
    input: []
    output: JobAssignment
    side_effects: ["status → CONFIRMED, job → CONFIRMED"]

  - method: POST
    path: "/grooming-days/{dayId}/job-assignments/{assignmentId}/terminate"
    description: "Terminate an assignment"
    roles: [ClinicManager]
    code: 200
    input: []
    output: JobAssignment
    side_effects:
      - "status → TERMINATED"
      - "Job → PENDING"
      - "SupplyStockLedger: provisional cost reversed"
      - "AllergyExposureLedger: penalties reversed"
      - "SessionBlock READY_FOR_GROOMING → PLANNING if applicable"

  # --- GroomerStation ---
  - method: POST
    path: "/grooming-days/{dayId}/groomer-stations"
    description: "Create a GroomerStation"
    roles: [GroomingTechnician]
    code: 201
    input: [station_name, station_type, supply_cost_per_hour]
    output: GroomerStation
    side_effects: ["special_capabilities initialized to empty array"]

  - method: GET
    path: "/grooming-days/{dayId}/groomer-stations"
    description: "List GroomerStations for a day"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "GroomerStation[]"
    side_effects: []

  - method: GET
    path: "/grooming-days/{dayId}/groomer-stations/{stationId}"
    description: "Get a specific GroomerStation"
    roles: [Any]
    code: 200
    input: []
    output: GroomerStation
    side_effects: []

  - method: POST
    path: "/grooming-days/{dayId}/groomer-stations/{stationId}/special-capabilities"
    description: "Add a special capability to a station"
    roles: [GroomingTechnician]
    code: 201
    input: [name, enabled_date]
    output: GroomerStation
    side_effects: ["Capability added to special_capabilities array"]

  # --- Financial Operations ---
  - method: POST
    path: "/grooming-days/{dayId}/initiate-invoicing"
    description: "Initiate invoicing phase"
    roles: [ClinicManager]
    code: 200
    input: []
    output: GroomingDay
    side_effects: ["status → INVOICING_PENDING"]

  - method: POST
    path: "/grooming-days/{dayId}/generate-invoice-report"
    description: "Generate invoice and close day"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: GroomingDay
    side_effects:
      - "Atomic transaction: finalize all CONFIRMED assignments → COMPLETE"
      - "final_supply_cost calculated for each"
      - "SupplyStockLedger: provisional → 0, finalized updated"
      - "Budget check: total finalized <= total_supply_budget (else rollback)"
      - "status → CLOSED"

# =============================================================================
# Table 7: Error Code Catalogue (23 error codes)
# =============================================================================
errors:
  # --- Auth ---
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header is missing or invalid"

  - id: ERR_INSUFFICIENT_PERMISSIONS
    http: 403
    condition: "Role does not have permission for this operation"

  # --- Request Validation ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "General request format error (missing required fields, type mismatch)"

  - id: ERR_INVALID_BLOCK_TIMES
    http: 400
    condition: "SessionBlock temporal boundaries invalid (end_time <= start_time)"

  - id: ERR_INVALID_JOB_TIMES
    http: 400
    condition: "GroomingJob temporal boundaries invalid (end_time <= start_time)"

  # --- Not Found ---
  - id: ERR_DAY_NOT_FOUND
    http: 404
    condition: "GroomingDay with given dayId does not exist"

  - id: ERR_BLOCK_NOT_FOUND
    http: 404
    condition: "SessionBlock with given blockId does not exist"

  - id: ERR_JOB_NOT_FOUND
    http: 404
    condition: "GroomingJob with given jobId does not exist"

  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "JobAssignment with given assignmentId does not exist"

  - id: ERR_STATION_NOT_FOUND
    http: 404
    condition: "GroomerStation with given stationId does not exist"

  # --- State Constraints ---
  - id: ERR_DAY_NOT_ACTIVE
    http: 409
    condition: "Operation requires GroomingDay to be in ACTIVE state"

  - id: ERR_DAY_NOT_IN_PLANNING
    http: 409
    condition: "Operation requires GroomingDay to be in PLANNING state (e.g., activate)"

  - id: ERR_DAY_NOT_READY_FOR_INVOICING
    http: 409
    condition: "generate-invoice-report requires day in INVOICING_PENDING state"

  - id: ERR_JOB_NOT_PENDING
    http: 409
    condition: "Job must be in PENDING state for assignment"

  - id: ERR_JOB_NOT_PENDING_FOR_CANCEL
    http: 409
    condition: "Job must be in PENDING status to cancel"

  - id: ERR_ASSIGNMENT_NOT_PROPOSED
    http: 409
    condition: "Confirm requires assignment to be in PROPOSED status"

  - id: ERR_ASSIGNMENT_NOT_TERMINABLE
    http: 409
    condition: "Terminate requires assignment to be in PROPOSED or CONFIRMED status"

  - id: ERR_ILLEGAL_BLOCK_STATE_TRANSITION
    http: 409
    condition: "Invalid SessionBlock state transition"

  - id: ERR_JOBS_NOT_CONFIRMED
    http: 409
    condition: "All jobs must be CONFIRMED to transition block to READY_FOR_GROOMING"

  - id: ERR_UNRESOLVED_ASSIGNMENTS_EXIST
    http: 409
    condition: "No PROPOSED assignments allowed when initiating invoicing"

  # --- Business Rules ---
  - id: ERR_CAPABILITY_MISMATCH
    http: 400
    condition: "Station lacks required allergy-safe capability for the job"

  - id: ERR_BREAK_PERIOD_VIOLATION
    http: 409
    condition: "Insufficient break time (< 15 minutes) between jobs on same station"

  - id: ERR_PET_ALLERGY_CONFLICT
    http: 409
    condition: "Incompatible pets would be co-located in the same SessionBlock"

  # --- Safety & Financial ---
  - id: ERR_ALLERGY_THRESHOLD_BREACHED
    http: 403
    condition: "Peak session would push allergy score >= 50 threshold without override"

  - id: ERR_INSUFFICIENT_SUPPLIES
    http: 402
    condition: "Provisional cost exceeds remaining supply budget"

  - id: ERR_INVOICING_EXCEEDS_BUDGET
    http: 402
    condition: "Total finalized costs would exceed total_supply_budget"

# =============================================================================
# RBAC Role Permission Matrix
# =============================================================================
roles:
  - name: ClinicManager
    description: "Senior staff; oversees operations, approves assignments, manages day lifecycle"
    exclusive_operations:
      - "POST /grooming-days — Create GroomingDay"
      - "POST .../activate — Activate day"
      - "PUT .../session-blocks/{id} — Update SessionBlock status"
      - "POST .../job-assignments/{id}/confirm — Confirm assignment"
      - "POST .../job-assignments/{id}/terminate — Terminate assignment"
      - "POST .../initiate-invoicing — Initiate invoicing"

  - name: GroomingTechnician
    description: "Frontline staff; handles scheduling and station configuration"
    exclusive_operations:
      - "POST .../session-blocks — Create SessionBlock"
      - "POST .../grooming-jobs — Create GroomingJob"
      - "POST .../grooming-jobs/{id}/cancel — Cancel job"
      - "POST .../job-assignments — Propose assignment"
      - "POST .../groomer-stations — Create station"
      - "POST .../groomer-stations/{id}/special-capabilities — Add capability"

  - name: BillingAdmin
    description: "Financial staff; handles invoice generation"
    exclusive_operations:
      - "POST .../generate-invoice-report — Generate invoice and close day"

  - name: Any
    description: "Shared across all roles"
    shared_operations:
      - "GET /grooming-days — List days"
      - "GET /grooming-days/{id} — Get day"
      - "GET .../session-blocks — List blocks"
      - "GET .../session-blocks/{id} — Get block"
      - "GET .../grooming-jobs — List jobs"
      - "GET .../grooming-jobs/{id} — Get job"
      - "GET .../job-assignments — List assignments"
      - "GET .../job-assignments/{id} — Get assignment"
      - "GET .../groomer-stations — List stations"
      - "GET .../groomer-stations/{id} — Get station"
