        distinguishing_aspect: "Ownership validation on evidence: a CarrierOperator submitting with submitted_by_party SHIPPER, or the carrier-operator of a DIFFERENT carrier, both fail ERR_NOT_RESOURCE_OWNER (403) — the party claim must match both role and complaint ownership."
        test_recipe:
