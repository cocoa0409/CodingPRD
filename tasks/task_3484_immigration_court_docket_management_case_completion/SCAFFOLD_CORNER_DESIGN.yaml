            - "second returns 409 with error_id == ERR_NOTICE_ALREADY_DEFECTIVE"

      - name: administrative_closure_cancels_only_scheduled_hearings
        claim_type: Conditional cascade
        grounds:
          - state_machines.Case.MERITS_to_ADMIN_CLOSED
          - state_machines.Hearing.SCHEDULED_to_CANCELLED
        distinguishing_aspect: "The closure cascade is conditional on hearing state: the SCHEDULED merits hearing is CANCELLED while the COMPLETED master hearing is untouched."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Case in MERITS: master hearing COMPLETED (2026-09-03), merits hearing SCHEDULED (2026-09-04, not yet held)."
          setup_api_calls:
            - *c_clock
            - *c_court
            - *c_judge
            - *c_case_eng
            - *c_assign
            - *c_master
            - *c_clock_m
            - *c_complete_m
            - *c_get4
            - *c_merits
          trigger:
            - call: "POST /eoir/cases/${case_id}/administrative-closure"
              payload: { closure_reason: "PENDING_APPLICATION" }
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
          assert:
            - "Case.${case_id}.status == ADMIN_CLOSED"
            - "Hearing.${h_i}.status == CANCELLED (the SCHEDULED hearing)"
            - "Hearing.${h_m}.status remains COMPLETED (only SCHEDULED hearings are cancelled)"
            - "GET /eoir/hearings?case_id=${case_id}&status=SCHEDULED returns 0 rows"

      - name: recalendar_returns_admin_closed_case_to_merits
        claim_type: Valid Transition
        grounds:
          - state_machines.Case.ADMIN_CLOSED_to_MERITS
        distinguishing_aspect: "ADMIN_CLOSED is not absorbing: recalendar (by the assigned judge) returns the case to MERITS, after which a new merits hearing can be scheduled — the closure loop MERITS -> ADMIN_CLOSED -> MERITS closes cleanly."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Case in MERITS with its merits hearing SCHEDULED, then administratively closed (hearing cancelled by the cascade)."
          setup_api_calls:
            - *c_clock
            - *c_court
            - *c_judge
            - *c_case_eng
            - *c_assign
            - *c_master
            - *c_clock_m
            - *c_complete_m
            - *c_get4
            - *c_merits
            - call: "POST /eoir/cases/${case_id}/administrative-closure"
              payload: { closure_reason: "PENDING_APPLICATION" }
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
          trigger:
            - call: "POST /eoir/cases/${case_id}/recalendar"
              payload: {}
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
              captures: { case_vr: $.data.version }
            - call: "POST /eoir/hearings"
              payload: { case_id: "${case_id}", hearing_type: "INDIVIDUAL_MERITS", scheduled_start: "2026-09-08T10:00:00Z", expected_case_version: "${case_vr}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { h_new: $.data.id }
          assert:
            - "recalendar returns 200 and Case.${case_id}.status == MERITS"
            - "the new merits hearing is created with 201 and Hearing.${h_new}.status == SCHEDULED"

      - name: venue_motion_grant_moves_venue_and_resets_docket
        claim_type: Cross-entity cascade
        grounds:
          - state_machines.ChangeOfVenueMotion.PENDING_to_GRANTED
          - state_machines.Case.CALENDAR_to_FILED
        distinguishing_aspect: "A granted change-of-venue motion (party-initiated, judge-decided) rewrites case.court_id, clears the assigned judge, resets the case to FILED, and cancels the SCHEDULED hearing — the counterpart to admin-driven reassignment, which uses a selector instead of a motion."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Court A holds the docketed case (CALENDAR) with a SCHEDULED master hearing; court B exists as the requested destination. A PENDING venue motion targets court B."
          setup_api_calls:
            - *c_clock
            - *c_court
            - call: "POST /eoir/courts"
              payload: { court_code: "CT-VB", name: "Venue B", city: "Duluth", annual_completion_goal: 100, detained_daily_hearing_capacity: 2 }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { court_b: $.data.id }
            - *c_judge
            - *c_case_eng
            - *c_assign
            - *c_master
            - call: "POST /eoir/venue-motions"
              payload: { case_id: "${case_id}", destination_court_id: "${court_b}", reason: "respondent moved" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { vm_id: $.data.id }
          trigger:
            - call: "POST /eoir/venue-motions/${vm_id}/decide"
              payload: { decision: "GRANTED" }
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
          assert:
            - "ChangeOfVenueMotion.${vm_id}.status == GRANTED with decided_by_judge_id == ${judge_id}"
            - "Case.${case_id}.court_id == ${court_b} and assigned_judge_id is null and status == FILED"
            - "Hearing.${h_m}.status == CANCELLED"
            - "Court A (${court_id}) pending_case_count == 0; Court B (${court_b}) pending_case_count == 1"

      - name: venue_motion_deny_keeps_case_and_hearing
        claim_type: Valid Transition
        grounds:
          - state_machines.ChangeOfVenueMotion.PENDING_to_DENIED
        distinguishing_aspect: "The DENIED branch performs no cascade: venue, judge, case state, and the scheduled hearing are all unchanged."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Same shape as the grant corner: CALENDAR case, SCHEDULED master hearing, PENDING venue motion to court B."
          setup_api_calls:
            - *c_clock
            - *c_court
            - call: "POST /eoir/courts"
              payload: { court_code: "CT-VB", name: "Venue B", city: "Duluth", annual_completion_goal: 100, detained_daily_hearing_capacity: 2 }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { court_b: $.data.id }
            - *c_judge
            - *c_case_eng
            - *c_assign
            - *c_master
            - call: "POST /eoir/venue-motions"
              payload: { case_id: "${case_id}", destination_court_id: "${court_b}", reason: "respondent moved" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { vm_id: $.data.id }
          trigger:
            - call: "POST /eoir/venue-motions/${vm_id}/decide"
              payload: { decision: "DENIED" }
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
          assert:
            - "ChangeOfVenueMotion.${vm_id}.status == DENIED"
            - "Case.${case_id}.court_id == ${court_id}, assigned_judge_id == ${judge_id}, status == CALENDAR"
            - "Hearing.${h_m}.status == SCHEDULED (untouched)"

      - name: pending_application_grant_closes_case_without_replacement
        claim_type: Conditional cascade
        grounds:
          - state_machines.ContinuanceRequest.PENDING_to_GRANTED
          - state_machines.Case.MERITS_to_ADMIN_CLOSED
        distinguishing_aspect: "The continuance grant's side-effect set is conditional on reason_code: PENDING_APPLICATION routes the case to ADMIN_CLOSED and CANCELS the hearing with NO superseding replacement — the exact inverse of the ordinary grant, which CONTINUES the hearing and creates one."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Case in MERITS (master completed), merits hearing SCHEDULED 2026-09-04T10:00; a PENDING continuance with reason_code PENDING_APPLICATION targets it."
          setup_api_calls:
            - *c_clock
            - *c_court
            - *c_judge
            - *c_case_eng
            - *c_assign
            - *c_master
            - *c_clock_m
            - *c_complete_m
            - *c_get4
            - *c_merits
            - call: "POST /eoir/continuance-requests"
              payload: { case_id: "${case_id}", hearing_id: "${h_i}", reason_code: "PENDING_APPLICATION" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { cont_id: $.data.id }
          trigger:
            - call: "POST /eoir/continuance-requests/${cont_id}/decide"
              payload: { decision: "GRANTED" }
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
          assert:
            - "ContinuanceRequest.${cont_id}.status == GRANTED"
            - "Case.${case_id}.status == ADMIN_CLOSED (pending application elsewhere swallows the hearing)"
            - "Hearing.${h_i}.status == CANCELLED — not CONTINUED"
            - "GET /eoir/hearings?case_id=${case_id} returns exactly 2 rows (1 COMPLETED master + 1 CANCELLED merits); no replacement was created"
            - "Case.${case_id}.continuance_count == 1"

      - name: continuance_deny_leaves_hearing_scheduled
        claim_type: Valid Transition
        grounds:
          - state_machines.ContinuanceRequest.PENDING_to_DENIED
        distinguishing_aspect: "The DENIED branch performs no side effects on the hearing or case — only the request's own status and audit fields change."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Docketed case with SCHEDULED master hearing 2026-09-10T10:00 and a PENDING EVIDENCE_GATHERING continuance."
          setup_api_calls:
            - *c_clock
            - *c_court
            - *c_judge
            - *c_case_eng
            - *c_assign
            - &c_master_late
              call: "POST /eoir/hearings"
              payload: { case_id: "${case_id}", hearing_type: "MASTER_CALENDAR", scheduled_start: "2026-09-10T10:00:00Z", expected_case_version: "${case_v2}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { h_l: $.data.id }
            - call: "POST /eoir/continuance-requests"
              payload: { case_id: "${case_id}", hearing_id: "${h_l}", reason_code: "EVIDENCE_GATHERING" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { cont_id: $.data.id }
          trigger:
            - call: "POST /eoir/continuance-requests/${cont_id}/decide"
              payload: { decision: "DENIED" }
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
          assert:
            - "ContinuanceRequest.${cont_id}.status == DENIED with decided_by_judge_id == ${judge_id} and decided_at == \"2026-09-01T00:00:00Z\""
            - "Hearing.${h_l}.status remains SCHEDULED"
            - "Case.${case_id}.status remains CALENDAR and continuance_count == 0"

      - name: docket_review_lapse_finalizes_expired_decision
        claim_type: Valid Transition
        grounds:
          - state_machines.Case.DECIDED_to_COMPLETED
          - state_machines.Decision.ISSUED_to_FINAL
          - endpoints.POST_/eoir/courts/{courtId}/docket-reviews
        distinguishing_aspect: "The ops-run checkpoint is what converts expired appeal windows into completions: a DECIDED case whose ISSUED decision's deadline passed is moved to COMPLETED (decision FINAL) only when the docket review runs."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Case driven to DECIDED (decision issued 2026-09-04T12:00:00Z, appeal deadline 2026-10-04T12:00:00Z, no appeal filed). Clock advanced to 2026-10-05T00:00:00Z."
          setup_api_calls:
            - *c_clock
            - *c_court
            - *c_judge
            - *c_case_eng
            - *c_assign
            - *c_master
            - *c_clock_m
            - *c_complete_m
            - *c_get4
            - *c_merits
            - *c_clock_i
            - *c_complete_i
            - *c_get5
            - *c_decide
            - call: "POST /eoir/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T00:00:00Z" }
              as: CourtAdministrator
              as_user_id: "admin-01"
          trigger:
            - call: "POST /eoir/courts/${court_id}/docket-reviews"
              payload: {}
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { rev: $.data.id }
          assert:
            - "DocketReview.${rev}.cases_finalized_by_lapse == 1"
            - "Decision.${dec_id}.status == FINAL"
            - "Case.${case_id}.status == COMPLETED and completed_at == \"2026-10-05T00:00:00Z\""
            - "DocketReview.${rev}.completions_ytd == 1 and pending_case_count == 0"

      - name: docket_review_lapse_finalizes_in_absentia_after_reopen_window
        claim_type: Valid Transition
        grounds:
          - state_machines.Case.IN_ABSENTIA_to_COMPLETED
          - calculations.appeal_and_reopen_windows
        distinguishing_aspect: "An IN_ABSENTIA case lapses to COMPLETED only after the 180-day reopen deadline (not the 30-day appeal deadline): at clock 2027-03-05 with no FILED motion, the checkpoint finalizes it."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Case docketed; master hearing 2026-09-05T10:00 with SERVED notice; clock 2026-09-05T11:00; no-show recorded (decision issued 2026-09-05T11:00:00Z, reopen deadline 2027-03-04T11:00:00Z). Clock advanced past the deadline."
          setup_api_calls:
            - *c_clock
            - *c_court
            - *c_judge
            - *c_case_eng
            - *c_assign
            - &c_hearing_ns
              call: "POST /eoir/hearings"
              payload: { case_id: "${case_id}", hearing_type: "MASTER_CALENDAR", scheduled_start: "2026-09-05T10:00:00Z", expected_case_version: "${case_v2}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { h_n: $.data.id }
            - &c_notice
              call: "POST /eoir/notices"
              payload: { hearing_id: "${h_n}", service_method: "MAIL", served_at: "2026-08-20T00:00:00Z" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { notice_id: $.data.id }
            - &c_clock_ns
              call: "POST /eoir/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T11:00:00Z" }
              as: CourtAdministrator
              as_user_id: "admin-01"
            - &c_noshow
              call: "POST /eoir/hearings/${h_n}/record-no-show"
              payload: {}
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
            - &c_get_dec
              call: "GET /eoir/decisions"
              payload: { case_id: "${case_id}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { ia_dec: "$.data[0].id" }
            - call: "POST /eoir/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-05T00:00:00Z" }
              as: CourtAdministrator
              as_user_id: "admin-01"
          trigger:
            - call: "POST /eoir/courts/${court_id}/docket-reviews"
              payload: {}
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { rev: $.data.id }
          assert:
            - "DocketReview.${rev}.cases_finalized_by_lapse == 1"
            - "Case.${case_id}.status == COMPLETED with completed_at == \"2027-03-05T00:00:00Z\""
            - "Decision.${ia_dec}.status == FINAL"

      - name: docket_review_lapse_skips_case_with_filed_motion
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Case.IN_ABSENTIA_to_COMPLETED
          - entities.MotionToReopen.fields.status
        distinguishing_aspect: "The lapse precondition has a conjunct: a FILED motion to reopen blocks finalization even past the 180-day deadline — the checkpoint leaves the case IN_ABSENTIA and reports zero lapses."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Same in-absentia setup, but an EXCEPTIONAL_CIRCUMSTANCES motion is filed 2026-09-06 (inside the window) and left FILED; clock then advanced past the reopen deadline."
          setup_api_calls:
            - *c_clock
            - *c_court
            - *c_judge
            - *c_case_eng
            - *c_assign
            - *c_hearing_ns
            - *c_notice
            - *c_clock_ns
            - *c_noshow
            - *c_get_dec
            - call: "POST /eoir/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: CourtAdministrator
              as_user_id: "admin-01"
            - call: "POST /eoir/motions-to-reopen"
              payload: { case_id: "${case_id}", decision_id: "${ia_dec}", basis: "EXCEPTIONAL_CIRCUMSTANCES" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { mot_id: $.data.id }
            - call: "POST /eoir/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-05T00:00:00Z" }
              as: CourtAdministrator
              as_user_id: "admin-01"
          trigger:
            - call: "POST /eoir/courts/${court_id}/docket-reviews"
              payload: {}
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { rev: $.data.id }
          assert:
            - "DocketReview.${rev}.cases_finalized_by_lapse == 0 (the FILED motion blocks the lapse)"
            - "Case.${case_id}.status remains IN_ABSENTIA and Decision.${ia_dec}.status remains ISSUED"
            - "MotionToReopen.${mot_id}.status remains FILED"

      - name: in_absentia_decision_is_appealable
        claim_type: Valid Transition
        grounds:
          - state_machines.Case.IN_ABSENTIA_to_APPEALED
          - state_machines.Decision.ISSUED_to_APPEAL_PENDING
        distinguishing_aspect: "The in-absentia removal order is itself appealable within its 30-day window: filing moves the case IN_ABSENTIA -> APPEALED and the decision ISSUED -> APPEAL_PENDING (an appeal and a motion to reopen are alternative post-order remedies)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. In-absentia order entered 2026-09-05T11:00:00Z; appeal filed the next day, inside the window."
          setup_api_calls:
            - *c_clock
            - *c_court
            - *c_judge
            - *c_case_eng
            - *c_assign
            - *c_hearing_ns
            - *c_notice
            - *c_clock_ns
            - *c_noshow
            - *c_get_dec
            - call: "POST /eoir/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: CourtAdministrator
              as_user_id: "admin-01"
          trigger:
            - call: "POST /eoir/appeals"
              payload: { decision_id: "${ia_dec}", grounds: "lack of notice" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { app_id: $.data.id }
          assert:
            - "the response status is 201 and Appeal.${app_id}.status == FILED"
            - "Case.${case_id}.status == APPEALED and Decision.${ia_dec}.status == APPEAL_PENDING"

      - name: appeal_dismissed_completes_case
        claim_type: Valid Transition
        grounds:
          - state_machines.Appeal.FILED_to_DISMISSED
        distinguishing_aspect: "DISMISSED is a board ruling distinct from AFFIRMED but with the same completion side effect: decision FINAL, case COMPLETED with completed_at stamped — closing the appeal ruling enum."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Case driven to APPEALED (appeal FILED)."]
          setup_api_calls:
            - *c_clock
            - *c_court
            - *c_judge
            - *c_case_eng
            - *c_assign
            - *c_master
            - *c_clock_m
            - *c_complete_m
            - *c_get4
            - *c_merits
            - *c_clock_i
            - *c_complete_i
            - *c_get5
            - *c_decide
            - *c_appeal
          trigger:
            - call: "POST /eoir/appeals/${app_id}/decide"
              payload: { ruling: "DISMISSED" }
              as: BoardMember
              as_user_id: "bm-01"
          assert:
            - "the response status is 200 and Appeal.${app_id}.status == DISMISSED"
            - "Decision.${dec_id}.status == FINAL and Case.${case_id}.status == COMPLETED"
            - "Case.${case_id}.completed_at == \"2026-09-04T12:00:00Z\""

      - name: appeal_affirm_completes_case_and_decision
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Appeal.FILED_to_AFFIRMED
        excluded_because:
          difficulty_instance: court_pace_calendar_vs_hearing_day_variants
          rationale: "The §1.8 instance drives a case DECIDED -> APPEALED -> COMPLETED via an AFFIRMED ruling and asserts the completion through the docket snapshot."

      - name: reopen_grant_rescinds_decision_and_restores_calendar
        claim_type: Side Effect Execution
        grounds:
          - state_machines.MotionToReopen.FILED_to_GRANTED
        excluded_because:
          difficulty_instance: reopen_grant_cascade_motion_decision_case_hearing
          rationale: "The §1.8 depth-3 cascade instance asserts the rescission, the case's return to CALENDAR, and the auto-created reopen hearing."

  # ===========================================================================
  - section: calculations
    instances:

      - name: priority_score_drag_cap_and_floor
        claim_type: Constants Applied
        grounds:
          - calculations.case_priority_score
          - calculations.continuance_caps_bumps_and_auto_hearing_offsets
        distinguishing_aspect: "The drag term caps at min(count, 4): a non-detained case with FIVE granted continuances (the non-detained cap) sheds only 100 points, and the max(0, ...) floor keeps the score at 0 rather than going negative — plus the 6th filing hits ERR_CONTINUANCE_CAP_REACHED."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. One PRO_SE English non-detained case docketed with master hearing 2026-09-10T10:00; five continuances filed and granted in sequence (each bumping the live hearing +28 days)."
          setup_api_calls:
            - *c_clock
            - *c_court
            - *c_judge
            - *c_case_eng
            - *c_assign
            - *c_master_late
            - call: "POST /eoir/continuance-requests"
