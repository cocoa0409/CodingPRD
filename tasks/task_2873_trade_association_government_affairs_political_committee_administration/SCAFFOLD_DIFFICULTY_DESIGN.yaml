            - "Both notices report lobbying_spend_cents == 24000000 from the single CERTIFIED report"
  - rule_id: combinatorial_formula
    instances:
      - name: candidate_support_score_four_input_nonlinear_blend
        grounds:
          - calculations.candidate_support_score
          - calculations.contribution_allowance
          - entities.PacContribution.fields.support_score
          - entities.PacContribution.fields.max_allowed_cents
          - entities.ActionAlert.fields.matched_member_count
        distinguishing_aspect: |
          Mode (a): a four-input formula whose inputs interact non-linearly - three weighted candidate attributes
          plus a cross-entity grassroots term capped by min(100, 10 * matched_actions), and the resulting 65.78
          score then selects a tiered share (0.25, not 0.50) that is itself nested inside
          min(tier_allowance, remaining_limit); no single input can be varied without changing the tier branch.
        test_recipe:
          setup:
            - "Three FEDERAL members in district CA-12 seated on one committee (weights 3 + 2 + 1 = 6) and one ADOPTED position."
            - "One LIVE grassroots campaign whose single DISPATCHED alert matched all three CA-12 members, so matched_actions == 3 and district_engagement == 30."
            - "One CHALLENGER candidate in FEDERAL district CA-12 with voting_alignment_pct 78.40 and committee_relevance_score 62; no other contribution exists for that candidate."
          setup_api_calls:
            - call: "POST /advocacy/members"
              payload: { legal_name: "Alpha Steel Co", membership_tier: "PREMIER", home_jurisdiction_code: "FEDERAL", home_district_code: "CA-12", annual_dues_cents: 400000, dues_year: 2026, restricted_class_size: 25, status: "ACTIVE", advocacy_optout: false, engagement_score: 90 }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { m1_id: $.data.id }
            - call: "POST /advocacy/members"
              payload: { legal_name: "Beta Foundry Co", membership_tier: "FULL", home_jurisdiction_code: "FEDERAL", home_district_code: "CA-12", annual_dues_cents: 400000, dues_year: 2026, restricted_class_size: 15, status: "ACTIVE", advocacy_optout: false, engagement_score: 70 }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { m2_id: $.data.id }
            - call: "POST /advocacy/members"
              payload: { legal_name: "Gamma Tooling Co", membership_tier: "ASSOCIATE", home_jurisdiction_code: "FEDERAL", home_district_code: "CA-12", annual_dues_cents: 400000, dues_year: 2026, restricted_class_size: 5, status: "ACTIVE", advocacy_optout: false, engagement_score: 50 }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { m3_id: $.data.id }
            - call: "POST /advocacy/committees"
              payload: { name: "Federal Tax Policy Committee", jurisdiction_scope: "FEDERAL", quorum_threshold_pct: 60.00, consensus_threshold_pct: 66.67 }
              as: GovAffairsDirector
              as_user_id: "gad-1"
              captures: { comm_id: $.data.id }
            - call: "POST /advocacy/committees/${comm_id}/seats"
              payload: { member_id: "${m1_id}", seat_role: "CHAIR" }
              as: GovAffairsDirector
              as_user_id: "gad-1"
            - call: "POST /advocacy/committees/${comm_id}/seats"
              payload: { member_id: "${m2_id}", seat_role: "MEMBER" }
              as: GovAffairsDirector
              as_user_id: "gad-1"
            - call: "POST /advocacy/committees/${comm_id}/seats"
              payload: { member_id: "${m3_id}", seat_role: "MEMBER" }
              as: GovAffairsDirector
              as_user_id: "gad-1"
            - call: "POST /advocacy/policy-positions"
              payload: { committee_id: "${comm_id}", title: "Support the Manufacturing Credit", jurisdiction_code: "FEDERAL", summary: "The association supports extension of the manufacturing investment credit." }
              as: GovAffairsDirector
              as_user_id: "gad-1"
              captures: { pos_id: $.data.id }
            - call: "POST /advocacy/policy-positions/${pos_id}/open-ballot"
              payload: {}
              as: GovAffairsDirector
              as_user_id: "gad-1"
            - call: "POST /advocacy/policy-positions/${pos_id}/votes"
              payload: { ballot: "SUPPORT" }
              as: MemberDelegate
              as_user_id: "${m1_id}"
            - call: "POST /advocacy/policy-positions/${pos_id}/votes"
              payload: { ballot: "SUPPORT" }
              as: MemberDelegate
              as_user_id: "${m2_id}"
            - call: "POST /advocacy/policy-positions/${pos_id}/votes"
              payload: { ballot: "OPPOSE" }
              as: MemberDelegate
              as_user_id: "${m3_id}"
            - call: "POST /advocacy/policy-positions/${pos_id}/tally"
              payload: {}
              as: GovAffairsDirector
              as_user_id: "gad-1"
            - call: "POST /advocacy/policy-positions/${pos_id}/adopt"
              payload: {}
              as: BoardTrustee
              as_user_id: "bt-1"
            - call: "POST /advocacy/grassroots-campaigns"
              payload: { position_id: "${pos_id}", name: "Credit Extension Push", target_jurisdiction_code: "FEDERAL" }
              as: GovAffairsDirector
              as_user_id: "gad-1"
              captures: { camp_id: $.data.id }
            - call: "POST /advocacy/grassroots-campaigns/${camp_id}/alerts"
              payload: { target_district_code: "CA-12", target_chamber: "US_HOUSE", message_subject: "Call your representative today", unit_cost_cents: 30000 }
              as: GovAffairsDirector
              as_user_id: "gad-1"
              captures: { alert1_id: $.data.id, alert1_matched: $.data.matched_member_count }
            - call: "POST /advocacy/candidates"
              payload: { name: "Rep. Jane Alvarez", office: "US_HOUSE", jurisdiction_code: "FEDERAL", district_code: "CA-12", election_cycle: "2026-GENERAL", incumbency: "CHALLENGER", voting_alignment_pct: 78.40, committee_relevance_score: 62 }
              as: GovAffairsDirector
              as_user_id: "gad-1"
              captures: { cand_id: $.data.id }
            - call: "POST /advocacy/segregated-funds"
              payload: { name: "NMA Federal PAC", fund_year: 2026, jurisdiction_code: "FEDERAL", min_reserve_cents: 0 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { fund_id: $.data.id }
          trigger:
            - call: "POST /advocacy/pac-contributions"
              payload: { fund_id: "${fund_id}", candidate_id: "${cand_id}", amount_cents: 100000, memo: "Committee-recommended support" }
              as: GovAffairsDirector
              as_user_id: "gad-1"
              captures: { contrib_id: $.data.id }
          assert:
            - "ActionAlert.${alert1_id}.matched_member_count == 3 and status == DISPATCHED and cost_cents == 90000"
            - "PacContribution.${contrib_id}.support_score == 65.78"
            - "PacContribution.${contrib_id}.max_allowed_cents == 125000"
            - "PacContribution.${contrib_id}.status == PENDING_BOARD"
            - "Candidate.${cand_id}.latest_support_score == 65.78 and pending_support_cents == 100000"
      - name: filing_cycle_surcharge_uses_pre_cycle_posture_pinned_order
        grounds:
          - calculations.fund_balance_and_posture
          - entities.SegregatedFund.fields.filing_fee_accrued_cents
          - entities.SegregatedFund.fields.posture
          - endpoints["POST /advocacy/segregated-funds/{id}/filing-cycle"]
        distinguishing_aspect: |
          Mode (c): posture and the filing fee look mutually dependent (the surcharge depends on posture, posture
          depends on the accrued fee), and the scaffold pins the order - the cycle that STARTS OPEN and ENDS
          RESTRICTED is charged 40000 with no surcharge, while the next cycle, which starts RESTRICTED, is charged
          20000 including the 5000 surcharge; a post-fee posture reading would have charged 45000 in cycle 2.
        test_recipe:
          setup:
            - "One FEDERAL SegregatedFund for 2026 with min_reserve_cents 150000 and receipts_total_cents 200000, posture OPEN."
            - "The receipt came from a member whose PriorApproval is GRANTED for 2026-01-01..2026-12-31, at the default logical clock 2026-08-01T00:00:00Z."
            - "No contribution exists on the fund, so committed and disbursed totals stay 0 throughout."
          setup_api_calls:
            - call: "POST /advocacy/members"
              payload: { legal_name: "Alpha Steel Co", membership_tier: "PREMIER", home_jurisdiction_code: "FEDERAL", home_district_code: "CA-12", annual_dues_cents: 400000, dues_year: 2026, restricted_class_size: 25, status: "ACTIVE", advocacy_optout: false, engagement_score: 90 }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { m1_id: $.data.id }
            - call: "POST /advocacy/prior-approvals"
              payload: { member_id: "${m1_id}", calendar_year: 2026, solicitable_class_size: 10, effective_date: "2026-01-01", expires_at_date: "2026-12-31" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { pa_id: $.data.id }
            - call: "POST /advocacy/prior-approvals/${pa_id}/grant"
              payload: { authorized_by_name: "R. Okafor, Treasurer" }
