# =============================================================================
# §1.9 Scaffold Corner Design — Task 1873 (High-Voltage Cable Testing)
# Breadth coverage of every testable §1.1–§1.7 claim not already covered by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. Clock default 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  # ================================================================ entities
  - section: entities
    instances:
      - name: circuit_create_defaults_and_envelope
        claim_type: creation
        grounds: ["entities.CableCircuit", "endpoints.POST_/cable-diagnostics/circuits"]
        distinguishing_aspect: "A fully-specified create returns 201 with system-managed defaults and the fixed response envelope."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-E1", voltage_class: "KV_35", length_m: 3200, installation_year: 2008, calibrated_velocity_factor: 0.55 }, as: SystemAdmin, captures: { c: $.data.id, st: $.data.status, ver: $.data.version } }
          assert:
            - "201; data.status == IN_SERVICE; unresolved_fault_count == 0; resolved_fault_count_24m == 0; splice_count == 0; approved_outage_minutes_total == 0"
            - "data.version == 1; data.id is a UUID without type prefix; current_health_index == null; replacement_recommended == false"
            - "envelope has meta.api_request_id and meta.api_request_timestamp; response_type == object"

      - name: circuit_create_duplicate_ref_rejected
        claim_type: type_constraints
        grounds: ["entities.CableCircuit.fields.circuit_ref", "errors[ERR_DUPLICATE_CIRCUIT_REF]", "validations[priority=33]"]
        distinguishing_aspect: "Second circuit with the same circuit_ref is rejected; uniqueness is global, not per-class."
        test_recipe:
          setup: ["circuit CKT-E2 exists"]
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-E2", voltage_class: "KV_15", length_m: 1000, installation_year: 2015 }, as: SystemAdmin }
          trigger:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-E2", voltage_class: "KV_69", length_m: 900, installation_year: 2022 }, as: SystemAdmin, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_DUPLICATE_CIRCUIT_REF, http 409; second circuit not created"]

      - name: circuit_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.CableCircuit.fields.length_m", "errors[ERR_INVALID_REQUEST]", "validations[priority=3]"]
        distinguishing_aspect: "Omitting required length_m yields 400 ERR_INVALID_REQUEST before any business rule runs."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-E3", voltage_class: "KV_15", installation_year: 2015 }, as: SystemAdmin, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_INVALID_REQUEST, http 400"]

      - name: circuit_create_system_fields_input_ignored
        claim_type: system_fields
        grounds: ["entities.CableCircuit.fields.status", "entities.CableCircuit.fields.unresolved_fault_count"]
        distinguishing_aspect: "Client-supplied computed/system fields (status, unresolved_fault_count) are ignored, never honored."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-E4", voltage_class: "KV_15", length_m: 1000, installation_year: 2015, status: "RESTORING", unresolved_fault_count: 99 }, as: SystemAdmin, captures: { c: $.data.id, st: $.data.status } }
          assert: ["201; status == IN_SERVICE (input ignored); unresolved_fault_count == 0 (input ignored)"]

      - name: reading_log_has_no_version_field
        claim_type: immutability
        grounds: ["entities.TestReading"]
        distinguishing_aspect: "TestReading has common_fields: false — append-only: reads expose id and created_at but no version/updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["job IN_PROGRESS with series ENERGIZING and one reading logged"]
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-E5", voltage_class: "KV_15", length_m: 1000, installation_year: 2015 }, as: SystemAdmin, captures: { c: $.data.id } }
            - { call: "POST /cable-diagnostics/outage-windows", payload: { circuit_id: "${c}", kind: "PLANNED_DIAGNOSTIC", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-12T12:00:00Z" }, as: NetworkPlanner, captures: { w: $.data.id } }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/approve", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/test-jobs", payload: { circuit_id: "${c}", outage_window_id: "${w}", requested_methods: ["VLF_TAN_DELTA"], approved_budget_cents: 800000 }, as: NetworkPlanner, captures: { j: $.data.id } }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/plan", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/isolation-permits", payload: { test_job_id: "${j}", isolation_points: ["SW-N"], ground_count: 2 }, as: SafetyOfficer, as_user_id: "so-1", captures: { p: $.data.id } }
            - { call: "POST /cable-diagnostics/isolation-permits/${p}/issue", as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /cable-diagnostics/isolation-permits/${p}/verify-grounding", as: SafetyOfficer, as_user_id: "so-2" }
            - { call: "POST /cable-diagnostics/mobile-units", payload: { unit_code: "VAN-1", capabilities: ["VLF", "PD", "TDR"], max_test_voltage_kv: 30.0 }, as: SystemAdmin, captures: { u: $.data.id } }
            - { call: "POST /cable-diagnostics/equipment-assignments", payload: { mobile_unit_id: "${u}", test_job_id: "${j}", mobilize_at: "2026-08-10T07:00:00Z", demobilize_at: "2026-08-12T12:00:00Z" }, as: DispatchCoordinator, captures: { a: $.data.id } }
            - { call: "POST /cable-diagnostics/equipment-assignments/${a}/confirm", as: DispatchCoordinator }
            - { call: "POST /cable-diagnostics/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/activate", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/start", as: TestSupervisor }
            - { call: "POST /cable-diagnostics/test-series", payload: { test_job_id: "${j}", method: "VLF_TAN_DELTA", test_voltage_kv: 13.05 }, as: TestSupervisor, captures: { s: $.data.id } }
            - { call: "POST /cable-diagnostics/test-series/${s}/energize", as: TestSupervisor }
          trigger:
            - { call: "POST /cable-diagnostics/test-series/${s}/readings", payload: { step_index: 0, applied_voltage_kv: 4.35, tan_delta_e3: 4.0, ambient_temp_c: 20.0 }, as: FieldTechnician, as_user_id: "ft-1", captures: { r: $.data.id } }
            - { call: "GET /cable-diagnostics/test-series/${s}/readings", as: FieldTechnician, as_user_id: "ft-1" }
          assert:
            - "reading ${r} appears in the list with id and created_at; the object has NO version and NO updated_at key"
            - "recorded_by_user_id == ft-1"

      - name: assessment_supersede_link_stub
        claim_type: parent_relationships
        grounds: ["entities.HealthAssessment.fields.supersedes_id"]
        excluded_because:
          difficulty_instance: health_index_formal_vs_provisional_input_set
          rationale: "Self-referential supersede link and SUPERSEDED transition are asserted there (ha2.supersedes_id == ha1; ha1 SUPERSEDED)."

  # ========================================================== state_machines
  - section: state_machines
    instances:
      - name: window_close_twice_rejected
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.OutageWindow.ACTIVE_to_CLOSED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CLOSED is terminal: a second close is rejected and no overrun recomputation occurs."
        test_recipe:
          setup: ["window A [2026-08-10T08:00Z,10:00Z] APPROVED then ACTIVE then CLOSED (restored 2026-08-10T10:15Z)"]
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-S1", voltage_class: "KV_15", length_m: 1000, installation_year: 2015 }, as: SystemAdmin, captures: { c: $.data.id } }
            - { call: "POST /cable-diagnostics/outage-windows", payload: { circuit_id: "${c}", kind: "PLANNED_DIAGNOSTIC", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T10:00:00Z" }, as: NetworkPlanner, captures: { w: $.data.id } }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/approve", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/activate", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/close", payload: { restored_at: "2026-08-10T10:15:00Z" }, as: NetworkPlanner }
          trigger:
            - { call: "POST /cable-diagnostics/outage-windows/${w}/close", payload: { restored_at: "2026-08-10T10:30:00Z" }, as: NetworkPlanner, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_INVALID_STATE, http 409; window remains CLOSED with overrun_minutes == 15"]

      - name: series_evaluate_twice_rejected
        claim_type: idempotency
        grounds: ["state_machines.TestSeries.LOGGING_to_EVALUATED"]
        distinguishing_aspect: "Evaluate is not idempotent: the second evaluate from EVALUATED is rejected; no duplicate fault is created by retry."
        test_recipe:
          setup: ["job IN_PROGRESS; series LOGGING with 3 FAIL readings; first evaluate done (fault auto-created, unresolved == 1)"]
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-S2", voltage_class: "KV_15", length_m: 1000, installation_year: 2015 }, as: SystemAdmin, captures: { c: $.data.id } }
            - { call: "POST /cable-diagnostics/outage-windows", payload: { circuit_id: "${c}", kind: "PLANNED_DIAGNOSTIC", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-12T12:00:00Z" }, as: NetworkPlanner, captures: { w: $.data.id } }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/approve", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/test-jobs", payload: { circuit_id: "${c}", outage_window_id: "${w}", requested_methods: ["VLF_TAN_DELTA"], approved_budget_cents: 800000 }, as: NetworkPlanner, captures: { j: $.data.id } }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/plan", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/isolation-permits", payload: { test_job_id: "${j}", isolation_points: ["SW-N"], ground_count: 2 }, as: SafetyOfficer, as_user_id: "so-1", captures: { p: $.data.id } }
            - { call: "POST /cable-diagnostics/isolation-permits/${p}/issue", as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /cable-diagnostics/isolation-permits/${p}/verify-grounding", as: SafetyOfficer, as_user_id: "so-2" }
            - { call: "POST /cable-diagnostics/mobile-units", payload: { unit_code: "VAN-1", capabilities: ["VLF", "PD", "TDR"], max_test_voltage_kv: 30.0 }, as: SystemAdmin, captures: { u: $.data.id } }
            - { call: "POST /cable-diagnostics/equipment-assignments", payload: { mobile_unit_id: "${u}", test_job_id: "${j}", mobilize_at: "2026-08-10T07:00:00Z", demobilize_at: "2026-08-12T12:00:00Z" }, as: DispatchCoordinator, captures: { a: $.data.id } }
            - { call: "POST /cable-diagnostics/equipment-assignments/${a}/confirm", as: DispatchCoordinator }
            - { call: "POST /cable-diagnostics/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/activate", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/start", as: TestSupervisor }
            - { call: "POST /cable-diagnostics/test-series", payload: { test_job_id: "${j}", method: "VLF_TAN_DELTA", test_voltage_kv: 13.05 }, as: TestSupervisor, captures: { s: $.data.id } }
            - { call: "POST /cable-diagnostics/test-series/${s}/energize", as: TestSupervisor }
            - { call: "POST /cable-diagnostics/test-series/${s}/readings", payload: { step_index: 0, applied_voltage_kv: 4.35, tan_delta_e3: 90.0, ambient_temp_c: 20.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${s}/readings", payload: { step_index: 1, applied_voltage_kv: 8.7, tan_delta_e3: 90.0, ambient_temp_c: 20.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${s}/readings", payload: { step_index: 2, applied_voltage_kv: 13.05, tan_delta_e3: 90.0, ambient_temp_c: 20.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${s}/evaluate", as: TestSupervisor }
          trigger:
            - { call: "POST /cable-diagnostics/test-series/${s}/evaluate", as: TestSupervisor, captures: { err: $.data.error_id } }
            - { call: "GET /cable-diagnostics/test-series/${s}/faults", as: TestSupervisor }
          assert:
            - "error_id == ERR_INVALID_STATE, http 409 (EVALUATED is not a valid from-state for evaluate)"
            - "still exactly one FaultRecord for series ${s}"

      - name: assignment_cancel_after_release_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.EquipmentAssignment.ACTIVE_to_RELEASED", "state_machines.EquipmentAssignment.CONFIRMED_to_CANCELLED"]
        distinguishing_aspect: "RELEASED is terminal: cancel from RELEASED rejected; committed_hours not double-subtracted."
        test_recipe:
          setup: ["PLANNED job; unit with assignment CONFIRMED then ACTIVE then RELEASED (committed back to 0.0)"]
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-S3", voltage_class: "KV_15", length_m: 1000, installation_year: 2015 }, as: SystemAdmin, captures: { c: $.data.id } }
            - { call: "POST /cable-diagnostics/outage-windows", payload: { circuit_id: "${c}", kind: "PLANNED_DIAGNOSTIC", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-12T12:00:00Z" }, as: NetworkPlanner, captures: { w: $.data.id } }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/approve", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/test-jobs", payload: { circuit_id: "${c}", outage_window_id: "${w}", requested_methods: ["VLF_TAN_DELTA"], approved_budget_cents: 800000 }, as: NetworkPlanner, captures: { j: $.data.id } }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/plan", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/mobile-units", payload: { unit_code: "VAN-1", capabilities: ["VLF", "PD", "TDR"], max_test_voltage_kv: 30.0 }, as: SystemAdmin, captures: { u: $.data.id } }
            - { call: "POST /cable-diagnostics/equipment-assignments", payload: { mobile_unit_id: "${u}", test_job_id: "${j}", mobilize_at: "2026-08-10T07:00:00Z", demobilize_at: "2026-08-10T11:00:00Z" }, as: DispatchCoordinator, captures: { a: $.data.id } }
            - { call: "POST /cable-diagnostics/equipment-assignments/${a}/confirm", as: DispatchCoordinator }
            - { call: "POST /cable-diagnostics/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: SystemAdmin }
            - { call: "POST /cable-diagnostics/equipment-assignments/${a}/activate", as: DispatchCoordinator }
            - { call: "POST /cable-diagnostics/equipment-assignments/${a}/release", as: DispatchCoordinator }
          trigger:
            - { call: "POST /cable-diagnostics/equipment-assignments/${a}/cancel", as: DispatchCoordinator, captures: { err: $.data.error_id } }
            - { call: "GET /cable-diagnostics/mobile-units/${u}", as: DispatchCoordinator, captures: { uch: $.data.committed_hours } }
          assert:
            - "error_id == ERR_INVALID_STATE, http 409"
            - "MobileUnit.${u}.committed_hours == 0.0 (no double subtraction) and status == AVAILABLE"

      - name: initial_states_on_create
        claim_type: initial_state
        grounds: ["state_machines.OutageWindow", "state_machines.TestJob", "state_machines.IsolationPermit", "state_machines.MobileUnit", "state_machines.EquipmentAssignment", "state_machines.HealthAssessment"]
        distinguishing_aspect: "Every creatable entity starts in its declared initial_state on the creation response."
        test_recipe:
          setup: ["circuit exists; window APPROVED; job PLANNED (needed for permit/assignment creation)"]
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-S4", voltage_class: "KV_15", length_m: 1000, installation_year: 2015 }, as: SystemAdmin, captures: { c: $.data.id, cv: $.data.version } }
            - { call: "POST /cable-diagnostics/outage-windows", payload: { circuit_id: "${c}", kind: "PLANNED_DIAGNOSTIC", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-12T12:00:00Z" }, as: NetworkPlanner, captures: { w: $.data.id, wst: $.data.status } }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/approve", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/test-jobs", payload: { circuit_id: "${c}", outage_window_id: "${w}", requested_methods: ["VLF_TAN_DELTA"], approved_budget_cents: 800000 }, as: NetworkPlanner, captures: { j: $.data.id, jst: $.data.status } }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/plan", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/isolation-permits", payload: { test_job_id: "${j}", isolation_points: ["SW-N"], ground_count: 2 }, as: SafetyOfficer, as_user_id: "so-1", captures: { p: $.data.id, pst: $.data.status } }
            - { call: "POST /cable-diagnostics/mobile-units", payload: { unit_code: "VAN-1", capabilities: ["VLF"], max_test_voltage_kv: 30.0 }, as: SystemAdmin, captures: { u: $.data.id, ust: $.data.status } }
            - { call: "POST /cable-diagnostics/equipment-assignments", payload: { mobile_unit_id: "${u}", test_job_id: "${j}", mobilize_at: "2026-08-10T07:00:00Z", demobilize_at: "2026-08-10T11:00:00Z" }, as: DispatchCoordinator, captures: { a: $.data.id, ast: $.data.status } }
          trigger:
            - { call: "GET /cable-diagnostics/circuits/${c}", as: AssetEngineer, captures: { cv2: $.data.version } }
            - { call: "POST /cable-diagnostics/health-assessments", payload: { circuit_id: "${c}", basis: "FORMAL", expected_circuit_version: "${cv2}" }, as: AssetEngineer, captures: { hast: $.data.status } }
          assert:
            - "window created REQUESTED; job created DRAFT; permit created DRAFT; unit created AVAILABLE; assignment created RESERVED; assessment created COMPUTED"
      - name: circuit_auto_status_progression
        claim_type: side_effect_execution
        grounds: ["state_machines.CableCircuit"]
        distinguishing_aspect: "Compound/auto machine: circuit status is never set directly; each child milestone drives IN_SERVICE -> OUTAGE_PENDING -> DE_ENERGIZED -> GROUNDED -> UNDER_TEST."
        test_recipe:
          setup: ["circuit created; walked through approve, issue, verify, energize"]
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-S5", voltage_class: "KV_15", length_m: 1000, installation_year: 2015 }, as: SystemAdmin, captures: { c: $.data.id, st0: $.data.status } }
            - { call: "POST /cable-diagnostics/outage-windows", payload: { circuit_id: "${c}", kind: "PLANNED_DIAGNOSTIC", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-12T12:00:00Z" }, as: NetworkPlanner, captures: { w: $.data.id } }
            - { call: "POST /cable-diagnostics/test-jobs", payload: { circuit_id: "${c}", outage_window_id: "${w}", requested_methods: ["VLF_TAN_DELTA"], approved_budget_cents: 800000 }, as: NetworkPlanner, captures: { j: $.data.id } }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/plan", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/isolation-permits", payload: { test_job_id: "${j}", isolation_points: ["SW-N"], ground_count: 2 }, as: SafetyOfficer, as_user_id: "so-1", captures: { p: $.data.id } }
            - { call: "POST /cable-diagnostics/mobile-units", payload: { unit_code: "VAN-1", capabilities: ["VLF", "PD", "TDR"], max_test_voltage_kv: 30.0 }, as: SystemAdmin, captures: { u: $.data.id } }
            - { call: "POST /cable-diagnostics/equipment-assignments", payload: { mobile_unit_id: "${u}", test_job_id: "${j}", mobilize_at: "2026-08-10T07:00:00Z", demobilize_at: "2026-08-12T12:00:00Z" }, as: DispatchCoordinator, captures: { a: $.data.id } }
            - { call: "POST /cable-diagnostics/equipment-assignments/${a}/confirm", as: DispatchCoordinator }
          trigger:
            - { call: "GET /cable-diagnostics/circuits/${c}", as: NetworkPlanner, captures: { st1: $.data.status } }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/approve", as: NetworkPlanner }
            - { call: "GET /cable-diagnostics/circuits/${c}", as: NetworkPlanner, captures: { st2: $.data.status } }
            - { call: "POST /cable-diagnostics/isolation-permits/${p}/issue", as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "GET /cable-diagnostics/circuits/${c}", as: NetworkPlanner, captures: { st3: $.data.status } }
            - { call: "POST /cable-diagnostics/isolation-permits/${p}/verify-grounding", as: SafetyOfficer, as_user_id: "so-2" }
            - { call: "GET /cable-diagnostics/circuits/${c}", as: NetworkPlanner, captures: { st4: $.data.status } }
            - { call: "POST /cable-diagnostics/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/activate", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/start", as: TestSupervisor }
            - { call: "POST /cable-diagnostics/test-series", payload: { test_job_id: "${j}", method: "VLF_TAN_DELTA", test_voltage_kv: 13.05 }, as: TestSupervisor, captures: { s: $.data.id } }
            - { call: "POST /cable-diagnostics/test-series/${s}/energize", as: TestSupervisor }
            - { call: "GET /cable-diagnostics/circuits/${c}", as: NetworkPlanner, captures: { st5: $.data.status } }
          assert:
            - "IN_SERVICE at creation; still IN_SERVICE before approve (job/permit creation does not move it)"
            - "OUTAGE_PENDING after approve; DE_ENERGIZED after issue; GROUNDED after verify; UNDER_TEST after energize"

      - name: evaluate_energizing_without_readings_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.TestSeries.ENERGIZING_to_EVALUATED", "errors[ERR_NO_READINGS]", "validations[priority=22]"]
        distinguishing_aspect: "Evaluate from ENERGIZING with zero readings hits the empty-collection guard ERR_NO_READINGS."
        test_recipe:
          setup: ["job IN_PROGRESS; series ENERGIZING with no readings"]
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-S6", voltage_class: "KV_15", length_m: 1000, installation_year: 2015 }, as: SystemAdmin, captures: { c: $.data.id } }
