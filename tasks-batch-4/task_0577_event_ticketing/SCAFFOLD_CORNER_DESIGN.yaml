          rationale: "Overlapping active hold -> ERR_SEAT_UNAVAILABLE asserted by the named §1.8 instance."
      - name: already_admitted_rejected
        claim_type: Violation to Error
        grounds: ["errors[ERR_ALREADY_ADMITTED]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / queue_admission_window_inclusive_overlap
          rationale: "Double admission within window -> ERR_ALREADY_ADMITTED asserted by the named §1.8 instance."
      - name: ticket_already_scanned_transfer_rejected
        claim_type: Cross-entity validation
        grounds: ["errors[ERR_TICKET_ALREADY_SCANNED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / transfer_gated_by_ticket_scan_status
          rationale: "Transfer of a SCANNED ticket -> ERR_TICKET_ALREADY_SCANNED asserted by the named §1.8 instance."
      - name: priority_unauthorized_over_state
        claim_type: Priority conflict
        grounds: ["validations[priority=2]", "validations[priority=5]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / pay_unauthorized_beats_already_paid_state
          rationale: "auth-over-state priority asserted by the named §1.8 instance."
      - name: priority_notfound_over_duplicate
        claim_type: Priority conflict
        grounds: ["validations[priority=3]", "validations[priority=8]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / seat_create_notfound_beats_duplicate_seat
          rationale: "existence-over-constraint priority asserted by the named §1.8 instance."
