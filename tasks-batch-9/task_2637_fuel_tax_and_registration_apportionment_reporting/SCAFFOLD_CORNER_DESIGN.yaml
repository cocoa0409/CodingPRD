        distinguishing_aspect: "Rule 22 blocks prepare while any in-window trip is CAPTURED or RECONSTRUCTED, so the first prepare returns ERR_TRIP_GAP_UNRESOLVED 409 even though the accepted subset alone would settle cleanly; once the pending trip is accepted the same prepare succeeds with total_fleet_miles 500.0 and total_net_tax_due 2.02."
