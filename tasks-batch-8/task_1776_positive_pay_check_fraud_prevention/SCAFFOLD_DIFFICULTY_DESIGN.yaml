            - { call: "GET /treasury/exceptions/${ex2}", payload: {}, as: BankOps, captures: { e2: $.data.status } }
          assert:
            - "At clock == deadline exactly: e1 == DECISIONED_PAY (inclusive boundary)"
            - "Sweep at clock == deadline defaults nothing: def1 == 0 (strict < for sweeps)"
            - "At deadline + 1s: err == ERR_DECISION_DEADLINE_PASSED"
            - "Then sweep applies default: def2 == 1 and e2 == DEFAULTED_PAY"

