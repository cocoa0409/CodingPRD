              payload: { evidence_type: "TRIP_DATA", evidence_weight: "DISPOSITIVE" }
              as: SafetyInvestigator
              captures: { ev1: $.data.id }
            - call: "POST /safety/incidents/${high_inc}/evidence"
              payload: { evidence_type: "LAW_ENFORCEMENT_CONTACT", evidence_weight: "DISPOSITIVE" }
              as: SafetyInvestigator
              captures: { ev2: $.data.id }
            - call: "POST /safety/incidents/${high_inc}/evidence/accept"
              payload: { evidence_id: "${ev1}", accepted: true }
              as: SafetyInvestigator
            - call: "POST /safety/incidents/${high_inc}/evidence/accept"
              payload: { evidence_id: "${ev2}", accepted: true }
              as: SafetyInvestigator
              captures: { high_inc_v_ready: $.data.version }
          trigger:
            - call: "POST /safety/incidents/${low_inc}/withdraw"
              payload: {}
              as: SafetyInvestigator
              captures: { inv_withdraw_err: $.data.error_id }
