      - name: invoice_short_fund_depth_four_conditional_hold_cascade
        grounds:
          - state_machines.ManufacturerInvoice.ISSUED_to_SHORT_FUNDED
          - state_machines.SettlementStatement.SCHEDULED_to_HELD
          - state_machines.Submission.settlement_status=STATEMENT_ISSUED_to_settlement_status=HELD
          - entities.Retailer.fields.unpaid_balance_cents
          - endpoints.POST./manufacturer-invoices/{id}/fund
        distinguishing_aspect: |
          A single short funding call walks ManufacturerInvoice -> every
          SettlementStatement carrying that invoice id -> each of those
          statements' Submissions -> the shared Retailer's unpaid_balance_cents,
          four levels deep and fanning out two-wide at level 2. The cascade is
          also CONDITIONAL: a third SCHEDULED statement of the same retailer
          that was never billed onto this invoice must be left completely alone,
          so the retailer's balance falls from 342 to exactly 114 rather than to
          0. A cascade that recomputed the balance over all of the retailer's
          statements, or that swept every statement of the retailer rather than
          the invoice's own, produces 0 and is caught here.
        test_recipe:
          setup:
            - "clock at its 2026-08-01T00:00:00Z default; retailer STANDARD / NET_30 / ROLLING_WINDOW, manufacturer CONTRACT_RATE at 7 cents"
            - "three submissions on disjoint half-open postmark windows [2026-07-01, 2026-07-11), [2026-07-11, 2026-07-21) and [2026-07-21, 2026-07-31), each verified 2 with one lot of 2 accepted items -> gross 100, fee 14, net_payable 114"
            - "all three statements SCHEDULED, so Retailer.unpaid_balance_cents == 342"
            - "one invoice bills statements 1 and 2 only: billed_face 200, billed_fee 28, billed_clearing round_half_up(200 * 0.015) == 3, billed_total 231. Statement 3 is deliberately left off the invoice."
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Kellwood Foods", gs1_company_prefix: "038000", handling_fee_policy: "CONTRACT_RATE", dispute_window_days: 45 }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { mfr_id: $.data.id }
            - call: "POST /retailers"
              payload: { legal_name: "Northgate Markets", channel_capability: "BOTH", payment_terms: "NET_30", base_fee_tier: "STANDARD", fraud_scoring_mode: "ROLLING_WINDOW" }
              as: ClearinghouseAdmin
