# §1.9 Scaffold Corner Design (breadth coverage of §1.1–§1.7 claims not in §1.8).
# Same seven-point per-instance contract as §1.8. excluded_because stubs cite a
# §1.8 instance by name and carry no test_recipe.
scaffold_corner_design:

  - section: entities
    instances:
      - name: corner_create_cycle_missing_required_total_budget
        claim_type: required_fields
        grounds: [entities.BudgetCycle.fields.total_budget_cents, 'errors[ERR_VALIDATION]']
        distinguishing_aspect: "Omitting the required total_budget_cents on POST /budget-cycles returns ERR_VALIDATION (400); nothing is created."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /budget-cycles"
              payload: { name: "NoBudget", fiscal_year: 2027, voting_method: "ALLOCATION", per_project_cap_cents: 100000, per_voter_allocation_cap_cents: 100000, submission_start: "2026-03-01T00:00:00Z", submission_end: "2026-04-01T00:00:00Z", voting_start: "2026-04-01T00:00:00Z", voting_end: "2026-05-01T00:00:00Z" }
              as: BudgetAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_VALIDATION"

      - name: corner_get_proposal_not_found
        claim_type: not_found
        grounds: [entities.Proposal, 'errors[ERR_PROPOSAL_NOT_FOUND]']
        distinguishing_aspect: "GET /proposals/{non-existent uuid} returns ERR_PROPOSAL_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /proposals/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_PROPOSAL_NOT_FOUND"

      - name: corner_single_line_provisional_estimate_computed
        claim_type: computed_fields
        grounds: [entities.CostLineItem.fields.line_provisional_cents, entities.Proposal.fields.provisional_estimate_cents, calculations.proposal_cost_estimate]
        distinguishing_aspect: "A single line 40000x1 @20% yields line_provisional_cents 48000 and Proposal.provisional_estimate_cents 48000 (round_half_up of 48000.0)."
        test_recipe:
          setup: ["A DEVELOPING proposal with one line item unit_cost_cents=40000, quantity=1, contingency_pct=0.20."]
          setup_api_calls:
            - call: "POST /budget-cycles"
              payload: { name: "PBcf", fiscal_year: 2027, total_budget_cents: 500000, voting_method: "ALLOCATION", per_project_cap_cents: 400000, per_voter_allocation_cap_cents: 100000, submission_start: "2026-03-01T00:00:00Z", submission_end: "2026-04-01T00:00:00Z", voting_start: "2026-04-01T00:00:00Z", voting_end: "2026-05-01T00:00:00Z" }
              as: BudgetAdmin
              captures: { cyc: $.data.id }
            - call: "POST /budget-cycles/${cyc}/categories"
              payload: { name: "Gen", category_budget_cap_cents: 500000 }
              as: BudgetAdmin
              captures: { cat: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "V", date_of_birth: "1990-01-01", residency_document_ref: "d", residency_address: "1 St" }
              as: Anonymous
              captures: { rid: $.data.id }
            - call: "POST /budget-cycles/${cyc}/phase-transitions"
              payload: { target_phase: "SUBMISSION" }
              as: BudgetAdmin
            - call: "POST /budget-cycles/${cyc}/proposals"
              payload: { category_id: "${cat}", title: "P", summary: "s" }
              as: Resident
              as_user_id: "${rid}"
              captures: { pid: $.data.id }
            - call: "POST /proposals/${pid}/submit"
              payload: {}
              as: Resident
              as_user_id: "${rid}"
            - call: "POST /budget-cycles/${cyc}/phase-transitions"
              payload: { target_phase: "DEVELOPMENT" }
              as: BudgetAdmin
            - call: "POST /proposals/${pid}/review-decisions"
              payload: { decision: "APPROVE" }
              as: Reviewer
          trigger:
            - call: "POST /proposals/${pid}/cost-line-items"
              payload: { label: "x", unit_cost_cents: 40000, quantity: 1, contingency_pct: 0.20 }
              as: Reviewer
              captures: { li: $.data.id }
          assert:
            - "CostLineItem.${li}.line_provisional_cents == 48000"
            - "Proposal.${pid}.provisional_estimate_cents == 48000"

      - name: corner_cycle_defaults_min_age_and_language
        claim_type: defaults
        grounds: [entities.BudgetCycle.fields.min_voter_age, entities.BudgetCycle.fields.default_language]
        distinguishing_aspect: "Creating a cycle without min_voter_age/default_language applies defaults min_voter_age==16 and default_language=='en'."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /budget-cycles"
              payload: { name: "Def", fiscal_year: 2027, total_budget_cents: 100000, voting_method: "ALLOCATION", per_project_cap_cents: 100000, per_voter_allocation_cap_cents: 100000, submission_start: "2026-03-01T00:00:00Z", submission_end: "2026-04-01T00:00:00Z", voting_start: "2026-04-01T00:00:00Z", voting_end: "2026-05-01T00:00:00Z" }
              as: BudgetAdmin
              captures: { cyc: $.data.id }
          assert:
            - "BudgetCycle.${cyc}.min_voter_age == 16"
            - "BudgetCycle.${cyc}.default_language == en"

      - name: corner_reportback_append_only_no_version
        claim_type: immutability
        grounds: [entities.ReportBack, entities.ReportBack.fields.published_at]
        distinguishing_aspect: "ReportBack is common_fields:false (append-only): it is created with an id, proposal_id and published_at, and is only discoverable via GET /proposals/{id}/report-backs (no update endpoint exists)."
        test_recipe:
          setup: ["A funded proposal IN_IMPLEMENTATION."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-15T00:00:00Z" }
              as: BudgetAdmin
            - call: "POST /budget-cycles"
              payload: { name: "PBrb", fiscal_year: 2027, total_budget_cents: 100000, voting_method: "ALLOCATION", per_project_cap_cents: 100000, per_voter_allocation_cap_cents: 1000000, submission_start: "2026-03-01T00:00:00Z", submission_end: "2026-04-01T00:00:00Z", voting_start: "2026-04-01T00:00:00Z", voting_end: "2026-05-01T00:00:00Z" }
              as: BudgetAdmin
              captures: { cyc: $.data.id }
            - call: "POST /budget-cycles/${cyc}/categories"
              payload: { name: "Gen", category_budget_cap_cents: 100000 }
              as: BudgetAdmin
              captures: { cat: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "V", date_of_birth: "1990-01-01", residency_document_ref: "d", residency_address: "1 St" }
              as: Anonymous
              captures: { rid: $.data.id }
            - call: "POST /residents/${rid}/verification-requests"
              payload: {}
              as: Resident
              as_user_id: "${rid}"
            - call: "POST /residents/${rid}/verification-decisions"
              payload: { decision: "APPROVE" }
              as: Reviewer
            - call: "POST /budget-cycles/${cyc}/phase-transitions"
              payload: { target_phase: "SUBMISSION" }
              as: BudgetAdmin
            - call: "POST /budget-cycles/${cyc}/proposals"
              payload: { category_id: "${cat}", title: "P", summary: "s" }
              as: Resident
              as_user_id: "${rid}"
              captures: { pid: $.data.id }
            - call: "POST /proposals/${pid}/submit"
              payload: {}
              as: Resident
              as_user_id: "${rid}"
            - call: "POST /budget-cycles/${cyc}/phase-transitions"
              payload: { target_phase: "DEVELOPMENT" }
              as: BudgetAdmin
            - call: "POST /proposals/${pid}/review-decisions"
              payload: { decision: "APPROVE" }
              as: Reviewer
            - call: "POST /proposals/${pid}/cost-line-items"
              payload: { label: "x", unit_cost_cents: 30000, quantity: 1, contingency_pct: 0.10 }
              as: Reviewer
            - call: "POST /proposals/${pid}/finalize-cost"
              payload: {}
              as: Reviewer
            - call: "POST /budget-cycles/${cyc}/phase-transitions"
              payload: { target_phase: "VOTING" }
              as: BudgetAdmin
            - call: "POST /budget-cycles/${cyc}/ballots"
              payload: {}
              as: Resident
              as_user_id: "${rid}"
              captures: { bid: $.data.id }
            - call: "POST /ballots/${bid}/entries"
              payload: { proposal_id: "${pid}", allocated_cents: 5000 }
              as: Resident
              as_user_id: "${rid}"
            - call: "POST /ballots/${bid}/cast"
              payload: {}
              as: Resident
              as_user_id: "${rid}"
            - call: "POST /budget-cycles/${cyc}/phase-transitions"
              payload: { target_phase: "SELECTION" }
              as: BudgetAdmin
            - call: "GET /budget-cycles/${cyc}"
              payload: {}
              as: BudgetAdmin
              captures: { ver: $.data.version }
            - call: "POST /budget-cycles/${cyc}/selection-runs"
              payload: { expected_budgetcycle_version: "${ver}" }
              as: BudgetAdmin
            - call: "POST /budget-cycles/${cyc}/phase-transitions"
              payload: { target_phase: "IMPLEMENTATION" }
              as: BudgetAdmin
            - call: "POST /proposals/${pid}/release-funding"
              payload: {}
              as: BudgetAdmin
          trigger:
            - call: "POST /proposals/${pid}/report-backs"
              payload: { period_label: "Q1", narrative: "progress", spent_cents: 1000 }
              as: Reviewer
              captures: { rbid: $.data.id }
          assert:
            - "ReportBack.${rbid}.proposal_id == ${pid}"
            - "ReportBack.${rbid}.spent_cents == 1000"

  - section: state_machines
    instances:
      - name: corner_submit_already_submitted_proposal_rejected
        claim_type: idempotency
        grounds: [state_machines.Proposal.DRAFT_to_SUBMITTED, 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "Submitting an already-SUBMITTED proposal a second time returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A SUBMITTED proposal in a SUBMISSION-phase cycle."]
          setup_api_calls:
            - call: "POST /budget-cycles"
              payload: { name: "PBss", fiscal_year: 2027, total_budget_cents: 100000, voting_method: "ALLOCATION", per_project_cap_cents: 100000, per_voter_allocation_cap_cents: 100000, submission_start: "2026-03-01T00:00:00Z", submission_end: "2026-04-01T00:00:00Z", voting_start: "2026-04-01T00:00:00Z", voting_end: "2026-05-01T00:00:00Z" }
              as: BudgetAdmin
              captures: { cyc: $.data.id }
            - call: "POST /budget-cycles/${cyc}/categories"
              payload: { name: "Gen", category_budget_cap_cents: 100000 }
              as: BudgetAdmin
              captures: { cat: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "V", date_of_birth: "1990-01-01", residency_document_ref: "d", residency_address: "1 St" }
              as: Anonymous
              captures: { rid: $.data.id }
            - call: "POST /budget-cycles/${cyc}/phase-transitions"
              payload: { target_phase: "SUBMISSION" }
              as: BudgetAdmin
            - call: "POST /budget-cycles/${cyc}/proposals"
              payload: { category_id: "${cat}", title: "P", summary: "s" }
              as: Resident
              as_user_id: "${rid}"
              captures: { pid: $.data.id }
            - call: "POST /proposals/${pid}/submit"
              payload: {}
              as: Resident
              as_user_id: "${rid}"
          trigger:
            - call: "POST /proposals/${pid}/submit"
              payload: {}
              as: Resident
              as_user_id: "${rid}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: corner_review_decision_on_rejected_proposal_locked
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Proposal.SUBMITTED_to_REJECTED, 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "A REJECTED proposal is terminal: a further review-decision returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A REJECTED proposal in a DEVELOPMENT-phase cycle."]
          setup_api_calls:
            - call: "POST /budget-cycles"
              payload: { name: "PBrj", fiscal_year: 2027, total_budget_cents: 100000, voting_method: "ALLOCATION", per_project_cap_cents: 100000, per_voter_allocation_cap_cents: 100000, submission_start: "2026-03-01T00:00:00Z", submission_end: "2026-04-01T00:00:00Z", voting_start: "2026-04-01T00:00:00Z", voting_end: "2026-05-01T00:00:00Z" }
              as: BudgetAdmin
              captures: { cyc: $.data.id }
            - call: "POST /budget-cycles/${cyc}/categories"
              payload: { name: "Gen", category_budget_cap_cents: 100000 }
              as: BudgetAdmin
              captures: { cat: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "V", date_of_birth: "1990-01-01", residency_document_ref: "d", residency_address: "1 St" }
              as: Anonymous
              captures: { rid: $.data.id }
            - call: "POST /budget-cycles/${cyc}/phase-transitions"
              payload: { target_phase: "SUBMISSION" }
              as: BudgetAdmin
            - call: "POST /budget-cycles/${cyc}/proposals"
              payload: { category_id: "${cat}", title: "P", summary: "s" }
              as: Resident
              as_user_id: "${rid}"
              captures: { pid: $.data.id }
            - call: "POST /proposals/${pid}/submit"
              payload: {}
              as: Resident
              as_user_id: "${rid}"
            - call: "POST /budget-cycles/${cyc}/phase-transitions"
              payload: { target_phase: "DEVELOPMENT" }
              as: BudgetAdmin
            - call: "POST /proposals/${pid}/review-decisions"
              payload: { decision: "REJECT", rejection_reason: "out of scope" }
              as: Reviewer
          trigger:
            - call: "POST /proposals/${pid}/review-decisions"
              payload: { decision: "APPROVE" }
              as: Reviewer
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: corner_phase_transition_skip_rejected
        claim_type: invalid_transition
        grounds: [state_machines.BudgetCycle.DRAFT_to_SUBMISSION, 'errors[ERR_INVALID_PHASE_TRANSITION]']
        distinguishing_aspect: "Advancing a DRAFT cycle directly to VOTING (skipping SUBMISSION/DEVELOPMENT) returns ERR_INVALID_PHASE_TRANSITION (409)."
        test_recipe:
          setup: ["A DRAFT cycle with one category."]
          setup_api_calls:
            - call: "POST /budget-cycles"
              payload: { name: "PBsk", fiscal_year: 2027, total_budget_cents: 100000, voting_method: "ALLOCATION", per_project_cap_cents: 100000, per_voter_allocation_cap_cents: 100000, submission_start: "2026-03-01T00:00:00Z", submission_end: "2026-04-01T00:00:00Z", voting_start: "2026-04-01T00:00:00Z", voting_end: "2026-05-01T00:00:00Z" }
              as: BudgetAdmin
              captures: { cyc: $.data.id }
            - call: "POST /budget-cycles/${cyc}/categories"
              payload: { name: "Gen", category_budget_cap_cents: 100000 }
              as: BudgetAdmin
              captures: { cat: $.data.id }
          trigger:
            - call: "POST /budget-cycles/${cyc}/phase-transitions"
              payload: { target_phase: "VOTING" }
              as: BudgetAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_PHASE_TRANSITION"

      - name: corner_verify_decision_on_verified_resident_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Resident.PENDING_VERIFICATION_to_VERIFIED, 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "A verification-decision on an already-VERIFIED resident returns ERR_INVALID_STATE (409) (only PENDING_VERIFICATION accepts a decision)."
        test_recipe:
          setup: ["A VERIFIED resident."]
          setup_api_calls:
            - call: "POST /residents"
              payload: { full_name: "V", date_of_birth: "1990-01-01", residency_document_ref: "d", residency_address: "1 St" }
              as: Anonymous
              captures: { rid: $.data.id }
            - call: "POST /residents/${rid}/verification-requests"
              payload: {}
              as: Resident
              as_user_id: "${rid}"
            - call: "POST /residents/${rid}/verification-decisions"
              payload: { decision: "APPROVE" }
              as: Reviewer
          trigger:
            - call: "POST /residents/${rid}/verification-decisions"
              payload: { decision: "REJECT", rejection_reason: "x" }
              as: Reviewer
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

  - section: calculations
    instances:
      - name: corner_ballot_create_under_age_rejected
        claim_type: threshold_boundary
        grounds: [calculations.resident_age, 'validations[priority=11]', 'errors[ERR_UNDER_AGE]']
        distinguishing_aspect: "Just-below boundary: a resident born 2010-04-16 is 15 at the 2026-04-15 clock (< min_voter_age 16), so ballot creation returns ERR_UNDER_AGE (422)."
        test_recipe:
          setup: ["A VOTING cycle (min_voter_age 16) and a VERIFIED resident born 2010-04-16; clock at 2026-04-15 (age 15)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-15T00:00:00Z" }
              as: BudgetAdmin
            - call: "POST /budget-cycles"
              payload: { name: "PBua", fiscal_year: 2027, total_budget_cents: 100000, voting_method: "ALLOCATION", per_project_cap_cents: 100000, per_voter_allocation_cap_cents: 100000, min_voter_age: 16, submission_start: "2026-03-01T00:00:00Z", submission_end: "2026-04-01T00:00:00Z", voting_start: "2026-04-01T00:00:00Z", voting_end: "2026-05-01T00:00:00Z" }
              as: BudgetAdmin
              captures: { cyc: $.data.id }
            - call: "POST /budget-cycles/${cyc}/categories"
              payload: { name: "Gen", category_budget_cap_cents: 100000 }
              as: BudgetAdmin
              captures: { cat: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "Teen2", date_of_birth: "2010-04-16", residency_document_ref: "d", residency_address: "1 St" }
              as: Anonymous
              captures: { rid: $.data.id }
            - call: "POST /residents/${rid}/verification-requests"
              payload: {}
              as: Resident
              as_user_id: "${rid}"
            - call: "POST /residents/${rid}/verification-decisions"
              payload: { decision: "APPROVE" }
              as: Reviewer
            - call: "POST /budget-cycles/${cyc}/phase-transitions"
              payload: { target_phase: "SUBMISSION" }
              as: BudgetAdmin
            - call: "POST /budget-cycles/${cyc}/phase-transitions"
              payload: { target_phase: "DEVELOPMENT" }
              as: BudgetAdmin
            - call: "POST /budget-cycles/${cyc}/phase-transitions"
              payload: { target_phase: "VOTING" }
              as: BudgetAdmin
          trigger:
            - call: "POST /budget-cycles/${cyc}/ballots"
              payload: {}
              as: Resident
              as_user_id: "${rid}"
              captures: { err: $.data.error_id }
          assert:
            - "Resident.${rid}.age == 15"
            - "response.status == 422"
            - "response.data.error_id == ERR_UNDER_AGE"

      - name: corner_final_estimate_no_floor_effect
        claim_type: variant_selection
        grounds: [calculations.proposal_cost_estimate, entities.Proposal.fields.estimated_cost_cents]
        excluded_because:
          difficulty_instance: cost_estimate_provisional_vs_final_diverge
          rationale: "The final variant computation (floor + overhead) is exercised and asserted numerically by the named §1.8 dual-variant instance."

  - section: validations
    instances:
      - name: corner_duplicate_ballot_rejected
        claim_type: violation_to_error
        grounds: ['validations[priority=12]', 'errors[ERR_DUPLICATE_BALLOT]']
        distinguishing_aspect: "A resident who already holds a DRAFT ballot in the cycle cannot open a second one — POST /budget-cycles/{id}/ballots returns ERR_DUPLICATE_BALLOT (409)."
        test_recipe:
          setup: ["A VOTING cycle and a VERIFIED resident who already holds one DRAFT ballot."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-15T00:00:00Z" }
              as: BudgetAdmin
            - call: "POST /budget-cycles"
              payload: { name: "PBdb", fiscal_year: 2027, total_budget_cents: 100000, voting_method: "ALLOCATION", per_project_cap_cents: 100000, per_voter_allocation_cap_cents: 100000, min_voter_age: 16, submission_start: "2026-03-01T00:00:00Z", submission_end: "2026-04-01T00:00:00Z", voting_start: "2026-04-01T00:00:00Z", voting_end: "2026-05-01T00:00:00Z" }
              as: BudgetAdmin
              captures: { cyc: $.data.id }
            - call: "POST /budget-cycles/${cyc}/categories"
              payload: { name: "Gen", category_budget_cap_cents: 100000 }
              as: BudgetAdmin
              captures: { cat: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "V", date_of_birth: "1990-01-01", residency_document_ref: "d", residency_address: "1 St" }
              as: Anonymous
              captures: { rid: $.data.id }
            - call: "POST /residents/${rid}/verification-requests"
              payload: {}
              as: Resident
              as_user_id: "${rid}"
            - call: "POST /residents/${rid}/verification-decisions"
              payload: { decision: "APPROVE" }
              as: Reviewer
            - call: "POST /budget-cycles/${cyc}/phase-transitions"
              payload: { target_phase: "SUBMISSION" }
              as: BudgetAdmin
            - call: "POST /budget-cycles/${cyc}/phase-transitions"
              payload: { target_phase: "DEVELOPMENT" }
              as: BudgetAdmin
            - call: "POST /budget-cycles/${cyc}/phase-transitions"
              payload: { target_phase: "VOTING" }
              as: BudgetAdmin
            - call: "POST /budget-cycles/${cyc}/ballots"
              payload: {}
              as: Resident
              as_user_id: "${rid}"
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /budget-cycles/${cyc}/ballots"
              payload: {}
              as: Resident
              as_user_id: "${rid}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE_BALLOT"

      - name: corner_duplicate_rank_on_cast_rejected
        claim_type: violation_to_error
        grounds: ['validations[priority=13]', 'errors[ERR_DUPLICATE_RANK]']
        distinguishing_aspect: "RANKED cast with two entries both at rank 1 returns ERR_DUPLICATE_RANK (422)."
        test_recipe:
          setup: ["A RANKED cycle in VOTING with two ON_BALLOT proposals A,B; a VERIFIED resident with a DRAFT ballot carrying entries A@rank1 and B@rank1."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-15T00:00:00Z" }
              as: BudgetAdmin
            - call: "POST /budget-cycles"
