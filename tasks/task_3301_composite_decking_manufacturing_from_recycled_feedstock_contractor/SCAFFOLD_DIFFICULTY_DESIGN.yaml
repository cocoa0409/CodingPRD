            - call: "POST /decking/product-lines"
              payload: { name: "Vintage", color: "Red", capped: false, profile: "GROOVED", emboss: "WOODGRAIN", board_length_ft: 16, formulation_id: "${form_id}" }
              as: ProductManager
              captures: { line_id: $.data.id }
            - call: "POST /decking/plants/${plant_id}/production-runs"
              payload: { product_line_id: "${line_id}", planned_lf: 100, production_date: "2026-03-01", run_kind: "SELLABLE", expected_plant_version: "${plant_v0}" }
              as: OpsManager
              captures: { run_ok: $.data.id, plant_v1: $.data.version }
