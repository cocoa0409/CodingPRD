      - name: start_infusion_from_confirmed_and_decision_on_a_draft_are_both_invalid_states
        claim_type: invalid_transitions
        grounds:
          - validations[priority 40]
          - validations[priority 42]
          - errors[ERR_INVALID_SCHEDULE_STATE]
          - errors[ERR_INVALID_AUTH_STATE]
        distinguishing_aspect: |
          Two undeclared edges on two different machines, each answered by its own
          machine-specific 409: start-infusion from CONFIRMED (the only legal source is
          CHECKED_IN) gives ERR_INVALID_SCHEDULE_STATE, and a decision on a DRAFT
          authorization (the only legal source is SUBMITTED) gives ERR_INVALID_AUTH_STATE
          — and the priority-40 schedule check fires before the priority-100 preparation
          check even though no dose has been prepared either.
        test_recipe:
          setup:
            - "Standing fixture, one lot, an authorization taken DRAFT -> SUBMITTED -> APPROVED, and the appointment confirmed but never checked in."
            - "A SECOND authorization request is then created against the same appointment and left in DRAFT to receive the illegal decision."
