            - { call: "POST /retail/routes/${r1_id}/product-orders", payload: { mix_profile: DIAGNOSTIC_WEIGHTED, investment_ceiling_cents: 60000, requested_lines: [{ product_id: "${p1_id}", requested_qty: 2 }] }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { po_id: "$.data.id", po_ver: "$.data.version" } }
          trigger:
            - { call: "POST /retail/product-orders/${po_id}/pledges", payload: { credit_account_id: 8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2, pledged_lines: [{ product_id: "${p1_id}", qty: 1 }], expected_product_order_version: "${po_ver}" }, as: RouteSalesRep, captures: { acct_error: "$.data.error_id" } }
