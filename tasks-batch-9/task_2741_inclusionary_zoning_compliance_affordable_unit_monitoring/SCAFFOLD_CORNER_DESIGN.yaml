            - { call: "POST /iz-compliance/regulatory-agreements/${a_id}/record", payload: { doc_number: "DOC-CO-0001", recorded_at: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1" }
          trigger:
