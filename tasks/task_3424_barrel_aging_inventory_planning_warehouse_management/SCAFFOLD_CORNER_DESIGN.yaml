  - section: calculations
    instances:
      - name: ledger_reading_is_authoritative_reset
        claim_type: correct_result
        grounds:
          - "calculations.barrel_volume_ledger"
        distinguishing_aspect: "Chronological replay with an authoritative reset: a reading does not subtract, it SETS the volume; two events at the same clock instant are ordered by created_at ASC, and a later reading (185.5) discards the earlier accumulated state (188.00 -> 185.50)."
        test_recipe:
          setup:
            - "Rickhouse 1x1x1 commissioned; barrel filled 2028-09-01 with 200.0 L."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /barrel-aging/expansion-projects"
              payload: { name: "RH-C1", region_code: "KY", floors: 1, rows_per_floor: 1, positions_per_row: 1, construction_lag_months: 24, planned_annual_distillation_liters: 50000 }
              as: DistilleryPlanner
              captures: { proj_id: $.data.id }
            - { call: "POST /barrel-aging/expansion-projects/${proj_id}/approve", as: OperationsDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-08-21T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /barrel-aging/expansion-projects/${proj_id}/commission", as: OperationsDirector }
            - { call: "GET /barrel-aging/rickhouses?expansion_project_id=${proj_id}", as: PlatformAdmin, captures: { rh_id: "$.data[0].id" } }
            - { call: "GET /barrel-aging/rickhouses/${rh_id}/slots", as: PlatformAdmin, captures: { slot_a: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /barrel-aging/barrels"
              payload: { slot_id: "${slot_a}", wood_origin: "AMERICAN_WHITE_OAK", seasoning_months: 12, char_level: 3, spirit_type: "BOURBON", fill_proof: 125.0, fill_volume_liters: 200.0, min_maturation_months: 48 }
              as: WarehouseManager
              captures: { b_id: $.data.id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2029-03-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /barrel-aging/barrels/${b_id}/assessments"
              payload: { kind: "EVAPORATION_READING", measured_volume_liters: 190.0 }
              as: WarehouseManager
            - call: "POST /barrel-aging/barrels/${b_id}/assessments"
              payload: { kind: "QUALITY_SAMPLE", sample_draw_liters: 2.0, quality_score: 85 }
              as: WarehouseManager
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2029-04-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /barrel-aging/barrels/${b_id}/assessments"
              payload: { kind: "EVAPORATION_READING", measured_volume_liters: 185.5 }
              as: WarehouseManager
          trigger:
            - { call: "GET /barrel-aging/barrels/${b_id}", as: WarehouseManager }
          assert:
            - "after the 2029-03-01 pair (reading 190.0 created first, then sample 2.0 at the same instant): ledger == 188.00 (reading resets, then sample subtracts; created_at ASC breaks the tie)"
            - "after the 2029-04-01 reading: Barrel.${b_id}.current_volume_ledger_liters == 185.50 (authoritative reset discards the 188.00 intermediate)"

      - name: statutory_recomputed_with_current_slot_heat
        claim_type: correct_result
        grounds:
          - "calculations.barrel_volume_statutory"
          - "entities.Barrel.fields.current_slot_id"
        distinguishing_aspect: "The statutory projection uses the CURRENT slot's heat_factor for ALL historical blocks (pinned simplification): the same barrel at the same clock reads 191.27 on a floor-1 slot and 190.84 after rotation to a floor-2 slot (heat 1.05), with no new events recorded."
        test_recipe:
          setup:
            - "Rickhouse 2x1x1 commissioned (slot[0] floor 1 heat 1.00, slot[1] floor 2 heat 1.05); barrel filled 2028-09-01 on the floor-1 slot, seasoning_months 12, 200.0 L; clock at 2029-09-01."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /barrel-aging/expansion-projects"
              payload: { name: "RH-C2", region_code: "KY", floors: 2, rows_per_floor: 1, positions_per_row: 1, construction_lag_months: 24, planned_annual_distillation_liters: 50000 }
