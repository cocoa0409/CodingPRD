        claim_type: Correct Result
        grounds:
          - calculations.base_permit_fee
          - entities.PermitApplication.fields.assessed_valuation
        distinguishing_aspect: "At the first tier ceiling exactly (valuation 50000), base is 50000/1000*10*1.00 = 500.00 (all in tier1, no tier2 spillover), total 825.00."
