              as: DeliveryCoordinator
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /api/orders"
              payload: { store_id: "${store_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /api/orders/${order_id}/lines"
              payload: { article_id: "${art_id}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /api/orders/${order_id}/checkout"
              payload: { fulfillment_channel: "DELIVERY" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /api/orders/${order_id}/delivery-bookings"
              payload: { slot_id: "${slot_id}", access_type: "ELEVATOR", floor: 1, expected_slot_version: "${slot_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bk: $.data.id }
            - call: "POST /api/delivery-bookings/${bk}/start"
              payload: {}
              as: DeliveryCoordinator
            - call: "POST /api/delivery-bookings/${bk}/complete"
              payload: {}
              as: DeliveryCoordinator
            - call: "POST /api/orders/${order_id}/assembly-jobs"
              payload: { provider_id: "CREW-B", window_start: "2026-09-12T09:00:00Z", window_end: "2026-09-12T11:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id }
            - call: "POST /api/assembly-jobs/${job_id}/dispatch"
              payload: {}
              as: AssemblyProvider
            - call: "POST /api/assembly-jobs/${job_id}/start"
              payload: {}
              as: AssemblyProvider
          trigger:
            - call: "POST /api/assembly-jobs/${job_id}/complete"
              payload: { actual_minutes: 20 }
              as: AssemblyProvider
              captures: { job_st: $.data.status, billed: $.data.billed_minutes }
            - call: "GET /api/orders/${order_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o_st: $.data.status, o_asm: $.data.assembly_status, o_pts: $.data.points_earned }
            - call: "GET /api/customers/${cust_id}"
              payload: {}
              as: StoreOps
              captures: { cust_pts: $.data.points_balance }
          assert:
            - "hop 1: AssemblyJob.${job_id}.status == COMPLETED and billed_minutes == 20 (actual 20 < cap ceil(30 x 1.5) = 45)"
            - "hop 2: Order.${order_id}.assembly_status == COMPLETED"
            - "hop 3: Order.${order_id}.status == CLOSED (auto-close fired only because assembly completed)"
            - "hop 4: Order.${order_id}.points_earned == 10 and Customer.${cust_id}.points_balance == 10 (floor(1000/100))"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: checkout_state_error_beats_points_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_INSUFFICIENT_POINTS]
        distinguishing_aspect: |
          Error-category pair state (priority 6) vs business_fiscal (priority
