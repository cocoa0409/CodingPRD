            - "${s_disc} == ERR_INVALID_DISCLOSURE_STATE and ${s_off} == ERR_INVALID_OFFER_STATE"
            - "${s_cart} == ERR_INVALID_CART_STATE and ${s_ord} == ERR_INVALID_ORDER_STATE"
            - "${s_int} == ERR_INVALID_INTERACTION_STATE; Viewer.${v1}.strike_count stays 0 because the rejected BLOCK applies nothing"

      - name: second_vote_by_the_same_viewer_returns_duplicate_vote
        claim_type: error_triggerable
        grounds:
          - validations[priority=25]
          - errors[ERR_DUPLICATE_VOTE]
          - entities.Interaction.fields.voted_viewer_ids
        distinguishing_aspect: "voted_viewer_ids makes the poll one-vote-per-viewer: a second vote by the same viewer on a different option returns 409 ERR_DUPLICATE_VOTE and neither vote_count nor tallies move."
        test_recipe:
          setup:
            - "Show LIVE at 18:10Z with an OPEN poll on which viewer 1 has voted option 0."
          setup_api_calls:
            - *k_clock_t0
            - *k_host
            - *k_cert
            - *k_viewer1
            - *k_product
            - *k_substantiate
            - *k_show
            - *k_booking
            - *k_confirm
            - *k_slot
            - *k_channel
            - *k_provision
            - *k_health_ok
            - *k_ready
            - *k_clock_prelive
            - *k_golive
            - *k_clock_live
            - call: "POST /interactions"
              payload: { show_id: "${sh1}", kind: "POLL", body: "Ivory or onyx?", options: ["Ivory", "Onyx"] }
              as: Host
              as_user_id: "${h1}"
              captures: { pollD: $.data.id }
