# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task_0607
# Nine §0.5 rules x 2 instances = 18 instances. Every grounds[] resolves into
# SCAFFOLD.yaml §1.1–§1.7. Every setup_api_calls/trigger call conforms to §1.5.
#
# Shared rate-plan literals used across recipes (created via POST /rate-plans):
#   base_premium_cents=200000, per_mile_rate_cents=0.5, included_miles_per_period=1000,
#   hard_brake_weight=2.0, speeding_weight=1.5, phone_use_weight=1.0
# Constants: MIN_SCORING_TRIPS=3, QUOTE_VALIDITY_DAYS=14, SAFE_TRIP_MIN_MILES=5.0,
#   SAFE_TRIP_DISCOUNT_CENTS=250, CRASH_FNOL_SEVERITY=4, MAX_CLAIM_REOPENS=2,
#   PERIODS_PER_YEAR=12, RESERVE_BASE_CENTS=100000.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      # ---- Instance 1: enrollment provisional (per-100-mi) vs policy operational (absolute) ----
      - name: provisional_vs_operational_risk_diverge_on_same_events
        grounds:
          - calculations.provisional_risk_score
          - calculations.operational_risk_score
          - entities.Enrollment.fields.provisional_risk_score
          - entities.Policy.fields.current_risk_score
        distinguishing_aspect: |
          provisional_risk_score (Enrollment domain) normalizes event counts per 100 miles
          while operational_risk_score (Policy domain) uses absolute counts; identical trips
          (hb=4, sp=2, pu=1 over 40 miles) yield Enrollment.provisional_risk_score == 30.0
          but Policy.current_risk_score == 12.0 — different entity domains, different numbers.
        test_recipe:
          setup:
            - "Clock at 2026-02-01T00:00:00Z"
            - "ACTIVE rate plan with the shared weights/base above"
            - "Driver D registered"
            - "Enrollment E (scoring_days=30) with 3 ACCEPTED trips totaling 40 miles carrying hb=4, sp=2, pu=1 across them; finalized -> provisional_risk_score 30.0"
            - "Quote from E bound into Policy P; the SAME 3 trips replayed as policy-bound ACCEPTED trips so Policy.current_risk_score is computed on identical event totals"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: UnderwritingOps
            - call: "POST /rate-plans"
              payload: { name: "CA UBI", state_code: "CA", base_premium_cents: 200000, per_mile_rate_cents: 0.5, included_miles_per_period: 1000, hard_brake_weight: 2.0, speeding_weight: 1.5, phone_use_weight: 1.0 }
              as: UnderwritingOps
              captures: { rp_id: $.data.id }
            - call: "POST /drivers"
              payload: { email: "d1@x.com", full_name: "D One", state_code: "CA" }
              as: DriverUser
              captures: { d_id: $.data.id }
            - call: "POST /enrollments"
              payload: { driver_id: "${d_id}", rate_plan_id: "${rp_id}", scoring_days: 30 }
              as: DriverUser
              as_user_id: "${d_id}"
              captures: { e_id: $.data.id }
            # enrollment trip 1: 20 mi, hb=2 sp=1
            - call: "POST /trips"
              payload: { enrollment_id: "${e_id}", started_at: "2026-02-01T01:00:00Z", ended_at: "2026-02-01T01:30:00Z", distance_miles: 20.0 }
              as: DriverUser
              as_user_id: "${d_id}"
              captures: { et1: $.data.id }
            - call: "POST /trips/${et1}/events"
              payload: { event_type: "HARD_BRAKE", severity: 2, occurred_at: "2026-02-01T01:05:00Z" }
              as: DriverUser
              as_user_id: "${d_id}"
            - call: "POST /trips/${et1}/events"
              payload: { event_type: "HARD_BRAKE", severity: 2, occurred_at: "2026-02-01T01:06:00Z" }
              as: DriverUser
              as_user_id: "${d_id}"
            - call: "POST /trips/${et1}/events"
              payload: { event_type: "SPEEDING", severity: 3, occurred_at: "2026-02-01T01:07:00Z" }
              as: DriverUser
              as_user_id: "${d_id}"
            - call: "POST /trips/${et1}/accept"
              payload: {}
              as: DriverUser
              as_user_id: "${d_id}"
            # enrollment trip 2: 15 mi, hb=2 pu=1
            - call: "POST /trips"
              payload: { enrollment_id: "${e_id}", started_at: "2026-02-01T02:00:00Z", ended_at: "2026-02-01T02:30:00Z", distance_miles: 15.0 }
              as: DriverUser
              as_user_id: "${d_id}"
              captures: { et2: $.data.id }
            - call: "POST /trips/${et2}/events"
              payload: { event_type: "HARD_BRAKE", severity: 2, occurred_at: "2026-02-01T02:05:00Z" }
              as: DriverUser
              as_user_id: "${d_id}"
            - call: "POST /trips/${et2}/events"
              payload: { event_type: "HARD_BRAKE", severity: 2, occurred_at: "2026-02-01T02:06:00Z" }
              as: DriverUser
              as_user_id: "${d_id}"
            - call: "POST /trips/${et2}/events"
              payload: { event_type: "SPEEDING", severity: 3, occurred_at: "2026-02-01T02:07:00Z" }
              as: DriverUser
              as_user_id: "${d_id}"
            - call: "POST /trips/${et2}/events"
              payload: { event_type: "PHONE_USE", severity: 1, occurred_at: "2026-02-01T02:08:00Z" }
              as: DriverUser
              as_user_id: "${d_id}"
            - call: "POST /trips/${et2}/accept"
              payload: {}
              as: DriverUser
              as_user_id: "${d_id}"
            # enrollment trip 3: 5 mi, clean (to satisfy MIN_SCORING_TRIPS=3)
            - call: "POST /trips"
              payload: { enrollment_id: "${e_id}", started_at: "2026-02-01T03:00:00Z", ended_at: "2026-02-01T03:15:00Z", distance_miles: 5.0 }
              as: DriverUser
              as_user_id: "${d_id}"
              captures: { et3: $.data.id }
            - call: "POST /trips/${et3}/accept"
              payload: {}
              as: DriverUser
              as_user_id: "${d_id}"
            - call: "POST /enrollments/${e_id}/finalize-scoring"
              payload: {}
              as: DriverUser
              as_user_id: "${d_id}"
            - call: "POST /quotes"
              payload: { enrollment_id: "${e_id}" }
              as: UnderwritingOps
              captures: { q_id: $.data.id }
            - call: "POST /policies"
              payload: { quote_id: "${q_id}" }
              as: UnderwritingOps
              captures: { p_id: $.data.id }
            # replay identical events as policy-bound trips (hb=4 sp=2 pu=1 absolute)
            - call: "POST /trips"
              payload: { policy_id: "${p_id}", started_at: "2026-02-02T01:00:00Z", ended_at: "2026-02-02T01:30:00Z", distance_miles: 20.0 }
              as: DriverUser
              as_user_id: "${d_id}"
              captures: { pt1: $.data.id }
            - call: "POST /trips/${pt1}/events"
              payload: { event_type: "HARD_BRAKE", severity: 2, occurred_at: "2026-02-02T01:05:00Z" }
              as: DriverUser
              as_user_id: "${d_id}"
            - call: "POST /trips/${pt1}/events"
              payload: { event_type: "HARD_BRAKE", severity: 2, occurred_at: "2026-02-02T01:06:00Z" }
              as: DriverUser
              as_user_id: "${d_id}"
            - call: "POST /trips/${pt1}/events"
              payload: { event_type: "HARD_BRAKE", severity: 2, occurred_at: "2026-02-02T01:07:00Z" }
              as: DriverUser
              as_user_id: "${d_id}"
            - call: "POST /trips/${pt1}/events"
              payload: { event_type: "HARD_BRAKE", severity: 2, occurred_at: "2026-02-02T01:08:00Z" }
              as: DriverUser
              as_user_id: "${d_id}"
            - call: "POST /trips/${pt1}/events"
              payload: { event_type: "SPEEDING", severity: 3, occurred_at: "2026-02-02T01:09:00Z" }
              as: DriverUser
              as_user_id: "${d_id}"
            - call: "POST /trips/${pt1}/events"
              payload: { event_type: "SPEEDING", severity: 3, occurred_at: "2026-02-02T01:10:00Z" }
              as: DriverUser
              as_user_id: "${d_id}"
            - call: "POST /trips/${pt1}/events"
              payload: { event_type: "PHONE_USE", severity: 1, occurred_at: "2026-02-02T01:11:00Z" }
              as: DriverUser
              as_user_id: "${d_id}"
          trigger:
            - call: "POST /trips/${pt1}/accept"
              payload: {}
              as: DriverUser
              as_user_id: "${d_id}"
              captures: { final_score: $.data.id }
          assert:
            - "Enrollment.${e_id}.provisional_risk_score == 30.0"
            - "Policy.${p_id}.current_risk_score == 12.0"
            - "Enrollment.${e_id}.provisional_risk_score != Policy.${p_id}.current_risk_score"

      # ---- Instance 2: quoted_premium (Quote domain) vs claim_reserve (Claim domain) ----
      - name: quoted_premium_vs_claim_reserve_independent_domains
        grounds:
          - calculations.quoted_premium
          - calculations.claim_reserve
          - entities.Quote.fields.quoted_annual_premium_cents
          - entities.Claim.fields.reserve_cents
        distinguishing_aspect: |
          quoted_premium is a base*multiplier accounting figure on the Quote entity
          (200000 * 1.25 = 250000 cents at locked_risk_score 30.0), whereas claim_reserve
          is a severity-scaled loss figure on the Claim entity (100000 * 4 = 400000 cents);
          the two valid algorithms produce unrelated numbers on different entity domains.
        test_recipe:
          setup:
            - "Clock at 2026-02-01T00:00:00Z; ACTIVE rate plan; Driver D"
            - "Enrollment E finalized at provisional_risk_score 30.0 (ELEVATED tier, multiplier 1.25)"
            - "Quote Q generated -> quoted_annual_premium_cents 250000; Policy P bound"
            - "MANUAL claim C filed on P with reported_severity 4, then triaged"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: UnderwritingOps
            - call: "POST /rate-plans"
              payload: { name: "CA UBI", state_code: "CA", base_premium_cents: 200000, per_mile_rate_cents: 0.5, included_miles_per_period: 1000, hard_brake_weight: 2.0, speeding_weight: 1.5, phone_use_weight: 1.0 }
              as: UnderwritingOps
              captures: { rp_id: $.data.id }
            - call: "POST /drivers"
              payload: { email: "d2@x.com", full_name: "D Two", state_code: "CA" }
              as: DriverUser
              captures: { d_id: $.data.id }
            - call: "POST /enrollments"
              payload: { driver_id: "${d_id}", rate_plan_id: "${rp_id}", scoring_days: 30 }
              as: DriverUser
              as_user_id: "${d_id}"
              captures: { e_id: $.data.id }
            - call: "POST /trips"
              payload: { enrollment_id: "${e_id}", started_at: "2026-02-01T01:00:00Z", ended_at: "2026-02-01T01:30:00Z", distance_miles: 20.0 }
              as: DriverUser
              as_user_id: "${d_id}"
              captures: { et1: $.data.id }
            - call: "POST /trips/${et1}/events"
              payload: { event_type: "HARD_BRAKE", severity: 2, occurred_at: "2026-02-01T01:05:00Z" }
              as: DriverUser
              as_user_id: "${d_id}"
            - call: "POST /trips/${et1}/events"
              payload: { event_type: "HARD_BRAKE", severity: 2, occurred_at: "2026-02-01T01:06:00Z" }
              as: DriverUser
              as_user_id: "${d_id}"
            - call: "POST /trips/${et1}/events"
              payload: { event_type: "HARD_BRAKE", severity: 2, occurred_at: "2026-02-01T01:07:00Z" }
              as: DriverUser
              as_user_id: "${d_id}"
            - call: "POST /trips/${et1}/events"
              payload: { event_type: "HARD_BRAKE", severity: 2, occurred_at: "2026-02-01T01:08:00Z" }
              as: DriverUser
              as_user_id: "${d_id}"
            - call: "POST /trips/${et1}/events"
              payload: { event_type: "SPEEDING", severity: 3, occurred_at: "2026-02-01T01:09:00Z" }
              as: DriverUser
              as_user_id: "${d_id}"
            - call: "POST /trips/${et1}/events"
              payload: { event_type: "SPEEDING", severity: 3, occurred_at: "2026-02-01T01:10:00Z" }
              as: DriverUser
              as_user_id: "${d_id}"
            - call: "POST /trips/${et1}/events"
              payload: { event_type: "PHONE_USE", severity: 1, occurred_at: "2026-02-01T01:11:00Z" }
              as: DriverUser
              as_user_id: "${d_id}"
            - call: "POST /trips/${et1}/accept"
              payload: {}
              as: DriverUser
              as_user_id: "${d_id}"
            - call: "POST /trips"
              payload: { enrollment_id: "${e_id}", started_at: "2026-02-01T02:00:00Z", ended_at: "2026-02-01T02:30:00Z", distance_miles: 10.0 }
              as: DriverUser
              as_user_id: "${d_id}"
              captures: { et2: $.data.id }
            - call: "POST /trips/${et2}/accept"
              payload: {}
              as: DriverUser
              as_user_id: "${d_id}"
            - call: "POST /trips"
              payload: { enrollment_id: "${e_id}", started_at: "2026-02-01T03:00:00Z", ended_at: "2026-02-01T03:30:00Z", distance_miles: 10.0 }
              as: DriverUser
              as_user_id: "${d_id}"
              captures: { et3: $.data.id }
            - call: "POST /trips/${et3}/accept"
              payload: {}
              as: DriverUser
              as_user_id: "${d_id}"
            - call: "POST /enrollments/${e_id}/finalize-scoring"
              payload: {}
              as: DriverUser
              as_user_id: "${d_id}"
            - call: "POST /quotes"
              payload: { enrollment_id: "${e_id}" }
              as: UnderwritingOps
              captures: { q_id: $.data.id }
            - call: "POST /policies"
              payload: { quote_id: "${q_id}" }
              as: UnderwritingOps
              captures: { p_id: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${p_id}", reported_severity: 4, reason: "rear-end" }
              as: DriverUser
              as_user_id: "${d_id}"
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /claims/${c_id}/triage"
              payload: {}
              as: ClaimsAdjuster
              captures: { cap_reserve: $.data.reserve_cents }
          assert:
            - "Quote.${q_id}.quoted_annual_premium_cents == 250000"
            - "Claim.${c_id}.reserve_cents == 400000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      # ---- Instance 1 (mode a): nonlinear tiered risk_multiplier with clamp ----
      - name: risk_multiplier_tier_selection_nonlinear_three_inputs
        grounds:
          - calculations.risk_multiplier
          - calculations.quoted_premium
          - entities.Quote.fields.risk_multiplier
        distinguishing_aspect: |
          MODE (a): risk_multiplier takes three inputs (risk_score, MULT_FLOOR, MULT_CEILING),
          selects one of four tiers by half-open boundaries, then nested-clamps via min/max;
          locked_risk_score 30.0 lands in ELEVATED [25,50) -> 1.25 (not STANDARD 1.00).
        test_recipe:
          setup:
            - "Clock 2026-02-01T00:00:00Z; ACTIVE rate plan base_premium 200000"
            - "Enrollment finalized at provisional_risk_score exactly 30.0 (ELEVATED tier)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: UnderwritingOps
            - call: "POST /rate-plans"
              payload: { name: "CA UBI", state_code: "CA", base_premium_cents: 200000, per_mile_rate_cents: 0.5, included_miles_per_period: 1000, hard_brake_weight: 2.0, speeding_weight: 1.5, phone_use_weight: 1.0 }
              as: UnderwritingOps
              captures: { rp_id: $.data.id }
            - call: "POST /drivers"
              payload: { email: "d3@x.com", full_name: "D Three", state_code: "CA" }
              as: DriverUser
              captures: { d_id: $.data.id }
            - call: "POST /enrollments"
              payload: { driver_id: "${d_id}", rate_plan_id: "${rp_id}", scoring_days: 30 }
              as: DriverUser
              as_user_id: "${d_id}"
              captures: { e_id: $.data.id }
            - call: "POST /trips"
              payload: { enrollment_id: "${e_id}", started_at: "2026-02-01T01:00:00Z", ended_at: "2026-02-01T01:30:00Z", distance_miles: 20.0 }
              as: DriverUser
              as_user_id: "${d_id}"
              captures: { et1: $.data.id }
            - call: "POST /trips/${et1}/events"
              payload: { event_type: "HARD_BRAKE", severity: 2, occurred_at: "2026-02-01T01:05:00Z" }
              as: DriverUser
              as_user_id: "${d_id}"
            - call: "POST /trips/${et1}/events"
              payload: { event_type: "HARD_BRAKE", severity: 2, occurred_at: "2026-02-01T01:06:00Z" }
              as: DriverUser
              as_user_id: "${d_id}"
            - call: "POST /trips/${et1}/events"
              payload: { event_type: "HARD_BRAKE", severity: 2, occurred_at: "2026-02-01T01:07:00Z" }
              as: DriverUser
              as_user_id: "${d_id}"
            - call: "POST /trips/${et1}/events"
              payload: { event_type: "HARD_BRAKE", severity: 2, occurred_at: "2026-02-01T01:08:00Z" }
              as: DriverUser
              as_user_id: "${d_id}"
            - call: "POST /trips/${et1}/events"
              payload: { event_type: "SPEEDING", severity: 3, occurred_at: "2026-02-01T01:09:00Z" }
              as: DriverUser
              as_user_id: "${d_id}"
            - call: "POST /trips/${et1}/events"
              payload: { event_type: "SPEEDING", severity: 3, occurred_at: "2026-02-01T01:10:00Z" }
              as: DriverUser
              as_user_id: "${d_id}"
            - call: "POST /trips/${et1}/events"
              payload: { event_type: "PHONE_USE", severity: 1, occurred_at: "2026-02-01T01:11:00Z" }
              as: DriverUser
              as_user_id: "${d_id}"
            - call: "POST /trips/${et1}/accept"
              payload: {}
              as: DriverUser
              as_user_id: "${d_id}"
            - call: "POST /trips"
              payload: { enrollment_id: "${e_id}", started_at: "2026-02-01T02:00:00Z", ended_at: "2026-02-01T02:30:00Z", distance_miles: 10.0 }
              as: DriverUser
              as_user_id: "${d_id}"
              captures: { et2: $.data.id }
            - call: "POST /trips/${et2}/accept"
              payload: {}
              as: DriverUser
              as_user_id: "${d_id}"
            - call: "POST /trips"
              payload: { enrollment_id: "${e_id}", started_at: "2026-02-01T03:00:00Z", ended_at: "2026-02-01T03:30:00Z", distance_miles: 10.0 }
              as: DriverUser
              as_user_id: "${d_id}"
              captures: { et3: $.data.id }
            - call: "POST /trips/${et3}/accept"
              payload: {}
              as: DriverUser
              as_user_id: "${d_id}"
            - call: "POST /enrollments/${e_id}/finalize-scoring"
              payload: {}
              as: DriverUser
              as_user_id: "${d_id}"
          trigger:
            - call: "POST /quotes"
              payload: { enrollment_id: "${e_id}" }
              as: UnderwritingOps
              captures: { q_id: $.data.id, q_mult: $.data.risk_multiplier }
          assert:
            - "Quote.${q_id}.locked_risk_score == 30.0"
            - "Quote.${q_id}.risk_multiplier == 1.25"
            - "Quote.${q_id}.quoted_annual_premium_cents == 250000"

      # ---- Instance 2 (mode b): mileage_premium per-component rounding order ----
      - name: mileage_premium_round_per_component_then_sum
        grounds:
          - calculations.mileage_premium
          - entities.PremiumStatement.fields.base_charge_cents
          - entities.PremiumStatement.fields.mileage_charge_cents
        distinguishing_aspect: |
          MODE (b): base_charge_cents and mileage_charge_cents are each round_half_up'd to a
          whole cent BEFORE summing. With base_raw=7225.5 (->7226) and mileage_raw=1500.5
          (->1501) the per-component sum is 8727, whereas a 'sum-raw-then-round' implementation
          yields 8726 — the scaffold pins per-component rounding.
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00Z; rate plan with base_premium_cents=86706, per_mile_rate_cents=0.5, included_miles_per_period=1000, all weights 0.0"
            - "Driver, enrollment (3 clean short trips -> provisional 0.0 -> SAFE tier 0.85), quote, policy P with bound_premium_cents=round(86706*0.85)=73700; current_risk_multiplier 0.85 ... NOTE base_raw uses bound/12*current_mult"
            - "Wait — to land base_raw at 7225.5 we need bound/12*mult=7225.5. We set current multiplier to 1.0 by driving operational score into STANDARD tier on the policy, and bound_premium_cents=86706 directly via a SAFE-tier-free path is impossible; instead we choose base_premium and tier so bound_premium_cents=86706 and current_risk_multiplier=1.0."
            - "Concretely: provisional 0.0 -> quote multiplier 0.85 -> quoted=round(86706*0.85)=73700 is NOT 86706. So we instead use base_premium_cents=102007 so quoted at SAFE 0.85 = round(102007*0.85)=86706; bound_premium_cents=86706."
            - "On the policy, add ACCEPTED trips whose operational score lands in STANDARD [10,25) so current_risk_multiplier=1.0; then base_raw=86706/12*1.0=7225.5"
            - "Period billed_miles=3001 (included 1000 -> overage 2001) -> mileage_raw=2001*0.5=1000.5 ... adjust: we want mileage_raw=1500.5 -> overage=3001 -> billed_miles=4001"
            - "So drive total ACCEPTED policy mileage = 4001 in the current period"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: UnderwritingOps
            - call: "POST /rate-plans"
              payload: { name: "Round Plan", state_code: "CA", base_premium_cents: 102007, per_mile_rate_cents: 0.5, included_miles_per_period: 1000, hard_brake_weight: 2.0, speeding_weight: 0.0, phone_use_weight: 0.0 }
              as: UnderwritingOps
              captures: { rp_id: $.data.id }
            - call: "POST /drivers"
              payload: { email: "d4@x.com", full_name: "D Four", state_code: "CA" }
              as: DriverUser
              captures: { d_id: $.data.id }
            - call: "POST /enrollments"
              payload: { driver_id: "${d_id}", rate_plan_id: "${rp_id}", scoring_days: 30 }
              as: DriverUser
              as_user_id: "${d_id}"
              captures: { e_id: $.data.id }
            # 3 clean short enrollment trips -> provisional 0.0 -> SAFE tier 0.85 on quote
            - call: "POST /trips"
              payload: { enrollment_id: "${e_id}", started_at: "2026-03-01T01:00:00Z", ended_at: "2026-03-01T01:10:00Z", distance_miles: 4.0 }
              as: DriverUser
              as_user_id: "${d_id}"
              captures: { et1: $.data.id }
