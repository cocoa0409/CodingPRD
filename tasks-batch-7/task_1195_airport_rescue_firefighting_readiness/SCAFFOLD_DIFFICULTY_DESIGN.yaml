            - "${err_c1} == \"ERR_INSPECTION_BLOCKING_NOTIFICATIONS\"  # PENDING blocks"
            - "${err_c2} == \"ERR_INSPECTION_BLOCKING_NOTIFICATIONS\"  # ACKNOWLEDGED still blocks"
            - "IndexDowngradeNotification.${n_id}.status == \"RESOLVED\" after restore cascade"
            - "FaaInspection.${insp1}.status == \"CLOSED_PASS\"  # gate clears only on RESOLVED"

  # ---------------------------------------------------------------------------
  # Rule 8: resource_temporal_overlap — different interval semantics on different
  # resources (drill runway half-open vs agreement partner closed interval)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: ro_drill_runway_half_open_adjacency
        grounds:
          - entities.ResponseDrill.fields.scheduled_start
          - entities.ResponseDrill.fields.scheduled_end
          - "validations[priority=8]"
        distinguishing_aspect: |
          Runway resource with HALF-OPEN [start, end) semantics: a drill starting exactly
          at another's scheduled_end does NOT conflict (adjacency allowed), while a drill
          straddling the boundary does; a different runway never conflicts.
        test_recipe:
          setup: ["Airport profile exists; clock at default 2026-05-01"]
          setup_api_calls:
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager }
          trigger:
            - { call: "POST /arff/response-drills", payload: { runway_designator: "09L", scheduled_start: "2026-05-03T10:00:00Z", scheduled_end: "2026-05-03T11:00:00Z" }, as: ArffChief, captures: { dr1: $.data.id } }
            - { call: "POST /arff/response-drills", payload: { runway_designator: "09L", scheduled_start: "2026-05-03T11:00:00Z", scheduled_end: "2026-05-03T12:00:00Z" }, as: ArffChief, captures: { dr2: $.data.id } }
            - { call: "POST /arff/response-drills", payload: { runway_designator: "09L", scheduled_start: "2026-05-03T10:30:00Z", scheduled_end: "2026-05-03T11:30:00Z" }, as: ArffChief, captures: { err3: $.data.error_id } }
            - { call: "POST /arff/response-drills", payload: { runway_designator: "27R", scheduled_start: "2026-05-03T10:30:00Z", scheduled_end: "2026-05-03T11:30:00Z" }, as: ArffChief, captures: { dr4: $.data.id } }
          assert:
            - "ResponseDrill.${dr2} created with status SCHEDULED  # 11:00 start touches 11:00 end — adjacency allowed under half-open semantics"
            - "${err3} == \"ERR_DRILL_WINDOW_OVERLAP\"  # 10:30 < 11:00 and 10:00 < 11:30 — true overlap"
            - "ResponseDrill.${dr4} created  # different runway"

      - name: ro_agreement_window_closed_interval_touch_conflicts
        grounds:
          - entities.MutualAidAgreement.fields.start_date
          - entities.MutualAidAgreement.fields.end_date
          - "validations[priority=8]"
        distinguishing_aspect: |
          Agreement resource per partner with CLOSED inclusive-interval semantics
          (different interval semantics and different resource from the drill instance):
          a new agreement whose start_date equals an existing agreement's end_date DOES
          conflict; only a start strictly after the end_date is accepted.
        test_recipe:
          setup: ["Airport profile exists"]
          setup_api_calls:
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager }
          trigger:
            - { call: "POST /arff/mutual-aid-agreements", payload: { partner_airport_code: "KCTY", max_alert_level: "ALERT_2", start_date: "2026-01-01", end_date: "2026-06-30" }, as: AirportManager, captures: { ag1: $.data.id } }
            - { call: "POST /arff/mutual-aid-agreements/${ag1}/activate", as: AirportManager }
            - { call: "POST /arff/mutual-aid-agreements", payload: { partner_airport_code: "KCTY", max_alert_level: "ALERT_3", start_date: "2026-06-30", end_date: "2026-12-31" }, as: AirportManager, captures: { err2: $.data.error_id } }
            - { call: "POST /arff/mutual-aid-agreements", payload: { partner_airport_code: "KCTY", max_alert_level: "ALERT_3", start_date: "2026-07-01", end_date: "2026-12-31" }, as: AirportManager, captures: { ag3: $.data.id } }
          assert:
            - "${err2} == \"ERR_AGREEMENT_WINDOW_OVERLAP\"  # touching at 2026-06-30 conflicts under closed semantics"
            - "MutualAidAgreement.${ag3} created with status DRAFT  # 2026-07-01 > 2026-06-30 is clear"
            - "MutualAidAgreement.${ag1}.status == \"ACTIVE\" and unchanged"

  # ---------------------------------------------------------------------------
  # Rule 9: compensating_invariant — different conserved quantities
  # (fleet agent capacity / index posture vs roster headcount)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: ci_oos_restore_conserves_fleet_capacity_and_index
        grounds:
          - state_machines.ArffVehicle.IN_SERVICE_to_OUT_OF_SERVICE
          - state_machines.ArffVehicle.OUT_OF_SERVICE_to_IN_SERVICE
          - calculations.fire_suppression_capacity_score
          - calculations.effective_index_recompute
        distinguishing_aspect: |
          Conserved quantity: fleet rated agent capacity and index posture. The OOS-open
          forward action paired with its compensating restore leaves
          sum(water_capacity_gal) == 4000, vehicle count == 2, and effective_index back at
          certificated C with the notification RESOLVED — zero drift.
        test_recipe:
          setup:
