# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Veterinary Clinic Practice Management — Expert band
# 9 Difficulty Rules x 2 instances = 18 instances.
# Every setup_api_calls chain drives empty-DB -> the setup state using only §1.5
# endpoints; every ${var} is bound by an earlier captures: block; OCC version
# inputs are ${var}; all formula-derived asserts are pre-computed literals.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: invoice_estimate_vs_actual_billing_divergence
        grounds:
          - calculations.estimate_projected_total
          - calculations.invoice_actual_total
          - entities.Invoice.fields.estimate_total_cents
          - entities.Invoice.fields.actual_total_cents
          - entities.Invoice.fields.variance_cents
        distinguishing_aspect: |
          Operates on the Invoice/Estimate BILLING domain: the forward-looking estimate
          (all planned line items, optimistic discount) and the chronological actual
          (only rendered DONE/RESULTED charges net of consumed deposit) produce different
          cents for the same visit — estimate_total_cents != actual_total_cents.
        test_recipe:
          setup:
            - "PLUS wellness plan on a patient; an approved estimate projecting 2 service lines totalling 60000 estimate cents (gross 60000, one eligible line discounted)."
            - "Appointment driven to IN_EXAM; a DONE surgery (total 32000, deposit_consumed 30000 -> contributes 2000) and one RESULTED lab order (8000); appointment COMPLETED."
            - "Household credit is 0 at finalize time (the 30000 deposit was fully consumed by the surgery)."
          setup_api_calls:
            - call: "POST /clinic/operatories"
              payload: { name: "OR-1", cleanup_buffer_minutes: 30 }
              as: PracticeManager
              captures: { or1: $.data.id }
            - call: "POST /clinic/households"
              payload: { account_name: "Rivera" }
              as: Receptionist
              captures: { hh: $.data.id, hh_v0: $.data.version }
            - call: "POST /clinic/patients"
              payload: { household_id: "${hh}", name: "Rex", species: "DOG", weight_kg: 12.5 }
              as: Receptionist
              captures: { pat: $.data.id }
            - call: "POST /clinic/wellness-plans"
              payload: { patient_id: "${pat}", tier: "PLUS" }
              as: Receptionist
              captures: { wp: $.data.id }
            - call: "POST /clinic/estimates"
              payload: { patient_id: "${pat}", line_items: [ { service_code: "DENTAL", qty: 1, unit_price_cents: 50000, eligible_for_plan_discount: true }, { service_code: "MEDS", qty: 1, unit_price_cents: 20000, eligible_for_plan_discount: false } ], deposit_required_cents: 30000 }
              as: Veterinarian
              captures: { est: $.data.id }
            - call: "POST /clinic/deposits"
              payload: { household_id: "${hh}", amount_cents: 30000, estimate_id: "${est}", expected_household_version: "${hh_v0}" }
              as: Receptionist
              captures: { hh_v1: $.data.version }
            - call: "POST /clinic/estimates/${est}/transition"
              payload: { action: "present" }
              as: Veterinarian
            - call: "POST /clinic/estimates/${est}/transition"
              payload: { action: "approve" }
              as: Receptionist
            - call: "POST /clinic/appointments"
              payload: { patient_id: "${pat}", scheduled_start: "2026-07-01T09:00:00Z", scheduled_end: "2026-07-01T11:00:00Z", visit_reason: "Dental + surgery" }
              as: Receptionist
              captures: { appt: $.data.id }
            - call: "POST /clinic/appointments/${appt}/transition"
              payload: { action: "check-in" }
              as: Receptionist
            - call: "POST /clinic/appointments/${appt}/transition"
              payload: { action: "begin-exam" }
              as: Veterinarian
            - call: "POST /clinic/surgeries"
              payload: { appointment_id: "${appt}", operatory_id: "${or1}", estimate_id: "${est}", procedure_name: "Dental extraction", window_start: "2026-07-01T09:00:00Z", window_end: "2026-07-01T10:30:00Z" }
              as: Veterinarian
              captures: { sg: $.data.id }
            - call: "POST /clinic/lab-orders"
              payload: { appointment_id: "${appt}", order_type: "DENTAL_XRAY", fee_cents: 8000 }
              as: Veterinarian
              captures: { lo: $.data.id }
            - call: "POST /clinic/surgeries/${sg}/transition"
              payload: { action: "start" }
              as: Veterinarian
            - call: "POST /clinic/surgeries/${sg}/transition"
              payload: { action: "complete" }
              as: Veterinarian
            - call: "POST /clinic/lab-orders/${lo}/transition"
              payload: { action: "collect" }
              as: Veterinarian
            - call: "POST /clinic/lab-orders/${lo}/transition"
              payload: { action: "result", result_text: "Normal" }
              as: Veterinarian
            - call: "POST /clinic/appointments/${appt}/transition"
              payload: { action: "complete" }
              as: Veterinarian
            - call: "GET /clinic/households/${hh}"
              payload: {}
              as: PracticeManager
              captures: { hh_v_now: $.data.version }
          trigger:
            - call: "POST /clinic/invoices"
              payload: { household_id: "${hh}", appointment_id: "${appt}", estimate_id: "${est}", expected_household_version: "${hh_v_now}" }
              as: PracticeManager
              captures: { inv: $.data.id }
          assert:
            - "Invoice.${inv}.estimate_total_cents == 60000"
            - "Invoice.${inv}.actual_total_cents == 10000"
            - "Invoice.${inv}.variance_cents == -50000"

      - name: wellness_projected_vs_realized_savings_divergence
        grounds:
          - calculations.wellness_projected_savings
          - calculations.wellness_realized_savings
          - entities.WellnessPlan.fields.realized_savings_cents
        distinguishing_aspect: |
          Operates on the WellnessPlan LOYALTY/SAVINGS domain (distinct from the billing
          domain above): projected savings assume the full bundle + reference spend (PLUS
          => 30000) while realized savings count only what was actually consumed (one
          bundled vaccine => 4500), so projected != realized on the same plan.
        test_recipe:
          setup:
            - "PLUS plan on a patient; projected savings is the tier formula constant (30000)."
            - "Exactly one bundled vaccination has been administered, accruing 4500 realized savings."
          setup_api_calls:
            - call: "POST /clinic/households"
              payload: { account_name: "Okafor" }
              as: Receptionist
              captures: { hh: $.data.id }
            - call: "POST /clinic/patients"
              payload: { household_id: "${hh}", name: "Milo", species: "CAT", weight_kg: 4 }
              as: Receptionist
              captures: { pat: $.data.id }
            - call: "POST /clinic/wellness-plans"
              payload: { patient_id: "${pat}", tier: "PLUS" }
              as: Receptionist
              captures: { wp: $.data.id }
            - call: "POST /clinic/vaccinations"
              payload: { patient_id: "${pat}", vaccine_code: "FVRCP", administered_at: "2026-06-01T10:00:00Z", bundled: true }
              as: Veterinarian
              captures: { vax: $.data.id }
          trigger:
            - call: "GET /clinic/wellness-plans/${wp}"
              payload: {}
              as: Veterinarian
              captures: { realized: $.data.realized_savings_cents }
          assert:
            - "WellnessPlan.${wp}.realized_savings_cents == 4500"
            - "WellnessPlan.${wp}.bundled_vaccines_remaining == 3"
            - "the projected-savings figure for this PLUS plan is 30000, which differs from realized 4500"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: estimate_rounding_order_per_line_then_sum
        grounds:
          - calculations.estimate_projected_total
          - entities.Estimate.fields.estimated_total_cents
          - entities.WellnessPlan.fields.service_discount_pct
        distinguishing_aspect: |
          Mode (b) nested-rounding-order: three eligible lines each gross 2505 under a BASIC
          plan (0.10). Round-per-line discount = 251 each (round_half_up of 250.5) -> net
          6762; sum-then-round would give 6763. The scaffold pins round-PER-LINE-then-sum, so
          estimated_total_cents == 6762.
        test_recipe:
          setup:
            - "BASIC plan (0.10) on a patient; an estimate with 3 eligible lines each gross 2505."
          setup_api_calls:
            - call: "POST /clinic/households"
              payload: { account_name: "Lind" }
              as: Receptionist
              captures: { hh: $.data.id }
            - call: "POST /clinic/patients"
              payload: { household_id: "${hh}", name: "Bo", species: "DOG", weight_kg: 8 }
              as: Receptionist
              captures: { pat: $.data.id }
            - call: "POST /clinic/wellness-plans"
              payload: { patient_id: "${pat}", tier: "BASIC" }
              as: Receptionist
              captures: { wp: $.data.id }
            - call: "POST /clinic/estimates"
              payload: { patient_id: "${pat}", line_items: [ { service_code: "A", qty: 1, unit_price_cents: 2505, eligible_for_plan_discount: true }, { service_code: "B", qty: 1, unit_price_cents: 2505, eligible_for_plan_discount: true }, { service_code: "C", qty: 1, unit_price_cents: 2505, eligible_for_plan_discount: true } ] }
              as: Veterinarian
              captures: { est: $.data.id }
          trigger:
            - call: "POST /clinic/estimates/${est}/transition"
              payload: { action: "present" }
              as: Veterinarian
              captures: { total: $.data.estimated_total_cents }
          assert:
            - "Estimate.${est}.estimated_total_cents == 6762"

      - name: surgery_total_tiered_three_input_nonlinear
        grounds:
          - calculations.surgery_total
          - entities.Surgery.fields.surgery_total_cents
          - entities.Patient.fields.weight_kg
        distinguishing_aspect: |
          Mode (a) >=3-input non-linear formula: base 20000 + weight-band-tiered anesthesia
          (12.5kg -> MEDIUM rate 600 -> 7500) + operatory-time surcharge (90 min - 60 free =
          30 * 150 = 4500), clamped to [25000,500000] -> surgery_total_cents == 32000. Three
          inputs (procedure base, patient weight band, window minutes) interact non-linearly.
        test_recipe:
          setup:
            - "Operatory with 30-min buffer; patient weight 12.5kg (MEDIUM band)."
            - "Approved estimate funding the surgery; appointment in IN_EXAM; surgery booked over a 90-minute window."
          setup_api_calls:
            - call: "POST /clinic/operatories"
              payload: { name: "OR-2", cleanup_buffer_minutes: 30 }
              as: PracticeManager
              captures: { or2: $.data.id }
            - call: "POST /clinic/households"
              payload: { account_name: "Pham" }
              as: Receptionist
              captures: { hh: $.data.id, hh_v0: $.data.version }
            - call: "POST /clinic/patients"
              payload: { household_id: "${hh}", name: "Zora", species: "DOG", weight_kg: 12.5 }
              as: Receptionist
              captures: { pat: $.data.id }
            - call: "POST /clinic/estimates"
              payload: { patient_id: "${pat}", line_items: [ { service_code: "SURG", qty: 1, unit_price_cents: 32000, eligible_for_plan_discount: false } ], deposit_required_cents: 0 }
              as: Veterinarian
              captures: { est: $.data.id }
            - call: "POST /clinic/estimates/${est}/transition"
              payload: { action: "present" }
              as: Veterinarian
            - call: "POST /clinic/estimates/${est}/transition"
              payload: { action: "approve" }
              as: Receptionist
            - call: "POST /clinic/appointments"
              payload: { patient_id: "${pat}", scheduled_start: "2026-07-02T09:00:00Z", scheduled_end: "2026-07-02T12:00:00Z", visit_reason: "Surgery" }
              as: Receptionist
              captures: { appt: $.data.id }
            - call: "POST /clinic/appointments/${appt}/transition"
              payload: { action: "check-in" }
              as: Receptionist
            - call: "POST /clinic/appointments/${appt}/transition"
              payload: { action: "begin-exam" }
              as: Veterinarian
          trigger:
            - call: "POST /clinic/surgeries"
              payload: { appointment_id: "${appt}", operatory_id: "${or2}", estimate_id: "${est}", procedure_name: "Spay", window_start: "2026-07-02T09:00:00Z", window_end: "2026-07-02T10:30:00Z" }
              as: Veterinarian
              captures: { sg: $.data.id }
          assert:
            - "Surgery.${sg}.surgery_total_cents == 32000"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: appointment_reschedule_cycle_in_exam_back_to_scheduled
        grounds:
          - state_machines.Appointment.IN_EXAM_to_SCHEDULED
          - entities.Appointment.fields.reschedule_count
          - entities.Appointment.fields.status
        distinguishing_aspect: |
          CYCLE on the Appointment entity: IN_EXAM -> SCHEDULED returns to a prior state
          (revision loop) and increments reschedule_count; not a forward-only pipeline.
        test_recipe:
          setup:
            - "An appointment driven SCHEDULED -> CHECKED_IN -> IN_EXAM."
          setup_api_calls:
            - call: "POST /clinic/households"
              payload: { account_name: "Singh" }
              as: Receptionist
              captures: { hh: $.data.id }
            - call: "POST /clinic/patients"
              payload: { household_id: "${hh}", name: "Ace", species: "DOG", weight_kg: 20 }
              as: Receptionist
              captures: { pat: $.data.id }
            - call: "POST /clinic/appointments"
              payload: { patient_id: "${pat}", scheduled_start: "2026-07-03T09:00:00Z", scheduled_end: "2026-07-03T10:00:00Z", visit_reason: "Wellness" }
              as: Receptionist
              captures: { appt: $.data.id }
            - call: "POST /clinic/appointments/${appt}/transition"
              payload: { action: "check-in" }
              as: Receptionist
            - call: "POST /clinic/appointments/${appt}/transition"
              payload: { action: "begin-exam" }
              as: Veterinarian
          trigger:
            - call: "POST /clinic/appointments/${appt}/transition"
              payload: { action: "reschedule", scheduled_start: "2026-07-10T09:00:00Z", scheduled_end: "2026-07-10T10:00:00Z" }
              as: Veterinarian
              captures: { st: $.data.status }
          assert:
            - "Appointment.${appt}.status == SCHEDULED"
            - "Appointment.${appt}.reschedule_count == 1"
            - "Appointment.${appt}.scheduled_start == 2026-07-10T09:00:00Z"

      - name: estimate_decline_revise_cycle_back_to_draft
        grounds:
          - state_machines.Estimate.DECLINED_to_DRAFT
          - entities.Estimate.fields.revision
          - entities.Estimate.fields.status
        distinguishing_aspect: |
          CYCLE on a DIFFERENT entity (Estimate): PRESENTED -> DECLINED -> DRAFT is a revision
          loop that increments revision and replaces line_items; distinct entity from the
          Appointment cycle above.
        test_recipe:
          setup:
            - "An estimate driven DRAFT -> PRESENTED -> DECLINED."
          setup_api_calls:
            - call: "POST /clinic/households"
              payload: { account_name: "Vidal" }
              as: Receptionist
              captures: { hh: $.data.id }
            - call: "POST /clinic/patients"
              payload: { household_id: "${hh}", name: "Kit", species: "CAT", weight_kg: 5 }
              as: Receptionist
              captures: { pat: $.data.id }
            - call: "POST /clinic/estimates"
              payload: { patient_id: "${pat}", line_items: [ { service_code: "X", qty: 1, unit_price_cents: 10000, eligible_for_plan_discount: false } ] }
              as: Veterinarian
              captures: { est: $.data.id }
            - call: "POST /clinic/estimates/${est}/transition"
              payload: { action: "present" }
              as: Veterinarian
            - call: "POST /clinic/estimates/${est}/transition"
              payload: { action: "decline" }
              as: Receptionist
          trigger:
            - call: "POST /clinic/estimates/${est}/transition"
              payload: { action: "revise", line_items: [ { service_code: "Y", qty: 2, unit_price_cents: 7000, eligible_for_plan_discount: false } ] }
              as: Veterinarian
              captures: { st: $.data.status }
          assert:
            - "Estimate.${est}.status == DRAFT"
            - "Estimate.${est}.revision == 2"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: appointment_cancel_cascades_surgery_operatory_and_deposit_refund
        grounds:
          - state_machines.Appointment.SCHEDULED_to_CANCELLED
          - state_machines.Surgery.BOOKED_to_CANCELLED
          - entities.Operatory.fields.booked_minutes
          - entities.Household.fields.account_credit_cents
        distinguishing_aspect: |
          Depth-3 cascade from the Appointment-cancel trigger: cancel Appointment (A) ->
          cancels child Surgery (B); that Surgery cancellation (B) releases Operatory
          booked_minutes (C); and the same Surgery cancellation refunds deposit_consumed
          back to the Household credit and bumps Household.version (C'). Each hop is caused
          by the prior hop, not directly by the cancel.
        test_recipe:
          setup:
            - "Operatory OR; patient; approved estimate with 30000 deposit posted (credit 30000)."
            - "Appointment IN_EXAM with a BOOKED surgery (10kg/60min -> total 26000); deposit committed at booking so deposit_consumed == 26000, Household credit == 30000 - 26000 = 4000, operatory booked_minutes == 60 from the 60-min window."
          setup_api_calls:
            - call: "POST /clinic/operatories"
              payload: { name: "OR-3", cleanup_buffer_minutes: 30 }
              as: PracticeManager
              captures: { or3: $.data.id }
            - call: "POST /clinic/households"
              payload: { account_name: "Brar" }
              as: Receptionist
              captures: { hh: $.data.id, hh_v0: $.data.version }
            - call: "POST /clinic/patients"
              payload: { household_id: "${hh}", name: "Duke", species: "DOG", weight_kg: 10 }
              as: Receptionist
              captures: { pat: $.data.id }
            - call: "POST /clinic/estimates"
              payload: { patient_id: "${pat}", line_items: [ { service_code: "SURG", qty: 1, unit_price_cents: 26000, eligible_for_plan_discount: false } ], deposit_required_cents: 30000 }
              as: Veterinarian
              captures: { est: $.data.id }
            - call: "POST /clinic/deposits"
              payload: { household_id: "${hh}", amount_cents: 30000, estimate_id: "${est}", expected_household_version: "${hh_v0}" }
              as: Receptionist
              captures: { hh_v1: $.data.version }
            - call: "POST /clinic/estimates/${est}/transition"
              payload: { action: "present" }
              as: Veterinarian
            - call: "POST /clinic/estimates/${est}/transition"
              payload: { action: "approve" }
              as: Receptionist
            - call: "POST /clinic/appointments"
              payload: { patient_id: "${pat}", scheduled_start: "2026-07-04T09:00:00Z", scheduled_end: "2026-07-04T11:00:00Z", visit_reason: "Surgery" }
              as: Receptionist
              captures: { appt: $.data.id }
            - call: "POST /clinic/appointments/${appt}/transition"
              payload: { action: "check-in" }
              as: Receptionist
            - call: "POST /clinic/appointments/${appt}/transition"
              payload: { action: "begin-exam" }
              as: Veterinarian
            - call: "POST /clinic/surgeries"
              payload: { appointment_id: "${appt}", operatory_id: "${or3}", estimate_id: "${est}", procedure_name: "Neuter", window_start: "2026-07-04T09:00:00Z", window_end: "2026-07-04T10:00:00Z" }
              as: Veterinarian
              captures: { sg: $.data.id }
          trigger:
            - call: "POST /clinic/appointments/${appt}/transition"
              payload: { action: "cancel" }
              as: Receptionist
              captures: { st: $.data.status }
          assert:
            - "Appointment.${appt}.status == CANCELLED"
            - "Surgery.${sg}.status == CANCELLED"
            - "Operatory.${or3}.booked_minutes == 0"
            - "Household.${hh}.account_credit_cents == 30000"
            - "Surgery.${sg}.deposit_consumed_cents == 0"

      - name: patient_deceased_cascades_prescription_void_and_boarding_cancel
        grounds:
          - state_machines.Patient.ACTIVE_to_DECEASED
          - state_machines.Prescription.status
          - state_machines.BoardingStay.status
          - entities.Prescription.fields.refills_used
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (Patient mark-deceased): mark patient
          DECEASED (A) -> every ACTIVE Prescription -> VOIDED (B), and each voided controlled
          Rx restores refills_used to 0 (B'); plus RESERVED boarding -> CANCELLED with kennel
          release. Distinct propagation pattern and distinct triggering transition from the
          appointment-cancel cascade.
        test_recipe:
          setup:
            - "Patient with one ACTIVE controlled Prescription (1 of 3 refills already used) and one RESERVED boarding stay."
          setup_api_calls:
            - call: "POST /clinic/kennels"
              payload: { name: "K-1", capacity: 2 }
              as: PracticeManager
              captures: { ken: $.data.id }
            - call: "POST /clinic/households"
              payload: { account_name: "Mora" }
              as: Receptionist
              captures: { hh: $.data.id }
            - call: "POST /clinic/patients"
              payload: { household_id: "${hh}", name: "Old Tom", species: "CAT", weight_kg: 6 }
              as: Receptionist
              captures: { pat: $.data.id }
            - call: "POST /clinic/prescriptions"
              payload: { patient_id: "${pat}", drug_name: "Gabapentin", refills_authorized: 3, is_controlled: true }
              as: Veterinarian
              captures: { rx: $.data.id }
            - call: "POST /clinic/prescriptions/${rx}/refill"
              payload: {}
              as: Veterinarian
            - call: "POST /clinic/boarding-stays"
              payload: { patient_id: "${pat}", kennel_id: "${ken}", check_in_date: "2026-07-05T00:00:00Z", check_out_date: "2026-07-07T00:00:00Z", nightly_rate_cents: 5000 }
              as: Receptionist
              captures: { bs: $.data.id }
          trigger:
            - call: "POST /clinic/patients/${pat}/mark-deceased"
              payload: {}
              as: Veterinarian
              captures: { st: $.data.status }
          assert:
            - "Patient.${pat}.status == DECEASED"
            - "Prescription.${rx}.status == VOIDED"
            - "Prescription.${rx}.refills_used == 0"
            - "BoardingStay.${bs}.status == CANCELLED"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: surgery_state_precondition_beats_deposit_fiscal_check
        grounds:
          - validations[priority=6]
          - validations[priority=13]
          - state_machines.Surgery.BOOKED_to_IN_PROGRESS
        distinguishing_aspect: |
          Error-category pair STATE (priority 6) vs BUSINESS_FISCAL (priority 13): an
          estimate-approve attempt on a NON-PRESENTED estimate that ALSO has an unmet deposit
          fails with the state error ERR_ESTIMATE_INVALID_STATE (priority 6), not the fiscal
          ERR_DEPOSIT_NOT_MET (priority 13).
        test_recipe:
          setup:
            - "An estimate still in DRAFT (never presented) with deposit_required 50000 and 0 posted — both the state check and the fiscal check would fail."
          setup_api_calls:
            - call: "POST /clinic/households"
              payload: { account_name: "Yu" }
              as: Receptionist
              captures: { hh: $.data.id }
            - call: "POST /clinic/patients"
              payload: { household_id: "${hh}", name: "Nina", species: "DOG", weight_kg: 9 }
              as: Receptionist
              captures: { pat: $.data.id }
            - call: "POST /clinic/estimates"
              payload: { patient_id: "${pat}", line_items: [ { service_code: "Z", qty: 1, unit_price_cents: 50000, eligible_for_plan_discount: false } ], deposit_required_cents: 50000 }
              as: Veterinarian
              captures: { est: $.data.id }
          trigger:
            - call: "POST /clinic/estimates/${est}/transition"
              payload: { action: "approve" }
              as: Receptionist
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ESTIMATE_INVALID_STATE"
            - "http_status == 409"

      - name: vaccine_safety_interval_beats_kennel_temporal_unrelated_path
        grounds:
          - validations[priority=8]
          - validations[priority=12]
          - errors[ERR_VACCINE_INTERVAL]
          - errors[ERR_KENNEL_AT_CAPACITY]
        distinguishing_aspect: |
          Error-category pair BUSINESS_SAFETY (priority 8, vaccine interval) vs
          BUSINESS_TEMPORAL (priority 12, kennel capacity) — a DIFFERENT pairing from the
          state/fiscal conflict above. On the vaccination endpoint the safety interval check
          is the only business rule that fires; a same-code RABIES dose 1 day after the prior
          dose is rejected with ERR_VACCINE_INTERVAL (422), independent of any temporal rule.
        test_recipe:
          setup:
            - "A patient with a prior RABIES dose administered 2025-06-01; a second RABIES dose attempted 2025-06-02 (1 day later, well under the 365-day interval)."
          setup_api_calls:
            - call: "POST /clinic/households"
              payload: { account_name: "Reed" }
              as: Receptionist
              captures: { hh: $.data.id }
            - call: "POST /clinic/patients"
              payload: { household_id: "${hh}", name: "Bolt", species: "DOG", weight_kg: 18 }
              as: Receptionist
              captures: { pat: $.data.id }
            - call: "POST /clinic/vaccinations"
              payload: { patient_id: "${pat}", vaccine_code: "RABIES", administered_at: "2025-06-01T10:00:00Z" }
              as: Veterinarian
              captures: { vax1: $.data.id }
          trigger:
            - call: "POST /clinic/vaccinations"
              payload: { patient_id: "${pat}", vaccine_code: "RABIES", administered_at: "2025-06-02T10:00:00Z" }
              as: Veterinarian
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VACCINE_INTERVAL"
            - "http_status == 422"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: vaccine_interval_exact_boundary_allows_equal_days
        grounds:
          - calculations.vaccine_next_due
          - validations[priority=8]
          - entities.Vaccination.fields.administered_at
        distinguishing_aspect: |
          NUMERIC-THRESHOLD boundary on the vaccination endpoint: a same-code RABIES dose at
          EXACTLY 365 days after the prior dose (2025-06-01 -> 2026-06-01) is ALLOWED (>=
          passes); 364 days would be rejected. Tests the == interval edge.
        test_recipe:
          setup:
            - "Prior RABIES dose 2025-06-01; new dose exactly 365 days later 2026-06-01."
          setup_api_calls:
            - call: "POST /clinic/households"
              payload: { account_name: "Cole" }
              as: Receptionist
              captures: { hh: $.data.id }
            - call: "POST /clinic/patients"
              payload: { household_id: "${hh}", name: "Sky", species: "DOG", weight_kg: 22 }
              as: Receptionist
              captures: { pat: $.data.id }
            - call: "POST /clinic/vaccinations"
              payload: { patient_id: "${pat}", vaccine_code: "RABIES", administered_at: "2025-06-01T10:00:00Z" }
              as: Veterinarian
              captures: { vax1: $.data.id }
          trigger:
            - call: "POST /clinic/vaccinations"
              payload: { patient_id: "${pat}", vaccine_code: "RABIES", administered_at: "2026-06-01T10:00:00Z" }
              as: Veterinarian
              captures: { vax2: $.data.id }
          assert:
            - "Vaccination.${vax2} created with HTTP 201"
            - "Vaccination.${vax2}.next_due_at == 2027-06-01T10:00:00Z"

      - name: invoice_empty_billable_set_rejected
        grounds:
          - validations[priority=14]
          - errors[ERR_NO_BILLABLE_ITEMS]
          - calculations.invoice_actual_total
        distinguishing_aspect: |
          EMPTY-COLLECTION boundary on a DIFFERENT endpoint (POST /clinic/invoices): a
          COMPLETED appointment with zero rendered billable items (no administered vaccine,
          no RESULTED lab, no DONE surgery) yields an empty actual set and is rejected with
          ERR_NO_BILLABLE_ITEMS (422) — distinct metric (set emptiness) from the numeric
          interval boundary above.
        test_recipe:
          setup:
            - "An appointment driven SCHEDULED -> CHECKED_IN -> IN_EXAM -> COMPLETED with no lab orders, surgeries, or vaccinations attached."
          setup_api_calls:
            - call: "POST /clinic/households"
              payload: { account_name: "Frost" }
              as: Receptionist
              captures: { hh: $.data.id, hh_v0: $.data.version }
            - call: "POST /clinic/patients"
              payload: { household_id: "${hh}", name: "Pip", species: "RABBIT", weight_kg: 2 }
              as: Receptionist
              captures: { pat: $.data.id }
            - call: "POST /clinic/appointments"
              payload: { patient_id: "${pat}", scheduled_start: "2026-07-06T09:00:00Z", scheduled_end: "2026-07-06T09:30:00Z", visit_reason: "Check" }
              as: Receptionist
              captures: { appt: $.data.id }
            - call: "POST /clinic/appointments/${appt}/transition"
              payload: { action: "check-in" }
              as: Receptionist
            - call: "POST /clinic/appointments/${appt}/transition"
              payload: { action: "begin-exam" }
              as: Veterinarian
            - call: "POST /clinic/appointments/${appt}/transition"
              payload: { action: "complete" }
              as: Veterinarian
          trigger:
            - call: "POST /clinic/invoices"
              payload: { household_id: "${hh}", appointment_id: "${appt}", expected_household_version: "${hh_v0}" }
              as: PracticeManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NO_BILLABLE_ITEMS"
            - "http_status == 422"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: surgery_start_requires_appointment_in_exam
        grounds:
          - state_machines.Surgery.BOOKED_to_IN_PROGRESS
          - entities.Appointment.fields.status
          - errors[ERR_APPOINTMENT_NOT_IN_EXAM]
        distinguishing_aspect: |
          Entity pair Surgery->Appointment: a surgery may be BOOKED while its parent
          Appointment is only CHECKED_IN (booking has no IN_EXAM precondition), but START
          (BOOKED -> IN_PROGRESS) requires the parent Appointment to be IN_EXAM. Attempting
          start while the appointment is still CHECKED_IN is rejected with
          ERR_APPOINTMENT_NOT_IN_EXAM — the surgery's own state is valid (BOOKED), so the
          rejection comes purely from the sibling Appointment's state.
        test_recipe:
          setup:
            - "Approved estimate; appointment driven to CHECKED_IN (NOT begin-exam); a surgery BOOKED on it; the appointment is therefore CHECKED_IN, not IN_EXAM, at start time."
          setup_api_calls:
            - call: "POST /clinic/operatories"
              payload: { name: "OR-4", cleanup_buffer_minutes: 30 }
              as: PracticeManager
              captures: { or4: $.data.id }
            - call: "POST /clinic/households"
              payload: { account_name: "Otto" }
              as: Receptionist
              captures: { hh: $.data.id }
            - call: "POST /clinic/patients"
              payload: { household_id: "${hh}", name: "Gus", species: "DOG", weight_kg: 14 }
              as: Receptionist
              captures: { pat: $.data.id }
            - call: "POST /clinic/estimates"
              payload: { patient_id: "${pat}", line_items: [ { service_code: "SURG", qty: 1, unit_price_cents: 30000, eligible_for_plan_discount: false } ], deposit_required_cents: 0 }
              as: Veterinarian
              captures: { est: $.data.id }
            - call: "POST /clinic/estimates/${est}/transition"
              payload: { action: "present" }
              as: Veterinarian
            - call: "POST /clinic/estimates/${est}/transition"
              payload: { action: "approve" }
              as: Receptionist
            - call: "POST /clinic/appointments"
              payload: { patient_id: "${pat}", scheduled_start: "2026-07-07T09:00:00Z", scheduled_end: "2026-07-07T11:00:00Z", visit_reason: "Surgery" }
              as: Receptionist
              captures: { appt: $.data.id }
            - call: "POST /clinic/appointments/${appt}/transition"
              payload: { action: "check-in" }
              as: Receptionist
            - call: "POST /clinic/surgeries"
              payload: { appointment_id: "${appt}", operatory_id: "${or4}", estimate_id: "${est}", procedure_name: "Mass removal", window_start: "2026-07-07T09:00:00Z", window_end: "2026-07-07T10:00:00Z" }
              as: Veterinarian
              captures: { sg: $.data.id }
          trigger:
            - call: "POST /clinic/surgeries/${sg}/transition"
              payload: { action: "start" }
              as: Veterinarian
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_APPOINTMENT_NOT_IN_EXAM"
            - "http_status == 409"
            - "Surgery.${sg}.status == BOOKED (unchanged)"

      - name: prescription_refill_requires_patient_active
        grounds:
          - validations[priority=7]
          - entities.Patient.fields.status
          - errors[ERR_PATIENT_NOT_ACTIVE]
          - state_machines.Patient.ACTIVE_to_INACTIVE
        distinguishing_aspect: |
          DIFFERENT entity pair Prescription->Patient: refilling an ACTIVE prescription whose
          patient has been deactivated (INACTIVE) is rejected with ERR_PATIENT_NOT_ACTIVE —
          a distinct cross-entity relationship from Surgery->Appointment.
        test_recipe:
          setup:
            - "An ACTIVE prescription on a patient that is then deactivated to INACTIVE (patient has no open visits)."
          setup_api_calls:
            - call: "POST /clinic/households"
              payload: { account_name: "Dey" }
              as: Receptionist
              captures: { hh: $.data.id }
            - call: "POST /clinic/patients"
              payload: { household_id: "${hh}", name: "Rua", species: "CAT", weight_kg: 5 }
              as: Receptionist
              captures: { pat: $.data.id }
            - call: "POST /clinic/prescriptions"
              payload: { patient_id: "${pat}", drug_name: "Amoxicillin", refills_authorized: 2, is_controlled: false }
              as: Veterinarian
              captures: { rx: $.data.id }
            - call: "POST /clinic/patients/${pat}/deactivate"
              payload: {}
              as: Receptionist
          trigger:
            - call: "POST /clinic/prescriptions/${rx}/refill"
              payload: {}
              as: Veterinarian
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PATIENT_NOT_ACTIVE"
            - "http_status == 409"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: operatory_halfopen_plus_buffer_overlap
        grounds:
          - validations[priority=11]
          - entities.Operatory.fields.cleanup_buffer_minutes
          - errors[ERR_OPERATORY_CONFLICT]
        distinguishing_aspect: |
          BUFFER interval semantics on the Operatory resource: surgery A 09:00-10:00 reserves
          the suite through 10:30 (60-min window + 30-min cleanup buffer). A second surgery at
          10:15-11:00 overlaps the buffer and is rejected with ERR_OPERATORY_CONFLICT, even
          though the raw windows [10:15,11:00) do not touch [09:00,10:00).
        test_recipe:
          setup:
            - "Operatory with 30-min buffer; surgery A booked 09:00-10:00 over an IN_EXAM appointment; a second IN_EXAM appointment for another patient ready to book 10:15-11:00 in the same operatory."
          setup_api_calls:
            - call: "POST /clinic/operatories"
              payload: { name: "OR-5", cleanup_buffer_minutes: 30 }
              as: PracticeManager
              captures: { or5: $.data.id }
            - call: "POST /clinic/households"
              payload: { account_name: "Hale" }
              as: Receptionist
              captures: { hh: $.data.id }
            - call: "POST /clinic/patients"
              payload: { household_id: "${hh}", name: "P1", species: "DOG", weight_kg: 10 }
              as: Receptionist
              captures: { pat1: $.data.id }
            - call: "POST /clinic/patients"
              payload: { household_id: "${hh}", name: "P2", species: "DOG", weight_kg: 10 }
              as: Receptionist
              captures: { pat2: $.data.id }
            - call: "POST /clinic/estimates"
              payload: { patient_id: "${pat1}", line_items: [ { service_code: "S", qty: 1, unit_price_cents: 30000, eligible_for_plan_discount: false } ], deposit_required_cents: 0 }
              as: Veterinarian
              captures: { est1: $.data.id }
            - call: "POST /clinic/estimates/${est1}/transition"
              payload: { action: "present" }
              as: Veterinarian
            - call: "POST /clinic/estimates/${est1}/transition"
              payload: { action: "approve" }
              as: Receptionist
            - call: "POST /clinic/estimates"
              payload: { patient_id: "${pat2}", line_items: [ { service_code: "S", qty: 1, unit_price_cents: 30000, eligible_for_plan_discount: false } ], deposit_required_cents: 0 }
              as: Veterinarian
              captures: { est2: $.data.id }
            - call: "POST /clinic/estimates/${est2}/transition"
              payload: { action: "present" }
              as: Veterinarian
            - call: "POST /clinic/estimates/${est2}/transition"
              payload: { action: "approve" }
              as: Receptionist
            - call: "POST /clinic/appointments"
              payload: { patient_id: "${pat1}", scheduled_start: "2026-07-08T08:00:00Z", scheduled_end: "2026-07-08T12:00:00Z", visit_reason: "Surgery1" }
              as: Receptionist
              captures: { appt1: $.data.id }
            - call: "POST /clinic/appointments/${appt1}/transition"
              payload: { action: "check-in" }
              as: Receptionist
            - call: "POST /clinic/appointments/${appt1}/transition"
              payload: { action: "begin-exam" }
              as: Veterinarian
            - call: "POST /clinic/surgeries"
              payload: { appointment_id: "${appt1}", operatory_id: "${or5}", estimate_id: "${est1}", procedure_name: "A", window_start: "2026-07-08T09:00:00Z", window_end: "2026-07-08T10:00:00Z" }
              as: Veterinarian
              captures: { sgA: $.data.id }
            - call: "POST /clinic/appointments"
              payload: { patient_id: "${pat2}", scheduled_start: "2026-07-08T08:00:00Z", scheduled_end: "2026-07-08T12:00:00Z", visit_reason: "Surgery2" }
              as: Receptionist
              captures: { appt2: $.data.id }
            - call: "POST /clinic/appointments/${appt2}/transition"
              payload: { action: "check-in" }
              as: Receptionist
            - call: "POST /clinic/appointments/${appt2}/transition"
              payload: { action: "begin-exam" }
              as: Veterinarian
          trigger:
            - call: "POST /clinic/surgeries"
              payload: { appointment_id: "${appt2}", operatory_id: "${or5}", estimate_id: "${est2}", procedure_name: "B", window_start: "2026-07-08T10:15:00Z", window_end: "2026-07-08T11:00:00Z" }
              as: Veterinarian
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_OPERATORY_CONFLICT"
            - "http_status == 409"

      - name: kennel_aggregate_capacity_overlap
        grounds:
          - validations[priority=12]
          - entities.Kennel.fields.capacity
          - errors[ERR_KENNEL_AT_CAPACITY]
        distinguishing_aspect: |
          AGGREGATE-CAPACITY interval semantics on a DIFFERENT resource (Kennel): unlike the
          operatory's exclusive buffer geometry, the kennel allows up to capacity overlapping
          stays per inclusive day. With capacity 2 and two overlapping stays already covering
          2026-07-12, a third stay covering that day pushes the count to 3 > 2 and is rejected
          with ERR_KENNEL_AT_CAPACITY.
        test_recipe:
          setup:
            - "Kennel capacity 2; two RESERVED stays both covering 2026-07-12 (stay1 07-11..07-13, stay2 07-12..07-14)."
          setup_api_calls:
            - call: "POST /clinic/kennels"
              payload: { name: "K-2", capacity: 2 }
              as: PracticeManager
              captures: { ken: $.data.id }
            - call: "POST /clinic/households"
              payload: { account_name: "Ives" }
