              captures: { cs1: $.data.id }
          trigger:
            - call: "POST /episodes/${ep_id}/companion-shifts"
              payload: { clinician_id: "${hha_id}", shift_start: "2026-02-03T14:15:00Z", shift_end: "2026-02-03T15:00:00Z" }
