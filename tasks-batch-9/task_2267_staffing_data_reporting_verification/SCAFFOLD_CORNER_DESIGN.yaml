              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-01"
          assert:
            - "ReportingPeriod.${per}.status == CLOSED"
            - "QuarterlySubmission.${sub}.status == VOID, not FINAL, because it was never accepted"
            - "Facility.${fac}.outstanding_surcharge_cents == 0, since VOID submissions are excluded from the sum"
            - "a subsequent POST /hour-entries against ${sub} returns 409 ERR_PERIOD_CLOSED"

  - section: calculations
    instances:
      - name: hprd_correct_result_with_split_role_credit_and_weekend_split
        claim_type: correct_result
        grounds:
          - calculations.hprd_reconciliation
          - calculations.hour_entry_classification
        distinguishing_aspect: "Two entries with different direct-care credits over two census days produce hand-computable hprd values, and the weekend metric divides only the Saturday hours by only the Saturday resident days."
        test_recipe:
