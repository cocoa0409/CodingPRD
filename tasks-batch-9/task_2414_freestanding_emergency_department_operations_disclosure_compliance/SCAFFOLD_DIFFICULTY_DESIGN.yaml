        grounds:
          - state_machines.Encounter.OBSERVATION_to_TRANSFER_PENDING
          - state_machines.Encounter.TRANSFER_PENDING_to_OBSERVATION
          - state_machines.Encounter.DISCLOSURE_PRESENTED_to_DISCLOSURE_ACKNOWLEDGED
          - entities.Encounter.fields.observation_bed_held
        distinguishing_aspect: |
          Encounter carries two independent dimensions and a cycle: clinical_state walks
          OBSERVATION -> TRANSFER_PENDING -> OBSERVATION on a declined transfer while
          disclosure_state stays DISCLOSURE_ACKNOWLEDGED throughout and the observation bed is
          never released, so the cycle is observable as a returned clinical_state with an
          unchanged disclosure dimension and an unchanged bed count.
