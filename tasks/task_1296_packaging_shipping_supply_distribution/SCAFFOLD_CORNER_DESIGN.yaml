  # ==================================================================
  # Section: validations
  # ==================================================================
  - section: validations
    instances:
      - name: error_case_qty_mismatch_on_case_uom
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_CASE_QTY_MISMATCH]
        distinguishing_aspect: "Line qty 7 on a CASE product with case_qty 5 -> ERR_CASE_QTY_MISMATCH; qty 10 (multiple) succeeds."
        test_recipe:
          setup: ["warehouse ATL; account; CASE product case_qty 5 inventory 100; DRAFT order"]
          setup_api_calls:
            - call: "POST /packaging-distribution/warehouses"
              payload: { code: "ATL", name: "Atlanta DC", zone: 2, ship_cutoff_time: "15:00", timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { wh_atl: $.data.id }
            - call: "POST /packaging-distribution/accounts"
              payload: { company_name: "Acme Corp", account_type: "CORPORATE", credit_limit_cents: 100000000, default_warehouse_code: "ATL" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /packaging-distribution/products"
              payload: { sku: "M-1", name: "M", category: "TAPE", base_price_cents: 100, uom: "CASE", case_qty: 5, pallet_qty: 50, weight_lbs_per_unit: 5, density_pcf: 20 }
              as: CatalogManager
              captures: { prod: $.data.id }
            - call: "POST /packaging-distribution/inventory"
              payload: { product_id: "${prod}", warehouse_id: "${wh_atl}", on_hand_qty: 100 }
              as: WarehouseOps
            - call: "POST /packaging-distribution/orders"
              payload: { account_id: "${acct}", ship_zone: 5 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { ord: $.data.id }
          trigger:
            - call: "POST /packaging-distribution/orders/${ord}/lines"
              payload: { product_id: "${prod}", qty: 7 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { err_1: $.data.error_id }
            - call: "POST /packaging-distribution/orders/${ord}/lines"
              payload: { product_id: "${prod}", qty: 10 }
              as: Buyer
              as_user_id: "${acct}"
