        grounds:
          - state_machines.Barrel.AGING_to_DESTROYED
          - calculations.proof_gallon_ledger
          - entities.Distillery.fields.total_gauged_pg
        distinguishing_aspect: "Conserved quantity = total_gauged_pg (proof gallons): filling 50.0 pg then dumping (0 months aged) leaves production/storage/processing at 0 and destroyed_losses_pg 50.0, with total_gauged_pg unchanged at 50.0."
        test_recipe:
          setup:
            - "A GAUGED run of 50.0 pg with one AGING barrel filled to 50.0 pg; clock at default 2026-05-01 (0 months aged)."
          setup_api_calls:
            - { call: "POST /dsp/distilleries", payload: { name: "Bench DSP", dsp_permit_number: "DSP-CA-18", state_code: "CA" }, as: ComplianceOfficer, captures: { dist_id: $.data.id } }
            - { call: "POST /dsp/mash-batches", payload: { distillery_id: "${dist_id}", grain_bill: "corn", volume_gallons: 200 }, as: ProductionManager, captures: { mb: $.data.id } }
            - { call: "POST /dsp/distillation-runs", payload: { distillery_id: "${dist_id}", mash_batch_id: "${mb}", spirit_type: "WHISKEY", gauge_method: "VOLUME", collected_wine_gallons: 50, collected_proof: 100 }, as: ProductionManager, captures: { run: $.data.id } }
            - { call: "POST /dsp/distillation-runs/${run}/gauge", payload: {}, as: ProductionManager }
            - { call: "POST /dsp/barrels", payload: { distillation_run_id: "${run}", char_level: "CHAR_3", rickhouse_position: "A-1", fill_proof_gallons: 50 }, as: ProductionManager, captures: { barrel: $.data.id } }
          trigger:
            - { call: "POST /dsp/barrels/${barrel}/dump", payload: {}, as: ProductionManager }
          assert:
            - "Distillery.${dist_id}.total_gauged_pg == 50.0"
            - "Distillery.${dist_id}.production_account_pg == 0"
            - "Distillery.${dist_id}.storage_account_pg == 0"
            - "Distillery.${dist_id}.destroyed_losses_pg == 50.0"
            - "Distillery.${dist_id}.bonded_total_pg == 0"

      - name: case_inventory_conservation_pay_then_cancel
        grounds:
          - state_machines.SalesOrder.payment=UNPAID_to_payment=PAID
          - state_machines.SalesOrder."fulfillment in {PENDING, ALLOCATED}_to_fulfillment=CANCELLED"
          - entities.BottlingRun.fields.cases_available
        distinguishing_aspect: "Conserved quantity = total cases: paying (reserve 4) then cancelling (release 4) returns cases_available to 10 with cases_reserved 0, so available+reserved+shipped+removed == cases_bottled holds."
        test_recipe:
          setup:
            - "A COMPLETED 10-case run; an age-verified customer; a PAID/ALLOCATED THREE_TIER order for 4 cases (cases_available 6, cases_reserved 4)."
          setup_api_calls:
            - { call: "POST /dsp/distilleries", payload: { name: "Bench DSP", dsp_permit_number: "DSP-CA-19", state_code: "CA" }, as: ComplianceOfficer, captures: { dist_id: $.data.id } }
            - { call: "POST /dsp/mash-batches", payload: { distillery_id: "${dist_id}", grain_bill: "corn", volume_gallons: 200 }, as: ProductionManager, captures: { mb: $.data.id } }
            - { call: "POST /dsp/distillation-runs", payload: { distillery_id: "${dist_id}", mash_batch_id: "${mb}", spirit_type: "WHISKEY", gauge_method: "VOLUME", collected_wine_gallons: 20, collected_proof: 100 }, as: ProductionManager, captures: { run: $.data.id } }
            - { call: "POST /dsp/distillation-runs/${run}/gauge", payload: {}, as: ProductionManager }
            - { call: "POST /dsp/barrels", payload: { distillation_run_id: "${run}", char_level: "CHAR_3", rickhouse_position: "A-1", fill_proof_gallons: 15 }, as: ProductionManager, captures: { barrel: $.data.id } }
            - { call: "POST /dsp/label-applications", payload: { distillery_id: "${dist_id}", brand_name: "Old Bench", spirit_type: "WHISKEY", label_proof: 100, net_contents_ml: 750 }, as: ComplianceOfficer, captures: { label: $.data.id } }
            - { call: "POST /dsp/label-applications/${label}/submit", payload: {}, as: ComplianceOfficer }
            - { call: "POST /dsp/label-applications/${label}/decide", payload: { outcome: "APPROVE" }, as: ComplianceOfficer }
            - { call: "POST /dsp/bottling-runs", payload: { barrel_id: "${barrel}", label_application_id: "${label}", line_id: "LINE_A", scheduled_start: "2026-05-02T08:00:00Z", scheduled_end: "2026-05-02T12:00:00Z", bottle_size_ml: 750, bottles_per_case: 6, planned_cases: 10 }, as: ProductionManager, captures: { br: $.data.id } }
            - { call: "POST /dsp/bottling-runs/${br}/start", payload: {}, as: ProductionManager }
            - { call: "POST /dsp/bottling-runs/${br}/complete", payload: {}, as: ProductionManager }
            - { call: "POST /dsp/customers", payload: { name: "Ada Buyer", email: "ada19@x.com", state_code: "CA", age_verified: true }, as: SalesManager, captures: { cust: $.data.id } }
            - { call: "POST /dsp/sales-orders", payload: { customer_id: "${cust}", bottling_run_id: "${br}", channel: "THREE_TIER", cases: 4, unit_price_cents: 5000 }, as: SalesManager, captures: { order: $.data.id } }
            - { call: "POST /dsp/sales-orders/${order}/pay", payload: {}, as: SalesManager }
          trigger:
            - { call: "POST /dsp/sales-orders/${order}/cancel", payload: {}, as: SalesManager }
          assert:
            - "BottlingRun.${br}.cases_available == 10"
            - "BottlingRun.${br}.cases_reserved == 0"
            - "BottlingRun.${br}.cases_bottled == 10"
