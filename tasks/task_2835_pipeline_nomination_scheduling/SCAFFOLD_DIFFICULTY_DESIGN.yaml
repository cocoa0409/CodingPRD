  - rule_id: compensating_invariant
    instances:
      - name: inject_then_cancel_restores_volumetric_conservation
        grounds:
          - calculations.volumetric_conservation
          - state_machines.BatchTicket.INJECTED_to_CANCELLED
          - state_machines.BatchTicket.PLANNED_to_INJECTED
          - calculations.interface_transmix
          - entities.PipelineSegment.fields.transmix_inventory_bbl
        distinguishing_aspect: |
          The invariant is the segment-wide volumetric identity origin + destination + in_transit +
          transmix_inventory + system_loss == 100000.00 bbl, and the compensating action is
          cancelling an INJECTED ticket: the cancel must return exactly injected_bbl + transmix_bbl
          (26100 + 250 = 26350 bbl) to the origin terminal and unwind both accumulators, restoring
          origin inventory to 70000.00 and transmix_inventory to 0.00 with zero drift.
        test_recipe:
          setup:
            - "Origin terminal HOU carries inventory_bbl 100000 (min_operating_inventory_bbl 10000) and the segment linefill is funded at 20000 bbl; destination NAS is empty."
            - "ALPHA holds two nominations on the PUBLISHED cycle 2026-09: 30000 bbl ULSD (sequence position 1) and 26100 bbl CBOB (position 2), both allocated in full."
            - "The CBOB batch follows ULSD across a one-rank upgrade interface, so its transmix_bbl is 250 bbl."
            - "Both tickets have been injected on-spec, so origin inventory is 43650.00, in_transit is 56100.00 and transmix_inventory is 250.00."
            - "The conserved total is 100000.00 bbl before the compensation and must be 100000.00 after it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TariffAdministrator
            - call: "POST /pipeline/terminals"
