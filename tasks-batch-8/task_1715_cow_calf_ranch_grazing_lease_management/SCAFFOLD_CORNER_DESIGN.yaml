        distinguishing_aspect: "Reducing 61 head from a 60-head group rejects; LIQUIDATION with partial head also rejects; LIQUIDATION of exactly 60 succeeds."
        test_recipe:
          setup: ["Ranch R; group G 60 MATURE_COW"]
          setup_api_calls:
