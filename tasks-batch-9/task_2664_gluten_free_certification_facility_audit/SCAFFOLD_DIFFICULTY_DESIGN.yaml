              captures: { doc_a1: $.data.id }
            - call: "POST /gfco/supplier-documents/${doc_a1}/verification"
              payload: { decision: "APPROVE" }
              as: CertificationReviewer
              as_user_id: "rev-1"
            - call: "POST /gfco/supplier-documents"
              payload: { supplier_id: "${sup_id}", ingredient_id: "${ing_a}", doc_type: "PROCESS_FLOW", issued_on: "2026-07-01T00:00:00Z", expires_on: "2028-07-01T00:00:00Z" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { doc_a2: $.data.id }
            - call: "POST /gfco/supplier-documents/${doc_a2}/verification"
              payload: { decision: "APPROVE" }
              as: CertificationReviewer
              as_user_id: "rev-1"
            - call: "POST /gfco/supplier-documents"
              payload: { supplier_id: "${sup_id}", ingredient_id: "${ing_a}", doc_type: "COA", issued_on: "2026-07-15T00:00:00Z", expires_on: "2028-07-15T00:00:00Z", lab_ppm_claim: 5 }
