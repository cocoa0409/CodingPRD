            - "hop 2: Encounter.${enc5_id}.patient_charge_cents == 2500 and charge_basis == SLIDING_FEE_TIER"
            - "hop 2: Encounter.${enc5_id}.charge_adjustment_cents == 2500 and pps_claim_status == PENDING_ADJUSTMENT"
            - "hop 2: Encounter.${enc5_id}.income_verification_id == ${iv5_id} and pinned_discount_tier_id == ${t2_id}"
            - "hop 3: Patient.${p5_id}.patient_balance_cents == 2500 and sliding_fee_status == VERIFIED"
            - "hop 4: Encounter.${enc5_id}.wraparound_due_cents == 1500  # max(0, 18000 - 14000 - 2500)"
            - "hop 4: HealthCenter.${hc_id}.wraparound_receivable_cents == 1500"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: not_seated_board_member_beats_stale_health_center_version
        grounds:
          - validations[priority=14]
          - validations[priority=10]
          - concurrency_rules[fee-schedule-adopt-stale-health-center]
          - errors.ERR_NOT_SEATED_BOARD_MEMBER
          - errors.ERR_STALE_HEALTH_CENTER_VERSION
          - state_machines.BoardMember.SEATED_to_RESIGNED
        distinguishing_aspect: |
          CATEGORY PAIR business_safety (p14, 403) vs state (p10, 412). The single adopt request
          violates both: the acting BoardChair resigned, and the expected_health_center_version it
          carries was captured before the resignation bumped HealthCenter.version. A server that
          checks OCC first — the natural implementation, since the version is right there in the
          body — answers 412; the pinned order answers 403.
        test_recipe:
          setup:
            - "Guidelines 2025 and 2026 published; grantee 'Riverbend Community Health' with one IN_SCOPE site and service"
            - "Board seat 1 (NON_PATIENT, FINANCE) is SEATED with term 2026-01-01..2028-12-31"
            - "A DRAFT FeeSchedule (fpg_year 2026, [2026-01-01, 2027-01-01), nominal 2500) with the five-band ladder exists"
            - "HealthCenter.version was captured while the chair was still seated, then the chair resigned on 2026-08-01, bumping the version"
          setup_api_calls:
            - *s_pg25
            - *s_pg26
            - *s_hc
            - *s_site
            - *s_svc
            - *s_chair
            - *s_fs
            - *s_t1
            - *s_t2
            - *s_t3
            - *s_t4
            - *s_t5
            - *s_hcv
            - call: "POST /board-members/${chair_id}/resign"
              payload: { resignation_date: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { chair_status: $.data.status }
          trigger:
            - call: "POST /fee-schedules/${fs_id}/adopt"
              payload: { expected_health_center_version: "${hc_v}" }
              as: BoardChair
              as_user_id: "${chair_id}"
          assert:
            - "${chair_status} == RESIGNED"
            - "response status == 403 with data.error_id == ERR_NOT_SEATED_BOARD_MEMBER"
            - "response status != 412 and data.error_id != ERR_STALE_HEALTH_CENTER_VERSION"
            - "FeeSchedule.${fs_id}.status == DRAFT and adopted_at == null"
            - "HealthCenter.${hc_id}.seated_board_count == 0 and governance_posture == GOVERNANCE_DEFICIENT"
            - "HealthCenter.${hc_id}.version == ${hc_v} + 1"

      - name: fee_schedule_period_overlap_beats_nominal_fee_above_cap
        grounds:
          - validations[priority=24]
          - validations[priority=41]
          - errors.ERR_FEE_SCHEDULE_PERIOD_OVERLAP
          - errors.ERR_NOMINAL_FEE_ABOVE_CAP
          - entities.HealthCenter.fields.nominal_fee_cap_cents
          - state_machines.FeeSchedule.DRAFT_to_ADOPTED
        distinguishing_aspect: |
          A DIFFERENT category pair: business_temporal (p24, 409) vs business_fiscal (p41, 422).
          The second schedule both strictly overlaps the ADOPTED period [2026-01-01, 2027-01-01) and
          carries nominal_fee_cents 3000 above the grantee's 2500 cap. Only the temporal error is
          returned, and the fiscal violation is never reported — the opposite order is the intuitive
          one because the cap check needs no other rows.
        test_recipe:
          setup:
            - "BOOT_FS for 'Riverbend Community Health' (nominal_fee_cap_cents 2500), so an ADOPTED schedule covers [2026-01-01, 2027-01-01)"
            - "A second DRAFT FeeSchedule (fpg_year 2026) covers [2026-06-01, 2026-12-01) with nominal_fee_cents 3000 and a valid two-band ladder"
            - "HealthCenter.version is re-read immediately before the adopt so OCC cannot fire"
          setup_api_calls:
            - *s_pg25
            - *s_pg26
            - *s_hc
            - *s_site
            - *s_svc
            - *s_chair
            - *s_fs
            - *s_t1
            - *s_t2
            - *s_t3
            - *s_t4
            - *s_t5
            - *s_hcv
            - *s_adopt
            - call: "POST /health-centers/${hc_id}/fee-schedules"
              payload: { fpg_year: 2026, effective_start: "2026-06-01T00:00:00Z", effective_end: "2026-12-01T00:00:00Z", nominal_fee_cents: 3000 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { fs2_id: $.data.id }
            - call: "POST /fee-schedules/${fs2_id}/discount-tiers"
              payload: { tier_label: "NOMINAL_FULL", fpg_min_pct: 0, fpg_max_pct: 100, discount_kind: "NOMINAL", sort_order: 1 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /fee-schedules/${fs2_id}/discount-tiers"
              payload: { tier_label: "FULL_CHARGE", fpg_min_pct: 100, discount_kind: "NONE", sort_order: 2 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /health-centers/${hc_id}"
              payload: {}
              as: BoardChair
              as_user_id: "${chair_id}"
              captures: { hc_v2: $.data.version }
          trigger:
            - call: "POST /fee-schedules/${fs2_id}/adopt"
              payload: { expected_health_center_version: "${hc_v2}" }
              as: BoardChair
              as_user_id: "${chair_id}"
          assert:
            - "response status == 409 with data.error_id == ERR_FEE_SCHEDULE_PERIOD_OVERLAP"
            - "response status != 422 and data.error_id != ERR_NOMINAL_FEE_ABOVE_CAP"
            - "FeeSchedule.${fs2_id}.status == DRAFT and adopted_at == null"
            - "FeeSchedule.${fs_id}.status == ADOPTED and superseded_by_fee_schedule_id == null"
            - "HealthCenter.${hc_id}.version == ${hc_v2}  # the rejected adopt bumped nothing"

      - name: invalid_state_transition_beats_segregation_of_duties_on_terminal_plan
        grounds:
          - validations[priority=11]
          - validations[priority=13]
          - errors.ERR_INVALID_STATE_TRANSITION
          - errors.ERR_SEGREGATION_OF_DUTIES
          - state_machines.CorrectiveActionPlan.SUBMITTED_to_ACCEPTED
          - entities.CorrectiveActionPlan.fields.prepared_by_user_id
        distinguishing_aspect: |
          A THIRD category pair: state (p11) vs business_safety (p13) — and both map to HTTP 409, so
          only data.error_id discriminates and a status-code-only test cannot tell the orders apart.
          Re-adjudicating an already-ACCEPTED plan while impersonating its own preparer violates
          both; the state check wins.
        test_recipe:
          setup:
            - "BOOT_FS for 'Riverbend Community Health'"
            - "A PROGRESS_REPORT_ONLY SiteVisitFinding 'FIN-007' with cap_due_days 30 is OPEN (cap_due_at 2026-08-31)"
            - "A CorrectiveActionPlan prepared by co-1 was submitted and then ACCEPTED by po-1, so the plan is terminal and its parent finding is RESOLVED"
          setup_api_calls:
            - *s_pg25
            - *s_pg26
            - *s_hc
            - *s_site
            - *s_svc
            - *s_chair
            - *s_fs
            - *s_t1
            - *s_t2
            - *s_t3
            - *s_t4
            - *s_t5
            - *s_hcv
            - *s_adopt
            - call: "POST /health-centers/${hc_id}/site-visit-findings"
              payload: { requirement_code: "FIN-007", severity: "PROGRESS_REPORT_ONLY", finding_summary: "cost report late", cap_due_days: 30 }
              as: ProjectOfficer
              as_user_id: "po-1"
              captures: { f4_id: $.data.id }
            - call: "POST /site-visit-findings/${f4_id}/corrective-action-plans"
              payload: { narrative: "hire an interim controller", milestone_count: 2, target_completion_date: "2026-08-25T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cap4_id: $.data.id }
            - call: "POST /corrective-action-plans/${cap4_id}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /corrective-action-plans/${cap4_id}/adjudicate"
              payload: { decision: "ACCEPT" }
              as: ProjectOfficer
              as_user_id: "po-1"
              captures: { cap4_status: $.data.status }
          trigger:
            - call: "POST /corrective-action-plans/${cap4_id}/adjudicate"
              payload: { decision: "REJECT", rejection_reason: "second thoughts" }
              as: ProjectOfficer
              as_user_id: "co-1"
          assert:
            - "${cap4_status} == ACCEPTED"
            - "response status == 409 with data.error_id == ERR_INVALID_STATE_TRANSITION"
            - "data.error_id != ERR_SEGREGATION_OF_DUTIES"
            - "CorrectiveActionPlan.${cap4_id}.status == ACCEPTED and adjudicated_by_user_id == po-1"
            - "SiteVisitFinding.${f4_id}.status == RESOLVED"
            - "HealthCenter.${hc_id}.open_condition_count == 0"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: fpg_percent_exactly_at_band_edge_assigns_the_upper_tier
        grounds:
          - calculations.discount_tier_assignment
          - calculations.fpg_percent
          - entities.DiscountTier.fields.fpg_min_pct
          - entities.DiscountTier.fields.fpg_max_pct
          - endpoints[POST /income-verifications/{id}/verify]
        distinguishing_aspect: |
          METRIC fpg_percent, ENDPOINT POST /income-verifications/{id}/verify. Household 2 against
          the 2026 guideline 2190000 makes income 2190000 land on exactly 100.00 %%, the shared edge
          of the [0,100) NOMINAL_FULL band and the [100,138) PARTIAL_A band. Half-open bands put it
          in PARTIAL_A. Income 2188000 gives 99.91 %% — two cents of income either side of the edge
          change the discount from full to 80 %%, and 2189999 would still round to 100.00 %%.
        test_recipe:
          setup:
            - "BOOT_FS for 'Riverbend Community Health' with the five-band ladder 0/100/138/175/200 and fpg_year 2026 (guideline base 1620000, increment 570000, so household 2 = 2190000)"
            - "Patient 'Ada Rivera' (household 2) declares exactly 2190000 and patient 'Bo Nkemi' (household 2) declares 2188000"
          setup_api_calls:
            - *s_pg25
            - *s_pg26
            - *s_hc
            - *s_site
            - *s_svc
            - *s_chair
            - *s_fs
            - *s_t1
            - *s_t2
            - *s_t3
            - *s_t4
            - *s_t5
            - *s_hcv
            - *s_adopt
            - *s_p1
            - *s_iv1
            - *s_p2
            - *s_iv2
          trigger:
            - call: "POST /income-verifications/${iv1_id}/verify"
              payload: { decision: "VERIFY" }
              as: EligibilityVerifier
              as_user_id: "ev-1"
              captures: { at_edge_pct: $.data.fpg_percent, at_edge_tier: $.data.assigned_discount_tier_id, at_edge_label: $.data.assigned_tier_label, at_edge_uds: $.data.uds_fpg_percent }
            - call: "POST /income-verifications/${iv2_id}/verify"
              payload: { decision: "VERIFY" }
              as: EligibilityVerifier
              as_user_id: "ev-1"
              captures: { below_edge_pct: $.data.fpg_percent, below_edge_tier: $.data.assigned_discount_tier_id, below_edge_label: $.data.assigned_tier_label }
          assert:
            - "${at_edge_pct} == 100.00 and ${at_edge_label} == PARTIAL_A and ${at_edge_tier} == ${t2_id}"
            - "${below_edge_pct} == 99.91 and ${below_edge_label} == NOMINAL_FULL and ${below_edge_tier} == ${t1_id}"
            - "${at_edge_uds} == 100.00  # the CLOSED-ABOVE reporting band puts the same 100.00 % at or below 100 % of poverty"
            - "IncomeVerification.${iv1_id}.expires_at == 2027-02-01T00:00:00Z  # effective_date + 365 days"
            - "Patient.${p1_id}.sliding_fee_status == VERIFIED and Patient.${p2_id}.sliding_fee_status == VERIFIED"

      - name: annual_review_elapsed_days_365_current_366_review_due
        grounds:
          - calculations.fee_schedule_review_status
          - entities.FeeSchedule.fields.last_reviewed_at
          - entities.FeeSchedule.fields.review_status
          - endpoints[GET /fee-schedules/{id}]
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: |
          A DIFFERENT metric (elapsed whole days since last_reviewed_at) read from a DIFFERENT
          endpoint (GET /fee-schedules/{id}). The threshold is strict: 365 elapsed days is still
          CURRENT and 366 is REVIEW_DUE. Adopting at 2027-01-01 relative to a 2026-01-01 review is
          exactly 365 days across a non-leap span, the single instant an off-by-one implementation
          gets wrong.
        test_recipe:
          setup:
            - "The logical clock is set to 2026-01-01T00:00:00Z before the schedule is adopted, so last_reviewed_at == 2026-01-01T00:00:00Z"
            - "Guidelines 2025 and 2026 are published, so the latest guideline year equals the schedule's fpg_year 2026 and R1 never fires"
            - "Grantee 'Calendar Creek Health' has one IN_SCOPE site, one IN_SCOPE service and one SEATED NON_PATIENT seat"
            - "The ADOPTED FeeSchedule covers [2026-01-01, 2028-01-01) so it never expires during the test"
          setup_api_calls:
            - *s_pg25
            - *s_pg26
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /health-centers"
              payload: { legal_name: "Calendar Creek Health", grant_number: "H80CS00429", pps_base_rate_cents: 18000, medicare_upper_limit_cents: 15000, nominal_fee_cap_cents: 2500 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { chc_id: $.data.id }
            - call: "POST /health-centers/${chc_id}/service-sites"
              payload: { site_name: "Creek Clinic", site_type: "SERVICE_DELIVERY", address_line: "3 Creek Ln", weekly_service_hours: 40, in_initial_scope: true }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { csite_id: $.data.id }
            - call: "POST /health-centers/${chc_id}/service-definitions"
              payload: { service_code: "GEN_PRIMARY_CARE", service_category: "REQUIRED_PRIMARY", delivery_method: "COLUMN_I_DIRECT", in_initial_scope: true }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { csvc_id: $.data.id }
            - call: "POST /health-centers/${chc_id}/board-members"
              payload: { seat_number: 1, seat_type: "NON_PATIENT", expertise_category: "COMMUNITY", term_start: "2026-01-01T00:00:00Z", term_end: "2029-12-31T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-creek"
              captures: { cchair_id: $.data.id }
            - call: "POST /health-centers/${chc_id}/fee-schedules"
              payload: { fpg_year: 2026, effective_start: "2026-01-01T00:00:00Z", effective_end: "2028-01-01T00:00:00Z", nominal_fee_cents: 2500 }
              as: ComplianceOfficer
              as_user_id: "co-creek"
              captures: { cfs_id: $.data.id }
            - call: "POST /fee-schedules/${cfs_id}/discount-tiers"
              payload: { tier_label: "NOMINAL_FULL", fpg_min_pct: 0, fpg_max_pct: 100, discount_kind: "NOMINAL", sort_order: 1 }
              as: ComplianceOfficer
              as_user_id: "co-creek"
            - call: "POST /fee-schedules/${cfs_id}/discount-tiers"
              payload: { tier_label: "FULL_CHARGE", fpg_min_pct: 100, discount_kind: "NONE", sort_order: 2 }
              as: ComplianceOfficer
              as_user_id: "co-creek"
            - call: "GET /health-centers/${chc_id}"
              payload: {}
              as: BoardChair
              as_user_id: "${cchair_id}"
              captures: { chc_v: $.data.version }
            - call: "POST /fee-schedules/${cfs_id}/adopt"
              payload: { expected_health_center_version: "${chc_v}" }
              as: BoardChair
              as_user_id: "${cchair_id}"
              captures: { c_reviewed_at: $.data.last_reviewed_at, c_status_day0: $.data.review_status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /fee-schedules/${cfs_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-creek"
              captures: { c_status_day365: $.data.review_status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-02T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "GET /fee-schedules/${cfs_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-creek"
              captures: { c_status_day366: $.data.review_status }
          assert:
            - "${c_reviewed_at} == 2026-01-01T00:00:00Z and ${c_status_day0} == CURRENT"
            - "${c_status_day365} == CURRENT  # exactly 365 elapsed days is NOT yet due (strict >)"
            - "${c_status_day366} == REVIEW_DUE"
            - "FeeSchedule.${cfs_id}.status == ADOPTED and reviewed_against_guideline_year == 2026"
            - "FeeSchedule.${cfs_id}.review_status != OUT_OF_DATE  # R1 cannot fire while 2026 is the latest guideline year"

      - name: board_composition_thresholds_min_seats_majority_and_industry_cap
        grounds:
          - calculations.governance_posture
          - entities.HealthCenter.fields.patient_seat_pct
          - entities.HealthCenter.fields.governance_posture
          - entities.BoardMember.fields.derives_over_10pct_income_from_healthcare
          - endpoints[GET /health-centers/{id}/governance-summary]
        distinguishing_aspect: |
          A THIRD metric (patient_seat_pct and the healthcare-industry seat cap) read from a THIRD
          endpoint (GET /health-centers/{id}/governance-summary). Three seats give 66.67 %% — a clear
          patient majority — yet the board is still GOVERNANCE_DEFICIENT because 1 industry seat
          exceeds floor(1/2) == 0. Adding a fourth non-patient seat fixes the industry cap but drops
          the majority to exactly 50.00 %%, which fails the >= 51.00 test by one hundredth. Only the
          fifth seat, at 60.00 %%, satisfies every threshold at once.
        test_recipe:
          setup:
            - "BOOT_FS for 'Riverbend Community Health' where board seat 1 is NON_PATIENT FINANCE with derives_over_10pct_income_from_healthcare == true"
            - "Patients 'Ada Rivera', 'Bo Nkemi' and 'Cy Patel' each have one non-VOID Encounter at the IN_SCOPE Main Clinic dated 2026-03-01, within the 24-month recency window"
            - "PATIENT board seats 2 and 3 are bound to Ada and Bo"
          setup_api_calls:
            - *s_pg25
            - *s_pg26
            - *s_hc
            - *s_site
            - *s_svc
            - call: "POST /health-centers/${hc_id}/board-members"
              payload: { seat_number: 1, seat_type: "NON_PATIENT", expertise_category: "FINANCE", derives_over_10pct_income_from_healthcare: true, term_start: "2026-01-01T00:00:00Z", term_end: "2028-12-31T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { ichair_id: $.data.id }
            - *s_fs
            - *s_t1
            - *s_t2
            - *s_t3
            - *s_t4
            - *s_t5
            - call: "GET /health-centers/${hc_id}"
              payload: {}
              as: BoardChair
              as_user_id: "${ichair_id}"
              captures: { ihc_v: $.data.version }
            - call: "POST /fee-schedules/${fs_id}/adopt"
              payload: { expected_health_center_version: "${ihc_v}" }
              as: BoardChair
              as_user_id: "${ichair_id}"
            - *s_p1
            - *s_iv1
            - *s_iv1v
            - *s_enc1
            - *s_p2
            - *s_iv2
            - *s_iv2v
            - *s_enc2
            - call: "POST /patients"
              payload: { mrn: "MRN-006", full_name: "Cy Patel", household_size: 1 }
              as: PatientServicesRep
              as_user_id: "psr-1"
              captures: { p6_id: $.data.id }
            - call: "POST /encounters"
              payload: { patient_id: "${p6_id}", service_site_id: "${site_id}", service_definition_id: "${svc_id}", encounter_date: "2026-03-01T00:00:00Z", payer_type: "SELF_PAY", gross_charge_cents: 10000 }
              as: BillingSpecialist
              as_user_id: "bs-1"
              captures: { enc6_id: $.data.id, enc6_charge: $.data.patient_charge_cents }
            - call: "POST /health-centers/${hc_id}/board-members"
              payload: { seat_number: 2, seat_type: "PATIENT", patient_id: "${p1_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2028-12-31T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /health-centers/${hc_id}/board-members"
              payload: { seat_number: 3, seat_type: "PATIENT", patient_id: "${p2_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2028-12-31T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "GET /health-centers/${hc_id}/governance-summary"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { g3_pct: $.data.patient_seat_pct, g3_posture: $.data.governance_posture, g3_industry: $.data.healthcare_industry_seat_count, g3_nonpatient: $.data.non_patient_seat_count }
            - call: "POST /health-centers/${hc_id}/board-members"
              payload: { seat_number: 4, seat_type: "NON_PATIENT", expertise_category: "LEGAL", term_start: "2026-01-01T00:00:00Z", term_end: "2028-12-31T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /health-centers/${hc_id}/governance-summary"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { g4_pct: $.data.patient_seat_pct, g4_posture: $.data.governance_posture }
            - call: "POST /health-centers/${hc_id}/board-members"
              payload: { seat_number: 5, seat_type: "PATIENT", patient_id: "${p6_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2028-12-31T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /health-centers/${hc_id}/governance-summary"
              payload: {}
              as: ComplianceOfficer
