  # ---------------------------------------------------------------- rule 7 ---
  - rule_id: cross_entity_state_dependency
    instances:
      - name: offer_publish_gated_by_donor_status
        grounds:
          - state_machines.DonationOffer
          - errors[ERR_DONOR_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair DonationOffer -> DonorSite: a DRAFT offer of a
          PENDING_REVIEW donor cannot publish (ERR_DONOR_NOT_ACTIVE); after
          the donor transitions to ACTIVE the SAME publish call succeeds —
          the offer's valid transitions depend on the donor's state, not on
          any offer field.
        test_recipe:
          setup:
            - "Donor D exists, still PENDING_REVIEW; offer O (SHELF_STABLE est 5, window 2026-08-02T10:00-12:00Z) created in DRAFT; clock 2026-08-02T09:00:00Z"
          setup_api_calls:
            - call: "POST /api/donor-sites"
              payload: { legal_name: "Gate Bistro", ein: "909090909", contact_email: "g@bistro.example" }
              as: DispatchAdmin
              captures: { d: "$.data.id" }
            - call: "POST /api/donation-offers"
              payload: { donor_site_id: "${d}", food_category: "SHELF_STABLE", estimated_weight_lbs: 5, pickup_window_start: "2026-08-02T10:00:00Z", pickup_window_end: "2026-08-02T12:00:00Z" }
              as: DonorCoordinator
