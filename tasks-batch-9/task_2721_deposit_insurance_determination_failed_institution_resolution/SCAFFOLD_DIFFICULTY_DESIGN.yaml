  # ===================================================================================
  - rule_id: transitive_cascade
    instances:
      - name: certify_cascade_five_levels_determination_to_notice
        grounds:
          - state_machines.InsuranceDetermination.UNDER_REVIEW_to_CERTIFIED
          - calculations.uninsured_hold_allocation
          - state_machines.DepositorRecord.PENDING_to_SENT
          - complexity_profile.complexity_layers.cascading_side_effects
        distinguishing_aspect: |
          Depth 5, triggered by the InsuranceDetermination transition UNDER_REVIEW -> CERTIFIED. The
          chain is strictly transitive, not fan-out: L1 certifies the determination; L2 exists only
          because the determination became CERTIFIED (accounts flip to DETERMINED); L3 exists only
          because those accounts are DETERMINED (holds are allocated); L4 exists only because a hold
          was placed (the receivership certificate is issued); L5 exists only because the certificate
          was issued (the depositor notice is sent with template PARTIALLY_UNINSURED). Remove any link
          and every later link disappears.
        test_recipe:
          setup:
            - "Institution 34571 is CLOSED_IN_RECEIVERSHIP with a STANDARDIZED readiness package; depositor Farid owns SINGLE accounts F-0001 = 20000000 (created first) and F-0002 = 9000001."
            - "Farid's determination is PREPARED under AGGREGATE_BY_CATEGORY by agent-001 and sits in UNDER_REVIEW."
            - "Before the trigger: both accounts are insurance_status FROZEN_FOR_DETERMINATION / hold_status NONE / held_amount_cents 0; no ReceivershipCertificate exists; Farid.notice_status == PENDING; institution.aggregate_insured_cents == 0, aggregate_certificate_face_cents == 0, uninsured_claim_count == 0."
