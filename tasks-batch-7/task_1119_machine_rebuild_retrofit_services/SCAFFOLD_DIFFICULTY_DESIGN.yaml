            - { call: "POST /api/projects/${proj}/decision", payload: { decision: "MECHANICAL_REBUILD", assigned_engineer_id: "eng-1" }, as: ProjectManager }
            - { call: "POST /api/downtime-windows", payload: { customer_id: "${cust}", starts_at: "2026-06-01T00:00:00Z", ends_at: "2026-07-01T00:00:00Z" }, as: LogisticsCoordinator, captures: { win: $.data.id } }
          trigger:
