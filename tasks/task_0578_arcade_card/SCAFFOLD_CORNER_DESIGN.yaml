# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk of the claim-extraction-guide against SCAFFOLD.yaml §1.1-§1.7.
# excluded_because: stubs point at §1.8 instances that already exercise the corner.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_member_returns_201_with_fields
        claim_type: Creation
        grounds: ["entities.Member.email", "entities.Member.membership_tier"]
        distinguishing_aspect: "POST /members with email+full_name returns 201 with status=ACTIVE, membership_tier=NONE, lifetime_spend_cents=0, and a server-minted UUID id."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "new@x.com", full_name: "New Member", promo_opt_in: true }
              as: Cashier
              captures: { m_id: $.data.id }
          trigger:
            - call: "GET /members/${m_id}"
              payload: {}
              as: Cashier
          assert:
            - "Member.${m_id}.status == ACTIVE"
            - "Member.${m_id}.membership_tier == NONE"
            - "Member.${m_id}.lifetime_spend_cents == 0"
            - "Member.${m_id}.promo_opt_in == true"

      - name: default_promo_opt_in_false
        claim_type: Defaults
        grounds: ["entities.Member.promo_opt_in"]
        distinguishing_aspect: "Omitting promo_opt_in on POST /members yields the default false."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "def@x.com", full_name: "Default" }
              as: Cashier
              captures: { m_id: $.data.id }
          trigger:
            - call: "GET /members/${m_id}"
              payload: {}
              as: Cashier
          assert:
            - "Member.${m_id}.promo_opt_in == false"

      - name: new_card_system_fields
        claim_type: System Fields
        grounds: ["entities.GameCard.status", "entities.GameCard.chip_balance_cents"]
        distinguishing_aspect: "A newly issued card has status=INACTIVE, all balances 0, version=1, regardless of any client-supplied balance."
        test_recipe:
          setup: ["A member exists."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "sf@x.com", full_name: "SF" }
              as: Cashier
              captures: { m_id: $.data.id }
            - call: "POST /game-cards"
              payload: { owner_member_id: "${m_id}" }
              as: Cashier
              captures: { c_id: $.data.id }
          trigger:
            - call: "GET /game-cards/${c_id}"
              payload: {}
              as: Cashier
          assert:
            - "GameCard.${c_id}.status == INACTIVE"
            - "GameCard.${c_id}.chip_balance_cents == 0"
            - "GameCard.${c_id}.bonus_chip_balance_cents == 0"
            - "GameCard.${c_id}.ticket_points_balance == 0"
            - "GameCard.${c_id}.version == 1"

      - name: card_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_CARD_NOT_FOUND]"]
        distinguishing_aspect: "GET /game-cards/{nonexistent-uuid} returns ERR_CARD_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /game-cards/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Cashier
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_CARD_NOT_FOUND"
            - "trigger response HTTP status == 404"

      - name: create_attraction_missing_required_field
        claim_type: Required Fields
        grounds: ["entities.Attraction.chip_cost_cents", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /attractions without chip_cost_cents returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /attractions"
              payload: { name: "NoPrice", points_award: 10 }
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_VALIDATION"
            - "trigger response HTTP status == 422"

      - name: fk_owner_member_nonexistent_rejected
        claim_type: Parent Relationships
        grounds: ["entities.GameCard.owner_member_id", "errors[ERR_MEMBER_NOT_FOUND]"]
        distinguishing_aspect: "POST /game-cards with owner_member_id referencing no member returns ERR_MEMBER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /game-cards"
              payload: { owner_member_id: "11111111-1111-4111-8111-111111111111" }
              as: Cashier
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_MEMBER_NOT_FOUND (404)"

      - name: fk_reverse_reachability_cards_by_owner
        claim_type: Parent Relationships
        grounds: ["entities.GameCard.owner_member_id", "endpoints.GET_/game-cards"]
        distinguishing_aspect: "GET /game-cards?owner_member_id=<m> returns exactly the cards owned by that member (array)."
        test_recipe:
          setup: ["A member with two cards."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "own@x.com", full_name: "Owner" }
              as: Cashier
              captures: { m_id: $.data.id }
            - call: "POST /game-cards"
              payload: { owner_member_id: "${m_id}" }
              as: Cashier
            - call: "POST /game-cards"
              payload: { owner_member_id: "${m_id}" }
              as: Cashier
          trigger:
            - call: "GET /game-cards"
              payload: { owner_member_id: "${m_id}" }
              as: Cashier
          assert:
            - "GET /game-cards?owner_member_id=${m_id} returns an array of length 2, each with owner_member_id == ${m_id}"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_completed_booking_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.PartyBooking.CHECKED_IN_to_COMPLETED", "errors[ERR_INVALID_BOOKING_STATE]"]
        distinguishing_aspect: "Cancelling a COMPLETED (terminal) booking returns ERR_INVALID_BOOKING_STATE (409); no side effects fire."
        test_recipe:
          setup: ["A booking driven all the way to COMPLETED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T10:00:00Z" }
              as: Manager
            - call: "POST /rooms"
              payload: { name: "Room K", capacity: 20, hourly_rate_cents: 8000 }
              as: Manager
              captures: { room_id: $.data.id }
            - call: "POST /party-packages"
              payload: { name: "Gold", base_price_cents: 20000, included_guests: 10, included_hours: 2, included_chip_cents: 0, tier: "GOLD", combo_name: "Combo", combo_value_cents: 0 }
              as: Manager
              captures: { pkg_id: $.data.id }
            - call: "POST /members"
              payload: { email: "hk@x.com", full_name: "HK" }
              as: Cashier
              captures: { host_id: $.data.id }
            - call: "POST /party-bookings"
              payload: { room_id: "${room_id}", package_id: "${pkg_id}", host_member_id: "${host_id}", start_at: "2026-05-01T14:00:00Z", end_at: "2026-05-01T16:00:00Z", guest_count: 2 }
              as: Coordinator
              captures: { bid: $.data.id }
            - call: "POST /party-bookings/${bid}/confirm"
              payload: {}
              as: Coordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T14:30:00Z" }
              as: Manager
            - call: "POST /party-bookings/${bid}/check-in"
              payload: {}
              as: Cashier
            - call: "POST /party-bookings/${bid}/complete"
              payload: {}
              as: Coordinator
          trigger:
            - call: "POST /party-bookings/${bid}/cancel"
              payload: {}
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_BOOKING_STATE (409)"
            - "PartyBooking.${bid}.status == COMPLETED (unchanged)"

      - name: fulfill_already_fulfilled_redemption_invalid_state
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Redemption.RESERVED_to_FULFILLED", "errors[ERR_INVALID_REDEMPTION_STATE]"]
        distinguishing_aspect: "Fulfilling a redemption already in terminal FULFILLED returns ERR_INVALID_REDEMPTION_STATE (409)."
        test_recipe:
          setup: ["A redemption fulfilled once."]
          setup_api_calls:
            - call: "POST /attractions"
              payload: { name: "Racer", chip_cost_cents: 100, points_award: 1000 }
              as: Manager
              captures: { attr_id: $.data.id }
            - call: "POST /prize-items"
              payload: { name: "Teddy", points_price: 500, stock_qty: 10 }
              as: Manager
              captures: { prize_id: $.data.id }
            - call: "POST /members"
              payload: { email: "tr@x.com", full_name: "TR" }
              as: Cashier
              captures: { m_id: $.data.id }
            - call: "POST /game-cards"
              payload: { owner_member_id: "${m_id}" }
              as: Cashier
              captures: { c_id: $.data.id }
            - call: "POST /game-cards/${c_id}/activate"
              payload: {}
              as: Cashier
            - call: "POST /game-cards/${c_id}/reload"
              payload: { amount_cents: 200 }
              as: Cashier
            - call: "POST /game-plays"
              payload: { card_id: "${c_id}", attraction_id: "${attr_id}" }
              as: Attendant
            - call: "GET /game-cards/${c_id}"
              payload: {}
              as: Attendant
              captures: { cv: $.data.version }
            - call: "POST /redemptions"
              payload: { card_id: "${c_id}", prize_item_id: "${prize_id}", quantity: 1, expected_card_version: "${cv}" }
              as: Attendant
              captures: { red_id: $.data.id }
            - call: "POST /redemptions/${red_id}/fulfill"
              payload: {}
              as: Attendant
          trigger:
            - call: "POST /redemptions/${red_id}/fulfill"
              payload: {}
              as: Attendant
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_REDEMPTION_STATE (409)"
            - "Redemption.${red_id}.status == FULFILLED (unchanged)"

      - name: freeze_inactive_card_invalid_card_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.GameCard.ACTIVE_to_FROZEN", "errors[ERR_INVALID_CARD_STATE]"]
        distinguishing_aspect: "Freezing an INACTIVE card (freeze requires ACTIVE) returns ERR_INVALID_CARD_STATE (409)."
        test_recipe:
          setup: ["A member with a fresh INACTIVE card."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "fz2@x.com", full_name: "FZ2" }
              as: Cashier
              captures: { m_id: $.data.id }
            - call: "POST /game-cards"
              payload: { owner_member_id: "${m_id}" }
              as: Cashier
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /game-cards/${c_id}/freeze"
              payload: {}
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_CARD_STATE (409)"
            - "GameCard.${c_id}.status == INACTIVE (unchanged)"

      - name: return_issued_wristband_invalid_wristband_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Wristband.ACTIVE_to_RETURNED", "errors[ERR_INVALID_WRISTBAND_STATE]"]
        distinguishing_aspect: "Returning an ISSUED wristband (return requires ACTIVE) returns ERR_INVALID_WRISTBAND_STATE (409)."
        test_recipe:
          setup: ["A CONFIRMED booking (wristbands ISSUED, not yet checked in)."]
          setup_api_calls:
            - call: "POST /rooms"
              payload: { name: "Room L", capacity: 20, hourly_rate_cents: 8000 }
              as: Manager
              captures: { room_id: $.data.id }
            - call: "POST /party-packages"
              payload: { name: "Gold", base_price_cents: 20000, included_guests: 10, included_hours: 2, included_chip_cents: 0, tier: "GOLD", combo_name: "Combo", combo_value_cents: 0 }
              as: Manager
              captures: { pkg_id: $.data.id }
            - call: "POST /members"
              payload: { email: "hl@x.com", full_name: "HL" }
              as: Cashier
              captures: { host_id: $.data.id }
            - call: "POST /party-bookings"
              payload: { room_id: "${room_id}", package_id: "${pkg_id}", host_member_id: "${host_id}", start_at: "2026-05-01T14:00:00Z", end_at: "2026-05-01T16:00:00Z", guest_count: 2 }
              as: Coordinator
              captures: { bid: $.data.id }
            - call: "POST /party-bookings/${bid}/confirm"
              payload: {}
              as: Coordinator
            - call: "GET /wristbands"
              payload: { booking_id: "${bid}" }
              as: Coordinator
              captures: { w0_id: "$.data[0].id" }
          trigger:
            - call: "POST /wristbands/${w0_id}/return"
              payload: {}
              as: Cashier
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_WRISTBAND_STATE (409)"

      - name: count_non_open_reconciliation_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.DailyReconciliation.OPEN_to_RECONCILED", "errors[ERR_INVALID_RECONCILIATION_STATE]"]
        distinguishing_aspect: "A second count on an already-counted (RECONCILED) reconciliation returns ERR_INVALID_RECONCILIATION_STATE (409)."
        test_recipe:
          setup: ["An empty-venue reconciliation opened and counted to RECONCILED (expected 0/0)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T00:00:00Z" }
              as: Manager
            - call: "POST /daily-reconciliations"
              payload: { business_day: "2026-05-02" }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /daily-reconciliations/${rid}/count"
              payload: { counted_chip_liability_cents: 0, counted_prize_units: 0 }
              as: Manager
          trigger:
            - call: "POST /daily-reconciliations/${rid}/count"
              payload: { counted_chip_liability_cents: 0, counted_prize_units: 0 }
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_RECONCILIATION_STATE (409)"
            - "DailyReconciliation.${rid}.status == RECONCILED (unchanged)"

      - name: outside_window_checkin_rejected
        claim_type: Precondition Enforcement
        grounds: ["state_machines.PartyBooking.CONFIRMED_to_CHECKED_IN", "errors[ERR_OUTSIDE_BOOKING_WINDOW]"]
        distinguishing_aspect: "Check-in when clock is before start_at returns ERR_OUTSIDE_BOOKING_WINDOW (409)."
        test_recipe:
          setup: ["A CONFIRMED booking 14:00-16:00; clock at 13:00 (before window)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T10:00:00Z" }
              as: Manager
            - call: "POST /rooms"
              payload: { name: "Room M", capacity: 20, hourly_rate_cents: 8000 }
              as: Manager
              captures: { room_id: $.data.id }
            - call: "POST /party-packages"
              payload: { name: "Gold", base_price_cents: 20000, included_guests: 10, included_hours: 2, included_chip_cents: 0, tier: "GOLD", combo_name: "Combo", combo_value_cents: 0 }
              as: Manager
              captures: { pkg_id: $.data.id }
            - call: "POST /members"
              payload: { email: "hm@x.com", full_name: "HM" }
              as: Cashier
              captures: { host_id: $.data.id }
            - call: "POST /party-bookings"
              payload: { room_id: "${room_id}", package_id: "${pkg_id}", host_member_id: "${host_id}", start_at: "2026-05-01T14:00:00Z", end_at: "2026-05-01T16:00:00Z", guest_count: 2 }
              as: Coordinator
              captures: { bid: $.data.id }
            - call: "POST /party-bookings/${bid}/confirm"
              payload: {}
              as: Coordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T13:00:00Z" }
              as: Manager
          trigger:
            - call: "POST /party-bookings/${bid}/check-in"
              payload: {}
              as: Cashier
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_OUTSIDE_BOOKING_WINDOW (409)"
            - "PartyBooking.${bid}.status == CONFIRMED (unchanged)"

  # ===========================================================================
  - section: calculations
    instances:
      - name: gameplay_bonus_only_variant
        claim_type: Correct Result
        grounds: ["calculations.gameplay_settlement", "entities.GameCard.bonus_chip_balance_cents"]
        distinguishing_aspect: "When bonus_chip_balance covers the cost, the play draws entirely from bonus (chip_from_bonus_cents=200, chip_from_stored_cents=0) leaving the purchased chip_balance untouched."
        test_recipe:
          setup: ["A booking-provisioned card with bonus 1000 (via a party confirm) that is used to play a 200-cost attraction."]
          setup_api_calls:
            - call: "POST /attractions"
              payload: { name: "Bonus", chip_cost_cents: 200, points_award: 5 }
              as: Manager
              captures: { attr_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "Room N", capacity: 20, hourly_rate_cents: 8000 }
              as: Manager
              captures: { room_id: $.data.id }
            - call: "POST /party-packages"
              payload: { name: "Gold", base_price_cents: 20000, included_guests: 10, included_hours: 2, included_chip_cents: 1000, tier: "GOLD", combo_name: "Combo", combo_value_cents: 3000 }
              as: Manager
              captures: { pkg_id: $.data.id }
            - call: "POST /members"
              payload: { email: "hn@x.com", full_name: "HN" }
              as: Cashier
              captures: { host_id: $.data.id }
            - call: "POST /party-bookings"
              payload: { room_id: "${room_id}", package_id: "${pkg_id}", host_member_id: "${host_id}", start_at: "2026-05-01T14:00:00Z", end_at: "2026-05-01T16:00:00Z", guest_count: 2 }
              as: Coordinator
              captures: { bid: $.data.id }
            - call: "POST /party-bookings/${bid}/confirm"
              payload: {}
              as: Coordinator
            - call: "GET /wristbands"
              payload: { booking_id: "${bid}" }
              as: Coordinator
              captures: { card0: "$.data[0].card_id" }
          trigger:
            - call: "POST /game-plays"
              payload: { card_id: "${card0}", attraction_id: "${attr_id}" }
              as: Attendant
              captures: { fb: $.data.chip_from_bonus_cents, fs: $.data.chip_from_stored_cents }
          assert:
            - "GamePlay.chip_from_bonus_cents == 200"
            - "GamePlay.chip_from_stored_cents == 0"
            - "GameCard.${card0}.bonus_chip_balance_cents == 800"
            - "GameCard.${card0}.chip_balance_cents == 0"

      - name: reload_anonymous_card_no_bonus
        claim_type: Variant Selection
        grounds: ["calculations.card_reload_credit", "entities.GameCard.owner_member_id"]
        distinguishing_aspect: "Reloading a card with owner_member_id null grants zero bonus (tier NONE) and accrues no lifetime_spend; chip_balance rises by exactly the amount."
        test_recipe:
          setup: ["An anonymous (no owner) card, activated."]
          setup_api_calls:
            - call: "POST /game-cards"
              payload: {}
              as: Cashier
              captures: { c_id: $.data.id }
            - call: "POST /game-cards/${c_id}/activate"
              payload: {}
              as: Cashier
          trigger:
            - call: "POST /game-cards/${c_id}/reload"
              payload: { amount_cents: 1000 }
              as: Cashier
          assert:
            - "GameCard.${c_id}.chip_balance_cents == 1000"
            - "GameCard.${c_id}.bonus_chip_balance_cents == 0"

      - name: reconciliation_reconciled_zero_variance
        claim_type: Correct Result
        grounds: ["calculations.daily_reconciliation", "state_machines.DailyReconciliation.OPEN_to_RECONCILED"]
        distinguishing_aspect: "With one ACTIVE card holding chip 6000 and one prize with stock 5, opening a reconciliation snapshots expected 6000/5 and counting the same figures transitions to RECONCILED with both variances 0."
        test_recipe:
          setup: ["One member+card reloaded 6000 (chip 6000), one prize stock 5, on business_day 2026-05-03."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-03T00:00:00Z" }
              as: Manager
            - call: "POST /prize-items"
              payload: { name: "Bear", points_price: 100, stock_qty: 5 }
              as: Manager
            - call: "POST /members"
              payload: { email: "rec@x.com", full_name: "Rec" }
              as: Cashier
              captures: { m_id: $.data.id }
            - call: "POST /game-cards"
              payload: { owner_member_id: "${m_id}" }
              as: Cashier
              captures: { c_id: $.data.id }
            - call: "POST /game-cards/${c_id}/activate"
              payload: {}
              as: Cashier
            - call: "POST /game-cards/${c_id}/reload"
              payload: { amount_cents: 6000 }
              as: Cashier
            - call: "POST /daily-reconciliations"
              payload: { business_day: "2026-05-03" }
              as: Manager
              captures: { rid: $.data.id, exp_chip: $.data.expected_chip_liability_cents, exp_prize: $.data.expected_prize_units }
          trigger:
            - call: "POST /daily-reconciliations/${rid}/count"
              payload: { counted_chip_liability_cents: 6000, counted_prize_units: 5 }
              as: Manager
          assert:
            - "DailyReconciliation.${rid}.expected_chip_liability_cents == 6000"
            - "DailyReconciliation.${rid}.expected_prize_units == 5"
            - "DailyReconciliation.${rid}.variance_chip_cents == 0"
            - "DailyReconciliation.${rid}.status == RECONCILED"

      - name: reconciliation_discrepancy_nonzero_variance
        claim_type: Correct Result
        grounds: ["calculations.daily_reconciliation", "state_machines.DailyReconciliation.OPEN_to_DISCREPANCY"]
        distinguishing_aspect: "Counting 5900 against expected 6000 yields variance_chip_cents=-100 and status DISCREPANCY."
        test_recipe:
          setup: ["One member+card reloaded 6000, business_day 2026-05-04, reconciliation opened."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T00:00:00Z" }
              as: Manager
            - call: "POST /members"
              payload: { email: "rec2@x.com", full_name: "Rec2" }
              as: Cashier
              captures: { m_id: $.data.id }
            - call: "POST /game-cards"
              payload: { owner_member_id: "${m_id}" }
              as: Cashier
              captures: { c_id: $.data.id }
            - call: "POST /game-cards/${c_id}/activate"
              payload: {}
              as: Cashier
            - call: "POST /game-cards/${c_id}/reload"
              payload: { amount_cents: 6000 }
              as: Cashier
            - call: "POST /daily-reconciliations"
              payload: { business_day: "2026-05-04" }
              as: Manager
              captures: { rid: $.data.id }
          trigger:
            - call: "POST /daily-reconciliations/${rid}/count"
              payload: { counted_chip_liability_cents: 5900, counted_prize_units: 0 }
              as: Manager
          assert:
            - "DailyReconciliation.${rid}.variance_chip_cents == -100"
            - "DailyReconciliation.${rid}.status == DISCREPANCY"

  # ===========================================================================
  - section: validations
    instances:
      - name: booking_end_before_start_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=4]", "errors[ERR_VALIDATION]"]
