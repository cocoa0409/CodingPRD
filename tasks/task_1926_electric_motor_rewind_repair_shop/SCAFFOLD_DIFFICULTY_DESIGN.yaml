              payload: { shop_name: "S", easa_accreditation_id: "EASA-12345", labor_rate_small_cents: 8500, labor_rate_medium_cents: 9500, labor_rate_large_cents: 11200, labor_rate_xlarge_cents: 13800, rush_premium_pct: 0.35, replace_threshold_pct: 0.65, supplies_low_pct: 0.08, supplies_high_pct: 0.06, warranty_months: 12, pool_slot_monthly_cents: 4500, pool_loan_daily_cents: 1800, pool_loan_grace_days: 3 }
