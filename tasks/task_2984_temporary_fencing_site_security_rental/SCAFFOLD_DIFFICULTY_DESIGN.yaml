  - rule_id: non_linear_state_machine
    instances:

      - name: permit_revision_cycle_bounded_at_third_round
        grounds:
          - state_machines.PermitApplication.SUBMITTED_to_REVISION_REQUESTED
          - state_machines.PermitApplication.REVISION_REQUESTED_to_SUBMITTED
          - validations.priority_18_ERR_PERMIT_REVISION_LIMIT
          - entities.PermitApplication.fields.revision_round
          - entities.Municipality.fields.permit_review_rounds_allowed
        distinguishing_aspect: |
          The SUBMITTED -> REVISION_REQUESTED -> SUBMITTED cycle is traversable
          twice and refused the third time: with permit_review_rounds_allowed 2 the
          resubmissions at revision_round 1 and 2 return 200 while the resubmission
          at revision_round 3 returns ERR_PERMIT_REVISION_LIMIT 409 and leaves
          status REVISION_REQUESTED with revision_round still 3 and submitted_at_utc
          unchanged. A linear or unbounded-cycle machine gets a different answer on
          at least one of the three identical calls.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z for the whole instance."
            - "Municipality HRB-01: permit_lead_time_days 5, max_concurrent_closure_linear_feet 800, permit_review_rounds_allowed 2."
            - "Jobsite with requires_sidewalk_closure true so a permit is meaningful."
            - "One PermitApplication: 300 ft PARTIAL closure over [2026-08-10T00:00:00Z, 2026-08-20T00:00:00Z), which clears the 5-day lead time."
            - "No contract, work order or invoice exists; the whole instance lives inside the permit dimension."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fence-rentals/municipalities"
              payload: { name: "City of Harbor Point", jurisdiction_code: "HRB-01", permit_lead_time_days: 5, max_concurrent_closure_linear_feet: 800, rental_tax_rate_bp: 890, permit_review_rounds_allowed: 2, allows_solid_wind_screen: true }
              as: PlatformAdmin
              captures: { m1_id: "$.data.id"}
            - call: "POST /fence-rentals/accounts"
              payload: { legal_name: "Ridgeline Builders LLC", billing_email: "ap@ridgeline.example", credit_limit_cents: 100000000 }
              as: AccountManager
              as_user_id: "am-001"
              captures: { a1_id: "$.data.id"}
            - call: "POST /fence-rentals/jobsites"
              payload: { customer_account_id: "${a1_id}", municipality_id: "${m1_id}", site_label: "Quay Street Tower", address_line: "11 Quay Street", site_condition: "CONCRETE", requires_sidewalk_closure: true }
              as: AccountManager
              as_user_id: "am-001"
              captures: { j1_id: "$.data.id"}
            - call: "POST /fence-rentals/permits"
              payload: { jobsite_id: "${j1_id}", closure_linear_feet: 300, closure_start_utc: "2026-08-10T00:00:00Z", closure_end_utc: "2026-08-20T00:00:00Z", sidewalk_closure_type: "PARTIAL" }
              as: MunicipalLiaison
              as_user_id: "ml-001"
              captures: { pm_id: "$.data.id", pm_status0: "$.data.status"}
            - call: "POST /fence-rentals/permits/${pm_id}/submit"
              payload: {}
              as: MunicipalLiaison
              as_user_id: "ml-001"
              captures: { pm_status1: "$.data.status"}
            - call: "POST /fence-rentals/permits/${pm_id}/municipal-decision"
              payload: { decision: "REQUEST_REVISION", required_change_summary: "narrow the closure to one lane" }
              as: MunicipalLiaison
              as_user_id: "ml-001"
              captures: { pm_round1: "$.data.revision_round"}
            - call: "POST /fence-rentals/permits/${pm_id}/submit"
              payload: {}
              as: MunicipalLiaison
              as_user_id: "ml-001"
              captures: { pm_status2: "$.data.status"}
            - call: "POST /fence-rentals/permits/${pm_id}/municipal-decision"
              payload: { decision: "REQUEST_REVISION", required_change_summary: "add pedestrian canopy detail" }
              as: MunicipalLiaison
              as_user_id: "ml-001"
              captures: { pm_round2: "$.data.revision_round"}
            - call: "POST /fence-rentals/permits/${pm_id}/submit"
              payload: {}
              as: MunicipalLiaison
              as_user_id: "ml-001"
              captures: { pm_status3: "$.data.status"}
            - call: "POST /fence-rentals/permits/${pm_id}/municipal-decision"
              payload: { decision: "REQUEST_REVISION", required_change_summary: "restate the traffic-control plan" }
              as: MunicipalLiaison
              as_user_id: "ml-001"
              captures: { pm_round3: "$.data.revision_round", pm_submitted_at: "$.data.submitted_at_utc"}
          trigger:
            - call: "POST /fence-rentals/permits/${pm_id}/submit"
              payload: {}
              as: MunicipalLiaison
              as_user_id: "ml-001"
          assert:
            - "the trigger response status code is 409"
            - "the trigger response error_id == ERR_PERMIT_REVISION_LIMIT"
            - "PermitApplication.${pm_id}.status == REVISION_REQUESTED"
            - "PermitApplication.${pm_id}.revision_round == 3"
            - "PermitApplication.${pm_id}.required_change_summary == restate the traffic-control plan"
            - "the captured pm_status0 == DRAFT"
            - "the captured pm_status1 == SUBMITTED"
            - "the captured pm_status2 == SUBMITTED"
            - "the captured pm_status3 == SUBMITTED"
            - "the captured pm_round1 == 1"
            - "the captured pm_round2 == 2"
            - "the captured pm_round3 == 3"
            - "PermitApplication.${pm_id}.submitted_at_utc equals the captured pm_submitted_at (the refused resubmission did not restamp it)"
            - "Municipality.${m1_id}.committed_closure_linear_feet == 0"

      - name: contract_parallel_dimensions_advance_independently
        grounds:
          - state_machines.RentalContract.PENDING_MOBILIZATION_to_ACTIVE
          - state_machines.RentalContract.billing_CURRENT_to_PAST_DUE
          - state_machines.RentalContract.ACTIVE_to_DEMOBILIZING
          - state_machines.RentalContract.billing_to_SETTLED
          - state_machines.RentalContract.DEMOBILIZING_to_CLOSED
          - entities.RentalContract.fields.lifecycle_status
          - entities.RentalContract.fields.billing_status
        distinguishing_aspect: |
          lifecycle_status and billing_status advance on disjoint triggers over the
          same contract: an overdue billing run moves billing CURRENT -> PAST_DUE
          while lifecycle stays ACTIVE, a completed removal moves lifecycle
          ACTIVE -> DEMOBILIZING while billing stays PAST_DUE, and only the pairing
          of a fully-PAID ledger (SETTLED) with a FINALIZED reconciliation yields
