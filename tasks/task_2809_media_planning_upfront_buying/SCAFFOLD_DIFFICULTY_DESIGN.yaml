      - name: preemption_reverses_inventory_hold_without_touching_committed_money
        grounds:
          - state_machines.BuyUnit.SCHEDULED_to_PREEMPTED
          - state_machines.BuyUnit.SCHEDULED_to_AIRED
          - state_machines.InventoryForecast.EXHAUSTED_to_PUBLISHED
          - state_machines.Buy.stewardship_status.NOT_STARTED_to_AT_RISK
          - entities.Buy.fields.placed_impressions
          - entities.ChannelAllocation.fields.committed_cents
        distinguishing_aspect: |
          Preempting one of two 20,000,000 impression lines reverses exactly the inventory
          ledger - the avail goes from 0 available and EXHAUSTED back to 20,000,000 and
          PUBLISHED, placed_impressions drops to 20,000,000 and stewardship_status becomes
          AT_RISK - while the money ledger must not move at all: the buy still costs
          91,520,000 cents and the allocation still shows 91,520,000 committed. Settling the
          sibling line AIRED then releases nothing, proving only the PREEMPTED outcome
          compensates.
        test_recipe:
          setup:
            - "an APPROVED 200,000,000 cent campaign with one 100 percent LINEAR_TV UPFRONT PRIME allocation and one PUBLISHED avail of exactly 40,000,000 impressions"
            - "a PLACED buy guaranteeing 40,000,000 impressions at CPM 2200 (gross 91,520,000) split into two 20-unit lines of 20,000,000 projected impressions each, which together exhaust the avail"
            - "the logical clock advanced to 2026-12-01T00:00:00Z so both air windows have elapsed"
