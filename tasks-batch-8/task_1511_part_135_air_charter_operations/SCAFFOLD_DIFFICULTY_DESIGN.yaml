            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_o2}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KTEB", destination_icao: "KLAX", block_minutes: 60, fuel_stop: false }, as: SalesAgent }
