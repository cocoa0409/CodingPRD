          - errors.ERR_APPEAL_WINDOW_EXPIRED
        distinguishing_aspect: "The 30-day appeal window is inclusive: an appeal at exactly decided_at + 30 days succeeds (APPEALED), while a second complaint's appeal one second past its deadline fails 422 ERR_APPEAL_WINDOW_EXPIRED."
        test_recipe:
          setup:
