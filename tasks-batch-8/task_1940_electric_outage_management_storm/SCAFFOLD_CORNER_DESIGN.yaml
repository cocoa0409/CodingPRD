  - section: consistency_model
    instances:
      - name: immediate_read_after_write_consistency
        claim_type: immediate
        grounds:
          - state_machines.WorkOrder.READY_to_DISPATCHED
          - state_machines.Crew.AVAILABLE_to_EN_ROUTE
        distinguishing_aspect: "Immediate consistency: the assign RESPONSE itself carries execution_status DISPATCHED and assigned_crew_id, and a directly-following GET of the crew shows EN_ROUTE — no delay, no recompute endpoint."
        test_recipe:
          setup: ["Outage confirmed; assessment accepted; REPAIR/LINE work order READY; crew L-1 AVAILABLE"]
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
            - call: "POST /om/storm-events"
