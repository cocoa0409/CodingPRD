              as: RefugeManager
              captures: { u1: $.data.id }
            - call: "POST /refuge/determinations"
              payload: { use_type: "COMMERCIAL_FILMING", title: "Filming", comment_open_date: "2026-09-05", comment_close_date: "2026-09-20" }
              as: PermitOfficer
              captures: { d1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: RefugeManager
            - call: "POST /refuge/determinations/${d1}/open-comment"
              payload: {}
              as: PermitOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T00:00:00Z" }
