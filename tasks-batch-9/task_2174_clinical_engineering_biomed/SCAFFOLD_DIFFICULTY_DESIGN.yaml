              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { m1_id: $.data.id }
            - call: "POST /clinical-engineering/service-contracts"
              payload: { vendor_id: "${v1_id}", device_model_id: "${m1_id}", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2026-06-30T00:00:00Z", annual_premium_cents: 1200000, deductible_cents: 25000, covered_event_cap: 2 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { sc1_id: $.data.id }
          trigger:
            - call: "POST /clinical-engineering/service-contracts"
              payload: { vendor_id: "${v1_id}", device_model_id: "${m1_id}", coverage_start: "2026-06-30T00:00:00Z", coverage_end: "2026-12-31T00:00:00Z", annual_premium_cents: 1300000, deductible_cents: 20000, covered_event_cap: 3 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { err: $.data.error_id }
            - call: "POST /clinical-engineering/service-contracts"
              payload: { vendor_id: "${v1_id}", device_model_id: "${m1_id}", coverage_start: "2026-07-01T00:00:00Z", coverage_end: "2026-12-31T00:00:00Z", annual_premium_cents: 1300000, deductible_cents: 20000, covered_event_cap: 3 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { sc2_id: $.data.id }
          assert:
            - "touching create: HTTP status == 409 and data.error_id == ERR_CONTRACT_COVERAGE_OVERLAP"
            - "next-day create: HTTP status == 201 and ServiceContract.${sc2_id}.status == ACTIVE"
            - "GET /clinical-engineering/service-contracts?vendor_id=${v1_id}&device_model_id=${m1_id} returns exactly 2 elements"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: work_order_cancel_conserves_department_downtime_spend
        grounds:
          - state_machines.WorkOrder.IN_REPAIR_to_CANCELLED
          - state_machines.LoanerAssignment.DEPLOYED_to_CANCELLED
          - calculations.department_downtime_debit
          - entities.Department.fields.downtime_spend_cents
          - entities.Device.fields.lifetime_maintenance_cost_cents
        distinguishing_aspect: |
          Conserved quantity #1 is MONEY, pinned as the formula
          Department.downtime_spend_cents == SUM(WorkOrder.department_charge_cents over
          WorkOrder rows on this department's devices with status == CLOSED). Intake +
          assign + pool loaner + cancel is a forward action paired with its compensation, so
          the sum stays 0 with zero drift and Device.lifetime_maintenance_cost_cents stays 0.
        test_recipe:
          setup:
            - "A department with downtime_budget_cents 5000000 and zero spend."
            - "A downed monitor with a work order at IN_REPAIR and a DEPLOYED pool loaner covering it."
          setup_api_calls:
            - call: "POST /clinical-engineering/facilities"
              payload: { name: "Riverbend Medical Center", facility_code: "RMC-01", pm_compliance_target_pct: 90.00 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { f_id: $.data.id }
            - call: "POST /clinical-engineering/departments"
              payload: { facility_id: "${f_id}", name: "Telemetry Unit", cost_center_code: "CC-5200", downtime_budget_cents: 5000000 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { dept_id: $.data.id }
            - call: "POST /clinical-engineering/device-models"
              payload: { manufacturer: "GE", model_number: "CAM-500", device_family: "PATIENT_MONITOR", expected_life_years: 10, replacement_cost_cents: 1500000, is_network_connected: false }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { m2_id: $.data.id }
            - call: "POST /clinical-engineering/devices"
              payload: { facility_id: "${f_id}", department_id: "${dept_id}", device_model_id: "${m2_id}", serial_number: "SN-2001", acquisition_date: "2019-03-01", acquisition_cost_cents: 1400000, function_code: 5, physical_risk_code: 3, maintenance_requirement_code: 2, condition_score: 4 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { devb_id: $.data.id }
            - call: "POST /clinical-engineering/devices"
              payload: { facility_id: "${f_id}", department_id: "${dept_id}", device_model_id: "${m2_id}", serial_number: "SN-2002", acquisition_date: "2023-01-10", acquisition_cost_cents: 1450000, function_code: 5, physical_risk_code: 3, maintenance_requirement_code: 2, condition_score: 2, is_loaner_pool: true }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { devpool_id: $.data.id }
            - call: "POST /clinical-engineering/work-orders"
              payload: { device_id: "${devb_id}", reported_severity: "ROUTINE", problem_summary: "Reported drift, later found in spec" }
              as: DeptSteward
              as_user_id: "${dept_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /clinical-engineering/work-orders/${wo_id}/assign"
              payload: { service_mode: "IN_HOUSE" }
              as: BiomedTech
              as_user_id: "tech-alpha"
              captures: { wo_v: $.data.version }
            - call: "POST /clinical-engineering/loaner-assignments"
              payload: { work_order_id: "${wo_id}", source: "POOL", loaner_device_id: "${devpool_id}", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-08T00:00:00Z", expected_work_order_version: "${wo_v}" }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { la_id: $.data.id }
            - call: "POST /clinical-engineering/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:00Z" }
              as: CEManager
              as_user_id: "ce-mgr-01"
          trigger:
            - call: "POST /clinical-engineering/work-orders/${wo_id}/cancel"
              payload: { reason: "Duplicate of an already-resolved report" }
              as: CEManager
              as_user_id: "ce-mgr-01"
          assert:
            - "WorkOrder.${wo_id}.status == CANCELLED"
            - "WorkOrder.${wo_id}.final_cost_cents == 0 and WorkOrder.${wo_id}.department_charge_cents == 0"
            - "Department.${dept_id}.downtime_spend_cents == 0"
            - "Department.${dept_id}.budget_state == OPEN"
            - "LoanerAssignment.${la_id}.status == CANCELLED"
            - "LoanerAssignment.${la_id}.billable_days == 0 and LoanerAssignment.${la_id}.rental_cost_cents == 0"
            - "Device.${devpool_id}.operational_state == IN_SERVICE"
            - "Device.${devb_id}.operational_state == IN_SERVICE"
            - "Device.${devb_id}.lifetime_maintenance_cost_cents == 0"

      - name: loaner_return_restores_pool_available_unit_count
        grounds:
          - state_machines.LoanerAssignment.DEPLOYED_to_RETURNED
          - state_machines.Device.IN_SERVICE_to_ON_LOAN
          - state_machines.Device.ON_LOAN_to_IN_SERVICE
          - calculations.loaner_pool_selection
          - entities.Device.fields.is_loaner_pool
        distinguishing_aspect: |
          Conserved quantity #2 is CAPACITY (a unit count, not money), pinned as
          COUNT(Device WHERE facility_id == F AND is_loaner_pool == true AND
          operational_state == IN_SERVICE). Deploying a server-selected pool unit drops it
          from 2 to 1 and the return restores it to exactly 2, with no money moving in either
          direction because a POOL loaner always prices at 0.
        test_recipe:
          setup:
            - "Two same-model pool units at one facility, condition_score 2 and 4, so the pinned ranking (condition_score ASC) selects the first."
            - "A downed monitor with a work order at IN_REPAIR and no loaner_device_id supplied on the request."
          setup_api_calls:
            - call: "POST /clinical-engineering/facilities"
              payload: { name: "Riverbend Medical Center", facility_code: "RMC-01", pm_compliance_target_pct: 90.00 }
