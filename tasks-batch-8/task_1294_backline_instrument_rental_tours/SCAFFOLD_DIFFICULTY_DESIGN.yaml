  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers, depths >= 3 and >= 2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: stop_loadout_cascade_depth3
        grounds:
          - state_machines.TourStop.SHOW_READY_to_LOADED_OUT
          - state_machines.ReservationLine.DELIVERED_to_RETURNED
          - state_machines.GearUnit.OUT_ON_RENTAL_to_MAINTENANCE
          - calculations.maintenance_cycle_gate
        distinguishing_aspect: |
          Depth-3 chain triggered by stop load-out: TourStop SHOW_READY ->
          LOADED_OUT causes ReservationLine DELIVERED -> RETURNED, whose
          check-in itself causes GearUnit OUT_ON_RENTAL -> MAINTENANCE via
          maintenance_cycle_gate, which itself causes a MaintenanceTicket to
          be opened (4 observable mutations, 3 causal hops, no fan-out).
        test_recipe:
          setup:
            - "Unit with rental_days_since_service 25 (pre-accumulated by an earlier 25-day rental that returned clean) rented again for 5 days -> projected 30 >= 30 trips gate at this load-out"
            - "Stop in SHOW_READY: rider line FULFILLED, reservation DELIVERED"
