            - { call: "POST /records/requests", payload: { requester_id: "${requester_id}", received_at: "2026-08-01T00:00:00Z", subject_incident_number: "INC-2026-0649", requested_date_from: "2026-07-13T00:00:00Z", requested_date_to: "2026-07-14T00:00:00Z", scope_narrative: "All BWC video for INC-2026-0649" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { req_id: $.data.id, req_v1: $.data.version } }
            - { call: "POST /records/requests/${req_id}/scope-clarification", payload: { scope_narrative: "Two-hour continuous recording", requested_date_from: "2026-07-13T00:00:00Z", requested_date_to: "2026-07-13T23:59:59Z", expected_request_version: "${req_v1}" }, as: RecordsClerk, as_user_id: "clerk-1" }
            - { call: "POST /records/requests/${req_id}/responsive-records", payload: { video_asset_id: "${asset_id}" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { rec_id: $.data.id } }
            - { call: "POST /records/responsive-records/${rec_id}/inclusion", payload: { inclusion_status: "RESPONSIVE" }, as: RecordsClerk, as_user_id: "clerk-1" }
            - { call: "GET /records/requests/${req_id}", as: RecordsClerk, as_user_id: "clerk-1", captures: { req_version: $.data.version } }
            - { call: "POST /records/requests/${req_id}/fee-estimates", payload: { basis: "PRESUMPTIVE", media_type: "DVD", expected_request_version: "${req_version}" }, as: RecordsClerk, as_user_id: "clerk-1" }
            - { call: "POST /records/requests/${req_id}/payments", payload: { amount_cents: 3060, memo: "Deposit in full" }, as: Requester, as_user_id: "${requester_id}", captures: { entry_one: $.data.id } }
          trigger:
            - { call: "POST /records/fee-ledger-entries/${entry_one}/reversal", payload: { memo: "Card chargeback" }, as: RecordsSupervisor, as_user_id: "supv-1", captures: { rev_one: $.data.id } }
            - { call: "POST /records/fee-ledger-entries/${entry_one}/reversal", payload: { memo: "Second chargeback attempt" }, as: RecordsSupervisor, as_user_id: "supv-1", captures: { e_already: $.data.error_id } }
            - { call: "POST /records/fee-ledger-entries/${rev_one}/reversal", payload: { memo: "Un-reverse the reversal" }, as: RecordsSupervisor, as_user_id: "supv-1", captures: { e_is_reversal: $.data.error_id } }
          assert:
            - "first response: HTTP 201, FeeLedgerEntry.${rev_one}.entry_type == REVERSAL, source_kind == ADJUSTMENT, amount_cents == -3060 and reverses_entry_id == ${entry_one}"
            - "second response: HTTP 409 and ${e_already} == ERR_ENTRY_ALREADY_REVERSED (the target already carries a reversal)"
            - "third response: HTTP 409 and ${e_is_reversal} == ERR_ENTRY_ALREADY_REVERSED (a REVERSAL entry is not itself reversible)"
            - "FeeLedgerEntry.${entry_one} is unchanged: entry_type == DEPOSIT_PAYMENT and amount_cents == 3060 — the ledger is append-only"
            - "PublicRecordsRequest.${req_id}: deposit_paid_cents == 0 and deposit_balance_cents == 0, restoring the exact pre-payment values"
            - "PublicRecordsRequest.${req_id}.fee_status == DEPOSIT_PAID — the only declared fee regression is SETTLED -> INVOICED, so a deposit reversal does not reopen DEPOSIT_DUE"
            - "GET /records/fee-ledger-entries?request_id=${req_id} returns total_count == 2 in created_at ASC order, and GET /records/fee-ledger-entries?reverses_entry_id=${entry_one} returns total_count == 1"
