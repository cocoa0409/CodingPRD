                effective_date: "2026-05-01T00:00:00Z"
                expiry_date: "2026-12-31T00:00:00Z"
                payroll_basis_cents: 10000000
              as: BrokerAgent
              captures: { pol_id: $.data.id }
            - call: "GET /productions/${prod_id}"
              payload: {}
              as: BrokerAgent
              captures: { prod_v: $.data.version }
            - call: "POST /productions/${prod_id}/policies/${pol_id}/bind"
              payload: { expected_production_version: "${prod_v}" }
              as: BrokerAgent
            - call: "POST /productions/${prod_id}/activate"
