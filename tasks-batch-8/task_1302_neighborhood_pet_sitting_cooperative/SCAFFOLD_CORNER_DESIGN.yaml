              as: CoopAdmin
              captures: { req_status: $.data.status, req_v2: $.data.version }
            - *get_asg
          assert:
            - "Accept response: claim status == ACCEPTED with decided_at set"
            - "Immediate GET: SittingRequest.${req_id}.status == ASSIGNED and version == 2"
            - "Immediate GET assignment: array length 1, status CONFIRMED, sitter_member_id == ${f2_id} (cascade visible atomically)"
