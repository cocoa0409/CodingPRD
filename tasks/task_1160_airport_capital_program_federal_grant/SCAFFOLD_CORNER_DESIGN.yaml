              payload: { sponsor_id: "${sp}", fiscal_year: 2027 }
              as: FinanceOfficer
              as_user_id: "user-fin-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 with error_id == ERR_FORBIDDEN"

      - name: assurance_self_certify_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=21]", "errors[ERR_SOD_VIOLATION]", state_machines.SponsorAssurance.PENDING_to_CERTIFIED]
        distinguishing_aspect: "Segregation of duties: the certifier's X-User-ID equal to application.created_by_user_id is rejected with ERR_SOD_VIOLATION even though the role is correct."
