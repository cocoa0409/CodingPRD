# =============================================================================
# §1.9 Scaffold Corner Design — task 2502 Premium Sports Hospitality Packages
#
# Breadth probe over the claim-extraction-guide's nine sections. Depth (the
# nine §0.5 Difficulty Rules) lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml; corners
# that file already asserts appear here as `excluded_because:` stubs.
#
# SHARED FIXTURE VOCABULARY (distinct from §1.8's canonical GOLD package —
# §1.9 uses a deliberately round-numbered BRONZE package so that every corner
# assert is a short literal):
#
#   logical clock start .... 2026-08-01T00:00:00Z (the declared startup default)
#   canonical fixture ...... name "Continental Cup Final", sport FOOTBALL,
#                            venue "Meridian Stadium",
#                            hospitality_zone_codes ["ZONE_A", "ZONE_B"],
#                            event_date 2027-02-01T15:00:00.000Z
#                            => days_to_event 184 at the clock start
#   simple BRONZE package .. tier BRONZE (TIER_MULTIPLIER 1.0),
#                            tickets_per_package 2, min_margin_pct 0.1000,
#                            one component: seq 1 TICKET qty 2
#                            unit_cost_cents 50000 markup_pct 0.2000
#                            => line_cost 100000, line_price 120000,
#                               base_cost 100000, subtotal 120000,
#                               list_price 120000, margin_pct 0.1667
#   net prices at list 120000 (no guarantee exposure):
#                            4 CORPORATE  ->  465600  (volume_discount_pct 0)
#                            5 CORPORATE  ->  558720  (0.0400)
#                           10 CORPORATE  -> 1070880  (0.0800)
#                           15 CORPORATE  -> 1606320
#                           15 INDIVIDUAL -> 1656000
#                            1 CORPORATE  ->  116400
#   net prices WITH exposure (a TICKET deal still owing units):
#                            5 CORPORATE  ->  587520  (surcharge 0.0500)
#                           10 CORPORATE  -> 1109520  (surcharge 0.0350)
#   schedules (days_to_event >= 30):
#                            558720  -> [167616, 223488, 167616]
#                            587520  -> [176256, 235008, 176256]
#                           1070880  -> [321264, 428352, 321264]
#   operator ids ........... u_ops, u_rights, u_pricer, u_director, u_csa, u_fin
#   nil id ................. 00000000-0000-0000-0000-000000000000
#                            (well-formed UUID that matches no row)
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 — entities (§1.1 field-level claims + the `flat` topology row)
  # ===========================================================================
  - section: entities
    instances:

      - name: create_event_returns_201_with_every_declared_default
        claim_type: creation
        grounds: >-
          entities.Event (all input, system and computed fields with their
          declared defaults); endpoints "POST /events" (code 201, input
          [name, sport, venue_name, hospitality_zone_codes, event_date],
          side_effects "status = SCHEDULED; fulfillment_risk_score = 0;
          risk_posture = NORMAL"); response_envelope.success.
        distinguishing_aspect: >-
          Pins the create-time value of every field the caller did NOT supply:
          status SCHEDULED, postponement_count 0, fulfillment_risk_score 0,
          risk_posture NORMAL, and — the easy one to get wrong —
          original_event_date NULL rather than a copy of event_date, because
          §1.2's postpone transition is the only writer of that field ("set when
          original_event_date is null, never overwritten afterwards"). An
          implementation that pre-fills it at creation makes the postpone
          cascade unable to distinguish a first postponement from a later one.
        test_recipe:
          setup: "Empty database with the logical clock at its startup default."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
          trigger:
            - call: "POST /events"
              payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }
              as: RightsManager
              as_user_id: u_rights
              captures: { ev_id: "$.data.id", st: "$.data.status", score: "$.data.fulfillment_risk_score", posture: "$.data.risk_posture", pc: "$.data.postponement_count", orig: "$.data.original_event_date", deadline: "$.data.rebook_deadline_at", ver: "$.data.version" }
          assert: >-
            HTTP 201. ${st} == "SCHEDULED", ${score} == 0,
            ${posture} == "NORMAL", ${pc} == 0, ${orig} == null,
            ${deadline} == null, ${ver} == 1.
            The echoed inputs are unchanged: name == "Continental Cup Final",
            sport == "FOOTBALL", venue_name == "Meridian Stadium",
            hospitality_zone_codes == ["ZONE_A", "ZONE_B"] (order preserved) and
            event_date == "2027-02-01T15:00:00.000Z".
            The success envelope carries meta.api_request_id,
            meta.api_request_timestamp and response_type == "object".
            GET /events/${ev_id} returns the identical field values.

      - name: get_rights_deal_returns_the_stored_committed_representation
        claim_type: retrieval
        grounds: >-
          endpoints "GET /rights-deals/{id}" (output RightsDeal);
          state_machines.RightsDeal DRAFT -> COMMITTED side effects
          (committed_by_user_id = X-User-ID, recompute minimum_liability_cents);
          calculations.rights_deal_minimum_liability with
          SHORTFALL_LIABILITY_PCT 0.60; entities.RightsDeal.
        distinguishing_aspect: >-
          The read must return the persisted post-commit row, not a re-derivation
          of the create-time body: deal_status COMMITTED,
          committed_by_user_id == the committing operator's X-User-ID (u_rights,
          not the reader), minimum_liability_cents 96000 and version 2 (create 1,
          commit 2). A stateless "recompute on read" implementation that ignores
          committed_by_user_id or leaves version at 1 diverges.
        test_recipe:
          setup: "One fixture with one COMMITTED 20-unit TICKET deal guaranteeing all 20 units at 8000 cents."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
            - call: "POST /rights-deals"
              payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 20, guaranteed_minimum_units: 20, unit_cost_cents: 8000 }
              as: RightsManager
              as_user_id: u_rights
              captures: { deal_id: "$.data.id", v_created: "$.data.version", st_created: "$.data.deal_status", ml_created: "$.data.minimum_liability_cents" }
            - { call: "POST /rights-deals/${deal_id}/commit", payload: {}, as: RightsManager, as_user_id: u_rights }
          trigger:
            - call: "GET /rights-deals/${deal_id}"
              payload: {}
              as: FinanceController
              as_user_id: u_fin
              captures: { st: "$.data.deal_status", ml: "$.data.minimum_liability_cents", sf: "$.data.shortfall_units", rel: "$.data.released_units", unalloc: "$.data.unallocated_units", by: "$.data.committed_by_user_id", ver: "$.data.version", settled: "$.data.settled_at" }
          assert: >-
            HTTP 200. ${st_created} == "DRAFT", ${ml_created} == 0 and
            ${v_created} == 1 at creation.
            After the commit the read returns ${st} == "COMMITTED",
            ${rel} == 0, ${sf} == 20, ${unalloc} == 0,
            ${ml} == 96000 (= 0 * 8000 + 20 * round_half_up(8000 * 0.60)),
            ${by} == "u_rights" (the committing operator, not the reading
            FinanceController), ${settled} == null and ${ver} == 2.
            event_id == ${ev_id}, contracted_units == 20,
            guaranteed_minimum_units == 20, unit_cost_cents == 8000 and
            inventory_type == "TICKET" are echoed unchanged.

      - name: list_release_tranches_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds: >-
          endpoints "GET /release-tranches" (input
          [rights_deal_id?, tranche_state?, limit?, offset?], output
          ReleaseTranche[]); response_envelope.pagination_fields
          [limit, offset, total_count, has_more] and pagination_defaults
          (limit 10, min 1, max 100, offset 0).
        distinguishing_aspect: >-
          Three tranches on one deal read back through two pages of size 2:
          page one carries total_count 3 with has_more true, page two carries
          total_count 3 with has_more false and exactly one row. total_count is
          the FILTERED total (all three belong to the queried deal) and has_more
          is derived from offset + returned vs total_count — an implementation
          that returns the page length as total_count, or that computes has_more
          from the page being full, gets page two wrong.
        test_recipe:
          setup: "One COMMITTED 20-unit deal carrying three PENDING 5-unit tranches (sum 15 <= contracted 20, so priority 67 passes)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
            - { call: "POST /rights-deals", payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 20, guaranteed_minimum_units: 20, unit_cost_cents: 8000 }, as: RightsManager, as_user_id: u_rights, captures: { deal_id: "$.data.id" } }
            - { call: "POST /rights-deals/${deal_id}/commit", payload: {}, as: RightsManager, as_user_id: u_rights }
            - { call: "POST /release-tranches", payload: { rights_deal_id: "${deal_id}", promised_units: 5, promised_release_at: "2026-09-01T00:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { t1: "$.data.id" } }
            - { call: "POST /release-tranches", payload: { rights_deal_id: "${deal_id}", promised_units: 5, promised_release_at: "2026-10-01T00:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { t2: "$.data.id" } }
            - { call: "POST /release-tranches", payload: { rights_deal_id: "${deal_id}", promised_units: 5, promised_release_at: "2026-11-01T00:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { t3: "$.data.id" } }
          trigger:
            - { call: "GET /release-tranches", payload: { rights_deal_id: "${deal_id}", limit: 2, offset: 0 }, as: RightsManager, as_user_id: u_rights, captures: { p1_first: "$.data[0].id", p1_second: "$.data[1].id" } }
            - { call: "GET /release-tranches", payload: { rights_deal_id: "${deal_id}", limit: 2, offset: 2 }, as: RightsManager, as_user_id: u_rights, captures: { p2_first: "$.data[0].id" } }
          assert: >-
            Page one: HTTP 200, exactly 2 rows, limit == 2, offset == 0,
            total_count == 3, has_more == true, response_type == "array".
            Page two: HTTP 200, exactly 1 row, limit == 2, offset == 2,
            total_count == 3, has_more == false.
            The three returned ids ${p1_first}, ${p1_second} and ${p2_first} are
            pairwise distinct and their set equals {${t1}, ${t2}, ${t3}};
            every row has rights_deal_id == ${deal_id}, tranche_state
            "PENDING", promised_units 5 and confirmed_units 0.
            GET /release-tranches?rights_deal_id=${deal_id}&tranche_state=CONFIRMED
            returns total_count 0 with an empty data array, so the
            tranche_state filter and the pagination counters compose.

      - name: create_package_component_missing_markup_pct_returns_invalid_request
        claim_type: required_fields
        grounds: >-
          endpoints "POST /package-components" (input [package_product_id,
          component_type, descriptor, quantity, unit_cost_cents, markup_pct,
          sequence_no] — every one required, none defaulted in
          entities.PackageComponent); validations[priority=4]
          ERR_INVALID_REQUEST (400) "every required field for the endpoint is
          present"; errors[ERR_INVALID_REQUEST].
        distinguishing_aspect: >-
          markup_pct has NO default in §1.1 (unlike PackageProduct.hotel_nights
          or Client.credit_limit_cents), so omitting it is a 400 rather than a
          silent 0.0000 markup. The same request with markup_pct 0.2000 present
          succeeds with line_price_cents 120000, which shows the rejection was
          about presence and not about the value: had the server defaulted the
          field to 0, the accepted line would have priced at 100000.
        test_recipe:
          setup: "One fixture with one DRAFT BRONZE package and no components yet."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
            - { call: "POST /package-products", payload: { event_id: "${ev_id}", name: "Bronze Hospitality", tier: "BRONZE", tickets_per_package: 2, min_margin_pct: 0.1000 }, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_id: "$.data.id" } }
          trigger:
            - call: "POST /package-components"
              payload: { package_product_id: "${pkg_id}", component_type: "TICKET", descriptor: "Category 1 seat pair", quantity: 2, unit_cost_cents: 50000, sequence_no: 1 }
              as: CommercialManager
              as_user_id: u_pricer
              captures: { err: "$.data.error_id" }
            - call: "POST /package-components"
              payload: { package_product_id: "${pkg_id}", component_type: "TICKET", descriptor: "Category 1 seat pair", quantity: 2, unit_cost_cents: 50000, markup_pct: 0.2000, sequence_no: 1 }
              as: CommercialManager
              as_user_id: u_pricer
              captures: { comp_id: "$.data.id", lc: "$.data.line_cost_cents", lp: "$.data.line_price_cents" }
          assert: >-
            First call: HTTP 400 with ${err} == "ERR_INVALID_REQUEST" and
            response_type == "error"; the envelope carries data.message.
            Nothing was written — after the rejection
            GET /package-components?package_product_id=${pkg_id} returns
            total_count 0.
            Second call: HTTP 201 with ${lc} == 100000 and ${lp} == 120000
            (= round_half_up(100000 * 1.2000)), so sequence_no 1 was still free
            and the first attempt left no partial row.
            The parent package is untouched by component creation:
            GET /package-products/${pkg_id} still has package_status "DRAFT",
            base_cost_cents 0, component_price_subtotal_cents 0,
            list_price_cents 0 and margin_pct 0.

      - name: omitted_optional_inputs_apply_their_declared_defaults
        claim_type: defaults
        grounds: >-
          entities.PackageProduct.hotel_nights (default 0),
          transport_included (default false), min_margin_pct (default 0.25);
          entities.Client.credit_limit_cents (default 0);
          entities.OnSiteHost.max_concurrent_bookings (default 1);
          endpoints "POST /package-products" (hotel_nights?,
          transport_included?, min_margin_pct?), "POST /clients"
          (credit_limit_cents?), "POST /on-site-hosts"
          (max_concurrent_bookings?).
        distinguishing_aspect: >-
          Each default is a non-obvious value that changes downstream behaviour,
          so a wrong default is observable rather than cosmetic: min_margin_pct
          defaults to 0.25 (not 0), which would block publishing the simple
          BRONZE package whose margin is 0.1667; credit_limit_cents defaults to 0
          (not unlimited), which makes any booking for that client fail the
          priority-82 credit gate; max_concurrent_bookings defaults to 1 (not 0
          and not unlimited), which is what makes a second overlapping shift a
          capacity violation. The instance asserts the three defaults directly
          rather than through their consequences.
        test_recipe:
          setup: "One fixture, nothing else."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
          trigger:
            - call: "POST /package-products"
              payload: { event_id: "${ev_id}", name: "Bare Bones Package", tier: "BRONZE", tickets_per_package: 2 }
              as: CommercialManager
              as_user_id: u_pricer
              captures: { pkg_id: "$.data.id", nights: "$.data.hotel_nights", transport: "$.data.transport_included", floor: "$.data.min_margin_pct", pstat: "$.data.package_status" }
            - call: "POST /clients"
              payload: { name: "Walk-in Buyer", client_type: "INDIVIDUAL" }
              as: ClientServiceAgent
              as_user_id: u_csa
              captures: { cl_id: "$.data.id", limit: "$.data.credit_limit_cents", cstat: "$.data.client_status", outstanding: "$.data.outstanding_cents", overdue: "$.data.overdue_installment_count" }
            - call: "POST /on-site-hosts"
              payload: { full_name: "Alina Petrova", languages: ["EN", "IT"] }
              as: OperationsManager
              as_user_id: u_ops
              captures: { host_id: "$.data.id", cap: "$.data.max_concurrent_bookings", acount: "$.data.active_assignment_count" }
          assert: >-
            All three calls return HTTP 201.
            Package: ${nights} == 0, ${transport} == false,
            ${floor} == 0.2500, ${pstat} == "DRAFT".
            Client: ${limit} == 0, ${cstat} == "ACTIVE", ${outstanding} == 0,
            ${overdue} == 0.
            Host: ${cap} == 1, ${acount} == 0.
            Re-reading each row confirms persistence:
            GET /package-products?event_id=${ev_id} returns the row ${pkg_id}
            with min_margin_pct 0.2500, GET /clients/${cl_id} has
            credit_limit_cents 0 and GET /on-site-hosts/${host_id} has
            max_concurrent_bookings 1.

      - name: rights_deal_exposure_fields_are_computed_not_supplied
        claim_type: computed_fields
        grounds: >-
          entities.RightsDeal.released_units / shortfall_units /
          unallocated_units / minimum_liability_cents (all source: computed,
          none present in "POST /rights-deals".input);
          calculations.rights_deal_minimum_liability;
          state_machines.ReleaseTranche PENDING -> CONFIRMED side effects.
        distinguishing_aspect: >-
          The four exposure fields are absent from the create endpoint's input
          list, so the only way they can hold 20 / 0 / 20 / 160000 after a
          confirmation is derivation from the tranche ledger. The instance walks
          all three of their values (creation, commitment, confirmation) with a
          single deal, which also pins the `>=` boundary of the shortfall branch:
          released_units 20 against guaranteed_minimum_units 20 leaves
          shortfall_units 0, so minimum_liability_cents collapses from 96000
          (all-shortfall) to 160000 (all-released) — a bigger number reached by a
          different term, which no "keep the larger of the two" shortcut
          reproduces.
        test_recipe:
          setup: "One fixture with one 20-unit TICKET deal guaranteeing 20 units at 8000 cents, plus a single 20-unit promised release."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
            - call: "POST /rights-deals"
              payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 20, guaranteed_minimum_units: 20, unit_cost_cents: 8000 }
              as: RightsManager
              as_user_id: u_rights
              captures: { deal_id: "$.data.id", rel0: "$.data.released_units", sf0: "$.data.shortfall_units", un0: "$.data.unallocated_units", ml0: "$.data.minimum_liability_cents" }
            - { call: "POST /rights-deals/${deal_id}/commit", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { sf1: "$.data.shortfall_units", ml1: "$.data.minimum_liability_cents" } }
            - { call: "POST /release-tranches", payload: { rights_deal_id: "${deal_id}", promised_units: 20, promised_release_at: "2026-10-01T00:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { tr_id: "$.data.id" } }
            - { call: "GET /rights-deals/${deal_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { deal_v: "$.data.version" } }
          trigger:
            - { call: "POST /release-tranches/${tr_id}/confirm", payload: { confirmed_units: 20, expected_rights_deal_version: "${deal_v}" }, as: RightsManager, as_user_id: u_rights, captures: { tstate: "$.data.tranche_state", cu: "$.data.confirmed_units" } }
            - call: "GET /rights-deals/${deal_id}"
              payload: {}
              as: RightsManager
              as_user_id: u_rights
              captures: { rel2: "$.data.released_units", sf2: "$.data.shortfall_units", un2: "$.data.unallocated_units", ml2: "$.data.minimum_liability_cents", st2: "$.data.deal_status" }
          assert: >-
            At creation: ${rel0} == 0, ${sf0} == 0, ${un0} == 0, ${ml0} == 0 —
            the computed fields start at their §1.1 defaults even though the
            request body could not have set them.
            After the commit: ${sf1} == 20 and ${ml1} == 96000
            (= 20 * round_half_up(8000 * 0.60)).
            After the confirmation: ${tstate} == "CONFIRMED", ${cu} == 20,
            ${st2} == "FULLY_RELEASED", ${rel2} == 20, ${sf2} == 0 (the `>=`
            boundary: 20 released against a 20-unit guarantee is not a
            shortfall), ${un2} == 20 (released but no AllocationBlock exists to
            absorb it — the empty-candidate fallback parks everything here with
            no error) and ${ml2} == 160000 (= 20 * 8000 + 0 * 4800).

      - name: system_fields_are_server_minted_and_version_advances_on_mutation
        claim_type: system_fields
        grounds: >-
          entities.Event common_fields (id server-minted UUID with no type
          prefix, created_at / updated_at ISO 8601 UTC with three fractional
          digits, version integer starting at 1 and incrementing on every
          mutation); state_machines.Event SCHEDULED -> POSTPONED;
          endpoints "POST /events/{id}/postpone".
        distinguishing_aspect: >-
          Separates the three system fields by their update rule across one
          mutation: id and created_at are frozen, updated_at is refreshed, and
          version advances by exactly 1 (not by 2 even though the postpone runs a
          multi-hop cascade over the same row, and not held at 1). The id is
          additionally asserted to be a bare 36-character UUID with no
          "evt_"-style prefix, which is what lets the OCC and FK rules use ids as
          pure identifiers.
        test_recipe:
          setup: "One fixture at the clock start."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - call: "POST /events"
              payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }
              as: RightsManager
              as_user_id: u_rights
              captures: { ev_id: "$.data.id", created0: "$.data.created_at", updated0: "$.data.updated_at", v0: "$.data.version" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T09:30:00Z" }
              as: OperationsManager
              as_user_id: u_ops
            - call: "POST /events/${ev_id}/postpone"
              payload: {}
              as: RightsManager
              as_user_id: u_rights
              captures: { ev_id2: "$.data.id", created1: "$.data.created_at", updated1: "$.data.updated_at", v1: "$.data.version", st1: "$.data.status", orig1: "$.data.original_event_date" }
          assert: >-
            ${v0} == 1 and ${created0} == ${updated0} == "2026-08-01T00:00:00.000Z"
            (the logical clock, three fractional digits, no timezone offset
            suffix other than Z).
            ${ev_id} is a 36-character UUID string containing no prefix and no
            underscore.
            After the postpone: ${ev_id2} == ${ev_id} and
            ${created1} == ${created0} (both frozen), while
            ${updated1} == "2026-08-02T09:30:00.000Z" (refreshed to the logical
            clock) and ${v1} == 2 — exactly one increment for the whole
            transition, cascade included.
            The transition itself landed: ${st1} == "POSTPONED",
            ${orig1} == "2027-02-01T15:00:00.000Z" (original_event_date is
            written on the FIRST postponement, from the pre-transition
            event_date) and rebook_deadline_at == "2026-08-23T09:30:00.000Z"
            (= logical_now + REBOOK_WINDOW_DAYS 21).

      - name: enum_and_numeric_constraints_are_rejected_before_persistence
        claim_type: type_constraints
        grounds: >-
          entities.RightsDeal.inventory_type (one of {TICKET,
          HOSPITALITY_SPACE, ACCESS_EXPERIENCE}), contracted_units (>= 1),
          unit_cost_cents (>= 1); entities.Event.hospitality_zone_codes
          (non-empty array of unique strings); validations[priority=4]
          ERR_INVALID_REQUEST (400) "every enum value is a declared member,
          every integer constraint (>= bounds ...) holds".
        distinguishing_aspect: >-
          Four separate constraint kinds on the same two endpoints, each rejected
          with the same 400 error_id but for a structurally different reason:
          an undeclared enum member, a zero where the floor is 1, a zero cost
          where the floor is 1, and an empty array where non-empty is required.
          The final accepted call uses the smallest legal values (contracted 1,
          unit_cost 1) to prove the bounds are inclusive at 1 rather than
          strictly greater.
        test_recipe:
          setup: "One fixture."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
          trigger:
            - { call: "POST /rights-deals", payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "SUITE", contracted_units: 20, guaranteed_minimum_units: 10, unit_cost_cents: 8000 }, as: RightsManager, as_user_id: u_rights, captures: { e_enum: "$.data.error_id" } }
            - { call: "POST /rights-deals", payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 0, guaranteed_minimum_units: 0, unit_cost_cents: 8000 }, as: RightsManager, as_user_id: u_rights, captures: { e_units: "$.data.error_id" } }
            - { call: "POST /rights-deals", payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 20, guaranteed_minimum_units: 10, unit_cost_cents: 0 }, as: RightsManager, as_user_id: u_rights, captures: { e_cost: "$.data.error_id" } }
            - { call: "POST /events", payload: { name: "Zoneless Fixture", sport: "TENNIS", venue_name: "Meridian Arena", hospitality_zone_codes: [], event_date: "2027-03-01T12:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { e_zones: "$.data.error_id" } }
            - { call: "POST /rights-deals", payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "ACCESS_EXPERIENCE", contracted_units: 1, guaranteed_minimum_units: 0, unit_cost_cents: 1 }, as: RightsManager, as_user_id: u_rights, captures: { ok_id: "$.data.id", ok_type: "$.data.inventory_type" } }
          assert: >-
            The first four calls all return HTTP 400 with
            ${e_enum} == ${e_units} == ${e_cost} == ${e_zones} ==
            "ERR_INVALID_REQUEST".
            The fifth call returns HTTP 201 with ${ok_type} ==
            "ACCESS_EXPERIENCE", contracted_units 1, guaranteed_minimum_units 0
            and unit_cost_cents 1 — the `>= 1` floors are inclusive and
            guaranteed_minimum_units 0 is legal (`>= 0`).
            Persistence check: GET /rights-deals?event_id=${ev_id} returns
            total_count 1 with the single row ${ok_id}, so none of the four
            rejected bodies was written, and GET /events/${ev_id} still has
            hospitality_zone_codes ["ZONE_A", "ZONE_B"].

      - name: hospitality_build_window_must_be_strictly_ordered
        claim_type: type_constraints
        grounds: >-
          validations[priority=4] ERR_INVALID_REQUEST (400)
          "service_window_end > service_window_start";
          entities.HospitalityBuild.service_window_start /
          service_window_end / space_units (>= 1) / catering_covers (>= 0) /
          staff_count (>= 0); endpoints "POST /hospitality-builds".
        distinguishing_aspect: >-
          Tests the window predicate at its exact boundary — a zero-length window
          (end == start) is rejected as well as an inverted one, so the rule is
          strict `>` and not `>=`. The accepted third call reuses the same zone
          and start instant, which proves the first two rejections were about
          ordering and not about the zone, the event or the clock. It also pins
          catering_covers 0 and staff_count 0 as legal at creation (their `>= 1`
          requirement belongs to the APPROVED -> READY transition, not to
          creation).
        test_recipe:
          setup: "One fixture with two declared hospitality zones."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
          trigger:
            - { call: "POST /hospitality-builds", payload: { event_id: "${ev_id}", zone_code: "ZONE_A", service_window_start: "2027-02-01T09:00:00.000Z", service_window_end: "2027-02-01T09:00:00.000Z", space_units: 30, catering_covers: 20, staff_count: 5, build_cost_cents: 120000, catering_cost_cents: 60000, staffing_cost_cents: 40000 }, as: OperationsManager, as_user_id: u_ops, captures: { e_zero: "$.data.error_id" } }
            - { call: "POST /hospitality-builds", payload: { event_id: "${ev_id}", zone_code: "ZONE_A", service_window_start: "2027-02-01T09:00:00.000Z", service_window_end: "2027-02-01T08:59:59.999Z", space_units: 30, catering_covers: 20, staff_count: 5, build_cost_cents: 120000, catering_cost_cents: 60000, staffing_cost_cents: 40000 }, as: OperationsManager, as_user_id: u_ops, captures: { e_inverted: "$.data.error_id" } }
            - { call: "POST /hospitality-builds", payload: { event_id: "${ev_id}", zone_code: "ZONE_A", service_window_start: "2027-02-01T09:00:00.000Z", service_window_end: "2027-02-01T09:00:00.001Z", space_units: 1, catering_covers: 0, staff_count: 0, build_cost_cents: 0, catering_cost_cents: 0, staffing_cost_cents: 0 }, as: OperationsManager, as_user_id: u_ops, captures: { hb_id: "$.data.id", hb_state: "$.data.build_state", hb_total: "$.data.total_cost_cents" } }
          assert: >-
            Zero-length window: HTTP 400 with ${e_zero} ==
            "ERR_INVALID_REQUEST".
            Inverted window: HTTP 400 with ${e_inverted} ==
            "ERR_INVALID_REQUEST".
            One-millisecond window: HTTP 201 with ${hb_state} == "PLANNED" and
            ${hb_total} == 0 (= 0 + 0 + 0), confirming space_units 1 and the
            zero-valued cost and headcount inputs are all legal at creation.
            GET /hospitality-builds?event_id=${ev_id}&zone_code=ZONE_A returns
            total_count 1 with ${hb_id}.

      - name: duplicate_sequence_no_within_one_package_is_rejected
        claim_type: type_constraints
        grounds: >-
          entities.PackageComponent.sequence_no (">= 1, unique within
          package_product_id"); validations[priority=4] ERR_INVALID_REQUEST
          (400) "uniqueness of sequence_no";
          calculations.package_component_line_pricing (sequence_no ASC is a
          TOTAL order precisely because it is unique per package).
        distinguishing_aspect: >-
          The uniqueness scope is the package, not the table: sequence_no 1 is
          rejected on the package that already owns it and accepted on a second
          package created for the same event. That distinction is what makes the
          rounding order in package_component_line_pricing total without a
          tie-break, so an implementation with a global unique index passes the
          rejection but fails the cross-package acceptance.
        test_recipe:
          setup: "One fixture with two DRAFT packages; the first already carries a component at sequence_no 1."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
            - { call: "POST /package-products", payload: { event_id: "${ev_id}", name: "Bronze Hospitality", tier: "BRONZE", tickets_per_package: 2, min_margin_pct: 0.1000 }, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_a: "$.data.id" } }
            - { call: "POST /package-products", payload: { event_id: "${ev_id}", name: "Silver Hospitality", tier: "SILVER", tickets_per_package: 2, min_margin_pct: 0.1000 }, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_b: "$.data.id" } }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_a}", component_type: "TICKET", descriptor: "Category 1 seat pair", quantity: 2, unit_cost_cents: 50000, markup_pct: 0.2000, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer, captures: { comp_a1: "$.data.id" } }
          trigger:
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_a}", component_type: "HOTEL", descriptor: "Five-star room night", quantity: 2, unit_cost_cents: 20000, markup_pct: 0.1000, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer, captures: { e_dup: "$.data.error_id" } }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_b}", component_type: "TICKET", descriptor: "Category 1 seat pair", quantity: 2, unit_cost_cents: 50000, markup_pct: 0.2000, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer, captures: { comp_b1: "$.data.id" } }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_a}", component_type: "HOTEL", descriptor: "Five-star room night", quantity: 2, unit_cost_cents: 20000, markup_pct: 0.1000, sequence_no: 2 }, as: CommercialManager, as_user_id: u_pricer, captures: { comp_a2: "$.data.id", a2_lp: "$.data.line_price_cents" } }
          assert: >-
            Duplicate within the package: HTTP 400 with ${e_dup} ==
            "ERR_INVALID_REQUEST".
            Same sequence_no on a different package: HTTP 201 for ${comp_b1} —
            uniqueness is scoped to package_product_id.
            Next free sequence_no on the original package: HTTP 201 for
            ${comp_a2} with ${a2_lp} == 44000 (= round_half_up(40000 * 1.1000)).
            GET /package-components?package_product_id=${pkg_a} returns
            total_count 2 ({${comp_a1}, ${comp_a2}}) and
            GET /package-components?package_product_id=${pkg_b} returns
            total_count 1 (${comp_b1}), so the rejected body was never
            persisted.

      - name: unknown_foreign_keys_in_request_bodies_are_rejected_by_priority_order
        claim_type: parent_relationships
        grounds: >-
          complexity_profile.entity_topology "flat" (foreign key references
          validated, cross-reference integrity);
          validations[priority=10] ERR_EVENT_NOT_FOUND,
          validations[priority=14] ERR_PACKAGE_NOT_FOUND,
          validations[priority=16] ERR_CLIENT_NOT_FOUND,
          validations[priority=17] ERR_BOOKING_NOT_FOUND,
          validations[priority=19] ERR_BUILD_NOT_FOUND,
          validations[priority=20] ERR_HOST_NOT_FOUND;
          endpoints "POST /rights-deals", "POST /bookings",
          "POST /host-assignments".
        distinguishing_aspect: >-
          Body-borne foreign keys, not path ids, and the third call resolves the
          ladder: POST /host-assignments carries THREE unknown references at once
          (booking_id, hospitality_build_id, on_site_host_id) and must report
          ERR_BOOKING_NOT_FOUND because 17 < 19 < 20. An implementation that
          validates FKs in payload order, or that reports the first failing
          database lookup, returns ERR_HOST_NOT_FOUND or ERR_BUILD_NOT_FOUND and
          fails. The second call keeps client_id valid so that priority 14 is
          reached at all — with both unknown, priority 14 still wins over 16.
        test_recipe:
          setup: "One fixture and one registered client; no packages, bookings, builds or hosts exist."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
            - { call: "POST /clients", payload: { name: "Northbridge Capital", client_type: "CORPORATE", credit_limit_cents: 50000000 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { cl_id: "$.data.id" } }
          trigger:
            - { call: "POST /rights-deals", payload: { event_id: "00000000-0000-0000-0000-000000000000", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 20, guaranteed_minimum_units: 20, unit_cost_cents: 8000 }, as: RightsManager, as_user_id: u_rights, captures: { e_event: "$.data.error_id" } }
            - { call: "POST /bookings", payload: { client_id: "${cl_id}", package_product_id: "00000000-0000-0000-0000-000000000000", channel: "CORPORATE", units: 5 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { e_pkg: "$.data.error_id" } }
            - { call: "POST /host-assignments", payload: { on_site_host_id: "00000000-0000-0000-0000-000000000000", booking_id: "00000000-0000-0000-0000-000000000000", hospitality_build_id: "00000000-0000-0000-0000-000000000000", shift_start: "2027-02-01T10:00:00.000Z", shift_end: "2027-02-01T14:00:00.000Z" }, as: OperationsManager, as_user_id: u_ops, captures: { e_ladder: "$.data.error_id" } }
          assert: >-
            ${e_event} == "ERR_EVENT_NOT_FOUND" with HTTP 404.
            ${e_pkg} == "ERR_PACKAGE_NOT_FOUND" with HTTP 404 (priority 14 beats
            the still-valid client lookup at 16).
            ${e_ladder} == "ERR_BOOKING_NOT_FOUND" with HTTP 404 — the lowest
            priority number among the three unknown references (17 vs 19 vs 20)
            decides the reported error.
            Nothing was created: GET /rights-deals?event_id=${ev_id} returns
            total_count 0, GET /bookings?client_id=${cl_id} returns total_count 0
            and GET /host-assignments?assignment_state=ASSIGNED returns
            total_count 0.

      - name: input_fields_are_write_once_because_no_endpoint_ever_takes_them_back
        claim_type: immutability
        grounds: >-
          §1.5 endpoint inventory (30 POSTs and 22 GETs; no PATCH and no PUT
          exists, and every action endpoint's `input` list omits the creating
          entity's own input fields); §1.1 Booking money fields
          (source: computed, written once by calculations.booking_net_price at
          POST /bookings); state_machines.PackageProduct price precondition
          "package_status IN {DRAFT, PRICED}" -> ERR_INVALID_PACKAGE_STATE 409
          from PUBLISHED.
        distinguishing_aspect: >-
          Immutability here is structural rather than field-flagged: the API simply
          offers no way back, so the test drives the entities through their
          lifecycle actions and shows the creation-time values surviving intact
          while the computed neighbours move. The sharpest case is commercial: a
          PUBLISHED package cannot be re-priced at all, so a booking's agreed
          558720 can never be retro-changed by a later pricing decision — an
          implementation that lets price run from PUBLISHED (or that recomputes a
          booking's money on read from the package's current list price) fails.
          Allocation is chosen as the mutating action precisely because it rewrites
          a different field on the same row, which is where a careless
          save-the-whole-object handler would clobber the frozen ones.
        test_recipe:
          setup: >-
            STANDARD SELLABLE FIXTURE, plus one 5-unit CORPORATE booking left
            RESERVED (not allocated). Creation-time values are captured from the
            creating responses themselves.
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
            - { call: "POST /rights-deals", payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 40, guaranteed_minimum_units: 20, unit_cost_cents: 8000 }, as: RightsManager, as_user_id: u_rights, captures: { deal_id: "$.data.id", d_created: "$.data.created_at", d_contract: "$.data.contracted_units", d_min: "$.data.guaranteed_minimum_units", d_uc: "$.data.unit_cost_cents", d_holder: "$.data.rights_holder_name", d_inv: "$.data.inventory_type", d_ev: "$.data.event_id" } }
            - { call: "POST /rights-deals/${deal_id}/commit", payload: {}, as: RightsManager, as_user_id: u_rights }
            - { call: "POST /allocation-blocks", payload: { rights_deal_id: "${deal_id}", channel: "CORPORATE", target_units: 40, priority_rank: 1 }, as: CommercialManager, as_user_id: u_pricer, captures: { blk_id: "$.data.id" } }
            - { call: "POST /release-tranches", payload: { rights_deal_id: "${deal_id}", promised_units: 40, promised_release_at: "2026-10-01T00:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { tr_id: "$.data.id" } }
            - { call: "GET /rights-deals/${deal_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { deal_v: "$.data.version" } }
            - { call: "POST /release-tranches/${tr_id}/confirm", payload: { confirmed_units: 40, expected_rights_deal_version: "${deal_v}" }, as: RightsManager, as_user_id: u_rights }
            - { call: "POST /package-products", payload: { event_id: "${ev_id}", name: "Bronze Hospitality", tier: "BRONZE", tickets_per_package: 2, min_margin_pct: 0.1000 }, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_id: "$.data.id" } }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TICKET", descriptor: "Category 1 seat pair", quantity: 2, unit_cost_cents: 50000, markup_pct: 0.2000, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-products/${pkg_id}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_v: "$.data.version", pk_list: "$.data.list_price_cents", pk_priced_at: "$.data.priced_at" } }
            - { call: "POST /package-products/${pkg_id}/publish", payload: { expected_package_product_version: "${pkg_v}" }, as: CommercialDirector, as_user_id: u_director, captures: { pk_pub_by: "$.data.published_by_user_id" } }
            - { call: "POST /clients", payload: { name: "Northbridge Capital", client_type: "CORPORATE", credit_limit_cents: 50000000 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { cl_id: "$.data.id" } }
            - { call: "POST /bookings", payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 5 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { bk_id: "$.data.id", bk_created: "$.data.created_at", bk_v0: "$.data.version", bk_units: "$.data.units", bk_chan: "$.data.channel", bk_cl: "$.data.client_id", bk_pkg: "$.data.package_product_id", bk_gross: "$.data.gross_price_cents", bk_net: "$.data.net_price_cents" } }
          trigger:
            - { call: "GET /allocation-blocks/${blk_id}", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { blk_v: "$.data.version" } }
            - { call: "POST /bookings/${bk_id}/allocate", payload: { allocation_block_id: "${blk_id}", expected_allocation_block_version: "${blk_v}" }, as: ClientServiceAgent, as_user_id: u_csa, captures: { a_blk: "$.data.allocation_block_id", a_st: "$.data.fulfillment_status" } }
            - { call: "GET /bookings/${bk_id}", payload: {}, as: ClientServiceAgent, as_user_id: u_csa, captures: { b_created: "$.data.created_at", b_v: "$.data.version", b_units: "$.data.units", b_chan: "$.data.channel", b_cl: "$.data.client_id", b_pkg: "$.data.package_product_id", b_gross: "$.data.gross_price_cents", b_net: "$.data.net_price_cents" } }
            - { call: "POST /package-products/${pkg_id}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { e_price: "$.data.error_id" } }
            - { call: "GET /package-products/${pkg_id}", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { p_list: "$.data.list_price_cents", p_priced_at: "$.data.priced_at", p_pub_by: "$.data.published_by_user_id", p_st: "$.data.package_status" } }
            - { call: "GET /rights-deals/${deal_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { r_created: "$.data.created_at", r_contract: "$.data.contracted_units", r_min: "$.data.guaranteed_minimum_units", r_uc: "$.data.unit_cost_cents", r_holder: "$.data.rights_holder_name", r_inv: "$.data.inventory_type", r_ev: "$.data.event_id", r_rel: "$.data.released_units", r_st: "$.data.deal_status" } }
          assert: >-
            Allocation rewrote exactly one field: ${a_blk} == "${blk_id}" and
            ${a_st} == "ALLOCATED", while every value fixed at creation is
            byte-identical afterwards — ${b_units} == ${bk_units} == 5,
            ${b_chan} == ${bk_chan} == "CORPORATE", ${b_cl} == "${bk_cl}",
            ${b_pkg} == "${bk_pkg}", ${b_gross} == ${bk_gross} == 600000,
            ${b_net} == ${bk_net} == 558720 and ${b_created} == "${bk_created}"
            — with only the mutation counter moving, ${b_v} == ${bk_v0} + 1.
            The agreed price cannot be reopened: re-pricing the PUBLISHED package
            answers 409 with ${e_price} == "ERR_INVALID_PACKAGE_STATE", and the
            package is untouched — ${p_st} == "PUBLISHED",
            ${p_list} == ${pk_list} == 120000,
            ${p_priced_at} == "${pk_priced_at}" and
            ${p_pub_by} == "${pk_pub_by}" == "u_director".
            The deal's contract terms survived commitment and a full release:
            ${r_contract} == ${d_contract} == 40, ${r_min} == ${d_min} == 20,
            ${r_uc} == ${d_uc} == 8000, ${r_holder} == "${d_holder}",
            ${r_inv} == "${d_inv}" == "TICKET", ${r_ev} == "${d_ev}" and
            ${r_created} == "${d_created}" — while the computed neighbours did
            move, ${r_rel} == 40 and ${r_st} == "FULLY_RELEASED". No endpoint in
            §1.5 accepts contracted_units, unit_cost_cents, units or channel
            after creation, so there is no legitimate path to a different answer.

  # ===========================================================================
  # SECTION 2 — state_machines (§1.2 + the `parallel` shape row + §1.2.2
  # cascade patterns). Depth on the cascades themselves lives in §1.8, so the
  # transitive/cyclic/parallel corners appear here as excluded_because stubs.
  #
  # STANDARD SELLABLE FIXTURE (referenced by name below; 12 setup calls):
  #   clock 2026-08-01, canonical event, TICKET deal contracted 40 /
  #   guaranteed_minimum 20 / unit_cost 8000, committed, one CORPORATE block
  #   target 40 priority_rank 1, one 40-unit tranche confirmed in full
  #   => deal FULLY_RELEASED (so bookings carry NO guarantee surcharge),
  #      block allocated_units 40 EXHAUSTED, minimum_liability 320000;
  #   simple BRONZE package priced by u_pricer and published by u_director;
  #   client "Northbridge Capital" CORPORATE credit_limit 50000000.
  #   A 5-unit CORPORATE booking on it costs 558720 and consumes
  #   5 * tickets_per_package 2 = 10 block units.
  # ===========================================================================
  - section: state_machines
    instances:

      - name: every_entity_starts_in_its_declared_initial_state
        claim_type: initial_state
        grounds: >-
          state_machines initial_state for Event (SCHEDULED), RightsDeal
          (DRAFT), ReleaseTranche (PENDING), AllocationBlock (OPEN),
          PackageProduct (DRAFT), Client (ACTIVE), HospitalityBuild (PLANNED);
          the corresponding create endpoints in §1.5.
        distinguishing_aspect: >-
          Seven machines proved in one pass, and two of them are traps: an
          AllocationBlock created on a deal that has ALREADY released inventory
          would flip straight to EXHAUSTED by the waterfall, so this instance
          creates the block on a freshly COMMITTED deal (released_units 0) to pin
          the true initial OPEN state with allocated_units 0; and a ReleaseTranche
          is created on the same deal to show PENDING with confirmed_units 0
          rather than an eager CONFIRMED.
        test_recipe:
          setup: "Clock at 2026-08-01; one canonical event; no releases confirmed anywhere."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
          trigger:
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id", ev_st: "$.data.status" } }
            - { call: "POST /rights-deals", payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 40, guaranteed_minimum_units: 20, unit_cost_cents: 8000 }, as: RightsManager, as_user_id: u_rights, captures: { deal_id: "$.data.id", deal_st: "$.data.deal_status" } }
            - { call: "POST /rights-deals/${deal_id}/commit", payload: {}, as: RightsManager, as_user_id: u_rights }
            - { call: "POST /allocation-blocks", payload: { rights_deal_id: "${deal_id}", channel: "CORPORATE", target_units: 40, priority_rank: 1 }, as: CommercialManager, as_user_id: u_pricer, captures: { blk_id: "$.data.id", blk_st: "$.data.block_state", blk_alloc: "$.data.allocated_units", blk_comm: "$.data.committed_units" } }
            - { call: "POST /release-tranches", payload: { rights_deal_id: "${deal_id}", promised_units: 40, promised_release_at: "2026-10-01T00:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { tr_id: "$.data.id", tr_st: "$.data.tranche_state", tr_conf: "$.data.confirmed_units" } }
            - { call: "POST /package-products", payload: { event_id: "${ev_id}", name: "Bronze Hospitality", tier: "BRONZE", tickets_per_package: 2, min_margin_pct: 0.1000 }, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_st: "$.data.package_status" } }
            - { call: "POST /clients", payload: { name: "Northbridge Capital", client_type: "CORPORATE", credit_limit_cents: 50000000 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { cl_st: "$.data.client_status" } }
            - { call: "POST /hospitality-builds", payload: { event_id: "${ev_id}", zone_code: "ZONE_A", service_window_start: "2027-02-01T09:00:00.000Z", service_window_end: "2027-02-01T20:00:00.000Z", space_units: 30, catering_covers: 20, staff_count: 5, build_cost_cents: 120000, catering_cost_cents: 60000, staffing_cost_cents: 40000 }, as: OperationsManager, as_user_id: u_ops, captures: { hb_st: "$.data.build_state", hb_total: "$.data.total_cost_cents" } }
          assert: >-
            ${ev_st} == "SCHEDULED", ${deal_st} == "DRAFT",
            ${blk_st} == "OPEN" with ${blk_alloc} == 0 and ${blk_comm} == 0,
            ${tr_st} == "PENDING" with ${tr_conf} == 0,
            ${pkg_st} == "DRAFT", ${cl_st} == "ACTIVE",
            ${hb_st} == "PLANNED" with ${hb_total} == 220000.
            Every create call returned 201 and every row's version == 1 except
            the deal, whose commit bumped it to 2.
            The block did not absorb anything because the deal has released
            nothing yet: GET /rights-deals/${deal_id} shows released_units 0 and
            unallocated_units 0.

      - name: allocate_moves_booking_reserved_to_allocated_and_commits_block_units
        claim_type: valid_transition
        grounds: >-
          state_machines.Booking RESERVED -> ALLOCATED (trigger
          POST /bookings/{id}/allocate, actor ClientServiceAgent);
          endpoints "POST /bookings/{id}/allocate" side_effects
          (fulfillment_status = ALLOCATED; allocation_block_id set;
          AllocationBlock.committed_units increases by
          units * tickets_per_package and increments AllocationBlock.version);
          concurrency_rules.allocate-against-stale-block.
        distinguishing_aspect: >-
          The units debited from the block are units * tickets_per_package
          (5 * 2 = 10), not the booking's 5 units — the whole allocation ledger is
          denominated in TICKETS while bookings are denominated in PACKAGES. The
          instance also pins which side the version moves on: the block's version
          increments (it is the OCC parent) and the booking's does too, while the
          RightsDeal version does NOT change, because allocation to a client is
          not a release from the rights holder.
        test_recipe:
          setup: "STANDARD SELLABLE FIXTURE plus one 5-unit CORPORATE booking left in RESERVED."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
            - { call: "POST /rights-deals", payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 40, guaranteed_minimum_units: 20, unit_cost_cents: 8000 }, as: RightsManager, as_user_id: u_rights, captures: { deal_id: "$.data.id" } }
            - { call: "POST /rights-deals/${deal_id}/commit", payload: {}, as: RightsManager, as_user_id: u_rights }
            - { call: "POST /allocation-blocks", payload: { rights_deal_id: "${deal_id}", channel: "CORPORATE", target_units: 40, priority_rank: 1 }, as: CommercialManager, as_user_id: u_pricer, captures: { blk_id: "$.data.id" } }
            - { call: "POST /release-tranches", payload: { rights_deal_id: "${deal_id}", promised_units: 40, promised_release_at: "2026-10-01T00:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { tr_id: "$.data.id" } }
            - { call: "GET /rights-deals/${deal_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { deal_v: "$.data.version" } }
            - { call: "POST /release-tranches/${tr_id}/confirm", payload: { confirmed_units: 40, expected_rights_deal_version: "${deal_v}" }, as: RightsManager, as_user_id: u_rights }
            - { call: "POST /package-products", payload: { event_id: "${ev_id}", name: "Bronze Hospitality", tier: "BRONZE", tickets_per_package: 2, min_margin_pct: 0.1000 }, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_id: "$.data.id" } }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TICKET", descriptor: "Category 1 seat pair", quantity: 2, unit_cost_cents: 50000, markup_pct: 0.2000, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-products/${pkg_id}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_v: "$.data.version" } }
            - { call: "POST /package-products/${pkg_id}/publish", payload: { expected_package_product_version: "${pkg_v}" }, as: CommercialDirector, as_user_id: u_director }
            - { call: "POST /clients", payload: { name: "Northbridge Capital", client_type: "CORPORATE", credit_limit_cents: 50000000 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { cl_id: "$.data.id" } }
            - { call: "POST /bookings", payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 5 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { bk_id: "$.data.id", bk_f0: "$.data.fulfillment_status", bk_p0: "$.data.payment_status", bk_net: "$.data.net_price_cents", bk_blk0: "$.data.allocation_block_id" } }
            - { call: "GET /allocation-blocks/${blk_id}", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { blk_v: "$.data.version", blk_alloc: "$.data.allocated_units", blk_comm0: "$.data.committed_units", blk_st0: "$.data.block_state" } }
          trigger:
            - call: "POST /bookings/${bk_id}/allocate"
              payload: { allocation_block_id: "${blk_id}", expected_allocation_block_version: "${blk_v}" }
              as: ClientServiceAgent
              as_user_id: u_csa
              captures: { bk_f1: "$.data.fulfillment_status", bk_p1: "$.data.payment_status", bk_blk1: "$.data.allocation_block_id", bk_v1: "$.data.version" }
            - { call: "GET /allocation-blocks/${blk_id}", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { blk_comm1: "$.data.committed_units", blk_alloc1: "$.data.allocated_units", blk_st1: "$.data.block_state", blk_v1: "$.data.version" } }
            - { call: "GET /rights-deals/${deal_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { deal_v_after: "$.data.version", deal_st_after: "$.data.deal_status", deal_unalloc: "$.data.unallocated_units" } }
          assert: >-
            Before: ${bk_f0} == "RESERVED", ${bk_p0} == "UNPAID",
            ${bk_net} == 558720, ${bk_blk0} == null, ${blk_alloc} == 40,
            ${blk_comm0} == 0, ${blk_st0} == "EXHAUSTED" (the block is EXHAUSTED
            against its 40-unit TARGET, which does not block selling).
            Trigger: HTTP 200 with ${bk_f1} == "ALLOCATED",
            ${bk_blk1} == ${blk_id} and ${bk_p1} == "UNPAID" — the payment
            dimension is untouched by a fulfillment transition.
            Block after: ${blk_comm1} == 10 (= 5 units * tickets_per_package 2,
            NOT 5), ${blk_alloc1} == 40 unchanged, ${blk_st1} == "EXHAUSTED"
            (committing to a client does not change allocation-against-target)
            and ${blk_v1} == ${blk_v} + 1.
            Deal after: ${deal_v_after} == ${deal_v} + 1 only because of the
            earlier tranche confirmation — i.e. the allocate call itself left the
            deal at that same version — with ${deal_st_after} ==
            "FULLY_RELEASED" and ${deal_unalloc} == 0.

      - name: issue_credentials_stamps_count_prefix_and_itinerary
        claim_type: side_effect_execution
        grounds: >-
          state_machines.Booking ALLOCATED -> CREDENTIALED;
          endpoints "POST /bookings/{id}/issue-credentials" side_effects
          (credentials_issued_count = units * (tickets_per_package + 1);
          credential_serial_prefix stamped; itinerary computed);
          entities.Booking.itinerary (keys event_name, event_date, venue_name,
          hotel_nights, transport_included, credential_count, host_names);
          validations[priority=50] ERR_BUILD_NOT_READY.
        distinguishing_aspect: >-
          The credential count is units * (tickets_per_package + 1) = 5 * 3 = 15,
          i.e. one HOST pass on top of each package's tickets — deliberately
          different from both the booking's 5 units and the 10 ticket units
          debited from the allocation block, so the three unit denominations in
          this domain cannot be conflated. The itinerary snapshot is asserted key
          by key, including host_names == [] before any host is rostered and
          hotel_nights 0 / transport_included false inherited from the package
          defaults rather than from the booking.
        test_recipe:
          setup: "STANDARD SELLABLE FIXTURE, one 5-unit CORPORATE booking ALLOCATED, and one ZONE_A build driven all the way to READY."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
            - { call: "POST /rights-deals", payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 40, guaranteed_minimum_units: 20, unit_cost_cents: 8000 }, as: RightsManager, as_user_id: u_rights, captures: { deal_id: "$.data.id" } }
            - { call: "POST /rights-deals/${deal_id}/commit", payload: {}, as: RightsManager, as_user_id: u_rights }
            - { call: "POST /allocation-blocks", payload: { rights_deal_id: "${deal_id}", channel: "CORPORATE", target_units: 40, priority_rank: 1 }, as: CommercialManager, as_user_id: u_pricer, captures: { blk_id: "$.data.id" } }
            - { call: "POST /release-tranches", payload: { rights_deal_id: "${deal_id}", promised_units: 40, promised_release_at: "2026-10-01T00:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { tr_id: "$.data.id" } }
            - { call: "GET /rights-deals/${deal_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { deal_v: "$.data.version" } }
            - { call: "POST /release-tranches/${tr_id}/confirm", payload: { confirmed_units: 40, expected_rights_deal_version: "${deal_v}" }, as: RightsManager, as_user_id: u_rights }
            - { call: "POST /package-products", payload: { event_id: "${ev_id}", name: "Bronze Hospitality", tier: "BRONZE", tickets_per_package: 2, min_margin_pct: 0.1000 }, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_id: "$.data.id" } }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TICKET", descriptor: "Category 1 seat pair", quantity: 2, unit_cost_cents: 50000, markup_pct: 0.2000, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-products/${pkg_id}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_v: "$.data.version" } }
            - { call: "POST /package-products/${pkg_id}/publish", payload: { expected_package_product_version: "${pkg_v}" }, as: CommercialDirector, as_user_id: u_director }
            - { call: "POST /clients", payload: { name: "Northbridge Capital", client_type: "CORPORATE", credit_limit_cents: 50000000 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { cl_id: "$.data.id" } }
            - { call: "POST /bookings", payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 5 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { bk_id: "$.data.id" } }
            - { call: "GET /allocation-blocks/${blk_id}", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { blk_v: "$.data.version" } }
            - { call: "POST /bookings/${bk_id}/allocate", payload: { allocation_block_id: "${blk_id}", expected_allocation_block_version: "${blk_v}" }, as: ClientServiceAgent, as_user_id: u_csa }
            - { call: "POST /hospitality-builds", payload: { event_id: "${ev_id}", zone_code: "ZONE_A", service_window_start: "2027-02-01T09:00:00.000Z", service_window_end: "2027-02-01T20:00:00.000Z", space_units: 30, catering_covers: 20, staff_count: 5, build_cost_cents: 120000, catering_cost_cents: 60000, staffing_cost_cents: 40000 }, as: OperationsManager, as_user_id: u_ops, captures: { hb_id: "$.data.id" } }
            - { call: "POST /hospitality-builds/${hb_id}/approve", payload: {}, as: FinanceController, as_user_id: u_fin }
            - { call: "POST /hospitality-builds/${hb_id}/ready", payload: {}, as: OperationsManager, as_user_id: u_ops, captures: { hb_st: "$.data.build_state" } }
          trigger:
            - call: "POST /bookings/${bk_id}/issue-credentials"
              payload: {}
              as: ClientServiceAgent
              as_user_id: u_csa
              captures: { f1: "$.data.fulfillment_status", cc: "$.data.credentials_issued_count", prefix: "$.data.credential_serial_prefix", itin: "$.data.itinerary", p1: "$.data.payment_status", upd: "$.data.updated_at" }
          assert: >-
            ${hb_st} == "READY" in setup, so the priority-50 safety gate passes.
            Trigger: HTTP 200, ${f1} == "CREDENTIALED", ${p1} == "UNPAID",
            ${cc} == 15 (= 5 * (2 + 1)), ${prefix} is a non-empty string and
            ${upd} == "2026-08-01T00:00:00.000Z" (the logical clock).
            ${itin} has exactly the seven declared keys with
            event_name "Continental Cup Final",
            event_date "2027-02-01T15:00:00.000Z",
            venue_name "Meridian Stadium", hotel_nights 0,
            transport_included false, credential_count 15 (agreeing with
            ${cc}) and host_names == [] — no host has been rostered yet.
            GET /bookings/${bk_id} returns the same itinerary object, so it is
            persisted rather than rendered per request.

      - name: completed_event_is_locked_against_every_further_transition
        claim_type: terminal_state_lockdown
        grounds: >-
          state_machines.Event terminal_states [CANCELLED, COMPLETED];
          validations[priority=40] ERR_INVALID_EVENT_STATE (409, applies to
          POST /events/{id}/postpone, /cancel, /complete, POST /rights-deals,
          POST /package-products, POST /hospitality-builds);
          errors[ERR_INVALID_EVENT_STATE].
        distinguishing_aspect: >-
          A terminal state must be inert for BOTH its own triggers and the child
          creations gated on it: postpone, cancel and a repeated complete are all
          409, and so are POST /rights-deals, POST /package-products and
          POST /hospitality-builds on the completed fixture. The lockdown is
          proved after a genuine, precondition-satisfying complete (clock moved
          past event_date with no live bookings), so the 409s cannot be blamed on
          the transition never having happened.
        test_recipe:
          setup: "One canonical event with no children; the clock is then moved past its event_date and the fixture is completed."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2027-02-02T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events/${ev_id}/complete", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { st: "$.data.status", v: "$.data.version" } }
          trigger:
            - { call: "POST /events/${ev_id}/postpone", payload: { new_event_date: "2027-05-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { e_postpone: "$.data.error_id" } }
            - { call: "POST /events/${ev_id}/cancel", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { e_cancel: "$.data.error_id" } }
            - { call: "POST /events/${ev_id}/complete", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { e_complete: "$.data.error_id" } }
            - { call: "POST /rights-deals", payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 40, guaranteed_minimum_units: 20, unit_cost_cents: 8000 }, as: RightsManager, as_user_id: u_rights, captures: { e_deal: "$.data.error_id" } }
            - { call: "POST /package-products", payload: { event_id: "${ev_id}", name: "Late Bronze", tier: "BRONZE", tickets_per_package: 2, min_margin_pct: 0.1000 }, as: CommercialManager, as_user_id: u_pricer, captures: { e_pkg: "$.data.error_id" } }
            - { call: "POST /hospitality-builds", payload: { event_id: "${ev_id}", zone_code: "ZONE_A", service_window_start: "2027-02-01T09:00:00.000Z", service_window_end: "2027-02-01T20:00:00.000Z", space_units: 30, catering_covers: 20, staff_count: 5, build_cost_cents: 120000, catering_cost_cents: 60000, staffing_cost_cents: 40000 }, as: OperationsManager, as_user_id: u_ops, captures: { e_build: "$.data.error_id" } }
          assert: >-
            Setup: ${st} == "COMPLETED" with ${v} == 2.
            All six trigger calls return HTTP 409 with
            ${e_postpone} == ${e_cancel} == ${e_complete} == ${e_deal} ==
            ${e_pkg} == ${e_build} == "ERR_INVALID_EVENT_STATE".
            GET /events/${ev_id} still reports status "COMPLETED" and version 2 —
            no rejected call bumped the version — and
            GET /rights-deals?event_id=${ev_id} returns total_count 0.

      - name: package_lifecycle_rejects_transitions_outside_the_declared_edges
        claim_type: invalid_transition
        grounds: >-
          state_machines.PackageProduct transitions (DRAFT -> PRICED,
          PRICED -> PRICED, PRICED -> PUBLISHED only);
          validations[priority=44] ERR_INVALID_PACKAGE_STATE (409, "adding a
          component or pricing requires package_status IN {DRAFT, PRICED};
          publish requires PRICED"); validations[priority=32]
          ERR_STALE_PACKAGE_VERSION.
        distinguishing_aspect: >-
          Two edges that do NOT exist are probed from opposite ends of the
          lifecycle: DRAFT -> PUBLISHED (no direct publish) and
          PUBLISHED -> PRICED (no re-price after release, even though
          PRICED -> PRICED is legal). The DRAFT publish attempt deliberately
          carries the CORRECT version so the OCC check at priority 32 passes and
          the state check at 44 is the one that reports — an implementation that
          orders publish's guards by convenience returns
          ERR_STALE_PACKAGE_VERSION instead. Re-pricing between the two is
          asserted to be legal and to clear the approval fields, which is what
          makes PRICED -> PRICED a real self-edge rather than a no-op.
        test_recipe:
          setup: "One canonical event with one DRAFT BRONZE package carrying a single priced component."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
