  # ===========================================================================
  - section: validations
    instances:
      - name: duplicate_payer_code_is_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=29]", "errors[ERR_DUPLICATE_PAYER_CODE]"]
        distinguishing_aspect: "A second POST /payers reusing payer_code COM returns 409 ERR_DUPLICATE_PAYER_CODE and the collection still holds exactly one payer."
        test_recipe:
          setup: ["One stored payer with payer_code COM."]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Meridian Commercial", payer_code: "COM", payer_type: "COMMERCIAL" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
          trigger:
            - call: "POST /payers"
              payload: { name: "Meridian Commercial East", payer_code: "COM", payer_type: "TRICARE" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status == 409"
            - "response data.error_id == ERR_DUPLICATE_PAYER_CODE"
            - "GET /payers returns total_count == 1"

      - name: duplicate_account_number_is_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=30]", "errors[ERR_DUPLICATE_ACCOUNT_NUMBER]"]
        distinguishing_aspect: "account_number is globally unique, so a second POST /patient-accounts with ACCT-DUP returns 409 ERR_DUPLICATE_ACCOUNT_NUMBER."
        test_recipe:
          setup: ["A COMMERCIAL payer and one account with account_number ACCT-DUP."]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Meridian Commercial", payer_code: "COM", payer_type: "COMMERCIAL" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { payer_com_id: "$.data.id" }
            - call: "POST /patient-accounts"
              payload: { account_number: "ACCT-DUP", mrn: "MRN-D1", patient_name: "Dup One", guarantor_state_code: "CA", primary_payer_id: "${payer_com_id}", financial_class: "INPATIENT" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
          trigger:
            - call: "POST /patient-accounts"
              payload: { account_number: "ACCT-DUP", mrn: "MRN-D2", patient_name: "Dup Two", guarantor_state_code: "TX", primary_payer_id: "${payer_com_id}", financial_class: "OUTPATIENT" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status == 409"
            - "response data.error_id == ERR_DUPLICATE_ACCOUNT_NUMBER"
            - "GET /patient-accounts returns total_count == 1"

      - name: duplicate_notice_number_within_payer_rejected_but_reusable_across_payers
        claim_type: violation_to_error
        grounds: ["validations[priority=32]", "errors[ERR_DUPLICATE_NOTICE_NUMBER]", "entities.TakeBackNotice.fields.notice_number"]
        distinguishing_aspect: "notice_number is unique within payer_id only: reusing TB-9 for the same payer returns 409 ERR_DUPLICATE_NOTICE_NUMBER, while the same TB-9 recorded by a different payer is accepted with 201."
        test_recipe:
          setup: ["Two payers with take_back_allowed true, and one TakeBackNotice TB-9 already recorded by the first payer on the default clock instant."]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Medicare Region A", payer_code: "MCR", payer_type: "MEDICARE", take_back_allowed: true }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { payer_med_id: "$.data.id" }
            - call: "POST /payers"
              payload: { name: "Meridian Commercial", payer_code: "COM", payer_type: "COMMERCIAL", take_back_allowed: true }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { payer_com_id: "$.data.id" }
            - call: "POST /take-back-notices"
              payload: { payer_id: "${payer_med_id}", notice_number: "TB-9", total_recoup_cents: 5000 }
              as: PayerLiaison
              as_user_id: "${payer_med_id}"
              captures: { tb_first_id: "$.data.id" }
          trigger:
            - call: "POST /take-back-notices"
              payload: { payer_id: "${payer_med_id}", notice_number: "TB-9", total_recoup_cents: 7000 }
              as: PayerLiaison
              as_user_id: "${payer_med_id}"
              captures: { err_id: "$.data.error_id" }
            - call: "POST /take-back-notices"
              payload: { payer_id: "${payer_com_id}", notice_number: "TB-9", total_recoup_cents: 7000 }
              as: PayerLiaison
              as_user_id: "${payer_com_id}"
              captures: { tb_second_id: "$.data.id" }
          assert:
            - "the same-payer retry returns HTTP 409 with data.error_id == ERR_DUPLICATE_NOTICE_NUMBER"
            - "the other-payer create returns HTTP 201"
            - "TakeBackNotice.${tb_second_id}.payer_id == ${payer_com_id}"
            - "TakeBackNotice.${tb_first_id}.total_recoup_cents == 5000"
            - "TakeBackNotice.${tb_first_id}.dispute_deadline_at == 2026-09-15T00:00:00.000Z"
            - "TakeBackNotice.${tb_first_id}.remaining_unapplied_cents == 5000"

      - name: batch_window_with_cutoff_after_run_is_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=26]", "errors[ERR_INVALID_BATCH_WINDOW]"]
        distinguishing_aspect: "cutoff_at must be strictly before scheduled_run_at; an equal pair returns 422 ERR_INVALID_BATCH_WINDOW before any overlap check runs."
        test_recipe:
          setup: ["Empty database; no batches exist."]
          setup_api_calls:
            - call: "GET /refund-batches"
              payload: {}
              as: DisbursementOfficer
              as_user_id: "disb-1"
          trigger:
            - call: "POST /refund-batches"
