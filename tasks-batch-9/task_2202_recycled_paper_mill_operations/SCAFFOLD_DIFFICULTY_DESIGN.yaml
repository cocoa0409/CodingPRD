            - { call: "POST /effluent-permits/${permit_id}/readings", payload: { reading_date: "2026-07-30", flow_m3: 4000.00, bod_kg: 130.00, tss_kg: 100.00 }, as: EnvironmentalOfficer, as_user_id: "eo_log" }
