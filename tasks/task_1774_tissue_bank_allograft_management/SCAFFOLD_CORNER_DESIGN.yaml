            - { call: "POST /tissue-bank/freezers", payload: { name: "FZ-ULT-1", min_celsius: -80.0, max_celsius: -60.0, nominal_capacity: 50 }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { fz: $.data.id } }
            - { call: "POST /tissue-bank/par-level-policies", payload: { tissue_type: BONE, par_quantity: 2, max_inventory_value_cents: 100000000 }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { pol: $.data.id } }
            - { call: "POST /tissue-bank/shipments", payload: { supplier_id: "${sup}", freezer_id: "${fz}", items: [ { tissue_type: BONE, lot_number: "L1", serial_number: "U-001", unit_cost_cents: 5000, expiration_at: "2027-01-01T00:00:00Z", criticality_tier: STANDARD }, { tissue_type: BONE, lot_number: "L1", serial_number: "U-002", unit_cost_cents: 5000, expiration_at: "2027-01-01T00:00:00Z", criticality_tier: STANDARD } ] }, as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { sh1: $.data.id } }
            - { call: "POST /tissue-bank/shipments/${sh1}/accept", as: TissueBankCoordinator, as_user_id: "tbc-1" }
            - { call: "GET /tissue-bank/tissue-units?shipment_id=${sh1}", as: QualityManager, as_user_id: "qm-1", captures: { u1: "$.data[0].id" } }
            - { call: "POST /tissue-bank/tissue-units/${u1}/release", as: QualityManager, as_user_id: "qm-1" }
          trigger:
            - { call: "GET /tissue-bank/par-level-policies/${pol}", as: SupplyChainAdmin, as_user_id: "sca-1", captures: { a: $.data.on_hand_available, d: $.data.deficit, r: $.data.needs_reorder } }
          assert:
            - "a == 1 (QUARANTINED U-002 excluded from the inclusion set)"
            - "d == 1 and r == true"

      - name: expiry_equality_usable_then_sweep_at_plus_one_second
        claim_type: boundary
        grounds: [calculations.expiration_sweep, "errors[ERR_UNIT_NOT_ISSUABLE_STATE]"]
        distinguishing_aspect: "Expiration comparison is strictly-greater: at clock == expiration_at the unit remains AVAILABLE and issues normally; one second later the sweep moves the still-stored unit to EXPIRED while the ISSUED unit is exempt."
        test_recipe:
          setup: ["qualified supplier; freezer; 2 BONE units (expiration 2026-09-01T00:00:00Z) ACCEPTED + released AVAILABLE"]
          setup_api_calls:
            - { call: "POST /tissue-bank/suppliers", payload: { legal_name: "Acme Tissue Source", license_number: "LIC-001" }, as: QualityManager, as_user_id: "qm-1", captures: { sup: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: AATB_ACCREDITATION, document_ref: "AATB-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_a: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_a}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: FDA_REGISTRATION, document_ref: "FDA-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_f: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_f}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/approve", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /tissue-bank/freezers", payload: { name: "FZ-ULT-1", min_celsius: -80.0, max_celsius: -60.0, nominal_capacity: 50 }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { fz: $.data.id } }
            - { call: "POST /tissue-bank/shipments", payload: { supplier_id: "${sup}", freezer_id: "${fz}", items: [ { tissue_type: BONE, lot_number: "L1", serial_number: "U-001", unit_cost_cents: 5000, expiration_at: "2026-09-01T00:00:00Z", criticality_tier: STANDARD }, { tissue_type: BONE, lot_number: "L1", serial_number: "U-002", unit_cost_cents: 5000, expiration_at: "2026-09-01T00:00:00Z", criticality_tier: STANDARD } ] }, as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { sh1: $.data.id } }
            - { call: "POST /tissue-bank/shipments/${sh1}/accept", as: TissueBankCoordinator, as_user_id: "tbc-1" }
            - { call: "GET /tissue-bank/tissue-units?shipment_id=${sh1}", as: QualityManager, as_user_id: "qm-1", captures: { u1: "$.data[0].id", u2: "$.data[1].id" } }
            - { call: "POST /tissue-bank/tissue-units/${u1}/release", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/tissue-units/${u2}/release", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SupplyChainAdmin, as_user_id: "sca-1" }
          trigger:
            - { call: "POST /tissue-bank/tissue-units/${u1}/issue", as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { st1: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:01Z" }, as: SupplyChainAdmin, as_user_id: "sca-1" }
            - { call: "POST /tissue-bank/tissue-units/${u2}/issue", as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { err2: $.data.error_id } }
            - { call: "GET /tissue-bank/tissue-units/${u1}", as: QualityManager, as_user_id: "qm-1", captures: { st1post: $.data.status } }
          assert:
            - "st1 == ISSUED (at clock == expiration_at the unit is still issuable; sweep uses strict >)"
            - "err2 == ERR_UNIT_NOT_ISSUABLE_STATE (one second later U-002 was swept to EXPIRED)"
            - "st1post == ISSUED (ISSUED units are exempt from the expiry sweep)"
            - "TissueUnit.${u2} carries a DRAFT DispositionRecord of type EXPIRED after the sweep"

      - name: document_expiry_equality_then_auto_suspend_cascade
        claim_type: boundary
        grounds: [calculations.document_expiry_sweep, state_machines.SupplierDocument.VERIFIED_to_EXPIRED, state_machines.Supplier.QUALIFIED_to_SUSPENDED]
        distinguishing_aspect: "Document expiry also uses strict >: at clock == valid_to the FDA document stays VERIFIED and the supplier QUALIFIED; one day past, the document flips EXPIRED and, with no covering FDA document, the supplier auto-suspends and new receipts are rejected."
        test_recipe:
          setup: ["supplier qualified; FDA document valid_to 2026-12-31T00:00:00Z; AATB document valid_to 2027-12-31T00:00:00Z; freezer"]
          setup_api_calls:
            - { call: "POST /tissue-bank/suppliers", payload: { legal_name: "Acme Tissue Source", license_number: "LIC-001" }, as: QualityManager, as_user_id: "qm-1", captures: { sup: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: AATB_ACCREDITATION, document_ref: "AATB-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_a: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_a}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: FDA_REGISTRATION, document_ref: "FDA-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_f: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_f}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/approve", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /tissue-bank/freezers", payload: { name: "FZ-ULT-1", min_celsius: -80.0, max_celsius: -60.0, nominal_capacity: 50 }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { fz: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-31T00:00:00Z" }, as: SupplyChainAdmin, as_user_id: "sca-1" }
          trigger:
            - { call: "GET /tissue-bank/suppliers/${sup}/documents", as: QualityManager, as_user_id: "qm-1", captures: { fda_st_at_eq: "$.data[1].status" } }
            - { call: "GET /tissue-bank/suppliers/${sup}", as: ComplianceOfficer, as_user_id: "co-1", captures: { sup_st_eq: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-01T00:00:00Z" }, as: SupplyChainAdmin, as_user_id: "sca-1" }
            - { call: "GET /tissue-bank/suppliers/${sup}", as: ComplianceOfficer, as_user_id: "co-1", captures: { sup_st_after: $.data.status, fin_after: $.data.qualification_score_final } }
            - { call: "POST /tissue-bank/shipments", payload: { supplier_id: "${sup}", freezer_id: "${fz}", items: [ { tissue_type: BONE, lot_number: "L9", serial_number: "U-901", unit_cost_cents: 5000, expiration_at: "2027-06-01T00:00:00Z", criticality_tier: STANDARD } ] }, as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { err: $.data.error_id } }
          assert:
            - "fda_st_at_eq == VERIFIED and sup_st_eq == QUALIFIED (equality is still valid; strict > rule)"
            - "sup_st_after == SUSPENDED (document-expiry auto-suspension cascade fired on the clock sweep)"
            - "fin_after == 95 (one expired_doc_event: 100 - 5)"
            - "err == ERR_SUPPLIER_NOT_QUALIFIED (gate consequence at receipt creation)"

      - name: reservation_hold_until_boundary
        claim_type: boundary
        grounds: [calculations.document_expiry_sweep, state_machines.Reservation.ACTIVE_to_EXPIRED]
        distinguishing_aspect: "hold_until = case.scheduled_end + 2h; at clock == hold_until the reservation stays ACTIVE (strict >), one second later the sweep expires it (CLOCK_EXPIRED) and restores the unit."
        test_recipe:
          setup: ["qualified supplier; freezer; unit AVAILABLE; case C1 scheduled_end 2026-08-10T12:00:00Z; reservation R1 (hold_until 2026-08-10T14:00:00Z)"]
          setup_api_calls:
            - { call: "POST /tissue-bank/suppliers", payload: { legal_name: "Acme Tissue Source", license_number: "LIC-001" }, as: QualityManager, as_user_id: "qm-1", captures: { sup: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: AATB_ACCREDITATION, document_ref: "AATB-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_a: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_a}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: FDA_REGISTRATION, document_ref: "FDA-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_f: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_f}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/approve", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /tissue-bank/freezers", payload: { name: "FZ-ULT-1", min_celsius: -80.0, max_celsius: -60.0, nominal_capacity: 50 }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { fz: $.data.id } }
            - { call: "POST /tissue-bank/shipments", payload: { supplier_id: "${sup}", freezer_id: "${fz}", items: [ { tissue_type: BONE, lot_number: "L1", serial_number: "U-001", unit_cost_cents: 5000, expiration_at: "2027-01-01T00:00:00Z", criticality_tier: STANDARD } ] }, as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { sh1: $.data.id } }
            - { call: "POST /tissue-bank/shipments/${sh1}/accept", as: TissueBankCoordinator, as_user_id: "tbc-1" }
            - { call: "GET /tissue-bank/tissue-units?shipment_id=${sh1}", as: QualityManager, as_user_id: "qm-1", captures: { u1: "$.data[0].id" } }
            - { call: "POST /tissue-bank/tissue-units/${u1}/release", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/implant-cases", payload: { patient_ref: "P-1", or_room_id: "OR-1", scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T12:00:00Z" }, as: ImplantingSurgeon, as_user_id: "surg-1", captures: { c1: $.data.id } }
            - { call: "POST /tissue-bank/implant-cases/${c1}/reservations", payload: { tissue_unit_id: "${u1}" }, as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { res1: $.data.id, hu: $.data.hold_until } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T14:00:00Z" }, as: SupplyChainAdmin, as_user_id: "sca-1" }
            - { call: "GET /tissue-bank/reservations/${res1}", as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { st_eq: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T14:00:01Z" }, as: SupplyChainAdmin, as_user_id: "sca-1" }
            - { call: "GET /tissue-bank/reservations/${res1}", as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { st_after: $.data.status, rr_after: $.data.release_reason } }
          assert:
            - "hu == 2026-08-10T14:00:00Z (scheduled_end + 2 hours)"
            - "st_eq == ACTIVE at exactly hold_until (strict > comparator)"
            - "st_after == EXPIRED and rr_after == CLOCK_EXPIRED; TissueUnit.${u1}.status == AVAILABLE"

  - section: validations
    instances:
      - name: supplier_list_missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "Requests without X-User-ID / X-User-Role fail priority 1 with 400 before any role or existence logic."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /tissue-bank/suppliers", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (http 400)"

      - name: role_denied_before_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=3]"]
        distinguishing_aspect: "Role authorization (priority 2) fires before path existence (priority 3): a QualityManager PUTting a non-existent freezer id gets 403 ERR_INSUFFICIENT_PERMISSIONS, not 404."
        test_recipe:
          setup: ["one real freezer exists (only to source a well-formed version placeholder)"]
          setup_api_calls:
            - { call: "POST /tissue-bank/freezers", payload: { name: "FZ-ULT-1", min_celsius: -80.0, max_celsius: -60.0, nominal_capacity: 50 }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { fv: $.data.version } }
          trigger:
            - { call: "PUT /tissue-bank/freezers/11111111-2222-4333-8444-555555555555", payload: { max_celsius: -59.0, expected_freezer_version: "${fv}" }, as: QualityManager, as_user_id: "qm-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INSUFFICIENT_PERMISSIONS (403 beats 404)"

      - name: request_shape_before_state_on_reject
        claim_type: priority_ordering
        grounds: ["validations[priority=3.4]", "validations[priority=4]"]
        distinguishing_aspect: "A reject call on an already-REJECTED shipment with a too-short reason fails request-shape (3.4) ERR_INVALID_REQUEST, not the state error ERR_SHIPMENT_NOT_RECEIVED (4)."
        test_recipe:
          setup: ["qualified supplier; freezer; shipment already REJECTED"]
          setup_api_calls:
            - { call: "POST /tissue-bank/suppliers", payload: { legal_name: "Acme Tissue Source", license_number: "LIC-001" }, as: QualityManager, as_user_id: "qm-1", captures: { sup: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: AATB_ACCREDITATION, document_ref: "AATB-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_a: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_a}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: FDA_REGISTRATION, document_ref: "FDA-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_f: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_f}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/approve", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /tissue-bank/freezers", payload: { name: "FZ-ULT-1", min_celsius: -80.0, max_celsius: -60.0, nominal_capacity: 50 }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { fz: $.data.id } }
            - { call: "POST /tissue-bank/shipments", payload: { supplier_id: "${sup}", freezer_id: "${fz}", items: [ { tissue_type: BONE, lot_number: "L1", serial_number: "U-001", unit_cost_cents: 5000, expiration_at: "2027-01-01T00:00:00Z", criticality_tier: STANDARD } ] }, as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { sh1: $.data.id } }
            - { call: "POST /tissue-bank/shipments/${sh1}/reject", payload: { rejection_reason: "Cold chain broken in transit" }, as: TissueBankCoordinator, as_user_id: "tbc-1" }
          trigger:
            - { call: "POST /tissue-bank/shipments/${sh1}/reject", payload: { rejection_reason: "short" }, as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST (shape error wins over ERR_SHIPMENT_NOT_RECEIVED)"

      - name: occ_freezer_update_stale_version
        claim_type: violation_to_error
        grounds: ["concurrency_rules[freezer-config-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PUT freezer carries expected_freezer_version: the first update (version 1) succeeds and bumps to 2; replaying the same expected version is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["freezer FZ-ULT-1 created (version 1)"]
          setup_api_calls:
            - { call: "POST /tissue-bank/freezers", payload: { name: "FZ-ULT-1", min_celsius: -80.0, max_celsius: -60.0, nominal_capacity: 50 }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { fz: $.data.id, fv: $.data.version } }
          trigger:
            - { call: "PUT /tissue-bank/freezers/${fz}", payload: { max_celsius: -59.0, expected_freezer_version: "${fv}" }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { v2: $.data.version } }
            - { call: "PUT /tissue-bank/freezers/${fz}", payload: { max_celsius: -58.0, expected_freezer_version: "${fv}" }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { err: $.data.error_id } }
          assert:
            - "v2 == 2 (first update succeeded and incremented version by 1)"
            - "err == ERR_STALE_VERSION (http 412; stale expected version rejected)"
            - "Freezer.${fz}.max_celsius == -59.0 (losers mutation never applied)"

      - name: occ_policy_supersede_stale_version
        claim_type: violation_to_error
        grounds: ["concurrency_rules[par-policy-supersede-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After the ACTIVE BONE policy's version advanced to 2 (via a PUT), a create-supersede carrying the previously observed version 1 is rejected 412; the supersede only proceeds against the current version."
        test_recipe:
          setup: ["ACTIVE BONE policy P1 version 1; PUT bumps it to version 2"]
          setup_api_calls:
            - { call: "POST /tissue-bank/par-level-policies", payload: { tissue_type: BONE, par_quantity: 2, max_inventory_value_cents: 25000 }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { p1: $.data.id, pv: $.data.version } }
            - { call: "PUT /tissue-bank/par-level-policies/${p1}", payload: { par_quantity: 9, expected_par_level_policy_version: "${pv}" }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { pv2: $.data.version } }
          trigger:
            - { call: "POST /tissue-bank/par-level-policies", payload: { tissue_type: BONE, par_quantity: 4, max_inventory_value_cents: 40000, expected_current_policy_version: "${pv}" }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { err: $.data.error_id } }
            - { call: "POST /tissue-bank/par-level-policies", payload: { tissue_type: BONE, par_quantity: 4, max_inventory_value_cents: 40000, expected_current_policy_version: "${pv2}" }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { p2: $.data.id, p2st: $.data.status } }
          assert:
            - "err == ERR_STALE_VERSION (expected 1 but ACTIVE policy is at version 2)"
            - "p2st == ACTIVE (supersede with the current version succeeds)"
            - "ParLevelPolicy.${p1}.status == SUPERSEDED"

      - name: occ_policy_update_stale_version
        claim_type: violation_to_error
        grounds: ["concurrency_rules[par-policy-update-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PUT policy replays: first update at version 1 succeeds (version 2), the identical replay is rejected 412 — the update path is OCC-guarded independently of the create-supersede path."
        test_recipe:
          setup: ["ACTIVE SOFT_TISSUE policy P1 version 1"]
          setup_api_calls:
            - { call: "POST /tissue-bank/par-level-policies", payload: { tissue_type: SOFT_TISSUE, par_quantity: 3, max_inventory_value_cents: 60000 }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { p1: $.data.id, pv: $.data.version } }
          trigger:
            - { call: "PUT /tissue-bank/par-level-policies/${p1}", payload: { max_inventory_value_cents: 70000, expected_par_level_policy_version: "${pv}" }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { v2: $.data.version } }
