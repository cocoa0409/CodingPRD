              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /broadband/programs/${p_id}/open-challenge-window"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /broadband/locations"
              payload: { program_id: "${p_id}", address_id: "ADDR-0001", reported_down_mbps: 200, reported_up_mbps: 25, reported_latency_ms: 30, reported_technology: "FIBER", reporting_provider_user_id: "prov-2" }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
              captures: { l1_id: $.data.id }
            - call: "POST /broadband/challenges"
              payload: { program_id: "${p_id}", location_id: "${l1_id}", challenger_type: "COMMUNITY", asserted_classification: "UNDERSERVED", rationale: "Township survey shows no service above 40/8 at this address." }
              as: Challenger
