scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: risk_los_inpatient_days_vs_observation_hours_flips_tier
        grounds:
          - calculations.readmission_risk_score
          - calculations.risk_tier_assignment
          - calculations.tier_program_parameters
          - calculations.visit_due_date
          - entities.RiskAssessment.fields.los_variant
          - entities.RiskAssessment.fields.los_points
          - entities.DischargeReferral.fields.stay_type
        distinguishing_aspect: |
          The dual variant lives on the RiskAssessment entity domain - the same
          length-of-stay figure is scored by round_half_up(days * 1.5) capped at
          12 for an INPATIENT stay and by round_half_up(hours / 12.0) capped at
          6 for an OBSERVATION stay, and with every other component held
          identical the two formulas produce 35 (HIGH) versus 31 (MODERATE),
          which moves required_visit_complexity and visit_due_date.
        test_recipe:
          setup:
            - "Clock at 2026-05-01T16:00:00Z; one IN_NETWORK facility; one TCM-covered BUSINESS_DAYS payer; one navigator with cap 5."
            - "Two patients each with exactly one accepted referral discharged 2026-05-01, admission_acuity URGENT, comorbidity_count 2, prior_ed_visits_6mo 1, prior_admissions_6mo 3, social_risk_flags_count 0."
            - "Referral A is stay_type INPATIENT with length_of_stay_days 4; referral B is stay_type OBSERVATION with length_of_stay_hours 24."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T16:00:00Z" }
              as: ProgramAdmin
            - call: "POST /tcm/facilities"
              payload: { name: "Mercy General", facility_type: "ACUTE_HOSPITAL", network_status: "IN_NETWORK" }
              as: ProgramAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /tcm/payers"
              payload: { name: "Northstar Health", tcm_covered: true, tcm_rate_multiplier: 1.0, coinsurance_rate: 0.2, contact_deadline_basis: "BUSINESS_DAYS" }
              as: ProgramAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /tcm/navigators"
              payload: { full_name: "Nora Vance", active_episode_cap: 5, cap_policy: "COUNT" }
              as: ProgramAdmin
              captures: { nav1_id: $.data.id }
            - call: "POST /tcm/patients"
              payload: { external_mrn: "MRN-1001", full_name: "Ada Reyes", date_of_birth: "1952-03-14" }
              as: ProgramAdmin
              captures: { pat1_id: $.data.id }
            - call: "POST /tcm/patients"
              payload: { external_mrn: "MRN-1002", full_name: "Ben Okafor", date_of_birth: "1948-11-02" }
              as: ProgramAdmin
              captures: { pat2_id: $.data.id }
            - call: "POST /tcm/referrals"
              payload: { patient_id: "${pat1_id}", facility_id: "${fac_id}", payer_id: "${payer_id}", discharge_date: "2026-05-01", discharge_datetime: "2026-05-01T14:00:00Z", discharge_disposition: "HOME", stay_type: "INPATIENT", length_of_stay_days: 4, admission_acuity: "URGENT", comorbidity_count: 2, prior_ed_visits_6mo: 1, prior_admissions_6mo: 3, social_risk_flags_count: 0 }
              as: IntakeCoordinator
              captures: { ref_a_id: $.data.id }
            - call: "POST /tcm/referrals"
              payload: { patient_id: "${pat2_id}", facility_id: "${fac_id}", payer_id: "${payer_id}", discharge_date: "2026-05-01", discharge_datetime: "2026-05-01T14:00:00Z", discharge_disposition: "HOME", stay_type: "OBSERVATION", length_of_stay_hours: 24, admission_acuity: "URGENT", comorbidity_count: 2, prior_ed_visits_6mo: 1, prior_admissions_6mo: 3, social_risk_flags_count: 0 }
              as: IntakeCoordinator
              captures: { ref_b_id: $.data.id }
          trigger:
            - call: "POST /tcm/referrals/${ref_a_id}/accept"
              payload: { navigator_id: "${nav1_id}" }
              as: IntakeCoordinator
              captures: { ep_a_id: $.data.created_episode_id }
            - call: "POST /tcm/referrals/${ref_b_id}/accept"
              payload: { navigator_id: "${nav1_id}" }
              as: IntakeCoordinator
              captures: { ep_b_id: $.data.created_episode_id }
            - call: "GET /tcm/risk-assessments"
              payload: { episode_id: "${ep_a_id}", is_current: true }
              as: CareNavigator
              as_user_id: "${nav1_id}"
              captures: { ra_a_los: "$.data[0].los_points", ra_a_score: "$.data[0].risk_score" }
            - call: "GET /tcm/risk-assessments"
              payload: { episode_id: "${ep_b_id}", is_current: true }
              as: CareNavigator
              as_user_id: "${nav1_id}"
              captures: { ra_b_los: "$.data[0].los_points", ra_b_score: "$.data[0].risk_score" }
          assert:
            - "RiskAssessment for ${ep_a_id}: los_variant == INPATIENT_DAYS, los_points == 6, acuity_points == 6, comorbidity_points == 5, utilization_points == 18, social_modifier_points == 0, risk_score == 35, risk_tier == HIGH"
            - "RiskAssessment for ${ep_b_id}: los_variant == OBSERVATION_HOURS, los_points == 2, acuity_points == 6, comorbidity_points == 5, utilization_points == 18, social_modifier_points == 0, risk_score == 31, risk_tier == MODERATE"
            - "CareEpisode.${ep_a_id}.required_visit_complexity == HIGH_COMPLEXITY and visit_due_date == 2026-05-08"
            - "CareEpisode.${ep_b_id}.required_visit_complexity == MODERATE_COMPLEXITY and visit_due_date == 2026-05-15"
            - "CareEpisode.${ep_a_id}.risk_score != CareEpisode.${ep_b_id}.risk_score"

      - name: claim_code_full_99496_vs_downgraded_99495
        grounds:
          - calculations.tcm_claim_code_selection
          - calculations.tcm_claim_net_payable
          - entities.TcmClaim.fields.payable_code
          - entities.TcmClaim.fields.payable_variant
          - entities.TcmClaim.fields.net_payable_cents
          - state_machines.TcmVisit.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          The dual variant lives on the TcmClaim entity domain, a different
          subject from the RiskAssessment scoring variant - two HIGH_COMPLEXITY
          episodes with identical payers and identical documented element sets
          bill 99496 at 21480 net cents when the face-to-face lands on day 4 and
          99495 at 16196 net cents when it lands on day 10, so the same inputs
          under two different code-selection branches produce different money.
        test_recipe:
          setup:
            - "Clock starts 2026-05-01T16:00:00Z; IN_NETWORK facility; payer with tcm_rate_multiplier 1.0 and coinsurance_rate 0.2; one navigator with cap 5."
            - "Two patients, each with an accepted HIGH-tier referral discharged 2026-05-01 (risk_score 44)."
            - "Both episodes have successful interactive contact, a COMPLETED zero-item reconciliation and a confirmed visit; episode A's visit completes 2026-05-05 and episode B's completes 2026-05-11, both with the full HIGH element set."
            - "Both service periods are closed on 2026-05-31T01:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T16:00:00Z" }
              as: ProgramAdmin
            - call: "POST /tcm/facilities"
              payload: { name: "Mercy General", facility_type: "ACUTE_HOSPITAL", network_status: "IN_NETWORK" }
              as: ProgramAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /tcm/payers"
              payload: { name: "Northstar Health", tcm_covered: true, tcm_rate_multiplier: 1.0, coinsurance_rate: 0.2, contact_deadline_basis: "BUSINESS_DAYS" }
              as: ProgramAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /tcm/navigators"
              payload: { full_name: "Nora Vance", active_episode_cap: 5, cap_policy: "COUNT" }
              as: ProgramAdmin
              captures: { nav1_id: $.data.id }
            - call: "POST /tcm/patients"
              payload: { external_mrn: "MRN-1001", full_name: "Ada Reyes", date_of_birth: "1952-03-14" }
              as: ProgramAdmin
              captures: { pat1_id: $.data.id }
            - call: "POST /tcm/patients"
              payload: { external_mrn: "MRN-1002", full_name: "Ben Okafor", date_of_birth: "1948-11-02" }
              as: ProgramAdmin
              captures: { pat2_id: $.data.id }
            - call: "POST /tcm/referrals"
              payload: { patient_id: "${pat1_id}", facility_id: "${fac_id}", payer_id: "${payer_id}", discharge_date: "2026-05-01", discharge_datetime: "2026-05-01T14:00:00Z", discharge_disposition: "HOME", stay_type: "INPATIENT", length_of_stay_days: 4, admission_acuity: "URGENT", comorbidity_count: 5, prior_ed_visits_6mo: 2, prior_admissions_6mo: 1, social_risk_flags_count: 3 }
              as: IntakeCoordinator
              captures: { ref_a_id: $.data.id }
            - call: "POST /tcm/referrals/${ref_a_id}/accept"
              payload: { navigator_id: "${nav1_id}" }
              as: IntakeCoordinator
              captures: { ep_a_id: $.data.created_episode_id }
            - call: "POST /tcm/referrals"
              payload: { patient_id: "${pat2_id}", facility_id: "${fac_id}", payer_id: "${payer_id}", discharge_date: "2026-05-01", discharge_datetime: "2026-05-01T14:00:00Z", discharge_disposition: "HOME", stay_type: "INPATIENT", length_of_stay_days: 4, admission_acuity: "URGENT", comorbidity_count: 5, prior_ed_visits_6mo: 2, prior_admissions_6mo: 1, social_risk_flags_count: 3 }
              as: IntakeCoordinator
              captures: { ref_b_id: $.data.id }
            - call: "POST /tcm/referrals/${ref_b_id}/accept"
              payload: { navigator_id: "${nav1_id}" }
              as: IntakeCoordinator
              captures: { ep_b_id: $.data.created_episode_id }
            - call: "POST /tcm/episodes/${ep_a_id}/contact-attempts"
              payload: { modality: "PHONE" }
              as: CareNavigator
              as_user_id: "${nav1_id}"
              captures: { ca_a_id: $.data.id }
            - call: "POST /tcm/contact-attempts/${ca_a_id}/disposition"
              payload: { outcome: "CONNECTED" }
              as: CareNavigator
              as_user_id: "${nav1_id}"
            - call: "POST /tcm/episodes/${ep_b_id}/contact-attempts"
              payload: { modality: "PHONE" }
              as: CareNavigator
              as_user_id: "${nav1_id}"
              captures: { ca_b_id: $.data.id }
            - call: "POST /tcm/contact-attempts/${ca_b_id}/disposition"
              payload: { outcome: "CONNECTED" }
              as: CareNavigator
              as_user_id: "${nav1_id}"
            - call: "POST /tcm/episodes/${ep_a_id}/med-reconciliations"
              payload: {}
              as: Clinician
              as_user_id: "clin-1"
              captures: { mr_a_id: $.data.id }
            - call: "POST /tcm/med-reconciliations/${mr_a_id}/complete"
              payload: {}
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /tcm/episodes/${ep_b_id}/med-reconciliations"
              payload: {}
              as: Clinician
              as_user_id: "clin-1"
              captures: { mr_b_id: $.data.id }
            - call: "POST /tcm/med-reconciliations/${mr_b_id}/complete"
              payload: {}
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /tcm/episodes/${ep_a_id}/visits"
              payload: { navigator_id: "${nav1_id}", scheduled_start: "2026-05-05T15:00:00Z", scheduled_end: "2026-05-05T16:00:00Z" }
              as: CareNavigator
              as_user_id: "${nav1_id}"
              captures: { v_a_id: $.data.id }
            - call: "POST /tcm/visits/${v_a_id}/confirm"
              payload: {}
              as: CareNavigator
              as_user_id: "${nav1_id}"
            - call: "POST /tcm/episodes/${ep_b_id}/visits"
              payload: { navigator_id: "${nav1_id}", scheduled_start: "2026-05-11T15:00:00Z", scheduled_end: "2026-05-11T16:00:00Z" }
              as: CareNavigator
              as_user_id: "${nav1_id}"
              captures: { v_b_id: $.data.id }
            - call: "POST /tcm/visits/${v_b_id}/confirm"
              payload: {}
              as: CareNavigator
              as_user_id: "${nav1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T16:00:00Z" }
              as: ProgramAdmin
            - call: "POST /tcm/visits/${v_a_id}/complete"
              payload: { documented_elements: ["MED_REC_REVIEWED", "DISCHARGE_SUMMARY_REVIEWED", "PATIENT_EDUCATION", "HIGH_COMPLEXITY_MDM", "COMMUNITY_SERVICE_REFERRAL"] }
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /tcm/visits/${v_a_id}/attest"
              payload: {}
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-11T16:00:00Z" }
              as: ProgramAdmin
            - call: "POST /tcm/visits/${v_b_id}/complete"
              payload: { documented_elements: ["MED_REC_REVIEWED", "DISCHARGE_SUMMARY_REVIEWED", "PATIENT_EDUCATION", "HIGH_COMPLEXITY_MDM", "COMMUNITY_SERVICE_REFERRAL"] }
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /tcm/visits/${v_b_id}/attest"
              payload: {}
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-31T01:00:00Z" }
              as: ProgramAdmin
            - call: "POST /tcm/episodes/${ep_a_id}/close-service-period"
              payload: {}
              as: ProgramAdmin
            - call: "POST /tcm/episodes/${ep_b_id}/close-service-period"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /tcm/episodes/${ep_a_id}/claims"
              payload: { visit_id: "${v_a_id}" }
              as: BillingSpecialist
              as_user_id: "bill-prep-1"
              captures: { clm_a_id: $.data.id, clm_a_code: $.data.payable_code, clm_a_net: $.data.net_payable_cents }
            - call: "POST /tcm/episodes/${ep_b_id}/claims"
              payload: { visit_id: "${v_b_id}" }
              as: BillingSpecialist
              as_user_id: "bill-prep-1"
              captures: { clm_b_id: $.data.id, clm_b_code: $.data.payable_code, clm_b_net: $.data.net_payable_cents }
          assert:
            - "TcmClaim.${clm_a_id}.payable_code == 99496 and payable_variant == FULL"
            - "TcmClaim.${clm_a_id}.base_rate_cents == 27680, allowed_cents == 27680, coinsurance_cents == 5536, net_before_withhold_cents == 22144, withhold_pct == 0.03, withhold_cents == 664, net_payable_cents == 21480"
            - "TcmClaim.${clm_b_id}.payable_code == 99495 and payable_variant == DOWNGRADED"
            - "TcmClaim.${clm_b_id}.base_rate_cents == 20450, allowed_cents == 20450, coinsurance_cents == 4090, net_before_withhold_cents == 16360, withhold_pct == 0.01, withhold_cents == 164, net_payable_cents == 16196"
            - "TcmVisit.${v_a_id}.achieved_complexity == HIGH_COMPLEXITY and TcmVisit.${v_b_id}.achieved_complexity == HIGH_COMPLEXITY - the divergence comes from the day-7 timing fork, not from the element set"
            - "CareEpisode.${ep_a_id}.visit_timely == true and CareEpisode.${ep_b_id}.visit_timely == false"

      - name: navigator_cap_count_policy_vs_weighted_policy
        grounds:
          - calculations.navigator_workload_score
          - entities.Navigator.fields.cap_policy
          - entities.Navigator.fields.workload_score
          - entities.Navigator.fields.availability_status
          - state_machines.HandoffRequest.PROPOSED_to_ACCEPTED
          - validations[priority=34]
        distinguishing_aspect: |
          The dual variant lives on the Navigator entity domain - the identical
          pair of HIGH-tier episodes scores 2 against a COUNT navigator (one
          point each) and 4 against a WEIGHTED navigator (two points each), so
          with both caps set to 2 the second handoff is ACCEPTED for the COUNT
          navigator and rejected with ERR_NAVIGATOR_CAP_EXCEEDED for the
          WEIGHTED navigator.
        test_recipe:
          setup:
            - "Clock at 2026-05-01T16:00:00Z; one IN_NETWORK facility and one TCM-covered payer."
            - "Navigator nav0 with cap 5 and cap_policy COUNT owns four freshly accepted HIGH-tier episodes (risk_score 44 each)."
            - "Navigator nav_a has cap 2 and cap_policy COUNT; navigator nav_b has cap 2 and cap_policy WEIGHTED."
            - "Episodes 1 and 2 have already been handed to nav_a and accepted; episode 3 has already been handed to nav_b and accepted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T16:00:00Z" }
              as: ProgramAdmin
            - call: "POST /tcm/facilities"
              payload: { name: "Mercy General", facility_type: "ACUTE_HOSPITAL", network_status: "IN_NETWORK" }
              as: ProgramAdmin
