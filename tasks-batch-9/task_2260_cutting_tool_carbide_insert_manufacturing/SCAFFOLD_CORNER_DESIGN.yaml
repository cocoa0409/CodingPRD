            - call: "POST /tooling/grinding-runs"
              payload: { wheel_id: "${wheel_id}", product_id: "${product_id}", cell_id: "CELL_A", window_start: "2026-08-14T06:00:00Z", window_end: "2026-08-14T07:00:00Z", planned_units: 1 }
              as: ProductionPlanner
              captures: { run_it6: $.data.id }
            - call: "POST /tooling/grinding-runs"
              payload: { wheel_id: "${wheel_id}", product_id: "${product_id}", cell_id: "CELL_B", window_start: "2026-08-14T06:00:00Z", window_end: "2026-08-14T07:00:00Z", planned_units: 1 }
              as: ProductionPlanner
              captures: { run_it7_low: $.data.id }
            - call: "POST /tooling/grinding-runs"
              payload: { wheel_id: "${wheel_id}", product_id: "${product_id}", cell_id: "CELL_C", window_start: "2026-08-14T06:00:00Z", window_end: "2026-08-14T07:00:00Z", planned_units: 1 }
              as: ProductionPlanner
              captures: { run_it7_high: $.data.id }
            - call: "POST /tooling/grinding-runs"
              payload: { wheel_id: "${wheel_id}", product_id: "${product_id}", cell_id: "CELL_D", window_start: "2026-08-14T06:00:00Z", window_end: "2026-08-14T07:00:00Z", planned_units: 1 }
              as: ProductionPlanner
              captures: { run_out: $.data.id }
            - call: "POST /tooling/_clock/set_current_utc"
              payload: { current_utc: "2026-08-14T07:00:00Z" }
              as: ProductionPlanner
