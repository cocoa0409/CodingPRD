      - name: reversion_holdback_weight_table_then_deficiency_then_deposit_cap
        grounds:
          - calculations.reversion_condition_score
          - state_machines.ReversionAssessment.PENDING_INSPECTION_to_INSPECTED
          - state_machines.ReversionAssessment.INSPECTED_to_HOLDBACK_APPLIED
          - state_machines.Lease.ACTIVE_to_EXPIRED
          - validations.priority_15_money_reconciliation
        distinguishing_aspect: |
          Mode (a) - one number, five composed steps: the weight triple is looked up from the
          required_standard_code snapshotted at assessment creation, each component is weighted and
          rounded, the passing score of that same standard gates whether a holdback exists at all, the
          complement to 10000 scales Lease.improvements_value_cents, and only then does deposit_held_cents
          cap the result. The identical score triple 60/70/50 yields 6200 bps under SHELL_CONDITION and
          6000 bps under FULLY_FITTED, and the cap binds on one lease (22800000 -> 1000000) but not the
          other (4000000 of 5000000 available).
