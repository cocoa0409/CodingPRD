        claim_type: tiered_pricing
        grounds:
          - "calculations.funding_claim_reimbursable"
          - "errors[ERR_HIGH_COST_CAP_EXHAUSTED]"
        excluded_because:
          difficulty_instance: high_cost_fund_nested_min_max_tier_and_per_student_cap
          rationale: "funding_claim_reimbursable's HIGH_COST_FUND branch is a three-tier schedule wrapped in a per-student cap. That §1.8 instance walks each tier floor (2000000 and 6000000 of excess, both inclusive), pins the rounding position relative to the cap min(), and drives the cap to exhaustion so a later claim computes to 0 and is rejected."
