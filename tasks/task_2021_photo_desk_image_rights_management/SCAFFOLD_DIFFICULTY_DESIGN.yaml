scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — dual_variant_calc (different entity domains: License vs PaymentRun)
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: license_fee_first_use_vs_reuse
        grounds:
          - calculations.license_fee_quote
          - entities.License.fields.pricing_variant
          - entities.License.fields.fee_cents
        distinguishing_aspect: |
          License-domain dual variant: identical license terms on the same wire image price
          at 12000 under FIRST_USE (times_used == 0) and at 7200 under REUSE (times_used > 0),
          because the 40% reuse discount applies after the exclusivity multiplier.
        test_recipe:
          setup:
            - "WIRE image (base 10000) CLEARED with an ACTIVE DIGITAL/DOMESTIC/non-exclusive license and one DIGITAL usage run, so times_used == 1 when the second license is created"
          setup_api_calls:
            - { call: "POST /images", payload: { source_type: "WIRE", agency_name: "WireCo", base_license_fee_cents: 10000, caption: "Flooded main street looking north", credit_line: "WireCo Staff / WireCo", keywords: ["flood"] }, as: RightsManager, captures: { w_id: $.data.id } }
            - { call: "POST /images/${w_id}/clear", payload: {}, as: RightsManager }
            - { call: "GET /images/${w_id}", as: RightsManager, captures: { w_v1: $.data.version } }
            - { call: "POST /images/${w_id}/licenses", payload: { usage_scope: "DIGITAL", territory: "DOMESTIC", valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-08-31T23:59:59Z", exclusive: false, expected_image_version: "${w_v1}" }, as: RightsManager, captures: { l1_id: $.data.id, l1_fee: $.data.fee_cents, l1_variant: $.data.pricing_variant } }
            - { call: "POST /licenses/${l1_id}/activate", payload: {}, as: RightsManager }
            - { call: "POST /images/${w_id}/usage-runs", payload: { license_id: "${l1_id}", channel: "DIGITAL", story_slug: "flood-day-one", published_at: "2026-08-03T12:00:00Z" }, as: RightsManager }
            - { call: "GET /images/${w_id}", as: RightsManager, captures: { w_v2: $.data.version } }
          trigger:
            - { call: "POST /images/${w_id}/licenses", payload: { usage_scope: "DIGITAL", territory: "DOMESTIC", valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-08-31T23:59:59Z", exclusive: false, expected_image_version: "${w_v2}" }, as: RightsManager, captures: { l2_fee: $.data.fee_cents, l2_variant: $.data.pricing_variant } }
          assert:
            - "captured l1_variant == FIRST_USE"
            - "captured l1_fee == 12000"
            - "captured l2_variant == REUSE"
            - "captured l2_fee == 7200"
            - "l1_fee != l2_fee"

      - name: payout_guarantee_vs_royalty_same_period
        grounds:
          - calculations.photographer_payout
          - entities.PaymentRun.fields.method
          - entities.PaymentRun.fields.guarantee_amount_cents
          - entities.PaymentRun.fields.royalty_amount_cents
        distinguishing_aspect: |
          PaymentRun-domain dual variant: identical period activity (one ACCEPTED 2-day
          assignment with 1 cleared image + 2 SOCIAL usage runs) prices at 70000 under the
          GUARANTEE method and at 306 under the ROYALTY method; the FREELANCE photographer's
          run selects ROYALTY for total_cents.
        test_recipe:
          setup:
            - "FREELANCE photographer (day 20000, per-image 30000, royalty rate 305) with one ACCEPTED assignment (shoot 2026-08-10..2026-08-11, day_count 2, accepted_at 2026-08-12) and 2 SOCIAL usage runs published in [2026-08-01, 2026-09-01)"
          setup_api_calls:
            - { call: "POST /photographers", payload: { full_name: "Fran Free", email: "fran@freelance.io", photographer_type: "FREELANCE", day_rate_cents: 20000, per_image_fee_cents: 30000, royalty_rate_per_use_cents: 305, rights_reversion_months: 12 }, as: PhotoEditor, captures: { p_id: $.data.id } }
            - { call: "POST /story-requests", payload: { headline: "Night market", slug: "night-market", needed_by: "2026-09-01T00:00:00Z", budget_cents: 30000 }, as: PhotoEditor, captures: { s_id: $.data.id } }
            - { call: "POST /story-requests/${s_id}/decide", payload: { decision: "COMMISSION", photographer_id: "${p_id}", brief: "Cover the night market", shoot_start: "2026-08-10T09:00:00Z", shoot_end: "2026-08-11T17:00:00Z", min_image_count: 1, max_image_count: 3 }, as: PhotoEditor, captures: { a_id: $.data.commissioned_assignment_id } }
            - { call: "POST /assignments/${a_id}/images", payload: { caption: "Night market stalls under rain", credit_line: "Fran Free / ACME News", keywords: ["market"] }, as: Photographer, as_user_id: "${p_id}", captures: { img_id: $.data.id } }
            - { call: "POST /assignments/${a_id}/submit", payload: {}, as: Photographer, as_user_id: "${p_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /assignments/${a_id}/accept", payload: {}, as: PhotoEditor }
            - { call: "GET /images/${img_id}", as: RightsManager, captures: { img_v: $.data.version } }
            - { call: "POST /images/${img_id}/licenses", payload: { usage_scope: "SOCIAL", valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-09-30T00:00:00Z", expected_image_version: "${img_v}" }, as: RightsManager, captures: { lic_id: $.data.id } }
            - { call: "POST /licenses/${lic_id}/activate", payload: {}, as: RightsManager }
            - { call: "POST /images/${img_id}/usage-runs", payload: { license_id: "${lic_id}", channel: "SOCIAL", story_slug: "night-market", published_at: "2026-08-15T10:00:00Z" }, as: PhotoEditor }
            - { call: "POST /images/${img_id}/usage-runs", payload: { license_id: "${lic_id}", channel: "SOCIAL", story_slug: "night-market", published_at: "2026-08-16T10:00:00Z" }, as: PhotoEditor }
            - { call: "GET /photographers/${p_id}", as: FinanceAdmin, captures: { p_v: $.data.version } }
          trigger:
            - { call: "POST /photographers/${p_id}/payment-runs", payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", expected_photographer_version: "${p_v}" }, as: FinanceAdmin, captures: { run_g: $.data.guarantee_amount_cents, run_r: $.data.royalty_amount_cents, run_m: $.data.method, run_t: $.data.total_cents } }
          assert:
            - "captured run_g == 70000"
            - "captured run_r == 306"
            - "captured run_m == ROYALTY"
            - "captured run_t == 306"
            - "run_g != run_r"

  # =====================================================================
  # Rule 2 — combinatorial_formula (modes a, b, c)
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: license_fee_scope_territory_exclusivity_tiering
        grounds:
          - calculations.license_fee_quote
        distinguishing_aspect: |
          Mode (a): fee combines four inputs with non-linear interaction — scope tier
          (SYNDICATION 1.5), territory tier (GLOBAL 1.6), exclusivity branch (x2.0) —
          pinned evaluation order yields 48000 on a 10000 base; any other multiplication
          grouping or a flat rate would diverge.
        test_recipe:
          setup:
            - "STOCK image (base 10000) CLEARED; no prior usage (FIRST_USE variant)"
          setup_api_calls:
            - { call: "POST /images", payload: { source_type: "STOCK", agency_name: "StockHouse", base_license_fee_cents: 10000, caption: "Aerial view of the harbor at dusk", credit_line: "StockHouse / StockHouse", keywords: ["harbor"] }, as: RightsManager, captures: { w_id: $.data.id } }
            - { call: "POST /images/${w_id}/clear", payload: {}, as: RightsManager }
            - { call: "GET /images/${w_id}", as: RightsManager, captures: { w_v: $.data.version } }
          trigger:
            - { call: "POST /images/${w_id}/licenses", payload: { usage_scope: "SYNDICATION", territory: "GLOBAL", valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z", exclusive: true, expected_image_version: "${w_v}" }, as: RightsManager, captures: { fee: $.data.fee_cents, variant: $.data.pricing_variant } }
          assert:
            - "captured fee == 48000"
            - "captured variant == FIRST_USE"

      - name: royalty_per_line_rounding_then_sum
        grounds:
          - calculations.photographer_payout
          - calculations.usage_ordinal_and_tier
          - entities.UsageRun.fields.royalty_cents
        distinguishing_aspect: |
          Mode (b): per-line round_half_up then sum — three SOCIAL uses at rate 305 give
          153+153+153 = 459, whereas sum-then-round would give round(457.5) = 458; the
          scaffold pins per-line rounding, so 459 is the only correct total.
        test_recipe:
          setup:
            - "FREELANCE photographer (royalty rate 305) with a CLEARED assignment image, ACTIVE SOCIAL license, and 3 SOCIAL usage runs in period"
          setup_api_calls:
            - { call: "POST /photographers", payload: { full_name: "Rae Round", email: "rae@freelance.io", photographer_type: "FREELANCE", day_rate_cents: 20000, per_image_fee_cents: 30000, royalty_rate_per_use_cents: 305 }, as: PhotoEditor, captures: { p_id: $.data.id } }
            - { call: "POST /story-requests", payload: { headline: "County fair", slug: "county-fair", needed_by: "2026-09-01T00:00:00Z", budget_cents: 30000 }, as: PhotoEditor, captures: { s_id: $.data.id } }
            - { call: "POST /story-requests/${s_id}/decide", payload: { decision: "COMMISSION", photographer_id: "${p_id}", brief: "Fair coverage", shoot_start: "2026-08-10T09:00:00Z", shoot_end: "2026-08-10T17:00:00Z" }, as: PhotoEditor, captures: { a_id: $.data.commissioned_assignment_id } }
            - { call: "POST /assignments/${a_id}/images", payload: { caption: "Prize pigs at the county fair", credit_line: "Rae Round / ACME News" }, as: Photographer, as_user_id: "${p_id}", captures: { img_id: $.data.id } }
            - { call: "POST /assignments/${a_id}/submit", payload: {}, as: Photographer, as_user_id: "${p_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /assignments/${a_id}/accept", payload: {}, as: PhotoEditor }
            - { call: "GET /images/${img_id}", as: RightsManager, captures: { img_v: $.data.version } }
            - { call: "POST /images/${img_id}/licenses", payload: { usage_scope: "SOCIAL", valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-09-30T00:00:00Z", expected_image_version: "${img_v}" }, as: RightsManager, captures: { lic_id: $.data.id } }
            - { call: "POST /licenses/${lic_id}/activate", payload: {}, as: RightsManager }
            - { call: "POST /images/${img_id}/usage-runs", payload: { license_id: "${lic_id}", channel: "SOCIAL", story_slug: "county-fair", published_at: "2026-08-15T10:00:00Z" }, as: RightsManager, captures: { u1_r: $.data.royalty_cents } }
            - { call: "POST /images/${img_id}/usage-runs", payload: { license_id: "${lic_id}", channel: "SOCIAL", story_slug: "county-fair", published_at: "2026-08-16T10:00:00Z" }, as: RightsManager }
            - { call: "POST /images/${img_id}/usage-runs", payload: { license_id: "${lic_id}", channel: "SOCIAL", story_slug: "county-fair", published_at: "2026-08-17T10:00:00Z" }, as: RightsManager }
            - { call: "GET /photographers/${p_id}", as: FinanceAdmin, captures: { p_v: $.data.version } }
          trigger:
            - { call: "POST /photographers/${p_id}/payment-runs", payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", expected_photographer_version: "${p_v}" }, as: FinanceAdmin, captures: { run_r: $.data.royalty_amount_cents, run_t: $.data.total_cents } }
          assert:
            - "captured u1_r == 153"
            - "captured run_r == 459"
            - "captured run_t == 459"
            - "459 != 458 (the sum-then-round outcome)"

      - name: settlement_clawback_order_pinned
        grounds:
          - calculations.settlement_split
          - entities.InfringementClaim.fields.photographer_clawback_cents
          - entities.Photographer.fields.accrued_earnings_cents
        distinguishing_aspect: |
          Mode (c): the clawback depends on settlement_amount_cents only, while the same
          resolution also revokes licenses and recomputes accruals — the pinned evaluation
          order (clawback from settlement first, accrual debit last, floor 0) yields
          clawback 30000 and accrued 10000; computing the clawback from post-cascade
          accrual state would diverge.
        test_recipe:
          setup:
            - "STAFF photographer (per-image 40000) with one ACCEPTED assignment (1 cleared image; accrued_earnings_cents == 40000); an open UNDER_REVIEW claim on that image intaken by rm_alice"
          setup_api_calls:
            - { call: "POST /photographers", payload: { full_name: "Sam Staff", email: "sam@acme.news", photographer_type: "STAFF", day_rate_cents: 25000, per_image_fee_cents: 40000, royalty_rate_per_use_cents: 305 }, as: PhotoEditor, captures: { p_id: $.data.id } }
            - { call: "POST /story-requests", payload: { headline: "Bridge fire", slug: "bridge-fire", needed_by: "2026-09-01T00:00:00Z", budget_cents: 30000 }, as: PhotoEditor, captures: { s_id: $.data.id } }
            - { call: "POST /story-requests/${s_id}/decide", payload: { decision: "COMMISSION", photographer_id: "${p_id}", brief: "Cover the scene", shoot_start: "2026-08-10T09:00:00Z", shoot_end: "2026-08-11T17:00:00Z" }, as: PhotoEditor, captures: { a_id: $.data.commissioned_assignment_id } }
            - { call: "POST /assignments/${a_id}/images", payload: { caption: "Firefighters at dawn on the bridge", credit_line: "Sam Staff / ACME News" }, as: Photographer, as_user_id: "${p_id}", captures: { img_id: $.data.id } }
            - { call: "POST /assignments/${a_id}/submit", payload: {}, as: Photographer, as_user_id: "${p_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /assignments/${a_id}/accept", payload: {}, as: PhotoEditor }
            - { call: "POST /infringement-claims", payload: { image_id: "${img_id}", claimant_name: "Pix Agency", claim_type: "COPYRIGHT_DISPUTE", description: "Overlapping exclusive sold elsewhere", claimed_amount_cents: 100000 }, as: RightsManager, as_user_id: "rm_alice", captures: { c_id: $.data.id } }
            - { call: "POST /infringement-claims/${c_id}/review", payload: {}, as: RightsManager, as_user_id: "rm_alice" }
          trigger:
            - { call: "POST /infringement-claims/${c_id}/resolve", payload: { outcome: "UPHELD", settlement_amount_cents: 100000 }, as: RightsManager, as_user_id: "rm_bob", captures: { claw: $.data.photographer_clawback_cents, c_status: $.data.status } }
            - { call: "GET /photographers/${p_id}", as: FinanceAdmin, captures: { p_accr: $.data.accrued_earnings_cents } }
          assert:
            - "captured claw == 30000"
            - "captured c_status == RESOLVED"
            - "captured p_accr == 10000"

  # =====================================================================
  # Rule 3 — non_linear_state_machine (Assignment cycle vs Claim cycle)
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: assignment_revision_cycle_returns_to_submitted
        grounds:
          - state_machines.Assignment.SUBMITTED_to_REVISION_REQUESTED
          - state_machines.Assignment.REVISION_REQUESTED_to_IN_PROGRESS
          - entities.Assignment.fields.revision_count
        distinguishing_aspect: |
          Assignment is cyclic: SUBMITTED -> REVISION_REQUESTED -> IN_PROGRESS -> SUBMITTED
          loops the entity back to a prior state with revision_count monotonically
          increasing, and acceptance is only reachable after the loop.
        test_recipe:
          setup:
            - "Commissioned assignment for a STAFF photographer with one submitted image, moved to SUBMITTED"
          setup_api_calls:
            - { call: "POST /photographers", payload: { full_name: "Sam Staff", email: "sam@acme.news", photographer_type: "STAFF", day_rate_cents: 25000, per_image_fee_cents: 40000, royalty_rate_per_use_cents: 305 }, as: PhotoEditor, captures: { p_id: $.data.id } }
            - { call: "POST /story-requests", payload: { headline: "Bridge fire", slug: "bridge-fire", needed_by: "2026-09-01T00:00:00Z", budget_cents: 30000 }, as: PhotoEditor, captures: { s_id: $.data.id } }
            - { call: "POST /story-requests/${s_id}/decide", payload: { decision: "COMMISSION", photographer_id: "${p_id}", brief: "Cover the scene", shoot_start: "2026-08-10T09:00:00Z", shoot_end: "2026-08-11T17:00:00Z", max_image_count: 3 }, as: PhotoEditor, captures: { a_id: $.data.commissioned_assignment_id } }
            - { call: "POST /assignments/${a_id}/images", payload: { caption: "Firefighters at dawn on the bridge", credit_line: "Sam Staff / ACME News" }, as: Photographer, as_user_id: "${p_id}" }
            - { call: "POST /assignments/${a_id}/submit", payload: {}, as: Photographer, as_user_id: "${p_id}" }
          trigger:
            - { call: "POST /assignments/${a_id}/request-revision", payload: { feedback: "Need a wider angle" }, as: PhotoEditor, captures: { st1: $.data.status, rc: $.data.revision_count } }
            - { call: "POST /assignments/${a_id}/images", payload: { caption: "Wide shot of the bridge fire scene", credit_line: "Sam Staff / ACME News" }, as: Photographer, as_user_id: "${p_id}", captures: { img2_id: $.data.id } }
            - { call: "GET /assignments/${a_id}", as: PhotoEditor, captures: { st2: $.data.status } }
            - { call: "POST /assignments/${a_id}/submit", payload: {}, as: Photographer, as_user_id: "${p_id}", captures: { st3: $.data.status } }
            - { call: "POST /assignments/${a_id}/accept", payload: {}, as: PhotoEditor, captures: { st4: $.data.status } }
            - { call: "GET /photographers/${p_id}", as: PhotoEditor, captures: { p_accr: $.data.accrued_earnings_cents } }
          assert:
            - "captured st1 == REVISION_REQUESTED"
            - "captured rc == 1"
            - "captured st2 == IN_PROGRESS (auto-transition on new image submission)"
            - "captured st3 == SUBMITTED"
            - "captured st4 == ACCEPTED"
            - "captured p_accr == 80000 (2 cleared images x 40000)"

      - name: claim_offer_counter_negotiation_cycle
        grounds:
          - state_machines.InfringementClaim.SETTLEMENT_OFFERED_to_COUNTERED
          - state_machines.InfringementClaim.COUNTERED_to_SETTLEMENT_OFFERED
          - entities.InfringementClaim.fields.proposed_settlement_cents
        distinguishing_aspect: |
          InfringementClaim is cyclic on a different entity: SETTLEMENT_OFFERED -> COUNTERED
          -> SETTLEMENT_OFFERED negotiation rounds repeat with proposed_settlement_cents
          tracking the latest round before resolution from a negotiated state.
        test_recipe:
          setup:
            - "CLEARED WIRE image with an INTAKE claim (intaken by rm_alice) moved to UNDER_REVIEW"
          setup_api_calls:
            - { call: "POST /images", payload: { source_type: "WIRE", agency_name: "WireCo", base_license_fee_cents: 10000, caption: "Flooded main street looking north", credit_line: "WireCo Staff / WireCo" }, as: RightsManager, captures: { w_id: $.data.id } }
            - { call: "POST /images/${w_id}/clear", payload: {}, as: RightsManager }
            - { call: "POST /infringement-claims", payload: { image_id: "${w_id}", claimant_name: "Rival Wire", claim_type: "COPYRIGHT_DISPUTE", description: "Disputed exclusivity", claimed_amount_cents: 80000 }, as: RightsManager, as_user_id: "rm_alice", captures: { c_id: $.data.id } }
            - { call: "POST /infringement-claims/${c_id}/review", payload: {}, as: RightsManager, as_user_id: "rm_alice" }
          trigger:
            - { call: "POST /infringement-claims/${c_id}/offer", payload: { settlement_offer_cents: 50000 }, as: RightsManager, as_user_id: "rm_alice", captures: { st1: $.data.status, ps1: $.data.proposed_settlement_cents } }
            - { call: "POST /infringement-claims/${c_id}/counter", payload: { counter_amount_cents: 70000 }, as: RightsManager, as_user_id: "rm_alice", captures: { st2: $.data.status, ps2: $.data.proposed_settlement_cents } }
            - { call: "POST /infringement-claims/${c_id}/offer", payload: { settlement_offer_cents: 60000 }, as: RightsManager, as_user_id: "rm_alice", captures: { st3: $.data.status, ps3: $.data.proposed_settlement_cents } }
            - { call: "POST /infringement-claims/${c_id}/resolve", payload: { outcome: "UPHELD", settlement_amount_cents: 60000 }, as: RightsManager, as_user_id: "rm_bob", captures: { st4: $.data.status, settle: $.data.settlement_amount_cents, claw: $.data.photographer_clawback_cents } }
          assert:
            - "captured st1 == SETTLEMENT_OFFERED and ps1 == 50000"
            - "captured st2 == COUNTERED and ps2 == 70000"
            - "captured st3 == SETTLEMENT_OFFERED and ps3 == 60000"
            - "captured st4 == RESOLVED and settle == 60000"
            - "captured claw == 0 (WIRE source bears no photographer clawback)"

  # =====================================================================
  # Rule 4 — transitive_cascade (different triggers, depths 3 and 2)
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: claim_upheld_cascade_image_license_story
        grounds:
          - state_machines.InfringementClaim.UNDER_REVIEW_to_RESOLVED
          - state_machines.Image.restriction_status.NONE_to_RESTRICTED
          - state_machines.License.ACTIVE_to_REVOKED
          - entities.StoryRequest.fields.committed_cents
        distinguishing_aspect: |
          Depth-3 cascade triggered by claim resolve(UPHELD): claim -> image restriction
          latch (hop 1) -> ACTIVE license on the image REVOKED (hop 2, caused by hop 1) ->
          linked StoryRequest.committed_cents released 12000 -> 0 (hop 3, caused by hop 2).
        test_recipe:
          setup:
            - "Story (budget 30000) with a CLEARED WIRE image whose story-linked DIGITAL license (fee 12000) is ACTIVE, so committed_cents == 12000; an UNDER_REVIEW claim on the image (intaken by rm_alice)"
          setup_api_calls:
            - { call: "POST /story-requests", payload: { headline: "Flood aftermath", slug: "flood-aftermath", needed_by: "2026-09-01T00:00:00Z", budget_cents: 30000 }, as: PhotoEditor, captures: { s_id: $.data.id } }
            - { call: "POST /images", payload: { source_type: "WIRE", agency_name: "WireCo", base_license_fee_cents: 10000, caption: "Flooded main street looking north", credit_line: "WireCo Staff / WireCo" }, as: RightsManager, captures: { w_id: $.data.id } }
            - { call: "POST /images/${w_id}/clear", payload: {}, as: RightsManager }
            - { call: "GET /images/${w_id}", as: RightsManager, captures: { w_v: $.data.version } }
            - { call: "POST /images/${w_id}/licenses", payload: { usage_scope: "DIGITAL", valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-08-31T23:59:59Z", story_request_id: "${s_id}", expected_image_version: "${w_v}" }, as: RightsManager, captures: { lic_id: $.data.id } }
            - { call: "POST /licenses/${lic_id}/activate", payload: {}, as: RightsManager }
            - { call: "POST /infringement-claims", payload: { image_id: "${w_id}", claimant_name: "Rival Wire", claim_type: "UNLICENSED_USE", description: "License terms breached", claimed_amount_cents: 50000 }, as: RightsManager, as_user_id: "rm_alice", captures: { c_id: $.data.id } }
            - { call: "POST /infringement-claims/${c_id}/review", payload: {}, as: RightsManager, as_user_id: "rm_alice" }
          trigger:
            - { call: "POST /infringement-claims/${c_id}/resolve", payload: { outcome: "UPHELD", settlement_amount_cents: 50000 }, as: RightsManager, as_user_id: "rm_bob" }
            - { call: "GET /images/${w_id}", as: RightsManager, captures: { img_restr: $.data.restriction_status } }
            - { call: "GET /licenses/${lic_id}", as: RightsManager, captures: { lic_st: $.data.status } }
            - { call: "GET /story-requests/${s_id}", as: PhotoEditor, captures: { s_comm: $.data.committed_cents } }
          assert:
            - "captured img_restr == RESTRICTED (hop 1)"
            - "captured lic_st == REVOKED (hop 2)"
            - "captured s_comm == 0 (hop 3: 12000 released)"

      - name: assignment_accept_cascade_images_accrual
        grounds:
          - state_machines.Assignment.SUBMITTED_to_ACCEPTED
          - state_machines.Image.INGESTED_to_CLEARED
          - entities.Photographer.fields.accrued_earnings_cents
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (assignment accept): accept -> each
          INGESTED image of the assignment CLEARED (hop 1) -> photographer
          accrued_earnings_cents incremented by per_image_fee per cleared image
          (hop 2, caused by hop 1).
        test_recipe:
          setup:
            - "STAFF photographer (per-image 40000) with a SUBMITTED assignment carrying 2 INGESTED images"
          setup_api_calls:
            - { call: "POST /photographers", payload: { full_name: "Sam Staff", email: "sam@acme.news", photographer_type: "STAFF", day_rate_cents: 25000, per_image_fee_cents: 40000, royalty_rate_per_use_cents: 305 }, as: PhotoEditor, captures: { p_id: $.data.id } }
            - { call: "POST /story-requests", payload: { headline: "Bridge fire", slug: "bridge-fire", needed_by: "2026-09-01T00:00:00Z", budget_cents: 30000 }, as: PhotoEditor, captures: { s_id: $.data.id } }
            - { call: "POST /story-requests/${s_id}/decide", payload: { decision: "COMMISSION", photographer_id: "${p_id}", brief: "Cover the scene", shoot_start: "2026-08-10T09:00:00Z", shoot_end: "2026-08-11T17:00:00Z", max_image_count: 3 }, as: PhotoEditor, captures: { a_id: $.data.commissioned_assignment_id } }
            - { call: "POST /assignments/${a_id}/images", payload: { caption: "Firefighters at dawn on the bridge", credit_line: "Sam Staff / ACME News" }, as: Photographer, as_user_id: "${p_id}", captures: { img1_id: $.data.id } }
            - { call: "POST /assignments/${a_id}/images", payload: { caption: "Smoke over the river at sunrise", credit_line: "Sam Staff / ACME News" }, as: Photographer, as_user_id: "${p_id}", captures: { img2_id: $.data.id } }
            - { call: "POST /assignments/${a_id}/submit", payload: {}, as: Photographer, as_user_id: "${p_id}" }
          trigger:
            - { call: "POST /assignments/${a_id}/accept", payload: {}, as: PhotoEditor, captures: { a_st: $.data.status } }
            - { call: "GET /images/${img1_id}", as: PhotoEditor, captures: { i1_st: $.data.status } }
            - { call: "GET /images/${img2_id}", as: PhotoEditor, captures: { i2_st: $.data.status } }
            - { call: "GET /photographers/${p_id}", as: PhotoEditor, captures: { p_accr: $.data.accrued_earnings_cents } }
          assert:
            - "captured a_st == ACCEPTED"
            - "captured i1_st == CLEARED and i2_st == CLEARED (hop 1)"
            - "captured p_accr == 80000 (hop 2: 2 x 40000)"

  # =====================================================================
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_error_beats_embargo_temporal
        grounds:
          - validations[priority=6]
          - validations[priority=15]
          - errors[ERR_IMAGE_NOT_CLEARED]
          - errors[ERR_EMBARGO_ACTIVE]
        distinguishing_aspect: |
          Pair state(p6) vs business_temporal(p15): the target image violates both rules
          at once — INGESTED (not cleared) and embargoed at published_at;
          ERR_IMAGE_NOT_CLEARED must win over ERR_EMBARGO_ACTIVE because state outranks
          temporal.
        test_recipe:
          setup:
            - "W1: WIRE image with embargo_until 2026-09-01T00:00:00Z, never cleared; W2: CLEARED WIRE image with an ACTIVE DIGITAL license (used only to supply a valid license_id)"
          setup_api_calls:
            - { call: "POST /images", payload: { source_type: "WIRE", agency_name: "WireCo", base_license_fee_cents: 10000, caption: "Embargoed protest scene downtown", credit_line: "WireCo Staff / WireCo", embargo_until: "2026-09-01T00:00:00Z" }, as: RightsManager, captures: { w1_id: $.data.id } }
            - { call: "POST /images", payload: { source_type: "WIRE", agency_name: "WireCo", base_license_fee_cents: 10000, caption: "Flooded main street looking north", credit_line: "WireCo Staff / WireCo" }, as: RightsManager, captures: { w2_id: $.data.id } }
            - { call: "POST /images/${w2_id}/clear", payload: {}, as: RightsManager }
            - { call: "GET /images/${w2_id}", as: RightsManager, captures: { w2_v: $.data.version } }
            - { call: "POST /images/${w2_id}/licenses", payload: { usage_scope: "DIGITAL", valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z", expected_image_version: "${w2_v}" }, as: RightsManager, captures: { lic_id: $.data.id } }
            - { call: "POST /licenses/${lic_id}/activate", payload: {}, as: RightsManager }
          trigger:
            - { call: "POST /images/${w1_id}/usage-runs", payload: { license_id: "${lic_id}", channel: "DIGITAL", story_slug: "protest-embargo", published_at: "2026-08-20T00:00:00Z" }, as: RightsManager, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_IMAGE_NOT_CLEARED (state p6 beats embargo p15 and license-mismatch p19)"

      - name: release_safety_beats_budget_fiscal
        grounds:
          - validations[priority=8]
          - validations[priority=24]
          - errors[ERR_RELEASE_REQUIRED]
          - errors[ERR_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Pair business_safety(p8) vs business_fiscal(p23): activation would both breach
          the release gate (identifiable people, no MODEL release) and exceed the story
          budget (fee 48000 > 10000); ERR_RELEASE_REQUIRED must win.
        test_recipe:
          setup:
            - "Story (budget 10000); CLEARED WIRE image (base 10000) with has_identifiable_people=true and no releases; DRAFT story-linked SYNDICATION/GLOBAL/exclusive license (fee 48000)"
          setup_api_calls:
            - { call: "POST /story-requests", payload: { headline: "Celebrity gala", slug: "celebrity-gala", needed_by: "2026-09-01T00:00:00Z", budget_cents: 10000 }, as: PhotoEditor, captures: { s_id: $.data.id } }
            - { call: "POST /images", payload: { source_type: "WIRE", agency_name: "WireCo", base_license_fee_cents: 10000, caption: "Actor on the gala red carpet", credit_line: "WireCo Staff / WireCo", has_identifiable_people: true }, as: RightsManager, captures: { w_id: $.data.id } }
            - { call: "POST /images/${w_id}/clear", payload: {}, as: RightsManager }
            - { call: "GET /images/${w_id}", as: RightsManager, captures: { w_v: $.data.version } }
            - { call: "POST /images/${w_id}/licenses", payload: { usage_scope: "SYNDICATION", territory: "GLOBAL", valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z", exclusive: true, story_request_id: "${s_id}", expected_image_version: "${w_v}" }, as: RightsManager, captures: { lic_id: $.data.id } }
          trigger:
            - { call: "POST /licenses/${lic_id}/activate", payload: {}, as: RightsManager, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_RELEASE_REQUIRED (safety p8 beats budget p24)"

  # =====================================================================
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: embargo_exact_instant_publish_allowed
        grounds:
          - validations[priority=15]
          - entities.Image.fields.embargo_until
          - errors[ERR_EMBARGO_ACTIVE]
        distinguishing_aspect: |
          Time-instant metric on POST /images/{id}/usage-runs: published_at strictly
          before embargo_until is rejected, but published_at exactly equal to
          embargo_until is allowed (>= boundary, not >).
        test_recipe:
          setup:
            - "CLEARED WIRE image with embargo_until 2026-08-05T00:00:00Z and an ACTIVE DIGITAL license covering August"
          setup_api_calls:
            - { call: "POST /images", payload: { source_type: "WIRE", agency_name: "WireCo", base_license_fee_cents: 10000, caption: "Embargoed protest scene downtown", credit_line: "WireCo Staff / WireCo", embargo_until: "2026-08-05T00:00:00Z" }, as: RightsManager, captures: { w_id: $.data.id } }
            - { call: "POST /images/${w_id}/clear", payload: {}, as: RightsManager }
            - { call: "GET /images/${w_id}", as: RightsManager, captures: { w_v: $.data.version } }
            - { call: "POST /images/${w_id}/licenses", payload: { usage_scope: "DIGITAL", valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-08-31T23:59:59Z", expected_image_version: "${w_v}" }, as: RightsManager, captures: { lic_id: $.data.id } }
            - { call: "POST /licenses/${lic_id}/activate", payload: {}, as: RightsManager }
          trigger:
            - { call: "POST /images/${w_id}/usage-runs", payload: { license_id: "${lic_id}", channel: "DIGITAL", story_slug: "protest-early", published_at: "2026-08-04T23:59:59Z" }, as: RightsManager, captures: { err: $.data.error_id } }
            - { call: "POST /images/${w_id}/usage-runs", payload: { license_id: "${lic_id}", channel: "DIGITAL", story_slug: "protest-lifted", published_at: "2026-08-05T00:00:00Z" }, as: RightsManager, captures: { run_id: $.data.id } }
            - { call: "GET /images/${w_id}", as: RightsManager, captures: { used: $.data.times_used, st: $.data.status } }
          assert:
            - "captured err == ERR_EMBARGO_ACTIVE (one second before the embargo instant)"
            - "second usage run created successfully at exactly embargo_until"
            - "captured used == 1 and st == PUBLISHED"

      - name: royalty_tier_tenth_use_boundary
        grounds:
          - calculations.usage_ordinal_and_tier
          - calculations.photographer_payout
        distinguishing_aspect: |
          Usage-count metric on POST /photographers/{id}/payment-runs: at rate 305 DIGITAL,
          uses 1-9 earn 381 each (tier 1.0) while the 10th use earns 572 (tier 1.5 at
          ordinal >= 10) — 9 uses total 3429, 10 uses total 4001; the boundary is the
          >= 10 ordinal crossing.
        test_recipe:
          setup:
            - "FREELANCE photographer (royalty 305) with a CLEARED assignment image, ACTIVE DIGITAL license, and 9 DIGITAL usage runs in period"
          setup_api_calls:
            - { call: "POST /photographers", payload: { full_name: "Tia Tier", email: "tia@freelance.io", photographer_type: "FREELANCE", day_rate_cents: 20000, per_image_fee_cents: 30000, royalty_rate_per_use_cents: 305 }, as: PhotoEditor, captures: { p_id: $.data.id } }
            - { call: "POST /story-requests", payload: { headline: "Election night", slug: "election-night", needed_by: "2026-09-01T00:00:00Z", budget_cents: 30000 }, as: PhotoEditor, captures: { s_id: $.data.id } }
            - { call: "POST /story-requests/${s_id}/decide", payload: { decision: "COMMISSION", photographer_id: "${p_id}", brief: "Election HQ", shoot_start: "2026-08-10T09:00:00Z", shoot_end: "2026-08-10T17:00:00Z" }, as: PhotoEditor, captures: { a_id: $.data.commissioned_assignment_id } }
            - { call: "POST /assignments/${a_id}/images", payload: { caption: "Supporters react to early results", credit_line: "Tia Tier / ACME News" }, as: Photographer, as_user_id: "${p_id}", captures: { img_id: $.data.id } }
            - { call: "POST /assignments/${a_id}/submit", payload: {}, as: Photographer, as_user_id: "${p_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /assignments/${a_id}/accept", payload: {}, as: PhotoEditor }
            - { call: "GET /images/${img_id}", as: RightsManager, captures: { img_v: $.data.version } }
            - { call: "POST /images/${img_id}/licenses", payload: { usage_scope: "DIGITAL", valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-09-30T00:00:00Z", expected_image_version: "${img_v}" }, as: RightsManager, captures: { lic_id: $.data.id } }
            - { call: "POST /licenses/${lic_id}/activate", payload: {}, as: RightsManager }
            - { call: "POST /images/${img_id}/usage-runs", payload: { license_id: "${lic_id}", channel: "DIGITAL", story_slug: "election-night", published_at: "2026-08-15T00:00:00Z" }, as: PhotoEditor }
            - { call: "POST /images/${img_id}/usage-runs", payload: { license_id: "${lic_id}", channel: "DIGITAL", story_slug: "election-night", published_at: "2026-08-16T00:00:00Z" }, as: PhotoEditor }
            - { call: "POST /images/${img_id}/usage-runs", payload: { license_id: "${lic_id}", channel: "DIGITAL", story_slug: "election-night", published_at: "2026-08-17T00:00:00Z" }, as: PhotoEditor }
            - { call: "POST /images/${img_id}/usage-runs", payload: { license_id: "${lic_id}", channel: "DIGITAL", story_slug: "election-night", published_at: "2026-08-18T00:00:00Z" }, as: PhotoEditor }
            - { call: "POST /images/${img_id}/usage-runs", payload: { license_id: "${lic_id}", channel: "DIGITAL", story_slug: "election-night", published_at: "2026-08-19T00:00:00Z" }, as: PhotoEditor }
            - { call: "POST /images/${img_id}/usage-runs", payload: { license_id: "${lic_id}", channel: "DIGITAL", story_slug: "election-night", published_at: "2026-08-20T00:00:00Z" }, as: PhotoEditor }
            - { call: "POST /images/${img_id}/usage-runs", payload: { license_id: "${lic_id}", channel: "DIGITAL", story_slug: "election-night", published_at: "2026-08-21T00:00:00Z" }, as: PhotoEditor }
            - { call: "POST /images/${img_id}/usage-runs", payload: { license_id: "${lic_id}", channel: "DIGITAL", story_slug: "election-night", published_at: "2026-08-22T00:00:00Z" }, as: PhotoEditor }
            - { call: "POST /images/${img_id}/usage-runs", payload: { license_id: "${lic_id}", channel: "DIGITAL", story_slug: "election-night", published_at: "2026-08-23T00:00:00Z" }, as: PhotoEditor }
            - { call: "GET /photographers/${p_id}", as: FinanceAdmin, captures: { p_v1: $.data.version } }
          trigger:
            - { call: "POST /photographers/${p_id}/payment-runs", payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", expected_photographer_version: "${p_v1}" }, as: FinanceAdmin, captures: { run1_id: $.data.id, run1_r: $.data.royalty_amount_cents } }
            - { call: "POST /images/${img_id}/usage-runs", payload: { license_id: "${lic_id}", channel: "DIGITAL", story_slug: "election-night", published_at: "2026-08-24T00:00:00Z" }, as: PhotoEditor, captures: { u10_r: $.data.royalty_cents } }
            - { call: "GET /photographers/${p_id}", as: FinanceAdmin, captures: { p_v2: $.data.version } }
            - { call: "POST /photographers/${p_id}/payment-runs", payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", expected_photographer_version: "${p_v2}" }, as: FinanceAdmin, captures: { run2_r: $.data.royalty_amount_cents } }
            - { call: "GET /payment-runs/${run1_id}", as: FinanceAdmin, captures: { run1_st: $.data.status } }
          assert:
            - "captured run1_r == 3429 (9 x 381 at tier 1.0)"
            - "captured u10_r == 572 (10th use at tier 1.5: round_half_up(305 x 1.25 x 1.5))"
            - "captured run2_r == 4001 (3429 + 572)"
            - "captured run1_st == VOIDED (superseded DRAFT auto-voided by the second run)"

  # =====================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: usage_run_blocked_by_open_claim
        grounds:
          - validations[priority=18]
          - state_machines.Image.restriction_status.NONE_to_RESTRICTED
          - state_machines.InfringementClaim.UNDER_REVIEW_to_DISMISSED
          - errors[ERR_IMAGE_UNDER_CLAIM]
        distinguishing_aspect: |
          Pair UsageRun -> InfringementClaim: a usage run's validity depends on the claim
          state of another entity — RESTRICTED while the claim is open (rejected with
          ERR_IMAGE_UNDER_CLAIM), allowed again after the claim resolves DISMISSED.
        test_recipe:
          setup:
            - "CLEARED WIRE image with ACTIVE DIGITAL license and an UNDER_REVIEW claim (intaken by rm_alice), so restriction_status == RESTRICTED"
          setup_api_calls:
            - { call: "POST /images", payload: { source_type: "WIRE", agency_name: "WireCo", base_license_fee_cents: 10000, caption: "Flooded main street looking north", credit_line: "WireCo Staff / WireCo" }, as: RightsManager, captures: { w_id: $.data.id } }
            - { call: "POST /images/${w_id}/clear", payload: {}, as: RightsManager }
            - { call: "GET /images/${w_id}", as: RightsManager, captures: { w_v: $.data.version } }
            - { call: "POST /images/${w_id}/licenses", payload: { usage_scope: "DIGITAL", valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-08-31T23:59:59Z", expected_image_version: "${w_v}" }, as: RightsManager, captures: { lic_id: $.data.id } }
            - { call: "POST /licenses/${lic_id}/activate", payload: {}, as: RightsManager }
            - { call: "POST /infringement-claims", payload: { image_id: "${w_id}", claimant_name: "Pix Agency", claim_type: "UNLICENSED_USE", description: "Alleged unlicensed syndication", claimed_amount_cents: 50000 }, as: RightsManager, as_user_id: "rm_alice", captures: { c_id: $.data.id } }
            - { call: "POST /infringement-claims/${c_id}/review", payload: {}, as: RightsManager, as_user_id: "rm_alice" }
          trigger:
            - { call: "POST /images/${w_id}/usage-runs", payload: { license_id: "${lic_id}", channel: "DIGITAL", story_slug: "flood-follow", published_at: "2026-08-10T12:00:00Z" }, as: RightsManager, captures: { err: $.data.error_id } }
            - { call: "POST /infringement-claims/${c_id}/resolve", payload: { outcome: "DISMISSED" }, as: RightsManager, as_user_id: "rm_bob" }
            - { call: "POST /images/${w_id}/usage-runs", payload: { license_id: "${lic_id}", channel: "DIGITAL", story_slug: "flood-follow", published_at: "2026-08-10T12:00:00Z" }, as: RightsManager, captures: { run_id: $.data.id } }
          assert:
            - "captured err == ERR_IMAGE_UNDER_CLAIM while the claim was open"
            - "after DISMISSED the same usage run succeeds (run_id captured)"

      - name: license_activation_blocked_without_release
        grounds:
          - validations[priority=8]
          - state_machines.License.DRAFT_to_ACTIVE
          - entities.ReleaseRecord.fields.subject_type
          - errors[ERR_RELEASE_REQUIRED]
        distinguishing_aspect: |
          Pair License -> ReleaseRecord: license activation is gated by the state of a
          different entity — an image with identifiable people has no usable MODEL
          release, so activation fails until a MODEL ReleaseRecord exists.
        test_recipe:
          setup:
            - "CLEARED WIRE image with has_identifiable_people=true, no releases; DRAFT DIGITAL license"
          setup_api_calls:
            - { call: "POST /images", payload: { source_type: "WIRE", agency_name: "WireCo", base_license_fee_cents: 10000, caption: "Actor on the gala red carpet", credit_line: "WireCo Staff / WireCo", has_identifiable_people: true }, as: RightsManager, captures: { w_id: $.data.id } }
            - { call: "POST /images/${w_id}/clear", payload: {}, as: RightsManager }
            - { call: "GET /images/${w_id}", as: RightsManager, captures: { w_v: $.data.version } }
            - { call: "POST /images/${w_id}/licenses", payload: { usage_scope: "DIGITAL", valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-08-31T23:59:59Z", expected_image_version: "${w_v}" }, as: RightsManager, captures: { lic_id: $.data.id } }
          trigger:
            - { call: "POST /licenses/${lic_id}/activate", payload: {}, as: RightsManager, captures: { err: $.data.error_id } }
            - { call: "POST /images/${w_id}/releases", payload: { subject_type: "MODEL", subject_name: "Actor A", document_ref: "doc-123", signed_at: "2026-07-15T00:00:00Z" }, as: RightsManager }
            - { call: "POST /licenses/${lic_id}/activate", payload: {}, as: RightsManager, captures: { lic_st: $.data.status } }
          assert:
            - "captured err == ERR_RELEASE_REQUIRED before any release exists"
            - "captured lic_st == ACTIVE after the MODEL release is registered"

  # =====================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: exclusive_license_half_open_adjacency
        grounds:
          - validations[priority=10]
          - entities.License.fields.exclusive
          - errors[ERR_EXCLUSIVE_LICENSE_CONFLICT]
        distinguishing_aspect: |
          Image resource under HALF-OPEN [valid_from, valid_to) exclusivity semantics:
          an exclusive license starting exactly at another's valid_to is adjacent and
          allowed, while one day earlier overlaps and is rejected.
        test_recipe:
          setup:
            - "CLEARED WIRE image with an ACTIVE exclusive DIGITAL license [2026-08-01, 2026-08-10)"
          setup_api_calls:
            - { call: "POST /images", payload: { source_type: "WIRE", agency_name: "WireCo", base_license_fee_cents: 10000, caption: "Flooded main street looking north", credit_line: "WireCo Staff / WireCo" }, as: RightsManager, captures: { w_id: $.data.id } }
            - { call: "POST /images/${w_id}/clear", payload: {}, as: RightsManager }
            - { call: "GET /images/${w_id}", as: RightsManager, captures: { w_v1: $.data.version } }
            - { call: "POST /images/${w_id}/licenses", payload: { usage_scope: "DIGITAL", valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-08-10T00:00:00Z", exclusive: true, expected_image_version: "${w_v1}" }, as: RightsManager, captures: { l1_id: $.data.id } }
            - { call: "POST /licenses/${l1_id}/activate", payload: {}, as: RightsManager }
            - { call: "GET /images/${w_id}", as: RightsManager, captures: { w_v2: $.data.version } }
            - { call: "POST /images/${w_id}/licenses", payload: { usage_scope: "SOCIAL", valid_from: "2026-08-10T00:00:00Z", valid_to: "2026-08-20T00:00:00Z", exclusive: true, expected_image_version: "${w_v2}" }, as: RightsManager, captures: { l2_id: $.data.id } }
            - { call: "GET /images/${w_id}", as: RightsManager, captures: { w_v3: $.data.version } }
            - { call: "POST /images/${w_id}/licenses", payload: { usage_scope: "PRINT", valid_from: "2026-08-09T00:00:00Z", valid_to: "2026-08-15T00:00:00Z", exclusive: true, expected_image_version: "${w_v3}" }, as: RightsManager, captures: { l3_id: $.data.id } }
          trigger:
            - { call: "POST /licenses/${l2_id}/activate", payload: {}, as: RightsManager, captures: { l2_st: $.data.status } }
            - { call: "POST /licenses/${l3_id}/activate", payload: {}, as: RightsManager, captures: { err: $.data.error_id } }
          assert:
            - "captured l2_st == ACTIVE (adjacent at L1.valid_to: allowed under half-open semantics)"
            - "captured err == ERR_EXCLUSIVE_LICENSE_CONFLICT (2026-08-09 start overlaps [08-01, 08-10))"

      - name: photographer_double_booking_buffer_closed
        grounds:
          - validations[priority=11]
          - errors[ERR_PHOTOGRAPHER_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Photographer resource under CLOSED-interval plus 1-day travel-buffer semantics:
          a shoot [2026-08-10, 2026-08-12] blocks [2026-08-09, 2026-08-13] inclusive, so a
          new commission starting on the buffer day 2026-08-13 conflicts, while 2026-08-14
          is free — adjacency is REJECTED here, opposite of the license rule.
        test_recipe:
          setup:
            - "ACTIVE photographer with an existing COMMISSIONED assignment shooting 2026-08-10..2026-08-12; two more OPEN story requests"
          setup_api_calls:
            - { call: "POST /photographers", payload: { full_name: "Sam Staff", email: "sam@acme.news", photographer_type: "STAFF", day_rate_cents: 25000, per_image_fee_cents: 40000, royalty_rate_per_use_cents: 305 }, as: PhotoEditor, captures: { p_id: $.data.id } }
            - { call: "POST /story-requests", payload: { headline: "Bridge fire", slug: "bridge-fire", needed_by: "2026-09-01T00:00:00Z", budget_cents: 30000 }, as: PhotoEditor, captures: { s1_id: $.data.id } }
            - { call: "POST /story-requests/${s1_id}/decide", payload: { decision: "COMMISSION", photographer_id: "${p_id}", brief: "Fire scene", shoot_start: "2026-08-10T09:00:00Z", shoot_end: "2026-08-12T17:00:00Z" }, as: PhotoEditor }
            - { call: "POST /story-requests", payload: { headline: "Court verdict", slug: "court-verdict", needed_by: "2026-09-01T00:00:00Z", budget_cents: 30000 }, as: PhotoEditor, captures: { s2_id: $.data.id } }
            - { call: "POST /story-requests", payload: { headline: "Harbor festival", slug: "harbor-festival", needed_by: "2026-09-01T00:00:00Z", budget_cents: 30000 }, as: PhotoEditor, captures: { s3_id: $.data.id } }
          trigger:
            - { call: "POST /story-requests/${s2_id}/decide", payload: { decision: "COMMISSION", photographer_id: "${p_id}", brief: "Verdict reaction", shoot_start: "2026-08-13T09:00:00Z", shoot_end: "2026-08-13T17:00:00Z" }, as: PhotoEditor, captures: { err: $.data.error_id } }
            - { call: "POST /story-requests/${s3_id}/decide", payload: { decision: "COMMISSION", photographer_id: "${p_id}", brief: "Festival crowd", shoot_start: "2026-08-14T09:00:00Z", shoot_end: "2026-08-14T17:00:00Z" }, as: PhotoEditor, captures: { s3_st: $.data.status } }
          assert:
            - "captured err == ERR_PHOTOGRAPHER_DOUBLE_BOOKED (buffer day 2026-08-13 is blocked, closed interval)"
            - "captured s3_st == DECIDED (2026-08-14 clears the buffered window)"

  # =====================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: story_budget_activate_revoke_conservation
        grounds:
          - state_machines.License.DRAFT_to_ACTIVE
          - state_machines.License.ACTIVE_to_REVOKED
          - entities.StoryRequest.fields.committed_cents
        distinguishing_aspect: |
          Conserved quantity: story budget allocation — committed_cents ==
          sum(fee_cents over ACTIVE linked licenses) at all times; the activate(12000)
          then revoke pair leaves committed_cents back at its pre-pair value 0.
        test_recipe:
          setup:
            - "Story (budget 30000); CLEARED WIRE image with a DRAFT story-linked DIGITAL license (fee 12000)"
          setup_api_calls:
            - { call: "POST /story-requests", payload: { headline: "Flood aftermath", slug: "flood-aftermath", needed_by: "2026-09-01T00:00:00Z", budget_cents: 30000 }, as: PhotoEditor, captures: { s_id: $.data.id } }
            - { call: "POST /images", payload: { source_type: "WIRE", agency_name: "WireCo", base_license_fee_cents: 10000, caption: "Flooded main street looking north", credit_line: "WireCo Staff / WireCo" }, as: RightsManager, captures: { w_id: $.data.id } }
            - { call: "POST /images/${w_id}/clear", payload: {}, as: RightsManager }
            - { call: "GET /images/${w_id}", as: RightsManager, captures: { w_v: $.data.version } }
            - { call: "POST /images/${w_id}/licenses", payload: { usage_scope: "DIGITAL", valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-08-31T23:59:59Z", story_request_id: "${s_id}", expected_image_version: "${w_v}" }, as: RightsManager, captures: { lic_id: $.data.id } }
            - { call: "GET /story-requests/${s_id}", as: PhotoEditor, captures: { comm0: $.data.committed_cents } }
          trigger:
            - { call: "POST /licenses/${lic_id}/activate", payload: {}, as: RightsManager }
            - { call: "GET /story-requests/${s_id}", as: PhotoEditor, captures: { comm1: $.data.committed_cents } }
            - { call: "POST /licenses/${lic_id}/revoke", payload: {}, as: RightsManager }
            - { call: "GET /story-requests/${s_id}", as: PhotoEditor, captures: { comm2: $.data.committed_cents } }
          assert:
            - "captured comm0 == 0"
            - "captured comm1 == 12000 (forward action commits the fee)"
            - "captured comm2 == 0 (compensating action restores the conserved allocation)"

      - name: photographer_paid_out_pay_void_conservation
        grounds:
          - state_machines.PaymentRun.APPROVED_to_PAID
          - state_machines.PaymentRun.PAID_to_VOIDED
          - entities.Photographer.fields.paid_out_cents
        distinguishing_aspect: |
          Conserved quantity: lifetime disbursed cash — paid_out_cents ==
          sum(total_cents over PAID runs); pay(90000) then void of the same run leaves
          paid_out_cents back at 0, a different conserved quantity than budget allocation.
        test_recipe:
          setup:
            - "STAFF photographer (day 25000, per-image 40000) with one ACCEPTED 2-day assignment (1 image) in period; DRAFT payment run (total 90000) created"
          setup_api_calls:
            - { call: "POST /photographers", payload: { full_name: "Sam Staff", email: "sam@acme.news", photographer_type: "STAFF", day_rate_cents: 25000, per_image_fee_cents: 40000, royalty_rate_per_use_cents: 305 }, as: PhotoEditor, captures: { p_id: $.data.id } }
            - { call: "POST /story-requests", payload: { headline: "Bridge fire", slug: "bridge-fire", needed_by: "2026-09-01T00:00:00Z", budget_cents: 30000 }, as: PhotoEditor, captures: { s_id: $.data.id } }
            - { call: "POST /story-requests/${s_id}/decide", payload: { decision: "COMMISSION", photographer_id: "${p_id}", brief: "Fire scene", shoot_start: "2026-08-10T09:00:00Z", shoot_end: "2026-08-11T17:00:00Z" }, as: PhotoEditor, captures: { a_id: $.data.commissioned_assignment_id } }
            - { call: "POST /assignments/${a_id}/images", payload: { caption: "Firefighters at dawn on the bridge", credit_line: "Sam Staff / ACME News" }, as: Photographer, as_user_id: "${p_id}" }
            - { call: "POST /assignments/${a_id}/submit", payload: {}, as: Photographer, as_user_id: "${p_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /assignments/${a_id}/accept", payload: {}, as: PhotoEditor }
            - { call: "GET /photographers/${p_id}", as: FinanceAdmin, captures: { p_v: $.data.version } }
            - { call: "POST /photographers/${p_id}/payment-runs", payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", expected_photographer_version: "${p_v}" }, as: FinanceAdmin, captures: { run_id: $.data.id, run_t: $.data.total_cents } }
          trigger:
            - { call: "POST /payment-runs/${run_id}/approve", payload: {}, as: FinanceAdmin }
            - { call: "POST /payment-runs/${run_id}/pay", payload: {}, as: FinanceAdmin }
            - { call: "GET /photographers/${p_id}", as: FinanceAdmin, captures: { paid1: $.data.paid_out_cents } }
            - { call: "POST /payment-runs/${run_id}/void", payload: {}, as: FinanceAdmin, captures: { run_st: $.data.status } }
            - { call: "GET /photographers/${p_id}", as: FinanceAdmin, captures: { paid2: $.data.paid_out_cents } }
          assert:
            - "captured run_t == 90000"
            - "captured paid1 == 90000 (pay credits the conserved disbursement ledger)"
            - "captured run_st == VOIDED"
            - "captured paid2 == 0 (void compensates exactly)"
