scaffold_difficulty_design:
  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: ticket_price_experience_diff_vs_haptic_surcharge
        grounds:
          - calculations.calc_ticket_price
          - entities.Booking.fields.unit_price_cents
          - entities.Booking.fields.quoted_variant
        distinguishing_aspect: |
          Same zone geometry quoted under two different variants of
          calc_ticket_price produce different Booking.unit_price_cents: a
          haptic-capable production's RING seat uses HAPTIC_SURCHARGE
          (round(B0_RING x 1.08, 2) = 299444.21) while a non-haptic production's
          RING seat uses EXPERIENCE_DIFF (round(B0_RING x 1.06, 2) = 293898.95),
          with base 12000c and gain 12000c in both cases (B0_RING = 277263.1579).
        test_recipe:
          setup:
            - "Production PH (haptic, base 12000c) ACTIVE; its asset pipeline run to APPROVED; show SH in REHEARSAL."
            - "Booking BK-H taken on SH while PH is ACTIVE (gain = 12000c)."
            - "PH then deactivated (SH -> CANCELLED cascade); production PN (non-haptic, base 12000c) activated (gain = 12000c); its asset approved; show SN in REHEARSAL."
          setup_api_calls:
            - call: "POST /venue/productions"
              payload: { title: "P-Haptic", production_type: "ORIGINAL", base_price_cents: 12000, is_haptic_capable: true }
              as: ProductionDirector
              captures: { ph_id: $.data.id }
            - call: "POST /venue/productions"
              payload: { title: "P-Plain", production_type: "ORIGINAL", base_price_cents: 12000, is_haptic_capable: false }
              as: ProductionDirector
              captures: { pn_id: $.data.id }
            - call: "POST /venue/productions/${ph_id}/activate"
              payload: {}
              as: ProductionDirector
            - call: "POST /venue/assets"
              payload: { production_id: "${ph_id}", title: "AH", capture_format: "WRAP_16K", storage_gb: 500, render_hours_base: 10 }
              as: ContentProducer
              captures: { ah_id: $.data.id }
            - call: "POST /venue/render-batches"
              payload: { dispatch_mode: "STANDARD", asset_ids: ["${ah_id}"] }
              as: ContentProducer
              captures: { bh_id: $.data.id }
            - call: "POST /venue/render-batches/${bh_id}/dispatch"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T03:00:00Z" }
              as: ProductionDirector
            - call: "POST /venue/render-batches/${bh_id}/settle"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/assets/${ah_id}/qc/approve"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/shows"
              payload: { production_id: "${ph_id}", show_format: "FILM", start_time: "2026-09-02T19:00:00Z", length_minutes: 120 }
              as: VenueScheduler
              captures: { sh_id: $.data.id }
            - call: "POST /venue/shows/${sh_id}/schedule-rehearsal"
              payload: {}
              as: VenueScheduler
            - call: "POST /venue/assets"
              payload: { production_id: "${pn_id}", title: "AN", capture_format: "WRAP_8K", storage_gb: 400, render_hours_base: 8 }
              as: ContentProducer
              captures: { an_id: $.data.id }
          trigger:
            - call: "POST /venue/shows/${sh_id}/bookings"
              payload: { zone: "RING", seats: 2 }
              as: Guest
              captures: { bk_h_id: $.data.id, bk_h_unit: $.data.unit_price_cents, bk_h_var: $.data.quoted_variant }
            - call: "POST /venue/productions/${ph_id}/deactivate"
              payload: {}
              as: ProductionDirector
            - call: "POST /venue/productions/${pn_id}/activate"
              payload: {}
              as: ProductionDirector
            - call: "POST /venue/render-batches"
              payload: { dispatch_mode: "STANDARD", asset_ids: ["${an_id}"] }
              as: ContentProducer
              captures: { bn_id: $.data.id }
            - call: "POST /venue/render-batches/${bn_id}/dispatch"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T06:00:00Z" }
              as: ProductionDirector
            - call: "POST /venue/render-batches/${bn_id}/settle"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/assets/${an_id}/qc/approve"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/shows"
              payload: { production_id: "${pn_id}", show_format: "FILM", start_time: "2026-09-04T19:00:00Z", length_minutes: 120 }
              as: VenueScheduler
              captures: { sn_id: $.data.id }
            - call: "POST /venue/shows/${sn_id}/schedule-rehearsal"
              payload: {}
              as: VenueScheduler
            - call: "POST /venue/shows/${sn_id}/bookings"
              payload: { zone: "RING", seats: 2 }
              as: Guest
              captures: { bk_n_id: $.data.id, bk_n_unit: $.data.unit_price_cents, bk_n_var: $.data.quoted_variant }
          assert:
            - "Booking.${bk_h_id}.quoted_variant == HAPTIC_SURCHARGE"
            - "Booking.${bk_h_id}.unit_price_cents == 299444.21"
            - "Booking.${bk_n_id}.quoted_variant == EXPERIENCE_DIFF"
            - "Booking.${bk_n_id}.unit_price_cents == 293898.95"
            - "Booking.${bk_h_id}.unit_price_cents != Booking.${bk_n_id}.unit_price_cents"

      - name: settlement_payout_gross_vs_net_variant
        grounds:
          - calculations.calc_settlement
          - entities.Settlement.fields.gross_cents
          - entities.Settlement.fields.net_cents
        distinguishing_aspect: |
          calc_settlement exposes two different readings of the same show's money:
          gross (sum of line_total_cents over CONFIRMED bookings only) vs net
          (gross minus refunds of CANCELLED bookings). With one CONFIRMED 2-seat
          MAIN booking (line 427124.21) and one CANCELLED-from-CONFIRMED 1-seat
          MAIN booking (refund 213562.11), gross_cents == 427124.21 while
          net_cents == 213562.1 — different outputs for the same underlying data,
          on the Settlement entity domain (distinct from the Booking pricing
          domain of the sibling instance).
        test_recipe:
          setup:
            - "Production P base 12000c non-haptic ACTIVE; APPROVED asset; show S CONFIRMED for 2026-09-01T10:00 + 90 min."
            - "Booking A: MAIN 2 seats CONFIRMED (line_total 427124.21)."
            - "Booking B: MAIN 1 seat, confirmed then cancelled (refund 213562.11)."
            - "Clock advanced to 12:00 (past show end 11:30); show completed."
          setup_api_calls:
            - call: "POST /venue/productions"
              payload: { title: "SP", production_type: "RESIDENCY", base_price_cents: 12000, is_haptic_capable: false }
              as: ProductionDirector
              captures: { sp_id: $.data.id }
            - call: "POST /venue/productions/${sp_id}/activate"
              payload: {}
              as: ProductionDirector
            - call: "POST /venue/assets"
              payload: { production_id: "${sp_id}", title: "SA", capture_format: "WRAP_8K", storage_gb: 400, render_hours_base: 5 }
              as: ContentProducer
              captures: { sa_id: $.data.id }
            - call: "POST /venue/render-batches"
              payload: { dispatch_mode: "STANDARD", asset_ids: ["${sa_id}"] }
              as: ContentProducer
              captures: { sb_id: $.data.id }
            - call: "POST /venue/render-batches/${sb_id}/dispatch"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T03:00:00Z" }
              as: ProductionDirector
            - call: "POST /venue/render-batches/${sb_id}/settle"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/assets/${sa_id}/qc/approve"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/shows"
              payload: { production_id: "${sp_id}", show_format: "CONCERT", start_time: "2026-09-01T10:00:00Z", length_minutes: 90 }
              as: VenueScheduler
              captures: { ss_id: $.data.id }
            - call: "POST /venue/shows/${ss_id}/schedule-rehearsal"
              payload: {}
              as: VenueScheduler
            - call: "GET /venue/productions/${sp_id}"
              payload: {}
              as: ProductionDirector
              captures: { sp_v: $.data.version }
            - call: "POST /venue/shows/${ss_id}/confirm"
              payload: { expected_production_version: "${sp_v}" }
              as: VenueScheduler
            - call: "POST /venue/shows/${ss_id}/bookings"
              payload: { zone: "MAIN", seats: 2 }
              as: Guest
              captures: { bkA_id: $.data.id }
            - call: "POST /venue/bookings/${bkA_id}/confirm"
              payload: {}
              as: Guest
            - call: "POST /venue/shows/${ss_id}/bookings"
              payload: { zone: "MAIN", seats: 1 }
              as: Guest
              captures: { bkB_id: $.data.id }
            - call: "POST /venue/bookings/${bkB_id}/confirm"
              payload: {}
              as: Guest
            - call: "POST /venue/bookings/${bkB_id}/cancel"
              payload: {}
              as: Guest
            - call: "POST /venue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: ProductionDirector
            - call: "POST /venue/shows/${ss_id}/complete"
              payload: {}
              as: VenueScheduler
          trigger:
            - call: "GET /venue/shows/${ss_id}/settlement"
              payload: {}
              as: VenueScheduler
              captures: { st_gross: "$.data[0].gross_cents", st_net: "$.data[0].net_cents", st_refunds: "$.data[0].refunds_cents" }
          assert:
            - "Settlement.gross_cents == 427124.21"
            - "Settlement.refunds_cents == 213562.11"
            - "Settlement.net_cents == 213562.1"
            - "Settlement.gross_cents != Settlement.net_cents (the two readings diverge on identical underlying bookings)"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: changeover_combinatorial_format_rush_inputs
        grounds:
          - calculations.calc_changeover_time
          - state_machines.Show.TENTATIVE_to_REHEARSAL
        distinguishing_aspect: |
          Mode (a): calc_changeover_time has >= 3 inputs (base 60, format-transition
          count vs adjacent shows, peak_rush indicator) with non-linear conditional
          interaction. Show A (FILM, peak_rush 35 -> indicator 1, no adjacent show)
          yields changeover 60 + 0 + 20 = 80; Show B (CONCERT, peak_rush 0,
          temporally adjacent to A of a different format) yields 60 + 30 + 0 = 90.
        test_recipe:
          setup:
            - "Production P ACTIVE with APPROVED asset."
            - "Show A: FILM, 2026-09-03T19:00, 120 min, peak_rush_minutes 35 (>= 30 threshold)."
            - "Show B: CONCERT, 2026-09-04T19:00, 120 min, peak_rush_minutes 0 — temporally adjacent to A and of a different format; both rehearsal-scheduled."
          setup_api_calls:
            - call: "POST /venue/productions"
              payload: { title: "CP", production_type: "ORIGINAL", base_price_cents: 10000, is_haptic_capable: false }
              as: ProductionDirector
              captures: { cp_id: $.data.id }
            - call: "POST /venue/productions/${cp_id}/activate"
              payload: {}
              as: ProductionDirector
            - call: "POST /venue/assets"
              payload: { production_id: "${cp_id}", title: "CA", capture_format: "WRAP_8K", storage_gb: 300, render_hours_base: 4 }
              as: ContentProducer
              captures: { ca_id: $.data.id }
            - call: "POST /venue/render-batches"
              payload: { dispatch_mode: "STANDARD", asset_ids: ["${ca_id}"] }
              as: ContentProducer
              captures: { cb_id: $.data.id }
            - call: "POST /venue/render-batches/${cb_id}/dispatch"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T03:00:00Z" }
              as: ProductionDirector
            - call: "POST /venue/render-batches/${cb_id}/settle"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/assets/${ca_id}/qc/approve"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/shows"
              payload: { production_id: "${cp_id}", show_format: "FILM", start_time: "2026-09-03T19:00:00Z", length_minutes: 120, peak_rush_minutes: 35 }
              as: VenueScheduler
              captures: { cshow_a: $.data.id }
            - call: "POST /venue/shows"
              payload: { production_id: "${cp_id}", show_format: "CONCERT", start_time: "2026-09-04T19:00:00Z", length_minutes: 120, peak_rush_minutes: 0 }
              as: VenueScheduler
              captures: { cshow_b: $.data.id }
          trigger:
            - call: "POST /venue/shows/${cshow_a}/schedule-rehearsal"
              payload: {}
              as: VenueScheduler
              captures: { ca_reh: $.data.rehearsal_minutes, ca_chg: $.data.changeover_minutes }
            - call: "POST /venue/shows/${cshow_b}/schedule-rehearsal"
              payload: {}
              as: VenueScheduler
              captures: { cb_reh: $.data.rehearsal_minutes, cb_chg: $.data.changeover_minutes }
          assert:
            - "Show.${cshow_a}.rehearsal_minutes == 120"
            - "Show.${cshow_a}.changeover_minutes == 80"
            - "Show.${cshow_b}.changeover_minutes == 90"
            - "Show.${cshow_a}.changeover_minutes != Show.${cshow_b}.changeover_minutes"

      - name: ticket_price_nested_rounding_order_pinned
        grounds:
          - calculations.calc_ticket_price
          - entities.Booking.fields.line_total_cents
        distinguishing_aspect: |
          Mode (b): calc_ticket_price pins nested rounding order — B0_z rounded to
          4dp FIRST, then the line total rounded to 2dp. With base 1043c, gain
          1043c, RING, 3 seats: B0_RING = 3046.9324 and the pinned line total is
          round(3 x 3046.9324 x 1.06, 2) = 9689.25; an implementation that skips
          the 4dp pin and rounds only at the end computes
          round(3 x 1043 x m_RING x 1.06, 2) = 9689.24 — a 0.01 divergence.
        test_recipe:
          setup:
            - "Production P base 1043c non-haptic ACTIVE (gain == 1043), APPROVED asset, show S in REHEARSAL."
          setup_api_calls:
            - call: "POST /venue/productions"
              payload: { title: "RP", production_type: "ORIGINAL", base_price_cents: 1043, is_haptic_capable: false }
              as: ProductionDirector
              captures: { rp_id: $.data.id }
            - call: "POST /venue/productions/${rp_id}/activate"
              payload: {}
              as: ProductionDirector
            - call: "POST /venue/assets"
              payload: { production_id: "${rp_id}", title: "RA", capture_format: "WRAP_8K", storage_gb: 200, render_hours_base: 3 }
              as: ContentProducer
              captures: { ra_id: $.data.id }
            - call: "POST /venue/render-batches"
              payload: { dispatch_mode: "STANDARD", asset_ids: ["${ra_id}"] }
              as: ContentProducer
              captures: { rb_id: $.data.id }
            - call: "POST /venue/render-batches/${rb_id}/dispatch"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T03:00:00Z" }
              as: ProductionDirector
            - call: "POST /venue/render-batches/${rb_id}/settle"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/assets/${ra_id}/qc/approve"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/shows"
              payload: { production_id: "${rp_id}", show_format: "FILM", start_time: "2026-09-02T19:00:00Z", length_minutes: 90 }
              as: VenueScheduler
              captures: { rshow_id: $.data.id }
            - call: "POST /venue/shows/${rshow_id}/schedule-rehearsal"
              payload: {}
              as: VenueScheduler
          trigger:
            - call: "POST /venue/shows/${rshow_id}/bookings"
              payload: { zone: "RING", seats: 3 }
              as: Guest
              captures: { rbk_id: $.data.id, rbk_unit: $.data.unit_price_cents, rbk_line: $.data.line_total_cents }
          assert:
            - "Booking.${rbk_id}.line_total_cents == 9689.25 (per-line-4dp-then-final order; sum-then-round would give 9689.24)"
            - "Booking.${rbk_id}.unit_price_cents == 3229.75"
            - "Booking.${rbk_id}.quoted_variant == EXPERIENCE_DIFF"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: asset_qc_retry_cycle
        grounds:
          - state_machines.Asset.QC_to_QC_FAILED
          - state_machines.Asset.QC_FAILED_to_CAPTURED
          - state_machines.Asset.QC_to_APPROVED
        distinguishing_aspect: |
          Asset machine is cyclic: CAPTURED -> RENDERING -> QC -> QC_FAILED ->
          CAPTURED (retry) -> RENDERING -> QC -> APPROVED. The loop is exercised by
          failing QC once, retrying, re-rendering in a fresh batch, then approving;
          batch counters reflect each pass.
        test_recipe:
          setup:
            - "Production P ACTIVE; Asset A (render_hours_base 2) captured."
            - "Batch B1 dispatched and settled; A in QC."
          setup_api_calls:
            - call: "POST /venue/productions"
              payload: { title: "AP", production_type: "ORIGINAL", base_price_cents: 10000, is_haptic_capable: false }
              as: ProductionDirector
              captures: { ap_id: $.data.id }
            - call: "POST /venue/productions/${ap_id}/activate"
              payload: {}
              as: ProductionDirector
            - call: "POST /venue/assets"
              payload: { production_id: "${ap_id}", title: "AA", capture_format: "WRAP_8K", storage_gb: 100, render_hours_base: 2 }
              as: ContentProducer
              captures: { aa_id: $.data.id }
            - call: "POST /venue/render-batches"
              payload: { dispatch_mode: "STANDARD", asset_ids: ["${aa_id}"] }
              as: ContentProducer
              captures: { ab1_id: $.data.id }
            - call: "POST /venue/render-batches/${ab1_id}/dispatch"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T03:00:00Z" }
              as: ProductionDirector
            - call: "POST /venue/render-batches/${ab1_id}/settle"
              payload: {}
              as: ContentProducer
          trigger:
            - call: "POST /venue/assets/${aa_id}/qc/fail"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/assets/${aa_id}/retry"
              payload: {}
              as: ContentProducer
              captures: { aa_status_retry: $.data.status }
            - call: "POST /venue/render-batches"
              payload: { dispatch_mode: "STANDARD", asset_ids: ["${aa_id}"] }
              as: ContentProducer
              captures: { ab2_id: $.data.id }
            - call: "POST /venue/render-batches/${ab2_id}/dispatch"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T06:00:00Z" }
              as: ProductionDirector
            - call: "POST /venue/render-batches/${ab2_id}/settle"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/assets/${aa_id}/qc/approve"
              payload: {}
              as: ContentProducer
              captures: { aa_status_final: $.data.status, aa_cost: $.data.render_cost_cents }
          assert:
            - "Asset.${aa_id}.status after retry == CAPTURED (cycle re-entry)"
            - "Asset.${aa_id}.status after second QC pass == APPROVED"
            - "Asset.${aa_id}.render_cost_cents == 12000 (round(2 x 360000 / 60, 2))"
            - "RenderBatch.${ab1_id}.failed_asset_count == 1"
            - "RenderBatch.${ab1_id}.submitted_asset_count == 0"

      - name: campaign_pause_resume_cycle
        grounds:
          - state_machines.Campaign.ACTIVE_to_PAUSED
          - state_machines.Campaign.PAUSED_to_ACTIVE
        distinguishing_aspect: |
          Campaign machine cycles ACTIVE -> PAUSED -> ACTIVE (a different entity
          from Asset's QC loop), with Sponsor.active_campaign_count incremented and
          decremented on each pass; the second activation requires the OCC
          expected_sponsor_version to match the version the pause bumped.
        test_recipe:
          setup:
            - "Sponsor S exists; Campaign C flight window covers the logical clock; C ACTIVE."
          setup_api_calls:
            - call: "POST /venue/sponsors"
              payload: { name: "ACME", brand_tier: "STANDARD" }
              as: SponsorshipManager
              captures: { sp_id: $.data.id, sp_v0: $.data.version }
            - call: "POST /venue/campaigns"
              payload: { sponsor_id: "${sp_id}", start_time: "2026-08-31T00:00:00Z", end_time: "2026-09-30T00:00:00Z", exterior_slots: 2, spot_seconds: 60, contracted_impressions: 10000 }
              as: SponsorshipManager
              captures: { cc_id: $.data.id }
            - call: "POST /venue/campaigns/${cc_id}/activate"
              payload: { expected_sponsor_version: "${sp_v0}" }
              as: SponsorshipManager
          trigger:
            - call: "POST /venue/campaigns/${cc_id}/pause"
              payload: {}
              as: SponsorshipManager
            - call: "GET /venue/sponsors/${sp_id}"
              payload: {}
              as: SponsorshipManager
              captures: { sp_v1: $.data.version, sp_count_mid: $.data.active_campaign_count }
            - call: "POST /venue/campaigns/${cc_id}/activate"
              payload: { expected_sponsor_version: "${sp_v1}" }
              as: SponsorshipManager
              captures: { cc_status: $.data.status }
          assert:
            - "Sponsor.${sp_id}.active_campaign_count after pause == 0"
            - "Campaign.${cc_id}.status after second activate == ACTIVE"
            - "Sponsor.${sp_id}.active_campaign_count after resume == 1"

  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: production_deactivate_cascades_show_then_booking
        grounds:
          - state_machines.Production.ACTIVE_to_DARK
          - state_machines.Show.REHEARSAL_to_CANCELLED
          - state_machines.Booking.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 transitive cascade: Production ACTIVE->DARK mutates Show
          (->CANCELLED); the Show's cancellation transition in turn mutates Booking
          (->CANCELLED with refund_cents = line_total_cents). The booking refund is
          caused by the show transition, not by the production action directly.
          Originating trigger: POST /productions/{id}/deactivate.
        test_recipe:
          setup:
            - "Production P (base 10000c) ACTIVE with APPROVED asset."
            - "Show S1 CONFIRMED then COMPLETED (kept terminal so deactivate is allowed)."
            - "Show S2 in REHEARSAL with booking BK2: MAIN 2 seats CONFIRMED, line_total 300147.37 (base 10000, gain 10000, B0_MAIN = 141666.6667)."
          setup_api_calls:
            - call: "POST /venue/productions"
              payload: { title: "DP", production_type: "CORPORATE", base_price_cents: 10000, is_haptic_capable: false }
              as: ProductionDirector
              captures: { dp_id: $.data.id }
            - call: "POST /venue/productions/${dp_id}/activate"
              payload: {}
              as: ProductionDirector
            - call: "POST /venue/assets"
              payload: { production_id: "${dp_id}", title: "DA", capture_format: "WRAP_8K", storage_gb: 100, render_hours_base: 2 }
              as: ContentProducer
              captures: { da_id: $.data.id }
            - call: "POST /venue/render-batches"
              payload: { dispatch_mode: "STANDARD", asset_ids: ["${da_id}"] }
              as: ContentProducer
              captures: { db_id: $.data.id }
            - call: "POST /venue/render-batches/${db_id}/dispatch"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T03:00:00Z" }
