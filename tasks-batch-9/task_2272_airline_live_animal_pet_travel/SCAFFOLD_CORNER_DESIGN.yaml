        distinguishing_aspect: "The screened animal needs 43 cm of interior height (35 + 8 clearance) but its container offers 30, so deficiency_codes is exactly [HEIGHT] with every other dimension satisfied, and mark-travel-ready is refused with 422 ERR_CONTAINER_NON_COMPLIANT."
