              payload: { student_id: "${stu_id}", course_id: "${c205_id}", source_type: "PORTFOLIO", credits_requested: 3, rush_requested: true }
              as: Student
              as_user_id: "${stu_id}"
              captures: { claim_c: "$.data.id" }
            - call: "POST /portfolios"
              payload: { claim_id: "${claim_c}", narrative: "Cloud operations evidence" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { pf_c: "$.data.id" }
            - call: "POST /portfolios/${pf_c}/artifacts"
              payload: { artifact_type: "WORK_PRODUCT", title: "C-1", evidence_uri: "s3://ev/c1", outcome_mappings: [{ learning_outcome_id: "${oc205}", alignment: "PRIMARY" }] }
              as: Student
              as_user_id: "${stu_id}"
            - call: "POST /portfolios/${pf_c}/submit"
              as: Student
              as_user_id: "${stu_id}"
          trigger:
            - call: "POST /pla-claims/${claim_c}/submit"
              as: Student
              as_user_id: "${stu_id}"
              captures: { c_tier: "$.data.priority_tier" }
            - call: "GET /fee-invoices?claim_id=${claim_c}"
              as: PlaCoordinator
              captures: { inv_c: "$.data[0].id", c_subtotal: "$.data[0].subtotal_cents", c_discount_bp: "$.data[0].discount_bp", c_discount: "$.data[0].discount_cents", c_total: "$.data[0].total_cents" }
          assert:
            - "Below the tier: the invoice of ${claim_b} has subtotal_cents == 22500 (15000 + 2500*3 + 0 + 0), discount_bp == 500, discount_cents == 1125, total_cents == 21375"
            - "Exactly at the tier: the invoice of ${claim_a} has subtotal_cents == 25000 (15000 + 2500*4), discount_bp == 1000 — the boundary is inclusive — discount_cents == 2500, total_cents == 22500"
            - "PlaClaim.${claim_c}.priority_tier == EXPEDITED"
            - "Half-cent rounding: the invoice of ${claim_c} has rush_line == 5625 (round_half_up((15000 + 7500) * 2500 / 10000)), subtotal_cents == 28125, discount_bp == 1000"
            - "FeeInvoice for ${claim_c}: discount_cents == 2813, NOT 2812 (28125 * 1000 / 10000 == 2812.5, resolved by round_half_up)"
            - "FeeInvoice for ${claim_c}: total_cents == 25312 and balance_due_cents == 25312"
            - "All three invoices have aid_eligible == false, and the three claims all sit at fee_status INVOICED"
            - "The 4-credit claim's total (22500) exceeds the 3-credit claim's total (21375) by 1125, so the larger tier discount never inverts the ordering at this boundary"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: assessor_assignment_gated_by_fee_status_on_a_separate_invoice_aggregate
        grounds:
          - validations[priority=42 ERR_ASSESSMENT_FEE_UNPAID]
          - state_machines.PlaClaim.fee_status
          - entities.FeeInvoice.fields.balance_due_cents
          - calculations.assessment_fee_invoice_total
          - endpoints[POST /pla-claims/{claim_id}/assessor-assignments]
          - endpoints[POST /fee-invoices/{invoice_id}/payments]
        distinguishing_aspect: |
          Nothing on the PlaClaim or the FacultyAssessor forbids the assignment —
          the claim is SUBMITTED, the assessor is ACTIVE, in-department, rank 2 and
          idle. The single blocking fact lives on a different aggregate: the
          FeeInvoice sits at PARTIALLY_PAID with balance_due_cents 500 out of
          22500, and 500 cents is enough to force 402. Paying that remainder, with
          nothing else changed, makes the identical request succeed.
        test_recipe:
          setup:
            - "Program BSCS-GATE allowing PORTFOLIO."
            - "Course CS204 (4 credits, LOWER) with OC1 weight_bp 10000, mastery_threshold_bp 7000."
            - "Student S-1001 MATRICULATED; FacultyAssessor E-9001 (CS, rank 2, max_concurrent_assignments 3, ACTIVE, active_assignment_count 0)."
            - "A PORTFOLIO claim for 4 credits with ONE artifact, submitted, so the invoice is subtotal 25000 / discount 2500 / total 22500."
            - "A single payment of 22000 leaves balance_due_cents 500 and fee_status PARTIALLY_PAID."
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "BSCS-GATE", title: "BS Computer Science", total_credits_required: 120, residency_min_credits: 30, pla_max_credits: 30, pla_max_pct_bp: 2500, pla_upper_division_max_credits: 6, allowed_source_types: ["PORTFOLIO"], status: "ACTIVE" }
              as: PlaCoordinator
              captures: { prog_id: "$.data.id" }
            - call: "POST /courses"
              payload: { course_code: "CS204", title: "Networks", department_code: "CS", credits: 4, level: "LOWER", pla_eligible: true, learning_outcomes: [{ outcome_code: "OC1", description: "Operate", weight_bp: 10000, mastery_threshold_bp: 7000 }] }
              as: PlaCoordinator
              captures: { course_id: "$.data.id" }
            - call: "GET /learning-outcomes?course_id=${course_id}"
              as: PlaCoordinator
              captures: { oc1_id: "$.data[0].id" }
            - call: "POST /students"
              payload: { student_number: "S-1001", full_name: "Ada Reyes", program_id: "${prog_id}", enrollment_status: "MATRICULATED", transfer_credits_accepted: 0, institutional_credits_earned: 60 }
              as: PlaCoordinator
              captures: { stu_id: "$.data.id" }
            - call: "POST /faculty-assessors"
              payload: { employee_number: "E-9001", full_name: "Dr Nia Ford", department_code: "CS", credential_rank: 2, max_concurrent_assignments: 3, appeal_panel_member: false, status: "ACTIVE" }
              as: PlaCoordinator
              captures: { asr1_id: "$.data.id" }
            - call: "POST /pla-claims"
              payload: { student_id: "${stu_id}", course_id: "${course_id}", source_type: "PORTFOLIO", credits_requested: 4, rush_requested: false }
              as: Student
              as_user_id: "${stu_id}"
              captures: { claim_id: "$.data.id" }
            - call: "POST /portfolios"
              payload: { claim_id: "${claim_id}", narrative: "Network operations evidence" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { pf_id: "$.data.id" }
            - call: "POST /portfolios/${pf_id}/artifacts"
              payload: { artifact_type: "WORK_PRODUCT", title: "Runbook", evidence_uri: "s3://ev/n1", outcome_mappings: [{ learning_outcome_id: "${oc1_id}", alignment: "PRIMARY" }] }
              as: Student
              as_user_id: "${stu_id}"
            - call: "POST /portfolios/${pf_id}/submit"
              as: Student
              as_user_id: "${stu_id}"
            - call: "POST /pla-claims/${claim_id}/submit"
              as: Student
              as_user_id: "${stu_id}"
            - call: "GET /fee-invoices?claim_id=${claim_id}"
              as: PlaCoordinator
              captures: { inv_id: "$.data[0].id", inv_total: "$.data[0].total_cents" }
            - call: "POST /fee-invoices/${inv_id}/payments"
              payload: { amount_cents: 22000, method: "CARD" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { bal: "$.data.balance_due_cents", paid_so_far: "$.data.paid_cents" }
          trigger:
            - call: "POST /pla-claims/${claim_id}/assessor-assignments"
              payload: { assessor_id: "${asr1_id}" }
              as: PlaCoordinator
          assert:
            - "Before the trigger: FeeInvoice.${inv_id}.subtotal_cents == 25000, discount_bp == 1000, total_cents == 22500, paid_cents == 22000, balance_due_cents == 500, and PlaClaim.${claim_id}.fee_status == PARTIALLY_PAID"
            - "Before the trigger the claim side is entirely clean: PlaClaim.${claim_id}.assessment_status == SUBMITTED and FacultyAssessor.${asr1_id}.status == ACTIVE with active_assignment_count == 0"
            - "response status == 402 and data.error_id == ERR_ASSESSMENT_FEE_UNPAID"
            - "No AssessorAssignment row exists for ${claim_id} and FacultyAssessor.${asr1_id}.active_assignment_count is still 0"
            - "PlaClaim.${claim_id}.assessment_status is still SUBMITTED (a rejected assignment does not move the claim to UNDER_ASSESSMENT)"
            - "Paying the remaining 500 flips PlaClaim.${claim_id}.fee_status to PAID with FeeInvoice.${inv_id}.balance_due_cents 0, and the byte-identical assignment request then returns 201 with status ASSIGNED and FacultyAssessor.${asr1_id}.active_assignment_count == 1"
            - "Waiving the 500 instead of paying it also unblocks the assignment, because rule 42 accepts fee_status in {PAID, WAIVED}"

      - name: transcript_posting_blocked_two_hops_away_by_program_status_flip
        grounds:
          - validations[priority=25 ERR_PROGRAM_INACTIVE]
          - state_machines.PlaClaim.credit_status
          - entities.Program.fields.status
          - entities.Student.fields.pla_credits_awarded
          - entities.Student.fields.pla_credits_posted
          - endpoints[POST /pla-claims/{claim_id}/transcript-posting]
          - endpoints[PATCH /programs/{program_id}]
        distinguishing_aspect: |
          The blocking state is two references away from the entity being written:
          PlaClaim -> Student -> Program. The claim is AWARDED, the registrar is
          authorized, the cap and residency arithmetic all pass, and the claim row
          carries no program_id at all — yet posting must return 409
          ERR_PROGRAM_INACTIVE because the student's program was deactivated after
          the award. An implementation that only reads the claim and the student
          posts the credit.
        test_recipe:
          setup:
            - "Program BSCS-FLIP ACTIVE, pla_max_credits 30, residency_min_credits 30, total_credits_required 120."
            - "Course CS150 (6 credits, LOWER) with OC1 weight_bp 8000 and OC2 weight_bp 2000, mastery 7000."
            - "Student S-1001 MATRICULATED with transfer_credits_accepted 0."
            - "A PORTFOLIO claim for 6 credits carried all the way to AWARDED with credits_awarded 6: invoice waived, assignment accepted, rubric 4/4 and 4/4 so verified_coverage_bp is 10000 and the recommendation is PASS."
            - "The program is then PATCHed to status INACTIVE."
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "BSCS-FLIP", title: "BS Computer Science", total_credits_required: 120, residency_min_credits: 30, pla_max_credits: 30, pla_max_pct_bp: 2500, pla_upper_division_max_credits: 6, allowed_source_types: ["PORTFOLIO"], status: "ACTIVE" }
              as: PlaCoordinator
              captures: { prog_id: "$.data.id" }
            - call: "POST /courses"
              payload: { course_code: "CS150", title: "Intro Programming", department_code: "CS", credits: 6, level: "LOWER", pla_eligible: true, learning_outcomes: [{ outcome_code: "OC1", description: "Design", weight_bp: 8000, mastery_threshold_bp: 7000 }, { outcome_code: "OC2", description: "Test", weight_bp: 2000, mastery_threshold_bp: 7000 }] }
              as: PlaCoordinator
              captures: { course_id: "$.data.id" }
            - call: "GET /learning-outcomes?course_id=${course_id}"
              as: PlaCoordinator
              captures: { oc1_id: "$.data[0].id", oc2_id: "$.data[1].id" }
            - call: "POST /students"
              payload: { student_number: "S-1001", full_name: "Ada Reyes", program_id: "${prog_id}", enrollment_status: "MATRICULATED", transfer_credits_accepted: 0, institutional_credits_earned: 60 }
              as: PlaCoordinator
              captures: { stu_id: "$.data.id" }
            - call: "POST /faculty-assessors"
              payload: { employee_number: "E-9001", full_name: "Dr Nia Ford", department_code: "CS", credential_rank: 2, max_concurrent_assignments: 3, appeal_panel_member: false, status: "ACTIVE" }
              as: PlaCoordinator
              captures: { asr1_id: "$.data.id" }
            - call: "POST /pla-claims"
              payload: { student_id: "${stu_id}", course_id: "${course_id}", source_type: "PORTFOLIO", credits_requested: 6, rush_requested: false }
              as: Student
              as_user_id: "${stu_id}"
              captures: { claim_id: "$.data.id" }
            - call: "POST /portfolios"
              payload: { claim_id: "${claim_id}", narrative: "Production engineering evidence" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { pf_id: "$.data.id" }
            - call: "POST /portfolios/${pf_id}/artifacts"
              payload: { artifact_type: "WORK_PRODUCT", title: "Service", evidence_uri: "s3://ev/s1", outcome_mappings: [{ learning_outcome_id: "${oc1_id}", alignment: "PRIMARY" }, { learning_outcome_id: "${oc2_id}", alignment: "PRIMARY" }] }
              as: Student
              as_user_id: "${stu_id}"
            - call: "POST /portfolios/${pf_id}/submit"
              as: Student
              as_user_id: "${stu_id}"
            - call: "POST /pla-claims/${claim_id}/submit"
              as: Student
              as_user_id: "${stu_id}"
            - call: "GET /fee-invoices?claim_id=${claim_id}"
              as: PlaCoordinator
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /fee-invoices/${inv_id}/waive"
              payload: { waive_reason: "Veteran fee waiver" }
              as: PlaCoordinator
            - call: "POST /pla-claims/${claim_id}/assessor-assignments"
              payload: { assessor_id: "${asr1_id}" }
              as: PlaCoordinator
              captures: { asg_id: "$.data.id" }
            - call: "POST /assessor-assignments/${asg_id}/accept"
              as: FacultyAssessor
              as_user_id: "${asr1_id}"
            - call: "POST /assessor-assignments/${asg_id}/rubric-scores"
              payload: { learning_outcome_id: "${oc1_id}", points_awarded: 4, narrative: "Exceeds" }
              as: FacultyAssessor
              as_user_id: "${asr1_id}"
            - call: "POST /assessor-assignments/${asg_id}/rubric-scores"
              payload: { learning_outcome_id: "${oc2_id}", points_awarded: 4, narrative: "Exceeds" }
              as: FacultyAssessor
              as_user_id: "${asr1_id}"
            - call: "POST /assessor-assignments/${asg_id}/complete"
              payload: { recommendation: "PASS" }
              as: FacultyAssessor
              as_user_id: "${asr1_id}"
            - call: "GET /students/${stu_id}"
              as: PlaCoordinator
              captures: { stu_v1: "$.data.version" }
            - call: "POST /pla-claims/${claim_id}/award"
              payload: { expected_student_version: "${stu_v1}", credits_awarded: 6 }
              as: PlaCoordinator
              captures: { awarded: "$.data.credits_awarded" }
            - call: "PATCH /programs/${prog_id}"
              payload: { status: "INACTIVE" }
              as: PlaCoordinator
              captures: { prog_status: "$.data.status" }
          trigger:
            - call: "POST /pla-claims/${claim_id}/transcript-posting"
              payload: { posted_term: "2026FA" }
              as: Registrar
          assert:
            - "Before the trigger: PlaClaim.${claim_id}.assessment_status == AWARDED, credits_awarded == 6, credit_status == NOT_POSTED, verified_coverage_bp == 10000"
            - "Before the trigger: Student.${stu_id}.pla_credits_reserved == 0, pla_credits_awarded == 6, pla_credits_posted == 0, and Program.${prog_id}.status == INACTIVE"
            - "The cap and residency arithmetic would both pass: posted_credits 6 <= remaining_posted_only 30, and 0 + 6 <= 120 - 30"
            - "response status == 409 and data.error_id == ERR_PROGRAM_INACTIVE"
            - "PlaClaim.${claim_id}.credit_status is still NOT_POSTED, posted_term is null and posted_credits is null"
            - "Student.${stu_id}.pla_credits_awarded is still 6 and pla_credits_posted is still 0 (no partial ledger move on the rejected posting)"
            - "PATCHing the program back to status ACTIVE and repeating the same posting returns 200 with credit_status == POSTED, posted_term == 2026FA, posted_credits == 6, Student.pla_credits_awarded == 0 and pla_credits_posted == 6"

  - rule_id: resource_temporal_overlap
    instances:
      - name: assessor_buffered_window_closed_endpoint_touch_conflicts_but_one_ms_later_does_not
        grounds:
          - calculations.assessor_buffered_window_conflict_count
          - calculations.assessment_sla_due_at
          - validations[priority=32 ERR_ASSESSOR_CAPACITY_CONFLICT]
          - entities.FacultyAssessor.fields.max_concurrent_assignments
          - entities.AssessorAssignment.fields.due_at
          - endpoints[POST /pla-claims/{claim_id}/assessor-assignments]
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: |
          The conflict interval is CLOSED on both ends and padded by
          ASSIGNMENT_BUFFER_HOURS 24, so the first assignment's window
          [2026-08-01T00:00:00Z, 2026-08-11T00:00:00Z] becomes the buffered
          [2026-07-31T00:00:00Z, 2026-08-12T00:00:00Z] and a second assignment
          created at EXACTLY 2026-08-12T00:00:00Z still collides on the single
          shared instant. One millisecond later it does not. Half-open geometry,
          or forgetting the 24-hour pad, flips exactly one of the two attempts.
        test_recipe:
          setup:
            - "Program BSCS-BUF allowing PORTFOLIO; assessor E-9001 (CS, rank 2, ACTIVE) with max_concurrent_assignments 1 so a single conflict is fatal."
            - "Courses CS150 (6 credits, LOWER) and CS210 (6 credits, LOWER), one outcome each (OC1 weight_bp 10000, mastery 7000)."
            - "Claim 1 (PORTFOLIO, 1 artifact) submitted and its invoice waived, then assigned to E-9001 while the logical clock still reads 2026-08-01T00:00:00Z, giving sla_hours 240, at_risk_at 2026-08-09T00:00:00Z and due_at 2026-08-11T00:00:00Z."
            - "Claim 2 (PORTFOLIO, 1 artifact) submitted and its invoice waived, left with no assignment."
            - "The escalation sweep is never run, so assignment 1 stays in ASSIGNED and keeps holding its buffered window even after due_at passes."
            - "The clock is then set to exactly 2026-08-12T00:00:00Z == due_at + ASSIGNMENT_BUFFER_HOURS."
