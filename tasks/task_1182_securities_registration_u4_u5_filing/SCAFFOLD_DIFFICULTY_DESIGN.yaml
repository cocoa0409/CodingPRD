      - name: exam_window_gated_by_sie_requirement_state
        grounds:
          - state_machines.ExamRequirement.REQUIRED_to_SCHEDULED
          - entities.ExamRequirement.fields.exam_code
        distinguishing_aspect: |
          Pair (ExamWindow -> sibling ExamRequirement) — different entity pair
          from instance 1: scheduling an S7 window is rejected while the same
          request's SIE requirement is REQUIRED; after SIE reaches SCHEDULED
          (its own window created) the S7 window is accepted — the gate is the
          sibling row's state membership {SCHEDULED, PASSED, WAIVED}.
        test_recipe:
          setup:
            - "Firm, applicant, RR request in DRAFT; SIE and S7 requirements both REQUIRED; clock 2026-06-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /registration-desk/firms"
              payload: { crd_number: "1703", legal_name: "Cross Firm 3" }
              as: SystemOperator
              captures: { firm_x3_id: $.data.id }
            - call: "POST /registration-desk/applicants"
              payload: { crd_number: "2702", full_name: "Cross Rep Two", date_of_birth: "1994-02-14" }
              as: RegistrationPrincipal
              captures: { app_x2_id: $.data.id }
            - call: "POST /registration-desk/registration-requests"
              payload: { applicant_id: "${app_x2_id}", firm_id: "${firm_x3_id}", registration_category: "RR" }
              as: RegistrationPrincipal
