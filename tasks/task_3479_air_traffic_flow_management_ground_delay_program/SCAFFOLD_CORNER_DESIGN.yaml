            - "run_moves == 0 and run_passes == 1 (the freed reserved slot went to GA promotion, not carrier moves)"
            - "promoted contains ${gq2}"
            - "exactly one flight of ${op_ga} is SLOTTED with controlled_arrival == 2026-09-15T13:55:00Z (the promotion), the cancelled GA flight is CANCELLED/UNCONTROLLED"
            - "run_open == 9 (carrier slots 13:10-13:50 stay OPEN)"

  - section: calculations
    instances:
      - name: forecast_floor_clamp
        claim_type: constants_applied
        grounds:
          - calculations.capacity_forecast_rate
        distinguishing_aspect: "Three severity-5 CONFIRMED events (WEATHER/STAFFING/EQUIPMENT) drive the raw multiplier to 0.09375, below MIN_CAPACITY_FLOOR_PCT 10% — the clamp yields floor(30 * 0.10) == 3, not floor(30 * 0.09375) == 2."
        test_recipe:
          setup:
            - "Facility base 30; three CONFIRMED severity-5 events of different types over 13:00-14:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: SystemAdministrator
            - call: "POST /atfm/facilities"
              payload: { ident: "KEWR", facility_type: "AIRPORT", base_acceptance_rate: 30 }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /atfm/facilities/${fac}/constraint-events"
              payload: { event_type: "WEATHER", severity: 5, window_start: "2026-09-15T13:00:00Z", window_end: "2026-09-15T14:00:00Z" }
              as: FlowManager
              captures: { e1: $.data.id }
            - call: "POST /atfm/constraint-events/${e1}/confirm"
              as: FlowManager
            - call: "POST /atfm/facilities/${fac}/constraint-events"
              payload: { event_type: "STAFFING", severity: 5, window_start: "2026-09-15T13:00:00Z", window_end: "2026-09-15T14:00:00Z" }
              as: FlowManager
              captures: { e2: $.data.id }
            - call: "POST /atfm/constraint-events/${e2}/confirm"
              as: FlowManager
            - call: "POST /atfm/facilities/${fac}/constraint-events"
              payload: { event_type: "EQUIPMENT", severity: 5, window_start: "2026-09-15T13:00:00Z", window_end: "2026-09-15T14:00:00Z" }
              as: FlowManager
              captures: { e3: $.data.id }
            - call: "POST /atfm/constraint-events/${e3}/confirm"
              as: FlowManager
          trigger:
            - call: "POST /atfm/facilities/${fac}/capacity-forecasts"
              payload: { variant: "PLANNING", window_start: "2026-09-15T13:00:00Z", window_end: "2026-09-15T15:00:00Z" }
              as: FlowManager
              captures: { rate: $.data.predicted_acceptance_rate }
          assert:
            - "rate == 3 (raw 0.25 * 0.50 * 0.75 = 0.09375 clamped to 0.10; floor(30 * 0.10) == 3; an implementation without the floor clamp returns 2)"
            - "included_event_ids holds all three event ids"

      - name: forecast_excludes_cleared_events
        claim_type: input_set_filtering
        grounds:
          - calculations.capacity_forecast_rate
        distinguishing_aspect: "A CONFIRMED-then-CLEARED event is excluded from the input set: predicted rate returns to 30 instead of the 12 that including it would produce."
        test_recipe:
          setup:
            - "Facility base 30; one WEATHER severity-4 event 13:00-15:00Z, confirmed then cleared"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: SystemAdministrator
            - call: "POST /atfm/facilities"
              payload: { ident: "KEWR", facility_type: "AIRPORT", base_acceptance_rate: 30 }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /atfm/facilities/${fac}/constraint-events"
              payload: { event_type: "WEATHER", severity: 4, window_start: "2026-09-15T13:00:00Z", window_end: "2026-09-15T15:00:00Z" }
              as: FlowManager
              captures: { e1: $.data.id }
            - call: "POST /atfm/constraint-events/${e1}/confirm"
              as: FlowManager
            - call: "POST /atfm/constraint-events/${e1}/clear"
              as: FlowManager
          trigger:
            - call: "POST /atfm/facilities/${fac}/capacity-forecasts"
              payload: { variant: "PLANNING", window_start: "2026-09-15T13:00:00Z", window_end: "2026-09-15T15:00:00Z" }
              as: FlowManager
              captures: { rate: $.data.predicted_acceptance_rate }
          assert:
            - "rate == 30 (CLEARED events excluded; including it would give floor(30 * 0.40) == 12)"
            - "included_event_ids is empty"

      - name: rbs_tie_break_created_at
        claim_type: precision
        grounds:
          - calculations.rbs_slot_allocation
        distinguishing_aspect: "Two flights with identical scheduled_arrival 13:10 are ordered by created_at ASC — B1 created at 12:00 takes slot 13:00, A1 created at 12:01 takes 13:10. The tie-break is created_at, never id or operator name."
        test_recipe:
          setup:
            - "ACTIVE GDP rate 6, 13:00-15:00Z; B1 (op_b) filed at clock 12:00, A1 (op_a) filed at clock 12:01, both scheduled 13:10"
