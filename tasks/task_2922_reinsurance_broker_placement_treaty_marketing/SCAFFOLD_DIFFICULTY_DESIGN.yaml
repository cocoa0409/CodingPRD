  # ===========================================================================
  # RULE 7 — cross-entity state dependencies, three DIFFERENT entity pairs
  #   instance 1 : (Layer, Reinsurer)
  #   instance 2 : (FiduciaryTransaction, Program)
  #   instance 3 : (ClaimAdvocacy, Layer)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: layer_cannot_be_submitted_to_a_market_whose_security_status_is_suspended
        grounds:
          - validations[priority=37]
          - errors.ERR_MARKET_SUSPENDED
          - entities.Reinsurer.fields.security_status
          - state_machines.Layer.transitions.OPEN_to_IN_MARKET
        distinguishing_aspect: |
          Entity pair (Layer, Reinsurer): the write targets the Layer, but admissibility depends
          on a state field of a Reinsurer that the request only references. India Re is APPROVED
          when the program goes to market and SUSPENDED by the time the submission is attempted,
          so the same call flips from legal to illegal without the Layer changing at all.
          Instances 2 and 3 use different pairs.
        test_recipe:
          setup:
            - "One cedent, two markets: India Re and Juliet Re, both APPROVED at creation."
            - "One PROPERTY program in placement_status IN_MARKET with one CATASTROPHE layer in status OPEN."
            - "Juliet Re receives a submission first, so the layer moves OPEN -> IN_MARKET and is provably able to accept submissions."
            - "Compliance then suspends India Re."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /cedents"
              payload: { name: "Northwind Mutual", domicile_code: "USNYC", financial_rating: "A" }
              as: PlatformAdmin
              captures: { ced_id: $.data.id }
            - call: "POST /reinsurers"
              payload: { name: "India Re", security_rating: "A", capacity_limit_minor: 1000000000, max_line_pct: 40.0000, lead_authorised: false }
              as: PlatformAdmin
              captures: { india_id: $.data.id }
            - call: "POST /reinsurers"
              payload: { name: "Juliet Re", security_rating: "AA", capacity_limit_minor: 1000000000, max_line_pct: 60.0000, lead_authorised: true }
              as: PlatformAdmin
              captures: { juliet_id: $.data.id }
            - call: "POST /programs"
              payload: { cedent_id: "${ced_id}", program_name: "Northwind Property CAT 2026", line_of_business: "PROPERTY", underwriting_year: 2026, inception_date: "2026-01-01T00:00:00.000Z", expiry_date: "2027-01-01T00:00:00.000Z", estimated_premium_income_minor: 2000000000, brokerage_pct: 2.5000 }
              as: BrokerPlacementLead
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/exposure-submissions"
              payload: { package_label: "NW-CAT-2026-EDP", exposure_records_count: 1000, data_quality_flags_count: 20, historical_years_supplied: 5, cat_model_version: "RMS-23.1", loss_history_completeness_pct: 90.0000, actuarial_report_attached: true }
              as: CedentUnderwriter
              as_user_id: "${ced_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /programs/${prog_id}/layers"
              payload: { layer_label: "PROP CAT 1B xs 2B", layer_type: "CATASTROPHE", attachment_minor: 2000000000, limit_minor: 1000000000, base_rate_pct: 8.0000, subject_premium_base_minor: 1250000000, expected_loss_cost_minor: 60000000, reinstatements_total: 1, reinstatement_premium_pct: 100.0000, sublimit_minor: 0 }
              as: BrokerPlacementLead
              captures: { layer_id: $.data.id }
            - call: "POST /exposure-submissions/${sub_id}/submit-for-review"
              payload: {}
              as: BrokerPlacementLead
            - call: "POST /exposure-submissions/${sub_id}/signoff"
              payload: { decision: "SIGNED_OFF" }
              as: BrokerActuary
            - call: "POST /programs/${prog_id}/go-to-market"
              payload: {}
              as: BrokerPlacementLead
            - call: "POST /layers/${layer_id}/market-submissions"
              payload: { reinsurer_id: "${juliet_id}", response_deadline: "2026-02-01T00:00:00.000Z" }
              as: BrokerPlacementLead
              captures: { ms_j: $.data.id }
            - call: "POST /reinsurers/${india_id}/security-status"
              payload: { security_status: "SUSPENDED", reason: "regulatory intervention in domicile" }
              as: ComplianceOfficer
              as_user_id: "compl-1"
          trigger:
            - call: "POST /layers/${layer_id}/market-submissions"
              payload: { reinsurer_id: "${india_id}", response_deadline: "2026-02-01T00:00:00.000Z" }
              as: BrokerPlacementLead
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 and ${err} == ERR_MARKET_SUSPENDED"
            - "Reinsurer.${india_id}.security_status == SUSPENDED"
            - "Layer.${layer_id}.status == IN_MARKET  # the layer itself was always able to receive submissions"
            - "MarketSubmission.${ms_j}.status == SENT"
            - "GET /reinsurers/${india_id}/market-submissions returns 0 rows"

