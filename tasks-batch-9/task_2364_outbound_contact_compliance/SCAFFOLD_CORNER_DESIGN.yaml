      - Campaign.${camp_id}.rolling_compliance_rate_pct == 25.00 (days 50.00 and 0.00, each rounded before averaging)
      - Campaign.${camp_id}.status == ACTIVE and Contact.${c1_id}.attempt_budget_remaining == 0
  - name: dual_variant_delta_on_the_abandonment_rates
    claim_type: dual_variant_calculation
    grounds:
    - calculations.abandonment_rate
    - entities.Campaign.fields.internal_abandonment_rate_pct
    excluded_because:
      difficulty_instance: dual_variant_calc / abandonment_rate_regulatory_vs_internal_divergence
      rationale: The named §1.8 instance pins both variants on one identical event stream (regulatory 33.33 vs internal 25.00) and the breach decision taken from the regulatory variant only.
  - name: n_level_cascade_verified_end_to_end
    claim_type: cascading_side_effects
    grounds:
    - state_machines.RevocationRequest.RECEIVED_to_VALIDATED
    - state_machines.Campaign.ACTIVE_to_SUSPENDED
    excluded_because:
      difficulty_instance: transitive_cascade / revocation_validate_cascades_four_hops_to_campaign_suspension
      rationale: The named §1.8 instance asserts all four hops end to end (consent REVOKED -> contact SUPPRESSED + INTERNAL entry -> scrub INVALIDATED -> campaign SUSPENDED with attempts voided and budgets credited).
  - name: instantaneous_threshold_boundary_on_the_abandonment_limit
    claim_type: rate_threshold_triggers
    grounds:
    - calculations.abandonment_rate
    - entities.DialerProfile.fields.abandonment_limit_pct
    excluded_because:
      difficulty_instance: boundary_precision_check / abandonment_limit_not_breached_at_exactly_the_limit
      rationale: The named §1.8 instance sits exactly on the limit (no suspension) and one hundredth of a point above it (suspension plus profile lock), which is this layer's boundary claim.
- section: consistency_model
  instances:
  - name: launch_response_already_carries_every_certification_side_effect
    claim_type: immediate
    grounds:
    - complexity_profile.consistency_model
    - state_machines.Campaign.PENDING_LAUNCH_to_ACTIVE
    - entities.Campaign.fields.pinned_script_version
    distinguishing_aspect: 'Consistency is immediate: the launch response body itself shows the new status, the pinned script version, the zeroed measurement counters and the bumped version - no re-read is needed for any derived field.'
    test_recipe:
      setup:
      - APPROVED CA VOICE script at version 3 (create, submit-review, approve)
      - campaign in PENDING_LAUNCH at version 3 with eligible_target_count 1
      - clock at 2026-08-03T00:00:00Z
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T00:00:00Z'
        as: PlatformAdmin
      - call: POST /compliance/calling-window-policies
        payload:
          state_code: CA
          window_start_local: 08:00
          window_end_local: '21:00'
          recording_consent_regime: ONE_PARTY
          effective_from: '2026-07-01T00:00:00Z'
          effective_to: '2027-01-01T00:00:00Z'
        as: PlatformAdmin
        captures:
          pol_ca_id: $.data.id
      - call: POST /compliance/contacts
        payload:
          phone_number: '+14155550101'
          state_code: CA
          utc_offset_minutes: -420
          time_zone_label: America/Los_Angeles
          phone_type: WIRELESS
          attempt_budget_total: 3
        as: PlatformAdmin
        captures:
          c1_id: $.data.id
          c1_v: $.data.version
      - call: POST /compliance/agent-scripts
        payload:
          name: CA VOICE Script
          channel: VOICE
          disclosure_blocks:
          - IDENTIFICATION
          - PURPOSE
          - OPT_OUT
          recording_consent_mode: ONE_PARTY
          covered_state_codes:
          - CA
        as: CampaignManager
        captures:
          scr_id: $.data.id
      - call: POST /compliance/agent-scripts/${scr_id}/submit-review
        payload: {}
        as: CampaignManager
      - call: POST /compliance/agent-scripts/${scr_id}/approve
        payload:
          approval_note: Disclosures cleared
        as: ComplianceOfficer
        as_user_id: officer-script-approver
      - call: POST /compliance/consent-records
        payload:
          contact_id: ${c1_id}
          channel: VOICE
          consent_type: EXPRESS_WRITTEN
          capture_method: WEB_FORM
          disclosure_script_id: ${scr_id}
          disclosure_text_version: 1
          signature_evidence: evidence-c1
          expected_contact_version: ${c1_v}
        as: ComplianceOfficer
        captures:
          cons1_id: $.data.id
      - call: POST /compliance/contacts/${c1_id}/number-status-check
        payload:
          claimed_consent_date: '2026-07-15'
        as: DialerOperator
      - call: POST /compliance/suppression-entries
        payload:
          list_type: NATIONAL
          phone_number: '+18005550000'
          source: FTC_DNC_DOWNLOAD
          source_refreshed_at: '2026-08-01T00:00:00Z'
        as: ComplianceOfficer
      - call: POST /compliance/dialer-profiles
        payload:
          mode: PREDICTIVE
          agents_available: 5
          abandonment_limit_pct: 50.0
          amd_enabled: true
          amd_abandon_on_machine: false
          abandon_message_seconds: 2
        as: DialerOperator
        captures:
          dp_id: $.data.id
      - call: POST /compliance/dialer-profiles/${dp_id}/approve
        payload:
          waiver_reference: WVR-2026-0142
        as: ComplianceOfficer
        as_user_id: officer-profile-approver
      - call: POST /compliance/campaigns
        payload:
          name: CA Aug Outreach
          channel: VOICE
          campaign_purpose: MARKETING
          target_state_codes:
          - CA
          dialer_profile_id: ${dp_id}
          agent_script_id: ${scr_id}
        as: CampaignManager
        captures:
          camp_id: $.data.id
          camp_v: $.data.version
      - call: POST /compliance/scrub-jobs
        payload:
          campaign_id: ${camp_id}
          list_types:
          - NATIONAL
          - INTERNAL
          expected_campaign_version: ${camp_v}
        as: CampaignManager
        captures:
          job_id: $.data.id
      - call: POST /compliance/scrub-jobs/${job_id}/execute
        payload: {}
        as: CampaignManager
      - call: GET /compliance/campaigns/${camp_id}
        payload: {}
        as: CampaignManager
        captures:
          camp_v2: $.data.version
      trigger:
      - call: POST /compliance/campaigns/${camp_id}/launch
        payload:
          certification_note: Certified for CA outreach
          expected_campaign_version: ${camp_v2}
        as: ComplianceOfficer
        as_user_id: officer-launcher
        captures:
          launched_status: $.data.status
          launched_pin: $.data.pinned_script_version
          launched_version: $.data.version
      assert:
      - the trigger returns 200 with ${launched_status} == ACTIVE
      - ${launched_pin} == 3 and ${launched_version} == 4
      - the same response carries launch_certified_by_user_id == "officer-launcher", measurement_date == "2026-08-03", all four *_count_today == 0 and both abandonment rates == 0.00
      - a following GET /compliance/campaigns/${camp_id} returns exactly the same field values
