              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p1_id: "$.data.id", p1_v: "$.data.version" }
            - call: "POST /woc-nurses"
              payload: { full_name: "Nina Probe", home_unit_id: "${u1_id}", ce_credits: 30 }
