  # ===========================================================================
  - section: errors
    instances:
      - name: enroll_with_archived_plan_returns_409
        claim_type: violation_to_error
        grounds: ["errors[ERR_PRICE_PLAN_INACTIVE]"]
        distinguishing_aspect: "Enrolling with an ARCHIVED price plan returns 409 ERR_PRICE_PLAN_INACTIVE."
        test_recipe:
          setup: ["Published course; its plan archived after publish"]
          setup_api_calls:
            - call: "POST /creators"
              payload: { email: "c@x.com", display_name: "C" }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
            - call: "POST /students"
              payload: { email: "s@x.com", full_name: "S" }
              as: PlatformAdmin
              captures: { student_id: $.data.id }
            - call: "POST /courses"
              payload: { creator_id: "${creator_id}", title: "A" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { course_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${course_id}", title: "L1", position: 1 }
              as: Creator
              as_user_id: "${creator_id}"
            - call: "POST /price-plans"
              payload: { course_id: "${course_id}", plan_type: "ONE_TIME", amount_cents: 20000 }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /price-plans"
              payload: { course_id: "${course_id}", plan_type: "ONE_TIME", amount_cents: 30000 }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { plan2_id: $.data.id }
            - call: "POST /courses/${course_id}/set-status"
              payload: { status: "PUBLISHED" }
              as: Creator
              as_user_id: "${creator_id}"
            - call: "POST /price-plans/${plan_id}/set-status"
              payload: { status: "ARCHIVED" }
              as: Creator
              as_user_id: "${creator_id}"
          trigger:
            - call: "POST /enrollments"
              payload: { student_id: "${student_id}", course_id: "${course_id}", price_plan_id: "${plan_id}" }
              as: Student
              as_user_id: "${student_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PRICE_PLAN_INACTIVE"

      - name: quiz_attempt_on_non_quiz_lesson_returns_422
        claim_type: violation_to_error
        grounds: ["errors[ERR_QUIZ_NOT_REQUIRED]"]
        distinguishing_aspect: "Submitting a quiz attempt for a lesson with is_quiz_required=false returns 422 ERR_QUIZ_NOT_REQUIRED."
        test_recipe:
          setup: ["Paid ACTIVE enrollment; lesson is_quiz_required=false"]
          setup_api_calls:
            - call: "POST /creators"
              payload: { email: "c@x.com", display_name: "C" }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
            - call: "POST /students"
              payload: { email: "s@x.com", full_name: "S" }
              as: PlatformAdmin
              captures: { student_id: $.data.id }
            - call: "POST /courses"
              payload: { creator_id: "${creator_id}", title: "A" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { course_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${course_id}", title: "L1", position: 1, is_quiz_required: false }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { lesson_id: $.data.id }
            - call: "POST /price-plans"
              payload: { course_id: "${course_id}", plan_type: "ONE_TIME", amount_cents: 20000 }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /courses/${course_id}/set-status"
              payload: { status: "PUBLISHED" }
              as: Creator
              as_user_id: "${creator_id}"
            - call: "POST /enrollments"
              payload: { student_id: "${student_id}", course_id: "${course_id}", price_plan_id: "${plan_id}" }
              as: Student
              as_user_id: "${student_id}"
              captures: { enrollment_id: $.data.id }
            - call: "GET /invoices?enrollment_id=${enrollment_id}"
              as: Student
              as_user_id: "${student_id}"
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /invoices/${inv_id}/pay"
              payload: {}
              as: Student
              as_user_id: "${student_id}"
          trigger:
            - call: "POST /enrollments/${enrollment_id}/quiz-attempts"
              payload: { lesson_id: "${lesson_id}", score: 90 }
              as: Student
              as_user_id: "${student_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_QUIZ_NOT_REQUIRED"

      - name: set_status_invalid_value_returns_422
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_STATUS_VALUE]"]
        distinguishing_aspect: "Course set-status with a value outside the status enum returns 422 ERR_INVALID_STATUS_VALUE."
        test_recipe:
          setup: ["A DRAFT course"]
          setup_api_calls:
            - call: "POST /creators"
              payload: { email: "c@x.com", display_name: "C" }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
            - call: "POST /courses"
              payload: { creator_id: "${creator_id}", title: "A" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { course_id: $.data.id }
          trigger:
            - call: "POST /courses/${course_id}/set-status"
              payload: { status: "LIVE" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATUS_VALUE"

      - name: coupon_course_mismatch_solo_returns_422
        claim_type: violation_to_error
        grounds: ["errors[ERR_COUPON_COURSE_MISMATCH]"]
        excluded_because:
          difficulty_instance: coupon_referential_beats_fiscal
          rationale: "The referential mismatch error is asserted (as the winning error over the fiscal conflict) by the named §1.8 priority-conflict instance."

      - name: refund_window_expired_returns_409
        claim_type: violation_to_error
        grounds: ["errors[ERR_REFUND_WINDOW_EXPIRED]"]
        excluded_because:
          difficulty_instance: refund_window_inclusive_boundary
          rationale: "The window boundary (inclusive pass) is the §1.8 instance; the just-past-deadline expiry is the same rule's negative side and is exercised there."

