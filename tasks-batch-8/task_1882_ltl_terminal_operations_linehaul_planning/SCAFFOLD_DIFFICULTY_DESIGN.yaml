scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: freight_rating_gross_vs_dim_divergence
        grounds:
          - calculations.freight_rating
          - entities.Shipment.fields.rated_amount_cents
          - state_machines.Shipment.INSPECTION_PENDING_to_RERATED
        distinguishing_aspect: |
          Same shipment, same accessorials: GROSS variant (declared 450 lbs, dims ignored)
          yields rated_amount_cents 24725 while DIM variant (measured 60x48x50in / 430 lbs,
          chargeable = max(430, ceil(144000/194)) = 743 lbs) yields 33662 — the variant, not
          the inputs, changes the bill.
        test_recipe:
          setup:
            - "Two ACTIVE terminals CHI and ATL"
            - "Shipment S: CLASS_70, actual_weight_lbs=450, dims 48x40x48, accessorials [LIFTGATE, NOTIFY], destination ATL"
            - "S rated with GROSS variant -> rated_amount_cents = 11250 + 2475 + 7500 + 3500 = 24725"
            - "DimensionerScan on S: measured 60x48x50 in, 430 lbs"
          setup_api_calls:
            - { call: "POST /ltl/terminals", payload: { code: "CHI", name: "Chicago", dock_doors: 12 }, as: TerminalAdmin, captures: { t_chi: $.data.id } }
            - { call: "POST /ltl/terminals", payload: { code: "ATL", name: "Atlanta", dock_doors: 10 }, as: TerminalAdmin, captures: { t_atl: $.data.id } }
            - { call: "POST /ltl/shipments", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", nmfc_class: "CLASS_70", actual_weight_lbs: 450, length_in: 48, width_in: 40, height_in: 48, service_standard: "STANDARD", accessorial_codes: ["LIFTGATE", "NOTIFY"] }, as: Dispatcher, captures: { s_id: $.data.id } }
            - { call: "POST /ltl/shipments/${s_id}/rate", payload: {}, as: RatingClerk, captures: { rated_gross: $.data.rated_amount_cents } }
            - { call: "POST /ltl/dimensioner-scans", payload: { shipment_id: "${s_id}", measured_length_in: 60, measured_width_in: 48, measured_height_in: 50, measured_weight_lbs: 430 }, as: RatingClerk, captures: { scan_id: $.data.id } }
          trigger:
            - { call: "POST /ltl/inspections", payload: { shipment_id: "${s_id}", scan_id: "${scan_id}", claimed_nmfc_class: "CLASS_70" }, as: RatingClerk, captures: { insp_id: $.data.id } }
            - { call: "POST /ltl/inspections/${insp_id}/confirm", payload: {}, as: RatingClerk }
          assert:
            - "Shipment.${s_id}.rated_amount_cents == 33662 after DIM re-rate (was ${rated_gross} == 24725 under GROSS)"
            - "Shipment.${s_id}.dim_weight_lbs == 743 and chargeable_weight_lbs == 743"
            - "Inspection.${insp_id}.adjustment_cents == 8937 (33662 - 24725)"

      - name: relay_eta_planned_vs_provisional_divergence
        grounds:
          - calculations.relay_feasibility_and_eta
          - entities.LinehaulLeg.fields.provisional_eta_utc
          - state_machines.LinehaulLeg.PLANNED_to_EN_ROUTE
        distinguishing_aspect: |
          Same relay chain: PLANNED_ETA variant projects leg-2 arrival at its planned 19:00Z,
          while PROVISIONAL_ETA (leg-1 departed 30 min late, eroding the 60-min slack below the
          45-min MIN_CONNECT buffer) projects 19:15Z — variant selection depends on departure
          state, and the two outputs diverge by exactly the 15-minute connect shortfall.
        test_recipe:
          setup:
            - "Trailer T sealed at CHI bound for DEN via relay point KC"
            - "Leg1 CHI->KC planned dep 2026-08-02T10:00:00Z arr 2026-08-02T14:00:00Z (relay_sequence 1)"
            - "Leg2 KC->DEN planned dep 2026-08-02T15:00:00Z arr 2026-08-02T19:00:00Z (relay_sequence 2); slack = 60 min >= 45 -> feasible at planning"
            - "Logical clock at 2026-08-02T10:30:00Z when leg1 departs (30 min late)"
          setup_api_calls:
            - { call: "POST /ltl/terminals", payload: { code: "CHI", name: "Chicago", dock_doors: 12 }, as: TerminalAdmin, captures: { t_chi: $.data.id } }
            - { call: "POST /ltl/terminals", payload: { code: "KCY", name: "Kansas City", dock_doors: 8 }, as: TerminalAdmin, captures: { t_kc: $.data.id } }
            - { call: "POST /ltl/terminals", payload: { code: "DEN", name: "Denver", dock_doors: 8 }, as: TerminalAdmin, captures: { t_den: $.data.id } }
            - { call: "POST /ltl/dock-doors", payload: { terminal_id: "${t_chi}", door_number: 21, door_kind: "OUTBOUND" }, as: DockSupervisor, captures: { door_id: $.data.id } }
            - { call: "POST /ltl/trailers", payload: { terminal_id: "${t_chi}", destination_terminal_id: "${t_den}", outbound_door_id: "${door_id}", max_weight_lbs: 40000, max_cube_cuft: 3500 }, as: DockSupervisor, captures: { tr_id: $.data.id, tr_v0: $.data.version } }
            - { call: "POST /ltl/shipments", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_den}", nmfc_class: "CLASS_60", actual_weight_lbs: 26000, length_in: 96, width_in: 96, height_in: 96, service_standard: "STANDARD" }, as: Dispatcher, captures: { s1: $.data.id } }
            - { call: "POST /ltl/shipments/${s1}/rate", payload: {}, as: RatingClerk }
            - { call: "POST /ltl/pickup-routes", payload: { terminal_id: "${t_chi}", route_date: "2026-08-01", driver_id: "DRV-7", shift_start_minute: 480, shift_end_minute: 1020 }, as: Dispatcher, captures: { r_id: $.data.id } }
            - { call: "POST /ltl/pickup-stops", payload: { route_id: "${r_id}", shipment_id: "${s1}", stop_sequence: 1, planned_arrival_minute: 540 }, as: Dispatcher, captures: { stop1: $.data.id } }
            - { call: "POST /ltl/pickup-routes/${r_id}/dispatch", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/pickup-stops/${stop1}/arrive", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/pickup-stops/${stop1}/complete", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/trailers/${tr_id}/manifest-entries", payload: { shipment_id: "${s1}", load_position: 1, expected_trailer_version: "${tr_v0}" }, as: DockSupervisor }
            - { call: "GET /ltl/trailers/${tr_id}", payload: {}, as: DockSupervisor, captures: { tr_v1: $.data.version } }
            - { call: "POST /ltl/trailers/${tr_id}/mark-ready", payload: {}, as: DockSupervisor }
            - { call: "POST /ltl/trailers/${tr_id}/seal", payload: { expected_trailer_version: "${tr_v1}" }, as: DockSupervisor }
            - { call: "POST /ltl/linehaul-legs", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_kc}", trailer_id: "${tr_id}", planned_departure_utc: "2026-08-02T10:00:00Z", planned_arrival_utc: "2026-08-02T14:00:00Z", relay_sequence: 1 }, as: Dispatcher, captures: { leg1: $.data.id } }
            - { call: "POST /ltl/linehaul-legs", payload: { origin_terminal_id: "${t_kc}", destination_terminal_id: "${t_den}", trailer_id: "${tr_id}", planned_departure_utc: "2026-08-02T15:00:00Z", planned_arrival_utc: "2026-08-02T19:00:00Z", relay_sequence: 2 }, as: Dispatcher, captures: { leg2: $.data.id, leg2_planned_arr: $.data.planned_arrival_utc, leg2_prov_planned: $.data.provisional_eta_utc } }
            - { call: "POST /ltl/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T10:30:00Z" }, as: TerminalAdmin }
          trigger:
            - { call: "POST /ltl/linehaul-legs/${leg1}/depart", payload: {}, as: Dispatcher, captures: { leg1_prov: $.data.provisional_eta_utc } }
            - { call: "GET /ltl/linehaul-legs/${leg2}", payload: {}, as: Dispatcher, captures: { leg2_prov_after: $.data.provisional_eta_utc } }
          assert:
            - "LinehaulLeg.${leg1}.provisional_eta_utc == 2026-08-02T14:30:00Z (planned 14:00 + 30 min accrued delay)"
            - "LinehaulLeg.${leg2}.provisional_eta_utc == 2026-08-02T19:15:00Z under PROVISIONAL_ETA vs 2026-08-02T19:00:00Z under PLANNED_ETA (shortfall = 14:30+45min-15:00 = 15 min)"
            - "LinehaulLeg.${leg2}.planned_arrival_utc remains 2026-08-02T19:00:00Z (planned value never rewritten)"

  # =====================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: osd_liability_min_of_four_caps
        grounds:
          - calculations.osd_liability
          - state_machines.OsdCase.UNDER_REVIEW_to_RESOLVED
        distinguishing_aspect: |
          Mode (a): >=3 inputs with nested min() and conditional branch on nmfc_class —
          awarded = min(claimed, per-line gross, per-lb class cap, 10x-freight cap). Here the
          per-lb class cap (450 lbs x CLASS_70 350c = 157500c) binds below the claimed 200000c,
          the item gross 190000c, and the freight cap 247250c.
        test_recipe:
          setup:
            - "Shipment CLASS_70, 450 lbs, accessorials [LIFTGATE, NOTIFY], GROSS-rated to 24725c, delivered"
            - "OsdCase DAMAGE claimed_amount_cents=200000, item_amounts_cents=[100000, 90000] (gross 190000)"
          setup_api_calls:
            - { call: "POST /ltl/terminals", payload: { code: "CHI", name: "Chicago", dock_doors: 12 }, as: TerminalAdmin, captures: { t_chi: $.data.id } }
            - { call: "POST /ltl/terminals", payload: { code: "ATL", name: "Atlanta", dock_doors: 10 }, as: TerminalAdmin, captures: { t_atl: $.data.id } }
            - { call: "POST /ltl/dock-doors", payload: { terminal_id: "${t_chi}", door_number: 22, door_kind: "OUTBOUND" }, as: DockSupervisor, captures: { door_id: $.data.id } }
            - { call: "POST /ltl/trailers", payload: { terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", outbound_door_id: "${door_id}", max_weight_lbs: 40000, max_cube_cuft: 3500 }, as: DockSupervisor, captures: { tr_id: $.data.id, tr_v0: $.data.version } }
            - { call: "POST /ltl/shipments", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", nmfc_class: "CLASS_70", actual_weight_lbs: 450, length_in: 48, width_in: 40, height_in: 48, service_standard: "STANDARD", accessorial_codes: ["LIFTGATE", "NOTIFY"] }, as: Dispatcher, captures: { s_id: $.data.id } }
            - { call: "POST /ltl/shipments/${s_id}/rate", payload: {}, as: RatingClerk }
            - { call: "POST /ltl/pickup-routes", payload: { terminal_id: "${t_chi}", route_date: "2026-08-01", driver_id: "DRV-7", shift_start_minute: 480, shift_end_minute: 1020 }, as: Dispatcher, captures: { r_id: $.data.id } }
            - { call: "POST /ltl/pickup-stops", payload: { route_id: "${r_id}", shipment_id: "${s_id}", stop_sequence: 1, planned_arrival_minute: 540 }, as: Dispatcher, captures: { stop1: $.data.id } }
            - { call: "POST /ltl/pickup-routes/${r_id}/dispatch", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/pickup-stops/${stop1}/arrive", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/pickup-stops/${stop1}/complete", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/trailers/${tr_id}/manifest-entries", payload: { shipment_id: "${s_id}", load_position: 1, expected_trailer_version: "${tr_v0}" }, as: DockSupervisor }
            - { call: "GET /ltl/trailers/${tr_id}", payload: {}, as: DockSupervisor, captures: { tr_v1: $.data.version } }
            - { call: "POST /ltl/trailers/${tr_id}/mark-ready", payload: {}, as: DockSupervisor }
            - { call: "POST /ltl/trailers/${tr_id}/seal", payload: { expected_trailer_version: "${tr_v1}" }, as: DockSupervisor }
            - { call: "POST /ltl/linehaul-legs", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", trailer_id: "${tr_id}", planned_departure_utc: "2026-08-01T20:00:00Z", planned_arrival_utc: "2026-08-02T08:00:00Z", relay_sequence: 1 }, as: Dispatcher, captures: { leg1: $.data.id } }
            - { call: "POST /ltl/linehaul-legs/${leg1}/depart", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/linehaul-legs/${leg1}/arrive", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/osd-cases", payload: { shipment_id: "${s_id}", case_kind: "DAMAGE", claimed_amount_cents: 200000, item_amounts_cents: [100000, 90000] }, as: OsdClerk, captures: { case_id: $.data.id } }
            - { call: "POST /ltl/osd-cases/${case_id}/review", payload: {}, as: OsdClerk }
          trigger:
            - { call: "POST /ltl/osd-cases/${case_id}/resolve", payload: {}, as: OsdClerk }
          assert:
            - "OsdCase.${case_id}.awarded_amount_cents == 157500 (per-lb class cap 450*350 binds; claimed 200000, item gross 190000, freight cap 247250 all higher)"
            - "OsdCase.${case_id}.status == RESOLVED"
            - "Shipment.${s_id}.osd_hold == false after resolution"

      - name: freight_rating_nested_rounding_order
        grounds:
          - calculations.freight_rating
          - entities.Shipment.fields.rated_amount_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the scaffold pins
          round(linehaul) THEN round(fuel on the rounded linehaul) THEN add integer
          accessorials. For CLASS_85 at 333 lbs: raw linehaul 333/100*2900 = 9657.0 exact;
          raw fuel 9657*0.22 = 2124.54 -> 2125 half-up. A sum-then-round implementation
          computing (9657 + 2124.54) = 11781.54 -> 11782 would diverge in the fuel step,
          producing 11781 total instead of 11782 for a 1-cent-different fuel on other
          weights; here the pinned order yields 11782.
        test_recipe:
          setup:
            - "Shipment CLASS_85, 333 lbs, dims 36x36x36, no accessorials"
          setup_api_calls:
            - { call: "POST /ltl/terminals", payload: { code: "CHI", name: "Chicago", dock_doors: 12 }, as: TerminalAdmin, captures: { t_chi: $.data.id } }
            - { call: "POST /ltl/terminals", payload: { code: "ATL", name: "Atlanta", dock_doors: 10 }, as: TerminalAdmin, captures: { t_atl: $.data.id } }
            - { call: "POST /ltl/shipments", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", nmfc_class: "CLASS_85", actual_weight_lbs: 333, length_in: 36, width_in: 36, height_in: 36, service_standard: "STANDARD" }, as: Dispatcher, captures: { s_id: $.data.id } }
          trigger:
            - { call: "POST /ltl/shipments/${s_id}/rate", payload: {}, as: RatingClerk }
          assert:
            - "Shipment.${s_id}.rated_amount_cents == 11782 (linehaul 9657 + fuel round_half_up(9657*0.22)=2125; fuel computed on rounded linehaul, not on raw product)"

      - name: trailer_utilization_circular_gating
        grounds:
          - calculations.trailer_utilization
          - state_machines.OutboundTrailer.LOADING_to_READY
          - validations[priority=19]
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — mark-ready's precondition reads
          utilization_pct, which is itself recomputed by each manifest-add; the scaffold pins
          evaluation order (manifest ledger update -> utilization recompute -> gate check).
          After shipment A alone (4000 lbs / 512 cuft on 10000 lb / 2000 cuft trailer) the gate
          reads 40.0% and rejects; adding B (2500 lbs / 80 cuft) lifts the weight-binding
          utilization to 65.0% and the same mark-ready call succeeds.
        test_recipe:
          setup:
            - "Trailer max_weight 10000 lbs, max_cube 2000 cuft, destination ATL"
            - "Shipment A: 4000 lbs dims 96x96x96 (cube 512); Shipment B: 2500 lbs dims 60x48x48 (cube 80); both RATED, ON_DOCK"
          setup_api_calls:
            - { call: "POST /ltl/terminals", payload: { code: "CHI", name: "Chicago", dock_doors: 12 }, as: TerminalAdmin, captures: { t_chi: $.data.id } }
            - { call: "POST /ltl/terminals", payload: { code: "ATL", name: "Atlanta", dock_doors: 10 }, as: TerminalAdmin, captures: { t_atl: $.data.id } }
            - { call: "POST /ltl/dock-doors", payload: { terminal_id: "${t_chi}", door_number: 23, door_kind: "OUTBOUND" }, as: DockSupervisor, captures: { door_id: $.data.id } }
            - { call: "POST /ltl/trailers", payload: { terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", outbound_door_id: "${door_id}", max_weight_lbs: 10000, max_cube_cuft: 2000 }, as: DockSupervisor, captures: { tr_id: $.data.id, tr_v0: $.data.version } }
            - { call: "POST /ltl/shipments", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", nmfc_class: "CLASS_60", actual_weight_lbs: 4000, length_in: 96, width_in: 96, height_in: 96, service_standard: "STANDARD" }, as: Dispatcher, captures: { s_a: $.data.id } }
            - { call: "POST /ltl/shipments", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", nmfc_class: "CLASS_60", actual_weight_lbs: 2500, length_in: 60, width_in: 48, height_in: 48, service_standard: "STANDARD" }, as: Dispatcher, captures: { s_b: $.data.id } }
            - { call: "POST /ltl/shipments/${s_a}/rate", payload: {}, as: RatingClerk }
            - { call: "POST /ltl/shipments/${s_b}/rate", payload: {}, as: RatingClerk }
            - { call: "POST /ltl/pickup-routes", payload: { terminal_id: "${t_chi}", route_date: "2026-08-01", driver_id: "DRV-7", shift_start_minute: 480, shift_end_minute: 1020 }, as: Dispatcher, captures: { r_id: $.data.id } }
            - { call: "POST /ltl/pickup-stops", payload: { route_id: "${r_id}", shipment_id: "${s_a}", stop_sequence: 1, planned_arrival_minute: 540 }, as: Dispatcher, captures: { stop_a: $.data.id } }
            - { call: "POST /ltl/pickup-stops", payload: { route_id: "${r_id}", shipment_id: "${s_b}", stop_sequence: 2, planned_arrival_minute: 560 }, as: Dispatcher, captures: { stop_b: $.data.id } }
            - { call: "POST /ltl/pickup-routes/${r_id}/dispatch", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/pickup-stops/${stop_a}/arrive", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/pickup-stops/${stop_a}/complete", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/pickup-stops/${stop_b}/arrive", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/pickup-stops/${stop_b}/complete", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/trailers/${tr_id}/manifest-entries", payload: { shipment_id: "${s_a}", load_position: 1, expected_trailer_version: "${tr_v0}" }, as: DockSupervisor }
            - { call: "GET /ltl/trailers/${tr_id}", payload: {}, as: DockSupervisor, captures: { tr_v1: $.data.version } }
          trigger:
            - { call: "POST /ltl/trailers/${tr_id}/mark-ready", payload: {}, as: DockSupervisor, captures: { err1: $.data.error_id } }
            - { call: "POST /ltl/trailers/${tr_id}/manifest-entries", payload: { shipment_id: "${s_b}", load_position: 2, expected_trailer_version: "${tr_v1}" }, as: DockSupervisor }
            - { call: "POST /ltl/trailers/${tr_id}/mark-ready", payload: {}, as: DockSupervisor }
          assert:
            - "First mark-ready rejected: ${err1} == ERR_TRAILER_NOT_LOADABLE (utilization 40.0 < 60.0 with only A manifested)"
            - "OutboundTrailer.${tr_id}.loaded_weight_lbs == 6500 and loaded_cube_cuft == 592 after adding B"
            - "OutboundTrailer.${tr_id}.utilization_pct == 65.0 (weight-binding: max(6500/10000, 592/2000)*100)"
            - "Second mark-ready succeeds: OutboundTrailer.${tr_id}.posture == READY"

  # =====================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: shipment_rating_reinspection_cycle
        grounds:
          - state_machines.Shipment.RERATED_to_INSPECTION_PENDING
          - state_machines.Shipment.INSPECTION_PENDING_to_RATED
        distinguishing_aspect: |
          Cycle on Shipment.rating_status: RATED -> INSPECTION_PENDING -> RERATED ->
          INSPECTION_PENDING (re-inspection) and INSPECTION_PENDING -> RATED (reject path)
          form two distinct loops on the rating dimension, independent of the handling_status
          dimension advancing underneath — parallel state dimensions on one entity.
        test_recipe:
          setup:
            - "Shipment CLASS_70 450 lbs rated; first scan 60x48x50/430 confirmed reclass to CLASS_70 (RERATED)"
            - "Second scan 48x40x48/455 exists for the re-inspection"
          setup_api_calls:
            - { call: "POST /ltl/terminals", payload: { code: "CHI", name: "Chicago", dock_doors: 12 }, as: TerminalAdmin, captures: { t_chi: $.data.id } }
            - { call: "POST /ltl/terminals", payload: { code: "ATL", name: "Atlanta", dock_doors: 10 }, as: TerminalAdmin, captures: { t_atl: $.data.id } }
            - { call: "POST /ltl/shipments", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", nmfc_class: "CLASS_70", actual_weight_lbs: 450, length_in: 48, width_in: 40, height_in: 48, service_standard: "STANDARD" }, as: Dispatcher, captures: { s_id: $.data.id } }
            - { call: "POST /ltl/shipments/${s_id}/rate", payload: {}, as: RatingClerk }
            - { call: "POST /ltl/dimensioner-scans", payload: { shipment_id: "${s_id}", measured_length_in: 60, measured_width_in: 48, measured_height_in: 50, measured_weight_lbs: 430 }, as: RatingClerk, captures: { scan1: $.data.id } }
            - { call: "POST /ltl/inspections", payload: { shipment_id: "${s_id}", scan_id: "${scan1}", claimed_nmfc_class: "CLASS_70" }, as: RatingClerk, captures: { insp1: $.data.id } }
            - { call: "POST /ltl/inspections/${insp1}/confirm", payload: {}, as: RatingClerk }
            - { call: "POST /ltl/dimensioner-scans", payload: { shipment_id: "${s_id}", measured_length_in: 48, measured_width_in: 40, measured_height_in: 48, measured_weight_lbs: 455 }, as: RatingClerk, captures: { scan2: $.data.id } }
          trigger:
            - { call: "POST /ltl/inspections", payload: { shipment_id: "${s_id}", scan_id: "${scan2}", claimed_nmfc_class: "CLASS_85" }, as: RatingClerk, captures: { insp2: $.data.id } }
            - { call: "POST /ltl/inspections/${insp2}/reject", payload: {}, as: RatingClerk }
          assert:
            - "Second inspection opens from rating_status == RERATED (cycle re-entry), moving it back to INSPECTION_PENDING"
            - "After reject: Shipment.${s_id}.rating_status == RATED (reject loop) with Inspection.${insp2}.adjustment_cents == 0"
            - "Reject restores the declared basis: Shipment.${s_id}.chargeable_weight_lbs == 450 and dim_weight_lbs == 0 (not the scan's 455/480 values)"

      - name: outbound_trailer_posture_reopen_cycle
        grounds:
          - state_machines.OutboundTrailer.READY_to_LOADING
          - state_machines.OutboundTrailer.SEALED_to_LOADING
        distinguishing_aspect: |
          Non-linear revert on OutboundTrailer.posture: LOADING -> READY -> LOADING and
          LOADING -> READY -> SEALED -> LOADING are explicit reopen cycles (not a linear
          pipeline), and reopening re-arms manifest mutations that the sealed gate forbids.
        test_recipe:
          setup:
            - "Trailer READY with one manifested shipment (26000 lbs -> utilization 65.0 on 40000-lb cap)"
          setup_api_calls:
            - { call: "POST /ltl/terminals", payload: { code: "CHI", name: "Chicago", dock_doors: 12 }, as: TerminalAdmin, captures: { t_chi: $.data.id } }
            - { call: "POST /ltl/terminals", payload: { code: "DEN", name: "Denver", dock_doors: 8 }, as: TerminalAdmin, captures: { t_den: $.data.id } }
            - { call: "POST /ltl/dock-doors", payload: { terminal_id: "${t_chi}", door_number: 24, door_kind: "OUTBOUND" }, as: DockSupervisor, captures: { door_id: $.data.id } }
